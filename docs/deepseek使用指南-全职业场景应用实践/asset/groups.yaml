    # 1.2 DeepSeek 的四大核心优势


    在 DeepSeek 发布和火爆全球之前，无论是国内还是国外都已出现了不少优秀的 AI 工具。相比其他 AI 工具，DeepSeek 有四大核心优势：思考很细致、理工科超好、更懂中国人、价格特低。


    # 1.2.1 思考很细致


    如果用做数学题打比方，其他生成式 AI 工具就像凭借直觉猜题的学生，一句“大概、可能、也许是”就把你打发了。用户如果是学霸还好，但如果是学渣，即便 AI 给出的答案是错的，用户也不知道错在哪里。


    而开启了深度思考模式的 DeepSeek 更像在草稿纸上写满推导过程的学生，不但思考得更细致缜密，答案更准确，还能把思考过程展示给你看。如果回答的结果不理想，你可以从它的推理过程中找出问题并帮它进行针对性的纠正。


    比如，你向 DeepSeek 提问“如何用 300 元安排朋友聚餐”，它不会直接给你列出一个餐厅名单，而是用“拆题→列公式→给答案”这样严谨的过程来推导出'
  - '[PAGE 17]


    结果，它的工作过程大概是：


    +   - [ ] 拆分需求（人数 / 口味 / 交通）；

    +   - [ ] 计算成本（餐费 + 交通 <= xx 元，留 xx 元备用）；

    +   - [ ] 生成方案（找餐厅的操作手册 / 动态调整指南 / 整理各类优惠活动）。


    实际思考过程如图 1-1 所示。


    已记录思考 (时长 25 秒)


    好的，用户问的是如何用300元安排朋友聚餐。首先，我需要明确用户的具体需求，用户可能是一位需要组织聚餐的人，预算有限，希望组织经济又能让朋友们满意。可能的情况是朋友聚会，人数可能在4-6人，需要覆盖餐费、交通和其他可能的费用。


    接下来，用户可能没有明确提到的深层需求是希望整个过程顺利，避免尴尬，同时确保大家吃得开心，交通方便，可能还需要考虑不同人口的口味偏好，比如是否有素食者或者对某些食物过敏的情况。


    根据之前的对话历史，用户喜欢直截了当的回答，所以我需要分步骤说明，确保逻辑清晰。同时，用户之前提到DeepSeek的指令式思维，所以回答需要体现分步拆解和详细计算。


    首先拆解问题：预算300元，需要覆盖哪些方面？餐费、交通、可能的备用金。然后确定人数，假设是4-6人，因为300元预算的话，人均50-75元比较合理。接着考虑餐厅选择，要性价比高，可以选择连锁大餐饮或者地道的地方，避免额外交通费用，如果有朋友需要公共交通，可能需要调整交通费用，或者选择大众餐厅方便到达的地点。


    然后，分步骤处理。第一步，确认人数和需求，比如是否有饮食限制。第二步，分配预算，预留备用金，比如280元用于餐费和交通，20元备用。第三步，选择餐厅类型，比如性价比高的中式餐厅或者火锅店，可能团购或者套餐更划算。第四步，安排交通，比如自驾需要考虑停车费，公共交通则计算地铁或公交费用。第五步，制定备选方案，比如天气不好或者餐厅人多时的替代方案。


    需要确保每个步骤都有具体的数据支持，比如人均餐费的计算，交通费用的预估。同时，提供具体例子，比如推荐餐厅类型和可能的餐厅方案，包括推荐餐厅类型和可能的备用方案。最后总结总花费，确保不超过预算，并提醒检查各项细节，如预约、交通路线等。


    可能还需要考虑不同城市的消费水平，但用户没有指定，所以给出一个普遍适用的方案。另外，是否需要喝水？如果包含在餐费中，可能需要调整菜品选择，或者建议自带饮料以节省费用。


    总之，回答要结构清晰，步骤明确，有具体的数据和例子，同时覆盖可能被忽略的细节，如备用金和备选方案，确保用户在实际操作中能顺利执行。


