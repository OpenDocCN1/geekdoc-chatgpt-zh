    # 2.2.2 五大提示词撰写原则


    在学习完万能提示词模板后，下面来学习撰写提示词时需要注意的核心原则。


    # 1. 问题不要宽泛笼统，要具体


    这是因为大模型在处理笼统的问题时，可能会生成过于宽泛的回答，缺乏针对性。例如，如果用户问“介绍人工智能”，模型可能不知道用户需要的是技术细节、历史背景还是应用案例，导致回答不够精准。相反，具体的问题能引导模型聚焦在特定方面，提供更有价值的信息。就像如果你告诉朋友要买咖啡，朋友带回来的可能是美式
    / 拿铁 / 卡布奇诺，但如果你指定了“冰美式大杯，加 1 份浓缩，用燕麦奶”，你就会得到一个更精确的结果。对于 AI 来说，具体问题 = 缩小答案范围 =
    更精准的输出。


    # 2. 使用简洁明了的语言，避免过于复杂模糊的表述


    复杂模糊的表述可能包含冗余信息或产生歧义，令模型抓不住重点，导致模型误解用户的意图。而简洁的指令能减少误解，提高回答的准确性。就像你去餐厅点餐，告诉服务员“请提供一份以禽类胸肉为主要蛋白质来源、采用高温短时加热方式制作的食物，并去除其中的刺激性黏稠状物质”，肯定远不如告诉服务员“要一份香辣鸡腿堡，现炸不要辣酱”。请记住，每增加一个不明所以的修饰词，理解路径就会多分叉一次，AI
    的输出就会离你的预期远一些。


    # 3. 需求要明确


    AI 一般会猜测你的意图，而不是明确你的需求。比如你告诉设计师“做个高大上的 Logo”，设计师就只能按照自己的理解去表现“高大上”这一点，最终的结果可能跟你的期待有很大的差距。所以，在使用
    AI 时，明确的指令 = 减少脑'
