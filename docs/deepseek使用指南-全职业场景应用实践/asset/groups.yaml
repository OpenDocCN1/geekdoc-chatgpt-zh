    以下是关于气象数据清洗方法的总结，包括缺失值填补和异常值检测与处理的方法分类、适用场景及优缺点。


    # 1. 缺失值填补


    方法 1：均值 / 中位数 / 众数填补

    适用场景：数据缺失量较小且分布较为均匀。

    优点：简单易行，计算效率高。

    缺点：可能引入偏差，忽略数据的分布特征。


    方法 2：插值法（如线性插值、时间序列插值）

    适用场景：时间序列数据或连续型数据，缺失值较少且数据呈现趋势性。

    优点：能更好地保留数据的趋势和变化特征。

    缺点：对非线性数据效果不佳，可能引入噪声。


    方法 3：基于机器学习的方法（如 KNN、回归模型）

    适用场景：缺失值较多或数据特征复杂。

    优点：能捕捉数据的非线性关系，填补结果更准确。

    缺点：计算复杂度高，依赖高质量的训练数据。


    # 2. 异常值检测与处理


    方法 1：基于统计的方法（如 3σ 准则、Zscore）

    适用场景：数据分布近似正态分布。

    优点：计算简单，易于实现。

    缺点：对非正态分布数据效果较差，可能误判异常值。


    方法 2：箱线图法（IQR 准则）

    适用场景：数据分布未知或存在偏态。

    优点：对数据分布无严格假设，鲁棒性较强。

    缺点：可能遗漏部分异常值。


    方法 3：基于机器学习的方法（如孤立森林、LOF 算法）

    适用场景：数据特征复杂或异常值模式多样。

    优点：能检测复杂非线性关系中的异常值，适应性强。

    缺点：计算复杂度高，需调整参数。


    方法 4：基于领域知识的人工修正

    适用场景：异常值具有明确的物理意义或领域背景。

    优点：结果更符合实际应用需求。

    缺点：依赖专家经验，处理效率较低。'
