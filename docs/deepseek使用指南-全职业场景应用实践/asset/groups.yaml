    # 7.3 学生心理问题的疏导建议


    本节将使用 DeepSeek 针对学习情绪问题、人际关系困扰问题、学习动力缺乏问题这三类学生心理问题，提供学习心理问题的疏导建议。


    # 7.3.1 学习情绪问题


    针对学习情绪问题，DeepSeek 给出的建议如下。


    提示词：


    当学生出现考试焦虑情绪时，提供一系列放松技巧训练建议，如深呼吸、渐进性肌肉松弛等，以及如何在考试前和考试过程中运用这些技巧。


    输出结果：


    当你感到考试焦虑时，可以尝试以下放松技巧来帮助自己平静下来：


    +   1. 深呼吸练习


    +   □ 腹式呼吸：缓慢吸气 4 秒，让腹部鼓起，屏息 4 秒，然后缓慢呼气 6 秒。

    +   重复几次，直到感到放松。


    +   □ 4-7-8 呼吸法：吸气 4 秒，屏息 7 秒，呼气 8 秒。这个方法有助于降低心

    +   率，缓解紧张。


    +   2. 渐进性肌肉松弛法


    +   □ 从脚到头：依次绷紧并放松身体的每一部分肌肉。例如，先绷紧脚趾 10

    +   秒，然后放松，接着是小腿、大腿，直到头部。


    +   □ 局部放松：如果时间有限，可以专注于放松最紧张的部位，如肩膀或

    +   手部。


    +   3. 正念冥想


    +   □ 专注于呼吸：找一个安静的地方，闭上眼睛，专注于自己的呼吸。当思绪

    +   飘散时，温和地将注意力带回到呼吸上。


    +   □ 身体扫描：从脚开始，逐步关注身体的每一部分，感受其紧张或放松的状

    +   态，帮助自己进入深度放松状态。


    +   4. 积极心理暗示


    +   □ 正面自我对话：告诉自己“我可以做到”或“我已经准备好了”。这种积

    +   极的自我暗示能增强自信心。'
