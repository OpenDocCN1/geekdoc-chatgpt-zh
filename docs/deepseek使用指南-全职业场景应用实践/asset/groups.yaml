    # # 用 DeepSeek 高效政务办公


    一些政府机构的工作人员每天都面临着大量政策性文本、公文及项目方案的处理需求。本章就聚焦于这些需求，为读者介绍如何利用 DeepSeek 高效完成政策文本分析与总结、公文撰写、政府项目方案设计等常见任务。


    # ## 9.1 政策文本分析与总结


    DeepSeek 能够快速解析和总结大量政策文件，提取其中的关键信息和核心要点。这一功能特别适用于需要处理海量政策文本的场景，例如政策法规的整理、行业趋势的分析等。通过自动化处理，政府工作者可以显著提升工作效率，避免手动分析的烦琐和耗时。下面是一些提示词模板（部分政策文件名为虚构，仅供示例使用）。


    # ### 9.1.1 政策要点精准提取


    可以使用 DeepSeek 自动识别政策文件中的核心条款、责任主体和时间节点，并分类、有序地呈现这些信息。


    提示词：

