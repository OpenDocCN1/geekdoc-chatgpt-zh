    \ ] 污染防治责任：\n\n  - 企业责任：企业必须依法处理工业废物，采取防止污染的措施，确保废物处理符合相关法律法规。\n\n  - 合规处理要求：企业需按照相关标准贮存、利用和处置工业废物，避免环境污染。\n\
    \n### 违法处理的法律责任\n\n### 行政处罚：\n\n- [ ] 贮存工业固体废物未采取防护措施：根据新《固废法》，企业可能面临10万元～100万元的罚款。\n\
