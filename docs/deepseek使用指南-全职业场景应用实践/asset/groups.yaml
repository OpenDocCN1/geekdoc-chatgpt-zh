    # 11.1.1 定性研究


    用 DeepSeek 进行定性研究的示例如下。


    **提示词：**

    我正在研究新能源汽车产业链中的电池环节，请帮我搜集国内和国际主流电池厂商的最新定性研究报告，重点关注它们的技术创新方向、战略合作伙伴关系和国际化拓展计划。


