    □美国政治制度的特点：


    +   - 联邦制：中央与地方分权。

    +   - 三权分立：立法、行政、司法三权分立与制衡。

    +   - 总统制：总统既是国家元首又是政府首脑。

    +   - 两党制：民主党和共和党轮流执政。


    2. 案例分析：


