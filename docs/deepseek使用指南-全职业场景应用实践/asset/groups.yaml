    ——陈超 QuestMobile CEO


    作为在 GenAI 一线冲刺的创业者，我深感 DeepSeek 真正将 GenAI 带到了每个中国人的日常生活之中，相信这本兼具实践和学术视野的作品，能够为大家探索
    AI 新时代提供无限灵感。


    ——丁天 数宗科技创始人兼 CEO


    作为 PAAAWOW 的创始人，我深知 AI 工具在现代企业中的重要性。这本关于如何使用 DeepSeek 的新书，深入浅出地讲解了 AI 在各种工作场景中的应用。强烈推荐给每一位希望在
    AI 浪潮中抢占先机的创业者和技术爱好者！


    ——段宇皓 PAAAWOW 宠物智能项圈品牌创始人'
