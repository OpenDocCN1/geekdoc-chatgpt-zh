    活动：


    1. 讲解内容：


    □法国政治制度的形成背景：


    +   - 大革命后，经过多次政体更迭，最终确立了第五共和国宪法。


    □法国政治制度的特点：


    +   - 共和制：总统制与议会制相结合。

    +   - 总统是国家元首，掌握行政权，总理负责领导政府。

    +   - 两院制：国民议会与参议院。

    +   - 多党制：多党联盟执政。


