    输出结果（精简后）：


    - 1. 月球危机：戴森球工程引发太阳系生态失衡（环境伦理）。

    - 2. 基因定向进化：移民局强制改造适应开普勒星的重力参数（人体实验伦理）。

    - 3. 量子永生陷阱：虚拟世界移民计划背后的意识囚禁阴谋（数字生命伦理）。

    - 4. 星际育儿法案：为适应外星环境新生儿基因改造率达 78%（生育伦理）。

    - 5. 记忆清除计划：消除地球记忆引发的文化传承危机（文化伦理）。


    决策：


    选定方向 5，创新点：将敦煌莫高窟数字化工程与记忆清除技术结合，构建“文化抢救者”vs“记忆净化派”的核心冲突。


    ### 2. 世界观构建


    提示词：


    构建三层次科幻设定：①硬核科技（曲率引擎/生态穹顶/神经植入体）；②社会制度（星际公民等级/资源分配算法）；③文化冲突（地球传统节日保护法/外星方言净化运动）。需包含
    2 个颠覆性设定，附科技树演进时间轴。


    输出结果（精简后）：


    【颠覆性设定】


    - 1. 记忆虹吸装置：每移民 1 人需上传 2GB 地球记忆作为“文明税”。

    - 2. 重力驯化症候群：移民三代后产生原生星球排斥反应。


    【科技树】


    2045 年 冬眠舱迭代至第 7 代（生存率 92%）

    2078 年 首次实现半人马座 α 星生物圈模拟


    2103 年“伏羲”量子计算机完成银河系航道计算


    应用：

    将重力驯化症候群发展为关键情节：主角的女儿出现地球重力过敏反应，倒逼主角盗取文明税数据。


    ### 3. 人设开发


    提示词：

    生成主角人物卡：前记忆修复师，现黑市数据猎人。需包含：①三个矛盾特质；②两个特殊技能；③一个致命弱点；④三件标志性物品。要求体现中国元素与科幻特性。


    输出结果（精简后）：

    【林墨】

    矛盾特质：技术诘难／道德模糊、养恋京剧 / 厌恶肉体、精通算法 / 抗拒 AI。

    特殊技能：脑机接口逆向编译、敦煌壁画记忆重构术。

    致命弱点：植入式海马体有 32 秒记忆延迟。

    标志物品：钧窑残片制成的数据密钥、全息京剧脸谱投影仪、改良版北斗定位注射器。


