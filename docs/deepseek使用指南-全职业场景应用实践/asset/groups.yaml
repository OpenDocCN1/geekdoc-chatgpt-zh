    ## 2.3.3 使用 R1 的注意事项


    ### 1. R1 的上下文、输入输出长度仍然有限制


    DeepSeek R1 和其他模型一样，仍然有上下文和输入输出长度的限制。在输入上，举个例子，比如你上传一本约 30 万字的《连城诀》小说给模型学习，它只能读
    20%，也就是 3 万～ 4 万字，但这部分内容也足够回答绝大部分问题了。


    除了输入外，输出的限制显得更加严苛，单次回答基本只能输出 2000 ~ 3000 个汉字，所以对于较长的内容，建议先让 R1 列举出提纲目录，然后依次让 R1
    撰写各个部分的内容。


    另外，对于上下文的限制会让模型在轮次过多的对话中显得“健忘”。聊着聊着，DeepSeek 可能就会忘了最初的对话内容。


    ### 2. R1 的知识库截止时间


    截至 2025 年 2 月 9 日，最新的 R1 知识库截止时间是 2024 年 7 月，使用 R1 的时候需要注意数据截止时间，在不联网搜索的情况下，对于截止时间以后的事情，R1
    会出现幻觉，也就是看起来讲解得头头是道，但实际是完全错误的。


    ### 3. 即便有推理型模型，指令型模型也依然重要


    虽然 R1 这类推理型模型非常好用，但学习指令型模型的提示词依然重要，除了一些方法思路可以借鉴之外，更重要的是它们各有适用场景。推理型模型输出较慢，并且由模型代替了人类的思考过程，在一些需要快速输出或高度按照人类的步骤去执行的场景下，指令型模型会比推理型模型更适用。


