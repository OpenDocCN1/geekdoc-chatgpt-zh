    # 4.1.2 用 DeepSeek 优化 PPT 的进阶操作


    不过，你很快就会发现，虽然生成过程很快，但基本上每页 PPT 都得修改，包括文字、图片以及标题等。在实际工作场景中，更多的是修改原 PPT 标题、完善某页的内容，甚至基于公司模板的内容进行修改等。在这样的场景中，DeepSeek
    的作用更多是辅助优化 PPT，并不能完全作为 PPT 生成工具。


    怎么让 DeepSeek 来辅助优化 PPT 呢？


    在回答这个问题之前，我们需要先了解一下 PPT 的制作流程：


    +   ■ 确立核心。核心，也就是这份 PPT 的主题，而主题最直观的呈现就是 PPT 封面上的标题。你要思考什么样的标题能够更有吸引力，通过标题，你想给受众留下什么印象。比如标题“2025
    年工作展望”与“新征程，新突破”，一样是对未来的表述，后者就比前者更有概括性。


    +   ■ 构建脉络。脉络，对应的是 PPT 的目录。比如，你要思考目录有没有特点，能不能让大家看完目录，对你的内容有记忆点；是使用传统、老套的表述方式，还是列举关键词，帮助大家理解
    PPT 的内容等。比如，目录有 3 条内容，分别是“职场晋升必须具备的三个能力：思考学习能力、业务推进能力、沟通协作能力”，现在如果表述成“职场晋升必须具备的三个能力：Think（思考学习能力）、Operate（业务推进能力）、Partner（沟通协作能力），首字母组成“TOP”。受众用
    TOP 这个单词，很容易就记住了 3 个能力。


    +   ■ 精炼信息。精炼信息，就是把发言稿中的内容尽可能地精简，提炼出要点信息，可以使用结构化表达，用尽可能少的字，涵盖大量的信息。比如，将一份 300
    字的演讲稿精炼成 3 个词。


    +   ■ 整合素材。在制作 PPT 的过程中，经常需要用到各种素材，比如图片、文档、音频、视频等。这些素材（比如图片）的质量参差不齐，通常需要经过处理后才能使用。AI
    工具可以帮助我们处理素材，提升 PPT 的质量。


    +   ■ 优化排版。排版好看的 PPT 会比满篇文字的 PPT 更清晰，很多时候我们很难想到一个合适的版式。有了 AI 工具，可以直接让 AI 生成合适的内容，你只需要把自己的要求发给它即可。


    上面提到的前 3 个步骤——确立核心、构建脉络、精炼信息，是 DeepSeek 擅长的工作。'
