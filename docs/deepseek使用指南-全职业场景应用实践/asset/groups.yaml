    # 2.1.1 默认模型：V3


    直接在对话框中输入你的 Prompt（提示词）就会调用 V3 模型，使用方法和 ChatGPT、Kimi、豆包等一样，优势在于快。


    当你的任务很简单时，使用默认的模型就可以。


    举个例子，如果你只是想让 DeepSeek 回答“1+1 等于几”的问题，默认模型就可以快速给你结果。


    如果你的任务涉及复杂的步骤和逻辑关系，更建议使用“深度思考”，也就是 R1 模型来完成。


    # 2.1.2 深度思考模型：R1


    深度思考模型（R1）是 DeepSeek 的核心推理引擎，通过多层逻辑链模拟人类专家级的思维过程。它会自动对问题进行多维度拆解、交叉验证假设、迭代修正结论，最终生成可靠的问题解决方案。


    R1 模型适用于需要复杂推理的场景（如数学证明、策略分析、矛盾问题处理等），其核心特点是具备自我纠偏能力和多步因果推理能力。


    你可以把 R1 模型想象成 DeepSeek 的“超强解题模式”。当遇到特别烧脑的问题时，它会像学霸做压轴题一样，对问题进行拆解、演算、分析和推演。


    +   1）拆解步骤：把大问题切成小问题块，像拼乐高一样逐步解决。


    +   2）反复验算：像做完数学题回头检查那样，自动验证每个环节是否合理。


    +   3）多角度分析：同时用不同方法尝试，比如先试 A 方案，发现漏洞后再换 B 方案。


    +   4）深度推演：会追问“如果……那么……”，像下棋高手那样预判后续发展。


    比如你要策划旅行攻略，普通模式可能直接给出景点列表，但 R1 模型会：①先问预算 / 天数 / 兴趣；②查天气交通实时数据；③对比不同路线耗时；④预测热门景点排队时间；⑤最后生成带备选方案的详细计划。


    下面我们使用一样的提示词，看看 V3 和 R1 这两种模型的输出结果的区别，如图 2-1 所示。


    提示词：


    我计划 3 月去杭州旅行，帮我制定一份旅行攻略'
