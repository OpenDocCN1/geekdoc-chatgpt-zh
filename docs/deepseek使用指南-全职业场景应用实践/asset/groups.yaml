    \n比如，你向 DeepSeek 提问“如何用 300 元安排朋友聚餐”，它不会直接给你列出一个餐厅名单，而是用“拆题→列公式→给答案”这样严谨的过程来推导出结果，它的工作过程大概是：\n\
