    ## 2.3.2 R1 的提示词使用技巧


    ### 1. 总捧提示词模板，表达清楚自己的需求


    在介绍 V3 时，我们介绍了各式各样的提示词技巧，但在 R1 中，需要有一种“返璞归真”的魅力，忘掉所有的提示词技巧，直接告诉 AI 你想干什么事儿、想要什么结果，就够了。


    在 R1 之前的指令模型，用户需要事无巨细地交代流程，AI 才能明白怎么做，也就诞生了很多提示词模板，甚至出现了很多提示词工程师。写好一个专业的提示词是比较困难的事情，比如结构化提示词。但对于
    R1 模型来说，如果事无巨细地交代所有细节，反而会抑制模型的创造力，相比于定义完整的模型工作过程，定义你想要模型完成的需求目标更加重要。


    ### 2. R1 推荐的提示词结构


    在使用 R1 时，虽然完全没必要使用长段的结构化提示词，但也可以用一些简单的提示词结构，例如下面的三要素结构：


    - 背景：上下文信息。不论是推理型模型，还是指令型模型，都需要上下文信息。有了上下文信息，才能让 AI 生成和你的需求有关的内容。对于专业知识背景的相关内容，也可以以附件的形式提供。


    - 需求：你想做什么事。直接表达清楚自己的需求，这是用好 R1 的核心技能。


    - 要求：需要满足什么，不满足什么。主要描述 AI 如何满足你的需求，比如你想要什么样的格式（表格、代码、Markdown 等），或什么样的风格（文言文、白话文等）等。


    下面看一个典型的应用案例，提示词：


    我现在计划在小红书上经营一个美妆领域的账号，做一个美妆博主，类型是露脸拍短视频，帮我设计一下口播文案。


    要求：


    - 1）我想要 3 组标题，每个标题都对应一条 90 秒以内可以播完的文案。


    - 2）用“过来人”的语气。


    - 3）结尾引导评论区互动。


    输出结果：


    标题 1：《新手必看！这 3 个显脸雷区我踩过的坑你别再踩》


    (背景音效：卸妆水喷洒声)


    “姐妹们听我说！三年前我刚学化妆时，画完像被家暴（苦笑）……后来才发现是这三个显脸陷阱：①粉底液直接怼脸上拍？愣！先拿指腹揉开再上粉扑！②眼影边界不晕染？恭喜你喜提孤陪空间款火眼金睛！③腮红横着扫？修容都救不了你的发面馒头脸！
    [拿化妆刷示范正确手法] 现在翻我两年前视频对比，评论区告诉我哪个错误你也犯过？”


    ### 标题 2：《不骗人！用对底妆手法工资都涨了 2000 块》


    (背景：办公室场景转场)


    “前年我还是一个粉底斑驳的社畜，直到被主管暗示“注意职场形象”……血泪总结出这套底妆心机：①熬夜黄脸用紫色隔离打底！②粉底混半滴精油再上脸！③定妆喷雾要喷到头顶‘X’型喷！[展示持妆
    8 小时状态]现在客户都夸我‘自带打光板’，升职加薪那天老板说‘形象也是竞争力’。你们觉得妆容会影响工作吗？评论区蹲真实回答！”


    ### 标题 3：《烂脸 5 年才敢说：这些护肤品根本不该同时用！》


    (背景：贴满空瓶的收纳墙)


    “这张脸交过几十万智商税！曾经同时用神仙水＋小棕瓶＋烟酰胺，结果脸烂到去皮肤科……现在才懂：①酸类＋VC＝灼伤警告！②A 醇＋二裂酵母＝无效加班！③敷面膜后直接涂面霜＝闭口开会！[举起成分冲突清单]正在用这些组合的姐妹赶紧停！来个人告诉我你不是最后一个知道的……”


    文案设计逻辑：


    - 痛点共鸣：用自曝黑历史的方式建立信任感。


    - 干货密度：每组 3 个易记知识点，配合视觉演示。


    - 情绪节奏：吐槽→转折→解决方案→价值升华。


    互动设计：预留具象讨论空间（错误 / 经历 / 疑问）。


    建议拍摄时穿居家服增加亲切感，重点步骤用特写镜头，结尾定格在“求互动”的表情动作上，符合小红书用户对“有用又有趣”内容的需求。


    ### 3. 让模型“说人话”，回复会更出彩


    让 DeepSeek 出圈的，是大家一起让 R1 像人一样说话，比如这样的提示词：“解释一下 DeepSeek 的深度思考模型（R1）是什么，说人话”。


    输出结果：


    DeepSeek 的深度思考模型（R1）可以理解为一个“爱琢磨的 AI 大脑”。它和普通 AI 的区别就像“学霸”和“背题机器”——普通 AI 可能直接给你答案，而
    R1 会像人类学霸一样，把问题拆开碎碎，一步步推敲。


    举个例子：如果问“为什么夏天更热？”普通 AI 可能直接回答“因为太阳直射”，但 R1 会这样思考：


    - 先回忆地球公转和自转的知识；


    - 分析南北半球季节差异；


    - 考虑日照时间长短的影响；


    综合大气层、海洋等因素，最后用大白话解释：“就像烤火炉，离得近 + 正对着烤的时间长，自然更热啦！”


    这种“多想几步”的能力，让 R1 特别擅长处理需要逻辑推理的事情，比如解数学题、排查程序 Bug、分析复杂的社会问题。就像有个虚拟的草稿纸，它会自己打草稿验证思路，而不是凭感觉瞎蒙。


    目前这类模型还在进化中，虽然偶尔也会犯傻，但已经能帮忙处理很多烧脑的工作了，比如帮程序员找代码错误、给学生讲题、帮分析师梳理数据规律等。简单来说，DeepSeek
    R1 就是个正在快速成长的“AI 军师”。


    ### 4. 让 R1 模仿特定的语言风格


    让 R1 使用不同的语言风格，甚至模仿一些名人的话语风格等，不需要高深的技巧，只需要在你的提示词中加入“说人话”“模仿【某名人的名字】的风格”等内容即可。


    例如，输入如下提示词：


    请模仿鲁迅的语言风格评判一下人工智能的发展。


    输出结果：


    (以下模仿鲁迅先生冷峻犀利的文风，力求再现其语言特色)


    这人工智能，倒像极了末庄人赶庙会时的光景——起初不过几盏纵糊的灯笼，忽地就涌出满街的霓虹。街坊们仲长脖颈张望，仿佛那铁壳子里当真住着文曲星，却不知自己早成了西洋镜里的影子。


    那些个算法模型，原是吃百家饭长大的。把古今中外的文字嚼碎了咽下去，吐出来的倒像是金玉良言，细看却带着人牙的碎屑。这让我想起绍兴城里的老诊所，熟背律例却专替老爷们做刀笔，如今这人工智能，怕不是又要造出千百个电子师爷来？


    资本家的算盘珠子拨得震天响，说什么“造福人类”，倒像是赵大爷举着《三民主义》的幌子收租子。工人们前脚刚躲过蒸汽机的铁拳，后脚又被数据流捆住了手脚，连最后那点子手艺活计，也要叫机器学了去当捉名状。


    最可怖的是那些个后生，捧着个方匣子便以为得了通天的梯子。眼睛盯着虚妄的幻影，手指头在虚空里比划，倒把活生生的人情冷暖都当成了旧年历。这人工智能若真成了精，怕是要笑然：原以为造了个新式算盘，怎料反把自己算进了铁笼子？


    依我看，这人工智能倒像极了阿 Q 画的圆圈——起笔时满心想着圆满，收笔时终究是个歪斜的囚牢。只是这回画圈的笔，攥在谁人手里？那画不圆的缺口，又该向何处寻？


    ## 2.3.3 使用 R1 的注意事项


    ### 1. R1 的上下文、输入输出长度仍然有限制


    DeepSeek R1 和其他模型一样，仍然有上下文和输入输出长度的限制。在输入上，举个例子，比如你上传一本约 30 万字的《连城诀》小说给模型学习，它只能读
    20%，也就是 3 万～ 4 万字，但这部分内容也足够回答绝大部分问题了。


    除了输入外，输出的限制显得更加严苛，单次回答基本只能输出 2000 ~ 3000 个汉字，所以对于较长的内容，建议先让 R1 列举出提纲目录，然后依次让 R1
    撰写各个部分的内容。


    另外，对于上下文的限制会让模型在轮次过多的对话中显得“健忘”。聊着聊着，DeepSeek 可能就会忘了最初的对话内容。


    ### 2. R1 的知识库截止时间


    截至 2025 年 2 月 9 日，最新的 R1 知识库截止时间是 2024 年 7 月，使用 R1 的时候需要注意数据截止时间，在不联网搜索的情况下，对于截止时间以后的事情，R1
    会出现幻觉，也就是看起来讲解得头头是道，但实际是完全错误的。


    ### 3. 即便有推理型模型，指令型模型也依然重要


    虽然 R1 这类推理型模型非常好用，但学习指令型模型的提示词依然重要，除了一些方法思路可以借鉴之外，更重要的是它们各有适用场景。推理型模型输出较慢，并且由模型代替了人类的思考过程，在一些需要快速输出或高度按照人类的步骤去执行的场景下，指令型模型会比推理型模型更适用。


