    # 2. 模仿创作文案


    在进行文案创作时，模仿是一个常用的手法。那么，如何用 DeepSeek 来模仿创作一篇文案呢？


    我们要先来学习一个概念——投喂。投喂，基于的是 DeepSeek 非常强大的学习能力。


    给 AI 提供一定的样本，AI 能够更好地学习和理解，最后给我们想要的内容，通俗地讲，投喂就是“给 AI 打个样”。打个比方，我们无法向一个孩子解释清楚什么是苹果，但只要给孩子看一张苹果照片，告诉孩子这就是苹果，他就会记住。


    同样，如果向 DeepSeek 投喂一篇范文，它就可以更好地进行二次创作。那么，怎么才能让 DeepSeek 模仿得更像？


