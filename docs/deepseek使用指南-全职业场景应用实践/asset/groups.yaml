    +   - 接受不确定性：提醒自己，考试只是检验学习成果的一部分，尽力而为即可。


    # ## 5. 考试前的准备


    +   - 时间管理：在考试前，合理规划时间，确保每个部分都有足够的答题时间。


    +   - 模拟练习：提前模拟考试环境，帮助自己适应紧张氛围，减少陌生感。


    # ## 6. 考试中的技巧


    +   - 专注当下：遇到难题时，先跳过，稍后再回来思考。不要让某一道题影响整体发挥。


    +   - 短暂休息：如果感到紧张，可以暂时停下来，闭目养神或做几次深呼吸。


    通过这些技巧，你可以在考试前和考试中更好地管理自己的情绪，保持冷静和专注。记住，焦虑是正常的，但通过练习和准备，你可以更好地应对它。祝你考试顺利！


    # ## 7.3.2 人际关系困扰问题


    针对人际关系困扰问题，DeepSeek 给出的建议如下。


    # ### 提示词：


    学生在与同学的相处中出现矛盾，如被孤立，提供沟通技巧培训建议，教导学生如何主动沟通、表达自己的感受和需求，以及如何倾听他人的意见。


    # ### 输出结果：


    学生在与同学的相处中出现矛盾，比如被孤立时，可以通过以下沟通技巧来改善关系，主动沟通并表达自己的感受和需求：


    # #### 1. 主动沟通


    +   - 建立联系：主动向同学打招呼、微笑，表现出友好和开放的态度。例如，可以说：“你好，今天过得怎么样？”


    +   - 参与活动：积极参加班级活动或小组讨论，主动表达自己的观点，展示自己的兴趣和想法。


    # #### 2. 倾听他人


    +   - 专注倾听：在与同学交流时，专注于对方的说话内容，避免打断或急于表达自己。


    +   - 回应反馈：通过点头、微笑或简单的回应（如“嗯，我明白了你的意思”）来表示你在认真听。'
