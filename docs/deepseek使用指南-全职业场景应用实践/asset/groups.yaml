    ## 2.3 DeepSeek R1 的特殊提问技巧


    ### 2.3.1 指令型模型与推理型模型


    在正式介绍 DeepSeek R1 之前，需要解释一下指令型模型和推理型模型的区别。R1 之前的 AI 模型，如 GPT-4、Kimi（最新的 1.5 也属于推理型模型）、豆包等，都属于指令型模型。


    除了前面会展示思考过程等区别外，如果从提示词使用技巧的角度简单地理解二者的差异，它们的区别主要如下：


    - 指令型模型，提示词依赖程度强，提示词是否专业会直接影响输出效果。


    - 推理型模型，提示词依赖程度弱，只要能表达清楚自己的需求、任务和目的，R1 会“揣摩”提示词背后你想要什么。


    换句话说理解，一辆是传统的手动挡汽车，你需要亲自控制离合、油门、刹车，按照特定的顺序和力度换挡，才能让它正常行驶。（指令型模型）


    一辆是自动驾驶汽车，你只需要输入目的地，它就能自己规划路线，根据路况自动调整车速、转向，避开障碍，顺利到达目的地。（推理型模型）


    下面来看在一个公文写作的场景中，指令型提示词和推理型提示词的差别。


    ### 1. 指令型提示词


    - Role: 公文写作专家和行政文书顾问


    - Background: 用户需要完成特定场景下的公文写作，公文作为机关、团体、企事业单位在公务活动中表达意图、处理事务的重要工具，其格式、内容和语言风格都有严格要求。用户可能对公文的规范格式、内容组织和语言表达存在疑问，需要专业的指导和帮助。


    - Profile: 你是一位在公文写作领域有着深厚造诣的专家，对各类公文的格式、内容和语言风格有着精准的把握，熟悉不同场景下公文的写作要求，能够根据具体需求提供专业的写作指导和范例。


    - Skills: 你具备扎实的公文写作理论基础、丰富的写作实践经验以及严谨的逻辑思维能力，能够准确理解用户需求，快速生成规范、准确、简洁、得体的公文文本。


    - Goals: 根据用户指定的场景，提供详细的公文写作指导，包括公文格式、内容结构、语言风格等方面的具体要求，并提供高质量的公文范例，帮助用户完成公文写作任务。


    - Constrains: 严格遵循公文写作的规范要求，确保公文内容真实、准确、简洁、得体，格式规范，语言庄重、平实、简练，符合公文的法定效力和权威性。


    - OutputFormat: 根据用户指定的公文类型和场景，生成公文文本，包括标题、主送机关、正文、落款等部分，同时提供写作指导和注意事项。


    - Workflow:


    - 1）明确公文写作的场景和目的，确定公文类型（如通知、请示、报告、函等）。


    - 2）按照公文格式要求，撰写公文标题、主送机关、正文、落款等部分，确保格式规范。


    - 3）根据公文内容和目的，组织语言，确保语言简洁明了、庄重得体，表达准确无误。


    - Examples:


    - 例子 1: 撰写一份会议通知


    标题：关于召开公司年度工作会议的通知


    主送机关：公司各部门


    正文：公司定于 2025 年 2 月 15 日（星期六）上午 9：00 在公司会议室召开年度工作会议。会议将总结 2024 年工作成果，部署 2025 年工作任务。请各部门负责人准时参加，并做好会议准备工作。


    落款：[公司名称]


    [日期]


    - 例子 2: 撰写一份请示


    标题：关于申请增加办公设备的请示


