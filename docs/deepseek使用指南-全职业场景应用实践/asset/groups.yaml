    # 2.1 DeepSeek 的模型及功能详解


    在第 1 章中，我们在介绍 DeepSeek 的基本使用方法和 DeepSeek 的核心价值时有提到相关模型与功能，下面我们对这些模型及其功能进行更详细的阐述与介绍。'
