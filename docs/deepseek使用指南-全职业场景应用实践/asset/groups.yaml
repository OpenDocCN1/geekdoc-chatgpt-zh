    \ AI 护栏”。\n\n真正的突破在半年后到来。2024 年春天，DeepSeek 推出了一款“既聪明又实惠”的 AI 大脑 DeepSeek V2。这个模型虽然体型庞大，但运行成本只有同类产品的\
    \ 10%——就像造出了省油 90% 的超级跑车，秘诀在于工程师们发明的“智能模块组合技术”：每次处理问题时，系统会自动挑选最合适的两个专家模块协同工作，既保持高水平表现，又大幅节省算力消耗。这种源自金融领域“精准投资”理念的设计哲学，让\
    \ AI 技术首次实现了“既要效果强，又要用得起”的目标。\n\nV2 版本后，DeepSeek 仍然在以令人目眩的速度迭代进化：先是推出了性能媲美国际顶尖水平但训练成本大大降低的升级版模型\
    \ V3，接着又发布了能像人类一样推理理解题的智能增强版本 R1。最让业界震撼的是，这些技术突破全部以开源形式向公众开放，就像把“AI 发动机”的设计图纸免费共享一样。全球开发者迅速聚集到\
    \ DeepSeek 的生态中，他们用这些基础模型开发出来的应用，将惠及更多人。\n\n2025 年 1 月 27 日，DeepSeek 应用在苹果 App\
    \ Store 中国区和美国区的免费榜上双双登顶，超越了 ChatGPT、Meta 公司旗下的社交媒体平台 Threads，以及 Google Gemini、Microsoft\
    \ Copilot 等美国科技公司的生成式 AI 产品。这一成就不仅标志着 DeepSeek 在全球 AI 市场的崛起，也引发了行业内外的广泛关注。\n\n\
    微软 CEO 萨蒂亚·纳德拉在瑞士达沃斯世界经济论坛上表示：“看到 DeepSeek 的新模型，真的令人印象非常深刻。他们切实有效地开发出了一款开源模型，它在推理计算方面表现出色，且超级计算效率极高。”\n\
    \n“我们必须非常非常认真地对待中国的这些进展。”纳德拉说。\n\n可以说，DeepSeek 始于金融科技的创新之路，在开源 AI 的星辰大海中，找到了更辽阔的坐标系，未来也必将为中国\
    \ AI 领域的发展创造更多惊喜。表 1-1 展示了 DeepSeek 发展历程中的重要事件。\n\n### 表 1-1 DeepSeek 发展历程中的重要事件\n\
