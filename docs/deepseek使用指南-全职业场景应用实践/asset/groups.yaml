    - ■ 性格特点：聪明绝顶，但因家族没落而心怀自卑。她对蒸汽动力的热爱与对现实的无力感形成鲜明对比，常因身体虚弱而无法完成高强度研究。

    - ■ 特殊能力：能够通过特殊装置将自身的灵力转化为蒸汽动力，但代价是极大的体力消耗。

