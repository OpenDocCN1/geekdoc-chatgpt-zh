    ## 2.2 DeepSeek V3 的基础提问技巧


    在本节中，将针对 DeepSeek V3 模型，介绍它所适用的传统提示词技巧。


    ### 2.2.1 万能提问模板


    在正式学习提示词提问技巧前，可以先学习一个简单易上手的万能提示词模板，通过提示词模板的框架，可以更好地帮助我们构思如何向 AI 表达需求。这个万能提示词模板将提示词分为
    4 个部分，分别是：角色、背景、任务、要求。


    - 角色：指的是让 AI 扮演什么样的角色，站在角色的角度组织输出文本。

    - 背景：具体的场景和细节，明确 AI 需要给出的回复是建立在什么样的情境下的。

    - 任务：AI 需要完成什么任务。

    - 要求：AI 输出的内容需要满足什么条件，不要出现什么内容。


    在使用上述提示词模板时，你需要想象自己是一家公司的老板，要给新员工布置任务。这种情况下，你肯定不会只说“做个方案”，而是会先说明“你作为市场总监（角色），现在要开拓上海年轻白领的咖啡市场（背景），本周五前提交
    3 个联名营销方案（任务），方案要包含成本预算和效果预估，不要涉及明星代言（要求）”。同理，用提示词模板和 AI 沟通时也是这样四步走。


    先给 AI“戴帽子”（角色），明确它的身份，就像给不同部门的员工分配工作，AI 会切换对应的“技能包”和说话方式。


    设定具体场景（背景）：说清时间、地点、对象等细节。比如“给 00 后大学生写抖音口播文案”和“给中年企业家写发布会演讲稿”，AI 会根据场景自动调整语言风格。


    布置明确动作（任务）：可以用动词 + 数字 + 结果的形式，比如“列出 5 个春节家宴菜单”“生成 3 段对话式广告开场白”。任务要像 KPI 一样具体可执行，避免出现“写点有意思的”这种模糊要求。


    划出工作边界（要求）：就像告诉设计师“主色调用蓝白，不要卡通元素”一样，比如“用表格形式”“每点不超过 20 字”“避免专业术语”，这些约束会让输出更符合你的使用场景。


    下面我们来看一个实例，提示词如下：


    假如你是一名导游（角色），你正在带领一个旅游团到北京旅游，旅游地点需要包含故宫、长城和颐和园。因为是公司年会后的旅游团，所以希望行程安排得比较轻松（背景），请你帮我设计一个
    3 天的行程（任务），用表格方式输出，表格中只包含每天上午、下午的行程即可（要求）。


    DeepSeek 的输出结果如图 2-2 所示，非常简洁明了。


    | 天数 | 上午行程 | 下午行程 |

    |---|---|---|

    | 第一天 | 抵达北京，入住酒店，稍作休息 | 游览故宫，感受皇家气派 |

    | 第二天 | 前往长城，轻松徒步，欣赏壮丽景色 | 返回市区，自由活动或购物 |

    | 第三天 | 游览颐和园，漫步昆湖，享受宁静 | 结束行程，前往机场或火车站返程 |


    这个行程安排旨在让游客在轻松的氛围中体验北京的历史文化和自然风光，同时留有足够的自由活动时间，以满足不同游客的需求。


