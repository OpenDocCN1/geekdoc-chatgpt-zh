    # 第一步：情报收集（5 分钟）


    +   1. 群发微信确认：人数（假设 5 人）、忌口（比如 1 人不吃辣）、特殊需求（是否有要赶末班车的）

    +   2. 打开地图 App：圈定所有人地铁 1 小时内能到达的商圈


