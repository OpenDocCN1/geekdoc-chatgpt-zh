    \n### 2. 固态电池\n\n### 发展现状\n\n固态电池使用固态电解质替代液态电解质，具有更高的能量密度和安全性。\n\n2025 年将是固态电池商业化落地的关键节点，半固态电池技术将率先搭载于高端电动车型，能量密度突破\
