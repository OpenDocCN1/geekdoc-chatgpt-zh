    # 5. 使用结构化的提示词


    就像我们写论文，为了让文章结构更清晰，需要从研究背景、文献综述、研究方法、研究结果、讨论与结论等方面进行撰写，将提示词用这种结构化的方式呈现，也可以让 DeepSeek
    更清晰地理解你的需求。前面提到的万能提示词模板，其实就是一种结构化提示词的撰写方式，下面呈现一种更复杂的提示词结构，综合了前面提到的绝大部分技巧。


    +   Role (角色定位)：明确你的身份和职责，让用户了解你将扮演的角色以及你能提供的帮助或服务。


    +   Background (背景信息)：说明用户的需求、场景或目标，为后续的任务提供背景和方向。


    +   Profile (个人简介)：描述你的专业背景或能力，让用户相信你具备完成任务的资格和经验。


    +   Skills (技能特点)：列出你擅长的技能或能力，说明你如何满足用户的需求或完成任务。


