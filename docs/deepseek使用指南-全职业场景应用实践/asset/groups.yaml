    ### 1. 获取灵感与构思


    ### (1) 解答问题


    你可以通过向模型提问，获取关于情感表达、意象选择等方面问题的答案。


    收到答案后，可以将答案与个人体验相结合，创作出更具深度和独特性的作品。


