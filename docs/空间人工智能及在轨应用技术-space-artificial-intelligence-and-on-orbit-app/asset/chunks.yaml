    传统的二值连通域标记算法采用全局深度优先遍历方法，当图片的幅宽较大时，会导致算法无效搜索过多，严重降低了算法的实时性。通过对等价对的排序、搜索阈值的提取和保存等预处理，将深度优先遍历的循环搜索次数优化，摒弃了无效搜索操作，提高了算法的实时性。同时，该算法对图像进行全并行流水处理，可以部署在FPGA等可编程逻辑电路器件中，实现在资源有限的集成器件上快速实现图像二值连通域标记的应用。特别是在图片幅宽较大、目标稀疏时，该算法性能表现优异，比现有技术效率提高近百倍。


