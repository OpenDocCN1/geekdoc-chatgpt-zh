    ## 2）空间碎片目标检测算法

    根据空间碎片目标的成像特性，设计了一种空间碎片目标在轨实时检测算法，具体流程如图 13-40 所示。


    ### (1) 数据预处理。

    星图中，暗弱小目标淹没在背景噪声中，通过顶帽变换等数据预处理，达到抑制背景噪声，凸显暗弱目标，便于后续算法提取暗弱小目标的目的。其中，顶帽变换主要由 1 组窗大小为
    29×29 和 5×5 的膨胀和腐蚀运算组成。


