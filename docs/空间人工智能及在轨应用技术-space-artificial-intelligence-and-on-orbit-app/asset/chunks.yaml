    ## 2. 硬件平台构建


    ### 1）硬件平台设计

    高性能电子元器件应用一直受限于抗辐照要求的影响。当前一些硬件设计思路只是从处理平台通用性、实时性等方面加以约束要求，系统可靠性和抗辐照性难以满足宇航应用的需求。克服以上缺点，提供了一种应用于遥感目标在轨检测识别的可重构处理平台。


    基于`FPGA`+`DSP`+`GPU`异构处理架构的平台硬件拓扑如图13-7所示。其主要设计思想为：采用`Space VPX`总线标准，各单元板卡使用6U标准结构；充分考虑宇航应用的高可靠、高效能、抗辐照、强容/纠错能力等特点，将该装置分为控制和处理两大部分，控制部分采用高可靠、抗辐照宇航级器件，处理部分采用高性能、大容量常规器件，有效降低成本的同时，提升了可靠性和处理性能；采用网状处理节点设计思路，支持多单元协同处理，扩展性强；支持在轨刷新，提升抗辐照能力，通过各单元主控模块的反熔丝`FPGA`实现处理`FPGA`刷新控制；支持在轨重构更新，且可根据不同任务通过各单元主控模块的反熔丝`FPGA`实现切换不同处理程序，主处理器（处理`FPGA`、`DSP`及`GPU`）均有两种加载方式，通过主控模块的反熔丝`FPGA`实现加载模式控制，应用程序实现了主备份，提升系统可靠性。


    ![](images/txt017_7.jpg "pagenumber_ebook=274,pagenumber_book=263")


    图13-7　基于FPGA+DSP+GPU异构处理架构的平台硬件拓扑


