    #### 7）处理精度

    为验证加速器的处理精度指标，从`ImageNet`数据集中随机抽取 100 幅图片，通过“分类结果”及相应“置信度”两个关键指标作为加速器处理精度的考核对象，将加速器的“分类结果”及“置信度”两种处理结果与`Matlab`采用双精度浮点数据的相应处理结果进行对比，对比结果如图
    12-25～图 12-28 所示。


    由图 12-25 和图 12-26 可知，加速器与`Matlab`分类结果的差值为 0，表明加速器分类结果与`Matlab`的处理结果完全一致。


    由图 12-27 和图 12-28 可知，加速器与`Matlab`分类结果的置信度差值不大于 0.05。由此可证明，本书设计的加速器处理结果的精度与双精度浮点数据处理结果的置信度虽然有一定精度损失，但是不影响最终分类结果，可满足使用要求。


    ![](img/txt016_49.jpg "pagenumber_ebook=253,pagenumber_book=242")


    图 12-25　加速器与`Matlab`分类结果位置分布图


    ![](img/txt016_50.jpg "pagenumber_ebook=253,pagenumber_book=242")


    图 12-26　加速器与`Matlab`分类结果位置差值分布图


    ![](img/txt016_51.jpg "pagenumber_ebook=253,pagenumber_book=242")


    图 12-27　加速器与`Matlab`分类结果置信度分布图（书后附彩插）


    ![](img/txt016_52.jpg "pagenumber_ebook=254,pagenumber_book=243")


    图 12-28　加速器与`Matlab`目标分类置信度差值分布图


    ### 4. 深度学习通用加速器架构设计

    上述加速器主要针对`VGG`及以`VGG`为基础的后续系列的深度学习网络模型，是一个相对通用的加速器。人工智能技术处于一个高速发展时期，各种网络层出不穷，也是各有特点。因此，设计针对深度学习的通用加速器将会很有必要。


    如图 12-29 所示，针对深度学习网络模型的特点，归纳总结深度学习推理网络的基本运算方式，设计了一种通用加速器架构，可完成多种网络加速。该加速器采用 SoC
    处理架构，主要由`CPU`和加速器组成，可通过多种高速串行总线实现互联，扩展能力突出。


