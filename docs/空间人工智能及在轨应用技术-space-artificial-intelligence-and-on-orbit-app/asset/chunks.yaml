    ## 主导卫星

    主导卫星指具备星群规划能力，可选取和指导从属卫星群完成既定观测任务的卫星节点。主导卫星的身份是动态的，由观测任务驱动产生。当某卫星节点接收到地面上注的、在轨自主生成或者星间引导生成的观测任务，如果该任务不能由该卫星节点自己完成，则卫星节点选择自己为该观测任务的主导卫星，并开始在轨自主联合任务规划流程。每个观测任务对应一个主导卫星和一个执行从属卫星群。如果观测任务取消或者完成，则对应的主导卫星和从属卫星的身份中止；如果任务执行过程中主导卫星失效，可将主导卫星的身份动态转移给其他卫星。


    主导卫星具有一般从属卫星的功能。此外，主导卫星作为星群联合规划的发起者和管理者，还具备以下功能：任务清单自主筹划、发起天基资源匹配、天基资源匹配结果评估、从属星群动态选择和管理、多星联合任务规划、下发从属星任务规划方案、任务执行状态监视、执行结果融合与分发等。


    ## 从属卫星

    从属卫星指由主导卫星选取产生，配合主导卫星完成特定观测任务的卫星节点。对于每个特定的观测任务主导卫星可能会选取一个或多个从属卫星，选取结果由天基资源匹配的结果确定。从属卫星接收由主导卫星下发的任务规划方案，动态向主导卫星反馈任务执行状态；从属卫星的身份也是动态的，如果观测任务取消或者完成，则从属卫星的身份中止；如果该卫星失效，从属卫星身份可动态转移给其他卫星。


    从属卫星具备自主任务生成、任务管理与执行、任务资源自主匹配、单星任务规划、任务执行状态反馈、星上实时状态评估、在轨实时图像处理、全网信息同步更新等功能。


    ## 天基信息网

    天基信息网是由北斗导航卫星和中继通信卫星构成的可互联互通的天基骨干网络，为自主联合任务规划系统中的业务星提供网络接入服务，可支持短报文、相控阵、激光网络等多种星间链路接入服务。基于天基信息网络，业务卫星可完成中继测控、中继数传、天基资源自主匹配、全网动态同步更新等功能。


    ## 地面联合任务规划管控中心

    地面管控中心主要负责向业务卫星上注任务，接收业务卫星下传的任务执行状态以及获取的态势数据并进行同步，调配地面数传资源接收卫星下传的观测数据，进行态势和情报分析并分发给其他用户。


    ## 在轨自主联合任务规划体系架构模型

    为满足天基资源支持陆海战场态势感知与战术应用需求，适应在轨多星自主协同和在轨任务自主筹划的需求，在轨自主联合任务规划技术体系涉及应用需求、服务对象、资源维护及控制、应用模式分析匹配、以任务为中心的资源调度、面向任务的多星自主协同规划、系统操作控制、系统应用仿真及效能评估等诸多方面。因此，以直接支持作战应用需求为牵引和驱动，以满足任务需求和提高系统使用效能为发展目标，重点针对在轨系统的发展需求，设计了包含系统执行层、实时监控层、单星规划调度层、星间协商层、在轨自主联合任务规划层在内的功能完备、技术先进、体系健全、体制统一、功能可扩展的在轨多层技术体制框架，具体如图13-51所示。


