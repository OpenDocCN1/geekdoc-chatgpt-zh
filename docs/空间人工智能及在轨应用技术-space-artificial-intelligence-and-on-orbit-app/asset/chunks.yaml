    ![](images/txt016_48.jpg "pagenumber_ebook=252,pagenumber_book=241")


    图12-24　验证加速器的分类结果3


    7）处理精度


    为验证加速器的处理精度指标，从ImageNet数据集中随机抽取100幅图片，通过“分类结果”及相应“置信度”两个关键指标作为加速器处理精度的考核对象，将加速器的“分类结果”及“置信度”两种处理结果与Matlab采用双精度浮点数据的相应处理结果进行对比，对比结果如图12-25～图12-28所示。


    由图12-25和图12-26可知，加速器与Matlab分类结果的差值为0，表明加速器分类结果与Matlab的处理结果完全一致。


    由图12-27和图12-28可知，加速器与Matlab分类结果的置信度差值不大于0.05。由此可证明，本书设计的加速器处理结果的精度与双精度浮点数据处理结果的置信度虽然有一定精度损失，但是不影响最终分类结果，可满足使用要求。


    ![](images/txt016_49.jpg "pagenumber_ebook=253,pagenumber_book=242")


    图12-25　加速器与Matlab分类结果位置分布图


    ![](images/txt016_50.jpg "pagenumber_ebook=253,pagenumber_book=242")


