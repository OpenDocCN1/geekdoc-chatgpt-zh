    ## 星地一体交互方式研究

    在传统的管控模式下，针对作战用户的侦测任务，地面系统进行统一的任务规划后，将指令上注给卫星执行，卫星只是作为被动的侦测工具，即“地面决策，在轨执行”的模式。在轨具备自主联合规划能力后，为了实现对智能卫星的高效利用，使其能更好地服务于战役战术需求，需要设计新的管控模式，改变管控系统对作战用户的服务模式。任务来源不只地面系统，还包括星间引导、在轨自主生成任务，卫星需要与地面共同对任务进行规划决策，实现任务的快速响应。对地面接收的任务，需要在轨具备自主决策的能力，即地面和在轨协同完成作战任务的管控问题。针对星地资源、计算能力不同等特点，明确星、地在管控系统中承担的角色与任务。


    ### 星地协同机制

    构建星地协同机制，地面将用户需求上注卫星，星上通过地面上注、在轨自主生成任务与星间引导任务触发自主决策与规划调度，并适时通过各种通信手段下传任务状态信息，地面安排数据接收并对任务规划方案进行同步，星上下传遥测数据与目标观测数据，地面仿真星地一体任务规划过程，保持星地同步，具体运行流程如下：


    ①地面管控中心收集用户需求，并上注给卫星；星上进行任务分析筹划，协同任务规划，负责产生初始规划方案；星上同样还需要处理自主产生的临时任务、引导任务以及出现故障时需要星间调配的任务。


    这样，以期可以提高响应速度，增强对突发任务的处理能力，降低对测控资源的依赖，减轻地面测控负担。“自主产生的临时任务”一方面包括在轨图像分析，发现新的高价值目标，另一方面包括本星电子与微波载荷间互引导或他星对该目标的协同引导任务。“出现故障时要求星间调配的任务”是指某侦测任务由于卫星平台、载荷能力等原因暂时不能执行，产生本星及星间的任务调整需求。无论何种任务调整，均须尽快将调整结果下传至地面系统。


    ②地面系统根据在轨任务规划结果与新产生的任务，进行任务规划结果同步更新，进行任务同步更新，并结合在轨反馈的数传窗口需求信息，进行卫星新增任务的数传规划，安排地面数据接收计划。


    ③地面接收卫星下传的任务执行状态，同步更新任务状态信息，进行任务状态监视与闭环管理。


    ④地面接收卫星下传的目标信息，进行目标与任务同步，实现目标态势更新。


    ⑤地面通过上注指令的方式更新在轨搭载的各类算法库、目标库与知识库，保持地面决策分析与任务规划与在轨决策分析与任务规划的一致性。


    ⑥地面对卫星的状态进行仿真，通过接收的遥测数据同步获取卫星的平台和载荷工况信息、在轨资源状态，实现卫星状态同步，进行卫星状态的监视评估。


