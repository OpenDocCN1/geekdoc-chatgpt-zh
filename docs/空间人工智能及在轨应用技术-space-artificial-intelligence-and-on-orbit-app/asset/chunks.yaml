- raw: '除此之外，智能语音交互还可用于智能问答、智能质检、法庭庭审实时记录、实时演讲字幕、访谈录音转写等场景，在金融、司法、电商等多个领域均有应用。但是，智能语音交互中最大的问题在于语义理解，即需要准确地理解用户的对话目的，这无法避免歧义消解问题和未知语言现象的处理问题。


    3.脑机接口


    脑机接口（Brain Computer Interface，BCI），也称为大脑端口，是指在人或动物脑（或脑细胞的培养物）与外部设备创建的实时通信系统。其中，“脑”指的是有机生命形式的脑或神经系统，而并非仅仅是抽象的“心智（Mind）”；“机”的含义同人机交互，形式可以从简单电路到复杂的系统。在单向脑机接口的情况下，允许大脑和计算机或接受脑之间单项传输信号，而双向脑机接口则允许大脑和外部设备之间进行双向信息交换。脑机接口技术可以准确、快速地采集和识别出人脑在各种思想活动下的脑信号，并利用这些信号来控制外部设备。


    脑机接口研究工作中相当重要的部分就是调整人脑和系统之间的相互适应关系，也就是寻找合适的信号处理与转换算法，使得神经电信号能够实时、快速、准确地通过脑机接口系统转换成可以被计算机识别的命令或操作信号。作为一个综合多种学科的交叉技术，脑机接口技术的发展目前还存在着很多问题，如信号处理和信号转换的速度有待进一步提高，脑电检测技术与实用性的要求还有差距以及应用领域有待进一步开发。


    4.虚拟现实技术


    虚拟现实（Virtual Reality，VR）又称灵境技术，是利用计算机模拟产生一个三维空间的虚拟世界，提供使用者关于视觉等感官的模拟，让使用者感觉仿佛身临其境，可以即时、没有限制地观察三维空间内的事物。VR是一项将动态环境建模技术、实时三维图形生成技术、立体显示和传感技术、应用系统开发技术、系统集成技术等综合集成的交叉学科。从不同角度出发，可以对VR系统做出不同的分类。根据沉浸式体验角度，可将VR分为非交互式体验、人-虚拟环境交互式体验和群体-虚拟环境交互式体验等；根据系统功能角度，可将VR分为规划设计、展示娱乐、训练演练等。


    随着社会生产力和科学技术的不断发展，各行各业对VR技术的需求日益旺盛，主要在工程设计、计算机辅助设计、数据可视化、航空航天、建筑设计、多媒体远程教育、远程医疗、艺术创作、游戏等方面。VR技术也取得了巨大进步，受到了越来越多人的认可，并逐步成为一个新的科学技术领域。


    5.增强现实技术


    增强现实（Augmented Reality，AR）又称扩张现实，是指透过摄影机影像的位置及角度精算并加上图像分析技术，让屏幕上的虚拟世界能够与现实世界场景进行结合与交互的技术。


    AR技术不仅能够有效体现出真实世界的内容，也能够促使虚拟的信息内容显示出来。随着AR技术的成熟，AR越来越多地应用于航空航天以及其他各个行业。从用户体验来讲，用户期望更大程度上从2D转移到沉浸感更强的3D，从3D获得新的体验，包括商业、体验店、机器人、虚拟助理、区域规划、监控等，人们从只使用语言功能升级到包含视觉在内的全方位体验。在这个发展过程中，AR将超越VR，更能满足用户的需求。


    6.混合现实技术


    混合现实（Mixed Reality，MR）是一项融合了虚拟现实（VR）和增强现实（AR）的新兴技术。该技术通过在现实场景呈现虚拟场景信息，在现实世界、虚拟世界和用户之间搭起一个交互反馈的信息回路，以增强用户体验的真实感。


    MR的实现需要在一个能与现实世界各事物相互交互的环境。如果一切事物都是虚拟的，那就是VR领域；如果展现出来的虚拟信息只能简单叠加在现实事物上，那就是AR。MR的关键点就是与现实世界进行交互和信息的及时获取。


    4.1.3　空间智能人机交互


    随着互联网技术和智能技术的发展，人机交互的模式不断增多，并且技术路线逐渐向智能化演进，从最初的文字界面交互、图形界面交互，到语音交互、手势识别、脑机接口以及各类数字现实技术等。不同的人机交互模式有着不同的优缺点，需要进一步的发展和优化。


    随着航天领域执行空间任务的范围不断扩展，不仅限于近地轨道空间，甚至还要涉足月球、火星等深空环境，任务的复杂程度不断提升，地面支持能力随着距离的扩大不断缩减，仅依靠航天员在轨操作无法满足任务的需求，而智能人机交互技术使计算机模拟人类活动的脑机制，并拥有与人类进行高效信息交互的潜力。因此，智能人机交互技术在空天领域具有广阔的施展空间，发展空间智能人机交互技术势在必行。


    4.2　空间智能人机交互发展现状


    本节从空间智能机器人、空间VR/AR/MR以及脑机接口方面论述空间智能人机交互的发展现状。


    4.2.1　空间智能机器人


    空间站任务期间，航天员需要长期在轨驻留，完成飞行器的操控、在轨科学实验操作、健康保障、生活照料、科学演示等一系列工作。这些工作复杂、耗时、工作量大，对航天员身体素质和心理素质有更高的要求，对空间站的工作效能产生很大的影响。空间站智能机器人的出现，可以缓解并解决一些问题。


    1.美国空间站SPHERES机器人


    2006年，美国设计的同步位置保持、连通、再定位试验卫星（Synchronized Position Hold Engage and Reorient Experimental
    Satellites，SPHERES）机器人入住国际空间站。SPHERES机器人由NASA、DARPA和MIT联合研制，该项目起源于1999年的MIT航空航天专业研究生课程，设计用于制导、导航、控制算法试验和验证的智能机器人，在2000年完成了样机研制，最终于2006年运抵国际空间站。SPHERES机器人由国际空间站舱内3个自由飞行器组成。


    2.美国微重力Astrobee机器人


    Astrobee是在SPHERES项目基础上进行的，是NASA在空间站的第一个自由飞行器系统，由美国NASA艾姆斯研究中心（NASA Ames Research
    Center）研制。NASA自2014年开始研究Astrobee机器人，2019年4月首批Astrobee机器人奔赴国际空间。每个Astrobee是一个边长约为32
    cm的立方体，质量约10.5 kg（含机械臂和4块电池），每个角和大部分边框上都覆盖了一层柔性保险、缓冲材料，能有效保护空间站内部设备和航天员，并在其中嵌入了推进系统。机器人的中心部分包含6个相机、丰富的传感器、控制系统、触控屏幕，以及为后续增加硬件而预留的有效载荷托架（2个位于正面，2个位于背面，每个托架都有机械、数据和电源连接），其中包含1个机械臂用于抓取空间站的扶手。


    3.美国仿人形Robonaut-2机器人


    2011年2月24日，Robonaut-2在STS-133任务中搭乘“发现号”航天飞机前往国际空间站，成为世界上第一个仿人形陪伴机器人。Robonaut-2的应用标志着人类利用机器人和人机交互系统开展航天活动进入了一个新的阶段。Robonaut-2能够充分利用双手去开展工作，其拇指和手臂的灵活程度近似于戴着手套工作的人类航天员，操作范围远超前辈机器人Robonaut-1，速度能力是Robonaut-1的4倍。Robonaut-2的灵活度很高，总共具备42个自由度，由54个伺服驱动电机实现，有350多个传感器。其中，该机器人的脖子具备3个自由度，手臂和手腕具备7个自由度，手部具备12个自由度，腰部可以自由旋转。它具有灵活的手指，拇指具备4个自由度，手能够实现宽范围地抓取物体，与人手的操作十分接近。


    4.日本语音人形Kirobo机器人


    2013年8月3日，日本将会说话的人形机器人Kirobo成功发射至国际空间站，成为世界上第一个能够与人进行语言交流的仿人形陪伴机器人。日本研究人员提出，避免宇航员在太空感受孤独的方法之一就是使用世界上首款会说话的机器人宇航员作为太空助手，陪伴日籍宇航员若田光一（Koichi
    Wakata），Kirobo机器人在日语中的意思是“希望”和“机器人”。Kirobo具备语音识别、自然语言处理功能，能够通过合成语音（日语）与航天员进行简单语言交流。此外，Kirobo还具备通信、面部识别、视频录制等功能。由于Kirobo并不需要行为能力，它的体型比其他太空机器人更小，身高约34
    cm，质量1 kg。在太空中Kirobo机器人可以与地面上另一个机器人进行通话。Kirobo机器人能够在零重力环境下行走。


    5.德国语音控制CIMON机器人


    CIMON（Crew Interactive Mobile Companion）是世界上第一个以人工智能为特色的自主飞行辅助系统，是在德国宇航中心主持下由空客公司和IBM公司开发和建造的，以支持宇航员在国际空间站上的日常任务，完全由语音控制的能够通过看、说、听来实现与宇航员之间的交流。CIMON能够看、听、说、理解以及自主飞行，其外形类似于球，直径约32
    cm，质量约5 kg，机身正面安装多个视觉传感器，宇航员可利用显示器与它进行交互，它还懂得欣赏音乐，内置了1 000多个句子。此外，它还能够在国际空间站周围飘浮飞行，提供技术帮助、警示系统故障和危险，并为宇航员提供一系列娱乐。CIMON是一个具有嗓音、面容识别功能的个人助理。CIMON有一张爱笑的大饼脸，通过与宇航员相处，既能减轻宇航员在长期太空任务中的压力和工作量，又有助于研究长期太空任务对宇航员的心理影响。


    6.俄罗斯太空版Skybot F-850机器人


    Skybot F-850是俄罗斯的首位机器人宇航员，由俄罗斯Androidnaya Technika公司和代表俄罗斯政府的先进研究项目基金会共同研发。2019年8月，Skybot
    F-850搭乘“联盟号”MS-14宇宙飞船发射升空并抵达国际空间站。尽管其在国际空间站停留的时间不长，却是俄罗斯第一款太空版机器人。Skybot F-850使用“人类+AI”双重控制，既可以自主移动和工作，也可以在身穿控制服的人类操作员控制下工作。在地面测试中，它会使用各种标准的“人类”工具来完成转动阀门、开锁、焊接等各项任务，同时也会使用各种交通工具，无论是摩托车还是越野车都能够驾驶，俄罗斯的最终目标是让它学会开航天飞机。Skybot
    F-850拥有一个正值壮年的成年人拥有的一些体能基础，如提重物、俯卧撑、匍匐前进等，充分体现了俄罗斯特色。此外，研究人员还为Skybot F-850开发了一套智能语音交互系统，可以进行各种场景的对话。


    7.空间智能机器人发展小结


    随着AI、混合现实等技术的发展和相关应用的研究，智能人机交互在航天员辅助操作和独立获取信息等方面的巨大优势已经显现出来。面向国际空间站等有人值守空间设施建设以及正式运营过程中与航天员和谐共处及自然交流，对航天员任务执行情况、日常生活情况进行在线监控并实时提供提醒和指导以及缓解航天员压力和负荷的实际需求，与空间设施内外固定的各类监测设备/传感器、航天员配备的各类可穿戴设备/传感器相比，空间站智能机器人具备更强的移动、认知、交互、协作以及学习能力，预计在不远的将来，空间站智能机器人能够带来以下更加优质的服务：


    ①在航天员执行任务过程中，智能机器人能够实时监测、识别航天员的动作、行为并监测任务完成情况；当航天员遇到问题和困难时，及时提供相关专业知识及工作指导。


    ②持续观察航天员在空间设施内的饮食、锻炼、休息等日常生活情况，以及航天员的身体、心理健康状况；发生异常时能够及时提醒并提供建议，在必要时能够把异常情况及时通知地面人员，以提供救助服务。


    ③分担航天员在轨期间简单的手动操作工作，减少航天员工作量，提高航天员工作效率。例如，日常常规清洁和真空处理；工具和零部件库存盘点；工具校准；设备重新摆放；食物准备和清理；空气、水质量检测等。


    ④监控空间设施运行情况，辅助航天员或与航天员协同完成空间设施运行维护任务。


    ⑤与航天员进行自然交流；针对航天员具体情况提供个性化、定制化服务，并根据航天员需求，与家人、地面人员进行多种方式的沟通。


    为此，航天员和智能机器人需要组成一个更复杂的、相辅相成的智能人机系统，二者需要通过自然、高效、频繁的交互（包括信息交流、物理空间中的行为互动，以及两者交互的集成）才能实现二者协同完成任务以提高任务完成的效率并降低风险。智能机器人需要具备更加强大的目标识别和状态估计能力、自由移动能力、多模态信息融合的灵巧操作能力和自适应人机融合能力。研究人员可能需要着重对智能机器人的本体小型及柔性技术、感测感知及认知技术、决策规划及控制技术和人机交互与写作技术展开研究。


    4.2.2　空间VR/AR/MR


    VR/AR/MR技术已经用于空间机械臂的操作、航天员的训练、国际空间站的日常工作等。航天员可以通过佩戴头盔式AR设备提供辅助信息的指导来完成在轨任务。此外，NASA还使用VR技术实现了太空虚拟旅程等逼真、沉浸式的应用，使观众真正获得身临其境的满足感。随着VR/AR/MR技术在航天领域取得越来越多的成绩，人们也认识到面对地面无法开展的物理试验验证环节以及不可逆的操作环节，可以借助此类数字现实技术的虚拟可视化、虚实融合等特点，来完善产品设计方案，加强试验验证分析，培训航天员或操控人员，完成未知空间探测等任务。


    1.国际空间站MSS系统


    国际空间站的机械臂操作是一个劳动密集的过程。空间机械臂操作耗时长、操作复杂，需要地面任务控制参与。国际空间站移动服务系统（Mobile Service System，MSS）由移动基座系统、空间站遥控机械臂、末端灵巧机械手和移动传输器4个部分组成，其主要任务是辅助空间站在轨组装、大型负载搬运、ORU更换、航天员舱外活动辅助、空间站辅助维修等。MSS基于3D模型的实用性和实际相机视图的准确性，采用AR技术开发基于视频的、实时多视点图像比较和重构工具EDGE，利用站载摄像机的实时视频反馈和编码器位置姿态数据合成图像进行操作以及训练。


    2.美国NASA用VR/AR/MR服务宇航员


    NASA从20世纪80年代就已经开始使用VR技术，而且他们所使用的头显设备看起来也极像现在的头显设备。与以前不同的是，VR可以用在任何工作的过程中，从航天员的训练到国际空间站的日常工作都在应用此技术。通过佩戴头盔式AR设备，航天员可以透过透明的显示器看到包含技术辅助信息的全息影像，在移动过程中解放双手，并与全息影像实现语音、手势和凝视等形式的交互，航天员可以通过这些辅助信息的指导完成在轨任务。同样，在航天领域，MR技术也提供了一种极具潜力的航天任务支持手段。


    2016年欧洲航天局完成了为期两年的Edc AR（Engineering data in Crossplatform AR）项目研发。Edc AR项目开发了一个新的AR系统，该系统运行在HoloLens平台上，通过给航天员提供操作演示步骤，在减少航天员错误操作的同时，提高任务执行效率。


    3.美国NASA用VR体验太空虚拟旅程


    VR技术是NASA利用人工智能技术制造一种逼真、沉浸式氛围，并有效融入在轨运行的多种航天器获取的观测数据，使观众真正获得身临其境的满足感。美国国家航空航天局天文学家和人工智能专家将哈勃、斯皮策太空望远镜观测到的可见光和红外等多源传感器信息进行融合，创造出一段穿越猎户座大星云的三维旅程。


    哈勃望远镜观测对象在可见光下发光，通常在几千度，而斯皮策望远镜则是对温度仅为几百度的较冷物体非常敏感。斯皮策的红外视觉穿透了模糊的尘埃，可以看到嵌入星云深处的恒星，以及更暗和更小质量的恒星，它们的红外线比可见光更亮。未来VR技术可以帮助人们更好地体验两个望远镜如何提供更复杂、更完整的星云图像。


    4.美国NASA用VR/AR/MR进行航天器虚拟配置与维修应用


    马歇尔太空飞行中心从1986年起使用数字化企业互动制造应用软件（Digital Enterprise Lean Manufacturing Interactive
    Application，DELMIA），主要用于机器人技术、人机工效学、装配等方面。在阿瑞斯（战神）一型火箭的研制中，采用并行协同的可制造性分析，从可装配性、人机功效、装配环境模拟等方面开展了以下工作：


    ①装配仿真。验证操作序列和加工方法，优化装配过程，减少下游生产计划。


    ②人机工效学。识别危险操作，验证装配、测试、操作、维护过程中的可达性。


    ③工厂环境定义与分析。验证操作空间的大小，验证操作顺序和大尺寸加工方案，估算投资总额，识别装配过程中的难点。


    美国空军阿姆斯特朗实验室与宾夕法尼亚大学联合开发的人员训练与人员要素的设计评估（Design Evaluation for Personnel Training
    and Human Factors，DEPTH）项目，采用可视化和VR技术进行维修与保障分析的计算机应用系统。该项目的研究主要采用数字样机与3D人体模型技术，用以提前确定维修过程内容与过程中的人力资源需求、生成训练辅助材料。通过将维修仿真结果输入交互式电子技术文档（Interactive
    Electronic Technical Manual，IETM），使其成为维修手册与维修训练资料的一部分，实现在一次仿真中完成多项与维修相关的任务，大大减少了重复性的开发工作。


    5.空间VR/AR/MR技术小结


    未来VR/AR/MR相关技术在空天领域的应用发展趋势总结为以下几点：


    ①飞行过程虚拟仿真分析。大型复杂航天器在方案设计阶段，需要开展轨道与星座设计、动力学分析等工作；通过飞行过程虚拟仿真分析，可以在航天器研制早期发现总体设计中的问题，减少设计修改对详细设计等后续工作的影响。


    ②三维数字样机协同设计与校核。将传统的文字、图纸等平面构型描述转换为方案“立体”模型，在方案设计阶段提供一个“看得见、摸得着”的虚拟样机替代“功能不健全”的演示样机，减少不必要的设计余量、降低制造加工难度；在产品研制早期进行改进，避免在后期更改造成时间和资源成本的浪费。


    ③交互式虚拟展示、维修、训练。随着航天产品三维研制模式的不断推进，基于三维模型的虚拟现实仿真具有越来越重要的应用意义。此外，利用VR与仿真系统对操作人员进行培训、演练，给操作人员一种身临其境的感觉，以熟悉操作内容和过程，减少正式操作过程中的错误。


    在未来的应用研究中必须着力提高设备的交互性，因为某些虚拟操作任务只有当操作者的触觉反馈逼真时，完成任务的准确性才会提高。此外，还需要进行虚拟模型的建模与优化方法研究，只有这样才能够确保VR/AR/MR系统的效果最好，并使所获取的实验数据具备可类比性，实现真正意义上的应用。


    4.2.3　脑机接口


    时值脑科学和人工智能两大领域在过去几十年各自都取得长足进展后，逐渐走向融合的关键节点———脑机接口（Brain-Machine Interface，BMI）技术。它不仅可以绕过感官和肌肉，为大脑与外界互动提供全新的高通量信道，甚至无须借助语言而实现人与人之间高效的交流协作。这不仅使得意识读写、记忆移植成为可能，甚至通过意识上传实现在数字世界中的永生等人类长久以来的梦想。'
  fmt: '

    除此之外，智能语音交互还可用于智能问答、智能质检、法庭庭审实时记录、实时演讲字幕、访谈录音转写等场景，在金融、司法、电商等多个领域均有应用。但是，智能语音交互中最大的问题在于语义理解，即需要准确地理解用户的对话目的，这无法避免歧义消解问题和未知语言现象的处理问题。


    ## 3. 脑机接口


    脑机接口（`Brain Computer Interface`，`BCI`），也称为大脑端口，是指在人或动物脑（或脑细胞的培养物）与外部设备创建的实时通信系统。其中，“脑”指的是有机生命形式的脑或神经系统，而并非仅仅是抽象的“心智（Mind）”；“机”的含义同人机交互，形式可以从简单电路到复杂的系统。在单向脑机接口的情况下，允许大脑和计算机或接受脑之间单项传输信号，而双向脑机接口则允许大脑和外部设备之间进行双向信息交换。脑机接口技术可以准确、快速地采集和识别出人脑在各种思想活动下的脑信号，并利用这些信号来控制外部设备。


    脑机接口研究工作中相当重要的部分就是调整人脑和系统之间的相互适应关系，也就是寻找合适的信号处理与转换算法，使得神经电信号能够实时、快速、准确地通过脑机接口系统转换成可以被计算机识别的命令或操作信号。作为一个综合多种学科的交叉技术，脑机接口技术的发展目前还存在着很多问题，如信号处理和信号转换的速度有待进一步提高，脑电检测技术与实用性的要求还有差距以及应用领域有待进一步开发。


    ## 4. 虚拟现实技术


    虚拟现实（`Virtual Reality`，`VR`）又称灵境技术，是利用计算机模拟产生一个三维空间的虚拟世界，提供使用者关于视觉等感官的模拟，让使用者感觉仿佛身临其境，可以即时、没有限制地观察三维空间内的事物。`VR`是一项将动态环境建模技术、实时三维图形生成技术、立体显示和传感技术、应用系统开发技术、系统集成技术等综合集成的交叉学科。从不同角度出发，可以对`VR`系统做出不同的分类。根据沉浸式体验角度，可将`VR`分为非交互式体验、人-虚拟环境交互式体验和群体-虚拟环境交互式体验等；根据系统功能角度，可将`VR`分为规划设计、展示娱乐、训练演练等。


    随着社会生产力和科学技术的不断发展，各行各业对`VR`技术的需求日益旺盛，主要在工程设计、计算机辅助设计、数据可视化、航空航天、建筑设计、多媒体远程教育、远程医疗、艺术创作、游戏等方面。`VR`技术也取得了巨大进步，受到了越来越多人的认可，并逐步成为一个新的科学技术领域。


    ## 5. 增强现实技术


    增强现实（`Augmented Reality`，`AR`）又称扩张现实，是指透过摄影机影像的位置及角度精算并加上图像分析技术，让屏幕上的虚拟世界能够与现实世界场景进行结合与交互的技术。


    `AR`技术不仅能够有效体现出真实世界的内容，也能够促使虚拟的信息内容显示出来。随着`AR`技术的成熟，`AR`越来越多地应用于航空航天以及其他各个行业。从用户体验来讲，用户期望更大程度上从2D转移到沉浸感更强的3D，从3D获得新的体验，包括商业、体验店、机器人、虚拟助理、区域规划、监控等，人们从只使用语言功能升级到包含视觉在内的全方位体验。在这个发展过程中，`AR`将超越`VR`，更能满足用户的需求。


    ## 6. 混合现实技术


    混合现实（`Mixed Reality`，`MR`）是一项融合了虚拟现实（`VR`）和增强现实（`AR`）的新兴技术。该技术通过在现实场景呈现虚拟场景信息，在现实世界、虚拟世界和用户之间搭起一个交互反馈的信息回路，以增强用户体验的真实感。


    `MR`的实现需要在一个能与现实世界各事物相互交互的环境。如果一切事物都是虚拟的，那就是`VR`领域；如果展现出来的虚拟信息只能简单叠加在现实事物上，那就是`AR`。`MR`的关键点就是与现实世界进行交互和信息的及时获取。


    ### 4.1.3 空间智能人机交互


    随着互联网技术和智能技术的发展，人机交互的模式不断增多，并且技术路线逐渐向智能化演进，从最初的文字界面交互、图形界面交互，到语音交互、手势识别、脑机接口以及各类数字现实技术等。不同的人机交互模式有着不同的优缺点，需要进一步的发展和优化。


    随着航天领域执行空间任务的范围不断扩展，不仅限于近地轨道空间，甚至还要涉足月球、火星等深空环境，任务的复杂程度不断提升，地面支持能力随着距离的扩大不断缩减，仅依靠航天员在轨操作无法满足任务的需求，而智能人机交互技术使计算机模拟人类活动的脑机制，并拥有与人类进行高效信息交互的潜力。因此，智能人机交互技术在空天领域具有广阔的施展空间，发展空间智能人机交互技术势在必行。


    ### 4.2 空间智能人机交互发展现状


    本节从空间智能机器人、空间`VR`/`AR`/`MR`以及脑机接口方面论述空间智能人机交互的发展现状。


    #### 4.2.1 空间智能机器人


    空间站任务期间，航天员需要长期在轨驻留，完成飞行器的操控、在轨科学实验操作、健康保障、生活照料、科学演示等一系列工作。这些工作复杂、耗时、工作量大，对航天员身体素质和心理素质有更高的要求，对空间站的工作效能产生很大的影响。空间站智能机器人的出现，可以缓解并解决一些问题。


    ##### 1. 美国空间站SPHERES机器人


    2006年，美国设计的同步位置保持、连通、再定位试验卫星（`Synchronized Position Hold Engage and Reorient Experimental
    Satellites`，`SPHERES`）机器人入住国际空间站。`SPHERES`机器人由`NASA`、`DARPA`和`MIT`联合研制，该项目起源于1999年的`MIT`航空航天专业研究生课程，设计用于制导、导航、控制算法试验和验证的智能机器人，在2000年完成了样机研制，最终于2006年运抵国际空间站。`SPHERES`机器人由国际空间站舱内3个自由飞行器组成。


    ##### 2. 美国微重力Astrobee机器人


    `Astrobee`是在`SPHERES`项目基础上进行的，是`NASA`在空间站的第一个自由飞行器系统，由美国`NASA`艾姆斯研究中心（`NASA Ames
    Research Center`）研制。`NASA`自2014年开始研究`Astrobee`机器人，2019年4月首批`Astrobee`机器人奔赴国际空间。每个`Astrobee`是一个边长约为32
    cm的立方体，质量约10.5 kg（含机械臂和4块电池），每个角和大部分边框上都覆盖了一层柔性保险、缓冲材料，能有效保护空间站内部设备和航天员，并在其中嵌入了推进系统。机器人的中心部分包含6个相机、丰富的传感器、控制系统、触控屏幕，以及为后续增加硬件而预留的有效载荷托架（2个位于正面，2个位于背面，每个托架都有机械、数据和电源连接），其中包含1个机械臂用于抓取空间站的扶手。


    ##### 3. 美国仿人形Robonaut-2机器人


    2011年2月24日，`Robonaut-2`在`STS-133`任务中搭乘“发现号”航天飞机前往国际空间站，成为世界上第一个仿人形陪伴机器人。`Robonaut-2`的应用标志着人类利用机器人和人机交互系统开展航天活动进入了一个新的阶段。`Robonaut-2`能够充分利用双手去开展工作，其拇指和手臂的灵活程度近似于戴着手套工作的人类航天员，操作范围远超前辈机器人`Robonaut-1`，速度能力是`Robonaut-1`的4倍。`Robonaut-2`的灵活度很高，总共具备42个自由度，由54个伺服驱动电机实现，有350多个传感器。其中，该机器人的脖子具备3个自由度，手臂和手腕具备7个自由度，手部具备12个自由度，腰部可以自由旋转。它具有灵活的手指，拇指具备4个自由度，手能够实现宽范围地抓取物体，与人手的操作十分接近。


    ##### 4. 日本语音人形Kirobo机器人


    2013年8月3日，日本将会说话的人形机器人`Kirobo`成功发射至国际空间站，成为世界上第一个能够与人进行语言交流的仿人形陪伴机器人。日本研究人员提出，避免宇航员在太空感受孤独的方法之一就是使用世界上首款会说话的机器人宇航员作为太空助手，陪伴日籍宇航员若田光一（`Koichi
    Wakata`），`Kirobo`机器人在日语中的意思是“希望”和“机器人”。`Kirobo`具备语音识别、自然语言处理功能，能够通过合成语音（日语）与航天员进行简单语言交流。此外，`Kirobo`还具备通信、面部识别、视频录制等功能。由于`Kirobo`并不需要行为能力，它的体型比其他太空机器人更小，身高约34
    cm，质量1 kg。在太空中`Kirobo`机器人可以与地面上另一个机器人进行通话。`Kirobo`机器人能够在零重力环境下行走。


    ##### 5. 德国语音控制CIMON机器人


    `CIMON`（`Crew Interactive Mobile Companion`）是世界上第一个以人工智能为特色的自主飞行辅助系统，是在德国宇航中心主持下由空客公司和`IBM`公司开发和建造的，以支持宇航员在国际空间站上的日常任务，完全由语音控制的能够通过看、说、听来实现与宇航员之间的交流。`CIMON`能够看、听、说、理解以及自主飞行，其外形类似于球，直径约32
    cm，质量约5 kg，机身正面安装多个视觉传感器，宇航员可利用显示器与它进行交互，它还懂得欣赏音乐，内置了1 000多个句子。此外，它还能够在国际空间站周围飘浮飞行，提供技术帮助、警示系统故障和危险，并为宇航员提供一系列娱乐。`CIMON`是一个具有嗓音、面容识别功能的个人助理。`CIMON`有一张爱笑的大饼脸，通过与宇航员相处，既能减轻宇航员在长期太空任务中的压力和工作量，又有助于研究长期太空任务对宇航员的心理影响。


    ##### 6. 俄罗斯太空版Skybot F-850机器人


    `Skybot F-850`是俄罗斯的首位机器人宇航员，由俄罗斯`Androidnaya Technika`公司和代表俄罗斯政府的先进研究项目基金会共同研发。2019年8月，`Skybot
    F-850`搭乘“联盟号”`MS-14`宇宙飞船发射升空并抵达国际空间站。尽管其在国际空间站停留的时间不长，却是俄罗斯第一款太空版机器人。`Skybot F-850`使用“人类+AI”双重控制，既可以自主移动和工作，也可以在身穿控制服的人类操作员控制下工作。在地面测试中，它会使用各种标准的“人类”工具来完成转动阀门、开锁、焊接等各项任务，同时也会使用各种交通工具，无论是摩托车还是越野车都能够驾驶，俄罗斯的最终目标是让它学会开航天飞机。`Skybot
    F-850`拥有一个正值壮年的成年人拥有的一些体能基础，如提重物、俯卧撑、匍匐前进等，充分体现了俄罗斯特色。此外，研究人员还为`Skybot F-850`开发了一套智能语音交互系统，可以进行各种场景的对话。


    ##### 7. 空间智能机器人发展小结


    随着`AI`、混合现实等技术的发展和相关应用的研究，智能人机交互在航天员辅助操作和独立获取信息等方面的巨大优势已经显现出来。面向国际空间站等有人值守空间设施建设以及正式运营过程中与航天员和谐共处及自然交流，对航天员任务执行情况、日常生活情况进行在线监控并实时提供提醒和指导以及缓解航天员压力和负荷的实际需求，与空间设施内外固定的各类监测设备/传感器、航天员配备的各类可穿戴设备/传感器相比，空间站智能机器人具备更强的移动、认知、交互、协作以及学习能力，预计在不远的将来，空间站智能机器人能够带来以下更加优质的服务：


    ①在航天员执行任务过程中，智能机器人能够实时监测、识别航天员的动作、行为并监测任务完成情况；当航天员遇到问题和困难时，及时提供相关专业知识及工作指导。


    ②持续观察航天员在空间设施内的饮食、锻炼、休息等日常生活情况，以及航天员的身体、心理健康状况；发生异常时能够及时提醒并提供建议，在必要时能够把异常情况及时通知地面人员，以提供救助服务。


    ③分担航天员在轨期间简单的手动操作工作，减少航天员工作量，提高航天员工作效率。例如，日常常规清洁和真空处理；工具和零部件库存盘点；工具校准；设备重新摆放；食物准备和清理；空气、水质量检测等。


    ④监控空间设施运行情况，辅助航天员或与航天员协同完成空间设施运行维护任务。


    ⑤与航天员进行自然交流；针对航天员具体情况提供个性化、定制化服务，并根据航天员需求，与家人、地面人员进行多种方式的沟通。


    为此，航天员和智能机器人需要组成一个更复杂的、相辅相成的智能人机系统，二者需要通过自然、高效、频繁的交互（包括信息交流、物理空间中的行为互动，以及两者交互的集成）才能实现二者协同完成任务以提高任务完成的效率并降低风险。智能机器人需要具备更加强大的目标识别和状态估计能力、自由移动能力、多模态信息融合的灵巧操作能力和自适应人机融合能力。研究人员可能需要着重对智能机器人的本体小型及柔性技术、感测感知及认知技术、决策规划及控制技术和人机交互与写作技术展开研究。


    #### 4.2.2 空间VR/AR/MR


    `VR`/`AR`/`MR`技术已经用于空间机械臂的操作、航天员的训练、国际空间站的日常工作等。航天员可以通过佩戴头盔式`AR`设备提供辅助信息的指导来完成在轨任务。此外，`NASA`还使用`VR`技术实现了太空虚拟旅程等逼真、沉浸式的应用，使观众真正获得身临其境的满足感。随着`VR`/`AR`/`MR`技术在航天领域取得越来越多的成绩，人们也认识到面对地面无法开展的物理试验验证环节以及不可逆的操作环节，可以借助此类数字现实技术的虚拟可视化、虚实融合等特点，来完善产品设计方案，加强试验验证分析，培训航天员或操控人员，完成未知空间探测等任务。


    ##### 1. 国际空间站MSS系统


    国际空间站的机械臂操作是一个劳动密集的过程。空间机械臂操作耗时长、操作复杂，需要地面任务控制参与。国际空间站移动服务系统（`Mobile Service System`，`MSS`）由移动基座系统、空间站遥控机械臂、末端灵巧机械手和移动传输器4个部分组成，其主要任务是辅助空间站在轨组装、大型负载搬运、ORU更换、航天员舱外活动辅助、空间站辅助维修等。`MSS`基于3D模型的实用性和实际相机视图的准确性，采用`AR`技术开发基于视频的、实时多视点图像比较和重构工具`EDGE`，利用站载摄像机的实时视频反馈和编码器位置姿态数据合成图像进行操作以及训练。


    ##### 2. 美国NASA用VR/AR/MR服务宇航员


    `NASA`从20世纪80年代就已经开始使用`VR`技术，而且他们所使用的头显设备看起来也极像现在的头显设备。与以前不同的是，`VR`可以用在任何工作的过程中，从航天员的训练到国际空间站的日常工作都在应用此技术。通过佩戴头盔式`AR`设备，航天员可以透过透明的显示器看到包含技术辅助信息的全息影像，在移动过程中解放双手，并与全息影像实现语音、手势和凝视等形式的交互，航天员可以通过这些辅助信息的指导完成在轨任务。同样，在航天领域，`MR`技术也提供了一种极具潜力的航天任务支持手段。


    2016年欧洲航天局完成了为期两年的`Edc AR`（`Engineering data in Crossplatform AR`）项目研发。`Edc AR`项目开发了一个新的`AR`系统，该系统运行在`HoloLens`平台上，通过给航天员提供操作演示步骤，在减少航天员错误操作的同时，提高任务执行效率。


    ##### 3. 美国NASA用VR体验太空虚拟旅程


    `VR`技术是`NASA`利用人工智能技术制造一种逼真、沉浸式氛围，并有效融入在轨运行的多种航天器获取的观测数据，使观众真正获得身临其境的满足感。美国国家航空航天局天文学家和人工智能专家将哈勃、斯皮策太空望远镜观测到的可见光和红外等多源传感器信息进行融合，创造出一段穿越猎户座大星云的三维旅程。


    哈勃望远镜观测对象在可见光下发光，通常在几千度，而斯皮策望远镜则是对温度仅为几百度的较冷物体非常敏感。斯皮策的红外视觉穿透了模糊的尘埃，可以看到嵌入星云深处的恒星，以及更暗和更小质量的恒星，它们的红外线比可见光更亮。未来`VR`技术可以帮助人们更好地体验两个望远镜如何提供更复杂、更完整的星云图像。


    ##### 4. 美国NASA用VR/AR/MR进行航天器虚拟配置与维修应用


    马歇尔太空飞行中心从1986年起使用数字化企业互动制造应用软件（`Digital Enterprise Lean Manufacturing Interactive
    Application`，`DELMIA`），主要用于机器人技术、人机工效学、装配等方面。在阿瑞斯（战神）一型火箭的研制中，采用并行协同的可制造性分析，从可装配性、人机功效、装配环境模拟等方面开展了以下工作：


    ①装配仿真。验证操作序列和加工方法，优化装配过程，减少下游生产计划。


    ②人机工效学。识别危险操作，验证装配、测试、操作、维护过程中的可达性。


    ③工厂环境定义与分析。验证操作空间的大小，验证操作顺序和大尺寸加工方案，估算投资总额，识别装配过程中的难点。


    美国空军阿姆斯特朗实验室与宾夕法尼亚大学联合开发的人员训练与人员要素的设计评估（`Design Evaluation for Personnel Training
    and Human Factors`，`DEPTH`）项目，采用可视化和`VR`技术进行维修与保障分析的计算机应用系统。该项目的研究主要采用数字样机与3D人体模型技术，用以提前确定维修过程内容与过程中的人力资源需求、生成训练辅助材料。通过将维修仿真结果输入交互式电子技术文档（`Interactive
    Electronic Technical Manual`，`IETM`），使其成为维修手册与维修训练资料的一部分，实现在一次仿真中完成多项与维修相关的任务，大大减少了重复性的开发工作。


    ##### 5. 空间VR/AR/MR技术小结


    未来`VR`/`AR`/`MR`相关技术在空天领域的应用发展趋势总结为以下几点：


    ①飞行过程虚拟仿真分析。大型复杂航天器在方案设计阶段，需要开展轨道与星座设计、动力学分析等工作；通过飞行过程虚拟仿真分析，可以在航天器研制早期发现总体设计中的问题，减少设计修改对详细设计等后续工作的影响。


    ②三维数字样机协同设计与校核。将传统的文字、图纸等平面构型描述转换为方案“立体”模型，在方案设计阶段提供一个“看得见、摸得着”的虚拟样机替代“功能不健全”的演示样机，减少不必要的设计余量、降低制造加工难度；在产品研制早期进行改进，避免在后期更改造成时间和资源成本的浪费。


    ③交互式虚拟展示、维修、训练。随着航天产品三维研制模式的不断推进，基于三维模型的虚拟现实仿真具有越来越重要的应用意义。此外，利用`VR`与仿真系统对操作人员进行培训、演练，给操作人员一种身临其境的感觉，以熟悉操作内容和过程，减少正式操作过程中的错误。


    在未来的应用研究中必须着力提高设备的交互性，因为某些虚拟操作任务只有当操作者的触觉反馈逼真时，完成任务的准确性才会提高。此外，还需要进行虚拟模型的建模与优化方法研究，只有这样才能够确保`VR`/`AR`/`MR`系统的效果最好，并使所获取的实验数据具备可类比性，实现真正意义上的应用。


    #### 4.2.3 脑机接口


    时值脑科学和人工智能两大领域在过去几十年各自都取得长足进展后，逐渐走向融合的关键节点———脑机接口（`Brain-Machine Interface`，`BMI`）技术。它不仅可以绕过感官和肌肉，为大脑与外界互动提供全新的高通量信道，甚至无须借助语言而实现人与人之间高效的交流协作。这不仅使得意识读写、记忆移植成为可能，甚至通过意识上传实现在数字世界中的永生等人类长久以来的梦想。

    '
  trans: '


    除此之外，智能语音交互还可用于智能问答、智能质检、法庭庭审实时记录、实时演讲字幕、访谈录音转写等场景，在金融、司法、电商等多个领域均有应用。但是，智能语音交互中最大的问题在于语义理解，即需要准确地理解用户的对话目的，这无法避免歧义消解问题和未知语言现象的处理问题。


    ## 3. 脑机接口


    脑机接口（`Brain Computer Interface`，`BCI`），也称为大脑端口，是指在人或动物脑（或脑细胞的培养物）与外部设备创建的实时通信系统。其中，“脑”指的是有机生命形式的脑或神经系统，而并非仅仅是抽象的“心智（Mind）”；“机”的含义同人机交互，形式可以从简单电路到复杂的系统。在单向脑机接口的情况下，允许大脑和计算机或接受脑之间单项传输信号，而双向脑机接口则允许大脑和外部设备之间进行双向信息交换。脑机接口技术可以准确、快速地采集和识别出人脑在各种思想活动下的脑信号，并利用这些信号来控制外部设备。


    脑机接口研究工作中相当重要的部分就是调整人脑和系统之间的相互适应关系，也就是寻找合适的信号处理与转换算法，使得神经电信号能够实时、快速、准确地通过脑机接口系统转换成可以被计算机识别的命令或操作信号。作为一个综合多种学科的交叉技术，脑机接口技术的发展目前还存在着很多问题，如信号处理和信号转换的速度有待进一步提高，脑电检测技术与实用性的要求还有差距以及应用领域有待进一步开发。


    ## 4. 虚拟现实技术


    虚拟现实（`Virtual Reality`，`VR`）又称灵境技术，是利用计算机模拟产生一个三维空间的虚拟世界，提供使用者关于视觉等感官的模拟，让使用者感觉仿佛身临其境，可以即时、没有限制地观察三维空间内的事物。`VR`是一项将动态环境建模技术、实时三维图形生成技术、立体显示和传感技术、应用系统开发技术、系统集成技术等综合集成的交叉学科。从不同角度出发，可以对`VR`系统做出不同的分类。根据沉浸式体验角度，可将`VR`分为非交互式体验、人-虚拟环境交互式体验和群体-虚拟环境交互式体验等；根据系统功能角度，可将`VR`分为规划设计、展示娱乐、训练演练等。


    随着社会生产力和科学技术的不断发展，各行各业对`VR`技术的需求日益旺盛，主要在工程设计、计算机辅助设计、数据可视化、航空航天、建筑设计、多媒体远程教育、远程医疗、艺术创作、游戏等方面。`VR`技术也取得了巨大进步，受到了越来越多人的认可，并逐步成为一个新的科学技术领域。


    ## 5. 增强现实技术


    增强现实（`Augmented Reality`，`AR`）又称扩张现实，是指透过摄影机影像的位置及角度精算并加上图像分析技术，让屏幕上的虚拟世界能够与现实世界场景进行结合与交互的技术。


    `AR`技术不仅能够有效体现出真实世界的内容，也能够促使虚拟的信息内容显示出来。随着`AR`技术的成熟，`AR`越来越多地应用于航空航天以及其他各个行业。从用户体验来讲，用户期望更大程度上从
    2D 转移到沉浸感更强的 3D，从 3D 获得新的体验，包括商业、体验店、机器人、虚拟助理、区域规划、监控等，人们从只使用语言功能升级到包含视觉在内的全方位体验。在这个发展过程中，`AR`将超越`VR`，更能满足用户的需求。


    ## 6. 混合现实技术


    混合现实（`Mixed Reality`，`MR`）是一项融合了虚拟现实（`VR`）和增强现实（`AR`）的新兴技术。该技术通过在现实场景呈现虚拟场景信息，在现实世界、虚拟世界和用户之间搭起一个交互反馈的信息回路，以增强用户体验的真实感。


    `MR`的实现需要在一个能与现实世界各事物相互交互的环境。如果一切事物都是虚拟的，那就是`VR`领域；如果展现出来的虚拟信息只能简单叠加在现实事物上，那就是`AR`。`MR`的关键点就是与现实世界进行交互和信息的及时获取。


    ### 4.1.3 空间智能人机交互


    随着互联网技术和智能技术的发展，人机交互的模式不断增多，并且技术路线逐渐向智能化演进，从最初的文字界面交互、图形界面交互，到语音交互、手势识别、脑机接口以及各类数字现实技术等。不同的人机交互模式有着不同的优缺点，需要进一步的发展和优化。


    随着航天领域执行空间任务的范围不断扩展，不仅限于近地轨道空间，甚至还要涉足月球、火星等深空环境，任务的复杂程度不断提升，地面支持能力随着距离的扩大不断缩减，仅依靠航天员在轨操作无法满足任务的需求，而智能人机交互技术使计算机模拟人类活动的脑机制，并拥有与人类进行高效信息交互的潜力。因此，智能人机交互技术在空天领域具有广阔的施展空间，发展空间智能人机交互技术势在必行。


    ### 4.2 空间智能人机交互发展现状


    本节从空间智能机器人、空间`VR`/`AR`/`MR`以及脑机接口方面论述空间智能人机交互的发展现状。


    #### 4.2.1 空间智能机器人


    空间站任务期间，航天员需要长期在轨驻留，完成飞行器的操控、在轨科学实验操作、健康保障、生活照料、科学演示等一系列工作。这些工作复杂、耗时、工作量大，对航天员身体素质和心理素质有更高的要求，对空间站的工作效能产生很大的影响。空间站智能机器人的出现，可以缓解并解决一些问题。


    ##### 1. 美国空间站 SPHERES 机器人


    2006 年，美国设计的同步位置保持、连通、再定位试验卫星（`Synchronized Position Hold Engage and Reorient
    Experimental Satellites`，`SPHERES`）机器人入住国际空间站。`SPHERES`机器人由`NASA`、`DARPA`和`MIT`联合研制，该项目起源于
    1999 年的`MIT`航空航天专业研究生课程，设计用于制导、导航、控制算法试验和验证的智能机器人，在 2000 年完成了样机研制，最终于 2006 年运抵国际空间站。`SPHERES`机器人由国际空间站舱内
    3 个自由飞行器组成。


    ##### 2. 美国微重力 Astrobee 机器人


    `Astrobee`是在`SPHERES`项目基础上进行的，是`NASA`在空间站的第一个自由飞行器系统，由美国`NASA`艾姆斯研究中心（`NASA Ames
    Research Center`）研制。`NASA`自 2014 年开始研究`Astrobee`机器人，2019 年 4 月首批`Astrobee`机器人奔赴国际空间。每个`Astrobee`是一个边长约为
    32 cm 的立方体，质量约 10.5 kg（含机械臂和 4 块电池），每个角和大部分边框上都覆盖了一层柔性保险、缓冲材料，能有效保护空间站内部设备和航天员，并在其中嵌入了推进系统。机器人的中心部分包含
    6 个相机、丰富的传感器、控制系统、触控屏幕，以及为后续增加硬件而预留的有效载荷托架（2 个位于正面，2 个位于背面，每个托架都有机械、数据和电源连接），其中包含
    1 个机械臂用于抓取空间站的扶手。


    ##### 3. 美国仿人形 Robonaut-2 机器人


    2011 年 2 月 24 日，`Robonaut-2`在`STS-133`任务中搭乘“发现号”航天飞机前往国际空间站，成为世界上第一个仿人形陪伴机器人。`Robonaut-2`的应用标志着人类利用机器人和人机交互系统开展航天活动进入了一个新的阶段。`Robonaut-2`能够充分利用双手去开展工作，其拇指和手臂的灵活程度近似于戴着手套工作的人类航天员，操作范围远超前辈机器人`Robonaut-1`，速度能力是`Robonaut-1`的
    4 倍。`Robonaut-2`的灵活度很高，总共具备 42 个自由度，由 54 个伺服驱动电机实现，有 350 多个传感器。其中，该机器人的脖子具备 3
    个自由度，手臂和手腕具备 7 个自由度，手部具备 12 个自由度，腰部可以自由旋转。它具有灵活的手指，拇指具备 4 个自由度，手能够实现宽范围地抓取物体，与人手的操作十分接近。


    ##### 4. 日本语音人形 Kirobo 机器人


    2013 年 8 月 3 日，日本将会说话的人形机器人`Kirobo`成功发射至国际空间站，成为世界上第一个能够与人进行语言交流的仿人形陪伴机器人。日本研究人员提出，避免宇航员在太空感受孤独的方法之一就是使用世界上首款会说话的机器人宇航员作为太空助手，陪伴日籍宇航员若田光一（`Koichi
    Wakata`），`Kirobo`机器人在日语中的意思是“希望”和“机器人”。`Kirobo`具备语音识别、自然语言处理功能，能够通过合成语音（日语）与航天员进行简单语言交流。此外，`Kirobo`还具备通信、面部识别、视频录制等功能。由于`Kirobo`并不需要行为能力，它的体型比其他太空机器人更小，身高约
    34 cm，质量 1 kg。在太空中`Kirobo`机器人可以与地面上另一个机器人进行通话。`Kirobo`机器人能够在零重力环境下行走。


    ##### 5. 德国语音控制 CIMON 机器人


    `CIMON`（`Crew Interactive Mobile Companion`）是世界上第一个以人工智能为特色的自主飞行辅助系统，是在德国宇航中心主持下由空客公司和`IBM`公司开发和建造的，以支持宇航员在国际空间站上的日常任务，完全由语音控制的能够通过看、说、听来实现与宇航员之间的交流。`CIMON`能够看、听、说、理解以及自主飞行，其外形类似于球，直径约
    32 cm，质量约 5 kg，机身正面安装多个视觉传感器，宇航员可利用显示器与它进行交互，它还懂得欣赏音乐，内置了 1 000 多个句子。此外，它还能够在国际空间站周围飘浮飞行，提供技术帮助、警示系统故障和危险，并为宇航员提供一系列娱乐。`CIMON`是一个具有嗓音、面容识别功能的个人助理。`CIMON`有一张爱笑的大饼脸，通过与宇航员相处，既能减轻宇航员在长期太空任务中的压力和工作量，又有助于研究长期太空任务对宇航员的心理影响。


    ##### 6. 俄罗斯太空版 Skybot F-850 机器人


    `Skybot F-850`是俄罗斯的首位机器人宇航员，由俄罗斯`Androidnaya Technika`公司和代表俄罗斯政府的先进研究项目基金会共同研发。2019
    年 8 月，`Skybot F-850`搭乘“联盟号”`MS-14`宇宙飞船发射升空并抵达国际空间站。尽管其在国际空间站停留的时间不长，却是俄罗斯第一款太空版机器人。`Skybot
    F-850`使用“人类+AI”双重控制，既可以自主移动和工作，也可以在身穿控制服的人类操作员控制下工作。在地面测试中，它会使用各种标准的“人类”工具来完成转动阀门、开锁、焊接等各项任务，同时也会使用各种交通工具，无论是摩托车还是越野车都能够驾驶，俄罗斯的最终目标是让它学会开航天飞机。`Skybot
    F-850`拥有一个正值壮年的成年人拥有的一些体能基础，如提重物、俯卧撑、匍匐前进等，充分体现了俄罗斯特色。此外，研究人员还为`Skybot F-850`开发了一套智能语音交互系统，可以进行各种场景的对话。


    ##### 7. 空间智能机器人发展小结


    随着`AI`、混合现实等技术的发展和相关应用的研究，智能人机交互在航天员辅助操作和独立获取信息等方面的巨大优势已经显现出来。面向国际空间站等有人值守空间设施建设以及正式运营过程中与航天员和谐共处及自然交流，对航天员任务执行情况、日常生活情况进行在线监控并实时提供提醒和指导以及缓解航天员压力和负荷的实际需求，与空间设施内外固定的各类监测设备/传感器、航天员配备的各类可穿戴设备/传感器相比，空间站智能机器人具备更强的移动、认知、交互、协作以及学习能力，预计在不远的将来，空间站智能机器人能够带来以下更加优质的服务：


    ①在航天员执行任务过程中，智能机器人能够实时监测、识别航天员的动作、行为并监测任务完成情况；当航天员遇到问题和困难时，及时提供相关专业知识及工作指导。


    ②持续观察航天员在空间设施内的饮食、锻炼、休息等日常生活情况，以及航天员的身体、心理健康状况；发生异常时能够及时提醒并提供建议，在必要时能够把异常情况及时通知地面人员，以提供救助服务。


    ③分担航天员在轨期间简单的手动操作工作，减少航天员工作量，提高航天员工作效率。例如，日常常规清洁和真空处理；工具和零部件库存盘点；工具校准；设备重新摆放；食物准备和清理；空气、水质量检测等。


    ④监控空间设施运行情况，辅助航天员或与航天员协同完成空间设施运行维护任务。


    ⑤与航天员进行自然交流；针对航天员具体情况提供个性化、定制化服务，并根据航天员需求，与家人、地面人员进行多种方式的沟通。


    为此，航天员和智能机器人需要组成一个更复杂的、相辅相成的智能人机系统，二者需要通过自然、高效、频繁的交互（包括信息交流、物理空间中的行为互动，以及两者交互的集成）才能实现二者协同完成任务以提高任务完成的效率并降低风险。智能机器人需要具备更加强大的目标识别和状态估计能力、自由移动能力、多模态信息融合的灵巧操作能力和自适应人机融合能力。研究人员可能需要着重对智能机器人的本体小型及柔性技术、感测感知及认知技术、决策规划及控制技术和人机交互与写作技术展开研究。


    #### 4.2.2 空间 VR/AR/MR


    `VR`/`AR`/`MR`技术已经用于空间机械臂的操作、航天员的训练、国际空间站的日常工作等。航天员可以通过佩戴头盔式`AR`设备提供辅助信息的指导来完成在轨任务。此外，`NASA`还使用`VR`技术实现了太空虚拟旅程等逼真、沉浸式的应用，使观众真正获得身临其境的满足感。随着`VR`/`AR`/`MR`技术在航天领域取得越来越多的成绩，人们也认识到面对地面无法开展的物理试验验证环节以及不可逆的操作环节，可以借助此类数字现实技术的虚拟可视化、虚实融合等特点，来完善产品设计方案，加强试验验证分析，培训航天员或操控人员，完成未知空间探测等任务。


    ##### 1. 国际空间站 MSS 系统


    国际空间站的机械臂操作是一个劳动密集的过程。空间机械臂操作耗时长、操作复杂，需要地面任务控制参与。国际空间站移动服务系统（`Mobile Service System`，`MSS`）由移动基座系统、空间站遥控机械臂、末端灵巧机械手和移动传输器
    4 个部分组成，其主要任务是辅助空间站在轨组装、大型负载搬运、ORU 更换、航天员舱外活动辅助、空间站辅助维修等。`MSS`基于 3D 模型的实用性和实际相机视图的准确性，采用`AR`技术开发基于视频的、实时多视点图像比较和重构工具`EDGE`，利用站载摄像机的实时视频反馈和编码器位置姿态数据合成图像进行操作以及训练。


    ##### 2. 美国 NASA 用 VR/AR/MR 服务宇航员


    `NASA`从 20 世纪 80 年代就已经开始使用`VR`技术，而且他们所使用的头显设备看起来也极像现在的头显设备。与以前不同的是，`VR`可以用在任何工作的过程中，从航天员的训练到国际空间站的日常工作都在应用此技术。通过佩戴头盔式`AR`设备，航天员可以透过透明的显示器看到包含技术辅助信息的全息影像，在移动过程中解放双手，并与全息影像实现语音、手势和凝视等形式的交互，航天员可以通过这些辅助信息的指导完成在轨任务。同样，在航天领域，`MR`技术也提供了一种极具潜力的航天任务支持手段。


    2016 年欧洲航天局完成了为期两年的`Edc AR`（`Engineering data in Crossplatform AR`）项目研发。`Edc AR`项目开发了一个新的`AR`系统，该系统运行在`HoloLens`平台上，通过给航天员提供操作演示步骤，在减少航天员错误操作的同时，提高任务执行效率。


    ##### 3. 美国 NASA 用 VR 体验太空虚拟旅程


    `VR`技术是`NASA`利用人工智能技术制造一种逼真、沉浸式氛围，并有效融入在轨运行的多种航天器获取的观测数据，使观众真正获得身临其境的满足感。美国国家航空航天局天文学家和人工智能专家将哈勃、斯皮策太空望远镜观测到的可见光和红外等多源传感器信息进行融合，创造出一段穿越猎户座大星云的三维旅程。


    哈勃望远镜观测对象在可见光下发光，通常在几千度，而斯皮策望远镜则是对温度仅为几百度的较冷物体非常敏感。斯皮策的红外视觉穿透了模糊的尘埃，可以看到嵌入星云深处的恒星，以及更暗和更小质量的恒星，它们的红外线比可见光更亮。未来`VR`技术可以帮助人们更好地体验两个望远镜如何提供更复杂、更完整的星云图像。


    ##### 4. 美国 NASA 用 VR/AR/MR 进行航天器虚拟配置与维修应用


    马歇尔太空飞行中心从 1986 年起使用数字化企业互动制造应用软件（`Digital Enterprise Lean Manufacturing Interactive
    Application`，`DELMIA`），主要用于机器人技术、人机工效学、装配等方面。在阿瑞斯（战神）一型火箭的研制中，采用并行协同的可制造性分析，从可装配性、人机功效、装配环境模拟等方面开展了以下工作：


    ①装配仿真。验证操作序列和加工方法，优化装配过程，减少下游生产计划。


    ②人机工效学。识别危险操作，验证装配、测试、操作、维护过程中的可达性。


    ③工厂环境定义与分析。验证操作空间的大小，验证操作顺序和大尺寸加工方案，估算投资总额，识别装配过程中的难点。


    美国空军阿姆斯特朗实验室与宾夕法尼亚大学联合开发的人员训练与人员要素的设计评估（`Design Evaluation for Personnel Training
    and Human Factors`，`DEPTH`）项目，采用可视化和`VR`技术进行维修与保障分析的计算机应用系统。该项目的研究主要采用数字样机与 3D
    人体模型技术，用以提前确定维修过程内容与过程中的人力资源需求、生成训练辅助材料。通过将维修仿真结果输入交互式电子技术文档（`Interactive Electronic
    Technical Manual`，`IETM`），使其成为维修手册与维修训练资料的一部分，实现在一次仿真中完成多项与维修相关的任务，大大减少了重复性的开发工作。


    ##### 5. 空间 VR/AR/MR 技术小结


    未来`VR`/`AR`/`MR`相关技术在空天领域的应用发展趋势总结为以下几点：


    ①飞行过程虚拟仿真分析。大型复杂航天器在方案设计阶段，需要开展轨道与星座设计、动力学分析等工作；通过飞行过程虚拟仿真分析，可以在航天器研制早期发现总体设计中的问题，减少设计修改对详细设计等后续工作的影响。


    ②三维数字样机协同设计与校核。将传统的文字、图纸等平面构型描述转换为方案“立体”模型，在方案设计阶段提供一个“看得见、摸得着”的虚拟样机替代“功能不健全”的演示样机，减少不必要的设计余量、降低制造加工难度；在产品研制早期进行改进，避免在后期更改造成时间和资源成本的浪费。


    ③交互式虚拟展示、维修、训练。随着航天产品三维研制模式的不断推进，基于三维模型的虚拟现实仿真具有越来越重要的应用意义。此外，利用`VR`与仿真系统对操作人员进行培训、演练，给操作人员一种身临其境的感觉，以熟悉操作内容和过程，减少正式操作过程中的错误。


    在未来的应用研究中必须着力提高设备的交互性，因为某些虚拟操作任务只有当操作者的触觉反馈逼真时，完成任务的准确性才会提高。此外，还需要进行虚拟模型的建模与优化方法研究，只有这样才能够确保`VR`/`AR`/`MR`系统的效果最好，并使所获取的实验数据具备可类比性，实现真正意义上的应用。


    #### 4.2.3 脑机接口


    时值脑科学和人工智能两大领域在过去几十年各自都取得长足进展后，逐渐走向融合的关键节点———脑机接口（`Brain-Machine Interface`，`BMI`）技术。它不仅可以绕过感官和肌肉，为大脑与外界互动提供全新的高通量信道，甚至无须借助语言而实现人与人之间高效的交流协作。这不仅使得意识读写、记忆移植成为可能，甚至通过意识上传实现在数字世界中的永生等人类长久以来的梦想。


    '
