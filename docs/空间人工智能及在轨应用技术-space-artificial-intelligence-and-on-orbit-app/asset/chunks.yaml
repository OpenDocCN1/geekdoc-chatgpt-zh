    #### 2. 典型网络详细分析

    当前，各种深度学习网络层出不穷。谷歌 2017 年推出了`MobileNetV1`，是专门为移动设备设计的通用计算机视觉卷积神经网络，能支持图像分类和检测。它是一种极其高效的神经网络。


    2018 年 4 月，谷歌发布了下一代移动视觉应用`MobileNetV2`。`Mobile-NetV2`在`MobileNetV1`的基础上获得了显著的提升，并推动了移动视觉识别技术的有效发展，包括分类、目标检测和语义分割，代表了深度学习网络的发展方向。因此，选定`MobileNetV2`为典型网络进行分析。


    图 12-6 为`MobileNetV2`的流程框图，括号内依次表达为输入图像大小、特征图处理量、卷积核大小以及池化步进量。


    表 12-5 对`MobileNetV2`网络各层数据结构进行了详细的分析。


    根据`MobileNetV2`网络模型结构特点，对网络模型的数据结构进行了全面的分析，并以此为基础对加速器的计算和存储资源进行估计，最终确定网络模型前向推理加速器的总体架构。


