    与轨迹智能规划类似，由于参数不确定性难以离线建模，因此多项研究基于强化学习技术对不确定性进行在线识别逼近，实现智能姿态控制，提高姿态跟踪控制精度。Berenji等人利用神经网络及可微分的隶属度函数构造模糊逻辑控制架构，实现航天飞机的自适应姿态控制。该架构可通过调整隶属度函数自动适应新的控制要求，从而拓展该架构的适用范围，实现在模糊规则下航天飞机的姿态鲁棒控制。Schram等人与Van
    Buijtenen等人分别基于强化学习技术发展自适应姿态控制架构。这些控制架构利用评估单元估计姿态控制的效果并预测未来的控制性能，对控制系统的参数进行调整和更新，实现姿态自适应跟踪控制。Huang等人则利用深度神经网络对具有不确定性的参数进行估计，建立自适应鲁棒控制器进行姿态控制。该研究利用李雅普诺夫稳定性理论证明控制器的稳定性，保证航天器在不确定性和外部干扰下的姿态跟踪精度。针对多约束分布式航天器的轨道和姿态协同控制问题，Li等人利用自适应神经网络逼近系统的不确定性，再利用积分李雅普诺夫函数建立反馈控制器，也基于李雅普诺夫稳定性理论证明了分布式航天器姿态协同跟踪的稳定性。Ma等人则针对非合作目标抓捕时组合体姿态的稳定问题，利用强化学习技术对组合体的参数进行在线识别，实现卫星姿态的重新稳定。该方法可获得比传统PD控制更高的姿态稳定性。以上研究表明，强化学习技术对不确定性干扰下的航天器姿态自适应控制具有一定的普适性。


    ## 3.3.4 自主健康管理

    “健康状态”描述了设备及其子系统、部件执行设计功能的能力。“健康状态评估”主要是对利用各种测量手段获取的监测数据、历史数据等进行综合分析，利用各种评估算法对设备的健康状态进行评估，为设备的操作、决策提供依据。目前，我国航天器在轨健康管理主要依靠地面测控站，并通过人工判读大量遥测信息的方式获取航天器运行状态以进行管理。这种健康管理方法只能在有限的测控弧段内采用上注遥控指令的方式对航天器进行状态调整和控制，鉴于航天器遥测量大、参数类型多、变化复杂的特点，无法满足复杂航天器监测处理的时效性要求。

    自主健康管理涉及很多关键技术，包括传感器和数据检测技术、信息融合技术、数据传输与接口技术、数据预处理技术、故障诊断技术、故障预测技术、健康评估技术、决策支持技术等。下面选取几种关键技术进行详细介绍。


    ### 1. 数据采集和融合技术

    健康管理系统实时检测各系统和部件的工作状态，数据采集包括以下步骤：

    ①确定可以直接表征或可间接推理判断系统故障、健康状态的参数指标；

    ②采集各种类型的数据信号（传感器是实现健康管理各项功能的基础，为保证可靠性，需注意传感器的安装位置和数量，关键部位可设置多个传感器）；

    ③对采集的可用数据进行综合分析和分类处理。

    数据挖掘和信息融合技术作为新兴的数据处理技术，是进行故障诊断和预测、管理决策的依据。数据挖掘是通过仔细分析大量数据来揭示有意义的新的关系、趋势和模式的过程。数据挖掘出现于20世纪80年代后期，是数据库研究中一个很有应用价值的新领域，是一门交叉性学科，融合了人工智能、数据库技术、模式识别、机器学习、统计学和数据可视化等多个领域的理论和技术。数据挖掘一般流程包括数据准备、数据建模与数据挖掘、结果解释与评价。数据挖掘常用方法主要包括模糊方法、粗糙集理论、证据理论、人工神经网络、遗传算法和归纳学习等。信息融合技术考虑问题更全面，得到的结果更可靠，其是以最高效的融合方式把尽可能多的信息通过各种智能算法融合到一起，得到综合的评价结果。该方法主要包括人工神经网络、D-S证据理论、贝叶斯推理、模糊逻辑推论、神经网络融合等。

    在航空航天领域中，通常采用多个传感器进行目标感知。与单一传感器相比，多传感器系统可以改善数据关联能力，减少模糊或不确定性；可以覆盖更大的空间，从不同的空间位置观察目标，提供不同的观察角度，改进探测质量；可以提高空间分辨率，增加维数，获取目标不同状况下的数据，信息融合之后，能够提供目标状态更全面的信息。目前，多传感器融合技术主要应用于无人机着陆引导。例如，对视觉引导、GPS引导信息融合，利用惯性器件信息、自然景物图像特征、GPS位置信息等多传感器信息的融合实现引导目的。同样，在交会对接、空间目标跟踪等领域也采取了相应方法。


    ### 2. 故障诊断技术

    航天器系统的故障诊断技术能够快速检测并准确定位故障源，为后续的系统重构和容错控制决策实施提供依据。故障诊断技术是实现系统健康管理，确保航天器安全稳定运行的关键核心，其目的在于“准确定位故障、采取合理措施、辅助重构决策”。

    根据实现机理的不同，故障诊断技术可以分为3类：一是基于解析模型的故障诊断技术；二是基于信号处理的故障诊断技术；三是基于人工智能的故障诊断技术。


    #### 1）基于解析模型的故障诊断技术

    基于解析模型的故障诊断技术是最先发展起来的。该技术充分利用了航天器控制系统的动力学和运动学模型，能够从影响机理的层面给出准确的故障检测与隔离结果。建模误差、参数不确定性、未知扰动等不确定因素是困扰该技术的主要问题。航天器质量和惯量的时变特性和不确定性可能会影响该诊断方法的实用效果。与姿态动力学相比，姿态运动学模型是比较准确的。因此，在基于解析模型的故障诊断研究中，应尽量利用姿态运动学模型进行故障诊断。

    按照实现原理的不同，基于解析模型的故障诊断技术可以细分为基于观测器的故障诊断技术、基于滤波器的故障诊断技术、基于等价空间的故障诊断技术和基于集员估计的故障诊断技术。

    基于观测器和滤波器的故障诊断技术均是从状态估计角度出发，被控过程的状态直接反映系统运行的状态，通过估计系统状态，结合适当模型进行故障诊断。其基本思想是：重构被控过程状态，通过与可测变量比较，构成残差序列，再构造适当模型，并采用统计检验法，从残差序列中把故障检测出来，并做进一步分离、估计与决策。基于等价空间的故障诊断技术是通过系统的真实测量检查，分析冗余关系的等价性，一旦超出预先设定的误差界限，就说明系统中已经发生了故障。基于集员估计的故障诊断技术是近年来新兴的一类智能故障诊断技术，集员估计的目标是得到与系统模型、测量数据以及干扰和噪声相容的状态或参数的可行集。


    #### 2）基于信号处理的故障诊断技术

    基于信号处理的故障诊断技术是利用系统输出与故障源之间存在的关联关系（主要包括幅值、相位、频率与相关性）来检测和隔离故障，其原理实现简单、动态实时性好，但对潜在故障的诊断准确性不高。按照实现原理的不同，该技术可以细分为基于小波分析的故障诊断技术和基于经验模态分解的故障诊断技术。


    #### 3）基于人工智能的故障诊断技术

    基于人工智能的故障诊断技术是利用系统各变量之间存在的模糊逻辑、建立的因果模型、制定的专家规则以及确定的故障征兆案例等，来获得故障诊断模型；在此基础上，通过模仿人类在整个诊断过程中的思维方式和行为举措来自动实现故障诊断功能。

    与其他类别的航天器故障诊断技术相比，基于人工智能的故障诊断技术的优点在于避免了对特定的统计模型的依赖，能够有效利用专家经验以及被诊断对象的相关信息，通过特征提取、模式分析以及聚类分析等方法来实现故障的识别与诊断。特别是，以深度学习为代表的新一代人工智能技术，其采用的多隐层人工神经网络、优异的特征学习能力能够更本质地刻画航天器环境数据，从而能够发现航天器环境数据的分布式特征表示并提取其中的隐含故障信息。

    基于人工智能的故障诊断技术可以细分为基于知识和神经网络的智能故障诊断技术、基于定性模型的智能故障诊断技术和基于数据挖掘的智能故障诊断技术。基于知识和神经网络的智能故障诊断技术的基本思路是：汇总该领域长期的实践经验和大量的故障信息，模仿专家的推理方式并将其总结提炼成计算机能够识别的规则知识库；在此基础上，将需要诊断的实时数据与已生成的规则知识库进行分析和推理，从而推算出是否发生故障以及故障发生的可能位置；使用历史数据来训练分类器，通过对比实测值与分类器之间的差异特性，实现故障的检测与定位。基于定性模型的智能故障诊断技术的基本思路是：根据系统结构与组件之间的连接关系或各参数之间的依赖关系，建立诊断系统的结构、行为或功能模型；在此基础上，通过定性推理技术得到系统在正常情况下模型的预测行为，并通过其与系统的实际行为比对，获取系统的异常征兆；最后，在系统模型中搜索各种可能行为的状态假设，使得预测行为与实际行为一致，从而找到偏离正常行为的状态假设（系统的故障源）。基于数据挖掘的智能故障诊断技术分为两种基本任务，即预测型任务和描述型任务。预测型任务是根据已有数据，探寻这些数据当中蕴含的规律，来预测未知的数据。描述型任务是根据已有的历史数据，探索这些历史数据中存在的某种关系，利用这种关系来预测某种结果。


    ### 3. 健康状态评估技术

    健康状态评估的基本思想是对收集到的各类健康数据信息、低层级故障诊断/预测结果等进行深层次的融合，从而得到健康状态评估结果。健康状态评估方法主要包括基于模型的健康状态评估方法、基于层次分析的健康状态评估方法和基于人工智能的健康状态评估方法。


    #### 1）基于模型的健康状态评估方法

    基于模型的健康状态评估方法是通过建立被研究对象的物理或数学模型进行评估的一种方法。这种方法的优点是评估结果可信度高，但是建模过程比较复杂，模型的验证困难，需要随着评估对象的变化对模型随时进行修正。


    #### 2）基于层次分析的健康状态评估方法

    层次分析法是一种多指标综合评估的定量决策方法。它可以将一个复杂问题表示为有序的阶梯层次结构，并通过确定同一层次中各评估指标的初始权重，将定性因素定量化，从而在一定程度上减少主观的影响，使评估更趋科学化。


    #### 3）基于人工智能的健康状态评估方法

    基于人工智能的健康状态评估方法是基于数据进行学习、推理、决策以实现健康状态评估，主要包括贝叶斯网络、模糊逻辑和人工神经网络等。


    ##### （1）基于贝叶斯网络的健康状态评估方法。

    贝叶斯网络又称为信度网络，是贝叶斯方法的扩展，也是一种不确定知识表达模型。贝叶斯网络良好的知识表达框架，是当今人工智能领域不确定知识表达和推理技术的主流方法，被认为是目前不确定知识表达和推理领域最有效的理论模型。贝叶斯网络能够非常方便地处理不完整数据问题，易于学习因果关系，易于实现领域知识与数据信息的融合，适用于表达和分析不确定和概率性事物，可从不完全或不确定的知识或信息中做出推理。


    ##### （2）基于模糊逻辑的健康状态评估方法。

    当被评估对象呈现“亦次亦彼”的模糊特性时，传统的精确评估算法就难以适用，而模糊评判方法可以很好地解决这类问题。模糊评判方法的一般步骤：首先建立评估指标因素集和合理评判集，然后通过专家评定或其他方法获得模糊评语矩阵，之后再利用合适的模糊算子进行模糊变换运算，最后获得最终的综合评估结果。


    ##### （3）基于人工神经网络的健康状态评估方法。

    人工神经网络通过模拟生物神经系统的结构和功能，具有非线性、自适应、容错、并行处理等特点，以及可充分逼近任意复杂非线性关系的能力。它不但具有处理数值数据的一般计算能力，而且具有处理知识的思维、学习、记忆能力。由于具有良好的非线性映射能力，神经网络已广泛应用于模式识别、图像处理等各个领域，为健康状态评估发展开辟了一条新的道路。


    ## 3.4 未来趋势

    航天器智能感知与控制能力依靠智能技术而提升。多智能体系统的产生，需要使各个航天器更好地协作，进一步提升信息共享能力，找到适合在空间任务中应用的融合算法等，都是需要进一步研究的领域。

    将智能决策知识库、算法库分别构建出来，从而更好地研究及运用轨道中相关数据，确保更多仿真推演数据的应用变得更为高效。对智能决策框架的构建多加关注，尤其是基于反应式学习的智能决策框架有着更高的智能水平，对其的研究步伐应加快。目前，航天器依据目标运动轨迹捕捉到更真实信息的能力仍达不到，需要对该领域深化研究，并对多任务分配进行深入研究。

    进一步研究与环境接触时，在交互作用下如何操作学习，对学习环境与作业环境差异性算法可靠迁移问题要有更深入的探索。同时，为将算法相似场景中的学习效率提高，可采用加入合理噪声、对样本的分布进行设计训练等方法。

    未来，航天器有着相对简单的结构，依靠星上敏感器确定轨道，可自主控制轨道位置，具备导航、制导功能，还能有效对星上闭环进行控制，机动控制航天器的姿态轨道，能够完成星间相对导航，对目标更快速识别，且识别更精准，简单的任务可以自主规划机动路径，在轨道中就可以操作特定目标；可机动控制较为复杂的组合体，并且控制方式为全柔性分布式，感知环境变化趋势，并能对星上异构数据融合分析，决策将更为优化，环境探索可自主完成，并能依据探索结果不断自我修复、自我提升，进而将自主执行能力增强（尤其是面对复杂任务时）；可以结合使用多个智能体，实现信息共享，预测与感知态势，群体决策在该等级中成为现实，并且任务分配更加自主化，可依据需求分配任务，实现协调操作，可群体协作完成复杂环境中的多项任务。


    # 第4章 空间智能人机交互发展状况

    人机交互，顾名思义是指人和机器之间的互动。在早期，针对人和各种各样的机械、设备之间交互模式的多学科研究领域，研究人员提出了人机交互（Human Machine
    Interaction，HML）的理念。在当今智能时代背景下，随着现代化信息技术的飞速发展，互联网+、云计算、商业智能等新一代应用被广泛普及，人机交互的概念逐渐向日常使用的个人计算机延伸，因此人机交互的概念也就由HML更多地向HCL（Human
    Computer Interaction）发展。随着载人航天、深空探测、卫星导航等空间任务逐步开展，为了把握智能时代人机交互的机遇，提高空间技术和在轨应用能力水平，人们开始将智能人工交互技术应用到空间技术领域，并对此展开了广泛的研究。


    ## 4.1 技术内涵


    ### 4.1.1 人机交互

    人机交互，简称HCL或HML，是一门研究系统与用户间交互关系的交叉学科。其中，系统既可以是各种各样的机械、设备、计算机，也可以是计算机化的系统和软件。人机交互的发展历史，是从人适应计算机到计算机不断地适应人的发展史。传统的人机交互研究主要关注如何去改善人机互动界面的设计、实现和评估，包括接口稳健性、使用直观性等功能需求。

    传统人机交互的发展经历了以下4个阶段：

    ①手工作业阶段。在早期的手工作业阶段，用户手工操作计算机，采用机器提供的方法（如计算机直接能够理解的二进制代码）去使用计算机。此阶段的方法在当今智能时代的人们看来，是一种效率十分低下且笨拙的方法。

    ②作业控制语言及交互命令语言阶段。在此阶段，用户可以使用批处理作业语言或交互命令语言与计算机打交道，这仍然需要计算机的使用者记忆许多命令。此阶段方法的缺点是需要用户必须具备较高的专业能力，但是相比于手工作业阶段，已经可以使用较为方便的手段来调试程序，并了解计算机的执行情况。

    ③图形用户界面（Graphical User Interface，GUI）阶段。在此阶段，允许用户使用鼠标等输入设备操纵屏幕上的图标或菜单选项，以选择命令、调用文件、启动程序或执行其他一些日常任务，帮助用户把抽象的计算机程序具象化。此阶段的方法使得不懂计算机的普通用户也可以熟练地使用计算机，自此GUI开始步入非计算机技术背景用户的工作生活中，开拓了用户人群，GUI的出现使信息产业得到空前的发展。

    ④网络用户界面阶段。在此阶段，出现了如搜索引擎、多媒体动画、网络聊天工具等新的技术，其中以超文本标记语言HTML及超文本传输协议HTTP为基础的网络浏览器是此阶段的代表，由它形成的万维网已经成为当今互联网的支柱。

    新时代、新技术、新应用对人机交互都提出了新的要求，人机交互的研究内容也逐渐从心理学层面转到社会学层面、从微观转向宏观、从交互转向实践、从虚拟转向现实、从单调转向智能。与此同时，随着人工智能技术日益广泛地融入人类生活的各个领域，人机交互技术和人工智能技术开始深度融合，人机交互也从原始的用户图形界面交互逐步向语音交互、手势识别、脑机接口等方向拓展，使得人机交互的智能化程度不断提升，智能人机交互技术变得无处不在、无时不在。


    ### 4.1.2 智能人机交互

    随着计算机技术和人工智能技术的进步，人机交互技术的研究开始向智能人机交互转变。智能人机交互是利用智能方法进行信息识别与处理，实现人与计算机、机器人、智能体高效信息传递的技术。智能人机交互与认知学、人机工程学、心理学等学科领域有密切的联系，也指通过电极将神经信号与电子信号互相联系，达到人脑与探测器互相沟通的技术。

    以虚拟现实（Virtual Reality，VR）为代表的计算机系统的拟人化和以手持电脑、智能手机为代表的计算机的微型化、随身化、嵌入化，是当前计算机的两个重要的发展趋势。智能人机交互技术利用人的多种感觉通道和动作通道（如语音、手写、姿势、视线、表情等输入），以并行、非精确的方式（可见或不可见的）与计算机环境进行交互。

    常见的智能人机交互技术包括手势识别、智能语音交互、脑机接口、虚拟现实技术、增强现实技术、混合现实技术。下面分别进行详细介绍。


    #### 1. 手势识别

    手势识别（Gesture Recognition）是一种融合先进感知技术与计算机模式识别技术的新型人机自然交互技术。计算机通过识别人的手势，让用户在无须直接接触设备的情况下，就可以使用简单的手势与计算机进行交互。手势识别作为智能人机交互的重要组成部分，其研究发展影响着人机交互的自然性和灵活性。

    最初的手势识别人机交互技术利用数据手套等有线设备连接用户与计算机系统，以检测手和胳膊各关节的角度和空间位置，并将其手势信息完整地传输至手势识别系统。这种依靠外部设备进行交互的方法有着准确性高的优点，但所需的外部设备往往价格昂贵，并且在很大程度上阻碍人们手势的自然表达方式。其后，基于计算机视觉的手势识别人机交互技术应运而生，此类技术采用计算机视觉处理算法对视频采集设备拍摄到的手势图像序列进行处理，以达到手势识别和人机交互的目的。但在现实应用中，手势通常处于复杂的环境下，存在光线过亮或过暗、手势采集距离不同等各种复杂的背景因素，这导致手势识别的最终结果不准确，对人机交互的效果产生影响。此外，手势识别也可以认为是让计算机理解人体肢体语言的一种手段，因此识别人的姿势、步态、行为也是手势识别的分支。由此，人机交互的研究理念逐渐从“以系统为核心”转变为“以用户为核心”。


    #### 2. 智能语音交互

    智能语音交互（Intelligent Speech Interaction）是人机交互发展中的又一革命性交互方式，是基于语音识别（Automatic Speech
    Recognition）、语音合成（Text to Speech）、自然语言处理等技术，赋予计算机“能听、会说、懂你”式的智能人机交互功能。

    最早的语音交互是交互式语音应答（Interaction Voice Response）系统，包括拨号提示、传真提示、语音信箱等。这种语音交互方式应用范围较窄，很难解决生活中的许多实际问题。随着智能时代AI技术的进步，出现了Siri、小度、小爱同学等移动端语音交互APP，给人们的日常生活提供了很大的便利；语音交互形式也从一问一答的机械对话进阶至更为流畅的多轮对话，甚至还能识别多国语言和地区方言，这使得语音交互在体验感和灵活程度上有了质的提升。

