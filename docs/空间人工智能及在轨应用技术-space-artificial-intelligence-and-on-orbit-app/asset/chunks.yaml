    \n13.1　遥感目标检测识别\n\n13.1.1　光学遥感目标检测\n\n光学遥感卫星成像数据量大，感兴趣目标的遥感成像结果一般具有稀疏特性，采用传回地面进行处理的方式势必会占用大量星地通信带宽，降低星地网络通信效率。星上在轨实时检测识别技术能够有效地解决这一问题，近年来已经成为当前遥感领域的研究热点。基于光学遥感图像的在轨目标检测识别技术能够有效地提高卫星的使用效率，并及时发现陆地、海面感兴趣目标，相比于SAR等电子侦察手段具有抗干扰能力强、目标切片可译读性高、场景适应广泛等优点。\n\
    \n早期的在轨实时检测识别技术主要应用于SAR图像，近几年随着光学遥感分辨率的提高，提出了大量光学遥感舰船目标检测技术。随着计算机的计算能力提升和数据挖掘技术的发展，机器学习方法在环境监测、图像分类、目标检测识别等遥感影像应用研究中逐渐增多。机器学习方法其本质是运用计算机系统强大的计算能力，构建复杂算法模型，借助大量的数据训练，使算法模型能够自发模拟人类学习行为，并对模型参数不断进行改善，从而实现人工智能的一种思想，其核心可归纳为算法、数据及计算能力3个方面。因此，现有的基于机器学习的应用关键在于选择合适的算法模型，获取海量数据，将各种异构计算资源（GPU、CPU、FPGA、DSP等）合理利用，设计出性能最优、能耗最小的数据处理平台。"
