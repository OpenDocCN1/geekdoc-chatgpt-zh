    #### 2）性能分析


    ##### （1）实时性


    系统实时性指标获取方法为：待处理数据输入完成时为起始时刻，最后的识别结果输出完成时为结束时刻，最后统计该段时间内检测出的目标个数进行处理实时性计算。统计4景图像的处理时间及检测识别出的目标个数，最后通过计算1
    s时间能够检测识别的目标个数衡量系统实时性。


    由于检测过程中会对虚警目标进行鉴别，而每幅图像基于形态学匹配检测的时间不定，检测到的目标个数也不定，导致目标鉴别消耗的时间不同，因此不同场景的图像处理时间会有差异。由表13-9可知，每个目标的提取时间为9
