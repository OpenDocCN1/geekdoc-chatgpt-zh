    ## 13.3　在轨自主联合任务规划

    在轨自主联合任务规划技术面向侦察监视、成像、气象水文、天基预警、中继通信等卫星系统的星间协同机制、运行模式、工作流程，提出在轨自主联合任务规划模式，构建在轨自主联合任务规划的架构，充分发挥卫星的在轨信息处理及自主规划能力，更好地满足应急协同响应的应用需求。同时，针对典型任务保障模式与应用场景，研究该系统的典型运行模式，包括陆地目标广域搜索发现、陆地静止目标区域巡查、海洋移动目标区域巡查等。


    ## 13.3.1　星群自主协同运行模式研究


    ### 1.自主协同运行的基本特征

    自主协同运行的对地观测星群是指可以在没有或很少依赖于地面系统的支持下，具备自行协作完成观测任务能力的星群。其根本特征为能够主动感知变化的、不确定的系统及环境状态，并根据总的观测任务目标，自主规划和协同行动。其中，为每颗卫星发出控制指令序列者，是在轨的决策控制中心，而不是地面的测控支持中心系统。这种“智能移位”本质上是将原先由地面系统所承担的测量、决策、规划、调度和控制功能，及其所具备的自适应性、自组织性和智能性等特征，转移到在空间运行的各个卫星上，运控人员的经验与智慧则逐步由人工智能来取代。


    无论是对现有的（或规划中的）空间系统进行归纳分析，还是对未来发展趋势进行符合逻辑的推断，其结果均表明，星群的自主性可呈现在多个不同的层次上，并分布在两个极端之间：一端是完全被控，即由地面系统完全控制卫星的轨道与姿态及其工作模式等；另一端则是完全自主，即卫星系统仅接受处于抽象层次的任务描述指令，就能够完全自主地规划并实施任务执行的每一步骤。当前的卫星系统基本上是贴近于前者，其自主程度相当低，而未来发展趋势则是不断向后者扩展，最终达到近乎可完全自主运行的程度。


    ### 2.自主协同运行的总体功能要求

    在总体功能上，对地观测星群的自主协同可体现在自主协作对地观测上。具体向下分解，系统的各种不同功能和不同层次的实体均可被赋予自主能力。它们不仅仅是将地面测控系统的诸多功能移植过来，而且呈现出新的系统构成模式和运营策略，自主、灵活、自适应性和稳健性等是其基本特征。下面对其具体功能要求进行介绍。


    ①自主任务管理与生成。任务通常来源于两个方面：其一，地面运营者或用户发出的任务需求，如图13-48所示；其二，面向系统顶层的抽象任务目标。例如，在具体的任务执行过程中，根据观测对象的态势变化，自主选择新的观测目标并生成新的观测任务等，如图13-49所示。


    ②自主任务规划与调度。在系统构成体系中，各层次上的实体均可有其自主规划和调度的具体内容。自上而下，任务的分配则是从抽象到具体的过程，即根据顶层的多个任务目标，依据当前系统、环境以及观测目标的状态（如资源使用、观测几何、数据下传窗口、带宽等条件），规划与调度的算法将相应的任务内容分配到各个实体单元。例如，确定待观测的目标，确定哪些卫星实施观测、各卫星在哪些时段进行观测，对多卫星平台及其遥感器的轨道机动、姿态调整进行规划调度，安排遥感器的规划视场、频段、分辨率、确定能源使用策略等，力图使观测效益达到最佳化。


    ![](images/txt017_72.jpg "pagenumber_ebook=320,pagenumber_book=309")


    图13-48　地面上注任务模式


    ![](images/txt017_73.jpg "pagenumber_ebook=320,pagenumber_book=309")


    图13-49　在轨自主生成任务模式


    ③自主状态感知与检测。主动监测系统中各种实体的状态信息以及互动信息。例如，检测星群中各卫星的相对位置与姿态，为其自主控制、构型保持等提供必要信息。当观测目标发生变化或出现新的事件时，自主调整卫星遥感器的观测模式和参量。


    ④在轨信息处理与分析。无论是初步数据处理，如遥感信号的滤波、增强、辐射度校正和几何校正，还是高级数据分析，如对观测目标的主题分类、态势分析和预测、变化事件的识别与通告等，均由在轨系统完成。


    ⑤基于模型的预测。通过对历史的和现时的态势进行分析，解释所发生的有意义的事件，推断未来的发展趋势。例如，根据卫星平台的轨道预报模型和目标的运动模型，以及系统当前状态，预测未来大致的观测窗口、观测状态和条件等，并由此可发起和维持观测活动的进行。


    ⑥自主数据分发。根据观测数据的分析结果，以及用户对信息的需求或兴趣类型，主动下传最有价值的数据。


    ⑦自主控制。除接受上层任务规划和调度的控制指令外，卫星平台及遥感器亦可具备一定的自主控制能力，如星群的分布式相对控制、重构控制、碰撞避免、卫星与遥感器协同控制等。


    ⑧自主构型保持与重构。星群根据任务需求，自主进行空间构型保持、构型变换（或重构），完成卫星的淘汰、替换与升级等活动。


    ⑨在轨星务管理。自主执行星群运行管理的常规动作，如异常情况的自主监测、鉴别与恢复以及软件的加载、卸载与管理。


    ⑩自主能源分配与调度。根据能源的现状、待执行的多个任务及其所需的能源，整体协调系统资源的消耗。


    ⑪稳健任务执行。系统具备相当的灵活性和知识水平来执行事件驱动的命令，并在执行过程中进行局部的改进和对异常进行响应。


    ### 3.自主协作运行模式实现的主要机制

    星群自主协作运行模式的实现，主要得益于多种计算机技术和人工智能技术的引入，如有关Agent和Multi-Agent系统（MAS）的理论和方法、专家系统等。其中，软件Agent和MAS理论方法的引入，已成为主要技术途径，其前景被普遍看好，也是当前在轨运行和计划的各类空间系统中运用最多的一项综合性技术。


    Agent和MAS的行为，是面向一定的任务目标，依据其他Agent以及周围环境的状态，并基于自身状态决策机构来规划实施的。Agent有能力与其他Agent协作来解决共同面临的问题。基于MAS的决策和控制方法使得能够集成许多传统的和现代的模型，包括人工智能和非人工智能模型。到目前为止，对Agent和MAS的定义给出了很多，尚未统一明确。研究人员认为，凡具有一定的自主行为或智能特征的实体均可被视为Agent，而由多个Agent构成的系统，即为MAS。


    因此，自主协作运行的星群本质上即为MAS，只不过前者指的是物理实体，而后者则为系统抽象描述模型。故而，提出将计算机科学、人工智能以及机器人等领域中广泛研究的Agent或MAS理论与技术引入对地观测星群，实质上是研究与实践如何通过赋予系统自适应性、自组织性以及智能性等，来构建自主协作运行的分布式空间系统。


    ### 4.基于MAS的星群自主协作运行特征分析

    从面向MAS的角度进行分析，自主协作运行的对地观测星群的主要特征包括以下几项：


    ①自主性。如前所述，离开了地面测控系统的支持，星群的运行，无论是系统整体还是局部实体的功能，在诸多方面均采用自主工作的模式。


    ②社会能力。系统中的多颗卫星，相互之间具有各种控制信息和数据信息的交互和耦合，为完成总的任务目标或局部任务目标，需要相互协作。


    ③反应能力。无论是观测对象、观测环境的变化，还是系统内部实体状态的变化，星群均能够通过遥感器或状态监测器进行感知并及时做出反应，如突发事件驱动的任务生成、卫星损失后的系统重构、异常事件发生后的应急处理等。


    ④自发性行为。星群实施观测任务，并非是完全被动地执行上层发来的指令，而是在观测过程中，能够及时感知观测对象的变化或突发事件，自发生成新的观测任务，并规划和调度系统中的各类实体予以执行。


    ⑤预动性。在卫星的软件系统中，可配置多种状态预测模型，如卫星轨道预报模型、实体可靠性预报模型、星群重构的能源消耗模型等，使得对系统在未来时段内可能发生的变化具有一定的预见性。系统在进行任务规划时，则能够合理地规划和调度，使系统达到观测任务目标的最优化，并能够主动避免出现燃料耗尽、电源不足等情况。


    ⑥推理决策能力。系统能够根据自身、观测目标和环境的当前状态信息和历史信息，以及所掌握的知识，对当前的态势给予进一步的解释和分析，提炼和推理出更多的信息和知识，并对系统及其实体的行为进行决策。例如，对观测目标进行识别和分类，根据故障现象推断其原因等。这些推理决策能力是在知识库和模型库的支持下，通过基于规则的专家系统、人工神经网络以及基于模型的推理等人工智能技术或非人工智能技术来实现的。


    ⑦规划与调度能力。规划与调度能够在系统的各个层次中使用，总体任务目标可以采用层次化的方法分解成为各个实体的具体任务。例如，运营者发出的层次任务目标，可以分配到系统中各个卫星系统的任务中，进而又可以分解为各卫星子系统的任务，最终形成多层规划与控制模式。在每一层次，均可由一个独立的或多个Agent来实现规划调度，且可采用不同的协同结构。


