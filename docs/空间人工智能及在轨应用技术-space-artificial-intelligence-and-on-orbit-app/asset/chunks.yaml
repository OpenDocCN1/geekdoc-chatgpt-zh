    将加速器部署在FPGA中，编译报告如图12-20所示。分析报告得出，FPGA的主要硬件资源占用达到了较好平衡，乘法器（DSP48e）使用3 467个，占用率96.3%；内部存储器（36k
    BRAMs）1 201个，占用率81.5%；逻辑资源（LUT）396 749个，占用率91.59%；总功耗为7.629W，减去PCIe接口功耗2.619W，加速器功耗为5.01
    W。


    ![](images/txt016_43.jpg "pagenumber_ebook=249,pagenumber_book=238")


    图12-20　FPGA编译报告


    由表12-11可知，同样的输入图像数据，该加速器能效比为CPU-I7-6700的600倍以上，得益于设计的轻量化、紧凑型计算和存储单元。与当前业内采用FPGA实现CNN的加速方案进行了对比，相同条件下，优势明显。


