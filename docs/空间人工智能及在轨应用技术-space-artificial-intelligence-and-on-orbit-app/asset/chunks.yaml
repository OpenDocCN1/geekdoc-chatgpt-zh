    Flash 进行权重参数缓存和程序数据。AI 加速芯片具有适用于深度学习前向推理网络模型的计算架构、计算能力强、能效比高等优点，主要完成基于深度学习的目标检测和目标鉴别功能。


    为了便于与前端载荷和后端发射通道的匹配，数据输入输出接口均通过实时处理单元进行连接，根据载荷输出数据率和接口形式，结合数据处理能力，灵活配置输入处理单元数量，同样可根据数据传输通道配置输出接口。处理单元数量配置不同决定系统输入输出能力。


    ## 11.3 大数据技术


    近年来，随着卫星技术的发展，卫星数据以几何级数的速度快速增长。这些时效性强、覆盖范围广、多类型、高分辨率的海量数据被用于地表信息提取、资源与生态环境变化监测等诸多领域，发挥了巨大作用。但是，卫星数据量的快速增长和数据类型的不断丰富，也对数据快速精准解译方法与技术提出了更高要求，原始拍摄数据大量堆积与可用信息提取不足的矛盾日益突出。


    ### 11.3.1 样本库


    建立多源图像样本库，首先收集可见光图像、多光谱图像、高光谱图像、红外图像和 SAR 图像等各种传感器图像，然后对图像进行筛选和分类，最后建立多源图像样本库。建立多源图像样本库，优势在于方便标定数据，有利于目标检测算法验证。拟建立的典型目标特性库包含以下几种：


    ①几何知识库，即各种军船、民船、飞机、车辆的几何参数、特征等。


    ②特征库，即对可见光图像、多光谱图像、高光谱图像、红外图像和 SAR 图像等各种图像进行筛选和分类，建立各种目标的特征库。


    ③光谱库，即基于多光谱图像、高光谱图像的数据库。


    可采用生成式对抗网络`GAN`增加多源图像的数量和复杂度，便于系统神经网络的训练和后期整个检测识别系统的测试。


    如图 11-10 所示，为提升基于深度学习的人工智能网络模型的性能，需利用大量样本切片对深度学习模型进行训练，以获取泛化外推能力优异的模型参数。因此，需要收集大量图像数据，建立数据量庞大的图像感兴趣目标的样本库。


    ![](img/txt015_16.jpg "pagenumber_ebook=191,pagenumber_book=180")


    图 11-10 目标切片图像


    国内典型星载样本库构建：可见光方面，基于`GF-1`、`GF-2`、`JL-1`等 1 000 余景国产遥感卫星图像，建立包含飞机、船只、车辆、海港、岛礁、云等目标的全色光深度学习样本库，完成
    10 000 余个样本实例标注；采用迁移学习的训练方法，通过交叉验证与网格搜索策略，获得网络训练最优超参数集合；对云、岛屿、人工建筑和船 4 类目标查准率达到
    98%。SAR 方面，基于`GF-3`、`RadarSat-1`、`Sentinel-1`等国内外 SAR 卫星图像数据，构建 SAR 舰船检测数据集，该数据集包含
    45 000 舰船切片，可满足星载 SAR 图像的舰船目标检测、识别、训练和测试。


    ### 11.3.2 网络模型训练


    基于深度学习的人工智能分为训练与预测两个过程。首先根据人工标定的目标图像切片作为`CNN`分类器的学习输入，经过训练后得到对应的分类器，然后根据得到的分类器对待分类目标切片进行预测，实现目标鉴别。


    深度学习是典型的数据驱动的“表示学习”范式———由数据自提取特征，计算机自己从训练库中发现数据特征规则，进行自学习。因此，训练库中样本的代表性、对复杂情况的覆盖面、样本的丰富度直接决定了深度学习算法的优劣。船舶遥感影像质量除了受到复杂多样的成像因素（如天气状况、气候条件、太阳角度、成像视角、海面高光反射等），还受到复杂背景（如不同级别海浪）的影响。


    研究在有限的人工识别样本以及舰船三维模型的基础上，训练样本合成与仿真模拟技术，实现对舰船图像原始样本的合理而有效的扩展，从而构建代表性强的遥感船舶图像样本库。


    很多研究表明，与传统方法比较，`CNN`可以学习到更高效的高层图像特征，但是训练一个识别率高、泛化能力强的`CNN`模型，往往需要大量有标签样本。目前，光学遥感图像数据集相对有限，而多数深度学习模型是面向自然场景图像识别任务，研究充分，数据量大，可通过采用迁移学习的方法，将大样本数据库上预训练好的模型应用在其他不同空间尺度不同传感器的少样本应用中，是提升舰船样本应用效率，提升系统扩展能力的关键技术。


    训练深度学习模型计算量非常庞大，严重影响了深度学习模型的生产使用。确保深度学习模型能够快速的训练是深度学习模型有效性的必要条件。如图 11-11 所示，在已有的硬件条件下，采用当前先进的训练平台`Pytorch`，使用大规模分布式计算集群的强大计算能力，利用模型可分布式存储、参数可异步通信的特点构建分布式深度学习模型训练技术，实现深度学习模型的快速训练。


    ![](img/txt015_17.jpg "pagenumber_ebook=192,pagenumber_book=181")


    图 11-11 基于`Pytorch`的模型训练示例


    ### 11.3.3 样本共享服务平台


    针对大规模样本共享服务问题，设立样本开源共享平台，支持多维语义查询、统计分析、数据共享服务。样本共享服务平台的总体框架如图 11-12 所示，包括基础设施层、数据存储层、数据服务层和应用层。其中，基础设施层包括分布式存储阵列、GPU
    集群、文件系统、数据库系统及网络环境等。


    ![](img/txt015_18.jpg "pagenumber_ebook=193,pagenumber_book=182")


    图 11-12 样本共享服务平台总体框架


    以分布式弹性大规模存储阵列支撑全球范围海量遥感影像样本集的高吞吐和可扩展管理，以 GPU 集群支持深度学习模型计算和在线多并发访问快速响应需求。数据存储层支持多尺度多类型样本数据的存储、扩展、维护与版权保护。服务层支持遥感影像样本的多维语义查询和样本数据服务发布，对外提供具有互操作能力的数据访问服务接口。应用层允许用户进行开放注册并根据版权协议进行权限管理，在此基础上提供样本的录入、校验、多维语义查询、数据获取和可视化功能服务，并基于时空数据关联分析、样本综合统计分析、知识发现等数据挖掘模型为用户提供样本的在线分析与应用。


    ## 11.4 天基云计算技术


    针对星上数据处理能力限制问题，研究天基分布式快速智能云处理体系架构技术，包括弹性可重构天基云处理网络拓扑结构、海量数据分布式协同处理技术、天基云处理资源智能管理与调度技术，解决空间威胁目标海量探测数据近实时处理需求与单颗卫星有限的计算能力之间的矛盾，满足天基快速智能云处理体系架构的高可靠性、高带宽、灵活可扩展性等需求。


    ### 11.4.1 天基快速智能云处理体系架构


    针对星上数据处理能力限制，需要发展天基分布式快速智能云处理体系架构技术，提供可满足近实时海量数据智能计算处理要求的硬件资源，并通过任务规划要求和星上硬件资源状态、任务等级约束，形成自适应架构，建立多星联合的异构计算、通信、存储体系。


    结合当前地面云处理的应用与研究，天基快速智能云处理的体系架构可以分为核心服务、服务管理和用户访问接口 3 层，如图 11-13 所示。核心服务层将硬件基础设施、软件运行环境、应用程序抽象成服务，这些服务具有可靠性强、可用性高、规模可伸缩等特点，满足多样性的应用需求。服务管理层为核心服务提供支持，进一步确保核心服务的可靠性、可用性与安全性。用户访问接口层实现端到云的访问。


    ![](img/txt015_19.jpg "pagenumber_ebook=194,pagenumber_book=183")


    图 11-13 天基快速智能云处理体系架构


    天基快速智能云处理核心服务层分为 3 个子层：基础设施即服务（Infrastructure as a Service，`IaaS`）、平台即服务层（Platform
    as a Service，`PaaS`）、软件即服务层（Software as a Service，`SaaS`），各层服务特点如图 11-14 所示。


    ![](img/txt015_20.jpg "pagenumber_ebook=195,pagenumber_book=184")


    图 11-14 `IaaS`、`PaaS`、`SaaS`服务特点比较


    服务管理层对核心服务层的可用性、可靠性和安全性提供保障。服务管理包括服务质量（Quality of Service，`QoS`）保证、安全管理、计费管理、资源监控等管理措施，对天基快速智能云处理的稳定运行起到重要作用。


    用户访问接口实现了云处理服务的泛在访问，通常包括命令行、网络服务、网络门户等形式。命令行和网络服务的访问模式既可为终端设备提供应用程序开发接口，又便于多种服务的组合。


    ### 11.4.2 弹性可重构天基云处理网络拓扑结构


    针对天基快速智能云处理体系架构的高可靠性、高带宽、灵活可扩展性等需求，开展弹性可重构天基云处理网络拓扑结构技术研究。如图 11-15 所示，传统的树型结构网络拓扑存在以下缺陷：一是可靠性低。若汇聚层或核心层的网络设备发生异常，网络性能会大幅下降。二是可扩展性差。因为核心层网络设备的端口有限，难以支持大规模网络。三是网络带宽有限。在汇聚层，汇聚交换机连接边缘层的网络带宽远大于其连接核心层的网络带宽（带宽比例为
    80∶1，甚至 240∶1），因此对于连接在不同汇聚交换机的计算节点来说，它们的网络通信容易受到阻塞。


    ![](img/txt015_21.jpg "pagenumber_ebook=196,pagenumber_book=185")


    图 11-15 传统的树型网络拓扑


    针对上述传统拓扑结构的缺陷，采用`VL2`、`PortLand`、`DCell`、`BCube`等新型网络拓扑结构，在传统树型结构中加入类似 mesh 的构造，使得节点之间的连通性与容错能力更高，易于负载均衡，节点更容易扩展。以`PortLand`结构为例，如图
    11-16 所示，整个网络可以由 5k2/4 个 k 口交换机连接 k3/4 个计算节点。`PortLand`由边缘层、汇聚层、核心层构成。其中，边缘层和汇聚层可分解为若干个`Pod`，每一个`Pod`含
    k 台交换机，分属边界层和汇聚层（每层 k/2 台交换机）。`Pod`内部以完全二分图的结构相连。边缘层交换机连接计算节点，每个`Pod`可连接 k2/4
    个计算节点。汇聚层交换机连接核心层交换机，每个`Pod`连接 k2/4 台核心层交换机。基于`PortLand`，可以保证任意两点之间有多条通路，计算节点在任何时刻两两之间可无阻塞通信，从而满足云计算数据中心高可靠性、高带宽、可扩展性等需求。


    ![](img/txt015_22.jpg "pagenumber_ebook=196,pagenumber_book=185")


    图 11-16 `PortLand`网络拓扑


    ### 11.4.3 天基海量数据分布式快速协同处理


    针对空间威胁目标海量探测数据近实时处理需求与单颗卫星有限的计算能力之间的矛盾，开展基于天基云处理架构的海量数据分布式协同处理技术研究，采用`MapReduce`、`Dryad`等分布式并行数据处理模型，能够支持规模扩展，屏蔽底层细节且简单有效。


    `MapReduce`模型由大量`Map`和`Reduce`任务组成，如图 11-17 所示。根据两类任务的特点，可以把数据处理过程分为`Map`和`Reduce`两个阶段：在`Map`阶段，`Map`任务读取输入文件块，并行分析处理，处理后的中间结果保存在`Map`任务执行节点；在`Reduce`阶段，`Reduce`任务读取并合并多个`Map`任务的中间结果。`MapReduce`可以简化大规模数据处理的难度：首先，`MapReduce`中的数据同步发生在`Reduce`读取`Map`中间结果的阶段，这个过程由编程框架自动控制，从而简化数据同步问题；其次，由于`MapReduce`会监测任务执行状态，重新执行异常状态任务，所以不需要考虑任务失败问题；再次，`Map`任务和`Reduce`任务都可以并发执行，通过增加计算节点数量便可以加快处理速度；最后，在处理大规模数据时，`MapReduce`任务的数目远多于计算节点的数目，有助于计算节点负载均衡。


    ![](img/txt015_23.jpg "pagenumber_ebook=197,pagenumber_book=186")


    图 11-17 `MapReduce`的执行过程


    `Dryad`采用了基于有向无环图（Directed Acyclic Graph，`DAG`）的并行模型，如图 11-18 所示。在`Dryad`中，每一个数据处理任务都由`DAG`表示，图中的每一个节点表示需要执行的子任务，节点之间的边表示两个子任务之间的通信。`Dryad`可以直观地表示出作业内的数据流。基于`DAG`优化技术，`Dryad`可以更加简单高效地处理复杂流程。同`MapReduce`相似，`Dryad`屏蔽了底层的复杂性，并可以在计算节点规模扩展时提高处理能力。


    ![](img/txt015_24.jpg "pagenumber_ebook=198,pagenumber_book=187")


    图 11-18 `Dryad`的任务模型


    ### 11.4.4 天基云处理资源智能管理与调度


    天基海量数据处理的执行性能受到网络带宽的影响，但是网络带宽是天基云计算节点集群的急缺资源，因此海量数据处理平台的任务调度需要考虑网络带宽因素。为了减少任务执行过程中的网络传输开销，可以将任务调度到输入数据所在的计算节点，因此需要研究面向数据本地性的任务调度算法，采用`HTA`（Hadoop
    Task Assignment）问题模型，该模型为一个变形的二部图匹配，如图 11-19 所示。其目标是将任务分配到计算节点，并使各计算节点负载均衡。其中，`si`、`tj`分别表示计算节点和任务，实边表示`si`有`t
    j`的输入数据，虚边表示`si`没有`t j`的输入数据，`wl`和`wr`分别表示调度开销。基于先均匀分配再均衡负载的思想，通过`BAR`算法快速求解大规模`HTA`问题。


    ![](img/txt015_25.jpg "pagenumber_ebook=198,pagenumber_book=187")


    图 11-19 `HTA`问题模型


    除了保证数据的本地性，天基云处理网络的作业调度器还需要考虑作业之间的公平调度。工作负载中既包括子任务少、执行时间短、对响应时间敏感的即时作业（如数据查询作业），也包括子任务多、执行时间长的长期作业（如数据分析作业）。研究公平调度算法可以及时为即时作业分配资源，使其快速响应。为了折中数据本地性和作业公平性，采用基于最小代价流的调度模型。如图
    11-20 所示，`wij`表示作业`i`的子任务`j`，`wij`和`c`、`r`、`x`、`u`的边分别表示任务被调度到计算节点、机架、数据中心和不被调度，每条边带有权值，并需要根据集群状态实时更新权值。当系统状态发生改变时（如有计算节点空闲、有新任务加入），调度器对调度图求解最小代价流，并做出调度决策。


    ![](img/txt015_26.jpg "pagenumber_ebook=199,pagenumber_book=188")


    图 11-20 Quincy 的调度模型


    为了使天基云处理平台可以在任务发生异常时自动从异常状态恢复，需要研究任务容错机制。`MapReduce`的容错机制在检测到异常任务时，会启动该任务的备份任务。备份任务与原任务同时进行，当其中一个任务顺利完成时，调度器立即结束另一个任务。针对异构环境下异常任务的发现机制，采用`LATE`（Longest
    Approximate Time to End）调度器，通过估算`Map`任务的完成时间，`LATE`为估计完成时间最晚的任务产生备份。


    # 第 12 章 共性技术


    本章将人工智能共性技术定义为算法模型、训练平台、计算平台、计算加速、样本库、AI 芯片等，涵盖人工智能算法、数据、算力及系统平台等基础要素。下面分别从算法模型、计算加速以及计算平台
    3 个方面展开阐述。


    ## 12.1 算法模型


    20 世纪 50 年代初期，人工智能追求研发出能够像人类一样具有智力的机器，研究界把这个称之为“强人工智能”，后续出现了专家系统。在特定领域运用人工智能技术，给人工智能发展注入新的活力，然而又带来了难以移植、成本昂贵等问题。1980
    年之后，机器学习成为 AI 研究的主流，研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构使之不断改善自身的性能。2000
    年左右，计算机科学家在神经网络研究基础上加入多层感知器构建深度学习模型，成功解决了图像识别、语音识别以及自然语言处理等领域的众多问题。近年来，在 IBM 等科技巨头推动下认知计算（Cognitive
    Computing）蓬勃发展，通过学习理解语言、图像、视频等非结构化数据，更好地从海量复杂数据中获得知识，做出更为精准的决策。机器学习是人工智能领域研究的核心问题之一，理论成果已经应用到人工智能的各个领域。机器学习算法通过模式识别系统根据事物特征将其划分到不同类别，通过对识别算法的选择和优化，使其具有更强的分类能力。


    探究人工智能领域内的相关概念，机器学习、深度学习、强化学习是驱动其快速发展的核心动力。人工智能最早出现，曾一度被极为看好；之后，人工智能的一些较小的子集即机器学习得到了快速发展；近十年来，机器学习领域内的另一分支———深度学习得到了广泛关注，造成了前所未有的巨大影响，成为驱动人工智能大爆炸的核心。


    ### 1. 人工智能（Artificial Intelligence），为机器赋予人的智能


    早在 1956 年夏天的达特茅斯学院智能研讨会上，人工智能的先驱们就梦想着用当时刚刚出现的计算机来构造复杂的、拥有与人类智慧同样本质特性的机器。这就是我们现在所说的“强人工智能”（General
    AI）。这个无所不能的机器，它有着人类所有的感知（甚至比人更多），我们所有的理性，可以像我们一样思考。


    人们在电影里也总是看到这样的机器：友好的，像星球大战中的 C-3 PO；邪恶的，如终结者。强人工智能现在还只存在于电影和科幻小说中，原因不难理解，人们还没法实现它们，至少目前还不行。


    目前能实现的，一般被称为“弱人工智能”（Narrow AI）。弱人工智能是能够与人一样，甚至比人更好地执行特定任务的技术，如 Pinterest 上的图像分类或者
    Facebook 的人脸识别。


    ### 2. 机器学习，一种实现人工智能的方法


