    ### 3）目标鉴别


    目标鉴别算法`YyNet-5`采用在`LeNet-5`经典算法模型基础上根据需求进行自主设计的方法完成。`YyNet-5`主要包含358个卷积核大小为3×3的卷积运算以及2048次乘加法运算，全部运算量为425
    984次乘加运算，最终输出结果为疑似目标的真假值。


    相对于`LeNet-5`算法模型，本研究通过分析SAR图像舰船目标的特征，将5×5的卷积核更改为3×3，在不影响目标特征提取能力的基础上，将卷积核参数量降低为原来的36%。`LeNet-5`算法模型可实现0～9
    10种数字的识别分类，将该网络定义为疑似目标真假鉴别网络，即只需要完成2分类，全连接层的参数量降低为原来的20%。为了实现模型训练快速收敛，将`LeNet-5`算法模型中的`Sigmod`激活函数设计成当前主流的`Relu`方式，大大简化了实现方法。与此同时，将输入图像数据大小由28×28扩展至32×
    32，并将卷积方式由“valid”模式更改为主流的“same”模式，输入图像数据目标如果大于32×32通过均值降采样的方法约束到输入图像切片大小内。


    ### 3.实现及性能分析


    #### 1）在轨实时实现


    ##### （1）实时实现


    SAR图像处理需要强大的处理能力，所用处理器性能的好坏直接影响处理性能，需重点考虑。当前能够在空间环境使用且自身具备抗辐照特性的器件硬件资源和速度均不能满足要求。因此，选用普通工业级高性能器件作为主处理器，通过系统设计保障模块适应空间特殊工作环境，实现目标提取功能。考虑系统成本、可靠性以及处理性能等多方面因素，采用模块关键等级差别设计思想，将该系统分为控制和处理两大部分。其中，控制部分作为关键模块，采用高可靠、抗辐照宇航级器件；处理部分作为执行模块，采用高性能、大容量常规器件，设计多种重构保障机制，保证在轨维护能力，有效降低成本，提升处理性能和可靠性。采用CPCI总线标准，6U标准板卡结构，支持多模块协同处理机制。系统的通用性、可靠性及扩展性强。


    该智能信息处理模块具有强大的处理能力，主处理器DSP峰值计算能力达到8000 MIPS，处理FPGA逻辑门数达到3250万门。输入图像大小为32768×32768，舰船目标提取时间小于10
    s；可实现在轨全时工作，整板功耗小于13 W，待机功耗小于1.5 W；具备主处理器程序和卷积神经网络参数数据重构能力，程序重构时间小于5 s，权重参数重构时间小于1
    s。


