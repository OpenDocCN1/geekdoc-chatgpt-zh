    取得上述成果的同时，也存在以下不足：上述目标鉴别网络较简单，无法满足多种目标精细分类的需求，后续可通过研究改进多分类网络实现。


    13.2　空间目标监测


    随着人类航天活动的增加，空间碎片会日益增加，仅美国空间目标监视系统编目和记录的直径大于5 cm的空间碎片累计就达38000多个。随着时间推移，这些空间碎片可能会对在轨航天器造成不可估量的影响。如果空间碎片与在轨航天器发生碰撞，将会直接导致其损坏或者解体。此外，空间碎片再入大气层，还将给人类带来不可估量的灾难。因此，有效快速地对空间碎片进行监测、管理和预报是构建太空安全环境的基石，已经成为各个航天大国的研究热点。


    空间目标监测平台主要分为地基和天基两种。由于不受体积、质量等因素的限制，地基观测平台可以实现较高的空间分辨率和较远的观测距离。我国的地基空间目标监视系统受布站区域的限制，不能实现对空间目标的全覆盖，而且存在监视的实时性不高和对中小尺寸碎片的探测能力有限的问题。因此，迫切需要天基监视手段去弥补。相比于地基平台，天基观测平台最大的优势是可以在地球大气层外的空间轨道上运行，进而不受国界、空域和气象条件的限制。同时，天基观测不受地球大气的影响，具有较高的灵敏性，可以减少光学可见期的影响，从而增加观测时间。因此，天基观测更可能获取长时间广范围的观测数据，满足我国国情及发展需要。


    近年来，基于天基平台的空间目标观测受到广泛的关注。西北工业大学的王虎等人提出了一种可同时实现三波段探测的多光谱光学载荷相机系统，可满足天基空间碎片观测系统需求。金小龙等人对空间碎片光谱特性进行研究，可以用来获取碎片材料等信息。中国人民解放军国防科技大学潘晓刚等人刻画并分析了天基观测的系统误差，设计相应方法有效抑制了观测和模型结构误差对观测精度的影响。


    空间碎片目标在轨实时监测的核心是“快”“准”“稳”。其中，“快”是指实时；“准”是指高准确率、低虚警率；“稳”是指应对复杂背景。地面已有的信息处理、目标检测跟踪方法面临巨大挑战，无法满足天基应用需求。由于上述问题和需求，切实需要一种空间碎片目标在轨实时监测处理方法，主要实现面向空间碎片监测的光学载荷数据的实时处理，将在轨实时处理得到的目标检测结果、天文位置等结果发送到数据传输系统下传给用户，实现空间碎片目标快速定位和管理。


    13.2.1　在轨实时监测系统


    1.系统设计


    如图13-38所示，在轨实时监测系统主要包含卫星平台、载荷、数传以及信息处理等功能单元，通过在轨实时处理技术，快速从载荷数据中提取空间碎片目标位置、亮度等信息，针对重点目标完成在轨自动跟踪和确认，并将处理结果下传至地面，进一步对目标进行编目和确认管理。


