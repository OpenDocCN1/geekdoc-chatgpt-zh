    由表13-6结果可知，在不同场景下，舰船目标的检测有效率均未超过60%，这类场景在进行疑似目标筛选分割过程容易形成虚警目标，因而在复杂背景下，基于形态学的传统目标检测算法适应性一般，会造成很大程度的误检。由表13-7结果可知，舰船目标的查全率均超过92%，尤其是基于机器学习的目标识别方法将系统查准率提升到97%以上。由此可见，机器学习对目标分类识别效果显著，有效提升目标检测识别的正确率。


    具体处理过程总结如下：通过对遥感图像进行背景噪声抑制，增强舰船目标相对于背景的灰度对比度，然后采用待检区域-邻域直方图方差比对的方法结合分割标注结果区分出疑似目标区域，提取出疑似舰船目标。同时，采用圆形度等形状特征对疑似目标进行鉴别，进一步有效地判读出舰船目标。最后，通过采用深度学习网络模型`VGG-16`，对上述传统方法获得的检测结果做进一步的分类识别，在背景复杂、虚警率高的情况下，能够有效判读出舰船目标以及其他背景干扰项。本方法具有易于在星上嵌入式硬件实现的优点，可实现1
    s最多检测识别20个目标切片，最高功耗70 W，满足低功耗、小型化光学遥感图像在轨舰船目标实时检测处理需求。


    在取得以上成果的同时，上述方法也存在许多不足，需要改进，具体总结如下：首先，由于遥感数据分辨率较低，目标特征表现相对高清图像较弱，再加上样本数不够丰富，上述训练模型存在过拟合的风险，后续需进一步研究样本数量与质量对数据模型训练效果的影响，使模型在分类种类、精度和鲁棒性方面有更好的提升。其次，在试验中仅测试了一种CNN模型，不同模型对性能的影响缺乏实际效果的说明。最后，网络剪枝可以有效降低参数量，稀疏网络，降低处理计算量，在后续运算效率上还有很大提升空间。


    ## 13.1.2 SAR遥感目标检测

    在大范围的海洋监视中，较SAR而言，光学成像的缺点是高分辨率的成像系统观测条带很窄而且受光照和天气影响很大，并不适合大范围监视，但对特定的海洋监视区域，如港口、海峡等海区是比较适合的。因此，SAR成像可以作为光学成像的信息先导。在实际的应用中，用于舰船目标检测的SAR图像一般具有较宽的测绘带，数据量巨大，信息提取较困难，实时性较差，而星上在轨SAR实时成像及感兴趣目标提取技术能够有效地解决这一问题。


    近年来，采用高分辨率SAR对地成像技术获取的SAR遥感图像包含有丰富特征，为舰船等感兴趣目标实时提取奠定了坚实基础。当前，对基于SAR图像的舰船目标本身的检测主要有最优恒虚警（`CFAR`）检测算子、双参数`CFAR`方法、多极化检测算法、多分辨率目标检测、基于卷积神经网络的检测方法、基于匹配滤波的检测方法、阈值检测法、基于模糊对策的检测方法以及基于分割的模拟退火的检测方法等。这些检测方法依赖于具体的海洋环境和SAR图像，单一参数的SAR图像目标检测器在杂波边缘、方位向模糊、干扰目标杂波环境中检测性能下降，出现检测率下降或虚警率上升的情况，基于深层卷积神经网络的目标检测算法通常难以有效应对大幅影像的目标搜索和弱小目标检测问题。遥感卫星载荷数据量大，峰值传输速率高，而SAR图像目标提取算法复杂，对平台的计算能力要求极高，但星载计算平台硬件不同于地面或其他平台，具备鲜明的高可靠、高效能、抗辐照、强容/纠错能力等特点。因此，星载实时处理性能优劣与算法模型是否优化息息相关。


    对面向SAR遥感图像的舰船目标在轨实时提取技术进行了研究，设计了一种以全局统计为基础的高效舰船目标检测算法和超轻量化疑似目标真伪鉴别网络，实现舰船目标快速提取，解决了遥感卫星信息获取实效性差，严重依赖数据传输系统带宽等瓶颈问题。根据当前的星载处理平台架构，对`OTSU`阈值求取、连通域标注以及卷积神经网络等高密度计算算法模块做了优化，在保证算法整体性能的基础上，有效减少了算法的计算量，大幅降低了算法实时实现对硬件平台性能的依赖，使得该星载实时信息处理模块在计算精度、速度、硬件规模以及热耗等方面达到良好平衡。


    ### 1.舰船目标提取算法设计


    #### 1）算法流程设计

    经过研究，针对SAR遥感图像感兴趣舰船目标稀疏性的特点，提出一种面向SAR遥感图像的船舰目标在轨实时提取算法。如图13-18所示，设计一种基于传统图像处理方法实现目标检测以及基于超轻量卷积神经网络实现目标鉴别。首先，采用基于二维模板滤波的图像去噪、顶帽变换的目标增强以及以全局统计为基础的目标分割技术获取疑似目标；然后，采用自主设计的超轻量卷积神经网络对疑似目标做真伪性鉴别，大幅降低虚警，实现对舰船目标的有效提取。卷积神经网络采用自主设计网络结构、网络量化剪枝、权值共享等手段，减少权重参数，提高计算实时性。该方法兼顾了舰船目标提取的有效性、在轨实时处理的可行性以及在轨维护的便捷性，可在当前的星载处理平台上应用。


    ![](images/txt017_32.jpg "pagenumber_ebook=289,pagenumber_book=278")

    图13-18 SAR图像目标提取流程


    #### 2）目标检测方法

    将图13-18算法流程进一步细化得到图13-19的舰船目标检测及鉴别方法。


    设计一种以统计学理论为基础的目标检测方法`MDN`。该方法构建多层模板卷积滤波网络，有效抑制相干斑、距离和方位向模糊带来的背景噪声，并实现舰船目标增强，便于对SAR图像进行快速分割和高效提取舰船疑似目标。


    `MDN`主要分为3个部分：一是数据预处理。对原始图像采用高斯滤波、中值滤波去除SAR图像中周期性和随机噪声，采用顶帽变换实现舰船目标增强。二是图像分割。对预处理完成后的图像进行`OTSU`自适应迭代分割，得到二值图像后，对其进行形态学膨胀处理以消除目标内部孔洞目标，然后进行连通域标注。三是疑似目标提取。根据连通域标注结果求取质心，之后进行基于形状特征的目标鉴别，对疑似目标标注结果进行面积及长宽比判定，剔除虚警目标，提取疑似目标切片。


    ![](images/txt017_33.jpg "pagenumber_ebook=290,pagenumber_book=279")

    图13-19 舰船目标检测及鉴别方法


    由算法流程可知，`MDN`是由二维模板平滑滤波、顶帽变换、基于全局统计的自适应分割、连通域标注等组成的深度计算结构。二维模板滤波处理包括串联层和并联层，串联层层与层之间相互连接实现平滑滤波处理，并联层层内连接主要包括模加减操作实现顶帽变换处理；平滑滤波和顶帽变换处理结果进入自适应分割网络，通过`OTSU`自适应阈值求取、图像分割、二值图像连通域标注以及面积及长宽比判别等处理输出疑似目标坐标及大小。


    `MDN`算法实现过程中将膨胀系数、降分辨率系数、目标面积、长宽比等关键阈值实现参数化可配置，不同图像分辨率通过选取不用参数的方法进行，因而可以更好地适用于星载处理平台，特别是在图像预处理后进行了目标分割降维，有效降低了传统计算过程中90%以上的计算和存储量，极大降低该算法在轨应用对星载硬件资源的需求。


    #### 3）目标鉴别方法

    遥感图像不同于常规高清图像，具有探测范围广、数据量大以及分辨率相对较低等特点，上述特点也造就了其感兴趣目标稀疏性的特点，对深度学习网络各方面要求较高。传统通用小网络如`MobileNetV2`参数量达到10
    MB级别，受限于小卫星2 kbit/s级别的遥控上注带宽，仍然无法适用。经过对比分析以及试验，综合考虑实现难易、参数量、计算量以及性能等方面内容，根据任务需求通过自主设计基于深度学习的卷积神经网络`YyNet-5`作为本目标鉴别算法。`YyNet-5`是基于Yann
    LeCun在1998年提出的`LeNet-5`基础进行设计更改完成的，如图13-20所示。`YyNet-5`共分为1个输入层、2个卷积层，2个池化层、1个全连接层、1个输出层，权重参数规模为5272个，采用单精度浮点数据格式进行计算，参数数据量为20.6
    kB，输入疑似目标切片大小为32×32。综合考虑卫星上注参数规模和智能信息处理模块的计算能力，`YyNet-5`设计成只对疑似目标做真假性鉴别，便于降低鉴别网络的前向推理计算量。


    上述鉴别器在标准`LeNet-5`模型基础上修改，根据需要可完成疑似目标真伪鉴别。将相应目标切片进行人工标定，并完成训练，得到模型参数。样本切片图取自`GF-3`
    SAR遥感卫星图，样本库切片图像如图13-21所示。


    数据集中包含舰船目标切片15 220个，岛屿、海堤/人工建筑目标等目标切片为9593个，随机选取其中20400个样本作为训练集，约占数据集的82.21%，余下4
    413个目标切片作为测试集。网络模型输入切片大小为32×32，若超出可通过降采样的方式保证。


