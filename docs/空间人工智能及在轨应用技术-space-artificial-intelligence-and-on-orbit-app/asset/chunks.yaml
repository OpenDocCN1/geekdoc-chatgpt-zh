- raw: "空间站飞行任务规划是一个典型的知识处理过程，其中涉及较为复杂的逻辑推理和众多的约束条件。这种问题适合采用人工智能的理论加以解释，应用人工智能方法，综合考虑串行以及并行活动，时间约束以及资源约束，提出适用于任务规划问题的推理模型，实现空间站正常飞行情况下以及有预案故障情况下各类飞行控制计划的自动生成，最终支持无故障预案情况下，快速生成满足需求的飞行控制计划。\n\
    \n空间站任务规划系统应该具备以下功能：\n\n①空间站舱段众多、协同控制复杂，存在多种组合体飞行模式，同时空间站后续扩展任务需要对接合作飞行器，需要能够对空间站不同飞行模式以及后续扩展舱段实施多目标整体任务规划。\n\
    \n②飞控资源有限、需求多样，需要能够优化配置资源、合理安排约束，在满足飞控需求的基础上，充分发挥空间站应用效率。\n\n③天地往返和货物补给常态化后，任务准备周期缩短、规划任务繁重，需要能够提高任务规划准备和验证效率。\n\
    \n④针对空间站应急响应需求及各类测控网和平台故障等突发情况，需要能够快速重规划，保障空间站安全稳定运行。\n\n⑤空间站在轨试验任务的控制需求多样、方式灵活，需要能够拓展传统计划遥控方式，实现基于闭环实时控制的遥控作业。\n\
    \n2.空间站智能在轨管理\n\n空间站在轨运行时间超过10年，长期的在轨飞行不仅需要执行大量任务，而且还会面临各种复杂的情况，应用人工智能技术，实现空间站热控、能源、信息、姿态轨道控制等分系统智能管理，提高空间站自主运行能力，不仅可以有效降低空间站的运营成本，而且可以提高空间站的可靠性和安全性。\n\
    \n①能源智能管理。通过实时获取供配电设备和用电负载的状态信息，利用计算机对各种状态信息进行分析，获取供配电分系统的运行状态。根据飞行任务和供配电分系统的状态，决策能源分配和负载管理；预测供配电分系统的健康状况，进行能源预计，为空间站的管理和任务调度提供依据。\n\
    \n②热控智能管理。通过实时采集空间站舱内外温度分布数据信息，自动预警超限情况，预测分析舱内外温度变化情况，辅助制定空间站系统热控方案。\n\n③姿态轨道控制智能管理。通过实时获取敏感器的数据信息，依据飞行任务规划，自动调整空间站控制策略，同时支持姿态发生异常偏转时，自动实施飞行控制。\n\
    \n④信息智能管理。支持高速海量数据的高效存储、分类以及回放，能够进行数据挖掘分析，支持信息自主管理，可以对空间站系统信息资源进行统一分配调度，支持地面、空间站以及航天员协同控制管理。\n\
    \n3.空间站智能健康管理需求\n\n空间站是一个由姿态控制、轨道控制、电源、热控制、站务管理、结构等多个子系统有机组合而成的复杂系统，各分系统间紧密耦合，其结构和功能是分布式和多层次的。空间站由上万个机、电、光元器件组成，并且工作在具有不确定干扰的空间环境中，很难保证在轨运行过程中不出现任何问题。因此，快速检测故障、准确定位故障、全面分析故障以及及时处理故障对于保证空间站在轨运行安全至关重要。\n\
    \n通过配置多种敏感器实时检测空间站的各种状态信息并自动进行归类分层处理，采用神经网络等人工智能方法分析故障出现的位置、程度以及对空间站飞行安全的影响，应用多种冗余策略及时处理故障，同时支持空间站、航天员以及地面工作人员之间快速交换故障信息，提高故障处理的有效性。\n\
    \n4.空间站智能家居管理需求\n\n空间站的核心是航天员，为航天员长期在轨驻留提供安全性、便利性、舒适性、节能的工作和生活环境，对航天员的身心健康以及工作效率具有重要影响。利用人工智能技术，可以实现影音监控、医监医保、显示报警、照明系统、物资信息、舷窗控制等功能的智能化管理。\n\
    \n空间站智能家居管理需求包括以下功能：\n\n①个人环境调节功能。需要为在轨航天员提供智能化的个人环境调节功能，包括照明、温湿度等，如照度、色温、显色指数、照明情景模式的智能控制及调节功能。\n\
    \n②个人娱乐支持功能。需要为在轨航天员提供智能化的个人娱乐支持功能，包括观影、音乐、游戏等智能显示播放功能。\n\n③个人通信支持功能。需要为在轨航天员提供智能化的个人通信支持功能，包括在轨航天员间、天地间通信，如音频通信、音视频通信、电子邮件通信，甚至是目前地面流行的即时通信手段等。\n\
    \n④支持在轨物资管理功能。需要帮助航天员进行智能化的物资识别、盘点、查找、定位、物资信息管理等及在物资管理方面耗费的精力，支持地面人员和航天员跟踪和掌握在轨存货、使用状态，辅助制定订货、存货及规划货物补给方案。\n\
    \n⑤支持在轨平台监控功能。需要支持航天器状态智能显示、异常状态智能报警提示等；支持在轨航天员在轨期间可随时随地获取航天器运行状态等，减轻航天员在常规平台监控方面的工作量。\n\
    \n5.空间站智能机器人需求\n\n空间站的核心在于航天员，保证航天员在飞行期间的安全是空间站任务最重要的内容。及时监控和判断空间站的飞行状态以及准确了解分析航天员的生理指标变化是保证航天员安全的必要前提。NASA已经开发了航天员辅助工作机器人，用于支持航天员舱内以及舱外维修操作。\n\
    \n1）航天员健康保障机器人\n\n航天员健康保障机器人通过布置于航天员身上的传感器，全天候采集航天员的生理指标情况，利用神经网络等人工智能方法，结合航天员历史生理数据，基于医学健康数据库，实时分析诊断航天员身体状态，及时给出医学建议。此外，通过定时主动询问或者应答方式与航天员开展交流，利用自然语言理解以及分析方法，结合心理健康数据库，分析诊断问答结果，评估航天员的心理状态，可以及时避免航天员执行任务期间出现心理问题。\n\
    \n2）航天员辅助工作机器人\n\n航天员辅助工作机器人通过语音或者触键等多种方式，响应航天员的操作要求，实时给出工作操作提示，支持工作过程与航天员的实时问答，提供操作手册等信息查询显示。此外，还可以配置高精度图像识别装置，获取操作目标特性，通过人工智能处理算法，具备维修设备拆装能力，减少航天员重复性以及长耗时的维修工作；在航天员休息和空间站无人值守期间，智能辅助工作机器人应能够自主地飞行于空间站舱内，辅助航天员对舱内状态进行巡查监视。\n\
    \n8.4　短期载人深空探测典型需求\n\n短期载人深空探测任务目标相对简单，配备机动月球车等月面机动设备，提升航天员的月面探测能力；航天员在月面进行一定范围内的月面地质环境探测、资源采集以及相对简单的科学实验。\n\
    \n1.环境探测与采样需求\n\n对于不同年代、不同成分、不同形貌的火山穹窿和火山锥进行形貌学、岩石学观察、测量、采样。由于火山坡度较大，其内壁很陡，需要智能攀爬机器人在火山口周围进行测量采样，并进入火山内部进行样品采集及拍照。另外，对于火山形貌的观察、特殊样品的采集及分类等采用人机协同的方式完成。\n\
    \n对熔岩管道进行深入的观察、测量，最好能进入熔岩管道进行观测、采样。由于岩管内部光线较差，地势有可能崎岖不平，且可能发生坍塌，因此航天员进入较不安全，需要带有拍照、采样及测量功能的攀爬机器人进入岩管中进行地质调查，通过影像数据回传或者机器人自带专家系统进行即时分析。\n\
    \n寻找地质结构稳定的熔岩管道。由于该构造是天然的辐射防护机构，是后期月球基地建设及天体生物学研究的重要场所。采用具有力学测量功能的攀爬机器人，对岩管内壁进行力学测量，观测其内壁是否稳固，是否适合月球基地的建立，机器人智能处理系统根据月球基地建设条件判据，给出分析评判结果。\n\
    \n2.科学实验活动需求\n\n科学实验活动的目标主要如下：\n\n①研究月球的内部构造，尤其是浅部构造，以及月球的演化。\n\n②进一步分析月球质量瘤的问题，弄清质量瘤的成因、分布及物质成分。\n\
    \n③在短期探测活动中，主要进行操作简单，耗时较短，且需要与后期探测任务联合进行的科学实验活动，如被动月震实验、月面重力实验、月面磁场实验及热流实验等。\n\
    \n在以上的科学实验中，由于仪器设备较多，布置位置不同，需要用月球车运送仪器，且月球车需具有安放仪器的功能，能将仪器安放在指定位置，然后由人机配合进行布置。月球车需具备自主路径规划能力，选择适当的布置位置。\n\
    \n科学实验的数据量大，有些需要长期数据积累、分析，所有的原始数据传回地球带来系统规模不可实现，通过必要的数据即时处理，仅将必要的数据传回地球是必然选择。\n\
    \n3.资源探测活动需求\n\n资源探测的主要目标是探索和证实月球上水的存在，以及探测月球上矿产资源的分布规律，主要包括氦-3、钛铁矿、稀土元素等矿产资源，为月球资源开发做准备，也为将来月球基地的建立及维护做保障。由于探测活动种类较多，且探测路线较长，因此需要月球车机器人进行仪器的运载，并配合航天员进行仪器的布置及测量。\n\
    \n航天员无法且不能亲自进入月面永久阴影区进行取样和科学实验，该任务必须通过特种机器人及科学试验设备实现。对永久阴影区开展探测，其主要目的是寻找水冰存在的证据，同时对水冰所在区域进行取样，并在月面就位开展对水冰成分的分析，开展水的提取试验。\n\
    \n对永久阴影区的探测和取样前期应通过无人探测器开展，在阴影区内巡视并确定重点试验和取样区域，并开展验证水冰存在的试验。当航天员到达月面后，航天员取得样品并进行水冰的成分研究和水的提取试验。\n\
    \n8.5　长期载人深空探测典型需求\n\n长期任务阶段，载人月球探测已具备一定发展规模，形成可持续发展的月球基地，已具备进行全月面地势探测和资源探测的能力，可以进行系统的、连续的科学实验，可实现月球原位资源的开发与利用，实现消耗品与能源的供给，同时具备月球基地基础设施建设与维护维修能力，支持航天员月面长期生活与工作。\n\
    \n1.载人月球基地任务规划需求\n\n月球基地任务规划的内容覆盖月球基地的全寿命周期，具有持续时间长、层次复杂、涉及内容广泛等特点。因此，月球基地的任务规划体系应分阶段、分层次互相配合进行，先长周期再短周期，由宏观到微观。可分为4个层次，即战略层、战术层、任务层和执行层，且以上一层规划结果作为下一层规划的输入，逐层进行规划，其中执行层规划直接指导任务实施。\n\
    \n战略级规划的根本目的是对月球基地系统和用户分配月球基地的资源规划；战术级规划是系统运行模式转换、载荷运行、设备运行、乘组操作以及训练、后勤和运输需求计划的总和；任务级规划主要包括制定用户调配计划以及确定任务期间关键的系统运行和维持项目、运输系统的综合需求、数据系统的需求和能力、对后勤保障的特殊需求（包括射前和返回后）、特殊的地面工作人员和乘组的训练需求。任务级规划由相关的部门分别制定，如系统资源使用计划由月球基地支持部门制定，而用户活动支持计划由载荷管理部门制定。\n\
    \n综合这些需求和计划后制定任务级规划；执行级规划将对飞行前的研制、流程、计划和数据制定详细的计划，它包括飞行程序、飞行数据文件、危险控制（故障对策）、飞行准则、系统重构和其他实时的执行计划，形成周操作序列、日操作序列。由于多任务、多资源、多约束，最终的规划可以有若干多个解，通过构建多种优先级的任务模型和月球基地的动态数据，生成最终的操作序列，而操作序列可根据地球上传的指令进行适当的调整。\n\
    \n2.长期载人月球站智能维护需求\n\n月球基地运营管理是对空间操作、空间运营支持和空间后勤支持等运营活动进行全过程任务管理，以保证月球基地长期稳定安全运行。这包括任务规划和任务实施两个层面：一是对月球基地全寿命周期的任务进行规划，明确任务过程和任务目标，包括建造规划、应用规划、服务规划、退役规划、补给规划、维护维修规划、载荷规划、航天员驻留规划、载荷试验安排规划、月面活动规划、航天员每天的详细活动规划等内容；二是根据任务规划所明确的具体任务内容、任务时间，任务实施所要解决的主要问题包括进行月球基地部段发射和组装、各种飞行器发射和交会对接、月面起飞着陆、基地乘员工作生活、基地内载荷试验安排等运营活动实施计划和实施方案的制定及执行。\n\
    \n3.载人月球基地后勤保障需求\n\n月球基地后勤是月球基地运营管理中相对独立又非常重要的组成部分。月球基地后勤任务的核心是保障月球基地正常高效地运营。最基本的任务是以月球作为目的地或出发地的空间运输任务，主要包括以下内容：安全可靠地把人员、推进剂、货物、仪器设备或其他补给物资运送到月球；在月球表面完成人员运送或货物的运输和存储；把月球基地的人员或科学样品送回地球。在更高级的月球基地中，后勤系统还要承担起月球产品的运输任务，如在月球基地生产的液氧推进剂、氦-3核原料等。月球基地后勤系统要确保在全寿命周期内及时、有效、经济地保证月球基地充足的资源供给以及其他问题的及时处理，同时需要很好地协调基本任务单元和相关支持系统的关系。该系统的运作很大程度上决定了月球基地的规模与相应的月面活动范围，其经济性和可靠性将直接影响月球基地的发展速度。\n\
    \n在月球基地建设初期，往月面运送的物资以用于保障航天员生命的消耗品、物资和设备等为主。之后，逐步运送较大型的月球基地组件，实施月球基地建设。随着月球基地建设的持续，月球基地建设用货物运输量的要求会逐渐提高，最终超出生命保障品的运输量。除上述两种货物外，还会有专门的特殊货物运输需求，因此运输任务的复杂性会逐步提高，对后勤系统也提出了更高的要求。\n\
    \n4.智能资源探测与原位建造需求\n\n由于很多月球资源是有限的，如除太阳辐射能以外的所有环境资源，以及大部分的月表资源（如水、氢、氧、金属矿物等），再加上运输技术和运输成本的限制。因此，一般首先考虑就地取用的方式进行利用。\n\
    \n在月表建立太阳能发电站，产生的电能主要用于基地照明、保温以及机器运转。高温差环境可进行能量转换研究以及新型耐温材料研究；熔岩管中搭建月球基地，用来屏蔽宇宙线、陨石、微流星体和撞击事件产生的喷发物。\n\
    \n月壤含有丰富的矿产资源，可以分离和提炼出各种原料，包括氧和氧化物、硅酸盐、金属。其中，氧化物用来生产金属，提取太阳风化物中的氢和氦；硅酸盐产生的二氧化硅、氧化铝、氧化钙等矿物可以制作建筑材料，建立月球基地。\n\
    \n月球基地供给人类生存的食物和水是依靠自己生产获得的，这也是月球基地长期运营必要的技术途径。\n\n在月球资源与利用中，人机联合中的“机”是必不可少的，矿物的开采、运输、资源提取、加工等每一步都需要人机协同。未来月球基地建设必然是一个智能规划、智能制造与运营维护。\n\
    \n5.载人登火星需求\n\n火星是太阳系中距离地球最近的大行星之一，大小与地球相近，具有稀薄的大气存在，演化历史与地球非常相似，是太阳系中除地球以外最可能存在生命的地方，对于探索宇宙和生命起源而言，具有极其重要的科学意义。与此同时，火星是人类建设地外文明的首选目的地。在太阳系中，火星的气候环境与地球最为接近，同时存在生产能源和建筑材料的原位资源，并存在生命维持不可缺少的水资源，完全有可能实现人类在火星的生存与工作生活。\n\
    \n\uFEFF\n\n第9章　通信与导航领域需求\n\n随着微小卫星技术及卫星互联网技术的快速发展，低成本、大批量的低轨通信/互联网巨型星座成为国内外产业界和学术界共同关注的焦点。星座化是通信与导航卫星发展的主要趋势。\n\
    \n随着新一轮人工智能浪潮的来袭，借力星载计算平台的性能提升，空间人工智能及在轨应用技术将对通信与导航卫星的服务性能提高、卫星功能演进、星座业务拓展提升等方面提供有价值的贡献，最终实现智能化、自主化、灵活稳定兼具的星座系统。面向通信与导航卫星人工智能系统技术进行构成分析，将相关技术按照导航业务特点及导航卫星特征可划分为网络智能管理需求、自主运管需求和智能协同需求。\n\
    \n9.1　网络智能管理需求\n\n具有多种功能、轨道互补、自主运行、便于扩展的智能化天基网络成为新发展方向。随着空间技术的发展，天地一体化网络应能为不同的空间网络节点共享资源提供条件，又可为各种航天器接入到空间网络提供条件。网络智能管理主要涉及网络架构、星间链路通信、网络拓扑结构、网络路由等关键技术。\n\
    \n网络智能管理的关键技术是智能组网以及与地面或通信卫星网络一体化通信接入技术。通过星间、星地、星空以及地面站间的链路，将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合，采用智能高速处理、交换和路由技术，按照信息资源的最大有效综合利用原则，进行信息准确获取、快速处理和高效传输的一体化信息网络，即天基、空基和陆基一体化综合网络。\n\
    \n1.网络架构\n\n当前各种空间网络组网形式多样，一般是基于各自的服务需求来开展和部署自己的专用网络。构建天地一体化网络，融合天基卫星通信网络、空基飞行器通信网络、地基通信网络，实现天、空、地三网协同，达到全球覆盖、随处接入、按需服务、安全可信、全球网络连通的目标。\n\
    \n天地一体化网络包含3张网：第一张网是由各类卫星组成的天基网络，将空间中的通信、导航、遥感等卫星组成一张协同网络作为空间基础设施；第二张网是由各类飞行器组成的空基通信网络，包括各类飞机、飞艇、热气球以及无人机等，空基网络多用于中继沟通天基和地基网络；第三张网是由陆地通信网构成的地基网络，包括陆地蜂窝网和无线局域网等。\n\
    \n在空、天、地3张网中，天基网络和地基网络分别构成天、地的骨干网络，是天地一体化网络中的重要组成部分。空基网络在天、地骨干网间起中继传输作用，是骨干网络的辅助部分。由于技术起步晚，我国天基网络设施建设还不够完善，通信容量缺口较大，覆盖范围仍需进一步加强。因此，推进天地一体化信息网络的重中之重是建设和完善天基网络。\n\
    \n天地一体化网络中的天基网络是一个混合异构的卫星网络，简要概括其特点就是高、中、低轨卫星结合，通、导、遥卫星协同。卫星按照距离地球高度分为中、低轨道卫星和高轨道卫星，不同卫星系统相互独立。天基信息网络则同时纳入各轨道卫星，形成一个高低轨道相配合的混合卫星网络，解决以往单纯某一轨道卫星系统各自存在的不足。\n\
    \n从天基通信角度来看，高轨通信卫星主流采用地球静止轨道，其时延大，无法覆盖两极地区，通信容量有限；中低轨通信卫星星座对地运动，其链路不够稳定，用户终端成本较高，网络组网成本高昂，且从实际运营来看，因低轨星座规模较大，而我国卫星频率、轨位等网络资源国际协调处于后发地位，卫星轨位和频率资源紧张。然而，高低轨卫星优劣势具有很强互补性。高轨卫星广覆盖的特点能有效解决中低轨卫星星座通信不稳定的问题，而数量繁多的中低轨通信卫星能够提供较大的通信容量。因此，打破两种通信卫星网络各自独立的体系，实现高、中、低轨卫星联合组网，是天基网络的趋势。\n\
    \n除了实现不同轨道高度上通信卫星的联合组网，还应将现有各类型卫星融合入天基网络中来，包括通信、导航和遥感等卫星。通信卫星完成语音和数据传输，导航卫星负责定位服务，遥感卫星提供对地观测信息。导航卫星和遥感卫星虽然不是为通信而设计，但却是天基信息网络的重要组成部分，能够感知和获取地面环境信息，从而为天基通信网络资源的重构和分配提供依据。\n\
    \n2.星间链路通信\n\n星间链路通信包括接入方式、测量通信体制、捕获跟踪等，具体实现与使用频段密切相关。按照星间链路的通信频率，星间链路可分为微波星间链路和激光星间链路两类。\n\
    \n微波星间链路的频率相对激光链路，其载波频率较低，天线尺寸要求较大，发射功率较大，通信链路带宽较窄。但是微波链路对于卫星姿态要求较低，目前的工艺水平也足以达到要求，是当前星间链路通信的主要形式。激光星间链路载波频率高，具有相干性、单色性、方向性好的特点，通信容量大、速度快、抗干扰强，但是激光星间链路的捕获跟踪技术难度较大，对卫星姿态要求较高。"
  fmt: '

    # 空间站飞行任务规划


    空间站飞行任务规划是一个典型的知识处理过程，其中涉及较为复杂的逻辑推理和众多的约束条件。这种问题适合采用人工智能的理论加以解释，应用人工智能方法，综合考虑串行以及并行活动，时间约束以及资源约束，提出适用于任务规划问题的推理模型，实现空间站正常飞行情况下以及有预案故障情况下各类飞行控制计划的自动生成，最终支持无故障预案情况下，快速生成满足需求的飞行控制计划。


    ## 空间站任务规划系统应该具备以下功能


    ①空间站舱段众多、协同控制复杂，存在多种组合体飞行模式，同时空间站后续扩展任务需要对接合作飞行器，需要能够对空间站不同飞行模式以及后续扩展舱段实施多目标整体任务规划。


    ②飞控资源有限、需求多样，需要能够优化配置资源、合理安排约束，在满足飞控需求的基础上，充分发挥空间站应用效率。


    ③天地往返和货物补给常态化后，任务准备周期缩短、规划任务繁重，需要能够提高任务规划准备和验证效率。


    ④针对空间站应急响应需求及各类测控网和平台故障等突发情况，需要能够快速重规划，保障空间站安全稳定运行。


    ⑤空间站在轨试验任务的控制需求多样、方式灵活，需要能够拓展传统计划遥控方式，实现基于闭环实时控制的遥控作业。


    # 2. 空间站智能在轨管理


    空间站在轨运行时间超过10年，长期的在轨飞行不仅需要执行大量任务，而且还会面临各种复杂的情况，应用人工智能技术，实现空间站热控、能源、信息、姿态轨道控制等分系统智能管理，提高空间站自主运行能力，不仅可以有效降低空间站的运营成本，而且可以提高空间站的可靠性和安全性。


    ### ①能源智能管理

    通过实时获取供配电设备和用电负载的状态信息，利用计算机对各种状态信息进行分析，获取供配电分系统的运行状态。根据飞行任务和供配电分系统的状态，决策能源分配和负载管理；预测供配电分系统的健康状况，进行能源预计，为空间站的管理和任务调度提供依据。


    ### ②热控智能管理

    通过实时采集空间站舱内外温度分布数据信息，自动预警超限情况，预测分析舱内外温度变化情况，辅助制定空间站系统热控方案。


    ### ③姿态轨道控制智能管理

    通过实时获取敏感器的数据信息，依据飞行任务规划，自动调整空间站控制策略，同时支持姿态发生异常偏转时，自动实施飞行控制。


    ### ④信息智能管理

    支持高速海量数据的高效存储、分类以及回放，能够进行数据挖掘分析，支持信息自主管理，可以对空间站系统信息资源进行统一分配调度，支持地面、空间站以及航天员协同控制管理。


    # 3. 空间站智能健康管理需求


    空间站是一个由姿态控制、轨道控制、电源、热控制、站务管理、结构等多个子系统有机组合而成的复杂系统，各分系统间紧密耦合，其结构和功能是分布式和多层次的。空间站由上万个机、电、光元器件组成，并且工作在具有不确定干扰的空间环境中，很难保证在轨运行过程中不出现任何问题。因此，快速检测故障、准确定位故障、全面分析故障以及及时处理故障对于保证空间站在轨运行安全至关重要。


    通过配置多种敏感器实时检测空间站的各种状态信息并自动进行归类分层处理，采用神经网络等人工智能方法分析故障出现的位置、程度以及对空间站飞行安全的影响，应用多种冗余策略及时处理故障，同时支持空间站、航天员以及地面工作人员之间快速交换故障信息，提高故障处理的有效性。


    # 4. 空间站智能家居管理需求


    空间站的核心是航天员，为航天员长期在轨驻留提供安全性、便利性、舒适性、节能的工作和生活环境，对航天员的身心健康以及工作效率具有重要影响。利用人工智能技术，可以实现影音监控、医监医保、显示报警、照明系统、物资信息、舷窗控制等功能的智能化管理。


    ## 空间站智能家居管理需求包括以下功能


    ①个人环境调节功能。需要为在轨航天员提供智能化的个人环境调节功能，包括照明、温湿度等，如照度、色温、显色指数、照明情景模式的智能控制及调节功能。


    ②个人娱乐支持功能。需要为在轨航天员提供智能化的个人娱乐支持功能，包括观影、音乐、游戏等智能显示播放功能。


    ③个人通信支持功能。需要为在轨航天员提供智能化的个人通信支持功能，包括在轨航天员间、天地间通信，如音频通信、音视频通信、电子邮件通信，甚至是目前地面流行的即时通信手段等。


    ④支持在轨物资管理功能。需要帮助航天员进行智能化的物资识别、盘点、查找、定位、物资信息管理等及在物资管理方面耗费的精力，支持地面人员和航天员跟踪和掌握在轨存货、使用状态，辅助制定订货、存货及规划货物补给方案。


    ⑤支持在轨平台监控功能。需要支持航天器状态智能显示、异常状态智能报警提示等；支持在轨航天员在轨期间可随时随地获取航天器运行状态等，减轻航天员在常规平台监控方面的工作量。


    # 5. 空间站智能机器人需求


    空间站的核心在于航天员，保证航天员在飞行期间的安全是空间站任务最重要的内容。及时监控和判断空间站的飞行状态以及准确了解分析航天员的生理指标变化是保证航天员安全的必要前提。NASA已经开发了航天员辅助工作机器人，用于支持航天员舱内以及舱外维修操作。


    ### 1）航天员健康保障机器人

    航天员健康保障机器人通过布置于航天员身上的传感器，全天候采集航天员的生理指标情况，利用神经网络等人工智能方法，结合航天员历史生理数据，基于医学健康数据库，实时分析诊断航天员身体状态，及时给出医学建议。此外，通过定时主动询问或者应答方式与航天员开展交流，利用自然语言理解以及分析方法，结合心理健康数据库，分析诊断问答结果，评估航天员的心理状态，可以及时避免航天员执行任务期间出现心理问题。


    ### 2）航天员辅助工作机器人

    航天员辅助工作机器人通过语音或者触键等多种方式，响应航天员的操作要求，实时给出工作操作提示，支持工作过程与航天员的实时问答，提供操作手册等信息查询显示。此外，还可以配置高精度图像识别装置，获取操作目标特性，通过人工智能处理算法，具备维修设备拆装能力，减少航天员重复性以及长耗时的维修工作；在航天员休息和空间站无人值守期间，智能辅助工作机器人应能够自主地飞行于空间站舱内，辅助航天员对舱内状态进行巡查监视。


    # 8.4 短期载人深空探测典型需求


    短期载人深空探测任务目标相对简单，配备机动月球车等月面机动设备，提升航天员的月面探测能力；航天员在月面进行一定范围内的月面地质环境探测、资源采集以及相对简单的科学实验。


    ## 1. 环境探测与采样需求

    对于不同年代、不同成分、不同形貌的火山穹窿和火山锥进行形貌学、岩石学观察、测量、采样。由于火山坡度较大，其内壁很陡，需要智能攀爬机器人在火山口周围进行测量采样，并进入火山内部进行样品采集及拍照。另外，对于火山形貌的观察、特殊样品的采集及分类等采用人机协同的方式完成。


    对熔岩管道进行深入的观察、测量，最好能进入熔岩管道进行观测、采样。由于岩管内部光线较差，地势有可能崎岖不平，且可能发生坍塌，因此航天员进入较不安全，需要带有拍照、采样及测量功能的攀爬机器人进入岩管中进行地质调查，通过影像数据回传或者机器人自带专家系统进行即时分析。


    寻找地质结构稳定的熔岩管道。由于该构造是天然的辐射防护机构，是后期月球基地建设及天体生物学研究的重要场所。采用具有力学测量功能的攀爬机器人，对岩管内壁进行力学测量，观测其内壁是否稳固，是否适合月球基地的建立，机器人智能处理系统根据月球基地建设条件判据，给出分析评判结果。


    ## 2. 科学实验活动需求

    科学实验活动的目标主要如下：


    ①研究月球的内部构造，尤其是浅部构造，以及月球的演化。


    ②进一步分析月球质量瘤的问题，弄清质量瘤的成因、分布及物质成分。


    ③在短期探测活动中，主要进行操作简单，耗时较短，且需要与后期探测任务联合进行的科学实验活动，如被动月震实验、月面重力实验、月面磁场实验及热流实验等。


    在以上的科学实验中，由于仪器设备较多，布置位置不同，需要用月球车运送仪器，且月球车需具有安放仪器的功能，能将仪器安放在指定位置，然后由人机配合进行布置。月球车需具备自主路径规划能力，选择适当的布置位置。


    科学实验的数据量大，有些需要长期数据积累、分析，所有的原始数据传回地球带来系统规模不可实现，通过必要的数据即时处理，仅将必要的数据传回地球是必然选择。


    ## 3. 资源探测活动需求

    资源探测的主要目标是探索和证实月球上水的存在，以及探测月球上矿产资源的分布规律，主要包括氦-3、钛铁矿、稀土元素等矿产资源，为月球资源开发做准备，也为将来月球基地的建立及维护做保障。由于探测活动种类较多，且探测路线较长，因此需要月球车机器人进行仪器的运载，并配合航天员进行仪器的布置及测量。


    航天员无法且不能亲自进入月面永久阴影区进行取样和科学实验，该任务必须通过特种机器人及科学试验设备实现。对永久阴影区开展探测，其主要目的是寻找水冰存在的证据，同时对水冰所在区域进行取样，并在月面就位开展对水冰成分的分析，开展水的提取试验。


    对永久阴影区的探测和取样前期应通过无人探测器开展，在阴影区内巡视并确定重点试验和取样区域，并开展验证水冰存在的试验。当航天员到达月面后，航天员取得样品并进行水冰的成分研究和水的提取试验。


    # 8.5 长期载人深空探测典型需求


    长期任务阶段，载人月球探测已具备一定发展规模，形成可持续发展的月球基地，已具备进行全月面地势探测和资源探测的能力，可以进行系统的、连续的科学实验，可实现月球原位资源的开发与利用，实现消耗品与能源的供给，同时具备月球基地基础设施建设与维护维修能力，支持航天员月面长期生活与工作。


    ## 1. 载人月球基地任务规划需求

    月球基地任务规划的内容覆盖月球基地的全寿命周期，具有持续时间长、层次复杂、涉及内容广泛等特点。因此，月球基地的任务规划体系应分阶段、分层次互相配合进行，先长周期再短周期，由宏观到微观。可分为4个层次，即战略层、战术层、任务层和执行层，且以上一层规划结果作为下一层规划的输入，逐层进行规划，其中执行层规划直接指导任务实施。


    战略级规划的根本目的是对月球基地系统和用户分配月球基地的资源规划；战术级规划是系统运行模式转换、载荷运行、设备运行、乘组操作以及训练、后勤和运输需求计划的总和；任务级规划主要包括制定用户调配计划以及确定任务期间关键的系统运行和维持项目、运输系统的综合需求、数据系统的需求和能力、对后勤保障的特殊需求（包括射前和返回后）、特殊的地面工作人员和乘组的训练需求。任务级规划由相关的部门分别制定，如系统资源使用计划由月球基地支持部门制定，而用户活动支持计划由载荷管理部门制定。


    综合这些需求和计划后制定任务级规划；执行级规划将对飞行前的研制、流程、计划和数据制定详细的计划，它包括飞行程序、飞行数据文件、危险控制（故障对策）、飞行准则、系统重构和其他实时的执行计划，形成周操作序列、日操作序列。由于多任务、多资源、多约束，最终的规划可以有若干多个解，通过构建多种优先级的任务模型和月球基地的动态数据，生成最终的操作序列，而操作序列可根据地球上传的指令进行适当的调整。


    ## 2. 长期载人月球站智能维护需求

    月球基地运营管理是对空间操作、空间运营支持和空间后勤支持等运营活动进行全过程任务管理，以保证月球基地长期稳定安全运行。这包括任务规划和任务实施两个层面：一是对月球基地全寿命周期的任务进行规划，明确任务过程和任务目标，包括建造规划、应用规划、服务规划、退役规划、补给规划、维护维修规划、载荷规划、航天员驻留规划、载荷试验安排规划、月面活动规划、航天员每天的详细活动规划等内容；二是根据任务规划所明确的具体任务内容、任务时间，任务实施所要解决的主要问题包括进行月球基地部段发射和组装、各种飞行器发射和交会对接、月面起飞着陆、基地乘员工作生活、基地内载荷试验安排等运营活动实施计划和实施方案的制定及执行。


    ## 3. 载人月球基地后勤保障需求

    月球基地后勤是月球基地运营管理中相对独立又非常重要的组成部分。月球基地后勤任务的核心是保障月球基地正常高效地运营。最基本的任务是以月球作为目的地或出发地的空间运输任务，主要包括以下内容：安全可靠地把人员、推进剂、货物、仪器设备或其他补给物资运送到月球；在月球表面完成人员运送或货物的运输和存储；把月球基地的人员或科学样品送回地球。在更高级的月球基地中，后勤系统还要承担起月球产品的运输任务，如在月球基地生产的液氧推进剂、氦-3核原料等。月球基地后勤系统要确保在全寿命周期内及时、有效、经济地保证月球基地充足的资源供给以及其他问题的及时处理，同时需要很好地协调基本任务单元和相关支持系统的关系。该系统的运作很大程度上决定了月球基地的规模与相应的月面活动范围，其经济性和可靠性将直接影响月球基地的发展速度。


    在月球基地建设初期，往月面运送的物资以用于保障航天员生命的消耗品、物资和设备等为主。之后，逐步运送较大型的月球基地组件，实施月球基地建设。随着月球基地建设的持续，月球基地建设用货物运输量的要求会逐渐提高，最终超出生命保障品的运输量。除上述两种货物外，还会有专门的特殊货物运输需求，因此运输任务的复杂性会逐步提高，对后勤系统也提出了更高的要求。


    ## 4. 智能资源探测与原位建造需求

    由于很多月球资源是有限的，如除太阳辐射能以外的所有环境资源，以及大部分的月表资源（如水、氢、氧、金属矿物等），再加上运输技术和运输成本的限制。因此，一般首先考虑就地取用的方式进行利用。


    在月表建立太阳能发电站，产生的电能主要用于基地照明、保温以及机器运转。高温差环境可进行能量转换研究以及新型耐温材料研究；熔岩管中搭建月球基地，用来屏蔽宇宙线、陨石、微流星体和撞击事件产生的喷发物。


    月壤含有丰富的矿产资源，可以分离和提炼出各种原料，包括氧和氧化物、硅酸盐、金属。其中，氧化物用来生产金属，提取太阳风化物中的氢和氦；硅酸盐产生的二氧化硅、氧化铝、氧化钙等矿物可以制作建筑材料，建立月球基地。


    月球基地供给人类生存的食物和水是依靠自己生产获得的，这也是月球基地长期运营必要的技术途径。


    在月球资源与利用中，人机联合中的“机”是必不可少的，矿物的开采、运输、资源提取、加工等每一步都需要人机协同。未来月球基地建设必然是一个智能规划、智能制造与运营维护。


    ## 5. 载人登火星需求

    火星是太阳系中距离地球最近的大行星之一，大小与地球相近，具有稀薄的大气存在，演化历史与地球非常相似，是太阳系中除地球以外最可能存在生命的地方，对于探索宇宙和生命起源而言，具有极其重要的科学意义。与此同时，火星是人类建设地外文明的首选目的地。在太阳系中，火星的气候环境与地球最为接近，同时存在生产能源和建筑材料的原位资源，并存在生命维持不可缺少的水资源，完全有可能实现人类在火星的生存与工作生活。


    # 第9章 通信与导航领域需求


    随着微小卫星技术及卫星互联网技术的快速发展，低成本、大批量的低轨通信/互联网巨型星座成为国内外产业界和学术界共同关注的焦点。星座化是通信与导航卫星发展的主要趋势。


    随着新一轮人工智能浪潮的来袭，借力星载计算平台的性能提升，空间人工智能及在轨应用技术将对通信与导航卫星的服务性能提高、卫星功能演进、星座业务拓展提升等方面提供有价值的贡献，最终实现智能化、自主化、灵活稳定兼具的星座系统。面向通信与导航卫星人工智能系统技术进行构成分析，将相关技术按照导航业务特点及导航卫星特征可划分为网络智能管理需求、自主运管需求和智能协同需求。


    ## 9.1 网络智能管理需求


    具有多种功能、轨道互补、自主运行、便于扩展的智能化天基网络成为新发展方向。随着空间技术的发展，天地一体化网络应能为不同的空间网络节点共享资源提供条件，又可为各种航天器接入到空间网络提供条件。网络智能管理主要涉及网络架构、星间链路通信、网络拓扑结构、网络路由等关键技术。


    网络智能管理的关键技术是智能组网以及与地面或通信卫星网络一体化通信接入技术。通过星间、星地、星空以及地面站间的链路，将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合，采用智能高速处理、交换和路由技术，按照信息资源的最大有效综合利用原则，进行信息准确获取、快速处理和高效传输的一体化信息网络，即天基、空基和陆基一体化综合网络。


    ### 1. 网络架构

    当前各种空间网络组网形式多样，一般是基于各自的服务需求来开展和部署自己的专用网络。构建天地一体化网络，融合天基卫星通信网络、空基飞行器通信网络、地基通信网络，实现天、空、地三网协同，达到全球覆盖、随处接入、按需服务、安全可信、全球网络连通的目标。


    天地一体化网络包含3张网：第一张网是由各类卫星组成的天基网络，将空间中的通信、导航、遥感等卫星组成一张协同网络作为空间基础设施；第二张网是由各类飞行器组成的空基通信网络，包括各类飞机、飞艇、热气球以及无人机等，空基网络多用于中继沟通天基和地基网络；第三张网是由陆地通信网构成的地基网络，包括陆地蜂窝网和无线局域网等。


    在空、天、地3张网中，天基网络和地基网络分别构成天、地的骨干网络，是天地一体化网络中的重要组成部分。空基网络在天、地骨干网间起中继传输作用，是骨干网络的辅助部分。由于技术起步晚，我国天基网络设施建设还不够完善，通信容量缺口较大，覆盖范围仍需进一步加强。因此，推进天地一体化信息网络的重中之重是建设和完善天基网络。


    天地一体化网络中的天基网络是一个混合异构的卫星网络，简要概括其特点就是高、中、低轨卫星结合，通、导、遥卫星协同。卫星按照距离地球高度分为中、低轨道卫星和高轨道卫星，不同卫星系统相互独立。天基信息网络则同时纳入各轨道卫星，形成一个高低轨道相配合的混合卫星网络，解决以往单纯某一轨道卫星系统各自存在的不足。


    从天基通信角度来看，高轨通信卫星主流采用地球静止轨道，其时延大，无法覆盖两极地区，通信容量有限；中低轨通信卫星星座对地运动，其链路不够稳定，用户终端成本较高，网络组网成本高昂，且从实际运营来看，因低轨星座规模较大，而我国卫星频率、轨位等网络资源国际协调处于后发地位，卫星轨位和频率资源紧张。然而，高低轨卫星优劣势具有很强互补性。高轨卫星广覆盖的特点能有效解决中低轨卫星星座通信不稳定的问题，而数量繁多的中低轨通信卫星能够提供较大的通信容量。因此，打破两种通信卫星网络各自独立的体系，实现高、中、低轨卫星联合组网，是天基网络的趋势。


    除了实现不同轨道高度上通信卫星的联合组网，还应将现有各类型卫星融合入天基网络中来，包括通信、导航和遥感等卫星。通信卫星完成语音和数据传输，导航卫星负责定位服务，遥感卫星提供对地观测信息。导航卫星和遥感卫星虽然不是为通信而设计，但却是天基信息网络的重要组成部分，能够感知和获取地面环境信息，从而为天基通信网络资源的重构和分配提供依据。


    ### 2. 星间链路通信

    星间链路通信包括接入方式、测量通信体制、捕获跟踪等，具体实现与使用频段密切相关。按照星间链路的通信频率，星间链路可分为微波星间链路和激光星间链路两类。


    微波星间链路的频率相对激光链路，其载波频率较低，天线尺寸要求较大，发射功率较大，通信链路带宽较窄。但是微波链路对于卫星姿态要求较低，目前的工艺水平也足以达到要求，是当前星间链路通信的主要形式。激光星间链路载波频率高，具有相干性、单色性、方向性好的特点，通信容量大、速度快、抗干扰强，但是激光星间链路的捕获跟踪技术难度较大，对卫星姿态要求较高。

