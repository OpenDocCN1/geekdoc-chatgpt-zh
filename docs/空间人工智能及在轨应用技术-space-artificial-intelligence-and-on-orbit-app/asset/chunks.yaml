    #### (1) 实时性。

    为了验证系统的实时性，采用数据输入为起始时间，输出最后的识别结果为结束时间，统计该段时间处理出来的目标数。统计4幅原始图像的处理时间及检测识别的目标数，通过计算1
    s平均能够检测识别到的目标数衡量实时性。


    ![](images/txt017_24.jpg "pagenumber_ebook=285,pagenumber_book=274")

    '
  trans: '


    遥感光学成像距离远，通常得到的图像背景噪声高、空间分辨率较低，舰船目标检测过程中容易受到云朵、强浪、浅海地形、岛屿暗礁等因素干扰，检测识别算法应当具有较强的适应性，能够适应复杂邻域、背景环境下的应用。单纯依靠传统特征检测技术难以有效分离出目标，致使检测正确率降低、虚警率升高，导致无法进行正确的识别分类。因此，设计能够适应于不同光照、气候条件、海面场景下舰船检测识别技术，成为当前在轨信息处理的关键。在轨信息处理需求不同于地面或其他平台，其具备鲜明的高可靠、高效能、抗辐照、强容/纠错能力等特点。此外，星上可用计算资源及功耗有限，在设计有效在轨实时检测识别算法的过程中必须考虑硬件资源，以满足低功耗、小型化设计要求。另外，为方便用户快速获取海面信息，在轨处理系统应具有良好的实时性。


    针对上述情况，设计一种基于机器学习的遥感舰船目标检测识别系统。该系统采用形态学匹配+机器学习的方法，基于视觉增强技术快速筛选疑似目标，大幅降低后续处理的数据量；采用机器学习方法，深度提取目标有效信息，大幅降低虚警，实现对目标的检测和细分类。硬件平台分为控制和处理部分。其中，控制部分采用高可靠宇航级抗辐照器件，处理部分采用`FPGA`+`DSP`+`GPU`的异构高性能处理架构，实现目标检测和机器学习网络推理模型，充分发挥`FPGA`全并行流水处理、`DSP`密集处理能力、`GPU`多数据并行处理能力等特点，提升算法工程化实现的效率，提高目标检测、识别分类的实时性，降低系统功耗，提升系统能效比。经过试验，针对海况地形复杂、背景显著性差的遥感舰船目标，检测识别准确性和实时性，性能优异。


    ## 1. 面向光学遥感卫星应用的舰船目标实时检测识别算法

    针对遥感图像感兴趣目标稀疏性的特点，设计一种面向光学遥感卫星应用的舰船目标实时检测识别算法。如图 13-1 所示，采用形态学匹配+机器学习的方法，基于视觉增强技术快速筛选疑似目标，并提取相应目标切片，大幅降低处理的数据量，采用`FPGA`+`DSP`的架构实现实时处理；采用机器学习中的卷积神经网络模型，大幅降低虚警，实现对目标的检测和细分类。卷积神经网络采用网络剪枝、权值共享等手段，降低训练参数，采用`FPGA`+`GPU`的方式，实现并行化计算，提高实时性。


    ![](img/txt017_1.jpg "pagenumber_ebook=270,pagenumber_book=259")


    图 13-1　基于机器学习的目标检测识别流程


    该方法兼顾算法的有效性及工程实现的可行性，可在现有星载嵌入式电路中采用本方法对不同复杂邻域、背景下舰船目标进行检测识别试验，能够有效地检测识别出舰船目标。


    ### 1）目标检测算法流程

    在目标检测算法设计过程中，设计以局部降维统计分类为基础构建的卷积鉴别网络（`CDN`）。该模型很好地克服了以往舰船目标检测方法整体计算量大、网络结构复杂难以实现、应对复杂港口或海况环境适应性差的缺点，能够有效地应用于星上嵌入式硬件。


    目标检测算法流程如图 13-2 所示。`CDN`主要分为 3 个部分：一是背景噪声抑制。对原始图像采用高斯滤波、中值滤波去除周期性和随机噪声，并经过形态学开闭运算消除由噪声引起的目标内部孔洞、连接邻近目标和平滑边界，实现目标增强。二是疑似目标筛选分割。首先通过对图像进行切片，比对当前检测区域与邻域直方图方差特性，区分出纯海域、陆地、疑似目标
    3 种类别，然后对疑似目标区域进行自适应迭代分割，得到二值图像后进行连通域标注，得到疑似目标标注结果；三是基于形状特征的目标鉴别。对疑似目标标注结果进行求取圆形度进行鉴别，剔除虚警目标，即可得到最终舰船检测结果。


    光学遥感图像目标检测过程如图 13-3 所示。


    ![](img/txt017_2.jpg "pagenumber_ebook=271,pagenumber_book=260")


    图 13-2　目标检测算法流程


    ![](img/txt017_3.jpg "pagenumber_ebook=271,pagenumber_book=260")


    图 13-3　光学遥感图像目标检测过程


    由算法流程可知，`CDN`是由 7 个流水卷积核、自适应分割、局部统计分类组成的深度计算结构。单个卷积核单元是一种基本的二维滤波结构。卷积核层内部包括串联层和并联层，串联层层与层之间相互连接，并联层层内连接主要包括模加减操作；卷积层输出的结果进入自适应分割网络，通过自适应迭代调整输出显著性前景目标；局部统计分类器对目标上下文进行判决，最终判定结果是否为舰船，并输出目标坐标及大小。


    `CDN`算法的优势在于模型具有层次性，参数比较多并且能够并行流水执行，因而可以更好地适用于并行流水计算，特别是在卷积核计算输出之后进行了分割降维，有效降低了传统计算过程中
    90%以上的计算量，极大地减少了在轨应用对硬件资源的依赖。


    ### 2）目标识别算法流程

    以舰船疑似目标的图像切片作为`CNN`分类器的待分类样本数据，人工标定目标切片作为分类器训练输入样本。其中，`CNN`模型选用`VGG-16`模型。`VGG-16`模型是一种典型深度卷积神经网络（`CNN`）模型，由
    Simonyan 和 Zisserman 在 2014 年首次提出，在`ImageNet` 2014 分类大赛上 Top-5 错误率仅为 7.4%，仅次于
    GoogleNet 的 6.7%，是一种非常强大的深度卷积神经网络，能提取图像中更深层特征，分类能力突出。


    标准的`VGG-16`模型结构如图 13-4 所示，其中包含 13 个卷积层和 3 个全连接层，使用不断增加的 3×3 卷积层，并通过 2×2 最大池化（`Maxpooling`）来减小运算规格，然后是两个
    4 096 节点的全连接层，最后是一个`Softmax`分类器，能够实现 1 000 类目标分类。


    ![](img/txt017_4.jpg "pagenumber_ebook=272,pagenumber_book=261")


    图 13-4　标准的 VGG-16 模型结构


    舰船目标鉴别的过程分为训练与预测两个过程。首先根据人工标定的目标图像切片作为`CNN`分类器的学习输入，经过训练后得到对应的分类器；然后根据得到的分类器对待分类目标切片进行预测，实现目标鉴别，鉴别过程如图
    13-5 所示。


    在标准`VGG-16`模型基础上定制目标分类器，根据需要完成 4 类目标的分类鉴别，分别为船、岛屿、云及海堤/人工建筑。将相应目标切片进行人工标定，并完成训练，得到模型参数。4
    类目标切片图取自高分 2 号光学遥感卫星图，切片样本如图 13-6 所示。


    ![](img/txt017_5.jpg "pagenumber_ebook=273,pagenumber_book=262")


    图 13-5　基于深度学习的目标切片鉴别流程


    ![](img/txt017_6.jpg "pagenumber_ebook=273,pagenumber_book=262")


    图 13-6　目标切片样本（从上至下分别为云、岛屿、海堤/人工建筑、船）


    ## 2. 硬件平台构建


    ### 1）硬件平台设计

    高性能电子元器件应用一直受限于抗辐照要求的影响。当前一些硬件设计思路只是从处理平台通用性、实时性等方面加以约束要求，系统可靠性和抗辐照性难以满足宇航应用的需求。克服以上缺点，提供了一种应用于遥感目标在轨检测识别的可重构处理平台。


    基于`FPGA`+`DSP`+`GPU`异构处理架构的平台硬件拓扑如图 13-7 所示。其主要设计思想为：采用`Space VPX`总线标准，各单元板卡使用
    6U 标准结构；充分考虑宇航应用的高可靠、高效能、抗辐照、强容/纠错能力等特点，将该装置分为控制和处理两大部分，控制部分采用高可靠、抗辐照宇航级器件，处理部分采用高性能、大容量常规器件，有效降低成本的同时，提升了可靠性和处理性能；采用网状处理节点设计思路，支持多单元协同处理，扩展性强；支持在轨刷新，提升抗辐照能力，通过各单元主控模块的反熔丝`FPGA`实现处理`FPGA`刷新控制；支持在轨重构更新，且可根据不同任务通过各单元主控模块的反熔丝`FPGA`实现切换不同处理程序，主处理器（处理`FPGA`、`DSP`及`GPU`）均有两种加载方式，通过主控模块的反熔丝`FPGA`实现加载模式控制，应用程序实现了主备份，提升系统可靠性。


    ![](img/txt017_7.jpg "pagenumber_ebook=274,pagenumber_book=263")


    图 13-7　基于 FPGA+DSP+GPU 异构处理架构的平台硬件拓扑


    ### 2）平台主要指标


    #### (1) 处理能力。

    `FPGA`选用`Xilinx`公司`Virtex7`系列`FPGA` `XC7 V690TFFG1761I`。该型`FPGA`包含 3 600 个`DSP48e`，1
    470 个`BlockRam36k`，逻辑和时钟资源丰富。


    `DSP`选用`TI`公司 8 核处理器`TMS320C6678`，采用`Keystone`架构，单核主频最高 1.4 GHz，单核处理能力达到 22.4
    `GFlOPs`，每个核包含 512kB L2 内存，8 个核共享 4 MB 内存。


    `GPU`选用`NVIDIA`公司`Jetson TX2`，包含 256 个处理核。


    #### (2) 外接存储能力。

    `XC7 V690TFFG1761I`外挂 8 片 1GB `DDR3`，2 片 144Mb `QDR-SRAM`等高性能存储器。


