- raw: '主导卫星指具备星群规划能力，可选取和指导从属卫星群完成既定观测任务的卫星节点。主导卫星的身份是动态的，由观测任务驱动产生。当某卫星节点接收到地面上注的、在轨自主生成或者星间引导生成的观测任务，如果该任务不能由该卫星节点自己完成，则卫星节点选择自己为该观测任务的主导卫星，并开始在轨自主联合任务规划流程。每个观测任务对应一个主导卫星和一个执行从属卫星群。如果观测任务取消或者完成，则对应的主导卫星和从属卫星的身份中止；如果任务执行过程中主导卫星失效，可将主导卫星的身份动态转移给其他卫星。


    主导卫星具有一般从属卫星的功能。此外，主导卫星作为星群联合规划的发起者和管理者，还具备以下功能：任务清单自主筹划、发起天基资源匹配、天基资源匹配结果评估、从属星群动态选择和管理、多星联合任务规划、下发从属星任务规划方案、任务执行状态监视、执行结果融合与分发等。


    2）从属卫星


    从属卫星指由主导卫星选取产生，配合主导卫星完成特定观测任务的卫星节点。对于每个特定的观测任务主导卫星可能会选取一个或多个从属卫星，选取结果由天基资源匹配的结果确定。从属卫星接收由主导卫星下发的任务规划方案，动态向主导卫星反馈任务执行状态；从属卫星的身份也是动态的，如果观测任务取消或者完成，则从属卫星的身份中止；如果该卫星失效，从属卫星身份可动态转移给其他卫星。


    从属卫星具备自主任务生成、任务管理与执行、任务资源自主匹配、单星任务规划、任务执行状态反馈、星上实时状态评估、在轨实时图像处理、全网信息同步更新等功能。


    3）天基信息网


    天基信息网是由北斗导航卫星和中继通信卫星构成的可互联互通的天基骨干网络，为自主联合任务规划系统中的业务星提供网络接入服务，可支持短报文、相控阵、激光网络等多种星间链路接入服务。基于天基信息网络，业务卫星可完成中继测控、中继数传、天基资源自主匹配、全网动态同步更新等功能。


    4）地面联合任务规划管控中心


    地面管控中心主要负责向业务卫星上注任务，接收业务卫星下传的任务执行状态以及获取的态势数据并进行同步，调配地面数传资源接收卫星下传的观测数据，进行态势和情报分析并分发给其他用户。


    2.在轨自主联合任务规划体系架构模型


    为满足天基资源支持陆海战场态势感知与战术应用需求，适应在轨多星自主协同和在轨任务自主筹划的需求，在轨自主联合任务规划技术体系涉及应用需求、服务对象、资源维护及控制、应用模式分析匹配、以任务为中心的资源调度、面向任务的多星自主协同规划、系统操作控制、系统应用仿真及效能评估等诸多方面。因此，以直接支持作战应用需求为牵引和驱动，以满足任务需求和提高系统使用效能为发展目标，重点针对在轨系统的发展需求，设计了包含系统执行层、实时监控层、单星规划调度层、星间协商层、在轨自主联合任务规划层在内的功能完备、技术先进、体系健全、体制统一、功能可扩展的在轨多层技术体制框架，具体如图13-51所示。


    ![](images/txt017_75.jpg "pagenumber_ebook=325,pagenumber_book=314")


    图13-51　在轨自主联合任务规划分层体系架构


    其中，系统执行层是在轨自主联合任务规划系统的底层和技术支撑层，负责管理和维护成像监视与跟踪卫星系统可用的平台、搭载载荷资源和最终服务的用户资源，负责实施指令编排、指令校验与执行、测控/中继链路管理等执行层面的工作。


    实时监控层对卫星资源状态、任务状态和态势状态等进行实时的监控与评估，主要功能模块包括在轨实时图像处理、态势数据生成、下发执行动作方案、任务执行情况反馈、卫星实时状态评估和自主健康管理。


    单星规划调度层解决面向自身的任务规划问题。该层在满足卫星自身状态约束的条件下，通过多种算法自适应地产生单星任务规划方案，同时也负责从主导卫星接收下发的任务规划方案并生成具体的执行动作方案。


    星间协商层负责构建、维护星间任务和资源状态协商机制，实施多星自主协同流程，解决面向应用的天基资源分配和调度问题。协商机制是多Agent系统解决问题的一个重要手段，协商机制将Agent分为任务的管理者和潜在执行者。任务的管理者负责任务的分配、任务执行的监控以及执行结果的处理；潜在的执行者负责对任务进行评估，并通过与任务管理者之间的协商，确认任务的执行时间，并将执行结果传送给管理者。通过设计专门的协商协议和算法，可以有效地管理整个MAS系统，实现系统的优化利用，同时星间协商层还负责进行全网信息同步更新处理。


    在轨自主联合任务规划层是在轨自主联合任务规划系统的领域支撑层，在基础资源层所维护的资源和控制技术手段限定的范围内，依据各类应用需求，通过智能化辅助分析、总结，抽象出各类成像监视与跟踪卫星系统各类典型的任务模式，生成面向需求的任务预案，为资源自主匹配与联合任务规划提供依据。其主要功能模块包括在轨自主任务生成、任务清单自主筹划、任务-资源匹配方案评估与决策、从属卫星动态管理、多星协同任务规划以及任务执行情况监视与评估反馈。


    3.典型场景运行模式


    典型任务保障模式包括陆地目标广域搜索发现、陆地静止目标区域巡查、海洋移动目标区域巡查等。下面分别对各模式运行过程进行描述。


    1）陆地目标广域搜索发现运行模式


    陆地目标广域搜索发现运行模式主要通过合理分配卫星平台及侦察载荷资源，对任务区域内陆地和沿海的静止目标或慢速移动目标实施大区域覆盖搜索，用于获取区域态势和发现可疑目标信息。首先由地面将任务需求注入卫星，星上进行需求分解与分析处理，完成任务清单的自主筹划工作，然后通过多星联合任务规划将固定目标大区域搜索任务分配给多星。当区域较大超过卫星单次扫描覆盖范围时，采用多星拼接覆盖搜索，由地面进行任务区域分解与子任务分配。在轨检测到目标时，经分析决策后立即由搜索发现阶段转入识别确认阶段，生成新任务，进行在轨自主协同规划，将新任务信息与在轨任务规划结果下传地面，将引导任务通过星间链路分发给临近其他可观测的卫星采用高分辨率的条带成像模式执行详细侦察任务，进行在轨目标识别；若目标识别确认后，根据情况将目标数据下传地面站，必要时通过广播分发将目标信息发送给战术终端，同时将在轨任务执行状态下传地面，进行任务闭环管理。


    陆地目标广域搜索发现运行模式如图13-52所示。


    ![](images/txt017_76.jpg "pagenumber_ebook=327,pagenumber_book=316")


    图13-52　陆地目标广域搜索发现运行模式


    （a）搜索；（b）识别确认


    具体运行流程如下：


    ①测控段内的卫星（主导卫星）受理观测需求，进行需求分解与分析处理，完成任务清单的自主筹划工作；通过多星联合任务规划技术将固定目标大区域搜索任务分配给多星配合执行，主导卫星基于新任务进行滚动式动态任务规划；若相应卫星可插入新任务，则将任务方案分发给该卫星执行。


    ②各卫星接收到任务方案后，进行任务可执行性分析决策，生成任务具体执行方案，进行工作模式设置；基于实时星历与在轨地物特征库进行载荷参数载荷决策与设置，基于在轨实时资源状态进行在轨精细化载荷任务智能调度，执行搜索任务；在此过程中将在轨任务执行状态下传地面。


    ③各卫星在执行区域搜索任务过程中，对获取的数据进行在轨实时处理；基于在轨目标特征库进行目标识别检测，若发现目标，则进行自主任务筹划工作，生成引导任务，并通过星间协同机制将引导任务分发给有观测可行性的卫星；在此过程中将在轨任务规划结果与任务执行状态下传地面，将目标信息下传地面。


    ④其他卫星接收到引导任务后，基于星上原有的任务与新任务进行在轨任务规划，进行工作模式设置；基于实时星历与星上地物特征库进行载荷参数精确计算设置，基于星上实时资源状态进行星上精细化载荷任务智能调度，执行详查成像任务；进行在轨任务处理与目标识别确认，若确认目标，则通过广播分发将目标数据分发到战术终端；在此过程中将在轨任务规划结果与任务执行状态下传地面，将目标信息下传地面。


    ⑤地面系统根据卫星下传信息与遥测数据，实时更新任务执行状态，监视在轨任务执行情况，并进行任务闭环管理，接收卫星下传的目标信息进行战场态势更新。


    2）陆地静止目标区域巡查运行模式


    陆地静止目标区域巡查运行模式主要通过合理分配卫星平台及侦察载荷资源，对任务区域内陆地和沿海的已掌握的静止目标实施监视，用于获取区域态势和检测目标变化情况。首先由星上进行需求分解与分析处理，完成任务清单的自主筹划工作，然后通过多星联合任务规划将固定目标大区域搜索任务，卫星采用多种方式切换执行多目标观测任务；采用多卫星分区域分时段进行多点目标轮巡；将目标数据下传地面站，或通过广播分发将目标信息发送给战术终端；在此过程中将在轨任务规划结果与任务执行状态下传地面。


