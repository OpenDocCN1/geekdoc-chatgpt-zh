  trans: '


    人工智能这一概念源自 1956 年的达特茅斯会议（Dartmouth Conference）。本部分主要从人工智能概念、发展时期和趋势以及空间系统智能化需求等几个方面展开，引出空间人工智能及在轨应用技术。


    # 第 1 章　绪论


    ## 1.1 引言

    如图 1-1 所示，人工智能（Artificial Intelligence）是一门由计算机科学、统计学、脑神经学、社会科学等学科融合发展起来的交叉学科，以知识表示、自然推理和搜索方法、机器学习等学科研究为代表，包含算法（Algorithm）、数据（Data）、计算（Compute）三要素。


    ![](img/txt002_1.jpg "pagenumber_ebook=14,pagenumber_book=3")


    图 1-1　人工智能学科关系


    人工智能三要素关系如图 1-2 所示。


    ![](img/txt002_2.jpg "pagenumber_ebook=14,pagenumber_book=3")


    图 1-2　人工智能三要素关系


    通过人工智能技术，可以使机器胜任一些通常需要人类智能才能完成的复杂工作，从而极大简化人工操作，提高生产效率，改进生产关系，是极具颠覆性的前沿技术。


    如图 1-3 所示，人工智能自 20 世纪 50 年代诞生至今，经历了三次高潮、两次寒冬的洗礼。21 世纪初开始至今，依托以深度学习为代表的人工智能技术，人工智能开始了第三次高潮。随着高性能计算技术快速发展以及互联网和大数据广泛应用，形成面向不同应用场景的海量数据。围绕语音识别、机器视觉、知识推理、自动驾驶等领域的人工智能技术大量涌现，已形成规模化应用。


    ![](img/txt002_3.jpg "pagenumber_ebook=15,pagenumber_book=4")


    图 1-3　人工智能发展阶段


    人工智能在各个领域的成功运用为空间系统设计及智能化发展奠定了良好基础，开展基于人工智能的在轨应用技术研究迫在眉睫。目前，世界各国的航天机构都在深入挖掘人工智能与航天技术的可结合性，持续推进人工智能在未来空间任务中的应用，以便大幅提升空间任务执行的自主性。


    人工智能在轨应用面临的瓶颈问题主要包含资源强受限、数据样本少、无法接受黑盒子状态、可靠性高等。长期来看，彻底解决人工智能在轨计算、传输、存储、能耗等问题需要前沿技术革新。技术革新依赖于时间与人类科技发展，但是宇航领域对智能化的需求已迫在眉睫。


    ## 1.2 人工智能发展状况


    ### 1.2.1 人工智能简介

    1955 年美国 Mc Carthy 等人在研究计划中提出了人工智能的概念，随后在 1956 年的达特茅斯学院暑期论坛上首次提出。经过 60 多年的发展和积淀，伴随着互联网、大数据、云计算和新型传感器等技术的发展，人工智能正引发可产生链式反应的科学突破，催生一批颠覆性技术、培育经济发展新动能、塑造新型产业体系，加速新一轮科技革命和产业变革。


    人工智能的内涵包括脑认知基础、机器感知与模式识别、自然语言处理与理解、知识工程 4 个方面，外延即机器人与智能系统，作为第 5 个方面，其具体内容如下：


    ①脑认知基础是指认知活动的机理研究，即人脑如何从微观、介观、宏观、宇观等不同尺度上实现记忆、计算、交互、学习、推理等认知活动，以及如何模拟这些认知活动，实现类脑认知。


    ②机器感知与模式识别是指脑的视、听等知觉研究，即如何用机器完成图形和图像、语音等感知信息处理和识别任务。


    ③自然语言处理与理解是指研究人类自然语言的语境、语用、语义和语构，包括语音和文字的计算机输入，大型词库、语料和文本的智能检索，机器语音的生成、合成和识别，不同语言之间的机器翻译和同传等。


    ④知识工程是指研究知识的表示、获取、推理、决策和应用，包括机器定理证明、专家系统、机器博弈、数据挖掘和知识发现、不确定性推理、领域知识库、数字图书馆、知识图谱等大型知识工程。


    ⑤机器人与智能系统是指智能应用技术，涵盖各种各样工业、农业、医用、军用和服务机器人，还有智能驾驶、智能交通、智能制造、智能家居、智能环保、智能网络、智能管理、智慧医疗、智慧农业、智慧金融等。


    空间人工智能，简单来说，就是指航天器自主实现智能感知、决策、协同并且具备学习的能力。在 2005—2007 年期间，美国航空航天学会下属的空间操作与支持技术委员会，对当时航天器自主性及智能性的工业水平进行了调研和分析，总结了来自全球
    12 个不同的组织、102 个不同的智能自主航天器系统/空间机器人的相关情况。其中，航天器智能自主等级划分如表 1-1 所示。


    表 1-1　航天器智能自主等级划分


    ![](img/txt002_4.jpg "pagenumber_ebook=16,pagenumber_book=5")


    续表


    ![](img/txt002_5.jpg "pagenumber_ebook=17,pagenumber_book=6")


    针对上述 6 个等级划分可知，随着等级逐步提高，航天器的自主性和智能性也随之提高。在调查的全部 102 个空间系统中，有 28 个航天器没有采用人工智能技术，有
    74 个采用了不同等级的人工智能技术。其中，34 个处于第 2 等级，18 个处于第 3 等级，12 个处于第 4 等级，3 个处于第 5 等级，7 个处于第
    6 等级。目前，我国空间飞行器所处等级基本在第 2～4 等级，个别在轨卫星已经具备自主任务规划能力。


    ### 1.2.2 人工智能发展时期

    人工智能发展可以概括为萌芽期、启动期、消沉期、突破期、发展期、高速发展期 6 个时期。


    1.萌芽期

    1936 年，英国数学家阿兰·图灵（Alan M.Turing）在论文“理想计算机”中提出的图灵机模型以及 1950 年在“计算机能思维吗”一文中提出机器能够思维的论述；1946
    年美国科学家莫奇利（J.W.Mauchly）和埃克特（P.Eckert）等人共同发明了世界上第一台电子数字计算机埃尼阿克（ENIAC），为 AI 研究奠定硬件基础；之后贡献最卓著的是冯·诺伊曼，目前世界上占统治地位的仍是冯·诺伊曼架构计算机；美国数学家维纳（N.Wiener）控制法的创立、美国数学家香农（C.E.Shannon）信息论的创立等，都为人工智能学科的诞生和发展做出巨大贡献。


    2.启动期

    1956 年夏季，在美国达特茅斯学院举办的“人工智能夏季研讨会”上，第一次正式使用人工智能这一术语，从而开创了人工智能学科，并有了人工智能的第一个发展期。这段时期研究的主要方向是机器翻译、定理证明、博弈等。这一时期的代表性工作：1956
    年，Newell 和 Simon 等人在定理证明工作中首先取得突破，开启了以计算机程序来模拟人类思维的道路；1960 年，Mc Carthy 建立了人工智能程序设计语言
    LISP。


    一系列的成功使人工智能科学家们认为可以研究和总结人类思维的普遍规律并用计算机模拟它的实现，乐观地预计可以创造一个万能的逻辑推理体系。


    3.消沉期

    当人们进行了比较深入的研究以后，发现人工智能研究碰到的困难比原来想象的要多得多。


    例如，Samuel 的下棋程序当了州冠军之后没能进一步当上全国冠军，更不要说世界冠军；过去十年，计算机并未证明出人类还未证明出的定理；从神经生理学角度研究人工智能的人发现他们遇到了几乎是不可逾越的困难，以电子线路模拟神经元及人脑都没有成功。这一切都说明，由于
    20 世纪 50 年代的盲目乐观和期望值过高，没有充分估计困难，没有抓住科学本质。因此，20 世纪 60 年代中期至 70 年代初期人工智能受到了各种责难，进入了消沉期。


    4.突破期

    很多人工智能技术研究人员并没有灰心，而是扎扎实实地工作，不仅是加强基础理论研究，而且在专家系统、自然语言理解、计算机视觉等方面做出了很有成效的工作，进入了突破期。


    这一时期的代表性成果：ELIEA———1968 年 J.Weizenbaum 在美国麻省理工学院设计的基于“模式匹配”的自然语言系统；DENDRAL———1970
    年斯坦福大学计算机科学系 E.A.Feigenbaum 和化学家 C.Djerassi 以及 J.Leberberg 等人研制出的世界上第一个专家系统；MACSMA———麻省理工学院的
    C.Engleman，W.Martin 和 J.Moses 研制成的基于知识的数学专家系统；MYCIN———E.H.Shortliffe 等人于 1972—1974
    年研制、1976 年发表的医疗专家系统。另外还有，1973 年 R.C.Schamk 提出的概念从属理论；1974 年 Minsky 提出表示知识的另一种方法框架理论，又称画面理论等。


    5.发展期

    1977 年第五届国际人工智能联合会会议上，Feigenbaum 教授在一篇题为“人工智能的艺术：知识工程课题及实例研究”的特约文章中系统地阐述了专家系统的思想并提出“知识工程”的概念。


    至此，人工智能的研究又有了新的转折点，即从获取智能的基于能力的策略，变成了基于知识的方法研究。知识作为智能的基础开始受到重视，知识工程的方法很快渗透入人工智能各个领域，促使人工智能从实验室研究走向实际应用。由于理论研究和计算机软硬件的飞速发展，各种专家系统、自然语言处理系统等人工智能实用系统开始商业化并进入市场，而且取得了较好的经济效益和社会效益，展示了人工智能应用的广阔前景。


    6.高速发展期

    2006 年，深度学习被提出，促使人工智能再次突破性发展。


    2010 年，随着移动互联网快速发展，人工智能应用场景开始增多。


    2012 年，深度学习在语音和视觉识别实现突破，人工智能商业化高速发展。


    在移动互联网、大数据、超级计算、传感网、脑科学等新理论新技术以及经济社会发展强烈需求的共同驱动下，人工智能加速发展，呈现出深度学习、跨界融合、人机协同、群智开放、自主操控等新特征。


    当前人工智能产业发展迅猛，但主要是基于计算机视觉/图像识别、自然语言处理/语音识别、自主规划/决策等的应用，包括智能金融、智慧医疗、智能机器人、自动驾驶、智能安防、智慧零售、智慧教育、智能家居、智慧城市、智能制造等。新一代人工智能以深度学习为典型代表，但深度学习不等于人工智能。


    ### 1.2.3 人工智能发展趋势

    人工智能主要有符号主义、连接主义、行为主义三大学派，下面简要进行介绍。


    初级阶段（20 世纪 50—80 年代）：以符号主义学派为主，主要为手工知识，启发式算法→专家系统→知识工程。


    中级阶段（20 世纪 80 年代至今）：以连接主义学派为主，主要为统计学习，人工神经网络、深度学习等。


    高级阶段（21 世纪初至未来）：以行为主义学派为主，主要为情境适应，自适应自学习控制、进化计算、分布式智能、大数据的产生与积累等。


    当前人工智能的发展是基于连接学派理论，主要驱动要素是爆炸式增长的数据、持续提升的运算力、不断优化的算法模型以及资本与技术的深度耦合，主要特征是通过计算技术实现感知、认知、分析、决策、学习和行动等人类智慧，主要技术包括计算机视觉、机器学习、自然语言处理、机器人技术、语音识别等，目前在智能医疗、金融、教育、交通、安防、家居、制造等领域得到广泛应用，在无人驾驶、智能机器人等方面发展迅速。


    其中，可以明确说明的是“深度学习”并不是人工智能的同义词，而是促进了人工智能领域脑科学、神经计算、量子计算、生物智能等前沿新技术的发展。当前，人工智能以连接主义学派为主导，下面主要以深度学习技术为代表的连接主义学派展开论述。


    基于深度学习的人工智能知识图谱如图 1-4 所示。


    ![](img/txt002_6.jpg "pagenumber_ebook=20,pagenumber_book=9")


    图 1-4　基于深度学习的人工智能知识图谱


    基于深度学习的人工智能算法模型发展趋势如图 1-5 所示。


    ![](img/txt002_7.jpg "pagenumber_ebook=20,pagenumber_book=9")


    图 1-5　基于深度学习的人工智能算法模型发展趋势


    当前，各大科技公司均在人工智能领域投入大量人力、物力，使得人工智能得以蓬勃发展。


    如图 1-6 所示，人工智能由学术驱动向应用驱动转化、弱人工智能向强人工智能转化，机器智能将从感知、记忆、存储向认知、自主学习、决策与执行进阶。


