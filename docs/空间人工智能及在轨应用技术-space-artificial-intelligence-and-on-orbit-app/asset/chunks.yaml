- raw: '进入21世纪以来，特别是在过去10年间，历经两次寒冬的人工智能再度强势崛起。其中，以深度学习为代表的人工智能应用，在特征识别和知识存取等静态封闭的复杂场景下，取得了傲人的成就，机器取代人类工作似乎不再遥不可及。但与此同时，必须清醒地看到，目前人工智能在机器人控制和自动驾驶等动态开放场景下的表现，还远不尽人意，包括硅谷钢铁侠埃隆·马斯克（E.R.Musk）在内的很多有识之士，都认为人和机器各有所长，而通过脑机接口实现人机融合，才是未来人机关系的终极解决方案。


    近年来，脑机接口相关技术如雨后春笋般涌现，并不断更新迭代，其商业化进程也在Neuralink和脸书（Facebook）等科技巨头的助推下不断提速，使得意念控制物体等以前还是科幻的场景，正在实验室中一步步变成现实。但是，脑机接口这一复杂的系统工程要真正落地得到广泛应用，还需要神经科学、数理科学、医学、心理学、材料科学、计算机科学、机器人学、自动控制等多学科的通力协作，以及多个相关领域对关键问题的突破。


    近年来，美国、欧盟、日本等国家（地区）纷纷宣布启动脑科学研究，即“脑计划”，从战略层面对脑机接口进行了顶层设计。美国于2013年发布BRAIN Initiative，欧盟于2013年启动Human
    Brain Project，日本于2014年发布Brain/Minds Project。中国“脑计划”于2016年提出，正式启动于2021年，“脑科学与类脑研究”成为“科技创新2030重大项目”最早运行的试点项目之一，提出了“新型无创脑机接口技术”“柔性脑机接口”等相关重点项目。《“十四五”医疗装备产业发展规划》明确提出，发展基于机器人、智能视觉与语音交互、脑机接口、人-机-电融合与智能控制技术的新型护理康复装备。


    全球多国政府、科研机构和企业加速布局脑机接口，抢占全球科技竞争战略高地。美国BRAIN Initiative为期至少10年，预计投入45亿美元；美国国立卫生研究院（NIH）持续加大对“脑计划”研究项目的投资，2018年支持总额超过4亿美元；美国国防高级研究计划局（DARPA）布局多项脑科学前沿研究。我国先后启动了“973”“863”计划和科技支撑计划，对脑科学研究总投入约14亿元人民币；国家自然科学基金资助脑研究的经费近20亿元人民币，2012年起中科院启动的B类先导专项“脑功能联结图谱计划”，每年投入经费约6
    000万元人民币。2021年9月，中国科技部正式发布科技创新2030“脑科学与类脑研究”重大项目，首批资金为30亿元人民币，后续资金规模可达数百亿元人民币。2022年2月，装备发展部发布了脑机接口基础器件预研专项指南，共13项指南，项目金额200万～1
    000万元人民币不等。


    脑机接口技术得到长足进步和飞速发展，战略意义不断被提高，应用场景不断扩大，产业繁荣发展，将广泛应用于载人航天、深空探测等领域，助力空间应用技术发展。


    4.3　空间智能人机交互关键技术


    本节分别从大数据可视化交互、基于声场感知交互、混合现实实物交互、可穿戴交互和人机对话交互方面介绍人机交互的关键技术。


    4.3.1　大数据可视化交互技术


    可视化是一种数据分析和探索的重要科学技术。该技术是将抽象数据转换成图形化表征，通过交互界面促进分析推理，在城市规划、医疗诊断和运动训练等领域起着关键作用。


    1.大数据可视化设计


    如何可视化复杂结构的海量数据依旧是一个挑战，尤其是具有三维空间信息的数据。传统的平面式呈现将视觉通道和视觉反馈局限于二维空间中，同时也限制了设计空间。沉浸式设备的发展释放了用户的立体视觉，研究者们开始发掘三维交互空间在可视化中的潜力。人们对三维的视觉感知来自双目视差、遮挡和相对大小等深度提示。一方面，用户能够轻易识别三维物体的形态；另一方面，三维中的视角倾斜会使二维平面图形产生形变，使用户难以识别。因此，如何在三维环境中进行有效的可视化设计是大数据可视化交互领域的研究热点之一。


    在三维环境中，Kraus等人通过用户实验发现，相比于二维平面上的散点图，用户可以在虚拟现实环境下更加有效地识别三维散点图中的聚类。Alper等人提出了一种在三维环境中对图数据结构进行可视化的方法。该技术利用立体深度，通过将用户感兴趣的区域投影到更靠近用户视线的平面上进行突出显示。然而，上述可视化方法占据了三维位置的视觉通道，因此不能编码点在三维环境中的位置。为了解决上述问题，Krüger以及Krekhov等人提出了Deadeye技术，通过分裂呈现的方法对点进行突出显示。Ssin等人提出了一种基于时空立方体对轨迹数据进行可视化的系统Geo
    Gate。该系统扩展了时空立方体，并采用一个环形用户界面来探索多个位置数据集中实物之间的相关性。Filho等人提出了一种虚拟现实环境下的时空数据可视化系统。该工作使用时空立方体构建虚拟现实环境下的原型系统，将多维数据集与用户桌面的虚拟表示相结合。


    2.非视觉感知的交互辅助


    非视觉感知包括听觉、触觉、嗅觉与味觉。近年来，多模态硬件技术愈发成熟，用以产生或模拟非视觉感知的设备逐步地小型化与商业化，这促使大数据可视化交互领域开始研究非视觉的交互方式。这种数据交互方法将用户沉浸在数据中，并在视觉感知外提供听觉、触觉等感知通道，提升用户的参与感与沉浸感，让用户感知在单一视觉通道上难以被发现的细节和模式。Franklin和Roberts将饼图中的类别信息、占比转化为各类型的声音；Xi和Kelley则提出了利用声音分析时序数据的工具。触觉感知能够为用户提供物体纹理、温度和振动幅度等类别或连续的信息。利用振幅的大小，Prouzeau等人将三维散点图中点云的密度映射为不同振幅的等级，提升了用户发现点云中心高或低密度区域的感知能力。嗅觉与味觉具有易于记忆和识别的优势。ViScent提出了不同气味与数据类型的映射空间以将数据编码为不同的气味。非视觉感知作为视觉感知的补充，能够提升用户分析理解数据的效率。例如，在分析大量或高密度分布的数据可视化时，让用户感知视野之外或被遮挡的数据信息。


    3.多模态交互设计


    在大数据可视化交互领域，除了可视化设计，现有的研究重点还集中在探索更加自然直观的交互方式，以提升人们在三维空间对大数据可视化的操作效率。多模态交互结合单一模态的优点，充分发挥了人们对各个感知通道传达信息的高度接收与处理能力，增强用户对交互行为的理解，提高对大数据可视化的探索与分析效率。


    1）基于接触的交互


    基于接触的交互支持用户直接通过手部或者手持传感器触碰可视化标记，传递对数据的交互表达。这类自然交互方式的操作精度较高，并且能够增强用户在探索大数据可视化时对信息的理解。Langner等人通过平板触控的方式准确地选择可视化图表以更新HoloLens中所见的增强内容。除了增强现实环境中基于触屏的交互方式外，接触式交互在虚拟现实中也很常见。Usher等人的VR系统可以通过跟踪用户手部动作来捕获用户勾勒出来的脑神经路径。


    2）基于手势的交互


    基于手势的交互使用可跟踪设备或捕捉用户手指的移动来捕捉手部动作，帮助用户完成对数据的操控。Ray Cursor增加了沿投射光线方向的红色的控制光标来避免被遮挡散点的选择。此外，Fiber
    Clay支持用户操控手柄射出的射线来完成对轨迹的筛选。除了光线投射技术的指向隐喻，其他诸如抓取、拖动等的隐喻也都有相关研究。Wagner等人采用了虚拟手的隐喻，设计抓取和拉伸等动作完成对时空轨迹可视化的移动、缩放和选择等操作；Yang等人利用双手合拢与展开的手势实现了散点图的缩放操作；Tilt
    Map通过改变手柄的倾斜角度来实现对地图可视化的不同视图之间的切换。


    3）基于注视的交互


    基于注视的交互通过眼动追踪技术捕捉用户的视线焦点，从而理解用户视线中传递的信息。Sidenmark等人使用该技术辅助用户在虚拟三维场景中选择一些被遮挡的物体：用户注视物体轮廓上的圆点，并使用视线控制圆点在物体未被遮挡的轮廓线上移动，从而精准地选中被部分遮挡的物体。Alghofaili等人则使用长短时记忆网络模型对用户眼动数据进行异常检测，从而判断用户是否适应当前的虚拟环境，并在用户迷失时给予辅助反馈。


    4）基于移动导航的交互


    移动导航也是探索呈现在虚拟的广阔三维场景里的大数据可视化中一个重要的交互模态。Abtahi等人通过建立3个层级的真实速度到虚拟速度的映射，便于用户在狭小的真实空间内遍历数据可视化呈现空间。此外，虚拟移动技术更进一步地拓宽了遍历虚拟空间的可能性。此类技术包括指定位置进行直接传送、使用三维缩略图进行传送以及使用手柄控制飞行动作等。


    4.3.2　基于声场感知交互技术


    本小节从基于声场感知的动作识别、基于声源定位的交互技术、基于副语音信息的语音交互增强以及普适设备上的音频感知与识别4个方面综述国际上基于声场感知的交互技术。


    1.基于声场感知的动作识别


    基于声场感知实现不同手势与动作的识别是人机交互的热点研究内容，基于手势或者姿态带来声场变化的基础，实现手势或动作的识别。例如，使用耳机上的麦克风识别摘戴耳机是最直观的手势识别，Röddiger等人利用内耳麦克风识别出了中耳内鼓膜张肌的收缩等用于交互。Han等人通过手表上特殊排布的麦克风阵列识别了手腕的转动、拍手臂、不同位置打响指等手势。Bem
    Band利用腕带上超声波信号完成了对手掌姿态、竖拇指等手势的识别。随着近几年传感器精度和质量的逐步提升，更多相关研究提高了手势识别的准确度与精度，Finger
    Sound与Finger Ping均识别拇指在其他手指上的点击与捏合动作，且Finger Ping利用了不同手势下的共振信息，减少了对陀螺仪的依赖，Tap
    Skin识别出了手表附近皮肤上的点击等更精细的手势交互动作。


    2.基于声源定位的交互技术


    声学测距的常用方法包括基于多普勒效应、基于相关和基于相位的测距方法。此外，在雷达系统中广泛应用的调频连续波也在近些年应用于声学测距。基于以上声学测距技术，可以实现手势识别、设备追踪等交互技术。AA
    Mouse实现了中位数误差1.4 cm的精确追踪，通过追踪手中移动设备的位置，实现鼠标的功能。BeepBeep使用线性调频信号和两路感知技术实现了设备间厘米级精度的距离测量。Tracko基于BeepBeep中提出的算法，融合BLE（Bluetooth
    Low Energy）和IMU（Inertial Measurement Unit），实现设备间的三维空间感知。基于手指、手掌运动导致回波相位的改变，LLAP实现了4.6
    mm的二维追踪精度，实现了不需要佩戴额外设备的手势追踪。Finger IO应用正交频分复用技术来追踪手指的回波，不需要在手指上佩戴其他的传感器，实现了平均精度为8
    mm的二维手指追踪。


    3.基于副语音信息的语音交互增强


    近年来有许多研究者研究了利用“言语中的非言语信息”来加强语音互动。Goto等人提出利用语音过程中的用户在元音处的短暂停顿自动显示候选短语辅助用户记忆，并提出了利用用户有意控制的音高移位切换语音输入模式。Kitayama等人提出了利用自然语音交互中的口语现象和停顿进行噪声鲁棒的端点检测和免唤醒。Kobayashi和Fujie研究了人-机器人对话中的副语言协议。Harada等人研究了利用元音质量、音量和音高等属性的光标控制。House等人将这一思想延续到利用连续声音特征控制三维机械臂。Igarashi和Hughes研究了利用非言语信息的连续语音控制和速率的参数。


    4.普适设备上的音频感知与识别


    普适音频设备对于音频数据的实时性采集使得其在声音实时分类事件上具有优势。例如，Rossi等人提出了利用智能手机麦克风实时进行环境声音识别的系统Ambient
    Sense。Thomaz等人提出利用腕部音频设备捕捉环境声音，进行识别后推断用户饮食活动的方法，帮助用户进行饮食自我监测。Amoh和Odame提出利用可穿戴声学传感器结合卷积神经网络检测咳嗽的技术。与环境的声音检测类似，对于更广义上的用户行为，Lu等人利用手机麦克风对人当前活动（开车、乘坐公交车等）的识别进行了探索。商业产品或应用也快速发展与成熟，其中最具有代表性的是苹果手机和手表上的环境声感知（咳嗽、报警等）。


    4.3.3　混合现实实物交互技术


    在实物交互系统中，用户通过使用在真实环境中存在的实物对象与虚拟环境进行交互。由于用户对实物本身的各种特性（如形状、重量）非常熟悉，可以使交互的过程更为精准和高效。近年来，将实物交互界面技术融入虚拟现实和增强现实已成为本领域的一个主流方向，并逐渐形成了“实物混合现实”的概念，这也正是被动力触觉的概念基础。Zhao等人将实物交互的触觉分为3种方式，即静态的被动力触觉、相遇型被动力触觉和主动的力触觉。由于主动力触觉装置比较昂贵，目前的研究很少，主要研究方向仍是静态的被动力触觉和相遇型被动力触觉。


    1.静态的被动力触觉


    在静态的被动力触觉方面，加拿大多伦多大学和美国芝加哥大学等团队曾提出过Thors Hammer以及PHANTOM两种比较具有代表性的研究。通过1∶1制作的物理实物道具提供逼真的动觉和触觉反馈，提高用户的触摸感受以及操作能力，并且可以通过对实物的触摸来对虚拟对象进行操作。加拿大多伦多大学的Araujo等人提出了Snake
    Charmer，可以动态地改变交互对象的纹理特征和材质信息，且在虚拟环境中渲染不同的对象时仍能够保持触觉和视觉的一致性。


    2.相遇型被动力触觉


    1993年，McNeely就提出机器人图形的概念。他认为触觉输出具有极大的价值，并建议使用机械臂或者机器人作为形状载体，动态地提供物理反馈。美国斯坦福大学的Choi等人提出的Wolverine是一个典型的例子。Wolverine通过低成本和轻量级的设备，可以直接在拇指和3根手指之间产生力，以模拟垫式握持式物体，如抓握茶杯和球。在低功耗的情况下能反馈超过100
    N的反馈力。日本东京大学的Transcalibur以及JetController，而Transcalibur是一个可以手持的二维移动VR控制器，可以在二维平面空间改变其质量特性的硬件原型，并应用数据驱动方法获取质量特性与感知形状之间的映射关系。Cheng等人使用TurkDeck的方法，借助工作人员将一系列通用模块搬运和组装为用户即将触碰到的被动实物，使用户不仅能够看到、听到，还能触摸到整个虚拟环境。Suzuki等人在此基础之上提出了Roomshift方法，通过实时控制混合现实交互空间的小车来移动环境中的实物物体，提供多种交互方式。


    3.产业界进展


    在产业界，Facebook和Microsoft是研究混合现实被动力触觉交互的中坚力量。2019年Facebook更新了交互装置Tasbi，开发了一款具有震动和挤压两种反馈方式的触觉回馈腕带。2020年，Microsoft提出了PIVOT，通过可变形的交互装置实现动态的相遇型触觉反馈。PIVOT是一个戴在手腕上的触觉设备，可以根据需要将虚拟对象呈现在用户的手上。Dexmo在2020年发布了新的触觉手套，Dexmo外骨骼手套制作精良，该产品面向企业市场。Dexmo触觉手套支持跟踪多达11个自由度的手势，可以灵巧地捕获用户完整的手部动作，从而使用户在虚拟环境中拥有逼真的手指感。


    4.3.4　可穿戴交互技术


    国际上可穿戴交互主要分为以手表、手环形式为主的手势交互和触控交互的研究以及电子皮肤技术与交互设计。


    1.手势交互与触控交互


    手势输入被认为是构成“自然人机界面”的核心内容之一，同样适用于探索可穿戴设备的输入方式。美国华盛顿大学和微软研究院的联合项目推进了肌肉电信号（Electromyogram，EMG）在手势界面中的应用。EMG通过测量电极对之间的电势来感知肌肉活动，这可以通过侵入式（在肌肉中使用针头）或从皮肤表面进行。2015年，谷歌发布的Soli智能芯片运用微型雷达监测空中手势动作，可以追踪亚毫米精准度的手指高速运动。德国的Patric
    Baudisch团队尝试了通过腕带手表在皮肤上实现拖动的触感，可设计简单且容易被用户感知和记忆的字符和图标。韩国科学技术院的人机交互团队探索了使用针阵列的触觉方式在手指上提供经过编译的信息，以及通过气流在皮肤表皮实现非接触式的压力触感。加拿大多伦多大学利用记忆金属在手腕上实现挤压的触觉反馈，通过控制驱动的线宽、力和速度产生不同感受的反馈。美国斯坦福大学的Sean
    Follmer团队通过设计手持式触觉设备来模拟虚拟操作物体的重力反馈。


    2.电子皮肤交互


    皮肤作为人们与外界接触的天然界面，已初步用于探索在信息交互中的作用并在若干方面的应用中体现了其优势。德国萨尔大学的Jürgen Steimle团队近些年通过导电墨水、电极制作纹身纸，作为电子皮肤实现在皮肤上的显示、触摸和手势识别。美国卡内基梅隆大学的Chris
    Harrison团队采取了在皮肤上投影的方式，通过肩戴投影或手表微投影，将手臂、手背变成显示屏，并通过深度相机或红外线等方式支持手指在皮肤表面的触控。这种方式可以更好地支持探索人们使用皮肤界面的体验，但缺点也显而易见，即需要较为复杂的投影等附属设备。同时，该团队系统地研究了把身体的各个部位当作触摸界面时的可行性和用户的喜好程度，对后续的研究具有参考价值。


    4.3.5　人机对话交互技术


    人机对话交互过程涉及语音识别、情感识别、对话系统和语音合成等多个模块。首先，用户输入的语音通过语音识别和情感识别模块转化为相应的文本和情感标签。其次，对话系统用其来理解用户所表达的内容，并生成对话回复。最后，语音合成模块将对话回复转换为语音，与用户进行交互。


    1.语音识别


    总体概括来说，低延迟语音识别和低资源语音识别成为研究热点。目前，国际上针对低延迟语音识别主要从两方面进行研究：一方面是研究流式语音识别，实现边听边识别，以此来降低识别出每个标记的延迟；另一方面是研究非自回归语言识别，通过摆脱解码时的时序依赖从而加速整个系统的识别速度。针对流式语音识别的研究主要有两种思路：一种是针对RNN-Transducer模型进行改进，提出了表现更好的Transformer-Transducer、Conformer-Transducer。双通解码方法的提出，进一步提升了基于Transducer的流式识别模型的准确率。另一种是对基于注意力机制的编码解码模型（Attention-based
    Encoder Decoder，AED）的改进，其实现思路主要是改进单调逐块注意力机制（Monotonic Chunk-wise Attention，MoChA），其解决的主要问题是MoChA模型在Transformer上的适配以及通过辅助手段对模型切分编码状态的位置以及数量进行约束。


    2.语音情感识别'
  fmt: '

    进入21世纪以来，特别是在过去10年间，历经两次寒冬的人工智能再度强势崛起。其中，以深度学习为代表的人工智能应用，在特征识别和知识存取等静态封闭的复杂场景下，取得了傲人的成就，机器取代人类工作似乎不再遥不可及。但与此同时，必须清醒地看到，目前人工智能在机器人控制和自动驾驶等动态开放场景下的表现，还远不尽人意，包括硅谷钢铁侠埃隆·马斯克（E.R.Musk）在内的很多有识之士，都认为人和机器各有所长，而通过脑机接口实现人机融合，才是未来人机关系的终极解决方案。


    近年来，脑机接口相关技术如雨后春笋般涌现，并不断更新迭代，其商业化进程也在Neuralink和脸书（Facebook）等科技巨头的助推下不断提速，使得意念控制物体等以前还是科幻的场景，正在实验室中一步步变成现实。但是，脑机接口这一复杂的系统工程要真正落地得到广泛应用，还需要神经科学、数理科学、医学、心理学、材料科学、计算机科学、机器人学、自动控制等多学科的通力协作，以及多个相关领域对关键问题的突破。


    近年来，美国、欧盟、日本等国家（地区）纷纷宣布启动脑科学研究，即“脑计划”，从战略层面对脑机接口进行了顶层设计。美国于2013年发布BRAIN Initiative，欧盟于2013年启动Human
    Brain Project，日本于2014年发布Brain/Minds Project。中国“脑计划”于2016年提出，正式启动于2021年，“脑科学与类脑研究”成为“科技创新2030重大项目”最早运行的试点项目之一，提出了“新型无创脑机接口技术”“柔性脑机接口”等相关重点项目。《“十四五”医疗装备产业发展规划》明确提出，发展基于机器人、智能视觉与语音交互、脑机接口、人-机-电融合与智能控制技术的新型护理康复装备。


    全球多国政府、科研机构和企业加速布局脑机接口，抢占全球科技竞争战略高地。美国BRAIN Initiative为期至少10年，预计投入45亿美元；美国国立卫生研究院（NIH）持续加大对“脑计划”研究项目的投资，2018年支持总额超过4亿美元；美国国防高级研究计划局（DARPA）布局多项脑科学前沿研究。我国先后启动了“973”“863”计划和科技支撑计划，对脑科学研究总投入约14亿元人民币；国家自然科学基金资助脑研究的经费近20亿元人民币，2012年起中科院启动的B类先导专项“脑功能联结图谱计划”，每年投入经费约6
    000万元人民币。2021年9月，中国科技部正式发布科技创新2030“脑科学与类脑研究”重大项目，首批资金为30亿元人民币，后续资金规模可达数百亿元人民币。2022年2月，装备发展部发布了脑机接口基础器件预研专项指南，共13项指南，项目金额200万～1
    000万元人民币不等。


    脑机接口技术得到长足进步和飞速发展，战略意义不断被提高，应用场景不断扩大，产业繁荣发展，将广泛应用于载人航天、深空探测等领域，助力空间应用技术发展。


    ## 4.3 空间智能人机交互关键技术


    本节分别从大数据可视化交互、基于声场感知交互、混合现实实物交互、可穿戴交互和人机对话交互方面介绍人机交互的关键技术。


    ### 4.3.1 大数据可视化交互技术


    可视化是一种数据分析和探索的重要科学技术。该技术是将抽象数据转换成图形化表征，通过交互界面促进分析推理，在城市规划、医疗诊断和运动训练等领域起着关键作用。


    #### 1. 大数据可视化设计


    如何可视化复杂结构的海量数据依旧是一个挑战，尤其是具有三维空间信息的数据。传统的平面式呈现将视觉通道和视觉反馈局限于二维空间中，同时也限制了设计空间。沉浸式设备的发展释放了用户的立体视觉，研究者们开始发掘三维交互空间在可视化中的潜力。人们对三维的视觉感知来自双目视差、遮挡和相对大小等深度提示。一方面，用户能够轻易识别三维物体的形态；另一方面，三维中的视角倾斜会使二维平面图形产生形变，使用户难以识别。因此，如何在三维环境中进行有效的可视化设计是大数据可视化交互领域的研究热点之一。


    在三维环境中，Kraus等人通过用户实验发现，相比于二维平面上的散点图，用户可以在虚拟现实环境下更加有效地识别三维散点图中的聚类。Alper等人提出了一种在三维环境中对图数据结构进行可视化的方法。该技术利用立体深度，通过将用户感兴趣的区域投影到更靠近用户视线的平面上进行突出显示。然而，上述可视化方法占据了三维位置的视觉通道，因此不能编码点在三维环境中的位置。为了解决上述问题，Krüger以及Krekhov等人提出了Deadeye技术，通过分裂呈现的方法对点进行突出显示。Ssin等人提出了一种基于时空立方体对轨迹数据进行可视化的系统Geo
    Gate。该系统扩展了时空立方体，并采用一个环形用户界面来探索多个位置数据集中实物之间的相关性。Filho等人提出了一种虚拟现实环境下的时空数据可视化系统。该工作使用时空立方体构建虚拟现实环境下的原型系统，将多维数据集与用户桌面的虚拟表示相结合。


    #### 2. 非视觉感知的交互辅助


    非视觉感知包括听觉、触觉、嗅觉与味觉。近年来，多模态硬件技术愈发成熟，用以产生或模拟非视觉感知的设备逐步地小型化与商业化，这促使大数据可视化交互领域开始研究非视觉的交互方式。这种数据交互方法将用户沉浸在数据中，并在视觉感知外提供听觉、触觉等感知通道，提升用户的参与感与沉浸感，让用户感知在单一视觉通道上难以被发现的细节和模式。Franklin和Roberts将饼图中的类别信息、占比转化为各类型的声音；Xi和Kelley则提出了利用声音分析时序数据的工具。触觉感知能够为用户提供物体纹理、温度和振动幅度等类别或连续的信息。利用振幅的大小，Prouzeau等人将三维散点图中点云的密度映射为不同振幅的等级，提升了用户发现点云中心高或低密度区域的感知能力。嗅觉与味觉具有易于记忆和识别的优势。ViScent提出了不同气味与数据类型的映射空间以将数据编码为不同的气味。非视觉感知作为视觉感知的补充，能够提升用户分析理解数据的效率。例如，在分析大量或高密度分布的数据可视化时，让用户感知视野之外或被遮挡的数据信息。


    #### 3. 多模态交互设计


    在大数据可视化交互领域，除了可视化设计，现有的研究重点还集中在探索更加自然直观的交互方式，以提升人们在三维空间对大数据可视化的操作效率。多模态交互结合单一模态的优点，充分发挥了人们对各个感知通道传达信息的高度接收与处理能力，增强用户对交互行为的理解，提高对大数据可视化的探索与分析效率。


    ##### 1）基于接触的交互


    基于接触的交互支持用户直接通过手部或者手持传感器触碰可视化标记，传递对数据的交互表达。这类自然交互方式的操作精度较高，并且能够增强用户在探索大数据可视化时对信息的理解。Langner等人通过平板触控的方式准确地选择可视化图表以更新HoloLens中所见的增强内容。除了增强现实环境中基于触屏的交互方式外，接触式交互在虚拟现实中也很常见。Usher等人的VR系统可以通过跟踪用户手部动作来捕获用户勾勒出来的脑神经路径。


    ##### 2）基于手势的交互


    基于手势的交互使用可跟踪设备或捕捉用户手指的移动来捕捉手部动作，帮助用户完成对数据的操控。Ray Cursor增加了沿投射光线方向的红色的控制光标来避免被遮挡散点的选择。此外，Fiber
    Clay支持用户操控手柄射出的射线来完成对轨迹的筛选。除了光线投射技术的指向隐喻，其他诸如抓取、拖动等的隐喻也都有相关研究。Wagner等人采用了虚拟手的隐喻，设计抓取和拉伸等动作完成对时空轨迹可视化的移动、缩放和选择等操作；Yang等人利用双手合拢与展开的手势实现了散点图的缩放操作；Tilt
    Map通过改变手柄的倾斜角度来实现对地图可视化的不同视图之间的切换。


    ##### 3）基于注视的交互


    基于注视的交互通过眼动追踪技术捕捉用户的视线焦点，从而理解用户视线中传递的信息。Sidenmark等人使用该技术辅助用户在虚拟三维场景中选择一些被遮挡的物体：用户注视物体轮廓上的圆点，并使用视线控制圆点在物体未被遮挡的轮廓线上移动，从而精准地选中被部分遮挡的物体。Alghofaili等人则使用长短时记忆网络模型对用户眼动数据进行异常检测，从而判断用户是否适应当前的虚拟环境，并在用户迷失时给予辅助反馈。


    ##### 4）基于移动导航的交互


    移动导航也是探索呈现在虚拟的广阔三维场景里的大数据可视化中一个重要的交互模态。Abtahi等人通过建立3个层级的真实速度到虚拟速度的映射，便于用户在狭小的真实空间内遍历数据可视化呈现空间。此外，虚拟移动技术更进一步地拓宽了遍历虚拟空间的可能性。此类技术包括指定位置进行直接传送、使用三维缩略图进行传送以及使用手柄控制飞行动作等。


    ### 4.3.2 基于声场感知交互技术


    本小节从基于声场感知的动作识别、基于声源定位的交互技术、基于副语音信息的语音交互增强以及普适设备上的音频感知与识别4个方面综述国际上基于声场感知的交互技术。


    #### 1. 基于声场感知的动作识别


    基于声场感知实现不同手势与动作的识别是人机交互的热点研究内容，基于手势或者姿态带来声场变化的基础，实现手势或动作的识别。例如，使用耳机上的麦克风识别摘戴耳机是最直观的手势识别，Röddiger等人利用内耳麦克风识别出了中耳内鼓膜张肌的收缩等用于交互。Han等人通过手表上特殊排布的麦克风阵列识别了手腕的转动、拍手臂、不同位置打响指等手势。Bem
    Band利用腕带上超声波信号完成了对手掌姿态、竖拇指等手势的识别。随着近几年传感器精度和质量的逐步提升，更多相关研究提高了手势识别的准确度与精度，Finger
    Sound与Finger Ping均识别拇指在其他手指上的点击与捏合动作，且Finger Ping利用了不同手势下的共振信息，减少了对陀螺仪的依赖，Tap
    Skin识别出了手表附近皮肤上的点击等更精细的手势交互动作。


    #### 2. 基于声源定位的交互技术


    声学测距的常用方法包括基于多普勒效应、基于相关和基于相位的测距方法。此外，在雷达系统中广泛应用的调频连续波也在近些年应用于声学测距。基于以上声学测距技术，可以实现手势识别、设备追踪等交互技术。AA
    Mouse实现了中位数误差1.4 cm的精确追踪，通过追踪手中移动设备的位置，实现鼠标的功能。BeepBeep使用线性调频信号和两路感知技术实现了设备间厘米级精度的距离测量。Tracko基于BeepBeep中提出的算法，融合BLE（Bluetooth
    Low Energy）和IMU（Inertial Measurement Unit），实现设备间的三维空间感知。基于手指、手掌运动导致回波相位的改变，LLAP实现了4.6
    mm的二维追踪精度，实现了不需要佩戴额外设备的手势追踪。Finger IO应用正交频分复用技术来追踪手指的回波，不需要在手指上佩戴其他的传感器，实现了平均精度为8
    mm的二维手指追踪。


    #### 3. 基于副语音信息的语音交互增强


    近年来有许多研究者研究了利用“言语中的非言语信息”来加强语音互动。Goto等人提出利用语音过程中的用户在元音处的短暂停顿自动显示候选短语辅助用户记忆，并提出了利用用户有意控制的音高移位切换语音输入模式。Kitayama等人提出了利用自然语音交互中的口语现象和停顿进行噪声鲁棒的端点检测和免唤醒。Kobayashi和Fujie研究了人-机器人对话中的副语言协议。Harada等人研究了利用元音质量、音量和音高等属性的光标控制。House等人将这一思想延续到利用连续声音特征控制三维机械臂。Igarashi和Hughes研究了利用非言语信息的连续语音控制和速率的参数。


    #### 4. 普适设备上的音频感知与识别


    普适音频设备对于音频数据的实时性采集使得其在声音实时分类事件上具有优势。例如，Rossi等人提出了利用智能手机麦克风实时进行环境声音识别的系统Ambient
    Sense。Thomaz等人提出利用腕部音频设备捕捉环境声音，进行识别后推断用户饮食活动的方法，帮助用户进行饮食自我监测。Amoh和Odame提出利用可穿戴声学传感器结合卷积神经网络检测咳嗽的技术。与环境的声音检测类似，对于更广义上的用户行为，Lu等人利用手机麦克风对人当前活动（开车、乘坐公交车等）的识别进行了探索。商业产品或应用也快速发展与成熟，其中最具有代表性的是苹果手机和手表上的环境声感知（咳嗽、报警等）。


    ### 4.3.3 混合现实实物交互技术


    在实物交互系统中，用户通过使用在真实环境中存在的实物对象与虚拟环境进行交互。由于用户对实物本身的各种特性（如形状、重量）非常熟悉，可以使交互的过程更为精准和高效。近年来，将实物交互界面技术融入虚拟现实和增强现实已成为本领域的一个主流方向，并逐渐形成了“实物混合现实”的概念，这也正是被动力触觉的概念基础。Zhao等人将实物交互的触觉分为3种方式，即静态的被动力触觉、相遇型被动力触觉和主动的力触觉。由于主动力触觉装置比较昂贵，目前的研究很少，主要研究方向仍是静态的被动力触觉和相遇型被动力触觉。


    #### 1. 静态的被动力触觉


    在静态的被动力触觉方面，加拿大多伦多大学和美国芝加哥大学等团队曾提出过Thors Hammer以及PHANTOM两种比较具有代表性的研究。通过1∶1制作的物理实物道具提供逼真的动觉和触觉反馈，提高用户的触摸感受以及操作能力，并且可以通过对实物的触摸来对虚拟对象进行操作。加拿大多伦多大学的Araujo等人提出了Snake
    Charmer，可以动态地改变交互对象的纹理特征和材质信息，且在虚拟环境中渲染不同的对象时仍能够保持触觉和视觉的一致性。


    #### 2. 相遇型被动力触觉


    1993年，McNeely就提出机器人图形的概念。他认为触觉输出具有极大的价值，并建议使用机械臂或者机器人作为形状载体，动态地提供物理反馈。美国斯坦福大学的Choi等人提出的Wolverine是一个典型的例子。Wolverine通过低成本和轻量级的设备，可以直接在拇指和3根手指之间产生力，以模拟垫式握持式物体，如抓握茶杯和球。在低功耗的情况下能反馈超过100
    N的反馈力。日本东京大学的Transcalibur以及JetController，而Transcalibur是一个可以手持的二维移动VR控制器，可以在二维平面空间改变其质量特性的硬件原型，并应用数据驱动方法获取质量特性与感知形状之间的映射关系。Cheng等人使用TurkDeck的方法，借助工作人员将一系列通用模块搬运和组装为用户即将触碰到的被动实物，使用户不仅能够看到、听到，还能触摸到整个虚拟环境。Suzuki等人在此基础之上提出了Roomshift方法，通过实时控制混合现实交互空间的小车来移动环境中的实物物体，提供多种交互方式。


    #### 3. 产业界进展


    在产业界，Facebook和Microsoft是研究混合现实被动力触觉交互的中坚力量。2019年Facebook更新了交互装置Tasbi，开发了一款具有震动和挤压两种反馈方式的触觉回馈腕带。2020年，Microsoft提出了PIVOT，通过可变形的交互装置实现动态的相遇型触觉反馈。PIVOT是一个戴在手腕上的触觉设备，可以根据需要将虚拟对象呈现在用户的手上。Dexmo在2020年发布了新的触觉手套，Dexmo外骨骼手套制作精良，该产品面向企业市场。Dexmo触觉手套支持跟踪多达11个自由度的手势，可以灵巧地捕获用户完整的手部动作，从而使用户在虚拟环境中拥有逼真的手指感。


    ### 4.3.4 可穿戴交互技术


    国际上可穿戴交互主要分为以手表、手环形式为主的手势交互和触控交互的研究以及电子皮肤技术与交互设计。


    #### 1. 手势交互与触控交互


    手势输入被认为是构成“自然人机界面”的核心内容之一，同样适用于探索可穿戴设备的输入方式。美国华盛顿大学和微软研究院的联合项目推进了肌肉电信号（Electromyogram，EMG）在手势界面中的应用。EMG通过测量电极对之间的电势来感知肌肉活动，这可以通过侵入式（在肌肉中使用针头）或从皮肤表面进行。2015年，谷歌发布的Soli智能芯片运用微型雷达监测空中手势动作，可以追踪亚毫米精准度的手指高速运动。德国的Patric
    Baudisch团队尝试了通过腕带手表在皮肤上实现拖动的触感，可设计简单且容易被用户感知和记忆的字符和图标。韩国科学技术院的人机交互团队探索了使用针阵列的触觉方式在手指上提供经过编译的信息，以及通过气流在皮肤表皮实现非接触式的压力触感。加拿大多伦多大学利用记忆金属在手腕上实现挤压的触觉反馈，通过控制驱动的线宽、力和速度产生不同感受的反馈。美国斯坦福大学的Sean
    Follmer团队通过设计手持式触觉设备来模拟虚拟操作物体的重力反馈。


    #### 2. 电子皮肤交互


    皮肤作为人们与外界接触的天然界面，已初步用于探索在信息交互中的作用并在若干方面的应用中体现了其优势。德国萨尔大学的Jürgen Steimle团队近些年通过导电墨水、电极制作纹身纸，作为电子皮肤实现在皮肤上的显示、触摸和手势识别。美国卡内基梅隆大学的Chris
    Harrison团队采取了在皮肤上投影的方式，通过肩戴投影或手表微投影，将手臂、手背变成显示屏，并通过深度相机或红外线等方式支持手指在皮肤表面的触控。这种方式可以更好地支持探索人们使用皮肤界面的体验，但缺点也显而易见，即需要较为复杂的投影等附属设备。同时，该团队系统地研究了把身体的各个部位当作触摸界面时的可行性和用户的喜好程度，对后续的研究具有参考价值。


    ### 4.3.5 人机对话交互技术


    人机对话交互过程涉及语音识别、情感识别、对话系统和语音合成等多个模块。首先，用户输入的语音通过语音识别和情感识别模块转化为相应的文本和情感标签。其次，对话系统用其来理解用户所表达的内容，并生成对话回复。最后，语音合成模块将对话回复转换为语音，与用户进行交互。


    #### 1. 语音识别


    总体概括来说，低延迟语音识别和低资源语音识别成为研究热点。目前，国际上针对低延迟语音识别主要从两方面进行研究：一方面是研究流式语音识别，实现边听边识别，以此来降低识别出每个标记的延迟；另一方面是研究非自回归语言识别，通过摆脱解码时的时序依赖从而加速整个系统的识别速度。针对流式语音识别的研究主要有两种思路：一种是针对RNN-Transducer模型进行改进，提出了表现更好的Transformer-Transducer、Conformer-Transducer。双通解码方法的提出，进一步提升了基于Transducer的流式识别模型的准确率。另一种是对基于注意力机制的编码解码模型（Attention-based
    Encoder Decoder，AED）的改进，其实现思路主要是改进单调逐块注意力机制（Monotonic Chunk-wise Attention，MoChA），其解决的主要问题是MoChA模型在Transformer上的适配以及通过辅助手段对模型切分编码状态的位置以及数量进行约束。


    #### 2. 语音情感识别

    '
  trans: '


    进入 21 世纪以来，特别是在过去 10 年间，历经两次寒冬的人工智能再度强势崛起。其中，以深度学习为代表的人工智能应用，在特征识别和知识存取等静态封闭的复杂场景下，取得了傲人的成就，机器取代人类工作似乎不再遥不可及。但与此同时，必须清醒地看到，目前人工智能在机器人控制和自动驾驶等动态开放场景下的表现，还远不尽人意，包括硅谷钢铁侠埃隆·马斯克（E.R.Musk）在内的很多有识之士，都认为人和机器各有所长，而通过脑机接口实现人机融合，才是未来人机关系的终极解决方案。


    近年来，脑机接口相关技术如雨后春笋般涌现，并不断更新迭代，其商业化进程也在 Neuralink 和脸书（Facebook）等科技巨头的助推下不断提速，使得意念控制物体等以前还是科幻的场景，正在实验室中一步步变成现实。但是，脑机接口这一复杂的系统工程要真正落地得到广泛应用，还需要神经科学、数理科学、医学、心理学、材料科学、计算机科学、机器人学、自动控制等多学科的通力协作，以及多个相关领域对关键问题的突破。


    近年来，美国、欧盟、日本等国家（地区）纷纷宣布启动脑科学研究，即“脑计划”，从战略层面对脑机接口进行了顶层设计。美国于 2013 年发布 BRAIN Initiative，欧盟于
    2013 年启动 Human Brain Project，日本于 2014 年发布 Brain/Minds Project。中国“脑计划”于 2016 年提出，正式启动于
    2021 年，“脑科学与类脑研究”成为“科技创新 2030 重大项目”最早运行的试点项目之一，提出了“新型无创脑机接口技术”“柔性脑机接口”等相关重点项目。《“十四五”医疗装备产业发展规划》明确提出，发展基于机器人、智能视觉与语音交互、脑机接口、人-机-电融合与智能控制技术的新型护理康复装备。


    全球多国政府、科研机构和企业加速布局脑机接口，抢占全球科技竞争战略高地。美国 BRAIN Initiative 为期至少 10 年，预计投入 45 亿美元；美国国立卫生研究院（NIH）持续加大对“脑计划”研究项目的投资，2018
    年支持总额超过 4 亿美元；美国国防高级研究计划局（DARPA）布局多项脑科学前沿研究。我国先后启动了“973”“863”计划和科技支撑计划，对脑科学研究总投入约
    14 亿元人民币；国家自然科学基金资助脑研究的经费近 20 亿元人民币，2012 年起中科院启动的 B 类先导专项“脑功能联结图谱计划”，每年投入经费约 6
    000 万元人民币。2021 年 9 月，中国科技部正式发布科技创新 2030“脑科学与类脑研究”重大项目，首批资金为 30 亿元人民币，后续资金规模可达数百亿元人民币。2022
    年 2 月，装备发展部发布了脑机接口基础器件预研专项指南，共 13 项指南，项目金额 200 万～1 000 万元人民币不等。


    脑机接口技术得到长足进步和飞速发展，战略意义不断被提高，应用场景不断扩大，产业繁荣发展，将广泛应用于载人航天、深空探测等领域，助力空间应用技术发展。


    ## 4.3 空间智能人机交互关键技术


    本节分别从大数据可视化交互、基于声场感知交互、混合现实实物交互、可穿戴交互和人机对话交互方面介绍人机交互的关键技术。


    ### 4.3.1 大数据可视化交互技术


    可视化是一种数据分析和探索的重要科学技术。该技术是将抽象数据转换成图形化表征，通过交互界面促进分析推理，在城市规划、医疗诊断和运动训练等领域起着关键作用。


    #### 1. 大数据可视化设计


    如何可视化复杂结构的海量数据依旧是一个挑战，尤其是具有三维空间信息的数据。传统的平面式呈现将视觉通道和视觉反馈局限于二维空间中，同时也限制了设计空间。沉浸式设备的发展释放了用户的立体视觉，研究者们开始发掘三维交互空间在可视化中的潜力。人们对三维的视觉感知来自双目视差、遮挡和相对大小等深度提示。一方面，用户能够轻易识别三维物体的形态；另一方面，三维中的视角倾斜会使二维平面图形产生形变，使用户难以识别。因此，如何在三维环境中进行有效的可视化设计是大数据可视化交互领域的研究热点之一。


    在三维环境中，Kraus 等人通过用户实验发现，相比于二维平面上的散点图，用户可以在虚拟现实环境下更加有效地识别三维散点图中的聚类。Alper 等人提出了一种在三维环境中对图数据结构进行可视化的方法。该技术利用立体深度，通过将用户感兴趣的区域投影到更靠近用户视线的平面上进行突出显示。然而，上述可视化方法占据了三维位置的视觉通道，因此不能编码点在三维环境中的位置。为了解决上述问题，Krüger
    以及 Krekhov 等人提出了 Deadeye 技术，通过分裂呈现的方法对点进行突出显示。Ssin 等人提出了一种基于时空立方体对轨迹数据进行可视化的系统
    Geo Gate。该系统扩展了时空立方体，并采用一个环形用户界面来探索多个位置数据集中实物之间的相关性。Filho 等人提出了一种虚拟现实环境下的时空数据可视化系统。该工作使用时空立方体构建虚拟现实环境下的原型系统，将多维数据集与用户桌面的虚拟表示相结合。


    #### 2. 非视觉感知的交互辅助


    非视觉感知包括听觉、触觉、嗅觉与味觉。近年来，多模态硬件技术愈发成熟，用以产生或模拟非视觉感知的设备逐步地小型化与商业化，这促使大数据可视化交互领域开始研究非视觉的交互方式。这种数据交互方法将用户沉浸在数据中，并在视觉感知外提供听觉、触觉等感知通道，提升用户的参与感与沉浸感，让用户感知在单一视觉通道上难以被发现的细节和模式。Franklin
    和 Roberts 将饼图中的类别信息、占比转化为各类型的声音；Xi 和 Kelley 则提出了利用声音分析时序数据的工具。触觉感知能够为用户提供物体纹理、温度和振动幅度等类别或连续的信息。利用振幅的大小，Prouzeau
    等人将三维散点图中点云的密度映射为不同振幅的等级，提升了用户发现点云中心高或低密度区域的感知能力。嗅觉与味觉具有易于记忆和识别的优势。ViScent 提出了不同气味与数据类型的映射空间以将数据编码为不同的气味。非视觉感知作为视觉感知的补充，能够提升用户分析理解数据的效率。例如，在分析大量或高密度分布的数据可视化时，让用户感知视野之外或被遮挡的数据信息。


    #### 3. 多模态交互设计


    在大数据可视化交互领域，除了可视化设计，现有的研究重点还集中在探索更加自然直观的交互方式，以提升人们在三维空间对大数据可视化的操作效率。多模态交互结合单一模态的优点，充分发挥了人们对各个感知通道传达信息的高度接收与处理能力，增强用户对交互行为的理解，提高对大数据可视化的探索与分析效率。


    ##### 1）基于接触的交互


    基于接触的交互支持用户直接通过手部或者手持传感器触碰可视化标记，传递对数据的交互表达。这类自然交互方式的操作精度较高，并且能够增强用户在探索大数据可视化时对信息的理解。Langner
    等人通过平板触控的方式准确地选择可视化图表以更新 HoloLens 中所见的增强内容。除了增强现实环境中基于触屏的交互方式外，接触式交互在虚拟现实中也很常见。Usher
    等人的 VR 系统可以通过跟踪用户手部动作来捕获用户勾勒出来的脑神经路径。


    ##### 2）基于手势的交互


    基于手势的交互使用可跟踪设备或捕捉用户手指的移动来捕捉手部动作，帮助用户完成对数据的操控。Ray Cursor 增加了沿投射光线方向的红色的控制光标来避免被遮挡散点的选择。此外，Fiber
    Clay 支持用户操控手柄射出的射线来完成对轨迹的筛选。除了光线投射技术的指向隐喻，其他诸如抓取、拖动等的隐喻也都有相关研究。Wagner 等人采用了虚拟手的隐喻，设计抓取和拉伸等动作完成对时空轨迹可视化的移动、缩放和选择等操作；Yang
    等人利用双手合拢与展开的手势实现了散点图的缩放操作；Tilt Map 通过改变手柄的倾斜角度来实现对地图可视化的不同视图之间的切换。


    ##### 3）基于注视的交互


    基于注视的交互通过眼动追踪技术捕捉用户的视线焦点，从而理解用户视线中传递的信息。Sidenmark 等人使用该技术辅助用户在虚拟三维场景中选择一些被遮挡的物体：用户注视物体轮廓上的圆点，并使用视线控制圆点在物体未被遮挡的轮廓线上移动，从而精准地选中被部分遮挡的物体。Alghofaili
    等人则使用长短时记忆网络模型对用户眼动数据进行异常检测，从而判断用户是否适应当前的虚拟环境，并在用户迷失时给予辅助反馈。


    ##### 4）基于移动导航的交互


    移动导航也是探索呈现在虚拟的广阔三维场景里的大数据可视化中一个重要的交互模态。Abtahi 等人通过建立 3 个层级的真实速度到虚拟速度的映射，便于用户在狭小的真实空间内遍历数据可视化呈现空间。此外，虚拟移动技术更进一步地拓宽了遍历虚拟空间的可能性。此类技术包括指定位置进行直接传送、使用三维缩略图进行传送以及使用手柄控制飞行动作等。


    ### 4.3.2 基于声场感知交互技术


    本小节从基于声场感知的动作识别、基于声源定位的交互技术、基于副语音信息的语音交互增强以及普适设备上的音频感知与识别 4 个方面综述国际上基于声场感知的交互技术。


    #### 1. 基于声场感知的动作识别


    基于声场感知实现不同手势与动作的识别是人机交互的热点研究内容，基于手势或者姿态带来声场变化的基础，实现手势或动作的识别。例如，使用耳机上的麦克风识别摘戴耳机是最直观的手势识别，Röddiger
    等人利用内耳麦克风识别出了中耳内鼓膜张肌的收缩等用于交互。Han 等人通过手表上特殊排布的麦克风阵列识别了手腕的转动、拍手臂、不同位置打响指等手势。Bem
    Band 利用腕带上超声波信号完成了对手掌姿态、竖拇指等手势的识别。随着近几年传感器精度和质量的逐步提升，更多相关研究提高了手势识别的准确度与精度，Finger
    Sound 与 Finger Ping 均识别拇指在其他手指上的点击与捏合动作，且 Finger Ping 利用了不同手势下的共振信息，减少了对陀螺仪的依赖，Tap
    Skin 识别出了手表附近皮肤上的点击等更精细的手势交互动作。


    #### 2. 基于声源定位的交互技术


    声学测距的常用方法包括基于多普勒效应、基于相关和基于相位的测距方法。此外，在雷达系统中广泛应用的调频连续波也在近些年应用于声学测距。基于以上声学测距技术，可以实现手势识别、设备追踪等交互技术。AA
    Mouse 实现了中位数误差 1.4 cm 的精确追踪，通过追踪手中移动设备的位置，实现鼠标的功能。BeepBeep 使用线性调频信号和两路感知技术实现了设备间厘米级精度的距离测量。Tracko
    基于 BeepBeep 中提出的算法，融合 BLE（Bluetooth Low Energy）和 IMU（Inertial Measurement Unit），实现设备间的三维空间感知。基于手指、手掌运动导致回波相位的改变，LLAP
    实现了 4.6 mm 的二维追踪精度，实现了不需要佩戴额外设备的手势追踪。Finger IO 应用正交频分复用技术来追踪手指的回波，不需要在手指上佩戴其他的传感器，实现了平均精度为
    8 mm 的二维手指追踪。


    #### 3. 基于副语音信息的语音交互增强


    近年来有许多研究者研究了利用“言语中的非言语信息”来加强语音互动。Goto 等人提出利用语音过程中的用户在元音处的短暂停顿自动显示候选短语辅助用户记忆，并提出了利用用户有意控制的音高移位切换语音输入模式。Kitayama
    等人提出了利用自然语音交互中的口语现象和停顿进行噪声鲁棒的端点检测和免唤醒。Kobayashi 和 Fujie 研究了人-机器人对话中的副语言协议。Harada
    等人研究了利用元音质量、音量和音高等属性的光标控制。House 等人将这一思想延续到利用连续声音特征控制三维机械臂。Igarashi 和 Hughes 研究了利用非言语信息的连续语音控制和速率的参数。


    #### 4. 普适设备上的音频感知与识别


    普适音频设备对于音频数据的实时性采集使得其在声音实时分类事件上具有优势。例如，Rossi 等人提出了利用智能手机麦克风实时进行环境声音识别的系统 Ambient
    Sense。Thomaz 等人提出利用腕部音频设备捕捉环境声音，进行识别后推断用户饮食活动的方法，帮助用户进行饮食自我监测。Amoh 和 Odame 提出利用可穿戴声学传感器结合卷积神经网络检测咳嗽的技术。与环境的声音检测类似，对于更广义上的用户行为，Lu
    等人利用手机麦克风对人当前活动（开车、乘坐公交车等）的识别进行了探索。商业产品或应用也快速发展与成熟，其中最具有代表性的是苹果手机和手表上的环境声感知（咳嗽、报警等）。


    ### 4.3.3 混合现实实物交互技术


    在实物交互系统中，用户通过使用在真实环境中存在的实物对象与虚拟环境进行交互。由于用户对实物本身的各种特性（如形状、重量）非常熟悉，可以使交互的过程更为精准和高效。近年来，将实物交互界面技术融入虚拟现实和增强现实已成为本领域的一个主流方向，并逐渐形成了“实物混合现实”的概念，这也正是被动力触觉的概念基础。Zhao
    等人将实物交互的触觉分为 3 种方式，即静态的被动力触觉、相遇型被动力触觉和主动的力触觉。由于主动力触觉装置比较昂贵，目前的研究很少，主要研究方向仍是静态的被动力触觉和相遇型被动力触觉。


    #### 1. 静态的被动力触觉


    在静态的被动力触觉方面，加拿大多伦多大学和美国芝加哥大学等团队曾提出过 Thors Hammer 以及 PHANTOM 两种比较具有代表性的研究。通过 1∶1
    制作的物理实物道具提供逼真的动觉和触觉反馈，提高用户的触摸感受以及操作能力，并且可以通过对实物的触摸来对虚拟对象进行操作。加拿大多伦多大学的 Araujo
    等人提出了 Snake Charmer，可以动态地改变交互对象的纹理特征和材质信息，且在虚拟环境中渲染不同的对象时仍能够保持触觉和视觉的一致性。


    #### 2. 相遇型被动力触觉


    1993 年，McNeely 就提出机器人图形的概念。他认为触觉输出具有极大的价值，并建议使用机械臂或者机器人作为形状载体，动态地提供物理反馈。美国斯坦福大学的
    Choi 等人提出的 Wolverine 是一个典型的例子。Wolverine 通过低成本和轻量级的设备，可以直接在拇指和 3 根手指之间产生力，以模拟垫式握持式物体，如抓握茶杯和球。在低功耗的情况下能反馈超过
    100 N 的反馈力。日本东京大学的 Transcalibur 以及 JetController，而 Transcalibur 是一个可以手持的二维移动 VR
    控制器，可以在二维平面空间改变其质量特性的硬件原型，并应用数据驱动方法获取质量特性与感知形状之间的映射关系。Cheng 等人使用 TurkDeck 的方法，借助工作人员将一系列通用模块搬运和组装为用户即将触碰到的被动实物，使用户不仅能够看到、听到，还能触摸到整个虚拟环境。Suzuki
    等人在此基础之上提出了 Roomshift 方法，通过实时控制混合现实交互空间的小车来移动环境中的实物物体，提供多种交互方式。


    #### 3. 产业界进展


    在产业界，Facebook 和 Microsoft 是研究混合现实被动力触觉交互的中坚力量。2019 年 Facebook 更新了交互装置 Tasbi，开发了一款具有震动和挤压两种反馈方式的触觉回馈腕带。2020
    年，Microsoft 提出了 PIVOT，通过可变形的交互装置实现动态的相遇型触觉反馈。PIVOT 是一个戴在手腕上的触觉设备，可以根据需要将虚拟对象呈现在用户的手上。Dexmo
    在 2020 年发布了新的触觉手套，Dexmo 外骨骼手套制作精良，该产品面向企业市场。Dexmo 触觉手套支持跟踪多达 11 个自由度的手势，可以灵巧地捕获用户完整的手部动作，从而使用户在虚拟环境中拥有逼真的手指感。


    ### 4.3.4 可穿戴交互技术


    国际上可穿戴交互主要分为以手表、手环形式为主的手势交互和触控交互的研究以及电子皮肤技术与交互设计。


    #### 1. 手势交互与触控交互


    手势输入被认为是构成“自然人机界面”的核心内容之一，同样适用于探索可穿戴设备的输入方式。美国华盛顿大学和微软研究院的联合项目推进了肌肉电信号（Electromyogram，EMG）在手势界面中的应用。EMG
    通过测量电极对之间的电势来感知肌肉活动，这可以通过侵入式（在肌肉中使用针头）或从皮肤表面进行。2015 年，谷歌发布的 Soli 智能芯片运用微型雷达监测空中手势动作，可以追踪亚毫米精准度的手指高速运动。德国的
    Patric Baudisch 团队尝试了通过腕带手表在皮肤上实现拖动的触感，可设计简单且容易被用户感知和记忆的字符和图标。韩国科学技术院的人机交互团队探索了使用针阵列的触觉方式在手指上提供经过编译的信息，以及通过气流在皮肤表皮实现非接触式的压力触感。加拿大多伦多大学利用记忆金属在手腕上实现挤压的触觉反馈，通过控制驱动的线宽、力和速度产生不同感受的反馈。美国斯坦福大学的
    Sean Follmer 团队通过设计手持式触觉设备来模拟虚拟操作物体的重力反馈。


    #### 2. 电子皮肤交互


    皮肤作为人们与外界接触的天然界面，已初步用于探索在信息交互中的作用并在若干方面的应用中体现了其优势。德国萨尔大学的 Jürgen Steimle 团队近些年通过导电墨水、电极制作纹身纸，作为电子皮肤实现在皮肤上的显示、触摸和手势识别。美国卡内基梅隆大学的
    Chris Harrison 团队采取了在皮肤上投影的方式，通过肩戴投影或手表微投影，将手臂、手背变成显示屏，并通过深度相机或红外线等方式支持手指在皮肤表面的触控。这种方式可以更好地支持探索人们使用皮肤界面的体验，但缺点也显而易见，即需要较为复杂的投影等附属设备。同时，该团队系统地研究了把身体的各个部位当作触摸界面时的可行性和用户的喜好程度，对后续的研究具有参考价值。


    ### 4.3.5 人机对话交互技术


    人机对话交互过程涉及语音识别、情感识别、对话系统和语音合成等多个模块。首先，用户输入的语音通过语音识别和情感识别模块转化为相应的文本和情感标签。其次，对话系统用其来理解用户所表达的内容，并生成对话回复。最后，语音合成模块将对话回复转换为语音，与用户进行交互。


    #### 1. 语音识别


    总体概括来说，低延迟语音识别和低资源语音识别成为研究热点。目前，国际上针对低延迟语音识别主要从两方面进行研究：一方面是研究流式语音识别，实现边听边识别，以此来降低识别出每个标记的延迟；另一方面是研究非自回归语言识别，通过摆脱解码时的时序依赖从而加速整个系统的识别速度。针对流式语音识别的研究主要有两种思路：一种是针对
    RNN-Transducer 模型进行改进，提出了表现更好的 Transformer-Transducer、Conformer-Transducer。双通解码方法的提出，进一步提升了基于
    Transducer 的流式识别模型的准确率。另一种是对基于注意力机制的编码解码模型（Attention-based Encoder Decoder，AED）的改进，其实现思路主要是改进单调逐块注意力机制（Monotonic
    Chunk-wise Attention，MoChA），其解决的主要问题是 MoChA 模型在 Transformer 上的适配以及通过辅助手段对模型切分编码状态的位置以及数量进行约束。


