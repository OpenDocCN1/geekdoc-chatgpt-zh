- raw: '采用系统工程、多级分层软硬件抽象和接口标准化方法，对巨星座系统进行建模，模型如图11-1所示，主要包含海量硬件资源、操作系统内核、操作系统应用框架以及巨量应用软件等层次架构。


    ![](images/txt015_7.jpg "pagenumber_ebook=178,pagenumber_book=167")


    图11-1　巨星座管理及应用模型


    海量硬件资源主要由CPU、ARM、FPGA、DSP、XPU等处理器构成，各处理器间基于分布式软总线，利用消息模式进行信息交互和任务协同，主要完成巨星座系统中数据级处理。


    内核主要完成海量硬件、软件资源抽象管理和高效调度，包含系统软件安全实时内核以及系统服务功能模块。采用功能最小化设计原则，为上层运行的操作系统服务提供基础抽象，但不实现具体提供给应用程序使用的功能，主要完成巨星座系统中信息级处理。


    应用框架是便于操作系统服务通信、导航、遥感等多类型空间任务设定，采用模块化、定制化设计，具备规模可伸缩和功能可裁剪特点，包含用户分级服务、资源库管理、知识库管理、任务协同以及平台运控等功能模块，主要完成巨星座系统中任务级处理。


    应用软件是操作系统通过软件定义卫星功能的核心，通过不断丰富、改进星载软件和算法，将卫星平台和有效载荷的功能尽可能地迁移到计算平台之上，改用软件实现。通过软件和算法的快速迭代和演化，实现卫星产品的持续演进，主要完成巨星座系统中服务级处理。


    综上，根据巨星座核心共性基础功能和后续持续演化需求，精细定义每个层次的功能，在不影响其他层次的前提下，根据技术的进步或需求的变化，自由地替换某一层次的具体实现方式，实现快速高效的功能重构和升级。


    2.高效内核关键技术


    内核是巨星座操作系统的基础，对下管控硬件，对上提供抽象，负责资源管理与任务调度。面向巨星座复杂应用场景，巨星座操作系统内核需要满足轻量化、低时延及强容错等需求。


    面向不同的应用场景，操作系统种类很多、功能丰富各异，按内核结构主要分为宏内核结构操作系统、简要结构操作系统、外核结构操作系统和微内核结构操作系统。


    操作系统内核典型结构频谱如图11-2所示，主要包含简要结构、外核结构、宏内核结构以及微内核结构等，内核结构详细介绍如下。


    ![](images/txt015_8.jpg "pagenumber_ebook=179,pagenumber_book=168")


    图11-2　操作系统内核典型结构频谱


    1）简要结构操作系统


    该结构将应用程序与操作系统运行在相同的特权级别和同一个地址空间中，主要面向不支持地址空间隔离或特权隔离等功能的嵌入式设备以及仅需要运行单个程序的简单场景。这种结构的一个优势是应用程序和操作系统之间的交互简单且快速。但也正因如此，应用程序中的错误可能直接导致整个系统崩溃。该操作系统结构缺乏可持续演进能力，在面向异构星载硬件资源等方面扩展能力较差。


    2）外核结构操作系统


    外核结构通过将硬件抽象封装到与应用程序直接链接的库操作系统中，而库操作系统是应用程序开发人员自主配置或者自行开发的。在运行时，库操作系统和应用程序运行在同一个地址空间并运行在用户态，外核不提供具体抽象而仅负责保证多个应用程序能够安全且高效地共享硬件资源。但是，在面向复杂场景，库操作系统将会变得非常复杂，甚至相当于一个完整的宏内核，从而丧失外核架构本身的优势。


    3）宏内核结构操作系统


    整个操作系统都运行在内核态且属于同一地址空间。操作系统中所有的模块组件，如文件系统、网络栈、硬件驱动、进程管理等，都运行在具有特权的内核态。宏内核结构操作系统的一个显著优势为拥有良好的生态。但是，宏内核结构操作系统架构缺乏系统隔离，在安全和可靠方面存在不足，难以使用形式化方法进行验证。


    4）微内核结构操作系统


    微内核结构操作系统包括运行在内核态的微核和运行在用户态的若干操作系统功能模块，如文件系统、网络协议栈、硬件驱动等。微核本身代码量很少，主要包括支撑上层系统服务运行、提供不同系统服务之间通信能力等必要机制；不同系统服务运行在用户态及不同的地址空间中，彼此隔离。通过微核提供的通信能力进行交互协同，从而为应用程序提供服务。微内核结构操作系统的架构优势在于拥有更好的容错性和安全性，保证不同系统服务之间的隔离，即使某个系统服务出现故障或受到安全攻击，也不会直接导致整个操作系统崩溃或被攻破。此外，微内核结构操作系统比较方便为不同场景定制不同的系统服务，从而更好适应不同应用需求。


    综上，围绕巨星座任务需求，选用全自主研发微内核结构操作系统的技术路线，在轻量化、可控时延、运行效率、可靠性、安全性、扩展性以及自主软件生态构建等方面优势明显，满足巨星座复杂应用场景需求。


    3.融合组网关键技术


    节点间互联互通、灵活组网是实现巨星座高效管理及智能应用的基础。巨星座场景下，空间网络具有网络复杂、规模巨大、高动态拓扑、故障难以预测等特点，为网络的实时性和可靠性带来了挑战。因此，需要结合操作系统内核对整个网络进行优化设计。


    采用SDN（软件定义网络）作为基本技术路线，采用分级管控与分域管控两大技术路线来实现。分级管控是提升网络对单个网络的可管控规模，而分域管控则是将大网划分为可相对独立管控的小网，两条路线结合，可以实现对万颗规模以上卫星实时、高效、优化、鲁棒的管控。


    首先，分域管控是将万颗规模以上卫星划分为多个相对独立的、较小的网络域，对每个独立的网络域进行分而治之，不同网络域之间内部信息互不干扰，只提供抽象层面的路由与协作接口。这样可以以指数级的速度降低卫星节点规模对于网络整体管控的可扩展性压力。


    面向万颗规模以上卫星节点的管控需求，卫星网络基于星座功能和轨道特征两种规则进行划分。先是将卫星网络按照功能划分为多个星座，如遥感星座、通信星座、气象星座、导航星座等；然后基于上述划分，针对规模比较大的星座进一步划分为规模更小的网域，按照相对稳定的组网结构进行划分，比如一个轨道面的卫星划分为一个网域。一般情况下，一个网域的规模不超过200个节点。


    其次，针对海量节点导致的SDN控制平面扩展性不足的问题，采用分布式多控制器协同控制卫星网络。如图11-3所示，将地面控制器分为中心控制节点和分布式控制节点：中心控制节点由控制器集群构成，提供全网拓扑和路由转发策略的统一获取和管理，实现全局流量调度和网络优化；分布式控制节点采用分布式部署，负责部分天基网络节点的管控，处理不需要进行全局决策的网络控制请求，能够有效降低网络操作的响应时延，避免不必要的长距离传输。


    ![](images/txt015_9.jpg "pagenumber_ebook=181,pagenumber_book=170")


    图11-3　高效网络管控架构


    综上，构建巨星座操作系统作为天基网络组网、调度、控制及管理的核心，满足天基网络节点、路由转发策略的高效协同管控。


    4.安全可信关键技术


    操作系统作为巨星座的核心基础设施，其可信与安全是空间数据资产安全的基础。巨星座的组网方式决定了其节点在空间领域呈现分布式的特点。因此，操作系统的技术架构亟需完成由集中式向分布式转变。同时，考虑星上的实际处理能力，卫星节点间需要相互合作，保证在有效控制和管理自身计算、存储及网络资源的同时完成指定任务。


    如图11-4所示，操作系统采用一种基于分布式基础架构和计算方式的区块链技术，保证数据传输和访问全链路安全的“云-边-端”分布式协同可信与安全架构。


    ![](images/txt015_10.jpg "pagenumber_ebook=182,pagenumber_book=171")


    图11-4　“云-边-端”分布式安全可信体系


    根据巨星座操作系统中不同节点所控制资源的不同和具体的功能需求，对“云-边-端”分布式协同可信与安全架构作出以下定义：


    ①核心云节点，即将控制关键存储、计算和网络资源的卫星作为核心云节点。核心云节点负责数据的全量存储，记录完整的区块链账本，提供核心共识机制和核心网络的接入，并结合“数据链+日志链”的双链结构，保障操作系统数据可信。


    ②边缘云节点，即从核心云节点向边缘扩展资源的卫星。边缘云节点按需获取核心云节点资源，并且仅缓存核心云分配的部分数据，采用基于区块链的多副本机制保证拜占庭容错下边缘缓存数据之间的数据一致性，同时为终端提供低延时的访问服务。


    ③终端节点，即单星节点、移动设备等终端设备。无须缓存完整数据，仅储存重要的区块头等信息，收集环境中的数据，可以向边缘云节点请求计算和网络通信服务。


    ④“云-边-端”分布式协同可信与安全架构，即根据卫星节点在外太空领域呈现分布式特点，结合区块链技术构建“核心云-边缘云-终端”的可信与安全架构，应用于操作系统中。核心云节点之间组网连通组成核心网络，边缘云节点可以和其他的边缘网络的节点进行跨边缘网络协作，二者通过横向和纵向的协同融合为终端提供多样计算和低延迟服务。


    综上，围绕巨星座多星协同、动态管控、攻击防范等核心需求，基于区块链技术构建去中心化、“云-边-端”分布式协同可信与安全架构，形成巨星座操作系统安全可信基座，运行保障巨星座安全。


    5.生态体系关键技术


    开源已成为一种软件科技创新的主流模式，包括人工智能、区块链等前沿IT技术几乎都通过开源模式得以快速发展，实现技术创新突破和产业生态发展。一方面，通过开源可以以更高的效率汇聚更多志同道合的“创客”，参与到新技术的革新和孕育之中，以寻求实现技术突破；另一方面，通过开源可以以更低的成本吸引更多的“新潮”用户，参与到新产品的成熟和传播之中，以寻求迅速从边缘低端产品变成主流高端产品。


    巨星座操作系统是一个新场景、新领域，如何实现快速发展仅仅靠一家单位是难以实现快速突破，需要汲取大规模群体智慧的力量，将核心开发者、各类厂商、科研机构、志愿者等广泛连接起来，开展探索创新。


    围绕巨星座操作系统的协同研发场景、测试和部署需求、应用构建特点等，构建一套面向通用领域的基础平台，需要突破适用于巨星座操作系统大规模分布式协同研发需求的代码协作、任务协作和文档协作等技术，研究针对巨星座操作系统持续演化需求的质量管理、持续集成、克隆检测技术等，并在基础平台之上做进一步的定制化开发，构造针对巨星座操作系统的开发与演化支撑环境。


    综上，通过巨星座操作系统，促成星载硬件标准化、模块化，满足星载软硬件标准化设计和硬件资源虚拟化管理；促成软件构件化，提升软件复用度和继承性，减少二次开发，为形成软件生态奠定基础。


    11.1.5　巨星座操作系统发展效益


    围绕巨星座系统，构建庞大的软硬件生态，将带来“万星智联”的全场景生态。研究适用于巨星座操作系统等大型软件的分布式协同开发与持续演化技术，构建综合开发与演化服务支撑环境，实现面向开源的自主可控生态体系。


    巨星座是未来天基系统的一个重要发展方向。巨星座操作系统是实现巨星座多功能可重构、协同一体、软件定义、全链路安全可信等共性需求的核心技术途径。结合巨星座任务需求和现有典型应用场景操作系统的发展启示，采用自研微内核架构进行全自主研发巨星座操作系统的技术路线，满足核心基础设施必须自主可控、安全可信的国家战略需求。同时，不需要背负Linux等成熟开源操作系统沉重的历史包袱，在轻量化、可控时延、高可靠等方面优势明显。


    作为巨星座系统的核心基础设施和信息基座，面向巨星座场景的巨星座操作系统向下管理海量异构硬件，向上支持巨量航天应用软件，为软件赋能航天装备提供统一、标准、安全、可靠的运行环境，形成快速有弹性的软件能力。这将对航天软件的研制流程、政策、劳动力和技术产生三大变革：变革一，星载操作系统由功能专一向领域通用变革；变革二，应用开发由任务定制向平台通用变革；变革三，卫星应用由单星服务向“云-边-端”协同服务变革。


    历史经验表明，高度依赖他国或开源操作系统，将面临从生态中被剔除的威胁。操作系统应用成功的关键在于建立完整的生态，自研操作系统将掌握构建生态的主动权，形成面向航天领域自主可控的开源软硬件生态体系，支撑我国卫星互联网等空间基础设施建设。


    11.2　数据传输技术


    信息系统为了达到高处理速度和好的实时性能，在运算同时I/O也在实时传输、交换和存储数据，且处理器的运算能力和I/O能力应该是匹配的。随着处理器内核速度迅速提高和I/O速度相对滞后，过去的一些运算密集型算法已经转变为I/O密集型算法。因此，提高数据的传输速率，对提高整个信息系统的实时性有着重要意义。


    11.2.1　高速数据总线技术


    如图11-5所示，VITA78 Space VPX总线是VITA标准组织推出的适用于宇航领域的新一代高速总线。VITA78采用了Open VPX（VITA65）作为其基本架构框架，以便根据现有商业标准开发一套增强的模块和背板规格，并增加了太空社区及其应用所需的功能。它还致力于提高制造商和集成商之间的互操作性和兼容性，同时通过使用标准硬件组提高可负担性，满足宇航领域对强固型、高带宽、多核多CPU并行计算、多FPGA、多DSP数据处理等技术需求。在不同层级、不同领域的用户之间建立共同规范，促进成品/现货交易，成本低、周期短。VITA78
    Space VPX标准总线支持每通道10 Gbit/s的高速串行总线Rapid IO、PCIe以及1Gbe/10Gbe以太网的互联和交互。


    ![](images/txt015_11.jpg "pagenumber_ebook=185,pagenumber_book=174")


    图11-5　VITA标准组织总线标准发展


    采用VITA78 Space VPX标准总线，其中高速串行总线采用Rapid IO、PCIe以及千兆以太网进行互联互通。作为新一代总线，Rapid IO的应用包括连接多处理器、存储器、网络设备中的存储器映射I/O器件、存储子系统和通用计算机平台。这一互联交换技术主要为系统内部互联，支持芯片级、板级和设备级的高速互联通信，可以实现每秒上百Gb数据传输的性能水平，其实现具有高性能、低延迟、低引脚数和低功耗等特点，是星载高性能处理平台海量数据传输和交互应用的理想选择；PCIe的应用包括连接多处理器的数据共享和交互，便于多处理器间的协同处理；千兆以太网的应用包括板级控制数据的通信。


    11.2.2　高速数据交换技术


    高速信息流及计算节点互联总线采用RapidIO、PCIe和千兆以太网高速互联技术，提供每秒Gb级的处理数据、计算信息互联传输；通过冷备的双星型交换中心A/B完成各个计算节点之间的输入数据分发，计算中间数据互联，计算结果汇集和输出，可以支持串行、并行、串并结合的计算节点间拓扑重构。


    交换控制网络同样采用双星型网络，采用低速的UART结构协议，实现每秒Mb级别的模块测控处理，监视模块工作情况，发送控制指令。另外，通过UART接口实现各个模块的处理器程序的在轨动态重配置，实现节点内部的算法和计算处理的重构。


    在可靠性方面，这2个模块与k个并行计算节点板采用全互联的拓扑建立高速串行双向连接。k个通用并行计算模块实际使用n个模块，其他（k-n）个模块为这n个模块提供备份，n个当班机中有故障模块时，可以切断其电源，启用（k-n）个模块中的任意模块替换故障模块，修改交换模块中的交换表即可实现模块间的交叉互备。标准双星型数据交换网络示意图如图11-6所示，其中交换接口模块、主控管理模块采用双冗余备份，采用双星型互联网络。


    ![](images/txt015_12.jpg "pagenumber_ebook=186,pagenumber_book=175")


    图11-6　标准双星型数据交换网络示意图


    11.2.3　高速数据存储技术


    高速数据存储主要完成原始数据、压缩码流、处理结果等数据的快速记录和回放。星载大容量高速信息存储器提供TB级的存储容量以及每秒百Gb的存储速率，采用NAND
    FLASH半导体存储模块作为存储介质控制通道以高性能抗辐照SoC处理器为核心，数据通道以高速串行接口SRIO为对外接口，以数据识别分拣、数据分配、FLASH控制器等专用ASIC为核心，协同配合工作。数据通道采用超大规模并行处理和多线程流水技术，数据通道内部总线最宽处达到上千bit，使得即使在数据缓冲模式下工作的数据读写速率也可达到每秒数十Gb以上。


    存储阵列与前端数据识别和分拣单元采用高速串行数据接口传输数据，该接口是目前高速数据传输领域的标准接口，便于扩展。当任务需求发生变化，需要固态存储器具有更大的容量或更高的存取速率时，可以通过增加存储单元（固态盘）的方式轻松便捷地实现系统的扩展。


    如图11-7所示，当前典型星载数据存储阵列包含4个独立的数据存储单元。每个数据存储单元具有32TB存储空间和读写各12.8 Gbit/s带宽，以及相应的读写控制逻辑。各个存储单元在任务管理单元的统一调度下并行工作。整机具备51.2
    Gbit/s的数据读写带宽。每个存储单元采用总线分时复用的策略解决同时记放时可能出现的总线冲突问题。每个单元均可以工作在记录模式或回放模式，也可在记录的同时进行回放和擦除。


    ![](images/txt015_13.jpg "pagenumber_ebook=187,pagenumber_book=176")


    图11-7　大容量高速数据存储单元框图


    11.2.4　高性能计算技术


    异构计算作为一种特殊形式的并行计算方式，能够根据每个计算子系统的结构特点为其分配不同的计算任务，在提高平台的计算性能、能效比和计算实时性方面体现出了传统架构所不具备的优势。因此，异构计算技术是解决人工智能计算平台能效问题的重要手段。


    目前，将图形处理器（GPU）、现场可编程门阵列（FPGA）等协处理器与数字处理器DSP一起形成异构计算平台来实现计算性能的提升，已经成为学术界和工业界的研究热点。如图11-8所示，通用异构计算单元主要包括主控模块、FPGA模块、DSP模块、AI加速模块和电源模块，设计一种基于FPGA+DSP+AI加速芯片的专用异构处理架构，充分发挥各类型处理器的优势，实现优势互补，构建高效率、灵活的异构处理架构，完成基于深度学习的敏感目标检测识别功能。


    ![](images/txt015_14.jpg "pagenumber_ebook=188,pagenumber_book=177")


    图11-8　典型通用异构处理架构设计


    如图11-9所示，专用异构处理单元包含主控模块、FPGA模块、DSP模块以及AI加速模块等。


    主控模块选用在轨维护专用芯片实现程序上注和加载控制功能，选用3片Nor Flash芯片用于存储DSP及Xilinx FPGA的配置程序，采用3模冗余进行可靠性设计。


    FPGA模块选用高性能FPGA芯片，每片FPGA外扩4片8 GB容量的DDR3 SDRAM芯片进行数据缓存。FPGA具有全并行流水处理、IO接口灵活、硬件资源丰富等优点，主要完成接收大幅宽图像数据进行数据预处理，感兴趣区域提取，目标切片生成，并将处理信息分发到处理模块（DSP和AI加速模块），最后把处理结果发送到IO模块。


    ![](images/txt015_15.jpg "pagenumber_ebook=189,pagenumber_book=178")'
