    ### 3）目标鉴别


    目标鉴别算法`YyNet-5`采用在`LeNet-5`经典算法模型基础上根据需求进行自主设计的方法完成。`YyNet-5`主要包含 358 个卷积核大小为
    3×3 的卷积运算以及 2048 次乘加法运算，全部运算量为 425 984 次乘加运算，最终输出结果为疑似目标的真假值。


    相对于`LeNet-5`算法模型，本研究通过分析 SAR 图像舰船目标的特征，将 5×5 的卷积核更改为 3×3，在不影响目标特征提取能力的基础上，将卷积核参数量降低为原来的
    36%。`LeNet-5`算法模型可实现 0～9 10 种数字的识别分类，将该网络定义为疑似目标真假鉴别网络，即只需要完成 2 分类，全连接层的参数量降低为原来的
    20%。为了实现模型训练快速收敛，将`LeNet-5`算法模型中的`Sigmod`激活函数设计成当前主流的`Relu`方式，大大简化了实现方法。与此同时，将输入图像数据大小由
    28×28 扩展至 32× 32，并将卷积方式由“valid”模式更改为主流的“same”模式，输入图像数据目标如果大于 32×32 通过均值降采样的方法约束到输入图像切片大小内。


    ### 3.实现及性能分析


    #### 1）在轨实时实现


    ##### （1）实时实现


    SAR 图像处理需要强大的处理能力，所用处理器性能的好坏直接影响处理性能，需重点考虑。当前能够在空间环境使用且自身具备抗辐照特性的器件硬件资源和速度均不能满足要求。因此，选用普通工业级高性能器件作为主处理器，通过系统设计保障模块适应空间特殊工作环境，实现目标提取功能。考虑系统成本、可靠性以及处理性能等多方面因素，采用模块关键等级差别设计思想，将该系统分为控制和处理两大部分。其中，控制部分作为关键模块，采用高可靠、抗辐照宇航级器件；处理部分作为执行模块，采用高性能、大容量常规器件，设计多种重构保障机制，保证在轨维护能力，有效降低成本，提升处理性能和可靠性。采用
    CPCI 总线标准，6U 标准板卡结构，支持多模块协同处理机制。系统的通用性、可靠性及扩展性强。


    该智能信息处理模块具有强大的处理能力，主处理器 DSP 峰值计算能力达到 8000 MIPS，处理 FPGA 逻辑门数达到 3250 万门。输入图像大小为
    32768×32768，舰船目标提取时间小于 10 s；可实现在轨全时工作，整板功耗小于 13 W，待机功耗小于 1.5 W；具备主处理器程序和卷积神经网络参数数据重构能力，程序重构时间小于
    5 s，权重参数重构时间小于 1 s。


    ##### （2）处理结果


    如图 13-35 所示，在某新体制雷达试验卫星星载信息处理平台上完成了上述 SAR 图像舰船目标实时提取算法的工程实现，结合 PC 机以及专用测试底板，形成可演示实时信息处理系统。采用
    GF-3 号遥感卫星的 SAR 图像，验证了目标检测算法的有效性和实时实现的可行性。


