    通用卷积计算架构如图 13-9 所示，其中包括运算参数接收及解析模块、数据和权重参数接收及解析模块、状态控制模块、数据参数控制模块、卷积运算模块、内部存储器模块、外部存储器模块、卷积结果处理模块以及处理结果输出模块。运算参数接收及解析模块、数据和权重参数接收及解析模块解析出卷积运算需要的工作参数信息，并根据输入的图像数据流启动卷积运算，状态控制模块控制内部存储器模块、外部存储器模块、数据参数控制模块、卷积运算模块、卷积结果处理模块以及处理结果输出模块按照上述解析的参数和模式进行卷积运算，并最终控制输出卷积处理结果。


