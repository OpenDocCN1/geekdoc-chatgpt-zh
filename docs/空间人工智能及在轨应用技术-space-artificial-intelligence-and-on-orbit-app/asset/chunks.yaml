    如图13-27所示，将等价对{（1，2），（1，4）}转化为等价列：1→2→4，其中团标记最大数`maxlabel`为4。如图13-27所示，将1～4个点都看成图的结点，而等价对（1，2）说明结点1与结点2之间有通路，而且形成的图是无向图，即（1，2）其实包含了（2，1）。因此，需要遍历图，找出其中的所有连通图，因而采用图像深入优先遍历的原理，进行等价序列的查找。从结点1开始，它有两个路径1→2，1→4。2和4后面都没有路径，最后只剩下3，它没有在等价对里出现过，所以单独形成一个序列。


