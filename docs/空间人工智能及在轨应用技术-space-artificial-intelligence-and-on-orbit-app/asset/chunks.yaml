- raw: '“珞珈三号”01星星上智能信息处理单元采用主备异构软硬件架构，主份硬件基于高性能GPU进行设计，配备开放软件平台（Linux）；备份硬件基于FPGA设计，支持在轨常规压缩；同时主备通道均配置大容量固存模块，支持原始图像及处理后图像的在轨存储，由接口部分、处理通道（主）和压缩通道（备）组成。两通道相互独立，采用冷备份方式，实现功能备份，确保数据可靠下传。


    其中，开放软件平台包括基础操作系统环境、用户API函数接口、图像处理基础库、深度学习软件框架等，支持在轨扩展用户或第三方设计开发的智能处理APP。卫星支持星上自主任务规划，用户只需要向卫星发送目标点经纬度、数传窗口等信息，卫星可自主完成成像任务规划、影像获取、在轨处理、图像下传等。卫星设计了专门用于APP在轨上注的高速上注通道，支持APP软件在轨快速上注，支持APP在轨安装、运行、卸载、更新等操作，通过丰富星载APP可以不断拓展卫星的影像信息服务能力。基于上述功能设计，卫星与地面系统配合可向个人用户手机终端提供端到端近实时的影像信息服务。


    3）“吉林一号”卫星


    “吉林一号”卫星星座是长光卫星技术股份有限公司在建的核心工程，规划由138颗涵盖高分辨、大幅宽、视频、多光谱等系列高性能光学遥感卫星组成。


    “吉林一号”光谱01/02星在轨智能处理终端具有森林火点和海面船舶的自动识别、搜寻和定位功能，在智能处理功能开启的条件下，用户无须经历传统的“上注任务、卫星成像、接收图像、图像处理、信息分析”的漫长过程，即可直接通过移动终端准实时地接收快讯。例如，2019年3月21日，项目组开展了森林火点自主识别试验，在星上每秒处理500
    km2的中波红外图像，对高温火点进行识别。星上在轨处理13 s后，地面终端接收到信息，结果显示湄公河流域区域发现多处高温火点，经卫星图像人工比对验证结果正确。2019年6月8日，项目组又在某海域进行了船舶自主搜寻试验。星上在轨处理3
    min后，地面终端接收到信息，显示获取一艘大型船舶信息，通过地面比对验证，证明系统工作符合预期。


    星载在轨智能信息处理技术成果在“吉林一号”光谱01/02星上的成功试用，提高了系统存储和数据传输的利用率，大大提升了遥感应急信息获取的时效性，为未来卫星遥感应急响应提供了核心技术支撑。


    2.3　空间智能信息处理关键技术


    星上处理与地面处理相比，最大的难点在于在卫星体积、质量、能源及成本的约束下，星上计算能力、功耗及存储资源受限。这些限制对星上智能处理技术的推广实现提出了更加苛刻的要求。具体而言，目前卫星在轨智能信息处理面临的挑战主要体现在以下3个方面：


    ①智能算法仍存在挑战。成像卫星智能处理算法近些年取得了令人瞩目的进步，但目前在轨智能还有一些挑战需要克服，如遥感小目标识别、多源信息融合等。


    ②星上计算资源受限。受到卫星质量和功耗的限制，星上处理单元无法像地面一样使用大功率、高性能的处理器。有限的计算能力会限制星上图像分类、目标检测等智能处理算法的准确率和实时性。


    ③高效能在轨计算平台设计困难。设计在轨智能计算平台需要在小功率下获得大算力，还要应对高低温、热真空、强辐射等空间环境，因而高效能的在轨计算平台设计是一项艰巨的任务。


    针对上述挑战，国内外积极开展空间智能信息处理技术研究，后文将从智能处理算法、算法加速技术、在轨计算平台三方面对其中的技术现状展开介绍。


    2.3.1　智能处理算法


    对于空间智能信息处理算法，本节内容将从空间数据预处理、空间数据压缩、空间信息提取和自主任务规划四方面展开介绍。


    1.空间数据预处理


    由于遥感系统空间、波谱、时间以及辐射分辨率等限制，原始遥感数据（光学、合成孔径雷达、光谱等）的质量和精度往往无法满足要求，需首先对数据进行预处理。在利用智能手段开展数据预处理的相关工作中，国内外研究人员已将人工智能技术用于遥感图像匹配、重构、融合等方向。


    1）遥感图像匹配


    图像匹配就是将不同成像时间、不同成像设备或不同成像条件下获取的两幅图像，寻找最佳的空间变换关系使得图像中的同名点精确对准的过程。遥感图像匹配是遥感图像融合、拼接、变化检测、分类等技术的前提和基础，在地质调查、飞行器巡航制导、土地利用、卫星影像测量等诸多领域均有广泛应用。


    得益于机器学习方法的引进，遥感图像匹配技术获得了系统性发展，匹配精度获得了显著进步。遥感图像匹配方法可大致分为基于灰度的方法和基于特征的方法两类。


    （1）基于灰度的遥感图像匹配方法。


    基于灰度的遥感图像匹配方法的相似性度量准则一般依据图像的灰度级信息建立，如熵值、互相关、互信息等。通常，遥感图像的信息量较大，且由于地貌形态复杂，存在一定程度的形状畸变和灰度差异。该类方法虽然实现简单，但计算量较大，易受光照、噪声、畸变等干扰的影响。


    （2）基于特征的遥感图像匹配方法。


    基于特征的遥感图像匹配方法能够在很大程度上避免上述问题，对灰度、形状等变化具有一定的鲁棒性。该类方法中，常用于匹配的遥感图像特征有点特征和区域特征。基于点特征的匹配方法中，已有文献利用Harris、尺度不变特征变换（Scale
    Invariant Feature Transformation，SIFT）、加速鲁棒特征（Speed Up Robust Features，SURF）等算法提取两幅遥感图像的特征点，进行特征点匹配，再剔除错误点对，最终实现遥感图像的匹配。与局部特征点相比，区域特征对整体性表征更加完整，对区域形变、区域变化等的稳定性更好。在基于区域特征的匹配方法中，深度学习应用的核心思想是用分类技术解决匹配问题，如Han等人利用MatchNet提取图像区域特征，将3个全连接层得到特征的相似性作为输出，对输出采用Softmax进行分类匹配。Zagoruyko和Komodakis重点解决了对光照变化、观测角度具有很好适应性的区域特征提取问题，提出了基于DeepCompare网络的区域特征提取方法，该方法的匹配性能对于不同时间、空间获取的遥感图像具有极佳的稳定性。


    2）遥感图像重构


    仅依赖遥感卫星载荷能力推动图像分辨率提升，使得高分辨率图像成本大幅提高，给遥感图像大规模应用带来困难。以超分辨重构为代表的图像级和信号级处理方法为遥感图像分辨率和质量提升提供了另一种可行的技术途径。超分辨率（Super
    Resolution，SR）重构是指在不改变观测系统的前提下，利用图像处理算法恢复图像获取过程当中丢失的成像系统截止频率之上的高频分量信息，从而获得具有更多高频细节信息的高分辨率图像的技术。


    智能遥感图像重构方法可以分为基于神经网络和基于生成对抗网络两类。Wei等人提出了基于MC-ADM（Multicomponent Alternating Direction
    Method）和基于PSRI-Net（Parametric Super-Resolution Imaging Network）的两种参数化超分辨率SAR图像重建方法，其根据预先设计的损耗，深度网络通过端到端训练来学习，可应用于得到高质量SAR超分辨率图像的参数估计。Luo等人提出了一种基于卷积神经网络的SAR图像超分辨率重建的方法，其针对浮点图像数据采用深度学习对SAR图像进行重建，可以更好地重建SAR图像。


    针对神经网络在光学遥感图像超分辨率重建以及噪声去除中出现的信息损失和对比度降低的问题，冯旭斌提出了利用生成对抗网络对小波变换域光学遥感图像进行超分辨率重建以及噪声去除的方法。熊鹰飞提出了一种适应于遥感图像超分辨的改进超分辨率生成对抗网络（Super-Resolution
    GAN，SR-GAN），增强了模型在跨区域和传感器的迁移能力。王梦瑶等人构建了SAR辅助下光学图像去云数据库，建立了基于条件生成对抗网络的SAR辅助下的光学遥感图像去云模型，实现了SAR辅助下光学图像薄云、雾和厚云等覆盖下地物信息的有效复原与重建。


    3）遥感图像融合


    遥感传感器种类繁多，且不同传感器对同一场景的成像各具特点，产生诸如多光谱图像、全色图像、红外图像、SAR图像等多源遥感图像。各类成像传感器每天获取的图像数据是海量的，为了高效和综合地处理、运用这些数据，需将同一场景的多源遥感图像进行融合。多源遥感图像融合利用特定的技术，去除取自同一场景不同来源图像的冗余信息，同时结合其中的互补信息，以生成对此场景描述得更清晰、更准确、更全面的图像。


    多源遥感图像融合方法主要可划分为两类：基于空间域的方法和基于变换域的方法。


    （1）基于空间域的遥感图像融合。


    基于空间域的遥感图像融合方法直接依据原始遥感图像的像素信息进行融合，主要有压缩感知、主成分分析、Brovey变换、非负矩阵分解、亮度-色度-饱和度变换、神经网络、群智能优化算法等。


    其中，随着人工智能技术的飞速发展，神经网络和群智能优化算法越来越多地被应用于遥感图像融合。当前较多用于多源图像融合的神经网络有BP神经网络、自组织特征映射网络和脉冲耦合神经网络（Pulse
    Coupled Neural Network，PCNN）等。王昊鹏等人将PCNN模型用于Curvelet变换域的图像融合中，将表征图像各分量局部特征的支撑值作为PCNN模型的外部激励输入，利用PCNN模型模拟人眼视觉神经系统的生物特性，并根据其全局耦合特性对源图像进行智能分析、判断和融合，从而提高融合图像的整体效果。


    基于群智能优化的图像融合方法是通过蚁群算法、粒子群算法等群智能的方法寻找到使目标函数最优的参数，并利用该参数对源图像进行融合。该类方法可划分为单目标优化的和多目标优化的图像融合方法两大类。单目标优化的方法如赵学军等人发表的粒子群优化Contourlet变换的遥感图像融合方法。该方法使用粒子群优化算法对Contourlet域上的不同分量所需的不同加权系数进行优化，采用多元回归分析方法设定目标函数，实现了全色图像与多光谱图像的融合。多目标优化的方法如陈荣元等人提出的一种基于多目标粒子群优化算法的红外与可见光图像融合方法。该方法选取图像融合的客观评价指标作为优化目标函数，采用多目标粒子群优化算法对低频分量的融合参数进行优化，高频分量采用取绝对值最大的融合规则，融合图像具有较好的主观视觉效果。


    （2）基于变换域的遥感图像融合。


    基于变换域的图像融合方法首先采用特定变换工具将多源遥感图像变换到另一个域上，接着对变换域的不同分量设计不同的融合规则进行融合，得到变换域上的融合系数，最后进行逆变换获得融合后的图像。基于变换域的融合方法主要有基于独立成分分析、离散余弦变换、快速傅氏变换、多尺度分解等图像融合方法。


    当前，基于多尺度分解的图像融合方法在图像融合领域中应用较为广泛。首先对多源遥感图像进行匹配，之后采用特定的多尺度分解工具将源图像分别分解得到低频分量和多个高频分量，接着设计一些不同的融合规则对所得低频分量及多个高频分量分别进行融合，获得图像各个尺度的融合分量，最后经多尺度逆变换重建出融合图像。


    2.空间数据压缩


    随着中国卫星技术的快速发展，高分系列卫星包含了全色、多光谱、高光谱、雷达以及红外等多种类型卫星。当前，中国的高分辨率光学卫星影像可以达到0.1～0.5 m的空间分辨率，在轨正常运行的高分辨率遥感卫星每天产生的数据达到TB级别，数据输出率高于10
    Gbit/s。遥感影像数据呈现出数据海量、高分辨率、多模式的特点，海量的遥感数据和有限的带宽下行速率已经很难满足数据的实时下传需求。


    目前，很多国家都将在轨遥感影像压缩技术应用于星上图像压缩。随着高分辨率卫星影像的发展，低码率、高保真的图像质量使得基于自适应差分脉冲调制编码（Adaptive
    Differential Pulse Code Modulation，ADPCM）和离散余弦变换（Discrete Cosine Transform，DCT）技术的图像压缩算法不再适应于星上储存和星地传输。当前应用较为广泛的是基于离散小波变化（Discrete
    Wavelet Transform，DWT）的JPEG2000图像压缩方法。然而，这类压缩方法对遥感数据信息无差别编码，造成不必要的计算资源占用，数据压缩比低。通常要求压缩后的影像峰值信噪比（Peak
    of Signal and Noise Ratio，PSNR）越高越好，为了保证较好的视觉效果（如PSNR＞36 dB），基于传统的JPEG2000在轨遥感影像压缩算法往往将压缩比控制在10倍以内。较低的压缩比意味着在有限带宽下，很难实现海量遥感数据信息的智能实时服务。


    近年来，随着计算机和人工智能技术的蓬勃发展，深度学习被提出应用于解决空间数据压缩问题。深度学习算法可以构建更灵活多变的遥感数据压缩结构，从而有针对性地对复杂数据作出应变分类。利用大量数据训练具有编码和解码子网络的深度前馈网络，通过在编码子网络的末端定义很少的节点，网络可以将图像转换为具有少量元素的特征向量，从而实现大倍率压缩。


    现有基于深度学习的压缩方法可以分为3类：基于RNN的方法、基于CNN的方法和基于生成对抗网络（GAN）的方法。


    1）基于RNN的图像压缩


    基于RNN的图像压缩方法首先将图像分块，然后利用叠加的递归层构造渐进编码模块和解码模块。Toderici等人研究表明，训练循环卷积神经网络以实现不同的比特率压缩是可能的，但它仅在小缩略图图像上得到验证。随后，Toderici等人又提出了一种基于门控递归单元（Gate
    Recurrent Unit，GRU）、残差GRU、LSTM和联想LSTM的全分辨率图像压缩方法。尽管渐进策略可以实现灵活的比特率，但由于纯基于RNN的压缩方法需要将图像分成很多快，它在大倍率压缩中经常会出现伪影、模糊等问题。针对这个问题，Johnston
    N等人提出了以RNN的理念，结合CNN进行压缩的方法，将CNN的编解码器的每一层看作是RNN的神经元，并经过循环展开进行多层次的压缩解压缩。


    2）基于CNN的图像压缩


    基于CNN的图像压缩方法遵循编码器-解码器的方式，包含堆叠卷积层的编码器、包含堆叠反卷积层的解码器和量化器用来度量生成图像的准确性。在模型提出伊始，大多采用基于MSE的度量方式。基于CNN的图像压缩方法首先要解决的问题就是在训练过程中，由于量化操作的不可导，除了几个无限的阈值点，量化器的梯度几乎为零，这使得CNN无法执行端到端的反向传播。一些研究人员开发了一些变体来解决这个问题。例如，E.Agustsson等人提出了一种软（连续）量化松弛方法用于解决可微问题。随后，Theis
    L等人提出了端到端自动编码器中量化和熵速率估计的可微近似。端到端学习可以确保基于CNN的方法能够在有足够数据的情况下达到预期结果。


    3）基于GAN的图像压缩


    与RNN和CNN相比，GAN是一种生成模型，由生成器和鉴别器组成。生成对抗网络的出现为深度学习带来全新的学习方式，它以博弈的思想为图像的分布建模，而不是仅仅学习训练图像的特征。深度学习模型需将图像解压缩所需的先验信息储存在网络参数当中，压缩倍率越大，图像解压缩需要的先验信息越多。当进行压缩模型的训练时，应用逐像素损失的模型学习到的参数会随着不同的图像有大幅度的波动，而生成对抗网络通过构造鉴别器将原图像与解压缩图像同时映射到特征层面进行损失计算，减少了参数的大幅度波动，有利于模型学习到更多的先验信息。因此，相比基于CNN和RNN的图像压缩方法，基于GAN的图像压缩方法具有压缩倍率大、重构质量好等优点，有望克服传统深度学习模型泛化性能差的缺陷。


    3.空间信息提取


    空间信息提取是从空间数据中提取任务相关或感兴趣信息的过程，在遥感领域主要解决目标检测和场景分类两类问题。通过人工智能算法对遥感图像中各类地物的光谱信息和空间信息进行特征提取，获得遥感图像中与实际地物的对应信息，从而实现检测或分类。


    1）遥感图像目标检测


    目标检测是成像卫星应用的重要技术之一。它是指利用算法检测到兴趣目标并标记其类别，包括飞机、舰船、车辆、建筑物和桥梁等。目标检测在城市规划、灾害检测、丢失船只搜寻等领域有着广泛的应用。同时，近年来高分辨率成像技术迅猛发展，WorldView系列、高分系列等成像卫星相继发射，海量的高分辨图像为遥感目标检测技术发展带来了新的机遇。


    传统的目标检测大多基于经典的模式识别算法，如模板匹配方法，种子点特征、全局最小化活动轮廓模型和径向梯度角特征等，搜索图像中可能与该模板相似的区域，然后计算其相似度判别是否为目标。这些模板需人工设定且只能针对特定类别，效率低且泛化性差，难以应用到大规模、多类别的目标检测上。


    随着深度学习算法在计算机视觉领域的大规模应用，高性能的目标检测成为可能并取得较大成果。特别是运用卷积神经网络技术的目标检测，以模拟人脑神经元的学习思维对图像多次抽象化，挖掘图像深度信息从而取得较高精度。目前流行的基于深度学习的目标检测方法有Faster
    R-CNN、YOLO和SSD等。


    具体到遥感领域，对于遥感图像中水平目标框检测和倾斜目标框检测，研究人员在上述方法的基础上开展了大量的适应性改进工作。


    （1）水平目标框检测。


    水平目标框检测大多基于一般方法改进而来。例如，Ding等人关注遥感图像中的小目标，认为传统Faster R-CNN不能有效识别这些微小目标。为此提出了一个基于VGG-16网络的、融入扩散卷积层的多尺度的组合策略模型，提高了精度，同时减少了测试时间和所需内存。Qiu等人设计的自适应纵横比多尺度网络，注意保持物体的纵横比信息在训练过程中不被扭曲，缓解了训练过程中由于纵横比变化而导致物体过度变形的问题，该模型在一些水平目标框检测任务上表现良好。


    （2）倾斜目标框检测。


    倾斜目标框的光学遥感图像目标检测任务不仅检测目标的位置和长宽，也检测其倾斜角，难度较前一任务更大，但能获取更精准的目标定位。Ding等人设计了ROI transformer模型，增加了角度参数，可以获取有方向目标框，更有实用意义。Qian等人提出的RSDet考虑到倾斜框目标检测中回归不连续问题，将旋转目标的检测问题重定义为预测目标的角点，且提出了调制旋转损失，通过解决损失的不连续性，优化了损失函数的计算。Cheng等人提出的新式网络AOPG，提出了一个无需锚框的感兴趣区域生成器，并利用卷积层使生成的感兴趣区域向特征图对齐，在3个遥感数据集上的实验体现了该方法的有效性。


    2）遥感图像场景分类


    遥感图像分类算法主要用于场景分类。场景分类任务即判断遥感图像覆盖的场景类别，如机场、港口、河流、森林、建筑用地等。目前场景分类一般用于国土资源规划、农作物测收、环境监测、森林覆盖率统计等。


    早期的遥感图像分类主要是依靠人工提取特征，这些方法一般情况下需要依靠具备大量专业领域知识和实践经验的专家，利用图像的颜色、形状、纹理或光谱等视觉信息，通过显式的人工设计进行特征提取和编码等操作，进而进行场景分类。但是，随着技术的发展尤其遥感技术的发展，遥感图像不仅从数量上急剧增加，而且从质量上来说遥感图像的复杂度以及图像的分辨率也都越来越高，这些因素限制了早期人工方法的继续使用。


    在过去的几十年里，各方面学者对遥感图像提出了许多基于机器学习的分类方法。其中，按照训练模型时样本的标签信息是否参与，可分为监督分类、半监督分类和无监督分类。'
