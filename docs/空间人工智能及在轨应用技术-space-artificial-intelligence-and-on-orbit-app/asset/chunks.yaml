    ### 2. 深度学习通用加速器具体设计


    #### 1）卷积运算

    卷积运算是`CNN`模型的核心计算，其实现决定`CNN`模型计算单元整体结构。由于`CNN`模型层间运算具有独立性且各层运算具有高度相似性，因此可以通过复用单层运算资源来实现完整`CNN`模型卷积计算。在实现过程中，只需实现单层的卷积计算结构，即可通过构建多并行计算和存储架构实现网络模型加速。


    以`MoblieNetV2`模型为例，其卷积核大小有`3×3`和`1×1`两种类型，因此基本卷积运算模块需兼容两种大小卷积核的运算。单个卷积核并行运算流程如图12-15所示。当卷积核大小为`3×3`时，9个卷积参数寄存器在处理数据输入前完成更新，图像数据按行输入卷积运算模块，通过行数据缓存，构建循环移位存储器。当第3行图像数据输入时，通过寄存器调整数据时序，开始乘加运算，输出卷积结果。当卷积核大小为`1×1`时，该卷积运算模块最多可完成9个特征图的卷积处理，两种卷积核运算模式可通过控制信号Flag进行选择。由以上运算流程可知，该卷积基本运算为全并行流水架构，为后续加速架构的构建奠定了基础。


    ![](images/txt016_33.jpg "pagenumber_ebook=245,pagenumber_book=234")


    图12-15　单个卷积核并行运算流程


    网络模型需要完成海量卷积运算，可通过卷积核并行运算实现加速。如图12-16所示，多个卷积核共用一组存储单元实现了卷积运算的并行加速。


    ![](images/txt016_34.jpg "pagenumber_ebook=245,pagenumber_book=234")


    图12-16　多个卷积核并行加速运算架构


    为达到最佳加速比，存储带宽与计算能力需匹配。但频繁的数据访问会产生大量的功耗。因此，在设计卷积运算单元时，应尽可能地利用数据复用减少对存储器的访问次数，使访问带宽需求尽可能降低的结构。为此，多组卷积核共用一组外部存储器的方法可以显著减少对存储器的访问次数，从而大大提升能效比，具体架构如图12-17所示。


    ![](images/txt016_35.jpg "pagenumber_ebook=246,pagenumber_book=235")


    图12-17　多组卷积核并行运算加速架构


