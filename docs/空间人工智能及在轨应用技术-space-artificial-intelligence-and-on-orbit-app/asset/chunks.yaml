    ##### 发展趋势


    `PitBoss`系统的研制与开发主要由SEAKR公司负责，目前该公司已经研制发射了曼德拉1号与两颗曼德拉2号试验卫星。曼德拉1号是一个立方体卫星，携带超级计算机处理芯片，主要用于辐射缓解和处理器性能验证。曼德拉2号是一对小型卫星，携带宽带数据的卫星间激光链路，构成未来`LEO`光学网状网的基础。


    曼德拉1号于2020年秋季发射，其搭载的有效载荷包括高性能多核高级`RISC`机器（`ARM`）处理器和多个图形处理单元（`GPU`）。目前已成功实施了一项战术海上实验，展示任务自主、OTA更新、无质量有效载荷部署以及传感器边缘处理和利用。其中，部署及利用的关键技术包括模数转换器（`ADC`）和数模转换器（`DAC`）技术、基于现场可编程门阵列（`FPGA`）的处理技术以及基于专用独立电路（`ASIC`）的处理技术。

