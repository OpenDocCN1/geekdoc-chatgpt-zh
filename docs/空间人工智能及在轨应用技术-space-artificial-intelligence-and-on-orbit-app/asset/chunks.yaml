    ### 3. 加速器功能及性能分析


    #### 1）硬件平台

    加速器功能验证模式为`PC+FPGA`的模式。在`FPGA`上布置该加速器，`PC`机控制软件通过`PCIe`总线给加速器传输模型参数和待处理图像数据，加速器将处理结果通过`PCIe`总线发送给`PC`机控制软件，控制软件将对应图像和分类结果显示，并与标准解进行比对，验证该加速器功能。


    加速器验证框图如图 12-19 所示。


    ![](img/txt016_38.jpg "pagenumber_ebook=247,pagenumber_book=236")


    图 12-19　加速器验证框图


    验证`FPGA`使用`Xilinx`公司的`XC7 VX690T`器件，采用`Digilent`公司`Net-FPGA-SUME`开发板作为验证平台，软件开发工具为`Vivado`。


    验证流程如下：图像存储在`PC`机上，`CNN`模型的反向训练在`PC`机上完成，图像和训练完成的权值直接通过`PC`机的`PCIe`总线下载到`FPGA`。中心控制器负责解析`PC`机输入的图像、`CNN`模型参数，将其存储至外部存储器（`DDR3`）。控制层接收到`PC`机的开始运算指令后，调度卷积层和输出层相应模块完成`CNN`模型运算。当前向传播计算完成后，输出层结果由`FPGA`控制输回`PC`机。


    与`FPGA`实现作对比的是通用`CPU`和`GPU`平台下软件实现方式，`CNN`模型与`FPGA`实现完全一致。`CPU`采用`I7-6700`四核八线程处理器，基准主频为
    3.4 GHz，内存为 32GB `DDR4`。软件开发工具采用`Visual Studio 2013`。`GPU`采用`NVIDIA`公司的`GTX1050`，软件开发工具采用`CUDA7.0`，核心基准频率
    1 354 MHz，显存为 4GB `DDR5`。


    #### 2）验证数据集

    `ImageNet`数据集是一个用于视觉对象识别软件研究的大型可视化数据库，是目前深度学习图像领域应用得非常多的一个领域。关于图像分类、定位、检测等研究工作大多基于此数据集展开。`ImageNet`数据集文档详细，有专门的团队维护，使用非常方便，是目前全世界最大的、带有标记的图片数据库，在计算机视觉领域研究论文中应用非常广，成了目前深度学习图像领域算法性能检验的“标准”数据集。


    #### 3）计算能力

    根据`V7-690T FPGA`的硬件资源以及`MobileNetV2`网络模型的特点，将加速器设计成包含 16 个卷积模块为一组，共计 12 组的并行加速架构。由此可知，该加速器每时钟周期最多可完成`9×16×12=1
    728`次乘加运算，为保证加速器计算性能，特征图运算的加法运算采用`FPGA`的硬件乘法器实现。加速器计算架构确定后，由于每层的运算量不同，会造成部分计算资源闲置。因此，提升加速器架构的计算效率成为衡量加速器性能的关键。加速器各层计算效率如表
