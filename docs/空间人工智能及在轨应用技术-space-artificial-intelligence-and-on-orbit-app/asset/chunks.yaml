    13.4.2　基于长短时记忆网络的遥感文本分析与表示


    相比于词袋表示的高维、稀疏而言，词向量表示具有低维、稠密的特点，通常用50、100或200维的长度就能很好地表示一个庞大的文本数据词汇库，而稠密的好处体现在任意两个词的词向量表示具有距离特性，语义信息越相似的词单元在词向量距离上也越近。这种更有效的初级特征表示方法来处理遥感文本句子，在模型前期提供了更好的保障。Skip-gram模型是利用当前词的特征向量来表示邻域的其他词，通过求解所有词的最小误差得到最佳参数，目标函数为


    ![](images/txt017_85.jpg "pagenumber_ebook=336,pagenumber_book=325")


    其中，w1，w2，w3，…，wT表示一个序列训练单词；c是训练时上下文单词窗口大小。


    LSTM模型是传统循环神经网络模型的一种特殊变种结构，能有效解决循环神经网络中由于句子太长所引起的梯度弥散问题。LSTM单元中加入了循环神经网络隐含层结点中不具有的记忆功能，通过输入门、遗忘门和输出门3种控制功能结构门来选择最恰当的前一隐含结点和当前结点输入词向量的信息比例，从而得到更好的输出特征，同时能更有效地控制神经网络模型中广泛存在的梯度弥散。遗忘门、输入门、输出门的目标函数形式分别为


    ![](images/txt017_86.jpg "pagenumber_ebook=337,pagenumber_book=326")


    在使用LSTM模型处理遥感文本句子时，通常可以使用最后一个隐含单元结点的输出作为整个句子的特征表示向量。这在大多数情况下是行之有效的，但是偶尔会因为越靠后的结点对模型输出信息的贡献比例越重这一特性，导致选择最后一个隐含单元的输出作为整个句子的表示时存在缺陷。在这种情况下，可以选择利用所有隐含单元的输出信息，来避免这种不足，具体流程如图13-57所示。


