    ## 3. 算法流程分解

    主要处理流程及任务分配如图13-8所示。处理单元`FPGA`通过光纤模块或`Serdes`接口开始接收载荷图像数据，接收到数据后`FPGA`流水完成形态学增强等图像预处理工作，将预处理结果通过`SRIO`总线发送给`DSP`，`DSP`进行图像分割、连通域标记、`HOG`处理等基于形态学的可疑目标提取处理以及目标切片生成功能，处理的图像数据可根据需要进行降分辨率处理，在不影响检测效果的情况下，可有效降低处理数据量。`DSP`根据检测出来的可疑目标坐标在原始分辨率上进行目标切片截取，并将目标切片数据通过`SRIO`总线发送给`FPGA`。


    ![](images/txt017_9.jpg "pagenumber_ebook=276,pagenumber_book=265")


    图13-8　主要处理流程及任务分配


    `FPGA`和`GPU`配合完成基于卷积神经网络的深度学习处理，对目标切片进行精分析，以达到目标识别分类。其中，`FPGA`主要负责卷积层并行加速处理，`GPU`主要负责模式配置以及分类层处理。目标切片处理完成后，`DSP`对分类结果进行判定：若是感兴趣目标，则将该目标切片和目标类型打包通过交换单元发送给存储单元进行存储；若不是感兴趣目标，根据事先设定的规则可选择将该目标切片扔掉或通过`LVDS`接口发送给数传单元进行存储。


    ### 1）深度网络算法模型分析

    如图13-4所示，标准`VGG-16`模型包含13个卷积层和3个全连接层，使用不断增加的3×3卷积层，并通过2×2最大池化（`Maxpooling`）来减小运算规格。首先是13个卷积层，其次是两个4
    096节点和1个1 000节点的全连接层，最后是一个`Softmax`分类器，能够实现1 000类目标分类。同时，最重要的是`VGG-16`模型运算规律性强，便于实现硬件资源的并行流水加速。


    `VGG-16`模型参数量和运算量巨大。如表13-2所示，`VGG-16`模型参数量达到138 M个，若采用单精度浮点形式，参数数据量将达到500多兆，输入图像大小若为224×224，模型运算量将达到15.5
    `GOPs`（1 `OPs`等于1次乘法和加法操作）。


    表13-2　`VGG-16`模型网络参数及计算量分析


    ![](images/txt017_10.jpg "pagenumber_ebook=277,pagenumber_book=266")


    通用卷积计算架构如图13-9所示，其中包括运算参数接收及解析模块、数据和权重参数接收及解析模块、状态控制模块、数据参数控制模块、卷积运算模块、内部存储器模块、外部存储器模块、卷积结果处理模块以及处理结果输出模块。运算参数接收及解析模块、数据和权重参数接收及解析模块解析出卷积运算需要的工作参数信息，并根据输入的图像数据流启动卷积运算，状态控制模块控制内部存储器模块、外部存储器模块、数据参数控制模块、卷积运算模块、卷积结果处理模块以及处理结果输出模块按照上述解析的参数和模式进行卷积运算，并最终控制输出卷积处理结果。


    ![](images/txt017_11.jpg "pagenumber_ebook=278,pagenumber_book=267")


    图13-9　通用卷积计算架构


    卷积计算加速详细结构如图13-10所示。`VGG-16`模型总共包含1 634496次卷积核大小为3×3的二维卷积运算，如此庞大的卷积运算可通过卷积核并行运算及多个卷积核共用一组外部存储器的方式实现卷积运算的并行加速。为达到最佳加速比，存储带宽与计算能力需匹配，然而频繁的片外数据访问会产生大量的功耗。为降低功耗，需减少卷积运算对外部数据存储器的访问频率，为此多组卷积核共用一组特征图数据的方法可以显著减少对片外存储器的访问次数，从而大大提升加速器的能效比。


