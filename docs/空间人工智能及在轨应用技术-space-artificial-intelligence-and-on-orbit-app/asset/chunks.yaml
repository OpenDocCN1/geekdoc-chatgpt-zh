- raw: '随着导航卫星星间链路的实现，为长距离的远程卫星接力通信提供了可能。采用高速和精确指向的激光星间链路，卫星将提供更高速率的星间链路网络，实现大容量的星间信息传输，减轻地面跟踪、遥测和指令站的负担。激光通信系统尺寸、质量和功耗明显降低，抗电磁干扰能力、保密性强，其中核心技术是激光束的捕获-对准-跟踪技术。


    未来相干激光通信的典型通信速率为每秒10 Gb量级，与传统微波通信终端相比，激光终端体积小、质量轻，光学天线口径较小，整体成本降低，且性能大幅提升，是构建天基导航信息传输的理想方式。


    3.网络拓扑结构


    在卫星网络中，卫星节点通过星间链路连接起来，构成一个完整的卫星星座网络。一个完整的卫星星座可以由轨道平面间链路（Inter-Plane Links）和轨道平面内链路（Intra-Plane
    Links）构成一个具有规则网状网（Mesh）结构的卫星网络。卫星网络的拓扑结构定义为卫星网络中卫星节点与节点之间的相互连接关系。拓扑结构可以是如二维的网格规则的拓扑结构，也可以是如基于开关的不规则拓扑网络结构，目前正在使用的卫星网络大多数采用高度规则的拓扑结构。卫星网络的拓扑结构决定了每个卫星节点的所链接的星间链路数、消息或数据包所传输的路径。卫星网络设计的第一步是对卫星网络拓扑结构的研究。该研究对整个系统建成后的性能有着关键的影响，也是采用不同通信协议的基础。


    导航卫星网络一般采用网状网络拓扑结构。网状拓扑（Mesh）定义为邻近节点按照规则的平面图形互相连接而成的一种网状结构。网状拓扑结构是一种分布式网络拓扑结构。在这种网络拓扑结构中，由于每个节点都可以与网中的其他节点相连接，所以到每个节点都有充裕的冗余路径。网状拓扑结构的特点是具有较高的可靠性与高容错能力。由于其严格正交，因此可以用节点在二维空间中的坐标作为节点编号，网络路由简单。网状拓扑的优点：


    ①星间链路的冗余备份充分，系统可靠度高，可扩展性强；


    ②星间链路的传输带宽可以很高，数据的传输速度快，时延小，可以实现全球覆盖。


    网状拓扑的缺点主要是对卫星的数量要求较多，导致卫星网络的建造成本高。在网状卫星网络中，由于每个卫星节点都与其他节点直接相连，卫星网络中有充足的冗余路径，因此其是可靠性最高的网络拓扑结构，具有非常高的可靠性和高容错能力，是卫星网络的发展趋势。


    多层卫星网络应由包括数据交换的骨干网和各种接入网组成。由于GEO和MEO卫星的轨道高，其传输时延和链路损耗都比较大，因此在多层卫星网络中通常都是作为空间信息交换的骨干网，并且负责与关口站和大型终端通信，而LEO卫星和HAP则可以为地面的移动小终端用户提供更好的服务。因此，在上述的多层卫星网络中，LEO和HAP是作为地面用户的接入节点，并能够通过ISL与骨干网进行数据交换。


    4.网络路由


    卫星网络由于其所处环境特殊、通信节点高速移动等特点，路由技术是其体系架构研究中的重点。路由技术研究是针对卫星网络特点开发和设计的各种有效路由算法和路由协议，为网络内部的端、节点或地面段用户之间提供可行的数据传输路径，尤其是经历多星多跳的远端用户之间的数据传送路径。早期的卫星通信系统一般以GEO卫星为中继，采用弯管BP方式为地面两点之间的通信完成数据转发，数据传送形式固定，不存在路由问题。但是，在由多颗卫星组成的星座网络中，需要在源端卫星和目的端卫星之间的多条可达路径中，按照给定的链路代价度量选择最优路径。可将天地一体化路由分为以下3个部分：


    ①上/下行链路（Up/Down Link，UDL）路由，负责各种用户到卫星网络的接入控制，并为用户选择源端卫星和目的端卫星（后统称为端卫星）。


    ②边界路由，负责卫星网络与地面网络之间的互操作和无缝融合，使端用户通过地面网络和卫星网络进行透明通信。


    ③空间段路由，即ISL网络路由，负责在卫星星座内部源端卫星和目的端卫星之间计算满足一定需求的最优路径。


    在上述3类路由中，UDL路由相对比较简单。例如，可以根据单星覆盖时间长短或信号强弱为用户选择服务卫星并进行星间切换控制。对于边界路由，可以把空间段卫星网络看作地面网络的一个特殊子网，在负责接入到卫星网络的地面关口站和卫星网络中指定的边界路由器上运行改进的边界路由协议以实现异构网络的互联。


    在构建卫星网络的过程中，应集中解决ISL段路由问题。ISL段路由实现端卫星之间的路由，属于点到点路由问题，也是天地一体化网络中最基本的路由问题，其技术是实现空间段中星与星互联的基础。卫星网络的特点使其既区别于传统地面固定网络，又区别于地面无线通信网络，从而使地面网络路由机制不能直接应用于卫星网络，而必须针对卫星网络特点研究和设计新的路由机制。卫星网络路由一般应具有以下特性：


    ①网络拓扑动态变化的适应性。路由算法应采取适当措施避免可能出现的路由环，或在出现路由环时能够及时有效地消除路由环带来的不利影响。


    ②抗毁性。当在两次路由更新间隔之间出现卫星节点失效或者链路故障时，路由算法应能够有效避免由此引起的数据丢失。


    ③高效性。路由算法或协议应尽量降低实施复杂性，以较小的开销获得较大的传输成功率或系统吞吐量。


    ④网络流量变化的适应性。路由算法应能采取措施支持流量负载均衡以避免网络出现链路拥塞或节点拥塞，或者在出现拥塞时能够及时有效地消除拥塞带来的不利影响。


    按照不同分类方式，卫星网络路由技术可归纳为集中式路由与分布式路由、面向连接路由与无连接路由、静态路由与动态路由、先验式（Proactive）路由与反应式（Reactive）路由以及混合式路由、单层卫星网络路由与多层卫星网络路由等。


    9.2　自主运管需求


    1.运管系统架构


    作为卫星星座运行管理的重要支撑部分，运管系统架构设计至关重要，它对卫星星座的运行管理及维护升级产生根本性的影响。星座的卫星数目越来越多，依靠地面测控站进行卫星的定轨与跟踪将难以承受其高负荷的数据传输与处理压力。同时，卫星星座如果过分依赖地面站的测控，在地面站损毁的情况下，其正常运行将难以得到保证。因此，发展卫星星座系统的自主性成为星座运行管理的一个重要发展方向。运管系统逐渐向着自动化、智能化的方向发展。


    利用适用于卫星在轨运营的测运控一体化无人值守地面管理系统，实现自动化监控管理、无人值守、任务自动下发、卫星自动跟踪，完成卫星状态监控、业务数据自动收发、自动处理、自动分发等功能，满足多颗低轨商业卫星同时跟踪服务。针对卫星独特的运营模式，提高卫星在轨运行管理效率，减少卫星在轨管理成本，实现仅用一套地面设备就可实现多颗低轨卫星的测控和运控管理工作，并实时完成卫星测控、数传数据解析处理。


    低轨卫星的测控原理与高轨卫星相同，但由于其轨道周期短、速度快，对于地面测控站不是实时可见。因此，针对低轨卫星的测运控管理方式与地球同步轨道卫星有较大的区别。首先，由于其对于地面站不是一直可见，这就要求星上具有较高的自主能力，包括轨道测量、轨道确定、轨道调整、工作模式转换、卫星平台及载荷操作以及故障检测、隔离及恢复等；其次，由于低轨星座涉及多颗卫星及多个地面站协同工作，因此低轨星座测运控管理需要一套功能强大的任务调度软件，基于卫星的可见弧段及任务需求，实现资源的最优分配及调度。


    当前国内外的卫星星座运管系统存在诸多缺点：一是兼容性差。例如，用于导航定位的北斗卫星，与用于气象观测的风云卫星，它们所用的运管系统与运维团队都是完全独立的，无法由同一套系统完成运管任务。二是容量小。每个系统所支持的卫星只有几颗，很少有支持超过10颗以上的系统。三是对于工作人员来说，存在操作复杂，界面不规范的问题，同时随着在轨卫星星座数量的逐年增多，卫星星座在轨测控长期管理面临诸多挑战，工作人员的业务量也会相应增多，需要智能化的系统来减轻工作人员的业务压力，减少不必要的工作。


    以Doves星座为例，Planet Lab公司的飞行任务管理团队将重点放在星座常规操作的自动化工作，从而替代手动/人工处理流程，自动化系统也将不断升级迭代，平均24
    h至少收集一次所有卫星的健康数据；在轨及地面部分将通过基于“自制、灵活可扩展、微服务”的任务控制接口为上百颗卫星及广阔的地面天线接收站提供常规操作、调试操作、定制动作、实验及部署等操作。


    2.星座构型维持


    星座的建设目标在于通过卫星的数量优势来提高向地面提供服务的覆盖范围与覆盖时长。星座在设计之初就已确定运行构型，星座内所有卫星均应按照所设计的运行构型进行工作，共同维持卫星星座的构型稳定及服务连续。


    当发射数百颗卫星后，地面运维系统没有时间对每一颗卫星进行地面飞行控制，使其定位于星座的制定轨道位置；地面运维系统告知每一颗卫星在星座的位置，由卫星自主飞行控制至指定轨道位置；地面运维系统持续向星座中卫星更新通信量与卫星星座的变化情况，卫星自主做出相应动作调整。


    当前星座构型维持方法大致分为站位维持方法和摄动补偿方法两类。


    1）站位维持方法


    维持星座构型通常采用站位维持的方法，即对卫星进行主动控制，将卫星的绝对或相对位置维持在设计位置。当卫星运行超出该允许漂移范围时，才对卫星进行控制。为了保持星座的长期稳定性和连续性，在星座设计时需要选择具有较好容错性和较大容许偏差量的星座构型，使得星座具有一定的降级运行能力，并且卫星偏离标称轨道一定范围时也不会影响星座的服务性能。星座构型保持是星座中所有卫星的整体控制，在控制时必须注意卫星之间完成任务的整体性和协同性，星座的轨道控制在控制参数、控制量和控制精度的要求上都发生了变化，因此必须从星座空间结构、任务需求、协同控制和性能影响等方面综合考虑。同时，星座构型保持控制时还应根据卫星的覆盖特性、过顶时间、最大不可视时间以及健康状况等信息确定具体的控制策略和控制方法。


    2）摄动补偿方法


    通常认为，编队飞行的各卫星之间有动力学联系和约束条件；星座则以单颗卫星轨道运动为基础，星与星之间的动力学联系并不紧密。事实上，由于星座的特殊结构，使得卫星之间也存在复杂的动力学耦合关系，而这种耦合关系决定了星座构型的整体变化趋势，同时也使得利用摄动补偿方法来提高星座的长期稳定性成为可能。摄动补偿方法通过对星座中卫星轨道的合理选择和参数调整来补偿某些可预测摄动引起的星座构型变化，从而达到保持星座整体构型的目的。当前，世界各国研究者在星座相对运动和受摄分析方面进行了大量的研究。研究表明，地球非球形摄动和卫星的初始位置偏差是导致星座构型破坏的主要原因。因此，选择具有较高稳定性的轨道，同时利用摄动力的补偿设计可以提高星座构型的稳定性。摄动补偿方法是对已经设计好的星座构型的卫星轨道参数的一种小量偏置手段，并不改变星座的基本结构。通过摄动补偿设计对轨道参数进行调整能够减缓摄动外力对构型的破坏作用，使星座构型在较长时间内保持在容许范围内，同时对星座入轨后偏离容许范围的卫星施加控制，维持星座的整体构型，从而降低星座构型控制代价，减少控制频率，提高星座构型的长期稳定性。


    3.星座备份与阶段部署


    在星座在轨运行期间，为提高整个星座的可靠性，保证星座的长期稳定运行，通常采用卫星冗余备份手段来保证服务质量，即预备一定数目的备份卫星，在必要时备份卫星能够及时接替故障卫星所承担的任务，使得星座具备承受少数卫星故障而不会出现大幅度性能下降的能力。例如，导航星座通常要求具有在两颗卫星失效的情况下仍然能够提供满足最低需求服务的能力。卫星星座运维机制必须制定某颗或某几颗卫星出现故障时的应对策略，主要有以下几种策略。


    1）内在冗余策略


    在星座构型设计之初就将备份星配置在星座构型之内，使得星座正常运行时即存在卫星数量的冗余，这是目前星座项目中广泛采用的策略。


    2）空间替补策略


    在星座建立时将若干颗备份星配置在星座之外的某个空间位置，当某一轨道面内的某颗卫星出现故障时，备份星通过机动变轨运动到故障星位置接替故障星工作。执行空间替补策略需要一定的时间与燃料消耗。


    3）地面替补策略


    将备份星保存在地面，当星座中卫星发生在轨故障时再行发射。执行这一策略的一个重要前提是备份星应急发射运载工具具有实时可用性。当前小型固体运载火箭的出现为地面替补策略的实施提供了经济的解决方案。


    4）软替换策略


    与上述几种策略不同，软替换策略并非硬件上增补或冗余一颗或几颗卫星，而是通过软件功能升级来弥补硬件的缺陷，从软件角度实现星座重构。针对星座中仍能正常工作的卫星升级软件功能或激发预存的备份软件，改变原有星座的功能模式。


    星座的部署不是一个短时期内能完成的任务，大多数星座都需要几年甚至十几年的时间才能够最终部署完成。因此，星座构型的分阶段部署，必须考虑星座每个阶段的系统性能，而不是以最终系统状态作为优化的唯一目标。星座的初始构型、中间构型和最终构型是相互牵连、相互制约的，在星座设计初期就应该予以充分考虑。应该在考虑工程实际约束的前提下最大化星座各阶段子星座的功能，使其在建设过程中实现台阶式的性能提升，使得在部署过程中，已经发射上天的卫星能够实现系统的部分功能，或者能够完全实现系统的功能只是未达到预期的水平要求。同时，卫星的分阶段部署，必须考虑卫星系统升级迭代的过程，每个阶段的卫星系统设计、资源配置、功能要求等很大可能性会发生变化。因此，在卫星系统设计之初就需要考虑硬件资源与软件功能的扩展性及可配置性。


    针对分阶段部署情况下的卫星系统升级迭代过程，为了保证新技术应用的可靠性，卫星星座建造者需要针对新技术实施在轨验证，验证通过之后才在卫星星座中推广应用。以Doves卫星星座为例，每一批次的发射任务均考虑卫星的冗余备份，选取部分卫星（Staging
    Sats）验证具有高风险性的试验技术，为后续批次的技术升级奠定基础。以星链卫星为例，新技术的验证（软件在轨升级）类似于Web Service开发模式，首先在一小部分在轨卫星上进行试验。若试验验证结果满足预期，则在在轨其他卫星及后续发射批次卫星中推广应用；若不满足预期，支持系统重试、回卷、停止等操作。如此，使得卫星系统具备快速迭代升级能力。


    4.智能控制需求


    由于卫星星座涉及卫星数量较多，少则几颗，多则上百颗甚至上千颗，针对这种情况仅依靠增加人力或提升地面运管系统能力是不够的。这存在两方面原因：一方面，卫星星座数量所带来的运管操作将呈现指数增长，人力增长无法满足需求；另一方面，虽然通过提升地面运管系统能力能够满足大批量卫星运管需求，但必须考虑紧急情况下，地面运管系统短期故障或失联可能导致卫星星座的工作异常、失控或失效。因此，提高卫星智能化、自主化水平，使卫星实现智能控制应为卫星星座设计的重要研究内容。卫星智能自主控制主要包括3个方面，即自主运行控制、自主碰撞规避、自主离轨。


    1）自主运行控制


    星座自主运行是指卫星在不依赖地面设施的情况下，自主确定星座状态和维持星座构型，在轨完成飞行任务所要求的功能或操作。自主运行能够大大降低星座成本、减小系统风险。星座要实现自主运行首先要解决成员星的自主控制问题，由于卫星姿态控制及星务管理通常已实现自主控制，自主运行控制相关技术主要为自主规划与调度、自主导航、自主轨道控制等。


    （1）自主规划与调度。


    自主规划与调度是卫星自主决策的关键，也最能体现卫星系统的自主能力。卫星自主规划与调度的任务是根据卫星当前的资源状况、外部环境以及其他约束条件，选择各种动作并分配资源，将任务级操作分解成指令程序。


    （2）自主导航。


    自主导航是卫星/星座实现姿态轨道自主控制的前提和基础，为星座构型控制提供测量数据。对于导航星座来说，自主导航还肩负着为星座系统提供高精度广播星历的重任。


    （3）自主轨道控制。


    要使星座的几何构型在一定精度内保持不变，必须对卫星的轨道进行控制。自主轨道控制是基于自主导航的轨道控制，星上计算机依据自主导航系统提供的卫星运动参数，控制器给出控制指令，推进系统完成轨道机动，这就是卫星自主轨道控制的基本运作方式。


    以自主导航为例，目前应用较为广泛的星座自主导航方案包括天文导航、导航星导航以及星间相对观测导航等。由于星座中的卫星数目较多，单纯采用单颗卫星自主导航则会忽略星座中星间相对运动的信息。充分利用星间运动的相对运动规律，采用星间相对测量信息进行相对自主导航已逐渐成为研究的热点。


    美国的第三代GPS卫星BlockⅡR就是利用星间相对测量进行自主导航的一个具体应用，它具有交联测距和在轨处理导航数据的能力。各颗卫星使用星载处理器，计算导航参数的修正值，从而提供导航精度，增强自主生存能力。BlockⅡR能够在轨自主更新和精化GPS卫星的广播星历和星钟A系数，无需地面监控系统的干预。它能够自主运行180天做导航定位服务，且在第180天时，用户测距精度（URE）仍可达到±7.4
    m。因此，即使地面监控系统暂时毁坏，仍能维持高精度的GPS卫星导航定位，增强了GPS系统的抗毁能力。


    Galileo导航系统也曾提出过采用星间观测的自主导航方案。该方案运用星间测量和星地测量相结合进行处理，用于日常星历的修正，提高卫星预报星历和时钟的精度。通过地面仿真实验，用户测距误差可达到分米级（低轨星历数据刷新率15
    min，高轨2 h）。因此，对于利用星间测量的星座的相对定位方法不仅能够实现星座的自主生存，还能通过提高日常星历的精度来提高用户的定位精度，从而提升整个导航系统的性能。


    2）自主碰撞规避


    由于近地空间“交通状况”日趋严峻，卫星发生碰撞的概率将大大增加，完全依靠地面系统监测来预测碰撞并预警、进行碰撞规避机动的模式将变得捉襟见肘。针对大批量卫星星座，由于卫星数量众多，很难完全由地面系统来负责碰撞监测以及规避机动等工作，只能依靠地面支持+卫星自主方式，使其具备自主碰撞规避能力，从而避免类似铱星33号卫星与宇宙2251卫星碰撞事故的再次发生。


    星链卫星配备自主碰撞规避系统，接收来自地面的空间碎片威胁信息数据，使用4个动量轮系统配合离子推进系统来实现自动规避空间碎片和其他航天器功能。这种自主规避防撞功能能够最大限度地降低人工出错的概率，让卫星在一个可靠的无碰撞的空间环境中稳定运行。


    地面系统预报星座卫星轨道，并检索空间目标数据库（在轨大约20000个目标），筛选潜在碰撞目标，计算碰撞概率，将高预警碰撞时刻和轨道控制上注卫星。卫星利用4个互相垂直的动量轮加速或减速运动改变卫星姿态，配合离子推进发动机抬高或降低卫星轨道，完成规避。规避完成后再次机动返回标称轨道。地面碰撞检测完全由计算机自动化完成，定时计算，自动上注，完成主动规避。


    3）自主离轨


    通常，卫星星座的成员星建造成本与可靠性设计指标相对较低，则卫星在轨寿命较短，如果不对发生故障的失效卫星或寿命到期卫星进行离轨等任务后处置，则会形成太空垃圾，产生空间碎片，可能影响卫星星座自身的使用效能，同时会影响其他航天器运行安全。因此，为卫星星座设计高效且低廉的自主离轨手段将十分必要。


    对于星座中的每一颗卫星，由于星座整体功能的实现依赖于所有组网卫星的正常工作。因此，如果发现其中某颗卫星出现故障并已确定不能完全修复，应积极考虑予以替换。对于被替换下来的卫星，必须对其实施运行终止策略，使其脱离原来轨道直接下降进入大气层烧毁，或者转移到一条短寿命的轨道上去，以防止它与其他正常卫星碰撞和变成空中垃圾。


    9.3　智能协同需求'
  fmt: '

    随着导航卫星星间链路的实现，为长距离的远程卫星接力通信提供了可能。采用高速和精确指向的激光星间链路，卫星将提供更高速率的星间链路网络，实现大容量的星间信息传输，减轻地面跟踪、遥测和指令站的负担。激光通信系统尺寸、质量和功耗明显降低，抗电磁干扰能力、保密性强，其中核心技术是激光束的捕获-对准-跟踪技术。


    未来相干激光通信的典型通信速率为每秒10 Gb量级，与传统微波通信终端相比，激光终端体积小、质量轻，光学天线口径较小，整体成本降低，且性能大幅提升，是构建天基导航信息传输的理想方式。


    ## 3. 网络拓扑结构


    在卫星网络中，卫星节点通过星间链路连接起来，构成一个完整的卫星星座网络。一个完整的卫星星座可以由轨道平面间链路（Inter-Plane Links）和轨道平面内链路（Intra-Plane
    Links）构成一个具有规则网状网（Mesh）结构的卫星网络。卫星网络的拓扑结构定义为卫星网络中卫星节点与节点之间的相互连接关系。拓扑结构可以是如二维的网格规则的拓扑结构，也可以是如基于开关的不规则拓扑网络结构，目前正在使用的卫星网络大多数采用高度规则的拓扑结构。卫星网络的拓扑结构决定了每个卫星节点的所链接的星间链路数、消息或数据包所传输的路径。卫星网络设计的第一步是对卫星网络拓扑结构的研究。该研究对整个系统建成后的性能有着关键的影响，也是采用不同通信协议的基础。


    导航卫星网络一般采用网状网络拓扑结构。网状拓扑（Mesh）定义为邻近节点按照规则的平面图形互相连接而成的一种网状结构。网状拓扑结构是一种分布式网络拓扑结构。在这种网络拓扑结构中，由于每个节点都可以与网中的其他节点相连接，所以到每个节点都有充裕的冗余路径。网状拓扑结构的特点是具有较高的可靠性与高容错能力。由于其严格正交，因此可以用节点在二维空间中的坐标作为节点编号，网络路由简单。网状拓扑的优点：


    ①星间链路的冗余备份充分，系统可靠度高，可扩展性强；

    ②星间链路的传输带宽可以很高，数据的传输速度快，时延小，可以实现全球覆盖。


    网状拓扑的缺点主要是对卫星的数量要求较多，导致卫星网络的建造成本高。在网状卫星网络中，由于每个卫星节点都与其他节点直接相连，卫星网络中有充足的冗余路径，因此其是可靠性最高的网络拓扑结构，具有非常高的可靠性和高容错能力，是卫星网络的发展趋势。


    多层卫星网络应由包括数据交换的骨干网和各种接入网组成。由于GEO和MEO卫星的轨道高，其传输时延和链路损耗都比较大，因此在多层卫星网络中通常都是作为空间信息交换的骨干网，并且负责与关口站和大型终端通信，而LEO卫星和HAP则可以为地面的移动小终端用户提供更好的服务。因此，在上述的多层卫星网络中，LEO和HAP是作为地面用户的接入节点，并能够通过ISL与骨干网进行数据交换。


    ## 4. 网络路由


    卫星网络由于其所处环境特殊、通信节点高速移动等特点，路由技术是其体系架构研究中的重点。路由技术研究是针对卫星网络特点开发和设计的各种有效路由算法和路由协议，为网络内部的端、节点或地面段用户之间提供可行的数据传输路径，尤其是经历多星多跳的远端用户之间的数据传送路径。早期的卫星通信系统一般以GEO卫星为中继，采用弯管BP方式为地面两点之间的通信完成数据转发，数据传送形式固定，不存在路由问题。但是，在由多颗卫星组成的星座网络中，需要在源端卫星和目的端卫星之间的多条可达路径中，按照给定的链路代价度量选择最优路径。可将天地一体化路由分为以下3个部分：


    ①上/下行链路（Up/Down Link，UDL）路由，负责各种用户到卫星网络的接入控制，并为用户选择源端卫星和目的端卫星（后统称为端卫星）。

    ②边界路由，负责卫星网络与地面网络之间的互操作和无缝融合，使端用户通过地面网络和卫星网络进行透明通信。

    ③空间段路由，即ISL网络路由，负责在卫星星座内部源端卫星和目的端卫星之间计算满足一定需求的最优路径。


    在上述3类路由中，UDL路由相对比较简单。例如，可以根据单星覆盖时间长短或信号强弱为用户选择服务卫星并进行星间切换控制。对于边界路由，可以把空间段卫星网络看作地面网络的一个特殊子网，在负责接入到卫星网络的地面关口站和卫星网络中指定的边界路由器上运行改进的边界路由协议以实现异构网络的互联。


    在构建卫星网络的过程中，应集中解决ISL段路由问题。ISL段路由实现端卫星之间的路由，属于点到点路由问题，也是天地一体化网络中最基本的路由问题，其技术是实现空间段中星与星互联的基础。卫星网络的特点使其既区别于传统地面固定网络，又区别于地面无线通信网络，从而使地面网络路由机制不能直接应用于卫星网络，而必须针对卫星网络特点研究和设计新的路由机制。卫星网络路由一般应具有以下特性：


    ①网络拓扑动态变化的适应性。路由算法应采取适当措施避免可能出现的路由环，或在出现路由环时能够及时有效地消除路由环带来的不利影响。

    ②抗毁性。当在两次路由更新间隔之间出现卫星节点失效或者链路故障时，路由算法应能够有效避免由此引起的数据丢失。

    ③高效性。路由算法或协议应尽量降低实施复杂性，以较小的开销获得较大的传输成功率或系统吞吐量。

    ④网络流量变化的适应性。路由算法应能采取措施支持流量负载均衡以避免网络出现链路拥塞或节点拥塞，或者在出现拥塞时能够及时有效地消除拥塞带来的不利影响。


    按照不同分类方式，卫星网络路由技术可归纳为集中式路由与分布式路由、面向连接路由与无连接路由、静态路由与动态路由、先验式（Proactive）路由与反应式（Reactive）路由以及混合式路由、单层卫星网络路由与多层卫星网络路由等。


    ## 9.2 自主运管需求


    ### 1. 运管系统架构


    作为卫星星座运行管理的重要支撑部分，运管系统架构设计至关重要，它对卫星星座的运行管理及维护升级产生根本性的影响。星座的卫星数目越来越多，依靠地面测控站进行卫星的定轨与跟踪将难以承受其高负荷的数据传输与处理压力。同时，卫星星座如果过分依赖地面站的测控，在地面站损毁的情况下，其正常运行将难以得到保证。因此，发展卫星星座系统的自主性成为星座运行管理的一个重要发展方向。运管系统逐渐向着自动化、智能化的方向发展。


    利用适用于卫星在轨运营的测运控一体化无人值守地面管理系统，实现自动化监控管理、无人值守、任务自动下发、卫星自动跟踪，完成卫星状态监控、业务数据自动收发、自动处理、自动分发等功能，满足多颗低轨商业卫星同时跟踪服务。针对卫星独特的运营模式，提高卫星在轨运行管理效率，减少卫星在轨管理成本，实现仅用一套地面设备就可实现多颗低轨卫星的测控和运控管理工作，并实时完成卫星测控、数传数据解析处理。


    低轨卫星的测控原理与高轨卫星相同，但由于其轨道周期短、速度快，对于地面测控站不是实时可见。因此，针对低轨卫星的测运控管理方式与地球同步轨道卫星有较大的区别。首先，由于其对于地面站不是一直可见，这就要求星上具有较高的自主能力，包括轨道测量、轨道确定、轨道调整、工作模式转换、卫星平台及载荷操作以及故障检测、隔离及恢复等；其次，由于低轨星座涉及多颗卫星及多个地面站协同工作，因此低轨星座测运控管理需要一套功能强大的任务调度软件，基于卫星的可见弧段及任务需求，实现资源的最优分配及调度。


    当前国内外的卫星星座运管系统存在诸多缺点：一是兼容性差。例如，用于导航定位的北斗卫星，与用于气象观测的风云卫星，它们所用的运管系统与运维团队都是完全独立的，无法由同一套系统完成运管任务。二是容量小。每个系统所支持的卫星只有几颗，很少有支持超过10颗以上的系统。三是对于工作人员来说，存在操作复杂，界面不规范的问题，同时随着在轨卫星星座数量的逐年增多，卫星星座在轨测控长期管理面临诸多挑战，工作人员的业务量也会相应增多，需要智能化的系统来减轻工作人员的业务压力，减少不必要的工作。


    以Doves星座为例，Planet Lab公司的飞行任务管理团队将重点放在星座常规操作的自动化工作，从而替代手动/人工处理流程，自动化系统也将不断升级迭代，平均24
    h至少收集一次所有卫星的健康数据；在轨及地面部分将通过基于“自制、灵活可扩展、微服务”的任务控制接口为上百颗卫星及广阔的地面天线接收站提供常规操作、调试操作、定制动作、实验及部署等操作。


    ### 2. 星座构型维持


    星座的建设目标在于通过卫星的数量优势来提高向地面提供服务的覆盖范围与覆盖时长。星座在设计之初就已确定运行构型，星座内所有卫星均应按照所设计的运行构型进行工作，共同维持卫星星座的构型稳定及服务连续。


    当发射数百颗卫星后，地面运维系统没有时间对每一颗卫星进行地面飞行控制，使其定位于星座的制定轨道位置；地面运维系统告知每一颗卫星在星座的位置，由卫星自主飞行控制至指定轨道位置；地面运维系统持续向星座中卫星更新通信量与卫星星座的变化情况，卫星自主做出相应动作调整。


    当前星座构型维持方法大致分为站位维持方法和摄动补偿方法两类。


    #### 1）站位维持方法


    维持星座构型通常采用站位维持的方法，即对卫星进行主动控制，将卫星的绝对或相对位置维持在设计位置。当卫星运行超出该允许漂移范围时，才对卫星进行控制。为了保持星座的长期稳定性和连续性，在星座设计时需要选择具有较好容错性和较大容许偏差量的星座构型，使得星座具有一定的降级运行能力，并且卫星偏离标称轨道一定范围时也不会影响星座的服务性能。星座构型保持是星座中所有卫星的整体控制，在控制时必须注意卫星之间完成任务的整体性和协同性，星座的轨道控制在控制参数、控制量和控制精度的要求上都发生了变化，因此必须从星座空间结构、任务需求、协同控制和性能影响等方面综合考虑。同时，星座构型保持控制时还应根据卫星的覆盖特性、过顶时间、最大不可视时间以及健康状况等信息确定具体的控制策略和控制方法。


    #### 2）摄动补偿方法


    通常认为，编队飞行的各卫星之间有动力学联系和约束条件；星座则以单颗卫星轨道运动为基础，星与星之间的动力学联系并不紧密。事实上，由于星座的特殊结构，使得卫星之间也存在复杂的动力学耦合关系，而这种耦合关系决定了星座构型的整体变化趋势，同时也使得利用摄动补偿方法来提高星座的长期稳定性成为可能。摄动补偿方法通过对星座中卫星轨道的合理选择和参数调整来补偿某些可预测摄动引起的星座构型变化，从而达到保持星座整体构型的目的。当前，世界各国研究者在星座相对运动和受摄分析方面进行了大量的研究。研究表明，地球非球形摄动和卫星的初始位置偏差是导致星座构型破坏的主要原因。因此，选择具有较高稳定性的轨道，同时利用摄动力的补偿设计可以提高星座构型的稳定性。摄动补偿方法是对已经设计好的星座构型的卫星轨道参数的一种小量偏置手段，并不改变星座的基本结构。通过摄动补偿设计对轨道参数进行调整能够减缓摄动外力对构型的破坏作用，使星座构型在较长时间内保持在容许范围内，同时对星座入轨后偏离容许范围的卫星施加控制，维持星座的整体构型，从而降低星座构型控制代价，减少控制频率，提高星座构型的长期稳定性。


    ### 3. 星座备份与阶段部署


    在星座在轨运行期间，为提高整个星座的可靠性，保证星座的长期稳定运行，通常采用卫星冗余备份手段来保证服务质量，即预备一定数目的备份卫星，在必要时备份卫星能够及时接替故障卫星所承担的任务，使得星座具备承受少数卫星故障而不会出现大幅度性能下降的能力。例如，导航星座通常要求具有在两颗卫星失效的情况下仍然能够提供满足最低需求服务的能力。卫星星座运维机制必须制定某颗或某几颗卫星出现故障时的应对策略，主要有以下几种策略。


    #### 1）内在冗余策略


    在星座构型设计之初就将备份星配置在星座构型之内，使得星座正常运行时即存在卫星数量的冗余，这是目前星座项目中广泛采用的策略。


    #### 2）空间替补策略


    在星座建立时将若干颗备份星配置在星座之外的某个空间位置，当某一轨道面内的某颗卫星出现故障时，备份星通过机动变轨运动到故障星位置接替故障星工作。执行空间替补策略需要一定的时间与燃料消耗。


    #### 3）地面替补策略


    将备份星保存在地面，当星座中卫星发生在轨故障时再行发射。执行这一策略的一个重要前提是备份星应急发射运载工具具有实时可用性。当前小型固体运载火箭的出现为地面替补策略的实施提供了经济的解决方案。


    #### 4）软替换策略


    与上述几种策略不同，软替换策略并非硬件上增补或冗余一颗或几颗卫星，而是通过软件功能升级来弥补硬件的缺陷，从软件角度实现星座重构。针对星座中仍能正常工作的卫星升级软件功能或激发预存的备份软件，改变原有星座的功能模式。


    星座的部署不是一个短时期内能完成的任务，大多数星座都需要几年甚至十几年的时间才能够最终部署完成。因此，星座构型的分阶段部署，必须考虑星座每个阶段的系统性能，而不是以最终系统状态作为优化的唯一目标。星座的初始构型、中间构型和最终构型是相互牵连、相互制约的，在星座设计初期就应该予以充分考虑。应该在考虑工程实际约束的前提下最大化星座各阶段子星座的功能，使其在建设过程中实现台阶式的性能提升，使得在部署过程中，已经发射上天的卫星能够实现系统的部分功能，或者能够完全实现系统的功能只是未达到预期的水平要求。同时，卫星的分阶段部署，必须考虑卫星系统升级迭代的过程，每个阶段的卫星系统设计、资源配置、功能要求等很大可能性会发生变化。因此，在卫星系统设计之初就需要考虑硬件资源与软件功能的扩展性及可配置性。


    针对分阶段部署情况下的卫星系统升级迭代过程，为了保证新技术应用的可靠性，卫星星座建造者需要针对新技术实施在轨验证，验证通过之后才在卫星星座中推广应用。以Doves卫星星座为例，每一批次的发射任务均考虑卫星的冗余备份，选取部分卫星（Staging
    Sats）验证具有高风险性的试验技术，为后续批次的技术升级奠定基础。以星链卫星为例，新技术的验证（软件在轨升级）类似于Web Service开发模式，首先在一小部分在轨卫星上进行试验。若试验验证结果满足预期，则在在轨其他卫星及后续发射批次卫星中推广应用；若不满足预期，支持系统重试、回卷、停止等操作。如此，使得卫星系统具备快速迭代升级能力。


    ### 4. 智能控制需求


    由于卫星星座涉及卫星数量较多，少则几颗，多则上百颗甚至上千颗，针对这种情况仅依靠增加人力或提升地面运管系统能力是不够的。这存在两方面原因：一方面，卫星星座数量所带来的运管操作将呈现指数增长，人力增长无法满足需求；另一方面，虽然通过提升地面运管系统能力能够满足大批量卫星运管需求，但必须考虑紧急情况下，地面运管系统短期故障或失联可能导致卫星星座的工作异常、失控或失效。因此，提高卫星智能化、自主化水平，使卫星实现智能控制应为卫星星座设计的重要研究内容。卫星智能自主控制主要包括3个方面，即自主运行控制、自主碰撞规避、自主离轨。


    #### 1）自主运行控制


    星座自主运行是指卫星在不依赖地面设施的情况下，自主确定星座状态和维持星座构型，在轨完成飞行任务所要求的功能或操作。自主运行能够大大降低星座成本、减小系统风险。星座要实现自主运行首先要解决成员星的自主控制问题，由于卫星姿态控制及星务管理通常已实现自主控制，自主运行控制相关技术主要为自主规划与调度、自主导航、自主轨道控制等。


    ##### （1）自主规划与调度


    自主规划与调度是卫星自主决策的关键，也最能体现卫星系统的自主能力。卫星自主规划与调度的任务是根据卫星当前的资源状况、外部环境以及其他约束条件，选择各种动作并分配资源，将任务级操作分解成指令程序。


    ##### （2）自主导航


    自主导航是卫星/星座实现姿态轨道自主控制的前提和基础，为星座构型控制提供测量数据。对于导航星座来说，自主导航还肩负着为星座系统提供高精度广播星历的重任。


    ##### （3）自主轨道控制


    要使星座的几何构型在一定精度内保持不变，必须对卫星的轨道进行控制。自主轨道控制是基于自主导航的轨道控制，星上计算机依据自主导航系统提供的卫星运动参数，控制器给出控制指令，推进系统完成轨道机动，这就是卫星自主轨道控制的基本运作方式。


    以自主导航为例，目前应用较为广泛的星座自主导航方案包括天文导航、导航星导航以及星间相对观测导航等。由于星座中的卫星数目较多，单纯采用单颗卫星自主导航则会忽略星座中星间相对运动的信息。充分利用星间运动的相对运动规律，采用星间相对测量信息进行相对自主导航已逐渐成为研究的热点。


    美国的第三代GPS卫星BlockⅡR就是利用星间相对测量进行自主导航的一个具体应用，它具有交联测距和在轨处理导航数据的能力。各颗卫星使用星载处理器，计算导航参数的修正值，从而提供导航精度，增强自主生存能力。BlockⅡR能够在轨自主更新和精化GPS卫星的广播星历和星钟A系数，无需地面监控系统的干预。它能够自主运行180天做导航定位服务，且在第180天时，用户测距精度（URE）仍可达到±7.4
    m。因此，即使地面监控系统暂时毁坏，仍能维持高精度的GPS卫星导航定位，增强了GPS系统的抗毁能力。


    Galileo导航系统也曾提出过采用星间观测的自主导航方案。该方案运用星间测量和星地测量相结合进行处理，用于日常星历的修正，提高卫星预报星历和时钟的精度。通过地面仿真实验，用户测距误差可达到分米级（低轨星历数据刷新率15
    min，高轨2 h）。因此，对于利用星间测量的星座的相对定位方法不仅能够实现星座的自主生存，还能通过提高日常星历的精度来提高用户的定位精度，从而提升整个导航系统的性能。


    #### 2）自主碰撞规避


    由于近地空间“交通状况”日趋严峻，卫星发生碰撞的概率将大大增加，完全依靠地面系统监测来预测碰撞并预警、进行碰撞规避机动的模式将变得捉襟见肘。针对大批量卫星星座，由于卫星数量众多，很难完全由地面系统来负责碰撞监测以及规避机动等工作，只能依靠地面支持+卫星自主方式，使其具备自主碰撞规避能力，从而避免类似铱星33号卫星与宇宙2251卫星碰撞事故的再次发生。


    星链卫星配备自主碰撞规避系统，接收来自地面的空间碎片威胁信息数据，使用4个动量轮系统配合离子推进系统来实现自动规避空间碎片和其他航天器功能。这种自主规避防撞功能能够最大限度地降低人工出错的概率，让卫星在一个可靠的无碰撞的空间环境中稳定运行。


    地面系统预报星座卫星轨道，并检索空间目标数据库（在轨大约20000个目标），筛选潜在碰撞目标，计算碰撞概率，将高预警碰撞时刻和轨道控制上注卫星。卫星利用4个互相垂直的动量轮加速或减速运动改变卫星姿态，配合离子推进发动机抬高或降低卫星轨道，完成规避。规避完成后再次机动返回标称轨道。地面碰撞检测完全由计算机自动化完成，定时计算，自动上注，完成主动规避。


    #### 3）自主离轨


    通常，卫星星座的成员星建造成本与可靠性设计指标相对较低，则卫星在轨寿命较短，如果不对发生故障的失效卫星或寿命到期卫星进行离轨等任务后处置，则会形成太空垃圾，产生空间碎片，可能影响卫星星座自身的使用效能，同时会影响其他航天器运行安全。因此，为卫星星座设计高效且低廉的自主离轨手段将十分必要。


    对于星座中的每一颗卫星，由于星座整体功能的实现依赖于所有组网卫星的正常工作。因此，如果发现其中某颗卫星出现故障并已确定不能完全修复，应积极考虑予以替换。对于被替换下来的卫星，必须对其实施运行终止策略，使其脱离原来轨道直接下降进入大气层烧毁，或者转移到一条短寿命的轨道上去，以防止它与其他正常卫星碰撞和变成空中垃圾。


    ## 9.3 智能协同需求

    '
  trans: '

    随着导航卫星星间链路的实现，为长距离的远程卫星接力通信提供了可能。采用高速和精确指向的激光星间链路，卫星将提供更高速率的星间链路网络，实现大容量的星间信息传输，减轻地面跟踪、遥测和指令站的负担。激光通信系统尺寸、质量和功耗明显降低，抗电磁干扰能力、保密性强，其中核心技术是激光束的捕获-对准-跟踪技术。


    未来相干激光通信的典型通信速率为每秒 10 Gb 量级，与传统微波通信终端相比，激光终端体积小、质量轻，光学天线口径较小，整体成本降低，且性能大幅提升，是构建天基导航信息传输的理想方式。


    ## 3. 网络拓扑结构


    在卫星网络中，卫星节点通过星间链路连接起来，构成一个完整的卫星星座网络。一个完整的卫星星座可以由轨道平面间链路（Inter-Plane Links）和轨道平面内链路（Intra-Plane
    Links）构成一个具有规则网状网（Mesh）结构的卫星网络。卫星网络的拓扑结构定义为卫星网络中卫星节点与节点之间的相互连接关系。拓扑结构可以是如二维的网格规则的拓扑结构，也可以是如基于开关的不规则拓扑网络结构，目前正在使用的卫星网络大多数采用高度规则的拓扑结构。卫星网络的拓扑结构决定了每个卫星节点的所链接的星间链路数、消息或数据包所传输的路径。卫星网络设计的第一步是对卫星网络拓扑结构的研究。该研究对整个系统建成后的性能有着关键的影响，也是采用不同通信协议的基础。


    导航卫星网络一般采用网状网络拓扑结构。网状拓扑（Mesh）定义为邻近节点按照规则的平面图形互相连接而成的一种网状结构。网状拓扑结构是一种分布式网络拓扑结构。在这种网络拓扑结构中，由于每个节点都可以与网中的其他节点相连接，所以到每个节点都有充裕的冗余路径。网状拓扑结构的特点是具有较高的可靠性与高容错能力。由于其严格正交，因此可以用节点在二维空间中的坐标作为节点编号，网络路由简单。网状拓扑的优点：


    ①星间链路的冗余备份充分，系统可靠度高，可扩展性强；

    ②星间链路的传输带宽可以很高，数据的传输速度快，时延小，可以实现全球覆盖。


    网状拓扑的缺点主要是对卫星的数量要求较多，导致卫星网络的建造成本高。在网状卫星网络中，由于每个卫星节点都与其他节点直接相连，卫星网络中有充足的冗余路径，因此其是可靠性最高的网络拓扑结构，具有非常高的可靠性和高容错能力，是卫星网络的发展趋势。


    多层卫星网络应由包括数据交换的骨干网和各种接入网组成。由于 GEO 和 MEO 卫星的轨道高，其传输时延和链路损耗都比较大，因此在多层卫星网络中通常都是作为空间信息交换的骨干网，并且负责与关口站和大型终端通信，而
    LEO 卫星和 HAP 则可以为地面的移动小终端用户提供更好的服务。因此，在上述的多层卫星网络中，LEO 和 HAP 是作为地面用户的接入节点，并能够通过
    ISL 与骨干网进行数据交换。


    ## 4. 网络路由


    卫星网络由于其所处环境特殊、通信节点高速移动等特点，路由技术是其体系架构研究中的重点。路由技术研究是针对卫星网络特点开发和设计的各种有效路由算法和路由协议，为网络内部的端、节点或地面段用户之间提供可行的数据传输路径，尤其是经历多星多跳的远端用户之间的数据传送路径。早期的卫星通信系统一般以
    GEO 卫星为中继，采用弯管 BP 方式为地面两点之间的通信完成数据转发，数据传送形式固定，不存在路由问题。但是，在由多颗卫星组成的星座网络中，需要在源端卫星和目的端卫星之间的多条可达路径中，按照给定的链路代价度量选择最优路径。可将天地一体化路由分为以下
    3 个部分：


    ①上/下行链路（Up/Down Link，UDL）路由，负责各种用户到卫星网络的接入控制，并为用户选择源端卫星和目的端卫星（后统称为端卫星）。

    ②边界路由，负责卫星网络与地面网络之间的互操作和无缝融合，使端用户通过地面网络和卫星网络进行透明通信。

    ③空间段路由，即 ISL 网络路由，负责在卫星星座内部源端卫星和目的端卫星之间计算满足一定需求的最优路径。


    在上述 3 类路由中，UDL 路由相对比较简单。例如，可以根据单星覆盖时间长短或信号强弱为用户选择服务卫星并进行星间切换控制。对于边界路由，可以把空间段卫星网络看作地面网络的一个特殊子网，在负责接入到卫星网络的地面关口站和卫星网络中指定的边界路由器上运行改进的边界路由协议以实现异构网络的互联。


    在构建卫星网络的过程中，应集中解决 ISL 段路由问题。ISL 段路由实现端卫星之间的路由，属于点到点路由问题，也是天地一体化网络中最基本的路由问题，其技术是实现空间段中星与星互联的基础。卫星网络的特点使其既区别于传统地面固定网络，又区别于地面无线通信网络，从而使地面网络路由机制不能直接应用于卫星网络，而必须针对卫星网络特点研究和设计新的路由机制。卫星网络路由一般应具有以下特性：


    ①网络拓扑动态变化的适应性。路由算法应采取适当措施避免可能出现的路由环，或在出现路由环时能够及时有效地消除路由环带来的不利影响。

    ②抗毁性。当在两次路由更新间隔之间出现卫星节点失效或者链路故障时，路由算法应能够有效避免由此引起的数据丢失。

    ③高效性。路由算法或协议应尽量降低实施复杂性，以较小的开销获得较大的传输成功率或系统吞吐量。

    ④网络流量变化的适应性。路由算法应能采取措施支持流量负载均衡以避免网络出现链路拥塞或节点拥塞，或者在出现拥塞时能够及时有效地消除拥塞带来的不利影响。


    按照不同分类方式，卫星网络路由技术可归纳为集中式路由与分布式路由、面向连接路由与无连接路由、静态路由与动态路由、先验式（Proactive）路由与反应式（Reactive）路由以及混合式路由、单层卫星网络路由与多层卫星网络路由等。


    ## 9.2 自主运管需求


    ### 1. 运管系统架构


    作为卫星星座运行管理的重要支撑部分，运管系统架构设计至关重要，它对卫星星座的运行管理及维护升级产生根本性的影响。星座的卫星数目越来越多，依靠地面测控站进行卫星的定轨与跟踪将难以承受其高负荷的数据传输与处理压力。同时，卫星星座如果过分依赖地面站的测控，在地面站损毁的情况下，其正常运行将难以得到保证。因此，发展卫星星座系统的自主性成为星座运行管理的一个重要发展方向。运管系统逐渐向着自动化、智能化的方向发展。


    利用适用于卫星在轨运营的测运控一体化无人值守地面管理系统，实现自动化监控管理、无人值守、任务自动下发、卫星自动跟踪，完成卫星状态监控、业务数据自动收发、自动处理、自动分发等功能，满足多颗低轨商业卫星同时跟踪服务。针对卫星独特的运营模式，提高卫星在轨运行管理效率，减少卫星在轨管理成本，实现仅用一套地面设备就可实现多颗低轨卫星的测控和运控管理工作，并实时完成卫星测控、数传数据解析处理。


    低轨卫星的测控原理与高轨卫星相同，但由于其轨道周期短、速度快，对于地面测控站不是实时可见。因此，针对低轨卫星的测运控管理方式与地球同步轨道卫星有较大的区别。首先，由于其对于地面站不是一直可见，这就要求星上具有较高的自主能力，包括轨道测量、轨道确定、轨道调整、工作模式转换、卫星平台及载荷操作以及故障检测、隔离及恢复等；其次，由于低轨星座涉及多颗卫星及多个地面站协同工作，因此低轨星座测运控管理需要一套功能强大的任务调度软件，基于卫星的可见弧段及任务需求，实现资源的最优分配及调度。


    当前国内外的卫星星座运管系统存在诸多缺点：一是兼容性差。例如，用于导航定位的北斗卫星，与用于气象观测的风云卫星，它们所用的运管系统与运维团队都是完全独立的，无法由同一套系统完成运管任务。二是容量小。每个系统所支持的卫星只有几颗，很少有支持超过
    10 颗以上的系统。三是对于工作人员来说，存在操作复杂，界面不规范的问题，同时随着在轨卫星星座数量的逐年增多，卫星星座在轨测控长期管理面临诸多挑战，工作人员的业务量也会相应增多，需要智能化的系统来减轻工作人员的业务压力，减少不必要的工作。


    以 Doves 星座为例，Planet Lab 公司的飞行任务管理团队将重点放在星座常规操作的自动化工作，从而替代手动/人工处理流程，自动化系统也将不断升级迭代，平均
    24 h 至少收集一次所有卫星的健康数据；在轨及地面部分将通过基于“自制、灵活可扩展、微服务”的任务控制接口为上百颗卫星及广阔的地面天线接收站提供常规操作、调试操作、定制动作、实验及部署等操作。


    ### 2. 星座构型维持


    星座的建设目标在于通过卫星的数量优势来提高向地面提供服务的覆盖范围与覆盖时长。星座在设计之初就已确定运行构型，星座内所有卫星均应按照所设计的运行构型进行工作，共同维持卫星星座的构型稳定及服务连续。


    当发射数百颗卫星后，地面运维系统没有时间对每一颗卫星进行地面飞行控制，使其定位于星座的制定轨道位置；地面运维系统告知每一颗卫星在星座的位置，由卫星自主飞行控制至指定轨道位置；地面运维系统持续向星座中卫星更新通信量与卫星星座的变化情况，卫星自主做出相应动作调整。


    当前星座构型维持方法大致分为站位维持方法和摄动补偿方法两类。


    #### 1）站位维持方法


    维持星座构型通常采用站位维持的方法，即对卫星进行主动控制，将卫星的绝对或相对位置维持在设计位置。当卫星运行超出该允许漂移范围时，才对卫星进行控制。为了保持星座的长期稳定性和连续性，在星座设计时需要选择具有较好容错性和较大容许偏差量的星座构型，使得星座具有一定的降级运行能力，并且卫星偏离标称轨道一定范围时也不会影响星座的服务性能。星座构型保持是星座中所有卫星的整体控制，在控制时必须注意卫星之间完成任务的整体性和协同性，星座的轨道控制在控制参数、控制量和控制精度的要求上都发生了变化，因此必须从星座空间结构、任务需求、协同控制和性能影响等方面综合考虑。同时，星座构型保持控制时还应根据卫星的覆盖特性、过顶时间、最大不可视时间以及健康状况等信息确定具体的控制策略和控制方法。


    #### 2）摄动补偿方法


    通常认为，编队飞行的各卫星之间有动力学联系和约束条件；星座则以单颗卫星轨道运动为基础，星与星之间的动力学联系并不紧密。事实上，由于星座的特殊结构，使得卫星之间也存在复杂的动力学耦合关系，而这种耦合关系决定了星座构型的整体变化趋势，同时也使得利用摄动补偿方法来提高星座的长期稳定性成为可能。摄动补偿方法通过对星座中卫星轨道的合理选择和参数调整来补偿某些可预测摄动引起的星座构型变化，从而达到保持星座整体构型的目的。当前，世界各国研究者在星座相对运动和受摄分析方面进行了大量的研究。研究表明，地球非球形摄动和卫星的初始位置偏差是导致星座构型破坏的主要原因。因此，选择具有较高稳定性的轨道，同时利用摄动力的补偿设计可以提高星座构型的稳定性。摄动补偿方法是对已经设计好的星座构型的卫星轨道参数的一种小量偏置手段，并不改变星座的基本结构。通过摄动补偿设计对轨道参数进行调整能够减缓摄动外力对构型的破坏作用，使星座构型在较长时间内保持在容许范围内，同时对星座入轨后偏离容许范围的卫星施加控制，维持星座的整体构型，从而降低星座构型控制代价，减少控制频率，提高星座构型的长期稳定性。


    ### 3. 星座备份与阶段部署


    在星座在轨运行期间，为提高整个星座的可靠性，保证星座的长期稳定运行，通常采用卫星冗余备份手段来保证服务质量，即预备一定数目的备份卫星，在必要时备份卫星能够及时接替故障卫星所承担的任务，使得星座具备承受少数卫星故障而不会出现大幅度性能下降的能力。例如，导航星座通常要求具有在两颗卫星失效的情况下仍然能够提供满足最低需求服务的能力。卫星星座运维机制必须制定某颗或某几颗卫星出现故障时的应对策略，主要有以下几种策略。


    #### 1）内在冗余策略


    在星座构型设计之初就将备份星配置在星座构型之内，使得星座正常运行时即存在卫星数量的冗余，这是目前星座项目中广泛采用的策略。


    #### 2）空间替补策略


    在星座建立时将若干颗备份星配置在星座之外的某个空间位置，当某一轨道面内的某颗卫星出现故障时，备份星通过机动变轨运动到故障星位置接替故障星工作。执行空间替补策略需要一定的时间与燃料消耗。


    #### 3）地面替补策略


    将备份星保存在地面，当星座中卫星发生在轨故障时再行发射。执行这一策略的一个重要前提是备份星应急发射运载工具具有实时可用性。当前小型固体运载火箭的出现为地面替补策略的实施提供了经济的解决方案。


    #### 4）软替换策略


    与上述几种策略不同，软替换策略并非硬件上增补或冗余一颗或几颗卫星，而是通过软件功能升级来弥补硬件的缺陷，从软件角度实现星座重构。针对星座中仍能正常工作的卫星升级软件功能或激发预存的备份软件，改变原有星座的功能模式。


    星座的部署不是一个短时期内能完成的任务，大多数星座都需要几年甚至十几年的时间才能够最终部署完成。因此，星座构型的分阶段部署，必须考虑星座每个阶段的系统性能，而不是以最终系统状态作为优化的唯一目标。星座的初始构型、中间构型和最终构型是相互牵连、相互制约的，在星座设计初期就应该予以充分考虑。应该在考虑工程实际约束的前提下最大化星座各阶段子星座的功能，使其在建设过程中实现台阶式的性能提升，使得在部署过程中，已经发射上天的卫星能够实现系统的部分功能，或者能够完全实现系统的功能只是未达到预期的水平要求。同时，卫星的分阶段部署，必须考虑卫星系统升级迭代的过程，每个阶段的卫星系统设计、资源配置、功能要求等很大可能性会发生变化。因此，在卫星系统设计之初就需要考虑硬件资源与软件功能的扩展性及可配置性。


    针对分阶段部署情况下的卫星系统升级迭代过程，为了保证新技术应用的可靠性，卫星星座建造者需要针对新技术实施在轨验证，验证通过之后才在卫星星座中推广应用。以 Doves
    卫星星座为例，每一批次的发射任务均考虑卫星的冗余备份，选取部分卫星（Staging Sats）验证具有高风险性的试验技术，为后续批次的技术升级奠定基础。以星链卫星为例，新技术的验证（软件在轨升级）类似于
    Web Service 开发模式，首先在一小部分在轨卫星上进行试验。若试验验证结果满足预期，则在在轨其他卫星及后续发射批次卫星中推广应用；若不满足预期，支持系统重试、回卷、停止等操作。如此，使得卫星系统具备快速迭代升级能力。


    ### 4. 智能控制需求


    由于卫星星座涉及卫星数量较多，少则几颗，多则上百颗甚至上千颗，针对这种情况仅依靠增加人力或提升地面运管系统能力是不够的。这存在两方面原因：一方面，卫星星座数量所带来的运管操作将呈现指数增长，人力增长无法满足需求；另一方面，虽然通过提升地面运管系统能力能够满足大批量卫星运管需求，但必须考虑紧急情况下，地面运管系统短期故障或失联可能导致卫星星座的工作异常、失控或失效。因此，提高卫星智能化、自主化水平，使卫星实现智能控制应为卫星星座设计的重要研究内容。卫星智能自主控制主要包括
    3 个方面，即自主运行控制、自主碰撞规避、自主离轨。


    #### 1）自主运行控制


    星座自主运行是指卫星在不依赖地面设施的情况下，自主确定星座状态和维持星座构型，在轨完成飞行任务所要求的功能或操作。自主运行能够大大降低星座成本、减小系统风险。星座要实现自主运行首先要解决成员星的自主控制问题，由于卫星姿态控制及星务管理通常已实现自主控制，自主运行控制相关技术主要为自主规划与调度、自主导航、自主轨道控制等。


    ##### （1）自主规划与调度


    自主规划与调度是卫星自主决策的关键，也最能体现卫星系统的自主能力。卫星自主规划与调度的任务是根据卫星当前的资源状况、外部环境以及其他约束条件，选择各种动作并分配资源，将任务级操作分解成指令程序。


    ##### （2）自主导航


    自主导航是卫星/星座实现姿态轨道自主控制的前提和基础，为星座构型控制提供测量数据。对于导航星座来说，自主导航还肩负着为星座系统提供高精度广播星历的重任。


    ##### （3）自主轨道控制


    要使星座的几何构型在一定精度内保持不变，必须对卫星的轨道进行控制。自主轨道控制是基于自主导航的轨道控制，星上计算机依据自主导航系统提供的卫星运动参数，控制器给出控制指令，推进系统完成轨道机动，这就是卫星自主轨道控制的基本运作方式。


    以自主导航为例，目前应用较为广泛的星座自主导航方案包括天文导航、导航星导航以及星间相对观测导航等。由于星座中的卫星数目较多，单纯采用单颗卫星自主导航则会忽略星座中星间相对运动的信息。充分利用星间运动的相对运动规律，采用星间相对测量信息进行相对自主导航已逐渐成为研究的热点。


    美国的第三代 GPS 卫星 BlockⅡR 就是利用星间相对测量进行自主导航的一个具体应用，它具有交联测距和在轨处理导航数据的能力。各颗卫星使用星载处理器，计算导航参数的修正值，从而提供导航精度，增强自主生存能力。BlockⅡR
    能够在轨自主更新和精化 GPS 卫星的广播星历和星钟 A 系数，无需地面监控系统的干预。它能够自主运行 180 天做导航定位服务，且在第 180 天时，用户测距精度（URE）仍可达到±7.4
    m。因此，即使地面监控系统暂时毁坏，仍能维持高精度的 GPS 卫星导航定位，增强了 GPS 系统的抗毁能力。


    Galileo 导航系统也曾提出过采用星间观测的自主导航方案。该方案运用星间测量和星地测量相结合进行处理，用于日常星历的修正，提高卫星预报星历和时钟的精度。通过地面仿真实验，用户测距误差可达到分米级（低轨星历数据刷新率
    15 min，高轨 2 h）。因此，对于利用星间测量的星座的相对定位方法不仅能够实现星座的自主生存，还能通过提高日常星历的精度来提高用户的定位精度，从而提升整个导航系统的性能。


    #### 2）自主碰撞规避


    由于近地空间“交通状况”日趋严峻，卫星发生碰撞的概率将大大增加，完全依靠地面系统监测来预测碰撞并预警、进行碰撞规避机动的模式将变得捉襟见肘。针对大批量卫星星座，由于卫星数量众多，很难完全由地面系统来负责碰撞监测以及规避机动等工作，只能依靠地面支持+卫星自主方式，使其具备自主碰撞规避能力，从而避免类似铱星
    33 号卫星与宇宙 2251 卫星碰撞事故的再次发生。


    星链卫星配备自主碰撞规避系统，接收来自地面的空间碎片威胁信息数据，使用 4 个动量轮系统配合离子推进系统来实现自动规避空间碎片和其他航天器功能。这种自主规避防撞功能能够最大限度地降低人工出错的概率，让卫星在一个可靠的无碰撞的空间环境中稳定运行。


    地面系统预报星座卫星轨道，并检索空间目标数据库（在轨大约 20000 个目标），筛选潜在碰撞目标，计算碰撞概率，将高预警碰撞时刻和轨道控制上注卫星。卫星利用
    4 个互相垂直的动量轮加速或减速运动改变卫星姿态，配合离子推进发动机抬高或降低卫星轨道，完成规避。规避完成后再次机动返回标称轨道。地面碰撞检测完全由计算机自动化完成，定时计算，自动上注，完成主动规避。


    #### 3）自主离轨


    通常，卫星星座的成员星建造成本与可靠性设计指标相对较低，则卫星在轨寿命较短，如果不对发生故障的失效卫星或寿命到期卫星进行离轨等任务后处置，则会形成太空垃圾，产生空间碎片，可能影响卫星星座自身的使用效能，同时会影响其他航天器运行安全。因此，为卫星星座设计高效且低廉的自主离轨手段将十分必要。


    对于星座中的每一颗卫星，由于星座整体功能的实现依赖于所有组网卫星的正常工作。因此，如果发现其中某颗卫星出现故障并已确定不能完全修复，应积极考虑予以替换。对于被替换下来的卫星，必须对其实施运行终止策略，使其脱离原来轨道直接下降进入大气层烧毁，或者转移到一条短寿命的轨道上去，以防止它与其他正常卫星碰撞和变成空中垃圾。


    ## 9.3 智能协同需求

