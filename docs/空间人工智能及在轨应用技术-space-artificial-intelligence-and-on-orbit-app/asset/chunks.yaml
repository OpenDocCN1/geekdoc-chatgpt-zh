    #### 2）连通域标注

    二值连通域标记是数字图像处理的基本方法。它是目标分割、目标识别、图像语义理解等应用的重要基础，是一种经典的计算机视觉处理方法。目前，数字图像的二值连通域标记方法主要分为两种：一种是标号传播方法，如轮廓追迹法、混合对象标记法；另一种是标号等价对处理方法，如优化连通算法、游程优化算法、块决策树算法等。


    标号等价对处理方法的主要过程：将二值图像输入后，按照从左到右、从上到下的顺序，对图像进行逐个像素的扫描，获取游程的起始、结束位置以及等价对。基本流程采用基于游程的方法实现，主要分
    3 步：


    第一步，查找并记录团。逐行搜索示例图像，把每一行中连续的白色像素组成一个序列称为一个团（run），并记下它的团计数`num_run`、起点像素列坐标位置`start_run`、终点列坐标位置`end_run`以及它所在的行坐标位置`row_run`。


    如图 13-25 所示，第一行得到两个团，对应（团，团起始列坐标，团结束列坐标，团行坐标）：（1，2，3，1）和（2，6，6，1）；第二行得到两个团：（3，3，3，2）和（4，5，6，2）；第三行得到
    1 个团： （5，4，4，3）；第四行得到 3 个团：（6，1，2，4），（7，4，4，4）和（8，6，7，4）；第五行得到 1 个团（9，5，5，5）。全部图像遍历结束后，得到很多个团的位置信息。


    ![](img/txt017_39.jpg "pagenumber_ebook=296,pagenumber_book=285")

    图 13-25 查找并记录团过程


    第二步，标记团及生成等价对。对于除了第一行外的所有行里的团，如果它与前一行中的所有团都没有重合区域，则给它一个新的标号；如果它仅与上一行中一个团有重合区域，则将上一行的那个团的标号赋给它；如果它与上一行的两个以上的团有重叠区域，则给当前团赋一个相连团的最小标号，并将上一行的这几个团的标记写入等价对，说明它们属于一类。


    如图 13-26 所示，第一行记录的两个团标记为 1 和 2；第二行记录的两个团和上一行的团有重叠区域，因此用上一行的团标记，即 1 和 2；第三行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即
    1，然后将（1，2）写入等价对；第四行记录了 3 个团，第一个团与上一行没有重叠区域，为标记为 3，同理第二个团标记为 1，第三个团标记为 4；第五行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即
    1，然后将（1，4）写入等价对。该步处理后，将第一步记录的团号标记得到新标号，同时还得到一个等价对列表。


    ![](img/txt017_40.jpg "pagenumber_ebook=297,pagenumber_book=286")

    图 13-26 标记团及生成等价对过程


    第三步，等价对合并及生成最终的标记结果。将等价对转换为等价序列，每一个序列需要给一相同的标号，因为它们都是等价的。从 1 开始，给每个等价序列一个标号。遍历开始团的标记，查找等价序列，给予它们新的标记。将每个团的标号填入标记图像中，得到最终的标记结果。


    如图 13-27 所示，将等价对{（1，2），（1，4）}转化为等价列：1→2→4，其中团标记最大数`maxlabel`为 4。如图 13-27 所示，将
    1～4 个点都看成图的结点，而等价对（1，2）说明结点 1 与结点 2 之间有通路，而且形成的图是无向图，即（1，2）其实包含了（2，1）。因此，需要遍历图，找出其中的所有连通图，因而采用图像深入优先遍历的原理，进行等价序列的查找。从结点
    1 开始，它有两个路径 1→2，1→4。2 和 4 后面都没有路径，最后只剩下 3，它没有在等价对里出现过，所以单独形成一个序列。


    ![](img/txt017_41.jpg "pagenumber_ebook=297,pagenumber_book=286")

    图 13-27 等价对遍历图 1


