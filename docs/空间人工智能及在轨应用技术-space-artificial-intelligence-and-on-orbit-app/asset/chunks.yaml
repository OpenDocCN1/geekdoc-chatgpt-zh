    13.2.2　空间碎片目标在轨监测方法


    1.空间碎片目标检测方法


    1）空间碎片目标成像特性分析


    星图主要由恒星、空间碎片目标和深空背景构成。星图的成像特点是在暗背景下离散分布着近似于高斯分布的点状光斑，同时星图中还夹杂着一定程度的背景噪声，并且噪声成均匀分布。


    （1）恒星目标成像特性。


    恒星是星图的重要组成部分。恒星在星图中为点状，受成像条件的影响，恒星表现为向四周弥散的一个近似对称的高斯分布的亮斑。点源成像的光度分布函数又称为点扩散函数。点扩散函数对图像的作用在数学上可以表示为点扩散函数与图像的卷积。由于点扩散函数的不确定性，恒星亮斑包含的像素数从几个像素到几十个像素不等。在星图中，恒星成像特征与动目标的成像特征有很强的相似性，都表现为近高斯分布的亮斑，因此严重影响星图目标监测和识别的效果。


    （2）空间碎片目标成像特性。


    空间碎片目标在星图上表现为点状分布的小目标，一般占据一个或几个像素，没有明显的几何、结构信息、纹理信息等。同时，由于空间目标的运动特性，空间碎片目标在序列星图中成像亮度不稳定。影响目标亮度的因素包括空间碎片目标的尺寸、目标与传感器的距离、目标材料的反射率、太阳入射角度以及观测条件等。天基光学望远镜探测的是空间碎片目标反射的太阳光，因此空间碎片目标来源主要是太阳辐射的可见光谱段的能量。由于不同材质、空间碎片目标的不同部分以及空间结构都会导致反射率的不同，因此在星图序列中，空间目标的亮度存在一定程度的差异。


    空间碎片目标和恒星在空域上成像相似，都表现为单帧图像上的孤立亮斑，且形状相似。在天基天文光电观测系统中，由于其口径小，视场大，探测距离远，受传感器成像分辨率的限制，空间目标在CCD焦平面上几乎为点目标成像。但由于光学系统受点扩散效应的影响，空间目标的能量弥散到相邻的多个像元上。一般情况下，可对空间碎片目标构建二维高斯拟合模型，此时点目标的能量密度在星图上的分布函数可以表示为


