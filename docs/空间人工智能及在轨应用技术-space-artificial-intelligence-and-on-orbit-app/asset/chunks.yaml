    （2）正确率。

    为了验证算法的检测性能，采用下面两个评价指标对算法进行定量评价：一是查全率（`Recall`），衡量检测的完整程度；二是查准率（`Precision`），衡量准确查找任务目标的能力。这两个指标定义如下：

