    2）空间碎片目标检测算法


    根据空间碎片目标的成像特性，设计了一种空间碎片目标在轨实时检测算法，具体流程如图13-40所示。


    （1）数据预处理。


    星图中，暗弱小目标淹没在背景噪声中，通过顶帽变换等数据预处理，达到抑制背景噪声，凸显暗弱目标，便于后续算法提取暗弱小目标的目的。其中，顶帽变换主要由1组窗大小为29×29和5×5的膨胀和腐蚀运算组成。


    ![](images/txt017_60.jpg "pagenumber_ebook=311,pagenumber_book=300")


    图13-39　恒星和空间目标成像灰度分布图


    （a）恒星；（b）空间目标


    ![](images/txt017_61.jpg "pagenumber_ebook=311,pagenumber_book=300")


    图13-40　空间碎片目标检测算法流程


    （2）疑似目标提取。


    根据目标特性分析可知，空间目标中心点具有高于背景并且为局部极大值的特性。针对该特性，设定合适的窗并利用图像形态学里的膨胀操作来搜索局部最大值。若局部极值点大于高阈值则认定为疑似强目标点；若高于低阈值但低于高阈值则认定为疑似弱目标点。


    （3）疑似目标确认。


    对提取出的疑似目标点中心，需要判断其是否为目标。以疑似目标中心点为中心，动态设定尺度来确定窗以及核函数大小。对窗内的灰度值进行归一化处理以消除光照变化造成的影响，对归一化后的窗函数以及核函数进行卷积运算，若响应值大于预设阈值并且大于之前尺寸下的计算结果，则更新该点的尺寸以及响应值信息。通过恒星位置以及目标轨迹可以剔除恒星、背景噪声等干扰项，具体实施方法介绍如下。


    ①核函数设计。相较于直接的二值化处理，设计合适的核函数，能够在保证目标灰度信息的情况下有效地确定目标的中心及边界。从之前的分析可以知道目标呈近似高斯分布，因此针对性地设计核函数，如图13-41所示，具体如式（13-8）所示。


    ![](images/txt017_62.jpg "pagenumber_ebook=312,pagenumber_book=301")


    图13-41　核函数


    ![](images/txt017_63.jpg "pagenumber_ebook=312,pagenumber_book=301")


    式（13-8）中核函数大小为M×N，在疑似目标附近选取大小为M×N的图像块，σ为该图像块的标准差；xcenter\=（N+1）/2；x=1，2，…，M；y=1，2，…，N。该核函数具有如下特性：一是该核xcenter\=（M+1）/2函数与高斯分布相近，因此图像与该核函数的卷积即可判断图像与高斯分布的相似性；二是核函数的尺寸由σ值确定，即距矩阵中心2σ内值为负，2σ～3σ值为正，3σ外值为负。


    ②恒星目标剔除。由于检测到的目标包含目标以及恒星，为了减少后续轨迹匹配的运算量，将历史中出现过疑似目标的位置进行存储，若下一帧图像中的疑似目标在这些位置出现时，则认为是恒星，可将其从检测结果中剔除，如图13-42和图13-43所示。


