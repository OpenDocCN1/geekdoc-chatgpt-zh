    ### 4. 深度学习通用加速器架构设计

    上述加速器主要针对`VGG`及以`VGG`为基础的后续系列的深度学习网络模型，是一个相对通用的加速器。人工智能技术处于一个高速发展时期，各种网络层出不穷，也是各有特点。因此，设计针对深度学习的通用加速器将会很有必要。


