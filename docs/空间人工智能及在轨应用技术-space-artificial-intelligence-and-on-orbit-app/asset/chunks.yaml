- raw: '曼德拉2号卫星有两颗，于2021年6月30日成功发射，并于POET搭载有效载荷原型，在与运载火箭分离后，两颗曼德拉2号卫星逐渐分离，最终能够支持在2
    400 km的范围内进行试验。曼德拉2号的任务是为包括DARPA、美国太空发展局、美国空军研究实验室在内的政府或军队证明先进激光通信技术的可行性，具体实验任务主要为收集低轨卫星上的光通信终端（OCT）性能数据，与POET有效载荷一起演示在轨数据融合，证明未来发展所需的核心能力。在进入轨道后，POET将演示第三方多智能（multi-INT）数据融合软件应用程序在卫星模块化和可升级任务软件套件中的集成应用。同时，美军将在曼德拉2号上评估验证OCT建立和维护高速通信链路的瞄准、捕获和跟踪算法。


    5.2.2　国内发展现状


    我国卫星星座化发展与国外几乎同步，提出了卫星互联网等多个星座系统。采用智能组网与协同技术，实现星座高效管理与智能重构，提升体系应用效能。我国高度关注低轨卫星互联网发展，国外系统提出伊始即开始跟踪研究，系统建设的主要特点是在企业多头分散发展基础上，政府主导统筹推进。


    如图5-3所示，国家卫星互联网工程2019年年底启动试验试用系统研制工作，目前正在开展组网系统优化设计，将建设由空间组网的约576颗卫星构成的星座，星地协同为全球用户提供宽带互联网接入服务，兼顾满足部分特殊应用需求。国家“科技创新2030重大项目”天地一体化信息网络重大工程包括不少于120个低轨卫星，2019年发射首批两颗“天象”试验卫星，其试验试用系统第一阶段正在开展研制。


    ![](images/txt007_8.jpg "pagenumber_ebook=107,pagenumber_book=96")


    图5-3　国内星座发展状况


    1.天地一体化信息网络重大工程


    天地一体化信息网络按照“天基组网、地网跨代、天地互联”的思路，以地面网络为基础，以空间网络为延伸，覆盖太空、空中、陆地、海洋等自然空间，为天基、陆基、海基等各类用户活动提供信息保障，将人类的网络空间提升到一个新的维度。


    1）构型设计


    在网络建设方面，构建高轨、低轨、临近空间、地面网络互联融合、覆盖全球的一张天地一体化信息网络。在应用服务方面，实现全球商业化运营，提供全时全域信息服务能力，形成“天地一体化信息网络+”产业新形态。


    地面信息港是重大项目应用服务的重要载体，是空间信息服务的枢纽，汇聚多源异构时空数据，有机融合“网络+遥感/地理信息/定位导航”等信息，衔接信息资源与用户需求，提供数据处理与加工环境，基于安全可靠、自主可控的软硬件设施，提供工厂、托管、仓储等多种信息服务模式，聚集行业专业力量，集中行业信息应用产品。地面信息港更像是一个舞台、一个窗口，借天地一体化信息网络通联天地、通达四方，将成为信息产品、人才和相关产业的聚集地。


    2）功能设计


    天地一体化信息网络地面信息港，重点建设“1+1+N”工程，包括建设1套安全可靠的公共基础设施，打造1个兼容共享的服务开放平台，形成N个智能高效的行业典型应用。


    建设安全可靠的公共基础设施。打造自主可控的云计算存储环境（分布式超算中心+数据中心），为政府各委办局、企事业单位及个人提供个性化、定制化的时空数据处理的计算和存储服务。政府单位和企业个人将可以像日常生活中用水用电一样，按需使用地面信息港的计算、存储服务。同时，这套基础设施将提供比行业更高级别的安全保密等级，平台自主可控，基本上免去国家信息泄露、个人隐私曝光的困扰。


    打造兼容共享的开放服务平台。服务平台将在基础设施的基础上，搭建一个集时空信息的原始数据、处理算法、通用产品、专业产品、开发环境于一身的平台，致力于打通空间信息服务从数据源头到应用产品的全链条。除提供广泛的专业数据、齐全信息产品服务，更为广大时空信息业内人士提供一个开放的研发环境，打造一个集贤汇智的社区，共同推进平台进步乃至时空信息服务产业发展。


    形成多个智能高效的典型应用。以地面信息港为载体，整合在专业通信、卫星导航、遥感测绘等领域各优势单位的技术研发能力与权威部门提供的核心数据资源，面向交通、旅游、环保、民生、农业、应急等需求，为各类用户提供基于天地一体化信息网络的时空大数据信息服务。


    2\. “鸿雁”项目


    “鸿雁”系统是中国航天科技集团公司提出的一个通信星座，可为用户提供全球实时数据通信和综合信息服务。


    1）构型设计


    “鸿雁”全球导航增强系统由空间段、地面段及用户段组成。空间段主要包括GNSS系统和“鸿雁”卫星星座；地面系统主要由监测站、中心处理站、信息传输与分发网络组成；用户段为联合接收导航卫星及“鸿雁”卫星进行定位的用户接收机。采用四大GNSS系统双频监测，全球稀疏地面监测站，播发GPPP增强信息和双频增强信号实现精度、完好性、可用性和定位实时性增强。


    系统工作原理与流程：“鸿雁”卫星通过配置高精度GNSS监测接收机，生成驯服到GNSS系统的时频基准信号（10MHz和1pps），卫星通信载荷基于该时频信号产生测量通信一体化信号向用户播发。同时，监测接收机观测数据通过星间链路下传到境内中心处理站，中心处理站利用地面监测站联合“鸿雁”卫星移动监测站观测数据生成精密星历，通过馈电链路和星间链路上传至卫星，然后通过用户通信链路广播。用户通过接收卫星通信链路播发的测量通信一体化信号实现精密星历的获取，实现全球精密单点定位。


    2）功能设计


    低轨导航增强系统相比当前的SBAS（Satellite-Based Augmentation System）系统是一种全新的技术体制，是在低轨通信星座蓬勃发展的历史机遇背景下提出的。因此，除了导航增强技术相关的关键技术，如何与低轨通信星座融合将是系统成功运行的关键所在。


    ①区域监测站条件下的低轨卫星与中高轨导航卫星联合定轨。考虑到我国地基监测站无法全球均匀布设的现实条件，需要在低轨卫星上配置监测接收机，并联合地面区域监测站实现天地一体联合监测，用于GNSS卫星和低轨卫星的精密轨道与钟差确定。需要设计并选择合理分布的区域地面跟踪站网，综合考虑计算负荷、低轨星座的构型等要求，优化参与联合定轨的低轨卫星。融合区域地面跟踪网和星基跟踪站等多源观测数据，弥补地面跟踪站的不足，改善整个跟踪网的图形结构，实现不同轨道高度卫星群精密轨道的快速确定以满足实时应用的需求，从而丰富并发展导航卫星与低轨卫星精密联合定轨的理论与方法，生成厘米级实时精密轨道与钟差改正数。


    ②低轨星座增强北斗/GNSS实时精密单点定位。由于低轨卫星观测弧段短、运行速度快、大气阻力影响大，地面站所接收到的低轨卫星观测数据中周跳较多、粗差影响大。因此，探究适用于低轨卫星数据预处理与质量控制方法是实现稳健可靠的精密定位服务的关键和首要环节，旨在为后续高精度数据处理提供“干净”的观测资料。多源异构星座的融合，既带来了成倍增长的观测值，也产生了各种各样的偏差，如码间、频间、系统间等偏差。在确定了低轨增强北斗/GNSS精密定位数学模型后，就需要对观测模型中各偏差参数的可估条件进行分析。在多种星座融合的条件下，进一步分析低轨卫星和导航卫星观测值中的各类偏差的时域与空域特性，帮助确定精密定位中这些偏差的随机模型，如是采用常数估计，还是采用白噪声、随机游走等估计，以及这些偏差估计时约束的松紧程度，这些均影响精密定位的估计结果。联合低轨卫星增强GNSS精密定位时，处理高维及低轨卫星高动态、短弧段条件下的模糊度快速解算问题是待突破的难点。最终，需论证和评估低轨星座增强北斗/GNSS实时精密单点定位性能。


    ③卫星导航与卫星移动通信深度融合。频率资源是低轨通信星座最核心的资源，移动通信下行采用L频段播发，导航增强应充分与移动通信频段兼容以降低成本及风险，因此卫星导航与卫星移动通信深度融合成为系统建设的关键。移动通信卫星一般采用多波束天线对地形成多个蜂窝小区，并采用频率多色复用技术提升用户容量，因此需突破基于多波束天线的通导信号一体化设计，充分利用通信频率资源和功率资源，在L频段上实现通信和导航信号一体播发。


    ④小型化、轻量化、低功耗和低成本导航增强载荷。低轨通信卫星平台小，质量、功耗和成本均需要精细控制，因此在进行载荷设计时要面向低体积质量功耗（SWAP）进行设计，“鸿雁”卫星在进行导航增强载荷设计时，采用高精度载荷硬件架构技术+片上系统芯片技术+可重构软件系统技术，实现高精度时空基准、载荷小型化低功耗，降低成本，采用软件定义载荷技术，实现在轨维护和升级扩展。


    3）特性指标


    实时高精度PNT、安全PNT。用户接收GNSS/LEO信号实现全球动态分米级、静态厘米级的GPPP，收敛时间小于1 min；独立接收LEO星座信号实现导航备份，增强复杂地形环境和复杂电磁环境下的导航服务能力；充分利用通信频率资源和功率资源，在L频段上实现通信和导航信号一体播发。


    5.3　空间智能组网与协同关键技术


    国内外卫星星座建设逐步发展。目前已经公布的国外星座计划有14项：美国9项，俄罗斯、加拿大、印度、韩国、荷兰各1项。2020年5月26日美国FCC新一轮准入申报的NGSO星座卫星总数达到81
    195颗。2006年沈荣骏院士首先提出了我国天地一体化网络的概念和总体架构。2016年，中国已在“十三五”规划中将“天地一体化信息网络”纳入国家“科技创新2030重大项目”。中国航天科技和中国航天科工两大集团都启动了各自的低轨通信项目“鸿雁星座”和“虹云工程”，两大工程的首颗试验卫星均在2018年12月发射升空。2020年4月20日，国家发改委首次将卫星互联网列入“新基建”。目前正依托卫星互联网项目构建更大规模的自主低轨卫星网络。随着巨星座发展和空间智能组网技术的爆发式发展，近年来相关领域和专业的研究日新月异。


    5.3.1　空间网络架构设计


    1.星座设计与部署


    得益于3GPP和各卫星公司的共同推动，密集低轨卫星星座在无线通信中发挥着越来越重要的作用。密集低轨卫星星座可以提供高回程容量、全球无缝通信以及更加灵活的网络接入服务。在此背景下，Deng
    R等人研究了超密集低地球轨道星座的设计问题，即考虑低轨卫星部署开销及卫星高移动性，在满足用户终端回程需求的前提下，部署多少颗卫星能够满足全球通信需求？给定覆盖率，如何以最小卫星数量部署星座？针对以上问题，首先计算每个用户终端的平均回程容量、每个用户终端需要被覆盖的最小卫星数，并根据以上数据计算出保证全球最少卫星数覆盖的初始星座部署方案。在完成初始星座部署的基础上，通过三维星座优化算法，以实现全球无缝覆盖和用户终端的总回程要求为优化指标，实现对于任何给定的覆盖率要求，得到相应的优化低地轨道卫星星座。


    2.基于SDN/NFV的卫星网络架构


    超大型卫星星座需要高效的网络控制来协调大规模的网络节点，确保未来空间无线通信网络运行和服务的有效性和可靠性。针对天地一体化网络（STIN）的资源利用率、灵活可配置性、高效网络管理、星地高效合作等问题，Tang
    F.提出了一种具有高效网络管理能力的基于SDN的星地综合网络体系结构。将控制器和被管理交换机部署在同一个星座中，从而显著降低了控制开销，控制域拓扑保持相对稳定。在此架构下，研究了一种自适应星地协同传输方法，优化目标为最大化系统吞吐量，并提出了DEEPER算法求解上述问题，在多个卫星地面路径之间动态分配流量，适应动态网络环境和工作负载，显著提高星地网络的传输能力和资源利用率。仿真结果表明，DEEPER在网络吞吐量、端到端延迟、传输质量和负载平衡方面优于基线算法。


    基于SDN的低轨卫星网络具有灵活的功能配置和高效的资源管理能力。然而，现有的控制器布置方案并不适用于具有高度动态拓扑结构和随机波动负载的低轨卫星网络。Chen
    L等人研究了在卫星网络拓扑及网络负载动态变化下，低开销、自适应的控制器布置及负载分配问题。


    现有的卫星通信系统受到传统设计的影响，如配置缓慢、流量工程不灵活、无法实现细粒度QoS保障等。针对以上问题，Li T等人提出了一个基于SDN和NFV的天地融合卫星通信框架SERvICE。此框架部署在GEO-MEO-LEO三层卫星网络及地面骨干网和数据中心中，包含管理、控制和转发3个功能平面，采用SDN分离每个卫星的数据面和控制面，利用集中控制简化卫星的任务处理；采用NFV来创建基于虚拟机的卫星NSF。同时，Li
    T等人提出了两种启发式算法，即面向服务质量的卫星路由（QSR）算法和面向服务质量的带宽分配（QBA）算法，以保证多个用户的服务质量要求。


    Zhang Z等人提出了一种新颖的卫星网络控制架构Poster，以支持卫星网络的SDN/NFV功能。架构包括实体部分和覆盖部分，实体部分依托实体的单层LEO卫星网络，交替部署控制节点和数据节点在同一轨道上，实现控制转发及数据交换；覆盖部分由实体部分抽象而成，将控制节点和数据节点抽象为两个平面，构成虚拟控制覆盖网络和虚拟数据覆盖网络。由于实体部分控制节点和相应的数据节点在同一轨道面，屏蔽了拓扑变化的动态性，使得控制节点和数据节点间的关系相对稳定。


    3.与5G融合的卫星网络架构


    为了支持无线设备和应用的爆炸性增长，需要为未来的有线系统开发各种接入技术，以便在广大地区提供可靠的数据服务。为应对上述挑战，当前卫星网络与5G融合已成为一种趋势，然而卫星网络的高移动性、高故障率、在外国容易受到攻击等特性，对卫星网络与5G融合提出了挑战。在此背景下，是否要将5G核心网功能放在低轨卫星上、将哪些核心网功能放在低轨卫星上，需要仔细衡量。Li
    Y等人首先在不同星座配置下，采用多种核心网功能放置方案，通过大量仿真比较了不同放置方案的优缺点；其次，设计了卫星无状态移动核心网架构SpaceCore，将状态与核心网功能解耦，通过地理空间寻址来简化位置状态，通过用地理标签标识空间服务区来消除卫星移动中不必要的状态迁移，通过设备即储存器来本地化状态检索。最后开发了SpaceCore原型，从信令时延、切换转接、用户层性能、面向攻击或故障的可靠性方面验证了SpaceCore方案的优势。


    4.基于CDN的卫星网络架构


    虽然当前互联网内容提供商能够利用基于云的内容交付/分发网络（CDN）提供具有高可用性和低延迟的广域数据访问服务，但由于地面云基础设施的部署不足，大量用户仍然面临较高的内容访问延迟。Lai
    Z提出了一个基于低轨卫星网络的内容分发架构StarFront，以实现全球任意地方的低内容访问延迟。具体而言，作者首先设计了基于低轨卫星的CDN架构，给出了3种内容获取方案；其次，作者建立了联合内容放置及分配问题，输入条件为动态网络拓扑结构、负载情况、卫星/云运营商的定价政策，以内容分发的访问延迟为优化目标，在低轨卫星或地面云上动态放置缓存副本，动态地将用户请求分配给适当的缓存服务器。仿真结果表明，能够有效地降低全球内容访问延迟，并且在典型CDN流量下实现可接受的运营开销。


    5.3.2　空间节点路由设计


    1.基本路由算法


    1）面向提高计算效率的路由算法


    随着卫星数量的增加，卫星网络的拓扑结构变化越来越快，路由计算变得越来越困难。如果计算所需路径的时间过长，卫星网络的拓扑结构会发生变化，传输的数据包可能无法找到正确的路径。如果路由更新时间过长，需要重传报文，会导致端到端延迟和丢包率增高。因此，在路由发现过程中，路由算法的效率要尽可能高，才能更好地适应LEO卫星通信系统拓扑结构快速变化的要求。Jia
    M等人设计了一种基于虚拟拓扑思想的路由算法，在对每个时间片内的静态拓扑进行路由时，链路开销可以是时延或跳数引入深度优先搜索（Deep-First-Search，DFS）算法和Dijkstra算法，并将它们结合在一起，提高计算效率和计算结果的可靠性。


    随着巨型星座的发展，路由转发表的大小越来越大，这将导致大的存储空间需求、Dijkstra算法的执行时间长以及表查找速度慢等问题。为了解决以上问题，Zhang
    S等人基于两层路由结构，提出了两种新的稳定路由算法。第一种是延迟有界路由（DBR）。其关键思想是，如果找到了新的最短路径，但当前路径仍然可以到达目的地，则将抑制即将发生的路由更改，除非网络延迟将大于预定义的延迟界限。与基于目的地的最短路径路由不同，DBR是基于流的，因此转发表必须为每个源-目的地对包含一个条目。为了减少转发表的大小，还设计了一种基于目的地的稳定路由算法，称为延迟感知路由（DAR）。例如，利用中断频率来测量链路稳定性，然后将路径稳定性/成本定义为所有链路成本之和。仿真结果表明，DBR和DAR都能够实现更小的延迟抖动和更少的路由变化。


    2）面向卫星拓扑动态性的路由算法


    传统的低轨卫星网络最短路径算法基于快照下的链路时延来计算最佳路由，然而实际的链路传播时延是时刻变化的，传统路由算法无法基于这种真实情况做最佳的路由决策，且传统算法需要进行大量计算，占用大量资源。因此，Geng
    S等人提出了一种称为延迟排队图评估和审查技术最小路径集（DQ-GERT-MPS）的最优延迟路由算法。具体而言，首先构建延迟排队图（DQ-GERT），由有向边和弧来表示时延的变化和时延大小；其次初始化DQ-GERT，得知所有链路的处理延迟、排队延迟和传播延迟；最后取得满足约束条件的全部路径作为候选路径集，并对每条候选路径模拟服务过程1000次，取时延平均值和标准差指标最优的路径，作为最终的最佳路由。


    低轨卫星的运动速度较快，且星地链路切换频繁，单颗卫星只能为用户提供几分钟的通信窗口。因此，有必要基于低轨卫星轨道制定合适的路由策略，以确保通信目标通过及时的链路切换始终保持良好的通信质量。Wang
    F等人提出了一种自适应的路由方法。首先，设计了基于SDN的卫星网络架构。GEO为顶级控制卫星，负责计算最佳通信链路和资源调度；MEO被设计为辅助路径查找卫星，帮助GEO收集关于地面目标和目标附近的低轨卫星的信息；LEO被设计为底层转发卫星，仅负责接收来自GEO的命令并承载数据转发功能。其次，改进Dijkstra算法来计算最短路径，由于低轨卫星星座的复杂拓扑结构，在寻找路径时，不需要对附近所有节点执行遍历距离计算，所以添加一些约束，将搜索范围限制为当前卫星的同一轨道和附近两个轨道上的卫星，并将当前卫星和同一轨道内的卫星之间的距离设置为最大搜索距离。搜索最佳通信路径时，控制器计算最佳的k条路径。当通信链路需要切换时，控制器可以直接从替代路径中选择当前最佳通信链路，大大减小了控制器的计算时间，并进一步减小了终端之间的通信延迟。


    低轨卫星网络具有卫星数量多、轨道周期短、拓扑动态性强、链路切换频繁等特点。如何设计可靠、高效和稳健的路由策略是保证可靠数据传输的首要任务。基于软件定义网络的空地一体网络（STIN）将所有数据收集到地面中心处理，浪费了大量的网络资源，因此Li
    X等人以传输成本最小为目标，研究了动态异构STIN中如何传输多源数据以及在何处联合处理各子任务。为了获得全局最优的结果，联合讨论了路由和任务布置问题。一方面，数据处理的收益与向计算节点传输数据的开销之间存在权衡；另一方面，由于数据依赖，不同数据传输路径的交叉会对可选任务的布置产生较大影响。同时，随着卫星的移动，需要同时考虑拓扑和资源的变化。'
