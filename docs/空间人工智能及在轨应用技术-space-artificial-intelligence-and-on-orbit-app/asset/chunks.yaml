    在线性不可分情况下，引入误差带宽和惩罚函数，构造并求解约束最优化问题：


    ![](img/txt016_8.jpg "pagenumber_ebook=212,pagenumber_book=201")


    式中，`ω`是分类向量；`b`是常数；`ξi`是样本点的松弛变量；`C`是对松弛变量的惩罚系数；`φ(xi)`是将原始特征值映射到高维空间的核函数。


    `SVM`的核心问题是选取合适的核函数，将低维空间的原始特征映射到高维空间。


    ## 12.1.3 回归算法


    在大部分机器学习课程中，回归算法都是介绍的第一个算法。原因有两个：一是回归算法比较简单，介绍它可以让人平滑地从统计学迁移到机器学习中；二是回归算法是后面若干强大算法的基石，如果不理解回归算法，就无法学习那些强大的算法。


    回归算法有两个重要的子类，即线性回归和逻辑回归。


    线性回归就是如何拟合出一条直线最佳匹配所有的数据。一般使用“最小二乘法”来求解。“最小二乘法”的思想：假设我们拟合出的直线代表数据的真实值，而观测到的数据代表拥有误差的值；为了尽可能减小误差的影响，需要求解一条直线使所有误差的平方和最小；最小二乘法将最优问题转化为求函数极值问题。函数极值在数学上我们一般会采用求导数为
    0 的方法。但这种做法并不适合计算机，可能求解不出来，也可能计算量太大。


    计算机科学界专门有一个学科叫“数值计算”，专门用来提升计算机进行各类计算时的准确性和效率问题。例如，著名的“梯度下降法”以及“牛顿法”就是数值计算中的经典算法，也非常适合来处理求解函数极值的问题。梯度下降法是解决回归模型中最简单且有效的方法之一。从严格意义上来说，由于神经网络和推荐算法中都有线性回归的因子，因此梯度下降法在后面的算法实现中也有应用。


    逻辑回归是一种与线性回归非常类似的算法。但是，从本质上来讲，线性回归处理的问题类型与逻辑回归不一致。线性回归处理的是数值问题，也就是最后预测出的结果是数字，如房价；逻辑回归属于分类算法，也就是说，逻辑回归预测结果是离散的分类，如判断这封邮件是否是垃圾邮件，以及用户是否会点击此广告等。


    实现方面的话，逻辑回归只是对线性回归的计算结果加上了一个`Sigmoid`函数，将数值结果转化为了 0 到 1 之间的概率（`Sigmoid`函数的图像一般来说并不直观，你只需要理解数值越大，函数越逼近
    1，而数值越小，函数越逼近 0），接着我们根据这个概率可以做预测，如概率大于 0.5，则这封邮件就是垃圾邮件，或者肿瘤是否是恶性的等。从直观上来说，逻辑回归是画出了一条分类线。


    逻辑回归算法划出的分类线基本都是线性的（也有划出非线性分类线的逻辑回归，不过那样的模型在处理数据量较大的时候效率会很低），这意味着当两类之间的界线不是线性时，逻辑回归的表达能力就不足。


    ## 12.1.4 深度学习算法


    深度学习也称为深度神经网络（`Deep Neural Networks`，`DNN`），源于人工神经网络，于 20 世纪 60 年代被提出，经历了识别数字的神经网（`LeNET`，1990
    年）、浅层神经网硬件出现（`Intel ETANN`，20 世纪 90 年代）、深度置信神经网络的实验证明（Hinton 等，2006 年）、深度学习语音识别突破性进展（2011
    年）、`DNN`加速器研究兴起（`Neuflow`、`DianNao`等，2014 年）等发展阶段，目前已成功解决了传统机器学习所面临的数据量获取问题、局部极值问题、梯度弥散问题等，在图像分类、人脸识别、文字识别、机器人等领域取得突破性应用，同时激发了`DNN`在各领域应用呈爆炸性增长。此外，高性能计算图形加速卡（`GPU`）技术的发展，极佳地匹配神经网络计算所需要的要求，即高并行性，高存储，没有太多的控制需求。至此，深度神经网络在人工智能界占据统治地位。但凡有关人工智能的产业报道，必然离不开深度学习。


    传统的神经网络随机初始化网络中的权值，导致网络很容易收敛到局部最小值，为解决这一问题，Hinton 提出使用无监督预训练方法优化网络权值的初值，再进行权值微调的方法，拉开了深度学习的序幕。


    如图 12-4 所示，深度学习所得到的深度网络结构包含大量的单一元素（神经元），每个神经元与大量其他神经元相连接，神经元间的连接强度（权值）在学习过程中修改并决定网络的功能。通过深度学习得到的深度网络结构符合神经网络的特征。因此，深度网络就是深层次的神经网络。


    ![](img/txt016_9.jpg "pagenumber_ebook=214,pagenumber_book=203")


    图 12-4　典型深度学习处理框架（书后附彩插）


    ### 1. 深度学习的基本思想


    深度学习的出众表现源于它的“自学习”思想，即利用隐含层从低到高依次学习数据中的从底层到高层、从简单到复杂、从具体到抽象的特征。这使得深度学习模型与传统机器学习的最大区别是不需要人工手动提取或专家设计规则提取特征，而是通过自学习得到特征，对数据具有自适应性、很强的鲁棒性。深度学习的另一思想是逐层贪婪训练（`Greedy
    Layer-Wise Training`）、最后微调（`Fine-Tuning`）的贪婪算法思想，打破了传统机器学习训练方法的桎梏。


    ### 2. 深度学习模型


    深度学习最基本的模型包括深度置信网络（`Deep Belief Nets`，`DBN`）、自动编码器（`Auto Encoder`）、卷积神经网络（`Convolutional
    Neural Networks`，`CNN`）和循环神经网络（`Recurrent Neural Network`，`RNN`）。前二者属于无监督学习模型，卷积神经网络`CNN`是一种有监督的深度学习模型，主要解决图像相关问题，而循环神经网络（`RNN`）主要用于解决连续且长短不一的序列样本训练问题并已在自然语言处理中取得了巨大成功以及广泛应用。


    #### 1）感知器模型


    感知器和前馈神经网络非常直观，它们将信息从前端输入，再从后端输出。神经网络通常被描述为具有层（输入、隐藏或输出层），其中每层由并行的单元组成。通常同一层不具有连接、两个相邻层完全连接（每一层的每一个神经元到另一层的每个神经元）。最简单的实用网络有两个输入单元和一个输出单元，可用于建立逻辑模型（用做判断是否）。通常通过反向传播方法来训练`FFNN`，数据集由配对的输入和输出结果组成（这被称为监督学习）。只给它输入，让网络填充输出。反向传播的误差通常是填充输出和实际输出之间差异的一些变化（如`MSE`或仅仅线性差异）。鉴于网络具有足够的隐藏神经元，理论上可以总是对输入和输出之间的关系建模。实际上，它们的应用是很有限的，通常将它们与其他网络结合形成新的网络。


    #### 2）径向基函数（RBF）网络模型


    径向基函数（`RBF`）网络就是以径向基函数作为激活函数的`FFNN`网络。但是`RBFNN`有其区别于`FFNN`的使用场景（由于发明时间问题大多数具有其他激活功能的`FFNN`都没有自己的名字）。


    #### 3）Hopfield 网络模型


    `Hopfield`网络（`HN`）的每个神经元被连接到其他神经元；它的结构像一盘完全纠缠的意大利面板。每个节点在训练前输入，然后在训练期间隐藏并输出。通过将神经元的值设置为期望的模式来训练网络，此后权重不变。一旦训练了一个或多个模式，网络将总是会收敛到其中一个学习模式，因为网络在这个状态中是稳定的。需要注意的是，`HN`不会总是与理想的状态保持一致。网络稳定的部分原因在于总的“能量”或“温度”在训练过程中逐渐缩小。每个神经元都有一个被激活的阈值，随温度发生变化，一旦超过输入的总合，就会导致神经元变成两个状态中的一个（通常是-1
    或 1，有时候是 0 或 1）。更新网络可以同步进行，也可以依次轮流进行，后者更为常见。当轮流更新网络时，一个公平的随机序列会被生成，每个单元会按照规定的次序进行更新。因此，当每个单元都经过更新而且不再发生变化时，你就能判断出网络是稳定的（不再收敛）。这些网络也被称为联存储器，因为它们会收敛到与输入最相似的状态；当人类看到半张桌子的时候，会想象出桌子的另一半，如果输入一半噪声、一半桌子，`HN`将收敛成一张桌子。


    #### 4）马尔可夫链模型


    马尔可夫链（`MC`或离散时间马尔可夫链，`DTMC`）是波尔兹曼机（`BM`）和`HN`的前身。它可以这样理解：从现在的这个节点，去任何一个邻居节点的概率是无记，这意味着最终选择的节点完全取决于当前所处的节点，而与过去所处的节点无关。这虽然不是真正的神经网络，但类似于神经网络，并且构成了`BM`和`HN`的理论基础。就像`BM`、限制玻尔兹曼机（`RBM`）和`HN`一样，`MC`并不总是被认为是神经网络。此外，马尔科夫链也并不总是完全连接。


    #### 5）波尔兹曼机模型


    波尔兹曼机（`BM`）很像`HN`，区别在于只有一些神经元被标记为输入神经元，而其他神经元保持“隐藏”。输入神经元在完整的网络更新结束时成为输出神经元。它以随机权重开始，并通过反向传播学习或通过对比分歧（一种马尔可夫链用于确定两个信息增益之间的梯度）训练模型。与`HN`相比，`BM`的神经元大多具有二元激活模式。由于被`MC`训练，`BM`是随机网络。`BM`的训练和运行过程与`HN`非常相似，即将输入神经元设置为某些箝位值，从而释放网络。虽然释放节点可以获得任何值，但这样导致在输入和隐藏层之间多次反复。激活由全局阈值控制。这种全局误差逐渐降低过程导致网络最终达到平衡。


    #### 6）受限玻尔兹曼机模型


    受限玻尔兹曼机（`RBM`）与`BM`非常相似，也与`HN`类似。`BM`和`RBM`最大区别是`RBM`有更好的可用性，因为它受到更多的限制。`RBM`不会将每个神经元连接到每个其他神经元，但只将每个神经元组连接到每个其他组。因此，没有输入神经元直接连接到其他输入神经元，也不会有隐藏层直接连接到隐藏层。`RBM`可以像`FFNN`一样进行训练，而不是将数据向前传播然后反向传播。


    #### 7）自编码器模型


    自编码器（`Auto Encoders`，`AE`）与前馈神经网络（`FFNN`）有点相似。自编码器是一种非线性网络，具有编码解码的过程，网络将解码之后的重构误差作为优化目标。为了提高深度网络对噪声的鲁棒性能，Vincent
    等人提出了去噪自编码器（`Denoising Auto Encoders`），并以它为基本模块构建深度网络，有效地解决了样本中噪声干扰的问题。与其说它是一个完全不同的网络结构，不如说它是前馈神经网络的不同应用。自编码器的基本思想是自动编码信息（如压缩，而非加密）。整个网络在形状上像一个漏斗：它的隐藏层单元总是比输入层和输出层少。自编码器总是关于中央层对称（中央层是一个还是两个取决于网络的层数：如果是奇数，关于最中间一层对称；如果是偶数，关于最中间的两层对称）。最小的隐藏层总是处在中央层，这也是信息最压缩的地方（被称为网络的阻塞点）。从输入层到中央层被称为编码部分，从中央层到输出层被称为解码部分，中央层被称为编码（`Code`）。可以使用反向传播算法来训练自编码器，将数据输入网络，将误差设置为输入数据与网络输出数据之间的差异。自编码器的权重也是对称的，即编码权重和解码权重是一样的。


    #### 8）稀疏自编码器模型


    稀疏自编码器（`Sparse Auto Encoders`，`SAE`）在某种程度上与自编码器相反。不同于训练一个网络在更低维的空间和结点上去表征一堆信息，在这里尝试着在更高维的空间上编码信息，因此在中央层，网络不是收敛的，而是扩张的。这种类型的网络可以用于提取数据集的特征。如果用训练自编码器的方法来训练稀疏自编码器，几乎在所有的情况下，会得到一个完全无用的恒等网络（即输入什么，网络就会输出什么，没有任何转换或者分解）。为了避免这种情况，在反馈输入的过程中会加上一个稀疏驱动。这个稀疏驱动可以采用阈值过滤的形式，即只有特定的误差可以逆传播并被训练，其他误差被视为与训练无关且被设置为零。在某种程度上，这和脉冲神经网络相似，即并非所有的神经元在每个时刻都会被激活（这在生物学上有一定的合理性）。


    #### 9）变分自编码器模型


    变分自编码器（`Variational Auto Encoders`，`VAE`）和自编码器有相同的网络结构，但是模型学到了一些其他的东西，即输入样本的近似概率分布。这一点和玻尔兹曼机（`BM`）、受限玻尔兹曼机（`RBM`）更相似。然而，依赖于贝叶斯数学，这涉及概率推断和独立性，以及再参数化技巧以获得不同的表征。概率推断和独立性部分有直观的意义，但是依赖于复杂的数学知识。基本原理如下：将影响考虑进去。如果一件事在一个地方发生，而另一件事在其他地方发生，那么它们未必是相关的；如果它们不相关，那么误差逆传播的过程中应该考虑这个。这种方法是有用的，因为神经网络是大型图（在某种程度上），所以当进入更深的网络层时，你可以排除一些结点对于其他结点的影响。


    #### 10）去噪自编码器模型


    去噪自编码器（`Denoising Auto Encoders`，`DAE`）是一种自编码器。在去噪自编码器中，不是输入原始数据，而是输入带噪声的数据（好比让图像更加的颗粒化）。但是我们用和之前一样的方法计算误差，而网络的输出是和没有噪声的原始输入数据相比较的。这鼓励网络不仅仅学习细节，而且学习到更广的特征。因为特征可能随着噪声而不断变化，所以一般网络学习到的特征通常是错误的。


    #### 11）深度置信网络模型


    深度置信网络（`Deep Belief Networks`，`DBN`）是 Hinton 教授在 2006 年提出的一种基于概率的深度学习网络模型。它是由多个受限玻尔兹曼机（`Restricted
    Boltzmann Machines`，`RBM`）作为基层模块进行堆叠后所形成的一种层级产生式模型，这些网络已经被证明是可有效训练的。其中，每个自编码器或者玻尔兹曼机只需要学习对之前的网络进行编码。这种技术也被称为贪婪训练。贪婪是指在下降的过程中只求解局部最优解，这个局部最优解可能并非全局最优解。深度置信网络能够通过对比散度（`Contrastive
    Divergence`）或者反向传播来训练，并像常规的受限玻尔兹曼机或变分自编码器那样，学习将数据表示成概率模型。一旦模型通过无监督学习被训练或收敛到一个（更）稳定的状态，它可以被用来生成新数据。如果使用对比散度训练，它甚至可以对现有数据进行分类，因为神经元被训练寻找不同的特征。它的优点是用于传统神经网络参数初始化大大提升了网络的训练速度，加强了网络的建模能力。随后，为了增强`RBM`的表达能力以及考虑到特定的数据结构，许多学者对`RBM`进行了改进，这包括三元因子受限玻尔兹曼机、卷积受限玻尔兹曼机、稀疏受限玻尔兹曼机、Sparse
    RBM 模型、稀疏组受限玻尔兹曼机（`Sparse Group RBM`）模型、Log Sum RBM 模型等，进一步推动了基于`RBM`深度学习的发展。目前，`DBN`已被成功应用于手写体识别、信息检索、文本检测、目标识别、人类运动行为识别、机器翻译、语音识别等识别领域。


    #### 12）CNN 模型


    `CNN`和大多数其他网络完全不同，主要用于图像处理，但也可用于其他类型的输入，如音频。`CNN`应用于图像分类时，其基本结构包括两层：一是特征提取层。每个神经元的输入与前一层的局部接受域相连，并提取该局部的特征，一旦该局部特征被提取后，它与其他特征间的位置关系也随之确定下来。二是特征映射层。网络的每个计算层由多个特征映射组成，每个特征映射是一个平面，平面上所有神经元的权值相等。特征映射结构采用影响函数核小的`Sigmoid`函数作为卷积网络的激活函数，使得特征映射具有位移不变性。此外，由于一个映射面上的神经元共享权值，因而减少了网络自由参数的个数。


    `CNN`每一个卷积层都紧跟着一个用来求局部平均与二次提取的计算层，这种特有的两次特征提取结构减小了特征分辨率，其特点是卷积层中的滤波器是共享的，能够大大降低参数的规模，对防止模型过拟合是非常有好处的，同时能够保持图像的空间信息与特征不变性。具体来讲，卷积神经网络在图片分类上的应用是将图片输入网络，网络将对图片进行分类。例如，如果你输入一张猫的图片，它将输出“猫”；如果你输入一张狗的图片，它将输出“狗”。

    '
