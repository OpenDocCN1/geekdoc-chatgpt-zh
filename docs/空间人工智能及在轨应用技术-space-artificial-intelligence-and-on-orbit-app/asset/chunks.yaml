    # 机器学习


    ## 机器学习概述


    如图12-1所示，与传统直接编写计算机程序完成某个确定的算法直接完成从输入到输出推导不同的是，机器学习方法是计算机利用已有的数据（经验），得出了某种模型（迟到的规律），并利用此模型预测未来（是否迟到）的一种方法。因此，从某种程度上来理解，机器学习与人类思考的经验过程是类似的，不过它能考虑更多的情况，执行更加复杂的计算。事实上，机器学习的一个主要目的就是把人类思考归纳经验的过程转化为计算机通过对数据的处理计算得出模型的过程。经过计算机得出的模型能够以近似于人的方式解决很多灵活复杂的问题。机器学习的过程与人类思考方式一致，遵循“透过数据，发现规律，进行预测”的基本过程。


    ![](images/txt016_1.jpg "pagenumber_ebook=201,pagenumber_book=190")


    图12-1　机器学习示意图


    （a）机器；（b）人


    机器学习直接来源于早期的人工智能领域。传统算法包括决策树学习、推导逻辑规划、聚类、强化学习和贝叶斯网络等。从学习方法上进行分类，机器学习算法可以分为监督学习（如分类问题）、无监督学习（如聚类问题）、半监督学习、集成学习和强化学习等。早期机器学习方法受制于机器计算能力，甚至都无法实现弱人工智能。随着时间的推移，计算能力的发展改变了一切。


    ## 3. 深度学习，一种实现机器学习的技术


    深度学习本来并不是一种独立的学习方法，其本身也会用到有监督和无监督的学习方法来训练神经网络。但由于近几年该领域发展迅猛，一些特有的学习手段相继被提出（如残差网络）。因此，越来越多的人将其单独看作一种学习的方法。


    最初的深度学习是利用深度神经网络来解决特征表达的一种学习过程。深度神经网络本身并不是一个全新的概念，其源自人工神经网络。人工神经网络是早期机器学习中的一个重要的算法，历经数十年风风雨雨。神经网络的原理是受我们大脑的生理结构———互相交叉相连的神经元启发。但与大脑中一个神经元可以连接一定距离内的任意神经元不同，人工神经网络具有离散的层、连接和数据传播的方向。


    深度神经网络可大致理解为包含多个隐含层的神经网络结构。为了提高深层神经网络的训练效果，人们对神经元的连接方法和激活函数等方面做出了相应的调整。其实有不少想法早年间也曾有过，但由于当时训练数据量不足、计算能力落后，因此最终的效果不尽如人意。


    深度学习以摧枯拉朽般实现各种任务，使得似乎所有的机器辅助功能都变为可能。无人驾驶汽车、预防性医疗保健，甚至更好的电影推荐，都近在眼前或即将实现。其原因与以下因素息息相关：


    ①深度神经网络需要大量数据进行训练。网络深度太浅的话，识别能力往往不如一般的浅层模型，如`SVM`或`boosting`；如果做得很深，就需要大量数据进行训练，否则学习过程中过拟合将不可避免。自2006年开始，随着互联网的迅速发展，产生了大量可供训练和学习的数据，即所谓的大数据时代。


    ②运算能力。深度网络对计算机的运算要求比较高，需要大量重复可并行化的计算，在当时CPU只有单核且运算能力比较低的情况下，不可能进行很深的深度网络训练。随着GPU计算能力的增长，深度网络结合大数据的训练才成为可能。


    ③回顾神经网络的发展历程，从单层神经网络（感知器）开始，到包含一个隐藏层的两层神经网络，再到多层的深度神经网络，先后经历了“三起三落”，在这起落之间，有一大批如Lecun、Hinton等科学家的坚持，最终迎来了深度神经网络占据主流的曙光。


    ## 4. 强化学习，学习反馈的自我进化机制


    强化学习是受到生物能够有效适应环境的启发，以试错的机制与环境进行交互，通过最大化累积奖赏的方式来学习到最优策略。


    强化学习系统由4个基本部分组成，即状态`s`、动作`a`、状态转移概率`P（s′/s，a）`和奖赏信号`r`。策略`Pi：S-＞A`被定义为从状态空间到动作空间的映射。智能体在当前状态`s`下根据策略`Pi`来选择动作`a`，执行该动作并以概率`P（s′/s，a）`转移到下一状态`s′`，同时接收到环境反馈回来的奖赏`r`。强化学习的目标是通过调整策略来最大化累积奖赏，通常使用值函数估计某个策略`Pi`的优劣程度。


    在实际应用过程中，往往会结合深度学习、强化学习应用，通过深度学习进行有效信息的检测识别，再通过强化学习形成系统的反馈进化。早在2015年，谷歌公司的人工智能研究团队———深智（DeepMind）公布了两项令人瞩目的研究成果：基于Atari视频游戏的深度强化学习算法和计算机围棋初弈号1。这些工作打破了传统学术界设计类人智能学习算法的桎梏，将具有感知能力的深度学习（Deep
    Learning，DL）和具有决策能力的强化学习（Reinforcement Learning，RL）紧密结合在一起，构成深度强化学习（Deep Reinforcement
    Learning，DRL）算法，其原理框架如图12-2所示。这些算法的卓越性能远超出人们的想象，极大地震撼了学术界和产业界。


    ![](images/txt016_2.jpg "pagenumber_ebook=203,pagenumber_book=192")


    图12-2　深度强化学习框架


    深智团队在《Nature》杂志上的两篇文章使深度强化学习成为高级人工智能的热点。2015年1月提出的深度Q网络（Deep Q-network，DQN），在Atari视频游戏上取得了突破性的成果。深度Q网络模拟人类玩家进行游戏的过程，直接将游戏画面作为信息输入，游戏得分作为学习的强化信号。研究人员对训练收敛后的算法进行测试，发现其在49个视频游戏中的得分均超过人类的高级玩家。在此基础上，深智团队在2016年1月进一步提出计算机围棋“初弈号”。该算法将深度强化学习方法和蒙特卡罗树搜索（Monte
    Carlo Tree Search，MCTS）结合，极大减少了搜索过程的计算量，提升了对棋局估计的准确度。“初弈号”在与欧洲围棋冠军樊麾的对弈中，取得了5∶0完胜的结果。2016年3月。与当今世界顶级围棋棋手职业九段李世石（Lee
    Sedol）进行了举世瞩目的对弈，最终以4∶1获得胜利。这也标志着深度强化学习作为一种全新的机器学习算法，已经能够在复杂的棋类博弈游戏中达到匹敌人类的水平。


    ## 5. 迁移学习，运用已存在的知识对不同但相关领域问题进行求解的一种新的机器学习方法


    迁移学习放宽了传统机器学习中的两个基本假设：


    ①用于学习的训练样本与新的测试样本满足独立同分布的条件；


    ②必须有足够可利用的训练样本才能学习得到一个好的分类模型，目的是迁移已有知识来解决目标领域中仅有少量有标签样本数据甚至没有的学习问题。


    首先，随着时间的推移，原先可利用的有标签的样本数据可能变得不可用，与新来的测试样本的分布产生语义、分布上的缺口。例如，股票数据就是很有时效性的数据，利用上月份的训练样本学习得到的模型并不能很好地预测本月份的新样本。其次，有标签的样本数据往往很匮乏，而且很难获得。在网页数据挖掘领域，新数据不断涌现，已有的训练样本已经不足以训练得到一个可靠的分类模型，而标注大量的样本又非常费时费力，而且由于人的主观因素容易出错，这就引出了机器学习中另外一个重要问题，即如何利用少量的有标签训练样本或者源领域数据，建立一个可靠的模型对目标领域数据进行预测（源领域数据和目标领域数据可以不具有相同的数据分布）。数据分类首先要解决训练集样本抽样问题，即如何抽到具有代表性的样本集作为训练集是一个值得研究的重要问题。


    人工智能技术从传统简单的自适应反馈算法，到简单的机器学习方法，再到近几年日趋实用流行的深度强化学习以及迁移方法，在实际应用中日渐成熟，对传统行业、特别是大数据驱动行业造成了颠覆性影响。有鉴于此，日本、美国及西欧各国均制订了有关的研究规划。例如，美国国防部投资4亿美元，由国防部高级研究计划局（DAPRA）制订了一个8年研究计划，并成立了相应的组织和指导委员会。同时，海军研究办公室（ONR）、空军科研办公室（AFOSR）等也纷纷投入巨额资金进行神经网络的研究。DARPA认为神经网络“看来是解决机器智能的唯一希望”，并认为“这是一项比原子弹工程更重要的技术”。美国国家科学基金会（NSF）、美国国家航空航天局（NASA）等政府机构对神经网络的发展也都非常重视，它们以不同的形式支持了众多的研究课题。


    机器学习的经典算法主要有6种类型：一是聚类算法。采用各种距离度量技术将一系列的数据点划分到K类中，划分后的聚类结构具有类内相似、类间差距最大的特点。二是分类算法。事先按照一定的标准给一组对象集合进行分类，并赋予类标签，训练出学习模型，利用该模型对未知对象进行分类。三是回归算法。综合考虑整个数据集中因变量和自变量之间的关系进行建模，进而利用模型对给定的自变量进行计算得到预测值。四是深度学习算法。五是强化学习算法。六是迁移学习算法。本节将针对这几类算法做出简要论述。


    ## 12.1.1 聚类算法


    俗话说“物以类聚，人以群分”，聚类算法是将数据对象分组成为多个类或簇，在同一簇中的对象之间具有较高的相似度，而不同簇中的对象差别较大。通过聚类的划分，可以将一个簇中的数据对象作为一个整体对待。从机器学习的角度，聚类算法是一种“无监督学习”，训练样本的标记信息是未知的，根据数据的相似性和距离来划分，聚类的数目和结构没有事先给定。聚类的目的是寻找数据簇中潜在的分组结构和关联关系，通过聚类使得同一个簇内的数据对象的相似性尽可能大，同时不在同一个簇中的数据对象的差异性也尽可能地大。在人工智能中，聚类分析亦被称为“无先验学习”，是机器学习中的重要算法，目前被广泛应用于各种自然科学和工程领域，如心理学、生物学、医学等。


    目前已经提出多种聚类算法，可分为划分方法、层次方法、基于密度的方法、基于网格的方法和基于模型的方法。


    根据关注属性和方法的不同，可以将聚类算法划分为以下几类。


    ### 1. 基于划分的聚类算法


    ①`K-means`算法。这是一种典型的聚类划分算法，用一个聚类的中心代表一个簇，即在迭代过程中选择的聚点不一定是聚类中的一个点。该算法智能处理数值型数据。先对数据原型进行初始化，然后对原型进行迭代更新求解，算法描述如表12-1所示。


    表12-1　K-means算法描述


    ![](images/txt016_3.jpg "pagenumber_ebook=206,pagenumber_book=195")


    ②`K-modes`算法。该算法是`K-means`算法的扩展，采用简单匹配方法来度量分类型数据的相似度。


    ③`CLARA`算法。该算法在`PAM`基础上采用了抽样技术，能够处理大规模数据。


    ④`CLARANS`算法。该算法融合了`PAM`和`CLARA`两者的优点，是一个用于空间数据库的聚类算法。


    ⑤`PCM`算法。这是一种基于模糊几何理论的聚类算法。


    ### 2. 基于层次的聚类算法


    ①`CURE`算法。该算法采用抽样技术先对数据集进行随机抽取样本，再采用分区技术对样本进行分析，然后对每个分区局部聚类，最后对局部聚类进行全局聚类。


    ②`CHEMALOEN`算法（变色龙算法）。该算法首先由数据集构造成一个k-近邻图，再通过一个图的划分算法将图划分成大量子图，每个子图代表一个初始子簇，最后用一个凝聚的层次聚类算法反复合并子簇，找到真正的结果簇。


    ③`BRICH`算法。该算法利用树结构对数据集进行处理，叶节点存储一个聚类，用中心和半径表示，顺序处理每一个对象，并把它划分到聚类最近的节点。该算法也可以作为其他聚类算法的预处理过程。


    ### 3. 基于密度的聚类算法


    ①`DBSCAN`算法。这是一种典型的基于密度的聚类算法，该算法采用空间索引技术来搜索对象的邻域，引入了“核心对象”和“密度可达”等概念，从核心对象出发，把所有密度可达的对象组成一个簇。


    ②`OPTICS`算法。该算法先生成聚类的次序，可以对不同的聚类设置不同的参数，来得到用户满意的结果。


    ### 4. 基于网格的聚类算法


    ①`STING`算法。该算法利用网格单元保存数据统计信息，从而实现多分辨率的聚类。


    ②`WaveCluster`算法。该算法在聚类分析中引入了小波变换的原理，主要应用于信号处理领域。


    ### 5. 基于神经网络的聚类算法


    该方法的基本思想是由外界输入不同的样本到人工的自组织映射网络中，开始时输入样本引起输出兴奋细胞的位置各不相同，但自组织后会形成一些细胞群，它们分别代表了输入样本，反映了输入样本的特征。


    ### 6. 基于统计学习的聚类算法


    ①`COB Web`算法。这是一种通用的概念聚类方法，它用分类树的形式表现层次聚类。


    ②`AutoClass`算法。该算法以概率混合模型为基础，利用属性的概率分布来描述聚类。该方法能够处理混合型的数据，但要求各属性相互独立。


    从算法的可伸缩性、适合的数据类型、维度特性、异常数据的抗干扰能力、聚类形状以及算法效率6个方面，对上述算法的比较分析，如表12-2所示。


