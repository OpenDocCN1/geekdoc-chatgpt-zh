    ![](images/txt016_44.jpg "pagenumber_ebook=249,pagenumber_book=238")


    6）验证结果


    为验证基于FPGA的CNN网络加速器的功能正确性，随机选择Image-Net数据集的100幅图进行分类结果验证，模型参数选用公开数据模型，加速器的分类结果正确，证明该加速器功能正确。验证系统实物如图12-21所示；验证加速器的分类结果如图12-22～图12-24所示。


    ![](images/txt016_45.jpg "pagenumber_ebook=252,pagenumber_book=241")


    图12-21　验证系统实物


    ![](images/txt016_46.jpg "pagenumber_ebook=252,pagenumber_book=241")


    图12-22　验证加速器的分类结果1


    ![](images/txt016_47.jpg "pagenumber_ebook=252,pagenumber_book=241")


