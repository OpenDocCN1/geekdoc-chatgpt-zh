    2.典型网络详细分析


    当前，各种深度学习网络层出不穷。谷歌2017年推出了MobileNetV1，是专门为移动设备设计的通用计算机视觉卷积神经网络，能支持图像分类和检测。它是一种极其高效的神经网络。


    2018年4月，谷歌发布了下一代移动视觉应用MobileNetV2。Mobile-NetV2在MobileNetV1的基础上获得了显著的提升，并推动了移动视觉识别技术的有效发展，包括分类、目标检测和语义分割，代表了深度学习网络的发展方向。因此，选定MobileNetV2为典型网络进行分析。


