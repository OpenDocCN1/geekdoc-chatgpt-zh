    ## （1）遥感图像监督分类


    自2006年深度特征学习取得了突破性进展之后，机器学习与深度学习便从此登上了历史舞台。自此，以支持向量机、决策树等为代表的机器学习方法，以`CNN`、`AlexNet`、`VGGNet`等卷积神经网络为代表的深度学习方法都被广泛应用于遥感场景分类研究中。基于深度学习网络能够提取遥感图像的高维特征，挖掘图像数据的深层次统计规律，进而实现场景的精确分类。


    在通用深度学习网络的基础上，研究人员针对遥感图像的特性积极开展适应性改进。例如，Zhou等人提出了`ResNet-TP`方法，通过使输入的图像经过特定的`ResNet`网络层后再分为两路进行特征提取并分类，得到了令人满意的分类精度；Shawky等人提出基于`CNN-MLP`的方法对遥感图像进行场景分类，先使用无全连接层的卷积神经网络对遥感图像进行特征提取，然后用依赖于`Adagrad`优化器的增强型多层深度感知机进行遥感图像的分类，取得了较好的分类效果。


    ## （2）遥感图像无监督分类


    由于遥感图像获取容易，但是进行标注并非易事，因此近年来衍生出大量基于无监督的分类方法，这类方法也在遥感图像分类领域大放异彩。在遥感图像分类领域中用到的典型无监督特征学习方法包括主成分分析法、k均值聚类、稀疏编码、自编码器、生成对抗网络等。其中，`GAN`作为近年来最具潜力的无监督学习算法，其目的是学习一个生成的数据分布。Lin
    D等人首次将`GAN`应用到无监督特征提取的遥感图像分类中，在该方法中，作者将两种损失函数相结合进行图像的特征学习，利用此方法获得了良好的分类效果，分类精度达到94%左右。


    ## （3）遥感图像半监督分类


    由于现实中无标签的图像数量要远多于有标签的图像数量，所以为了提高大量的无标签样本的利用率，同时结合有标签和无标签样本的半监督学习算法就受到越来越多研究者的关注。Bruzzone等人提出使用基于时间依赖关系的`SVM`来获得未标注样本的权重，并且获得了较好的分类效果。Wei
    Han等人提出一种具有深度学习功能的半监督生成框架，用自标签技术和判别式评估方法，完成了遥感图像和场景分类，并取得了较好的效果。Xu等人提出了一种二型模糊C均值算法，作为一种新的半监督分类模型，有效地提高了遥感图像场景的分类精度。


    ## 4. 自主任务规划


    随着航天技术蓬勃发展，星上任务规模及多样性逐渐增加，如何利用有限的星上资源执行复杂繁重的空间任务是长期以来备受关注的问题。随着卫星载荷能力不断提升、响应时间要求不断缩短，为提高卫星资源利用率、保证快速响应能力，我们希望赋予卫星自主规划能力，使其能够根据动态环境自主地进行决策与调度，实现星上资源的优化配置。


    相比地面离线任务规划，星上任务规划的优势主要体现在：一是提升对突发事件的处理能力。以遥感卫星观测任务为例，对于失效图像（有云层覆盖的图像和火灾监控任务中没有发现起火点的图像），卫星自主任务调度可以立刻在星上删除以腾出存储空间，并直接触发针对同一目标点的二次成像。二是快速响应任务冲突。可用于其他低优先级任务和未被调度安排的任务。三是提升卫星运行效能。任务规划时考虑星上资源的精确状态，如仪器温度、电量、存储器剩余空间等，进一步提升任务执行效率与任务收益。四是减少对地面的依赖，使卫星不必保持与地面的频繁通信，增强卫星独立运行的鲁棒性。


    从问题模型上的分类来看，卫星的任务规划问题属于NP-Hard问题，而遗传算法、蚁群优化算法等智能优化算法在求解此类问题上表现出了良好的性能。因此，很多相关研究致力于改善算法的寻优过程，提出新型的启发式算法。例如，Zheng提出了一种改进的遗传算法，这种算法采用了一种新型的变异策略（`Hybrid
    Dynamic Mutation`），提升了遗传算法的求解速率和求解精度。算法在计算时间和任务成功率上都能满足要求，且在速度和可靠性方面都有突出的表现。Zhibo
    E提出了一种新的基于个体重构的整数编码遗传算法（`IRICGA`）来降低计算量，提高区域目标观测的最优性。此个体重构方法提出的个体重构过程有助于在进化过程中产生可行的解决方案。基于该算法，提出了一种有效的多卫星区域目标观测成像调度框架，包括预处理和调度两个独立阶段。在预处理阶段，提出了一种计算区域目标和观测条带可见时间窗的半解析方法。


    随着机器学习的快速发展，业内开始尝试使用机器学习算法来对卫星进行任务规划。例如，王海蛟提出一种基于马尔科夫决策过程（`Markov Decision Process`，`MDP`）的敏捷卫星在线调度模型，将卫星的任务规划问题视为一个求解`MDP`的最优决策策略的问题；同时也考虑了分布式条件下的多星协同任务规划问题，利用基于多智能体的强化学习算法来求解多星的协同行动问题。另外，聚类算法、博弈论等机器学习理论方法也被应用于在轨任务规划问题中。


    ### 2.3.2 算法加速技术


    深度学习模型已经被广泛应用，但模型“臃肿”，所需算力大，成为制约星上在轨智能实现的重要因素。深度学习的加速技术就是以“多、快、好、省”为目标，尝试从计算优化、硬件适配优化等方面减缓星上处理器负担的同时，加速算法的推理速度，以便达到实时性要求。


    #### 1. 基于计算优化的算法加速方法


    计算优化主要是寻求精度和速度之间的平衡，在保证模型效果的同时，尽可能减少模型的计算量。目前，业界计算优化方法大致可以分为4种，即轻量化模型设计、模型裁剪、知识蒸馏和模型量化。


    轻量化模型设计主要是采用计算量更小的新型卷积来代替标准卷积。轻量化模型的计算量通常仅有几十兆到几百兆浮点运算数，与传统的`VGG`、`Inception`、`ResNet`等大型网络动辄上千兆浮点运算数的计算量相比有明显优势，同时在一些分类、检测等视觉任务上与大模型的准确率差距不大。


    相比轻量化模型设计，模型裁剪通过对模型本身做“减法”，实现化大为小。核心思想是在保持剪裁前后模型精度差距不大的前提下，设计网络稀疏化机制，在某种粒度上筛选掉卷积中冗余的权重参数。其本质就是在各种粒度下寻找更为稀疏的模型表征，因此模型裁剪算法的关键在于权重筛选机制的设计以及筛选粒度的选择上。


    模型蒸馏或者知识蒸馏的目标是利用大模型`Teacher Network`提供的监督特征指导帮助小模型`Student Network`训练学习，从而使得小模型既快又准。知识蒸馏的关键在于监督特征的设计，如采用`Soft
    Target`所提供的类间相似性，或使用大模型的中间层特征图或`Attention Map`作为桥梁，对小网络进行训练。


    模型量化是将深度学习网络的权值、激活值等从高精度转化成低精度的操作过程。深度学习模型在运行时，需要进行大量的浮点数乘加运算，一般默认浮点数位宽是32 bit，但是实际上完全可以用更低的位宽来量化模型的权重和特征图。目前，业界广泛采用的是16
    bit和8 bit量化，在降低模型运行读写量的同时，提高模型的运算速度。量化技术的关键在于如何控制低位宽对模型带来的精度损失。


    #### 2. 基于硬件适配优化的在轨加速方法


    硬件适配优化主要是利用推理引擎对模型进行优化加速，使智能算法能够部署到嵌入式平台上。目前主流的推理引擎有`TensorRT`、`ncnn`、`MNN`、`TVM`和`TensorFlow
    Lite`等。神经网络图优化和算子优化是推理引擎之所以能对网络进行加速的核心关键。`TensorRT`通过对层间的横向或纵向合并，使得神经网络层数大幅减少。横向合并可以把卷积（`Convolution`）、偏置（`Bias`）和激活层（`ReLU`）合并成一个`CBR`结构，只占用一个`CUDA`核心。纵向合并可以把结构相同，但是权值不同的层合并成一个更宽的层，也只占用一个`CUDA`核心。合并之后网络的计算图层数减少，占用的`CUDA`核心数也会减少，内存访问次数和访问量也随之相应下降，因此整个模型结构会更小、更快、更高效。使用`TensorRT`后，一些检测算法能达到几倍的加速，效果十分可观。不过`TensorRT`只能用在英伟达的设备上，对于基于`ARM`芯片的设备可以使用国内`ncnn`或者`MNN`推理引擎。相比`TensorRT`，国产的`ncnn`和`MNN`在性能优化和算子支持上都存在一定的差距。


    计算优化和硬件优化仍存在适配问题。硬件优化主要是针对一些通用型的神经网络，而经过计算优化的网络，其结构会发生一定的变化，从而无法充分利用硬件加速库。例如，经过模型裁剪后，网络的卷积核通道数不再是2的指数次幂，会造成因编译器的内存对齐规则限制而导致的不必要的带宽损失和算力浪费。另外，轻量化网络中深度可分离卷积算子在推理引擎中的优化程度远远比不上普通卷积算子。因此，虽然深度可分离卷积算子相比普通卷积能节省8倍计算量，但最终的速度反而比不上普通卷积算子。


    ### 2.3.3 智能计算平台


    受卫星功耗限制，在轨智能计算平台需要在小功率下获得大算力。目前，专门面向星上使用的人工智能硬件平台还未见报道，已发射入轨的智能卫星使用的也是面向地面通用的人工智能硬件平台，如`PhiSat-1`搭载的是英特尔的`Movidius
    Myriad 2`模块。


    国外一些嵌入式AI硬件平台中，英伟达的AI边缘计算产品最多，技术支持也最完善。英特尔神经计算棒在性能和功耗上的表现都很亮眼，占据一定的市场。此外，谷歌的`AIY
    Edge TPU`搭配专门设计的深度学习框架`TensorFlow Lite`，达到了超高的能效比。国内也有一些公司设计了面向边缘计算的硬件产品，如瑞芯微和寒武纪等。值得注意的是，英特尔神经计算棒、谷歌的`AIY
    Edge TPU`和寒武纪的`MLU220-M.2`都是外置加速设备，需要插在树莓派等开发平台上。


    目前，常见的边缘智能计算平台的核心处理器主要使用`GPU`、`FPGA`和`ASIC`，近年来还发展出基于神经形态计算的类脑芯片。面向深度学习网络的训练和应用需求，总结各类芯片计算特征如下。


    #### 1. GPU计算特征


    与传统`CPU`结构不同，`GPU`的内部结构中包含了大量的逻辑计算单元，其规模远远超过结构中控制单元和寄存器等存储单元的规模。这意味着`GPU`拥有较多的计算核心，在对数据进行算术运算或者逻辑运算方面有着很大的优势。除了拥有较多的计算核心外，`GPU`的另一个优势是它的内存结构。首先，在`GPU`的架构中有一些存储单元，如寄存器等是供一些算术逻辑单元共享的，即`GPU`线程之间的通信可以依赖这些共享的内存而不依赖全局内存，其中计算单元与共享内存之间的数据传输速度比与全局内存之间的要快。其次，`GPU`拥有相对高速且内存带宽相对较大的全局内存，如`GDDR5`。虽然传统的`CPU`架构中有高速缓冲存储器的存在，但是其容量较小，无法存储深度学习算法模型所需的数据，需要存储在内存中，然而由于架构的原因，`CPU`的内存带宽并不如`GPU`的。因此，`GPU`更适合数据吞吐量相对较大的算法，如深度神经网络模型的训练阶段。


    目前，一些深度学习框架，如`Caffe`、`Theano`以及`TensorFlow`等能较好地应用于`GPU`上，并且`NVIDIA`公司也为`GPU`提供了较好的深度学习开发环境，如深度学习加速库`cuDNN`等，提高了`GPU`加速的性能。


    #### 2. FPGA计算特征


    `FPGA`最大的特点在于具有可编程性，即开发者可以根据自己的需要通过可编程的链接将`FPGA`内部的逻辑块连接起来，实现相应的功能。


    与`GPU`相比，`FPGA`功耗通常更低。综合计算和功耗这两个方面，`FPGA`有更加出色的能源效率，即在通常情况下，`FPGA`能在单位功耗下获取更高的性能。例如，Griffin
    Lacey等人在文献中指出，对于卷积神经网络的推理阶段，微软团队利用`FPGA`（`Stratix V D5`）实现了高性能的加速，其加速性能为每秒处理134张图片，功耗仅为25
    W，并且如果使用更高端的`FPGA`（`Arrial10 GX1150`），这个加速性能预计能达到每秒处理233张图片，而功耗基本不变；对于高性能的`GPU`实现（`Caffe+cuDNN`），其加速性能为每秒处理500～824张图片，功耗为235
    W。这意味着`FPGA`的能源效率能达到`GPU`的2～3倍。这对于某些深度学习应用，如超大型数据中心，资源有限的嵌入式应用来说尤为重要。


    #### 3. ASIC计算特征


    专用集成电路（`ASIC`）是一类专用的电路，能够给设计者实现应用最大程度的自由。为了满足不同消费者的需求，`ASIC`常常有更小的体积、更低的功耗、更高的性能、更强的安全性和量产之后更低的成本。目前，国内涌现出以中科寒武纪“`MLU100`”、地平线“`旭日1.0`”以及比特大陆“`BM1880`”等为代表的`ASIC`智能芯片，其中`MLU100`芯片在平衡模式（主频1
    GHz）和高性能模式（主频1.3 GHz）下，峰值速度分别达到128万亿次定点运算/166.4万亿次定点运算，功耗分别为80 W/100 W。


    与通过调整深度学习算法来适应`CPU`或者`GPU`硬件结构进而实现加速的方式不同，利用`ASIC`加速深度学习算法的主要方式通过定制专用的硬件加速算法，如针对卷积神经网络算法的加速设计。由于`ASIC`是针对某一个或者某一类算法进行硬件定制，所以利用`ASIC`加速深度学习算法通常能取得较高的性能，并且功耗较低。但是这种加速方式也有一些要求和限制，如`ASIC`加速器的硬件设计与开发周期较长，成本较高，硬件生成后通常无法改变，灵活性不高。


    #### 4. 类脑芯片计算特征


    类脑芯片在设计上推翻了经典的冯·诺依曼架构，而是基于仿人类脑神经系统的神经形态计算架构设计。清华大学类脑计算研究中心于2015年推出了首款类脑芯片———“天机芯”，将人工神经网络（`ANNs`）和脉冲神经网络（`SNNs`）进行了异构融合，可用于图像处理、语音识别、目标跟踪等多种应用开发。类脑芯片是在芯片基本结构甚至器件层面上进行优化设计，如采用忆阻器等新器件来提高存储密度。但是该类芯片相关技术还很不成熟，目前仅停留在实验室研究阶段，其算法模型的准确率仍有待提高。


    面向在轨智能应用，除了对高效率、低能耗的要求，还应考虑到太空中高低温、热真空、强辐射等环境特性也超出了地面通用平台的设计工况，因此地面通用平台在卫星上大规模的采用还需经过长时间的考验。


    ## 2.4 未来趋势


    未来，天基系统智能化需要强大的天地一体化信息网络支撑，即天基空间信息网络，其由星地协同智能对地观测系统与通信卫星、导航载荷的卫星和飞机等空间节点组成，通过动态链接组网，实时获取、传输和处理海量数据，实现天基信息的体系化应用。天基空间信息网络实现了对全球表面分米级空间分辨率、小时级时间分辨率的数据采集和米级精度的导航定位服务，在时空大数据、云计算和天基信息服务智能终端支持下，通过天地通信网络全球无缝的互联互通，实时地为国民经济各部门、各行业和广大手机用户提供定位（`Positioning`）、导航（`Navigation`）、授时（`Timing`）、遥感（`Remote
    sensing`）、通信（`Communication`）服务，即`PNTRC`服务。


    传统以及新应用场景对载荷系统不断提出更高性能需求。当前，增长的军事、经济需求对卫星系统性能不断提出更高的要求。卫星系统获取的数据正在成几何数字倍增，如何快速挖掘有用信息成为卫星数据处理的主要痛点。


    空间人工智能及在轨应用技术为处理这些巨量数据提供了很好的思路，但人工智能算法飞速发展，固定不变的算法和服务类型已经不能满足快速变化的需求。这要求载荷在灵活性、软件可升级方面提供支持。深空探测等一系列空间任务，最大的特点就是地面指令不能实时到达、任务持续时间长、未知因素多，需要空间飞行器自主感知、决策、执行，及时对任务规划做出调整。这就需要以软件化载荷作为基础，可调参量变多，有利于适应未知变化和动态任务调整。


    未来智能应用形态下需要卫星系统满足智能化、自主化运行，网络化、体系化协同，环境高效感知和智能认知等应用需求。为了更好地适应日益复杂的空间任务，提升对探测区域的感知能力，星上信息处理不再单单是对目标的检测识别，更要基于相关场景的目标检测结果，构建高层次的语义表征。除此之外，还要具备对时间/空间变化状态的预测能力，并能够与高层语义融合生成高时效、准确的情报表述，从而可以为全域的态势感知、人机交互协同理解提供有效的支撑。


    高效的目标特征提取和智能语义生成是实现高层认知的基础能力，智能分类是保障多星协同系统稳健运行的核心能力，轻量级优化则是具备星载部署运行的关键能力。开展基于深度学习的卫星数据目标特征提取、星上智能语义情报生成、面向主动推送的星上情报智能分类、面向星载应用的深度神经网络轻量级优化等空间智能信息处理技术的研究，完成核心算法设计及工程化，实现对空间数据内容的理解与描述，是实现卫星系统信息化、智能化以及提升卫星系统应用效能的基石。


    # 第3章 空间智能感知与控制发展状况


    空间智能感知与控制技术以近地轨道卫星、在轨维护与服务机器人、深空探测器、地外巡视器等多种航天器为对象，利用人工智能技术，解决航天器在运行环境复杂、不确定因素多、星上计算资源受限、星上能源受限、通信时延大等约束下实现理解任务、感知环境、自主决策和自主执行。


    ## 3.1 技术内涵


    空间智能感知与控制技术主要分为空间智能感知和空间智能控制两部分。空间智能感知是通过视觉（雷达、光学、激光等传感器）、触觉（力传感器）等测量手段，采用人工智能对目标、环境及自身状态进行感知和综合判断。空间智能感知的目标是面向空间系统开展航天任务过程中的智能化、自主化以及实时性需求，围绕空间环境的特殊性，为空间系统开展地面态势感知、在轨服务、深空探测等任务提供充分、高精度及实时的信息；通过引入以深度学习为代表的机器学习方法，结合数据挖掘等智能化手段，实现空间系统对空间环境、空间目标和地面目标的态势感知和高精度测量。


    诺伯特·维纳在1948年首次提出控制论的概念，指出控制论是研究动态系统在变化的环境条件下如何保持平衡状态或稳定状态的一门科学。七十多年来，控制的内涵不断丰富，在反馈原理的框架下，逐步涵盖感知、认知、推理、决策、交互等内容。自主控制是指系统在没有人或其他系统干预的条件下实现目标的控制过程，并能够对环境和对象的变化做出适应性反应。经典的`PID`控制、鲁棒控制、自适应控制等自动控制方法，基于解析模型进行设计，对突发事件、未知环境等变化的适应能力不强，任务能力受限，属于较低等级的自主控制。智能自主控制是指具备感知、学习、推理、认知、执行、演化等类人行为属性的自主控制，是自主控制的高级阶段，赋予航天器等无人系统主动探索、获取知识、灵活应用等智能，使其具备复杂未知变化环境下的感知、决策和操控能力，实现生长和演化，最终达到群体协同下的智能涌现。空间智能控制是指智能体通过主动感知环境，获得经验，并从中不断学习和进化得到适合任务需求、自身能力和环境特点的行为模式，最终具备对未知复杂环境的主动适应能力和执行指定任务的能力，并逐步获得最优性能。航天器智能自主控制以近地轨道航天器、在轨服务与维护机器人、深空探测器等航天器为对象，在星上资源的约束下，利用人工智能技术，实现透彻感知、最优决策和自主操控，从而使航天器具备在复杂环境下执行多变任务的能力。


    空间智能感知与控制技术分为以下任务流程：


    ①感知。其包含了航天器对整个任务场景的认知，可以综合对不同模态跨时空信息优化处理，使数据更好地融合，进而形成环境的层次化透彻建模，更全面地了解场景变化，并依据这些信息预测场景的未来变化趋势。

