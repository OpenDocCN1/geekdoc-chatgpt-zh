    ## 13.5 在轨情报分发技术


    由于传统情报获取的流程复杂，需经历成像、图像下传、地面情报获取等过程，特别是图像下传阶段，受到数传能力、地面站分布的影响，大大延长了情报获取的周期，导致遥感图像数据利用率低和时效性差。


    在应急增强任务中，卫星获取目标原始信息，如何快速生成情报信息以及如何快速分发至地面作战单元是战场信息支持时效性的关键。


    为了实现情报的按需快速获取，将传统地面图像处理的情报获取工作转移到星上在轨自主图像信息处理，可以摆脱数传能力的束缚。在轨遥感成像后通过在轨自主图像信息处理技术快速生成情报信息，并结合中继测控，快速将情报信息发送给用户，大大缩短了情报周期。


    在轨处理的主要内容包括：

    ①感兴趣区域提取及处理。针对军事冲突、地震灾害等区域，利用变化检测技术等对同一地区不同时相的遥感图像变化信息进行提取，获取感兴趣目标变化的大小、程度以及变化的类别，结合知识库中的推理规则，实现对目标区典型信息的快速获取。在获取感兴趣区域影像后，根据区域的大小，在满足星地数传带宽的限制条件下，生成区域标准产品，并向用户发放。例如，在军事领域，战争敏感区域实时影像的快速获取及监视有助于军事指挥官即时了解敌方的军事动态；在民用领域，地质灾害区域实时影像的快速获取有助于决策人士即时了解灾害程度并做出正确的救灾策略。

    ②运动目标快速检测、跟踪与融合识别。根据卫星获得的高帧频图像进行在轨目标检测与跟踪，快速获取目标的位置、航向、运动轨迹等实时、连续的动态信息，并结合多手段、多方式观测数据进行在轨融合识别，实现目标确认。

    ③数据检索挖掘与情报信息在轨生成。对天基可见光、红外、高光谱等多类型传感器获取的异质、多维、大量数据，实现数据在轨存储，利用数据挖掘技术从在轨存储的数据中提取规律性信息、数据关系或其他未明确显示的模式等，生成内容细节、地理位置等被用户理解的信息产品。


    在轨智能处理技术方案如图 13-60 所示。


    ![](img/txt017_91.jpg "pagenumber_ebook=341,pagenumber_book=330")


    图 13-60　在轨智能处理技术方案


    从卫星到终端的直链传输是战术应用的重要途径，而卫星的发射功率、天线口径、过境时间受限，空间、时间、频率资源短缺，将严重制约系统的信息吞吐量，对应急现场信息的及时传播造成严重困难。


    当前，国内现有遥感卫星应用终端大多依靠通信卫星或地面通信网转发遥感数据，能够直接与遥感卫星交互的用户终端还没有投入装备使用，尚不具备遥感信息直链一线作战单元的技术和能力。因此，要发展应急增强系统，必须解决直链用户数据传输问题，提高有限信道资源条件下的传输效率，保障应急增强系统的信息高效传递。


    ### 1. 自适应速率传输


    按传统数传体制，在确定遥感传输速率时，需要考虑最差的信道条件，即按最低仰角进行链路预算，整个过境窗口数据传输速率恒定，因而高仰角条件下的链路余量未得到充分利用，存在链路功率资源的浪费。因此，研究自适应遥感速率传输技术，使得遥感传输速率能够随着仰角的增加而提高，从而最大化卫星过境窗口下传的数据量。


    信道状态信息（`CSI`）是实现传输速率切换的前提。在应急增强系统的通信环境中，收发两端之间的相互运动使得`CSI`随时间不断变化，因此需要对`CSI`进行精确、实时估计。`CSI`可以误帧率即数据帧的重传次数为参考度量，通过统计每帧数据的重传次数来调整调制编码方案，也可以信道信噪比的估计值为参考度量，即接收端检测信噪比并反馈至发送端，发送端据此对数据速率进行相应调整。


    ### 2. 高效调制编码


    星地直链传输需采用具有较高功率效率的传输体制，在有限信道功率条件下尽可能提高传输速率。其核心是设计最小功率谱占有率的恒包络、连续相位调制方式。传统卫星通信通常采用`BPSK`、`QPSK`、`OQPSK`等调制方式，其功率利用率有待提高。`GMSK`、`SOQPSK`属连续相位调制方式，消除了传统遥感数传中`QPSK`信号的
    180°相位翻转，从而具有比`QPSK`更佳的功率效率和恒包络特性，非常适合在功率资源受限的非线性卫星信道中传输。因此，需在普通`GMSK`、`SOQPSK`的基础上进行改进，进一步提高功率效率。


    ### 13.5.1 重点目标在轨智能快速识别与提取


    在轨图像自主处理实现了我国航天侦察情报的自动化和智能化，对于提高我国目标识别的自动化程度、遥感图像数据的利用率和情报的时效性都具有非常重要的意义。它将在科学地利用遥感图像信息、精确制导武器图像情报保障、作战辅助决策等方面起到推动性的作用。


    重点目标在轨智能快速识别与提取实现情报快速生成的技术包括图像预处理（辐射、几何校正）技术、区域图像提取技术、目标变化检测与识别技术。


    #### 1. 图像预处理（辐射、几何校正）技术


    在轨图像预处理技术的目标是生成相对于地面一级图像的数据，生成地面可直接判读数据，或为进一步的高级处理奠定基础，包括相对辐射校正技术和系统几何校正技术。


    相对辐射校正的目的是改善图像的视觉效果，提高对目标的实际分辨力，需要通过图像处理来进行纠正。实现过程中主要是对成像过程中的死像元、暗像元和扫描线脱落进行处理，然后根据积分求数据、在轨定标灯数据或地面样本统计数据计算每个探元的辐射校正系数，进行辐射校正处理。


    系统几何校正技术主要是利用传感器参数以及卫星轨道参数、侧视角等，在某一高程平面上建立原始影像的每个像素和其相应平面位置间的对应关系。首先需要利用卫星轨道参数、卫星姿态所建立的推扫式传感器影像坐标与其地面点在地球固定参考坐标系（`CTS`）坐标系统下的坐标关系式，再计算出传感器影像坐标、`CTS`坐标系统和地图投影坐标系之间的转换关系；其次采用扫描线法、分扫描线行取样确定纠正关键点，并将线阵影响中的关键点变换至地图投影坐标系获得关键点坐标；最后纠正关键点内插得到校正后的影响，完成几何校正。


    #### 2. 区域图像提取技术


    区域图像提取技术的基本原理是通过卫星轨道、姿态参数以及相机参数，利用共线方程通过坐标变换，并引入畸变修正因子，计算获取图像的对应经纬度，若在关心区域内则提取出图像。对于定位来说，与几何校正有很多相同技术。


    由卫星严格成像方程建立的基本原理可知，建立卫星严格成像方程需要以下输入：像元指向角、各旋转矩阵、成像时刻卫星位置和成像时刻卫星姿态。对高分辨率的敏捷成像卫星全链路误差，结合对各种影响定位精度因素的分析，进行误差归类、综合处理和分析。把影响`CCD`成像几何质量即相对定位精度归为内部误差；把不影响`CCD`成像几何质量但影响绝对定位精度的误差归为外部误差；把地面处理引入的误差称为后处理误差。系统误差能通过地面控制点进行一定程度的补偿，补偿程度与补偿模型相关；偶然误差能通过多次观测提高精度。同时，根据高分辨率敏捷成像卫星光学推扫成像、侧摆和俯仰成像、窄视场、多`CCD`拼接的成像特点，将全链路误差源进行枚举分析，并结合误差的特性依照不同的方法可改善几何定位精度，实现更高精度的区域图像提取。


    #### 3. 目标变化检测与识别技术


    目标变化检测与识别是对不同时相图像的变化进行检测，检测的前提是完成区域图像的提取和图像的预处理，需将待检测图像与用来比对的参考图像先进行图像配准，然后再进行比值检测，最后输出变化区域和识别的目标。


    图像配准技术利用点特征的匹配来完成目标的定位，相比于利用灰度特征导致需要上传大量数据的问题，并减少相关运算的计算量。首先，从参考图像中提取点特征。在提取点特征时主要考虑目标区域，而对于非关注区域则一般不进行特征点的提取。但是，有时候为了提高算法的准确性，也对目标相邻区域进行特征点的提取。其次，将从参考图像中提取的点上传至星上，作为关注目标的描述，然后从卫星拍摄的新图像中提取点特征，为了保证相同的目标提取的点也尽可能保持一致，此处采用点特征提取方法一般和参考图像中点特征的提取方法一致。最后，把从历史图像中提取的点与新的卫星图像中提取的点进行匹配，进而完成目标的精确定位。


    图像比值法通过计算与已配准图像相应像素的比值，判断图像的相似性。这对光学遥感图像来说，能够消除山影、云影等影响，使得比图像差值法对图像中的噪声具有更好的抵抗能力，因此该方法在遥感图像的变化检测中得到了广泛的应用。对于图像阈值的选择，由于遥感图像的复杂性，简单运算得到的差异图像中变化类更易于趋向于类高斯分布，而对于没有发生变化的区域，近似服从高斯分布，因此采用对于变化检测的阈值采用自适应阈值、多档阈值参数接口，可获得较好的检测与识别效果。


    ### 13.5.2 多源信息在轨快速融合处理


    由于不同类型载荷特点不同，在轨数据处理任务不同，因此获得的产品及其性能也不相同。例如，电子侦察卫星信息处理速度快，可快速发现疑似目标位置，通过电磁特征匹配识别目标；高分辨可见光卫星普查相机用于云判和海面目标的快速检测，高分辨率相机用于舰船、飞机目标的类型识别和导弹阵地发射架等目标的检测；红外卫星用于全天时机场飞机和港口、海面舰船目标检测、军事目标温度信息提取以及各类目标工作状态判别；视频成像卫星用于运动目标的检测和跟踪监视；`SAR`卫星用于大中型舰船等典型目标特征信息提取并完成检测识别；高光谱卫星实现疑似目标的特征提取、目标的检测和识别（包括伪装目标和假目标的识别），以及云背景下大型空中飞机目标检测；宽幅光学卫星用于大幅宽海面图像中快速检测疑似舰船目标，生成大范围目标态势，形成待详查的目标队列。


    根据目标的不同，结合数据融合，采用不同的情况数据生成以下方案：

    ①机场飞机决策级融合时，可获得飞机目标的类型、位置、数量、工作状态、运动状态等信息的情报产品；疑似飞机特征级融合时，可获得飞机目标的类型、位置、数量，伪装的方式，假飞机目标的位置、数量等情报信息。

    ②导弹阵地决策级融合时，可获得导弹阵地的子目标（发射架等）配置，如位置、数量等，子目标的工作状态、运动状态等信息的情报产品；导弹阵地特征级融合时，可获得导弹阵地发射架的配置，如位置、数量等，以及阵地伪装的方式、部署的假发射架目标的位置、数量等情报信息。

    ③港口舰船决策级融合时，可获得包含舰船目标的类型、位置、数量、工作状态、运动状态等信息的情报产品；昼间海面舰船决策级融合时，可获得舰船目标的类型、位置、数量、无线电工作状态、周边岛屿等信息的情报产品；夜间海面舰船决策级融合时，可获得舰船目标的类别、位置、数量、无线电工作状态、热状态信息的情报产品。


    ### 13.5.3 在轨信息按需快速分发


    在轨信息产品主要包含原始类产品、图像类产品、文字类产品等。


    原始类产品用于数据积累，含有最全面最丰富的特征信息，数据量与成像时间相关。实时性差，可为地面应用及测试服务。


    图像类产品用于目标识别和确认，通常是局部范围内带有目标详细特征的图像切片，带有目标周边环境信息。时间响应高，结合文字类产品，支持战役战术行动决策。


    文字类产品用于态势变化的获取，如指定区域目标有无、目标数目、目标运动状态、目标位置等。时间响应最高，通常以最快速度发送至应用单元。


    为了适应各类信息产品，设计了星-地传输、星-星-地分发、星-地-端分发等多种类信息产品的分发方式。


    #### 1. 星-地传输


    如图 13-61 所示，以传统地面测控站和接收站为主，通过`2 kbit/s`的`S`测控链路可收发文字类信息；通过`300～600 Mbit/s`甚至更快的地面数据接收站，接收图像类产品和原始类信息，且以原始类信息为主。


    #### 2. 星-星-地分发


    如图 13-62 所示，以中继卫星和军用通信卫星为主，通过`2/4 kbit/s`的全球`S`测控链路可以收发文字类信息；通过`10～20 Mbit/s`的全球`Ka/Ku`数据传输链路，实现境外图像类应急情报产品的快速回传。


    ![](img/txt017_92.jpg "pagenumber_ebook=346,pagenumber_book=335")


    图 13-61　星-地传输示意图


    ![](img/txt017_93.jpg "pagenumber_ebook=346,pagenumber_book=335")


    图 13-62　星-星-地分发示意图


    #### 3. 星-地-端分发


    如图 13-63 所示，以北斗终端和动中通终端为主，将星上数据分发至应用单元。通过北斗导航系统短报文功能，以每秒最大`240`字节速度，向地面北斗手持终端发送文字类信息；通过装载动中通的舰船、车辆和武器平台，以最大`75
    Mbit/s`速度点对点发送图像类产品，以最大`200 kbit/s`广播分发形式发送图像类或文字类产品。

