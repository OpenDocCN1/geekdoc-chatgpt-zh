    3）海洋移动目标区域巡查运行模式


    海洋移动目标区域巡查运行模式主要通过合理分配卫星平台及侦察载荷资源，对任务区域内海上已掌握的移动目标实施监视，用于获取区域态势和检测目标变化情况。首先由星上进行需求分解与分析处理，完成任务清单自主筹划工作，然后通过多星联合任务规划将移动目标区域巡查任务分配给多星配合执行，将目标数据下传地面站，或通过广播分发将目标信息发送给战术终端，并将在轨任务规划结果与任务执行状态下传地面。


