    在对等价对处理过程中，设计一种基于标号等价对处理方法，将深度优先遍历方法进行改进，实现了图像二值连通域快速标记算法，并应用到 FPGA 等可编程逻辑电路器件中。首先，对等价对进行排序操作，第一行数据`equivalence_1`代表每个等价对第一个元素，第二行数据`equivalence_2`代表每个等价对第二个元素，用第二行数据减去第一行数据，得到每个等价对所对应的跨度`step`，为第三行数据；对第一行数据`equivalence_1`中相同元素所对应的所有跨度`step`数据进行求取最大值工作，所得到的最大值记为该元素对应的最大搜索阈值，记录在第四行`threshold`数据中。如图
    13-29 所示，矩阵表示了深度优先遍历所要搜索的范围，矩阵的元素个数代表了深度优先遍历搜索的次数；采用最大搜索阈值对等价链表搜索范围重新限定后，只需对矩阵中灰色背景的元素区域进行搜索，对稀疏目标分割图像可大大减少搜索次数。


