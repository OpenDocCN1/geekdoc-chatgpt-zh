    SpaceX利用猎鹰9号可回收火箭，将12 000颗卫星送到轨道平面，然后组成卫星通信群。最初马斯克采用的是铱星9523的UART串口数据传输终端进行卫星间的数据链路通信，但是在初期测试期间发现用户线路数据和SBD数据的收发在用户数量增长后会有严重的衰减。最终进行了链路组网升级，采取了基于区块链技术的SGL网络结构，采用SGL底层协议基础结构进行卫星组网，SGL协议令牌进行加密传输。解决了星链冗余与可扩展问题，同时也保护了网络核心层在SGL
    Chain上的应用。该方案还提供GISP接口为各国ISP接入互联，只要各国愿意将本国的ISP接入太空WIFI，全球在没有通信信号的地方均可实时接收到来自太空WIFI互联网接入信号。


    ##### 网络架构指标


    “星链”计划与蜂窝移动互联网的比较，在无线接入的速率方面，LTE下行带宽为100M～1G，5G下行带宽为1～10G，“星链”计划带宽为50～150M，最终目标为1G；空口信号传输时延，LTE的10
    km时的传输延时为66 us，5G的1 km时的传输延时为6.6 us，“星链”计划的550 km的时延接近4 ms，1 200 km的时延大概为8 ms。


    ##### 发展趋势


    2021年，“星链”星座实施了19次大规模部署，部署989星。自首发试验星以来，累计发射1 944颗卫星。2022年上半年发射频次密集，在2022年3月创下20天4发的纪录，推测其卫星工厂实现月均150星的生产速度。2022年5月完成第一期第一阶段卫星发射任务。2022年下半年9月起恢复部署任务，开始发射搭载星间激光通信终端的新一代v1.5版本卫星。美国太空探索技术公司（SpaceX）使用猎鹰-9（Falcon-9）部署“星链”卫星，一次最多可发射60星，一级火箭可重复使用，卫星部署成本不断降低。


    #### Blackjack


    `Blackjack`项目由美国国防高级研究计划局（`DARPA`）于2017年发布，旨在开发低地球轨道（`LEO`）星座，为军事行动提供全球持久覆盖。通过`Blackjack`项目，`DARPA`将建立一个扩散的`LEO`星座，`LEO`星座将把传感器连在一起，为全世界选定的用户提供持续的全球覆盖能力。2021年6月，`DARPA`成功部署了两颗`Mandrake2`卫星，该卫星用于验证`Blackjack`项目中先进激光通信技术的可行性。


    美国国防部卫星一直是定制设计，设计和升级周期漫长且昂贵，而低地球轨道宽带互联网通信卫星的出现可以提供很有吸引力的规模经济。`Blackjack`计划寻求开发低成本空间有效载荷和商品化卫星平台，平台尺寸要小，质量、功率和成本（SWAP-C）要低，卫星能力要与当今地球同步轨道（`GEO`）军事通信能力近似，但成本要低得多。`DARPA`表示，商业化卫星平台将采用基于开放架构的电气、软件和网状网接口控制，将为在低轨运行数十种或数百种不同类型的军用卫星有效载荷创造条件。`Blackjack`计划的关键方面是利用商业元素，这对美国来说是一个巨大优势。由于使用商业卫星平台来降低每个轨道平台的成本，并且使用商业提供商大幅降低发射服务成本，美国将拥有比对手更大的竞争优势。使用数百颗更小、更便宜的卫星来提供与现有资产相似或更好的性能，将极大提高太空项目的鲁棒性。新系统的模块化特性可以快速适应未来需求。


    ##### 构型设计


    由于与传统的`GEO`卫星相比，`LEO`卫星在延迟、经济效益方面具有许多优势，`Blackjack`项目将采用`LEO`星座。如图5-2所示，每颗`Blackjack`卫星由一个商业化卫星平台、一个`PitBoss`控制单元以及一个或多个能够自主运行超过24
    h的军用有效载荷组成。


    ![](images/txt007_5.jpg "pagenumber_ebook=104,pagenumber_book=93")


    图5-2　`Blackjack`卫星结构图


    `PitBoss`是`Blackjack`项目开发的天基自主网络任务管理系统，是`Blackjack`的“大脑”。`PitBoss`控制单元内含高速处理器和加密装置，可用作通用的网络和电气接口，并提供任务层面的自主功能、在轨计算、卫星与地面用户之间的通信管理、指挥与遥测链路以及数据加密等能力。根据`DARPA`于2019年4月发布的一份广泛机构公告，`PitBoss`应能够“利用全球`LEO`星座获取目标定位、特征描述和持续跟踪信息”。此外，`PitBoss`应该能够增强导航、授时与定位（PNT）能力、太空到地面通信以及关键数据在全球范围内的快速分发。`PitBoss`将促进关键信息的收集和处理并分发给战术用户。该系统将包括架构和软件/硬件元素，以支持星座级的自主功能，并采用先进的体系结构和加密技术，自动收集和处理整个星座的数据。其主要的创新点在于能够在轨道上处理数据。不仅每个`Blackjack`传感器能够执行机载处理，`PitBoss`还能够从每个单独的`Blackjack`传感器获取数据，将其融合并将其提供给需要的用户，而不需要来自卫星操作员的命令。


    ##### 性能指标


    `Blackjack`项目旨在利用商业公司研发小体积、小质量、低功率、低成本的低地球轨道（`LEO`）卫星星座。`Blackjack`项目通用平台关键指标如表5-3所示。`Blackjack`项目将研发并验证支撑`LEO`卫星组网的关键技术，重点是商业化卫星平台和低成本、可互换、设计周期短、技术更新频繁的军用有效载荷，并对有效载荷进行优化，使其适用于多个卫星平台。`Blackjack`有效载荷关键参数如表5-4所示。最终目标是实现军方有效载荷的高度网络化并且兼具弹性和持久性，能够持续在全球范围内为军方提供最大的超视距遥感、信号和通信功能。


