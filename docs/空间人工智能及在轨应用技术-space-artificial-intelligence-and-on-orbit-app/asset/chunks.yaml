  trans: '

    # 月面视觉导航与测量


    在月面复杂的自然环境下，移动机器人的导航定位有很大难度，目前国外主要采用基于轨道图像、软着陆降落相机图像和车载视觉系统的图像进行匹配定位，以及基于里程计的航位推算法、路标特征匹配法等实现局部定位，但存在算法效率、求解稳定性和定位精度的不足。Johnson
    等人利用惯性测量单元（Inertial Measurement Unit，IMU）获取初始外方位元素与视差图生成等方法，增强了视觉测程的处理效率与算法稳健性；Jones
    等人利用 Kalman 滤波方法将 IMU 数据加入视觉测程定位结果中，修正了定位累积误差。王保丰等人通过站间图像的特征提取与匹配，实现了图像重叠区域的亚像素匹配，利用匹配的结果采用光束法平差实现了巡视器相邻导航位置间的定位，提高了“玉兔号”月球车的视觉定位精度。


    由于光照变化、遮挡、目标形变、摄像机抖动等因素的影响，实现鲁棒的视觉跟踪是一件非常困难的事情。近年来深度学习受到了前所未有的关注，李寰宇等人针对视觉跟踪中运动目标的鲁棒性跟踪问题，将深度学习方法应用于视觉跟踪，提出一种基于多层卷积滤波特征的目标跟踪算法，结合粒子滤波算法实现了目标跟踪。该跟踪算法对光照变化、遮挡、异面旋转、摄像机抖动都具有很好的不变性。李卫针对小样本提出了一种改进的深度信念网络结构，改进的算法在预训练阶段对样本进行降采样，在参数微调阶段引入随机隐退（Dropout）。实验表明，深度信念网络在识别率和耗时方面都有不错的改善。


    视觉测量技术以计算机视觉相关理论为指导，将相机采集的图像作为处理对象，并通过对图像进行分析运算，最后达到获得目标相对于相机的位置和姿态等参数的目的。视觉测量技术可根据相机的数量分为单目视觉测量技术、双目视觉测量技术和多目视觉测量技术。当然，基于双目和多目的视觉系统也可以由一台相机从不同角度拍摄图像或者相机不动而目标运动来实现。相较于单目视觉技术，双目视觉技术利用视差原理能够获得目标的深度信息，而单目视觉技术无法获得目标的深度信息，进而难以进行非合作目标的测量。此外，相较于多目视觉技术，双目视觉技术又具有系统结构配置简单、功耗及成本较低等优势，而且多目系统的配置往往比较复杂。基于上述原因，使得双目视觉测量技术常常用于非合作目标的视觉测量系统中。


    双目立体视觉是计算机视觉中的一个分支。该测量系统一般由两台相机从不同的角度同时获取空间目标不同方位的两幅图像，或者由一台相机在不同时刻、不同位置方位拍摄两幅图像，然后利用视差原理获得目标物体的三维信息，恢复目标三维实景。一般情况下，典型的立体视觉系统由图像获取、相机标定、特征提取、立体匹配、深度确定及三维重建
    6 个部分组成。双目视觉常常应用于机器人视觉、物体三维形貌恢复以及虚拟现实等。目前，国外对双目立体视觉的研究及应用相对较多，尤其是日本。例如，日本奈良先端科学技术大学院大学提出了一种基于双目立体视觉的增强现实系统注册方法，通过动态修正特征点的位置提高注册精度。日本大阪大学研究了一种对运动目标进行近乎实时自适应跟踪的系统，该系统也利用了双目视觉技术。同样，日本东京大学融合了其他传感器获得的姿态信息与双目视觉系统获得的信息，并提出了基于视觉的机器人动态行走仿真导航系统。此外，美国在立体视觉方面也不甘示弱。例如，麻省理工学院研究出了一种传感器融合方法，该方法能够用于智能交通工具中。这种技术先利用雷达系统提供目标的大致深度范围，然后利用双目视觉系统提供较准确的目标深度信息，最后加入一种图像分割算法，实现了高速环境下对视频图像中目标位置的分割。


    在国内，浙江大学根据相机透视成像原理，采用双目视觉测量方法，对多自由度的机械装置实现了高精度且动态的位姿测量。陕西维视数字图像技术有限公司基于双目 CCD
    相机，从相机内参数标定、畸变矫正、双目立体匹配、特征点提取等方面给出算法接口。该公司的双目标定软件 CCAS 采用张正友平面标定法，可以实现微操作系统的参数检测、机器人导航、虚拟现实和三维测量等应用。东南大学研究出一种新的灰度相关多峰值视差绝对值极小化立体匹配方法，能够较精确测量出不规则的三维物体空间坐标，该方法同样是基于双目视觉理论。哈尔滨工业大学对基于视觉的月球车导航系统进行了较深入的研究，提出了改进的立体匹配算法。该算法在精度以及计算速度等方面比传统立体匹配算法更好。此外，哈尔滨工业大学还利用异构双目（所谓异构，即是指固定一个相机，而另一个相机可水平旋转，然后分别安装于机器人的顶部和中下部，能够实现不同位置和角度的观测）活动视觉测量系统实现了足球机器人全自主导航，这种方式比人类视觉更加优越。


    ## 2. 智能遥感技术


    空间光学遥感器能够以不同的时空尺度提供多种地表信息，可直接用于对感兴趣目标的成像探测，它是信息获取的重要手段。目前，对地遥感的工作模式主要有星下点推扫模式、敏捷成像模式和工程组网观测模式
    3 种方式。这些工作模式主要有以下不足：需地面规划/引导成像，突发事件响应能力不足；目标针对性不强，下行数据量巨大而信息量有限；地面解译与信息提取、分发环节耗时较长，信息利用的时效性差。针对以上问题，国内已对智能化遥感载荷系统技术进行了研究。


    吕红等人提出智能化卫星遥感载荷的总体方案及智能专家系统、智能执行系统的方案。卫星遥感载荷方案包括智能专家系统、智能执行系统和智能语义解译系统三大部分。其中，智能专家系统由智能识别模块、智能决策模块和智能进化模块
    3 部分组成。智能执行系统主要指新型遥感器，包括全场感知仪、变焦中/高分辨率成像仪和变光谱分辨率成像仪。智能语义解译系统主要是面对用户的无障碍交流。智能专家系统是遥感器系统的大脑，其通过智能识别模块对全场感知仪预探测得到的数据进行在轨分析，将图像中的几何特征与特征数据库中的特征进行比对，提取出目标特征并进行识别，判断目标的属性。智能决策模块判定目标价值并给出遥感器的最佳成像参数，用于指挥智能执行系统；智能执行系统接收智能专家系统的指令，驱动变焦中/高分辨率成像仪以及变光谱分辨率成像仪，对指定目标进行跟踪探测。同时，智能专家系统的工作需要进行自评价与地面上行评价，通过对历史评价数据的分析，总结归纳出“数值化”的经验，用于指导下次专家系统工作，即智能进化模块。


    尤政等人为了适应未来对地观测卫星的需求、突破相关技术瓶颈、提高遥感器的寿命和可靠性、降低整星质量和功耗、减少整星研制测试周期、获取更高品质的遥感观测图像，提出实时定姿定位高精度一体化智能载荷技术，实现星敏感器、微机械（Micro
    Electro Mechanical Systems，MEMS）陀螺仪、GPS 与高精度遥感相机为一体的智能载荷系统。智能载荷系统采用姿态敏感器与空间相机一体化设计的理念，包括
    2 个星敏感器、1 个惯性测量单元以及相机系统。综合考虑力、热、光等多学科特点，对传统各学科分立式设计仿真流程进行整合，构建协同仿真的一体化平台，设计数据由协同仿真平台统一管理。以高性能成像为优化目标，分属于不同学科的设计需求，依照不同理论体系将众多需求转换为各学科相应的设计输入，每个学科应用各自的设计方法和工具进行设计，同时将结果反馈给协同仿真平台，此平台根据优化策略和目标完成智能载荷结构的自动迭代优化设计。智能载荷姿态敏感单元由微型高精度星敏感器、MEMS
    陀螺仪组合而成，并利用双频高精度 GPS 辅助。智能载荷定姿定位系统采用星敏感器图像与陀螺深耦合的方法对相机姿态进行主动测量。这一技术可提高卫星有效载荷比、空间分辨力、时间分辨率和图像定位精度，实现轻量化、低功耗、较短研制周期和获取高品质遥感图像的目标。智能载荷集高精度实时定姿定位技术、星上数据分析处理、目标识别与跟踪、成像控制、策略调整功能于一体，显著增强对地观测任务的灵活性和适用性，大幅提高在轨成像分辨率和像质。系统将在较少的人工干预下，独立完成并优化航天侦察、测绘等对地观测任务。


    边缘计算对智能遥感载荷的应用有着重要的作用，能极大促进人工智能解决方案的部署。研究边缘计算与智能遥感载荷在多方向的深度融合技术，实现海量数据下复杂需求的实时响应，是全面推进天基物联网智能化建设的必要一环。李维等人在研讨天基边缘智能遥感应用模式的基础上，提出天基边缘智能遥感的总体构想。根据边缘计算与智能遥感技术的发展趋势，大致将天基边缘智能遥感应用分为两个阶段：第一阶段，将遥感图像对目标的自主检测、推理等初级智能算力下沉到边缘智能遥感载荷，满足天基光学遥感云边协同应用需求。云边协同是指云计算中心与边缘端遥感器的协同计算，通过两者协同，能够对众多遥感器获得的数据进行处理及推理，从而在遥感图像中挖掘出更多有用信息。第二阶段，学习算力下沉到边缘智能遥感载荷，使天基边缘智能遥感系统具备天基云计算能力。


    传统的空间光学遥感技术已经难以适应快速、准确、灵活的遥感数据获取和信息产品生产的需求，需要发展工作成像模式优化、信息生产和发送能力快速的智能空间光学遥感技术，将遥感卫星系统设计和地面信息处理的发展统筹考虑。李维等人提出了基于深度学习的智能光学遥感载荷自主设计及智能决策方法。该方法将任务应用的实际过程用合理的数学模型进行描述，通过添加约束变量条件，对自变量进行运算求解，输出最优设计结果；整个智能光学遥感载荷自主设计与智能决策的匹配优化过程，按照数学模型表述分为目标函数、自变量与约束变量
    3 个部分，通过智能决策方法将三者联系起来，实现对任务应用过程的计算和推演；其中探测效果对应目标函数，通过构建目标函数，体现任务对载荷效能的要求。在目标函数中，设置自变量与约束变量；自变量是函数求解的值，在任务应用中对应智能光学遥感载荷的指标，如载荷光学系统口径及焦距、探测谱段、探测器增益、积分时间等；约束变量主要包括卫星平台约束、载荷研制能力约束等，实现对载荷设计与决策的合理性的有效控制。智能遥感载荷总体设计方法从探测效果出发，综合考量探测目标和卫星平台资源，对光学遥感载荷的总体设计进行全面优化，可用于对载荷类型、数量等重要信息做出快速决策，为我国光学遥感器研制提供一种新的合理可行的技术途径。


    ### 3.3.2 空间智能决策


    人工智能的核心是数据到决策的转化。由于卫星系统的远程操控特性，要求卫星系统具有一定的智能决策能力。智能决策侧重于利用智能手段支持任务级、策略级的选择和动作序列制定。在空间探测领域，增加自主能力预示着更多的自主决策用于规划和执行操控行为。进一步来说，是指把人的观察、决策、操控效果，转移到一个机构、过程或系统上，来提高机械装置、电气设备的控制和操作能力。空间系统对智能决策存在的需求方向包括深空探测器对探测目标的自主选择和排序探测、在轨构建系统对构建安装序列的组织、星表建设对建设过程的安排等。随着深空探测不断走向深远，通信时延越来越长，环境不确定性越来越大，对器载平台自主管理、智能自主决策与操作技术的需求愈发迫切。空间智能决策涉及的关键技术包括智能决策支持系统、策略树、知识表示、符号智能、强化学习、深度强化学习、蒙特卡洛搜索法、快速随机搜索树（Rapid-exploration
    Random Tree，RRT）和自适应动态规划等。


    当航天器任务发生变化、出现严重故障或环境存在较大未知扰动时，需要根据新的任务、自身状态和当前环境从飞行方案层面做出调整，以适应当前态势，即需要引入专家信息系统技术及人工智能方法使航天器具有智能决策及自主任务规划能力，可根据现有能力及需求重新规划飞行方案及飞行路径，使之在任务改变、发生故障或存在扰动的情况下仍然可以通过自主决策和规划完成任务。因此，需要研究航天器根据态势智能决策及自主规划技术，具体包括：


    ①专家信息系统的建立及决策算法研究。基于任务需求、自主健康状态评估结果和运行环境，自主选取适用于当前态势的模型、飞行方案及控制方法等，主要包括决策知识的机器学习与表示、航天器智能决策知识库构建技术、智能决策推理等关键技术。


    ②在线自主快速规划方法研究。卫星自主快速规划是在综合考虑卫星资源能力和观测任务要求的基础上，星上自主实现将资源分配给相互竞争的多个任务，并确定任务中各具体活动的起止时间，以排除不同任务之间的资源使用冲突，最大限度满足用户的需求。卫星使用约束与任务需求约束相互制约，因此该问题是个多任务、多约束的复杂组合优化问题，亟需解决兼容点目标和区域目标的任务规划方法、目标的合成观测调度方法、多星及星地一体化联合规划方法等关键技术。


    ### 3.3.3 空间智能操控


    面向未来航天任务控制系统的实时、鲁棒和高精度需求，现有技术仍存在诸多缺陷和挑战：一方面，随着航天任务越来越复杂，空间环境与航天器动力学模型的强非线性以及参数的不确定性对精确控制的影响愈发严重。目前难以离线建立高精度的动力学模型，利用传统技术难以在不确定非线性环境中实现高精度的控制。另一方面，航天任务对星上姿轨控系统的可靠性存在较高要求。姿轨控系统的传感器和机构故障可能直接导致任务的失败。为提高航天器控制性能，国内外专家学者在传统控制架构下引入人工智能技术，提高航天器控制的精度和效率，保证系统可靠性。


    #### 1. 轨迹智能规划制导技术


    轨迹智能规划制导技术可对任务轨迹进行离线或在线的智能规划，然后根据实时的控制误差对轨迹进行在线的智能重规划，对航天器未来一段时间内的运行轨迹进行预测并输出相应的控制指令。其中，人工智能技术根据任务需求以及航天器状态，直接生成或配合常用规划技术生成航天器的控制指令，这些指令包括航天器的发动机开关机以及姿态机动的指令。当前轨迹智能规划制导技术研究主要集中在
    3 个方面，分别为航天器转移轨迹智能规划，航天器进入、下降和着陆（Entry、Descent and Landing，EDL）智能轨迹制导以及巡视器轨迹制导。


    ##### 1）转移轨迹智能规划技术


    对于转移轨迹的智能制导，最先开展离线智能规划技术的研究。Reiter 等人针对空间对抗问题，基于强化学习技术建立脉冲机动优化策略，提高规避机动的可靠性，而随着小推力系统的发展，更多研究聚焦于小推力转移轨迹的智能规划。Zhu
    和 Luo 基于分类深度神经网络和回归深度神经网络提出小推力转移轨迹快速评估方法，用于判断轨迹的可行性以及燃耗最优性。Sullivan 和 Bosanac
    针对多体系统转移轨迹优化问题，基于深度强化学习技术完成时间最优小推力转移轨迹的优化，获得小推力控制策略。此外，针对太阳帆等姿轨耦合推进系统，Song 和 Gong
    利用深层神经网络建立轨道特征映射与转移时间之间的映射，实现太阳帆航天器时间最优转移轨迹的规划和优化。


    对于深空探测任务，为提高深空探测器的自主性，目前已发展了多项在线智能规划技术，使其具备实时的星上轨迹规划能力。Witsberger 和 Longuski 基于递归神经网络建立小推力引力辅助转移轨迹规划方法，利用进化算法辅助神经网络的训练，实现星上在线轨迹规划。Miller
    和 Linares 针对逆行轨道间的轨迹转移问题，基于强化学习技术设计近端策略优化算法求解最优小推力转移轨迹。相比于传统规划方法，这些智能技术更能满足实时性以及可用性的两方面需求。


    ##### 2）进入、下降和着陆智能轨迹制导技术


    由于航天器 EDL 过程中动力学模型存在极大不确定性，因此可根据测量信息对 EDL 轨迹进行在线智能制导，提高规划的精度和鲁棒性。Furfaro 等人以及
    Cheng 等人针对月面自主着陆问题，分别利用深度递归神经网络架构以及迭代深度强化学习算法对燃料最优轨迹进行规划，提高进入制导精度。Furfaro 和 Linares
    还基于强化学习技术对月面下降路径点进行规划，提高着陆精度。由于火星表面存在参数不完备的稀薄大气，对精确 EDL 轨迹制导带来更大的挑战。


    针对 EDL 过程中的参数不确定性，多项研究通过在线识别的方式提高轨迹的鲁棒性。Gaudet 和 Furfaro 基于深度强化学习技术设计了智能制导控制算法，提高航天器对噪声及系统不确定性的鲁棒性。此外，Gaudet
    等人还利用强化学习技术建立自适应在线制导算法，满足 EDL 任务实时性要求，实现燃耗最优的鲁棒轨迹精确制导。Jiang 等人通过整合火星再入与动力下降过程，利用自适应伪谱法同时进行最优再入与动力下降制导，并利用强化学习技术进行制导过程的切换，提高了轨迹制导的最优性、鲁棒性和精度。以上研究表明，强化学习技术也适用于考虑不确定性干扰的
    EDL 轨迹制导规划任务。


    ##### 3）巡视器轨迹智能制导技术


    巡视探测作为深空探测的重要方式，其轨迹的智能制导技术也是当前研究热点之一。Leitner 等人通过设计全反应神经控制器，首次尝试在机器人任务中利用神经网络直接控制执行器和持续时间来优化位置和时间。针对选定的交会对接任务情形、给定的初始位置和边界条件，利用神经控制器重现最优控制。Lan
    等人基于自适应动态规划方法，利用动态神经网络和批判神经网络研究机器人的自主制导控制方法，使其实现目标跟踪、同步和避障等多重功能。通过调整神经网络的权值，获得基于神经网络的最优智能制导律。


    综上，目前基于人工智能技术的航天器轨迹规划制导研究主要利用深度神经网络对动力学环境中的强非线性进行识别和近似，并通过在线学习对参数不确定性进行在线识别。这些研究可归纳为两个主要的研究方向：一是强非线性和不确定性影响下鲁棒轨迹的快速规划研究；二是不确定性影响下轨迹自适应制导研究。


    #### 2. 姿态智能控制技术


    智能控制技术通过对控制参数进行自适应调整，获得比传统控制技术更好的姿态跟踪效果。智能控制技术根据控制指令以及航天器状态，输出执行机构所需的控制信号。这些信号包括姿轨控的轨控发动机和反应控制器的开关机信号以及姿态机动的控制力矩陀螺的控制信号。人工智能技术的引入实现了对动力学模型不确定性的识别和逼近，提高了姿态跟踪控制的精度以及鲁棒性。


    Murugesan 首先结合传统自适应控制技术以及专家系统得到实时智能姿控架构。专家系统在实时约束下进行推理和决策，自适应调整控制参数，提高航天器姿态稳定性。随着以机器学习为代表的人工智能技术的发展，Gates
    等人针对存在不确定性的柔性卫星姿态控制问题，通过在线学习对前馈神经网络进行训练，构建稳定的控制序列使振动最小化，实现姿态自适应控制，最终达到完全稳定。在此基础上，Hu
    和 Xiao 同时还考虑外部干扰以及输入饱和问题，结合 PD 控制及 RBF 神经网络建立智能姿态控制器，提高姿态控制过程中航天器的稳定性。Cheng 和
    Shu 利用深度神经网络控制器代替传统 PID 控制器，实现对卫星姿态的自适应跟踪。同时，他们还利用遗传算法对深度神经网络的节点权值进行优化，以减少训练时间。以上研究表明，人工智能技术可通过结合或替代传统姿态控制技术的方式提高姿态控制精度和鲁棒性。

