    航天器平台能源、算力、数据等资源受限，需要发展适应航天环境的算法、算力。硬件层需要尖端硬件设备；软件层需要高效新型算法。


    全新软硬件设计环境以及系统架构发展，需要引入人工智能及其相关技术。直接深入“前沿技术成果在航天首用”，形成智能航天工程理论，以及从顶层架构上合理规划技术应用方式，大力开拓空间智能软硬件与系统前沿技术。


    航天事业对安全可靠性要求高，当前人工智能技术存在可解释性问题。以深度学习为代表的人工智能算法，还有很多为人们所诟病的问题，如它的收敛性、可解释性、可靠性。很多研究人员正在探索可代替深度学习的更高效的机器学习方法，深度学习之父Hinton也发表过颠覆性的言论，即“深度学习要另起炉灶，彻底抛弃反向传播”。


    因此，亟须开展空间人工智能及在轨应用技术的发展状况、技术需求、核心技术及应用挑战等方面的研究，推动人工智能技术在空间领域的广泛应用。


    # 第二部分 空间人工智能及在轨应用技术发展状况


    空间人工智能及在轨应用技术主要集中在智能信息处理、智能感知与控制、智能人机交互、智能组网与协同等方面。通过阐述上述四大方面的人工智能及在轨应用技术内涵、发展现状及未来趋势，为空间人工智能技术需求奠定基础。


    ## 第2章 空间智能信息处理发展状况


    空间智能信息处理是天基探测提高全链路时效性的核心环节，其主要任务是接收天基探测载荷数据，并利用人工智能技术进行数据处理以及在轨完成全探测场景海量数据下感兴趣目标的在线检测、精准识别与持续跟踪等工作，达到降低下传数据率、提升信息获取实时性、支持天基广域探测与全自主态势感知等目的。


    ### 2.1 技术内涵


    近年来，随着航天技术的发展，对地观测卫星呈现出“数量多、质量升、要求高”的新特点：一是单星数量和星座数量大幅度增加，星上数据多源化、异构化；二是卫星空间分辨率、光谱分辨率和辐射分辨率大幅提高，造成星上数据量爆发式增长；三是自然灾害和军事应用等对卫星信息的快速响应需求与日俱增。这些特征为地面数据处理造成越来越大的压力，传统的卫星信息处理模式已经难以满足用户任务需求。


    为应对上述问题，国内外积极发展卫星智能信息处理技术。与传统信息处理方式相比，智能信息处理的主要能力及应用优势体现在以下几个方面。


    #### 1. 高时效性


    传统的卫星观测任务采取“星上数据获取-星地信息传输-地面信息处理”的运行模式，严重制约了具有高实时性要求任务的完成效率。在轨智能信息处理技术是缩短信息链路、提高任务时效性的有效途径。


    由于我国国土、海洋面积辽阔，地形地貌复杂，自然灾害频发，因此针对气象监测、灾害预警等事件的快速响应是对地观测卫星发展中的一个重要需求。当地表某种灾害发生时，通过空天地一体化智能观测网可以实现协同观测、高速处理，化简了数据同化的难度，从而实现快速聚焦服务，支持应急响应。


    面对紧张动荡的国际局势，军事领域的战术化应用也对星上信息处理提出了高时效性要求。以天基预警系统为例，预警卫星作为系统的核心，根据导弹发射时的目标特征实施监视、跟踪及定位，其预警时效性关乎整个反导作战的成败。预警卫星若具有在轨智能信息处理功能，那么通过星上关键信息筛选和压缩可以大幅减少数据传输量，提髙传输速度，支持信息直传的应用模式可保证对目标信息获取的准确性和传输与处理应用的实时性，为预警任务提供有效支持。


    #### 2. 缓解星上数据存储压力


    中国的遥感卫星地面站资源相对较少，接收的遥感卫星数据种类繁多。解压后平均大小为每天20TB，一年近7PB。遥感数据规模随着辐射校正、几何校正和反射率反演呈指数增长，此时非重复数据存储量将达到20PB。这些海量遥感影像的存储、调用和制作，可以说是一个高耗能行业。然而，用户需要遥感卫星提供的有效信息，而不是大量的遥感数据。


    卫星智能信息处理为遥感数据资源的高效精准利用提供了新途径，即将获取的大量遥感影像通过智能处理转化为在轨有效的目标信息（从数据到信息），以满足遥感应用的要求，同时缓解了遥感卫星数据存储压力，为全球可持续发展、节能减排和温室气体减排做出了贡献。


    #### 3. 支持星座多源数据融合处理


    为满足对特定任务目标需求的快速响应、持续动态监测、大范围监测等数据获取需求，需要更短的重访周期、更大观测覆盖范围的卫星，传统的单星模式已不具备这种能力，继而卫星星座迅速发展。以Ku、Ka频段甚至更高频段的新兴互联网星座计划呈现爆发式增长。美国一网公司One
    Web、美国太空探索技术公司SpaceX、低轨卫星公司LEO Sat，加拿大电信卫星公司TeleSat等纷纷提出新兴互联网星座计划，国外典型低轨通信卫星星座计划发射卫星数量总和超过8
    000颗。


    大规模卫星网络中，基于星上智能信息处理进行多源卫星数据融合，是提升遥感信息获取准确性和稳健性的有效手段。通过对多时相、多角度、多谱段、主被动等多类星载传感器数据进行融合，能够实现信息的有效互补，消除数据间的不确定性，得到比单一数据源更为准确可靠的情报信息。


    #### 4. 满足用户任务多样化需求


    传统的遥感卫星数据服务依赖于大型数据中心。一旦在数据中心收集了所有类型的遥感数据，就可以进行不同层次的标准化图像制作，然后将这些标准化图像分发给行业部门进行特殊信息提取。这种遥感数据的分布和使用模式只适用于主要的政府行业部门。随着遥感技术的发展，对个性化遥感的需求越来越多，对个性化遥感信息服务的需求也越来越多，需要对获取的信息按用户要求进行针对性筛选和处理。


    基于智能信息处理的智能遥感卫星直接面向终端用户，通过优化配置星地数据获取资源、计算资源、存储资源、传输资源、接收处理资源，充分利用星地协同的各类算法，如多源传感器高质量实时成像、高精度实时几何定位、数据智能压缩、典型目标智能检测和变化检测等处理算法，依据不同地面任务信息（地理位置、观测区域大小、目标类型）智能规划星地协同的数据处理模式与流程，实现自动化、智能化的星地协同处理，通过卫星的整体协调，从而减少了大量的中间交互环节，数据可以有序地提供给各级用户，使数据在遥感各个产业阶段得到充分利用。


    ### 2.2 空间智能信息处理发展现状


    #### 2.2.1 国外发展现状


    ##### 1. 国外基于地面算力的智能信息处理


    基于地面算力的遥感大数据智能处理是目前空间信息智能处理主要应用领域。因为不需要考虑空间环境对算力的约束，并且存在较大的应用需求，国外在这方面有大量的研究和应用案例。


    1）Orbital Insight公司


    如图2-1所示，美国Orbital Insight公司利用人工智能技术对遥感影像进行自动化处理和深度分析，从而为国防、安全、环境等领域提供服务。Orbital
    Insight公司在2019年推出了GO地理空间分析平台，通过人工智能融合了卫星图像、合成孔径雷达（SAR）、自动识别系统（AIS）和物联网（IoT）设备的地理空间数据源，为分析人员提供支持，该平台为美国国防部和情报界带来了敏锐的洞察能力。Orbital
    Insight公司使用卷积神经网络来分析遥感图片并识别和量化原油储备容器的大小，使用阴影探测技术（Shadow Detection Technology）计算出油罐中的石油容量。


    ![](images/txt004_1.jpg "pagenumber_ebook=31,pagenumber_book=20")


    图2-1　Orbital Insight公司遥感图像油罐识别（书后附彩插）


    2）天空完美日星公司（SKY Perfect JSAT）


    日本天空完美日星公司（SKY Perfect JSAT）2019年10月宣布与其子公司Satellite Network（SNET公司）将利用低轨道卫星图像提供“高频船舶检测服务”。该项服务通过Planet
    Labs公司的Dove星座拍摄的全球图像，采用人工智能技术和图像识别技术来检测船舶信息（位置、尺寸、时间、船型），通过将拍摄的图像与拍摄时间对应的AIS信息进行叠加，可掌握高频船舶动向，从而有效地提高了船舶运营和物流管理。SKY
    Perfect JSAT集团不仅在海洋上利用AI技术开展高频检测服务，今后还将以相同的方式将业务扩大至陆地（建筑物、道路等），开展房地产、经济指标确认等更广泛的服务。


    3）Descartes Labs公司


    美国的Descartes Labs公司收集了海量农业相关的卫星图像数据，通过人工智能分析图像信息，寻找其与农作物生长之间的关系，可以对农作物的产量做出精准预测，其预测的玉米产量比以往的预测准确率高出99%。此外，Descartes
    Labs公司还开发了一款软件，可以在几分钟内探测到山火。该项目利用人工智能每隔几分钟分析美国政府的气象卫星发回的图像，并在烟雾和红外线数据中找出细微的变化，进而能够预测火灾将在何处发生，以及火势将扩大到何种程度。


    另外，Descartes Labs公司还提出了一种基于视觉编码二值化以及基于哈希的大规模比特采样检索方法来实现有效的目标特征抽取和高速视觉检索，最终在包含近20亿的美国大陆图像数据库中实现了0.1
    s的视觉目标检索速度。图2-2展示了一些检索结果，最左侧是查询图像，其他为图像检索结果。可以看到对于风力发电机、体育场等都得到了良好的检索结果。


    ![](images/txt004_2.jpg "pagenumber_ebook=32,pagenumber_book=21")


    图2-2　Descartes Labs图像检索


    4）SpaceKnow公司


    SpaceKnow公司成立于2013年，是一家为消费市场和金融机构提供基于地理空间分析的智能数据公司，其主要手段就是遥感大数据智能分析。该公司可以通过卫星遥感监测路面汽车、火车、游轮、港口、机场、工厂、农作物以及居民住宅等情况，并形成相关分析报告，作为投资决策参考。


    此外，美国的Terrapattern、Mavrx、DroneData、Precisionhawk等公司通过卫星遥感数据结合深度学习等技术进行企业盈亏预测、储油分析、农作物估产等，服务于各行业及政府部门和普通用户。


    ##### 2. 国外在轨智能信息处理


    总体来看，目前在轨信息处理方面还没有普遍应用人工智能技术，其发展主要体现在实时数据处理和软件定义卫星领域。


    1）美国EO-1卫星


    2000年，NASA发射的“地球观测一号”（EO-1）卫星展示了21世纪地球观测智能卫星的新水平。EO-1搭载了自动科学实验设备（Autonomous Sciencecraft
    Experiment，ASE），可使航天器能够自主地进行科学探测并自主响应。ASE系统包含以下功能：


    ①星上科学算法模块，可以进行对地观测和在轨的数据分析，探测感兴趣的科学事件，如云检测、变化检测；


    ②CASPER模块，可以根据星上科学算法模块的结果制定或调整任务操作计划，包括向地面传输数据；


    ③执行系统，执行并监视CASPER产生的计划，且能够对指令做出一定的调整以改善计划的执行和响应。


    通过这些星上数据处理技术，可实现在轨的科学数据分析、突发事件快速响应、计划的执行和监视。


    2）美国NEMO卫星


    2000年，美国海军发射的海洋地球测绘观测卫星（NEMO），主要任务是论证超光谱成像对表征浅海战斗空间环境的重要性，其能够进行超光谱数据的实时星上处理和压缩，并实时地以战术下行链路将观测结果传送到战场。


    NEMO卫星上首次配备了实时自适应光学识别系统（Optical Real-Time Adaptive Signature Identification System，ORASIS），该系统具有自动自适应影像识别能力，提高了分析处理遥感数据的效率。ORASIS的核心是由32个SHARC
    21060型DSP数字信号处理器构成的星上高速影像并行处理器阵列（Imaging On-Board Processor，IOBP），其能够胜任数据接收、影像分析、影像压缩等高速影像处理任务。ORASIS可以从实际物体影像中识别光谱响应，通过顺序地分析影像中的每一种光谱，丢弃重复的光谱，使用凸面几何学和正射投影技术分析每个观测到的影像，并利用一组矢量来表示，将其组合能重构观测到的光谱。ORASIS在NEMO卫星上的处理减少了地面数据开发和影像特征识别处理的环节，并能在星上形成数据产品。


    3）美国TacSat-3卫星


    2009年5月，美国空军实验室的“战术卫星”TacSat-3发射升空。TacSat-3是美国“作战快速响应航天”计划的第2颗卫星，主要利用海洋数据遥测微卫星链路验证星上实时数据处理能力，具有为战场指挥官和作战人员快速提供对目标区域进行侦察与监视图像的能力，能够在10
    min内完成从发起观测任务到作战人员接受信息的全过程。


    TacSat-3在星上加装了星上自主处理器（Application Independent Processor，AIP）、通用数据链卫星通信有效载荷；在地面配备了虚拟任务操作中心、多用途战术地面站和战术终端。AIP可实现目标区域小范围内的遥感数据高光谱影像处理，通用数据链可实现遥感数据对战术地面站和战术终端的直接下传。由于便携式战术终端支持的数据传输带宽有限，为了可以直接接收战区目标影像，下传的目标影像必须足够小。借助星上处理设备的实时影像处理功能，可以提取目标区域的小面积影像，然后依靠窄带数传系统实现目标区数据的接收。


    4）欧洲“量子”卫星


    2015年，欧洲通信卫星公司Quantum和欧洲空间局签订合同，开始研制新型欧洲通信量子卫星，迈出了基于软件定义重构卫星功能工程实践的关键一步。该卫星属于“完全软件定义卫星”，可通过软件驱动，实现多种性能的在轨调整：一是卫星覆盖范围的调整。利用电子调节、波束成形、跳变波束等技术，根据需要调节波束覆盖区域形状，单个波束既可以覆盖任意形状的一个区域，也可以覆盖多个独立的区域。二是工作频率的调整。利用可编程信道在上/下行链路频段（12.75～14.80
    GHz和10.7～12.75 GHz）范围内动态调整工作频段，频谱使用率从86%提高到98%以上。三是信号功率可进行动态协调，减少覆盖区域内外界噪声对信号的干扰。


    5）美国洛马公司“智能卫星”


    洛马公司的“智能卫星”（SmartSat）项目于2019年正式宣布。该卫星采用软件定义卫星架构，可通过软件“推送”改变和增加卫星功能。用户可以通过推送添加功能并分配新任务，就像在智能手机上添加应用程序一样方便。另外，SmartSat在轨处理的主要特征能力还包括以下方面：


    ①实现自主检测和网络威胁防御技术，可定期更新星载网络防御软件以应对新威胁；


    ②具有自我诊断和快速重置能力，以更高的精度诊断问题，并在需要的时候相互支持，从而显著增强抗毁性；


    ③星载计算机采用虚拟机管理程序安全容纳虚拟机，可在同一台计算机中同时运行多个服务器，最大限度地提高内存利用率、星上处理能力和网络带宽；


    ④首次利用星载多核处理器，其强大的在轨数据处理能力可减少带宽需求，为未来的天基数据中心奠定技术基础。


    #### 2.2.2 国内发展现状


    ##### 1. 国内基于地面算力的智能信息处理


    国内在基于地面算力的遥感大数据智能信息处理方面起步较晚，总体上与国外先进水平还有较大差距，但也有很多优秀的产品和突破性的进展。


    1）ImageInfo通用大型遥感测图业务平台


    ImageInfo通用大型遥感测图业务平台由中国测绘科学研究院研发，是集通用遥感图像处理、GIS分析、GPS定位等于一体的遥感数据处理环境，主要由遥感数据处理业务流程控制系统、遥感数据集群处理通用平台、高分辨率遥感影像集群式处理系统Pixel
    Grid、Feature Station遥感影像智能解译工作站等专业子系统组成。


    其中，Feature Station遥感影像智能解译工作站以航片、卫片、无人机影像、合成孔径雷达等遥感影像为主要数据源，通过网络化协同作业建立了立体量测和平面采编一体化测图模式。


    2）SenseEarth智能遥感影像解译平台


    北京市商汤科技开发有限公司推出的SenseRemote智能遥感影像解译算法，通过深度学习技术，智能化地完成道路、建筑等信息提取、用地分类、飞机船舶等目标检测，地区变化监测等，为自然资源规划、生态保护、商业决策、应急减灾等提供可靠客观的数据支撑。


    2019年7月，北京市商汤科技开发有限公司发布了中国首个在线智能遥感解译平台SenseEarth，通过运用SenseRemote人工智能技术对地表卫星影像进行识别和分析。SenseEarth智能遥感影像解译平台是一款面向公众公开的遥感影像浏览及解译在线工具，用户只需登录网站，便可在线体验基于卫星影像的道路提取、舰船检测、土地利用分类等人工智能解译功能。不仅如此，用户还可以浏览历史影像，以月度为单位，对不同时段的影像进行变化检测，快速感知城市的变迁与发展。


    3）“苍灵”遥感大数据智能分析系统


    中国科学院空天信息创新研究院的研究人员开发了分布式软硬件一体化的深度学习智能提取系统———“苍灵”遥感大数据智能分析系统。“苍灵”系统由后端分布式训练和管理平台、前端信息提取与综合分析平台组成。通过可视化的方式，降低了模型训练操作难度，简化了程序配置逻辑，综合展示训练与预测结果，有助于优化训练、结果分析、产品生产等业务。


    基于“苍灵”系统，可以实现几十种灾害关键要素的快速高精度提取，服务于灾害事故监测、灾害风险评估、应急监测、损失评估、灾后恢复重建，为灾害损失快速与综合评估提供重要的信息数据，为应急救助和应急管理提供决策支持。


    ##### 2. 国内在轨智能信息处理


    国内在卫星在轨智能信息处理方面，典型应用案例有“天智一号”卫星、“珞珈三号”01星、“吉林一号”卫星等。


    1）“天智一号”卫星


    “天智一号”卫星是由中科院软件所牵头，中科院微小卫星创新研究院、航天九院771所、中科院光电院、中科院西光所等单位参与研制，整星质量约27 kg，运行在500
    km高度的太阳同步轨道，是“天智”系列的首颗技术验证星。2018年11月20日7时40分，“天智一号”卫星在酒泉卫星发射中心搭载发射升空，成功进入预定轨道。


    “天智一号”卫星是中国首颗软件定义卫星。其核心是一个小型高性能星载云计算平台，支持有效载荷即插即用、应用软件按需加载，可以通过上注不同的应用软件，让卫星完成不同的任务。在轨运行的半年时间里，已经通过软件上注的方式成功开展了星箭分离成像、自主请求式测控、空间目标成像等10多项在轨试验，涉及智能测运控、智能信息处理等多个方面。


    “天智一号”卫星的成功发射开启了我国用软件定义方法在航天领域开展理论研究和工程实践的先例。软件定义卫星的设计理念将有效推动硬件资源虚拟化、系统软件平台化、应用软件多样化的智能卫星发展。


    2）“珞珈三号”01星


    “珞珈三号”01星是武汉大学联合航天东方红卫星有限公司等单位联合研制的一颗光学智能遥感卫星。在轨实时智能处理功能是“珞珈三号”01星的核心功能之一，通过在星上配置可扩展智能信息处理平台实现遥感数据的在轨按需、实时和智能处理。

    '
  trans: '


    航天器平台能源、算力、数据等资源受限，需要发展适应航天环境的算法、算力。硬件层需要尖端硬件设备；软件层需要高效新型算法。


    全新软硬件设计环境以及系统架构发展，需要引入人工智能及其相关技术。直接深入“前沿技术成果在航天首用”，形成智能航天工程理论，以及从顶层架构上合理规划技术应用方式，大力开拓空间智能软硬件与系统前沿技术。


    航天事业对安全可靠性要求高，当前人工智能技术存在可解释性问题。以深度学习为代表的人工智能算法，还有很多为人们所诟病的问题，如它的收敛性、可解释性、可靠性。很多研究人员正在探索可代替深度学习的更高效的机器学习方法，深度学习之父
    Hinton 也发表过颠覆性的言论，即“深度学习要另起炉灶，彻底抛弃反向传播”。


    因此，亟须开展空间人工智能及在轨应用技术的发展状况、技术需求、核心技术及应用挑战等方面的研究，推动人工智能技术在空间领域的广泛应用。


    # 第二部分 空间人工智能及在轨应用技术发展状况


    空间人工智能及在轨应用技术主要集中在智能信息处理、智能感知与控制、智能人机交互、智能组网与协同等方面。通过阐述上述四大方面的人工智能及在轨应用技术内涵、发展现状及未来趋势，为空间人工智能技术需求奠定基础。


    ## 第 2 章 空间智能信息处理发展状况


    空间智能信息处理是天基探测提高全链路时效性的核心环节，其主要任务是接收天基探测载荷数据，并利用人工智能技术进行数据处理以及在轨完成全探测场景海量数据下感兴趣目标的在线检测、精准识别与持续跟踪等工作，达到降低下传数据率、提升信息获取实时性、支持天基广域探测与全自主态势感知等目的。


    ### 2.1 技术内涵


    近年来，随着航天技术的发展，对地观测卫星呈现出“数量多、质量升、要求高”的新特点：一是单星数量和星座数量大幅度增加，星上数据多源化、异构化；二是卫星空间分辨率、光谱分辨率和辐射分辨率大幅提高，造成星上数据量爆发式增长；三是自然灾害和军事应用等对卫星信息的快速响应需求与日俱增。这些特征为地面数据处理造成越来越大的压力，传统的卫星信息处理模式已经难以满足用户任务需求。


    为应对上述问题，国内外积极发展卫星智能信息处理技术。与传统信息处理方式相比，智能信息处理的主要能力及应用优势体现在以下几个方面。


    #### 1. 高时效性


    传统的卫星观测任务采取“星上数据获取-星地信息传输-地面信息处理”的运行模式，严重制约了具有高实时性要求任务的完成效率。在轨智能信息处理技术是缩短信息链路、提高任务时效性的有效途径。


    由于我国国土、海洋面积辽阔，地形地貌复杂，自然灾害频发，因此针对气象监测、灾害预警等事件的快速响应是对地观测卫星发展中的一个重要需求。当地表某种灾害发生时，通过空天地一体化智能观测网可以实现协同观测、高速处理，化简了数据同化的难度，从而实现快速聚焦服务，支持应急响应。


    面对紧张动荡的国际局势，军事领域的战术化应用也对星上信息处理提出了高时效性要求。以天基预警系统为例，预警卫星作为系统的核心，根据导弹发射时的目标特征实施监视、跟踪及定位，其预警时效性关乎整个反导作战的成败。预警卫星若具有在轨智能信息处理功能，那么通过星上关键信息筛选和压缩可以大幅减少数据传输量，提髙传输速度，支持信息直传的应用模式可保证对目标信息获取的准确性和传输与处理应用的实时性，为预警任务提供有效支持。


    #### 2. 缓解星上数据存储压力


    中国的遥感卫星地面站资源相对较少，接收的遥感卫星数据种类繁多。解压后平均大小为每天 20TB，一年近 7PB。遥感数据规模随着辐射校正、几何校正和反射率反演呈指数增长，此时非重复数据存储量将达到
    20PB。这些海量遥感影像的存储、调用和制作，可以说是一个高耗能行业。然而，用户需要遥感卫星提供的有效信息，而不是大量的遥感数据。


    卫星智能信息处理为遥感数据资源的高效精准利用提供了新途径，即将获取的大量遥感影像通过智能处理转化为在轨有效的目标信息（从数据到信息），以满足遥感应用的要求，同时缓解了遥感卫星数据存储压力，为全球可持续发展、节能减排和温室气体减排做出了贡献。


    #### 3. 支持星座多源数据融合处理


    为满足对特定任务目标需求的快速响应、持续动态监测、大范围监测等数据获取需求，需要更短的重访周期、更大观测覆盖范围的卫星，传统的单星模式已不具备这种能力，继而卫星星座迅速发展。以
    Ku、Ka 频段甚至更高频段的新兴互联网星座计划呈现爆发式增长。美国一网公司 One Web、美国太空探索技术公司 SpaceX、低轨卫星公司 LEO Sat，加拿大电信卫星公司
    TeleSat 等纷纷提出新兴互联网星座计划，国外典型低轨通信卫星星座计划发射卫星数量总和超过 8 000 颗。


    大规模卫星网络中，基于星上智能信息处理进行多源卫星数据融合，是提升遥感信息获取准确性和稳健性的有效手段。通过对多时相、多角度、多谱段、主被动等多类星载传感器数据进行融合，能够实现信息的有效互补，消除数据间的不确定性，得到比单一数据源更为准确可靠的情报信息。


    #### 4. 满足用户任务多样化需求


    传统的遥感卫星数据服务依赖于大型数据中心。一旦在数据中心收集了所有类型的遥感数据，就可以进行不同层次的标准化图像制作，然后将这些标准化图像分发给行业部门进行特殊信息提取。这种遥感数据的分布和使用模式只适用于主要的政府行业部门。随着遥感技术的发展，对个性化遥感的需求越来越多，对个性化遥感信息服务的需求也越来越多，需要对获取的信息按用户要求进行针对性筛选和处理。


    基于智能信息处理的智能遥感卫星直接面向终端用户，通过优化配置星地数据获取资源、计算资源、存储资源、传输资源、接收处理资源，充分利用星地协同的各类算法，如多源传感器高质量实时成像、高精度实时几何定位、数据智能压缩、典型目标智能检测和变化检测等处理算法，依据不同地面任务信息（地理位置、观测区域大小、目标类型）智能规划星地协同的数据处理模式与流程，实现自动化、智能化的星地协同处理，通过卫星的整体协调，从而减少了大量的中间交互环节，数据可以有序地提供给各级用户，使数据在遥感各个产业阶段得到充分利用。


    ### 2.2 空间智能信息处理发展现状


    #### 2.2.1 国外发展现状


    ##### 1. 国外基于地面算力的智能信息处理


    基于地面算力的遥感大数据智能处理是目前空间信息智能处理主要应用领域。因为不需要考虑空间环境对算力的约束，并且存在较大的应用需求，国外在这方面有大量的研究和应用案例。


    1）Orbital Insight 公司


    如图 2-1 所示，美国 Orbital Insight 公司利用人工智能技术对遥感影像进行自动化处理和深度分析，从而为国防、安全、环境等领域提供服务。Orbital
    Insight 公司在 2019 年推出了 GO 地理空间分析平台，通过人工智能融合了卫星图像、合成孔径雷达（SAR）、自动识别系统（AIS）和物联网（IoT）设备的地理空间数据源，为分析人员提供支持，该平台为美国国防部和情报界带来了敏锐的洞察能力。Orbital
    Insight 公司使用卷积神经网络来分析遥感图片并识别和量化原油储备容器的大小，使用阴影探测技术（Shadow Detection Technology）计算出油罐中的石油容量。


    ![](img/txt004_1.jpg "pagenumber_ebook=31,pagenumber_book=20")


    图 2-1　Orbital Insight 公司遥感图像油罐识别（书后附彩插）


    2）天空完美日星公司（SKY Perfect JSAT）


    日本天空完美日星公司（SKY Perfect JSAT）2019 年 10 月宣布与其子公司 Satellite Network（SNET 公司）将利用低轨道卫星图像提供“高频船舶检测服务”。该项服务通过
    Planet Labs 公司的 Dove 星座拍摄的全球图像，采用人工智能技术和图像识别技术来检测船舶信息（位置、尺寸、时间、船型），通过将拍摄的图像与拍摄时间对应的
    AIS 信息进行叠加，可掌握高频船舶动向，从而有效地提高了船舶运营和物流管理。SKY Perfect JSAT 集团不仅在海洋上利用 AI 技术开展高频检测服务，今后还将以相同的方式将业务扩大至陆地（建筑物、道路等），开展房地产、经济指标确认等更广泛的服务。


    3）Descartes Labs 公司


    美国的 Descartes Labs 公司收集了海量农业相关的卫星图像数据，通过人工智能分析图像信息，寻找其与农作物生长之间的关系，可以对农作物的产量做出精准预测，其预测的玉米产量比以往的预测准确率高出
    99%。此外，Descartes Labs 公司还开发了一款软件，可以在几分钟内探测到山火。该项目利用人工智能每隔几分钟分析美国政府的气象卫星发回的图像，并在烟雾和红外线数据中找出细微的变化，进而能够预测火灾将在何处发生，以及火势将扩大到何种程度。


    另外，Descartes Labs 公司还提出了一种基于视觉编码二值化以及基于哈希的大规模比特采样检索方法来实现有效的目标特征抽取和高速视觉检索，最终在包含近
    20 亿的美国大陆图像数据库中实现了 0.1 s 的视觉目标检索速度。图 2-2 展示了一些检索结果，最左侧是查询图像，其他为图像检索结果。可以看到对于风力发电机、体育场等都得到了良好的检索结果。


    ![](img/txt004_2.jpg "pagenumber_ebook=32,pagenumber_book=21")


    图 2-2　Descartes Labs 图像检索


    4）SpaceKnow 公司


    SpaceKnow 公司成立于 2013 年，是一家为消费市场和金融机构提供基于地理空间分析的智能数据公司，其主要手段就是遥感大数据智能分析。该公司可以通过卫星遥感监测路面汽车、火车、游轮、港口、机场、工厂、农作物以及居民住宅等情况，并形成相关分析报告，作为投资决策参考。


    此外，美国的 Terrapattern、Mavrx、DroneData、Precisionhawk 等公司通过卫星遥感数据结合深度学习等技术进行企业盈亏预测、储油分析、农作物估产等，服务于各行业及政府部门和普通用户。


    ##### 2. 国外在轨智能信息处理


    总体来看，目前在轨信息处理方面还没有普遍应用人工智能技术，其发展主要体现在实时数据处理和软件定义卫星领域。


    1）美国 EO-1 卫星


    2000 年，NASA 发射的“地球观测一号”（EO-1）卫星展示了 21 世纪地球观测智能卫星的新水平。EO-1 搭载了自动科学实验设备（Autonomous
    Sciencecraft Experiment，ASE），可使航天器能够自主地进行科学探测并自主响应。ASE 系统包含以下功能：


    ①星上科学算法模块，可以进行对地观测和在轨的数据分析，探测感兴趣的科学事件，如云检测、变化检测；


    ②CASPER 模块，可以根据星上科学算法模块的结果制定或调整任务操作计划，包括向地面传输数据；


    ③执行系统，执行并监视 CASPER 产生的计划，且能够对指令做出一定的调整以改善计划的执行和响应。


    通过这些星上数据处理技术，可实现在轨的科学数据分析、突发事件快速响应、计划的执行和监视。


    2）美国 NEMO 卫星


    2000 年，美国海军发射的海洋地球测绘观测卫星（NEMO），主要任务是论证超光谱成像对表征浅海战斗空间环境的重要性，其能够进行超光谱数据的实时星上处理和压缩，并实时地以战术下行链路将观测结果传送到战场。


    NEMO 卫星上首次配备了实时自适应光学识别系统（Optical Real-Time Adaptive Signature Identification System，ORASIS），该系统具有自动自适应影像识别能力，提高了分析处理遥感数据的效率。ORASIS
    的核心是由 32 个 SHARC 21060 型 DSP 数字信号处理器构成的星上高速影像并行处理器阵列（Imaging On-Board Processor，IOBP），其能够胜任数据接收、影像分析、影像压缩等高速影像处理任务。ORASIS
    可以从实际物体影像中识别光谱响应，通过顺序地分析影像中的每一种光谱，丢弃重复的光谱，使用凸面几何学和正射投影技术分析每个观测到的影像，并利用一组矢量来表示，将其组合能重构观测到的光谱。ORASIS
    在 NEMO 卫星上的处理减少了地面数据开发和影像特征识别处理的环节，并能在星上形成数据产品。


    3）美国 TacSat-3 卫星


    2009 年 5 月，美国空军实验室的“战术卫星”TacSat-3 发射升空。TacSat-3 是美国“作战快速响应航天”计划的第 2 颗卫星，主要利用海洋数据遥测微卫星链路验证星上实时数据处理能力，具有为战场指挥官和作战人员快速提供对目标区域进行侦察与监视图像的能力，能够在
    10 min 内完成从发起观测任务到作战人员接受信息的全过程。


    TacSat-3 在星上加装了星上自主处理器（Application Independent Processor，AIP）、通用数据链卫星通信有效载荷；在地面配备了虚拟任务操作中心、多用途战术地面站和战术终端。AIP
    可实现目标区域小范围内的遥感数据高光谱影像处理，通用数据链可实现遥感数据对战术地面站和战术终端的直接下传。由于便携式战术终端支持的数据传输带宽有限，为了可以直接接收战区目标影像，下传的目标影像必须足够小。借助星上处理设备的实时影像处理功能，可以提取目标区域的小面积影像，然后依靠窄带数传系统实现目标区数据的接收。


    4）欧洲“量子”卫星


    2015 年，欧洲通信卫星公司 Quantum 和欧洲空间局签订合同，开始研制新型欧洲通信量子卫星，迈出了基于软件定义重构卫星功能工程实践的关键一步。该卫星属于“完全软件定义卫星”，可通过软件驱动，实现多种性能的在轨调整：一是卫星覆盖范围的调整。利用电子调节、波束成形、跳变波束等技术，根据需要调节波束覆盖区域形状，单个波束既可以覆盖任意形状的一个区域，也可以覆盖多个独立的区域。二是工作频率的调整。利用可编程信道在上/下行链路频段（12.75～14.80
    GHz 和 10.7～12.75 GHz）范围内动态调整工作频段，频谱使用率从 86%提高到 98%以上。三是信号功率可进行动态协调，减少覆盖区域内外界噪声对信号的干扰。


    5）美国洛马公司“智能卫星”


    洛马公司的“智能卫星”（SmartSat）项目于 2019 年正式宣布。该卫星采用软件定义卫星架构，可通过软件“推送”改变和增加卫星功能。用户可以通过推送添加功能并分配新任务，就像在智能手机上添加应用程序一样方便。另外，SmartSat
    在轨处理的主要特征能力还包括以下方面：


    ①实现自主检测和网络威胁防御技术，可定期更新星载网络防御软件以应对新威胁；


    ②具有自我诊断和快速重置能力，以更高的精度诊断问题，并在需要的时候相互支持，从而显著增强抗毁性；


    ③星载计算机采用虚拟机管理程序安全容纳虚拟机，可在同一台计算机中同时运行多个服务器，最大限度地提高内存利用率、星上处理能力和网络带宽；


    ④首次利用星载多核处理器，其强大的在轨数据处理能力可减少带宽需求，为未来的天基数据中心奠定技术基础。


    #### 2.2.2 国内发展现状


    ##### 1. 国内基于地面算力的智能信息处理


    国内在基于地面算力的遥感大数据智能信息处理方面起步较晚，总体上与国外先进水平还有较大差距，但也有很多优秀的产品和突破性的进展。


    1）ImageInfo 通用大型遥感测图业务平台


    ImageInfo 通用大型遥感测图业务平台由中国测绘科学研究院研发，是集通用遥感图像处理、GIS 分析、GPS 定位等于一体的遥感数据处理环境，主要由遥感数据处理业务流程控制系统、遥感数据集群处理通用平台、高分辨率遥感影像集群式处理系统
    Pixel Grid、Feature Station 遥感影像智能解译工作站等专业子系统组成。


    其中，Feature Station 遥感影像智能解译工作站以航片、卫片、无人机影像、合成孔径雷达等遥感影像为主要数据源，通过网络化协同作业建立了立体量测和平面采编一体化测图模式。


    2）SenseEarth 智能遥感影像解译平台


    北京市商汤科技开发有限公司推出的 SenseRemote 智能遥感影像解译算法，通过深度学习技术，智能化地完成道路、建筑等信息提取、用地分类、飞机船舶等目标检测，地区变化监测等，为自然资源规划、生态保护、商业决策、应急减灾等提供可靠客观的数据支撑。


    2019 年 7 月，北京市商汤科技开发有限公司发布了中国首个在线智能遥感解译平台 SenseEarth，通过运用 SenseRemote 人工智能技术对地表卫星影像进行识别和分析。SenseEarth
    智能遥感影像解译平台是一款面向公众公开的遥感影像浏览及解译在线工具，用户只需登录网站，便可在线体验基于卫星影像的道路提取、舰船检测、土地利用分类等人工智能解译功能。不仅如此，用户还可以浏览历史影像，以月度为单位，对不同时段的影像进行变化检测，快速感知城市的变迁与发展。


    3）“苍灵”遥感大数据智能分析系统


    中国科学院空天信息创新研究院的研究人员开发了分布式软硬件一体化的深度学习智能提取系统———“苍灵”遥感大数据智能分析系统。“苍灵”系统由后端分布式训练和管理平台、前端信息提取与综合分析平台组成。通过可视化的方式，降低了模型训练操作难度，简化了程序配置逻辑，综合展示训练与预测结果，有助于优化训练、结果分析、产品生产等业务。


    基于“苍灵”系统，可以实现几十种灾害关键要素的快速高精度提取，服务于灾害事故监测、灾害风险评估、应急监测、损失评估、灾后恢复重建，为灾害损失快速与综合评估提供重要的信息数据，为应急救助和应急管理提供决策支持。


    ##### 2. 国内在轨智能信息处理


    国内在卫星在轨智能信息处理方面，典型应用案例有“天智一号”卫星、“珞珈三号”01 星、“吉林一号”卫星等。


    1）“天智一号”卫星


    “天智一号”卫星是由中科院软件所牵头，中科院微小卫星创新研究院、航天九院 771 所、中科院光电院、中科院西光所等单位参与研制，整星质量约 27 kg，运行在
    500 km 高度的太阳同步轨道，是“天智”系列的首颗技术验证星。2018 年 11 月 20 日 7 时 40 分，“天智一号”卫星在酒泉卫星发射中心搭载发射升空，成功进入预定轨道。


    “天智一号”卫星是中国首颗软件定义卫星。其核心是一个小型高性能星载云计算平台，支持有效载荷即插即用、应用软件按需加载，可以通过上注不同的应用软件，让卫星完成不同的任务。在轨运行的半年时间里，已经通过软件上注的方式成功开展了星箭分离成像、自主请求式测控、空间目标成像等
    10 多项在轨试验，涉及智能测运控、智能信息处理等多个方面。


    “天智一号”卫星的成功发射开启了我国用软件定义方法在航天领域开展理论研究和工程实践的先例。软件定义卫星的设计理念将有效推动硬件资源虚拟化、系统软件平台化、应用软件多样化的智能卫星发展。


    2）“珞珈三号”01 星


    “珞珈三号”01 星是武汉大学联合航天东方红卫星有限公司等单位联合研制的一颗光学智能遥感卫星。在轨实时智能处理功能是“珞珈三号”01 星的核心功能之一，通过在星上配置可扩展智能信息处理平台实现遥感数据的在轨按需、实时和智能处理。


