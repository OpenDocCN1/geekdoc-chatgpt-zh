    ## 3. 算法流程分解

    主要处理流程及任务分配如图 13-8 所示。处理单元`FPGA`通过光纤模块或`Serdes`接口开始接收载荷图像数据，接收到数据后`FPGA`流水完成形态学增强等图像预处理工作，将预处理结果通过`SRIO`总线发送给`DSP`，`DSP`进行图像分割、连通域标记、`HOG`处理等基于形态学的可疑目标提取处理以及目标切片生成功能，处理的图像数据可根据需要进行降分辨率处理，在不影响检测效果的情况下，可有效降低处理数据量。`DSP`根据检测出来的可疑目标坐标在原始分辨率上进行目标切片截取，并将目标切片数据通过`SRIO`总线发送给`FPGA`。


    ![](img/txt017_9.jpg "pagenumber_ebook=276,pagenumber_book=265")


    图 13-8　主要处理流程及任务分配


    `FPGA`和`GPU`配合完成基于卷积神经网络的深度学习处理，对目标切片进行精分析，以达到目标识别分类。其中，`FPGA`主要负责卷积层并行加速处理，`GPU`主要负责模式配置以及分类层处理。目标切片处理完成后，`DSP`对分类结果进行判定：若是感兴趣目标，则将该目标切片和目标类型打包通过交换单元发送给存储单元进行存储；若不是感兴趣目标，根据事先设定的规则可选择将该目标切片扔掉或通过`LVDS`接口发送给数传单元进行存储。


    ### 1）深度网络算法模型分析

    如图 13-4 所示，标准`VGG-16`模型包含 13 个卷积层和 3 个全连接层，使用不断增加的 3×3 卷积层，并通过 2×2 最大池化（`Maxpooling`）来减小运算规格。首先是
    13 个卷积层，其次是两个 4 096 节点和 1 个 1 000 节点的全连接层，最后是一个`Softmax`分类器，能够实现 1 000 类目标分类。同时，最重要的是`VGG-16`模型运算规律性强，便于实现硬件资源的并行流水加速。


    `VGG-16`模型参数量和运算量巨大。如表 13-2 所示，`VGG-16`模型参数量达到 138 M 个，若采用单精度浮点形式，参数数据量将达到 500
    多兆，输入图像大小若为 224×224，模型运算量将达到 15.5 `GOPs`（1 `OPs`等于 1 次乘法和加法操作）。


    表 13-2　`VGG-16`模型网络参数及计算量分析


