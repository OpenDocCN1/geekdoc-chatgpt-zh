    ### 12.2.2 模型轻量化

    近年提出的以深度卷积神经网络为代表的深度网络模型，在遥感图像分类、目标检测方面表现卓越，为提升星上信息智能处理的准确性和智能性提供了条件。


    近期，美国国防部高级研究计划局（`DARPA`）发文认为以深度网络为基础的人工智能是全球信息领域潜在的、具有变革性的技术，将其作为未来几年的发展重点。深度神经网络的应用除了需要丰富的训练数据集、强大的计算平台和多样的训练策略外，其令人叹服的能力主要归因于可学习的、庞大的参数集，而且研究表明通过增加网络的深度和宽度可以很容易地提升图像处理算法的准确性。但是，性能越好的深度网络模型往往需要消耗更多的存储空间、计算单元和通信带宽。然而，星载设备的质量、体积、功耗、计算资源受限，使得在星上部署应用深度网络面临着更大的困难和挑战。


    在此背景下，从神经网络的计算架构入手，研究适合星载应用的深度网络轻量化方法，在基本不降低模型计算准确性的前提下，支持资源受限环境下的星载计算平台的高效使用。


    #### 1. 深度神经网络轻量化结构设计技术

    如何在给定精度下设计小型的网络计算结果以满足星载的能力约束，即神经网络的轻量化结果设计。通过分析，造成目前深度学习网络计算量或参数量较大的主要原因在于卷积层的计算量较大，即为卷积核参数数量×输入通道数量×输出通道数量。因此，在设计轻量化网络时，主要采用如下设计技术。


    ##### 1) 小尺寸的卷积计算技术

    这里将决定某一层输出结果中一个元素所对应的输入层的区域大小定义为感受野（`Receptive Field`）。图 12-9 给出了对于感受野同为 7 的情况下，使用
    7×7 的卷积核需要 2 层网络可以得到，而使用 3×3 的卷积核，则需要 4 层网络才能够得到。虽然网络层数增加了，但是使用 7×7 的卷积核则包含 49
    个参数，而使用 3×3 的卷积核则包含 3×（3×3）=27 个参数，大概为 7×7 卷积核的一半。因此，对卷积神经网络而言，采用通过小尺寸卷积层的堆叠可以替代大尺寸卷积层，使得高层特征图的感受野大小不变，而参数量减少一半。


    ![](img/txt016_21.jpg "pagenumber_ebook=236,pagenumber_book=225")


    图 12-9 小尺寸卷积层与大尺寸卷积层对比示意图


    （a）大尺寸卷积层；（b）小尺寸卷积层


    ##### 2) 分组卷积计算技术

    常规卷积对输入整体进行卷积操作，如图 12-10 所示。分组卷积中的分组是针对输入通道而言，输入通道被分为两组。对于每组输入进行卷积操作后，将分组得到的输出拼接后作为整体输出。


    ![](img/txt016_22.jpg "pagenumber_ebook=236,pagenumber_book=225")


    图 12-10 常规卷积与分组卷积对比示意图


    当输入为`W1×H1×C1`（`W1`代表`Width`，指输入通道宽度；`H1`代表`Height`，指输入通道高度；`C1`代表`Channel`，指输入通道数量），卷积核大小为`h×w`，一共有`C2`个，则输出数据为`H2×W2×C2`。对于常规卷积和分组卷积，其参数量和计算量如表
    12-6 所示，其中分组数量为`g`。


    表 12-6 常规卷积与分组卷积参数量与计算量


    ![](img/txt016_23.jpg "pagenumber_ebook=237,pagenumber_book=226")


    如表 12-6 所示，分组卷积有效减少了结构的参数量和计算量，但存在分组通道间信息不流通的问题。为此，可通过增加用 1×1 卷积，将所有通道的结果进行累加，避免信息丢失的问题。


    ##### 3) 跨层结构优化技术

    以`Densenet`网络结构为例，基础设计特征提取的最小单元，在特征提取的最小单元中首先使用逐点分组卷积对输入特征图进行降维，以便减少深度可分离卷积的计算量，然后利用多通道间特征图交叉重排，最后利用深度可分离卷积与逐点分组卷积的组合完成特征提取，与输入特征图进行特征拼接。特征拼接方式为将特征提取最小单元的输出与输入特征图组合成为多通道特征图，再通过多通道卷积对多通道特征图提取特征，实现特征融合。


    每一组最小单元之间都有跳跃连接，每一组最小单元的输入都是前面所有层输出的并集，而该最小单元所学习的特征图也会被直接传给其后面所有最小单元作为输入，实现特征的重复利用。


    考虑到大量使用轻量化最小结构与提高深度可分离卷积核的数量可以增加平均精准度，但同时会增加模型参数数量，降低检测速度。因此，轻量化最小结构需要根据实际工程应用场景进行设计，达到`mAP`和`FPS`的平衡。


    #### 2. 深度神经网络权重参数轻量化技术

    通常，深度神经网络存在过参数化和冗余度高的问题，这将引起大量的计算代价和存储空间浪费。另一个问题是计算过程中的能量消耗，主要体现在存储器访问。例如，采用 45
    nm 工艺`CMOS`技术，一次 32 比特浮点加法将消耗 0.9 pJ，而一次 32 比特`SRAM`缓存和`DRAM`访问将分别消耗 5 pJ 和 640
    pJ，分别是加运算的 5.5 倍和 711.1 倍。因此，大规模神经网络不适宜在片上存储器上进行存储。以 20 fps 的频率运行一个 10 亿连接的深度神经网络，仅`DRAM`访问就需要（20Hz）（1G）（640pJ）=12.8W
    的能量消耗，这对于星载应用来说是完全无法承受的。该部分技术路线如图 12-11 所示。


    ![](img/txt016_24.jpg "pagenumber_ebook=238,pagenumber_book=227")


    图 12-11 深度网络轻量化处理的 3 个阶段：修剪、量化和编码


    由图 12-11 可见，深度网络轻量化处理主要包括修剪、量化与编码 3 个阶段，其目标是通过这 3 个阶段处理，在精度损失 1%以内的前提下，深度网络存储量压缩率在
    20 倍以上。下面分别从这 3 个方面对技术方案进行详述。


    ##### 1) 基于特征图统计的深度网络修剪技术

    如前所述，修剪技术很早就被用于神经网络的压缩，现有文献成功地将几种大规模网络进行修剪，其参数量可以以任意比例进行压缩且精度损失可控。拟采用基于特征图统计的修剪方法，大致可以分为以下
    3 个步骤：


    ①针对深度神经网络中的特征层，计算网络模型中特征图的统计特征；

    ②根据统计特征构造评判准则；

    ③将不符合评判准则的特征图及其相关联的参数层进行移除。


    进一步可以采用两种格式对所获得的压缩稀疏网络结果进行存储：压缩稀疏行（`CSR`）和压缩稀疏列（`CSC`）。两种策略均需要存储（2a+n+1）个数，其中
    a 是非零元个数，n 是行或列数。为了进一步进行压缩，采用相对索引而非绝对位置存储，并采用固定比特数（如 3 比特）对卷积层相对索引进行存储。对大于量化位数能表示的相对索引，采用零填充方法，如图
    12-12 所示。举例来说，当采用 3 比例存储时，若差分量超过 8，超出部分用 0 进行填充。


    ![](img/txt016_25.jpg "pagenumber_ebook=239,pagenumber_book=228")


    图 12-12 采用相对索引表示的矩阵稀疏性


    在借鉴了`Caffe`的`Lenet-5`模型的基础上，构造了如下`Lenet`网络：`Conv1`为卷积层，有 20 个特征图，使用 5×5 卷积核，卷积间隔为
    1×1；`Conv2`有 50 个特征图，使用 5×5 卷积核，卷积间隔为 1×1；在每个卷积层之后紧接着一个池化层，采用最大值池化；`Ip1`为全连接层，共有
    500 个隐含神经元，`Ip2`是全连接输出层，有 10 个神经元。和传统的`Lenet-5`网络相比，减少了网络的深度，拓展了网络的大小，准确率也有所提升，经过前期训练，达到了
    99.63%的准确率。


    由于`Lenet`卷积网络的训练过程存在着前向与后向传播，所以对于参数级别的压缩是全局的。对全局阈值的值进行了测试，分别采取 0.01、0.1、0.15、0.16
    进行重新训练，并对训练网络进行测试，发现当阈值为 0.16 时，准确率略微出现了下降，为 99.29%，所以选择 0.15 作为参数级别的修剪阈值。


    从表 12-7 中可以看到，卷积层的压缩率不高，而全连接层则实现了很高的压缩。表明卷积核中的参数对于网络的稳定表达式是不可或缺的，其中的权值在信息传递中起到了很大的作用；全连接层的参数实现了特征的分类，可以看到不同的特征对于分类器的表达效果是不同的，在卷积层到全连接层的变换中，实现了最大的参数压缩，表明众多的特征在分类器的表达中并没有被选中，产生了相当的冗余。经过参数级别的压缩，可以将`Lenet`网络的尺寸压缩到原来的
    8.23%，压缩了 12 倍，且在这个过程中，没有产生额外的精度损失。


    表 12-7 `Lenet`参数修剪压缩情况


    ![](img/txt016_26.jpg "pagenumber_ebook=239,pagenumber_book=228")


    ##### 2) 权值量化与权值共享技术

    如图 12-13 所示，为了进一步压缩修剪后的神经网络，通过权值量化与权值共享途径实现。首先，对权值进行聚类，并计算共享权值；其次，对共享权值进行精调。假设神经网络某层有`a`个输入和`d`个输出神经元，权值为`a×d`的矩阵。若将权值量化成`a`类（2
    比特量化），则所有相同等级的权值被量化成了同一个无符号整数，因此我们仅需要存储少量的共享权值的索引。在精调阶段，首先拟按聚类等级进行分组，然后再将分组后的梯度相加，最后与上一迭代步的中心向量相减就可以得到精调的共享权值。在前期实验过程中发现，对于修剪后的`AlexNet`，当分别采用
    8 比特和 5 比特分别量化卷积层和其他层时，可以得到无任何精度损失的压缩结果。理论上来说，压缩率可计算如下：


    ![](img/txt016_27.jpg "pagenumber_ebook=240,pagenumber_book=229")


    式中，`n`和`b`分别为网络的连接数和量化比特数；`k`为共享权值数量。


    ![](img/txt016_28.jpg "pagenumber_ebook=240,pagenumber_book=229")


    图 12-13 共享权值的量化和中心精调框图


    拟采用`k-均值`聚类法对每层中共享权值进行聚类，聚类到同一个类别权值将使用相同权值。具体来说，令初始权值`W={w1，w2，…，wn}`，通过`k-均值`聚类后共聚成`k`类（`n≫k`）：`C={c1，c2，…，ck}`，目标是最小化如下类内平方误差之和：


    ![](img/txt016_29.jpg "pagenumber_ebook=240,pagenumber_book=229")


    （1）共享权值初始化问题。


    众所周知，中心初始化的好坏将影响聚类质量，进一步影响网络预测精度。拟采用 3 种初始化方法，即随机法、基于密度的方法和线性初始化方法。


    ①随机法将从数据集中随机选择`k`个观测作为初始中心向量。这样将会使初始点分布在密度分布的峰值周边。


    ②基于密度的方法将线性地在累积分布函数（`C DF`）上取点，再向权值方向投影得到初始中心向量。这种方法亦会使中心点在密度函数峰值周边聚集，但相比于随机法会更分散些。


    ③线性初始化方法在原始权值的分布区间[`min`，`max`]上线性地选取中心点，它不考虑权值的分布情况且比前两种方法更加分散。


    通常来说，网络中的较大权值的重要性更大，但数量较少。因此，对于前两种方法来说，极少有中心点具有较大绝对值，可以预测其性能比线性初始化方法略差，结果有待实验验证。


    （2）前向传播与反向更新。


    如前所述，`k-均值`聚类的中心即是共享权值。在网络的前向传播与反向更新阶段都存在查找权值表的过程，为此我们为每个连接存储一个共享权值表索引。在反向更新阶段，共享权值的更新依照梯度进行。具体来说，令`L`表示代价函数，`Wij`表示第`i`列第`j`行权值，其中心索引号为`Iij`，该层的第`k`个中心为`Ck`。中心梯度可计算如下：


    ![](img/txt016_30.jpg "pagenumber_ebook=241,pagenumber_book=230")


