    13.4　智能语义情报生成


    未来智能应用形态下需要遥感卫星智能化、自主化运行，网络化、体系化协同，环境高效感知和智能认知等应用需求。为了更好地满足日益复杂的任务需求，提升对探测区域的感知能力，不再单单是对目标的检测识别，更要基于相关场景的目标检测结果，构建高层次的语义表征。除此之外，还要具备对时间/空间变化状态的预测能力，并能够与高层语义融合生成具有时效、准确的情报表述，从而可以为全域的态势感知、人机交互协同理解提供有效的支撑。


    13.4.1　基于区域生长对抗网络的遥感场景目标检测


    高分辨率遥感影像中包括多个不同种类的目标，且各目标之间存在尺度差异和多样的位置信息。此外，在不同分辨率下，同一种类物体的特征也存在一定差异。在进行内容理解与描述前，有必要对场景中的物体进行检测识别，确保能够对遥感场景进行精确的描述。GAN即生成对抗网络（Generative
    Adversarial Networks）是由两个相互竞争的生成网络和判别网络组成的。生成模型的工作使生成看起来是自然真实的、和原始数据相似的数据；判别模型的工作使判断给定的数据看起来是自然的还是人为伪造的。生成器试图欺骗判别器，判别器则努力不被生成器欺骗。通过交替优化训练，两种模型都能得到提升，直到到达一个“假冒产品和真实产品无法区分”的点。生成器和判别器的目的是生成与训练集中一些十分接近的数据。人们利用GAN可以实现很多种类的生成工作，它能够产生现实中的图片、三维模型、视频和其他更有价值的成果。


    在对遥感场景进行目标检测的任务中，需要得到场景中各目标所在的区域，可以理解为遥感场景的区域类标图。针对生成对抗网络进行基于区域的目标检测，提出区域生成对抗网络框架，其中包含两个分类器模型：一个分类器用于对单个场景进行基于区域的分类；另外一个分类器也称为对抗网络，用于区别类标图和预测出来的概率图。引入对抗网络的目的是使得到的概率预测图更符合真实的类标图。将需要训练的遥感场景记为{x0，yn，n=1，…，N}，sx表示预测出来的概率图，a（x，y）表示对抗网络预测表J是X的真实标签图的概率，θx和θv分别表示生成器和判别器的参数，那么损失函数可以定义为


    ![](images/txt017_81.jpg "pagenumber_ebook=335,pagenumber_book=324")


    其中，L mce（y1，y）表示预测的概率图y1和真实标签图y之间的多类交叉熵损失，而L bce（z1，z）=-\[zln z1+（1-z）ln（1-z1）\]表示两类交叉熵损失。借鉴基础生成对抗网络的训练思想，本模型的训练也是通过迭代训练生成模型和判别模型来实现的。训练对抗网络的过程等同于如下优化表达式，其物理意义是使得对抗模型对概率图和真实类标图的判别能力更强。


