- raw: "人工智能这一概念源自1956年的达特茅斯会议（Dartmouth Conference）。本部分主要从人工智能概念、发展时期和趋势以及空间系统智能化需求等几个方面展开，引出空间人工智能及在轨应用技术。\n\
    \n\uFEFF\n\n第1章　绪　论\n\n1.1　引言\n\n如图1-1所示，人工智能（Artificial Intelligence）是一门由计算机科学、统计学、脑神经学、社会科学等学科融合发展起来的交叉学科，以知识表示、自然推理和搜索方法、机器学习等学科研究为代表，包含算法（Algorithm）、数据（Data）、计算（Compute）三要素。\n\
    \n![](images/txt002_1.jpg \"pagenumber_ebook=14,pagenumber_book=3\")\n\n图1-1　人工智能学科关系\n\
    \n人工智能三要素关系如图1-2所示。\n\n![](images/txt002_2.jpg \"pagenumber_ebook=14,pagenumber_book=3\"\
    )\n\n图1-2　人工智能三要素关系\n\n通过人工智能技术，可以使机器胜任一些通常需要人类智能才能完成的复杂工作，从而极大简化人工操作，提高生产效率，改进生产关系，是极具颠覆性的前沿技术。\n\
    \n如图1-3所示，人工智能自20世纪50年代诞生至今，经历了三次高潮、两次寒冬的洗礼。21世纪初开始至今，依托以深度学习为代表的人工智能技术，人工智能开始了第三次高潮。随着高性能计算技术快速发展以及互联网和大数据广泛应用，形成面向不同应用场景的海量数据。围绕语音识别、机器视觉、知识推理、自动驾驶等领域的人工智能技术大量涌现，已形成规模化应用。\n\
    \n![](images/txt002_3.jpg \"pagenumber_ebook=15,pagenumber_book=4\")\n\n图1-3　人工智能发展阶段\n\
    \n人工智能在各个领域的成功运用为空间系统设计及智能化发展奠定了良好基础，开展基于人工智能的在轨应用技术研究迫在眉睫。目前，世界各国的航天机构都在深入挖掘人工智能与航天技术的可结合性，持续推进人工智能在未来空间任务中的应用，以便大幅提升空间任务执行的自主性。\n\
    \n人工智能在轨应用面临的瓶颈问题主要包含资源强受限、数据样本少、无法接受黑盒子状态、可靠性高等。长期来看，彻底解决人工智能在轨计算、传输、存储、能耗等问题需要前沿技术革新。技术革新依赖于时间与人类科技发展，但是宇航领域对智能化的需求已迫在眉睫。\n\
    \n1.2　人工智能发展状况\n\n1.2.1　人工智能简介\n\n1955年美国Mc Carthy等人在研究计划中提出了人工智能的概念，随后在1956年的达特茅斯学院暑期论坛上首次提出。经过60多年的发展和积淀，伴随着互联网、大数据、云计算和新型传感器等技术的发展，人工智能正引发可产生链式反应的科学突破，催生一批颠覆性技术、培育经济发展新动能、塑造新型产业体系，加速新一轮科技革命和产业变革。\n\
    \n人工智能的内涵包括脑认知基础、机器感知与模式识别、自然语言处理与理解、知识工程4个方面，外延即机器人与智能系统，作为第5个方面，其具体内容如下：\n\n\
    ①脑认知基础是指认知活动的机理研究，即人脑如何从微观、介观、宏观、宇观等不同尺度上实现记忆、计算、交互、学习、推理等认知活动，以及如何模拟这些认知活动，实现类脑认知。\n\
    \n②机器感知与模式识别是指脑的视、听等知觉研究，即如何用机器完成图形和图像、语音等感知信息处理和识别任务。\n\n③自然语言处理与理解是指研究人类自然语言的语境、语用、语义和语构，包括语音和文字的计算机输入，大型词库、语料和文本的智能检索，机器语音的生成、合成和识别，不同语言之间的机器翻译和同传等。\n\
    \n④知识工程是指研究知识的表示、获取、推理、决策和应用，包括机器定理证明、专家系统、机器博弈、数据挖掘和知识发现、不确定性推理、领域知识库、数字图书馆、知识图谱等大型知识工程。\n\
    \n⑤机器人与智能系统是指智能应用技术，涵盖各种各样工业、农业、医用、军用和服务机器人，还有智能驾驶、智能交通、智能制造、智能家居、智能环保、智能网络、智能管理、智慧医疗、智慧农业、智慧金融等。\n\
    \n空间人工智能，简单来说，就是指航天器自主实现智能感知、决策、协同并且具备学习的能力。在2005—2007年期间，美国航空航天学会下属的空间操作与支持技术委员会，对当时航天器自主性及智能性的工业水平进行了调研和分析，总结了来自全球12个不同的组织、102个不同的智能自主航天器系统/空间机器人的相关情况。其中，航天器智能自主等级划分如表1-1所示。\n\
    \n表1-1　航天器智能自主等级划分\n\n![](images/txt002_4.jpg \"pagenumber_ebook=16,pagenumber_book=5\"\
    )\n\n续表\n\n![](images/txt002_5.jpg \"pagenumber_ebook=17,pagenumber_book=6\")\n\
    \n针对上述6个等级划分可知，随着等级逐步提高，航天器的自主性和智能性也随之提高。在调查的全部102个空间系统中，有28个航天器没有采用人工智能技术，有74个采用了不同等级的人工智能技术。其中，34个处于第2等级，18个处于第3等级，12个处于第4等级，3个处于第5等级，7个处于第6等级。目前，我国空间飞行器所处等级基本在第2～4等级，个别在轨卫星已经具备自主任务规划能力。\n\
    \n1.2.2　人工智能发展时期\n\n人工智能发展可以概括为萌芽期、启动期、消沉期、突破期、发展期、高速发展期6个时期。\n\n1.萌芽期\n\n1936年，英国数学家阿兰·图灵（Alan\
    \ M.Turing）在论文“理想计算机”中提出的图灵机模型以及1950年在“计算机能思维吗”一文中提出机器能够思维的论述；1946年美国科学家莫奇利（J.W.Mauchly）和埃克特（P.Eckert）等人共同发明了世界上第一台电子数字计算机埃尼阿克（ENIAC），为AI研究奠定硬件基础；之后贡献最卓著的是冯·诺伊曼，目前世界上占统治地位的仍是冯·诺伊曼架构计算机；美国数学家维纳（N.Wiener）控制法的创立、美国数学家香农（C.E.Shannon）信息论的创立等，都为人工智能学科的诞生和发展做出巨大贡献。\n\
    \n2.启动期\n\n1956年夏季，在美国达特茅斯学院举办的“人工智能夏季研讨会”上，第一次正式使用人工智能这一术语，从而开创了人工智能学科，并有了人工智能的第一个发展期。这段时期研究的主要方向是机器翻译、定理证明、博弈等。这一时期的代表性工作：1956年，Newell和Simon等人在定理证明工作中首先取得突破，开启了以计算机程序来模拟人类思维的道路；1960年，Mc\
    \ Carthy建立了人工智能程序设计语言LISP。\n\n一系列的成功使人工智能科学家们认为可以研究和总结人类思维的普遍规律并用计算机模拟它的实现，乐观地预计可以创造一个万能的逻辑推理体系。\n\
    \n3.消沉期\n\n当人们进行了比较深入的研究以后，发现人工智能研究碰到的困难比原来想象的要多得多。\n\n例如，Samuel的下棋程序当了州冠军之后没能进一步当上全国冠军，更不要说世界冠军；过去十年，计算机并未证明出人类还未证明出的定理；从神经生理学角度研究人工智能的人发现他们遇到了几乎是不可逾越的困难，以电子线路模拟神经元及人脑都没有成功。这一切都说明，由于20世纪50年代的盲目乐观和期望值过高，没有充分估计困难，没有抓住科学本质。因此，20世纪60年代中期至70年代初期人工智能受到了各种责难，进入了消沉期。\n\
    \n4.突破期\n\n很多人工智能技术研究人员并没有灰心，而是扎扎实实地工作，不仅是加强基础理论研究，而且在专家系统、自然语言理解、计算机视觉等方面做出了很有成效的工作，进入了突破期。\n\
    \n这一时期的代表性成果：ELIEA———1968年J.Weizenbaum在美国麻省理工学院设计的基于“模式匹配”的自然语言系统；DENDRAL———1970年斯坦福大学计算机科学系E.A.Feigenbaum和化学家C.Djerassi以及J.Leberberg等人研制出的世界上第一个专家系统；MACSMA———麻省理工学院的C.Engleman，W.Martin和J.Moses研制成的基于知识的数学专家系统；MYCIN———E.H.Shortliffe等人于1972—1974年研制、1976年发表的医疗专家系统。另外还有，1973年R.C.Schamk提出的概念从属理论；1974年Minsky提出表示知识的另一种方法框架理论，又称画面理论等。\n\
    \n5.发展期\n\n1977年第五届国际人工智能联合会会议上，Feigenbaum教授在一篇题为“人工智能的艺术：知识工程课题及实例研究”的特约文章中系统地阐述了专家系统的思想并提出“知识工程”的概念。\n\
    \n至此，人工智能的研究又有了新的转折点，即从获取智能的基于能力的策略，变成了基于知识的方法研究。知识作为智能的基础开始受到重视，知识工程的方法很快渗透入人工智能各个领域，促使人工智能从实验室研究走向实际应用。由于理论研究和计算机软硬件的飞速发展，各种专家系统、自然语言处理系统等人工智能实用系统开始商业化并进入市场，而且取得了较好的经济效益和社会效益，展示了人工智能应用的广阔前景。\n\
    \n6.高速发展期\n\n2006年，深度学习被提出，促使人工智能再次突破性发展。\n\n2010年，随着移动互联网快速发展，人工智能应用场景开始增多。\n\
    \n2012年，深度学习在语音和视觉识别实现突破，人工智能商业化高速发展。\n\n在移动互联网、大数据、超级计算、传感网、脑科学等新理论新技术以及经济社会发展强烈需求的共同驱动下，人工智能加速发展，呈现出深度学习、跨界融合、人机协同、群智开放、自主操控等新特征。\n\
    \n当前人工智能产业发展迅猛，但主要是基于计算机视觉/图像识别、自然语言处理/语音识别、自主规划/决策等的应用，包括智能金融、智慧医疗、智能机器人、自动驾驶、智能安防、智慧零售、智慧教育、智能家居、智慧城市、智能制造等。新一代人工智能以深度学习为典型代表，但深度学习不等于人工智能。\n\
    \n1.2.3　人工智能发展趋势\n\n人工智能主要有符号主义、连接主义、行为主义三大学派，下面简要进行介绍。\n\n初级阶段（20世纪50—80年代）：以符号主义学派为主，主要为手工知识，启发式算法→专家系统→知识工程。\n\
    \n中级阶段（20世纪80年代至今）：以连接主义学派为主，主要为统计学习，人工神经网络、深度学习等。\n\n高级阶段（21世纪初至未来）：以行为主义学派为主，主要为情境适应，自适应自学习控制、进化计算、分布式智能、大数据的产生与积累等。\n\
    \n当前人工智能的发展是基于连接学派理论，主要驱动要素是爆炸式增长的数据、持续提升的运算力、不断优化的算法模型以及资本与技术的深度耦合，主要特征是通过计算技术实现感知、认知、分析、决策、学习和行动等人类智慧，主要技术包括计算机视觉、机器学习、自然语言处理、机器人技术、语音识别等，目前在智能医疗、金融、教育、交通、安防、家居、制造等领域得到广泛应用，在无人驾驶、智能机器人等方面发展迅速。\n\
    \n其中，可以明确说明的是“深度学习”并不是人工智能的同义词，而是促进了人工智能领域脑科学、神经计算、量子计算、生物智能等前沿新技术的发展。当前，人工智能以连接主义学派为主导，下面主要以深度学习技术为代表的连接主义学派展开论述。\n\
    \n基于深度学习的人工智能知识图谱如图1-4所示。\n\n![](images/txt002_6.jpg \"pagenumber_ebook=20,pagenumber_book=9\"\
    )\n\n图1-4　基于深度学习的人工智能知识图谱\n\n基于深度学习的人工智能算法模型发展趋势如图1-5所示。\n\n![](images/txt002_7.jpg\
    \ \"pagenumber_ebook=20,pagenumber_book=9\")\n\n图1-5　基于深度学习的人工智能算法模型发展趋势\n\n当前，各大科技公司均在人工智能领域投入大量人力、物力，使得人工智能得以蓬勃发展。\n\
    \n如图1-6所示，人工智能由学术驱动向应用驱动转化、弱人工智能向强人工智能转化，机器智能将从感知、记忆、存储向认知、自主学习、决策与执行进阶。\n\n![](images/txt002_8.jpg\
    \ \"pagenumber_ebook=21,pagenumber_book=10\")\n\n图1-6　人工智能发展趋势\n\n人工智能发展趋势的具体表现：\n\
    \n①大数据成为人工智能持续快速发展的基石；\n\n②文本、图像、语音等信息实现跨媒体交互；\n\n③基于网络的群体智能技术开始萌芽；\n\n④自主智能系统成为新兴发展方向；\n\
    \n⑤人机协同正在催生新型混合智能形态。\n\n1.3　空间系统智能化需求\n\n1.3.1　空间人工智能概念\n\n空间领域人工智能是指人工智能的相关理论、技术与方法在空间领域的物理规律、技术、知识各层面融合以及与航天器设计、研制、生产、应用全周期融合的“专用人工智能”。\n\
    \n面向未来，智能航天器是指模拟人脑自然智能“信息感知、记忆思维、学习适应、行动驱动”的架构模型，形成具有“自感知、自记忆、自思维、自学习、自适应、自行动、自进化”的“七自”能力的空间智能航天器。\n\
    \n空间领域目前涉及的人工智能内容一般属于“+AI”，即由传统成熟的产业主动地引进人工智能技术，主要用于对当下固有流程的改造和优化，是正常的技术迭代和升级。未来智能航天器实现智能的核心是学习人类的弹性思维，以“AI+”技术为核心驱动，倾向于思考技术能做什么，重新设计产品、方案或工作模式，从而对行业产生颠覆性的影响。\n\
    \n未来空间智能航天器具有“七自”能力等特征，能够为用户提供智能自主服务，在功能层面、实现层面、表观层面具有以下典型特征：\n\n①功能层面：将智能感知、智能决策、智能操作称作空间智能航天器的“三元素”。\n\
    \n②实现层面：需要以信息物理深度融合的智能化体系架构、智能软件和智能硬件作为支撑。\n\n③表观层面：空间智能航天器具备的“类人技能”具有多样性，航天系统在结构、信息交互等方面具有多层性。\n\
    \n1.3.2　空间人工智能需求\n\n目前，世界各国的航天机构都在持续推进人工智能在未来空间任务中的应用，以便大幅提升空间任务执行的自主性。\n\n在人工智能领域的研究过程中，DARPA将人工智能技术的发展分解为3个明确阶段：第一阶段是“描述”，目标是开发出使用基于规则的系统的人工智能平台。目前该阶段已经实现，这类人工智能平台已经成为诸如Turbo\
    \ Tax等商业产品的核心基础。第二阶段是“识别”，以目前主流的机器学习系统为核心，能够对关注目标进行分类并将其海量数据转化为可执行信息，以此减少分析人员的工作量。尽管该阶段的技术从20世纪70年代就已经出现，但仍需大量工作来不断完善。第三阶段是“解释”，主要工作是增加人工智能平台的背景和可信度，这也是人工智能未来的发展方向。\n\
    \n目前，DARPA尚未完成第二阶段的技术开发工作。尽管DARPA在多个人工智能项目中取得了一定成果，但技术缺乏鲁棒的支撑基础，导致无法在安全关键环境中独立应用第二阶段技术。为此，DARPA为下一代人工智能项目设置了3个主要目标，分别是提高第二阶段人工智能技术的鲁棒性、积极将第二阶段人工智能系统应用到新程序中，以及进一步探索第三阶段的人工智能技术。\n\
    \n依据美国国防高级研究计划局对AI技术3个阶段的定义，当前我国国内研究状态处于第一阶段“描述”到第二阶段“识别”的过渡阶段。空间人工智能及在轨应用技术几乎包含了人工智能技术的方方面面，这不仅仅是航天系统的工作，也需要所有参与人工智能研究的企业、高校、科研院所共同努力，共同推进其发展。因此，需要深入研究空间人工智能及在轨应用技术现状、需求，以及基础、共性及应用等关键技术。\n\
    \n空间任务具有发射成本高、卫星价值高、维修困难、任务复杂、环境恶劣（高真空、高辐射、高温差）、距离遥远、无法身临其境、人工辅助、响应迟缓等显著特点，人工智能技术具有广阔的应用需求。借助人工智能技术推动空间技术实现从自动化-自主化-智能化的跨越，具备天地低质异构数据自感知、空间目标特征天地关联自学习、目标意图主动感知与自决策、群体智能等能力，达到降低操作运行成本、提升任务质量和安全性、增强效能扩大回报、提高可靠性和灵活性等。\n\
    \n围绕感知、认知、沟通、推理、决策等人类智能要素，设计可实现近似人类智能行为的空间智能系统，使飞行器具备“会看、会说、会听、会思考”的能力，可以随时随地接受用户定制任务，自主决策、自主协同完成任务，为用户提供灵活、连续、稳定服务，提升使用体验。\n\
    \n随着人工智能算法和应用技术的日益发展，开展人工智能在轨应用技术研究已提上日程。未来，利用新一代人工智能方法，实现空间智能系统数据实时获取与分析、情报生成与推送、任务评估与决策的自主智能。\n\
    \n空间人工智能及在轨应用技术的发展，必将引发链式突破，推动航天器向新一代智能化加速发展。\n\n1.3.3　空间人工智能发展机遇\n\n人工智能引领未来卫星平台颠覆性创新是必然趋势。人工智能支撑卫星系统技术为航天器智能自主能力的提升，提供了丰富的技术储备，是下一个十年智能卫星平台设计的首要发展方向之一。\n\
    \n人工智能技术将有力提升卫星系统的效能：一是有效提升卫星系统的智能感知与识别能力；二是有力提升卫星平台的智能规划与决策能力；三是全方位提升卫星平台智能群博弈对抗能力；四是多手段提升卫星平台智能空间探测能力。\n\
    \n卫星智能技术联合优势力量借力提升。十九大报告指出， “推动互联网、大数据、人工智能和实体经济深度融合”。我国人工智能相关研发产出的数量和质量有很大提升，技术成果和技术拓展等可成功应用于智能卫星平台。\n\
    \n人工智能技术将开拓空间领域天地一体的全新工作格局。在天地协同发展的过程中，一方面，在开展航天器智能化研究的同时，开展地面系统智能化研究，包括地面智能指挥控制决策、地面智能人机交互等，推动智能空间攻防系统天地一体化同域、跨域协同发展。另一方面，航天器和地面操控工作能够“智能自主”且实现“整合设计”，提高飞行和地面交互工作的可操作性，即“整合设计”，是一个可以提高到战略高度的问题，可以减少彼此的建设成本和风险。发展空间领域学习进化等智能手段，直面全新工作模式，即“星群+同域/跨域+协同+天地”。\n\
    \n人工智能技术发展将全面推动空间领域的生态产业结构升级换代。人工智能技术将成为新时期全面推动空间领域的生态产业结构升级换代的催化剂与核心支撑，从航天器系统预研、设计、研制生产、集成测试、试验验证、在轨运行与应用等各阶段，带动技术发展与创新。\n\
    \n空间技术与人工智能结合，将重塑航天体系，开创卫星全新应用场景。未来十至二十年，人工智能技术将在空间领域广泛、快速应用，对于新一代弹性化空间体系建设、自主感知、操控与智能协同技术、实时探测与先进空间指挥控制技术等领域的发展，产生深远的影响。\n\
    \n基于人工智能手段重构卫星平台功能与性能，直面未来弹性变化与需求。未来卫星平台的发展具有以下4个趋势：一是平台可执行空间任务的基本能力趋向成熟，智能自主的多方应变能力亟待开拓，要求航天器具有在轨自主生存能力；二是对卫星平台系统操控的时效性、安全性和稳定性要求更高；三是面向多载荷复杂探测、博弈对抗空间攻防、非合作目标在轨操控等的应用能力全方位提升；四是任务日益复杂多变，平台需具有学习泛化、聚散分布、集群协同、高效可靠等基本能力。"
  fmt: '

    人工智能这一概念源自1956年的达特茅斯会议（Dartmouth Conference）。本部分主要从人工智能概念、发展时期和趋势以及空间系统智能化需求等几个方面展开，引出空间人工智能及在轨应用技术。


    # 第1章　绪论


    ## 1.1 引言

    如图1-1所示，人工智能（Artificial Intelligence）是一门由计算机科学、统计学、脑神经学、社会科学等学科融合发展起来的交叉学科，以知识表示、自然推理和搜索方法、机器学习等学科研究为代表，包含算法（Algorithm）、数据（Data）、计算（Compute）三要素。


    ![](images/txt002_1.jpg "pagenumber_ebook=14,pagenumber_book=3")


    图1-1　人工智能学科关系


    人工智能三要素关系如图1-2所示。


    ![](images/txt002_2.jpg "pagenumber_ebook=14,pagenumber_book=3")


    图1-2　人工智能三要素关系


    通过人工智能技术，可以使机器胜任一些通常需要人类智能才能完成的复杂工作，从而极大简化人工操作，提高生产效率，改进生产关系，是极具颠覆性的前沿技术。


    如图1-3所示，人工智能自20世纪50年代诞生至今，经历了三次高潮、两次寒冬的洗礼。21世纪初开始至今，依托以深度学习为代表的人工智能技术，人工智能开始了第三次高潮。随着高性能计算技术快速发展以及互联网和大数据广泛应用，形成面向不同应用场景的海量数据。围绕语音识别、机器视觉、知识推理、自动驾驶等领域的人工智能技术大量涌现，已形成规模化应用。


    ![](images/txt002_3.jpg "pagenumber_ebook=15,pagenumber_book=4")


    图1-3　人工智能发展阶段


    人工智能在各个领域的成功运用为空间系统设计及智能化发展奠定了良好基础，开展基于人工智能的在轨应用技术研究迫在眉睫。目前，世界各国的航天机构都在深入挖掘人工智能与航天技术的可结合性，持续推进人工智能在未来空间任务中的应用，以便大幅提升空间任务执行的自主性。


    人工智能在轨应用面临的瓶颈问题主要包含资源强受限、数据样本少、无法接受黑盒子状态、可靠性高等。长期来看，彻底解决人工智能在轨计算、传输、存储、能耗等问题需要前沿技术革新。技术革新依赖于时间与人类科技发展，但是宇航领域对智能化的需求已迫在眉睫。


    ## 1.2 人工智能发展状况


    ### 1.2.1 人工智能简介

    1955年美国Mc Carthy等人在研究计划中提出了人工智能的概念，随后在1956年的达特茅斯学院暑期论坛上首次提出。经过60多年的发展和积淀，伴随着互联网、大数据、云计算和新型传感器等技术的发展，人工智能正引发可产生链式反应的科学突破，催生一批颠覆性技术、培育经济发展新动能、塑造新型产业体系，加速新一轮科技革命和产业变革。


    人工智能的内涵包括脑认知基础、机器感知与模式识别、自然语言处理与理解、知识工程4个方面，外延即机器人与智能系统，作为第5个方面，其具体内容如下：


    ①脑认知基础是指认知活动的机理研究，即人脑如何从微观、介观、宏观、宇观等不同尺度上实现记忆、计算、交互、学习、推理等认知活动，以及如何模拟这些认知活动，实现类脑认知。


    ②机器感知与模式识别是指脑的视、听等知觉研究，即如何用机器完成图形和图像、语音等感知信息处理和识别任务。


    ③自然语言处理与理解是指研究人类自然语言的语境、语用、语义和语构，包括语音和文字的计算机输入，大型词库、语料和文本的智能检索，机器语音的生成、合成和识别，不同语言之间的机器翻译和同传等。


    ④知识工程是指研究知识的表示、获取、推理、决策和应用，包括机器定理证明、专家系统、机器博弈、数据挖掘和知识发现、不确定性推理、领域知识库、数字图书馆、知识图谱等大型知识工程。


    ⑤机器人与智能系统是指智能应用技术，涵盖各种各样工业、农业、医用、军用和服务机器人，还有智能驾驶、智能交通、智能制造、智能家居、智能环保、智能网络、智能管理、智慧医疗、智慧农业、智慧金融等。


    空间人工智能，简单来说，就是指航天器自主实现智能感知、决策、协同并且具备学习的能力。在2005—2007年期间，美国航空航天学会下属的空间操作与支持技术委员会，对当时航天器自主性及智能性的工业水平进行了调研和分析，总结了来自全球12个不同的组织、102个不同的智能自主航天器系统/空间机器人的相关情况。其中，航天器智能自主等级划分如表1-1所示。


