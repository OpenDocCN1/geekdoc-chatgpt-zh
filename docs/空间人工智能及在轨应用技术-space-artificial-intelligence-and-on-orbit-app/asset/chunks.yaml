    # 语音情感识别与人机交互研究


    语音情感识别研究的早期阶段遵循传统的模式识别流程，即先进行特征提取，然后进行分类器设计。特征提取阶段大多依赖于手工设计的、与情感相关的声学特征。大体上，这些声学特征可以分为
    3 类，分别是韵律学特征、谱相关特征和音质特征。开源工具`Open SMILE`通常用于提取一些经典的情感声学特征集。受益于深度学习革命的到来，利用深度神经网络直接从原始数据中提取特征并进行分类的端到端学习范式逐渐占据主导地位。这些研究有的从时域的原始语音信号入手，有的则从频域的语谱图入手，也有一些研究同时结合两者进行端到端的语音情感识别。由于语音情感识别的数据库通常都比较小，人工设计的深度神经网络往往容易过拟合，因此学习到的声学情感表征可能会面临着泛化能力不足的问题。为此，一些研究采用在大规模音频数据库上预训练的深度神经网络（如基于卷积神经网络的`VGGish`、`Wavegram-Logmel-CNN`）和`PLSA`（Pretraining，Sampling，Labeling，and
    Aggregation），以及基于 Transformer 的`AST`（Audio Spectrogram Transformer）等进行特征提取，当然也可以继续在语音情感识别数据库上进行微调。


    ## 1）语音合成


    目前，语音合成研究主要集中在韵律建模、声学模型以及声码器等模型的建模之中，以提高合成语音的音质和稳定性，并提高在小样本数据集上的泛化性。具体地，谷歌 Deepmind
    研究团队提出了基于深度学习的`WavetNet`语音生成模型。该模型可以直接对原始语音数据进行建模，避免了声码器对语音进行参数化时导致的音质损失，在语音合成和语音生成任务中效果非常好。2017
    年 1 月，Sotelo 等人提出了一种端到端的用于语音合成的模型`Char2 Wav`，其由两个组成部分，即读取器和神经声码器。读取器用于构建文本（音素）到声码器声学特征之间的映射；神经声码器则根据声码器声学特征生成原始的声波样本。本质上讲，`Char2
    Wav`是真正意义上的端到端语音合成系统。谷歌科学家提出了一种新的端到端语音合成系统`Tacotron`，该模型可接收字符的输入，输出相应的原始频谱图，然后将其提供给`Griffin-Lim`重建算法直接生成语音。


    ## 2）对话系统


    对话系统从应用角度划分，可以分为任务型对话系统和闲聊型对话系统；从方法上划分，可以分为基于管道的方法和基于端到端的方法。基于管道的方法需要分别实现自然语言理解、对话管理和自然语言生成
    3 个模块，最终形成一个完整的系统。这种模块级联的方式会导致误差传递问题，因此基于端到端的方法目前成为主流的对话系统方案。为克服端到端对话系统中存在知识难以融入学习框架的问题，Eric
    等人引入键值检索网络整合知识库信息。Madotto 等人提出了`Mem2Seq`（Memory to Sequence）模型，采用指针网络实现将知识库嵌入到对话系统中。Wu
    等人改进了`Mem2Seq`模型，提出`GLMP`（Global-to-Local Memory Pointer）模型，将外部知识融入对话系统之前进行过滤，并且加入了骨架循环神经网络机制生成对话模板。


    ### 4.3.6 多模态融合技术


    如何将不同模态的信息在人机交互系统中有效融合，提升人机交互的质量，同样值得关注。多模态融合的方法分为 3 种，即特征层融合方法、决策层融合方法和混合融合方法。特征层融合方法将从多个模态中抽取的特征通过某种变换映射为一个特征向量，然后送入分类模型中，获得最终决策；决策层融合方法将不同模态信息获得的决策合并来获得最终决策；混合融合方法同时采用特征层融合方法和决策层融合方法，如可以将两种模态特征通过特征层融合获得的决策与第三种模态特征获得的决策进行决策层融合来得到最终决策。


    ### 4.4 未来趋势


    人机交互是一个不断变化的领域，这种变化是为了响应技术革新以及满足随之而来的新用户需求。从应用场景来看，人机交互从图形用户界面过渡到自然用户界面，发展更人性化的交互界面成为人机交互进一步发展迫在眉睫的任务；从研究层面来看，人机交互从微观上升到宏观，使用计算机技术使个人参与到社会管理活动中的方法成为人机交互关注的重点；从研究重心来看，人机交互从交互导向转移到实践导向，其分析单元由个体交互行为上升到日常的社会实践活动；从研究范围来看，人机交互由人类、计算机的二元空间扩展到人类、计算机和环境组成的三元空间，人类自身所在环境也成为人机交互研究重点关注的一部分。


    空间智能交互主要通过语音、表情、手势、脑电、VR/AR 等交互手段，利用智能方法进行信息识别与处理，实现人与探测器、机器人等智能体的高效信息传递。目前，AI
    对实现人与机器之间更智能、更无缝的交互起着至关重要作用。


    回首历史，人工智能历史发展中的两次低潮，却伴随着人机交互的高速发展。在这一时期出现了包括`WIMP`范式、图形用户界面（`GUI`）在内的很多人机交互的基础理论与实践成果。然而，人机交互与人工智能并非是此消彼长的。人机交互是人工智能的一个研究途径，在人工智能发展遇到瓶颈之时人机交互往往能够提供新的研究思路；人工智能则给人机交互带来突破，驱动人机交互的发展，并把人机交互提升到一个新的发展空间。从人工智能的角度来看，人机交互是人工智能的一个研究途径；从人机交互的角度来看，人工智能为人机交互带来突破；从人类的角度来看，人工智能的发展是计算机技术的发展，而计算机技术发展的最终目的是为人类服务。总之，航天智能发展和人机智能交互是相辅相成、相互促进的关系。


    # 第 5 章 空间智能组网及协同发展状况


    近年来，随着航天推进、通信和侦察等技术的成熟与发展，以低轨道巨型星座为代表的具有多种功能、轨道互补、高智能性、自主运行、便于扩展的智能化天基网络成为天基系统新发展方向。空间网络的动态性特征具备一定的自适应和抗损毁体系协同组网能力，保障作战条件下的信息联通，将各卫星星内传感器、处理器作为网络共享资源节点。未来智能空间网络系统可自主调动协同网络中的定位资源、侦查资源和传输资源等，各个网络资源按需接入，支持复杂场景应用，具备多节点、多链路的损毁容忍能力，能够保障复杂条件下的网络协同。


    ## 5.1 技术内涵


    天基信息系统作为未来信息化作战重要的基础资源之一，对敏感事件的快速发现和定位过程需要用到遥感、通信、导航等各类航天器协同工作。因此，未来信息化作战对天基信息系统中航天器组网协同的能力提出了更高的要求。同时，随着人类对深空领域的探索和火星移民等美好畅想，空间组网的范围更是进一步扩大，网络的稳定性和实时性都需要进一步智能优化，以将理想变为现实。因此，针对未来空间网络智能化组网和协同发展，天基网络需具备高度自适应能力和抗损毁能力，保障信息联通。其应当具备以下特征能力：


    ①卫星本身的安全性变得更为重要，各卫星星内传感器、处理器将作为网络共享资源节点；

    ②网络作为一个整体，可自主调动、协同网络中的定位、侦查、传输等资源，各个网络资源按需接入，支持综合应用；

    ③系统具备多节点、多链路的损毁容忍能力，能够保障复杂条件下的网络协同。


    从航天器自主完成复杂在轨任务分析来看，如航天器在轨维修、在轨加注、航天器在轨防御、在轨蜂群攻击等复杂任务，越来越多的航天任务需要通过多颗卫星组网协同的方式来完成。各卫星节点在复杂航天任务中各司其职，能够结合自身的功能定位与性能，实现基于卫星组网的任务规划、资源调度、故障处理等有序协同，从而形成合力，发挥最大效能。卫星之间数据与信息具备深度融合的能力，功能定位相同的卫星可以实现系统级的备份以提升卫星组网鲁棒性，卫星间实现数据可共享、计算资源可共享，计算任务可分发、可迁移，卫星间进行任务和功能的智能协同，优化天基网络资源的使用，减少重复和不必要的资源损耗，以提升网络性能。


    ## 5.2 空间智能组网与协同发展现状


    国外卫星系统向多任务、多用途、成体系的超大规模巨型星座发展，并呈现多层级发展趋势。美国太空发展局（`SDA`）提出的“国防太空七层体系”中低轨星座涵盖了传输、导航、预警、感知等多种功能，通过多轨道多功能协同应对未来多维多域威胁；`DARPA`的`Blackjack`等项目要求卫星平台模块化设计，用于支持数十种有效载荷，灵活适应多作战任务需求，颠覆了传统单一卫星单一功能的“高精尖”发展思路。低轨卫星星座系统正在向多任务多用途联合应用的体系化应用方向发展，实现太空`BMC3`（Bill
    McBride Consulting Coaching Club Management）能力的提升。


    ### 5.2.1 国外发展现状


    近年来，卫星技术蓬勃发展，呈现出多功能、网络化、巨型化发展态势。欧美以军事应用和经济建设需求为牵引，商业航天公司主导建设的方式，通过大规模星座节点自主管控、自适应组网通信、智能协同等技术，快速推动卫星星座化、智能化发展。


    美国高度重视星云、星群技术发展及应用，持续加强体系布局和基础研究，先后安排了“`Starlink`”“`Blackjack`”等多个先进卫星技术研究项目，在弹性化体系架构、一体化可重构、组网协同等关键技术方面取得了大量成果，以此为基础实现规模化快速应用，加速推进星链系统建设，稳步构建融入联合作战的具备导航、通信、侦察、预警、监视、指控、攻防多能一体七层弹性太空体系，预计
    2028 年形成作战能力。网络化巨型星座已成为太空领域竞争焦点，关乎太空优势争夺和大国博弈胜负，带来太空支援和空间安全的颠覆性变化，引领信息、经济、社会、军事广泛变革。本小节对国外典型的组网星座进行详细介绍。


    国外典型星座发展状况如图 5-1 所示。主要包含铱星、“一网”（`Oneweb`）、“星链”（`Starlink`）、“光速”（`Lightspeed`）、“黑杰克”（`Blackjack`）等典型大规模星座。


    ![](img/txt007_1.jpg "pagenumber_ebook=101,pagenumber_book=90")


    图 5-1　国外典型星座发展状况


    #### Starlink


    星链计划是 SpaceX 提出的一个雄心勃勃计划，目的是将 4.2 万颗小型卫星发射到 340～550km 的近地轨道，通过星间的激光通信，实现覆盖全球的卫星网络，对全球特别是那些光缆和地面基站无法到达的偏远区域，提供低成本、高性能的互联网服务，形成天基
    5G/6G 的 WIFI 能力。


    ##### 构型设计


    `Starlink`是 SpaceX 公司正在进行的卫星星座开发项目，旨在开发低成本、高性能的基于空间的互联网通信系统。`Starlink`计划第一期由 4
    408 颗分布在 540～570 km 的低地球轨道（Low Earth Orbit，`LEO`）卫星（表 5-1）和 7 518 颗分布在 340 km
    左右的极低地球轨道（Very Low Earth Orbit，`VLEO`）星座构成，组网卫星总数达到 11 926 颗。星链计划第一期的搭建分两个阶段：第一阶段首先用
    1 584 颗卫星完成初步覆盖，用于满足美国、加拿大和波多黎各等天基高速互联网的需求，然后再用 2 824 颗卫星完成全球组网；第二阶段用 7 518 颗卫星组成更为激进的低轨星座。


    表 5-1　Starlink 一期星座


    ![](img/txt007_2.jpg "pagenumber_ebook=101,pagenumber_book=90")


    续表


    ![](img/txt007_3.jpg "pagenumber_ebook=102,pagenumber_book=91")


    如表 5-2 所示，SpaceX 第二期星链计划卫星总数为 30 000 颗。第二期星座的卫星主要分布于中低纬度地区，这些地区的人口密度和流量需求都更大。星座建设完成后每个用户都将获得更优的服务质量和更大的容量。


    表 5-2　Starlink 二期星座


    ![](img/txt007_4.jpg "pagenumber_ebook=102,pagenumber_book=91")


    SpaceX 利用猎鹰 9 号可回收火箭，将 12 000 颗卫星送到轨道平面，然后组成卫星通信群。最初马斯克采用的是铱星 9523 的 UART 串口数据传输终端进行卫星间的数据链路通信，但是在初期测试期间发现用户线路数据和
    SBD 数据的收发在用户数量增长后会有严重的衰减。最终进行了链路组网升级，采取了基于区块链技术的 SGL 网络结构，采用 SGL 底层协议基础结构进行卫星组网，SGL
    协议令牌进行加密传输。解决了星链冗余与可扩展问题，同时也保护了网络核心层在 SGL Chain 上的应用。该方案还提供 GISP 接口为各国 ISP 接入互联，只要各国愿意将本国的
    ISP 接入太空 WIFI，全球在没有通信信号的地方均可实时接收到来自太空 WIFI 互联网接入信号。


    ##### 网络架构指标


    “星链”计划与蜂窝移动互联网的比较，在无线接入的速率方面，LTE 下行带宽为 100M～1G，5G 下行带宽为 1～10G，“星链”计划带宽为 50～150M，最终目标为
    1G；空口信号传输时延，LTE 的 10 km 时的传输延时为 66 us，5G 的 1 km 时的传输延时为 6.6 us，“星链”计划的 550 km
    的时延接近 4 ms，1 200 km 的时延大概为 8 ms。


    ##### 发展趋势


    2021 年，“星链”星座实施了 19 次大规模部署，部署 989 星。自首发试验星以来，累计发射 1 944 颗卫星。2022 年上半年发射频次密集，在
    2022 年 3 月创下 20 天 4 发的纪录，推测其卫星工厂实现月均 150 星的生产速度。2022 年 5 月完成第一期第一阶段卫星发射任务。2022
    年下半年 9 月起恢复部署任务，开始发射搭载星间激光通信终端的新一代 v1.5 版本卫星。美国太空探索技术公司（SpaceX）使用猎鹰-9（Falcon-9）部署“星链”卫星，一次最多可发射
    60 星，一级火箭可重复使用，卫星部署成本不断降低。


    #### Blackjack


    `Blackjack`项目由美国国防高级研究计划局（`DARPA`）于 2017 年发布，旨在开发低地球轨道（`LEO`）星座，为军事行动提供全球持久覆盖。通过`Blackjack`项目，`DARPA`将建立一个扩散的`LEO`星座，`LEO`星座将把传感器连在一起，为全世界选定的用户提供持续的全球覆盖能力。2021
    年 6 月，`DARPA`成功部署了两颗`Mandrake2`卫星，该卫星用于验证`Blackjack`项目中先进激光通信技术的可行性。


    美国国防部卫星一直是定制设计，设计和升级周期漫长且昂贵，而低地球轨道宽带互联网通信卫星的出现可以提供很有吸引力的规模经济。`Blackjack`计划寻求开发低成本空间有效载荷和商品化卫星平台，平台尺寸要小，质量、功率和成本（SWAP-C）要低，卫星能力要与当今地球同步轨道（`GEO`）军事通信能力近似，但成本要低得多。`DARPA`表示，商业化卫星平台将采用基于开放架构的电气、软件和网状网接口控制，将为在低轨运行数十种或数百种不同类型的军用卫星有效载荷创造条件。`Blackjack`计划的关键方面是利用商业元素，这对美国来说是一个巨大优势。由于使用商业卫星平台来降低每个轨道平台的成本，并且使用商业提供商大幅降低发射服务成本，美国将拥有比对手更大的竞争优势。使用数百颗更小、更便宜的卫星来提供与现有资产相似或更好的性能，将极大提高太空项目的鲁棒性。新系统的模块化特性可以快速适应未来需求。


    ##### 构型设计


    由于与传统的`GEO`卫星相比，`LEO`卫星在延迟、经济效益方面具有许多优势，`Blackjack`项目将采用`LEO`星座。如图 5-2 所示，每颗`Blackjack`卫星由一个商业化卫星平台、一个`PitBoss`控制单元以及一个或多个能够自主运行超过
    24 h 的军用有效载荷组成。


    ![](img/txt007_5.jpg "pagenumber_ebook=104,pagenumber_book=93")


    图 5-2　`Blackjack`卫星结构图


    `PitBoss`是`Blackjack`项目开发的天基自主网络任务管理系统，是`Blackjack`的“大脑”。`PitBoss`控制单元内含高速处理器和加密装置，可用作通用的网络和电气接口，并提供任务层面的自主功能、在轨计算、卫星与地面用户之间的通信管理、指挥与遥测链路以及数据加密等能力。根据`DARPA`于
    2019 年 4 月发布的一份广泛机构公告，`PitBoss`应能够“利用全球`LEO`星座获取目标定位、特征描述和持续跟踪信息”。此外，`PitBoss`应该能够增强导航、授时与定位（PNT）能力、太空到地面通信以及关键数据在全球范围内的快速分发。`PitBoss`将促进关键信息的收集和处理并分发给战术用户。该系统将包括架构和软件/硬件元素，以支持星座级的自主功能，并采用先进的体系结构和加密技术，自动收集和处理整个星座的数据。其主要的创新点在于能够在轨道上处理数据。不仅每个`Blackjack`传感器能够执行机载处理，`PitBoss`还能够从每个单独的`Blackjack`传感器获取数据，将其融合并将其提供给需要的用户，而不需要来自卫星操作员的命令。


    ##### 性能指标


    `Blackjack`项目旨在利用商业公司研发小体积、小质量、低功率、低成本的低地球轨道（`LEO`）卫星星座。`Blackjack`项目通用平台关键指标如表
    5-3 所示。`Blackjack`项目将研发并验证支撑`LEO`卫星组网的关键技术，重点是商业化卫星平台和低成本、可互换、设计周期短、技术更新频繁的军用有效载荷，并对有效载荷进行优化，使其适用于多个卫星平台。`Blackjack`有效载荷关键参数如表
    5-4 所示。最终目标是实现军方有效载荷的高度网络化并且兼具弹性和持久性，能够持续在全球范围内为军方提供最大的超视距遥感、信号和通信功能。


    表 5-3　`Blackjack`项目通用平台关键指标


    ![](img/txt007_6.jpg "pagenumber_ebook=105,pagenumber_book=94")


    表 5-4　`Blackjack`有效载荷关键参数


    ![](img/txt007_7.jpg "pagenumber_ebook=105,pagenumber_book=94")


    ##### 发展趋势


    `PitBoss`系统的研制与开发主要由 SEAKR 公司负责，目前该公司已经研制发射了曼德拉 1 号与两颗曼德拉 2 号试验卫星。曼德拉 1 号是一个立方体卫星，携带超级计算机处理芯片，主要用于辐射缓解和处理器性能验证。曼德拉
    2 号是一对小型卫星，携带宽带数据的卫星间激光链路，构成未来`LEO`光学网状网的基础。


    曼德拉 1 号于 2020 年秋季发射，其搭载的有效载荷包括高性能多核高级`RISC`机器（`ARM`）处理器和多个图形处理单元（`GPU`）。目前已成功实施了一项战术海上实验，展示任务自主、OTA
    更新、无质量有效载荷部署以及传感器边缘处理和利用。其中，部署及利用的关键技术包括模数转换器（`ADC`）和数模转换器（`DAC`）技术、基于现场可编程门阵列（`FPGA`）的处理技术以及基于专用独立电路（`ASIC`）的处理技术。


