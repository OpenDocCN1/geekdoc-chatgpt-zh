    # 卷积神经网络与相关模型


    ## CNN输入扫描与卷积层


    `CNN`倾向于使用一个输入“扫描仪”，而不是一次性解析所有的训练数据。举个例子，为了输入一张200×200像素的图片，你不需要使用一个有40000个结点的输入层。相反，你只要创建一个扫描层，这个输入层只有20×20个结点，你可以输入图片最开始的20×20像素（通常从图片的左上角开始）。一旦你传递了这20×20像素数据（可能使用它进行了训练），你又可以输入下一个20×20像素，即将“扫描仪”向右移动一个像素。注意：不要移动超过20个像素（或者其他“扫描仪”宽度）。你不是将图像解剖为20×20的块，而是在一点点移动“扫描仪”。然后，这些输入数据前馈到卷积层而非普通层。卷积层的结点并不是全连接的。每个结点只和它邻近的节点（`Cell`）相关联（多靠近取决于应用实现，但是通常不会超过几个）。这些卷积层随着网络的加深会逐渐收缩，通常卷积层数是输入的因子。例如，如果输入是20，可能接下来的卷积层是10，再接下来是5。2的幂是经常被使用的，因为它们能够被整除，如32，16，8，4，2，1。除了卷积层，还有特征池化层。池化是一种过滤细节的方法，而最常用的池化技术是最大池化（`Max
    Pooling`）。例如，使用2×2像素，取这4个像素中数值最大的那个。为了将卷积神经网络应用到音频，可以逐段输入剪辑长度的输入音频波。


    `CNN`在真实世界的应用通常会在最后加入一个前馈神经网络（`FFNN`）以进一步处理数据，这允许了高度非线性特征映射，这些网络被称为深度卷积神经网络（`DCNN`），但是这些名字和缩写通常是可以交换使用的。


    ## 13）反卷积神经网络模型


    反卷积神经网络（`Deconvolutional Networks`，`DN`），也称为逆向图网络（`Inverse Graphics Networks`，`IGN`）。它是反向卷积神经网络。想象一下，将一个单词“猫”输入神经网络，并通过比较网络输出和真实猫图片之间的差异来训练网络模型，最终产生一个看上去像猫的图片。反卷积神经网络可以像常规的卷积神经网络一样结合前馈神经网络使用，但是这可能涉及新的名字缩写。它们可能是深度反卷积神经网络，但是你可能倾向于：当你在反卷积神经网络前面或者后面加上前馈神经网络，它们可能是新的网络结构而应该取新的名字。值得注意的是，在真实的应用中，你不可能直接把文本输入网络，而应该输入一个二分类向量。例如，＜0，1＞是猫，＜1，0＞是狗，而＜1，1＞是猫和狗。在卷积神经网络中有池化层，在这里通常被相似的反向操作替代，通常是有偏的插补或者外推。例如，如果池化层使用最大池化，当反向操作时，可以产生其他更低的新数据来填充。


    ## 14）深度卷积逆向图网络模型


    深度卷积逆向图网络（`Deep Convolutional Inverse Graphics Networks`，`DCIGN`），这个名字具有一定的误导性，因为事实上它们是变分自编码器（`VAE`），只是在编码器和解码器中分别有`CNN`和`DN`。这些网络尝试在编码的过程中对“特征”进行概率建模，这样一来，只要用猫和狗的独照，就能让网络学会生成一张猫和狗的合照。同样，可以输入一张猫的照片，如果猫的旁边有一只恼人的邻居家的狗，可以让网络将狗去掉。实验显示，这些网络也可以用来学习对图像进行复杂转换，如改变3D物体的光源或者对物体进行旋转操作。这些网络通常用反向传播进行训练。


    ## 15）生成式对抗网络模型


    生成式对抗网络（`Generative Adversarial Networks`，`GAN`）是一种新的网络。网络是成对出现的，即两个网络一起工作。生成式对抗网络可以由任何两个网络构成（尽管通常情况下是前馈神经网络和卷积神经网络配对），其中一个网络负责生成内容，另外一个负责对内容进行判别。判别网络同时接收训练数据和生成网络生成的数据。判别网络能够正确地预测数据源，然后被用作生成网络的误差部分。形成了一种对抗：判别器在辨识真实数据和生成数据方面做得越来越好，而生成器努力地生成判别器难以辨识的数据。这种网络取得了比较好的效果，部分原因是即使是很复杂的噪声模式最终也是可以预测的，但生成与输入数据相似的特征的内容更难辨别。生成式对抗网络很难训练，因为不仅仅要训练两个网络（它们中的任意一个都有自身问题），而且还要考虑两个网络的动态平衡。如果预测或者生成部分变得比另一个好，那么网络最终不会收敛。


    ## 16）循环神经网络模型


    循环神经网络（`Recurrent Neural Networks`，`RNN`）是考虑时间的前馈神经网络。它们并不是无状态的，而是通道与通道之间通过时间存在着一定联系。神经元不仅接收来自上一层神经网络的信息，还接收上一通道的信息。这就意味着你输入神经网络以及用来训练网络的数据的顺序很重要，即输入“牛奶”“饼干”和输入“饼干”“牛奶”会产生不一样的结果。


    循环神经网络最大的问题是梯度消失（或者梯度爆炸），这取决于使用的激活函数。在这种情况下，随着时间信息快速消失，正如随着前馈神经网络的深度增加，信息会丢失。直观上，这并不是一个大问题，因为它们只是权重而非神经元状态。但是随着时间，权重已经存储了过去的信息。如果权重达到了0或者1
    000 000，先前的状态就变得没有信息价值了。卷积神经网络可以应用到很多领域，大部分形式的数据并没有真正的时间轴（不像声音、视频），但是可以表示为序列形式。对于一张图片或者是一段文本的字符串，可以在每个时间点一次输入一个像素或者一个字符。因此，依赖于时间的权重能够用于表示序列前一秒的信息，而不是几秒前的信息。通常，对于预测未来信息或者补全信息，循环神经网络是一个好的选择，如自动补全功能。


    ## 17）长短时记忆网络模型


    长短时记忆网络（`Long/Short Term Memory`，`LSTM`）通过引入门结构（Gate）和一个明确定义的记忆单元（Memory Cell）来尝试克服梯度消失或者梯度爆炸的问题。这一思想大部分是从电路学中获得的启发，而不是从生物学。每个神经元有1个记忆单元和输入、输出、忘记3个门结构。这些门结构的功能是通过禁止或允许信息的流动来保护信息。输入门结构决定了有多少来自上一层信息被存储在当前记忆单元。输出门结构承担了另一端的工作，决定了下一层可以了解到多少这一层的信息。忘记门结构初看很奇怪，但是有时候忘记是必要的。例如，如果网络正在学习一本书，并开始了新的章节，那么忘记前一章的一些人物角色是有必要的。长短时记忆网络被证明能够学习复杂的序列。例如，像莎士比亚一样写作，或者合成简单的音乐。值得注意的是，由于这些门结构中的每一个都对前一个神经元中的记忆单元赋有权重，所以一般需要更多的资源来运行。


    ## 18）门控循环单元模型


    门控循环单元（`Gated Recurrent Units`，`GRU`）是长短时记忆网络的一种变体。不同之处在于，它没有输入门、输出门和忘记门，而只有一个更新门。该更新门确定了从上一个状态保留多少信息以及有多少来自上一层的信息得以保留。这个更新门的功能很像`LSTM`的忘记门，但它的位置略有不同。它总是发出全部状态，但是没有输出门。在大多数情况下，它们与`LSTM`的功能非常相似，最大的区别在于`GRU`稍快，运行容易（但表达能力更差）。在实践中，这些往往会相互抵消，因为当你需要一个更大的网络来获得更强的表现力时，往往会抵消性能优势。在不需要额外表现力的情况下，`GRU`可能优于`LSTM`。


    ## 19）神经图灵机模型


    神经图灵机（`Neural Turing Machines`，`NTM`）可以被理解为`LSTM`的抽象，它试图去黑箱化（提升模型可解释性）。神经图灵机并非直接编码记忆单元到神经元中，它的记忆单元是分离的，试图将常规数字存储的效率和永久性以及神经网络的效率和表达力结合起来。这种想法基于有一个内容寻址的记忆库，神经网络可以从中读写。神经图灵机中的“图灵”（Turing）来自于图灵完备（Turing
    Complete）：基于它所读取的内容读、写和改变状态的能力，这意味着它能表达一个通用图灵机可表达的一切事情。


    双向循环神经网络（`Bidirectional Recurrent Neural Networks`，`BiRNN`）、双向长短时记忆网络（`Bidirectional
    Long/Short Term Memory Networks`，`BiL-STM`）、双向门控循环单元（`Bidirectional Gated Recurrent
    Units`，`BiGRU`）看起来和相应的单向网络是一样的。不同之处在于这些网络不仅联系过去，还与未来相关联。例如，单向长短时记忆网络被用来预测单词“fish”的训练过程是这样的：逐个字母地输入单词“fish”，在这里循环连接随时间记住最后的值，而双向长短时记忆网络为了提供未来的信息，会在反向通道中输入下一个字母。这种方法训练网络以填补空白而非预测未来信息。例如，在图像处理中，它并非扩展图像的边界，而是可以填补一张图片中的缺失。


    ## 20）深度残差网络模型


    深度残差网络（`Deep Residual Networks`，`DRN`）是具有非常深度的前馈神经网络，除了邻近层之间有连接，它还可以将输入从一层传到后面几层（通常是2～5层）。深度残差网络并非将一些输入（如通过一个5层网络）映射到输出，而是学习将一些输入映射到一些输出+输入上。基本上，它增加了一个恒等函数，将旧的输入作为后面层的新输入。结果显示，当达到150层，这些网络对于模式学习是非常有效的，这要比常规的2～5层多得多。然而，有结果证明，这些网络本质上是没有基于具体时间建造的循环神经网络（`RNN`），它们总是与没有门结构的长短时记忆网络（`LSTM`）作比较。


    ## 21）回声状态网络模型


    回声状态网络（`Echo State Networks`，`ESN`）是另外一种不同类型的循环网络。它的不同之处在于神经元之间随机地连接，即层与层之间没有统一的连接形式，而它们的训练方式也不一样。不同于输入数据，然后反向传播误差，回声状态网络先输入数据，前馈，然后暂时更新神经元。它的输入层和输出层在这里扮演了稍微不同于常规的角色，即输入层用来主导网络，而输出层作为随时间展开的激活模式的观测。在训练过程中，只有观测和隐藏单元之间连接会被改变。


    ## 22）极限学习机模型


    极限学习机（`Extreme Learning Machines`，`ELM`）本质上是有随机连接的前馈神经网络，看上去和液体状态机（`LSM`）和回声状态网络（`ESN`）很相似，但是它既没有脉冲，也没有循环。它们并不使用反向传播。相反，它们随机初始化权重，并通过最小二乘拟合一步训练权重（所有函数中的最小误差）。这使得模型具有稍弱的表现力，但是在速度上比反向传播快很多。


    ## 23）液体状态机模型


    液体状态机（`Liquid State Machines`，`LSM`）看上去和回声状态网络（`ESN`）很像。真正的不同之处在于液体状态机是一种脉冲神经网络，即Sigmoid激活函数被阈值函数所取代，每个神经元是一个累积记忆单元（Memory
    Cell）。因此，当更新神经元的时候，其值不是邻近神经元的累加，而是它自身的累加。一旦达到阈值，它会将其能量传递到其他神经元。这就产生一种类似脉冲的模式，即在突然达到阈值之前什么也不会发生。


    ## 24）支持向量机模型


    支持向量机（`Support Vector Machines`，`SVM`）发现了分类问题的最佳解决方式。传统的`SVM`一般是处理线性可分数据。例如，发现哪张图片是加菲猫，哪张图片是史努比，而不可能是其他结果。在训练过程中，支持向量机可以想象成在二维图上画出所有的数据点（加菲猫和史努比），然后找出如何画一条直线将这些数据点区分开来。这条直线将数据分成两部分，所有加菲猫在直线的一边，而史努比在另一边。最佳的分割直线是：两边的点和直线之间的间隔最大化。当需要将新的数据分类时，将在图上画出这个新数据点，然后简单地看它属于直线的哪一边。使用该技巧，它们可以被训练用来分类n维数据。这需要在3
    D图上画出点，然后可以区分史努比、加菲猫和西蒙猫，甚至更多的卡通形象。支持向量机并不总是被视为神经网络。


    ## 25）Kohonen网络模型


    `Kohonen`网络（`Kohonen Networks`，`KN`）也被称为自组织（特征）映射`SOM`、`SOFM`），是利用竞争性学习对数据进行分类，无须监督。该模型是将数据输入网络，之后网络评估其中哪个神经元最匹配那个输入；然后调整这些神经元以使更好地匹配输入；在该过程中移动相邻神经元，相邻神经元被移动多少取决于它们到最佳匹配单位的距离。有时，`Kohonen`网络也不被认为是神经网络。


    ## 12.1.5 强化学习算法


    强化学习的研究有着悠久的历史。1992年，Tesauro成功使用强化学习使十五子棋达到大师级水准；Sutton撰写了第一本系统性介绍强化学习的书籍；Kearns第一次证明强化学习问题可以用少量的经验得到近似最优解；2006年Kocsis等人提出的置信上限树算法革命性地推动强化学习在围棋游戏中的应用，这可以说是初弈号的鼻祖；2015年，Littman在《Nature》上对强化学习做了综述。


    理论研究方面，强化学习在过去几年取得了丰富的成果。一直以来，强化算法面临收敛性和最优性问题，研究者们都进行了详细的探索。在使用逼近器解决大规模`MDPs`或连续状态空间问题时，Sutton和Bhatnagar分别对线性和非线性逼近器的训练结果进行了分析，设计出了使结果准确的训练方法。Melo对使用逼近器的收敛性进行了证明。Kearns等人利用概率近似正确理论对在线算法的学习时间进行了定性的分析，同样取得了丰富的成果。随着技术的发展，神经网络的规模越来越大，参数越来越多，对强化学习算法的收敛性提出了更高的要求。如何保证复杂网络参数获得收敛的训练结果是当前研究者面临的挑战，同时人们对资源、经济效益的要求越来越高，对算法结果的最优性也提出了更高的要求，找到更接近最优结果的算法成了学术界和工业界共同追求的目标。


    ### 1.强化学习的基本思想


    强化学习的目标是得到最大的累积奖赏。为了实现这一目标，一方面需要“利用”，即利用已经学习到的经验来选择奖赏最高的动作，使系统向好的状态转移；另一方面，需要“探索”，即通过充分地掌握环境信息，发现能得到更高奖赏的状态，避免陷入局部最优。这就使得强化学习方法陷入了一个“探索-利用”困境，即只有既充分地探索环境，又利用已学到的知识才能最大化累积奖赏。因此，“探索-利用”的平衡成了强化学习研究者们一直密切关注的热点。2010年，Bernstein提出的自适应分辨率强化学习方法能够在状态连续的确定性系统中高效探索未知状态，给出了高效强化学习的实用方法；2015年，Zhao提出的连续系统概率近似正确（`Probably
    Approximately Correct`）方法，能够在有限时间范围内找到最优或近似最优策略，进一步增强了强化学习的实用性。


    强化学习的学习机制表明，它是不断地与环境交互，以试错的方式学习得到最优策略，是一种在线学习方法。然而，现实中有很多问题需要在离线的评估后再给出决策。目前的一个研究趋势是用离线估计来处理上下文老虎机（`Contextual
    Bandit`）问题。例如，微软研究院的Li等人将无偏离线估计的上下文老虎机方法成功地应用到了推荐系统中。目前，已经有人建议创建强化学习的离线数据库，可是现有的离线估计算法还不够成熟，有待进一步发展。


    强化学习的另一个局限在于合适的奖赏信号定义。强化学习通过最大化累积奖赏来选择最优策略，奖赏很大程度上决定了策略的优劣。现阶段奖赏是由研究人员凭借领域知识定义，一个不合理的奖赏势必会在很大程度上影响最终的最优策略。有学者已经开始尝试借助人类的导师信号来改进原有的强化学习算法，使机器人能够更好地学习到期望动作。因此，对于奖赏信号的研究将会是强化学习未来发展的一个潜在热点。


