  toc: []
- raw: "随着低轨移动互联网星座的建设及用户不断增长的需求，未来通信卫星提供的服务将不只是由单颗卫星提供，而是由多个卫星组网并协同为用户提供通信服务。\n\n\
    为了更好地满足通信与导航卫星业务需求，未来通信与导航卫星的发展除了提升单颗卫星的技术水平和功能外，多颗通信卫星的组网通信、任务协作是必然的发展趋势。但是，通信与导航卫星网络面临星间链路拓扑、分布式管理、多任务规划、多星协同、资源分配等问题。如何基于人工智能技术解决这些问题、实现智能组网是要解决的关键问题。\n\
    \n广义的卫星网络（Satellite Network）由通信、侦察、导航、气象等多种功能的异构卫星/卫星星座、空间飞行器以及地面有线和无线网络设施组成，通过星间/星地链路将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合。地面和卫星间可以根据应用需求建立星间链路，进行数据交换。它既可以是现有卫星系统的按需集成，也可以是根据需求进行“一体化”设计的结果，具有多功能融合、组成结构动态可变、运行状态复杂、信息交换处理一体化等功能特点。\n\
    \n天地一体化信息网络包括天基信息网络与地基信息网络两大部分，不仅要求实现互联互通，更要实现一体化的融合，是对未来信息网络向综合化发展的统称。可以将其定义为：通过星间、星地、星空以及地面站间的链路，将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合，采用智能高速处理、交换和路由技术，按照信息资源的最大有效综合利用原则，进行信息准确获取、快速处理和高效传输的一体化高速宽带大容量信息网络，即天基、空基和陆基一体化综合网络。\n\
    \n在群智能卫星系统中，为了实现高度的自主性计划，基于社会结构的推理方法必须运用先进的人工智能技术，如神经网络、模糊逻辑和遗传算法等。为了辅助和维持高水平的自主性，更重要的任务还要考虑自主运行的修正能力，以便适应环境变化、远距离操控和低带宽通信等问题。\n\
    \n利用神经网络学习和进化的思想应用在卫星集群上，通过卫星控制器的协同进化，增强卫星的群体协作能力，如编队飞行、姿态同步等。\n\n\uFEFF\n\n第10章　共性需求\n\
    \n航天器的网络化、信息化及智能化发展趋势是不可逆转的。本章主要从高性能计算、自主健康管理以及智能在轨维护方面阐述空间人工智能及在轨应用技术的共性需求。\n\
    \n10.1　高性能计算需求\n\n随着用户对卫星要求越来越高，业务数据也越来越庞大，数据关系越来越复杂，同时目前天基系统也存在星上处理能力不足、技术体制落后、无法实现多源数据在轨实时处理/融合等难题。因此，围绕提升天基系统信息服务能力，按需配置网络、计算、存储和载荷等各类硬件资源，构建天基网络自主化、智能化以及快速响应能力。同时，采用模块化设计，实现资源拟态可重构、软件在轨可更新、功能灵活可扩展的新型处理平台，对节点能力在轨提升，支持装备演进升级具有重要的战略意义。\n\
    \n随着航天市场的逐步开放，卫星市场的“成本”与“效能”越来越受到世界各国科研人员的重视。现在的卫星设计更加强调能够快速处理多种空间业务，在降低开发时间和部署成本的同时，要保证卫星设备使用寿命和可靠性。最后，还要有良好的新技术适用性和可移植性。\n\
    \n1.天基信息网络化服务能力需求\n\n天基信息资源融合高效利用，需要提升网络化信息服务能力。目前，各类型航天器构成的子系统呈现相互闭塞的状态，即便信息落地后也呈现分割的状态，信息无法实现汇聚融合处理。多系统多类型信息综合能力的有限、多系统多任务协同能力的缺失，直接导致天基系统对联合业务的信息服务能力受到严重制约。因此，需要将各类型航天器获取的天基信息资源汇聚到一起，缩短反应链条，提高信息获取、传输、处理、分发和应用的效率，同时完成对各类型信息资源的存储和检索。不仅要求星上平台有极强的计算和存储能力，同时针对不同类型、不同速率的数据还要求它能够进行快速处理、融合与信息产品生成，从而提高天基处理平台通用化、自主化、高效化，满足天基信息快速服务用户需求。\n\
    \n2.天基信息可重构服务能力需求\n\n装备在轨重构要求天基信息服务基础设施具备软件可定义、在线可重构的能力，尤其是高轨卫星在轨寿命长、研制技术复杂、研制周期时间长，一旦卫星在轨更新服务缺失，对新的技术体制支持能力将严重受限。与此同时，随着微电子和高性能计算机等技术的迅猛发展，系统的演进升级需求不断增强，天基装备数量和功能多样化的发展非常迅速，未来对联合作战信息支援能力的需求不断扩展。因此，采用功能模块化、在轨资源可重构、灵活可拓展的新型信息服务平台，对实现节点能力在轨提升，支持装备演进升级具有重要的战略意义。\n\
    \n3.天基信息云服务能力需求\n\n鉴于传统卫星网络的数据传输能力有限，致使大量数据无法下传，需要天基信息具备较强的在轨数据处理能力，快速提取出有效信息，降低存储或传输的数据量，以减小数据存储或下传的压力，节省星上资源。整个工作基于分布式的天基存储/计算资源完成。因此，需要研究适应天基环境的分布式云服务机制。\n\
    \n随着我国高分辨率遥感卫星系统的发展，遥感信息的质量大幅提高，相应地需要存储或传输的数据量也急剧增加。例如，当遥感卫星图像的地面分辨率接近1 m时，实时数据传输量达每秒Gb数量级；最先进的遥感卫星图像的地面分辨率已经高达0.1\
    \ m，其数据传输量是相当巨大的。由于我国国情的限制，卫星往往不可能全天候处于我国地面站接收范围之内，或者由于卫星的下行能力不能满足实时传输的要求，如此高速而大容量的珍贵数据往往需要首先经过本地存储，进而在适当的时候延时回放。因此，这对星载高速大容量存储和处理系统的能力提出了更高的要求。\n\
    \n4.天基信息存储检索服务需求\n\n信息快速存储与检索要求星上平台具备高效的数据部署及缓存管理机制。由于星载应用环境的特点，传统星载固存一般未采用文件系统，而是采用简单的文件号方式描述每次记录的数据，其可描述内容仅限于文件号、存储地址、记录星时及简单的特征信息等；文件个数一般仅为几十或上百个左右；文件信息一般存储于数据信息载体之外的存储芯片内，如MRAM、EEPROM等。采用这种自定义文件记录方式，无法对大容量、多样化、高速率的星上数据进行有效的系统化管理，尤其是快速地进行数据查找和回放，不能快速定位有效数据会影响任务的正常执行，特别在作战时，可能会急需某种载荷、某个特定地域或者特定时间的数据，数据的正确性和时效性会影响任务的成败。同时，传统的数据管理方式导致经常需要修改文件信息，从而使得软件版本繁多，无法做到通用化、标准化。\n\
    \n目前，星上各种载荷设备所产生的原始数据呈现出数据量大、传输带宽高等特点，而且探测器连续工作时间越来越长，需记录的总数据量极大。此外，卫星往往需要同时执行多项探测任务，而存储设备需要记录多路超高速数据流，高速率、长时间的数据记录需要极高的存储带宽和极大的存储容量，以及对多路载荷数据在不同时间段产生的原始数据、预处理数据、压缩数据等各类型数据的存储管理。因此，需要研究适用于星载平台的超高速多源数据并行存储技术，以及多源数据检索方法。\n\
    \n5.在轨智能计算芯片需求\n\n随着人工智能算法和应用技术的日益发展，以及人工智能专用芯片ASIC产业环境的逐渐成熟，人工智能ASIC将成为人工智能计算芯片发展的必然趋势。目前，国内对于人工智能芯片的研究不断深入，后续可以选择与技术成熟的公司合作开发适合卫星上专用的智能芯片。\n\
    \n人工智能应用市场规模庞大，无论是遥感数据还是遥测遥控、通信、导航积累都已经形成海量规模，为星上人工智能芯片发展提供巨大空间。结合卫星平台需求，针对卫星平台亟待解决的问题，进行星上智能芯片设计，最终提升卫星平台智能化水平。\n\
    \n10.2　自主健康管理需求\n\n“健康状态”描述了卫星设备及其子系统、部件执行设计功能的能力。“健康状态评估”主要是对利用各种测量手段获取的监测数据、历史数据等进行综合分析，利用各种评估算法对设备的健康状况进行评估，对不合格设备给出原因及操作建议。通过准确了解当前设备的健康状态，对设备的健康状态作出正确的评估，为设备的操作、决策提供依据。\n\
    \n1.自主健康状态评估\n\n卫星健康状态评估技术对保证卫星高可靠、自主稳定运行非常必要，具有重要意义。未来的天基系统单星功能将日趋复杂、多星组网星座系统陆续出现，卫星若发生影响系统服务的故障，不及时处理可能导致系统服务可用性变差，甚至无法使用，直接影响系统的应用效能。此外，在天基系统长时间无地面支持的情况下，卫星若具备星载健康状态评估能力，及时有效处理故障，为任务规划、维护等提供决策支持，将有效提高系统的生存能力，具有重要价值。\n\
    \n2.卫星高可靠和高自主性\n\n卫星是一个涉及多学科、多领域技术的复杂系统，又在恶劣复杂的空间环境中飞行，尽管在设计、研制过程中采取了一系列可靠性的措施，但卫星在轨飞行中仍不可避免地会发生各种故障，使卫星健康状态出现突然或逐渐恶化。统计表明，在1990—2009年成功发射的1\
    \ 036个航天器中，就有156个发生了故障，占航天器总数的15%。同时，航天任务的特殊性，又使得航天器在轨期间一旦发生故障，如不采取措施，就可能导致整个飞行任务的失败。然而，单纯依靠地面采取补救措施，其有效性和实时性有限，可能会错过最佳处理时机而导致任务失败。如果在卫星上能够采取健康状态评估技术，及时发现健康状态异常状况，并在此基础上，实现故障有效及时处理，对整个卫星系统工作连续性、稳定性和安全性意义重大。\n\
    \n3.智能故障诊断与预测\n\n卫星健康状态评估最终目的是保证卫星高可靠稳定运行，需要及时对故障进行诊断、隔离、切换或者重构，对未来可能发生的故障做出预测，并据此做出有效的健康状态评估，以供决策支持。因此，故障诊断方法、故障预测方法是实现卫星健康状态评估的基础技术，也是能否实现健康状态评估的关键。健康状态评估并非仅限于整星系统级、分系统级、关键组部件的故障诊断，故障预测结果也是卫星健康状态评估的重要组成部分。\n\
    \n故障诊断是指通过一定的方法对被诊断设备中的各种状态信息进行综合处理，从而得出设备运行状态以及故障状况的评价过程。从本质上来说，故障诊断是一个模式分类和识别的过程。近四十年来，故障诊断技术迅速发展成为一门新的学科，也是为适应各种工程需要而建立的交叉性学科，涉及传感器、信号分析及数据处理、人工智能、自动控制、预测预报等领域。\n\
    \n故障预测方法是健康状态评估的重要组成部分。预测是对尚未发生、或者目前还不明确的事物进行预想估计与推测，是在现时对系统将要发生的结果进行探讨和研究，给出系统健康状态的发展趋势，在某种意义上是一种推理过程。故障预测是实现故障预防、提高故障诊断实时性的技术手段。故障预测技术主要是基于致命故障或者损耗性故障关键参数的变化趋势进行分析，以推断航天器未来的可能状态，从而采取预防措施避免航天器故障的发生或者降低航天器故障的危害程度。\n\
    \n目前，基于模型的方法大多应用于飞行器、旋转机构等机电系统中，而对于复杂系统，由于其故障模式和失效机理相对复杂，其故障预测的模型化研究相对滞后。卫星是一个动态系统，在轨运行时需要监测工作状态，当出现故障时还需要进行诊断。另外，卫星各个重要分系统都采取冗余备份措施，希望在出现故障时能通过重构恢复功能。状态检测、故障诊断和系统重构是卫星自主运行的重要组成部分，实现自主化与智能化，可以提高卫星在轨运行稳定性和生存能力。\n\
    \n10.3　智能在轨维护需求\n\n1.可重构计算\n\n随着航天技术、信息技术的不断发展，航天器功能日趋复杂、多样化，除传统的高可靠、长寿命等特点外，灵活高效、快速响应等成为航天器的应用需求和发展方向。可重构计算技术能够实现在轨灵活可变的硬件系统，有效提升航天器的复杂功能适应性。\n\
    \n当前，学术界普遍接受的可重构计算（Reconfigurable Computing）概念在1999年由加利福尼亚大学伯克利分校的AndréDehon、John\
    \ Wawrzynek提出。该定义通过与传统计算模式的对比给出：一是区别于ASIC，即可重构计算能够在硬件生产制造后针对计算任务进行重新定制；二是区别于通用处理器，即可重构计算能够为算法向硬件的映射提供大量定制空间。2002年，Ketherine\
    \ Compton、Scott Hauck给出了更加具体的定义：使用集成了可编程硬件的系统进行计算，并且该可编程硬件的功能可由一系列定时变化的物理可控点来定义。\n\
    \n可重构计算思想最早由加利福尼亚大学洛杉矶分校的Gerald Estrin在1962年提出，但由于缺乏可重构器件技术的支撑，其实现的可重构系统只是可重构计算设计理念的一个近似。20世纪80年代中期，随着Xilinx公司推出现场可编程门阵列技术（FPGA）、Altera公司推出复杂可编程逻辑器件（CPLD）之后，可重构计算技术逐渐获得了广泛应用。随着FPGA技术的进一步成熟，FPGA成为可重构计算的主流硬件平台。\n\
    \n可重构计算出现初期并未获得足够的重视，直到1992年，美国超级计算机中心基于Xilinx公司FPGA设计的Splash 2系统，在基因组分析计算和灰度图像中值滤波器应用中，它比当时的SPARC\
    \ 10工作站的运算速度分别快了2 500倍和140倍。这一惊人的结果，引发了学术界和产业界对可重构计算的兴趣。随着信息技术的不断发展，可重构计算被广泛应用到基因组匹配、高能物理、图像处理、金融数据处理、云计算、机器学习等各种计算密集型算法的加速计算，其灵活高效的特点被众多领域关注。\n\
    \n利用支持部分重构的可重构硬件构建部分动态重构计算系统，除具备可重构计算系统普遍具备的灵活性和高效率的特点外，还能够在小规模器件上实现较大规模的应用，从而提高硬件利用率。同时，部分重构的特点，使部分动态重构系统可以支持实时多任务。鉴于部分动态重构系统在灵活性、计算效率、硬件利用率及实时多任务支持方面的优势，其已经成为可重构计算的主流发展方向，并且获得了商业FPGA器件及其开发工具的广泛支持。\n\
    \n2.软件在轨维护技术\n\n星载软件在轨维护设计与实施具有系统性，不仅仅局限于星载软件自身，而且与星载计算机硬件（处理器、SRAM、EEPROM等可编程存储器）、操作系统等诸多因素密切相关。\n\
    \n通常，星载软件在轨维护实施阶段主要在卫星发射入轨之后，通过遥控注入形式进行星载软件的升级，解决类似于卫星系统故障、升级系统功能以及消除星载软件原本设计缺陷等问题。据统计，每个卫星寿命周期内平均实施15次星载软件在轨维护，平均每年实施2次。\n\
    \n星载软件在轨可维护性、易维护性，很大程度上受到星载软件设计方法与实现方式等因素影响，与星载软件架构也具有密切相关性。良好的软件设计会考虑将来软件在轨维护的可靠性与便捷性，不好的设计使得软件不支持在轨维护或若要在轨维护需要很大工作量。\n\
    \n软件定义思路通过软件给硬件赋能，提供智能化、定制化的服务，使应用软件与硬件的深度耦合。因此，需求可定义、硬件可重组、软件可升级、功能可重构的软件定义卫星愈发引起各国卫星研制人员的关注。扩展卫星的业务和能力需要卫星体系架构具有一致的程序执行环境，具有丰富的应用软件，可以根据任务需求动态配置和执行不同的应用软件，完成不同的任务。\n\
    \n软件定义卫星能够灵活实现星载软件在轨升级的同时，由于其软件升级的便捷性，也需要考虑网络安全及预防黑客攻击。\n\n为提高卫星系统可靠性，同时便于星载软件在轨维护操作，当前国内主要航天器研发单位（如中国空间技术研究院），各分系统设计时普遍增加在轨维护软件，专门用于实施针对星载软件的在轨维护操作，通常针对星载软件镜像进行整体覆盖替换。若需要针对星载软件实施在轨维护，则通过遥控指令将CPU切换至在轨维护软件运行，在轨维护软件负责遥控注入软件的接收以及可编程存储器的读写操作，直至可编程存储器更新完成，计算机重新上电或复位后，CPU开始执行最新维护的星载软件。\n\
    \n通常，在轨维护软件启动实施在轨维护工作，会导致卫星/航天器飞行任务中止或业务不连续，只能在地面人员复核工况可接受前提下开展。由于在轨维护软件启动实施会使得任务中止，对于载人飞船等高可靠要求的航天器而言并非最佳选择。为此，以某载人飞船数管分系统为例，工程师结合三机冗余热备份星载计算机架构特点，针对在轨维护软件的工作模式进行改进，使得航天器实现在业务连续情况下的在轨维护操作，传统模式业务会出现中断；改进模式，利用三机通信管理功能实现在轨维护单机与当班单机之间的通信，交换遥控遥测数据的同时，实现正常业务与在轨维护操作。\n\
    \n\uFEFF\n\n第四部分　空间人工智能及在轨应用技术研究\n\n为满足航天器智能应用需求，需协调发展空间人工智能及在轨应用技术涉及的基础技术、共性技术、应用技术等几类关键技术。\n\
    \n\uFEFF\n\n第11章　基础技术\n\n本章将人工智能基础技术定义为操作系统、网络通信、大数据、云平台等。下面分别对操作系统、数据传输、大数据以及天基云计算技术展开阐述。\n\
    \n11.1　操作系统技术\n\n操作系统作为信息产业的“灵魂”，尤其巨星座操作系统，是支撑巨星座高效管理及智能应用的核心关键。\n\n太空既是物理域、信息域和认知域的天然结合点，也是世界航天大国竞相开发利用的领域。美国将国家安全战略重心转向太空，制定了“主宰太空2030”规划，提出了“国防太空体系”七层架构，持续发展相关技术和应用概念，迭代演进，有望颠覆传统航天体系形态和发展模式。\n\
    \n国外以星链、一网为代表的大规模星座网络已展开大规模部署和应用。例如，截至2023年1月，SpaceX公司已累计发射3 717颗星链卫星，在轨3 425颗，正常工作3\
    \ 389颗，形成了覆盖全球的通信服务能力；其星上装载有基于Linux定制、面向卫星网络应用场景的分布式实时操作系统。\n\n2022年12月3日，SpaceX公司发布“星盾”计划，主要提供遥感、通信和载荷托管3方面服务，并且“星盾”在星链数据加密服务基础上使用额外加密技术来保证托管载荷数据处理安全性。作为“星链”计划的军用版，其主要特点为：一是安全性和抗干扰能力；二是模块化设计；三是互操作性；四是快速开发和部署；五是弹性和扩展能力。\n\
    \n为更好满足我国发展经济、服务群众民生等需求，占据空间轨位和频率资源，我国卫星互联网等大规模星座建设已经上升为国家战略，并被纳入“新基建”。2020年9月，我国向国际电信联盟（ITU）申请了卫星总量为12992颗的频率和轨道资源。2021年4月，组建了中国卫星网络集团有限公司作为中国卫星互联网星座的运营主体。综上，提升巨星座的高效管理和智能应用能力已成为巨星座体系效能跃升的关键。\n\
    \n操作系统作为巨星座的核心基础设施，承载着巨星座资源管理、互联互通、自主运控、协同应用、安全可信等核心基础功能，是巨星座高效管理和智能应用的信息基座。\n\
    \n11.1.1　巨星座操作系统需求分析\n\n因为不同的应用场景需要不同的操作系统，所以要构建满足巨星座高效管理及智能应用场景的操作系统，就需要对巨星座系统功能需求进行分析。重点分析巨星座系统多功能可重构、协同一体、软件定义、全链路安全可信等典型应用功能，以支撑我国面向巨星座复杂应用场景的星云操作系统研制。\n\
    \n1.巨星座多功能可重构需求"
  fmt: '

    随着低轨移动互联网星座的建设及用户不断增长的需求，未来通信卫星提供的服务将不只是由单颗卫星提供，而是由多个卫星组网并协同为用户提供通信服务。


    为了更好地满足通信与导航卫星业务需求，未来通信与导航卫星的发展除了提升单颗卫星的技术水平和功能外，多颗通信卫星的组网通信、任务协作是必然的发展趋势。但是，通信与导航卫星网络面临星间链路拓扑、分布式管理、多任务规划、多星协同、资源分配等问题。如何基于人工智能技术解决这些问题、实现智能组网是要解决的关键问题。


    广义的卫星网络（Satellite Network）由通信、侦察、导航、气象等多种功能的异构卫星/卫星星座、空间飞行器以及地面有线和无线网络设施组成，通过星间/星地链路将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合。地面和卫星间可以根据应用需求建立星间链路，进行数据交换。它既可以是现有卫星系统的按需集成，也可以是根据需求进行“一体化”设计的结果，具有多功能融合、组成结构动态可变、运行状态复杂、信息交换处理一体化等功能特点。


    天地一体化信息网络包括天基信息网络与地基信息网络两大部分，不仅要求实现互联互通，更要实现一体化的融合，是对未来信息网络向综合化发展的统称。可以将其定义为：通过星间、星地、星空以及地面站间的链路，将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合，采用智能高速处理、交换和路由技术，按照信息资源的最大有效综合利用原则，进行信息准确获取、快速处理和高效传输的一体化高速宽带大容量信息网络，即天基、空基和陆基一体化综合网络。


    在群智能卫星系统中，为了实现高度的自主性计划，基于社会结构的推理方法必须运用先进的人工智能技术，如神经网络、模糊逻辑和遗传算法等。为了辅助和维持高水平的自主性，更重要的任务还要考虑自主运行的修正能力，以便适应环境变化、远距离操控和低带宽通信等问题。


    利用神经网络学习和进化的思想应用在卫星集群上，通过卫星控制器的协同进化，增强卫星的群体协作能力，如编队飞行、姿态同步等。


    # 第10章 共性需求


    航天器的网络化、信息化及智能化发展趋势是不可逆转的。本章主要从高性能计算、自主健康管理以及智能在轨维护方面阐述空间人工智能及在轨应用技术的共性需求。


    ## 10.1 高性能计算需求


    随着用户对卫星要求越来越高，业务数据也越来越庞大，数据关系越来越复杂，同时目前天基系统也存在星上处理能力不足、技术体制落后、无法实现多源数据在轨实时处理/融合等难题。因此，围绕提升天基系统信息服务能力，按需配置网络、计算、存储和载荷等各类硬件资源，构建天基网络自主化、智能化以及快速响应能力。同时，采用模块化设计，实现资源拟态可重构、软件在轨可更新、功能灵活可扩展的新型处理平台，对节点能力在轨提升，支持装备演进升级具有重要的战略意义。


    随着航天市场的逐步开放，卫星市场的“成本”与“效能”越来越受到世界各国科研人员的重视。现在的卫星设计更加强调能够快速处理多种空间业务，在降低开发时间和部署成本的同时，要保证卫星设备使用寿命和可靠性。最后，还要有良好的新技术适用性和可移植性。


    ### 天基信息网络化服务能力需求


    天基信息资源融合高效利用，需要提升网络化信息服务能力。目前，各类型航天器构成的子系统呈现相互闭塞的状态，即便信息落地后也呈现分割的状态，信息无法实现汇聚融合处理。多系统多类型信息综合能力的有限、多系统多任务协同能力的缺失，直接导致天基系统对联合业务的信息服务能力受到严重制约。因此，需要将各类型航天器获取的天基信息资源汇聚到一起，缩短反应链条，提高信息获取、传输、处理、分发和应用的效率，同时完成对各类型信息资源的存储和检索。不仅要求星上平台有极强的计算和存储能力，同时针对不同类型、不同速率的数据还要求它能够进行快速处理、融合与信息产品生成，从而提高天基处理平台通用化、自主化、高效化，满足天基信息快速服务用户需求。


    ### 天基信息可重构服务能力需求


    装备在轨重构要求天基信息服务基础设施具备软件可定义、在线可重构的能力，尤其是高轨卫星在轨寿命长、研制技术复杂、研制周期时间长，一旦卫星在轨更新服务缺失，对新的技术体制支持能力将严重受限。与此同时，随着微电子和高性能计算机等技术的迅猛发展，系统的演进升级需求不断增强，天基装备数量和功能多样化的发展非常迅速，未来对联合作战信息支援能力的需求不断扩展。因此，采用功能模块化、在轨资源可重构、灵活可拓展的新型信息服务平台，对实现节点能力在轨提升，支持装备演进升级具有重要的战略意义。


    ### 天基信息云服务能力需求


    鉴于传统卫星网络的数据传输能力有限，致使大量数据无法下传，需要天基信息具备较强的在轨数据处理能力，快速提取出有效信息，降低存储或传输的数据量，以减小数据存储或下传的压力，节省星上资源。整个工作基于分布式的天基存储/计算资源完成。因此，需要研究适应天基环境的分布式云服务机制。


    随着我国高分辨率遥感卫星系统的发展，遥感信息的质量大幅提高，相应地需要存储或传输的数据量也急剧增加。例如，当遥感卫星图像的地面分辨率接近1 m时，实时数据传输量达每秒Gb数量级；最先进的遥感卫星图像的地面分辨率已经高达0.1
    m，其数据传输量是相当巨大的。由于我国国情的限制，卫星往往不可能全天候处于我国地面站接收范围之内，或者由于卫星的下行能力不能满足实时传输的要求，如此高速而大容量的珍贵数据往往需要首先经过本地存储，进而在适当的时候延时回放。因此，这对星载高速大容量存储和处理系统的能力提出了更高的要求。


    ### 天基信息存储检索服务需求


    信息快速存储与检索要求星上平台具备高效的数据部署及缓存管理机制。由于星载应用环境的特点，传统星载固存一般未采用文件系统，而是采用简单的文件号方式描述每次记录的数据，其可描述内容仅限于文件号、存储地址、记录星时及简单的特征信息等；文件个数一般仅为几十或上百个左右；文件信息一般存储于数据信息载体之外的存储芯片内，如MRAM、EEPROM等。采用这种自定义文件记录方式，无法对大容量、多样化、高速率的星上数据进行有效的系统化管理，尤其是快速地进行数据查找和回放，不能快速定位有效数据会影响任务的正常执行，特别在作战时，可能会急需某种载荷、某个特定地域或者特定时间的数据，数据的正确性和时效性会影响任务的成败。同时，传统的数据管理方式导致经常需要修改文件信息，从而使得软件版本繁多，无法做到通用化、标准化。


    目前，星上各种载荷设备所产生的原始数据呈现出数据量大、传输带宽高等特点，而且探测器连续工作时间越来越长，需记录的总数据量极大。此外，卫星往往需要同时执行多项探测任务，而存储设备需要记录多路超高速数据流，高速率、长时间的数据记录需要极高的存储带宽和极大的存储容量，以及对多路载荷数据在不同时间段产生的原始数据、预处理数据、压缩数据等各类型数据的存储管理。因此，需要研究适用于星载平台的超高速多源数据并行存储技术，以及多源数据检索方法。


    ### 在轨智能计算芯片需求


    随着人工智能算法和应用技术的日益发展，以及人工智能专用芯片ASIC产业环境的逐渐成熟，人工智能ASIC将成为人工智能计算芯片发展的必然趋势。目前，国内对于人工智能芯片的研究不断深入，后续可以选择与技术成熟的公司合作开发适合卫星上专用的智能芯片。


    人工智能应用市场规模庞大，无论是遥感数据还是遥测遥控、通信、导航积累都已经形成海量规模，为星上人工智能芯片发展提供巨大空间。结合卫星平台需求，针对卫星平台亟待解决的问题，进行星上智能芯片设计，最终提升卫星平台智能化水平。


    ## 10.2 自主健康管理需求


    “健康状态”描述了卫星设备及其子系统、部件执行设计功能的能力。“健康状态评估”主要是对利用各种测量手段获取的监测数据、历史数据等进行综合分析，利用各种评估算法对设备的健康状况进行评估，对不合格设备给出原因及操作建议。通过准确了解当前设备的健康状态，对设备的健康状态作出正确的评估，为设备的操作、决策提供依据。


    ### 自主健康状态评估


    卫星健康状态评估技术对保证卫星高可靠、自主稳定运行非常必要，具有重要意义。未来的天基系统单星功能将日趋复杂、多星组网星座系统陆续出现，卫星若发生影响系统服务的故障，不及时处理可能导致系统服务可用性变差，甚至无法使用，直接影响系统的应用效能。此外，在天基系统长时间无地面支持的情况下，卫星若具备星载健康状态评估能力，及时有效处理故障，为任务规划、维护等提供决策支持，将有效提高系统的生存能力，具有重要价值。


    ### 卫星高可靠和高自主性


    卫星是一个涉及多学科、多领域技术的复杂系统，又在恶劣复杂的空间环境中飞行，尽管在设计、研制过程中采取了一系列可靠性的措施，但卫星在轨飞行中仍不可避免地会发生各种故障，使卫星健康状态出现突然或逐渐恶化。统计表明，在1990—2009年成功发射的1
    036个航天器中，就有156个发生了故障，占航天器总数的15%。同时，航天任务的特殊性，又使得航天器在轨期间一旦发生故障，如不采取措施，就可能导致整个飞行任务的失败。然而，单纯依靠地面采取补救措施，其有效性和实时性有限，可能会错过最佳处理时机而导致任务失败。如果在卫星上能够采取健康状态评估技术，及时发现健康状态异常状况，并在此基础上，实现故障有效及时处理，对整个卫星系统工作连续性、稳定性和安全性意义重大。


    ### 智能故障诊断与预测


    卫星健康状态评估最终目的是保证卫星高可靠稳定运行，需要及时对故障进行诊断、隔离、切换或者重构，对未来可能发生的故障做出预测，并据此做出有效的健康状态评估，以供决策支持。因此，故障诊断方法、故障预测方法是实现卫星健康状态评估的基础技术，也是能否实现健康状态评估的关键。健康状态评估并非仅限于整星系统级、分系统级、关键组部件的故障诊断，故障预测结果也是卫星健康状态评估的重要组成部分。


    故障诊断是指通过一定的方法对被诊断设备中的各种状态信息进行综合处理，从而得出设备运行状态以及故障状况的评价过程。从本质上来说，故障诊断是一个模式分类和识别的过程。近四十年来，故障诊断技术迅速发展成为一门新的学科，也是为适应各种工程需要而建立的交叉性学科，涉及传感器、信号分析及数据处理、人工智能、自动控制、预测预报等领域。


    故障预测方法是健康状态评估的重要组成部分。预测是对尚未发生、或者目前还不明确的事物进行预想估计与推测，是在现时对系统将要发生的结果进行探讨和研究，给出系统健康状态的发展趋势，在某种意义上是一种推理过程。故障预测是实现故障预防、提高故障诊断实时性的技术手段。故障预测技术主要是基于致命故障或者损耗性故障关键参数的变化趋势进行分析，以推断航天器未来的可能状态，从而采取预防措施避免航天器故障的发生或者降低航天器故障的危害程度。


    目前，基于模型的方法大多应用于飞行器、旋转机构等机电系统中，而对于复杂系统，由于其故障模式和失效机理相对复杂，其故障预测的模型化研究相对滞后。卫星是一个动态系统，在轨运行时需要监测工作状态，当出现故障时还需要进行诊断。另外，卫星各个重要分系统都采取冗余备份措施，希望在出现故障时能通过重构恢复功能。状态检测、故障诊断和系统重构是卫星自主运行的重要组成部分，实现自主化与智能化，可以提高卫星在轨运行稳定性和生存能力。


    ## 10.3 智能在轨维护需求


    ### 可重构计算


    随着航天技术、信息技术的不断发展，航天器功能日趋复杂、多样化，除传统的高可靠、长寿命等特点外，灵活高效、快速响应等成为航天器的应用需求和发展方向。可重构计算技术能够实现在轨灵活可变的硬件系统，有效提升航天器的复杂功能适应性。


    当前，学术界普遍接受的可重构计算（Reconfigurable Computing）概念在1999年由加利福尼亚大学伯克利分校的AndréDehon、John
    Wawrzynek提出。该定义通过与传统计算模式的对比给出：一是区别于ASIC，即可重构计算能够在硬件生产制造后针对计算任务进行重新定制；二是区别于通用处理器，即可重构计算能够为算法向硬件的映射提供大量定制空间。2002年，Ketherine
    Compton、Scott Hauck给出了更加具体的定义：使用集成了可编程硬件的系统进行计算，并且该可编程硬件的功能可由一系列定时变化的物理可控点来定义。


    可重构计算思想最早由加利福尼亚大学洛杉矶分校的Gerald Estrin在1962年提出，但由于缺乏可重构器件技术的支撑，其实现的可重构系统只是可重构计算设计理念的一个近似。20世纪80年代中期，随着Xilinx公司推出现场可编程门阵列技术（FPGA）、Altera公司推出复杂可编程逻辑器件（CPLD）之后，可重构计算技术逐渐获得了广泛应用。随着FPGA技术的进一步成熟，FPGA成为可重构计算的主流硬件平台。


    可重构计算出现初期并未获得足够的重视，直到1992年，美国超级计算机中心基于Xilinx公司FPGA设计的Splash 2系统，在基因组分析计算和灰度图像中值滤波器应用中，它比当时的SPARC
    10工作站的运算速度分别快了2 500倍和140倍。这一惊人的结果，引发了学术界和产业界对可重构计算的兴趣。随着信息技术的不断发展，可重构计算被广泛应用到基因组匹配、高能物理、图像处理、金融数据处理、云计算、机器学习等各种计算密集型算法的加速计算，其灵活高效的特点被众多领域关注。


    利用支持部分重构的可重构硬件构建部分动态重构计算系统，除具备可重构计算系统普遍具备的灵活性和高效率的特点外，还能够在小规模器件上实现较大规模的应用，从而提高硬件利用率。同时，部分重构的特点，使部分动态重构系统可以支持实时多任务。鉴于部分动态重构系统在灵活性、计算效率、硬件利用率及实时多任务支持方面的优势，其已经成为可重构计算的主流发展方向，并且获得了商业FPGA器件及其开发工具的广泛支持。


    ### 软件在轨维护技术


    星载软件在轨维护设计与实施具有系统性，不仅仅局限于星载软件自身，而且与星载计算机硬件（处理器、SRAM、EEPROM等可编程存储器）、操作系统等诸多因素密切相关。


    通常，星载软件在轨维护实施阶段主要在卫星发射入轨之后，通过遥控注入形式进行星载软件的升级，解决类似于卫星系统故障、升级系统功能以及消除星载软件原本设计缺陷等问题。据统计，每个卫星寿命周期内平均实施15次星载软件在轨维护，平均每年实施2次。


    星载软件在轨可维护性、易维护性，很大程度上受到星载软件设计方法与实现方式等因素影响，与星载软件架构也具有密切相关性。良好的软件设计会考虑将来软件在轨维护的可靠性与便捷性，不好的设计使得软件不支持在轨维护或若要在轨维护需要很大工作量。


    软件定义思路通过软件给硬件赋能，提供智能化、定制化的服务，使应用软件与硬件的深度耦合。因此，需求可定义、硬件可重组、软件可升级、功能可重构的软件定义卫星愈发引起各国卫星研制人员的关注。扩展卫星的业务和能力需要卫星体系架构具有一致的程序执行环境，具有丰富的应用软件，可以根据任务需求动态配置和执行不同的应用软件，完成不同的任务。


    软件定义卫星能够灵活实现星载软件在轨升级的同时，由于其软件升级的便捷性，也需要考虑网络安全及预防黑客攻击。


    为提高卫星系统可靠性，同时便于星载软件在轨维护操作，当前国内主要航天器研发单位（如中国空间技术研究院），各分系统设计时普遍增加在轨维护软件，专门用于实施针对星载软件的在轨维护操作，通常针对星载软件镜像进行整体覆盖替换。若需要针对星载软件实施在轨维护，则通过遥控指令将CPU切换至在轨维护软件运行，在轨维护软件负责遥控注入软件的接收以及可编程存储器的读写操作，直至可编程存储器更新完成，计算机重新上电或复位后，CPU开始执行最新维护的星载软件。


    通常，在轨维护软件启动实施在轨维护工作，会导致卫星/航天器飞行任务中止或业务不连续，只能在地面人员复核工况可接受前提下开展。由于在轨维护软件启动实施会使得任务中止，对于载人飞船等高可靠要求的航天器而言并非最佳选择。为此，以某载人飞船数管分系统为例，工程师结合三机冗余热备份星载计算机架构特点，针对在轨维护软件的工作模式进行改进，使得航天器实现在业务连续情况下的在轨维护操作，传统模式业务会出现中断；改进模式，利用三机通信管理功能实现在轨维护单机与当班单机之间的通信，交换遥控遥测数据的同时，实现正常业务与在轨维护操作。


    # 第四部分 空间人工智能及在轨应用技术研究


    为满足航天器智能应用需求，需协调发展空间人工智能及在轨应用技术涉及的基础技术、共性技术、应用技术等几类关键技术。


    # 第11章 基础技术


    本章将人工智能基础技术定义为操作系统、网络通信、大数据、云平台等。下面分别对操作系统、数据传输、大数据以及天基云计算技术展开阐述。


    ## 11.1 操作系统技术


    操作系统作为信息产业的“灵魂”，尤其巨星座操作系统，是支撑巨星座高效管理及智能应用的核心关键。


    太空既是物理域、信息域和认知域的天然结合点，也是世界航天大国竞相开发利用的领域。美国将国家安全战略重心转向太空，制定了“主宰太空2030”规划，提出了“国防太空体系”七层架构，持续发展相关技术和应用概念，迭代演进，有望颠覆传统航天体系形态和发展模式。


    国外以星链、一网为代表的大规模星座网络已展开大规模部署和应用。例如，截至2023年1月，SpaceX公司已累计发射3 717颗星链卫星，在轨3 425颗，正常工作3
    389颗，形成了覆盖全球的通信服务能力；其星上装载有基于Linux定制、面向卫星网络应用场景的分布式实时操作系统。


    2022年12月3日，SpaceX公司发布“星盾”计划，主要提供遥感、通信和载荷托管3方面服务，并且“星盾”在星链数据加密服务基础上使用额外加密技术来保证托管载荷数据处理安全性。作为“星链”计划的军用版，其主要特点为：一是安全性和抗干扰能力；二是模块化设计；三是互操作性；四是快速开发和部署；五是弹性和扩展能力。


    为更好满足我国发展经济、服务群众民生等需求，占据空间轨位和频率资源，我国卫星互联网等大规模星座建设已经上升为国家战略，并被纳入“新基建”。2020年9月，我国向国际电信联盟（ITU）申请了卫星总量为12992颗的频率和轨道资源。2021年4月，组建了中国卫星网络集团有限公司作为中国卫星互联网星座的运营主体。综上，提升巨星座的高效管理和智能应用能力已成为巨星座体系效能跃升的关键。


    操作系统作为巨星座的核心基础设施，承载着巨星座资源管理、互联互通、自主运控、协同应用、安全可信等核心基础功能，是巨星座高效管理和智能应用的信息基座。


    ### 11.1.1 巨星座操作系统需求分析


    因为不同的应用场景需要不同的操作系统，所以要构建满足巨星座高效管理及智能应用场景的操作系统，就需要对巨星座系统功能需求进行分析。重点分析巨星座系统多功能可重构、协同一体、软件定义、全链路安全可信等典型应用功能，以支撑我国面向巨星座复杂应用场景的星云操作系统研制。


    #### 巨星座多功能可重构需求

    '
  trans: '


    随着低轨移动互联网星座的建设及用户不断增长的需求，未来通信卫星提供的服务将不只是由单颗卫星提供，而是由多个卫星组网并协同为用户提供通信服务。


    为了更好地满足通信与导航卫星业务需求，未来通信与导航卫星的发展除了提升单颗卫星的技术水平和功能外，多颗通信卫星的组网通信、任务协作是必然的发展趋势。但是，通信与导航卫星网络面临星间链路拓扑、分布式管理、多任务规划、多星协同、资源分配等问题。如何基于人工智能技术解决这些问题、实现智能组网是要解决的关键问题。


    广义的卫星网络（Satellite Network）由通信、侦察、导航、气象等多种功能的异构卫星/卫星星座、空间飞行器以及地面有线和无线网络设施组成，通过星间/星地链路将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合。地面和卫星间可以根据应用需求建立星间链路，进行数据交换。它既可以是现有卫星系统的按需集成，也可以是根据需求进行“一体化”设计的结果，具有多功能融合、组成结构动态可变、运行状态复杂、信息交换处理一体化等功能特点。


    天地一体化信息网络包括天基信息网络与地基信息网络两大部分，不仅要求实现互联互通，更要实现一体化的融合，是对未来信息网络向综合化发展的统称。可以将其定义为：通过星间、星地、星空以及地面站间的链路，将地面、海上、空中和深空中的用户、飞行器以及各种通信平台密集联合，采用智能高速处理、交换和路由技术，按照信息资源的最大有效综合利用原则，进行信息准确获取、快速处理和高效传输的一体化高速宽带大容量信息网络，即天基、空基和陆基一体化综合网络。


    在群智能卫星系统中，为了实现高度的自主性计划，基于社会结构的推理方法必须运用先进的人工智能技术，如神经网络、模糊逻辑和遗传算法等。为了辅助和维持高水平的自主性，更重要的任务还要考虑自主运行的修正能力，以便适应环境变化、远距离操控和低带宽通信等问题。


    利用神经网络学习和进化的思想应用在卫星集群上，通过卫星控制器的协同进化，增强卫星的群体协作能力，如编队飞行、姿态同步等。


    # 第 10 章 共性需求


    航天器的网络化、信息化及智能化发展趋势是不可逆转的。本章主要从高性能计算、自主健康管理以及智能在轨维护方面阐述空间人工智能及在轨应用技术的共性需求。


    ## 10.1 高性能计算需求


    随着用户对卫星要求越来越高，业务数据也越来越庞大，数据关系越来越复杂，同时目前天基系统也存在星上处理能力不足、技术体制落后、无法实现多源数据在轨实时处理/融合等难题。因此，围绕提升天基系统信息服务能力，按需配置网络、计算、存储和载荷等各类硬件资源，构建天基网络自主化、智能化以及快速响应能力。同时，采用模块化设计，实现资源拟态可重构、软件在轨可更新、功能灵活可扩展的新型处理平台，对节点能力在轨提升，支持装备演进升级具有重要的战略意义。


    随着航天市场的逐步开放，卫星市场的“成本”与“效能”越来越受到世界各国科研人员的重视。现在的卫星设计更加强调能够快速处理多种空间业务，在降低开发时间和部署成本的同时，要保证卫星设备使用寿命和可靠性。最后，还要有良好的新技术适用性和可移植性。


    ### 天基信息网络化服务能力需求


    天基信息资源融合高效利用，需要提升网络化信息服务能力。目前，各类型航天器构成的子系统呈现相互闭塞的状态，即便信息落地后也呈现分割的状态，信息无法实现汇聚融合处理。多系统多类型信息综合能力的有限、多系统多任务协同能力的缺失，直接导致天基系统对联合业务的信息服务能力受到严重制约。因此，需要将各类型航天器获取的天基信息资源汇聚到一起，缩短反应链条，提高信息获取、传输、处理、分发和应用的效率，同时完成对各类型信息资源的存储和检索。不仅要求星上平台有极强的计算和存储能力，同时针对不同类型、不同速率的数据还要求它能够进行快速处理、融合与信息产品生成，从而提高天基处理平台通用化、自主化、高效化，满足天基信息快速服务用户需求。


    ### 天基信息可重构服务能力需求


    装备在轨重构要求天基信息服务基础设施具备软件可定义、在线可重构的能力，尤其是高轨卫星在轨寿命长、研制技术复杂、研制周期时间长，一旦卫星在轨更新服务缺失，对新的技术体制支持能力将严重受限。与此同时，随着微电子和高性能计算机等技术的迅猛发展，系统的演进升级需求不断增强，天基装备数量和功能多样化的发展非常迅速，未来对联合作战信息支援能力的需求不断扩展。因此，采用功能模块化、在轨资源可重构、灵活可拓展的新型信息服务平台，对实现节点能力在轨提升，支持装备演进升级具有重要的战略意义。


    ### 天基信息云服务能力需求


    鉴于传统卫星网络的数据传输能力有限，致使大量数据无法下传，需要天基信息具备较强的在轨数据处理能力，快速提取出有效信息，降低存储或传输的数据量，以减小数据存储或下传的压力，节省星上资源。整个工作基于分布式的天基存储/计算资源完成。因此，需要研究适应天基环境的分布式云服务机制。


    随着我国高分辨率遥感卫星系统的发展，遥感信息的质量大幅提高，相应地需要存储或传输的数据量也急剧增加。例如，当遥感卫星图像的地面分辨率接近 1 m 时，实时数据传输量达每秒
    Gb 数量级；最先进的遥感卫星图像的地面分辨率已经高达 0.1 m，其数据传输量是相当巨大的。由于我国国情的限制，卫星往往不可能全天候处于我国地面站接收范围之内，或者由于卫星的下行能力不能满足实时传输的要求，如此高速而大容量的珍贵数据往往需要首先经过本地存储，进而在适当的时候延时回放。因此，这对星载高速大容量存储和处理系统的能力提出了更高的要求。


    ### 天基信息存储检索服务需求


    信息快速存储与检索要求星上平台具备高效的数据部署及缓存管理机制。由于星载应用环境的特点，传统星载固存一般未采用文件系统，而是采用简单的文件号方式描述每次记录的数据，其可描述内容仅限于文件号、存储地址、记录星时及简单的特征信息等；文件个数一般仅为几十或上百个左右；文件信息一般存储于数据信息载体之外的存储芯片内，如
    MRAM、EEPROM 等。采用这种自定义文件记录方式，无法对大容量、多样化、高速率的星上数据进行有效的系统化管理，尤其是快速地进行数据查找和回放，不能快速定位有效数据会影响任务的正常执行，特别在作战时，可能会急需某种载荷、某个特定地域或者特定时间的数据，数据的正确性和时效性会影响任务的成败。同时，传统的数据管理方式导致经常需要修改文件信息，从而使得软件版本繁多，无法做到通用化、标准化。


    目前，星上各种载荷设备所产生的原始数据呈现出数据量大、传输带宽高等特点，而且探测器连续工作时间越来越长，需记录的总数据量极大。此外，卫星往往需要同时执行多项探测任务，而存储设备需要记录多路超高速数据流，高速率、长时间的数据记录需要极高的存储带宽和极大的存储容量，以及对多路载荷数据在不同时间段产生的原始数据、预处理数据、压缩数据等各类型数据的存储管理。因此，需要研究适用于星载平台的超高速多源数据并行存储技术，以及多源数据检索方法。


    ### 在轨智能计算芯片需求


    随着人工智能算法和应用技术的日益发展，以及人工智能专用芯片 ASIC 产业环境的逐渐成熟，人工智能 ASIC 将成为人工智能计算芯片发展的必然趋势。目前，国内对于人工智能芯片的研究不断深入，后续可以选择与技术成熟的公司合作开发适合卫星上专用的智能芯片。


    人工智能应用市场规模庞大，无论是遥感数据还是遥测遥控、通信、导航积累都已经形成海量规模，为星上人工智能芯片发展提供巨大空间。结合卫星平台需求，针对卫星平台亟待解决的问题，进行星上智能芯片设计，最终提升卫星平台智能化水平。


    ## 10.2 自主健康管理需求


    “健康状态”描述了卫星设备及其子系统、部件执行设计功能的能力。“健康状态评估”主要是对利用各种测量手段获取的监测数据、历史数据等进行综合分析，利用各种评估算法对设备的健康状况进行评估，对不合格设备给出原因及操作建议。通过准确了解当前设备的健康状态，对设备的健康状态作出正确的评估，为设备的操作、决策提供依据。


    ### 自主健康状态评估


    卫星健康状态评估技术对保证卫星高可靠、自主稳定运行非常必要，具有重要意义。未来的天基系统单星功能将日趋复杂、多星组网星座系统陆续出现，卫星若发生影响系统服务的故障，不及时处理可能导致系统服务可用性变差，甚至无法使用，直接影响系统的应用效能。此外，在天基系统长时间无地面支持的情况下，卫星若具备星载健康状态评估能力，及时有效处理故障，为任务规划、维护等提供决策支持，将有效提高系统的生存能力，具有重要价值。


    ### 卫星高可靠和高自主性


    卫星是一个涉及多学科、多领域技术的复杂系统，又在恶劣复杂的空间环境中飞行，尽管在设计、研制过程中采取了一系列可靠性的措施，但卫星在轨飞行中仍不可避免地会发生各种故障，使卫星健康状态出现突然或逐渐恶化。统计表明，在
    1990—2009 年成功发射的 1 036 个航天器中，就有 156 个发生了故障，占航天器总数的 15%。同时，航天任务的特殊性，又使得航天器在轨期间一旦发生故障，如不采取措施，就可能导致整个飞行任务的失败。然而，单纯依靠地面采取补救措施，其有效性和实时性有限，可能会错过最佳处理时机而导致任务失败。如果在卫星上能够采取健康状态评估技术，及时发现健康状态异常状况，并在此基础上，实现故障有效及时处理，对整个卫星系统工作连续性、稳定性和安全性意义重大。


    ### 智能故障诊断与预测


    卫星健康状态评估最终目的是保证卫星高可靠稳定运行，需要及时对故障进行诊断、隔离、切换或者重构，对未来可能发生的故障做出预测，并据此做出有效的健康状态评估，以供决策支持。因此，故障诊断方法、故障预测方法是实现卫星健康状态评估的基础技术，也是能否实现健康状态评估的关键。健康状态评估并非仅限于整星系统级、分系统级、关键组部件的故障诊断，故障预测结果也是卫星健康状态评估的重要组成部分。


    故障诊断是指通过一定的方法对被诊断设备中的各种状态信息进行综合处理，从而得出设备运行状态以及故障状况的评价过程。从本质上来说，故障诊断是一个模式分类和识别的过程。近四十年来，故障诊断技术迅速发展成为一门新的学科，也是为适应各种工程需要而建立的交叉性学科，涉及传感器、信号分析及数据处理、人工智能、自动控制、预测预报等领域。


    故障预测方法是健康状态评估的重要组成部分。预测是对尚未发生、或者目前还不明确的事物进行预想估计与推测，是在现时对系统将要发生的结果进行探讨和研究，给出系统健康状态的发展趋势，在某种意义上是一种推理过程。故障预测是实现故障预防、提高故障诊断实时性的技术手段。故障预测技术主要是基于致命故障或者损耗性故障关键参数的变化趋势进行分析，以推断航天器未来的可能状态，从而采取预防措施避免航天器故障的发生或者降低航天器故障的危害程度。


    目前，基于模型的方法大多应用于飞行器、旋转机构等机电系统中，而对于复杂系统，由于其故障模式和失效机理相对复杂，其故障预测的模型化研究相对滞后。卫星是一个动态系统，在轨运行时需要监测工作状态，当出现故障时还需要进行诊断。另外，卫星各个重要分系统都采取冗余备份措施，希望在出现故障时能通过重构恢复功能。状态检测、故障诊断和系统重构是卫星自主运行的重要组成部分，实现自主化与智能化，可以提高卫星在轨运行稳定性和生存能力。


    ## 10.3 智能在轨维护需求


    ### 可重构计算


    随着航天技术、信息技术的不断发展，航天器功能日趋复杂、多样化，除传统的高可靠、长寿命等特点外，灵活高效、快速响应等成为航天器的应用需求和发展方向。可重构计算技术能够实现在轨灵活可变的硬件系统，有效提升航天器的复杂功能适应性。


    当前，学术界普遍接受的可重构计算（Reconfigurable Computing）概念在 1999 年由加利福尼亚大学伯克利分校的 AndréDehon、John
    Wawrzynek 提出。该定义通过与传统计算模式的对比给出：一是区别于 ASIC，即可重构计算能够在硬件生产制造后针对计算任务进行重新定制；二是区别于通用处理器，即可重构计算能够为算法向硬件的映射提供大量定制空间。2002
    年，Ketherine Compton、Scott Hauck 给出了更加具体的定义：使用集成了可编程硬件的系统进行计算，并且该可编程硬件的功能可由一系列定时变化的物理可控点来定义。


    可重构计算思想最早由加利福尼亚大学洛杉矶分校的 Gerald Estrin 在 1962 年提出，但由于缺乏可重构器件技术的支撑，其实现的可重构系统只是可重构计算设计理念的一个近似。20
    世纪 80 年代中期，随着 Xilinx 公司推出现场可编程门阵列技术（FPGA）、Altera 公司推出复杂可编程逻辑器件（CPLD）之后，可重构计算技术逐渐获得了广泛应用。随着
    FPGA 技术的进一步成熟，FPGA 成为可重构计算的主流硬件平台。


    可重构计算出现初期并未获得足够的重视，直到 1992 年，美国超级计算机中心基于 Xilinx 公司 FPGA 设计的 Splash 2 系统，在基因组分析计算和灰度图像中值滤波器应用中，它比当时的
    SPARC 10 工作站的运算速度分别快了 2 500 倍和 140 倍。这一惊人的结果，引发了学术界和产业界对可重构计算的兴趣。随着信息技术的不断发展，可重构计算被广泛应用到基因组匹配、高能物理、图像处理、金融数据处理、云计算、机器学习等各种计算密集型算法的加速计算，其灵活高效的特点被众多领域关注。


    利用支持部分重构的可重构硬件构建部分动态重构计算系统，除具备可重构计算系统普遍具备的灵活性和高效率的特点外，还能够在小规模器件上实现较大规模的应用，从而提高硬件利用率。同时，部分重构的特点，使部分动态重构系统可以支持实时多任务。鉴于部分动态重构系统在灵活性、计算效率、硬件利用率及实时多任务支持方面的优势，其已经成为可重构计算的主流发展方向，并且获得了商业
    FPGA 器件及其开发工具的广泛支持。


    ### 软件在轨维护技术


    星载软件在轨维护设计与实施具有系统性，不仅仅局限于星载软件自身，而且与星载计算机硬件（处理器、SRAM、EEPROM 等可编程存储器）、操作系统等诸多因素密切相关。


    通常，星载软件在轨维护实施阶段主要在卫星发射入轨之后，通过遥控注入形式进行星载软件的升级，解决类似于卫星系统故障、升级系统功能以及消除星载软件原本设计缺陷等问题。据统计，每个卫星寿命周期内平均实施
    15 次星载软件在轨维护，平均每年实施 2 次。


    星载软件在轨可维护性、易维护性，很大程度上受到星载软件设计方法与实现方式等因素影响，与星载软件架构也具有密切相关性。良好的软件设计会考虑将来软件在轨维护的可靠性与便捷性，不好的设计使得软件不支持在轨维护或若要在轨维护需要很大工作量。


    软件定义思路通过软件给硬件赋能，提供智能化、定制化的服务，使应用软件与硬件的深度耦合。因此，需求可定义、硬件可重组、软件可升级、功能可重构的软件定义卫星愈发引起各国卫星研制人员的关注。扩展卫星的业务和能力需要卫星体系架构具有一致的程序执行环境，具有丰富的应用软件，可以根据任务需求动态配置和执行不同的应用软件，完成不同的任务。


    软件定义卫星能够灵活实现星载软件在轨升级的同时，由于其软件升级的便捷性，也需要考虑网络安全及预防黑客攻击。


    为提高卫星系统可靠性，同时便于星载软件在轨维护操作，当前国内主要航天器研发单位（如中国空间技术研究院），各分系统设计时普遍增加在轨维护软件，专门用于实施针对星载软件的在轨维护操作，通常针对星载软件镜像进行整体覆盖替换。若需要针对星载软件实施在轨维护，则通过遥控指令将
    CPU 切换至在轨维护软件运行，在轨维护软件负责遥控注入软件的接收以及可编程存储器的读写操作，直至可编程存储器更新完成，计算机重新上电或复位后，CPU 开始执行最新维护的星载软件。


    通常，在轨维护软件启动实施在轨维护工作，会导致卫星/航天器飞行任务中止或业务不连续，只能在地面人员复核工况可接受前提下开展。由于在轨维护软件启动实施会使得任务中止，对于载人飞船等高可靠要求的航天器而言并非最佳选择。为此，以某载人飞船数管分系统为例，工程师结合三机冗余热备份星载计算机架构特点，针对在轨维护软件的工作模式进行改进，使得航天器实现在业务连续情况下的在轨维护操作，传统模式业务会出现中断；改进模式，利用三机通信管理功能实现在轨维护单机与当班单机之间的通信，交换遥控遥测数据的同时，实现正常业务与在轨维护操作。


    # 第四部分 空间人工智能及在轨应用技术研究


    为满足航天器智能应用需求，需协调发展空间人工智能及在轨应用技术涉及的基础技术、共性技术、应用技术等几类关键技术。


    # 第 11 章 基础技术


    本章将人工智能基础技术定义为操作系统、网络通信、大数据、云平台等。下面分别对操作系统、数据传输、大数据以及天基云计算技术展开阐述。


    ## 11.1 操作系统技术


    操作系统作为信息产业的“灵魂”，尤其巨星座操作系统，是支撑巨星座高效管理及智能应用的核心关键。


    太空既是物理域、信息域和认知域的天然结合点，也是世界航天大国竞相开发利用的领域。美国将国家安全战略重心转向太空，制定了“主宰太空 2030”规划，提出了“国防太空体系”七层架构，持续发展相关技术和应用概念，迭代演进，有望颠覆传统航天体系形态和发展模式。


    国外以星链、一网为代表的大规模星座网络已展开大规模部署和应用。例如，截至 2023 年 1 月，SpaceX 公司已累计发射 3 717 颗星链卫星，在轨
    3 425 颗，正常工作 3 389 颗，形成了覆盖全球的通信服务能力；其星上装载有基于 Linux 定制、面向卫星网络应用场景的分布式实时操作系统。


    2022 年 12 月 3 日，SpaceX 公司发布“星盾”计划，主要提供遥感、通信和载荷托管 3 方面服务，并且“星盾”在星链数据加密服务基础上使用额外加密技术来保证托管载荷数据处理安全性。作为“星链”计划的军用版，其主要特点为：一是安全性和抗干扰能力；二是模块化设计；三是互操作性；四是快速开发和部署；五是弹性和扩展能力。


    为更好满足我国发展经济、服务群众民生等需求，占据空间轨位和频率资源，我国卫星互联网等大规模星座建设已经上升为国家战略，并被纳入“新基建”。2020 年 9
    月，我国向国际电信联盟（ITU）申请了卫星总量为 12992 颗的频率和轨道资源。2021 年 4 月，组建了中国卫星网络集团有限公司作为中国卫星互联网星座的运营主体。综上，提升巨星座的高效管理和智能应用能力已成为巨星座体系效能跃升的关键。


    操作系统作为巨星座的核心基础设施，承载着巨星座资源管理、互联互通、自主运控、协同应用、安全可信等核心基础功能，是巨星座高效管理和智能应用的信息基座。


    ### 11.1.1 巨星座操作系统需求分析


    因为不同的应用场景需要不同的操作系统，所以要构建满足巨星座高效管理及智能应用场景的操作系统，就需要对巨星座系统功能需求进行分析。重点分析巨星座系统多功能可重构、协同一体、软件定义、全链路安全可信等典型应用功能，以支撑我国面向巨星座复杂应用场景的星云操作系统研制。


    #### 巨星座多功能可重构需求


    '
  toc: []
- raw: '未来巨星座的运用将以“多功能可重构”为核心，由传统的“单星单功能的节点加入”改变为“多星协同和云服务的隐节点”，由“天地多次传输处理的长链路”改变为“信息层内优化处理的短链路”，由“新技术和装备研制的划代更新”转变为“新技术和装备功能的通用更新”，支持巨星座的网络化、云化、智能化以及用户无感的高效运行，促进巨星座体系效能的整体性跃升。传统“一星一用”和定制化开发的天基资源运用模式，已经难以满足当前“一星多用、多星组网、多网协同、数据集成服务”的体系化应用需求，需要开发满足支撑巨星座多功能可重构需求的星云操作系统。


    2.巨星座协同一体需求


    面对未来高动态、多功能、可重构的任务需求，巨星座需具备高度自适应和抗损毁能力的天地体系协同组网和信息联通能力，将各卫星的星内传感器、处理器作为网络共享资源节点，可自主调动协同网络中的定位资源、侦查资源和传输资源等，各个网络资源按需接入，综合支持任务应用。与此同时，还需具备多节点、多链路的损毁容忍能力，能够保障复杂任务条件下的网络协同。当前天基资源管控和运用主要依赖地面系统，采用全静态管理模式，完全依赖地面指令上注，自主能力有限，不具备资源协同运用条件，维护工作量巨大。未来万颗规模巨星座系统，靠这种“一星一管”、基本依赖地面人工的管控方法，运行效率将极低或无法正常运行，难以满足高效“用天”的需求，需要开发满足支撑巨星座协同一体需求的巨星座操作系统。


    3.巨星座软件定义需求


    发展软件定义卫星技术，将有效提高航天器产品的软件密集度和功能灵活度，而且可以极大地缩短研发周期，降低研发成本和风险。巨星座系统通过需求可定义、硬件可重组、软件可重配、功能可重构以及APP（应用软件）动态加载等软件定义技术，按需重构完成不同任务，其重要性主要体现在以下4个方面：一是实现巨星座功能和性能的高效持续演进；二是实现高技术在巨星座中快速转化应用；三是实现卫星产品标准化，为卫星批量制造奠定技术基础；四是构建航天软件生态体系，助力软件成果共享和持续发展。当前卫星研制模式基本属于“一案一例”功能定制的开发形式，以程序化模式为特征，不能适应情报智能生成与信息即时支援需求，需要开发满足支撑巨星座软件定义需求的巨星座操作系统。


    4.巨星座全链路安全可信需求


    空间安全是国家安全的基石，关乎国家整体安全。巨星座系统具有开放的通信链路、高动态变化的拓扑结构、复杂应用以及海量数据信息共享的特性，较单星系统更容易受到异常注入、仿冒篡改、漏洞扫描等网电攻击和干扰，要保障巨星座系统稳定运行，必须解决巨星座全链路的可信与安全问题。巨星座系统的组网方式决定了卫星节点在空间呈分布式特点，单个节点的硬件资源有限，在高效管控自身计算、存储和网络等资源的同时，节点间还需相互协作、安全、高效、可靠地完成指定任务。在确保时效性的前提下，构建“芯片-链路-数据-应用”的全链路安全可信体系，保障巨星座网络的路由、切换、传输、接入等方面的安全可信。当前，基于单星应用模式的空间安全机制不能满足未来巨星座系统基于“云-边-端”分布式协同架构的安全可信需求，需要开发满足支撑巨星座全链路安全可信的巨星座操作系统。


    11.1.2　现有操作系统特点分析


    为快速高效开发面向巨星座应用场景的操作系统，应借鉴现有操作系统的发展经验。现有操作系统包含桌面、物联网、车联网以及卫星等典型应用场景操作系统。通过分析现有操作系统发展历程，总结其发展规律，为面向巨星座复杂应用场景的巨星座操作系统研制提供借鉴。


    1.桌面操作系统


    桌面操作系统是在计算机上借助硬件运行并完成相关应用的基础软件，是当今应用最广泛和最成功的操作系统，几乎渗透所有人的生活、工作等各个场合。


    在桌面操作系统诞生之前，最有名的操作系统是磁盘操作系统（Disk Operating System，DOS），但DOS的操作界面十分不友好，仅仅是字符界面而已，为此微软公司推出了第一个图形界面操作系统Windows1.0。如表11-1所示，经过多年的发展，桌面操作系统主要有Windows、Mac
    OS（Operating System）、Linux（全称GNU/Linux，是一种免费使用和自由传播的操作系统）3种。


    表11-1　主要桌面操作系统对比


    ![](images/txt015_1.jpg "pagenumber_ebook=169,pagenumber_book=158")


    三大桌面操作系统都经历了复杂的演变，各有特点，自成体系，在PC和服务器等领域各自拥有相对独立的用户群体。Windows系列用户群体大，市场占有率超过90%，软件生态完整性好；Mac
    OS适合于专业人员；Linux是全球最大的一个自由免费软件。


    2.物联网操作系统


    继计算机和互联网之后，物联网掀起了信息产业发展的第三次高潮。物联网由海量异构设备组成，部署环境十分复杂。物联网操作系统作为连接物联网应用与物理设备的基础，可以屏蔽物联网的碎片化特征，为应用程序提供统一的编程接口，从而降低开发时间和成本，便于实现整个物联网统一管理。


    随着物联网的兴起，作为实现人与物、物与物互联的基础软件，吸引包括谷歌、华为等各大公司投入大量人力、物力研发。如表11-2所示，比较典型的有谷歌公司下一代替代Android（美国谷歌公司开发的移动操作系统）操作系统的Fuchsia
    OS以及嵌入式智能操作系统Kata OS、华为的Harmony OS等。


    表11-2　主流物联网操作系统对比


    ![](images/txt015_2.jpg "pagenumber_ebook=170,pagenumber_book=159")


    Fuchsia OS是一款面向多平台的物联网操作系统，运行载体不仅是智能手机，还有平板电脑、笔记本电脑甚至是可穿戴设备，预计2023年发布正式版。


    Kata OS是谷歌研发的开源嵌入式操作系统，设计充分考虑安全问题，建立在数学上被证明具有保密性、完整性和可用性的seL4微内核基础上，2022年10月已发布第一版。


    Harmony OS是华为公司开发的一款基于微内核、面向5 G物联网、面向全场景的物联网操作系统，能够支持手机、平板、智能穿戴、智慧屏、耳机等多种终端设备，2022年7月已发布Harmony
    3.0版本。


    3.车联网操作系统


    随着移动互联网和工业智能化的快速发展，汽车产业不断向智能化和网联化快速转变，形成以智能网联汽车为中心的车联网。智能网联汽车通过搭载先进的车载传感器与智能控制系统，并与现代移动通信技术相结合，实现了车与人、车与车、车与路、车与云服务平台之间的信息交换与共享，在为人们交通出行带来便利的同时，有助于政府建立智能化的交通体系。


    车联网操作系统作为智能网联汽车的核心功能底座，是实现软件定义汽车的关键。未来的智能汽车是信息域和能源域的天然结合点，作为计算中心，包含有高速的传输网络、强大的计算单元以及巨大容量的存储设备，需要运行各种通用和专用软件。其中，车载操作系统无疑是重中之重。国内外车企、集成供应商、互联网巨头纷纷入场，带来多种车载操作系统并存的局面。如表11-3所示，黑莓的QNX、风河的VxWorks以及基于开源Linux设计的车载操作系统是其中典型代表。


    表11-3　主流车联网操作系统对比


    ![](images/txt015_3.jpg "pagenumber_ebook=171,pagenumber_book=160")


    续表


    ![](images/txt015_4.jpg "pagenumber_ebook=172,pagenumber_book=161")


    QNX是第一个通过ISO26262 ASIL-D安全认证的实时操作系统。与Linux的免费不同，QNX需要商业收费。由于优于业内其他系统的安全性、稳定性和实时性，其仍是车载操作系统市场占有率的第一位。


    Vx Works由400多个相对独立、短小精悍的目标模块组成，用户可获取所有源代码并根据需要对OS内核在源代码层面进行裁剪和配置，并已通过ASIL-D级安全认证，优异的实时性和安全性是其立身之本。


    Linux是宏内核，除了最基本的进程、线程管理、内存管理外，文件系统、驱动、网络协议等都在内核里面，运行效率高。与QNX和VxWorks相比，Linux更大的优势在于开源和免费，且在各种CPU架构上都可以运行，可适配更多的应用场景，具有很强的定制开发灵活度。


    4.卫星操作系统


    卫星的功能越来越复杂，对完成星务管理、姿态和载荷控制的星载计算机硬件和软件设计提出更高要求。通过操作系统实现任务管理调度、任务间通信、内存管理等系统功能，以API（应用程序接口）方式提供给用户，使软件设计人员将主要精力放在应用程序开发上，有助于星载软件通用化和模块化设计，缩短软件产品的研制周期，提高软件产品的可靠性。表11-4为几种典型星载操作系统对比。


    表11-4　几种典型星载操作系统对比


    ![](images/txt015_5.jpg "pagenumber_ebook=172,pagenumber_book=161")


    续表


    ![](images/txt015_6.jpg "pagenumber_ebook=173,pagenumber_book=162")


    VxWorks源码需要收取一定的授权费用，是一款成熟的高实时商用操作系统，开发工具丰富，用户可对源码进行裁剪和定制开发，具有极高的安全性和稳定性，在卫星控制系统、导弹、国际空间站等重大航天项目中有多次成功应用经历。


    Linux是一种免费使用和自由传播的类UNIX操作系统。由于良好的可移植性、免费开源、用户可定制、高可靠性和系统安全性的特点，使得其在航天领域得到广泛应用。例如，2021年美国发射的火星车采用了Linux操作系统。


    RTEMS是一个为嵌入式系统设计的开源实时操作系统，代码质量和可靠性都很高。最早用于美国国防系统，现在由OAR公司负责版本的升级与维护。无论是航空航天、军工，还是民用领域，RTEMS都有着极为广泛的应用。


    μC/OS-Ⅱ是一种基于优先级的抢占式多任务实时操作系统。它可以使各个任务独立工作，互不干涉，很容易实现准时而且无误执行，使实时应用程序的设计和扩展变得容易，使应用程序的设计过程大为简化。其已通过了美国国家航空航天局的认证，可用于飞行器、太空站等关键系统的开发。


    eCos是一种嵌入式可配置实时操作系统，开放源代码软件，无任何版权费用，具有很强的可配置能力，代码量很小，通常为几十到几百千字节，可以支持很大范围内许多不同的处理器和平台，主要应用对象包括车载设备、手持设备以及其他一些低成本和便携式应用，在国内星载计算机上已有初步应用。


    综上分析，卫星操作系统能够广泛应用需具有如下特征：高稳定性与实时性、可移植性、开源并可裁剪、丰富的开发工具、代码可固化、弱交互性以及统一的接口。与此同时，传统卫星操作系统以单星应用为主，主要用于单颗卫星的星务管理、数据处理、姿态以及载荷控制等，是卫星长期稳定运行的基础，其发展以单星单CPU应用为主线。


    5.发展启示


    通过上述不同应用场景操作系统的特点、发展历程以及分布进行对比分析，总结如下：


    ①精准匹配应用需求是操作系统发展的典型路线；新场景的出现和发展都会衍生出全新的操作系统；开发者对新场景的新认知牵引着操作系统的演化。


    ②操作系统作为复杂系统的信息基座，是满足复杂场景应用需求的必然选择。


    ③操作系统成功的关键在于形成良好产业生态，需要业内人士共同努力，才能达到事半功倍的效果。


    ④一款操作系统只有对应一类特定的硬件架构，才能实现性价比最优，形成互利共惠的软硬件生态。例如，个人计算机时代的Windows操作系统对应的80×86架构和移动互联网时代的Android操作系统对应的ARM架构。


    ⑤微内核架构由于其安全性、容错性、可移植性等独特优势，成为谷歌、华为等行业头部企业下一代万物智联操作系统的内核架构，微内核架构已成为操作系统发展主流。


    ⑥操作系统作为大型基础软件，需要付出大量的人力、物力和财力，开发失败率极高，最后能够开发成功的都是所属大国的行业头部企业，是国家意志的产物。


    11.1.3　巨星座操作系统发展思路


    基于上述分析，为开发满足支撑我国巨星座高效管理及智能应用需求的巨星座操作系统，需要从架构定义、硬件载体、内核设计、安全可信以及生态建设等方面开展研究。


    1.架构定义


    操作系统架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。研制巨星座操作系统，必须首先研究面向万颗规模巨星座节点海量硬件资源管理以及巨量智能应用快速部署需求的架构定义，实现巨星座资源网格化抽象和管理，支撑实现面向千颗规模巨星座场景的“即时聚优”和“多域联合”等应用功能。


    以巨星座操作系统统筹管控巨星座系统资源，支持任务应用为主线，构建开放架构，开发应用框架，推动各层间采用标准接口，便于节点互联互通和互操作，便于硬件、软件的移植和重用，便于新技术产品应用转化实现增强与扩充。以此为基础，细化研究协议架构和安全架构，实现巨星座操作系统的体系架构设计。


    面向巨星座应用场景和功能持续演化需求，采用层次化设计思想，精细定义巨星座操作系统每层的功能结构，选用“微内核+系统服务+应用框架+行为管控”架构。微内核主要完成线程/进程间通信、内存地址空间、中断等系统基础管理功能。系统服务（外核）主要完成路由控制、移动性管理、虚拟协同计算以及APP动态加载等功能。应用框架是便于操作系统服务通信、导航、遥感等多类型空间任务设定的，采用模块化、定制化设计，具备规模可伸缩、功能可裁剪等特点。行为管控是基于博伊德OO-DA（观察-分析-决策-行动）循环行为认知模型设计，用于实现巨星座群体自主智能。


    2.硬件载体


    星载计算机是巨星座功能实现的硬件基础。CPU是星载计算机的中枢以及星载操作系统的运行载体，直接决定操作系统的应用能力。CPU的选取主要从性能、功耗、对太空环境的适应能力、对外通信接口以及操作系统的支持情况等方面考虑。星载处理器主要分为80×86、MIL-STD-1750A、PowerPC、SPARC、MIPS、ARM等架构系列处理器。


    80×86处理器由于高安全和稳定性，在航天领域应用非常广泛。MIL-STD-1750A采用十六位非精简指令集架构，我国风云系列卫星的星载计算机采用基于该架构的处理器。PowerPC处理器具有高性能、低功耗特点，NASA采用的处理器架构多为PowerPC。SPARC采用的是精简指令集架构，该系列处理器具有高质量等级、运算能力高、功耗适中等特点，我国已有BM3803、BM3823、S698等SPARC架构具备抗辐照能力的CPU实现量产。MIPS是一种采取精简指令集的处理器架构，中科院研发的国产芯片———“龙芯”采用MIPS架构和指令集，有部分高质量等级芯片在我国卫星中应用。ARM处理器外围接口丰富，可扩展性强，尤其是搭载操作系统后，在星务管理、数据处理等方面性能强大，星载计算机采用ARM处理器搭载操作系统的技术路线已成为国内外的研究热点。


    星载计算机作为星载操作系统的硬件载体，受限于空间环境的特殊性和空间电子技术的发展水平，性能相比地面计算机相差几代，成为制约星载操作系统发展的关键因素，要求设计星载操作系统时，在轻量化、运行效率、可靠性、稳定性等方面重点考虑。操作系统性能是否达到最优与需要适配的CPU架构紧密相关。因此，需要根据国内星载CPU的发展状况，合理选择满足未来应用场景的CPU架构，并构建互惠共利的软硬件生态。


    3.内核设计


    巨星座操作系统内核负责星上资源与任务的抽象管理。巨星座应用场景对操作系统内核提出了3方面的挑战：一是巨星座单星节点的硬件资源强受限且异构，要求操作系统内核具有轻量化和异构资源灵活管控的能力；二是巨星座中高效的多星任务协同，要求操作系统内核具有低时延能力，从而充分发挥硬件能力，降低软件开销；三是太空环境中的干扰会造成软件系统运行时发生错误的概率更高，要求操作系统内核提供高效的容错机制，从而以低成本开销增强系统的容错能力。


    与地面设备不同，卫星运行在空间辐照环境中，易受宇宙射线辐射的影响。作为巨星座的核心基础设施，操作系统在应对单粒子翻转等问题时的稳定性和可靠性异常重要。在宏内核中，任何程序都有权访问所有内存和内核数据，导致程序中任何一个错误都有可能使整个系统崩溃。在微内核中，各模块间良好的独立性和隔离性可以保障操作系统即使在受到辐射而发生错误时依然能稳定工作。此外，微内核结构操作系统的模块化、可裁剪的特性，满足天基信息系统硬件资源受限需求。


    针对巨星座应用场景星上硬件资源强受限且异构、多星任务即时协同以及空间辐照环境下高效容错等核心需求，采用微内核架构，研究内核轻量化、低时延及强容错等关键技术，突破异构墙、时延墙以及容错墙等瓶颈问题，设计完全自主可控、高效灵活管控星载海量异构资源的安全实时内核，从而充分发挥星载硬件能力，降低软件开销，以低代价增强系统容错能力和提升运行效能。


    4.安全可信


    巨星座操作系统安全可信是巨星座稳定运行的基础。通过研究“云-边-端”分布式协同架构、多维资源管理、系统链路安全、空间数据防护、接入认证等关键技术，建立基于可信计算的双体系结构分布式安全可信机制，以此为基础，构建保障巨星座操作系统可靠运行的安全可信环境，形成自主创新的主动免疫三重防护框架，最终设计完成巨星座操作系统安全组件，保障巨星座操作系统的安全可信能力。


    在确保时效性的前提下，基于操作系统、一体化融合网络、计算平台控制平面、高可靠共享数据存储、集成化软件加载控制器，建立支持巨星座操作系统在轨部署和升级、星载应用软件实时更新以及动态加载的体系架构，用以保障应用软件安全稳定运行以及功能更新。


    巨星座操作系统作为巨星座系统的安全基座，基于“云-边-端”分布式安全可信机制，构建“芯片-链路-数据-应用”全链路安全可信体系，保障巨星座系统的可信与安全。


    5.生态建设


    巨星座操作系统作为面向巨星座复杂应用场景的统一基础软件平台，将促成航天软件开发由专用、闭源、定制逐渐向标准、开源、通用转变。随着航天软件系统复杂性不断增长、软件开放程度日渐增大、用户和开发者群体规模逐渐增加，上述群体关联关系更丰富、共生于一个相互影响的生态环境，最终形成开放、开源、自主可控的航天软件生态体系。


    围绕生态模式、社区规划、运行机制、管理机制等航天软件生态体系建设需求，构建研发资源数据库以及数据采集与分析工具。在此基础上，通过定义多维度评价指标，设计实现用户画像和项目画像系统，为基于巨星座操作系统的软件资源汇聚与共享提供有效支撑。


    11.1.4　关键技术及解决思路


    针对巨星座复杂应用场景，构建巨星座信息基座———巨星座操作系统，对巨星座操作系统研制时涉及的体系架构、内核、融合组网、安全可信、生态体系等关键技术进行梳理分析，并提供初步的解决思路。


    1.体系架构关键技术


    架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。'
  fmt: '

    # 巨星座操作系统研究


    未来巨星座的运用将以“多功能可重构”为核心，由传统的“单星单功能的节点加入”改变为“多星协同和云服务的隐节点”，由“天地多次传输处理的长链路”改变为“信息层内优化处理的短链路”，由“新技术和装备研制的划代更新”转变为“新技术和装备功能的通用更新”，支持巨星座的网络化、云化、智能化以及用户无感的高效运行，促进巨星座体系效能的整体性跃升。传统“一星一用”和定制化开发的天基资源运用模式，已经难以满足当前“一星多用、多星组网、多网协同、数据集成服务”的体系化应用需求，需要开发满足支撑巨星座多功能可重构需求的星云操作系统。


    ## 2. 巨星座协同一体需求


    面对未来高动态、多功能、可重构的任务需求，巨星座需具备高度自适应和抗损毁能力的天地体系协同组网和信息联通能力，将各卫星的星内传感器、处理器作为网络共享资源节点，可自主调动协同网络中的定位资源、侦查资源和传输资源等，各个网络资源按需接入，综合支持任务应用。与此同时，还需具备多节点、多链路的损毁容忍能力，能够保障复杂任务条件下的网络协同。当前天基资源管控和运用主要依赖地面系统，采用全静态管理模式，完全依赖地面指令上注，自主能力有限，不具备资源协同运用条件，维护工作量巨大。未来万颗规模巨星座系统，靠这种“一星一管”、基本依赖地面人工的管控方法，运行效率将极低或无法正常运行，难以满足高效“用天”的需求，需要开发满足支撑巨星座协同一体需求的巨星座操作系统。


    ## 3. 巨星座软件定义需求


    发展软件定义卫星技术，将有效提高航天器产品的软件密集度和功能灵活度，而且可以极大地缩短研发周期，降低研发成本和风险。巨星座系统通过需求可定义、硬件可重组、软件可重配、功能可重构以及APP（应用软件）动态加载等软件定义技术，按需重构完成不同任务，其重要性主要体现在以下4个方面：一是实现巨星座功能和性能的高效持续演进；二是实现高技术在巨星座中快速转化应用；三是实现卫星产品标准化，为卫星批量制造奠定技术基础；四是构建航天软件生态体系，助力软件成果共享和持续发展。当前卫星研制模式基本属于“一案一例”功能定制的开发形式，以程序化模式为特征，不能适应情报智能生成与信息即时支援需求，需要开发满足支撑巨星座软件定义需求的巨星座操作系统。


    ## 4. 巨星座全链路安全可信需求


    空间安全是国家安全的基石，关乎国家整体安全。巨星座系统具有开放的通信链路、高动态变化的拓扑结构、复杂应用以及海量数据信息共享的特性，较单星系统更容易受到异常注入、仿冒篡改、漏洞扫描等网电攻击和干扰，要保障巨星座系统稳定运行，必须解决巨星座全链路的可信与安全问题。巨星座系统的组网方式决定了卫星节点在空间呈分布式特点，单个节点的硬件资源有限，在高效管控自身计算、存储和网络等资源的同时，节点间还需相互协作、安全、高效、可靠地完成指定任务。在确保时效性的前提下，构建“芯片-链路-数据-应用”的全链路安全可信体系，保障巨星座网络的路由、切换、传输、接入等方面的安全可信。当前，基于单星应用模式的空间安全机制不能满足未来巨星座系统基于“云-边-端”分布式协同架构的安全可信需求，需要开发满足支撑巨星座全链路安全可信的巨星座操作系统。


    ## 11.1.2 现有操作系统特点分析


    为快速高效开发面向巨星座应用场景的操作系统，应借鉴现有操作系统的发展经验。现有操作系统包含桌面、物联网、车联网以及卫星等典型应用场景操作系统。通过分析现有操作系统发展历程，总结其发展规律，为面向巨星座复杂应用场景的巨星座操作系统研制提供借鉴。


    ### 1. 桌面操作系统


    桌面操作系统是在计算机上借助硬件运行并完成相关应用的基础软件，是当今应用最广泛和最成功的操作系统，几乎渗透所有人的生活、工作等各个场合。


    在桌面操作系统诞生之前，最有名的操作系统是磁盘操作系统（Disk Operating System，DOS），但DOS的操作界面十分不友好，仅仅是字符界面而已，为此微软公司推出了第一个图形界面操作系统Windows1.0。如表11-1所示，经过多年的发展，桌面操作系统主要有Windows、Mac
    OS（Operating System）、Linux（全称GNU/Linux，是一种免费使用和自由传播的操作系统）3种。


    表11-1　主要桌面操作系统对比


    ![](images/txt015_1.jpg "pagenumber_ebook=169,pagenumber_book=158")


    三大桌面操作系统都经历了复杂的演变，各有特点，自成体系，在PC和服务器等领域各自拥有相对独立的用户群体。Windows系列用户群体大，市场占有率超过90%，软件生态完整性好；Mac
    OS适合于专业人员；Linux是全球最大的一个自由免费软件。


    ### 2. 物联网操作系统


    继计算机和互联网之后，物联网掀起了信息产业发展的第三次高潮。物联网由海量异构设备组成，部署环境十分复杂。物联网操作系统作为连接物联网应用与物理设备的基础，可以屏蔽物联网的碎片化特征，为应用程序提供统一的编程接口，从而降低开发时间和成本，便于实现整个物联网统一管理。


    随着物联网的兴起，作为实现人与物、物与物互联的基础软件，吸引包括谷歌、华为等各大公司投入大量人力、物力研发。如表11-2所示，比较典型的有谷歌公司下一代替代Android（美国谷歌公司开发的移动操作系统）操作系统的Fuchsia
    OS以及嵌入式智能操作系统Kata OS、华为的Harmony OS等。


    表11-2　主流物联网操作系统对比


    ![](images/txt015_2.jpg "pagenumber_ebook=170,pagenumber_book=159")


    Fuchsia OS是一款面向多平台的物联网操作系统，运行载体不仅是智能手机，还有平板电脑、笔记本电脑甚至是可穿戴设备，预计2023年发布正式版。


    Kata OS是谷歌研发的开源嵌入式操作系统，设计充分考虑安全问题，建立在数学上被证明具有保密性、完整性和可用性的seL4微内核基础上，2022年10月已发布第一版。


    Harmony OS是华为公司开发的一款基于微内核、面向5 G物联网、面向全场景的物联网操作系统，能够支持手机、平板、智能穿戴、智慧屏、耳机等多种终端设备，2022年7月已发布Harmony
    3.0版本。


    ### 3. 车联网操作系统


    随着移动互联网和工业智能化的快速发展，汽车产业不断向智能化和网联化快速转变，形成以智能网联汽车为中心的车联网。智能网联汽车通过搭载先进的车载传感器与智能控制系统，并与现代移动通信技术相结合，实现了车与人、车与车、车与路、车与云服务平台之间的信息交换与共享，在为人们交通出行带来便利的同时，有助于政府建立智能化的交通体系。


    车联网操作系统作为智能网联汽车的核心功能底座，是实现软件定义汽车的关键。未来的智能汽车是信息域和能源域的天然结合点，作为计算中心，包含有高速的传输网络、强大的计算单元以及巨大容量的存储设备，需要运行各种通用和专用软件。其中，车载操作系统无疑是重中之重。国内外车企、集成供应商、互联网巨头纷纷入场，带来多种车载操作系统并存的局面。如表11-3所示，黑莓的QNX、风河的VxWorks以及基于开源Linux设计的车载操作系统是其中典型代表。


    表11-3　主流车联网操作系统对比


    ![](images/txt015_3.jpg "pagenumber_ebook=171,pagenumber_book=160")


    续表


    ![](images/txt015_4.jpg "pagenumber_ebook=172,pagenumber_book=161")


    QNX是第一个通过ISO26262 ASIL-D安全认证的实时操作系统。与Linux的免费不同，QNX需要商业收费。由于优于业内其他系统的安全性、稳定性和实时性，其仍是车载操作系统市场占有率的第一位。


    Vx Works由400多个相对独立、短小精悍的目标模块组成，用户可获取所有源代码并根据需要对OS内核在源代码层面进行裁剪和配置，并已通过ASIL-D级安全认证，优异的实时性和安全性是其立身之本。


    Linux是宏内核，除了最基本的进程、线程管理、内存管理外，文件系统、驱动、网络协议等都在内核里面，运行效率高。与QNX和VxWorks相比，Linux更大的优势在于开源和免费，且在各种CPU架构上都可以运行，可适配更多的应用场景，具有很强的定制开发灵活度。


    ### 4. 卫星操作系统


    卫星的功能越来越复杂，对完成星务管理、姿态和载荷控制的星载计算机硬件和软件设计提出更高要求。通过操作系统实现任务管理调度、任务间通信、内存管理等系统功能，以API（应用程序接口）方式提供给用户，使软件设计人员将主要精力放在应用程序开发上，有助于星载软件通用化和模块化设计，缩短软件产品的研制周期，提高软件产品的可靠性。表11-4为几种典型星载操作系统对比。


    表11-4　几种典型星载操作系统对比


    ![](images/txt015_5.jpg "pagenumber_ebook=172,pagenumber_book=161")


    续表


    ![](images/txt015_6.jpg "pagenumber_ebook=173,pagenumber_book=162")


    VxWorks源码需要收取一定的授权费用，是一款成熟的高实时商用操作系统，开发工具丰富，用户可对源码进行裁剪和定制开发，具有极高的安全性和稳定性，在卫星控制系统、导弹、国际空间站等重大航天项目中有多次成功应用经历。


    Linux是一种免费使用和自由传播的类UNIX操作系统。由于良好的可移植性、免费开源、用户可定制、高可靠性和系统安全性的特点，使得其在航天领域得到广泛应用。例如，2021年美国发射的火星车采用了Linux操作系统。


    RTEMS是一个为嵌入式系统设计的开源实时操作系统，代码质量和可靠性都很高。最早用于美国国防系统，现在由OAR公司负责版本的升级与维护。无论是航空航天、军工，还是民用领域，RTEMS都有着极为广泛的应用。


    μC/OS-Ⅱ是一种基于优先级的抢占式多任务实时操作系统。它可以使各个任务独立工作，互不干涉，很容易实现准时而且无误执行，使实时应用程序的设计和扩展变得容易，使应用程序的设计过程大为简化。其已通过了美国国家航空航天局的认证，可用于飞行器、太空站等关键系统的开发。


    eCos是一种嵌入式可配置实时操作系统，开放源代码软件，无任何版权费用，具有很强的可配置能力，代码量很小，通常为几十到几百千字节，可以支持很大范围内许多不同的处理器和平台，主要应用对象包括车载设备、手持设备以及其他一些低成本和便携式应用，在国内星载计算机上已有初步应用。


    综上分析，卫星操作系统能够广泛应用需具有如下特征：高稳定性与实时性、可移植性、开源并可裁剪、丰富的开发工具、代码可固化、弱交互性以及统一的接口。与此同时，传统卫星操作系统以单星应用为主，主要用于单颗卫星的星务管理、数据处理、姿态以及载荷控制等，是卫星长期稳定运行的基础，其发展以单星单CPU应用为主线。


    ### 5. 发展启示


    通过上述不同应用场景操作系统的特点、发展历程以及分布进行对比分析，总结如下：


    ①精准匹配应用需求是操作系统发展的典型路线；新场景的出现和发展都会衍生出全新的操作系统；开发者对新场景的新认知牵引着操作系统的演化。


    ②操作系统作为复杂系统的信息基座，是满足复杂场景应用需求的必然选择。


    ③操作系统成功的关键在于形成良好产业生态，需要业内人士共同努力，才能达到事半功倍的效果。


    ④一款操作系统只有对应一类特定的硬件架构，才能实现性价比最优，形成互利共惠的软硬件生态。例如，个人计算机时代的Windows操作系统对应的80×86架构和移动互联网时代的Android操作系统对应的ARM架构。


    ⑤微内核架构由于其安全性、容错性、可移植性等独特优势，成为谷歌、华为等行业头部企业下一代万物智联操作系统的内核架构，微内核架构已成为操作系统发展主流。


    ⑥操作系统作为大型基础软件，需要付出大量的人力、物力和财力，开发失败率极高，最后能够开发成功的都是所属大国的行业头部企业，是国家意志的产物。


    ## 11.1.3 巨星座操作系统发展思路


    基于上述分析，为开发满足支撑我国巨星座高效管理及智能应用需求的巨星座操作系统，需要从架构定义、硬件载体、内核设计、安全可信以及生态建设等方面开展研究。


    ### 1. 架构定义


    操作系统架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。研制巨星座操作系统，必须首先研究面向万颗规模巨星座节点海量硬件资源管理以及巨量智能应用快速部署需求的架构定义，实现巨星座资源网格化抽象和管理，支撑实现面向千颗规模巨星座场景的“即时聚优”和“多域联合”等应用功能。


    以巨星座操作系统统筹管控巨星座系统资源，支持任务应用为主线，构建开放架构，开发应用框架，推动各层间采用标准接口，便于节点互联互通和互操作，便于硬件、软件的移植和重用，便于新技术产品应用转化实现增强与扩充。以此为基础，细化研究协议架构和安全架构，实现巨星座操作系统的体系架构设计。


    面向巨星座应用场景和功能持续演化需求，采用层次化设计思想，精细定义巨星座操作系统每层的功能结构，选用“微内核+系统服务+应用框架+行为管控”架构。微内核主要完成线程/进程间通信、内存地址空间、中断等系统基础管理功能。系统服务（外核）主要完成路由控制、移动性管理、虚拟协同计算以及APP动态加载等功能。应用框架是便于操作系统服务通信、导航、遥感等多类型空间任务设定的，采用模块化、定制化设计，具备规模可伸缩、功能可裁剪等特点。行为管控是基于博伊德OO-DA（观察-分析-决策-行动）循环行为认知模型设计，用于实现巨星座群体自主智能。


    ### 2. 硬件载体


    星载计算机是巨星座功能实现的硬件基础。CPU是星载计算机的中枢以及星载操作系统的运行载体，直接决定操作系统的应用能力。CPU的选取主要从性能、功耗、对太空环境的适应能力、对外通信接口以及操作系统的支持情况等方面考虑。星载处理器主要分为80×86、MIL-STD-1750A、PowerPC、SPARC、MIPS、ARM等架构系列处理器。


    80×86处理器由于高安全和稳定性，在航天领域应用非常广泛。MIL-STD-1750A采用十六位非精简指令集架构，我国风云系列卫星的星载计算机采用基于该架构的处理器。PowerPC处理器具有高性能、低功耗特点，NASA采用的处理器架构多为PowerPC。SPARC采用的是精简指令集架构，该系列处理器具有高质量等级、运算能力高、功耗适中等特点，我国已有BM3803、BM3823、S698等SPARC架构具备抗辐照能力的CPU实现量产。MIPS是一种采取精简指令集的处理器架构，中科院研发的国产芯片———“龙芯”采用MIPS架构和指令集，有部分高质量等级芯片在我国卫星中应用。ARM处理器外围接口丰富，可扩展性强，尤其是搭载操作系统后，在星务管理、数据处理等方面性能强大，星载计算机采用ARM处理器搭载操作系统的技术路线已成为国内外的研究热点。


    星载计算机作为星载操作系统的硬件载体，受限于空间环境的特殊性和空间电子技术的发展水平，性能相比地面计算机相差几代，成为制约星载操作系统发展的关键因素，要求设计星载操作系统时，在轻量化、运行效率、可靠性、稳定性等方面重点考虑。操作系统性能是否达到最优与需要适配的CPU架构紧密相关。因此，需要根据国内星载CPU的发展状况，合理选择满足未来应用场景的CPU架构，并构建互惠共利的软硬件生态。


    ### 3. 内核设计


    巨星座操作系统内核负责星上资源与任务的抽象管理。巨星座应用场景对操作系统内核提出了3方面的挑战：一是巨星座单星节点的硬件资源强受限且异构，要求操作系统内核具有轻量化和异构资源灵活管控的能力；二是巨星座中高效的多星任务协同，要求操作系统内核具有低时延能力，从而充分发挥硬件能力，降低软件开销；三是太空环境中的干扰会造成软件系统运行时发生错误的概率更高，要求操作系统内核提供高效的容错机制，从而以低成本开销增强系统的容错能力。


    与地面设备不同，卫星运行在空间辐照环境中，易受宇宙射线辐射的影响。作为巨星座的核心基础设施，操作系统在应对单粒子翻转等问题时的稳定性和可靠性异常重要。在宏内核中，任何程序都有权访问所有内存和内核数据，导致程序中任何一个错误都有可能使整个系统崩溃。在微内核中，各模块间良好的独立性和隔离性可以保障操作系统即使在受到辐射而发生错误时依然能稳定工作。此外，微内核结构操作系统的模块化、可裁剪的特性，满足天基信息系统硬件资源受限需求。


    针对巨星座应用场景星上硬件资源强受限且异构、多星任务即时协同以及空间辐照环境下高效容错等核心需求，采用微内核架构，研究内核轻量化、低时延及强容错等关键技术，突破异构墙、时延墙以及容错墙等瓶颈问题，设计完全自主可控、高效灵活管控星载海量异构资源的安全实时内核，从而充分发挥星载硬件能力，降低软件开销，以低代价增强系统容错能力和提升运行效能。


    ### 4. 安全可信


    巨星座操作系统安全可信是巨星座稳定运行的基础。通过研究“云-边-端”分布式协同架构、多维资源管理、系统链路安全、空间数据防护、接入认证等关键技术，建立基于可信计算的双体系结构分布式安全可信机制，以此为基础，构建保障巨星座操作系统可靠运行的安全可信环境，形成自主创新的主动免疫三重防护框架，最终设计完成巨星座操作系统安全组件，保障巨星座操作系统的安全可信能力。


    在确保时效性的前提下，基于操作系统、一体化融合网络、计算平台控制平面、高可靠共享数据存储、集成化软件加载控制器，建立支持巨星座操作系统在轨部署和升级、星载应用软件实时更新以及动态加载的体系架构，用以保障应用软件安全稳定运行以及功能更新。


    巨星座操作系统作为巨星座系统的安全基座，基于“云-边-端”分布式安全可信机制，构建“芯片-链路-数据-应用”全链路安全可信体系，保障巨星座系统的可信与安全。


    ### 5. 生态建设


    巨星座操作系统作为面向巨星座复杂应用场景的统一基础软件平台，将促成航天软件开发由专用、闭源、定制逐渐向标准、开源、通用转变。随着航天软件系统复杂性不断增长、软件开放程度日渐增大、用户和开发者群体规模逐渐增加，上述群体关联关系更丰富、共生于一个相互影响的生态环境，最终形成开放、开源、自主可控的航天软件生态体系。


    围绕生态模式、社区规划、运行机制、管理机制等航天软件生态体系建设需求，构建研发资源数据库以及数据采集与分析工具。在此基础上，通过定义多维度评价指标，设计实现用户画像和项目画像系统，为基于巨星座操作系统的软件资源汇聚与共享提供有效支撑。


    ## 11.1.4 关键技术及解决思路


    针对巨星座复杂应用场景，构建巨星座信息基座———巨星座操作系统，对巨星座操作系统研制时涉及的体系架构、内核、融合组网、安全可信、生态体系等关键技术进行梳理分析，并提供初步的解决思路。


    ### 1. 体系架构关键技术


    架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。

    '
  trans: '


    # 巨星座操作系统研究


    未来巨星座的运用将以“多功能可重构”为核心，由传统的“单星单功能的节点加入”改变为“多星协同和云服务的隐节点”，由“天地多次传输处理的长链路”改变为“信息层内优化处理的短链路”，由“新技术和装备研制的划代更新”转变为“新技术和装备功能的通用更新”，支持巨星座的网络化、云化、智能化以及用户无感的高效运行，促进巨星座体系效能的整体性跃升。传统“一星一用”和定制化开发的天基资源运用模式，已经难以满足当前“一星多用、多星组网、多网协同、数据集成服务”的体系化应用需求，需要开发满足支撑巨星座多功能可重构需求的星云操作系统。


    ## 2. 巨星座协同一体需求


    面对未来高动态、多功能、可重构的任务需求，巨星座需具备高度自适应和抗损毁能力的天地体系协同组网和信息联通能力，将各卫星的星内传感器、处理器作为网络共享资源节点，可自主调动协同网络中的定位资源、侦查资源和传输资源等，各个网络资源按需接入，综合支持任务应用。与此同时，还需具备多节点、多链路的损毁容忍能力，能够保障复杂任务条件下的网络协同。当前天基资源管控和运用主要依赖地面系统，采用全静态管理模式，完全依赖地面指令上注，自主能力有限，不具备资源协同运用条件，维护工作量巨大。未来万颗规模巨星座系统，靠这种“一星一管”、基本依赖地面人工的管控方法，运行效率将极低或无法正常运行，难以满足高效“用天”的需求，需要开发满足支撑巨星座协同一体需求的巨星座操作系统。


    ## 3. 巨星座软件定义需求


    发展软件定义卫星技术，将有效提高航天器产品的软件密集度和功能灵活度，而且可以极大地缩短研发周期，降低研发成本和风险。巨星座系统通过需求可定义、硬件可重组、软件可重配、功能可重构以及
    APP（应用软件）动态加载等软件定义技术，按需重构完成不同任务，其重要性主要体现在以下 4 个方面：一是实现巨星座功能和性能的高效持续演进；二是实现高技术在巨星座中快速转化应用；三是实现卫星产品标准化，为卫星批量制造奠定技术基础；四是构建航天软件生态体系，助力软件成果共享和持续发展。当前卫星研制模式基本属于“一案一例”功能定制的开发形式，以程序化模式为特征，不能适应情报智能生成与信息即时支援需求，需要开发满足支撑巨星座软件定义需求的巨星座操作系统。


    ## 4. 巨星座全链路安全可信需求


    空间安全是国家安全的基石，关乎国家整体安全。巨星座系统具有开放的通信链路、高动态变化的拓扑结构、复杂应用以及海量数据信息共享的特性，较单星系统更容易受到异常注入、仿冒篡改、漏洞扫描等网电攻击和干扰，要保障巨星座系统稳定运行，必须解决巨星座全链路的可信与安全问题。巨星座系统的组网方式决定了卫星节点在空间呈分布式特点，单个节点的硬件资源有限，在高效管控自身计算、存储和网络等资源的同时，节点间还需相互协作、安全、高效、可靠地完成指定任务。在确保时效性的前提下，构建“芯片-链路-数据-应用”的全链路安全可信体系，保障巨星座网络的路由、切换、传输、接入等方面的安全可信。当前，基于单星应用模式的空间安全机制不能满足未来巨星座系统基于“云-边-端”分布式协同架构的安全可信需求，需要开发满足支撑巨星座全链路安全可信的巨星座操作系统。


    ## 11.1.2 现有操作系统特点分析


    为快速高效开发面向巨星座应用场景的操作系统，应借鉴现有操作系统的发展经验。现有操作系统包含桌面、物联网、车联网以及卫星等典型应用场景操作系统。通过分析现有操作系统发展历程，总结其发展规律，为面向巨星座复杂应用场景的巨星座操作系统研制提供借鉴。


    ### 1. 桌面操作系统


    桌面操作系统是在计算机上借助硬件运行并完成相关应用的基础软件，是当今应用最广泛和最成功的操作系统，几乎渗透所有人的生活、工作等各个场合。


    在桌面操作系统诞生之前，最有名的操作系统是磁盘操作系统（Disk Operating System，DOS），但 DOS 的操作界面十分不友好，仅仅是字符界面而已，为此微软公司推出了第一个图形界面操作系统
    Windows1.0。如表 11-1 所示，经过多年的发展，桌面操作系统主要有 Windows、Mac OS（Operating System）、Linux（全称
    GNU/Linux，是一种免费使用和自由传播的操作系统）3 种。


    表 11-1　主要桌面操作系统对比


    ![](img/txt015_1.jpg "pagenumber_ebook=169,pagenumber_book=158")


    三大桌面操作系统都经历了复杂的演变，各有特点，自成体系，在 PC 和服务器等领域各自拥有相对独立的用户群体。Windows 系列用户群体大，市场占有率超过
    90%，软件生态完整性好；Mac OS 适合于专业人员；Linux 是全球最大的一个自由免费软件。


    ### 2. 物联网操作系统


    继计算机和互联网之后，物联网掀起了信息产业发展的第三次高潮。物联网由海量异构设备组成，部署环境十分复杂。物联网操作系统作为连接物联网应用与物理设备的基础，可以屏蔽物联网的碎片化特征，为应用程序提供统一的编程接口，从而降低开发时间和成本，便于实现整个物联网统一管理。


    随着物联网的兴起，作为实现人与物、物与物互联的基础软件，吸引包括谷歌、华为等各大公司投入大量人力、物力研发。如表 11-2 所示，比较典型的有谷歌公司下一代替代
    Android（美国谷歌公司开发的移动操作系统）操作系统的 Fuchsia OS 以及嵌入式智能操作系统 Kata OS、华为的 Harmony OS 等。


    表 11-2　主流物联网操作系统对比


    ![](img/txt015_2.jpg "pagenumber_ebook=170,pagenumber_book=159")


    Fuchsia OS 是一款面向多平台的物联网操作系统，运行载体不仅是智能手机，还有平板电脑、笔记本电脑甚至是可穿戴设备，预计 2023 年发布正式版。


    Kata OS 是谷歌研发的开源嵌入式操作系统，设计充分考虑安全问题，建立在数学上被证明具有保密性、完整性和可用性的 seL4 微内核基础上，2022 年
    10 月已发布第一版。


    Harmony OS 是华为公司开发的一款基于微内核、面向 5 G 物联网、面向全场景的物联网操作系统，能够支持手机、平板、智能穿戴、智慧屏、耳机等多种终端设备，2022
    年 7 月已发布 Harmony 3.0 版本。


    ### 3. 车联网操作系统


    随着移动互联网和工业智能化的快速发展，汽车产业不断向智能化和网联化快速转变，形成以智能网联汽车为中心的车联网。智能网联汽车通过搭载先进的车载传感器与智能控制系统，并与现代移动通信技术相结合，实现了车与人、车与车、车与路、车与云服务平台之间的信息交换与共享，在为人们交通出行带来便利的同时，有助于政府建立智能化的交通体系。


    车联网操作系统作为智能网联汽车的核心功能底座，是实现软件定义汽车的关键。未来的智能汽车是信息域和能源域的天然结合点，作为计算中心，包含有高速的传输网络、强大的计算单元以及巨大容量的存储设备，需要运行各种通用和专用软件。其中，车载操作系统无疑是重中之重。国内外车企、集成供应商、互联网巨头纷纷入场，带来多种车载操作系统并存的局面。如表
    11-3 所示，黑莓的 QNX、风河的 VxWorks 以及基于开源 Linux 设计的车载操作系统是其中典型代表。


    表 11-3　主流车联网操作系统对比


    ![](img/txt015_3.jpg "pagenumber_ebook=171,pagenumber_book=160")


    续表


    ![](img/txt015_4.jpg "pagenumber_ebook=172,pagenumber_book=161")


    QNX 是第一个通过 ISO26262 ASIL-D 安全认证的实时操作系统。与 Linux 的免费不同，QNX 需要商业收费。由于优于业内其他系统的安全性、稳定性和实时性，其仍是车载操作系统市场占有率的第一位。


    Vx Works 由 400 多个相对独立、短小精悍的目标模块组成，用户可获取所有源代码并根据需要对 OS 内核在源代码层面进行裁剪和配置，并已通过 ASIL-D
    级安全认证，优异的实时性和安全性是其立身之本。


    Linux 是宏内核，除了最基本的进程、线程管理、内存管理外，文件系统、驱动、网络协议等都在内核里面，运行效率高。与 QNX 和 VxWorks 相比，Linux
    更大的优势在于开源和免费，且在各种 CPU 架构上都可以运行，可适配更多的应用场景，具有很强的定制开发灵活度。


    ### 4. 卫星操作系统


    卫星的功能越来越复杂，对完成星务管理、姿态和载荷控制的星载计算机硬件和软件设计提出更高要求。通过操作系统实现任务管理调度、任务间通信、内存管理等系统功能，以
    API（应用程序接口）方式提供给用户，使软件设计人员将主要精力放在应用程序开发上，有助于星载软件通用化和模块化设计，缩短软件产品的研制周期，提高软件产品的可靠性。表
    11-4 为几种典型星载操作系统对比。


    表 11-4　几种典型星载操作系统对比


    ![](img/txt015_5.jpg "pagenumber_ebook=172,pagenumber_book=161")


    续表


    ![](img/txt015_6.jpg "pagenumber_ebook=173,pagenumber_book=162")


    VxWorks 源码需要收取一定的授权费用，是一款成熟的高实时商用操作系统，开发工具丰富，用户可对源码进行裁剪和定制开发，具有极高的安全性和稳定性，在卫星控制系统、导弹、国际空间站等重大航天项目中有多次成功应用经历。


    Linux 是一种免费使用和自由传播的类 UNIX 操作系统。由于良好的可移植性、免费开源、用户可定制、高可靠性和系统安全性的特点，使得其在航天领域得到广泛应用。例如，2021
    年美国发射的火星车采用了 Linux 操作系统。


    RTEMS 是一个为嵌入式系统设计的开源实时操作系统，代码质量和可靠性都很高。最早用于美国国防系统，现在由 OAR 公司负责版本的升级与维护。无论是航空航天、军工，还是民用领域，RTEMS
    都有着极为广泛的应用。


    μC/OS-Ⅱ是一种基于优先级的抢占式多任务实时操作系统。它可以使各个任务独立工作，互不干涉，很容易实现准时而且无误执行，使实时应用程序的设计和扩展变得容易，使应用程序的设计过程大为简化。其已通过了美国国家航空航天局的认证，可用于飞行器、太空站等关键系统的开发。


    eCos 是一种嵌入式可配置实时操作系统，开放源代码软件，无任何版权费用，具有很强的可配置能力，代码量很小，通常为几十到几百千字节，可以支持很大范围内许多不同的处理器和平台，主要应用对象包括车载设备、手持设备以及其他一些低成本和便携式应用，在国内星载计算机上已有初步应用。


    综上分析，卫星操作系统能够广泛应用需具有如下特征：高稳定性与实时性、可移植性、开源并可裁剪、丰富的开发工具、代码可固化、弱交互性以及统一的接口。与此同时，传统卫星操作系统以单星应用为主，主要用于单颗卫星的星务管理、数据处理、姿态以及载荷控制等，是卫星长期稳定运行的基础，其发展以单星单
    CPU 应用为主线。


    ### 5. 发展启示


    通过上述不同应用场景操作系统的特点、发展历程以及分布进行对比分析，总结如下：


    ①精准匹配应用需求是操作系统发展的典型路线；新场景的出现和发展都会衍生出全新的操作系统；开发者对新场景的新认知牵引着操作系统的演化。


    ②操作系统作为复杂系统的信息基座，是满足复杂场景应用需求的必然选择。


    ③操作系统成功的关键在于形成良好产业生态，需要业内人士共同努力，才能达到事半功倍的效果。


    ④一款操作系统只有对应一类特定的硬件架构，才能实现性价比最优，形成互利共惠的软硬件生态。例如，个人计算机时代的 Windows 操作系统对应的 80×86
    架构和移动互联网时代的 Android 操作系统对应的 ARM 架构。


    ⑤微内核架构由于其安全性、容错性、可移植性等独特优势，成为谷歌、华为等行业头部企业下一代万物智联操作系统的内核架构，微内核架构已成为操作系统发展主流。


    ⑥操作系统作为大型基础软件，需要付出大量的人力、物力和财力，开发失败率极高，最后能够开发成功的都是所属大国的行业头部企业，是国家意志的产物。


    ## 11.1.3 巨星座操作系统发展思路


    基于上述分析，为开发满足支撑我国巨星座高效管理及智能应用需求的巨星座操作系统，需要从架构定义、硬件载体、内核设计、安全可信以及生态建设等方面开展研究。


    ### 1. 架构定义


    操作系统架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。研制巨星座操作系统，必须首先研究面向万颗规模巨星座节点海量硬件资源管理以及巨量智能应用快速部署需求的架构定义，实现巨星座资源网格化抽象和管理，支撑实现面向千颗规模巨星座场景的“即时聚优”和“多域联合”等应用功能。


    以巨星座操作系统统筹管控巨星座系统资源，支持任务应用为主线，构建开放架构，开发应用框架，推动各层间采用标准接口，便于节点互联互通和互操作，便于硬件、软件的移植和重用，便于新技术产品应用转化实现增强与扩充。以此为基础，细化研究协议架构和安全架构，实现巨星座操作系统的体系架构设计。


    面向巨星座应用场景和功能持续演化需求，采用层次化设计思想，精细定义巨星座操作系统每层的功能结构，选用“微内核+系统服务+应用框架+行为管控”架构。微内核主要完成线程/进程间通信、内存地址空间、中断等系统基础管理功能。系统服务（外核）主要完成路由控制、移动性管理、虚拟协同计算以及
    APP 动态加载等功能。应用框架是便于操作系统服务通信、导航、遥感等多类型空间任务设定的，采用模块化、定制化设计，具备规模可伸缩、功能可裁剪等特点。行为管控是基于博伊德
    OO-DA（观察-分析-决策-行动）循环行为认知模型设计，用于实现巨星座群体自主智能。


    ### 2. 硬件载体


    星载计算机是巨星座功能实现的硬件基础。CPU 是星载计算机的中枢以及星载操作系统的运行载体，直接决定操作系统的应用能力。CPU 的选取主要从性能、功耗、对太空环境的适应能力、对外通信接口以及操作系统的支持情况等方面考虑。星载处理器主要分为
    80×86、MIL-STD-1750A、PowerPC、SPARC、MIPS、ARM 等架构系列处理器。


    80×86 处理器由于高安全和稳定性，在航天领域应用非常广泛。MIL-STD-1750A 采用十六位非精简指令集架构，我国风云系列卫星的星载计算机采用基于该架构的处理器。PowerPC
    处理器具有高性能、低功耗特点，NASA 采用的处理器架构多为 PowerPC。SPARC 采用的是精简指令集架构，该系列处理器具有高质量等级、运算能力高、功耗适中等特点，我国已有
    BM3803、BM3823、S698 等 SPARC 架构具备抗辐照能力的 CPU 实现量产。MIPS 是一种采取精简指令集的处理器架构，中科院研发的国产芯片———“龙芯”采用
    MIPS 架构和指令集，有部分高质量等级芯片在我国卫星中应用。ARM 处理器外围接口丰富，可扩展性强，尤其是搭载操作系统后，在星务管理、数据处理等方面性能强大，星载计算机采用
    ARM 处理器搭载操作系统的技术路线已成为国内外的研究热点。


    星载计算机作为星载操作系统的硬件载体，受限于空间环境的特殊性和空间电子技术的发展水平，性能相比地面计算机相差几代，成为制约星载操作系统发展的关键因素，要求设计星载操作系统时，在轻量化、运行效率、可靠性、稳定性等方面重点考虑。操作系统性能是否达到最优与需要适配的
    CPU 架构紧密相关。因此，需要根据国内星载 CPU 的发展状况，合理选择满足未来应用场景的 CPU 架构，并构建互惠共利的软硬件生态。


    ### 3. 内核设计


    巨星座操作系统内核负责星上资源与任务的抽象管理。巨星座应用场景对操作系统内核提出了 3 方面的挑战：一是巨星座单星节点的硬件资源强受限且异构，要求操作系统内核具有轻量化和异构资源灵活管控的能力；二是巨星座中高效的多星任务协同，要求操作系统内核具有低时延能力，从而充分发挥硬件能力，降低软件开销；三是太空环境中的干扰会造成软件系统运行时发生错误的概率更高，要求操作系统内核提供高效的容错机制，从而以低成本开销增强系统的容错能力。


    与地面设备不同，卫星运行在空间辐照环境中，易受宇宙射线辐射的影响。作为巨星座的核心基础设施，操作系统在应对单粒子翻转等问题时的稳定性和可靠性异常重要。在宏内核中，任何程序都有权访问所有内存和内核数据，导致程序中任何一个错误都有可能使整个系统崩溃。在微内核中，各模块间良好的独立性和隔离性可以保障操作系统即使在受到辐射而发生错误时依然能稳定工作。此外，微内核结构操作系统的模块化、可裁剪的特性，满足天基信息系统硬件资源受限需求。


    针对巨星座应用场景星上硬件资源强受限且异构、多星任务即时协同以及空间辐照环境下高效容错等核心需求，采用微内核架构，研究内核轻量化、低时延及强容错等关键技术，突破异构墙、时延墙以及容错墙等瓶颈问题，设计完全自主可控、高效灵活管控星载海量异构资源的安全实时内核，从而充分发挥星载硬件能力，降低软件开销，以低代价增强系统容错能力和提升运行效能。


    ### 4. 安全可信


    巨星座操作系统安全可信是巨星座稳定运行的基础。通过研究“云-边-端”分布式协同架构、多维资源管理、系统链路安全、空间数据防护、接入认证等关键技术，建立基于可信计算的双体系结构分布式安全可信机制，以此为基础，构建保障巨星座操作系统可靠运行的安全可信环境，形成自主创新的主动免疫三重防护框架，最终设计完成巨星座操作系统安全组件，保障巨星座操作系统的安全可信能力。


    在确保时效性的前提下，基于操作系统、一体化融合网络、计算平台控制平面、高可靠共享数据存储、集成化软件加载控制器，建立支持巨星座操作系统在轨部署和升级、星载应用软件实时更新以及动态加载的体系架构，用以保障应用软件安全稳定运行以及功能更新。


    巨星座操作系统作为巨星座系统的安全基座，基于“云-边-端”分布式安全可信机制，构建“芯片-链路-数据-应用”全链路安全可信体系，保障巨星座系统的可信与安全。


    ### 5. 生态建设


    巨星座操作系统作为面向巨星座复杂应用场景的统一基础软件平台，将促成航天软件开发由专用、闭源、定制逐渐向标准、开源、通用转变。随着航天软件系统复杂性不断增长、软件开放程度日渐增大、用户和开发者群体规模逐渐增加，上述群体关联关系更丰富、共生于一个相互影响的生态环境，最终形成开放、开源、自主可控的航天软件生态体系。


    围绕生态模式、社区规划、运行机制、管理机制等航天软件生态体系建设需求，构建研发资源数据库以及数据采集与分析工具。在此基础上，通过定义多维度评价指标，设计实现用户画像和项目画像系统，为基于巨星座操作系统的软件资源汇聚与共享提供有效支撑。


    ## 11.1.4 关键技术及解决思路


    针对巨星座复杂应用场景，构建巨星座信息基座———巨星座操作系统，对巨星座操作系统研制时涉及的体系架构、内核、融合组网、安全可信、生态体系等关键技术进行梳理分析，并提供初步的解决思路。


    ### 1. 体系架构关键技术


    架构定义涵盖需求、层次结构、功能结构、层间接口、内核架构、协议架构、安全架构等内容，是实现巨星座操作系统研制的核心基础和难点。


