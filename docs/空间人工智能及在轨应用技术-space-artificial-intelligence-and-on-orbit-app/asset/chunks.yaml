    图 13-9　通用卷积计算架构


    卷积计算加速详细结构如图 13-10 所示。`VGG-16`模型总共包含 1 634496 次卷积核大小为 3×3 的二维卷积运算，如此庞大的卷积运算可通过卷积核并行运算及多个卷积核共用一组外部存储器的方式实现卷积运算的并行加速。为达到最佳加速比，存储带宽与计算能力需匹配，然而频繁的片外数据访问会产生大量的功耗。为降低功耗，需减少卷积运算对外部数据存储器的访问频率，为此多组卷积核共用一组特征图数据的方法可以显著减少对片外存储器的访问次数，从而大大提升加速器的能效比。


