- raw: "![](images/txt016_53.jpg \"pagenumber_ebook=254,pagenumber_book=243\")\n\n\
    图12-29　深度学习通用加速器架构设计\n\n随着星载载荷及控制技术的发展，对实时目标识别处理的时效性要求越来越高，深度学习网络模型实现的实时性成为重要考虑的因素。并行计算成为一个重要的解决方案，多加速器处理架构设计研究也很有必要。\n\
    \n如图12-30所示，针对设计的通用加速器构建的多加速器处理架构，将结合具体深度学习网络模型，评估采用多加速器协同处理或并行处理的具体运算效率，并做进一步研究和优化，以设计出合理可行的多加速器处理架构。\n\
    \n![](images/txt016_54.jpg \"pagenumber_ebook=255,pagenumber_book=244\")\n\n图12-30　智能化实时目标识别多加速器处理架构\n\
    \n12.2.4　AI芯片\n\n芯片又叫集成电路，按照功能不同可分为多种，有负责电源电压输出控制的，有负责音频视频处理的，还有负责复杂运算处理的。算法必须借助芯片才能够运行，而由于各个芯片在不同场景的计算能力不同，算法的处理速度、能耗也就不同。在人工智能技术高速发展的今天，人们都在寻找能让深度学习算法更快速、更低能耗执行的芯片。目前，能够适应人工智能、深度学习需要的芯片类型有GPU、FPGA和ASIC（Application\
    \ Specific Integrated Circuits，专用集成电路）等。\n\nAI产业生态如图12-31所示，人工智能主流企业均基于自身优势，向全栈、全链路发展。\n\
    \n![](images/txt016_55.jpg \"pagenumber_ebook=256,pagenumber_book=245\")\n\n图12-31　AI产业生态\n\
    \n人工智能芯片的发展路径是从通用走向专用。作为一项计算密集型的新技术，人工智能早期可以依靠通用芯片的性能来迅速发展，而后期则必须依靠专用芯片的出现才能统治市场。定制的硬件才能实现更优的功耗效率，满足不同算法、结构、终端和消费者的需求，实现规模化的收益。\n\
    \n当然，通用芯片与专用芯片永远都不是互相替代的关系，二者必须协同工作才能发挥出最大的价值。\n\n目前AI芯片从技术架构发展来看，大致可以分为以下4个类型：\n\
    \n①通用类芯片，代表如GPU、FPGA；\n\n②基于FPGA的半定制化芯片，代表如深鉴科技DPU、百度XPU等；\n\n③全定制化ASIC芯片，代表如TPU、寒武纪Cambricon-1A等；\n\
    \n④类脑计算芯片，代表如IBM TrueNorth、Westwell、高通Zeroth等。\n\n目前AI芯片的市场需求主要是以下3类：\n\n①面向各人工智能企业及实验室研发阶段的Training需求（主要是云端，设备端Training需求尚不明确）；\n\
    \n②Inference On Cloud、Face++、出门问问、Siri等主流人工智能应用均通过云端提供服务；\n\n③Inference On Device、面向智能手机、智能摄像头、机器人/无人机、自动驾驶、VR等设备的设备端推理市场，需要高度定制化、低功耗的AI芯片产品。例如，华为麒麟970搭载了“神经网络处理单元（NPU，实际为寒武纪的IP）”、苹果A11搭载了“神经网络引擎（Neural\
    \ Engine）”。\n\n基于深度学习的人工智能网络需要进行大量的类矩阵、向量计算，算法复杂度高、程序设计难度大，对算法实时性提出极高的要求。目前，深度学习网络计算主要基于通用处理器（CPU）、通用图形处理器（GPU）或专用处理器，通过软件方式在地面通用计算平台实现，如何在嵌入式产品，特别是星载设备的应用却面临着海量数据、强实时性、空间辐照环境使用、高效网络模型、高能效比等一系列难题亟待解决。\n\
    \n亟须结合星载环境及任务特点，设计基于多并行存储和计算架构的人工智能计算加速芯片，通过通用型参数化的全流水卷积和全连接处理模块，构建可扩展的加速架构，深度学习网络模型通过量化、剪枝等轻量化方法全面优化，提升AI计算芯片计算能力和能效比。与此同时，同步开展类脑架构的脉冲型神经网络芯片，进一步提升计算能效比。\n\
    \n12.3　计算平台\n\n设计采用通用化、模块化、系列化设计思想，利用高速数据交换、高速数据存储以及异构计算等技术，可适应多类型、多体制卫星数据接收、处理高实时性战役战术信息的需求，以及可实现多任务处理、灵活可变的整体结构，形成开放式兼容平台，具备软硬件可重构功能，高效完成星上任务的同时兼顾系统柔性化功能扩展需求。\n\
    \n12.3.1　高性能高可靠通用硬件平台\n\n采用Space VPX总线标准，各单元板卡使用6U标准结构，充分考虑宇航应用的高可靠、高效能、抗辐照、强容/纠错能力等特点，将该装置分为控制和处理两大部分。控制部分采用高可靠、抗辐照宇航级器件，而处理部分采用高性能、大容量常规器件，在有效降低成本的同时，提升可靠性和处理性能。采用网状处理节点设计思路，支持多单元协同处理，扩展性强；利用可重构设计思想，提升装置在轨维护能力；充分考虑遥感成像结果具有稀疏性的特点，设计成精、粗两级处理数据流，在提升处理效率的同时，取得了较好处理效果。\n\
    \n如图12-32所示，该平台主要包含供电单元、主控单元、IO单元、处理单元、交换单元、存储单元以及高速背板。\n\n![](images/txt016_56.jpg\
    \ \"pagenumber_ebook=258,pagenumber_book=247\")\n\n图12-32　高性能高可靠通用硬件平台原理样机原型系统框图\n\
    \n根据现有人工智能算法的研究，基于深度学习的人工智能计算主要完成CNN的加速运算。在CNN硬件加速设计过程中，需要从系统架构、位宽、存储和内部总线进行整体考虑，在减少各计算、存储模块数据交互传输的基础上，提高计算的并行。\n\
    \n根据上述计算特点，在轨实时处理系统采用全并行流水线处理架构，通过数据流驱动的方式，设计高吞吐率、低延时、高加速比的算法实现架构；充分发挥FPGA等可编程逻辑电路的特点，通过采用近似计算、动态可重构、乒乓操作等设计方法，合理优化和简化处理流程，使得复杂处理算法在速度、精度和硬件开销等方面达到最优平衡。\n\
    \n实时处理设备通过高性能处理器、高速总线、大容量存储以及高可信操作系统实现对各类信息的实时/近实时处理，这在带来总体性能提升的同时，也带来了系统集成度和复杂度的增加，如果仅仅依赖原有的可靠性设计手段，将难以满足日趋复杂的系统功能变化。为提升信息处理系统整体可靠性和容错能力，将可靠性容错分成3个方面开展设计，分别为系统级、设备级和模块级。通过设计各级所采用的可靠性和容错设计措施，构建层次化的可靠性保障与容错体系，提高系统整体可靠性。基于以上设计思想和理念，完成一套硬件产品设计。\n\
    \n如图12-33所示，该产品可适应多类型、多体制卫星数据接收、处理高实时性信息的需求。设计适应多任务处理、灵活可变的整体结构，采用Space VPX总线技术，形成开放式兼容架构，具备软件可重构、硬件可扩展、安全可控等功能，高效完成在轨处理任务的同时兼顾系统柔性化功能扩展需求。\n\
    \n![](images/txt016_57.jpg \"pagenumber_ebook=259,pagenumber_book=248\")\n\n图12-33　高性能高可靠通用硬件平台内部互联关系图\n\
    \n12.3.2　硬件平台容错技术\n\n为提升星上信息处理系统的可靠性和容错能力，一般将可靠性和容错技术分成3个方面开展研究，分别为模块级、设备级和系统级。\n\
    \n1.模块级\n\n利用基于SRAM型FPGA可重构特性，在轨通过遥控或自主的方式实现功能结构和性能特性的改变，适应卫星在不同环境、不同任务阶段下的应用需求。\n\
    \n设某时序系统的功能为F，在不同的工作时刻，实时有效的模块功能为F t（设t=0～N），其功能表达式如下所示：\n\nF t\\=f 0+f 1+f 2+f\
    \ 3+…+f N\n\n在每一单独时刻，只需要实现有效的逻辑功能ft，而用动态重构技术完成各功能之间的切换。\n\n更进一步，在资源功耗受限的情况下，通过动态重构技术实现IP的重构和复用，有效降低资源和功耗开销，提升产品的灵活性。\n\
    \n下面就具体方案进行阐述。\n\n1）基于ICAP接口的FPGA配置回读、校验及重配置技术\n\n如图12-34所示，ICAP为FPGA芯片内部配置访问接口，该接口实现了FPGA芯片和FPGA配置控制器之间的接口。该接口使FPGA中内嵌的处理单元能够直接在FPGA内部对其配置数据进行操作。ICAP模块作为硬核嵌入在FPGA中，该模块的例化无需额外的逻辑单元，对用户逻辑无影响。Xilinx提供了对ICAP封装后的可直接挂在PLB总线上的IP核———HWICAP。\n\
    \n![](images/txt016_58.jpg \"pagenumber_ebook=260,pagenumber_book=249\")\n\n图12-34　FPGA可重构接口\n\
    \nHWICAP模块通过PLB总线与FPGA内部嵌入式处理器相连，等待来自嵌入式处理器的配置/回读信号。HWICAP模块包含多个控制及状态寄存器，通过ICAP状态机控制ICAP硬件接口，实现配置和回读功能。\n\
    \n2）基于EAPR的FPGA重构设计技术\n\nEAPR（Early Access Partial Reconfiguration）是Xilinx最新提出的一种动态重构设计方法。该方法可以使设计流程更加简化。如图12-35所示，主要包括以下方面：\n\
    \n①基于EAPR，实现FPGA可重构区域定义；\n\n②实现可重构功能的逻辑接口和物理接口定义，一般采用标准片上总线协议规定的或其他规范的标准接口定义形式，实现接口、资源的规范化和标准化；\n\
    \n![](images/txt016_59.jpg \"pagenumber_ebook=261,pagenumber_book=250\")\n\n图12-35　FPGA可重构区域设计（书后附彩插）\n\
    \n③可重构功能逻辑，以IP形式体现；\n\n④如图12-36所示，建立可重构IP库并实现基于配置位流的在轨配置文件管理。\n\n![](images/txt016_60.jpg\
    \ \"pagenumber_ebook=261,pagenumber_book=250\")\n\n图12-36　FPGA重配置文件管理\n\n2.设备级\n\
    \n设备级的容错和重构主要是把故障模块或故障部件从系统中隔离，并根据系统需求，将健康的模块重组，使设备能够继续对外提供各项功能。设备级的故障处理手段可以采取软件隔离和硬件隔离，恢复措施可以采取备份代替等。\n\
    \n①如图12-37所示，系统中所有硬件模块均采用标准内总线接口，并均采用热备份或冷备份设计，各模块的主份和备份均挂接在一条具有高度可靠性和冗余性的内总线上，冷备份模块可切换，并具有完备的抗单粒子翻转防护设计。\n\
    \n![](images/txt016_61.jpg \"pagenumber_ebook=262,pagenumber_book=251\")\n\n图12-37　硬件模块主备份互联模式\n\
    \n系统采用模块化的设计方式，设备由不同硬件模块组装而成。各硬件模块均采用冗余备份的设计方式，可实现热备份工作或冷备份工作等模式，从而将系统或设备的冗余方式由传统单机级的冗余备份转变为了模块级的冗余备份，达到减小系统冗余的颗粒度，提升冗余资源利用率，增强系统可靠性的目的。\n\
    \n②接口重定向设计。系统通过标准的接口与卫星其他系统进行信息交互，其中包括上行遥控接口、下行遥测接口、总线接口、RS422接口和高稳时钟接口等。不同外部接口往往对应着不同应用任务，如上行遥控接口对应于遥控处理任务。因此，为了支持应用任务的分布运行，需要对外部接口进行统一管理，并使其能够通过硬件控制逻辑将外部接口映射到不同的计算单元上。\n\
    \n3.系统级\n\n为保证系统的稳定运行，星载综合电子系统需具备系统级的重构能力。根据重构方式的不同，星载综合电子系统的重构主要包含以下3个层次：\n\n\
    ①软件重构。星载综合电子系统可接收星地、星间数据，完成软件或FPGA的在轨维护，支持智能处理算法、计算模型以及大规模FPGA软件的更新。\n\n②系统设备间重构。系统中的各设备（如卫星管理单元、空间网络路由单元）在一定程度上功能对等，可相互替代，故障情况下系统可重构，系统管理功能可自动从故障单元迁移到正常单元，使系统功能恢复。\n\
    \n③系统信息流重构。在系统交换机上设置专门的监视计算机对网络的通信状态进行监控。若网络通信状态与预期不符，则由监视计算机切换交换机的路由表，实现系统信息流重构。\n\
    \n12.3.3　在轨快速维护技术\n\n如图12-38所示，基于星载一体化融合网络、计算平台控制平面、高可靠共享数据存储、集成化软件加载控制器，建立支持星载软件App实时更新、动态加载的体系架构。\n\
    \n![](images/txt016_62.jpg \"pagenumber_ebook=263,pagenumber_book=252\")\n\n图12-38　在轨快速维护框图\n\
    \n1.程序维护\n\n高性能、高可靠通用硬件平台任务复杂，智能化水平要求高，大量的功能需要采用软件方式实现。以卫星在轨高效能、高可靠工作和好用、易用为目标，整星级设计功能完善的软件在轨维护系统从以下两个方面进行维护：一方面，可根据在轨运行情况对载荷工作模式控制、目标检测、成像处理、目标识别、信息生成等软件进行在轨更新升级，提升工作效能，适应任务变化；另一方面，对于在轨发现的故障或隐患，通过更新设计，可以对故障进行处置或消除原设计中存在的缺陷，增强卫星长期在轨工作的可靠性。\n\
    \n高性能、高可靠通用硬件平台设计了高效一体化软件在轨维护系统，如图12-39所示。通过测控通道和高速上行通道可向卫星注入新的软件程序，由系统管理单元（SMU）统一接收并负责缓存和分发；所有智能终端设备通过整星分布式一体化总线网络（SpaceWire+1553\
    \ B），接收系统管理单元分发的在轨维护软件程序，对本设备内部CPU软件、DSP软件或FPGA程序进行在轨的局部功能修改（SRAM，掉电后不可恢复）或者整体替换（更新程序保存在EEPROM或FLASH中，掉电可保持）。同时，SMU在内部非易失大容量存储模块中对所有上注程序进行备份存储，当某个用户设备内部程序数据发生异常损坏时，可通过总线网络从SMU进行自主恢复，无需地面重新上注。\n\
    \n![](images/txt016_63.jpg \"pagenumber_ebook=264,pagenumber_book=253\")\n\n图12-39　软件在轨维护系统架构框图\n\
    \n高性能、高可靠通用硬件平台主要基于FPGA、DSP和GPU平台，软件程序存储器采用FLASH或EEPROM，程序加载到处理器内部SRAM中运行，在轨维护需求如表12-12所示。\n\
