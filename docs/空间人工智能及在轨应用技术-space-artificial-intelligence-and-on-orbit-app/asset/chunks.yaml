    如图 13-38 所示，在轨实时监测系统主要包含卫星平台、载荷、数传以及信息处理等功能单元，通过在轨实时处理技术，快速从载荷数据中提取空间碎片目标位置、亮度等信息，针对重点目标完成在轨自动跟踪和确认，并将处理结果下传至地面，进一步对目标进行编目和确认管理。


