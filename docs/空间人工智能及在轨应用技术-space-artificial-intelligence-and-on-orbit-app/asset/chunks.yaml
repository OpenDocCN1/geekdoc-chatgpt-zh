    \ SDRAM芯片进行数据缓存。DSP具有密集计算能力强、易于编程实现等优点，主要配合AI加速芯片完成感兴趣目标检测以及配合FPGA完成感兴趣区域提取功能。\n\
    \nAI加速模块选用AI计算芯片，每片AI计算芯片外扩4片8GB容量DDR3 SDRAM芯片进行数据缓存以及1片16GB容量Nand Flash进行权重参数缓存和程序数据。AI加速芯片具有适用于深度学习前向推理网络模型的计算架构、计算能力强、能效比高等优点，主要完成基于深度学习的目标检测和目标鉴别功能。\n\
    \n为了便于与前端载荷和后端发射通道的匹配，数据输入输出接口均通过实时处理单元进行连接，根据载荷输出数据率和接口形式，结合数据处理能力，灵活配置输入处理单元数量，同样可根据数据传输通道配置输出接口。处理单元数量配置不同决定系统输入输出能力。\n\
    \n11.3　大数据技术\n\n近年来，随着卫星技术的发展，卫星数据以几何级数的速度快速增长。这些时效性强、覆盖范围广、多类型、高分辨率的海量数据被用于地表信息提取、资源与生态环境变化监测等诸多领域，发挥了巨大作用。但是，卫星数据量的快速增长和数据类型的不断丰富，也对数据快速精准解译方法与技术提出了更高要求，原始拍摄数据大量堆积与可用信息提取不足的矛盾日益突出。\n\
    \n11.3.1　样本库\n\n建立多源图像样本库，首先收集可见光图像、多光谱图像、高光谱图像、红外图像和SAR图像等各种传感器图像，然后对图像进行筛选和分类，最后建立多源图像样本库。建立多源图像样本库，优势在于方便标定数据，有利于目标检测算法验证。拟建立的典型目标特性库包含以下几种：\n\
    \n①几何知识库，即各种军船、民船、飞机、车辆的几何参数、特征等。\n\n②特征库，即对可见光图像、多光谱图像、高光谱图像、红外图像和SAR图像等各种图像进行筛选和分类，建立各种目标的特征库。\n\
    \n③光谱库，即基于多光谱图像、高光谱图像的数据库。\n\n可采用生成式对抗网络GAN增加多源图像的数量和复杂度，便于系统神经网络的训练和后期整个检测识别系统的测试。\n\
    \n如图11-10所示，为提升基于深度学习的人工智能网络模型的性能，需利用大量样本切片对深度学习模型进行训练，以获取泛化外推能力优异的模型参数。因此，需要收集大量图像数据，建立数据量庞大的图像感兴趣目标的样本库。\n\
    \n![](images/txt015_16.jpg \"pagenumber_ebook=191,pagenumber_book=180\")\n\n图11-10　目标切片图像\n\
    \n国内典型星载样本库构建：可见光方面，基于GF-1、GF-2、JL-1等1 000余景国产遥感卫星图像，建立包含飞机、船只、车辆、海港、岛礁、云等目标的全色光深度学习样本库，完成10\
    \ 000余个样本实例标注；采用迁移学习的训练方法，通过交叉验证与网格搜索策略，获得网络训练最优超参数集合；对云、岛屿、人工建筑和船4类目标查准率达到98%。SAR方面，基于GF-3、RadarSat-1、Sentinel-1等国内外SAR卫星图像数据，构建SAR舰船检测数据集，该数据集包含45\
    \ 000舰船切片，可满足星载SAR图像的舰船目标检测、识别、训练和测试。\n\n11.3.2　网络模型训练\n\n基于深度学习的人工智能分为训练与预测两个过程。首先根据人工标定的目标图像切片作为CNN分类器的学习输入，经过训练后得到对应的分类器，然后根据得到的分类器对待分类目标切片进行预测，实现目标鉴别。\n\
    \n深度学习是典型的数据驱动的“表示学习”范式———由数据自提取特征，计算机自己从训练库中发现数据特征规则，进行自学习。因此，训练库中样本的代表性、对复杂情况的覆盖面、样本的丰富度直接决定了深度学习算法的优劣。船舶遥感影像质量除了受到复杂多样的成像因素（如天气状况、气候条件、太阳角度、成像视角、海面高光反射等），还受到复杂背景（如不同级别海浪）的影响。\n\
    \n研究在有限的人工识别样本以及舰船三维模型的基础上，训练样本合成与仿真模拟技术，实现对舰船图像原始样本的合理而有效的扩展，从而构建代表性强的遥感船舶图像样本库。\n\
    \n很多研究表明，与传统方法比较，CNN可以学习到更高效的高层图像特征，但是训练一个识别率高、泛化能力强的CNN模型，往往需要大量有标签样本。目前，光学遥感图像数据集相对有限，而多数深度学习模型是面向自然场景图像识别任务，研究充分，数据量大，可通过采用迁移学习的方法，将大样本数据库上预训练好的模型应用在其他不同空间尺度不同传感器的少样本应用中，是提升舰船样本应用效率，提升系统扩展能力的关键技术。\n\
    \n训练深度学习模型计算量非常庞大，严重影响了深度学习模型的生产使用。确保深度学习模型能够快速的训练是深度学习模型有效性的必要条件。如图11-11所示，在已有的硬件条件下，采用当前先进的训练平台Pytorch，使用大规模分布式计算集群的强大计算能力，利用模型可分布式存储、参数可异步通信的特点构建分布式深度学习模型训练技术，实现深度学习模型的快速训练。\n\
    \n![](images/txt015_17.jpg \"pagenumber_ebook=192,pagenumber_book=181\")\n\n图11-11　基于Pytorch的模型训练示例\n\
    \n11.3.3　样本共享服务平台\n\n针对大规模样本共享服务问题，设立样本开源共享平台，支持多维语义查询、统计分析、数据共享服务。样本共享服务平台的总体框架如图11-12所示，包括基础设施层、数据存储层、数据服务层和应用层。其中，基础设施层包括分布式存储阵列、GPU集群、文件系统、数据库系统及网络环境等。\n\
    \n![](images/txt015_18.jpg \"pagenumber_ebook=193,pagenumber_book=182\")\n\n图11-12　样本共享服务平台总体框架\n\
    \n以分布式弹性大规模存储阵列支撑全球范围海量遥感影像样本集的高吞吐和可扩展管理，以GPU集群支持深度学习模型计算和在线多并发访问快速响应需求。数据存储层支持多尺度多类型样本数据的存储、扩展、维护与版权保护。服务层支持遥感影像样本的多维语义查询和样本数据服务发布，对外提供具有互操作能力的数据访问服务接口。应用层允许用户进行开放注册并根据版权协议进行权限管理，在此基础上提供样本的录入、校验、多维语义查询、数据获取和可视化功能服务，并基于时空数据关联分析、样本综合统计分析、知识发现等数据挖掘模型为用户提供样本的在线分析与应用。\n\
    \n11.4　天基云计算技术\n\n针对星上数据处理能力限制问题，研究天基分布式快速智能云处理体系架构技术，包括弹性可重构天基云处理网络拓扑结构、海量数据分布式协同处理技术、天基云处理资源智能管理与调度技术，解决空间威胁目标海量探测数据近实时处理需求与单颗卫星有限的计算能力之间的矛盾，满足天基快速智能云处理体系架构的高可靠性、高带宽、灵活可扩展性等需求。\n\
    \n11.4.1　天基快速智能云处理体系架构\n\n针对星上数据处理能力限制，需要发展天基分布式快速智能云处理体系架构技术，提供可满足近实时海量数据智能计算处理要求的硬件资源，并通过任务规划要求和星上硬件资源状态、任务等级约束，形成自适应架构，建立多星联合的异构计算、通信、存储体系。\n\
    \n结合当前地面云处理的应用与研究，天基快速智能云处理的体系架构可以分为核心服务、服务管理和用户访问接口3层，如图11-13所示。核心服务层将硬件基础设施、软件运行环境、应用程序抽象成服务，这些服务具有可靠性强、可用性高、规模可伸缩等特点，满足多样性的应用需求。服务管理层为核心服务提供支持，进一步确保核心服务的可靠性、可用性与安全性。用户访问接口层实现端到云的访问。\n\
    \n![](images/txt015_19.jpg \"pagenumber_ebook=194,pagenumber_book=183\")\n\n图11-13　天基快速智能云处理体系架构\n\
    \n天基快速智能云处理核心服务层分为3个子层：基础设施即服务（Infrastructure as a Service，IaaS）、平台即服务层（Platform\
    \ as a Service，PaaS）、软件即服务层（Software as a Service，SaaS），各层服务特点如图11-14所示。\n\n![](images/txt015_20.jpg\
    \ \"pagenumber_ebook=195,pagenumber_book=184\")\n\n图11-14　IaaS、PaaS、SaaS服务特点比较\n\
    \n服务管理层对核心服务层的可用性、可靠性和安全性提供保障。服务管理包括服务质量（Quality of Service，QoS）保证、安全管理、计费管理、资源监控等管理措施，对天基快速智能云处理的稳定运行起到重要作用。\n\
    \n用户访问接口实现了云处理服务的泛在访问，通常包括命令行、网络服务、网络门户等形式。命令行和网络服务的访问模式既可为终端设备提供应用程序开发接口，又便于多种服务的组合。\n\
    \n11.4.2　弹性可重构天基云处理网络拓扑结构\n\n针对天基快速智能云处理体系架构的高可靠性、高带宽、灵活可扩展性等需求，开展弹性可重构天基云处理网络拓扑结构技术研究。如图11-15所示，传统的树型结构网络拓扑存在以下缺陷：一是可靠性低。若汇聚层或核心层的网络设备发生异常，网络性能会大幅下降。二是可扩展性差。因为核心层网络设备的端口有限，难以支持大规模网络。三是网络带宽有限。在汇聚层，汇聚交换机连接边缘层的网络带宽远大于其连接核心层的网络带宽（带宽比例为80∶1，甚至240∶1），因此对于连接在不同汇聚交换机的计算节点来说，它们的网络通信容易受到阻塞。\n\
    \n![](images/txt015_21.jpg \"pagenumber_ebook=196,pagenumber_book=185\")\n\n图11-15　传统的树型网络拓扑\n\
    \n针对上述传统拓扑结构的缺陷，采用VL2、PortLand、DCell、BCube等新型网络拓扑结构，在传统树型结构中加入类似mesh的构造，使得节点之间的连通性与容错能力更高，易于负载均衡，节点更容易扩展。以PortLand结构为例，如图11-16所示，整个网络可以由5k2/4个k口交换机连接k3/4个计算节点。PortLand由边缘层、汇聚层、核心层构成。其中，边缘层和汇聚层可分解为若干个Pod，每一个Pod含k台交换机，分属边界层和汇聚层（每层k/2台交换机）。Pod内部以完全二分图的结构相连。边缘层交换机连接计算节点，每个Pod可连接k2/4个计算节点。汇聚层交换机连接核心层交换机，每个Pod连接k2/4台核心层交换机。基于PortLand，可以保证任意两点之间有多条通路，计算节点在任何时刻两两之间可无阻塞通信，从而满足云计算数据中心高可靠性、高带宽、可扩展性等需求。\n\
    \n![](images/txt015_22.jpg \"pagenumber_ebook=196,pagenumber_book=185\")\n\n图11-16　PortLand网络拓扑\n\
    \n11.4.3　天基海量数据分布式快速协同处理\n\n针对空间威胁目标海量探测数据近实时处理需求与单颗卫星有限的计算能力之间的矛盾，开展基于天基云处理架构的海量数据分布式协同处理技术研究，采用MapReduce、Dryad等分布式并行数据处理模型，能够支持规模扩展，屏蔽底层细节且简单有效。\n\
    \nMapReduce模型由大量Map和Reduce任务组成，如图11-17所示。根据两类任务的特点，可以把数据处理过程分为Map和Reduce两个阶段：在Map阶段，Map任务读取输入文件块，并行分析处理，处理后的中间结果保存在Map任务执行节点；在Reduce阶段，Reduce任务读取并合并多个Map任务的中间结果。MapReduce可以简化大规模数据处理的难度：首先，MapReduce中的数据同步发生在Reduce读取Map中间结果的阶段，这个过程由编程框架自动控制，从而简化数据同步问题；其次，由于MapReduce会监测任务执行状态，重新执行异常状态任务，所以不需要考虑任务失败问题；再次，Map任务和Reduce任务都可以并发执行，通过增加计算节点数量便可以加快处理速度；最后，在处理大规模数据时，MapReduce任务的数目远多于计算节点的数目，有助于计算节点负载均衡。\n\
    \n![](images/txt015_23.jpg \"pagenumber_ebook=197,pagenumber_book=186\")\n\n图11-17　MapReduce的执行过程\n\
    \nDryad采用了基于有向无环图（Directed Acyclic Graph，DAG）的并行模型，如图11-18所示。在Dryad中，每一个数据处理任务都由DAG表示，图中的每一个节点表示需要执行的子任务，节点之间的边表示两个子任务之间的通信。Dryad可以直观地表示出作业内的数据流。基于DAG优化技术，Dryad可以更加简单高效地处理复杂流程。同MapReduce相似，Dryad屏蔽了底层的复杂性，并可以在计算节点规模扩展时提高处理能力。\n\
    \n![](images/txt015_24.jpg \"pagenumber_ebook=198,pagenumber_book=187\")\n\n图11-18　Dryad的任务模型\n\
    \n11.4.4　天基云处理资源智能管理与调度\n\n天基海量数据处理的执行性能受到网络带宽的影响，但是网络带宽是天基云计算节点集群的急缺资源，因此海量数据处理平台的任务调度需要考虑网络带宽因素。为了减少任务执行过程中的网络传输开销，可以将任务调度到输入数据所在的计算节点，因此需要研究面向数据本地性的任务调度算法，采用HTA（Hadoop\
    \ Task Assignment）问题模型，该模型为一个变形的二部图匹配，如图11-19所示。其目标是将任务分配到计算节点，并使各计算节点负载均衡。其中，si、tj分别表示计算节点和任务，实边表示si有tj的输入数据，虚边表示si没有tj的输入数据，wl和wr分别表示调度开销。基于先均匀分配再均衡负载的思想，通过BAR算法快速求解大规模HTA问题。\n\
    \n![](images/txt015_25.jpg \"pagenumber_ebook=198,pagenumber_book=187\")\n\n图11-19　HTA问题模型\n\
    \n除了保证数据的本地性，天基云处理网络的作业调度器还需要考虑作业之间的公平调度。工作负载中既包括子任务少、执行时间短、对响应时间敏感的即时作业（如数据查询作业），也包括子任务多、执行时间长的长期作业（如数据分析作业）。研究公平调度算法可以及时为即时作业分配资源，使其快速响应。为了折中数据本地性和作业公平性，采用基于最小代价流的调度模型。如图11-20所示，wij表示作业i的子任务j，wij和c、r、x、u的边分别表示任务被调度到计算节点、机架、数据中心和不被调度，每条边带有权值，并需要根据集群状态实时更新权值。当系统状态发生改变时（如有计算节点空闲、有新任务加入），调度器对调度图求解最小代价流，并做出调度决策。\n\
    \n![](images/txt015_26.jpg \"pagenumber_ebook=199,pagenumber_book=188\")\n\n图11-20　Quincy的调度模型\n\
    \n为了使天基云处理平台可以在任务发生异常时自动从异常状态恢复，需要研究任务容错机制。MapReduce的容错机制在检测到异常任务时，会启动该任务的备份任务。备份任务与原任务同时进行，当其中一个任务顺利完成时，调度器立即结束另一个任务。针对异构环境下异常任务的发现机制，采用LATE（Longest\
    \ Approximate Time to End）调度器，通过估算Map任务的完成时间，LATE为估计完成时间最晚的任务产生备份。\n\n\uFEFF\n\
    \n第12章　共性技术\n\n本章将人工智能共性技术定义为算法模型、训练平台、计算平台、计算加速、样本库、AI芯片等，涵盖人工智能算法、数据、算力及系统平台等基础要素。下面分别从算法模型、计算加速以及计算平台3个方面展开阐述。\n\
    \n12.1　算法模型\n\n20世纪50年代初期，人工智能追求研发出能够像人类一样具有智力的机器，研究界把这个称之为“强人工智能”，后续出现了专家系统。在特定领域运用人工智能技术，给人工智能发展注入新的活力，然而又带来了难以移植、成本昂贵等问题。1980年之后，机器学习成为AI研究的主流，研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构使之不断改善自身的性能。2000年左右，计算机科学家在神经网络研究基础上加入多层感知器构建深度学习模型，成功解决了图像识别、语音识别以及自然语言处理等领域的众多问题。近年来，在IBM等科技巨头推动下认知计算（Cognitive\
    \ Computing）蓬勃发展，通过学习理解语言、图像、视频等非结构化数据，更好地从海量复杂数据中获得知识，做出更为精准的决策。机器学习是人工智能领域研究的核心问题之一，理论成果已经应用到人工智能的各个领域。机器学习算法通过模式识别系统根据事物特征将其划分到不同类别，通过对识别算法的选择和优化，使其具有更强的分类能力。\n\
    \n探究人工智能领域内的相关概念，机器学习、深度学习、强化学习是驱动其快速发展的核心动力。人工智能最早出现，曾一度被极为看好；之后，人工智能的一些较小的子集即机器学习得到了快速发展；近十年来，机器学习领域内的另一分支———深度学习得到了广泛关注，造成了前所未有的巨大影响，成为驱动人工智能大爆炸的核心。\n\
    \n1.人工智能（Artificial Intelligence），为机器赋予人的智能\n\n早在1956年夏天的达特茅斯学院智能研讨会上，人工智能的先驱们就梦想着用当时刚刚出现的计算机来构造复杂的、拥有与人类智慧同样本质特性的机器。这就是我们现在所说的“强人工智能”（General\
    \ AI）。这个无所不能的机器，它有着人类所有的感知（甚至比人更多），我们所有的理性，可以像我们一样思考。\n\n人们在电影里也总是看到这样的机器：友好的，像星球大战中的C-3\
    \ PO；邪恶的，如终结者。强人工智能现在还只存在于电影和科幻小说中，原因不难理解，人们还没法实现它们，至少目前还不行。\n\n目前能实现的，一般被称为“弱人工智能”（Narrow\
    \ AI）。弱人工智能是能够与人一样，甚至比人更好地执行特定任务的技术，如Pinterest上的图像分类或者Facebook的人脸识别。\n\n2.机器学习，一种实现人工智能的方法"
