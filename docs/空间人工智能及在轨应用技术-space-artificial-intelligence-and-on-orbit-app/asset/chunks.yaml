    由表13-6结果可知，在不同场景下，舰船目标的检测有效率均未超过60%，这类场景在进行疑似目标筛选分割过程容易形成虚警目标，因而在复杂背景下，基于形态学的传统目标检测算法适应性一般，会造成很大程度的误检。由表13-7结果可知，舰船目标的查全率均超过92%，尤其是基于机器学习的目标识别方法将系统查准率提升到97%以上。由此可见，机器学习对目标分类识别效果显著，有效提升目标检测识别的正确率。


    具体处理过程总结如下：通过对遥感图像进行背景噪声抑制，增强舰船目标相对于背景的灰度对比度，然后采用待检区域-邻域直方图方差比对的方法结合分割标注结果区分出疑似目标区域，提取出疑似舰船目标。同时，采用圆形度等形状特征对疑似目标进行鉴别，进一步有效地判读出舰船目标。最后，通过采用深度学习网络模型VGG-16，对上述传统方法获得的检测结果做进一步的分类识别，在背景复杂、虚警率高的情况下，能够有效判读出舰船目标以及其他背景干扰项。本方法具有易于在星上嵌入式硬件实现的优点，可实现1
    s最多检测识别20个目标切片，最高功耗70 W，满足低功耗、小型化光学遥感图像在轨舰船目标实时检测处理需求。


    在取得以上成果的同时，上述方法也存在许多不足，需要改进，具体总结如下：首先，由于遥感数据分辨率较低，目标特征表现相对高清图像较弱，再加上样本数不够丰富，上述训练模型存在过拟合的风险，后续需进一步研究样本数量与质量对数据模型训练效果的影响，使模型在分类种类、精度和鲁棒性方面有更好的提升。其次，在试验中仅测试了一种CNN模型，不同模型对性能的影响缺乏实际效果的说明。最后，网络剪枝可以有效降低参数量，稀疏网络，降低处理计算量，在后续运算效率上还有很大提升空间。


    13.1.2　SAR遥感目标检测


    在大范围的海洋监视中，较SAR而言，光学成像的缺点是高分辨率的成像系统观测条带很窄而且受光照和天气影响很大，并不适合大范围监视，但对特定的海洋监视区域，如港口、海峡等海区是比较适合的。因此，SAR成像可以作为光学成像的信息先导。在实际的应用中，用于舰船目标检测的SAR图像一般具有较宽的测绘带，数据量巨大，信息提取较困难，实时性较差，而星上在轨SAR实时成像及感兴趣目标提取技术能够有效地解决这一问题。


    近年来，采用高分辨率SAR对地成像技术获取的SAR遥感图像包含有丰富特征，为舰船等感兴趣目标实时提取奠定了坚实基础。当前，对基于SAR图像的舰船目标本身的检测主要有最优恒虚警（CFAR）检测算子、双参数CFAR方法、多极化检测算法、多分辨率目标检测、基于卷积神经网络的检测方法、基于匹配滤波的检测方法、阈值检测法、基于模糊对策的检测方法以及基于分割的模拟退火的检测方法等。这些检测方法依赖于具体的海洋环境和SAR图像，单一参数的SAR图像目标检测器在杂波边缘、方位向模糊、干扰目标杂波环境中检测性能下降，出现检测率下降或虚警率上升的情况，基于深层卷积神经网络的目标检测算法通常难以有效应对大幅影像的目标搜索和弱小目标检测问题。遥感卫星载荷数据量大，峰值传输速率高，而SAR图像目标提取算法复杂，对平台的计算能力要求极高，但星载计算平台硬件不同于地面或其他平台，具备鲜明的高可靠、高效能、抗辐照、强容/纠错能力等特点。因此，星载实时处理性能优劣与算法模型是否优化息息相关。


    对面向SAR遥感图像的舰船目标在轨实时提取技术进行了研究，设计了一种以全局统计为基础的高效舰船目标检测算法和超轻量化疑似目标真伪鉴别网络，实现舰船目标快速提取，解决了遥感卫星信息获取实效性差，严重依赖数据传输系统带宽等瓶颈问题。根据当前的星载处理平台架构，对OTSU阈值求取、连通域标注以及卷积神经网络等高密度计算算法模块做了优化，在保证算法整体性能的基础上，有效减少了算法的计算量，大幅降低了算法实时实现对硬件平台性能的依赖，使得该星载实时信息处理模块在计算精度、速度、硬件规模以及热耗等方面达到良好平衡。


    1.舰船目标提取算法设计


    1）算法流程设计


    经过研究，针对SAR遥感图像感兴趣舰船目标稀疏性的特点，提出一种面向SAR遥感图像的船舰目标在轨实时提取算法。如图13-18所示，设计一种基于传统图像处理方法实现目标检测以及基于超轻量卷积神经网络实现目标鉴别。首先，采用基于二维模板滤波的图像去噪、顶帽变换的目标增强以及以全局统计为基础的目标分割技术获取疑似目标；然后，采用自主设计的超轻量卷积神经网络对疑似目标做真伪性鉴别，大幅降低虚警，实现对舰船目标的有效提取。卷积神经网络采用自主设计网络结构、网络量化剪枝、权值共享等手段，减少权重参数，提高计算实时性。该方法兼顾了舰船目标提取的有效性、在轨实时处理的可行性以及在轨维护的便捷性，可在当前的星载处理平台上应用。


    ![](images/txt017_32.jpg "pagenumber_ebook=289,pagenumber_book=278")


    图13-18　SAR图像目标提取流程


    2）目标检测方法


    将图13-18算法流程进一步细化得到图13-19的舰船目标检测及鉴别方法。


    设计一种以统计学理论为基础的目标检测方法MDN。该方法构建多层模板卷积滤波网络，有效抑制相干斑、距离和方位向模糊带来的背景噪声，并实现舰船目标增强，便于对SAR图像进行快速分割和高效提取舰船疑似目标。


    MDN主要分为3个部分：一是数据预处理。对原始图像采用高斯滤波、中值滤波去除SAR图像中周期性和随机噪声，采用顶帽变换实现舰船目标增强。二是图像分割。对预处理完成后的图像进行OTSU自适应迭代分割，得到二值图像后，对其进行形态学膨胀处理以消除目标内部孔洞目标，然后进行连通域标注。三是疑似目标提取。根据连通域标注结果求取质心，之后进行基于形状特征的目标鉴别，对疑似目标标注结果进行面积及长宽比判定，剔除虚警目标，提取疑似目标切片。


    ![](images/txt017_33.jpg "pagenumber_ebook=290,pagenumber_book=279")


    图13-19　舰船目标检测及鉴别方法


    由算法流程可知，MDN是由二维模板平滑滤波、顶帽变换、基于全局统计的自适应分割、连通域标注等组成的深度计算结构。二维模板滤波处理包括串联层和并联层，串联层层与层之间相互连接实现平滑滤波处理，并联层层内连接主要包括模加减操作实现顶帽变换处理；平滑滤波和顶帽变换处理结果进入自适应分割网络，通过OTSU自适应阈值求取、图像分割、二值图像连通域标注以及面积及长宽比判别等处理输出疑似目标坐标及大小。


    MDN算法实现过程中将膨胀系数、降分辨率系数、目标面积、长宽比等关键阈值实现参数化可配置，不同图像分辨率通过选取不用参数的方法进行，因而可以更好地适用于星载处理平台，特别是在图像预处理后进行了目标分割降维，有效降低了传统计算过程中90%以上的计算和存储量，极大降低该算法在轨应用对星载硬件资源的需求。


    3）目标鉴别方法


    遥感图像不同于常规高清图像，具有探测范围广、数据量大以及分辨率相对较低等特点，上述特点也造就了其感兴趣目标稀疏性的特点，对深度学习网络各方面要求较高。传统通用小网络如MobileNetV2参数量达到10
    MB级别，受限于小卫星2 kbit/s级别的遥控上注带宽，仍然无法适用。经过对比分析以及试验，综合考虑实现难易、参数量、计算量以及性能等方面内容，根据任务需求通过自主设计基于深度学习的卷积神经网络YyNet-5作为本目标鉴别算法。YyNet-5是基于Yann
    LeCun在1998年提出的LeNet-5基础进行设计更改完成的，如图13-20所示。YyNet-5共分为1个输入层、2个卷积层，2个池化层、1个全连接层、1个输出层，权重参数规模为5272个，采用单精度浮点数据格式进行计算，参数数据量为20.6
    kB，输入疑似目标切片大小为32×32。综合考虑卫星上注参数规模和智能信息处理模块的计算能力，YyNet-5设计成只对疑似目标做真假性鉴别，便于降低鉴别网络的前向推理计算量。


    上述鉴别器在标准LeNet-5模型基础上修改，根据需要可完成疑似目标真伪鉴别。将相应目标切片进行人工标定，并完成训练，得到模型参数。样本切片图取自GF-3
    SAR遥感卫星图，样本库切片图像如图13-21所示。


    数据集中包含舰船目标切片15 220个，岛屿、海堤/人工建筑目标等目标切片为9593个，随机选取其中20400个样本作为训练集，约占数据集的82.21%，余下4
    413个目标切片作为测试集。网络模型输入切片大小为32×32，若超出可通过降采样的方式保证。


    2.算法优化


    算法在星上在轨实时实现过程中，受限于空间辐照环境、能源、体积、热防护等因素，星载处理平台的硬件资源有限，因此必须对算法进行优化设计，提升能效比，才能满足实际在轨实时处理任务需求。从算法流程中对计算能力要求高的模块入手，优化和简化算法流程，主要包含图像分割中的阈值求取、二值图像连通域标注以及目标鉴别3个算法模块。


    1）阈值求取


    图像分割就是把图像分成若干个特定的、具有独特性质的区域。它是由图像处理到图像分析的关键步骤。OTSU法因有模式识别的相关理论为基础且图像分割性能良好，而逐渐成为一种最为流行的阈值分割技术。OTSU图像分割法因其计算量大，数据动态范围与处理图像大小成正相关，给通过OTSU法求取阈值的实时实现带来较大挑战。


    ![](images/txt017_34.jpg "pagenumber_ebook=292,pagenumber_book=281")


    图13-20　Y yN et-5目标鉴别网络流程框图


    ![](images/txt017_35.jpg "pagenumber_ebook=293,pagenumber_book=282")


    图13-21　样本库切片图像


    目前OTSU计算和优化的方法较多，何志勇等人提出了一个新算法以快速计算OTSU阈值，通过搜寻两类类内均值的平均值整数部分相等的阈值，从中确定一个符合OTSU准则的阈值，减少了计算量，获得了良好的计算实时性能。陈峥等人在对OTSU法进行分析的基础上，提出了一种改进的OTSU图像阈值分割算法。首先，采用整幅图像的平均灰度值作为初始阈值对图像进行分割；其次，推导出OTSU
    4个参数的递推公式；最后，在缩小的灰度级范围内用递推的OTSU法来计算最终的分割阈值，取得了较好的图像分割效果和时间效率。


    当前实现方法主要存在以下问题：一是嵌入式平台实现过程中，无论单纯采用整型或单/双精度浮点数据格式，计算精度高时，计算过程需要占用大量资源，开销极高，系统实时性大打折扣。二是应用场合没有考虑遥感图像大幅宽、低分辨率、感兴趣目标稀疏的特点，因此无法直接应用于遥感图像在轨实时处理中。


    针对以上问题，提出一种图像分割算法的可编程逻辑电路实现方法，解决图像分割算法实时实现在精度高时处理速度慢和硬件开销大的问题，同时消除利用FPGA实现时，处理速度提升和硬件开销降低后，处理精度低的问题。OTSU算法优化实现流程如图13-22所示，采用可编程逻辑电路设计了一种并行流水处理架构，实现了图像分割算法。将阈值求取图像处理成N×N大小的方阵，便于后续通过移位、截位、与非逻辑运算等手段，避免大量乘除运算，大大降低阈值求取算法的计算量，有效优化处理流程。


    ![](images/txt017_36.jpg "pagenumber_ebook=294,pagenumber_book=283")


    图13-22　OTSU算法优化实现流程


    与此同时，在实现过程中将算法作了进一步优化，对原始图像进行降采样处理，可大幅减少运算量。通过处理分析100幅图像大小为4 096× 4 096的量化精度为8bit的SAR图像数据，将上述方法处理得到的阈值结果与原始实现方法采用Matlab双精度浮点数据格式的结果进行对比分析。图13-23为两种方法处理得到的阈值对比图，图13-24为两种方法处理得到的阈值差值图。分析可知，涉及的优化方法在计算量降低16倍的情况下，阈值求取误差可以控制在5以内，对图像分割精度影响可以忽略，证明方法的有效性。通过建立计算精度误差模型，合理选择处理数据类型，自主调度定/浮点计算，在有效降低硬件资源使用的同时，保障了图像分割算法的实时性和精度。


    ![](images/txt017_37.jpg "pagenumber_ebook=295,pagenumber_book=284")


    图13-23　直接降采样求取阈值对比图（书后附彩插）


    ![](images/txt017_38.jpg "pagenumber_ebook=295,pagenumber_book=284")


    图13-24　直接降采样求取阈值差值图（书后附彩插）


    2）连通域标注


    二值连通域标记是数字图像处理的基本方法。它是目标分割、目标识别、图像语义理解等应用的重要基础，是一种经典的计算机视觉处理方法。目前，数字图像的二值连通域标记方法主要分为两种：一种是标号传播方法，如轮廓追迹法、混合对象标记法；另一种是标号等价对处理方法，如优化连通算法、游程优化算法、块决策树算法等。


    标号等价对处理方法的主要过程：将二值图像输入后，按照从左到右、从上到下的顺序，对图像进行逐个像素的扫描，获取游程的起始、结束位置以及等价对。基本流程采用基于游程的方法实现，主要分3步：


    第一步，查找并记录团。逐行搜索示例图像，把每一行中连续的白色像素组成一个序列称为一个团（run），并记下它的团计数num\_run、起点像素列坐标位置start\_run、终点列坐标位置end\_run以及它所在的行坐标位置row\_run。


    如图13-25所示，第一行得到两个团，对应（团，团起始列坐标，团结束列坐标，团行坐标）：（1，2，3，1）和（2，6，6，1）；第二行得到两个团：（3，3，3，2）和（4，5，6，2）；第三行得到1个团：
    （5，4，4，3）；第四行得到3个团：（6，1，2，4），（7，4，4，4）和（8，6，7，4）；第五行得到1个团（9，5，5，5）。全部图像遍历结束后，得到很多个团的位置信息。


    ![](images/txt017_39.jpg "pagenumber_ebook=296,pagenumber_book=285")


    图13-25　查找并记录团过程


    第二步，标记团及生成等价对。对于除了第一行外的所有行里的团，如果它与前一行中的所有团都没有重合区域，则给它一个新的标号；如果它仅与上一行中一个团有重合区域，则将上一行的那个团的标号赋给它；如果它与上一行的两个以上的团有重叠区域，则给当前团赋一个相连团的最小标号，并将上一行的这几个团的标记写入等价对，说明它们属于一类。


    如图13-26所示，第一行记录的两个团标记为1和2；第二行记录的两个团和上一行的团有重叠区域，因此用上一行的团标记，即1和2；第三行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即1，然后将（1，2）写入等价对；第四行记录了3个团，第一个团与上一行没有重叠区域，为标记为3，同理第二个团标记为1，第三个团标记为4；第五行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即1，然后将（1，4）写入等价对。该步处理后，将第一步记录的团号标记得到新标号，同时还得到一个等价对列表。


    ![](images/txt017_40.jpg "pagenumber_ebook=297,pagenumber_book=286")


    图13-26　标记团及生成等价对过程


    第三步，等价对合并及生成最终的标记结果。将等价对转换为等价序列，每一个序列需要给一相同的标号，因为它们都是等价的。从1开始，给每个等价序列一个标号。遍历开始团的标记，查找等价序列，给予它们新的标记。将每个团的标号填入标记图像中，得到最终的标记结果。


    如图13-27所示，将等价对{（1，2），（1，4）}转化为等价列：1→2→4，其中团标记最大数maxlabel为4。如图13-27所示，将1～4个点都看成图的结点，而等价对（1，2）说明结点1与结点2之间有通路，而且形成的图是无向图，即（1，2）其实包含了（2，1）。因此，需要遍历图，找出其中的所有连通图，因而采用图像深入优先遍历的原理，进行等价序列的查找。从结点1开始，它有两个路径1→2，1→4。2和4后面都没有路径，最后只剩下3，它没有在等价对里出现过，所以单独形成一个序列。


    ![](images/txt017_41.jpg "pagenumber_ebook=297,pagenumber_book=286")


    图13-27　等价对遍历图1'
