    12.1.2　分类算法


    目前主流的分类算法既包括决策树、贝叶斯、人工神经网络、k-近邻、支持向量机和基于关联规则的分类等单一的分类方法，同时也包括多种方法组合的集成学习方法，如Bagging和Boosting等。


    1.决策树


    决策树是用于分类和预测的主要技术之一。决策树学习是以实例为基础的归纳学习算法，它着眼于从一组无次序、无规则的实例中推理出以决策树表示的分类规则。构造决策树的目的是找出属性和类别间的关系，用它来预测将来未知类别的记录的类别。它采用自顶向下的递归方式，在决策树的内部节点进行属性的比较，并根据不同属性值判断从该节点向下的分支，在决策树的叶节点得到结论。


    主要的决策树算法有ID3、C4.5（C5.0）、CART、PUBLIC、SLIQ和SPRINT算法等。它们在选择测试属性采用的技术、生成的决策树的结构、剪枝的方法以及时刻、能否处理大数据集等方面都有各自的不同之处。


    决策树的目标是将数据按照对应的类属性进行分类，通过特征属性的选择将不同类别数据集合贴上对应的类别标签，使分类后的数据集纯度最高，而且能够通过选择合适的特征尽量使分类速度最快，减少决策树深度。决策树生成过程一般经过以下3个步骤：


    ①特征选择。该步骤是指从训练数据中众多的特征中选择一个特征作为当前节点的分裂标准。如何选择特征有着很多不同量化评估标准，从而衍生出不同的决策树算法。


    ②决策树生成。该步骤根据选择的特征评估标准，从上至下递归地生成子节点，直到数据集不可分则停止决策树生长。


    ③剪枝。决策树容易过拟合，通常需要剪枝，缩小树结构规模、缓解过拟合。剪枝技术有预剪枝和后剪枝两种。


    2.贝叶斯


    贝叶斯（Bayes）分类算法是一类利用概率统计知识进行分类的算法，如朴素贝叶斯（Naive Bayes）算法。这些算法主要利用Bayes定理来预测一个未知类别的样本属于各个类别的可能性，选择其中可能性最大的一个类别作为该样本的最终类别。由于贝叶斯定理成立的本身需要一个很强的条件独立性假设前提，而此假设在实际情况中经常是不成立的，因而其分类准确性就会下降。为此就出现了许多降低独立性假设的贝叶斯分类算法，如TAN（Tree
    Augmented Naive Bayes）算法，它是在贝叶斯网络结构的基础上增加属性对之间的关联来实现的。


    3.人工神经网络


    人工神经网络（Artificial Neural Networks，ANN）是一种应用类似于大脑神经突触连接的结构进行信息处理的数学模型。在这种模型中，大量的节点（或称“神经元”或“单元”）之间相互连接构成网络，即“神经网络”，以达到处理信息的目的。神经网络通常需要进行训练，训练的过程就是网络进行学习的过程。训练改变了网络节点的连接权的值使其具有分类的功能，经过训练的网络就可用于对象的识别。


    当人工智能领域在20世纪50年代起步的时候，生物学家开始提出简单的数学理论，来解释智力和学习的能力如何产生于大脑神经元之间的信号传递。当时的核心思想一直保留到现在，如果这些细胞之间频繁通信，神经元之间的联系将得到加强。神经学研究表明，人类大脑在接收到外部信号时，不是直接对数据进行处理，而是通过一个多层的网络模型来获取数据的规律。这种层次结构的感知系统使视觉系统需要处理的数据量大大减少，并保留了物体有用的结构信息。由于这些信息的结构一般都很复杂，因此构造深度的机器学习算法去实现一些人类的认知活动是很有必要的。


    美国计算机科学院罗森布拉特（F.Roseblatt）于1957年提出感知器，是神经网络第一个里程碑算法。所谓感知器，是一种用于二分类的线性分类模型，其输入为样本的特征向量，计算这些输入的线性组合，如果输出结果大于某个阈值就输出1，否则输出-1。作为一个线性分类器，感知器有能力解决线性分类问题，也可用于基于模式分类的学习控制中。


    单个神经元的输入输出关系：


    yi\=f(sj)


    式中，f为激活函数；![](images/txt016_5.jpg "pagenumber_ebook=210,pagenumber_book=199")。


    感知器结构如图12-3所示。


    ![](images/txt016_6.jpg "pagenumber_ebook=210,pagenumber_book=199")


    图12-3　感知器结构


    输入向量（Input），即为用来训练感知器的原始数据。


    阶梯函数（Step Function），这可以通过生物上的神经元阈值来理解，当输入向量和权重相乘之后，如果结果大于阈值（如0），则神经元激活（返回1），反之则神经元未激活（返回0）。


    权重（Weight），即感知器通过数据训练，学习到的权向量通过将它和输入向量点乘，把乘积带入阶梯函数后我们可以得到期待的结果。


    由于感知器自身结构的限制，使其应用被限制在一定的范围内，所以在采用感知器解决具体问题时有以下局限性：


    ①由于感知器的激活函数采用阈值函数，输出矢量只能取0或1，所以只能用它来解决简单的分类问题；


    ②感知器是一种线性分类器，在迭代过程中，如果训练数据不是线性可分的，可能导致训练最终无法收敛，最终得不到一个稳定的权重向量。


    感知器只能解决简单的线性分类问题，应用面很窄，但是在人工智能发展中起到了很大推动作用。由于它是第一个神经网络算法，吸引了大量学者对神经网络开展研究，同时感知器也为后期更复杂算法（如深度学习）奠定了基础。'
