    图 13-40　空间碎片目标检测算法流程


    ### (2) 疑似目标提取。

    根据目标特性分析可知，空间目标中心点具有高于背景并且为局部极大值的特性。针对该特性，设定合适的窗并利用图像形态学里的膨胀操作来搜索局部最大值。若局部极值点大于高阈值则认定为疑似强目标点；若高于低阈值但低于高阈值则认定为疑似弱目标点。


    ### (3) 疑似目标确认。

    对提取出的疑似目标点中心，需要判断其是否为目标。以疑似目标中心点为中心，动态设定尺度来确定窗以及核函数大小。对窗内的灰度值进行归一化处理以消除光照变化造成的影响，对归一化后的窗函数以及核函数进行卷积运算，若响应值大于预设阈值并且大于之前尺寸下的计算结果，则更新该点的尺寸以及响应值信息。通过恒星位置以及目标轨迹可以剔除恒星、背景噪声等干扰项，具体实施方法介绍如下。


    #### ①核函数设计。

    相较于直接的二值化处理，设计合适的核函数，能够在保证目标灰度信息的情况下有效地确定目标的中心及边界。从之前的分析可以知道目标呈近似高斯分布，因此针对性地设计核函数，如图
    13-41 所示，具体如式（13-8）所示。


    ![](img/txt017_62.jpg "pagenumber_ebook=312,pagenumber_book=301")


    图 13-41　核函数


    ![](img/txt017_63.jpg "pagenumber_ebook=312,pagenumber_book=301")


    式（13-8）中核函数大小为`M`×`N`，在疑似目标附近选取大小为`M`×`N`的图像块，`σ`为该图像块的标准差；`xcenter = (N+1)/2`；`x
    = 1, 2, …, M`；`y = 1, 2, …, N`。该核函数具有如下特性：一是该核`xcenter = (M+1)/2`函数与高斯分布相近，因此图像与该核函数的卷积即可判断图像与高斯分布的相似性；二是核函数的尺寸由`σ`值确定，即距矩阵中心
    2`σ`内值为负，2`σ`～3`σ`值为正，3`σ`外值为负。


    #### ②恒星目标剔除。

    由于检测到的目标包含目标以及恒星，为了减少后续轨迹匹配的运算量，将历史中出现过疑似目标的位置进行存储，若下一帧图像中的疑似目标在这些位置出现时，则认为是恒星，可将其从检测结果中剔除，如图
    13-42 和图 13-43 所示。


    ![](img/txt017_64.jpg "pagenumber_ebook=313,pagenumber_book=302")


    图 13-42　匹配后的历史信息图（书后附彩插）


    （a）历史信息图；（b）局部放大图


    ![](img/txt017_65.jpg "pagenumber_ebook=313,pagenumber_book=302")


    图 13-43　疑似目标筛选（书后附彩插）


    （a）第`k`帧后更新的`star`图；（b）第（`k+1`）帧中疑似目标


    #### ③目标轨迹关联。

    深空背景图像中除深空背景以外，主要由噪声、天体、航天器及碎片等构成。针对这 3 类目标的运动特性进行分析：噪声在图像中是杂乱无章的，没有固定的运动特性；天体目标距离拍摄器件十分遥远，在图像中的相对位置几乎保持不变；航天器和碎片目标由于其轨道特性，在图像中呈现出接近匀速直线的运动状态。针对需检测的目标与其他两类目标运动特性的不一致，通过多帧图像进行轨迹关联，可以剔除其他两类目标，筛选出需要的目标。


    其运动特性可表示为


    ![](img/txt017_66.jpg "pagenumber_ebook=314,pagenumber_book=303")


    式中，`xi+1`和`yi+1`为下一帧目标的图像像素位置；`xi`和`yi`为目标当前帧的图像像素位置；`Δxk`和`Δyk`为第`k`条轨迹的运动特性，即目标的运动像素距离，同一条轨迹的运动特性基本保持不变。


    轨迹关联示意图如图 13-44 所示。


    ![](img/txt017_67.jpg "pagenumber_ebook=314,pagenumber_book=303")


    图 13-44　轨迹关联示意图


    轨迹关联步骤如下：


    ①目标从第一帧根据预估的速度域在第二帧图像上搜索匹配目标；

    ②第二帧图像上搜索匹配到目标后，计算两帧之间目标的运动特性，并根据运动特性预测目标在第三帧图像的大致范围；

    ③在第三帧图像上的预测位置搜索目标，搜索成功后，将搜索到的目标归入同一轨迹，搜索失败后，转步骤①，直至第二帧图像中无法搜索匹配到目标；

    ④轨迹在后续序列图像中继续搜索匹配目标，如果轨迹关联到多个点，则认为轨迹是真实存在的，否则认为轨迹是误检所形成的。


    ## 3）空间碎片目标在轨监测方法

    天基空间碎片目标监测系统是进行空间目标监视与跟踪的重要发展方向，即利用高精度轨道的天基观测平台结合光学测量手段，根据光学望远镜指向视场中恒星的位置及目标星的实时处理结果，计算出目标天文定位数据。


    天基测量的天文定位不受国土范围、大气层、电离层的影响，而且通过姿态调整可以具备全天时探测优势，可以成为空间目标精密定轨和空间碎片编目定轨的一种有效的数据来源，对于改进空间目标轨道精度，有效节约地面测量资源发挥重要作用。基于天基光学成像的目标检测和天文定位是空间目标发现和测量的重要手段。以空间目标的轨道预报算法和恒星的运动模型为基础，对空间目标天基测量天文定位的算法进行了设计，算法流程如图
    13-45 所示。


