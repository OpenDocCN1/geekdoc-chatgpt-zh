    # 机器学习与深度学习概览


    ## 神经网络与卷积神经网络


    目前，神经网络已有上百种不同的模型，常见的有`BP 网络`、`径向基 RBF 网络`、`Hopfield 网络`、`随机神经网络`（`Boltzmann 机`）、竞争神经网络（`Hamming
    网络`，自组织映射网络）等。但是当前的神经网络仍普遍存在收敛速度慢、计算量大、训练时间长和不可解释等缺点。介绍一个经典的深度学习算法———卷积神经网络（`CNN`）。`CNN`是近年发展起来，并引起广泛重视的一种高效识别方法，它是受生物自然视觉认知机制启发而来。1959
    年，休博尔（Hubel）等人发现，动物视觉皮层细胞负责检测光学信号。受此启发，1980 年福岛邦彦（Kunihiko Fukushima）提出了`CNN`的前身———神经认知机（`Neocognitron`）。20
    世纪 90 年代，Yann LeCun 等人发表论文，设计了一种多层的人工神经网络，取名叫做`LeNet-5`，可以对手写数字做分类。`LeNet-5`确立了`CNN`的现代结构，在每一个降采样层前加入卷积层。在图像识别领域，`CNN`已经成为一种高效的识别方法。


    ## 4. k-近邻


    `k-近邻`（`k-Nearest Neighbors`，`kNN`）算法是一种基于实例的分类方法。该方法就是找出与未知样本`x`距离最近的`k`个训练样本，看这`k`个样本中多数属于哪一类，就把`x`归为那一类。`k-近邻`方法是一种懒惰学习方法，它存放样本，直到需要分类时才进行分类。如果样本集比较复杂，可能会导致很大的计算开销，因此无法应用到实时性很强的场合。


    ## 5. 支持向量机


    支持向量机（`Support Vector Machine`，`SVM`）是由 Cortes 和 Vapnik 于 1995 年首先提出的，是一种基于统计学习的机器学习方法，在小样本分类上也能获得良好统计规律。同时，由于在文本分类中表现出特有的优势，成为当时机器学习领域研究的热点。`SVM`的学习方法主要包括线性可分向量机、线性支持向量机和非线性支持向量机。`SVM`主要思想是建立一个最优决策超平面，使得该平面两侧距平面最近的两类样本之间的距离最大化，从而对分类问题提供良好的泛化能力。将复杂的模式分类问题非线性投射到更高维空间变成线性可分的，因此支持向量机算法在特征空间建立分类平面，可解决非线性可分的问题。其学习策略是间隔最大化，将分类问题转化为一个凸二次规划问题的求解。`SVM`采用核函数技巧将原始特征映射到更高维空间，解决原始低纬空间线性不可分的问题。


    设样本集为（`xi`，`yi`），`xi`∈`R` `n`，`yi`∈`0`，`1`，`i=1,2,…,n`。


    在线性可分的情况下，最优超平面的构建转化成下面最优化问题：


