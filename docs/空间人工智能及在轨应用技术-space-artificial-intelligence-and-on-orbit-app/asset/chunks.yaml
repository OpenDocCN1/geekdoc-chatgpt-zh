    OTSU 阈值求取、连通域标注等传统图像处理方法的实时实现做了大量简化工作。根据 SAR 遥感图像感兴趣目标稀疏性的特点自主设计改进的超轻量疑似目标真伪鉴别网络模型，在当前低功耗的星载嵌入式电路中实现，整个计算电路功耗小于
