    （a）第k帧后更新的star图；（b）第（k+1）帧中疑似目标


    ③目标轨迹关联。深空背景图像中除深空背景以外，主要由噪声、天体、航天器及碎片等构成。针对这3类目标的运动特性进行分析：噪声在图像中是杂乱无章的，没有固定的运动特性；天体目标距离拍摄器件十分遥远，在图像中的相对位置几乎保持不变；航天器和碎片目标由于其轨道特性，在图像中呈现出接近匀速直线的运动状态。针对需检测的目标与其他两类目标运动特性的不一致，通过多帧图像进行轨迹关联，可以剔除其他两类目标，筛选出需要的目标。


    其运动特性可表示为


    ![](images/txt017_66.jpg "pagenumber_ebook=314,pagenumber_book=303")


    式中，xi+1和yi+1为下一帧目标的图像像素位置；xi和yi为目标当前帧的图像像素位置；Δxk和Δyk为第k条轨迹的运动特性，即目标的运动像素距离，同一条轨迹的运动特性基本保持不变。


    轨迹关联示意图如图13-44所示。


    ![](images/txt017_67.jpg "pagenumber_ebook=314,pagenumber_book=303")


    图13-44　轨迹关联示意图


    轨迹关联步骤如下：


    ①目标从第一帧根据预估的速度域在第二帧图像上搜索匹配目标；


    ②第二帧图像上搜索匹配到目标后，计算两帧之间目标的运动特性，并根据运动特性预测目标在第三帧图像的大致范围；


    ③在第三帧图像上的预测位置搜索目标，搜索成功后，将搜索到的目标归入同一轨迹，搜索失败后，转步骤①，直至第二帧图像中无法搜索匹配到目标；


    ④轨迹在后续序列图像中继续搜索匹配目标，如果轨迹关联到多个点，则认为轨迹是真实存在的，否则认为轨迹是误检所形成的。


    3）空间碎片目标在轨监测方法


    天基空间碎片目标监测系统是进行空间目标监视与跟踪的重要发展方向，即利用高精度轨道的天基观测平台结合光学测量手段，根据光学望远镜指向视场中恒星的位置及目标星的实时处理结果，计算出目标天文定位数据。


    天基测量的天文定位不受国土范围、大气层、电离层的影响，而且通过姿态调整可以具备全天时探测优势，可以成为空间目标精密定轨和空间碎片编目定轨的一种有效的数据来源，对于改进空间目标轨道精度，有效节约地面测量资源发挥重要作用。基于天基光学成像的目标检测和天文定位是空间目标发现和测量的重要手段。以空间目标的轨道预报算法和恒星的运动模型为基础，对空间目标天基测量天文定位的算法进行了设计，算法流程如图13-45所示。


