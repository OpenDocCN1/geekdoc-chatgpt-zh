- raw: "②无效数据量大，资源浪费严重。一方面，观测目标周围的环境导致无效数据量大，如大量的光学观测数据存在云层遮蔽情况。据统计，当前民用遥感卫星的有效数据只占到下行数据的30%～40%，军用遥感卫星的有效数据只占到20%～30%。这些无效数据占用了大量的数据传输和处理资源，同时造成观测成功率很低，尤其是在灾害、应急任务需求面前，矛盾显得更为突出。另一方面，考虑到卫星轨道预报和姿控误差，地面任务管控为保证目标点能够被完全覆盖，往往会以目标点为中心前后扩展成像，产生较多无效观测数据。\n\
    \n通过星上自主任务规划和智能化信息处理一方面能够根据实时的轨道、姿态和载荷状态信息，精确缩减控制成像时间，而另一方面能够综合利用“云判”、大气环境等信息，灵活自主地规划观测时机和观测角度，调整或放弃云层遮蔽的目标任务，重新选择成像条件更好的目标进行观测，提升观测效率。\n\
    \n6.2　应急突发事件快速响应需求\n\n目前，遥感卫星地面系统主要包括运控部门、测控部门和地面数据接收部门等，而每个部门在业务流程中担任不同的角色，完成从任务提出、任务规划、指令生成、指令上注、运行监视、数据接收存储、图像生成、情报产生、态势融合评估的全过程，接口复杂，条块分割现象明显。从时效性上来说，计划提出为分钟级，计划制定需要小时级，而从任务执行到最终产生信息更是需要3\
    \ h以上，无法满足应急突发事件的快速响应需求。\n\n通过星上自主任务规划和智能化信息处理一方面能够实时检测、识别地面突发事件，同时判读云层遮挡等气象环境影响因素，灵活自主地规划选择观测时机和观测角度，提高应急任务的观测成功率，而另一方面能够对观测数据进行快速处理和下传分发，实现对应急突发事件的快速响应。\n\
    \n6.3　复杂应用需求推动下多星协同需求\n\n经过三十多年发展，我国已成功研制出一系列天基传感器，组成了风云、海洋、资源和环境减灾以及军事侦察等系列卫星对地观测系统。随着我国高分辨率对地观测系统重大专项的深入推进，以及人工智能技术、数据融合技术的迅速发展，将多类型、多分辨率的图像数据进行比对、融合，可以获得更准确和丰富的信息，扩展系统的时间、空间覆盖范围，提高信息的精度和可信度，增强对目标物的检测和识别能力。\n\
    \n因此，多星协同观测成为对地观测未来的发展趋势。面对日益复杂和高时效性的遥感应用需求，使用不同类型的卫星相互协同进行观测，将大幅度提升观测资源使用效率，准确有效、快速及时地获取多种空间分辨率、时间分辨率和光谱分辨率的对地观测数据。\n\
    \n未来随着高分辨率对地观测系统的进一步发展完善，传统以地面为主的卫星应用模式已经无法满足日益复杂和高时效性的观测应用需求。因此，利用大规模星座组网，采用网络化群体自主协同和在轨智能化信息处理技术，能够将重要目标重访时间缩短至分钟级，并极大拓展目标及区域的目标发现、识别能力，实现对感兴趣区域及目标的高频次、高分辨率、全方位、多手段综合侦察。\n\
    \n6.4　航天遥感信息高效实时分发需求\n\n从信息提取方式上来看，现有的遥感信息提取方法往往采用人工识别、手动标绘，耗费大量的时间，效率非常低。在海湾战争中，美军的各种侦察卫星每天都能获取大量的遥感图像。这些图像通过通信卫星实时地传送到美国本土的“华盛顿国家图像判读中心”进行分析。但在这里，一帧原始图像经过各个环节的处理形成有价值的军事情报却需要1.5\
    \ h，有60%的遥感图像因为无法及时分析而丧失了情报价值，白白浪费掉了。遥感图像判读和情报整编方面的工作方式主要集中在目视、定性、经验判读等，这在很大程度上阻碍了对各类事件的及时发现、识别和确认，导致海量图像数据无法快速转化为有价值的情报信息，大大降低了遥感图像的利用率和卫星侦察情报的时效性，直接导致卫星的使用价值大打折扣。\n\
    \n从卫星能力上来看，卫星资源配置越来越高，星地数据传输速率已优于4×1.5 Gbit/s，星载存储容量将大于32 TB；但据公开资料统计，美国Worldview和Quick\
    \ bird卫星每日采集的10000 GB的数据中，真正有重要价值的图像数据量仅占34.2%，由此造成高价值投资的星上存储和传输资源被无效数据大量浪费，难以充分、合理地发挥作用，同时也间接推高了卫星研制成本，增加了研制复杂度。\n\
    \n通过在轨智能压缩、感兴趣目标提取处理能有效降低数据率。例如，基于云判处理的可变压缩比处理后，数据率可降低50%，在轨目标检测结果下传，只传输目标图像和位置，可将数据量减少为1/1\
    \ 000，大大降低数据传输系统压力。另外，传统方式的星上数据获取，地面处理、分发过程，从卫星拍摄图像需要延迟小时级，用户才能得到有用信息。但是，在轨实时处理后，结果可以直接分发到最终用户，用户获取到有用图像延迟是分钟级，完全可以满足直接支持应用（分钟级）等高时效要求。\n\
    \n6.5　用户使用体验提升需求\n\n现有卫星管控完全依靠地面，采用基于时间标记的控制指令模式进行任务规划，根据用户需求预先计算好一系列与卫星执行任务相关的参数，并编制成指令序列，上注卫星执行。\n\
    \n这种指令控制模式的缺点：\n\n①需要地面操作人员了解不同卫星的操作细节及载荷使用方法，在实际应用过程中，还经常需要与卫星研制方对指令及参数进行校对确认，过程烦琐。同时，操控的复杂性对卫星的可靠性和安全性构成隐患。随着我国在轨卫星数量的增加，这一弊端尤为突出。\n\
    \n②这种指令控制模式产生的指令数据量较大。由于我国测控网能力限制，多数航天器测控弧段资源有限（10 min左右），这种管控模式将大大制约航天器效能的发挥。\n\
    \n③现有卫星的使用都是由专业的地面支持部门来执行的，其本身不是直接用户（如各军兵种），只是代理直接用户来使用卫星，后续随着卫星数量的增加、应用范围的扩展，卫星需要提供面向直接用户的支持，具备随时随地接受用户定制任务的能力。\n\
    \n因此，现有的卫星管控方式亟待改进，这就需要大幅减轻地面的工作量、复杂度和成本，需要在星上处理、星上自主任务规划等方面开展大量工作，最终要做到在星上具备自主任务管理能力后，卫星可以随时随地接受用户定制任务，由卫星自主决策、自主协同完成任务，并将结果传至地面，为用户提供灵活、连续稳定服务的同时减少地面用户的负担，提升卫星使用体验。\n\
    \n综合上述需求，开展遥感卫星空间人工智能及在轨应用技术的研究对于发挥未来天基信息系统的任务效能、提升面向直接用户的服务质量具有重要意义。\n\n\uFEFF\
    \n\n第7章　深空探测领域需求\n\n深空探测是人类了解地球、太阳系和宇宙，进而考察、勘探和定居太阳系其他天体的第一步。深空探测主要包括月球探测、行星探测、行星际探测和星际探测等。通过深空探测，可以帮助人类研究太阳系及宇宙的起源、演变和现状，进一步认识地球环境的形成和演变，认识空间现象和地球自然系统之间的关系。从现实和长远来看，深空探测和开发具有十分重要的科学和经济意义。\n\
    \n但在深空探测中，探测器与地球的距离带来许多智能自主需求，主要体现在以下方面：一是远距离、长时延通信，需实现自主健康管理、自主路径规划和操作及自主决策；二是飞行、使用环境未知，需实现智能目标感知及识别；三是能源、算力有限，需通过软硬件定制和任务适应性设计实现人工智能应用。对于深空探测来说，空间人工智能及在轨应用技术是必需的。\n\
    \n下面分别从操作费用、任务可靠性、通信网络和实时性的需求方面分析采用空间人工智能及在轨应用技术实现探测器自主能力的必要性。\n\n7.1　操作费用需求\n\
    \n从操作费用方面来考虑，在传统的探测器操作过程中，地面工作人员承担着大量的工作，其中包括活动规划、产生探测器的执行序列、跟踪探测器内部硬件状态、保证序列正确地工作、故障时的恢复等。同时，深空探测任务周期通常是2～5年，这么长的时间内需要大量的人力和财力投入到这一工作中。\n\
    \n智能自主技术在深空探测领域中的应用可以在很大程度上减少探测器任务的操作费用。这是因为探测器具有其自身的智能，可以自主地产生目标、自动地决策，然后再自动地去执行，并不需要地面工作人员长时间的干预，这大大减少了地面操作人员的劳动量。同时，地面与探测器的通信采用抽象的指令，这使地面工作人员可以很方便地改变和修改任务。即使在探测器故障的情况下，探测器自己也能够完成故障的诊断、分离和修复工作，并不需要像传统方式一样进入安全模式，等待地面工作人员规划一个详细的挽救序列。\n\
    \n7.2　任务可靠性需求\n\n从任务可靠性方面来考虑，深空探测任务的费用都非常高，因而要求深空探测器在整个探测过程中应具有高度的可靠性。虽然高的可靠性可以通过使用高性能和高可靠性的硬件来达到，但是在深空复杂的环境中，许多情况是不确定和不可预知的，硬件的故障也是不可避免的。\n\
    \n智能探测器应能实时对探测器中各个部件出现的故障进行监测，并能迅速地做出反应，对其进行判断，产生修复策略，这比传统的探测器操作具有更大的鲁棒性，从而提高了探测器的可靠性。\n\
    \n7.3　通信网络需求\n\n从对深空通信网络的需求方面来考虑，深空探测中通信是一个非常关键的部分，它不仅要将地面工作人员的命令传送给探测器，还负责将探测器所得到的科学数据传送给地面。随着距离的增大，需要越来越大的地面通信站来完成此功能。在传统的方法中，地面工作人员将制定好的非常详细的命令发送到深空探测器上，这需要占用很多资源和带宽。因此，弱通信条件下，需提升深空探测器自主管理能力。\n\
    \n在采用自主控制的深空探测器中，地面发送给探测器的只是非常抽象的命令，仅告诉了探测器做什么，而不是怎么做，这大大地减少了通信量。同时，智能探测器还对需要下传的科学数据做初步的处理（抛弃一些坏数据，对数据进行合理的压缩等），然后再传送到地面，这也减少了对通信网络的需求。\n\
    \n7.4　实时性需求\n\n从探测器的实时性方面来考虑，在传统探测器操作中，当遇到环境的变化或遇到故障时，都需要等待地面工作人员参与决策，做出决定并产生详细的操作序列，受时间延迟的影响，这往往造成了探测器实时性比较差的缺点，从而浪费了许多有利的机会。\n\
    \n在智能探测器中，自主管理系统可以根据周围的环境和探测器内部状态的变化，自主做出相应的决定，而不需等待地面的干预。这使探测器可以非常实时地进行工作，抓住那些有利的稍纵即逝的机会（特别是在与小行星或彗星交会或绕飞的时候）。另外，自主管理系统中的智能执行模块采用多线程并行的执行方法，很好地适应了探测器各个子系统的并发性，提高了探测器系统的实时性。因此，在环境未知的情况下，需提升深空探测器的智能感知能力。\n\
    \n7.5　面临的挑战\n\n人工智能技术在近十年来取得了突飞猛进的发展，主要包括以下两个原因：\n\n①储存多结构数据的效率得到了极大提升，如文件数据、图像数据、视频数据、音频数据等。\n\
    \n②数据处理速度得到了极大提高。训练一个成熟的人工智能网络需要极大的运算量，而随着更快的计算单元（GPU、FPGA等）、更快的储存技术（SSDs/NVMe，NVMe-over-Fabric等）以及更快的网络传输速度等技术的发展，极大减少了人工智能模型的训练时间。\n\
    \n目前，人工智能技术已部分应用于深空探测中，并取得了一定成效，包括从火星表面地势探测，到处理分析巨型射电望远镜获取的深空探测数据用以寻找适合人类居住的第二个星球等。但和地面人工智能技术应用相比，仍存在较大差距，主要包括以下几个方面：\n\
    \n①星上计算、存储资源受限问题。外太空环境复杂，具有温度变化大、强辐射等特性，其对星上处理器、存储器的要求高。目前，宇航级芯片普遍存在存储容量小、计算速度低等问题，因此将需要大数据量、高速计算支撑的人工智能技术应用到深空探测中，首先要解决星上计算、存储资源受限问题。\n\
    \n②恶劣空间环境影响问题。外太空环境复杂，如单粒子会影响处理器性能，从而影响数据的正确性或算法的有效性，而人工智能技术对数据和算法的依赖较大。因此，要解决恶劣空间环境下，人工智能技术应用的可靠性问题。\n\
    \n③数据样本少和不均衡问题。人工智能技术在应用过程中需要基于获取的数据样本进行模型训练，从而可以对未知事件进行推理预测。对于深空探测，目前发射的深空探测器数目少，获取的数据样本少且不均衡。例如，在自主健康管理方面，多数样本是无故障样本，极个别样本是有故障样本，样本严重不均衡。因此，将人工智能技术应用于深空探测中需要解决数据样本少且不均衡问题。\n\
    \n④人工智能技术与空间其他技术结合问题。地面人工智能技术快速发展，相关技术已逐步落地，但在人工智能技术与空间技术相结合方面的研究仍较少。因此，需要针对目前深空探测中面临的问题，基于相关空间技术的发展状况，找到人工智能技术与其的结合点。\n\
    \n\uFEFF\n\n第8章　载人航天领域需求\n\n在载人航天的人-人工智能系统中，航天员与人工智能构成一个相辅相成的智能体系，共同执行航天任务。其中，航天员处于主导地位，负责对系统中各种人工智能的监视、控制和管理，同时完成人工智能所不能胜任的机动性或随机性强的航天和科学实验任务，充分发挥人的能动性和创造性。人工智能则执行程序性的、危险性较大的以及高成本的任务。\n\
    \n这种分工模式的主要特点是取长补短、相辅相成，因而有利于组成一个更为安全、经济的高效智能系统。\n\n8.1　顶层需求\n\n载人航天的终极目标是拓展人类生存空间，使人类可以在宇宙空间中永久自由生活。为了实现上述目标，载人航天需要分阶段逐步推进：\n\
    \n①进入宇宙。解决人类在宇宙空间中长期驻留问题。建立空间站、外星球基地，在依托地球支援的条件下，使人类获得长时间在宇宙空间工作生活的条件。\n\n②开发宇宙。获得开发利用宇宙空间资源的能力。探明可到达的宇宙空间存在的物质、能量资源，依托地球支援，为空间站、外星球基地的运行和人类生存条件提供支持，以及向地球提供资源。\n\
    \n③驾驭宇宙。使人类具备在宇宙空间永久生存的条件。充分利用各种宇宙空间的物质、能量资源，在不依赖地球支援的条件下，维持人类社会的存在，达到使人类可以在宇宙空间中永久自由生活的终极目标，将人类的生存空间扩展到宇宙。\n\
    \n由于人类是一种适应地球生存条件的生物，在宇宙空间构建人类生存条件需要耗费巨大资源，因此在宇宙空间活动的人员数量受到可获得资源制约。减少操作人员需求及减轻人员工作负担压力，是载人航天活动中一项重要因素，而充分使用人工智能技术，构建无人化的智能设施，是提高载人航天活动效率及可行性的有效措施。\n\
    \n在载人航天活动中，智能化无人系统与载人航天并不矛盾，两者的关系类似无人自动驾驶汽车与乘客之间的关系：借助智能化无人系统技术，乘客无须再为驾驶花费精力，可以将精力集中在更重要的自身事务上。人类进入宇宙的目的，不是去充当平台操作员，从事本可以由自动化技术完成的工作，而是指挥监控智能化无人系统正确高效完成任务，实现其工作生活等生存目标。\n\
    \n8.2　应用需求\n\n在载人航天系统中，空间人工智能及在轨应用技术具有广泛的用武之地，如舱内环境的检测和控制，导航与控制，以及航天员作息制度、工作程序的控制和调节、航天员健康数据管理和医学对策等。利用空间人工智能及在轨应用技术可以将工程专家和航天医学专家的知识和经验经过系统化、条理化后带到天上去，从而增强各种自控系统的智能性，提高航天员管理的科学性和灵活性。\n\
    \n在航天人工智能系统中，技术复杂性和难度最大的是具有多种感知能力、分析判断能力、灵活运动能力和与航天员信息交换能力的机器人系统，它将是替代航天员执行出舱活动的主要工具。同时，这个系统必须具有低能耗的特点，或具有自我补充能量的能力，以满足远程探测的需求。此外，还需要具有分析判断、自我学习和随机解决问题能力的高级智能管理系统。\n\
    \n在载人航天中机器人主要执行出舱活动，不管是在近地轨道还是在月球或火星地面站，都需要机器人代替航天员完成出舱探索、维修或样品收集任务。航天机器人可以仿效具有人类认知功能的机器人系统，但应当根据特定任务的需要突出其特定功能。例如，在月球或火星表面进行探索和样品收集的机器人就应当具有很强的视觉感知、空间记忆、物体辨别和运动功能，而且最好具有对化学物质敏感的嗅觉功能。因此，它应当具有复杂的模式识别、分析判断能力，并能够与基地中航天员进行信息交流。机器人在航天中的采用，将会大大减小由航天员亲自出舱带来的风险和保障成本，因而在未来载人航天中具有非常广阔的应用前景。\n\
    \n当然，航天中人工智能系统不仅要考虑其功能的完善性，更要注重其运行可靠性。因此，发展的方略应当是在可靠的基础上由简单到复杂地逐步进化，最终发展为以航天员为核心的智能性很强的、能完成各种航天任务的人工智能系统。这种技术的发展不仅使载人航天出现一个崭新的局面，还必然会促进地面人工智能理论和技术以及人类智能研究的发展。\n\
    \n下面分别从近期、中期及远期3个阶段分析空间人工智能及在轨应用技术在载人航天领域的应用需求。\n\n1.近期需求分析\n\n2017年4月22日，天宫二号与天舟一号对接形成组合体，顺利完成我国首次载人航天器推进剂在轨补加，使我国成为继俄罗斯之后第二个掌握并应用推进剂在轨补加技术的国家，标志着中国载人航天工程第二步工程目标全部完成，验证了空间站建造关键技术，载人航天工程顺利转入第三步空间站阶段。\n\
    \n2022年11月3日，随着中国空间站梦天实验舱顺利完成转位，天和核心舱、问天实验舱与其相拥形成T字基本构型，标志着中国空间站全面建成。后续将依托空间机械臂等基础设施开展空间应用和在轨服务，并进一步扩大空间应用试验规模、开展空间站运营和维护，并考虑延寿。\n\
    \n2.中期需求分析\n\n载人登月是我国未来载人深空探测的第一步，是我国开展更远深空探测活动前不可或缺的重要一环。通过该任务，我国可以演练进入更远的深空，并且停留更长时间，直至真正掌握在地球以外的太阳系空间内生存所需要的各项技术。\n\
    \n载人登月是中国人首次载人登陆地外天体，是一项建设创新型国家的重大战略性、标志性科技工程，是我国航天事业和科学技术发展的新里程碑。空间人工智能及在轨应用技术将成为载人登月目标实现的核心关键。\n\
    \n3.远景需求分析\n\n1）地外行星基地建设的需求\n\n随着我国经济的快速发展，煤炭、石油、土地等不可再生资源日益枯竭，为了支持资源节约型、环境友好型社会的建设，需要加强能源开发和资源合理利用。与此同时，从长远来看，地球资源终将枯竭，人类必须拓展生存与发展空间，发挥空间技术的优势，通过建立深空基地，深度开发利用外太空资源。\n\
    \n2）实施载人登火星的需求\n\n火星是太阳系中距离地球最近的大行星之一，大小与地球相近，具有稀薄的大气存在，演化历史与地球非常相似，是太阳系中除地球以外最可能存在生命的地方，对于探索宇宙和生命起源而言，具有极其重要的科学意义。与此同时，火星是人类建设地外文明的首选目的地。在太阳系中，火星的气候环境与地球最为接近，同时存在生产能源和建筑材料的原位资源，并存在生命维持不可缺少的水资源，完全有可能实现人类在火星的生存与工作生活。\n\
    \n8.3　空间站典型需求\n\n1.空间站智能任务规划需求\n\n飞行任务规划是影响空间站使用效能的主要因素之一。在传统的任务规划和测控方式中，地面规划人员通过不断编写和修改发送给航天器的指令序列，使其执行相应的任务。空间站系统组成复杂，任务众多，提高飞行任务规划智能化水平，不仅可以有效提高空间站的使用效率，而且可以进一步保障空间站运行安全，具有重要应用意义。"
