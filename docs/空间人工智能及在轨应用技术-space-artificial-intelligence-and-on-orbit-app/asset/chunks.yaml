    3 章空间智能感知与控制发展状况、第 4 章空间智能人机交互发展状况、第 5 章空间智能组网及协同发展状况；第三部分为空间人工智能及在轨应用技术需求，包含第
    6 章对地观测领域需求、第 7 章深空探测领域需求、第 8 章载人航天领域需求、第 9 章通信与导航领域需求、第 10 章共性需求；第四部分为空间人工智能及在轨应用技术研究，包含第
    11 章基础技术、第 12 章共性技术、第 13 章应用技术；第五部分为结束语，包含第 14 章空间人工智能及在轨应用的挑战和重点发展方向。

    本书的第一部分、第三部分、第四部分、第五部分由中国空间技术研究院李宗凌编写；第二部分第 2 章由中国空间技术研究院刘红笛编写；第二部分第 3 章由中国空间技术研究院张文萱编写；第二部分第
    4 章由中国空间技术研究院王丙昊编写；第二部分第 5 章由中国空间技术研究院栾申申编写。全书的统稿校对工作由中国空间技术研究院李宗凌负责完成。

    本书在撰写过程中获得多位顶级专家、学者以及团队的指导。在此，感谢中国航天科技集团有限公司于登云院士，正因为有于院士对本书的架构设计和不遗余力的指导，才使得本书具有清晰的脉络和流畅的成文；感谢北京理工大学龙腾院士以及赵保军教授对作者在北京理工大学学习、研究工作的指导；感谢中国空间技术研究院周志成院士对作者的工作指导；感谢中国空间技术研究院汪路元研究员、宋桂萍研究员、禹霁阳研究员、程博文、郝梁、蒋帅等领导、同事在平时研究工作的帮助指导；感谢中国空间技术研究院科技委、中国空间技术研究院情报研究工作，本书的部分研究内容借鉴了其研究成果；本书的研究工作获得了自然科学重点基金项目（U22B2014）的支持；其他对本书撰写有帮助的同行专家，在此一并感谢。

    由于编者水平有限，书中恐有不当之处，敬请读者批评指正。

    李宗凌

