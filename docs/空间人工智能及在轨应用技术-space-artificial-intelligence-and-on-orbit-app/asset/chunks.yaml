    图12-28　加速器与Matlab目标分类置信度差值分布图


    4.深度学习通用加速器架构设计


    上述加速器主要针对VGG及以VGG为基础的后续系列的深度学习网络模型，是一个相对通用的加速器。人工智能技术处于一个高速发展时期，各种网络层出不穷，也是各有特点。因此，设计针对深度学习的通用加速器将会很有必要。


    如图12-29所示，针对深度学习网络模型的特点，归纳总结深度学习推理网络的基本运算方式，设计了一种通用加速器架构，可完成多种网络加速。该加速器采用SoC处理架构，主要由CPU和加速器组成，可通过多种高速串行总线实现互联，扩展能力突出。'
