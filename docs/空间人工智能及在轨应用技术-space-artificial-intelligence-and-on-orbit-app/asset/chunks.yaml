    # LeNet 卷积网络比特级别压缩


    `Lenet`卷积网络的比特级别压缩是局部的操作，分别从索引量化和权值量化两个方面来进行实验。


    ## 索引量化

    ①在索引量化的过程中，需要根据不同的网络层来确定各自的量化比特数。对于卷积层而言，网络的稀疏性较弱，可以采用比较少的比特来进行量化；对于全连接层来说，参数的压缩使得网络结构异常稀疏，在量化时要用较多的比特来进行量化，否则会产生填充零过多的情况，影响压缩效率。


    ## 权值量化

    ②在权值量化的过程中，同样也需要根据不同的网络层来确定各自的量化比特数。对于卷积层而言，由于权值的大小对于特征提取影响很大，所以要尽可能保证卷积层的权值不变，就要用较多的比特来对卷积层进行权值量化，减少对于网络精度的影响；对于全连接层而言，权值大小仅仅意味着分类情况，相对于卷积层而言，全连接层的权重不是很敏感，所以可以用较少的比特来对全连接层进行权值量化。


    ## 量化实验结果

    ③对于量化权值和量化索引，在`Lenet`卷积神经网络上进行了不同比特的尝试。在量化索引过程中，采用5比特来量化卷积神经网络和全连接层；在量化权值的过程中，采用8比特来量化卷积层，5比特来量化全连接层可以达到最好的压缩效率。


    ## 编码策略研究

    拟采用霍夫曼编码，它是一种可变字长编码方法。该方法完全依据字符出现概率来构造异字头的平均长度最短的码字，有时称之为最佳编码。自`Huffman`于1952年提出该编码以后，被广泛应用于通信和计算机领域。霍夫曼编码的具体方法：先按出现的概率大小排队，把两个最小的概率相加，作为新的概率和剩余的概率重新排队，再把最小的两个概率相加，再重新排队，直到最后变成1。每次相加时都将“0”和“1”赋予相加的两个概率，读出时由该符号开始一直走到最后的“1”，将路线上所遇到的“0”和“1”按最低位到最高位的顺序排好，就是该符号的霍夫曼编码。实验表明，霍夫曼编码对于非均匀分布源，可以压缩至原存储量的20%～30%。


    通过霍夫曼编码，在`Lenet-5`卷积神经网络上进行了多层次压缩，记录实验中产生的压缩情况，如表12-8所示。


    表12-8　多层次压缩数据记录


    ![](images/txt016_31.jpg "pagenumber_ebook=242,pagenumber_book=231")


    由表12-8可以看出，经过多层次的压缩，网络的尺寸已经压缩到原来的2.46%，实现了40倍的压缩，并且在压缩过程中没有产生额外的精度误差。


    # 12.2.3 模型加速


    深度卷积神经网络（`CNN`）模型在目标分类、识别、视频分析以及自然语言处理等方面应用越来越广泛。


    `CNN`是一种高度并行的混联网络结构，尤其是近年来流行的深度网络，采用`CPU`计算往往会导致频繁的数据交互和相同数据的多次搬移，很难提高计算效率。利用`GPU`实现`CNN`，有编程简单、运行速度快等优点，但存在功耗过高、散热困难等问题。例如，`NVIDIA
    GTX-1080 Ti GPU`虽具有向量数据搬移操作，在内部计算过程中具备上千个节点对数据进行并行计算，但这一过程占用了巨额的硬件资源，同时也耗费了大量的能量功耗，峰值功耗达到250
    W。`Cambrion-X`加速处理器，在处理过程中的输入输出结果必须经由`MLU`模块，并通过对译码过程不同指令类型的判断，完成选通输入输出操作，这种加速方式通过多个模块的并行操作，并结合`Hot
    Buffer`及`Cold Buffer`减少或同化相同参数和操作的卷积计算，必然影响处理器计算效率。北京深鉴科技有限公司设计的AI处理器具有硬件资源可变的特点，借助于`DPU`节点，通过编译器优化计算流程，压缩参数，降低计算量，但这种功能必须有相应的程序结构进行配套执行才能达到最优速度，而在实际深度卷积计算过程，中间计算过程数据常常被其他进程调用，很难对所有复杂卷积网络形成实际优化。


    此外，当前商用`GPU`计算机及微处理器均是基于对并行寄存器的计算处理，针对深度卷积网络的加速算法实施，只能依靠多个计算单元的并行计算完成，且核心技术都掌握在国外大公司手中。例如，Google公司推出的`TPU`处理器，性能优越，但仅限于内部使用，不对外供货。由此可知，现有商用处理器无法满足星上应用需求，设计基于多并行计算和存储架构的`CNN`加速器，已经成为当前嵌入式、小型化研制过程的迫切需要。


    ## 应用背景与挑战

    现有的深度学习网络加速计算主要从3个工程实现角度来进行优化：第一，减少量化位宽，以牺牲计算结果精度来减少硬件资源的占用，通过降低量化位宽到8位，提高设计的最大可执行频率，降低芯片面积的占用；第二，建立多级缓存机制，结合内外部缓存，分配计算过程中“冷”“热”参数和计算过程，提高缓存使用效率；第三，通过统计或简单判别的方式，减少零值参数或无效参数的访问和计算，提高计算单元的处理效率。


    当前常用处理位宽设计集中在2～8 bits，单纯降低位宽会造成计算精度的大幅下降，而位宽的选择与网络应用需求有关。多级缓存的设计，往往需要考虑片内、片外缓存，网络卷积核大小及层间并行度情况，很难形成统一的设计模式。零值和无效数值计算的跳过，虽然能够降低计算次数，但在设计过程容易造成控制电路部分的复杂化。


    ## 设计需求与网络选型

    在`CNN`硬件加速设计过程中，需要从系统架构、位宽、存储和内部总线进行整体考虑，在减少各计算、存储模块交互传输的基础上，提高计算的并行度。同时，对`CNN`模型结构进行基本的研究，重点分析网络并行结构和多层次缓存实现方式，设计一种运算效率高、占用资源少、通用性强、高能效比的`CNN`模型前向传播的加速器，并通过实现两种存储资源复用度差异巨大的加速器对比分析，关注数据重用是提升加速器能效比的关键因素。


    `VGG`强大的特征提取以及分类精度能力能够满足时敏目标图像分类识别的需求。同时，考虑到当前流行的`SSD`、`YOLO`、`MobileNet`等系列网络，或多或少都是基于`VGG`网络而来。因此，从有效性、适用性来讲，选用`VGG`系列网络作为深度学习加速器的基本网络模型。


    ### 1. 总体架构设计

    通过分析得出`CNN`硬件加速器设计需通过多并行计算和多层次缓存实现。加速器总体架构如图12-14所示，包含数据输入单元、数据控制单元、计算单元、存储单元、数据输出单元以及状态控制单元。该加速器架构充分结合了网络模型的前向推导运算特点，并保证计算单元与存储单元数据吞吐能力达到平衡，能够实现并行流水处理。


