    ## 图 11-9 专用异构处理单元设计框图


    DSP 模块选用高性能多核 DSP 芯片，每片 DSP 内部包含 8 个 DSP 处理核心，外扩 4 片 8GB 容量的 DDR3 SDRAM 芯片进行数据缓存。DSP
    具有密集计算能力强、易于编程实现等优点，主要配合 AI 加速芯片完成感兴趣目标检测以及配合 FPGA 完成感兴趣区域提取功能。


