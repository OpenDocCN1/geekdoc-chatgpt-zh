    ## 12.1.6 迁移学习算法


    针对源领域和目标领域样本是否标注以及任务是否相同，可以把以往迁移学习工作划分为归纳迁移学习、直推式迁移学习和无监督迁移学习等。按照迁移学习方法采用的技术划分，又可以把迁移学习方法大体上分为基于特征选择的迁移学习算法研究、基于特征映射的迁移学习算法研究和基于权重的迁移学习算法研究。


    ### 1.迁移学习的基本思想


    迁移学习最早来源于教育心理学，这里借用美国心理学家 Judd 提出的“类化说”学习迁移理论来讨论目前机器学习领域迁移学习研究还存在的 3 个问题。


    首先，Judd 认为在先期学习 A 中获得的东西，之所以能迁移到后期学习 B 中，是因为在学习时获得了一般原理，这种原理可以部分或全部运用于 A、B 之中。根据这一理论，两个学习活动之间存在的共同要素，是产生迁移的必要前提。这也就是说，想从源领域中学习知识并运用到目标领域中，必须保证源领域与目标领域有共同的知识，那么如何度量这两个领域的相似性与共同性是问题之一。


    其次，Judd 的研究表明，知识的迁移是存在的，只要一个人对他的经验、知识进行了概括，那么从一种情境到另一种情境的迁移是可能的。知识概括化的程度越高，迁移的范围和可能性越大。把该原则运用到课堂上，同样的教材采用不同的教学方法，产生的迁移效果是不一样的，既可能产生积极迁移也可能产生相反的作用。也就是说，同样的教材内容，由于教学方法不同，而使教学效果大为悬殊，迁移的效应也大不相同。因此，针对不同的学习问题，研究有效的迁移学习算法也是另一个重要问题。


    最后，根据 Judd 的泛化理论，重要的是在讲授教材时要鼓励学生对核心的基本概念进行抽象或概括。抽象与概括的学习方法是最重要的方法，在学习时对知识进行思维加工，区别本质的和非本质的属性，偶然的和必然的联系，舍弃那些偶然的、非本质的东西，牢牢把握那些必然的、本质的东西。这种学习方法能使学生的认识从低级的感性阶段上升到高级的理性阶段，从而实现更广泛、更成功的正向迁移。也就是说，在迁移学习的过程中，应该避免把非本质的、偶然的知识，当成本质的（领域共享的）、必然的知识，实现正迁移。因此，如何实现正迁移、避免负迁移也是迁移学习的一个重要研究问题。


    针对航天器应用中，迁移学习有以下几个可能的方向：第一，针对领域相似性、共同性的度量，目前还没有深入的研究成果，那么首要任务就是研究准确的度量方法。第二，在算法研究方面，不同的应用，迁移学习算法的需求有所不同。目前很多研究工作主要集中在迁移学习分类算法方面，其他方面的应用算法有待进一步研究。第三，关于迁移学习算法有效性的理论研究还很缺乏，特别是针对飞行器精确模型难以建立，研究可迁移学习条件，获取实现正迁移的本质属性，避免负迁移，也是方向之一。第四，在大数据环境下，研究高效的迁移学习算法尤为重要。


    ### 2.迁移学习模型


