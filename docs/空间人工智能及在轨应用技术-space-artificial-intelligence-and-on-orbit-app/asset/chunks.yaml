    图13-20 Y yN et-5目标鉴别网络流程框图


    ![](images/txt017_35.jpg "pagenumber_ebook=293,pagenumber_book=282")

    图13-21 样本库切片图像


    ### 2.算法优化

    算法在星上在轨实时实现过程中，受限于空间辐照环境、能源、体积、热防护等因素，星载处理平台的硬件资源有限，因此必须对算法进行优化设计，提升能效比，才能满足实际在轨实时处理任务需求。从算法流程中对计算能力要求高的模块入手，优化和简化算法流程，主要包含图像分割中的阈值求取、二值图像连通域标注以及目标鉴别3个算法模块。


    #### 1）阈值求取

    图像分割就是把图像分成若干个特定的、具有独特性质的区域。它是由图像处理到图像分析的关键步骤。`OTSU`法因有模式识别的相关理论为基础且图像分割性能良好，而逐渐成为一种最为流行的阈值分割技术。`OTSU`图像分割法因其计算量大，数据动态范围与处理图像大小成正相关，给通过`OTSU`法求取阈值的实时实现带来较大挑战。


    目前`OTSU`计算和优化的方法较多，何志勇等人提出了一个新算法以快速计算`OTSU`阈值，通过搜寻两类类内均值的平均值整数部分相等的阈值，从中确定一个符合`OTSU`准则的阈值，减少了计算量，获得了良好的计算实时性能。陈峥等人在对`OTSU`法进行分析的基础上，提出了一种改进的`OTSU`图像阈值分割算法。首先，采用整幅图像的平均灰度值作为初始阈值对图像进行分割；其次，推导出`OTSU`
    4个参数的递推公式；最后，在缩小的灰度级范围内用递推的`OTSU`法来计算最终的分割阈值，取得了较好的图像分割效果和时间效率。


    当前实现方法主要存在以下问题：一是嵌入式平台实现过程中，无论单纯采用整型或单/双精度浮点数据格式，计算精度高时，计算过程需要占用大量资源，开销极高，系统实时性大打折扣。二是应用场合没有考虑遥感图像大幅宽、低分辨率、感兴趣目标稀疏的特点，因此无法直接应用于遥感图像在轨实时处理中。


    针对以上问题，提出一种图像分割算法的可编程逻辑电路实现方法，解决图像分割算法实时实现在精度高时处理速度慢和硬件开销大的问题，同时消除利用FPGA实现时，处理速度提升和硬件开销降低后，处理精度低的问题。`OTSU`算法优化实现流程如图13-22所示，采用可编程逻辑电路设计了一种并行流水处理架构，实现了图像分割算法。将阈值求取图像处理成`N×N`大小的方阵，便于后续通过移位、截位、与非逻辑运算等手段，避免大量乘除运算，大大降低阈值求取算法的计算量，有效优化处理流程。


    ![](images/txt017_36.jpg "pagenumber_ebook=294,pagenumber_book=283")

    图13-22 OTSU算法优化实现流程


    与此同时，在实现过程中将算法作了进一步优化，对原始图像进行降采样处理，可大幅减少运算量。通过处理分析100幅图像大小为4 096× 4 096的量化精度为8bit的SAR图像数据，将上述方法处理得到的阈值结果与原始实现方法采用Matlab双精度浮点数据格式的结果进行对比分析。图13-23为两种方法处理得到的阈值对比图，图13-24为两种方法处理得到的阈值差值图。分析可知，涉及的优化方法在计算量降低16倍的情况下，阈值求取误差可以控制在5以内，对图像分割精度影响可以忽略，证明方法的有效性。通过建立计算精度误差模型，合理选择处理数据类型，自主调度定/浮点计算，在有效降低硬件资源使用的同时，保障了图像分割算法的实时性和精度。


    ![](images/txt017_37.jpg "pagenumber_ebook=295,pagenumber_book=284")

    图13-23 直接降采样求取阈值对比图（书后附彩插）


    ![](images/txt017_38.jpg "pagenumber_ebook=295,pagenumber_book=284")

    图13-24 直接降采样求取阈值差值图（书后附彩插）


    #### 2）连通域标注

    二值连通域标记是数字图像处理的基本方法。它是目标分割、目标识别、图像语义理解等应用的重要基础，是一种经典的计算机视觉处理方法。目前，数字图像的二值连通域标记方法主要分为两种：一种是标号传播方法，如轮廓追迹法、混合对象标记法；另一种是标号等价对处理方法，如优化连通算法、游程优化算法、块决策树算法等。


    标号等价对处理方法的主要过程：将二值图像输入后，按照从左到右、从上到下的顺序，对图像进行逐个像素的扫描，获取游程的起始、结束位置以及等价对。基本流程采用基于游程的方法实现，主要分3步：


    第一步，查找并记录团。逐行搜索示例图像，把每一行中连续的白色像素组成一个序列称为一个团（run），并记下它的团计数`num_run`、起点像素列坐标位置`start_run`、终点列坐标位置`end_run`以及它所在的行坐标位置`row_run`。


    如图13-25所示，第一行得到两个团，对应（团，团起始列坐标，团结束列坐标，团行坐标）：（1，2，3，1）和（2，6，6，1）；第二行得到两个团：（3，3，3，2）和（4，5，6，2）；第三行得到1个团：
    （5，4，4，3）；第四行得到3个团：（6，1，2，4），（7，4，4，4）和（8，6，7，4）；第五行得到1个团（9，5，5，5）。全部图像遍历结束后，得到很多个团的位置信息。


    ![](images/txt017_39.jpg "pagenumber_ebook=296,pagenumber_book=285")

    图13-25 查找并记录团过程


    第二步，标记团及生成等价对。对于除了第一行外的所有行里的团，如果它与前一行中的所有团都没有重合区域，则给它一个新的标号；如果它仅与上一行中一个团有重合区域，则将上一行的那个团的标号赋给它；如果它与上一行的两个以上的团有重叠区域，则给当前团赋一个相连团的最小标号，并将上一行的这几个团的标记写入等价对，说明它们属于一类。


    如图13-26所示，第一行记录的两个团标记为1和2；第二行记录的两个团和上一行的团有重叠区域，因此用上一行的团标记，即1和2；第三行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即1，然后将（1，2）写入等价对；第四行记录了3个团，第一个团与上一行没有重叠区域，为标记为3，同理第二个团标记为1，第三个团标记为4；第五行记录的一个团与上一行的两个团都有重叠，所以给它一个两者中最小的标记，即1，然后将（1，4）写入等价对。该步处理后，将第一步记录的团号标记得到新标号，同时还得到一个等价对列表。


