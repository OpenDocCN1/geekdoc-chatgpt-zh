- raw: '②决策。航天器可直接针对任务与环境做出决策，数据的分析更为全面、精准，知识的推理失误也会大大减少，进而形成序列化决策、轨迹规划，使航天器可以依据运行环境自主完成任务的调整与规划。


    ③操控。可面向整个航天器进行操控，在姿态轨道控制基础上增加了对载荷、目标的操作与控制，目标跟瞄、接近停靠及姿态镇定都是对非合作目标的操作过程，同时还包含了组件的组装与维修等。


    ④健康管理。航天器在原有数据判断及故障诊断基础上，增加了健康评估、故障预警及进化修复这些内容，决策、感知与操控间可实现信息互通、互联，并且能够预测及分析系统性能退化，使航天器的健康状态得到有效评估，进一步提高执行任务的能力。


    3.2　空间智能感知与控制发展现状


    本节主要从空间交会与操控、对地遥感、深空探测等应用场景阐述空间智能感知与控制的国内外发展现状。


    3.2.1　国外发展现状


    1.空间交会与操控


    空间目标的相对位姿测量是航天器交会对接、导航、移动机器人定位等领域中研究的重要问题。随着机器视觉的不断发展，依靠物体自身的视觉传感器进行实时位姿估计是实现空间自主化定位的重要一步。在没有环境先验信息的情况下，视觉传感器可以供采集的视频图像用于分析，对环境进行建模并实时估计目标物体自身的位姿信息，即物体的位置和航向。


    1987年，美国国家航空航天局研制出视频制导敏感器（Video Guidance Sensor，VGS），可以测量空间中两个航天器的相对位置和姿态。之后美国国家航空航天局在此基础上对VGS进行改进，提升了VGS中成像器件的性能，并改善了整个位姿测量系统的结构，研制出高级视频制导敏感器（Advanced
    Video Guidance Sensor，AVGS）系列。AVGS是一种基于合作目标的视觉测量系统，需要在目标物上安装合作标识，根据不同的测量环境制作相应的合作标识（如角反射器和LED灯），然后用摄像机拍摄合作目标，提取目标上的特征信息，并通过相关位姿测量算法计算出目标物相对于摄像机的位置和姿态。这种基于合作目标的位姿测量系统因为具有结构简单、测量精度高等优点得到了广泛应用。


    美国XSS-10/XSS-11微小卫星演示验证项目对自主逼近与交会进行了在轨演示，验证了自寻的制导敏感器和自主制导算法。美国空军于2014年发射了“地球同步空间态势感知计划（Geosynchronous
    Space Situational Awareness Program，GSSAP）”系列空间监视卫星的前两颗，同时搭载了“局部空间自动导航与制导实验”微型技术试验卫星。GSSAP卫星能够对地球静止轨道目标进行巡视探测和抵近侦察。


    美国“前端机器人使能近期演示验证计划（Frontend Robotics Enabling Near-term Demonstration，FREND）”主要针对空间中的非合作目标进行自动交会对接、姿态测量或捕获等。该计划主要对七自由度的机械臂、视觉传感器导航、自主交会控制等技术进行验证。FREND航天器包括推进模块与有效载荷模块。推进模块包括姿态控制火箭助推器、系统推进器、太阳帆板、星敏感器系统、惯性导航系统、GPS接收器和平台处理器等。有效载荷模块包括捕获系统与交会系统，而捕获系统主要包括机械臂、基线可变的立体视觉系统、照明系统、计算机系统、工具箱等。FREND计划采用的是基于多目视觉技术的位姿测量方案。当追踪航天器接近目标航天器至100
    m处时，立体视觉测量系统从分布于航天器上的众多相机中选择最优角度的3个相机对目标成像并计算出相对位姿信息。当追踪航天器逼近至目标航天器1.5 m处时，追踪航天器利用搭载的七自由度机械臂末端的手眼相机识别可供目标抓捕的部位，然后对目标的抓捕部位进行位姿解算，并对其进行最终的抓捕。


    美国在2011年针对废弃卫星维修又提出了著名的“凤凰计划（PHOE-NIX）”。PHOENIX计划主要是为了开发和演示报废卫星的回收技术，以期能回收那些报废卫星上有价值的部件，从而实现对太空领域的资源再利用。为了实现这些目标，首先得完成非合作目标航天器的捕获及抓取。在近距离接近阶段，为了获取目标的相对位姿等信息，PHOENIX计划同FREND一样，也采用了一种多目相机视觉系统，并且采取了三目视觉算法。通过从安装的20多个相机中选择角度最优的3个相机所获得的图片，可以比较方便地得到位置和姿态。


    日本宇宙开发事业团开发的“试验卫星7号（Engineering Test Satellite-Ⅶ，ETS-Ⅶ）”科学试验卫星在1997年发射成功。该项目首次在无人情况下进行了自主交会对接试验。该试验中采用的视觉测量系统被称为接近敏感器（Proximity
    Sensors，PXS）。PXS通过追踪航天器上安装的摄像机拍摄目标航天器上的标识器，然后提取目标特征进而解算出两个航天器的相对位姿参数。


    日本宇航探索局开展了“空间碎片清理者（Space Debris Micro Remover，SDMR）”项目。该项目采用双目立体视觉系统对空间非合作目标进行姿态的测量。另外，该项目还演示了通过观测空间非合作目标碎片的运动状态，完成对目标的绕飞、接近以及交会，最后通过绳系飞爪抓取目标。


    日本的国家信息和通信技术研究所还开展了“在轨维修服务系统（Orbital Maintenance System，OMS）”项目。该项目主要对通信卫星进行在轨服务，同时也可以清理空间中的垃圾或碎片。同样，该项目采用了双目和手眼相机相结合的方式来对非合作目标进行测量。首先，在目标的近距离阶段，通过双目系统测量空间目标的位姿并对其进行观察和监视。其次，通过手眼相机对捕获阶段的状态进行观测。日本宇宙航空研究开发机构的研究人员针对光照条件急剧变化情况下自由漂浮目标的姿态估计问题开展了研究，提出了一种基于卷积神经网络的鲁棒姿态估计器，可以直接实时估计关键点的三维位置。


    2.对地遥感


    传统对地观测卫星面临的问题包括：遥感数据量迅速膨胀，对数传、数据处理造成巨大压力；星上无效数据较多，浪费星上存储资源和下传通道资源；卫星系统的运行管理对地面运控造成了沉重的负担；传统卫星数据交付周期长，难以满足产品时效性需求；难以满足多样化观测需求。图像星上处理能力能够使对地观测卫星在轨处理图像数据，节省星上固存和数据下传资源，提高响应时间。目前，国外初步在一些技术试验和业务型对地探测卫星上应用了智能化处理技术。


    BIRD（Bi-spectral and Infrared Remote Detection）卫星是印度空间研究组织于2001年在德国宇航中心发射的一颗微小型技术验证卫星。该卫星的任务目标是观测地表火源/热点信息（这些热点信息可能由闪电、火山爆发、油井火焰或森林大火带来），以便更好地观测环境事件影响。其有效载荷包括双光谱红外过热点识别系统、用于植被分析和灾害分类的宽角度光电子立体传感器等。BIRD卫星搭载的红外遥感探测器基于神经网络分类器实现了实时快速火灾监测和预警；星上处理机实现了对来自可见光、中波红外和热红外3个波段图像在星上的辐射校正、几何校正、纹理提取和神经网络分类等处理，实现对亚像元级热点的探测。BIRD卫星的在轨数据处理能力还包括图像分析和压缩、自主任务规划以及灾害预警和监测专题信息产生等。


    TacSat-2（战术卫星-2）担负美国国防部的技术验证任务，由美国空军研究实验室于2006年研制。TacSat-2的任务目标是验证能够显著缩短小卫星研制时间的技术和方法，验证卫星在现场战术通信、指挥和控制方面的能力，对目标进行可见光成像，成像能力达到战术需求的优于1m的地面分辨率，验证多种先进技术等。TacSat-2进行了“奔跑者”在轨处理试验（ROPE）。ROPE载荷由FPGA阵列组成，设计用于处理增强型商业成像仪（ECI）生成的图像，可以自主地对图像进行几何校正、辐射校正、云判和地理坐标对准，并将其转化成标准军用图像格式。ROPE支持事件处理并可以对图像上的军事目标进行自主识别，同时还可以将图片处理成JPEG格式用于实时数据传输。


    EO-1卫星（地球观察者-1）担负美国NASA新千年地球科学计划中的一个技术验证任务，任务的总目标是执行观测任务，同时探索新的遥感技术和新的自主导航技术。NASA将自主科学卫星试验（Autonomous
    Sciencecraft Experiment，ASE）软件包上注并安装在EO-1卫星上。ASE软件包包括3部分：“行为规划、调度、执行和重规划”系统、航天器指令语言和星上科学处理算法。ASE软件包能够基于数据观测以及用户上注的标准进行自主成像任务决策，可以实现自主飞行计划制定、执行和飞行路径校准等功能。在对地观测中，通过在星上对观测图像的分析和识别，ASE能够自动发现地面环境的变化，定位感兴趣的观测点，自主地在下一个成像周期控制星上敏感器指向兴趣点进行进一步分析，最后将最具价值的观测信息传回地面，同时给出分析结论。这种卫星自主管控技术，将能够扩展现有的卫星观测能力，提高观测效率，对地面时敏目标具有较强的监测能力。星上自主分析和决策能够对观测信息进行优先级划分，将优先级高的信息快速传回地面。


    3.深空探测


    深空探测是目前航天国家高度重视的、极具挑战性和创新性的航天活动，对激发科学探索精神、推动人类科技进步与社会可持续发展具有重大而深远的战略意义。但是采用传统遥感方法进行深空探测面临诸多问题，如有效数据获取能力低、深空通信延迟大、深空探测任务复杂度高等。各国为满足深空探测任务需求，提升深空探测有效数据获取能力，都在加强深空探测在轨图像处理技术方面的研究工作。


    美国深空1号（DS-1）是最具代表性的自主深空探测器之一，其验证了自主导航、远程代理、自主软件测试和自动代码生成等相关技术。其中，远程代理模块利用规划引擎进行多约束任务规划的求解，实现指令生成、分发和执行，并借助自主故障诊断系统Livingstone，进行模式识别与系统重构。


    2014年，科学家借助开普勒太空望远镜（Kepler Mission）收集到的数据，发现了围绕Kepler-90公转的7颗卫星。2017年12月14日，NASA和Google宣布，他们在这个行星系统中找到了第八颗行星Kepler-90i，使Kepler-90系与太阳系并列成为拥有最多行星的已知恒星系统，被称为“第二个太阳系”。目前天体物理学家寻找系外行星的主要途径之一就是通过自动化的软件和人工分析，对开普勒太空望远镜收集的大量数据进行处理。开普勒在4年的时间内观测到了约20万颗恒星，每30
    min拍摄一张照片，创造了约140亿个数据点。这140亿个数据点可被转化成约2×1015个可能的行星轨道，对如此大量的数据进行处理，即使有最强大的计算机，也是一项极其艰难耗时的任务。为了加速这个过程，科学家转向了机器学习，利用15
    000个标记的开普勒信号来训练机器学习模型以分辨行星信号。接着利用该模型在670个恒星系统中寻找新的行星，结果发现了先前未被发现的两颗新行星。通过使用超过15
    000个开普勒信号的数据集，科学家创建了一个用来区分行星与非行星的模型。在能做到这点之前，它必须能识别由行星引起的信号，以及其他如恒星黑子或双星系统的天体引起的信号。在模型的测试阶段，其识别信号是来自行星或是非行星的准确率高达96%。因此，通过该模型就能在庞大的数据库中寻找凌日系外行星的微弱信号。


    迄今为止，国外已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器（也称月球车和火星车）共10台，分别是苏联由Luna17和Luna21号携带落月的2台无人遥控月球车Lunokhod1和Lunokhod2，美国由Apollo15、Apollo16和Apollo17号分别携带的3台载人月球车LRV（lunar
    rover vehicle），美国的三代火星车———由Pathfinder号携带的小型火星车“索杰纳”（Sojourner）、中型火星车“勇气号”和“机遇号”（Spirit和Opportunity）、大型火星车“好奇号”（Curiosity）和“毅力号”（Perseverance）。


    “勇气号”和“机遇号”火星车是美国的第二代火星车，采用双目立体视觉感知技术。火星车上配备了1对导航相机、2对避障相机（前后各1对），通过双目立体视觉技术实现火星表面地形测量。相机同时用于视觉里程定位。“勇气号”和“机遇号”由地面进行任务规划和全局路径规划，将决策结果以指令序列方式注入火星车，火星车自主执行序列任务，任务过程中实施自主导航、自主感知和避障路径规划。移动控制采用以运动学控制为主的低速移动控制测量，对大滑移和滑转没有采取特殊的控制手段。2007年，两台火星车都通过上行注入升级了其运行软件，升级后火星车具有了一定的自主决策能力，可以自主决定图像发送回地球的时机和方式，以及自主决定是否可伸展机械臂进行探测。


    移动控制“好奇号”火星车是美国的第三代火星车，与第二代中型火星车相比，质量和外形尺寸均有明显提升，但仍然采用双目立体视觉感知技术。为保证安全性，配备了1对导航相机和4对避障相机（前后各2对）用于火星表面地形测量。“好奇号”采用核能源作为探测动力，且越障能力增强到0.75
    m，对火星表面的复杂地形适应能力和通过能力有所提升，但感知与操控技术基本继承“勇气号”和“机遇号”，因此实际平均移动速度与“勇气号”和“机遇号”相当。 “好奇号”在发射时没有采用智能感知和操控方法，但2016年5月，地面对其软件进行了升级。升级后的AEGIS（Autonomous
    Exploration for Gathering Increased Science）软件采用了AI算法识别探测目标，使“好奇号”在自主选择感兴趣的岩石和土壤时，准确率由60%提升到93%，有效提高了探测效率。但软件升级后AI功能仅是“好奇号”的一小部分科学探测功能，升级软件占总软件的5‰左右（380万行中的2万行），且仍存在缺陷，如会将岩石阴影误识别为目标等，因此“好奇号”的大部分操控任务仍由地面决策。


    “毅力号”火星车是美国第三代第二台火星车，共配备23台相机，其中7台科学相机用于科学观测，7台降落相机用于进入、下降和着陆阶段成像，9台工程相机用于火星表面导航和避障。用于感知的工程相机可以实现高分辨率彩色成像，较“勇气号”
    “机遇号”和“好奇号”上只能黑白成像的工程相机功能和性能均有提升。此外，“毅力号”火星车搭载了首个火星直升机“机智号”（Ingenuity），扩大感知范围，能够自主实现对火星建模、感知与测量。因此，“毅力号”火星车的平均移动速度明显提升（超过100
    m/h）。“毅力号”火星车在继承“好奇号”的操控技术基础上，在发射时已具有了一定程度的智能规划和决策能力，如智能选择探测目标并自主决策对目标的采样方式、自主规划探测任务并自主决定通信时机等，在自主避障路径规划时也引入了人工智能方法。“毅力号”火星车在“好奇号”火星车基础上进行了改造升级，其底盘和移动机构基本继承“好奇号”。据公开可查文献，未有其采用自主智能移动控制方法的资料。


    3.2.2　国内发展现状


    1.空间交会与操控


    相对国外来说，我国在空间非合作目标交会与操控方面起步较晚，发展也比较缓慢，至今还未公布针对非合作目标的各种任务计划。但在合作目标交会与操控方面，我国已经有相当多的成功试验。我国的交会对接始于2011年11月3日，在历时44
    h后，天宫一号和神舟八号成功实施首次交会对接。中国成为世界上第三个独立完全掌握空间自动交会对接技术的国家。2012年6月18日，神舟九号与天宫一号对接成功，中国首次载人交会对接取得成功。2021年5月30日，天舟二号货运飞船采用自主快速交会对接模式精准对接于天和核心舱后向端口，整个过程历时约8
    h。2021年6月17日，神舟十二号载人飞船与天和核心舱完成自主快速交会对接，与此前已对接的天舟二号货运飞船一起构成三舱组合体，全程历时仅6.5 h。2022年11月12日，天舟五号成功对接于空间站天和核心舱后向端口，这次任务首次实现了2
    h自主快速交会对接，创造了世界纪录。


    2.对地遥感


    为了提升对地遥感卫星入轨后对时敏事件的快速响应能力，北京控制工程研究所着力发展自主感知与任务规划技术，已完成地面演示验证。通过色彩与纹理融合的特征识别，实现对目标上方可成像“云洞”的预先判断，采用多约束快速规划与决策方法，综合运用深度学习、启发式搜索等智能算法，得到规避遮挡的成像策略，提高成像数据可用性。


    2017年，我国首颗商业遥感卫星“吉林一号”发射入轨，具有一定的星上图像处理能力，可实现机动路径自主规划。


    2019年发射的软件定义卫星“天智一号”，可进行在轨数据处理，根据地面需求下传处理后的结果。


    3.深空探测


    迄今为止，国内也已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器共3台，即“玉兔号”（YuTu/jade rabbit）、“玉兔二号”月球车（YuTu2/jade
    rabbit2）和“祝融号”（Zhurong）火星车。


    中国的“玉兔号&二号”月球车采用双目立体视觉为主、主动结构光为辅的感知技术，配备1对黑白导航相机、1对黑白避障相机和1台16光路激光点阵器实现月球表面地形测量。1台激光点阵器主要用于对月表阴影区、弱纹理区和移动过程中近距离障碍检测。“玉兔号”月球车实现了基于主动结构光的激光感知避障技术在月面的首次应用验证。“玉兔二号”实现了激光感知避障技术和双目立体视觉感知避障技术在月背的首次应用验证。上述感知技术结合天文惯导组合自主导航技术，支持中国月球车实现了自主月面巡视移动探测。“玉兔号&二号”月球车采用地面远距离静态规划和自主动态避障路径规划的方式，地面对由月球车传回的导航相机和避障相机图像进行处理，感知周围较大范围的地形信息，并进行任务规划、目标点和路径点选取，将路径点序列和移动指令上传给月球车，月球车按指令要求移动到指定目标位置，移动过程中进行自主导航、感知、避障路径规划和移动控制。为保证安全，月球车每次自主移动的距离不超过10
    m。月球车移动控制采用以运动学控制为主的协调控制方法，没有进行滑移测量。


    中国首台火星车“祝融号”仍然采用双目立体视觉感知技术，配备1对彩色导航地形相机和2对黑白避障相机（前后各1对），对火星表面地形信息进行测量。同时，导航地形相机也用于视觉里程定位，进一步提高了自主导航和感知能力。“祝融号”火星车仍然采用地面远距离静态规划和自主动态避障路径规划的方式，但自主操控能力比“玉兔号&二号”月球车有较大提升，一次自主移动最大范围提高到40
    m。火星车采用以运动学控制为主的低速移动控制策略，但增加了滑移的在线估计，用于自主定位误差补偿和运动协调性判断。自主感知与操控能力的提升，使得“祝融号”火星车的自主感知与操控行驶里程达到总行驶里程的40%以上。


    3.3　空间智能感知与控制关键技术


    空间智能感知与控制关键技术主要包含空间智能感知、空间智能决策、空间智能操控以及自主健康管理，下面分别展开阐述。


    3.3.1　空间智能感知


    1.视觉定位、跟踪与测量技术'
  fmt: '

    ### ② 决策

    航天器可直接针对任务与环境做出决策，数据的分析更为全面、精准，知识的推理失误也会大大减少，进而形成序列化决策、轨迹规划，使航天器可以依据运行环境自主完成任务的调整与规划。


    ### ③ 操控

    可面向整个航天器进行操控，在姿态轨道控制基础上增加了对载荷、目标的操作与控制，目标跟瞄、接近停靠及姿态镇定都是对非合作目标的操作过程，同时还包含了组件的组装与维修等。


    ### ④ 健康管理

    航天器在原有数据判断及故障诊断基础上，增加了健康评估、故障预警及进化修复这些内容，决策、感知与操控间可实现信息互通、互联，并且能够预测及分析系统性能退化，使航天器的健康状态得到有效评估，进一步提高执行任务的能力。


    ## 3.2 空间智能感知与控制发展现状

    本节主要从空间交会与操控、对地遥感、深空探测等应用场景阐述空间智能感知与控制的国内外发展现状。


    ### 3.2.1 国外发展现状

    #### 1. 空间交会与操控

    空间目标的相对位姿测量是航天器交会对接、导航、移动机器人定位等领域中研究的重要问题。随着机器视觉的不断发展，依靠物体自身的视觉传感器进行实时位姿估计是实现空间自主化定位的重要一步。在没有环境先验信息的情况下，视觉传感器可以供采集的视频图像用于分析，对环境进行建模并实时估计目标物体自身的位姿信息，即物体的位置和航向。


    1987年，美国国家航空航天局研制出视频制导敏感器（Video Guidance Sensor，VGS），可以测量空间中两个航天器的相对位置和姿态。之后美国国家航空航天局在此基础上对VGS进行改进，提升了VGS中成像器件的性能，并改善了整个位姿测量系统的结构，研制出高级视频制导敏感器（Advanced
    Video Guidance Sensor，AVGS）系列。AVGS是一种基于合作目标的视觉测量系统，需要在目标物上安装合作标识，根据不同的测量环境制作相应的合作标识（如角反射器和LED灯），然后用摄像机拍摄合作目标，提取目标上的特征信息，并通过相关位姿测量算法计算出目标物相对于摄像机的位置和姿态。这种基于合作目标的位姿测量系统因为具有结构简单、测量精度高等优点得到了广泛应用。


    美国XSS-10/XSS-11微小卫星演示验证项目对自主逼近与交会进行了在轨演示，验证了自寻的制导敏感器和自主制导算法。美国空军于2014年发射了“地球同步空间态势感知计划（Geosynchronous
    Space Situational Awareness Program，GSSAP）”系列空间监视卫星的前两颗，同时搭载了“局部空间自动导航与制导实验”微型技术试验卫星。GSSAP卫星能够对地球静止轨道目标进行巡视探测和抵近侦察。


    美国“前端机器人使能近期演示验证计划（Frontend Robotics Enabling Near-term Demonstration，FREND）”主要针对空间中的非合作目标进行自动交会对接、姿态测量或捕获等。该计划主要对七自由度的机械臂、视觉传感器导航、自主交会控制等技术进行验证。FREND航天器包括推进模块与有效载荷模块。推进模块包括姿态控制火箭助推器、系统推进器、太阳帆板、星敏感器系统、惯性导航系统、GPS接收器和平台处理器等。有效载荷模块包括捕获系统与交会系统，而捕获系统主要包括机械臂、基线可变的立体视觉系统、照明系统、计算机系统、工具箱等。FREND计划采用的是基于多目视觉技术的位姿测量方案。当追踪航天器接近目标航天器至100
    m处时，立体视觉测量系统从分布于航天器上的众多相机中选择最优角度的3个相机对目标成像并计算出相对位姿信息。当追踪航天器逼近至目标航天器1.5 m处时，追踪航天器利用搭载的七自由度机械臂末端的手眼相机识别可供目标抓捕的部位，然后对目标的抓捕部位进行位姿解算，并对其进行最终的抓捕。


    美国在2011年针对废弃卫星维修又提出了著名的“凤凰计划（PHOE-NIX）”。PHOENIX计划主要是为了开发和演示报废卫星的回收技术，以期能回收那些报废卫星上有价值的部件，从而实现对太空领域的资源再利用。为了实现这些目标，首先得完成非合作目标航天器的捕获及抓取。在近距离接近阶段，为了获取目标的相对位姿等信息，PHOENIX计划同FREND一样，也采用了一种多目相机视觉系统，并且采取了三目视觉算法。通过从安装的20多个相机中选择角度最优的3个相机所获得的图片，可以比较方便地得到位置和姿态。


    日本宇宙开发事业团开发的“试验卫星7号（Engineering Test Satellite-Ⅶ，ETS-Ⅶ）”科学试验卫星在1997年发射成功。该项目首次在无人情况下进行了自主交会对接试验。该试验中采用的视觉测量系统被称为接近敏感器（Proximity
    Sensors，PXS）。PXS通过追踪航天器上安装的摄像机拍摄目标航天器上的标识器，然后提取目标特征进而解算出两个航天器的相对位姿参数。


    日本宇航探索局开展了“空间碎片清理者（Space Debris Micro Remover，SDMR）”项目。该项目采用双目立体视觉系统对空间非合作目标进行姿态的测量。另外，该项目还演示了通过观测空间非合作目标碎片的运动状态，完成对目标的绕飞、接近以及交会，最后通过绳系飞爪抓取目标。


    日本的国家信息和通信技术研究所还开展了“在轨维修服务系统（Orbital Maintenance System，OMS）”项目。该项目主要对通信卫星进行在轨服务，同时也可以清理空间中的垃圾或碎片。同样，该项目采用了双目和手眼相机相结合的方式来对非合作目标进行测量。首先，在目标的近距离阶段，通过双目系统测量空间目标的位姿并对其进行观察和监视。其次，通过手眼相机对捕获阶段的状态进行观测。日本宇宙航空研究开发机构的研究人员针对光照条件急剧变化情况下自由漂浮目标的姿态估计问题开展了研究，提出了一种基于卷积神经网络的鲁棒姿态估计器，可以直接实时估计关键点的三维位置。


    #### 2. 对地遥感

    传统对地观测卫星面临的问题包括：遥感数据量迅速膨胀，对数传、数据处理造成巨大压力；星上无效数据较多，浪费星上存储资源和下传通道资源；卫星系统的运行管理对地面运控造成了沉重的负担；传统卫星数据交付周期长，难以满足产品时效性需求；难以满足多样化观测需求。图像星上处理能力能够使对地观测卫星在轨处理图像数据，节省星上固存和数据下传资源，提高响应时间。目前，国外初步在一些技术试验和业务型对地探测卫星上应用了智能化处理技术。


    BIRD（Bi-spectral and Infrared Remote Detection）卫星是印度空间研究组织于2001年在德国宇航中心发射的一颗微小型技术验证卫星。该卫星的任务目标是观测地表火源/热点信息（这些热点信息可能由闪电、火山爆发、油井火焰或森林大火带来），以便更好地观测环境事件影响。其有效载荷包括双光谱红外过热点识别系统、用于植被分析和灾害分类的宽角度光电子立体传感器等。BIRD卫星搭载的红外遥感探测器基于神经网络分类器实现了实时快速火灾监测和预警；星上处理机实现了对来自可见光、中波红外和热红外3个波段图像在星上的辐射校正、几何校正、纹理提取和神经网络分类等处理，实现对亚像元级热点的探测。BIRD卫星的在轨数据处理能力还包括图像分析和压缩、自主任务规划以及灾害预警和监测专题信息产生等。


    TacSat-2（战术卫星-2）担负美国国防部的技术验证任务，由美国空军研究实验室于2006年研制。TacSat-2的任务目标是验证能够显著缩短小卫星研制时间的技术和方法，验证卫星在现场战术通信、指挥和控制方面的能力，对目标进行可见光成像，成像能力达到战术需求的优于1m的地面分辨率，验证多种先进技术等。TacSat-2进行了“奔跑者”在轨处理试验（ROPE）。ROPE载荷由FPGA阵列组成，设计用于处理增强型商业成像仪（ECI）生成的图像，可以自主地对图像进行几何校正、辐射校正、云判和地理坐标对准，并将其转化成标准军用图像格式。ROPE支持事件处理并可以对图像上的军事目标进行自主识别，同时还可以将图片处理成JPEG格式用于实时数据传输。


    EO-1卫星（地球观察者-1）担负美国NASA新千年地球科学计划中的一个技术验证任务，任务的总目标是执行观测任务，同时探索新的遥感技术和新的自主导航技术。NASA将自主科学卫星试验（Autonomous
    Sciencecraft Experiment，ASE）软件包上注并安装在EO-1卫星上。ASE软件包包括3部分：“行为规划、调度、执行和重规划”系统、航天器指令语言和星上科学处理算法。ASE软件包能够基于数据观测以及用户上注的标准进行自主成像任务决策，可以实现自主飞行计划制定、执行和飞行路径校准等功能。在对地观测中，通过在星上对观测图像的分析和识别，ASE能够自动发现地面环境的变化，定位感兴趣的观测点，自主地在下一个成像周期控制星上敏感器指向兴趣点进行进一步分析，最后将最具价值的观测信息传回地面，同时给出分析结论。这种卫星自主管控技术，将能够扩展现有的卫星观测能力，提高观测效率，对地面时敏目标具有较强的监测能力。星上自主分析和决策能够对观测信息进行优先级划分，将优先级高的信息快速传回地面。


    #### 3. 深空探测

    深空探测是目前航天国家高度重视的、极具挑战性和创新性的航天活动，对激发科学探索精神、推动人类科技进步与社会可持续发展具有重大而深远的战略意义。但是采用传统遥感方法进行深空探测面临诸多问题，如有效数据获取能力低、深空通信延迟大、深空探测任务复杂度高等。各国为满足深空探测任务需求，提升深空探测有效数据获取能力，都在加强深空探测在轨图像处理技术方面的研究工作。


    美国深空1号（DS-1）是最具代表性的自主深空探测器之一，其验证了自主导航、远程代理、自主软件测试和自动代码生成等相关技术。其中，远程代理模块利用规划引擎进行多约束任务规划的求解，实现指令生成、分发和执行，并借助自主故障诊断系统Livingstone，进行模式识别与系统重构。


    2014年，科学家借助开普勒太空望远镜（Kepler Mission）收集到的数据，发现了围绕Kepler-90公转的7颗卫星。2017年12月14日，NASA和Google宣布，他们在这个行星系统中找到了第八颗行星Kepler-90i，使Kepler-90系与太阳系并列成为拥有最多行星的已知恒星系统，被称为“第二个太阳系”。目前天体物理学家寻找系外行星的主要途径之一就是通过自动化的软件和人工分析，对开普勒太空望远镜收集的大量数据进行处理。开普勒在4年的时间内观测到了约20万颗恒星，每30
    min拍摄一张照片，创造了约140亿个数据点。这140亿个数据点可被转化成约2×1015个可能的行星轨道，对如此大量的数据进行处理，即使有最强大的计算机，也是一项极其艰难耗时的任务。为了加速这个过程，科学家转向了机器学习，利用15
    000个标记的开普勒信号来训练机器学习模型以分辨行星信号。接着利用该模型在670个恒星系统中寻找新的行星，结果发现了先前未被发现的两颗新行星。通过使用超过15
    000个开普勒信号的数据集，科学家创建了一个用来区分行星与非行星的模型。在能做到这点之前，它必须能识别由行星引起的信号，以及其他如恒星黑子或双星系统的天体引起的信号。在模型的测试阶段，其识别信号是来自行星或是非行星的准确率高达96%。因此，通过该模型就能在庞大的数据库中寻找凌日系外行星的微弱信号。


    迄今为止，国外已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器（也称月球车和火星车）共10台，分别是苏联由Luna17和Luna21号携带落月的2台无人遥控月球车Lunokhod1和Lunokhod2，美国由Apollo15、Apollo16和Apollo17号分别携带的3台载人月球车LRV（lunar
    rover vehicle），美国的三代火星车———由Pathfinder号携带的小型火星车“索杰纳”（Sojourner）、中型火星车“勇气号”和“机遇号”（Spirit和Opportunity）、大型火星车“好奇号”（Curiosity）和“毅力号”（Perseverance）。


    “勇气号”和“机遇号”火星车是美国的第二代火星车，采用双目立体视觉感知技术。火星车上配备了1对导航相机、2对避障相机（前后各1对），通过双目立体视觉技术实现火星表面地形测量。相机同时用于视觉里程定位。“勇气号”和“机遇号”由地面进行任务规划和全局路径规划，将决策结果以指令序列方式注入火星车，火星车自主执行序列任务，任务过程中实施自主导航、自主感知和避障路径规划。移动控制采用以运动学控制为主的低速移动控制测量，对大滑移和滑转没有采取特殊的控制手段。2007年，两台火星车都通过上行注入升级了其运行软件，升级后火星车具有了一定的自主决策能力，可以自主决定图像发送回地球的时机和方式，以及自主决定是否可伸展机械臂进行探测。


    移动控制“好奇号”火星车是美国的第三代火星车，与第二代中型火星车相比，质量和外形尺寸均有明显提升，但仍然采用双目立体视觉感知技术。为保证安全性，配备了1对导航相机和4对避障相机（前后各2对）用于火星表面地形测量。“好奇号”采用核能源作为探测动力，且越障能力增强到0.75
    m，对火星表面的复杂地形适应能力和通过能力有所提升，但感知与操控技术基本继承“勇气号”和“机遇号”，因此实际平均移动速度与“勇气号”和“机遇号”相当。“好奇号”在发射时没有采用智能感知和操控方法，但2016年5月，地面对其软件进行了升级。升级后的AEGIS（Autonomous
    Exploration for Gathering Increased Science）软件采用了AI算法识别探测目标，使“好奇号”在自主选择感兴趣的岩石和土壤时，准确率由60%提升到93%，有效提高了探测效率。但软件升级后AI功能仅是“好奇号”的一小部分科学探测功能，升级软件占总软件的5‰左右（380万行中的2万行），且仍存在缺陷，如会将岩石阴影误识别为目标等，因此“好奇号”的大部分操控任务仍由地面决策。


    “毅力号”火星车是美国第三代第二台火星车，共配备23台相机，其中7台科学相机用于科学观测，7台降落相机用于进入、下降和着陆阶段成像，9台工程相机用于火星表面导航和避障。用于感知的工程相机可以实现高分辨率彩色成像，较“勇气号”“机遇号”和“好奇号”上只能黑白成像的工程相机功能和性能均有提升。此外，“毅力号”火星车搭载了首个火星直升机“机智号”（Ingenuity），扩大感知范围，能够自主实现对火星建模、感知与测量。因此，“毅力号”火星车的平均移动速度明显提升（超过100
    m/h）。“毅力号”火星车在继承“好奇号”的操控技术基础上，在发射时已具有了一定程度的智能规划和决策能力，如智能选择探测目标并自主决策对目标的采样方式、自主规划探测任务并自主决定通信时机等，在自主避障路径规划时也引入了人工智能方法。“毅力号”火星车在“好奇号”火星车基础上进行了改造升级，其底盘和移动机构基本继承“好奇号”。据公开可查文献，未有其采用自主智能移动控制方法的资料。


    ### 3.2.2 国内发展现状

    #### 1. 空间交会与操控

    相对国外来说，我国在空间非合作目标交会与操控方面起步较晚，发展也比较缓慢，至今还未公布针对非合作目标的各种任务计划。但在合作目标交会与操控方面，我国已经有相当多的成功试验。我国的交会对接始于2011年11月3日，在历时44
    h后，天宫一号和神舟八号成功实施首次交会对接。中国成为世界上第三个独立完全掌握空间自动交会对接技术的国家。2012年6月18日，神舟九号与天宫一号对接成功，中国首次载人交会对接取得成功。2021年5月30日，天舟二号货运飞船采用自主快速交会对接模式精准对接于天和核心舱后向端口，整个过程历时约8
    h。2021年6月17日，神舟十二号载人飞船与天和核心舱完成自主快速交会对接，与此前已对接的天舟二号货运飞船一起构成三舱组合体，全程历时仅6.5 h。2022年11月12日，天舟五号成功对接于空间站天和核心舱后向端口，这次任务首次实现了2
    h自主快速交会对接，创造了世界纪录。


    #### 2. 对地遥感

    为了提升对地遥感卫星入轨后对时敏事件的快速响应能力，北京控制工程研究所着力发展自主感知与任务规划技术，已完成地面演示验证。通过色彩与纹理融合的特征识别，实现对目标上方可成像“云洞”的预先判断，采用多约束快速规划与决策方法，综合运用深度学习、启发式搜索等智能算法，得到规避遮挡的成像策略，提高成像数据可用性。


    2017年，我国首颗商业遥感卫星“吉林一号”发射入轨，具有一定的星上图像处理能力，可实现机动路径自主规划。


    2019年发射的软件定义卫星“天智一号”，可进行在轨数据处理，根据地面需求下传处理后的结果。


    #### 3. 深空探测

    迄今为止，国内也已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器共3台，即“玉兔号”（YuTu/jade rabbit）、“玉兔二号”月球车（YuTu2/jade
    rabbit2）和“祝融号”（Zhurong）火星车。


    中国的“玉兔号&二号”月球车采用双目立体视觉为主、主动结构光为辅的感知技术，配备1对黑白导航相机、1对黑白避障相机和1台16光路激光点阵器实现月球表面地形测量。1台激光点阵器主要用于对月表阴影区、弱纹理区和移动过程中近距离障碍检测。“玉兔号”月球车实现了基于主动结构光的激光感知避障技术在月面的首次应用验证。“玉兔二号”实现了激光感知避障技术和双目立体视觉感知避障技术在月背的首次应用验证。上述感知技术结合天文惯导组合自主导航技术，支持中国月球车实现了自主月面巡视移动探测。“玉兔号&二号”月球车采用地面远距离静态规划和自主动态避障路径规划的方式，地面对由月球车传回的导航相机和避障相机图像进行处理，感知周围较大范围的地形信息，并进行任务规划、目标点和路径点选取，将路径点序列和移动指令上传给月球车，月球车按指令要求移动到指定目标位置，移动过程中进行自主导航、感知、避障路径规划和移动控制。为保证安全，月球车每次自主移动的距离不超过10
    m。月球车移动控制采用以运动学控制为主的协调控制方法，没有进行滑移测量。


    中国首台火星车“祝融号”仍然采用双目立体视觉感知技术，配备1对彩色导航地形相机和2对黑白避障相机（前后各1对），对火星表面地形信息进行测量。同时，导航地形相机也用于视觉里程定位，进一步提高了自主导航和感知能力。“祝融号”火星车仍然采用地面远距离静态规划和自主动态避障路径规划的方式，但自主操控能力比“玉兔号&二号”月球车有较大提升，一次自主移动最大范围提高到40
    m。火星车采用以运动学控制为主的低速移动控制策略，但增加了滑移的在线估计，用于自主定位误差补偿和运动协调性判断。自主感知与操控能力的提升，使得“祝融号”火星车的自主感知与操控行驶里程达到总行驶里程的40%以上。


    ## 3.3 空间智能感知与控制关键技术

    空间智能感知与控制关键技术主要包含空间智能感知、空间智能决策、空间智能操控以及自主健康管理，下面分别展开阐述。


    ### 3.3.1 空间智能感知

    #### 1. 视觉定位、跟踪与测量技术

    '
  trans: '


    ### ② 决策

    航天器可直接针对任务与环境做出决策，数据的分析更为全面、精准，知识的推理失误也会大大减少，进而形成序列化决策、轨迹规划，使航天器可以依据运行环境自主完成任务的调整与规划。


    ### ③ 操控

    可面向整个航天器进行操控，在姿态轨道控制基础上增加了对载荷、目标的操作与控制，目标跟瞄、接近停靠及姿态镇定都是对非合作目标的操作过程，同时还包含了组件的组装与维修等。


    ### ④ 健康管理

    航天器在原有数据判断及故障诊断基础上，增加了健康评估、故障预警及进化修复这些内容，决策、感知与操控间可实现信息互通、互联，并且能够预测及分析系统性能退化，使航天器的健康状态得到有效评估，进一步提高执行任务的能力。


    ## 3.2 空间智能感知与控制发展现状

    本节主要从空间交会与操控、对地遥感、深空探测等应用场景阐述空间智能感知与控制的国内外发展现状。


    ### 3.2.1 国外发展现状

    #### 1. 空间交会与操控

    空间目标的相对位姿测量是航天器交会对接、导航、移动机器人定位等领域中研究的重要问题。随着机器视觉的不断发展，依靠物体自身的视觉传感器进行实时位姿估计是实现空间自主化定位的重要一步。在没有环境先验信息的情况下，视觉传感器可以供采集的视频图像用于分析，对环境进行建模并实时估计目标物体自身的位姿信息，即物体的位置和航向。


    1987 年，美国国家航空航天局研制出视频制导敏感器（Video Guidance Sensor，VGS），可以测量空间中两个航天器的相对位置和姿态。之后美国国家航空航天局在此基础上对
    VGS 进行改进，提升了 VGS 中成像器件的性能，并改善了整个位姿测量系统的结构，研制出高级视频制导敏感器（Advanced Video Guidance
    Sensor，AVGS）系列。AVGS 是一种基于合作目标的视觉测量系统，需要在目标物上安装合作标识，根据不同的测量环境制作相应的合作标识（如角反射器和 LED
    灯），然后用摄像机拍摄合作目标，提取目标上的特征信息，并通过相关位姿测量算法计算出目标物相对于摄像机的位置和姿态。这种基于合作目标的位姿测量系统因为具有结构简单、测量精度高等优点得到了广泛应用。


    美国 XSS-10/XSS-11 微小卫星演示验证项目对自主逼近与交会进行了在轨演示，验证了自寻的制导敏感器和自主制导算法。美国空军于 2014 年发射了“地球同步空间态势感知计划（Geosynchronous
    Space Situational Awareness Program，GSSAP）”系列空间监视卫星的前两颗，同时搭载了“局部空间自动导航与制导实验”微型技术试验卫星。GSSAP
    卫星能够对地球静止轨道目标进行巡视探测和抵近侦察。


    美国“前端机器人使能近期演示验证计划（Frontend Robotics Enabling Near-term Demonstration，FREND）”主要针对空间中的非合作目标进行自动交会对接、姿态测量或捕获等。该计划主要对七自由度的机械臂、视觉传感器导航、自主交会控制等技术进行验证。FREND
    航天器包括推进模块与有效载荷模块。推进模块包括姿态控制火箭助推器、系统推进器、太阳帆板、星敏感器系统、惯性导航系统、GPS 接收器和平台处理器等。有效载荷模块包括捕获系统与交会系统，而捕获系统主要包括机械臂、基线可变的立体视觉系统、照明系统、计算机系统、工具箱等。FREND
    计划采用的是基于多目视觉技术的位姿测量方案。当追踪航天器接近目标航天器至 100 m 处时，立体视觉测量系统从分布于航天器上的众多相机中选择最优角度的 3
    个相机对目标成像并计算出相对位姿信息。当追踪航天器逼近至目标航天器 1.5 m 处时，追踪航天器利用搭载的七自由度机械臂末端的手眼相机识别可供目标抓捕的部位，然后对目标的抓捕部位进行位姿解算，并对其进行最终的抓捕。


    美国在 2011 年针对废弃卫星维修又提出了著名的“凤凰计划（PHOE-NIX）”。PHOENIX 计划主要是为了开发和演示报废卫星的回收技术，以期能回收那些报废卫星上有价值的部件，从而实现对太空领域的资源再利用。为了实现这些目标，首先得完成非合作目标航天器的捕获及抓取。在近距离接近阶段，为了获取目标的相对位姿等信息，PHOENIX
    计划同 FREND 一样，也采用了一种多目相机视觉系统，并且采取了三目视觉算法。通过从安装的 20 多个相机中选择角度最优的 3 个相机所获得的图片，可以比较方便地得到位置和姿态。


    日本宇宙开发事业团开发的“试验卫星 7 号（Engineering Test Satellite-Ⅶ，ETS-Ⅶ）”科学试验卫星在 1997 年发射成功。该项目首次在无人情况下进行了自主交会对接试验。该试验中采用的视觉测量系统被称为接近敏感器（Proximity
    Sensors，PXS）。PXS 通过追踪航天器上安装的摄像机拍摄目标航天器上的标识器，然后提取目标特征进而解算出两个航天器的相对位姿参数。


    日本宇航探索局开展了“空间碎片清理者（Space Debris Micro Remover，SDMR）”项目。该项目采用双目立体视觉系统对空间非合作目标进行姿态的测量。另外，该项目还演示了通过观测空间非合作目标碎片的运动状态，完成对目标的绕飞、接近以及交会，最后通过绳系飞爪抓取目标。


    日本的国家信息和通信技术研究所还开展了“在轨维修服务系统（Orbital Maintenance System，OMS）”项目。该项目主要对通信卫星进行在轨服务，同时也可以清理空间中的垃圾或碎片。同样，该项目采用了双目和手眼相机相结合的方式来对非合作目标进行测量。首先，在目标的近距离阶段，通过双目系统测量空间目标的位姿并对其进行观察和监视。其次，通过手眼相机对捕获阶段的状态进行观测。日本宇宙航空研究开发机构的研究人员针对光照条件急剧变化情况下自由漂浮目标的姿态估计问题开展了研究，提出了一种基于卷积神经网络的鲁棒姿态估计器，可以直接实时估计关键点的三维位置。


    #### 2. 对地遥感

    传统对地观测卫星面临的问题包括：遥感数据量迅速膨胀，对数传、数据处理造成巨大压力；星上无效数据较多，浪费星上存储资源和下传通道资源；卫星系统的运行管理对地面运控造成了沉重的负担；传统卫星数据交付周期长，难以满足产品时效性需求；难以满足多样化观测需求。图像星上处理能力能够使对地观测卫星在轨处理图像数据，节省星上固存和数据下传资源，提高响应时间。目前，国外初步在一些技术试验和业务型对地探测卫星上应用了智能化处理技术。


    BIRD（Bi-spectral and Infrared Remote Detection）卫星是印度空间研究组织于 2001 年在德国宇航中心发射的一颗微小型技术验证卫星。该卫星的任务目标是观测地表火源/热点信息（这些热点信息可能由闪电、火山爆发、油井火焰或森林大火带来），以便更好地观测环境事件影响。其有效载荷包括双光谱红外过热点识别系统、用于植被分析和灾害分类的宽角度光电子立体传感器等。BIRD
    卫星搭载的红外遥感探测器基于神经网络分类器实现了实时快速火灾监测和预警；星上处理机实现了对来自可见光、中波红外和热红外 3 个波段图像在星上的辐射校正、几何校正、纹理提取和神经网络分类等处理，实现对亚像元级热点的探测。BIRD
    卫星的在轨数据处理能力还包括图像分析和压缩、自主任务规划以及灾害预警和监测专题信息产生等。


    TacSat-2（战术卫星-2）担负美国国防部的技术验证任务，由美国空军研究实验室于 2006 年研制。TacSat-2 的任务目标是验证能够显著缩短小卫星研制时间的技术和方法，验证卫星在现场战术通信、指挥和控制方面的能力，对目标进行可见光成像，成像能力达到战术需求的优于
    1m 的地面分辨率，验证多种先进技术等。TacSat-2 进行了“奔跑者”在轨处理试验（ROPE）。ROPE 载荷由 FPGA 阵列组成，设计用于处理增强型商业成像仪（ECI）生成的图像，可以自主地对图像进行几何校正、辐射校正、云判和地理坐标对准，并将其转化成标准军用图像格式。ROPE
    支持事件处理并可以对图像上的军事目标进行自主识别，同时还可以将图片处理成 JPEG 格式用于实时数据传输。


    EO-1 卫星（地球观察者-1）担负美国 NASA 新千年地球科学计划中的一个技术验证任务，任务的总目标是执行观测任务，同时探索新的遥感技术和新的自主导航技术。NASA
    将自主科学卫星试验（Autonomous Sciencecraft Experiment，ASE）软件包上注并安装在 EO-1 卫星上。ASE 软件包包括
    3 部分：“行为规划、调度、执行和重规划”系统、航天器指令语言和星上科学处理算法。ASE 软件包能够基于数据观测以及用户上注的标准进行自主成像任务决策，可以实现自主飞行计划制定、执行和飞行路径校准等功能。在对地观测中，通过在星上对观测图像的分析和识别，ASE
    能够自动发现地面环境的变化，定位感兴趣的观测点，自主地在下一个成像周期控制星上敏感器指向兴趣点进行进一步分析，最后将最具价值的观测信息传回地面，同时给出分析结论。这种卫星自主管控技术，将能够扩展现有的卫星观测能力，提高观测效率，对地面时敏目标具有较强的监测能力。星上自主分析和决策能够对观测信息进行优先级划分，将优先级高的信息快速传回地面。


    #### 3. 深空探测

    深空探测是目前航天国家高度重视的、极具挑战性和创新性的航天活动，对激发科学探索精神、推动人类科技进步与社会可持续发展具有重大而深远的战略意义。但是采用传统遥感方法进行深空探测面临诸多问题，如有效数据获取能力低、深空通信延迟大、深空探测任务复杂度高等。各国为满足深空探测任务需求，提升深空探测有效数据获取能力，都在加强深空探测在轨图像处理技术方面的研究工作。


    美国深空 1 号（DS-1）是最具代表性的自主深空探测器之一，其验证了自主导航、远程代理、自主软件测试和自动代码生成等相关技术。其中，远程代理模块利用规划引擎进行多约束任务规划的求解，实现指令生成、分发和执行，并借助自主故障诊断系统
    Livingstone，进行模式识别与系统重构。


    2014 年，科学家借助开普勒太空望远镜（Kepler Mission）收集到的数据，发现了围绕 Kepler-90 公转的 7 颗卫星。2017 年 12
    月 14 日，NASA 和 Google 宣布，他们在这个行星系统中找到了第八颗行星 Kepler-90i，使 Kepler-90 系与太阳系并列成为拥有最多行星的已知恒星系统，被称为“第二个太阳系”。目前天体物理学家寻找系外行星的主要途径之一就是通过自动化的软件和人工分析，对开普勒太空望远镜收集的大量数据进行处理。开普勒在
    4 年的时间内观测到了约 20 万颗恒星，每 30 min 拍摄一张照片，创造了约 140 亿个数据点。这 140 亿个数据点可被转化成约 2×1015 个可能的行星轨道，对如此大量的数据进行处理，即使有最强大的计算机，也是一项极其艰难耗时的任务。为了加速这个过程，科学家转向了机器学习，利用
    15 000 个标记的开普勒信号来训练机器学习模型以分辨行星信号。接着利用该模型在 670 个恒星系统中寻找新的行星，结果发现了先前未被发现的两颗新行星。通过使用超过
    15 000 个开普勒信号的数据集，科学家创建了一个用来区分行星与非行星的模型。在能做到这点之前，它必须能识别由行星引起的信号，以及其他如恒星黑子或双星系统的天体引起的信号。在模型的测试阶段，其识别信号是来自行星或是非行星的准确率高达
    96%。因此，通过该模型就能在庞大的数据库中寻找凌日系外行星的微弱信号。


    迄今为止，国外已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器（也称月球车和火星车）共 10 台，分别是苏联由 Luna17 和
    Luna21 号携带落月的 2 台无人遥控月球车 Lunokhod1 和 Lunokhod2，美国由 Apollo15、Apollo16 和 Apollo17
    号分别携带的 3 台载人月球车 LRV（lunar rover vehicle），美国的三代火星车———由 Pathfinder 号携带的小型火星车“索杰纳”（Sojourner）、中型火星车“勇气号”和“机遇号”（Spirit
    和 Opportunity）、大型火星车“好奇号”（Curiosity）和“毅力号”（Perseverance）。


    “勇气号”和“机遇号”火星车是美国的第二代火星车，采用双目立体视觉感知技术。火星车上配备了 1 对导航相机、2 对避障相机（前后各 1 对），通过双目立体视觉技术实现火星表面地形测量。相机同时用于视觉里程定位。“勇气号”和“机遇号”由地面进行任务规划和全局路径规划，将决策结果以指令序列方式注入火星车，火星车自主执行序列任务，任务过程中实施自主导航、自主感知和避障路径规划。移动控制采用以运动学控制为主的低速移动控制测量，对大滑移和滑转没有采取特殊的控制手段。2007
    年，两台火星车都通过上行注入升级了其运行软件，升级后火星车具有了一定的自主决策能力，可以自主决定图像发送回地球的时机和方式，以及自主决定是否可伸展机械臂进行探测。


    移动控制“好奇号”火星车是美国的第三代火星车，与第二代中型火星车相比，质量和外形尺寸均有明显提升，但仍然采用双目立体视觉感知技术。为保证安全性，配备了 1
    对导航相机和 4 对避障相机（前后各 2 对）用于火星表面地形测量。“好奇号”采用核能源作为探测动力，且越障能力增强到 0.75 m，对火星表面的复杂地形适应能力和通过能力有所提升，但感知与操控技术基本继承“勇气号”和“机遇号”，因此实际平均移动速度与“勇气号”和“机遇号”相当。“好奇号”在发射时没有采用智能感知和操控方法，但
    2016 年 5 月，地面对其软件进行了升级。升级后的 AEGIS（Autonomous Exploration for Gathering Increased
    Science）软件采用了 AI 算法识别探测目标，使“好奇号”在自主选择感兴趣的岩石和土壤时，准确率由 60%提升到 93%，有效提高了探测效率。但软件升级后
    AI 功能仅是“好奇号”的一小部分科学探测功能，升级软件占总软件的 5‰左右（380 万行中的 2 万行），且仍存在缺陷，如会将岩石阴影误识别为目标等，因此“好奇号”的大部分操控任务仍由地面决策。


    “毅力号”火星车是美国第三代第二台火星车，共配备 23 台相机，其中 7 台科学相机用于科学观测，7 台降落相机用于进入、下降和着陆阶段成像，9 台工程相机用于火星表面导航和避障。用于感知的工程相机可以实现高分辨率彩色成像，较“勇气号”“机遇号”和“好奇号”上只能黑白成像的工程相机功能和性能均有提升。此外，“毅力号”火星车搭载了首个火星直升机“机智号”（Ingenuity），扩大感知范围，能够自主实现对火星建模、感知与测量。因此，“毅力号”火星车的平均移动速度明显提升（超过
    100 m/h）。“毅力号”火星车在继承“好奇号”的操控技术基础上，在发射时已具有了一定程度的智能规划和决策能力，如智能选择探测目标并自主决策对目标的采样方式、自主规划探测任务并自主决定通信时机等，在自主避障路径规划时也引入了人工智能方法。“毅力号”火星车在“好奇号”火星车基础上进行了改造升级，其底盘和移动机构基本继承“好奇号”。据公开可查文献，未有其采用自主智能移动控制方法的资料。


    ### 3.2.2 国内发展现状

    #### 1. 空间交会与操控

    相对国外来说，我国在空间非合作目标交会与操控方面起步较晚，发展也比较缓慢，至今还未公布针对非合作目标的各种任务计划。但在合作目标交会与操控方面，我国已经有相当多的成功试验。我国的交会对接始于
    2011 年 11 月 3 日，在历时 44 h 后，天宫一号和神舟八号成功实施首次交会对接。中国成为世界上第三个独立完全掌握空间自动交会对接技术的国家。2012
    年 6 月 18 日，神舟九号与天宫一号对接成功，中国首次载人交会对接取得成功。2021 年 5 月 30 日，天舟二号货运飞船采用自主快速交会对接模式精准对接于天和核心舱后向端口，整个过程历时约
    8 h。2021 年 6 月 17 日，神舟十二号载人飞船与天和核心舱完成自主快速交会对接，与此前已对接的天舟二号货运飞船一起构成三舱组合体，全程历时仅 6.5
    h。2022 年 11 月 12 日，天舟五号成功对接于空间站天和核心舱后向端口，这次任务首次实现了 2 h 自主快速交会对接，创造了世界纪录。


    #### 2. 对地遥感

    为了提升对地遥感卫星入轨后对时敏事件的快速响应能力，北京控制工程研究所着力发展自主感知与任务规划技术，已完成地面演示验证。通过色彩与纹理融合的特征识别，实现对目标上方可成像“云洞”的预先判断，采用多约束快速规划与决策方法，综合运用深度学习、启发式搜索等智能算法，得到规避遮挡的成像策略，提高成像数据可用性。


    2017 年，我国首颗商业遥感卫星“吉林一号”发射入轨，具有一定的星上图像处理能力，可实现机动路径自主规划。


    2019 年发射的软件定义卫星“天智一号”，可进行在轨数据处理，根据地面需求下传处理后的结果。


    #### 3. 深空探测

    迄今为止，国内也已成功实施了对月球和火星表面的巡视探测。成功着陆的月球/火星表面巡视探测器共 3 台，即“玉兔号”（YuTu/jade rabbit）、“玉兔二号”月球车（YuTu2/jade
    rabbit2）和“祝融号”（Zhurong）火星车。


    中国的“玉兔号&二号”月球车采用双目立体视觉为主、主动结构光为辅的感知技术，配备 1 对黑白导航相机、1 对黑白避障相机和 1 台 16 光路激光点阵器实现月球表面地形测量。1
    台激光点阵器主要用于对月表阴影区、弱纹理区和移动过程中近距离障碍检测。“玉兔号”月球车实现了基于主动结构光的激光感知避障技术在月面的首次应用验证。“玉兔二号”实现了激光感知避障技术和双目立体视觉感知避障技术在月背的首次应用验证。上述感知技术结合天文惯导组合自主导航技术，支持中国月球车实现了自主月面巡视移动探测。“玉兔号&二号”月球车采用地面远距离静态规划和自主动态避障路径规划的方式，地面对由月球车传回的导航相机和避障相机图像进行处理，感知周围较大范围的地形信息，并进行任务规划、目标点和路径点选取，将路径点序列和移动指令上传给月球车，月球车按指令要求移动到指定目标位置，移动过程中进行自主导航、感知、避障路径规划和移动控制。为保证安全，月球车每次自主移动的距离不超过
    10 m。月球车移动控制采用以运动学控制为主的协调控制方法，没有进行滑移测量。


    中国首台火星车“祝融号”仍然采用双目立体视觉感知技术，配备 1 对彩色导航地形相机和 2 对黑白避障相机（前后各 1 对），对火星表面地形信息进行测量。同时，导航地形相机也用于视觉里程定位，进一步提高了自主导航和感知能力。“祝融号”火星车仍然采用地面远距离静态规划和自主动态避障路径规划的方式，但自主操控能力比“玉兔号&二号”月球车有较大提升，一次自主移动最大范围提高到
    40 m。火星车采用以运动学控制为主的低速移动控制策略，但增加了滑移的在线估计，用于自主定位误差补偿和运动协调性判断。自主感知与操控能力的提升，使得“祝融号”火星车的自主感知与操控行驶里程达到总行驶里程的
    40%以上。


    ## 3.3 空间智能感知与控制关键技术

    空间智能感知与控制关键技术主要包含空间智能感知、空间智能决策、空间智能操控以及自主健康管理，下面分别展开阐述。


    ### 3.3.1 空间智能感知

    #### 1. 视觉定位、跟踪与测量技术

