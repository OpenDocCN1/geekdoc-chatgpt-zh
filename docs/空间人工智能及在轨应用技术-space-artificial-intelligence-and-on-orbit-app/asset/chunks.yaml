    # 前　言


    2022年11月新一代人工智能技术ChatGPT问世，引起了全球范围的强烈关注，将人工智能技术推向新的高峰。人工智能技术从20世纪50年代发展至今，经历了三次高潮，两次寒冬的洗礼，在各行各业逐步走向成熟应用。空间领域人工智能是指人工智能的相关理论、技术、方法与空间领域的物理规律、技术、知识各层面融合以及在航天器设计、研制、生产、应用、消亡全生命周期融合的“专用人工智能”。面向未来，空间技术与人工智能结合形成空间人工智能技术，通过模拟人脑自然智能“信息感知、记忆思维、学习适应、行动驱动”的架构模型，形成具有“自感知、自记忆、自思维、自学习、自适应、自行动、自进化”“七自”能力的空间智能航天器，承担重塑航天体系，开创全新应用场景的重任。未来十至二十年，人工智能技术将在空间领域广泛、快速应用，支撑天基系统体系化、网络化、智能化发展，对新一代弹性化空间体系建设、融合组网、自主运行、智能协同、安全可靠、实时感知与先进空间指挥控制技术等领域的发展，产生深远影响。

    本书内容主要聚焦空间人工智能及在轨应用技术的发展状况、应用需求、基本原理、工程化现状、瓶颈问题及解决思路、未来挑战及发展方向等方面，在部分章节结合实际工程列举典型案例展开深入论证。围绕空间智能信息处理、空间智能感知与控制、空间智能人机交互、空间智能组网与协同等方面的发展现状和应用需求，重点介绍人工智能基础、共性、应用等几类关键技术，通过工程应用牵引理论创新的方式，对AI技术应用于遥感目标检测识别、空间目标监测、在轨自主联合任务规划、智能语义情报生成、在轨情报分发等典型空间任务场景做了初步尝试，并积累了部分经验，具有较强技术性和可读性。

    本书共分为5部分，14章节。其中，第一部分为概论，包含第1章绪论；第二部分为空间人工智能及在轨应用技术发展状况，包含第2章空间智能信息处理发展状况、第3章空间智能感知与控制发展状况、第4章空间智能人机交互发展状况、第5章空间智能组网及协同发展状况；第三部分为空间人工智能及在轨应用技术需求，包含第6章对地观测领域需求、第7章深空探测领域需求、第8章载人航天领域需求、第9章通信与导航领域需求、第10章共性需求；第四部分为空间人工智能及在轨应用技术研究，包含第11章基础技术、第12章共性技术、第13章应用技术；第五部分为结束语，包含第14章空间人工智能及在轨应用的挑战和重点发展方向。

    本书的第一部分、第三部分、第四部分、第五部分由中国空间技术研究院李宗凌编写；第二部分第2章由中国空间技术研究院刘红笛编写；第二部分第3章由中国空间技术研究院张文萱编写；第二部分第4章由中国空间技术研究院王丙昊编写；第二部分第5章由中国空间技术研究院栾申申编写。全书的统稿校对工作由中国空间技术研究院李宗凌负责完成。

    本书在撰写过程中获得多位顶级专家、学者以及团队的指导。在此，感谢中国航天科技集团有限公司于登云院士，正因为有于院士对本书的架构设计和不遗余力的指导，才使得本书具有清晰的脉络和流畅的成文；感谢北京理工大学龙腾院士以及赵保军教授对作者在北京理工大学学习、研究工作的指导；感谢中国空间技术研究院周志成院士对作者的工作指导；感谢中国空间技术研究院汪路元研究员、宋桂萍研究员、禹霁阳研究员、程博文、郝梁、蒋帅等领导、同事在平时研究工作的帮助指导；感谢中国空间技术研究院科技委、中国空间技术研究院情报研究工作，本书的部分研究内容借鉴了其研究成果；本书的研究工作获得了自然科学重点基金项目（U22B2014）的支持；其他对本书撰写有帮助的同行专家，在此一并感谢。

    由于编者水平有限，书中恐有不当之处，敬请读者批评指正。

    李宗凌

    2023年元旦


