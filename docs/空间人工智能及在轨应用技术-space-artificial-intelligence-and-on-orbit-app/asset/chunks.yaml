    # 第五部分　结束语


    人工智能技术自 20 世纪 50 年代提出以来，经过不断发展，已在物联网、智能交通、安全防控等方面得到较好应用。从阿兰·图灵破解了恩尼格玛密码机，为第二次世界大战的胜利做出巨大的贡献开始，到达特茅斯研讨会使用“人工智能”这一词，再到今天人工智能经历
    60 多年的发展。在此期间，人工智能经历三次高潮、两次寒冬的洗礼。


    当前，在深度学习算法的促进下，人工智能携带着云计算、大数据、卷积神经网络，突破了自然语言语音处理、图像识别的瓶颈，为人类带来了翻天覆地的变化。综合来看，人工智能技术在航天领域还处于初步应用阶段，但是在航天领域应用前景广阔，因此亟须结合航天应用特点，突破算法、算力、大数据等基础关键技术。


    在卫星研制、测试、飞控、交付使用等一系列过程中，太空环境下无人值守，测试检修代价大、故障问题因素多等问题一直困扰着科研人员。人工智能支撑卫星系统技术是解决这些问题的有力手段，是下一个十年卫星设计的发展方向之一。未来不仅能够通过在轨大数据处理完整的信息，还能处理残缺的信息，甚至能对残缺的信息进行智能化补充，并根据反馈系统使信息、数据的处理更加成熟、高效、准确。同时，在日常的运行中不断积累经验，使人工智能系统能适应不断变化的环境，逐步实现自动进化机制，使得人工智能系统本身不断学习，将单一的被动处理信息改变为主动智能处理信息，甚至具有一定的预判能力。


    ## 第 14 章　空间人工智能及在轨应用的挑战和重点发展方向


    ### 14.1　空间人工智能及在轨应用的挑战


    当人工智能的运算能力、分析能力、洞察力等超越人类时，人工智能在很多领域提供的解决方案会优于人类。现在，空间系统的设计已经初步呈现“弱智能”。空间人工智能及在轨应用技术的挑战，主要体现在算力、算法、系统
    3 个层面。


    #### 14.1.1　算力层面


    算力层面需要尖端硬件设备。空间系统与人工智能的结合，除软件层面智能算法设计或有不同之外，最为显著的区别要属人工智能支撑系统的差别。与地面支撑系统不同，星载系统在处理性能、传输速度、存储容量以及能源供给上都存在诸多限制。


    ##### 1.处理器


    以地面系统为例，人工智能算法的实现需要强大的计算能力支撑，特别是深度学习算法的大规模使用，对计算能力提出更高的要求。深度学习模型参数多、计算量大，数据的规模更大。在早期使用深度学习算法进行语音识别的模型中，拥有
    429 个神经元的输入层，整个网络拥有 156 兆个参数，训练时间超过 75 天；“阿尔法狗”拥有 1 202 个 CPU，176 个 GPU；人工智能领军人物
    Andrew Ng 和 Jeff Dean 打造的 Google Brain 项目，使用包含 16 000 个 CPU 核的并行计算平台，训练超过 10 亿个神经元的深度神经网络。下一步，如果模拟人类大脑的神经系统，需要模拟
    1 000 亿个神经元，计算能力需求将有数个量级的提升。目前可用于深度神经网络构建与计算的处理器平台包括 CPU、GPU、FPGA 和 ASIC 等。


    ##### 2.传输


    由深度神经网络引领的第三次人工智能高潮同时属于大数据智能，神经网络每时每刻都要接受大量的传感器数据。以自动驾驶为例，摄像机、微波、激光雷达等设备产生的数据每秒超过吉字节。这些数据需要及时地被传输到指定位置，否则网络将不能及时地给予控制器决策支持。目前航天领域采用的
    HT1553B、Space Wire、TTE 等总线技术远远不能达到传输需求，需要技术升级或通过一定手段降低传输需求来解决。


    ##### 3.存储


    传感器实时产生、传输的大量数据以及有价值保留的历史数据都要保存在存储器中。此外，深层神经网络用于记录权值的参数数据也是巨大的，普通的存储器存储速度以及单位体积存储容量都不尽如人意。因此，卫星系统使用多层神经网络对存储器也提出了较高的需求。


    ##### 4.能源


    深度学习通过大量的数据计算完成分类、回归等任务，一个比较贴切的词语用于形容它叫做“暴力美学”。现有存储器用于这种暴力计算时，单能源问题就不是星载供配电所能承担得起的。战胜李世石的
    AlphaGo，能耗约为 173 000 J/s，按照人类每天能耗 2 500 kcal 来算，AlphaGo 功率为人类的 1 000 倍以上，而且人类是多种生理功能的消耗，AlphaGo
    只是单一的围棋运算。


    #### 14.1.2　算法层面


    算法层面需要轻量化、高效能模型。以深度强化学习为代表的人工智能算法，应用于空间领域可以分两步走：一是将深度强化学习应用于地面试验；二是将地面试验应用于空间环境。目前，将深度强化学习技术用于空间机器人任务的学习控制已显示出巨大的潜力，然而在扩展和稳定方面仍然存在许多挑战。深度学习还有很多为人们所诟病的问题。例如，它的收敛性、可解释性、可靠性，很多研究人员正在探索可代替深度学习的更高效的机器学习方法，深度学习之父
    Hinton 也发表过颠覆性的言论：“深度学习要另起炉灶，彻底抛弃反向传播”。


    深度强化学习技术应用于航天领域的挑战如下：


    ①样本效率。尽管深度强化学习算法为智能体提供了学习高维控制策略的通用框架，但它通常需要数百万个训练样本。这使得在真实的场景中直接使用深度强化学习算法训练智能体是不可行的，因为真正的空间系统控制中获取经验样本的代价是相对昂贵的。因此，设计高效的样本算法至关重要。


    ②高实时性。如果不配备特殊的计算硬件，一个具有数百万参数的深度网络前向传递速度可能会相对较慢，可能无法满足控制真实空间系统的实时需求。学习灵巧策略的紧凑表示是可取的。


    ③高安全性。真正的空间系统，如火星巡视器、空间站机械臂等，将在高度动态和潜在危险的环境中运行。对于不同于感知模型的错误预测，一个错误的输出可能导致严重的事故。因此，在实际自主系统上部署控制策略时，应注意将可能结果的不确定性与实际考虑因素结合起来。


    ④稳定性、健壮性和可解释性。深度强化学习算法可能相对不稳定，它们的性能可能会在不同的配置之间有很大的差异。为了解决这一问题，对所学习的网络表示和策略有更深入的了解，可能有助于检测对抗的场景，以防止空间系统受到安全威胁。


    ⑤终身学习。在不同的时间、不同的场景，空间探测器导航或空间站机械臂操作的环境感知会发生变化，这可能会阻碍所学习控制策略的执行。因此，继续学习以适应环境变化的能力以及对已经经历过的环境保持解决办法的能力，具有关键价值。


    ⑥任务之间的泛化。目前，大多数算法都是针对某一特定任务而设计的，这并不理想，因为智能空间系统被期望能够完成一组任务，对所有考虑过的任务进行最少时间的总训练。


    ⑦规范目标的问题。在强化学习中，期望行为是由奖励函数隐式得到。强化学习算法的目标是使累积的长期奖励最大化。虽然在实践中，通常比得到行为本身要简单得多，但在空间系统强化学习中定义一个好的奖励函数却异常困难。学习者必须在奖励信号中观察方差，以便能够改进策略。如果总是收到相同的回报，则无法确定哪个策略更好或更接近最优。


    随着以深度强化学习为代表的人工智能理论和方法研究的不断深入，人类将会在不久的将来实现“解决智能，并用智能解决一切”的目标。


    #### 14.1.3　系统层面


    系统层面需要前沿技术革新。航天与智能结合的关键受限问题有资源有限、数据样本小、无法接受黑盒子状态、可靠性无法保证等。从长期来看，彻底解决星载人工智能运算、传输、存储、能耗等问题需要革新，而革新要依赖于时间与人类科技发展的。但是，航天领域对智能化的需求已迫在眉睫。短期内，智能与航天的结合方式，可不再采用直接降级的民用前沿技术，而是直接深入“前沿技术成果在航天首用”，形成智能航天工程理论，以及从顶层架构上合理规划技术应用方式，避免瓶颈。具体来说有以下几个方面：


    ①推广新型、高效硬件产品。以“小而全”的机器人系统等为试点，在保证可靠性的前提下，积极引入、验证新型高性能产品支持人工智能在卫星领域的应用，包括大规模 FPGA、AI
    专用芯片、高速总线、全闪存阵列等。


    ②将大规模计算向地面转移。将对实时性要求低的运算转移到地面或计算资源相对较多的轨道器等执行，形成天地一体化 AI 运算链路，但是这样会带来传输数据增大的新问题，因此需要优化天地资源配置，最大可能地形成高性能计算有机体。此外，卫星设计过程中许多优化问题都可以以
    AI 技术为手段，提高效率、性能和质量，这一部分都是在地面完成，因此可优先推广地面智能设计技术。


    ③特殊应用采用小规模神经网络或其他智能机器学习方法。在深度学习兴起之前，“好奇号”火星车和一些飞行器已经采用了一些具有自主决策能力的星载软件，如 ASE、APGEN、MAPGEN
    等，这些软件采用符号智能等，以一系列的逻辑对号入座可能遇到的情况。这类算法对计算资源的消耗较低，在一些基础判断任务中可以采用。另外，对于数据集并不太复杂的情况，少数层级的神经网络即可满足要求，这也是目前星载资源可能完成的功能。较高的目标是实现智能学习探测，如
    OASIS 通过训练自己寻找新的反照率特性的科学目标等。


    ④面向智能卫星/探测器开展设计。未来的智能卫星/探测器设计与实施，具有需求可定义、硬件可重组、软件可重配、功能可重构、探测可学习等特点。


    ⑤形成人机共融智能。借助人机共融智能，将航天器的智能行为形成一个自闭环系统，限制在操控人员完全可控范围内。机器计算的特长是速度和精度，人类思维的优势是灵活性和适应性，结合二者各自的优势，形成人机融合智能，取长补短之下，可以降低对硬件的需求，以较少的代价实现高层次的一体化智能系统。


    人工智能是引领未来的战略性技术，将会是国家安全领域的颠覆性力量，其影响可与核能、航空航天、信息和生物技术比肩，以美国 NASA 为首的航天强国已经将太空作为人工智能发挥作用的重要舞台。航天领域对智能化的需求已迫在眉睫：深空探测领域没有智能自主，未来将寸步难行；载人航天器着手智能发展与配置密封舱内智能机器人助手助力航天员的在轨活动；在轨服务航天器将发展以计算机视觉和认知推理为核心的非合作卫星抓捕系统；智能化自主操作或有监督的自主操作成为未来天地系统的重要发展方向；智能军事航天发展融合了多项前沿智能技术等。


    总而言之，为了抢占未来太空的制高点，深入挖掘人工智能与航天技术的可结合性，举众人之力，由点到面，大力开拓空间智能感知、空间智能决策与控制、空间集群智能、空间智能交互、空间智能设计等软硬件与系统前沿技术，托起智能航天的未来。


    ### 14.2　重点发展方向


    #### 1.卫星智能信息系统设计技术


    近年来，地面商用电子系统技术的迅猛发展，使得早期选择的电子器件在型号服役时便已过时。信息系统在设计时应不再基于特定的电子部件构建，而是通过合理的架构设计，提供一个低成本、可扩展并支持项目全生命周期改进和升级的系统，从而降低设计、开发、测试、集成、维护和升级的代价。因此，信息系统的研发可提出如下的设计目标：


    ①基于开放式的系统架构，构成系统核心的采集、处理、传输和存储等资源可根据系统需求灵活扩展、重新配置。


    ②基于已有的商业标准或成熟产品，允许第三方参与星载信息系统的软硬件研发，降低研制成本。


    ③通过时空隔离技术，支持系统局部修改和升级，降低系统更新和重新认证的代价，同时将故障封锁在局部，提升系统整体的可靠性。


    ④开展基于人工智能的信息系统设计方法研究，利用人工智能知识完成各类指令、遥测以及业务数据的处理，实现可满足多种任务灵活扩展、并支持在故障情况下系统资源灵活重构的处理平台。


    #### 2.基于人工智能的在轨故障检测与维护技术


    卫星系统是一个动态系统，在轨运行时需要监测其工作状态，当出现故障时还需要进行诊断。另外，卫星各个重要系统都采取了冗余备份措施，希望在出现故障时能通过重构恢复功能。状态检测、故障诊断和系统重构是卫星自主运行的重要组成部分。采用人工智能技术，实现智能化与自主化，可以提高卫星在轨运行的稳定性和生存能力。


    #### 3.基于人工智能的卫星智能控制技术


    卫星智能控制包括天地大回路和在轨方式。伴随着计算机与人工智能的发展，基于人工智能的卫星智能控制技术是未来的发展主流。


    结合人工智能技术，发展在轨高级无人自主控制技术，使得卫星自主完成制导、导航和控制（GNC）、数据处理、故障判断和部分重构与维修工作，从而大大减少对地面测控、通信等支撑系统的依赖。实现实时智能自主姿态控制、智能自主
    GNC 以及智能信息技术在航天控制系统、平台和有效载荷上的应用。


    #### 4.基于人工智能的星地一体化技术


    随着星地一体化信息网络重大工程的推进，有关天基信息系统建设的思路正在逐渐清晰，但是传统的天基信息系统在轨信息处理能力较差，无法满足高时敏、多任务协同等多样性天基信息服务要求。


    结合人工智能技术，通过星间链路连接，形成虚拟大卫星，为用户提供高性能、高效能空间信息处理服务，具有极高的系统弹性和抗毁性，实现综合感知、信息汇聚处理、高速分发、网络管理、安全防护等多功能一体，是地面综合数据中心的空间形态，将有效突破太空时空大尺度特性对信息时效性的约束，创新天基信息服务模式。


    #### 5.基于人工智能的卫星载荷技术


    借助人工智能技术手段，在载荷研制引入软件定义、智能化等新理念，提升载荷的智能化水平和灵活程度，让卫星更加地好用、易用，大幅提升用户的使用体验。


    具体包括：软件定义卫星技术，研究以软件无线电为重点的软件定义卫星技术，实现可智能化自主灵活配置参数的卫星通信载荷功能；柔性载荷技术，研究实现柔性载荷所需的软件和硬件技术，并合理分配软硬件的功能和定位。


    #### 6.智能计算芯片技术


    随着人工智能算法和应用技术的日益发展，以及人工智能芯片产业环境的逐渐成熟，使得智能计算芯片技术成为空间人工智能及在轨应用技术发展的核心关键。


    处理能力更强的 CPU/GPU、资源更多的 FPGA、通用 AI 处理器是支撑复杂算法的基础，也是将调制解调器、变频器、控制器、编解码、滤波器、波束等形成数字化的平台。这些芯片能力越强大，软件能力就可以越强大，越容易实现软件化，进而智能化。


    #### 7.小结


    人工智能技术可在航天器全领域、全生命周期与现有航天技术体系深度融合发展，在航天器研制、运行、应用和管控等方面发挥巨大作用。


    利用以深度学习、知识推理为代表的新一代人工智能技术，围绕感知、认知、沟通、推理、决策等人类智能要素，设计可实现近似人类行为的智能信息系统，使航天器具备“会看、会说、会听、会思考”的能力，可以随时随地接受用户定制任务，自主决策、自主协同完成任务，为用户提供灵活、连续、稳定服务，提升航天器使用体验，是空间人工智能及在轨应用技术的第一要务。


