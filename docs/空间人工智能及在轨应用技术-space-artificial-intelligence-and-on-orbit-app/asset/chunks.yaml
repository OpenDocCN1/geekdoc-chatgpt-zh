    ## 迁移学习理论研究

    从理论层面上来看，迁移学习问题研究以下问题：第一，什么条件下从源领域数据训练出的分类器能够在目标领域表现出优异的分类性能，即什么条件下可进行迁移。第二，给定无标注目标领域，或者有少量的标记数据，如何在训练过程中与大量有标记的源数据结合使得测试时的误差最小，即迁移学习算法的研究。


    目前，对迁移学习理论研究比较多的主要是在领域适应性方面。关于领域适应性问题的理论分析最早是在 2007 年提出的，最初主要基于`VC`维对领域适应性问题给出了推广性的界，定义了分布之间的距离，此距离与领域适应性有关。在此基础上，对有限`VC`维情况，从有限个样本估计适应推广能力。但当`VC`维不是有限的情况下会有什么样的结论该文并未给出研究，需要进一步探讨。另外，不同的领域分布之间的距离会得出不同精度的误差估计，由此可以通过研究各具特色的距离以解决领域适应性问题，从而适应不同应用场合的需要。


    `Ben.David`通过实验指出`SCL`（`Structural Correspondence Learning`）方法确实能够达到在距离最小的同时间隔损失最低，从而提高目标领域上的学习性能。`Ben.David`等人分析了领域数据的表示，并提出了一个很好的模型，该模型不仅最小化分类模型在训练数据上的泛化误差，而且最小化源领域与目标领域之间的不同性。从源数据加权组合获得模型，并给出在特定的经验风险最小化的情形下的误差率，该类方法最新的成果发表在
    2010 年的《`Machine Learning`》杂志上。该文研究了在什么条件下一个分类器能在目标领域很好地完成分类任务，还研究了给定目标领域少量的、已标注的样本，如何在训练过程中把它们与大量的、已标注的源数据相结合，以实现目标误差最小。


    `Mansour`指出，对任意给定的目标函数，存在一个对源假设的领域加权分布组合使得损失至多为给定的值。他还对于任意的目标分布，给出了基于源领域和目标领域之间的`Rényi`散度的领域推广误差，更为精确的推广误差上界估计应用到回归和一般的损益函数，并提出通过加权实现经验分布能够更好地反映目标领域分布。该文使用积分概率度量来测量两个域的分布之间的差异，同时与`H-散度`和差异距离进行了比较。同时，针对多领域分别开发了`Hoeffding`型、`Bennett`和`McMiarmid`型偏差不等式，然后给出了对称不等式。接下来，又利用以上不等式分别获得基于统一熵数的`Hoeffding`型和`Bennett`型泛化边界。


    虽然对迁移学习已经进行了一些理论尝试，但在实际应用中未知领域的模型往往难以精确建立，这就导致在很多实际应用情况下，迁移学习往往无法快速收敛或者完全无法收敛，因此对迁移学习有效性的理论研究还有待进一步深入。


