- raw: "由于LEO高度动态的星座拓扑，必须调整地面上的路由协议，以有效适应规则的拓扑变化。然而，对于异常链路故障/恢复导致的不规则拓扑变化，网络范围的路由泛洪对于路由收敛仍然是必要的。但是，由于星座拓扑的高密度，这将导致显著的流量泛洪冗余。对于更大规模的星座，冗余问题将加剧。为解决上述在LEO卫星中泛洪冗余问题，Ruan\
    \ G等人提出了一种轻量级路由泛洪机制，即通过生成稀疏泛洪拓扑来修剪原始全网格拓扑，并仅泛洪稀疏拓扑上的路由信息。通过考虑最大泛洪跳数以及泛洪拓扑的鲁棒性，基于搜索算法设计了一种算法来计算最优拓扑，而不是仅仅应用最小生成树。\n\
    \n3）面向流量动态到达的路由算法\n\n小卫星网络（Small Satellite Network，SSN）有高度动态的拓扑变化和随机分组到达的特点，传统卫星网络中的路由不能直接用于大规模SSN。具体表现为，由于随机业务传输模式，无论是预先计算的拓扑描述还是调度路由方案中预先设计的联系表，预先计算好的路由都无法适应随机到达的流量。另外，SSN的高度动态特性使得分布式路由中的状态收集开销非常巨大。因此，Li\
    \ J等人提出了一种时态网格模型（TNM）来描述大规模SSN的时变拓扑。在TNM中，使用静态立方体（即网络网格）来替换卫星的坐标。这样，TNM可以记录时间连续的拓扑信息，每个卫星只需要存储固定数量的网络网格，拓扑描述的精度将由网格划分的方式决定。基于状态感知的网络网格路由算法，首先提出了信标协议，通过定期收集相邻卫星的状态，卫星可以动态调整路由决策。然后提出一种基于网络网格的最短路径路由（NSR）算法来解决最优路径查找问题。仿真结果表明，在随机星间链路中断的情况下，随着中断概率的增加，与基准算法相比，NSR的丢包率更稳定；相较于基于TGM的Dijkstra算法，NSR具有更低的复杂度。\n\
    \nLEO网络中波束和卫星的切换需要改变卫星的路由信息。当卫星移动到人口密集的服务区域时，瞬时高速率变化对路由协议提出了独特的挑战，路由协议需要支持频繁变化而不会丢包。因此，路由算法应支持终端做出的动态负载平衡决策。Markovitz\
    \ O等人提出了一种需求分割路由（DSR）算法，解决了将业务从源终端路由到目的终端（连接到多个卫星）的问题，同时保证并实现服务度量/QoS（带宽和延迟）的规划。仿真结果表明，与基线算法相比，在出现故障的极端情况下，DSR仍能实现较高的用户满意率。\n\
    \n2.多路径路由算法\n\n多路径路由可以显著提高网络吞吐量，降低端到端延迟。基于网络编码的多路径路由消除了多路径之间复杂的协调，进一步提高了数据传输效率。然而，传统基于网络编码的多路径路由协议对于链路时延长、网络拓扑规则的近地轨道卫星网络效率低下。因此，Tang\
    \ F等人提出了基于源和目的地址的多路径协同路由算法，将基于网络编码的多径协作路由问题定义为寻找数据流的最佳路径集，目标是最大化系统吞吐量；提出了基于网络编码的LEO卫星网络多路径协同路由（NCMCR）协议，以提高卫星网络的吞吐量。\n\
    \n3.负载均衡路由算法\n\n卫星网络中，随机流量的到达和热点地区分布导致流量分布不均匀，破坏了负载平衡，甚至导致部分节点拥塞。因此，Li X等人提出了一种低轨卫星网络的状态感知和负载平衡（SALB）路由模型，考虑了高流量负载场景下链路状态的频繁变化，目标是在负载均衡的前提下减小端到端时延。具体来说，首先提出了一种定量估计链路状态并动态调整排队延迟权重的机制；其次提出了一种状态感知和负载均衡路由（SALB）模型，该模型考虑了各种情况，包括负载变化、链路和节点故障和恢复；最终路由表在每次切换开始时重置，并通过两个连续切换之间的有效最短路径树算法动态更新，通过高效的最短路径树算法动态更新，显著降低路由开销。\n\
    \n4.节能路由算法\n\n卫星互联网中，卫星的质量和体积受到限制，卫星的电池容量有限。现有的卫星网络节能路由方案主要关注流量分配和端到端延迟，且使用实时网络信息进行优化，可行性较低。因此，需要一种同时考虑能源效率、时延、流量分配，且不需要实时网络信息的路由策略。Liu\
    \ J等人提出了一种基于深度强化学习的高效路由协议DRL-ER，以实现在给定端到端延迟限制的情况下以最小的能量消耗进行路由，避免了星座的电池能量不平衡，并能保证所需的有界端到端延迟。具体而言，首先采用经验回放方法对不同卫星能源环境下的路由策略学习进行了研究，此模型对各种卫星电池条件和端到端延迟边界具有更好的适应能力；其次建立能量收集和消耗的模型，并将路由问题建模为一个马尔可夫决策过程，通过DRL算法使代理在每个epoch都采取最佳的行动，并针对传统DQN利用率低、训练慢、难收敛的特性，提出了一种智能路由算法DRL-ER。仿真结果表明，与基线算法相比，DRL-ER协议平均降低了超过55%的卫星能源消耗，并显著延长了星座的寿命。\n\
    \n5.安全路由算法\n\n安全路由算法对低轨道卫星网络生存性能起着至关重要的作用。然而，由于星间链路的不稳定性、开放性和暴露性，LEO卫星网络内部路由容易受到恶意攻击。针对LEO卫星网络生存能力中传统的基于密码学的安全技术无法解决的内部网络攻击，为提高LEO卫星网络解决内部攻击的能力，Li\
    \ H等人提出了一种基于节点信任的LEO卫星网络安全路由算法，称为SLT。SLT基于分布式信任评估模型，通过D-S证据理论计算卫星节点之间的直接信任、间接信任和综合信任值。然后，将低代价OPSPF路由协议与信任评估相结合，设计了SLT算法。STL算法通过对卫星网络中恶意节点的及时检测和隔离，可以减少内部攻击造成的恶意丢包的影响。仿真结果表明，与OPSPF算法相比，SLT算法的投递率平均提高了27%，丢包率平均降低了70%。\n\
    \n5.3.3　空间资源管理和协同\n\n1.资源分配与调度\n\n天地一体化网络是未来通信网络的一个重要方向，然而卫星网络和地面网络的融合会带来更复杂的干扰，因此有效的资源分配对于实现更好的性能非常重要。Zhu\
    \ X等人提出了一种基于两层博弈的卫星-地面云一体化网络资源分配问题。运营商提供不同服务质量（QoS）和价格的两个层次的服务，制定基于两层博弈的资源分配问题，以最大化运营商的效用；基于用户的服务选择，解决能量最小化问题，在满足QoS约束的同时在用户之间分配功率和计算资源；分析效用与定价策略的演化关系，最终找到系统的Stackelberg平衡点，得到最优定价以及运营商的资源配置策略；提供数值结果分析用户在博弈模型中的行为，评估最优定价和资源配置策略的性能。仿真结果表明，所提出的算法能够得到最优的资源分配策略，能耗随着可用虚拟机数量的增加而快速下降，然后在有足够虚拟机可用时趋于稳定值。\n\
    \n利用天地一体化网络为远程物联网应用提供服务，已经成为工业界和学术界的一种趋势。为了管理天地一体化网络中的多维资源，采用软件定义的网络架构，利用虚拟化将地面和卫星网络资源融合。然而，现有的研究主要是对一种或两种资源的管理，没有考虑多维资源。因此，Chen\
    \ D等人提出了一种基于MCPR算法的资源立方体（MCRC）算法来降低系统总时延。文章设计了一个效用函数，可以在预定义的时间延迟内最大限度地利用资源。由于STN中存在异构网络，选择匹配博弈来确定为IIoT应用提供服务的网络节点。随着IIoT节点数量的增加，网络规模也变得非常大。同时，有效的资源分配方案通常需要来自网络的全局信息，随着网络规模的增加，这些信息难以获得。因此，采用马尔可夫近似和马尔可夫链的均值匹配。仿真结果表明，所提出的算法虽然资源利用率略有降低，但系统总时延的表现却大大提高。\n\
    \n2.虚拟网络功能协同\n\n在基于SDN/NFV的低轨卫星网络中，如何实现服务提供的资源协同是一个关键问题。然而，卫星相对运动导致动态网络拓扑和动态资源可用性，难以准确地表示异构资源以及资源之间相互关系；卫星有效载荷有限，应高效共享和调度相应资源；虚拟网络功能（VNF）编排和路由之间的这种耦合使SDLSN资源分配变得复杂。间歇性卫星到卫星（S2S）链路使SDL-SN中的路由比地面网络更难处理。因此，Jia\
    \ Z等人通过时间演化图上的虚拟网络功能（VNF）编排研究服务提供问题。针对卫星到卫星链路稀缺、间歇性和不稳定问题，设计了一种基于Dantzig-Wolfe分解、列生成和分支定界耦合的分支定价算法，以有效获得最优解。为了获得更快的实际使用解决方案，进一步为子问题设计一种近似算法，并利用波束搜索来加速搜索树的修剪。仿真结果表明，所提出的算法在分支时采用波束搜索，有效地获得具有保证间隙的满意解，具有较高效率。\n\
    \n对于一些没有地面网络覆盖的偏远地区，LEO卫星网络可以帮助收集来自远程物联网用户的数据，并将其传输到地面的云数据中心进一步进行处理。由于LEO卫星网络的性质，远程物联网用户与云数据中心之间的传输延迟将难以满足物联网用户的实时性要求。此外，随着物联网用户数量的增加，可用的网络带宽将减小，从而导致网络拥塞。考虑到实时处理的服务需求以及最小的网络带宽利用率，同时考虑LEO卫星在计算、存储、带宽和能源方面的资源能力有限，为了提高LEO卫星网络的运行效率，多颗LEO卫星可以通过网络功能虚拟化（NFV）技术以协作的方式为物联网用户提供计算服务。Gao\
    \ X等人提出了基于潜在博弈（PGRA）的去中心化资源分配算法，通过找到纳什均衡来解决VNF放置问题。为每个用户对卫星的请求部署VNF时，共同最小化服务器能量、网络带宽和服务延迟的总体部署成本，在保证最低总体部署成本的情况下，为卫星网络中尽可能多的用户请求提供计算服务。仿真结果表明，与基线算法相比，PGRA能够提高网络收益和用户请求成功率。\n\
    \n卫星边缘云可以通过结合边缘计算和云计算的优势，为众多物联网用户提供灵活的服务供应。Gao X等人研究了卫星边缘云中虚拟网络功能（VNF）放置的动态资源分配问题。首先，将VNF放置问题表述为一个整数非线性规划问题，目标是最小化服务端到端延迟和网络带宽成本。其次，提出了一种分布式虚拟网络功能放置（D-VNFP）算法来解决该问题。根据网络资源的可用性更新当前卫星网络状态，其中前一个时隙完成的用户请求所使用的网络资源可以被释放为下一个时隙新用户请求的可用资源。然后收集新的用户请求以出现在下一个时隙，并通过提出的D-VNFP算法按需分配可用资源。仿真结果表明，与基线算法相比，D-VNFP算法能够降低5.85%的网络带宽消耗和2.38%的平均服务端到端延迟，增加5.93%的用户请求成功率。\n\
    \n3.服务功能链资源协同\n\n为满足日益增长的空天地一体化网络中时延敏感业务的需求，应正确配置网络资源，并根据时延和抖动来规划业务功能链的部署。Zhang\
    \ P等人提出了一种基于延迟感知的服务功能链映射算法，输入为SFC请求和物理网络，输出为部署链路延迟和部署路径；根据请求的大小、带宽要求和延迟要求对SFC请求进行分类，每个请求都属于一种业务类型；在每项服务中，采用KSP算法选择k条时延最短、资源开销较小的路径，计算每条路径的资源开销和延迟，选择延迟最小的路径作为SFC的部署路径。如果部署路径的延迟小于用户指定的延迟，则形成SFC，否则SFC部署失败。仿真结果表明，使用其所提出的算法，CPU资源利用率提高27.8%，链路资源利用率提高22.7%，服务接受率提升21.5%，时延性能提升38.2%，总资源消耗降低25.2%。\n\
    \n定制化的空间信息网络（SIN）用于执行特定的太空任务。然而，定制化的卫星网络之间缺乏互动和协作，导致资源利用不足。此外，现有SIN无法更新软硬件设施，为先进的传输技术和策略的应用带来了巨大挑战。为了应对这些挑战，Yang\
    \ H等人研究了空间信息网络中具有服务功能链（SFC）约束的最大流量路由策略，其中SFC由特定有序的服务功能序列组成，任务流必须经过这些以预定义的顺序运行。首先，对时变SIN由时间扩展图（TEG）建模，基于TEG将问题表述为线性规划问题。其次，为了降低解决大规模SIN的线性规划问题的复杂性，提出了一种基于SFC约束图论（SFC-GT）的低复杂度近似最优算法。该算法将问题表述为受SFC约束的单一商品最大流量问题。此外，提出了SFC约束增广路径选择（SFC-APS）算法搜索SFC约束增广路径。通过迭代搜索SFC约束的增广路径和更新SFC约束的残差网络，SFC-GT算法可以提供接近最优的最大流量路由策略，且复杂度大大降低。仿真结果证明，与基线算法相比，其所提出的算法性能接近最优性能。\n\
    \n4.虚拟网络映射\n\n天地一体化网络（SAGIN）具有异构型、时变性和自组织等特性，受到流量分布、路由调度、功率控制、频谱分配和负载平衡等许多因素的限制。其中，异构物理网络资源的分配和调度是一个关键问题。Zhang\
    \ P等人基于虚拟网络架构和深度强化学习（DRL），将天地一体化网络的异构资源编排建模为多域虚拟网络映射（VNE）问题，并提出了天地一体化网络跨域VNE算法，算法的本质是异构网络资源的分配。首先对SAGIN的不同网段进行建模，根据SAGIN的实际情况和用户需求设置网络属性。在DRL中，代理由5层策略网络充当。基于从SAGIN中提取的网络属性建立特征矩阵，并将其用作代理训练环境。通过训练，得出每个底层节点被嵌入的概率。在测试阶段，根据概率依次完成虚拟节点和链接的嵌入过程。深度强化学习（DRL）本质上是一个端到端的感知和控制系统，具有很强的通用性，通常用于解决高维空间中的决策问题。仿真结果表明，与基线算法相比，其所提出的算法能够取得更好的网络性能，并能够提高异构网络资源分配的效率和合理性。\n\
    \n在SAGIN中，如何实现网络资源的高效调度正是需要解决的问题。针对不同网段的特点和差异化用户需求，Zhang P等人提出了强化学习辅助宽带感知虚拟网络资源分配算法（RL-BAVNA），代理在节点嵌入阶段从底层网络中提取一个特征矩阵，并将其作为策略网络的输入，输出为节点嵌入到底层网络的概率。仿真结果表明，其所提出的算法在长期平均收益、接受率和长期收益成本比3个方面都优于传统的虚拟网络资源分配算法。\n\
    \n5.4　未来趋势\n\n多层次太空体系架构要求天基星座系统具有规模巨大、动态组网协同、体系复杂、多任务多用途、智能自治、敏捷重构、弹性健壮等显著技术特征。多功能可重构网络化技术是支撑未来多层太空体系发展的核心技术。\n\
    \n首先，面向巨星座的智能多功能技术是发展多层太空体系的先决条件。未来多层太空系统形态巨量复杂，系统构建高度不确定。星座系统的研制与运行受技术、市场等多种不确定性的影响，存在巨大不确定性、投资高风险性，需要巨星座系统具有面向不确定性的灵活设计。同时，星座体系个体需要具备强自主与高度自治能力。随着组网星座中卫星数量的增多，传统针对单星的地面测运控模式已经不能满足巨星座组网需求，组网星座卫星将向自主自治方向发展。通过自主调配星座/星内资源完成感知、通信等不同类型任务，满足用户应用需求；能够自行实施星座轨道调整与轨道维持等操作，大幅降低对地面测运控支持等需求。\n\
    \n其次，可重构技术支撑多层次太空系统弹性及灵活能力重组。多层太空系统呈现群体涌现行为，任何卫星节点的受损能够快速重组空间资源，不因外部环境导致整体集群能力空缺。美国DARPA的Blackjack项目，旨在构建功能可扩展、规模可适变、软硬件自适应的空间体系结构；美国太空发展局下一代太空体系架构，其基本思路是利用大规模和分布式，快速生成作战能力，其核心都是通过将低成本传感器（通信、导航、侦察、预警等载荷）与相互协作的巨型空间系统灵活组合，提升体系抗摧毁和快速响应能力。\n\
    \n再次，网络化技术支撑多层次太空系统互联互通、天地一体化建设。组网星座将逐步实现弱中心化甚至去中心化，安全鲁棒性不断提升。传统集中式网络架构已不能满足巨星座网络接入、交换、控制等需求，去中心化成为未来超大规模空间网络典型特征，网络架构的转变，将大幅提升星座整体安全性和鲁棒性，即使在组网星座内部部分卫星失能失效情况下也能够保证业务连续可用。同时，系统具有高度动态群体智能演化特性。对于由成千上万颗卫星组成的空间巨复杂系统，部署周期长、服役周期长，系统建设和运控模式需要考虑未来较长时期的不断演化需求。传统单个卫星提前设定的任务模式和单个卫星的管控模式已无法满足巨星座需求，巨星座系统对其自身的在体系、系统、节点各层面的学习进化能力提出了要求，并可按照任务需求将能力扩展至所有任务节点，具备在更高维且动态的真实场景中通过自主交互和决策完成更错综复杂的空间任务。\n\
    \n以低轨道巨型星座和混合网络架构为特征的卫星网络呈现快速发展趋势，正在实现从“天星地网”向“天基组网”的演进。传统天基网络技术已基本成熟，包括国际空间数据系统咨询委员会（CCSDS）、时延容忍网络（Delay\
    \ Tolerant Network，DTN）在内的传统空间网络体制协议均已完成标准化。同时，地面网络技术向太空网络的辐射和带动作用日益凸显。学术界正在探索软件定义网络（Software\
    \ Defined Network，SDN）、信息中心网络（Information Centric Networking，ICN）等新兴网络技术在巨型星座组网中的应用，以提供更为便捷的复杂网络管理和多业务承载。智能所带来的赋能效果，源于卫星宽带通信网络的复杂化与泛在性，也在于从网络到信息再到智能的结合。智能、信息和网络结合的优势巨大，是未来发展方向。\n\
    \n\uFEFF\n\n第三部分　空间人工智能及在轨应用技术需求\n\n智能航天时代逐渐拉开帷幕，人工智能作为天基系统网络化、信息化、智能化的核心基础技术，将广泛应用于对地观测、深空探测、通信导航、载人航天等各领域。通过人工智能+航天器的技术手段，提升遥感信息获取、通信信息保障、多域协同等航天应用的智能化水平，将在未来竞争中占领先机。\n\
    \n\uFEFF\n\n第6章　对地观测领域需求\n\n针对未来智能化应用对高技术强实时条件下的网络化空间信息保障需求，面向网络化协同的高分对地观测系统，需具备3个方面的能力，即网络协同能力、知识进化能力和智能服务能力。这3项能力需涵盖任务接收、智能解析、智能执行、智能信息提取与精准推送的系统信息服务过程。对地观测领域对空间人工智能及在轨应用技术需求迫切，主要体现在以下5个方面：一是观测效率提升需求；二是应急突发事件快速响应需求；三是复杂应用需求推动下多星协同需求；四是航天遥感信息高效实时分发需求；五是用户使用体验提升需求。\n\
    \n6.1　观测效率提升需求\n\n现阶段卫星由于使用模式、星上处理等方面的欠缺，导致卫星观测效率较低，主要表现在以下两个方面：\n\n①卫星每轨完成的任务数量少，潜力难以发挥。现有卫星的使用主要依靠地面，由地面提前规划未来一天或几天的预定任务，星上按照地面规划结果执行。这种规划模式对卫星的约束条件都是静态的（如每圈只能侧摆两次，每圈只能工作5\
    \ min等），由于卫星自主管理能力较弱，地面用户在进行任务规划时，为安全起见，一般对卫星资源（如能源、存储等资源）的分配都留有较大余量，导致卫星支持完成任务的数量受限，潜力难以发挥。"
  fmt: '

    # 卫星网络路由与资源管理


    ## 泛洪路由优化

    由于`LEO`高度动态的星座拓扑，必须调整地面上的路由协议，以有效适应规则的拓扑变化。然而，对于异常链路故障/恢复导致的不规则拓扑变化，网络范围的路由泛洪对于路由收敛仍然是必要的。但是，由于星座拓扑的高密度，这将导致显著的流量泛洪冗余。对于更大规模的星座，冗余问题将加剧。为解决上述在`LEO`卫星中泛洪冗余问题，Ruan
    G等人提出了一种轻量级路由泛洪机制，即通过生成稀疏泛洪拓扑来修剪原始全网格拓扑，并仅泛洪稀疏拓扑上的路由信息。通过考虑最大泛洪跳数以及泛洪拓扑的鲁棒性，基于搜索算法设计了一种算法来计算最优拓扑，而不是仅仅应用最小生成树。


    ## 3）面向流量动态到达的路由算法

    小卫星网络（Small Satellite Network，`SSN`）有高度动态的拓扑变化和随机分组到达的特点，传统卫星网络中的路由不能直接用于大规模`SSN`。具体表现为，由于随机业务传输模式，无论是预先计算的拓扑描述还是调度路由方案中预先设计的联系表，预先计算好的路由都无法适应随机到达的流量。另外，`SSN`的高度动态特性使得分布式路由中的状态收集开销非常巨大。因此，Li
    J等人提出了一种时态网格模型（`TNM`）来描述大规模`SSN`的时变拓扑。在`TNM`中，使用静态立方体（即网络网格）来替换卫星的坐标。这样，`TNM`可以记录时间连续的拓扑信息，每个卫星只需要存储固定数量的网络网格，拓扑描述的精度将由网格划分的方式决定。基于状态感知的网络网格路由算法，首先提出了信标协议，通过定期收集相邻卫星的状态，卫星可以动态调整路由决策。然后提出一种基于网络网格的最短路径路由（`NSR`）算法来解决最优路径查找问题。仿真结果表明，在随机星间链路中断的情况下，随着中断概率的增加，与基准算法相比，`NSR`的丢包率更稳定；相较于基于`TGM`的`Dijkstra`算法，`NSR`具有更低的复杂度。


    `LEO`网络中波束和卫星的切换需要改变卫星的路由信息。当卫星移动到人口密集的服务区域时，瞬时高速率变化对路由协议提出了独特的挑战，路由协议需要支持频繁变化而不会丢包。因此，路由算法应支持终端做出的动态负载平衡决策。Markovitz
    O等人提出了一种需求分割路由（`DSR`）算法，解决了将业务从源终端路由到目的终端（连接到多个卫星）的问题，同时保证并实现服务度量/`QoS`（带宽和延迟）的规划。仿真结果表明，与基线算法相比，在出现故障的极端情况下，`DSR`仍能实现较高的用户满意率。


    ## 2.多路径路由算法

    多路径路由可以显著提高网络吞吐量，降低端到端延迟。基于网络编码的多路径路由消除了多路径之间复杂的协调，进一步提高了数据传输效率。然而，传统基于网络编码的多路径路由协议对于链路时延长、网络拓扑规则的近地轨道卫星网络效率低下。因此，Tang
    F等人提出了基于源和目的地址的多路径协同路由算法，将基于网络编码的多径协作路由问题定义为寻找数据流的最佳路径集，目标是最大化系统吞吐量；提出了基于网络编码的`LEO`卫星网络多路径协同路由（`NCMCR`）协议，以提高卫星网络的吞吐量。


    ## 3.负载均衡路由算法

    卫星网络中，随机流量的到达和热点地区分布导致流量分布不均匀，破坏了负载平衡，甚至导致部分节点拥塞。因此，Li X等人提出了一种低轨卫星网络的状态感知和负载平衡（`SALB`）路由模型，考虑了高流量负载场景下链路状态的频繁变化，目标是在负载均衡的前提下减小端到端时延。具体来说，首先提出了一种定量估计链路状态并动态调整排队延迟权重的机制；其次提出了一种状态感知和负载均衡路由（`SALB`）模型，该模型考虑了各种情况，包括负载变化、链路和节点故障和恢复；最终路由表在每次切换开始时重置，并通过两个连续切换之间的有效最短路径树算法动态更新，通过高效的最短路径树算法动态更新，显著降低路由开销。


    ## 4.节能路由算法

    卫星互联网中，卫星的质量和体积受到限制，卫星的电池容量有限。现有的卫星网络节能路由方案主要关注流量分配和端到端延迟，且使用实时网络信息进行优化，可行性较低。因此，需要一种同时考虑能源效率、时延、流量分配，且不需要实时网络信息的路由策略。Liu
    J等人提出了一种基于深度强化学习的高效路由协议`DRL-ER`，以实现在给定端到端延迟限制的情况下以最小的能量消耗进行路由，避免了星座的电池能量不平衡，并能保证所需的有界端到端延迟。具体而言，首先采用经验回放方法对不同卫星能源环境下的路由策略学习进行了研究，此模型对各种卫星电池条件和端到端延迟边界具有更好的适应能力；其次建立能量收集和消耗的模型，并将路由问题建模为一个马尔可夫决策过程，通过`DRL`算法使代理在每个`epoch`都采取最佳的行动，并针对传统`DQN`利用率低、训练慢、难收敛的特性，提出了一种智能路由算法`DRL-ER`。仿真结果表明，与基线算法相比，`DRL-ER`协议平均降低了超过55%的卫星能源消耗，并显著延长了星座的寿命。


    ## 5.安全路由算法

    安全路由算法对低轨道卫星网络生存性能起着至关重要的作用。然而，由于星间链路的不稳定性、开放性和暴露性，`LEO`卫星网络内部路由容易受到恶意攻击。针对`LEO`卫星网络生存能力中传统的基于密码学的安全技术无法解决的内部网络攻击，为提高`LEO`卫星网络解决内部攻击的能力，Li
    H等人提出了一种基于节点信任的`LEO`卫星网络安全路由算法，称为`SLT`。`SLT`基于分布式信任评估模型，通过`D-S`证据理论计算卫星节点之间的直接信任、间接信任和综合信任值。然后，将低代价`OPSPF`路由协议与信任评估相结合，设计了`SLT`算法。`STL`算法通过对卫星网络中恶意节点的及时检测和隔离，可以减少内部攻击造成的恶意丢包的影响。仿真结果表明，与`OPSPF`算法相比，`SLT`算法的投递率平均提高了27%，丢包率平均降低了70%。


    ## 5.3.3　空间资源管理和协同


    ### 1.资源分配与调度

    天地一体化网络是未来通信网络的一个重要方向，然而卫星网络和地面网络的融合会带来更复杂的干扰，因此有效的资源分配对于实现更好的性能非常重要。Zhu X等人提出了一种基于两层博弈的卫星-地面云一体化网络资源分配问题。运营商提供不同服务质量（`QoS`）和价格的两个层次的服务，制定基于两层博弈的资源分配问题，以最大化运营商的效用；基于用户的服务选择，解决能量最小化问题，在满足`QoS`约束的同时在用户之间分配功率和计算资源；分析效用与定价策略的演化关系，最终找到系统的`Stackelberg`平衡点，得到最优定价以及运营商的资源配置策略；提供数值结果分析用户在博弈模型中的行为，评估最优定价和资源配置策略的性能。仿真结果表明，所提出的算法能够得到最优的资源分配策略，能耗随着可用虚拟机数量的增加而快速下降，然后在有足够虚拟机可用时趋于稳定值。


    利用天地一体化网络为远程物联网应用提供服务，已经成为工业界和学术界的一种趋势。为了管理天地一体化网络中的多维资源，采用软件定义的网络架构，利用虚拟化将地面和卫星网络资源融合。然而，现有的研究主要是对一种或两种资源的管理，没有考虑多维资源。因此，Chen
    D等人提出了一种基于`MCPR`算法的资源立方体（`MCRC`）算法来降低系统总时延。文章设计了一个效用函数，可以在预定义的时间延迟内最大限度地利用资源。由于`STN`中存在异构网络，选择匹配博弈来确定为`IIoT`应用提供服务的网络节点。随着`IIoT`节点数量的增加，网络规模也变得非常大。同时，有效的资源分配方案通常需要来自网络的全局信息，随着网络规模的增加，这些信息难以获得。因此，采用马尔可夫近似和马尔可夫链的均值匹配。仿真结果表明，所提出的算法虽然资源利用率略有降低，但系统总时延的表现却大大提高。


    ### 2.虚拟网络功能协同

    在基于`SDN`/`NFV`的低轨卫星网络中，如何实现服务提供的资源协同是一个关键问题。然而，卫星相对运动导致动态网络拓扑和动态资源可用性，难以准确地表示异构资源以及资源之间相互关系；卫星有效载荷有限，应高效共享和调度相应资源；虚拟网络功能（`VNF`）编排和路由之间的这种耦合使`SDLSN`资源分配变得复杂。间歇性卫星到卫星（`S2S`）链路使`SDL-SN`中的路由比地面网络更难处理。因此，Jia
    Z等人通过时间演化图上的虚拟网络功能（`VNF`）编排研究服务提供问题。针对卫星到卫星链路稀缺、间歇性和不稳定问题，设计了一种基于`Dantzig-Wolfe`分解、列生成和分支定界耦合的分支定价算法，以有效获得最优解。为了获得更快的实际使用解决方案，进一步为子问题设计一种近似算法，并利用波束搜索来加速搜索树的修剪。仿真结果表明，所提出的算法在分支时采用波束搜索，有效地获得具有保证间隙的满意解，具有较高效率。


    对于一些没有地面网络覆盖的偏远地区，`LEO`卫星网络可以帮助收集来自远程物联网用户的数据，并将其传输到地面的云数据中心进一步进行处理。由于`LEO`卫星网络的性质，远程物联网用户与云数据中心之间的传输延迟将难以满足物联网用户的实时性要求。此外，随着物联网用户数量的增加，可用的网络带宽将减小，从而导致网络拥塞。考虑到实时处理的服务需求以及最小的网络带宽利用率，同时考虑`LEO`卫星在计算、存储、带宽和能源方面的资源能力有限，为了提高`LEO`卫星网络的运行效率，多颗`LEO`卫星可以通过网络功能虚拟化（`NFV`）技术以协作的方式为物联网用户提供计算服务。Gao
    X等人提出了基于潜在博弈（`PGRA`）的去中心化资源分配算法，通过找到纳什均衡来解决`VNF`放置问题。为每个用户对卫星的请求部署`VNF`时，共同最小化服务器能量、网络带宽和服务延迟的总体部署成本，在保证最低总体部署成本的情况下，为卫星网络中尽可能多的用户请求提供计算服务。仿真结果表明，与基线算法相比，`PGRA`能够提高网络收益和用户请求成功率。


    卫星边缘云可以通过结合边缘计算和云计算的优势，为众多物联网用户提供灵活的服务供应。Gao X等人研究了卫星边缘云中虚拟网络功能（`VNF`）放置的动态资源分配问题。首先，将`VNF`放置问题表述为一个整数非线性规划问题，目标是最小化服务端到端延迟和网络带宽成本。其次，提出了一种分布式虚拟网络功能放置（`D-VNFP`）算法来解决该问题。根据网络资源的可用性更新当前卫星网络状态，其中前一个时隙完成的用户请求所使用的网络资源可以被释放为下一个时隙新用户请求的可用资源。然后收集新的用户请求以出现在下一个时隙，并通过提出的`D-VNFP`算法按需分配可用资源。仿真结果表明，与基线算法相比，`D-VNFP`算法能够降低5.85%的网络带宽消耗和2.38%的平均服务端到端延迟，增加5.93%的用户请求成功率。


    ### 3.服务功能链资源协同

    为满足日益增长的空天地一体化网络中时延敏感业务的需求，应正确配置网络资源，并根据时延和抖动来规划业务功能链的部署。Zhang P等人提出了一种基于延迟感知的服务功能链映射算法，输入为`SFC`请求和物理网络，输出为部署链路延迟和部署路径；根据请求的大小、带宽要求和延迟要求对`SFC`请求进行分类，每个请求都属于一种业务类型；在每项服务中，采用`KSP`算法选择`k`条时延最短、资源开销较小的路径，计算每条路径的资源开销和延迟，选择延迟最小的路径作为`SFC`的部署路径。如果部署路径的延迟小于用户指定的延迟，则形成`SFC`，否则`SFC`部署失败。仿真结果表明，使用其所提出的算法，`CPU`资源利用率提高27.8%，链路资源利用率提高22.7%，服务接受率提升21.5%，时延性能提升38.2%，总资源消耗降低25.2%。


    定制化的空间信息网络（`SIN`）用于执行特定的太空任务。然而，定制化的卫星网络之间缺乏互动和协作，导致资源利用不足。此外，现有`SIN`无法更新软硬件设施，为先进的传输技术和策略的应用带来了巨大挑战。为了应对这些挑战，Yang
    H等人研究了空间信息网络中具有服务功能链（`SFC`）约束的最大流量路由策略，其中`SFC`由特定有序的服务功能序列组成，任务流必须经过这些以预定义的顺序运行。首先，对时变`SIN`由时间扩展图（`TEG`）建模，基于`TEG`将问题表述为线性规划问题。其次，为了降低解决大规模`SIN`的线性规划问题的复杂性，提出了一种基于`SFC`约束图论（`SFC-GT`）的低复杂度近似最优算法。该算法将问题表述为受`SFC`约束的单一商品最大流量问题。此外，提出了`SFC`约束增广路径选择（`SFC-APS`）算法搜索`SFC`约束增广路径。通过迭代搜索`SFC`约束的增广路径和更新`SFC`约束的残差网络，`SFC-GT`算法可以提供接近最优的最大流量路由策略，且复杂度大大降低。仿真结果证明，与基线算法相比，其所提出的算法性能接近最优性能。


    ### 4.虚拟网络映射

    天地一体化网络（`SAGIN`）具有异构型、时变性和自组织等特性，受到流量分布、路由调度、功率控制、频谱分配和负载平衡等许多因素的限制。其中，异构物理网络资源的分配和调度是一个关键问题。Zhang
    P等人基于虚拟网络架构和深度强化学习（`DRL`），将天地一体化网络的异构资源编排建模为多域虚拟网络映射（`VNE`）问题，并提出了天地一体化网络跨域`VNE`算法，算法的本质是异构网络资源的分配。首先对`SAGIN`的不同网段进行建模，根据`SAGIN`的实际情况和用户需求设置网络属性。在`DRL`中，代理由5层策略网络充当。基于从`SAGIN`中提取的网络属性建立特征矩阵，并将其用作代理训练环境。通过训练，得出每个底层节点被嵌入的概率。在测试阶段，根据概率依次完成虚拟节点和链接的嵌入过程。深度强化学习（`DRL`）本质上是一个端到端的感知和控制系统，具有很强的通用性，通常用于解决高维空间中的决策问题。仿真结果表明，与基线算法相比，其所提出的算法能够取得更好的网络性能，并能够提高异构网络资源分配的效率和合理性。


    在`SAGIN`中，如何实现网络资源的高效调度正是需要解决的问题。针对不同网段的特点和差异化用户需求，Zhang P等人提出了强化学习辅助宽带感知虚拟网络资源分配算法（`RL-BAVNA`），代理在节点嵌入阶段从底层网络中提取一个特征矩阵，并将其作为策略网络的输入，输出为节点嵌入到底层网络的概率。仿真结果表明，其所提出的算法在长期平均收益、接受率和长期收益成本比3个方面都优于传统的虚拟网络资源分配算法。


    ## 5.4　未来趋势

    多层次太空体系架构要求天基星座系统具有规模巨大、动态组网协同、体系复杂、多任务多用途、智能自治、敏捷重构、弹性健壮等显著技术特征。多功能可重构网络化技术是支撑未来多层太空体系发展的核心技术。


    首先，面向巨星座的智能多功能技术是发展多层太空体系的先决条件。未来多层太空系统形态巨量复杂，系统构建高度不确定。星座系统的研制与运行受技术、市场等多种不确定性的影响，存在巨大不确定性、投资高风险性，需要巨星座系统具有面向不确定性的灵活设计。同时，星座体系个体需要具备强自主与高度自治能力。随着组网星座中卫星数量的增多，传统针对单星的地面测运控模式已经不能满足巨星座组网需求，组网星座卫星将向自主自治方向发展。通过自主调配星座/星内资源完成感知、通信等不同类型任务，满足用户应用需求；能够自行实施星座轨道调整与轨道维持等操作，大幅降低对地面测运控支持等需求。


    其次，可重构技术支撑多层次太空系统弹性及灵活能力重组。多层太空系统呈现群体涌现行为，任何卫星节点的受损能够快速重组空间资源，不因外部环境导致整体集群能力空缺。美国`DARPA`的`Blackjack`项目，旨在构建功能可扩展、规模可适变、软硬件自适应的空间体系结构；美国太空发展局下一代太空体系架构，其基本思路是利用大规模和分布式，快速生成作战能力，其核心都是通过将低成本传感器（通信、导航、侦察、预警等载荷）与相互协作的巨型空间系统灵活组合，提升体系抗摧毁和快速响应能力。


    再次，网络化技术支撑多层次太空系统互联互通、天地一体化建设。组网星座将逐步实现弱中心化甚至去中心化，安全鲁棒性不断提升。传统集中式网络架构已不能满足巨星座网络接入、交换、控制等需求，去中心化成为未来超大规模空间网络典型特征，网络架构的转变，将大幅提升星座整体安全性和鲁棒性，即使在组网星座内部部分卫星失能失效情况下也能够保证业务连续可用。同时，系统具有高度动态群体智能演化特性。对于由成千上万颗卫星组成的空间巨复杂系统，部署周期长、服役周期长，系统建设和运控模式需要考虑未来较长时期的不断演化需求。传统单个卫星提前设定的任务模式和单个卫星的管控模式已无法满足巨星座需求，巨星座系统对其自身的在体系、系统、节点各层面的学习进化能力提出了要求，并可按照任务需求将能力扩展至所有任务节点，具备在更高维且动态的真实场景中通过自主交互和决策完成更错综复杂的空间任务。


    以低轨道巨型星座和混合网络架构为特征的卫星网络呈现快速发展趋势，正在实现从“天星地网”向“天基组网”的演进。传统天基网络技术已基本成熟，包括国际空间数据系统咨询委员会（`CCSDS`）、时延容忍网络（Delay
    Tolerant Network，`DTN`）在内的传统空间网络体制协议均已完成标准化。同时，地面网络技术向太空网络的辐射和带动作用日益凸显。学术界正在探索软件定义网络（Software
    Defined Network，`SDN`）、信息中心网络（Information Centric Networking，`ICN`）等新兴网络技术在巨型星座组网中的应用，以提供更为便捷的复杂网络管理和多业务承载。智能所带来的赋能效果，源于卫星宽带通信网络的复杂化与泛在性，也在于从网络到信息再到智能的结合。智能、信息和网络结合的优势巨大，是未来发展方向。


    ## 第三部分　空间人工智能及在轨应用技术需求

    智能航天时代逐渐拉开帷幕，人工智能作为天基系统网络化、信息化、智能化的核心基础技术，将广泛应用于对地观测、深空探测、通信导航、载人航天等各领域。通过人工智能+航天器的技术手段，提升遥感信息获取、通信信息保障、多域协同等航天应用的智能化水平，将在未来竞争中占领先机。


    ## 第6章　对地观测领域需求

    针对未来智能化应用对高技术强实时条件下的网络化空间信息保障需求，面向网络化协同的高分对地观测系统，需具备3个方面的能力，即网络协同能力、知识进化能力和智能服务能力。这3项能力需涵盖任务接收、智能解析、智能执行、智能信息提取与精准推送的系统信息服务过程。对地观测领域对空间人工智能及在轨应用技术需求迫切，主要体现在以下5个方面：一是观测效率提升需求；二是应急突发事件快速响应需求；三是复杂应用需求推动下多星协同需求；四是航天遥感信息高效实时分发需求；五是用户使用体验提升需求。


    ### 6.1　观测效率提升需求

    现阶段卫星由于使用模式、星上处理等方面的欠缺，导致卫星观测效率较低，主要表现在以下两个方面：


    ①卫星每轨完成的任务数量少，潜力难以发挥。现有卫星的使用主要依靠地面，由地面提前规划未来一天或几天的预定任务，星上按照地面规划结果执行。这种规划模式对卫星的约束条件都是静态的（如每圈只能侧摆两次，每圈只能工作5
    min等），由于卫星自主管理能力较弱，地面用户在进行任务规划时，为安全起见，一般对卫星资源（如能源、存储等资源）的分配都留有较大余量，导致卫星支持完成任务的数量受限，潜力难以发挥。

