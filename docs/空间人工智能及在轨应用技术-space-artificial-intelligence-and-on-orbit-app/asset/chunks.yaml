- raw: 'Lenet卷积网络的比特级别压缩是局部的操作，分别从索引量化和权值量化两个方面来进行实验。


    ①在索引量化的过程中，需要根据不同的网络层来确定各自的量化比特数。对于卷积层而言，网络的稀疏性较弱，可以采用比较少的比特来进行量化；对于全连接层来说，参数的压缩使得网络结构异常稀疏，在量化时要用较多的比特来进行量化，否则会产生填充零过多的情况，影响压缩效率。


    ②在权值量化的过程中，同样也需要根据不同的网络层来确定各自的量化比特数。对于卷积层而言，由于权值的大小对于特征提取影响很大，所以要尽可能保证卷积层的权值不变，就要用较多的比特来对卷积层进行权值量化，减少对于网络精度的影响；对于全连接层而言，权值大小仅仅意味着分类情况，相对于卷积层而言，全连接层的权重不是很敏感，所以可以用较少的比特来对全连接层进行权值量化。


    ③对于量化权值和量化索引，在Lenet卷积神经网络上进行了不同比特的尝试。在量化索引过程中，采用5比特来量化卷积神经网络和全连接层；在量化权值的过程中，采用8比特来量化卷积层，5比特来量化全连接层可以达到最好的压缩效率。


    （3）编码策略研究。


    拟采用霍夫曼编码，它是一种可变字长编码方法。该方法完全依据字符出现概率来构造异字头的平均长度最短的码字，有时称之为最佳编码。自Huffman于1952年提出该编码以后，被广泛应用于通信和计算机领域。霍夫曼编码的具体方法：先按出现的概率大小排队，把两个最小的概率相加，作为新的概率和剩余的概率重新排队，再把最小的两个概率相加，再重新排队，直到最后变成1。每次相加时都将“0”和“1”赋予相加的两个概率，读出时由该符号开始一直走到最后的“1”，将路线上所遇到的“0”和“1”按最低位到最高位的顺序排好，就是该符号的霍夫曼编码。实验表明，霍夫曼编码对于非均匀分布源，可以压缩至原存储量的20%～30%。


    通过霍夫曼编码，在Lenet-5卷积神经网络上进行了多层次压缩，记录实验中产生的压缩情况，如表12-8所示。


    表12-8　多层次压缩数据记录


    ![](images/txt016_31.jpg "pagenumber_ebook=242,pagenumber_book=231")


    由表12-8可以看出，经过多层次的压缩，网络的尺寸已经压缩到原来的2.46%，实现了40倍的压缩，并且在压缩过程中没有产生额外的精度误差。


    12.2.3　模型加速


    深度卷积神经网络（CNN）模型在目标分类、识别、视频分析以及自然语言处理等方面应用越来越广泛。


    CNN是一种高度并行的混联网络结构，尤其是近年来流行的深度网络，采用CPU计算往往会导致频繁的数据交互和相同数据的多次搬移，很难提高计算效率。利用GPU实现CNN，有编程简单、运行速度快等优点，但存在功耗过高、散热困难等问题。例如，NVIDIA
    GTX-1080 Ti GPU虽具有向量数据搬移操作，在内部计算过程中具备上千个节点对数据进行并行计算，但这一过程占用了巨额的硬件资源，同时也耗费了大量的能量功耗，峰值功耗达到250
    W。Cambrion-X加速处理器，在处理过程中的输入输出结果必须经由MLU模块，并通过对译码过程不同指令类型的判断，完成选通输入输出操作，这种加速方式通过多个模块的并行操作，并结合Hot
    Buffer及Cold Buffer减少或同化相同参数和操作的卷积计算，必然影响处理器计算效率。北京深鉴科技有限公司设计的AI处理器具有硬件资源可变的特点，借助于DPU节点，通过编译器优化计算流程，压缩参数，降低计算量，但这种功能必须有相应的程序结构进行配套执行才能达到最优速度，而在实际深度卷积计算过程，中间计算过程数据常常被其他进程调用，很难对所有复杂卷积网络形成实际优化。


    此外，当前商用GPU计算机及微处理器均是基于对并行寄存器的计算处理，针对深度卷积网络的加速算法实施，只能依靠多个计算单元的并行计算完成，且核心技术都掌握在国外大公司手中。例如，Google公司推出的TPU处理器，性能优越，但仅限于内部使用，不对外供货。由此可知，现有商用处理器无法满足星上应用需求，设计基于多并行计算和存储架构的CNN加速器，已经成为当前嵌入式、小型化研制过程的迫切需要。


    现有的深度学习网络加速计算主要从3个工程实现角度来进行优化：第一，减少量化位宽，以牺牲计算结果精度来减少硬件资源的占用，通过降低量化位宽到8位，提高设计的最大可执行频率，降低芯片面积的占用；第二，建立多级缓存机制，结合内外部缓存，分配计算过程中“冷”“热”参数和计算过程，提高缓存使用效率；第三，通过统计或简单判别的方式，减少零值参数或无效参数的访问和计算，提高计算单元的处理效率。


    当前常用处理位宽设计集中在2～8 bits，单纯降低位宽会造成计算精度的大幅下降，而位宽的选择与网络应用需求有关。多级缓存的设计，往往需要考虑片内、片外缓存，网络卷积核大小及层间并行度情况，很难形成统一的设计模式。零值和无效数值计算的跳过，虽然能够降低计算次数，但在设计过程容易造成控制电路部分的复杂化。


    在CNN硬件加速设计过程中，需要从系统架构、位宽、存储和内部总线进行整体考虑，在减少各计算、存储模块交互传输的基础上，提高计算的并行度。同时，对CNN模型结构进行基本的研究，重点分析网络并行结构和多层次缓存实现方式，设计一种运算效率高、占用资源少、通用性强、高能效比的CNN模型前向传播的加速器，并通过实现两种存储资源复用度差异巨大的加速器对比分析，关注数据重用是提升加速器能效比的关键因素。


    VGG强大的特征提取以及分类精度能力能够满足时敏目标图像分类识别的需求。同时，考虑到当前流行的SSD、YOLO、MobileNet等系列网络，或多或少都是基于VGG网络而来。因此，从有效性、适用性来讲，选用VGG系列网络作为深度学习加速器的基本网络模型。


    1.总体架构设计


    通过分析得出CNN硬件加速器设计需通过多并行计算和多层次缓存实现。加速器总体架构如图12-14所示，包含数据输入单元、数据控制单元、计算单元、存储单元、数据输出单元以及状态控制单元。该加速器架构充分结合了网络模型的前向推导运算特点，并保证计算单元与存储单元数据吞吐能力达到平衡，能够实现并行流水处理。


    ![](images/txt016_32.jpg "pagenumber_ebook=244,pagenumber_book=233")


    图12-14　加速器总体架构


    2.深度学习通用加速器具体设计


    1）卷积运算


    卷积运算是CNN模型的核心计算，其实现决定CNN模型计算单元整体结构。由于CNN模型层间运算具有独立性且各层运算具有高度相似性，因此可以通过复用单层运算资源来实现完整CNN模型卷积计算。在实现过程中，只需实现单层的卷积计算结构，即可通过构建多并行计算和存储架构实现网络模型加速。


    以MoblieNetV2模型为例，其卷积核大小有3×3和1×1两种类型，因此基本卷积运算模块需兼容两种大小卷积核的运算。单个卷积核并行运算流程如图12-15所示。当卷积核大小为3×3时，9个卷积参数寄存器在处理数据输入前完成更新，图像数据按行输入卷积运算模块，通过行数据缓存，构建循环移位存储器。当第3行图像数据输入时，通过寄存器调整数据时序，开始乘加运算，输出卷积结果。当卷积核大小为1×1时，该卷积运算模块最多可完成9个特征图的卷积处理，两种卷积核运算模式可通过控制信号Flag进行选择。由以上运算流程可知，该卷积基本运算为全并行流水架构，为后续加速架构的构建奠定了基础。


    ![](images/txt016_33.jpg "pagenumber_ebook=245,pagenumber_book=234")


    图12-15　单个卷积核并行运算流程


    网络模型需要完成海量卷积运算，可通过卷积核并行运算实现加速。如图12-16所示，多个卷积核共用一组存储单元实现了卷积运算的并行加速。


    ![](images/txt016_34.jpg "pagenumber_ebook=245,pagenumber_book=234")


    图12-16　多个卷积核并行加速运算架构


    为达到最佳加速比，存储带宽与计算能力需匹配。但频繁的数据访问会产生大量的功耗。因此，在设计卷积运算单元时，应尽可能地利用数据复用减少对存储器的访问次数，使访问带宽需求尽可能降低的结构。为此，多组卷积核共用一组外部存储器的方法可以显著减少对存储器的访问次数，从而大大提升能效比，具体架构如图12-17所示。


    ![](images/txt016_35.jpg "pagenumber_ebook=246,pagenumber_book=235")


    图12-17　多组卷积核并行运算加速架构


    2）全连接运算


    全连接层可利用快速流水架构实现，如图12-18所示。


    ![](images/txt016_36.jpg "pagenumber_ebook=246,pagenumber_book=235")


    图12-18　全连接层并行运算架构


    如表12-9所示，对不同数据格式的全连接层的计算结果进行统计分析，得出全连接层的计算精度对最终的分类结果尤其在精细分类过程中的影响较大，为保证加速器分类结果的准确性，全连接层数据格式采用单精度浮点。通过增加运算的并行度实现全连接层的加速，将全连接层并行度设计为32，全连接层流水延时为13个时钟周期。


    表12-9　全连接层数据精度分析


    ![](images/txt016_37.jpg "pagenumber_ebook=246,pagenumber_book=235")


    3.加速器功能及性能分析


    1）硬件平台


    加速器功能验证模式为PC+FPGA的模式。在FPGA上布置该加速器，PC机控制软件通过PCIe总线给加速器传输模型参数和待处理图像数据，加速器将处理结果通过PCIe总线发送给PC机控制软件，控制软件将对应图像和分类结果显示，并与标准解进行比对，验证该加速器功能。


    加速器验证框图如图12-19所示。


    ![](images/txt016_38.jpg "pagenumber_ebook=247,pagenumber_book=236")


    图12-19　加速器验证框图


    验证FPGA使用Xilinx公司的XC7 VX690T器件，采用Digilent公司Net-FPGA-SUME开发板作为验证平台，软件开发工具为Vivado。


    验证流程如下：图像存储在PC机上，CNN模型的反向训练在PC机上完成，图像和训练完成的权值直接通过PC机的PCIe总线下载到FPGA。中心控制器负责解析PC机输入的图像、CNN模型参数，将其存储至外部存储器（DDR3）。控制层接收到PC机的开始运算指令后，调度卷积层和输出层相应模块完成CNN模型运算。当前向传播计算完成后，输出层结果由FPGA控制输回PC机。


    与FPGA实现作对比的是通用CPU和GPU平台下软件实现方式，CNN模型与FPGA实现完全一致。CPU采用I7-6700四核八线程处理器，基准主频为3.4
    GHz，内存为32GB DDR4。软件开发工具采用Visual Studio 2013。GPU采用NVIDIA公司的GTX1050，软件开发工具采用CUDA7.0，核心基准频率1
    354 MHz，显存为4GB DDR5。


    2）验证数据集


    ImageNet数据集是一个用于视觉对象识别软件研究的大型可视化数据库，是目前深度学习图像领域应用得非常多的一个领域。关于图像分类、定位、检测等研究工作大多基于此数据集展开。ImageNet数据集文档详细，有专门的团队维护，使用非常方便，是目前全世界最大的、带有标记的图片数据库，在计算机视觉领域研究论文中应用非常广，成了目前深度学习图像领域算法性能检验的“标准”数据集。


    3）计算能力


    根据V7-690T FPGA的硬件资源以及MobileNetV2网络模型的特点，将加速器设计成包含16个卷积模块为一组，共计12组的并行加速架构。由此可知，该加速器每时钟周期最多可完成9×16×12=1
    728次乘加运算，为保证加速器计算性能，特征图运算的加法运算采用FPGA的硬件乘法器实现。加速器计算架构确定后，由于每层的运算量不同，会造成部分计算资源闲置。因此，提升加速器架构的计算效率成为衡量加速器性能的关键。加速器各层计算效率如表12-10所示。根据表12-10的分析计算得出：


    ![](images/txt016_39.jpg "pagenumber_ebook=248,pagenumber_book=237")


    由此，该加速器的计算效率η=189 929.4/251 419=75.54%。在工作频率为200 MHz时，输入图像数据大小为224×224×3的情况下，该加速器最大处理能力达到624
    fps。


    4）存储能力


    CNN加速器的存储单元设计准则为与计算单元以及加速架构相匹配，使得加速器计算能够实现流水处理。由于MobileNetV2网络中间数据以及参数相对较少，而V7-690T中包含有丰富的BRAM资源，且FPGA内部存储模块方便定制位宽和深度，灵活性好。根据模型结构特点，结合FPGA的BRAM资源特点，本文设计的加速器参数量化位宽为6
    bit，处理结果量化位宽为9 bit。加速器定制了多种位宽和深度的缓存单元，并设计了高效的读写策略，便于加速器充分利用存储资源，提升复用效率。


    表12-10　加速器各层计算效率


    ![](images/txt016_40.jpg "pagenumber_ebook=249,pagenumber_book=238")


    续表


    ![](images/txt016_41.jpg "pagenumber_ebook=249,pagenumber_book=238")


    该加速器共需动态存储空间 ![](images/txt016_42.jpg "pagenumber_ebook=249,pagenumber_book=238")，根据表12-5的分析以及式（12-2）可计算得出，第4层卷积层的存储资源复用率最高，达到了1
    323/4024.1=32.9%。同时，相对将中间计算数据全部缓存，总共节省存储空间8 428.1 kB-4 024.1 kB=4404 kB，存储资源节省率超过4404/8
    428.1=52.25%。


