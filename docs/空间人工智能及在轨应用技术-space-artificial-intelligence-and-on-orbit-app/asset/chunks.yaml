    #### Starlink


    星链计划是SpaceX提出的一个雄心勃勃计划，目的是将4.2万颗小型卫星发射到340～550km的近地轨道，通过星间的激光通信，实现覆盖全球的卫星网络，对全球特别是那些光缆和地面基站无法到达的偏远区域，提供低成本、高性能的互联网服务，形成天基5G/6G的WIFI能力。


    ##### 构型设计


    `Starlink`是SpaceX公司正在进行的卫星星座开发项目，旨在开发低成本、高性能的基于空间的互联网通信系统。`Starlink`计划第一期由4 408颗分布在540～570
    km的低地球轨道（Low Earth Orbit，`LEO`）卫星（表5-1）和7 518颗分布在340 km左右的极低地球轨道（Very Low Earth
    Orbit，`VLEO`）星座构成，组网卫星总数达到11 926颗。星链计划第一期的搭建分两个阶段：第一阶段首先用1 584颗卫星完成初步覆盖，用于满足美国、加拿大和波多黎各等天基高速互联网的需求，然后再用2
    824颗卫星完成全球组网；第二阶段用7 518颗卫星组成更为激进的低轨星座。


