    ## 13.4.3 基于反卷积生成对抗网络的遥感情报语义描述


    根据遥感内容理解与描述的任务需求，结合生成对抗网络的生成判别特性，通过对传统生成对抗网络的改进，完成针对遥感场景的情报语义描述，具体过程可分为生成网络和判别网络的构建。


    ### 1. 生成网络的构建


    根据已检测出的各区域目标以及相关位置信息，生成该遥感场景的情报语义描述。考虑到卷积神经网络在空间上的相关性，能够很好地进行图像特征的提取，选择使用卷积神经网络进行生成网络的构建。


    常用卷积神经网络是一个多层次的网络，每层均由若干个二维平面构成，并且每个平面是由多个独立的神经元组成。每个神经元从上层的局部接受域得到突触输入，因此使的它进行局部特征的提取。得到特征后，它相对于其他特征的位置就会被近似地保存下来，网络的每一个中间计算层都是由多个特征映射构成的，每个特征映射都是平面的形式。平面当中单独的神经元在约束下共享相同的突触权值集，这种结构形式具有平移不变性和自由参数数量的缩减优势。每个卷积层后面可以链接实现局部平均以及抽样的计算层，用于特征映射的分辨率降低。该操作可以使特征映射的输出对平移和其他形式的变形敏感程度下降。


    经过卷积神经网络得到的图像特征处于一个较低的维度，而通过长短时记忆模型的文本特征处于一个相对较高的维度。因此，在卷积神经网络的尾部添加一个反卷积层，实现图像特征到文本特征的映射。


    生成网络可表示如下：`G：RD→R T`。其中，`T`表示文本特征向量的维度；`D`表示遥感场景的维度。通过生成器的前向传播生成相关的句子如下：`x^←G（i，b）`。其中，`x^`示生成器生成的文本特征；`i`为生成器输入的图像；`b`为表示各区域间的位置关系，作为偏移项输入生成网络。生成网络的框架如图
    13-58 所示。


    ![](img/txt017_88.jpg "pagenumber_ebook=338,pagenumber_book=327")


    图 13-58　生成网络的框架


    ### 2. 判别网络的构建


    判别网络的目的是用来对生成网络生成的文本向量的真伪进行评判。当判别网络无法区分真实特征与生成特征的时候，即表明生成的向量非常接近真实向量，可用该网络对遥感场景进行比较准确的预测。


    相对于文本，图像维度较高，通过若干较大步幅的卷积层，并通过`spatial batch normalization`以及`ReLU`将图像归一化到一个较低维度的特征向量。将较为复杂文本特征通过一个全连接层，转化为和图像特征同一维度，通过多种图像特征和文本特征的串联组合的对比，评判生成器生成特征的真伪。


    类似于卷积层、全连接层、池化层等常见神经网络层，`BN`也是神经网络的一层。在卷积神经网络中除输出层外，其他层因为低层网络在训练时更新了参数，而引起后面层输入数据分布的变化。如果在每一层输入的时候，加入一个预处理操作，如对某层的数据归一化至均值
    0、方差为 1，然后再输入计算，就可以解决网络中内部协变量转变的问题。在网络每层输入的时候，加入一个归一化层，先做归一化操作，然后再进入网络的下一层处理。通过变换重构，引入了可学习参数`γ`和`β`，让网络可以学习恢复出原始网络所要学习的特征分布。


    判别网络可以表示为`R D×R T→{0，1}`。其中，`T`表示文本特征向量的维度；`D`表示遥感场景的维度。`sr←D（x，i）`表示真实图像特征与真实文本特征的串联，`sw←D（x，i^）`表示错误图像特征与真实文本特征的串联，`sf←D（x^，i）`表示生成图像特征与真实文本特征的串联，因此损失函数可定义如下：


