    人工智能发展趋势的具体表现：


    ①大数据成为人工智能持续快速发展的基石；


    ②文本、图像、语音等信息实现跨媒体交互；


    ③基于网络的群体智能技术开始萌芽；


    ④自主智能系统成为新兴发展方向；


