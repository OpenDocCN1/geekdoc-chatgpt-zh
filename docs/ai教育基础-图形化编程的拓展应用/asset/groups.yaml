  mdcn: "\n## 一、提升训练\n\n请根据本课所学知识，结合自己的观察，完成下列练习：\n设计一个遇到障碍物会发出警报并躲避的小车。\n\n## 二、思考题\n\
    \n如何使用触摸按键使小车倒退？\n\n## 第十一课 智能车（自动跟随）\n\n随着科技的发展，人们使用的物品越来越智能，越来越方便。如果老人出去散步，有人帮拿东西，该多好啊。一个人逛商场，有人给拎包，其实也不错。今天我们就研究一款微型的跟随车，它能时时刻刻在你的身边帮你拎东西。\n\
    \n![](img/bde7deae6cae740f749a54152e7de6c8_128_0.png)\n\n### 导读：\n- 1. 你有遛小狗的经历吗？你见到过小狗跟在主人身边不乱跑的情况吗？\n\
    - 2. 小车如何来判断和我们的距离关系呢？\n\n### 思考题：\n我们让小车跟着我们走，小车会不会碰上我们，或者被我们踩上？有没有办法来避免这种情况？\n\
    \n### 课后功能思考：\n我们可不可以做一个能自动跟随我们走的书包，这样，我们就不用背着书包上学了，“遛”着书包就可以上学去了。\n\n## 一、本课所需硬件\n\
    \n- 1. 硬件。\n\n核心板、主扩展板、超声波传感器子扩展板、红外避障传感器子扩展板、RGB 探照灯、杜邦线若干。\n\n- 2. 特殊硬件介绍。\n\
    \n超声波传感器：测量距离的传感器，可以测量的距离为 3cm～200cm。\n\n工作原理：超声波传感器有一个控制口和一个输出口，当控制口发出 10μs 以上的高电平时，就可以在接收口等待高电平输出，一有输出就可以开定时器计时，当此口变为低电平时就可以读定时器的值，此时就为此次测距的时间，根据此可计算出距离，如此不断地周期测，就可以得到移动测量的值。\n\
    \n红外避障传感器：对环境光线适应能力强，具有一对红外线发射与接收管，发射管发射出一定频率的红外线，当检测方向遇到障碍物（反射面）时，红外线反射回来被接收管接收，经过比较器电路处理之后，指示灯会亮起，同时信号输出接口输出数字信号（一个低电平信号）。可通过电位器旋钮调节检测距离，有效检测距离范围为\
    \ 2cm～30cm。\n\n## 二、本课所需程序模块（表 11-1）\n\n| 序号 | 程序模块组 | 程序模块图标 | 程序模块功能 |\n|:---:|:---|:---|:---|\n\
