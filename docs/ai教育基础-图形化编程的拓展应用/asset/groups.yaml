    \ 第一节 单边避障\n\n### 编程逻辑\n\n利用红外避障传感器，检测在距离红外避障传感器一定范围内，是否有障碍物。当检测到有障碍物时，小车左转，指示灯颜色为红色；未检测到障碍物时，小车前行，指示灯颜色为绿色。\n\
