    # # 前言


    人工智能 (AI) 技术正加速推动着物联网 (IoT) 进步：随着大数据、机器学习、计算能力、存储能力以及云计算等新技术的快速发展，人工智能技术呈现出“井喷式”发展趋势，不仅是工业设备，越来越多的家电、通信设备等生活用品都开始接入并融合人工智能技术，人工智能的发展已成为大势所趋。在人工智能时代，互联网思维和计算机思维是优秀人才必备的两种思维方式，而学习编程则是培养并形成这两大思维方式的一个重要途径。


    +   - 在美国，编程已进入幼儿园和中小学课堂，是备受欢迎的课程之一。

    +   - 在英国，编程被列入国家教学大纲，成为 6~15 岁孩子的必修课。

    +   - 在芬兰，编程理念融入了小学的各门课程，孩子们可以随时随地学习编程。


    ...........


    在中国，2017 年 7 月，国务院印发了《新一代人工智能发展规划》，其中明确指出我国将实施全民智能化教育项目，在中小学阶段设置人工智能相关课程，逐步推广编程教育，鼓励社会力量参与编程教学软件、游戏的开发和推广。计算机程序设计能力（编程能力）作为一种基础技能已经在国家层面得到重视。


    疫情防控期间，为了减少接触式的物资配送、消杀等，智能小车、智能无人机等，越来越多的人工智能机器人加入到了抗疫的一线。其实不仅是在抗疫的一线，在日常生活中，智能化产品也越来越多地走进了普通人的家庭。


    车联网、物联网概念的提出和完善，让智能生活变得越来越伸手可及。就如同本书中发生在“小思”身上的故事那样：路灯可以随着光线的变化自动开关，家里的灯听到喊声就自动打开……其实智能生活远不止这些：随着家庭智能平台的普及，可能说一句“我
    15 分钟后要洗个热水澡”，热水器就开始自动加热；又或者我们在驾车回家的路上，煮饭机已经在为我们烹饪香喷喷的饭菜。


    智能生活将无处不在。本书就是让小朋友们掌握智能生活背后的基本数学逻辑，通过简单的程序来实现看似很复杂的智能生活场景，并通过各种思考题，让学生发散思维，去创新更多的解决方案。


    本书专注于编程本身，但以智能生活为主题，为图书的使用者预留了一个广泛的实现空间。搭配各种外设产品，大家可以亲自动手，制作一件属于自己的智能生活产品。让编'
  - '[PAGE 9]


    程从虚拟世界走向现实世界。


    本书覆盖范围广，既适合低年级学生长期使用，也适合高年级低基础的学生入门使用，并给高、低年级的学生提供了一个交流的机会。各种配套资料，配合网站上音视频材料，构成系统化的学习交流辅助平台。所以此书不仅可作为学校、培训机构的教学用书，也可以作为学生和学生家长一起自学的图书。本书还配套有丰富的外设产品，也可以在创客教室自行设计生产和程序进行匹配。更多的信息，可以登录
    www.siwt.中国和 www.bitlogic.cn 了解。


    本书是“BIT-LOGIC 人工智能教育系列图书”的第二本。我们旨在打造一个完善的、可持续化发展和迭代的互动教学平台，为广大教师、家长，特别是青少年创建一个科学的学习平台，帮助他们走向未来奇妙的科技世界。本书适合任何想要通过
    JavaScript、Python、Scratch 等语言学习编程的中小学生和想要理解计算机编程基础知识的爱好者阅读学习。鉴于时间关系，本书难免有不足之处，欢迎广大读者指正、交流。


    编委会

    2022 年 5 月于北京'
