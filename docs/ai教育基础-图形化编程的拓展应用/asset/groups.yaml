    \n当人们闻到煤气的气味时，会第一时间采取措施，开窗通风。能够第一时间察觉到煤气泄漏，是因为煤气有一种特殊气味。如果可燃气体没有气味，泄漏后不能被人们发现，应该怎么办呢？我们可以在家里安装一个报警器，只要有可燃气体泄漏，报警器就能立即发出报警声音，提醒人们及时采取措施。今天就让我们一起制作一个可燃气体报警器吧！\n\
