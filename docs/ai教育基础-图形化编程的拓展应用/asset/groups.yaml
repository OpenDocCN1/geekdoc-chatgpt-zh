    # 第十课 智能避障小车（红外）


    红外避障小车是一种能自动感知前方障碍物并进行躲避的智能车。智能避障小车的设计允许小车在有障碍物的环境中不发生碰撞地前进。避障小车的应用不受限制，现在很多军事组织都在使用，它有助于士兵完成很多危险的工作。该技术在未来的无人驾驶领域也发挥着重要的作用。


    ![](img/bde7deae6cae740f749a54152e7de6c8_116_0.png)'
