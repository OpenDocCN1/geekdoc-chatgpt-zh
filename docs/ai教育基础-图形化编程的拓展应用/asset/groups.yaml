    硬件：核心板、主扩展板、超声波传感器、RGB 探照灯子扩展板、杜邦线若干。


    ### 二、本课所需的程序模块（表 8-1）


    | 序号 | 程序模块组 | 程序模块图标 | 程序模块功能 |

    | :--- | :--- | :--- | :--- |

    | 01 | 基本 | 当开机时 | 相当于开始，它在程序运行时处在所有其他事件之前，使用该事件来初始化程序。 |

    | 02 | 基本 | 无限循环 | “无限循环”程序启动后不停地运行代码。 |

    | 03 | 基本 | 暂停 (ms) 100 | 暂停程序，暂停时长是所设置的毫秒数。 |

    | 04 | 变量 | 将 Distance 设为 0 | 将 Distance 设置变量为某事物或项目。 |

    | 05 | 逻辑 | 如果为 true 则 | 如果值为 true（真）执行一些语句。 |

    | 06 | Siw21_显示类 | 初始化RGB | 初始化 RGB 显示。 |

    | 07 | Siw21_显示类 | 显示彩灯 | 使灯点亮。 |

    | 08 | Siw21_显示类 | 关闭彩灯 | 使灯关闭。 |

    | 09 | Siw21_显示类 | 设置 Light 1 颜色为 red | 使灯的颜色设置为某种颜色。 |

    | 10 | Siw21_小车类 | 小车舵机 编号 S1 角度 0 速度 0 | 控制舵机旋转角度和速度。 |

    | 11 | Siw21_小车类 | 超声波返回 (cm) | 返回超声波传感器与障碍物之间的距离。 |


    ### 编程逻辑


    1. 开机时，初始化程序（图 8-1）。

    开机时，初始化 RGB，初始化 2.1 主扩展板，设置灯颜色为红色并点亮，道闸杆为关闭状态。


    ![](img/bde7deae6cae740f749a54152e7de6c8_79_0.png)


    图 8-1 编程逻辑


    2. 控制道闸杆开关的逻辑（图 8-2）。

    利用超声波传感器，如果检测到距离大于 0cm 并且小于 10cm，开启道闸杆两秒，指示灯为绿色；否则关闭道闸杆，指示灯为红色。


    ![](img/bde7deae6cae740f749a54152e7de6c8_79_1.png)


    图 8-2 编程逻辑


    ### 参考代码


    1. 开机时，初始化程序（图 8-3）。


    ```

    当开机时

    初始化2.1主扩展板

    初始化RGB

    设置 Light 1 颜色为 red

    显示彩灯

    小车舵机 编号 S1 角度 90 速度 5

    ```


    2. 控制道闸杆开关程序（图 8-4）。


    ```

    无限循环

    如果为 超声波返回 (cm) > 0 与 超声波返回 (cm) < 10 则

    设置 Light 1 颜色为 green

    显示彩灯

    小车舵机 编号 S1 角度 180 速度 5

    暂停 (ms) 2000

    否则

    设置 Light 1 颜色为 red

    显示彩灯

    小车舵机 编号 S1 角度 90 速度 5

    ```


    ### 三、提升训练


    请根据本课所学知识，结合自己的观察，完成下列练习：

    设计一个道闸杆，每隔 10 秒，定时开启闸杆一次。


    ### 四、思考题


    超声波在检测时，会有误差，导致闸杆错误开启，如何避免这种情况的发生？


    ## 第九课 智能车（无线遥控）


    无线电遥控的雏形是在 20 世纪 20 年代出现的，随着现代电子技术的飞速发展，遥控设备的可靠性和灵敏性越来越高，应用范围也越来越广，生活中孩子玩的无线遥控车也随处可见。你想拥有一款你自己设计的遥控汽车吗？那就一起进入课堂吧!


    ![](img/bde7deae6cae740f749a54152e7de6c8_82_0.png)


    ![](img/bde7deae6cae740f749a54152e7de6c8_83_0.png)


    ### 导读：


    - 1. 你玩过遥控车吗？ 遥控器是怎样把指令给到遥控车的呢？

    - 2. 遥控车的遥控距离为什么有限制？


    ### 思考题：


    为什么遥控小车在被障碍物挡住后，可能遥控器就失灵了？


    ### 课后功能思考：


    有没有什么办法，让遥控车在障碍物背后也能接受遥控？


    ### 本课所需的硬件


