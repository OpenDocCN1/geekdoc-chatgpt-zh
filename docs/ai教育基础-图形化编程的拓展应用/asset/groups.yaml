    ## 引章 小思的智能生活


    ### 人物介绍：


    - 小思：5 年级学生

    - 小悟：小思的宠物狗

    - 小天：小思的家庭管家机器人


    思悟天小学（虚构）开设了丰富的课后选修课，同学们在老师的辛勤付出下，在快乐的氛围中学习了一个又一个知识。当下课铃声响起的时候，天色已然临近傍晚。


    天气预报有雨，小思下课时，天很阴暗。小思决定跑步回家，要不天黑了看不清路，而路灯通常要到 8 点才会点亮。前几天看见工人叔叔围着路灯杆子做改造，也不知道改得怎么样了？想到这里，小思加快了脚步。突然，路灯一盏一盏地亮了，照亮了小思回家的路。小思很惊讶，难道我今天学习到这么晚了吗？看看手上的智能手表，才
    6 点多……旁边几位老大爷在聊天：“现在天黑了，路灯就会自动亮了，不用等到固定时间了。”。


    真好，这样就不怕看不见路了。小思快速跑回了家。爸爸妈妈都不在家，估计又加班了。屋子里有点闷。“开灯！”小思冲着空中喊道，家里的灯都亮了起来。刚放下书包，嘀的一声，爸爸前几天买的智能风扇启动了。屋子里有了空气流动，没那么闷了。小思走近风扇，风扇的风力变小了，不会吹坏他。“小天，放首歌。”“好的！”随后，家里的音箱开始播放悠扬的音乐……


    这是小思真实的生活状态，不是科幻故事。随着物联网、互联网和软件技术的发展，智能产品的发展日新月异。根据设定、主人的命令以及外部环境变化等，智能产品能按照程序，接受外部命令，或者监测外部环境，自动开启或关闭某些功能。如：自动打开空调、自动启动料理机开始做饭、自动开关窗（帘）等。这些产品，不仅能提高生活效率和品质，还能在计算机的辅助下，通过精心计算，减少能源的消耗。


    小思的生活中所使用的智能产品，只是当下智能产品的很小的缩影。先进的智能产品中的程序，是由一个又一个的小程序组合而成的。让我们跟随这本教材，一起来学习智能产品的编程技术。


    ## 第一课 智能路灯


    太阳能路灯是一种把太阳能作为能源的路灯，因其具有不受供电影响，不用开沟埋线，不消耗常规电能，只要阳光充足就可以就地安装等特点，受到人们的广泛关注。又因其不污染环境，而被称为绿色环保产品。太阳能路灯既可用于大城市的公园、道路、草坪的照明，又可用于人口分布密度较小，交通不便，经济不发达，缺乏常规燃料，或者难以用常规能源发电但太阳能资源丰富的地区，可以解决这些地区人们的家用照明问题。


    ![](img/bde7deae6cae740f749a54152e7de6c8_14_0.png)


    ![](img/bde7deae6cae740f749a54152e7de6c8_14_1.png)


    **导读：**

    1. 想象一下，我们这个实验中要使用的光敏传感器，在路灯开关的过程中，相当于我们人体的哪个器官？为什么？

    2. 每天，我们如何让路灯知道天“黑”了？我们可以怎样在白天的课堂上模拟一个黑夜的场景呢？


    **思考题：**

    1. 路灯有什么作用？

    2. 路灯在什么时候会开启？

    3. 除了在马路两边可以看到路灯，还可以在哪里看到呢？

    4. 路灯有没有浪费电的时候？


    **课后功能思考：**

    同学们，在我们了解了本课的知识后，除了制作智能路灯，我们还可以制作什么相似的物品呢？


    ### 一、本课所需的硬件


    1. 硬件。核心板、主扩展板、光敏传感器、RGB 探照灯、便携式扩展板。


    2. 功能使用。


    光敏传感器：对环境光线敏感，用来检测周围环境的光线亮度。


    工作原理：在环境光线亮度达不到设定阈值时，引脚输出高电平（指示灯灭），当外界环境光线亮度超过设定阈值时，引脚输出低电平（指示灯亮）。


