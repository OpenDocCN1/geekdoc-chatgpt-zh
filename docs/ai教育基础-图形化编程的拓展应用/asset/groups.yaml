    \n### 二、思考题\n\n怎样让无线小车在行驶的过程中播放美妙的音乐？\n\n## 第十课 智能避障小车（红外）\n\n红外避障小车是一种能自动感知前方障碍物并进行躲避的智能车。智能避障小车的设计允许小车在有障碍物的环境中不发生碰撞地前进。避障小车的应用不受限制，现在很多军事组织都在使用，它有助于士兵完成很多危险的工作。该技术在未来的无人驾驶领域也发挥着重要的作用。\n\
    \n![](img/bde7deae6cae740f749a54152e7de6c8_116_0.png)\n\n- **导读：**\n  - 1. 在上学的路上，如果你遇到一个小水坑，你会怎么办？\n\
    \  - 2. 是什么器官让你发现小水坑的？\n  - 3. 自动避障汽车的“眼睛”是什么？\n\n- **思考题：**\n  我们骑自行车的时候，当发现水坑时可能已经来不及捏自行车的闸了。自动避障车能避免这种情况吗？\n\
    \n- **课后功能思考：**\n  避障小车能不能判断障碍物的大小？如果觉得自己能通过障碍物，不用避开，小车能否直接开过去？\n\n### 一、本课所需的硬件\n\
    \n- 1. 硬件。核心板、主扩展板、红外线避障传感器子扩展板、RGB 探照灯子扩展板、杜邦线若干。\n- 2. 特殊硬件介绍。\n\n红外避障传感器：对环境光线适应能力强，具有一对红外线发射与接收管，发射管发射出一定频率的红外线，当检测方向遇到障碍物（反射面）时，红外线反射回来被接收管接收，经过比较器电路处理之后，指示灯会亮起，同时信号输出接口输出数字信号（一个低电平信号）。可通过电位器旋钮调节检测距离，有效检测距离范围为\
    \ 2cm～30cm。\n\n### 二、本课所需的程序模块（表 10-1）\n\n| 序号 | 程序模块组 | 程序模块图标 | 程序模块功能 |\n|\
