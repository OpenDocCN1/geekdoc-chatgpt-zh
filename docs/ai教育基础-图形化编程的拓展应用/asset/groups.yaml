    \n可燃气体传感器的工作原理：当传感器所处环境中存在可燃气体时，传感器的电导率随空气中可燃气体浓度的增加而增大，电子电路将电导率的变化转换为与该气体浓度相对应的输出信号，传送给核心板。可燃气体传感器对氢气、甲烷、丙烷、液化气及其他可燃气体的检测灵敏度较高。\n\
