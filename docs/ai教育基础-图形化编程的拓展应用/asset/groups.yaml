    # # 引章 小思的智能生活


    # ## 人物介绍：


    +   - 小思：5 年级学生

    +   - 小悟：小思的宠物狗

    +   - 小天：小思的家庭管家机器人


    思悟天小学（虚构）开设了丰富的课后选修课，同学们在老师的辛勤付出下，在快乐的氛围中学习了一个又一个知识。当下课铃声响起的时候，天色已然临近傍晚。


    天气预报有雨，小思下课时，天很阴暗。小思决定跑步回家，要不天黑了看不清路，而路灯通常要到 8 点才会点亮。前几天看见工人叔叼围着路灯杆子做改造，也不知道改得怎么样了？想到这里，小思加快了脚步。突然，路灯一盏一盏地亮了，照亮了小思回家的路。小思很惊讶，难道我今天学习到这么晚了吗？看看手上的智能手表，才
    6 点多……旁边几位老大爷在聊天：“现在天黑了，路灯就会自动亮了，不用等到固定时间了。”。


    真好，这样就不怕看不见路了。小思快速跑回了家。爸爸妈妈都不在家，估计又加班了。屋子里有点闷。“开灯！”小思冲着空中喊道，家里的灯都亮了起来。刚放下书包，嘀的一声，爸爸前几天买的智能风扇启动了。屋子里有了空气流动，没那么闷了。小思走近风扇，风扇的风力变小了，不会吹坏他。“小天，放首歌。”“好的！”随后，家里的音箱开始播放悠扬的音乐……


    这是小思真实的生活状态，不是科幻故事。随着物联网、互联网和软件技术的发展，智能产品的发展日新月异。根据设定、主人的命令以及外部环境变化等，智能产品能按照程序，接受外部命令，或者监测外部环境，自动开启或关闭某些功能。如：自动打开空调、自动启动料理机开始做饭、自动开关窗（帘）等。这些产品，不仅能提高生活效率和品质，还能在计算机的辅助下，通过精心计算，减少能源的消耗。


    小思的生活中所使用的智能产品，只是当下智能产品的很小的缩影。先进的智能产品中的程序，是由一个又一个的小程序组合而成的。让我们跟随这本教材，一起来学习智能产品的编程技术。'
