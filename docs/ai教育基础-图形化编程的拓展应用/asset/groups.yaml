    # 序一


    给中国的孩子多一次选择的机会。


    2008 年，我还是一个刚刚步入大学的懵懂少年，有着对大学生活的无限向往，却伴随着对自己的专业——信息管理系统的一无所知。四年的时光，我学会了相关的专业知识，却远没有理解它，直到我工作多年之后，才顿悟它的价值。回想四年大学，特别是是每天都在被动地学习专业知识的时候，我问我自己，如果再给我一次选择的机会，我还会选择这个“热门”专业吗？当时心里的想法是否定的，但如果今天你再问我的选择，我的回答将是肯定的。


    在中国，做一个合格的家长不容易，当一个有选择能力的学生更不容易。孩子从幼儿园起，很多的事务都是“被安排好了”。到了高考报志愿，孩子们除了一腔热血和为数不多的“前辈”指导外，更多的是对大学专业的迷茫和纠结。我相信中国的孩子，大部分在上大学之前，不知道自己到底爱不爱这个专业，比如我们经常提到的计算机专业，有多少学生在报考之前知道编程是什么，C
    语言又是什么？……


    现在，这种情况已经有了一定的好转，特别是初高中走班排课的出现给中国教育界注入了一剂强心针，越来越多的学生可以根据自己的兴趣，根据自己未来的目标来进行一定的选择。但是，一个横亘在我们面前的现实是：中国的学生太多了，教育资源相对有限，很多时候并不能很好地满足每一位学生。在国外“所向披靡”走班排课的方式并无法绝对适合中国国情。当前我们依然还不能做到对每个孩子的个性化指导，这必然导致还有很多很多的中国学生上了大学之后才发现自己并不适合这个专业，但是转专业成本太大，也就导致了人才的培养很多时候出现了偏差。所有这些，都是因为孩子缺乏一个选择的能力。我想给孩子们多一个选择，至少在未来的核心技术之一，即
    AI 及物联网领域，给孩子们多一个选择。于是，有了本系列图书以及本书的诞生。


    本书作为少儿编程的基础教材，旨在让没有接触过编程的孩子能够尽快地体验到编程的魅力，以人工智能为主题，通过图形化编程的模式，活泼有趣的图示，帮助孩子建立编程的基础逻辑思维。通过逻辑思维的构建，以及相关外设的配套使用，将孩子带入到编程的世界中。孩子用编程的语言，用逻辑的思维，制作生活中的用品，对编程产生兴趣。通过一系列课程的学习，孩子不仅能提高自己的逻辑思维、团队协作能力，更有可能发掘自己相关的学习天赋，如果具备了某种天赋（编程、机械等），在未来的专业选择上可以更'
  - '[PAGE 5]


    为坚定地走自己喜欢并擅长的路。如果不具备这个领域的天赋，也可以用它来结交更多的朋友，学到更多的知识，让自己多一些业余爱好和技能。


    未来将会是一个人工智能的时代，每一个人都需要了解什么是人工智能，什么是信息技术。对于新时代的青少年来说，编程，或者说编程思维不再是遥不可及的事情，它们将有可能成为我们生活的一部分，会成为我们抉择的重点。我希望本书的读者们能有作出选择的能力。


    我自己的孩子已经四岁了，我希望他在成长的过程中，在未来的选择中，能够有更多的机会去了解，去学习，去选择！


    为了我们的孩子多一种选择，多一种人生！


    杨欣泽


    （杨欣泽，毕业于北京大学，现任第十二届全国工商业联合会代表，密云区第二届人大代表，密云区工商业联合会副主席，北京宏扬迅腾科技发展有限公司董事长，北京思悟天科技股份有限公司董事会董事长，全国万名优秀创新创业导师，中国企业家创新智库特聘专家。）'
  - '[PAGE 6]


    现在，我们正处在过去的未来！


    智能时代直面于前：人脸识别解锁、刷脸支付、智能语言翻译、无人驾驶等技术业已成熟或渐趋成熟，走入我们的日常生活，改善着我们的生活方式。人工智能已成为全球必争的战略制高点，许多国家纷纷提出人工智能战略政策，推动人工智能发展。


    作为教育领域的研究者，大家普遍认识到教育具有未来发展的指向性，我们培养的人不仅是生活在当下的人，还是生活在未来和创造未来社会的人。因此，我们必须着眼于未来的社会需求，变革当前的教学内容和教学方式，培养未来人工智能社会需求的人。我国政府制定了一系列政策，推动人工智能在教育及相关的产业发展。面对国外发达国家的先行布局，2017
    年 7 月 8 日，我国政府出台了《新一代人工智能发展规划》，提出了“实施全能智能化教育项目，在中小学阶段设置人工智能相关课程，逐步推广编程教育”，“支持开展人工智能竞赛，鼓励进行形式多样的人工智能科普创作”。教育部出台的《教育信息化
    2.0 行动计划》要求“完善课程方案和课程标准，充实适应信息时代、智能时代发展需要的人工智能和编程课程内容”。


    无论是从国家的政策要求还是从教育的基本规律来看，人工智能相关人才培养都离不开基础教育阶段的系统化教育。从教育的要素来讲，成功的人工智能教育离不开优秀的人工智能教育课程资源和教材。因此，我国的大量研究者和实践者在人工智能教育方面都在努力探索，不断创新，我们也看到了丰硕的成果。


    思悟天教研团队编的“BIT-LOGIC 人工智能教育系列图书”是这些优秀成果中的代表之一。该系列图书着眼于未来社会人才培养的要求，以人工智能教育为主题，以
    JavaScript、Python、Scratch 为基础，通过科学合理的结构、通俗易懂的文字、活泼有趣的图示，帮助孩子学习创新思维方式。图书涵盖了从小学到高中的各个学段，不仅体系完整，而且还融入了大量来自教学一线实践的案例，也给我们研究者带来很多启发和思考。


    未来已来，将至已至，科技创新加速教育变革，值得我们教育理论研究者和实践者关注，值得我们共同研究。希望思悟天教研团队的“BIT-LOGIC 人工智能教育系列图书”能够为更多地区开展人工智能教育提供借鉴，也希望作者团队能够基于实践的反馈继续提'
