    \ | 设置 Light 1 颜色为 red | 把某个 RGB 探照灯设为某个颜色。 |\n| 08 | Siwt21_小车类 | 小车控制 前行 速度\
    \ 0 | 通过控制小车的两个电机转动方向及功率，来控制小车的行驶方向和速度。 |\n| 09 | Siwt21_小车类 | 小车控制 前行 | 通过控制小车的两个电机转动方向，来控制小车的行驶方向。\
