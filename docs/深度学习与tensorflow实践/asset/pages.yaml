  md: '结果可能是 True（对应元素值不等），也可能是 False（对应元素不等），它们在一起构成了布尔类型张量，其维度信息与原始的整数张量一致。然后将这个布尔矩阵赋值（=）给
    acc_bool。在 In [29]处，我们验证了逻辑比较之后得到的布尔类型张量。


    需要特别注意的是，不同于 NumPy，在 TensorFlow 中，布尔类型张量中的变量是不可以直接求和的。因此，需要将布尔类型张量 acc_bool 中的数据转换为浮点数再使用。这时我们就需要利用
    tf.cast()方法，将布尔类型张量转换为浮点数类型（tf.float32）张量，这样做的话，False 被看成 0.0，True 被看成 1.0。于是，布尔类型张量[
    True, False, False, True, True]被转换为浮点数类型张量[1.0, 0.0, 0.0, 1.0, 1.0]。


    ```

    In [30]: acc_float = tf.cast(acc_bool, tf.float32) #请思考①

    In [31]: tf.math.reduce_mean(acc_float)

    Out[31]: <tf.Tensor: id=66, shape=(), dtype=float32, numpy=0.6>

    ```


    当所有布尔类型张量都转换为或 “1.0” 或 “0.0” 的浮点数类型张量时，利用 tf.math.reduce_mean 可以很容易计算出它们的平均值（代码
    In [31]），这个平均值恰好就是准确率。如[1.0, 0.0, 0.0, 1.0, 1.0]，它表示共预测 5 次，有 3 次预测正确，正确率为 3/5=0.6。而在
    tf.math.reduce_mean 方法的处理下，这个张量的“均值”恰恰好就是 0.6。


    张量思维的核心是张量进，张量出 (Tensor In, Tensor Out).


    从上面的操作可以看出，即使我们处理了很多数据的运算，但甚少涉及到 for 循环。利用 TensorFlow，就要求我们具备张量思维，即输入的是张量，输出的也是张量，我们要把张量当作一个整体看待，而不是考虑如何用
    for 循环去遍历它们中的每个元素。


    # 4.2.5 张量类型转换


    有时，系统中不同计算模块使用的张量类型、数值精度都可能不尽相同。这时，为了适应调用模块的需要，就需要进行类型转换，这时需要用到的方法是 tf.cast()。这个方法，在前面的代码中，我们已经“牛刀小试”。


    在英文中，“cast”有“铸造”之意。可以想象一下，火红滚烫的钢水流进磨具的场面，磨具是什么形态，钢水就“定格”为什么形态。后来，这个词被引进到计算机编程语言领域中，表示将一种形态的数据“变形”为另外一种形态的数据。tf.cast()方法的原型如下。


    ```

    tf.cast(x, dtype, name=None)

    ```'
