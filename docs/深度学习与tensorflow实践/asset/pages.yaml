  md: '> 胡适先生曾经说过这么一句名言，“怍什么真理无穷，进一寸有一寸的欢喜”。如果我们追求一步到位的“真理无穷”，它好比是批量梯度速减法，这个固然是好，但实际很难达到。于是，我们选择“进一寸有进一寸的欢喜”，这就是批量梯度速减法。


    (2) 从工程实现的角度来看，消耗内存非常可观。可以想象，如果样本的数量非常庞大，如数百万到数亿，那么计算负载会异常巨大。


    (3) 批量梯度速减优化是一种离线（Off-Line）优化测量。即提前把所有数据全部装载到内存中训练，不允许在线更新模型，如新增培训实例。


    为了解决这些问题，人们通常采用与批量梯度速减法近似的算法——随机梯度速减法。


    # 5.2.5 随机梯度速减法


    在随机梯度速减法中，遵循“一样本，一迭代”的策略。先随机挑选一个样本，然后根据单个样本的误差来调节权值，通过一系列的单样本权值调整，力图达到与批量梯度速减法采取“全样本，一迭代”类似的权值效果。随机梯度速减法的权值更新公式变为式（5-10），即


    ```

    w_{t+1} \leftarrow w_t - \eta \nabla_w J_i(w, x^i, y^i)

    ```


    从表面上看来，式（5-10）和式（5-9）非常类似，但需要注意的是，式（5-10）比式（5-9）少了一个梯度求和的步骤。


    ![](img/aa01495b859013c80481c58ec0894987_161_0.png)


    这种简化带来了很多便利。例如，对于一个具有数百万样本的训练集，完成一次样本遍历就能对权值更新数百万次，效率大大提升，甚至如果运气好的话，不用遍历所有样本，就可以中途找到最优解。反观批量梯度速减法，要遍历数百万样本后，才能更新一次权值。


    图 5-7 批量梯度速减法与随机梯度速减法的权值调整路线对比


    图 5-7 为批量梯度速减法与随机梯度速减法的权值调整路线对比。由图 5-7 可以看出，批量梯度速减法（实线曲线）是一直“稳健”地向最低点前进的，而随机梯度速减法（虚线曲线）明显“聒噪”了许多，具备很多随机性，蹦蹦跳跳、前前后后，但总体上仍然是向最优解逼近的。


    但有时，这种随机性并非完全是坏事，特别是在探寻损失函数的极小值时。我们知道，若损失函数的目标函数是一个凸函数，则它的极小值存在且唯一，沿着梯度反方向就能找到全局唯一的最小值。然而对于非凸函数来说，就没那么简单了，它可能存在许多局部最小值。


    对于批量梯度速减法而言，一旦陷入局部最小值，基于算法本身的策'
