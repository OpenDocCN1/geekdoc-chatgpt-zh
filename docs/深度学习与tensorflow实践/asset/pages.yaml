- pgno: 132
  md: '# 4.8 TensorFlow 中的计算


    在 TensorFlow 中，主要有两种类型的计算：第一种是按元素计算（Element-Wise）；第二种是按维度计算（Dim-Wise）。下面我们分别阐述这两种类型的计算。


    # 4.8.1 按元素计算


    在前文中，我们已经 “牛刀小试” 了部分运算操作，如加法（tf.math.add）、按位乘法（tf.math.multiply）等。


    这些操作都是按元素（Element-by-Element）计算，这种计算要求操作的两个张量的尺寸必须相同，然后相应位置的元素进行对应的计算。


    ```

    In [1]: import tensorflow as tf

    In [2]: a = tf.constant([1, 2, 3, 4])

    In [3]: b = tf.constant([5, 6, 7, 8])

    In [4]: c = tf.math.add(a, b)

    In [5]: c.numpy()

    Out[5]: array([ 6, 8, 10, 12], dtype=int32)

    ```


    在 In [4]处，tf.math.add()实施加法操作，张量 a 的第 0 个（从 0 开始计数，下同）元素 1 和张量 b 的第 0 个元素 5 相加等于
    6，张量 a 的第 1 个元素 2 和张量 b 的第 1 个元素 6 相加等于 8，依此类推。


    对于 tf.math.multiply()实施乘法操作，也是做类似的按位操作。张量 a 的第 0 个元素 1 和张量 b 的第 0 个元素 5 相乘等于 5，张量
    a 的第 1 个元素 2 和张量 b 的第 1 个元素 6 相乘等于 12，依此类推。


    ```

    In [6]: d = tf.math.multiply(a,b)

    In [7]: d.numpy()

    Out[7]: array([ 5, 12, 21, 32], dtype=int32)

    ```


    事实上，TensorFlow 还对很多常见的数学运算符进行了重载。例如，使用加号 “+” 进行加法运算，它的功能等同于 tf.math.add()，从而使得操作更加简单。为了方便读者查阅，我们给出可用于张量的重载运算符列表，表
    4-6 中列出了 TensorFlow 中的一元运算符，表 4-7 列出 TensorFlow 中的二元运算符（部分）。


    # 表 4-6 TensorFlow 中的一元运算符


    | 运算符重载 | 函数操作 | 功能描述 |

    |---|---|---|

    | -x | tf.math.negative(x) | 返回张量 x 的相反数 |


    > 运算符重载是函数多态的一种表现形式，它们的行为随着其参数类型的不同而不同。运算符重载通常只是一种语法糖。本质上，它是以友好的方式模拟了一个函数的调用。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '| 运算符重载 | 函数操作 | 功能描述 |

    |---|---|---|

    | ~ x | tf.math.logical_not(x) | 返回张量 x 中每个元素的逻辑非。x 的 dtype 类型只能是 tf.bool 的张量对象
    |

    | abs(x) | tf.math.abs(x) | 返回张量 x 中的每个元素的绝对值 |


    | 运算符重载 | 函数操作 | 功能描述 |

    |---|---|---|

    | x&y | tf.math.logical_and(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x&y 的真值表 |

    | x|y | tf.math.logical_or(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x|y 的真值表 |

    | x^y | tf.math.logical_xor(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x^y 的真值表 |

    | x+y | tf.math.add(x, y) | 将张量 x 和张量 y 中的元素逐个对应相加 |

    | x-y | tf.math.subtract(x,y) | 将张量 x 和张量 y 中的元素逐个对应相减 |

    | x*y | tf.math.multiply(x,y) | 将张量 x 和张量 y 中的元素逐个对应相乘 |

    | x/y | tf.math.truediv(x,y) | 将张量 x 和张量 y 中的元素逐个对应相除（浮点数） |

    | x//y | tf.math.floordiv（x，y） | 将张量 x 和张量 y 中的元素逐个对应向下取整除法，且不返回余数 |

    | x%y | tf.math.floormod(x,y) 或 tf.math.mod(x,y) | 将张量 x 和张量 y 中的元素逐个对应取模 |

    | x**y | tf.math.pow(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 xy |

    | x<y | tf.math.less(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x<y 的真值表 |

    | x<=y | tf.math.less_equal(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x<=y 的真值表 |

    | x>y | tf.math.greater(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x>y 的真值表 |

    | x>=y | tf.math.greater_equal(x,y) | 将张量 x 和张量 y 中的元素逐个对应求 x>=y 的真值表 |


    在 TensorFlow 中，除上述有关数值计算的操作算子外，还有很多其他操作支撑着 TensorFlow 丰富多彩的张量流计算。例如，关于张量的操作，有
    slice（分片）、split（分割）、random.shuffle（混洗）等；关于矩阵计算的操作，有 inalg.matmul（矩阵乘）、linalg.inv（矩阵的逆）、linalg.det（矩阵行列式）等；有关神经网络的相关操作，有
    nn.softmax、math.sigmoid、nn.relu 和 nn.convolution 等函数。


    使用这些方法，犹如查询字典一般，没有必要将它们全部记住，在需要使用相关方法时，到 TensorFlow 官方网站搜索相关方法的英文全称即可，通常都能找到该方法的使用规则和应用范例。


    # 4.8.2 张量的按轴计算


    在神经网络的计算过程中，经常需要统计数据的各种属性，如最大（大/小）值、最值位置、均值等统计信息。在这个过程中，常出现一个概念“约减”（Reduce，亦有资料将其译作“规约”）。'
