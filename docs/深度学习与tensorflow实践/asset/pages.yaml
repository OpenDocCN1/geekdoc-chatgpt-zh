- pgno: 19
  md: '在这篇文章中，杰弗里·辛顿提出了“深度信念网络（Deep Belief Network，DBN）”的概念，并给出了以下两个重要结论：


    （1）具有多个隐含层的人工神经网络，具有更优秀的特征学习能力。每一层特征的抽取都比前一层抽象，从而学习得到的特征能对数据进行更好的刻画。深度学习的分层预训练，在本质上，就是对输入数据进行逐级抽象，这暗合生物大脑的认知过程。大脑在认知过程中，会将听到的声波信号或看到的视觉图像逐层抽象，最终抽象成语义符号。


    （2）通过逐层初始化的“逐层预训练”（Layer-Wise Pre-Training）来克服训练上的困难，从而可以方便地让神经网络中的权值找到一个接近最优解的初始值，然后再通过“微调”（Fine-Tuning）技术来对整个网络进行优化训练。这样就大幅减少了训练多层神经网络所需的时间。


    就这样，杰弗里·辛顿开辟了联结主义（人工神经网络）的新天地。随后，深度学习的相关研究，如雨后春笋一般铺陈开来。


    > 预训练实际上为神经网络找了一个较好的连接权重初始值。“良好的开端是成功的一半”，这句话也适用于神经网络。


    # 1.1.2 深度学习的巨大影响


    ![](img/aa01495b859013c80481c58ec0894987_19_0.png)


    图 1-3 深度学习入围 2013 年世界十大突破性技术


    近年来，作为人工智能领域最重要的进展——深度学习，在诸多领域都有很多惊人的表现。例如，它在棋类博弈、计算机视觉、语音识别及自动驾驶等领域，表现得与人类一样好，甚至更好。早在
    2013 年，深度学习就被麻省理工学院的《 MIT 科技评论》（MIT Technology Review）评为世界十大突破性技术之一，如图 1-3 所示。


    另一个更具有划时代意义的案例是，2016 年 3 月，围棋世界顶级棋手李世石以 1 : 4 不敌谷歌公司研发的阿尔法围棋（AlphaGo，亦被音译为阿尔法狗，见图
    1-4），这标志着人工智能在围棋领域已经开始“碾压”人类。在


    2016 年年末至 2017 年年初，AlphaGo 的升级版 Master（大师）又在围棋快棋对决中，以 60 场连胜横扫中、日、韩顶尖职业高手，一时震惊世人。而背后支撑
    AlphaGo 具备如此强悍智能的“肢股之臣”之一，正是深度学习。


    > “忽如一夜春风来，千树万树梨花开”。一时间，深度学习这个本专属'
  merge: -1
