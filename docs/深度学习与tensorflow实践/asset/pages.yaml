  md: '# 4.9 张量的广播机制


    当张量之间进行计算时，特别是按元素计算时，通常要求被操作的多个张量在尺寸上要保持一致。但当张量尺寸不一致时，就完全无法计算了吗？


    并非如此。与 NumPy 类似，TensorFlow 有种内部机制，它通过扩充维度较小张量的元素，来适配维度较大的张量，这种机制称为广播（Broadcasting），下面我们就来讨论这个议题。


    # 4.9.1 广播的定义


    广播机制也称为张量自动扩展，它是一种轻量级的张量复制手段。需要说明的是，对于大部分场景，广播机制仅在逻辑上改变张量的尺寸，使得张量的视图（view）变成“拉升”为运算所需张量的尺寸（请注意，此时，这个“拉升”仅仅是一个构思），待实际需要时，才真正实现张量的赋值和扩展。


    这种优化流程，节省了大量计算资源，并由深度学习框架隐式完成，用户无须关心实现细节。TensorFlow 中的广播机制如图 4-8 所示。


    ![](img/aa01495b859013c80481c58ec0894987_136_0.png)


    # 4.9.2 广播的操作与适用规则


    下面，让我们通过以下代码来了解广播的操作。


    ```

    In [1]: import tensorflow as tf    #导入TensorFlow模块

    In [2]: a = tf.range(3)          #创建一个 1D 长度为 3 的张量

    In [3]: a.numpy()                #显示张量 a 的数据

    Out[3]: array([0, 1, 2], dtype=int32)

    In [4]: a + 5                  #1D 张量与 0D 张量（即标量）相加

    Out[4]: <tf.Tensor: id=108, shape=(3,), dtype=int32, numpy= array([5, 6, 7], dtype=int32)>

    ```


    在 In [4]处，我们要实现的功能是，将一个长度为 3 的 1D 张量[0, 1, 2]和一个 0D 张量（标量）5 相加，我们知道，前者 shape=(,)，后者
    shape=()，二者在尺寸上是“门不当，户不对”。难道二者就不能相加吗？自然不是，广播机制可以将一个标量（5）拉伸成为一个尺寸为(3,)的张量，如图 4-8
    (a)所示。'
  merge: -1
  img_proc: true
- pgno: 137
  md: "此时，拉伸后的张量尺寸与张量 a 的尺寸完全适配，并且被拉伸填充的张量的所有元素都复制了拉伸前的元素，而那个标量（5）就像被广播出去了一样，即传递到所有拉伸空缺的位置。这种广播规则在二维数组中同样适用，只不过是被传播复制的“粒度”不一样罢了。参见如下代码。\n\
    \n```\nIn [5]: tf.ones([3,3], dtype = tf.int32) + tf.range(3)\nIn [6]: c.numpy()\n\
    Out[6]:\narray([[1, 2, 3],\n       [1, 2, 3],\n       [1, 2, 3]], dtype=int32)\n\
    ```\n\n上述代码的示意图如图 4-8(b)所示。从图中可以看出，tf.range(3)是一个 1D 张量，它与 tf.ones([3,3])生成的 2D\
    \ 张量，在维度尺寸上也是不匹配的。为了让计算得以进行，TensorFlow 就把 tf.range(3)代表的 1D 张量以行为单位进行拉伸复制，从而把张量的尺寸也变成了(3,\
    \ 3)。\n\n需要注意的是，在 In [5]处，如果我们仅使用 tf.ones([3, 3])，那么默认产生的是尺寸为 3×3（2D 张量）、值全为 1.0\
    \ 的浮点数张量，与 tf.range(3)产生的 1D 整型张量在数据类型上不匹配，TensorFlow 不支持这样的广播，所以要在 tf.ones([3,\
    \ 3])中“显式”指定张量的类型：dtype = tf.int32，使二者的数据类型也彼此适配。 In [6]处通过张量的 numpy()方法，输出“纯洁版”的张量数据。\n\
    \n此外，TensorFlow 的广播机制还支持两个张量同时扩展，以适应对方张量的维度。相关代码如下。\n\n> 在 TensorFlow 中，若 n 维张量的元素总数\
    \ N 已知，且(n-1)维的维度信息也确定，则第 n 维的维度信息很容易通过推断得到，于是，程序员可用“-1”代替这个维度。法：“-1”的含义是告知编译器自动推断剩余维度。\n\
    \n```\nIn [7]: tf.reshape(range(3),[-1,1]) + tf.range(3)\nOut[7]:\n<tf.Tensor:\
    \ id=142, shape=(3, 3), dtype=int32, numpy=\narray([[0, 1, 2],\n       [1, 2,\
    \ 3],\n       [2, 3, 4]], dtype=int32)>\n```\n\n上述代码的示意图如图 4-8(c)所示。从图中可以看出，tf.reshape(range(3),[-1,1])表示的是\
    \ 3 行 1 列的张量。而 tf.range(3)表示的是 1 行 3 列的张量。为了彼此适配，前者通过在列维度方向的复制，从 1 列变成了 3 列。同样，后者\
    \ tf.range(3)也是为了适配对方，它在行维度上进行复制，从 1 行变成了 3 行。最后，二者都变成 3 行 3 列的张量，适配成功，从而使得计算得以执行。"
