    > 物理学对波的研究已经非常深入了，提出了很多处理波的方法，其中就有滤波器（Filter），其作用是过滤掉某些波（或说噪音信号），而保留另一些波。简单来说，滤波就是一种信息萃取的方式。卷积操作本质上就是一种滤波行为。


    在图像处理中应用卷积操作，其主要功能在于，利用特征模板对原始信号（输入图像）进行滤波操作，从而达到提取特征的目的。卷积可以很方便地通过从输入的一小块数据矩阵（一小块图像）中学到图像的特征，并能保留像素间的相对空间关系。下面举例说明在二维图像中使用卷积的过程。


    # 7.3.2 卷积运算


    在信号处理或图像处理中，经常使用一维（1D）卷积或二维（2D）卷积运算。下面，我们先来说明一维卷积运算，它经常用在信号处理任务中。


    一维信号的两个向量的卷积结果仍然是一个向量，其计算过程如图 7-9 所示。首先，将两个向量的首元素对齐，并截取长向量的多余部分，然后，做这两个维度相同元素的向量内积运算。例如，一开始，向量(1,
    2, 3)与临时向量(4, 5, 6)做点乘，即 1x4+2x5+3x6=32，这样就得到了结果向量的第一个元素 32，如图 7-9(a)所示。


    然后重复“滑动-截取-计算内积”这个流程，直到短向量和长向量最后一个元素对齐位置，如图 7-9(c)所示。综合看来，上述例子中的卷积运算可以描述为(1, 2,
    3)*(4, 5, 6, 7, 8)=(32, 38, 44)。其中，(32, 38, 44)就是计算出来的特征向量。


    很显然，特征向量(32, 38, 44)的长度（3）要比长向量(4, 5, 6, 7, 8)的长度（5）要短。有时，我们希望得到的特征向量和长向量等长，这时，我们可以将长向量(4,
    5, 6, 7, 8)左右两边都扩充一个 0，得到一个更长的向量(0, 4, 5, 6, 7, 8, 0)，然后重复如图 7-9 所示的计算过程，就会得到一个长度与原始长向量等长的结果向量（特征向量长度也为
    5）。'
