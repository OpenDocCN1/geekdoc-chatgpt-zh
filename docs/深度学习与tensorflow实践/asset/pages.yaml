- pgno: 202
  md: '研究热潮）和 VGGNet[3]（牛津大学计算机视觉组和 Google DeepMind 公司的研究员一起研发的深度卷积神经网络）等。在后续的章节中，我们会有选择性地介绍这些经典神经网络。


    如前所述，深度神经网络的核心观念就是“层”。“层”这个概念，其实并没有那么复杂，它就是对数据实施某种加工的过程。我们可以将神经网络层理解为数据过滤器。数据从输入层进来，经过转换，以另一种更有用的模式输出，这个过程称为数据蒸馏（Data
    Distillation）。通过层层数据的提炼和蒸馏，最后到了输出层，得到我们想要的结果。如果没有得到我们想要的结果（存在误差），那么这里就要通过优化算法进行调参。


    因此，在本质上，深度学习所做的工作就好像把一个乱糟糟的纸团（好比高维、混杂的数据），通过一层层的展开操作（好比神经网络的各个不同层次），将其展开为一张“勉强堪用”的纸张（好比简单易懂的数据结论，如分类操作、回归预测等）的过程[4]，如图
    6-11 所示。


    常见的神经网络层有 Flatten（展平层，将数据展平为一维张量）、Dense（全连接层，常用于分类）、Activation（激活层，对数据进行非线性变化）、Dropout（随机失活层，令部分神经元随机失效，防止过拟合）、Conv2D（卷积层，提取特征图谱）及
    MaxPooling2D（最大池化层，通过最大值采样稀疏化全连接层，减少计算量）。


    ![](img/aa01495b859013c80481c58ec0894987_202_0.png)


    图 6-11 数据的功能：将复杂、高维数据展平的隐喻


    在 TensorFlow 2 中，推荐使用集成的 tf.keras 模块来构建神经网络，实际上它就是 Keras 计算框架高层 API 的一种包装。


    tf.keras 模块中常用的 5 大模块有：datasets（数据库）、layers（神经网络层）、losses（损失函数）、optimizers（优化器）和
    metrics（评价标准）。下面简述它们的功能。


    datasets 模块的主要作用是导入数据和变换数据。范例 6-1 和范例 6-2 的代码初始部分已有涉及。'
