  md: '这里需要注意的是，学习率 \(\eta\) 的作用是“缓和”每一步权值调整的强度。它本身的值是比较难确定的，若 \(\eta\) 太小，则网络调参的次数较多，从而收敛速度很慢；若
    \(\eta\) 太大，则权值更新的步子迈得太大，可能会错过网络参数的最优解。因此合适的 \(\eta\) ，在某种程度上，依赖于人工经验（即属于超参数范畴）。通常，将
    \(\eta\) 的初值设为一个较小的数（如 0.01）。


    # ## 2.2.6 感知机中的激活函数


    如前所述，激活函数的主要作用是非线性变化，它能让神经元的输出更加符合我们的预期，也就是说，增强了神经网络的表达能力。前面我们提到了，神经元的工作模型存在“激活（1）”和“抑制（0）”两种状态的跳变，那么理想的激活函数就应该是如图
    2-9(a)所示的阶跃函数（常标记为 \(\text{sgn}(x)\)）。


    ![](img/aa01495b859013c80481c58ec0894987_39_0.png)


    图 2-9 典型的神经元激活函数


    但实际上，在实际使用中，这类函数具有不光滑、不连续等众多不“友好”的特性，使用得并不广泛。为什么说它“不友好”呢？这是因为在训练网络权值时，通常依赖于对某个权值求偏导数、寻极值，而不光滑、不连续等通常意味着该函数无法“连续可导”。


    因此，我们通常用函数 Sigmoid 来代替阶跃函数，如图 2-9(b)所示。无论输入值 \(x\) 的范围有多大，该函数都可以将输出“挤压”在\([0,
    1]\)区间内，故此该函数又被称为“挤压函数（Squashing Function）”。


    # ## 2.2.7 感知机的几何意义


    下面我们来分析一下感知机的几何意义。由感知机的功能函数定义可知，它由两个函数复合而成，内部为神经元的输入汇集函数，外部为激活函数，将汇集函数的输出作为激活函数的输入。若识别对象
    \(x\) 有 \(n\) 个特征，内部函数就是式（2-1）的输入汇集。'
