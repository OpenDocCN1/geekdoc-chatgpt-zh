- pgno: 172
  md: '$$ \frac{\partial Z}{\partial X} = (\alpha + \beta + \chi)(\delta + \varepsilon
    + \xi) \quad (5-15) $$


    或许你会困惑，将式（5-14）恒等变换为式（5-15），有什么意义呢？


    前文提到的前向模式微分，的确就是我们通常在高等数学课堂上学习的求导方式。在这种求导模式中，强调的是某个输入（如 \( X \)）对某个节点（如神经元）的影响。因此，在求导过程中，偏导数的分子部分总是根据不同的节点而不断变化，而分母则锁定为偏导数变量
    \( \partial X \)，保持不变（见图 5-18(a)）。


    相比而言，反向模式微分则有很大不同。首先在求导方向上，它是从输出端（Output）到输入端（Input）反向进行求导。其次，在求导方法上，它不再是对每一条路径加权相乘然后求和，而是针对节点采纳“合并同类路径”和“分阶段求解”的策略。


    以图 5-18(b)为例，先求 \( Z \) 节点对 \( Z \) 节点的影响，即求 \( Z \) 对 \( Z \) 自身的偏导数


    $$ \frac{\partial Z}{\partial Z} = 1 $$


    这个步骤看起来没有意义，但对于算法而言，它是规范化的起点，相当于算法的初值，该值需要给出。然后，求 \( Y \) 节点对 \( Z \) 节点的影响，即求
    \( Z \) 对 \( Y \) 的偏导数


    $$ \frac{\partial Z}{\partial Y} = \frac{\partial Z}{\partial Y} \cdot \frac{\partial
    Z}{\partial Z} = (\delta + \varepsilon + \xi) \cdot 1 $$


    再求节点 \( X \) 对节点 \( Z \) 的影响，即求 \( Z \) 对 \( X \) 的偏导数：


    $$ \frac{\partial Z}{\partial X} = \frac{\partial Y}{\partial X} \cdot \frac{\partial
    Z}{\partial Y} \cdot \frac{\partial Z}{\partial Z} = (\alpha + \beta + \chi) \cdot
    (\delta + \varepsilon + \xi) \cdot 1 $$


    在上述求导过程中，我们利用乘法规则来求 \( X \) 对 \( Z \) 的影响。观察等号最左端可发现，在求导形式上，偏导数的分子部分（如 \( \partial
    Z \) 节点）不变，而分母部分总是随着节点不同而变化。


    还有一个值得注意的细节是，假设 \( X \)、\( Y \) 和 \( Z \) 代表的是不同网络的单元，当使用反向模式微分求导时，求后一层单元的导数，需要利用前面一层的求导结果，而前一层的值已经得到，这样大大节省了计算成本。


    BP 算法将网络权值纠错的运算量从原来的与神经元数目的平方成正比，减小到只与神经元数目本身成正比。这是因为反向模式微分节省了计算冗余。'
