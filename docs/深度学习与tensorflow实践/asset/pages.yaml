  md: '轴)，这时需要用到 tf.expand_dims() 方法。参见如下代码。


    ```

    ```python

    In [1]: import tensorflow as tf

    In [2]: A = tf.random.normal([5, 30, 7]) #构建三维张量 A

    In [3]: A.shape #查看三维张量 A 的维度信息

    Out[3]: TensorShape([5, 30, 7])

    In [4]: A = tf.expand_dims(A, axis = 0) #为张量 A 在第 0 个轴添加一个维度

    In [5]: A.shape #再次查看三维张量 A 的维度信息

    Out[5]: TensorShape([1, 5, 30, 7])

    In [6]: B = tf.random.normal([5, 30, 7]) #构建三维张量 B

    In [7]: B.shape #查看三维张量 B 的维度信息

    Out[7]: TensorShape([5, 30, 7])

    In [8]: B = tf.expand_dims(B, axis = 0) #为张量 B 在第 0 个轴上添加一个维度

    In [9]: B.shape #再次查看三维张量 B 的维度信息

    Out[9]: TensorShape([1, 5, 30, 7])

    ```

    ```


    当张量 A 和张量 B 维度升维后，就有张量合并的基础了，这时可以利用 tf.concat()方法来合并它们。


    ```

    ```python

    In [10]: A_B = tf.concat([A,B],axis=0) #合并张量 A 和张量 B

    In [11]: A_B.shape

    Out[11]: TensorShape([2, 5, 30, 7])

    ```

    ```


    从 Out[11]处的运行结果可以看出，合并的张量尺寸变成了[2, 5, 30, 7]。这符合我们的认知。


    反过来，假设在数据处理完毕后，张量 A 和张量 B 的维度又被分割为[1, 5, 30, 7]，那么第一个维度（第 0 个轴）存在的意义就不大了。这就好比，若学生在同一所学校
    A，称呼起来，我们说学校 A 的 1 班，学校 A 的 2 班，学校 A 的 3 班等，故在同一所学校，“学校 A”是没有区分度的，属于冗余信息。这时简单的方法就是降维（把第一个维度丢弃掉），这时需要使用
    tf.squeeze() 方法。顾名思义，这个方法就是把不必要的维度（数轴）给“压缩”掉。


    ```

    ```python

    In [12]: A.shape #查看维度缩减前张量 A 的维度信息

    Out[12]: TensorShape([1, 5, 30, 7])

    In [13]: A = tf.squeeze(A, axis = 0) #在轴 0 上进行维度缩减

    In [14]: A.shape #查看维度缩减后张量 A 的维度信息

    Out[14]: TensorShape([5, 30, 7])

    ```

