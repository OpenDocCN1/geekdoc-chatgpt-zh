    $y = f(-0.6 \times x_1 + 0 \times x_2 - (-0.5))$

    $= f(-0.6 \times x_1 + 0.5)$


    此时，当 \(x_1=1\) 时，\(y = 0\)；当 \(x_1 = 0\) 时，\(y = 1\)。这样，就完成了逻辑 “非” 的运算（当然，若以 \(x_2\)
    做 “非” 运算，则也是类似操作，得到的结果是相同的，这里不再赘述）。


    更一般地，当我们给定训练数据时，神经网络中的参数（权值 \(w_i\) 和阈值 \(\theta\)）都可以通过不断地 “纠偏” 学习得到。为了方便，我们通常把阈值
    \(\theta\) 视为 \(w_0\)，而其输入值 \(x_0\) 固定为-1，阈值 \(\theta\) 就可视为一个 “哑元节点（Dummy Node）”。这样一来，权值和阈值的学习可以
    “一统天下”，称为 “权值” 的学习，其形式化描述为式（2-4）。


    亦有资料将哑元节点固定设置为 1，其实差别不大，主要取决于表达式 \(w_0\) 前面的正负号。


    \(S = w_1 x_1 + w_2 x_2 + ... + w_n x_n - \theta\)

    \(= w_n x_n + ... + w_2 x_2 + w_1 x_1 + w_0 x_0\)

    \(= \sum_{i=0}^n w_i x_i\) （2-4）


    如此一来，感知机的学习规则就更加简单明了了，如图 2-8 所示。


    对于训练样例 \((x, y)\)（需要注意的是，这里粗体字 \(\mathbf{x}\) 表示一个特征向量），若当前感知机的实际输出 \(y''\) 不符合预期，即存在
    “落差”，则感知机的 3 个权值可依据式（2-5）的规则统一进行调整。


    ![](img/aa01495b859013c80481c58ec0894987_38_0.png)


    \(w_{i_{new}} \leftarrow w_{i_{old}} + \Delta w_i \quad (2-5)\)

    \(\Delta w_i \leftarrow \eta (y_i - y''_i) x_i\)


    其中，\(\eta \in (0, 1)\) 称为学习率。式（2-5）其实是感知机的权值公式（2-3）的一般化描述。由式（2-5）可知，若 \((x, y)\)
    预测正确，则可知 \(y - y'' = 0\)，感知机的权值不会发生任何变化（因为 \(\Delta w_i = 0\)），否则就会根据 “落差” 的程度做对应调整。'
