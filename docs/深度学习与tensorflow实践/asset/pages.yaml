  md: '的区别在于，每次参数更新时计算的样本数据量不同，下面分别给予简单介绍。


    # 5.2.4 批量梯度递减法


    假设训练样本总数为 n，样本可描述为 {(x<sup>1</sup>, y<sup>1</sup>), ..., (x<sup>i</sup>, y<sup>i</sup>),
    ..., (x<sup>n</sup>, y<sup>n</sup>)}，这里的 x<sup>i</sup> 表示第 i 个样本的特征向量，其实它可能是一个
    m 维的向量，包含了 m 个特征，y<sup>i</sup> 表示第 i 个样本的标签（输出的预测值）。如前所述，凡是有标签的样本训练都属于监督学习。


    于是梯度递减的训练法则为


    w<sub>t+1</sub> ← w<sub>t</sub> + Δw (5-7)


    其中，t 表示时间步长（Time Step），式（5-7）表明的含义很简单，就是说(t+1)轮的权值 w<sub>t+1</sub> 等于第 t 轮的权值
    w<sub>t</sub> 加上一个权值变化率 Δw。请注意，这里的权值 w 其实是一个向量，它泛指所有神经网络中的所有权值。这个权值的变化率 Δw 与第
    t 轮的全体样本的权值梯度及学习率密切相关，即


    Δw = -η<sub>t</sub> Σ<sub>i∈D</sub> ∇<sub>w</sub>J<sub>i</sub>(w, x<sup>i</sup>,
    y<sup>i</sup>) (5-8)


    其中，负号“-”表示梯度相反方向，η<sub>t</sub> 是步长（也称学习率），之所以有个下标 t，是因为学习率可能随着时间变化而不同（如学习率衰减）。因此，梯度下降的权值更新法则为


    w<sub>t+1</sub> ← w<sub>t</sub> - η<sub>t</sub> Σ<sub>i∈D</sub> ∇<sub>w</sub>J<sub>i</sub>(w,
    x<sup>i</sup>, y<sup>i</sup>) (5-9)


    由式（5-9）可以看出，每进行一次参数更新都需要计算整个数据样本集，因此这种算法也称为批量梯度递减法。


    在工程实践中，批量梯度递减法主要存在以下三个方面的挑战。


    +   (1) 当数据量大大时，收敛过程可能非常慢。若根据式（5-9）的模型来训练权值参数，则每次更新迭代都要遍历训练样本集合 D 中的所有成员，然后求误差和，并且分别求各个权值的梯度，迭代一次都会“大动干戈”。因此，导致批量梯度递减法的收敛速度会比较慢，尤其是数据集非常大的情况下，收敛速度会非常慢，但由于每次梯度递减的方向为总体平均梯度，因此它得到解的过程很平滑，发生震荡的概率较小。我们也可以将其理解为“船大难调头”的正面收益。'
