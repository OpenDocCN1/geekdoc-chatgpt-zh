    # 8.4.3 many-to-one


    many-to-one 结构也是很常见的。它表示输入为可变长度的向量，输出为固定长度的向量。例如，在情感分析场景中，输入为长度可变的文章、留言等，而输出为某个情感分析（如积极、中性或消极）的分类，如图
