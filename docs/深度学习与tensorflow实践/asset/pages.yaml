    Memory，LSTM）的重要理论基础。LSTM 是 RNN 的一种高级变种[3]，后面的章节会详细讲解。


    # ## 8.2.4 RNN 的应用领域


    我们知道，根据通用近似定理，一个三层的前馈神经网络，在理论上，可以学会逼近任意函数。那 RNN 又如何呢？1995 年，Siegelmann 和 Sontag
    已经证明了带有 Sigmoid 激活函数的 RNN，是图灵完备（Turing Completeness）的[3]。这就意味着，若给定合适的权值，则 RNN
    可以模拟任意计算的能力。然而，这仅仅是一种理论上的情况，因为对于给定的一个任务，我们很难找到完美的权值。


    ![](img/aa01495b859013c80481c58ec0894987_273_0.png)


    事实上，第一代 RNN 并没有引起世人的注意，就是因为 RNN 在利用反向传播调参过程中，产生了严重的梯度消失或梯度爆炸（连乘的梯度趋于无穷大，造成系统不稳定）等问题。直到
    1997 年，才有了重大突破，如 LSTM 等模型的提出[4]，才让新一代的 RNN 获得蓬勃发展。


    RNN 最先是在自然语言处理（Natural Language Processing，NLP）领域中被成功用起来的。例如，2003 年，约书亚·本吉奥（Yoshua
    Bengio）将 RNN 用于优化传统的 N 元统计模型（N-gram Model）[5]，提出了关于单词的分布式特征表示，较好地解决了传统语言处理模型的维度诅咒（Curse
    of Dimensionality）问题。


    后来，RNN 的作用越来越大，并不限于自然语言处理，它还在机器翻译、语音识别应用（如谷歌的语音搜索和苹果的 Siri）、个性化推荐等众多领域大放光彩。


