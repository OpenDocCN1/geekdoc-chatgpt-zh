  md: "B-Spline、一般 Spline 及小波函数等作为基础函数，然后实施各种线性组合，来拟合更为复杂的函数[7]。所不同的是，神经网络常用的基础函数是非线性的神经网络函数（如\
    \ sigmoid 或 ReLU 等激活函数）。\n\n通用近似定理告诉我们，不管函数 f(x)在形式上有多复杂，我们总能确保找到一个神经网络，对任何可能的输入\
    \ x，以任意高的精度近似输出 f(x)（见图 2-16）。即使函数有多个输入和输出，即 f = f(x1, x2, x3, ..., xm)，通用近似定理的结论也是成立的。换句话说，神经网络在理论上可近似解决任何问题。有关神经网络可以计算任意函数的可视化证明，感兴趣的读者可以参阅尔尼森的博客文章[8]。\n\
    \n![](img/aa01495b859013c80481c58ec0894987_49_0.png)\n\n图 2-16 通用近似定理\n\n在使用通用近似定理时，需要注意以下两点。\n\
    \n+   (1) 定理说的是，可以设计一个神经网络尽可能好地“近似”某个特定函数，而不是说“准确”计算这个函数。我们通过增加隐含层神经元的个数来提高近似精度。\n\
    \n+   (2) 被近似的函数必须是连续函数。若函数是非连续的，即有极陡跳跃的函数，神经网络就“爱莫能助”了。\n\n> 数学家通常考虑的是某个问题解的存在性。而工程师则要考虑找到问题解的可行性。\n\
    > \n> 数学家负责将“梦想”弄得很丰满，而工程师负责把“现实”弄得不那么骨感。\n\n即使函数是连续的，有关神经网络是否能解决所有问题，也是有争议的。原因很简单，虽然通用近似定理在理论上堪称完美，但是在实际操作中却难以实现。\n\
    \n例如，深度学习新秀、生成对抗网络（GAN）的提出者伊恩·古德费洛（Ian Goodfellow）就曾说过：“仅含有一层的前馈网络，的确足以有效地表示任何函数，但是，这样的网络结构可能会格外庞大，进而无法正确地学习和泛化。”\n\
    \n古德费洛的言外之意是说，“广而浅薄”的神经网络在理论上是万能的，但在实践中却不是那么回事。因此，网络向“深”的方向去做才是正途。事实上，通用近似定理早在\
    \ 1989 年就被提出来了，到 2006 年深度学"
