- pgno: 240
  md: '![](img/aa01495b859013c80481c58ec0894987_240_0.png)


    # 图 7-16 全连接与局部连接示意图


    局部连接要比原来全连接稀疏很多。因此，局部连接也称为稀疏连接（Sparse Connectivity）。


    # 7.5.2 卷积核深度


    卷积核的深度（Depth），对应的是卷积核的个数。每个卷积核都只能提取输入数据的部分特征。显然，在大部分场景下，单个卷积核提取的特征是不充分的。这时，我们可以通过添加多个卷积核来提取多个维度的特征。每个卷积核与原始输入数据执行卷积操作都会得到一个卷积特征。将多个这样的特征汇集在一起，称为特征图谱。


    每个卷积核提取的特征都有各自的侧重点。通常来说，多个卷积核的叠加效果要比单个卷积核的分类效果好得多。例如，在 2012 年的 ImageNet 竞赛中，Hinton
    与他的学生 Krizhevsky 构造了第一个大型深度卷积神经网络，即现在众所周知的 AlexNet[8]，成为第一个深度神经网络的应用，在这个夺得冠军的算法中，使用了
    96 个卷积核。可以说，从那时起，深度卷积神经网络一战成名，逐渐被世人瞩目。


    # 7.5.3 步幅


    步幅（Stride），是指在输入矩阵上滑动滤波矩阵的像素单元个数。设步幅大小为 s，当 s 为 1 时，滤波器每次移动 1 像素，当 s 为 2 时，滤波器每次移动
    2 像素。为简单起见，以一维数据为例，当卷积核为(1, 0, -1)，步幅分别为 1 和 2 时，图 7-17 显示了输入层后卷积层的神经元分布情况。从图中可以看出，s
    越大，得到的特征图越小。'
