- pgno: 291
  md: '在信息检索中，词袋模型假说是这样描述的：通过把查询和文档都表示成词袋，我们可以计算一个文档和查询的契合程度。词袋模型假说认为，一篇文档的词频（而非词序）代表了文档的主题，这也是有现实支撑的。例如，如果一篇文章中经常出现诸如“足球”“篮球”“NBA”等词汇，那么能判断它是一则体育新闻。


    下面，我们再讨论一下什么是分布假说。英国著名语言学家约翰·鲁伯特·弗斯（John Rupert Firth）有一句名言，它常指导着计算机科学家构建更为适用的自然语言处理模型。名言是这么说的：


    > > "You shall know a word by the company it keeps."


    大意是说“观词群，知词意”。这里的“company”表示“伴随”之意，强调某个词所处的环境。弗斯等人的观点衍生了自然语言处理的另外一个假说——分布假说，即“相同语境出现的词，应具有相似的语义（Words
    that occur in similar contexts tend to have similar meanings）”。


    这个假设是在说明，单词的含义需要放在特定的上下文中去理解。因为具有相同上下文的单词，往往是有联系的。例如，在语料库中有这样的句子“The cat is walking
    in the bedroom”和“A dog was running in a room”。即使我们不知道“cat”和“dog”为何物，也能根据分布于它周围的语境，推测二者具有语义上的相似性。这是因为“the”对“a”，“walking”对“running”，“room”对“bedroom”，它们都有类似的语义，那么“cat”和“dog”在某种程度上具有（语法或语义上的）相似性，几乎是肯定的。


    如果将抽象的分布假说用于测量意义的相似性，那么通常就会用到单词的向量、矩阵和高阶张量。因此，分布假说与向量空间模型（Vector Space Model，VSM）有着密切的关联。事实上，当前最为流行的Word2vec
    工具就是基于分布假说设计的。下面我们就讨论一下单词的向量空间表示。


    这里“2”是“to”的简化拼音。所以，Word2Vec 的完整含义就是，从单词（Word）到（to）向量（Vector）。


    # ## 8.10 词向量表示方法


    对于图像和音频等数据而言，其内在的属性决定了它们很容易被编码并存储为密集向量形式。例如，图片是由像素点构成的密集矩阵，音频信号也可以转换为密集的频谱数据。


    类似地，在自然语言处理中，词是语言中的最小单位，词需要找到便于计算机理解的表达方式，之后才能有效地进行接下来的操作。在自然'
  merge: -1
