    \       # 训练......\n```\n\n上述代码使得 for x,y in train_db 循环迭代 20 个 epoch 才会退出。事实上，可以认为通过\
    \ repeat(20)操作，数据被复制 20 次，即相当于数据集合被放大 20 倍，这样用一层 for 循环即可完成训练。\n\n当然，我们也可以通过设置\
