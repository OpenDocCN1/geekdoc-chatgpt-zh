- pgno: 294
  md: '# 8.10.2 分布式表示


    针对独热编码的不足，人们自然就会设想，能否用一个连续的、低维密集向量来刻画一个词的特征呢？这样一来，人们不仅可以直接刻画词与词之间的相似度，而且还可以构建一个从向量到概率的平滑函数模型，使得相似的词向量可以映射到相近的概率空间上。这个稠密连续向量也称为单词的分布式表示。


    再回到如图 8-24 所示的 4 个单词的讨论上来，我们知道它们彼此之间在语义上的确是存在一定关联的。现在我们人为找到它们之间的联系，且不再使用独热编码。假设我们使用两个节点，每个节点均使用两位编码，其含义如表
    8-1 所示。


    # 表 8-1 4 个单词的分布式表述


    | 编码位 | 0 | 1 |

    |---|---|---|

    | gender ( 性别 ) | female ( 女性 ) | male ( 男性 ) |

    | age ( 年龄 ) | child ( 孩子 ) | adult ( 成人 ) |


    如果我们规定这个分布式表述有两个维度的特征，第一个维度为 gender ( 性别 )，第二个维度是 age ( 年龄 )。那么，girl 可以被编码成向量[0,0]，即“女性孩子”。boy
    可以编码为[1,0]，即“男性孩子”。woman 可以被编码成[0,1]，即“成年女性”。man 可以被编码成[1,1]，即“成年男性”。这样我们使用优化后的输入节点，再次构造神经网络，如图
    8-25 所示。


    ![](img/aa01495b859013c80481c58ec0894987_294_0.png)


    相比之下如图 8-24 所示的网络结构，图 8-25 的分布式编码神经网络要简单很多。此时，需要学习的权值从 4x3=12 个，缩小到 2x3=6 个。由于每个词都有两个节点编码，当输入训练数据
    “girl” 时，与 “girl” 共享相同连接的其他样本也可以得到训练。例如，它可以帮助到与其共享 “female” 的 “woman”，以及和 “boy”
    共享的 “child” 的权值训练。如此一来，参数的训练不再彼此孤立，而是彼此 “混搭”，即参数共享。


    前面我们提到，girl 可以被编码为[0,0]，boy 可以编码为[1,0]等，它们的编码都是或 0 或 1 的整数。实际上，更普遍的情况是，用更多不同实数的特征值表示。这种向量长成这般模样：


    ```

    W("girl")=[0.19, -0.47, 0.72 ...]

    W("boy")=[0.0, 0.6, -0.31, ...]

    ```'
