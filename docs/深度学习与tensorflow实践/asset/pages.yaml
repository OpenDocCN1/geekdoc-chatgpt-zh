    \n# 6.4.11 tf.keras 中的模型编译\n\n观察范例 6-4 可以发现，利用 tf.keras 搭建一个神经网络模型不难，但模型训练过程中，依然需要用户自己注意很多细节。例如，计算损失函数和更新梯度等，通常初学者掌握起来相对困难。事实上，在\
