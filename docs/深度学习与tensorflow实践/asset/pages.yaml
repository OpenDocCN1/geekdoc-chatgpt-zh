  md: "现在需要将数据在班级维度上分割为 10 个张量，每个张量均保存一个班级的成绩数据。可以通过 tf.split()方法完成张量的分割操作，其方法原型如下。\n\
    \n```\ntf.split(\n    value, num_or_size_splits, axis=0, num=None, name='split'\n\
    \    )\n```\n\n各参数含义如下。\n\n+   - value: 待分割张量。\n+   - num_or_size_splits: 表明分割方案。当\
    \ num_or_size_splits 为单个数值时，如 10，表示将张量等分为 10 份；当 num_or_size_splits 为列表时，列表的每个元素表示每份的长度，如[2,\
    \ 4, 2, 2]表示将张量分割为 4 块（即列表的长度），每块的元素个数依次是 2 个、4 个、2 个和 2 个。\n+   - axis: 指定分割的维度索引引号。默认为在第\
