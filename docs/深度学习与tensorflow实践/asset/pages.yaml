    # 7.2 卷积神经网络的概念


    在前文中，我们简要地介绍了卷积神经网络的来龙去脉。接下来，我们将逐一解析它的核心要素。卷积神经网络的名称来自其中的卷积操作。因此说到卷积神经网络，它最核心的概念可能莫过于“什么是卷积”了。


    # 7.2.1 卷积的数学定义


    “Convolutional（卷积）”源自拉丁文“Convolvere”，其含义就是“卷在一起（Roll Together）”。脱离卷积神经网络这个应用背景，“卷积”其实是一个标准的数学概念。'
