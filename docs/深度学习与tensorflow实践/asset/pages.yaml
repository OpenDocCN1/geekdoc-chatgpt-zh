- pgno: 20
  md: '于计算机科学的术语，成为学术界、工业界甚至风险投资界等众多领域的热词。的确，它已对我们的工作、生活甚至思维都产生了深远的影响。


    ![](img/aa01495b859013c80481c58ec0894987_20_0.png)


    图 1-4 AlphaGo


    例如，有人就认为，深度学习不仅是一种算法的升级，还是一种全新的思维方式。我们完全可以利用深度学习通过对海量数据的快速处理，来消除信息的不确定性，从而帮助我们认知世界。它带来的颠覆性在于，将人类过去痴迷的算法问题演变成数据和计算问题。现在，“算法为核心竞争力”正在转变为“数据为核心竞争力”。


    在人工智能领域，深度学习之所以备受瞩目，是因为从原始的输入层开始，再到中间每一个隐含层的数据抽取变换，到最终的输出层的判断，所有特征的提取全过程是一个没有人工干预的训练过程。这个自主特性在机器学习领域是革命性的。


    知名深度学习专家吴恩达（Andrew Ng）曾表示：“我们没有像通常（机器学习）做的那样，自己来框定边界，而是直接把海量数据投放到算法中，让数据自己说话，系统会自动从数据中学习。”负责谷歌大脑项目（Google
    Brain Project）的计算机科学家杰夫·迪恩（Jeff Dean）则说：“在训练的时候，我们从来不会告诉机器：‘这是一只猫’。实际上，是系统自己发明或者领悟了‘猫’的概念。”


    # ## 1.2 从学习到机器学习


    # ### 1.2.1 什么是学习


    说到“深度学习”，追根溯源，我们需要知道什么是“学习”。“学习”这个词听起来很普通，从小到大，写作文、引用名人名言的时候，估计我们谁都没少说过学习有多重要的话。例如，孔子说“学而时习之”，培根说“知识就是力量”。


    可到底什么是学习呢？或许我们太过于“身处其中”，反而说不清楚。著名学者赫伯特·西蒙（Herbert Simon，1975 年图灵奖获得者，1978 年诺贝尔经济学奖获得者）曾对“学习”下过一个定义：


    > “如果一个系统，能够通过执行某个过程，就此改进了它的性能，那'
  merge: -1
  img_proc: true
- pgno: 21
  md: '么这个过程就是学习”。


    从赫伯特·西蒙的观点可以看出，学习的核心目的就是改善自身性能。


    其实对于人而言，这个定义也是适用的。例如，我们现在正在学习深度学习的知识，其本质目的就是为了提升自己在深器学习方面的认知水平。如果我们仅仅是低层次的重复性学习，而没有达到认知升级的目的，那么即使表面看起来非常勤奋，其实也仅仅是一个“伪学习者”，因为我们没有改善性能。


    按照这个解释，“好好学习，天天向上”就会具有新的含义：如果没有性能上的“向上”，即使非常辛苦地“好好”，即使长时间地“天天”，那么也都无法算作“学习”。


    # ## 1.2.2 什么是机器学习


    遵循赫伯特·西蒙的观点，对于计算机系统而言，通过运用数据及某种特定的方法（如统计方法或推理方法）来提升机器系统的性能，就是机器学习（Machine Learning，
    ML）。


    英雄所见略同。卡耐基·梅隆大学的机器学习和人工智能教授 T. Mitchell，在他的经典教材《机器学习》中也给出了更为具体（其实也很抽象）的定义[9]：


    ![](img/aa01495b859013c80481c58ec0894987_21_0.png)


    对于某类任务（Task，简称 T）和某项性能评价准则（Performance，简称 P），如果一个计算机程序在 T 上，以 P 作为性能的度量，随着经验（Experience，简称
    E）的积累，不断自我完善，那么我们称这个计算机程序从经验 E 中进行了学习。


    例如，对于学习围棋的程序 AlphaGo，它可以通过和自己下棋获取经验，那么，它的任务 T 是“参与围棋对弈”，它的性能 P 是用“赢得比赛的百分比”来度量的。类似地，学生的任务
    T 是“上课看书、写、作业”，学生的经验 E 就是它不同的读书和刷题，其性能 P 用“考试成绩”来衡量。


    因此，Mitchell 认为，对于一个学习问题，我们需要明确三个特征：任务的类型、衡量任务性能提升的标准及获取经验的来源。


    事实上，看待问题的角度不同，机器学习的定义也略有不同。例如，支持向量机（SVM）的主要提出者 Vapnik，在其著作《统计学习理论的本质》中就提出[10]，“机器学习就是一个基于经验数据的函数估计问题”。'
