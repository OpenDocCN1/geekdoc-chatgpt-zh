- pgno: 149
  md: '# 5.1 为何需要优化函数


    所谓“损失函数”，就是一个剖面实际输出值和期望输出值之间落差的函数。


    神经网络的本质就是用很多数据拟合出“损失”最小的函数。找到如何让目标函数（损失函数）达到最小值的参数，是重中之重。那么，怎样高效地找到这些参数呢？这就是优化函数要解决的问题，也是本章我们要讨论的问题。


    # 5.1.1 优化的意义


    宋朝有部典籍叫《嘉泰普灯录》，里面有这么一句：“于汝诸人分上着一点不得。何故。如人上山，各自努力。”意思是说，即使大家用不同的方法，但只要目标一致，就可以一齐登上高峰。


    而工程师对这句话有不一样的解读。假设山顶就是我们目标函数的极值，那么爬上山顶（找到这个目标解）的方法，肯定不止一种。“各自努力”的确能爬上山顶，可是有的方法需要几个小时，而有的方法需要几天，甚至几个月，我们应该如何选择？


    数学家们比较纯粹，他们更喜欢证明某个问题解的存在性。但工程师们则比较务实，他们喜欢探寻问题解的可行性。即如何在可容忍的时间范围内，快速找到一个问题的最优解，或者最优解的近似值，这就是一个优化问题。


    对于“深度学习”而言，其实可将其拆分为两部分来理解。“深度”说的是网络的拓扑结构，“学习”强调的是性能的提升。如果说让损失函数越来越小是深度学习的性能指标。那么让损失函数趋向极小值的同时，令这个过程越短越好，就是优化算法的目标。


    # 5.1.2 优化函数的流程


    以识别手写数字的神经网络为例，训练数据都是一些“0, 1, 2, …, 9”等的数字图像，由于人们手写数字的风格不同，并且图像的残缺程度不同，因此输出的结果（数字的判定）有时并不是十全十美的，于是我们就用损失函数来衡量二者的误差。识别手写数字的神经网络如图
    5-1 所示。


    在监督学习下，对于一个特定样本，它的特征记为 x（若是多个特征，则 x 表示输入特征向量）以及预期目标 t（这里 t 是 target 的缩写）。根据模型
    f(x) 的实际输出 o（这里 o 是 output 的缩写），二者之间的误差 e'
