    如果单从数据特征上来看，那么我们可以把每个卷积核（即过滤核）都当成一种特征提取方式。基于局部连接和权值共享的特性，卷积层的参数只有一个 \( K \) 维的权值
    \( w \) 和一维的偏置 \( b \)，共 \( (K+1) \) 个参数。权值参数的数量与神经元的数量无关，只与卷积核的大小有关[1]。


    需要说明的是，图 7-13 中的各种卷积核都是来自计算机工程师或领域专家的经验，通常具有可解释性。而深度学习中的卷积核则不同，它是网络参数的一部分，是通过数据拟合自己学习出来的。权值共享保证了在学习过程中，一个卷积核只需要学习一套参数集合即可。


    # 7.6 激活层


    激活层并不是卷积神经网络中专有的层，它与普通的前馈神经网络一样，仅仅是为了提高神经网络的表征能力而添加的一种非线性变换。


    我们知道，从宏观来讲，在本质上，人工神经网络分为两个层次：显层和隐层（隐含层）。显层就是我们能感知到的输入层和输出层，而隐含层则是除输入层和输出层外的无法被我们感知的层，可以将其理解为数据的内在表达[11]。


    在前面的章节中，我们已经提到，如果隐含层具有足够多的神经元，那么神经网络能够以任意精度逼近任意复杂度的连续函数，这就是大名鼎鼎的通用近似定理（Universal
    Approximation Theorem）。


    事实上，神经元与神经元的连接都是基于权值的线性组合。而线性的组合依然是线性的，这样网络的表达能力就非常有限了。换句话说，如果全连接层没有非线性部分，那么在模型上叠加再多的网络层，意义'
  merge: -1
