    # 6.4.13 训练模型的保存与读取


    随着训练数据集合的不断扩大，我们会发现，训练一个深度学习模型，非常耗时，短则可能需要几个小时，长则可能需要几天，甚至花费几周也不足为奇。这些训练的模型（包括网络的拓扑结构，优化参数配置和网络的权值）存储在内存中，一旦关闭运行环境，如果不加以妥善处理，那么这些模型参数会随着运行环境的关闭而“烟消云散”。如果是这样，那么这个训练成本实在是太高了，因此需要一种方法，将训练好的模型保存起来，在有必要时，重新加载并使用它们。那么该如何解决这个问题呢？


    Keras 模块可以很好地解决这个问题，该模块能将训练好的权值参数存储为 HDF5 格式的本地文件。HDF（Hierarchical Data Format，层级数据格式）是一种为存储和处理大容量科学数据设计的文件格式及相应库文件。HDF
    最早由美国国家超级计算应用中心（NCSA）开发，目前在非营利组织 HDF 小组维护下继续发展。顾名思义，HDF5 是 HDF 的第 5 个版本（通常简称 H5）。H5
    具有极高的压缩率，特别适合进行大量科学数据的存储和操作。


    保存神经网络的拓扑结构同样也非常重要。Keras 模块可以将这些结构存储为 JSON 格式的文件。JSON（JavaScript Object Notation，JavaScript
    对象表示法）是一种轻量级的数据交换格式，类似于 Python 中的字典数据类型，可用来存储和传输由属性值或者序列值组成的数据对象。


    Python 中有一系列的工具可以操作和使用 HDF5 数据，其中最常用的是第三方包 h5py。使用 h5py 前，需要先安装它。我们可以在命令行中使用 conda
    或者 pip3 直接安装 h5py。


    ```

    conda install h5py

    ```


    或者使用如下命令。


    ```

    pip3 install h5py

    ```


    接下来的任务是保存范例 6-6 训练的模型，我们将网络的拓扑结构用 JSON 格式保存，然后将模型权值参数保存为 H5 格式。具体代码参考范例 6-7。'
