    这 4 类文件分别是训练集图像文件（train-images-idx3-ubyte.gz）、训练集标签文件（train-labels-idx1-ubyte.gz）、测试集图像文件（t10k-images-idx3-ubyte.gz）和测试集标签文件（t10k-labels-idx1-ubyte.gz）。


    在非工业应用场景下，人们常常“偷懒”，仅设置训练集和测试集。


    具体到神经网络学习而言，训练集的目的就是拟合出模型参数，如求各个神经元彼此连接的 W（权值）和 b（偏置）。测试集的功能是测试模型的最终效果。但在实际训练中，还可能用到验证集（Validation
    Set）。若不设置验证集合，则测试集除测试模型性能外，还能作为“指挥棒”，对模型参数起到导向作用，久而久之，测试集就“蜕变”为训练集。这样一来，原本一分为二的集合（训练集和测试集），就融为一体（都变成了训练集）。在这样的情况下，即使得到很好的性能表现，也很可能是“过拟合”。


    为了避免过拟合，通常设置一个验证集，可以多次使用它，不断调参，以便找到最佳的超参数。当模型在训练集上的精确度不断提高，但在验证集上的精确度并没有同步提高甚至下降时，就要及早停止训练，俗称早停（Early
    Stopping）。这意味着，此时发生了过拟合现象。


    一旦设置了验证集，那么测试集存在的目的就变得“纯粹”很多。作为从不参与训练的“新”集合，它仅仅使用一次，就是为了衡量算法的泛化能力（Generalization
    Ability）。


    泛化能力是指机器学习算法对新样本的适应能力。机器学习（自然包括深度学习）算法只有在新样本集中也表现出很强的预测能力，才可以说它具有很好的泛化能力。这是因为，算法的终极价值体现在对新样本的预测上。'
