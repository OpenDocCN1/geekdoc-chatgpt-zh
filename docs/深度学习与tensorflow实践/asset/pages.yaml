    # 8.12.3 数据预处理


    有时，为了便于处理，我们会人为地对参差不齐的文本设置一个阈值，对于大于此长度的句子，选择截断部分单词，即可以选择截去句首单词，也可截去句末单词；对于小于此长度的句子，可选择在句首或句尾填充，这种常用的文本处理功能，Keras
    早已替我们考虑到了。我们只需调用函数 keras.preprocessing.sequence.pad_sequences()，即可实现将多个序列截断的功能或将序列补齐为相同长度的功能，代码如下所示。


    ```

    In [10]:

    05 from tensorflow import keras #导入Keras 模块

    06 max_review_len = 80

    07 x_train = keras.preprocessing.sequence.pad_sequences (x_train, maxlen =

    max_review_len)

    08 x_test = keras.preprocessing.sequence.pad_sequences (x_test, maxlen = max_

    review_len)

    ```


    该函数的原型如下所示。


    ```

    pad_sequences(sequences, maxlen=None, dtype=''int32'',

    padding= ''pre'', truncating= ''pre'', value=0.0)

    ```


    将一个 num_samples 的序列（整数列表）转化为一个二维 Numpy 矩阵，其尺寸为（num_samples，num_timesteps）。num_timesteps
    要么是给定的 maxlen 参数，要么是最长序列的长度（相当于 RNN 展开的时间步）。'
