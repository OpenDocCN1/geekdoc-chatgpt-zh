    统计机器学习就是从数据出发，提取数据的特征（由谁来提取，是一个大是大非的问题，下面将进行介绍），抽象出数据的模型，发现数据中的知识，最后再回到数据的分析与预测中去。


    经典机器学习通常使用人类的先验知识，把原始数据预处理成各种特征（Feature），然后对特征进行分类。然而，这种分类的效果很大程度上取决于特征选取的好坏。传统的机器学习专家把大部分时间都花在如何寻找更加合适的特征上。因此，早期的机器学习专家非常辛苦。传统的机器学习，其实可以有一个更合适的称呼——特征工程（Feature
    Engineering）。


    当然，这种“辛苦”，也是有价值的。这是因为，特征是由人找出来的，自然也就能够为人所理解。性能的好坏，机器学习专家可以“冷暖自知”。于是，参数调整得以灵活，可解释性也得到保障。


    # 1.3 深度学习的内涵


    # 1.3.1 什么是深度学习


    表示学习：模型自动学习数据的隐式特征，数据表示和任务高度耦合，多为联合训练，它不依赖于专家经验，但需要大量训练数据。


    后来，机器学习专家发现，可以让神经网络自己学习如何抓取数据的特征，这种学习方式的效果似乎更佳。于是，兴起了特征的表示学习（Representation Learning）的风潮。这种学习方式对数据的拟合也更加灵活好用。于是，人们终于从自寻特征的痛苦中稍稍解脱出来。


    “凡事都有两面性”，这种解脱也是要付出代价的。那就是深度学习算法自己习得的特征仅存在于机器空间，完全超越了人类理解的范畴，对人而言，这就是一个黑盒世界。


    为了让神经网络的学习性能表现得更好，人们只能依据经验不断尝试性地进行大量重复的网络参数调整，这同样苦不堪言。于是，对“人工智能”就有这样的调侃：“有多少人工，就有多少智能”。


    再后来，网络进一步加深，出现了多层次的“表示学习”，它把学习的性能提升到另一个高度。这种学习的层次多了，其实也就是套路深了。于是，人们就给它取了一个特别的名称——深度学习（Deep
    Learning，DL）。


    简单来说，深度学习就是一种包含多个隐含层（越多即为越深）的多层感知机。它通过组合低层特征，形成更为抽象的高层表示，用以描述被识别对象的高级属性类别或特征。能自动生成数据的中间表示（虽'
