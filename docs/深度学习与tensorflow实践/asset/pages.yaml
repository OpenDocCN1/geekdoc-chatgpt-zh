    BP 算法在浅层网络调参中用途很广，且是很多改进版算法的基础。下面我们利用 BP 算法“牛刀小试”，解决马文·明斯基诟病的异或问题。


    # 5.3.5 实战：利用 BP 算法解决异或问题


    在前面的章节中，我们提到可以用多层前馈网络来解决异或问题，但并没有动手实践。下面我们就利用前面学习的 BP 算法，结合 TensorFlow 的自动求导和更新工具，完成异或问题的解决。


    # 范例 5-6 利用 BP 算法解决异或问题（bp-xor.py）


    ```

    01    import tensorflow as tf

    02    #构建模型

    03    W1 = tf.Variable(tf.random.uniform([2,20],-1,1))

    04    B1 = tf.Variable(tf.random.uniform([ 20],-1,1))

    05    W2 = tf.Variable(tf.random.uniform([20,1],-1,1))

    06    B2 = tf.Variable(tf.random.uniform([ 1],-1,1))

    07

    08    @tf.function

    09    def predict(X):

    10        X = tf.convert_to_tensor(X, tf.float32)

    11        H1 = tf.nn.leaky_relu(tf.matmul(X,W1) + B1)

    12        pre = tf.sigmoid(tf.matmul(H1,W2) + B2)

    13        return pre

    14

    15    def fit(X, y):

    16        Optim = tf.keras.optimizers.SGD(1e-1)

    17        num_iter = 10000

    18        y_true = tf.convert_to_tensor(y, tf.float32)

    19

    20        for step in range(num_iter):

    21            if step%(num_iter/10)==0:

    22                y_pre = predict(X)

    23                loss = tf.reduce_mean(tf.square(y_true - y_pre))

    24                print(step, " Loss:", loss.numpy())

    ```'
