  md: '鉴于 Minsky 的“贡献”，他被“戏称”为给白雪公主（人工智能）吃了毒苹果的巫婆。


    ![](img/aa01495b859013c80481c58ec0894987_17_0.png)


    ![](img/aa01495b859013c80481c58ec0894987_17_1.png)


    图 1-1 Minsky（左）与其著作《感知机》（右）


    感知机的失败，导致了人工神经网络研究的日渐势微，但这仅仅是信息科学和神经网络科学结合的挫折，并没有影响生物神经网络的持续崛起。1958 年，著名神经生物学家
    Hubel 与 Wiesel 研究发现，动物大脑皮层对视觉信息的处理是分级、分层进行的。正是这个重要的生理学发现，使得二人获得了 1981 年的诺贝尔医学奖。


    这个重要科学发现的意义并不局限于生理学领域，它也间接促成了 50 年后人工智能的突破性发展。Hubel 与 Wiesel 等人对大脑的“深入认识”启迪了计算机科学家，这为科研人员从“观察大脑”到“重现大脑”搭起了桥梁。


    感知机之所以无法解决非线性可分问题，原因就是作为一个单层神经网络的感知机，结构过于简单。简单的结构，其表征能力自然就不强。如果想提升网络表征能力，那么网络结构势必要向复杂网络层进发。


    亦有文献将“隐含层”称为“隐藏层”或“隐层”。


    事实上，按照这个思路，可以在输入层和输出层之间添加一层神经元，将其称之为隐含层（Hidden Layer），形成多层感知机模型。


    1974 年，哈佛大学博士生 P. Werbos 在其博士论文中首次提出了通过误差的反向传播（Back Propagation，BP）来训练人工神经网络[5]。令人遗憾的是，Werbos
    的研究并没有得到应有的重视。原因也很简单，那时正值神经网络研究的低潮期，这篇文章显然不合时宜。


    直到 10 多年后的 1986 年，加拿大多伦多大学教授杰弗里·辛顿（Geoffrey Hinton）等人重新设计了 BP 算法[6]，极大简化了神经网络的训练，终于唤醒了沉睡多年的“人工智能”公主。


    在此后的 20 多年里，BP 算法最成功的应用案例莫过于在美国纽约大学任教的杨立昆（Yann LeCun，又译扬·勒丘恩）于 1998 年提出的卷积神经网络（Convolutional
    Neural Network，CNN）[7]。'
