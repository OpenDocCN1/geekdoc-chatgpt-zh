    # 2.3.2 多层前馈神经网络


    更一般地，常见的多层前馈神经网络结构如图 2-14 所示。在这种结构中，将若干个单层神经网络连接在一起，前一层的输出作为后一层的输入，这样构成了多层前馈神经网络（Multi-layer
    Feedforward Neural Networks）。更确切地说，每一层神经元仅与下一层的神经元全连接，但在同一层之内，神经元之间彼此不连接，而且跨层之间的神经元，彼此也不相连。


    ![](img/aa01495b859013c80481c58ec0894987_47_0.png)


    图 2-14 常见的多层前馈神经网络结构


    之所以加上“前馈”这个定语，是想特别强调，这样的网络是没有反馈的。也就是说，位置靠后的层次不会把输出反向连接到之前的层次上作为输入，输入信号单向向前传播。很明显，相比于纵横交错的人类大脑神经元的连接结构，多层前馈神经网络的结构做了极大简化，但即使如此，它也具备很强的表征能力。


    这种表征能力强大到什么程度呢？奥地利学者库尔特·霍尼克（Kurt Hornik）等人的论文可以解释这个问题[6]。1989 年，霍尼克等人发表的论文证明，对于任意复杂度的连续波莱


    尔可测函数 ( Borel Measurable Function ) f，仅仅需要一个隐含层，只要这个隐含层包括足够多的神经元，前馈神经网络使用挤压函数作为激活函数，就可以以任意精度来近似模拟
    f，即


    ```

    f: R^N \to R^M

    ```


    若想提高 f 的近似精度，可通过单纯地增加神经元的数目实现。换句话说，可将多层前馈神经网络视为一个通用函数的模拟器（Universal Approximators）。对于这个定理证明的可视化描述，读者可参阅迈克'
