  md: '动的范围都集中在隐含层的设计上。在 Elman 循环神经网络中，隐含层的设计比较简单。其基本原理就是将当前输入与反馈回来的记忆数据进行线性组合，然后利用非线性激活函数进行处理。


    为了调整网络中的权值参数，需要构建损失函数。而构建损失函数的前提是，先确定损失函数的形式。损失函数就是衡量预期输出和实际输出的差异度函数。作为教师信号，预期输出可视为常量，因为它们很早就待在那里了。因此，建模的首要任务就是，分别确定隐含层和输出层的输出函数。


    假设隐含层用的激活函数是 Sigmoid（当然也可以用其他激活函数，如 Tanh 等），那么在任意 t 时间步，隐含层的输出 s_t 可表示为


    $s_t = \begin{cases} 0, & t = -1 \\ \text{Sigmoid}(U_t \times x_t + W_t \times
    s_{t-1} + b), & \text{其他} \end{cases}$ (8-2)


    其中， U 和 W 是网络中的两类权值矩阵，隐含层的神经元结构可用简化版的图 8-10 来描述。


    ![](img/aa01495b859013c80481c58ec0894987_279_0.png)


    在图 8-10 中，函数 Sigmoid() 的作用与一扇门电路的作用类似。由于该函数的值域在 [0,1] 之间，若取值为 0 和 1，分别代表关门、开门，中间值则表示门的半掩半闭。在
    Sigmoid() 函数的“压缩”处理下，前输入 x_t 和前一时间步的反馈 s_{t-1}，就构成可控的输出 s_t。将某个激活函数的作用


    比作门电路的做法，在 LSTM 中广泛应用。


    在第 t 时间步的输出层 y_t 可表示为


    $y_t = V_t \times s_t + c$ (8-3)


    式 (8-2) 中的 b 和 (8-3) 中的 c 都是神经元的偏置参数向量。与输入层和隐含层不同的是，输出层的设计更加灵活多变，它并不要求每个时间步都必须有输出。例如，在面向文本分析的情感分类案例中，输入可以是一系列的单词，但输出只是整个句子的情感，它与单词之间并不是一一对应的关系，只需给出整体的判定分类即可。


    > logit 可简单理解为神经网络的直接输出，它可能是一个很大的正值或负值。


    式 (8-3) 中的 y_t 可视为一个 logit，为了便于处理，需要经过 Softmax() 精加工一番，最终 logit 被“修饰”的值域为 [0,
    1] 区间内的概率模样，输出 y_t 为


    $y_t = \text{Softmax}(y_t) = \text{Softmax}(V_t \times s_t + c)$ (8-4)'
