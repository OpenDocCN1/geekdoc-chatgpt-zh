    one-to-many 结构也是容易理解的。它表示输入为定长，输出为变长的结构。在字典模式中，这种结构非常适用。例如，给定一个词 “中国”（固定长度为 2），输出解释为
    “初时本指河南省及其附近地区，后来华夏族、汉族活动范围扩大，黄河中下游一带也被称为中国”（以上解释来自新华字典网络版。输出长度可长可短，取决于解释的详细程度）。又如，音乐的生成也是
