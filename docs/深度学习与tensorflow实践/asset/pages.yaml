    # 5.4 TensorFlow 中的其他优化算法


    在深度学习中，优化器对寻找神经网络最优解非常重要。但由于很多深度学习框架（如 TensorFlow 或 PyTorch 等）已非常专业地实现了这些优化器的功能，对于一般用户而言，没有必要将其再次编码实现一遍，所以下面我们仅讲解一些常见优化器的工作原理和优缺点，以便我们能够有针对性的选择使用这些优化器。'
