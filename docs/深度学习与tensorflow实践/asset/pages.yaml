  md: '# 5.3.4 误差反向传播


    有了前面链式求导知识做铺垫，下面我们开始讲解 BP 算法的反向传播部分。BP 算法的妙处所在就是，利用反向链式求导法则避免了大量计算冗余。然而，这个如此简单且显而易见的方法，却是
    F. Rosenblatt 提出感知机算法（1958 年）近 30 年之后才被应用和普及的。对此，深度学习大家 Yoshua Bengio 是这样评价的：“现在很多看似显而易见的想法，只有在事后才变得如此显而易见。”


    在 BP 算法的反向传播过程中，利用了前面章节讲解过的随机梯度速减法。具体来说，对于样例 \(d\)，若它的预期输出（又称为教师信号）和实际输出之间存在误差
    \(E_d\)，BP 算法利用这个误差信号 \(E_d\) 的梯度修改权值。假设权值 \(w_{ji}\) 的校正幅度为 \(\Delta w_{ji}\)。


    需要说明的是，\(w_{ji}\) 和 \(w_{ij}\) 是同一个权值，表示的都是神经元 \(j\) 与第 \(i\) 个输入神经元之间的连接权值，这里之所以把下标
    “\(j\)” 置于 “\(i\)” 之前，仅仅想表示这是一个反方向更新的过程。


    其实，在前面的讲解中，我们已经给出了 SGD 算法的误差评估函数（也称损失函数）


    ```

    \(E_d(w) = \frac{1}{2}(t_d - o_d)^2\)

    ```


    对于权值 \(w_{ji}\)，针对其损失函数 \(E_d(w_{ji})\)，它的梯度可表示为 \(\frac{\partial E_d}{\partial
    w_{ji}}\)，而对应的梯度递减，即它的反方向可表示为 \(-\frac{\partial E_d}{\partial w_{ji}}\) 但若以此幅度调节
    \(\Delta w_{ji}\)，则可能会因为步长过大而错失极小值。因此，通常会在这个幅度上加一个权值 \(\eta \in (0,1]\) 来调节 \(\Delta
    w_{ji}\) 的幅度，它是一个超参数，即由人为设定，而非学习得到，可将其视为一个常数。综合起来，\(\Delta w_{ji}\) 权值的更新幅度为


    ```

    \(\Delta w_{ji} = -\eta \frac{\partial E_d}{\partial w_{ji}}\)

    ```


    因此，对于 \(w_{ji}\) 的权值更新法则为


    ```

    \(w_{ji} \leftarrow w_{ji} + \Delta w_{ji} = w_{ji} - \eta \frac{\partial E_d}{\partial
    w_{ji}}\)

    ```


    在式（5-18）中，箭头右边的 \(w_{ji}\) 表示旧的权值，而箭头左边的 \(w_{ji}\) 表'
