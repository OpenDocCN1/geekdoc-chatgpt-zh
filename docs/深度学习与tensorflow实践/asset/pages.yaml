    21~22 行）。


    # 4.3 TensorFlow 中的常量与变量


    在 TensorFlow 中，张量分为两大类型：常量和变量。顾名思义，变量指的是在程序运行过程中，存储可以变化的数据。而常量则相反，它是指在程序在运行过程中，值不能改变的量。常量因其不变性，编译器可直接将其编译成目标代码，有利于程序性能的提升。


    套用《道德经》里的一个名句“知其白，守其黑，为天下式”。而针对变量和常量，我们也有“知其变，守其恒，为天下式”。作为程序员，需要有一种自省自觉的意识，即如果某个值在运行过程中不发生变化，那么应主动将其声明为常量，这有利于提高程序的稳定性。


    # 4.3.1 constant 常量


    在 TensorFlow 中，常量型张量可用 tf.constant()方法来生成。关于 tf.constant()的使用，在前面的章节中，已有简要解释。下面我们举例说明它的应用方法。在下面的示例代码中，我们用
    Python 列表充当数据源。


    ```

    In [1]: import tensorflow as tf

    In [2]: import numpy as np

    In [3]: a_list = [1, 2, 3, 4, 5, 6]    #创建一个 Python 列表

    In [4]: tf.constant(a_list)            #用列表创建一个整型常量

    Out[4]:

    <tf.Tensor: id=186, shape=(6,), dtype=int32, numpy=array([1, 2, 3, 4, 5, 6],

    dtype=int32)>

    ```'
