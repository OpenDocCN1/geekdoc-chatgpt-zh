- pgno: 30
  md: '# 2.1 人工神经网络的定义


    在人工智能领域，有个派别名曰“鸟飞派”。说的是，如果我们想要学飞翔，就得向飞鸟学习。实际上，“鸟飞派”就是“仿生派”，即把进化了几百万年的生物作为模仿对象，搞清楚它的原理后，再复现这些对象的输出属性。人工神经网络便是其中的研究成果之一①。


    那么，什么是人工神经网络呢？有关人工神经网络的定义有很多。这里，我们给出芬兰计算机科学家 T. Kohonen 的定义（他以提出“自组织神经网络”而名扬人工智能领域）：
    “人工神经网络是一种由具有自适应性的简单单元构成的广泛并行互联的网络，它的组织结构能够模拟生物神经系统对真实世界所做出的交互反应。”


    在生物神经网络中，人类大脑通过增强或者弱化突触进行学习的方式，最终会形成一个复杂的网络，便于构建特征的分布式表示（Distributed Representation）。


    作为处理数据的一种新模式，人工神经网络的强大之处在于，它拥有很强的学习能力。在得到一个训练集合之后，通过学习，提取到所观察事物的各个部分的特征，通过训练调整网络神经元之间链接的权值，直到顶层的输出得到正确的答案。


    在机器学习中，我们常常提到神经网络，实际上是指神经网络学习。那为什么我们要用神经网络学习呢？作为机器学习的重要支脉，神经网络学习是怎么看待学习的呢？


    > 如果不做特殊说明，“神经网络”特指人工神经网络，全书同。


    生物神经网络（Biological Neural Networks，BNN，见图 2-1）的工作机理，极大启发了工作在人工智能领域的科研人员，在此基础上，他们提出了所谓的人工神经网络。


    ![](img/aa01495b859013c80481c58ec0894987_30_0.png)


    图 2-1 生物神经网络


    我们知道，人工神经网络性能的好坏，高度依赖于神经系统的复杂程度：它通过调整内部大量“简单单元”之间的互联权值，达到处理信息的目的，并具有自学习和自适'
