    # 第 1 章 深度学习导论


    在本章，我们首先讨论人工智能与深度学习之间的联系，然后描述关于人工神经网络的发展简史。最后，我们讨论学习、机器学习和深度学习的内涵，并辅以生活中的例子，解读深度学习的内涵。'
