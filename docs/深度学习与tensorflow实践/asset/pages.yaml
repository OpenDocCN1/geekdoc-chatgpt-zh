  md: '之所以称为隐含层神经元，并不是因为它们不存在，而是因为它们没有预期的输出值，因此信息流过它们时，人们无法度量它们的误差。无法被感知，即为隐含。


    (实心圆) 中，其激活函数依然是阶跃函数（函数 sgn()），它的输出规则非常简单，即当 x>=0 时，f(x) 输出为 1；否则输出 0。


