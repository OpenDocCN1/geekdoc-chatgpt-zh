  md: '# 8.5.3 确定优化目标函数


    模型构建完毕后，接下来的工作就是定义损失函数（目标函数），然后设法求得损失函数的最小值，这就形成了我们所需优化的目标函数 \( J(\theta) \)。为简化计算，通常会使用负对数似然函数（交叉熵）


    ```

    min J(\theta) = \sum_{t=1}^T loss(\hat{y}_t, y_t)

    ```


    其中， \( \hat{y}_t \) 为预期输出向量（即标签）， \( y_t \) 为实际输出向量。参数 \( \theta \) 表示激活函数 \(
    \sigma \) 中的所有参数集合 \( [U, V, W; b, c] \)。


    事实上，式（8-6）是一个广义的损失函数，我们可以根据自己的需要定义具体的形式。例如，它可以是均方误差（Mean Squared Error，MSE），即


    ```

    J = \frac{1}{2} \sum_{t=1}^T \| \hat{y}_t - y_t \|^2

    ```


    为了计算方便，RNN 更一般的损失函数被定义为交叉熵（或对数 Log 损失）函数，即


    ```

    J = -\frac{1}{T} \left( \sum_{t=1}^T y_t \cdot log(\hat{y}_t) \right)

    ```


    # 8.5.4 参数求解与 BPTT


    训练 RNN 的算法称为时间反向传播（Back Propagation Through Time，BPTT）。看到“反向传播”字样，就知道它与传统的反向传播算法有类似之处，它们的核心任务都是利用反向传播调参，从而使损失函数最小化。


    与传统反向传播算法一样，BPTT 算法的核心也是求解参数的导数，然后利用梯度下降等优化方法来指导参数的迭代更新。所不同的是，BPTT 算法中的参数有 5 类，即


    ```

    [ \frac{\partial J(\theta)}{\partial V}, \frac{\partial J(\theta)}{\partial c},
    \frac{\partial J(\theta)}{\partial W}, \frac{\partial J(\theta)}{\partial U},
    \frac{\partial J(\theta)}{\partial b} ]

    ```


    在确定目标函数后，我们就利用随机梯度下降等优化策略来指导网络参数的更新。限于篇幅，本文省略了式（8-9）的偏导数数求解推导过程，感兴趣的读者可以参考相关文献[6]。


    由于 BPTT 的权值更新，依赖于梯度递减，因此也存在梯度弥散等潜在问题的困扰。举例说明，假设 RNN 中采用的激活函数是 Sigmoid()，由于'
  merge: -1
  img_proc: true
- pgno: 282
  md: '它的导数的值域在[0, 1/4]范围内。因此每层反向传播进行一次，梯度都会以前一层 1/4 的速度递减。可以想象，随着传递时间步数的不断增加，梯度会呈指数级递减，直至梯度消失，如图
    8-12 所示。假设当前时刻为 t，那么在(t-3)时刻，梯度将递减至 (1/4)^3 = 1/64，依此类推。


    ![](img/aa01495b859013c80481c58ec0894987_282_0.png)


    图 8-12 BPTT 梯度递减示意图


    一旦存在梯度弥散（或梯度趋近于 0）现象，参数调整就没有了方向感，从而 BPTT 的最优解也就无从获得，RNN 的应用就受到了局限。


    前面我们提到，在理论上，RNN 可在时间轴上任意展开，也就是说，它可以“记住”任意过去的信息，但由于存在梯度弥散，那些“记忆”会随梯度递减而“飘零”。


    能不能让这些“记忆”更加“天长地久”一点呢？显然，一原生态的那种简单神经元已然难以胜任。为了解决梯度弥散等问题，就需要改造神经元的内部构造。这个改造工作就是下节我们要讨论的长短期记忆单元。


    > 梯度弥散是指若梯度较小（小于 1），则多层迭代后，梯度很快就会小到对调参几乎没有影响。想一想，(0.99)^100 是不是趋近于 0？

    > 梯度膨胀是指若梯度较大（大于 1），则多层迭代后，导致梯度非常大。想一想，(1.01)^100 是不是很大？


    # 8.6 LSTM 的来历


    近年来，RNN 在很多自然语言处理项目中取得突破性进展。如果光靠第一代 RNN 的功力，自然是办不到的。如前所述，传统 RNN 多采用 BPTT 算法。这种算法的弊端在于，随着时间的推移，网络层数的增多，会产生梯度消失等问题。


    问题的解决方案就是于尔根·施密德胡伯（Jürgen Schmidhuber）在 1997 年提出的 RNN 的一种变体，即带有所谓的长短期记忆单元（Long
    Short-Term Memory，LSTM）。


    施密德胡伯（以下简称胡伯）又是何许人也？我们常说深度学习有三大巨头：Y. Bengio（约书亚·本吉奥）、Y. LeCun（杨立昆）和 G. Hinton（杰弗里·辛顿），他们三人获得
    2019 年的图灵奖。如果我们把“三大巨'
  merge: -1
  img_proc: true
- pgno: 283
  md: '头”扩展为“四大天王”，那么这位胡伯应可人围。论开创性贡献，他也算得上深度学习的先驱人物之一，其最杰出的贡献，莫过于 1997 年他和 Hochreiter
    合作提出的 LSTM[3]。因此，胡伯也被尊称为“LSTM 之父”。


    由于独特的设计结构，LSTM 可以很好地解决梯度弥散问题，它特别适合处理时序间隔长和延迟非常长（甚至可以超过 1000 个时间步）的任务，且性能恰佳。例如，2009
    年，研究人员用改进版的 LSTM 赢得国际文档分析与识别大赛（ICDAR）与手写识别大赛冠军[7]。2014 年，本吉奥的团队提出了一种更加好用的 LSTM
    变体——GRU（Gated Recurrent Unit，门控环单元）[8]，从而使得 RNN 的应用更加广泛。作为非线性模型，LSTM 非常适合构造大型深度神经网络。


    # 8.7 折解 LSTM


    LSTM 的内部结构比较复杂，下面我们就来剖析一下 LSTM 结构。


    # 8.7.1 改造的神经元


    事实上，学术界 何凯明等人在提出残差网 ResNet 时，也多少利用了 LSTM 的这个可控自循环理念。


    从上面的分析可知，第一代 RNN 的问题主要出在神经元功能不健全上，它把该记住的遗忘了，又把该遗忘的记住了。那如何来改造它呢？这时，就体现胡伯提出的 LSTM
    的优势了。LSTM 的核心本质在于，通过引入巧妙的可控自循环，以产生令梯度能够得以长时间可持续流动的路径。


    图 8-13 是简易 RNN 神经元和复合 LSTM 神经元的对比示意图。在该图中，每个方块均代表一个神经元。我们先不用纠结具体的细节（后面的章节会娓娓道来），仅从宏观就可以感知到，LSTM
    的神经元内部要复杂了很多。


    对于图 8-13(a)，简易 RNN 可以简单认为“一输入，一输出”。对比而言，对于图 8-13(b)，LSTM 的每个输入 \(X_t\) 都需要被处理
    4 次，可简单认为“四输入，一输出”。它带来的效果就是，数据处理更加细腻了，网络性能（如记忆时长）显著提升了，但付出的代价是网络结构至少复杂了 4 倍。


    ![](img/aa01495b859013c80481c58ec0894987_283_0.png)'
