- pgno: 246
  md: '提取目标的某个特征后，我们都要在两个相邻的卷积层之间安排一个池化层。


    池化就是把小区域的特征通过整合得到新特征的过程。例如图 7-21 所示的二维数据为例，如果输入数据的维度大小为 \( W \times H \)，那么给定一个过滤器，其大小为
    \( w \times h \)。池化层考察的是在输入数据中，大小为 \( w \times h \) 的子区域之内，所有元素具有的某种特性。常见的统计特性包括最大值、均值、累加和及
    \( L_2 \) 范数等。池化层力图用统计特性反映出来的一个值来代替原来 \( w \times h \) 的整个子区域。


    ![](img/aa01495b859013c80481c58ec0894987_246_0.png)


    图 7-21 对二维数据进行池化操作


    因此总结来说，池化层设计的目的主要有两个。最直接的目的就是减少下一层待处理的数据量。例如，当卷积层的输出大小是 \( 32 \times 32 \) 时，如果过滤器的大小为
    \( 2 \times 2 \)，那么经过池化层处理后，输出数据的大小为 \( 16 \times 16 \)，也就是说，现有的数据量一下子减少到池化前的
    1/4。当池化层最直接的目的达到后，那么它的第二个目的也就间接达到了，即减少了参数数量，从而可预防神经网络陷入过拟合状态。


    下面我们举例说明常用的最大池化函数和平均池化函数是如何工作的。我们以一维向量 [1, 2, 3, 2] 为例来说明两种不同的池化策略在前向传播和反向传播中的差异。


    # (1) 最大池化（Max Pooling）函数


    前向传播操作：取滤波器最大值作为输出结果，因此有 forward(1, 2, 3, 2) = 3。

    反向传播操作：滤波器的最大值不变，其余元素均置为 0，因此有 backward(3) = [0, 0, 3, 0]。


    # (2) 平均池化（Average Pooling）函数


    前向传播操作：取滤波器范围内所有元素的平均值作为数据结果，因此有 forward(1, 2, 3, 2) = 2。

    后向传播操作：滤波器中所有元素的值都取平均值，因此有 backward(2) = [2, 2, 2, 2]。


    有了上面的解释，我们很容易得出图 7-21 所示的两种不同的池化策略'
