    \ True, False])>\n```\n\n与普通张量一样，布尔类型张量的优势主要体现在批量操作上。例如，我们想计算预测分类算法的准确率，而得到的原始数据是实际输出的张量（vec_actual）和预期值张量（vec_pre），这时我们利用布尔类型张量的批处理操作，即可非常方便地完成预测准确度的计算，如下代码所示。\n\
    \n```\nIn [26]: vec_actual = tf.constant([1,1,2,0,1])\n    #假设为分类实际值\nIn [27]:\
    \ vec_pre = tf.constant([1,0,1,0,1])\n    #假设为算法预测的分类值\nIn [28]: acc_bool = vec_actual\
    \ == vec_pre    #判断是否预测准确\nIn [29]: acc_bool    #输出布尔类型张量\nOut[29]: <tf.Tensor:\
    \ id=69, shape=(5,), dtype=bool, numpy=array( [ True, False,\nFalse, True, True])>\n\
    ```\n\n所谓的准确率，是指预测的正确个数和预测的总个数之间的比值。\n在 In [28]处，我们先用两个等号 “==” 做逻辑判断，让两个整数张量做比较，这时遵循的是“元素对元素（Element-Wise）”比较原则，比较的"
