  md: '```

    09 dataset = dataset.batch(32).repeat(10)

    10 # 获取图片的大小

    11 in_shape = X_train.shape[1:]     # 形状为(28,28)

    12 # 获取数字图片的种类

    13 n_classes = len(np.unique(y_train)) #类别数为10

    14 model = Sequential()    #搭建空顺序模型

    15 model.add( layers.Flatten(input_shape = in_shape))

    16 model.add( layers.Dense(n_classes, activation = ''softmax''))

    17 #设置优化器，学习率为 0.01

    18 optimizer = optimizers.SGD(lr = 0.01)

    19 #设置算法性能的评估标准:分类精确度

    20 acc_meter = metrics.Accuracy()

    21

    22 for step, (x,y) in enumerate(dataset):

    23     with tf.GradientTape() as tape:

    24         # 计算模型输出

    25         out = model(x)

    26         # 将标签转换成独热编码

    27         y_onehot = tf.one_hot(y, depth=10)

    28         # 计算损失

    29         loss = tf.square(out - y_onehot)

    30         # 计算损失均值

    31         loss = tf.reduce_sum(loss) / 32

    32

    33     acc_meter.update_state(tf.argmax(out, axis=1), y)

    34     grads = tape.gradient(loss, model.trainable_variables)

    35     optimizer.apply_gradients(zip(grads, model.trainable_variables))

    36

    37     if step % 200 == 0:

    38         print(''step {0}, loss:{1:.3f}, acc:{2:.2f} %''.format(step,

    39             float(loss), acc_meter.result().numpy() * 100))

    40     acc_meter.reset_states()

    ```


