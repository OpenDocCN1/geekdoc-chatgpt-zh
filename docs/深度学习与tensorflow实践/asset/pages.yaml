    # 4.2.3 字符串类型


    TensorFlow 除提供类型丰富的数值型张量外，还支持字符串（str）类型的张量。Python 已经提供了字符串类型，为什么 TensorFlow 还坚持“独创”这么一个数据类型呢？这是因为
    TensorFlow 对字符串的操作有着特殊的用途。


    例如，在进行海量图片数据处理时，就需要定位图片在何处，从而需要记录数量巨大的、以字符串表征的文件所在路径。此时，为了加快图片读取速度，可能需要对这些路径字符串进行批量预处理，而普通的
    Python 字符串类型对这样的需求可能就无能为力。下面我们举例说明。


    在 TensorFlow 中，创建字符串类型张量并不复杂，通过传入字符串对象即可。


    ```

    In [15]: a_str = tf.constant(''Hello, TensorFlow!'')

    In [16]: a_str

    Out[16]: <tf.Tensor: id=0, shape=(), dtype=string, numpy= b''Hello, TensorFlow!''>

    ```


    从上面的输出也可以看出，字符串张量的数据部分为 “bHello, TensorFlow!”，其前有个修饰字符 “b”，如前所述，它并不是字符串的一部分，而是字符串标识符，特别表明这个字符串对象是一个字符数组（Byte
    Array）。


