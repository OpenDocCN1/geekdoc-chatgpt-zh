- pgno: 231
  md: '从数学概念上讲，所谓卷积是指一个函数和另一个函数在某个维度上的“叠加累计”作用。这里的“叠加”就是一种“卷积”，记作“*”。这里的“累计”，对于连续函数而言，表示“积分”，对于离散信号而言，表示“求和”。


    为了更好地理解卷积操作的数学意义，下面我们再列举一个具体的案例来说明[7]。假设我们的任务是实时追踪高速公路上跑车的位置，车载位置传感器在任意时刻 t 都实时记录信号
    f(t)，这里 f(t)表示跑车在任意时刻 t 所处的位置。


    这里的“均值化”处理，也称为平滑处理


    但在实际情况中，处理并没有那么简单。因为会存在各式各样的噪音干扰，导致传感器信息传递的滞后。因此为了更加准确地获取跑车位置的实时数据，采用的方法是对测量结果
    f(t)进行均值化处理。


    很显然，对于运动中的目标，时间越长的位置则越不可靠（分配较小的权值），而时间越短的位置，则对真实值的相关性越高（分配较大的权值）。因此可以对不同的时间段赋予不同的权值，即通过一个权值定义来计算。


    因此，加权平均后的跑车位置 s(t)为


    ```

    s(t) = \int_{-\infty}^{\infty} f(a) * w(t-a)da \quad (7-1)

    ```


    其中，函数 f(·)和函数 w(·)是卷积对象，a 为积分变量，“*”表示卷积。式（7-1）的操作被称为连续域上的卷积操作。这种操作通常被简记为


    通俗来说，卷积核就是那些抓住主要特征的小模板。对于图像处理而言，卷积核就是把图片上下左右横扫一遍，以期发现重要特征，即特征图谱。


    ```

    s(t) = (f * w)(t) \quad (7-2)

    ```


    在式（7-2）中，通常把函数 f(·)称为输入函数（表示输入数据），函数 w(·)称为滤波器或卷积核（Kernel），这两个函数的叠加结果即为输出 s，称为特征映射或特征图谱（Feature
    Map）。


    在理论上，输入函数可以是连续的，因此通过积分可以得到一个连续的卷积。但实际上，在数字计算机处理场景下，卷积操作是不能处理连续（模拟）信号的，因此需要将连续函数离散化。


    事实上，一般情况下，我们并不需要记录任意时刻的数据，而是以一定的时间间隔（也即频率）进行采样即可。对于离散信号，卷积操作可用式（7-3）表示。


    ```

    s(t) = f(t) * w(t) = \sum_{a=-\infty}^{\infty} f(a)w(t-a) \quad (7-3)

    ```'
