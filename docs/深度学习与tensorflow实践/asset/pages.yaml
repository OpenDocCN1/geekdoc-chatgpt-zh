    需要说明的是，对人工智能做任何形式的划分，都可能是有缺陷的。在图 1-6 中，人工智能的各类技术分支，彼此泾渭分明。但实际上，它们之间却可能阡陌纵横。例如，深度学习可以是无监督的，语音识别也可以用深度学习来完成。再如，图像识别、机器视觉更是当前深度学习经典的用武之地。


    一言以蔽之，人工智能并不是一棵有序的树，而是一团彼此缠绕的灌木丛。有时候，一个分藤蔓比另一个分藤蔓生长得快，并处于显要地位，那么它就是当时的研究热点。但有时候，事与愿违，被打入“冷宫”二十载，欲说还休。深度学习的前身——神经网络的发展，就经历了这样的几起几落。今天，我们见证了深度学习的如日中天，但它会不会也有“虎落平阳”的一天呢？从事物的发展规律来看，这一天肯定会到来！'
