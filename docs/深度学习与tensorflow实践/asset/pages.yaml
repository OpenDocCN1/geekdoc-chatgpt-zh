    构造函数___init__() 初始化模型所需的层

    网络层1 网络层2 网络层3


    模型调用方法call() 描述数据流动的逻辑拓扑结构，即数据如何通过网络层而得到输出

    输入1 网络层1 网络层3 输出

    输入2 网络层2


