    Python 的装饰器 “@tf.function” 来 “装饰” 一个 Python 函数，那么这个函数就会被标记为 JIT 编译，TensorFlow
    将其作为单个图形运行（ Functions 2.0 RFC），这就间接实现了一个新功能——AutoGraph。


