    # 2.6.1 sklearn 简介


    sklearn 是一款开源的 Python 机器学习库，它基于 Numpy 和 Scipy，提供了大量用于数据挖掘和分析的工具，包括数据预处理、交叉验证、算法与可视化算法等一系列接口，并涵盖了几乎所有经典机器学习算法（包括多层感知机算法，但相对保守的
    sklearn 并不包括新兴起的深度学习算法）。


    作为一款成熟的机器学习框架，sklearn 提供很多实用的 API（Application Programming Interface，应用程序接口）。通过
    sklearn，有时我们仅使用寥寥数行代码，就可以很好地完成机器学习任务的流程。sklearn 不仅功能强大，更为可贵的是，其官方文档还很齐全，它针对每种算法都提供了简明扼要的参考用例。


