  md: '域（Receptive Field），也就是说，听觉、视觉神经元具备局部感知且具有方向选择性，它只接收其所支配的刺激区域内的信号。


    《大学》中有一句名言：“心不在焉，视而不见”。这可不仅仅是一个态度问题，它还有很强的生物学解释：当你的大脑细胞在“忙别的事情（心不在焉）”时，即使有外物闯入你的“可视域”，但倘若相关的可视化细胞“无暇”被唤醒，那么这个外物就很难被大脑感知到。


    这个生物学的机制给前面章节提到的全连接前馈神经网络泼了一盆冷水——全连接在很多时候可能是毫无必要的。


    # 2. 动物大脑皮层是分级、分层处理信息的


    ![](img/aa01495b859013c80481c58ec0894987_227_0.png)


    除局部感知外，休伯尔等人还发现，在大脑的初级视觉皮层（见图 7-3）中存在几种细胞：简单细胞（Simple Cell）、复杂细胞（Complex Cell）和超复杂细胞（Hyper-Complex
    Cell）。例如，在视觉神经系统中，视觉皮层中神经细胞的输出依赖于视网膜上的光感受器。视网膜上的光感受器受刺激兴奋时，将神经冲动信号传递到视觉皮层细胞。这些不同皮层的细胞承担着不同抽象层次的视觉感知功能。


    这种由简单到复杂、由低级到高级的逐级抽象的过程，在我们生活中也有鲜活的例子。例如，我们学习一门外语（以英语为例），通过字母的组合可以得到单词；通过单词的组合，可以得到句子；然后我们通过对句子的分析，了解语义；最后，通过语义分析，可以获得句子表达的思想。


    Hubel 等人的研究成果意义重大，它对人工智能的启发意义体现在对于人工神经网络的设计上，第一，不必考虑使用神经元的全连接模式；第二，神经网络拟合的复杂函数可分级、分层来完成。如此一来，可以大大降低神经网络的复杂性。


