    \ 参数中，通常并不包含数据的批量大小。\n\n我们只需要在第一层（输入层）设置 input_shape 参数，根据展平层的功能，将一个 28×28 的二维张量，展平为一个\
    \ 784 的一维张量，随后神经网络层（Dense 层）可以自动推断前一层的输出尺寸（如 784），作为当前层的输入张量。\n\n全连接层（Dense 层）可能是我们编写模型时使用最频繁的层了，所以有必要多花些笔墨来描述它。全连接表示上一层的每一个神经元都与下一层的每一个神经元相互连接，连接程度非常稠密（Dense），这就是\
    \ Dense 层的命名来源。\n\nDense 首字母 “D” 大写，根据 TensorFlow 的命名规则，我们知道，它是一个 Python 类。tf.keras.layers.Dense\
    \ 的构造函数如下。\n\n```\n__init__(\n    units,\n    activation=None,\n    use_bias=True,\n\
    \    kernel_initializer='glorot_uniform',\n    bias_initializer='zeros',\n   \
    \ kernel_regularizer=None,\n    bias_regularizer=None,\n    activity_regularizer=None,\n\
    \    kernel_constraint=None,\n    bias_constraint=None,\n    **kwargs\n)\n# 当前层的神经元个数\n\
    # 该层使用的激活函数\n# 是否添加偏置项\n# 权值初始化方法\n# 偏置值初始化方法\n# 权值规范化函数\n# 偏置值规范化方法\n# 输出的规范化方法\n\
    # 权值变化限制函数\n# 偏置值变化限制函数\n```\n\n从上面所述 Dense 类的构造方法可以看出，除第一个参数 units 可以指定外，其他参数都有默认值，从而可以看出\
