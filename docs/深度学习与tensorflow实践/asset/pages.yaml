  md: '名源于其运行原理，“Tensor”的本意是“张量”®，“张量”通常表示多维数组。在深度学习项目中，数据大多都高于二维，所以利用深度学习处理的数据核心特征来命名是有意义的。“Flow”的本意就是“流动”，它意味着基于数据流图的计算。


    ![](img/aa01495b859013c80481c58ec0894987_75_0.png)


    合在一起，“TensorFlow”的意思是，张量从数据流图的一端流动到另一端的计算过程。而数据的流动其实就是计算的过程，这正是 TensorFlow 描述的本质所在，它生动形象地描述了复杂数据结构在人工神经网络中的流动、传输、分析和处理过程（见图
    3-2）。笼统来讲，在这个图中，节点代表操作（Operation，Op），如其中的加法、乘法及激活函数操作，图中的“边”表示张量（即数据）流过系统。在后续的章节中，我们会详细讨论这些概念。


    图 3-2 TensorFlow 中的数据流图


    # 3.2 TensorFlow 特征


    从上面的介绍可以看出，TensorFlow 是一款用于数值计算的深度学习框架，它提供封装好的应用程序接口（Application Programming Interface，API），有了这些
    API 的“保驾护航”，使用户的开发效率大大提高。当然，这些机器学习算法也包括目前主流的深度学习算法。


    作为一款优秀的深度学习框架，TensorFlow 在诸多方面都有着卓越的表现。例如，设计神经网络结构的代码非常简捷，部署也比较便利。特别是有技术实力雄厚的
    Google 做技术支撑，拥护者众多，也在很大程度上保证了其社区的活跃度，从而也导致 TensorFlow 在技术演化之路上更新迭代非常快，基本上每周都有上万行代码的提交。


    ① 在机器学习中，数值通常由以下 4 种类型构成。（1）标量（Scalar）：一个数值，它是计算的最小单元，如 “1” 或 “3.2” 等。（2）向量（Vector）：由一些标量构成的一维数组，如[1,
    3.2, 4.6]等。（3）矩阵（Matrix）：由标量构成的二维数组。（4）张量（Tensor）：由多维（通常 n >= 3）数组构成的数据集合，可理解为高维矩阵。'
