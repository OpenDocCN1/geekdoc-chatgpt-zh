    # ## 5.3.3 求导中的链式法则


    在信息正向传播的示例中，为了方便读者理解，对于所有的权值，我们都临时给予了确定的值，而实际上，这些值都是可以调整的，也就是说，它们都是变量。其实，神经网络学习的目的就是通过特定算法来调整这些权值，以最小化损失来拟合训练数据。而学习的结果就是得到最佳的权值。


    ![](img/aa01495b859013c80481c58ec0894987_171_0.png)


    图 5-17 路径有向图


    BP 算法之所以经典，部分原因在于，它是求解这类“层层累进”式函数偏导数的利器。举例说明，如图 5-17 所示的有向图，若 \( X \) 到 \( Y \)
    有三条路径（\( X \) 分别以 \( \alpha \)、\( \beta \) 和 \( \chi \) 的比率影响 \( Y \)），\( Y \)
    到 \( Z \) 也有三条路径（\( Y \) 分别以 \( \delta \)、\( \varepsilon \) 和 \( \xi \) 的比率影响
    \( Z \)），则很容易根据路径加和原则得到 \( X \) 对


    \( Z \) 的偏导数为


    ```

    \(\frac{\partial Z}{\partial X} = (\alpha\delta + \alpha\varepsilon + \alpha\xi)
    + (\beta\delta + \beta\varepsilon + \beta\xi) + (\chi\delta + \chi\varepsilon
    + \chi\xi) \quad (5-14)\)

    ```


    ![](img/aa01495b859013c80481c58ec0894987_171_1.png)


    前文用到的求偏导数方法称为前向模式微分（Forward-mode Differentiation），如图 5-18(a)所示。好在这个网络比较简单，即使 \(
    X \) 到 \( Z \) 的每条路径都被遍历一次，总共才有 \( 3 \times 3 = 9 \) 条路径，然而一旦网络的规模增大，那么这种前向模式微分就会令求导计算的次数与神经元个数的平方成正比。这个
    \( n^2 \)（\( n \) 为神经元个数）计算量就可能成为机器“难以承受的计算之重”。


    为了避免这种海量求导模式，数学家们另辟蹊径，提出了反向模式微分（Reverse-mode Differentiation）。我们用式（5-15）求 \( X
    \) 对 \( Z \) 的偏导数为


    图 5-18 前向模式微分与反向模式微分对比'
