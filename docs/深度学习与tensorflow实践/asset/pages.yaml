    ```

    拟合得到的模型近似为： y ≈ 10.073746681213379x + 4.170716762542725

    price = 13.24

    ```


    # 代码分析


    从第 09 ~ 10 行代码生成训练数据的过程可以看出，自变量 x 和因变量 y 之间的关系是 y = 10 x + 5。但机器事先并不知道这两个关键系数的值，此处
    $w_1 = 10$ 和 $w_0 = 5$，是通过一步步试探式的“学习”得到的。通过学习而非事先设置，这就是机器学习的本质。那它学习的“养料”是什么呢？就是第
    09 ~ 10 行所生成的数据。


    有了学习的资源（即数据），还需要学习的方法论。这里的方法就是本书讲到的梯度速减，它利用随机梯度速减法来逼近令目标函数（损失函数）达到最小值的参数。


    第 05 ~ 06 行定义了损失函数，为了简化起见，这里我们仅用预期值与目标值之间误差的绝对值，作为损失函数值（自然这里还有优化空间）。


    第 17 ~ 21 行利用了 TensorFlow 求解梯度。如前所述，我们无须为目标函数提供其自身导数形式，TensorFlow 的“自动微分”功能自动为我们完成。此时，我们可以直接利用图
    5-5 中的第 3 步所述的参数更新方式，即


    ```

    $$w_i = w_i - \eta \frac{\partial E}{\partial w_i}$$ (5-12)

    ```


    式（5-12）实际上就是式（5-7）和式（5-8）的合并。现在 TensorFlow 完成了核心的部分 $\frac{\partial E}{\partial
    w_i}$ 的求解（参见代码第 17 ~ 21 行），那么权值的核心就“水到渠成”了。从代码操作的层面来看，不过是做了个自减赋值而已（参见代码第 25 ~
    26 行），这里用到了 Variable 对象的方法 assign_sub()，这是一个自减赋值方法，其内的主要参数 delta，就是每次权值的更新量。例如，w1.assign_sub(w1_gradients
    * learning_rate) 等价的数学表达式是 w1 = w1 - w1_gradients × learning_rate，可以看出，该式是式（5-12）的代码化表达。


    实际上，基于梯度递减的算法是非常“笨”的，最优参数是它一点点“试探”出来的。因此，若迭代次数少了，则很难找到最佳参数 $w_0$ 和 $w_1$，通常需要迭代多次才能达到此目的。


    程序中的迭代次数和学习率，其实也算是神经网络学习中的参数，但它们不是学习得来的，而是来自人为经验，因此模型性能的好坏，有一定的运气成分，因此这种人为设定的参数也被称为超参数。


    从结果可以看出，通过 10 000 次的迭代，拟合出来的 $w_1$ 接近最优'
