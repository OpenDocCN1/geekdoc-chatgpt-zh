  md: '如前所述，激活函数存在的目的在于，做非线性变化，进而提升整个网络的表达能力。如果我们不设置第二个参数 activation（激活函数），那么默认值的
    None 表示应用线性变化，即 f(x) = x，也就是输入什么样的值，就“原封不动”地输出什么样的值。在本范例中，我们设置激活函数为 Softmax，在前文中我们已经介绍过这个函数背后的含义。


    顺序模型是创建神经网络拓扑结构最常见的方式。创建顺序模型有两种常用的方式。


    第一种方式是范例 6-3 中第 15 ~ 18 行的“整体搭建”。在 Sequential 类的构造参数中，利用一个列表将不同网络层分别放入其中即可。


    顺序模型还有一种搭建神经网络的方式，即逐层积木式搭建。这种方式先搭建一个空的序列式模型（好比是打地基），然后通过 add()方法逐个将不同的网络层，像搭建楼房一样，一层一层地搭建起来。例如，范例
    6-3 中的第 15 ~ 18 行，完全可以改写为


    ```

    15 model = keras.Sequential()

    16 model.add( keras.layers.Flatten(input_shape=in_shape) )

    17 model.add( keras.layers.Dense(n_classes, activation= ''softmax'') )

    ```


    【范例 6-3】这样搭建的神经网络还不能使用，它好比是个“毛坯房”，非常粗糙，还不能入住。如果要让模型正常工作，那么还需要定义好损失函数、优化函数和算法的评估性能。这部分的模型“装修”工作，在
    tf.keras 模块中进行，该过程称为模型“编译（Compile）”。在后面的章节我们会逐步讨论这个议题。


    # 6.4.9 利用梯度递减算法构建模型


    如前所述，神经网络搭建完毕后，它还是一个空架子，并不能直接使用。下面我们还需要为这个神经网络定义损失函数和优化器（如梯度递减），进而计算梯度，反向更新权值，具体详情参见范例
    6-4。


    # 范例 6-4 基于梯度递减的手写数字识别（ mnist-sgd.py ）


    ```

    01 import numpy as np

