    ```

    In [18]: b_str = tf.constant(["abcdabcd bc", "abda c"])

    In [19]: tf.strings.split(b_str, sep = ''d'') #根据''d''的位置分割字符串

    out[19]: <tf.RaggedTensor [["b''abc'', b''abc'', b''a bc''], [b''ab'', b''a c'']]]>

    ```


    In [19] 完成的功能是把字符串向量 b_str 中的两个字符串根据字母 d 分隔开。从上面的字符串操作来看，好像 Python 中内置的字符串操作也能做到，并没有什么高明之处。的确是这样，如果处理的是简单字符串，TensorFlow
    似乎并没有什么优势，但如果放眼于字符串类型张量的“批处理”操作，Python 中的字符串操作方法就“黔驴技穷”了。下面举例说明，假设我们有如下的字符串类型张量。


    ```

    In [20]:

    input_strs = [b''ten'', b''eleven'', b''twelve''],

