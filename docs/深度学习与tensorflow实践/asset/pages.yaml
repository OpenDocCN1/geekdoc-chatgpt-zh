- pgno: 151
  md: '于是，对于神经网络学习的任务，在很大程度上就是求取一系列合适的 \( \boldsymbol{w} \) 值，以拟合或者适配给定的训练数据，从而使得实际输出
    \( o_d \) 尽可能快地接近预期输出 \( t_d \) ，使得 \( E(\boldsymbol{w}) \) 取得最小值。这在数学上称为优化问题，而式（5-4）就是我们优化的目标，称为目标函数。


    与其抽象地说，如何训练一个神经网络模型，不如更具体地说，如何设计一个好用的函数（目标函数），用以揭示这些训练样本随自变量的变化关系。如果网络能够在较大程度上正确分类，那么误差（或损失）就会越小，也就说明拟合的效果越好。最后，我们再用损失最小化的模型去预测新数据。


    那么，如何得到这个损失最小化的函数呢？大致分为以下三步“循环走”。


    +   (1) 损失是否足够小？若是，则退出；若不是，计算损失函数的梯度。


    +   (2) 按梯度的反方向走一小步，以减小损失。


    +   (3) 循环到（1）。


    这种按照负梯度的若干倍数（为了避免错过最优解，通常这个倍数远小于 1，该倍数也称为学习率 \( \eta \)）不停地调整函数权值的过程称为梯度下降法。通过这样的方法改变每个神经元与其他神经元的连接权值及自身的偏置，令损失函数的值减小得更快，进而将值收敛到损失函数的某个极小值。


    # ## 5.2 基于梯度的优化算法


    为了快速找到目标函数的最优解，很多研究者提出了各式各样的优化算法，但“万变不离其宗”，它们大多数都是基于梯度操作或基于梯度递减而改良的。所以，在搞清楚“优化”这个相对复杂的问题前，我们先要弄清楚几个基础概念。第一个需要我们搞清楚的概念就是什么是梯度。


    # ### 5.2.1 什么是梯度


    我们知道，在求某个函数的极值时，难免要用到导数等概念。对于某个连续函数 \( y = f(x) \)，令其导数 \( f''(x) = 0 \)（有时也常用
    \( \Delta \) 表示导数），通过求解该微分方程，便可直接获得极值点。


    然而，显而易见的方案，并不见得能轻而易举地获得。一方面，\( f''(x) = 0 \) 的显式解，并不容易求得，当输入变量很多或者函数很复杂时，就更不容易求解微分方程。另一方面，求解微分方程并不是计算机的所'
  merge: -1
  img_proc: true
- pgno: 152
  md: '长。计算机所擅长的是，凭借强大的计算能力，通过插值等方法（如牛顿法、弦截法等）进行海量尝试，最终把函数的极值点“逼（近）”出来。


    为了快速找到这些极值点，人们设计了一种名为 \(\Delta\) 法则（Delta Rule）的启发式方法，该方法能让目标收敛到最佳解的近似值[1]。\(\Delta\)
    法则的核心思想在于，使用梯度递减（Gradient Descent）的方法寻找极小值。然而使用梯度递减策略，同样离不开导数的辅助。


    什么是导数呢？所谓导数，就是自变量 \(x\) 产生一个微小变动 \(\Delta x\) 后，函数输出值的增量 \(\Delta y\) 与自变量增量 \(\Delta
    x\) 的比值在 \(\Delta x\) 趋于 0 时的极限，即


    ```

    f''(x_0) = \lim_{\Delta x \to 0} \frac{\Delta y}{\Delta x} = \lim_{\Delta x \to
    0} \frac{f(x_0 + \Delta x) - f(x_0)}{\Delta x} \quad \text{(5-5)}

    ```


    因此，针对函数中的某个特定点 \(x_0\)，该点的导数就是点 \(x_0\) 的瞬间斜率，即切线斜率。这个斜率越大，表明其上升趋势越强劲。当这个斜率为 0
    时，表明达到了这个函数的极值点。


    在单变量的实值函数中，梯度可简单理解为只是导数，或者说对于一个线性函数而言，梯度就是曲线在某点的斜率。但对于多维变量的函数，梯度概念就不那么容易理解了，它要涉及标量场概念。


    在向量微积分中，标量场的梯度其实是一个向量场。假设一个标量函数 \(f\) 的梯度记为 \(\nabla f\) 或 \(\text{grad } f\)，这里
    \(\nabla\) 表示向量微分算子。那么，在一个三维直角坐标系中，该函数的梯度 \(\nabla f\) 就可以表示为


    ```

    \nabla f = \left( \frac{\partial f}{\partial x}, \frac{\partial f}{\partial y},
    \frac{\partial f}{\partial z} \right) \quad \text{(5-6)}

    ```


    为求得这个梯度值，难免要用到偏导数的概念。说到偏导数，其英文本意是“Partial Derivatives（局部导数）”，文献常将其翻译为偏导数①。那什么是“偏导数”呢？对于多维变量函数而言，当求某个变量的导数时，就是把其他变量视为常量，然后对整个函数求其导数（相比于全部变量，这里只求一个变量，即为“局部”）。


    之后，该过程对每个变量都求一遍导数，将这些导数放在向量场中，就得到了这个函数的梯度。举例来说，对于三元变量函数 \(f = x^2 + 3xy + y^2
    + z^3\)，它的梯度可以按以下方法求得。'
