  md: "在实际训练时，通常一轮训练的算法效果并不好，因此需要对数据集迭代多个“轮次”才能取得较好地训练效果。为什么训练多次效果会好一些呢？我们知道，神经网络的性能与网络参数的初值密切相关，一开始，神经网络的初值通常都是随机设置的，因此性能通常并不好。而多轮训练的第\
    \ n 轮（n>=2）可视为将第(n-1)轮训练的结果作为网络初值，一个通过(n-1)轮数据喂养过的网络，其初值自然会比随机设置的值要可靠很多。当然这个 n\
    \ 也不是越大越好，需要根据具体情况设定。\n\n例如，固定训练 20 个 epoch，实现如下。\n\n```\nfor epoch in range(20):\
