- pgno: 179
  md: '优化算法主要分为两大阵营：梯度递减法和牛顿法。梯度递减法的基础就是前面章节提到的随机梯度递减法、批量梯度递减法和小批量梯度递减法。由于这些基础算法存在性能上的一些挑战，因此有很多学者在此基础上做了进一步的优化，提出诸如动量优化法（Momentum）、AdaGrad、AdaDelta、RMSProp
    和 Adam 等优化算法。另外一个算法阵营基于牛顿法（Newton Menthon）。为了改善牛顿法在数值计算（如病态 Hessian 矩阵）上的不稳定性，通常使用它的近似版本——拟牛顿法（quasi-Newton
    Method）。基于拟牛顿法派生出 DFP、BFGS 和 L-BFGS 等算法，如图 5-20 所示。


    ![](img/aa01495b859013c80481c58ec0894987_179_0.png)


    # 图 5-20 优化算法的派系图


    下面我们简介一下这些算法的思想，具体实现还需要读者自行查询相关文献。首先介绍动量优化法，该方法的思想其实并不复杂，它借鉴了物理学中的动量（或称惯性）思想。基于常识，我们知道，一个小球从山顶


    滚下来，如果它在没有遇到阻力的情况下，基于自身惯性，其下滚的速度会越来越快，动量也会越来越大，但如果遇到了阻力，下滚速度就会减小。


    动量优化法就是借鉴此思想，使得梯度递减在方向不变的基础上，参数更新越来越快，当梯度有所改变时，更新参数变慢（更加谨慎，是为了防止错过极值点），这样一来，既能加快收敛速度，又能减少寻找极值时带来的震荡。


    如前所言，在机器学习中，学习率（η）是一个非常重要的超参数，但难以确定。虽然可通过多次训练来筛选出比较合适的学习率，但无法确定测试多少次能够得到最优的学习率。所以，需要研究一些能够自适应地调节学习率大小的策略，从而提高训练速度。目前，基于梯度速减的改良算法，很多都是在学习率的自适应上面做文章。常用的算法有
    AdaGrad 算法、RMSProp 算法、Adam 算法及 AdaDelta 算法。


    我们知道，整个神经网络实际上就是用数据拟合了一个表征能力很强的函数。我们的目标就是找到一组权值令自己定义的损失函数达到最小值。如果该函数能有显式解，那么自然是好的。但这显然对于有成千上万个未知变量的神经网络函数是不现实的。'
