  md: '# ## 4.2 TensorFlow 中的数据类型


    在 Python 环境下编写 TensorFlow 程序，TensorFlow 的内置数据类型不可避免地会与 Python 的内置数据类型在一起混用，那它们之间到底有什么关系呢？下面我们来讨论这个问题。


    # ### 4.2.1 Python 基本数据类型与 TensorFlow 的关系


    在 Python 环境下编程，TensorFlow 自然不能拒 Python 以千里之外。与之相反的是，在很大程度上，它可以和 Python 进行默契配合，直接接收
    Python 基本数据类型，或由它们构成的列表来作为张量的数据源。


    例如，单个 Python 数值将会转换为零阶张量（即标量），Python 数值类型的列表将被转化为一阶张量（也就是向量），由列表构成的嵌套列表，将被转化为二阶向量（也就是矩阵），依此类推。之所以能正确运行，就证明了
    Python 的内置的数据类型能被“无缝”转化为 TensorFlow 的张量对象。


    ```

    tensor_0 = 1 #视为零阶张量

    tensor_1 = [b"Tensor", b"flow", b"is", b"great"] #视为一阶张量

    tensor_2 = [[False, True, False], [True, True, False]] #视为二阶张量

    tensor_3 = [[[0, 0, 0], [0, 0, 1]], [[1, 0, 0], [1, 0, 1]], [[2, 0, 0], [2, 0,
    1]]] #视为三阶张量......

    ```


    上述代码的功能比较直观，不再赘述。这里需要简单解释一下，在上述示例中，一阶张量中字符串前的字符“b”的含义。在 Python 中，字符串是一类很特殊的数据，字符串前面加一个英文字母，以明确告知编译器，要以什么样的处理方式来处理它。前缀
    b/B 表示引号中的若干字符都是字节数组（byte），而非字符串对象。


    如果 Python 原生数据类型已经够用，那就太好了。这样一来，TensorFlow 无非做一些将 Python 数据类型转换成张量对象的工作即可。


    但事实上，Python 原生的数据类型对数值计算做得并不够，特别是在机器学习方面，存在很多“捉襟见肘”的地方。举例来说，对于 Python 原生数据类型来说，所有整型数据都是一样的。但为了方便对数值类型数据'
