  md: '思想，正式将循环连接拓扑结构引入神经网络[1]。


    Jordan 提出的循环神经网络结构是一种前馈网络，该网络包含单个隐含层，输出节点将输出值反馈给一种特殊的单元，即上下文单元（Context），也就是图 8-2
    中间层右边的 3 个单元。下一个时间步负责将接收到的输出层的值反馈给隐含层单元（图 8-2 中间层左边的 3 个单元）。


    ![](img/aa01495b859013c80481c58ec0894987_272_0.png)


    如果输出层的值是某种行为（Action），那么这些特殊单元就允许网络记住前一个时间步发生的行为，而且这些特殊单元还是自连接的。从直观上来看，这些边允许跨多个时间步发送信息，且不会干扰当前时间步的正常输出。


    # # 8.2.3 Elman 循环神经网络


    1990 年，J. Elman 又在 Jordan 的研究基础上做了部分简化，正式提出了 RNN 结构（见图 8-3），不过那时将 RNN 称为 SRN（Simple
    Recurrent Network，简单循环网络）[2]。由于引入了循环，RNN 具备有限期记忆的优点。


    ![](img/aa01495b859013c80481c58ec0894987_272_1.png)


    类似于 Jordan 循环神经网络，在 Elman 循环神经网络中，每个隐含层的单元都配有专职“秘书”——上下文单元。每个这样的“秘书单元”j 都负责记录它的“主人单元”——隐含层神经元
    j 的前一个时间步的输出。“秘书单元”和“主人单元”的连接权值 w_{j,j} = 1，这意味着“秘书单元”作为一个普通的输入边，会把接收到的前一个时间步的值作为输入送还给隐含层的单元。


    Elman 循环神经网络与 Jordan 循环神经网络的不同之处在于，Elman 循环神经网络的反馈是从隐含层反向作为输入的一部分，而 Jordan 循环神经网络的反馈是从输出层反向作为输入的一部分。


    由于输出层是可见的，甚至是有标签的，因此以输出层为信息反馈的 Jordan 循环神经网络比较稳健。而以隐含层的输出作为反向输入的'
