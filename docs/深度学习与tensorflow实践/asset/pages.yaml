    然后，在 sklearn 中，模型的训练统称为 fit()。“fit”本身的含义是“拟合”。本质上讲，所谓的模型训练，实际上就是在训练集合上做数据拟合，以找到最佳的网络参数。由于分类属于典型的有监督学习，因此函数
    fit()提供两个参数，前者 X_train 是特征数据，后者 y_train 是标签（目标）数据。


    在模型训练完毕后，就可以测试模型的性能了。下面的代码就是利用训练得到的模型分别在训练结合和测试集合上进行预测。


    ```

    In [19]:

    01 #在训练集合和测试集合上进行预测

    02 y_predict_on_train = model.predict(X_train)

    03 y_predict_on_test = model.predict(X_test)

    04 #模型评估

    05 from sklearn.metrics import accuracy_score

    06 print(''训练集合的准确率为：{:.2f}%''.format(100 * accuracy_score(y_train, y_predict_on_train)))

    07 print(''测试集合的准确率为：{:.2f}%''.format(100 * accuracy_score(y_test, y_predict_on_test
    )))

    ```


