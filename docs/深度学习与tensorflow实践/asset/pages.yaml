    16 行）进行预测时，返回值是数值，表示样本属于每一个类别的概率，我们可以使用 np.argmax()方法（第 18 行）找到样本以最大概率所属的类别作为样本的预测标签。


    # 7.12 本章小结


    在本章中，我们先回顾了卷积神经网络的发展史，接着，给出了卷积的数学定义，然后借用生活中的相近案例来反向演绎了这个概念。最后用几个著名的卷积核演示了卷积在图像处理中的应用。


    随后，我们讨论了卷积神经网络的拓扑结构，并重点讲解了卷积层的设计目的和卷积层的三个核心概念：空间位置排列、局部连接和权值共享。空间位置排列确定了神经网络的结构参数，局部连接和权值共享大大减少了神经网络连接权值的数量，这为提高卷积神经网络的性能奠定了坚实基础。


    卷积神经网络中的各个“层”各司其职，概括一下，卷积层从数据中提取有用的特征；激活层在网络中引入非线性，通过弯曲或扭曲映射来实现表征能力的提升；池化层通过采样减少特征维度，并保持这些特征具有某种程度上尺度变化不变性；在全连接层实施对象的分类预测。


    最后，为了让读者有更深刻的认知，从实践的角度，讨论了基于卷积'
