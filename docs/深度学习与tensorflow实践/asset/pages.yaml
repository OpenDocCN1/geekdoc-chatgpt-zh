    \ \\( i_t \\times C_t' \\)。然后将这两个部分线性组合，得到更新后的记忆信息 \\( C_t \\)，即\n\n\\( C_t =\
    \ f_t \\times C_{t-1} + i_t \\times C_t' \\) (8-13)\n\n图 8-18 为输入门与调节门的组合示意图。需要说明的是，该图对于式（8-13）的可视化还是有些粗略。这是因为，状态\
    \ \\( C_{t-1} \\) 代表过去，在计算时需要先读出来，经过式（8-13），再次更新 \\( C_t \\) 写回去，这个“一读一写”的过程，实际上更像一个循环，图\
    \ 8-15 更能形象地描述这个循环过程。\n\n![](img/aa01495b859013c80481c58ec0894987_287_0.png)\n\
