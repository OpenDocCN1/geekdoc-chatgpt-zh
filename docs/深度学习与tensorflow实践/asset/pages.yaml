  md: '尔·尼尔森（Michael Nielsen）撰写的系列博客。


    # 2.3.3 机器学习本质与通用近似定理


    所谓机器学习，就是找到一个函数，实现特定的功能。函数在形式上可近似等同于在数据对象中通过统计或推理的方法，寻找一个有关特定输入和预期输出映射 f （见图 2-15）。


    ![](img/aa01495b859013c80481c58ec0894987_48_0.png)


    通常，我们把输入变量（特征）空间记为大写的 $X$，把输出变量空间记为大写的 $Y$。那么机器学习的本质，就是在形式上完成如下变换：$Y = f(X)$。


    在这样的函数中，针对语音识别功能，若输入一个音频信号，则这个函数 $f$ 就能输出诸如“你好”“How are you？”等这类识别信息。


    图 2-15 机器学习近似于寻找一个好用的函数


    针对图片识别功能，若输入的是一张图片，则在这个函数的加工下，就能输出（或称识别出）一个或猫或狗的判定。


    针对下棋博弈功能，若输入的是一个围棋的棋谱局势（如 AlphaGo），则它能输出这盘围棋下一步的“最佳”走法。


    而对于具有智能交互功能的系统（如微软的小冰），当我们给这个函数输入诸如“How are you？”这类问题时，它就能输出诸如“I am fine, thank
    you, and you？”等智能的回应。


    每个具体的输入都是一个实例（Instance），它通常由特征向量构成。在这里，将所有特征向量存在的空间称为特征空间（Feature Space），特征空间的每一个维度都对应于实例的一个特征。


    而人工神经网络最“神奇”的地方可能就在于，它可在理论上证明：“一个包含足够多隐含层神经元的多层前馈神经网络能以任意精度模拟任意预定的连续函数” [6]。


    这个定理也被称为通用近似定理（Universal Approximation Theorem）。这里的“Universal”也有人将其翻译成“万能的”，由此可以看出，这个定理的能量有多强。


    深度学习相当于函数逼近问题，即函数或曲面的拟合。但这种函数逼近的思想并不是神经网络的原创。事实上，数学领域中的函数逼近已经非常普遍（如泰勒级数展开、傅里叶变换等），数学领域常用三角多项式、


    ![](img/aa01495b859013c80481c58ec0894987_48_1.png)'
