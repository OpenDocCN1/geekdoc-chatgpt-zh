  md: '# 8.5.2 双向 RNN 建模


    在某些场景下，时间序列时刻 t 的输出不仅取决于之前时刻的信息，还可能取决于未来的时刻，所以有了双向 RNN (Bidirectional RNN，Bi-RNN)。例如，要预测一句话中间丢失的一个单词，有时只看上文是不行的，还需要查看下文。


    还拿前面的例子来说事。现在我们要预测横线上的词语，“天空飞过一只_”，RNN 从前向后滑动，先后感知到“天空”“飞过”和“一只”这样的历史语境，于是“小鸟”和“蜻蜓”都可能是候选单词，但不分伯仲，难以区分。


    但如果还有另外一个 RNN，能够反向划过它后面的句子 “____”，它有透明的翅膀”，那么横线上的词语就很容易锁定为“蜻蜓”。想象一下，我们时常做的英文完形填空题，在确定某个选项时，是不是也在空白处“前看看、后瞅瞅”，以便获得全面的信息。双向
    RNN 只不过将这种生活化场景理论化了而已。


    ![](img/aa01495b859013c80481c58ec0894987_280_0.png)


    双向 RNN 的理念并不复杂，它就是两个互相叠加的 RNN，它的任何一个输出，都是正向 RNN 和反向 RNN 两个输出的叠加结果（见图 8-11）图中 s
    为正向神经元的隐含态，s'' 为反向神经元的隐含态。


    由图 8-11 可以看出，每个时刻都有一个输入 x_t，隐含层有两个节点，一个 s_t 进行正向计算，另一个 s''_t 进行反向计算，输出层由这两个值共同决定。描述这个过程的形式化公式为


    ```

    s_t = f(Ux_t + Ws_{t-1} + b)

    s''_t = f(U''x_t + W''s_{t+1} + b'')

    y_t = g(Vs_t + V''s''_t + c)

    (8-5)

    ```


    其中，b 和 b'' 和 c 为偏置矩阵。U、V 和 W 分别表示正向 RNN 的输入矩阵、输出矩阵和隐含权值矩阵。U''、V'' 和 W'' 分别表示反向
    RNN 的输入矩阵、输出矩阵和隐含权值矩阵。由式 (8-5) 可以看出，正向计算和反向计算的权值并不共享，因为不同的网络描述不同时间序列的历史信息。'
