- pgno: 304
  md: '具体来说，如果输入序列实际长度比 num_timesteps 所设置的长度短，则将在末端用 value 值补齐；如果输入序列的长度比 num_timesteps
    所设置的值长，则将会直接被截断，以满足所需要的长度。补齐或截断发生的位置分别由参数 padding 和 truncating 决定（取值选项为''pre''
    或 ''post''）。其中向前补齐为默认操作。


    文本被截断或填充为相同长度后，它们的类型都是 NumPy 数组，不能被 TensorFlow 直接使用，因此需要将其转换为 TensorFlow 中的 Dataset
    对象。之所以使用 Dataset 对象，是因为 Dataset 内置了很多好用的数据预处理方法。


    ```

    In [11]:


    09    batchsz = 128

    10    db_train = tf.data.Dataset.from_tensor_slices((x_train, y_train))

    11    db_train = db_train.shuffle(1000).batch(batchsz, drop_remainder = True)

    12    db_test = tf.data.Dataset.from_tensor_slices((x_test, y_test))

    13    db_test = db_test.batch(batchsz, drop_remainder = True)

    ```


    我们来简单解释上述代码。第 10 行和第 12 行利用 from_tensor_slices() 的目的在于，分别将 NumPy 类型的张量切分成数据块，这些数据切片可通过
    for 循环迭代取出。第 11 行和第 13 行分别利用 batch()将前面生成的可迭代对象打包成小批量，然后分批送给模型训练，而不是一股脑地全部参与训练。这里参数
    drop_remainder 值得注意，若将其设置为 True，则表示抛弃分块的零头。例如，数据样本有 307 个，每个批次为 100，经过 batch()处理后，得到
    3 个批次，那么剩余的这 7 个样本就抛弃不用了。标准化处理流程很容易为了追求效率，而抛弃一些不是十分重要的细节，可谓“大行不顾细谱”。


    下面我们来验证一下截断后和补齐后，训练集和测试集的尺寸，即


    ```

    In [12]: print(''x_train shape:'', x_train.shape)

    Out[12]: x_train shape: (25000, 80)


    In [13]: print(''x_test shape:'', x_test.shape)

    Out[13]: x_test shape: (25000, 80)

    ```


    从输出可以看到，因为长度太长而被截断或因为不足而补齐后的句子，其长度都统一为 80，即为前面我们设定的句子长度的阈值。


