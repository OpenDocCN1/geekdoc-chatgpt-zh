    # 2.2 神经网络的原子单元——感知机


    前文提及的“简单单元”在生物神经网络中称其为神经元（Neuron），而在人工神经网络中，最简单的单元莫过于感知机（Perceptron）了。下面我们讨论一下何为感知机。


    # 2.2.1 感知机的形式化描述


    在认识感知机之前，我们先来简单了解一下它的历史。1943 年，McCulloch 和 Pitts 在合作的论文《神经活动中思想内在性的逻辑演算》中，提出了人工神经元的数学模型，即一直沿用至今的“M-P
    神经元模型” [1]，从而开创了人工神经网络研究的时代。


    1949 年，心理学家赫布（Hebb）提出神经元学习法则——赫布型学习。随后，美国神经学家 Rosenblatt 进一步推动人工神经网络的发展。


    1958 年，Rosenblatt 发表论文《感知机：大脑中信息存储和组织的概率模型》 [2]。在这篇论文中，Rosenblatt 正式提出并命名了可以模拟人类感知能力的机器模型，称之为“感知机”（也有文献译作“感知器”）。


    在 M-P 神经元模型中，如图 2-2 所示，神经元接收来自 n 个其他神经元传递过来的输入信号。这些信号的表达通常通过神经元之间连接的权值（Weight）大小来表示，神经元将接收到的输入值按照某种权值叠加起来。叠加起来的刺激强度
    S 可用式（2-1）表示：


    ```

    $S = w_1x_1 + w_2x_2 + ... + w_nx_n = \sum_{i=1}^n w_ix_i$

    ```


    从式（2-1）可以看出，当前神经元按照某种“轻重有别”的方式汇集了所有其他外联神经元的输入，并将其作为一个结果输出。


    但这种输出，并非“不加修饰”地直接输出，而是与当前神经元的阈值（Threshold）进行比较，然后通过激活函数（Activation Function）向外表达输出，在概念上，就称为感知机，其模型可用式（2-2）表示。


    ```

    $y = f(\sum_{i=1}^n w_ix_i - \theta)$

    ```'
