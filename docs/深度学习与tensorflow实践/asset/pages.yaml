  md: '![](img/aa01495b859013c80481c58ec0894987_234_0.png)


    图 7-9 向量（一维）卷积的计算过程


    该计算过程并不复杂，读者可自行推算。这种左右两侧都扩充一个 0 的操作，称为补零（Zero Padding），在后面的章节中，我们还会提及到。


    前面讨论了一维向量的卷积，那么二维向量（矩阵）的卷积又是怎样处理的呢？二维卷积运算常用在图像任务中，它与一维向量的卷积具有相似性。


    在图像处理领域中，卷积的两个对象都是离散的二维矩阵。在卷积神经网络中，通常利用一个局部区域（在数学描述上就是一个小矩阵）去扫描整个图像，在这个局部区域的作用下，图像中的所有像素点会被线性变换组合，形成下一层的神经元节点。这个局部区域被称为卷积核（Kernel）。


    ![](img/aa01495b859013c80481c58ec0894987_234_1.png)


    图 7-10 二维图像数据的卷积操作实例


    在图 7-10 中，为了便于读者理解，图像数据矩阵的像素值分别用诸如 a、b、c 和 d 这样的字母代替，卷积核是一个 2×2 的小矩阵。需要注意的是，在其他场合，这个小矩阵也被称为滤波器（Filter）或特征检测器（Feature
    Detector）。若将卷积核分别应用到输入的图像数据矩阵上，按照从左到右、从上到下的顺序分别执行卷积（点乘）运算，则可以得到这个图像的特征图谱。'
  merge: -1
