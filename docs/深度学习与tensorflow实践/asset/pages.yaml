    # 5.2.8 基于梯度递减优化算法的挑战


    下面我们总结一下随机梯度递减算法的优缺点。它的优点在于，对于大型的训练样本集合，该算法能更快地收敛（但这个收敛只是经验上的，并没有充分的理论证明）。其缺点在于，难以获得较高的预测精度，一些经典算法无法使用随机梯度递减法。


    不论是随机梯度递减法和批量梯度递减法，还是二者的混合体小批量梯度递减法，基于梯度递减的算法，都存在一些挑战，主要表现在如下两个方面。


    # 1. 合适的学习率很难找


    若学习率 \( \eta \) 太小，则算法的收敛速度缓慢；而学习速度太快，算法就会显得“阔绰吞枣”，权值更新波动较大，可能错过最优解，进而也妨碍算法的收敛。


    针对学习率 \( \eta \) 的调整问题，目前较为常用的方法是，在训练过程中动态调整学习率的大小，通常简称学习率衰减（Learning Rate Decay）。例如，采用模拟退火算法：预先定义一个迭代次数
    \( m \) ，当执行完 \( m \) 次训练后，便逐渐减小学习率（如分段常数衰减），或当损失函数的值小于一个给定阈值 \( t \) 后，减小学习率。但迭代次数
    \( m \) 和阈值 \( t \) 都属于超参数，需要凭借经验，不断试错获得，换句话说，并没有普适的指定学习率的方法。


    # 2. 鞍点比局部最优更可怕


    研究表明，深层神经网络之所以比较难训练，其最大的问题可能并不在于容易陷入局部最优（优化方程的局部最大或最小）。相反，由于网络结构非常复杂，在绝大多数情况下，即使找到局部最优，但能获得不错的性能，因此也是能接受的。


    深度学习网络之所以难训练是因为在学习过程中，优化方程可能困在马鞍面上，即一部分点的梯度是微升的，另一部分点的梯度是微降的（见图 5-10）。


    ![](img/aa01495b859013c80481c58ec0894987_166_0.png)


    # 图 5-10 优化方程中的马鞍面


    ① 例如，读者可以将损失函数改成均方差，即把 06 行代码改为：return tf.keras.losses.MSE(y_true, y_pred)，在迭代次数为
    1000 次的情况下，拟合效果要好很多。'
