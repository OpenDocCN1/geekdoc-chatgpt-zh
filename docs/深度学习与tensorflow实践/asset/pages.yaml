  md: '![](img/aa01495b859013c80481c58ec0894987_241_0.png)


    # ## 7.5.4 填充


    在有些场景下，卷积核的大小并不一定刚好被输入数据矩阵的维度大小整除。因此，会出现卷积核不能完全覆盖边界元素的情况，这时部分边界元素将无法参与卷积运算。


    此时，该如何处理这类情况呢？处理的方式通常有两种：第一种为有效填充（ Valid Padding ）。在这种策略下，直接忽略无法计算的边缘单元，实际上就是
    padding = 0，即不填充。在步幅 s = 1 时，图像的输入和输出维度关系为


    ```

    H_{out} = H_{in} - H_{kernel} + 1

    W_{out} = W_{in} - W_{kernel} + 1

    (7 - 5)

    ```


    其中，$H_{in}$ 和 $H_{out}$ 分别表示图像的输入高度和输出高度（ Height ），$H_{kernel}$ 表示卷积核的高度。类似地，$W_{in}$
    和 $W_{out}$ 分别表示图像的输入宽度和输出宽度（ Width ），$W_{kernel}$ 表示卷积核的宽度。


    例如，对于一个 800 像素×600 像素的图片，我们用 3×3 的卷积核进行卷积操作，利用式（ 7-5 ），很容易计算出卷积核可以有效处理的图片范围为 798
    像素×598 像素。也就是说，原图的上、下、左、右均减少一个像素。


    在有效填充过程中，每次卷积核处理的图像都是有效的，但原图也被迫做了裁剪，即变小了。这种策略犹如削足而适履，所以还有第二类常用的处理方式。


    第二种处理方式是等大填充（ Same Padding ）。在这种处理模式下，在


    > ① 与是否整除相比，使用填充更重要的好处在于，它可使卷积前后的图像尺寸保持相同，并且可以保持边界信息。换句话说，若没有填充策略，则边界元素与卷积核卷积的次数可能会少于非边界元素的数量。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '输入矩阵的周围填充若干圈“合适的值”，使得输入矩阵边界处的大小刚好与卷积核的大小匹配。这样一来，输入数据中的每个像素都可以参与卷积运算，从而保证输出图片与原图保持大小一致（这也是等大填充名称的由来）。


    这里所说的“合适的值”有两类：第一类是填充最邻近边缘的像素值，即就近取材，重复利用，或者认为图片是无限循环的，用镜像翻转图片作为填充值，第二类更简单，直接填充
    0，称为零值填充（Zero-Padding）。这样的填充相当于对输入图像矩阵的边缘进行一次滤波。


    事实上，零值填充通常应用更为广泛。使用零值填充的卷积称为宽卷积（Wide Convolution）；不适合使用零值填充的卷积称为窄卷积（Narrow Convolution）。


    下面举例说明这个概念。假设步幅 s 的大小为 2，为了简便起见，我们假设输入数据为一维矩阵[0, 1, 2, -1, 1, -3]，卷积核也是一维矩阵[1,
    0, -1]。在移动两次后，此时输入矩阵边界剩余一个元素-3，如图 7-18(a)所示。此时，便可以在输入矩阵填入额外的 0 元素，使得输入矩阵变成[0,
    1, 2, -1, 1, -3, 0]，这样一来，所有数据都能得到处理。


    图 7-18 是以一维数据为例来说明问题的。对于二维数据，零值填充就是围绕原始数据的周边来补零的圈数。在构造卷积层时，对于给定的输入数据，若确定了卷积核的大小、步幅及补零个数，则卷积层的空间分配就能确定下来。当补零的数目和步幅对输出都有影响时，输出的特征图谱的高度和宽度分别为


    ```

    H_{out} = \left\lfloor \frac{H_{in} + 2H_{padding} - H_{kernel}}{H_{stride}} \right\rfloor
    + 1


    W_{out} = \left\lfloor \frac{W_{in} + 2W_{padding} - W_{kernel}}{W_{stride}} \right\rfloor
    + 1


    (7-6)

    ```


    其中，\(\lfloor \cdot \rfloor\) 操作表示向下取整。\(H_{padding}\) 表示在垂直维度上的补零高度，\(H_{stride}\)
    表示在垂直维度上的步幅大小，\(W_{padding}\) 表示在水平维度上的补零宽度，\(W_{stride}\) 表示在水平维度上的步幅大小。


