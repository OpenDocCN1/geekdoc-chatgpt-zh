  md: "接。当然，我们也可以令 axis = 1，以实现在水平方向上的拼接。\n\n```\nIn [5]: tf.concat([t1, t2], axis\
    \ = 1)\nOut[5]:\n<tf.Tensor: shape=(2, 6), dtype=int32, numpy=\narray([[ 1,  2,\
    \  3,  7,  8,  9],\n       [ 4,  5,  6, 10, 11, 12]], dtype=int32)>\n```\n\n事实上，axis\
    \ 的取值还可以是负数，如 axis = -1，表示倒数第一个轴。很容易推算，如果某张量共有两个轴，它的倒数第 1 个轴，事实上就是正数第 1 个轴（从 0\
    \ 计数）。如 In [5]处的代码等价于 tf.concat([t1, t2], axis = -2)，请读者朋友思考一下为什么。\n\n从语法上来说，拼接操作可以在任意维度上进行，其唯一的约束在于，没有参与合并的维度必须保持一致。例如，shape\
    \ 为[4, 32, 8]和 shape 为[6, 35, 8]的张量，不能直接在 axis = 0 维度上进行合并，因为除了第 0 个轴，剩余部分的维度信息一个为[32,\
    \ 8]，另一个为[35, 8]，它们的维度信息并不一致，合并起来就无从下手。此时会显示如下的错误信息。\n\n```\nIn [6]: A = tf.random.normal([4,32,8])\n\
    In [7]: B = tf.random.normal([6,35,8])\nIn [8]: tf.concat([A ,B], axis = 0)  #错误拼接，剩余维度信息不一致\n\
    Out[8]: InvalidArgumentError: ConcatOp : Dimensions of inputs should match:\n\
    shape[0] = [4,32,8] vs. shape[1] = [6,35,8] [Op:ConcatV2] name: concat\n```\n\n\
    如果把 In [7]处的代码修改为 B = tf.random.normal([6, 32, 8])，那么张量 A 和 B 就可以拼接起来了。\n\n```\n\
    In [9]: B = tf.random.normal([6,32,8])\nIn [10]: tf.concat([A ,B], axis = 0).shape\n\
    Out[10]: TensorShape([10, 32, 8])\n```\n\n这样看起来似乎没有问题，但问题来自具体的应用场景。回到我们前面的假设当中，假设\
    \ A 代表学校 A 的信息，B 代表学校 B 的信息，那么怎么在张量合并后，还能区分彼此呢？一种简单的方式就是，记住前 4 条是学校 A 的数据，后 6\
    \ 条是学校 B 的数据，然后利用张量切片的方法读取不同学校的数据。\n\n如果张量的数量较少，那么利用这种方法，倒也无可厚非。但张量数量增加时（如有 1\
    \ 万个学校），利用这种“笨”办法就不那么有效了。这时一种较好的办法是升维——添加一个学校的维度来区分彼此。在前面的范例中，我们已经提及到这种策略，先使用\
