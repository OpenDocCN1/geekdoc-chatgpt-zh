  md: '相比于 TensorFlow、Keras 等框架，Theano 更显学术范儿，因为它并没有提供专门的深度学习 API 接口。如 Theano 没有神经网络的分级。因此，用户需要从底层开始，做许多工作，来创建自己需要的模型。


    框架毕竟就是一个半成品，最终要能出活，才是硬道理。受限于其底层特性，Theano 在出活效率上，表现平平。当开发效率更高的后起之秀蜂拥而出时，也该是它退出江湖之日。


    Theano 的开发始于 2007 年，早期的开发者包括当今深度学习大家约书亚·本吉奥（Yoshua Bengio）和他的学生伊恩·古德费洛（Ian Goodfellow，GAN
    框架的提出者）。在 2017 年 9 月 29 日，本吉奥宣布，在发布 Theano 1.0 版本后，Theano 光荣退休。


    虽然 Theano 已淡出历史舞台，但其功绩不可磨灭，其最大的“技术遗产”在于，它极大地启迪或培养了其他深度学习框架。在某种程度上，TensorFlow、Keras
    都继承了它的部分基因。


    # 3.3.2 Keras


    Keras 是一个纯 Python 编写的深度学习库，它提供很多高级神经网络 API，通过一系列的配置，它可以工作在 CNTK（微软公司开发的一款深度学习开发框架）、Theano
    和 TensorFlow 等框架之上。因此，Keras 可被视为在上述框架下的二次封装。也就是说，如果想用 Keras，那么必须预先安装上述框架的一种或多种。


    Keras 的语法简捷，用户可以直观地了解它的指令、函数和每个模块之间的连接方式。作为极简主义的代表，Keras 经过高度封装，在一些场景下，仅需几行代码就能构建一个能够正常工作的神经网络，或用十几行代码就能搭建一个
    AlexNet 网络（2012 年，ImageNet 竞赛冠军 Alex Krizhevsky 设计的卷积神经网络）。这种高效性是其他深度学习框架难以企及的。


    ![](img/aa01495b859013c80481c58ec0894987_77_0.png)


    图 3-4 Keras 的图标与口号


    这样看来，Keras 简直太“平易近人”了。Keras 的宣传口号是 “You have just found Keras.”（你才发现 Keras）。但有时候，某个事物的优点也恰是它的缺点，就看你从哪个角度来审视它了。Keras
    的高度封装性，的确让用户的开发效率变得很高，但也因为它的高度封装性，不容你置喙于它的个性化设置。Keras 的图标与口号如图 3-4 所示。


    Keras 最初是由 Google AI 开发人员弗朗索瓦·肖莱（Francois Chollet）创建和开发的。Google 员工和 Keras 创始人，这个双重身份，就决定了
    Keras 与 TensorFlow 有着千丝万缕的联系。'
