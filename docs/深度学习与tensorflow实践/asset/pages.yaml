    \ 3.5 以后，引入了一个特别的操作符号 “@” 代替 matmul()，TensorFlow 也继承了这一传统。这样一来，In [19]处的代码可改写为如下更加明晰的代码。矩阵的运算规则如图\
    \ 4-11 所示。\n\n```\nIn [29]: output = X@W + b\n```\n\nX@W 和 tf.linalg.matmul(X,W)的功能是完全一样的。在\
