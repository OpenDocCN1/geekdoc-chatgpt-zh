    在此之前，我们还有个很好用的调试技巧需要掌握，那就是在训练期间可视化我们的训练效果。在模型调参时，可视化起到了非常重要的启示作用。


    # 7.11.4 可视化展现 TensorBoard


    人们在训练庞大而复杂的深度神经网络时，经常会出现难以理解的运算。而人类是有“视觉青睐”的，也就是说，人们通常更善于理解图片带来的信息。为了迎合这一特性，也为了更方便地理解、调试和优化程序，TensorFlow
    提供了一个非常好用的可视化工具——TensorBoard。


    通过 TensorFlow，可以将监控数据写入本地文件系统之中，TensorBoard 能够可视化显式这些监控数据，并利用 Web 后端监控对应的文件目录，从而可以允许用户从远程查看网络的监控数据。


    通常在安装 TensorFlow 时，通常会自动安装 TensorBoard。如果你的系统没有安装，那么可以通过如下命令进行安装。


    ```

    conda install tensorboard

    ```


    可视化是数据的另外一种表达。因此，可视化之前必须获得数据。对模型训练而言，有两种获取训练数据的方法。第一种方法相对比较底层，它是利用 TensorFlow
    自身的数据处理逻辑，在模型训练时，事先需要我们创建监控数据的 Summary 类，并在需要时写入监控数据。首先使用 tf.summary.create_file_writer()方法创建监控对象类实例，并指定监控数据的写人目录，示例代码如下。


    ```

    # 创建监控类，监控数据将写入 log_dir 目录中

    summary_writer = tf.summary.create_file_writer(log_dir)

    ```


    在神经网络完成前向传播后，可以计算损失，对于误差这种标量数据，我们通过 tf.summary.scalar()方法记录和监控数据，并指定时间戳 step 参数。这里的
    step 参数类似于每个数据对应的时间刻度信息，也可以理解为数据曲线的 X 坐标。每类数据都可以通过不同的字符串名称来加以区'
  merge: -1
  img_proc: true
