    # 第 7 章 卷积神经网络


    卷积神经网络是一种典型的深度学习网络之一，它在图像识别、语音识别等领域都有很多成功的应用案例。在本章，我们首先讲解卷积的含义及卷积神经网络的网络结构层次，然后再对经典的卷积神经网络（如
