- pgno: 251
  md: '扬光大。也正是因为 AlexNet 的出现，人们更加相信深度学习可以被应用于机器视觉领域中，点燃了人们探究深度学习的热情。因为在那之后，更多、更复杂的神经网络被提出来，如
    VGG、Inception 等。


    AlexNet 除提出了新的网络架构外，还提出了几项全新的技术，如 ReLU、Dropout 及 LRN 等。与此同时，AlexNet 还使用当时最流行的硬件
    GPU 来实施加速，并开源了他们的代码，极大地推动了深度学习的发展。AlexNet 的整体结构如图 7-26 所示。


    ![](img/aa01495b859013c80481c58ec0894987_251_0.png)


    图 7-26 AlexNet 的整体结构（图片来源：参考资料[8]）


    AlexNet 的应用创新主要表现在以下 6 个方面[8]。


    +   (1) 成功应用了 ReLU 激活函数。虽然 ReLU 并非 AlexNet 的原创，但是真正能发挥神奇功效并被世人所知的时间节点，还要当属它在 AlexNet
    中的成功应用。


    +   (2) 成功使用了 Dropout 机制。在 AlexNet 中的最后几个全连接层中，都利用 Dropout 机制避免过拟合的发生。


    +   (3) 使用了重叠的最大池化。此前的卷积神经网络，通常使用平均池化，而 AlexNet 全部使用最大池化，成功避免了平均池化带来的模糊化效果。此外，AlexNet
    令步长比池化核的尺寸小一些，这样做的好处在于，池化层的输出彼此有重叠和覆盖，这丰富了特征提取的多样性。


    +   (4) 提出局部响应规范化（Local Response Normalization，LRN）。规范化的特性，在本质上，也是“抑制”，即它将较大的输入抑制到指定范围内。由于
    ReLU 是无边界函数，因此我们希望能利用某些形式的规范化，将无边界的 ReLU 输出“抑制”到有界范围内，从而提升高频特征的提取效率。


    +   (5) 使用 GPU 加速训练过程。之前杨立昂等人之所以止步于“收割”卷积神经网络的红利，其中很大的一个原因是，卷积神经网络受限于当时计算机硬件的“算力”。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '(6) 使用了数据增强（Data Augmentation）策略。深度学习项目通常需要大量的数据作为支撑，但是在现实中，我们很难找到数量庞大的数据集合来满足训练需求。另一方面，若训练数据量太少，则通常会造成欠拟合等问题。


    那么该如何解决这个问题呢？数据增强通过技术手段根据现有的数据集合，合法地“伪造”（增强）数据。这些手段主要包括：水平/竖直翻转、随机裁剪、修改颜色数值、仿射/旋转变换及添加噪声等。


    AlexNet 一共分为 8 层，包括 5 个卷积层和 3 个全连接层，在每个卷积层后面都跟着一个最大值下采样层和一个局部响应规范化层（LRN）。在前两个全连接层的后面都连着一个
    Dropout 层。


    # 7.10.3 VGGNet


    2014 年，牛津大学计算机视觉组（Visual Geometry Group，VGG）和 Google DeepMind 的研究员团队共同开发了新一代的深度卷积神经网络：VGGNet[12]，并取得了
    ILSVRC2014 比赛分类项目的第二名（第一名是 GoogLeNet[13]，同年由谷歌团队提出）和定位项目的第一名。


    VGGNet 成功地构筑了 16~19 层的卷积神经网络，证明了增加网络的深度，能够在一定程度上影响网络的最终性能，使分类错误率大幅下降，于此同时，其泛化能力又很强。到目前为止，VGGNet
    仍被广泛应用于图像处理任务。


    在某种程度上，可以将 VGGNet 看成网络加深版的 AlexNet，它们的主要网络层“配方”都是由卷积层和全连接层等部分构成的（见图 7-27）。需要注意的是，在
    VGGNet 中，最大池化和 ReLU 都属于数据变换，不足以作为一个网络层。


    ![](img/aa01495b859013c80481c58ec0894987_252_0.png)


    图 7-27 VGG16 的网络拓扑结构图'
