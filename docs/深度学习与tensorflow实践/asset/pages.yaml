  md: '的方法 Accuracy()被放置在 Keras 模块下。另外，根据 TensorFlow 的命名规则，Accuracy()的首字母大写，这说明它是一个类，需要先定义一个对象，才能基于对象的方法进行实际操作，而
    acc 就是这样的对象。


    ```

    In [3]: y_true = [1, 2, 3, 4]

    In [4]: y_pre = [0, 2, 3, 4]

    In [5]: _ = acc.update_state(y_true, y_pre)

    ```


    In [3]处 y_true 假设的是分类的真实值。In [4]处 y_pre 假设的是分类算法的预测值。可以看出，第 1 个分类预测值有误，后面 3 个分类预测值准确，预测准确率为
    75%。由于数据很少，所以我们可以一眼看出结果。


    但对于大规模数据处理，需要使用方法 update_state (self, y_true, y_pred, sample_weight = None)来处理。


    该方法会使用实际分类向量 y_true 和模型预测向量 y_pred 来更新状态变量，并返回一个操作（Op），由于此处用不到该变量，因此用一个“垃圾变量”——下画线（_）来接收它。


    一旦状态更新了，我们就可以提取运行结果了，而这个结果就是我们需要的准确率。


    ```

    In [6]: acc.result()   #这是一个标量

    Out[6] <tf.Tensor: id=258, shape=(), dtype=float32, numpy=0.75>

    ```


    result()使用状态变量（即实际分类张量和预测张量）来计算最终结果——准确率，这个准确率是单个值，它就是一个标量。从输出结果可以看出，即使标量只有一个数值，但它的属性（如
    id、shape、dtype 和 numpy 等）都与其他高维张量一样。


    此外，我们还可以在 update_state()方法中，通过使用参数 sample_weight 弱化或避免某些样本对预测准确率的影响。在重新计算预测准确率时，我们需要对上一次计算的状态复位，这时需要用到
    reset_states()方法。


    ```

    In [7]: acc.reset_states()   #状态复位

    ```


    然后在 In [8]处利用“新的值”，重新更新状态，实施预测。


    ```

    In [8]: _ = acc.update_state(y_true, y_pre, sample_weight= [1, 1, 0, 0])

    In [9]: acc.result().numpy()    #这是一个标量

    Out[9]: 0.5

    ```


    我们注意到，最后两个样本的权值均为 0，这表明，最后两个样本的预测结果实际上被屏蔽了。这样一来，对前两个有效样本，一正一误的预测结果，其预测准确率就是 50%。'
