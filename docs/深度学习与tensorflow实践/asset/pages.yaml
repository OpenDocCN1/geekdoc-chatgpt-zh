- pgno: 163
  md: '# 5.2.6 小批量梯度递减法


    从上面的分析可知，批量梯度递减法和随机梯度递减法是利用梯度递减的两个极端。在研究过程中，有一种很简单但非常好用的方法论，那就是“中庸之道”。该方法把各个方案的优缺点做了取舍，取个中间态。针对梯度优化算法，批量梯度递减法和随机梯度递减法的中间态，就是小批量梯度递减法。对于含有
    n 个训练样本的数据集，每次参数更新，选择一个大小为 b （ b < n ）的子集（ Mini-Batch ）计算其梯度，其参数更新公式为


    $$w_{t+1} \leftarrow w_t - \eta \sum_{i=x}^{i=x+b-1} \nabla_w J_i(w, x'', y'')$$
    (5-11)


    小批量梯度递减法既能保证训练的速度，又能保证最后算法比较可靠地收敛。正是由于小批量梯度递减法的稳定性能，目前 TensorFlow 等深度学习框架所用的随机梯度递减法，实际上是指小批量梯度递减法，小批量梯度递减法成了随机梯度递减法的化身。


    # 5.2.7 实战：基于梯度递减的线性回归算法


    通过利用最小二乘法，我们可以显式求解线性方程组的解，从而可以解决部分线性回归问题。下面我们结合梯度递减策略，给出一个基于 Python 的简易线性回归求解方案。


    简易线性回归模型用公式表示就是 $y = w_1 \times x + w_0 \times 1$。这里的 $w_1$ 和 $w_0$ 为回归系数，需要从训练数据中学习得到。为什么要把后面的系数
    “1” 单独写出来呢？其实是为了以统一的方式求解系数。如果模型的第一个输入是可变参数 $x$，那么第二个输入就是固定值 “1”，称为哑元（ Dummy ）。


    ![](img/aa01495b859013c80481c58ec0894987_163_0.png)


    图 5-9 梯度递减策略示意图


    下面列举范例程序的目的在于，让读者对梯度递减有一个感性的认识（参见范例 5-5）。程序本身的功能非常简单，即给出有关面包重量（ 单位：磅 ）和售价（ 单位：美元
    ）对应关系的 5 条数据。然后利用梯度递减策略，令程序在这 5 条数据中学习线性回归模型的参数 $w_0$ 和 $w_1$。其中，$w_0$ 和 $w_1$
    的起始值是任意给定的，然后反复迭代多次，如图 5-9 所示，逐步逼近最佳的 $w_0$ 和 $w_1$，让损失函数达到最小值。在得到 “最佳” 的参数之后，我们再给出一个面包重量，让模型预测它的售价。这样就完成了一个完整的有监督学习流程。'
