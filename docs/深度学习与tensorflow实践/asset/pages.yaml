  md: '理解为从水平（行）方向进行约减。张量的约减方向如图 4-7 所示。


    ```

    In [1]: import tensorflow as tf

    In [2]: x = tf.constant([[1, 1, 1],

    [1, 1, 1]])

    In [3]: tf.math.reduce_sum(x, 0) #结果为[2, 2, 2]

    Out[3]: <tf.Tensor: id=6, shape=(3,), dtype=int32, numpy= array([2, 2, 2],

    dtype=int32)>

    In [4]: tf.math.reduce_sum(x, 1) #结果为[3, 3]

    Out[4]: <tf.Tensor: id=8, shape=(2,), dtype=int32, numpy= array([3, 3],

    dtype=int32)>

    ```


    对于张量而言，约减是可以有先后顺序的。因此，axis 的值可以是一个向量，向量中的元素表示约减的先后次序，如 axis=[1, 0]，它表示先水平方向约减，再垂直方向约减。反之，axis=[0,
    1]，表示先垂直方向约减，再水平方向约减。


    ```

    In [5]: tf.math.reduce_sum(x, 1, keepdims=True) # 结果为[[3], [3]]

    Out[5]:

    <tf.Tensor: id=10, shape=(2, 1), dtype=int32, numpy=

    array([[3],

    [3]], dtype=int32)>

    In [6]: tf.math.reduce_sum(x, [0, 1]) # 结果为 6

    Out[6]: <tf.Tensor: id=12, shape=(), dtype=int32, numpy=6>

    ```


    若 axis 没有指定方向，则采用默认值 None，None 表示所有维度的张量都会被依次约减，最终值为[6]。


    ```

    In [7]: tf.math.reduce_sum(x) # 默认值为 None，两个维度均求和，值为 6

    Out[7]: <tf.Tensor: id=4, shape=(), dtype=int32, numpy=6>

    ```


    从上面的过程可以看出，每个维度的约减都会导致该维度的消失。约减的维度由 axis 参数来指定，如将 axis 指定为 0 时，就是把 0 维消除掉，以此类推，其他维度的解释类似，不再赘述。


    > 约减的过程有点像刘慈欣先生在《三体》小说中描述的概念——降维攻击。


    除了 math.reduce_sum() 可以实施按轴方向求和，math.reduce_mean() 也很常用。顾名思义，math.reduce_mean()用于计算张量沿着指定轴方向上的平均值，其参数的含义与
    reduce_sum()的参数含义完全一样，具体使用方法可以参阅 TensorFlow 的官方文档。


    除了上述两种约减方法，常见的方法还有 math.reduce_max() （按轴方向求最大值）、math.reduce_min() （按轴方向求最小值）、math.reduce_std()
    （按轴求标准差）、math.reduce_variance() （按轴求方差）等，它们共同的特点都是按轴实施某种操作，令张量元素的个数得以减少。'
