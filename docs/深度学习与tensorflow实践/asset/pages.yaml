- pgno: 225
  md: '本章我们讨论一种应用范围更广的网络——卷积神经网络（Convolutional Neural Network，简称 CNN 或 ConvNet），它在图像处理、语音识别、自然语言处理、药物发现及围棋博弈（如
    AlphaGo）等众多任务中表现上佳。此外，CNN 还有很好的“生态圈”，它的众多变种算法，如 AlexNet、VGGNet、GoogLeNet 及 ResNet，在近几年的深度学习发展途中，大放异彩，它也为人工智能日渐渗透于我们的工作和日常生活，做出了可圈可点的贡献。


    # 7.1 概述


    下面，我们先来讨论一下前馈神经网络的问题所在，进而说明卷积神经网络的诞生契机及发展历程。


    # 7.1.1 前馈神经网络的问题所在


    解析视觉图像是人类获取智能的重要手段。自然地，我们也想用前面学习到的全连接前馈神经网络来处理图像数据。例如，在前面的章节中，我们利用前馈神经网络处理手写数字识别问题，得到还不错的分类效果，但所处理仅是
    28 像素×28 像素的低分辨率图片，若图片分辨率一旦大幅提升，前馈神经网络的训练速度及预测性能就不忍细究。之所以会这样，是因为用全连接前馈网络来处理图像时，会存在以下两个问题[1]。


    +   1. 网络参数太多，难以训练


    假设我们分析的是高清图片，输入的是 1000×1000×3 的彩色图片，那么对于全连接前馈神经网络来说，输入层到隐含层的参数权值就达到 (3×10^3×10^3)×(3×10^3×10^3)=9×10^12
    个之多。这还是在只有一个隐含层的情况下，可想而知，如果网络中具有多个隐含层，那么全连接就会产生组合爆炸问题（见图 7-1）。过多的网络参数一方面会导致整个神经网络的训练效率非常低（因为需要计算的参数实在太多），同时也很容易出现过拟合（海量的参数需要海量的数据来“喂养”，数据量太少，就让网络难以学习数据的特征，从而泛化能力较差）。


    ![](img/aa01495b859013c80481c58ec0894987_225_0.png)


    图 7-1 无法承受参数之重的全连接前馈网络'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 2. 局部不变性特征，前馈神经网络难以捕捉


    在自然图像中，物体通常都具有局部不变性特征。不变性（Invariance）是指对象语义信息不随对象 X 的变换而变换。从计算机视觉的角度来看，这里的变换包括平移、旋转、缩放等。例如，在图
    7-2 中，无论我们怎么平移、旋转或缩放图片，我们的视觉系统感知到的语义，都是相同的——它们都是一只狮子。


    ![](img/aa01495b859013c80481c58ec0894987_226_0.png)


    图 7-2 不变性示意图


    很显然，如果神经网络能对图片的识别具备“不变性①”，那么自然会大大改善图片分类的准确性与鲁棒性。然而，全连接前馈神经网络很难提取这些局部不变性特征。


    如果非要达到类人系统的视觉“不变性”，那么前馈神经网络不得不把每个稍加变化的图片都当成一个新图片来学习。在神经网络训练中，如果样本不足，人们通常可以通过平移、旋转或缩放图片来增加样本数量，这个策略称为数据增强（Data
    Augmentation）。借助这个策略，前馈神经网络虽然可以勉强改善神经网络的性能，但显然也大大增加了训练的成本。


    # 7.1.2 卷积神经网络的生物学启示


    人工智能的目标之一是模拟人类的智能。事实上，人工神经网络就是人类神经网络的一种模仿（至少“初心”如此）。针对前面提及的前馈神经网络的缺点，我们还能接着从人类的神经网络的运行机制中获取灵感吗？


    答案是肯定的。我们知道，所谓动物的“高级”特性，其具体表现体现在行为方式上。而更深层次的，它们会体现在大脑皮层的进化上。1968 年，神经生物学家 D. Hubel
    与 T. Wiesel 在研究动物（先后以猫和猴子为实验对象）视觉信息处理时，有以下两个重要而有趣的发现[2]。


    # 1. 神经元局部感知


    神经元无须感知神经系统中所有其他神经元的存在，即存在局部感知'
