- pgno: 286
  md: '遗忘门可通过以下激活函数来实现。


    \( f_t = \sigma(W_f \cdot [s_{t-1}, x_t] + b_f) \)


    ( 8-10 )


    其中，\(\sigma\) 表示激活函数，通常为 Sigmoid。\(\boldsymbol{W}_f\) 表示遗忘门权值矩阵，\(\boldsymbol{b}_f\)
    表示遗忘门的偏置，下标 \(f\) 是 "遗忘（forget）" 的首字母，仅是为了增强可读性而已。


    事实上，遗忘门是通过将前一隐含层的输出 \(s_{t-1}\) 与当前的输入 \(x_t\) 进行 "调和"（调和的轻重取决于学习到参数 \(\boldsymbol{W}_f\)），然后利用激活函数将其输出值压缩到
    0~1 范围内。若输出值越靠近 1，则表明记忆块保留的信息越多；反之，若输出值越靠近 0，则表明保留的信息越少。遗忘门的工作过程可用图 8-16 表示。


    ![](img/aa01495b859013c80481c58ec0894987_286_0.png)


    # 8.7.3 输入门


    输入门的作用在于，决定当前时刻的输入信息 \(x_t\) 以多大程度添加到记忆信息流中，激活函数 \(\sigma\) 也使用 Sigmoid，即


    \( i_t = \sigma(\boldsymbol{W}_i \cdot [s_{t-1}, x_t] + \boldsymbol{b}_i) \quad
    \text{(8-11)}\)


    ![](img/aa01495b859013c80481c58ec0894987_286_1.png)


    由于输入门与遗忘门的功能类似，因此它们的工作过程也是类似的，与遗忘门结合在一起，如图 8-17 所示。事实上，输入门的输出也是一个中间阶段数据，还需要进一步的调和。


    # 8.7.4 调节门


    调节门又称候选门，可视为一个信息的 "勾兑门"，它主要负责 "勾兑" 当前输入信息和过去记忆信息，即负责计算当前输入的单元状态 \(\boldsymbol{C}''_t\)（相当于生成补充的记忆），即


    \(\boldsymbol{C}''_t = \text{Tanh}(\boldsymbol{W}_C \cdot [\boldsymbol{h}_{t-1},
    x_t] + \boldsymbol{b}_C) \quad \text{(8-12)}\)


    其中，激活函数换成了 \(\text{Tanh}()\)，它可以将输出结果归整到[-1, 1]区间内。这个激活函数的输出有正有负，这就意味着，它可能加强某些记忆，也可能
    "压制" 某些信息。


    接下来，我们需要将记忆块中的状态从 \(\boldsymbol{C}_{t-1}\) 更新到 \(\boldsymbol{C}_t\)。记忆的更新'
