  md: '隐含层的神经元为 20 个（这个设置并没有什么道理可讲，就是一种经验而已，也可以是别的值），那么输入层到隐含层的连接权值就是 2×20，需要构造这么一个矩阵
    W1 来存储这些数值（第 03 行）。而每个隐含层的神经元都需要一个偏置，所以需要一个能存储 20 个偏置值的张量 B1（第 04 行）。W1 和 B1 都是需要参与求导的权值，所以必须将其声明为
    tf.Variable 对象。输入层和输出层是全连接关系（Full Connected），即前一层的每一个神经元都与下一层的神经元保持连接。这种“稠密”的连接方式，在很多深度学习框架中，称为稠密层（Dense）。


    由于“异或操作”的输出是一个值，因此输出层的设计也是显而易见的，即具有一个输出神经元。因此从隐含层到输入层，共有 20×1 个连接权值（第 05 行），而偏置只有一个（第
    06 行），基于相同的原因，它们也必须被声明为 tf.Variable 对象。第 03~06 行申明的变量需要初始化才能使用，所用的初始值用到了 tf.random.uniform()方法，它的功能是产生指定尺寸的在[-1,1]区间的呈现正态分布的张量


    第 09 ~ 13 行是一个网络的预测函数 predict()，实际上也是前向传播函数。在该函数中，我们描述了神经网络的细节构造。例如，我们使用改良版本的
    ReLU 函数作为隐含层的激活函数，以修正线性单元 tf.nn.leaky_relu()，TensorFlow 已经为我们设计好了这样的函数，直接即可。由于逻辑操作的输出值区间为[0,1]，因此在输出层我们用的激活函数为
    tf.sigmoid()，它的值域符合这个区间。需要说明的是，为了便于操作，我们需要把第 36 行和第 37 行定义的训练数据和标签数据转换为 TensorFlow
    适用的张量形式。这个工作分别在第 10 行和第 18 行完成。


    在预测函数 predict()的前面一行（第 08 行），我们使用了一个 Python 装饰器 tf.function。当一个函数被 tf.function
    装饰时，它依然可以像其他普通函数调用或被调用。但编译器看到这个标识，就会自动把它编译成一个计算图（AutoGraph），以便它基于计算图的操作可以更快执行，同时还可以导出计算模型。


    第 15 ~ 32 行定义了一个拟合函数（模型训练函数）。所谓的拟合就是依据损失函数，利用 SGD 算法来反向更新网络权值。第 16 行利用了 tf.keras
    模块提供的优化器 tf.keras.optimizers.SGD(1e-1)，括号内的值是学习率（通常记做 η），1e-1 是一种科学计数法实际上就是 1×10^-1=0.1。为了避免错过最优值，这个值通常比较小。但学习率如果过小，迭代次数就会增多，训练时间也就相应很长，通常是反复尝试，η
    取一个折中的值。


    第 26 ~ 32 行与前面的范例类似，利用 TensorFlow 提供的梯度来自动'
