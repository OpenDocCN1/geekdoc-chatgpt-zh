  md: "# 8.12.1 数据读取\n\n诸如 IMDB 之类经典的数据集通常都已内置于深度学习框架中，如果没有指定加载路径，只需要使用专门的 API，那么框架会帮助我们自动加载。IMDB\
    \ 影评数据集包含 50 000 条用户评价，分别包含 25 000 条从 IMDB 下载的关于电影的“积极”和“消极”的评论。标签为“积极”和“消极”的评论数量相等。\n\
    \n在 IMDB 中，评价体系为：其中 IMDB 评级小于 5 的用户评价标注为 0，即消极；IMDB 评价大于或等于 7 的用户评价标注为 1，即积极。数据集分为训练集和测试集，二者各占\
