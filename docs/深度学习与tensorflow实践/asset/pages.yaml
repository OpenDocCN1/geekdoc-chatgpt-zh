- pgno: 237
  md: '需要说明的是，不同于后文提到的 CNN 中的卷积核，下面卷积核都是超参数，也就是说，属于人们长期摸索而成的先验知识，而不是神经网络学习得到的。


    （1）同一化（Identity）。由图 7-13 可知，该核什么也没有做，卷积后得到的图像与原图是一样的。因为该核只有中心点的值是 1，邻域点的权值都是 0，所以滤波后的取值没有任何变化。


    （2）边缘检测（Edge Detection），也称为高斯-拉普拉斯算子。需要注意的是，该核矩阵的元素总和值为 0（中间元素为 8，而周围 8 个元素之和为
    -8），所以滤波后的图像会很暗，而只有边缘位置有亮度。


    （3）锐化（Sharpness Filter）。图像的锐化和边缘检测比较相似。首先找到边缘，然后再把边缘像素加到原来的图像上，如此一来，强化了图像的边缘，使得图像看起来更加清晰。


    （4）均值模糊化（Box Blur /Averaging）。该卷积核矩阵的每个元素值都是 1，它将当前像素和它的四邻域的像素一起取平均值，然后再除以 9。均值模糊比较简单，但图像处理得不够平滑。因此，还可以采用高斯模糊核（Gaussian
    Blur），这个核被广泛用在图像降噪上。


    ![](img/aa01495b859013c80481c58ec0894987_237_0.png)


    事实上，还有很多有意思的卷积核，如浮雕核（Embossing Filter），它可以给图像营造出一种艺术化的 3D 阴影效果，如图 7-14 所示。浮雕核将中心一边的像素值减去另一边的像素值。这时，卷积出来的像素值可能是负数，我们可以将负数当成阴影，而把正数当成光，然后再对结果图像加上一定数值


    偏移即可。


    从上面的操作可以看出，所谓的卷积核，在形式上看，就是一个个权值矩阵。它们用于处理单个像素与其相邻元素之间的关系。


    卷积核中的各个权值相差较小，实际上就相当于每个像素与其他像素取平均值，因此有模糊降噪的功能（见图 7-13 中的均值模糊化）。若卷积核中的权值相差较大（以卷积核中央元素来观察它与周边元素的差值），则能拉大每个像素与周围像素的差距，也就能得到提取图像中物体边缘或锐化的效果（见图
    7-13 中的边缘检测和锐化）。'
