    通过前面的学习可知，GRU 是 LSTM 的又一个升级版本。我们可能会有这样的想法，若将 LSTM 神经元换成 GRU 神经元，则虽然分类准确率稍有降低，但运行时间缩短了，有时候也是值得考虑的。


