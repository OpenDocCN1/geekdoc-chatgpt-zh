    # 2.2.2 感知机名称的由来


    有了 Pitts 等人打好的坚实理论基础，赫布假说又进一步拓展了 Rosenblatt 的视野。1958 年，Rosenblatt 提出了感知机模型，并将赫布假说工程化。利用自己设计的感知机，Rosenblatt
    做了一个在当时看来令人惊叹的实验（见图 2-3），实验的训练数据是 50 组图片，每组图片由一张标识向左和一张标识向右的图片组成。


    每次练习都以输入神经元为开端，先给每个输入神经元都赋上随机的权值，然后计算它们的加权输入之和。若加权和为负数，则预测结果为 0；否则预测结果为 1（这里的
    0 或 1 对应于图片的“左”或“右”，在本质上，感知机实现的就是一个二分类）。若预测是正确的，则无须修正权值；若预测有误，则用学习率（Learning Rate）乘以差错（期望值与实际值之间的差值）来对应地调整权值。Rosenblatt
    提出的感知机模型如图 2-4 所示。


    ![](img/aa01495b859013c80481c58ec0894987_32_1.png)


    图 2-3 Rosenblatt（右）和合作伙伴调试感知机


    ![](img/aa01495b859013c80481c58ec0894987_32_2.png)


    图 2-4 Rosenblatt 提出的感知机模型'
