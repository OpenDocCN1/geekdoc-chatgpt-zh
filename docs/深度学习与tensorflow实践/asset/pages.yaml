    下面我们来剖析范例 6-6 的代码。在本质上，所有基于数据的模型训练都是不断地通过数据拟合（fit）来找到合适的模型参数。因此，与 sklearn 类似，在
    TensorFlow 中，所有模型的训练名称都称作 fit（即拟合，第 25 行）。


    在 fit()方法中，其实有很多参数，在本范例中，我们仅使用其中以下 5 个参数。


    ```

    model.fit(x=None, y=None, batch_size=None, epochs=1, verbose = 1,...)

    ```


    简单介绍一下这 5 个参数。第 1 个参数 x 表示训练集的特征数据。第 2 个参数 y 表示训练集的标签数据。第 3 个参数 batch_size，表示训练样本的“批”大小。每次训练仅采用全集的某个子集，即为“批”。


    为了更好地理解“批”这个概念，现举例说明。假设我们有 550 个样本，若设置 batch_size（批大小）等于 100，则算法会首先从训练集中取第一批数据，即前
    100（1 ~ 100）个数据；下一批接着取（101 ~ 200），依此类推，直到把所有的训练样本都取到。对于后面的 50 个样本可单独取出来训练一次，这样总共迭代
    6 次训练网络参数。


    假设将所有样本都拿出来训练，但训练的效果还是不尽人意，那么该怎么办呢？如果难以再次增加训练样本数，那么一种变通的简单方法就是，以上一次训练的网络参数为初值，将原来的数据取出，再把神经网络训练一遍，这个循环次数就是
    epochs，它就是 model.fit()的第 4 个参数。若 epochs = 1，则表示将所有数据训练 1 遍；若 epochs = 10，则表示将所有数据训练
    10 遍，依此类推。


    model.fit()方法的第 5 个参数是 verbose，其本意是“冗余的信息”，这里表示是否打印输出详细的训练信息，若 verbose = 1，则表示输出详细信息；若
    verbose = 0，则表示压制输出信息。model.fit()方法还有其他参数，详细使用方法可查询 TensorFlow 的官方文献。


    通过前面的工作，我们已经完成了模型的训练。但训练的效果如何呢？还需要进一步对准确率进行验证。验证的相关代码参考范例 6-6 的第 27 行。


