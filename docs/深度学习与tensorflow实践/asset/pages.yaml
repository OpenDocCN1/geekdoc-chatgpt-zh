  md: "In [15]处代码的功能是创建均值为 10，标准差为 2 的正态分布张量，其尺寸为 3 行 2 列。TensorFlow 除可以创建正态分布外，还提供了创建均匀分布的方法。通过\
    \ tf.random.uniform(shape, minval=0, maxval=None, dtype=tf.float32)方法，可以创建采样区间[minval,\
    \ maxval]均匀分布的张量。\n\n```\nIn [17]: uni_tensor = tf.random.uniform([2,2])\nIn [18]:\
    \ print(uni_tensor)\nOut[18]:\ntf.Tensor(\n[[0.10641289 0.6318289 ]\n [0.4701332\
    \ 0.17339122]], shape=(2, 2), dtype=float32)\n```\n\n上述代码完成功能是，创建采样区间为[0,1)、尺寸为[2,2]，即\
    \ 2 行 2 列的张量。这个采样区间是可以自定义的，若不指定取值区间，则默认的采样区间为[0,1)。需要注意的是，均匀分布指定的上限区间和下限区间是左闭右开的，即最大值是取不到的。例如，下面的代码实现的功能就是生成采样区间为[1,10)，即尺寸为[2,3]的整型张量。\n\
    \n```\nIn [19]: uni_tensor2 = tf.random.uniform([2,3],\n              minval =\
    \ 1,\n              maxval = 10,\n              dtype = tf.int32)\nIn [20]: tf.print(uni_tensor2)\n\
    [[1 8 6]\n [4 8 7]]\n```\n\n# 4.4.5 创建特定张量序列\n\n在使用 for/while 循环计算张量或者对张量进行索引时，常需要创建一段连续的整型序列张量，这时可通过\
    \ tf.range()方法实现。该方法有以下两个原型。\n\n```\ntf.range(limit, delta=1, dtype=None, name='range')\n\
    或\ntf.range(start, limit, delta=1, dtype=None, name='range')\n```\n\n该方法的使用完全类似于\
    \ Python 的内置函数 range()。tf.range(n)的效果完全等同于 tf.range(0, n)的效果，其功能就是创建[0, n)范围内、步长为\
    \ delta 的序列。这里的 n 就是训练的上限 limit，取值区间是左闭右开的，即最大值 limit 无法取到。若起始值不是默认值 0，则需要显式设置\
    \ start 参"
