- pgno: 249
  md: '![](img/aa01495b859013c80481c58ec0894987_249_0.png)


    为 Dropout 后的示意图，很明显，Dropout 之后的网络“清瘦”了很多，由于少了很多连接，所以网络也简单了很多。


    图 7-24 Dropout 的工作示意图（图片来源：参考资料[11]）


    事实上，Dropout 也是一种学习方式。通常分为两个阶段：学习阶段和测试阶段。在学习阶段，以概率 p 主动、临时性地忽略部分隐藏节点。这一操作的好处在于，在较大程度上缩小了网络的规模，而在这个“残缺”的网络中，让神经网络学习数据中的局部特征（部分分布式特征）。在多个“残缺”网络（相当于多个简单网络）中进行特征学习，总比仅在单个健全网络上进行特征学习，其泛化能力来得健壮。


    在于是，在较大程度上缩小了网络的规模，而在这个“残缺”的网络中，让神经网络学习数据中的局部特征（部分分布式特征）。在多个“残缺”网络（相当于多个简单网络）中进行特征学习，总比仅在单个健全网络上进行特征学习，其泛化能力来得健壮。


    > 这里顺便勘误一下，这个“皮匠”乃谚传，实为“神将”之谐音，也就是“副将”。


    而在测试阶段，将参与学习的节点和那些被隐藏的节点以一定的概率 p 加权求和，综合计算得到网络的输出。对于这样的“分分合合”的学习过程，有学者认为，Dropout
    可视为一种集成学习（Ensemble Learning）。


    这里顺便介绍一下集成学习的理念，它有点类似于中国的那句古话“三个臭皮匠，赛过诸葛亮”。在对新实例进行分类时，集成学习将若干个分类器集成起来，通过对多个分类器的分类结果进行某种优化组合，最终通过投票法决定分类的结果，即采用了“少数服从多数”的原则。


    通常，集成学习可以取得比单个分类器更好的性能。如果把单个分类器比作一个决策者，那么集成学习的方法相当于多个决策者共同商定的一项决策。


    但需要指出的是，要获得较好的集成效果，每一个单独学习器都要保证做到“好而不同”。也就是说，个体学习器都要有一定的准确性，并保证有多样性（Diversity），也就是说，学习器要有差异性，有了差异性，才能兼听则明，表现出更强的鲁棒性。


    # 7.10 经典的卷积神经网络结构


    前面的介绍仅给出了卷积神经网络的主要构成，而具体的网络构架方法有很多种。比较经典的卷积神经网络有 LeNet（1986 年）、AlexNet（2012 年）、GoogleNet（2014
    年）、VGG（2014 年）和 ResNet（2015 年）。本节主要介绍其中几种典型的深层卷积神经网络，更为详细的介绍，还需要读者自行查阅相关文献。'
