- pgno: 66
  md: '如，感知机模型中的激活函数选项包括{identity, logistic, tanh, relu}。由于修正线性单元 ReLU 性能较好，因此，ReLU
    就是激活函数的默认值（注意，作为参数值时，这些值必须是用引号引起来的全部小写的字符串）。


    这里我们仅仅给出两个自定义的参数。第一个参数是 solver，其含义为“解题者”。为何有这样的称谓呢？我们知道，每个机器学习模型实际上都对应一个代价函数。为了达到某种性能指标，通常需要找到这个函数的最优解（或次优解），但这类目标函数可能会有成千上万个未知参数，故求函数的显式通解一般来说是不可能的。因此，另外一种常见的方法就是按照某种策略试探性地获得最优解或次优解，这种策略通常就称为优化算法。


    这就好比爬山，山顶最高峰是一定存在的（这好比目标函数存在最优解），那么如何最快或最稳妥地爬到山顶，就需要大家“各显神通”了。


    很显然，不同的自身条件，需要采用不同的爬山策略。挑山工和探险客就不太可能采取相同的策略。类似地，不同的数据特性也可能需要采用不同的“solver”。对于机器学习而言，常见的
    solver 包括但不限于：lbfgs（拟牛顿法优化器，适合于大规模数值计算）、sgd（传统的随机梯度递减优化器，收敛较慢且容易陷入局部最优解）和 adam（自适应矩估计优化器）。由于
    adam 收敛速度快，因此在多层感知机分类器中，它被设置为默认优化器。


    多层感知机分类器的第二个重要参数就是 hidden_layer_sizes，该参数非常重要，因为它决定着神经网络的拓扑结构。我们知道，神经网络通常由 3 部分构成：输入层、隐含层和输出层，如图
    2-14 所示。


    在设置神经网络中的这些参数时是有规律可循的。由于输入层和输出层神经元的数量取决于数据特性和用户的目标，因此这些神经元的数量基本都是固定的。例如，针对当前判定葡萄酒种类的案例，我们要依据
    13 个特征来判定，那么输入层就是 13 个神经元，而输出是某葡萄酒的种类，一个神经元就能完成这个输出，因此输出层神经元的个数为 1。


    > 例如，有多少个隐含层、每个隐含层有多少个神经元这类参数就属于超参数。在设置这些参数时，设计人员之于神经网络，就好比有了“上帝之眼”，“超参数”的“超”就来自这层含义。


    作为算法工程师，目前你所能决定的就是隐含层的拓扑结构①。我们把这种不能通过学习得到而是凭人为经验设定的参数，称为超参数（Hyper Parameters）。相比而言，模型可以根据数据自动学习出来的变量就是参数。例如，神经网络中神经元彼此连接的权值和偏置等都属于参数。


    我们通过设置 hidden_layer_sizes 来决定神经网络的拓扑结构，它的赋值是一个元组对象。元组的结构和元素内涵都是有讲究的：元组内的元素个数就是隐含层的层数，每个元素具体的数字就是某个隐含层神经元的个数，元素的先后顺序就是隐含层的先后顺序。


    ① 为了简化描述，这里没有考虑算法工程师所做的特征选择。事实上，算法工程师可以通过分析数据来删除某些无用特征，或人为构造某些有用特征。'
