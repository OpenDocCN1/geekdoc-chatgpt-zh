    ```


    现在，假设我们要提取 input_strs 所示字符串的子字符串，且每个子字符串的起始位置、提取长度都不一样。这类问题放在 Python 中，处理起来比较烦琐，不得不借助
    for 循环逐一处理。这样一来，难以发挥张量的并行处理优势。


    而在 TensorFlow 中，利用张量思维就方便得多。首先，我们把每个字符串的起始位置汇集在一起，形成位置张量。然后，再把每个字符串的提取长度也汇集在一起，形成长度张量；最后，利用
