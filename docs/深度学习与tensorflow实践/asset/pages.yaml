    \ 80, 100] => [b, 64]\nx = self.rnn(x)            #RNN 层，含 2 个隐含层\n# 输出张量的维度变化：[b,\
    \ 64] => [b, 1]\nx = self.outlayer(x)       #输出层\n# 二分类，用 sigmoid 模拟概率\nprob =\
    \ tf.sigmoid(x)       #输出归一化处理\nreturn prob\n```\n\n简单解释一下上述代码。类 MyRNN 就是按如图 8-31\
    \ 所示的结构建立的。第 16 行括号内的 keras.Model 表明了继承关系，keras.Model 是父类。然后，先重写了构造器方法__init__()。由于父类的变量初始化需要父类自己完成，因此先需要调用父类的构造器（第\
    \ 18 行）。在这个子类的构造器中，我们先构造一个词向量的嵌入层，然后用续贯模式定义一个复合网络层，它包含两个简易 RNN 层。最后，由于该神经网络是用于分类的，因此需要对接一个全连接层。对于一个二分类而言（输出概率>0.5\
    \ 表示正类，反之表示负类），输出层只需要一个神经元即可（第 28 行）。\n\n对高度封装的 Keras 而言，我们只需要宏观的了解各种层的调用 API，神经元内部的计算就交给\
