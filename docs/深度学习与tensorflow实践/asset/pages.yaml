    第 08 ~ 12 行，定义 predict()方法，它针对每个输入向量，输出感知机的计算结果（即输出预测标签）。


    第 14 行，定义方法 train())，其功能就是训练权值参数。针对输入训练数据和每组向量（该向量包括预期的分类标签），根据训练轮数及学习率来不断更新神经元的权值。


    我们使用_update_weights()方法来完成更新权值的工作。由 Python 的命名规则可知，凡是以单个下画线“_”开头的变量，若出现在类中，则表示是类中的私有成员。因此，__update_weights()方法是
    Perceptron 类中的私有方法，仅供类中的其他方法（如 train()方法）调用。这个方法就是按照感知机训练规则来更新权值的。


