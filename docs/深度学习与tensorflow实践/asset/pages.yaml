    # 2.3.4 神经网络结构的设计


    如果说神经网络需要向“纵深”方向发展，那么该如何设计神经网络的拓扑结构呢？


    对于前馈神经网络，输入层和输出层的设计比较直观。假如我们尝试判断一张手写数字图片上是否写着数字“2”。很自然地，我们可以把图片中的每个像素的灰度值作为网络的输入。在输入层，每个像素都是一个数值（若是彩色图，则是表示红、绿、蓝的
    3 通道数组），而把包含这个数值的容器“视作”一个神经元。


    如果图片的维度是 16×16，那么可以将输入层神经元设计为 256 个（即输入层是一个包含 256 个灰度值的神经元），每个输入层神经元接收的输入值就是归一化处理之后的灰度值。0
    代表白色像素，1 代表黑色像素，灰度像素的值介于 0 到 1 之间。也就是说，输入向量的维度（像素个数）要与输入层神经元的个数相同。


    而对输出层而言，它的神经元个数和输入层神经元的个数是没有对应关系的，而是与待分事物类别有一定的相关性。例如，对于如图 2-17 所示的前馈神经网络拓扑结构，如果我们的任务是识别手写数字，而数字有
    0~9 共 10 类。那么，如果在输出层采用 softmax 回归函数，那么输出层神经元数量仅为 10 个，分别对应数字“0~9”的分类概率。


    ![](img/aa01495b859013c80481c58ec0894987_50_0.png)


    图 2-17 前馈神经网络拓扑结构'
