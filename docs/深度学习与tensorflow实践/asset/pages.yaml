  md: '的运算量从原来的与神经元数目的平方成正比，减小到只与神经元数目本身成正比。运算量大幅下降，从而让 BP 算法更具可操作性。


    自 20 世纪 80 年代末起，微处理器和内存技术的高速发展，令计算机的运行速度和数据访存速度比 20 年前高了几个数量级。这一下（运算量下降）、一上（计算速度上升），加上多层神经网络可设置隐含层，这些都极大地提高了数据特征的表征能力，同时很大程度上缓解了当年马文·明斯基对神经网络的责难。于是，对人工神经网络的研究渐渐得以复苏。


    > 如果说保罗·沃伯斯的工作开创了 BP 算法的先河（相当于从 0 到 1 的创新），那么杰弗里·辛顿等人的工作则是极大地推动了 BP 算法的应用（相当于从
    1 到 N 的推广），


    一般地，优化就是调整分类器的参数，使得损失函数快速寻找极值的过程。而 BP 算法，在本质上是一个好用的优化函数。而说到 BP 算法，我们通常强调的是反向传播。其实在本质上，它是一个双向算法。也就是说，BP
    算法分两步走：① 正向传播输入信息，实现分类功能（所有的监督学习基本上都可以归属于分类或回归）；② 反向传播误差，调整网络权值。


    # 5.3.2 正向传播信息


    在前面的章节中，我们提到的前馈网络的完成功能其实就是正向传播信息。简单来说，就是把信号通过激活函数的加工，一层一层地向前“蔓延”，直到抵达输出层。在这里，假设神经元内部的激活函数为
    Sigmoid（$f(x)=1/(1+e^{-x})$），之所以选用该函数作为激活函数，原因主要有以下两点。


    +   （1）该函数把输出的值域锁定在[0, 1]之间，便于调节。


    +   （2）该函数的求导形式非常简单且优美，即


    ```

    $f''(x) = f(x)(1 - f(x))$ (5-13)

    ```


    事实上，类似于感知机，前馈网络中的每个神经元功能都可细分为两个部分：①汇集各路连接带来的加权信息；②加权信息在激活函数的“加工”下，给出相应的输出，如图 5-11
    所示。


    ![](img/aa01495b859013c80481c58ec0894987_168_0.png)


