- pgno: 53
  md: '通常来说，代价函数或损失函数的值越小，说明实际输出和预测输出之间的差值越小，也就说明我们构建的模型越好。这些代价函数和损失函数非常有用，因为我们就是靠它们来“监督”机器学习算法，使其朝着预测目标前进的，因此，它们是监督学习的核心标志之一。


    # 2.5 常用的激活函数


    前面我们提到，神经网络可以近似模拟任何函数，而“模拟”函数的过程中，离不开非线性变换。如果没有非线性变换会发生什么呢？通过前面的分析，我们知道，神经元与神经元的连接都是基于权值的线性组合。根据线性代数的知识，线性的组合依然是线性的，换句话说，如果全连接层没有非线性部分，那么在模型上叠加再多的网络层，意义都非常有限，因为这样的多层神经网络最终会“退化”为一层神经元网络，深度神经网络就无从谈起了。


    为了避免这种情况发生，就得请“激活函数”出山了。神经元之间的连接是线性的，但激活函数可不一定是线性的。有了非线性的激活函数，无论多么玄妙的函数，在理论上，它们都能被近似地表征出来。加入（非线性的）激活函数后，深度神经网络才具备了分层的非线性映射学习能力。因此，激活函数是深度神经网络中不可或缺的部分。


    这时，选取合适的激活函数就显得非常重要了。下面我们简单介绍常见的激活函数。


    # 2.5.1 Sigmoid 函数


    在前面的章节中，我们提到了常用的激活函数 Sigmoid，其形式化的公式为式（2-12），图形如图 2-18 所示。


    ![](img/aa01495b859013c80481c58ec0894987_53_0.png)


    ```

    Sigmoid(x) = \frac{1}{1+e^{-x}} （2-12）

    ```


    Sigmoid 函数的优势在于，它可以将一个实数输入映射到(0,1)范围内，在物理意义上最接近生物神经元的休眠和激活之间的状态。例如，Sigmoid 函数可以用于深度学习模型
    LSTM（Long Short-Term Memory，长短期记忆）中的各种门（Gate）上，模'
  merge: -1
  img_proc: true
- pgno: 54
  md: '拟门的关闭和开启状态。此外，Sigmoid 函数还可以用于表示概率，并且还可用于输入的归一化处理。


    凡事都有两面性。Sigmoid 函数也有缺点，那就是它存在饱和性。具体来说，当输入数据 x 很大或者很小时，Sigmoid 函数的导数迅速趋近于 0。这就意味着，很容易产生所谓的梯度消失现象。要知道，如果没有了梯度作为指导，那么神经网络的参数训练就如同“无头苍蝇”，毫无方向可言。


    此外，从图 2-18 可以看出，Sigmoid 函数的另一个不足之处在于，它的输出不是以 0 为中心的。有时我们更偏向于当激活函数的输入是 0 时，输出也是
    0 的函数。


    因为上面两个问题的存在，导致参数收敛速度很慢，严重影响了训练的效率。因此在设计神经网络时，采用 Sigmoid 函数作为激活函数的场景并不多。


    # 2.5.2 Tanh 函数


    Tanh 函数同样也是常用的激活函数，它将一个实数输入映射到(-1,1)范围内，其示意图如图 2-19 所示。当输入为 0 时，Tanh 函数输出为 0，符合我们对激活函数的要求。


    ![](img/aa01495b859013c80481c58ec0894987_54_0.png)


    图 2-19 激活函数 Tanh


    Tanh 函数的取值可以是负值，在某些需要抑制神经元的场景，需要用到它的这个特性。例如，在 LSTM 中，就用 Tanh 函数的负值区来模拟“遗忘”。


    Tanh 函数的形式化描述为


    Tanh(x) = \frac{sinh(x)}{cosh(x)} = \frac{e^x - e^{-x}}{e^x + e^{-x}} = 2Sigmoid(2x)
    - 1 （2-13）


    由式（2-13）可见，Tanh 函数和 Sigmoid 函数之间存在一定的线性关系，因此，两者的形状是类似的，只是尺度和范围不同。因此，Tanh 函数同样存在与
    Sigmoid 函数类似的缺点——梯度弥散（Gradient Vanishing），导致训练效率不高。


    因此，如何防止神经网络陷入梯度弥散的境地，或者说如何提升网络的训练效率，一直都是深度学习非常热门的研究课题。目前，在卷积神经网络中，最常用的激活函数就是修正线性单元
    ReLU（Rectified Linear Unit）。


    整个神经网络的计算，在本质上，都是基于梯度的计算。在 Sigmoid 函数或 Tanh 函数的尾部，梯度趋近于 0，多层传播后，梯度几乎消失，而梯度是网络调参的依据，梯度没有了，调参就失去了方向。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 2.5.3 ReLU 函数


    ReLU 函数是由 Krizhevsky 和 Hinton 等人在 2010 年提出来的[9]。标准的 ReLU 函数非常简单，即 \( f(x) = \max(x,
    0) \)。简单来说，当 \( x > 0 \) 时，输出为 \( x \)；当 \( x \leqslant 0 \) 时，输出为 0。如图 2-20(a)所示，注意，该图是一条曲线，只不过它在原点处不那么圆滑而已。


    为了让它在原点处圆滑可导，Softplus 函数也被提出来了，它的函数形式为 \( f(x) = \ln(1 + e^x) \)。Softplus 函数是对
    ReLU 函数平滑逼近的解析形式，其图形如图 2-20(b)所示。更巧的是，Softplus 函数的导数恰好就是 Sigmoid 函数。由此可见，这些非线性函数之间存在着一定的联系。


    ![](img/aa01495b859013c80481c58ec0894987_55_0.png)


    ![](img/aa01495b859013c80481c58ec0894987_55_1.png)


    图 2-20 ReLU 函数和 Softplus 函数


    不要小看这个看起来有点简陋的函数，ReLU 函数的优点很多，或许“简单就是美”。相比于 Sigmoid 函数，ReLU 函数的优点主要体现在如下三个方面。


    +   （1）单侧抑制。观察图 2-20(a)，当输入小于 0 时，神经元处于抑制状态；反之，当输入大于 0 时，神经元处于激活状态。ReLU 函数相对简单，求导计算方便。这导致
    ReLU 函数得到的 SGD（Stochastic gradient descent，随机梯度递减）的收敛速度比 Sigmoid/Tanh 函数的收敛速度快得多。


    +   （2）相对宽阔的兴奋边界。观察图 2-18 至图 2-20，Sigmoid 函数的激活状态（\( f(x) \) 的取值）集中在中间的狭小空间(0,1)内，Tanh
    函数有所改善，但也局限于(-1,1)内，而 ReLU 函数则不同，只要输入大于 0，神经元就一直处于激活状态。


    +   （3）稀疏激活。相比于 Sigmoid 之类的激活函数，稀疏性是 ReLU 函数的优势所在。Sigmoid 函数将处于抑制状态的神经元设置为一个非常小'
  merge: -1
  img_proc: true
- pgno: 56
  md: '的值，但即使这个值再小，后续的计算也少不了它们的参与，这样操作计算负担很大。但观察图 2-20 可知，ReLU 函数直接将处于抑制状态的神经元“简单粗暴”地设置为
    0，这样一来，使得这些神经元不再参与后续的计算，从而造成了网络的稀疏性，如图 2-21 所示。


    正是因为这些原因，圆滑可导的近似函数 Softplus 在实际任务中并不比“简单粗暴”的 ReLU 函数效果更好，这是因为 Softplus 函数带来了更多的计算量。


    这些细小的变化，让 ReLU 函数在实际应用中大放异彩，它能有效缓解梯度消失的问题。这是因为，当 x > 0 时，它的导数恒为 1，保持梯度不衰减，从而缓解梯度消失的问题。


    ![](img/aa01495b859013c80481c58ec0894987_56_0.png)


    图 2-21 ReLU 函数产生稀疏连接关系


    > 显然，激活函数的种类远不止这些。还有渗漏型整流线性单元（Leaky ReLU[11]）、指数线性单元（ELU[12]）、高斯误差线性单元（GELU[13]）及周期激活函数（SIREN[14]），请感兴趣的读者自行查阅相关文献。


    除此之外，ReLU 函数还减少了参数之间相互依存的关系（因为进行了网络瘦身），使其收敛速度远远快于其他激活函数，最后还在一定程度上缓解了过拟合问题的发生（对
    Dropout 机制比较熟悉的读者可能会发现，这与 Dropout 的迭代过程十分像）。ReLU 函数的卓越表现，让深度学习的三位大师 Yann LeCun、Yoshua
    Bengio 和 Geoffrey Hinton 在 2015 年表示，ReLU 函数是深度学习领域最受欢迎的激活函数。


    ReLU 函数有如此神奇的作用，其实还有一个原因，那就是该函数的模型正好暗合生物神经网络的工作机理。2003 年，纽约大学教授 Peter Lennie 的研究发现[10]，大脑同时被激活的神经元只有
    1%～4%，即神经元同时只对输入信号的少部分进行选择性响应，大量信号被刻意屏蔽了，这进一步表明了神经元工作的稀疏性。


    其实，这是容易理解的，因为生物生存也是需要成本的。进化告诉我们，作为人体最为耗能的器官——大脑要尽可能地节能，这样才能在恶劣的环境中生存。


