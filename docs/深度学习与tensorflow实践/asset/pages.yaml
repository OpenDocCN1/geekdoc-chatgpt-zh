- pgno: 180
  md: '若函数没有显式解，则只能用“摸石头过河”的方法，把最优解“试探”出来。利用计算机思维来解决数学问题的一大特点就是，“只要功夫深，铁杵磨成针”。这里的“功夫深”，其实就是计算机的速度快和“不知疲倦”，这里“针”就是我们要找到的最优解。凡是能提高“磨针”效率的技巧，都可归属于优化算法。


    前面提及的梯度速减算法也是基于这个基本原理。如果最终函数到达了局部最优解，那么求出来的一阶梯度值为 0，即某一点（x*）的一阶梯度 f''(x*)=0 是该点为局部最优解的必要条件。


    而牛顿法也是一种“摸着石头过河”求局部最优解的方法。与梯度速减方法不同的是，它用的方法更加“高阶”，它用目标函数的二阶泰勒（Taylor）级数展开来近似该目标函数，通过求解这个二阶函数的极小值来求解凸优化（Convex
    Optimization）的搜索方向。


    > 凸优化是数学最优化的一个子领域，研究定义于凸集中的凸函数最小化的问题。在某种意义上来说，在凸最佳化中局部最佳值必定是全局最佳值。


    牛顿法利用的是二阶收敛寻找极值，而梯度速减法是利用一阶收敛寻找极值，所以牛顿法收敛速度更快。更通俗地来说，例如，我们想找一条最短的路径，走到一个山谷的最底部，梯度速减法只能让你每次从当前所处位置选一个坡度（梯度）最大的方向前进一步。而牛顿法在选择下山方向时，不仅会考虑坡度是否够大，还会考虑你走了一步后，坡度是否会变得更大（考虑二阶梯度）。所以，可以说牛顿法比梯度速减法看得更远，故通常也就能更快地抵达最底部。梯度速减法与牛顿法的对比示意图如图
    5-21 所示。


    ![](img/aa01495b859013c80481c58ec0894987_180_0.png)


    图 5-21 梯度速减法与牛顿法的对比示意图


    从几何意义上讲，牛顿法是用一个二次曲面去拟合当前所处位置的局部曲面，而梯度速减法是用一个平面去拟合当前的局部曲面。通常情况下，二次曲面的拟合会比平面更好，所以牛顿法选择的下降路径会更符合真实的最优下降路径。


    凡事有利就有弊。相比于梯度速减法，牛顿法的确敛速度更快，但付出了更高的计算成本，即在每次迭代过程中，牛顿法除了要计算一阶梯度（这个与梯度速减法是一致的），还要计算
    Hessian 矩阵（二阶梯度）和 Hessian 矩阵的逆矩阵。若 Hessian 矩阵不是正定矩阵，即不可逆，则牛顿法会失效。


    由于牛顿法计算 Hessian 矩阵的成本太高，因此就用各种方法来替代'
