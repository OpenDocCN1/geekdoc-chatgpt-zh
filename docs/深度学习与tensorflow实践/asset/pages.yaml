  md: '# 4.6 张量的维度伸缩与交换


    前面我们讨论了张量的索引和分块获取部分张量数据。事实上，为了处理方便，张量还需要如“变形金刚”一般，根据不同的应用场景，做维度的伸缩。此外，为了让张量的加工具备“方向性”，TensorFlow
    中的张量还有提供“轴”方向的概念。下面我们来讨论这两个议题。


    # 4.6.1 张量中的轴方向


    ![](img/aa01495b859013c80481c58ec0894987_125_0.png)


    在 TensorFlow 中，由于张量通常是多个维度的，涉及到数据的操作，因此通常需要指明操作的维度，这个操作的维度称为轴（Axis）方向。


    对于标量而言，它就是一个数据，所以不存在“轴”这个概念。对于一维向量，它就是一个轴，称为 axis 0（从 0 开始计数，下同），如图 4-6(a)所示。对于二维张量，尺寸的第
    0 个维度就是 axis 0，第 1 个维度对应 axis 1，如图 4-6(b)所示。对于三维张量，依然是这样的规定，尺寸的第 0 个维度就是 axis
    0，第 1 个维度对应 axis 1，第 2 个维度对应 axis 2，依此类推。但根据惯例，人们通常把三维张量的 axis 0 设置为深度（Depth）或样本的数量，如图
    4-6(c)所示。


    # 4.6.2 张量维度的增加与删除


    在张量的合并与分割时，常常会遇到张量维度增加与删除的情况，下面我们就来讨论这个议题。


    先来考虑这样一个应用场景。假设有一个张量，描述的是学校 A 的学生成绩，张量的维度信息为[班级数，学生数，课程数量]，如[5, 30, 7]表示有 5 个班级，每个班级有
    30 名学生，每名学生选了 7 门课。如果所有学生都在同一所大学，那么这样的张量有三个维度就够用了。


    类似地，对于学校 B 而言，假设学校 A 与学校 B 的课程和班级编制都是一致的，我们也可以用这样的三维张量表示学校 B 的学生成绩。现在为了处理方便，需要将学校
    A 和学校 B 的数据合并，但还要能区分彼此，因此在合并前需要将张量升维，即添加一个学校维度（或称添加一个新的'
