    > 激活函数虽名叫“激活”，但其实际上更重要的功能是做非线性变换。非线性变换的目的是让神经网络的输出更容易向目标值靠拢。


    从上面的简易案例中，我们获得了对神经元的感性认识，原来它们就是一个个具体的数字：表示特征值 $x_1$ 与 $x_2$，它们可以取值不同，如 1 和 1，也可以是-1
    和-1，甚至是其他值。由于表示特征值处于输入的位置，因此被称为输入层神经元。


    类似地，输出层神经元也是一个数字，如图 2-6 中的 $S$，它的输出根据输入变化而变化，即 “2” 或 “-2”。


    那什么又是神经元之间的连接呢？原来就是不同数字之间的操作：如 $1 \times 1 + 1 \times 1 = 2$，输出层神经元 $f$ 之所以等于
    2，是因为两个输入层神经元（分别取值为 1 和 1）分别与权值（分别取值 1 和 1）进行乘法（ $\times$ ）和加法（ + ）操作后，得到了输出结果。当某个数字（神经元）在某种“操作”下影响到另外一个数字（神经元）时，就可视为这两个神经元相互连接。


    看到这里，不知道你是否会想起古希腊哲学普罗泰格拉（Protagoras）的那句名言，“人是万物的尺度（Man is the measure of all things）”。


