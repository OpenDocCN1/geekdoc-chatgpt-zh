  md: '范例 7-4 中，仅仅是把监控数据写入到本地磁盘，想可视化显示它们，还得请 TensorBoard 出马。在终端命令行模式下输入如下指令，即可调用 TensorBoard
    来解析这些监控的参数值。


    ```

    $ tensorboard --logdir logs

    Serving TensorBoard on localhost; to expose to the network, use a proxy or pass
    --bind_all

    TensorBoard 2.3.0 at http://localhost:6006/ (Press CTRL+C to quit)

    ```


    作为终端启动命名，TensorBoard 必须全部小写为 tensorboard，其后的启动参数选项--logdir 可知，它指定的参数就是写入日志文件的目录路径。这个路径要与第
    10 行的顶级目录一致（/.logs）。该目录下的子目录会被 TensorBoard 感知到。TensorBoard 在加载日志文件时，会把日志目录下的所有事件文件全部读取出来，一并分析。


    这样做是有原因的，因为深度学习项目在训练过程中，会因各种各样的错误停止，而后又重新执行，这样每次都会生成一个事件文件，一并读取出来的好处在于，有参照对比的作用。这就好比，医生在给患者看病时，为了准确诊断病情，希望看到患者以前的诊断记录。


    实际上，除前面讲到的参数--logdir 外，TensorBoard 还有其他启动参数，下面一并给予简单介绍。


    +   * --port：设置 Web 服务的端口号，若显式不设置，则默认值是 6006。

    +   * --event_file：指定一个特定的事件日志文件。

    +   * --reload_interval：Web 服务后台重新加载数据的间隔，默认值为 120s。


    由上面 TensorBoard 启动后显示的提示信息可知，由于我们并没有手动设置服务端口号，因此 TensorBoard 会在后台自动开启了一个端口号为 6006
    的 Web 服务。


    在浏览器地址栏中输入 http:// localhost:6006，TensorBoard 显示的数据流图（GRAPHS）如图 7-29 所示。我们可以用鼠标拖动这个图的显示区域，还可以利用鼠标滚轮放大或缩小该图。这个数据流图就是我们搭建的神经网络模型拓扑结构，之所以会并排拥有多组类似的图，是因为我们多次运行这个程序，TensorBoard
    为了区分彼此，给后续出现的模型加上编号，如 flatten_1、flatten_2 等字样。


    在 TensorFlow 2.x 以后，如图 7-29 所示的计算图的意义并不是很大，


    > 需要注意：对于 Windows 用户，参数 --logdir 后面需要添加完整路径：如 tensorboard --logdir D:\your\path\logs'
