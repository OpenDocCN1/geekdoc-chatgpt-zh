  md: '然这个表示并不能被人类理解）是深度学习区别于其他机器学习算法的独门绝技。


    深度学习的学习对象同样是数据。与传统机器学习不同的是，它需要大量的数据，也就是“大数据（Big Data）”。有一个观点在工业界一度很流行，那就是在大数据条件下，简单的学习模型会比复杂模型更加有效。而简单的模型，最后会趋向于无模型，也就是无理论。


    在当下，深度学习领跑人工智能。事实上，人工智能的研究领域很广，包括机器学习、计算机视觉、专家系统、规划与推理、语音识别、自然语言处理和机器人等。而机器学习又包括深度学习、监督学习和无监督学习等。简单来讲，机器学习是实现人工智能的一种方法，而深度学习仅仅是实现机器学习的一种技术而已（见图
    1-6）。


    > 2008 年《连线》（Wired）主编克里斯·安德森（Chris Anderson）发表题为“理论的终结：数据洪流让科学方法依然过时”的文章，一石激起千层浪。


