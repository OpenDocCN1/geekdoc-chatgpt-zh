- pgno: 150
  md: "这里 \\( e \\) 称为单样本误差。\n\n![](img/aa01495b859013c80481c58ec0894987_150_0.png)\n\
    \n图 5-1 识别手写数字的神经网络\n\n假设在训练集 \\( D \\) 中有 \\( n \\) 个样本，我们可以借助标记 \\( E \\) 来表示训练数据中所有样本的误差总和，并用其大小来度量模型的误差程度，即\n\
    \n\\( E = e^{(1)} + e^{(2)} + ... + e^{(n)} = \\sum_{d=1}^n e^{(i)} = \\frac{1}{2}\
    \ \\sum_{d=1}^n (t_d - o_d)^2 \\)  \n（5-2）\n\n其中，\\( t_d \\) 是第 \\( d \\) 个训练样本的目标输出，\\\
    ( o_d \\) 是第 \\( d \\) 个训练样本的实际输出。\n\n在这里，对于第 \\( d \\) 个实例的输出 \\( o_d \\) 可记为\n\
    \n\\( o_d = \\boldsymbol{w}^T \\cdot \\boldsymbol{x}_d \\)  \n（5-3）\n\n其中，\\(\
    \ \\boldsymbol{x}_d \\) 表示第 \\( d \\) 个训练样本的特征向量，\\( \\boldsymbol{w}^T \\) 为各个特征取得的权值向量，于是我们可以用\
    \ \\( (\\boldsymbol{x}_d, t_d) \\) 这样的“元组对”表示训练集中的第 \\( d \\) 个样本。\n\n对特定的训练集而言，\\\
    ( (\\boldsymbol{x}_d, t_d) \\) 的值都是已知的，可视为常量。所以，在本质上，式（5-2）就是有关特征的权值 \\( \\boldsymbol{w}\
    \ \\) 的函数，其更为清晰的表达为\n\n\\( E(\\boldsymbol{w}) = \\frac{1}{2} \\sum_{d=1}^n (t_d\
    \ - o_d)^2 = \\frac{1}{2} \\sum_{i=1}^n (t_d - \\boldsymbol{w}^T \\cdot \\boldsymbol{x}_d)^2\
    \ \\)  \n（5-4）\n\n> 公式（5-1）前面的系数 “1/2”，主要是为了在求导求梯度时，“消除”差值的平方项。"
