    在第 4 章我们已经提到，很多成熟的网络模型（如 CNN）在处理图片时，有它们自己的特定格式。对于图片而言，其格式一般定义为：[batch, height,
    width, channel]，其中 batch 表示一次性处理的图片数量，channel 表


