- pgno: 285
  md: '![](img/aa01495b859013c80481c58ec0894987_285_0.png)


    图 8-15 控制记忆单元状态 c 的 4 个 门


    这些控制门的输入其实是一个复杂的数据向量，在输出时，这些输入向量会被一个值域在 [0,1]或[-1,1]之间的门来管控。管控的方式，取决于所用的激活函数，如
    Sigmoid 或 Tanh 等。正常的信息和这些控制信号进行操作（要么是乘积操作，要么是加法操作，这取决于实际需要），就可以控制信息的流动情况。有了这些好用的门开关，记忆就如同调酒师手中的酒，是勾兑可调的。


    > 前文提及的“门开关”，实际上是一个比喻。在真正的算法中，哪有什么所谓的“开关”可言？这里的“门开关”，实际上是通过激活函数来控制信号输出的大小。


    例如，某个信息和一个值为 0 的控制信号相乘，结果为 0，表明这个信息要被清除。又如，若某个信息乘上一个负值信号（如-0.5），然后再与自身相加，实际上就是削弱这个信息，该信号就代表遗忘。诸如此类。


    何时开门，何时关门，何时半开半掩，何时增强，何时抑制，这都是由各种门的权值决定的。而这些权值 LSTM 正是通过海量数据学习得到的。


    下面我们逐步解析这几个常见的门对记忆状态和输出状态的影响。


    # 8.7.2 遗忘门


    如前所述，遗忘门的目的在于，控制从前面的记忆中丢弃多少信息，或者说要继承过往多少记忆。以音乐个性化推荐为例[9]，如果用户对某位歌手或某个流派的歌曲感兴趣，那么将诸如“点赞”“转发”和“收藏”等这样的正向操作作为“记忆”进行加强（换句话说，遗忘要少一些）。反之，如果发生了“删除”“取消点赞”或“取消收藏”等这类负向操作，对于推荐功能来说，它的信息就应该被遗忘多一些。'
