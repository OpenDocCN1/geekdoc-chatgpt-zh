  md: "tf.fill()方法。顾名思义，“fill”就是“填充”之意，其方法原型如下。\n\n```\ntf.fill(\n    dims, #维度信息\n\
    \    value, #填充的值\n    name=None #为本操作（Op）取名，非必须\n)\n```\n\n下面举例说明这个方法的用法。\n\n\
    ```\nIn [14]: tf.fill([2, 3], 123) #生成 2 行 3 列，且元素值全为 123 的张量\nOut[14]:\n<tf.Tensor:\
    \ id=71, shape=(2, 3), dtype=int32, numpy=\narray([[123, 123, 123],\n       [123,\
    \ 123, 123]], dtype=int32)>\n```\n\n# 4.4.4 生成已知分布的随机数张量\n\n正态分布（Normal Distribution，或称高斯分布）和均匀分布（Uniform\
    \ Distribution）是最常用的两种分布。创建这两种分布的张量，在构建神经网络模型时非常有用。例如，在卷积神经网络（CNN）中，将卷积核张量 _W_\
    \ 初始化为正态分布，这样非常有利于网络的训练。而在对抗生成网络（GAN）中，可以将隐藏变量 _Z_ 假设为均匀分布（或正态分布）。\n\n下面先来讨论一下正态分布张量的生成。tf.random.normal()是用来生成特定正态分布的方法，其原型如下。\n\
    \n```\ntf.random.normal(\n    shape, #输出张量尺寸\n    mean=0.0, #均值\n    stddev=1.0,\
    \ #方差\n    dtype=tf.dtypes.float32, #张量类型\n    seed=None, #随机数种子\n    name=None\
    \ #为本操作命名\n)\n```\n\n下面举例说明该方法的用法。\n\n```\nIn [15]: rand = tf.random.normal(shape\
    \ = (3,2), mean = 10, stddev = 2, dtype = tf.float32)\nIn [16]: print(rand)\n\
    Out[16]:\ntf.Tensor(\n[[ 7.56221 9.232725]\n [ 9.377619 12.007598]\n [ 7.042592\
    \ 9.011934]], shape=(3, 2), dtype=float32)\n```"
