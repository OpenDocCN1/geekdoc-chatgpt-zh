    # ## 5.5 本章小结


    在本章中，我们主要讲解了梯度的概念。所谓梯度就是函数值增长最为迅猛的方向，然后我们介绍了梯度递减法则，用以求得极小值，这个极小值是对损失函数而言的。


    接着，我们介绍了随机梯度速减法、批量梯度速减法及小批量梯度速减法。其中批量梯度速减法的网络参数调参策略是全部样例计算一次误差、调整一次参数，随机梯度速减法的网络参数调参策略是一样例、一误差、一调参。在工程实践中，两种策略都被广泛采用。但当样本数量较大时，随机梯度速减法更容易收敛。


    在本章中，我们还详细解释了反向传播（BP）算法。通过学习我们知道，BP 算法其实并不单纯是一个反向算法，而且是一个双向算法。也就是说，它其实分两步走：① 正向传播信号，输出分类信息；②
    计算误差，反向传播误差，调整网络权值。若没有达到预期目的，则迭代重复执行步骤①和步骤②。然后，在实战部分，我们详细讲解了构建 BP 算法的每个环节，让读者对神经网络学习有一个感性认识。


    BP 算法具有很多优点，但我们也要看到 BP 算法的不足。例如，BP 算法存在梯度弥散现象，其根源在于，对于非凸函数，梯度一旦消失，就没有指导意义了，导致它可能限于局部最优。而且梯度弥散现象会随着网络层数增加而愈发严重，也就是说，随着梯度的逐层减小，导致
    BP 算法对网络权值的调整作用也越来越小，故 BP 算法多用于浅层网络结构（通常小于或等于 7 层的网络），这就限制了 BP 算法的数据表征能力，从而也就限制了
    BP 的性能上限。


    客观来讲，本章的几个范例实现都偏向于底层，例如，我们还需要显式地求解损失函数的梯度，更新权值，这并没有充分利用 TensorFlow 的框架优势，在下一章，我们将利用
    TensorFlow 的 Keras 模块来迅速搭建并训练神经网络模型，从而体会深度学习框架的魅力。


