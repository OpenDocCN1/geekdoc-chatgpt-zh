    在传统的机器学习任务中，性能的好坏很大程度上取决于特征工程。工程师能成功提取有用的特征，其前提条件通常是，要在特定领域摸爬滚打多年，对领域知识有非常深入的理解。举例来说，对于一条海葵鱼的识别，需要经过“边界”“纹理”“颜色”等特征的抽取，然后再经过“分割”和“部件”组合，最后构建出一个分类器，如图
