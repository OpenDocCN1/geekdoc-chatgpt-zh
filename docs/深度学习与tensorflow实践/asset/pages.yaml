  img_proc: true
- pgno: 52
  md: "L(y, \\hat{y}) = L(y, f(X))\n\n为了方便起见，损失函数的值为非负数。\n\n通常，损失函数是针对一个样本实例而言的。但神经网络的训练通常是一批又一批（Batch）的样本批量训练，这时的损失函数有一个类似名称，即代价函数（Cost\
    \ Function），表示为\n\nJ = \\sum_{i=1}^N f(y_i, \\hat{y_i})\n\n其中，N 为一批参与训练的样本数量。\n\
    \n此外，目标函数（Objective Function）是一个更通用的术语，表示任意希望被优化的函数，用于机器学习领域和非机器学习领域（如运筹优化）。目标函数可以是损失函数或代价函数，为了提高模型的泛化性能，还可以添加部分正则化（Regularization）优化策略。\n\
    \n下面我们列出神经网络常用的 3 种代价函数。\n\n+   (1) 平均绝对误差（Mean Absolute Error，MAE）代价函数，也称为 L1\
    \ Loss，即\n\nJ_{MAE} = \\frac{1}{N} \\sum_{i=1}^N |y_i - \\hat{y_i}|\n\n+   (2)\
    \ 均方差（Mean Squared Error，MSE）代价函数，也称为 L2 Loss，即\n\nJ_{MSE} = \\frac{1}{N} \\sum_{i=1}^N\
    \ (y_i - \\hat{y_i})^2\n\nMAE 和 MSE 的主要区别在于，MSE 损失相比 MAE 损失通常可以更快地收敛，但 MAE 损失对于孤立点（Outlier）更加健壮，即更不易受到孤立点的影响。这是因为\
    \ MSE 的平方项，放大了孤立点带来的差异。\n\n+   (3) 交叉熵代价（Cross Entropy Loss，CE）函数，即\n\nJ_{CE}\
    \ = - \\sum_{i=1}^N y_i^c \\log \\hat{y_i}^c\n\n其中，$c_i$ 是样本 $x_i$ 的目标类。通常这个应用于多分类的交叉熵代价函数也被称为\
    \ Softmax Loss。若从不确定性上考虑，则交叉熵表示的是在给定的真实分布下，使用非真实分布所指定的策略来消除系统的不确定性所需要付出的努力大小。\n\
    \n> 正则化是为了防止过拟合，也就是说让模型在训练集合和测试集合中都表现得较好，即提高模型的泛化能力。\n\n> 注意，这里的 “Error”，不要理解为\
    \ “错误”，而应该将其当成神经网络参数调整的 “信息差”，类似于水力发电的 “水流落差”。 没有这个差值，网络调参就无从谈起。\n> \n> 一个好的代价函数需要相对准确地描述这种\
    \ “信息差”。"
