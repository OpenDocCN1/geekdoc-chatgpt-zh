  md: '# 7.10.1 LeNet-5


    如前所述，杨立昆提出的 LeNet 是最早应用于数字识别的卷积神经网络[5]。它在推进深度学习的发展上功不可没，LeNet-5 是它的第 5 个演化版本。LeNet-5
    共有 7 层（不包括输入层），每层都包含不同数量的训练参数。各层的结构如图 7-25 所示。


    ![](img/aa01495b859013c80481c58ec0894987_250_0.png)


    图 7-25 LeNet 的各层结构（图片来源：参考资料[5]）


    在 LeNet-5 中，主要有卷积层（Convolutions）、亚采样层（Subsampling，池化层）和全连接层（Full connection）3
    种连接方式。当前的卷积神经网络标配结构一般是：卷积 – ReLu 激活 – 池化，而在 LeNet-5 中的流程稍有不同，它采用“卷积 – 亚采样 – 激活”的结构。这里的“亚采样”其实就是现在所呼的“池化”。


    LeNet-5 极大地启发了现代 CNN 结构的设计。但需要注意的是，LeNet-5 中的亚采样并不是现代卷积神经网络结构中常用的最大池化，而是平均池化，其效果是“4→1”，即前层
    4 个神经元通过平均池化，变成 1 个数，神经元数量变少了，这个与最大池化的理念有相似之处。此外，LeNet-5 在激活层中的函数是 Sigmoid 函数，而当前的卷积神经网络结构中大多采用
    ReLU 函数。在网络的最后，当下流行卷积神经网络和 LeNet-5 是相同的，都使用全连接层来辅助完成分类任务。


    # 7.10.2 AlexNet


    在 AlexNet 出现之前，神经网络沉寂良久。终于，在 2012 年出现了转机，Hinton 和他的博士生 Alex Krizhevsky 等人提出了 AlexNet，并一举拿下当时
    ImageNet 比赛的冠军。相比于前一年的冠军，Top-5 的错误率一下子下降了 10 个百分点（达到 16.4%），而且远远超过当年的第二名（错误率为
    26.2%），可见其功力非同一般，从而也确立了深度学习（确切地说是深度卷积神经网络）在计算机视觉领域中的统治地位。


    AlexNet 不仅继承了 LeNet 的优点，还应用到更复杂的网络中，并发'
