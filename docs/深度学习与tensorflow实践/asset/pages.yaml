- pgno: 284
  md: '这就是“天下没有免费的午餐”的生动演绎。根据没有免费午餐定理（No Free Lunch Theorem，NFL），没有哪个算法比其他算法在各种场景下都高效，此处性能好，不过是彼处付出了代价罢了，就看代价相比性能值得不值得。


    因此，我们只能在特定任务上设计性能良好的机器学习算法。南京大学周志华教授认为，NFL 定理最重要的寓意在于，让我们清楚地认识到，脱离具体问题空谈“什么学习算法更好”是毫无意义的[9]。


    在水平方向上观察图 8-13，简易 RNN 神经元也相对简单，只有隐含状态在“水平（时间序列展开）”方向网络内部流动。而 LSTM 版本的神经元在水平方向有两类信息在流动。除
    RNN 固有的隐含状态（用 s 标记）传递，还在水平方向新增加一个记忆单元状态（Cell State，用 c 标记），也称记忆块（Memory Block），如图
    8-14 所示。我们可以随性地认为，正是因为 LSTM 多用了一份“心”（多一个内部状态），所以才“记得”更长久。


    > 图片绘制参考了 Christopher Olah 在 GitHub 有关 LSTM 理解的博客。


    需要特别说明的是，图 8-14 表面上多了一个水平方向的输出，实际上那不过是在时间维度上的展开，而更本质的描述是，LSTM 比原始 RNN 神经元多了一个自循环（读者可参考图
    8-4 以获得更多理解）。


    ![](img/aa01495b859013c80481c58ec0894987_284_0.png)


    那么如何有效控制这个记忆状态 c 为我所用呢？这是 LSTM 的关键所在。这个记忆单元状态就如同传送带一般，将前一个时间步的信息传递到下一个时间步，但所不同的是，这个信息传送带有所取舍，在合适的时候，既“拿得起（记住某些信息”，又“放得下”（忘记某些信息），而且它还能对某些信息“充耳不闻”（并非毫无保留地接纳信息），同时还可以对某些信息“谨言慎行”（很多信息放在心中，并不是全部输出）。


    这种对信息的处理态度，非常像人类的思维，而这种把控信息的机制，胡伯将其称为门（Gate）。根据不同的具体功能，可命名为“xxx（功能名称）+门”，如遗忘门、输出门和输入门等。为了便于读者理解，我们将图
    8-14 中的 LSTM 神经元重新进行绘制，得到复合神经元，控制记忆单元状态 c 的 4 个门如图 8-15 所示。这里，LSTM 的设计思路是，设计几个控制门开关，从而打造一个可控记忆神经元。'
