    图 7-28 VGG16 与 VGG19 拓扑结构的对比 (图片来源: 参考资料[13])


    VGGNet 有两个版本：VGG16 和 VGG19。二者的差别在于模型的深度不一样，如图 7-27 所示，VGG19 有 19 层（图 7-28 中的第
    E 列），而 VGG16 有 16 层（图 7-28 中的第 D 列），VGG19 多出的三层都是卷积层。


    显然，VGG16 比 VGG19 更轻量化，虽然 VGG19 的性能表现稍好于 VGG16，但模型参数会增加很多，所以性价比并不高。于是 VGGNet 的研究团队适可而止，就把该模型的网络层数“定格”在
    VGG19，不再继续增加更多层数了。下面我们简单介绍 VGGNet 的优点。


    # (1) 结构简单


    VGGNet 由 5 组卷积层（VGG16 与 VGG19 的每组卷积层的个数不同）、3 层全连接层、Softmax 输出层构成，层与层之间使用 Max-Pool（最大化池）分开，所有隐含层的激活函数都采用
    ReLU 函数。


    # (2) 小卷积核和多卷积子层


    小卷积核是 VGGNet 的一个重要特点。虽然 VGGNet 依然借鉴了 AlexNet 的网络结构，但并没有采用 AlexNet 网络中比较大的卷积核尺寸（如
    7×7），而是使用多个较小卷积核（3×3）的卷积层。


    VGGNet 的研究者认为，两个 3×3 的卷积堆叠获得的感受域大小相当一个 5×5 的卷积；而 3 个 3×3 的卷积堆叠获得的感受域大小相当于一个 7×7
    的卷积。


    小而多的卷积层，一方面可以减少网络参数，另一方面，更多的卷积层相当于进行了更多次的非线性映射，从而提高网络的数据拟合（表达）能力。


    # 7.11 实战：基于卷积神经网络的手写数字识别


    在学习了必要理论知识之后，下面我们进入实战环节，来验证所学的理论部分。不同于第 6 章直接利用单层神经网络实现 MNIST 分类（准确率仅为 92%），本节我们利用卷积神经网络来实现相同的任务。利用更高阶的模型，我们期待
    MNIST 分类准确率会更高。案例参考了 TensorFlow 提供的官方案例和其他网络资源的示范代码，为了便于读者理解，我们将较大的范例拆解为几个独立的代码段，逐步讲解。'
