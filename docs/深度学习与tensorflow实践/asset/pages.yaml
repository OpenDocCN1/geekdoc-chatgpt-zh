  md: "```\nOut[5]: 218\n```\n\n那么这些单词是如何编码为数字的呢？我们可以通过查看它的编码表来获得编码方案，代码如下。\n\n```\n\
    word_index = datasets.imdb.get_word_index()\nDownloading data from https://storage.googleapis.com/\
    \ tensorflow/tf-keras-datasets/imdb_word_index.json\n1646592/1641221 [===============================================]\
    \ - 1s 1us/step\n```\n\n从输出可以看到，我们将获得一个名为 imdb_word_index.json 的文档。JSON 是一种常用的用于数据交换的有特定格式文档。\n\
    \n有了这个文档，我们就可以像查字典一般，罗列出单词和其编码之间的对应关系。\n\n```\nIn [6]:\nfor word, code in word_index.items():\n\
    \    print(word, code)\nOut [6]:\nfawn 34701\ntsukino 52006\nnunnery 52007\n...(省略大部分输出)\n\
    ```\n\n为了操作方便，在编码/解码时，还需预留 4 个特殊的 ID，它们表示填充标志、起始标志、未知单词标志和未用标志。由于编码表的键（key）为单词，值（value）为\
    \ ID，因此为了构建翻转编码字典，通常先把前 4 个编号保留，分配给这 4 个特殊的标志位，代码如下所示。\n\n```\nIn [7]:\n#利用字典推导式构建单词与\
    \ ID 之间的对应表\nword_index = {word : (code + 3) for word, code in word_index. items()}\n\
    word_index[\"<PAD>\"] = 0 #填充标志\nword_index[\"<START>\"] = 1 #起始标志\nword_index[\"\
    <UNK>\"] = 2 #未知单词标志\nword_index[\"<UNUSED>\"] = 3 #预留，以备后用\n# 利用列表推导式构建 ID 与单词之间的翻转编码表\n\
    reverse_word_index = dict([(value, key) for (key, value) in word_index.items()])\n\
    ```\n\n有了翻转编码表 reverse_word_index，我们就可以很容易设计一个函数，将 Out[3]处的数字 ID 转换为字符串，代码如下。\n\
    \n```\nIn [8]:\ndef decode_review(text):\n    return ' '.join([reverse_word_index.get(i,\
    \ '?') for i in text])\n```"
