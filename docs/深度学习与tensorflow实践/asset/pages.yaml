- pgno: 134
  md: "“约减”表示将一批数据按照某种操作（ Op ）将众多数据合并到一个或几个数据之内。约减之后，数据的个数在总量上是减少的。这里“约减”的“减”，主要含义是元素数量的减少，而非“减法”，最常见的结果是约减到一个数据。\n\
    \n那么问题来了，关于张量进行约减，例如，对于二维张量[[1 1 1], [1 1 1]]进行“求和”约减，这个约减该从何约起呢？是从水平方向约减为[[3],\
    \ [3]]，还是从垂直方向约减为[2 2 2]，亦或从两个方向先后约减为[6]？的确，对于多维张量而言，约减的轴方向是一个需要明确的问题。\n\n在 TensorFlow\
    \ 中，提供了很多关于约减的方法，它们都是数学运算的一种，因此在 TensorFlow 2 中，被统一放置在 tf.math 模块，如 tf.math.reduce_sum()（\
    \ 求 和 ）、tf.math.reduce_mean()（ 求 均 值 ）、tf.math.reduce_max()（ 求 最大值 ）、tf.math.reduce_min()（\
    \ 求 最小值 ）等方法，它们的约减原理都是一样的，即从一大批数据中，不断减少数据量，直到找到满足要求（如求和、均值、最大值、最小值等）的数据。\n\n下面我们就用比较常用的\
    \ tf.reduce_sum()来说明张量的约减方向。tf.reduce_sum()的功能就是对张量中的所有元素进行求和，该方法原型如下所示。\n\n```\n\
    ```\ntf.math.reduce_sum(\n    input_tensor,\n    axis=None,\n    keepdims=False,\n\
    \    name=None\n)\n```\n```\n\n在 reduce_sum()方法的众多参数中，只有第一个参数 input_tensor 是必需的，而且要求该参数是数值类型。对张量（多维数组）而言，约减具有方向性。所以它的第二个参数\
    \ axis，决定了约减的轴方向。\n\n![](img/aa01495b859013c80481c58ec0894987_134_0.png)\n\n若\
    \ axis 的值为 0，则可以简单理解为从垂直（列）方向进行约减；若 axis 的值为 1，则可以简单\n\n图 4-7 张量的约减方向"
