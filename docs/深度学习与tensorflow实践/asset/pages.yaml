- pgno: 200
  md: "其中，evidence$_i$ 表示第 $i$ 类的证据；$x_j$ 表示图片中第 $j$ 个像素值；$W_{i,j}$ 表示第 $j$ 个像素值与第\
    \ $i$ 个分类之间连接的权值；$b_i$ 表示成为第 $i$ 个分类的偏置（bias）。事实上，偏置也可以视为一种特殊的权值，可通过学习得到。\n\n\
    在计算完每个数字的证据分值后，接下来，要将这些分值转化为 Softmax 函数值，即\n\n```\n$y_i = \\text{Softmax}(\\text{evidence}_i)\
    \ \\\\ = \\text{normalize}(\\exp(x_i)) \\\\ ( \\text{6-3} )$\n```\n\n如前描述，每个 Softmax\
    \ 函数值实际上都是一个指数函数（exp），它的功能相当于一个激活函数或连接函数，它把原来线性函数的输出转换成我们想要的模式，即 10 个分类的分布概率。\n\
    \n![](img/aa01495b859013c80481c58ec0894987_200_0.png)\n\n图 6-8 Softmax 回归的可视化流程\
    \ (图片来源：TensorFlow 官网)\n\n为了计算这个概率，还需要对这些 exp 值进行标准化处理，具体过程见式（ 6-1 ）。这个 Softmax\
    \ 回归的可视化流程如图 6-8 所示。其中，[$x_1,x_2,x_3$] 是输入向量（在 MNIST 项目中，就是被展平成一维张量的像素值），[$y_1,y_2,y_3$]\
    \ 是输出向量，各个向量元素分别是多分类概率，如[0.95, 0.04, 0.0]。\n\n> 向量化程序可以在一条指令中进行多个操作，而标量只能同时对一对操作数进行操作（如\
