  md: '在这样的区域中，很多点方向的梯度值都几乎趋近于 0（这些点称为鞍点），这使得以梯度递减为向导的权值更新策略，毫无前进的方向感。


    结合上述挑战，很多研究人员给出了很多改进策略，我们会在后续章节继续讨论。


    # 5.3 BP 算法


    回顾神经网络的发展史就会发现 BP ( Back Propagation, 反向传播) 算法占据了举足轻重的地位，即使到现在，它依然是很多优化算法的基础。下面我们介绍
    BP 算法的发展历程和思想。


    # 5.3.1 BP 算法的发展历程


    > 2019 年，杰弗里·辛顿获得“本田奖”，用于表彰其对科技做出的重大贡献。这引起了 LSTM 发明人施密德胡伯（Schmidhuber）的不满，他寻征博引，用近百篇参考资料证明
    BP 算法不是杰弗里·辛顿的原创。


    人们在提及 BP 算法时，常将它与杰弗里·辛顿（Geoffrey Hinton）的名字联系在一起。但严格来说，提出 BP 算法的第一人并非杰弗里·辛顿，而是保罗·沃伯斯（Paul
    Werbos）。


    1974 年，保罗·沃伯斯在哈佛大学取得博士学位。在他的博士论文中[2]，首次提出了通过误差的反向传播来训练人工神经网络。在当时，人工神经网络面临一个重大的挑战性问题：增加神经网络的层数，虽然可以让网络具有更强的表征能力，但随之而来的是，多层网络带来了数量庞大的、有待训练网络参数。训练这些海量参数需要大量计算资源，这成为制约多层神经网络发展的关键瓶颈之一。


    保罗·沃伯斯的研究工作为多层神经网络的学习、训练与实现，提供了一种切实可行的解决途径。但当时保罗·沃伯斯的工作并没有得到足够的重视，因为当时的神经网络研究正处于低潮，可谓是“生不逢时”。


    我们知道，发明是从 0 到 N 的全过程。从 0 到 1，从无到有，提出某个想法，发明某个物件，固然了不起，但是能走到 N 的人才是英雄。这就如同在马拉松比赛的起点挤满了人，到终点的人却寥寥无几一样。在科技史上，常有同一项技术或方法被不同科学家同步发现的例子，最后成就到底属于谁，就要看谁的发现对社会的贡献大，而不是看谁提出的早。


    1986 年 10 月，杰弗里·辛顿还在卡耐基·梅隆大学任职。他和在加州大学圣迭戈分校的认知心理学家大卫·鲁梅尔哈特等人，在著名学术期刊《自然》上联合发表了题为“借助反向传播算法的学习表征（Learning
    Representations by Back-propagating Errors）”的论文[3]。该论文首次系统、简捷地阐述了 BP 算法在神经网络模型中的应用。BP
    算法将调整网络权值'
