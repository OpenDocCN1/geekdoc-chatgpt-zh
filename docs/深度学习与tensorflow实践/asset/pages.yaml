    # 7.5.5 权值共享


    卷积层涉及的另外一个核心概念是权值共享（Shared Weights）。那么为什么要实现权值共享机制呢？其实也是无奈之举。前文我们提到，通过局部连接处理后，神经元之间的连接个数已经有所减少。但如果卷积核比较多，那么整体上的下降幅度并不大，还是无法满足高效训练的需求。而权值共享就是来解决这个问题的。该如何理解权值共享呢？


    我们可以将每个卷积核都当成一种特征提取方式，这种方式与图像的位置无关。这里隐含的假设是：图像的统计特性与其他部分的统计特性是一样的。


    这就意味着，我们把同一个卷积核的所有神经元用相同的权值与输入层神经元相连，如图 7-20 所示。


    在图 7-20 中，假设输入层是一维的，且神经元有 7 个，x=[x1, x2, x3, x4, x5, x6, x7]=[0, 1, 2, -1, 1,
    -3, 0]。隐含层的神经元有 3 个，h=[h1, h2, h3]，权值向量为 w=[w1, w2, w3]=[1, 0, -1]。这个权值向量用于计算隐含层的
