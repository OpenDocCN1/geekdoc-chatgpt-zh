  md: '求损失函数的最小值，不可避免地需要计算损失函数对每个权值参数的偏导数，这时前文提到的梯度递减方法就派上用场了。


    利用随机梯度递减法求解极小值（谷底）的做法是，我们先随机站在山谷上的某一点，然后发现哪边比较低（陡）就往哪边走，通过多次迭代找到最低点。利用梯度递减更新网络权值如图
    5-5 所示。


    图 5-5 中的参数 \(\eta\) 就是学习率，它决定了梯度递减搜索的步长，这个步长过犹不及。若该值太小，则收敛慢；若该值太大，则容易越过极值，导致网络震荡，难以收敛。所以，通常要根据不同的状况来调整
    \(\eta\) 的大小。


    在图 5-6 中，假设最小值点为 D，当 \(w_i\) 落在最小值的右边时，斜率 \(\Delta = \frac{\partial E}{\partial
    w_i}\) 为正，将其代入如图 5-5 所示的公式中，就会减小 \(w_i\) 的值；反之，若 \(w_i\) 比取得最小值 \(E_{min}\) 的
    \(w\) 还小，则斜率是负的，代入如图 5-5 所示的迭代公式中，就会增大 \(w_i\) 的值。由于曲线越接近谷底越平缓，因此当 \(w_i\) 靠近最低点时，每次移动的距离也会越来越小，最终将在最低点处收敛。


    ![](img/aa01495b859013c80481c58ec0894987_159_0.png)


    图 5-5 利用梯度递减更新网络权值


    ![](img/aa01495b859013c80481c58ec0894987_159_1.png)


    图 5-6 正负梯度示意


    需要说明的是，负梯度方向并不一定指向最小值，但沿着它所在的方向，能够最大限度地朝向最小值。负梯度的每一项告诉我们以下两件事。


    +   - 正负号：输入向量的每一项是增大的还是减小的。

    +   - 值大小：告诉我们哪个值影响最大，即改变哪些参数性价比会更高。


    梯度减法目前主要分为三种：批量梯度递减法（Batch Gradient Descent，BGD）、随机梯度递减法（Stochastic Gradient Descent，SGD）及小批量梯度递减法（Mini-Batch
    Gradient Descent，MGD）。它们之间'
