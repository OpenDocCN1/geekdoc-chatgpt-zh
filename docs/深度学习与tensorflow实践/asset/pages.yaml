    many-to-many 有两种结构，第一种属于异步结构，也就是输出相对于输入如 “流水线排空期”。就如经典的 Encoder-Decoder（编码-解码）框架，它的特点就是将不定长的输入序列，通过编码器的加工后，获得新的内部表示，然后再基于这个表示进行解码，生成新的不定长的序列并输出。这两个
    “不定长” 可以不相同。


