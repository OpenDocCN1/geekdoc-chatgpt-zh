    图 8-19 LSTM 隐含层单元的完整逻辑设计


    # 8.7.6 LSTM 的部件功能


    现在我们来总结一下 LSTM 单元中各个部件的功能。图 8-19 中的众多细节看起来比较烦琐，可能妨碍了我们对 LSTM 的认知，因此避繁就简，我们虚化了其内部细节，让我们把目光聚焦在如图
    8-20 所示的上方水平线部分，它才是 LSTM 的核心所在。从图 8-20 可以看出，LSTM 中的记忆单元状态从 C_{t-1} 到 C_t，就像一条传送带一样，它让信息向量从记忆单元中流过，只不过做了一些必要的线性转换而已。


    在线性转换过程中，包括乘法（ \(\otimes\) ）和加法（ \(\oplus\) ）操作。LSTM 的记忆单元将乘法和加法赋予不同的角色。其中，加法就是
    LSTM 的 “秘密” 所在。


    ![](img/aa01495b859013c80481c58ec0894987_288_1.png)


    图 8-20 LSTM 核心要素


    加法看起来非常简单，但这个基本的操作能够帮助 LSTM 在必须进行深度反向传播时，维持恒定的误差（或者说保留了信号）。而这个误差信号正是调参的向导，也就是说，正是有了这个加法操作，才可以避免梯度弥散问题。而我们前面诉病传统
    RNN 的问题，不正是 BPTT 存在严重的梯度弥散问题吗？


    LSTM 记忆单元中的乘法设计也非常重要。乘法操作的前端输入采用了 Sigmoid 激活函数。如前所言，Sigmoid 输出的元素值是一个[0,1]区间内的实数，表示信息留存的权值（或者说比例）。例如，0
    表示 “不让任何信息通过”，而 1 表示 “让所有信息通过”，中间值表示让部分信息通过。'
