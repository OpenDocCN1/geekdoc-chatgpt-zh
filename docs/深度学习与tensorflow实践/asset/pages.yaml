    的强大挑战。


    相比而言，Tensorflow 延生相对长久，生态更趋完善，又有 Google 做


    > 计算流图好比是一个计算的思路，并没有实施真正的计算，等到特定时刻，利用 run 方法显式运行这个计算图时，各项操作才开始真正实施，故称“惰性”计算。'
