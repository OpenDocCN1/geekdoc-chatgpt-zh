    与范例 6-3 共享的代码（第 01~16 行），这里不再赘述。随后的代码，我们做简单介绍。第 18 行完成模型优化器的设置，第 20 行设置模型的性能评估指标。


    在 22~40 行完成的是基于 SGD（随机梯度下降）的模型训练任务。从第 22 行可以看出，元组(x,y)是取自于第 08 行完成的数据切片，因此这是一个“32
    样本，一迭代”的训练模式。


    在搭建这个两层神经网络的模型后，给定一个批次的输入数据 x，调用 model(x)得到模型输出（ out ）后（第 25 行），out 是一个包含 10 个概率值的向量。第
    27 行把预期值修改为深度为 10 的独热编码，这种变换是为了和 out 向量的维度相匹配。然后通过 MSE 损失函数计算当前的误差 loss（第 30 行）。由于一个批次的样本有
    32 个，第 31 行求得这 32 个样本的平均误差。


    若获得神经网络的误差，则可以再利用 TensorFlow 提供的自动求导函数 tape.gradient(loss, model.trainable_variables)求出模型中所有参数的梯度信息（第
    34 行，关于如何利用 TensorFlow 的自动求解梯度的方法，我们已经在第 5 章介绍过）。然后，我们遵循着梯度递减这个权值更新优化算法来更新网络权值（第
    18 行设置优化器，并在第 35 行的 for 循环中利用它）。


    模型搭建完毕后，通常还需要判断模型性能的好坏。对于分类任务，最简单也最常用的模型性能，莫过于分类准确率。在 TensorFlow 中，tf.keras 提供
    metrics 模块，该模块包含了常用的模型评估指标，metric 本身是有状态的，一般是通过创建变量（Variable）来记录和更新它。


    在第 01 行中，我们导入了该模块。在第 20 行中，我们创建了求解精确度（ accuracy ）的性能对象 acc_meter。第 33 行，通过 update_state()来更新这个获取精确度的状态，result()方法是为了获得当前状态（第
    39 行），而在第 40 行，通过 reset_states()方法重置初值。


    在第 33 行中，利用了 update_state()方法来求解精确率，该方法需要两个参数：一个参数是预测的标签分类；另一个参数是真正的标签分类信息。通过比较二者的差异来获取预测的准确率。'
