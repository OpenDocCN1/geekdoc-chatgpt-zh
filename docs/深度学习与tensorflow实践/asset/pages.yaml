- pgno: 138
  md: '但需要说明的是，并不是所有张量都能通过广播达到彼此尺寸上的适配。通过观察，我们可以得到 TensorFlow 的广播规则如下。


    +   (1) 扩展维度。若两个张量的尺寸不同，则尺寸较小的张量会添加若干个轴（称为广播轴），使其 ndim（维度信息）与尺寸较大的张量相同。


    +   (2) 复制数据。尺寸较小的张量沿着新添加的轴不断复制之前的元素，直至其尺寸与尺寸较大的张量相同。


    +   (3) 低维有“1”。若两个张量的尺寸在任何维度上都不匹配，则将该维度中尺寸为 1 的张量拉伸，以匹配另一个尺寸较大的张量。


    需要注意的是，若两个数组在任何维度中大小都不一致，且两者均没有任何一个维度为 1，则广播会出现错误，即不会发生广播行为。也就是说，为了让广播行为能够顺利进行，拟操作的广播张量的某个维度上的尺寸，要么相等，要么为
    1。


    # 4.10 张量在神经网络中的典型应用


    如前所述，TensorFlow 是一个面向深度神经网络的计算框架。在前面章节中，我们介绍了张量的相关属性和创建方法，但理论并没有联系实际，过多的语法铺垫让读者难以有感性的认识。或许读者会有这样的疑问，这些不同维度的张量，到底在神经网络学习中扮演什么角色呢？


    下面我们就来讨论这个议题，以便让读者在看到每种不同类型的张量时，可以直观地联想到它在深度学习中的物理意义和主要用途，从而加深对代码的理解并且为构造新的深度学习模型打下基础[2]。


    # 4.10.1 标量


    在 TensorFlow 中，标量很容易理解，它就是单个数字，维度数为 0，shape 为空 [ ]，是最简单的张量形式。但它与 Python 中的普通单个数字还是有所不同。即使只有一个数值，它也具备张量的所有属性和方法。


    标量在神经网络中，可以表示各种误差、算法的性能指标。如准确率（Accuracy，Acc）、查准率（Precision）和查全率（Recall，也称召回率）等。下面举例说明。


    ```

    In [1]: import tensorflow as tf

    In [2]: acc = tf.keras.metrics.Accuracy()      #定义一个求准确率的对象 acc

    ```


    如前所述，TensorFlow 2 已经与 Keras 进行了深度的融合。求准确率'
