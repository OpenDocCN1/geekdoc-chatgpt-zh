    在图 1-6 中，既然我们把深度学习与传统的监督学习和无监督学习单列出来，自然是有一定道理的。这是因为，深度学习是高度数据依赖型的算法。它的性能通常是随着数据量的增加而不断增强的，也就是说，它的可扩展性（Scalability）显著优于传统的机器学习算法（见图
