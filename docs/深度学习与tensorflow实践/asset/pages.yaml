  md: '对字符编码时，采用的不是真实概率 \( p_i \) ，而采用的是其他估算的概率 \( q_i \) 来近似 \( p_i \) 。现在的问题是，如果用概率分布
    \( p_i \) 近似概率 \( q_i \) ，那么该如何评价这个“近似”的好与坏呢？这就要用到相对熵（Relative Entropy）的概念了。


    相对熵的理论基础是 KL 散度（Kullback-Leibler Divergence），也称为 KL 距离，它可以衡量两个随机分布之间的距离，记为 \(
    D_{KL}(p||q) \)，即


    ```

    D_{KL}(p||q) = \sum_{x \in X} p(x) \log \frac{p(x)}{q(x)}

    = \sum_{x \in X} p(x) \log p(x) - \sum_{x \in X} p(x) \log q(x)

    = -H(p) - \sum_{x \in X} p(x) \log q(x) \quad (6-6)

    ```


    参考式（6-5）可知，式（6-6）的第一部分就是 \( p \) 的负熵，记作 \( -H(p) \)。


    假设 \( p \) 和 \( q \) 代表两种不同的分布，它们在给定样本集合中的交叉熵（Cross Entropy，CE）可描述为式（6-7），即式（6-6）的第
    2 部分。


    ```

    CE(p, q) = - \sum_{x \in X} p(x) \log q(x) \quad (6-7)

    ```


    这里的“交叉”之意，主要用于描述这是两个事件之间的相互关系。通过对式（6-6）实施变形，很容易推导出交叉熵和相对熵之间的关系，即


    ```

    CE(p, q) = H(p) + D_{KL}(p||q) \quad (6-8)

    ```


    由式（6-8）可知，交叉熵和相对熵之间相差了一个熵 \( H(p) \)。若 \( p \) 已知，则 \( H(p) \) 是一个常数，此时交叉熵与 KL
    距离（相对熵）在意义上是等价的，它们都反映了分布 \( p \) 和 \( q \) 的相似程度。最小化交叉熵，实质上就等价于最小化 KL 距离，它们都在
    \( p=q \) 时，取得最小值 \( H(p) \)，因为此时 \( D_{KL}(p||q) = 0 \)。


    如果说信息熵是一种最优编码的体现，那么交叉熵的存在允许我们以另外一种“次优”的编码方案计算同一个字符串编码所需的平均最小位数。如前文描述，\(-\log q(x_i)\)
    表示编码的长度，下面还以字符串“HELLO”为例来说明这个“次优”编码方案。


    从前面的分析可知，若真实概率与预测概率相差很小，则交叉熵就会很小；反之，若二者相差较大，则交叉熵就较大。假设某个神经网络的输出值和预期值都是概率，交叉熵岂不是一个绝佳的损失函数？


    的确是这样。对于多分类问题，在 Softmax 函数的“加工”下，它的'
