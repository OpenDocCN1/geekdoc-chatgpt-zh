  md: '迭代次数增加多少次，都无法实现“异或（XOR）”功能的感知机，因为单层感知机表征能力非常有限。下面我们就讨论一下感知机的表征能力。


    # 2.2.9 感知机的表征能力


    从本质上看，感知机是一个二分类的线性判别模型，它旨在通过最小化损失函数来优化分类超平面，从而达到对新实例的准确预测。


    ![](img/aa01495b859013c80481c58ec0894987_44_0.png)


    由于感知机只有输出层神经元可以进行激活函数的处理，也就是说，它只拥有单层的功能神经元，因此它的学习能力是相对有限的。布尔代数中的基本操作，如“与”“或”“非”等，都是线性可分（Linearly
    Separable）的。感知机对于处理这类线性可分问题，并没有太大压力。


    人工智能泰斗之一马文·明斯基（M. Minsky）已在理论上证明，若两类模式是线性可分的，则一定存在一个线性超平面可以将它们区分开来，如图 2-11(a)
    ~ (c)所示。也就是说，这样的感知机，其学习过程一定会稳定（收敛）下来，因此神经网络的权值可以通过学习得到[3]。


    图 2-11 线性可分的“与”、“或”、“非”和线性不可分的“异或”


    但是，对于线性不可分原子布尔函数（如“异或”操作），不存在简单的线性超平面将其区分开来，如图 2-11(d)所示。在这种情况下，感知机的学习过程就会发生“振荡（Fluctuation）”，权值向量就难以求得合适的解。这里稍微为非专业读者解释一下，什么是“异或”？所谓“异或（XOR）”就是当且仅当输入值
    x1 和 x2 相异时，输出为 1；反之，只要 x1 与 x2 相同，输出就为 0，如图 2-12 所示。


    ![](img/aa01495b859013c80481c58ec0894987_44_1.png)


    图 2-12 “异或”操作的输入与输出之间的关系'
