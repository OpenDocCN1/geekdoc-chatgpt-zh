    该新功能允许用户使用非常自然的 Python 语法去编写一个 TensorFlow 数据流图。一旦这个函数将被编译成数据流图，就意味着，它可以获得更快执行，可以更好地在
    GPU 或 TPU 上运行，或将训练好的模型（Saved Model）导出，以备后续使用。再配合 Eager Execution（即时执行）的加持，就让深度学习模型的调试和运行变得更加行云流水、水到渠成了。


    # 3. 极简主义的用户程序接口（API）


    如果你有过 TensorFlow 1.x 的编程经验，就会感同身受，同一个功能，TensorFlow 可能有多种实现方法。例如，如果我们想搭建一个多层的神经网络，那么会有
    tf.slim、tf.layers、tf.contrib.layers 和 tf.keras 等众多选择。表面上看，选择多，就意味着灵活多变，但从另外一个方面来说，选择多，也意味着，麻烦多，特别对一个大项目的开发而言，这样的灵活性，可能会带来灾难性的混乱。你可以想象一下，在打游击战时，灵活多变，因地适宜，可能是获胜的关键。但为什么凡是上了规模的军队，都要强调队伍的整齐划一呢？这就是因为，局部灵活性带来的好处，在大规模战役中，远远没有高效指挥和集体部署带来的整体效能大。


    TensorFlow 2 一上来就对 API 进行了 “大扫除”，对很多传统的 API 做了 “关停并转”，简化和规整。例如，tf.app、tf.flags、和
    tf.logging 等方法，要么让它们消失，要么让它们合并为一。对很多 API 而言，如果是 Keras 能提供的，那么就直接使用 Keras 的简化版本。


    这样做的好处，自然就是代码看起来更加简捷。对于团队开发而言，彼此分享和交流也变得更加可行，因为大家用的都是一套 API，而不是像以前 “鸡同鸭讲”。


