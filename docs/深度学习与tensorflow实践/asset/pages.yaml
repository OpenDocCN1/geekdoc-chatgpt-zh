  md: '技术支撑，生产环境部署相对便捷，因此在工业界有着很好的口碑。但“居安思危，思则有备，有备而无后患”的思想，应是所有前沿技术公司的座右铭。TensorFlow
    欲长久立于不败之地，还必须海纳百川，兼容并蓄。TensorFlow 的确也是这么做的，在 TensorFlow 2.x 版本中的第一个重大改善，就是向 PyTorch
    学习动态计算图，并显著提升其简捷性和易用性，其主要升级方向包括以下 5 个方面。


    # 1. 利用 Keras 轻松构建模型


    作为深度学习框架，Keras 本身就以简捷、高效而著称。现在，TensorFlow 通过内部整合，tf.keras 已成为 TensorFlow 2 中构建与训练模型的高层
    API。Keras 还配合 TensorFlow，提供一系列标准的机器学习模型（如线性或 Logistics 回归、梯度增强和随机森林等），这些模型可被用户直接调用采纳（通过使用
    tf.estimator API 实现）。若不想从头开始训练一个模型就能调用 TensorFlow Hub 之中的模块，则可以将类似的模型通过迁移学习的方式来辅助训练。如此赋能用户，可让用户快速搭建属于自己的深度学习模型。


    # 2. 使用 Eager Execution 简化调试与运行


    TensorFlow 2 默认启用 Eager Execution（可简译为“即时执行”）模式，这样一来，就可让用户如同 Python 一样轻松调试与运行
    TensorFlow 代码。在 TensorFlow 1.x 时代，TensorFlow 有一个很大的用户“槽点”：任何一个计算操作，都必须首先规划好计算图（Computation
    Graph，即计算过程的抽象描述），然后再将训练数据传递给执行该计算的会话（Session，实际上是计算引擎），并实施计算。在训练模型期间，这个静态计算图的拓扑结构是固定不变的。


    这种基于静态图开发的 TensorFlow 程序，调试起来非常困难。例如，我们想验证 TensorFlow 中的某个张量信息，哪怕是一个简单的输出，也得“按部就班”地提前声明，静态地构建一个计算图，然后在会话中输出这个变量，该过程非常烦琐。这就好比，如果我们去参加一个很重要的活动，这时梳洗打扮、穿戴整齐，耗点时，费点力，倒无可厚非。可是如果你去拿个快递，跑趟卫生间，也必须这么一番打扮，“衣冠楚楚”之后，才能去做这些小事。那么好好的日子，也会被你过得“生无可恋”。


    深度学习著名学者 Yann LeCun 就曾不止一次批评说，TensorFlow 是“昔日黄花式的深度学习框架”。因此，支持类似于 PyTorch 的动态图功能，一直是
    TensorFlow 社区的呼声。“Eager Execution”就是对这一呼声的回应。


    “Eager Execution”是一个命令式、由运行定义的接口，一旦在 Python'
