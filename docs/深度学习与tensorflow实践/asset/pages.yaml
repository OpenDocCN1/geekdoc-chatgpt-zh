- pgno: 297
  md: '念，且每个概念仅被一个词描述，那么 LSA 将非常简单。


    但问题并没有这么简单，因为同一个词可能有多个意思（二义性），一个概念也有多种表达方式。为了简化问题，LSA 引入了一些重要的简化。例如，LSA 将文档看成“一堆词（Bags
    of Words）”的堆积。在这种策略下，词在文档中出现的位置并不重要，LSA 只是统计某个词出现的频率，这就是它被归属为计数类别的原因。而这些统计出来的频率会被转化为小而密集的矩阵。


    另一类是预测模型，如神经概率语言模型（Neural Probabilistic Model, NPM）。这类模型利用神经网络，根据某个词周围的词来推测这个词及其向量空间。相对于计数模型，预测模型通常有更多的超参数，因此预测模型的灵活性要强一些。


    相比于独热编码的离散编码，向量空间模型可以将词语转化成连续值，而且是意思相近的词，还会被映射到向量空间的相近位置。这样一来，词语之间的相似性（距离）就非常容易度量了。甚至我们可以发现，词嵌入向量（Embedding
    Vectors）具备类比特性。


    类比特性就是拥有类似于 “A=B=C=D” 这样的结构（见图 8-27），可以令词向量中存在一些特定的运算，如


    W("China") - W("Beijing") = W("America") - W("Wanshington")


    这个减法运算的含义是，北京之于中国，就好比华盛顿之于美国，它们都是所在国家的首都，这在语义上是容易理解的，但是通过数学运算表达出来，还是“别有一番风味”。


    ![](img/aa01495b859013c80481c58ec0894987_297_0.png)


    图 8-27 词嵌入向量的类比特性


    前面我们从词嵌入向量表示角度出发，讨论了主流的三种方法。下面我们再从自然语言处理的统计语言模型出发，谈论一下它的三个发展阶'
