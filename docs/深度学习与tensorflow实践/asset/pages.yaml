  md: '《荀子·劝学》中有句名言，“君子生非异也，善假于物也”。说的是，君子的资质与一般人没什么区别，之所以君子高常人一等，是因为他能善于利用外物。因此，善于利用已有条件，是君子成功的一个重要途径。这句话对从事深度学习工作的算法工程师而言，同样是适用的。


    在前面的章节中，通过对 sklearn 的初步使用，我们已经感受到，利用计算框架可以给我们带来更多开发的便捷和高效。对深度学习而言，TensorFlow 也是一个备受业界推崇的计算框架，值得我们掌握。


    # 3.1 TensorFlow 概述


    我们知道，在与计算机相关的很多领域（如大数据处理、分布式计算和智能搜索等）中，Google（谷歌）公司都有卓越的表现，为计算机世界贡献了很多划时代的产品。在人工智能领域，它的贡献依然可圈可点。2011
    年，Google 公司开发了它的第一代分布式机器学习系统 DistBelief[1]。著名计算机科学家杰夫·迪恩（Jeff Dean）和深度学习专家吴恩达（Andrew
    Y. Ng）都是这个项目的核心成员。


    通过迪恩等人设计的 DistBelief，Google 可利用数据中心数以万计的 CPU 核，并以此建立深度神经网络。借助 DistBelief，Google
    的语音识别准确率比之前提高了 25%。除此之外，DistBelief 在图像识别上也大显神威。


    很显然，DistBelief 已然具备一定程度的自学能力。当然，这套系统的计算开销亦不容小觑。它由 1000 台机器组成，共包括 16 000 个内核，训练的神经网络参数高达百亿级别。


    一开始，DistBelief 作为谷歌 X-实验室的“黑科技”也是闭源的，可能是 Google 想让开源社区来维护 DistBelief。现如今，开源社区之所以红红火火，就是因为，根据相关规则，使用开源代码的个人和机构，必须让自己在开源代码的基础上再开发代码，继续保持开源。这样一来就形成了“人人为我，我为人人”的发展态势，进而形成了群策群力力量大的格局。因此，在
    2015 年 11 月，Google 将 DistBelief 的升级版实现正式开源，其协议遵循 Apache 2.0。而这个升级版的 DistBelief
    也有了一个新的名称，它就是本章的主角——TensorFlow[2]，其图标如图 3-1 所示。


    为什么要取这么一个名字呢？这自然也是有讲究的。TensorFlow 的命


    ![](img/aa01495b859013c80481c58ec0894987_74_0.png)


    图 3-1 TensorFlow 的图标'
