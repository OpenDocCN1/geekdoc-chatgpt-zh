    1 和 2 的权值分别为 w3=-1 和 w4=1。于是，对于隐含层神经元 1 来说，其输出可以表述为


    f1 = sgn(w1x1 + w2x2 - θ)

    = sgn(1x1 + (-1)x1 - 0.5)

    = sgn(-0.5)

    = 0


    类似地，对于隐含层神经元 2 有


    f2 = sgn(w3x1 + w4x2 - θ)

    = sgn((-1)x1 + 1x1 - 0.5)

    = sgn(-0.5)

    = 0


    然后，对于输出层神经元 3，这时 f1 和 f2 均是它的输入，于是有


    y = f3 = sgn(f1w5 + f2w6 - θ)

    = sgn(0x1 + 0x1 - 0.5)

    = sgn(-0.5)

    = 0


    也就是说，x1 和 x2 同为 1 时，输出为 0，满足了“异或”的功能。读者朋友也可以尝试推导一下 x1 和 x2 同为 0 时的情况，这时输出也为 0，同样满足“异或”的功能。


    那么当 x1 和 x2 不相同（假设 x1=1，x2=0）时，对于隐含层神经元 1 有


    f1 = sgn(w1x1 + w2x2 - θ)

    = sgn(1x1 + (-1)x0 - 0.5)

    = sgn(0.5)

    = 1


    类似地，对于隐含层神经元 2 有


    f2 = sgn(w3x1 + w4x2 - θ)

    = sgn((-1)x1 + 1x0 - 0.5)

    = sgn(-1.5)

    = 0


