  md: '而梯度的反方向（梯度递减）自然就是函数值下降最快的方向。若函数每次都沿着梯度递减的方向前进，则就能到达函数的最小值附近。


    为了便于读者理解梯度递减的概念，我们先给出一个形象的案例来辅助说明。爬过山的人可能会有这样的体会，山坡越平缓（相当于斜率较小），抵达峰顶（函数峰值）的过程就越缓慢，而如果不考虑爬山的重力阻力（对于计算机而言不存在这样的阻力），山坡越陡峭（相当于斜率越大），顺着这样的山坡爬就能快速抵达峰顶（对于函数而言，就是快速收敛到极值点）。


    如果我们实施“乾坤大挪移”，把爬到峰顶变成探寻谷底（求极小值），这时与找最大斜率的爬山方法并没有本质变化，只不过是方向相反而已。如果把爬山过程中求某点的斜率最大的方向称为梯度，而探寻谷底的方法，就可以称为梯度递减，其示意图如图
    5-4 所示。


    ![](img/aa01495b859013c80481c58ec0894987_158_0.png)


    图 5-4 利用梯度递减求极小值示意图


    以梯度递减作为指导，一直沿着“最陡峭”的方向，探索着前进，类似于“摸着石头过河”，这个过程是“摸着梯度找极值”。


    如果说直接令损失函数 L 的导数等于 0 来求得最小值，是一种相对宏观的做法，那么梯度递减就是在微观的角度，根据当前的状况动态调整 w 的大小，通过多次迭代来求得最低点。


    当然，从图 5-4 中，我们也很容易看到梯度递减的问题，即很容易收敛到局部最小值。正如攀登高峰，我们总会感叹“一山还比一山高”，探寻谷底时，我们也可能发现，“一谷还比一谷低”。但“只身虽在此山中”，当前的眼界让我们像“蚂蚁寻路”一样，很难让人有全局观。尽管有这样的障碍，在工程实践中，还是衍生出很多出色的应用案例。


    基于梯度递减的优化策略，还有一个潜伏的陷阱，称为鞍点（Saddle Point）。简单来说，鞍点就是一种梯度（一阶导数）值为 0，但又不是局部极值点的那种驻点。此外，当函数很复杂且呈现扁平状时，由于梯度趋近零，因此学习可能陷入一个称为“学习高原”的区域，而毫无进展。


    通过前面的分析可知，在训练神经网络时，需要利用损失函数。为了'
