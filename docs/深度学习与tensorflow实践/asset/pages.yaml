    # 三、分割数据集合


    如前所述，通常我们至少要把整个数据集合分割为两部分：训练集合和测试集合。训练集合用于训练，测试集合用于测试。为了保证数据分割的随机性和专业性，sklearn
    提供了专门的函数 train_test_split()。


    在前面，为了回顾 Pandas 的使用，我们利用 Pandas 将数据集合中的 data（特征数据）和 target（标签数据）合二为一。这是因为，除 sklearn
    外，数据集合的特征数据和标签数据通常是存在一个文件中的，这是一种更普遍的状态。


    为了处理方便，train_test_split()要求特征数据和标签数据必须是分开的。那么怎样把一个原本完整的数据分开呢？若使用 Pandas 对数据进行处理，则通过
    drop()方法实现。


    ```

    In [15]:

    01 # 将名为 wine_class 的列删除，剩余部分（特征）赋值给 x

    02 X = df_wine.drop(''wine_class'', axis = 1)

    03 # 将名为 wine_class 的列赋值给 y

    04 y = df_wine [''wine_class'']

    ```


    在上述代码中，第 01 行的 drop()函数“指名道姓”地删除名为 wine_class 的数据，为了准确起见，还指定了删除数据所处的坐标轴（axis），其值为
    1，表示删除 wine_class 所在列。


    另外，在 sklearn 中，我们还常有不成文的约定：通常用大写的 X 表示特征向量（这里共有 13 个），而用小写的 y 表示预测的目标值（这里有 1 个）。如果仅操作
    sklearn 自带的数据集，那么上述代码可简写为如下方式。'
