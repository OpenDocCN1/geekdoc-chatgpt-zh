- pgno: 312
  md: '190.68s。实验发现，GRU 在性能（分类准确率）近似的情况下，相比 LSTM 耗时较少，符合实验预期。


    此外，如果我们熟稔于算法和编程，那么可以尝试使用 NumPy 手工打造各个网络层的实现，有时获得性能的提升也是客观的。因为使用深度学习框架的好处在于简便，劣势在于，计算框架照顾的是大多数场景，其各种参数的配置未必是最优的，而在计算框架裹挟之下，我们对框架的内部实现通常是无法“染指”的。正所谓“凡事有利就有弊”。


    最后，从测试的时长可以看到，仅利用 CPU 来训练深度学习模型，由于是串行训练，在模型并不复杂的情况下，因此训练速度还是比较慢的。有条件的读者，可以尝试使用
    GPU 来训练深度学习模型。由于 GPU 通常有成千上万个 CUDA core，在高并发线程的加持下，预期的训练速度会快很多。


    训练深度学习的模型，非常耗时。为了加速训练流程，人们先后使用了多核 CPU（中央处理器）、众核 GPU（图形处理器）、TPU（张量处理器）和 NPU（Neural
    network Processing Unit，神经网络处理器）。 NPU 在电路层模拟人类神经元和突触，并利用专用指令集直接处理大规模的神经元权值更新，大幅提高了计算效率和并降低了能耗。


    # 8.13 本章小结


    在本章，我们学习了循环神经网络（RNN），其最大的特点是，网络的输出结果不仅与当前的输入相关，还与过往的输出相关。由于利用了历史信息，当任务涉及时序或与上下文相关时（如语音识别、自然语言处理等），RNN
    要比其他人工神经网络（如 CNN）的性能好很多。


    但读者需要注意如下两点：


    +   （1）RNN 中的“深度”，不同于传统的深度神经网络，它主要是指时间和空间（如网络中的隐含层个数）特性上的深度。


    +   （2）通过对第 7 章的学习，我们知道传统 CNN（卷积神经网络）的主要特点是“局部连接”“权值共享”和“局部平移不变性”，其中“权值共享”意味着“计算共享”，它节省了大量计算开销。而
    RNN 则不同，它是随着“时间”深度的加深，通过对参数实施“平流移植”来实现“计算共享”的。


    由于传统的 RNN 存在梯度弥散或梯度爆炸，导致第一代 RNN 很难将神经网络层数提上去，因此其表征能力非常有限，应用性能上也有所欠缺。于是，胡伯提出了 LSTM，通过改造神经元，添加了遗忘门、输入门和输出门等结构，让梯度能够长时间地在路径上流动，从而有效提升了深度
    RNN 的性能。


    LSTM 对历史信息具有良好的记忆能力，这个特征非常适用于自然语言处理，因此，接下来，我们先简单介绍了自然语言处理的词向量表示'
