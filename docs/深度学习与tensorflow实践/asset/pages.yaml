  md: '示更新后的权值，该式的核心在于求得梯度 $\frac{\partial E_d}{\partial w_{ji}}$，以便在梯度下降规则中方便使用它。


    如前所述，$E_d$ 表示的是训练集合中第 $d$ 个样例的误差。式 (5-16) 描述的情况是输出层只有一个变量。若输出层变量不止一个（如多分类），则可用输出向量表示，故
    $E_d$ 可更全面地表示为


    $$E_d(w) = \frac{1}{2} \sum_{k \in outputs} (t_k - o_k)^2$$ (5-19)


    其中，$t_k$ 表示神经元 $k$ 的目标输出值（可视为一个教师信号）；$o_k$ 表示神经元 $k$ 的实际输出值（模型的实际预测值）；outputs
    表示输出层神经元集合（其数量等于输出神经元的个数）。


    ![](img/aa01495b859013c80481c58ec0894987_174_0.png)


    图 5-19 神经元权值的影响范围


    首先，我们注意到，权值 $w_{ji}$ 仅存在于神经元 $i$ 和神经元 $j$ 之间，它只能通过 net$_j$ 影响其他相连的神经元，如图 5-19
    所示。


    这里，net$_j$ 是神经元 $j$ 的外部输入加权之和，可以表述为


    $$\text{net}_j = \sum_i w_{ji} x_{ji}$$ (5-20)


    其中，$x_{ji}$ 表示神经元 $j$ 的第 $i$ 个输入，$w_{ji}$ 是对应的权值。具体到图 5-19 的例子，则有


    $$\text{net}_j = x_{jh} w_{jh} + x_{ji} w_{ji} + x_{jk} w_{jk}$$ (5-21)


    此外，$E_d$ 是 net$_j$ 的函数，而 net$_j$ 又是 $w_{ji}$ 的函数。因此，根据链式求导法则有


    $$\frac{\partial E_d}{\partial w_{ji}} = \frac{\partial E_d}{\partial \text{net}_j}
    \frac{\partial \text{net}_j}{\partial w_{ji}}$$ $$= \frac{\partial E_d}{\partial
    \text{net}_j} \frac{\partial (x_{jh} w_{jh} + \cdots + x_{ji} w_{ji} + \cdots
    + x_{jk} w_{jk})}{\partial w_{ji}}$$ $$= \frac{\partial E_d}{\partial \text{net}_j}
    x_{ji}$$ (5-22)


    很显然，在式 (5-22) 中，当 net$_j$ 对 $w_{ji}$ 求偏导数时，与 $w_{ji}$ 没有关联的变量都可视为常数而被“过滤”掉（因为求其偏导数等于零），最后只留下
    $w_{ji}$ 的系数 $x_{ji}$。


    需要注意的是，这里的 $x_{ji}$ 是统称。实际上，在反向传播过程中，$x_{ji}$ 可视为神经元 $j$ 的“前驱”，在经历输出层、隐含层和输入层时，它的标记可能有所不同。'
