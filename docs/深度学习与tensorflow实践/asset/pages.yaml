  md: '“有则改之，无则不管”的原则，调节神经网络的参数。


    对于特定问题，损失函数的选择非常重要。一个好的损失函数，不仅能很好地刻画误差，还能反映形成误差的内在本质。对于多分类问题，最常用的损失函数就是交叉熵函数（Cross-Entropy）。相比而言，范例
    6-4 中的 MSE（均方误差，第 29~30）就显得有些粗糙了。


    那什么是交叉熵呢？说到交叉熵，就不得不回顾一下“熵”的概念。熵的概念源自热力学，它是系统混乱度的度量，即越有序，熵越小；反之，越杂乱无序，熵就越大。


    信息领域中，信息论的开创者香农（Claude Shannon）在他的一篇经典论文“通信的数学原理（A mathematic Theory of Communication）”中，借用了热力学的熵，提出了信息熵的概念。


    简单来说，信息熵描述了这样一件事情：一条信息的信息量和它的不确定程度有密切关系。例如：我们要搞清楚一件非常不确定的事情，就需要知道关于这件事的大量信息。相反，如果我们已经对某件事情了如指掌，那么不需要掌握太多的信息就能把它搞清楚。所以，从这个角度来看，信息熵就是一个系统的不确定性程度。简单来说，熵就是一个从“不知道”变成“知道”的差值。


    那么，如何衡量事件的不确定程度呢？香农发明了一个称为“比特（bit）”的概念，并给出了信息熵的计算公式，即


    ```

    H(X) = -\sum_{i=1}^n p(x_i) \log p(x_i) (6-5)

    ```


    其中，\( p(x_i) \) 代表随机事件 \( X \) 为 \( x_i \) 的概率。简单来说，信息熵的大小与随机事件发生的概率有关。若发生越小概率的事件，则不确定程度越高，产生的信息熵越大。从信息论的角度来看，\(
    -\log p(x_i) \) 表示编码长度（若 \( \log \) 表示以 2 为底，则长度单位就是比特），\( -\log p(x_i) \cdot
    p(x_i) \) 其实就是在计算加权长度（权值为概率）。所以，对于编码而言，信息熵的意义就是最小的平均编码长度。


    举例说明，对于单词“HELLO”，我们可根据上述描述来计算它的熵，即


    ```

    p(''H'') = p(''E'') = p(''O'') = 1/5 = 0.2

    ```


    ```

    p(''L'') = 2/5 = 0.4

    ```


    ```

    H(''HELLO'') = -0.2 \times \log_2(0.2) \times 3 - 0.4 \times \log_2(0.4) = 1.9293

    ```


    通过上面的计算可知，若采用最优编码方案，则“HELLO”中的每个字符大致需要 2 比特来编码。


    上面熵的计算是基于每个字符出现的真实概率 \( p_i \) 计算得到的。假设在'
