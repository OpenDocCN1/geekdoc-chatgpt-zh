- pgno: 22
  md: '而在另一本由斯坦福大学统计系的 T. Hastie 等人编写的经典著作《统计学习基础》中给出这样的定义[11]，机器学习就是“抽取重要的模式和趋势，理解数据的内涵表达，即从数据中学习”。


    这三个有关机器学习的定义，各有侧重，各有千秋。Mitchell 的定义强调学习的效果；Vapnik 的定义侧重机器学习的可操作性；而 Hastie 等人的定义则突出了学习任务的分类。但其共同的特点在于，都强调了经验和数据的重要性，以及都认可机器学习提供了从数据中提取知识的方法。


    当下，我们正处于大数据时代。众所周知，大数据时代的一个显著特征就是，“数据泛滥成灾，信息超量过载，然而知识依然匮乏不堪” [12]。因此，能自动从大数据中获取知识的机器学习，必然会在大数据时代的舞台上扮演重要角色。


    # 1.2.3 机器学习的 4 个象限


    一般来说，知识在两个维度上可分成 4 类，知识的 4 个象限如图 1-5 所示。从是否可统计上看，可分为可统计的知识和不可统计的知识这两个维度；从能否推理上看，可分为可推理的知识和不可推理的知识这两个维度。


    在横向上，对于可推理的知识，可以通过机器学习的方法最终完成这个推理。传统的机器学习方法就是试图找到举一反三的方法，向可推理但不可统计的象限进发（象限 II）。目前看来，这个象限的研究工作（基于符号推理的机器学习）陷入了不温不火的境地，能不能峰回路转，还有待时间的检验。


    ![](img/aa01495b859013c80481c58ec0894987_22_0.png)


    而在纵向上，对于可统计但不可推理的（象限 III）知识，可通过神经网络这种特定的机器学习方法，达到性能提升的目的。目前，基于深度学习的棋类博弈（AlphaGo）、计算机视觉（猫、狗识别）、自动驾驶等都是在该象限中取得了耀眼的成就。


    从图 1-5 可知，深度学习属于统计学习的范畴。用李航博士[13]的话来说：“统计机器学习的对象，其实就是数据。”这是因为对于计算机系统而言，所有的“经验”都是以数据形式存在的。作为学习的对象，数据的类型是多样的，可以是数字、文字、图像、音频、视频，也可以是它们的


    图 1-5 知识的 4 个象限'
