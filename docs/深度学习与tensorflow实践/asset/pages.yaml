  md: '# 8.1 标准神经网络的缺点


    深度信念网络（Deep Belief Network，DNN）与卷积神经网络（CNN）等标准神经网络，都能充分挖掘输入数据的局部依赖性，因此在很多领域得到广泛应用。尽管如此，标准的神经网络依然有着不容忽视的内在缺点。其中最显著的缺点莫过于，在构建模型时，都基于这样一个假设，即训练集和测试集彼此都是独立的。


    但在真实的世界里，很多样例之间彼此有千丝万缕的关联。例如，从视频中抽取的一帧帧图像，从音频中截取的一段段语句，从语句中提取的一个个单词，它们怎么可能是真正相互独立的呢？


    如果假设的基础存在问题，那么以此为基础构建的模型自然也难以成立。故 DNN 和 CNN 很难在数据间存在依赖的场景下胜出。


    前文我们说过，现在的人工智能在很大程度上是模仿人类智能的。而人类智能具有“承前启后”的特征。例如，当我们在思考问题时，都是在先前经验和已有知识的基础上，结合当前实际情况，综合给出决策，而不会把过往的经验和记忆都“弃之如敝屣”。


    例如，如果我们做一道填空题，“天空飞过一只_”，这个空应该填入什么？利用前面输入—连串的历史信息：“天空/飞过/一只”，我们就能大致猜出最后一个词可能是“小鸟”，也可能是“蜻蜓”之类的飞行动物，但必然不能是“人”或“坦克”。这是因为，人和坦克都不能“飞”，也不能和“一只”这样的量词进行搭配，可见前面的语境（历史信息）是非常有用的，如图
    8-1 所示。


    除此之外，标准神经网络还存在一个短板，那就是其输入都是标准的等长向量。例如，如果输入层有 10 个神经元节点，那么该层就只能接收 10 个元素，多了或少了都不行（除非做截断或填充到标准长度，否则难以处理）。


    而真实场景下，数据的模样并不满足这样“规则”。文本、视频、音频、等数据的长度并不固定，可长可短，因此标准神经网络很难胜任这类应用场景。


    有问题，就有解决问题的驱动力。为了拓展神经网络的处理能力，让其拥有过往信息的“记忆”能力，就


    ![](img/aa01495b859013c80481c58ec0894987_270_0.png)


    图 8-1 历史信息带来的启发作用'
