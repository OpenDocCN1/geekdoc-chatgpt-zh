- pgno: 248
  md: '"预处理"。


    我们可以将全连接层看成一个用于分类的多层感知机算法。因此前面章节中讲解的基于梯度递减的优化算法（如 BP 算法、Adam、交叉熵等），依然能在这样的全连接层中得到应用。


    需要说明的是，观察图 7-15 可知，在卷积神经网络的前面几层是卷积层、激活层和池化层的交替转换，这些层中的数据（连接权值）通常都是高维度的。但全连接层比较“淳朴”，它的拓扑结构就是一个简单的
    n×1 模式，犹如一根擎天的金箍棒。


    所以卷积神经网络前面的层在接入全连接层之前，必须先将高维张量展平成一维向量组（形状为 n×1），以便于和后面的全连接层进行适配，这个额外的多维数据变形工作层为展平层（Flatten
    Layer）。然后，这个展平层成为全连接层的输入层，其后的网络拓扑结构就如同普通的前馈神经网络一般，后面跟着若干个隐含层和一个输出层，如图 7-23 所示。


    ![](img/aa01495b859013c80481c58ec0894987_248_0.png)


    虽然全连接层处于卷积神经网络最后的位置，看起来貌不惊人，但由于全连接层的参数冗余，导致该层参数的总数占据整个网络参数的大部分比例（有的可高达 80%以上）。


    这样一来，稍有不慎，全连接层就容易陷入过拟合的窘境，导致网络的泛化能力很难尽如人意。因此，在 AlexNet 中，不得不采用 Dropout 措施，随机丢弃部分节点来弱化过拟合现象。


    # 7.9 防止过拟合的 Dropout 机制


    2012 年，Geoffrey Hinton 等人发表了一篇引用率很高的论文[11]，其中提到了一种在深度学习中广为使用的技巧——Dropout（随机丢弃，也有资料将其译作“随机失活”），实际上它是一个防止过拟合的正则化技术。


    在神经网络学习中，Dropout 以某种概率暂时丢弃一些单元，并丢弃与它相连的所有节点的权值，若某节点被丢弃（或称为抑制），则输出为 0。Dropout 的工作示意图如图
    7-24 所示，图 7-24(a)为原始图，图 7-24(b)'
