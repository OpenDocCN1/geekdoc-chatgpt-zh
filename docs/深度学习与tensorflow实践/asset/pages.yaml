    # 4.5 张量的索引和切片


    同 NumPy 一样，TensorFlow 也可以通过索引与切片操作提取张量的部分或全部数据，由于索引和切片的使用频率非常高，因此我们有必要了解有关它们的常用方法。


    # 4.5.1 索引


    索引（Index）是指张量元素所在的位置编号，类似于邮编之于地区的关系。我们可以通过张量的索引来获取并设置张量元素的值。访问的格式为 tensor_name[index]，其中
    tensor_name 为张量名称，方括号内的 index 即为索引。


    如果把张量名称当作访问张量的起始“指针”（Pointer），那么索引就可以理解为偏离这个指针的偏移量（Offset）。索引的起始编号是 0，正向索引时，第
    1 个元素的索引是 0（表示相对于起始指针不偏移），第 2 个元素的索引是 1（表示相对于起始指针偏移 1 个位置），依此类推（见图 4-5）。'
