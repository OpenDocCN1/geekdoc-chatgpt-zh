  md: '经过反复提纯过的结果，因此输出的分类品质要高得多。


    事实上，我们还可以根据不同的业务需求，构建出不同拓扑结构的卷积神经网络。也就是说，可以先由 $m$ 个（$m \geqslant 1$）卷积层和激活层叠加，然后（可选）进行一次池化操作，重复这个结构
    $n$ 次，最后叠加 $k$ 个全连接层。


    通过前面的层层堆叠，将输入层导入的原始数据逐层抽象，形成高层语义信息，送到全连接层进行分类，该过程称为前馈运算（Feed-forward）。最终，全连接层将其目标任务（分类、回归等）形式化，表达为目标函数（或称损失函数）。


    通过计算输出值和预期值之间的差异，得到误差或损失（Loss），然后再通过前面章节讲到的反向传播算法，将误差逐层向后反馈（Back-Forward），从而更新网络连接的权值。多次这样的前馈计算和反馈更新，直到模型收敛（误差小于给定值）。如此这般，一个卷积神经网络模型就训练完成了。下面我们——详细讲解卷积神经网络中这几个层的设计理念。


    # 7.5 卷积层要义


    相比于相邻网络层的完全连接，卷积核就是一个局部小区域。如前所述，全连接很多时候可能毫无必要。局部连接强调的是“焦距当下”，即利用卷积核与前一层神经网络进行


    有了上面工作的铺垫，下面我们来聊聊卷积层的三个核心概念：局部连接、空间位置排列及权值共享。


    # 7.5.1 卷积层的局部连接


    卷积神经网络的最核心的创新之一，就是用局部连接（Local Connectivity）代替全连接。局部连接也称为局部感知或稀疏连接，它是通过前层网络和卷积核实施卷积操作来实现的。


    为了便于说明，我们先用一维空间的卷积来说明局部连接的含义。全连接要求前后两个网络层每一个神经元都是两两连接的（见图 7-16(a)），实际上，这种全连接并不是必需的。而局部连接则不同，我们假设在卷积层（假设是第
    $l$ 层）中的每一个神经元都只与前一层（第 $(l-1)$ 层）中的某个局部窗口内的神经元相连，构成一个局部连接网络，如图 7-16(b)所示，这样卷积层与下一层之间的连接数大大减少，由原来的
    $M_l \times M_{l-1}$ 个连接变为 $M_l \times K$ 个连接，这里 $K$ 为卷积核的大小。'
