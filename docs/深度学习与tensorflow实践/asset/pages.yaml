- pgno: 51
  md: '最终的分类结果择其大者而判之。例如，如果判定为“2”的概率（如 80%）远远大于判定其他数字的概率，那么整个神经网络的最终判定就是数字“2”，而非其他数字。


    相比于神经网络输入层与输出层设计的直观明了了，前馈神经网络的隐含层设计可就没有那么简单了。说好听点，它是一门艺术，依赖于工匠的打磨；说刻薄点，它就是一个体力活，需要不断地重复试错。


    我们可以把隐含层暂定为一个黑箱，它负责输入层和输出层之间的非线性映射变化，具体功能有点“剪不断，理还乱”（这是神经网络理论的短板所在）。隐含层的层数不固定，每层的神经元个数也不固定，它们都属于超参数，是人们根据实际情况不断调整选取的。


    我们把神经元与神经元之间的互相影响程度称为权值，权值的大小就是连接的强弱，它“告诉”下一层相邻神经元更应该关注哪些像素图案。


    除了连接权值，神经元内部还有一个施加于自身的特殊权值，即偏置（Bias）。偏置可看成一个门槛（Threshold），高过这个门槛，神经元就被激发（Fired），否则就“寂寥无声”。偏置的大小，表明神经元是否更容易被激活。也就是说，它决定了神经元连接加权之和至少要有多大，才能让激发变得有意义。


    神经网络结构设计的目的在于，让神经网络以更佳的性能来学习。而这里的所谓“学习”，如前所言，就是找到合适的权值和偏置，让损失函数的值最小。


    # 2.4 神经网络中的损失函数


    每 4 年举行一次联邦计算机研究会议（ACM FCRC），在计算机领域颇有影响力，历次会议均有众多顶级学者出席。最近一届会议于 2019 年在美国亚利桑那州的凤凰城举行。


    在 ACM FCRC 2019 会议上，图灵奖得主、著名深度学习学者杨立昆（Yann LeCun）指出，“预测是智能的、不可或缺的组成部分，当实际情况和预测出现差异时，实际上就是学习的过程。”


    那么如何来衡量实际情况与预测之间的差异呢？这就要用到了一个专门的函数——损失函数（Loss Function）。


    在机器学习的“监督学习”算法中，在假设空间 $\mathbb{F}$ 中构造一个决策函数 $f$，对于给定的输入 $X$，$f(X)$ 给出的实际输出 $\hat{y}$
    和原来的预测值 $y$（代表的是正确答案）可能不一致。于是，我们需要定义一个损失函数来度量这二者之间的“落差”程度。这个损失函数通常记作'
