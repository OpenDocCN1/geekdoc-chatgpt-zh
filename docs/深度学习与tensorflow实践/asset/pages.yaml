- pgno: 295
  md: '这样一来，我们可以把一个词想象成多维向量空间中的一个点。词的意义就由词的在各个维度上向量值来表征。


    这里的“分布式表示”中的“分布”，是指每个词都可以用一个向量表达，而这个向量里包含多个特征，而非“独热编码”那么“独”。当然，这里的“多个”，也不能像“独热编码”那么多，其维度以
    50 维到 100 维较为常见，相比于独热编码动辄成千上万的维度，分布式表示已经算是低维表达了。


    ![](img/aa01495b859013c80481c58ec0894987_295_0.png)


    使用分布式表示的最大贡献在于，它提供了一种可能性，可以让相关或者相似的词在距离上可度量。度量的标准可以是欧氏距离，也可以用余弦夹角来衡量，如图 8-26 所示。需要注意的是，图
    8-26 表示的范例在二维空间内。事实上，余弦相似度的计算方法可拓展到任意高维空间。


    > 近年来，人工智能相关领域的学者开始将本体论的观念用在知识表达上，即借由本体论中的基本元素（概念及概念间的关联）作为描述真实世界的知识模型。


    分布式表示的概念，多少有点哲学中的“本体论（Ontology）”的影子。因为“本体”是用各种属性（或说特征）刻画出来的。如果我们通过机器学习算法将各种特征都找出来，并精确地将其用数值表征出来，那么这个本体就呼之欲出了。


    接下来，我们就要引入本书即将讲到的重点——词嵌入（Word Embedding），它可以得到如图 8-25 所示的神经网络所表示的结果，即从数据中自动学习单词的分布式表示。如前所述，如果分布式表示得以完成，那么就能显著降低向量空间的维度及减少训练所需的数据量。


    # 8.10.3 词嵌入表示


    > 广义来讲，“嵌入”是一种理念，不仅适用于“词嵌入”，还适用于“图像嵌入”“语音嵌入”。只要满足高维到低维的变化，且满足单射和结构保存特性，都可称为“嵌入”。


    在自然语言处理中，词嵌入（Word embedding，也有资料将其译为词向量）基本上是语言模型与表征学习技术的统称。从概念上讲，词嵌入是指，将一个维数等于所有词数量的高维空间（如前面提到的独热编码）“嵌入”到一个维数低得多的连续向量空间中，并使得每个词或词组都被映射为实数域上的向量。


    那么，这个“嵌入”到底是什么意思呢？简单来说，在数学上，“嵌入”表示的是一个映射，即 f: X → Y。也就是说，“嵌入”是一个函数。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '不过这个函数有些特殊，要满足两个条件：①单射，即每个 Y 只有唯一的 X 与之对应，反之亦然。②结构保存，例如，在 X 所属的空间上有 x1 > x2，则通过映射后，在
    Y 所属的空间上一样有 y1 > y2。


    具体到词嵌入，就是要找到一个映射或函数，将词从高维空间映射到另外一个低维空间中，其中这个映射满足前面提到的单射和结构保存性，好像是“嵌入”到另外一个空间中一样，即生成词在新空间中找到了低维表达方式，这种表达方式称为词表征（Word
    Representation）。


    下面简单介绍一下词嵌入（的来历。词嵌入技术最早起源于 2000 年。伦敦大学学院（University College London）的研究人员 Roweis
    与 Saul 在《科学》（Science）上撰文 [10]，提出了局部线性嵌入（Locally Linear Embedding，LLE）策略，该策略用来从高维数据结构中学习低维表示方法（其核心工作就是降维）。


    随后 2003 年，机器学习的著名学者 Y. Bengio 等人发表了一篇开创性的论文：A neural probabilistic language model（一个神经概率语言模型）[5]。


    在这篇论文中，本吉奥等人总结出了一套用神经网络建立统计语言模型的框架（Neural Network Language Model，NNLM），并首次提出了词嵌入的概念，但当时并没有取这个名字，而是称其为投影矩阵（Projection
    Matrix）。


    在 2010 年后，词嵌入技术突飞猛进。T. Mikolov 等人提出了一种 RNNLM 模型 [9]，用递归神经网络代替原始模型中的前向反馈神经网络，并将嵌入层与
    RNN 中的隐含层合并，从而解决了变长序列的问题。


    特别是在 2013 年，由 Mikolov 领导的谷歌团队再次发力，在前人基础上提出更精简的语言模型框架 Word2vec 并用于生成词向量 [11]。随后，该团队又提出训练
    Word2vec 的两个重要技巧分层 Softmax（Hierarchical Softmax）和负采样（Negative Sampling）[12]。文献[11]的研究工作保证了
    Word2vec 的理论可行性，而文献[12]的贡献在于，提供了工程上的可行性，从而使得向量空间模型（Vector Space Model，VSM）的训练速度大幅提高，并成功引起工业界和学术界的极大关注。


    现有的向量空间模型可分为两大类。一类是计数模型，如潜在语义分析（Latent Semantic Analysis，LSA）。从字面上的意思理解，LSA 就是通过分析语义，发现文档中潜在的意思和概念。如果每个词仅表示一个概'
  merge: -1
