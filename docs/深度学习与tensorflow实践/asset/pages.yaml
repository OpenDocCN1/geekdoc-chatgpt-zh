    # 2.2.4 感知机是如何学习的


    中国有句古话：“知错能改，善莫大焉”。说的就是，犯了错误而能改正，没有比这更好的事了。放到机器学习领域，这句话显然属于“监督学习”的范畴了。因为“知错”，就表明事先已有了事物的评判标准，如果某人的行为不符合（或说偏离）这些标准，那么就要根据“偏离的程度”，来“改善”这个人的行为。


    下面，我们就根据这个思想来制定感知机的学习规则。从前面的讨论中，我们已经知道，感知机学习属于“监督学习”（即分类算法）。感知机有明确的结果导向性，不管是什么样的学习规则，只要能达到良好的分类目的的，就是好的学习规则。


    我们知道，对象本身的特征值一旦确定下来就不会变化，可将其视为常数。因此，所谓的神经网络的学习，就是通过数据驱动的方式，来不断调整神经元之间的连接权值和神经元内部阈值，直到输出符合预期的值（这个结论对于深度学习而言，依然是适用的）。


    假设我们的规则如下


    ```

    w_new ← w_old + ε

    θ_new ← θ_old + ε

    (2-3)

    ```


    其中，\(\varepsilon = y - y''\)，\(y\) 为期望输出，\(y''\) 是实际输出。也就是说，\(\varepsilon\) 是二者的“落差”。在后面的内容中，读者可以看到，这个“落差”就是整个网络中权值和阈值的调整动力。很显然，如果
    \(\varepsilon\) 为 0，即没有误差可言，那么新、旧权值和阈值都是一样的，网络就稳定可用了。


    下面，我们就用上面的学习规则来模拟感知机的学习过程。假设 \(w_1\) 和 \(w_2\) 的初值随机分配为 1 和-1（请注意，已不再是前面提到的 1
    和 1 了），阈值 \(\theta\) 依然为 0（事实上为其他初值也是可行的，这里仅为说明问题而做了简化），那么我们遵循如下步骤，即可完成判定西瓜的学习。


    （1）计算判定西瓜的“率性”输出值为


    ```

    S = w1 x1 + w2 x2 - θ

    = 1 × 1 + (-1) × 1 - 0

    = 0

    ```'
