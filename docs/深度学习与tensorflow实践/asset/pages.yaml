    # ## 7.13 思考与练习


    通过本章的学习，请思考如下问题。


    +   1. 我们常说的分布式特征表示，在卷积神经网络中是如何体现的？


    +   2. 除了本章中描述的常见卷积核，你还知道哪些常用于图像处理的卷积核？


    +   3. 虽然权值共享大大减少了卷积层（隐含层）与输入层之间权值调整的数量，但是并没有提高前向的传播速度，你知道用什么策略来加速吗？


    +   4. 本章中我们提到“肤浅而全面”的全连接，不如“深邃而局部”的部分连接。2016 年，商汤科技团队在 ImageNet 图片分类比赛中勇夺冠军，其网络深度已达到
    1207 层。那么，深度学习是不是越深越好？为什么？


