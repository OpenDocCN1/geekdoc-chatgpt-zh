    # 代码解析


    第 01 行，声明了一个感知机类 Perceptron。


    第 02 ~ 04 行，设计了感知机类 Perceptron 的构造方法__init__()。在 Python 中，类的构造方法名称固定为__init__()。它的存在价值具有两层含义：第一层是在对象生命周期中做数据成员的初始化，每个对象都必须被正确初始化后才能正常工作。第二层是__init__()方法的参数值，它可以有多种形式，通过这个“窗口”，可以把外界的信息传递给刚创建的对象。


    第 02 行，初始化感知机，设置输入参数的个数及激活函数。第 04 行，使用了列表表达式，并用下画线“_”作为读取 range()方法的“匿名”变量，实际上这个表达式根本无意读取变量，而仅想利用其中隐含的for循环，将
    weights 中的元素逐个初始化为 0.0。


    第 06 ~ 07 行，重载内置方法__str__(), 实现的功能是返回一个字符串，描述学习到的权值，其中 w0 为偏置项（第 07 行）。__str__()通过内置方法
    str()进行调用，返回类型必须是一个 string 对象。需要注意的是，第 07 行跨越两行，实际上是一条语句，由于第 07 行写不下，就用反斜杠“\”作为续行表示。同时，这里使用
