    # ## 6.2 数据的加载


    构建任意一个机器学习模型，通常需要遵循以下 5 个步骤：① 加载数据；② 定义模型；③ 构建损失函数并选择合适的优化器；④ 训练模型参数；⑤ 评估模型性能。


    如同“兵马未动，粮草先行”，机器学习算法也需要“粮草”才能训练出所谓的“性能”。它的“粮草”就是数据。没有数据，所有神经网络模型的训练都无从谈起。利用 tf.keras
    模块搭建机器学习模型时，要先讲讲它是如何加载数据的。


    # ### 6.2.1 TensorFlow 的经典数据集


    在进入实战之前，我们先简单介绍 TensorFlow 如何加载常用的经典数据集。为了便于学习、训练和测试某些算法，机器学习框架（如 sklearn）和深度学习框架（如
    TensorFlow 或 PyTorch 等）都会内置一些经典的数据集集或提供远程下载这些经典数据集的接口。这些常用的经典数据集包括（但不限于）以下数据集。


    ( 1 ) MNIST/Fashion_MNIST：手写数字图片数据集，常用于图片分类任务（mnist / fashion_mnist）。


    ( 2 ) Boston Housing：波士顿房价趋势数据集，常用于回归模型训练与测试（boston_housing）。


    ( 3 ) CIFAR10/100：真实图片数据集，常用于图片分类任务（cifar10/cifar100）。


    ( 4 ) IMDB：情感分类任务数据集，常用于文本分类任务（imdb）。


    ( 5 ) Reuters：路透社文本数据集，常用于文本分类研究的测试集合（reuters）。


    为方便用户使用，在 TensorFlow 中，keras.datasets 模块提供了这些经典数据集的自动下载、管理、加载与转换功能，并提供了 tf.data.Dataset
    数据集对象，方便实现多线程（Multi-threading）、预处理（Preprocessing）、随机打散（Shuffle）和批训练（Training on
    Batch）等常用数据处理功能。


    通过 datasets.xxx.load_data()即可实现经典数据集的自动加载，其'
