- pgno: 298
  md: '段：基于 NGram 的语言模型、基于前馈神经网络的语言模型（NNLM）和基于 RNN 的语言模型（RNNLM）。


    在自然语言处理的统计模型中存在一个基本问题，即在上下文语境中，如何计算一段文本序列在某种语言中出现的概率。之所以说这是一个基本问题，是因为它在很多自然语言处理任务中都扮演着重要的角色。上面提及的三种统计模型都围绕如何更快、更准地计算这个概率。限于篇幅，我们只介绍最后一种模型，对于前两种模型，请读者自行参考相关文献[13]。


    # 8.11 基于 RNN 的语言模型


    通过前面的介绍我们知道，RNN 与其他神经网络结构最大的不同之处在于，通过循环，它引入了“记忆”元素，即在做预测时，其输出不仅依赖于当前输入，还依赖之前的记忆（历史信息）。


    因此，RNN 与语言模型有天然默契的基因。在自然语言处理中，常用的场景是，预测第 n 个词时，需要依赖前 (n-1) 个词的向量表示，这正是历史信息此外，相比普通前馈神经网络，RNN
    的参数共享机制也可大幅度减小参数的规模。


    图 8-28 是简化的基于 RNN 的语言模型，其中 t 表示时间。从图中可以看到，循环神经网络有一个输入层，用 w(t) 表示，该单词的编码方式为 1-of-V，即
    w(t) 的维度为|V|，|V| 是词典大小，w(t) 的分量只有一个为 1，表示当前单词，其余分量为 0。实际上这种编码方式就是前面我们提到的独热编码。


    ![](img/aa01495b859013c80481c58ec0894987_298_0.png)


    中间有一个隐含层 s，用于保存上下文的状态 s(t)。s(t-1) 表示隐含层的前一次输出。当前输入 w(t) 和历史上下文 s(t-1) 相结合，共同作用，形成当前隐含层的上下文
    s(t)，然后在输出层 y 中，输出 y(t)，这里 y(t) 表示 P(w_t | w_t, s_(t-1))。


    图 8-28 简化的基于 RNN 的语言模型


    之所以称之为 RNN，就是在 t 时刻，s(t) 会留下一个副本，在(t+1)时刻，s(t) 会被送到输入层，相当于一个循环。将图 8-28 随时间 t 展开为如图
    8-29 所示的形式，或许能更容易明白为什么称其为基于 RNN 的语言模型了。'
