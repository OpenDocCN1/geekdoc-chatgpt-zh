  md: "# 4.10.2 向量\n\n在神经网络中，向量（一维数组）也是一种常见的数据载体。例如，在全连接层和卷积神经网络层中，除输入层外，每个神经元都有一个特殊的权值参数——偏置。若把每一层的每一个神经元都拼接在一起，则就是一个偏置向量，通常简称为\
