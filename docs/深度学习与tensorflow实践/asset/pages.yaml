    ![](img/aa01495b859013c80481c58ec0894987_247_0.png)


    # (a) 最大池化策略


    # (b) 平均池化策略


    # 图 7-22 两种不同的池化策略结果的对比图


    最大池化的结果就是保证前文提到的不变性（Invariance）。也就是说，如果输入数据的局部进行了线性变换操作（如平移、旋转或缩放等），那么经过池化操作后，输出的结果并不会发生变化。其中，局部平移不变性特别有用，尤其是我们关心某个特征是否出现，而不关心它出现的位置时。例如，在模式识别场景中，当检测人脸时，我们只关心图像中是否具备人脸的特征，而并不关心人脸是在图像的左上角还是右下角。


    因为池化综合了（过滤核范围内的）全部邻居的反馈，即通过 k 个像素的统计特性而不是单个像素来提取特征的，自然这种方法能够大大提高神经网络的健壮性。


    # 7.8 全连接层


    前面我们讲解了卷积层、激活层和池化层。但要记住卷积神经网络的终极任务，通常是对图像进行分类，而分类就少不了全连接层的参与。


    因此，在卷积神经网络的最后，还有一个或多个至关重要的全连接层。“全连接”意味着，前一层网络中的所有神经元与下一层网络中的所有神经元全部相连。实际上，全连接层就是传统的多层感知机。


    如果说前面提及的卷积层、池化层和激活层等操作是将原始数据映射到隐含层特征空间，那么设计全连接层的目的在于，将前面各个层预学习到的分布式特征表示，映射到样本标记空间中，然后利用损失函数来调控学习过程，最后给出对象的分类预测。在某种程度上讲，甚至可以认为，前面的卷积层、池化层和激活层的数据操作，是对全连接层数据的'
