    # 4.1.2 张量的尺寸


    在 TensorFlow 中，除了用“阶”来表示数据结构，还可以用“尺寸”或“维度”来表示，二者有异曲同工之妙，如表 4-2 所示。


    # 表 4-2 TensorFlow 中的尺寸和维度


    | 阶 (Rank) | 尺寸 (Shape) | 维度 (Dimension) | 解释 |

    |---|---|---|---|

    | 0 | [] | 0 维 | 一个零维的张量，即标量 [] |

    | 1 | [D0] | 1 维 | 一个一维张量，如 shape [5] (这里表示一维数组，里面包括 5 个数据，下同) |

    | 2 | [D0, D1] | 2 维 | 一个二维张量，如 shape[3,4] |

    | 3 | [D0, D1, D2] | 3 维 | 一个三维张量，如 shape[2,2,3] (参加下面的代码) |

    | n | [D0, D1, ... Dn] | n 维 | 一个 n 维张量，如 shape [D0, D1, ... Dn-1] |


    对于 n 维张量而言，它有一个常用的属性——shape（尺寸），它用来表示张量在每个维度上的元素数量。标量（一个数据）就好比没有维度的“原子”，它的 shape
    属性就是 0。代码如下所示。


    ```

    In [1]: import tensorflow as tf

    In [2]: tensor_0 = 1

    In [3]: tf.shape(tensor_0)

    Out[3]:

    <tf.Tensor: id=3, shape=(0,), dtype=int32, numpy=array([], dtype=int32)>

    ```


    In[3]处的 tf.shape()方法的功能就是输出张量的尺寸。从上面 Out[3]的输出可以看到，tf.shape()输出的信息过多，其实可以把 tf.shape()的输出信息放到
    print 中输出，或者用 TensorFlow 的专用输出函数 tf.print 来输出。


    ```

    In [4]: print("tensor_0 的尺寸为:{0}".format(tf.shape (tensor_0)))

    tensor_0 的尺寸为:[]

    ```


    > 也可用输出函数 tf.print()将尺寸信息输出，如 tf.print( tf.shape (tensor_0))'
