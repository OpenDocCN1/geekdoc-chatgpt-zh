  md: '图，就是在逻辑上描述一次机器学习计算的过程。下面我们以图 3-14 为例，来说明 TensorFlow 中的几个重要概念。


    ![](img/aa01495b859013c80481c58ec0894987_88_0.png)


    图 3-14 TensorFlow 的数据流图


    构建数据流图时，需要两个基础元素：节点（Node）和边（Edge）。


    +   - 节点：在数据流图中，节点通常以圆、椭圆或方框表示，代表对数据的运算或某种操作。例如，在图 3-14 中，就有 5 个节点，分别表示输入（input）、乘法（mul）和加法（add）。


    +   - 边：数据流图是一种有向图。边通常用带箭头的线段表示，实际上，边是节点之间的连接。指向节点的边表示输入，从节点引出的边表示输出。输入可以来自其他数据流图，也可以表示文件读取、用户输入。输出就是某个节点的操作结果。在本例中，节点
    c 接收两个边的输入（2 和 4），在乘法（mul）操作下结果为 8。类似地，节点 d 在加法（add）操作下结果为 6。最后，数据 6 与 8 流动到节点
    e，在加法操作下结果为 14。


    数据流图是 TensorFlow 1.x 的重要概念，它表达的是一个“惰性”数值计算。但 TensorFlow 2 升级了很多新特性，简化了张量计算流程，提倡即时执行模式，数据流图的风光不再，慢慢走进历史舞台，或为大势所趋。


