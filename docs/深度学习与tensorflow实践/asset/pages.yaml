  md: '# 代码分析


    本例的前 28 行来自范例 6-6，区别在于添加了保存模型的部分。第 31 行通过 to_json()方法将网络的拓扑结构保存为 JSON 格式，第 32
    ~ 33 行将其写入到本地。第 35 行通过 save_weights()方法将模型权值参数保存到本地磁盘。


    因此，除在屏幕显式上述输出提示信息外，还会在本地生成两个文件：model.json 和 model.h5。


    JSON 文件在本质上是一个文本文件，我们可以通过任意文本编辑器将其打开并查看其中的内容，读者也可以下载专门的 JSON 文件解析器，以便更好地查看不同对象的层次关系。


    将一个模型的参数保存到本地的过程，其实有一个更学术的称呼，即对象序列化（Serialization）。在计算机科学的数据处理中，序列化是指将数据结构或对象状态转换成可取用格式（如保存成文件，保存成缓冲数据，或经由网络发送），后续在相同或另一台计算机环境中，能恢复原先状态的过程。因此，model.json
    和 model.h5 可以视为两个序列化的文件。


    对应地，按照序列化格式文件，通过你想操作，可以恢复与原始对象相同语义的副本对象，这个过程称为反序列化（Deserialization）。


    范例 6-8 利用 model.json 和 model.h5 来实施反序列化操作，从而可以还原一个训练好的神经网络，然后无需二次训练即可使用这个神经网络模型。


    ```

    ### 范例 6-8 通过反序列化重构训练好的网络（ load-model.py ）


    ```python

