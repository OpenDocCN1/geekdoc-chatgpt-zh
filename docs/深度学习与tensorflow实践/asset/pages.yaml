- pgno: 15
  md: '# 1.1 从人工智能到深度学习


    近年来，人工智能的发展产生了里程碑式的突破，这个突破的典型代表就是深度学习（Deep Learning）。当下，我们正处在人工智能第三次浪潮的巨变时代之中，以深度学习为代表的联结主义学派正给我们带来智能时代的红利。下面，我们就先谈谈联结主义的发展史。


    # 1.1.1 从感知机到深度学习


    我们主要讨论联结主义的发展历程。联结主义与本章讨论的主题遥相呼应。我们知道，人类“观察大脑”的历史其实由来已久，但由于对大脑缺乏“深入认识”，因此常常“绞尽脑汁”也难以“重现大脑”[1]。


    神经网络的发展与心理学有着密切联系。开启深度学习之旅的杰弗里·辛顿（Geoffrey Hinton）与心理学渊源颇深，其本科所学专业是心理学，第一篇重要的关于反向传播算法的论文亦是和另一位心理学家合作的。


    自 20 世纪 40 年代起，科学家们对大脑科学的研究，让这一困境开始得以缓解。1943 年，神经生理学家 W. McCulloch 和数学家 W. Pitts
    共同发表了一篇开创性的论文[2]，提出了“M-P 神经元模型”，其核心思想是通过基于逻辑门的数学模型来模拟大脑神经元的行为，他们的研究工作开创了人工神经网络方法。


    20 世纪 40 年代，加拿大心理学家唐纳德·赫布（Donald Hebb）一直致力于研究神经元在心理过程中的作用。1949 年，他出版《行为的组织》一书[3]，书中提出了赫布定律（Hebb’s
    rule）。在本质上，该定律是心理学和神经科学结合的产物，其中还夹杂着某些合理的猜想。因此，赫布定律也称为赫布假说（Hebb’s postulate）。该理论经常被简化为“连在一起的神经元会被一起激活”。


    赫布假说是第一个对神经元如何发挥功能做出符合情理解释的机制。通过这个机制，可以对神经元的连接实施编码。赫布认为，人脑神经细胞突触上的强度是可以变化的。概念和记忆是细胞集（即相互激发的神经元群体）在大脑中表示出来的。每个细胞集既可以包含来自不同大脑区域的神经元，又可以和其他集合相互重叠。


    其实这就是“联合学习”（Associative Learning）概念的起源。在这种学习中，如果在时间上很接近的两个事件重复发生，那么最终会在大脑中形成关联，这个概念在心理学上也称为联想学习。在这种学习中，通过对神经元的刺激，使得神经元之间的触触连接强度增强。这样的学习方法被称为赫布型学习（Hebbian
    Learning）。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '后来，联结主义学派（Connectionism）①的科学家们考虑使用调整网络参数权值的方法，来完成基于神经网络的机器学习任务。在某种程度上，这个假说就奠定了今日人工神经网络（包括深度学习）的理论基础。


    联结主义的兴起，标志着神经生理学和非线性科学向人工智能领域的结合，这主要表现为人工神经网络（Artificial Neural Network，ANN）的兴起。人工神经网络的研究进展，自然得益于对于生物神经网络（Biological
    Neural Network，BNN）的“仿生”。联结主义认为，人工智能源于仿生学，人的思维就是某些神经元的组合。其理念在于，在网络层次上模拟人的认知功能，用人脑的并行处理模式来表现认知过程。


    1958 年，美国人工智能领域的著名心理学家 F. Rosenblatt 提出了由两层（含输入层）神经元组成的神经网络，并将其命名为“感知机”（Perceptron）。Rosenblatt
    在理论上证明了，（不含输入层的）单层神经网络在处理线性可分的模式识别问题时，可以做到收敛。


    ![](img/aa01495b859013c80481c58ec0894987_16_0.png)


    但在本质上，应该清楚认识到，感知机是一种简易的线性分类器，其功能非常有限。它的训练机制如下：若分类器预测是正确的，则无须修正权值；若预测有误，则用学习率（Learning
    Rate）乘以差错（期望值与实际值之间的差值）来对应调整权值。


    后来，Rosenblatt 因“感知机”而名声大振，很多新闻媒体（包括纽约时报）都先后报道了他的研究成果。俗话说：有人的地方，就有江湖。Rosenblatt
    的高调，引起了联结主义的奠基人、图灵奖得主马文·明斯基（M. Minsky，1927 年—2016 年）的不满。在学术会议上，他与 Rosenblatt 争辩，认为神经网络并不能解决所有问题。


    经过充分的理论研究，1969 年，Minsky 和他的同事 S. Papert 合作撰写了学术著作《感知机》[4]，在书中他们认为：“人工神经网络被认为充满潜力，但实际上无法实现人们期望的功能”。Minsky
    与其著作《感知机》如图 1-1 所示。


    鉴于 Minsky 的学术地位（1969 年，获得计算机科学界最高奖项——图灵奖），他的论断直接将对人工智能的研究推入一个长达近 20 年的低谷，史称“人工智能的冬天（AI
    Winter）”。


    ① 很多文献混用“连接主义”和“联结主义”，其实二者有着微妙的区别。“连接”强调的是物理的勾连。而“联结”显然不是简单的“连接”，而是在共同目标的基础上，利用数据驱动的方式达成的有机勾连。因此，使用“联结主义”更能体现神经网络的“内涵”。本书统一采用“联结主义”。'
