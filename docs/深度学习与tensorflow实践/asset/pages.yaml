  md: '率，因此，对于所有深度学习框架而言，训练数据的处理是一个很重要的议题。最早，TensorFlow 把数据集中的所有数据全部都读到内存中，但是有些数据集很大，内存吃不消。于是，TensorFlow
    就改进策略，分批读取数据，一次读入一个批次（Batch）。如果是纯串行操作，即“读数据→计算→读数据”，这样的计算效率显然是低效的。


    为了提高效率，TensorFlow 采用数据队列（Queue）技术——QueueRunner，使用 QueueRunner 可以创建一系列新的线程，实施队列管理。数据的入队（Enqueue）和出队（Dequeue）的操作也是数据流图中的节点。如果
    Queue 中的数据满了，那么 Enqueue 操作将会阻塞；如果 Queue 是空的，那么 Dequeue 操作就会阻塞。但如果操作不当，那么可能会发生类似于“生产者-消费者”的死锁问题。


    为了更加“优雅”地处理训练数据，TensorFlow 提供了 tf.data 模块，它基于惰性求值（lazy evaluation）范式，并使用了多线程数据输入管路（Input
    Pipeline）。在 tf.data 工作流中，能够以异步的方式预读取下个批次的数据，从而使 GPU/TPU 整体的等待时间缩到最短。此外，tf.data
    模块提供的 API 非常简单，它吸纳了 Keras 类似风格的函数，采用了 NumPy 一样的数组分布结构，显著降低与数据处理相关的代码复杂性。


    上述描述看起来了更加复杂了。实际上，这种“复杂性”是对用户“透明”的，用户无须感知这些背后的技术。它以“润物细无声”地模式，给用户提供更好的数据使用体验。


    虽然早在 TensorFlow 1.x 时代，TensorFlow 已经提供了 tf.data，但那时它与其他数据处理模式（如 QueueRunner）处于“群雄并立”状态，而在
    TensorFlow 2 中，tf.data 以外的数据处理模块，都被“毫不留情”地抛弃了，再一次践行了 TensorFlow 2 力推的极简主义。


