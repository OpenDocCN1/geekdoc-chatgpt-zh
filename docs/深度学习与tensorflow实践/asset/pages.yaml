  md: "# 3.4.3 利用 conda 安装 TensorFlow\n\nAnaconda 的核心命令就是 conda。conda 既是一个包管理器，又是一个环境管理器。作为包管理器，它可以协助用户查看或安装软件包。若当前运行的\
    \ Python 环境不止一个，则我们还可以借助 conda 搭建特定程序适用的 Python 版本，这就是 conda 的环境管理器功能。下面我们就借助这个功能，为\
    \ TensorFlow 配置专有的运行环境。需要说明的是，不论是 Linux、Windows 还是 macOS，都支持在命令行用 conda 安装软件包。\n\
    \n> 亦可在终端 ( macOS/Windows/Linux 均可 ) 使用 pip3 命令安装 TensorFlow.\n> pip3 install\n\
    > tensorflow\n\n重启安装 Anaconda 的终端，以便更新环境变量。利用 conda 安装 Tensorflow，直接在终端输入命令 “conda\
    \ install tensorflow”，如果提示 “Proceed ([y]/n)?”，意为“是否继续”，直接按回车键即可，方括号内的值 [y]为回车的默认值。运行结果如下。\n\
    \n```\n$ conda install tensorflow\nCollecting package metadata (current_repodata.json):\
    \ done\nSolving environment: done\n## Package Plan ##\nenvironment location: /home/yuhong/anaconda3\n\
    \nadded / updated specs:\n- tensorflow\n\nThe following packages will be downloaded:\n\
    \n   package                    |   build\n------------------------------|---------\n\
    _tflow_select-2.3.0           |   mk1               2 KB\nabsl-py-0.9.0      \
    \           |   py38_0           165 KB\n......（省略大部分输出）\ntensorflow-2.3.0   \
    \           |mkl_py38h6d3daf0_0   4 KB\ntermcolor-1.1.0               |   py38_1\
    \            8 KB\n......\n```\n\n这种方法简单，conda 会自动查找安装源的 “最新” 版本来安装。之所以这里的 “最新”\
    \ 二字打上引号，是说明它可能并非是真正的最新，而是 Anaconda 软件仓库中最新的，或者相对比较稳定的版本。Anaconda 追求系统的稳定性，对于追\
    \ “新”，它选择的是 “让子弹飞一会儿”——让最新的系统先经历一段时间考验再说。\n\n若用户的计算机已经配备 GPU，且 CUDA 驱动已经安装完成①，则可以\n\
    \n① CUDA 的安装分为 CUDA 软件的安装、cuDNN 深度神经网络加速库的安装及环境变量配置三个步骤，相对较为琐琐。这个任务留给有 NVIDIA\
