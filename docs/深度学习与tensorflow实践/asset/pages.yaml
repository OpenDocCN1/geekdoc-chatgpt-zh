  md: '曾经作为感知机忠实支持者的 Minsky，在发现感知机模型居然连稀松平常的“异或（XOR）”操作都难以实现时，不免叹息——面对这更加纷杂的非线性世界，感知机如何能处理得了啊？


    感慨之余，Minsky 对“感知机”逐渐感到失望。1972 年，Minsky 和同事 S. Papert 出版了《感知机：计算几何简介》[4]一书，在书中，他们论述了感知机模型存在的两个关键问题。


    （1）单层神经网络无法解决线性不可分的问题，典型的证据就是不能实现“异或门电路（XOR Circuit）”的功能。


    （2）更为严重的问题是，即使增加隐层的数量，由于没有行之有效的学习算法，且没有足够的算力去完成神经网络模型训练所需的超大计算（如调整网络中的权值参数），感知机也“委以重任”。


    # 2.3 多层前馈网络


    # 2.3.1 多层网络解决“异或”问题


    Minsky 对感知机的批评是致命的，刚刚起步的联结主义学派跌入低谷近 20 年[5]。而解决 Minsky 所诟病的“异或”问题，关键在于，能否解决线性不可分问题。那么，该如何解决这个“异或”的线性不可分问题呢？


    “异或”线性不可分的症结在于，单层的感知机网络太过“单纯”，数据拟合能力（或称数据表征能力）太弱。简单来说，解决“异或”线性不可分的方案，就是使用更加复杂的网络，即利用多层前馈网络。这是因为，复杂网络的表征能力比较强。按照这个思路，可以在输入层和输出层之间添加一层神经元，将其称之为隐含层。这样一来，隐含层与输出层中的神经元都拥有激活函数。假设各个神经元的阈值均为
    0.5，权值在图 2-13 中已给出，这样就可实现“异或”功能（在后续的章节中，我们会给出多层感知机解决“异或”问题的 Python 实战案例）。


    ![](img/aa01495b859013c80481c58ec0894987_45_0.png)


    图 2-13 可解决“异或”问题的两层感知机


