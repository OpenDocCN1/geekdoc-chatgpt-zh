  md: '现在我们讨论第二个问题，为何要设计 “Batch Size”呢？我们知道，在最简单的感知机模型设计中，一个样本的特征数对应输入层神经元的个数，若是串行处理，则一次只能处理一个样本的训练，这样对网络参数的训练速度会慢很多，也没有充分发挥张量的功能，从第一性原理来看，其实就是没有充分发挥矩阵乘法的优势。


    ![](img/aa01495b859013c80481c58ec0894987_143_0.png)


    于是，工程师改进了操作流程，将一批样本并排放置在一起，一行一个样本。这样一来，就能一次性训练一批样本，这样效率高了很多。对于当前的范例，这个 Batch Size
    就是 4，如图 4-12 所示。


