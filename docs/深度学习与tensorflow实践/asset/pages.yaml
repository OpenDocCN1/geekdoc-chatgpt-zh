    合并操作的逆过程就是分割，即将一个张量分拆为多个张量。我们还以学生成绩为例，假设我们得到整个学校的学生成绩张量，其尺寸为[10, 35, 8]，表示的含义是有
    10 个班，每个班有 35 名学生，每名学生都选了 8 门课。'
