    # ## 8.4 常见的 RNN 拓扑结构


    针对不同的业务场景，RNN 有很多不同的拓扑结构。从输入、输出是否为固定长度来区分，可以分为 5 类：one-to-one（一对一）、one-to-many（一对多）、many-to-one（多对一）、many-to-many（多对多，异步）及
    many-to-many（多对多，同步），如图 8-5 所示。


    在图 8-5 中，每个方块都代表一个向量。底层方块代表输入向量，顶层方块代表输出向量，中间方块代表隐含层状态向量。此外，图中的每个箭头都代表施加在向量上的运算，我们也可以将其理解为张量（Tensor）的流动（Flow）方向。下面我们来分别解释一下这
    5 种结构的含义。


    ![](img/aa01495b859013c80481c58ec0894987_276_0.png)


    # ### 8.4.1 one-to-one


    one-to-one 的含义是单输入单输出。注意，这里的“单（one）”并非表示输入的向量的长度为 1，而是指输入长度是固定的。one-to-one 更严格的解释是“from
    fixed-sized input to fixed-sized output（从固定输入到固定输出）”。这种结构事实上就是传统的卷积神经网络结构，如图像分类，一张图片对应一个分类。


    再例如文本分类。文章的 n 个特征向量为（f1, f2, ⋯, fn），将这些特征向量输入网络后，得到 c 个分类的概率（p1, p2, ⋯, pc）。这里，n
    和 c 都是大于 1 的数字，但由于它们的值都是在设计网络拓扑结构时就固定下来的，因此仍属于 one-to-one 结构范畴。'
