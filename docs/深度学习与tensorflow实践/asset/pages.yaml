  md: '# 7.2.2 生活中的卷积


    在前面我们已经提到，函数（Function）的本质就是功能（Function），功能的抽象描述就是函数，两者的内涵是相通的。卷积是函数的叠加，而函数的叠加，更通俗地讲，就是功能的叠加。


    卷积的概念比较抽象，好在抽象的理论通常都源于具象的现实。为了便于理解这个概念，我们可以借助现实生活中的案例来辅助说明。


    举例来说，在一根铁丝的某处不停地弯曲它，假设发热函数是 f(t)，散热函数是 g(t)，此时此刻的温度就是 f(t)与 g(t)的卷积。在一个特定环境下，发声体的声源函数是
    f(t)，该环境下对声源的反射效应函数是 g(t)，那么在这个环境下感受到的声音就是 f(t)与 g(t)的卷积。


    类似地，记忆也可视为一种卷积的结果[3]。假设认知函数是 f(t)，它代表对已有事物的理解和消化，遗忘函数是 g(t)，那么人脑中记忆函数 h(t) 就是函数
    f(t)与 g(t)的卷积，即


    ```

    h(t) = f(t) * g(t)

    = \int_0^{+\infty} f(t) * g(t - \tau) d\tau

    ```


    卷积运算在图像处理等领域有着广泛的应用。以图像处理为例，它的作用就是对原始图像或卷积神经网络上一层的特征进行变换，即特征抽取。这就是为什么卷积后的结果被称为“特征图谱”的原因。


    # 7.3 图像处理中的卷积


    图像识别是卷积神经网络大显神威的地方，下面我们就以图像处理为例来说明卷积的作用。


