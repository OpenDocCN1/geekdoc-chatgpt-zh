- pgno: 18
  md: '由于 CNN 的特殊结构，因此它在一些数据集上（如手写体数字识别、文档分类等）取到了良好的效果。于是，在 20 世纪 80 年代末和 90 年代初，人工神经网络的研究与应用达到巅峰。


    但随后，神经网络又陷入衰落。其中一个重要原因在于，基于 BP 算法的神经网络无法有效支撑更深层次的神经网络。究其原因，是因为 BP 算法存在严重的“梯度扩散（Gradient
    Diffusion）”现象。梯度是调整整个网络权值的向导，如果梯度一旦消失，就对网络权值训练没有任何指导意义。此外，由于 BP 算法依赖于梯度调参，因此也容易让神经网络陷入局部最优解。


    此外，人们也发现，随着网络的层数加深，网络的输出结果对于初始几层网络权值的影响越来越小，从而导致整个网络的训练过程无法保证收敛。因此，BP 算法多用于浅层网络结构（通常小于或等于
    7），这就限制了 BP 算法的数据表征能力，从而也就限制了 BP 算法的性能上限。


    与此同时，20 世纪 90 年代，俄罗斯统计学家 V. Vapnik 提出了大名鼎鼎的支持向量机（Support Vector Machine，SVM）。因
    SVM 具有高效的学习算法，且不存在局部最优解的问题，使得很多神经网络的研究者逐渐转向 SVM 的研究上来。就这样，多层前馈神经网络的研究再次受到冷落 [10]。2006
    年，时隔近 30 年，杰弗里·辛顿再次厚积而薄发，与他博士学生 Salakhutdinov 一起，在世界著名学术刊物《科学》上发表了一篇关于深度学习的开山之作《用神经网络降低数据的维数》[8]。杰弗里·辛顿与他开启深度学习时代的论文如图
