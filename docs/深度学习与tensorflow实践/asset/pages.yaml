    因此，为了公平起见，通常需要将样本的不同特征需要做一些数据预处理，其中归一化（Normalization）处理就是常见的方法之一，该方法将所有特征值映射到[0,1]范围内处理，这是常见的数据预处理手段。


    归一化机制有很多，最简单的方法是：对于给定的特征，首先找到它的最大值（MAX）和最小值（MIN），然后对于某个特征值 x 进行归一化处理，其归一化值 x''
