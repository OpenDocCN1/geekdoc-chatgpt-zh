    +   - TensorFlow：建议使用 Anaconda 安装 TensorFlow 2.0 及以上版本。


    本书所有源代码和配套资源均可在线下载，下载网址：https://www.hxedu.com.cn，或在代码托管平台 GitHub 上下载，下载网址：https://github.com/yhily/deep-learning-resource。


    # 联系作者


    深度学习是一个前沿且广袤的研究领域，很少有人能对其每个研究方向都有深刻的认知。限于图书篇幅，很多深度学习的议题并未涉及。且笔者自认才疏学浅，书中难免会出现理解偏差和错谬之处。若读者朋友们在阅读本书的过程中发现任何问题，希望能及时与笔者联系，笔者将在第一时间修正并对此不胜感激。


    邮件地址：zhangyuhong001@gmail.com。


    # 致谢


    本书能得以面市，得益于多方面的帮助和支持。在信息获取上，笔者学习并吸纳了很多精华知识，书中也尽可能地给出了文献出处，如有疏漏，望来信告知。在这里，对这些高价值资料的提供者、生产者表示深深的敬意和感谢。同时，感谢自然科学基金（项目编号：61705061，61975053，U1904120）和河南工业大学思政课程教学改革基金项目（机器学习）的部分支持。


    此外，很多人在这本书的出版过程中扮演了重要角色，例如电子工业出版社的孟宇编辑在选题策划和文字编辑上，河南工业大学的陈伟楷、潘世泽、张开元和石岩松等在文稿校对上，都付出了辛勤的劳动，在此对他们一并表示感谢。'
