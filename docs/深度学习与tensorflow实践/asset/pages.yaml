  md: '很多文献或深度学习循环框架在提及 RNN 时，实际上就是指 LSTM。如果想特指原生版本的 RNN，它的名字通常叫 “Simple-RNN”。


    于是，这样的一加一乘的操作设计，既减小了损失信号的梯度弥散，又控制了信息的留存比例。加法和乘法操作正是 LSTM 记忆单元的精华所在。


    至此，我们剖析了 LSTM 网络的标准设计流程。虽然 LSTM 神经元看起来很复杂，但由于它效果奇佳，导致它基本上成为 RNN 的代名词了。


    # 8.7.7 GRU 优化


    实际上，图 8-19 所示的结构并不是 LSTM 唯一的设计方式。很多研究人员对标准的 LSTM 做了优化。例如，J.Chung 等人提出的门控循环单元（Gated
    Recurrent Unit，GRU）[8]就是其中的佼佼者。GRU 在 LSTM 的基础上进行了简化，它主要做了两个方面的改进：① 提出了更新门的概念，也就是将输入门和遗忘门合并，形成一个新的更新门；②
    将记忆单元状态 c_t 和隐含层单元状态 s_t 融合在一起。


    图 8-21(a) 是 LSTM 单元的另一种形式，对此不再赘述。对比图 8-21(a) 和图 8-21(b) 可以看出，GRU 在本质上就是一个没有输出门的简化版
    LSTM。


    LSTM。因此，在每个时间步内，它都会将记忆单元中的全部内容写入整体网络中。模型的简化意味着运算上的简化，调参上的便捷（虽然性能可能有所损失，但微小的性能损失，相比于调参训练的收益，是值得的）。特别是在训练很多数据的情况下，GRU
    能节省更多时间，从而更为用户所接受。


    ![](img/aa01495b859013c80481c58ec0894987_289_0.png)


    ![](img/aa01495b859013c80481c58ec0894987_289_1.png)


    图 8-21 LSTM 单元与 GRU 单元示意图（图片来源：参考资料[8]）


    # 8.8 LSTM 的训练流程


    前面我们用了较多的篇幅讨论了 LSTM 的结构，实际上只是讨论了它的前向传播工作原理。事实上，我们还缺少一个 LSTM 训练算法框架来调整网络参数。LSTM
    的参数训练算法，依然是我们熟悉的反向传播算法。对于这类反向传播算法，遵循的流程类似，简单来说，主要有以下三个步骤。


    (1) 前向计算每个神经元的输出值。对于 LSTM 而言，依据前面介绍的流程，按部就班地分别计算出 f_t、i_t、c_t、o_t 和 s_t。'
  merge: -1
  img_proc: true
- pgno: 290
  md: '（2）确定优化目标函数。在训练早期，由于输出值和预期值存在不一致的现象，因此通过计算每个神经元的误差项构造损失函数。


    （3）根据损失函数的梯度指引，更新网络权值参数。与传统 RNN 相似的是，LSTM 误差项的反向传播也包括两个层面：一个是空间层面上的，将误差项向网络的上一层传播；另一个是时间层面上的，沿时间反向传播，即从当前
    t 时刻开始，计算每个时刻的误差。


    然后跳转到第（1）步，重新执行第（1）、（2）和（3）步，直至网络误差小于给定值。


    限于篇幅，我们没有给出详细的求导过程，感兴趣的读者可以阅读胡伯的开创性论文，其中有详细的 LSTM 的前向传播和后向传播的推导过程①。


    接下来我们准备使用 LSTM 完成一个自然语言处理的实战项目。但在此之前，为了便于理解，我们还需要先铺垫一些与自然语言处理相关的理论。


    # 8.9 自然语言处理的假说


    在自然语言处理领域中，有一个著名的假说——统计语义假说（Statistical Semantics Hypothesis）。这个假说表明：“基于一种语言的统计特征，隐藏着语义的信息。”


    这个一般性的假说是很多特定假说的基础。基于此，衍生出了诸如词袋模型假说（Bag of Words Hypothesis）、分布假说（Distributional
    Hypothesis）、扩展分布假说（Extended Distributional Hypothesis）及潜在关系假说（Latent Relation
    Hypothesis）等一系列假说。下面我们对前两个应用较多的假说做简要介绍。


    先介绍词袋模型假说，在数学上，“袋”（Bag）又称多重集（Multiset），它很像一个集合，不过它允许元素重复。举例来说，{a,a,b,c,c,c}是一个包含
    a、b 和 c 的袋，其中 a 与 c 都有多个。在袋和集合中，有一个重要的特性，即元素的顺序是无关紧要的。因此，袋{a,a,b,c,c,c}与袋{c,a,a,b,a,c}是等价的。'
