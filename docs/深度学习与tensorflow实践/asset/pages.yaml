  md: '把原始的单词（实际上是单词对应的编码）转化为词向量，有时这类数据转换也称为嵌入层。


    嵌入层之后的部分才是真正的神经网络。下面我们先尝试设计将这个 RNN 网络的拓扑结果。初步尝试将隐含层数量设置为 2 层。随后看性能如何，再考虑添加更多的层。根据以往经验，网络层数越深，其表达能力越强，故此数据的拟合能力也就越强。但“过犹不及”，网络层数过深也会产生问题，容易导致计算负担过大，且亦可能导致梯度弥散或梯度爆炸。


    ![](img/aa01495b859013c80481c58ec0894987_305_0.png)


    经过 RNN 的训练后，若想做情感分类，最后一定要有一个全连接层（也称稠密层 Dense）。由于这是一个二分类问题，因此全连接层的输出只需要一个神经元即可。


    这里需要再次强调的是，图 8-30 的 RNN 看起来很“胖”，实际上并非如此，它只不过是按照时间训练展开的逻辑上的网络拓扑图而已。事实上，图 8-30 中的
    t1 和 t2 是一个网络，不过是在时间维度上展开而已。


    一旦训练完毕后，网络的输入权值 U 和输出权值 V 都是相同的，这就是 RNN 参数共享的含义。所不同的是，包含历史信息的隐含层权值 W，会随着时间的推进而不同（可重温图
    8-4


    图 8-30 文本用于情感分类的 RNN 拓扑结构 获得更全面的理解 ) .


    下面我们用代码实现如图 8-30 所示的 RNN 拓扑结构。在实现代码前，我们需要一些预备知识的铺垫。在前面章节中，我们已经提到，Keras 有三种模型搭建方式，其中第三种方式就是子类模型（Subclassing
    Model）。即把 tf.keras.Model 当作模型的父类，通过继承，子类可以共享部分父类模型的特征，达到代码复用的目的，然后，我们可以在子类中定义自己个性化的那部分操作。


    在继承类中，我们需要重写（Override）两个父类方法：__init__() 和 call(input)。前者为构造器，主要初始化模型所需的层和父类的变量；后者描述数据流动的逻辑拓扑结构，即数据如何通过网络层得到输出，这类似于
    TensorFlow 1.x 时代的数据流图。


    自然，我们也可以根据需要添加一些父类没有定义的方法。自定义 Keras 模型的类构造示意图如图 8-31 所示。'
