  md: "# 7.4 卷积神经网络的结构\n\n在了解卷积这个核心概念之后，下面我们来讨论卷积神经网络的拓扑结构。一旦理解清楚它的设计原理，再动手实战，在诸如\
    \ TensorFlow、Keras 等深度学习的框架下，亲自写一个卷积神经网络项目，自然就能较为深刻地理解卷积神经网络的内涵。\n\n下面，我们先在宏观层面认识卷积神经网络中的重要结构，如图\
    \ 7-15 所示。在不考虑输入层的情况下，一个典型的卷积神经网络通常由若干个卷积层（Convolutional Layer）、激活层（Activation\
    \ Layer）、池化层（Pooling Layer）及全连接层（Fully Connected Layer）组成。下面先给予简单的介绍，后面会逐个进行详细介绍。\n\
    \n![](img/aa01495b859013c80481c58ec0894987_238_0.png)\n\n图 7-15 卷积神经网络中的重要结构\n\
    \n+   - 卷积层：是卷积神经网络的核心所在。在该层中，通过实现“局部感知”和“参数共享”这两个设计理念，来达到两个重要的目的，即降低网络连接和提取信号特征。\n\
    +   \n+   - 激活层：通过激活函数引入非线性变换，从而提高整个神经网络的表征能力。\n+   \n+   - 池化层：有些资料也将其称为子采样层或下采样层（Subsampling\
    \ Layer）。简单来说，采样就意味着减小数据规模。\n+   \n+   - 全连接层：相当于多层感知机（Multi-Layer Perceptron，MLP），在整个卷积神经网络中起到分类器的作用。通过前面多个“卷积层→激活层→池化层”的反复处理，待处理的数据特性已有了显著改善：一方面，输入数据的维度已下降到可用传统的全连接前馈神经网络来处理了；另一方面，此时的全连接层输入的数据已不再是“泥沙俱下，鱼龙混杂”，而是"
