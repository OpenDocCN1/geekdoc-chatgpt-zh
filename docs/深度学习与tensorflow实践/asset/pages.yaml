  md: '内的。


    在如图 6-4 所示的模型中，将 28×28=784 的像素作为输入，换句话说，输入层有 784 个神经元。输入数据首先经过神经网络的加工处理，然后在输出层给出一个
    0 ~ 9 的数字分类预测，即输出层神经元个数为 10。


    在如图 6-4 所示的全连接神经网络中，每个输出神经元都与输入层的 784 个输入神经元相连，它们之间的连接权值标记为 **_W_**。显然，**_W_**
    的尺寸为 [784, 10]。


    神经元的输出取决于两部分：一部分来自各个输入神经元的加权和（Weighted Sum）；另一部分来自偏置（Bias）。这两部分的和在某个非线性激活函数的作用下，最终给出一个
    0 ~ 9 的分类信息。


    或许你会疑惑，每张手写数字图像明显是一个尺寸为 28×28 的二维张量，在图 6-4 中，为何变成了一个尺寸为 784 的一维张量？下面我们就解释数字 “784”
    的由来。


    神经网络用于分类时，通常输出层与其前一层为全连接，这意味着，输出层的前一个层（在本例，前一层就是输入层）通常是一个一维结构。为了适配全连接层的特征，原始的输入数据（一个二维张量）必须转换为一维张量，这就需要对张量进行降维处理。


    在本质上，神经网络完成一种从数据到知识的萃取过程。如果把这个过程分解为若干个子过程，那么神经网络中所谓的 “层” 就是数据处理的子过程。


    通过降维可以把一个二维的图像转换成了一个包含 28×28=784 个特征的一维向量。其过程就是将二维矩阵的第 2 行、第 3 行、第 4 行……依次接到第一行的后面，如图
    6-5 所示。这种将二维数据 “拉伸” 成一维数据的操作，在神经网络学习中，称为展平（Flatten）。对应的神经网络层称为展平层（Flatten Layer）。


    展平层的不足之处显然是损失了原来图片的二维结构信息，但却带来了任务的简化。在后期的项目中，我们再使用更为复杂的模型（如 CNN 网络），即可利用 MNIST
    样本的二维信息。


    如此一来，训练集由一个 60 000×28×28 的三维向量被展平成一个 60 000×784 的二维张量。这个张量第一个维度的信息是图片的编号，第二个维度的信息是图片中每个像素的索引值，如图
    6-6 所示。


    在本项目中，要在 0 ~ 9 个数字（共 10 个子类）中预测其中一个数字，很明显，这属于多分类任务。最简单的模型莫过于 Softmax 回归（Softmax
    Regression）。那什么是 Softmax 回归呢？下面我们就讨论这个问题。'
