- pgno: 245
  md: '都是非常有限的，因为这样的多层神经网络最终会“退化”为一层神经元网络。


    这样一来，通用近似定理又是如何起作用的呢？这就得请激活函数出山了。虽然神经元之间的连接是线性的，但激活函数可不一定是线性的，有了非线性的激活层函数，无论是多么复杂的函数，我们都能将其近似地表征出来。加入（非线性的）激活函数后，深度神经网络才具备分层的非线性映射学习能力。因此，激活函数是深度神经网络中不可或缺的一部分。


    目前，在卷积神经网络中，最常用的激活函数就是修正线性单元（Rectified Linear Unit, ReLU）。这个激活函数是由 Krizhevsky
    和 Hinton 等人在 2010 年提出来的[9]。标准的 ReLU 非常简单，即 \( f(x) = \max(x, 0) \)。简单来说，当 \( x
    > 0 \) 时，输出为 \( x \)；当 \( x \leq 0 \) 时，输出为 0。


    ![](img/aa01495b859013c80481c58ec0894987_245_0.png)


    虽然 ReLU 有不少优点，但 ReLU 的这种简单直接的处理方式也会带来一些副作用。而其中最为突出的问题就是，它有过于宽广的兴奋域。Sigmoid 函数和
    Tanh 函数都会对输入数据的值域上界进行限制。例如，前者的值域为 \( (0, 1) \)，后者的值域为 \( (-1, 1) \)，它们都是饱和型非线性函数。


    然而，ReLU 则完全不会限制输入数据的值域。当 \( x > 0 \) 时，输出一直为 \( x \)，也就是说，ReLU 是非饱和型线性函数。但随着训练的推进，一个非常大的梯度经过一个
    ReLU 神经元，更新过参数后，部分输入会落入硬饱和区，即大数导致数值不稳定，计算值溢出，变成负值，这时 ReLU 的输出永远为 0。


    如果发生了这种情况，那么这个神经元的梯度就永远都被锁定为 0。从而进一步导致该神经元永远无法对权值实施更新，相当于这个神经元“死掉了”。因此，此时的 ReLU
    也被戏称为“死掉的 ReLU（Dying ReLU）”[10]。有研究表明，如果学习率很大，那么甚至有可能会让神经网络中的 40% 的神经元都被迫“死掉”。


    目前，还有一些研究工作对 ReLU 进行了改进，提出了一系列诸如 leaky-ReLU、random ReLU 及 PReLU 等优化方案，有兴趣的读者可自行查阅相关资料。


    # 7.7 池化层


    说完了激活层，下面我们讨论池化层。池化层也称子采样层或汇聚层，它是卷积神经网络的另外一个“神来之笔”。通常来说，当卷积层'
