    \ 官网)\n\n为了简单起见，如图 6-10 所示的公式可以简化为\n\n```\n$\\boldsymbol{y} = \\text{Softmax}(\\\
    boldsymbol{Wx} + \\boldsymbol{b}) \\\\ ( \\text{6-4} )$\n```\n\n其中，$\boldsymbol{W}$\
    \ 表示权值矩阵，$\boldsymbol{x}$ 表示输入（像素）向量，$\boldsymbol{b}$ 表示偏置向量。"
