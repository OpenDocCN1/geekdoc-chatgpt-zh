  md: "分，同类的数据需要写入人相同名称的数据库中。例如：\n\n```\n01 # 创建默认的写入环境\n02 with summary_writer.as_default():\n\
    03 # 当前时间戳 step 上的数据为 loss，写入到名为 train-loss 数据库中\n04 for step in range(100):\n\
    05 # ... 模型训练的其他操作\n06 tf.summary.scalar(\"train-loss\", float(loss), step=step)\n\
    07 writer.flush() #刷新缓冲区，即将缓冲区中的数据立刻写入磁盘文件中\n```\n\n由于 TensorBoard 是通过字符串 ID 来区分不同类别的监控数据，因此对于误差数据，这里将它命名为\
    \ “train-loss”，其他类别的数据不可写入该字符串 ID 对应的数据区，以防造成数据污染。\n\n简单来说，TensorFlow 支持写入如下 4\
    \ 类概要（Summary）数据，分别简介如下。\n\n+   (1) 标量数据，如代价损失值、准确率等，这时需要使用 tf.summary.scalar()方法。\n\
    \n+   (2) 张量数据，参数（weights）矩阵、偏置（bias）矩阵等，使用 tf.summary.histogram()直方图方法。\n\n+\
    \   (3) 图像数据，使用 tf.summary.image()方法。\n\n+   (4) 音频数据，使用 tf.summary.audio()方法。\n\
    \n很显然，第一种写入数据的方法，对于高端用户而言，灵活空间大，但细节琐碎，实现起来不易，对初学者并不友好。第二种可视化 TensorBoard 数据的方法是，利用高度集成的\
    \ Keras 模型，这种方法更加简便，推荐初学者使用。\n\n接下来，我们介绍如何使用 TensorBoard 来监控网络模型的训练进度。改造范例 7-3\
