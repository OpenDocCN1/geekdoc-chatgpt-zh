  md: '书画琴棋诗酒花，当年件件不离他。


    而今七事都更变，柴米油盐酱醋茶。


    这首诗说的就是在过日子的洗礼中各种生活琐事的变迁。恋爱是过日子的一部分，需要双方不断磨合。磨合中的权值取舍，就相当于深度学习中隐含层的参数调整，这些参数需要不断地训练和修正。恋爱双方相处，磨合是非常重要的。陪陪她（他），就增加了参数调整的机会。参数调整得好，输出的结果才能是你想要的。


    第三阶段是稳定期，自然相当于深度学习的输出层。输出结果是否合适，预期目标能否达成，高度取决于隐含层参数“磨合”得怎么样。


    # 1.3.3 有没有浅度学习


    有了“深度”学习，读者很容易会思考有没有相应的“浅度”学习呢？答案是，当然有。传统意义上的人工神经网络主要由输入层、隐含层、输出层构成，其中隐含层也叫多层感知机（Multi-Layer
    Perceptron）。


    正如其名称，多层感知机是零零数层（通常小于 7 层）的神经网络，由于梯度递减或梯度爆炸等训练问题，算法的训练难度较大，故感知机的层数通常并不多，这种浅层神经网络通常被称为浅层感知机。


    相比而言，区别于传统的浅层学习，深度学习强调模型结构的深度，隐含层远远不止一层。通常来说，层数越多的网络，通常具有更强的抽象能力（即数据表征能力），也就能够产生更好的分类识别的结果。


    2012 年，杰弗里·辛顿团队在 ImageNet®中首次使用深度学习完胜其他团队，那时的网络层深度只有个位数。2014 年，谷歌团队把网络增至 22 层，问鼎当年的
    ImageNet 冠军。到了 2015 年，微软研究院团队设计的基于深度学习的图像识别算法——残差网（ResNet），把网络层做到了 152 层[14]。没过多久，在
    2016 年，中国知名人工智能公司商汤科技（SenseTime）更是叹为观止地把网络层做到了 1200 多层，这可能是当前在 ImageNet 上最深的一个网络。


    毫无疑问的是，如果深度神经网络的层数再往“深处”做，也可能会达到 2000 层、3000 层。但我们很快会发现，任何时候都可能存在“过犹不及”的情况。因为深度学习的层次不断叠加，表征能力可能增强了，但


