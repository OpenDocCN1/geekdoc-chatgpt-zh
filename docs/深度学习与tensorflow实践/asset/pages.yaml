    \n\\( o_t = \\sigma(W_o \\cdot [s_{t-1}, x_t] + b_o) \\) (8-14)\n\n其中，激活函数 \\\
    ( \\sigma \\) 依然是用 Sigmoid。通过前面的介绍可知，Sigmoid 函数会把 \\( o_t \\) 规则化成一个在 [0, 1] 区间内的权值。\n\
    \n这里的输出也需要“控制，因此还要用激活函数 Tanh() 将记忆值 \\( C_t \\) 换成 -1 ~ 1 范围内的数（这表明记忆影响输出）。负值区间表示不仅不能输出，还需要压制，正数区间表示合理输出。这样有张有弛，方得始终。最终输出门的公式为\n\
    \n\\( s_t = o_t \\times \\text{Tanh}(C_t) \\) (8-15)\n\n最后，结合前面的门设计，LSTM 隐含层单元的完整逻辑设计如图\
