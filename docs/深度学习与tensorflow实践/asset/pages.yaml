  md: '# 3.3.4 PyTorch


    PyTorch 是由 Torch7 团队开发的一款深度学习框架，它是非常有潜力的后起之秀。从历史渊源上来讲，它脱胎于另一款深度学习框架——Torch。Torch
    本身也很优秀，但它的编程语言是 Lua，这是一门用 C 语言编写的、可扩展的轻量级编程语言。正由于 Lua 语言的小众化，导致 Torch 的受众也有限，这成为
    Torch 发展的一大障碍。


    ![](img/aa01495b859013c80481c58ec0894987_79_0.png)


    图 3-6 PyTorch 的图标


    目前，深度学习社区的编程语言，绝大多数以 Python 为主。在这个大趋势下，“识时务者为俊杰”，Torch7 团队改用 Python 重新开发了 Torch，取名为
    PyTorch，其图标如图 3-6 所示。


    PyTorch 非常年轻，2017 年 3 月才开源发布。一经发布，PyTorch 就受到了社区的热烈支持。PyTorch 的设计思路是线性的，代码直观易用，调试方便。它的主要优点还在于，能够支持动态神经网络，通过一种反向自动求导计数，可以让用户零延迟地改变神经网络的行为。完善而清晰的文档支持，简捷而优雅的语法构成，特别受到学术界的支持，大有超越
    TensorFlow 之势。


    当然，PyTorch 也有不足。它最大的不足之处就在于“大年轻”，生态还有待改善。但后生可畏，不容小觑，特别是有 Facebook 这样的大公司做技术支撑，且把
    Caffe 作其后端，方便性和实用性都大大增强，目前 PyTorch 在学术界已占据半壁江山。


    > 根据“存在即合理”的哲学理念，之所以这些框架可并存、能共进，肯定是因为它们各自找到了有自己存在价值的细分市场。


    事实上，有关深度学习的计算框架层出不穷，远远不止前文提及的这几个。例如，比较有名的框架还有 Chainer（由日本公司 Preferred Networks
    领导开发的开源深度学习框架，PyTorch 就从该框架借鉴很多简捷的设计风格）、MXNet（由李沐等人开发的支持多语言开发的深度学习框架，现被亚马逊官方采用）[4]。中国科技公司也开始在深度学习框架中暂露头角，如百度公司的飞桨（PaddlePaddle）、华为公司的
    MindSpore，都在深度学习框架中“可圈可点”，值得关注。


    读者朋友需要根据自己的应用场景来选择适合自己的计算框架，不必拘泥于本章的主要讲解对象 TensorFlow。下面我们介绍 TensorFlow 的安装。虽然
    TensorFlow 适用于三大主流系统 Windows、Linux、和 macOS，但客观来讲，TensorFlow 对 Linux 和 macOS 支持较好，而对
    Windows 支持相对较弱，这是因为，大部分有关深度学习的项目都运行在类 UNIX 系'
