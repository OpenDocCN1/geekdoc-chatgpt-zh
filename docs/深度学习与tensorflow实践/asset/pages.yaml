    # 7.11.2 搭建模型


    为了简化理解，下面我们利用 Keras 来搭建模型。下面的范例是范例 7-1 的延伸，相同的代码部分不再重复列出。


    # 范例 7-2 卷积神经网络的模型搭建（mnist_cnn.py）


    ```

    14 import tensorflow as tf

    15 from tensorflow.keras import layers, models

    16 class CNN():

    17 def __init__(self):

    18 model = models.Sequential()

    19 # 第 1 层卷积，卷积核大小为 3*3，32 个，28*28 为待训练图片的大小

    20 model.add(layers.Conv2D(32, (3, 3), activation = ''relu'',

    input_shape=(28, 28, 1)))

    21 model.add(layers.MaxPooling2D((2, 2)))

    22 # 第 2 层卷积，卷积核大小为 3*3，64 个

    23 model.add(layers.Conv2D(64, (3, 3), activation= ''relu''))

    24 model.add(layers.MaxPooling2D((2, 2)))

    25 # 第 3 层卷积，卷积核大小为 3*3，64 个

    26 model.add(layers.Conv2D(64, (3, 3), activation= ''relu''))

    27 # 增加一个展平层，展平数据

    28 model.add(layers.Flatten())

    29 model.add(layers.Dense(64, activation=''relu''))

    30 model.add(layers.Dense(10, activation=''softmax''))

    31

    32 model.summary()

    33 self.model = model

    ```'
