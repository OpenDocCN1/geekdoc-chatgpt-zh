  md: 'TensorFlow 的优点主要表现在如下 4 个方面。


    （1）TensorFlow 有一个非常直观的架构。顾名思义，它有一个“张量流”。用户可以很容易地、可视化地看到张量流动的每一个环节（需要借助 TensorBoard，在后面的章节会有所提及）。


    （2）TensorFlow 的设计是可移植的。它可轻松地在 CPU、GPU 上部署。经过少许修改或基本不改动的代码，可在云计算、集群等平台进行分布式计算，为大数据分析提供了技术支撑。


    （3）跨平台性好，灵活性强。TensorFlow 不仅可在 Linux、macOS 和 Windows 系统中运行，甚至还可在移动终端下工作。


    （4）调试方便，提供“即时执行”功能。即时执行（Eager Execution）是一个命令式、由运行定义的接口，一旦调用，可立即执行操作，这使得 TensorFlow
    的调试变得更简单，也使得运行变得更直观。


    TensorFlow 的核心 API 主要由 C++语言编写而成，但为了使用方便，它还提供了多种高级语言的前端接口，包括 Python、C++、Java、JavaScirp
    及 Go 语言等。


    当然，TensorFlow 也有不足之处，其主要表现在：相比于其他计算框架，它的代码偏底层，依然需要用户编写大量代码，而且有很多相似的功能，用户不得不“重造轮子”。但瑕不掩瑜，TensorFlow
    还是以雄厚的技术积淀、稳定的性能，“笑傲”于众多深度学习框架之巅。


    # ## 3.3 深度学习框架比较


    “工欲善其事，必先利其器。”事实上，适用于深度学习的“器”有很多，如 Theano、Keras、Caffe 及 PyTorch 等，它们各有特色。下面我们对这几款比较流行的深度学习框架分别给予简单的介绍，为读者提供一个宏观的认知。


    # ### 3.3.1 Theano


    Theano 是一个偏向底层的深度学习框架，它开启了基于符号运算的机器学习框架的先河（见图 3-3）。Theano 支持自动的函数梯度计算，带有 Python
    接口，并集成了 NumPy。所以，从严格意义上来说，Theano 就是一个基于 Python 和 NumPy 而构建的数值计算工具包。


    ![](img/aa01495b859013c80481c58ec0894987_76_0.png)'
