  md: "在参数列表中，x 是要被强制进行类型转换的张量，dtype 是转换后的类型，name 表示这个操作的名称，通常不用。下面举例说明 tf.cast()方法的应用。\n\
    \n```\n```python\nIn [32]: import numpy as np\nIn [33]: a_const = tf.constant(np.pi,\
    \ dtype=tf.float16)\n    # 创建 tf.float16 低精度张量\nIn [34]: a_double = tf.cast(a_const,\
    \ tf.double)\n    # 转换为双精度 tf.double 张量\nIn [35]: a_const\n    # 输出验证\nOut[35]:\
    \ <tf.Tensor: id=346, shape=(), dtype=float16, numpy= 3.14>\nIn [36]: a_double\n\
    \    # 输出验证\nOut[36]: <tf.Tensor: id=347, shape=(), dtype=float64, numpy= 3.140625>\n\
    ```\n```\n\nIn [33]处 np.pi 表示 Numpy 定义的 π，默认这是一个双精度浮点数，如果想改变这个默认设置，就需要指定它的数据类型，这里数据类型为\
    \ tf.float16 低精度张量（单精度浮点数）。In [34]将这个低精度的浮点数转换成高精度的浮点数。In [35]和 In [36]分别“验明正身”，检测它们的类型信息。从上面的输出可以看出，张量的精度不同，保存的数据小数点位数也是不同的。\n\
    \n将张量从低精度张量转到高精度是安全的，但反过来，将高精度张量转换为低精度张量，则不然。这是因为，所谓的高精度是指存在某个张量需要的内存空间较大。例如，一个\
    \ tf.float16 类型的张量，需要 16 位的存储空间，而 tf.double 等同于 tf.float64，该类型的一个变量需要 64 位的存储空间。低精度的张量向高精度的张量转换，就好比把一个小房间换成大房间，原来住小房间的人，自然会“毫发未损”住进大房间。\n\
    \n反之，一个原来住大房间的人（好比高精度数据），如果住进小房间，即使人能勉强住进来了（数据的主体部分得以保留），那么这个人的物品肯定也得做出割舍（数据精度降低或溢出）。\n\
    \nTensorFlow 同样可以把布尔类型与数值型张量之间实施转换。遵循 Python 的传统，TensorFlow 把 True 被当作 1 或 1.0，而\
    \ False 被当作 0 或 0.0。反过来，我们也可以把数值类型转换为布尔类型，例如：\n\n```\n```python\nIn [37]: a_int\
    \ = tf.constant([-1.1, 0, 1.0, 123, -100])\nIn [38]: b_bool = tf.cast(a_int, tf.bool)\n\
    In [39]: b_bool\nOut[39]: <tf.Tensor: id=38, shape=(5,), dtype=bool, numpy= array([\
    \ True, False, True, True, True])>\n```\n```\n\n从上面的输出可以看到，TensorFlow 遵循了它的“母语”——C/C++的规范：“非零即为真”，也就是说，只有“0”代表“False（假）”，其他所有数值，不论正负，统统都视为“True（真）”。\n\
    \n这里的“母语”是指，为了提升性能，TensorFlow 的大多数 API 函数是由 C/C++编写而成。"
