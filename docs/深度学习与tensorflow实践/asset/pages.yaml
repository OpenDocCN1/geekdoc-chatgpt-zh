  md: '为什么呢？简单来说，这是 TensorFlow 的一个编程约定，若成员首字母小写，则表明这个元素直接隶属于 TensorFlow 框架，是一级方法成员；若成员首字母大写，则表明该元素是一个设计好的类（Class），它还需要接着定义对象才能使用。如
    Variable 就是一个类，它也有自己的构造方法和成员方法。


    现在首先解释一下 tf.Variable 的两个属性：name 和 trainable。如前所述，tf.Variable 是一个变量类，它可以定义一个变量对象，这个对象名只要符合
    Python 命名规则即可。如果不对 tf.Variable 的 name 属性进行显式命名，那么 TensorFlow 内部会自动维护这套命名体系，以保证命名的唯一性和规整性。


    tf.Variable 还有一个布尔类型的属性 trainable，它是干什么用的呢？我们知道，变量型张量有很多用途，若某变量的 trainable 设置为
    True，则表明该变量是参与梯度运算的。因此，TensorFlow 会对它格外“关照”，对它进行优化。凡是被 tf.Variable 封装的变量，这个属性
    trainable 就默认为 True。待优化张量可视为普通张量的特殊类型。下面对范例 4-4 中的 tf.Variable 对象 my_state 的两个属性进行检测。


    ```

    ```

    In [1]: my_state.name  #显示 name 属性的值

    Out[1]: ''Variable:0''

    In [2]: my_state.trainable  #显示是否可被优化

    Out[2]: True

    ```

    ```


    当然，也可以在生成 tf.Variable 对象之初，设置 trainable = False，用以表明该张量不需要优化。需要说明的是，trainable
    是只读属性，即在 tf.Variable 对象诞生后，trainable 的属性值要“从一而终”，后期不许修改。


    值得一提的是，在前文，我们“诟病”了 TensorFlow 1.x 时代的计算图，而力荐 Eager execution（即时执行）模式。但凡事都有两面性，即时执行模式下的代码非常易读，但是也带来了执行效率低的问题。这是因为，代码需要依赖
    Python 的解释器来进行计算，无法对数据流以及计算图进行优化。为了在代码可读性和代码速度之间保持平衡，Tensorflow 2.0 引入了 tf.function
    这个概念。在代码第 06 行，我们用 lambda 表达式创建了一个简单的函数对象，该对象作为作为 tf.function() 参数，从而构建了一个简单的计算图。当然，我们也可以定义一个功能复杂的多行函数，然后将该函数名作为
    tf.function()的参数，从而构建一个相对复杂的计算图。


    事实上，我们还可以通过 Python 以@为标记修饰 function 注的方法来构建一个计算图，如下代码所示。'
