    # 6.1 Keras 与 tf.keras 模块


    如前所述，Keras 是一个主要由 Python 语言开发的开源神经网络计算库，最初由 F. Chollet 主持编写，它被设计为高度模块化和易扩展的高层神经网络接口（
    API ），使得用户可以不需要过多的专业知识就可以简捷地调用这些 API，从而快速完成模型的搭建与训练。


    Keras 分为前端和后端，其中后端一般是调用现有的深度学习框架实现底层运算，如 Caffe、CNTK、TensorFlow 等，前端接口是 Keras 经过抽象得到的一组统一接口函数。Keras
    可视为一个更加面向应用层的深度学习框架，它将常用的网络计算层实施封装，封装后的模块，如同乐高积木一般，使数据科学家可以像搭积木一样构建神经网络，而无须再考虑深度学习算法内部复杂的实现，从而更加专注于任务的业务逻辑，这极大地解放了数据科学家的生产力。正是由于
    Keras 的易用特性，2019 年前，在同类深度学习框架中，其市场接受度仅次于 TensorFlow。


    Keras 创始人 Chollet 本身是 Google 的一名员工。在 TensorFlow 2 之前，Keras 与 TensorFlow 的关系是既竞争又合作。在技术的世界中，通常风起云涌，迭代速度非常之快。“城头变幻大王旗”是常有之事。近年来，PyTorch
    异军突起，由于其易用性和卓越的社区支持，称霸学术界，在 CVPR、ICLR 和 ICML 等国际顶级会议论文中，使用率超过 60%，未来的使用率可能更高。TensorFlow
    的开发者已然感到后来者居上的凉风来袭。


    随后，Keras 和 TensorFlow 彻底结盟。为了提升 TensorFlow 的易用性，在 TensorFlow 2 版本中，Keras 正式被确定为
    TensorFlow 的高层唯一接口，取代了 TensorFlow 1 版本中自带的 tf.layers 等高层接口。也就是说，现在只能使用 Keras 的接口来完成
    TensorFlow 中神经网络的模型搭建与训练。在 TensorFlow 2 中，Keras 被整合在 tf.keras 子模块中。


    对于使用 TensorFlow 的开发者来说，目前的 tf.keras 可以理解为一个普通的子模块，其地位与其他子模块（如 tf.math，tf.data
    等）并没有什么本质差别。下文如无特别说明，Keras 均指代 tf.keras 模块，而不是原来的深度学习库 Keras。


