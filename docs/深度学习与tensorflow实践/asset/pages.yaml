    # 8.2 循序神经网络的发展历程


    谈到 RNN，这里需要提前讲明，它其实是两种不同神经网络的缩写。一种是时间递归神经网络（Recurrent Neural Network，RNN），另一种是结构递归神经网络（Recursive
    Neural Network，RNN）。请注意，很多资料也分别将它们称为“循环神经网络”和“递归神经网络”。在下文中，如果不特别注明，在提及 RNN 时，我们指的是“时间递归神经网络”，即“循环神经网络”。


    前文我们提到，RNN 的核心诉求之一，是能将以往的信息连接到当前任务之中。过往的知识对于我们推测未来是极有帮助的，不可轻易抛弃。顺应这个思路，我们也顺便回顾一下
    RNN 的发展历史，或许能从中觅寻到部分启迪。


    # 8.2.1 Hopfield 网络


    追根溯源，RNN 最早是受 Hopfield 网络启发变种而来的[2]。Hopfield 网络模型是 1982 年由美国科学家 J. Hopfield 提出来的。Hopfield
    网络是一种循环神经网络，从输出到输入有反馈连接。Hopfield 网络在反馈神经网络中引入了能量函数的概念，从而将最优化问题的目标函数转换成 Hopfield
    神经网络的能量函数，并通过网络能量函数最小化来寻找对应问题的最优解。


    Hopfield 网络提供了模拟人类记忆的模型。该模型的一个重要特点是，它可以实现联想记忆功能，即作为联想存储器。通过学习训练，当网络的权值系数确定后，即使输入的数据不完整或部分正确，网络也可以通过联想记忆给出完整的正确输出。事实上，Hopfield
    网络还是玻尔兹曼机（Boltzmann Machine）和自动编码器（Auto-encoder）的探路者。


    # 8.2.2 Jordan 循环神经网络


    1986 年，迈克尔·乔丹（Michael Jordan）①借鉴了 Hopfield 网络的


