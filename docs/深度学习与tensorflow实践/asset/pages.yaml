  md: '# 6.4.6 TensorFlow 中搭建模型的三种方式


    对前面理论层面的回顾，暂告一段落。接下来，让我们把视角重新回到 TensorFlow 的实战上来。在前文中，我们已经阐述了如何从 MNIST 中读取数据集，下面是时候构建模型了。


    > “Sequential model” 的翻译多有种，如“顺序模型”“序变模型”，本质上都是一个意思：模型中的不同层一个接一个顺序堆叠。


    在 TensorFlow 中，利用 tf.keras 模块可以有以下三种不同的模型搭建方式。


    第一种方式为顺序模型（ Sequential Model ），顾名思义，它是按顺序逐层搭建模型的，适用于绝大多数应用场景。


    第二种方式为函数模型（ Functional Model ），即像函数调用一样搭建模型。这里“Functional”还有一层含义，那就是“功能”。这种模型构造方式实现的功能更多，可以支持多输入层、多输出层及共享部分层等，顺序模型可视作函数式模型的简化版。


    第三种方式为子类模型（ Subclassing Model ）。即若 tf.keras 提供的模型不能适用于自己特定的工作场景，则可以把 tf.keras
    模块提供的模型当作父类，通过继承共享部分父类模型的特征，然后在子类中，个性化定制自己的模型。相比与前两种模型，这种模型构造方式更加复杂。


    这三种搭建模型的方法各有千秋，各有自身的应用场景，我们会在用到它们的时候给予详细介绍。


    # 6.4.7 常用的顺序模型


    我们首先来了解最简单、也最为常用的顺序（ Sequential ）模型。有些文献将“Sequential”译作“序贯”，翻译倒也非常形象，有种按顺序“鱼贯而入”的感觉。的确如此，顺序模型是由多个网络层的线性堆叠而成的，数据流在这些网络层中按照顺序流动，即第
    k 层的输出是第 k+1 层的输入，直到输出层。


    然后，在输出层中计算损失函数，看是否达到预期，如果没有达到预期目标（存在落差），那么在误差流（也是一种信息流）的指引下，又一次“鱼贯而出”，反向逐层调节网络权值。经过多次这样的循环，直至损失函数达到给定的阈值（或达到最大迭代次数）。


    比较有名的顺序模型包括（但不限于）LeNet[1]（杨立昆等人在多次研究后提出的最终卷积神经网络结构，通常特指 LeNet-5）、AlexNet[2]（2012
    年，由 Alex 和 Hinton 等人提出的网络结构模型，开启了深度神经网络的'
