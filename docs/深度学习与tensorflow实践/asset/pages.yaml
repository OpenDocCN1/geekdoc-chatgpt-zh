  md: '# 3.4.2 验证 Python 是否安装成功


    怎样确认 Python 已经成功安装了呢？通常，在打开的终端（对 Windows 系统而言，在运行窗口使用 CMD 命令；对 Linux 和 macOS 系统而言，开启一个新的
    shell 终端即可）中，输入 “python --version” 命令（注意，python 与随后的参数之间有一个空格，version 前有两个短线），会显示
    Python 的版本号，若能正确输出 Python 的版本号，则就间接证明 Python 已经安装成功。下面以 Linux 命令为例来说明。


    ```

    $ python --version

    Python 3.8.5

    ```


    上面的输出结果显示，我们成功安装了 Python 3.8.3。需要注意的是，由于 Linux 和 macOS 系统默认安装了 Python 2.7，因此若不更新系统的环境变量，则运行上述命令的结果可能是
    Python 2.7.5。这时，我们需要显式更新环境变量，命令如下。


    ```

    source ~/.bashrc

    ```


    接下来，在命令行输入 python，启动 Python 解释器。


    ```

    $ python

    Python 3.8.5 (default, Sep 4 2020, 07:30:14)

    [GCC 7.3.0] :: Anaconda, Inc. on linux

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    > 需要注意的是，在 Windows 系统中，命令不区分大小写，Python 与 python 等效。但在 Linux 和 macOS 系统中则相反，需要严格区分大小写，所以命令行中的
    “python” 字样必须全部小写。


    Python 解释器正常启动后会出现提示符（>>>），所以上面代码中显示 “>>>” 时，表明 Python 解释器已经“万事俱备”，只待用户输入语句了。事实上，大部分情况下，我们会使用
    Jupyter 这样的交互式编程环境或注入 PyCharm 这样的 IDE（集成开发环境），来开发和调试我们编写的 Python 程序。


    那么如何从 shell/CMD（终端）中退出 Python 呢？通常有以下两种方法。


    +   (1) 在 Python 终端输入命令函数：exit()或 quit()。

    +   >>> exit() #或用 quit()


    +   (2) 使用快捷键 “Ctrl+Z”（或 “Ctrl + D”）退出。'
