- pgno: 292
  md: '语言处理领域中，对于词的常见的表达方式有 3 种：① 用我们熟悉的独热编码表示；② 分布式表示；③ 词嵌入表示。下面我们分别来讨论这三种方式。


    # 8.10.1 独热编码表示


    在早期，词通常都表示成离散的独一无二的编码，也称为独热向量（One Hot Vector）。在前面的章节中，我们也曾介绍过，独热编码有点“举世皆浊我独清，众人皆醉我独醒”的韵味。即在编码方式上，每个单词都有自己独属的“1”，其余都为
    0。


    假设我们有 10 000 个不同的单词，排在语料库第一位的是冠词“a”，用向量 [1,0,0,0,...] 表示，即只有第一个位置是 1，其余位置（2 ~
    10 000）都是 0。类似地，排名第二的 “abandon”，用向量 [0,1,0,0,...] 表示，即只有第二个位置是 1，其余位置都是 0，如图 8-22
    所示。


    ![](img/aa01495b859013c80481c58ec0894987_292_0.png)


    独热编码的优点自然是简单直观。但问题在于它的高维、稀疏和正交性（Orthogonality）。从图 8-22 中可以看出，在词的向量空间上，每个向量只有一个“1”和非常多的“0”。很显然，这样的表达方法，数据显得非常稀疏。独热编码策略导致每个词都是一个维度。因此，向量空间的维度就等同于词典的大小。例如，若词典中有
    10 000 个单词，则这个词典的向量维度就是 10 000，每个单词的向量长度也都是 10 000。


    根据资料显示，若按照这种编码方式，则语言识别的维度有 2 万，PTB 的维度大概有 5 万，Big Vocab 的维度大概有 50 万，Google 1T
    的维度大概有 130 万。此外，在独热编码表示中，每个词都有一个唯一的编码，且彼此独立。但正因如此，词与词之间的相似性难以衡量。下面举例说明。为简化起见，我们假设
    “motel（汽车旅馆）”和 “hotel（宾馆）”的独热编码如图 8-23 所示。


    > 若内积空间中两向量的内积为 0，则称它们是正交的。


    在自然语言理解上，词 “motel” 和 “hotel” 都是指“提供客人住宿的地方”，即使它们有所不同，但语义肯定有相似的地方。但从图 8-23 可见，它们的独热编码没有任何交集（二者向量的点积操作等于
    0）。显然，按照这种逻辑推演，对于中文句子“我老婆非常漂亮”和'
