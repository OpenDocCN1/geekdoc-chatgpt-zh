  img_proc: true
- pgno: 299
  md: '![](img/aa01495b859013c80481c58ec0894987_299_0.png)


    图 8-29 基于 RNN 的语言模型的展开形式


    在图 8-29 中，上文信息(w1, w2, ⋯, w(t−1))通过 RNN 编码为 s(t−2)，它是上一个隐含层，代表着对上文的历史记忆。s(t−1)与当前
    w(t)相结合，得到(w1, w2, ⋯, w(t−1), w(t))的表示形式 s(t)，s(t)再通过 RNN 的编码得到预测的输出 y(t) 。


    从图 8-29 可以看出，只要我们愿意，基于 RNN 的语言模型就可以无限展开历史信息。这意味着，这类模型彻底打破了 NGram 模型对词窗口大小的限制，从而能更为充分地利用完整的上文信息。相应地，将获得比其他语言模型更好的性能。


    Mikolov 的研究显示，即使采用最为基础的 RNN 和最普通的截断 BPTT 优化算法（这里的“截断”表明 RNN 并非无限展开，而是仅展开若干个时间步，这样做的目的在于大幅度减小训练的开销），其性能也比
    NGram 模型的性能好。


    从前面的分析可知，RNNLM 可捕获更长的历史信息，从而获得更好的性能，这自然是其优势所在。但 RNNLM 也有其不足之处。因为它使用了 RNN，而我们知道，原生态的
    RNN 很容易产生梯度弥散。当然，这个问题已有比较好的解决方案了，那就是前文提到的 RNN 的升级版——LSTM 或 LSTM 的简化版本——GRU。


    # 8.12 实战：基于 RNN 的文本情感分类问题


    文本分类是自然语言处理的一个常见任务，它把一段不定长的文本序列变换为文本的类别。本书我们尝试完成它的一个子问题，即使用文本情感分类来分析文本背后作者透露的情绪（正面情绪或负面情绪）。该问题也称为情感分析（Sentiment
    Analysis），它有着广泛的应用。例如，我们可以分析用户对产品（如对电影的评价、对电商的商品评价）的评价，据此统计用户的满意度，或分析用户对股市行情的情绪，并用以预测接下来的股市行情。


    官方简称为 IMDb，但很多文献为了方便，全部大写这些字母，即为 IMDB。本书也遵循惯例，采用全部大写模式。


    在范例 8-1 中，我们使用经典的数据集 IMDb（Internet Movie Database，互联网电影资料库）作为文本情感分类模型训练所用的数据集[14]，然后训练
    RNN 网络，让其判断用户对某一部电影评论的情绪类型（如积极情绪或消极情绪）。下面我们逐步讲解范例的实现过程。'
