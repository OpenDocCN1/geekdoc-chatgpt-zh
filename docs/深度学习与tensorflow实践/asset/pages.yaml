- pgno: 198
  md: "终会有一个输出，在多分类任务中，如果不是直接比较数值本身的大小，而是比较这些值出现的概率，那么这个概率和它们原本的取值大小就是正相关的。最后，概率大者将被选中作为分类的依据，这种经过变换的最大值称为软最大值（Softmax）。\n\
    \n> Logistic Regression\n> \n> 通常译作“逻辑回归”和“对数几率回归”等，虽然被称为回归，但实际上是分类模型，常用于分类任务。\n\
    \n那么，这个 Softmax 是如何定义的呢？假设一个向量 C 有 k 个元素，zᵢ 表示 C 中的第 i 个元素，那么它的 Softmax 值可定义为\n\
    \n```\nSoftmax(z_j) = \\frac{e^{z_j}}{\\sum_j e^{z_j}}, (j=1,2,3,...,k) (6-1)\n\
    ```\n\n在数学上，Softmax 函数又称为归一化指数函数。如果该函数应用在分类领域，假设向量 C 中有 k 个元素，它就是 k 分类。对于机器学习领域常用的\
    \ SVM（支持向量机）或神经网络分类器，它在分类计算的最后输出部分，会对一系列的标签如“猫”“狗”“鸟”等，输出一个具体分值，如[4, 1, -2]，然后取最大值（如\
    \ 4）作为分类评判的依据，这个过程就是硬最大值分类。\n\n而 Softmax 函数有所不同，它会把所有的“备胎”分类都进行保留，并把这些分值实施规则化（Regularization），也就是说，将这些实数分值转换为一系列概率值（信任度），如[0.95,\
    \ 0.04, 0.00]，最后选择概率最大的数作为分类依据。Softmax 函数输出层示意图如图 6-7 所示。由此可见，其实 SVM 和 Softmax\
    \ 是相互兼容的，只不过是表现形式不同而已。\n\n![](img/aa01495b859013c80481c58ec0894987_198_0.png)\n\
    \n图 6-7 Softmax 函数输出层示意图\n\n对于一个长度为 k 的向量 [z₁, z₂, ..., zₖ]，利用 Softmax 函数可以输出一个长度为\
    \ k 的向量 [P₁, P₂, ..., Pₖ]。如果一个向量想成为一种概率描述，那么它的输出至少要满足两个条件：一是每个输出值 pᵢ（概率）都在[0,\
    \ 1]之间；二是这些输出向量之和等于 1，即 \\sum_j p_j = 1。\n\n对于向量 [z₁, z₂, ..., zₖ]，为什么 Softmax\
    \ 函数要取指数 exp 来做值的映射呢？这里主要有以下 3 个原因。"
  merge: -1
  img_proc: true
- pgno: 199
  md: '(1) 便于模拟概率值。因为概率不能为负值，而对于特征值 $z_i$，其本身的值可正可负，但通过 exp 函数的映射都能变成正值。即通过式（6-1）的变换，所有的概率都变成正值。


    (2) 为了计算方便，我们需要寻找一个可导的函数。这个原因和为什么用 Sigmoid 函数取代不可导的阶跃函数是一样的。exp 函数和 Sigmoid 函数不但可导，而且求导形式极其简单，极大方便了在损失函数中的求导计算。


    (3) 最重要的是，exp 函数是单调递增的，它能很好地模拟 max 的行为，而且它能让“大者更大”。其背后的潜台词是让“小者更小”，这有些类似马太效应，即“强者愈强、弱者愈弱”。这个特性对于分类来说尤为重要，它能让学习效率更高。


    举例来说，在图 6-7 中，原始的分类分值（特征值）是[4,1, -2]，其中“4”和“1”的差值看起来没有那么大，但经过 Softmax 函数“渲染”后，前者的分类概率接近
    96%，而后者的分类概率仅为 4%左右。而分值为“-2”的概率就更小了，直接趋近于 0。这正是 Softmax 函数的魅力所在。


    # 6.4.5 手写数字识别 MNIST 中的 Softmax 回归模型


    如前所述，在 Softmax 回归中，主要有两个步骤：第一，基于输入计算出一个用于判定分类的加权特征值；第二，将这个特征值转换为一个概率值。


    计算每个分类的加权特征值，其逻辑并不复杂。例如，如果某个像素的灰度值大，并且可以将其表示成某个数 n，那么输出单元和这个像素之间的连接权值就是正值。反之，如果某个像素灰度值大，但却不能将其表示成某个数
    n，那么它们之间的连接权值就是负值。


    这些权值的起起伏伏都是在教师信号（分类标签）的指导下，通过诸如 BP 算法训练学习得到的。由于一个图像只能激活一部分神经元，因此特定图像会激活特定神经元（某种程度上，可称为“物体记忆”），这类似于人脑对图像的识别。


    对于某张特定图片，我们可以把这些特征（或者说分类的证据）用公式表示出来，即


    ```

    evidence_i = \sum_j W_{i,j}x_j + b_i      (6-2)

    ```'
