  md: '# 代码分析


    类似于范例 7-1，我们也把模型搭建的过程封装为一个类——CNN。在这个类中，我们主要使用 Keras.layers 提供的 Conv2D（卷积层）与 Dense（全连接层），其中卷积层有
    3 个，全连接层有 2 个。卷积层中穿插了两个池化层，使用的是 MaxPooling2D()。为什么使用 3 个卷积层和 2 个全连接层呢？其实，这里没有什么道理可讲，它们是需要多次尝试而获得较好性能的超参数。


    在代码层面，可以看到，每个 Conv2D 和 MaxPooling2D 的输出都是一个三维的张量尺寸(height, width, channel)。


    Conv2D 是一个常用的二维卷积方法，它有很多参数，我们仅仅给出常用的参数，没有明确给出的参数通常都配有“无伤大碍”的默认值，如下所示。


    ```

    keras.layers.Conv2D(filters, kernel_size, strides=(1, 1), padding=''valid'', ...)

    ```


    在该方法中，filters 表示卷积中卷积核（或称过滤器）的输出数量，kernel_size 是一个整数，或者是 2 个整数表示的元组或列表（用以指明二维卷积窗口的宽度和高度）。若该参数是一个整数，说明这是“方形”卷积核，即所有空间维度指定相同的值。strides
    是一个整数，或者是 2 个整数表示的元组或列表，指明卷积沿宽度和高度方向的步长。padding 表示填充策略，这个参数可选值为 “valid” 或 “same”（参数字符串的大小写敏感）。


    当使用该层作为模型第一层时，需要提供 input_shape 参数。例如，当 data_format="channels_last" （通道参数在最后面）时，input_shape=(128,
    128, 3)表示 128×128 的 RGB 三色图像。


    而在第 20 行，输入层的尺寸设置为 input_shape=(28, 28, 1)，它表明这是一个 28×28 的单色图片。需要注意的是，这里的手写数字并没有被展平成
    28×28=784 这样的一维结构，即没有破坏图片的二维结构信息，而是利用了更多的图片信息，我们有理由相信，该算法的性能会更好。


    但在连接到全连接层前，需要将数据展平，因此使用了 layers.Flatten()（第 28 行，读者可参考图 7-23 获得更多感性认识）。Flatten
    层会将三维的张量转换为一维的向量。例如，在展平前，三维张量的尺寸是(3, 3, 64)，展平或一维向量后的尺寸为(576)，紧接着使用 layers.Dense
    层，构造了 2 层全连接层，逐步地将一维向量的数量从 576 转换为 64，再转换为 10。


    在网络的后半部分，相当于构建了一个输入层为 576（展平层），隐含层为 64，输出层为 10 的普通 3 层前馈神经网络。最后一层的激活函数是'
