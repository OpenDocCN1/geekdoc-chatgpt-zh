    | 2 | 开展人工智能挑战赛，设立德国人工智能奖项“人工智能德国道” |

    | 3 | 资助基于人工智能和大数据的高校教育数字化创新 |

    | 4 | 将人工智能作为课程内容促进学术人才的培养 |

    | 5 | 基于人工智能，构建职业教育在线技能提升网站 |

    | 6 | 开展关于“职业教育数字平台”的创新挑战赛，构建数字继续教育空间 |

    | 7 | 与各州协商提高人工智能教授的工资水平 |

    | 8 | 设立针对青年女性的人工智能教育计划 |


    来源：德国联邦政府官网


    # 印度：信息技术产业发达，但本土 AI 人才培养资源有限，人才外流严重


    印度是世界上人口第二大的国家，也是世界上贫困人口最多的国家。在人口众多的情形下，印度政府实行8年初等义务教育，之后是2年初中、2年高中及3年大学，研究生阶段通常为2年硕士和3年博士。但印度的辍学率很高，根据2018年印度发布的《人工智能国家战略：全民人工智能》报告，小学辍学率达49.6%，中学为29.3%。但就是辍学率如此之高的一个国家，印度的信息技术产业却位于世界前列，甚至培养出了世界上顶尖的计算机人才，比如谷歌、微软的CEO都是印度人。


    印度顶尖人才的培养得益于其拥有跻身世界一流的高校，如世界闻名的印度理工学院，培养了大量的计算机相关领域人才，流入硅谷和世界各地。近年来，印度政府在国家层面发布人工智能报告并专门对人工智能在教育领域的应用进行了规划。且在2015年就成立了国家转型研究院，可见其对人工智能的重视程度。在近十年间CSRankings
    AI 领域世界排名前两百高校中，印度七所印度理工学院均在其中，均在 100-150 名左右，本土的 AI 人才培养实力不容小觑。


