  md: '# 应用场景创新变革之三


    # 应用场景在教育的空间环境上扩展


    人工智能教育应用创新场景的变革还体现在教育的空间环境上。2020 年突如其来的新冠疫情肆虐全球，目前全球疫情控制态势尚不明朗，对于学习者而言，原有仅在线下教室、学校的教学方式在现下各国的防控措施中难以实现，因此，在线的学习方式成为线下教学的有益补充，居家隔离学习和办公使得学习者在家庭场景中的时间变长，教育的空间环境以学习者为核心逐渐扩展到家庭、室外环境中。


    亿欧智库观察发现，在过往聚焦与家庭场景的人工智能教育产品中，大多存在于智能家居的相关产品中，比如智慧音箱、智能穿戴设备等。而原有线下学习场景中所涉及的智能终端、平台工具软件以及在线的教育教学资源都需要在家庭场景中得到新的释放。


    其中，以智能教育硬件在这一年的的发展和迭代尤为明显。事实上，智能教育硬件并不是全新的事物，早期的电子辞典、学习机、平板也曾渗透到各个家庭之中。


