  md: '# 各国广泛开展科学素养培养，探索形成完整的人才培养体系


    # 中国：AI 人才培养体系逐步形成，高校先行


    高校是中国培养人工智能产业人才的主要场所，据不完全统计，截至2020年12月，已有145所高校设立了人工智能学术组织，包括人工智能学院96所，人工智能研究院66所，其中19所高校同时设立了人工智能学院和人工智能研究院，亦有院校设立了两个人工智能研究院。


    近年来，随着中国对人工智能的重视程度不断提高，人工智能课程逐步延伸到中小学阶段，2017年8月，中共中央、国务院印发了《新一代人工智能发展规划》，其中明确提出应逐步开展全民智能教育项目，在中小学阶段设置人工智能相关课程并逐步推广编程教育，2018年1月，教育部印发了《普通高中信息技术课程标准（2017年版）》（简称《新课标》），《新课标》中增加了数据与计算等必修课内容以及数据结构、人工智能、开源硬件设计等AI相关选修课内容。当前阶段，中小学校人工智能教育主要以信息技术/创客课程的形式或专门的人工智能课程形式展开。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_51_0.png)


    来源：亿欧智库


    # 美国：AI 人才培养体系相对健全，本土培养与外部人才引进并重


    美国人工智能发展较早，产业人才相对充裕，尤其是高校人才培养，根据QS全球computer science& information systems专业综合排名情况来看，2020年全球开设计算机科学与信息系统相关专业的高校共收录了601所，其中美国占据了212所，对于计算机领域人才向人工智能的转化具有极大的优势。另一方面，美国对
    AI 人才的培养始于 STEM 教育，2007-2011年，美国国家科学委员会先后发表了三份报告，提出了促进 STEM 教育的国家行动计划，将 STEM 教育从大学本科阶段拓展到基础教育阶段，并制定了《K-12科学教育框架》和《新一代科学教育标准》STEM教育促进项目在美国全面展开。


    从企业培养角度来说，美国企业开展人工智能研究和培养的时间也要早于中国企业，谷歌、微软、IBM等企业十年前已在布局人工智能。


    美国AI人才培养还有一个特色，在于其对国际人才的引进，为从事特定技术领域（其中包括AI领域）的高精尖人才提供移民签证途径，据公开资料显示，美国最大的AI人才库中有一半以上是外国人。'
