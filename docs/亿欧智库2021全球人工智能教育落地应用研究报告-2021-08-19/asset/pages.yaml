  md: '# 人工智能技术处于感知增强时代


    目前，人工智能技术的发展尚处于第三次热潮中，而AI技术是人工智能教育发展的必要保障，因此，亿欧智库将从AI技术本身及其在教育场景中的应用变化来分析人工智能教育行业的发展历程。


    亿欧智库：人工智能发展阶段


    | 发展阶段 | 感知时代 | 感知增强时代 | 认知时代 |

    | :--- | :--- | :--- | :--- |

    | 基础理论 | 深度学习理论

    有监督的学习方式 | 迁移学习

    对抗学习

    多模态学习

    深度强化学习 | 自监督学习

    胶囊网络

    类脑 |

    | 特点 | 需要依赖大量标注数据 | 多元学习方式并存

    技术间交叉融合 | 学习方式、理论体系

    的颠覆创新 |


    来源：中国信通院《人工智能核心技术产业白皮书》，亿欧智库


    从人工智能的发展阶段来看，当前正处于由感知时代向认知时代过渡中的感知增强时代，数据的质量和规模得到提升，多元学习方式并存，减少对数据量的依赖，弱化人为干预的自监督学习将成为人工智能技术下一时期发展的关键。这将为AI技术对教育行业的赋能提供有力支持。


    而落脚到人工智能技术在教育行业的应用，根据2020年发布的Gartner AI 技术成熟度曲线中各AI技术方向的预期成熟时间，亿欧智库选取了在教育场景中应用较多的技术方向评估其发展潜力和市场空间。


    亿欧智库：AI 在教育领域的应用程度


    ![](img/8ca3007dbd225addc1b60b54549d80f4_12_0.png)


    来源：亿欧智库


    事实上，AI 在教育领域的应用程度还有很大的提升空间，一方面，由于教育行业的特殊性，AI的应用会更加谨慎，这使得技术实现产业化应用所需的时间变长，从另一方面来看，AI对教育行业的促进和发展并不体现在某一单一技术的极致应用，而是逐渐向场景化综合生态发展的方向演进。


    AI 技术对教育场景的深入渗透正在倒逼技术间相互的融合，让行业的技术门槛不断提高，与此同时，各类基础技术服务平台逐渐走向成熟，人工智能头部企业构建开源开发框架生态，让人工智能教育行业的进入门槛逐渐降低。'
