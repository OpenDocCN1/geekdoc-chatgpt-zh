  md: '# 全球人工智能教育行业概况


    # 教学场景是核心，挖掘学习者潜在需求成重点方向


    从各国家/地区侧重角度来看，各国的人工智能教育应用仍更多的集中在教学相关场景，但整体应用场景更加多元。在涉及到能力评测领域，美国和印度的AI教育企业相比其他两个国家/地区更为看重；印度的AI教育企业更关注个人的人生规划管理领域；中国AI教育企业更看重教学领域的技术应用，对能力评测方向关注度较低。


    从具体的落地应用场景来看，从简单替代教师重复性劳动转向主动为学习者的潜在需求提供解决方案，更讲求精准化与个性化。对于个性化教学、智慧课堂、自适应学习、智能职业生涯规划等需要大量用户数据信息的应用场景越来越广泛。


