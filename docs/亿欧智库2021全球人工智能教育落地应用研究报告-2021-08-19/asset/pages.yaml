  md: '# 印度人工智能教育企业典型案例


    # BYJU''S


    Byju''s是一家K12在线教育平台，为6-12年级的学生提供备考指导，覆盖的考试科目包括JEE、IAS、GRE和GMAT等，涉及的教育学科主要有物理、化学、生物和数学。推出的同名学习APP可以满足K12学生的学习需求，并还能根据学生的熟练程度和能力为学生制定个性化的学习方案。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_39_0.png)


    Byju''s会根据每个用户不同的学习程度推荐不同难度的课程，也会根据用户的学习习惯安排不同类型的课程，为喜欢视觉学习的安排视频教学，为喜欢指导的安排教师授课。同时，Byju''s拥有独具特色且技术含量非常高的原创视频课程，视频以真人老师和动画相结合的形式呈现出来，老师讲课时在空中可画出任意3D的图形表格，也可随意操控上课所需的任何工具材料。


    # Unacademy


    Unacademy成立于2015年，总部位于印度班加罗尔，主要帮助学生备考竞争性考试，包括公务员、银行、医学、工程以及编程等考试。目前，Unacademy平台上有47000多名老师，他们用14种以上的语言为印度5000个城市的学生提供教学服务。Unacademy的营收渠道是订阅服务，2017年推出
    Plus Subscription，让用户参与直播课程学习，与教师实时互动。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_39_1.png)


    Unacademy是印度Top2的教育科技独角兽，在估值暴增的2020年，Unacademy进行了6次收购，分别是在线备考平台Kreatryx和NeoStencil、在线编程平台CodeChef、医学考试备考平台PrepLadder、备考平台Coursavy，Unacademy还对K12学习平台Mastree进行了500万美元的战略投资，收购其多数股权。'
