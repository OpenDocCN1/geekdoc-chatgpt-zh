    因此，亿欧智库汇总了2020-2021年7月中国部分智能教育硬件的发布情况，从产品形态上来看，出现了作业灯、作业辅导机器人等产品，而从产品的功能上，我们发现，智能教育硬件在以往多聚焦于学习的辅助功能上，例如作业批改、知识点查询等等，而在近一年的时间里，智能教育硬件出现呈现出注重与学习者的交互体验；减少娱乐化内容，专注于学习过程；对学习任务的分解更为科学等趋势。这也得益于、语音识别等技术自身的发展。'
