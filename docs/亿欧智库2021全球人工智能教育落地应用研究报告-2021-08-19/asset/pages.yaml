  md: '# 应用场景创新变革之二


    # 由教学相关环节向教与学的核心环节延伸


    人工智能在教育领域的应用场景众多，我们将学习者从学习到人生规划的全过程分为了教学、学习、考试、能力测评、人生规划管理五个阶段。通过对每个阶段的人工智能应用方式和应用难点的分析，亿欧智库认为，目前人工智能教育的应用场景中，越是靠近教学和学习，技术难度越大，而在能力测评和人生规划管理方向还有很大的挖掘空间。


    亿欧智库：人工智能教育产品的应用方式及难点


    ![](img/8ca3007dbd225addc1b60b54549d80f4_15_0.png)


    来源：亿欧智库


    事实上，通过我们对市场上人工智能教育产品的应用方式和应用难点进行分析后发现，目前人工智能在教育领域的赋能仍然对数据量有较大的依赖，对于个性化程度更高的应用方向智能化的精确程度有待提升，而对于评价和规划管理方向仍较多的停留在对过往数据的分析计算，能预测分析得到的有效分析较少，且这两个方向还需依赖教育科学的发展，形成更为客观、准确的评价标准的体系。


    而从消费者的角度来看，多通过产品宣传和试用感受来评价产品，大部分人工智能教育产品技术能力并不透明，尤其是在教学和学习两大应用场景下，目前产品聚集度较高，但出于对学习结果的重视，消费者对人工智能教育产品中技术实力的容忍程度更高，而对非刚需性的产品则容忍程度有所降低。


