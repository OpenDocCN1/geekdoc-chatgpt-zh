  md: "# 四、全球人工智能教育产业人才培养\n\n+   欧洲地区\n+   2017.1 《在英国发展人工智能》\n+   · 报告建议设立业界资助的大学AI硕士课程，在英国领先的大学中设立超过200个AI博士学位，发展AI在线课程和持续的专业培训等\n\
    +   \n+   2018.4 《英国人工智能发展的计划、能力与志向》\n+   · 提出要重视数据科学和计算机科学、提高全民数字素养、将人工智能纳入学校课程、重视人工智能教师发展等\n\
    +   \n+   2018.4 英国《人工智能行业新政》\n+   · 要依托世界一流的高等教育体系培养人工智能人才，设立人工智能硕士、博士学位，并提供奖学金支持；加强产学研合作育人；推动STEM建设\n\
    +   \n+   2018.7 欧委会《人工智能合作宣言》\n+   · 欧委会鼓励成员国开展教育和培训体系改革，以适应技术进步给劳动力结构带来的转变。欧委会将支持商业与教育的合作，以吸引和留住更多的人工智能专业人才，并在欧洲社会基金的资助下建立专门的培训计划\n\
    \n+   印度\n+   2018.6 《国家人工智能战略》\n+   · 增加在教育技术方面的支出，吸引来自国外的研究人员，鼓励研究和学术交流。鼓励大学建立在线课程，同时建立人工智能培训标准，向培训机构提供认证服务\n\
    +   \n+   2020.7 《国家教育政策2020》\n+   · 响应各级教育系统对于整合技术的需求，并提出建立国家教育技术论坛（NETF）以牵头教育技术的部署和相关方案的实施\n\
    \n# 基于产业发展的人工智能人才分类\n\n人工智能产业发展的核心动力在于人才，一方面随着人工智能产业的发展会带动培养出更多的人工智能人才，另一方面人才的培养可以进一步反哺人工智能产业的发展。人工智能产业人才可根据稀缺程度分为四个层面，最为稀缺的是科学家人才，他们最具创新能力，一般由高校培养，其次是算法人才和应用型人才，既有企业也有高校进行培养，最后是数字蓝领人才，他们大多数分布于其他产业，通过培养可以转化为人工智能产业人才。\n\
    \n![](img/8ca3007dbd225addc1b60b54549d80f4_50_0.png)"
