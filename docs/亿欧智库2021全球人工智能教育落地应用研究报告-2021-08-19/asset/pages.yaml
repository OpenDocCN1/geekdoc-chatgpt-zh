  md: '# # 全球范围内人工智能教育行业较发达地遴选标准


    # ## 遴选条件3——行业发展潜力


    从政策制定到技术成果研发再到某一细分行业的落地应用实践，人工智能教育行业的发展需要时间、人力、资金的不断投入。因此，从长远来看，我们认为衡量各国家和地区人工智能教育行业的发展潜力可以从教育经费投入，产业的AI技能普及情况来考量。


    亿欧智库认为，教育作为每个国家的软性基础设施建设，在不受到战争、经济危机等大的社会动荡的前提下，在2-3年内一个国家对于教育的投入程度基本保持一个较为均衡的水平，同时基于数据完整性的考量，选择经济合作与发展组织在2020年全球教育概览中的各国公共教育经费投入水平作为参考并结合各国统计局公开数据进行整理。


    # ### 亿欧智库：全球主要国家公共财政教育支出占公共支出的百分比


    ![](img/8ca3007dbd225addc1b60b54549d80f4_10_0.png)


    来源：经济合作与发展组织，各国统计局，亿欧智库


    统计结果显示，在公共财政教育投入上，经合组织国家平均水平为10.7%，欧盟成员国平均为9.6%，中国14.8%，美国12.1%，由于部分国家并未公布公共支出的细项，结合相关新闻发现印度在2013年公共教育支出占政府支出的比例为14.1%，印度财政部长在2020-21财年的财政预算中提议在这一财年印度教育预算投入9930亿卢布。


    # ### 亿欧智库：2015-2020年各行业相对AI技术能力及率


    ![](img/8ca3007dbd225addc1b60b54549d80f4_10_1.png)


    来源：LinkedIn，亿欧智库 数据释义示例：普及率为2意味着该国人工智能技能的平均普及率是全球同类职业平均普及率的2倍。


    从产品类型来看，人工智能教育行业的产品大致可以分为硬件、软件服务和教育内容，AI技能在各行业的AI技能普及情况是行业发展潜力的重要指征，根据LinkedIn2015-2020年对全球各国家人工智能技能普及率的汇总数据显示，在教育、硬件与网络、软件与IT服务行业各国间相对的AI技能普及率印度、中国、美国、欧洲地区均有较大优势。'
