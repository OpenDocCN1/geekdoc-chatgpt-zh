  md: '# 五、研究结论


    # 关于人工智能教育行业的8点观察


    # 8、全球科学素质培养体系逐步完善，理论与应用多元并重


    储备量是 AI人才数量能否大规模提升的前提，而储备量的提升一方面来自于社会对于人工智能技术的普遍认知，这需要系统的科普知识和科学素养培养体系，另一方面则来自于学习者对于人工智能的学习意愿和兴趣。


    目前，全球科学素养培养体系逐渐完善，由于AI是一门跨学科领域的技术，科学素养的培养较为综合，各国均在探索完善适应各国国情的科学素养培养体系。科学素养的培养方式也愈加多元，课程教学、科学实验、科创比赛、资格认证等培养方式让学习效果外化，结合理论与实践多方面掌握知识。


    在具体的课程教学上，我们通过对资料的整理和分析发现，越来越多人工智能人才培养相关的教育产品通过游戏化的互动课程，增加学习者的体验感和趣味性。


    亿欧智库：部分国家/地区计算思维纳入教育战略计划的方案


    | 国家 | 目的 |

    | :--- | :--- |

    | 美国 | 投资40亿推广编程教育，为全美国K12阶段的学生提供完整的STEAM科学教育 |

    | 英国 | 涵盖学前班、小学、初中和高中，每个阶段都有明确的目标能力 |

    | 日本 | 《新一期学习指导要领解说》，要求中小学需要开展STEAM教育课程，《学习指导要领》要求在2020年在小学课程中开设计算机编程课 |

    | 欧盟 | 超过15个国家在学校教育课程体系中增加编程学习内容 |

    | 韩国 | 从2018年开始全面推广中学的计算机编程教育课程 |

    | 阿根廷 | 将数字化学习纳入各级义务教育 |

    | 新加坡 | 在160所学前中心引入机器人，从2017年开始的中小学考试中加入编程考试内容 |


    来源：根据公开资料整理


