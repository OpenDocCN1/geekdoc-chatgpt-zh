  md: '# 三、全球人工智能教育行业分析


    亿欧智库结合统计数据和具体的欧洲地区企业信息有以下几点发现：


    +   中国AI教育企业融资轮次目前多处于C，D，E轮，占比接近50%，同时融资轮次在F轮以上公司占比同样高达25%，历经至少三轮融资的AI教育企业在中国占比超过四分之三，反映出中国AI教育产业已趋于成熟，成长及成熟型公司已占据市场。


    +   融资轮次在A，B的中国AI教育企业占比约为29%，占比数额同同样不小，说明中国AI教育行业竞争依然激烈，仍有大量创业者看好并涌入该行业。


    +   中国人工智能企业融资额在1亿美金以上的企业多达29家，其中好未来作为教育行业龙头，融资额高达38亿美金。


    +   中国人工智能教育企业融资额普遍分布在1千万以上，远高于其他地区的融资额展现出中国资本方对智能教育行业的热衷和中国政府对教育改革的决心和教育信息化发展的大力推动


