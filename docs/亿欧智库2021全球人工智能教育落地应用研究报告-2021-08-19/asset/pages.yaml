  md: '# Lambda School


    Lambda School是一家编程培训服务商，为学员提供软件开发在线教学，致力于培养软件工程师，其中不乏机器学习和人工智能等课程。Lambda School时下在全球都很流行，最先开创了新型高等教育模式，在这种模式下，学校对学生进行投资，而不是反过来由学生交学费来上学。可以说它是一个学校和投资基金的结合体，他们的任务是找到天赋尚未被挖掘或未充分利用的人才，他们通过资助高等教育来为有才能的学生承担就业风险，为世界上迫切需要人才的职业提供沉浸式的准备，为全球CS岗位提供专业人才。


    # 亿欧智库：Lambda School 人才培养特色


    ### 在线培养

    Lambda school 的课程100%为线上课程，除了课程某个小阶段可能会线下培养


    ### 教育投资

    先免费培养，工作后年收入达5万美元收取一定费用，但最高不超过3万美元


    ### 规范管理

    Lambda school 对于学生的申请实行批准制，会考察学生的认知能力和学历背景，同时对于学生的毕业标准也有一定的要求


    ### 企业对接

    Lambda school 会进行一定的企校对接，便于学生更好的找到工作


    Lambda School的产品主要是各种在线的编程课程，在培养学员的同时也与企业进行对接，为企业输送计算机领域人才，而采用工作后收取一定费用的方式被视为是一种教育投资。Lambda
