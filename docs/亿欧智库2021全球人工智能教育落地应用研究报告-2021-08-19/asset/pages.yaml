  md: '# 全球范围内人工智能教育行业较发达地遴选标准


    # 遴选条件2——技术与产业发展成熟度


    人工智能教育行业的发展与各国家和地区人工智能技术的先进程度、技术相关产业的发展程度息息相关，人工智能作为一项跨学科的新兴技术，在重点难技术的突破上无疑需要更强的技术实力。因此，我们将技术与产业发展的成熟度作为衡量人工智能教育行业较发达地区的重要指标。


    根据斯坦福大学发布的《人工智能指数2021年年度报告》结合微软学术图谱(Microsoft Academic Graph，MAG)的数据，从2000-2020年全球
    AI 期刊出版文献数据来看，AI 相关的文献数量在20年间增长了约3.5倍，按照地理区域分布来看，自2017年以来，中国在人工智能期刊出版文献中所占份额居世界首位，2020年为18.0%，其次是美国（12.3%）和欧盟（8.6%）。值得注意的是，据微软学术图谱2020年数据显示，从人工智能期刊引用比例的角度，2020年中国(20.7%)首次超过美国(19.8%)。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_9_0.png)


    任何一项技术从研发到落地应用都离不开产业相关配套设施的不断成熟，而一个产业成熟与否涉及的因素众多，此处仅以全球人工智能企业的数量作为判定的标准，中国信通院数据研究中心监测的数据表明，截至2020年11月，全球人工智能企业共计5896家，其中美国2257家，中国1454家，英国430家，加拿大307家分别前四。从单一城市分布来看，北京是拥有人工智能企业最多的城市。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_9_1.png)'
