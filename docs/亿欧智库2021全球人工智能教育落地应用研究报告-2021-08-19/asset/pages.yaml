  md: '# 德国：AI 人才对于产业的适应性更强，人才培养措施较为全面、完善


    德国常以职业教育闻名，其职业教育体系全球领先。在德国一般同龄人中20%为大学毕业生，将近80%接受的是职业教育，通过这种方式培养了大量的技术型人才，为其工业腾飞奠定了扎实的基础。随着人工智能的战略性地位逐渐提升，德国近年来也开始在教育领域加大对人工智能领域人才的培养。


    2018年11月，德国的联邦政府首次发布《联邦政府人工智能战略》，2020年12月进行了更新，重新确定了专人人才培养等5个方面的措施，人才培养方面，主要通过高等教育和职业教育来培养更多人才。


    亿欧智库：《联邦政府人工智能战略》更新版人才培养措施


