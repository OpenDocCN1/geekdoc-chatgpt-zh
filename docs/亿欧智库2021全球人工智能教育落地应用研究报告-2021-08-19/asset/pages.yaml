  md: '# 序言

    INTRODUCTION


    2019年5月，由中国政府与联合国教科文组织合作在北京举办国际人工智能与教育大会上，来自全球100多个国家、10余个国际组织的约500位代表共同探讨智能时代教育发展大计，审议并通过成果文件《北京共识——人工智能与教育》，这是联合国教科文组织首个为利用人工智能技术实现2030年教育议程提供指导和建议的重要文件，形成了国际社会对智能时代教育发展的共同愿景。共识中提到，必须利用新兴技术强化教育体系、拓展全民受教育机会，提高学习质量和效果以及强化公平和更高效的教育服务供给。


    2020年新冠疫情肆虐全球，线上学习成为常态，后疫情时代，人工智能等新技术让人类看到了教育变革发展的巨大潜能。2019年发布的《中国教育现代化2035》中提到的要实现规模化教育和个性化培养的有机结合，随着人工智能与教育的融合不断加深，教育正在离真正的个性化、规模化、高效率越来越近。


    而当技术与教育的结合越来越紧密之时，我们更应思考人工智能教育发展的目的是什么以及如何使得技术更好地赋能教育行业，推动人才培养模式的改革。与此同时，人工智能技术也赋能到越来越多的领域，产业的升级更是离不开产业人才的输送，人工智能人才的培养和储备已成为世界各国新的竞赛。


    上海开放远程教育工程技术研究中心一直致力于与开放远程教育相关研究，近几年在先进教育技术领域取得重要进展，此次，亿欧智库邀请上海开放远程教育工程技术研究中心作为学术指导单位，从人工智能在教育行业的应用落地和人才培养的角度，与各位一同探讨2021年全球人工智能教育行业的落地应用情况，并对其中具有代表性的企业进行梳理和介绍，同时给出我们的观察和建议。'
