  md: '# 四、全球人工智能教育产业人才培养


    在各国人工智能教育行业飞速发展的过程中，持续不断的人工智能人才的输入是该领域奔涌向前的前提。


    本章中，亿欧智库将概述全球重点国家在人工智能教育人才培养上的政策、培养体系等概况，通过对比我们发现，目前在人工智能人才培养上中国与美国有显著的优势，因此，本章还将就中国与美国在人工智能人才培养上的差异进行比较说明。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: "# 人工智能产业人才培养概况\n\n在亿欧智库 2019 年发布的《全球人工智能教育行业研究报告》及 2020 年发布的《全球人工智能人才培养研究报告》的基础上，我们观察到，人工智能人才的培养最终都要服务于产业的升级迭代，因此，本次报告亿欧智库将主要从人工智能人才服务产业的角度分析目前全球人工智能人才培养的概况。\n\
    \n事实上，全球人工智能教育领域较发达的国家和地区都已逐渐将人工智能人才的培养规划到了国家的顶层战略之中。目前，基本上所有的发达国家以及较大的发展中国家都已经提出了相关的人工智能产业政策，在产业政策大多对AI人才的培养进行了部署，AI人才培养已经被放到了一个新的高度。亿欧对部分人工智能产业较为发达的国家政策进行了梳理。\n\
    \n+   中国\n+   2018.4《教育信息化2.0行动计划》\n+   - 完善课程方案和课程标准，充分适应信息时代、智能时代发展需要的人工智能和编程课程内容\n\
    +   \n+   2018.4《高等学校人工智能创新行动计划》\n+   - 进一步强化高校基础研究、学科发展和人才培养方面的优势，进一步加强应用基础研究和共性关键技术突破，不断推动人工智能与实体经济深度融合，为经济发展培育新动能\n\
    +   \n+   2020.1《关于“双一流”建设高校促进学科融合加快人工智能领域研究生培养的若干意见》\n+   - 贯彻落实党中央、国务院关于加快发展新一代人工智能的重要部署，推动“双一流”建设高校着力构建赶超世界先进水平的人工智能人才培养体系，加快培养勇闯“无人区”的高层次人才\n\
    +   \n+   2020.10《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》\n+   - 事关国家安全和发展全局的基础核心领域，制定实施战略性科学计划和科学工程，进一步推动人工智能发展，实行更加完善的人才制度，培养造就更多国际一流的战略科技人才、科技领军人才和创新团队\n\
    \n+   美国\n+   2019.2《维护美国在人工智能时代的领导地位》\n+   - 训练当前和未来几代的美国工人，使其掌握开发和应用人工智能技术的技能，从而使他们为当前的经济发展和未来的工作做好准备，同时挑选和资助从事人工智能研发的年轻大学教员的项目\n\
    +   \n+   2019.6《国家人工智能研发战略计划》更新\n+   - 推动人工智能研发人员发展，包括那些致力于人工智能系统和与他们一起工作的人员，以维持美国的领导地位\n\
    +   \n+   2019.8《未来20年美国人工智能研究路线图》\n+   - 设置适合不同群体的人工智能课程，制定人工智能相关课程标准；制定人工智能领域研究生的招聘和留用方案，为支持和保留人工智能教师提供更多资源；培训高技能的人工智能工程师和技术人员\n\
    +   \n+   2020.6《国家安全创新途径法案》\n+   - 为从事保护国家安全方面重要工作的非公民建立获取移民签证的途径，如从事特定技术领域（AI、量子信息科学、生物学、机器人技术等）的学生或专业人员提供永久居留的途径"
