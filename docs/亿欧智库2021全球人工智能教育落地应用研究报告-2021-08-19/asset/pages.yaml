  md: '# 应用场景创新变革之一


    # 同一应用场景技术成熟度提升，功能相互整合


    而从具体的应用场景来看，亿欧智库在2019年研究内容的基础上，再次对部分人工智能教育场景的功能应用成熟度进行评价。我们发现，在拍照搜题、自适应学习、语音互动这样已经存在已久的场景中，AI
    的技术成熟度有所提升，而对教育环节本身的依赖程度有所降低，以拍照搜题为例，已经不单单是在教育产品中出现，类似夸克这样的搜索引擎也在不依赖教育过程数据的情况下开发出类似的产品。


