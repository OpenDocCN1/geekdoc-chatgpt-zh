  md: '# Duolingo duolingo


    Duolingo是一款语言学习工具软件，其App总下载量逾5亿次。2011年，Duolingo创立于美国匹兹堡，2001年由Luis von Ahn 和Severin
    Hacker共同创办。 Duolingo提供40种语言课程，包括英语、日语、韩语、法语等大众语言，也包括威尔士语、纳瓦荷语等小语种和濒危语言。2021年下半年，粤语课程将上线。


    # 亿欧智库：Duolingo重大产品发展路线


    ![](img/8ca3007dbd225addc1b60b54549d80f4_27_0.png)


    来源：Duolingo S-1文件


    语言学习和众包翻译结合起来，当一位Duolingo的用户掌握了一种新的语言后，他们就可以帮助他人翻译网络上的文档。最终能将互联网上的内容能够被翻译成各种主要语言。


    # 亿欧智库：Duolingo产品设计理念


    +   丰富的学习体验、稳健的教学方法（Diverse learning experiences informed by robust pedagogy）：Duolingo的学习体验是由公司内部的学习科学和第二语言习得的内部专家团队设计。Duolingo的课程内容与欧洲共同参考框架（CEFR）一致，这是一种语言能力的国际标准，每门课程的教学结构都是独特的。


    +   量化学习结果和效果（Measurable learning outcome）：2020年，Duolingo进行了一项正式的研究，以评估Duolingo与传统大学语言课程相比的有效性。公司发现，Duolingo学习者在学习法语或西班牙语在第四学期结束时的熟练程度得分与美国大学生相当。此外，学习Duolingo的学生达到这个水平的时间只有对比大学生的一半左右。


    +   精美的设计和引人入胜的故事（Beautiful design and engaging storytelling）：从每个按钮的精确形状和颜色，到祝贺学习者完成每节课的庆祝动画，Duolingo的应用程序能带给学习者最大限度的学习后喜悦心情。多年来，Duolingo的猫头鹰吉祥物Duo已经成为一个流行的品牌图标，已经成为公司的营销资产。


    +   游戏化激励机制（Motivating game mechanics）：Duolingo的产品团队清楚地知道，在学习新东西的过程中，保持动力是最困难的部分，公司不遗余力地让学习者参与其中，让游戏化驱动的高粘性特点推动学习者保持持续的学习动力。


    +   低使用门槛（Low friction）：确保每一个初次使用Duolingo的用户都会使用Duolingo，通过观察他们第一次使用Duolingo时的行为来不断改进产品设计，确保他们在使用时会更加流畅和自然。


    +   数据分析的应用，借助人工智能优化学习（Application of data analytics and artificial intelligence
    to optimize learning）：Duolingo利用每天获得的超过5亿次练习的数据，来训练用来提高学习效率的复杂机器学习算法。


    Duolingo将90%的AI资源分配给了能力测试。当用户进行45分钟的考试时，Duolingo则进行密集的数据收集。收集的数据包括一个人的身份、课程中的参与度、测试项目和问题的学习表现、评分方法和适应性测试。Duolingo定期运行A/B测试，以找到设计测试及其所有课程的最佳方式，测试用户的学习效率，以适应体验并平滑学习曲线。'
