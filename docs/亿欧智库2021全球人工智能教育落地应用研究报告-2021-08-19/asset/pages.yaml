  md: '# 四、全球人工智能教育产业人才培养


    # 亿欧智库：2015-19年按地理区域展示的产学界合作、合著的同行评审AI出版物数量(总和)


    ![](img/8ca3007dbd225addc1b60b54549d80f4_54_0.png)


    来源：斯坦福大学《人工智能指数报告》，亿欧智库


    据Elsevier Scopus数据库显示，从2015-2019 年间产学界合作、合著的同行评审AI出版物数量来看，美国、欧洲地区以及中国有明显优势。


    各国学术界和产业界之间的研发合作变得越来越重要，产学研中心数量激增，企业对大学研究的贡献也逐渐增多。当前，基于应用实践的人工智能创新生态正在各国逐渐形成，未来，全球人工智能技术研究在产、学两界的分界线可能会愈加模糊，由高校和企业合作完成的创新优化型和阶跃型技术突破不断增多，企业级人工智能研究院的重要性正在逐步显现。


    # 储备量：覆盖范围更广的科学素养培养，培养方式多元逐渐形成闭环


    储备量是 AI 人才数量能否大规模提升的前提，而储备量的提升一方面来自于社会对于人工智能技术的普遍认知，这需要系统的科普知识和科学素养培养体系，另一方面则来自于学习者对于人工智能的学习意愿和兴趣。


    目前，全球科学素养培养体系逐渐完善，由于AI是一门跨学科学领域的技术，科学素养的培养较为综合，各国均在探索完善适应各国国情的科学素养培养体系。科学素养的培养方式也愈加多元，课程教学、科学实验、科创比赛、资格认证等培养方式让学习效果外化，结合理论与实践多方面掌握知识。


    在具体的课程教学上，我们通过对资料的整理和分析发现，越来越多人工智能人才培养相关的教育产品通过游戏化的互动课程，增加学习者的体验感和趣味性。


    # 亿欧智库：培养方式多元逐渐形成闭环


