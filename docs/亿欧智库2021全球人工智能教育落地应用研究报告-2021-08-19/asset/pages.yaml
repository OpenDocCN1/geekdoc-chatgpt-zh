    +   ● 智能职业生涯规划和智能题库相关应用场景融资规模最大，累计加权平均融资额为24701万美元/16607万美元，而自动批改、个性化组卷和师生匹配评测场景融资额最低分别为559万/599万/260万美元。亿欧智库认为技术成熟度越高、应用次数较多的场景融资额较少，融资额较多的应用基于其技术要求较高资金需求量也会相应上升。自动批改和个性化组卷应用场景的AI技术要求相对较低，且场景在美国地区应用频次较低，所需资金量相对较小。智能职业生涯规划和智能题库对人工智能技术要求较高，所需积累的试题库及数据更多，有较高的技术壁垒。因此，融资金额较大，但融资次数相对较少。


