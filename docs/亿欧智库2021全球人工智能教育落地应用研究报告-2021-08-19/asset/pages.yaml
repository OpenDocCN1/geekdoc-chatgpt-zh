  md: "# # 全球AI人才培养教育企业案例分析\n\n# ## 奇幻工房 w·onder workshop\n\nWonder Workshop（奇幻工房）创建于2012年，是一家制造可编程机器人玩具和配套游戏应用的企业。创业的缘起是一位工程师想要给自己的孩子找一个可以学习编程的软件，发现一年级的孩子就已经对编程有了概念，只是缺乏一种介质来提升孩子的兴趣并引导孩子逐步培养编程意识与能力。奇幻工房的机器人就是这样以互动游戏方式指导5-12岁的小朋友学习逻辑和编程知识的玩具。\n\
    \n# ### 亿欧智库：奇幻工房育人培养目标\n\n**想象与创造能力**  \n通过机器人配件及操作软件，让机器人按指令做出各种行动，培养孩子动手创造能力和想象能力。\n\
    \n**基础编程素养**  \n针对不同年龄段的孩子有不同难易程度的编程软件，在“玩”机器人的过程中培养了孩子的编程能力。\n\n**解决问题的能力** \
    \ \n机器人设定与编写程序，无不考验孩子的解决问题的能力。\n\n**学习兴趣**  \n在“玩”机器人的过程中，激发孩子对机器、工程以及编程的兴趣。\n\
    \n奇幻工房现在的核心产品是三个机器人，分别叫做Dot Creativity Kit、Dash和Cue，依次从低端到高端，Dot Creativity Kit和Dash针对小朋友，而Cue则为11岁以上的大朋友设计，机器人价格从79.99美元到199.99美元。机器人可移动，支持语音检测和录音，用户可通过平台编程，提供相应的程序和课程，Dash和Cue还具有物体检测等功能。奇幻工房围绕机器人产品，设定了一系列的课程体系。\n\
    \n# ### 亿欧智库：奇幻工房在中国地区课程体系\n\n![](img/8ca3007dbd225addc1b60b54549d80f4_56_0.png)\n\
    \n奇幻工厂2013年通过众筹售出了自己的第一批产品，众筹金额高达144万美元，产品得以批量生产。此后经历了3轮融资，三轮融资的融资金额都不低，总融资金额已近7000万美元。尽管诞生于美国，奇幻工厂却获得了许多中资企业的投资，其中创新工厂和TCL在B轮融资进入，腾讯、好未来和华平投资在C轮进入。截至目前，奇幻工房产品已经销往43+个国家。"
