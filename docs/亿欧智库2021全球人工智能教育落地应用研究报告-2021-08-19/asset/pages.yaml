  md: '# 全球AI人才培养教育企业概览


    在当今世界各国AI人才短缺的情况下，AI人才培养的教育企业是除高校和企业外的人才有力培养途径，既为企业输送了应用型人才，也通过针对青少年的科学素养培养储备了大量潜在的AI人才。亿欧智库从中国、美国、欧洲及印度地区筛选出了49家AI教学平台，通过对比这49家AI教学平台有了三点发现：


    +   第一，全球从事AI人才培养的教育企业数量来看，美国第一，其次是中国、欧洲地区和印度


    +   第二，从全球角度来说，专业能力培养平台要多于科学素养培养，专业能力培养更多的是进行职业教育，为正在接受高等教育和已经在职但想进行技能学习的人群提供服务，从人群数量和支付能力上来说，这也将是更大的市场


    +   第三，进行科学素养培养的平台向青少年提供编程教育在线培训服务，多数采取游戏并加入故事情节等更能吸引人的方式进行培养，机器人制作、编程教育、创客教育、STEAM培训等在课程内容质量上也有所提升。


