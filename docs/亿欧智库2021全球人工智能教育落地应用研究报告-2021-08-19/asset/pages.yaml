    考试分析：运用计算机视觉、数据挖掘、自然语言处理等技术汇总各群体考试结果，生成考试情况的相关报告并归结错误因用于辅助老师的精准教学，包括“智能语音”、“自然语言处理”、“计算机视觉”等AI技术。

    个性化组卷：包括“数据挖掘”等AI技术，通过数据挖掘等方式对已有题库的数据进行分析、整理、组合协助老师为不同层级的学习者制定考卷。


    # 4. 能力测评


    学生综合素质评价：利用大数据分析及可视化，通过采集学生完整的成长数据多维度全面且综合地评价学生的发展状况并生成综合素质评价报告，包含“数据挖掘”、“自然语言处理”等AI技术。

    课堂质量评测：依托表情识别、语音识别、行为分析、大数据分析及可视化，对课堂行为数据及动态进行捕捉并对课堂教学质量进行多维度评测，生成课堂评测报告用于提升课堂教学质量，包含“智能语音”、“自然语言处理”、“计算机视觉”等AI技术。

    师生匹配评测：包含“数据挖掘”等AI技术，通过大数据分析、可视化、智能评测、个性化推荐等方式对学生和教师进行多维度测评并为学生匹配合适教师。


    # 5. 人生规划管理


    智能升学生涯规划：通过大数据分析、可视化、智能评测、个性化推荐等方式，从学能力、学习偏好、自身学科水平、大学报考条件限制等维度帮助学生解决选课、选科、选校等生涯规划服务，包含“数据挖掘”、“自然语言处理”等AI技术。

    智能职业生涯规划：基于学生差异化的特长和个性化特征评估学生职业兴趣，智能生成职业生涯规划计划，包含“数据挖掘”、“自然语言处理”等AI技术，'
