  md: '# AI 人才培养的要素特性


    从各国的 AI 人才培养体系我们不难看出，要建设一套完整的 AI 人才培养体系需要时间和各方面资源的配合，还要考虑到各国不同的教育体系和理念。因此，为了更方便统一地观察目前
    AI 人才的培养情况，我们大致将 AI 人才的培养提炼出三大要素：高精尖、适应性、储备量，并从这三大要素来分析 AI 人才培养的情况。


    # 高精尖：世界顶尖大学加大 AI 人才培养投入，课程数量和细分学科增加


    各世界顶尖大学是高精尖 AI 人才培养的主战地。根据斯坦福大学 2020 年面向全球覆盖美国、中国、德国、英国、俄罗斯加拿大、瑞士等国家的18 所世界顶尖大学的调查结果表明，在过去的四个学年中，计算机科学系在实用人工智能课程上投入了大量资金。在18所大学中，教授学生建立或部署实用人工智能模型所需技能的本科课程数量增加了
    102.9%，研究生课程数量则增加了 141.6%。


    ![](img/8ca3007dbd225addc1b60b54549d80f4_53_0.png)


    ![](img/8ca3007dbd225addc1b60b54549d80f4_53_1.png)


    ![](img/8ca3007dbd225addc1b60b54549d80f4_53_2.png)


    从课程类型上来看，美国和欧洲地区课程类型较为丰富，中国仍以学士和硕士课程为主。随着课程类型和细分学科的丰富，AI 人才培养所需的教师资源越来越多，如何扩大教师规模吸引人才留用也将成为人才培养下一步需要解决的难题。


    # 适应性：各国加大产学合作，企业的作用更具带动性


    高精尖的特点决定了 AI 人才培养的时间更长，而对适应性的关注则是能在短期内为人工智能相关产业提供大规模的人才供给。AI 人才的数量和质量决定了人工智能应用及产业的发展规模，且应用人才和数字蓝领人才的需求量大，基础性岗位更多，仅依靠高校的培养供给无法满足人工智能产业的职位需求，而从各国在校内和校外培养中都会发现，不管是校内培养中共建学科、实验室、创新合作平台等方式，还是职业培训、企业内部培养，企业都在应用型人才培养上扮演了极为重要的角色，通过输送师资力量、产业技术、产业实践经验来实现自身的技术突破和人才储备。'
