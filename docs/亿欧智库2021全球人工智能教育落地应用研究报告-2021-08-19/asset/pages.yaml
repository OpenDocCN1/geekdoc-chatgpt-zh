  md: '# 五、研究结论


    # 关于人工智能教育行业的8点观察


    # 5、AI教育场景化突破环节限制，技术应用落地成熟度持续提高


    而从具体的应用场景来看，亿欧智库在2019年研究内容的基础上，再次对部分人工智能教育场景的功能应用成熟度进行评价。我们发现，在拍照搜题、自适应学习、语音互动这样已经存在已久的场景中，AI
    的技术成熟度有所提升，而对于对教育环节本身的依赖程度有所降低，以拍照搜题为例，已经不单单是在教育产品中出现，类似夸克这样的搜索引擎也在不依赖教育过程数据的情况下开发出类似的产品。


    # 亿欧智库：部分人工智能教育场景下，主要功能应用成熟度评价


    | 功能 | 主要应用技术 | 技术成熟度 | 对于教育环节本身的依赖程度 | 场景应用成熟度 |

    |---|---|---|---|---|

    | 智慧课堂 | 计算机视觉 语音交互 | ★★★★ | ★★★★ | ★★☆ |

    | 智能学习硬件 | 指定定位识别 OCR | ★★★ | ★★ | ★★★ |

    | 拍照搜图 | 图像识别（OCR） | ★★★ | ☆ | ★★★☆ |

    | 个性化组卷 | 数据挖掘 | ★★★☆ | ★★★☆ | ★★ |

    | 学生综合素质评测 | 数据挖掘 自然语言处理 | ★★☆ | ★★★☆ | ★★☆ |

    | 智能升学生涯规划 | 智能评测 个性化推荐 | ★★☆ | ★★★☆ | ★★☆ |

    | 自适应学习 | 自然语言处理 数据挖掘 | ★★☆ | ★★★★ | ★★★☆ |


    来源：亿欧智库 表格内容说明如下：


    +   - 成熟度高低仅是相对的评价标准。

    +   - 对于教育环节本身的依赖程度指的是在训练适用于该场景下的算法过程中，所需要的数据来源于对于教育过程数据的依赖程度。


    人工智能在教育领域的应用场景众多，我们将学习者从学习到人生规划的全过程分为了教学、学习、考试、能力测评、人生规划管理五个阶段。通过对每个阶段的人工智能应用方式和应用难点的分析，亿欧智库认为，目前人工智能教育的应用场景中，越是靠近教学和学习，技术难度越大，而在能力测评和人生规划管理方向还有很大的挖掘空间。


    # 亿欧智库：人工智能教育产品的应用方式及难点


    | 阶段 | 应用方式 | 应用难点 |

    |---|---|---|

    | 人生规划管理 | 根据大数据设计算法分析学习者，结合学习者的个性化需求预测分析 | 对于路径规划的模型较少 个性化程度高，数据量化难 |

    | 能力测评 | 利用识别技术识别学习者训练结果，根据预设标准对结果进行评估 | 识别精度有待提升 个性化程度高，数据量化难 |

    | 考试 | 收集学习者行为数据进行预测，结合测试数据定制考试方案 | 数据量大，反馈结果较为简单，还有较大挖掘空间 |

    | 学习 | 分析学习模式，根据科学方式，针对对性建议调整学习模式 | 数据量化难，学习模式复杂，个性化程度要求高 |

    | 教学 | 预先搜集偏好数据，增加互动程序在教学体系基础上，分析行为数据 | 教学模式复杂，AI课程不同学科差异大，仍需人力辅助 |

    | 认知、思考 | | |'
