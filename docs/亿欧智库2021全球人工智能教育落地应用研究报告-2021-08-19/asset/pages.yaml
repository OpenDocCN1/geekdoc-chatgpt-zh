  md: '# # 关于人工智能教育行业的8点观察


    # ## 6、人工智能教育行业竞争加剧，技术积累将成企业制胜关键


    目前，人工智能教育行业有越来越多的技术服务商入局，这在一定程度上降低了中小企业在技术研发上需要投入的时间、人力成本，行业进入门槛降低，单一应用场景的产品聚集度上升，行业竞争加剧，人工智能教育产品越来越多的聚合成功能更为齐全的智能教育产品。


    而作为行业头部的人工智能教育企业，在新兴应用场景上的挖掘难度依然较大。一方面，人工智能技术在任一应用场景上趋于成熟都需要较长时间的积累，另一方面，目前人工智能教育的应用在教学、学习辅助、考试测评、能力测评、生涯规划等领域均有覆盖，学校、家庭、户外等三大学习者所处的重要场景均有相应产品。


    亿欧智库认为，未来人工智能教育行业的应用将由教学及学习辅助功能逐渐向围绕学习者为中心的评价能力、评价标准等方向发展。


    # ## 7、人工智能人才重要性凸显，人才培养更需适应产业发展


    亿欧智库：CS Ranking TOP30 高校的国家分布情况


    | 国家 | CS Ranking Top30高校数量 |

    | :--- | :--- |

    | 美国 | 15 |

    | 中国 | 9 |

    | 新加坡 | 2 |

    | 以色列 | 1 |

    | 加拿大 | 1 |

    | 瑞士 | 1 |

    | 韩国 | 1 |


    随着AI技术的发展，全球对人工智能人才培养的重视程度逐渐提高，中国和美国AI人才培养能力领先。


    从人工智能人才的培养体系来看，应用人才和数字蓝领人才的需求量最大，但能力要求逐渐攀升，AI人才从高校培养过渡到企业应用人才中相关职业技能、证书培训及人才后市场服务有较大发展空间。


    亿欧智库：基于产业发展的人工智能人才分类


    极度紧缺，培养周期10-20年高校及各研究机构、科研院所培养，全职从事科学研究的很少


    高度紧缺，培养周期5-10年高校、科研院所、企业培养，培养周期长


    较为紧缺，培养周期4-8年高校、企业培养，岗位综合能力要求高


    亟待升级，培养周期2-4年企业培养为主，需求量大，能力要求逐渐攀升


    延长AI人才培养链条，适应时代发展以科学素养为主，注重创造能力、思维能力、逻辑能力、动手能力的培养，提升兴趣'
