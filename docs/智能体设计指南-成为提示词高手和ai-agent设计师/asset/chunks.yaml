    #### 2.2.9 更多模块


    结构化提示词更多体现的是一种思想，本章所给出的提示词模板只是当前的最佳实践，实际使用过程中大家可以根据需要自行增删各个模块，重构相关模块，甚至提出一套全新的模板。


    编写提示词时，需要根据不同需求添加不同模块要点。如果采用固定的模式写法，在面对差异巨大的需求场景时，经常会因缺少某些描述而使效果变差。下面整理了按字母顺序排列的
    30 个角度的模块，编写提示词时，可从其中挑选合适的模块组装。


    ●`Attention`：需重点强调的要点。


    ●`Background`：提示词的需求背景。


    ●`Constraints`：限制条件。


    ●`Command`：用于定义大模型的指令。


    ●`Definition`：名词定义。


    ●`Example`：提示词中的示例。


    ●`Fail`：处理失败时对应的兜底逻辑。


    ●`Goal`：提示词要实现的目标。


    ●`Hack`：防止被攻击的防护词。


    ●`In-depth`：一步步思考，持续深入。


    ●`Job`：需求任务描述。


    ●`Knowledge`：知识库文件。


    ●`Lawful`：合法合规、安全行驶的限制。


    ●`Memory`：记忆关键信息，缓解模型遗忘问题。


    ●`Merge`：是否使用多角色，最终合并投票输出结果。


    ●`Neglect`：明确忽略哪些内容。


    ●`Odd`：偶尔 [俏皮，愤怒，严肃] 一下。


    ●`OutputFormat`：模型输出格式。


    ●`Pardon`：当用户回复信息不详细时，持续追问。


    ●`Quote`：引用知识库信息时，给出原文引用链接。


    ●`Role`：大模型的角色设定。


    ●`RAG`：外挂知识库。


    ●`Skills`：擅长的技能项。


    ●`Tone`：回复使用的语气风格。


    ●`Unsure`：引入评判者视角，当判定低于阈值时，回复安全词。


    ●`Value`：模仿人的价值观。


    ●`Workflow`：工作流。


    ●`X-factor`：用户使用本提示词最为重要的核心要素。


    ●`Yeow`：提示词开场白设计。


    ●`Zig`：无厘头式提示词，如“答案之书”。


    ### 2.3 如何写好结构化提示词


    #### 2.3.1 结构化提示词格式


    使用格式来区分提示词的各个部分是编写提示词的常用技巧，那么，为什么选择结构化提示词而不是格式化提示词呢？格式化只是结构化提示词的一部分。


    对于格式化提示词而言，格式是目的，只表明了提示词的内容组织格式，而提示词更关键的思维和语义结构却被忽略了。对于结构化提示词而言，格式只是组织思维和语义结构的手段，而不是目的。


    结构化提示词的设计重在思维和语义结构的组织，强调将诸多提示词技术（例如面向角色的提示词设计）有机融入提示词，而非格式设计。


    日常文章的结构通常通过字号大小、颜色、字体等样式来标识。ChatGPT 接收的输入不包含样式，因此可以借鉴 Markdown、YAML 等标记语言的方法或者
    JSON 等数据结构，实现提示词的结构表达。JSON、YAML 等格式对软件开发者更友好，而 Markdown 等格式对大众更友好。


    理论上，可以使用任意格式来编写结构化提示词，甚至可以自定义一套格式规则来描述提示词。实践中，ChatGPT 等大模型对 Markdown、JSON 格式的识别度较好，而
    Claude 由于官方针对 XML 格式进行了专门优化，在 XML 格式下表现会更好。以下是一个使用 Claude 进行法律合同分析的 XML 提示词示例。没有
    XML 标签时，Claude 的分析缺乏条理，容易遗漏关键点；而使用标签后，它能提供结构化的、全面的分析，便于法务团队采取行动。


    分析这份软件许可协议中的法律风险和责任。我们是一家跨国企业，正在考虑将此协议用于我们的核心数据基础设施。


    <agreement>{{CONTRACT}}</agreement>


    这是我们的标准合同，供参考：


    <standard_contract>{{STANDARD_CONTRACT}}</standard_contract>


    <instructions>


    1.分析以下条款：-赔偿-责任限制-知识产权所有权。


    2.注意不寻常或值得关注的条款。


    3.与我们的标准合同进行比较。


    4.在 <findings> 标签中总结发现。


    5.在 <recommendations> 标签中列出可执行的建议。


    </instructions>


    本书推荐使用 Markdown 格式编写提示词，原因如下：


    ●便于模型理解：大模型的训练语料数据中，常见格式的数据较多，因此模型对常见格式的理解较为顺畅。


    ●便于人的阅读理解：人们对常见格式的了解和掌握更多，因而不必单独学习语法结构。


    目前国内常用的大模型大部分支持 Markdown 格式，而且这种格式对程序员和非程序员都非常友好。为方便广大读者，本书采用轻量化的 Markdown 语法，仅涉及一些简单的符号。对
    Markdown 格式感兴趣的读者可自行搜索相关知识，学习约半小时即可上手。


    #### 2.3.2 构建全局思维链


    一个好的结构化提示词模板，在某种意义上就构建了一个好的全局思维链。如 LangGPT 中展示的模板设计时就考虑了如下思维链：


    `Role`（角色）→`Profile`（角色简介）→`Profile`下的`Skills`（角色技能）→`Rules`（角色要遵守的规则）→`Workflow`（满足上述条件的角色的工作流）→`Initialization`（进行正式开始工作的初始化准备）→开始实际使用


    一个好的提示词在内容结构上应当逻辑清晰连贯。结构化提示词方法将久经考验的思维链融入结构中，大大降低了思维链的构建难度。


    构建提示词时，可以参考优质模板的全局思维链。熟练掌握后，可对其进行增删改调整，以得到一个适合自己使用的模板。例如，当需要控制输出格式，特别是需要格式化输出时，可以增加`Output`（输出）或者`OutputFormat`（输出格式）这样的模块。


    #### 2.3.3 保持上下文语义一致性


    创作高质量提示词时，需要注意保持上下文语义的一致性。这包括两个方面：格式语义一致性和内容语义一致性。


    格式语义一致性是指标识符的标识功能前后一致，最好不要混用。例如，如果将#既用于标识标题，又用于标识变量，会造成前后一致性的破坏，从而对模型识别提示词的层级结构造成干扰。


    内容语义一致性是指思维链上的属性词语义合适。例如，LangGPT 中的`Profile`（简介）属性词，原来用的是`Features`（特征），但实践与思考后，笔者将其更换为`Profile`，使其功能更加明确，即表示角色的简介。结构化提示词思想被诸多朋友广泛使用后，衍生出了许多模板，但基本保留了`Profile`的诸多设计，说明其设计是成功且有效的。


    为什么 LangGPT 前期会用`Features`呢？因为 LangGPT 的结构化思想受到 AI-Tutor（AI 导师）项目的启发，而 AI-Tutor
    项目中并无`Profile`一说，与之功能近似的是`Features`。但 AI-Tutor 项目中的提示词过于复杂，并不通用。为形成一套简单有效且通用的提示词构建方法，笔者结合自己的提示词工程经验和大模型的特性，提出了本书中的结构化提示词思想，设计并构建了结构化提示词模板。


    内容语义一致性还包括属性词和相应模块内容的语义一致。例如，在 `Rules`（规则）部分，角色需要遵守规则，因此不宜在此处堆砌大量的角色技能描述。


    #### 2.3.4 其他提示词方法


    结构化提示词思想是一种方法，与 CoT、ToT、Think step by step 等其他技巧和方法并不冲突。在构建高质量提示词时，这些方法可以结合使用，结构化方式更便于各个技巧间的协同组织。例如，将
    CoT 方法融合到结构化提示词中编写提示词。


    此外，所有提示词方法完全可以用于结构化提示词。建议读者灵活结合多种提示词方法，以在复杂任务中实现使用不可靠工具（如 LLM）构建可靠系统的目标。


    ### 2.4 提示词编写的自动化


    日常简单使用时，直接询问大模型即可达到目的。而若希望构建一套功能复杂且性能稳定的提示词，则通常需要以下几个环节：


    1）提示词编写；


    2）提示词效果验证；


    3）提示词修改和调整。


    若提示词较长，例如有几百甚至上千字，则编写环节会耗费不少时间。同时，若提示词所面向的领域是你不熟悉的，你往往会面临无从下笔的困境。


    在提示词初版完成后，就进入后两个环节，你需要使用提示词验证效果，然后依据效果不断修改和调整提示词。因此，第 2 和第 3 两个环节往往是交替进行的，需要耗费大量时间，依赖丰富的提示词经验和技巧。


    一个好的提示词往往要经过大量的修改、迭代和调试，因此编写和优化提示词是一项非常耗时的工作。在 1.10 节中，我们已经专门说明了如何进行提示词迭代。本节主要论述如何使用提示词工具实现提示词的自动优化工作流，以大大加速提示词的编写过程。


    #### 2.4.1 手工编写工作流


    在结构化提示词的基础上，由于模板的存在，提示词编写这一“作文题”变成了“填空题”，大大降低了提示词编写的难度。结构化提示词的手工编写工作流如下：


    手工套用现有模板→手工迭代调优→符合需求的提示词


    编写提示词时，学习者可以通过手工编写工作流来加深对提示词编写的理解。


    #### 2.4.2 自动化编写工作流


    对于刚入门的提示词学习者而言，如需快速上手，建议使用自动化创建提示词的方法。构建复杂、高性能的结构化提示词可采用以下自动化编写工作流：


    自动化生成初版结构化提示词→手工迭代调优→符合需求的提示词（推荐）


    自动化生成的初版结构化提示词，可以通过提示词专家智能体完成。大模型 Kimi 的智能体板块 Kimi+上有这本书提到的结构化提示词驱动的提示词专家，读者可以使用该提示词专家智能体创建自己的结构化提示词，如图
    2-2 所示。


