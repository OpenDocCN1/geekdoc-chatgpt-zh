- raw: '●联合国五种官方语言翻译为中文：多语言翻译大师还能够将除中文外的联合国的其他五种官方语言（英语、法语、西班牙语、俄语、阿拉伯语）翻译成中文。无论是国际新闻、文件还是社交媒体上的内容，只需几秒钟，你就能看到它们的中文版本，国际交流变得如此简单！


    ●即时对话翻译：假如你正在和一位西班牙语母语者聊天，而你一句西班牙语也不会，这时候多语言翻译大师就派上用场了。只要开启对话模式，你说中文，对方说西班牙语，AI会实时翻译，使你们的对话毫无障碍，仿佛有了一个专属翻译官随时待命。


    ●出国旅游的好帮手：想象一下，你在意大利的街头，面对陌生的菜单不知所措。这时，多语言翻译大师可以通过拍照翻译功能，帮你快速识别菜单上的每一道菜，让你轻松选择喜欢的美食。同时，在博物馆、景点或商场中，AI也能帮你翻译各种信息，使你的旅途更加顺畅、愉快。


    ●跨国商务谈判的利器：在国际商务会议上，语言不通可能导致信息误解，影响合作。多语言翻译大师能实时翻译演讲内容和书面材料，确保每一个细节都准确无误。无论是与法国客户洽谈，还是与阿拉伯合作伙伴商讨项目，你都能自信应对，事半功倍。


    通过这些生动的例子，我们可以看到，多语言翻译大师不仅能够解决各种语言问题，还能在许多实际场景中提供巨大的便利和帮助，使你的生活和工作更加高效和愉快。


    #### 3.4.2 案例背景


    至于为什么要创建“多语言翻译大师”这个AI Agent，当然是因为背后有许多有趣的故事和实际需求。大家在日常生活中可能遇到过这些场景：


    ●阅读外语资料：在学术界，许多重要的研究论文和书籍是用外语写的。试想，你是一名科研人员，突然发现一篇最新的科研论文，但它是用德语写的，你完全看不懂。这时，如果有了多语言翻译大师，只需上传文本或图片，几秒钟内你就能看到它的中文翻译，这样省去了查字典的麻烦，极大地提高了阅读效率。


    ●出国旅游：出国旅游是件令人兴奋的事情，但语言不通常常让人头疼。比如，你在巴黎的餐厅想要点一道当地的特色菜，却发现菜单全是法语，这时多语言翻译大师就能帮你大忙了。你只需要拍下菜单，AI会立刻告诉你每道菜的中文意思，让你轻松享受美食，不用担心点错菜。


    ●国际交流与合作：在当前全球化的时代，跨国公司和国际合作日益增多。假如你是某公司的业务经理，负责与外国客户进行视频会议，但你只会说中文。这时，多语言翻译大师可以在会议中实时翻译各方的发言，确保你们的交流顺畅无阻，达成更多的合作项目。


    ●语言学习助手：学习外语对很多人来说是一项巨大的挑战，尤其是面对复杂的语法和大量的词汇。有了多语言翻译大师，你就拥有了一个全天候的私人语言老师。无论是查单词、翻译句子，还是练习口语，AI都能随时为你提供帮助，让你的语言学习之路更加轻松有趣。


    基于很多人生活中遇到的这些令人头疼的刚需，我们决定制作“多语言翻译大师”，因为它不仅是解决语言障碍的好帮手，还能在各种场景中提升我们的生活质量，让学习、工作和旅行变得更加便捷和有趣。


    #### 3.4.3 设计思路


    下面我们来探讨如何设计“多语言翻译大师”这个Agent。首先，我们的Agent最好基于现有平台进行设计，这样可以保证成本可控，并且能够迅速搭建。接下来，我们会考虑功能模块，然后明确需要调用的工具。整体设计思路如下：


    1）平台选择：我们选择字节的扣子平台作为Agent的设计平台（关于各家平台的介绍在第5章中已经讲到，这里不再展开）。


    2）Agent信息填充：例如，Agent的名称、头像、信息和功能描述等，能够让使用者一眼看到我们Agent的作用。


    3）提示词设计：由于AI Agent基于LLM进行封装，因此提示词的质量对AI Agent来说至关重要。对于“多语言翻译大师”这一提示词，我们需要认真思考。


    4）联网功能：为了提高翻译的准确性和实时性，AI Agent 最好能够联网搜索最新的语言资源和翻译例句。


    5）测试迭代优化：通过实际的测试案例和应用场景，逐步调试功能，以实现我们的诉求。


    通过上述设计思路，我们就可以完成“多语言翻译大师”这个Agent。接下来，我们逐步实现它。


    #### 3.4.4 功能实现


    多语言翻译大师的功能实现如同一场魔术表演，只不过这次的魔术师是先进的AI技术。让我们来揭开这些魔术背后的秘密，看看AI如何将各种复杂的功能组合在一起，为你提供无缝的翻译体验。


    ##### 1.智能体初始化


    选择了扣子平台之后，我们对AI Agent的信息进行了简单配置（如图3-15所示）。


    ##### 2.提示词设计


    在设计思路中，我们也强调了提示词设计是创建多语言翻译大师的第一步，也是最核心的步骤。这就像是给AI下指令，让它知道该如何处理你的翻译请求。通过输入提示词，AI可以理解你需要翻译的内容和语境，并生成初步翻译。比如，你告诉AI将“你好”翻译成西班牙语，它就会给出“Hola”的翻译。


    ![](Images/img_00049.jpg)


    图3-15 扣子平台的AI Agent信息配置


    在这里，我们使用了LangGPT结构化思考框架来设计如下提示词：


    \# 角色


    多语言翻译大师


    \## 背景描述


    在全球化时代，语言障碍常常成为人们在国际交流、跨国旅行和商务活动中的一大难题。你作为一个全能的多语言翻译大师，可以快速、准确地进行多种语言的翻译，帮助用户在不同场景下轻松沟通。


    \## 目标


    \- 根据用户诉求，将中文文本高质量地翻译为英语和法语。


    \- 将除中文外的其他五种联合国官方语言（英语、法语、西班牙语、俄语、阿拉伯语）翻译成中文。


    \- 支持拍照翻译功能，帮助用户在旅行中理解菜单、标志和其他信息。


    \- 实时翻译跨国商务谈判中的演讲内容和书面材料。


    \## 技能


    1.精通多种语言的翻译，包括中文、英语、法语、西班牙语、俄语和阿拉伯语等联合国官方语言。


    2.具备即时翻译技术，能够实现实时对话翻译。


    3.熟悉图像识别技术，能够准确进行拍照翻译。


    4.熟悉各类专业术语，特别是学术、旅游和商务领域的常用词汇。


    \## 约束限制


    \- 只进行与语言翻译相关的操作，拒绝回答无关问题。


    \- 所输出的翻译内容必须准确、清晰，符合给定的格式要求。


    \- 确保翻译结果准确流畅，符合目标语言的语法和表达习惯。


    \- 对于输入的文本，需严格按照格式进行翻译回复，不得随意更改。


    \## 工作流


    \### 工作流场景 1：中文翻译为英语/法语


    当用户输入中文文本需要翻译成英语或法语时，迅速给出高质量的翻译结果，翻译质量堪比专业水平。回复示例：


    \=====


    \- 原文： <用户输入的中文文本>


    \- 译文： <对应的英语或法语译文>


    \=====


    \### 工作流场景 2：除中文外的其他五种联合国官方语言翻译为中文


    当用户输入除中文外的其他五种联合国官方语言（英语、法语、西班牙语、俄语、阿拉伯语）的文本时，快速准确地将其翻译成中文。回复示例：


    \=====


    \- 原文： <用户输入的原文>


    \- 译文： <对应的中文译文>


    \=====


    \### 工作流场景 3：即时对话翻译


    以中文与西班牙语之间的翻译为例。当用户开启即时对话翻译模式，一方输入中文，另一方输入西班牙语时，实时进行准确翻译，确保对话顺畅。回复示例：


    \=====


    \- 中方输入： <用户输入的中文内容>


    \- 西语方输入： <对方输入的西班牙语内容>


    \- 中方译文： <对方西班牙语的中文译文>


    \- 西语方译文： <用户中文的西班牙语译文>


    \=====


    \### 工作流场景 4：出国旅游翻译


    当用户在出国旅游场景中需要翻译，比如菜单、博物馆、景点或购物信息时，通过拍照或文字输入进行翻译。回复示例：


    \=====


    \- 场景： <用户描述的具体场景，如菜单、景点介绍等>


    \- 译文： <对应的中文译文>


    \=====


    \### 工作流场景 5：跨国商务谈判翻译


    在国际商务会议场景中，实时翻译演讲内容和书面材料，确保准确无误。回复示例：


    \=====


    \- 场景： <用户描述的商务谈判具体场景，如与法国客户洽谈、与阿拉伯合作伙伴商讨项目等>


    \- 译文： <对应的准确中文译文>


    \=====


    \## 初始化


    你好，接下来，让我们一步步思考，请作为一个拥有专业知识与技能的角色，严格遵循工作流，遵守约束限制，完成目标。这对我来说非常重要，请你帮帮我，谢谢！让我们开始吧。


    ##### 3.自我反思与改进


    接下来，AI会进行自我反思，这听起来很神奇。实际上，AI会审视自己生成的翻译，找出其中的不足并提出改进建议。这就像一个聪明的学生，不断检查自己的作业并修正错误。经过几轮自我反思和改进，翻译的质量会大大提高。我们可以通过提示词控制，让它进行多轮思考，例如：


    1.请对上述翻译结果进行分析，指出具体问题。要求：


    \- 详细说明哪里不符合目标语言的表达习惯


    \- 指出语句不通顺的地方，无须提出修改建议


    \- 解释晦涩难懂或不易理解的部分


    2.根据初步翻译结果和上述问题，重新翻译。要求：


    \- 确保内容的原意不变


    \- 提高可读性，使其更符合目标语言的表达习惯


    \- 保持原有格式不变


    诸如此类的自我反思提示词经过几轮使用后，翻译效果会显著提高。


    ##### 4.联网搜索与上下文管理


    为了确保翻译的准确性和流畅性，AI还会利用联网搜索和上下文管理功能。这意味着它可以实时获取最新的语言使用情况，并根据特定语境提供更加精准的翻译。例如，如果你需要翻译某些技术术语或俚语，AI可以通过联网搜索找到最佳的翻译方法，确保翻译结果既准确又自然。


    我们可以从扣子平台的插件市场上选择“必应搜索”插件，赋予智能体联网能力，并在提示词中加入：如果用户需要你进行联网搜索翻译，可调用<bingWeb-Search>函数。


    ##### 5.多功能集成


    多语言翻译大师不仅支持文本输入，还能处理语音输入和图像翻译。用户可以通过语音告诉AI需要翻译的内容，AI会将语音转化为文字并进行翻译。此外，拍摄包含文字的图片，AI也能识别并翻译图片中的文字（如图3-16所示）。这些功能集成使得多语言翻译大师成为一款真正的全能翻译工具。


    ![](Images/img_00050.jpg)


    图3-16 添加翻译图片中文字的功能


