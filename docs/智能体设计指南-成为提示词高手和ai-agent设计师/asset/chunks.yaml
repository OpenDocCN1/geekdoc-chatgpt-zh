    ### 1.8.3 思维链的原理


    在3个大语言模型上进行的实验表明，`CoT`方法提高了一系列算术、常识和符号推理任务的成绩。与一般提示法相比，`CoT`方法会在提示词中提供中间的推理过程作为范例，如图1-8所示。


