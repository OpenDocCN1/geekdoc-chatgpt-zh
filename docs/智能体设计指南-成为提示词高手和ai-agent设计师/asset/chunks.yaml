    图6-11 扣子的知识库分段设置


    #### 5. 查看内容分段效果


    完成内容上传与分段后，可查看内容的分段效果，如图6-12所示。可以注意到图中的内容分段有些瑕疵，这取决于文档本身的内容质量。


    ![](Images/img_00117.jpg)


    图6-12 扣子知识库内容的分段效果


    #### 6. 以表格格式上传知识库


    同样地，如果我们的知识库文件是表格格式，也可以选择“表格格式”上传知识库。完成数据上传后，配置数据表，然后单击“下一步”按钮，如图6-13所示。


    ![](Images/img_00118.jpg)


    图6-13 扣子知识库上传表格


    ●指定数据范围：通过选择数据表、表头和数据起始行来指定数据范围。

    ●确认表结构：系统已默认获取表头的列名。可以自定义修改列名，或删除某列的列名。

    ●指定语义匹配字段：选择哪个字段作为搜索匹配的语义字段。在响应用户查询时，会将用户查询内容与该字段的内容进行比较，根据相似度进行匹配。


