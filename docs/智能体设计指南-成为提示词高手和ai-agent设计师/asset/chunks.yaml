    \n基于上述提示词例子，说明结构化提示词的几个概念，具体如下：\n●标识符：#、<> 等符号（-、[]也是）。比如：<>符号标识变量，#、##等符号用于标识层次结构。这里采用了Markdown语法，#是一级标题，##是二级标题。“角色”用了一级标题是想告诉模型：“我之后的所有内容都是描述你的，覆盖范围为全局。”有几个#就是几级标题。\n\
