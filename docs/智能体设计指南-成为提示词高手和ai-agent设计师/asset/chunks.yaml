    这是新加坡政府科技局（GovTech）组织的首届GPT-4提示工程大赛中冠军Sheila Teo使用的提示词框架，这个框架在国内外具有广泛的影响力。


    \# CONTEXT（上下文）　#


    我想推广公司的新产品。我的公司名为Alpha，新产品名为Beta，是一款新型超快速吹风机。


