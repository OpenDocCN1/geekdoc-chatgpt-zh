    #### 7）小说大纲创作节点

    参考图 10-24 配置模型、输入、提示词和输出，注意变量名不要写错，变量类型和描述要一一对应准确。提示词部分填写下面的内容：


    提示词

    创作一个 5000 字的短篇科幻小说大纲，包含小说标题、主要角色（主角和配角）、故事背景、情节概述（开场，发展，冲突，高潮，结局），使用中文描述，除此之外不要给我任何其他内容。


    在创作大纲的时候，请你适当参考【附件资料】，同时分析用户的【文章需求】属于哪一个专业领域，并调取这个领域的专业数据进行大纲创作。


    注意构建开放式、引人无限遐想和思考的结局。


    ##【文章需求】=`{{query}}`，`{{BOT_USER_INPUT}}`


    ##【附件资料】=`{{web_content}}`


    ## 下面是短篇小说大纲的创作方向：


    ---


    `{{outline}}`


    ---


    ## 任务

    创作 5000 字的短篇科幻小说大纲，大纲越详细越好，分别给出：

    - 小说名称

