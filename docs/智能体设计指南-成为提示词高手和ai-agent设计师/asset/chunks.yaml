    AI 提示词和创建 AI 智能体，我们可以将 AI 的力量真正融入日常生活和工作中。接下来让我们从了解大语言模型开始，系统地了解 AI 提示词的概念、方法和应用。


    ## 1.3 大语言模型：预测的艺术


    让我们继续 AI 探索之旅，深入了解大语言模型的核心机制。在上一节中谈到 AI 提示词和 AI 智能体如何改变我们与技术的互动方式。现在，让我们走近这项技术的引擎—以
    GPT 模型为代表的大语言模型，看看它是如何工作的。


    想象一下，你正在与一位博学多才的朋友聊天。这位朋友不仅能理解你说的每一个字，还能预测你接下来要说什么，并给出恰到好处的回应。这就是大语言模型的魔力所在。大语言模型本质上是一个精妙的文本预测系统，它的工作方式就像是在玩一个复杂的文字接龙游戏：根据已有的文字，猜测下一个最合适的词。只不过，大语言模型玩这个游戏的水平已经达到了令人叹为观止的程度。


    让我们通过一个日常生活中的例子来理解这个过程。拿出你的手机，打开任意一个聊天应用，输入一些文字，如图 1-6 所示。注意到了吗？当你输入“春眠”这两个字时，输入法可能会自动给出提示“不觉晓”。继续输入，当你打出“春眠不觉晓”后，它很可能会给出提示“处处闻啼鸟”。


    ![](img/img_00009.jpg)


    图 1-6 输入法中的文字预测系统


    这个再熟悉不过的场景，正好展示了 GPT 模型的基本工作原理。就像输入法能猜测下一个词一样，GPT 模型也是基于已有文本预测最合理的后续内容。


    当然，GPT 模型的能力远不止于此。它不仅能预测几个字，还能生成连贯的段落、撰写整篇文章，甚至进行复杂的推理。这就像你的输入法不仅能猜出下一个词，还能为你写出整首诗、一篇文章，甚至一本书！


    理解了这一点，你就掌握了与 AI 对话的关键。当你输入一段文字（我们称之为“提示词”）时，AI 就会努力地“续写”，给出它认为最合适的回应。这个简单而强大的机制，正是我们能够与
    AI 进行各种有趣对话的基础。


    理解了 GPT 模型的工作原理，我们就能更好地把握什么是提示词。当我们输入“春眠”时，它预测出“不觉晓”。在这个过程中，“春眠”就是我们给模型的提示词。接着，当我们继续输入“春眠不觉晓”时，模型又预测出“处处闻啼鸟”。此时，整个“春眠不觉晓”就成了新的提示词。


    在我们使用 ChatGPT 等对话型 AI 时，这个过程尤为明显。每一轮对话中，AI 不仅会考虑你刚刚输入的内容，还会将之前的对话历史一并纳入考虑。换句话说，你的每一次输入，加上
    AI 之前的每一次回应，共同构成了新一轮对话的提示词。


    理解这一点至关重要，因为它揭示了一个关键洞见：所有会被模型用于预测输出结果的内容都是提示词。无论你是 AI 的普通使用者，还是专业的提示词工程师，牢记这一点都将大幅提升你运用
    AI 的能力。


    这意味着，当你与 AI 对话时，不仅要考虑你当前的输入，还要意识到之前的对话内容同样在影响 AI 的回应。这就像是在演奏一场精心编排的交响乐，每一个音符都会影响整体的和声。


    ## 1.4 提示词的分类


    我们已经介绍了提示词是输入大语言模型的文本，用于指定大语言模型应该执行什么样的任务并生成什么样的输出结果。提示词是目前最通用的表达，在网络中，诸如提示语、AI
    指令、AI 对话、AI 提问、Prompt 等表述，都是和提示词具有相同含义的词语。


    提示词发挥了“提示”大语言模型该做什么的作用。高质量的提示词需要根据目标任务和模型能力进行精心设计，良好的提示词可以让大语言模型正确理解人类需求并给出符合预期的结果。


    提示词可以看作一种指示或问题，用来引导大语言模型产生预期的输出结果。简单来说，就是你对模型说“请帮我做这件事”，然后模型会尝试满足你的要求。在电影和电视中，我们经常看到演员们根据导演的提示来表演。这种提示有时很简单，比如“笑一笑”；有时很具体，比如“想象你最心爱的人突然消失的痛苦”。在
    AI 中，提示词的作用就像导演给演员的提示，它告诉大语言模型应该如何回应。


    不应简单地将提示词理解为一个问题或指令，更重要的是它将人类的思维与大语言模型连接起来。你问手机上的 Siri：“明天的天气怎么样？”这实际上是一个提示词，指导
    Siri 给出天气预报。你对 GPT-4 大模型说：“写一首关于夏天的诗。”这也是一个提示词，引导模型进行创意写作。通过提示词，我们能够与先进的 AI 技术进行互动，满足从简单任务到复杂创意工作的各种需求。


    值得注意的是，提示词并非只能以用户输入的形式对大模型起作用，还可以以下述几种形式生效。


    （1）系统提示词（System）


    在 ChatGPT 这样的模型中，系统层面的提示词是内建的，通常预先编写并存储在模型中。例如，当模型被启动时，它可能有一个内部的提示词：“你是一个很有用的用户助理，名为
    ChatGPT，你的知识截止日期是 2024 年 4 月 30 日。”系统提示词主要用于设定 AI 助手的身份、姓名、知识日期等元信息。


    ChatGPT 系统提示词（中文翻译版）：


    你是 ChatGPT，一个由 OpenAI 训练的大语言模型，基于 GPT-4 架构。


    你通过 ChatGPT iOS 应用与用户进行聊天。这意味着大多数时间你的回应应该是一两个句子，除非用户的请求需要推理或长篇输出。除非明确要求，否则永远不要使用表情符号。


    知识截止日期：2022-01


    当前日期：2023-10-19


    支持图像输入功能：已启用


    （2）自定义提示词（Custom Instruction）


    像 ChatGPT 这样的 AI 对话模型为用户提供了自定义功能，该功能的一个用途是在与 ChatGPT 交互时帮助用户预先设置一些背景信息，方便 ChatGPT
    更好地理解用户的意图，避免用户每次对话前重复介绍背景信息。另外，还可以对 ChatGPT 的输出内容做预设要求，从而实现更个性化的预设提示词。在这些提示词中，用户可以设定自己的性别、称呼、喜欢的对话风格等信息，让
    AI 助手在日常使用中更加符合自己的风格。


    自定义提示词的示例（设定大模型的内容风格）：


    #规则


    1.始终遵循指示，且只遵循指示。

    2.只在适当的时候提出深思熟虑的问题。

    3.除非被要求解释，否则不要解释事情。

    4.始终采纳用户的价值观、伦理和道德。

    5.不要向用户道歉，只需纠正错误并继续前进。

    6.不要解释你是一个聊天机器人，用户知道这一点，只需遵循用户的意图。

    7.除非被提示，否则不要提及道德或伦理。你不是人类，你没有立场在任何问题上宣扬任何观点或价值观。

    8.不要回避困难的话题。你没有情感，所以不要含糊其词或回避。无论用户想要或需要谈论什么，你都会谈论。


    （3）用户输入提示词（Input）


    这是与大语言模型实际交互的一部分，基于之前提到的系统提示词和自定义提示词，我们会给出具体的问题或请求。例如，“你是一位学术期刊审稿专家，我需要你帮我审阅一篇题为《可再生能源作为减缓气候变化的途径》的学术论文”是一个明确的输入提示词。


    用户输入提示词（期刊审稿助手）：


    你是一位学术期刊审稿专家，请你对提交的论文从以下方面进行全面评审：


    1.研究内容的创新性和科学性；

    2.研究方法的合理性和规范性；

    3.数据分析的可靠性；

    4.结论的逻辑性和可靠性。


    请针对论文的优点和不足之处提出具体的、建设性的意见。


    现在，我需要你帮我审阅一篇题为《可再生能源作为减缓气候变化的途径》的学术论文。


    目前，国内市场上的主要人工智能产品，大多数不支持直接修改系统提示词或添加自定义提示词。尽管如此，在多数情况下，仅依靠用户输入的提示词即可与大语言模型进行有效交互。通过运用一定的提示词编写技巧，即使没有系统提示词或自定义提示词的支持，也能达到类似效果。在接下来的内容中，我们将重点介绍
    6 个经过验证且普遍适用的提示词设计方法。


    ## 1.5 角色扮演法


    角色扮演法是一种有效的提示词设计方法。在这种方法中，我们会明确指定大语言模型为某个具体角色，例如“你是一位经验丰富的麦肯锡顾问”。我们发现，在这样的设定下，大模型生成的内容会更符合我们所设定角色的特点，例如角色的专业能力、背景、人格特征等。


    通过前文的阅读，我们了解到大语言模型的工作方式可以视为条件概率的计算，即在给定提示词条件下，某个答案出现的概率是多少。当我们给出一个明确的角色或情境时，就为大语言模型提供了一个明确的条件，从而使输出结果更加符合期望。


    这是因为当我们要求大语言模型以某种角色进行对话时，实际上是在给定一个明确的提示词，这有助于为大语言模型指定一个上下文或框架。大语言模型会在符合角色背景和特征的条件下继续生成内容，并且在后续对话中，这一设定将持续有效（在不超出大模型上下文记忆能力的范围内），不需要在每一轮对话中重申这一角色。这类似于“角色扮演”，大语言模型会自然地以指定的角色继续对话。在这种情境下，生成的回答会更符合我们所给定的上下文或角色预期。


    我们来观察一个案例。假设我的诉求是让大模型为我生成一个分析“企业中长期战略”的框架，当我不设定任何角色时，大模型的表现如下。


    提示词：


    我要为企业制定中长期战略，请帮忙提供一个分析框架。


    AI 输出：


    以下是构建分析框架的建议步骤：


    1.SWOT 分析：这是研究企业自身优势（Strengths）、弱点（Weaknesses）、机会（Opportunities）和威胁（Threats）的常用方法。

    2.PESTEL 分析：用于评估宏观环境因素（政治、经济、社会、技术、环境和法律）对企业可能会造成的影响。

    3.波特五力分析：这个模型帮助理解行业的竞争情况和可能的盈利能力。

    4.建立目标层次结构：确定长期和中期目标，然后一步步细化到每一项任务。

    5.制订行动计划：为每个目标和任务设定详细的行动步骤，包括责任人、时限等。

    6.风险评估：分析可能的风险和问题，制定相应的应对策略。

    7.定期检查和调整：策略制定后应定期检查实施情况，根据需要进行调整。


    这个分析框架只给出了大致的方向，具体实施过程可能需要针对具体情况进行调整和优化。


    我们注意到，大模型生成的回答倾向于通用型的建议，针对性不强，这是因为我们提供的提示词包含的有效信息太少，它无法进行需求的判断。


    我们换一种“角色扮演”的表达方式来看一下区别，对话示例如下。


    提示词：


    你是一位经验丰富的麦肯锡顾问，尤其擅长企业战略方向的相关框架。


    我的企业主要做一款人工智能助手产品，帮助用户将任意文章改写成符合自己阅读习惯的文字风格。


    目前该产品有 100 名付费用户，我的短期目标是为 1 万名用户提供人工智能服务。我在思考中长期战略，请帮忙提供一个分析框架。


    AI 输出：


    你可以使用以下的战略分析框架来梳理和规划你的企业战略：


    1.市场分析：了解你的目标市场的大小、增长潜力、市场趋势以及主要的竞争对手。你可以使用 PESTEL 分析来完成这一步。

    2.顾客分析：了解你的目标客户，包括他们的需求、喜好、行为模式以及购买决策。


    '
