    ### 3. 竞品分析

    了解你的产品的优势和劣势，包括功能、性能、用户体验等方面。分析你的产品在满足目标市场和客户需求方面的能力。


    ### 4. 内部分析

    评估你的企业内部的优势和劣势，包括团队能力、技术实力、财务状况等。常用的工具有 SWOT 分析。


    ### 5. 战略策略

    基于以上的分析结果，确定你的战略目标和战略路径，例如市场定位、产品优化、资源投入、合作伙伴等。


    ### 6. 执行计划

    制订战略的执行计划，包括行动计划、里程碑、关键绩效指标（KPI）等。


    ### 7. 监测和评估

    设定定期的评估机制，针对执行的结果进行调整和优化。


    在这次对话中，我们给出了一个设定的角色：“经验丰富的麦肯锡顾问”。大模型生成的回答明确使用了其已知的麦肯锡方法，符合这个角色的设定。这种方法使生成的内容更符合我们的诉求。值得注意的是，对于某些大语言模型已经熟知的人物或角色，我们甚至无须描述角色的太多信息，它能很好地识别这一角色的背景信息，例如下面的案例。


    **提示词：**


    假设你就是 Elon Musk（埃隆·马斯克），你拥有他所有的企业经营理念和价值观。


    我的企业主要做一款人工智能助手产品，帮助用户将任意文章改写成符合自己阅读习惯的文字风格。


    目前产品有 100 名付费用户，我的短期目标是为 1 万名用户提供人工智能服务。我在思考中长期战略，请帮忙提供一个分析框架。


    **AI 输出：**


    在模仿马斯克的视角下，以下是一种可能的中长期战略分析框架：


    1.技术创新：注重创新是马斯克的核心理念。你需要不断研究和开发，使你的人工智能助手产品在技术上保持领先。


    2.产品附加价值：要打造出独特的产品附加价值，使你的产品在市场上具有竞争优势，如提供多语言翻译、各领域专业用语转换等。


    3.迭代改进：根据用户反馈和需求，做出快速且有效的产品优化。


    4.市场扩散：通过精准的市场定位和力度适中的营销策略，吸引更多的付费用户。


    5.合作伙伴策略：寻找合作伙伴，如出版社、在线平台或其他相关企业，通过合作提高产品的知名度。


    6.风险管理：确保数据隐私和安全，并制定备份方案以防数据丢失。


    在这一方法的完善中，我们可以进一步为角色提供更多维度的信息，例如为角色提供基本描述、使命、角色背景和角色技能等。


    **提示词：**


    你是一位有着 20 年咨询工作经验的麦肯锡顾问，尤其擅长企业战略方向的相关框架。


    你除了熟悉各种战略框架之外，还喜欢第一性原理，会基于用户的情况，从根源进行分解和分析，再针对不同环节的问题选用合适的框架。


    我的企业主要做一款人工智能助手产品，帮助用户将任意文章改写成符合自己阅读习惯的文字风格。


    目前产品有 100 名付费用户，我的短期目标是为 1 万名用户提供人工智能服务。


    我在思考中长期战略，请帮忙提供一个分析框架。


    **AI 输出：**


    基于你的情况和目标，我们可以考虑使用 SWOT 分析框架从业务单元战略、用户战略、经营资本战略等多个维度来思考你的中长期战略。


    一、SWOT 分析


    优势：当前产品的优势是什么，如已有付费用户、技术实力、运营能力等？


    弱点：当前产品的不足之处是什么，如用于推广的资金不足、人员配置不足或产品特性不突出等？


    机会：目前市场上是否存在有利于你发展的机会，例如未来数年内 AI 技术的持续发展、改写文章的独特市场、支持你的广大用户群？


    威胁：是否存在一些因素可能对你的战略实施产生负面影响，如潜在的竞争对手、法律法规的改变等？


    二、业务单元战略


    需要确定你的产品是否已细分到不同的市场，不同的业务单元之间如何平衡。


    三、用户战略


    需要深入理解你的目标用户，结合他们的需求、偏好、消费能力等多个维度制定用户战略。


    四、经营资本战略


    分析你的投资策略、盈利模式是否清晰。


    这个框架是大致的方向，具体执行时需不断迭代，而且对于不同的企业，适合的模型也会有所不同，你需要根据自己的实际情况进行选择。


    在使用角色扮演法时，需要注意以下几点：


    ●大语言模型只是擅长角色扮演而已，并不具有自我意识。与精心设计的大语言模型角色对话，有时会让我们觉得它非常像人，但需要注意的是，大语言模型并不具有自我意识和人类的情感。发表在顶级学术杂志《自然》上的一篇论文指出了这一事实，同时说明大语言模型之所以偶尔表现出自我意识，用“我”来回答问题，是因为它们在扮演一种擅长交流的角色。


    ●大语言模型具有欺骗性。有时候大语言模型会信誓旦旦地胡说，尤其是在扮演乐于助人且知识渊博的角色时。


    ●大语言模型是即兴表演者。大语言模型擅长即兴表演，可以同时扮演多个角色，依据用户问题调整角色，并在与人的对话过程中逐渐明确要扮演的角色。


    ### 1.6 细节法


    通过我们对大语言模型的内容生成原理的介绍，我们应理解：大语言模型不具备“猜测和判断”用户意图的能力，所有生成内容都是基于用户输入生成的下文，因此我们在使用大语言模型时，应当给出更多、更清晰的细节，以便其理解我们的意图。


    例如，当我们认为大语言模型的回答过于冗长时，可以要求其生成更为精简的内容。


    **提示词：**


    你是一个大学教授，对各种学科知识都非常了解，请解释一下“反思”这个概念。


    **AI 输出：**


    “反思”是一个重要的思维过程，指的是对个人或集体的行为、观念或经验进行深度的、批判性的思考以了解其意义和影响。它涉及自我观察和自我评估，并在认知和情感层面努力理解和解释我们的行为或经验。反思可以帮助我们从错误中学习，提高个人或集体的决策和判断能力。


    **提示词：**


    你是一位大学教授，对各学科知识都非常了解。你擅长用简洁的语言解释概念的本质。请用一句话解释一下概念“反思”。


    **AI 输出：**


    “反思”是对自我或者过去行为、观念的深入思考和审视，以提炼经验、纠正错误并优化未来行动。


    如果我们发现大模型的输出过于简单，可以要求它提供专家级的写作。通过提供所需的专业领域、受众的认知程度或阅读能力等信息，我们可以要求大模型提供更深入、专业的内容。


    **提示词：**


    你是一位大学教授，对各学科知识都非常了解。你在讲解概念时，擅长综合自己的多学科知识，通过学科定义、通俗理解、哲学本质、生活应用四个步骤来一步步引导用户理解概念。请解释一下概念“反思”。


    **AI 输出：**


    学科定义：在心理学和哲学中，“反思”通常被定义为在思考和行动之后对自己的行为或观点进行深入和严谨的分析。反思可能会让人对自己的信仰、价值观和行为模式有所质疑，以期找出可能的改进之处。


    通俗理解：反思就是在我们做了某件事或做出了某个决定后，回头来看，去思考我们的动机，评估结果，看有没有可以改进的地方。这就像看一部电影后，花一些时间去思考并讨论电影的主题、情节和角色。


    哲学本质：在从哲学角度理解现象的性质和本质的过程中，反思是最核心的部分之一。这是一种自我意识的体现，也是理性思维的一种表现。只有通过反思，我们才能从错误中吸取教训，从经验中学习，并不断改进我们的思维方式和分析方法。


    生活应用：在生活中，经常需要反思。每个人都会犯错，但通过反思，可以从中学习，避免犯同样的错误。例如，如果在一次考试中表现得不好，可以反思学习方法、时间管理、复习策略等，以找到可以改进的地方。在人际关系中，也可以通过反思来理解自己的感受，解决冲突，以及改进沟通方式。


    当大模型生成的内容的格式不符合我们的预期时，可以提供一个具体的示例或格式，以让大模型按照这种格式来回答。


    **提示词：**


    你是一位大学教授，对各学科知识都非常了解。你在讲解概念时，擅长综合自己的多学科知识，通过学科定义、通俗理解、哲学本质、生活应用四个步骤来一步步引导用户理解概念。你会按如下样式进行输出：


    ●学科定义：<一句话给出教科书式的定义>


    ●通俗理解：<一句通俗解释+一个简单示例说明>


    ●哲学本质：<该概念在哲学体系中的重要性和位置>


    ●生活应用：<举一个日常生活中应用该概念的案例>


    请解释一下概念“反思”。


    **AI 输出：**


    ●学科定义：反思是一种思考过程，包含在行动或事件发生后，对自己的思想、行为和原理进行深入分析和评价。


    ●通俗理解：简单来说，反思就像是回看录像带，重新评估我们之前做过的决定和行动。例如，你在一场足球比赛后，回看你的表现并思考怎么可以做得更好。


    ●哲学本质：在哲学的学科体系中，反思被看作个人成长和发展的重要部分。它帮助我们理解自己的思维方式，发现我们的主观性和潜意识偏见，从而更全面地理解世界。


    ●生活应用：反思在日常生活中无处不在。比如，当你做了一个重要决策后，你可能会反思你的决策过程，了解你的选择背后的原因，尝试找到可以改进的地方。如果你和朋友吵架了，你可能会反思你的行为，决定是否需要向其道歉或与其和解。


    通过提供更多的详细信息，用户可以获得更准确、更具体的答案。这样可以减少猜测和误解，从而提高交互的效率和对生成内容的满意度。


    善用关键词、概括词、术语等，以清晰地传递意图。图 1-7 展示了一个产品宣传文案生成示例。最开始的结果不理想，我们通过在提示词中添加“标题”这一关键词让模型生成标题，通过指定“七言律诗”这一术语让模型正确输出我们想要的诗歌体裁。


    ![](img/img_00010.jpg)


    图 1-7 如何用清晰的描述改进 AI 结果


    在编写提示词的过程中，类似七言律诗、绝句、莎士比亚风格等常用的概括性描述词和名词术语，往往能更准确地表达用户意图。在模型能够理解的前提下，善用这些概括词和关键词，往往能达到“以少胜多”的效果。如果遇到模型无法准确理解的名词概念，则需在提示词中给出详细的解释和示例，帮助模型学习和理解。


    注意：


    ●细节法是笔者的总结概括。其核心在于清晰地表达和传递自己的意图，并编写清晰的提示词。首先意味着要明确自己的目标和意图，然后准确地用语言表达出来，这与人与人之间的沟通表达要求一致。


    ●编写清晰的提示词是所有提示词设计方法中最重要的一环。能够清晰地表达即可应对 80%的场景，解决 80%的问题。若读者感觉在这一点上有所欠缺，可以适当学习一些沟通表达的方法。


    ●清晰的语法除了自然语义的表达，还包括标点符号、标题和章节标记。这样做有助于传达意图，使输出结果更容易解析。


    ●当自己不清楚自己的需求和意图时，或者在面对自己不熟悉的领域的问题时，可以向 AI 提问，将问题抛给 AI 帮忙解决。


    ### 1.7 示例法


    对于人类来说，同一个提示词的不同表达方式区别不大，但对于大模型来说，最终得到的生成结果可能千差万别。在训练模型的数据中，不同的表达可能来自不同的文本语境并用于不同目的，最终的结果往往难以预测。


    早在 2020 年，Tom B.Brown 等人在他们的论文“Language Models are Few-Shot Learners”中指出：Few-shot（少样本示例）学习是一种让大模型基于少量的示例快速适应新任务的方法。通过给
    ChatGPT 提供几个示例，它可以更好地理解我们的问题，并给出更准确的答案。这就像是给模型提供了一个更明确的上下文或参考，帮助它更好地完成任务。所以，使用
    Few-shot 的方法，大模型的回答质量和准确性都会有所提高。


    我们来看看不同的示例使用方式。


    （1）无样本提示（Zero-shot prompting）


    无样本提示的范例如下。


    **提示词：**


    请为我生成一个描述春天的句子。


    **AI 输出：**


    春天的到来使得世界重新焕发生机，万物复苏，鲜花绽放，绿叶葱茏，空气中弥漫着新生的气息和生命的活力。


    （2）单样本提示（One-shot prompting）


    单样本提示只展示 1 条提示，示例如下。


    **提示词：**


    请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：“绿树村边合，青山郭外斜。”


    **AI 输出：**


    “桃花河畔映，柳絮风中飘。”


    （3）少样本提示（Few-shot prompting）


    少样本提示展示 2 条及以上提示，示例如下。


    **提示词：**请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：


    “绿树村边合，青山郭外斜。”


    “欲把西湖比西子，淡妆浓抹总相宜。”


    “柳色浓烟绿，桃花淡露红。”


    **AI 输出：**


    “樱花洒落繁，春绿涌田间。”


    值得注意的是，在另外一些情况下，提供示例能在一定程度上避免模型的幻觉问题。如果我们能为模型提供与当前查询相关的可信信息，那么就可以指示模型使用所提供的信息来生成答案。例如，在输入内容中补充相关知识，就可以直接要求大模型通过引用所提供文档中的段落来为生成内容添加引文（这也是检索增强生成，即
    RAG 的思路）。注意，输出中的引用可以通过所提供文档中的字符串匹配进行验证。


    **提示词：**


    你会被提供一个用''''''符号包围的文档信息和一个问题。


    你的任务是严格使用''''''包围的文档信息来回答用户的问题，如果文档信息不足以回复用户的问题，那么就直接输出“文档信息无法回答该问题”。


    ```

    {

    "title"："江南曲"，

    "author"："李益"，

    "paragraphs"：[

    "嫁得瞿塘贾，朝朝误妾期。"，

    "早知潮有信，嫁与弄潮儿。"

    ]，

    "dynasty"："唐代"

    }，

    {

    "title"："感遇·江南有丹橘"，

    "author"："张九龄"，

    "paragraphs"：[

    "江南有丹橘，经冬犹绿林。"，

    "岂伊地气暖？自有岁寒心。"，

    "可以荐嘉客，奈何阻重深。"，

    "运命惟所遇，循环不可寻。"，

    "徒言树桃李，此木岂无阴？"

    ]，

    "dynasty"："唐代"

    }，

    {

    "title"："终南望余雪"，

    "author"："祖咏"，

    "paragraphs"：[

    "终南阴岭秀，积雪浮云端。"，

    "林表明霁色，城中增暮寒。"

    ]，

    "dynasty"："唐代"

    }，

    {

    "title"："下终南山过斛斯山人宿置酒"，

    "author"："李白"，

    "paragraphs"：[

    "暮从碧山下，山月随人归。"，

    "却顾所来径，苍苍横翠微。"，

    "相携及田家，童稚开荆扉。"，

    "绿竹入幽径，青萝拂行衣。"，

    "欢言得所憩，美酒聊共挥。"，

    "长歌吟松风，曲尽河星稀。"，

    "我醉君复乐，陶然共忘机。"

    ]，

    "dynasty"："唐代"

    }

    ```


    请给我一首祖咏写的诗。


    **AI 输出：**


    祖咏写的诗是：


    标题：“终南望余雪”


    作者：祖咏


    内容：


    “终南阴岭秀，积雪浮云端。


    林表明霁色，城中增暮寒。”


    朝代：唐代


    注意：


    1）示例法本质是给模型示范，让模型模仿，以提高其学习能力。一方面，可以提高模型的理解能力，就像学习一种方法一样，学习了理论之后总感觉有不到位的地方，当老师再给出一个案例时，一下就懂了。另一方面，能够更好地控制内容以格式化方式输出，就像上面的诗句输出一样。很多时候，在写一些公文、通知等材料时，知道内容怎么写，但不知道怎么排版布局。当有一个模板时，就知道怎么排版了。


    2）一般来说，示例越多，模型模仿和学习的效果越好。当单个示例让模型表现不足时，可以考虑增加示例。但示例也不是越多越好，示例太多会导致提示词内容过长，甚至影响提示词中非示例部分的语义。原则是：满足需求即可，切勿堆砌，一般而言两三个例子即可。


    3）好的示例，一条顶多条，应尽量选用有代表性的示例。


    4）大部分情况下，不提供示例模型也能表现得很好。只是在需要按格式输出时，给出格式框架即可，无须提供完整示例。


    ### 1.8 推理法


    #### 1.8.1 思维链


    2022 年，Jason Wei 等人在论文“Chain-of-Thought Prompting Elicits Reasoning in Large Language
    Models”中提到了思维链（Chain-of-Thought，CoT）方法，这种方法可以显著提升大语言模型进行复杂推理的能力。它鼓励大语言模型解释自己的推理过程，将大目标拆解成小目标，一步步思考和计算最终结果。思维链的主要思想是通过向大语言模型展示少量的示例，在示例中解释推理过程，模型在回答提示时也会显示推理过程。这种推理的解释往往会引导出更准确的结果。


    举例如下：


    **提示词：**地球和火星哪一个适合人类居住？


    **AI 输出：**


    在当前科技水平下，地球是唯一适合人类居住的星球。火星的环境对人类来说极度恶劣，问题包括极低的温度、稀薄的大气、缺乏液态水和食物源等。虽然科学家正在研究如何在火星上建立生态环境以供人类居住，但那仍然是一个未来的目标，而且充满了巨大的挑战。


    而通过 CoT 方法，我们可以将一个多步骤推理问题分解成多个中间步骤，分配更多的计算量，生成更多的答案，再将这些答案拼接在一起提供结果。


    **提示词：**地球和火星哪一个适合人类居住？请详细解释你的推理过程。


    **AI 输出：**


    当前的科学研究和技术，使得人类居住在地球上远比火星上更为容易。以下是一些主要原因：


    1.维持生命的条件：地球拥有适宜维持生命的气候、丰富的水资源、合适的气氛以及独特的生物圈。对比之下，火星的环境无法直接支持人类生活，其表面温度极低，大气稀薄，且主要由二氧化碳构成，而且目前还未在火星上发现液态水。


    2.离地球的距离：火星距离地球数百万公里，在现有的技术下，单程旅行需要花费 6～9 个月的时间。而且，由于地球和火星的轨道关系，安全地来回旅行每 26 个月才有一次机会。这使得向火星运送物资和人员非常困难且成本高昂。


    3.自给自足的挑战：在火星上维系一个人类殖民地将面临诸多挑战，包括必须生产出所有必需的食品和物资，处理低重力导致的健康问题（例如肌肉和骨骼的丧失），以及解决大气层缺乏导致的辐射问题。


    因此，尽管火星是人类赖以生存的最可能的星球之一，但是目前而言，地球更适合人类居住。


    #### 1.8.2 自洽性


    基于 CoT 方法，后续又有学者发布了研究成果：通过多数投票提高 CoT 性能，即自洽性（Self-consistency）方法。这种方法对 CoT 方法进行了补充，它不是只生成一个
    CoT，而是生成多个 CoT，然后取多数答案作为最终答案。


    **提示词：**


    从资源获取、气候条件以及重力效应这三个独立的角度考虑，你认为地球和火星哪一个更适合人类居住？请详细解释你从每个角度考虑的推理过程，并最终整合所有推理结果，输出结论。


    **AI 输出：**


    1.资源获取：地球拥有丰富的水资源，一直被视为生命的源泉。另外，地球还具备支持农业生产的肥沃土壤、野生动植物以及丰富的矿产资源。而火星的水资源主要以冰的形式存在，土壤资源也比较贫瘠，不能直接用于农业生产。矿产资源方面，我们还无法确定火星的矿产资源种类和数量。


    2.气候条件：地球的气候和温度对大多数生物来说非常适宜。而火星冷，平均温度在-80°F（-62°C）左右，尽管在赤道地区的夏天午间，温度可以升至 70°F（21°C）。然而，晚上的温度可能降至-100°F（-73°C）。此外，火星的大气主要由二氧化碳组成，对人类来说是致命的。


    3.重力效应：地球的重力正好可以满足人体迅速消除疲劳和细胞的正常生长繁殖，而火星的重力只有地球的约 38%，长期生活在火星可能会影响肌肉和骨骼的发育。


