- raw: '（3）生产力工具


    ●举例：Email（电子邮件）、Calendar（日历）、Cloud Storage（云存储）。


    ●功能：这些工具能帮助AI管理和处理日常事务，提高工作效率。


    ●设计模式：调用生产力工具能使AI更好地辅助用户完成日常工作，提升整体工作效率和管理能力。


    （4）图像工具


    ●举例：Image Generation（图像生成，如DALL·E）、Image Captioning（图像描述）、Object Detection（目标检测）。


    ●功能：这些工具能帮助AI处理和生成图像，增强其视觉方面的能力。


    ●设计模式：通过调用图像工具，使AI在视觉内容处理和生成方面表现出色，从而扩展其应用场景，优化用户体验。


    现在的AI Agent调用工具的过程更进一步，可以搜索不同的信息来源（Web、Wikipedia、arXiv等），以及与各种生产力工具交互（发送电子邮件、读/写日历条目等），并且我们希望LLM能自动选择正确的函数调用来完成工作。


    ##### 案例：智能农业Agent管理农田


    要更好地理解工具在AI Agent中的应用，我们来看一个具体的例子。


    假设我们设计了一个智能农业Agent，帮助农民管理农田（如图4-14所示）。


    ![](Images/img_00065.jpg)


    图4-14 智能农业Agent管理农田


    1）智能农业Agent需要识别出可用的农业工具（这里指其他工具API），如自动灌溉系统、土壤传感器和无人机。


    2）系统会根据农田的具体情况选择最合适的工具进行管理。在干旱季节，系统会优先使用自动灌溉系统以确保作物得到足够的水分。在检测到病虫害时，系统会选择无人机进行农药喷洒。


    3）智能农业Agent实际调用这些工具，实时监控和调整作业过程，确保农作物健康生长。


    通过调用工具，AI Agent不仅扩展了自身的能力，还能更加高效地完成各种复杂任务。这一模式为AI Agent提供了强大的支持，使它们能在各个领域中发挥出更大的作用。


    同样地，我们也来分析一下“工具调用”这种设计模式的优缺点。


    优点：


    ●增强能力：通过调用外部工具，模型可以处理自身能力范围之外的任务，显著扩大了其应用范围。


    ●提高效率：工具调用模式可以加快任务处理速度，提高解决问题的效率。例如，调用计算工具可以快速完成复杂计算。


    ●提升准确性：利用专门的工具可以提高任务执行的准确性和可靠性，例如使用代码解释器进行精确的代码执行。


    缺点：


    ●依赖性：模型对外部工具的依赖增加，如果工具不可用或出现故障，可能会影响任务的执行。


    ●复杂性：集成和调用多种工具增加了系统的复杂性，需要有效的管理和协调。


    通过工具调用，AI系统能够实现更强大的功能，并提供更优质的服务。这种设计模式体现了AI系统的模块化和灵活性，使其能够根据不同需求灵活调用各种工具，从而提升整体性能和用户满意度。


    #### 4.2.3 规划


    想象一下，你正在计划一次家庭旅行，需要考虑出发时间、交通方式、住宿安排和活动计划等一系列因素。这个过程充满了期待和挑战。同样，AI Agent在执行复杂任务时，也需要进行详细的规划（如图4-15所示）。


    ![](Images/img_00066.jpg)


    图4-15 AI Agent的计划与执行


    规划（Planning）设计模式是一种通过LLM预先计划和组织任务步骤来提高效率与准确性的方法。在这种模式中，AI Agent能够调用LLM通过思维链（Chain
    of Thought，COT）能力进行任务分解。在AI Agent架构中，任务的分解和规划是基于大模型的能力来实现的。大模型的思维链能力通过提示模型逐步思考，将大型任务分解为较小的、可管理的子目标，以便高效处理复杂任务。


    例如，如果我们要求AI Agent对给定的主题进行在线研究，LLM可以将其拆解为特定的子主题，综合各类发现并编写报告。


    例如，当我们要求AI Agent参考一张男孩的图片，绘制一张相同姿势的女孩的图片时，该任务可以分解为两个步骤（如图4-16所示）[^(\[2\])](../Text/AD_00013.xhtml#m2)：


    1）检测男孩图片中的姿势。


    2）根据检测到的姿势渲染女孩的图片。


    ![](Images/img_00067.jpg)


    图4-16 基于大模型实现任务的分解与规划


    LLM 可能会通过输出类似 {tool： pose-detection，input： image.jpg，output： temp1 } {tool： pose-to-image，input：
    temp1，output： final.jpg} 这样的字符串来指定计划，逐步完成我们发出的任务。


    我们由此可以看到规划设计模式的常见步骤：


    1）任务定义：用户提供的复杂任务需求（例如生成特定姿势的图片）。


    AI Agent需要明确其最终目标是什么，就像你在计划家庭旅行时，首先要确定目的地和旅行时间。例如，一个智能清洁机器人在开始工作前，需要设定清洁范围和清洁标准。这种明确的目标设定，让AI
    Agent有了清晰的方向，知道每一步的努力都是为了实现最终目标。


    2）步骤拆解：将任务分解为多个步骤（例如，确定姿势、生成图像和描述等）。


    设定好目标后，AI Agent需要制定具体的行动策略。这一过程类似于你在规划旅行时，需要详细安排每一天的活动。例如，对于物流配送系统，AI需要选择最佳的配送路线，安排配送顺序，甚至需要考虑天气变化对配送的影响。


    3）执行任务：模型依次执行每个步骤，确保每一步都得到正确的结果。例如，使用OpenPose模型确定姿势，使用Google/VIT模型生成图像，使用VIT-GPT2模型生成描述文本。


    在实际执行过程中，环境和条件可能会发生变化，AI Agent需要根据新的情况实时调整其策略。这就像你在旅行过程中遇到突发事件时，需要及时调整计划。例如，智能清洁机器人在清扫过程中，如果发现某个区域有障碍物，它需要重新规划路径，确保清洁任务能够顺利完成。


    4）结果整合输出：将各步骤的结果进行整合，通过LLM分析汇总并生成结果返回给用户。例如，最终生成的结果是包含特定姿势的图像。


    这个步骤类似于我们常用的“分治法”，也像我们在提示词技巧中提到的“复杂问题分解法”，它们都遵循相同的思路。


    ##### 扩展阅读


    （1）ReAct框架[^(\[3\])](../Text/AD_00013.xhtml#m3)


    ReAct框架通过结合推理和行动来增强智能体的能力（如图4-17所示）。ReAct框架允许智能体在接收到信息后立即做出反应，而不是等待所有信息处理完毕。同时，该框架还注重推理和行动的紧密结合，智能体不仅需要分析和理解输入信息，还需要根据分析结果进行相应的行动。这种框架的优点在于其灵活性和环境适应性。


    ![](Images/img_00068.jpg)


    图4-17 ReAct框架的核心流程思想


    （2）ReWOO框架[^(\[4\])](../Text/AD_00013.xhtml#m4)


    在ReWOO框架中，Xu 等人提出了一种结合多步规划器和变量替换的智能体，以实现有效的工具调用（如图4-18所示）。该框架在以下方面改进了ReACT框架：


    ●通过一次性生成一个完整的工具链来减少token消耗和执行时间（ReACT框架需要许多LLM调用，并且存在冗余前缀，因为系统提示和前面的步骤在每个推理步骤中都要提供给LLM）。


    ●简化微调过程。由于规划数据不依赖工具的输出，模型在理论上可以不实际调用工具进行微调。


    ![](Images/img_00069.jpg)


    图4-18 ReWOO框架


    （3）LLMCompiler框架[^(\[5\])](../Text/AD_00013.xhtml#m5)


    LLMCompiler是一种通过在DAG中并行执行任务来加速智能体任务执行的框架（如图4-19所示）。它还通过减少对LLM的调用次数来节省冗余token使用的成本，主要包含3个部分：


    ●规划器：处理流任务的有向无环图。


    ●任务提取单元：在任务可执行时，立即调度并执行任务。


    ●连接器：响应用户请求或触发第二个计划。


    ![](Images/img_00070.jpg)


    图4-19 LLMCompiler框架


    ##### 案例：智能家庭助手准备早餐


    让我们通过一个实际案例更好地理解规划（Planning）在AI Agent中的应用。假设我们设计了一个智能家庭助手，它的任务是每天早上为你准备早餐（如图4-20所示）。这看似简单，但实际上涉及许多规划步骤。


    ![](Images/img_00071.jpg)


    图4-20 智能家庭助手在准备早餐


    1）智能家庭助手需要设定目标：准备一份健康的早餐，包含饮料、主食和水果。


    2）它需要评估可用的资源，比如冰箱中的食材、厨房的设备和时间限制。如果冰箱里的牛奶不够，它需要调整早餐计划，选择其他饮料。


    3）在制定策略时，智能家庭助手需要决定首先做什么，然后做什么，以最有效的方式完成任务。如果它发现咖啡机出现故障，就需要立即调整计划，选择替代的饮品。


    4）通过这些规划步骤，智能家庭助手能够在各种条件下，为你提供满意的早餐服务。


    规划不仅在智能家庭助手中起到重要作用，在许多其他领域也至关重要。例如，在无人驾驶汽车中，规划机制帮助汽车在复杂的道路环境中制定出最安全、最有效的行驶路线。AI系统需要实时评估道路情况、交通信号和其他车辆的行为，并根据这些信息不断调整行驶策略，确保安全行驶。同样，在医疗领域，AI系统通过规划手术流程帮助医生提高手术的成功率和效率。


    简单分析一下“规划”这种设计模式的优缺点。


    优点：


    ●动态决策：规划模式允许智能体动态决定执行任务的步骤，不仅仅依赖预先设定的固定步骤。这使得智能体能够更灵活地应对复杂和不可预测的任务。


    ●任务分解：通过使用大型语言模型（LLM）的规划模式，可将复杂的任务分解为更小的子任务。这不仅提高了任务的可管理性，还增强了智能体处理复杂问题的能力。


    ●适应性和灵活性：智能体在遇到意外情况时能够调整，例如在API调用失败时自动切换到其他可用工具。


    缺点：


    ●不可预测性：由于规划模式的决策是动态的，结果可能会有较大的不确定性。这意味着在某些情况下，智能体的行为可能难以预测，从而导致结果不如预期。


    ●技术成熟度：尽管规划模式展示了强大的潜力，但当前这项技术尚不够成熟。


    ●复杂性和资源需求：规划模式的实现需要智能体具备高级的理解与决策能力，这对计算资源和算法的复杂性提出了更高的要求，可能增加系统开发与维护的成本。


    规划模式在增强智能体处理复杂任务的灵活性和适应性方面具有显著优势，但也面临着技术成熟度和结果不可预测性方面的挑战。随着技术的不断发展和改进，规划模式有望在未来变得更加成熟和可靠。


    #### 4.2.4 多智能体协作


    多智能体协作，这一模式使多个AI Agent能够合作完成复杂的任务，就像一个高效的团队，每个成员都在发挥自己的特长，共同实现一个目标。这种协作不仅可以提高效率，还能解决单个智能体难以应对的问题。


    例如一个智能城市管理系统，其中的每个智能体都负责不同的任务。有些负责交通管理，有些负责能源分配，还有些负责公共安全。通过相互之间的协作，它们能够确保城市的各项功能高效运转。例如，在交通高峰期，交通管理智能体可以与能源分配智能体协作，确保交通信号灯和其他关键基础设施的电力供应。


    多智能体协作（Multi-agent Collaboration）设计模式是一种通过多个智能体之间的合作来提高任务执行效率和准确性的方法。在这一模式中，各个智能体分担任务，并通过相互交流与协作，共同完成复杂任务。


    ChatDev是一个多Agent系统的示例（如图4-21所示）。它是GitHub上的一个开源项目，你可以通过提示使LLM有时表现得像软件工程公司的CEO，有时像设计师，有时像产品经理，有时像测试人员。


    ![](Images/img_00072.jpg)


    图4-21 多智能体协作示例


    通过提示大模型，告诉它你现在是CEO，请开发一个多人游戏。它们实际上会花费几分钟时间编写代码、测试和迭代，并最终生成一个出人意料的复杂程序。


    这种多Agent合作听起来可能有些奇特，但实际上它的效果比你想象的可能要好。这不仅是因为这些Agent之间的合作能够带来更加丰富和多样的输入，还因为它能够模拟出一个更加接近真实工作环境的场景，拥有不同专业知识的人员为了共同的目标而努力。这种方式的强大之处在于它能够让LLM不再是执行单一任务的工具，而是成为一个能够处理复杂问题和工作流的协作系统。


    我们由此可以看到多智能体协作设计模式的常见步骤。


    1）任务定义：用户提出需要多智能体合作的复杂任务需求（例如开发《愤怒的小鸟》游戏）。


    2）智能体分工：不同智能体负责不同部分的任务（比如需求文档撰写、界面设计、代码开发、测试等）。


    任务分解后，AI系统需要为每个子任务分配合适的智能体，就像一个项目经理根据每个人的专长分配工作一样。比如，在一个自动化仓库中，一些机器人负责搬运货物，一些机器人负责分类，而另一些机器人则负责包装。这种明确的角色分配让每个智能体都能发挥其最大的作用。


    3）协作执行：各个智能体通过交流与协作，共同完成任务。每个智能体在执行自己部分任务的同时，会与其他智能体交换信息和提供反馈。


    智能体之间需要通过高效的通信进行协调，确保各个子任务能够顺利衔接。这就像团队成员之间的沟通交流，以确保信息的及时传递和任务的有效衔接。例如，在无人驾驶汽车群中，每辆车需要与周围的车辆实时交换信息，以确保行车安全和路线优化。


    4）结果整合输出：将各个智能体完成的部分任务结果整合起来，从而完成整个任务（例如，最终完成《愤怒的小鸟》游戏）。


    这种方法的潜在价值巨大，因为它为自动化和提升工作效率提供了新的可能性。例如，通过模拟一个软件开发团队的不同角色，一个企业可以自动化某些开发任务，从而加快项目进度并减少错误。同样，这种多
    Agent 合作方式也可以应用于其他领域，如内容创作、教育和培训、策略规划等，进一步拓宽 LLM 在各个行业的应用范围。


