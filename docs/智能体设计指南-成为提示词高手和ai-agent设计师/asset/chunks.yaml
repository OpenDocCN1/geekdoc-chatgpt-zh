    ![](Images/img_00051.jpg)


    图3-17 扣子平台的“多语言翻译大师”AI Agent搭建完成


    多语言翻译大师就像一把为你量身定制的万能钥匙，无论你想要文本翻译、语音翻译还是图片翻译，它都能轻松完成。我们可以打开扣子的Bot商店，然后搜索刚刚创建的“多语言翻译大师”，就能与它互动了。


