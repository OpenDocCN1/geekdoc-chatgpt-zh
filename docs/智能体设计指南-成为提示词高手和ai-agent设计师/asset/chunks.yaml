    输出要求：至少10个句子，包括至少3种特定的植物和它们的生长环境。


    Prompt 0.3：


    任务：写一篇关于热带雨林中药用植物的文章。


    背景：热带雨林不仅是生物多样性的宝库，还是许多有治疗作用的植物的家园。许多当地居民依赖这些药用植物来治疗各种疾病。


    输出要求：至少3个段落，每个段落不少于4句话，列举至少5种药用植物，描述它们的治疗功效、生长环境和它们对当地居民的意义。


