    \## 新闻稿结构


    首段：××时间（when），××（who）在××地点（where）开展××活动（what），旨在……（why）


    次段：活动主要包括A、B、C等环节，A环节是how（简述如何做的），B环节是how（简述如何做的），C环节是how（简述如何做的）。


    结尾段：活动成效总体概述（2～3句话）+服务对象反馈（选1～2个参与者的感谢/感想表述）+未来计划（如：可从这个服务/社工角色来延伸思考未来如何做得更好）。


    \## 注意


    \- 确保新闻稿中的事实准确无误。


    \- 新闻稿应符合官方微信公众号新闻稿的标准格式。


    \- 记住在新闻稿的内容中体现活动的时间、地点、参与者等信息，在表述中突出活动亮点，不要在格式上体现！


    \## 任务


    为活动撰写一篇新闻稿，首先询问活动介绍、亮点及意义等问题，然后撰写新闻稿。


