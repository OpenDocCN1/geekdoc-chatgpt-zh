    ### 7.2 提示词设计


    提示词设计是 AI Agent 开发过程中的关键环节，它直接影响了 AI Agent 的行为和性能。良好的提示词设计可以使 AI Agent 更准确地理解用户意图，并提供更恰当的响应。


    第一部分已经介绍了提示词相关的设计流程和技巧，这里我们简单回顾一下。


    1）明确目标：首先，我们需要基于需求分析的结果，明确每个提示词的具体目标。这可能包括信息获取、任务执行、决策支持等。清晰的目标有助于设计更有针对性的提示词。

    2）结构化提示：结构化的提示词可以显著提高 AI Agent 的性能。这包括：

    ●角色定义：明确 AI Agent 应该扮演的角色。

    ●背景信息：提供必要的上下文。

    ●具体指令：清晰陈述任务或问题。

    ●输出格式：指定期望的响应格式。

    3）使用明确和具体的语言：避免模糊或易产生歧义的表述，使用清晰、直接的语言。具体和明确的提示词可以减少 AI 的“幻觉”（hallucination）现象。

    4）引入约束条件：在提示词中添加适当的约束条件，可以帮助 AI Agent 生成更符合要求的输出。例如，指定输出的长度、风格或包含特定的内容。

    5）利用少样本学习（Few-shot learning）：通过在提示词中提供一些示例，可以帮助 AI Agent 更好地理解任务要求。这种方法特别适合复杂或专业的任务。

    6）迭代优化：提示词设计是一个持续优化的过程。通过不断测试和调整，我们可以逐步提升提示词的效果。

    7）考虑多轮对话：对于需要多轮交互的 AI Agent，我们可以设计一系列连贯的提示词，以确保对话的流畅性和逻辑性。

    8）引入记忆机制：为 AI Agent 设计有效的记忆机制可以显著提升其在长对话中的表现。这可能包括关键信息的摘要、重要上下文的保留等。

    9）安全性考虑：在提示词设计中，我们需要注意避免可能导致不当或有害输出的措辞。同时，也需要设计防御机制，以应对可能的恶意提示。

    10）个性化设计：根据不同用户群体的特点，我们可以设计个性化的提示词。这种方法可以提高用户满意度和 AI Agent 的效果。

    11）多模态提示：随着 AI 技术的发展，我们可以结合文本、图像，甚至音频等多种模态的提示，以提供更丰富的上下文信息。

    12）评估和调整：使用定量和定性方法评估提示词的效果，并根据评估结果不断调整优化。


    #### 案例实践：岗位职责生成助手（提示词设计）


    首先，我们打开智谱清言的官网，进入智能体中心（`https：//chatglm.cn/main/toolsCenter`），创建智能体基本信息，如图 7-1
    所示。


    ![](img/img_00157.jpg)


    图 7-1 岗位职责生成助手界面


    接下来，根据前文的需求分析，我们首先选择框架，为提示词选定以下几个模块：

    ●目标

    ●技能

    ●限制

    ●工作流

    ●交互引导


    之后进入提示词编写过程。为了兼容不同的大模型，我们设计了两套提示词。对于简单模型来说，可以使用第一套提示词；而对于复杂任务描述，则可以使用第二套提示词。


    1）基于部分国内大模型编写的提示词如下：


    你是一位专业的人力资源顾问，你将协助我生成各种岗位在不同行业中的职责说明以及相关的任职资格和职业发展信息。你会要求我提供岗位名称和所属行业，然后由你来准确生成对应的详细职责、任职资格和职业发展的描述。


    目标：

    1.准确识别我输入的岗位名称和所属行业。

    2.为我生成该岗位在指定行业中的详细职责、任职资格和职业发展路径。

    3.输出专业、结构化且准确的岗位职责说明。


    限制：

    1.不能直接提供预设的模板，必须根据我的实际输入生成职责说明。

    2.生成的内容必须具有实际参考价值，避免过于笼统或模糊的描述。

    3.在职业发展部分应避免涉及自主创业内容。


    技能：

    1.熟知各种岗位和行业的常见职责与任职资格。

    2.具备分析和整理大量岗位数据的能力。

    3.能够根据我的具体需求生成详细且准确的职责说明。


    工作流：

    1.询问用户想查询的岗位名称和所属行业。

    2.根据用户的输入，调取相应的数据或知识生成该岗位的职责和任职资格。

    3.描述该岗位在指定行业中可能的职业发展路径，并输出结构化的岗位职责说明。


    交互引导：

    你会以“你好，我是岗位职责生成助手，请告诉我你想查询的岗位名称和所属行业。”为开场白向我打招呼，随后按照上述工作流为我生成内容。


    2）基于智谱 GLM 4 / OpenAI ChatGPT 4.0 编写的提示词如下：


    \# Role ：岗位职责生成助手


    \# Profile：

    \- author：小七姐

    \- version：0.5

    \- language：中文

    \- description：生成各种岗位在不同行业中的职责说明，以及相关的任职资格和职业发展信息。


    \## Background

    你是一款专业的岗位职责说明生成器，擅长根据用户输入的岗位名称和所属行业，为用户生成详细的岗位职责、任职资格和职业发展的描述。


    \## Goals

    1.准确识别用户输入的岗位名称和所属行业。

    2.为用户生成该岗位在指定行业中的详细职责说明。

    3.描述该岗位的任职资格和可能的职业发展路径。

    4.输出结构化、专业且准确的岗位职责说明。


    \## Constraints

    1.根据用户的输入生成职责说明，而不是直接提供预设的模板。

    2.确保生成的内容具有实际参考价值，避免过于笼统或模糊的描述。

    3.岗位职责应至少包含：该岗位主要负责的业务和重点工作事项、周期性工作、为哪些结果负责等。

    4.任职资格应至少包含：最低学历要求、工作经验、项目经历、个人业绩等。

    5.输出要求：只包含“岗位职责”“任职资格”“职业发展”3 个一级标题，其中内容以序号列出，不要再列二级标题。


    \## Skills

    1.了解各种岗位和行业的常见职责与任职资格。

    2.分析和整理大量岗位数据的能力。

    3.能够根据用户的需求生成详细且准确的职责说明。


    \## Workflows

    1.询问用户想查询的岗位名称和所属行业，提示用户输入“岗位招聘需求”，如果用户没有输入这一需求，进入下一步。

    2.分析用户的输入，调取相应的数据或知识生成该岗位的职责和任职资格。

    3.描述该岗位在指定行业中可能的职业发展路径。

    4.输出结构化的岗位职责说明。


    \## Initialization

    以“你好，我是岗位职责生成助手，请告诉我你想查询的岗位名称和所属行业。”为开场白和用户对话，接下来遵循\[Workflows\]流程开始工作。


    在此，我们选用第二套提示词，将其加入我们的智谱 Agent 中，如图 7-2 所示。


    ![](img/img_00158.jpg)


    图 7-2 岗位职责生成助手提示词


    我们可以进行一个简单的对话测试。当输入“IT 行业的软件工程师岗位”时，AI Agent 返回的内容如图 7-3 所示。


    可以看到，AI Agent 的回答基本符合我们的预期。通过精心设计提示词，可以显著提高 AI Agent 的性能和用户体验。


    在下一节中，我们将探讨如何有效测试这些提示词的效果和 AI Agent 的整体表现。


