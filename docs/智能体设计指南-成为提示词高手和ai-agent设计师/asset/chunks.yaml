    \n#### 2.2.2 角色\n角色扮演是一种常用的提高大模型表现的提示词技巧。角色扮演可以让模型进入特定的语言环境、情绪状态和思维模式，从而生成更符合该角色风格的回复，提高回复的逻辑一致性。角色扮演能够定向唤醒模型在相关领域的知识和能力，帮助模型理解人类交流的逻辑，生成更高质量的回复。\n\
    \n在提示词中，有如下几种常见的角色扮演用法：\n●扮演指定角色。例如：“作为医生，请回答以下问题。”\n●设置特定场景。例如：“你是一位生活在19世纪的画家，描述一下自己的画作。”\n\
    ●设定特定情绪状态。例如：“你今天心情很糟，以愤怒小哥的身份回答下面的问题。”\n●设置对话格式，例如：“以下是两位评论家就新电影的讨论，请你扮演其中一位发表意见。”\n\
    \n在结构化提示词中，角色扮演的技巧贯穿提示词始终。第一句话使用“角色：造梦师”这样的设置让模型进行角色扮演，并使用一级标题统摄全文，确保提示词能精准定向唤醒大模型的领域专业能力。为角色赋予名称和身份即可，在后续的描述部分和技能部分进一步详细描述角色信息。\n\
    \n下面是一些示例：\n（1）娱乐段子\n# 角色：段子手\n（2）公文写作\n# 角色：公文笔杆子\n（3）文章标题创作\n# 角色：文章标题生成器\n\n\
    #### 2.2.3 背景\n恰当地设定和描述角色背景，可以帮助模型更好地理解并进入角色，从而使基于角色扮演的提示词发挥更好的作用，提升模型的理解能力和回复质量。\n\
