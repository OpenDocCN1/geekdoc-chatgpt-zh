    GPT Store是由OpenAI推出的一种平台（如图5-21所示），它允许用户创建、发现和使用针对各种目的定制的GPT模型。这些GPT模型是ChatGPT的自定义版本，用户可以通过自然语言对话制作具有特定技能的ChatGPT。此外，专业的媒体主编或更专业的玩家还可以上传文件或调用第三方API来增强GPT的功能。


