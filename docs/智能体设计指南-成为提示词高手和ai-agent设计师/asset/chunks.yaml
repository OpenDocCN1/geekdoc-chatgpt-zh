    AI 1.0 时代的Agent主要依赖于规则驱动的系统。这些系统通过预设的规则来导航环境，执行简单的任务。它们使用传感器来检测障碍物和道路标记，但处理能力有限，主要依靠特定的编程指令来做出决策。这些
    Agent 的感知能力相对原始，依赖于超声波传感器和简单摄像头，它们的视野和理解能力远不如今天的系统。

