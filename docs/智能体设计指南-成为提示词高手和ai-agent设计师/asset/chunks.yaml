    ### 11.7 常见的多智能体开源项目


    #### 11.7.1 MetaGPT


    MetaGPT是一个全球知名的多智能体框架，如图11-19所示。它模拟了一个虚拟软件公司的运作模式。通过将不同的AI智能体分配为产品经理、架构师、项目经理和工程师等角色，MetaGPT能够协同工作，将简单的需求转化为完整的软件开发方案。它不仅可以生成用户故事、竞争分析、需求文档、数据结构设计和接口规范，还能提供全面的项目文档。这种独特的方法为复杂的软件开发过程提供了高效、系统化的解决方案，展现了人工智能在软件工程领域的强大潜力。


    项目地址为https：//github.com/geekan/MetaGPT。


    ![](Images/img_00266.jpg)


    图11-19 MetaGPT的框架


    #### 11.7.2 generative\_agents


    斯坦福大学的“虚拟小镇”演示项目是论文《生成智能代理：人类行为的交互模拟》中的AI实验，一经面世便风靡全球。该研究在像素风格的虚拟小镇中部署了25个AI智能体。这些智能体不仅能够模拟人类日常生活行为，可以相互交互，还可以与虚拟环境互动，甚至能与现实世界的人类进行互动，如图11-20所示。


    项目地址为https：//github.com/joonspk-research/generative\_agents。


    ![](Images/img_00267.jpg)


    图11-20 斯坦福“虚拟小镇”项目演示


    #### 11.7.3 BabyAGI


    BabyAGI是一个AI驱动的任务管理系统，发布时与AutoGPT项目齐名。它包含4个关键Agent：执行Agent使用LLM完成任务；任务创建Agent基于目标和前一个任务的结果生成新任务；优先级Agent对任务列表重新排序；上下文Agent负责存储和检索任务结果。


    BabyAGI的工作流如图11-21所示。这种设计允许系统根据目标和上下文自主管理任务流程，展现了AI在复杂任务管理中的应用潜力。


