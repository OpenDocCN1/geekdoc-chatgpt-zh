    ### 案例：多智能体协作的智能农业系统

    假设我们设计了一个智能农业系统（如图4-25所示），其中包括多种智能体：无人机负责监测农作物的生长状况，自动灌溉系统根据监测数据调整灌溉量，机器人负责施肥和除草。

    ![](Images/img_00076.jpg)

    图4-25 多智能体协作的智能农业系统

    通过这些智能体的协同工作，农场能够实现高效管理和精准农业。无人机飞过农田，实时采集数据并传输给中央系统；中央系统分析数据后，指示自动灌溉系统和机器人进行相应的操作。

    这种高效的协同工作不仅提高了农作物的产量，还减少了资源浪费。

    简单分析一下多智能体协作设计模式的优点和缺点。

    优点：

    ●专业化：多智能体协作模式将复杂任务分解为更小的子任务，并由不同的智能体执行这些子任务。这种分工和专业化使得每个智能体可以专注于其特定领域，提高任务完成的效率和质量。

    ●提高任务效率：由于每个智能体可以同时处理不同的子任务，多智能体协作能够显著提高任务的整体完成速度。这种并行处理方式在需要快速响应的应用场景中特别有效，例如实时数据处理和复杂系统的管理。

    ●增强系统鲁棒性：多智能体系统通过任务的分散处理和信息的共享，提高了系统的鲁棒性。当某个智能体出现故障或性能下降时，其他智能体可以接管其任务，避免系统整体失效。

    缺点：

    ●复杂性和协调成本：多智能体系统的设计和实施较为复杂，需要精细设计智能体间的交互协议和信息传递机制，这增加了系统开发和维护的成本。

    ●技术成熟度：当前的多智能体协作技术尚未完全成熟，尤其是在复杂任务和动态环境中，智能体的决策和协作能力仍有待提升。

    ●结果难以预测：由于多智能体协作涉及多个独立智能体的交互，其结果可能具有较高的不确定性。这种难以预测性可能在某些关键任务中带来风险，需要额外的监控和调整措施来确保系统的稳定性。

    通过多智能体协作，AI系统展现出强大的综合能力。每个智能体都专注于自己的任务，同时通过协作实现更大的目标。这不仅提高了效率，也使AI系统能够应对更加复杂和动态的环境。未来，随着AI技术的不断进步，多智能体协作将为我们带来更多创新的解决方案和应用场景。

    每当笔者看到这些智能体协同工作的画面，都会感受到一种奇妙的力量。这种力量来自科技，也来自合作。就像我们在人类社会中，通过合作和协同，才能实现更大的成就和更美好的生活。AI
    Agent在多智能体协作中的表现，正是这种合作精神的最佳体现。


    ## 4.3 扩展

    AI Agent/Agentic Workflow 对 AI 应用的落地至关重要，因为它能够拓展 AI 的使用场景，并且有效提高任务完成的质量。

    （1）任务集拓展

    引入`Agentic Workflow`后，AI能够执行的任务种类将显著增加。这意味着AI不仅能处理更广泛的任务，还能更高效地完成复杂任务。

    （2）任务委派与耐心等待

    我们需要习惯将任务委派给AI Agent，并耐心等待其完成。随着AI Agent能力的提升，它们能够在较长时间内完成更复杂的任务，这需要我们调整预期目标和工作方式。

    （3）快速token生成的重要性

    `token`的生成速度对AI的性能至关重要。即使是质量较低的语言模型，通过生成更多的`token`，仍能获得良好的结果。这表明，`token`的生成速度和数量在一定程度上可以弥补模型质量的不足。

    （4）早期模型的Agentic Reasoning性能表现

    即使是早期版本的模型（如`GPT-4`），通过应用`Agentic Reasoning`方法，也能达到接近未来更先进模型（如`GPT-5`、`Claude
    4`、`Gemini 2.0`）的性能。这意味着我们可以在现有技术基础上，通过优化工作流和方法，提升模型的实际应用效果。

    '
  trans: '


    ### (3) 生产力工具

    ●举例：`Email`（电子邮件）、`Calendar`（日历）、`Cloud Storage`（云存储）。

    ●功能：这些工具能帮助 AI 管理和处理日常事务，提高工作效率。

    ●设计模式：调用生产力工具能使 AI 更好地辅助用户完成日常工作，提升整体工作效率和管理能力。


    ### (4) 图像工具

    ●举例：`Image Generation`（图像生成，如`DALL·E`）、`Image Captioning`（图像描述）、`Object Detection`（目标检测）。

    ●功能：这些工具能帮助 AI 处理和生成图像，增强其视觉方面的能力。

    ●设计模式：通过调用图像工具，使 AI 在视觉内容处理和生成方面表现出色，从而扩展其应用场景，优化用户体验。


    现在的 AI Agent 调用工具的过程更进一步，可以搜索不同的信息来源（`Web`、`Wikipedia`、`arXiv`等），以及与各种生产力工具交互（发送电子邮件、读/写日历条目等），并且我们希望`LLM`能自动选择正确的函数调用来完成工作。


    ### 案例：智能农业 Agent 管理农田

    要更好地理解工具在 AI Agent 中的应用，我们来看一个具体的例子。

    假设我们设计了一个智能农业 Agent，帮助农民管理农田（如图 4-14 所示）。

    ![](img/img_00065.jpg)

    图 4-14 智能农业 Agent 管理农田

    1）智能农业 Agent 需要识别出可用的农业工具（这里指其他工具 API），如自动灌溉系统、土壤传感器和无人机。

    2）系统会根据农田的具体情况选择最合适的工具进行管理。在干旱季节，系统会优先使用自动灌溉系统以确保作物得到足够的水分。在检测到病虫害时，系统会选择无人机进行农药喷洒。

    3）智能农业 Agent 实际调用这些工具，实时监控和调整作业过程，确保农作物健康生长。

    通过调用工具，AI Agent 不仅扩展了自身的能力，还能更加高效地完成各种复杂任务。这一模式为 AI Agent 提供了强大的支持，使它们能在各个领域中发挥出更大的作用。

    同样地，我们也来分析一下“工具调用”这种设计模式的优缺点。

    优点：

    ●增强能力：通过调用外部工具，模型可以处理自身能力范围之外的任务，显著扩大了其应用范围。

    ●提高效率：工具调用模式可以加快任务处理速度，提高解决问题的效率。例如，调用计算工具可以快速完成复杂计算。

    ●提升准确性：利用专门的工具可以提高任务执行的准确性和可靠性，例如使用代码解释器进行精确的代码执行。

    缺点：

    ●依赖性：模型对外部工具的依赖增加，如果工具不可用或出现故障，可能会影响任务的执行。

    ●复杂性：集成和调用多种工具增加了系统的复杂性，需要有效的管理和协调。

    通过工具调用，AI 系统能够实现更强大的功能，并提供更优质的服务。这种设计模式体现了 AI 系统的模块化和灵活性，使其能够根据不同需求灵活调用各种工具，从而提升整体性能和用户满意度。


    ## 4.2.3 规划

    想象一下，你正在计划一次家庭旅行，需要考虑出发时间、交通方式、住宿安排和活动计划等一系列因素。这个过程充满了期待和挑战。同样，AI Agent 在执行复杂任务时，也需要进行详细的规划（如图
    4-15 所示）。

    ![](img/img_00066.jpg)

    图 4-15 AI Agent 的计划与执行

    规划（Planning）设计模式是一种通过`LLM`预先计划和组织任务步骤来提高效率与准确性的方法。在这种模式中，AI Agent 能够调用`LLM`通过思维链（Chain
    of Thought，`COT`）能力进行任务分解。在 AI Agent 架构中，任务的分解和规划是基于大模型的能力来实现的。大模型的思维链能力通过提示模型逐步思考，将大型任务分解为较小的、可管理的子目标，以便高效处理复杂任务。

    例如，如果我们要求 AI Agent 对给定的主题进行在线研究，`LLM`可以将其拆解为特定的子主题，综合各类发现并编写报告。

    例如，当我们要求 AI Agent 参考一张男孩的图片，绘制一张相同姿势的女孩的图片时，该任务可以分解为两个步骤（如图 4-16 所示）[^(\[2\])](../Text/AD_00013.xhtml#m2)：

    1）检测男孩图片中的姿势。

    2）根据检测到的姿势渲染女孩的图片。

    ![](img/img_00067.jpg)

    图 4-16 基于大模型实现任务的分解与规划

    `LLM`可能会通过输出类似 `{tool： pose-detection，input： image.jpg，output： temp1 } {tool：
    pose-to-image，input： temp1，output： final.jpg}` 这样的字符串来指定计划，逐步完成我们发出的任务。

    我们由此可以看到规划设计模式的常见步骤：

    1）任务定义：用户提供的复杂任务需求（例如生成特定姿势的图片）。

    AI Agent 需要明确其最终目标是什么，就像你在计划家庭旅行时，首先要确定目的地和旅行时间。例如，一个智能清洁机器人在开始工作前，需要设定清洁范围和清洁标准。这种明确的目标设定，让
    AI Agent 有了清晰的方向，知道每一步的努力都是为了实现最终目标。

    2）步骤拆解：将任务分解为多个步骤（例如，确定姿势、生成图像和描述等）。

    设定好目标后，AI Agent 需要制定具体的行动策略。这一过程类似于你在规划旅行时，需要详细安排每一天的活动。例如，对于物流配送系统，AI 需要选择最佳的配送路线，安排配送顺序，甚至需要考虑天气变化对配送的影响。

    3）执行任务：模型依次执行每个步骤，确保每一步都得到正确的结果。例如，使用`OpenPose`模型确定姿势，使用`Google/VIT`模型生成图像，使用`VIT-GPT2`模型生成描述文本。

    在实际执行过程中，环境和条件可能会发生变化，AI Agent 需要根据新的情况实时调整其策略。这就像你在旅行过程中遇到突发事件时，需要及时调整计划。例如，智能清洁机器人在清扫过程中，如果发现某个区域有障碍物，它需要重新规划路径，确保清洁任务能够顺利完成。

    4）结果整合输出：将各步骤的结果进行整合，通过`LLM`分析汇总并生成结果返回给用户。例如，最终生成的结果是包含特定姿势的图像。

    这个步骤类似于我们常用的“分治法”，也像我们在提示词技巧中提到的“复杂问题分解法”，它们都遵循相同的思路。


    ### 扩展阅读

    （1）`ReAct`框架[^(\[3\])](../Text/AD_00013.xhtml#m3)

    `ReAct`框架通过结合推理和行动来增强智能体的能力（如图 4-17 所示）。`ReAct`框架允许智能体在接收到信息后立即做出反应，而不是等待所有信息处理完毕。同时，该框架还注重推理和行动的紧密结合，智能体不仅需要分析和理解输入信息，还需要根据分析结果进行相应的行动。这种框架的优点在于其灵活性和环境适应性。

    ![](img/img_00068.jpg)

    图 4-17 `ReAct`框架的核心流程思想

    （2）`ReWOO`框架[^(\[4\])](../Text/AD_00013.xhtml#m4)

    在`ReWOO`框架中，Xu 等人提出了一种结合多步规划器和变量替换的智能体，以实现有效的工具调用（如图 4-18 所示）。该框架在以下方面改进了`ReACT`框架：

    ●通过一次性生成一个完整的工具链来减少 token 消耗和执行时间（`ReACT`框架需要许多`LLM`调用，并且存在冗余前缀，因为系统提示和前面的步骤在每个推理步骤中都要提供给`LLM`）。

    ●简化微调过程。由于规划数据不依赖工具的输出，模型在理论上可以不实际调用工具进行微调。

    ![](img/img_00069.jpg)

    图 4-18 `ReWOO`框架

    （3）`LLMCompiler`框架[^(\[5\])](../Text/AD_00013.xhtml#m5)

    `LLMCompiler`是一种通过在`DAG`中并行执行任务来加速智能体任务执行的框架（如图 4-19 所示）。它还通过减少对`LLM`的调用次数来节省冗余
    token 使用的成本，主要包含 3 个部分：

    ●规划器：处理流任务的有向无环图。

    ●任务提取单元：在任务可执行时，立即调度并执行任务。

    ●连接器：响应用户请求或触发第二个计划。

    ![](img/img_00070.jpg)

    图 4-19 `LLMCompiler`框架


    ### 案例：智能家庭助手准备早餐

    让我们通过一个实际案例更好地理解规划（Planning）在 AI Agent 中的应用。假设我们设计了一个智能家庭助手，它的任务是每天早上为你准备早餐（如图
    4-20 所示）。这看似简单，但实际上涉及许多规划步骤。

    ![](img/img_00071.jpg)

    图 4-20 智能家庭助手在准备早餐

    1）智能家庭助手需要设定目标：准备一份健康的早餐，包含饮料、主食和水果。

    2）它需要评估可用的资源，比如冰箱中的食材、厨房的设备和时间限制。如果冰箱里的牛奶不够，它需要调整早餐计划，选择其他饮料。

    3）在制定策略时，智能家庭助手需要决定首先做什么，然后做什么，以最有效的方式完成任务。如果它发现咖啡机出现故障，就需要立即调整计划，选择替代的饮品。

    4）通过这些规划步骤，智能家庭助手能够在各种条件下，为你提供满意的早餐服务。

    规划不仅在智能家庭助手中起到重要作用，在许多其他领域也至关重要。例如，在无人驾驶汽车中，规划机制帮助汽车在复杂的道路环境中制定出最安全、最有效的行驶路线。AI
    系统需要实时评估道路情况、交通信号和其他车辆的行为，并根据这些信息不断调整行驶策略，确保安全行驶。同样，在医疗领域，AI 系统通过规划手术流程帮助医生提高手术的成功率和效率。

    简单分析一下“规划”这种设计模式的优缺点。

    优点：

    ●动态决策：规划模式允许智能体动态决定执行任务的步骤，不仅仅依赖预先设定的固定步骤。这使得智能体能够更灵活地应对复杂和不可预测的任务。

    ●任务分解：通过使用大型语言模型（`LLM`）的规划模式，可将复杂的任务分解为更小的子任务。这不仅提高了任务的可管理性，还增强了智能体处理复杂问题的能力。

    ●适应性和灵活性：智能体在遇到意外情况时能够调整，例如在 API 调用失败时自动切换到其他可用工具。

    缺点：

    ●不可预测性：由于规划模式的决策是动态的，结果可能会有较大的不确定性。这意味着在某些情况下，智能体的行为可能难以预测，从而导致结果不如预期。

    ●技术成熟度：尽管规划模式展示了强大的潜力，但当前这项技术尚不够成熟。

    ●复杂性和资源需求：规划模式的实现需要智能体具备高级的理解与决策能力，这对计算资源和算法的复杂性提出了更高的要求，可能增加系统开发与维护的成本。

    规划模式在增强智能体处理复杂任务的灵活性和适应性方面具有显著优势，但也面临着技术成熟度和结果不可预测性方面的挑战。随着技术的不断发展和改进，规划模式有望在未来变得更加成熟和可靠。


    ## 4.2.4 多智能体协作

    多智能体协作，这一模式使多个 AI Agent 能够合作完成复杂的任务，就像一个高效的团队，每个成员都在发挥自己的特长，共同实现一个目标。这种协作不仅可以提高效率，还能解决单个智能体难以应对的问题。

    例如一个智能城市管理系统，其中的每个智能体都负责不同的任务。有些负责交通管理，有些负责能源分配，还有些负责公共安全。通过相互之间的协作，它们能够确保城市的各项功能高效运转。例如，在交通高峰期，交通管理智能体可以与能源分配智能体协作，确保交通信号灯和其他关键基础设施的电力供应。

    多智能体协作（Multi-agent Collaboration）设计模式是一种通过多个智能体之间的合作来提高任务执行效率和准确性的方法。在这一模式中，各个智能体分担任务，并通过相互交流与协作，共同完成复杂任务。

    `ChatDev`是一个多 Agent 系统的示例（如图 4-21 所示）。它是 GitHub 上的一个开源项目，你可以通过提示使`LLM`有时表现得像软件工程公司的
    CEO，有时像设计师，有时像产品经理，有时像测试人员。

    ![](img/img_00072.jpg)

    图 4-21 多智能体协作示例

    通过提示大模型，告诉它你现在是 CEO，请开发一个多人游戏。它们实际上会花费几分钟时间编写代码、测试和迭代，并最终生成一个出人意料的复杂程序。

    这种多 Agent 合作听起来可能有些奇特，但实际上它的效果比你想象的可能要好。这不仅是因为这些 Agent 之间的合作能够带来更加丰富和多样的输入，还因为它能够模拟出一个更加接近真实工作环境的场景，拥有不同专业知识的人员为了共同的目标而努力。这种方式的强大之处在于它能够让`LLM`不再是执行单一任务的工具，而是成为一个能够处理复杂问题和工作流的协作系统。

    我们由此可以看到多智能体协作设计模式的常见步骤。

    1）任务定义：用户提出需要多智能体合作的复杂任务需求（例如开发《愤怒的小鸟》游戏）。

    2）智能体分工：不同智能体负责不同部分的任务（比如需求文档撰写、界面设计、代码开发、测试等）。

    任务分解后，AI 系统需要为每个子任务分配合适的智能体，就像一个项目经理根据每个人的专长分配工作一样。比如，在一个自动化仓库中，一些机器人负责搬运货物，一些机器人负责分类，而另一些机器人则负责包装。这种明确的角色分配让每个智能体都能发挥其最大的作用。

    3）协作执行：各个智能体通过交流与协作，共同完成任务。每个智能体在执行自己部分任务的同时，会与其他智能体交换信息和提供反馈。

    智能体之间需要通过高效的通信进行协调，确保各个子任务能够顺利衔接。这就像团队成员之间的沟通交流，以确保信息的及时传递和任务的有效衔接。例如，在无人驾驶汽车群中，每辆车需要与周围的车辆实时交换信息，以确保行车安全和路线优化。

    4）结果整合输出：将各个智能体完成的部分任务结果整合起来，从而完成整个任务（例如，最终完成《愤怒的小鸟》游戏）。

    这种方法的潜在价值巨大，因为它为自动化和提升工作效率提供了新的可能性。例如，通过模拟一个软件开发团队的不同角色，一个企业可以自动化某些开发任务，从而加快项目进度并减少错误。同样，这种多
    Agent 合作方式也可以应用于其他领域，如内容创作、教育和培训、策略规划等，进一步拓宽 `LLM` 在各个行业的应用范围。


    ### 扩展阅读

    ###### 1.Supervision

    通过一个管理者管理和调度多个 Agent 进行协作（如图 4-22 所示）。

    ![](img/img_00073.jpg)

    图 4-22 一个管理者管理和调度多个 Agent 进行协作

    ###### 2.Hierarchical Teams

    通过分层、分级组织 Agent 来完成复杂且工作量大的任务（如图 4-23 所示），`AutoGen`就是这种方式的典型代表。

    ![](img/img_00074.jpg)

    图 4-23 通过分层、分级组织 Agent 来完成复杂且工作量大的任务

    ###### 3.Collaboration

    单个 Agent 在使用多领域工具的能力上存在局限，需要多个 Agent 协作以使用更多类型的工具。可以借鉴“分治法”的思想，使每个 Agent 成为专注处理一类问题的“专家”，然后再进行合作（如图
    4-24 所示）。

    ![](img/img_00075.jpg)

    图 4-24 多个 Agent 协作使用各种类型的工具


    ### 案例：多智能体协作的智能农业系统

    假设我们设计了一个智能农业系统（如图 4-25 所示），其中包括多种智能体：无人机负责监测农作物的生长状况，自动灌溉系统根据监测数据调整灌溉量，机器人负责施肥和除草。

    ![](img/img_00076.jpg)

    图 4-25 多智能体协作的智能农业系统

    通过这些智能体的协同工作，农场能够实现高效管理和精准农业。无人机飞过农田，实时采集数据并传输给中央系统；中央系统分析数据后，指示自动灌溉系统和机器人进行相应的操作。

    这种高效的协同工作不仅提高了农作物的产量，还减少了资源浪费。

    简单分析一下多智能体协作设计模式的优点和缺点。

    优点：

    ●专业化：多智能体协作模式将复杂任务分解为更小的子任务，并由不同的智能体执行这些子任务。这种分工和专业化使得每个智能体可以专注于其特定领域，提高任务完成的效率和质量。

    ●提高任务效率：由于每个智能体可以同时处理不同的子任务，多智能体协作能够显著提高任务的整体完成速度。这种并行处理方式在需要快速响应的应用场景中特别有效，例如实时数据处理和复杂系统的管理。

    ●增强系统鲁棒性：多智能体系统通过任务的分散处理和信息的共享，提高了系统的鲁棒性。当某个智能体出现故障或性能下降时，其他智能体可以接管其任务，避免系统整体失效。

    缺点：

    ●复杂性和协调成本：多智能体系统的设计和实施较为复杂，需要精细设计智能体间的交互协议和信息传递机制，这增加了系统开发和维护的成本。

    ●技术成熟度：当前的多智能体协作技术尚未完全成熟，尤其是在复杂任务和动态环境中，智能体的决策和协作能力仍有待提升。

    ●结果难以预测：由于多智能体协作涉及多个独立智能体的交互，其结果可能具有较高的不确定性。这种难以预测性可能在某些关键任务中带来风险，需要额外的监控和调整措施来确保系统的稳定性。

    通过多智能体协作，AI 系统展现出强大的综合能力。每个智能体都专注于自己的任务，同时通过协作实现更大的目标。这不仅提高了效率，也使 AI 系统能够应对更加复杂和动态的环境。未来，随着
    AI 技术的不断进步，多智能体协作将为我们带来更多创新的解决方案和应用场景。

    每当笔者看到这些智能体协同工作的画面，都会感受到一种奇妙的力量。这种力量来自科技，也来自合作。就像我们在人类社会中，通过合作和协同，才能实现更大的成就和更美好的生活。AI
    Agent 在多智能体协作中的表现，正是这种合作精神的最佳体现。


    ## 4.3 扩展

    AI Agent/Agentic Workflow 对 AI 应用的落地至关重要，因为它能够拓展 AI 的使用场景，并且有效提高任务完成的质量。

    （1）任务集拓展

    引入`Agentic Workflow`后，AI 能够执行的任务种类将显著增加。这意味着 AI 不仅能处理更广泛的任务，还能更高效地完成复杂任务。

    （2）任务委派与耐心等待

    我们需要习惯将任务委派给 AI Agent，并耐心等待其完成。随着 AI Agent 能力的提升，它们能够在较长时间内完成更复杂的任务，这需要我们调整预期目标和工作方式。

    （3）快速 token 生成的重要性

    `token`的生成速度对 AI 的性能至关重要。即使是质量较低的语言模型，通过生成更多的`token`，仍能获得良好的结果。这表明，`token`的生成速度和数量在一定程度上可以弥补模型质量的不足。

    （4）早期模型的 Agentic Reasoning 性能表现

    即使是早期版本的模型（如`GPT-4`），通过应用`Agentic Reasoning`方法，也能达到接近未来更先进模型（如`GPT-5`、`Claude
    4`、`Gemini 2.0`）的性能。这意味着我们可以在现有技术基础上，通过优化工作流和方法，提升模型的实际应用效果。


