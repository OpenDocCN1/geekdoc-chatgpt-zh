    ## 11.7 常见的多智能体开源项目

    ### 11.7.1 MetaGPT

    MetaGPT是一个全球知名的多智能体框架，如图11-19所示。它模拟了一个虚拟软件公司的运作模式。通过将不同的AI智能体分配为产品经理、架构师、项目经理和工程师等角色，MetaGPT能够协同工作，将简单的需求转化为完整的软件开发方案。它不仅可以生成用户故事、竞争分析、需求文档、数据结构设计和接口规范，还能提供全面的项目文档。这种独特的方法为复杂的软件开发过程提供了高效、系统化的解决方案，展现了人工智能在软件工程领域的强大潜力。

    项目地址为https：//github.com/geekan/MetaGPT。

