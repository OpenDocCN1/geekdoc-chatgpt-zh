    ## 第5章 主流AI Agent设计平台


    随着人工智能技术的飞速发展，各类AI Agent设计平台层出不穷。这些平台为开发者提供了强大的工具和资源，使他们能够更加高效地设计、训练和部署AI Agent。


    本章介绍目前主流的AI Agent设计平台，分为国内和国外两个部分。首先介绍国内的入门级智能体平台，如文心智能体平台、智谱清言、Kimi+智能体平台和通义千问，适用于初学者。接着讲解国内的进阶级智能体平台，如扣子、腾讯元器、Dify和FastGPT，适用于有一定基础的用户。然后分析国外的主要智能体平台，包括Coze和GPT
    Store，展示其独特功能和优势。最后讨论AI Agent平台选型，帮助用户从明确需求、评估平台的能力、成本因素、用户支持和社区活跃度、可扩展性和灵活性等方面，选择最适合的AI
    Agent设计平台。


    ### 5.1 国内入门级智能体平台


    #### 5.1.1 文心智能体平台


    ##### 1.简介


    百度旗下的 `AgentBuilder`[^(\[1\])](../Text/AD_00014.xhtml#m1)又名“文心智能体平台”，界面如图5-1所示。通过该平台的宣传语“想象即现实”，我们可以对其功能可见一斑。文心智能体平台是基于文心大模型的智能体构建平台，提供了自然语言创建智能体的新开发范式，致力于解决行业关心的零成本智能体开发、分发和商业变现等核心问题。


    ![](Images/img_00078.jpg)


    图5-1 文心智能体平台的界面


    文心智能体平台提供了一个无代码和低代码的开发环境。这个环境的实现极大地降低了技术门槛，使智能体开发不再是少数人的专利。文心智能体平台依托百度强大的AI技术，提供了强大的语言理解和生成能力，让零基础的自然语言创建成为可能。不需要烦琐的编程过程，只需一键，就能为你的智能体赋予一个生动的数字形象，快速进行配置。


    ##### 2.主要功能


    1）零门槛智能体开发工具，提供零代码、低代码等多种模式，让不懂代码的小白也能通过几句话开发出一个智能体。

    2）支持广大开发者根据自身行业和应用场景，采用多样化的能力和工具，打造大模型时代的智能体。

    3）为开发者提供了百度生态中的巨大流量池和多样的商业机会，是一个集“开发+分发+运营+变现”于一体的一站式智能体赋能平台。


    ##### 3.核心优势


    1）开发难度低，支持一句话创建智能体，同时可自定义知识库扩展、调用多种工具、配置数字形象等（如图5-2所示）。


    ![](Images/img_00079.jpg)


    图5-2 文心智能体平台的智能体配置界面


    2）迭代调优工具完善、便捷。

    3）分发渠道广泛，商业闭环链完整。依托百度自身生态，目前已接入百度搜索、文心一言App、百度地图、百度贴吧、小度、车机等百度自有全矩阵服务和设备，后续可通过以下方式助力开发者完成AI智能体的商业闭环。

    ●增值/会员付费：BC端订单转化、管理及售后追踪组件。

    ●商品转化：商品库及商品转化组件，全链路支付流程。

    ●线索转化：线索转化、管理跟进的全流程组件。

    ●分润能力：广告挂载组件及分润功能，全流程数据监控。

    4）强大的大模型能力。依托文心一言大模型，在内容创作、数理逻辑推算、中文理解和多模态生成等多方面均有良好表现。

    5）社区生态。文心智能体平台还拥有一个活跃的社区，开发者可以在这里分享经验、交流想法，甚至找到合作伙伴。社区为文心智能体平台的使用者提供了一个不断学习和成长的空间。这种社区支持不仅加速了知识的传播，还促进了技术的创新。


    通过上述介绍可以看到，百度智能体平台功能完善，商业化路线也比较清晰。从商品转化到分润，借助百度庞大的商业体系吸引企业入驻，进一步实现商业闭环。


    #### 5.1.2 智谱清言


    智谱清言[^(\[2\])](../Text/AD_00014.xhtml#m2)是由北京智谱华章科技有限公司（简称“智谱AI”）开发的生成式AI助手。智谱AI成立于2019年，源自清华大学计算机系知识工程研究室团队，是一家专注于AI大模型研发的创业公司，致力于打造超越图灵测试的机器认知智能，实现从SaaS、PaaS到MaaS的升级，成为模型化服务时代的引领者。


    ##### 1.简介


    智谱清言的界面如图5-3所示，其核心基于中英双语对话模型`ChatGLM4`。这一模型不仅为平台提供了强大的语言处理能力，还使智能体能够跨越语言障碍，服务更广泛的用户群体。它支持100余种编程语言，为开发者提供了广阔的技术生态和灵活性。


    智谱清言集成了大规模语言模型、语音识别、语音合成等技术，主要功能包括内容创作、信息归纳总结、通用问答、多轮对话以及角色扮演等。特别值得一提的是，它在代码生成和创意写作方面的应用极大地丰富了智能体的创造力和实用性。


    ![](Images/img_00080.jpg)


    图5-3 智谱清言的界面


    ##### 2.特色


    （1）用户交互体验优秀

    智谱清言在用户体验方面下足了功夫。它简化了用户操作流程，降低了使用门槛，使得即使是非技术用户也能轻松上手（如图5-4所示）。平台提供的调试功能可方便用户自定义智能体，以满足特定需求。而GLM个性化智能体定制功能的上线，更是将用户体验提升到了新的高度。


    ![](Images/img_00081.jpg)


    图5-4 智谱清言的配置智能体界面


    （2）开源与合作

    通过发布`GLM-4`开源模型，智谱清言不仅支持多语言处理，还实现了多智能体协作，这一举措推动了AI技术的共享与创新。


    （3）基础模型功能强大

    `GLM-4`是智谱AI推出的最新一代预训练模型系列。在语义、数学、推理、代码和知识等多方面的数据集测评中，`GLM-4`均表现出超越`Llama-3-8B`的卓越性能。除了能进行多轮对话，`GLM-4`还具备网页浏览、代码执行、自定义工具调用和长文本推理（支持最大128K上下文）等高级功能。


    #### 5.1.3 Kimi+智能体平台


    `Kimi`[^(\[3\])](../Text/AD_00014.xhtml#m3)是国内流行的AI大模型，是月之暗面科技有限公司（Moonshot AI）推出的智能助手产品，它凭借在自然语言处理、长文本处理、多语言对话支持等方面的技术优势，为用户提供了高效、智能的交互体验。而`Kimi+`就是其官方的智能体中心（如图5-5所示），官网是这么介绍的—它们是更专业的小助手，是拥有独特技能的
    Kimi 分身；可以解决特定问题，也可以组成 AI 生成线。


    ![](Images/img_00082.jpg)


    图5-5 Kimi+智能体平台的界面


    （1）官方推荐

    ●Kimi 001号小客服：Kimi+家族的核心成员，关于Kimi的一切都能从中找到答案，包括使用指南或商务合作咨询等，响应速度非常快。

    ●长文生成器：Kimi+家族的核心成员，解决大模型一次给出的文本长度较短的问题，可生成万字长文。

    ●Looooooong Kimi：Kimi+家族的“太上长老”，拥有200万字超能力的“鹿康太”，一度掀起了大模型武林中关于长文本的争锋。

    ●提示词专家：Kimi+家族的“传功大长老”，也是与LangGPT合作的结构化提示词专家，专为小白用户一键生成提示词。

    ●什么值得买：大语言模型和传统互联网的结合，官方优质数据加上大语言模型的能力，为用户提供专业推荐。

    ●学术搜索：大道至简，知识工作者的最爱。通过关键词直接搜索相关论文，还能生成摘要，是提高生产力的工具。


    （2）办公提效

    ●翻译通：一键中英互译，直译意译，样样精通，可以告别付费翻译软件了。

    ●Offer收割机：跳槽必备，修改简历，练习面试。

    ●Kimi API助手：这种推荐更适合放在官方推荐位置，对开发者来说是必备工具，关于Kimi API的相关问题可以直接提交给它。

    ●IT百事通：摆脱电脑小白，一键掌握软件技巧和硬件知识。

    ●PPT助手：通过与用户之间的沟通，帮助用户生成PPT大纲，并生成PPT演讲稿。


    （3）辅助写作

    ●小红书爆款生成器：用上它之后，就可生成爆款文案。

    ●公文笔杆子：会议纪要、汇报材料、讲话稿、调研报告等各种类型的公文一网打尽。

    ●爆款网文生成器：可创作各类题材网文，直接提供架构。


    （4）社交娱乐

    ●猜猜我在想谁：多轮问答生成你心目中的那个人。

    ●聊聊书：探讨书中所思所想，内容丰富。


    （5）生活实用

    ●费曼学习法：将新知识告诉别人，然后教会他们。

    ●旅行规划师：无须再查找百度、知乎和小红书，可一键生成旅行方案。

    ●留学顾问：你的专属留学顾问，提供选校文书的一条龙服务。


    作为国产AI的黑马，Kimi推出的智能体商店可谓诚意满满。20多个小助手涵盖学习、工作、生活、娱乐各方面，包罗万象，就像一个琳琅满目的超市，每一件商品都是一个智能体，它们拥有不同的用途。在这里，用户可以根据自己的需求挑选出最适合的智能体。无论是24小时的客户服务还是提供健康咨询，Kimi+都能提供全天候的陪伴和支持。


    截至本书成稿，Kimi的智能体创建能力尚未对用户开放。它走的是精品Agent定制路线，旨在让每一个智能体都对用户有帮助。在技术方面，Kimi+的无损长文本处理能力令人印象深刻，支持高达200万字的文本处理，可以为用户提供更为全面和深入的服务。


    #### 5.1.4 通义千问


    通义千问是阿里巴巴推出的一个大型预训练模型，是阿里云自主研发的超大规模语言模型。经过海量数据训练，它具备跨领域的知识和语言理解能力。无论是科学、技术、文化、历史等领域的问题，还是日常生活中的疑问，它都能尽力为你提供准确、有用的信息。不仅如此，它还可以根据你的需求完成对话、提供学习建议、创作故事、编写代码等多样化任务。


    通义千问大模型的特点如下。

    ●知识覆盖面广：拥有庞大的知识库，覆盖广泛的领域，能够提供准确、全面的信息和答案。

    ●理解能力强：利用深度学习技术，掌握复杂语境及隐含意义，能够准确把握用户意图。

    ●逻辑性强：擅长逻辑推理和因果分析，能够进行有条理的论证。

    ●互动自然：对话流畅自然，能够进行多轮对话，模拟真实的人际交流。

    ●多领域适应性强：不仅适用于单一领域，还能在跨领域的综合应用中满足不同场景的需求。

    ●持续学习与更新：模型具有自我学习和优化机制，随着时间的推移，能够适应新的信息和变化。

    ●安全合规：在设计中充分考虑了内容的安全性和合规性，避免产生有害或不当的回复。

    ●个性化服务：能够根据用户的历史交互和偏好，提供更加个性化的信息与服务。

    ●响应迅速：处理速度快，能迅速响应用户请求，提供即时帮助和反馈。

    ●集成能力强：易于与其他系统集成，可作为 `API` 接入各类应用来扩展应用范围。

    ●具备中文优势：特别擅长处理中文语言环境下的复杂情况，更贴近中国用户的使用习惯。


    通义千问智能体平台的界面如图5-6所示。


    通义千问的智能体中心界面简洁，操作简便，主要创建工作都在手机客户端进行，同时支持沉浸式对话创建（如图5-7所示）。


    目前，通义千问对创建智能体的自定义程度较低，以官方推荐为主。


    （1）通义万相

    通义万相是一款AI绘画创作模型，类似于`Midjourney`。用户只需输入相应的提示词，该模型就能创作出符合描述的图像。它每天会向每位用户提供50次免费绘画机会，对于普通用户来说，这样的配额足够满足一般的日常创作需求。


    （2）通义听悟

    通义听悟是针对语音方面的AI技术，它可以实现语音识别、语音转换以及语音理解等多种功能。简单来说，就是把音频转为文字。除了简单的音频转文字，它还能实时监听对话内容，对发言人进行区分，把阿里云盘的视频资源一键转换为文字资源，总结内容并归纳章节，提取视频中展示的PPT等。


    ![](Images/img_00083.jpg)


    图5-6 通义千问智能体平台的界面


    ![](Images/img_00084.jpg)


    图5-7 通义千问智能体的创建流程


    （3）通义星尘

    很多人喜欢跟AI玩角色扮演类游戏。通常情况下，若要在聊天模型上设定一个角色，需要输入大量角色预设。而通义星尘并不需要这么复杂，因为它本身就提供了大量预设角色供用户直接使用。当然，如果你对通义星尘自带的角色不满意，还可以创建属于自己的角色。在自定义角色时，可以为其设定人物性格、背景故事、记忆体系和知识框架。


    （4）通义点金

    通义点金是大模型驱动的智能金融助手，可帮助用户深度解读财报、研报，分析金融事件及实时市场数据等，是金融垂直领域的好帮手。


    借助通义大模型的强大能力，通义系列的智能体在各个细分领域实实在在地考虑用户场景，其设计理念和技术实现为智能体开发领域带来了新的可能性。


    ### 5.2 国内进阶级智能体平台


    之前讨论的智能体平台都是基于对话形式快速生成Agent，而在复杂场景中，有许多任务需要基于工作流、知识库和编排工具进行开发。那么，国内支持流程编排的进阶级智能体平台有哪些呢？让我们一起来看看。


    #### 5.2.1 扣子


    ##### 1.简介


    扣子[^(\[4\])](../Text/AD_00014.xhtml#m4)是字节跳动推出的AI智能体平台（如图5-8所示），用户可以在该平台上创建、配置、管理聊天机器人和智能体。扣子支持“单智能体模式”和“多智能体模式”，以适应不同复杂度的逻辑处理需求。


    扣子可以使用字节跳动自家的云雀大语言模型，也可以接入其他大模型，如 月之暗面的Kimi。创建的`Bot`可以发布到不同的平台和应用中，如豆包、飞书和微信等，方便用户在不同环境中使用。同时，扣子拥有一个活跃的社区和市场，用户可以分享自己创建的
    `Bot`，也可以发现和使用其他人创建的 `Bot`。


    无论你是否有编程基础，都可以在扣子平台上快速搭建基于AI模型的各类问答`Bot`，从解决简单的问答到处理复杂逻辑的对话，都能轻松实现。此外，可以将搭建的`Bot`发布到各类社交平台和通信软件，或者部署到网站等其他渠道，与平台/软件的用户互动。


    ![](Images/img_00085.jpg)


    图5-8 扣子的界面


    ##### 2.功能


    （1）插件：无限扩展的能力集

    扣子集成了丰富的插件工具，可以极大地扩展`Bot`的能力边界。

    ●内置插件。目前平台已经集成了近百款各种类型的插件，包括资讯阅读、旅游出行、效率办公、图片理解等`API`及多模态模型。可以直接将这些插件添加到`Bot`中，丰富`Bot`的能力。例如，可以使用新闻插件打造一个播报最新时事新闻的AI新闻播音员。

    ●自定义插件。扣子平台支持创建自定义插件。可以通过参数配置的方式，基于已有的`API`能力快速创建一个插件供`Bot`调用。


    （2）知识库：丰富的数据源

    扣子提供了简单易用的知识库功能来管理和存储数据，支持 `Bot` 与你自己的数据进行交互。无论是内容量庞大的本地文件还是某个网站的实时信息，都可以上传到知识库中。这样，`Bot`
    就可以使用知识库中的内容回答问题了（如图5-9所示）。

    ●内容格式。知识库支持添加文本格式、表格格式、图片格式的数据。

    ●内容上传。知识库支持 `TXT` 等本地文件、在线网页数据、`Notion` 页面及数据库、`API JSON` 等多种数据源。你也可以直接在知识库内添加自定义数据。


    （3）长期记忆：持久记忆能力

    扣子提供了方便AI交互的数据库记忆能力。通过这个功能，你可以让`Bot` 持久地记住用户对话的重要参数或内容。


    ![](Images/img_00086.jpg)


    图5-9 扣子的知识库设置界面


    ●数据库：将数据存储在结构化表中。例如，创建一个数据库来记录阅读笔记，包括书名、阅读进度和个人注释。借助数据库，`Bot` 就可以通过查询其中的数据来提供更准确的答案。

    ●变量：记住在对话中定义的变量。例如，记住语言变量的语言偏好，并使用用户偏好的语言进行聊天。


    （4）定时任务：快速创建定时任务

    扣子支持为 `Bot` 创建定时任务。定时任务的制定无须编写任何代码，只需要直接输入任务描述，`Bot` 就会按时执行该任务（如图5-10所示）。例如，可以让
    `Bot`执行以下任务：

    ●每天早上8：00为你推荐个性化新闻。

    ●每天早上7：00提醒你查看当天的天气预报和日程安排。


    （5）工作流：灵活的工作流设计

    扣子的工作流功能可以用来处理逻辑复杂且具有高稳定性要求的任务流。扣子提供了大量灵活可组合的节点，包括自定义代码、判断逻辑等。无论你是否有编程基础，都可以通过拖曳的方式快速搭建一个工作流。例如：

    ●建立一个收集电影评论的工作流，以便快速查看最新电影的评论与评分。

    ●创建一个撰写行业研究报告的流程，让`Bot`写一份20页的报告。


    （6）多Agent：多任务串行

    扣子支持多Agent模式。在该模式下，可以添加多个Agent节点，每个Agent节点都是可以独立执行具体任务的智能体。另外，可以灵活配置各个节点之间的连接关系，通过多节点之间的分工协作来处理复杂的用户任务。


    ![](Images/img_00087.jpg)


    图5-10 扣子创建触发器界面


    ##### 3.使用


    可以调试预置的AI `Bot`快速体验扣子的功能，也可以根据入门教程从零开始搭建一个AI `Bot`，如图5-11所示。


    ![](Images/img_00088.jpg)


    图5-11 扣子搭建AI Bot界面


    ##### 4.特色功能—多模型支持


    基于扣子创建的智能体，不仅可以选择豆包，还可以选择其他国内知名的大模型，比如通义、智谱、MiniMax、Kimi、百川等。可以根据各家模型所擅长的领域进行自由搭配。


    扣子平台的核心理念是简化复杂的传统开发流程，使即使没有深厚技术背景的用户也能创建出功能强大的智能体。平台的用户界面简洁、直观，功能模块设计合理，涵盖了从数据处理、模型训练到结果展示的全流程。通过对关键功能模块的优化，扣子极大地提高了开发效率，并缩短了开发周期。

