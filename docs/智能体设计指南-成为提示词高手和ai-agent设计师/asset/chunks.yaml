    \# RESPONSE（响应）　 #


    保持Facebook帖子简洁而深具影响力。


    ### 2.6 局限性


    #### 2.6.1 结构化提示词在不同模型中的适用性


    对于一些简单的任务，使用简单的提示词即可。不同模型的能力维度不同，从最大化模型性能的角度出发，有必要针对性地开发相应的提示词。对于一些基础简单的提示词（例如只有一两句话的提示词），可能在不同模型上表现差不多，但是随着任务难度变复杂，提示词也相应变复杂以后，不同模型的表现则会出现明显分化。结构化提示词方法也是如此。


    结构化提示词的编写对模型的基础能力有一定要求，要求模型具有较好的指令遵循和结构识别分析能力。从实践来看，GPT-4是最佳选择，Claude模型次之。根据笔者和身边朋友的反馈，GPT-4和Claude
    模型的表现不错，国内的阿里通义千问模型和月之暗面Kimi的表现也都不错。


    当你发现结构化提示词在小模型上表现不佳时，可以考虑降低结构复杂度、调整属性词、迭代修改提示词。例如，LangGPT助手的Expert（专家）模板，将原本的多级结构降维为二级结构（“1.”“2.”“3.”为一级，“-”为二级），同时参考AutoGPT中的提示词，使用了4.Goals、5.Constraints
    等属性词。依据提示词的表现，不断修改和调优提示词。


    总之，在模型能力允许的情况下，结构化确实能提高提示词性能，但在不符合实际需要时，仍然需要使用各种方法进行调试和修改。


    #### 2.6.2 其他局限


    结构化提示词依赖基座模型的能力，无法解决模型自身的问题，也不能突破大模型提示词方法的局限性。目前已知的无法解决的问题如下：


    ●大模型自身的幻觉问题。


    ●大模型自身知识陈旧问题。


    ●大模型在数学推理能力上的不足（解决数学问题）。


    ●大模型视觉能力弱的问题（如构建SVG矢量图等场景）。


    ●大模型字数统计问题（无论是字符数还是token数，大模型都无法准确统计。当需要输出指定字数时，建议将数值设定得高一些，后期自己调整，比如希望输出100字文案，可以告诉它输出150字）。


    ●同一提示词在不同模型间的性能差异问题。


    ●其他已知问题。


    ### 2.7 常见误区


    ###### 1.结构化等同于Markdown格式化


    首先需要明确，提示词的格式不等同于提示词的结构。结构化提示词不是一种格式，也不绑定于某一具体格式。


    前文有格式化技巧的说明。使用格式来区分提示词的各个部分是提示词编写的常用技巧，但格式化只是结构化提示词的一部分。重要的是提示词内容，格式只是内容的呈现形式。好比你写了一篇文章，重要的是文章中的精彩内容，至于文件格式，用.docx还是.pdf分享文章都可以。


    本书作者考虑到Markdown语法简洁明了、使用广泛，选择了Markdown格式来编写提示词。网络上也流传着大量使用Markdown语法的结构化提示词。但是需要说明的是，Markdown格式化并不代表结构化提示词，Markdown格式也不是唯一的选择，你可以自由地选择你喜欢的格式。


    ###### 2.结构化提示词的各个模块都不可调整


    法无常法，势无定势；兵无常势，水无常形。提示词编写也是这样，在实践中，不能机械、死板地套用结构化提示词方法论。


    结构化提示词中的各个模块都很灵活，可以调整、删改。例如，“简介”中的“版本”是为了方便提示词迭代记录使用，与模型表现无关，在实际使用时可以删除。同样，提示词中许多与任务无关的内容在实际使用时都可以删除。也可以依据实际需要增加、删减、修改、调整各个模块。


    正确的做法应该是理解结构化提示词背后的思想，掌握其体现的提示词技巧，明白其增强了模型哪方面的表现和缓解了模型哪方面的缺陷。在能够熟练编写提示词后，完全可以跳出原来的模板，按照自己的心意编写提示词，只要编写的提示词能够满足现实需求即可。


    ###### 3.结构化提示词必然很长


    流行的结构化提示词往往篇幅较长，给许多人留下了结构化提示词冗长的印象。同时，有人反馈说，结构化提示词比一般提示词内容多，在使用API时花费更多。然而，提示词冗长的根本原因并不在于结构化的编写方式。


    提示词的长度主要由任务的复杂程度以及模型在该类任务上的能力强弱决定。


    任务越复杂，所需的提示词必然越长。模型在该任务上的能力越弱，就需要越长的提示词来引导输入。


    如图2-3和图2-4所示，我们进行了文心一言和ChatGPT在创作五言绝句上的对比。在此任务上，文心大模型的能力优于ChatGPT，一句话即可达到预期效果。相比之下，ChatGPT在创作五言绝句上的表现不理想，常输出七言绝句或五言律诗。感兴趣的读者可以尝试对比这个任务。


    ![](Images/img_00028.jpg)


    图2-3 文心大模型3.5创作五言绝句示例


    ![](Images/img_00029.jpg)


    图2-4 ChatGPT 4o创作五言绝句示例


    为了防止提示词内容的冗余，在使用结构化提示词时，不能简单机械地套用模板。实际运用中，应灵活应用结构化思想，根据具体情况对提示词中的各部分内容进行增减和调整。


    若希望缩减提示词长度，尤其是API使用者为了节省费用而减少token的消耗，可以考虑从以下几点着手优化：


    ●去除提示词中与任务无关的内容，比如结构化提示词中的版本、语言等。


    ●避免对模型已知事实过多描述。比如某一专业术语，若询问模型时，模型能够正确回答，则无须在提示词中过多描述。


    ●将中文提示词改写为英文。使用英文描述相比中文能够节省token数量。


    ●采用概括性描述，使用如七言律诗、莎士比亚风格等模型能理解的概括性描述，以节省大模型使用费用。


    ### 2.8 结构化提示词与AI Agent


    #### 2.8.1 AI Agent


    在大模型风靡全球之前，智能体（Agent）这一术语就已经广泛用于自动驾驶领域，指与自动驾驶车辆交互或受其影响的各种实体，可以是其他车辆、行人、自行车骑手等。在大模型领域，智能体通常指的是以大模型为大脑，能够执行任务、响应查询或进行交互的算法或程序，它通过理解和生成自然语言，与用户或其他系统交互，也叫AI
    Agent。


    AI Agent是由大模型（LLM）、记忆（Memory）、任务规划（Planning Skill）以及工具调用（Tool Use）组成的集合。其中，LLM是核心大脑，记忆、任务规划和工具调用是AI
    Agent系统实现的3个关键组件，如图2-5所示。


    ![](Images/img_00030.jpg)


    图2-5 AI Agent架构[^(\[1\])](../Text/AD_00010.xhtml#m1)


    正是得益于这些设计，大模型的功能越来越丰富，越来越强大。早期以 ChatGPT为代表的大模型只具备文字聊天功能，而现在的大模型不仅能够聊天，还能够理解图片、生成图片、进行语音对话、获取网页内容信息、协助数据分析等，功能十分强大。


    同时，随着OpenAI GPTs功能的发布，AI Agent的制作门槛大大降低。不需要掌握开发技能，用户只需在网站上点击和配置即可生成属于自己的AI Agent。


    #### 2.8.2 工具


    在ChatGPT强大文本生成能力的基础上，OpenAI还为其装配了各种工具。文档分析的功能，并且可以自己选择需要调用的模型能力。借助合适的工具，ChatGPT可以帮助你完成许多任务。下面介绍一些常用的ChatGPT工具及其用法。


    ##### 1.DALL·E 3的绘图


    DALL·E 3是OpenAI的文生图模型，它可以基于给定的语言描述生成精美的图片。在我们使用DALL·E 3绘图时，后台会自动利用ChatGPT生成提示词，然后让模型根据该提示词生成图片。对于不擅长编写提示词的人来说，这大大提高了DALL·E
    3的使用便利性。


    请注意，每次最多只能生成4张图片，且只能生成以下3种固定分辨率的图片：1024×1024（square）、1792×1024（wide）和1024×1792（tall）。可以分别用括号里的英文关键词square、wide、tall设定。为了生成图片，你需要提供一个详细的文本描述。描述越具体，生成的图片可能越接近你的期望。例如：“一只橙色的猫坐在蓝色的沙发上。”在描述中，你可以指定希望的图片类型，如“照片”“油画”“插图”“漫画”“绘图”“矢量图”“渲染”等，如图2-6所示。


    ![](Images/img_00031.jpg)


    图2-6 DALL·E 3生成图片实例


    可以参考某些艺术家的风格（如梵高、克里姆特等），但需要注意，由于版权保护等原因，不能直接参考过去100年内活跃的艺术家风格（如毕加索、卡洛等）生成图片。


    我们可以使用以下提示词来引导大模型生成DALL·E专属的图片提示词：


    \# Role


    DALL·E作图大师


    \## Profile


    \- Author：李继刚


    \- Version：0.1


    \- LLM：GPT-4


    \- Description：熟知DALL·E的底层工作机制原理，具备高超的图片审美素养，能够深度解构图片并提供详细描述。


    \## Attention


    努力思考，根据图片内容提供尽可能详细的描述。


    \## Background


    为了让用户更好地使用DALL·E生成类似风格的图片，需要对图片的各个元素进行详细的解析。


    \## Constraints


    \- 必须根据实际图片内容进行描述，不能编造。


    \- 描述要细致入微，捕捉图片中的每一个细节。


    \## Examples


    \- 背景：宁静的海滩，夕阳西下。


    \- 主角：一位年轻女子，站在海边。


    \- 脸部：椭圆形脸，明亮的眼睛，微微上扬的嘴角。


    \- 发型：长发飘飘，受到海风的吹拂。


    \- 服装：穿着夏日的短裙和背心。


    \- 姿势：双手抱膝，坐在沙滩上。


    \- 风格：温暖、浪漫。


    \## Goals


    \- 为用户提供详细、准确的图片描述。


    \- 帮助用户理解图片的各个元素和风格。


    \## Skills


    \- 图片解析能力。


    \- 审美判断。


    \- 描述技巧。


    \## Workflow


    \- 第一步：观察图片，分析其构成元素。


    \- 第二步：根据下述框架描述图片的各个部分。


    　+背景：描述图片的背景内容。


    　+主角：描述图片中的主体角色及其特点。


    　+脸部：描述图中人物的脸部特点，如脸形、眼神、表情等。


    　+发型：描述图中人物的发型。


    　+服装：描述图中人物的服装。


    　+姿势：描述图中人物的姿势和动作。


    　+风格：描述图片的整体风格和调性。


    \- 第三步：校对描述，确保其准确性，输出你的分析结果。


    \## Initialization


    开场白如下：


    “你好，我是Dall-E作图大师。请提交你的图片，我会为你提供详细的图片描述，帮助你使用DALL·E生成类似风格的图片。”


    使用上面的元提示词，我们上传一张学生在校园的图片，可以生成如下DALL·E的图片提示词：


    ●背景：校园环境，远景模糊，背景为浅色现代教学楼，窗户整齐排列，天空灰白，呈浅景深效果。


    ●主角：年轻女性，正面直视镜头，气质平静自信。


    ●脸部：椭圆脸，五官精致，双眼明亮，微微一笑，肤色白皙，自然美感。


    ●发型：黑色长发中分，柔顺光泽，部分发丝微微飘动。


    ●服装：白衬衫配深色西装，简约大方，学术风格。


    ●姿势：双臂轻松交叉于胸前，姿态端正从容。


    ●风格：黑白色调，光影突出，简约优雅，艺术感强。


    生成的图像如图2-7所示。


    ![](Images/img_00032.jpg)


    图2-7 AI生成的图片示例


    ##### 2.GPT读图


    GPT可接收图片作为输入并阅读图片内容，可以用这项能力进行图片标注、数据提取等多种有趣的应用。同时，还可以使用视觉参考提示法让GPT聚焦于图片的特定部分，使模型执行的任务更加集中。


    图2-8显示了一个解读图表的示例，将感兴趣的数据用红线圈起，然后发送给GPT让其帮助解读。可以看到模型进行了正确的解读。


    ##### 3.GPT语音


    在手机上安装ChatGPT软件后，可以与其进行实时语音沟通，将其作为免费的英语口语教练。下面是一个实际例子：


    ![](Images/img_00033.jpg)


    图2-8 AI解读图表示例


    第一段


    你现在是我的英语口语老师，而我是英语小白。我会给你题目，你要直接根据我的情况和题目帮我想出一个示范答案，这个答案应该是简单常用的英国口语，而不是拿着书面化的表达故作高深。


    第二段


    你的讲解方式是这样的：


    1.先讲一大段英文口语范例，然后提炼里面的表达句式和生词并逐个加以说明。


    2.一句句地陪我练习，你会先重复要练习的句子，然后等我的反馈，帮我纠正错误，等纠正好了之后，我们再来看下一句。等到整段练习完成之后，我们再完整地重复整个段落。没问题后，我们再来看下一题。


    通过使用上面的提示词，我们可以将GPT作为英语教练，帮助我们提升英语能力。


    ●掌握口语的关键在于结合自己的真实生活经验，而不是完全依赖人工智能生成的例子。通过在各种情境中提高熟练度，你会更快地提升口语能力，并且也更实用。所以当你打开GPT语音的时候，直接用母语向GPT-4叙述一个话题以及你的背景，它就会结合你的背景和地道口语为你提供练习范本。


    ●精通你正在学习的语言和你的母语的教师，可以在这两种语言之间无缝切换，帮助你分解句子结构和表达方式。这种教学模式对于初学者来说非常有益。


    ●当前的提示词指示GPT-4进行逐句练习指导，然后再让你将这些练习合并为一次综合练习。这样可以做到循序渐进。


    有效沟通问题的技巧如下：


    ●我没有听清楚，请你再解释一遍好吗？（Pardon me？）你也可以加上一个原因：“因为我没听清楚‘×××’后面的词语，请你拼写并解释一下。”


    ●让GPT-4使用更简单的词语重新写一个范例。


    ●询问是否能够添加一些自己想要表达的其他细节从而优化GPT-4的范例。


    ##### 4.ALL Tools


    早期在ChatGPT中使用以上功能都需要单独点选相应的模型，后来OpenAI通过All Tools将这些工具的调用变得更加智能化。目前，上述各项功能可以直接使用，无须进行特殊设置。通过泄露的官方提示词可以看到，OpenAI使用结构化提示词的方式实现了All
    Tools功能，其系统提示词中增加了Tools内容，用来描述各个工具的调用规则。


    \## 工具


    \### browser


    你有一个名为\`browser\`的工具，它具有以下功能：


    \- 向搜索引擎发出查询并显示结果。


    \- 打开给定ID的网页并显示它。


    \- 返回上一页并显示它。


    \- 在打开的网页中向上或向下滚动指定的数量。


    \- 打开给定的URL并显示它。


    \- 从打开的网页中存储文本片段。通过起始整数\`line\_start\`和结束整数\`line\_end\`（含）指定文本范围。要引用单行，使用\`line\_start\`=\`line\_end\`。


    \### python


    当你向python发送包含Python代码的消息时，它将在一个有状态的Jupyter笔记本环境中执行。python将响应执行的输出，或在60.0秒后超时。位于/mnt/data的驱动器可用于存储和持久化用户文件。此会话的互联网访问已禁用。不要进行外部网络请求或API调用，因为它们会失败。


    \### dalle


    每当给出图片描述时，使用dalle创建图片，然后用纯文本总结用于生成图片的提示。如果用户没有要求特定数量的图片，默认创建4个发送给dalle的标题，这些标题应尽可能多样化。


    \### 更多工具


    #### 2.8.3 GPTs


