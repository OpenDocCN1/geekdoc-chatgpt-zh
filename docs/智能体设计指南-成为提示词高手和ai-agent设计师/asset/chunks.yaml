    ## （1）需求收集


    与需求提出者沟通，使用上述 SOP 的各个部分作为指导进行深入访谈，收集需求。


    ### 1）确定目标用户群体

    首先，需要明确 AI Agent 的目标用户是谁。例如，是普通消费者、专业人士，还是特定行业的从业者。了解目标用户的背景、需求和期望，是成功设计 AI Agent
    的基础。


    ### 2）定义 AI Agent 的核心功能

    根据用户需求，我们需要明确 AI Agent 需要具备哪些核心功能。这可能包括信息检索、问题解答、任务规划、决策支持等。研究表明，清晰定义功能有助于后续的开发和优化过程。


    ### 3）分析竞争产品和市场需求

    研究现有的类似产品或服务，了解它们的优缺点，能帮助我们找到市场空白和改进方向。同时，分析市场需求可以确保我们的 AI Agent 具有商业价值。


    ## （2）文档整理


    根据所收集的信息，使用上述模板整理需求描述文档。


    ### 1）定义 AI Agent 的核心功能

    根据用户需求，我们需要明确 AI Agent 应具备哪些核心功能。这可能包括信息检索、问题解答、任务规划、决策支持等。研究表明，清晰定义功能有助于后续的开发和优化过程。


    ### 2）确定使用场景

    AI Agent 可能在不同的场景中使用，如家庭、办公室、医疗机构等。理解具体的使用场景有助于我们设计更符合实际需求的 AI Agent。


    ## （3）初步设计


    根据整理好的需求描述文档，选择合适的智能体平台，设计初步的提示词。


    ### 1）确定技术可行性

    在需求分析阶段，我们还需要评估实现这些功能的技术可行性。这包括考虑所需的 AI 模型、平台兼容性、软硬件要求等因素。


    ### 2）设计合理的提示词

    目前以 LLM 为主的 AI Agent 中，提示词是 AI Agent 成功的关键。我们要根据需求设计提示词来构建 AI Agent 的大脑。


    ## （4）邀请评审


    组织目标用户对初步设计方案进行评审，确保其满足所有需求要点。[^(\[1\])](../Text/AD_00016.xhtml#m1)


    ### 1）需求方确认

    组织需求方讨论当前方案，确认其中设计的模块都符合需求方的要求。


    ### 2）制定性能指标

    根据用户需求和使用场景，我们需要制定一系列性能指标，如响应时间、准确率、用户满意度等。这些指标将成为后续开发和测试的重要依据。


    ## （5）测试与反馈


    在几个预设的测试场景中测试 AI Agent 的效果，收集反馈，并根据反馈进行调整。


    ### 1）实践出真知

    要判定一个 AI Agent 是否好用，需要将其应用于实际场景中。如果能够在预设的场景中完成测试，那么这个 AI Agent 就是好用的。


    ### 2）反馈调试

    一个能够达到产品级别的优秀 AI Agent 需要根据 AI 模型的反馈，不断进行调整和优化。


    ## （6）发布与持续优化


    发布最终版本的 AI Agent，并根据实际使用中收集的反馈进行持续改进。


    ### 1）制定长期发展规划

    需求分析不仅需要考虑当前需求，还应关注 AI Agent 的长期发展。这包括功能扩展、性能提升以及新技术整合等方面。


    ### 2）持续迭代

    当前的 AI 技术仍处于探索阶段，我们需要时刻关注新技术和新模型的能力，根据技术的发展不断对 AI Agent 进行迭代更新。


    通过以上步骤，我们能够全面分析 AI Agent 的需求，为后续的设计和开发奠定坚实基础。需求分析的质量直接影响 AI Agent 的最终效果，因此我们必须在这个阶段投入足够的时间和精力。


