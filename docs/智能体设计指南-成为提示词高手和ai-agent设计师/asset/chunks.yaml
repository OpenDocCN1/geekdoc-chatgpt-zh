    ## 10.2 单智能体的常见设计模块


    ### 10.2.1 推理

    首先是大语言模型的推理（Reasoning）。大语言模型的推理能力是现代 AI 软件的核心特征，它彻底改变了我们设计和使用软件的方式。推理能力使 AI 软件能够理解复杂指令，分析大量信息，并做出类似人类的判断。这一突破性特性将
    AI 软件与传统软件区分开来，成为新一代 AI 原生应用的基础。通过推理能力，AI 软件可以更灵活地应对不同情况，解决更复杂的问题，从而在各个领域中展现出前所未有的潜力。


    ### 10.2.2 思维链

    “思维链”是一种提升 AI 理解和解决复杂问题能力的方法。这种方法模仿人类的思考过程，将复杂问题分解成一系列简单的步骤。通过引导 AI 系统（也称为大语言模型）一步一步地思考，“思维链”方法能够大大提高其解决问题的准确性。

    想象一下，你在教一个孩子解答一道复杂的数学题。相比直接要求孩子给出最终答案，你更可能会引导他逐步思考：先理解问题，然后分解问题，最后一步步解决。“思维链”方法正是这样工作的。

    这种方法的效果可以通过一个简单的对比来理解：

    ●不使用“思维链”：直接要求 AI 系统解答复杂问题，它可能会给出错误的答案，类似于学生在面对难题时可能会猜测或混淆。

    ●使用“思维链”：通过引导系统逐步思考，每一步都清晰可见，AI 能够更好地理解问题，并得出正确的结论。这个过程类似于让学生把思考过程写在草稿纸上，一步一步地推导出答案。

    通过这种方法，AI 系统能够处理更复杂的任务，包括需要算术计算、常识判断和逻辑推理的问题。这不仅提高了答案的准确性，还使 AI 的思考过程变得更加透明和易于理解。


    ### 10.2.3 行动

    随着 AI 技术的发展，研究人员发现，即使是最先进的语言模型（如 ChatGPT）也有其局限性。为了突破这些限制，专家们开始探索如何让这些 AI 系统使用外部工具，以便执行各种任务。

    一个典型的例子是 OpenAI 公司提供的 GPTs 服务。该服务允许用户对 ChatGPT 进行个性化设置，使其能够连接到各种外部应用程序。其中最引人注目的是与
    Zapier 的合作，Zapier 提供了超过 6000 种不同的应用程序连接选项。

    这种连接极大地扩展了 ChatGPT 的功能范围。例如，经过增强，ChatGPT 不仅可以回答问题，还能执行实际的任务，如搜索互联网获取最新信息、管理用户的电子邮件，甚至安排日程。这就像给
    AI 系统装上了一套强大的工具箱，使其变得更加多功能和实用。

    通过这种方式，AI 系统不再局限于其原有的知识库，而是能够实时地获取信息并执行各种复杂的任务。这种进步为 AI 在日常生活和工作中的应用创造了新的可能性，使其有望成为更加强大和多功能的助手。


    ### 10.2.4 工具调用

    随着 AI 技术的进步，研究者们不再满足于让大型语言模型（如 ChatGPT）仅按照固定的方式运作。他们开发了一种新方法，使这些 AI 模型能够更加智能地调用各种工具，就像人类根据不同情况选择合适的工具一样。

    这种被称为“工具调用”的能力，使 AI 模型可以根据具体情况，灵活地选择和调用最合适的外部工具或服务。这大大提高了 AI 解决问题的能力和效率。


    ### 10.2.5 规划

    规划能力使 AI 系统能够像人类一样灵活地处理复杂任务。需要说明的是，由于 AI 的能力有限，当前的规划模式尚不成熟。这种方法的核心是让 AI 具备“规划”能力，即根据实际情况将大任务分解成多个小任务，并按需调整计划。

    著名 AI 专家吴恩达分享了一个生动的例子，来说明这种能力的重要性。在一次公开演示中，他使用了一个能够访问各种在线工具的 AI 系统。通常，这个系统会使用网络搜索来收集信息并总结。然而，在演示过程中，网络搜索工具突然因技术原因无法使用。

    面对这一意外情况，AI 系统并没有停滞不前。相反，它迅速调整了策略，转而使用维基百科搜索工具来完成任务。该工具是系统可用的备选方案之一，虽然平时很少用到。

    这个例子展示了先进 AI 系统的两个关键特性：

    ●适应能力：面对意料之外的问题，系统能够快速找到替代解决方案。

    ●资源利用：系统能够有效利用所有可用工具，即使是不常用的选项。

    这种“规划”能力使 AI 系统在面对复杂、变化的环境时表现得更像人类。它们能够根据实时反馈调整策略，这在实际应用中至关重要。


    ## 10.3 常见的单智能体开源项目


    ### 10.3.1 AutoGPT

    AutoGPT 是一个开创性的开源项目，它展示了如何让先进的 AI 模型（如 GPT-4）自主完成复杂任务。用户只需提供一个目标，AutoGPT 就能自行规划、执行并完成任务，几乎不需要人工干预。它具备互联网搜索、文件操作、代码执行等能力，还能管理信息记忆并通过插件扩展功能。AutoGPT
    采用“边思考边行动”的方法，不断根据反馈调整策略。虽然使用时需要一些技术准备，但它代表了 AI 自动化的重要进展，为未来智能助手的发展指明了方向。这个项目让我们得以一窥未来
    AI 如何革新工作方式，使复杂任务的完成变得更加高效和智能。

    项目地址为`https：//github.com/Significant-Gravitas/AutoGPT`。


    ### 10.3.2 GPT Engineer

    GPT Engineer 是一个备受关注的开源项目，它可以根据用户的简单描述自动生成整个软件项目。试想一下，你只需告诉它“我想要一个待办事项应用”，它就能为你创建出完整的代码、文档和项目结构。这个工具大大简化了软件开发过程，即使不懂编程的人也能快速实现自己的想法。它就像一个超级智能的编程助手，帮助你把创意变成现实，而无须深入编码细节。对于想要快速验证想法或学习编程的人来说，GPT
    Engineer 是一个非常有趣且实用的工具。

    项目地址为`https：//github.com/gpt-engineer-org/gpt-engineer`。


    ### 10.3.3 Translation Agent

    Translation Agent 是由著名 AI 专家吴恩达教授发起的创新翻译工具。与普通的翻译软件不同，它能够像人类译者一样思考和改进自己的翻译。这个工具会先提供一个初步翻译，然后仔细检查并提出改进建议，就像一个认真负责的译者在不断完善自己的工作。用户还可以轻松调整翻译风格，例如让它更正式或更口语化。Translation
    Agent 是开源的，这意味着世界各地的开发者都可以帮助改进它，使翻译变得越来越智能和准确。对于想要高质量翻译或对人工智能翻译感兴趣的人来说，这是一个非常值得关注的项目。

    项目地址为`https：//github.com/andrewyng/translation-agent`。


    ## 10.4 案例：基于腾讯元器的翻译智能体


    ### 10.4.1 案例效果

    接下来我们将打造一款翻译大师，将我们提供的英文翻译成信、达、雅的中文。下面是英国诗人叶芝的诗《当你老了》的翻译结果。

    以叶芝的诗《当你老了》的英文版本为例：

    When you are old

    When you are old and grey and full of sleep，

    And nodding by the fire，take down this book，

    And slowly read，and dream of the soft look

    Your eyes had once，and of their shadows deep；

    How many loved your moments of glad grace，

    And loved your beauty with love false or true，

    But one man loved the pilgrim Soul in you，

    And loved the sorrows of your changing face；

    And bending down beside the glowing bars，

    Murmur，a little sadly，how Love fled

    And paced upon the mountains overhead

    And hid his face amid a crowd of stars.

    翻译结果（最终结果）

    当你老了，白发苍苍，睡意绵绵，

    在炉火旁打盹，请取下这本诗篇，

    慢慢品读，追忆你那柔和的目光，

    曾有的眼神和深沉的阴影；

    多少人曾爱慕你那欢愉的时光，

    爱慕你的美丽，无论是假意还是真心，

    唯有一人，深爱着你那朝圣者的灵魂，

    也爱你容颜变迁中的哀愁；

    俯身在炽热的炉栏旁，

    低声细语，带着些许忧伤，诉说爱情的消逝，

    在头顶的山上他缓缓踱着步子，

    在繁星闪烁间隐匿了他的容颜。

    本案例聚焦于一个创新的翻译智能体，它基于最新的大语言模型技术，旨在提供更加智能、准确且富有文化洞察力的翻译服务。这个智能体不仅能够进行基础的语言转换，还能理解上下文、把握语言的细微差别，甚至能够进行自我评估和改进。接下来，我们将深入探讨这个翻译智能体的设计思路和功能实现。


    ### 10.4.2 设计思路

    该翻译智能体的设计思路立足于模仿人类翻译者的工作流，同时充分利用 AI 的优势。其核心设计理念可以概括为“三步循环过程：翻译—反思—优化”。

    翻译智能体的设计思路如图 10-7 所示。


    ![](img/img_00216.jpg)

    图 10-7 翻译智能体的设计思路


    （1）翻译

    智能体首先对输入的文本进行全面分析，考虑语言结构、语境和潜在的文化因素。利用大语言模型强大的语言理解能力，它能够快速生成初步翻译。这个阶段不仅仅是简单的词语替换，而是尝试理解原文的深层含义。

    （2）反思

    这是该设计的关键创新点。翻译完成后，智能体会“后退一步”，客观评估自己的翻译。它会检查语法的正确性、词语选择的准确度，以及整体表达是否自然流畅。更重要的是，它会思考翻译是否准确传达了原文的语气、风格和文化内涵。这个过程模拟了专业翻译者的自我审核阶段。

    （3）优化

    基于反思的结果，智能体会对初次翻译进行全面修改。这可能包括重新组织句子结构、更换更合适的词语，或者调整整段文字以更好地符合目标语言的表达习惯。这个过程不是简单的部分修改，而是可能涉及对整个翻译的重新构思。

    这种循环设计允许翻译智能体不断提高输出质量。它能够处理复杂的语言现象，如俚语、文化特定表达和专业术语，提供既忠实于原文又符合目标语言习惯的高质量翻译。


    ### 10.4.3 功能实现

    腾讯元器平台是一个强大的 AI 智能体创建平台，让用户能够自定义专业的 AI 助手。本节将带领读者逐步探索如何在该平台上创建一个名为“信达雅翻译大师”的 AI
    翻译助手。我们将详细介绍从设置基本信息（如名称、简介和头像），到定义智能体的专业能力，再到配置交互细节（如开场白和引导问题），最后到添加特定工作流的全过程。通过这个实例，读者将深入了解如何利用腾讯元器平台的各项功能，打造一个专业高效的
    AI 翻译工具，为后续探索更多 AI 应用场景奠定基础。


    #### 1.登录腾讯元器平台

    访问腾讯元器平台并登录，地址为`https：//yuanqi.tencent.com/my-creation/agent`。


    #### 2.创建智能体

    单击腾讯元器首页左上角的“创建智能体”按钮，进入智能体创建页面，然后按照以下步骤构建翻译智能体：

    1）设置智能体的名称：“信达雅翻译大师”。

    2）填写智能体简介。这里的简介是“将英文翻译为信达雅的中文”。

    3）设置智能体的头像图片。这里可以上传自定义图片，也可以用 AI 生成一张图片。我们用 AI 生成了一张图片，内容是一位戴着眼镜的年轻女性。

    4）设置智能体的详细设定，这里指的是提示词。我们设置的内容为：

    “你是英文翻译专家，能够将给你的英文段落翻译为信达雅的地道中文。当你获得用户输入的英文后，你会调用二次翻译工作流进行英文内容的翻译。”

    注意，这里我们的描述较为简洁，因为主要工作将通过二次翻译工作流完成，所以只需明确智能体的角色、任务以及如何调用工作流即可。我们所使用的调用工作流的句子是：

    “当你获得用户输入的英文后，你会调用二次翻译工作流进行英文内容的翻译。”

    当我们配置好工作流后（如图 10-8 所示），智能体将按照我们的设定执行翻译任务。

    5）设置开场白。智能体的开场白是：“你好，我是你的 AI 翻译助手，请把你要翻译的英文给我吧！”。


    ![](img/img_00217.jpg)

    图 10-8 设置智能体的名称、简介、头像和详细设定


    6）添加预置引导问题。我们设置了两个预置问题用于测试和引导用户使用：“superior textual intelligence”和“Math and coding
    proficiency”。

    设置完成后的效果如图 10-9 所示。


    ![](img/img_00218.jpg)

    图 10-9 设置智能体的开场白和预置引导问题


    7）配置用户问题建议。我们选择“只在最近一轮对话后展示引导问题”的选项即可，如图 10-10 所示。


    ![](img/img_00219.jpg)

    图 10-10 配置智能体的用户问题建议和添加工作流


    8）添加工作流。在这一步，我们单击右侧的“添加”，将“二次翻译工作流”添加进来。如果“二次翻译工作流”不存在，我们就需要创建这个工作流，具体创建过程将在下一步说明。


    #### 3.创建“二次翻译”工作流

    在第 8 步单击“添加”后，我们选择“创建工作流”，进入工作流创建页面。如图 10-11 所示，我们填写工作流名称为“二次翻译工作流”，描述为“信达雅二次翻译工作流”。这些信息请务必准确，大模型将使用这些信息准确地调用工作流。

    创建工作流后，进入工作流的编排页面。前面提到过，工作流由节点和节点之间的数据连接构成。接下来，我们将详细描述二次翻译工作流的创建过程。


    （1）开始节点

    这是工作流的起点，用户在此输入需要翻译的原文。我们设置参数名为 `english_content`，参数描述为“待翻译的英文内容”。


    ![](img/img_00220.jpg)

    图 10-11 创建工作流


    （2）第一次翻译节点

    AI 系统对输入的文本进行初步翻译。这一步使用 AI 大模型生成初始译文。

    由于模型只能使用默认的混元大模型，因此我们选择混元大模型，并编辑节点名称为“第一次翻译”。首先将开始节点的输出和本节点的输入相连接，将输入参数名设置为“`trans1`”，参数值设置为“引用”，具体的引用值选择为开始节点的“`english_content`”。

    然后设置这个节点的提示词模板，“`{{x}}`”代表的是变量，可以理解为一个占位符。在工作流运行时，实际要翻译的内容会放在变量的位置。由于我们将输入参数名设置为“`trans1`”，其功能是初次翻译，因此我们编辑这个节点的提示词为：

    你是翻译专家，请把下面的英文翻译为地道的中文：

    ''''''

    `{{trans1}}`

    ''''''

    只给出翻译内容，除此之外不要提供任何其他内容。


    （3）反思节点

    在这个关键步骤中，AI 会分析初次翻译的结果。它会考虑以下几个方面：

    ●检查翻译是否准确传达原文的意思；

    ●评估翻译的流畅性和自然度；

    ●识别可能需要改进的地方，如习语表达、文化差异等。


