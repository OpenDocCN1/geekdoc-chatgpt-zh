    优化工作流是确保 AI Agent 高效运行的重要步骤。通过模块优化和调整的持续改进，可以显著提升工作流的性能和效率。接下来将探讨工作流的调用方法，进一步完善
    AI Agent 的工作流执行机制。


    ## 6.5.4 工作流的调用

    在设计和优化工作流之后，有效调用和管理这些工作流是确保 AI Agent 高效运行的关键。工作流的调用不仅包括启动和执行工作流，还涉及监控、管理和动态调整。


    ### 1. 调用工作流的基本步骤

    1）前往当前团队或个人的 Bot 页面，选择进入指定 Bot。

    2）在 Bot“编排”页面的“工作流”区域，单击右侧的“+”图标。

    3）在“添加工作流”对话框中的“我创建的”页面，选择自建的工作流，如图 6-43 所示。

    ![](img/img_00153.jpg)

    图 6-43 “添加工作流”对话框

    4）在 Bot 的“人设与回复逻辑”区域，引用工作流的名称来调用工作流，如图 6-44 所示。

    ![](img/img_00154.jpg)

    图 6-44 引用的工作流


    ### 2. 工作流调用实战

    首先来看我们在 6.5.2 节中设计的获取新闻列表的工作流是如何进行调用的。

    1）前往当前团队或个人的 Bot 页面，创建或进入指定的 Bot。

    2）在 Bot“编排”页面，找到“技能”区域的工作流，并在右侧单击“+”图标。

    3）在对话框左侧单击“团队工作流”，找到自建的“`getNews_tasks`”工作流，并在右侧单击“添加”按钮。

    4）在 Bot 的“人设与回复逻辑”区域，声明 Bot 使用`getNews_tasks`工作流处理任务。

    编写完毕后，单击“优化”按钮，让 AI 帮助生成结构化的回复逻辑。

    5）在 Bot 右侧的“预览与调试”区域，输入内容以预览 Bot 的实现效果。例如，输入“人工智能科技新闻”，如图 6-45 所示。

    ![](img/img_00155.jpg)

    图 6-45 调用获取新闻列表的工作流


    再比如，将处理搜索结果的工作流直接应用到 Agent 中，如图 6-46 所示。

    1）在 Bot“编排”页面，找到“技能”区域的工作流，然后在右侧单击“+”图标。

    2）在对话框左侧单击“团队工作流”，找到自建的“`handle_search_tasks`”工作流，并在右侧单击“添加”按钮。

    3）在 Bot 的“人设与回复逻辑”区域，声明 Bot 使用`handle_search_tasks` 工作流处理任务。

    编写完成后，可以单击“优化”，让 AI 帮助生成结构化的回复逻辑。

    4）在 Bot 的右侧“预览与调试”区域，输入内容预览 Bot 实现的效果。

    ![](img/img_00156.jpg)

    图 6-46 将处理搜索结果的工作流直接应用到 Agent 中


    多个工作流的协调和管理也是调用过程中需要考虑的问题。在一个复杂的 AI Agent 系统中，可能会有多个工作流同时运行，这些工作流之间可能存在资源竞争和相互依赖。


    我们可以通过提示词来控制多个工作流的协调调用。比如，首先，调用××工作流，获取相应信息。然后，再调用××工作流，获取后续信息。


    在大模型接收到用户问题时，如果判断该问题需要调用工作流，则会从用户问题中提取关键信息，作为工作流的入参启动工作流。之后根据工作流运行后返回的参数，辅助回答用户的问题。


    因此，工作流的调用和管理是确保 AI Agent 高效运行的重要环节。通过有效的设计、动态调整和优化，以及多工作流的协调和管理，可以确保工作流的高效执行和系统的稳定运行。


