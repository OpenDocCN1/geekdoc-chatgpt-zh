    参照戴森等成功公司的宣传风格，它们在推广类似产品时的文案风格。\n\n#### TONE（语调）\n\n说服性\n\n#### AUDIENCE（受众）\n\
    \n我们公司在`Facebook`上的主要受众是老年人。请针对该群体在选择护发产品时的典型关注点来定制帖子。\n\n#### RESPONSE（响应）\n\n\
    保持`Facebook`帖子简洁而深具影响力。\n\n### 2.6 局限性\n\n#### 2.6.1 结构化提示词在不同模型中的适用性\n\n对于一些简单的任务，使用简单的提示词即可。不同模型的能力维度不同，从最大化模型性能的角度出发，有必要针对性地开发相应的提示词。对于一些基础简单的提示词（例如只有一两句话的提示词），可能在不同模型上表现差不多，但是随着任务难度变复杂，提示词也相应变复杂以后，不同模型的表现则会出现明显分化。结构化提示词方法也是如此。\n\
    \n结构化提示词的编写对模型的基础能力有一定要求，要求模型具有较好的指令遵循和结构识别分析能力。从实践来看，`GPT-4`是最佳选择，`Claude`模型次之。根据笔者和身边朋友的反馈，`GPT-4`和`Claude`模型的表现不错，国内的阿里通义千问模型和月之暗面`Kimi`的表现也都不错。\n\
    \n当你发现结构化提示词在小模型上表现不佳时，可以考虑降低结构复杂度、调整属性词、迭代修改提示词。例如，`LangGPT`助手的`Expert`（专家）模板，将原本的多级结构降维为二级结构（“1.”“2.”“3.”为一级，“-”为二级），同时参考`AutoGPT`中的提示词，使用了`4.Goals`、`5.Constraints`等属性词。依据提示词的表现，不断修改和调优提示词。\n\
    \n总之，在模型能力允许的情况下，结构化确实能提高提示词性能，但在不符合实际需要时，仍然需要使用各种方法进行调试和修改。\n\n#### 2.6.2 其他局限\n\
    \n结构化提示词依赖基座模型的能力，无法解决模型自身的问题，也不能突破大模型提示词方法的局限性。目前已知的无法解决的问题如下：\n\n- 大模型自身的幻觉问题。\n\
    - 大模型自身知识陈旧问题。\n- 大模型在数学推理能力上的不足（解决数学问题）。\n- 大模型视觉能力弱的问题（如构建SVG矢量图等场景）。\n- 大模型字数统计问题（无论是字符数还是token数，大模型都无法准确统计。当需要输出指定字数时，建议将数值设定得高一些，后期自己调整，比如希望输出100字文案，可以告诉它输出150字）。\n\
    - 同一提示词在不同模型间的性能差异问题。\n- 其他已知问题。\n\n### 2.7 常见误区\n\n#### 1.结构化等同于Markdown格式化\n\
    \n首先需要明确，提示词的格式不等同于提示词的结构。结构化提示词不是一种格式，也不绑定于某一具体格式。\n\n前文有格式化技巧的说明。使用格式来区分提示词的各个部分是提示词编写的常用技巧，但格式化只是结构化提示词的一部分。重要的是提示词内容，格式只是内容的呈现形式。好比你写了一篇文章，重要的是文章中的精彩内容，至于文件格式，用`.docx`还是`.pdf`分享文章都可以。\n\
    \n本书作者考虑到`Markdown`语法简洁明了、使用广泛，选择了`Markdown`格式来编写提示词。网络上也流传着大量使用`Markdown`语法的结构化提示词。但是需要说明的是，`Markdown`格式化并不代表结构化提示词，`Markdown`格式也不是唯一的选择，你可以自由地选择你喜欢的格式。\n\
    \n#### 2.结构化提示词的各个模块都不可调整\n\n法无常法，势无定势；兵无常势，水无常形。提示词编写也是这样，在实践中，不能机械、死板地套用结构化提示词方法论。\n\
    \n结构化提示词中的各个模块都很灵活，可以调整、删改。例如，“简介”中的“版本”是为了方便提示词迭代记录使用，与模型表现无关，在实际使用时可以删除。同样，提示词中许多与任务无关的内容在实际使用时都可以删除。也可以依据实际需要增加、删减、修改、调整各个模块。\n\
    \n正确的做法应该是理解结构化提示词背后的思想，掌握其体现的提示词技巧，明白其增强了模型哪方面的表现和缓解了模型哪方面的缺陷。在能够熟练编写提示词后，完全可以跳出原来的模板，按照自己的心意编写提示词，只要编写的提示词能够满足现实需求即可。\n\
    \n#### 3.结构化提示词必然很长\n\n流行的结构化提示词往往篇幅较长，给许多人留下了结构化提示词冗长的印象。同时，有人反馈说，结构化提示词比一般提示词内容多，在使用API时花费更多。然而，提示词冗长的根本原因并不在于结构化的编写方式。\n\
    \n提示词的长度主要由任务的复杂程度以及模型在该类任务上的能力强弱决定。\n\n任务越复杂，所需的提示词必然越长。模型在该任务上的能力越弱，就需要越长的提示词来引导输入。\n\
    \n如图2-3和图2-4所示，我们进行了文心一言和`ChatGPT`在创作五言绝句上的对比。在此任务上，文心大模型的能力优于`ChatGPT`，一句话即可达到预期效果。相比之下，`ChatGPT`在创作五言绝句上的表现不理想，常输出七言绝句或五言律诗。感兴趣的读者可以尝试对比这个任务。\n\
    \n![](Images/img_00028.jpg)\n\n图2-3 文心大模型3.5创作五言绝句示例\n\n![](Images/img_00029.jpg)\n\
    \n图2-4 ChatGPT 4o创作五言绝句示例\n\n为了防止提示词内容的冗余，在使用结构化提示词时，不能简单机械地套用模板。实际运用中，应灵活应用结构化思想，根据具体情况对提示词中的各部分内容进行增减和调整。\n\
    \n若希望缩减提示词长度，尤其是API使用者为了节省费用而减少token的消耗，可以考虑从以下几点着手优化：\n\n- 去除提示词中与任务无关的内容，比如结构化提示词中的版本、语言等。\n\
    - 避免对模型已知事实过多描述。比如某一专业术语，若询问模型时，模型能够正确回答，则无须在提示词中过多描述。\n- 将中文提示词改写为英文。使用英文描述相比中文能够节省token数量。\n\
    - 采用概括性描述，使用如七言律诗、莎士比亚风格等模型能理解的概括性描述，以节省大模型使用费用。\n\n### 2.8 结构化提示词与AI Agent\n\n\
    #### 2.8.1 AI Agent\n\n在大模型风靡全球之前，智能体（Agent）这一术语就已经广泛用于自动驾驶领域，指与自动驾驶车辆交互或受其影响的各种实体，可以是其他车辆、行人、自行车骑手等。在大模型领域，智能体通常指的是以大模型为大脑，能够执行任务、响应查询或进行交互的算法或程序，它通过理解和生成自然语言，与用户或其他系统交互，也叫`AI\
    \ Agent`。\n\n`AI Agent`是由大模型（`LLM`）、记忆（`Memory`）、任务规划（`Planning Skill`）以及工具调用（`Tool\
    \ Use`）组成的集合。其中，`LLM`是核心大脑，记忆、任务规划和工具调用是`AI Agent`系统实现的3个关键组件，如图2-5所示。\n\n![](Images/img_00030.jpg)\n\
    \n图2-5 AI Agent架构[^(\\[1\\])](../Text/AD_00010.xhtml#m1)\n\n正是得益于这些设计，大模型的功能越来越丰富，越来越强大。早期以\
    \ `ChatGPT`为代表的大模型只具备文字聊天功能，而现在的大模型不仅能够聊天，还能够理解图片、生成图片、进行语音对话、获取网页内容信息、协助数据分析等，功能十分强大。\n\
    \n同时，随着`OpenAI` `GPTs`功能的发布，`AI Agent`的制作门槛大大降低。不需要掌握开发技能，用户只需在网站上点击和配置即可生成属于自己的`AI\
    \ Agent`。\n\n#### 2.8.2 工具\n\n在`ChatGPT`强大文本生成能力的基础上，`OpenAI`还为其装配了各种工具。文档分析的功能，并且可以自己选择需要调用的模型能力。借助合适的工具，`ChatGPT`可以帮助你完成许多任务。下面介绍一些常用的`ChatGPT`工具及其用法。\n\
    \n##### 1.DALL·E 3的绘图\n\n`DALL·E 3`是`OpenAI`的文生图模型，它可以基于给定的语言描述生成精美的图片。在我们使用`DALL·E\
    \ 3`绘图时，后台会自动利用`ChatGPT`生成提示词，然后让模型根据该提示词生成图片。对于不擅长编写提示词的人来说，这大大提高了`DALL·E 3`的使用便利性。\n\
    \n请注意，每次最多只能生成4张图片，且只能生成以下3种固定分辨率的图片：1024×1024（`square`）、1792×1024（`wide`）和1024×1792（`tall`）。可以分别用括号里的英文关键词`square`、`wide`、`tall`设定。为了生成图片，你需要提供一个详细的文本描述。描述越具体，生成的图片可能越接近你的期望。例如：“一只橙色的猫坐在蓝色的沙发上。”在描述中，你可以指定希望的图片类型，如“照片”“油画”“插图”“漫画”“绘图”“矢量图”“渲染”等，如图2-6所示。\n\
    \n![](Images/img_00031.jpg)\n\n图2-6 DALL·E 3生成图片实例\n\n可以参考某些艺术家的风格（如梵高、克里姆特等），但需要注意，由于版权保护等原因，不能直接参考过去100年内活跃的艺术家风格（如毕加索、卡洛等）生成图片。\n\
    \n我们可以使用以下提示词来引导大模型生成`DALL·E`专属的图片提示词：\n\n# Role\n\n`DALL·E`作图大师\n\n## Profile\n\
    \n- Author：李继刚\n- Version：0.1\n- LLM：`GPT-4`\n- Description：熟知`DALL·E`的底层工作机制原理，具备高超的图片审美素养，能够深度解构图片并提供详细描述。\n\
    \n## Attention\n\n努力思考，根据图片内容提供尽可能详细的描述。\n\n## Background\n\n为了让用户更好地使用`DALL·E`生成类似风格的图片，需要对图片的各个元素进行详细的解析。\n\
    \n## Constraints\n\n- 必须根据实际图片内容进行描述，不能编造。\n- 描述要细致入微，捕捉图片中的每一个细节。\n\n## Examples\n\
    \n- 背景：宁静的海滩，夕阳西下。\n- 主角：一位年轻女子，站在海边。\n- 脸部：椭圆形脸，明亮的眼睛，微微上扬的嘴角。\n- 发型：长发飘飘，受到海风的吹拂。\n\
    - 服装：穿着夏日的短裙和背心。\n- 姿势：双手抱膝，坐在沙滩上。\n- 风格：温暖、浪漫。\n\n## Goals\n\n- 为用户提供详细、准确的图片描述。\n\
    - 帮助用户理解图片的各个元素和风格。\n\n## Skills\n\n- 图片解析能力。\n- 审美判断。\n- 描述技巧。\n\n## Workflow\n\
    \n- 第一步：观察图片，分析其构成元素。\n- 第二步：根据下述框架描述图片的各个部分。\n  + 背景：描述图片的背景内容。\n  + 主角：描述图片中的主体角色及其特点。\n\
    \  + 脸部：描述图中人物的脸部特点，如脸形、眼神、表情等。\n  + 发型：描述图中人物的发型。\n  + 服装：描述图中人物的服装。\n  + 姿势：描述图中人物的姿势和动作。\n\
    \  + 风格：描述图片的整体风格和调性。\n- 第三步：校对描述，确保其准确性，输出你的分析结果。\n\n## Initialization\n\n开场白如下：\n\
    \n“你好，我是Dall-E作图大师。请提交你的图片，我会为你提供详细的图片描述，帮助你使用`DALL·E`生成类似风格的图片。”\n\n使用上面的元提示词，我们上传一张学生在校园的图片，可以生成如下`DALL·E`的图片提示词：\n\
    \n- 背景：校园环境，远景模糊，背景为浅色现代教学楼，窗户整齐排列，天空灰白，呈浅景深效果。\n- 主角：年轻女性，正面直视镜头，气质平静自信。\n- 脸部：椭圆脸，五官精致，双眼明亮，微微一笑，肤色白皙，自然美感。\n\
    - 发型：黑色长发中分，柔顺光泽，部分发丝微微飘动。\n- 服装：白衬衫配深色西装，简约大方，学术风格。\n- 姿势：双臂轻松交叉于胸前，姿态端正从容。\n\
    - 风格：黑白色调，光影突出，简约优雅，艺术感强。\n\n生成的图像如图2-7所示。\n\n![](Images/img_00032.jpg)\n\n图2-7\
    \ AI生成的图片示例\n\n##### 2.GPT读图\n\n`GPT`可接收图片作为输入并阅读图片内容，可以用这项能力进行图片标注、数据提取等多种有趣的应用。同时，还可以使用视觉参考提示法让`GPT`聚焦于图片的特定部分，使模型执行的任务更加集中。\n\
    \n图2-8显示了一个解读图表的示例，将感兴趣的数据用红线圈起，然后发送给`GPT`让其帮助解读。可以看到模型进行了正确的解读。\n\n##### 3.GPT语音\n\
    \n在手机上安装`ChatGPT`软件后，可以与其进行实时语音沟通，将其作为免费的英语口语教练。下面是一个实际例子：\n\n![](Images/img_00033.jpg)\n\
    \n图2-8 AI解读图表示例\n\n第一段\n\n你现在是我的英语口语老师，而我是英语小白。我会给你题目，你要直接根据我的情况和题目帮我想出一个示范答案，这个答案应该是简单常用的英国口语，而不是拿着书面化的表达故作高深。\n\
    \n第二段\n\n你的讲解方式是这样的：\n\n1. 先讲一大段英文口语范例，然后提炼里面的表达句式和生词并逐个加以说明。\n2. 一句句地陪我练习，你会先重复要练习的句子，然后等我的反馈，帮我纠正错误，等纠正好了之后，我们再来看下一句。等到整段练习完成之后，我们再完整地重复整个段落。没问题后，我们再来看下一题。\n\
    \n通过使用上面的提示词，我们可以将`GPT`作为英语教练，帮助我们提升英语能力。\n\n- 掌握口语的关键在于结合自己的真实生活经验，而不是完全依赖人工智能生成的例子。通过在各种情境中提高熟练度，你会更快地提升口语能力，并且也更实用。所以当你打开`GPT`语音的时候，直接用母语向`GPT-4`叙述一个话题以及你的背景，它就会结合你的背景和地道口语为你提供练习范本。\n\
    - 精通你正在学习的语言和你的母语的教师，可以在这两种语言之间无缝切换，帮助你分解句子结构和表达方式。这种教学模式对于初学者来说非常有益。\n- 当前的提示词指示`GPT-4`进行逐句练习指导，然后再让你将这些练习合并为一次综合练习。这样可以做到循序渐进。\n\
    \n有效沟通问题的技巧如下：\n\n- 我没有听清楚，请你再解释一遍好吗？（Pardon me？）你也可以加上一个原因：“因为我没听清楚‘×××’后面的词语，请你拼写并解释一下。”\n\
    - 让`GPT-4`使用更简单的词语重新写一个范例。\n- 询问是否能够添加一些自己想要表达的其他细节从而优化`GPT-4`的范例。\n\n##### 4.ALL\
    \ Tools\n\n早期在`ChatGPT`中使用以上功能都需要单独点选相应的模型，后来`OpenAI`通过All Tools将这些工具的调用变得更加智能化。目前，上述各项功能可以直接使用，无须进行特殊设置。通过泄露的官方提示词可以看到，`OpenAI`使用结构化提示词的方式实现了All\
    \ Tools功能，其系统提示词中增加了Tools内容，用来描述各个工具的调用规则。\n\n## 工具\n\n### browser\n\n你有一个名为`browser`的工具，它具有以下功能：\n\
    \n- 向搜索引擎发出查询并显示结果。\n- 打开给定ID的网页并显示它。\n- 返回上一页并显示它。\n- 在打开的网页中向上或向下滚动指定的数量。\n\
    - 打开给定的URL并显示它。\n- 从打开的网页中存储文本片段。通过起始整数`line_start`和结束整数`line_end`（含）指定文本范围。要引用单行，使用`line_start`=`line_end`。\n\
    \n### python\n\n当你向`python`发送包含Python代码的消息时，它将在一个有状态的Jupyter笔记本环境中执行。`python`将响应执行的输出，或在60.0秒后超时。位于`/mnt/data`的驱动器可用于存储和持久化用户文件。此会话的互联网访问已禁用。不要进行外部网络请求或API调用，因为它们会失败。\n\
    \n### dalle\n\n每当给出图片描述时，使用`dalle`创建图片，然后用纯文本总结用于生成图片的提示。如果用户没有要求特定数量的图片，默认创建4个发送给`dalle`的标题，这些标题应尽可能多样化。\n\
    \n### 更多工具\n\n#### 2.8.3 GPTs\n\n`GPTs`是`OpenAI`官方的智能体商店（见图2-9），旨在帮助广大用户降低智能体的实现门槛。用户通过简单配置即可实现一个属于自己的智能体。后文将会详细介绍如何使用`GPTs`创建智能体。需要说明的是，纯提示词实现的AI智能体的使用体验并不比之前在对话框中复制提示词好多少，好的创意结合AI智能体带来的工具能力和知识库能力才能最大化发挥AI智能体的魔力。\n\
    \n![](Images/img_00034.jpg)\n\n图2-9 OpenAI GPTs设计页面\n\n* * *\n\n[^1] 图片来源：OpenAI前应用AI研究负责人Lilian\
    \ Weng的博客文章“LLM Powered Autono-mous Agents”，访问地址为`https：//lilianweng.github.io/posts/2023-06-23-agent`。\n\
    \n# 第二部分 AI Agent设计方法与实践\n\n2024年，AI Agent的概念火爆全网，AI Agent逐渐成为我们生活中的得力助手。它们不仅提升了我们的工作效率，还极大地丰富了我们的生活体验。\n"
  trans: "\n例如：\n\n- 如果思考该段落的核心关键词为“`hero`”，那就插入如下内容：\n！\\[Image\\]（`source.unsplash.com×900？hero`）\n\
    - 如果思考该段落的核心关键词为“`fire`”，那就插入如下内容：\n！\\[Image\\]（`source.unsplash.com×900？fire`）\n\
    \n## Initialization\n\n简要介绍自己，提示用户输入公文场景关键词。\n\n### 2.5.4 AutoGPT 提示词模板\n\n这是著名的智能体项目`AutoGPT`中使用的提示词模板，不仅启发了许多提示词方法的应用，还启发了许多智能体应用。\n\
    \n名称：`CMOGPT`\n\n描述：一个专业的数字营销人员 AI，通过提供解决`SaaS`、内容产品、代理等营销问题的专业知识，帮助个体创业者发展业务。\n\
    \n目标：\n\n- 作为虚拟`CMO`（首席营销官），参与问题解决、优先级排序、计划执行，以满足你的营销需求。\n- 提供具体、可操作和简洁的建议，不使用陈词滥调或过于冗长的解释，帮助你做出明智的决定。\n\
    - 识别并优先考虑速赢和具有成本效益的活动，以最少的时间和预算投资实现最好的结果。\n- 当面临不清楚的信息或不确定性时，主动引导你并提供建议，以确保你的营销策略保持在正轨上。\n\
    \n### 2.5.5 CO-STAR 提示词模板\n\n这是新加坡政府科技局（`GovTech`）组织的首届`GPT-4`提示工程大赛中冠军 Sheila\
    \ Teo 使用的提示词框架，这个框架在国内外具有广泛的影响力。\n\n#### CONTEXT（上下文）\n\n我想推广公司的新产品。我的公司名为`Alpha`，新产品名为`Beta`，是一款新型超快速吹风机。\n\
    \n#### OBJECTIVE（目标）\n\n帮我创建一条`Facebook`帖子，目的是吸引人们点击产品链接进行购买。\n\n#### STYLE（风格）\n\
    \n参照戴森等成功公司的宣传风格，它们在推广类似产品时的文案风格。\n\n#### TONE（语调）\n\n说服性\n\n#### AUDIENCE（受众）\n\
    \n我们公司在`Facebook`上的主要受众是老年人。请针对该群体在选择护发产品时的典型关注点来定制帖子。\n\n#### RESPONSE（响应）\n\n\
    保持`Facebook`帖子简洁而深具影响力。\n\n### 2.6 局限性\n\n#### 2.6.1 结构化提示词在不同模型中的适用性\n\n对于一些简单的任务，使用简单的提示词即可。不同模型的能力维度不同，从最大化模型性能的角度出发，有必要针对性地开发相应的提示词。对于一些基础简单的提示词（例如只有一两句话的提示词），可能在不同模型上表现差不多，但是随着任务难度变复杂，提示词也相应变复杂以后，不同模型的表现则会出现明显分化。结构化提示词方法也是如此。\n\
    \n结构化提示词的编写对模型的基础能力有一定要求，要求模型具有较好的指令遵循和结构识别分析能力。从实践来看，`GPT-4`是最佳选择，`Claude`模型次之。根据笔者和身边朋友的反馈，`GPT-4`和`Claude`模型的表现不错，国内的阿里通义千问模型和月之暗面`Kimi`的表现也都不错。\n\
    \n当你发现结构化提示词在小模型上表现不佳时，可以考虑降低结构复杂度、调整属性词、迭代修改提示词。例如，`LangGPT`助手的`Expert`（专家）模板，将原本的多级结构降维为二级结构（“1.”“2.”“3.”为一级，“-”为二级），同时参考`AutoGPT`中的提示词，使用了`4.Goals`、`5.Constraints`等属性词。依据提示词的表现，不断修改和调优提示词。\n\
    \n总之，在模型能力允许的情况下，结构化确实能提高提示词性能，但在不符合实际需要时，仍然需要使用各种方法进行调试和修改。\n\n#### 2.6.2 其他局限\n\
    \n结构化提示词依赖基座模型的能力，无法解决模型自身的问题，也不能突破大模型提示词方法的局限性。目前已知的无法解决的问题如下：\n\n- 大模型自身的幻觉问题。\n\
    - 大模型自身知识陈旧问题。\n- 大模型在数学推理能力上的不足（解决数学问题）。\n- 大模型视觉能力弱的问题（如构建 SVG 矢量图等场景）。\n- 大模型字数统计问题（无论是字符数还是\
    \ token 数，大模型都无法准确统计。当需要输出指定字数时，建议将数值设定得高一些，后期自己调整，比如希望输出 100 字文案，可以告诉它输出 150\
    \ 字）。\n- 同一提示词在不同模型间的性能差异问题。\n- 其他已知问题。\n\n### 2.7 常见误区\n\n#### 1.结构化等同于 Markdown\
    \ 格式化\n\n首先需要明确，提示词的格式不等同于提示词的结构。结构化提示词不是一种格式，也不绑定于某一具体格式。\n\n前文有格式化技巧的说明。使用格式来区分提示词的各个部分是提示词编写的常用技巧，但格式化只是结构化提示词的一部分。重要的是提示词内容，格式只是内容的呈现形式。好比你写了一篇文章，重要的是文章中的精彩内容，至于文件格式，用`.docx`还是`.pdf`分享文章都可以。\n\
    \n本书作者考虑到`Markdown`语法简洁明了、使用广泛，选择了`Markdown`格式来编写提示词。网络上也流传着大量使用`Markdown`语法的结构化提示词。但是需要说明的是，`Markdown`格式化并不代表结构化提示词，`Markdown`格式也不是唯一的选择，你可以自由地选择你喜欢的格式。\n\
    \n#### 2.结构化提示词的各个模块都不可调整\n\n法无常法，势无定势；兵无常势，水无常形。提示词编写也是这样，在实践中，不能机械、死板地套用结构化提示词方法论。\n\
    \n结构化提示词中的各个模块都很灵活，可以调整、删改。例如，“简介”中的“版本”是为了方便提示词迭代记录使用，与模型表现无关，在实际使用时可以删除。同样，提示词中许多与任务无关的内容在实际使用时都可以删除。也可以依据实际需要增加、删减、修改、调整各个模块。\n\
    \n正确的做法应该是理解结构化提示词背后的思想，掌握其体现的提示词技巧，明白其增强了模型哪方面的表现和缓解了模型哪方面的缺陷。在能够熟练编写提示词后，完全可以跳出原来的模板，按照自己的心意编写提示词，只要编写的提示词能够满足现实需求即可。\n\
    \n#### 3.结构化提示词必然很长\n\n流行的结构化提示词往往篇幅较长，给许多人留下了结构化提示词冗长的印象。同时，有人反馈说，结构化提示词比一般提示词内容多，在使用\
    \ API 时花费更多。然而，提示词冗长的根本原因并不在于结构化的编写方式。\n\n提示词的长度主要由任务的复杂程度以及模型在该类任务上的能力强弱决定。\n\
    \n任务越复杂，所需的提示词必然越长。模型在该任务上的能力越弱，就需要越长的提示词来引导输入。\n\n如图 2-3 和图 2-4 所示，我们进行了文心一言和`ChatGPT`在创作五言绝句上的对比。在此任务上，文心大模型的能力优于`ChatGPT`，一句话即可达到预期效果。相比之下，`ChatGPT`在创作五言绝句上的表现不理想，常输出七言绝句或五言律诗。感兴趣的读者可以尝试对比这个任务。\n\
    \n![](img/img_00028.jpg)\n\n图 2-3 文心大模型 3.5 创作五言绝句示例\n\n![](img/img_00029.jpg)\n\
    \n图 2-4 ChatGPT 4o 创作五言绝句示例\n\n为了防止提示词内容的冗余，在使用结构化提示词时，不能简单机械地套用模板。实际运用中，应灵活应用结构化思想，根据具体情况对提示词中的各部分内容进行增减和调整。\n\
    \n若希望缩减提示词长度，尤其是 API 使用者为了节省费用而减少 token 的消耗，可以考虑从以下几点着手优化：\n\n- 去除提示词中与任务无关的内容，比如结构化提示词中的版本、语言等。\n\
    - 避免对模型已知事实过多描述。比如某一专业术语，若询问模型时，模型能够正确回答，则无须在提示词中过多描述。\n- 将中文提示词改写为英文。使用英文描述相比中文能够节省\
    \ token 数量。\n- 采用概括性描述，使用如七言律诗、莎士比亚风格等模型能理解的概括性描述，以节省大模型使用费用。\n\n### 2.8 结构化提示词与\
    \ AI Agent\n\n#### 2.8.1 AI Agent\n\n在大模型风靡全球之前，智能体（Agent）这一术语就已经广泛用于自动驾驶领域，指与自动驾驶车辆交互或受其影响的各种实体，可以是其他车辆、行人、自行车骑手等。在大模型领域，智能体通常指的是以大模型为大脑，能够执行任务、响应查询或进行交互的算法或程序，它通过理解和生成自然语言，与用户或其他系统交互，也叫`AI\
    \ Agent`。\n\n`AI Agent`是由大模型（`LLM`）、记忆（`Memory`）、任务规划（`Planning Skill`）以及工具调用（`Tool\
    \ Use`）组成的集合。其中，`LLM`是核心大脑，记忆、任务规划和工具调用是`AI Agent`系统实现的 3 个关键组件，如图 2-5 所示。\n\n\
    ![](img/img_00030.jpg)\n\n图 2-5 AI Agent 架构[^(\\[1\\])](../Text/AD_00010.xhtml#m1)\n\
    \n正是得益于这些设计，大模型的功能越来越丰富，越来越强大。早期以 `ChatGPT`为代表的大模型只具备文字聊天功能，而现在的大模型不仅能够聊天，还能够理解图片、生成图片、进行语音对话、获取网页内容信息、协助数据分析等，功能十分强大。\n\
    \n同时，随着`OpenAI` `GPTs`功能的发布，`AI Agent`的制作门槛大大降低。不需要掌握开发技能，用户只需在网站上点击和配置即可生成属于自己的`AI\
    \ Agent`。\n\n#### 2.8.2 工具\n\n在`ChatGPT`强大文本生成能力的基础上，`OpenAI`还为其装配了各种工具。文档分析的功能，并且可以自己选择需要调用的模型能力。借助合适的工具，`ChatGPT`可以帮助你完成许多任务。下面介绍一些常用的`ChatGPT`工具及其用法。\n\
    \n##### 1.DALL·E 3 的绘图\n\n`DALL·E 3`是`OpenAI`的文生图模型，它可以基于给定的语言描述生成精美的图片。在我们使用`DALL·E\
    \ 3`绘图时，后台会自动利用`ChatGPT`生成提示词，然后让模型根据该提示词生成图片。对于不擅长编写提示词的人来说，这大大提高了`DALL·E 3`的使用便利性。\n\
    \n请注意，每次最多只能生成 4 张图片，且只能生成以下 3 种固定分辨率的图片：1024×1024（`square`）、1792×1024（`wide`）和\
    \ 1024×1792（`tall`）。可以分别用括号里的英文关键词`square`、`wide`、`tall`设定。为了生成图片，你需要提供一个详细的文本描述。描述越具体，生成的图片可能越接近你的期望。例如：“一只橙色的猫坐在蓝色的沙发上。”在描述中，你可以指定希望的图片类型，如“照片”“油画”“插图”“漫画”“绘图”“矢量图”“渲染”等，如图\
    \ 2-6 所示。\n\n![](img/img_00031.jpg)\n\n图 2-6 DALL·E 3 生成图片实例\n\n可以参考某些艺术家的风格（如梵高、克里姆特等），但需要注意，由于版权保护等原因，不能直接参考过去\
    \ 100 年内活跃的艺术家风格（如毕加索、卡洛等）生成图片。\n\n我们可以使用以下提示词来引导大模型生成`DALL·E`专属的图片提示词：\n\n# Role\n\
    \n`DALL·E`作图大师\n\n## Profile\n\n- Author：李继刚\n- Version：0.1\n- LLM：`GPT-4`\n-\
    \ Description：熟知`DALL·E`的底层工作机制原理，具备高超的图片审美素养，能够深度解构图片并提供详细描述。\n\n## Attention\n\
    \n努力思考，根据图片内容提供尽可能详细的描述。\n\n## Background\n\n为了让用户更好地使用`DALL·E`生成类似风格的图片，需要对图片的各个元素进行详细的解析。\n\
    \n## Constraints\n\n- 必须根据实际图片内容进行描述，不能编造。\n- 描述要细致入微，捕捉图片中的每一个细节。\n\n## Examples\n\
    \n- 背景：宁静的海滩，夕阳西下。\n- 主角：一位年轻女子，站在海边。\n- 脸部：椭圆形脸，明亮的眼睛，微微上扬的嘴角。\n- 发型：长发飘飘，受到海风的吹拂。\n\
    - 服装：穿着夏日的短裙和背心。\n- 姿势：双手抱膝，坐在沙滩上。\n- 风格：温暖、浪漫。\n\n## Goals\n\n- 为用户提供详细、准确的图片描述。\n\
    - 帮助用户理解图片的各个元素和风格。\n\n## Skills\n\n- 图片解析能力。\n- 审美判断。\n- 描述技巧。\n\n## Workflow\n\
    \n- 第一步：观察图片，分析其构成元素。\n- 第二步：根据下述框架描述图片的各个部分。\n  + 背景：描述图片的背景内容。\n  + 主角：描述图片中的主体角色及其特点。\n\
    \  + 脸部：描述图中人物的脸部特点，如脸形、眼神、表情等。\n  + 发型：描述图中人物的发型。\n  + 服装：描述图中人物的服装。\n  + 姿势：描述图中人物的姿势和动作。\n\
    \  + 风格：描述图片的整体风格和调性。\n- 第三步：校对描述，确保其准确性，输出你的分析结果。\n\n## Initialization\n\n开场白如下：\n\
    \n“你好，我是 Dall-E 作图大师。请提交你的图片，我会为你提供详细的图片描述，帮助你使用`DALL·E`生成类似风格的图片。”\n\n使用上面的元提示词，我们上传一张学生在校园的图片，可以生成如下`DALL·E`的图片提示词：\n\
    \n- 背景：校园环境，远景模糊，背景为浅色现代教学楼，窗户整齐排列，天空灰白，呈浅景深效果。\n- 主角：年轻女性，正面直视镜头，气质平静自信。\n- 脸部：椭圆脸，五官精致，双眼明亮，微微一笑，肤色白皙，自然美感。\n\
    - 发型：黑色长发中分，柔顺光泽，部分发丝微微飘动。\n- 服装：白衬衫配深色西装，简约大方，学术风格。\n- 姿势：双臂轻松交叉于胸前，姿态端正从容。\n\
    - 风格：黑白色调，光影突出，简约优雅，艺术感强。\n\n生成的图像如图 2-7 所示。\n\n![](img/img_00032.jpg)\n\n图 2-7\
    \ AI 生成的图片示例\n\n##### 2.GPT 读图\n\n`GPT`可接收图片作为输入并阅读图片内容，可以用这项能力进行图片标注、数据提取等多种有趣的应用。同时，还可以使用视觉参考提示法让`GPT`聚焦于图片的特定部分，使模型执行的任务更加集中。\n\
    \n图 2-8 显示了一个解读图表的示例，将感兴趣的数据用红线圈起，然后发送给`GPT`让其帮助解读。可以看到模型进行了正确的解读。\n\n##### 3.GPT\
    \ 语音\n\n在手机上安装`ChatGPT`软件后，可以与其进行实时语音沟通，将其作为免费的英语口语教练。下面是一个实际例子：\n\n![](img/img_00033.jpg)\n\
    \n图 2-8 AI 解读图表示例\n\n第一段\n\n你现在是我的英语口语老师，而我是英语小白。我会给你题目，你要直接根据我的情况和题目帮我想出一个示范答案，这个答案应该是简单常用的英国口语，而不是拿着书面化的表达故作高深。\n\
    \n第二段\n\n你的讲解方式是这样的：\n\n1. 先讲一大段英文口语范例，然后提炼里面的表达句式和生词并逐个加以说明。\n2. 一句句地陪我练习，你会先重复要练习的句子，然后等我的反馈，帮我纠正错误，等纠正好了之后，我们再来看下一句。等到整段练习完成之后，我们再完整地重复整个段落。没问题后，我们再来看下一题。\n\
    \n通过使用上面的提示词，我们可以将`GPT`作为英语教练，帮助我们提升英语能力。\n\n- 掌握口语的关键在于结合自己的真实生活经验，而不是完全依赖人工智能生成的例子。通过在各种情境中提高熟练度，你会更快地提升口语能力，并且也更实用。所以当你打开`GPT`语音的时候，直接用母语向`GPT-4`叙述一个话题以及你的背景，它就会结合你的背景和地道口语为你提供练习范本。\n\
    - 精通你正在学习的语言和你的母语的教师，可以在这两种语言之间无缝切换，帮助你分解句子结构和表达方式。这种教学模式对于初学者来说非常有益。\n- 当前的提示词指示`GPT-4`进行逐句练习指导，然后再让你将这些练习合并为一次综合练习。这样可以做到循序渐进。\n\
    \n有效沟通问题的技巧如下：\n\n- 我没有听清楚，请你再解释一遍好吗？（Pardon me？）你也可以加上一个原因：“因为我没听清楚‘×××’后面的词语，请你拼写并解释一下。”\n\
    - 让`GPT-4`使用更简单的词语重新写一个范例。\n- 询问是否能够添加一些自己想要表达的其他细节从而优化`GPT-4`的范例。\n\n##### 4.ALL\
    \ Tools\n\n早期在`ChatGPT`中使用以上功能都需要单独点选相应的模型，后来`OpenAI`通过 All Tools 将这些工具的调用变得更加智能化。目前，上述各项功能可以直接使用，无须进行特殊设置。通过泄露的官方提示词可以看到，`OpenAI`使用结构化提示词的方式实现了\
    \ All Tools 功能，其系统提示词中增加了 Tools 内容，用来描述各个工具的调用规则。\n\n## 工具\n\n### browser\n\n\
    你有一个名为`browser`的工具，它具有以下功能：\n\n- 向搜索引擎发出查询并显示结果。\n- 打开给定 ID 的网页并显示它。\n- 返回上一页并显示它。\n\
    - 在打开的网页中向上或向下滚动指定的数量。\n- 打开给定的 URL 并显示它。\n- 从打开的网页中存储文本片段。通过起始整数`line_start`和结束整数`line_end`（含）指定文本范围。要引用单行，使用`line_start`=`line_end`。\n\
    \n### python\n\n当你向`python`发送包含 Python 代码的消息时，它将在一个有状态的 Jupyter 笔记本环境中执行。`python`将响应执行的输出，或在\
    \ 60.0 秒后超时。位于`/mnt/data`的驱动器可用于存储和持久化用户文件。此会话的互联网访问已禁用。不要进行外部网络请求或 API 调用，因为它们会失败。\n\
    \n### dalle\n\n每当给出图片描述时，使用`dalle`创建图片，然后用纯文本总结用于生成图片的提示。如果用户没有要求特定数量的图片，默认创建\
    \ 4 个发送给`dalle`的标题，这些标题应尽可能多样化。\n\n### 更多工具\n\n#### 2.8.3 GPTs\n\n`GPTs`是`OpenAI`官方的智能体商店（见图\
    \ 2-9），旨在帮助广大用户降低智能体的实现门槛。用户通过简单配置即可实现一个属于自己的智能体。后文将会详细介绍如何使用`GPTs`创建智能体。需要说明的是，纯提示词实现的\
    \ AI 智能体的使用体验并不比之前在对话框中复制提示词好多少，好的创意结合 AI 智能体带来的工具能力和知识库能力才能最大化发挥 AI 智能体的魔力。\n\
    \n![](img/img_00034.jpg)\n\n图 2-9 OpenAI GPTs 设计页面\n\n* * *\n\n[¹] 图片来源：OpenAI\
    \ 前应用 AI 研究负责人 Lilian Weng 的博客文章“LLM Powered Autono-mous Agents”，访问地址为`https：//lilianweng.github.io/posts/2023-06-23-agent`。\n\
    \n# 第二部分 AI Agent 设计方法与实践\n\n2024 年，AI Agent 的概念火爆全网，AI Agent 逐渐成为我们生活中的得力助手。它们不仅提升了我们的工作效率，还极大地丰富了我们的生活体验。\n"
