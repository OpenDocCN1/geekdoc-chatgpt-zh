    平台，利用平台提供的监控调试功能即可实现这一点。


    # 第 7 章 AI Agent 设计流程

    本章将通过一个详细的案例，全面讲解 AI Agent 设计的各个环节，帮助读者深入理解 AI Agent 从需求分析到用户反馈的全过程。AI Agent 的设计不仅仅是技术实现，还需要综合考虑用户需求、提示词设计、测试与迭代以及用户反馈等多个方面。通过本章的学习，读者将掌握系统化的
    AI Agent 设计流程，并能够从零开始设计并优化一个 AI Agent。


    在这一章中，我们将通过一个真实案例来讲解 AI Agent 的设计流程和思路。这个案例是 HR 助手“岗位职责生成器”。在传统的招聘流程中，HR 专业人员通常需要花费大量时间撰写详尽的岗位描述，这不仅耗时且容易出错。通过引入
    AI Agent，我们可以实现岗位描述的自动生成，从而提高效率，并确保描述的一致性和准确性。


    我们的目标很明确：“通过用户输入的简单信息快速生成符合标准的岗位职责说明”。接下来，我们将分别从理论和实践的角度，依次拆解 AI Agent 的设计流程与方法。


    ## 7.1 需求分析

    在 AI Agent 的设计流程中，需求分析是至关重要的第一步。这个阶段的目标是明确 AI Agent 的功能、目标用户群体以及使用场景。


    我们需要明确构建 AI Agent 涉及的各个角色：

    ●需求提供者：通常是对 AI Agent 的最终输出有明确期望的人或组织；

    ●AI Agent 搭建者：确保这些期望被准确地转化为一个具体、可执行的 AI Agent 的人或组织；

    ●AI Agent 使用者：实际操作该 AI Agent 的人或系统；

    ●内容生成或阅读者：能够从这个 AI Agent 的输出中获得所需的信息或达到某种目的的人。


    如果没有明确和详细的需求分析，可能会偏离用户真正的需求，导致无效工作和资源浪费。


    ### 7.1.1 构建需求分析标准作业程序

    我们可以构建一套用于需求分析的 SOP（标准作业程序），为我们提供一个系统化、结构化的方法，确保从一开始就正确捕捉各角色的需求和期望。


    通过使用 SOP，我们可以确保每次的需求收集都全面且不会遗漏任何关键信息。


    此外，当团队中有新成员加入，或与外部合作者合作时，SOP 可以确保每个人都按照相同的流程和标准工作，保持一致性。因此，构建一个需求分析 SOP 不仅可以帮助我们提高工作效率，还能确保我们为所有相关角色创造的价值始终符合他们的真正需求。


    ### 7.1.2 需求分析 SOP 示例

    为了帮助大家更好地理解和执行需求分析过程，以下是一个详细的需求分析 SOP 示例，涵盖从任务识别到审查与反馈的各个关键步骤。


    任务识别：

    目的：确定 AI Agent 的核心目标或任务是什么。

    受众：明确目标用户群体或受众。

    使用场景：描述 AI Agent 预期的应用背景或环境。

    核心元素：

    关键角色：确定模型需要模拟或扮演的角色。

    预期输出：描述希望得到的最终结果或反馈。

    约束条件：列举执行任务时的规则或限制。


    详细需求：

    功能性：描述希望 AI Agent 具备的主要功能。

    交互流程：明确用户与模型的交互逻辑。

    错误处理：定义遇到错误时的处理策略或响应方式。


    背景信息：

    现有解决方案：调研和比对现有的解决方案与范例文本。

    知识基础：确定 AI Agent 的知识依赖或前置知识。


    优化与优先级：

    关键组件：识别 AI Agent 的核心内容或主要部分。

    可选项：确定哪些内容是加分项但非必要。

    约束与灵活性：平衡规则的严格性与任务的灵活性。


    审查与反馈：

    测试场景：设计几个可能的应用场景以测试 AI Agent 的效果。

    反馈渠道：设定一个渠道，方便用户或其他生成内容的使用/阅读者提供反馈。


    ### 7.1.3 执行步骤

    了解需求分析 SOP 示例后，接下来让我们看看如何具体执行这些步骤，以确保我们能够全面且有效地分析 AI Agent 的需求。以下是一个详细的执行步骤指南，涵盖了从需求收集到发布与持续改进的整个过程。


