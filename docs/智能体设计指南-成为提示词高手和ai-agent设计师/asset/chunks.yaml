- raw: '与外层提示词相比，系统级提示词更侧重于模型的内部工作机制，而外层提示词则更多地关注于如何根据用户的指令进行编排和响应。通过精心设计这两种提示词，可以增强模型对用户指令的处理能力，并确保整个工作流的顺畅和高效。


    在大模型组件中，批处理（即迭代处理）允许对集合或数组中的每个元素进行批量处理（如图6-27所示）。这种处理方式通过依次遍历集合或数组，使得每个元素都能经过相同的处理流程。批处理的关键在于通过有限循环实现高效的数据处理。


    在批处理中，我们可以设置循环次数，也就是迭代的次数。例如，在扣子的大模型组件中，最多可以支持200次的循环，这相当于一个200次的for循环，允许对200个元素进行连续的处理。


    此外，批处理还涉及并发量的问题。这里的并发量指在单次迭代中同时处理的元素数量。通过调整并发量，可以在一次循环中同时处理多个元素，从而提高处理效率。例如，如果集合中有200个元素，可以设置每次同时处理5个元素，这样只需40次循环就可以完成整个集合的处理。


    值得注意的是，不同的模型对并发量的支持程度不同。根据经验，将并发量设置在4或5通常是比较合理的，这既能保证处理效率，又能避免超出模型的处理能力。


    ![](Images/img_00134.jpg)


    图6-27 批处理设置


    （2）代码组件


    在工作流中，代码组件是一个功能强大但相对复杂的部分。它允许使用传统的编程语言来执行特定的逻辑处理。由于代码组件依赖于成熟的开发语言，因此在处理复杂的逻辑和算法时，能够提供极高的稳定性和可靠性。


    代码组件的主要用途包括但不限于以下几方面：


    ●执行自定义算法或数据处理逻辑。


    ●与外部系统或数据库进行交互，执行高级数据操作。


    ●进行条件判断和复杂决策的制定。


    由于代码组件具备这些特性，因此它在需要精确控制和高度定制化处理的场景中非常有用。然而，使用代码组件也需要一定的编程知识和技能，以确保编写的代码能够正确执行并达到预期效果。


    在后续的工作流设计中，如果遇到需要高度定制或优化性能的任务，代码组件将是一个不可或缺的工具。通过合理利用代码组件，可以大幅提升工作流的灵活性和处理能力。


    代码组件支持两种流行的脚本语言：JavaScript和Python（如图6-28所示）。可以根据自己的需求以及对语言的熟练度来选择使用哪种语言进行开发。在选择编程语言时，应考虑各自的优势和特点。JavaScript和Python各有其独特性，选择适合当前任务的语言可以显著提高开发效率和代码的可读性。


    ![](Images/img_00135.jpg)


    图6-28 代码组件


    此外，还需关注输入/输出变量匹配（如图6-29所示）。工作流中定义的输入、输出变量必须与代码组件中使用的变量名称完全一致，这样才能确保代码组件正确接收输入数据，从而避免因变量名不匹配引起的错误。


    ![](Images/img_00136.jpg)


    图6-29 输入/输出变量


    （3）消息组件


    在扣子中，消息组件是一个常用的工作流节点，用于实现工作流在执行途中与用户之间的交互（如图6-30所示）。许多人已经相当熟悉消息组件的基本使用，这里重点讨论的是“流式输出”这一高级特性。


    ![](Images/img_00137.jpg)


    图6-30 消息组件


    流式输出，简单来说，就是控制消息的发送方式—是希望消息内容逐字逐句地发送给用户，还是一次性完整地输出。这种特性对提升用户体验尤为关键，尤其是在处理大量文本或需要即时反馈的场景中。


    在默认情况下，消息组件的流式输出功能是关闭的，这意味着所有消息会一次性发送给用户。然而，当面对长文本或希望优化用户体验时，我们可以启用流式输出。这样，消息将逐字逐句地输出，使用户感觉像是在进行实时对话，而不是等待一大段文本一次性加载。


    例如，在实时聊天Agent中，流式输出可以显著提高用户的参与度和满意度。用户可以即时看到回复的每个部分，而不是盯着加载提示。


    （4）选择器组件


    选择器组件是工作流中实现逻辑分支的关键元素，它通过条件判断来控制工作流的流程（如图6-31所示）。这种组件的使用意味着工作流将根据不同的条件分成多个逻辑路径，从而使系统能够根据特定情况执行不同的操作。


    在使用选择器组件时，设计者需精心规划每个条件判断及其对应的逻辑分支。组件通常提供两种基本判断：If（如果）和Else（否则）。当If条件成立时，工作流将沿着指定路径执行；如果条件不成立，则转入Else分支，执行另一套预定义的操作。


    ![](Images/img_00138.jpg)


    图6-31 选择器组件


    （5）插件组件


    插件组件是构建Bot时常用的工具之一。在插件市场中，可以找到大量由扣子官方提供的插件，以及社区成员开发的插件，这些都为我们提供了丰富的选择，以满足不同的任务处理需求（如图6-32所示）。


    此外，也可以根据自己的特定需求，创建个性化的插件。这些自定义插件可以集成到Bot中，执行特定的任务处理，增强Bot的功能和灵活性。通过这种方式，可以充分利用插件的扩展性，打造更加智能和个性化的Bot体验。


    ![](Images/img_00139.jpg)


    图6-32 插件组件


    其他各节点的设计，可参考扣子的官方说明文档（https：//www.coze.cn/docs/guides/use\_workflow）。不同智能体平台都有自己的开发文档，可根据需求进行工作流编排。


    ##### 4.工作流设计实战


    以扣子平台为例，来查看官方提供的简单场景示例，即仅添加一个节点所构建的简单工作流。通过插件节点内的插件功能自定义工作流。例如，使用获取新闻插件构建一个用于获取新闻列表的工作流。步骤如下：


    1）打开扣子导航栏，在左侧导航栏选择打开个人空间或团队空间。


    2）在页面顶部进入“工作流”页面，然后单击“创建工作流”。


    ●工作流名称：输入getNews\_tasks。


    ●工作流描述：输入“搜索新闻”。


    图6-33展示了扣子创建工作流的流程。


    ![](Images/img_00140.jpg)


    图6-33 创建工作流的流程示例


    3）在“工作流”页面左侧列表中，单击插件右侧的“+”图标，查找并选用内置的getToutiaoNews节点。该节点将用于搜索新闻，如图6-34所示。


    4）连接各节点，并依次配置输入和输出参数，如图6-35所示。


    节点连接顺序为：开始 → getToutiaoNews → 结束。各节点参数配置说明见表6-5。


    ![](Images/img_00141.jpg)


    图6-34 添加搜索新闻插件


    ![](Images/img_00142.jpg)


    图6-35 配置输入和输出参数


    表6-5 节点参数配置说明


    ![](Images/img_00143.jpg)


    5）配置完成后，单击页面右上角的“试运行”按钮进行测试工作流，如图6-36所示。


    例如，输入“科技”进行测试，当所有节点都运行成功（节点会显示绿色边框）后，指定节点的运行结果如图6-36所示。


    ![](Images/img_00144.jpg)


    图6-36 工作流试运行


    6）测试工作流无问题后，单击页面右上角的“发布”按钮。成功发布后，在“工作流”列表中可以查看该工作流。


    通过上述步骤可以看到，工作流的设计是AI Agent开发中的重要环节。通过遵循清晰性、模块化、灵活性和可监控性的原则，并按照需求分析、流程建模、任务定义、条件和分支设置、错误处理和回滚机制、优化和测试等步骤进行设计，开发者可以构建出高效、可靠的工作流，确保系统能够准确、迅速地执行复杂任务。在接下来的小节中，我们将探讨工作流的优化方法，进一步提升工作流的性能和效率。


    #### 6.5.3 工作流的优化


    优化工作流是确保AI Agent高效运行的关键步骤。通过优化工作流，可以提高任务执行效率，减少资源消耗，并提升系统响应速度。对于一些复杂场景，单一节点的工作流并不能很好地满足我们的诉求，这时候就需要通过工作流的优化和编排来实现更复杂的功能。


    我们继续以扣子平台为例，来查看官方提供的复杂场景示例，即通过Code节点和插件节点构建一个用于处理搜索结果的工作流。


    通过插件节点内的插件能力自定义工作流。例如，使用“获取新闻”的插件构建一个用于获取新闻列表的工作流。操作步骤如下：


    1）打开扣子导航栏，在左侧导航栏选择打开个人空间或团队空间。


    2）在页面顶部进入“工作流”页面，并单击“创建工作流”。


    ●工作流名称：输入“handle\_search\_tasks”。


    ●工作流描述：输入“根据搜索结果查看第一个链接的内容并返回”。


    3）在“工作流”页面左侧，单击插件右侧的 “+” 图标，查找并选用bing-WebSearch节点，如图6-37所示。此节点将用于检索用户输入的信息。


    ![](Images/img_00145.jpg)


    图6-37 添加bingWebSearch节点


