    ![](img/img_00097.jpg)


    图 5-19 复制 Bot


    ●可以在新打开的配置页面中修改复制的 Bot 配置。


    在 Persona & Prompt 区域，调整 Bot 的角色特征和技能。可以单击 Opti-mize 选项，使用 AI 帮助优化 Bot 的提示词，以便大模型更好地理解。


    在 Skills 区域为 Bot 配置插件、工作流和知识库等信息。


    在 Preview 区域向 Bot 发送消息，测试 Bot 的效果。


    ●当完成调试后，可单击`Publish`按钮将 Bot 发布到社交应用中，以便在应用中使用 Bot。


    #### 3.国内版与国际版的区别


    （1）插件更齐全


    相对于国内版，国际版增加了 GPT4V、DALL·E、剪映、DocMaker 等免费插件功能，能够更好地支持具备绘图、视频生成和文档生成相关能力的机器人，如图
    5-20 所示。


    ![](img/img_00098.jpg)


    图 5-20 国际版的插件库


    （2）模型更丰富


    在 Bot 创建时，国际版的 Coze 支持国外的知名模型，可以直接使用 `GPT-4` 和 Google 的`Gemini`模型。


    （3）Bot 功能更多样


    国内的 Bot 商店更多地偏向于聊天性质的社交 Bot，工具型 Bot 相对较少，功能也比较单一。当然，近期国内的生态在逐步追赶。


    Coze 以其强大的功能和友好的用户体验，为开发者提供了一个高效、灵活的 AI Agent 开发平台。未来，随着技术的不断进步和平台的持续优化，Coze 有望在
    AI Agent 领域占据更加重要的位置。


    ### 5.3.2 GPT Store


    在 2023 年 11 月 6 日举行的 OpenAI 第一届开发者大会上，OpenAI 官方宣布了 GPTs，利用 GPTs，无须写代码就可以实现满足特定需求场景的自定义
    ChatGPT。


    截止到 2024 年 1 月，已经有超过 300 万个个性化 ChatGPT 被创造。


    GPT Store 是由 OpenAI 推出的一种平台（如图 5-21 所示），它允许用户创建、发现和使用针对各种目的定制的 GPT 模型。这些 GPT 模型是
    ChatGPT 的自定义版本，用户可以通过自然语言对话制作具有特定技能的 ChatGPT。此外，专业的媒体主编或更专业的玩家还可以上传文件或调用第三方 API
    来增强 GPT 的功能。


    ![](img/img_00099.jpg)


    图 5-21 GPT Store 界面


    #### 1.功能


    ●多样化的 GPT 类别。GPT Store 中的 GPT 涵盖多个领域，如写作、编程、教育、生活方式等。用户可以根据需求在平台上找到最适合自己的 GPT。


    ●创建和分享 GPT。用户不需要具备编程技能，就可以轻松创建自己的 GPT。创建完成后，可以将其发布到 GPT Store 中，供其他用户使用。


    ●增强的 AI 互动。定制的 GPT 能够处理复杂的人类任务，如文本解读、反馈生成和对话问答等。这使得 GPT 不仅是一个工具，更是一个能够适应特定业务需求的解决方案。


    #### 2.核心能力


    GPT Store 的核心能力如下。


    ●自然语言处理。利用先进的语言模型，GPT 能够理解并响应用户的自然语言输入。


    ●图像处理。通过 GPT Vision 模型，GPT 能够解释图像并结合上下文提供答案。


    ●数据分析。高级数据分析功能允许用户与数据文件互动，回答定量问题，修正数据错误，并生成可视化效果。


