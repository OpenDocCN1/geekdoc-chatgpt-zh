    ### 10.5 案例：基于扣子的短篇小说作家智能体


    #### 10.5.1 案例效果


    提示词：

    帮我写一篇在宇宙中发现类地行星的小说


    AI输出：

    《双生球籍：跨越星际的灵魂共鸣》


    小说大纲

    《双生球籍：跨越星际的灵魂共鸣》是一部探讨道德困境、资源冲突、文化融合的短篇科幻小说。故事围绕地球与新发现的星球“地外伊甸园”间的首次接触展开，通过跨星球的交流与合作，展现了人性的反思、文明的碰撞与共生的愿景。


    小说正文

    在那个被星辰点缀得格外深邃的夜晚，地球科学界的电波中跳跃着前所未有的喜讯—远方，另一颗蔚蓝的星球静静旋转，宛如镜像中的地球，被赋予了一个梦幻般的名字：“地外伊甸园”。消息如新纪元的晨曦，穿透了人类长久以来对孤独宇宙的恐惧与幻想，激荡起全人类心灵的涟漪。


    （中间内容省略）


    掌声雷动，不仅是对艾莉的鼓励，更是对未来的期许。李娜与亚历克斯相视一笑，眼眶湿润。他们知道，这一刻，不仅仅是新信号的回应，更是人类跨越种族、星球界限，共同迈向宇宙文明新时代的宣言。


    几千字的短篇小说在当代文学中占有特殊地位：它们能在有限篇幅内呈现完整的故事线，展现作者的文字功力，同时又适合在碎片化的现代生活中阅读。然而，当前的AI模型在生成长篇、连贯的文本方面仍面临挑战，通常难以一气呵成地输出上千字的高质量内容。


    尽管如此，我们仍可以通过多种方法利用AI来构建较长的短篇小说。这些方法包括分段生成、人机协作、迭代优化、多模型协作以及提示工程等。通过这些策略，我们不仅可以克服AI在长篇创作上的局限，还能探索AI在文学创作中的新可能性。


    #### 10.5.2 设计思路


    本节将详细阐述如何基于AI大模型构建短篇小说创作专家智能体的方法。这种方法旨在克服当前AI在创作中面临的挑战，同时保持作品的连贯性和创新性。


    首先，我们需要明确短篇小说的基本结构。一篇结构完整的短篇小说通常包含开场、发展、冲突、高潮和结尾5个关键部分。开场建立故事背景并介绍主要人物；发展深化情节并拓展人物形象；冲突引入并加剧矛盾；高潮将冲突推向顶点；结尾则化解冲突并提供结局。这5个部分相互关联，递进式地构建完整的叙事架构。


    然而，AI在文学创作领域面临几个主要挑战：内容长度限制、创意深度不足、知识更新不及时，以及维持叙事连贯困难。为了解决这些挑战，我们设计了一个创新的AI驱动创作流程，原理如图10-14所示。


    这个流程始于创意生成与筛选阶段。当系统接收到创作主题后，“创意构思”模块被激活，利用AI的发散思维能力生成多个原创故事概念。例如，如果主题是“未来交通”，AI可能会提出“思维控制的飞行汽车”或“跨时空公共交通系统”等创意。随后，“创意选择与润色”模块评估这些创意，考虑其新颖性、叙事潜力和主题契合度等因素，模拟人类作者的创意筛选过程。


    ![](Images/img_00223.jpg)

    图10-14 设计原理


    为了增强创作的真实性和深度，系统还包含了知识获取与整合环节。AI首先分析选定的创意，总结搜索关键词，然后利用这些关键词通过搜索API（如必应搜索）获取相关信息。接着，AI对搜索结果进行分析、筛选和整合，提取出对创作有价值的知识点。此步骤确保了AI在创作过程中能够访问最新、最相关的信息，从而增强故事的真实性和深度。


    接下来，AI系统开始构建一个结构化的故事大纲。这个大纲包括小说标题、故事梗概、主要人物设定以及5个主要部分的内容概述。大纲的生成过程利用了AI在信息组织和逻辑推理方面的优势，以确保故事结构的完整性和情节发展的合理性。


    基于生成的大纲，AI开始分为5个阶段完成小说创作。每个阶段对应小说的一个主要部分，AI会根据该部分的特点和要求进行创作。例如，在开场部分，AI专注于建立故事世界，介绍主要人物，设定情节基调；而在冲突部分，AI致力于引入并加剧故事中的矛盾与张力。在每个部分的创作过程中，AI都会参考先前生成的内容，确保情节、人物和主题的一致性。这种方法不仅克服了AI在生成长篇内容时的局限性，还保持了整体叙事的连贯性。


    最后，AI将5个部分整合成一篇完整的短篇小说。如果想要进一步提升小说质量，在这个阶段，我们还可以设置最后的一致性检查，确保人物塑造、情节发展和主题表达的连贯性。如果发现任何不一致或逻辑问题，可以让AI进行必要的调整和优化。


    通过将AI的计算能力与传统写作技巧相结合，我们创造了一个能够生成结构完整、内容丰富的短篇小说的系统。尽管AI创作的作品可能还无法完全匹敌人类作家的深度和情感表达，但它为我们开启了文学创作的新可能性。这种方法不仅可以作为人类作家的辅助工具，还可能催生出全新的文学形式和创作模式。


