    ### 5.2.2 腾讯元器


    腾讯元器[^(\[5\])] (`../Text/AD_00014.xhtml#m5`)是腾讯混元大模型团队推出的智能体开放平台，界面如图 5-12 所示。腾讯混元大模型作为腾讯全链路自研的通用大语言模型，其参数规模超过万亿，目前提供`hunyuan-pro`（万亿参数）、`hunyuan-standard`（千亿参数）和`hunyuan-lite`（百亿参数）三个版本。腾讯元器主要面向企业和开发者，这些用户可以在腾讯元器上通过提示词直接创建智能体，同时支持使用腾讯官方的插件和知识库。智能体创建完成后，用户还可以将这些智能体一键分发到
    QQ、微信客服、腾讯云等渠道上。


    ![](img/img_00089.jpg)


    图 5-12 腾讯元器界面


    腾讯混元大模型已在 600 多个腾讯内部业务和场景中进行落地测试，并在腾讯丰富的生态中持续迭代能力。例如，微信读书基于混元大模型推出了 AI 问书、AI 大纲等新功能，大幅提升了用户的阅读效率和体验。腾讯客服团队基于混元大模型升级了智能客服体系，大幅提升了智能对话的意图理解准确性和多轮问答的流畅性。


    腾讯元器同样支持通过以下能力对大模型进行增强。


    1）提示词：包括详细设定、开场白、建议引导问题（如图 5-13 所示）。


    ![](img/img_00090.jpg)


    图 5-13 腾讯元器智能体设置提示词界面


    2）插件（外部 API）：目前支持勾选多个插件。官方插件包含微信搜一搜、PDF 摘要与解析、混元图片生成，也支持用户自定义插件。


    3）知识库：当前版本支持`.doc`、`.txt`、`.docx`、`.pdf`等多种格式，每个文件大小不超过 20MB。关于大模型如何调用知识库信息，官方文档也进行了说明。


    4）工作流：一种“流程图”式的低代码编辑工具，可以用来制作“高级版”插件。在工作流中，可以任意编排插件、知识库、大模型节点的工作顺序和参数调用，从而精确控制智能体中特定任务的运行逻辑（如图
    5-14 所示）。


    通过元器平台制作的智能体，目前支持 32K 上下文长度（某次回答过程中的提示词+机器回答的 token 长度，一个 token 约为 1.8 个中文字符）。工作流的超时运行时间为
    5 分钟。智能体的回复上限时间是 90 秒。


    ![](img/img_00091.jpg)


    图 5-14 腾讯元器的工作流示意图


    腾讯元器在分发与应用方面表现出色。在智能体的“发布”页面，用户可填写发布版本记录，设置公开范围，选择所属类型，还可将智能体配置发布至 QQ、微信客服、微信小程序、微信公众号等腾讯生态体系内的社交产品渠道，获得使用场景和流量支持，不过这些需要一定的核验准入门槛。此外，平台还支持
    API 调用，方便智能体的集成和应用。通过 API 调用，用户可以将智能体轻松集成到各种应用场景中，进一步扩展智能体的功能和应用。


    腾讯元器在市场前景和合作方面展现出巨大的潜力。平台已开启内测，吸引了大量企业和开发者的关注。通过业务合作和推广，腾讯元器正积极推动微信公众号内容的发展，并助力各行业实现创新突破。


    与字节跳动的扣子平台相比，腾讯元器在资源丰富度上具有明显优势。元器基于腾讯混元大模型，提供了更强大的多模态处理能力和更丰富的预集成资源，使用户在智能体开发和应用过程中能够获得更好的体验和效果。但产品尚处于初期阶段，可能还需要时间来培养创作者生态，并进一步优化产品体验的细节。


    鉴于微信生态系统的支持，相信随着平台功能的不断完善和市场应用的拓展，腾讯元器将在更多领域展现其巨大潜力。


    ### 5.2.3 Dify


    在人工智能技术迅速发展的背景下，LLM 应用开发平台成为企业数字化转型的重要工具。其中，Dify[^(\[6\])] (`../Text/AD_00014.xhtml#m6`)作为一个开源的
    LLM 应用开发平台，在国内企业 B 端应用场景中得到了广泛使用。它为开发者提供了从智能体构建到 AI 工作流编排、RAG（检索增强生成）检索、模型管理等一系列功能。作为一个开源项目，Dify
    遵循 Apache License 2.0 协议，这使得企业和开发者可以自由地使用、修改和分发该软件。


    #### 1.核心功能


    Dify 的主要功能可归纳为以下几个方面：


    （1）可视化提示词的编排


    Dify 提供了一个直观的可视化界面，使用户能够快速创建和调试提示词。这一功能大大简化了 AI 应用的开发过程，特别是对那些不具备深厚编程背景的用户十分友好。通过拖曳式的界面设计，用户能够轻松构建复杂的对话流程和决策树，而无须深入了解底层的技术细节。


    （2）支持多种模型


    Dify 支持多种专有和开源的大语言模型，包括但不限于 GPT 系列、Mistral、Llama 3 等。此外，它还兼容 OpenAI API 的模型，这意味着企业可以根据自身需求和预算选择最适合的模型。这种灵活性使得
    Dify 能够适应不同规模和类型企业的需求，从初创公司到大型企业都能找到合适的解决方案。


    （3）知识库集成


    Dify 支持用户导入自有数据作为上下文，并自动完成文本预处理。此功能对于企业尤为重要，因为它允许企业将专有知识和数据无缝集成到 AI 应用中。系统能够自动处理各种格式的文档，包括
    PDF、Word、CSV 等，并将其转化为 AI 可理解的格式。这大大减少了数据准备的工作量，使企业能够快速将现有知识转化为 AI 的智能输出。


    （4）API 驱动的开发


    Dify 提供了后端即服务的功能，使用户可以直接通过 API 将 Dify 集成到自己的应用中。这种设计简化了后端架构和部署流程，使开发者可以专注于前端体验和业务逻辑的开发。API
    的灵活性还允许企业将 Dify 无缝集成到现有的系统和工作流中，提高了整体的开发效率和系统兼容性。


    （5）数据标注与改进


    Dify 提供了可视化工具用于审查 AI 日志，观察推理过程，并持续改进模型性能。这个功能对于保证 AI 应用的质量和可靠性至关重要。通过分析用户交互数据和模型输出，企业可以持续优化其
    AI 应用，提高准确性和用户满意度。这种闭环的改进机制确保了 AI 应用能够随时间推移而不断进化，从而适应不断变化的业务需求。


    Dify 的操作界面如图 5-15 所示。


    ![](img/img_00092.jpg)


    图 5-15 Dify 的操作界面


    #### 2.应用场景


    Dify 在企业 B 端应用中的典型场景多样，涵盖多个行业和业务领域。


    （1）智能客服系统


    Dify 可以用于构建高度个性化的智能客服系统。该系统能够理解复杂的客户查询，提供准确的回答，并在必要时将问题升级给人工客服。通过集成企业的知识库，AI 客服可以处理从产品咨询到技术支持的各种问题，显著提高了客户服务的效率和质量。


    （2）文档分析与信息提取


    在金融、法律和医疗等行业，Dify 可以用于构建自动化的文档分析系统。该系统能够从大量非结构化文本中提取关键信息，如合同条款、财务数据或医疗记录，大大减少了人工处理的时间和错误率。


    （3）自动生成报告


    Dify 可以用于开发自动化报告生成工具，特别是在需要整合多源数据并生成洞察的场景中。例如，在市场研究或商业分析领域，AI 可以快速分析大量数据，生成结构化的报告，为决策者提供及时、准确的信息支持。


    （4）内部知识的管理与检索


    对于拥有大量内部文档和知识的企业，Dify 可以用于构建智能知识管理系统。该系统能够理解复杂的查询，快速从海量文档中检索相关信息，帮助员工更高效地获取所需知识，提高整体工作效率。


    #### 3.技术特点


    Dify 的技术架构和设计理念具有以下几个关键特点。


    （1）模块化设计


    Dify 采用模块化的设计架构，使各功能组件可以独立开发和升级。这种设计不仅提高了平台的可维护性，还为未来的功能扩展提供了便利。


    （2）可扩展性


    作为一个开源平台，Dify 的架构设计考虑了高度的可扩展性。开发者可以基于 Dify 的核心功能开发自定义的插件，以满足特定的业务需求。


    （3）安全性


    考虑到 AI 应用经常涉及敏感数据处理，Dify 在设计中特别注重安全性。它提供了多层次的安全机制，包括数据加密、访问控制及隐私保护等，以确保企业数据安全。


    （4）性能优化


    Dify 在处理大规模数据和复杂 AI 任务时，采用了多项性能优化技术，如并行处理和缓存机制，以确保在高负载情况下的稳定性和响应速度。


    #### 4.挑战与局限性


    尽管 Dify 在企业应用中表现出色，但仍面临一些挑战和局限性。


    （1）技术复杂性


    对于复杂的 AI 应用场景，仅依靠 Dify 的低代码功能可能不足以满足所有需求。在某些情况下，企业可能仍需要具备专业的 AI 知识和编程技能的团队来进行深度定制与优化。


    （2）开源项目的可持续性


    作为一个开源项目，Dify 的长期维护和更新在一定程度上依赖于社区的活跃度。尽管目前社区非常活跃，但企业在选择使用 Dify 时仍需考虑长期支持的问题。


    （3）数据安全与隐私


    处理高度敏感数据时，企业可能需要额外的安全措施。虽然 Dify 提供了基本的安全功能，但某些高度规范的行业（如金融、医疗）可能需要额外的安全审核和定制化实施。


    （4）模型选择与管理


    虽然 Dify 支持多种模型，但选择和管理这些模型仍需要一定的专业知识。企业需要权衡不同模型的性能、成本和适用性，这可能需要专业的 AI 策略和管理。


    （5）与现有系统的整合


    将 Dify 集成到现有企业的 IT 生态系统中可能会面临挑战，特别是对于那些拥有复杂遗留系统的大型企业。这可能需要额外的集成工作和系统调整。


    Dify 作为一个开源的 LLM 应用开发平台，凭借其易用性、灵活性和功能性，在国内企业 B 端应用中占据了重要地位。它为企业提供了一种快速、灵活的方式来构建和部署
    AI 应用，有效地降低了 AI 技术的应用门槛。尽管面临一些挑战，但随着技术的不断进步和社区的持续支持，Dify 有望在企业智能化转型中继续发挥重要作用，推动
    AI 技术在更广泛的业务场景中的应用和创新。


    ### 5.2.4 FastGPT


    FastGPT[^(\[7\])] (`../Text/AD_00014.xhtml#m7`)是一个基于 LLM 的知识库问答系统，提供开箱即用的数据处理、模型调用等能力（如图
    5-16 所示）。同时，可以通过`Flow`可视化进行工作流编排，从而实现复杂的问答场景。


    ![](img/img_00093.jpg)


    图 5-16 FastGPT 的创建和调试应用


    #### 1.核心能力


    （1）专属 AI 客服功能


    这一功能通过训练导入的文档或问答对，使 AI 模型能够以对话的形式准确回答基于文档内容的问题。这种交互能力极大提升了客户服务的效率和质量。


    （2）平台的可视化界面设计直观且用户友好


    通过简化操作步骤，用户可以轻松完成 AI 客服的创建与训练。这种易用性大大降低了技术门槛，让不同水平的用户都能快速上手。


    （3）自动数据预处理功能


    平台支持多种数据导入方式，包括手动输入、直接分段、LLM 自动处理和 CSV 等。其中，直接分段支持将 PDF、Word、Markdown 和 CSV 文档内容作为上下文。FastGPT
    会自动对文本数据进行预处理、向量化和 QA 分割，节省手动训练时间，提升效能。


    （4）工作流编排


    基于`Flow`模块，用户可以设计出更加复杂的问答流程，如数据库查询、库存检查和实验室预约等。这种灵活性使得 FastGPT 不仅适用于简单的问答系统，也能够满足企业级应用的复杂需求。


    （5）强大的 API 集成


    FastGPT 的 API 与 OpenAI 官方接口保持一致，这为开发者提供了极大的便利。开发者可以轻松地将 FastGPT 集成到现有的 GPT 应用中，或将其集成到企业微信、公众号、飞书等平台，实现无缝对接。


    #### 2.特点


    （1）项目开源


    与 Dify 类似，项目完全在 GitHub 上进行开源，遵循附加条件的 Apache License 2.0 协议，鼓励社区参与。


    （2）独特的 QA 结构


    针对客服问答场景设计的 QA 结构，可以提高在大量数据场景中的问答准确性。


    （3）可视化工作流


    通过`Flow`模块展示从问题输入到模型输出的完整流程，便于调试和设计复杂流程。


    （4）无限扩展


    基于 API 进行扩展，无须修改 FastGPT 源代码，也可快速接入现有程序。


    （5）便于调试


    提供搜索测试、引用修改和完整对话预览等多种调试途径。


    （6）支持多种模型


    支持 GPT、Claude、文心一言等多种 LLM 模型，未来还将支持自定义的向量模型，提供广泛的选择空间。


    FastGPT 工作台如图 5-17 所示。


    ![](img/img_00094.jpg)


    图 5-17 FastGPT 工作台


    FastGPT 的开源特性和强大功能，为用户提供了极大的灵活性和扩展性。其开源特性吸引了众多开发者的关注，并且其强大功能和灵活性也得到了用户的高度评价。


    随着 AI 技术的不断发展，FastGPT 有望成为智能体设计和开发领域的重要工具，推动智能交互技术的进步和应用。我们期待 FastGPT 在未来能够发挥更大的作用，为智能体技术的进步贡献力量。


    ## 5.3 国外主要智能体平台


    ### 5.3.1 Coze


    Coze 是扣子的国际版本，同样是新一代一站式 AI Bot 开发平台（如图 5-18 所示）。无论你是否有编程基础，都可以在 Coze 平台上快速搭建基于
    AI 模型的各类问答 Bot—从解决简单的问答到处理复杂逻辑的对话。同时，可以将搭建的 Bot 发布到各类社交平台和通信软件，与这些平台或软件的用户互动。


    ![](img/img_00095.jpg)


    图 5-18 Coze 平台界面


    #### 1.功能


    5.2.1 节介绍了扣子的功能，Coze 是扣子的海外版，功能与扣子一样，此处不再赘述。


