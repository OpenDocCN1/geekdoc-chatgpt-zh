    ##### 3.国内版与国际版的区别


    （1）插件更齐全


    相对于国内版，国际版增加了GPT4V、DALL·E、剪映、DocMaker等免费插件功能，能够更好地支持具备绘图、视频生成和文档生成相关能力的机器人，如图5-20所示。


