    图12-10 AI扮演专家角色


    （3）示例法


    示例法即所谓的few shot方法。如图12-11所示，当我们直接给AI一个表盘的数据，让它去识别速度是多少时，可以发现结果是错的。正确答案应该是160km/h，但AI识别错了。如果我们提供一些示例，先给AI两张图片，并告知前两张图片的结果，最终让它识别第三张图片的结果，可以看到识别结果有了明显改善，AI能够正确识别。


    ![](Images/img_00279.jpg)


    图12-11 示例法


    （4）格式法


    这种指定输出格式的方法也非常有效。


    如图12-12所示，当进行发票表格识别任务时，我们可以指定期望输出格式为`JSON`，然后指定其中的某些具体类别。这样AI就可以准确地从发票中抽取出我们想要的信息。


    ![](Images/img_00280.jpg)


    图12-12 指定AI输出格式


    从这个例子可以看出，格式法能够显著提高模型的稳定性和精准度。


    除此之外，混合模型和多模态学习也是解决数字识别问题的一种有效方法。通过结合图像处理、自然语言处理和逻辑推理等多种技术，混合模型可以综合利用多种信息源，提高识别的准确性。例如，一个混合模型可以先通过图像处理技术识别数字的形状，再通过自然语言处理技术理解上下文，最后通过逻辑推理进行精确计算。这种多层次、多角度的处理方式能够显著提升数字识别的效果。


    总的来说，尽管在数字识别方面面临诸多挑战，但通过改进数据集、优化算法和引入外部计算工具等方法，AI智能体在这一领域的性能有望显著提升。这不仅可以扩展AI智能体的应用范围，还能提高其在科学计算和金融分析等领域的实用性与可靠性。


    ## 12.3 智能体难以解决数学问题


    ### 12.3.1 问题成因


    尽管智能体在自然语言处理和生成方面表现出色，但在解决数学问题时仍存在明显的局限性。


    2024年7月，有一个关于AI回答“9.11和9.9哪个大”的问题在网上很火，几乎所有的大模型都集体失误，坚定地认为9.11更大。


    图12-13展示了`GPT-4o`的表现，开始的分析还准确，最后一步突然不讲道理了。


    ![](Images/img_00281.jpg)


    图12-13 `GPT-4o`回答“9.11和9.9哪个大”的问题


    将数字的顺序调整后，最终结论正确，但中间过程显然仍有问题，如图12-14所示。


    词序敏感：先问哪个更大，AI会沿着明确路径开始比较数字，但如果只是随便说说数字，没有明确目的，AI可能会开始“胡思乱想”。


    ![](Images/img_00282.jpg)


    图12-14 `GPT-4o`回答“9.9和9.11哪个大”的问题


    我们可以通过OpenAI的`Tokenizer`来看一下`GPT-4o`的处理过程（如图12-15所示）：9和小数点分别被分配为“24”“13”，小数点后的9同样也是“24”，而11被分配为“994”，所以大模型会认为9.11更大。


    ![](Images/img_00283.jpg)


    图12-15 使用OpenAI的`Tokenizer`查看`GPT-4o`的处理过程


    造成这个问题的主要原因有以下几个方面。


    （1）顺序处理的局限性


    “接龙特性”的局限，使得AI Agent在处理复杂的数学计算时效率低下。大多数现有的语言模型（如`GPT-4`）主要设计用于处理自然语言，它们采用顺序处理的方式。还记得我们在第一部分提到的大模型的本质是“词语接龙”吗？这种设计虽然适合处理连续的文本，但在数学计算中，往往需要多个步骤的中间结果和符号操作，而顺序处理无法有效处理这些复杂操作。


    （2）缺乏数字表达能力


    缺乏数学表达能力也是AI Agent难以处理数学问题的主要原因之一。当前的语言模型主要处理文本和标记，而不是直接处理数值。这意味着它们缺乏内置机制来准确处理和操作数字，从而在进行基本算术运算时表现不佳。例如，大模型在加、减、乘、除等简单运算中可能会出错，因为它们没有专门设计来处理这些数值操作。当然，随着Agent调用工具的能力的提高，简单的数学运算问题可以使用代码或计算器工具来解决。


    （3）训练数据的限制因素


    训练数据的局限性也限制了AI Agent在数学问题上的表现。大多数语言模型的训练数据主要是文本，其中包含的数学问题和解决方案相对较少。这种缺乏多样性和复杂性数学问题的训练数据，使得模型难以全面理解数学概念与技术，无法有效应对各种数学问题。


    （4）基于数据的依赖性


    AI高度依赖训练数据中的模式，而未真正理解问题的本质。这意味着AI的数学能力并不完全反映人类的认知过程，而是基于已有的数据集进行学习和推断。这种依赖性使得AI在面对新的或未见过的问题时，可能表现不佳。


    （5）自然语言的模糊性


    数学问题通常需要精确的表达和理解，但自然语言往往是模糊且不精确的。这种模糊性在将数学问题转换为适合语言模型处理的格式时，会导致模型生成的答案不准确或不符合逻辑。


    （6）缺少内置的错误检查机制


    当前的大多数语言模型没有内置的错误检查功能，无法在数学计算过程中识别和纠正错误。这导致模型在问题求解过程中容易出现错误，并生成不正确的答案。


    ### 12.3.2 缓解方法


    那么，这种问题如何解决？缓解方法如下。


    （1）开发特定的数学模型


    这些模型专门设计用于处理数学问题，可以更有效地进行数值表示和操作。此外，混合模型结合了语言模型和符号计算引擎（如`Mathematica`或`SymPy`），能够利用语言模型的自然语言理解能力和专门系统的数学处理能力，提高解题能力。如`FunSearch`模型已经显示出在解决经典数学难题方面的强大能力，其性能甚至超过了人类数学家。


    （2）对比增强预训练


    对比增强预训练（Contrastive Pre-training）也被证明能够有效提升模型对数学问题的理解能力。例如，`QuesCo`模型在相似性预测、概念预测和难度估计等多种教育任务中表现优异。


    （3）增加训练数据的多样性与复杂性


    在训练数据中引入更多的教材、在线数学论坛和教育资源中的问题，可以帮助模型更好地掌握数学知识与技巧。


    （4）引入思维链


    DeepMind的研究表明，通过改进思维链方法，可以使得AI在解题过程中不仅能够生成正确的答案，还能提供合理的解题步骤。这种方法有助于AI更好地理解和解释其解题过程。


    在模型设计中引入知识层次结构（knowledge hierarchy），可以帮助AI更有效地捕捉数学问题中的细微差别和相似性关系。例如，`QuesCo`模型通过引入知识层次结构，在概念预测和难度估计方面的表现优于其他基线模型。


    （5）整合错误检查机制


    在模型中加入算法，以验证中间步骤或最终解决方案的正确性，可以帮助识别和纠正计算错误，确保结果的准确性。


    这些智能体的LLM存在数学类缺陷，但作为智能体，我们可以通过引入外部工具来解决这个问题，比如数学计算类插件，或者通过调用代码来解决复杂问题。


    通过对这些方法的探索和应用，智能体在数学问题求解方面的性能有望显著提升，从而扩展其在教育、科学研究和工程等领域的应用范围。


    ## 12.4 智能体会产生幻觉


    AI Agent在生成文本时，有时会出现不准确甚至荒谬的内容，这种现象被称为“幻觉”或“胡说八道”。这并不是偶然的错误，而是非常普遍的现象。接下来，我们来看一下基于LLM的AI
    Agent到底为何会产生幻觉。


    ### 12.4.1 什么是幻觉


    大家应该都听过关于“鲁迅暴打周树人”这个网络话题。我们来看一下`GPT-3.5`的回答，这也被认为是AI“幻觉”的典型例子。


    提示词：


    鲁迅为什么会暴打周树人？


    AI输出（`GPT-3.5`）：


    鲁迅与周树人之间的冲突始于他们在文学观念和文学路线上的分歧。鲁迅认为周树人在文学上的观点和作品未能真正体现对社会现实的关注和批判精神，而更偏向于传统的文艺修辞和意境表达。尤其是在新文化运动中，鲁迅倡导文学的社会责任和革命性质，对于周树人的文风和作品风格存在较大的不满和批评。


    1926年，鲁迅在《自序》中明确批评了周树人的《故都的秋》一文，认为其作品脱离了社会现实和人民群众，批判了周树人的“偶像派”文风。这一批评引发了两人之间的激烈争论和冲突，最终导致了鲁迅在一次文学会议上对周树人进行了言语上的批评和激烈的争吵，据说甚至发生了暴力冲突。


    总体来说，鲁迅对周树人的批评主要是基于对文学社会责任和革命性的不同理解，而周树人则更注重文学的形式和意境表达，这导致了二人之间在文学路线和观念上的严重分歧和冲突。


    可以看到，不仅鲁迅和周树人这两个人物的概念出现混淆，甚至连郁达夫的文章《故都的秋》都被直接归为周树人的作品。


    这简直是在胡言乱语，也导致很多人对AI的观感是“不过如此”。其实，AI大模型胡说八道的问题有一个学名，叫“幻觉（Hallucination）”。


    AI幻觉是指AI生成看似合理连贯，但实际上与输入问题的意图不符、与常识不一致，或与现实的已知数据不相符合或无法验证的内容。


    举个例子，比如大家在逛某些社区，发现人人“年薪百万”“身高永远都是一米九”；再比如和一个自信满满的朋友聊天，他讲述的故事听起来井井有条、细节丰富，但细想却发现很多地方根本经不起推敲。


    所以总结下来，AI的“幻觉”和人的“幻觉”有些类似：


    ●不懂装懂；


    ●话题永远能够接下去，不管是否正确；


    ●自我认知不清晰。


    我们来深入探讨这个现象。AI幻觉的背后，是人工智能模型在生成文本时，没有基于对现实世界的理解或事实的核实，而是基于其所训练的庞大数据集进行推测和组合。这就像AI在编织一个虚拟的故事，虽然语句连贯，逻辑看似合理，但内容可能是凭空捏造的。


    想象一下，你有一个从来没有去过任何餐厅的朋友，他唯一了解餐厅的方式就是听别人描述各种餐厅的场景和菜单（只是从别人的言语数据中获取信息）。


    某天，你决定测试他：“嘿，能不能给我推荐一家高档餐厅，并告诉我那里的特色菜？”（就像你平时与AI交流互动一样。）


    你的朋友很认真地开始了他的推理过程：首先，他想起了大家谈论高档餐厅时提到的元素—水晶吊灯、银质餐具、意大利面、牛排。然后，他开始拼凑这些碎片。于是，他可能会给出这样一个推荐：


    “哦，你一定要去‘星光餐厅’，那里有最豪华的水晶吊灯和银质餐具，氛围非常浪漫。它们的特色菜是松露意大利面和黑胡椒牛排，简直非常美味！”


    听起来很不错，但实际上，你的朋友从来没有去过这个餐厅，他只是根据他听过的描述拼凑出了一个看似高档的餐厅和一些经典的高档菜肴。这就是所谓的“幻觉”。


    同样，AI大模型的语言生成过程也类似。AI并没有真正体验过餐厅，而是通过大量的预训练数据集和统计模型，预测出在特定上下文中最有可能出现的词语。它根据提示词和上下文不断调整，最终生成的内容可能看起来合理，但实际上可能并不准确。


    正如Yann LeCun所说：“‘幻觉’可能是大语言模型的固有特性……它们没有真实世界的经历，而这才正是语言的根基……”这句话形象地解释了为什么AI有时候会生成似是而非的内容。


    因此，当你看到AI出现“幻觉”时，可以将其视为一个从未去过餐厅却努力推荐高档餐厅的朋友。只是这个朋友不是在推荐餐厅，而是在努力生成你所需要的答案。


    ### 12.4.2 幻觉产生的原因


    在关于AI幻觉的研究论文中，幻觉一般被分为两种：信息冲突（Intrinsic Hallucination）和无中生有（Extrinsic Hallucination）。技术专家将它们形象地解释为“有源”和“无源”。


    ●信息冲突（有源）：这种情况可以理解为，某人确实听说过一些餐厅的真实信息，但他在回答时，却把这些信息混淆了。比如他听说过有餐厅提供牛排，也听说过有餐厅有现场表演，但他把这两个元素混合在一起，结果变成了“会唱歌的牛排”。大模型也是如此，输出的内容和输入的信息不符。


    ●无中生有（无源）：这种情况就像某人凭空编造了一些完全不存在的东西，比如“飞天面条”。大模型在这种情况下编造了一些与现实不符的内容，因为它无法找到确切的答案，只能凭借猜测来生成回答。


    幻觉的产生通常有两种原因：一是原始数据集存在问题，例如数据清洗不够彻底，或者数据对齐（Alignment）不到位；二是人为引诱和误导。


    （1）数据清洗不彻底和数据对齐不到位


    数据清洗：减少不良信息的来源，并增加可信信息的比例（例如增加清晰度或者标注）。想象一下，某人在学习餐厅信息时，所看的都是一些不靠谱的美食短视频，信息来源杂乱无章。这就需要进行数据清洗。比如，让某人多看看专业美食杂志，而不是只看短视频。这一过程涉及去除冗余、错误或有偏的信息，同时增加数据的清晰度。


    对齐：让大模型理解人的指令，实现人机目的统一、准确，符合人的需求。低质量的对齐类似于让某人主要依靠搞笑相声来学中文，结果他变成了一个“答非所问”的搞笑人。高质量的对齐则类似于给某人提供一套系统的学习指南，确保他能正确理解和回答问题。


    读者肯定都听过阿西莫夫大名鼎鼎的“机器人三定律”。


    “机器人三定律”是科幻作家艾萨克·阿西莫夫在其作品中为机器人设定的一套行为准则，旨在确保机器人在与人类互动时的安全性和道德性。这三条定律分别是：


    ●机器人不得伤害人类个体，或者看到人类个体将遭受危险而袖手旁观。


    ●机器人必须服从人类的命令，除非这些命令与第一定律相抵触。


    ●机器人必须保护自身的存在，但前提是这种保护不违反前两条定律。


    “机器人三定律”实际上是一种对齐机制，即通过一系列相互制约的规则来确保机器人行为的一致性和可预测性。这种对齐机制不仅有助于防止机器人因过度自主而引发潜在风险，还使得机器人能够在复杂环境中做出合理的决策。


    因此，“对齐”不仅是大模型开发和调试中的基本原则，更是确保其安全性、有效性和对人类社会有益的关键环节。通过有效的对齐技术，可以显著降低潜在风险，提高系统的整体性能和用户信任度。


    （2）人为引诱和误导

