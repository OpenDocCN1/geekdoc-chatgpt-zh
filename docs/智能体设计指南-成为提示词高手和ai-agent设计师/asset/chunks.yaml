    # 推荐序


    大语言模型（LLM）蕴藏着诸多神奇的能力，而能否将其潜力充分激发，很大程度上取决于问题（提示词）的质量，正如一场精彩绝伦的访谈不仅仅在于嘉宾的深厚底蕴，更在于采访者自身的修养与洞察力一样。然而，众所周知，撰写优质的提示词更像是一门艺术而非科学，它难以言传，更多需要意会。这无疑在一定程度上限制了大模型能力的充分发挥。


    因此，当得知几位国内顶尖的提示词专家将他们的宝贵经验凝结成一本专著时，我感到无比欣喜。我强烈推荐这本书，深信它将为那些渴望更好地驾驭大模型的读者提供极大的帮助与重要的启示。


    在这本书中，读者将一窥提示词艺术的奥秘，学习如何巧妙地设计问题，以最大限度地挖掘大模型的潜力。无论是初学者还是资深开发者，都能从中获得实用的技巧和深刻的见解，从而在实际应用中更加得心应手。


    总之，这本书不仅仅是一本技术指南，更是一本启发思维、提升能力的宝典。相信每一位认真阅读这本书并付诸实践的读者，都能在大模型的世界中找到属于自己的精彩篇章。


    袁进辉


    硅基流动（SiliconFlow）创始人


    # 自序


    GPT-4 发布以来，我们见证了人工智能（Artificial Intelligence，AI）在日常生活和工作中的迅速渗透。相应地，AI 也给我们带来一个普遍的困扰：尽管
    AI 展现了惊人的能力，许多人却常常感到无法充分驾驭这一强大工具，难以获得满意的结果。如何有效利用 AI 的能力，成为每一位 AI 使用者亟须解决的问题。


    作为一名长期从事 AI 领域研究和应用的专业人士，我有幸参与了多项重大 AI 项目的落地，并在顶级学术期刊上发表了多篇研究论文。随着 ChatGPT 等大语言模型席卷全球，我深刻感受到公众对于掌控
    AI、充分利用 AI 能力的迫切需求。正是在这样的背景下，我们团队结合多年的 AI 应用经验和对大语言模型特性的深入理解，提出了结构化提示词方法论，并建立了一个蓬勃发展的
    AI 提示词交流社区。


    通过持续积累和沉淀社区的智慧，我们构建了一个全面而系统的 AI 知识库。这个知识库不仅在整个飞书同类社区中长期位居前三，更是吸引了数十万人次的访问。在日常工作和社区运营的过程中，我们有幸接触到了各种
    AI 应用案例。令人欣喜的是，从小学生到八旬老人，各个年龄段的人都在积极学习和运用 AI 技术，并将其融入学习和工作中。


    本书的写作初衷是回答“普通人如何用好 AI”这个问题。我们希望通过分享实践经验和独到见解，为读者提供一份实用的 AI 应用指南。本书的核心内容包括两个主题：首先，我们将详细讲解如何通过精心设计的提示词来调用
    AI 的能力；其次，我们将探讨如何将 AI 能力与知识库、工具等结合，打造强大的 AI 智能体，从而充分发挥 AI 的潜力。


    在提示词编写方面，我们强调两个关键点：清晰表达意图和确保被 AI 准确理解。这就像是一位演说家准备演讲，既要明确观点，又要考虑受众的理解能力。为了降低高质量提示词的编写门槛，我们提出了结构化提示词方法论。这种方法通过标准化模板将开放性的“作文题”转变为结构化的“填空题”，并利用
    AI 本身的能力来生成提示词，有效缩小了人机理解的差距。


    掌握提示词编写技巧是构建 AI 智能体的关键。实际上，仅凭精心设计的提示词，我们就能创建出功能强大的通用 AI 智能体。目前，主流智能体平台上超过 80%的
    AI 智能体是通过提示词方式实现的。对于翻译、文案创作、编程等任务，AI 智能体的表现已经很出色了。


    为了使 AI 智能体能够运用特定领域的知识（如法律或企业内部信息），我们需要为其配备相应的知识库。此外，如果我们希望 AI 智能体具备获取实时新闻、生成多媒体内容、进行语音交互等功能，则需要为其集成相应的工具。配备了知识库和工具的
    AI 智能体如虎添翼，能够在更广泛的应用场景中发挥潜力。在本书中，我们将详细阐述 AI 智能体的各个组成部分，以及如何设计和优化 AI 智能体。


    作为作者，我深知读者群体的多样性。读者可能来自不同行业，有不同的经验背景和需求。尽管难以在一本书中满足所有人的需求，但我们会尽力从自身经验出发，系统地阐释提示词和
    AI 智能体的概念，以及如何设计和改进 AI 智能体以提升其效果。


    本书面向对 AI 感兴趣并希望有效利用 AI 的读者。无论你是 AI 领域的新手还是有经验的从业者，本书都能为你提供宝贵的洞见。如果你没有 AI 技术背景，也能通过本书的指导打造自己的
    AI 智能体。如果你已在 AI 领域积累了丰富的经验，本书的结构安排支持你根据个人需求选择性地深入阅读特定章节，以进一步拓展你的知识边界，打造高质量 AI
    智能体。


    让我们共同探索 AI 智能体的无限可能，开启一段激动人心的智能之旅！


    云中江树


    # 前言


    为何撰写本书


    在当今这个人工智能迅猛发展的时代，大语言模型（LLM）和智能体（AI Agent）正以前所未有的速度改变着人们的生活和工作方式。这场技术革命不局限于 IT
    行业，正在向人们生活的方方面面渗透，从日常交流到专业领域，从个人助理到企业决策支持系统等。然而，面对如此强大而复杂的技术，许多人感到无所适从，不知如何利用
    AI 工具来提升自己的工作效率和生活质量。


    正是在这样的背景下，我们决定撰写本书，将我们在人工智能领域多年的探索和使用经验分享给大家。我们亲历了这一轮 AI 技术浪潮的兴起和发展并积极参与其中，在这个过程中，我们深刻认识到
    AI 和 AI Agent 的巨大潜力，同时也注意到普通用户在使用这些技术时面临的挑战。我们希望通过本书为读者搭建一座桥梁，将 AI 技术和实际应用场景连接起来，使更多人能轻松掌握
    AI 工具的使用方法。


    本书的写作目的主要有以下几点：


    1）系统地介绍大语言模型的提示词工程以及 AI Agent 的基本概念和设计方法论。许多用户在使用 ChatGPT 等 AI 工具时，常常感到困惑：为什么有时候能得到满意的回答，有时候却答非所问？通过本书，读者将学习如何构建有效的
    AI 提示词，以及如何设计合理的对话流程，从而更好地驾驭 AI 工具。


    2）填补当前 AI Agent 设计和实现的知识空白。虽然已经出版了不少关于人工智能和机器学习的书籍，但很少有著作深入探讨普通人如何设计出实用的 AI Agent。本书将通过大量的案例分析，帮助读者从理论走向实践，真正掌握
    AI Agent 的设计和开发技能。


    3）比较国内外各种主流的 AI Agent 设计平台，如 GPT Store、Coze、智谱清言等。每个平台都有其独特的优势和适用场景，通过全面的对比，读者可以根据自己的需求选择最合适的工具，打造自己的
    AI Agent，解决实际问题。


    4）探讨 AI 技术在多个行业中的应用前景。通过介绍不同领域的 AI Agent 案例，如翻译、写作、阅读等，帮助读者了解 AI 在各类场景下的作用，并激发读者将
    AI Agent 应用到工作中的灵感。


    5）提高读者对 AI Agent 潜在风险和伦理问题的认识。在本书中，我们将讨论 AI Agent 的局限性、可能存在的安全隐患，以及如何采取措施来防范这些风险。只有正确认识
    AI Agent 的优势和局限性，我们才能更负责任、更有效地使用这项技术。


    本书的写作源于我们对 AI 技术的热爱。我们相信，随着 AI 技术的不断发展，掌握这些技能将成为未来工作和生活中的重要竞争力。通过本书，我们希望能够为读者打开一扇通往
    AI 世界的大门，让更多人能够自信地驾驭这项改变世界的技术，并在各自的领域中创造更多的价值和可能性。


    本书主要内容


    本书全面介绍了 AI 智能体的设计和应用，从基础提示词编写技巧到高级 AI Agent 设计方法，涉及当前 AI Agent 开发的关键领域。全书分为两大部分，每部分都既有理论阐述，又有实践指导。


    第一部分聚焦于结构化提示词方法论。首先，介绍了提示词编写的 6 种基本方法，包括角色扮演法、细节法、示例法、推理法、格式法和迭代法。通过这些方法，读者可以学会如何构建清晰、有效的提示词，以获得更精准的
    AI 输出。接着，深入探讨了结构化提示词的概念和应用，详细阐述了结构化思想的重要性，以及如何拆解和组织复杂的提示词，如何设计工作流以优化提示词的效果。同时，提供了一些经典的提示词模板，以帮助读者快速上手。此外，还讨论了结构化提示词的局限性和常见误区，以及它与
    AI Agent 之间的关系，为下一部分内容做好铺垫。


    第二部分深入探讨 AI Agent 的设计方法与实践。这一部分的内容更加丰富和复杂，涵盖了 AI Agent 的各个方面。在设计方法方面，首先介绍了 AI
    Agent 的基本概念、发展历史和分类，让读者对这一领域有一个全面的认识。接着，详细探讨了 AI Agent 的工作原理，包括输入处理、理解与分析、决策制定、行动执行以及反馈与学习等关键环节。此外，还介绍了
    AI Agent 的 4 大设计模式：反思、工具调用、规划和多智能体协作。


    在实践方面，首先全面介绍了当前主流的 AI Agent 设计平台，包括国内外的入门级和进阶级 AI Agent 设计平台，对比了这些 AI Agent 设计平台的特点和适用场景，并提供了平台选型建议。随后，深入讨论了设计
    AI Agent 的关键组件，如提示词（人设和回复逻辑）、插件、知识库、记忆系统和工作流等，每个组件都配有详细的说明和实践指导。


    为了使理论知识得到有效的应用，本书提供了大量实际案例和设计流程的指导，详细介绍了基于 GPT Store、智谱清言、Coze 等平台的 AI Agent 设计案例，涵盖了单智能体和多智能体系统的设计。这些案例包括
    Logo 设计大师、小红书爆款文案大师、翻译智能体、活动组织专家智能体、公文写作专家智能体等，每个案例都有详细的案例效果、设计思路、功能实现等。


    最后，讨论了 AI Agent 的局限性，探讨了为什么 AI Agent 在某些任务上表现不佳，以及如何缓解这些问题。


    通过这些丰富多样的内容，本书旨在为读者提供一个全面的 AI 智能体设计与应用指南，从理论到实践，从基础到进阶，让读者真正掌握 AI Agent 技术，并在实际工作中灵活运用
    AI Agent 技术。无论你是 AI 领域的新手还是有经验的开发者，相信都能在本书中找到有价值的信息和实用技能。


    本书读者对象


    本书适用于以下读者群体：


    ●对 AI 和大语言模型感兴趣的爱好者。


    ●希望提高工作效率的专业人士。


    ●想开发 AI 应用的开发者。


