    （2）体验预置 Bot


    当选择一个 Bot 后，会被引导到该 Bot 的配置页面。在这里，可以查看这个 Bot 的配置信息，与该 Bot 进行交互，体验它提供的能力。


    下面以 Ask Link Bot 为例，展示它如何帮助阅读和解释网页内容。


    ●打开 Coze 主页。


    ●在搜索框中输入 Ask Link，然后单击显示的 Ask Link Bot。引导至配置页面后，可以看到，配置页面分为 4 个区域，如表 5-1 所示。


