    在编写提示词的过程中，类似七言律诗、绝句、莎士比亚风格等常用的概括性描述词和名词术语，往往能更准确地表达用户意图。在模型能够理解的前提下，善用这些概括词和关键词，往往能达到“以少胜多”的效果。如果遇到模型无法准确理解的名词概念，则需在提示词中给出详细的解释和示例，帮助模型学习和理解。


    注意：


    ●细节法是笔者的总结概括。其核心在于清晰地表达和传递自己的意图，并编写清晰的提示词。首先意味着要明确自己的目标和意图，然后准确地用语言表达出来，这与人与人之间的沟通表达要求一致。


    ●编写清晰的提示词是所有提示词设计方法中最重要的一环。能够清晰地表达即可应对80%的场景，解决80%的问题。若读者感觉在这一点上有所欠缺，可以适当学习一些沟通表达的方法。


    ●清晰的语法除了自然语义的表达，还包括标点符号、标题和章节标记。这样做有助于传达意图，使输出结果更容易解析。


    ●当自己不清楚自己的需求和意图时，或者在面对自己不熟悉的领域的问题时，可以向AI提问，将问题抛给AI帮忙解决。


    ### 1.7 示例法


    对于人类来说，同一个提示词的不同表达方式区别不大，但对于大模型来说，最终得到的生成结果可能千差万别。在训练模型的数据中，不同的表达可能来自不同的文本语境并用于不同目的，最终的结果往往难以预测。


    早在2020年，Tom B.Brown等人在他们的论文“Language Models are Few-Shot Learners”中指出：Few-shot（少样本示例）学习是一种让大模型基于少量的示例快速适应新任务的方法。通过给ChatGPT提供几个示例，它可以更好地理解我们的问题，并给出更准确的答案。这就像是给模型提供了一个更明确的上下文或参考，帮助它更好地完成任务。所以，使用Few-shot的方法，大模型的回答质量和准确性都会有所提高。


    我们来看看不同的示例使用方式。


    （1）无样本提示（Zero-shot prompting）


    无样本提示的范例如下。


    **提示词：**


    请为我生成一个描述春天的句子。


    **AI输出：**


    春天的到来使得世界重新焕发生机，万物复苏，鲜花绽放，绿叶葱茏，空气中弥漫着新生的气息和生命的活力。


    （2）单样本提示（One-shot prompting）


    单样本提示只展示1条提示，示例如下。


    **提示词：**


    请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：“绿树村边合，青山郭外斜。”


    **AI输出：**


    “桃花河畔映，柳絮风中飘。”


    （3）少样本提示（Few-shot prompting）


    少样本提示展示2条及以上提示，示例如下。


    **提示词：**请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：


    “绿树村边合，青山郭外斜。”


    “欲把西湖比西子，淡妆浓抹总相宜。”


    “柳色浓烟绿，桃花淡露红。”


    **AI输出：**


    “樱花洒落繁，春绿涌田间。”


    值得注意的是，在另外一些情况下，提供示例能在一定程度上避免模型的幻觉问题。如果我们能为模型提供与当前查询相关的可信信息，那么就可以指示模型使用所提供的信息来生成答案。例如，在输入内容中补充相关知识，就可以直接要求大模型通过引用所提供文档中的段落来为生成内容添加引文（这也是检索增强生成，即RAG的思路）。注意，输出中的引用可以通过所提供文档中的字符串匹配进行验证。


    **提示词：**


    你会被提供一个用''''''符号包围的文档信息和一个问题。


    你的任务是严格使用''''''包围的文档信息来回答用户的问题，如果文档信息不足以回复用户的问题，那么就直接输出“文档信息无法回答该问题”。


