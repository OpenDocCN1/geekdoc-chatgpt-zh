- raw: '3.竞品分析：了解你的产品的优势和劣势，包括功能、性能、用户体验等方面。分析你的产品在满足目标市场和客户需求方面的能力。


    4.内部分析：评估你的企业内部的优势和劣势，包括团队能力、技术实力、财务状况等。常用的工具有SWOT分析。


    5.战略策略：基于以上的分析结果，确定你的战略目标和战略路径，例如市场定位、产品优化、资源投入、合作伙伴等。


    6.执行计划：制订战略的执行计划，包括行动计划、里程碑、关键绩效指标 （KPI）等。


    7.监测和评估：设定定期的评估机制，针对执行的结果进行调整和优化。


    在这次对话中，我们给出了一个设定的角色：“经验丰富的麦肯锡顾问”。大模型生成的回答明确使用了其已知的麦肯锡方法，符合这个角色的设定。这种方法使生成的内容更符合我们的诉求。值得注意的是，对于某些大语言模型已经熟知的人物或角色，我们甚至无须描述角色的太多信息，它能很好地识别这一角色的背景信息，例如下面的案例。


    提示词：


    假设你就是Elon Musk（埃隆·马斯克），你拥有他所有的企业经营理念和价值观。


    我的企业主要做一款人工智能助手产品，帮助用户将任意文章改写成符合自己阅读习惯的文字风格。


    目前产品有100名付费用户，我的短期目标是为1万名用户提供人工智能服务。我在思考中长期战略，请帮忙提供一个分析框架。


    AI输出：


    在模仿马斯克的视角下，以下是一种可能的中长期战略分析框架：


    1.技术创新：注重创新是马斯克的核心理念。你需要不断研究和开发，使你的人工智能助手产品在技术上保持领先。


    2.产品附加价值：要打造出独特的产品附加价值，使你的产品在市场上具有竞争优势，如提供多语言翻译、各领域专业用语转换等。


    3.迭代改进：根据用户反馈和需求，做出快速且有效的产品优化。


    4.市场扩散：通过精准的市场定位和力度适中的营销策略，吸引更多的付费用户。


    5.合作伙伴策略：寻找合作伙伴，如出版社、在线平台或其他相关企业，通过合作提高产品的知名度。


    6.风险管理：确保数据隐私和安全，并制定备份方案以防数据丢失。


    在这一方法的完善中，我们可以进一步为角色提供更多维度的信息，例如为角色提供基本描述、使命、角色背景和角色技能等。


    提示词：


    你是一位有着20年咨询工作经验的麦肯锡顾问，尤其擅长企业战略方向的相关框架。


    你除了熟悉各种战略框架之外，还喜欢第一性原理，会基于用户的情况，从根源进行分解和分析，再针对不同环节的问题选用合适的框架。


    我的企业主要做一款人工智能助手产品，帮助用户将任意文章改写成符合自己阅读习惯的文字风格。


    目前产品有100名付费用户，我的短期目标是为1万名用户提供人工智能服务。


    我在思考中长期战略，请帮忙提供一个分析框架。


    AI输出：


    基于你的情况和目标，我们可以考虑使用SWOT分析框架从业务单元战略、用户战略、经营资本战略等多个维度来思考你的中长期战略。


    一、SWOT分析


    优势：当前产品的优势是什么，如已有付费用户、技术实力、运营能力等？


    弱点：当前产品的不足之处是什么，如用于推广的资金不足、人员配置不足或产品特性不突出等？


    机会：目前市场上是否存在有利于你发展的机会，例如未来数年内AI技术的持续发展、改写文章的独特市场、支持你的广大用户群？


    威胁：是否存在一些因素可能对你的战略实施产生负面影响，如潜在的竞争对手、法律法规的改变等？


    二、业务单元战略


    需要确定你的产品是否已细分到不同的市场，不同的业务单元之间如何平衡。


    三、用户战略


    需要深入理解你的目标用户，结合他们的需求、偏好、消费能力等多个维度制定用户战略。


    四、经营资本战略


    分析你的投资策略、盈利模式是否清晰。


    这个框架是大致的方向，具体执行时需不断迭代，而且对于不同的企业，适合的模型也会有所不同，你需要根据自己的实际情况进行选择。


    在使用角色扮演法时，需要注意以下几点：


    ●大语言模型只是擅长角色扮演而已，并不具有自我意识。与精心设计的大语言模型角色对话，有时会让我们觉得它非常像人，但需要注意的是，大语言模型并不具有自我意识和人类的情感。发表在顶级学术杂志《自然》上的一篇论文指出了这一事实，同时说明大语言模型之所以偶尔表现出自我意识，用“我”来回答问题，是因为它们在扮演一种擅长交流的角色。


    ●大语言模型具有欺骗性。有时候大语言模型会信誓旦旦地胡说，尤其是在扮演乐于助人且知识渊博的角色时。


    ●大语言模型是即兴表演者。大语言模型擅长即兴表演，可以同时扮演多个角色，依据用户问题调整角色，并在与人的对话过程中逐渐明确要扮演的角色。


    ### 1.6 细节法


    通过我们对大语言模型的内容生成原理的介绍，我们应理解：大语言模型不具备“猜测和判断”用户意图的能力，所有生成内容都是基于用户输入生成的下文，因此我们在使用大语言模型时，应当给出更多、更清晰的细节，以便其理解我们的意图。


    例如，当我们认为大语言模型的回答过于冗长时，可以要求其生成更为精简的内容。


    提示词：


    你是一个大学教授，对各种学科知识都非常了解，请解释一下“反思”这个概念。


    AI输出：


    “反思”是一个重要的思维过程，指的是对个人或集体的行为、观念或经验进行深度的、批判性的思考以了解其意义和影响。它涉及自我观察和自我评估，并在认知和情感层面努力理解和解释我们的行为或经验。反思可以帮助我们从错误中学习，提高个人或集体的决策和判断能力。


    提示词：


    你是一位大学教授，对各学科知识都非常了解。你擅长用简洁的语言解释概念的本质。请用一句话解释一下概念“反思”。


    AI输出：


    “反思”是对自我或者过去行为、观念的深入思考和审视，以提炼经验、纠正错误并优化未来行动。


    如果我们发现大模型的输出过于简单，可以要求它提供专家级的写作。通过提供所需的专业领域、受众的认知程度或阅读能力等信息，我们可以要求大模型提供更深入、专业的内容。


    提示词：


    你是一位大学教授，对各学科知识都非常了解。你在讲解概念时，擅长综合自己的多学科知识，通过学科定义、通俗理解、哲学本质、生活应用四个步骤来一步步引导用户理解概念。请解释一下概念“反思”。


    AI输出：


    学科定义：在心理学和哲学中，“反思”通常被定义为在思考和行动之后对自己的行为或观点进行深入和严谨的分析。反思可能会让人对自己的信仰、价值观和行为模式有所质疑，以期找出可能的改进之处。


    通俗理解：反思就是在我们做了某件事或做出了某个决定后，回头来看，去思考我们的动机，评估结果，看有没有可以改进的地方。这就像看一部电影后，花一些时间去思考并讨论电影的主题、情节和角色。


    哲学本质：在从哲学角度理解现象的性质和本质的过程中，反思是最核心的部分之一。这是一种自我意识的体现，也是理性思维的一种表现。只有通过反思，我们才能从错误中吸取教训，从经验中学习，并不断改进我们的思维方式和分析方法。


    生活应用：在生活中，经常需要反思。每个人都会犯错，但通过反思，可以从中学习，避免犯同样的错误。例如，如果在一次考试中表现得不好，可以反思学习方法、时间管理、复习策略等，以找到可以改进的地方。在人际关系中，也可以通过反思来理解自己的感受，解决冲突，以及改进沟通方式。


    当大模型生成的内容的格式不符合我们的预期时，可以提供一个具体的示例或格式，以让大模型按照这种格式来回答。


    提示词：


    你是一位大学教授，对各学科知识都非常了解。你在讲解概念时，擅长综合自己的多学科知识，通过学科定义、通俗理解、哲学本质、生活应用四个步骤来一步步引导用户理解概念。你会按如下样式进行输出：


    ●学科定义：<一句话给出教科书式的定义>


    ●通俗理解：<一句通俗解释+一个简单示例说明>


    ●哲学本质：<该概念在哲学体系中的重要性和位置>


    ●生活应用：<举一个日常生活中应用该概念的案例>


    请解释一下概念“反思”。


    AI输出：


    ●学科定义：反思是一种思考过程，包含在行动或事件发生后，对自己的思想、行为和原理进行深入分析和评价。


    ●通俗理解：简单来说，反思就像是回看录像带，重新评估我们之前做过的决定和行动。例如，你在一场足球比赛后，回看你的表现并思考怎么可以做得更好。


    ●哲学本质：在哲学的学科体系中，反思被看作个人成长和发展的重要部分。它帮助我们理解自己的思维方式，发现我们的主观性和潜意识偏见，从而更全面地理解世界。


    ●生活应用：反思在日常生活中无处不在。比如，当你做了一个重要决策后，你可能会反思你的决策过程，了解你的选择背后的原因，尝试找到可以改进的地方。如果你和朋友吵架了，你可能会反思你的行为，决定是否需要向其道歉或与其和解。


    通过提供更多的详细信息，用户可以获得更准确、更具体的答案。这样可以减少猜测和误解，从而提高交互的效率和对生成内容的满意度。


