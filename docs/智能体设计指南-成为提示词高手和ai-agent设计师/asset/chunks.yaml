- raw: '通过这个复杂的操作执行过程，AI Agent不仅需要精确控制多个智能设备，还需要实时监控和协调各个子任务的执行。它需要灵活应对可能出现的各种情况，确保最终目标的实现。这种全面而细致的执行过程体现了AI
    Agent在复杂任务管理和智能家居控制方面的强大能力，为用户提供无缝且个性化的智能生活体验。


    行动执行是AI Agent将决策转化为具体行动的关键环节。通过自动化、机器人技术、自然语言生成和任务调度等技术，AI Agent能够高效地完成任务，提供高质量的服务。


    #### 4.1.5 反馈与学习


    AI Agent在执行任务后，需要通过反馈机制来评估任务的效果，并通过学习机制不断优化自身的能力。这一步骤类似于人类的经验积累和技能提升过程，也是确保AI
    Agent在不断变化的环境中保持高效和准确的重要手段。在这一小节中，我们将探讨AI Agent如何通过反馈与学习提升自身性能，并通过聊天机器人的例子展示这一过程。


    ##### 1.反馈机制


    反馈机制是AI Agent获取任务执行效果的重要手段。通过用户反馈、系统日志和环境数据，AI Agent可以评估自身表现，并识别潜在的问题和改进点。


    ●用户反馈：用户的评价和反馈是最直接的评估方式。例如，智能日程管理助手可以在会议结束后向用户发送一条消息：“此次会议提醒是否准确及时？”用户的回答可以帮助助手了解提醒的效果。


    ●系统日志：系统日志记录了任务执行的详细过程和结果。例如，助手可以通过分析日志数据，识别出是否按计划发送了会议提醒、日程事件是否成功创建等。


    ●环境数据：环境数据包括任务执行过程中收集的各类数据，例如会议时间、地点、参与者的反馈等。通过分析这些数据，助手可以更全面地评估任务执行效果。


    收集到反馈后，AI Agent需要进行反馈分析。这涉及数据清洗、特征提取、模式识别等技术。AI Agent需要从原始反馈中提取有价值的信息，识别行动效果与预期之间的差异。例如，在自然语言生成系统中，AI
    Agent需要分析用户对生成文本的评价，了解哪些方面需要改进。


    基于反馈分析的结果，AI Agent进行性能评估。这通常涉及预定义的评估指标和基准测试。AI Agent需要客观评估其行动的效果，识别出存在的问题和改进空间。例如，在棋类游戏AI
    Agent中，性能评估可能包括胜率和每步决策时间等指标。


    ##### 2.学习机制


    学习机制是AI Agent提升智能和适应能力的核心。在性能评估之后，AI Agent进入学习阶段，这是提升能力的关键过程。根据不同的任务和场景，学习可能采用多种方式。


    ●监督学习：监督学习是一种常见的学习方法，特别适用于有明确标准答案的任务。在这种方法中，AI Agent通过比较自己的输出与正确答案之间的差异来调整其内部模型。例如，在图像分类任务中，AI
    Agent可以通过大量已标注的图像样本不断改进其分类算法。


    ●强化学习：强化学习特别适用于连续决策问题。AI Agent通过试错来学习最优策略，并通过与环境的交互获取奖励信号，逐步优化策略。例如，助手可以通过模拟不同的日程安排方案，评估其对用户工作的影响，从而优化日程安排策略。


    ●无监督学习：无监督学习通过识别数据中的模式进行学习。例如，助理可以通过聚类分析，识别出不同类型的会议和用户偏好，从而提供更加个性化的服务。


    ●迁移学习：迁移学习是AI Agent适应新任务的重要方法。它允许AI Agent将在一个任务中学到的知识应用到相关但不完全相同的新任务中。这大大提高了学习效率，减少了对大量新数据的需求。例如，一个在英语文本分类任务中训练的模型可以通过迁移学习快速适应法语文本分类任务。


    ●元学习：元学习是一种更高层次的学习方法，它使AI Agent学会如何更有效地学习。通过元学习，AI Agent可以在面对新任务时更快地适应和学习。这在快速变化的环境中特别有用。例如，在多任务机器人系统中，元学习能帮助机器人快速掌握新的操作技能。


    在学习过程中，AI Agent需要平衡“探索”和“利用”。“探索”意味着尝试新的、未知的策略，而“利用”则是使用已知的有效策略。找到适当的平衡点对优化学习至关重要。例如，在推荐系统中，AI
    Agent需要在推荐已知用户喜欢的内容（利用）和尝试推荐新类型的内容（探索）之间取得平衡。


    学习过程中的一个关键挑战是避免过拟合。过拟合发生在 AI Agent过度适应训练数据，导致其在新数据上表现不佳。为了解决这个问题，AI Agent通常采用正则化、交叉验证等技术。例如，在自然语言处理任务中，使用
    dropout 技术可以有效防止神经网络模型过拟合。


    持续学习是一个非常重要的因素。在很多实际应用中，环境和任务是不断变化的。AI Agent需要能够在不忘记旧知识的同时学习新知识。这涉及灾难性遗忘问题的解决，可能需要使用渐进学习、知识蒸馏等技术。例如，在智能客服系统中，AI
    Agent需要能够持续学习新的产品知识和客户服务技巧，而不影响已掌握的能力。


    学习过程的最后一步是知识整合。AI Agent需要将新学到的知识与已有知识进行整合，形成一个统一的知识体系。这可能涉及知识表示、知识图谱等技术。通过有效的知识整合，AI
    Agent可以提高推理能力，增强决策的鲁棒性。例如，在医疗诊断系统中，AI Agent需要将新发现的医学知识与现有的诊断知识库进行整合，以提供更准确的诊断建议。


    ##### 案例：AI聊天机器人


    假设有一个AI聊天机器人被设计用来回答客户服务问题。在“反馈与学习”阶段，它可能会这样工作（如图4-8所示）。


    ![](Images/img_00059.jpg)


    图4-8 AI聊天机器人在“反馈与学习”阶段可能的工作


    1）收集用户反馈：每次对话结束后，系统会要求用户对机器人的表现进行评分（例如1～5星）并提供文字反馈。


    2）分析反馈数据：系统会分析这些评分和评论，识别出表现良好的对话和需要改进的对话。


    3）模式识别：通过机器学习算法，系统会识别出高评分对话的共同特征（如回答的准确性、语气的友好程度等）。


    4）调整模型：基于这些发现，系统会调整其语言模型和决策算法。例如，如果发现使用更简洁的语言获得了更高的评分，它就会相应地调整其回答风格。


    5）持续学习：这个过程会不断重复，使得系统能够随着时间的推移持续改进其性能。


    6）定期更新：开发团队可能会定期审查这些学习结果，随后对系统进行大规模的更新和优化。


    通过这个“反馈与学习”的循环，AI Agent能够不断提高其性能，更好地满足用户需求。这个过程模仿了人类通过经验学习的方式，使 AI 系统能够适应不断变化的环境和需求。


    通过输入处理、理解与分析、决策制定、行动执行、反馈与学习这一完整的工作流，AI Agent展现出强大的能力和巨大的潜力。这个过程不是简单的线性序列，而是一个复杂的、循环迭代的系统。每个阶段都紧密相连、相互影响，共同构成AI
    Agent的智能行为。


    它集中体现了人工智能领域多个分支的综合应用，包括机器学习、自然语言处理、计算机视觉、知识表示与推理等，不仅融合了传统AI的符号主义方法和现代AI的连接主义方法，还整合了认知科学、控制论等多个学科的知识。


    AI Agent的工作原理展示了人工智能的巨大应用潜力。通过不断学习和适应，AI Agent正在逐步接近人类智能的灵活性和通用性。尽管道路还很长，但 AI
    Agent无疑将继续改变我们的生活和工作方式，推动人类社会向更智能、更高效的方向发展。


    ### 4.2 AI Agent的4种设计模式


    吴恩达教授在红杉资本（Sequoia Capital）的人工智能峰会（AI Ascent）上发表了一次主题为“Agentic Reasoning”的演讲，分享了当下AI
    Agent主流的4种设计模式（如图4-9所示），包括反思、工具调用、规划和多智能体协作。


    ![](Images/img_00060.jpg)


    图4-9 AI Agent的4种设计模式


    #### 4.2.1 反思


    反思（Reflection），这个词听起来似乎很抽象，但实际上，这种思想在生活场景中随处可见。假设你在使用导航App寻找一家新开的餐厅，导航需要不断监控你的当前位置、选择的路径以及路况变化，以确保你能顺利到达目的地。它会注意到每一个红绿灯、每一条拥堵的道路，并根据实际情况及时调整路线。这种自我监控和迭代让导航App能够实时应对各种突发情况，这和模型反馈迭代具有相同的思路。


    我们可能有过这样的经历：当LLM（ChatGPT/Claude/Gemini等）给出的结果不太令人满意时，我们可以提供一些反馈，通常LLM再次输出时能够给出更好的响应。


    如果将这个反馈过程留给LLM自己执行，效果是否会更好？这就是反思。


    ##### 1.基本反思设计模式


    基本反思设计模式是一种通过自我反思和迭代改进来提高模型任务执行能力的方法（如图4-10所示）。在这种模式中，模型不仅能生成初始解决方案，还会通过多次反馈和修改，不断优化其输出。


    ![](Images/img_00061.jpg)


    图4-10 基本反思设计模式


    我们借此可以看到基本反思设计模式的常见步骤。


    1）任务定义：用户提供初始任务（例如，编写博客文章等）。


    2）初始生成：模型根据用户的任务要求生成初始解决方案（例如生成第一版文章）。


    3）自我反馈：


    其一，模型对生成的初始解决方案进行自我检查和自我评估（如文章风格、文章字数、文章中心思想等）。


    AI Agent需要对自身的行为进行评估，以判断是否达到了预期效果。就像我们在完成一项工作后，会回顾自己是否达到了目标。例如，当你在使用推荐系统浏览购物网站时，推荐系统会根据你的点击和购买记录，评估它的推荐是否符合你的兴趣。如果发现你对推荐的商品不感兴趣，它就需要调整策略，尝试推荐其他类型的商品。


    其二，模型会标识出可能存在的问题（如字数不够、文风不统一）。


    评估不仅仅是数据的简单分析，而是深度理解用户需求的过程。比如，你在流媒体平台上观看电影或电视剧时，平台会根据你的观看历史评估你的偏好。如果你最近迷上了科幻片，平台会优先推荐类似的影片。评估的过程涉及复杂的算法和数据处理，但其目标始终是提高用户满意度。


    4）迭代改进：


    模型根据自我反馈进行调整，生成改进版的解决方案。


    之后，AI Agent需要根据反馈进行调整。就像我们在发现工作中的问题后，会调整方法以提高效率。AI Agent可以根据反馈不断调整内容、改变策略，甚至学习新的技能。比如，语音助手在识别你的语音命令时，如果频繁出现错误，它就会学习你的发音习惯来提高识别准确率。


    不断重复这个过程，直到模型生成一个满意的最终解决方案（类似提示词的自我反思和迭代优化）。


    迭代改进是一个持续的过程。在实际场景中，这种调整可以体现在许多方面。例如，智能家居系统根据你的生活习惯调整照明和温度设置。如果系统发现你每天晚上10点钟睡觉，它会在9点45分自动调暗灯光，营造舒适的睡眠环境。这种持续的调整让AI系统能够更加智能地适应你的需求。


    以编写代码任务（如图4-11所示）为例，模型首先生成初始版本，然后通过多次反馈和修改生成更优化的版本。例如，初始版本代码存在错误，模型通过反馈指出错误并进行修正，最终生成一个通过所有测试的版本。


    ![](Images/img_00062.jpg)


    图4-11 吴恩达教授提及的示例（编写代码）


    ##### 2.Reflexion框架


    除了基础的反思之外，由 Shinn 等人提出的 Reflexion 框架是一种通过语言反馈和自我反思来学习的架构。基于这种架构的Agent会点评其任务结果，以生成更高质量的最终结果，但代价是执行时间更长。它主要包含以下组成部分：


    ●Actor 模型：基于大型语言模型（LLM）生成所需的文本和动作，并包含一个记忆组件（mem），提供额外的上下文信息。


    ●Evaluator模型：评估Actor模型的输出质量，并计算反馈奖励分数。它会使用不同的评估方法，如精确匹配（EM）评分和基于LLM的奖励函数。


    ●Self-Reflection模型：基于稀疏的奖励信号，生成详细的自我反思反馈，并存储在Agent的记忆组件（mem）中，以供后续决策使用。


    ●记忆组件：包括短期记忆（轨迹历史）和长期记忆（自我反思输出），为 Agent提供特定但受之前经验影响的上下文信息。


    Reflexion框架通过 Actor、Evaluator和Self-Reflection 三个核心组件，以及记忆组件的支持，实现了基于语言反馈的强化学习。


    ##### 案例：智能客服AI处理客户问题


    为了更好地理解反思在AI Agent中的应用，我们来看一个具体的示例。假设我们设计了一个智能客服AI，用于处理客户的各种咨询问题，如图4-12所示。在这个过程中，智能客服
    AI需要不断地反思其表现，以提高客户满意度。


    ![](Images/img_00063.jpg)


    图4-12 智能客服AI解决客户问题


    1）智能客服AI Agent需要记录与客户的对话，包括每次互动的细节。这些记录涵盖对话内容、客户情绪和解决问题的效率等信息。


    2）智能客服AI Agent需要评估这些记录，以判断其表现是否达到预期。如果发现客户对某些回答不满意，或者解决问题的效率不高，AI Agent需要分析原因。这可能涉及对话策略的不足、知识库的更新需求等。


    比如，一个客户多次询问同一个问题但仍未得到满意的答案，智能客服AI Agent需要识别这一问题并评估其对话策略是否存在问题。它可能发现当前的回答模式过于机械化，无法真正理解客户的问题。这时，AI
    Agent需要进行调整，包括更新知识库内容、优化对话策略，甚至是学习新的回答模式。


    3）通过不断反思和调整，智能客服AI Agent能够逐步提升其服务质量，为客户提供更满意的体验。


    下面来简单分析一下这种设计模式的优缺点。


    优点：


    ●提高准确性：通过反思自身行为和决策，发现并纠正错误，从而不断提升自身表现和效率。


    ●自适应性：通过不断地反思和调整，能够适应不同的环境和任务要求，提高适应性和灵活性。


    ●避免犯错：具有反思能力的AI Agent能够更加理性和智能地做出决策，避免盲目行动和错误判断。


    ●监督性强：能够自我监督，减少对外部监督的需求，提高自主性和独立性。


    缺点：


    ●计算成本高：实现多次迭代和反馈需要大量的计算资源与复杂算法，增加了系统的开发和维护成本。


    ●时间消耗大：反思和调整需要时间，可能会影响系统的实时性和响应速度。


    ●局限性：AI Agent的反思能力可能受到其设计和编程的限制，无法完全模拟人类的自我意识和反思能力。


    ●需要大量数据支持：为了进行有效的反思和调整，需要大量数据支持，可能会受到数据获取的限制。


    尽管还有一些缺陷，但有了反思后，AI Agent不再仅仅是执行任务，而是能够像人类专家一样，对自己的工作进行批判性思考。这种自我监督和修正的能力，不仅能让AI
    Agent在执行任务时不断提高准确性和效率，还能使其更好地适应各种复杂和动态的环境。这为我们实现更智能、更高效的人工智能系统奠定了坚实的基础。


    #### 4.2.2 工具调用


    我们都知道，人类与动物的一个显著区别在于人类对工具的使用能力。同样，如果我们需要让AI Agent更加智能，就需要让它学会使用工具。工具不仅扩展了AI Agent的能力，还能大幅提升任务完成的效率和准确性。想象一下，你在厨房里准备晚餐，拥有一套功能齐全的厨具和高效的电器，不仅能让你轻松完成各种美味佳肴，还能节省大量时间。同样，AI
    Agent在使用工具时，也能更好地完成各类复杂任务。


    工具调用（Tool Use）设计模式是一种方法，旨在让AI模型通过调用外部工具或库来增强任务执行能力。在这种模式中，模型不仅能依赖自身的知识和能力，还可以调用给定的函数，收集信息、采取行动或操作数据，利用各种外部资源完成任务，从而提高完成效率和准确性。


    那么AI模型如何调用工具呢？请看图4-13所示的两个例子（吴恩达教授在红杉讲座中使用的示例）：


    当我们去询问如Copilot这样的在线模型哪个是最好的咖啡机时，它可能会决定调用Web Search Tool（网络搜索工具）进行网络搜索，并下载一个或多个网页以获取上下文信息。


    毕竟，仅依靠预训练的数据来生成输出答案是有局限性的，而提供Web搜索工具可以让LLM做更多的事情。


    ![](Images/img_00064.jpg)


    图4-13 AI模型调用工具示例


    这时候，大模型使用特殊的字符串，例如{tool：web-search，query：coffee maker reviews}，请求调用搜索引擎。之后的处理步骤是查找字符串，调用具有相关参数的Web搜索函数，并将结果附加到输入上下文，传递回LLM。


    再比如，当我们询问：“如果我以7%的复利投资100美元，持续12年，最后会获得多少收益”，LLM可能会使用Code Execution Tool（代码执行工具），运行Python命令来计算：{tool：python-interpreter，code：100
    \* （1+0.07）\*\*12}，并得出正确的结果。通过调用工具来执行代码，AI可以处理复杂的计算任务和数据分析。这种模式使AI能够在不需要人工干预的情况下解决实际问题，提高了效率和自动化程度。


    我们借此可以看到工具调用（Tool Use）设计模式的常见步骤：


    1）任务定义：用户提供初始任务（例如，查找最好的咖啡机）。


    2）调用工具：模型根据用户的任务要求选择合适的外部工具来解决问题（比如Web搜索工具、代码执行工具等）。


    在执行任务之前，AI Agent需要识别出哪些工具可以使用，类似你在厨房准备晚餐时，需要先确认有哪些厨具和食材可供使用。对于自动驾驶汽车，它需要识别周围环境中的各种交通设施，如信号灯、道路标识和其他车辆。这些识别的过程对AI
    Agent来说至关重要，一般都是AI Agent预设的工具来执行。


    3）执行任务：模型通过调用工具执行具体任务（比如网页搜索或运行代码等）。


    AI Agent在识别出可用工具后，需要根据任务需求选择最合适的工具。这就像你在做饭时，选择合适的刀具来切菜，选择锅来煮饭。


    4）结果输出：执行完成后将生成的结果返回给用户。


    除此之外，还有适用于以下情境的工具。


    （1）分析类工具


    ●举例：代码执行（Code Execution）、数学计算软件（Wolfram）、代码解释器（Bearly Code Interpreter）。


    ●功能：这些工具有助于AI进行数据分析和计算，以提供精准的结果和洞见。


    ●设计模式：对分析工具的调用使AI能够处理多种数据分析任务，增强其在特定领域的专业能力。


    （2）研究工具


    ●举例：Search Engine（搜索引擎）、Web Browsing（网页浏览）、Wikipedia（维基百科）。


    ●功能：这些工具能帮助AI进行信息收集和知识获取，提供丰富的信息来源。


    ●设计模式：通过研究工具的调用，AI 可以获取最新和最全面的信息，丰富其知识库，增强其应答能力。'
