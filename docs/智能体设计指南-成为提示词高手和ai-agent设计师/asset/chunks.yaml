    图 11-5 活动组织专家（设置人设与回复逻辑）


    #### 5.添加节点


    完成基础配置后，我们来探讨如何添加和编排节点。如图 11-6 所示，系统提供了 3 种节点类型：Agent、Bot 和全局跳转条件。Agent 节点如图 11-4
    所示；Bot 节点代表先前配置的智能体；全局跳转条件用于实现多智能体系统间的功能切换。通过这些节点的灵活组合，可以构建出复杂而高效的活动组织流程。


