    ## 12.4.4 幻觉一定是错误吗


    在各种场景下，相信“幻觉”都被作为大模型的问题和缺陷来阐述。

    在笔者看来，机器会撒谎，尤其能将谎言编织得毫无逻辑漏洞，甚至虚构事实，这恰恰说明了机器的聪明和可怕。

    现实中，能够与人交流的人往往在社会上会更加如鱼得水，从事为他人编织“幻觉”工作的也大有人在。

    大模型仅仅是学习了人类的语言，模仿了人类的行为。人类将自身的行为解释为灵活变通，称之为智能，而将机器的类似行为解释为“幻觉”。

    存在“幻觉”恰恰是 AI 智能的表现，也是 AI 像人的表现。

    AI 的“幻觉”现象是人类幻觉的外化表现，反映了人类的心理活动，根本原因在我们自身。

    有则趣闻，OpenAI 在为 AI 起名时，没有选择像 Mary 这样拟人化的名字，而是取名为 ChatGPT，目的在于用这样一个生硬古板的名字提醒大家，这是一个机器人。

    “从某种意义上说，大语言模型的全部工作恰恰就是制造幻觉，大模型就是‘造梦机’。”这是前特斯拉人工智能总监、OpenAI 创始团队成员 Andrej Karpathy
    的原话。李继刚对于提示工程就是为大模型织梦的观点，是最贴切的比喻了，即“提示词工程师=大模型织梦师”。

    Andrej Karpathy 对大模型幻觉的看法如图 12-16 所示。

    ![](img/img_00284.jpg)

    图 12-16 Andrej Karpathy 于 2023 年 12 月 9 日发布的推文

    网上对此已经有各种解读，笔者不再赘述，读者可上网搜索英文原文，这里给出其翻译：

    关于“幻觉问题”

    每当有人问我关于 LLM 的“幻觉问题”时，我总是有些纠结。因为从某种意义上说，幻觉是 LLM 的全部工作。它们是造梦机器。

    我们用提示词来引导它们做梦。提示词启动了梦境，根据 LLM 对其训练文件的朦胧回忆，大多数情况下，梦境的结果都是有用的。

    只有当梦进入被认为与事实不符的领域时，我们才会将其称为“幻觉”。这看起来像是一个错误，但其实只是 LLM 在做它一直在做的事情。

    另一个极端是搜索引擎。它收到提示后，会逐字逐句地返回其数据库中最相似的“训练文档”。可以说，这个搜索引擎有一个“创造力问题”—它永远不会有新的回应。LLM
    有 100%的概率在做梦，存在幻觉问题。搜索引擎则是有 0%的概率在做梦，存在创造力问题。

    说了这么多，我意识到人们实际的意思是，他们不希望 LLM 助手（ChatGPT 等产品）产生幻觉。LLM 助手是一个比 LLM 本身复杂得多的系统，即使 LLM
    是它的核心。在这些系统中，减轻幻觉的方法有很多，例如使用检索增强生成（RAG）技术，通过上下文学习将梦境更牢固地锚定在真实数据中，这可能是最常见的一种方法。多个样本之间的差异、反思、验证链、激活解码的不确定性、工具调用，所有这些都是活跃而有趣的研究领域。

    总之，我知道我是个超级迂腐的人，但 LLM 不存在“幻觉”问题。幻觉不是错误，而是 LLM 最大的特点。LLM 助手存在幻觉问题，我们应该解决它。

    好了，我现在感觉好多了。

    尽管 AI Agent 在文本生成方面表现出色，但在生成准确和可靠的内容方面仍然面临诸多挑战。通过改进训练数据、引入事实验证机制、加强人类监督以及增强模型的上下文理解和逻辑推理能力，可以在一定程度上缓解这些问题，提高
    AI Agent 的整体性能和可靠性。


    ## 12.5 智能体的其他常见问题及其缓解方法


    ### 12.5.1 智能体输出文字的数量不准确


    #### 1. 问题成因

    GPT 无法精准地控制输出字数，很多时候 GPT 模型输出的内容存在字数不足问题。原因是 GPT 作为一个文字预测模型，被设计用于生成自然、信息量丰富和语义完整的文本，模型内部没有内置的机制来精确控制输出字数。

    另外，自然语言的内在复杂性也导致了模型生成的字数不准确。例如，为了清晰、准确地表达一个观点，我们需要使用更多的词语，而有时又需要减少词语。即使是人类，在一次性写作中也往往无法很好地控制字数。模型在回答问题或提供信息时，会试图生成一个完整且全面的答案，这往往会导致输出的字数过多或过少。

    尽管如此，开发者可以通过一些编程手段后处理模型的输出，以满足特定的字数限制。这就像写一段 200 字的自我介绍时，我们一次性写下的内容的字数往往会过多或过少，因此在写完之后需要再次对内容进行修改和调整，使其符合字数要求。

    对于提示词编写者而言，我们可以通过下面的一些方法来缓解输出字数不足的问题：

    ●转换字数描述单位；

    ●指定输出内容结构；

    ●多次迭代生成。


    #### 2. 缓解方法

    下面以让 GPT 输出 100 字左右的内容为例，使用上述方法尝试通过提示词让模型的输出接近 100 字。

    （1）直接描述具体字数

    首先我们尝试直接描述让模型写一篇 200 字的公式介绍，但输出结果却只有 188 字，未达到我们期望的长度。

    提示词：

    ```

    你是一个科普作家。请解释一下`E＝mc²`，长度限定在 200 字以内。

    ```

    AI 输出：

    ```

    `E=mc²`是阿尔伯特·爱因斯坦提出的质能等价理论的公式，这个公式改变了现代物理学的观念。“`E`”代表能量，“`m`”代表质量，“`c`”是光速，光速是一个非常大的常数（约为
    30 万千米/秒）。这个公式的意思是任何物体的能量（`E`）等于其质量（`m`）乘以光速（`c`）的平方。这意味着极小的质量转换可以释放出惊人的能量。这就是原子弹和核反应堆能产生巨大能量的原理，因为在这些过程中，微小的质量被转化为能量。此公式不仅解释了质量和能量的关系，也是相对论的基础之一。

    ```

    （2）拆分段落语句长度

    尽管难以做到字数精确，但我们可通过将所需长度拆分成段落或句子的长度进行控制，增加中间的可调整变量，使得模型的输出尽量接近目标字数。

    提示词：

    ```

    你是一个科普作家。请解释一下`E＝mc²`，长度限定在 8 个句子，每个句子包含 30 字左右。

    ```

    AI 输出：

    ```

    `E=mc²`是爱因斯坦的质能方程。“`E`”代表能量，“`m`”是物质的质量，“`c`”是光速，光速是一个固定的常数，约为 30 万千米/秒。方程表达了质量和能量可以相互转化的原理。基本上意味着，任何形式的能量，如热、光或电，都具有质量；任何质量都有一定的能量相对量。它也解释了为什么原子弹爆炸能产生巨大的能量，因为原子的质量在爆炸过程中被转化为能量。这就是质能守恒定律的基础，对现代物理学影响深远。

    ```

    （3）指定内容结构

    还有一种方法，即通过指定输出内容的结构，变相增加中间的可控变量，从而实现接近预期输出长度的目标。

    提示词：

    ```

    你是一个科普作家。请解释一下`E＝mc²`。

    你的输出结构为：

    ●公式解释：<2 句话描述>

    ●通俗讲解：<2 句话描述>

    ●案例理解：<2 句话举例>

    ```

    AI 输出：

    ```

    ●公式解释：`E=mc²`是爱因斯坦的质能等价原理公式，表示质量与能量之间的转换关系，其中“`E`”代表能量，“`m`”代表质量，“`c`”代表光速。

    ●通俗讲解：这个公式告诉我们质量和能量其实是同一种东西的两种表现形式，就像水能变成冰，冰也能变成水一样，质量能转化为能量，能量也可以转化为质量。

    ●案例理解：例如在核反应中，原子的一部分质量转化为了巨大的能量，这就是原子弹能产生大量能量的原因。同时，光子（一种具有能量但无质量的粒子）在某些情况下，也能转化为有质量的粒子，这也是公式`E=mc²`的具体应用。

    ```

    注意，输出内容的质量也十分重要。我们在让模型输出更长的内容的同时，也应该注意模型输出内容的质量，防止模型输出过多无意义的文本。


    ### 12.5.2 智能体输出文字的机器味道过于浓厚


    在使用大语言模型时，我们常常会遇到一个问题：AI 直接生成的内容往往显得过于正式、冗长，甚至有重复的倾向，这些特征会让文本带有明显的“机器味”。如果使用 AI
    内容检测器，这样的文本很容易被识别为 AI 生成。那么，我们如何让 AI 生成的内容更接近人类的写作风格呢？以下是一些有效的策略（篇幅原因就不展示具体效果了，感兴趣的读者可自行尝试）。


    #### 1. 模仿人类作家的风格

    我们可以提示 AI 尝试使用个人视角，通过讲故事的方式，融入情感深度和独特的声音，模仿人类作家的风格，这样能够使生成的内容更加个性化和具有吸引力。

    提示词：

    ```

    使用个人视角，通过讲故事的方式，融入情感深度，模仿人类作家的风格。

    ```


    #### 2. 句子和段落变化起伏

    我们可以提示 AI 将简洁有力的短句和较长、较复杂的长句相结合，以增强文本的节奏感。变化的句型能使文章读起来更自然，避免单调乏味。

    提示词：

    ```

    混合使用短小精悍的句子和较长、较复杂的句子，以增强节奏感。

    ```


    #### 3. 引入人性化元素

    我们可以提示 AI 在内容中加入真实生活中的例子、趣闻轶事和适度的幽默元素。这些细节能够帮助作者与读者建立更好的情感连接，使文章更有亲和力。

    提示词：

    ```

    结合现实生活中的例子、轶事，加入适度的幽默元素，让作者与读者产生共鸣。

    ```


    #### 4. 主动添加语法错误

    我们可以提示 AI 适度地在文中引入一些小错误，从而让内容看起来更像是人类所写。

    提示词：

    ```

    引入几个小错误，让读者感觉到更真实的人类写作风格。这些错误包括：

    （1）拼写错误（如“不知道的、不知道地”）；

    （2）语法错误（如缩略词中缺少撇号）；

    （3）错别字（如用“莫明棋妙”代替“莫名其妙”，用“泰裤拉”代替“太酷啦”）；

    （4）用词不当；

    （5）大小写不一致。

    错误应散布在全文中，模仿人类作者可能犯的错误，可以采用中文格式。

    ```


    #### 5. 使用更形象的描写语言

    适当地使用形容词和富有描述性的语言，可以让文本更加生动形象，从而增加阅读的趣味性。


    #### 6. 调整语言复杂度

    根据目标读者调整语言的复杂程度。例如，可以尝试用 12 岁孩子能理解的方式来解释复杂概念，同时保持内容对成年读者的吸引力。


    #### 7. 避免过度使用学术化表达

    减少使用过于正式或学术化的短语，如“值得注意的是”“此外”“因此”等。选择更直接、简单的表达方式，让文章更接近日常对话的语言风格。


    #### 8. 增加本地化元素

    如果是面向特定地区的读者，可以适当引入该地区的俚语、地标或文化元素，增加内容的亲和力和相关性。

    下面附上 10 条能使 AI 生成的内容更接近人类表达风格的提示词。

    （1）为 12 岁的孩子写作。为了他们能够理解文章内容，要提供贴近生活的信息和例子，但不要听起来很俗气，因为真正阅读这篇文章的是成年人。

    （2）请在撰写文章时避免使用正式或过于学术化的短语，如“值得注意”“此外”“因此”“就……而言”“可以认为”“必须”“这表明……”等。尽量使用自然的对话风格，听起来就像两个朋友在咖啡馆聊天。使用直接、简单的语言，选择日常对话中常用的短语。如果为了清晰或准确，必须使用正式的短语，你可以将其包括在内，但除此之外，请优先考虑使文章引人入胜、清晰明了并具有亲和力。

    （3）在撰写这篇文章时，请记住我们的客户居住在（如果适用于本地/地区企业，请说出地区名称）。如果适用，请参考当地的短语、地标、文化等。

    （4）在文章中使用缩略语、口语和平易近人的语言。

    （5）在撰写文章时，请在几个不同的地方使用我们公司的名称，即（公司名称）。读者应该清楚地知道我们就是写这篇文章的人（此处可随意加入更多与公司相关的信息）。

    （6）写作风格切忌急于求成或推销。我们希望读者知道我们公司的存在以及它能解决文章所讨论的问题，但写作风格不应带有偏见，这一点非常重要。读者应该感觉到我们和他们一样都是人，我们理解他们的问题，并力求以一种有趣、随意的方式诚实地为他们提供准确的信息。

    （7）通过生动、可想象的真实场景来阐明文章中的概念。可随意制作一些说明性的轶事，以揭示主题。在此，透明度是关键，请确保这些假设情况是作为虚构的例子，而不是作为真实发生的情况来呈现，因为我们希望与读者保持诚信。

    （8）文章的引言应明确买家的问题所在，并说明买家的背景，还应概述读者在阅读文章后会得到什么、学到什么，以及完成阅读后会得到什么回报。

    （9）改变文章段落和句子的长度。寻找机会，创造出有力、精辟的片段来表达你的观点，而在其他时候，请根据需要写出长度为 2～4 句的段落。

    （10）请记住，阅读我们这篇文章的主要角色/读者是（在此描述你的理想角色/读者。请尽量详细）。在内容适当的时候，请参考这些元素。

    减少 AI 生成内容的“机器味”是一项需要技巧和练习的任务。通过运用本节讨论的各种策略，如调整语言风格、增加人性化元素、优化句子结构等，可以显著提高 AI
    生成内容的自然度和可读性。感兴趣的读者可以在此基础上进行后续的迭代。


    ### 12.5.3 智能体长文遗忘问题


    GPT 的长文遗忘问题，是指在经过多轮对话后，GPT 遗忘前文的提示词，导致指令遵循度下降和内容生成质量下降的情况。


    #### 1. 问题成因

    出现长文遗忘问题，有以下两方面原因：


    '
