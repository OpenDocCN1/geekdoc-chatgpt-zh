    ## 1. 模型记忆限制原因


    其一，模型的输入长度有限。模型单次接收的输入文本长度是有限的，这个最大输入长度即为模型的短期记忆容量大小。当对话内容超出短期记忆容量后，`GPT`会出现遗忘问题。现在有许多文章号称打破/突破了`OpenAI`的上下文长度限制，同时对`GPT`的输入和输出进行了原理解读来为自己的方法背书。需要说明的是，从技术角度来看，应用侧是无法打破模型侧文本输入长度限制的。应用侧能做的是，通过文本总结、归纳等语义压缩方式，在同样的文本输入长度限制下让模型对上下文的理解更加全面。


    其二，模型在语义理解上的长度有限。模型除了有输入限制外，还有语义理解能力的限制。即使实现了长文阅读，也还需要进行针对性的训练调优，使模型能够有效理解长文，且具备较好的长文输出能力。`OpenAI`对`GPT`的长文理解能力进行了优化，然而即便如此，大家也能感受到，`GPT`生成的文本越长，其内容质量下降得越明显。近期有许多改进模型上下文长度的论文出现，媒体在宣传时常常宣称上下文长度问题已被解决，有过度炒作之嫌。实际上，`OpenAI`在
    2019 年的研究就能让模型通过自回归生成上万个`token`。将这么长的文本输入模型，只是实现了模型能阅读，更重要的是确保模型能够理解，并生成具有足够的可用性和长度的文本。


    上述两方面原因，其根源在于`GPT`底层所采用的注意力机制。希望研究人员能早日解决这一问题。


    ## 2. 缓解方法


    要提升模型的记忆能力，根本还在于大模型厂商。作为使用者，我们只能采用迂回的方法缓解这一问题。


    1）使用支持更长上下文的模型。在本书写作时，长文能力较好的模型是 `Kimi Chat`。`Kimi Chat`支持输入 20 万个汉字，这是目前全球大模型产品中支持上下文输入长度最长的模型，相当于`Claude
    100K`的 2.5 倍（实测约 8 万字）和`GPT-4-32K`的 8 倍（实测约 2.5 万字）。读者可自行选用长文能力较好的模型。


    2）使用`API`以支持更长的上下文输入。为了控制成本，大模型厂商在客户端中提供的上下文长度一般较短，但对于应用开发者，厂商往往会开放更长的上下文长度。有条件的用户可以使用`API`访问。


    3）拆分内容。使用总-分-总或总-分的结构拆分内容，使内容可以分段生成。然后，将生成的内容基于人工、基于规则或基于生成进行汇总并编辑成文。


    4）压缩内容。在没有严格的长度限制且更关注内容的情况下，将内容压缩使其长度符合当前模型的上下文长度，是一种可行的方法。


    缓解智能体长文遗忘问题时，需要注意以下两点：


    1）不要盲目追求模型的输出长度，内容质量同样重要。输出过长时容易出现质量下降，即使内容再长，质量过低也毫无意义。


    2）客户端用户应针对不同主题使用不同的会话，避免重复使用相同的对话造成内容堆积。在必要时新开一个对话，可以起到给`GPT`“清理缓存”的效果，类似于我们重启用了一段时间后的手机。


    * * *


    [1] `../Text/AD_00021.xhtml#w1` 涉及金融、医疗等对回答的准确性要求极高的问题，在问 AI 之后一定要反复验证和对比其回答，不要轻易采纳。


