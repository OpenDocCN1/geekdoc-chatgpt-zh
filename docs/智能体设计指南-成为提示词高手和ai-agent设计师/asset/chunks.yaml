    ![](Images/img_00251.jpg)


    图11-4 活动组织专家（Agent节点配置）


    1）Agent的基本设置。

    ●单击节点右上角的“…”图标。

    ●在弹出的菜单中，你可以修改Agent的名称并选择合适的AI模型。


    2）主界面配置。主界面提供了多种配置选项，包括：

    ●适用场景；

    ●Agent提示词；

    ●技能；

    ●用户问题建议。


    注意：带“*”的项目为必填项，其他项根据需要选填。


    3）重点配置项。在本次设置中，我们将重点关注以下3个核心配置项：

    ●节点名称；

    ●适用场景；

    ●Agent提示词。


    通过精心配置这些项目，可以确保Agent准确理解与执行指定的活动组织任务。


    #### 4.配置活动组织专家的人设与回复逻辑


    如图11-5所示，在这个界面中，我们将精心设计活动组织专家的人格特征和回复逻辑。这一步骤对于塑造专家的独特风格和确保其回应的一致性至关重要。首先，仔细构思并填写“人设”部分内容，这将定义专家的背景、专业知识和交流风格。然后填写“回复逻辑”内容，详细说明专家应如何处理各类查询和任务。完成初步设置后，你会注意到界面右上角的“Ⓐ”图标。这个智能辅助功能非常实用，只需单击它，系统就会自动分析并优化你的设置，并提供改进建议，以帮助你打造更加专业、自然的活动组织专家的提示词。


