    自动化工作流能够大大减少工作量。在能够熟练编写提示词后，可以灵活搭配使用自动和手工的各种工作流。更进一步，读者可以尝试自动化分析与评估提示词，使用提示词分析与评估类提示词实现。


    ### 2.5 经典模板


    有的读者可能会好奇：是否存在一些通用的经典模板可以套用？这里提供一些结构化模板供大家参考。


    #### 2.5.1 LangGPT 中的 Role 模板


