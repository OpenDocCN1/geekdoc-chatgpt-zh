    完成基础配置后，我们来探讨如何添加和编排节点。如图11-6所示，系统提供了3种节点类型：Agent、Bot和全局跳转条件。Agent节点如图11-4所示；Bot节点代表先前配置的智能体；全局跳转条件用于实现多智能体系统间的功能切换。通过这些节点的灵活组合，可以构建出复杂而高效的活动组织流程。


