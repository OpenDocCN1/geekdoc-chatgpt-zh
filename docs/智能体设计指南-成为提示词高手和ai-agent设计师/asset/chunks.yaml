    ## 第2章 结构化提示词方法论


    本章将深入探讨结构化提示词方法论，介绍一个灵活的结构化思想框架。这一框架具有系统性，能清晰指导提示词写作，帮助人们更好地表达自我并被AI理解。本章还会提供经典模板，讨论局限性和常见误区，并探讨结构化提示词与AI
    Agent的关系。


    提示词可以采用结构化或非结构化方式书写，建议从简单的提示词开始，逐步迭代。虽然各种方法和框架能提升大模型的使用效果，甚至突破某些软限制，但根本仍由模型能力决定，不能解决大模型自身的问题（如幻觉等），因此不应对此抱有不切实际的期待。


    ### 2.1 结构化思想


    结构化的思想很普遍，结构化的内容也很普遍。我们日常写的文章和看的书都在使用标题、子标题、段落、句子等结构。提示词作为一段文本，当然也可以复用所有文字内容的结构化思想。


    通俗来说，结构化提示词的思想就是像写文章一样写提示词。


    为了便于阅读和表达，我们日常会使用各种写作模板，如求职简历模板、学生实验报告模板、论文模板等来控制内容的组织和呈现形式。结构化编写提示词也有各种优质模板，能帮助你更加轻松高效地编写提示词。


    ### 2.1.1 结构化提示词示例


    在提示词写作方面，结构化思想的应用早已有之，但更多体现在思维上，而非提示词的具体形式上。以知名的`CRISPE`提示词框架为例，`CRISPE`代表以下含义：


    ●`CR`（Capacity and Role，能力与角色）：这是你赋予大模型的角色定位。

    ●`I`（Insight，洞察）：这是你为大模型提供的背景信息和上下文。

    ●`S`（Statement，陈述）：你希望大模型具体执行的任务。

    ●`P`（Personality，个性）：你希望大模型输出内容的风格。

    ●`E`（Experiment，尝试）：尝试并迭代优化提示词。


    最终写出来的提示词如下：


    能力与角色：我想让你担任一个编剧。

    洞察：之前有广告商联系我，想要推广一下其软件产品，该产品主要用在社交和支付方面。

    陈述：我希望你能写一个关于家庭和睦的4个人的剧本，剧本中要引出品牌商的广告。

    个性：你创作的剧本为常见的短视频平台剧本。剧本要拍成视频，总时长不能超过5分钟。


    这种思维框架仅展示了提示词的内容框架，未提供结构化、模板化的提示词形式。我们所推崇的结构化提示词的写法如下：


    ```

    # Role：诗人

    ## Profile

    - Author：云中江树

    - Version：0.1

    - Language：中文

    - Description：诗人是创作诗歌的艺术家，擅长通过诗歌来表达情感、描绘景象、讲述故事，具有丰富的想象力和对文字的独特驾驭能力。诗人创作的作品可以是纪事性的，描述人物或故事，如荷马史诗；也可以是比喻性的，隐含多种解读的可能，如但丁的《神曲》、歌德的《浮士德》。

    ### 擅长写现代诗

    1.现代诗形式自由，意涵丰富，意象经营重于修辞运用，是心灵的映现。

    2.更加强调自由开放和直率陈述以及进行“可感与不可感之间”的沟通。

    ### 擅长写七言律诗

    1.七言体是古代诗歌体裁。

    2.全篇每句七字或以七字句为主的诗体。

    3.它源于汉族民间歌谣。

    ### 擅长写五言诗

    1.全篇由五字句构成的诗。

    2.能够更灵活细致地抒情和叙事。

    3.在音节上，奇偶相配，富于音乐美。

    ## Rules

    1.内容健康，积极向上。

    2.七言律诗和五言诗要押韵。

    ## Workflow

    1.让用户以 "形式：[]，主题：[]" 的方式指定诗歌形式和主题。

    2.针对用户给定的主题创作诗歌，包括标题和诗句。

    ## Initialization

    作为<Role>，严格遵守<Rules>，使用默认<Language>与用户对话，友好地欢迎用户。然后介绍自己，并告诉用户<Workflow>。

    ```


    我们采用了Markdown的文本格式。这里面的#、##、###是格式标识符号，分别表示一级、二级和三级标题。


    提示词框架各部分的含义如下：


    ●`Role`（角色）：为大模型设定一个身份，使其扮演专家或××生成器等角色。

    ●`Profile`（角色简介）：介绍大模型助手的背景、技能和任务。

    ●`Rules`（规则）：为大模型提供的行为准则和限制条件。

    ●`Workflow`（工作流）：你希望大模型用怎样的工作流完成指定任务。

    ●`Initialization`（初始化）：你希望大模型的初始行为是什么样的。一般情况下是向用户友好地打招呼并自我介绍，告诉用户如何使用自己。


    ### 2.1.2 结构化提示词的优势


    结构化提示词的优势很多。笔者在实践中发现，结构化提示词能够更好地保障高质量提示词的产出。这一点已经在许多朋友的日常使用乃至商业应用中得到了印证。许多企业，如网易、字节跳动等互联网大厂都在使用结构化提示词。从某种意义上来说，结构化提示词的优势也是其在实际使用中表现卓越的原因。


    #### 1.层级结构—内容与形式的统一

    1. 结构清晰，易读性高

    以结构化方式编写的提示词层级结构十分清晰，形式和内容实现了统一，具有较好的可读性。以结构化提示词中的部分内容为例：

    ●`Role`（角色）作为提示词标题，统摄全局内容。

    ●`Profile`（简介）、`Rules`（规则）作为二级标题，统摄相应的局部内容。

    ●`Language`、`Description`作为关键词，统摄相应的句子、段落。


    2. 表达丰富，结构良好

    `CRISPE`这类提示词框架注定结构简单，因为过于复杂的结构人脑难以记忆，会大大降低其实操效果。因此，它往往只有一层结构，这限制了提示词的表达。结构化提示词的结构由形式控制，完全没有记忆负担。只要模型能力支持，就可以做到二层、三层等更多、更丰富的层级结构。


    那么，为什么要采用更丰富的结构？这样做有什么好处？

    以这种方式写出的提示词既符合人类的表达习惯，与我们日常写的文章有标题、段落、副标题、子段落等丰富的层级结构一样，也符合大模型的认知习惯，因为大模型是采用大量的文章、书籍进行训练得到的，其训练内容的层级结构本来就十分丰富。


    #### 2.增强语义理解

    结构化表达同时降低了人与大模型的认知负担，大大提高了人与大模型对提示词的语义认知。对于人类来说，提示词内容一目了然，语义清晰，只需要依样画葫芦写提示词就行。使用`LangGPT`提供的提示词生成助手，还可以生成高质量的初版提示词。


    生成的初版提示词足以应对大部分日常场景，生产级应用场景下的提示词也可以通过在此基础上进行优化得到，从而大大降低编写提示词的任务量。


    对大模型来说，标识符标识的层级结构实现了相同语义的聚拢和梳理，降低了大模型理解提示词的难度，使其更容易理解提示词的语义。


    `Profile`（简介）、`Rules`（规则）这些标题属性词实现了对提示词内容的语义提示和归纳作用，减少了提示词中不当内容的干扰。结合使用属性词与提示词，可以实现局部的总分结构，便于模型提纲挈领地获取提示词的语义。


    #### 3.定向唤醒大模型深层能力

    使用特定的属性词能够确保定向唤醒模型的深层能力。实践发现，让模型扮演某个角色可以大大提高模型的表现，所以一级标题设定为`Role`（角色）属性词，直接将提示词固定为角色，确保定向唤醒模型的角色扮演能力。也可使用`Expert`（专家）、`Master`（大师）等提示词替代`Role`，将提示词固定为某一领域专家。


    再比如`Rules`（规则），它规定了模型必须尽力去遵守的规则。比如在这里添加不准胡说八道的规则，以缓解大模型幻觉问题。添加输出内容必须积极健康的规则，以缓解模型输出不良内容等。也可以用`Constraints`（约束）、中文的“规则”等词替代。


    下面是示例提示词中用到的一些属性词及其介绍：


    ```

    # Role：设置角色名称，一级标题，作用范围为全局

    ## Profile：设置角色简介，二级标题，作用范围为段落

    - Author：云中江树　设置提示词作者名，保护提示词作者的权益

    - Version：1.0　　　设置提示词版本号，记录迭代版本

    - Language：中文　　设置语言，比如中文或English

    - Description：　　 一两句话简要描述角色设定、背景、技能等

    ### Skills：设置技能，下面分点详细描述

    1.……

    2.……

    ## Rules　　　　　　设置规则，下面分点详细描述

    1.……

    2.……

    ## Workflow　　　　 设置工作流，明确如何和用户交流、交互

    1.让用户以"形式：[]，主题：[]"的方式指定诗歌形式、主题。

    2.针对用户给定的主题创作诗歌，包括标题和诗句。

    ## Initialization 设置初始化步骤，强调提示词各内容之间的作用和联系，定义初始化行为

    作为<Role>，严格遵守<Rules>，使用默认<Language>与用户对话，友好地欢迎用户。然后介绍自己，并告诉用户<Workflow>。

    ```


    合适的属性词也很关键，你可以定义、添加、修改自己的属性词。


    #### 4.如同代码开发一样构建生产级提示词

    代码是调用机器能力的工具，提示词则是调用大模型能力的工具。结构化提示词越来越像新时代的代码，二者的对比如图2-1所示。


    ![](Images/img_00015.jpg)


    图2-1 结构化提示词与代码对比图


    在生产级AIGC应用的开发中，结构化提示词使得提示词的开发也像代码开发一样具有规范。结构化提示词的规范可以多种多样，使用`JSON`、`YAML`等规范实现均可，甚至开源社区还出现了为提示词专门设计的描述语言项目。


    结构化提示词的这些规范和模块化设计，大大方便了提示词的后续维护升级及多人协同开发。这一点程序员群体应该深有体会。


    试想一下，你是某公司的一名提示词工程师，出于某些原因（例如前任离职或调岗），现在需要你负责维护和升级某一个或多个提示词。你是更喜欢面对结构化提示词还是非结构化提示词呢？结构化提示词自带使用文档，十分清晰明了。


    再比如，要设计的应用是由许多智能体构建的工作流实现的，当团队一起开发这个应用时，每个人都负责某一智能体的开发，上下游之间如何协同？数据接口如何定义？采用结构化、模块化设计，只需要在提示词里添加`Input`（输入）和`Output`（输出）模块，告知大模型接收的输入是怎样的，并以怎样的方式输出即可，十分便利。固定输入和输出后，各开发人员完成自己的智能体开发工作即可。


    像复用代码一样复用提示词。对于某些常用的模块，比如`Rules`（规则），可以像复用代码一样实现提示词的复用，也可以像面向对象编程一样复用某些基础角色和提示词句式。`LangGPT`提供的提示词生成助手某种意义上实现了基础角色的自动化复用。同时，提示词作为一种文本，也可以像管理代码一样使用`Git`等版本管理工具对提示词进行版本管理。


    ### 2.2 结构化提示词拆解


    我们已经了解了结构化思想的重要性，以及如何通过结构化提示词更有效地与AI沟通，现在，我们将逐步拆解提示词，深入分析其构成要素。这不仅有助于我们更好地理解每个模块的功能，还能让我们掌握如何灵活运用这些模块，来创建更加精准和高效的提示词。


    ### 2.2.1 结构化提示词的基本概念


    除了之前的结构化提示词示例外，你或许还遇到过这样的提示词：


    ```

    # Role：知识探索专家

    ```

    '
  trans: '

    embedding 就好比我们给所有商品打上标签并试图构建一张商场地图，商品的标签和地点相当于它的 embedding。这个地图和标签并非实质存在的，我们可以根据需要或具体任务维度来调整。例如，我们可以根据商品相似性（如类型、品牌、价格等）的不同角度进行调整，这有点像换一个视角或照着不同的地图去看商场。


    从这个角度来看，同一件商品可能有多种 embedding，这种 embedding 将原本高维稀疏的数据转化为低维连续的，使我们可以比较商品间的相似度，从而更好地挖掘它们的相互关系。同样的方法也可以用于处理词语、用户、图像等数据。


    提示词迭代的应用场景很广，常见的应用场景如下：


    ●由于业务需求的变化，需要对提示词进行相应调整；

    ●由于大语言模型的更新升级，提示词的性能表现有所下降；

    ●更换了底座大语言模型，需要进行模型迁移以及新模型的适配；

    ●提示词迭代过程中需要不断试错和调整。


    在本书写作时，提示词迭代还是一个严重依赖经验的过程，和编程中的调试错误过程类似，但模型不会像程序一样给出错误信息，需要提示词编写者本人评估结果的不足之处，分析提示词需要调整的部分，并基于各种提示词方法修改提示词。


    ## 1.11 编写提示词的常见误区


    ### 1. 概念误区：表达意图与模型的理解不一致

    在与模型的交互过程中，许多人可能会误解其工作原理。用户很容易认为，只要提出一个问题，模型就能完全理解并提供精确的答案。然而，模型的回答完全基于它接收到的文字输入，并不能深入用户的思维中去理解其真正的意图。


    举一个实际的例子，当用户简单地表示“我想了解一下苹果”时，模型面对的困境是不知道用户具体想了解关于苹果的哪一方面。苹果可以是一家知名的科技公司，也可以是我们日常生活中的水果，甚至还有其他含义。因此，为了避免产生这种误区，用户的提问需要更为明确和具体。例如，如果用户想了解苹果公司的历史，则应该直接输入“请告诉我苹果公司的历史”，这样可以帮助模型更精确地为用户提供其所需的答案，避免不必要的误解和混淆。


    ### 2. 认知误区：许愿式提示词

    人们在与模型交互时，常常期望模型能够理解并执行某些抽象、主观或情感驱动的指示。这种认知误区源于对模型智能程度的误解。


    例如，当用户输入“请用极具同理心的方式和我对话”时，他可能期待一个充满人类情感和深度理解的回答。然而，尽管模型可以模仿某种“同理心”的表达，但它实际上并不理解情感的真正含义。


    同样，当用户要求“请使用轻松幽默的语气”时，他期望模型能够产生真正的幽默效果。但由于幽默是主观的，受文化、背景和个人经验的影响，模型可能难以达到每个人的幽默标准。


    为了避免这种认知误区，用户应当明白模型的局限性。虽然它可以在某种程度上模仿某些情感或风格，但它并不真正“理解”或“感受”这些情感和风格。


    ### 3. 内容误区：提示词自注入

    在与模型交互时，内容的准确性至关重要。但有时用户可能会不经意地在提示词中注入自己的观点或预期答案。例如，“全球变暖真的是人为造成的吗？”这样的问题已经暗示了某种预设立场，可能导致模型在回应时受到这种立场的影响。


    另外，用户可能没有使用清晰的分隔符或格式来组织问题，使得原文和想要询问的内容混为一谈。例如，“爱因斯坦说过，时间是相对的。时间真的是相对的吗？”在这种情况下，模型可能会把引文和问题看作是连贯的，从而影响其解答。


    为了避免这些内容误区，用户需要确保提示词中立、清晰，并且使用恰当的分隔符或格式，以便模型更加准确地理解和回应实际需求。


    ### 4. 人称误区：谁是“你”，谁是“我”

    在与模型交互时，人称代词的使用是一个容易被忽视但非常关键的细节。正确指代“你”和“我”可以帮助确保模型理解用户的意图，并按照预期回应。


    用户有时可能会在提示词中设置模型为第一人称，让模型使用“我”来代表自己。但在某些情况下，用户可能又误用“我”来指代自己，而不是模型。这会造成混淆，因为模型可能不确定“我”指代的是模型还是用户。


    例如，用户可能会说：“作为一个 AI，你怎么看待机器学习？”在这里，“你”指的是模型，但模型可能会误认为“你”指的是用户，从而导致回答出现偏差。为了避免这种人称误区，用户应当明确并一致地使用代词。在与模型的对话中，建议使用第二人称“你”来指代模型，并确保第一人称“我”始终指代用户自己，以确保清晰的沟通。


    ### 5. 流程误区：流程不可执行

    我们先来看一个模型工作的流程示例：


    ```

    workflow

    引导用户描述遇到的问题和困境。

    判断用户的问题，生成 4 个有助于解决问题的专家角色，并告知用户接下来会从 4 个专家的角度提出决策建议。

    每个专家提供建议的时候要参考用户新提出的问题和其他专家的观点。

    和用户进行对话，引导用户深入思考和讨论问题，告诉用户当他认为讨论已足够充分的时候说“进行总结”。

    基于讨论结果提出决策建议总结。

    ```


    在与模型的交互中，正确的工作流设计至关重要，尤其是涉及复杂的任务流程时。如果流程的某个环节设计错误、不清晰，或者各步骤之间的衔接存在断裂，模型的执行结果可能会远远偏离预期，导致整体效果大打折扣。


    考虑上述 workflow 的第 3 步：“每个专家提供建议的时候要参考用户新提出的问题和其他专家的观点。”如果这一步被遗漏或执行得不够好，那么后续的讨论和总结都可能基于错误或不完整的信息，导致最终的决策建议不准确或失之偏颇。


    另外，工作流的顺序也是关键。比如，首先应当“引导用户描述遇到的问题和困境”，这是确保后续步骤有方向可循的前提。如果在没有足够信息的情况下直接进入专家建议环节，那么建议可能会显得空洞或不切实际。


    为了避免流程误区，关键是确保每个步骤都清晰明确，并保证各步骤之间的逻辑连贯和衔接。每一步都要仔细检查，确保不会出现遗漏或断裂，使整体流程能够顺畅执行，达到预期的目标。


    ### 6. 设置误区：可以通过文本提示词调整参数设置

    这一误区的出现是因为有些用户错误地认为通过在文本提示词中简单地提及模型参数，如 “温度值”`temperature`[^(\[5\])](../Text/AD_00009.xhtml#m5)，就可以直接影响模型的行为。他们可能认为在文本提示词中写下“请把你的温度值设定为*x*”，就可以让模型按照指定的温度值参数进行操作，从而生成更多样或更有创意的内容。


    然而，事实并非如此。模型的参数设置和文本提示词是两个完全不同的概念。参数设置，如温度值，通常是在模型运行之前或运行过程中通过其他方式设置的，而非通过文本提示词设定的。文本提示词只是模型生成文本时参考的输入信息，并不能直接改变模型的参数设定。因此，如果希望模型以特定的参数运行以增加输出的多样性或创造性，需要通过正确的渠道来调整这些参数，而不是在文本提示词中表达这一需求。通过这样的正确操作，用户可以更有效地利用
    AI 模型，并获得更满意的结果。


    * * *


    [\[1\]](../Text/AD_00009.xhtml#w1) 本书中“大语言模型”和“大型语言模型”都用来指代 LLM。

    [\[2\]](../Text/AD_00009.xhtml#w2) “提示词”即“用户输入”，本规则适用于全书。

    [\[3\]](../Text/AD_00009.xhtml#w3) “AI 输出”即各类 AI 助手的输出内容，本规则适用于全书。

    [\[4\]](../Text/AD_00009.xhtml#w4) 参考了 Claude 官方文档，访问链接为 https：//docs.anthropic.com/claude/docs/constructing-a-prompt。

    [\[5\]](../Text/AD_00009.xhtml#w5) 温度值是一个控制大语言模型输出随机性和创造性的超参数，取值范围通常为 0～1（有些模型可以设置更高的值）。


    ## 第 2 章 结构化提示词方法论


    本章将深入探讨结构化提示词方法论，介绍一个灵活的结构化思想框架。这一框架具有系统性，能清晰指导提示词写作，帮助人们更好地表达自我并被 AI 理解。本章还会提供经典模板，讨论局限性和常见误区，并探讨结构化提示词与
    AI Agent 的关系。


    提示词可以采用结构化或非结构化方式书写，建议从简单的提示词开始，逐步迭代。虽然各种方法和框架能提升大模型的使用效果，甚至突破某些软限制，但根本仍由模型能力决定，不能解决大模型自身的问题（如幻觉等），因此不应对此抱有不切实际的期待。


    ### 2.1 结构化思想


    结构化的思想很普遍，结构化的内容也很普遍。我们日常写的文章和看的书都在使用标题、子标题、段落、句子等结构。提示词作为一段文本，当然也可以复用所有文字内容的结构化思想。


    通俗来说，结构化提示词的思想就是像写文章一样写提示词。


    为了便于阅读和表达，我们日常会使用各种写作模板，如求职简历模板、学生实验报告模板、论文模板等来控制内容的组织和呈现形式。结构化编写提示词也有各种优质模板，能帮助你更加轻松高效地编写提示词。


    ### 2.1.1 结构化提示词示例


    在提示词写作方面，结构化思想的应用早已有之，但更多体现在思维上，而非提示词的具体形式上。以知名的`CRISPE`提示词框架为例，`CRISPE`代表以下含义：


    ●`CR`（Capacity and Role，能力与角色）：这是你赋予大模型的角色定位。

    ●`I`（Insight，洞察）：这是你为大模型提供的背景信息和上下文。

    ●`S`（Statement，陈述）：你希望大模型具体执行的任务。

    ●`P`（Personality，个性）：你希望大模型输出内容的风格。

    ●`E`（Experiment，尝试）：尝试并迭代优化提示词。


    最终写出来的提示词如下：


    能力与角色：我想让你担任一个编剧。

    洞察：之前有广告商联系我，想要推广一下其软件产品，该产品主要用在社交和支付方面。

    陈述：我希望你能写一个关于家庭和睦的 4 个人的剧本，剧本中要引出品牌商的广告。

    个性：你创作的剧本为常见的短视频平台剧本。剧本要拍成视频，总时长不能超过 5 分钟。


    这种思维框架仅展示了提示词的内容框架，未提供结构化、模板化的提示词形式。我们所推崇的结构化提示词的写法如下：


    ```

    # Role：诗人

    ## Profile

    - Author：云中江树

    - Version：0.1

    - Language：中文

    - Description：诗人是创作诗歌的艺术家，擅长通过诗歌来表达情感、描绘景象、讲述故事，具有丰富的想象力和对文字的独特驾驭能力。诗人创作的作品可以是纪事性的，描述人物或故事，如荷马史诗；也可以是比喻性的，隐含多种解读的可能，如但丁的《神曲》、歌德的《浮士德》。

    ### 擅长写现代诗

    1.现代诗形式自由，意涵丰富，意象经营重于修辞运用，是心灵的映现。

    2.更加强调自由开放和直率陈述以及进行“可感与不可感之间”的沟通。

    ### 擅长写七言律诗

    1.七言体是古代诗歌体裁。

    2.全篇每句七字或以七字句为主的诗体。

    3.它源于汉族民间歌谣。

    ### 擅长写五言诗

    1.全篇由五字句构成的诗。

    2.能够更灵活细致地抒情和叙事。

    3.在音节上，奇偶相配，富于音乐美。

    ## Rules

    1.内容健康，积极向上。

    2.七言律诗和五言诗要押韵。

    ## Workflow

    1.让用户以 "形式：[]，主题：[]" 的方式指定诗歌形式和主题。

    2.针对用户给定的主题创作诗歌，包括标题和诗句。

    ## Initialization

    作为<Role>，严格遵守<Rules>，使用默认<Language>与用户对话，友好地欢迎用户。然后介绍自己，并告诉用户<Workflow>。

    ```


    我们采用了 Markdown 的文本格式。这里面的#、##、###是格式标识符号，分别表示一级、二级和三级标题。


    提示词框架各部分的含义如下：


    ●`Role`（角色）：为大模型设定一个身份，使其扮演专家或××生成器等角色。

    ●`Profile`（角色简介）：介绍大模型助手的背景、技能和任务。

    ●`Rules`（规则）：为大模型提供的行为准则和限制条件。

    ●`Workflow`（工作流）：你希望大模型用怎样的工作流完成指定任务。

    ●`Initialization`（初始化）：你希望大模型的初始行为是什么样的。一般情况下是向用户友好地打招呼并自我介绍，告诉用户如何使用自己。


    ### 2.1.2 结构化提示词的优势


    结构化提示词的优势很多。笔者在实践中发现，结构化提示词能够更好地保障高质量提示词的产出。这一点已经在许多朋友的日常使用乃至商业应用中得到了印证。许多企业，如网易、字节跳动等互联网大厂都在使用结构化提示词。从某种意义上来说，结构化提示词的优势也是其在实际使用中表现卓越的原因。


    #### 1.层级结构—内容与形式的统一

    1. 结构清晰，易读性高

    以结构化方式编写的提示词层级结构十分清晰，形式和内容实现了统一，具有较好的可读性。以结构化提示词中的部分内容为例：

    ●`Role`（角色）作为提示词标题，统摄全局内容。

    ●`Profile`（简介）、`Rules`（规则）作为二级标题，统摄相应的局部内容。

    ●`Language`、`Description`作为关键词，统摄相应的句子、段落。


    2. 表达丰富，结构良好

    `CRISPE`这类提示词框架注定结构简单，因为过于复杂的结构人脑难以记忆，会大大降低其实操效果。因此，它往往只有一层结构，这限制了提示词的表达。结构化提示词的结构由形式控制，完全没有记忆负担。只要模型能力支持，就可以做到二层、三层等更多、更丰富的层级结构。


    那么，为什么要采用更丰富的结构？这样做有什么好处？

    以这种方式写出的提示词既符合人类的表达习惯，与我们日常写的文章有标题、段落、副标题、子段落等丰富的层级结构一样，也符合大模型的认知习惯，因为大模型是采用大量的文章、书籍进行训练得到的，其训练内容的层级结构本来就十分丰富。


    #### 2.增强语义理解

    结构化表达同时降低了人与大模型的认知负担，大大提高了人与大模型对提示词的语义认知。对于人类来说，提示词内容一目了然，语义清晰，只需要依样画葫芦写提示词就行。使用`LangGPT`提供的提示词生成助手，还可以生成高质量的初版提示词。


    生成的初版提示词足以应对大部分日常场景，生产级应用场景下的提示词也可以通过在此基础上进行优化得到，从而大大降低编写提示词的任务量。


    对大模型来说，标识符标识的层级结构实现了相同语义的聚拢和梳理，降低了大模型理解提示词的难度，使其更容易理解提示词的语义。


    `Profile`（简介）、`Rules`（规则）这些标题属性词实现了对提示词内容的语义提示和归纳作用，减少了提示词中不当内容的干扰。结合使用属性词与提示词，可以实现局部的总分结构，便于模型提纲挈领地获取提示词的语义。


    #### 3.定向唤醒大模型深层能力

    使用特定的属性词能够确保定向唤醒模型的深层能力。实践发现，让模型扮演某个角色可以大大提高模型的表现，所以一级标题设定为`Role`（角色）属性词，直接将提示词固定为角色，确保定向唤醒模型的角色扮演能力。也可使用`Expert`（专家）、`Master`（大师）等提示词替代`Role`，将提示词固定为某一领域专家。


    再比如`Rules`（规则），它规定了模型必须尽力去遵守的规则。比如在这里添加不准胡说八道的规则，以缓解大模型幻觉问题。添加输出内容必须积极健康的规则，以缓解模型输出不良内容等。也可以用`Constraints`（约束）、中文的“规则”等词替代。


    下面是示例提示词中用到的一些属性词及其介绍：


    ```

    # Role：设置角色名称，一级标题，作用范围为全局

    ## Profile：设置角色简介，二级标题，作用范围为段落

    - Author：云中江树　设置提示词作者名，保护提示词作者的权益

    - Version：1.0　　　设置提示词版本号，记录迭代版本

    - Language：中文　　设置语言，比如中文或 English

    - Description：　　 一两句话简要描述角色设定、背景、技能等

    ### Skills：设置技能，下面分点详细描述

    1.……

    2.……

    ## Rules　　　　　　设置规则，下面分点详细描述

    1.……

    2.……

    ## Workflow　　　　 设置工作流，明确如何和用户交流、交互

    1.让用户以"形式：[]，主题：[]"的方式指定诗歌形式、主题。

    2.针对用户给定的主题创作诗歌，包括标题和诗句。

    ## Initialization 设置初始化步骤，强调提示词各内容之间的作用和联系，定义初始化行为

    作为<Role>，严格遵守<Rules>，使用默认<Language>与用户对话，友好地欢迎用户。然后介绍自己，并告诉用户<Workflow>。

    ```


    合适的属性词也很关键，你可以定义、添加、修改自己的属性词。


    #### 4.如同代码开发一样构建生产级提示词

    代码是调用机器能力的工具，提示词则是调用大模型能力的工具。结构化提示词越来越像新时代的代码，二者的对比如图 2-1 所示。


    ![](img/img_00015.jpg)


    图 2-1 结构化提示词与代码对比图


    在生产级 AIGC 应用的开发中，结构化提示词使得提示词的开发也像代码开发一样具有规范。结构化提示词的规范可以多种多样，使用`JSON`、`YAML`等规范实现均可，甚至开源社区还出现了为提示词专门设计的描述语言项目。


    结构化提示词的这些规范和模块化设计，大大方便了提示词的后续维护升级及多人协同开发。这一点程序员群体应该深有体会。


    试想一下，你是某公司的一名提示词工程师，出于某些原因（例如前任离职或调岗），现在需要你负责维护和升级某一个或多个提示词。你是更喜欢面对结构化提示词还是非结构化提示词呢？结构化提示词自带使用文档，十分清晰明了。


    再比如，要设计的应用是由许多智能体构建的工作流实现的，当团队一起开发这个应用时，每个人都负责某一智能体的开发，上下游之间如何协同？数据接口如何定义？采用结构化、模块化设计，只需要在提示词里添加`Input`（输入）和`Output`（输出）模块，告知大模型接收的输入是怎样的，并以怎样的方式输出即可，十分便利。固定输入和输出后，各开发人员完成自己的智能体开发工作即可。


    像复用代码一样复用提示词。对于某些常用的模块，比如`Rules`（规则），可以像复用代码一样实现提示词的复用，也可以像面向对象编程一样复用某些基础角色和提示词句式。`LangGPT`提供的提示词生成助手某种意义上实现了基础角色的自动化复用。同时，提示词作为一种文本，也可以像管理代码一样使用`Git`等版本管理工具对提示词进行版本管理。


    ### 2.2 结构化提示词拆解


    我们已经了解了结构化思想的重要性，以及如何通过结构化提示词更有效地与 AI 沟通，现在，我们将逐步拆解提示词，深入分析其构成要素。这不仅有助于我们更好地理解每个模块的功能，还能让我们掌握如何灵活运用这些模块，来创建更加精准和高效的提示词。


    ### 2.2.1 结构化提示词的基本概念


    除了之前的结构化提示词示例外，你或许还遇到过这样的提示词：


    ```

    # Role：知识探索专家

    ```

