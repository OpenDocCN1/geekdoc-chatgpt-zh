    通过上述几步操作，我们能够发现优化工作流是一个持续的过程。根据需求场景的不同，自定义调用各类组件/模块，通过不断调整和优化来满足自己的需求。同样地，我们还可以定期进行性能评估和优化，结合新的技术和方法，不断改进工作流的设计和执行策略。例如，可以引入最新的算法和工具，优化任务的执行逻辑和数据处理方式，提高系统的整体性能。


    优化工作流是确保AI Agent高效运行的重要步骤。通过模块优化和调整的持续改进，可以显著提升工作流的性能和效率。接下来将探讨工作流的调用方法，进一步完善AI
    Agent的工作流执行机制。


    #### 6.5.4 工作流的调用


    在设计和优化工作流之后，有效调用和管理这些工作流是确保AI Agent高效运行的关键。工作流的调用不仅包括启动和执行工作流，还涉及监控、管理和动态调整。


    ##### 1.调用工作流的基本步骤


    1）前往当前团队或个人的Bot页面，选择进入指定Bot。


    2）在Bot“编排”页面的“工作流”区域，单击右侧的“+”图标。


    3）在“添加工作流”对话框中的“我创建的”页面，选择自建的工作流，如图6-43所示。


    ![](Images/img_00153.jpg)


    图6-43 “添加工作流”对话框


    4）在Bot的“人设与回复逻辑”区域，引用工作流的名称来调用工作流，如图6-44所示。


    ![](Images/img_00154.jpg)


    图6-44 引用的工作流


    ##### 2.工作流调用实战


    首先来看我们在6.5.2节中设计的获取新闻列表的工作流是如何进行调用的。


    1）前往当前团队或个人的Bot页面，创建或进入指定的Bot。


    2）在Bot“编排”页面，找到“技能”区域的工作流，并在右侧单击“+”图标。


    3）在对话框左侧单击“团队工作流”，找到自建的“getNews\_tasks”工作流，并在右侧单击“添加”按钮。


    4）在Bot的“人设与回复逻辑”区域，声明Bot使用getNews\_tasks工作流处理任务。


    编写完毕后，单击“优化”按钮，让AI帮助生成结构化的回复逻辑。


    5）在Bot右侧的“预览与调试”区域，输入内容以预览 Bot 的实现效果。例如，输入“人工智能科技新闻”，如图6-45所示。


    ![](Images/img_00155.jpg)


    图6-45 调用获取新闻列表的工作流


    再比如，将处理搜索结果的工作流直接应用到Agent中，如图6-46所示。


    1）在Bot“编排”页面，找到“技能”区域的工作流，然后在右侧单击“+”图标。


    2）在对话框左侧单击“团队工作流”，找到自建的“handle\_search\_tasks”工作流，并在右侧单击“添加”按钮。


    3）在Bot的“人设与回复逻辑”区域，声明Bot使用handle\_search\_tasks 工作流处理任务。


    编写完成后，可以单击“优化”，让 AI 帮助生成结构化的回复逻辑。


    4）在Bot的右侧“预览与调试”区域，输入内容预览 Bot 实现的效果。


    ![](Images/img_00156.jpg)


    图6-46 将处理搜索结果的工作流直接应用到Agent中


    多个工作流的协调和管理也是调用过程中需要考虑的问题。在一个复杂的AI Agent系统中，可能会有多个工作流同时运行，这些工作流之间可能存在资源竞争和相互依赖。


    我们可以通过提示词来控制多个工作流的协调调用。比如，首先，调用××工作流，获取相应信息。然后，再调用××工作流，获取后续信息。


    在大模型接收到用户问题时，如果判断该问题需要调用工作流，则会从用户问题中提取关键信息，作为工作流的入参启动工作流。之后根据工作流运行后返回的参数，辅助回答用户的问题。


    因此，工作流的调用和管理是确保AI Agent高效运行的重要环节。通过有效的设计、动态调整和优化，以及多工作流的协调和管理，可以确保工作流的高效执行和系统的稳定运行。


