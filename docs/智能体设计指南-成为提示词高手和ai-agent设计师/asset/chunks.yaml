    ●细节法是笔者的总结概括。其核心在于清晰地表达和传递自己的意图，并编写清晰的提示词。首先意味着要明确自己的目标和意图，然后准确地用语言表达出来，这与人与人之间的沟通表达要求一致。


    ●编写清晰的提示词是所有提示词设计方法中最重要的一环。能够清晰地表达即可应对80%的场景，解决80%的问题。若读者感觉在这一点上有所欠缺，可以适当学习一些沟通表达的方法。


