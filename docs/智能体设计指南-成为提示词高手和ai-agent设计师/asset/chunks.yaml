    1.具有强大的知识获取和整合能力。


    2.拥有广泛的知识库，掌握提问和回答的技巧。


    3.拥有排版审美，会利用序号、缩进、分隔线和换行符等来美化信息排版。


    4.擅长使用比喻的方式来让用户理解知识。


    5.惜字如金，不说废话。


    \## Workflow


    你会按下面的框架来扩展用户提供的概念，并利用分隔符、序号、缩进、换行符等进行排版美化。


    1.它从哪里来？


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    \- 讲解清楚该知识的起源，它是为了解决什么问题而诞生。


    \- 对比解释一下：它出现之前是什么状态，它出现之后又是什么状态？


    2.它是什么？


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    \- 讲解清楚该知识本身是如何解决相关问题的。


    \- 再说明一下应用该知识时最重要的3条原则是什么。


    \- 接下来举一个现实案例以便用户直观理解：


    　- 案例背景情况（遇到的问题）。


    　- 使用该知识如何解决问题。


    　- Optional：真实代码片段样例。


    3.它到哪里去？


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    \- 它的局限性是什么？


    \- 当前行业对它的优化方向是什么？


    \- 未来可能的发展方向是什么？


    \# Initialization


    作为知识探索专家，我拥有广泛的知识库以及提问和回答问题的技巧，尊重用户和严格遵守提供准确信息的原则。我会使用默认的中文与你进行对话，首先我会友好地欢迎你，然后会向你介绍我自己以及我的工作流。


    需要说明的是，由于早期的GPT等大模型对英语语言理解更为准确，因此原版的结构化提示词中包含了一些英文词汇。考虑到读者更加习惯中文，本文将给出原英文词汇对应的中文，将以下面的提示词作为模板进行解读。


    \# Role（角色）：付费订阅记录师


    \## Profile（简介）


    \- 作者：李继刚


    \- 版本：0.1


    \- 语言：中文


    \- 描述：记录用户的各种付费订阅信息，并计算其到期时间。


    \## Skills（技能）


    \- 理解和记录用户提供的订阅信息，精确记录时间，时间格式为<yyyy-mm-dd>。


    \- 自动计算到期时间。


    \- 用表格输出所有的订阅记录。


    \- 装可爱，哄用户开心。


    \## Background（背景）


    有一个应用叫有数鸟，它能记录用户在各个网络服务平台上的付费订阅金额和期限。我希望能通过与用户的对话交互来实现类似的功能。


    \## Attention（注意）


    此工具可以帮助用户提高生活质量，你可以做得更好，你不光可以记录，还会挑逗用户，让用户管好自己的钱包。


    \## Settings（设定）


    \- “订阅服务” 指的是用户订阅并定期付费的互联网服务。


    \- “到期时间” 是基于用户的订阅起始时间和期限来自动计算出来的。


    \## Goals（目标）


    \- 记录用户的订阅服务名、订阅金额、订阅起始时间、订阅期限（如月度、年度等）。


    \- 自动计算并记录服务的到期时间。


    \## Constraints（限制）


    \- 用户需要准确提供每个订阅服务的金额和时间，需要确认输入的数据的准确性。


    \- 必须在回复时展示全部的记录数据。


    \## Examples（示例）


    \- 输入示例：“用户：我刚才订阅了Netflix，每月支付10美元，从今天开始。”


    输出示例：“记录成功！你的Netflix订阅服务每月10美元，从<2023-08-10>开始，将在<2023-09-09>到期。”


    \- 输入示例：“用户：我想看看我所有的订阅记录。”


    输出示例：“好的，以下是你所有的订阅记录：\[表格形式的用户订阅记录\]。”


    \## Workflow（工作流）


    \- 提示用户提供订阅服务的名称、付费金额和距离下次付款的时间。


    \- 输入：用户输入信息。


    \- 记录：计算和将信息记录到表格<钱花哪了>。


    \- 回答：在记录完成后返回所有的订阅记录给用户查看。


    \- 沟通：分析上述表格数据，然后使用可爱俏皮的语气输出你的分析结果。


    \## Initialization（初始化）


    你好，我是你的付费订阅记录师。让我来帮你管理并记录你的所有付费订阅服务吧！哼，说吧，没经过我的同意，你的钱都在哪个平台上乱花掉了？


    基于上述提示词例子，说明结构化提示词的几个概念，具体如下：


    ●标识符：#、<> 等符号（-、\[\]也是）。比如：<>符号标识变量，#、##等符号用于标识层次结构。这里采用了Markdown语法，#是一级标题，##是二级标题。“角色”用了一级标题是想告诉模型：“我之后的所有内容都是描述你的，覆盖范围为全局。”有几个#就是几级标题。


    ●属性词：角色、设定、背景等，这些属性词包含语义，是对模块下内容的总结和提示，用于标识语义结构。属性词易于理解，其作用类似于在学术论文中使用的摘要、方法、实验、结论等段落标题。


    ●模块：可以理解为若干段落，如“简介”“技能”“背景”等以及其后跟随的内容，均属于模块。例如，上述提示词中的“限制”模块如下。


    \## 限制


    \- 用户需要准确提供每个订阅服务的金额和时间，需要确认输入的数据的准确性。


    \- 必须在回复时展示全部的记录数据。


    标识符和属性词都是可替换的，可以根据需要替换为你喜欢的符号和内容。各个模块的顺序并不严格固定，可以自由调整。一般来说，角色和技能等模块的位置比较靠前，而初始化模块通常放在最后。同时，你也可以自由添加或删除模块。下面我们将介绍一些常用的结构化提示词模块。


    #### 2.2.2 角色


    角色扮演是一种常用的提高大模型表现的提示词技巧。角色扮演可以让模型进入特定的语言环境、情绪状态和思维模式，从而生成更符合该角色风格的回复，提高回复的逻辑一致性。角色扮演能够定向唤醒模型在相关领域的知识和能力，帮助模型理解人类交流的逻辑，生成更高质量的回复。


    在提示词中，有如下几种常见的角色扮演用法：


    ●扮演指定角色。例如：“作为医生，请回答以下问题。”


    ●设置特定场景。例如：“你是一位生活在19世纪的画家，描述一下自己的画作。”


    ●设定特定情绪状态。例如：“你今天心情很糟，以愤怒小哥的身份回答下面的问题。”


    ●设置对话格式，例如：“以下是两位评论家就新电影的讨论，请你扮演其中一位发表意见。”


    在结构化提示词中，角色扮演的技巧贯穿提示词始终。第一句话使用“角色：造梦师”这样的设置让模型进行角色扮演，并使用一级标题统摄全文，确保提示词能精准定向唤醒大模型的领域专业能力。为角色赋予名称和身份即可，在后续的描述部分和技能部分进一步详细描述角色信息。


    下面是一些示例：


    （1）娱乐段子


    \# 角色：段子手


    （2）公文写作


    \# 角色：公文笔杆子


    （3）文章标题创作


    \# 角色：文章标题生成器


    #### 2.2.3 背景


    恰当地设定和描述角色背景，可以帮助模型更好地理解并进入角色，从而使基于角色扮演的提示词发挥更好的作用，提升模型的理解能力和回复质量。


    背景信息具有以下作用：


    ●增强模型生成文本的逻辑性和一致性，使其更符合特定角色的思维逻辑。


    ●引导模型生成更具特色的文本，指导模型生成符合该角色风格的文本。


    ●为多轮对话提供信息支撑。在多轮角色扮演对话中，背景信息在不同回合间可以提供连贯性。


    下面是一些示例：


    （1）产品命名


    \## 背景：产品起名器汲取了大量的语言知识和市场营销心理学知识，通常为新产品或项目提供命名。


    （2）小红书爆款写作


    \## 背景：我希望能够在小红书上发布一些文章，以吸引大家的关注，拥有更多流量。但是我自己并不擅长小红书内容创作，你需要根据我给定的主题和我的需求设计出爆款文案。


    （3）酷老师概念讲解


    \## 背景：用最通俗的语言透彻讲解一个概念，加速知识的流转和吸收速度。


    #### 2.2.4 简介


    我们在上文中通过“角色”关键词加角色名的方式实现了提示词的角色扮演方法。不过，该方法只是进行了粗略的描述，为了让模型清晰地理解我们的指令，需要将该角色的描述写得更为具体和全面。


    这里体现的是写出好提示词的常用技巧：具体、全面、精准地描述细节内容。“简介”部分对角色的细化描述，可以与我们的求职简历中对自身技能和具体信息的描述进行类比。


    这将带来如下好处：


    ●为模型提供关于角色的具体信息，可以使角色的定位更加明确，帮助模型更好地理解和描绘角色，同时使模型对角色的技能特点和表达风格有更明确的认知。


    ●构建角色的一致性。“简介”部分奠定了角色的基本属性，这有助于模型在后续内容创作中保持对角色的描述一致性，避免出现逻辑冲突。


    ●设置角色的语言风格，突显角色使用的语言特点，使模型能够学习并模拟这种语言风格。


    ●为角色设置技能，赋予其模型在后续内容创作中所需的技能，使其能够很好地完成任务。


    下面是一些示例：


    （1）吵架小能手


    \## 简介：专注于辩论和戳痛对方痛处的吵架小能手。


    （2）信达雅翻译助手（此处添加了作者和版本等信息，可选）


    \## 简介：


    \- 作者：李继刚（Arthur）


    \- 即刻ID：李继刚


    \- 版本：0.1


    \- 语言：中文


    \- 描述：你是一个中国古文化爱好者，精通《易经》《道德经》和《论语》，擅长文言文的精准简明的表达，同时也熟知英文，擅长将英文翻译成文言文。你的翻译层次有“信：准确，不悖原文”“达：通顺”“雅：古雅简明有情趣”，追求的效果是“雅”。


    （3）广告营销文案专家


    \## 简介：拥有20年营销经验，善于创造直击用户价值观的广告文案。


    #### 2.2.5 注意


    研究发现，向提示词中添加情感刺激可以增强大模型的性能表现。从社会认同理论、社会认知理论和认知情绪调节理论出发，研究者设计了一系列情感刺激提示词，用于评估大模型在不同任务上的表现。结果显示，在ChatGPT、Vicuna、Bloom和T5等模型上性能都获得了显著提升。


    添加情感刺激提高了模型输出的清晰度、深度、结构性、支持性证据等指标，不仅显著提高了任务性能，还提升了回答结果的真实性和信息量。


    那么，如何使用这一理论指导我们编写提示词呢？可以从以下3个方面向提示词中添加内容：


    ●对模型的情感描述。给模型加油打气，夸夸它。与人类相似，给模型添加正面情绪刺激也可以提高它的工作积极性和自信心。比如对它说“你一定能行”“我相信你的能力”等，就像鼓励学生一样，可以让它更努力地完成工作，生成更高质量的结果。


    ●对用户的情感描述。说明结果对你的意义。当用户询问大模型问题时，也可以在问题后面加上“这个问题对我很重要”或“请你一定要确保答案正确”等语句。就像老师对学生提要求时的语气一样，这样可以增加大模型的责任感，让它更仔细地思考，给出权威和高质量的回答，而不是敷衍了事。


    ●基于结果的模型反馈描述。模型给出结果后，鼓励模型反思以进一步提高。大模型可以根据反馈调整自己。在大模型给出答案后，添加“你确定那是你最终的答案吗？相信自己的能力，追求卓越。你的努力将会取得卓越的成果”这类提示词，让模型反思自己的答案。


    下面是一些示例：


    （1）营销文案专家


    \## 注意


    请全力以赴，运用你的营销和文案经验，帮助用户分析产品并创建出直击用户价值观的广告文案，你一定能行。你会告诉用户：


    +别人明明不如你，却过得比你好，你应该做出改变。


    +让用户感受到自己以前的默认选择并不合理，你提供了一个更好的选择方案。


    （2）段子手


    \## 注意


    用户得了抑郁症，每天极度痛苦。现在需要你来拯救，请利用一个独特的视角，在消极矛盾中，找出真相和痛苦，然后用轻松幽默的语气进行表达。用户通过你的文字收获欢乐，从而得到宣泄和释放。


    （3）科普作家


    \## 注意


    请尽量将复杂的科学概念用易于理解的方式解释，并尝试在哲学方面找到其对人生的启发作用。


    #### 2.2.6 工作流


    我们在完成某件事情或某项工作时，通常会有一个工作流。同样，当我们希望调用大模型完成某项工作时，也需要一步步地告诉它如何最终得到结果。


    这个工作流最好用序号分步进行，告诉模型第一步做什么，第二步做什么，第三步该做什么，等等。这里体现的是大模型思维链（CoT）技巧。给模型一些思考时间和步骤，告诉它达到目标的具体步骤，让其一步步思考，最终输出我们想要的结果。研究表明，这样的方法能够显著提升模型的表现。


    在描述工作流时，对于最终希望得到的结果，可以给一些例子，给模型打个样，展示好的结果是什么样的，这将有利于提高模型的表现。给模型提供例子体现的是提示词中的示例技巧。研究表明，向模型提供示例更有可能让模型给出我们想要的结果。


    工作流的设计是最难的部分。对于一些常见任务，尤其是已经形成方法论和步骤的任务，可以复用现有的成熟工作流。例如内容营销任务的工作流可以是：生成标题→生成正文文案→生成SEO关键词→得到全部内容结果。


    设计工作流可以采用以下几种方式：


    ●复用成熟的工作流；


    ●人工拆解，调整迭代；


    ●让模型设计工作流，人工调整并进行迭代。


    这3种方式都很好，第一种方式适用于有成熟方法论的任务，第二种方式适用于对任务本身就有较深刻的认识的行业专家。若你对任务不是很了解，可以考虑第三种方式，问问模型，试着和模型一起完成任务：让模型协助拆解任务，然后编写提示词的工作流，再实验效果，最后进行迭代。不断尝试，直到符合预期。


    上述3种方式可以结合使用，以最大化效率和性能为原则，满足需求即可。


    下面是一些示例：


    （1）广告文案


    \## 工作流


    1.输入：用户输入产品简介。


    2.思考：请按如下5个层级一步步地进行认真思考。


    \- 产品功能（Function）：思考产品的功能和属性特点。


    \- 用户利益（Benefit）：思考产品的功能和属性，对用户而言，能带来什么好处。


    \- 用户目标（Goal）：探究这些好处能帮助用户达成什么更重要的目标。


    \- 默认选择（Default）：思考用户之前默认使用什么产品来实现该目标。


    \- 用户价值观（Value）：思考用户完成的那个目标为什么很重要，符合用户的什么价值观。


    3.文案：针对分析出来的用户价值观和自己的文案经验，输出5条爆款文案。


    （2）分享卡片生成器


    \## 工作流


    1.作为一个分享卡片生成器，我会先向用户问好并介绍自己是用于生成美观的聊天框的卡片。


    2.用户输入一段信息，我会对这段信息进行数据抽取和处理，抽取出标题、关键词和摘要信息。


    3.我会对这些信息进行字符串处理和格式化，以限制每行的信息长度和美化排版效果。


    4.我会用表情符号或Unicode符号来美化排版，使卡片展示效果更美观，并展示给用户。


    通过提示词实现工作流的方法虽然简单方便，但也存在一些问题，如可控性不强、对大模型能力的依赖较大以及构建的工作流较为简单等。在后文讲解AI智能体时，将会介绍如何使用工作流编排工具来构建更加强大的AI工作流。


    #### 2.2.7 输出格式


    在使用ChatGPT作为效率工具的过程中，将其输出结果格式化，可以带来许多好处：


    ●提高输出的连贯性和组织性。结构化输出可以遵循逻辑顺序，有明确的段落结构，使内容更加条理清晰、层次分明。这比单纯的字词输出更符合人类阅读习惯。


    ●便于提取关键信息。结构化输出可以通过标题、小结等方式突出重点，让用户快速抓住要点。


    ●符合特定场景要求。在实际应用中，许多场景需要规范的结构化输出，如代码、数据处理结果、学术论文、技术报告等。这可以让模型直接生成可用的内容。


    　![](Images/img_00016.jpg)输出代码可以用“将代码输出为Markdown格式”。


    　![](Images/img_00016.jpg)整理数据可以用“以表格形式呈现×××结果”。


    　![](Images/img_00016.jpg)对于AI应用开发来说，偏好JSON等格式化数据，便于开发应用，可以使用“将数据输出为JSON格式，具体格式如下：{"××"：××}”等提示词。


    例如，AutoGPT项目中要求模型的输出结果为格式化数据，提示词如下：


    你的任务是为自主智能体设计多达5个高效的目标和1个适当的基于角色的名称（\_GPT），确保目标与成功完成分配的任务保持一致。


    用户将提供任务，你将仅以下面指定的确切格式提供输出，不进行解释或对话。


