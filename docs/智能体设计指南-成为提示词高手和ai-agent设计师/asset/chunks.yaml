- raw: '（1）需求收集


    与需求提出者沟通，使用上述 SOP 的各个部分作为指导进行深入访谈，收集需求。


    1）确定目标用户群体：首先，需要明确AI Agent的目标用户是谁。例如，是普通消费者、专业人士，还是特定行业的从业者。了解目标用户的背景、需求和期望，是成功设计AI
    Agent的基础。


    2）定义AI Agent的核心功能：根据用户需求，我们需要明确AI Agent需要具备哪些核心功能。这可能包括信息检索、问题解答、任务规划、决策支持等。研究表明，清晰定义功能有助于后续的开发和优化过程。


    3）分析竞争产品和市场需求：研究现有的类似产品或服务，了解它们的优缺点，能帮助我们找到市场空白和改进方向。同时，分析市场需求可以确保我们的AI Agent具有商业价值。


    （2）文档整理


    根据所收集的信息，使用上述模板整理需求描述文档。


    1）定义 AI Agent的核心功能：根据用户需求，我们需要明确 AI Agent应具备哪些核心功能。这可能包括信息检索、问题解答、任务规划、决策支持等。研究表明，清晰定义功能有助于后续的开发和优化过程。


    2）确定使用场景：AI Agent可能在不同的场景中使用，如家庭、办公室、医疗机构等。理解具体的使用场景有助于我们设计更符合实际需求的AI Agent。


    （3）初步设计


    根据整理好的需求描述文档，选择合适的智能体平台，设计初步的提示词。


    1）确定技术可行性：在需求分析阶段，我们还需要评估实现这些功能的技术可行性。这包括考虑所需的 AI 模型、平台兼容性、软硬件要求等因素。


    2）设计合理的提示词：目前以LLM为主的AI Agent中，提示词是AI Agent成功的关键。我们要根据需求设计提示词来构建AI Agent的大脑。


    （4）邀请评审


    组织目标用户对初步设计方案进行评审，确保其满足所有需求要点。[^(\[1\])](../Text/AD_00016.xhtml#m1)


    1）需求方确认：组织需求方讨论当前方案，确认其中设计的模块都符合需求方的要求。


    2）制定性能指标：根据用户需求和使用场景，我们需要制定一系列性能指标，如响应时间、准确率、用户满意度等。这些指标将成为后续开发和测试的重要依据。


    （5）测试与反馈


    在几个预设的测试场景中测试AI Agent的效果，收集反馈，并根据反馈进行调整。


    1）实践出真知：要判定一个AI Agent是否好用，需要将其应用于实际场景中。如果能够在预设的场景中完成测试，那么这个AI Agent就是好用的。


    2）反馈调试：一个能够达到产品级别的优秀AI Agent需要根据AI模型的反馈，不断进行调整和优化。


    （6）发布与持续优化


    发布最终版本的AI Agent，并根据实际使用中收集的反馈进行持续改进。


    1）制定长期发展规划：需求分析不仅需要考虑当前需求，还应关注AI Agent的长期发展。这包括功能扩展、性能提升以及新技术整合等方面。


    2）持续迭代：当前的AI技术仍处于探索阶段，我们需要时刻关注新技术和新模型的能力，根据技术的发展不断对AI Agent进行迭代更新。


    通过以上步骤，我们能够全面分析AI Agent的需求，为后续的设计和开发奠定坚实基础。需求分析的质量直接影响AI Agent的最终效果，因此我们必须在这个阶段投入足够的时间和精力。


    ##### 案例实践：岗位职责生成助手需求分析


    根据前文的需求分析SOP示例对需求进行拆解和分析，我们得出了如下结果。


    （1）任务识别


    ●目的：通过识别用户输入信息，快速生成符合标准的岗位职责说明。


    ●受众：初级人力资源从业者（从业经验1～2年）。


    ●使用场景：刚入职的人力资源助理小王接到主管任务，任务内容为：“我们要发布销售客服岗位的招聘，请尽快帮我写一个岗位职责。”


    （2）核心元素


    ●关键角色：人力资源顾问或专家。


    ●预期输出：以主流招聘平台上同行业的岗位职责描述为内容生成标准。


    ●约束条件：应根据测试过程中发现的问题进行限制。


    （3）详细需求


    ●功能性：依据用户提供的核心信息，自动分析并生成相应的说明。


    ●交互流程：询问用户需求，随后分析并生成内容。


    （4）背景信息


    ●现有解决方案：岗位职责说明应至少包含如下信息。


    　![](Images/img_00016.jpg)岗位名称


    　![](Images/img_00016.jpg)所属行业


    　![](Images/img_00016.jpg)任职资格


    　![](Images/img_00016.jpg)职业发展


    　![](Images/img_00016.jpg)岗位职责


    ●知识基础：掌握人力资源专业知识，并具备对岗位职能的理解能力。


    （5）平台选型


    国内的一些简单智能体平台其实就能够支持本案例的需求。我们使用提示词作为AI Agent的主要驱动，这里选用“智谱清言”的智能体平台。


    在下一节，我们将探讨如何基于这些需求设计有效的提示词，以指导AI Agent的行为和响应。


    ### 7.2 提示词设计


    提示词设计是AI Agent开发过程中的关键环节，它直接影响了AI Agent的行为和性能。良好的提示词设计可以使AI Agent更准确地理解用户意图，并提供更恰当的响应。


    第一部分已经介绍了提示词相关的设计流程和技巧，这里我们简单回顾一下。


    1）明确目标：首先，我们需要基于需求分析的结果，明确每个提示词的具体目标。这可能包括信息获取、任务执行、决策支持等。清晰的目标有助于设计更有针对性的提示词。


    2）结构化提示：结构化的提示词可以显著提高AI Agent的性能。这包括：


    ●角色定义：明确AI Agent应该扮演的角色。


    ●背景信息：提供必要的上下文。


    ●具体指令：清晰陈述任务或问题。


    ●输出格式：指定期望的响应格式。


    3）使用明确和具体的语言：避免模糊或易产生歧义的表述，使用清晰、直接的语言。具体和明确的提示词可以减少AI的“幻觉”（hallucination）现象。


    4）引入约束条件：在提示词中添加适当的约束条件，可以帮助AI Agent生成更符合要求的输出。例如，指定输出的长度、风格或包含特定的内容。


    5）利用少样本学习（Few-shot learning）：通过在提示词中提供一些示例，可以帮助AI Agent更好地理解任务要求。这种方法特别适合复杂或专业的任务。


    6）迭代优化：提示词设计是一个持续优化的过程。通过不断测试和调整，我们可以逐步提升提示词的效果。


    7）考虑多轮对话：对于需要多轮交互的AI Agent，我们可以设计一系列连贯的提示词，以确保对话的流畅性和逻辑性。


    8）引入记忆机制：为AI Agent设计有效的记忆机制可以显著提升其在长对话中的表现。这可能包括关键信息的摘要、重要上下文的保留等。


    9）安全性考虑：在提示词设计中，我们需要注意避免可能导致不当或有害输出的措辞。同时，也需要设计防御机制，以应对可能的恶意提示。


    10）个性化设计：根据不同用户群体的特点，我们可以设计个性化的提示词。这种方法可以提高用户满意度和AI Agent的效果。


    11）多模态提示：随着AI技术的发展，我们可以结合文本、图像，甚至音频等多种模态的提示，以提供更丰富的上下文信息。


    12）评估和调整：使用定量和定性方法评估提示词的效果，并根据评估结果不断调整优化。


    ##### 案例实践：岗位职责生成助手（提示词设计）


    首先，我们打开智谱清言的官网，进入智能体中心（https：//chatglm.cn/main/toolsCenter），创建智能体基本信息，如图7-1所示。


