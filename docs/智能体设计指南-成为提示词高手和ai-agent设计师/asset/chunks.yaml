    构建知识库是一个系统化的过程，涉及知识收集、知识表示、知识存储、知识管理、知识验证等多个环节。通过合理的设计和实施，开发者可以构建高效、可靠的知识库，为`AI
    Agent`提供强大的知识支撑。


    ### 6.3.4 知识库的使用

    '
  trans: '

    文本生成插件可以根据用户输入生成自然语言回复，提升`Agent`的对话能力。语音识别插件使智能体能够理解语音指令，语音合成插件使其能够生成自然的语音回答，图像识别插件则使智能体能够处理和理解视觉信息，如扣子的文献搜索工具和代码执行器等。


    此外，还可以根据具体的目标场景区分不同的插件种类：


    ●网页搜索：微信搜索、头条搜索、博查 AI 搜索、知网搜索等搜索类平台。

    ●便利生活：墨迹天气、快递查询助手、猎聘、什么值得买、淘票票等生活类应用。

    ●科学与教育：arXiv、GitHub、文献搜索、掌上高考、古诗词搜索等教育类应用。

    ●娱乐类：脑洞、星座运势、人物性格生成器、游戏积分排行榜等。

    ●实用工具：代码执行器、谷歌翻译助手、在线搜书和 OCR 工具等。


    通过合理选择和组合不同种类的插件，开发者可以构建出功能丰富、性能优越的智能体。在下一小节中，我们将详细探讨智能体中的插件调用方式，以进一步帮助开发者充分利用插件的优势。


    ## 6.2.4 智能体中的插件调用


    当配置好插件后，智能体是如何进行调用的呢？在搭建智能体或使用智能体的过程中，配置相关插件后，当大模型收到用户问题时，会通过`Function Calling`[^(\[1\])](../Text/AD_00015.xhtml#m1)判定用户的问题意图，判断是否需要调用该插件下的某个`API`。如果需要，模型会从用户提供的信息中提取`API`要求的入参，并调用`API`。`API`返回结果后，大模型会将`API`返回的结构化`JSON`字符串进行自然语言润色后，回复给用户，流程如图
    6-1 所示。


    ![](img/img_00103.jpg)


    图 6-1 智能体调用插件辅助回答问题的流程


    下面以腾讯元器为例，演示插件调用流程：


    1）创建一个名为“绘画小助手”的智能体，目标是根据用户的需求生成相应的图片。

    2）简单输入“你是一个绘画小助手，能够根据用户的需求，调用<腾讯混元生图>插件，生成符合要求的图片”。

    3）在插件模块中添加“腾讯混元生图”。

    4）在调试阶段输入“画一只可爱的狗狗”。这时候，大模型在获取到我们的对话之后，会进行相应的意图判别。例如，我们的诉求是绘画，它就会直接调用我们的混元生图插件，并把我们的信息通过`API`传参的形式传送给“混元生图”，之后，“混元生图”会把响应的信息以参数的形式回传。


    传入参数

    ```

    {"prompt"： "可爱的狗狗"}

    ```


    输出参数

    ```

    {"images"： [{"image_url"： "https：//cdn.yuanqi.tencent.com/hunyuan_open/default/72eba30544105eb007efc5e7d21fd6fd.png？sign=1721032903-1721032903-0-70cd13129e4f7ae8c50b74baa9ed6d80e83bc24153d183dc02da50c7ea713911"，"prompt"：
    "一个卡通风格的描绘，一只卖萌的狗狗，它手里拿着一根棍子，表情调皮，背景是一个公园，有棵大树和绿色的草坪，这是一张全身照，突出了狗狗的可爱和活泼"，"seed"：
    3956774138}]}

    ```


    5）大模型通过分析`API`的响应结果，提取其中的关键信息，然后反馈给用户（如图 6-2 所示）。


    ![](img/img_00104.jpg)


    图 6-2 腾讯元器调用插件的流程图


    上述流程即为插件在智能体平台中的应用。各家 Agent 应用平台的插件调用流程都是类似的，通过合理的调用和管理策略，开发者可以充分发挥插件的优势，构建出高效、灵活的
    AI Agent。


    ## 6.2.5 自定义插件


    在`AI Agent`开发过程中，尽管许多现成的插件可以满足大部分需求，但有时我们仍需根据特定的业务需求创建自定义插件。自定义插件能够提供独特的功能和特性，满足项目的个性化需求。接下来将详细讨论自定义插件的设计、开发、部署和管理。


    注意，自定义插件往往需要一定的开发能力，具备代码开发经验。


    这里以腾讯元器为例，演示如何一步步自定义插件。


    ### 1. 创建准备


    打开腾讯元器界面，单击“我的创建”，然后在“插件”中单击“创建插件”按钮。


    ### 2. 填写插件基本信息


    以高德天气查询插件为例，说明如何填写基本信息。


    1）打开高德天气查询插件的接口文档`https://lbs.amap.com/api/webservice/guide/api/weatherinfo`，根据接口文档中的描述，填写插件名称、描述，并用`AI`功能生成一张插件图片作为`icon`，如图
    6-3 所示。注意，请尽量仔细填写，包括插件的主要功能和使用场景。插件描述不仅会展示给用户，大语言模型也会根据描述判断是否调用插件。


    ![](img/img_00105.jpg)


    图 6-3 腾讯元器高德天气查询插件的配置界面（一）


    2）天气`API`不需要用户额外上传文件，文件支持格式可以为空。

    3）授权方式：开发者调用高德天气查询插件时需要提供`key`（请求服务权限标识），并作为请求参数一起传入。因此，这里选择`Service`方式授权，同时通过`query`传入`key`的值。

    4）权限标识的参数名为`key`，`token`是在高德平台申请到的`key`值（如表 6-1 和图 6-4 所示）。


    表 6-1 参数明细


    ![](img/img_00106.jpg)


    ![](img/img_00107.jpg)


    图 6-4 腾讯元器高德天气查询插件的配置界面（二）


    ### 3. 添加插件 API


    由于国内大部分`AI`厂商都采用`OpenAPI`的标准，因此配置逻辑都相似。


    登记插件基础信息后，我们需要在插件中添加具体的`API`信息。腾讯元器支持开发者提供`YAML`格式的`API`描述（`Schema`），描述规则遵循`OpenAPI`格式要求。然后根据描述自动解析`API`信息。成功解析`API`信息后，即可进入下一步（如图
    6-5 所示）。


    1）根据接口文档或`API`调用的代码，生成对应的`API YAML`描述`Schema`。

    2）将`YAML`描述复制到左边的输入框，单击“解析”按钮。

    3）如果`YAML`语法格式正确，平台将根据你的`YAML`描述解析出`API`信息。确认无误后，单击“下一步”按钮。


    ![](img/img_00108.jpg)


    图 6-5 插件定义的`YAML`格式


    以下是高德天气插件的`YAML`描述，感兴趣的读者可以直接使用来测试插件功能。

    ```

    openapi： "3.0.0"

    info：

    　title： "高德天气 API"

    　version： "1.0.0"

    　description： "根据用户输入的 adcode，查询目标区域当前/未来的天气情况，数据来源是中国气象局。"

    servers：

    　- url： "https： //restapi.amap.com/v3/weather"

    　description： "高德天气 API 服务地址"

    paths：

    　"/weatherInfo"：

    ...

    （完整内容可访问 https：//langgptai.feishu.cn/wiki/HDDdwnTUfia44Gk9CjCc36hYnbc 阅读。）

    ```


    现阶段，书写`YAML`是一个费时费力的过程，腾讯元器提供了“`YAML`生成小助手”工具，通过输入相应的`API`代码生成`YAML`描述。或者可以通过`Kimi`、`GPT`等其他`AI`模型，输入接口文档的网址生成相应的`YAML`描述，如图
    6-6 所示。


    ![](img/img_00109.jpg)


    图 6-6 `YAML`生成辅助工具


    ### 4. 测试 API


    腾讯元器提供了测试`API`的功能，可以单击右侧的“校验”按钮，打开“校验工具”对话框，输入`API`调用所需的参数。例如，在使用高德天气查询这个插件时，根据高德提供的城市编码表，查询得到北京市的编码是`110000`，输入后，单击“运行”按钮。如果`API`成功返回调用信息，则说明调用成功（如图
    6-7 所示）。


    ![](img/img_00110.jpg)


    图 6-7 腾讯元器插件的调试界面


    如果调用不成功，则单击“上一步”按钮，返回前面的环节进行修改后重试。


    ### 5. 发布插件


    插件下方所有的`API`测试成功后，可以对插件进行发布。


    ●发布时，可以选择将此插件设置为仅自己可用，或开放给元器平台上的所有智能体开发者使用。

    ●发布时，可以填写发布描述。建议认真填写，以便后续进行版本管理。

    ●同时，也可以设置插件的分类，方便后续智能体和工作流的开发者更好地找到你的插件。


    插件发布后，需要提供给平台进行审核（预计 24 小时内完成）。审核通过后，智能体创建者就可以使用你发布的插件。


    ### 6. 插件版本管理


    许多`AI Agent`平台在插件编辑器中提供了版本管理功能。用户可以通过单击右上角的历史图标，打开插件的“发布历史”，查看该插件的所有发布记录。单击某个历史版本，还可以预览该版本的设置信息，并选择是否回滚至此历史版本。如果选择回滚，当前版本的配置将被指定的历史版本覆盖。


    ### 7. 使用插件


    直接通过`AI Agent`平台创建时，选择插入插件，并找到自己的自定义插件即可。自定义插件的设计、开发、测试、部署和维护是一个系统化的过程。通过详细的设计、规范的开发、充分的测试，开发者可以构建出高质量的自定义插件，满足特定的业务需求。


    ## 6.3 知识库


    ### 6.3.1 什么是知识库


    #### 1. 知识库的概念


    知识库是一系列文档的集合，在一个知识库中可以包含多个文档，如图 6-8 所示。


    知识库不仅仅是一个简单的数据库，而是一个结构化、组织化的信息集合，能够存储、管理和检索大量的知识数据，帮助`AI Agent`在回答问题时提供准确和详细的答案。


    ![](img/img_00111.jpg)


    图 6-8 知识库概念图


    知识库的概念源自人工智能和知识工程领域，其核心目标是将复杂的信息和知识进行系统化的组织和管理，以便计算机程序能够高效地访问和利用这些信息。在`AI Agent`中，知识库通常包含多种类型的信息，如事实数据、概念模型、规则集、逻辑关系和上下文信息等。这些信息有多种来源，如人工编写的知识、结构化数据库、文档和互联网资源等。


    知识库的结构通常是高度组织化的，采用各种知识表示形式来描述和存储信息。这些知识表示形式包括语义网络、知识图谱、逻辑规则、框架和本体等。例如，知识图谱是一种常见的知识表示形式，通过节点和边来表示实体与实体之间的关系，形成一个结构化的网络，便于知识的存储和检索。


    在`AI Agent`的应用中，知识库的存在使得智能体能够从容应对各类复杂问题。通过将大量信息和知识系统化地存储和管理，`AI Agent`可以迅速检索和利用这些信息，为用户提供准确、详细和有针对性的回答。知识库的作用不仅限于存储静态信息，还包括支持知识推理和决策，帮助`AI
    Agent`在处理复杂任务时展现更高的智能和灵活性。


    #### 2. Agent 调取知识库


    大模型在收到用户问题后，会判断用户的问题意图是否需要查询某个知识库中的相关信息。如果需要，模型会将用户提供的信息与知识库中的文档进行相似度比对，并找出最相关的内容，辅助模型回答用户的问题，如图
    6-9 所示。


    ![](img/img_00112.jpg)


    图 6-9 腾讯元器的知识库调用流程


    在日常使用`Agent`的过程中，有很多属于我们自己的知识（比如企业内部数据集、员工信息等）。这部分知识并没有被大模型所掌握，如果需要将这类知识作为大模型的一部分，就需要借助知识库。


    这里以字节的扣子`Agent`平台为例。扣子的知识库功能不仅支持上传和存储外部知识内容，还提供了多种检索功能。该功能旨在解决大模型幻觉和专业领域知识不足的问题，从而提升大模型回复的准确率。


    知识库的设计和构建是`AI Agent`开发中的关键环节，直接影响到智能体的知识覆盖范围和知识利用效率。通过不断学习和更新知识库内容，`AI Agent`能够持续提升自身的知识水平和应对能力，保持在不断变化的应用环境中的竞争力和适应性。


    知识库是`AI Agent`的重要组成部分，通过高效的信息存储、强大的知识推理和持续的学习更新，它帮助智能体提供准确、详细且智能化的服务。在接下来的小节中，我们将深入探讨知识库的作用、如何构建知识库以及知识库的具体使用方法，为开发高效的`AI
    Agent`提供全面指导。


    ### 6.3.2 知识库的作用


    知识库在`AI Agent`的架构中发挥着至关重要的作用。它不仅是信息的存储库，更是智能体进行知识推理和决策支持的核心组件。通过知识库，`AI Agent`可以有效地管理和利用大量的知识数据，从而提高其智能化水平和服务质量。


    现在国内的智能体平台基本上都有两大核心能力：数据存储与管理和增强检索。


    （1）数据存储与管理


    国内的智能体平台大多支持各类数据的存储与管理。以扣子为例，它支持从多种数据源（如本地文档、在线数据、Notion、飞书文档等渠道）上传文本和表格数据。上传后，系统会自动将知识内容切分成多个片段（`Segment`）进行存储，并允许用户自定义内容分片规则，比如通过分段标识符或字符长度等方式进行内容分割。


    （2）增强检索


    `Agent`平台通过知识库增强了检索能力，比如扣子提供了多种检索方式来高效检索存储的内容片段。例如，全文检索可以通过关键词快速找到相关内容片段并召回。基于这些召回的内容片段，大模型将生成最终的回复内容。


    通过知识库，我们可以实现以下应用场景。


    ●语料补充：如果需要创建一个与用户交流的虚拟形象，可以在知识库中保存与该形象相关的语料。随后，`Bot`会通过向量召回最相关的语料，模仿该虚拟形象的语言风格进行回答。

    ●客服场景：将用户高频咨询的产品问题和产品使用手册等内容上传到知识库，`Bot`可以通过这些知识精准回答用户问题。同时可以定义动态知识库，`AI Agent`可以通过分析用户的提问和反馈，不断改进和扩展其知识库，提升回答质量和用户满意度。

    ●垂直场景：创建一个包含各种车型详细参数的汽车知识库。当用户查询某一车型的百公里油耗时，可通过该车型召回对应的记录，然后进一步识别出百公里油耗。

    ●产品顾问：可以将几十页的产品介绍文档导入知识库，当`Bot`使用这个知识库后，就可以拥有一个专属产品顾问 `Bot`。

    ●资讯收集：可以将常关注的资讯网站或在线论文导入知识库，通过知识库的自动更新功能，让 `Bot`帮助收集最新数据。

    ●医疗顾问：一个医疗诊断`AI Agent`可以在知识库中存储大量的医学知识和病例数据。当用户提出健康问题时，系统可以迅速检索相关信息并提供专业建议。

    ●金融咨询：在一个金融咨询系统中，知识库可以包含一系列投资策略和市场分析规则，`AI Agent`可以根据用户的投资需求和市场情况进行逻辑推理，并提供个性化的投资建议。


    知识库在`AI Agent`中具有多方面的重要作用。它不仅是信息存储和检索的基础设施，更是知识推理、决策支持、学习更新和上下文理解的核心组件。通过充分利用知识库，`AI
    Agent`可以大幅提升其智能化水平和服务质量，为用户提供更准确、详细和智能的服务。


    ### 6.3.3 如何构建知识库


    构建一个高效、可靠的知识库是确保`AI Agent`能够提供准确和详细回答的关键步骤。知识库的构建过程包括知识收集、知识表示、知识存储和知识管理等多个环节。下面将以扣子平台为例，教大家如何去构建知识库内容。


    下面以智能体“`AI`四级英语导师”为例展示如何构建四级英语导师的知识库。


    #### 1. 开始创建知识库


    打开扣子官网首页，依次单击“个人空间”→“知识库”→“创建知识库”选项。


    #### 2. 上传知识内容


    选择要上传的知识类型和上传方式，然后对上传的内容进行分片。合理的内容分片可以提高召回内容的相关性，从而提升大模型回复问题的准确性。


    在上传知识前，建议先了解不同类型知识的使用场景和导入方式（如表 6-2 所示），以便更好地管理知识内容。对此感兴趣的读者可以参阅扣子的官方文档介绍，这里不再详细赘述。


    表 6-2 扣子官方知识库说明


    ![](img/img_00113.jpg)


    ●知识类型：选择文本格式（对表格格式、照片类型等感兴趣的读者可自行探索）。

    ●名称：输入知识库名称，名称不得包含特殊字符。一个空间内的知识库名称不可重复且必须唯一。

    ●描述：输入知识库的描述。

    ●导入类型：选择一种导入方式并参考图 6-10 完成内容导入。


    ![](img/img_00114.jpg)


    图 6-10 扣子的知识库导入页面


    #### 3. 开始导入


    可以自行拖曳或者单击上传相关文档。


    #### 4. 分段设置


    在“分段设置”页面选择分段方式。扣子提供了自动和手动分段方式，分段方式说明如表 6-3 所示。内容分段可以更有效地召回与用户查询最相关的内容，从而提升回复的准确性。合理的内容分段对回复的效果有着直接影响。如果分块太大，可能包含太多不相关的信息，从而降低检索的准确性。相反，分块太小可能会丢失必要的上下文信息，导致生成的响应缺乏连贯性或深度。


    表 6-3 分段方式说明


    ![](img/img_00115.jpg)


    我们选择“自定义”模式，如图 6-11 所示。


    ![](img/img_00116.jpg)


    图 6-11 扣子的知识库分段设置


    #### 5. 查看内容分段效果


    完成内容上传与分段后，可查看内容的分段效果，如图 6-12 所示。可以注意到图中的内容分段有些瑕疵，这取决于文档本身的内容质量。


    ![](img/img_00117.jpg)


    图 6-12 扣子知识库内容的分段效果


    #### 6. 以表格格式上传知识库


    同样地，如果我们的知识库文件是表格格式，也可以选择“表格格式”上传知识库。完成数据上传后，配置数据表，然后单击“下一步”按钮，如图 6-13 所示。


    ![](img/img_00118.jpg)


    图 6-13 扣子知识库上传表格


    ●指定数据范围：通过选择数据表、表头和数据起始行来指定数据范围。

    ●确认表结构：系统已默认获取表头的列名。可以自定义修改列名，或删除某列的列名。

    ●指定语义匹配字段：选择哪个字段作为搜索匹配的语义字段。在响应用户查询时，会将用户查询内容与该字段的内容进行比较，根据相似度进行匹配。


    #### 7. 查看表结构和数据


    确认表结构和数据无误后，单击“下一步”按钮完成操作，如图 6-14 所示。


    ![](img/img_00119.jpg)


    图 6-14 扣子知识库的解析表结构和数据


    关于照片类型的知识库，感兴趣的朋友可以根据需要自行尝试。


    构建知识库是一个系统化的过程，涉及知识收集、知识表示、知识存储、知识管理、知识验证等多个环节。通过合理的设计和实施，开发者可以构建高效、可靠的知识库，为`AI
    Agent`提供强大的知识支撑。


    ### 6.3.4 知识库的使用

