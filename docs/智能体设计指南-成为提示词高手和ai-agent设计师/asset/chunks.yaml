    5）在“工作流”页面左侧，单击插件右侧的“+”图标，查找并选择Jina-WebReader插件（如图6-38所示），然后选择 read\_web\_content
    节点。该节点用于获取指定URL的内容。


    6）连接各节点，并依次配置输入和输出参数。节点连接顺序为：开始 → bingWebSearch → 代码 → read\_web\_content → 结束。各节点参数配置详情如表6-6所示。


