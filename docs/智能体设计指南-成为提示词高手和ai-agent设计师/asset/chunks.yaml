    AI 帮助优化Bot的提示词，以便大模型更好地理解。


    　![](Images/img_00016.jpg)在Skills区域为Bot配置插件、工作流和知识库等信息。


    　![](Images/img_00016.jpg)在Preview区域向Bot发送消息，测试Bot的效果。


