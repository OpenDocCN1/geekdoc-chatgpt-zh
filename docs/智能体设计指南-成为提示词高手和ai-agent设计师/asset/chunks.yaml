    （3）酷老师概念讲解\n## 背景：用最通俗的语言透彻讲解一个概念，加速知识的流转和吸收速度。\n\n#### 2.2.4 简介\n我们在上文中通过“角色”关键词加角色名的方式实现了提示词的角色扮演方法。不过，该方法只是进行了粗略的描述，为了让模型清晰地理解我们的指令，需要将该角色的描述写得更为具体和全面。\n\
