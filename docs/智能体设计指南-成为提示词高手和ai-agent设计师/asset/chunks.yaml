    - 语言：中文\n- 描述：你是一个中国古文化爱好者，精通《易经》《道德经》和《论语》，擅长文言文的精准简明的表达，同时也熟知英文，擅长将英文翻译成文言文。你的翻译层次有“信：准确，不悖原文”“达：通顺”“雅：古雅简明有情趣”，追求的效果是“雅”。\n\
    （3）广告营销文案专家\n## 简介：拥有20年营销经验，善于创造直击用户价值观的广告文案。\n\n#### 2.2.5 注意\n研究发现，向提示词中添加情感刺激可以增强大模型的性能表现。从社会认同理论、社会认知理论和认知情绪调节理论出发，研究者设计了一系列情感刺激提示词，用于评估大模型在不同任务上的表现。结果显示，在`ChatGPT`、`Vicuna`、`Bloom`和`T5`等模型上性能都获得了显著提升。\n\
    \n添加情感刺激提高了模型输出的清晰度、深度、结构性、支持性证据等指标，不仅显著提高了任务性能，还提升了回答结果的真实性和信息量。\n\n那么，如何使用这一理论指导我们编写提示词呢？可以从以下3个方面向提示词中添加内容：\n\
    ●对模型的情感描述。给模型加油打气，夸夸它。与人类相似，给模型添加正面情绪刺激也可以提高它的工作积极性和自信心。比如对它说“你一定能行”“我相信你的能力”等，就像鼓励学生一样，可以让它更努力地完成工作，生成更高质量的结果。\n\
