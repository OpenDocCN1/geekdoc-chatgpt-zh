    ## 6.4 记忆系统


    记忆可以定义为获取、存储、保留和随后检索信息的过程。人脑中存在多种类型的记忆分类如图 6-19 所示。


    ●感官记忆：这是记忆的最早期阶段，在接受原始刺激后保留的感官信息（如视觉、听觉等）印象的能力。感官记忆通常只能持续几秒钟。它包括图标记忆（视觉）、回声记忆（听觉）和触碰记忆（触觉）。

    ●短期记忆或工作记忆：它存储我们当前意识到的信息，以及执行复杂认知任务（如学习和推理）所需的信息。短时记忆被认为有大约 7 个项目的容量，并能够持续 20～30
    秒。

    ●长期记忆：长期记忆可以将信息存储很长时间，从几天到几十年不等，存储容量几乎是无限的。长期记忆可分为以下两种。

    　![](img/img_00016.jpg)显性/陈述性记忆：是指那些可以有意识地回忆起的记忆，包括外显记忆（事件和经历）和语义记忆（事实和概念）。

    　![](img/img_00016.jpg)隐性/程序性记忆：这种记忆是无意识的，涉及自动执行的技能和例行程序，如骑自行车、在键盘上打字。


    ![](img/img_00126.jpg)


    图 6-19 记忆系统的分类


    如果我们将这些记忆内容大致映射到 LLM 中，会得到下述关系。


    ●感官记忆是对原始输入（包括文本、图像及其他模态）的学习嵌入表示。

    ●短期记忆是上下文学习的一部分，它是短暂且有限的，因为它受到了 Transformer 结构的上下文窗口长度的限制。

    ●长期记忆是 Agent 在查询时可以关注的外部向量存储，可通过快速检索访问。


    ### 6.4.1 短期记忆


    短期记忆在 AI Agent 中扮演着类似于人类短期记忆的角色，用于存储和处理短时间内的重要信息。这些信息通常在一次会话或短时间内的多次交互中使用，以帮助智能体提供更加连贯且与上下文相关的回应。


    短期记忆的实现需要考虑信息的及时性和上下文关联性，使 AI Agent 能够在对话中保持连贯性和一致性。


    目前在 Agent 中，所有的上下文都可以看作利用模型的短期记忆来学习，局限于本次对话流中。比如在提示词工程中提到的角色扮演法，都是基于上下文短期记忆，来让大模型保持这个角色状态来进行各类回复。


    每一个短期记忆的内容长度都受限于大模型的上下文窗口限制。不过，随着越来越多的大模型基础能力的增强，上下文内容空间也在不断增长，长文本处理能力已经是优秀 LLM
    的必备基础能力。


    短期记忆在 AI Agent 的设计中发挥着重要作用。通过有效地利用短期记忆，AI Agent 能够提供更加连贯且与上下文相关的服务，从而提升用户体验和系统性能。显然，在某些场景中，还需要依赖长期记忆和持久化存储。在接下来的小节中，将会详细探讨长期记忆的实现与应用，以进一步完善
    AI Agent 的记忆系统。


    ### 6.4.2 长期记忆


    长期记忆在 AI Agent 中扮演着类似于人类长期记忆的角色，用于存储和管理在较长时间内反复使用的重要信息。这些信息通常包括用户的偏好、历史交互记录、个性化设置和其他持久性数据。长期记忆的实现需要考虑数据的持久性、安全性和高效的检索能力，使
    AI Agent 能够在长期内提供个性化和一致的服务。


    #### (1) 持久化存储


    长期记忆的存储方式通常是持久化的，意味着这些信息会存储在数据库或其他持久性存储介质中。与短期记忆不同，长期记忆的数据在会话结束后仍然保留，以便在未来的交互中使用。


    扣子通过数据库功能提供了一种简单、高效的方式来管理和处理结构化数据，开发者和用户可以通过自然语言插入、查询、修改或删除数据库中的数据。同时，还支持开发者开启多用户模式，提供更灵活的读写控制。


    例如，一个电商平台的 AI Agent 可以存储用户的购买历史和产品偏好，当用户再次访问时，系统可以根据这些信息提供个性化的推荐和服务。


    #### (2) 全面性和细致性


    长期记忆的另一个重要特性是其全面性和细致性。AI Agent 需要能够全面记录和管理用户的各种信息，从而在不同的应用场景中提供一致的服务。这些信息包括用户的个人资料、历史对话记录、偏好设置、行为习惯等。通过全面的长期记忆，AI
    Agent 可以更好地理解用户需求，提供更加个性化和精准的服务。


    例如，当用户再次询问“我上次买的书是什么？”时，系统可以迅速检索长期记忆中的购买记录，提供准确的回答。


    #### (3) 数据的持久性和安全性


    为了确保长期记忆的有效性，数据的持久性和安全性是关键，而这往往取决于 Agent 平台的技术能力。持久性是指数据在存储介质上能够长时间保存，即使系统重启或出现故障，数据也不会丢失。安全性是指数据在存储和传输过程中需要得到保护，防止未经授权的访问和篡改。


    例如，通过使用加密技术保护存储在数据库中的用户数据，并通过访问控制和权限管理，确保只有授权用户和系统模块可以访问和操作这些数据。在扣子平台，当开启“长期记忆”功能后，每个用户包括
    Bot 的开发者，只能看到和使用自己与 Bot 对话生成的记忆内容。


    #### (4) Agent 平台的记忆检索与管理能力


    为了在需要时快速检索和更新长期记忆中的数据，系统需要设计高效的数据索引和检索机制。例如，可以使用关系数据库或 NoSQL 数据库来存储长期记忆数据，通过索引和查询优化技术提高数据检索效率。此外，系统还需提供数据管理工具，帮助管理员监控和维护长期记忆数据，确保数据一致性和完整性。


    #### (5) 版本控制及动态更新


    长期记忆的设计需要考虑数据的版本控制和更新。用户的偏好和行为习惯可能会随时间而变化，因此系统需要能够动态更新长期记忆中的数据，以反映最新的用户信息。例如，当用户修改个人资料或更改偏好设置时，系统需要及时更新长期记忆中的相关数据，确保后续交互的准确性和一致性。这种动态更新能力可以通过设计灵活的数据结构和高效的更新机制来实现。


    对于用户而言，长期记忆功能主要包含两部分能力：

    1）自动记录并总结对话信息。

    2）在回复用户查询时，根据总结的内容进行召回，并在此基础上生成最终回复。


    下面仍以扣子的“AI 四级英语导师”为例：

    1）打开扣子，进入一个空间，然后选择一个目标 Bot 或创建一个 Bot。

    2）在 Bot 编排页面，找到长期记忆功能，然后选择“开启”，如图 6-20 所示。

    3）可以单击“调试”面板上的 Memory 选项查看总结的对话内容。

    4）调用相关对话时，会从记忆中搜索并进行相应解释。


    长期记忆在 AI Agent 的设计中具有重要作用，通过有效管理和利用长期记忆，AI Agent 能够提供更加个性化和持续的服务，提升用户体验和系统智能化水平。


    ![](img/img_00127.jpg)


    图 6-20 扣子的“AI 四级英语导师”开启长期记忆


    ## 6.5 工作流


    ### 6.5.1 什么是工作流


    工作流（Workflow）指一系列有序的任务和活动，这些任务和活动按照预定义的规则和顺序进行，以完成特定的业务目标。在 AI Agent 中，工作流支持通过可视化的方式，对插件、大语言模型、代码块等功能进行组合，确保系统能够高效、准确地执行复杂的业务流程编排。


    例如，在一个在线购物的 AI Agent 中，工作流可以包括商品搜索、购物车管理、订单处理和支付确认等多个步骤，通过有序的任务执行，实现用户的购物体验。一个智能客服系统的工作流可能需要与客户关系管理（CRM）系统、知识库系统和支付系统进行交互，通过调用这些外部服务，完成数据获取和处理任务。这样的集成能力使得工作流不仅局限于内部操作，还能够扩展到更广泛的业务环境中，从而提高系统的功能性和应用范围。


    现在的 AI Agent 平台的工作流通常采用一种“流程图”式的低代码编辑工具，可以用来制作一个“高级版”插件。在工作流中，可以任意编排插件、知识库和大模型节点的工作顺序及调用传参，从而精确控制智能体中部分任务的运行逻辑。


    下面简单了解一下工作流的功能。工作流由多个节点构成，节点是组成工作流的基本单元。例如自定义代码、判断逻辑等节点。


    工作流默认包含开始节点和结束节点。


    ●开始节点是工作流的起始节点，可以包含用户输入的信息。

    ●结束节点是工作流的末尾节点，用于返回工作流的执行结果。


    不同节点可能需要不同的输入参数，输入参数分为引用和输入两类。引用是指引用前面节点的参数值，输入则是支持设定自定义的参数值。


    扣子的工作流如图 6-21 所示，其他智能体平台的工作流也类似。


    ![](img/img_00128.jpg)


    图 6-21 扣子的工作流界面示意图


    工作流的核心在于其结构化和有序性。每个工作流由多个任务组成，每个任务代表一个具体的操作或步骤。任务之间通过特定的规则和条件连接，形成一个完整的流程。当目标任务场景包含较多步骤，且对输出结果的准确性和格式有严格要求时，适合配置工作流来实现。


    工作流在 AI Agent 的设计中起着关键作用，通过定义有序的任务和步骤，协调不同模块和组件的交互，确保系统能够高效、准确地执行复杂的业务逻辑。


    ### 6.5.2 工作流的设计


    设计高效的工作流是确保 AI Agent 能够准确、迅速执行复杂任务的关键。良好的工作流设计不仅可以优化任务的执行顺序，还可以提高系统的灵活性和扩展性。下面将详细探讨工作流设计的基本原则、步骤和最佳实践。


    #### 1. 工作流设计的基本原则


    工作流设计的基本原则如下。


    ●清晰性。工作流的设计应当明确各个任务的目的、输入、输出和执行顺序，避免模糊和重复。每个任务节点的功能和作用应当一目了然，便于后续管理和维护。

    ●模块化。将工作流分解成独立的模块，每个模块完成一个特定的子任务。模块化设计不仅便于开发和测试，还能够提高工作流的灵活性和可复用性。例如，可以将订单处理工作流分解为订单验证、支付处理和订单确认等模块，每个模块独立实现并进行测试。

    ●灵活性。在设计工作流时，应考虑到业务需求的变化和扩展能力。通过引入条件判断和分支路径，工作流可以灵活应对不同的业务场景和需求变化。例如，在客户服务系统中，根据用户的身份和问题类型，可以将其分配到不同的处理路径。

    ●可监控性[^(\[2\])](../Text/AD_00015.xhtml#m2)。在设计工作流时，应包含监控和日志功能，便于实时跟踪工作流的执行状态和性能指标。通过监控和日志，开发者可以及时发现和解决问题，优化工作流的运行效率。


    #### 2. 配置开始节点和结束节点


    开始节点用于触发一个工作流，而结束节点用于输出工作流的结果。开始节点支持配置以下类型的参数。


    ●`String`：字符串类型，用于表示文本。例如：`Name="张三"`。

    ●`Number`：数值类型，包括整数和浮点数。例如：`Number=42.3`。

    ●`Integer`：数值类型，表示整数。例如：`Integer=42`。

    ●`Boolean`：布尔类型，包含 true 和 false 两个值。例如：`isAdult=true`。

    ●`Object`：对象类型，JavaScript 的标准数据类型之一，一个对象可以看作一个无序的键值对的集合。例如：`student={name： "李四"，age：
    18}`。注意，`Object` 最多支持 3 层嵌套。

    ●`Array`：整数数组类型。例如：`numbers=[1，2，3，4，5]`。


    开始节点支持导入 `JSON` 数据，批量添加输入参数。如图 6-22 所示，单击导入图标后，在展开的面板中输入 `JSON` 数据，然后单击“同步 JSON
    到节点”按钮即可自动导入输入参数。


    #### 3. 常用的工作流组件


    接下来将深入探讨一些工作流中的关键组件。通过了解这些组件，可以避免在实际应用中遇到不必要的问题。


    ![](img/img_00129.jpg)


    图 6-22 扣子工作流嵌入 JSON 数据


    (1) 大模型组件


    大模型组件是工作流中最常用的组件。在组件的界面上，我们可以看到一个模型的选择区域、输入区域、提示词区域以及输出区域，如图 6-23 所示。这些元素构成了大模型组件的基本框架。这里跳过一些基础性问题，专注于关键要点。


    ![](img/img_00130.jpg)


    图 6-23 大模型节点中的扣子工作流


    首先，我们来谈谈提示词的问题。在当前的实现中，扣子所说的提示词通常被称为"`user prompt`" ，它是用户指令的核心。因此，可以在此处对用户输入的内容进行简单的指令加工。


    其次，还有一个让人难以理解的点是“输出格式”，它分为以下三种类型。


    ●文本格式：这是最基础的输出方式，提供纯文本的输出。

    ●Markdown 格式：Markdown 格式在需要对文本进行格式化处理时非常有用。尽管它也是一种文本格式，但它允许包含格式化指令，使得输出内容具有更好的可读性。

    ●JSON 格式：与前两者不同，JSON 格式能够处理数组和复杂的对象结构。它通常用于需要数组处理或集合元素处理的场景。


    此外，在大模型节点中，“Bot 对话历史”是一个重要的功能。如果选择启用它，系统会将之前输入的指令保存下来，并将其作为数据再次输入。这样，工作流就能够记住之前的任务和交互，从而提供更加连贯和个性化的体验。


    这个特性适用于需要上下文理解或历史信息来做出更好响应的场景。通过利用对话历史，大模型可以更好地理解用户的需求，并在当前任务中考虑之前的交互内容，从而提高回答的准确性和相关性。


    在大模型节点的参数选择中，有以下几个关键设置需要关注（如图 6-24 所示）。


    ●生成随机性：该参数决定模型生成回复时的创造性和随机程度。通常，模型会提供几种预设模式，例如“精确模式”和“平衡模式”，以调整生成内容的随机性。

    ●`Top P`：该参数影响模型生成文本的多样性和连贯性。通过调整`Top P`值，可以控制模型在生成文本时考虑的词汇范围。

    ●最大回复长度：该参数设置模型输出的最大字符数。默认情况下，这个值可能会设置得较短，有时会导致模型的回复不完整，无法充分表达所需的信息。


    为了避免输出不完整的问题，建议将最大回复长度调整到最大值，这样可以增强节点处理任务的可靠性，并确保模型有足够的空间生成详尽且完整的回复。


    在大模型节点的操作中，我们引入了一项新特性—“异常忽略”（如图 6-25 所示）。此功能允许工作流在遇到模型处理任务失败或超时的情况下，继续执行而不会完全中断。当启用“异常忽略”时，如果大模型无法处理特定任务，工作流会自动转入异常处理阶段。在该阶段，可以预设一系列应对措施，比如记录错误日志、发送错误通知，或者启动备用操作流程，以确保工作流的连续性和任务处理的可靠性。通过合理配置异常忽略和相应的异常处理逻辑，可以显著提升整个工作流在面对意外情况时的稳定性和效率。


    ![](img/img_00131.jpg)


    图 6-24 大模型节点的关键参数


    ![](img/img_00132.jpg)


    图 6-25 “异常忽略”特性


    在大模型节点中，设置系统级提示词（`System Prompt`）是一个关键步骤（如图 6-26 所示），它与外层用户直接交互的提示词不同。系统级提示词主要用于定义模型的角色和任务，提供一个固定的模板来指导模型的行为和输出。


    ![](img/img_00133.jpg)


    图 6-26 系统提示词设置在扣子工作流大模型节点中


    这种设置允许明确指示模型的角色及其需要完成的具体任务。例如，可能需要模型作为历史顾问来回答有关过去事件的问题，或作为技术专家来解决特定技术问题。通过在系统级提示词中设定这些参数，可以确保模型的输出与你的期望和工作流需求保持一致。


