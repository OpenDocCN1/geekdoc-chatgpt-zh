    ### 1.9.2 模型的官方格式


    在模型厂商未进行特殊优化的情况下，用户可以自行选择任意格式进行语义区分。若所使用的模型有官方格式，建议使用官方格式，因为官方通常会针对该格式进行优化。`GPT`模型目前无官方格式，可使用模型识别度较高的常用格式。


    `Claude`模型官方推荐`XML`格式，官方对`Claude`进行了微调，使模型能特别注意`XML`标签创建的结构。写提示词时，使用`XML`标签来标记提示词的不同部分，如`rules`（规则）、`example`（示例）等。下面是一个例子[^(\[4\])](../Text/AD_00009.xhtml#m4)：


    ```

    <prompt>

    　<description>请输入你的文章内容，我将基于你的输入为文章生成一个标题。</description>

    　<rules>标题应简洁明了，准确地反映文章的主题和内容，不包含冗余的词汇或重复的信息。</rules>

    　<example>

    　<input>这是一篇关于大数据和机器学习在医疗领域应用的文章，介绍了如何利用这些技术改进医疗服务和治疗方法。</input>

    　<output>“大数据与机器学习在医疗领域的革新应用”</output>

    　</example>

    　<userInputMessage>请输入文章的内容：</userInputMessage>

    </prompt>

    ```


