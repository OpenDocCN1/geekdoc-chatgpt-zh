    图6-13 扣子知识库上传表格


    ●指定数据范围：通过选择数据表、表头和数据起始行来指定数据范围。


    ●确认表结构：系统已默认获取表头的列名。可以自定义修改列名，或删除某列的列名。


    ●指定语义匹配字段：选择哪个字段作为搜索匹配的语义字段。在响应用户查询时，会将用户查询内容与该字段的内容进行比较，根据相似度进行匹配。


    ##### 7.查看表结构和数据


    确认表结构和数据无误后，单击“下一步”按钮完成操作，如图6-14所示。


