    ### 3.4 动手设计AI Agent

    看到这里，可能有一些读者会有疑问：说了那么多AI Agent相关的内容，那我们在日常生活中有哪些AI Agent的实际应用场景呢？接下来我们将展示一个令人兴奋的AI
    Agent案例—多语言翻译大师AI Agent，来看看我们身边真实的应用场景。

