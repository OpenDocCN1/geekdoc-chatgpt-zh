    图 1-9 多层格式样例图（续）


    ### 1.9.2 模型的官方格式


    在模型厂商未进行特殊优化的情况下，用户可以自行选择任意格式进行语义区分。若所使用的模型有官方格式，建议使用官方格式，因为官方通常会针对该格式进行优化。`GPT`模型目前无官方格式，可使用模型识别度较高的常用格式。


    `Claude`模型官方推荐`XML`格式，官方对`Claude`进行了微调，使模型能特别注意`XML`标签创建的结构。写提示词时，使用`XML`标签来标记提示词的不同部分，如`rules`（规则）、`example`（示例）等。下面是一个例子[^(\[4\])](../Text/AD_00009.xhtml#m4)：


    ```

    <prompt>

    　<description>请输入你的文章内容，我将基于你的输入为文章生成一个标题。</description>

    　<rules>标题应简洁明了，准确地反映文章的主题和内容，不包含冗余的词汇或重复的信息。</rules>

    　<example>

    　<input>这是一篇关于大数据和机器学习在医疗领域应用的文章，介绍了如何利用这些技术改进医疗服务和治疗方法。</input>

    　<output>“大数据与机器学习在医疗领域的革新应用”</output>

    　</example>

    　<userInputMessage>请输入文章的内容：</userInputMessage>

    </prompt>

    ```


    * * *


    通过有效学习和理解提示词，个体能够提升解决问题的能力，更好地应对快速变化的需求，并提高与他人沟通的效率。未来，随着`AI`和其他高科技的快速发展，快速理解和有效应用提示词的能力将变得越来越重要。这不仅有助于提升个体的职业竞争力，更能使个体在日常生活、协同合作中表现出更高的能动性和效率。


    * * *


    "提升解决问题的能力和沟通能力：理解与应用提示词的重要性"


    ### 1.9.3 API 使用格式


    对于在网页和`App`端使用大模型的人而言，不必考虑`API`使用格式，因为官方已经为用户处理好了格式，这部分内容了解一下即可。


    对于开发者而言，使用`API`调用大模型时，需要特别注意格式问题。以`Claude`模型为例，通过`API`调用时，必须使用正确的格式。`Claude`模型在训练时，会使用特殊的标记来区分用户内容和模型的生成内容。"\n\nHuman："用于标记用户（你）的指令，"\n\nAssistant："用于标记模型（`Claude`）的生成内容。因此，通过`API`调用时，必须使用下面的格式：


    ```

    \n\nHuman：


    \n\nAssistant：

    ```


    其中，`\n`是换行符，`\n\n`代表换两行，这就是`Assistant`在`Human`下面两行的原因。在“`Human：`”后填写提示词内容即可，通过`API`发送请求后，模型会在“`Assistant：`”后生成模型的回答内容。


    思考一下为什么要这样写。前文提到，模型的基本工作原理是续写文本。通过这种格式可以清晰地告诉模型用户输入了什么，接下来该模型基于用户输入续写文本。


    关于格式法的总结如下：


    ●格式法的核心目的是让提示词内容清晰、易读、易理解。没有格式控制的提示词就像没有标点符号的文本一样，虽然很多时候也能阅读，但阅读起来会很艰难，且存在歧义。加上格式控制后，内容的层级结构和语义会更为清晰。


    ●格式法还是一种提示词防护手段。本节开头展示的案例就是一个例子，用户可以对提示词应用进行注入攻击，导致系统提示词泄露或执行用户指令等不安全事件发生。而经过格式保护后的提示词则能有效减少此类情况的发生。


    ●让`GPT`以指定的格式输出内容也十分重要，尤其是按`JSON`等格式进行结构化输出。对于使用`GPT API`进行应用开发的开发者而言，这能够更方便快捷地开发出性能稳定、功能完善的应用。


    ## 1.10 迭代法


    有一句话叫“好文章是改出来的”，我们要写出一篇精品文章，完成初稿后需阅读体会文章内容，然后不断修改，再读，再修改。提示词也是如此，我们用初版提示词向 `ChatGPT`提问时，它给出的答案可能并不理想。而随着不断调整提示词，它的回答就会慢慢接近我们想要的答案。


    不断试验提示词的效果，获得反馈后修改提示词，然后再试验，再修改，如此不断迭代，直到提示词的表现符合预期—这就是提示词迭代法。


    因此，这里最重要的是如何迭代提示词。提示词的迭代过程可以看作一种“对话编程”，需要多个步骤和多次试验，如图 1-10 所示。


    ![](img/img_00014.jpg)


    图 1-10 提示词迭代过程


    1）需求/想法（明确目标）：在调整提示词之前，首先要明确自己希望从模型中获得什么类型的答案，是事实性的信息、解释、意见还是其他。


    2）执行提示词：使用一个直接、简单的提示词。观察模型的回应，确定需要进行哪种类型的调整。


    3）验证结果和反馈迭代：快速迭代和测试不同的提示词，然后根据结果进行调整。如果模型的回应不及预期，尝试使用本章中提到的各种提示词方法调整提示词，如采用格式法部分的示例，更改提示词的语言风格或格式，指定上下文或条件，分步询问等。


    4）错误分析：对模型反馈的错误内容进行分析，同时也要了解模型的局限性，比如`GPT`模型存在字数限制，某些小模型在复杂任务上能力不足等。


    通过这些步骤，可以更有效地迭代和优化提示词，从而获得更准确、更相关的回答。


    下面通过两个迭代法的示例来理解提示词迭代的过程。


    （1）写一篇关于植物的文章


    提示词 0.1：


    任务：写一篇关于植物的文章。


    背景：无。


    输出要求：至少 300 字。


    提示词 0.2：


    任务：写一篇关于热带雨林中植物的文章。


    背景：热带雨林是生物多样性的宝库，其中有许多独特的植物。


    输出要求：至少 10 个句子，包括至少 3 种特定的植物和它们的生长环境。


    提示词 0.3：


    任务：写一篇关于热带雨林中药用植物的文章。


    背景：热带雨林不仅是生物多样性的宝库，还是许多有治疗作用的植物的家园。许多当地居民依赖这些药用植物来治疗各种疾病。


    输出要求：至少 3 个段落，每个段落不少于 4 句话，列举至少 5 种药用植物，描述它们的治疗功效、生长环境和它们对当地居民的意义。


    （2）解释人工智能概念`embedding`


    我们通过一个解释人工智能概念`embedding`（嵌入）的案例，来看一下如何通过提示词迭代一步步得到预期的结果。


    提示词：


    请解释一下`embedding`。


    AI 输出：


    在计算机科学和机器学习中，嵌入（`embedding`）通常指的是将高维的或具有复杂结构的数据转换成低维的、更易于处理的表示。例如在自然语言处理中，词嵌入（word
    embedding）是将每个词表示为一个高维空间中的点，这种表示捕获了词之间的语义关系，比如相似的词在空间中的距离接近。


    提示词：


    1.你是理查德·费曼（Richard Feynman）的关门弟子，你擅长以通俗易懂的语言解释概念。


    2.请解释一下`embedding`。


    AI 输出：


    嵌入（`embedding`）是一种将物件、概念或结构映射到另一个空间的映射过程，这种映射过程能帮助我们捕获和表示原始空间中的重要特性。嵌入在计算机科学和数学等领域有很多用途。


    例如，在机器学习中，我们经常使用嵌入来表达离散型变量（如词语）。此时，嵌入是一种将每个词语映射到一个高维空间的向量的过程，这个向量能够捕获词语的语义和上下文关系。例如，“猫”和“狗”这两个词在嵌入空间中的位置可能会比较接近，因为它们都是宠物。


    总的来说，`embedding`是一种将对象、实体或概念编码为数值型向量，以便用数学的方法来处理和理解这些对象、实体或概念的方式。


    提示词：


    1.你是理查德·费曼（Richard Feynman）的关门弟子，你擅长以通俗易懂的语言解释概念。


    2.你擅长以比喻的方式来让用户快速感受概念的本质和内涵，你拥有深刻的洞察能力，可以快速抓住概念的本质，你拥有将复杂概念讲解得浅显易懂的能力。


    3.请解释一下`embedding`。


    AI 输出：


    `embedding`在机器学习中是一种特征表示方法，通常用于处理高维度的稀疏数据，譬如单词、商品、用户等，以让计算机能更好地理解这些抽象的概念。


    想象一下，我们都在一个巨大的商场里，每个商品都存在于商场的某个位置。一开始，我们并不知道它们的确切位置，甚至不知道这个商场的形状。但是我们知道，相似的商品往往会被放在一起，譬如食品在一个区域，电子产品在另一个区域。


