    # 第 12 章 AI Agent 的局限性及其缓解方法

    随着人工智能技术的快速发展，AI Agent 在各种应用场景中展现出了强大的能力，从自然语言处理到图像识别，再到自动驾驶。然而，尽管 AI Agent 具备了强大的数据处理和分析能力，但它们仍然存在一些显著的局限性。这些局限性不仅限制了
    AI Agent 的应用范围，也在某些情况下导致不准确甚至误导性的结果。因此，了解这些局限性及其产生的原因，并探索有效的缓解方法，对于推动 AI Agent
    技术的进一步发展和应用至关重要。

    本章将详细探讨 AI Agent 在操作和理解中遇到的 3 个常见挑战：无法准确识别数字、难以解决数学问题以及会产生幻觉。通过解析这些问题的技术根源，本章不仅揭示
    AI Agent 在处理特定类型的数据和逻辑推理时的困难，还将提供针对性的缓解方法和改进策略。这些内容将帮助读者更好地理解 AI Agent 的运作机制，以及如何在实际应用中有效规避或减轻这些局限性。


    ## 12.1 多模态 AI

    ### 12.1.1 什么是多模态 AI

    2024 年，多模态 AI 火爆出圈。于是，许多人对多模态 AI 产生了好奇，什么是多模态 AI？

    与多模态对应的是单模态。像我们之前使用的 ChatGPT 大模型系列，大家使用最多的应该是文字，而文字就是一种模态，这就是单模态的 AI。

    我们可以把它比作人类的五感。想象一下，单模态相当于一个人只能看到，不能听到、闻到，也没有触觉等其他感觉。

    现在的 AI 不仅能够识别文字，还能“听懂”语音，“看到”图片，甚至理解视频。

    此时就像一个人拥有了完整的五感，其能力会更加丰富与强大。

    那么，什么是多模态 AI？

    它是一种能够同时处理来自文字、语音、图片和视频等不同模态信息的 AI 模型（如图 12-1 所示）。

    ![](img/img_00269.jpg)

    图 12-1 多模态 AI

    当然，这个概念也不是完全如此。只要它不是在处理单一模态，而是附加了其他模态，就可称它为多模态 AI。

    对于多模态 AI 的大模型，主要关注其两方面的能力：一是生成能力，二是理解能力。从这两个维度出发，多模态 AI 可分为生成模型与理解模型。

    （1）多模态生成模型

    根据生成的内容，我们可以将多模态生成模型进一步细分为图片生成模型和视频生成模型，如图 12-2 所示。对于图片生成，相信大家已经比较了解，像 Midjourney、DALL·E
    和 Stable Diffusion 这些模型，都具有较好的图片生成效果。在视频生成方面，OpenAI 的 Sora、生数科技的 Vidu，以及最近爆火的快手
    Kling，都发展得非常快。

    ![](img/img_00270.jpg)

    图 12-2 多模态生成模型

    （2）多模态理解模型

    与多模态生成模型相比，理解模型更侧重于理解能力，即问答能力。这一领域的发展实际上已经持续较久，已有大量模型存在。如果大家感兴趣，可以参照图 12-3 右边的多模态大模型发展时间线图，自行搜索相关模型。在当前阶段，我们使用效果较好的多模态理解模型，如图
    12-3 左侧的表格所示。

    ![](img/img_00271.jpg)

    图 12-3 多模态理解模型

    OpenAI 的 GPT-4 模型就不用多说了，谷歌的 Gemini 模型的多模态能力也非常完整。国内比较好的多模态理解模型有阿里的通义、商汤的书生、智谱的
    CogVLM 等。

    多模态 AI 有哪些局限性？为什么智能体不能准确识别与数字相关的内容？下面我们一起来看一看。


    ### 12.1.2 多模态 AI 的局限性

    在具体解释智能体无法准确识别数字等问题之前，我们先来看一下当下多模态 AI 的一些局限。

    （1）场景理解能力的不足

    如图 12-4 所示，我们给 AI 设置了一个场景，让它去识别图中有多少个人。我们可以看到，实际上比较明显的有 4 个人。尽管 AI 准确识别了这 4 个人，但它出现了幻觉，生成了第
    5 个人（箭头指向的地方）。箭头所指的地方实际上是没有人的。

    ![](img/img_00272.jpg)

    图 12-4 多模态 AI 在场景理解能力上的不足

    （2）关键信息遗漏

    我们再举一个抽取身份证信息的例子，虽然 AI 抽取的结果看上去还不错，但某些数字可能会出现遗漏或错误，或者顺序颠倒（如图 12-5 所示）。

    （3）信息错位

    即使 AI 能够正确识别图中的所有数据和各种实体信息，也容易发生数据与实体信息的匹配错误，导致最终的分析结果出错，如图 12-6 所示。

