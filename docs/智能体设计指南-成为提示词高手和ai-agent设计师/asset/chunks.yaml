    AI输出：


    小萌给妈妈送了2朵花后还剩下10朵花。所以在给妈妈送花之前，她有（10+2=12）朵花。


    她再给爸爸送去了3朵花，剩下7朵花。所以在给爸爸送花之前，也就是在给妈妈送花之后，她有（7+3=10）朵花。


