    ### 11.5.2 设计思路


    我们以“活动组织”为核心，将其分解为 3 个主要模块：活动策划、活动发言和活动新闻。每个模块进一步细化为 3 个关键元素：全局跳转条件、适用场景和 Agent
    提示词。如图 11-2 所示。通过设定全局跳转条件，系统可以根据具体情况灵活切换不同功能；适用场景的定义则有助于 AI 更准确地理解和应对各种活动情境；而
    Agent 提示词的设置为 AI 生成高质量且具有针对性的内容提供了有力支持。这样的设计既兼顾了通用性，又保证了对具体活动的个性化支持。


    ![](img/img_00249.jpg)


    图 11-2 活动组织专家的设计思路


    ### 11.5.3 功能实现


    我们选择扣子平台作为构建活动组织专家智能体的基础，这个平台为我们提供了理想的环境来实现我们的目标。接下来，让我们一步步探索如何创建这个智能体。


    #### 1.创建活动组织专家 Bot


    登录扣子平台，单击“创建 Bot”按钮进入 Bot 创建页面。我们需要仔细填写 Bot 名称（活动组织专家）、Bot 功能介绍（组织活动全流程），并上传一个合适的头像。这些元素不仅定义了
    Bot 的身份，还影响用户互动时的第一印象。请确保所有信息准确无误，然后单击确认按钮以完成这一初始设置阶段。


    #### 2.配置多智能体模式


    进入 Bot 的配置页面后，我们需要进行一项关键设置：选择运行模式。在本项目中，我们将采用多智能体模式，这是实现复杂功能的重要基础。如图 11-3 所示，你会看到模式选择的下拉菜单。在这里，我们选择“多
    Agents”选项。这个设置将使我们的活动组织专家 Bot 能够协调多个智能体，从而更有效地处理各种活动组织任务。


    ![](img/img_00250.jpg)


    图 11-3 活动组织专家 Bot（设置多智能体模式）


    #### 3.编排页面中的 Agent 节点配置


    如图 11-4 所示，你将看到编排页面的默认设置。这里已经预置了一个 Agent 节点，我们需要对其进行个性化配置。以下是主要的配置步骤：


    ![](img/img_00251.jpg)


    图 11-4 活动组织专家（Agent 节点配置）


    1）Agent 的基本设置。

    ●单击节点右上角的“…”图标。

    ●在弹出的菜单中，你可以修改 Agent 的名称并选择合适的 AI 模型。


    2）主界面配置。主界面提供了多种配置选项，包括：

    ●适用场景；

    ●Agent 提示词；

    ●技能；

    ●用户问题建议。


    注意：带“*”的项目为必填项，其他项根据需要选填。


    3）重点配置项。在本次设置中，我们将重点关注以下 3 个核心配置项：

    ●节点名称；

    ●适用场景；

    ●Agent 提示词。


    通过精心配置这些项目，可以确保 Agent 准确理解与执行指定的活动组织任务。


    #### 4.配置活动组织专家的人设与回复逻辑


    如图 11-5 所示，在这个界面中，我们将精心设计活动组织专家的人格特征和回复逻辑。这一步骤对于塑造专家的独特风格和确保其回应的一致性至关重要。首先，仔细构思并填写“人设”部分内容，这将定义专家的背景、专业知识和交流风格。然后填写“回复逻辑”内容，详细说明专家应如何处理各类查询和任务。完成初步设置后，你会注意到界面右上角的“Ⓐ”图标。这个智能辅助功能非常实用，只需单击它，系统就会自动分析并优化你的设置，并提供改进建议，以帮助你打造更加专业、自然的活动组织专家的提示词。


