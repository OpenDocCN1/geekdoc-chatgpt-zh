    无样本提示的范例如下。


    提示词：


    请为我生成一个描述春天的句子。


    AI输出：


    春天的到来使得世界重新焕发生机，万物复苏，鲜花绽放，绿叶葱茏，空气中弥漫着新生的气息和生命的活力。


    （2）单样本提示（One-shot prompting）


    单样本提示只展示1条提示，示例如下。


    提示词：


    请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：“绿树村边合，青山郭外斜。”


    AI输出：


    “桃花河畔映，柳絮风中飘。”


    （3）少样本提示（Few-shot prompting）


    少样本提示展示2条及以上提示，示例如下。


    提示词：请为我生成一个描述春天的句子。


    我想要的句子类似于如下对称诗句：


    “绿树村边合，青山郭外斜。”


    “欲把西湖比西子，淡妆浓抹总相宜。”


    “柳色浓烟绿，桃花淡露红。”


    AI输出：


    “樱花洒落繁，春绿涌田间。”


    值得注意的是，在另外一些情况下，提供示例能在一定程度上避免模型的幻觉问题。如果我们能为模型提供与当前查询相关的可信信息，那么就可以指示模型使用所提供的信息来生成答案。例如，在输入内容中补充相关知识，就可以直接要求大模型通过引用所提供文档中的段落来为生成内容添加引文（这也是检索增强生成，即RAG的思路）。注意，输出中的引用可以通过所提供文档中的字符串匹配进行验证。


