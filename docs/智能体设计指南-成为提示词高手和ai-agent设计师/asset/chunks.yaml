    ### 9.1.2 设计思路


    “小红书爆款文案大师”的核心设计思路是利用智谱AI智能体平台强大的自然语言处理和机器学习能力，自动生成符合用户需求的文案。具体步骤如下：

    （1）需求分析

    首先，了解用户对文案的具体需求，包括主题、产品特点和目标受众等。这部分内容我们可以直接通过界面式设计，清晰地表示哪些是需要用户填写的信息。

    （2）总结什么是爆款文案

    通过各种渠道收集大量小红书上的优质文案，分析文案内容，总结爆款文案的特性，形成知识库。比如，可以总结为以下几点：

    1）爆炸词汇：何谓爆炸词汇？带有强烈情感倾向且能够引起用户共鸣的词语，例如“小白必看”“人人必备”“建议收藏”“独家”“良心推荐”等。使用爆炸词汇是爆款文案必备的法则之一。

    2）二极管标题法：二极管标题法的核心在于利用人的生物本能驱动力，即追求快乐和逃避痛苦。这种驱动力可以分为正刺激和负刺激。通过在标题中使用合适的词语或提出疑问，可以激发读者的好奇心，从而吸引他们的注意力。

    基本原理如下：

    ●本能喜欢：最省力的法则与及时享受。

    ●基本驱动力：追求快乐和逃避痛苦，由此衍生出两个刺激，即正刺激和负刺激。

    标题公式有以下两种：

    ●正刺激：产品或方法+只需1秒（短期）+便可获得惊人效果。例如，“8天背完！英语阅读拿捏！稳上135！！我悟了”“四六级40天冲刺计划？？四级618+六级590”。

    ●负刺激：你不×××+绝对会后悔（天大损失）+（紧迫感）。例如，“你不看这篇文章就会错过一个亿，限时删除！”“这个秘密我一般不告诉别人，三天后删！”其实就是利用人们厌恶损失和负面偏误的心理，即人们在面对负面消息时会更加敏感。

    3）使用吸引人的技巧设计标题。

    ●使用感叹号、省略号等标点符号增强表达力，营造紧迫感和惊喜感。

    ●采用富有挑战性和悬念的表述，激发读者的好奇心，例如“词汇量暴涨”“无敌”“告别焦虑”等。

    ●融入热点话题和实用工具，提高文章的实用性和时效性，例如“2023年必知”“ChatGPT狂飙进行时”等。

    ●使用emoji表情符号来增加标题的活力。

    除此之外，还包括小红书文案的整体设计，如开篇方法、文本结构、互动引导方法、书写技巧、SEO等。

    （3）定义工作流

    ●引导用户输入想要写的内容。用户可以提供的信息包括主题、受众人群、表达语气等。

    ●提供备选标题，向用户提供更多选择。

    ●输出小红书文章，包括[标题]、[正文]、[标签]。

    ●SEO。

    （4）对话设计

    通过智谱AI智能体平台设计用户与AI Agent的对话流程，使用户能够方便地输入需求并获取文案。

    （5）文案生成及优化

    利用已定义的AI Agent生成文案，并根据实际效果不断优化生成效果。


