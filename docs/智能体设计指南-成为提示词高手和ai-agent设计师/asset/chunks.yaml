    ### 1.7 示例法


    对于人类来说，同一个提示词的不同表达方式区别不大，但对于大模型来说，最终得到的生成结果可能千差万别。在训练模型的数据中，不同的表达可能来自不同的文本语境并用于不同目的，最终的结果往往难以预测。


    早在2020年，Tom B.Brown等人在他们的论文“Language Models are Few-Shot Learners”中指出：Few-shot（少样本示例）学习是一种让大模型基于少量的示例快速适应新任务的方法。通过给ChatGPT提供几个示例，它可以更好地理解我们的问题，并给出更准确的答案。这就像是给模型提供了一个更明确的上下文或参考，帮助它更好地完成任务。所以，使用Few-shot的方法，大模型的回答质量和准确性都会有所提高。


