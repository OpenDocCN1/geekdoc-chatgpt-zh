  md: '容量大、可靠性高、可表示汉字及图像多种文字信息、保密防伪性强等优点。

    QR 码基本特性见表 11.1。


    表 11.1 QR 码基本特性一览表


    | 特性 | 描述 |

    | :--- | :--- |

    | 符号规格 | 21 × 21 模块(版本 1) 到 177 × 177 模块(版本 40),每提高一个版本,每边增加 4 个模块 |

    | 数据类型与容量 | 数字数据为 7 089 个字符,字母数据为 4 296 个字符;

    参照最大规格符号版本 40 – L 级:8 位字节数据为 2 953 个字符,汉字数据为 1 817 个字符 |

    | 数据表示方法 | 深色模块表示二进制“1”,浅色模块表示二进制“0” |

    | 纠错能力 | 分为 L 级、M 级、Q 级、H 级四级,分别对应可纠错 7%、15%、25%、30% 的数据码字 |

    | 结构链接(可选) | 可用 1 ~ 16 个 QR 码符号表示一组信息,每一符号表示 100 个字符的信息 |

    | 掩模(固有) | 可以使符号中深色与浅色模块的比例接近 1:1,使因相邻模块的排列造成译码困难的可能性降为最小 |

    | 扩充解释(可选) | 这种方式使符号可以表示缺省字符集以外的数据(如阿拉伯字符、古斯拉夫字符、希腊字母等),以及其他解释(如用一定的压缩方式表示的数据)或者对行业特点的需要进行编码
    |

    | 独立定位功能 | QR 码可高效地表示汉字,相同内容,其尺寸小于相同密度的 PDF417 条码。目前市场上的大部分条码打印机都支持 QR 码,其专有的汉字模式更加适合我国应用。因此,QR
    码在我国具有良好的应用前景 |


    ②图形结构。QR 码的图形可以分为编码区和功能图形，如图 11.4 所示,编码区又可以分为数据与纠错码、格式信息模块和版本信息模块、版本号;功能图形主要包括寻像图像、定位图像以及校正图像。


    ③高速识读性能。QR 码的英文名称为是 Quick Response Code,超高速识读特点是 QR 码区别于 PDF417、Data Matrix 等二维码的主要特性。由于在用
    CCD 识读 QR 码时,整个 QR 码符号中信息的读取是通过 QR 码符号的位置探测图形,用硬件来实现的。这个信息读取过程所需时间很短,具有超高速识读特点。用
    CCD 二维条码识读设备,每秒可识读 30 个含有 100 个字符的 QR 码符号;对于含有相同数据信息的 PDF417 条码符号,每秒仅能识读 3 个符号;对于
    Data Matrix 矩阵码,每秒仅能识读 2 ~ 3 个符号。QR 码的超高速识读特性使它能够广泛应用于工业自动化生产线管理等领域。'
