- pgno: 221
  md: '息,但是非自适应的余弦变换近似地去除了特征成分之间的相关性,使得 MFCC 特征被广泛应用,促进了 GMM-HMM 系统识别率的显著提升。由于语音形成过程中往往伴随着“协同发音”现象,即当前语音会受到临近音的影响,考虑深度学习模型具备强大的数据建模能力,能够挖掘这种丰富语言现象的内涵信息,因而可以考虑将相邻的连续多帧短时特征拼接起来得到长时特征,构成网络的原始输入。


    深度自动编码器是一种深度学习神经网络,其输入和输出具有相同的维度。由于它可以在输出层重构出原始输入作为目标,不需要额外的监督信息,因而可以直接从海量未标注原始数据中自动学习数据特征。有研究工作将高维
    MFCC 特征作为网络输入,应用深度自动编码器成功提取了新的语音特征。市级应用中,采用深度学习模型提取的新语音特征和传统 MFCC 特征相比,在识别性能上有较好的提升。基于深度自动编码器模型的语音特征提取方法如图
