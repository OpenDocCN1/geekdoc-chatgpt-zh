    # 2) 加载 Haar 算子


    加载 Haar 模型及算法进行人脸检测的语法是：


    ```

    class image. Haar Cascade(path[, stages = Auto]) ,

    ```


    其中，stages 默认值为 Haar Cascade 级联分类器的总阶段数，也就是强分类器的个数。Stages 值的选取要根据实际情况来选择：设置较低的阶段数可以得到较快的检测速度，但是误识率也会较高；设置较高的阶段数可以提供识别的准确度，但是牺牲了检测速度。相关的
