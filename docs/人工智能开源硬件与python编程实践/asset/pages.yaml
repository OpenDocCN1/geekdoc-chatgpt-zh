- pgno: 20
  md: "在 Python 程序中使用多行注释，是用一对连续的 3 个引号（单引号和双引号都可以）来表示。\n\n+   ②模块导入。Python 是一门开源语言，共享资源很多。使用\
    \ Python 进行编程时，往往会借助 Python 现有的标准库或者他人提供的第三方库。将这些公共模块导入当前程序后，就可以直接使用它们。Python\
    \ 使用 import 语句导入外部模块。导入的语法主要有以下两种：\n\n```\nimport 模块名  as  别名\n```\n\n会导入指定模块中的所有成员（包括变量、函数、类等）。当需要使用模块中的成员时，需用该模块名（或别名）作为前缀，否则\
    \ Python 解释器会报错。\n\n```\nfrom 模块名 import 成员名 as 别名\n```\n\n用来导入指定的成员。例如，from sys\
    \ import argv 用于导入 sys 模块的 argv 成员，后续程序使用导入成员时，直接使用成员名访问。\n\n+   ③全局变量定义。在 Python\
    \ 中，每个变量在使用前都必须赋值，变量赋值以后该变量才会被创建。Python 的语法比较自由，等号 = 是赋值运算符，可以把任意数据类型赋值给变量，同一个变量可以反复赋值，而且可以是不同类型的变量。\n\
    \n+   ④类定义。类（Class）是面向对象程序设计实现信息封装的基础。类的内部封装了属性和方法，每个类包含数据说明和一组操作数据或传递消息的函数。在\
    \ Python 语言中，定义类的方法如下：\n\n```\n#类的定义\nclass Photo：   #类名使用驼峰命名风格，即首字母大写，私有类可用一个下画线开头\n\
    __name = \"\"    #私有实例变量（__name）前有 2 个下画线；\ndef __init__ ( self, name)：\n    self.\
    \ __name = name\ndef getName( self) ：      #函数名一律小写；\n    return self. __name\n\
    ```\n\n类的实例称为对象。类是对某种对象的定义，它描述一个对象能够做什么以及做的方法，它们是可以对这个对象进行操作的程序和过程。Python 语言中，创建对象的方法如下：\n\
    \n```\n#对象的创建\nif __name__ == \"__main__\"：\n    photo = Photo( \"alice\" )  \
    \    #对象 photo，命名要小写；\n    print( photo. getName( ))\n```"
