  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_219_0.png)


    # 2) 语音识别应用的分类


    按照使用者的限制而言，语音识别芯片可以分为特定人语音识别芯片和非特定人语音识别芯片。


    特定人语音识别芯片是针对指定人的语音识别，其他人的话不识别，须先把使用者的语音参考样本存入当成比对的资料库，即特定人语音识别在使用前必须要进行语音训练，一般按照机器提示训练几遍语音词条即可使用。


    非特定人语音识别是不用针对指定的人的识别技术，不分年龄、性别，只管说相同语言就可以，应用模式是在产品定型前按照确定的十几个语音交互词条，采集 200 人左右的声音样本，经过
    PC 算法处理得到交互词条的语音模型和特征数据库，然后烧录到芯片上。应用这种芯片的机器（智能娃娃、电子宠物、儿童电脑）就具有交互功能了。


    嵌入式语音识别系统都采用了模式匹配的原理。录入的语音信号首先经过预处理，包括语音信号的采样、反混叠滤波、语音增强，接下来是特征提取，用以从语音信号波形中提取一组或几组能够描述语音信号特征的参数。


    特征提取之后的数据一般分为两个步骤：第一是系统“学习”或“训练”阶段，这一阶段的任务是构建参考模式库，词表中每个词对应一个参考模式，它由这个词重复发音多遍，再经特征提取和某种训练中得到。第二是“识别”或“测试”阶段，按照一定的准则求取待测语音特征参数和语音信息与模式库中相应模板之间的失真测度，最匹配的就是识别结果。


    # 3) 神经网络方法在语音识别中的应用


    在当今的大数据时代里，对于处理大量未经标注的原始语音数据的传统机器学习算法，很多都已不再适用。深度学习模型凭借其对海量数据的强大建模能力，能够直接对未标注数据进行处理，成为当前语音识别领域的一个研究热点。在语音识别研究及应用领域，从最早期的特征参数匹配法，发展到已经商用的隐马尔可夫建模及识别方法，现在神经网络特别是深度神经网络（DNN）、卷积神经网络（CNN）方法在语音识别过程中大力应用，取得了明'
