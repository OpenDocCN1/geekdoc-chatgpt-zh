- pgno: 86
  md: "①欧氏距离。欧几里得度量（Euclidean Metric）（也称欧氏距离）是一个通常采用的距离定义，指在 n 维空间中两个点之间的真实距离，或者向量的自然长度（即该点到原点的距离）。n\
    \ 维空间的欧氏距离计算公式：\n\n$d(x, y) := \\sqrt{(x_1 - y_1)^2 + (x_2 - y_2)^2 + \\cdots\
    \ + (x_n - y_n)^2} = \\sqrt{\\sum_{i=1}^n (x_i - y_i)^2}$\n\n②汉明距离。汉明距离表示两个（相同长度）字对应位上不同的数量，我们以\
    \ d(x,y) 表示两个字 x,y 之间的汉明距离。对两个字符串进行运算异或，并统计结果为 1 的个数，那么这个数就是汉明距离。比较两个比特串有多少个位不一样，简洁的操作时就是两个比特串进行异或之后包含\
    \ 1 的个数。汉明距在图像处理领域也有着广泛的应用，是比较二进制图像非常有效的手段。汉明距离的本质是两个数异或后字符\"1\"的个数，可以直接使用异或实现。可以编写\
    \ Python 函数如下：\n\n```\ndef hammingDistance(self,x: int,y: int) -> int:\n    return\
    \ bin(x^y).count('1')\n```\n\n# (4) 设计与实践\n\n# 1) 摄像头参数设置及控制\n\n在计算机视觉开源库中，提供\
    \ Python 语言编写的 Sensor 对象用于设置摄像头的工作参数。基于边缘与角点检测的图像匹配应用中，编程设置摄像头的工作参数需要注意如下：\n\n\
