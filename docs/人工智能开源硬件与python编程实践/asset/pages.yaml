    2006 年以前，人们尝试用神经网络的方法去训练语音数据，试图建立起深度架构。这些用浅层网络的学习训练一个深度的有监督前馈神经网络都失败了。失败的主要原因是梯度不稳定，并且监督学习数据的获取也非常昂贵，梯度下降算法对初始值的敏感也使深度网络参数难以训练。


    直到 2006 年，研究者提出逐层贪婪无监督预训练深度网络之后，一些知名的研究团队成功地将深度学习应用到自己的语音识别系统中，相比起采用使单词错误率降低了约
    30%，取得了语音识别领域中的突破性进展。随后，基于上下文相关的深度神经网络—隐马尔可夫模型（DNN-HMM）对大词汇量语音识别的研究取得成果，改变了语音识别系统的原有技术框架。


    # 4) 深度学习神经网络 ( DNN ) 方法在语音识别中的应用


    ①深度学习神经网络 (DNN) 对语音数据的训练。基于 DNN 方法去训练深度学习神经网络语音识别系统架构的过程分为以下两步：


    第一步，从底往上的非监督学习，就是用无标签数据进行每一层的预训练（Pre-training），而每一层的训练结果作为其高一层的输入，这是与传统神经网络相比最大的区别，这个过程可看作是特征学习（Feature
    Learning）的过程。


    第二步，从顶向下的监督学习，就是用有标签的数据调整所有层的权值和阈值，按照误差反向传播算法（Back Propagation, BP）自顶向下传输，对网络进行微调（Tune-fining）。


    由于深度学习的第一步不是跟传统神经网络一样去随机初始化，而是通过学习数据的结构得到，所以这个初值更接近全局最优，进而取得更好的结果。因此相比单纯使用 BP
    算法，深度学习算法效果好，要归功于第一步的特征学习。


    ②利用深度学习进行语音特征提取。在已经商用的 HMM 隐马尔可夫语音识别系统中，使用高维的 Mel 倒谱系数（MFCC）作为特征向量，使用隐马尔可夫模型（HMM）或改进的高斯—隐马尔可夫混合模型（GMM-HMM）作为声学模型，用最大似然准则（Maximum
    Likelihood, ML）和期望最大化算法来训练这些模型。利用 MFCC 等语音特征提取算法提取的特征只对单帧信号作用，不能很好地涵盖有效语音信息，也易受噪声污染。对于语音的特征学习和语音识别而言，这个目标可以归纳为对原始频谱特征的使用或是对波形特征的使用。


    过去 30 年以来，虽然对语音频谱进行变换丢失了原始语音数据的部分信'
  merge: -1
