    ②卷积神经网络模型的基本结构。卷积神经网络是一种带有卷积运算的神经网络，采用局部感知域和权值共享的方法，大大减少了网络的参数的个数，不仅降低网络模型的复杂程度，而且缓解了网络模型过拟合的问题。卷积操作对平移、比例缩放以及其他形式的变形具有一定不变性。


    典型的卷积神经网络主要由输入层、卷积层、池化层、全连接层和输出层构成，其结构图如图 12.5 所示。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_164_0.png)


    - 输入层:用于将数据输入神经网络中。卷积神经网络中输入层的结构可以是多维的，例如 MNIST 数据集中是 28 × 28 像素的灰度图片，因此输入为 28
    × 28 的二维矩阵。


    - 卷积层:使用卷积核提取特征。在卷积层，用一个参数可调的卷积核与上一层特征图进行滑动卷积运算再加上一个偏置量得到净输出，最后通过一个激活函数就能得到卷积的结果，即输出特征映射图。

    卷积后输出的矩阵数据成为特征映射图，一个卷积核输出一个特征映射图，卷积操作是一种线性计算，因此通常在卷积后进行一次非线性映射。


    - 池化层:将卷积得到的特征映射图进行稀疏处理，减少数据量，操作与卷积基本相似，不同的是卷积操作是一种线性计算，而池化的计算方法更多样化，一般有如下计算方式:'
