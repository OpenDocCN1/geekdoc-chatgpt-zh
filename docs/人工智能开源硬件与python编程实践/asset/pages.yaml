  md: '有(2 x 2 + 1) x 6 x 14 x 14。输出特征图 feature map 的大小为 14 x 14 (28/2)。S2 中每个特征图的大小是
    C1 中特征图大小的 1/4。


    ④ C3 层也是一个卷积层。输入为 S2 中所有 6 个或者几个特征 map 组合，卷积核大小为 5 x 5，卷积核种类为 16 个，输出特征图 feature
    map 的大小为 10 x 10。


    C3 中的每个特征 map 是连接到 S2 中的所有 6 个或者几个特征 map 的，表示本层的特征 map 是上一层提取到的特征 map 的不同组合。


    存在的一个方式：C3 的前 6 个特征图以 S2 中 3 个相邻的特征图子集为输入。接下来 6 个特征图以 S2 中 4 个相邻特征图子集为输入。然后的 3
    个以不相邻的 4 个特征图子集为输入。最后一个将 S2 中所有特征图为输入。


    可训练参数为: 6 x (3 x 25 + 1) + 6 x (4 x 25 + 1) + 3 x (4 x 25 + 1) + (25 x 6 + 1)
    = 1 516, 连接数: 10 x 10 x 1 516 = 151 600。


    ⑤ S4 层是一个下采样层。输入为 10 x 10，采样区域为 2 x 2，采样种类有 16 种，采样方式: 4 个输入相加，乘以一个可训练参数，再加上一个可训练偏置，结果通过
    Sigmoid 激活函数得到特征映射图。


    输出 feature map 大小为 5 x 5 (10 / 2)，神经元数量为 5 x 5 x 16 = 400，可训练参数为 2 x 16 = 32 (和的权
    + 偏置)，连接数为 16 x (2 x 2 + 1) x 5 x 5 = 2 000。


    S4 中每个特征图的大小是 C3 中特征图大小的 1/4。


    ⑥ C5 层是一个卷积层。输入为 S4 层的全部 16 个单元特征 map ( 与 S4 全相连)，卷积核大小为 5 x 5，卷积核种类为 120，输出 feature
    map 大小为 1 x 1 x (5 - 5 + 1)，可训练参数/连接数为 120 x (16 x 5 x 5 + 1) = 48 120。


    ⑦ F6 层全连接层。输入为 C5 120 维向量，计算方式：计算输入向量和权重向量之间的点积，再加上一个偏置，结果通过 Sigmoid 函数生成，可训练参数为
    84 x (120 + 1) = 10 164。


