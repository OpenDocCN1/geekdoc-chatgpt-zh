- pgno: 108
  md: '广,如人脸检测等。Haar-like 分为边缘特征、线性特征、中心特征和对角线特征等,组合成特征模板。特征模板内只有白色和黑色两种矩形,并定义该模板的特征值为白色矩形像素和减去黑色矩形像素和。


    Haar-like 特征值反映了图像的灰度变化情况。对于人脸图像,脸部的一些特征能由矩形特征来简单描述,如眼睛要比脸颊颜色要深,鼻梁两侧比鼻梁颜色要深,嘴巴比周围颜色要深等。在人脸检测应用中,将任意一个矩形模板移动到人脸区域上,计算将白色区域的像素和减去黑色区域的像素和,得到的值就是人脸的特征值。如果把该矩形移动到非人脸区域,那么计算出的特征值应该和人脸特征值是很不一样的。通过
    Haar-like 特征的计算实现了人脸特征的量化,以便区分人脸和非人脸。


    # 3）Haar-like 特征的快速计算


    Haar-like 特征的计算公式很简单,就是拿黑色部分的所有的像素值的和减去白色部分所有像素值的和。实际上的计算量是很大的,在工程中引入积分图的方法,进行快速计算某个矩形内的像素值的和。对一个灰度图像
    I 而言,其积分图也是一张与 I 尺寸相同的图,只不过该图上任意一点（x,y）的值是指从灰度图像 I 的左上角与当前点所围成的矩形区域内所有像素点灰度值之和。


    当把图像扫描一遍,到达图像右下角像素时,积分图像就构造好了。积分图构造好之后,图像中任何矩阵区域的像素累加和都可以通过简单运算得到。只遍历一次图像就可以求出图像中所有区域像素和的快速算法,大大提高了图像特征值计算的效率。


    # 4）弱学习、强学习与 Adaboost 级联分类算法


    所谓的弱学习,就是指一个学习算法对一组概念的识别率只比随机识别好一点。所谓强学习,就是指一个学习算法对一组概率的识别率很高。研究工作表明,只要有足够的数据,弱学习算法就能通过集成的方式生成任意高精度的强学习方法。


    如图 8.3 所示的各种 Haar-like 特征算子,每一个小黑白块就是一种规则,也是一种特征,还是一个分类器。显然,它们都是弱分类器。把一批准确率很差的弱分类器级联在一起,变成一个强分类器,这就是
    Adaboost Cascade 级联分类算法的核心思想。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_109_0.png)


    图 8-3 各种 Haar-like 特征算子


    Adaboost 是一种迭代算法：先通过对 N 个训练样本的学习得到第一个弱分类器；将分错的样本和其他的新数据一起构成一个新的 N 个的训练样本，通过对这个样本的学习得到第二个弱分类器；将前面部分错了的样本加上其他的新样本构成另一个新的
    N 个的训练样本，通过对这个样本的学习得到第三个弱分类器；依次继续。然后把这些弱分类器集合起来，构成一个强分类器。


    # 5) Haar 分类器的训练


    Haar 分类器训练基于 Adaboost Cascade 级联算法进行，具体可分为五大步骤：


    +   ①采集人脸图像，建立人脸、非人脸样本集。

    +   ②计算 Haar-like 特征值和积分图。

    +   ③进行弱分类器训练，筛选出 T 个最优弱分类器。

    +   ④把这 T 个最优弱分类器传给 Adaboost 算法，训练出区分人脸和非人脸的强分类器。

    +   ⑤使用筛选式级联把强分类器级联到一起，提高准确率。


    实际训练中，一般都是采用 20 x 20 像素的小图像块，计算出的特征数量达数万个，筛选出 T 个优秀的特征值（即最优弱分类器），然后把这 T 个最优弱分类器传给
    Adaboost 进行训练得到一个强分类器，最后将强分类器进行级联。由算法的训练过程可知，当弱分类器对样本分类正确，样本的权重会减小；而分类错误时，样本的权重会增加。这样，后面的分类器会加强对错分样本的训练。最后，组合所有的弱分类器形成强分类器，通过比较这些弱分类器投票的加权和与平均投票结果来检测图像。'
  merge: -1
  img_proc: true
