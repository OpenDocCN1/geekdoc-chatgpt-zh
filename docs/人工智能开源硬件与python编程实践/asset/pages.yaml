    以往春运期间，火车站进站口总是人满为患，给旅客和管理人员带来了很大的不便。究其原因，检票人员单靠人工检票很难检验出旅客是否“人、证、票”相统一，影响了工作效率，造成进站速度变得非常缓慢。2017
    年 1 月，北京西站开通了人脸识别检票系统，也就是“刷脸”进站，开启了铁路检票服务新时代。“刷脸”进站速度很快，3 ~ 6 s 便能成功通行，解放了人力，也方便了旅客。这种新的检票进站方式被迅速推广到全国，如图
    2.1 所示。


    “刷脸”进站采用了人脸识别技术，这是基于人的脸部特征信息进行身份识别的人工智能技术。它需要利用摄像机或摄像头采集含有人脸的图像或视频流，并自动在图像帧中检测和跟踪人脸，进而对检测到的人脸进行特征识别。刷脸进站时，自动检票闸机上都安装了摄像头，旅客走近机器时，它会抓取旅客脸部信息，与身份证芯片里的照片进行对比，票证信息相符以及人脸与证件照比对通过，闸机就会自动放行。


