  md: '功能；

    ④针对生活应用场景，进一步开展创意设计，设计具有实用价值的物体形状检测应用系统。


    # (3) 知识准备


    # 1）图像预处理


    计算机采集视频图像的时候，会受到各种环境光的影响，还有抖动等干扰，输入的图像会有失真和引入噪声。另外，摄像机的位置和参数设置都会对图像的质量带来影响。为了便于特征提取，提升图像识别的精确度，需要对图像先进行预处理。图像预处理方法一般包括灰度化、二值化、图像增强、图像去噪和边缘检测等。


    ①灰度化。在图像检测及识别等应用过程中，如果直接对图像中的颜色信息进行提取，容易受到复杂背景、光照、噪声的影响，存在干扰。人们发现灰度图像是一种简单的对比度增强方法，有助于图像识别等过程，因而被研究人员广泛使用。


    灰度化是一种常用的图像预处理方法，它将彩色图像转化为灰度图像，应用在图像分析与识别等应用中。根据光的颜色 RGB 空间模型，物体的颜色由红（R）、绿（G）、蓝（B）3
    种基本的颜色组成，不同量值的 R、G、B 形成不同的颜色呈现。在 RGB 空间模型中，空间的原点对应的是黑色，距离原点最远的那个顶点对应的是白色。连接原点和这个顶点，连线段上对应了从黑色到白色的灰度值，也称亮度值。


    彩色图像中的每一个像素的颜色都是由 R、G、B 3 个分量决定的，而每个分量都有 255 个值，在 RGB 颜色空间中，大约有 1 600 万种不同的颜色。灰度图像只含有亮度信息，不含色彩信息，其亮度是连续变化的，要表示灰度图像就需要把亮度值进行量化，通常把灰度划分为
    256 个灰度级，从 0 到 255。灰度值越接近于 0，对应像素点越接近黑色。灰度值越接近于 255，对应像素点越接近白色。


    在早期的图像识别应用中，为了减少数据的计算量，都是直接将各种彩色图像转变为灰度图像再进行后续运算。当前应用广泛的嵌入式系统，单片机的运算资源和能力均有限，也需要将彩色图像灰度化才能开展后续处理'
  merge: -1
  img_proc: true
- pgno: 54
  md: '工作。


    ②二值化。二值化也是图像预处理的一种技术，又称图像黑白化。通过二值化的处理，可以凸显出图像的轮廓。它将像素点的灰度值设置为 0 或者 255，不采用其他灰度值，目的是使整个图像都呈现出黑白效果。通过选取合适的阈值，将
    256 个不同等级的灰度图像进行划分，划分结果仍然可以描绘图像的整体或局部特征，这样就实现了图像的二值化。


    在图像预处理过程中，首先进行图像灰度化处理，再做二值化处理，从而减少图像数据的存储空间，减少了数据的运算量，提高了系统的实时性。在此基础上，进行开闭、腐蚀、膨胀、连通等图像形态学计算，就可以得到角点、边缘、轮廓等特征，供模式匹配及机器学习等算法使用。


    # 2) 霍夫变换


    图像中的形状检测主要是侦测诸如直线、圆形、椭圆形、矩形等几何形状，计算机视觉应用中常用的算法是霍夫变换。


    霍夫变换由保罗·霍夫(Paul Hough)提出，起初用来检测图像中的直线，后来扩展到检测矩形、圆和椭圆等任意形状的物体。霍夫变换是通过直角坐标系和极坐标系之间的变换将图像空间中具有相同特征的直线或者曲线映射到参数空间中的一个点上，然后在参数空间中对点进行描述，使结果更易识别和检测，最后用累加器进行累加，从而把检测图形的问题转化为寻找最大累加值的问题。


    霍夫变换的核心过程就是将离散的点映射到参数空间，在参数空间内累计最多的点就是初始空间内决定直线或曲线的参数。霍夫变换的一般步骤可以描述如下：


    +   ①用 Canny 进行边缘轮廓提取。在做霍夫变换时，如果将所有的像素点都做似射处理，会导致计算量太大，一般都是先用 Canny 算子对边缘轮廓做提取，尽可能去掉平滑区域的点，减少计算量。


    +   ②利用二值化的方法以及开闭等形态学操作提取轮廓，去掉噪声等扰动，求得在拟合线性方程时尽可能准确。


    +   ③利用霍夫变换完成空间映射。


    +   ④用计数器统计出现次数最高的未知系数组合，如(ρ, θ)等。


    # 3) 直线检测


    霍夫变换检测直线是其最基本的应用，其实就是根据提取出的很多特征点(X₀, Y₀), (X₁, Y₁), ..., (Xₙ, Yₙ) 求待拟合直线 Y = kX
    + b 中的斜率 k 和偏移'
