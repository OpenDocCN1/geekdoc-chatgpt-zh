  md: '题。实际研究工作中，使用 5 层 DNN 模型替换 GMM-HMM 系统中的混合高斯模型（GMM），并以单音素状态态作为建模单元，取得了成功。尽管单音素比三音素（Triphone）的表征能力差一些，但使用单音素的
    5 层 DNN-HMM 构架的方法却比已经实用的三音素 GMM-HMM 系统识别率更高，并且 DNN 对 HMM 中后验概率的估计不需要很苛刻的数据分布假设，条件更宽泛。与现有建模分类器相比，DNN
    最主要的优势是加强了语音帧与帧之间的联系。


    大量研究表明，将深度学习应用于提取语音特征和取代 HMM 中的 GMM 模型非常成功，并且将深度学习成功应用到语音识别当中。研究人员也在不断研究新的深度学习神经网络模型取代整个语音识别系统来构建更好的语音识别系统。


    # 5) 卷积神经网络（CNN）在语音识别中的应用


    由于 CNN 在计算机视觉、图像处理中的成功应用，近两年来研究人员开始将其应用到语音识别领域。相比以上两种深层神经网络，CNN 可在保证识别率的同时，还能大大降低模型的复杂度，从而降低语音识别过程中对最开始的语音特征提取的依赖。值得注意的是，二维图像作为
    CNN 的输入数据，两个维度上的特征物理意义一样，但将语音作为二维特征输入时，其物理意义又不相同。文献提到，将语音的二维特征分为时域和频域两个维度，此时 CNN
    中的 C 层可看作是通过滤波器对局部频域特征的观察，进而抽取局部有用信息。而 S 层是在相邻两个 feature map 的输出节点中选择最大值作为输出。之后与图像一样，最终需通过一个全连接层得到各个状态的分类后验概率来得到分类结果。2012
    年，多伦多大学初步建立了 CNN 用于语音识别的模型结构，并同 DNN 训练算法相比取得了 10% 的性能提升。


    CNN 通过卷积实现对语音特征局部信息的抽取，再通过聚合加强模型特征的鲁棒性。卷积神经网络由一组或多组卷积层 + 聚合层构成。一个卷积层中包含若干个不同的卷积核，这些卷积核对语音的各个局部特征进行观察。聚合层通过对卷积层的输出结点做固定窗长的聚合，减少下一层的输入结点数，从而控制模型的复杂度。一般聚合层采用最大聚合算法，即对固定窗长内的结点选取最大值进行输出。最后，通过全网络层将聚合层输出值综合起来，得到最终的分类判决结果。图
    16.5 给出了卷积神经网络用于语音识别声学建模时，典型的卷积层和聚合层的结构，在标准英文连续语音识别库 TIMIT 以及汉语电话自然口语对话数据集上面进行了实验，对卷积神经网络的输入特征、卷积核尺寸和个数、计算量和模型规模等做了详细的对比实验，取得了较好的效果。'
