- pgno: 3
  md: '# 内容提要


    本书是基于机器视觉，语音识别等典型方法的开源硬件及开源算法，利用 Python 编程工具而设计

    的创新实践项目。本书注重推动人工智能新技术的工程实践，将人工智能教育与创客教育相结合，课

    程模块包括颜色形状检测，目标跟踪，边缘检测，轨迹跟踪，人脸检测，人脸检测，瞳孔检测，条码二维码

    识别，笑脸检测，数字识别，语音识别等实践项目。每个课程模块均从社会需求及生活实际出发设置实践

    任务，介绍相关的理论知识和应用方法，提供相应算法的 Python 实施案例，引导学生动手实践，掌握

    经典机器视觉，语音识别技术的应用方法，并能够解决实际问题，培养学生的创新实践能力，可作为高

    等院校学生创新实践类课程教材。


