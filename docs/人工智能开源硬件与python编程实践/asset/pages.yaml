  md: 'TensorFlow 的函数进行封装,使其变得简洁,比较有名的是 Keras，TFLearn,TF-Slim,以及 TensorLayer。


    ②Caffe/Caffe2。Caffe 的全称是 Convolutional Architecture for Fast Feature Embedding，是一个清晰、高效的深度学习框架，核心语言是
    C + +，支持命令行、Python 和 MATLAB 接口,可以在 CPU 上运行,也可以在 GPU 上运行。Caffe 是一个兼具性能、速度和模块性的开源深度学习框架,应用较为广泛。


    Caffe 的负责人从加州伯克利分校毕业后加入了 Google,参与过 TensorFlow 的开发,后来离开 Google 主持开发了 Caffe2。Caffe2
    的设计追求轻量级,强调便携性。


    Caffe 的优点是简介快捷,性能优异,不同于 Keras 由于太多封装导致灵活性丧失,广泛应用在嵌入式人工智能系统开发中。


    ③PyTorch。PyTorch 在学术研究者中很受欢迎,也是相对比较新的深度学习框架,由 Facebook 人工智能研究院组织开发 PyTorch 采用已经为许多研究人员、开发人员和数据科学家所熟悉的原始
    Python 命令式编程风格。同时它还支持动态计算图,这一特性使得其对时间序列以及自然语言处理数据相关工作的研究人员和工程师很有吸引力。PyTorch 的特点是封装简洁,接口调用方便,调试简单,性能突出。


    PyTorch 类似于 NumPy,非常 Python 化,很容易与 Python 生态系统进行集成。可以在 PyTorch 模型中任意添加 pdb 断点,调试方便。PyTorch
    灵活易用,API 接口设计合理简洁,深受研究开发人员喜欢。


    PyTorch 的设计遵循高维数组(张量),自动求导(变量)和神经网络(层/模块),这 3 个由低到高的抽象层次,追求最少的封装,尽量避免重复。


    ④PaddlePaddle。PaddlePaddle 是百度研发的开源开放的深度学习平台,是国内最早开源,也是当前唯一一个功能完备的深度学习平台。依托百度业务场景的长期锻炼,PaddlePaddle
    有最全面的官方支持的工业级应用模型,涵盖自然语言处理、计算机视觉、推荐引擎等多个领域,并开放多个领先的预训练中文模型,以及多个在国际范围内取得竞赛冠军的算法模型。


    PaddlePaddle 同时支持稠密参数数和稀疏参数场景的超大规模深度学习并行训练,支持千亿规模参数、数百个几点的高效并行训练,也是最早提供如此强大的深度学习并行技术的深度学习框架。PaddlePaddle
    拥有强大的多端部署能力,支持服务器端、移动端等多种异构硬件设备的高速推理,预测性能有显著优势。目前 PaddlePaddle 已经实现了 API 的稳定和向后兼容,具有完善的中英文双语使用文档,形成了易学易用、简洁高效的技术特色。


