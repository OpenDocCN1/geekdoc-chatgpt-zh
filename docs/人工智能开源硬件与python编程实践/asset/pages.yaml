  md: 'Lab 色彩模型是由亮度( Luminosity )和有关色彩的 a,b 3 个要素组成。a 表示从洋红色到绿色的范围,b 表示由黄色到蓝色的范围。即
    a 的正数代表红色,负端代表绿色,b 的正数代表黄色,负端代表蓝色。L 取值范围是[0,100],当 L = 50 时,相当于 50% 的黑。a,b 的值域都是[-
    128,127]。当 x = -128 时,a 是绿色,b 是蓝色;当 x 渐渐过渡到 127 时,a 渐渐变成了洋红色,b 渐渐变成了黄色。所有的颜色可以由这
    3 个值交互变化组成。例如,当 Lab 取值为(100,30,0) 时,色彩表现为粉红色。


    Lab 模式中,a 轴和 b 轴与 RGB 模型相比,洋红色更加偏红,绿色更加偏青,黄色略带红色,蓝色略偏青色。Lab 模型具有不依赖设备的优点,除此之外,它还具有宽阔的色域优势。色域范围内不仅包含了
    RGB,CMYK 的所有色域,还能表示它们不能表现的色彩。人类能感知的色彩,都能通过 Lab 模型表现出来。另外,Lab 色彩模型弥补了 RGB 色彩模型中分布不均匀的不足,在
    RGB 模型中蓝色到绿色之间过渡的色彩多,而绿色到红色之间缺少黄色和其他色彩。所以,如果想在数字图像处理中保留宽阔的色域和丰富的色彩,最好选择 Lab 模型。


    Lab 模型又称亮度-对比度模型,被设计来接近人类视觉。OpenMV、OpenCV 等很多图像处理库都是基于 Lab 模式进行颜色模型参数的训练,设计查找色块的算法。


    # 2) 基于 Lab 色彩空间的图像分割


    Lab 颜色空间中,L——亮度层,a——颜色在红绿轴的分量,b——颜色在蓝黄轴的分量。通过计算每个像素点和 6 种颜色平均值的欧氏距离,这 6 种距离中最小的距离即为该像素点的颜色。这种方法又称为最近邻近法。例如:如果像素点距离红色平均值的欧氏距离最小,那么该像素点就为红色。对提取出的像素点进行形态学处理,如腐蚀、膨胀、孔洞填充等,随后进行连通区域的提取。


    Lab 阈值分割法有两个关键步骤:第一,确定进行正确分割的阈值;第二,将图像的所有像素与阈值进行比较,以进行区域划分,达到目标与背景分离的目的。在这一过程中,正确确定阈值是关键,只要能确定一个合适的阈值就可以完成图像的准确分割。


    Lab 各分量的阈值设定一般是根据先验知识。实际应用中,现场光照情况不尽相同,常常出现所给定的阈值并不是最合适的。这时可以设计阈值计算算法,为每种颜色选定一个小样本采集区域,然后计算样本区域中这种颜色的平均值,作为颜色追踪过程的阈值参数。'
