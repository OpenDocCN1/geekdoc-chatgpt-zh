- pgno: 208
  md: '②统计声学模型。典型系统多采用基于一阶隐马尔科夫模型进行建模。发音词典包含系统所能处理的词汇集及其发音，实际提供了声学模型建模单元与语言模型建模单元间的映射。


    ③语言模型。语言模型对系统所针对的语言进行建模。理论上，包括正则语言，上下文无关语法在内的各种语言模型都可以作为语言模型，但目前各种系统普遍采用的还是基于统计的
    N 元文法及其变体。


    ④解码器。解码器是语音识别系统的核心之一，其任务是对输入的信号，根据声学、语言模型及词典，寻找能够以最大概率输出该信号的词串。


