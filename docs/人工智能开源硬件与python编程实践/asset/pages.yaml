    ③图像分类识别编程。OpenAIE 内嵌的 caffee 库中有 net.search( image[ , roi[ , threshold = 0.6[
    , min_scale = 1.0[ , scale_mul = 0.5 [ , x_overlap = 0[ , y_overlap = 0[ , contrast_threshold
    = 1 [ , softmax = False]]]]]]]] ) 方法，用来以滑动窗口方式在图像 roi 上运行神经网络。网络检测器窗口以多种比例滑过图像。返回神经网络检测结果的
    nn_class 对象列表。


    其中，roi 是待处理区域的矩形元组( x,y,w,h )，仅运算 roi 中的像素。如果未指定，则它等于图像矩形。在图像中的区域上运行之后，将最大检测值超过
    threshold 的对象添加到输出列表中。min_scale 控制网络模型的缩放比例。在默认值下，网络不会缩放。但是，值为 0.5 将允许用于检测图像大小为
    50% 的对象。scale_mul 控制测试多少个不同的比例。滑动窗口方法的工作原理是将默认比例 1 乘以 scale_mul，并且结果需要大于 min_scale。scale_mul
    的默认值 0.5，测试每个比例变化减少 50% 。但是，0.95 的值仅为 5% 的缩小量。x_overlap 控制与滑动窗口的下一个检测区域重叠的百分比。值为
    0.95 意味着 95% 重叠。y_overlap 控制与滑动窗口的下一个检测区域重叠的百分比。值为零表示没有重叠。值为 0.95 意味着 95% 重叠。contrast_threshold
    控制跳过图像低对比度区域的阈值。在图像中的某个区域上运行 nn 之前，将在该区域上计算标准偏差，如果标准偏差低于 contrast_threshold ,则跳过该区域。如果
    softmax 为 True，则列表中所有的输出总和为 1。否则，列表中的任何输出都可以在 0 和 1 之间。


