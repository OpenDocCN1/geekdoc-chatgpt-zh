    无人机具有起降快速、操控方便、结构轻便、飞行灵活、经济性好等突出优点，在生活中得到了广泛应用。航拍已成为无人机的主流应用，不仅应用在个人摄影、旅游中，还大量应用于大型公共活动、环境监测、资源调查、灾害防范、城市管理等公共事业中(图
    6.1)。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_80_0.png)


    图 6.1 无人机航拍


    无人机航拍得到的图像，往往需要进行图像比对、拼接、整合等图像配准工作。应用图像配准技术的一般流程：首先对两幅图像进行特征提取得到特征点，再通过进行相似性度量找到匹配的特征点对，然后通过匹配的特征点对得到图像空间坐标变换参数，最后由坐标变换参数进行图像配准。其中，特征提取是配准技术中的关键，寻找准确性高的特征提取方法将为特征匹配的成功提供保障。


    # (2) 任务与目标


    +   ①了解图像特征检测与配准技术的基本原理、相关算法和应用框架；

    +   ②掌握运用人工智能开源硬件设计智能应用系统的方法，掌握 Python 语'
