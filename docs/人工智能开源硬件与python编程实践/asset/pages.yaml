    # 图 12.3 神经网络的激活函数


    早期的神经网络采用的激活函数通常是 Sigmoid 或者 Tanh 函数，这两种函数最大的缺点就是其饱和和性。当输入的 x 过大或过小时，函数的输出会非常接近
