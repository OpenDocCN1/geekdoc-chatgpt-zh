  md: '法用于查找图像中的矩形，返回一个 image. rect 对象的列表。该方法适用于检测与背景形成鲜明对比的矩形。


    其中，roi 是一个用以搜索的矩形区域(x, y, w, h)，图像操作范围仅限于 roi 区域内的像素。如果未指定，默认的 roi 即整幅图像。


