- pgno: 81
  md: '言的编程方法；

    ③应用人工智能开源硬件和 Python 相关算法模块，设计图像匹配功能；

    ④针对生活应用场景，进一步开展创意设计，设计具有实用价值的图像匹配应用系统。


    # (3) 知识准备


    图像特征匹配技术主要包括 3 个方面，即特征检测、特征描述和特征匹配。其中，特征检测过程主要是利用各种特征检测子提取出图像中比较明显的形状特征、纹理特征等。特征描述则是确定表征图像特征信息的向量，也就是将从图像区域提取的特征信息，按照一定的计算、存储规则转换为特征描述子信息结构。最后，不同图像中的多个特征有着一定的关联，通过欧氏距离或者汉明距离进行特征匹配。


    # 1) 图像特征提取


    图像特征包括颜色特征、纹理特征、形状特征以及局部特征点等。局部特征点是图像特征的局部表达，反映图像上具有的局部特殊性，适合于对图像进行匹配、检索等应用。全局特征容易受到环境的干扰，光照、旋转、噪声等不利因素都会影响全局特征。相比而言，局部特征点，往往对应着图像中的一些线条交叉、明暗变化的区域，受到的干扰也少。


    斑点与角点是两类局部特征点。斑点通常是指与周围有着颜色和灰度差别的区域，如树上的红苹果。角点则是图像中一边物体的拐角或者线条之间的交叉部分。斑点是一个区域，它比角点的抗噪能力要强，稳定性要好。


    斑点检测的方法主要包括利用高斯拉普拉斯算子检测的方法（LoG），以及利用像素点 Hessian 矩阵及其行列式值的方法（DoH）。无论是 LoG 还是 DoH，它们对图像进行斑点检测的步骤都可以分成两步：先按照各自的模板对图像进行卷积运算，然后在图像的位置空间与尺度空间中搜索
    LoG 与 DoH 响应的峰值。


    角点检测的方法很多，其中具有代表性的算法是 Harris 算法与 FAST 算法。在实际工作中，特征检测过程常常利用各种特征检测子提取出图像中比较明显的形状特征、纹理特征等，特别是二进制特征检测子。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 2) 角点检测 FAST 与 AGAST 方法


    根据 FAST 算法提出者 Rosten 等人的定义：若某像素与其周围邻域内足够多的像素点相差较大，则该像素可能就是 FAST 角点。FAST 算法包含以下主要步骤：


    +   ①对固定半径圆上的像素进行分割测试，通过逻辑测试可以去除大量的非特征候选点。


    +   ②基于分类的角点特征检测，ID3 分类器根据 16 个特征判决候选点是否为角点特征，每个特征的状态为 -1, 0, 1。


    +   ③利用非极大值抑制进行角点特征的验证。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_82_0.png)


    图 6.2 FAST 算法固定半径的圆形模板


    总结起来，FAST 算法先比较中间点与固定半径圆模板经过的连续的 12 或 9 个像素点的灰度值，若有连续 12 或 9 个邻域像素值都大于或都小于中心像素点，则认为是候选特征点（图
    6.2）。然后用 ID3 信息增益算法进行决策树的训练。最后，通过定义特征点响应函数进行角点的非极大值抑制，配合金字塔模型，对不同尺度的图像进行特征点检测。


    AGAST 检测算子主要应用了模式为 FAST9-16 的检测算子，分别使用相同阈值 T 对各个图像组以及内插组来对关键点进行提取与检测，即在提取的关键点周围
    16 个圆环点中至少存在 9 个连续的点，这 9 个连续的点一定要与中心点的像素值不同。对满足条件的关键点进行提取，并应用非极大值抑制方法来去除不稳定的特征点。


    # 3) 角点检测实现过程


    生活中，图像匹配技术可以应用在图像检测、图像拼接、特征识别、目标跟踪等很多场合。其中，角点匹配是图像匹配技术的典型应用。所谓角点匹'
  merge: -1
  img_proc: true
- pgno: 83
  md: '配，是指寻找两幅图像之间的特征像素点的对应关系，从而确定两幅图像的位置关系，方便后续的图像拼接、鉴别等工作。


    角点匹配可以分为以下 4 个步骤：


    +   ①提取检测子。在两张待匹配的图像中寻找那些最容易识别的像素点（角点），比如纹理丰富的物体边缘点等。


    +   ②提取描述子。对于检测出的角点，用一些数学上的特征对其进行描述，如梯度直方图、局部随机二值特征等。检测子和描述子的常用提取方法有 SIFT、HARRIS、SURF、FAST、AGAST、BRISK、FREAK、ORB
    等。


    +   ③匹配。通过各个角点的描述子来判断它们在两张图像中的对应关系，常用方法有 FLANN。


    +   ④去外点。去除错误匹配的外点，保留正确的内点。常用方法有 RANSAC、GTM。


    # 4）图像特征描述


    图像特征描述过程首先定义出特征描述子，然后计算出表征特征信息的向量，也就是决定在特征区域提取图像的哪些信息，按照一定的计算、存储规则转换为特征描述信息。传统的特征描述子需要进行大量的浮点数运算，并且存储为高维度的特征向量。


    二进制特征描述的方法从图像的强度信息出发，采用二值的特征向量，不需要先计算出复杂的特征向量然后优化，描述阶段算法的时间空间性能都高于其他种类的特征方法。在特征匹配阶段可以使用汉明距离进行匹配，只需要简单地执行异或操作就可以，简洁而且快速，会大幅简化计算过程。


    二进制特征描述特别适用于对于计算和存储资源有限的嵌入式应用环境，应用广泛的二进制特征描述子有 BRIEF、ORB、BRISK 和 FREAK 等。


    +   ①二进制特征 BRIEF。BRIEF (Binary Robust Independent Elementary Features) 是 Calonder
    等人在 2010 年提出的，也是二进制描述方法中最简单的一种。BRIEF 基于强度差异测试，具有节约内存、计算和匹配高效等优点，可以与 Cen Sure、FAST
    等其他特征点检测子配合使用。


    BRIEF 方法用少量的强度对比点对就可以表征图像像块，构造简单并且节约空间，具有很低的计算和存储要求。BRIEF 方法的二进制特征可以通过计算机的异或操作（XOR）快速地计算出描述子之间的汉明距离，进而通过汉明距离判断图像间的相似性。


    BRIEF 算法的主要思想：在特征点周围邻域内选取若干个像素点对，通过对这些点对的灰度值比较，将比较的结果组合成一个二进制串字符串用来'
  merge: -1
  img_proc: true
- pgno: 84
  md: '描述特征点，然后使用汉明距离来计算在特征描述子是否匹配。


    在图像识别工作中，BRIEF 测试结果可以用来训练随机分类树或者贝叶斯分类器，应用于识别不同视角的图像块。不同于 SIFT 和 SURF 等方法，BRIEF
    没有计算特征点的方向，因此不具有图像的旋转不变性；此外，还有对噪声敏感，不具备尺度不变性等缺陷。


    ②二进制特征 ORB。ORB（Oriented FAST and Rotated BRIEF）是对 BRIEF 描述子的改进，具体来说是针对 BRIEF 对噪声敏感和不具有旋转不变性这两个缺点进行改进。


    ORB 可以分为两部分，分别是有方向的 FAST（oFAST）和旋转敏感的 BRIEF（rBRIEF）。在 oFAST 过程中，首先使用 FAST 检测子，检测特征点的位置。为了找到稳定的特征点，使用
    FAST 方法比较一个圆形区域；以圆心像素点为圆心，比较围绕这一圆心的圆周上的部分点。如果能够找到足够的临近点都大于或者都小于圆心点像素，那么这个中心点就是特征点。FAST
    检测子只需要一个参数，就是中心像素点和圆环上的像素点的强度阈值。由于 FAST 特征点会有强烈的边缘反应，可以使用 Harris 角点方法消除边缘效应，通过
    Harris 角点检测对候选特征点排序，选取前 n 个最好的特征点。由于 FAST 方法不会产出多尺度的特征，可以在图像的尺度分层金字塔中，对每一个尺度分别进行以上的
    FAST 操作，计算出每个尺度的特征点。


    通过强度矩心的方法，计算出特征点的方向。首先假定角点的强度矩心是偏离其中心的，因此从中心点到矩心的方向向量可以用来定义特征点方向。不同于 SIFT 方法，ORB
    特征点的方向由梯度直方图的最大值和次大值来决定。


    ORB 算法使用 FAST 进行特征点检测，然后用 BRIEF 进行特征点的特征描述。由于 BRIEF 并没有特征点方向的概念，所以 ORB 在 BRIEF
    基础上引入了方向的计算方法，并在点对的挑选上使用贪婪搜索算法，挑出了一些区分性强的点对用来描述二进制串。


    # 5) 二进制特征的应用方法


    二进制特征作为一种图像局部不变特征，在应用过程中与其他局部不变特征过程类似，即包括特征检测、特征描述和特征匹配环节。


