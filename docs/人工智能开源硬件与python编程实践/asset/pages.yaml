- pgno: 136
  md: '# (3) 知识准备


    # 1) 条形码的基本概念


    条形码是将宽度不等的多个黑条和空白，按照一定的编码规则排列，用以表达一组信息的图形标识符。常见的条形码是由反射率相差很大的黑条（简称条）和白条（简称空）排成的平行线图案。条形码可以用来标出物品的制造厂家、商品名称、生产日期、图书编号、邮政快递编号、设备编号等丰富信息。条形码技术很经济、实用，编码可靠性高，识别速度快，条形码标签易于制作，识别装备成本低廉，广泛应用于商场、图书馆、邮政物流、仓库等重要领域。


    条形码的构成如图 10.3 所示。条形码由黑白相间、宽度不一的线条组成，不论是采取何种规则印制的条形码，都由静区、起始字符、数据字符与终止字符组成。有些条码在数据字符与终止字符之间还有校验字符，具体构成包括：


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_136_0.png)


    图 10.3 条形码的构成


    +   ①静区。静区也称为空白区，分为左空白区和右空白区，左空白区是让扫描设备做好扫描准备，右空白区是保证扫描设备正确识别条码的结束标记。

    +   ②起始字符。第一位字符具有特殊结构，当扫描器读取到该字符时，便开始正式读取代码了。

    +   ③数据字符。条形码的主要内容。

    +   ④校验字符。检验读取到的数据是否正确，不同编码规则可能会有不同的校验规则。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '⑤终止字符。最后一位字符，一样具有特殊结构，用于告知代码扫描完毕，同时还起到只是进行校验计算的作用。


    # 2）条形码的校验


    把条形码从右往左依次编序号为“1,2,3,4……”从序号 2 开始把所有偶数序号位上的数相加求和，用求出的和乘 3，再从序号 3 开始把所有奇数序号上的数相加求和，用求出的和加上刚才偶数序号上的数，然后得出和。再用
    10 减去这个和的个位数，就得到校验码。


    # 3）码制区分


    条形码的码制有很多种编码模式，常用的包括 EAN 码、UPC 码、39 码、128 码、Codabar(库德巴码)等。


    ①EAN 码/UPC 码(统一产品代码)。国际通用的编码体系是一种长度固定、无含义的条码，所表达的信息全部为数字，主要应用于国际商品标识。它只能表示数字，有
    A、B、C、D、E 5 个版本。例如，当 UPC 作为 12 位进行解码时，定义如下：第一位 = 数字标识(由 UCC 统一代码委员会定义)，第 2～6 位
    = 生产厂家的标识位，第 7～11 = 唯一的厂家产品代码，第 12 位 = 校验位。


    ②Codabar(库德巴码)。Codabar 可表示数字 0～9，字符 $，+，-，还有只能用作起始/终止符的 a，b，c，d 4 个字符，可变长度，没有校验位，空白区比窄条宽
    10，非连续性条形码，每个字符表示为 4 条 3 空。其主要应用于物料管理、图书馆、血站和包裹的发送管理。


    ③39 码和 128 码：ASCII 字符集编码，美国国防部和汽车行业最先使用 Code39 码，我国目前为企业内部白定义码制，可以根据需要确定条码的长度和信息，它们的信息可以是数字，也可以包含字母，主要应用于工业生产线领域、图书管理等。


    # 4）条形码的扫描与识别


    将按照一定规则编译出来的条形码识别并转换成有意义的信息，需要经历扫描和译码两个过程。


    ①扫描。条形码的扫描需要扫描器，扫描器利用自身光源照射条形码，再利用光电转换器接受反射的光线，将反射光线的明暗转换成数字信号。常见的条形码扫描器有光笔，CCD，激光，摄像头等。其中，CCD
    多用于手持式扫描器，激光扫描多用于条形码读取设备。近年来，应用摄像头来扫描条形码的情况越来越多，它的优势是对准条码的角度可以随意，可以集成在智能'
