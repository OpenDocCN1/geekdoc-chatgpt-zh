    # (3) 知识准备


    # 1) 聚类与分类


    聚类是将数据对象集合划分成相似的对象类的过程，使得同一个类中的对象之间具有较高的相似性，而不同类中的对象具有较高的相异性。比如，在公共场所的摄像头采集了行人的运动轨迹数据，寻找人群活动热点的工作就可以采用聚类的方法。


    分类则是按照某种标准给对象贴标签，再根据标签来区分归类。也就是说，分类情况下事先定义好了类别，类别数不再变化。比如，在人脸检测应用中，在图像数据中划分为“人脸区”和“非人脸区”两大类。


    分类器需要事先由包含人工标注类别的训练数据训练得到，属于有监督的学习。聚类则没有事先预定的类别，类别数不确定。聚类不需要人工标注和预先训练分类器，类别在聚类过程中自动生成，是一种无监督学习。


    # 2) Haar-like 特征


    Haar-like 特征一种常用的图像特征描述算子，在机器视觉领域应用很'
