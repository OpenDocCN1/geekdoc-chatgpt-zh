    # 3) 分辨率


    分辨率是用于度量位图图像内数据量多少的一个参数，通常表示成 dpi（dot per inch，每英寸点）。简单地说，摄像头的分辨率是指摄像头解析图像的能力，即摄像头的影像传感器的像素数。最高分辨率就是指摄像头最高能分辨图像能力的大小，即摄像头的最高像素数。现在市面上较多的
    30 万像素 CMOS 的分辨率为 640 × 480，50 万像素 CMOS 的分辨率为 800 × 600，如图 2.3 所示。分辨率的两个数字表示的是图片在长和宽上占的点数的单位，一张数码图片的长宽比通常是
    4:3。


    在实际应用中，如果将摄像头用于网络聊天或者视频会议，那么分辨率越高则需要的网络带宽就越大。在嵌入式应用中，图像帧的分辨率设置越高，则需要消耗更多的芯片内存资源，这是实际工作中需要注意的。


    # 4) 灰度图像


    灰度图像是每个像素只有一个采样颜色的图像，这类图像通常显示为从最暗黑色到最亮的白色的灰度。灰度图像与黑白图像不同，在计算机图像领域中黑白图像只有黑白两种颜色，灰度图像在黑色与白色之间还有许多级的颜色深度。


    ①灰度级。图像灰度级指图像中的色度分量亮度的最大值与最小值之'
