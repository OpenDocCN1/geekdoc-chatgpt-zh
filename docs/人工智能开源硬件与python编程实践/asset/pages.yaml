  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_152_0.png)


    # 图 11.4 QR 码图形结构


    ④全方位位读。QR 码具有全方位(360°)识读特点,这是 QR 码优于行排式二维条码如 PDF417 条码的另一主要特点,由于 PDF417 条码是将一维条码符号在行排高度上的截短来实现的,因此,它很难实现全方位识读,其识读方位角仅为
    ± 10°。


    ⑤能够有效地表示汉字。由于 QR 码用特定的数据压缩模式表示汉字,它仅用 13 bit 可表示一个汉字,而 PDF417 条码,Data Matrix 等二维码没有特定的汉字表示模式,因此仅用字节表示模式来表示汉字,在用字节模式表示汉字时,需用
    16 bit(二个字节)表示一个汉字,因此 QR 码比其他的二维条码表示汉字的效率提高了 20%。


    # 5) 二维码解码识别技术


    基于图像处理的二维码解码算法大体上可以分为 5 个步骤:图像预处理、定位与校正,读取数据、纠错以及译码。二维码解码流程如图 11.5 所示。


    首先,要对进行处理。捕获的彩色图像先做灰度化,接下来进行图像预处理。方法是对灰度图像进行二值化,再用滤波算法消除噪声。


    二维码区域定位是一个重要过程。结合图像特征、图像形态学、轮廓跟踪、曲线拟合等技术对二维码区域进行定位计算。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_153_0.png)


    # 图 11.5 二维码解码流程


    定位成功后，要进行校正处理。采用平面投影转换进行图像的校正，然后通过线性插值技术来修正图像。待校正的图像已经是二维图形，可以选用最邻近插值算法，即选择距离坐标点最近的坐标点的像素值作为目标点的像素值。


    提取数据信息前，还要进行去除掩码工作。根据读取到的掩码编号生成掩码图形，对二维码的数据进行去除掩码操作，即用掩码图形对编码区进行异或操作。


    最后是译码输出工作，根据二维码的数据编码规则对数据进行解释。'
  merge: -1
  img_proc: true
