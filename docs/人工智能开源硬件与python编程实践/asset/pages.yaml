  md: '的 1/4 尺寸，也就是在液晶屏幕上输出显示的分辨率是 240 x 320。QVGA 格式图像具备 8 ms 快速响应时间。

    HQVGA 格式的分辨率为 400 x 240，从视觉效果上来说，分辨率为 HQVGA 要更好一些，而且宽高比更接近 16:9。

    QQVGA(160 x 120) 格式在嵌入式应用中也常见，它的尺寸是 QVGA 的 1/4，即分辨率为 160 x 120。


    # 7) 色温与白平衡


    色温是表示光线中包含颜色成分的一个计量单位。从理论上讲，色温是指绝对黑体从绝对零度（- 273 ℃）开始加温后所呈现的颜色。黑体在受热后，逐渐由黑变红，转黄，发白，最后发出蓝色光。当加热到一定的温度时，黑体发出的光所含的光谱成分，就称为这一温度下的色温。


    色温越高，光色越偏蓝，色温越低，光色越偏红。某一种色光比其他色光的色温高时，说明该色光比其他色光偏蓝，反之则偏红。同样，当一种色光比其他色光偏蓝时说明该色光的色温偏高，反之偏低。


    白平衡的基本概念是“不管在任何光源下，都能将白色物体还原为白色”，对在特定光源下拍摄时出现的偏色现象，通过加强对应的补色来进行补偿。摄像机的白平衡设定可以校准色温的偏差。所谓白平衡调节，是通过对白色被摄物的颜色还原（产生纯白的色彩效果），进而达到其他物体色彩准确还原的一种数字图像色彩处理的计算方法。


