  md: '是通过镜头的光学折射，照到感光元件上的。镜头的设置决定了整个画面的大小和远近，甚至清晰和模糊。镜头焦距是镜头最重要的参数，它是指镜头光学后主点到焦点的距离，是镜头的重要性能指标。镜头焦距的长短决定着拍摄的成像大小，视场角大小、景深大小和画面的透视强弱（图
    2.2）。当对同一个被摄目标拍摄时，镜头焦距长的所成的像大，镜头焦距短的所成的像小。


