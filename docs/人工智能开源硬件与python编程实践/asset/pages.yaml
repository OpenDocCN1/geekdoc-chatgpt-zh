  md: '# (3) 知识准备


    # 1) 二维码的基本概念


    二维码是一种比一维码更高级的条码格式。一维码只能在一个方向（一般是水平方向）上表达信息，而二维码在水平和垂直方向都可以存储信息。一维码只能由数字和字母组成，而二维码能存储汉字、数字和图片等信息。因此，二维码的应用领域要广得多。


    二维码是用某种特定的几何图形按一定规律在平面（二维方向上）分布的黑白相间的图形记录数据符号信息的；在代码编制上巧妙地利用构成计算机二进制“0”“1”逻辑比特流的概念，使用若干个与二进制相对应的几何形体来表示文字数值信息，通过图像输入设备或光电扫描设备自动识读以实现信息自动处理。它具有条码技术的一些共性：每种码制有其特定的字符集，每个字符占有一定的宽度，具有一定的校验功能等；同时还具有对不同行的信息自动识别功能及处理图形旋转变化点。


    # 2) 矩阵式二维码


    二维码可以分为堆叠式二维码和矩阵式二维码。堆叠式二维码由多行短截的一维条码堆叠而成，其编码原理是建立在一维条码基础之上，按需要堆积成二行或多行。它在编码设计、校验原理、识读方式等方面继承了一维条码的一些特点，识读设备与条码印刷与一维条码技术兼容。但由于行数的增加，需要对行进行判定，其译码算法与软件也不完全相同于一维条码。


    矩阵式二维码是建立在计算机图像处理技术、组合编码原理等基础上的一种新型图形符号自动识读处理码制（图 11.3）。矩阵式二维码以矩阵的形式组成，在矩阵相应元素位置上用“点”表示二进制“1”，用“空”表示二进制“0”，“点”和“空”的排列组成代码。矩阵式二维码在一个矩形空间通过黑、白像素在矩阵中的不同分布进行编码。在矩阵相应元素位置上，用点（方点、圆点或其他形状）的出现表示二进制“1”，点的不出现表示二进制的“0”，点的排列组合确定了矩阵式二维码所代表的意义。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_149_0.png)


    图 11.3 矩阵式二维码的定义'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 3）二维码的特点


    多行组成的条形码，不需要连接一个数据库，本身可存储大量数据，可应用于物料管理、货物运输，当条形码受一定破坏时，错误纠正能使条形码能正确解码二维码。它是一个多行、连续性、可变长、包含大量数据的符号标识。每个条形码有
    3 ~ 90 行，每一行有一个起始部分、数据部分、终止部分。它的字符集包括所有 128 个字符，最大数据容量是 1 850 个字符。


    二维条码具有储存量大、内容丰富多样、保密性强（高加密性）、追踪性强、纠错能力强、识别率高、成本便宜等特性，特别是即使有一部分磨损或者缺失还是可供识别辨认等特点，使二维码成为一维条码的补充和扩展，应用得更加广泛。


    +   ①编码信息容量大。可容纳多达 1 850 个大写字母，或 2 710 个数字，或 1 108 个字节，或 500 多个汉字，比普通条码信息容量约高几十倍。


    +   ②编码范围广。二维码可以把图片、声音、文字、签字、指纹等可以数字化的信息进行编码，用条码表示出来；可以表示多种语言文字；可表示图像数据。


    +   ③容错纠错能力强。这使二维码因穿孔、污损等引起局部损坏时，照样可以正确识读，损毁面积达 30% 仍可恢复信息。


    +   ④译码可靠性高。它比普通条码译码错误率百万分之二要低得多，误码率不超过千万分之一。


    +   ⑤便于推广应用。可引入加密措施，保密性、防伪性好。二维码符号形状、尺寸大小比例可变，成本低，易制作，持久耐用。


    二维码在社会生活中得到了广泛应用，也陆续暴露出一些不足：二维码应用的安全性也正备受挑战，带有恶意软件和病毒正成为二维码普及道路上的绊脚石。发展与防范二维码的滥用正成为一个亟待解决的问题。扫描二维码有时候会创下一条链接，提示下载软件，而有的软件可能藏有病毒。其中一部分病毒下载安装后会对手机、平板电脑造成影响；还有部分病毒则是犯罪分子伪装成应用的吸费木马，一旦下载就会导致手机自动发送信息并扣取大量话费。


    # 4) QR Code 二维码


    ①基本特性。在目前几十种二维条码中，常用的码制有 QR Code、PDF417 二维条码、Datamatrix 二维条码、Maxicode 二维条码、Code
    49。其中，QR 码是一种矩阵二维码符号，具有一维条码及其他二维条码所具有的信息'
