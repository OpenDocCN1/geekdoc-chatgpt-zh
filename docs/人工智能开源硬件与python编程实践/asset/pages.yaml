  md: '语音识别处理器允许用户定义一张识别关键词语列表，应用中还可以动态编辑和维护这张识别关键词语列表。只需要把关键词语以字符串的形式传送给芯片，即可在下次识别过程中生效。每个关键词语可以是单字、词组、短句或者任何的中文发音的组合。板上语音识别处理器目前支持用户自由编辑
    50 条关键词词条，即在同一时刻，最多在 50 条关键词语中进行识别。编程设计时可以根据工作场景的需要，动态编辑和更新这 50 条关键词语的内容。


    语音识别处理器有两种用户使用模式，即触发识别模式和循环识别模式。应用时可以通过编程，设置两种不同的用户使用模式。


    +   ①触发识别模式。语音识别处理器在接收到外界一个触发信号后，比如利用板上的按键，启动一个定时识别过程。要求用户在这个定时过程中说出要识别的语音关键词语。这个过程结束后，需要用户再次触发才能再次启动一个识别过程。


    +   ②循环识别模式。语音识别处理器启动连续的识别过程。处理器具有端点检测功能，它根据短时能量、过零率等参数判断是否有说话语音发生。如果没有采集到语音就没有识别结果，如果有检测到说话语音，就启动识别流程，给出识别结果。


