    TDNN 出现之前，人工智能领域在反向传播算法（Back—Propagation，BP）的研究中取得了突破性进展，因此 TDNN 得以使用 BP 框架内进行学习。
    Yann LeCun 在 1989 年构建了应用于计算机视觉问题的卷积神经网络，即 LeNet 的最初版本。LeNet 包含 2 个卷积层，2 个全连接层，共计
    6 万个学习参数，规模远超 TDNN 等神经网络，且在结构上与现代的卷积神经网络十分接近。LeNet 在对权重进行随机初始化后使用了随机梯度下降（Stochastic
    Gradient Descent，SGD）进行学习，这一策略被其后的深度学习研究所保留。此外，LeCun 在论述其网络结构时首次使用了“卷积”一词，“卷积神经网络”也因此得名。


    在 LeNet 的基础上，1998 年 LeCun 等研究者构建了更加完备的卷积神经网络 LeNet-5 并在手写数字的识别问题中取得成功，如图 12.4
    所示。LeNet-5 沿用了 LeCun 的学习策略并在原有设计中加入了池化层对输入特征进行筛选。LeNet-5 及其后产生的变体定义了现代卷积神经网络的基本结构，其构筑中交替出现的卷积层-池化层被认为能够提取输入图像的平移不变特征。LeNet-5
    的成功使卷积神经网络的应用得到关注，基于卷积神经网络的应用研究得也火热展开，包括光学字符读取（OCR）、人像识别、手势识别等应用系统不断成功。


