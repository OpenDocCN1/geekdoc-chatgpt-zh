    # 6）图像匹配基本方法


    不同图像的各个特征可能存在着关联，通过欧氏距离或者汉明距离测度可以来比较这些特征，进而匹配这些特征。高维度的图像特征一般通过欧氏距离作为评判参数，二进制特征由于其结构简洁，一般都是使用汉明距离进行评判。


    很多开源计算机视觉库都提供了特征匹配算法，常用的特征匹配方法有暴力匹配和快速最近邻搜索包算法 FLANN。Open CV 库提供有暴力匹配子 BFMatcher，距离可以使用欧式距离和汉明距离。对于二进制特征一般使用汉明距离，通过简单的异或操作计算距离，对于计算资源要求低，运行速度快。'
