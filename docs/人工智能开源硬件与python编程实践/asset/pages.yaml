    # (3) 知识准备


    # 1) 卷积神经网络经典模型


    ①LeNet。第一个成功的卷积神经网络应用是 Yann LeCun 在 20 世纪 90 年代实现的。它已经被成功应用在银行系统，用来识别支票上的手写数字，还被应用在邮政系统识别邮政编码等。


    ②AlexNet。AlexNet 卷积神经网络在计算机视觉领域中受到欢迎，它由 Alex Krizhevsky, Ilya Sutskever 和 Geoff
    Hinton 实现。AlexNet 在 2012 年的 ImageNet ILSVRC 竞赛中夺冠，性能远远超出第二名（16 % 的 top5 错误率，第二名是
    26% 的 top5 错误率）。这个网络的结构和 LeNet 非常类似，但是更深更大，并且使用了层叠的卷积层来获取特征（之前通常是只用一个卷积层并且在其后马上跟着一个下采样层）。


    ③ZFNet。Matthew Zeiler 和 Rob Fergus 发明的网络在 ILSVRC 2013 比赛中夺冠，它被称为 ZFNet (Zeiler
    & Fergus Net 的简称)。它通过修改结构中的超参数来实现对 AlexNet 的改良，具体来说就是增加了中间卷积层的尺寸，让第一层的步长和滤波器尺寸更小。


    ④GooLeNet。ILSVRC 2014 的胜利者是谷歌 Szeged 等实现的卷积神经网络。它主要的贡献就是实现了一个奠基模块，能够显著地减少网络中参数的'
  merge: -1
