- pgno: 4
  md: '# # 前言


    人工智能的迅速发展深刻地改变了人类的社会生活，改变了世界，引起了全世界范围内的重视。2017 年 7 月，国务院印发《新一代人工智能发展规划》，要求抢抓人工智能发展的重大战略机遇，构筑我国人工智能发展的先发优势，加快建设创新型国家和世界科技强国。迄今为止，已经有中国、加拿大、日本、韩国、美国等
    19 个国家和地区先后推出了自己的国家级人工智能战略计划。


    美国麻省理工学院温斯顿教授认为：“人工智能就是研究如何使计算机去做过去只有人才能做的智能工作。”通俗地说，人工智能就是研究和开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用的系统。1956
    年夏季，在美国达特茅斯学院举办了一场研讨会，深入讨论了用机器模拟人类智能的问题。出席会议的几位计算机科学家首次提出了“人工智能”的概念，设想用当时刚刚出现的计算机来构造复杂的、拥有与人类智慧同样本质特性的机器。这次研讨会标志着人工智能学科的诞生。


    人工智能的研究领域一直在不断扩大，主要包括专家系统、机器学习、模式识别、计算机视觉、自然语言处理、专家系统等，典型的应用有机器人、机器翻译、智能驾驶、智能家居等。从
    1997 年超级计算机深蓝与卡斯帕罗夫的较量，到可以与人类进行智力比拼的 Watson 系统，人工智能正在改变着我们的生活。2012 年以后，得益于互联网和大数据技术，计算资源和运算力的突飞猛进以及机器学习（深度学习）等新算法的出现，人工智能开始大爆发。于'
  merge: -1
  img_proc: true
- pgno: 5
  md: '是，出现了 2016 年 AlphaGo 与韩国棋手李世石较量的人工智能的标志性事件。


    以卷积神经网络为代表的深度学习方法取得了突破性发展，使得机器可以模仿视听和思考等人类活动，解决了很多复杂的模式识别的难题；使得人工智能技术取得了重大进步，语音识别及语音合成、计算机视觉与目标识别、生物特征识别等典型的人工智能技术开始走进人们的生活。


    人工智能成为国际竞争的新焦点和经济发展的新引擎，加快培养人工智能人才是当前的重要工作。国务院印发的《新一代人工智能发展规划》中明确提出：要实施全民智能教育项目，在中小学阶段设置人工智能相关课程，逐步推广编程教育；建立适应智能经济和智能社会需要的终身学习和就业培训体系，支持高等院校、职业学校和社会化培训机构等开展人工智能技能培养。2018
    年 1 月，教育部正式颁布《普通高中信息技术课程标准》《普通高中通用技术课程标准》等新课标，设置人工智能初步、开源硬件项目设计、智能家居应用设计等新技术体验与探究课程模块。2018
    年 4 月，教育部发布《高等学校人工智能创新行动计划》，推动人工智能基础、机器学习、神经网络、计算机视觉等主干课程建设，结合学生的学习兴趣和社会需求，积极开展新工科实践，支持师生开展
    AI 领域创新创业活动，培养 AI 创新创业人才。2019 年 1 月，国务院发布《国家职业教育改革实施方案》，要求“牢固树立新发展理念，服务建设现代化经济体系和实现更高质量更充分就业需要，对接科技发展趋势和市场需求，完善职业教育和培训体系”。同年
    4 月，教育部学校规划建设发展中心批准了 15 所高职院校建立人工智能学院。


    国家推动人工智能教育的一系列举措出台后，人工智能课程的建设受到了普遍关注，2018 年以来陆续有相关课程推出。然而，国内人工智能的教学实践也遇到了许多现实问题，主要问题有：人工智能教学往往聚焦于相关数学理论以及神经网络、深度学习等算法的学习，而这些理论及算法知识已经超出了很多职业学校甚至工科学生的知识体系和培养要求；课程教学中理论知识占比太高，动手实践非常缺乏，学生实际运用起来难度很大；所选案例或项目多来源于课题研究或产业需求，脱离学生的生活实际；采用的技术相对封闭，或者仅是对现有技术平台进行接口调用，难以进行拓展和创新，等等。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '总之，教学内容及形式不利于学生参与，不利于学生学习兴趣的激发与保持，不利于学生实践能力的培养。


    面对教学中的实际问题和社会对创新创业人才的迫切需求，教材编著者立足于普及人工智能的经典方法，快速提升学生的应用能力，将 Python 编程教学与人工智能开源硬件相结合，倡导运用理论知识去解决实际问题，从学生兴趣及生活实际选取案例和设置任务，设计创新实践类课程，探索人工智能教育开展的途径和有效方法。2019
    年初，完成了试用教材的编写，在深圳大学创业学院开设学分选修课，进行了一个完整学期的试教，学生分组开展人工智能编程实践，涌现出了盲人之眼、驾考帮帮等有创意的学生生项目，形成了将人工智能教育与创客教育相结合的教学模式。2019
    年秋，根据教学总结及学生实践情况，我们对自编教程进行了修改和完善，突出了基于人工智能开源硬件与 Python 编程来设计项目式技术实践活动的特色。学生通过人工智能典型应用技术的体验及实践，掌握创新活动所需的知识与技能。


    考虑职业学校甚至高中中学生学习人工智能技术和 Python 编程的需求，教学内容划分为基础与拓展两部分，课程模块的结构包括问题提出、任务与目标、知识准备、编程实践、调试及完善、拓展训练等环节，学时充分、专业基础好的学校可以指导学生操练模型训练、创新实践等拓展部分的内容，职业学校、高中学生可以根据条件开展人工智能开源硬件与
    Python 编程等基础部分的实践活动。


    课程目标是帮助学生快速掌握计算机视觉、语音识别等人工智能的典型方法，基于集成计算机视觉和语音识别技术于一体的开源硬件及开源算法，可自主操作利用 Python
    编程工具设计的创新实践活动。在教学内容上，从社会、生活需求以及学生未来的职业发展出发选取教学内容和案例，包括目标跟踪、图像匹配、二维码识别、人脸检测、图像分类、笑脸表情识别、手写体识别、语音识别等，既包含基础性的图像特征提取与目标检测方法，也包括人脸检测等机器学习方法，还提供了前沿的卷积神经网络等深度学习方法的实践活动，有利于激发学生的兴趣和创意和学生的职业发展。


    在教学方式上，推动人工智能新技术的工程实践，将人工智能教育与创客教育相结合，每个课程模块均设置技术实践任务，提供相关理论知识的讲'
  merge: -1
  img_proc: true
- pgno: 7
  md: '解，提供相应算法的 Python 实施案例，引导学生动手实践，以掌握经典计算机视觉、语音识别技术的应用方法，教师同步提供技术指导，帮助学生解决实际问题，培养学生的创新实践能力。


    教材围绕人工智能新技术的工程实践展开，整合了人工智能经典算法、开源硬件、Python 嵌入式编程等多种技术，注重实践实训，采用案例教学、项目式学习等教学方法，可快速提升高校工科学生运用人工智能开源硬件和编程技术开展科技创新活动的能力，以适应人工智能时代的需要。教材也适用于职业学校开设的人工智能创新实践课程，以提高学生对开源硬件及
    Python 编程技术的应用能力，适应社会对应用型人才的需要。教材基础部分的内容组织及实践设计参考了普通高中信息技术新课标的相关要求，也可作为中学信息技术人工智能初步等课程模块的教学实践内容，教材中的案例便于学生体验和运用，可以作为面向中学生普及人工智能技术的实践项目。


    课程开发及教材编写由深圳市徐明教育科研专家工作室承担，该团队 2015 年年初由深圳市教育局批准成立，在创客教育、STEAM 教育以及人工智能教育领域积累了丰富的案例，目前承担着教育部协同育人项目《人工智能教育课程开发及教学评价》等一批课题。我们后续将配套开发数字化学习资源，还将定期组织面向教师和学生的工作坊实践活动，以推动人工智能教育的普及和开展。


    在教材的编程过程中，罗伟源根据教学的需要修改和扩展了 Python 库的设计，李明完成了大部分案例代码的调试和完善工作，史大汇参与了教学资源的设计及教学实践工作。


    由于编者水平有限，加上人工智能工程实践过程中的复杂性，不当之处在所难免，欢迎老师、同学们提出批评和建议，有任何问题请与我们联系：xuming@ szu. edu.
    cn 编者愿意加强与广大同行的合作，共同推动人工智能技术的普及和应用。'
