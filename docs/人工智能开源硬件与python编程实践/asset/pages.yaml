- pgno: 126
  md: '# (4) 设计与实践


    OpenAIE 控制板集成了人脸检测通用模块，提供 Haar 算法集进行通用对象检测，并内置有 Frontal Face 检测器来检测视频帧中的人脸。其中，Haar
    Cascade 模块进行一系列的比对检查，用于确定待检测对象是否存在于图像帧中。这一系列的对比检查分成了多个阶段，后一阶段的运行以先前阶段的完成为前提。大范围的检查在前期阶段首先进行，在后期进行更多更小的区域检查。


    # 1) 摄像头工作参数设置


    在项目 8 人脸检测应用中，视频采集的分辨率设为 240 × 160 像素的 HQVGA 格式，像素格式设置为灰度图模式，相关的 Python 代码如下：


    ```

    ```python

    #初始化摄像头工作参数数；

    sensor.set_contrast(1) #设置相机图像对比度，范围从 -3 至 +3；

    sensor.set_gainceiling(16) #设置相机图像增益上限，参数范围：2,4,8,

    16,32,64,128；

    sensor.set_framesize(sensor.HQVGA) #分辨率设为 HQVGA;240x160；

    sensor.set_pixformat(sensor.GRAYSCALE) #人脸检测应用使用灰度图，

    每像素为 8 位，1 字节；

    ```

    ```


    人眼检测时，需要对人脸更细小的区域进行搜索，需要提高图像帧的分辨率。HQVGA 模式下很容易检测出人脸，但是用来检测人眼，成功率很低。AIE 控制板支持的最大分辨率是
    VGA，可以在这种模式下进行人眼检测：


    ```

    ```python

    sensor.set_framesize(sensor.VGA) #分辨率设为 VGA;640 × 480；

    sensor.set_pixformat(sensor.GRAYSCALE) #人眼检测同样使用灰度图；

    ```

    ```


    # 2) 相关 Haar 模型的加载


    利用计算机视觉库中的 Haar Cascade(path, stages) 类，可实现人眼检测过程所需要的 Haar 模型的加载，启动对图像帧区域的搜索。为快速检测到人眼，先在整个图像帧中搜索人脸，再在搜索到的人脸区域中检测人眼的位置。


    计算机视觉库中内置有已经训练好的相关 Haar 模型，如“frontalface”人脸模型和“eye”人眼模型，编程是直接指定即可。相关的 Python 代码示例如下：'
