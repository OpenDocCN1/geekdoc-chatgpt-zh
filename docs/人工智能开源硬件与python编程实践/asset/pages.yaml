    # (2) 任务与目标


    +   ① 了解计算机视觉的基本原理，了解人工智能开源硬件的技术特性；

    +   ② 了解嵌入式 Python 程序的基本结构编程方法；

    +   ③ 掌握 OpenAIE IDE 编程工具，完成编写、上传、运行嵌入式 Python 程序；

    +   ④ 了解运用人工智能开源硬件进行人工智能应用系统设计的实践方法。


    # (3) 知识准备


    # 1) 计算机视觉


    计算机视觉（Computational Vision）是研究如何使机器“看”的科学，也就是指用摄像机和计算机代替人眼对目标进行识别、跟踪和测量等，并进一步做图形处理，使计算机处理成为更适合人眼观察或传送给仪器检测的图像。


    计算机视觉是人工智能技术的重要组成部分，它研究如何使人工智能系统从图像或多维数据中去“感知”。相当于给计算机安装上眼睛（照相机）和大脑（算法），让计算机能够感知环境。计算机视觉就是用各种成像系统代替视觉器官作为输入敏感手段，由计算机来代替大脑完成处理和解释。计算机视觉的最终研究目标就是使计算机能像人那样通过视觉观察和理解世界，具有自主适应环境的能力。


    计算机视觉系统一般包括图像获取、预处理、特征提取、检测分割、模式识别、机器学习、深度学习等部分，图 1.2 是计算机视觉在智能交通中的典型应用，通过车辆检测与跟踪，实现对路口车辆违章判断，或者感知交通道路的拥堵态势。'
