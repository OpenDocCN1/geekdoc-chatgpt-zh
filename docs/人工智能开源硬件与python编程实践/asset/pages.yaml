  md: '特征图，而 C1 层共享了 6 组卷积核，因此产生 6 张 28 × 28 像素的特征图。再将影像进行池化，较常见的方式就是把相邻四点中最大的点当成新点，称为
    Max Pooling，同时把影像长宽都减为一半，成为 S2 层。


    ②对 S2 层以 16 组 3 × 3 卷积核进行卷积，产生 C3 层，共有 16 组 10 × 10 像素的特征图。同样地再对 C3 层进行池化产生 S4
    层，变成 16 组 5 × 5 像素的特征图，最后再以 16 组 5 × 5 卷积核把 S4 层的 16 个特征图卷积变成 16 个输入点，再以传统全链接神经网络进行链接。C5
    层就是以 16 个输入点和隐藏层 120 点进行全连接，并依指定的激活函数将输出传到下一层，接下来再和下一组隐藏层 F6 的 84 点进行全连接，最后再和输出层（OUTPUT）的
    10 个输出点进行全连接，并正规化输出得到各输出的概率，即完成整个 LeNet-5 模型（网络）结构。'
