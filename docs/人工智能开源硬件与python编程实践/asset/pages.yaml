  md: '在圆形检测中，需要计算出最大累加值，就可以找到圆心和半径，然后通过遍历，标出所有的像素点。


    # 5) 圆形检测的具体过程


    在使用霍夫变换进行圆检测时，要对图像进行灰度化和二值化处理，提取图像的边缘信息，在图像识别中，使结果更加准确。圆检测的步骤：


    +   ①对需要检测的图像灰度化、二值化。


    +   ②对图像进行边缘检测。


    +   ③在参数空间 \(\rho\)-\(\theta\) 中建立一个累加数组，并设置该数组中的初值为零。


    +   ④然后对数组进行峰值检测，得到被检测直线的参数 \(\rho\) 和 \(\theta\)。


    将参数空间等分成 \(m\) 行，n 列，\(m\) 为 \(\theta\) 的等分数，\(n\) 为 \(\rho\) 的等分数，并设置累加值矩阵。设置半径最小刻度，角度最小刻度，半径的最大值、最小值。遍历所有的像素点，求出
    \(a\) 和 \(b\) 的值。然后判断 \((a,b)\) 是否在矩阵 \((m,n)\) 中，如果 \((a,b)\) 在该范围内，累加器加 1，从而获得霍夫累积矩阵。


    在圆的检测中需要设置阈值，最大累加值确定阈值。搜索超过阈值的聚焦点，对应的参数就认为是圆的参数。阈值不同，检测的效果也不同，如果阈值设置为 0.75，那么大于最大累加值
    75% 的累积矩阵对应的圆都可以检测出来。这次遍历目的是找出符合参数的像素，也就找到了圆的像素。


    # 6) 矩形检测


    基于窗口霍夫变换与阈值分割自动识别图像中的矩形策略：通过图像窗口霍夫变换，提取霍夫图像的峰值（对应原始图像的线段），当 4 个峰值满足某些几何条件时，则检测出矩形。


