  md: 'HSV、Lab、CMYK 等色域模型将可见光的颜色描述出来。


    ①RGB 模型。RGB 模型(图 3.3(a))可以使用 vec3(r,g,b) 表示。在模型的三维直角坐标系中，x、y、z 轴相当于红、绿、蓝三通道，原点
    vec3(0.0, 0.0, 0.0) 代表黑色，顶点 vec3(1.0,1.0,1.0) 代表白色，原点到顶点的中轴线 x = y = z 代表灰度线。RGB
    模型适用于计算机表示，将 RGB 以不同的比例混合后，人的眼睛可以形成与其他各种频率的可见光等效的色觉。


    +   用 RGB 模型表征彩色，深浅、明暗变化的说法是：

    +   色彩变化：三个轴 RGB 的最大分量顶点与黄紫青(YMC)色顶点的连线；

    +   深浅变化：RGB 顶点与 CMY 顶点到中轴线(原点和顶点的连线)的距离；

    +   明暗变化：中轴线上的点的位置。离远点近偏暗，反之偏亮。


    ②HSV 模型。HSV(Hue 色相、Saturation 饱和度、Value/Brightness 亮度，也称为 HSB)模型更符合人类习惯。HSV 模型可以使用倒锥形模型表示(图
    3.3(b))。模型中 H 表示色彩信息，即光谱颜色所在的位置，该参数用角度来表示，红、绿、蓝分别相隔 120°，互补色(CMY)分别相差 180°。纯度
    S 是一个比例值，范围[0,1]，表示所选颜色的纯度和该颜色最大纯度之间的比率，当 S = 0 时，代表灰度。V 表示色彩的明亮程度，范围[0,1]，与光强度无直接关系。


    HSV 对人类来说是一种最直观的颜色模型，先指定彩色角 H，并使 V = S = 1.0，然后通过添加黑色或者白色得到目标颜色。增加黑色可以减小 V 而 S
    不变，这样就减小了该颜色亮度；同样，增加白色可以减小 S 而 V 不变，这样就增加了颜色亮度。例如深蓝色为(240°,1.0,0.4)，浅蓝色为(240°,0.4,1.0)。


    ③Lab 模型。Lab 模型则基于人对颜色的感觉，描述的是颜色的显示方式，而非显示设备生成颜色所需要的特定色料的数量，故 Lab 也被视为与设备无关的颜色模型(图
    3.3(c))。


