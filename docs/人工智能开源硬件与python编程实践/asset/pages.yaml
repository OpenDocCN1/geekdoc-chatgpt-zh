    在预测阶段，将相同的特征提取过程应用于新图像，然后将特征传递给训练有素的机器学习算法来预测标签。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_192_0.png)


    图 14.3 经典的机器学习过程


    深度学习的思想是模拟人的神经元，每个神经元接受到信息，处理完后传递给与之相邻的所有神经元。它是用于建立、模拟人脑进行分析学习的神经网络，模仿人脑的机制来解释数据，模仿大脑神经元之间的信息传递。


    深度学习是一种深层的机器学习模型，其深度体现在对特征的多次变换上。常用的深度学习模型为多层神经网络，神经网络的每一层都将输入非线性映射，通过多层非线性映射的堆叠，可以在深层神经网络中计算出抽象的特征来帮助分类。在图像分析等经典卷积神经网络中，将原始图像的像素值直接输入，第一层神经网络可以视作边缘的检测器；而第二层神经网络则可以检测边缘的组合，得到一些基本模块；第三层之后的一些网络会将这些基本模块进行组合，最终检测出识别目标。


    与机器学习方法相比，深度学习方法使得很多应用中不再需要单独对特征进行选择与变换，而是将原始数据输入到模型中，由模型通过学习给出适合分类的特征表示。


