- pgno: 22
  md: "```\n<执行 1 > elif <判断条件 2 > :\n<执行 2 > elif <判断条件 3 > :\n<执行 3 > else:\n<执行\
    \ 4 >\n```\n\nPython 程序语言指定任何非 0 和非空（null）值为 true，0 或者 null 为 false。if 语句中”判断条件”成立时（非零），则执行后面的语句，而执行内容可以多行，以缩进来区分表示同一范围。else\
    \ 为可选语句，当需要在条件不成立时执行内条则可以执行相关语句。例如：\n\n```\nage = 20\nif age >= 18:\n    print('adult')\
    \ elif age >= 6:\n    print('teenager') else:\n    print('kid')\n```\n\n由于 python\
    \ 不支持 switch 语句，所以多个条件的判断，只能用 elif 来实现，如果需要多个条件同时判断，可以使用 or（或）、and（与）等逻辑组合。\n\n\
    ②for 循环语句。Python 的循环有两种，即 for 循环语句和 while 循环语句。\n\nPython 的第一种循环语句是 for... in\
    \ 循环，依次把 list 或 tuple 中的每个元素迭代出来，重复执行循环体语句。例如：\n\n```\nnames = ['Michael', 'Bob',\
    \ 'Tracy']\nfor name in names:\n    print(name)\n```\n\n执行这段代码，会依次打印 names 的每一个元素；\n\
    \nMichael\nBob\nTracy\n\n所以 for x in ...循环就是把每个元素代入变量 x，然后执行缩进块的语句。如果要计算 1 ~ 100\
    \ 的整数之和，从 1 写到 100 有点困难，幸好 Python 提供了一个 range() 函数，可以生成一个整数序列，再通过 list() 函数可以转换为\
    \ list。例如，range(5)生成的序列是从 0 开始小于 5 的整数，list(range(5)) 显示输出为[0,1,2,3,4]。range(101)\
    \ 就可以生成 0 ~ 100 的整数序列，计算 0 ~ 100 各个数之和的 Python 程序如下：\n\n```\nsum = 0\nfor x in\
