- pgno: 21
  md: "⑤函数定义。函数是指一段在一起的、实现某一功能的程序段，也就是一段实现特定功能的代码，加以命名，以后可以通过该名字来调用。使用函数可大大提高代码的重复利用率。在\
    \ Python 中，定义一个函数要使用 def 语句，依次写出函数名、括号、括号中的参数和冒号，然后，在缩进块中编写函数体，函数的返回值用 return\
    \ 语句返回。\n例如，编写一个计算 \\(X^2\\) 的函数：\ndef power(x):\n    return x * x\n\n对于 \\(power(x)\\\
    ) 函数，定义了一个形参 \\(x\\)。当后续调用 \\(power\\) 函数时，必须传入有且仅有的一个参数 \\(x\\)。例如，\\(power(15)\\\
    )，函数会返回值 225。\n那么，要计算 \\(X^n\\) 怎么办？比较有效率的方法是设计一个有 2 个输入参数的函数，可以把上例中的 \\(power(x)\\\
    ) 函数修改为 \\(power(x,n)\\)，用来计算 \\(X^n\\)，代码如下：\ndef power(x,n):\n    s = 1\n  \
    \  while n > 0:\n        n = n - 1\n        s = s * x\n    return s\n\n利用这个修改后的\
    \ \\(power(x,n)\\) 函数，可以计算任何数的任意 \\(n\\) 次方。例如，输入 \\(power(5,3)\\)，函数会返回值 125。\n\
    这个修改后的 \\(power(x,n)\\) 函数有 2 个参数：\\(x\\) 和 \\(n\\)，调用此函数时，传入的两个参数值按照位置顺序依次赋给参数\
    \ \\(x\\) 和 \\(n\\)。\n\n⑥初始化硬件设置。嵌入式 Python 程序必然要跟硬件打交道，涉及对硬件资源的读取、写入和查询，编程时需要考虑如何设置硬件资源工作的初始值，以及如何使硬件处于稳定工作状态。\n\
    \n⑦主程序。Python 程序由顺序结构语句、条件、循环语句构成。许多高级编程语言（如 C、Java）使用括号 `{}` 来标记代码块，Python 通过缩进来实现。\n\
    \n# 6 嵌入式 Python 程序结构\n\nPython 程序在一般情况下是按顺序执行的，但是也会经常需要根据条件进行转移，或者重复执行的情况。\n\
    ①条件语句。Python 程序中，if 语句的完整形式是：\nif <判断条件 1 > :"
  merge: -1
