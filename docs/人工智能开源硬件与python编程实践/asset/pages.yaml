  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_17_0.png)


    图 1.2 计算机视觉在智能交通系统中的应用


    # 2) 机器视觉


    机器视觉主要是指工业领域的计算机视觉研究，例如自主机器人的视觉，用于检测和测量的视觉。这表明在这一领域通过软件硬件，图像感知与控制理论往往与图像处理紧密结合来实现高效的机器人控制或各种实时操作。


    机器视觉是重要的人工智能技术，就是用机器代替人眼来做检测、判别和识别。机器视觉系统是通过图像摄取装置将被摄取目标转换成图像信号，传送给专用的图像处理系统，得到被摄目标的特征及形态信息，如亮度、颜色、形状特征等信息，再对这些信号进行各种运算来抽取目标的特征，进而根据判别的结果来控制应用系统设备的工作。


    一个典型的机器视觉系统包括：光源，摄像头或专业相机，图像处理单元或控制器，图像处理算法及应用软件，以及显示器、网络通信、输入输出单元等(图 1.3)。


    # 3) 人工智能开源硬件


    开源硬件指与自由及开放源代码软件相同方式设计的智能硬件。开源硬件延伸着开源软件代码的定义，包括电路原理图、PCB 印制图、材料清单、设计图等都使用开源许可协议，自由使用分享，以开源的方式去授权。开源硬件把开源软件里的
    GPL、CC 等协议规范带到硬件分享领域，允许免费使用、修改、衍生和发行，但开源硬件也是具有知识产权的，其版权属于原创者以及后续参与修改者。开源硬件鼓励自由创新，同样需要尊重知识产权，应该在开源协议范围内任意修改原始设计及相应代码和推广应用。'
