  md: '# 2) 神经网络类的构造方法


    板上 Python 库中的 class nn. load( path) 是构造函数,用来构造一个神经网络 Net 类。它将神经网络从 network 二进制模型文件加载到内存中,包括神经网络的层、权值、偏置等。返回一个可以在图像上进行操作的
    Net 对象。


    net. forward( image[ , roi[ , softmax = False[ , dry_run = False]]] ) 方法用于在图像
    roi 上运行神经网络,必要时会自动缩放,并返回神经网络分类结果的浮点值列表。


    其中, roi 是待处理区域的矩形元组( x,y,w,h ),仅运算 roi 中的像素。如果未指定,则它等于图像矩形。如果 softmax 为 True,则列表中所有的输出总和为
    1。否则,列表中的任何输出都可以在 0 和 1 之间。将 dry_run 设置为 True 以打印出正在执行的网络层而不是实际执行它们。


    net. search( image[ , roi[ , threshold = 0.6[ , min_scale = 1.0[ , scale_mul =
    0.5[ , x_overlap = 0[ , y_overlap = 0[ , contrast_threshold = 1[ , softmax = False]]]]]]]]
    ) 方法用来以滑动窗口方式在图像 roi 上运行神经网络。网络检测器窗口以多种比例滑过图像。返回神经网络检测结果的 nn_class 对象列表。


    其中, roi 是待处理区域的矩形元组( x,y,w,h ),仅运算 roi 中的像素。在图像中的区域上运行之后,将最大检测值超过 threshold 的对象添加到输出列表中。min_scale
    控制网络模型的缩放比例。在默认值下,网络不会缩放。但是,值为 0.5 将允许用于检测图像大小为 50% 的对象。scale_mul 控制测试多少个不同的比例。滑动窗口方法的工作原理是将默认比例1
    乘以 scale_mul,并且结果需要大于 min_scale。scale_mul 的默认值 0.5,测试每个比例变化减少 50% 。但是,0.95 的值仅为
    5% 的缩小量。x_overlap 控制与滑动窗口的下一个检测区域重叠的百分比。值为零表示没有重叠。值为 0.95 意味着 95% 重叠。y_overlap
    控制与滑动窗口的下一个检测区域重叠的百分比。值为零表示没有重叠。值为 0.95 意味着 95% 重叠。contrast_threshold 控制跳过图像低对比度区域的阈值。在图像中的某个区域上运行
    nn 之前,将在该区域上计算标准偏差,如果标准偏差低于 contrast_threshold ,则跳过该区域。如果 softmax 为 True,则列表中所有的输出总和为
    1。否则,列表中的任何输出都可以在 0 和 1 之间。'
