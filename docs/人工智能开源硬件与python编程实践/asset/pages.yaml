  md: '自己的采样模型，选取固定数量的强度对比点对，从而产生二进制的描述子，BRIEF 通常会选取随机的正态分布，ORB 在随机的基础上，增加了一些学习训练，BRISK
    和 FREAK 同样采用了对称圆形，在模糊处理后的区域上，BRISK 的采样区间没有重复，FREAK 则根据生物的视觉特性，有重复。


