  md: '![](img/0e241de5c528c1a642a0be5d4ab7093c_34_0.png)


    # 图 2.4 Bayer 色彩滤镜


    根据人眼对彩色的响应应带宽不高且大面积着色色特点，每个像素没有必要同时输出 3 种颜色。使用 Bayer 格式数据采样时：

    奇数扫描行的第 1,2,3,4,⋯像素分别采样和输出 R,G,R,G,⋯数据；

    偶数扫描行的第 1,2,3,4,⋯像素分别采样和输出 G,B,G,B,⋯数据。

    Bayer 格式是摄像机内部的原始图像格式，一般后缀名为 .raw。摄像机拍摄下来存储在存储卡上的 .jpeg 或其他格式的图片，都是从 .raw 格式转化过来的。


    # 6) 常见的图像存储格式


    彩色图像由 RGB 3 个分量组成。众所周知，Bitmap 图像格式由三个颜色通道组成，每个通道用 8 位数据来表示，各有 256 个可能的值。所以，Bitmap
    图像又称为 24 位真彩色图像，也被称为 RGB888 格式。


    RGB565 彩色模式，一个像素占两个字节，即 16 位。其中：第一个字节的前 5 位用来表示 R（Red），第一个字节的后三位连同第二个字节的前三位用来表示
    G（Green），第二个字节的后 5 位用来表示 B（Blue）。如图 2.5 所示，一个像素的 16 位颜色信息中，高 5 位为 R 分量，中间 6 位为
    G 分量，低 5 位为 B 分量。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_34_1.png)


    # 图 2.5 RGB565 使用的 16 位字节存储


    QVGA 即“Quarter VGA”，顾名思义就是 VGA 格式（分辨率为 640 × 480）'
