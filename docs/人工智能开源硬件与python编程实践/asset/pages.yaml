    图 10.1 图书馆里的条形码自助借还书系统


    近些年，大型图书馆陆续启用了条形码自助借还书系统（图 10.1），以往借还书都要排长队的情况不复存在。自助借还书机可自行完成对条形码读者卡的识别、图书的条形码扫描、图书的充消磁作业等功能，读者只需要按照屏幕显示的操作步骤进行操作，十几秒钟便可完成整个借还书的过程。自助借还书机具体操作流程：读者借书时，需要将一卡通在自助借还机上扫描，再将所借书籍一起放在借还机的扫描区域，通过扫描，确认所借书籍，系统即可录入借书信息完成借书；读者还书时，只需要扫描书籍，即可完成还书操作。


