    4 096 个神经元节点。

    ⑨输出层。该层为全连接层 + Softmax。使用 1 000 个输出的 Softmax，最终输出为 1 000 个分类。


    # (4) 设计与实践


    随着计算机性能的提升和卷积神经网络结构的不断改进，卷积神经网络在图像分类领域取得了突破性的进展。与传统的模式识别方法不同，CNN 不需要对图片进行复杂的预处理或者人工确定某些特征作为识别依据，它可以将原始图片直接作为网络的输入，自动提取特征，再根据提取到的特征对图片进行分类，而且在同等条件下相比传统方法具有显著的准确度提升。


    人工智能开源控制板固化了 OpenAIE Python 库，包含人脸检测、笑脸识别模型及开发接口，可以实现人脸检测和笑脸识别功能。


