    阶段数设置为 25；

    face_cascade = image. Haar Cascade( "frontalface" , stages = 25 )

    print( face_cascade )

    ```


    开源库 Haar Cascade 内置已经训练好的 haar 模型，比如“frontalface”人脸模型或者“eye”人眼模型，编程是直接指定即可。 Haar
    Cascade 也允许应用系统使用自行训练的外部 Haar 模型。对于自行训练的 Haar 模型需要保持成统'
