    face_cascade = image. Haar Cascade( "eye" ,stages = 25 )


    Haar Cascade 也允许应用系统使用自行训练的外部 haar 模型。对于自行训练的 Haar 模型需要保持成统一的二进制格式文件, 编程时 path
    参数要指明模型文件的存储路径, 即引导内为 Haar 模型文件的路径。


    # 3) 瞳孔定位


    利用人脸 Haar 模型在整个图像帧中快速搜索到人脸后, 再启用人眼 Haar 模型在人脸区域中检测人眼区域。在检测到的 2 个人眼区域中分别寻找区域中颜色最深处的中心点,
    就当作瞳孔的位置。


    计算机视觉库中内置有 image. find_eye( roi ) 方法用来在眼睛周围区域 ( x,y,w,h ) 里查找瞳孔。返回一个包含图像中瞳孔 (
    x,y ) 位置的元组。若未发现瞳孔, 则返回 ( 0,0 ) 。


    其中, roi 是搜索区域的矩形元组 ( x,y,w,h ) 。如果未指定, roi 即整个图像的矩形区域。该方法的操作范围仅限于 roi 区域内的像素。


    该方法仅支持灰度图像。使用这一方法之前, 需要先使用 image. find_features() 和 Haar 算子 frontalface 来搜索人脸。然后使用
    image. find_features 和 Haar 算子 find_eye 在人脸区域搜索眼睛。最后, 在返回的每个眼睛 roi 区域上调用这一方法,
    得到瞳孔的位置坐标。相关 Python 参考代码如下 :


    ```

    ```python

    #在识别到的人眼中寻找瞳孔。

    for e in eyes : #e 是先前过程中搜索到的若干人眼矩形区域 ;

    iris = img. find_eye( e )

    #find_eye( ( x,y,w,h ) ) 参数是一个矩形区域, 左上顶点为 ( x,y ) , 宽 w , 高 h ,

    #注意 ( x,y,w,h ) 是一个元组 , 不要漏掉括号 ( ) ;

    #find_eye 的功能是找到区域中颜色最深处的中心点 ;

    img. draw_rectangle( e ) #用矩形标记人眼区域 ;

    img. draw_cross( iris[0] , iris[1] ) #用十字形标记瞳孔。

    ```

    ```'
