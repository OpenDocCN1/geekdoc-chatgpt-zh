    几种二进制特征的特征提取、描述和匹配具有相同的特性，通用过程如下：


    +   1. 根据一定的采样模型，选取强度比较点对。

    +   2. 每一个点对的比较结果就是描述子的每一位。

    +   3. 构造出整个二进制描述子。

    +   4. 通过描述子之间的汉明距离来判断相似度，进行匹配。


