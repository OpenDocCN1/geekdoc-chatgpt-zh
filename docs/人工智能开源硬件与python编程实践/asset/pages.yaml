    # (3) 知识准备


    # 1) 卷积和子采样


    卷积过程就是用一个可训练的滤波器\(f_s\)去卷积一个输入的图像（第一阶段是输入的图像，后面的阶段就是卷积特征map），然后加一个偏置\(b_x\)，得到卷积层\(C_x\)。


    子采样过程是指，邻域4个像素求和变为一个像素，然后通过标量\(W\)加权，再增加偏置\(b\)，然后通过一个Sigmoid激活函数，产生一个缩小1/4的特征映射图\(S_{x+1}\)。


    如图14.2所示为卷积和子采样过程。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_191_0.png)


    # 图 14.2 卷积和子采样


    # 2) 使用传统机器学习与深度学习方法的比较


    使用机器学习算法进行分类包含训练和预测两个阶段（图14.3）；训练阶段，使用包含图像及其相应标签的数据集来训练机器学习算法；预测阶段，利用训练好的模型进行预测。


    图像分类是经典的人工智能方法，采用机器学习的方法，需要先进行模型参数训练，训练阶段包括两个主要步骤：


    ①特征提取。在这一阶段，利用领域知识来提取机器学习算法将使用的新特征。HoG和SIFT是图像分类中常使用的参数。


    ②模型训练。在此阶段，利用包含图像特征和相应标签的干净数据集来'
