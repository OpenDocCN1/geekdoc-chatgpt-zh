  md: "![](img/0e241de5c528c1a642a0be5d4ab7093c_33_0.png)\n\n图 2.3 图像像素与分辨率\n\n差的级别。灰度最高相当于最高的黑，就是纯黑。灰度最低相当于最低的黑，也就是“没有黑”，那就是纯白。很多有用系统中，使用\
    \ 8 位数据来表示灰度，这样灰度共有 256 级。\n\n②RGB 图像转灰度图像。使用不同的经验公式，会得到不同的灰度图像，人们常使用如下符合人们视觉心理的公式：\n\
    \nGray = 0.299 × R + 0.587 × G + 0.114 × B      (2. 1)\n\n根据这个公式，依次读取每个像素点的 R,G,B\
    \ 值，进行计算灰度值(转换为整型数)，将灰度值赋值给新图像的相应位置，所有像素点遍历一遍后完成转换。可供参考的 Python 代码如下：\n\n```\n\
    import numpy as np\ndef rgb2gray(rgb) :\n    r,g,b = rgb[...,0],rgb[...,1],rgb[...,2]\n\
    \    gray = 0.2989 * r + 0.5870 * g + 0.1140 * b\n    return gray\n```\n\n# 5)\
    \ Bayer 格式图像\n\n对于彩色图像，需要采集 RGB 3 种颜色，最简单的方法就是用滤镜的方法：红色的滤镜透过红色光，绿色的滤镜透过绿色光，蓝色的滤镜透过蓝色光。如果要采集\
    \ RGB 3 种基本色，则需要 3 块滤镜，这在工程上很困难。当用 Bayer 格式的时候，可在一块滤镜上设置不同的颜色。通过分析人眼对颜色的感知发现，人眼对绿色比较敏感，所以一般\
    \ Bayer 格式的图片绿色格式的像素是 r 和 g 像素的和。如图 2.4 所示为 Bayer 色彩滤波阵列，由一半的 G，1/4 的 R 和 1/4\
    \ 的 B 组成。"
