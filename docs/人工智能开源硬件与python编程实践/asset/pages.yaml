    +   • 全连接层；经过卷积和降采样后，原始图片的高级特征已经被提取出来了。全连接层在网络的末端对提取后的特征进行恢复，重新拟合，减少因为特征提取而造成的特征丢失。全连接层的神经元数需要根据经验和实验结果进行反复调参。


    +   • 输出层；用于将最终的结果输出，针对不同的问题，输出层的结构也不相同，例如 MNIST 数据集识别问题中，输出层为有 10 个神经元的向量。全连接层的输出通过对输入的特征做加权求和，再加上偏置量，最后通过激活函数获得最终输出。


