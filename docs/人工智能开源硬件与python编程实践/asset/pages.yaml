  md: '# 1) 轨迹拟合的编程方法


    计算机视觉开源库中提供 get_regression( ) 方法用来对指定的图像矩形区域里的所有阈值特征像素点进行线性回归计算。使用方法：


    ```

    image. get_regression( thresholds[ ,invert = False[ ,roi[ ,x_stride = 2[ ,y_stride
    = 1 [ , area _ threshold = 10 [ , pixels _ threshold = 10 [ , robust = False]]]]])))

    ```


    get_regression( ) 方法中通过最小二乘法对图像区域里所有阈值像素进行线性回归计算，速度比较快，但不能处理任何异常值。若 robust 为 True，则使用
    Theil-Sen 线性回归算法，它计算图像中所有阈值像素的斜率的中位数。若在阈值处理后有太多像素，即使在 80 x 60 的图像上，这个 O( N^2)
    操作也可能将 FPS 降到 5 帧以下。但是，只要阈值转换后的像素数量较少，即使在高达 30% 的阈值像素是异常值的情况下也依然会有较好的计算效果。


    thresholds 必须是元组列表。[ (lo, hi) , (lo, hi) , ... , (lo, hi) ] 定义设计者想追踪的颜色范围。对灰度图像，每个元组需要包含
    2 个值:最小灰度值和最大灰度值。仅考虑落在这些阈值之间的像素区域。对 RGB565 图像，每个元组需要有 6 个值( l_lo, l_hi, a_lo,
    a_hi, b_lo, b_hi) - 分别是 Lab 中 L, a 和 b 通道的最小值和最大值。为方便使用，此功能将自动修复交换的最小值和最大值。此外，如果元组大于
    6 个值，则忽略其余值；相反，如果元组太短，则假定其余阈值处于最大范围。


