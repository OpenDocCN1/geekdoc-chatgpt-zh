  md: '# (3) 知识准备


    # 1) 机器学习


    从 20 世纪 50 年代，人工智能的发展经历了“推理期”，通过赋予机器逻辑推理能力使机器获得智能。20 世纪 70 年代，人工智能的发展进入“知识期”，即将人类的知识总结出来教给机器，使机器获得智能。无论是“推理期”还是“知识期”，机器都是按照人类设定的规则和总结的知识运作，永远无法超越其创造者。此后，人们开始机器学习（Machine
    Learning）的研究，人工智能进入“机器学习时期”，机器能够通过自我学习获得智能。


    机器学习是一门多学科交叉专业，涵盖概率论知识、统计学知识、近似理论知识和复杂算法知识，使用计算机作为工具并致力于真实、实时地模拟人类的学习方式，并将现有内容进行知识结构化分来有效提高学习效率。专门研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构使之不断改善自身的性能。机器学习是研究怎样使用计算机模拟或实现人类学习活动的科学，是人工智能中最具智能特征、最前沿的研究领域之一。机器学习的研究方向主要包括决策树、随机森林、人工神经网络、贝叶斯学习等方面的研究。


    # 2) 深度学习


