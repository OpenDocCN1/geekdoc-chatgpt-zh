    # 图 15.3 MFCC 特征参数提取的基本过程


    由图 15.3 可知，MFCC 特征参数向量的构成一般是：N 维 MFCC 参数（N/3 MFCC 系数 + N/3 一阶差分参数 + N/3 二阶差分参数）+
    帧能量。在 Sphinx、HTK 等经典语音识别应用系统中，都是使用 39 维的 MFCC 参数。


    # 5) HMM 语音识别技术


    自动语音识别（Automatic Speech Recognition，ASR）的最大突破是隐马尔科夫模型 Hidden Markov Model 的应用。目前，主流的大词汇量语音识别系统多采用统计模式识别技术。典型的基于统计模式识别方法的语音识别系统由以下几个基本模块所构成：


    ①信号处理及特征提取模块。该模块的主要任务是从输入信号中提取特征，供声学模型处理。同时，它一般也包括了一些信号处理技术，以尽可能降低环境噪声、信道、说话人等因素对特征造成的影响。'
