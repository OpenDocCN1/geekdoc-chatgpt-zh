    实际应用中，非专业级摄像头会遇到镜头畸变的问题。根据近大远小的光学原理，在感光芯片的边缘位置会出现桶形畸变，也就是成像中的鱼眼效果。要解决这类问题，可以使用计算机算法来矫正畸变。在
    OpenAIE 开源算法库中，image 对象提供了 lens_corr(1.8) 的方法，可以用来矫正 2.8 mm 焦距镜头产生的边缘畸变。


