    # 4 ) 卷积神经网络


    ①卷积神经网络的基本概念。卷积神经网络（Convolutional Neural Network，CNN）是一类包含卷积计算且具有深度结构的前馈神经网络，是深度学习的代表算法之一。卷积神经网络具有表征学习（Representation
    Learning）能力，能够按其所层结构对输入信息进行平移不变分类。


    对卷积神经网络的研究始于 20 世纪 80 至 90 年代，时间延迟网络（TDNN）和 LeNet-5 是最早出现的卷积神经网络。第一个卷积神经网络据认为是
    1987 年提出的时间延迟网络（Time Delay Neural Network，TDNN）。'
