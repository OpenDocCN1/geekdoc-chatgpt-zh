  md: '语言的编程方法；


    ③应用人工智能开源硬件和 Python 相关算法模块设计视频采集与捕捉功能；


    ④针对生活应用场景，进一步开展创意设计，设计具有实用价值的视频采集与捕捉应用系统。


    # (3) 知识准备


    # 1) 视频与图像


    视频由一组连续变化的图像组成，其中每幅图像就是视频帧。当连续的图像变化每秒超过 24 帧画面时，根据视觉暂留原理，人眼无法辨别单帧的静态画面，看上去是平滑连续的视觉效果，这样连续的画面就形成视频。


    视频中，每一帧都是静止的图像，快速连续地显示帧便形成了活动的影像。高的帧率可以得到更流畅、更逼真的动画。每秒帧数（FPS）越多，所显示的画面或动作就会越流畅。


    # 2) 摄 像 头


    摄像头是一种视频输入设备。摄像头模块一般具有视频摄像、传输和静态图像捕捉等基本功能，它是借由镜头采集图像后，由摄像头内的感光组件电路及控制组件对图像进行处理并转换成计算机所能识别的数字信号，然后借由并行端口或
    USB 连接输入计算机后再做进一步处理。数字摄像头可以将视频采集设备产生的模拟视频信号直接转换成数字信号，进而将其储存在计算机里。模拟摄像头捕捉到的视频信号必须经过特定的视频捕捉卡模拟信号转换成数字模式，并加以压缩后才可以传输到计算机上运用。也就是说，数字摄像头可以直接捕捉图像，然后通过串、并口或者
    USB 接口传输到计算机里。


    摄像头的工作原理大致为：景物通过镜头生成的光学图像投射到图像传感器表面上，然后转为电信号，经过 A/D（模数转换）转换后变为数字图像信号，送到数字信号处理芯片中压缩编码等加工处理，再通过
    USB 等接口传输到计算机中，通过显示器就可以显示图像。


    在利用摄像头采集视频数据的过程中，镜头的焦距设置特别重要。图像'
  merge: -1
  img_proc: true
