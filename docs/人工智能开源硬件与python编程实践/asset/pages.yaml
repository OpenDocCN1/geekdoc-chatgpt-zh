  md: '手机等设备中。


    +   ②译码。白条、黑条的宽度不同，相应的电信号持续时间长短也不同。译码器通过测量脉冲数字电信号 0、1 的数目来判别条和空的数目。通过测量 0、1 信号持续的时间来判别条和空的宽度。然后根据条码对应的编码规则（例如：EAN
    -8 码），将条形符号换成相应的数字、字符信息。


    # (4) 设计与实践


    # 1) 图像梯度与边缘检测


    图像边缘的检测一般是通过对图像进行梯度运算来实现的。图像梯度运算理解成对图像数据从各个方向（横向、纵向、斜方向等）进行求导，从而提取出图像的边缘。采用的图像梯度计算方法有
    Sobel 算子、Scharr 算子与 Laplacian 算子。


    +   ①Sobel 算子是一阶导数的边缘检测算子，在算法实现过程中，通过 3 x 3 模板作为核与图像中的每个像素点做卷积和运算，然后选取合适的阈值以提取边缘。Sobel
    算子算法的优点是计算简单，速度快，但是由于只采用了水平和垂直 2 个方向的模板，只能检测水平和垂直方向的边缘。


    +   ②Scharr 算子与 Sobel 的不同点是在平滑部分，其所用的平滑算子是 1/16 * [3,10,3]，相比于 1/4 * [1,2,1]，中心元素占的权重更重，比较适用于处理图像这种随机性较强的信号。


    +   ③Laplacian 算子是 n 维欧几里得空间中的一个二阶微分算子，定义为梯度 grad 的散度 div。


    # 2) 利用计算机视觉进行条形码的轮廓检测


    利用摄像头获取条形码区域的图像数据后，可以利用计算机视觉相关算法进行条形码的轮廓检测，工作框架如下：


    +   ①获取包含条形码的图像并转换为灰度图。


    +   ②利用 Sobel 或 Scharr 算子计算水平 x 方向和垂直 y 方向上的梯度幅值，得到条形码图像的梯度表示。


    +   ③从梯度表示图中，初步提取包含高水平梯度和低竖直梯度的图像区域。


    +   ④模糊并二值化图像。使用 9 x 9 的内核对梯度图进行平均模糊，平滑梯'
