    # 图 1.3 生产中应用的机器视觉系统


    ARM 处理器具有体积小、低功耗、低成本、高性能的特点，计算机视觉等人工智能开源硬件多以 STM32F427、STM32F765VI 等 ARM 核 MPU
    为控制核心。为实现典型的人工智能方法，一般都会集成摄像头处理芯片，可以直接采集和处理图像帧数据。新型的人工智能开源硬件还会集成语音识别、语音合成芯片，可以直接采集和处理语音数据，进行人机语音交互。


    集成计算机视觉，听觉功能的人工智能开源硬件可以看作“带机器视觉和听觉功能的 Arduino”，具有成本低、功能强、易学习、普及方便等特点。它通过各种串口、I2C
    总线、GPIO 等通信方式连接其他硬件模块，甚至是单片机系统，如主流的 Arduino、Raspberry Pi（树莓派）等开源硬件，广泛应用在视觉机器人、智能驾驶、智能家居等创新实践活动中。


    # 4) 人工智能时代的 Python 语言


    Python 语言诞生之初是专门为非专业程序员设计的，一直具有易学习、易掌握、易推广普及的特点。目前，Python 语言已经成为用户增长最快、最受欢迎的程序设计语言，是人工智能时代首选的编程工具之一。


    Python 是完全面向对象的语言，函数、模块、数字、字符串都是对象，并且完全支持继承、重载、派生、多继承等编程方法，有益于增强源代码的复用性。Python
    的突出特点是自由、开放源代码软件，从解释器、编程工具到扩展库，使用者可自由地发布这个软件的拷贝、阅读它的源代码、对它做改动并把它的一部分用于新的自由软件中。由于开源，Python
    已经被移植在各种系统平台，各种扩展库特别丰富，深受创客运动、创新企业、研究机构的欢迎。很多知名大学已经采用 Python 来讲授程序设计课程，例如卡内基·梅隆大学的编程基础、麻省理工学院的计算机科学及编程导论就使用
    Python 语言讲授。众多开源的科学计算软件包都提供了 Python 的调用接口，例如知名的计算机视觉库'
  merge: -1
