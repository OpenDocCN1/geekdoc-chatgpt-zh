  md: '# ### (3) 知识准备


    # ## 1) 语音-识别的概念


    与机器进行语音交流，让机器明白人类在说什么，这是人们长期以来一直在探索和希望解决的事情。语音识别技术可以比作为“机器的听觉系统”，就是让机器通过识别和理解过程把语音信号转变为相应的文本或命令的方法。语音识别技术主要包括语音特征提取、模式识别及声学模型训练技术
    3 个方面。


    # ## 2) 语音识别技术的发展历史


    语音识别的研究工作开始于 20 世纪 50 年代，当时 AT&T Bell 实验室实现了第一个可识别 10 个英文数字的语音识别系统——Audry 系统。


    20 世纪 60 年代，计算机的应用推动了语音识别的发展。其中，动态规划（DP）和线性预测分析技术（LP）等技术的提出和运用，对语音识别的发展产生了深远影响。


    20 世纪 70 年代，LP 技术得到进一步发展，动态时间归正技术（DTW）基本成熟。特别是矢量量化（VQ）和隐马尔可夫模型（HMM）理论在实践上的运用，初步实现了基于线性预测倒谱和
    DTW 技术的特定人孤立语音识别系统。


    20 世纪 80 年代，随着 HMM 模型和人工神经元网络（ANN）等技术在语音识别中的成功应用，人们终于在实验室突破了大词汇量、连续语音和非特定人这 3
    大语音识别障碍。卡内基梅隆大学的李开复最终实现了第一个基于隐马尔科夫模型的大词汇量语音识别系统 Sphinx，它是第一个高性能的非特定人、大词汇量连续语音识别系统。在声学识别层面，以多个说话人发音的大规模语音数据为基础，通过对连续语音中上下文发音变体的
    HMM 建模（图 15.2），语音音素识别率有了长足的进步；在语言学层次，以大规模语料库为基础，通过统计 2 个邻词或 3 个邻词之间的相关性，可以有效地区分同音词和由于识别带来的近音词的模糊性。另外再结合高效、快捷的搜索算法，就可以实现实时的连续语音识别系统。'
