    OpenCV 是国际知名的开源计算机视觉库, OpenCV 用 C + + 语言编写, 同时提供了 Python、Ruby、MATLAB 等语言的接口, 提供大量图像处理和计算机视觉方面的通用算法和辅助工具。经过近
    20 年的发展, OpenCV 跨平台能力突出, 可以运行在 Linux、Windows、Android 和 Mac OS 操作系统上。


    在项目 8 计算机视觉与人脸检测的实践中, 介绍了 Haar 分类器训练方法一般分为 5 大步骤。


    OpenCV 开发平台中提供了工具用于训练人脸 Harr Cascade 级联分类器。实际采用 OpenCV3. 4.1 版本和 VS2015 开发工具进行了分类器训练,
    包括收集训练样本、格式化训练数据、创建训练样本、训练 cascade 分类器等过程。


    # 2) 采集训练样本数据


    收集样本数据, 包括正负样本图像文件。训练前, 从开放的人脸数据中提取了 16 个人的不同表情状态下的人脸图像数据文件, 约 200 张, 存放在 Positive
    正样本文件夹中, 每个人的人脸图像文件可以单独另建一个子目录存放。部分人脸如图 9.2 所示。


    同时, 收集一批与人脸无关的图像作为人脸分类器的负样本文件。这些图像都不包含有完整人脸, 主要是人身体的其他部位, 以及户外、居室、教室、校园、街道、背景等人们经常活动的地方。这些负样本照片约
    200 张, 存放在 Negative 负样本文件夹中。部分负样本图像如图 9.3 所示。'
