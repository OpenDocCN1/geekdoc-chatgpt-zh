    # 1) 摄像头工作参数设置


    OpenAI 控制板内固化的 Haar Cascade 算法采用的是黑白像素特征，积分图也是在灰度图像上生成的。因此，人脸检测应用中，摄像头需要设置为灰度图模式，视频采集的分辨率设为
