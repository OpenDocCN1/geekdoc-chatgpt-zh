  md: '数量(AlexNet 中有 60 M，该网络中只有 4 M）。还有，该工作中没有使用卷积神经网络顶部使用全连接层，而是使用了一个平均下采样，把大量不是很重要的参数都去除掉了。GoolLeNet
    还有几种改进的版本，最新的一个是 Inception-v4。


    ⑤VGGNet。ILSVRC 2014 的第二名是 Karen Simonyan 和 Andrew Zisserman 实现的卷积神经网络，现在称为其 VGGNet。它主要的贡献是展示出网络的深度是算法优良性能的关键部分。他们最好的网络包含了
    16 个卷积/全连接层。网络的结构非常一致，从头到尾全部使用的是 3 x 3 的卷积和 2 x 2 的下采样。他们的预训练模型是可以在网络上获得并在 Caffe
    中使用的。VGG-Net 不好的一点是它耗费更多计算资源，并且使用了更多的参数，导致更多的内存占用(140 M)。其中绝大多数的参数都是来自第一个全连接层。后来发现这些全连接层即使被去除，对性能也没有什么影响，这样就显著降低了参数数量。


    # 2）深度学习主流开源开发框架


    在深度学习初始阶段,每个深度学习研究者都需要写大量的重复代码。为了提高工作效率,这些研究者就将这些代码写成了一个框架放到网上让所有研究者一起使用。接着,网上就出现了不同的框架。随着时间的推移,最为好用的几个框架被大量的人使用从而流行了起来。全世界最为流行的深度学习框架有
    PaddlePaddle、TensorFlow、Caffe、Theano、MXNet、Torch 和 PyTorch。


    ①TensorFlow。TensorFlow 是一款使用 C ++ 语言开发的开源数学计算软件,使用数据流图(Data Flow Graph)的形式进行计算。图中的节点代表数学运算,而图中的线条表示多维数据数组(Tensor)之间的交互。TensorFlow
    灵活的架构可以部署在一个或多个 CPU、GPU 的台式及服务器中,或者使用单一的 API 应用在移动设备中。TensorFlow 最初是由 Google Brainu
    团队针对机器学习和深度神经网络进行研究而开发,是目前全世界使用人数最多、社区最为庞大的一个框架,并且有着 Python 和 C ++ 的接口,教程也非常完善,所以是深度学习的主流框架。


    TensorFlow 在机器学习和深度神经领域应用很广,但缺点也较突出:过于复杂的系统设计,TensorFlow 的总代码量超过 100 万行;频繁变动的接口给开发和维护带来不便;接口设计晦涩难懂,不利于应用;技术文档混乱脱节,质量不高。


    由于其语言太过于底层,目前有很多基于 TensorFlow 的第三方抽象库将'
