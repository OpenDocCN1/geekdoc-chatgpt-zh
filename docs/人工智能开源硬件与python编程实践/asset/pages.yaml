    # 2) 特征提取的实现


    计算机视觉开源库中提供 image.find_keypoints([roi[, threshold = 20[, normalized = False[,
    scale_factor = 1.5[, max_keypoints = 100[, corner_detector = image.CORNER_AGAST]]]]]])
    方法,可以从 ROI 元组 (x, y, w, h) 中提取 ORB 键点。可以使用 image.match_descriptor 函数来比较两组关键点,以获取匹配区域。若未发现关键点,则返回
    None。


    其中,roi 是搜索区域的矩形元组 (x, y, w, h)。如果未指定,roi 即整个图像矩形区域,搜索操作范围仅限于 roi 区域内的像素。


    threshold 是控制提取的数量的参数(取值 0 ~ 255)。对于默认的 AGAST 角点检测器,该值应在 20 左右。对于 FAST 角点检测器,该值为
    60 ~ 80。阈值越低,提取的角点会越多。


    normalized 是布尔值。若为 True,在多分辨率下关闭提取键点。若编程者不关心处理扩展问题,且希望算法运行更快,可将之设置为 True。


    scale_factor 是一个必须大于 1.0 的浮点数。较高的比例因子会使运行更快,但图像匹配相应较差。理想值介于 1.35 ~ 1.5。max_keypoints
    是特征点对象所能容纳的特征点最大数量。若特征点对象过大会导致内存不足,应用时可以降低该值。corner_detector 是从图像中提取特征点所使用的角点检测器算法,可以是
    image.CORNER_FAST 或 image.CORNER_AGAST。FAST 角点检测器运行速度更快,但其准确度较低。


    find_keypoints 函数的默认用法是 find_keypoints( max_keypoints, thresholds, normalized
    = True )。设置好图形匹配应用的摄像头视频采集工作参数,即可在指定的图像区域内启动图像特征提取过程,Python 编程方法如下:

    img.find_keypoints(max_keypoints = 150,threshold = 10,normalized = True)'
