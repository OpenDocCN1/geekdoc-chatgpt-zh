    图 1.1 机器人索菲亚能够察言观色


    索菲亚(图 1.1)是国际上知名的人类机器人，她拥有真人般的皮肤，具有类似人的交流能力。索菲亚脸部皮肤下面设置有很多微电机，能够表现 62 种以上的面部表情，模拟人类做出微笑等面部动作。2017
    年 10 月 26 日，沙特阿拉伯授予机器人索菲亚公民身份。作为历史上首个获得公民身份的机器人，索菲亚当天在沙特说，它希望用人工智能“帮助人类过上更美好的生活”，人类不用害怕机器人，“你们对我好，我也会对你们好”。


    索菲亚通过嵌入的摄像头，借助计算机视觉技术，观察、识别身边人的体态动作、面部表情，并作出相应回应。索菲亚集成了语音识别技术，能识别和理解人类语言，实现人机交互。索菲亚“大脑”中的智能硬件算力强劲，利用深度学习等人工智能算法，能够快速完成信息采集、计算处理和智能控制。因此，在公共场合，机器人索菲亚表现出了令人惊讶的“察言观色、能说会道”等能力，并能够与人类进行眼神接触和交流互动。


    人工智能成为国际竞争的新焦点和经济发展的新引擎，世界各国都高度关注具有创新及实践能力的人工智能研究及应用人才的培养。机器人中的人工智能技术分为智能硬件和算法编程两部分，其中计算机视觉、语音交互和
    Python 编程都是当前最热点的技术。学习计算机视觉等人工智能技术，掌握 Python 编程方法，可以应用在目标跟踪、图像匹配、人脸检测、二维码识别、'
