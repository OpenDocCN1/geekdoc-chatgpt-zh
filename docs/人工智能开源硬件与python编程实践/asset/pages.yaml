    # 4 ) LeNet-5 模型的卷积神经网络


    LeNet-5 是一种经典的卷积神经网络结构。LeNet-5 诞生于 1994 年，是最早的深层卷积神经网络之一，开创了现代卷积神经网络的研究，推动了深度学习的发展。最初被用于手写数字识别，当年美国大多数银行就是用它来识别支票上面的手写数字的，它是早期卷积神经网络中最有代表性的实验系统之一。LeNet-5
    卷积神经网络的结构如图 14.4 所示。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_194_0.png)


    图 14.4 LeNet-5 卷积神经网络的结构


    不包含输入，LeNet-5 共有 7 层，即由 2 个卷积层，2 个下抽样层（池化层），3 个全连接层组成。每层都包含可训练参数，每个层有多个 feature
    map，每个 feature map 通过一种卷积滤波器提取输入的一种特征，然后每个 feature map 有多个神经元。其中：


    +   ①INPUT 为输入层。输入 32x32 格式大小的图片。


    +   ②C1 层是一个卷积层。输入图片大小为 32 x 32，卷积核大小为 5 x 5，卷积核种类为 6 个，输出 feature map 大小为 28
    x 28 (32 – 5 + 1)，神经元数量为 28 x 28 x 6。


    +   可训练参数为：(5 x 5 + 1) x6 (每个滤波器 5 x 5 = 25 个 unit 参数和一个 bias 参数，一共 6 个滤波器)，连接数为
    (5 x 5 + 1) x 6 x 28 x 28。


    +   ③S2 层是一个下采样层。输入区域为 28 x 28，采样区域为 2 x 2，即以 2 x 2 为单位进行下采样，采样种类为 6 种，采样方式如下：4
    个输入相加，乘以一个可训练参数，再加上一个可训练偏置，结果通过 Sigmoid 激活函数得到特征映射图。


    +   神经元数量为 14 x 14 x 6，可训练参数为 2 x 6 (和的权 + 偏置)，连接数'
  merge: -1
  img_proc: true
