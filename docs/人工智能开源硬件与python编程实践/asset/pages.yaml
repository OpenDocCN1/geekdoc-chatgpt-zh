    与传统单车不同,共享单车的核心技术是智能车锁(图 11.1)。共享单车的车锁一般包括中央控制单元,GPS 定位模块,无线移动通信模块 2G、蓝牙模块,机电锁车装置等。中央控制单元通过无线移动通信模块与后台管理系统进行连接,把从
    GPS 模块获取的位置信息发送给后台控制系统,后台系统标识成功后通过通信模块向中心控制单元发送解锁指令,接收到后台发送的机电锁车装置开、关锁的状态信息后再开启机械锁的控制插销开锁成功,当用户使用完成锁车时,会触发电子控制模块的锁车控制开关,然后后中央控制器通过无线移动通信模块通知后台管理系统锁车。


