    find_blobs 函数的默认用法是 find_blobs( thresholds, invert = False, roi = Auto)。设置好颜色跟踪应用的摄像头视频采集工作参数，将待追踪颜色的
    Lab 阈值传入 find_blobs 函数中，即可在指定的图像区域内启动颜色追踪过程。追踪某种红色的 Python 例程参考如下：


