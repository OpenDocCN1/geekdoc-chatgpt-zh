    \ # 设置分辨率为 QVGA(320 x 240)；\nsensor.set_windowing((320, 240)) # 将相机的分辨率设置为当前分辨\n\
    \                                   率的子分辨率 320 x 240；\nsensor.set_pixformat(sensor.GRAYSCALE)\
