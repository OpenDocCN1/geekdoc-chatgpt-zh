- pgno: 19
  md: 'OpenCV、三维可视化库 VTK、医学图像处理库 ITK 等。而 Python 专用的科学计算扩展库就更多，如 NumPy、SciPy 和 Matplotlib
    等著名的科学计算扩展库，它们分别为 Python 提供了快速数组处理、数值运算以及绘图功能。


    Python 提供了丰富的 API 和工具，支持程序员使用 C 语言、C++ 等语言来编写扩充模块。Python 在执行时，首先会将 .py 文件中的源代码编译成
    Python 的字节码（byte code），然后再由 Python Virtual Machine 虚拟机来执行已经编译好的 byte code。Python
    语言编程有以下特点：


    +   ①基本语法。Python 在设计时尽量使用其他语言经常使用的标点符号和英文单词，让代码看起来整洁美观。它不像其他的静态语言如 C、Pascal 那样需要重复书写声明语句。


    +   ②缩进。Python 开发者有意违反了缩进规则的程序不能通过编译，以此来强制程序员养成良好的编程习惯。Python 语言利用缩进表示语句块的开始和退出（Off-side
    规则），而非使用花括号或者某种关键字。


    +   ③表达式。Python 的表达式写法与 C/C++ 类似，只是在某些写法有所差别。主要的算术运算符与 C/C++ 类似。+、-、*、/、//、\*
    *、~、% 分别表示加法或者取正，减法或者取负，乘法，除法，整除，乘方，取补，取余。 >>、< 表示右移和左移。 &、|、^ 表示二进制的 and、or、xor
    运算。 >、<、==、!=、<=、>=、:= 用于比较两个表达式的值，分别表示大于、小于、等于、不等于、小于等于、大于等于。在这些运算符里面，~、|、^、<<、>>
    必须应用于整数。


    Python 使用 and、or、not 表示逻辑运算。is、is not 用于比较两个变量是否是同一个对象。in、not in 用于判断一个对象是否属于另外一个对象。


    +   ④运行速度。Python 的底层是用 C 语言写的，很多标准库和第三方库也都是用 C 语言写的，运行速度非常快。


    +   ⑤简单易学，容易上手，说明文档很多。


    # 5) 嵌入式 Python 编程基础


    嵌入式 Python 程序与 PC 上运行的 Python 程序结构基本一致，只是需要导入硬件内固化程序库，功能设计时经常会访问硬件板上的端口资源。嵌入式
    Python 程序的基本结构包含如下部分：


    +   ①注释说明行。单行注释以#起头，#右边的所有文本都被当作说明文字，而不是真正要执行的程序，只起到辅助说明作用。为了保证代码的可读性，注释和代码之间一般留有两个空格。


    如果需要编写的注释信息很长，一行无法显示，就可以使用多行注释。'
