    20 世纪 90 年代之后，语音识别与自然语言处理相结合，发展到基于自然口语识别和理解的人机对话系统。与机器翻译技术相结合，逐步发展出面向不同语种人类之间交流的直接语音翻译技术。


    # 3）语音信号的短时特性


    语音信号的特征是随时间变化的，具有短时性，在 5 ~ 50 ms 的一段时间间隔中，保持相对稳定一致的特性。语音信号的分析和处理都是建立在“短时”的基础上，按
    5 ~ 50 ms 分成语音帧进行处理，重要的计算参数有短时能量、短时过零率、短时自相关函数、短时频谱等。


    语音信号的最基本组成单位是音素，它分为浊音、清音和无音 3 类。浊音的短时能量值较大而短时过零率较小，波形上具有周期性，在频谱上有共振峰结构。清音帧短时能量值较小而短时过零率很大，没有周期性和共振峰特性，类似于白噪声。无音帧的短时能量值和短时过零率值都很小，利用这一特征可以快速判断说话语音的起点。


    # 4）语音识别应用中的语音特征参数选取


    在语音识别应用中，除了利用语音的短时特性外，还要利用语音在频谱上的丰富信息，如线性预测系数、倒谱特征等。根据人耳听觉机理的研究成果，人耳对不同频率的声波有不同的听觉敏感度，对
    200 Hz 到 5 000 Hz 之间的语音信号非常敏感。两个响度不等的声音作用于人耳时，则响度较高的频率成分的存在会影响到对响度较低的频率成分的感受，使其变得不易察觉，这种现象称为掩蔽效应。由于频率较低的声音在内耳蜕基底膜上行波传递的距离大于频率较高的声音，故一般来说，低音容易掩蔽高音，而高音掩蔽低音较困难。在低频处的声音掩蔽的临界带宽较高频要小。所以，人们从低频到高频这一段频带内按临界带宽的大小由密到疏安排一组带通滤波器，对输入信号进行滤波。将每个带通滤波器输出的信号能量作为信号的基本特征，对此特征经过进一步处理后就可以作为语音的输入特征。梅尔倒谱(
    MFCC )就是符合上述人耳声道模型和听觉机理的特征参数，'
  merge: -1
