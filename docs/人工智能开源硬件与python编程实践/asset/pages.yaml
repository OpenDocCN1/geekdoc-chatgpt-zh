    # 3) AlexNet 模型


    AlexNet 网络结构分为单通道和双通道，如图 13.2 所示。


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_178_0.png)


    ![](img/0e241de5c528c1a642a0be5d4ab7093c_178_1.png)


    图 13.2 AlexNet 模型结构


    Alex 在 2012 年提出的 AlexNet 网络结构模型开启了神经网络的应用热潮，并赢得了 2012 年图像识别大赛的冠军，使 CNN 成为在图像分类上的核心算法模型。从图
    13.2（b）可以看出该模型分为上下两组通道，可同时进行卷积处理，其优点是可以利用两台 GPU 服务器并行进行模型训练。


    ①Input 输入层。输入为 224 x 224 x 3 的三通道 RGB 图像，为方便后续计算，实际操作中通过 padding 做预处理，把图像变成 227
    x 227 x 3。'
  merge: -1
