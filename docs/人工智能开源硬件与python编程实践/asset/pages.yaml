    30 万像素，编程应用中常使用 QQVGA(160 x 120)、QVGA(320 x 240)分辨率格式，最大支持 VGA(640 x 480) 格式。


    在开源硬件控制板上集成的 OV7725 摄像头处理芯片可以直接采集图像帧数据。OV7725 感光元件在 80 FPS 帧率下可以处理 640 x 480 8bit
