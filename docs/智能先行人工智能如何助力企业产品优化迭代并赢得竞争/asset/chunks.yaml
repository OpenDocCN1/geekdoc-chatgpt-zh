    ## 定位


    在软件发展历程中，为了防止客户抛弃自己的产品转而使用竞争对手的产品，软件开发公司通常会将其产品与客户的使用环境进行深度融合。本节从更广泛的技术行业中吸取经验教训，将其应用于人工智能优先产品的研发中，编写新的框架，从三个层面将产品嵌入一个行业：存储、标准和生态系统。此外，本节还为那些购买人工智能优先产品的人提供了一份供应商合同中必须出现的项目列表。图8-10示意了产品定位。


    ![](EPUB/images/image_089.jpg)


    图8-10 产品定位


    以下是人工智能优先产品存储核心资产、设定标准、构建生态系统、打造品牌，以及率先获取价值的方式。


    ### 存储核心资产


    将数据存储管理嵌入人工智能优先产品：例如，提供强大的图像搜索工具，但这些工具只会提供给那些同意将其所有图像存储在你的数据库中，或者拥有捕获和存储数据传感器的客户。然而，存储客户数据需要就数据权限和他们进行协商。某种程度上来说，这是一个选择：即是否以更严格的条款获得一个大客户，利用临界数量的数据，训练出高准确度的模型，然后，以更宽松的条款快速吸纳市场中的其余客户；或者是否以更宽松的条件获得许多较小的客户，他们的数据总量可以达到临界值，能够将模型训练到很高的精度。


    这种选择取决于市场的数据动态：是一个还是几个客户拥有临界量的数据。如果一个客户的数据量就已经达到临界值，并且同意签署一份有效的数据权限协议，那么追求这一个客户就可以了，否则，就去追求多个客户。


    例如，公司通过要求客户将模型上传到云服务来存储模型，也可以嵌入人工智能优先产品中。也就是说，模型必须上传到云服务。这与大多数基于云的软件供应商管理产品存储和服务的方式类似。


    ### 设定标准


    供应商必须遵守产品生产标准，将标准制定者的产品嵌入一个生态系统中。这种嵌入式技术的做法不同于所谓的供应商锁定，因为供应商锁定是围绕一个带有限制性条款的商业安排进行的。标准设置可以通过两种方式实现：一是采用更先进的技术，二是占据市场主导地位。有很多伟大的公司将其技术嵌入一个生态系统中，比如思爱普、甲骨文和微软等。


    以文档和训练为表现形式的标准对协议、数据、产品、人员以及程序进行了锁定。


    - **协议锁定**来自需要遵守特定系统架构（如数据格式或模型结构）的其他供应商。这降低了潜在客户的转换成本，使其更容易采用符合标准的产品，但增加了当前客户的转换成本，因为搜索一个使用该协议或重新格式化数据的供应商，可能代价高昂。在数据世界中，最著名的例子可能是微软Excel。微软这款分析产品有着强大的锁定功能，因为其格式是独有的。让协议透明和可编辑——比如，开放数据源——是促使行业内其他人采用标准的主要方式之一。

    - **数据锁定**可能来自需要通过特定系统发送数据，并允许在途中收集数据的其他供应商。如果这些训练数据的智能系统比竞争对手的好，那么数据锁定可能会增加。例如，思爱普是供应链数据的中心，任何开发有助于理解供应链新软件的人都必须使用其数据协议。

    - **产品锁定**来自需要在特定界面中运行其软件的其他供应商。由于竞争产品界面之间的差异较小，因此产品锁定会增加。例如，赛富时提供了一个具有许多功能的客户关系管理系统，允许供应商在此基础上构建应用程序，但前提是这些应用程序必须在赛富时界面上运行。这样一来，客户很难看到在赛富时内部运行的应用程序的附加价值。

    - **人员锁定**来自客户的员工，他们已经习惯于使用基于其架构、数据或界面的产品。这增加了竞争对手的转换成本。例如，在过去几十年中，甲骨文——直接或间接——培训了许多使用其专有数据库查询语言的开发人员。如今，这些人可以轻松地在其他同样使用甲骨文数据库的公司之间流动。

    - **程序锁定**源自工作伙伴遵守操作流程以控制质量。这增加了转换成本，因为当前的客户不会选择其他供应商，除非他们与一个通常被称为系统集成商（SI）或独立软件供应商（ISV）的合作伙伴达成协议——而这些合作伙伴又会遵循这些操作流程。例如，云计算和虚拟化软件公司VMWare培训系统集成商在计算基础设施中正确安装其硬件。客户们不太可能冒险选择一个新的集成商为其建造一座全新的计算基础设施。


    在确定技术公司的产品和营销战略时，何时以及如何追求标准化以锁定客户，可能是最重要的问题之一。计算机非常复杂，需要整个生态系统的标准协同一致才能工作。何时设定标准取决于它是一个新市场，还是一个成熟的市场。


    为了广泛推广自己的技术，正在开辟新市场的公司通常更愿意推动标准化建设。标准不仅能够使客户轻松地集成现有系统——例如，通过以标准数据格式将数据放入其人工智能优先产品中，而且也为第三方开发人员打开了构建补充功能的大门。比如一个简单的界面，让客户可以调整人工智能模型中的参数，从而将产品市场从技术客户扩展到非技术客户。有了标准，公司更容易将自己定位为多面手，根据这些标准构建的工具了解新的技术。具备定制应用能力的多面手公司在这一点上发展迅速，因为产品空间存在碎片化。我们看到，例如，在市场生命周期的这一阶段，初创企业推迟了对垂直市场的关注。


    成熟市场中的主导企业倾向于降低标准化水平、促进分散，或实施高度详细的标准，以减少来自新公司的竞争。标准为新入行者进入成熟市场提供了便利，因为他们可以使用标准中的所有规范快速构建产品，并将其提供给已经习惯了该标准的客户。对新入行者来说，降低标准化水平不利于其打造一款客户可以轻松切换的产品。促进碎片化会让客户感到困惑，迫使他们转向拥有最稳定体系结构的主导供应商。详细的标准降低了新入行者生产差异化产品的能力，因为产品功能是由标准决定的，这会致使客户在选择主导供应商时，更加看重产品功能以外的东西，比如售后服务或者彼此之间的良好关系。在这一点上，高度专业化的公司能够推出符合每一项标准的成熟产品。因此，它们将会蓬勃发展。


    何时执行标准化计划，取决于谁在特定市场中发挥着主导作用。这些人可能处于生态链的最低层，例如运行软件的硬件制造商。每个人都希望硬件制造商会采用相关标准；否则，所有软件都将无法运行。计算机芯片制造商英伟达（NVIDIA）在机器学习市场就拥有这样的优势。从多个方面来衡量，这家总部位于加利福尼亚的公司生产的计算机芯片都有着最出色的性能，可以在上面运行多种类型的机器学习模型。开发人员学习NVIDIA开发的编程语言CUDA（统一计算设备架构），以便为NVIDIA的计算机芯片编写说明。一旦开发者使用了CUDA，该公司就可以向他们展示其想销售的其他新软件。搞清楚谁控制着关键用户界面以及谁控制着数据管道瓶颈，可能是需要考虑的关键因素。例如，企业资源规划软件可以收集并保存有关产品库存的数据。主导作用也可能来自买方而非供应商，因为政府和其他大型采购商在一定程度上可以影响标准的制定，使得行业标准与其现有基础设施能够完美契合。


    最后，公司和非公司组织的联盟倾向于为整个行业制定标准，因此，建立这样的联盟成为一种宝贵的战略能力。电信行业就是一个典型的例子，国际电信联盟（International
    Telecommunication Union，ITU）是由联合国创立的，通过与世界上主要的电信服务提供商、广播机构、手机和网络设备制造商的长期谈判，制定了移动设备通信标准。我们在软件行业也能看到这种现象，也会有一家公司为其他公司提供赞助，比如有了谷歌的赞助，Kubernetes（一种编写软件的方式，可以同时在云中的多台计算机上部署）和Keras（用于构建机器学习模型的一组框架）就能够巩固基于这些标准的内部开发工作，投资于不断增长的相关行业，吸引人才根据这些标准生产更好的产品，在积极的强化回路中不断壮大相关行业，等等。


    最终，客户将拒绝采用那些会将其锁定在某种产品中的功能，除非这些功能可以产生很多价值，因此，当这些功能还没有展现出好处时，过早地进行推广将是徒劳的。然而，推广太迟则会有失去客户的风险，届时他们可能会对提供相同功能的新入行者感兴趣。当技术新颖时，尽早采用限制性使用条款是保护知识产权的一种方式，而在竞争对手的技术迎头赶上后放松使用条款，则是通过让其他产品集成来扩大产品周围生态系统的明智之举。这既是产品战略，又是财务考量：产品战略关注的是客户是否有功能替代品；财务考量是关于是否可以通过扩大现有客户的使用范围，或者获取新客户来实现赢利——而这些新客户可能很难在相对严格的条件下融入该领域，新客户需要深度融合。


    ### 构建生态系统


    #### 兼容性


    对于需要从其他应用程序获取数据以训练底层模型的人工智能优先公司来说，兼容性——引入一种与客户已经使用的产品配合使用的新产品——是一个重要的考虑因素。真正新颖、革命性和纵向整合的产品可能与现有产品不兼容，但因其所提供的价值明显又完整，所以客户更愿意采用它们，这会导致计算、数据和人员配置等发生整体变化。事实上，革命性的产品拥有的技术可能太过新颖，以至于无法与现有技术兼容。苹果手机就是一个例子：最初几年，苹果公司禁止其他软件开发者为其手机设计应用程序，阻止人们使用微软邮箱和其他流行应用程序，但由于该产品极具革命性，所以售出了数百万台。然而，要想创造出真正新颖的产品，并将客户可能需要的所有东西纵向整合到该产品中，从一开始就非常困难。因此，公司在制定市场进入策略时，通常需要考虑产品兼容性。而那些通过改进而产生的不太新颖的横向产品，必须能够与现有产品兼容，因为它们提供的价值与客户正在使用的产品相关。关键是公司需要对产品的相对新颖性、与市场上其他产品的纵向整合程度及其依赖性进行客观的评估。有些产品最初可能是通过改进而得到的，比如记录系统的插件，但在通过该插件收集数据以构建真正新颖的预测系统后，它们可能就变成了革命性的产品——分析仪表盘就是一个很好的例子，它已经演变成了一个完整的决策系统。


    所有的公司并不是非要竭尽所能使自己的产品与其他产品兼容。现有公司的重点可能是构建集成，因为他们需要的是新产品提供的增量功能。从技术上来讲，不兼容问题可以通过中间技术或者向关键合作者授予知识产权来解决，从而支持并激励他们构建集成。实现兼容的方法有很多，但提供太多的兼容性可能会让竞争对手把客户抢走。何时让其他开发人员在你的产品的基础上进行开发是一个需要慎重考虑的问题。


    #### 互补性


    公司投资于互补产品，无论是通过构建互补产品，还是让一个开发者生态系统来构建它们，都会增加客户的价值。赛仕软件（SAS）和Tableau是两家生产分析产品的公司，其产品分别使用额外的统计和可视化功能对其他分析产品进行强化。公司将工程资源投资于互补产品开发时，需要在是否增加核心产品的竞争力与它们对客户的价值之间取得平衡。鼓励其他人不开发与核心产品发生竞争的补充产品，但最好开发可能会演变成颇具竞争力的补充产品。


    人工智能优先产品的前身是没有智慧功能的工作流产品，它们将数据整合到了一个地方——一个记录系统。例如，一个预测库存订购的产品需要记录系统中的库存数据来训练生成预测的模型。如果没有前身产品——一个保存数据的记录系统——构建该工作流产品，并免费提供给用户以获取数据，可以更深入地嵌入人工智能优先产品。


    ### 率先获取价值——先行优势


    尽管在管理战略领域存在争议，但首先进入市场无疑是建立竞争优势的一种方式，对于人工智能初创企业来说尤为适合：优点突出，没有缺点。


    先行者可以获取稀缺资产，构建技术领导力，并在竞争对手之前增加转换成本。人工智能优先公司就是如此。先行者先于竞争者收集稀缺资产；人工智能优先公司使用第三章“获取数据”中概述的多种方法之一在竞争对手之前收集数据（并确保拥有独家访问的权利）。谷歌在竞争对手之前收集并存储了大量搜索数据，从而使其搜索产品成为当今最好的产品。先行者通过领先于竞争对手的技术研发，建立起相对于竞争对手的技术优势；人工智能优先公司通过收集数据和设计智能系统的方法，构建了比竞争对手更好的智能系统。重要的是，在新型人工智能开发之前，先行者需要数据来进行实验。谷歌早就先于竞争对手通过实地驾驶汽车收集数据，并对自动驾驶研究进行投资，可以说谷歌拥有当今最有前途的自动驾驶汽车技术。先行者通过与现有系统集成，并从围绕着新入行者的不确定性中获益，从而产生转换成本；人工智能优先公司通过将客户的数据集中到自己的数据库中，并推出准确度极高的模型来增加转换成本。谷歌通过客户的电子邮件、位置和文档集将其数据进行集中，并保护起来，为人们要买的东西、要去的地方，甚至是要写的短语提供良好的建议。人工智能优先公司就是先行者。


    有时，率先采取行动可能会损害公司的竞争地位，因为潜在竞争对手会从先行者开发的技术中受益。围绕基础标准而增强的确定性，也让客户对如何使用新技术有更多的了解。但是，人工智能优先公司不会受到率先行动具有的潜在缺点的影响。搭便车的人无法从先行者开发的技术中获益，因为他们没有人工智能优先公司拥有的数据。比如说，有许多前途光明的基于人工智能的方法可以改进搜索，但要开发一种优于谷歌的搜索方式似乎很难，因为没有大量的搜索数据来训练模型，识别短语——尤其是那些不常用短语——的含义非常困难。搭便车的模仿者既需要技术，也需要数据。与提供标准服务的技术公司相比，人工智能优先公司围绕基础标准产生的客户确定性的相关性较小，因为人工智能优先公司是通过预测的准确度，而不是与现有系统的互操作性获得技术收益的。客户不会单独购买能够预测下一步销售线索的系统，因为该线索与绝大多数客户关系管理系统进行了集成，而客户只需要该线索与其当前使用的客户关系管理系统集成，并获得良好的潜在预测即可。人工智能优先公司能够享受更多客户确定性带来的好处，因为他们系统的准确度随着真实世界数据的增加而提高。最后，随着后起之秀更快地适应市场需求的变化，先行者有时会看到自己最初的领先地位受到威胁。需要再次强调的是，先行者具有的这种劣势不适用于人工智能优先公司，因为智能系统能够自动适应不断输入的数据。智能系统本质上是动态的，能够在竞争对手进入市场时进行调整。


    ### 打造品牌

