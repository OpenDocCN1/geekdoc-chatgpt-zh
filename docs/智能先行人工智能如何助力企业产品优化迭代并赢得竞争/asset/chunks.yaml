    ## 本章小结：构建业务模型


    尽管尖端研究的前沿正以前所未有的速度推进，但现在开展机器学习比以往任何时候都更容易。选择一个基础框架，并在其中运行数据，是一个极好的起点。我见过公司每天都在这么做，直到后来才深入解决更难的问题，比如定制模型组件以解决客户问题等。


    选择何种工作方法取决于你要做什么、要预测什么。一旦有机器学习模型跑通，你就需要退后一步，思考它们如何为公司的核心资产做出贡献。人工智能的力量在于随时间积累的信息，而许多信息蕴藏于数据中——即它所学到的东西。然而，人工智能生成的数据还与其学习规则的方法、特征、类别、结构、参数，以及每个循环周期产生的其他输出相关。


    ## 本章要点


    - **根据可用数据选择机器学习方法。** 监督学习需要训练和反馈数据，而无监督机器学习只需要大量数据。

    - **部分模型需要明确目标。** 强化学习模型需要目标。其他形式的机器学习通常不需要，它们甚至会毫无目的地输出信息。

    - **学会学习。** 部分人工智能会生成关于其学习方式的数据，在寻找新问题解决方案的过程中积累有价值的资产。


    # 第六章 模型管理


    下一个挑战是将人工智能从实验室带入现实世界。AI-First 产品具有吸引用户长时间使用的特性，但需要与现有软件、流程和系统建立连接，因此我们本章从最佳客户实践谈起。


    许多媒体报道称人工智能“已失控”：生成有偏见或冒犯性的输出，做出有问题的决策。当前的挑战是确保这些模型不会与现实脱节。AI-First 产品之所以强大，是因为它们不断适应、进化并产生新数据，但这种持续的变化使它们难以管理，就像平衡以下多维因素一样。


    ### 实验与实施


    自由实验能产出强大的模型，但这些模型必须在现实世界中应用，才能创造价值。


    ### 去中心化与中心化


    影响模型特性的专业知识是去中心化的——分散在各个组织中——但运行模型的软件基础设施却是中心化的。


    ### 测试与观察


    测试有助于暴露问题，但我们必须将模型置于现实世界中观察、学习。


    理想的模型管理系统允许 AI-First 公司运行去中心化的实验，严格测试模型，并在模型开始从真实数据中学习后对其进行监控。至关重要的是，理想的模型管理系统能让模型不间断地学习。


    创建一个闭环系统，在模型再次运行前验证其输出，可使模型保持受控状态。本章我们提出一个重要构想：构建机器学习管理回路——一个用于持续训练、修改、部署、测试、监控和修复模型的自动化系统。启动该回路时，你不必让整个回路全速运转，只需先跑通其中一部分即可。此外，我们还希望你对可能出现的问题及其发生时间有更清晰的认识，从而领先一步发现潜在问题。在此，我们将模型管理与科技行业中近似的概念联系起来，如敏捷开发、DevOps
    和统计过程控制（Statistical Process Control，SPC），同时也引入了管理智能系统的新理念。我们有两张图表带你读懂本章的两个部分：实施与管理。图
    6-1 展示了模型验收的步骤。


    ![](img/image_048.jpg)


    图 6-1 模型验收步骤


    ## 实施


    将模型从实验室移出投入实际应用，通常涉及大量人员、流程和软件。每一次实施都是独特的，所以我们的目的不是提供全面指南，而是提供引导该过程的路标。


    ### 数据


    智能系统需要数据。许多供应商可管理从客户处获取数据所需的提取、转换和加载（ETL）操作。然而，经常有一些重复性和独特性问题需要处理。客户可能对保留哪些表、如何定义数据元素有自己的主见，而且他们经常通过使用新产品来推动数据基础设施的重建。从一个数据库中用最少的表提取最少量的数据，有助于避免客户重建整个数据基础架构的问题，因为单次数据提取过程不太可能揭示数据存储、标记等方面的问题。无论如何，严格规定必要数据、指定负责完成任务的团队、积极管理
    ETL 产品供应商的选择过程，能让实施进行得更快。


    关于数据基础架构的选择，在探索阶段，人们会在成本、延迟、规模和安全性之间权衡。例如，运行小规模实验时成本不那么重要，因为不需要大量计算资源；但延迟更重要，因为快速获得结果可在相同时间内进行更多实验。在测试阶段规模不太重要，但进入生产阶段后将变得重要。在实验阶段，为获得高可用性（低延迟）数据库存储实验数据而支付更高费用是合理的，但在生产阶段则不然。你可以选择一个云供应商提供生产数据库，为全球客户快速自动启动新服务器。相较于传统软件公司，为
    AI-First 公司选择合适的数据库和数据基础设施更复杂，因为 AI-First 产品涉及定期训练、测试和生产周期，每个周期都有不同的成本、延迟、规模和安全需求。


    ### 软件


    智能系统有时有一个带用户界面的应用程序来提供预测，但有时它们直接与现有系统集成。例如，AI-First 客户关系管理（CRM）软件公司可能会为销售人员每天使用构建一个新应用，也可能向现有
    CRM 软件（如 Salesforce）提供建议。在后一种情况下，系统需要通过应用程序编程接口（API）连接到该前端应用。当应用拥有开放 API（如 Salesforce）时，这比较容易；而当它是封闭的（通常是付费的，如
    SAP），或者根本没有 API、需要定制集成时，就会比较困难。构建一个应用是一个全新的软件项目，涉及另一套考量因素，超出了本书讨论范围。


    ### 安全性


    智能系统通常使用大量数据。数据越多，风险越大，尤其是包含敏感信息时，例如一个人的实际位置或财务信息。每个数据集可能有不同的用户、权限和外部访问要求。例如，客户可访问实验数据集查看结果，但不能查看测试集，以防干扰测试。在客户数据受严格隐私法规约束的情况下，实验数据可能完全是合成的，如医疗数据。当生产数据需要包含在客户使用环境中时，可能会被完全混淆，这时就需要能在客户环境或系统上运行的自包含模型，例如使用隐私保护加密。访问权限管理通常是一个不确定的考量因素，涉及内外部利益相关者的现有权限。


    智能系统需要大量来自摄像头等传感器的数据，其中每一个传感器都是黑客攻击的潜在目标。通过联网摄像头、门铃甚至牙刷访问数据库，是黑客能做也会做的事。在对这些传感器上运行的软件建模时，AI-First
    公司必须了解安全缺陷，及时更新每个传感器。


    ### 传感器


    构建从传感器获取数据的智能系统时，AI-First 公司可能需要一个单独的工程和现场运营团队。将传感器从制造商处运送到客户手中是一项物流挑战，安装也涉及大量工作，如搭架、布线、连接互联网等。传感器部署面临环境挑战，如让热传感器在寒冷环境中工作；此外，传感器有时还需防盗。每组传感器都有特定的类型及使用环境，这给传感器群管理带来困难。在交易定价时，将这些实施成本与硬件费用分开预算至关重要。


    ### 服务


    软件应用往往涉及高度专业化的服务。这些服务通常由被称为系统集成商（Systems Integrators，SIs）和独立软件供应商（Independent
    Software Vendors，ISVs）的第三方提供。当内部解决既不经济也不具战略意义时，可考虑引入第三方。对 AI-First 公司而言，与系统集成商合作受益最大，因为集成软件的工作与集成客户数据、训练模型的工作是分离的。例如，预测送货卡车的停放位置以备下一批货物，所需数据可能位于旧版企业资源规划（ERP）系统中，如
    SAP。此时，最好与 SAP 专门的系统集成商合作获取数据，而不是通过阅读大量 SAP 文档自学获取方法。


    当工程实施需要安装和硬件维护时，系统集成商应是首选。专做硬件的系统集成商会与制造商合作安装和维护传感器。他们知道如何将传感器连接在一起、连接互联网、将数据导入数据库。他们的经验和专业关系通常能使安装更顺畅、问题解决更快、为客户提供更多可用库存以备不时之需。


    ### 人员配备


    AI-First 产品的实施团队可能包括数据校验员（检查数据质量）、数据工程师（数据清洗）、数据科学家（运行实验）和机器学习工程师（转化为模型）。此外，还有产品经理、应用开发人员、DevOps
    工程师，以及法务人员。


    与客户沟通结果可能需要单独聘用一个团队，因为他们擅长解释模型输出、向客户展示、在试点阶段激发客户热情、确保产品采购量。这些人通常具有咨询或其他专业服务背景，以及良好的数据科学基础。聘请团队定期制作演示文稿并向客户展示，可提高
    AI-First 产品的最终接受度。


    ### 接受度


    AI-First 产品可能面临技术和管理规定两方面的挑战，它们与现有系统集成度可能很高，其变化对决策过程影响巨大。以下是按时间顺序排列的、可提高 AI-First
    产品客户接受度的做法。


    #### 技术层面


    - **确保管用。** 预期终将与现实碰撞，最终结果非接受即拒绝。满足客户对 AI-First 产品的预期很难，因为这类产品承诺的是对现实世界即将发生之事的预测。而软件产品仅提供客户要求的功能。第一步是调查模型可用的数据。是否有基于
    AI 的便捷客户问题解决方案？

    - **不要因数据清洗分心。** 组织数据、集中存储、清洗标记、经济高效存储，是一个巨大且永久的难题。客户在组织数据上处于不同阶段，而 AI-First 产品可能成为数据组织项目的催化剂。这符合长期利益，因为有组织的数据能让
    AI 实验更快、更好、更廉价。然而，平衡长期利益与短期挑战——接受度——才是当务之急。只需手动提取必要数据，无需启动长达一年的数据库项目，即可将 AI-First
    产品交到客户手中。开发单一项目成本虽高，但总比从未完成项目要好。

    - **制定现实的时间表。** 客户需同时应对多个项目，需高效安排时间。为他们提供现实的路线图，使其能优先安排实施产品所需时间。没有路线图，概念验证（POC）可能引出另一个计划外的
    POC，以证明一些意外之事，降低产品热情。采购订单或另一个 POC 请求可能被拒。创建路线图并分发给所有利益相关者，让实施具备现实可能性。

    - **定期重新训练。** 根据新数据重新训练模型并快速部署，能建立积极反馈循环，让客户看到模型对其输入数据的响应，从而鼓励输入更多数据。

    - **快速开发功能。** 同软件开发一样，对客户反馈快速迭代，能产生更多反馈，同时建立信心。


    #### 管理规定——采购阶段


    - **增强而非自动化。** 务必将产品定位为增强人类专家能力的工具，消除他们被 AI 取代的恐惧。

    - **重视收入而非成本。** AI-First 产品能为客户省钱，他们会很高兴。但比省钱更令人兴奋的是赚钱。想办法让 AI-First 产品从新机会中创造收益，激发客户热情，提高投资回报率（ROI）。

    - **创建部门级 ROI。** 为每个业务部门创建 ROI 计算方式。最终在公司层面为客户投资提供回报。

    - **确保预算充足。** 确保客户预算覆盖项目实施所有辅助成本，从数据标注到购买传感器。例如，客户负担不起大量摄像头费用，可能意味着永远无法获得训练图像识别模型所需的数据。

    - **制定激励措施。** 与客户共同为关键利益相关者制定激励措施，确保项目成功实施。激励可来自客户方（如完成阶段性目标的现金奖励），也可与共享目标挂钩（如达到特定准确率获得奖励）。

    - **实行问责制。** 与客户共同确保实施过程核心人员——数据工程师和集成工程师——对完成任务负责。


    #### 管理规定——概念验证阶段


    - **缩短价值实现时间。** 尽快展示结果。这能消除质疑：系统是否有效、是否只是理论研究、项目是否会一再拖延、能否与其他系统整合。

    - **为买家而建。** 做购买决定的人和使用产品的人不总是同一人。为买家构建产品增强功能，如报告或管理仪表盘，有助于完成销售目标。

    - **参与实验。** 定期向关键利益相关者更新进展，通过建立对产品的信任和理解提高接受度。定期开会解释假设、展示实验结果，提高客户参与度。这些会议可能帮助客户从概率角度理解预测演变，并对假设提供反馈。


    #### 管理规定——执行阶段


    - **尽早广泛分发。** 接受 AI-First 产品可能是自我实现的预言：让更多人使用产品带来更多反馈数据，从而改进产品，说服更多人使用。因此，若 AI-First
    产品能尽快在管理链上垂直分发、在各业务单元水平分发，表现最佳。但若交给一个跨部门横向工作的单一分析团队，接受度会下降，因为横向团队无力推动产品采纳、无法通过培训有效传递知识、无动力在各部门完成实施。与客户合作，将产品垂直分发到每个业务部门，可能需合作建立新组织架构，或引入高层管理人员推动产品在全组织采用。

    - **提供高管教育。** 管理即提供方向，好的方向需要对任务有详细了解。向客户执行和管理团队传授 AI-First 产品背后的技术、熟练掌握术语、对模型功能有基本了解，确保高管具备向实施团队提供具体指导的能力。可提供自学材料，或聘请外部教育机构/咨询公司培训。

    - **嵌入可解释性。** 让客户熟悉 AI 做出特定预测的依据，不仅能培养信任，还能让他们了解如何改进给出错误预测的基础模型。

    - **追踪使用情况。** 追踪使用情况，确保客户在用产品。这在软件产品中常见，但当产品使用方式不像点击网页按钮那么简单时，常被忽视。AI-First 产品可能需通过调用
    API、读取数据库、标记或其他新方法追踪使用情况。


    这些实践解决了模型投产前、中、后的技术和社会层面认可问题。追求什么、何时追求，取决于各阶段的认可度。


    ## 机器学习管理回路


    客户希望模型准确且不损坏。这意味着模型需快速可靠地从现实世界数据中学习。人工监控系统速度不够快，因此我们需要一个持续、自动的模型管理系统，正如本章所提：从运行模型中获取观测结果和误差，找出保持模型运行、提高精度、减少误差的方法。机器学习管理回路如图
    6-2 所示。


    ![](img/image_049.jpg)


    图 6-2 机器学习管理回路


    该系统允许对真实数据进行持续整合。让我们浏览该系统的各个部分：训练、版本管理、部署、服务、测试和监控。评估步骤将在第七章“回路测量”中介绍。


    ### 训练


    该步骤位于评估和部署之前，模型会在该步骤中被重新构建。训练阶段的监控要点是分离数据集。图 6-3 示意了训练与评估。


    ![](img/image_050.jpg)


    图 6-3 训练与评估


    此时，数据集被分为训练集、测试集和验证集。分离测试数据可避免影响模型功能；而采用与训练集相同的数据测试模型，则能保证每次都有完美结果（注：此处原文逻辑为反讽/警示，意为若用训练集测试会虚假完美，故需分离）。


    当模型投入生产，它开始学习和改变，所以在投产前，需留出一组数据用于对照用户、客户、生产线或其他衡量对象。这有利于之后对比受 AI 影响的指标与不受影响的指标。对照组是使用遗留系统的一组完全独立实体，被隔离且根本不与
    AI 交互。这在纯软件产品中容易做到，但 AI 通过执行器、机器人或物理设备与现实世界交互，就难得多。纯软件产品通常有标记功能，可为不同用户群提供不同功能；硬件产品可能需在无特定执行器情况下设置系统的单独物理实例。创建对照组的附带好处是，为客户提供良好比较基础，以决定是否投资
    AI。


    此外，每个训练步骤的输出都向客户展示了训练能使模型对输出有效性做出反应。客户不仅能判断模型预测是否合理，或许还能根据经验提供更多关于预测功能的想法。例如，他们已看到每次下雨时，司机更倾向于在路线每站等待更久，延长送货时间。这可能使你将天气数据纳入模型并训练，看客户观察到的相关性在统计学上是否存在。若存在，可将天气作为送货时间预测特征。在训练阶段分享模型结果，类似于开发软件应用时为客户提供模拟界面。


    ### 版本管理


    图 6-4 示意了版本管理。


