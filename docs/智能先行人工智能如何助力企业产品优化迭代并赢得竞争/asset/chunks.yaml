- raw: '外包或众包员工既创建数据又标注数据。他们可以通过多种方式收集数据：例如，打电话、在线搜索、手动从网站上复制信息，以及其他可以简化为标准的、离散的和短任务的方法。他们使用市场提供的界面来标注数据，该界面既可以添加标签，又可以跟踪他们的工作。有些市场可以提供人在回路系统对数据进行标注。工人还可以通过消除重复的数据列表，纠正文本列表中的拼写错误，或者丢弃模糊的图像，有效地处理数据。


    外包的代价是专业化程度降低。外包业务的目标是迎合广泛的客户，因此他们拥有针对各种内容的标签，包括电影里的角色和街上跑的汽车。这些标注员没有接受过识别特定物体的训练，比如某款车或者机器运行中的扰动等。然而，考虑到他们为标注员制造的工具以及与其协商的价格，外包可能比内包更便宜。公司倾向于对内包和外包两种形式都进行尝试，根据数据标注需求，随着时间的推移实现平衡。


    外包可以采取多种形式。有咨询公司、业务流程外包公司，以及其他从事定制标注业务的公司。此外，众包业务也在蓬勃发展，该业务以单项小额费用项目的形式开展。前面提到的土耳其机器人和Upwork就是这种以任务为导向的业务提供商。


    ## **机器生成的数据**


    机器可以一致、快速、廉价地为模型生成数据，既可以作为人工生成数据的补充，又可以作为独立的资源。机器生成的数据如图3-10所示。


    ![](EPUB/images/image_035.jpg)


    图3-10 机器生成的数据


    **模拟**


    软件工程师使用模拟来验证程序功能的正确性，比如模拟电子游戏中迷宫的所有路径，或者电子流过电路板的方式。模拟可以用来测试软件。程序包含人类编写的逻辑规则，但我们并非总能设想出一个程序所需的所有输入，因此，我们编写模拟脚本来生成输入，然后将其放入程序，观察它是否可行。


    随着人工智能时代的到来，软件工程师发现了模拟的另一个用途。人工智能包含由人类或机器编写的、具有各种功能的模型。这些功能可以改变软件的功能而无须进一步地设计工作，因为它们可以从输入中学习。这就是不同之处：模拟可以发现普通软件中的故障，但在人工智能中，它却能够提升软件的性能。


    因此，模拟是推动人工智能进步的重要手段，特别是强化学习和其他代理人基学习人工智能。这种模型通常需要尝试多种方法，而且，由于现有数据集不足或者不可用，所以模拟器就变得非常有用。模型设计者为这些模型设定一个目标和环境，它们可以在这个环境中尝试许多不同的方法——通过一个模拟器来实现这个目标，其中包含了模型最终必须面对的现实世界的约束。如果模型在模拟环境中实现了目标，那么它可以将学到的知识应用到生产环境中，做出预测，从而做出真正的决策。


    **代理人基模型**


    我们如何生成有关复杂环境的数据呢？当*y*与*x*呈线性响应时，很容易对其进行建模。然而，当函数甚至变量的数量未知时，那么对y的行为进行建模就非常困难。复杂的经济和生物系统有许多变量，并对每个动作产生影响。在每个决策的微观层面为代理人的行为建模，可以帮助我们在宏观层面上了解系统中其他地方可能发生的情况。了解系统中的断点、路径依赖性和其他关键因素，可以更好地理解他们的潜在后果。代理人基模型（Agent-Based Models ，ABMs）可以做到这一点。


    在给定一系列激励和环境约束的情况下，代理人基模型参照其他代理人的行为，为代理人的行为进行建模。该领域借鉴了博弈论、社会学、进化论等学科知识，以及复杂性和随机性理论。创建一个代理人基模型需要弄清楚，系统中有多少代理，他们如何做出决策，如何从自己的行为中学习，以及这些行为如何影响系统中其他人的行为。代理人遵循程序化的规则。有时，为代理人编写程序需要具有特定领域的专业知识——了解“游戏规则”或系统原理。程序员使用对抗性学习和强化学习技术创建代理人基模型。《康威生命游戏》（*John Conway’s Game of Life*）和解决囚徒困境的游戏就是流行的代理人基系统。


    金融和政治机构也经常使用代理人基模型。例如，英格兰银行使用代理人基模型来模拟政策对房地产和信贷市场的影响。合并与收购对竞争的影响可以通过仿真有效地进行建模。使用代理人基模型进行宏观经济预测，对银行、资产管理公司，以及对冲基金的交易员和做市商具有重要意义。政府也使用该模型对环境政策的潜在影响进行评估。


    代理人基模型不同于模拟。代理人基模型学习可以被视为一个模拟的超集（superset）：代理人基模型环境定义松散，而模拟环境则定义严格。我们还可以从另外一个角度看到它们之间的差异：代理人基模型研究行为，而模拟器测试特定的结果。


    **合成数据**


    全新数据可以通过设计一组数据点的输出规则进行合成。这些规则需要按照规定的方式来创建——例如，所有桌子都必须有四条腿——或者可以从现有的数据集中学习，比如让模型认识所有的椅子也都有四条腿。合成数据拥有现有数据集的结构、概念、类型和依赖关系。合成和模拟的区别在于，模拟是用来验证的，而合成则是一个创造的过程。


    合成数据有很多用途。想要在客户数据上测试新产品功能的工程师通常使用真实的客户数据。这可能会导致错误操作或未经授权查看实时客户数据。想要演示功能性产品的销售人员，通常无法在没有产品底层数据的情况下进行演示。通常情况下，他们只用准确清晰的客户数据演示产品，而这可能会将客户信息暴露给竞争对手。除了这两种情况之外，对实时客户数据的任何处理都可能导致错误，从而导致安全漏洞。最安全的选择是根本不使用客户数据做任何事情。


    因为成本很高或者难度很大而无法进行数据标注时，合成数据就尤其有用。正如下面所描述的，演示所使用的大多数示例数据都与图像和计算机视觉模型有关，但维度却适用于其他类型的数据。


    **可扩展性**


    对某种形状的物体——比如椅子——进行标注是可行的，因为绝大多数人都能识别这种基本的物体。然而，如果考虑到形状中的所有潜在变化，比如躺椅、餐椅、办公椅等，那么这些物体会略有不同。训练模型识别椅子意味着识别所有类型的椅子，因此，训练数据必须包含所有类型的椅子。获取所有类型的椅子的图像，让人们对其进行标注费用高昂，甚至是不可行的。如果考虑到用于制造椅子的不同类型的材料，可能使椅子无法辨认的椅套等，情况就更是如此。合成数据生成器可以利用椅子基本组件——椅子腿、椅套、有靠背或无靠背等——的数据，然后运行这些组件的所有变体和组合，以非常低的成本生成数千个示例。


    **灵活性**


    从一个角度标注物体是可行的，因为大多数物体从某个角度看都是一样的，比如从街上看房子。然而，换个角度看——比如从高处，它们就会略有不同。如果有源源不断的数据来自一个四处移动的摄像头，比如无人机上的摄像头，那么，训练模型从任何角度来识别物体就十分必要。然而，对同一物体进行多视角观察，将会极大地增加数据采集的成本。合成数据生成器针对单个物体，通过对其进行三维建模，可以提供无限的视角，然后围绕其移动，在每一步都生成一个标注数据点。


    **可达性**


    对物体进行标注通常是可行的，因为它们的照片很容易获得，比如大街上的汽车。然而，有些物体很难找到，比如激战区的坦克照片。获取数据来训练这样一个模型可能代价高昂，或者几乎不可能实现。合成数据生成器可以获取此类对象的手动模型，并将其放入各种环境中。构建这样一个生成器可能需要很多钱，但该成本可以分摊到所有标注的数据点上，因为一个生成器可以用来生成同一物体的多个示例。构建这些生成器的工具与视频游戏设计师用来构建游戏环境的工具相同。


    **可行性**


    对物体进行标注是可行的，因为它们就像拍打海岸的海浪那样十分常见。然而，有些物体在现实世界中却很少见到，比如闪电引起的爆炸。如果没有大量的历史记录或长时间的等待，要想获取数据来训练这样的模型通常是不可行的。合成数据生成器可以选定一个场景，并按要求将其生产出来。


    **成本**


    合成数据可能比人类标注便宜，因为生成大量图像的程序可以在计算机上以低边际成本运行。然而，情况并非总是如此——例如，生成合成图像需要三维模型，而这些模型要么购买，要么由经验丰富的计算机图形艺术家绘制。


    **速度**


    合成数据可以比人类标注得更快。数据标注需要时间，该过程包括将要标注的数据打包、将其发送给标注员、等待他们完成工作、检查、偶尔重新标注、寄回、使用增量标签重新训练模型等。数据合成器几乎可以立即生成数据，并将其发送到数据管道中。


    因此，合成数据对于生成非结构化数据——例如图像——非常有用，但对于生成结构化数据——比如用户信息——就不那么有用。合成多维度椅子的图像将与许多不同的客户相关，因为在我们共同生活的世界里，椅子是一件常见的物品。然而，合成代表一组特定用户的数据与其他许多客户无关，因为那些用户并不在客户之间使用相同的配置文件。为一个用例合成数据只需要编写一个程序。为多个用例合成数据时，如果这些用例有共同的现实，比如物理世界，也只需要编写一个程序。


    ## **消费者生成的数据**


    给予适当的激励，消费者就会提供数据。这与客户提供数据有所不同，不同之处在于，客户为人工智能优先产品付费，而消费者只获取该产品的输出。消费者生成的数据如图3-11所示。


    ![](EPUB/images/image_036.jpg)


    图3-11 消费者生成的数据


    **基于令牌的激励**


    可以使用基于区块链的所有权令牌或加密令牌，激励人们向网络提交数据。由于这些概念相对较新，所以有必要对一些术语进行解释。


    **区块链：**一个去中心化的、分布式公共交易分类账簿。


    **加密令牌：**保留在区块链上的资产标识。


    **数据网络：**由一组原本不相关的实体而非单个实体构建的一组数据。


    这个想法是向一群人发放一个加密令牌，而他们将数据提交到，或者说卖给数据网络，然后获得收益。


    在构建数据网络方面，区块链提供了两个好处。首先，区块链可以验证数据的来源。区块链上每个实体提交的数据都会被赋予一个唯一标识符。当有人对该数据何时提交，甚至是否提交有疑问时，就可以对该区块链进行查询。当区块链有足够多的实体验证交易时，数据来源就绝对没有问题。其次，加密令牌是一种安全的、自动向数据贡献者付费的方式。付款计算是一个严肃又透明的数学问题。令牌所有者根据其对网络的数据贡献获得报酬，并由区块链上的所有实体验证。令牌由一组分散的实体进行验证，这意味着任何一方都不能使令牌所有者的付款请求无效。令牌管理系统之所以具有可衡量性，是因为如下两个原因：一是一旦注册，所有权就不需要更改或管理；二是付款是根据贡献公式自动计算出来的，从而降低了系统操作员和数据贡献者之间发生冲突的可能性。


    在区块链上运行数据网络面临的挑战是，通过验证来实现标准化，即在提交数据时就对其进行自动验证，然后自动对其进行补偿。通过标准化的方法就可以做到这一点——只对具有特定参数（例如名称和电子邮件地址）的数据贡献者进行补偿。当参数难以确定时，只要数据通过了包含特定值范围的过滤器，提交时通过了基于软件的验证，就会被认为是同一类型但不同形式的数据。


    **消费者应用程序**


    对于当今科技行业的领导者来说，消费者应用程序可能是最重要的独特数据来源。脸书通过数据建立了竞争优势，并利用机器学习对其进行了进一步的强化。这些公司每天从其用户那里收集大量数据，然后利用这些数据进行预测，以改进消费产品或者其周围的商业模式。


    在过去的几十年里，谷歌将一些极具创新性的产品推向市场，而其中许多产品是不向消费者收费的。在制订产品计划时，该公司采取了免费赠送产品的方式来收集数据并获得市场份额。然后，利用这些数据建立系统，预测人们希望看到哪些广告，尔后将这些预测以价格合理、表现亮眼的广告形式出售给某些品牌。如今，消费端的数据收集活动和商业端的创收活动之间的关系是显而易见的，但在谷歌成立时，情况并非如此。当时，网络上的大多数广告都是横幅形式的——基本上是在线广告牌，不针对网站的任何特定访问者。谷歌通过几种方式改变了这一模式，主要的做法是根据访问者在网站上搜索的内容和其他辅助数据——比如每个人的位置——进行预测。事实证明，这些数据在提高访问者对广告的兴趣，以及谷歌销售这些广告的收入方面非常有效。


    谷歌还为我们提供了许多其他可靠的数据策略。谷歌翻译是免费的，但谷歌并不出售它在用户进行翻译时开发的词典。谷歌TensorFlow——一款机器学习模型管理工具——是免费的，但谷歌并不出售人们提供给该模型的数据。谷歌搜索也是免费的，但谷歌不会（直接）向营销人员或其他搜索公司销售搜索数据。谷歌是一个极具韧性的企业，因为它一直奉行收集有价值数据以构建智能产品的策略。


    脸书——世界上占主导地位之一的社交网络——拉近了我们之间的距离，而且不向用户收取任何费用。随着用户与朋友分享他们的兴趣、希望和梦想，该公司的产品积累了大量的数据，而且还在继续发布收集更多此类数据的产品。脸书利用这些数据构建系统，预测人们希望看到哪些广告，然后将这些预测以价格合理、表现亮眼的广告形式出售给某些品牌。脸书的广告特别有效，因为其访问者是在登录状态下浏览的，这意味着脸书了解每一个人的浏览情况，从而更准确地将广告推送给他们。


    亚马逊改变了多种产品的采购方式，使之比其他任何方式都更便宜、更容易。这家科技巨头根据客户购买的商品和浏览方式，收集有关客户需求的数据，然后利用这些数据提出更好的建议。亚马逊这样做已经有很长时间，因此，它能够比其他购物网站提供更好的推荐。


    出于一个原因从消费者那里收集数据，然后出于另一个原因将数据出售给企业是很常见的事情，而且还可以成为大企业的基础业务。例如，23andMe公司利用基因组学做了这件事，BillGuard公司通过购买数据，Credit Karma公司使用信用评分，Onavo公司借助应用程序监控，Dark Sky公司则凭借位置数据，都做了同样的事情。然而，以这种方式建立一个稳固的企业可能非常困难。首先，让用户提交数据的“把戏”并非长久之计；另一家公司也许能够使用相同的或者收费更低的其他技巧获得相同的数据。其次，这个技巧可能需要向数据管道支付费用，例如，向开发人员付款，让他们安装软件开发工具包（SDK）作为数据管道。如果这些开发人员想要收取更多费用，或者消费者想要支付更少费用，那么，销售数据的利润可能就会消失。最后，人们无法从静态数据中获取价值，并定期获得收入，因为对于消费者来说，这些数据的价值可能会随着时间推移而消失。此外，还有必要提及的是，目前科技行业的引领者并不是商业软件公司。公司之间不愿互相提供数据。一方面，大型商业软件公司通常在竞争激烈的环境中运营，因此，会严格限制与其他软件供应商共享的内容，因为这些供应商可能会向其竞争对手出售软件。另一方面，消费者没有这样的竞争忧虑，而且也不那么关注隐私问题。


    **传感器网络**


    从真实世界汇集数据——而不仅仅是从其他软件中汇集数据——需要考虑一系列不同的因素。创建传感器网络以收集数据是构建数据集的一种方法，但部署这样一个网络可能成本高昂，因为传感器可以是简单的计数工具，也可以是飞机黑匣子那样更为复杂的东西。


    最明显、最普通的传感器网络就是遍布全球的手机网络。这些手机中有许多单独的传感器，软件应用程序可以利用它们来收集数据。例如，应用程序Dark Sky通过手机的气压传感器获取大气压数据，并对其进行汇总，从而提供本地区域之外的天气预测。此外，该公司还收集位置数据并出售给第三方。如今，手机中传感器的大部分数据都被公司获取，但可能还存在从相对较新的传感器或者以不同方式使用传感器收集独特数据的机会。


    廉价且丰富的商品传感器将是未来最明显、最易得的数据来源。考虑到成本和可用性，此类传感器当然不会即时生成专有数据。在这种情况下，专有数据将由此类传感器网络生成，其竞争优势是通过分配传感器的专有方式产生的，例如，在特定地区的每家零售店放置一台设备，以统计进出人数。


    专有传感器是最不明显、最难得的数据来源。人们可以制造传感器来测量任何东西，从生物信号、身体功能，到海底现象，如温跃层等。然而，由于传感器十分复杂，因此构建和制造传感器可能非常困难。传感器设计、制造材料、将传感器连接到计算设备的部件、通信方法、生产流程，以及与现有传感器的集成都可以通过保护知识产权的方式，成为企业竞争优势的来源。传感器一旦建成，接下来的挑战就是如何说服人们安装这些传感器。如果没有相应的好处，人们不会在家里安装一个既耗电又吵闹的设备。最有效的激励方式就是付钱给用户，像尼尔森（Nielsen，全球著名市场监测和数据分析公司）那样，付费让人们在电视上安装一个跟踪他们观看习惯的盒子。另一个很有效的方法是，提供一个既可以处理来自传感器的数据，又可以为客户提供帮助的应用程序。这一模式成功的原因是为传感器用户节省开支，例如，安装用电传感器、收集数据，通过传感器网络聚合数据，然后与电力公司协商节约成本。


    ## **公共数据**


    对于人工智能优先公司来说，有许多公共数据资源可以使用。这些资源可能很难获得，而且争议性颇大，却是免费的。图3-12展示了公共数据。


    ![](EPUB/images/image_037.jpg)


    图3-12 公共数据


    **网络爬取**


    互联网上有很多信息，其中大部分是结构化的，因此可以用于训练机器学习系统。这就是谷歌获得数据优势的方式，该公司可以说是当今世界上最大的网络爬虫。


    数量能保障质量，大量数据的积累可以形成竞争优势。从互联网上收集数据通常被称为爬取。通俗地讲，爬虫就是一个程序，它通过统一资源定位器（Uniform Resource Locator，URL）系统地查找网页或互联网上的其他资源，删除不必要的东西，例如格式，获取重要（或全部）数据，将其以标准文档格式（例如，JS对象简谱，JavaScript Object Notation，JSON）保存，并将其传递到自己的数据库。例如，爬虫可以登录美国政府的金融市场监管部门美国证券交易委员会（US Securities and Exchange Commission，SEC）的网站，访问以超文本标记语言（HTML）文件形式存储的公司报告，去掉格式，找到年度收入数字，将它们放在JSON文档中，然后存储到数据库中。从技术上来讲，爬取非常困难，因为网页和其他资源的形式、位置和可用性总在发生变化。好的爬虫需要具有很高的适应性。


    爬取是一项大生意，许多公司提供爬取服务。有些公司推出定制爬虫从特定资源收集数据点的业务。有些公司定期从一组特定的网页中提取新鲜数据，所使用的爬虫是为了适应页面不可用或经常变化的情况而定制的。还有一些公司提供定制爬取系统，可以提取网页上的任何可用数据。


    有一个方案可以替代爬取服务，那就是使用可以提供数据即服务（Data as a Service，DaaS）的应用程序编程接口。该服务可以有效地进行爬取，然后通过应用程序编程接口中的特定端点提供数据。提供数据即服务的公司运行自己的爬虫——或许还有其他数据收集方法——持续提供最新的、随时可用的高质量数据。其他功能可能包括，将电子邮件地址输入一个应用程序编程接口，该接口会提供该地址所有人的姓名、头衔和所工作的公司等消息。提供这项服务的公司可以通过数百种不同的方式获取这些数据，比如爬取公共资源和政府网站等。'
  fmt: '

    # 外包与众包数据


    外包或众包员工既创建数据又标注数据。他们可以通过多种方式收集数据：例如，打电话、在线搜索、手动从网站上复制信息，以及其他可以简化为标准的、离散的和短任务的方法。他们使用市场提供的界面来标注数据，该界面既可以添加标签，又可以跟踪他们的工作。有些市场可以提供人在回路系统对数据进行标注。工人还可以通过消除重复的数据列表，纠正文本列表中的拼写错误，或者丢弃模糊的图像，有效地处理数据。


    外包的代价是专业化程度降低。外包业务的目标是迎合广泛的客户，因此他们拥有针对各种内容的标签，包括电影里的角色和街上跑的汽车。这些标注员没有接受过识别特定物体的训练，比如某款车或者机器运行中的扰动等。然而，考虑到他们为标注员制造的工具以及与其协商的价格，外包可能比内包更便宜。公司倾向于对内包和外包两种形式都进行尝试，根据数据标注需求，随着时间的推移实现平衡。


    外包可以采取多种形式。有咨询公司、业务流程外包公司，以及其他从事定制标注业务的公司。此外，众包业务也在蓬勃发展，该业务以单项小额费用项目的形式开展。前面提到的土耳其机器人和Upwork就是这种以任务为导向的业务提供商。


    # 机器生成的数据


    机器可以一致、快速、廉价地为模型生成数据，既可以作为人工生成数据的补充，又可以作为独立的资源。机器生成的数据如图3-10所示。


    ![](EPUB/images/image_035.jpg)


    图3-10 机器生成的数据


    ## 模拟


    软件工程师使用模拟来验证程序功能的正确性，比如模拟电子游戏中迷宫的所有路径，或者电子流过电路板的方式。模拟可以用来测试软件。程序包含人类编写的逻辑规则，但我们并非总能设想出一个程序所需的所有输入，因此，我们编写模拟脚本来生成输入，然后将其放入程序，观察它是否可行。


    随着人工智能时代的到来，软件工程师发现了模拟的另一个用途。人工智能包含由人类或机器编写的、具有各种功能的模型。这些功能可以改变软件的功能而无须进一步地设计工作，因为它们可以从输入中学习。这就是不同之处：模拟可以发现普通软件中的故障，但在人工智能中，它却能够提升软件的性能。


    因此，模拟是推动人工智能进步的重要手段，特别是强化学习和其他代理人基学习人工智能。这种模型通常需要尝试多种方法，而且，由于现有数据集不足或者不可用，所以模拟器就变得非常有用。模型设计者为这些模型设定一个目标和环境，它们可以在这个环境中尝试许多不同的方法——通过一个模拟器来实现这个目标，其中包含了模型最终必须面对的现实世界的约束。如果模型在模拟环境中实现了目标，那么它可以将学到的知识应用到生产环境中，做出预测，从而做出真正的决策。


    ## 代理人基模型


    我们如何生成有关复杂环境的数据呢？当`y`与`x`呈线性响应时，很容易对其进行建模。然而，当函数甚至变量的数量未知时，那么对y的行为进行建模就非常困难。复杂的经济和生物系统有许多变量，并对每个动作产生影响。在每个决策的微观层面为代理人的行为建模，可以帮助我们在宏观层面上了解系统中其他地方可能发生的情况。了解系统中的断点、路径依赖性和其他关键因素，可以更好地理解他们的潜在后果。代理人基模型（`Agent-Based
    Models`，`ABMs`）可以做到这一点。


    在给定一系列激励和环境约束的情况下，代理人基模型参照其他代理人的行为，为代理人的行为进行建模。该领域借鉴了博弈论、社会学、进化论等学科知识，以及复杂性和随机性理论。创建一个代理人基模型需要弄清楚，系统中有多少代理，他们如何做出决策，如何从自己的行为中学习，以及这些行为如何影响系统中其他人的行为。代理人遵循程序化的规则。有时，为代理人编写程序需要具有特定领域的专业知识——了解“游戏规则”或系统原理。程序员使用对抗性学习和强化学习技术创建代理人基模型。《康威生命游戏》（`Game
    of Life`）和解决囚徒困境的游戏就是流行的代理人基系统。


    金融和政治机构也经常使用代理人基模型。例如，英格兰银行使用代理人基模型来模拟政策对房地产和信贷市场的影响。合并与收购对竞争的影响可以通过仿真有效地进行建模。使用代理人基模型进行宏观经济预测，对银行、资产管理公司，以及对冲基金的交易员和做市商具有重要意义。政府也使用该模型对环境政策的潜在影响进行评估。


    代理人基模型不同于模拟。代理人基模型学习可以被视为一个模拟的超集（superset）：代理人基模型环境定义松散，而模拟环境则定义严格。我们还可以从另外一个角度看到它们之间的差异：代理人基模型研究行为，而模拟器测试特定的结果。


    ## 合成数据


    全新数据可以通过设计一组数据点的输出规则进行合成。这些规则需要按照规定的方式来创建——例如，所有桌子都必须有四条腿——或者可以从现有的数据集中学习，比如让模型认识所有的椅子也都有四条腿。合成数据拥有现有数据集的结构、概念、类型和依赖关系。合成和模拟的区别在于，模拟是用来验证的，而合成则是一个创造的过程。


    合成数据有很多用途。想要在客户数据上测试新产品功能的工程师通常使用真实的客户数据。这可能会导致错误操作或未经授权查看实时客户数据。想要演示功能性产品的销售人员，通常无法在没有产品底层数据的情况下进行演示。通常情况下，他们只用准确清晰的客户数据演示产品，而这可能会将客户信息暴露给竞争对手。除了这两种情况之外，对实时客户数据的任何处理都可能导致错误，从而导致安全漏洞。最安全的选择是根本不使用客户数据做任何事情。


    因为成本很高或者难度很大而无法进行数据标注时，合成数据就尤其有用。正如下面所描述的，演示所使用的大多数示例数据都与图像和计算机视觉模型有关，但维度却适用于其他类型的数据。


    ### 可扩展性


    对某种形状的物体——比如椅子——进行标注是可行的，因为绝大多数人都能识别这种基本的物体。然而，如果考虑到形状中的所有潜在变化，比如躺椅、餐椅、办公椅等，那么这些物体会略有不同。训练模型识别椅子意味着识别所有类型的椅子，因此，训练数据必须包含所有类型的椅子。获取所有类型的椅子的图像，让人们对其进行标注费用高昂，甚至是不可行的。如果考虑到用于制造椅子的不同类型的材料，可能使椅子无法辨认的椅套等，情况就更是如此。合成数据生成器可以利用椅子基本组件——椅子腿、椅套、有靠背或无靠背等——的数据，然后运行这些组件的所有变体和组合，以非常低的成本生成数千个示例。


    ### 灵活性


    从一个角度标注物体是可行的，因为大多数物体从某个角度看都是一样的，比如从街上看房子。然而，换个角度看——比如从高处，它们就会略有不同。如果有源源不断的数据来自一个四处移动的摄像头，比如无人机上的摄像头，那么，训练模型从任何角度来识别物体就十分必要。然而，对同一物体进行多视角观察，将会极大地增加数据采集的成本。合成数据生成器针对单个物体，通过对其进行三维建模，可以提供无限的视角，然后围绕其移动，在每一步都生成一个标注数据点。


    ### 可达性


    对物体进行标注通常是可行的，因为它们的照片很容易获得，比如大街上的汽车。然而，有些物体很难找到，比如激战区的坦克照片。获取数据来训练这样一个模型可能代价高昂，或者几乎不可能实现。合成数据生成器可以获取此类对象的手动模型，并将其放入各种环境中。构建这样一个生成器可能需要很多钱，但该成本可以分摊到所有标注的数据点上，因为一个生成器可以用来生成同一物体的多个示例。构建这些生成器的工具与视频游戏设计师用来构建游戏环境的工具相同。


    ### 可行性


    对物体进行标注是可行的，因为它们就像拍打海岸的海浪那样十分常见。然而，有些物体在现实世界中却很少见到，比如闪电引起的爆炸。如果没有大量的历史记录或长时间的等待，要想获取数据来训练这样的模型通常是不可行的。合成数据生成器可以选定一个场景，并按要求将其生产出来。


    ### 成本


    合成数据可能比人类标注便宜，因为生成大量图像的程序可以在计算机上以低边际成本运行。然而，情况并非总是如此——例如，生成合成图像需要三维模型，而这些模型要么购买，要么由经验丰富的计算机图形艺术家绘制。


    ### 速度


    合成数据可以比人类标注得更快。数据标注需要时间，该过程包括将要标注的数据打包、将其发送给标注员、等待他们完成工作、检查、偶尔重新标注、寄回、使用增量标签重新训练模型等。数据合成器几乎可以立即生成数据，并将其发送到数据管道中。


    因此，合成数据对于生成非结构化数据——例如图像——非常有用，但对于生成结构化数据——比如用户信息——就不那么有用。合成多维度椅子的图像将与许多不同的客户相关，因为在我们共同生活的世界里，椅子是一件常见的物品。然而，合成代表一组特定用户的数据与其他许多客户无关，因为那些用户并不在客户之间使用相同的配置文件。为一个用例合成数据只需要编写一个程序。为多个用例合成数据时，如果这些用例有共同的现实，比如物理世界，也只需要编写一个程序。


    # 消费者生成的数据


    给予适当的激励，消费者就会提供数据。这与客户提供数据有所不同，不同之处在于，客户为人工智能优先产品付费，而消费者只获取该产品的输出。消费者生成的数据如图3-11所示。


    ![](EPUB/images/image_036.jpg)


    图3-11 消费者生成的数据


    ## 基于令牌的激励


    可以使用基于区块链的所有权令牌或加密令牌，激励人们向网络提交数据。由于这些概念相对较新，所以有必要对一些术语进行解释。


    **区块链：**一个去中心化的、分布式公共交易分类账簿。


    **加密令牌：**保留在区块链上的资产标识。


    **数据网络：**由一组原本不相关的实体而非单个实体构建的一组数据。


    这个想法是向一群人发放一个加密令牌，而他们将数据提交到，或者说卖给数据网络，然后获得收益。


    在构建数据网络方面，区块链提供了两个好处。首先，区块链可以验证数据的来源。区块链上每个实体提交的数据都会被赋予一个唯一标识符。当有人对该数据何时提交，甚至是否提交有疑问时，就可以对该区块链进行查询。当区块链有足够多的实体验证交易时，数据来源就绝对没有问题。其次，加密令牌是一种安全的、自动向数据贡献者付费的方式。付款计算是一个严肃又透明的数学问题。令牌所有者根据其对网络的数据贡献获得报酬，并由区块链上的所有实体验证。令牌由一组分散的实体进行验证，这意味着任何一方都不能使令牌所有者的付款请求无效。令牌管理系统之所以具有可衡量性，是因为如下两个原因：一是一旦注册，所有权就不需要更改或管理；二是付款是根据贡献公式自动计算出来的，从而降低了系统操作员和数据贡献者之间发生冲突的可能性。


    在区块链上运行数据网络面临的挑战是，通过验证来实现标准化，即在提交数据时就对其进行自动验证，然后自动对其进行补偿。通过标准化的方法就可以做到这一点——只对具有特定参数（例如名称和电子邮件地址）的数据贡献者进行补偿。当参数难以确定时，只要数据通过了包含特定值范围的过滤器，提交时通过了基于软件的验证，就会被认为是同一类型但不同形式的数据。


    ## 消费者应用程序


    对于当今科技行业的领导者来说，消费者应用程序可能是最重要的独特数据来源。脸书通过数据建立了竞争优势，并利用机器学习对其进行了进一步的强化。这些公司每天从其用户那里收集大量数据，然后利用这些数据进行预测，以改进消费产品或者其周围的商业模式。


    在过去的几十年里，谷歌将一些极具创新性的产品推向市场，而其中许多产品是不向消费者收费的。在制订产品计划时，该公司采取了免费赠送产品的方式来收集数据并获得市场份额。然后，利用这些数据建立系统，预测人们希望看到哪些广告，尔后将这些预测以价格合理、表现亮眼的广告形式出售给某些品牌。如今，消费端的数据收集活动和商业端的创收活动之间的关系是显而易见的，但在谷歌成立时，情况并非如此。当时，网络上的大多数广告都是横幅形式的——基本上是在线广告牌，不针对网站的任何特定访问者。谷歌通过几种方式改变了这一模式，主要的做法是根据访问者在网站上搜索的内容和其他辅助数据——比如每个人的位置——进行预测。事实证明，这些数据在提高访问者对广告的兴趣，以及谷歌销售这些广告的收入方面非常有效。


    谷歌还为我们提供了许多其他可靠的数据策略。谷歌翻译是免费的，但谷歌并不出售它在用户进行翻译时开发的词典。谷歌`TensorFlow`——一款机器学习模型管理工具——是免费的，但谷歌并不出售人们提供给该模型的数据。谷歌搜索也是免费的，但谷歌不会（直接）向营销人员或其他搜索公司销售搜索数据。谷歌是一个极具韧性的企业，因为它一直奉行收集有价值数据以构建智能产品的策略。


    脸书——世界上占主导地位之一的社交网络——拉近了我们之间的距离，而且不向用户收取任何费用。随着用户与朋友分享他们的兴趣、希望和梦想，该公司的产品积累了大量的数据，而且还在继续发布收集更多此类数据的产品。脸书利用这些数据构建系统，预测人们希望看到哪些广告，然后将这些预测以价格合理、表现亮眼的广告形式出售给某些品牌。脸书的广告特别有效，因为其访问者是在登录状态下浏览的，这意味着脸书了解每一个人的浏览情况，从而更准确地将广告推送给他们。


    亚马逊改变了多种产品的采购方式，使之比其他任何方式都更便宜、更容易。这家科技巨头根据客户购买的商品和浏览方式，收集有关客户需求的数据，然后利用这些数据提出更好的建议。亚马逊这样做已经有很长时间，因此，它能够比其他购物网站提供更好的推荐。


    出于一个原因从消费者那里收集数据，然后出于另一个原因将数据出售给企业是很常见的事情，而且还可以成为大企业的基础业务。例如，23andMe公司利用基因组学做了这件事，BillGuard公司通过购买数据，Credit
    Karma公司使用信用评分，Onavo公司借助应用程序监控，Dark Sky公司则凭借位置数据，都做了同样的事情。然而，以这种方式建立一个稳固的企业可能非常困难。首先，让用户提交数据的“把戏”并非长久之计；另一家公司也许能够使用相同的或者收费更低的其他技巧获得相同的数据。其次，这个技巧可能需要向数据管道支付费用，例如，向开发人员付款，让他们安装`SDK`作为数据管道。如果这些开发人员想要收取更多费用，或者消费者想要支付更少费用，那么，销售数据的利润可能就会消失。最后，人们无法从静态数据中获取价值，并定期获得收入，因为对于消费者来说，这些数据的价值可能会随着时间推移而消失。此外，还有必要提及的是，目前科技行业的引领者并不是商业软件公司。公司之间不愿互相提供数据。一方面，大型商业软件公司通常在竞争激烈的环境中运营，因此，会严格限制与其他软件供应商共享的内容，因为这些供应商可能会向其竞争对手出售软件。另一方面，消费者没有这样的竞争忧虑，而且也不那么关注隐私问题。


    ## 传感器网络


    从真实世界汇集数据——而不仅仅是从其他软件中汇集数据——需要考虑一系列不同的因素。创建传感器网络以收集数据是构建数据集的一种方法，但部署这样一个网络可能成本高昂，因为传感器可以是简单的计数工具，也可以是飞机黑匣子那样更为复杂的东西。


    最明显、最普通的传感器网络就是遍布全球的手机网络。这些手机中有许多单独的传感器，软件应用程序可以利用它们来收集数据。例如，应用程序Dark Sky通过手机的气压传感器获取大气压数据，并对其进行汇总，从而提供本地区域之外的天气预测。此外，该公司还收集位置数据并出售给第三方。如今，手机中传感器的大部分数据都被公司获取，但可能还存在从相对较新的传感器或者以不同方式使用传感器收集独特数据的机会。


    廉价且丰富的商品传感器将是未来最明显、最易得的数据来源。考虑到成本和可用性，此类传感器当然不会即时生成专有数据。在这种情况下，专有数据将由此类传感器网络生成，其竞争优势是通过分配传感器的专有方式产生的，例如，在特定地区的每家零售店放置一台设备，以统计进出人数。


    专有传感器是最不明显、最难得的数据来源。人们可以制造传感器来测量任何东西，从生物信号、身体功能，到海底现象，如温跃层等。然而，由于传感器十分复杂，因此构建和制造传感器可能非常困难。传感器设计、制造材料、将传感器连接到计算设备的部件、通信方法、生产流程，以及与现有传感器的集成都可以通过保护知识产权的方式，成为企业竞争优势的来源。传感器一旦建成，接下来的挑战就是如何说服人们安装这些传感器。如果没有相应的好处，人们不会在家里安装一个既耗电又吵闹的设备。最有效的激励方式就是付钱给用户，像尼尔森（Nielsen，全球著名市场监测和数据分析公司）那样，付费让人们在电视上安装一个跟踪他们观看习惯的盒子。另一个很有效的方法是，提供一个既可以处理来自传感器的数据，又可以为客户提供帮助的应用程序。这一模式成功的原因是为传感器用户节省开支，例如，安装用电传感器、收集数据，通过传感器网络聚合数据，然后与电力公司协商节约成本。


    # 公共数据


    对于人工智能优先公司来说，有许多公共数据资源可以使用。这些资源可能很难获得，而且争议性颇大，却是免费的。图3-12展示了公共数据。


    ![](EPUB/images/image_037.jpg)


    图3-12 公共数据


    ## 网络爬取


    互联网上有很多信息，其中大部分是结构化的，因此可以用于训练机器学习系统。这就是谷歌获得数据优势的方式，该公司可以说是当今世界上最大的网络爬虫。


    数量能保障质量，大量数据的积累可以形成竞争优势。从互联网上收集数据通常被称为爬取。通俗地讲，爬虫就是一个程序，它通过`URL`系统地查找网页或互联网上的其他资源，删除不必要的东西，例如格式，获取重要（或全部）数据，将其以标准文档格式（例如，`JSON`）保存，并将其传递到自己的数据库。例如，爬虫可以登录美国政府的金融市场监管部门`SEC`的网站，访问以`HTML`文件形式存储的公司报告，去掉格式，找到年度收入数字，将它们放在`JSON`文档中，然后存储到数据库中。从技术上来讲，爬取非常困难，因为网页和其他资源的形式、位置和可用性总在发生变化。好的爬虫需要具有很高的适应性。


    爬取是一项大生意，许多公司提供爬取服务。有些公司推出定制爬虫从特定资源收集数据点的业务。有些公司定期从一组特定的网页中提取新鲜数据，所使用的爬虫是为了适应页面不可用或经常变化的情况而定制的。还有一些公司提供定制爬取系统，可以提取网页上的任何可用数据。


    有一个方案可以替代爬取服务，那就是使用可以提供`DaaS`的`API`。该服务可以有效地进行爬取，然后通过`API`中的特定端点提供数据。提供`DaaS`的公司运行自己的爬虫——或许还有其他数据收集方法——持续提供最新的、随时可用的高质量数据。其他功能可能包括，将电子邮件地址输入一个`API`，该接口会提供该地址所有人的姓名、头衔和所工作的公司等消息。提供这项服务的公司可以通过数百种不同的方式获取这些数据，比如爬取公共资源和政府网站等。

