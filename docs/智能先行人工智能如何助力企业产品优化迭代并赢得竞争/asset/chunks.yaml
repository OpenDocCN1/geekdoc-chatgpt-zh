    ## 评价


    在投资数据采集之前，需要建立一个数据评估框架（如图3-2所示）。


    ![图3-2 数据评估框架](EPUB/images/image_025.jpg)

    图3-2 数据评估框架 `EPUB/images/image_025.jpg`


    根据他人获取数据的困难程度，有五种方法可以用来评估数据的价值（与其对数据获取方的最终用途相反）：可达性、可用性、成本、时间和可替代性。


    ### 可达性


    你难以获得的数据，其他人可能同样难以获得。举个例子，为了获得数据需要去一个特殊的地方，比如当地的议会办公室，手动收集纸质文件，然后复印，通过光学字符识别软件对其进行处理，最终将复印机上的图像转换成计算机可以读取的文本。


    根据与数据集相关的合同或政策，对数据未来是否难以获得进行评估非常重要。通常，这可能涉及数据所有者对来自外部访问的限制。例如，政府机构和私人供应商在开始收取访问费用或停止数据流通之前，通常会在一段时间内免费公开数据。


    ### 可用性


    对其他系统来说，从特定系统提取数据所需的时间可能是一个障碍。有些系统只允许以非常慢的速度获取数据，原因可能是运行这样一个系统的成本很高，需要根据不同的速率限制对数据产品进行分级。其中一个例子就是金融市场数据，市场数据提供商只允许在特定的、相对较长的时间间隔（通常为几十微秒）内访问股票价格报价，如果想在较短的时间间隔内获取报价，客户需要支付更多的费用。付更多的钱从而更频繁地获得信息，可以让客户在利用这些数据做出重要决策时拥有竞争优势。例如，几微秒的差异可能会让人工智能优先的交易系统碾压竞争对手，从而进行有利可图的交易。


    ### 成本


    数据供应商收取费用是获取数据的一个明显障碍。有时，该费用由供应商以美元为单位明确规定，但有时，收费形式却不是那么明确，可能是与数据供应商达成收入共享协议，也可能是要求访问者购买访问数据所需的昂贵软件。例如，总部位于纽约的金融数据和媒体公司彭博新闻社（Bloomberg）提供的一台终端机，每月租金高达数千美元，而它只不过是一台由一般商用部件组装而成的普通电脑。然而，通过它就可以访问金融市场高质量的实时数据。获取数据的费用有时可以以非货币形式支付，例如在访问供应商数据之前提交自己的一些内部数据。鉴于并非所有数据对每个人都具有同等价值，公司很难评估贡献数据的确切成本。然而，贡献数据要求是否对竞争对手构成障碍，可根据要求提交的最低数据量、格式，以及每行的完整性进行评估。要求越严格，竞争对手就越难贡献数据，也就越难访问供应商提供的数据。


    ### 时间


    收集数据所需的时间是决定你是否会在数据收集方面领先竞争对手的关键因素。一些数据能够以一定的速度积累：例如，天气数据与太阳的公转息息相关，就业数据则由相关政府部门收集及公布的速度决定。因此，要想获得足够多这样的数据，只需长期收集即可。


    ### 可替代性


    数据的可替代性或可互换性，会对其他人是否能够使用该数据实现相同的目标造成影响。可替换的数据可以被替换为不同的数据（可能更加便宜），而不会对基于该数据做出的决策的质量产生负面影响。例如，你可以使用来自任何新闻网站的文本来训练模型，以理解句子模型的一般含义。


    还有五种方法可以根据数据的最终效用（与其他人获取数据的难度相反）来评估数据的价值：持久性、准确度、维度、广度和自我强化。这不是那么明确的，因为它取决于数据的预期用途。


    ### 持久性


    数据消失的速度决定了相关性。旧数据也许不再代表现实状况，因此可能会导致模型生成无效预测。例如，股票的价格几乎瞬息万变，因此，一秒钟前的价格与一微秒前的价格并不必然相关（取决于人工智能优先交易模型用于预测股价的功能）。其他类型数据的保存期限可能很长：包括珠穆朗玛峰高度在内的地图数据将不会（有太大的）变化，因此在很多年内都会保持相关性。然后是介于两者之间的情况，比如从调查中获得的消费者偏好数据。有时偏好是持久的，比如衣服的尺寸；有时是短暂的，比如可能只流行一季的款式。


    持久性可以通过更新来延长。数据供应商或者数据源更新数据的速度会影响其持久性。有时，数据供应商会根据更新率分层定价，对更新的数据收取更高的费用。持久性高的数据通常不那么有价值，因为它需要持续地更新，这会提高计算和获取更多数据的成本。


    ### 准确度


    数据的准确度决定了决策的可靠性。通常，确定准确度需要手动验证数据：例如，获取产品规格数据样本，比如电源电压——只有几行字，可以根据从制造商处手动收集的数据对其进行核对。有时，为了确保数据的准确度，供应商会提供数据准确度保证。最后，还有第三方可以按行业类别或者特定要求对系列供应商的数据准确度进行验证。


    ### 维度


    数据中维度的数量决定了其与决策的相关性。维度是实体对象的属性。通常，体现在数据表中的列数上。例如，人口统计数据可以包括年龄、性别和收入等。


    维度是决定价值的一个特别强大的因素；预期用途是训练一个机器学习模型，因为当模型试图学习数据中的形态和模式时，每个维度都会对其产生影响。


    ### 广度


    数据的广度决定了它体现现实的程度。广度是实体数据或散点分布的数量，通常表现为数据表中的行数。广度意味着同一类型的示例更多，实体案例和边缘案例的属性也有更多变化。有时，通过连接不同来源或供应商的数据集，可以获得更大的广度，但这要求它们具有相同的属性。通常，通过排列属性并填充任何缺失的数据来组合不同的数据集，也可以获得更大的广度。


    ### 自我强化


    随着时间的推移，自我强化的数据变得更有价值。自我强化体现在同一实体随时间变化的属性中，但可以用相同的方式进行测量。例如，员工的绩效反馈在某个时间点表现为一个值，在之后的某个时间点表示为另一个值，但后一个值加强了第一个值的价值。这是因为，如果两个数据点相同或趋势相同，它们会增强彼此的价值。


    ### 数量问题


    获取大量数据一直是人们关注的问题，许多人经常为了获取更多的数据而放弃获得更好的数据。至于说哪种做法更好，完全取决于所做决策的类型，以及哪些模型——无论是使用人类智能还是机器智能——可能有助于做出这些决策。例如，训练一个模型识别图像中的某个东西，可能需要几百张被标注的图像，如果是未被标注的图像，则需要几十万张。因为不同的图像识别系统需要不同数量的示例和标签。在自然语言理解领域，在我撰写本书时，最先进的模型使用了4990亿个词元，而就在一年多之前，它只使用了100亿个词元。然而，识别法律合同中特定条款的模型，使用100份`Word文档`进行训练即可。在你读了这本书之后的几个月里，由于人工智能领域的发展，这些数字会发生变化。数据规模回报很少是线性的，这取决于决策类型以及决策所用的模型。数据量和价值如图3-3所示。


    ![图3-3 数据量和价值](EPUB/images/image_026.jpg)

    图3-3 数据量和价值 `EPUB/images/image_026.jpg`


    ## 客户生成的数据


    对于人工智能优先公司来说，最重要的数据来源可能是他们所服务的客户。毕竟，这些公司开发的产品是为客户提供商业或产业结果预测的，因此，预测模型基于这些客户的数据是合理的。客户生成的数据如图3-4所示。


    ![图3-4 客户生成的数据](EPUB/images/image_027.jpg)

    图3-4 客户生成的数据 `EPUB/images/image_027.jpg`


    ### 与客户签订的合同的相关权利


    本节将介绍一些谈判协商数据权利的策略，并就如何通过数据撰写合同从而建立竞争优势，提供一些战术建议。这是一个机会，可以在传统知识产权战略之外，为现有企业和新兴模仿企业建立起强有力的保护。


    ### 轻装起步的优势


    在21世纪初“云时代”到来之际，绝大多数大公司都不愿将数据委托给外部机构。对其中的许多公司来说，这是他们第一次被要求在异地存储数据。为了缓解这些担忧，云计算供应商通常会明确放弃他们管理的客户数据的所有权利。其中许多协议现在依然在执行，这阻碍了云时代公司构建智能系统的尝试。他们面对两种挑战，一是与现有客户重新协商数据权利，二是进行一场疯狂的数据采集。


    然而，今天的人工智能优先公司可以接触到那些更愿意让第三方管理其数据的客户，使其能够就数据进行不同的对话。人们普遍认为，人工智能优先公司的知名度和地位都不如大型云供应商，从而导致其竞争力也不如后者。所以，他们更适合通过协商来解决数据权利问题。


    ### 协商


    与客户协商数据权利是一个鸡和蛋的问题。能否获取数据取决于能否展示良好的结果，但人工智能优先产品需要数据才能产出结果。人工智能优先公司通过以下方法，寻找替代数据源来解决这个问题：


    - 以中小型企业客户为目标，因为他们对数据权利或他们认为价值相对较低的数据持更加开放的态度，可能会明确地以数据权利换取更低的价格；

    - 提供免费版本可以自由捕获数据但功能有限的产品；

    - 以成本价销售辅助产品以获取数据。


    其中许多外部数据源可以训练模型为商业客户提供预测可用性阈值。


    ## 结构


    下面是一个非常普通的故事：一家初创企业找到一家大型公司，向其展示了一款令人难以置信的新人工智能优先产品，称该产品可以对烦琐的工作进行自动化处理。这家大公司同意试用并打算购买。不幸的是，合同被卡在了法律与合规部门：不允许初创企业访问他们的数据，以免操作不当或落入竞争对手手中。这家初创企业因此陷入了困境。


    这家人工智能优先公司从谈判一开始就明确表示，他们的主要兴趣是从数据和数据应用中学习，如用户参与和交互数据、元数据和数据流信息等，从而避开潜在的关于合规性的担忧。下面，我们将介绍一些制定合同的方法，以获得客户数据使用权限，同时实现下列目标：


    - 随着时间的推移，添加新的机器学习功能把模型做得更好——从而使产品对客户更有用；

    - 使模型适应客户不断变化的情况；

    - 防止竞争对手达到类似的效率水平；

    - 拥有一份宝贵的资产。


    实现这些目标需了解以下概念，这些概念最终将被纳入合同。


    #### 模型


    这些是用来为特定客户进行特殊预测的模型。模型可以是基于客户需求，通过微调特定功能而构建的东西，也可以是为所有客户构建的东西，然后按照客户的数据进行修改，从而实现在给定相同数据的情况下，模型的输出会因客户的不同而相异。从本质上讲，一个模型（在这种情况下）不会对所有客户都有用。


    #### 全球多用户模型


    这些模型可以预测所有客户认为很常见的事情，训练从所有客户那里收集来的数据，同时包含了为所有客户设计的功能。从本质上讲，全球模型对所有客户都是有用的。


    #### 数据


    这里指的是来自客户的数据。这些数据没有经过任何处理，是客户专有的。


    #### 匿名和聚合数据


    这是上面提到的数据，但以某种方式进行处理，使其无法返回给特定客户。通过`Hashing`数据来对数据进行匿名化，删除可以直接链接到某个特定人的数据点，对数据进行假名化、随机化或者修改。匿名数据可以跨客户聚合，为所有客户训练通用模型。这个聚合过程将获取一个特定类型的数据点，该数据点在所有客户中都是通用的，然后将该类型的所有数据点放在一个表中：例如，一款身上有来自条形码扫描仪的`UPC`标识的产品在特定日期被所有客户扫描的次数。


    #### 个人身份信息


    一些数据被归类为`PII`，因此在美国和其他国家使用这些数据都要承担一定的法律义务。这些数据可能需要以某种合规方式进行处理。一些客户不允许访问这些数据，因为他们可能会以错误的方式处理这些数据。


    #### 存储


    数据可以存储在公共云或私有服务器上。客户可能需要不同类型的数据，以及存放在不同地方的模型。这一点可能会出现在合同中。


    看完上面的概念之后，再来看一些需要避免的合同条款：


    - 拥有全球多用户模型的客户；

    - 跨客户使用匿名聚合数据来培训这些全球模型的限制；

    - 管理`PII`的责任；

    - 必须将数据存储在不同的位置，从而破坏了数据体系结构。


    ### 客户数据联盟


    客户数据联盟是指一家公司（供应商）组织一批公司（客户）彼此共享数据。数据联盟通常为供应商和用户创造一个独特的数据资产。以下是客户数据联盟使用通用框架构建良好数据资产的原因。


    - 小公司通常没有足够的数据来训练和运行智能系统。这意味着他们更容易出现过拟合等问题，即该模型认为一个特定的数据点代表了它试图预测的特征，但事实上，该数据点是一个离群值。拥有更大的数据量，可以让客户在训练其系统时，有效地对多个数据点进行平均计算。

    - 成员可以看到来自其他成员的同一类别数据的不同变体。例如，在不同光照条件下拍摄的产品图像用于训练计算机视觉模型，以便在不同环境下识别该产品。

    - 成员可以相互验证数据点。例如，他们有一个用户在某种介质——比如电子邮件——中拥有同样的（无法识别个人身份的）数据，但没有其他数据，比如对洗衣液和洗衣粉的偏好等，那么，他们就可以对这些数据点进行更正，做法是：统一邮件地址，然后为该用户填写“洗涤剂偏好”栏。

    - 有些公司连续不断地——比如，从某台设备或者`POS机`上——收集数据。还有些公司是定期收集数据——比如，通过季度调查，或者按需购买数据。来自联盟中一些成员的数据，可以帮助其他进展缓慢的成员适应目前的情况。


    建立数据联盟就像要求每个客户都同意与其他所有客户共享数据那样，既简单又困难。这一点是通过在合同中授予客户以特定方式使用数据的权利来实现的，例如使用数据训练机器学习模型等。数据可以匿名化，并以不同的细分方式聚合，这样客户就不会共享他们所有的数据；而共享多少，取决于客户希望通过加入联盟贡献什么，以及得到什么。建立客户数据联盟面临着一些挑战。


    - **营销**。将联盟成员组织起来，就能够产生强大的力量，从而与行业巨头进行对抗。然而，这种做法必须首先想办法激发成员们的参与热情。潜在会员在分享数据时，会像任何公司一样犹豫不决。因此，选择初始成员时，要考虑其相对竞争优势、规模和成熟度等因素。正确传递信息可以让这些公司走到一起。

    - **合同**。供应商与加入联盟的每家公司之间签订的合同必须相同；没有一些客户可以访问某些数据，而其他客户却无法访问的特殊交易。

    - **匿名化**。这一点在客户数据联盟中备受关注，因为这些客户最终可能会相互竞争，而且通常是直接竞争。


    我们不妨想象一下，试图与亚马逊竞争的数据联盟会是什么样子。绝大多数购物行为都是从搜索开始的，而大多数产品搜索都是在亚马逊上进行的。该网站的搜索功能及其所提供的建议，可以帮助消费者快速找到自己想要购买的产品，这不仅是因为自2003年以来，成千上万的工程师投身于产品搜索和推荐功能的开发，并推出一款优秀的产品，还因为亚马逊有很多消费者希望看到的搜索数据。工程师们利用这些数据，训练高精度的机器学习模型，而这些模型能够在搜索栏中提供建议，进行结果排序，并在不同页面上进行产品推荐。这些功能有助于客户获得高品质的搜索体验，同时为他们提供相关建议。亚马逊的这些优异表现令竞争对手望而却步。其他电子商务零售商不太可能拥有亚马逊所拥有的工程能力或数据资源，因此也不太可能提供与其相同的高质量体验。你可以组建一个联盟来改变游戏规则，让零售商使用经过高度设计的平台来搜索产品，并且使用所有客户的聚合数据。零售商联盟提供数据，并对机器学习系统进行数据训练，能够产生比任何一家零售商都更准确的建议、结果和推荐，从而让联盟中的任何成员都可以与亚马逊竞争。集体智慧再次凸显。


    ### 客户使用的工作流应用程序


    工作流应用程序是从客户那里获取数据的常见替代方案，对较小的客户尤其有效，因为他们往往对共享数据不那么敏感。


    工作流应用程序是一种软件，它将一个人在现实世界中所做的一系列事情采集下来，并放入软件中。例如，从一个建筑工地项目经理那里获取一份任务列表——写在一张纸上——并将其输入到移动应用程序，这样他就可以跟踪这些任务，分配任务，并生成报告。工作流应用程序无处不在。事实上，我们仍处于为许多行业构建此类工作流应用程序的时代——对于愿意了解特定行业工作模式的软件开发人员来说，这是一个巨大的机会。


    工作流产品能够收集数据。输入工作流应用程序的每一条数据都会进入数据库。让我们以汽车保险索赔过程为例。首先，评估员来到修理厂，为受损的车辆拍了几张照片，然后写一份报告。这份报告会被送到保险公司的损失理算师那里，由他来决定是修车还是换车，以及需要支付多少费用。有时，客户可能不认同评估结果，因此整个过程还需要再来一遍。目前，这些步骤都是依靠笔、纸、写字夹板、传真和摄像机来完成的。一个更好的解决方案，可能是开发一个独立的应用程序。它可以拍摄照片，为报告提供文本字段，并自动将报告发送给损失理算师，让其进行处理。如有必要，有争议的索赔可退回评估员重新评估。什么样的损坏应该修车、什么样的损坏应该换车、修车要花多少钱，以及车辆如何估值等数据都是最有价值但也是很难收集的。


    业务流程数据时时刻刻在工作流应用程序中进进出出，而且天天如此。公司可以利用这些数据建立一个智能系统——也就是说，这个系统不仅可以记录工作，还可以通过对下一步进行预测，而使工作自动化，甚至可以自动填写表单的部分内容。继续上面的例子，想象有这么一款应用程序，可以输入汽车的规格，根据照片文件确定损坏的程度，然后计算出总成本。原本需要评估员亲自做的一些比较烦琐的工作，现在可以自动完成，减少出险次数，甚至还可以审计或者替代损失理算师的工作。收集数据，然后构建智能系统的结果，就是获得更智能的工作流产品。


    通过与银行和信用卡提供商的进一步整合，旧金山软件公司`Expensify`开始提供一种更好的管理费用的方式。该产品从这些服务中提取交易信息，然后将这些信息放入费用报告。较之逐个记录费用，将费用拖拽到报表中的体验要好得多。`Expensify`的第二步是构建一个基于人工智能的产品，可以对费用自动分类。该系统基于来自核心工作流应用程序的所有数据得到训练，使客户能够将交易与类别、标签和报告链接起来。


    这种采取现实世界工作流程、围绕其开发软件然后添加更多的数据和功能的能力，正是我为什么相信所有商业软件总有一天会变得智能化的原因。


    ### 跨客户应用程序集成商

