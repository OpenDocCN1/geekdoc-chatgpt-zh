    ## 生成性对抗网络（Generative Adversarial Networks，GANs）


    它们是由两个（或更多）被设置为相互挑战的机器学习模型组成的网络，这就好比和某个人辩论时，多了一个陪练员。其中一个无监督模型（生成模型，通常是一个反卷积神经网络）根据其对相关数据的推断生成新模型，而另一个模型（判别模型，通常是一个卷积神经网络）根据真实数据分布对候选模型进行评估。生成模型试图找出判别模型认为接近真实数据分布的候选项。但事实上，生成模型最终将生成一些新的东西（除了数据分布）用于一系列测试。这有点违反直觉，但在数据生成方面很重要。在数据创建方面，生成性对抗网络提出了模型设计者甚至没有考虑的特征。因为模型的评估会反馈到下一次运行中，因此生成模型和判别模型都会在下一次运行中创建新的数据分布。在数据积累方面，生成性对抗网络可以以越来越快的速度积累数据，因为新模型可能比以前的模型有效得多。随着网络的每一次自动运行，生成性对抗网络就会添加功能，直到不再进行判别。


    ## 增强学习（Reinforcement Learning，RL）


    增强学习是机器学习的一个领域，涉及开发优化奖励的代理，创建一个（软件）代理，该代理可以使用机器学习来实现目标，例如赢得一场电脑游戏。在数据创建方面，代理每次执行任务时都会收集观察结果，这些观察可能是新的，因为创造者从未给一个模型进行编程来采取增强学习代理所采取的行动。这些代理不断积累数据：观察系统的状态，采取行动改变它，观察它们行动的效果，等等。通过机器学习方法创建和积累的数据见表5-2。


