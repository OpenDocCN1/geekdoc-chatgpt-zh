    **机会**


    许多领域都缺乏真正的智能工作流应用程序。也就是说，智能应用程序在丰富的输入数据、数据“尾气”和外部数据的组合上运行机器学习算法，以便为客户做出预测，或者理想情况下，为客户做出决策。人工智能优先公司的机会就是构建这样的应用程序，例如：


    ● 可以预测性地管理销售线索、在狭窄的领域进行营销和筹资的客户关系管理系统；


    ● 可以显示库存何时可能不足、需要进行更多订购的库存管理软件；


    ● 可以预测供应链中断并提出解决方案的供应链跟踪系统；


    ● 可以自动从客服工单中收集功能开发建议（以及要修复的漏洞）的产品管理工具。


    现在是考虑如何在记录系统之上构建智能应用程序的时候了。


    **人才回路**


    构建智能系统需要有智慧的人。招聘最好的机器学习工程师、研究人员和数据科学家，是构建最智能系统的先决条件。该领域内最优秀的人才希望能够使用最好的数据，因为没有好的数据，他们就很难卓有成效地工作。通常，最好的数据意味着要有最多的数据。


    数据越多，机器学习的工作效率就越高，就能吸引更好的机器学习研究人员，生成更有用的模型，从而生成更多的数据，在一个自我强化的回路中，让机器学习更高效地工作。


    向潜在候选人宣传数据资产的价值可以开启人才回路。有些候选人想看到大量数据，一些人希望看到与他们的研究最相关的数据集，还有些人想要一个可以改变世界的数据集。例如，收集可能有助于解决重要问题——比如癌症——的专有数据集，可以吸引高素质人才。向应聘者明确阐释数据和工程问题可能是一个招聘优势。要想吸引最优秀的人才，就必须掌握最有价值的数据。人才回路如图8-11所示。


    ![](EPUB/images/image_092.jpg)


    图8-11 人才回路


    ## **本章结论：为竞争排序**


    我认为，人工智能领域最大的商业机会是，创建能够完全自动为社会提供有价值服务的公司。然而，你不可能一开始就通过自动化的方式提供这些服务，而必须从手动开始。你最初需要构建的不是技术，而是理解；相较于通过筹款创办一家科技公司，收购一家服务公司应该是创建人工智能优先公司更好的方式。对于那些希望筹集风险资本以建立高利润率软件业务的人来说，从低利润、手工业务开始获取数据，可能是一个奇怪的提议，但对于那些最终想要通过自动化方式获取所有价值的人来说，这可能是有意义的。


    纵向整合有助于对产品推广，以及通过基于投资回报率的定价获取价值进行虚拟控制，但实施起来可能代价不菲。除了将人工智能优先产品定位在包含最大利润机会的价值链中之外，还可以基于围绕人工智能优先产品的数据对这些产品进行有利可图的定价。通过设定行业标准、构建生态系统或者建立品牌来锁定客户，可以获得与纵向整合一样的好处，但现实是，有时仅仅成为先行者就足以赢得比赛，尤其当它能够启动一个自我强化回路时更是如此。整合优势使得这些公司能够创造出压制现有公司的智能应用程序。人工智能优先公司每天都在聚合、压制和颠覆现有公司。


    ## **本章要点**


    ◆ **纵向整合可以获得更多数据、收入和利润。**为客户提供整套服务，可以让人工智能优先公司获得反馈数据，根据投资回报率为产品定价，并提高利润率。


    ◆ **人工智能会改变定价。**人工智能优先公司可以根据数据贡献、产品使用率、模型更新频率、开发预测功能，以及最终的投资回报率向客户收费。对人工智能优先公司来说，按投资回报率承保是理想的商业模式。


    ◆ **人工智能优先的破坏分为三个阶段。**通过更低的价格、更高的个性化程度，以及更多的自动化抢走现有公司的客户。


    ◆ **聚合数据可以创建新产品。**人工智能优先公司可以聚合数据来设计新产品，这些产品可能是基于大量数据产生的，也可能是全新的发明。人工智能优先公司会前向聚合和集成，从数据库获取数据，并构建客户每天都使用的智能系统。


    ◆ **数据生成锁定。**数据格式可以将客户锁定在产品中。


    ◆ **考虑兼容性。**数据在生态系统中的产品之间移动，因此，与其他产品的兼容性可以帮助新公司将数据输入自己的产品，然后用于训练人工智能。


    ◆ **支持与补充。**第三方可以创建补充产品，为生态系统贡献数据，最终为客户提供更多价值。


    ◆ **先行优势非常适合人工智能优先公司。**优点突出，没有缺点。先于竞争对手积累数据就可以更早地开始构建数据学习效应，从而形成无可撼动的领先优势。


    ◆ **人工智能优先公司拥有独特的品牌建设能力。**智能系统可以分析大量的产品使用数据，从而对产品进行大规模个性化改造。这种品牌建设能力使得人工智能优先公司能够签约更多的客户，并捕获更多的数据。


    ◆ **压制现有公司。**智能应用程序从遗留应用程序中借用数据，然后将这些程序变为附庸，收集数据并招募人才，通过与现有公司完全不同的方式使用这些数据。


    # **结语**


    建立人工智能优先公司需要把人工智能放在每个议程的首位。本书将人工智能放在有关战略（定位、定价、竞争）和战术（建模、监控和度量）讨论的首位。如此一来，数据学习效应便可发挥作用。


    你对人工智能优先公司的了解也会变得更加容易。


    数据学习效应=数据规模经济+数据处理能力+数据网络效应


    如果你愿意，你可以认为你的新数据就是本书中介绍的新词汇和新框架。当你在工作中想到它们时，你就是在处理这些数据。每个段落、插图和示例都会添加到信息网络中。这本书启动了数据学习效应的飞轮，而且还有更多东西可以让它不停地转动，让回路不断地发展。你可以找到以补充材料、工作记录和课程形式出现的更多输入，你可以在日常工作中不断处理这些输入。通过加入在线社区，你可以向网络中添加更多节点。


    人工智能优先公司把人工智能放在第一位。你已经把人工智能放在了学习的第一位，所以你现在可以把人工智能放在公司战略、预算和员工会议的首位。你可以带着精益人工智能的思维方式进入下一个项目，即使这个项目可能一开始很小。为了客户，你可以在确保其接受人工智能的前提下，安装自动管理系统，设置监控进度指标，率先进行人工智能实践。学习和积累公司内部信息能够让你一直取得好成绩，不断改进你的决定。最终，你的公司将能够以更大的规模、更快的速度提供产品。你可以通过纵向整合、颠覆，以及通过标准化、聚合和从属定位超越竞争对手。


    记住，现在还不晚，我们刚刚走过人工智能优先世纪的一部分里程。你仍然可以创造工具，让所有人都具有更强的能力。让我们共同奋斗，成就彼此吧！


    # **术语表**


    **A/B测试：**通过向不同的用户群体随机展示产品的两种不同变体（即变体A和变体B）来测试用户偏好，该测试也被称为对照实验。


    **K-均值：**无监督机器学习方法，以最接近对象的中心点或平均值为基础，将对象分组到多个聚类中。


    **安全多方计算：**联合计算输入的方法，但参与的计算机的输入是保密的。


    **上凸曲线回报：**回报因产品使用次数增加而减少。


    **版本控制：**保存模型、程序或数据集的每种形式的副本。


    **边际贡献：**单位平均价格减去与该单位相关的人工和质量控制成本。


    **边缘：**节点之间的连接，也称为链接或者线。


    **变量重要性图：**一个函数中最重要的变量列表，变量重要性根据其对特定预测或者预测能力的贡献排序。


    **标签：**基于实例学习的机器学习系统的输出。


    **补充数据：**增加现有数据价值的新数据。


    **参与系统：**主动（例如，通过用户输入）聚合特定业务功能信息的系统。


    **层：**神经元聚集；层可以互相连接。


    **查询语言：**用于从数据库中检索数据的编程语言。


    **差分隐私：**不显示单个数据点而共享数据集的系统。


    **超参数：**用于控制机器学习模型的参数。


    **超级用户：**其他用户相比，过度使用产品的用户。


    **超文本标记语言：**专门用于编写要在网络浏览器中显示的文档的编程语言。


    **成本优势：**在特定行业相较于竞争对手因更低的生产成本而产生的一种竞争优势。


    **传感器网络：**从现实世界收集数据的设备集合。


    **代理人基模型：**根据代理人的属性、激励和环境约束，生成代理人行为，以及与其他代理人交互的模型。


    **递归：**方法的重复应用。


    **定价：**产品使用情况。例如，使用产品的时间。


    **动力源：**与其他用户相比，贡献过量数据的用户。


    **独立软件供应商：**发布软件的公司。


    **用例：**机器学习模型从中学习的单个输入输出对。


    **方案：**数据库中特定表中所有值的通用形式。


    **防御能力：**保护收入来源——例如，可以创收的资产——的相对能力。


    **有向无环图：**在点之间跳跃，而不是每次都以相同的模式通过所有的点。


    **概念漂移：**预测主题背后的想法基于观察而发生的变化。


    **概念验证：**由软件产品的潜在客户和供应商联合进行的项目，以证明该产品在理论上提供的价值。


    **高斯混合模型：**概率模型，表示集合中的一个子集，假设为正态分布，无须观测数据与子集匹配。


    **数据“尾气”：**当用户在应用程序中执行操作，例如单击按钮和更改值时，所收集的数据。


    **个人身份信息：**可以链接到真人的信息。


    **工作流应用程序：**一种软件，它采集了一个人在现实世界中所做的一系列事情，并将这些步骤放入一个允许在每个步骤输入数据的界面中。


    **方程：**输入数据以输出预测的一组数学函数。


    **光学字符识别软件：**将图像转换为机器可读文本的软件。


    **规模效应：**拥有更大数量能够产生效益的资产或者能力，使得边际效益增加或者边际成本降低。


    **横向整合：**通常由单独的产品操作，将多个行业特定功能组合在一个产品中。


    **护城河：**对其他方构成障碍的资产积累，可能会降低这些资产的创收潜力。


    **召回率：**由模型在相关数据点总数上检索到的相关数据点的数量所占比例。


    **机器学习：**通过添加新数据自动改进的可计算算法。


    **机器学习工程师：**实施、训练、监控和修复机器学习模型的人。


    **机器学习管理回路：**将真实世界的数据连续输入机器学习模型的自动化系统。


    **机器学习研究员：**建立和运行机器学习实验的人。


    **基于使用量的定价：**与产品使用量直接相关的定价。例如，使用产品所花费的时间。


    **基于投资回报率的定价：**与投资回报率直接相关的定价。


    **集成商：**负责构建连接数据源的工具、跨数据源标准化数据，并在数据源发生变化时更新连接的软件公司。


    **记录系统：**被动聚合特定业务功能信息的系统。


    **加密令牌：**区块链资产证明。


    **价值链：**公司为资产增值的过程。例如，通过将数据处理为信息，并将该信息处理为预测，为数据点增加价值。


    **监督机器学习：**从给定输出的输入中学习的机器学习。


    **监控：**观察产品以确保质量和可靠性。


    **降维：**转换数据（使用主成分分析等方法）以减少与每个数据点相关的度量。


    **交互式机器学习：**从用户那里收集数据，将数据放入模型，将模型输出返回给用户的机器学习模型。


    **交易定价：**与产品交易单位数量直接相关的定价，例如，已处理的数据点或者计算周期的数量。


    **接受者操作特性曲线：**显示模型在不同鉴别阈值（如真正类率真和假正类率）下表现优劣的曲线图。


    **节点：**网络中能够接收、处理和发送信号的离散部分。


    **精确度：**模型检索到的相关数据点占数据点总数中的比例。


    **精益人工智能：**构建一个小型但完整且准确的人工智能以解决特定问题的过程。


    **局部图：**显示向函数中添加增量变量的效果的图形。


    **聚合理论：**该理论认为，一个市场的新进入者可以将该市场的现有资源聚合在一起：例如数据点，以创造新的和有价值的产品。


    **聚类工具：**使用无监督机器学习对相似对象进行分组。


    **客服代理：**负责回复客服工单的员工。


    **客服工单：**产品用户在使用该产品时请求帮助的消息。


    **客户关系管理软件：**存储和处理客户数据的软件。


    **控制论：**机器和生物的控制和通讯科学。


    **联邦学习：**一种无须在计算机之间交换数据、跨不同计算机训练机器学习模型的方法。


    **密码学：**编写和破解代码。


    **模拟：**一种方法，该方法生成输入，通过程序来查看该程序是否无法执行或生成不准确的输出。


    **内包：**在现有组织内找到完成任务所需的资源，这样就不需要使用新资源来完成该任务。


    **帕累托最优解：**即投入20%的精力获得80%的收益。


    **漂移：**模型的概念或数据偏离现实。


    **破坏理论：**一种理论，即市场的新入行者通过比现有供应商低得多的价格，将特定产品销售给细分市场的客户，从而将后者的客户抢走。


    **瀑布图：**数据可视化形式，显示在相邻列中添加或减去顺序值的结果。


    **企业资源规划产品：**收集并保存产品库存数据的软件。


    **探索法（启发法）：**通过实践获得的知识。


    **强化学习：**从目标中学习的机器学习。


    **区块链：**去中心化的分布式记账系统。


    **ROC曲线下面积：**接受者操作特性曲线的积分。


    **权重：**节点和节点的相对强度度量，可以在学习了一个更理想的权重之后自动或手动进行调整。


    **全球多用户模型：**预测某一特定公司所有客户共同点的模型，规模通常基于所有客户汇总的数据进行训练。


    **扰动：**故意修改一个对象，例如数据。


    **人才回路：**由于拥有比竞争对手更多的高质量数据，而在吸引高素质人才方面形成的复合竞争优势。


    **人在回路系统：**需要人工输入才能产生输出的机器学习系统。


    **入门级数据网络效应：**将新数据添加到现有数据集合所带来的复合边际效益；边际效益可根据数据计算模型的信息价值定义。


    **软件即服务：**在线交付软件，并在订阅的基础上授权该软件的方法。


    **软件开发工具包：**由软件开发人员制作的工具，软件开发人员可以在此基础上开发或者并行开发。


    **散点图：**两个变量的值沿两个轴绘制的图形，坐标点的分布模式揭示了所有存在的相关性。


    **深度学习：**多层人工神经网络。


    **神经网络：**相互连接的节点的集合，它们可以通过网络边缘互相传输信号，信号强度取决于每个节点和边缘上的权重。


    **时段：**通过机器学习模型完成整个训练数据集的时间段。


    **市场细分：**基于相似性对客户进行分类。


    **数据：**收集起来供参考或分析的事实和统计数据。


    **数据标注：**将一条信息添加到一条数据中。


    **数据产品经理：**将模型的数据需求与产品设计师的可用性意图和用户的偏好结合起来，优先考虑收集专有数据产品功能的人。


    **数据分析师：**设置仪表盘，将数据可视化，以及对模型输出进行解释的人。


    **数据工程师：**数据清洗、创建自动化数据管理工具、维护数据目录、整合数据资产、合并新数据源、维护数据管道、建立与外部数据源链接的人。'
