    这一章的主要观点是，数据学习效应是一种动态的环状运动，但其运动方式与护城河不同。它们可以被视为回路，是选择合适的产品、衡量竞争优势、评估风险，以及赢利的基础。这是一个指南，当回路崩溃时，可以用它点亮整个回路，并对其有更好的理解。


    我们从定义回路开始，思考它们运动的本质，并将其与老掉牙的护城河概念进行比较。然后，我们根据解决特定问题的回报、让人工智能工作所需的数据，以及人工智能漂移的可能性，提供一些方法来选择正确的问题，使用人工智能加以解决。概念论述完之后，我们用两节的篇幅讨论技术问题。其中一节介绍测量机器学习模型准确度的常用方法，另一节则探讨一种建立人工智能优先公司各种成本的计算方法。


    ## 回路


    这本书首先对数据学习效应进行了定义。我们给这个定义添加点动力来描述一下数据学习效应的运动特性：环状运动。


    记住，数据学习效应有三个组成部分。


    1. 输入：访问独特的数据。

    2. 处理：处理数据的能力。

    3. 网络：针对经过处理的数据进行学习的模型。


    前两部分可以有自己的内部回路，例如，机器人环游世界收集数据，或使用机器学习技术处理数据。然而，只有在前两部分完成，并且模型创造了一个数据网络效应之后，数据网络效应的更高级别回路才会开始，从而完成构建数据网络效应的整个过程。


    这些回路是自我强化的，功能十分强大，因为它们能够持续生成自己的数据，为预测提供服务，并从观测中收集新数据。这就是数据网络效应的力量，数据学习效应因此具有了自持性，而且成长迅速。


    重复性是回路运动固有特征；回路不停地循环往复。如果不重复，竞争优势就不会复合。数据学习回路与每一批反馈数据一起循环。每次循环都会生成一个预测，顾客会将其带入真实世界，并对其产生影响。然后，模型完成一些学习，生成新的预测。回路叠加如图7-1所示。


    ![](EPUB/images/image_058.jpg)


    图7-1 回路叠加


    例如，人工智能优先产品会产生一个预测：15分钟之后，超市的货架上的意大利面就要断货，所以它会提醒售货员，午饭后去查看一下货架。该售货员核查后确认了这一预测：货架上已经没有意大利面了。于是，他在自己的应用程序中做了一个记录，然后重新补货。监视货架的摄像机看到的情况是：一开始货架上有意大利面，然后就没有了，最后意大利面又出现了。人工智能从摄像头和应用程序以及售货员的笔记中接收信息，得知预测准确无误，之所以货架上又有了意大利面，是因为售货员补了货。这证明该回路最后阶段的运行是正常的，这增加了下一次预测的信心，下一次可能会提前几个小时，就把预测传给售货员。这样一来，补货时间就会从几小时缩短到几分钟。


    ### 回路的物理学特征


    回路背后有一套迷人的物理学原理。它们还可以被抽象地视为某种引擎：一开始是蒸汽引擎，然后是数据引擎。


    1. 两种东西必须相互作用，才能产生另一种东西。你想想锅炉里的水沸腾后产生蒸汽，从而产生热量就明白了。

    2. 必须有两种以上的东西相互作用，否则能量就会消散。如果不转化为运动，燃烧燃料产生的蒸汽就毫无用途。在进行到下一步之前，需要另外两个有点像镇流器一样的东西可以控制输入和输出。你想想蒸汽引擎中的气缸和活塞就知道了。

    3. 这几样东西需要协调一致行动，才不会产生太激烈的反应，也不会消耗过多的能量。所产生的蒸汽刚好充满气缸，活塞刚好能够推动曲柄运动。

    4. 有一个处于中间的、有点神奇的步骤——熵：在一段时间内，移动的物体不能转化为能量，因为它们正在形成其他的东西。这种情况发生在曲柄几乎停止的时候……然后，当形成临界蒸汽量时，曲柄再次运动。

    5. 它们必须在现实世界中有所作为。活塞推动曲柄（曲柄通常还会推动其他物体）。

    6. 它们必须回到最初的状态才能重新开始。每次推动曲柄运动之后，活塞都会回到初始位置。


    现在让我们将上面的例子套入数据学习回路看一看。


    1. 数据与模型反应生成预测。

    2. 模型向人们输出预测，但是，在将其应用于现实世界之前，人们会对这些预测进行处理。所以，这四个因素是数据（燃料）、模型（空气），依据预测（气缸和活塞）行事的人，以及行为对象（曲柄）。

    3. 数据、模型和人的行动是一致的，主要的原因是没有什么比人行动得更快。

    4. 熵发生在人类思考（气缸）以及他的行为在现实世界中产生影响（曲柄转动）时。

    5. 人们根据预测行事，其行为是可以观察的。

    6. 观察就是数据，模型可以从中进行学习，生成新的预测，然后开始下一个回路。


    在理想情况下，所有这一切都能够高效运行，不会消耗能量，浪费输入。就汽车发动机而言，输入指的就是汽油。对于人工智能优先产品而言，输入指的则是数据、工程师的时间和客户的关注。


    以这种方式进行思考有助于我们对好回路和坏回路做出区分。好回路有充足的输入而且熵会不断增加。充足的输入意味着更多的数据。不断增加的熵可以让人类利用预测做很多事情，而且在现实世界中可以产生和模型预测一样的效果。当人们提供大量反馈时，熵也会增加。通过观察现实世界中的所有影响，消化反馈，并将其进行整合再次启动回路，模型最终解决了无序的问题。否则，除了传感器的大量无用输出或人工反馈之外，什么都没有。这只是一个抽象的类比，可能有助于我们认识回路的运行方式。我们现在再来谈谈护城河，这是一个不同的比喻，但回路概念却是由此产生的。


    ### 护城河与回路


    传统意义上，城堡周围的护城河被认为是一种竞争优势。然而，护城河是一个静态的概念。一旦建成，它的大小可能会增加或减少，使敌人更难或更容易攻入城堡，但它不会自动变深。护城河如图7-2所示。


    ![](EPUB/images/image_059.jpg)


    图7-2 护城河


    问题是商业世界是动态的，竞争力量会发生变化，护城河也会改变形状。


    护城河的比喻不适用于数据学习效应。当独特的数据成为竞争优势的来源——相当于护城河中的水——并且由于智能系统的输出，数据以越来越快的速度自动增加时，护城河就会改变形状。而使用回路比喻应该更加合适，因为每次迭代的方向都是一样的，但规模可能会增加。图7-3展示了迭代方向一致但规模可能会增加的回路。


    ![](EPUB/images/image_060.jpg)


    图7-3 迭代方向一致但规模可能会增加的回路


    回路的面积代表了竞争优势的程度。如果还用护城河来比喻，那么回路不仅会自动改变形状，还会自动改变规模。自动改变形状以及自动改变规模的回路如图7-4所示。


    ![](EPUB/images/image_061.jpg)


    图7-4 自动改变形状以及自动改变规模的回路


    数据学习回路的大小会自动增加，因为信息的价值会复合。回路中的一切都会留在回路中。数据学习回路保存所有生成的信息，并利用它们生成更多信息。


    然而，如果模型不稳定，无法再学习，回路可能就会停止运行。如果有人复制了整个内容，回路也可以被取代。但是，已经运行了一段时间的回路很难被替代，因为回路的每一次运行都会添加数据，这些数据可以和下一次回路运行中收集的新数据连接在一起。


    ## 点亮正确回路


    数据学习回路不仅仅是编写代码，它们还需要大量的投资，不过，这些投资都是有回报的。客户愿意投资建设数据学习回路，但他们是否会持续投资，取决于回路的表现、从循环中获得结果是否存在风险，以及回路是否会持续运转。下面的内容可以帮助你判断客户是否会参与回路，以及如何让回路循环持续下去。


    ### 产品收益


    机器学习依赖于概率方法对不确定性进行建模。概率并不总是准确的，所以模型并不总是有效的。在构建机器学习产品时，要记住这一点，最大限度地满足客户的期望，同时避免在高风险情况下不加限制地使用机器学习。


    ### 回报


    对产品的使用回报形状进行建模，可以判断该产品是否对客户具有价值。这些回报（收益）通常呈曲线形状——下凸曲线或者上凸曲线（如图7-5所示）。


    ![](EPUB/images/image_062.jpg)


    图7-5 下凸曲线回报与上凸曲线回报


    下凸曲线回报表示使用产品最终会使价值增加（如图7-6所示）。也就是说，使用次数越多收益就越大。消费者应用程序就是最典型的例子：谷歌搜索几乎可以随时使用，而且每条结果都具有一定的信息价值。即使是不理想的搜索结果，也并不会带来什么伤害。下凸曲线下降的部分和价值为负的部分代表了生产初期的产品成本。


    ![](EPUB/images/image_063.jpg)


    图7-6 下凸曲线回报


    上凸曲线回报代表使用产品最终会使价值下降（如图7-7所示）。也就是说，使用次数越多，收益就越小。


    ![](EPUB/images/image_064.jpg)


    图7-7 上凸曲线回报


    这里的关键词是“可能”：曲线的形状基于概率。这似乎有点抽象，但当考虑在哪里应用机器学习时，也就是说，当使用产品的预期价值超过成本时，它非常有用。我提醒一下，期望值等于回报值乘以获得回报的概率。我们还能够以互动频率的方式思考这个问题。产品的平均用户体验怎么样？如果是一次性交互，比如诊断疾病，那么“平均用户体验”中“平均”的分母是1，因此交互必须是完美的。这是一个问题，因为机器学习系统并不是100%准确的。下面是两种回报的一些例子。


    #### 下凸曲线


    **营销：** 基于人工智能的营销产品带来了新的线索。即使这些线索最终一无所获，但追逐这些线索的过程——以微不足道的代价——也可能会带来很高的收益。例如，一些公司可以识别网站的访问者，并由此生成丰富的个人资料，用作营销线索和寻找这些线索的联系方式。这种产品的低成本被获得新客户的高回报所抵消。


    **销售：** 基于人工智能的销售产品按照重要性对线索进行排序。这些工具增加了发现线索的可能性。使用这些产品的低成本再次被赢得新客户的高回报所抵消。


    **库存：** 人工智能辅助的库存管理能够识别库存水平，以便及时补充库存，从而当顾客想要买东西时，可以把他们牢牢抓住——例如，在杂货店的监控视频上运行计算机视觉算法，以识别缺货的商品，员工因此可以快速补货，客户就可以购买更多的商品。


    #### 上凸曲线


    **日程安排：** 基于人工智能的个人助理（毫无疑问）可以节省时间。然而，对于客户来说，机器计算的投资回报率有点偏颇（不平衡）。使用人工智能个人助理的收益很难计算，因为机器很难权衡用户的时间，可能带来很大损失。例如，如果日程安排机器人筹备了一些会议，那么它“完成了任务”。但是，机器人可能会重复安排，导致用户错过与重要人物的会面。这是一个代价高昂的错误，用户自然归咎于机器人。


    **客户服务：** 基于人工智能的客服机器人可以以较低的成本快速地回答问题。但是对于客户来说，机器计算的投资回报率依然有点偏颇（不平衡）。由于机器人将以最有效的方式回答问题，因此使用该机器人的综合体验会受到影响——不会有意外、喜悦，也不会与客户建立关系。然而，如果机器人只是制造更多后续问题供人们回答，或者让客户生气，那么，此类产品带来的效益可能会很低。


    ### 选择要构建的产品


    产品创始人、产品经理和设计师必须仔细思考下面的问题：一个具有概率假设的系统，能否满足客户的需求，或者确定性系统是否是更好的选择。答案取决于你需要多高的正确率，以及需要多少钱。了解客户真正想要什么，并且生产一个产品来满足这种需求，往往比构建技术本身更加困难。


    ### 足够大的规模


    要达到预测可用性阈值需要有足够的数据规模。第一章“数据学习效应”中的初始公式表明输出是一个数据函数：


    `输出=功能{数据网络效应[数据处理能力和质量（数据量）]}`


    这意味着输出需要数据支撑。没有足够数据来启动数据学习效应的产品将无法为客户提供足够的价值，也无法鼓励他们提供更多数据来保持数据学习效应的运行。人工智能优先公司可以通过以下方法获取足够的数据：大量接收客户数据、与补充数据的数据源合作，以及第四章“人工智能优先团队”中提到的其他策略。


    ### 并非所有数据都对回路有用


    请记住，并非所有数据都会对模型的输出产生影响。一些数据用于建立模型，然后被丢弃，一些数据用作系统的输入，还有一些数据通过反馈机制被再次输入系统。在这三种数据中，只有最后一种才对模型的输出有持续的贡献。


    训练用的数据在使用之后会被丢弃，因此不会累积价值。这样的数据包括三个独立的数据集：训练集、验证集和指定测试集。训练数据让机器学习具有了预测特性。验证数据用来对预测进行核验。在训练模型运行一段时间并查看其是否符合现实后，指定测试数据对训练模型生成的预测进行验证。


    用于预测的输入数据会在系统中进进出出。测试集当中的验证数据可以用作输入数据。这些输入数据后来会训练出新的模型，因此是一种潜在的资产。


    反馈数据会使系统发生变化，希望其能够做出更好的预测。这是专有程度最高的数据。设计产品，不断收集反馈数据；例如，询问客户预测是否正确，是纠正它还是接受它。反馈数据是专有数据，因为它是客户根据模型所做的预测采取行动之后，从实际世界中观察到的东西。竞争对手不会有这些观察结果。


    ### 规模的另一面


    随着更多的数据进入回路，加之数据学习效应有效地工作，回路的每一次运行都会不断地完善。然而，正如在数据学习效应公式（两边取对数）中看到的那样，在超过某一点之后，数据的效应就会衰减。注意这个公式的最后一部分：`log（数据的规模经济）`。这意味着拥有更多数据带来的输出增长取决于数据的规模经济。


    `来自更多数据的输出增加百分比=log（数据网络效应价值）+log（数据网络已处理数据的价值）+log（数据规模经济）`


    在数据规模经济非常低的情况下，很难有强大的数据学习效应，因为更多数据能使输出大幅增加。如果新入行者可以在不收集太多数据的情况下获得相同水平的输出，要么是因为数据网络效应的价值特别高，要么是数据网络处理数据的价值特别高。例如，当用于生成预测的机器学习方法对数据有效时，情况就是这样，因为它们不需要太多数据来达到预测可用性阈值。然而，如果数据规模经济非常高，则可能需要大量资本或时间来构建一个数据网络效应。这是一个挑战，也是一个建立企业防御能力的机会。


    然而，这种防御能力在下面两种情况下可能无法持续：算法突破或者规模收益递减。新入行者利用算法上的突破，以较少的数据实现相同水平的输出，从而超越现有玩家。例如，当代机器学习的贝叶斯方法能够有效地在小数据集上生成准确的预测。规模效应也有局限性：即使有数据规模收益的初始回报，在某一点之后，数据的回报也可能会逐渐减少。更多的数据可能不会让模型得到改进；数据学习效应也可能会停止。通过记录花费在模型的改进、获取更多数据或为模型设计更多功能上的成本，来监控收益与模型改进成本的比率。一旦产品产生递减的回报，公司就会通过收集数据来解决相关问题，从而为客户提供更多价值。


    ### 使漂移最小化


    用来训练模型的数据不再与现实世界相符时，模型就会漂移。基于高持久性数据训练的模型似乎有利于新入行者，然而，在实践中，拥有广泛部署的系统的现有玩家可能最容易访问到大量的新数据。人工智能优先公司面临的问题是，是否能够从客户或其他来源获得足够的新数据，最大限度地减少模型漂移。


    与其他试图对同一系统进行建模的人相比，在一个高度动态的系统中设法达到目标，然后，获得足够多的新数据以保持这种精度，会产生一个显著的优势。即使你对交货时间有一个准确的预测，但如果没有关于包裹位置、天气、交通和其他输入的最新数据，预测时就很难保证其准确度。没有人工智能的加持，想要掌握这些系统的动态变化从而准确预测几乎是不可能的；就人工智能而言，学习曲线没有尽头，而数据学习效应至关重要。


    ### 预测时应当思考的问题


    良好的预测应当有如下特征：①该预测在现实世界中使用的风险不大；②使用时产生下凸曲线回报；③利用可用数据获得预测可用性阈值；④有一些数据规模的回报。


    以下列举的一些情况或许能帮助你思考。


    - 风险程度有多高？如果决策不正确，会损失多少钱？如果出了问题，会有人受伤吗？

    - 资源的强化作用有多大？能够帮助客户利用现有的劳动力做更多的工作，或者减少他们目前的人数吗？能够激励客户将资金投入这项活动中吗？

    - 有数据来训练模型吗？有足够的资源来训练学习算法吗？

    - 一个新入行者能以多快的速度达到可观的数据规模？

    - 数据的回报是否在减少？模型是在不断改进，还是存在性能上限？

    - 是否有足够的新的、真实的数据来阻止模型漂移？如果还没有新的数据，是否有收集这些数据的管道，或者是否需要对数据收集方法（如部署传感器）进行大量投资？

    - 底层系统是否一直在变化，以至于没有新的数据就不可能建模？如果是这样，那么是否有新的专有数据可用？


    数据规模回报率低、漂移可能性高的领域不可靠。一方面，新入行者可以轻松积累足够的数据，从而超越现有公司。另一方面，公司可以通过比竞争对手更快地获取新数据，并继续获取新数据来构筑护城河，以实现数据规模回报率高、漂移可能性低的效益。漂移可能性与数据规模回报率的关系见表7-1。


    表7-1 漂移可能性与数据规模回报率的关系


    ![](EPUB/images/image_065.jpg)


    ## 模型测量


    回路由底层预测模型提供动力，而这些模型的性能可以量化。机器学习中使用的一些主要指标如下所示。还有很多其他的模型，每一代模型都有自己的测量标准，但下面这些是适用于多种模型的基本指标。


    ### 准确度


    准确度衡量的是在所有预测中有多少预测是正确的。要想弄清楚什么是“正确的”，需要以现实世界的真实面貌为参考，而要获取真实数据可能具有很大的挑战性。尤其当为了评估模型的准确度而必须从客户那里获得第一手数据时，更是如此，因为他们已经对预测的准确度感到不满。这就是本书提到的准确度的全部含义。通常情况下，你无须精通数学——只需要常识——但可能要懂一点统计学或微积分。


    ### 二元分类


    结果往往是二元的，如真与假。然而，准确度却是用另一种方式来衡量的。现实世界里有真有假，而模型世界里则有正类和负类。现实世界只会把某些事情看成是真的（它存在/发生过），或者假的（它不存在/没有发生过）。例如，根据经过验证的真实数据，如相框中有猫或没有猫。而模型世界则会说有些东西被判断为正类，或者被判断为负类。因此，有四种可能的结果（见表7-2）。


    表7-2 四种可能的结果


    ![](EPUB/images/image_066.jpg)


    模型做出正确预测时，会出现真正类和假负类；而预测不正确时，会出现真负类和假正类。下面是当结果为二元分类时准确度的测量方法。


    ### 准确度公式


    ![](EPUB/images/image_067.jpg)


    所谓判断是指按照事件的正负程度来判断真假。真正的二元结果不需要太多判断：根据像素的黑与白，模型输出为黑色或者白色。然而，很少有结果是真正二元的，因此，模型通常会按照百分比进行分类。比如说，模型90%确定照片中有只猫。设定一个阈值，当模型输出一个高于某个阈值的正值时——例如，高于90%时，就认为该模型的判断是正确的。


    ### 接受者操作特性曲线


    接受者操作特性（Receiver Operating Characteristic，`ROC`）曲线显示了模型在不同阈值下的表现。

