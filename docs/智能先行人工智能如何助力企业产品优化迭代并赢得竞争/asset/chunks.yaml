  trans: '

    The main point of this chapter is that the data learning effect is a dynamic circular
    motion, but its mode of motion differs from that of a moat. They can be viewed
    as loops, forming the basis for selecting the right product, measuring competitive
    advantage, assessing risk, and generating profit. This is a guide that, when the
    loop breaks, can be used to light up the entire loop and gain a better understanding
    of it.


    We start by defining loops, contemplating the nature of their motion, and comparing
    them with the outdated concept of moats. Then, based on the returns from solving
    specific problems, the data required to make AI work, and the possibility of AI
    drift, we provide methods for selecting the right problems and solving them with
    AI. After the conceptual discussion, we devote two sections to technical issues.
    One section introduces common methods for measuring the accuracy of machine learning
    models, while the other explores a method for calculating the various costs of
    building an AI-first company.


    ## Loops


    This book begins by defining the data learning effect. Let''s add some momentum
    to this definition to describe the motion characteristics of the data learning
    effect: circular motion.


    Remember, the data learning effect has three components.


    1.  **Input**: Access to unique data.

    2.  **Processing**: The ability to process data.

    3.  **Network**: Models that learn from processed data.


    The first two parts can have their own internal loops—for example, robots roaming
    the world to collect data, or using machine learning techniques to process data.
    However, the higher-level loop of the data network effect only begins after the
    first two parts are completed and the model creates a data network effect, thereby
    completing the entire process of building the data network effect.


    These loops are self-reinforcing and functionally powerful because they continuously
    generate their own data, serve predictions, and collect new data from observations.
    This is the power of the data network effect; the data learning effect thereby
    becomes self-sustaining and grows rapidly.


    Repetition is an inherent characteristic of loop motion; loops cycle continuously.
    Without repetition, competitive advantage would not compound. The data learning
    loop cycles with every batch of feedback data. Each cycle generates a prediction,
    the customer takes it into the real world and acts upon it. Then, the model performs
    some learning and generates a new prediction. Loop stacking is shown in Figure
    7-1.


    ![](img/image_058.jpg)


    Figure 7-1 Loop Stacking


    For example, an AI-first product generates a prediction: the pasta on the supermarket
    shelf will run out in 15 minutes, so it alerts the clerk to check the shelf after
    lunch. The clerk verifies and confirms the prediction: there is no pasta on the
    shelf. He makes a note in his application and restocks. The camera monitoring
    the shelf sees: initially there was pasta, then there wasn''t, then pasta appeared
    again. The AI receives information from the camera, the application, and the clerk''s
    notes, learning that the prediction was accurate, and that the pasta reappeared
    because the clerk restocked. This proves the final stage of the loop is functioning
    correctly, which increases confidence in the next prediction—the next one might
    be sent to the clerk hours in advance. Consequently, restocking time shrinks from
    hours to minutes.


    ### The Physics of Loops


    There is a fascinating physics behind loops. They can also be abstractly viewed
    as a kind of engine: first a steam engine, then a data engine.


    1.  Two things must interact to produce a third. Think of water boiling in a boiler
    to produce steam, thereby generating heat.

    2.  There must be more than two things interacting, or energy will dissipate.
    Steam produced by burning fuel is useless if not converted into motion. Before
    proceeding to the next step, two additional things acting somewhat like ballasts
    are needed to control input and output. Think of the cylinder and piston in a
    steam engine.

    3.  These components need to act in concert so the reaction isn''t too violent
    and doesn''t consume excessive energy. The steam produced just fills the cylinder,
    and the piston just manages to drive the crank.

    4.  There is a middle, somewhat magical step—entropy: for a period, moving objects
    cannot be converted into energy because they are busy forming something else.
    This happens when the crank almost stops... then, when a critical amount of steam
    forms, the crank moves again.

    5.  They must do something in the real world. The piston pushes the crank (which
    usually pushes other objects).

    6.  They must return to the initial state to start over. After every push of the
    crank, the piston returns to its starting position.


    Now let''s map the above example onto the data learning loop.


    1.  Data and model react to generate a prediction.

    2.  The model outputs predictions to people, but before these are applied to the
    real world, people process these predictions. So, the four factors are data (fuel),
    model (air), people acting on predictions (cylinder and piston), and the object
    of action (crank).

    3.  Data, model, and human action are consistent, mainly because nothing acts
    faster than humans.

    4.  Entropy occurs when humans think (cylinder) and their actions take effect
    in the real world (crank turning).

    5.  People act on predictions, and their behavior is observable.

    6.  Observations are data; the model learns from them, generates new predictions,
    and the next loop begins.


    Ideally, all this runs efficiently without wasting energy or inputs. For a car
    engine, the input is gasoline. For an AI-first product, the inputs are data, engineer
    time, and customer attention.


    Thinking in this way helps us distinguish good loops from bad ones. Good loops
    have ample inputs and ever-increasing entropy. Ample inputs mean more data. Increasing
    entropy allows humans to do many things with predictions and produce effects in
    the real world that match model predictions. Entropy also increases when people
    provide substantial feedback. By observing all impacts in the real world, digesting
    feedback, and integrating it to restart the loop, the model eventually solves
    the problem of disorder. Otherwise, there is nothing but a large amount of useless
    sensor output or manual feedback. This is just an abstract analogy that may help
    us understand how loops operate. Now let''s talk about moats, a different metaphor,
    but one from which the loop concept arose.


    ### Moats vs. Loops


    Traditionally, the moat surrounding a castle is considered a competitive advantage.
    However, a moat is a static concept. Once built, its size may increase or decrease,
    making it harder or easier for enemies to breach the castle, but it does not deepen
    automatically. The moat is shown in Figure 7-2.


    ![](img/image_059.jpg)


    Figure 7-2 Moat


    The problem is that the business world is dynamic; competitive forces change,
    and moats change shape.


    The moat metaphor does not apply to data learning effects. When unique data becomes
    the source of competitive advantage—equivalent to the water in the moat—and data
    automatically increases at an ever-faster rate due to the output of intelligent
    systems, the moat changes shape. The loop metaphor is more appropriate because
    the direction of each iteration is the same, but the scale may increase. Figure
    7-3 shows a loop where the iteration direction is consistent but the scale may
    increase.


    ![](img/image_060.jpg)


    Figure 7-3 Loop with Consistent Iteration Direction but Potentially Increasing
    Scale


    The area of the loop represents the degree of competitive advantage. If we still
    use the moat metaphor, then the loop not only changes shape automatically but
    also changes scale automatically. A loop that automatically changes shape and
    scale is shown in Figure 7-4.


    ![](img/image_061.jpg)


    Figure 7-4 Loop Automatically Changing Shape and Scale


    The size of the data learning loop increases automatically because the value of
    information compounds. Everything in the loop stays in the loop. The data learning
    loop preserves all generated information and uses it to generate more information.


    However, if the model is unstable and can no longer learn, the loop may stop running.
    If someone copies the entire thing, the loop can also be replaced. But a loop
    that has been running for a while is hard to replace because every run of the
    loop adds data, and this data can connect with new data collected in the next
    loop run.


    ## Lighting the Right Loop


    Data learning loops are not just about writing code; they require significant
    investment, but these investments pay off. Customers are willing to invest in
    building data learning loops, but whether they continue to invest depends on the
    loop''s performance, whether there are risks in obtaining results from the cycle,
    and whether the loop will keep running. The following content can help you judge
    whether customers will participate in the loop and how to keep the loop cycling.


    ### Product Returns


    Machine learning relies on probabilistic methods to model uncertainty. Probabilities
    are not always accurate, so models are not always effective. When building machine
    learning products, keep this in mind: maximize customer expectations while avoiding
    unrestricted use of machine learning in high-risk situations.


    ### Returns (Payoffs)


    Modeling the shape of the returns from product usage can determine whether the
    product is valuable to the customer. These returns (payoffs) are usually curve-shaped—convex
    curves or concave curves (as shown in Figure 7-5).


    ![](img/image_062.jpg)


    Figure 7-5 Convex Curve Returns vs. Concave Curve Returns


    Convex curve returns indicate that using the product ultimately increases value
    (as shown in Figure 7-6). That is, the more it is used, the greater the benefit.
    Consumer applications are the most typical example: Google Search can be used
    almost anytime, and every result has some informational value. Even less-than-ideal
    search results cause no harm. The descending part of the convex curve and the
    negative value part represent the product cost in the early production stage.


    ![](img/image_063.jpg)


    Figure 7-6 Convex Curve Returns


    Concave curve returns represent that using the product ultimately decreases value
    (as shown in Figure 7-7). That is, the more it is used, the smaller the benefit.


    ![](img/image_064.jpg)


    Figure 7-7 Concave Curve Returns


    The keyword here is "potentially": the shape of the curve is based on probability.
    This seems a bit abstract, but it is very useful when considering where to apply
    machine learning—that is, when the expected value of using the product exceeds
    the cost. I remind you that expected value equals the payoff value multiplied
    by the probability of obtaining the payoff. We can also think of this in terms
    of interaction frequency. What is the product''s average user experience? If it''s
    a one-time interaction, like diagnosing a disease, the denominator of "average"
    in "average user experience" is 1, so the interaction must be perfect. This is
    a problem because machine learning systems are not 100% accurate. Below are examples
    of the two types of returns.


    #### Convex Returns


    **Marketing:** AI-based marketing products bring new leads. Even if these leads
    ultimately lead nowhere, the process of pursuing them—at negligible cost—can yield
    very high returns. For example, some companies can identify website visitors and
    generate rich profiles from them, used as marketing leads and for finding contact
    information for these leads. The low cost of such products is offset by the high
    return of acquiring new customers.


    **Sales:** AI-based sales products prioritize leads by importance. These tools
    increase the likelihood of discovering leads. The low cost of using these products
    is again offset by the high return of winning new customers.


    **Inventory:** AI-assisted inventory management can identify stock levels to enable
    timely replenishment, thereby retaining customers when they want to buy—for example,
    running computer vision algorithms on grocery store surveillance video to identify
    out-of-stock items, allowing staff to quickly restock so customers can buy more.


    #### Concave Returns


    **Scheduling:** AI-based personal assistants (undoubtedly) save time. However,
    for the customer, the machine-calculated ROI is somewhat biased (unbalanced).
    The gains from using an AI personal assistant are hard to calculate because the
    machine struggles to weigh the user''s time and may incur large losses. For example,
    if a scheduling bot sets up some meetings, it has "completed the task." But the
    bot might double-book, causing the user to miss a meeting with an important person.
    This is a costly error, and the user naturally blames the bot.


    **Customer Service:** AI-based customer service bots can answer questions quickly
    at low cost. But for the customer, the machine-calculated ROI is still somewhat
    biased (unbalanced). Because the bot answers questions in the most efficient way,
    the holistic experience of using the bot is affected—no surprises, no delight,
    no relationship building with the customer. However, if the bot merely creates
    more follow-up questions for humans to answer, or angers customers, the benefits
    of such products may be very low.


    ### Choosing What to Build


    Founders, product managers, and designers must think carefully about the following
    question: Can a system with probabilistic assumptions meet customer needs, or
    is a deterministic system a better choice? The answer depends on how high the
    accuracy needs to be and how much it costs. Understanding what customers truly
    want and building a product to satisfy that need is often more difficult than
    building the technology itself.


    ### Sufficient Scale


    Sufficient data scale is needed to reach the prediction usability threshold. The
    initial formula in Chapter 1 "Data Learning Effects" shows that output is a function
    of data:


    `Output = Function{Data Network Effect[Data Processing Capability and Quality
    (Data Volume)]}`


    This means output requires data support. Products without enough data to kickstart
    the data learning effect cannot provide sufficient value to customers, nor encourage
    them to provide more data to keep the data learning effect running. AI-first companies
    can acquire sufficient data through: receiving large amounts of customer data,
    partnering with supplementary data sources, and other strategies mentioned in
    Chapter 4 "AI-First Teams".


    ### Not All Data Is Useful to the Loop


    Remember, not all data affects model output. Some data is used to build the model
    and then discarded; some serves as system input; and some is fed back into the
    system via feedback mechanisms. Of these three types, only the last one continuously
    contributes to model output.


    Training data is discarded after use, so it does not accumulate value. Such data
    includes three independent datasets: training set, validation set, and designated
    test set. Training data gives machine learning its predictive properties. Validation
    data verifies predictions. After the training model has run for a while and been
    checked against reality, designated test data validates predictions generated
    by the trained model.


    Input data for predictions flows in and out of the system. Validation data from
    the test set can be used as input data. This input data later trains new models,
    so it is a potential asset.


    Feedback data changes the system, hopefully enabling better predictions. This
    is the most proprietary data. Design products to continuously collect feedback
    data; for example, ask customers if the prediction was correct, correct it or
    accept it. Feedback data is proprietary because it is what the customer observes
    from the real world after acting on the model''s prediction. Competitors will
    not have these observations.


    ### The Other Side of Scale


    As more data enters the loop, and the data learning effect works effectively,
    every run of the loop continuously improves. However, as seen in the data learning
    effect formula (taking logs of both sides), after a certain point, the effect
    of data decays. Note the last part of this formula: `log(Economies of Scale of
    Data)`. This means the output growth from having more data depends on the economies
    of scale of data.


    `Percentage Increase in Output from More Data = log(Value of Data Network Effect)
    + log(Value of Processed Data in Data Network) + log(Economies of Scale of Data)`


    When economies of scale of data are very low, it is difficult to have a strong
    data learning effect because more data makes output increase significantly. If
    a new entrant can achieve the same level of output without collecting too much
    data, it is either because the value of the data network effect is exceptionally
    high, or the value of the data network processing data is exceptionally high.
    For example, this is the case when the machine learning method used to generate
    predictions is effective on data, because it doesn''t need much data to reach
    the prediction usability threshold. However, if economies of scale of data are
    very high, it may require significant capital or time to build a data network
    effect. This is a challenge, but also an opportunity to build enterprise defensibility.


    However, this defensibility may not be sustainable in two cases: algorithmic breakthroughs
    or diminishing returns to scale. New entrants leverage algorithmic breakthroughs
    to achieve the same level of output with less data, surpassing incumbents. For
    example, modern Bayesian machine learning methods can effectively generate accurate
    predictions on small datasets. Scale effects also have limits: even with initial
    returns to data scale, after a certain point, returns on data may gradually diminish.
    More data may not improve the model; the data learning effect may stop. Monitor
    the ratio of returns to model improvement costs by recording costs spent on model
    improvement, acquiring more data, or designing more features for the model. Once
    the product generates diminishing returns, the company solves related problems
    by collecting data, thereby providing more value to customers.


    ### Minimizing Drift


    When the data used to train the model no longer matches the real world, the model
    drifts. Models trained on high-persistence data seem to favor new entrants; however,
    in practice, incumbents with widely deployed systems may have the easiest access
    to large amounts of new data. The problem AI-first companies face is whether they
    can obtain enough new data from customers or other sources to minimize model drift.


    Compared to others trying to model the same system, managing to hit the target
    in a highly dynamic system, and then obtaining enough new data to maintain that
    accuracy, creates a significant advantage. Even if you have an accurate prediction
    for delivery time, without the latest data on package location, weather, traffic,
    and other inputs, it is difficult to guarantee prediction accuracy. Without AI,
    it is almost impossible to master the dynamic changes of these systems to predict
    accurately; for AI, the learning curve has no end, and the data learning effect
    is crucial.


    ### Questions to Think About When Predicting


    Good predictions should have the following characteristics: ① The prediction poses
    little risk when used in the real world; ② It generates convex returns when used;
    ③ It reaches the prediction usability threshold using available data; ④ It has
    some returns to data scale.


    The following listed situations may help you think.


    - How high are the stakes? How much money is lost if the decision is wrong? If
    something goes wrong, will anyone get hurt?

    - How strong is the reinforcement effect on resources? Can it help customers do
    more with existing labor, or reduce their current headcount? Can it incentivize
    customers to invest money in this activity?

    - Is there data to train the model? Are there sufficient resources to train the
    learning algorithm?

    - How quickly can a new entrant reach a substantial data scale?

    - Are data returns diminishing? Is the model continuously improving, or is there
    a performance ceiling?

    - Is there enough new, real data to prevent model drift? If there is no new data
    yet, is there a pipeline to collect it, or does it require heavy investment in
    data collection methods (like deploying sensors)?

    - Is the underlying system constantly changing so that modeling is impossible
    without new data? If so, is new proprietary data available?


    Domains with low returns to data scale and high drift probability are unreliable.
    On one hand, new entrants can easily accumulate enough data to surpass existing
    companies. On the other hand, companies can build moats by acquiring new data
    faster than competitors and continuing to acquire new data, achieving high returns
    to data scale and low drift probability. The relationship between drift probability
    and returns to data scale is shown in Table 7-1.


    Table 7-1 Relationship Between Drift Probability and Returns to Data Scale


    ![](img/image_065.jpg)


    ## Model Measurement


    Loops are powered by underlying prediction models, and the performance of these
    models can be quantified. Some of the main metrics used in machine learning are
    shown below. There are many other models, each generation with its own measurement
    standards, but the following are basic metrics applicable to various models.


    ### Accuracy


    Accuracy measures how many predictions are correct out of all predictions. To
    figure out what is "correct," one needs a reference to the real-world ground truth,
    and obtaining ground truth data can be highly challenging. Especially when first-hand
    data must be obtained from customers to assess model accuracy, because they are
    already dissatisfied with the prediction accuracy. This is the full meaning of
    accuracy mentioned in this book. Usually, you don''t need to be a math expert—just
    common sense—but you might need to know a little statistics or calculus.


    ### Binary Classification


    Outcomes are often binary, such as true or false. However, accuracy is measured
    differently. The real world has true and false, while the model world has positives
    and negatives. The real world only sees certain things as true (it exists/happened)
    or false (it doesn''t exist/didn''t happen). For example, based on verified ground
    truth, like a cat in the frame or no cat in the frame. The model world, however,
    says some things are judged as positive, or judged as negative. Therefore, there
    are four possible outcomes (see Table 7-2).


    Table 7-2 Four Possible Outcomes


    ![](img/image_066.jpg)


    When the model makes a correct prediction, True Positives and True Negatives occur;
    when the prediction is incorrect, False Positives and False Negatives occur. Below
    are the methods for measuring accuracy when the outcome is binary classification.


    ### Accuracy Formula


    ![](img/image_067.jpg)


    So-called judgment refers to judging true or false according to the positive/negative
    degree of the event. True binary outcomes don''t require much judgment: based
    on black and white pixels, the model outputs black or white. However, few outcomes
    are truly binary, so models usually classify by percentage. For instance, the
    model is 90% certain there is a cat in the photo. Set a threshold; when the model
    outputs a positive value above a certain threshold—for example, above 90%—the
    model''s judgment is considered correct.


    ### Receiver Operating Characteristic Curve


    The Receiver Operating Characteristic (`ROC`) curve shows the model''s performance
    at different thresholds.


