    ## 数据学习效应与价格优化


    数据学习效应可以实现更准确地定价。价格合理的产品销量更大，更多的客户就能够收集更多的数据，从而为数据学习效应提供动力。成本优势不同于价格优化，更好的定价可以助推数据学习效应。


    定价是一种信息游戏，通过准确地计算出某人将为某事支付多少钱来赢得胜利。预测系统用于定价实验，以生成测试价格。开展定价实验的一种方法是根据经验观察、猜测或其他因素来选择价格；另一种方法是使用之前实验的数据，来预测什么样的价格可能被接受。第二种方法更有可能找到最合适的价格。


    电子商务网站通常会进行个性化定价。一个购物者看到的产品价格通常与另一个购物者在同一个网站上看到的价格不同，或者同一个产品，购物者在手机上看到的价格可能与在笔记本电脑上看到的不一样。这是因为人工智能在不断地运行实验，根据客户的身份（是否登录到包含以前购物和客户统计信息的配置资料）、居住地、刚刚点击的内容等，来确定他们可能会为某件商品支付多少费用。复杂的购物网站在每个人身上使用数百个数据点，从客户偏好的数据集，以及不同人群的数十亿数据点，到产品定价。这些网站经常举办一些可能会赔钱的促销活动——以低于成本的价格销售产品——但这最终会产生一些关于客户购买意愿的有用数据。


    手动个性化过程应该包括观察，利用观察来确定实验使用的下一个价格，然后开展下一个实验，并进行更多观察，以此类推。自动个性化过程可能需要使用机器学习，方法是将数据输入一个系统，该系统会根据它认为的达到最优价格的曲线梯度生成一个要测试的价格。


    航空公司开发了一些最早的价格优化系统，通常被称为收益管理系统，该系统根据各种变量对每个座位进行定价，例如：飞机上的座位数量、飞机在既定航线上的飞行成本、座位位置、一年中特定时间的预期需求等。这些系统依赖于线性优化数学概念，这是一些机器学习系统的基础。如今，这些系统为座位定价，而且频繁改变价格，同时将这些价格分发到无数可以购买机票的地方。


    此外，还有一些销售给企业的软件产品的预测定价示例。其面临的挑战是，关于商业客户将为一个产品支付多少费用的数据通常较少，不仅因为他们很少做出较大的购买决定，还因为他们在做这些决定时的行为，不像消费者浏览购物网站那样容易被观察到。


    如果将利润重新投资到数据学习效应，就会产生更好的定价，而更好的定价就会带来更多利润，同时提高数据学习效应。


    - 更好的定价产生利润，从而为机器学习的研发提供资金。

    - 更好的定价可以吸引客户，进而获得更多数据（无成本），创造更多利润，从而加大对研发的投入。

    - 更好的定价意味着更少的销售和营销支出，创造更多的利润，从而加大对研发的投入。


    ## 数据学习效应的局限性


    网络效应具有局限性，人们对效用随着网络规模的扩大而增加的假设产生了质疑。有时，这些局限是外在的。例如，当覆盖网络的产品在市场上达到垄断地位时，政府对网络所有者采取监管行动。有些时候，局限来自内部。比如，为网络产品提供服务的技术，在一定范围内出现了崩溃。有时，产生网络效应的产品在一定的网络规模之外，并不会变得更有用。例如，你在脸书上拥有的第510个朋友，不一定比你第50个朋友好；一旦网络发展到一定规模，你就不再和它们或者产品打交道了。


    数据学习效应同样面临着一些限制。有时，这些限制来自外部，例如，政府为了打破数据所有者在市场上的垄断地位，而对其采取监管行动。有时限制来自内部。例如，数据过于昂贵而无法存储和管理。添加数据点会增加数据提取、转换、准备、清理、加载和存储的成本，甚至会降低数据规模回报率。例如，向客户关系管理系统（CRM）添加更多关于每个客户偏好的数据，就需要更细粒度的标签，来对数据进行有意义的分类。添加数据也可以增加所需的输出维度数，换句话说，就是预测必须显示的内容。有时，随着信息的增加，产生网络效应的产品并没有边际效用。例如，谷歌地图或者Yelp上咖啡店的第三百条评论，并不一定比第三条评论有用。总分也许更可靠，但没有人读那第三百条评论。数据并不总是越多越好。


    数据学习效应在获取新数据方面具有局限性，会增加产品制造成本，还无法生成新的信息。获取更多数据的价值，需要从技术和实践层面进行考虑：额外的数据必须使模型更准确，而更高的准确度，对客户来说一定是有用的。


    ## 本章结论：现在怎么办？


    我们有恰当的词汇来描述公司如何集体快速地从数据中学习。这些公司在下列几方面取得了跨越式发展：从口头到数字的信息分发，从手动到自动的信息共享，从在自己的大脑中学习到跨大脑的学习，从在湿件上学习到在硬件上学习，从一个节点上的学习到网络中跨节点的学习。这些公司都是人工智能优先公司。


    我发现，网络效应在人工智能优先公司和在社交网络中发生的方式不一样：它的发生是因为一个用户与其他用户发生了关系，而这种关系由此不断升级。只有在努力收集和处理数据之后，数据网络效应才会出现。这有时需要数年时间，而不是仅仅通过做出正确的技术选择就能产生。拥有能力非凡的人才至关重要，因为他们知道数据是什么，在哪里以及为什么它们与待解决的特定问题相关。我看到一些公司通过这种努力学到的东西是强大的。当数据学习效应介入时，这些公司不仅吸引了更多客户，还获取了相关业务的专有信息，这些信息有助于找到使核心流程自动化的方法。这种自动化能够让客户的业务更加有利可图，同时也会让人工智能优先产品更加受人青睐。


    下面的路径描绘了人工智能优先公司的学习历程。首先，学习如何获取和评估数据；其次，学习如何建立一个人工智能团队来处理这些数据；最后，学习如何构建使用这些数据改进产品的模型。这样一来，我们就可以在数据学习效应中获得竞争优势，从而实现相当程度的自动化。接下来的问题是，如何利用自动化节约的成本，我们将在本书的最后一章“优势聚合”中对其进行讨论。数据学习效应之旅如图1-9所示。


    ![](EPUB/images/image_015.jpg)


    图1-9 数据学习效应之旅


    ## 本章要点


    - **从自动合成的数据中积累信息是一种数据学习效应。** 构建数据学习效应的步骤是：①捕获临界数量的数据；②发展将数据转化为信息的能力；③将这些信息输入一台计算机，运行这些数据，从新的数据点开始学习。

    - **与数据处理能力和数据网络效应相结合，数据可以产生边际输出。** 数据学习效应明确了围绕数据的价值链。

    - **数据学习效应十分独特。** 它们从供给侧的竞争优势开始，启动需求侧的竞争优势，并将资源访问特权与将该资源转化为有价值资源的能力相结合。

    - **数据网络效应与普通网络效应不同。** 网络效应和数据网络之间的差异，在于添加到网络中的内容。有了网络效应，网络节点之间的连线（边缘）可以发挥其功能并实现通信。有了数据网络效应，边缘就具有了信息性，并能够计算。

    - **数据规模效应不仅仅是数据规模经济。** 更多的数据不会自动产生数据网络效应，但可能会导致规模效应，处理或获取数据的成本随着规模的增加而降低。

    - **有两种类型的数据网络效应：入门级和下一级。** 入门级能够看到数据的添加产生了积极的效应，但到下一级时，添加数据加上人工智能会产生积极的效应。第一种更容易构建，但第二种增长更快。

    - **下一级数据网络效应生成免费数据。** 入门级效应需要来自网络外部的数据。下一级效应从网络内部生成数据（反馈数据），产生具有更高复合效应的数据价值。

    - **更好的智能形式来自自我生成的数据网络。** 入门级数据网络效应提高了我们自身的智能。下一级数据网络效应可以加快我们的学习速度。

    - **具有数据学习效应，赢家可以通吃。** 人工智能优先产品具有很高的数据规模经济，客户之间对多样性的需求也很高，因此这些产品可以在一个转折点之后主导一个行业。

    - **数据学习效应使产品更便宜。** 数据学习效应通过降低获取和处理数据的成本，同时为客户提供更多的价值，从而实现成本优势。

    - **数据学习效应使产品定价更容易。** 建立一个独立的智能系统，在不同的客户群中进行价格试验，并优化定价。

    - **数据学习效果有局限性。** 它们会受到周边技术规模、数据存储成本、对客户缺乏边际效用，以及监管措施等的限制。


    # 第二章 精益人工智能


    让我们选择一条通向构建人工智能的捷径，在构建数据学习效应的每个组件之前，先缩小现在的工作范围。本章探讨的是如何利用现有资源开始项目建设，下面的章节将对数据学习效应的每个组件进行分解：获取数据、组建处理数据的团队，以及创建产生数据网络效应的模型。


    一开始你的客户可能不需要人工智能，只需要一些统计分析或许就足够了。于是我们采用了一个新的词语来描述精益人工智能方法，并展示其与用来谈论上一代软件和初创企业词汇的差异。准确度是人工智能优先产品的性能，而预测就是产品。


    接下来的章节通过介绍如何获取数据、构建人工智能模型、创建一个自我强化的循环，以及如何从人工智能中获得利润，让精益人工智能系统变成现实。


    记住：任何公司的任何人，都可以开始构建人工智能系统了。你准备好了吗？


    ## 客户需要什么？


    客户不一定会说他们需要什么，正如汽车制造商亨利·福特（Henry Ford）所说：“如果我当初问人们想要什么，他们会告诉我，他们想要跑得更快的马。”产品设计在人工智能出现之前就已经存在。本节将对设计满足客户需求的产品原则进行概述（见表2-1）。


    表2-1 设计满足客户需求的产品原则


    ![](EPUB/images/image_016.jpg)


    了解客户需求可以是归纳式的：提出问题，倾听，推断需要什么，然后构建它。在某个行业里没有太多经验的创业者，通常会在创业前通过提出很多问题来归纳出客户的需求。归纳过程的重点是从一组潜在客户那里获取信息，发现一个需求趋势，并提出一系列功能来满足这一需求。这通常包括调查、提出一个设计、对不同的潜在客户群体开展测试，以及对设计进行迭代。这是一个离心过程：在确定客户需要（需求）之前，先分析大量有关人们购物（供应）的数据。许多消费品都是这样设计的，因为潜在的客户群十分庞大。


    弄清楚该为客户提供什么可以是演绎式的。当代的创业者通常会通过观察过去的情况和添加新产品，来推断出应该提供什么。演绎过程的重点是从一个客户那里获取信息，以判断供应趋势，并制定产品特征列表。这通常包括打电话给客户、提出设计方案、召开大量会议来改进设计方案，以及收集产品推出后的反馈。这是一个向心的过程：逐步缩小产品规格范围，以满足客户需求。许多商业产品都是这样设计的，因为潜在客户的数量很少，所以有可能与所有客户进行交流。


    下一个问题是：为了表现优异，原型产品需要人工智能的加持吗？要回答这个问题，必须先弄明白：客户是否需要生成一个观点？是否需要做出一个预测？以及是否需要让一个流程自动化？


    ## 客户需要人工智能吗？


    人工智能的承诺是，可以帮助客户做出更好、更快的决策。客户需要多少人工智能，取决于他们所做决策的类型，以及所依据的数据。这里有一种方法可以对手头的决策和数据进行分类，从而确定客户需要的是人工智能还是分析法。无论他们需要什么，首先要做的就是将决策类型和数据放入决策树中。精益人工智能决策树如图2-1所示。


    ![](EPUB/images/image_017.jpg)


    图2-1 精益人工智能决策树


    浏览此决策树并依次做出选择以衡量人工智能和分析法哪边被选择次数更多。如果分析法更多，那么，客户可能需要数据的功能，比如记录、清理和操作——换句话说，像算出平均数这样的数学运算——但这绝对不是人工智能。如果人工智能更多，那么，客户可能需要人工智能功能，例如数据的分类、分割和操作。

