    # 咨询与竞争


    有些公司拥有大量的数据和一个需要解决的大问题，就是没有办法使用这些数据，因为机器学习的建构非常困难。这为拥有机器学习人才但没有数据的公司创造了一个与拥有数据但没有机器学习人才的公司合作的机会。


    这种策略最简单的实施方式是，拥有机器学习人才的公司与拥有丰富数据的公司一起建立一个咨询项目，确保在项目完成之后拥有保留数据（或以某种版本保留数据）的权利。这样的项目可以通过高度定制的数据科学工作方式来完成。


    另一个体现该想法的更高级做法是构建一个平台，在这个平台上，公司提交数据集和问题，然后，一群人提交机器学习模型，以足够的准确度来解决问题。率先将这一想法付诸实践的是
    Kaggle 公司，一个成立于 2010 年的数据科学和机器学习从业者的在线社区。数据科学家和机器学习工程师可以去 Kaggle 浏览数据集，利用这些数据集建立模型来解决预测问题。很多时候，提交最准确预测的个人或团体会赢得现金奖励。


    或许，这样一个平台可以用分布式方式进行构建，这样，任何人都可以在平台上创建数据集，然后在任何地方，在任何人看不到数据或模型的情况下运行该数据集。一方面，这将使公司拥有宝贵的私人数据，让世界各地的数据科学家和机器学习工程师，可以在从未看到过这些数据的情况下建立预测模型——私人数据没有泄露的风险。另一方面，数据科学家和机器学习工程师可以创建有价值的模型，而人们也看不到他们具体的工作过程。


    在私人数据上构建机器学习系统涉及联邦学习、差分隐私、安全多方计算，以及区块链等市场激励机制。在这样一个系统中，数据所有者提交数据或者一个基本模型，并在获得奖励的情况下对模型进行训练，使其达到一定程度的准确度。然后，对模型进行加密，并上传到机器学习工程师的公共或私人网络。训练完成之后，他们会根据模型达到的准确度拿到不同的奖励。然后，机器学习工程师可以选择是否使用自己的私钥为提供奖励的一方解密模型。在这个过程中，任何一方都可以利用机器学习算法和模型访问对方的数据或知识产权。


    ## 数据驱动的媒体


    媒体可以启动数据收集。这是一种间接方法——不是内置于产品中——但也是一个收集数据的有效方法。媒体上的文章，无论是纸质的还是在线的，都可以通过迫使相关人员向媒体提供数据来促进参与。例如，一篇文章根据成功项目的数量对一个行业的所有公司进行排名。该行业的相关人员希望自己的项目在榜单上排名靠前，但出版方需要关于他们项目的详细信息，才能对公司进行适当的排名。因此，行业相关人员就会提交数据，而出版方随后更新了排名，同时也获得了有价值的数据。这是一种高明的利己操作，因为这些公司提交的数据不仅对出版方有益，而且对公司也有益。


    ## 政府


    政府历来都是通过人口普查收集数据的最大系统。美国政府的一些数据可以通过应用程序接口以结构化、可访问的形式提供。政府机构通过此类应用程序接口提供公共数据，这样一来，个人不仅能以更系统的方式获取公共信息，还可以尝试利用政府数据构建有用的应用程序。


    然而，这些数据不是专有的，因此不是竞争优势的来源。竞争优势的来源是以前所未有的手动或数字方式从公共来源收集的数据。它可以是任何内容，从手动转录政府记录，到对离线政府数据库的现场访问，并从中提取数据。获取公共数据的机会在其他情况下难以得到，尤其是市一级政府，因为较低级别的政府通常没有资源为其选民创建和维护在线资源。


    ## 批量采购数据


    我们把最明显的来源留到了最后：批量采购数据。有很多公司出售数据，从专门贩卖消费者数据的上市公司，到通过脸书捕获数据并顺带销售的花里胡哨的应用程序。有些公司甚至出售对酒精上瘾的人以及渴望摆脱债务的人的名单。数据经纪人的世界着实奇特怪异。


    ### 数据经纪人做些什么


    数据经纪人获取特定类型或特定主题的临界数据，将其放在一个地方，并对数据执行一番优化操作，比如清洗、基础分析和数据补充等。经纪人出售的可能会是见解，而不仅仅是数据。有时，经纪人拥有其出售的所有数据；有时只拥有其中的一些，而另一些则是授权数据。然而，对于终端客户来说，数据是打包并定好价的，所有问题均由数据经纪人来处理。


    数据经纪人业务极具挑战性。虽然客户是在严格地“租用”数据，但在获益之后，通常不会再租用更多的数据。因此，对于数据经纪人来说，关键是卖出需要定期刷新的数据，比如股票价格等。


    数据经纪人经常通过应用程序接口提供数据，客户从这里发出对某些数据点的请求，然后以结构化的格式接收。数据通过管道传输到其他应用程序，比如营销自动化工具等。这就是所谓的数据即服务，因为数据被提供给应用程序，而不是批量接收。


    ### 数据经纪人类型


    营销数据经纪人通常出售个人资料，这样一来，品牌、组织和其他实体可以直接找到这些人。但是，这些个人资料并不总是可以识别为一个人。相反，它们是与标识符关联的一组关于人的属性。该标识符可以是姓名、电子邮件地址、一个网名标识符，以及附带属性，从基本属性（如年龄）、个人属性（如
    12 年前写的调查问卷答案）到抽象属性（如常点击哪些页面）。


    还有一些公司在这些属性的基础上创建衍生配置文件，比如心理或人口特征，并根据推断出的个人偏好、口味或其他因素，将其放入不同的类别中。从本质上讲（而且带有贬义），这些模型系统地将人进行模式化，从而让营销人员更容易地推出最适合特定群体的活动。


    金融数据经纪人汇总金融和公司数据。这些数据中最基本的是股票行情数据——也就是说，带有时间戳的股票价格。投资者还希望获得可用于建立公司估值模型的数据，例如特定行业的公司名单、财务报表信息（公共和私人）、产品清单、消费者调查和历史共识评估等。彭博新闻社就是这样一家公司，每年的收入超过
    100 亿美元。


    在其他垂直领域也有许多数据经纪人。公司可以购买医疗数据、行业特定数据以及产品数据等。


    ### 数据经纪人交易过程


    从一个成熟的数据经纪人那里购买数据通常很简单。定价表列出了每个数据点的成本，通过应用程序接口或其他介质刷新数据时收费。对于规模较小的经纪人来说，这个过程可能更加复杂，包括填写表格和邮寄
    U 盘等。然后还有一个选择，就是通过谈判，从拥有特定数据集的人那里一次性购买批量数据。


    以下清单在购买数据时可能有用：


    - **验证。** 是否有人——第三方或数据经纪人本身——验证了数据的准确度？如果没有，那你可能最终拿到的是一堆垃圾。

    - **结构。** 数据的格式是否可用？如果不行，您可能需要花钱将其重新格式化，然后再输入数据管道。

    - **所有权。** 数据经纪人是否拥有正在出售的数据？如果没有，你可能会被人追着索要数据或者遭到起诉。

    - **合规。** 数据经纪人是否遵守了相关的——比如保护个人的——法律？如果没有，你可能会因使用数据而面临被罚款的风险。

    - **安全。** 数据经纪人是否能够保护正在出售的数据？如果不能，那么有人可能会偷袭数据经纪人，盗取数据，并将其公开——导致你购买的数据价值大大降低。


    ## 不要出售你的数据


    人工智能优先公司可能会考虑是否出售自己的数据。这通常是从数据资产中赚取收入的次优方式。数据经纪人的价值没有利用数据构建产品的公司高。从长远来看，将这些数据用作数据学习效应的基础，可能会产生更多的价值。


    我们来看两个非常成功的公司是如何得出相同的结论的。例如，脸书和领英在发展到中途时，都意识到他们的数据极其珍贵，因此切断了通过应用程序接口访问其数据的渠道。他们这样做是为了保护自己的能力，即通过销售高价值的应用程序——领英的销售和招聘产品，以及脸书的广告平台，来获取资产的全部价值的能力。如果他们将基础数据（配置文件）出售给其他在应用层获取价值的公司，是不可能推出这些产品的。


    积累一个专有的数据集，虽然很辛苦，却是一件有价值的事情。但这只是创造数据学习效应的第一步。如今，将这些数据输入一个能够为客户提供见解的自学习软件系统，是建立一个永久性技术企业下一步要做的事情。


    ## 本章结论：尽你所能得到它


    每周，我似乎都会听到另一种获取数据的新方法。在如何简单获取数据以及如何为社会构建下一波工具方面，人们的创造力是非凡的。当然，其中一些是一次性方法。然而，将它们串联在一起，积累成一个有价值的数据集，就是创建一家竞争力持久的人工智能优先公司的第一步。


    在收集数据方面，没有什么正确的方法，没有所谓的金线（Golden Thread，即能够把某些东西联系在一起的重要和有价值的东西），也没有详尽的清单；你所要做的就是尽力得到它们。本章提供了一些想法和起点。在本章开头，通过评估框架进行数据获取，可以在获取和积累数据，以及规划如何保持数据新鲜度时，合理分配资金。下一章将向你展示如何根据你掌握的数据选择一种人工智能。


    ## 本章要点


    - **区分不同数据集的值。** 物理或法律上的可达性、可用性、成本、时间和可替代性，是判断其他人是否能够获得相同数据，从而具有竞争优势的有用指标。

    - **根据数据与你用例的相关性确定数据的价值。** 持久性、准确度、维度、广度和自我强化，是确定数据集能否提高预测准确度的重要指标。

    - **从客户那里获取数据。** 经过深思熟虑之后，与客户签订合同，平衡其对基础数据的所有权以及根据该数据（包括模型和自行生成的数据）训练的人工智能的所有权之间的关系。

    - **从小客户那里收集数据。** 小客户可能更愿意分享他们的数据，而且，通过营销活动在产品和市场开发的早期阶段更容易接触到他们。规模较大的客户对其数据的使用有更严格的限制，并要求提供折扣。

    - **创建一个数据联盟。** 人工智能优先公司可以组织成立客户数据联盟来对抗行业巨头。

    - **构建工作流软件来收集数据。** 工作流应用程序中每天都有大量业务流程数据。人工智能优先公司可以利用这些数据构建一个智能系统，通过预测来实现工作记录自动化。

    - **从其他软件中提取数据。** 跨不同来源链接、规范化和更新数据是一项有价值的服务。作为提供此服务的一部分的公司可以直接收集数据，或者使用该数据管道生成元数据。

    - **与拥有互补数据和商业模式的公司合作。** 当数据能够增加现有数据的价值时，它便具有了互补性。公司有分享数据的动机，因为他们的模型会随着数据的增加而改进。

    - **组建一个团队来手动标注数据。** 这项工作可以外包、众包或内包。内包意味着建立一个团队来标注数据，其中可能包括专业和非专业数据标注员，并且需要工具来高效地对大量数据进行标注。

    - **利用主动学习提高数据标注效率。** 这样的工具有助于专业数据标注员使用几个手动标注的数据标签获取许多自动标注的数据标签。

    - **让用户进入学习回路。** 用户可以创建、标注以及评估数据。要达到最高水平的准确度，通常需要尽可能地接近人类的思维方式，所以需要人们的参与。

    - **创建代理人基模型。** 对代理人的激励、行为和约束进行建模，然后观察他们的互动来获取数据，尤其是关于复杂系统的数据。

    - **创建模拟。** 创建并运行一个模拟系统，可以生成有关意外情况的数据。

    - **合成数据。** 软件可以在同一对象的不同版本、多视角、难访问、低概率、高成本或低速度实例上创建新标签。合成数据通常用于在非结构化数据（如图像）上生成标签。

    - **对第三方数据提供者进行激励。** 基于令牌的激励是一种在特定网络中激励数据贡献者的新方法，因为令牌设置了验证和奖励步骤。

    - **创建一个收集数据的消费类产品。** 创建一个单独的应用程序，推出一款消费类产品，部署传感器，虽然成本较高，却能够有针对性地收集数据。

    - **爬取公开可用数据。** 网络、政府和数据供应商拥有大量数据，可以通过网络爬取、咨询与竞争或者媒体等来获取。

    - **不要出售数据。** 数据经纪人的价值不如使用数据构建产品的公司价值高。利用这些数据构建一个数据学习效应。


    # 第四章


    # 人工智能优先团队


    处理数据是构建数据学习效应的第二步。


    数据学习效应 = 数据规模经济 + 数据处理能力 + 数据网络效应


    处理数据并从一个精益人工智能产品转变为一个完整的人工智能优先产品，需要一个人工智能优先团队。本章将讨论聘用什么人、在哪里找到他们、如何支持他们、最有效的管理类型是什么，以及如何围绕他们构建组织等。考虑到人工智能的潜力，这类人才可谓供不应求，你需要拥有一双慧眼才能在别人忽略的地方找到他们，比如在顶级计算机科学院校殿堂之外，或者在其他众多领域内。接下来的挑战就是构建一个人工智能优先的组织，这一点我们最后再讨论。这需要在整个组织中部署能够构建人工智能的人员，在不同学科之间传播知识。


    本章的重点是如何搭建数据处理和模型构建团队，包括构建工作所需的不同任务、工具和训练等。这本书不是教工程师如何建立模型，而是教企业管理者如何取胜。为此，我们建议在你的组织中配置最佳的实践项目让人工智能优先团队的成员们发挥作用，从而得到良好的管理、资源赋能和认可。


    ## 聘用什么人？


    不同的技术要求不同的能力，人工智能优先公司使用的技术堆栈与软件公司使用的不同。人工智能优先公司使用高容量数据基础设施、高速查询引擎、高并发分析管道、计算密集型可视化产品，以及机器学习模型。他们构建界面，显示环境预测，并收集反馈。管理这项技术所需的能力来自数据基础设施工程师、数据工程师和机器学习研究人员等。人工智能优先公司最终可能需要建设一个团队，其中包含很多这样的人。


    他们可能需要具备下列能力。


    - **数据分析师：** 设置仪表盘、可视化数据，以及解释模型输出。

    - **数据科学家：** 安排并实施实验。

    - **数据工程师：** 做数据清洗、创建自动化数据管理工具、维护数据目录、整合数据资产、整合新数据源、维护数据管道，以及建立与外部数据源的链接。

    - **机器学习工程师：** 实施、培训、监控和维修机器学习模型。

    - **数据产品经理：** 将模型的数据需求与产品设计师的可用性意图和客户的偏好结合起来，以便优先考虑收集专有数据的产品功能。

    - **数据基础架构工程师：** 选择正确的数据库、设置数据库、在数据库之间移动数据、管理基础设施成本等。

    - **机器学习研究员：** 设计并运行实验。

    - **软件工程师：** 编写通过用户界面、应用程序编程接口（API）或其他媒介提供预测的软件。

    - **设计师：** 设计界面，包括从客户那里获取反馈数据的任何互动元素。


    每个特定数据和机器学习的角色，往往由教育背景与传统软件工程师稍有不同的人担任。


    - **数据分析师：** 工商管理硕士及以上或者统计学、计量经济学、经济学、数学和其他学科的学士及以上。

    - **数据科学家：** 在统计学、数学、物理学方面具有高级水平的人员。

    - **数据工程师：** 计算机科学专门研究数据库的人员。

    - **机器学习工程师：** 计算机科学研究和机器学习、数学或物理硕士研究生及以上。

    - **数据产品经理：** 软件产品管理和设计管理或项目管理人员。

    - **数据基础设施工程师：** 高级计算机科学专门从事分布式系统研究的人员。

    - **机器学习研究员：** 机器学习、数学、物理，或计算神经科学的硕士研究生及以上。


    ## 什么时候招聘？


    仔细排列员工招聘顺序，有助于公司提升其对数据战略的资本投入、汲取经验教训的能力，以及对人工智能优先的文化进行管理。


    以下的招聘顺序是基于没有任何数据科学能力的假设，并且更适用于较小而非较大的初始投资。一些公司可能已经拥有一些能力或者范围很广的项目，需要更大规模的初始投资；而人工智能优先公司有时会需要聘用一个完整的团队。


    - **数据分析师：** 第一，因为改进决策的业务需求决定了预测建模项目的优先级。

    - **数据科学家：** 第二，尝试使用统计和机器学习方法进行预测，为支持对特定数据源和模型类型的进一步投资提供初始证据。

    - **数据工程师：** 第三，因为获取和处理数据要先于构建模型。

    - **机器学习工程师：** 第四，因为构建一个可以在现实世界中工作的模型，需要稳健建模和与现有软件的集成。

    - **数据产品经理：** 第五，因为设计一个产品以获得对模型输出的反馈，有助于改进并积累专有的反馈数据。

    - **数据基础设施工程师：** 第六，因为扩展工作模型需要管理大量数据、快速处理数据，并确保质量。

    - **机器学习研究员：** 第七，因为找到边缘案例的解决方案需要超越现有的机器学习框架，从而推动最新技术的发展。


    最后一点：根据产品、团队和系统的不同，外包对于其中一些角色来说是一种可行的方法。独立的分析工作以及附带的数据集，可以外包给作为独立承包商的个人数据分析师或科学家。当要做的分析和要回答的问题非常清楚，以及找到这些答案的数据只包含在几个数据库中的时候，这种方法非常有效。聘请顾问来建立数据管道、做出合理的数据基础设施选择、运行数据存储系统，也可以使用外包方法。关于外包数据基础设施工程的决定，取决于外包公司能够使用的数据和计算的基础设施。一些云计算基础设施公司提供高自动化、高质量的数据基础设施监控和修复服务，这些都是他们的核心产品。


    机器学习的核心工作（模型更新）很难外包，因为模型往往需要不断调整、训练和监控。数据产品经理需要与客户和用户进行持续不断的互动，以了解如何最好地从他们那里收集数据，并以最方便可用的方式向他们呈现预测，这使得模型更新成为最难外包的工作之一。同样难外包的还有机器学习研究人员的工作，要想找到新颖的、基于机器学习的问题解决方案，往往需要很长时间，因为他们需要广泛探索内部数据、使用昂贵的计算机、完全控制实验，还要考虑团队中的机器学习工程师将如何运行生成的模型。换句话说，与一组固定的人——比如，在大学实验室里——进行长期合作，可以很好地解决他们特定专业或研究领域的问题，而且通常还可以得到机构的联合资助。简而言之，一个角色（流程）是否适合外包，取决于他是否需要与客户及企业持续互动。表
    4-1 对聘用什么人以及何时招聘进行了总结。


