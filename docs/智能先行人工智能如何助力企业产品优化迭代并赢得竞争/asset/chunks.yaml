- raw: "**数据管理员：**负责确保数据存储符合标准的人。\n\n**数据基础架构工程师：**选择正确的数据库、建立数据库、在数据库之间移动数据、管理基础设施成本的人。\n\
    \n**数据科学家：**构建和运行数据科学实验的人。\n\n**数据漂移：**当预测所依据的分布发生变化，不再代表观察到的现实时；或者当预测所依据的数据发生变化，导致其中一些数据无法获得或者无法正确形成。\n\
    \n**数据网络：**一组本来不相关的实体而非单个实体构建的数据组。\n\n**数据网络效应：**在现有数据集合中添加新数据点所带来的边际效益的增加；边际效益由信息价值定义。\n\
    \n**数据学习回路：**从智能系统中持续生成专有数据，为下一代智能系统提供基础。\n\n**数据学习效应：**信息的自动复合。\n\n**随机森林：**用于分析数据的方法，该方法构造多个决策树，并输出所有对象中最常出现的对象类别，或所有决策树的平均预测。\n\
    \n**损失：**模型在做出特定预测时正确与否的量度。\n\n**损失函数：**确定模型输出错误程度的数学函数。\n\n**梯度提升树：**一种根据损失函数分阶段生成决策树的方法。\n\
    \n**提取、转换和加载：**将数据从一个地方迁移到另一个地方的三个主要步骤。\n\n**统计过程控制：**基于统计方法的质量控制过程。\n\n**投资回报率：**通过使用资产的回报除以对该资产的投资来计算。\n\
    \n**下凸曲线回报：**回报因产品使用次数增加而增加。\n\n**图表：**由节点和边组成的数学结构，通常用于建模对象之间的交互。\n\n**网络爬虫：**在互联网上系统地查询网页或其他文件的程序；去掉那些页面上不必要的内容，比如格式；获取重要数据，将其放入标准文档格式（例如JSON），存入一个私有数据存储库。\n\
    \n**网络效应：**将新节点添加到现有节点集合所带来的边际收益增加；此边际收益以集合对用户的效用定义。\n\n**无监督机器学习：**从没有输出的输入中学习的机器学习。\n\
    \n**系统集成商：**安装新软件系统以便与客户现有系统一起运行的实体。\n\n**下一级数据网络效应：**将新数据添加到现有数据集合所带来的复合边际收益；此边际收益由根据该数据计算的模型自动创建数据的速率定义。\n\
    \n**先行者：**先于其他公司进入某个市场、收集稀缺资产、建立技术领先地位，并在市场中增加转换成本的公司。\n\n**现有公司：**现有市场领导者。\n\n\
    **消费者应用程序：**主要由个人（而非企业）使用的软件应用程序。\n\n**信息：**能消除多少随机的、不确定性的东西。\n\n**学习效应：**知识积累带来经济效益的过程。\n\
    \n**遗留应用程序：**已在使用的应用程序。\n\n**应用程序编程接口：**一组函数，能够让应用程序彼此沟通，以使用某个特征或者获取数据；实际上，它是让软件互相通信的结构化方式。\n\
    \n**用户界面：**软件中的一组对象，客户可以用来启动该软件中的某种功能。\n\n**预测可用性阈值：**预测对客户产生作用的那个点。\n\n**泽字节：**10^(21)字节。\n\
    \n**支持向量机：**按类别对新数据点进行分类的监督学习模型。\n\n**直方图：**由矩形组成的图表，其面积与变量的频率成正比，横轴表示数据类型。\n\n\
    **智能应用程序：**对数据运行机器学习算法以进行预测或决策的应用程序。\n\n**专有信息：**属于特定实体且不属于公共领域的信息。\n\n**纵向产品：**仅与特定行业的用户相关的软件产品。\n\
    \n**纵向整合：**一家公司中多个生产阶段（或价值链上的点）的组合，通常由不同的公司运营。\n\n**最小可行性产品：**保证产品可用的产品功能的最小集合。\n\
    \n* * *\n\n1.  1.  一个2010年创立于墨尔本，主要为开发商和数据科学家提供举办机器学习竞赛、托管数据库、编写和分享代码的平台。——编者注\n\
