    # Chapter 1: Data Learning Effects


    When economies of scale are high and customer demand for variety is also high,
    the market tends toward a single technology. Economies of scale arise when costs
    decrease on a marginal basis as volume increases. Variety is the customer demand
    for many different features or products. Refer to the bottom-right quadrant of
    Table 1-2, Schematic of Economies of Scale: customers shopping online need variety,
    and the larger the warehouse, the lower the operating cost; therefore, Amazon
    dominates e-commerce. Refer to the bottom-left quadrant of Table 1-2: we want
    our news sources to be diverse, but in the traditional media era, journalists
    could only write so many articles per day—they couldn''t scale—so there were only
    a few large newspapers.


    Table 1-2 Schematic of Economies of Scale


    ![](img/image_011.jpg)


    In a market, if only one company has accumulated the most resources (such as investment,
    ecosystem, etc.), then that company is the only one that can invest in producing
    a variety of products for that market''s customers. The company with the largest
    scale can offer the most variety of products, and after this tipping point, it
    will dominate the entire market.


    Data learning effects have very high data economies of scale because they require
    large amounts of data to get started. Data learning effects can make all sorts
    of predictions because models continuously generate different predictions based
    on feedback data. Furthermore, customers of AI-first products inherently have
    a high demand for variety because every customer needs a model that can make predictions
    specific to their business. Therefore, data learning effects tend toward winner-take-all
    markets.


    ## Data Learning Effects Make Products More Useful


    Data learning effects often work behind the scenes rather than front and center.
    Some products demonstrate their utility in the foreground; others demonstrate
    it in the background. Foreground demonstration means the increase in utility is
    obvious to the end user: they see that adding data generates more accurate predictions
    for them or triggers new insights immediately. For example, adding their own sales
    data lets them immediately see their sales performance compared to competitors.
    Background utility demonstration means the utility increase is not obvious to
    the user. Users don''t see that adding data generates better predictions for them,
    nor do they see any information they didn''t already have.


    Through the use of data learning effects, Square Capital became a company that
    performs well in the foreground. The company issues loans to its point-of-sale
    (POS) system customers. Merchants, such as restaurant owners, simply add data
    to their POS system and can almost instantly obtain loans matching their revenue
    situation. Square Capital can offer loans to them by comparing the data uploaded
    by merchants with that of other merchants who previously received loans from Square
    Capital. The user (merchant) sees the immediate benefit of adding data (getting
    a loan) because the product uses data learning effects to run a loan prediction
    system that provides a product: a lending rate predicted based on the merchant''s
    ability to repay. Without adding data, you can''t get a loan; you qualify for
    a loan *because* your data can be compared with other data to generate a prediction.
    This product performs relatively well in the foreground based on data learning
    effects.


    A product that uses data learning effects and performs better in the background
    is Cloudflare, a product focused on website performance optimization and security
    management. Customers—such as news sites—can add Cloudflare''s data collection
    mechanism to their networks; this mechanism serves page requests to legitimate
    visitors while blocking requests from bad actors. Cloudflare provides this protection
    by distinguishing which requests are detrimental to other customers. "Detrimental"
    means a request attempts to flood the site with traffic or exploit other security
    vulnerabilities to shut it down (a Denial of Service, or DoS attack). After adding
    the Cloudflare data collection mechanism, the customer (site owner) doesn''t immediately
    see an alert rejecting a particularly dangerous request, but the product continuously
    learns and alerts on potential malicious requests. If you don''t allow Cloudflare
    to see your network requests, you won''t get these alerts. This product gets better
    in the background based on data learning effects.


    ## Data Learning Effects Compound Faster Than Network Effects


    When data learning effects acquire data from customers, they generate a faster
    compounding effect. The fuel for network effects is data; customers supply fuel
    to the system, ultimately benefiting themselves.


    Products with entry-level data network effects typically acquire data customers,
    sometimes called a "give-get" model. Every customer provides data that makes the
    product more useful, attracting more customers. High-quality data makes the product
    better, and customers can contribute some of that data.


    Products with next-level data network effects can acquire data from customers,
    but this data is typically provided *as* customers use the product, sometimes
    called feedback data—but, crucially, this data goes into a model that transforms
    it into predictions, multiplying its value.


    For example, customers submit data every time they get a credit score; credit
    bureaus use this data to provide more accurate scores (then sold to third parties).
    This is an entry-level data network effect. A next-level data network effect might
    be a loan application where customers get a loan by allowing ongoing access to
    their spending habits. Next, the lending company can predict whether or when the
    loan will be repaid to determine the customer''s creditworthiness, and issue larger
    loans or cut off credit accordingly. The difference between these two data network
    effects lies in feedback data and prediction models.


    ## One Flywheel Drives Another


    Automating the process of collecting data and generating information is the beginning
    of the next level, where the shared brain starts comparing what it has learned
    with other things it has learned. This is the "flywheel" that pushes one network
    effect into another, more powerful one.


    Amazon did exactly this. First, it collected massive amounts of product data,
    then put that data into product listings while providing comparison tables with
    structured product information to help customers make better purchasing decisions.
    More information meant better comparison and decision-making. Subsequently, Amazon
    invested in a team to build machine learning search and recommendation systems:
    A9. This team effectively acquired product data and matched it with purchase data
    to understand which products customers wanted to buy, so Amazon could recommend
    similar products to these customers on listing pages and in search results. Collecting
    massive data was the start of the entry-level network effect: for consumers, Amazon
    used to be one of the most useful shopping sites because it had the most product
    information. Learning from this data launched the next-level network: for consumers,
    Amazon is still one of the most useful shopping sites because it offers the best
    recommendations and best search experience. The effect model of one flywheel driving
    another is shown in Figure 1-7.


    ![](img/image_012.jpg)


    Figure 1-7 Effect Model of One Flywheel Driving Another


    ## Data Learning Effects Create Cost Advantages


    Data learning effects can allow companies to automatically lower product production
    costs. Cost advantages are achieved by reducing fees or keeping fees constant
    while providing more value.


    The initial cost of building products using data learning effects is amortized
    across each new customer added. Building intelligent systems is expensive: it
    requires investment to purchase, collect, clean, and store data. Hiring data scientists
    and machine learning engineers also costs a lot. Typically, a company must spend
    a lot of money before customers see the value of predictions. However, once customers
    start using these products and providing data, costs decrease. They may label
    or store their own data, reconfigure model functionality through interfaces, and
    effectively bear the cost of collecting and processing data through feedback systems,
    lowering production and maintenance costs, thereby creating a cost advantage.


    Data learning effects make products more valuable. More data enables customers
    to make more accurate predictions and better decisions. Improvements in base model
    performance create value for customers, meaning they get a higher return on their
    investment. The denominator (price) stays the same while value rises.


    ![](img/image_013.jpg)


    By the way, cost advantages may help build data learning effects quickly. Cost
    advantage is a strategy to attract more customers, who in turn generate more data.
    To accumulate the critical mass of data needed to improve AI accuracy to the point
    where it is useful to customers, this strategy may be pushed to the extreme for
    a period regardless of immediate benefit. Data learning effects creating cost
    advantages is shown in Figure 1-8.


    ![](img/image_014.jpg)


    Figure 1-8 Data Learning Effects Create Cost Advantages


    ## Data Learning Effects and Price Optimization


    Data learning effects enable more accurate pricing. Reasonably priced products
    sell more volume; more customers collect more data, fueling data learning effects.
    Cost advantage differs from price optimization; better pricing helps propel data
    learning effects.


    Pricing is an information game, won by accurately calculating how much someone
    will pay for something. Prediction systems are used for pricing experiments to
    generate test prices. One way to run pricing experiments is to pick prices based
    on heuristics, guesses, or other factors; another is to use data from previous
    experiments to predict what prices might be accepted. The second method is more
    likely to find the optimal price.


    E-commerce sites often engage in personalized pricing. A price one shopper sees
    for a product is often different from what another shopper sees on the same site,
    or the same product might show a different price on a shopper''s phone versus
    their laptop. This is because AI constantly runs experiments to determine how
    much a customer might pay for an item based on who they are (whether logged into
    a profile containing past shopping and demographic data), where they live, what
    they just clicked, etc. Sophisticated shopping sites use hundreds of data points
    per person to price products, from customer preference datasets to billions of
    data points across different demographics. These sites often run promotions that
    may lose money—selling products below cost—but this ultimately generates useful
    data about customer willingness to pay.


    A manual personalization process should include observation, using observations
    to determine the next price for an experiment, then running the next experiment,
    and more observations, and so on. An automated personalization process might use
    machine learning by feeding data into a system that generates a price to test
    based on the gradient of the curve it believes leads to the optimal price.


    Airlines developed some of the earliest price optimization systems, often called
    yield management systems, which price each seat based on various variables: number
    of seats on the plane, cost to fly the plane on a given route, seat location,
    expected demand at a specific time of year, etc. These systems relied on linear
    optimization mathematical concepts, which are the basis for some machine learning
    systems. Today, these systems price seats and change prices frequently, distributing
    those prices to countless places where tickets can be bought.


    There are also examples of predictive pricing for software products sold to businesses.
    The challenge is that there is usually less data on how much a business customer
    will pay for a product, not only because they make large purchasing decisions
    less frequently, but also because their behavior when making these decisions is
    not as easily observed as consumers browsing shopping sites.


    If profits are reinvested into data learning effects, better pricing results,
    which brings more profit while improving data learning effects.


    - Better pricing generates profits, funding ML R&D.

    - Better pricing attracts customers, yielding more data (at no cost), creating
    more profits, increasing R&D investment.

    - Better pricing means less sales and marketing spend, creating more profits,
    increasing R&D investment.


    ## Limitations of Data Learning Effects


    Network effects have limitations; people have questioned the assumption that utility
    increases as the network scales. Sometimes these limits are external. For example,
    when a network-covering product achieves monopoly status in the market, governments
    take regulatory action against the network owner. Sometimes limits are internal.
    For instance, the technology serving the network product crashes at a certain
    scale. Sometimes, products generating network effects don''t become more useful
    beyond a certain network size. For example, your 510th friend on Facebook isn''t
    necessarily better than your 50th; once the network grows to a certain size, you
    stop interacting with them or the product.


    Data learning effects face similar limitations. Sometimes these are external,
    e.g., governments taking regulatory action against data owners to break their
    market monopoly. Sometimes limits are internal. For example, data becomes too
    expensive to store and manage. Adding data points increases the cost of data extraction,
    transformation, preparation, cleaning, loading, and storage, and can even lower
    the return on data scale. For example, adding more data about each customer''s
    preferences to a Customer Relationship Management (CRM) system requires more granular
    labels to categorize data meaningfully. Adding data can also increase the number
    of output dimensions required—in other words, what the prediction must display.
    Sometimes, products generating network effects have no marginal utility as information
    increases. For example, the 300th review of a coffee shop on Google Maps or Yelp
    isn''t necessarily more useful than the 3rd. The aggregate score might be more
    reliable, but no one reads the 300th review. More data is not always better.


    Data learning effects have limitations in acquiring new data, which increases
    product manufacturing costs and fails to generate new information. The value of
    acquiring more data must be considered from both technical and practical perspectives:
    the additional data must make the model more accurate, and that higher accuracy
    must be useful to the customer.


    ## Chapter Conclusion: What Now?


    We have the right vocabulary to describe how companies collectively learn from
    data rapidly. These companies have made leapfrog advances in several areas: from
    verbal to digital information distribution, from manual to automated information
    sharing, from learning in their own brains to learning across brains, from learning
    on wetware to learning on hardware, from learning on a single node to learning
    across nodes in a network. These companies are all AI-first companies.


    I find that network effects happen differently in AI-first companies than in social
    networks: they happen because one user has a relationship with another user, and
    that relationship continuously escalates. Data network effects only appear after
    the hard work of collecting and processing data. This sometimes takes years, not
    just by making the right technical choices. Having exceptional talent is crucial
    because they know what the data is, where it is, and why it relates to the specific
    problem being solved. I have seen companies learn powerful things through this
    effort. When data learning effects kick in, these companies not only attract more
    customers but also acquire proprietary information about the relevant business,
    which helps find ways to automate core processes. This automation makes the customer''s
    business more profitable while making the AI-first product more desirable.


    The path below depicts the learning journey of an AI-first company. First, learn
    how to acquire and evaluate data; second, learn how to build an AI team to process
    that data; third, learn how to build models that use that data to improve the
    product. In this way, we can gain a competitive advantage in data learning effects,
    achieving a significant degree of automation. The next question is how to utilize
    the costs saved by automation, which we will discuss in the final chapter of this
    book, "Advantage Aggregation." The Data Learning Effect Journey is shown in Figure
    1-9.


    ![](img/image_015.jpg)


    Figure 1-9 Data Learning Effect Journey


    ## Key Takeaways


    - **Accumulating information from automatically synthesized data is a data learning
    effect.** The steps to build a data learning effect are: ① Capture a critical
    mass of data; ② Develop the capability to turn data into information; ③ Feed this
    information into a computer to run the data and learn from new data points.

    - **Combined with data processing capabilities and data network effects, data
    can produce marginal output.** Data learning effects clarify the value chain around
    data.

    - **Data learning effects are unique.** They start with a supply-side competitive
    advantage, trigger a demand-side competitive advantage, and combine resource access
    privileges with the ability to transform that resource into a valuable asset.

    - **Data network effects differ from ordinary network effects.** The difference
    between network effects and data networks lies in what is added to the network.
    With network effects, the connections (edges) between network nodes function and
    communicate. With data network effects, edges become informative and computable.

    - **Data scale effects are more than just data economies of scale.** More data
    doesn''t automatically create data network effects but may lead to scale effects
    where the cost of processing or acquiring data decreases as scale increases.

    - **There are two types of data network effects: entry-level and next-level.**
    Entry-level sees positive effects from adding data; at the next level, adding
    data *plus* AI creates positive effects. The first is easier to build, but the
    second grows faster.

    - **Next-level data network effects generate free data.** Entry-level effects
    require data from outside the network. Next-level effects generate data from inside
    the network (feedback data), producing data value with a higher compounding effect.

    - **Better forms of intelligence come from self-generating data networks.** Entry-level
    data network effects improve our own intelligence. Next-level data network effects
    accelerate our learning speed.

    - **With data learning effects, the winner can take all.** AI-first products have
    very high data economies of scale, and customer demand for variety is also high;
    therefore, these products can dominate an industry after a tipping point.

    - **Data learning effects make products cheaper.** Data learning effects achieve
    cost advantages by lowering the cost of acquiring and processing data while providing
    more value to customers.

    - **Data learning effects make product pricing easier.** Build an independent
    intelligent system to run price experiments across different customer segments
    and optimize pricing.

    - **Data learning effects have limitations.** They are constrained by surrounding
    technology scale, data storage costs, lack of marginal utility for customers,
    and regulatory measures.


    # Chapter 2: Lean AI


    Let''s pick a shortcut to building AI: narrow the scope of current work before
    building every component of a data learning effect. This chapter explores how
    to start building a project using existing resources; subsequent chapters will
    break down each component of the data learning effect: acquiring data, building
    a team to process data, and creating models that generate data network effects.


    Initially, your customers might not need AI; some statistical analysis might suffice.
    So we adopt a new term to describe the Lean AI approach and show how it differs
    from the vocabulary used to talk about the previous generation of software and
    startups. Accuracy is the performance of an AI-first product, and prediction *is*
    the product.


    The following chapters make the Lean AI system a reality by explaining how to
    acquire data, build AI models, create a self-reinforcing loop, and how to profit
    from AI.


    Remember: Anyone at any company can start building AI systems now. Are you ready?


    ## What Does the Customer Need?


    Customers don''t necessarily say what they need, as automaker Henry Ford said:
    "If I had asked people what they wanted, they would have said faster horses."
    Product design existed long before AI. This section outlines principles for designing
    products that meet customer needs (see Table 2-1).


    Table 2-1 Principles for Designing Products That Meet Customer Needs


    ![](img/image_016.jpg)


    Understanding customer needs can be inductive: ask questions, listen, infer what
    is needed, then build it. Entrepreneurs without much experience in an industry
    often inductively determine customer needs by asking many questions before starting
    up. The focus of the inductive process is to get information from a group of potential
    customers, discover a needs trend, and propose a set of features to meet that
    need. This usually includes surveys, proposing a design, testing with different
    potential customer groups, and iterating on the design. This is a centrifugal
    process: analyze large amounts of data about how people shop (supply) before determining
    what customers need (demand). Many consumer products are designed this way because
    the potential customer base is huge.


    Figuring out what to offer customers can be deductive. Contemporary entrepreneurs
    often deduce what to offer by observing the past and adding new products. The
    focus of the deductive process is to get information from a single customer to
    judge supply trends and formulate a product feature list. This usually includes
    calling customers, proposing designs, holding many meetings to refine designs,
    and gathering feedback after product launch. This is a centripetal process: gradually
    narrowing product specifications to meet customer needs. Many B2B products are
    designed this way because the number of potential customers is small, making it
    possible to talk to all of them.


    The next question is: Does the prototype need an AI boost to perform well? To
    answer this, you must first understand: Does the customer need to generate an
    opinion? Do they need to make a prediction? And do they need to automate a process?


    ## Does the Customer Need AI?


    The promise of AI is to help customers make better, faster decisions. How much
    AI a customer needs depends on the type of decisions they make and the data they
    base them on. Here is a way to categorize the decisions and data at hand to determine
    whether the customer needs AI or analytics. Whatever they need, the first step
    is to put the decision type and data into a decision tree. The Lean AI Decision
    Tree is shown in Figure 2-1.


    ![](img/image_017.jpg)


    Figure 2-1 Lean AI Decision Tree


    Traverse this decision tree and make choices sequentially to measure whether AI
    or analytics is chosen more often. If analytics is chosen more, then the customer
    likely needs data functionality, such as recording, cleaning, and manipulation—in
    other words, mathematical operations like calculating averages—but this is definitely
    not AI. If AI is chosen more, then the customer likely needs AI functionality,
    such as classification, segmentation, and manipulation of data.


