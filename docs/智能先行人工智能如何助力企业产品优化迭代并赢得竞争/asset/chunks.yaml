    ## 损失


    损失是模型在做出特定预测时正确与否的量度。完美的预测，损失为零，因此，这是一个程度的问题。测量损失在机器学习中很有用，因为并不是所有的结果都是二元的，而改进模型的过程就是要逐渐减少每次迭代时的损失。衡量损失取决于一个人是在查看整个数据集还是其中的一部分，是期望大量的异常值还是相当均匀的分布，以及许多其他因素。计算所有损失的平方，看看损失是否回归到平均值，是否需要进行改变。绘制不同参数权重下的损失图，查看是否存在损失最小化的点，并在该点固定权重。为了找到这个点，需要求出这条曲线的导数，看看它是越来越近（下降曲线，呈负梯度），还是越来越远（上升曲线，呈正梯度），以最终了解参数权重如何使我们达到最小的损失水平。这叫作梯度下降（如图7-10所示）。


    ![](EPUB/images/image_074.jpg)


    图7-10 梯度下降


    与模型构建者合作更好地构建模型，可能需要深入到这个层次，但理解它通常只需要基本的微积分知识。


    ## 人工验收


    人工智能优先产品采用明确的方式让客户对机器决策提供反馈——含蓄地接受或拒绝机器做决策时使用的预测。例如，可以从照片中判断出一款产品造成了危险的皮肤损伤，使用该产品的皮肤科医生可以接受也可以不接受这个判断。这可能是衡量预测准确度的最高单一标准，因为给出反馈的人类用户可能运用了他们的直觉，以及所有现实经验和领域知识。


    ## 使用指数


    有一条基本的原则我们不能忘记：判断客户是否从产品中获得价值的最简单方法是看他们使用了多少产品。产品的使用指数与产品相关，理想情况下使用指数衡量的是客户为从产品中获取价值而采取的核心动作，例如点击搜索结果（不只是执行搜索）或购买产品（不只是点击目录）。对于人工智能优先产品而言，使用指数还需要衡量为基础模型收集反馈数据的动作。产品经理可以查看产品，记录客户反馈数据的每一点——显性的或隐性的，输入的或生成的——然后，围绕这些点测量产品的使用情况，以找出提高使用率的方法，从而产生额外的反馈数据。一些用户可能会比另一些用户生成的反馈数据多——他们是模型的动力源，亦为产品的超级用户——而有些用户可能会产生更高质量的反馈数据——他们是数据学习效应世界的超级老师。搞清楚他们是谁，和他们交流一下，为他们构建更多功能可能会获得更高质量的反馈数据。


    # 机器赚钱


    企业最终必须通过扭亏为盈，在没有外部资金来源的情况下生存发展。关于机器学习，我们已经谈论了很多，但关于如何利用机器学习模型来产生利润却少有涉及。本节提供了赢利能力指标，以及可以提高这些指标的杠杆。


    数据学习回路带来利润，并为人工智能优先供应商创造投资机会：更好的预测可以带来更多的自动化，从而降低运营成本，这意味着可以有更多的资金投入到研发（模型和数据）中，从而产生更好的预测，如此循环。最终，这项业务会产生非常高的毛利润，涵盖所有的运营成本，并实现盈利。图7-11展示了供应商的数据学习回路。


    ![](EPUB/images/image_075.jpg)


    图7-11 供应商的数据学习回路


    我们还可从客户所获利益的角度来思考这个问题：更高的预测精度可以实现更高的自动化，吸引更多客户或鼓励现有客户更多地使用该产品，从而产生更多的数据和更好的预测，等等。


    ## 纵向与横向


    “纵向”人工智能优先产品比“横向”产品面临更多的赢利挑战。纵向产品将机器学习应用于商业或工业数据，以生成对其客户有价值的预测。我给你举个例子：一种纵向产品，它从生产线上收集机器的数据，并使用这些数据来训练一个模型，预测生产线何时可能出现故障，从而帮助客户避免这些故障。另一个例子是从大量产品图像中收集数据，并使用这些数据来训练一个模型，以识别仓库或商店中的这些产品，从而帮助客户避免缺货造成的高昂代价。横向产品包括提供给不同纵向领域的机器学习工程师和数据科学家的工具。图7-12展示了客户的数据学习回路。


    ![](EPUB/images/image_076.jpg)


    图7-12 客户的数据学习回路


    这两类业务的经济情况截然不同，纵向业务需要为客户解决特殊流程问题，而横向业务需要解决一般流程问题。纵向业务需要围绕客户问题进行纵向整合，找出解决整个问题需要的所有东西。纵向业务可能需要与客户拥有的特定数据源进行集成，为他们构建一个输出预测的工作流产品，为公司的特定用户设置某些功能。横向业务需要推广他们的解决方案，使其适用于在不同纵向行业工作的人。横向业务可能涉及许多不同的数据源、工作流产品和通信工具的集成。生产人工智能优先产品的公司往往面临较少的盈利挑战，因为交付这些产品的边际成本很低，因此，这类企业的经济状况往往与传统软件公司相似。


    对于人工智能优先公司来说，这个框架与传统软件公司的框架没有什么不同。纵向的、传统的软件企业需要为其所在行业的人构建各种软件集成、功能和流程。例如，`Veeva
    Systems`是一家世界级的纵向软件公司，为医疗专业人员使用的多种产品集成，提供临床数据管理和工作流程等功能，为客户提供更高效的监管服务。横向的传统软件企业需要为跨行业的企业构建软件集成、功能和流程。一流的横向软件公司`Salesforce`拥有一个完整的云平台，不同的供应商可以在这里进行集成，形成一个应用程序市场，它提供行业所需功能，以及灵活的应用程序编程接口，使得客户跨应用程序构建自己的工作流。


