    ## 从小处着手：数据


    实验阶段不是构建“粗”数据管道而是追求精益的时候，因此，有必要在这里快速转换一下话题，讨论如何获得足够的数据来构建人工智能。


    我们希望，这意味着数据库中只有一组数据，并且通过一次查询便可以检索到。最好的起点应该是客户首先猜测哪些数据可能具有预测性，因为客户比任何人都更了解自己的领域，并且可能试图使用其他方式解决手头的问题。


    接下来是数据准备，如果运气好的话，在这个阶段，从单个数据源获取的数据将是最少的。下一步是使用相同的度量单位和文件类型，对数据进行格式化处理。做数据清洗以填充缺失的值、删除重复项和错误的值，通常是必要的，但这一步的工作量同样因为数据来自单一数据源而被最小化。最后一步是确保模型有效地计算这些数据。大多数情况下，这不是小规模实验考虑的主要因素。以下不是现阶段要做的事情。


    - **不要贴太多标签。**从一开始就确定客户拥有哪些可能具有预测性的数据，可以省去耗时且成本高昂的数据标注任务。

    - **不要从多个来源获取数据。**这样做需要获得额外的授权、构建更多的集成，还需要更多的规划。相反地，应该从一个数据库中选择一个数据集，运行一个实验，然后，只有当该数据集没有任何预测能力时，再获取下一个。

    - **不要使用敏感数据。**匿名数据代价高昂，可能会扰乱结果。但是，主要还是避免为数据泄露担负责任。

    - **不要建立单独的数据库。**相反地，只需将数据下载到安全且延迟较低的地方，例如本地计算机即可。

    - **不要建立数据平台。**确定整个团队用于探索和管理数据的所有工具。需求很可能会改变，因此，建议将数据平台建设推迟到项目开始之后进行。


    数据平台的建设也可以围绕着“数据湖”的构建展开，“数据湖”是一个通常用于描述大容量数据存储系统的术语。这也是对过度投资数据基础设施的警告。是的，大多数客户都有数据质量问题，他们的数据存储在多个数据库中，标注错误且价值缺失。然而，现在不是解决这个问题的时候。相反，现在是证明作为一家能够建立真正有效的人工智能公司的价值的时候。然后，当人工智能需要使用来自整个组织的数据时，就可以开始构建数据湖，采用元数据管理流程，测试`ETL`（提取、转换和加载）产品，这些产品可以将一些数据处理步骤自动化，手动（重新）标注数据，聘用数据管理员以确保遵守数据标注标准，或者实施大型咨询公司和数据产品供应商倡导的任意数量的最佳实践。而第一项工作就是提供一个有用的预测。


    ## 从小处着手：销售


    从一个小且定义良好的项目开始，可以更容易地与客户建立信任，访问其数据，了解他们与遗留数据工具的交互方式。


    从小处着手可以提高买家的参与度，因为这意味着一次只与一个利益相关者合作，回答他最紧迫的问题。倾听客户的问题并提供答案，可以促进彼此之间的信任。当人们对模型能力的期望——通常根据模型的准确度来衡量——得到满足时，参与度就会增加，而满足这种期望的最好方法，就是解决小而容易处理的问题。然而，当数据隐私和安全问题出现时，参与度会受到抑制，但从单个数据集开始可以防止出现此类问题。


    从小处着手，解决一个数据集中的一个数据问题，可以减少处理来自多个数据库的不良数据。从一个算法开始可以减少解决方案中任何一部分出现问题的可能性，因为它只由一个部分组成。从一个算法开始还可以让部署变得相对简单，因为遗留系统上只运行了这一种算法，它可以是仪表盘上的视图、过程结束时的运算，或者附加在一组正在生成的规则末尾的规则。


    从小处着手意味着以一种便于团队使用的方式向团队提供预测。对于那些以前没有接触过人工智能的人来说，这一点尤其重要。他们经常想弄清楚预测背后的“理由”，从小处着手让解释“理由”变得更加容易。为了定制消费，需要询问客户希望如何获得答案，是想通过报告、电子邮件、电子表格，还是仪表盘。


    从小处着手，只需回答一个问题，针对一组利益相关者，使用一种方法，就能让销售、模型和产品取得成功。然后为最积极的客户选择下一个最好的问题并加以解决，从而提高他们的参与度。


    ## 概念验证


    客户经常会提出是否以及如何进行概念验证的问题，因为与顾问、初创企业或者成熟的软件供应商合作需要资源，而这些资源应该能够更好地分配到客户现有的业务上。这就是为什么大公司更喜欢从一个可控项目开始，进行概念验证的原因。


    人工智能优先产品往往需要进行概念验证，因为产品价值主张的核心是做出准确的预测，潜在客户需要知道模型在他们的数据和环境中运行时的准确度。这与标准软件产品不同，标准软件产品的价值主张基于一组易于演示且供应商之间差异不大的功能。


    要想使概念验证获得成功，就需要围绕准确度、时间表和成本设定明确的期望。以下是好的概念验证所需的简单要素。


    - **准确度：**基于对技术可行性的诚实评估，为预测设定基准。例如，写这段文字的时候，实现完全自动驾驶的汽车还没有制造出来，但用于探测坑洞和提醒维修人员的传感器已经表现得相当好。设定基准的外在方式是基于客户通过自己的努力已经达到的准确度。

    - **企业目标：**这是最接近客户赚钱所需的指标。一个企业通常对自己的目标有很好的了解，但人工智能如何帮助其实现这一目标，有时他们需要一些帮助，以便找到合适的方法，然后将概念验证期间要达到的目标与后续实用阶段要达到的目标区分开来。

    - **数据：**列出所需的数据源，并确定它们是否可用。通常，80%构建人工智能的时间用于准备数据，另外20%用于创建模型。

    - **依赖性：**记录对遗留系统的依赖性，以缓解问题。

    - **团队：**限制团队成员，在利益相关者参与度与完成工作之间取得平衡。

    - **时间表：**评估要构建什么，需要多长时间，以及达到精度基准需要多长时间。帮助客户了解，达到80%的准确率可能只需要20%的时间，但完成剩下的20%可能会消耗80%的时间。

    - **成本：**在搞清楚所需的时间、找好外部顾问、对数据进行标注以及计算好工程时间之后，算出总成本。


    完成概念验证之后，你需要制订一个计划，寻找达到更高的精确度的方法，并基于这种准确度重新设定客户期望值。


    ## 精益人工智能


    上述过程即所谓的精益人工智能，其目的在于构建一个小而全的人工智能，来解决某个特定问题。该过程不仅可以帮助新公司，也可以帮助老公司，将其转化成人工智能优先公司。


    建立精益初创企业与建立精益人工智能的目标不同。你不是想创办一家公司，而是想为现有的公司完成一个项目。你不是想把产品推向市场，而是想让你的模型足够准确。你不是想让产品具有出色的功能，而是想让你的模型功能出类拔萃。结果是预测，而不是计算。客户工作流程中预测的功能和表现没有准确度和可靠性重要，表2-3说明了以上两种情况所对应的不同重要事件。


    表2-3 精益初创企业与精益人工智能的重要事件


    ![](EPUB/images/image_021.jpg)


    创办精益初创企业与构建精益人工智能不同，表2-4显示了该过程每一个步骤的差异。构建精益人工智能时，你不是在构建产品和公司，而是在生成预测和构建系统。你展示的不是样品，而是报告。反馈不是定性的（产品是否易于使用），而是定量的（预测是否足够准确）。


    表2-4 创办精益初创企业与构建精益人工智能的差异


    ![](EPUB/images/image_022.jpg)


    ### 把MVP放在一边


    精益初创企业推广了最小可行性产品（`Minimum Viable Product`，`MVP`）概念：客户需要的最基本的一套实用性产品。向客户展示和销售产品之前，需要对其功能进行定义，这样可以合理地安排生产时间。也就是说，不浪费时间去制造顾客不太可能想要的东西。


    这本书使用了预测可用性阈值（`Prediction Usability Threshold`，`PUT`）概念：计算机所做的预测开始对客户有用的那个临界点。该阈值可能正好出现在电脑所做的预测比人类的预测更好的那个点。然而，即使有时电脑的预测没有人类的准确，但它依然是有用的，因为来自计算机的预测一致性更高。记住，人工智能世界中的“预测”可能意味着分类，比如对照片中的桥梁类型进行分类。定义此阈值的原因是，向客户展示和销售预测之前，需要对构建和调整生成预测模型的时间成本进行优化。也就是说，不浪费时间获取数据和构建模型功能，因为这些功能不会使预测对客户更有用。


    对客户来说，预测可用性阈值既微妙又具体。大多数模型并非只有达到100%的准确度才有用。有时，当模型用于做出关键决策时，预测可用性阈值将非常高。弄清楚客户何时、如何以及为什么需要一个特别的预测，有助于确定预测可用性阈值。理想情况下，在该阶段，预测可用性阈值、客户投资回报率和概念验证等指标是相互关联的。


    ### 重新定义功能


    产品功能与模型功能类似。在产品开发领域，功能就是帮助用户输出计算结果的软件功能。在机器学习领域，功能就是一组数学函数，输入数据输出预测。产品的功能一定要有实用性——能够快速计算——而模型的功能一定要有预测性，或者说能够做出准确的预测。产品的功能决定了客户可以用该产品做什么。模型的功能决定了客户可以通过模型预测什么。


    功能构建需要输入数据，执行大量计算，并由经验丰富的机器学习工程师进行精确调整。数据收集、计算和聘用机器学习工程师需要花很多钱。因此，谨慎的做法是，先弄清楚客户究竟想要什么样的预测，然后确定获得预测可用性阈值所需的功能。对功能进行定义之后，就需要获取训练数据、构建可以获得预测可用性阈值的模型、在真实数据上进行测试、获取反馈数据、测量投资回报率，然后将其打包交付给客户。


    ### 选定功能


    在上述统计工作之外，构建精益人工智能还需要一个步骤：开发首批模型。通常的做法是，对一些客户的数据进行简单的运算并生成一个预测，即使这个预测准确率很低，或者低于预测可用性阈值。为这些初始模型选定功能可能涉及以下工作：


    - 与客户或其他领域专家交谈，了解因果要素；

    - 建立一个接口，当预测不合理时，顾客可以通过其否决该预测；

    - 设置回看功能，以便查看一些数据是否与其他数据相关；

    - 使用聚类法查看数据中是否存在趋势，或创建用于构建模型的较小集群；

    - 在模型之上运行一个`随机森林`算法，看看随机决策规则是否能得出合理的结论；

    - 重新调整在类似数据集上训练的模型的用途，或者尝试`迁移学习`，这是一种把一个数据集上训练的模型应用于另一个数据集的技术。


    将选定功能过程展示给客户，可能会激发反馈，为筹划下一次实验收集有用的信息。


    ## 本章结论：从多层到精益


    如果仅仅是机器学习框架就要搞几个月的时间，那么，这也许意味着你永远不可能有产品推向市场。重新思考之后，你发现了一个直截了当的方法，那就是与潜在客户交谈，将他们的话提炼成几个问题，然后采用统计学方法予以解决。搞技术框架很有趣，但我希望，本章所描述的业务框架也同样有趣，正如你冒险进入新的问题空间寻找形成全新产品和全新业务基础的解决方案那样有趣。


    图2-3包含了以精益方式构建人工智能的路径（精益人工智能流程）。底部的矩形表示与客户合作时要记住的垂直整合程度。获取足够的数据，以训练模型在现实生活中进行测试，收集反馈信息，测量投资回报率，并将模型打包成能够说服客户与你继续合作的东西。以统计数据为起点是一个安全的做法。但你的目标是建立一家人工智能优先公司，而不是一家数据科学咨询公司。通过使用精益人工智能流程来了解客户的问题，选择其中的一个问题，并提供独立的解决方案，从而建立一个人工智能优先公司。精益人工智能是试图从一个小样本数据中做出预测的过程，预测的结果将呈现给利益相关者，以了解他们期望得到的功能完备的产品是什么样的。从精益人工智能流程做起，就像在吃掉整个馅饼之前，你先替自己和顾客尝一口一样。使用精益人工智能流程交付产品，能够让你在接受更高的客户期望、更困难的建模挑战和面对更多数据之前获得快速反馈。有了精益人工智能，任何人都可以开始建立一个人工智能优先公司。精益人工智能堆栈如图2-3所示。


