    *献给那些充满好奇心的人们*


    # 绪论


    动物世界里充满了比人类感觉更敏锐的生物。我们没有猫头鹰那样的视觉，没有狗那样的嗅觉，也没有鲸那样的听觉，而我们的计算速度也不及人类自己创造出来的东西——计算机，但我们却擅长通过感官收集大量信息，并同步处理从而快速学习。这种快速学习便是智能。


    如今，人工智能（Artificial Intelligence，AI）可以通过收集有价值的数据，将其处理成信息，并在网络上传播，帮助我们更快地学习。创造人工智能的公司通过这种方法提高了自己的智能。这就是本书的主题：构建一个人工智能优先公司，在需要比竞争对手更快学习的时候，能够收集、处理信息，并将其传达到需要的地方。


    人工智能优先公司是第一批——现在仍然是唯一的一批——万亿美元公司，而且，它们将比以往任何时候都更明确地主导着更多的行业。


    这便是你建立人工智能优先公司的动力。


    ## 新工具


    我们喜欢制造新工具，用以突破自己的自然极限。第一台机械计算机的发明者查尔斯·巴贝奇（Charles Babbage）曾说：“把人类描述成一种制造工具的动物一点也不为过。”我们用智慧来了解事物的运作方式，然后制造工具使其运作得更好——把人类的平稳进化变成了人加机器的快速革命。


    在距今至少260万年前的石器时代，出现了第一波石器工具制作浪潮，给人类提供了体力杠杆，绳索编制的陷阱以及长矛就是很好的例子。与徒手获取食物相比，使用这些工具可以使我们超越自身的能力范围，收集到更多的食物。18世纪和19世纪的工业时代，人类制造出了愈加复杂的成套工具，用于耕田和炼钢。然而，这种体力杠杆及其规模受到我们智力的限制。


    第二波工具制作浪潮带来了智力杠杆。印刷术让信息得以传播，随后出现的计算机让我们能够收集更多的信息，并进行超出我们普通智力范围的运算。我们学会了如何传播信息，如何将其输入计算机，如何快速发送到不同地方，以及如何生成多种见解。然而，这种智力杠杆却受到我们能获得多少关于未来的信息的限制。


    人工智能引发了第三波工具制作浪潮，为我们带来了决策杠杆。这些工具赋予我们一种全新形式的智能，用以收集、处理和交流信息，从而做出更好的决策。而随着这些决策的实施，我们将能够进行更好更快地学习。


    我们来举一个有关缝纫的例子来说明一下：在第一波浪潮中，我们可以使用由多个小杠杆组成的织机以比手工编织更快的速度缝制衣物。这是体力杠杆。在第二次浪潮中，计算机将图形视觉信息转化为图案，供织机自动编织。这是信息杠杆。第三次浪潮改变了游戏规则：电脑扫描人们在社交媒体上发布的照片，了解消费者趋势，绘制新样式，并将图纸变成织布机上的图案。新款式刚刚流行，商店里马上就有成品销售，这是决策杠杆带来的时间优势。


    早期的工具为我们提供了体力和智力上的杠杆，而人工智能则提供了满足两个重要要求的决策杠杆。第一个适用于整个社会：充分利用有限的资源。第二个适用于企业：建立竞争优势。在过去，土地、劳动力和资本是用来竞争的资源，如今信息成为可以利用的资源。昨天的一流企业擅长管理土地、劳动力和资本，而明天的领导者将擅长管理信息。


    市场上有很多关于人们如何利用土地、劳动力和资本成为事业赢家的书籍。而这本书讲述的则是如何利用信息来取得事业的成功。


    ## 人工智能优先的世纪


    人工智能优先的世纪始于人工智能萌芽的1950年，并预测将于2050年左右结束，届时人工智能将充分融入所有的行业，因此，现在开始在你的行业中应用人工智能，还不算太晚。


    ### 人工智能优先的前半个世纪：1950年至2000年


    如果说前五十年，即1950年至2000年，人工智能只是在实验室里发挥作用的话，那么，下一个五十年则是它为人类、商业和社会大显身手的时候。人工智能的发展花了大半个世纪的时间才达到了现在的水平，因此，对于最近的创新，我们还是应该抱持更加宽容的态度，同时展现出将人工智能与商业战略相结合的强烈意愿。很长一段时间以来，我们一直认为人工智能就在眼前。但事实上，它才刚刚开始，我们才刚刚将实用人工智能带入现实世界。


    在过去的半个世纪里，人们一点一点地构建着人工智能，下面讲的就是他们的故事。正是这些人将人工智能带到了今天的水平，而你们将在这本书的帮助下，在下半个世纪把他们的工作推向新的高度。


    #### 理论基础


    人工智能的基本思想发端于20世纪50年代。通过人们不断地开展实验，与志同道合者一起研究方程式，一批批伟大的思想家试图为人工智能下定义。


    数学家沃伦·麦卡洛克（Warren McCulloch）和神经学家沃尔特·皮茨（Walter Pitts）写下了第一个代表我们思维活动的方程式。麦卡洛克曾混迹底特律的街头，而皮茨则曾就读美国东海岸的一所私立学校。两人都是控制论运动的创始成员：控制论是一门关于机器和生物之间交流与控制的科学。沃尔特是一个特别了不起的人，12岁时曾被英国伟大的哲学家和数学家伯特兰·罗素（Bertrand
    Russell）邀请去剑桥大学读书，因为他之前阅读了罗素撰写的被视为数学基础的三卷本《数学原理》（*Principia Mathematica*），并将其中的错误进行更正后写信寄给了他。沃尔特15岁时离家出走，去美国芝加哥大学看望罗素，从此再也没见过他的家人。


    尽管沃伦比沃尔特大24岁，但他们一起花了很多时间参加各种协会的活动，或通过像麻省理工学院（MIT）这样的机构，了解人类的思想，当然，还一起喝了很多威士忌。两个人共同建构了一种被称为阈值逻辑单元（Threshold
    Logic Unit，TLU）的重要函数模型：一种描述人脑细胞或神经元的数学模型，用于解释大脑的运算方式。这个关于我们自己的智能原子单位模型，为创造人工智能提供了起点。


    神经科学家、计算机程序员和来自不同学科的研究人员组成一个个小组，讨论我们大脑的工作原理，以及如何将其功能先呈现在纸上，然后再通过计算机程序展现出来。这些研究借鉴了逻辑学、计算科学、神经科学、通信等众多学科的概念。1956年，达特茅斯学院的一个小组创造了“人工智能”一词；康奈尔大学的一个小组发明了一种感知器算法，提高了早期算法模拟人类神经元的能力；斯坦福大学的一个小组将这些神经元连接在一起，形成了一个早期的小型人工神经网络。


    这50年时间里，人们开始考虑如何在实验室之外的地方使用人工智能，艾伦·图灵（Alan Turing）提出了一种智力测试方法，用来确定机器智能是否可以像人类一样进行对话。他的发现包括神经系统的不同部分各自能够进行一定程度的计算。


    #### 向实践过渡


    第一个十年为人工智能发展奠定了基础，但实践才刚刚开始。


    20世纪60年代，关于思维的研究发展到了感知和表达阶段。麻省理工学院、美国国防部国防高级研究计划局（DARPA）和国际商业机器公司（IBM）的研究人员，对神经元在感知环境刺激并做出反应的运动方式进行了研究，编写了计算机程序来理解自然语言、视觉和推理。大约在这个时候，计算机学会了下棋——在20世纪余下的时间里，这件事引发了人们持续的关注和痴迷。


    20世纪70年代，政府削减了对该领域的资助，因为他们认为开发通用人工智能是一个棘手的问题，可能会导致一连串的大麻烦。这与其说是一个技术问题，倒不如说是一个政治问题：该领域承诺的过多，兑现的太少。为了应对这一局面，相关公司开发了第一批机器人、语音识别系统和语言翻译程序。他们还预测人工智能将与另一个趋势相互交叉，这一趋势就是过程自动化。过程自动化的基础是19世纪末一位名叫弗雷德里克·W.泰勒（Frederick
    W. Taylor）的工程师开发的工厂管理系统。该系统通过将制造过程的每个步骤分解为专门任务，由同一个人重复执行，从而提高效率。这种趋势一直持续到20世纪，此时专门的任务可以用计算机代码编写，然后由计算机反复执行。IBM公司五名前雇员于1972年创立的德国软件公司思爱普（Systems
    Applications and Products in Data Processing，SAP），开始通过向大型制造公司销售电脑赚了很多钱，这些电脑可以用来做一些诸如在生产过程中记录库存之类的工作。美国军方更进一步使用电脑来改善后勤工作，例如，他们在战争期间使用人工智能在各个基地之间分配关键物资。随着公司和政府使用人工智能实现制造流程自动化以及对供应链进行优化，智能系统被逐渐构建起来。


    投资促进了汽车业（1995年）、国际象棋（1997年）和宠物狗（1999年）等方面的创新。这些突破引人注目，因为它们将人工智能带入了公众视野，分别应用于一个机器人（该机器人能够根据自己所看到的东西来改变行为）、第一辆自动行驶1000英里（1英里≈1.6千米）的汽车，以及一个能够对人类表情做出反应的“宠物”机器人。


    那一时期的情形跟20年后的今天非常相似：有证据表明，人工智能在现实世界中的应用——为了娱乐，同时也为了提高企业的效率——促进了投资。然而，人工智能的投资在经历了20世纪90年代显著的发展之后，并没有促使许多公司采用人工智能。这一时期，军方、IBM和索尼公司是为数不多的几个拥有足够的数据、人才和计算能力构建人工智能的实体。


    这些公司有着巨大的领先优势，但当时的计算能力和网络技术限制了它们的发展。数十年的研究催生了可编程的人工神经元。然而，这些可编程的人工神经元是单一的，因此功能有限，只能进行数据输入、计算、数据输出。将神经元串联成大型网络需要巨大的计算资源，因此，这一方法让人觉得非常不切实际。设计和运行这样一个系统无疑是一项艰巨的挑战。


    新千年伊始，人工智能研究人员在将神经元串联成一个网络方面取得了突破。加拿大计算机科学家约书亚·本吉奥（Yoshua Bengio）设计了一个基于神经网络的语言模型，该模型可以在一种语言中依据一个单词与其他单词的相邻关系，在其词汇中找出下一个可使用的最佳单词。出生于英国的计算机科学家和心理学家杰弗里·辛顿（Geoffrey
    Hinton），开发了一种将多层神经元连接在一起的神经网络——深度学习的先驱。重要的是，研究人员致力于让这些神经网络在现有的计算机芯片上高效运行，特别是在用于计算机图形图像的芯片上运行，因为它们特别擅长并行运算许多数值。研究结果出现了一个可以训练的神经网络：可编程神经元，连接在一个网状网络中，将计算结果传递到位于其下方的另一个网络上——所有这些都是在一个芯片上计算的，该芯片可以在合理的时间范围内执行必要的操作，只需几天而不是几个月时间。


    ### 电脑便宜了


    科技界经常发生的事情是，一个领域的创新引发了另一个领域的创新。计算机科学中的分布式系统使我们能够制造出体积大、功能强、价格低的计算机。这一进步是促进人工智能发展的第一个关键因素。IBM和微软等大型科技公司让客户能够访问云计算集群，随着这些集群的扩大，计算能力变得越来越便宜。发达国家中的绝大多数人在工作时都有一台电脑可以随身携带。使用这些计算机和互联网时产生的数据是人工智能发展的第二个关键因素。拥有更多计算能力和数据的研究人员对人工智能重新产生了兴趣。这些神经网络所具有的部署能力，已经足以使其嵌入日常产品中，从手机键盘到购物网站，再到亚马逊的Alexa或苹果HomePod等家居设备，为执行我们的每一个命令做好了充分的准备。


    我开始研究基于人工智能的技术，大约是在研究人员再次对它产生兴趣的时候，也就是在云计算建立之后，并有大量数据进入其中的时候。当我意识到会有更多的数据进入其中，而且需要计算时，我创办了一家公司，帮助世界上最大的旅游公司整理消费者通过手机和社交媒体生成的所有数据。该领域取得的进步和深层神经网络的创新令我惊叹不已。这是一项可以改变一切的技术，值得花几十年时间去研究探索。事实上，我加入了第一个完全专注于人工智能的投资基金Zetta
    Venture Partners，该基金于2013年推出——同一年，一整泽字节（Zettabyte）的数据（`10^(21)`字节，或10万亿亿字节）首次在互联网上传播。我们已经审核了数万个创建人工智能优先公司的推介，支持了许多开创性的公司，并且成为世界上最大的机器学习（Machine
    Learning，ML）工程师社区——Kaggle——的最大投资者。作为一名风险投资家，我的工作是尽我所能预测技术前沿何时会与现实结合。用我的职业生涯打赌，关于人工智能，时间就是现在。自那以后，Zetta
    Venture Partners一直为第一代将人工智能应用于现实世界的公司提供支持，并在“关键时刻”吸取了教训。这本书将与大家分享这些教训。


    ### 人工智能的下半个世纪：2000年至2050年


    过去几个世纪的实践表明，当一个领域与另一个领域交叉时，它就会向前发展：哲学和数学交叉产生物理学；当工业工程和电气工程交叉时，工厂的生产效率得到了显著提高。如今，人工智能正在与分布式系统交叉，我们因此能够在功能强大的计算机上运行机器学习模型，并对大量数据进行处理。本书将提供投资基础设施的最佳实践，推介给对这两种交叉技术有着深刻见解的人员。


    现在开始创立人工智能优先公司还不算晚。无论你驾驶的是小船还是大船，科技的发展潮流都能帮助你迎头赶上。现有的方法可以高效地准备数据、让你用少量的数据做很多的事情、综合生成数据、有效地标注数据、自动构建机器学习模型，以及将它们与现有软件进行集成。我们将在这本书中学习其中的许多方法。


    ## 人工智能优先公司


    人工智能优先公司将人工智能运用于现实工作，在实际预算和时间有限的情况下，优先考虑人工智能。人工智能优先公司通过短期权衡来构建智能，以获得超越竞争对手的长期优势。


    在本书中，你将看到运营人工智能优先公司遇到的最基本问题及其答案。从实验和团队建设，到实施手段、价值评估和长期战略优势衡量，你将了解如何捕获数据、将其塑造为模型，并比竞争对手更快地学习。


    这本书填补了人工智能潜能理论和人工智能应用技术之间的空白，为读者提供了将人工智能应用于商业问题的可执行指南。其创作初衷是为具有不同专业知识水平的读者提供帮助。该书提供了关于人工智能的基础知识、关键术语表，并帮助你更好地理解相关技术术语。我们的重点不是让你成为技术专家，而是为你提供一个更好的商业决策基础。简单地说，这是一本关于如何使用人工智能赢得商业竞争的书籍。问题不是你能否在这个人工智能优先的世纪里做出贡献，而是你想不想做出贡献。


    ## 本书结构


    本书分为八章，各章相辅相成。


    第一章，我们对数据学习效应（Data Learning Effects，DLE）进行了定义。它是由人类智能转向机器智能而产生的一种新型竞争优势。这个新概念建立在三个现有的竞争优势概念之上：网络、规模和学习效应。


    第二章，我们将向你展示如何从现在开始使用精益人工智能（Lean AI）概念——一种构建人工智能对客户进行测试的方法，并创建你的公司。


    第三章，你已经使用人工智能对客户进行测试，我们接着丰富你的策略，以获取模型所需的更多数据。


    第四章，我们给你一个计划，建立一个人工智能优先团队来处理数据。


    第五章，有了更多的数据，你可以建立更好的模型，放大数据的价值。


    第六章，从实验转向生产需要客户系统更深入的集成，以及对模型的持续管理。我们为你提供成功的客户实施框架，以及管理人工智能模型的系统方法。


    第七章，在一切都在运转的情况下，我们必须确保人工智能能够产生结果。因此，我们为你提供了定性和定量的方法，用以衡量模型以及你们的智能优先公司是否获得了成功。


    第八章，我们探索如何将数据学习效应与其他竞争优势相结合，建立一家能够击败现有公司，并在未来几十年内稳定发展的公司。


