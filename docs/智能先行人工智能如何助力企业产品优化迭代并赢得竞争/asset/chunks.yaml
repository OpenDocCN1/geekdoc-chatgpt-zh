  trans: '

    Finally, the data learning effect brings products that satisfy the most demanding
    use cases: full automation. AI-first companies possess a new market for automated
    solutions, leaving incumbent companies to gradually wither in the old market.
    This is the third wave of AI-first disruption.


    Table 8-1 shows the waves of AI-first disruption.


    Table 8-1 Waves of AI-First Disruption


    ![](img/image_085.jpg)


    ## AI-First Aggregation


    This creates an opportunity for vast amounts of freely flowing data worldwide:
    to aggregate it, manage it with intelligent systems, and distribute it widely,
    thereby generating more data, and so on. Figure 8-7 illustrates AI-first aggregation.


    ![](img/image_086.jpg)


    Figure 8-7 AI-First Aggregation


    When we generate massive amounts of data, the opportunity for aggregation arises.
    Low transaction costs on the internet mean it is more convenient to promote the
    use of new products—people just need to enter credit card numbers online to use
    more products and generate more data. The internet also lowers distribution costs—just
    download an app—making it easier to sell products, attract more customers, and
    collect more usage data. Furthermore, the internet lowers marginal costs—cloud
    computing is relatively cheap—enabling cheap products to be offered to customers
    online. All this leads to more customers using more products and generating more
    data.


    When something exists in large quantities, to gain more value one cannot simply
    keep producing it in bulk; instead, one must develop and manage it. Massive data
    is not a product, but information can be. The Big Data era gave us products that
    can manually store, manage, and discover data. AI can automatically manage all
    this data and help us discover content relevant to the decisions that must be
    made. AI turns data into products.


    Below are the characteristics of AI-first aggregators:


    - **Establish direct relationships with customers.** AI-first aggregators generate
    predictions that customers use daily for decision-making. Incumbent companies
    are the systems of record behind AI-first products, just as databases are behind
    software applications. Unless a failure occurs, customers never interact with
    the database. For example, you don''t deal with the company that owns movie rights,
    catalogs them, and distributes them globally; you just click play on the next
    title Netflix suggests.

    - **Serve customers at zero marginal cost.** With AI-first aggregators, production
    costs decrease as automation increases. Incumbent companies scale gradually by
    manually adding features to their products or providing more services. For example,
    offline publications require a translator to translate every page of a manuscript
    before printing, whereas online publications can use automatic language translation
    products to translate articles and deliver them to more customers worldwide.

    - **Zero distribution costs.** AI-first aggregators integrate or piggyback their
    products with products customers already use, then deliver them to customers.
    For example, an AI-first application can retrieve identity tickets from the software
    program JIRA (developed by Australian software company Atlassian Corporation)
    and learn how to route these tickets to the right engineers. It can both aggregate
    data and learn from data sold through that company''s marketplace. However, many
    incumbent companies have no product to piggyback on and must spend money on marketing
    to expand their market in order to sell products to customers.

    - **Zero transaction costs.** AI-first aggregators run their systems on other
    vendors'' infrastructure. In effect, many incumbent companies are the databases
    from which AI-first products obtain data. A good example is these companies plugging
    into Salesforce software applications. These applications can plug into the Salesforce
    system and run within it, extracting and processing data on Salesforce''s compute
    infrastructure, effectively reducing the marginal cost of AI-first products processing
    data to zero.


    Aggregation theory explains not only why companies like Netflix currently have
    massive market dominance, but also why AI-first companies may possess even greater
    market dominance. Streaming entertainment services possess a critical mass of
    customers (demand), incentivizing content production (supply); in a positive self-reinforcing
    loop, more content attracts more customers. AI-first aggregators have the potential
    to build a faster self-reinforcing loop because their customers are both the demand
    side and the supply side of this loop. Essentially, a critical mass of customers
    (demand) can generate enough data for the AI to produce increasingly accurate
    predictions. In turn, higher prediction accuracy encourages these customers to
    use the product more. Customers generate enough data to kickstart the AI flywheel;
    then, in a rapidly self-reinforcing loop, the AI automatically generates enough
    data to improve system accuracy, thereby increasing product adoption, allowing
    AI-first companies to quickly establish market dominance.


    ### Integrating Incumbent Companies


    Software needs to integrate with existing workflows to function. AI-first aggregators
    reverse the direction of software integration, attracting incumbent companies''
    customers.


    - **Incumbent companies integrate backward,** building a workflow tool for daily
    customer use, then putting the data from that workflow into a database.

    - **AI-first companies integrate forward,** pulling data from the database and
    building an intelligent system for daily customer use.


    AI-first aggregation differs from vertical integration: aggregation concerns data
    and aims to promote adoption; vertical integration involves data, services, infrastructure,
    interfaces, etc., and increases profits. Furthermore, AI-first aggregation promotes
    the development of new products used to aggregate data streams from the internet;
    these new products have advantages over incumbent products, can extract data from
    incumbent products, then integrate and sell through them, thereby subordinating
    the incumbent products. Incumbent backward integration is shown in Figure 8-8.


    ![](img/image_087.jpg)


    Figure 8-8 Incumbent Backward Integration


    Figure 8-9 shows AI-first company forward integration.


    ![](img/image_088.jpg)


    Figure 8-9 AI-First Company Forward Integration


    ## Positioning


    In the history of software development, to prevent customers from abandoning their
    products for competitors'', software companies typically deeply integrate their
    products with the customer''s usage environment. This section draws lessons from
    the broader tech industry and applies them to AI-first product R&D, drafting a
    new framework to embed products into an industry at three levels: storage, standards,
    and ecosystems. Additionally, this section provides a list of items that must
    appear in vendor contracts for those purchasing AI-first products. Figure 8-10
    illustrates product positioning.


    ![](img/image_089.jpg)


    Figure 8-10 Product Positioning


    The following are the ways AI-first products store core assets, set standards,
    build ecosystems, build brands, and capture value first.


    ### Store Core Assets


    Embed data storage management into AI-first products: for example, provide powerful
    image search tools, but only to customers who agree to store all their images
    in your database, or who possess sensors that capture and store data. However,
    storing customer data requires negotiating data rights with them. To some extent,
    this is a choice: whether to acquire a large client on stricter terms, using a
    critical mass of data to train a high-accuracy model, then quickly onboard the
    rest of the market on looser terms; or whether to acquire many smaller clients
    on looser terms, whose aggregate data volume reaches a critical value, enabling
    the model to be trained to high precision. This choice depends on the market''s
    data dynamics: whether one or a few clients possess a critical mass of data. If
    a single client''s data volume already reaches the critical value and they agree
    to sign a valid data rights agreement, then pursuing that one client suffices;
    otherwise, pursue multiple clients.


    For example, companies can also embed this in AI-first products by requiring clients
    to upload models to cloud services for storage. That is, models must be uploaded
    to the cloud. This is similar to how most cloud-based software vendors manage
    product storage and services.


    ### Set Standards


    Vendors must adhere to product production standards, embedding the standard-setter''s
    products into an ecosystem. This embedded technology approach differs from so-called
    vendor lock-in, because vendor lock-in revolves around a business arrangement
    with restrictive terms. Standard setting can be achieved in two ways: by adopting
    more advanced technology, or by occupying a dominant market position. Many great
    companies have embedded their technology into ecosystems, such as SAP, Oracle,
    and Microsoft.


    Standards manifested as documentation and training lock in protocols, data, products,
    personnel, and procedures.


    - **Protocol lock-in** comes from other vendors needing to adhere to a specific
    system architecture (e.g., data formats or model structures). This lowers switching
    costs for potential customers, making it easier to adopt standards-compliant products,
    but raises switching costs for current customers, because finding a vendor using
    that protocol or reformatting data can be costly. In the data world, the most
    famous example is probably Microsoft Excel. Microsoft''s analytics product has
    powerful lock-in because its format is proprietary. Making protocols transparent
    and editable—for instance, open-sourcing data—is a primary way to drive industry
    adoption of a standard.

    - **Data lock-in** may come from other vendors needing to send data through a
    specific system, allowing data collection in transit. If the intelligent systems
    trained on this data are better than competitors'', data lock-in may increase.
    For example, SAP is the center of supply chain data; anyone developing new software
    to help understand supply chains must use its data protocols.

    - **Product lock-in** comes from other vendors needing to run their software within
    a specific interface. Since differences between competing product interfaces are
    small, product lock-in increases. For example, Salesforce provides a feature-rich
    CRM system allowing vendors to build applications on top of it, provided those
    applications run on the Salesforce interface. This makes it hard for customers
    to see the added value of applications running inside Salesforce.

    - **Personnel lock-in** comes from client employees who are accustomed to using
    products based on its architecture, data, or interface. This increases competitors''
    switching costs. For example, over the past decades, Oracle—directly or indirectly—trained
    many developers using its proprietary database query language. Today, these people
    can easily move between other companies that also use Oracle databases.

    - **Process lock-in** stems from work partners adhering to operational procedures
    to control quality. This increases switching costs because current clients won''t
    choose another vendor unless they reach an agreement with a partner—typically
    called a System Integrator (SI) or Independent Software Vendor (ISV)—who follows
    those procedures. For example, cloud computing and virtualization software company
    VMware trains system integrators to correctly install its hardware in compute
    infrastructure. Clients are unlikely to risk choosing a new integrator to build
    a brand-new compute infrastructure.


    In determining a tech company''s product and marketing strategy, when and how
    to pursue standardization to lock in customers may be one of the most critical
    questions. Computers are highly complex, requiring standardized coordination across
    the entire ecosystem to function. When to set standards depends on whether it
    is a new market or a mature one.


    To broadly promote their technology, companies pioneering new markets are usually
    more willing to drive standardization. Standards not only allow customers to easily
    integrate existing systems—for example, by putting data into their AI-first products
    in standard data formats—but also open the door for third-party developers to
    build complementary features. For instance, a simple interface allowing customers
    to adjust parameters in AI models can expand the product market from technical
    to non-technical customers. With standards, companies can more easily position
    themselves as versatile players, using tools built on these standards to understand
    new technologies. Versatile companies with custom application capabilities grow
    rapidly at this stage because the product space is fragmented. We see, for example,
    that at this stage of the market lifecycle, startups delay focusing on vertical
    markets.


    Dominant firms in mature markets tend to lower standardization levels, promote
    fragmentation, or implement highly detailed standards to reduce competition from
    new entrants. Standards facilitate new entrants entering mature markets, as they
    can use all specifications in the standard to quickly build products and offer
    them to customers already accustomed to the standard. For new entrants, lowering
    standardization levels hinders building a product that customers can easily switch
    to. Promoting fragmentation confuses customers, forcing them toward the dominant
    vendor with the most stable architecture. Detailed standards reduce new entrants''
    ability to produce differentiated products, because product functionality is dictated
    by the standard; this causes customers choosing the dominant vendor to value things
    beyond product features, such as after-sales service or good relationships. At
    this point, highly specialized companies can launch mature products compliant
    with every standard. Consequently, they thrive.


    When to execute a standardization plan depends on who plays the dominant role
    in a specific market. These players may be at the bottom of the ecosystem chain,
    e.g., hardware manufacturers running software. Everyone hopes hardware manufacturers
    adopt relevant standards; otherwise, all software fails to run. Computer chip
    manufacturer NVIDIA holds such an advantage in the machine learning market. By
    multiple measures, this California-based company''s chips offer the best performance
    for running various types of ML models. Developers learn CUDA (Compute Unified
    Device Architecture), the programming language developed by NVIDIA, to write instructions
    for NVIDIA chips. Once developers use CUDA, the company can showcase other new
    software it wants to sell to them. Figuring out who controls the key user interface
    and who controls the data pipeline bottleneck may be a critical factor to consider.
    For example, ERP software can collect and store data on product inventory. Dominance
    may also come from buyers rather than suppliers, as governments and other large
    purchasers can influence standard-setting to ensure industry standards perfectly
    align with their existing infrastructure.


    Finally, alliances of companies and non-corporate organizations tend to set standards
    for the entire industry; thus, forming such alliances becomes a valuable strategic
    capability. The telecom industry is a classic example: the International Telecommunication
    Union (ITU), created by the UN, set mobile communication standards through long-term
    negotiations with major telecom providers, broadcasters, and handset/network equipment
    manufacturers. We see this in the software industry too, where one company sponsors
    others; e.g., with Google''s sponsorship, Kubernetes (a way to write software
    deployable across multiple cloud computers) and Keras (a framework suite for building
    ML models) could consolidate internal development based on these standards, invest
    in the growing ecosystem, attract talent to build better products per these standards,
    and grow the ecosystem in a positive reinforcement loop, etc.


    Ultimately, customers will reject features that lock them into a product unless
    those features generate significant value; therefore, promoting them prematurely
    before they demonstrate benefits is futile. However, promoting too late risks
    losing customers, who may then become interested in new entrants offering the
    same features. When technology is novel, adopting restrictive usage terms early
    is a way to protect IP; relaxing terms after competitors catch up is a wise move
    to expand the ecosystem around the product by allowing other products to integrate.
    This is both product strategy and financial consideration: product strategy concerns
    whether customers have functional alternatives; financial consideration concerns
    whether profit can be made by expanding existing customer usage or acquiring new
    customers—who may struggle to enter the field under relatively strict conditions
    and require deep integration.


    ### Build Ecosystem


    #### Compatibility


    For AI-first companies needing data from other applications to train underlying
    models, compatibility—introducing a new product that works with products customers
    already use—is a critical consideration. Truly novel, revolutionary, and vertically
    integrated products may be incompatible with existing products, but because the
    value they offer is distinct and complete, customers are more willing to adopt
    them, leading to holistic changes in compute, data, and staffing. In fact, revolutionary
    products may possess technology too novel to be compatible with existing tech.
    The iPhone is an example: for the first few years, Apple prohibited other developers
    from designing apps for it, preventing people from using Microsoft Exchange and
    other popular apps, but because the product was so revolutionary, it sold millions.
    However, creating a truly novel product and vertically integrating everything
    a customer might need into it from the start is very difficult. Therefore, when
    formulating go-to-market strategies, companies usually need to consider product
    compatibility. Less novel horizontal products resulting from improvements must
    be compatible with existing products, because their value relates to products
    customers are currently using. The key is for companies to objectively assess
    the product''s relative novelty, degree of vertical integration with other market
    products, and dependencies. Some products may start as improvements, e.g., a system-of-record
    plugin; but after collecting data via the plugin to build a truly novel predictive
    system, they may become revolutionary products—analytics dashboards are a good
    example, having evolved into complete decision systems.


    Not all companies must strive to make their products compatible with others at
    all costs. Incumbents'' focus may be on building integrations, because they need
    the incremental functionality new products provide. Technically, incompatibility
    can be resolved via middleware or granting IP to key partners, supporting and
    incentivizing them to build integrations. There are many ways to achieve compatibility,
    but providing too much may let competitors steal customers. When to let other
    developers build on your product is a question requiring careful consideration.


    #### Complementarity


    Companies investing in complementary products, whether by building them or letting
    a developer ecosystem build them, increase customer value. SAS and Tableau are
    two companies producing analytics products; their products enhance other analytics
    products with additional statistical and visualization capabilities, respectively.
    When investing engineering resources in complementary product development, companies
    must balance whether it increases core product competitiveness against its value
    to customers. Encourage others not to develop complementary products that compete
    with the core product, but ideally develop those that might evolve into highly
    competitive complements.


    The predecessors of AI-first products were non-intelligent workflow products that
    consolidated data into one place—a system of record. For example, a product predicting
    inventory orders needs inventory data from the system of record to train the prediction
    model. If there is no predecessor product—a system of record storing data—building
    that workflow product and offering it free to users to acquire data can embed
    the AI-first product more deeply.


    ### Capture Value First—First-Mover Advantage


    Despite controversy in management strategy, entering the market first is undoubtedly
    a way to build competitive advantage, especially for AI startups: prominent advantages,
    no disadvantages. First movers can acquire scarce assets, build technology leadership,
    and increase switching costs before competitors. AI-first companies are exactly
    this. First movers collect scarce assets before competitors; AI-first companies
    use one of the multiple methods outlined in Chapter 3 "Acquiring Data" to collect
    data before competitors (and secure exclusive access rights). Google collected
    and stored massive search data before competitors, making its search product the
    best today. First movers establish technological advantage over competitors through
    leading R&D; AI-first companies build better intelligent systems through data
    collection and intelligent system design methods. Importantly, before new AI development,
    first movers need data for experimentation. Google long ago collected data by
    driving cars in the field before competitors and invested in autonomous driving
    research; it can be said Google has the most promising autonomous driving tech
    today. First movers create switching costs by integrating with existing systems
    and benefiting from uncertainty surrounding new entrants; AI-first companies increase
    switching costs by centralizing customer data in their own databases and launching
    highly accurate models. Google centralizes and protects customer data via emails,
    locations, and document collections, providing good suggestions on what to buy,
    where to go, even phrases to write. AI-first companies are first movers.


    Sometimes, moving first can damage a company''s competitive position, because
    potential competitors benefit from the first mover''s developed technology. Increased
    certainty around base standards also gives customers more understanding of how
    to use new technology. However, AI-first companies are not affected by the potential
    downsides of moving first. Free-riders cannot benefit from the first mover''s
    technology because they lack the data AI-first companies possess. For instance,
    there are many promising AI-based methods to improve search, but developing a
    search better than Google seems hard because without massive search data to train
    models, identifying the meaning of phrases—especially uncommon ones—is very difficult.
    Free-riding imitators need both technology and data. Compared to tech companies
    providing standard services, AI-first companies have less relevance to customer
    certainty generated around base standards, because AI-first companies gain technical
    returns through prediction accuracy, not interoperability with existing systems.
    Customers won''t buy a system that predicts the next sales lead just because it
    integrates with most CRMs; they just need the lead to integrate with their current
    CRM and get good predictions. AI-first companies enjoy more benefits from customer
    certainty because their system accuracy improves with increasing real-world data.
    Finally, as latecomers adapt faster to market demand changes, first movers sometimes
    see their initial lead threatened. It must be emphasized again that this first-mover
    disadvantage does not apply to AI-first companies, because intelligent systems
    can automatically adapt to continuously incoming data. Intelligent systems are
    inherently dynamic, able to adjust when competitors enter the market.


    ### Build Brand

