- raw: '数据集成产品可以被动地汇聚大量的数据。这些产品之所以吸引顾客，是因为它们可以轻松地将一个数据源链接到另一个数据源，跨源对其规范化，并在与源的连接发生变化时更新集成。数据集成公司，比如 MuleSoft 和 Informatica 等，控制着具有此类功能的产品市场。随着越来越多的数据存储在多种不同的应用程序，并通过应用程序编程接口（Application Programming Interfaces，API）提供服务时，该市场正在变得越来越大。数据集成商通过直接收集流经其管道的数据，或者通过使用模式、推导或其他观察方法生成元数据，来构建一个有价值的数据资产。


    然而，建立一个数据集成公司很困难，原因如下：


    ● 数据集成的基本形式易于复制，而且数据集成的需求众所周知，所以市场上有很多这样的公司。


    ● 云计算公司在战略上必须提供一种能够从多种来源获取数据的产品，这样他们就可以为存储更多数据收取更多的费用。


    ● 数据管道可能会因为某种不可预见的原因而中断，而将它们修复需要大量手动工作。这项繁重、不可预见的工作可能会花费很多，从而降低毛利。


    ● 定价权往往较弱，因为购买一个集成数据产品，通常是在购买另一个解决核心问题的产品之后做出的决定。因此，客户在选择购买集成产品时，往往会减少预算，或者只是按照核心产品供应商的建议购买数据集成产品。


    尽管如此，Mulesoft还是坚持采用这种策略进行了首次公开募股（IPO），Segment和Zapier等公司成功执行了以集成多种数据源的工具为中心的数据采集策略。Segment——被上市公司Twilio以超过30亿美元的价格收购——统一了不同的软件即服务（SaaS）产品和内部数据库的营销数据。其应用程序编程接口驱动方法从一个简单的、通用的分析产品——Connections——开始，通过从下列来源获取数据，与网络分析产品展开竞争：


    ● 通过苹果iOS和谷歌安卓的移动应用；


    ● 通过Analytics.js插件、Shopify和Word-Press的网络应用；


    ● 直连服务器；


    ● 许多云应用，从客户关系管理系统到支付，以及电子邮件应用程序。


    这些数据通过管道进入电子邮件系统、分析仪表盘、帮助台应用程序、营销归因工具和数据仓库。我们还看到，Segment使用通过客户获得的数据构建智能系统，该系统自动将跨数据源的用户历史统一为一个综合概要文件，并带有一个关联的、智能生成的用户肖像；将数据合成为每个客户的特征、受众和预测；然后使用这些丰富的内容对营销活动和应用内体验进行个性化处理。


    Segment的第一步是通过整合许多现有数据源来收集数据；第二步，构建一个智能系统，利用这些数据为人工智能优先产品提供支持。


    **比较**


    构建工作流应用程序与构建集成是截然不同的任务。下面是工作流优先公司与集成优先公司的对比（见表3-1）。


    表3-1 工作流优先公司与集成优先公司的对比


    ![](EPUB/images/image_028.jpg)


    如果公司的目标是开发数据资产，那么，集成优先应用程序比工作流优先应用程序具有一些优势。其中最重要的可能是集成商直接从机器那里收集大量、新鲜（即更接近实时）的结构化数据。这里所说的机器也包括软件应用程序，这意味着数据不仅仅来自传感器。更高的数据量、新鲜度和结构一致性通常会产生更高质量的预测。


    集成来自工作流应用程序的数据可能是用户输入的数据，这些数据可能不够准确、非结构化（例如文本），或者是过时的。准确的数据意味着更好的模型和更准确的预测。


    也就是说，集成优先方法可能比工作流优先方法更加困难。首先，来自集成服务的数据通常不是专有数据，除非这些服务是公司内部的。其次，可用数据取决于工作流应用程序的数据结构。集成优先与工作流优先方法形成对比，后者通过在工作流应用程序中添加用户界面（User-Interface，UI）元素或表单来积累特定的数据点，从客户处收集数据。


    **与他人合作**


    与其他公司建立合作关系，可以花很少的钱来获取大量的数据。当合作伙伴拥有互补数据时，合作关系往往最容易建立起来。当数据能够增加现有数据的价值时，他们便具有互补性。例如，如果你想建立一个信用模型，那么，收入数据与债务数据就是互补的。两家公司，一家有收入数据，另一家有债务数据，如果其中一家正在建立一个预测信誉度的模型，另一家正在建立一个预测消费者支出的模型，那么，他们便可以从共享数据中受益。两家公司都有分享数据的动机，因为他们各自的模型都会随着附加数据的增加而得到改进。


    商业模式互补性也是一个考虑因素。以不同方式赚钱的公司更可能希望建立数据合作伙伴关系，因为他们所获得的任何收益都不会被伙伴的收益所抵消，也不会因为向同一客户群营销而抵消。


    数据集成商则不同，他们通过一系列与其他产品的集成来整理客户的数据，但前提是这样做要符合特定客户的需求，并通过客户的数据存储和打算集成的应用程序之间的现有管道来进行。这也意味着供应商不必与每个外部数据源谈判。


    例如，计算机视觉技术为医生们提供了一条前途广阔的路径，可以帮助他们识别患病的部位并协助确诊，如皮肤癌、乳腺癌、肺癌等。然而，计算机视觉模型往往需要许多图像来得到训练，而在处理X光等患者数据方面也有着严格的限制。构建计算机视觉系统的公司需要这些数据，但如果他们没有自己运营的医疗设施——建造和批准这些设施则需要数年时间——或者无法从现有医疗机构获得此类设施，那么，他们便无法获得需要的数据。因此，医疗行业的人工智能优先公司——或大或小——都需要与医疗机构建立独家合作关系。人工智能优先公司需要临界量的数据来训练模型，以获取预测可用性阈值。这可以让他们比市场上的其他对手更具优势。


    在客户方面，医疗机构希望提高每次诊断的准确度、可靠性和效率。有时，首要任务是避免漏诊，比如肺癌等特别致命的癌症，而在其他情况下，首要任务是定期对大量患者进行经济高效的筛查，比如皮肤基底细胞癌等特别常见的癌症。医疗机构可以通过使用人工智能来增强医生的能力，但通常不具备构建人工智能所需的机器学习计算机视觉专业知识。然而，他们有一笔宝贵的资产可以利用和保护，因此，医疗机构通常会与相关方达成合作伙伴关系，使得他们可以在一段时间内独家访问人工智能产品，严格控制数据，以及将数据集成到现有比如X光机之类的硬件中。独家访问可以给他们带来成本优势，或者使其能够为潜在患者提供更准确、更可靠的诊断。


    构建人工智能的公司可以与医疗机构合作，获取临界量的标注数据，让他们的模型可以获取预测可用性阈值，找出如何最好地通过现有硬件实现预测，解决监管问题，并从医生那里获得现场反馈——所有这些都是医疗机构无法单独完成的。接下来可能是将合作伙伴关系逐步扩大到相关机构，也可能是广泛的市场发布，在一段时间内分享新客户的收益。人工智能优先公司带来模型，客户带来数据，他们的商业模式是互补的。


    ## **人工生成的数据**


    聘用专业人员建立高度特定的数据集，这个工作可以通过外包或者聘用他人的方式完成，也可以让现有员工使用生成数据的产品来完成。人工生成的数据如图3-5所示。


    ![](EPUB/images/image_029.jpg)


    图3-5 人工生成的数据


    **数据标注**


    许多机器学习模型需要标注数据来训练识别算法。还有方兴未艾的迁移和半监督学习技术，可能为收集大量标注数据提供了替代方案，尤其是在图像、视频和语言理解等通用领域。然而，目前的技术水平似乎还不够，在某些特定领域更是如此。访问和拥有经过处理的数据以提供给模型，可能是创建一个纵向的人工智能优先公司最难解决的问题。


    受监督的机器学习模型需要标注的数据，但获取大量特定领域的标注样本非常困难。比如，在哪里可以找到2001年版雪佛兰西尔维拉多牌汽车挡泥板的十万张图片？众包（Crowdsourcing）、开展调查或者为汽车修理工建立工具，不太可能在短时间内产生那么多的图像。你可能需要从一家多年来一直在为汽车拍照的公司获取这些数据，比如汽车制造商、汽车连锁店，或者保险公司。没有标注数据集，那就构建一个。不过，这需要建立一个团队来标注数据，该团队可能包括专家和非专家，并且需要工具来高效地对大量数据进行标注。


    管理数据标注团队是一个新的实践领域。当给出明确的目标时，数据标注是一项高度可衡量的活动。例如，如果目标是让一个模型达到专家级的准确度，首先让专家给每一个观察结果贴上标签，然后过渡到让机器贴标签，同时用一名非专家来纠正那些标签。目标是让机器加上一名非专家来达到专家的水平——于是，就得到了专家—非专家一致性的测量标准。专家标注和模型表现如图3-6所示。


    ![](EPUB/images/image_030.jpg)


    图3-6 专家标注和模型表现


    随着时间的推移，特定数据标注操作的经济价值可以量化为，自动化在每个标签成本上节省的资金，乘以使模型达到该自动化水平所需的标签数量。用另一种方式表达就是，聘用人员标注数据的投资回报率（ROI）等于自动化所节省的成本，而不是机器学习系统中保持自动化水平所需的人员成本。


    ![](EPUB/images/image_031.jpg)


    把这项业务想象成一个工厂或许会更好理解。它产生的“货物”就是有标签的数据。工厂经理的工作是提高“贴标签”生产线的效率。


    ## **工具**


    标注数据时通常要求工程师在使用标签之前对数据进行清洗。例如，机器很难从数百万封客户服务电子邮件的文本中找到模式。在这种情况下，工程师可以使用自然语言处理技术——机器学习致力于理解文本的一个领域——从这些电子邮件中找出客户提到的特定产品的部分，然后将文本聚类，进而建立关于这些产品的投诉类别。


    尔后，使用这些类别对所有收到的新电子邮件标注，以便机器学会如何回应不同类别的投诉。人类可以对每封带有这些标签的邮件进行标注，机器也可以猜测将哪个标签应用于哪封邮件。前者成本高昂，后者往往不准确。主动学习等技术有助于找到人工标注过的最有助于系统改进的电子邮件，从而在手动标注每封新邮件和自动标注每封新邮件之间找到正确的平衡。主动学习过程如图3-7所示。


    ![](EPUB/images/image_032.jpg)


    图3-7 主动学习过程


    例如，在标注图像时，系统显示一组图像，并要求标注者将相似的图像分组。一个基于主动学习的模型会审查用户所选的图像有什么相似之处，将它们分组，并要求标注者提供较小一组图像的更多信息。然后，标注者将相似的图像分到一组子聚类中，模型学习每个子聚类中图像的相似之处，以此类推。从本质上讲，主动学习模型会根据标注者从其最后的预测中挑选出的最准确预测，来预测下一步需要什么数据。主动学习界面如图3-8所示。


    ![](EPUB/images/image_033.jpg)


    图3-8 主动学习界面


    基于主动学习的系统很难构建，但很有价值。第一，没有技术技能的人可以通过向系统提供反馈来创建非常有用的标签。第二，在可能解决机器学习问题的领域，该系统用途最大，因为该领域非常广泛，但在其中搜寻解决方案需要很长时间，且计算成本也很高。人们可以通过让机器快速改变输出，更接近所要寻找的目标，从而为搜寻解决方案提供快捷方式。然而有一个问题：机器的建议是否会影响用户，以至于用户开始用他们认为与机器一致的方式标注数据？如果是这样的话，那么标签就没用了。


    让用户扮演数据标注员的角色，效果可能也特别好。例如，可以通过添加提示，让用户为图片添加标注。一些算法也有助于从用户那里获取最有用的数据。


    ● **不确定性抽样。**标注当前模型最不确定的点。


    ● **委员会质询。**在同一标注数据上训练多个模型，然后手动标注导致模型之间的输出最不一致的数据点。


    ● **预期模型变化。**手动标注最有可能改变模型输出的数据。


    ● **预期错误减少。**如上所述，但重点关注最有可能减少模型误差的数据。


    ● **方差缩减。**如上所述，但尽量减少差异。


    这不是一份详尽的清单，还有许多基于机器学习基本概念的方法。


    交互式机器学习（Interactive Machine Learning，IML）旨在创造接口，这些接口可以收集数据，以训练特定的机器学习模型，然后将结果呈现给用户，由用户决定将哪些数据放入模型中以供下一次迭代。交互式机器学习可以被认为是另一种让付费用户团队而不是带薪员工标注数据的方式。


    在开发方面，交互式机器学习有助于分类器更快迭代。工程师将根据从与用户的对话中收集的信息开发分类器。当用户对分类器进行纠正和有效培训时，迭代会更快。例如，工程师在构建一个自动撰写营销电子邮件的系统时，通常会使用自己的或在网上搜寻的一些具有代表性的电子邮件示例。然而，生成一些样本，将其放在管理电子邮件营销活动产品的营销人员面前，可以获得关于营销电子邮件好坏的更有效反馈。


    让机器以这种迭代方式向人类学习的潜在缺点是，人们可能会向机器提供没有信息的示例。这可能会使机器无法承受，导致其分类器变得不够准确。然而，开发人员可以采用保护措施，防止用户在机器中大量使用无用的示例。简单的方法包括让多个用户标注同一个数据点，或者在运行交互模型的同时，运行另一个可作为替代的非交互模型，然后，对结果进行比较，找到交互模型在何处与非交互模型发生了冲突，或忽略了非交互模型。


    开发交互式机器学习系统的一个好处是，请求用户输入数据可以建立信任。允许用户对系统的输出进行“纠正”，当看到他们的修正对系统的下一个输出产生了影响时，信任就会进一步得到强化。首先，用户将能够向自己或者他人解释（至少部分解释）系统是如何工作的，因为他们已经看到数据被输入系统，经过计算输出一个结果。其次，系统将尊重用户关于输出的——客观或者以其他方式形成的——意见。最后，用户已经看到了他们对输出的影响：一些输出正是来自他们的输入。


    **构建数据标签操作的最佳实践**


    对于人工智能优先公司来说，建立一个团队来标注数据可能是一个核心流程优势。然而，在组建团队之前，需要考虑一下大型的、诸如亚马逊土耳其机器人（Mechanical Turk）这样的基于平台的标签解决方案。这些平台有许多来自世界各地的工作人员，他们能够应对高弹性需求，并且可以每天24小时标注数据。他们还能够提供工具，帮助工人保持低成本和高质量。


    ## **管理**


    数据标注员是根据其具有的专业知识聘用的，而标注团队可以分为专业团队和非专业团队——前者在数据分类方面具有丰富的经验。标注员的上级是标注经理。当然，标注经理手下的标注员人数跟所需要的监督程度有关。标注经理的领导是标注主管。在中型公司，标注主管，或者说是唯一的标注经理，向运营副总裁汇报。而在小型公司，标注主管则直接向公司首席运营官（Chief Operations Officer，COO）汇报。当标注操作刚刚开始，仍在试图找出标注内容和方式时，情况可能会有所不同，在这种情况下，向机器学习研究主管或首席技术官（Chief Technology Officer，CTO）汇报可能更加合适。


    一个经验法则是，在标注没有完全自动化的环境中，每50名到100名标注员配备一名标注经理。当然，这也要看专业和非专业标注员的组合情况。


    标注操作成本取决于需要标注的数量、获取标注的难度、通过标注工具获得的杠杆效力，以及标注所需的专业程度。使用亚马逊土耳其机器人，每个标注的成本可能只有几美分；而使用医生，每个标注的成本则可能高达数百美元。


    非专业标注员无须具有太多经验，因此可以从不同的地方进行招募。招聘平台广告或小时工中介是一个很好的途径。另一个选择是直接从劳动力市场招聘，比如亚马逊土耳其机器人网站，或者自由职业者平台Upwork等。而专业标注员则可以直接从他们各自的领域进行招聘：比如，放射科医生，或者汽车保险公司的损失理算师。


    标注经理通常拥有运营背景——也就是说，考虑到成本和时间限制，他们必须能够协调大量资源。如果团队中大部分都是非专业标注员，那么就需要对其进行激励和管理。标注经理需要具有良好的背景，比如之前负责过客服中心的运营工作等。


    # **测量**


    数据标注的最终目标是得到一个好的产品，而一个好的产品依据的则是一些准确的分类器。因此，一个关键衡量指标应该是分类器是否正在变得更准确。


    就机器学习而言，数量意味着质量。换句话说，即使大量标注中有一个标注不那么正确，依然可以提高分类器的准确度。大量标注数据本身就是资产。因此，跟踪标记的总数据点，可以为标记操作产生的值提供信息。


    标注不是免费的，商业模型需要在制造好产品的成本与收益之间找到平衡。每个标注的成本都是一个明显的跟踪指标。也许，不那么明显的是，指标可跟踪的确很好，因为它可以显示帮助标注员的工具，以及所需的专业/非专业标注员组合有多大的杠杆作用。


    标注员对特定数据点的共识可能是标注准确度的标志，因为缺乏共识意味着对准确度的测量可能是错误的。专业标注员比非专业标注员或许能够更准确地对数据进行标注。非专业标注员的准确度可以通过将其与专业标注员的准确度进行对比来获得。专业标注员的成本也比非专业标注员高，因此，要逐步调整比例，使标注工作更有利于非专业标注员，从而降低成本。随着时间的推移，模型的输出应与客户的真实数据一致；也就是说，预测应该与现实相符。如果一致性下降，就表明数据标注可能存在问题。


    **人在回路系统**


    人在回路（Human-in-the-loop，HIL）系统需要人工输入才能生成输出，是人和机器相互作用的模式。这些系统不一定具有主动或者交互学习功能，它们只是可以让人们对放在某个地方的数据进行标注而已。主动和交互式学习系统也不一定有人参与——它可能是由一个机器人来做标注。人在回路系统是让用户标记数据的一般形式（如图3-9所示）。


    ![](EPUB/images/image_034.jpg)


    图3-9 人在回路系统


    上图即是一个人在回路系统。人们参与其中的方法有以下几种。


    **创建。**要求人们在“获取数据”这一步骤中创建全新的数据。例如，通过完成调查创建数据。


    **标注。**通过输入文本或从机器学习系统使用的标签列表中选择标签来标注数据。


    **反馈。**对输出进行评分，使用二进制分数（如真/假或者正确/不正确）或标量分数（如从0到10的排名）。


    **外包**


    通过交互式机器学习系统以及将人类置于该回路之中可以提高数据标注效率。选择哪种方法取决于标记基本数据所需的专业水平、能否找到专业标注员、成本和随着时间的推移提高自动化的可能性（以及标注数据的成本对利润率的影响）。然而，有时将数据标注全部外包却是最佳选择。


    外包的最大原因是获得更多的标签。获得正确标签是一项专业技能：拥有识别特定物体经验的标注员更擅长做这样的事情。然而，对所有标注员来说，出现标注错误都是难以避免的。而解决这个问题的方法就是使用更多的标注员，这样一来，错误的标注就可以被正确的标注有效地稀释。从数学上讲，如果一个标注员在5%的时间里出错，那么三个标注员犯相同错误的概率为5%×5%×5%，或仅为0.01%。'
  fmt: '

    # 数据集成与 AI 优先数据策略


    数据集成产品可以被动地汇聚大量的数据。这些产品之所以吸引顾客，是因为它们可以轻松地将一个数据源链接到另一个数据源，跨源对其规范化，并在与源的连接发生变化时更新集成。数据集成公司，比如
    MuleSoft 和 Informatica 等，控制着具有此类功能的产品市场。随着越来越多的数据存储在多种不同的应用程序，并通过应用程序编程接口（`API`）提供服务时，该市场正在变得越来越大。数据集成商通过直接收集流经其管道的数据，或者通过使用模式、推导或其他观察方法生成元数据，来构建一个有价值的数据资产。


    然而，建立一个数据集成公司很困难，原因如下：


    - 数据集成的基本形式易于复制，而且数据集成的需求众所周知，所以市场上有很多这样的公司。

    - 云计算公司在战略上必须提供一种能够从多种来源获取数据的产品，这样他们就可以为存储更多数据收取更多的费用。

    - 数据管道可能会因为某种不可预见的原因而中断，而将它们修复需要大量手动工作。这项繁重、不可预见的工作可能会花费很多，从而降低毛利。

    - 定价权往往较弱，因为购买一个集成数据产品，通常是在购买另一个解决核心问题的产品之后做出的决定。因此，客户在选择购买集成产品时，往往会减少预算，或者只是按照核心产品供应商的建议购买数据集成产品。


    尽管如此，Mulesoft 还是坚持采用这种策略进行了首次公开募股（IPO），Segment 和 Zapier 等公司成功执行了以集成多种数据源的工具为中心的数据采集策略。Segment——被上市公司
    Twilio 以超过 30 亿美元的价格收购——统一了不同的软件即服务（`SaaS`）产品和内部数据库的营销数据。其应用程序编程接口驱动方法从一个简单的、通用的分析产品——`Connections`——开始，通过从下列来源获取数据，与网络分析产品展开竞争：


    - 通过苹果 iOS 和谷歌安卓的移动应用；

    - 通过 `Analytics.js` 插件、Shopify 和 WordPress 的网络应用；

    - 直连服务器；

    - 许多云应用，从客户关系管理系统到支付，以及电子邮件应用程序。


    这些数据通过管道进入电子邮件系统、分析仪表盘、帮助台应用程序、营销归因工具和数据仓库。我们还看到，Segment 使用通过客户获得的数据构建智能系统，该系统自动将跨数据源的用户历史统一为一个综合概要文件，并带有一个关联的、智能生成的用户肖像；将数据合成为每个客户的特征、受众和预测；然后使用这些丰富的内容对营销活动和应用内体验进行个性化处理。


    Segment 的第一步是通过整合许多现有数据源来收集数据；第二步，构建一个智能系统，利用这些数据为人工智能优先产品提供支持。


    ## 比较


    构建工作流应用程序与构建集成是截然不同的任务。下面是工作流优先公司与集成优先公司的对比（见表 3-1）。


    表 3-1 工作流优先公司与集成优先公司的对比


    ![](EPUB/images/image_028.jpg)


    如果公司的目标是开发数据资产，那么，集成优先应用程序比工作流优先应用程序具有一些优势。其中最重要的可能是集成商直接从机器那里收集大量、新鲜（即更接近实时）的结构化数据。这里所说的机器也包括软件应用程序，这意味着数据不仅仅来自传感器。更高的数据量、新鲜度和结构一致性通常会产生更高质量的预测。


    集成来自工作流应用程序的数据可能是用户输入的数据，这些数据可能不够准确、非结构化（例如文本），或者是过时的。准确的数据意味着更好的模型和更准确的预测。


    也就是说，集成优先方法可能比工作流优先方法更加困难。首先，来自集成服务的数据通常不是专有数据，除非这些服务是公司内部的。其次，可用数据取决于工作流应用程序的数据结构。集成优先与工作流优先方法形成对比，后者通过在工作流应用程序中添加用户界面（`UI`）元素或表单来积累特定的数据点，从客户处收集数据。


    ## 与他人合作


    与其他公司建立合作关系，可以花很少的钱来获取大量的数据。当合作伙伴拥有互补数据时，合作关系往往最容易建立起来。当数据能够增加现有数据的价值时，他们便具有互补性。例如，如果你想建立一个信用模型，那么，收入数据与债务数据就是互补的。两家公司，一家有收入数据，另一家有债务数据，如果其中一家正在建立一个预测信誉度的模型，另一家正在建立一个预测消费者支出的模型，那么，他们便可以从共享数据中受益。两家公司都有分享数据的动机，因为他们各自的模型都会随着附加数据的增加而得到改进。


    商业模式互补性也是一个考虑因素。以不同方式赚钱的公司更可能希望建立数据合作伙伴关系，因为他们所获得的任何收益都不会被伙伴的收益所抵消，也不会因为向同一客户群营销而抵消。


    数据集成商则不同，他们通过一系列与其他产品的集成来整理客户的数据，但前提是这样做要符合特定客户的需求，并通过客户的数据存储和打算集成的应用程序之间的现有管道来进行。这也意味着供应商不必与每个外部数据源谈判。


    例如，计算机视觉技术为医生们提供了一条前途广阔的路径，可以帮助他们识别患病的部位并协助确诊，如皮肤癌、乳腺癌、肺癌等。然而，计算机视觉模型往往需要许多图像来得到训练，而在处理
    X 光等患者数据方面也有着严格的限制。构建计算机视觉系统的公司需要这些数据，但如果他们没有自己运营的医疗设施——建造和批准这些设施则需要数年时间——或者无法从现有医疗机构获得此类设施，那么，他们便无法获得需要的数据。因此，医疗行业的人工智能优先公司——或大或小——都需要与医疗机构建立独家合作关系。人工智能优先公司需要临界量的数据来训练模型，以获取预测可用性阈值。这可以让他们比市场上的其他对手更具优势。


    在客户方面，医疗机构希望提高每次诊断的准确度、可靠性和效率。有时，首要任务是避免漏诊，比如肺癌等特别致命的癌症，而在其他情况下，首要任务是定期对大量患者进行经济高效的筛查，比如皮肤基底细胞癌等特别常见的癌症。医疗机构可以通过使用人工智能来增强医生的能力，但通常不具备构建人工智能所需的机器学习计算机视觉专业知识。然而，他们有一笔宝贵的资产可以利用和保护，因此，医疗机构通常会与相关方达成合作伙伴关系，使得他们可以在一段时间内独家访问人工智能产品，严格控制数据，以及将数据集成到现有比如
    X 光机之类的硬件中。独家访问可以给他们带来成本优势，或者使其能够为潜在患者提供更准确、更可靠的诊断。


    构建人工智能的公司可以与医疗机构合作，获取临界量的标注数据，让他们的模型可以获取预测可用性阈值，找出如何最好地通过现有硬件实现预测，解决监管问题，并从医生那里获得现场反馈——所有这些都是医疗机构无法单独完成的。接下来可能是将合作伙伴关系逐步扩大到相关机构，也可能是广泛的市场发布，在一段时间内分享新客户的收益。人工智能优先公司带来模型，客户带来数据，他们的商业模式是互补的。


    ## 人工生成的数据


    聘用专业人员建立高度特定的数据集，这个工作可以通过外包或者聘用他人的方式完成，也可以让现有员工使用生成数据的产品来完成。人工生成的数据如图 3-5 所示。


    ![](EPUB/images/image_029.jpg)


    图 3-5 人工生成的数据


    ### 数据标注


    许多机器学习模型需要标注数据来训练识别算法。还有方兴未艾的迁移和半监督学习技术，可能为收集大量标注数据提供了替代方案，尤其是在图像、视频和语言理解等通用领域。然而，目前的技术水平似乎还不够，在某些特定领域更是如此。访问和拥有经过处理的数据以提供给模型，可能是创建一个纵向的人工智能优先公司最难解决的问题。


    受监督的机器学习模型需要标注的数据，但获取大量特定领域的标注样本非常困难。比如，在哪里可以找到 2001 年版雪佛兰西尔维拉多牌汽车挡泥板的十万张图片？众包、开展调查或者为汽车修理工建立工具，不太可能在短时间内产生那么多的图像。你可能需要从一家多年来一直在为汽车拍照的公司获取这些数据，比如汽车制造商、汽车连锁店，或者保险公司。没有标注数据集，那就构建一个。不过，这需要建立一个团队来标注数据，该团队可能包括专家和非专家，并且需要工具来高效地对大量数据进行标注。


    管理数据标注团队是一个新的实践领域。当给出明确的目标时，数据标注是一项高度可衡量的活动。例如，如果目标是让一个模型达到专家级的准确度，首先让专家给每一个观察结果贴上标签，然后过渡到让机器贴标签，同时用一名非专家来纠正那些标签。目标是让机器加上一名非专家来达到专家的水平——于是，就得到了专家—非专家一致性的测量标准。专家标注和模型表现如图
    3-6 所示。


    ![](EPUB/images/image_030.jpg)


    图 3-6 专家标注和模型表现


    随着时间的推移，特定数据标注操作的经济价值可以量化为，自动化在每个标签成本上节省的资金，乘以使模型达到该自动化水平所需的标签数量。用另一种方式表达就是，聘用人员标注数据的投资回报率（`ROI`）等于自动化所节省的成本，而不是机器学习系统中保持自动化水平所需的人员成本。


    ![](EPUB/images/image_031.jpg)


    把这项业务想象成一个工厂或许会更好理解。它产生的“货物”就是有标签的数据。工厂经理的工作是提高“贴标签”生产线的效率。


    ### 工具


    标注数据时通常要求工程师在使用标签之前对数据进行清洗。例如，机器很难从数百万封客户服务电子邮件的文本中找到模式。在这种情况下，工程师可以使用自然语言处理技术——机器学习致力于理解文本的一个领域——从这些电子邮件中找出客户提到的特定产品的部分，然后将文本聚类，进而建立关于这些产品的投诉类别。


    尔后，使用这些类别对所有收到的新电子邮件标注，以便机器学会如何回应不同类别的投诉。人类可以对每封带有这些标签的邮件进行标注，机器也可以猜测将哪个标签应用于哪封邮件。前者成本高昂，后者往往不准确。主动学习等技术有助于找到人工标注过的最有助于系统改进的电子邮件，从而在手动标注每封新邮件和自动标注每封新邮件之间找到正确的平衡。主动学习过程如图
    3-7 所示。


    ![](EPUB/images/image_032.jpg)


    图 3-7 主动学习过程


    例如，在标注图像时，系统显示一组图像，并要求标注者将相似的图像分组。一个基于主动学习的模型会审查用户所选的图像有什么相似之处，将它们分组，并要求标注者提供较小一组图像的更多信息。然后，标注者将相似的图像分到一组子聚类中，模型学习每个子聚类中图像的相似之处，以此类推。从本质上讲，主动学习模型会根据标注者从其最后的预测中挑选出的最准确预测，来预测下一步需要什么数据。主动学习界面如图
    3-8 所示。


    ![](EPUB/images/image_033.jpg)


    图 3-8 主动学习界面


    基于主动学习的系统很难构建，但很有价值。第一，没有技术技能的人可以通过向系统提供反馈来创建非常有用的标签。第二，在可能解决机器学习问题的领域，该系统用途最大，因为该领域非常广泛，但在其中搜寻解决方案需要很长时间，且计算成本也很高。人们可以通过让机器快速改变输出，更接近所要寻找的目标，从而为搜寻解决方案提供快捷方式。然而有一个问题：机器的建议是否会影响用户，以至于用户开始用他们认为与机器一致的方式标注数据？如果是这样的话，那么标签就没用了。


    让用户扮演数据标注员的角色，效果可能也特别好。例如，可以通过添加提示，让用户为图片添加标注。一些算法也有助于从用户那里获取最有用的数据。


    - **不确定性抽样。** 标注当前模型最不确定的点。

    - **委员会质询。** 在同一标注数据上训练多个模型，然后手动标注导致模型之间的输出最不一致的数据点。

    - **预期模型变化。** 手动标注最有可能改变模型输出的数据。

    - **预期错误减少。** 如上所述，但重点关注最有可能减少模型误差的数据。

    - **方差缩减。** 如上所述，但尽量减少差异。


    这不是一份详尽的清单，还有许多基于机器学习基本概念的方法。


    交互式机器学习（`IML`）旨在创造接口，这些接口可以收集数据，以训练特定的机器学习模型，然后将结果呈现给用户，由用户决定将哪些数据放入模型中以供下一次迭代。交互式机器学习可以被认为是另一种让付费用户团队而不是带薪员工标注数据的方式。


    在开发方面，交互式机器学习有助于分类器更快迭代。工程师将根据从与用户的对话中收集的信息开发分类器。当用户对分类器进行纠正和有效培训时，迭代会更快。例如，工程师在构建一个自动撰写营销电子邮件的系统时，通常会使用自己的或在网上搜寻的一些具有代表性的电子邮件示例。然而，生成一些样本，将其放在管理电子邮件营销活动产品的营销人员面前，可以获得关于营销电子邮件好坏的更有效反馈。


    让机器以这种迭代方式向人类学习的潜在缺点是，人们可能会向机器提供没有信息的示例。这可能会使机器无法承受，导致其分类器变得不够准确。然而，开发人员可以采用保护措施，防止用户在机器中大量使用无用的示例。简单的方法包括让多个用户标注同一个数据点，或者在运行交互模型的同时，运行另一个可作为替代的非交互模型，然后，对结果进行比较，找到交互模型在何处与非交互模型发生了冲突，或忽略了非交互模型。


    开发交互式机器学习系统的一个好处是，请求用户输入数据可以建立信任。允许用户对系统的输出进行“纠正”，当看到他们的修正对系统的下一个输出产生了影响时，信任就会进一步得到强化。首先，用户将能够向自己或者他人解释（至少部分解释）系统是如何工作的，因为他们已经看到数据被输入系统，经过计算输出一个结果。其次，系统将尊重用户关于输出的——客观或者以其他方式形成的——意见。最后，用户已经看到了他们对输出的影响：一些输出正是来自他们的输入。


    ### 构建数据标签操作的最佳实践


    对于人工智能优先公司来说，建立一个团队来标注数据可能是一个核心流程优势。然而，在组建团队之前，需要考虑一下大型的、诸如亚马逊土耳其机器人（`Mechanical
    Turk`）这样的基于平台的标签解决方案。这些平台有许多来自世界各地的工作人员，他们能够应对高弹性需求，并且可以每天 24 小时标注数据。他们还能够提供工具，帮助工人保持低成本和高质量。


    #### 管理


    数据标注员是根据其具有的专业知识聘用的，而标注团队可以分为专业团队和非专业团队——前者在数据分类方面具有丰富的经验。标注员的上级是标注经理。当然，标注经理手下的标注员人数跟所需要的监督程度有关。标注经理的领导是标注主管。在中型公司，标注主管，或者说是唯一的标注经理，向运营副总裁汇报。而在小型公司，标注主管则直接向公司首席运营官（`COO`）汇报。当标注操作刚刚开始，仍在试图找出标注内容和方式时，情况可能会有所不同，在这种情况下，向机器学习研究主管或首席技术官（`CTO`）汇报可能更加合适。


    一个经验法则是，在标注没有完全自动化的环境中，每 50 名到 100 名标注员配备一名标注经理。当然，这也要看专业和非专业标注员的组合情况。


    标注操作成本取决于需要标注的数量、获取标注的难度、通过标注工具获得的杠杆效力，以及标注所需的专业程度。使用亚马逊土耳其机器人，每个标注的成本可能只有几美分；而使用医生，每个标注的成本则可能高达数百美元。


    非专业标注员无须具有太多经验，因此可以从不同的地方进行招募。招聘平台广告或小时工中介是一个很好的途径。另一个选择是直接从劳动力市场招聘，比如亚马逊土耳其机器人网站，或者自由职业者平台
    `Upwork` 等。而专业标注员则可以直接从他们各自的领域进行招聘：比如，放射科医生，或者汽车保险公司的损失理算师。


    标注经理通常拥有运营背景——也就是说，考虑到成本和时间限制，他们必须能够协调大量资源。如果团队中大部分都是非专业标注员，那么就需要对其进行激励和管理。标注经理需要具有良好的背景，比如之前负责过客服中心的运营工作等。


    #### 测量


    数据标注的最终目标是得到一个好的产品，而一个好的产品依据的则是一些准确的分类器。因此，一个关键衡量指标应该是分类器是否正在变得更准确。


    就机器学习而言，数量意味着质量。换句话说，即使大量标注中有一个标注不那么正确，依然可以提高分类器的准确度。大量标注数据本身就是资产。因此，跟踪标记的总数据点，可以为标记操作产生的值提供信息。


    标注不是免费的，商业模型需要在制造好产品的成本与收益之间找到平衡。每个标注的成本都是一个明显的跟踪指标。也许，不那么明显的是，指标可跟踪的确很好，因为它可以显示帮助标注员的工具，以及所需的专业/非专业标注员组合有多大的杠杆作用。


    标注员对特定数据点的共识可能是标注准确度的标志，因为缺乏共识意味着对准确度的测量可能是错误的。专业标注员比非专业标注员或许能够更准确地对数据进行标注。非专业标注员的准确度可以通过将其与专业标注员的准确度进行对比来获得。专业标注员的成本也比非专业标注员高，因此，要逐步调整比例，使标注工作更有利于非专业标注员，从而降低成本。随着时间的推移，模型的输出应与客户的真实数据一致；也就是说，预测应该与现实相符。如果一致性下降，就表明数据标注可能存在问题。


    #### 人在回路系统


    人在回路（`HIL`）系统需要人工输入才能生成输出，是人和机器相互作用的模式。这些系统不一定具有主动或者交互学习功能，它们只是可以让人们对放在某个地方的数据进行标注而已。主动和交互式学习系统也不一定有人参与——它可能是由一个机器人来做标注。人在回路系统是让用户标记数据的一般形式（如图
    3-9 所示）。


    ![](EPUB/images/image_034.jpg)


    图 3-9 人在回路系统


    上图即是一个人在回路系统。人们参与其中的方法有以下几种。


    - **创建。** 要求人们在“获取数据”这一步骤中创建全新的数据。例如，通过完成调查创建数据。

    - **标注。** 通过输入文本或从机器学习系统使用的标签列表中选择标签来标注数据。

    - **反馈。** 对输出进行评分，使用二进制分数（如真/假或者正确/不正确）或标量分数（如从 0 到 10 的排名）。


    #### 外包


    通过交互式机器学习系统以及将人类置于该回路之中可以提高数据标注效率。选择哪种方法取决于标记基本数据所需的专业水平、能否找到专业标注员、成本和随着时间的推移提高自动化的可能性（以及标注数据的成本对利润率的影响）。然而，有时将数据标注全部外包却是最佳选择。


    外包的最大原因是获得更多的标签。获得正确标签是一项专业技能：拥有识别特定物体经验的标注员更擅长做这样的事情。然而，对所有标注员来说，出现标注错误都是难以避免的。而解决这个问题的方法就是使用更多的标注员，这样一来，错误的标注就可以被正确的标注有效地稀释。从数学上讲，如果一个标注员在
    5% 的时间里出错，那么三个标注员犯相同错误的概率为 5%×5%×5%，或仅为 0.01%。

