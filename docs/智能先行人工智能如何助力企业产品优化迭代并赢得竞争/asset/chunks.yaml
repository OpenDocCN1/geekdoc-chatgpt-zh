- raw: '![](EPUB/images/image_051.jpg)


    图6-4 版本管理


    保留模型的版本为改进提供了基础，如果新模型不太好，那就启用旧模型。模型版本管理的挑战在于它需要与训练数据一起进行管理，因为模型与数据的交互产生了输出。数据指的是值和存储这些值的模式（所有值的共有形式），代码根据该模式调用数据库中的对象。


    我们还有显示输出和运行计算基础设施的软件代码。所以，我们有模型代码、数据值、数据模式和软件代码。从四个维度进行版本管理会产生许多排列组合。保持一个维度相对恒定会使版本回顾变得更加容易。


    模型版本管理相对简单，因为有现成的方法可以对计算机代码进行版本转换。然而，考虑到一些模型是在非常大的数据集上训练的，所以数据的版本管理就不那么简单了。我们不能使用代码版本管理工具来跟踪数据集的版本，因为它们不能处理大型无序的数据集。我们也不可能在每个节点及时存储每个数据集，因为这样做成本太高。我们不考虑对模式进行版本管理，而是利用值来对其进行推断。具有元数据管理、相似性建模和自动创建数据目录等功能的数据基础架构，使这个推断过程更加可靠。对数据进行版本控制很困难，因此，我们更倾向于第一步先将模型背后的代码版本化，对模型进行适当版本管理和向数据库添加元数据之后，再考虑进行数据版本管理。数据版本管理工具在某个时间点及时压缩和标记数据集，然后将它们存储起来。


    **重现性**


    版本管理的一个目标是重现性。对代码和模型、数据包、工具和其他依赖项的跟踪更改，可以使其他人进行复制性工作。重现性对于训练和评估都很重要，但极具挑战性，尤其是在训练阶段，而且，在使用深度学习时也非常难以处理。在很多情况下，重现性都很重要——从学术界到受监管的行业。在这些行业中，客户可能不得不复制并解释模型的输出。


    **部署**


    图6-5示意了部署。


    ![](EPUB/images/image_052.jpg)


    图6-5 部署


    有很多方法能够部署以及向客户提供预测，从打印报告开始，在他们做决定时增强其能力和信心。我们可以按照客户的思路，满足他们的要求。


    ● **报告：**以报告的形式呈现预测及解释。


    ● **电子表格：**提供预测和一些关键变量操作或更改电子表格中基础数据的方法。这可能只适用于由程序中可用的函数组成的简单模型，比如Excel。


    ● **仪表盘：**在基于网络的自动更新仪表盘中提供预测。


    ● **模板：**在基于网络的自动更新仪表盘中提供预测，并允许客户使用表单操作关键变量或上传新数据。


    ● **集成：**将预测提供给另一个应用程序，例如CRM或ERP，并在模型和应用程序之间建立一条双向数据管道，以确保预测保持最新。


    ● **应用：**在应用程序中提供预测，并允许客户操作关键变量，或使用应用程序中的按钮上传新数据。


    ● **应用程序编程接口：**通过该接口提供对预测的访问，并允许客户通过该接口提供反馈数据或上传新数据。


    ● **增强：**通过硬件（如可穿戴计算机）提供场景预测，该计算机通过眼镜、手表或投影到附近物体表面，在用户的视野中提供预测。


    **测试**


    图6-6示意了测试。


    ![](EPUB/images/image_053.jpg)


    图6-6 测试


    测试模型不如测试软件那么具有确定性。验证模型是为了弄清楚模型的输出在物理环境中是否有意义，而验证代码的目的是确保其将能够在虚拟（计算）环境中运行。测试模型包括检查假设、敏感性和数据采样，以确认它们与真实世界相符。


    上面这一切可以通过自动测试和手动测试来完成。基于规则的自动化测试采用脚本的形式，针对模型的输出进行测试：例如，猫永远不会是紫色的，可乐瓶永远不会是黄色的。自动控制组测试的形式是，使用代表“基本事实”的数据集检查模型的输出，并查看模型的预测与它的偏差有多大。手动的、人工操作的测试采取的形式是根据手动采样数据、个人观察以及常识来检查输出。输出是否正确由分析师进行判断。随着时间的推移，理想的做法是增加自动化测试覆盖率和减少手动工作，但这取决于模型操作环境的动态性，以及可以在多大程度上利用相对简单的机制对数据进行分解和解释，从而使机器更容易理解。


    大多数测试过程的第一步通常需要检查输出，看看它是否具有统计意义。制造商使用统计过程控制来管理产品质量。统计过程控制（Statistical Process Control，SPC）可以帮助管理数据质量，方法是在模型输出中发现异常结果，然后追踪数据的基本分布变化，但这在使用深度学习时非常困难。如果模型训练用的数据分布与现实世界中观察到的分布不同，那就返回并访问更好的数据，重新训练模型，并将其重新部署到现实世界中。


    测试过程的中间步骤与建模有关。根据预测可用性阈值，尝试更改模型的参数、超参数、功能、容量（数据）和训练次数（训练时间段设置）。此时，建立特征和标签之间的相关性表（也称为混淆矩阵）可能会有所帮助。可以将其视为一个“热图”，有助于人们关注模型需要改进的领域：浅色框。*x*轴（每一列）代表预测标签，然后检索带有该标签（预测标签）的模型生成的示例，以理解为什么它们可能与*y*轴（每一行）代表的真实标签产生微弱的相关性。重复使用相同的指标，尝试提高性能。理想情况下，从左上角到右下角会有一条100%的相关性线。混淆矩阵如图6-7所示。


    ![](EPUB/images/image_054.jpg)


    图6-7 混淆矩阵


    大多数测试过程的最后一步是集成测试：确保模型代码在客户的计算环境中正确执行，以及在选定的基础设施上正确执行，并作为部署所有软件代码（而不仅仅是模型代码）的过程的一部分。这一重要步骤在这里不作介绍，我相信你能找到工具和最佳实践对软件代码进行测试。


    **监控**


    导致模型性能出现问题的原因很多，从对数据库来说训练量太大，到对可用计算机内存来说模型太大，到输入验证错误，再到影响大量预测误差的大数定律。图6-8示意了监控。


    ![](EPUB/images/image_055.jpg)


    图6-8 监控


    生产监控确保了模型的质量和可靠性。质量与性能有关；可靠性与准确度和稳定性有关。在质量方面，性能问题与部署有关：代码和基础设施的质量。许多最佳实践来自软件工程，都超出了本书的范围。我们重点关注一下部署的可靠性、准确度和稳定性。


    **准确度**


    准确度、相关性和损失等统计和定量测量，对于监控生产中的模型非常有用。语义和定性测量，包括客户是否接受模型的输出，或者是否提供口头反馈，也很有用。两者结合可以显示模型是否提供了必要的预测质量。模型质量的统计和语义测量反映在模型漂移和偏差的概念中。


    **稳定性**


    漂移是指事物偏离了现实。模型脱离现实的方式有几种：


    ● 概念漂移是指预测背后的概念因为实际情况的变化而发生的改变。比如说，你认为需要对司机是否会在下午五点之前到达进行预测，以确保客户能够收到他们的货物，但实际上，你需要预测的是将货物放在客户房子的前廊里是否有被盗的风险。


    ● 数据漂移指的是预测的基本分布发生了很大的变化，致使其无法代表真实世界。例如：你认为客户全年都会购买电池，但事实证明，他们倾向于在极端天气事件后购买电池。当数据不再可用或格式不正确时，也会发生数据漂移，就像因为开发人员切断了你与应用程序编程接口的连接而丢失位置数据源一样。


    解决漂移的方法取决于漂移的类型。概念漂移需要重塑模型的功能，然后再训练，而数据漂移则需要跟踪新数据，然后重新进行训练。重做模型、收集新数据和重新训练的成本巨大，仔细测量漂移有助于你就是否承担这些成本做出明智的决定。


    用模型性能、数据质量和产品功效指标检测漂移，可以揭示可靠性低的根源。我们将在第七章“回路测量”中阐述模型性能指标，包括预测准确度方面的指标，例如F1分数。数据质量指标还包括标签覆盖率。产品功效指标可以揭示真正的客户投资回报率，比如生产线的故障率。这些指标之间的相互作用也很重要：如果数据分布发生变化，但预测仍然是准确的，这只是意味着你运气好。


    确保这些指标基准准确度的一种方法与模型训练阶段的方法类似：保留一个对照组，提供有关模型性能的基本事实数据。


    鉴于世界在逐渐或突然地，有规律或无规律地发生变化，定期测量模型漂移势在必行。只有当我们收到随时间推移的指标时，才能衡量渐进的变化；只有当我们获得近乎真实的指标时，才能衡量突然的变化；只有当我们在相同的时间间隔（例如每个季节）积累指标时，才能衡量规律性的变化。


    **偏见**


    机器学习中的偏见问题既是伦理问题，又是技术问题。我们这里讨论的是技术偏见，并对机器偏见管理进行综述。我认为管理机器偏见与我们管理人类偏见的方式相同：有严格的约束。要对模型可以预测什么、谁能使用这些预测设置约束；在设计系统时，要对反馈数据、预测用途，以及更多需要付出的努力设置限制，同时还要设置适当的提醒。另外，为训练数据设定标准可以增加其广泛输入的可能性。与模型设计师交谈是理解其方法中是否存在固有偏见风险的最佳方式。在设置这些约束后，要考虑使用诸如关闭或报警等自动操作。


    **数据质量**


    数据质量流程可以确保模型获得所需的数据。数据管道可能有很多部分，每个部分都可能会出现问题，导致模型或位于模型上层的某个部件（如仪表盘）出现故障。市场上有一些聚焦数据质量的产品，一些数据供应商会提供数据质量指标。以下是一些数据质量监控产品可以监控的内容：


    ● **缺失来源。**第三方和内部数据源有时会出现故障、被切断或者关闭。


    ● **缺少值。**模型中的函数有一定的变量，并从数据库中获取填充这些变量的值。当数据库发生变化，但从该数据库调用值的函数没有变化时，函数将无法找到值，模型将会崩溃。例如：函数会查找不存在的表名或已删除的值。


    ● **不完整数据。**有时，一个函数需要大量数据，但执行时并不需要所有的数据。当没有得到所需的数据时，它可能仍然会执行，但会产生糟糕的预测。了解缺失的数据，可能有助于我们找出不准确预测的根源。这与需要值缺少的情况不同，当缺少用于运算的值时，函数将根本不执行。


    ● **缺少标签。**人工数据标注员可能无法正确标记模型所需的数据点。数据可能被标注了，但不是以特别的描述方式：例如，将穿过街道的人标记为“人”，而不是“跳到车前的人”。模型可能会从错误的标签中进行学习，但随着时间的推移，可能就会出现问题。数据质量流程可以对标签进行检查，以确保其对模型有用。这是应对不完整数据的一个方法。


    ● **数据分布漂移。**这是数据质量监控中更细微、更高级的部分。有关数据质量流程和产品的漂移，可以使用统计过程控制和其他监控数据分布的方法进行测量。


    ● **扰动。**通过故意修改数据来预防数据质量问题，以查看它是否会进一步导致数据管道出现问题。


    **返工**


    机器学习管理回路的最后一步是根据监控结果进行调整。图6-9示意了返工。


    ![](EPUB/images/image_056.jpg)


    图6-9 返工


    有时，调整是必要的，因为世界总是在变化。在更具确定性的系统中，如机器人化的工厂生产线，可能不需要这样做，但调整从来都不是零——改变是必然的。因此，有必要了解调整模型的方法，从什么都不做到重建整个系统。


    ● **什么都不做。**模型保持不变，事实上，应该保持不变，因为它的目标是让系统回到确定性状态，比如基于规则的系统会始终将包含高度攻击性内容的电子邮件过滤为垃圾邮件，即使用户将其标记为“非垃圾邮件”也不行。


    ● **提出问题。**询问客户对准确度、数据或效力变化的理解，可能会产生有价值的调整意见。


    ● **添加数据。**直接从客户和标注员那里或者通过合成方法获取更多数据，以发现边缘用例。将后一种方法融合到模型管理回路中，甚至可以自动修复由于缺乏数据而漂移或损坏的模型。


    ● **再训练。**当基础数据是季节性的或者有已经过时的嫌疑，而且训练成本足够低时，就可以定期根据新数据重新对模型进行训练。


    ● **再修复。**如果基础分布并非因为现实的改变而发生变化时，那么，数据收集可能会出现问题，需要进行纠正，使得数据更像是正态分布或者现实的反映。例如，你一开始看到的结果是，人们只在外面非常热的时候才会进入商店，但后来才意识到，测量进入商店人数的数据传感器在天气寒冷时不起作用。


    ● **再权衡。**当基本分布的变化频率低于人们认为的代表现实所需的频率时，人们更改模型以支持更新的数据。这与周期性整修不同，因为它没有将数据重新调整到不同的分布，只是改变了权重。围绕数据设置时间窗口——例如，相关行业所谓的“季节”——使得模型只根据特定时间段的数据进行训练。


    ● **重做。**这可能意味着更改模型的预测功能或者添加功能。这让我们回到了关于预测什么的问题上来，运行数据科学实验以确定要开发哪些功能，对新模型进行回溯测试，并决定是否将它们投入使用。


    如果每次运行机器学习管理回路时你都是手动执行这些操作，那么你以后就选择自动执行上述操作。模型管理和自动机器学习系统，通常会通过持续地再训练进行自动调整。


    **重新部署**


    重新部署经过再训练、再修复、再权衡或者重做的模型，是机器学习管理回路的最后一步。将模型重新部署到部分或所有客户，添加短期测试以确保新模型不会马上失效，然后定期进行测试。如何以及何时重新部署模型是一件很重要的事情，因为它可能成本高昂，影响系统未来的评估。


    **反思**


    在运行一个或几个机器学习管理回路之后，后退一步进行反思，可以发现更好的方法来测量系统，并在将来节省时间和金钱。


    首先，要测量或记录的是模型中发生了什么变化，何时发生以及为什么发生。其次，是重新审视用于验证模型的数据集。除非对模型进行大规模更改，否则数据集应该不会发生改变，因为验证集的最初目的是为模型提供基准。再次，是否改变覆盖模型性能、概念漂移和数据漂移的任何核心测量方法。最后，询问客户新模型是否改变了他们对投资回报率的看法。


    更改数据管道可能会避免未来出现相似类型和程度的模型、概念和数据漂移。通过数据标注，系统地收集新数据或者反馈数据，可以在数据管道崩溃时保持模型正常工作。如果由于数据质量低劣而出现漂移，那就实施更好的数据治理政策。可以考虑通过频繁地更新一些或者所有数据管道来更新数据。


    ## **清单**


    这里有一个清单，除了质量（性能）和可靠性（准确度）的测量之外，还包含了该系统监控的所有内容。


    ![](EPUB/images/image_057.jpg)


    ## **本章结论：机器学习模型优化**


    让机器学习模型每天踏实地工作是相当困难的。就像我们现在管理尚未构建的软件一样，管理这些模型还需要很多工具。我看到的大多数公司都在创造自己的流程和工具，但我希望在接下来的几年里，随着生态系统的发展，人工智能优先公司的这一部分建造工作将变得更加容易。在认识了本章介绍的理想化的机器学习管理回路之后，也许你心里已经有了某种产品的规划。


    人工智能优先产品的成功实施需要考虑许多新的因素，但你不必一次就把它们全部解决掉；你可以从本章中建议的系统的某一部分开始，并取得成功。对人工智能优先产品实施之后的管理，包括开发用于训练、版本控制、部署、测试和监控的自动化系统。随着时间的推移，不断总结运行该系统的经验教训会使模型变得更好。然而，还有很多事情需要考虑：请记住，我们最终建立的是一种学习效应，这样我们就能够以多种方式整合经验教训，一点一点学习。你不必像推出软件产品那样把每件事都做到完美；你只需要管理客户的期望，不断改进预测。


    ## **本章要点**


    ◆ **让模型贴近现实。**智能系统功能强大，因为它们不断地适应、进化和产生新的数据，但你要知道，它们可能会与现实不符。不断地获得反馈可以使模型处于受控状态。


    ◆ **取得平衡。**理想的模型管理系统允许分散实验、对模型进行严格测试，并在真实数据中进行监控。


    ◆ **不要淹没在数据湖中。**确定必要的数据，引领数据访问团队，并积极管理与数据相关的供应商选择，以便快速让人工智能优先产品投入使用。


    ◆ **为每个数据集设置安全参数。**实验、测试和生产需要不同级别的安全性。受监管的行业客户可能需要在不接触数据的情况下在特定场所运行模型。


    ◆ **传感器安装外包。**传感器的安装和管理面临着严峻的后勤、工业设计、信息技术和环境的挑战。可以将其外包给跟传感器制造商合作的系统集成商。


    ◆ **沟通以确保顺利实施。**数据验证师和工程师会清除客户数据中的不当数据。数据翻译器可以呈现早期结果。两者都可以确保顺利实施和最终实现人工智能优先产品的验收。


    ◆ **让客户参与模型训练。**在每个培训步骤中展示输出可以让客户产生常识反馈和对新功能的想法。


    ◆ **客户需要模型不仅在实验室准确，而且在真实世界中也要准确。**快速整合现实世界的数据，让模型自动从这些数据中学习。


    ◆ **提高人工智能接受度是一个可以战胜的挑战。**公司应尽早广泛发布，同时确保人工智能有效运行，缩短价值实现时间，创建一个现实的路线图，提高实验参与度，提供高管教育，定期再训练，快速构建功能，手动增强（不要自动化），嵌入可解释性，适时激励，实行问责制，适当放大预算，评估使用情况，设定业务部门级别的投资回报率，并专注于实现收入（而不是降低成本）。


    ◆ **模型管理不是代码管理。**模型管理需要同时管理数据和代码，而不仅仅是代码。


    ◆ **在对数据进行版本管理之前，先对代码进行版本管理，并对元数据进行管理。**对数据进行版本管理既困难又成本高昂。要首先关注模型代码的版本管理。


    ◆ **版本管理的目标是重现性。**重现性在学术领域和受监管的行业尤为重要。添加软件包、编码工具和其他依赖项，可能会增强其他人将结果复制到版本管理系统的能力。


    ◆ **将训练、测试和生产数据分开。**对训练数据的测试总是能够得到满分。维持控制组可以让模型保持诚实。


    ◆ **以客户喜欢的形式展示预测。**形式可以是报表、电子表格、仪表盘、模板，或者作为独立的应用程序，通过应用程序编程接口，可以集成到另一个软件产品或者一块硬件中。


    ◆ **测量。**数据质量使用统计方法测量，模型质量使用准确度进行测量，而相关性则使用混淆矩阵测量。不要忘记检查代码是否与现有软件一起运行。


    ◆ **注意漂移。**无论是概念还是数据，都不要让预测与现实距离太远。


    ◆ **设置严格限制以处理偏见。**限制模型可以输出的内容、控制访问、限制反馈数据，并让所有利益相关者都清楚地了解预测的可接受用途。


    ◆ **给模型提供所需数据。**持续监视数据是否缺少来源、值和标签。在质量问题产生破坏之前，主动干扰数据以查找质量问题。


    ◆ **世界在变，模型也会变。**重新训练、修复、再权衡、重做和重新部署。以后请使用机器学习自动完成这些操作。


    # **第七章**


    # **回路测量**


    这本书关注的是如何建立一家永续经营的公司。人工智能优先公司投入资源开发数据学习效应，获得复合优势，保护自己免受竞争的威胁。这一章我们将回到起点，讨论一下如何使用正确的方法构建一家既具有可持续竞争优势又能够赢利的公司。我们已经对数据学习效应进行了定义，现在还需要制定一些对其进行测试的指标。'
