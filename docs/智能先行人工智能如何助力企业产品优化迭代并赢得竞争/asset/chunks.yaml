    你可以这样理解：尝试一种统计方法，然后将多种方法分层并交织在一起。后者是一种神经网络：一个由许多方程组成的网络，这些方程的结果会输入到它们上面一层的其他方程中，接着输入到它们上面的更多层中，以此类推。这是神经网络的“网络”部分：方程在不同抽象层之间的接口。在方程组之间产生一系列会话之前，先用一个方程进行一次对话，看看它是否回答了客户的问题。


