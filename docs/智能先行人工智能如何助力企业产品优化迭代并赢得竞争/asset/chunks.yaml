- raw: '在21世纪的第二个十年，随着数十亿台设备连接到互联网，世界上的数据量急剧增加。获取数据似乎非常重要，但获取数据的资金却十分有限。数据本身就是一项独立的宝贵资产，因为它可以提升数据学习效应。与其他战略重点相比，人工智能优先公司将更多的资金、时间和精力放在了获取数据上。但如何获取独特的数据呢？数据策略从哪里开始？本章介绍了迅速确定数据采集项目范围的数据评估方法、从何处查找数据，以及如何从头开始创建数据（如图3-1所示）。


    ![](EPUB/images/image_024.jpg)


    图3-1 获取数据


    ## **评价**


    在投资数据采集之前，需要建立一个数据评估框架（如图3-2所示）。


    ![](EPUB/images/image_025.jpg)


    图3-2 数据评估框架


    根据他人获取数据的困难程度，有五种方法可以用来评估数据的价值（与其对数据获取方的最终用途相反）：可达性、可用性、成本、时间和可替代性。


    **可达性**


    你难以获得的数据，其他人可能同样难以获得。举个例子，为了获得数据需要去一个特殊的地方，比如当地的议会办公室，手动收集纸质文件，然后复印，通过光学字符识别软件对其进行处理，最终将复印机上的图像转换成计算机可以读取的文本。


    根据与数据集相关的合同或政策，对数据未来是否难以获得进行评估非常重要。通常，这可能涉及数据所有者对来自外部访问的限制。例如，政府机构和私人供应商在开始收取访问费用或停止数据流通之前，通常会在一段时间内免费公开数据。


    **可用性**


    对其他系统来说，从特定系统提取数据所需的时间可能是一个障碍。有些系统只允许以非常慢的速度获取数据，原因可能是运行这样一个系统的成本很高，需要根据不同的速率限制对数据产品进行分级。其中一个例子就是金融市场数据，市场数据提供商只允许在特定的、相对较长的时间间隔（通常为几十微秒）内访问股票价格报价，如果想在较短的时间间隔内获取报价，客户需要支付更多的费用。付更多的钱从而更频繁地获得信息，可以让客户在利用这些数据做出重要决策时拥有竞争优势。例如，几微秒的差异可能会让人工智能优先的交易系统碾压竞争对手，从而进行有利可图的交易。


    **成本**


    数据供应商收取费用是获取数据的一个明显障碍。有时，该费用由供应商以美元为单位明确规定，但有时，收费形式却不是那么明确，可能是与数据供应商达成收入共享协议，也可能是要求访问者购买访问数据所需的昂贵软件。例如，总部位于纽约的金融数据和媒体公司彭博新闻社（Bloomberg）提供的一台终端机，每月租金高达数千美元，而它只不过是一台由一般商用部件组装而成的普通电脑。然而，通过它就可以访问金融市场高质量的实时数据。获取数据的费用有时可以以非货币形式支付，例如在访问供应商数据之前提交自己的一些内部数据。鉴于并非所有数据对每个人都具有同等价值，公司很难评估贡献数据的确切成本。然而，贡献数据要求是否对竞争对手构成障碍，可根据要求提交的最低数据量、格式，以及每行的完整性进行评估。要求越严格，竞争对手就越难贡献数据，也就越难访问供应商提供的数据。


    **时间**


    收集数据所需的时间是决定你是否会在数据收集方面领先竞争对手的关键因素。一些数据能够以一定的速度积累：例如，天气数据与太阳的公转息息相关，就业数据则由相关政府部门收集及公布的速度决定。因此，要想获得足够多这样的数据，只需长期收集即可。


    **可替代性**


    数据的可替代性或可互换性，会对其他人是否能够使用该数据实现相同的目标造成影响。可替换的数据可以被替换为不同的数据（可能更加便宜），而不会对基于该数据做出的决策的质量产生负面影响。例如，你可以使用来自任何新闻网站的文本来训练模型，以理解句子模型的一般含义。


    还有五种方法可以根据数据的最终效用（与其他人获取数据的难度相反）来评估数据的价值：持久性、准确度、维度、广度和自我强化。这不是那么明确的，因为它取决于数据的预期用途。


    **持久性**


    数据消失的速度决定了相关性。旧数据也许不再代表现实状况，因此可能会导致模型生成无效预测。例如，股票的价格几乎瞬息万变，因此，一秒钟前的价格与一微秒前的价格并不必然相关（取决于人工智能优先交易模型用于预测股价的功能）。其他类型数据的保存期限可能很长：包括珠穆朗玛峰高度在内的地图数据将不会（有太大的）变化，因此在很多年内都会保持相关性。然后是介于两者之间的情况，比如从调查中获得的消费者偏好数据。有时偏好是持久的，比如衣服的尺寸；有时是短暂的，比如可能只流行一季的款式。


    持久性可以通过更新来延长。数据供应商或者数据源更新数据的速度会影响其持久性。有时，数据供应商会根据更新率分层定价，对更新的数据收取更高的费用。持久性高的数据通常不那么有价值，因为它需要持续地更新，这会提高计算和获取更多数据的成本。


    **准确度**


    数据的准确度决定了决策的可靠性。通常，确定准确度需要手动验证数据：例如，获取产品规格数据样本，比如电源电压——只有几行字，可以根据从制造商处手动收集的数据对其进行核对。有时，为了确保数据的准确度，供应商会提供数据准确度保证。最后，还有第三方可以按行业类别或者特定要求对系列供应商的数据准确度进行验证。


    **维度**


    数据中维度的数量决定了其与决策的相关性。维度是实体对象的属性。通常，体现在数据表中的列数上。例如，人口统计数据可以包括年龄、性别和收入等。


    维度是决定价值的一个特别强大的因素；预期用途是训练一个机器学习模型，因为当模型试图学习数据中的形态和模式时，每个维度都会对其产生影响。


    **广度**


    数据的广度决定了它体现现实的程度。广度是实体数据或散点分布的数量，通常表现为数据表中的行数。广度意味着同一类型的示例更多，实体案例和边缘案例的属性也有更多变化。有时，通过连接不同来源或供应商的数据集，可以获得更大的广度，但这要求它们具有相同的属性。通常，通过排列属性并填充任何缺失的数据来组合不同的数据集，也可以获得更大的广度。


    **自我强化**


    随着时间的推移，自我强化的数据变得更有价值。自我强化体现在同一实体随时间变化的属性中，但可以用相同的方式进行测量。例如，员工的绩效反馈在某个时间点表现为一个值，在之后的某个时间点表示为另一个值，但后一个值加强了第一个值的价值。这是因为，如果两个数据点相同或趋势相同，它们会增强彼此的价值。


    **数量问题**


    获取大量数据一直是人们关注的问题，许多人经常为了获取更多的数据而放弃获得更好的数据。至于说哪种做法更好，完全取决于所做决策的类型，以及哪些模型——无论是使用人类智能还是机器智能——可能有助于做出这些决策。例如，训练一个模型识别图像中的某个东西，可能需要几百张被标注的图像，如果是未被标注的图像，则需要几十万张。因为不同的图像识别系统需要不同数量的示例和标签。在自然语言理解领域，在我撰写本书时，最先进的模型使用了4990亿个词元，而就在一年多之前，它只使用了100亿个词元。然而，识别法律合同中特定条款的模型，使用100份Word文档进行训练即可。在你读了这本书之后的几个月里，由于人工智能领域的发展，这些数字会发生变化。数据规模回报很少是线性的，这取决于决策类型以及决策所用的模型。数据量和价值如图3-3所示。


