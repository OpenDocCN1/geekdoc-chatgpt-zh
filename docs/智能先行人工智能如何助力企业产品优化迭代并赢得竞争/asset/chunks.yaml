- raw: '人类的学习能力来自一代代人所收集的信息。我们把学到的东西代代相传，这样下一代人就不必再从头学起。一代人发明了锤子，下一代人把它压扁变成一把铲子，另一代人又把铲子融化，再浇铸成一把斧头。人类也会将信息代代相传，每天都会彼此交换信息。从集体——一个网络——中获取信息，并从中提取新信息的能力，是一种跨越时间和空间的合作方式。这催生了人类的复合式成长，因为我们不用总是倒退回去重新学习，减缓我们的学习速度。你知道得越多，学习起来就越容易；通过网络获得的信息越多，你的学习速度就会越快。


    ## **机器的方式**


    如今，机器也可以组成集体——网络——来计算信息。以前，机器只是从事一些计算工作，也许还能够将输出结果存储在数据库中，当有新的信息输入时，可以进行同样的计算。现在，机器可以将输出结果输入计算机，运算之后将数据转化为信息，并通过新信息进行学习。这种学习能力随着新信息的加入而快速成倍增长，并且使第三波工具变得非常强大。用智能机器构建数据学习效应的步骤是：①捕获临界量的数据；②开发将这些数据处理成信息的能力；③将这些信息输入计算机，计算机通过对数据进行计算来学习新知识。


    公式如下：


    数据学习效应=数据规模经济+数据处理能力+数据网络效应


    用一句话来说：获取大量数据，将其处理成对决策有用的东西，并创建一个自动生成更有用数据的系统。这是一个简单的等式，也是理解本书其余部分的基础。你可以跳过下面的四个方程式，而对于那些想用更多数学术语来解释这个概念的人，可以用一个生成输出的函数来表达：


    输出=功能（数据量、数据处理能力和质量、数据网络效应）


    将其视为产生输出的操作顺序：


    输出=功能{（数据网络效应［数据处理能力和质量（数据量）］｝


    通过一个数据导数，我们可以计算数据的边际价值：


    数据的边际价值=数据网络效应价值×（每增加一个数据处理单元所增加的网络价值×每增加一个数据单元而增加的已处理数据的价值）


    取两边的对数，除以初始输出，得到一个公式，告诉我们有多少增量输出来自增量数据：


    来自增量数据的增量输出百分比=log（数据网络效应价值）+log（数据网络已处理数据的价值）+log（数据规模经济）


    这一概念的阐释表明：


    ● 这是一条价值链，通过多个步骤提高输出。


    ● 该价值链每一部分的价值都取决于该链其他部分的价值，例如，商品数据需要高度网络处理和网络增强，才能转化为有价值的资产；而差异化数据需要较少的网络处理和网络增强。


    ● 数据收集、处理和网络效应构建的需求较少。


    当数据与数据处理能力和数据网络效应相结合时，数据产生边际输出。


    商业战略术语是这样定义数据学习效应的：


    数据学习效应=供给侧输入优势+供给侧处理优势+需求侧不断增长的规模回报


    如今，数据学习效应之所以成为可能，是因为三种基质最近发生了变化。


    **数据规模经济：**大量从个人设备和工业设备上的传感器获取的数据通过互联网传输。


    **数据处理能力：**能够以合理的成本对这些数据进行计算的功能强大的计算机，以及能够在不同数据集之间建立连接的人才。


    **数据网络效应：**研究人员找到了将数据组织到网络中的方法，在网络的一个部分运行计算，然后将结果发送到网络的另一部分进行更多计算，最终形成新的信息。这是神经网络，或者更广泛地说，就是智能系统。


    有了这三种基质，数据学习效应就可以形成。现在，我们来对每一种基质进行研究，并将它们与当代的概念进行对比。


    ## **超越旧公式**


    数据学习网络效应是人工智能优先公司的首要特征，与其他形式的竞争优势相比，数据学习网络效应的复合速度更快，但我们一直未能对其定义。以为机器可以像我们一样学习，但机器有不同类型的智能，所以学习效应不是一个准确的术语。我们过去认为数据越多越好，但并非所有数据都能被处理成信息。看到社交网络快速发展之后，我们认为一切都是网络效应，所以，也将人工智能视为一种数据网络效应，但实际上，这只是数据学习网络效应概念的一个组成部分，并非其全部内涵。数据学习网络效应与学习效应、规模效应或网络效应不同。在下面的章节中我们将看到更多的词汇。


    **超越学习效应**


    经济学家对学习效应展开研究，并对其进行量化，通过学习效应这个过程，信息不断累积最终带来经济效益。以一家管理咨询公司为例，它会根据所有客户积累的信息开发战略框架进行最佳实践，构建资源分配模型。传统学习效应累积的是：


    ● 关于个人或组织的信息；


    ● 结构化或非结构化信息；


    ● 信息由人或机器处理时产生；


    ● 具有质量或数量上的效益。


    传统学习效应具有局限性：它们增长缓慢，因为非结构化信息，如图像或自由格式文本，在由机器处理之前，必须先由人对其进行处理或结构化改造。


    数据学习网络效应这样积累信息：


    ● 通过单个或多个组织；


    ● 信息是结构化的；


    ● 经由机器处理；


    ● 具有数量效益。


    数据学习网络效应几乎没有什么局限性：它们增长迅速，因为结构化的信息被输入了计算速度比人类快的机器。现代计算机可以处理多种类型的信息，而且可以进行智能化的快速学习。


    学习效应适用于知识经济：即工业革命之后，从制造业转向服务业的时代。而数据学习网络效应则是为了今天的经济，一个我们取得了几次飞跃的时代：以数字方式而不是口头方式分发信息；自动而非手动共享信息；通过思维而非仅仅通过实操进行学习；在硬件（计算机）而非“湿件”（大脑）上学习；通过多网络节点而非单节点学习。这就是人工智能优先的时代。


    **超越规模效应**


    供给侧规模回报是传统的竞争优势来源。也就是说，从供应商的角度来看，随着资产或能力的积累，产品的供应成本降低。例如，大型云提供商能够以非常低的相对成本提供计算能力，因为他们可以批量购买计算机芯片，投资建设将芯片冷却到有效工作温度的系统，并与市政谈判获得更廉价的电力。这就是通常所说的规模效应，因为规模的增加可以降低成本、降低价格、增加需求，从而获得更大的规模及其他优势。但这不是网络效应，因为将计算机连接起来并没有为客户带来更大的效用（尽管这可能会使共享网络资源更加容易，运行成本也会因此变得更低）。本质上讲，这也不是学习效应，因为其成本优势来自规模（尽管在设计计算系统和计算中心方面积累了一些专业知识）。


    数据存在规模效应，拥有大量数据可能是一种竞争优势。例如，在为了寻找销售目标而选择电话号码供应商时，选择电话号码最多的供应商当然是最佳的选择。然而，更多的数据只会使一个产品在一定程度上有用，之后其实用性就会降低，因为它实际上依靠的是相同的数据。这就是为什么数据规模经济只是数据学习网络效应的一个发端，而不是全部的原因。


    数据和信息之间的区别就是看数据是否具有边际效用。信息衡量的是它能消除多少随机的、不确定性的东西。信息具有告知功能，而数据不需要具有信息效用——它只是一个事实。并非所有数据都包含信息；如果数据不能用来改变某人的想法——解决不确定性，那就不是信息。此外，数据（事实）存在于现实世界中，但信息（经过提炼、有用、具有操作性的）却在头脑中。人工智能优先公司首先收集数据，通过内部能力，利用人工智能思维将其处理成信息。许多公司都在收集大量的数据。但只有人工智能优先的公司才能将这些数据处理成有助于回答下列问题的信息：“接下来我该关注什么？”“这项保险会花我多少钱？”以及“我什么时候可能会断炊？”。


    数据变成信息的一种方式是与其他数据位进行交互。这些交互通常发生在网络上，节点与节点交互，对每个节点都产生效用。这就是所谓的网络效应。电话网络就是网络效应的一个例子：当你给别人打电话时，你与他们互动的方式会对其产生影响。比如说，我打电话告诉你，阿米莉亚（Amelia）把腿摔断了。你又打电话给布鲁诺（Bruno），阿米莉亚的密友，请他和你一起去看望阿米莉亚。你已经对布鲁诺产生了影响。你们都是网络中的节点，信息从一个人（节点）分享给另一个人，彼此相互影响，一个人头脑中的数据转化为另一个人头脑中的信息。整个团队因此而学习并成长。


    数据也可以是网络上的节点，当数据与网络上的其他数据位交互时，会对该数据产生影响。这种交互往往通过决定相关效果的接口或协议执行。关于数据网络，数据可以：


    ● 通过接口——例如组合数据算法——与其他数据进行集成；


    ● 依据决定格式的协议，通过将信息（处理过的数据）发送到网络的其他部分进行交流；


    ● 在激励机制的作用下，为网络贡献力量。


    例如，神经网络以包含操作数据函数的算法形式为数据提供接口。分析这些接口、协议和激励有助于确定它们是否将数据转化为信息并添加到网络中。当更多的数据没有向网络添加信息时，这就不是网络效应。网络效应与规模效应如图1-1所示。


    ![](EPUB/images/image_003.jpg)


    图1-1 网络效应与规模效应


    **超越网络效应**


    从消费者的角度来看，当一种产品随着越来越多人的使用而变得更有用时，就会产生网络效应。同样，电话也是展示网络效应的好例子。如果你是唯一一个拥有电话的人，那么这个电话是没用的，只有当很多人拥有电话时，它才有用。需求增加，网络变大，产品需求量随之增加，网络规模进一步扩大。


    数据学习网络效应结合了三种竞争优势：规模、处理能力和网络效应。只有网络效应并不意味着用户能学到任何东西。网络效应和数据网络效应的区别在于添加到网络中的内容。网络效应意味着，通过向网络中添加通信节点，让一些东西变得更加有用；而数据网络效应则意味着，通过向网络中添加数据，某些东西变得更加有用。更重要的是，网络效应的边缘——节点之间的线——具有功能性和交通性，而数据网络效应的边缘则具有信息性和可计算性。普通网络效应与数据网络效应如图1-2所示。图1-2（A）网络显示的是，在节点（圆）上生成数据，并沿着边缘（线）将其传输。在图1-2（B）数据网络上，数据保存在节点上，并沿边缘进行计算，同时将信息传递给网络上的其他节点。


    ![](EPUB/images/image_004.jpg)


    图1-2 普通网络效应与数据网络效应


    两者都是网络：将事物相互连接的网络，信息通过这些连接自由流动。网络隐藏在产品的下面：有时它很简单，比如一个电话听筒；还有一些时候情况很复杂，比如脸书（现在名称为元宇宙）。这些产品本身具有自我防御特性——电话听筒的设计可以申请专利，而社交网络使用的软件受到知识产权的保护——网络本身就是一种受到保护的资产或者收入来源。这与产品下面的数据网络是一样的：有时很简单，比如一个产品信息目录；有时很复杂，比如特斯拉工厂的工业机器人。有网络效应的产品和没有网络效应的产品之间的区别在于：因为有网络效应，所以该产品更有用。普通网络和数据网络之间的区别在于：数据网络传输数据的衍生物——信息——而不仅仅是数据本身。


    ## **数据网络效应**


    数据学习网络效应将数据规模经济与数据处理能力和数据网络效应相结合。我们在第3章“获取数据”中提供了扩展数据资产的策略；从第2章“精益人工智能”开始，整本书都在提供处理这些数据的方法。现在，我们对数据网络效应进行深入的研究。


    数据网络效应有两种形式：入门级和下一级。每一级都需要在数据、人才和合作伙伴关系方面进行不同的投资。入门级数据网络效应是指，在信息价值方面，数据的添加为现有数据提供边际效益。下一级数据网络效应是指，在信息价值方面，数据的添加为现有数据在信息价值方面，提供复合边际效益，而其依靠的则是从现有数据中创建新数据的模型，例如机器学习模型。第一种是直接的，第二种是间接的。入门级数据网络效应更容易构建：只要让用户、客户和合作伙伴提供信息，向网络中添加信息即可。添加信息是数据网络具备的可以增强竞争优势的第一个因素。而下一级数据网络效应则需要构建能够自动扩大网络规模的其他系统，比如一个能够生成信息的系统。升级会带来更快的增长，因为升级是数据网络具备的可以增强竞争优势的第二个因素。表1-1显示了数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资。


    表1-1 数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资


    ![](EPUB/images/image_005.jpg)


    例如，建立入门级数据网络效应，需要收集大量有关客户产品偏好的信息。可靠的业务发展代表可以通过达成交易的方式获取产品、购买信息。而建立下一级数据网络效应，可能不需要手动收集信息，但可能需要建立一个机器学习模型，通过观察顾客的购买情况，然后推断出他们的喜好信息，进而了解他们的偏好。


    传统的网络效应是入门级的网络效应。该网络的价值是随时间（*t*）增加的节点数（*n*）的平方乘以常数（C）。这表明，网络中额外节点的边际值保持不变，但在现实世界中通常并非如此，因为超过一定规模的网络往往效应会递减。


    ![](EPUB/images/image_006.jpg)


    数据网络效应有时是这样，但有时也会随着自动生成的信息被添加到网络中而升级。升级会将上述等式中的指数更改为大于2的数字，使得网络价值增长更快。


    **入门级数据网络效应**


    当向网络中添加信息使网络上的产品更有用时，数据网络效应就出现。这与人工智能无关。这些信息对网络来说是外源性的：即来自外部的新信息。想象一个简单的数据表，然后向该表中添加另一行数据；该表现在变得更有用了，因为它有更多的数据可以分析并转化为信息。决策是在头脑中做出来的，如果人们有更多的数据可以分析，就可能会产生更好的决策。当信息有助于做出更好的决策时，这些入门级数据网络效应就会非常强大（如图1-3所示）。


    ![](EPUB/images/image_007.jpg)


    图1-3 入门级数据网络效应


    大数据时代，大约为21世纪10年代，基本上关注的是这些入门级数据网络效应，见证了存储、管理、分析和可视化海量数据技术的发展。


    实际上，当产品有效地收集信息，并向客户呈现时，这些入门级数据网络效应就产生了。这里有一个简单的例子：当你拥有更多的选择以及选择能力更强时，线上购物就会变得更加顺畅。与线上购物对应的是线下购物，即在一家百货商店买东西，那里摆放了很多产品，店员会帮你挑选产品。更多的选择来自采购清单——这不是数据网络效应。更强的选择能力来自收集、组织和展示这些产品的信息——这就是数据网络效应。电子商务网站上有每种产品的信息——例如扬声器的频率范围，或者电动牙刷的电池寿命——这里是购物的好地方。通常，产品数据以客户评论的方式呈现。每一个评论都是一条信息，让你能够从一个更为广阔的视角来看待这个产品，提高你做出明智购买决定的能力。通过阅读评论，你可以从每一位在你之前写过评论的人身上获益。当你购买了一件产品，然后写下自己的评论，那么数据网络效应就开始出现：最后一个写评论的人往往会影响你的购买决定，然后，如果你购买了产品并留下评论，现在你们都在帮助商家把东西卖给下一个人。这样一来，入门级数据网络效应就能够与向网络中添加的外部信息相结合，因此，它们需要来自外部的信息才能成长。


    **下一级数据网络效应**


    通过添加数据加上可以生成信息的其他东西——如人工智能——而使某物变得更有用时，数据网络效应便会升级。换句话说，一旦这些网络有了来自外部的数据，它们就会生成自己的信息并成长。这就是升级的力量：网络效应拥有了自我维持能力，可以以指数（方程式中的2）的倍数（方程式中的C）增长。下一级数据网络效应如图1-4所示。


    实际上，当一种产品的每一位客户都生成数据，而这些数据又被提供给将数据转化为信息的系统时，这一切就发生了。该产品的客户有效地形成了一个数据贡献者网络，并从新贡献者添加的数据中受益，因为它能够产生信息。例如，网上购物通常从搜索开始，当你能够更快地找到想要购买的东西时，购物体验就会更好。由机器学习模型驱动的搜索引擎，可以使用从人们在搜索框中输入过、点击过、购买过和积极评价过的商品中收集的数据，在搜索结果页面上灵活推送产品——力图做到首先呈现最相关的结果。无论购物者是点击搜索结果，还是忽略搜索结果，机器学习模型都会学习。


    ![](EPUB/images/image_008.jpg)


    图1-4 下一级数据网络效应


    **共享的大脑**


    入门级数据网络效应的实际情况是，人们利用自己的神经网络（大脑）来积累数据，将其转化为信息，与其他信息进行比较，学习一些东西，做出预测，进行决策，然后从决策的效果中学习更多东西。任何升级都受其大脑中神经网络的限制。在这种情况下，学习未被分享，只是做个决定，然后继续前行。有数据输入的大脑如图1-5所示。


    ![](EPUB/images/image_009.jpg)


    图1-5 有数据输入的大脑


    例如，你正在查看一个显示生产线上塑料瓶盖缺陷类型的数据面板，并将其与你亲眼在次品箱中看到的缺陷产品进行比较。你会发现，每次温度超过250℃时，塑料瓶盖的顶部都会变形。根据这一信息，你可以确定，如果将温度限制在250℃，则顶部不会变形，所以你决定对塑料挤出机的温度实施限制。这可能是一个很好的改变，但没有办法以系统化或网络化的方式从中学习。也许在未来，你会看到更少的缺陷，但也许你会忙于另一个项目。


    当我们超越自己的神经网络，利用更大的、可进行大规模计算的共有网络时，就会出现真正的升级。网络效应的扩展速度会更快，复合网络效应会更大，因为它可以在很多的地方（包括计算机上）以及更多的数据上运行。


    再次使用上述例子，你可以使用一个系统，一次在多条生产线上改变1℃的温度，通过分析塑料盖的图像来测量缺陷率，然后自动决定最佳注塑温度。该系统使用来自多条线路、传感器以及运算得出的信息，然后自动反馈到一个预测系统中，该系统对下一步运行的最佳实验做出决策。


    入门级网络效应是一种集体智慧，因为从群体中获取更多的信息，有助于做出更好的决策。这就像我们人类世世代代共享信息一样，这是人类的超级能力。而21世纪更为强劲的动力则是人工智能。通过在互联网上共享更多的信息，我们可以利用自己的智慧进行学习。


    下一级数据网络效应是一种学习速度更快的高级智能形式。跨系统共享信息，使它们能够根据更好的信息做出更好的决策。有数据输入的共享大脑如图1-6所示。


    ![](EPUB/images/image_010.jpg)


    图1-6 有数据输入的共享大脑


    **构建什么类型的数据网络效应？**


    构建数据网络效应的类型取决于可用数据、人才和客户。只需要添加数据就可以进行建设，这是入门级数据网络效应建设所具有的显著的比较优势。然而，随着时间的推移，需要更多数据来增加网络的价值——添加数据不是自动的。


    决定何时提高投资水平取决于可用数据是否能够训练出一个自我学习系统，以及客户是否会从这样一个系统的预测中受益。在这两种情况下，都有充足的理由启动数据学习效应，因为系统的集体智能会随着网络数据的增加而增加。


    ## **数据学习效应的力量**


    **数据学习效应可以使赢家通吃**'
  fmt: '

    人类的学习能力来自一代代人所收集的信息。我们把学到的东西代代相传，这样下一代人就不必再从头学起。一代人发明了锤子，下一代人把它压扁变成一把铲子，另一代人又把铲子融化，再浇铸成一把斧头。人类也会将信息代代相传，每天都会彼此交换信息。从集体——一个网络——中获取信息，并从中提取新信息的能力，是一种跨越时间和空间的合作方式。这催生了人类的复合式成长，因为我们不用总是倒退回去重新学习，减缓我们的学习速度。你知道得越多，学习起来就越容易；通过网络获得的信息越多，你的学习速度就会越快。


    ## 机器的方式


    如今，机器也可以组成集体——网络——来计算信息。以前，机器只是从事一些计算工作，也许还能够将输出结果存储在数据库中，当有新的信息输入时，可以进行同样的计算。现在，机器可以将输出结果输入计算机，运算之后将数据转化为信息，并通过新信息进行学习。这种学习能力随着新信息的加入而快速成倍增长，并且使第三波工具变得非常强大。用智能机器构建数据学习效应的步骤是：①捕获临界量的数据；②开发将这些数据处理成信息的能力；③将这些信息输入计算机，计算机通过对数据进行计算来学习新知识。


    公式如下：


    ```

    数据学习效应 = 数据规模经济 + 数据处理能力 + 数据网络效应

    ```


    用一句话来说：获取大量数据，将其处理成对决策有用的东西，并创建一个自动生成更有用数据的系统。这是一个简单的等式，也是理解本书其余部分的基础。你可以跳过下面的四个方程式，而对于那些想用更多数学术语来解释这个概念的人，可以用一个生成输出的函数来表达：


    ```

    输出 = 功能（数据量、数据处理能力和质量、数据网络效应）

    ```


    将其视为产生输出的操作顺序：


    ```

    输出 = 功能{（数据网络效应［数据处理能力和质量（数据量）］｝

    ```


    通过一个数据导数，我们可以计算数据的边际价值：


    ```

    数据的边际价值 = 数据网络效应价值 × （每增加一个数据处理单元所增加的网络价值 × 每增加一个数据单元而增加的已处理数据的价值）

    ```


    取两边的对数，除以初始输出，得到一个公式，告诉我们有多少增量输出来自增量数据：


    ```

    来自增量数据的增量输出百分比 = log（数据网络效应价值） + log（数据网络已处理数据的价值） + log（数据规模经济）

    ```


    这一概念的阐释表明：


    - 这是一条价值链，通过多个步骤提高输出。

    - 该价值链每一部分的价值都取决于该链其他部分的价值，例如，商品数据需要高度网络处理和网络增强，才能转化为有价值的资产；而差异化数据需要较少的网络处理和网络增强。

    - 数据收集、处理和网络效应构建的需求较少。


    当数据与数据处理能力和数据网络效应相结合时，数据产生边际输出。


    ### 商业战略术语是这样定义数据学习效应的


    ```

    数据学习效应 = 供给侧输入优势 + 供给侧处理优势 + 需求侧不断增长的规模回报

    ```


    ### 如今，数据学习效应之所以成为可能，是因为三种基质最近发生了变化


    - **数据规模经济：** 大量从个人设备和工业设备上的传感器获取的数据通过互联网传输。

    - **数据处理能力：** 能够以合理的成本对这些数据进行计算的功能强大的计算机，以及能够在不同数据集之间建立连接的人才。

    - **数据网络效应：** 研究人员找到了将数据组织到网络中的方法，在网络的一个部分运行计算，然后将结果发送到网络的另一部分进行更多计算，最终形成新的信息。这是`神经网络`，或者更广泛地说，就是`智能系统`。


    有了这三种基质，数据学习效应就可以形成。现在，我们来对每一种基质进行研究，并将它们与当代的概念进行对比。


    ## 超越旧公式


    数据学习网络效应是人工智能优先公司的首要特征，与其他形式的竞争优势相比，数据学习网络效应的复合速度更快，但我们一直未能对其定义。以为机器可以像我们一样学习，但机器有不同类型的智能，所以学习效应不是一个准确的术语。我们过去认为数据越多越好，但并非所有数据都能被处理成信息。看到社交网络快速发展之后，我们认为一切都是网络效应，所以，也将人工智能视为一种数据网络效应，但实际上，这只是数据学习网络效应概念的一个组成部分，并非其全部内涵。数据学习网络效应与学习效应、规模效应或网络效应不同。在下面的章节中我们将看到更多的词汇。


    ### 超越学习效应


    经济学家对学习效应展开研究，并对其进行量化，通过学习效应这个过程，信息不断累积最终带来经济效益。以一家管理咨询公司为例，它会根据所有客户积累的信息开发战略框架进行最佳实践，构建资源分配模型。传统学习效应累积的是：


    - 关于个人或组织的信息；

    - 结构化或非结构化信息；

    - 信息由人或机器处理时产生；

    - 具有质量或数量上的效益。


    传统学习效应具有局限性：它们增长缓慢，因为非结构化信息，如图像或自由格式文本，在由机器处理之前，必须先由人对其进行处理或结构化改造。


    数据学习网络效应这样积累信息：


    - 通过单个或多个组织；

    - 信息是结构化的；

    - 经由机器处理；

    - 具有数量效益。


    数据学习网络效应几乎没有什么局限性：它们增长迅速，因为结构化的信息被输入了计算速度比人类快的机器。现代计算机可以处理多种类型的信息，而且可以进行智能化的快速学习。


    学习效应适用于知识经济：即工业革命之后，从制造业转向服务业的时代。而数据学习网络效应则是为了今天的经济，一个我们取得了几次飞跃的时代：以数字方式而不是口头方式分发信息；自动而非手动共享信息；通过思维而非仅仅通过实操进行学习；在硬件（计算机）而非“湿件”（大脑）上学习；通过多网络节点而非单节点学习。这就是人工智能优先的时代。


    ### 超越规模效应


    供给侧规模回报是传统的竞争优势来源。也就是说，从供应商的角度来看，随着资产或能力的积累，产品的供应成本降低。例如，大型云提供商能够以非常低的相对成本提供计算能力，因为他们可以批量购买计算机芯片，投资建设将芯片冷却到有效工作温度的系统，并与市政谈判获得更廉价的电力。这就是通常所说的规模效应，因为规模的增加可以降低成本、降低价格、增加需求，从而获得更大的规模及其他优势。但这不是网络效应，因为将计算机连接起来并没有为客户带来更大的效用（尽管这可能会使共享网络资源更加容易，运行成本也会因此变得更低）。本质上讲，这也不是学习效应，因为其成本优势来自规模（尽管在设计计算系统和计算中心方面积累了一些专业知识）。


    数据存在规模效应，拥有大量数据可能是一种竞争优势。例如，在为了寻找销售目标而选择电话号码供应商时，选择电话号码最多的供应商当然是最佳的选择。然而，更多的数据只会使一个产品在一定程度上有用，之后其实用性就会降低，因为它实际上依靠的是相同的数据。这就是为什么数据规模经济只是数据学习网络效应的一个发端，而不是全部的原因。


    数据和信息之间的区别就是看数据是否具有边际效用。信息衡量的是它能消除多少随机的、不确定性的东西。信息具有告知功能，而数据不需要具有信息效用——它只是一个事实。并非所有数据都包含信息；如果数据不能用来改变某人的想法——解决不确定性，那就不是信息。此外，数据（事实）存在于现实世界中，但信息（经过提炼、有用、具有操作性的）却在头脑中。人工智能优先公司首先收集数据，通过内部能力，利用人工智能思维将其处理成信息。许多公司都在收集大量的数据。但只有人工智能优先的公司才能将这些数据处理成有助于回答下列问题的信息：“接下来我该关注什么？”“这项保险会花我多少钱？”以及“我什么时候可能会断炊？”。


    数据变成信息的一种方式是与其他数据位进行交互。这些交互通常发生在网络上，节点与节点交互，对每个节点都产生效用。这就是所谓的网络效应。电话网络就是网络效应的一个例子：当你给别人打电话时，你与他们互动的方式会对其产生影响。比如说，我打电话告诉你，阿米莉亚（Amelia）把腿摔断了。你又打电话给布鲁诺（Bruno），阿米莉亚的密友，请他和你一起去看望阿米莉亚。你已经对布鲁诺产生了影响。你们都是网络中的节点，信息从一个人（节点）分享给另一个人，彼此相互影响，一个人头脑中的数据转化为另一个人头脑中的信息。整个团队因此而学习并成长。


    数据也可以是网络上的节点，当数据与网络上的其他数据位交互时，会对该数据产生影响。这种交互往往通过决定相关效果的接口或协议执行。关于数据网络，数据可以：


    - 通过接口——例如组合数据算法——与其他数据进行集成；

    - 依据决定格式的协议，通过将信息（处理过的数据）发送到网络的其他部分进行交流；

    - 在激励机制的作用下，为网络贡献力量。


    例如，`神经网络`以包含操作数据函数的算法形式为数据提供接口。分析这些接口、协议和激励有助于确定它们是否将数据转化为信息并添加到网络中。当更多的数据没有向网络添加信息时，这就不是网络效应。网络效应与规模效应如图1-1所示。


    ![](EPUB/images/image_003.jpg)


    图1-1 网络效应与规模效应


    ### 超越网络效应


    从消费者的角度来看，当一种产品随着越来越多人的使用而变得更有用时，就会产生网络效应。同样，电话也是展示网络效应的好例子。如果你是唯一一个拥有电话的人，那么这个电话是没用的，只有当很多人拥有电话时，它才有用。需求增加，网络变大，产品需求量随之增加，网络规模进一步扩大。


    数据学习网络效应结合了三种竞争优势：规模、处理能力和网络效应。只有网络效应并不意味着用户能学到任何东西。网络效应和数据网络效应的区别在于添加到网络中的内容。网络效应意味着，通过向网络中添加通信节点，让一些东西变得更加有用；而数据网络效应则意味着，通过向网络中添加数据，某些东西变得更加有用。更重要的是，网络效应的边缘——节点之间的线——具有功能性和交通性，而数据网络效应的边缘则具有信息性和可计算性。普通网络效应与数据网络效应如图1-2所示。图1-2（A）网络显示的是，在节点（圆）上生成数据，并沿着边缘（线）将其传输。在图1-2（B）数据网络上，数据保存在节点上，并沿边缘进行计算，同时将信息传递给网络上的其他节点。


    ![](EPUB/images/image_004.jpg)


    图1-2 普通网络效应与数据网络效应


    两者都是网络：将事物相互连接的网络，信息通过这些连接自由流动。网络隐藏在产品的下面：有时它很简单，比如一个电话听筒；还有一些时候情况很复杂，比如脸书（现在名称为元宇宙）。这些产品本身具有自我防御特性——电话听筒的设计可以申请专利，而社交网络使用的软件受到知识产权的保护——网络本身就是一种受到保护的资产或者收入来源。这与产品下面的数据网络是一样的：有时很简单，比如一个产品信息目录；有时很复杂，比如特斯拉工厂的工业机器人。有网络效应的产品和没有网络效应的产品之间的区别在于：因为有网络效应，所以该产品更有用。普通网络和数据网络之间的区别在于：数据网络传输数据的衍生物——信息——而不仅仅是数据本身。


    ## 数据网络效应


    数据学习网络效应将数据规模经济与数据处理能力和数据网络效应相结合。我们在第3章“获取数据”中提供了扩展数据资产的策略；从第2章“精益人工智能”开始，整本书都在提供处理这些数据的方法。现在，我们对数据网络效应进行深入的研究。


    数据网络效应有两种形式：入门级和下一级。每一级都需要在数据、人才和合作伙伴关系方面进行不同的投资。入门级数据网络效应是指，在信息价值方面，数据的添加为现有数据提供边际效益。下一级数据网络效应是指，在信息价值方面，数据的添加为现有数据在信息价值方面，提供复合边际效益，而其依靠的则是从现有数据中创建新数据的模型，例如`机器学习模型`。第一种是直接的，第二种是间接的。入门级数据网络效应更容易构建：只要让用户、客户和合作伙伴提供信息，向网络中添加信息即可。添加信息是数据网络具备的可以增强竞争优势的第一个因素。而下一级数据网络效应则需要构建能够自动扩大网络规模的其他系统，比如一个能够生成信息的系统。升级会带来更快的增长，因为升级是数据网络具备的可以增强竞争优势的第二个因素。表1-1显示了数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资。


    表1-1 数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资


    ![](EPUB/images/image_005.jpg)


    例如，建立入门级数据网络效应，需要收集大量有关客户产品偏好的信息。可靠的业务发展代表可以通过达成交易的方式获取产品、购买信息。而建立下一级数据网络效应，可能不需要手动收集信息，但可能需要建立一个`机器学习模型`，通过观察顾客的购买情况，然后推断出他们的喜好信息，进而了解他们的偏好。


    传统的网络效应是入门级的网络效应。该网络的价值是随时间（`t`）增加的节点数（`n`）的平方乘以常数（`C`）。这表明，网络中额外节点的边际值保持不变，但在现实世界中通常并非如此，因为超过一定规模的网络往往效应会递减。


    ![](EPUB/images/image_006.jpg)


    数据网络效应有时是这样，但有时也会随着自动生成的信息被添加到网络中而升级。升级会将上述等式中的指数更改为大于2的数字，使得网络价值增长更快。


    ### 入门级数据网络效应


    当向网络中添加信息使网络上的产品更有用时，数据网络效应就出现。这与人工智能无关。这些信息对网络来说是外源性的：即来自外部的新信息。想象一个简单的数据表，然后向该表中添加另一行数据；该表现在变得更有用了，因为它有更多的数据可以分析并转化为信息。决策是在头脑中做出来的，如果人们有更多的数据可以分析，就可能会产生更好的决策。当信息有助于做出更好的决策时，这些入门级数据网络效应就会非常强大（如图1-3所示）。


    ![](EPUB/images/image_007.jpg)


    图1-3 入门级数据网络效应


    大数据时代，大约为21世纪10年代，基本上关注的是这些入门级数据网络效应，见证了存储、管理、分析和可视化海量数据技术的发展。


    实际上，当产品有效地收集信息，并向客户呈现时，这些入门级数据网络效应就产生了。这里有一个简单的例子：当你拥有更多的选择以及选择能力更强时，线上购物就会变得更加顺畅。与线上购物对应的是线下购物，即在一家百货商店买东西，那里摆放了很多产品，店员会帮你挑选产品。更多的选择来自采购清单——这不是数据网络效应。更强的选择能力来自收集、组织和展示这些产品的信息——这就是数据网络效应。电子商务网站上有每种产品的信息——例如扬声器的频率范围，或者电动牙刷的电池寿命——这里是购物的好地方。通常，产品数据以客户评论的方式呈现。每一个评论都是一条信息，让你能够从一个更为广阔的视角来看待这个产品，提高你做出明智购买决定的能力。通过阅读评论，你可以从每一位在你之前写过评论的人身上获益。当你购买了一件产品，然后写下自己的评论，那么数据网络效应就开始出现：最后一个写评论的人往往会影响你的购买决定，然后，如果你购买了产品并留下评论，现在你们都在帮助商家把东西卖给下一个人。这样一来，入门级数据网络效应就能够与向网络中添加的外部信息相结合，因此，它们需要来自外部的信息才能成长。


    ### 下一级数据网络效应


    通过添加数据加上可以生成信息的其他东西——如人工智能——而使某物变得更有用时，数据网络效应便会升级。换句话说，一旦这些网络有了来自外部的数据，它们就会生成自己的信息并成长。这就是升级的力量：网络效应拥有了自我维持能力，可以以指数（方程式中的2）的倍数（方程式中的C）增长。下一级数据网络效应如图1-4所示。


    ![](EPUB/images/image_008.jpg)


    图1-4 下一级数据网络效应


    实际上，当一种产品的每一位客户都生成数据，而这些数据又被提供给将数据转化为信息的系统时，这一切就发生了。该产品的客户有效地形成了一个数据贡献者网络，并从新贡献者添加的数据中受益，因为它能够产生信息。例如，网上购物通常从搜索开始，当你能够更快地找到想要购买的东西时，购物体验就会更好。由`机器学习模型`驱动的搜索引擎，可以使用从人们在搜索框中输入过、点击过、购买过和积极评价过的商品中收集的数据，在搜索结果页面上灵活推送产品——力图做到首先呈现最相关的结果。无论购物者是点击搜索结果，还是忽略搜索结果，`机器学习模型`都会学习。


    ### 共享的大脑


    入门级数据网络效应的实际情况是，人们利用自己的`神经网络`（大脑）来积累数据，将其转化为信息，与其他信息进行比较，学习一些东西，做出预测，进行决策，然后从决策的效果中学习更多东西。任何升级都受其大脑中`神经网络`的限制。在这种情况下，学习未被分享，只是做个决定，然后继续前行。有数据输入的大脑如图1-5所示。


    ![](EPUB/images/image_009.jpg)


    图1-5 有数据输入的大脑


    例如，你正在查看一个显示生产线上塑料瓶盖缺陷类型的数据面板，并将其与你亲眼在次品箱中看到的缺陷产品进行比较。你会发现，每次温度超过250℃时，塑料瓶盖的顶部都会变形。根据这一信息，你可以确定，如果将温度限制在250℃，则顶部不会变形，所以你决定对塑料挤出机的温度实施限制。这可能是一个很好的改变，但没有办法以系统化或网络化的方式从中学习。也许在未来，你会看到更少的缺陷，但也许你会忙于另一个项目。


    当我们超越自己的`神经网络`，利用更大的、可进行大规模计算的共有网络时，就会出现真正的升级。网络效应的扩展速度会更快，复合网络效应会更大，因为它可以在很多的地方（包括计算机上）以及更多的数据上运行。


    再次使用上述例子，你可以使用一个系统，一次在多条生产线上改变1℃的温度，通过分析塑料盖的图像来测量缺陷率，然后自动决定最佳注塑温度。该系统使用来自多条线路、传感器以及运算得出的信息，然后自动反馈到一个预测系统中，该系统对下一步运行的最佳实验做出决策。


    入门级网络效应是一种集体智慧，因为从群体中获取更多的信息，有助于做出更好的决策。这就像我们人类世世代代共享信息一样，这是人类的超级能力。而21世纪更为强劲的动力则是人工智能。通过在互联网上共享更多的信息，我们可以利用自己的智慧进行学习。


    下一级数据网络效应是一种学习速度更快的高级智能形式。跨系统共享信息，使它们能够根据更好的信息做出更好的决策。有数据输入的共享大脑如图1-6所示。


    ![](EPUB/images/image_010.jpg)


    图1-6 有数据输入的共享大脑


    ### 构建什么类型的数据网络效应？


    构建数据网络效应的类型取决于可用数据、人才和客户。只需要添加数据就可以进行建设，这是入门级数据网络效应建设所具有的显著的比较优势。然而，随着时间的推移，需要更多数据来增加网络的价值——添加数据不是自动的。


    决定何时提高投资水平取决于可用数据是否能够训练出一个自我学习系统，以及客户是否会从这样一个系统的预测中受益。在这两种情况下，都有充足的理由启动数据学习效应，因为系统的集体智能会随着网络数据的增加而增加。


    ## 数据学习效应的力量


    ### 数据学习效应可以使赢家通吃

    '
  trans: '

    人类的学习能力来自一代代人所收集的信息。我们把学到的东西代代相传，这样下一代人就不必再从头学起。一代人发明了锤子，下一代人把它压扁变成一把铲子，另一代人又把铲子融化，再浇铸成一把斧头。人类也会将信息代代相传，每天都会彼此交换信息。从集体——一个网络——中获取信息，并从中提取新信息的能力，是一种跨越时间和空间的合作方式。这催生了人类的复合式成长，因为我们不用总是倒退回去重新学习，减缓我们的学习速度。你知道得越多，学习起来就越容易；通过网络获得的信息越多，你的学习速度就会越快。


    ## 机器的方式


    如今，机器也可以组成集体——网络——来计算信息。以前，机器只是从事一些计算工作，也许还能够将输出结果存储在数据库中，当有新的信息输入时，可以进行同样的计算。现在，机器可以将输出结果输入计算机，运算之后将数据转化为信息，并通过新信息进行学习。这种学习能力随着新信息的加入而快速成倍增长，并且使第三波工具变得非常强大。用智能机器构建数据学习效应的步骤是：①捕获临界量的数据；②开发将这些数据处理成信息的能力；③将这些信息输入计算机，计算机通过对数据进行计算来学习新知识。


    公式如下：


    ```

    数据学习效应 = 数据规模经济 + 数据处理能力 + 数据网络效应

    ```


    用一句话来说：获取大量数据，将其处理成对决策有用的东西，并创建一个自动生成更有用数据的系统。这是一个简单的等式，也是理解本书其余部分的基础。你可以跳过下面的四个方程式，而对于那些想用更多数学术语来解释这个概念的人，可以用一个生成输出的函数来表达：


    ```

    输出 = 功能（数据量、数据处理能力和质量、数据网络效应）

    ```


    将其视为产生输出的操作顺序：


    ```

    输出 = 功能{（数据网络效应［数据处理能力和质量（数据量）］｝

    ```


    通过一个数据导数，我们可以计算数据的边际价值：


    ```

    数据的边际价值 = 数据网络效应价值 × （每增加一个数据处理单元所增加的网络价值 × 每增加一个数据单元而增加的已处理数据的价值）

    ```


    取两边的对数，除以初始输出，得到一个公式，告诉我们有多少增量输出来自增量数据：


    ```

    来自增量数据的增量输出百分比 = log（数据网络效应价值） + log（数据网络已处理数据的价值） + log（数据规模经济）

    ```


    这一概念的阐释表明：


    - 这是一条价值链，通过多个步骤提高输出。

    - 该价值链每一部分的价值都取决于该链其他部分的价值，例如，商品数据需要高度网络处理和网络增强，才能转化为有价值的资产；而差异化数据需要较少的网络处理和网络增强。

    - 数据收集、处理和网络效应构建的需求较少。


    当数据与数据处理能力和数据网络效应相结合时，数据产生边际输出。


    ### 商业战略术语是这样定义数据学习效应的


    ```

    数据学习效应 = 供给侧输入优势 + 供给侧处理优势 + 需求侧不断增长的规模回报

    ```


    ### 如今，数据学习效应之所以成为可能，是因为三种基质最近发生了变化


    - **数据规模经济：** 大量从个人设备和工业设备上的传感器获取的数据通过互联网传输。

    - **数据处理能力：** 能够以合理的成本对这些数据进行计算的功能强大的计算机，以及能够在不同数据集之间建立连接的人才。

    - **数据网络效应：** 研究人员找到了将数据组织到网络中的方法，在网络的一个部分运行计算，然后将结果发送到网络的另一部分进行更多计算，最终形成新的信息。这是`神经网络`，或者更广泛地说，就是`智能系统`。


    有了这三种基质，数据学习效应就可以形成。现在，我们来对每一种基质进行研究，并将它们与当代的概念进行对比。


    ## 超越旧公式


    数据学习网络效应是人工智能优先公司的首要特征，与其他形式的竞争优势相比，数据学习网络效应的复合速度更快，但我们一直未能对其定义。以为机器可以像我们一样学习，但机器有不同类型的智能，所以学习效应不是一个准确的术语。我们过去认为数据越多越好，但并非所有数据都能被处理成信息。看到社交网络快速发展之后，我们认为一切都是网络效应，所以，也将人工智能视为一种数据网络效应，但实际上，这只是数据学习网络效应概念的一个组成部分，并非其全部内涵。数据学习网络效应与学习效应、规模效应或网络效应不同。在下面的章节中我们将看到更多的词汇。


    ### 超越学习效应


    经济学家对学习效应展开研究，并对其进行量化，通过学习效应这个过程，信息不断累积最终带来经济效益。以一家管理咨询公司为例，它会根据所有客户积累的信息开发战略框架进行最佳实践，构建资源分配模型。传统学习效应累积的是：


    - 关于个人或组织的信息；

    - 结构化或非结构化信息；

    - 信息由人或机器处理时产生；

    - 具有质量或数量上的效益。


    传统学习效应具有局限性：它们增长缓慢，因为非结构化信息，如图像或自由格式文本，在由机器处理之前，必须先由人对其进行处理或结构化改造。


    数据学习网络效应这样积累信息：


    - 通过单个或多个组织；

    - 信息是结构化的；

    - 经由机器处理；

    - 具有数量效益。


    数据学习网络效应几乎没有什么局限性：它们增长迅速，因为结构化的信息被输入了计算速度比人类快的机器。现代计算机可以处理多种类型的信息，而且可以进行智能化的快速学习。


    学习效应适用于知识经济：即工业革命之后，从制造业转向服务业的时代。而数据学习网络效应则是为了今天的经济，一个我们取得了几次飞跃的时代：以数字方式而不是口头方式分发信息；自动而非手动共享信息；通过思维而非仅仅通过实操进行学习；在硬件（计算机）而非“湿件”（大脑）上学习；通过多网络节点而非单节点学习。这就是人工智能优先的时代。


    ### 超越规模效应


    供给侧规模回报是传统的竞争优势来源。也就是说，从供应商的角度来看，随着资产或能力的积累，产品的供应成本降低。例如，大型云提供商能够以非常低的相对成本提供计算能力，因为他们可以批量购买计算机芯片，投资建设将芯片冷却到有效工作温度的系统，并与市政谈判获得更廉价的电力。这就是通常所说的规模效应，因为规模的增加可以降低成本、降低价格、增加需求，从而获得更大的规模及其他优势。但这不是网络效应，因为将计算机连接起来并没有为客户带来更大的效用（尽管这可能会使共享网络资源更加容易，运行成本也会因此变得更低）。本质上讲，这也不是学习效应，因为其成本优势来自规模（尽管在设计计算系统和计算中心方面积累了一些专业知识）。


    数据存在规模效应，拥有大量数据可能是一种竞争优势。例如，在为了寻找销售目标而选择电话号码供应商时，选择电话号码最多的供应商当然是最佳的选择。然而，更多的数据只会使一个产品在一定程度上有用，之后其实用性就会降低，因为它实际上依靠的是相同的数据。这就是为什么数据规模经济只是数据学习网络效应的一个发端，而不是全部的原因。


    数据和信息之间的区别就是看数据是否具有边际效用。信息衡量的是它能消除多少随机的、不确定性的东西。信息具有告知功能，而数据不需要具有信息效用——它只是一个事实。并非所有数据都包含信息；如果数据不能用来改变某人的想法——解决不确定性，那就不是信息。此外，数据（事实）存在于现实世界中，但信息（经过提炼、有用、具有操作性的）却在头脑中。人工智能优先公司首先收集数据，通过内部能力，利用人工智能思维将其处理成信息。许多公司都在收集大量的数据。但只有人工智能优先的公司才能将这些数据处理成有助于回答下列问题的信息：“接下来我该关注什么？”“这项保险会花我多少钱？”以及“我什么时候可能会断炊？”。


    数据变成信息的一种方式是与其他数据位进行交互。这些交互通常发生在网络上，节点与节点交互，对每个节点都产生效用。这就是所谓的网络效应。电话网络就是网络效应的一个例子：当你给别人打电话时，你与他们互动的方式会对其产生影响。比如说，我打电话告诉你，阿米莉亚（Amelia）把腿摔断了。你又打电话给布鲁诺（Bruno），阿米莉亚的密友，请他和你一起去看望阿米莉亚。你已经对布鲁诺产生了影响。你们都是网络中的节点，信息从一个人（节点）分享给另一个人，彼此相互影响，一个人头脑中的数据转化为另一个人头脑中的信息。整个团队因此而学习并成长。


    数据也可以是网络上的节点，当数据与网络上的其他数据位交互时，会对该数据产生影响。这种交互往往通过决定相关效果的接口或协议执行。关于数据网络，数据可以：


    - 通过接口——例如组合数据算法——与其他数据进行集成；

    - 依据决定格式的协议，通过将信息（处理过的数据）发送到网络的其他部分进行交流；

    - 在激励机制的作用下，为网络贡献力量。


    例如，`神经网络`以包含操作数据函数的算法形式为数据提供接口。分析这些接口、协议和激励有助于确定它们是否将数据转化为信息并添加到网络中。当更多的数据没有向网络添加信息时，这就不是网络效应。网络效应与规模效应如图
    1-1 所示。


    ![](img/image_003.jpg)


    图 1-1 网络效应与规模效应


    ### 超越网络效应


    从消费者的角度来看，当一种产品随着越来越多人的使用而变得更有用时，就会产生网络效应。同样，电话也是展示网络效应的好例子。如果你是唯一一个拥有电话的人，那么这个电话是没用的，只有当很多人拥有电话时，它才有用。需求增加，网络变大，产品需求量随之增加，网络规模进一步扩大。


    数据学习网络效应结合了三种竞争优势：规模、处理能力和网络效应。只有网络效应并不意味着用户能学到任何东西。网络效应和数据网络效应的区别在于添加到网络中的内容。网络效应意味着，通过向网络中添加通信节点，让一些东西变得更加有用；而数据网络效应则意味着，通过向网络中添加数据，某些东西变得更加有用。更重要的是，网络效应的边缘——节点之间的线——具有功能性和交通性，而数据网络效应的边缘则具有信息性和可计算性。普通网络效应与数据网络效应如图
    1-2 所示。图 1-2（A）网络显示的是，在节点（圆）上生成数据，并沿着边缘（线）将其传输。在图 1-2（B）数据网络上，数据保存在节点上，并沿边缘进行计算，同时将信息传递给网络上的其他节点。


    ![](img/image_004.jpg)


    图 1-2 普通网络效应与数据网络效应


    两者都是网络：将事物相互连接的网络，信息通过这些连接自由流动。网络隐藏在产品的下面：有时它很简单，比如一个电话听筒；还有一些时候情况很复杂，比如脸书（现在名称为元宇宙）。这些产品本身具有自我防御特性——电话听筒的设计可以申请专利，而社交网络使用的软件受到知识产权的保护——网络本身就是一种受到保护的资产或者收入来源。这与产品下面的数据网络是一样的：有时很简单，比如一个产品信息目录；有时很复杂，比如特斯拉工厂的工业机器人。有网络效应的产品和没有网络效应的产品之间的区别在于：因为有网络效应，所以该产品更有用。普通网络和数据网络之间的区别在于：数据网络传输数据的衍生物——信息——而不仅仅是数据本身。


    ## 数据网络效应


    数据学习网络效应将数据规模经济与数据处理能力和数据网络效应相结合。我们在第 3 章“获取数据”中提供了扩展数据资产的策略；从第 2 章“精益人工智能”开始，整本书都在提供处理这些数据的方法。现在，我们对数据网络效应进行深入的研究。


    数据网络效应有两种形式：入门级和下一级。每一级都需要在数据、人才和合作伙伴关系方面进行不同的投资。入门级数据网络效应是指，在信息价值方面，数据的添加为现有数据提供边际效益。下一级数据网络效应是指，在信息价值方面，数据的添加为现有数据在信息价值方面，提供复合边际效益，而其依靠的则是从现有数据中创建新数据的模型，例如`机器学习模型`。第一种是直接的，第二种是间接的。入门级数据网络效应更容易构建：只要让用户、客户和合作伙伴提供信息，向网络中添加信息即可。添加信息是数据网络具备的可以增强竞争优势的第一个因素。而下一级数据网络效应则需要构建能够自动扩大网络规模的其他系统，比如一个能够生成信息的系统。升级会带来更快的增长，因为升级是数据网络具备的可以增强竞争优势的第二个因素。表
    1-1 显示了数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资。


    表 1-1 数据网络效应在数据、技术、人才、客户和合作伙伴方面的相对投资


    ![](img/image_005.jpg)


    例如，建立入门级数据网络效应，需要收集大量有关客户产品偏好的信息。可靠的业务发展代表可以通过达成交易的方式获取产品、购买信息。而建立下一级数据网络效应，可能不需要手动收集信息，但可能需要建立一个`机器学习模型`，通过观察顾客的购买情况，然后推断出他们的喜好信息，进而了解他们的偏好。


    传统的网络效应是入门级的网络效应。该网络的价值是随时间（`t`）增加的节点数（`n`）的平方乘以常数（`C`）。这表明，网络中额外节点的边际值保持不变，但在现实世界中通常并非如此，因为超过一定规模的网络往往效应会递减。


    ![](img/image_006.jpg)


    数据网络效应有时是这样，但有时也会随着自动生成的信息被添加到网络中而升级。升级会将上述等式中的指数更改为大于 2 的数字，使得网络价值增长更快。


    ### 入门级数据网络效应


    当向网络中添加信息使网络上的产品更有用时，数据网络效应就出现。这与人工智能无关。这些信息对网络来说是外源性的：即来自外部的新信息。想象一个简单的数据表，然后向该表中添加另一行数据；该表现在变得更有用了，因为它有更多的数据可以分析并转化为信息。决策是在头脑中做出来的，如果人们有更多的数据可以分析，就可能会产生更好的决策。当信息有助于做出更好的决策时，这些入门级数据网络效应就会非常强大（如图
    1-3 所示）。


    ![](img/image_007.jpg)


    图 1-3 入门级数据网络效应


    大数据时代，大约为 21 世纪 10 年代，基本上关注的是这些入门级数据网络效应，见证了存储、管理、分析和可视化海量数据技术的发展。


    实际上，当产品有效地收集信息，并向客户呈现时，这些入门级数据网络效应就产生了。这里有一个简单的例子：当你拥有更多的选择以及选择能力更强时，线上购物就会变得更加顺畅。与线上购物对应的是线下购物，即在一家百货商店买东西，那里摆放了很多产品，店员会帮你挑选产品。更多的选择来自采购清单——这不是数据网络效应。更强的选择能力来自收集、组织和展示这些产品的信息——这就是数据网络效应。电子商务网站上有每种产品的信息——例如扬声器的频率范围，或者电动牙刷的电池寿命——这里是购物的好地方。通常，产品数据以客户评论的方式呈现。每一个评论都是一条信息，让你能够从一个更为广阔的视角来看待这个产品，提高你做出明智购买决定的能力。通过阅读评论，你可以从每一位在你之前写过评论的人身上获益。当你购买了一件产品，然后写下自己的评论，那么数据网络效应就开始出现：最后一个写评论的人往往会影响你的购买决定，然后，如果你购买了产品并留下评论，现在你们都在帮助商家把东西卖给下一个人。这样一来，入门级数据网络效应就能够与向网络中添加的外部信息相结合，因此，它们需要来自外部的信息才能成长。


    ### 下一级数据网络效应


    通过添加数据加上可以生成信息的其他东西——如人工智能——而使某物变得更有用时，数据网络效应便会升级。换句话说，一旦这些网络有了来自外部的数据，它们就会生成自己的信息并成长。这就是升级的力量：网络效应拥有了自我维持能力，可以以指数（方程式中的
    2）的倍数（方程式中的 C）增长。下一级数据网络效应如图 1-4 所示。


    ![](img/image_008.jpg)


    图 1-4 下一级数据网络效应


    实际上，当一种产品的每一位客户都生成数据，而这些数据又被提供给将数据转化为信息的系统时，这一切就发生了。该产品的客户有效地形成了一个数据贡献者网络，并从新贡献者添加的数据中受益，因为它能够产生信息。例如，网上购物通常从搜索开始，当你能够更快地找到想要购买的东西时，购物体验就会更好。由`机器学习模型`驱动的搜索引擎，可以使用从人们在搜索框中输入过、点击过、购买过和积极评价过的商品中收集的数据，在搜索结果页面上灵活推送产品——力图做到首先呈现最相关的结果。无论购物者是点击搜索结果，还是忽略搜索结果，`机器学习模型`都会学习。


    ### 共享的大脑


    入门级数据网络效应的实际情况是，人们利用自己的`神经网络`（大脑）来积累数据，将其转化为信息，与其他信息进行比较，学习一些东西，做出预测，进行决策，然后从决策的效果中学习更多东西。任何升级都受其大脑中`神经网络`的限制。在这种情况下，学习未被分享，只是做个决定，然后继续前行。有数据输入的大脑如图
    1-5 所示。


    ![](img/image_009.jpg)


    图 1-5 有数据输入的大脑


    例如，你正在查看一个显示生产线上塑料瓶盖缺陷类型的数据面板，并将其与你亲眼在次品箱中看到的缺陷产品进行比较。你会发现，每次温度超过 250℃时，塑料瓶盖的顶部都会变形。根据这一信息，你可以确定，如果将温度限制在
    250℃，则顶部不会变形，所以你决定对塑料挤出机的温度实施限制。这可能是一个很好的改变，但没有办法以系统化或网络化的方式从中学习。也许在未来，你会看到更少的缺陷，但也许你会忙于另一个项目。


    当我们超越自己的`神经网络`，利用更大的、可进行大规模计算的共有网络时，就会出现真正的升级。网络效应的扩展速度会更快，复合网络效应会更大，因为它可以在很多的地方（包括计算机上）以及更多的数据上运行。


    再次使用上述例子，你可以使用一个系统，一次在多条生产线上改变 1℃的温度，通过分析塑料盖的图像来测量缺陷率，然后自动决定最佳注塑温度。该系统使用来自多条线路、传感器以及运算得出的信息，然后自动反馈到一个预测系统中，该系统对下一步运行的最佳实验做出决策。


    入门级网络效应是一种集体智慧，因为从群体中获取更多的信息，有助于做出更好的决策。这就像我们人类世世代代共享信息一样，这是人类的超级能力。而 21 世纪更为强劲的动力则是人工智能。通过在互联网上共享更多的信息，我们可以利用自己的智慧进行学习。


    下一级数据网络效应是一种学习速度更快的高级智能形式。跨系统共享信息，使它们能够根据更好的信息做出更好的决策。有数据输入的共享大脑如图 1-6 所示。


    ![](img/image_010.jpg)


    图 1-6 有数据输入的共享大脑


    ### 构建什么类型的数据网络效应？


    构建数据网络效应的类型取决于可用数据、人才和客户。只需要添加数据就可以进行建设，这是入门级数据网络效应建设所具有的显著的比较优势。然而，随着时间的推移，需要更多数据来增加网络的价值——添加数据不是自动的。


    决定何时提高投资水平取决于可用数据是否能够训练出一个自我学习系统，以及客户是否会从这样一个系统的预测中受益。在这两种情况下，都有充足的理由启动数据学习效应，因为系统的集体智能会随着网络数据的增加而增加。


    ## 数据学习效应的力量


    ### 数据学习效应可以使赢家通吃

