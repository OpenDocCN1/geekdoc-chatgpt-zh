- raw: '● **操控。**建模、聚类、回归、模拟和可视化。


    ● **运作。**优化、产量管理、制造、工程、系统、互动、预测和决策。


    ● **学习。**信号处理、控制工程、统计力学、系统等。


    ## **如何支持他们？**


    毕竟，只有动机明确的人——数据科学家或软件工程师——才会想要解决有意义的问题。就问题进行沟通、向领导层阐明里程碑式工作的重要性、确定解决问题的工作优先级，并向客户提供解决方案，都会激励数据科学家做好工作。


    数据科学家和机器学习工程师离不开数据，因此，及时获取结构良好的数据，是支持人工智能优先团队的首要方式。这本书关注的不是如何进行最佳的数据管理，而是从我们对数据收集和管理模型的讨论中推断出最佳的数据管理方法。


    给团队提供正确的工具可以帮助他们做好工作。个人数据贡献者通常有自己喜欢的工具，而新工具也会定期出现。此外，没有通用工具。表4-2是个人贡献者可以用来解释多样性、成本和功能的工具表。


    表4-2 个人贡献者可以用来解释多样性、成本和功能的工具表


    ![](EPUB/images/image_039.jpg)


    ▼续表


    ![](EPUB/images/image_040.jpg)


    ## **人工智能优先管理**


    人工智能优先公司可能需要新型经理。表4-3显示了人工智能优先数据科学家团队人员管理要求，与传统软件工程师团队管理的要求有所不同。


    表4-3 人工智能优先数据科学家团队人员管理要求


    ![](EPUB/images/image_041.jpg)


    一般来说，工程师和数据科学家需要不同类型的管理，原因如下：


    ● 工程师的任务是实现特定的目标，比如研发一个功能，而数据科学家则是设法提出并解决问题，比如为什么会发生某些事情。可以使用瀑布图和代码行等方法和指标跟踪工作进程，帮助工程师实现目标。提出并解决问题十分困难，因为答案是未知的，所以目标往往是飘忽不定的。


    ● 工程师用代码交付具体的工件。数据科学家以电子表格数字、演示文稿图表、编码模型，或亲自讨论的形式提供结果。因为追求的结果不同，所以工作进展可能很难衡量；而因为问题一直在变化，所以不会有正确答案。


    ● 工程师需要某些工具来完成工作，因此，经理们通常会为团队定制工具包。数据科学家可能会根据他们要做的工作选择不同的工具，并在需要使用不同方法时对这些工具进行更换。


    ● 工程师从客户或产品经理那里获得规格参数，满足这些要求，然后交付结果。数据科学家无法获得规格参数，因此，他们需要定期召开会议，对客户想要他们解决的问题进行优化更新。


    ● 工程师编写代码以便在共享计算资源上运行。数据科学家最终可能不会在共享的计算资源上运行他们的模型；相反，他们会在自己的计算机上建立模型。


    ● 运行智能系统所需的计算资源可以比软件代码大得多。数据科学家可能需要更大的预算，为了获得他们所需的计算资源，有时候还需要特批的物资采购，这可能需要更多的行政支持和参与。相对来说，考虑到潜在的高成本，他们可能需要对计算资源的利用进行更严格的控制。


    具体来说，管理工程师和管理数据科学家的差异，取决于他们在人工智能优先团队里的具体角色。


    ● **数据基础设施工程师：**差异不大。由管理工程师的人管理。


    ● **数据工程师：**有些差异。由管理工程师的人员管理，但可能需要管理公司数据资产的人员（如首席数据官）进行协调。


    ● **数据分析师：**差异不大。由分析或商业智能领导者管理，或由业务部门内的经理管理。


    ● **数据科学家：**不同。由不具备分析专业背景的领导者管理非常困难，因为这项工作更具实验性，涉及先进的分析方法。由工程人员管理也很困难，因为大部分工作是数学而不是工程。因此，最好由那些有量化背景和管理研究人员经验的人来管理。


    ● **机器学习工程师：**不同。需要工程管理人员管理，因为该角色涉及编程和在共享基础设施上运行模型。然而，机器学习工程师需要一些不同的机器学习专用工具。


    ● **机器学习研究员：**差异非常大。由工程人员管理很困难，因为他们大部分工作是数学而不是工程。最好由那些有量化背景和管理研究人员与数据科学家经验的人来管理。


    ## **人工智能优先公司**


    将人工智能人才安置在他们可以了解真实世界问题的地方。设计一个组织结构，将最好的数据科学和机器学习员工安置在业务部门，从而将其变成人工智能优先公司。我们所要做的就是在中心化和去中心化之间做出选择。


    中心化人工智能优先团队有一名高层领导，比如首席数据官，负责管理公司的所有数据科学、分析和机器学习人员。首席数据官与首席技术官以及首席信息官协作，决定使用哪种数据基础架构。对数据、报告、分析工具和预测模型的请求都会提交给这个中央单元，由其决定应该满足哪些请求。许多公司在创建人工智能优先公司的初期选择中心化模式。这一模式的最大好处是集中制定有关数据基础设施、管道和项目的决策，使得数据科学家和机器学习工程师可以有效地进行合作解决困难问题。这一模式的缺点是向公司其他部门提供数据的速度下降，从核心信息技术预算或团队获得资源的渠道受到限制，以及缺乏从数据科学家到领域专家的知识迁移。


    去中心化人工智能团队有一个业务部门负责人，例如总经理，负责管理该部门交付的核心产品。数据科学家和机器学习工程师与该业务部门的其他人合作开发项目，这些人既有领域专业知识，又能持续接触客户。这可能是一个关键的好处，因为人工智能通常需要来自领域专家的启发、来自现实世界的数据和来自客户的反馈，才能达到足够的准确度，从而具有实用性。去中心化的缺点可能包括使用不具备构建智能系统所需功能的共享信息技术基础设施、数据碎片化、无法从公司内部获得补充数据、高管参与基于人工智能的项目有限，以及缺乏从领域专家到人工智能专家的知识迁移。


    两种模式还可以相互结合，在聘用人工智能优先团队、将其部署到整个组织、建立数据基础设施、管理数据和决定要执行的项目方面，进行了一定程度的协调，但在如何利用数据和机器专家方面，最终还是要听从业务部门经理的意见。


    人工智能优先公司将人工智能人才分布到组织的各个部门，让人工智能为其所有产品提供支持，并使用支持人工智能的计算基础设施。他们还拥有去中心化的数据科学和机器学习功能，以及一个为整个公司制定数据战略的管理团队。然而，并不是所有的公司都是以构建人工智能优先公司为起点的，因此，在这段旅程中，不同的公司可能处于不同的起始点。人工智能优先公司如图4-1所示。


    ![](EPUB/images/image_042.jpg)


    图4-1 人工智能优先公司


    ## **本章结论：传播数据科学**


    我每周都在初创企业和上市公司与高管们进行交流，他们在创建人工智能优先公司的道路上都处于不同的航点，但行动迅速和行动迟缓的人之间的区别在于思维方式：那些不断将工业与技术相结合的公司，正在建立人工智能优先公司。对管理人员来说，在一个组织中嵌入人工智能人才是一项严峻的挑战，但要想成为人工智能优先世纪的一位重要角色，这个问题值得解决。


    构建人工智能优先团队，是人工智能优先公司的核心要务，但却没有完美的样板可以遵循；也没有唯一正确的做事方法。按本章所述的方法可以让公司找到合适的候选人，对他们进行恰当的管理，并围绕他们建立一个组织。公司对所涉及的任务有一个透彻的理解，有助于精准招聘，或许能够招聘到计算机科学之外的人才。熟悉他们的工作有助于管理和支持他们，并最终将其融合到整个组织中。


    ## **本章要点**


    ◆ **人工智能优先公司需要一个多元化的团队来管理不同的技术。**管理人工智能技术所需要的能力来自这些人员：数据基础设施工程师、数据工程师、数据科学家、数据分析师、机器学习工程师和机器学习研究员等。


    ◆ **人工智能优先团队需要具备不同技能的人。**数据科学、统计、数学、物理、计量经济学和经济学等领域的专业人员，能够更好地理解人工智能的基本原理，并将其在现代计算基础设施上运行。


    ◆ **人工智能优先团队需要人工智能优先工具。**为数据科学家和机器学习研究人员提供笔记本电脑、框架、云服务、预训练模型、数据标签、数据准备和可视化工具，可以帮助这些团队顺利完成工作。


    ◆ **工程师和数据科学家需要不同类型的经理来管理。**数据科学家和研究人员都会提出问题，但分析和得出结果的方式不同。数据科学家使用电子表格数字、演示文稿图形、代码模型和亲自讨论的形式发布结果。他们无法从商业用户那里得到需求，所以需要定期开会沟通。他们可能需要一个更大的预算，以及临时采购许可——当然，也需要相应的监督。这与软件工程师不同，软件工程师能够从商业用户那里得到清晰确定的目标，知道必须交付什么样的成果。


    ◆ **人工智能优先公司由人工智能主导。**人工智能优先公司将人工智能人才安排在公司的每个岗位，让人工智能为所有产品提供支持，使用支持人工智能的计算基础设施，将数据科学去中心化，同时拥有一支为整个公司制定数据战略的行政团队。


    # **第五章**


    # **建模**


    到目前为止，我们已经对竞争优势进行了定义，引入了新的、独特的竞争优势形式，展示了如何对其进行测量，并给了你一张建设蓝图。


    数据学习效应=数据规模经济+数据处理能力+数据网络效应


    我们在第三章中讨论了数据学习效应方程的第一部分，“获取数据”；在第四章中讨论了第二部分，“人工智能优先团队”；第二章讨论的是“精益人工智能”；第六章将讨论的是“模型管理”。本章我们要讨论的是数据学习效应方程的第三部分：如何使用机器学习、神经网络和其他跨数据网络执行操作的技术，来构建数据网络效应。


    首先，让我们再看一下数据网络图示（图5-1）。


    ![](EPUB/images/image_043.jpg)


    图5-1 数据网络


    现在，我们将注意力转向这些边缘（线）上发生的事情。这一切都与通过构建机器学习模型来制定增强竞争优势战略有关。


    人工智能领域发生突破的速度令人吃惊。可以使用的机器学习方法很多，而且许多都是模型，稍做调整就可以用于数据处理。使用什么方法以及如何对其进行调整，取决于要处理的数据和要解决的问题，但所有这些都会强化学习，增加智力，有些甚至会通过积累独特的数据来创造新的资产。这就是人工智能优先公司将构建模型置于其他研发工作之上的原因。


    下面是一些特定方法生成数据的示例。这些例子和附带的基本知识，可以为商业领袖提供指导，帮助其更好地理解机器学习的潜在战略价值，而非指导他们做出技术决策。


    ## **基本知识**


    机器学习使计算机智能化，使其能够做许多人类能够做的事情，而且是大规模地做，此外，正如我们将看到的那样，它还会做人类无法做到的事情。开发机器学习模型需要大量的前期工作。首先，根据一个输出变量来正确地构建问题：预测会有多少标签，以及是否要找出相关性或者进行分类。其次，通过计算和编程使机器学习模型可以识别事物的特征。在机器学习（和统计学）中，一个特征是一个潜在相关性因素，一个标签就是一个输出。


    有时，人们可以在没有太多帮助的情况下，简单地设计出一些有用的特征。例如，眼睛的瞳孔是一个小的黑色圆圈。因此，在构建识别眼睛的机器学习模型时，可以加入这样一个特征，一旦给定的图像描绘的是一组几何圆形的黑色（十六进制值#000000）像素时，该特征就会被激活。


    有时候，特征工程需要有特定领域的专家参与。我们都认识瞳孔，却无法识别其中的病变。以心脏左心室肥大为例，左心室肥大的人通常没有症状，而实际上左心室的肌肉壁在逐渐变大变厚，阻碍了含氧血液向身体其他部位的输送。构建利用超声心动图识别这种情况的模型特征工程，需要医学专家的支持，因为他们知道左心室的位置，什么样的厚度才会损害心脏的功能。然后，该模型可以将传入图像与这些参数关联起来，并标记出左心室肥大的潜在病例。总之，实践中的许多机器学习都涉及相关性，领域专家需要提供并验证相关假设，说明为什么相关性实际上可能就是因果关系。


    此外，有些东西很难用机器术语来定义。在某些情况下，人们可以识别物体，但不能识别其特征；通过将模型应用于噪声数据，机器通常能够清晰地识别特征，但我们却做不到这一点。例如，我熟悉一匹斑马，但我无法告诉你它身上黑色条纹和白色条纹之间的间距。不过，假如想让机器从一群斑马中识别出这匹斑马的话，那我们就必须弄清楚这种间距。然后，就可以给它一组斑马的图像，使其根据条纹间距把这匹斑马找出来。


    我们可以通过给机器一组标有输入和输出的数据，来监督机器对特征的学习情况。例如，图像A是斑马，图像B不是斑马。然后，经过对A图像和B图像的扫描，机器能够从中找到一组特征，即A图像中黑白条纹间距。


    机器也可以在完全无监督或半监督的情况下，对未标注的数据集进行处理。机器将使用各种方法，通过人工编程，对数据进行分组，最终将数据组与事物的重要特征对应起来。


    以下是构建监督机器学习模型时对特征进行定义的方法：


    ● 有时，那些特征一目了然，任何人都可以识别；


    ● 如果不明显，就请领域专家对其进行定义；


    ● 如果依然不明显，就编写一个算法，通过研究标记元素来找出一些特征；


    ● 如果还不行，就使用其他不需要特征或标签的方法。


    大量显著的、预测性的特征，会让机器学习模型更准确。因此，在开发模型时，通常会采用上述三个步骤。然而，增加特征的数量会增加模型与训练模型所用数据之间过拟合的可能性。无论输入什么数据，我们的目标都是增加可以提高预测能力的特征的数量。


    现在，让我们探讨一下机器学习方法的类型，以及每个类型是如何创造数据网络效应的，该效应是数据学习效应的第三个组成部分。


    ## **挑选**


    目前使用的机器学习主要有五种类型。监督学习和无监督学习这两种类型在每一个层面的人类参与程度都不相同。强化学习是一种与监督学习和无监督学习在功能上不相同的方法。迁移学习和深度学习与其他类型有重叠。表5-1显示了学习类型与条件的匹配关系，这一关系取决于手头的数据、所需的解释能力，以及现有的预测问题的知识。


    表5-1 学习类型与条件的匹配关系


    ![](EPUB/images/image_044.jpg)


    ▼续表


    ![](EPUB/images/image_045.jpg)


    ## **复合**


    预测方法多种多样，每种方法都以不同的方式生成和积累数据。下面是一些常见的方法，以及作为模型输出的新数据生成、积累，并用于模型训练的过程。


    **多元学科**


    归纳逻辑程序设计（Inductive Logic Programming，ILP）：形式逻辑是一种相对简单的智能形式。程序员创建一系列代表数据的规则，然后程序根据这些规则生成数据。不过，数据只有在成功完成实验之后才会生成。至于数据积累，在程序员设计新规则或使用现有规则进行新实验之前，数据不会自动累积。


    **统计分析：**统计分析方法也有很多，比如回归分析，该方法对于建立数据分类规则非常有用。在数据创建方面，分配给数据点（如人口统计元素）的类别是元数据，在构建另一个预测模型时可能很有用。但是，这里没有自动的数据积累，而这些方法在实验中查找机器学习模型的特征或者数据清洗时会十分有效。


    **决策树：**决策树是由树枝和树叶组成的。树枝是关于数据集组件的更一般性的观察；树叶是分析的特定目标。通过创建和使用不同的分类或者运用回归可以从树枝到达树叶。不过，分类取决于在计算离散数据时采用离散化数据分桶（例如，使用回归）或是采用连续数据分桶。有了这些类别和数字，观察（树枝）就变成了预测（树叶）。就数据创建而言，在构建决策树的过程中创建的类可以是有价值的信息，它们不仅对运行该树有用，而且对在同一领域或类似领域做出其他决策也有用。也就是说，向一段数据中添加一个类或数字是一种元数据形式，在构建另一个预测模型时可能很有用。至于数据积累，决策树可以通过向树中添加某种程度的递归，以越来越快的速度生成数据；也就是说，重新审视自己，然后决定是否用新叶代替旧叶。


    **决策网络：**它们是对有限的、连续决策问题的图解，图中包含决策中的变量以及某些结果的效用度量——也就是说，决策方式决定结果。决策网络通常被构建成一个有向无环图（也就是说，每次运行时，在点之间跳跃，而不是以相同的循环模式运行）。从本质上说，这是一个巨大的、充满可能性的网络，可以在一个方向上进行穿越。贝叶斯网络是一种决策网络，其中分配给图的每个部分的概率取决于决策周期早期发生的事情，因此图的每个节点上都有一个概率函数，它从之前的节点获取值。在数据生成方面，决策网络可以从数据中推断网络结构、权重、未观测变量和概率分布。该网络以及应用该网络的每个部分的分布，可以用于做出其他决定。当涉及数据积累时，在网络的每次运行中都可以推断出新的权重和参数，因为这些将根据之前网络运行时所做的决定而改变。


    **进化算法：**生物学激发了许多类型的机器学习，而进化激发的却是一类包含遗传算法的系统。这些系统通过挑选在每次迭代中产生最佳结果的算法，然后在下一次迭代中使用它们，逐渐缩小候选算法的范围，从而找出最佳解决方案。在数据生成方面，进化系统在每次迭代中都会生成输出数据，而在数据积累方面，进化系统将继续以越来越快的速度生成输出数据，直到指令停止。


    ## **机器学习**


    前馈神经网络（Feedforward Neural Networks，FNNs）：这些网络朝一个方向运行——向前。在数据创建方面，前馈神经网络在每次运行时创建一个预测。在数据积累方面，前馈神经网络不会以越来越快的速度积累数据，因为网络不会自动重复运行，不会随时间的推移自动添加特征。


    递归神经网络（Recurrent neural networks，RNNs）：就初始结构而言，它们类似于前馈神经网络，但可以应用于长度不确定的输入序列，使用的方法是用处理先前数据之后的状态来影响当前输入的处理。在数据创建方面，递归神经网络在输出时——通常是在模型达到一定精度时——创建预测。在数据积累方面，尽管准确度在不断变化，但递归神经网络会在网络的每一次自动运行中生成预测。


    卷积神经网络（Convolutional Neural Networks，CNNs）：它们类似于前馈神经网络的更深层版本，因为在生成输出之前，需要在许多层上执行微分运算。在数据创建方面，卷积神经网络可以学习问题的特征，即使这些特征不能提高生成它们的模型的准确度，这也是有价值的。在数据积累方面，卷积神经网络每次自动运行都会累积这些特征。这些特征不是数据，而是信息；这些特征可以用来确定下一步要探索什么，以及如何通过下次应用不同的模型从增量数据中获得更多价值。'
