    ## 单位分析


    衡量赢利能力的第一种方法是以单位为基础来衡量。单位分析很简单：选择一个单位部门并分析其赢利能力。由于商业模式不同，每个企业的相关赢利单位是不一样的。例如，制造一些能减少机器能源消耗的东西，可能考核的是按节能百分比收费。因此，减少能源消耗的单位将是每一台机器，测量的基础是每台机器的能源使用量。


    商业模型可能基于一系列改进和多层次定价模型，因此，选择客户作为单位通常是有意义的。这意味着将与该客户相关的所有收入和费用分配给该单位。分配收入很简单——这只是每个客户的营业额——但是，分配成本通常涉及跟踪所有销售、售前工程、数据集成、产品集成、训练、客户特定的功能工程、客户特定的模型训练、客户成果、客户服务，以及该单位的其他成本。根据该单位的收入和支出，计算其毛利润（见表7-3）。


    表7-3 计算毛利润（美元）


    ![](EPUB/images/image_077.jpg)


    ▼续表


    ![](EPUB/images/image_078.jpg)


    单位分析的目标是增加该单位的毛利润。这意味着，首先，以边际贡献衡量，所提供的产品是有利可图的，然后使客户大体上赢利，核算提交产品所需服务的成本。


    计算该单位的净利润要复杂得多，因为从研发到办公空间的所有成本通常不可能都分配给特定的客户。我们将在下面介绍这一点。


    ## 投入成本分析


    每个企业都使用投入来获得产出。输出预测的公司把钱花在了作为输入的数据上。分析数据输入的成本是产生利润的必要条件。


    数据不是新的就是旧的。新数据来自标注；旧数据来自管道。


    ### 数据标注


    数据标注由专家和非专家或机器完成。专家的工作是标注需要特殊知识才能识别的事物，比如身体中的一根骨头。拥有此类专业知识的专家的聘用成本可能会很高，因此，这些标注的单位成本更高。非专家主要标注不需要特殊知识的东西，比如椅子或盒子。非专家在工作方式上比较灵活，可以在各种平台上聘用，最著名的是亚马逊土耳其机器人。机器可以在没有我们帮助的情况下进行标注，它们能够达到的准确程度取决于所使用的技术和需要标注的数据。


    第一个指标是每个价值单位的标注成本。这一点在将标注外包给供应商时是明确的——供应商的账单是多少，成本就是多少。但当客户聘用标注员，或者在训练过程中因出现故障而要软件工程师参与数据标注时，成本就会高一些。在后一种情况下，要搞清楚员工准备训练机器学习模型需要的数据所花费的成本，并将用于标注的成本分配给特定价值单位的输入成本，例如客户的项目。


    第二个指标是专家和非专家标注之间的差异，及其随着时间的推移而发生的变化。假设专家比非专家更昂贵，而随着时间的推移，我们又必须标记相同数量的数据，那么就必须清楚如何在专家和非专家标注之间找到平衡。关键指标就是专家和非专家的一致率。也就是说，如果非专家的水平在很大程度上与专家的水平一样，那么就将更多工作转移到非专家身上，并获得相同的标注准确度和模型性能。


    使用机器可能比聘用人工更便宜，因此，值得探索主动学习等技术和半监督学习形式，如生成性对抗网络。


    最后，如果仍然有大量数据需要标注，那么，就可以探索使用机器生成合成数据。合成数据生成系统可以在一个包中生成数据和相关标签。


    ### 数据管道


    从客户那里获取旧数据，需要构建从客户数据到机器学习系统的管道。这些管道的建造需要时间，但是，这种工程时间成本或者将其外包给系统集成商的成本，可以在客户关系的整个生命周期内进行分摊，因为这些管道（通常）一经建造就可以固定下来。将工程时间成本归因于价值单位，例如客户项目，有助于确定该客户是否有利可图。


    有时候，并不只是构建管道那么简单，还有许多其他工作要做，例如，手动输入数据等。


    降低管道建造成本的一种方法是构建自动化集成软件，训练低级别工程师进行数据集成，选择只与拥有更常见类型的数据存储客户（由此获得低成本，甚至免费管道）或外包客户合作。


    ## 研发成本分析


    科技公司的研发预算可能非常重要。构建可供所有潜在客户使用的软件的成本通常被认为是研发成本而不是销售成本（Cost of Goods Sold，COGS），一些大型老牌公司将25%的资本用于研发。将费用归类为研发费用而非销售成本，分别影响净利润和毛利润。


    与软件开发相关的费用分类很困难，而且经常引起争议，很难说哪些功能和代码任务是维护客户或吸引潜在客户所必需的。


    人工智能优先公司的开支超出了软件功能的开发，例如，手动调整模型的功能或数据清洗，如果这些功能可以被转换到一个可以跨客户工作的全球模型上，或者如果传入的数据提高了模型的整体性能，那么这可以说是研发。


    那么，人工智能优先公司如何管理研发费用呢？分解研发工作，看看哪些是有效的。机器学习研究人员和工程师致力于提高所有客户使用的模型的性能，或定制一个模型，使其适合特定客户。在后一种情况下，赚取更多的钱是主要问题。一方面是确保向客户收费，用于定制功能开发；另一方面，力争在足够短的时间内完成这项开发工作，在工程师的有效时薪上赚取100%或更多的利润，至少能够支付他在公司里的“全部”费用。在前一种情况下，挣更多的钱是一项更为艰难的任务。弄清楚什么有效，确保研发人员确实在开发有可能改善模型整体性能的功能。这似乎颇具挑战性，但只需要应用科学的方法即可。也就是说，形成一个假设，即添加一个特征或者一些数据等，看看什么样的努力会产生什么样的结果，比如提高准确度、稳定性，以及其他，等等。然后进行实验并努力跟进。例如，在98%的时间里，当机器试图使用监督学习来识别麦片盒上的品牌时，可以先在低光照下或者特殊角度拍摄的麦片盒标签图像上对模型进行训练，然后让经过训练的模型对真实示例进行识别，以查看准确度是否全面提高。有时，领域专家已经学会了探索法——利用从工作中收集的东西——通过在功能中硬编码实现快捷的实验方式，比如：“每当看到瓶盖脱落1毫米，我们就知道瓶子生产的下一步会强行终止，所以整个生产线也将停下来。”如果有人能够在其职业生涯中反复学习，他可能就不需要一个模型来学习做出这样的预测。


    # 本章结论：飞轮优先


    如果你想要做正确的事情，就必须能够对事情进行正确的衡量。我看到那些试图把人工智能放在首位的公司失败了，因为他们追求的终极目标不是强化核心的数据学习效应。而当我看到数据学习回路的强大力量时，这种感觉变得更加强烈。更普遍地讲，人工智能优先公司的管理系统还处于起步阶段——该行业还没有制定出合适的规则——因此，我与公司合作开发我们自己的产品，确保能够建立可持续发展的企业。我已经看到，有些公司使用本章中探讨的指标，将他们的公司变成了富有价值的公司。


    如果你将某物视为一个动态系统，那么，当它不可避免地发生变化时，你就不会感到那么惊讶。利用飞轮让数据学习效应转动起来之后，它们便开始循环——而且随着每一次的重复进行自我强化。然而，有时飞轮很难转动起来，原因很多，包括采用人工智能的固有风险、对其性能的期望太高、可用数据太少无法对其进行训练，以及无法获得足够的数据以保持其处于最新状态。你可以使用本章中的框架和指标，选择要解决的正确问题，你也许就可以让飞轮转动起来了。


    # 本章要点


    ◆ **数据学习效应运动呈回路状。** 学习是一个循环往复的过程：观察，从中学习，付诸行动，并观察其效果。数据学习效应也是一个循环过程：获取数据，将其放入模型，输出预测，并观察其准确度。


    ◆ **护城河是错误的比喻。** 护城河是一种资产的积累，形成了一道屏障，但屏障可以被打破，而那些资产会被夺走。数据学习效应不仅积累了数据资产，还积累了经验教训。


    ◆ **回路不断成长。** 数据学习回路自动成长，形状和大小会不断发生变化，因为每一次循环——每一次重复学习过程——它们都会自动积累经验。


    ◆ **数据学习回路功能强大，因为它们能够内生资产、能力和信息。** 每一次循环，智能系统都会自动创建数据、程序，并积累经验。


    ◆ **有好的回路，也有坏的回路。** 好回路有充足的数据输入，通过让人们运用预测做很多的事情，使熵增加，这样它就能够在现实世界中产生模型可以观察到的效果。让客户参与预测，为模型收集更多信息，并学到更多东西。


    ◆ **考虑解决问题的回报。** 产品创始人、产品经理和设计师必须仔细考虑，一个具有概率假设的系统是否能够满足客户的需求，或者，考虑到犯错的代价，选择一个确定性系统是否会更好。


    ◆ **认清目标。** 预测可用性阈值是证明产品接受度所需的最低性能水平。弄清楚客户期待什么，想要实现什么目标，并利用这些信息做出一个足够准确的、对现实世界客户都有用的预测。


    ◆ **达到足够的规模。** 评估可以访问什么数据，是否能达到足够的数据规模，或者抛弃需要更多数据的模型。


    ◆ **并非所有数据都对回路有用。** 一些数据用于建立模型，然后被丢弃，一些数据用作系统的输入，还有一些数据通过反馈机制被再次输入系统。在这三种数据中，只有最后一种才是产生竞争优势的基础。


    ◆ **注意漂移。** 必须以与环境变化相同的速度获取新的训练数据。如果没有这些数据，模型可能会开始偏离现实。


    ◆ **选择要解决的问题时，需要将性能的所有方面考虑在内。** 数据规模回报率低、漂移可能性高的领域不太可靠。而利用高数据规模回报率和低漂移可能性来应对问题的公司比较可靠。


    ◆ **模型测量。** 准确度、二元分类、接受者操作特性、精确率和召回率，可以表明模型是否能够提供预测，以及它是如何越来越准确的。


    ◆ **跟踪单位成本。** 找出交付给客户的核心单位，并衡量该单位的收入和支出，以初步评估人工智能优先公司的赢利潜力。然后对标注、数据管道、数据收集和研发成本进行分层，以得出准确的毛利数字。


    # 第八章 优势聚合


    人工智能优先公司采用了许多与其他公司相同的战略框架，但他们还构建了数据学习效应来捕获有关流程的足够信息，从而实现流程自动化，最终降低成本。这种成本优势为人工智能优先公司的管理者提供了更多选择。


    他们可以选择保持价格不变：将差额作为利润；将利润再投资于数据学习效应背后的技术，实现更多自动化，进一步降低成本；将利润再投资于企业以实现纵向整合，或者重新定位以获取更多数据。


    他们也可以选择降低价格，利用自动化带来的收益实现以下目标，从而在现有市场中击败竞争对手，或者在进入新市场时处于有利地位：差别定价；破坏；聚类。


    人工智能优先公司的优势聚合如图8-1所示。


    ![](EPUB/images/image_079.jpg)


    图8-1 人工智能优先公司的优势聚合


    本章介绍上图顶部的五种策略：纵向整合、通过标准化定位、数据聚合、破坏市场准入，以及基于数据贡献的差别定价——为模型产生更多的数据，促进数据学习效应增长，并吸引更多的客户。管理者既可以将这些利润分配给股东，也可以再次投资于业务、技术或者战略，以进一步推动数据学习效应的发展。


    此外，本章还讨论了数据学习效应如何让人工智能优先公司在与现有公司的竞争中占据优势。从客户现有的数据库中获取数据，将其转换为新产品，并围绕这些产品集成服务，可以将客户从现有的软件供应商手里抢走。从现有软件供应商那里抢走临界数量的客户，通过设置存储和移动数据的行业标准，使整个生态系统围绕它们进行运转。上图中的概念——破坏、聚合、纵向整合——在过去几十年里，让新入行者从现有公司中脱颖而出。将这些概念应用于数据学习效应可以构建一系列长期、可持续和强大的竞争优势。


    在进行深入研究之前，必须牢记，对以下任何优势进行聚合的先决条件都是把人工智能放在首位。战略是为了建立竞争优势而进行的权衡。人工智能优先公司对资金、时间和资源进行权衡来构建数据学习效应。只有拥有了数据、处理能力和数据网络效应——数据学习效应时，他们才能够聚合其他竞争优势。


