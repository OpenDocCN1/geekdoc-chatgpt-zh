    ## ROC曲线下面积（AUC）


    利用积分计算ROC曲线下面积（Area Under the Curve，AUC），就是阴影部分的面积（如图7-9所示）。该区域给出了模型在所有不同阈值下的总体准确度。如果模型始终是正确的，ROC曲线下面积将为1——整个区域；如果是错误的，则为0。


