    在供给侧，人工智能优先公司通过以下方式聚合优势：


    ● 拥有获取有价值数据的特权，这些数据是人工智能的关键输入；


    ● 开发将数据转化为信息的流程，降低计算成本，或者促进机器学习研究人员、工程师和数据科学家之间的合作；


    ● 利用大量数据训练预测模型，或者整合跨客户的预测模型，以获得不断增长的规模回报。


    在需求侧，人工智能优先公司通过以下方式聚合优势：


    ● 围绕对数据管理的信任、稳定可靠的准确预测，以及优质售后服务，打造强大的品牌；


    ● 通过数据存储标准、互补产品生态系统和长期客户合同创造转换成本；


    ● 设计一款随着越来越多的用户加入产品网络而变得越来越有用的产品，以获得不断增长的规模回报。


    此外，人工智能优先公司可能还会聚合政府授予的优势，比如独家使用政府数据和模型专利的权利，以及因为提供使社会能够更好地规划和运作的预测而获得的补贴等。


    ## **纵向整合**


    世界上最好的产品是由纵向整合的企业生产的：苹果的硬件到软件、亚马逊的仓库到网站，以及19世纪工业家安德鲁·卡内基（Andrew Carnegie）的矿山到工厂等。许多像罗纳德·科斯（Ronald Coase）那样的著名经济学家，以及像戴尔科技的创始人迈克尔·戴尔（Michael Dell）那样的企业家，都对纵向整合的益处赞赏有加。在一个产品包中提供客户所需的一切，可以实现质量控制，有利于构建深度关系和提供更好的定价。


    人工智能优先公司还有另一个主要好处：每天从使用产品的客户那里获取更多数据。不断更新的数据流使模型始终处于最新状态，预测准确，并与现实世界保持一致。纵向整合如图8-2所示。


    纵向整合可以加快新技术的推广。人工智能是一种相对较新的技术，在推广上存在特殊的障碍：严重的后果，比如漏诊；难以计算的价值，例如为安全分析师节省的时间；以及高资源需求，例如具有培训机器学习系统所需技术技能的工程师。向客户提供一个完整的、纵向整合的人工智能优先解决方案，取代他们使用的软件，可以简化销售流程。


    ![](EPUB/images/image_080.jpg)


    图8-2 纵向整合


    事实上，有许多人工智能优先公司进行了纵向整合。例如，对冲基金可以获得自己的数据，建立自己的模型，做自己的生意；他们建立模型的目的并非让其他人利用其产生的预测进行交易。广告平台能够找出最佳目标客户，然后推送广告；他们不会向其他网站出售寻找客户的模型。新时代消费金融应用程序能够对提供贷款的风险进行评估，然后再发放贷款；他们不会把贷款评估模型卖给银行。


    人工智能正在快速发展。十年前，进入该领域的门槛很高，因为让人工智能运作起来非常困难。如今，有在线代码库可供借阅，有开源（免费提供、可分发和可修改的）软件以及方便的框架可供使用，有能力出色的咨询公司可供合作，还有训练有素的人员可供聘用。的确，许多大型科技公司都在免费提供基本的人工智能，可以在任何人提供的数据上运行。但是，数据和人工智能的能力还不够。在2005年左右，通过对基础人工智能进行专有数据培训有可能取得成功。如今的方法，比如一次性学习、生成性对抗网络以及概率编程，都有助于在数据相对较少的情况下获得高精度的模型，但规模还不够。将数据规模、处理能力和网络效应结合起来，构建数据学习效应是公司前进的方向，而构建这三个要素可能涉及纵向整合。


    **你做什么**


    纵向整合需要为客户承担并解决业务问题，而不仅仅是技术问题——提供的不仅仅是产品，而是完整的解决方案；完成所有需要完成的工作。以下是纵向整合公司可能提供的一些做法示例：


    ● 回复客户的电子邮件，而不是向负责回复电子邮件的代理提供回复邮件的建议（我们将在本节中使用该示例）；


    ● 在网站和营销平台上提供多种语言的文本，而不是为翻译人员提供翻译工具；


    ● 经营一家保险公司，而不是帮助保险公司更有效地处理索赔。


    完整的解决方案有很多部分，如下面的金字塔图（图8-3）所示的人工智能优先公司的纵向整合。


    ![](EPUB/images/image_081.jpg)


    图8-3 人工智能优先公司的纵向整合


    以亚马逊的个人语音助理Alexa为例。以下是其从无到有所经历的步骤：


    ● 用内部资本资助；


    ● 使用亚马逊网络服务的计算基础设施和数据基础设施进行开发；


    ● 从产品和辅助设备的早期用户处收集书面和口头数据集；


    ● 在内部准备数据，不让数据离开公司，部分是出于隐私原因；


    ● 聘用自己的人对语音文件的片段进行标注；


    ● 建立了自己的语音识别模型；


    ● 通过亚马逊网络服务，再次使用自己的监控系统；


    ● 在内部监控使用情况；


    ● 设置一个家庭扬声器；


    ● 将扬声器直接分发给拥有安装工具（通过移动应用程序）的客户，实现他们希望得到的功能——例如连接到其他扬声器或者作为独立设备；


    ● 通过互联网获取数据以训练模型并更新产品。


    Alexa是一款完全纵向整合的产品。


    我们所要做的选择是，是否通过其他公司提供预测，或者是否通过专有软件、服务和其他非软件产品提供预测，从而进入下一个层次。例如，设计一个客户关系管理系统（Customer Relationship Management，CRM）对往来电话进行记录，把销售目标放在可以对其进行呼叫预测的模型上；或者将电子邮件模板设计工具放到模型上，按照客户的喜好自动将电子邮件列表进行分类，因为这些客户有的可能喜欢不同外观的电子邮件，有的可能喜欢将身份票据记录功能放到自动响应生成模型上。


    这还只是软件问题。超越技术，直达现实世界，在这个世界里，纵向整合涉及将资本分配给实施、训练以及其他一些工作，包括聘用人员手动处理预测，或直接与客户沟通来处理异常情况等。聘用这些员工的成本可能比电脑还高，但模型可能会出错，而这些人却能够100%地进行事物识别、打电话，或者撰写电子邮件。


    最后，让我们回到金字塔的底部。为人工智能优先公司提供资金是纵向整合的一个独特机会，当人工智能出现故障时，无须顾及成本，只须保证其能够继续运行。提供这种担保意味着，当人工智能崩溃时会赔钱，但当它运行时也会获利。例如，你将承担最终失败的人工智能的贷款成本，但你可以将这些贷款的所有收入作为利息。提供这样的担保通常需要更多的资金，来支付模型在学习过程中超出的成本。在有足够的数据表明这些模型值得投资之前，风险投资是一种融资选择，但成本很高。其他形式的股权资本是在现有业务中构建人工智能公司的一种选择，这些业务产生的收入与投资风险无关。当机器学习和商业模式运作——正确预测风险、承保风险，并获得回报等——都有记录时，债务便有了价值。最终，人工智能优先公司的资产负债表上将有足够的现金，来支付模型出现错误时的成本——承保风险成本——以保留所有利润，而无须向外部股东或债务持有人支付任何利息。纵向整合达到保证客户自负盈亏的程度时，人工智能优先公司就可以从正确的操作中获取所有利润。


    **你得到了什么**


    围绕纵向整合的产品构建服务、集成、团队和技术，既困难又昂贵。还有更多的东西需要建设，更多的问题要解决。然而，也有三大好处：更多的数据、利润和收入。


    **更多数据**


    提供人工智能模型服务可以从客户那里直接收集数据、元数据和获得启发——从自动完成任务中得到的经验教训。


    软件（产品）层面的纵向整合可以在真实世界中直接观察预测的效果，生成更多数据反馈到模型中，以便将来进行更准确的预测。观察可以来自产品内部，根据用户点击按钮或者填写表格的情况，查看他们是否接受、修改或拒绝人工智能的回应。例如，当客户支持系统自动生成、批准，并发出回应时，则模型是“正确的”。如果在发送之前对该回应进行了编辑，则说明该模型至少出现了部分错误，但它能够进行调整，比如学会下次不使用某个词，以及确认回应是否令人满意。当传感器拾取图像或声音时，观察也来自产品之外。人工智能优先公司拥有人们每天使用的产品，以及将数据输入该产品的传感器来获得数据，并利用它们来对模型进行改进。


    人员（服务）层面的纵向整合可以产生有用的领域专业知识，有助于进行更好的预测和数据标注。做出更好预测的想法来自每天和客户打交道的人，他们观察客户的行为，并与业内经验丰富的人进行交谈。通常，只需问问做了20年同样工作的人，什么东西可以用来对其他事物进行预测，就可以找到构建机器学习模型的捷径。


    我给你举个例子：在整合客服系统时，可以咨询一下终身客服代理，问问他们什么东西通常会引起客户的积极响应。然后，将其插入自动生成的回复中，使系统更积极地解决客户的问题。或者，在客服系统中添加一个按钮，当代理认为写邮件的客户特别生气，需要及时进行干预时，可以单击该按钮，将邮件标记为“敏感”：标注数据，训练机器学习模型以确定响应优先级别。通过聘用领域专家来实现系统的纵向整合，可以产生更好的想法和数据从而对模型进行改进。


    **更多收入**


    如果承担风险的公司对风险有合理的认知，那么就有可能从风险中获得回报。最明显的例子是投资公司，他们评判一家公司是否有风险，就是看它能否使用资本构建产品、设计可盈利的商业模式，并凭借某种形式的竞争优势保持利润率，进而从投资中获得回报。投资者对每一种风险进行评估——产品和市场、业务和销售，以及竞争——当他们的判断比其他人更准确时，就会得到回报。也就是说，他们之所以得到了回报，是因为他们比其他投资者更早地看到了该公司是否可以利用资本来降低生产产品、在市场上寻找客户、签署商业协议、聘用优秀销售人员的成本，以及保持竞争优势。投资公司位于世界最大公司之列，除非是判断完全错误，否则他们的风险收益将会倍增。如果人工智能优先公司基于风险评估创建商业模式，也可以以同样的方式增加收入。


    更重要的是，人工智能优先公司可以因承担人工智能工作的风险而获得收益。客户可以规定想要预测的东西、预测的准确程度，以及准确预测产生的结果。然而，客户无法控制模型是否能够达到那种准确度，以及他们在人工智能上的投资是否会获得回报。客户不想承担人工智能是否能够运行的风险。继续以电子邮件为例，只有当自动回复产品的成本低于客服回复邮件的当前成本，并且保持相同的质量（以客户满意度分数衡量）时，客户才会为产品付费。对于可以自动生成可接受答案（以客户满意度分数衡量）的人工智能优先产品来说，如果每个问题的机器处理成本低于当前人工成本，那么，投资该产品将会为客户带来积极的投资回报。客户以更低的成本获得相同的结果，随着自动化程度的提高，人工智能优先公司获得了更多的利润，而且每个解决方案的成本都低于客户支付的金额。


    让我们将其与传统软件商业模式进行对比。与提供准确的预测相比，构建和交付软件功能更具确定性。客户指定可以为其省钱或挣钱的软件功能，供应商根据这些功能构建产品，然后交付产品并获得报酬。例如，当你购买基于云的客户支持系统Zendesk时，你知道你购买的是什么，会得到哪些功能。客户能够控制软件提供的功能，因此知道他的投资能否得到回报。如果产品达到了他认为的效果，那他会得到很好的回报；如果效果没有广告上说得那么好，或者他的员工不想使用该产品，那么，他得到的回报就会很少。由于软件的功能可以选定，所以产品的定价比较明确：无论是采用预付方式还是认购方式，价格都是固定的。人工智能优先产品既有传统软件开发、推广和集成产生的风险，也有预测可能错误的额外风险。但这种风险也创造了一个机会：预测正确就会赚钱，从而为客户带来投资回报。人工智能优先公司基于投资回报率的定价如图8-4所示。


    ![](EPUB/images/image_082.jpg)


    图8-4 人工智能优先公司基于投资回报率的定价


    基于投资回报率的定价目标是与客户分享价值。定价遇到的第一个挑战是，找出代表客户价值的指标，将其作为定价的基础。这些指标因产品和客户的不同而相异。例如，一个人工智能产品能够提供技术支持理解用户电子邮件的内容，并生成对电子邮件的回复，有效地减少了回复此类电子邮件的时间和成本。非基于投资回报率的定价，可能是运行生成这些响应系统每月所需的软件费用，而基于投资回报率的定价，可能包括节省的时间和成本。一般来说，软件公司能够获得10%到30%的回报。而更多可接受的响应系统将为人工智能优先产品供应商节省更多的成本，带来更多的收入。


    图8-3显示了基于投资回报率的商业模式。人工智能优先产品供应商通过自动化手段从客户那里获得回报。从客户的角度看，投资回报率的百分比与自动化的回报一致。


    纵向整合依然是一个重要的考虑因素。按照投资回报率定价意味着需要提供规定的投资回报率，而这通常需要运行整个系统。使用上面的例子，就意味着：


    ● 从身份票据系统中提取身份票据信息；


    ● 将自动生成的响应传递回系统；


    ● 训练人工智能客服以批准身份票据；


    ● 更正自动生成的响应，这些响应不够好，无法按原样发送。


    这些步骤中的每一步都需要花费金钱，加起来可能超过构建一个全新的客服系统的成本。


    赢利能力取决于对数据集成、交付、培训，以及支持成本的控制。例如，向客户销售一个完整的解决方案，如果通过与可重复使用的数据库连接器连接、以零边际成本提供的标准化在线培训材料，以及无须支持人员的全面支持文档进行自动化集成，以更低的价格销售的话，可能会带来更大的利润。对于人工智能优先公司来说，根据投资回报率向客户收费是一个独特的机会，随着系统变得更加有效，可以赚取更多收入。然而，它需要承担以足够低的成本提供产品以赚取利润的风险。


    **更多利润**


    纵向整合的优势集中在金字塔每一部分可获得的增量毛利润和客户能力上。例如，通过一个应用程序编程接口——一种软件之间进行通信的结构化方式——进行预测可能需要花费50美分，而客户每次“调用”需要支付1美元——毛利率为50%。然而，客户可能没有能够使用该应用程序编程接口的软件开发人员。在这种情况下，客户需要一个接口，通过该接口接收预测和训练，以了解如何使用该接口，这可能需要再多花1美元。客户可以从预测中获得了很多价值，所以花5美元买了一件交付成本仅为1.50美元的东西——毛利率为70%。对于人工智能优先产品供应商来说，攀登纵向整合金字塔是一个值得期待的举措。


    ## **差别定价**


    搞清楚如何向客户收费是一个永恒的挑战，也是一个将价值观与现实进行照应的挑战。定价是将差异具象化，因为顾客不得不花很多钱购买一个在其他地方买不到的东西。定价策略涉及收益质量、增长、赢利能力、产品、营销和销售。人工智能优先公司还将数据策略与定价策略结合起来。差别定价如图8-5所示。以下是人工智能优先产品的定价方法。


    ![](EPUB/images/image_083.jpg)


    图8-5 差别定价


    **贡献**


    对于人工智能优先公司来说，数据总是具有很高的价值，可以用来为特定客户或所有客户建立更好的预测模型。在后一种情况下，客户有效地组成了一个数据贡献者联盟，他们借助聚合数据优势，享受更好决策带来的益处。然而，即使数据是以聚合和匿名状态存在的，一些客户依然不想与联盟中的其他人共享数据，因此阻碍了模型的改进，致使企业无力向其他客户收取更多的费用，而这些损失只能由这些客户来承担。


    **应用**


    交易定价——随着客户使用量的增加而获得更高的收益——是与客户共同成长的关键。基于使用量的定价通常看起来像是按每个用户或每个“座位”收费。然而，这可能不适用于人工智能优先产品，因为它会阻止客户添加更多的用户，从而减少返回系统的使用数据量。此外，按用户数量进行收费，可能会为总收入设定上限：如果人工智能优先产品能提高公司员工的工作效率，那么随着时间的推移，公司将需要更少的员工，从而支付更少的费用。


    数据量和预测量是人工智能优先产品价值的基础。基于数据和预测量的定价可以促进增长，因为它们不受使用量的限制。客户也许会担心，他们使用该产品的次数可能会远超预期，会受到意外高额账单的困扰，但这可以通过下列措施进行缓解：打折、不同的定价方案（比如三级收费）以及其他激励使用、增加收入、提高确定性等机制。


    **更新**


    定期更新的模型可以通过基于云的在线系统分发给客户。如果更新具有更高的准确度、可靠性或质量，则可以在每个更新周期向客户收费。为客户建立一个界面，让他们了解旧模型和更新模型之间的差异，从而清楚地看到升级的价值。免费提供一个模型更新之后的输出结果，可以提高客户的购买意愿。购买之后，客户可以通过云系统获得更新的模型，或者手动将其上传到自己的内部计算系统。


    **功能**


    长期以来，公司一直根据功能来设定价格。随着时间的推移，单个产品会演变成具有多种功能的产品线。人工智能优先公司可以像软件公司那样就下列内容向客户收取更多的费用：不同的功能、接口、集成、格式、支持级别、延迟、速度，以及兼容性。人工智能优先公司还可以对人工智能相关功能收取更多费用：预测不同类型事件的不同模型功能、针对单个客户预测特定事件的功能，以及预测与整个客户群相关的事件的功能。


    在客户付款时，供应商可以打开这些交付的功能，这需要有一个交付机制——例如，一个网络界面。这是定价和产品策略相互作用的多种方式之一：纵向整合的产品能够对交付功能实行完全的控制，从而根据功能进行定价。


    ## **人工智能优先的破坏力**


    克莱顿·克里斯坦森（Clayton M. Christensen）是一位颇具影响力的商业理论家，在其1997年出版的《创新者的窘境》（*Innovator’s Dilemma*）一书中，他对破坏理论进行了这样的阐释：新入行者可以从现有供应商那里撬走一些客户，方法是牺牲现有产品的小部分利润，将专门的产品销售给特定的客户群。他们可以通过向这些客户销售额外的产品来获取市场份额。这里的核心假设是，能够识别出不需要现有产品所有功能的客户，并生产出更专业、更高质量、成本更低的产品。在客户开发和产品设计中，发现利基市场并创造更专业的产品是一项基本任务。而这正是数据学习效应发挥作用的地方。图8-6示意了人工智能优先的破坏力。


    ![](EPUB/images/image_084.jpg)


    图8-6 人工智能优先的破坏力


    首先，数据学习效应可以降低价格。例如，智能系统通过搜索所有可能的化学组合，让药物开发过程的所有步骤实现自动化，最终降低药物生产成本。较低的生产成本可以降低价格，而较低的价格可以吸引客户离开竞争对手。这是人工智能优先的第一波次破坏。


    其次，数据学习效应是创造高质量产品功能的基础，例如个性化和观点生成等。现有公司往往低估了这些高级功能的价值，因为他们认为自己的客户群不需要更高质量的产品。而人工智能优先公司最初能够以较低的价格提供质量较低的产品，然后逐步改进产品，以实现更好的个性化、更全面的自动化，或者提供更准确的观点。例如，谷歌等广告平台最初销售广告的价格低于网站横幅的成本，但现在收费提高了很多，因为这些平台可以提供个性化广告，为广告商提供高质量的线索。这是人工智能优先的第二波次破坏，利润来自销售更高质量（和更高价格）的产品。'
