    ## 在哪里找到他们？


    从统计学开始意味着在聘用工程师和机器学习研究人员之前，先聘用分析师和数据科学家。从本质上讲，通过将数据科学和软件工程分离开来，就可以把招聘重点放在没有软件工程经验的数据科学家身上，从而扩大了候选人的范围，将与数据操纵相关的所有学科都包括在内。


    你可以在经济学、计量经济学、会计学、精算学、生物学、生物统计学、地质学、统计学、流行病学、人口统计学、工程学和物理学等领域，找到分析师和数据科学家，因为这些领域需要高水平的数学和统计学知识储备。例如，具有广泛物理学背景的候选人，可能精通处理数据分析的基本概念。


    在这些学科中，我们可以找到一些技术人员，他们所拥有的技能使其能够使用第二章“精益人工智能”中阐释的许多方式进行数据集研究。这些技能包括：


    - **统计。** 测量、过程控制、仪器使用和建模。

