    ## 精确率和召回率


    精确率和召回率衡量的是模型检索和识别相关结果的效率。精确率是模型检索到的相关数据点除以数据点总数。也可以说，精确率是指随机检索到的数据点是相关数据点的概率。召回率是指在随机选择的搜索中有多少相关数据点被准确找到的概率。对两者的测量都很重要，因为精确率本身无法显示模型距离捕获所有相关结果还有多远，而只需检索所有数据点，召回率就可以达到100%。


