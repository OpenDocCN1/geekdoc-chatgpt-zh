    ## **本章结论：构建业务模型**


    尽管尖端研究的前沿正在以前所未有的速度前进，但现在开始机器学习比以往任何时候都要容易。选择一个基本框架，并在其中运行数据是一个很好的起点。我看到公司每天都在这样做，直到后来才会深入到更难的问题，比如定制模型组件解决客户问题等。


    选择什么样的工作方法取决于你要干什么，以及你要预测什么。一旦有机器学习模型运行之后，你就需要退后一步，考虑一下它们如何才能对公司的核心资产做出贡献。人工智能的力量在于随着时间的推移积累起来的信息，而很多信息都存在于数据里——也就是它所学到的东西。然而，人工智能生成的数据还与其学习规则的方法、特征、类别、结构、参数，以及循环每一周产生的其他输出有关。


    ## **本章要点**


    ◆ **根据可用数据选择机器学习方法。**监督学习需要训练和反馈数据，而无监督机器学习只需要大量数据。


    ◆ **有些模型需要一个目标。**强化学习模型需要目标。其他形式的机器学习通常不需要，它们甚至会毫无目的地发布信息。


    ◆ **学会学习。**一些人工智能生成有关其学习方式的数据，在寻找新问题的解决方案时积累有价值的资产。


    # **第六章**


    # **模型管理**


    下一个挑战是把人工智能从实验室带到现实世界中。人工智能优先产品具有吸引人们长时间访问的特性，但需要与现有软件、流程和系统建立联系，因此，我们本章就从最佳客户实践谈起。


    很多媒体报道称人工智能“已经疯了”：生成有偏见或冒犯性的输出，做出有问题的决定。目前的挑战是确保这些模型不会与现实脱节或失去联系。人工智能优先产品之所以强大，是因为它们不断适应、进化并产生新数据，但这种持续的变化使它们难以管理，就像平衡以下多维的因素一样。


    **实验与实施**


    自由实验会产生强大的模型，但这些模型需要在现实世界中应用，才能产生价值。


    **去中心化与中心化**


    对模型特性有影响的专业知识是去中心化的——分布在各个组织之间——但运行模型的软件基础设施却是中心化的。


    **测试和观察**


    测试有利于暴露问题，但是我们必须把模型放到现实世界中进行观察，从中学习。


    理想的模型管理系统允许人工智能优先公司运行去中心化的实验，严格测试模型，并在它们开始从真实数据中学习之后对其进行监控。至关重要的是，理想的模型管理系统可以让模型不间断地学习。


    创建一个闭环系统，在模型再次运行之前验证其输出，可以保持模型处于受控状态。本章我们提出了一个重要的设想，就是构建机器学习管理回路：一个自动系统，用于连续对模型进行培训、修改、部署、测试、监控和修复。启动该回路时，你不必让整个回路都运转起来，而只需让其中一部分运转起来。此外，我们还希望你对可能出现的问题以及问题可能出现的时间有更为清晰的认识，从而能够领先一步发现潜在的问题。在这里，我们将把模型管理与技术行业里近似的概念联系起来，比如敏捷开发、DevOps和统计过程控制（Statistical Process Control，SPC），同时也引入了管理智能系统的新理念。我们有两张图表，可以带你看懂本章的两个部分：实施与管理。图6-1展示了模型接受的步骤。


    ![](EPUB/images/image_048.jpg)


    图6-1 接受模型的步骤


    ## **实施**


    将模型从实验室移出投入实际应用通常涉及大量人员、流程和软件。每一次实施都是独特的，所以我们的目的不是提供一个全面的指南，而是提供引导该过程的路标。


    # **数据**


    智能系统需要数据。许多供应商可以对从客户那里获取数据所需的提取、转换和加载操作进行管理。然而，经常有一些重复性和独特性问题需要处理。客户可能会对保存哪些表格以及如何定义数据元素有自己的看法，而且，他们经常通过使用新产品来促进数据基础设施的重建。从一个数据库中用最少的表提取最少量的数据，有助于避免客户重建整个数据基础架构的问题，因为单个数据提取过程不太可能揭示数据存储、标记等方面的问题。无论如何，严格指定必要的数据、领导负责完成任务的团队、对ETL（提取、转换和加载）产品供应商的选择过程进行积极管理，可以让实施进行得更快。


    关于数据基础架构的选择，在探索阶段，人们会对成本、延迟、规模以及安全性进行权衡。例如，要运行小规模实验，成本就不那么重要，因为小规模实验不需要很多计算资源。但是，延迟更为重要，因为快速获得结果可以在相同的时间内进行更多的实验。在测试阶段，规模不太重要，但在进入生产阶段后将较为重要。在实验阶段，为了获得高可用性（低延迟）数据库以存储实验数据而支付更高的费用是有意义的，但在生产阶段则没有意义。你可以选择一个云供应商来提供生产数据库，为世界各地的客户快速自动启动新服务器。相较于传统软件公司，为人工智能优先公司选择合适的数据库和数据基础设施更加复杂，因为人工智能优先产品涉及定期培训、测试和生产周期，每个周期都有不同的成本、延迟、规模和安全需求。


    **软件**


    智能系统有时有一个带有用户界面的应用程序来提供预测，但有时它们直接与现有系统集成。例如，智能优先客户关系管理软件公司可能会构建一个新的应用程序供销售人员每天使用，也可能会向现有客户关系管理软件（如赛富时）提供建议。在后一种情况下，当输入另一个前端应用程序时，系统需要通过应用程序编程接口连接到该应用程序。当该应用程序有一个开放的应用程序编程接口（比如赛富时）时，这会比较容易，而当它是一个封闭的（通常是付费的，比如思爱普）应用程序编程接口，或者当它根本没有应用程序编程接口，需要自定义集成时，就会比较困难。构建一个应用程序是一个全新的软件项目，有另一套考虑因素，它们超出了本书的讨论范围。


    **安全性**


    智能系统通常使用大量数据。数据越多，风险就越大，尤其是这些数据包含敏感信息的时候，例如，一个人的实际位置或财务信息等。每个数据集可能有不同的用户、权限和外部访问要求。例如，客户可以访问实验数据集查看结果，但不能查看测试集，以防他们对测试造成干扰。在客户的数据受到严格的隐私规定约束的情况下，实验数据可能完全是合成的，比如医疗数据。当生产数据需要包含在客户使用环境中时，可能会被完全混淆，这时就需要能够在客户使用环境或系统上运行的自包含模型，例如，使用隐私保护加密。访问权限管理通常是一个不确定的考虑因素，关系到内部和外部利益相关者现有的权限。


    智能系统需要大量来自摄像头等传感器的数据，其中的每一个传感器都是黑客攻击的潜在目标。通过联网的摄像头、门铃或者牙刷访问数据库，是黑客可以而且将要做的事情。对这些传感器上运行的软件进行建模时，人工智能优先公司必须了解安全缺陷，及时对每个传感器进行更新。


    **传感器**


    建造从传感器获取数据的智能系统时，人工智能优先公司可能需要一个单独的工程和现场操作团队。将传感器从制造商那里运到客户手中是一项物流挑战，而安装也涉及很多工作，比如搭架、布线，以及将其连接到互联网上等。布设传感器会遇到环境挑战，比如让热传感器在寒冷的环境中工作，此外，传感器有时还需要防盗。每组传感器都有特定的传感器类型及其使用环境，这为传感器组管理带来了困难。在交易定价时，将这些实施成本与硬件费用分开进行预算是至关重要的。


    **服务**


    软件应用往往涉及高度专业化的服务。这些服务由通常被称为系统集成商（Systems Integrators，SIs）和独立软件供应商（Independent Software Vendors，ISV）的第三方供应商提供。当在内部解决这个问题既不经济，也不具有战略意义时，可以考虑邀请第三方参与。对人工智能优先公司来说，与系统集成商合作可能受益最大，因为集成软件的工作与集成客户数据和训练模型的工作是分开的。例如，在预测送货卡车的放置以便为下一批货物做好准备时，所需的数据可能位于旧版企业资源规划（Enterprise Resource Planning，ERP）中，比如思爱普等。因此，最好与思爱普特定的系统集成商合作来获取数据，而不是通过阅读大量思爱普文档来学习如何获取数据。


    当工程实施需要安装和硬件维护时，系统集成商应该是最佳人选。专做硬件的系统集成商会与制造商合作共同安装和维护传感器。他们知道如何把它们连接在一起，如何连接到互联网，以及如何将数据导入数据库。他们的经验和专业关系通常能够使安装过程更加顺畅，问题解决得更快，为客户提供更多可用库存以备不时之需。


    **人员配备**


    人工智能优先产品的实施团队可能包括一个数据校验员（检查数据是否高质量）或数据工程师（数据清洗）、数据科学家（运行实验）和机器学习工程师（将其转化为模型）。此外，还有产品经理、应用程序开发人员、开发运营工程师，及其法定权利。


    将结果与客户沟通可能需要单独聘用一个团队，因为他们擅长解释模型输出，并将其展示给客户，在试点阶段激发客户的热情，确保产品的采购量。这些人通常具有咨询或其他专业服务的背景，以及良好的数据科学基础。聘请团队定期制作演示文稿并向客户展示，可以提高人工智能优先产品的最终接受度。


    **接受度**


    人工智能优先产品可能会遇到技术和管理规定两方面的挑战，它们与现有系统的集成度可能很高，其变化对于决策过程可能影响巨大。以下是按照时间顺序排列的、可以提高人工智能优先产品客户接受度的做法。


    **技术**


    ● **确保它管用。**期望会在某个时候与现实发生冲突，而最终的结果不是接受就是拒绝。满足客户对人工智能优先产品的期望是一件很困难的事情，因为这种产品的承诺是对现实世界中即将发生的事情的预测。而软件产品则有所不同，它们仅提供客户要求提供的功能。第一步是调查模型可用的数据。是否有一个便捷的基于人工智能的客户问题解决方案？


    ● **不要因为数据清洗而分心。**对数据进行组织，将它们集中在一个地方——干净、标记完整的，并以经济高效的方式存储——是一个巨大的、永久性的难题。客户在组织数据的过程中会处于不同的阶段，而人工智能优先产品可能是数据组织项目的催化剂。这可能符合每个人的长期利益，因为有组织的数据可以让人工智能实验进行得更快、更好，也更廉价，当然还有很多别的好处。然而，在长期利益与短期挑战——接受度——之间取得平衡才是当务之急。只需手动提取必要的数据，而无须启动长达一年的数据库项目，就可以将人工智能优先产品交到客户手里。开发单一项目可能成本很高，但总比从来没有完成项目要好。


    ● **制定一个现实的时间表。**客户会同时应对多个项目，所以需要高效地安排时间。为他们提供一个现实的路线图，使其能够优先考虑实施产品所需的时间。如果没有这样的路线图，就会出现一种风险，即概念证明（Proof of Concept，POC）将导致另一个计划外的概念证明，以证明一些出乎意料的东西，降低人们对产品的热情。采购订单或另一个概念证明请求可能会被拒绝。创建该路线图，并将其分发给所有利益相关者，让实施具有了现实的可能性。


    ● **定期重新训练。**根据新数据重新对模型进行训练，然后快速部署，可以建立一个积极的反馈循环，让客户看到模型对他们输入的数据所做出的响应，从而鼓励其输入更多的数据。


    ● **快速开发功能。**和软件开发一样，对客户反馈进行快速迭代，会产生更多的反馈，同时建立信心。


    **管理规定——采购阶段**


    ● **增强，不要自动化。**一定要将该产品定位为增强人类专家能力的产品，以消除他们被人工智能取代的恐惧。


    ● **重视收入而不是成本。**人工智能优先产品能够为客户省钱，他们当然会很高兴。然而，比省钱更令人兴奋的是赚钱。想出一些办法，让人工智能优先产品可以从新的机会中创造收益，激发客户对产品的热情，提高投资回报率。


    ● **创建部门级投资回报率。**为每个业务部门创建投资回报率计算方式。最终，在公司层面为客户的投资提供回报。


    ● **确保足够的预算。**确保客户的预算覆盖项目实施的所有辅助成本，从数据标注到购买传感器等。例如，客户负担不起大量摄像头的费用，可能意味着永远无法获得训练图像识别模型所需的数据。


    ● **制定激励措施。**与客户一起为关键利益相关者制定激励措施，确保项目成功实施。这些激励措施可以是客户一方的，例如，完成项目实施阶段性目标的现金奖励。激励措施还可以与共享目标相关联，例如达到一定的准确度，也可以获得奖励。


    ● **实行问责制。**与客户共同确保实施过程中最核心的人员——数据工程师和集成工程师——对完成任务负责。


    **管理规定——概念证明阶段**


    ● **缩短实现价值的时间。**尽快显示结果。这样做可以消除人们的质疑，比如，该系统是否有效，是否只是理论研究而没有实际效果，项目是否会一再拖延，以及无法与其他系统整合等。


    ● **为客户而建。**做出购买决定的人和使用该产品的人并不总是同一个人。为买家构建产品增强功能，如报告或者管理仪表盘，有助于完成销售目标。


    ● **参与实验。**定期更新关键利益相关客户，通过建立对产品的信任和理解来提高产品接受度。定期举办会议，解释假设并展示实验结果，提高客户的参与度。这些会议可能会帮助客户从概率学的角度理解预测的发展过程，并对假设提出反馈。


    **管理规定——执行阶段**


    ● **尽早广泛分销。**接受人工智能优先产品可能是一个自我实现的预言：让更多的人使用该产品会带来更多的反馈数据，从而可以对其进行改进，并说服更多的人使用它。因此，如果人工智能优先产品能够尽快地在管理链上垂直分布，并在每个业务单元中水平分布，那么它就可以表现得最好。然而，将人工智能优先产品交给一个跨业务部门横向工作的单一分析团队时，其接受度就会下降，因为横向团队没有能力让产品被采纳，没有能力通过培训有效地传递知识，也没有动力在每个业务部门完成实施。与客户合作，将产品垂直分发到每个业务部门，可能需要与他们合作建立一个新的组织结构，或者吸引一位高层管理人员来推动该产品在整个组织中的采用。


    ● **提供高管教育。**管理就是提供方向，好的方向需要对手头的任务有详细的了解。向客户的执行和管理团队传授人工智能优先产品背后的技术，熟练掌握术语，并对模型的功能有一个基本的了解，确保高管们具备向组织内的实施团队提供具体指导的能力。为此，可以向客户提供材料进行自我教育，也可以聘请外部教育机构或者咨询公司来进行培训。


    ● **嵌入可解释性。**让客户熟悉人工智能做出特定预测的功能，不仅能够培养信任，而且可以让他们了解如何对给出错误预测的基础模型进行改进。


    ● **追踪使用情况。**对使用情况进行追踪，确保客户在使用产品。这种做法在软件产品中很常见，但当产品的使用方式不像点击网站上的按钮那么简单时，它往往会被忽视。人工智能优先产品可能需要通过调用应用程序编程接口、读取数据库数据、标记或其他新方法对使用情况进行追踪。


    这些实践解决了模型在生产之前、期间和之后的技术和社会层面的认可问题。追求什么，什么时候追求，取决于每个阶段的认可度。


    ## **机器学习管理回路**


    客户希望模型准确且不会损坏。这意味着模型需要快速可靠地从现实世界的数据中学习。手动监控系统的工作速度不是很快，因此，我们需要一个连续的、自动的模型管理系统，就像本章提出的那样：从运行模型中获取观测结果和误差，然后找出保持模型运行、提高精度和减少误差所需的方法。机器学习管理回路如图6-2所示。


    ![](EPUB/images/image_049.jpg)


    图6-2 机器学习管理回路


    该系统允许对真实数据进行连续整合。让我们浏览一下这个系统的各个部分：训练、版本管理、部署、服务、测试和监控。评估步骤将在第七章“回路测量”中介绍。


    **训练**


    该步骤位于评估和部署之前，模型会在该步骤中被重新构建。在训练阶段进行监控的要点是分离数据集。图6-3示意了训练与评估。


    ![](EPUB/images/image_050.jpg)


    图6-3 训练与评估


    在这一时间点上，数据集被分为训练集、测试集和验证集。分离测试数据可以避免影响模型的功能，而采用与训练集相同的数据测试模型，可以保证每次都有完美的结果。


    当模型投入生产时，它开始学习和改变，所以，在投入生产之前，留出一组数据用于对照用户、客户、生产线或其他需要衡量的东西。这样做有利于之后将受人工智能影响的指标和不受人工智能影响的指标进行对比。对照数据是使用遗留系统的一组完全独立的实体，并且被隔离，因此根本不与人工智能发生交互。这在纯软件产品中很容易做到，但人工智能通过执行器、机器人或其他物理设备与现实世界进行交互，就要困难得多。纯软件产品通常具有标记功能，以便为不同的用户群体提供不同的功能，而硬件产品可能需要在没有特定执行器的情况下，设置系统的单独物理显示。创建对照组的附带好处是，它为客户提供了一个很好的比较基础，从而决定是否对人工智能进行投资。


    此外，每个训练步骤的输出都向客户展示了训练可以使模型对输出有效性做出反应。客户们不仅可以判断模型的预测结果是否有意义，或许还可以根据他们的经验提供更多关于预测功能的想法。例如，他们已经看到，每次下雨时，司机们更喜欢在路线上的每一站等更长的时间，延长送货时间。这可能会使你将天气数据纳入模型，并基于这些数据对模型进行训练，看看客户观察到的相关性在统计学上是否存在。如果是这样的话，你可以把天气作为交货时间的预测特征。在训练阶段分享模型的结果，类似于在开发软件应用程序时为客户提供模拟界面。


    **版本管理**


