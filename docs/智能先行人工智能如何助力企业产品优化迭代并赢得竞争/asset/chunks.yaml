    ## 本章要点


    - **首先要构建的可能不是人工智能。**客户可能既需要非人工智能方法，也需要基于人工智能的方法。

    - **从统计开始。**用一种统计方法得到一个答案，然后用另一种统计方法找出下一个答案。许多人工智能的创建是基于实验数据科学确定的功能。

    - **从一个问题开始。**关注一个数据集，从一个问题开始，避免处理来自多个数据库的庞杂数据。

    - **从单一算法开始。**这样做可以降低解决方案崩溃的风险。

    - **概念验证证明准确度。**人工智能优先产品往往需要概念验证，因为产品的价值定位是预测。潜在客户需要知道，根据他们的数据和他们所处的环境所做出的预测是否准确。

    - **精益人工智能是一个构建人工智能优先产品的过程。**这个过程就是利用人工智能解决一个特定的问题，构建一个小而全的，既可以扩展到其他领域，又可以专注于一个领域的人工智能。

    - **构建精益人工智能的过程与建立精益初创企业的过程不同。**当以精益方式构建人工智能时，建立精益初创企业的目标也有所不同。该目标不是生产出最小可行性产品，而是获得预测可用性阈值。产品功能与模型功能相比，后者更重要。输出是预测，而不是计算。在客户的工作流程中，预测的性能和功能不如准确度和可靠性重要。在客户的工作流程中，预测的表现和功能不如准确度和可靠性重要。

    - **不同类型的客户需要不同级别的准确度。**每一个客户都有一个阈值，在该阈值下所获预测对其业务是可用的，该阈值称作预测可用性阈值。

    - **重新定义功能。**在产品开发领域，功能是帮助用户执行输出计算结果任务的软件功能。在机器学习领域，功能是一组数学函数，输入数据，输出预测。产品功能要具有实用性（能够快速计算），模型功能要具有预测性（能够准确预测）。


    # 第三章 获取数据


    成立公司的目的就是创造收益，人工智能优先公司也不例外，只不过他们是通过数据来赢利的。获取数据是建立数据学习效应的第一步。


    ```

    数据学习效应 = 数据规模经济 + 数据处理能力 + 数据网络效应

    ```

    '
  trans: '

    # 第二章 精益人工智能


    事实上，即使客户最终需要的是人工智能，但他们也可能既需要非人工智能，又需要基于人工智能的方法，因为构建人工智能是一个渐进的过程。换句话说，构建人工智能之前的步骤是数据工程和数据科学。数据工程包括检测数据源以便持续收集好的数据、构建存储数据的基础设施、从现有数据存储中提取数据、转换与现有数据结构不匹配的数据，以及让数据加载到不同的数据库变得更容易。数据科学包括检测异常、建立分析流程定期对数据进行分析、分割数据、聚合数据集以放入对应模块中，以及找出算法的哪些功能可能预测有用的东西。


    然后才是人工智能。通过人工智能，我们开始测试这些功能是否可以预测某些东西、对更多数据进行更多实验、设计新算法、训练模型，并将它们应用到现实世界中。这将是一个与客户联合的过程：不管是分析法还是人工智能，先要弄清楚他们需要什么，通过数据工程、数据科学和机器学习工程来构建一个小模型。这些测试可以指导如何包装人工智能模型，如何建立正确的团队将该模型推向市场。与软件接口不同，人工智能模型很难模仿。要做到这一点，可以手动模拟人工智能模型，生成预测，以获得客户的响应。手动模拟是自然有效的第一步。看到、听到和感受到客户的需求，能够让我们对下一步的投资方向做出明智的判断，这很可能会把这门技艺变成一门科学：数据科学。


    ## 从小处着手：统计


    想了解客户说了什么，以及他们的数据表示什么意思时，从统计做起是有意义的。客户有问题，数据能够提供答案，而数据科学则是将两者联系在一起的纽带。一旦客户说出他们想知道什么，而数据又显示他们已经知道了什么，那么，数据科学就可以从数据中推断出他们将来想要知道什么。


    人工智能可能会分散注意力。向神经网络中输入大量数据，不太可能为客户带来有益的结果，因为数据与人工智能合作很难，需要使用更多的数据，进行数据清洗，调整模型，还需要做很多与为客户争取时间和预算无关的事情。


    相反地，有许多非人工智能工具有助于计算模式，并确定哪些成分会影响到其他成分。可能是用铅笔画的数据科学版本：在直方图或散点图上绘制结构化数据，以了解数据背后的情况。或是通过聚类，使用无监督机器学习对相似对象进行分组、降维、转换数据（使用`主成分分析`），以减少每个数据点相关的测量。使用聚类工具以精确定位潜在原因——机器学习模型的预测功能。找出一个原因后，通过训练一个`随机森林`或一棵`梯度提升树`，开始进行各种原因的组合，然后绘制变量重要性图和部分图，看看模型发现的关系是否合理。图像、语音和文本可能需要不同的方法，包括提取预训练的神经网络。基本上来说：首先要做的事情就是使用一种统计方法得到一个答案，然后利用这个答案，通过另一个统计方法得出下一个答案，最终形成人工智能。关于机器学习的投资回报率的观点如图
    2-2 所示。


    ![](img/image_018.jpg)


    图 2-2 关于机器学习的投资回报率的观点


    你可以这样理解：尝试一种统计方法，然后将多种方法分层并交织在一起。后者是一种神经网络：一个由许多方程组成的网络，这些方程的结果会输入到它们上面一层的其他方程中，接着输入到它们上面的更多层中，以此类推。这是神经网络的“网络”部分：方程在不同抽象层之间的接口。在方程组之间产生一系列会话之前，先用一个方程进行一次对话，看看它是否回答了客户的问题。


    我们读这本书不是为了建立一家数据科学咨询公司，而要从数据科学开始建构数据学习效应。大多数人工智能模型都基于统计方法。当客户有足够的时间和资金来构建人工智能时，从统计开始，可以顺利达成目标。


