    \ 1;每个卷积层后都紧跟一个池化核大小为 2×2、步长为 2 的最大池化层;全连接层承接第二个池化层,将经过卷积层和池化层处理、并被展平后的中间结果用连续的三个全连接层进行映射,最终得到数据长度为\
