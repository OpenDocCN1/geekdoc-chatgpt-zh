    # 卷积神经网络


    # 2.1 卷积神经网络的起源与发展


    # 2.1.1 卷积神经网络的起源


    卷积神经网络（Convolutional Neural Network，CNN）是一类特殊的人工神经网络，可视为基于生物学的多层感知机结构的变体。卷积神经网络的起源最早可以追溯到
    20 世纪 60 年代神经生理学家 David Hubel 和 Torsten Wiesel 对猫大脑视觉皮层细胞的研究[1]，他们让猫观察特定长度的光束，并通过电极获取猫大脑视觉皮层细胞对光束产生的脑电信号。研究发现，这些细胞仅对猫视野内的一部分区域产生反应，这一区域被称为感受野（Receptive
    Field），而且感受野又分为中心感受野（In-center Receptive Field）与周边感受野（Surround Receptive Field）。同时，他们还发现这些大脑视觉皮层细胞对光束的反应也不尽相同，有的细胞对光束的位置有反应，有的细胞对光束的位置和移动有反应，有的细胞对有端点的光束移动有反应，分别称它们为简单细胞（Simple
    Cell）、复杂细胞（Complex Cell）和超级复杂细胞（Hyper-Complex Cell），而且这些细胞之间存在对光束特征的不断提取和综合的过程，最终实现整个光束的识别。这个实验被称为
    Hubel-Wiesel 实验，如图 2-1 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_46_0.png)'
  - '[PAGE 47]


    到了 20 世纪 80 年代，Kunihiko Fukushima 教授在 Hubel-Weisel 实验分层模型的基础上提出了神经认知机（Neocognitron）[2]，可视为卷积神经网络的原始模型。在神经认知机中，包含两类组成单元：简单细胞（S-Cell）和复杂细胞（C-Cell）。其中简单细胞用于抽取特征，可对应于现今卷积神经网络中的卷积操作；复杂细胞用于容错，可对应于现今卷积神经网络中的激活函数及池化操作。神经认知机的结构包含一个输入层
    $U_0$、一个 $U_g$ 层、多个中间 $U_s$ 层、多个中间 $U_c$ 层和最后的识别层 $U_{c_4}$，如图 2-2 所示。神经认知机各层的具体功能如下所示。


    +   1) $U_0$ 层：输入图像数据。

    +   2) $U_g$ 层：负责图像对比度提取。

    +   3) 中间 $U_s$ 层（简单细胞层）：负责图像特征提取，如边缘、纹理、颜色等图像特征。

    +   4) 中间 $U_c$ 层（复杂细胞层）：支持抗变形、畸变容错。

    +   5) $U_{c_4}$ 层：输出识别结果。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_47_0.png)


    图 2-2 神经认知机


    # 2.1.2 卷积神经网络的发展


    1998 年，在神经认知机的基础上，美国纽约大学（New York University）的 Yann LeCun 提出了 LeNet-5[3]，率先将人工神经网络应用于图像识别任务，被认为是第一个真正意义上的卷积神经网络。


    2012 年，Alex Krizhevsky 等人提出了一种称作 AlexNet 的卷积神经网络[4]，它引入了 ReLU 激活函数和 Dropout 机制，并使用
    GPU 进行加速。在著名的 ImageNet 图像识别大赛中，AlexNet 使得图像识别错误率从 26%下降到了 15%，并夺得冠军，在图像分类任务上取得了历'
  - '[PAGE 48]


    史性突破。


    之后，更多卷积神经网络被提出，在多种计算机视觉任务上都取了突破性的成绩。在图像分类任务上，提出的卷积神经网络有 VGGNet[5]、GoogleNet 系列[6-9]、ResNet[10]、DenseNet[11]
    等；在目标检测任务上，基于卷积神经网络并结合其他算法，提出了 R-CNN 系列（R-CNN[12]、Fast R-CNN[13] 和 Faster R-CNN[14]）、YOLO
    系列（从 YOLO 到 YOLOv6 等）[15-20]、SSD[21] 等模型；在图像分割任务上，提出了 FCN[22]、SegNet[23]、UNet[24]
    等模型；在姿态估计任务上，提出了沙漏网络（Hourglass Network）[25]；在人脸识别任务上，提出了 DeepFace[26]、DeepID[27]
    和 FaceNet[28] 等模型。当然，还有很多经典的卷积神经网络模型，这里不再一一列举。卷积神经网络的主要发展情况如图 2-3 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_48_0.png)


    图 2-3 卷积神经网络的发展


    卷积神经网络现今已被广泛用于图像分类、目标检测、目标跟踪、图像分割、姿态估计、人脸识别等领域，是深度学习中使用最广泛的神经网络模型之一。


    # ## 2.2 卷积神经网络的基本结构


    典型的卷积神经网络一般由卷积层（含激活函数）、池化层、全连接层和输出层构成，其中卷积层与池化层一般交替排列，之后接一层或者多层全连接层，最后是输出层。因此，可将卷积神经网络视为一种多层模型，形象地体现了深度学习中“深度”的含义。


    # ### 2.2.1 卷积层


    +   1. 卷积运算


    卷积运算（Convolution）是数学中的常见运算，分为离散卷积与连续卷积，一维离散卷积和连续卷积、二维离散卷积与连续卷积的公式为'
  - '[PAGE 49]


    \((f * g)(n)=\int_{-\infty}^{\infty} f(\tau) g(n-\tau) \mathrm{d} \tau \quad (2-1)\)

    \((f * g)(n)=\sum_{\tau=-\infty}^{\infty} f(\tau) g(n-\tau) \quad (2-2)\)

    \((f * g)(x, y)=\sum_{\tau_1=-\infty}^{\infty} \sum_{\tau_2=-\infty}^{\infty}
    f(\tau_1, \tau_2) g(x-\tau_1, y-\tau_2) \quad (2-3)\)

    \((f * g)(x, y)=\int_{\tau_1=-\infty}^{\infty} \int_{\tau_2=-\infty}^{\infty}
    f(\tau_1, \tau_2) g(x-\tau_1, y-\tau_2) \mathrm{d} \tau_1 \mathrm{d} \tau_2 \quad
    (2-4)\)


    # 2. 卷积操作


    卷积运算是卷积神经网络的核心运算，给定二维图像 \( I \) 与二维卷积核 \( K \)，我们将其看作矩阵，根据上述二维离散卷积运算公式，图像 \( I
    \) 与卷积核 \( K \) 的卷积运算可表示为：


    \((I * K)(u, v)=\sum_i \sum_j I_{i, j} K_{(u-i), (v-j)} \quad (2-5)\)


    举例来说，给定 5x5 的输入图像 \( I \)、3x3 的卷积核 \( K \)，相应的卷积操作如图 2-4 所示。卷积操作时卷积窗口在输入图像 \(
    I \) 对应的输入上滑动，步长为 1。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_49_0.png)


    图 2-4 卷积运算示例


    需要说明的是，按照二维离散卷积公式，卷积核需要先翻转（先水平翻转再垂直翻转或者相反）再和滑动窗口中对应的数值相乘，求和得到输出中对应位置的值，如图 2-4
    中右上角的文字所示，\( H \) 代表水平翻转，\( V \) 代表垂直翻转。但是，在实际的卷积神经网络中，卷积核并没有翻转就可以和滑动窗口中对应的数值相乘，主要原因是卷积核中的值是训练得到的，翻转不翻转就没有关系了，所以并没有进行翻转，图
    2-4 中的卷积操作之后的结果也是按照没有翻转来计算的。


    进而，如果存在 \( k \) 个卷积核 \( K \)，则对于同一个二维输入矩阵，则可以得到 \( k \) 个相同大小的卷积输出矩阵，即引出了卷积层的概念，一个卷积层通常包含多个尺寸大小相同的卷积核，利用每一个卷积核对输入进行卷积运算，得到多个卷积输出，并将其作为下一层的输入。


    卷积神经网络中的卷积核相当于传统计算机视觉领域中的特征算子，用于提取图像特征，'
  - '[PAGE 50]


    如传统的 Sobel 梯度算子 45°方向模板被设计为：


    ```

    [-2  -1   0]

    [-1   0   1]

    [ 0   1   2]

    ```


    使用 Sobel 梯度算子进行卷积运算得到的梯度图如图 2-5 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_50_0.png)


    图 2-5 Sobel 算子梯度图（详见彩插）


    但不同于传统特征算子的是，传统特征算子需要人工设计，卷积神经网络中的卷积核参数则是通过训练学习得到的，不需要人工设计。同时，浅层卷积层学习到的卷积核参数提取的是基本特征，如图像中物体的边缘、方向和纹理等特征，随着卷积层的增加，深层卷积层提取出的图像特征更为复杂，出现了高层语义模式，如车轮、人脸等高阶特征，这也是卷积神经网络中特征的层次性表现。


    # 3. 数据填充


    从前面的卷积操作示例可以看到，用一个 3x3 的卷积核对 5x5 的图像进行卷积，只有 3x3 个可能的位置能够进行匹配。因此，会得到一个 3x3 的输出。如果有一个
    nxn 的图像，使用 fxf 的卷积核进行卷积操作，那么卷积输出的大小为 (n-f+1)x(n-f+1)。


    但是这样的话，卷积操作存在两个显而易见的缺点：1) 随着卷积层数的增多，图像会变得越来越小，到最后可能只有 1x1 大小，这也就限制了模型的复杂度；2) 观察前面的卷积操作示例，对于输入图像中间的数据，有许多
    3x3 的区域与之重叠，而对于图像边缘的数据，则只被利用了一次，这也意味着在进行卷积操作过程中，丢失了图像边缘的很多信息。


    为了解决这些问题，一个很朴素的方法就是在进行卷积操作之前对输入图像进行数据填充。如前面的卷积操作示例，可以在图像边缘填充一层数据，如图 2-6 所示。这样的话，原始输入
    5x5 变成了 7x7，再使用 3x3 的卷积核进行卷积，得到的输出大小则为 (7-3+1)x(7-3+1)= 5x5，与输入图像大小相同。原则上，可以在原始图像边缘外填充任意层的数据，如果有一个
    nxn 的图像，使用 fx f 的卷积核进行卷积操作，在进行卷积操作之前在图像周围填充 p 层数据，那'
  - '[PAGE 51]


    么卷积输出的大小为 $(n+2p-f+1)\times(n+2p-f+1)$。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_51_0.png)


    在使用 PyTorch 或者 TensorFlow 等深度学习框架时，卷积层会有 Padding 参数，常用的有三种选择：Full、Valid 和 Same。Full
    表示需要填充，当卷积核与输入开始接触时进行卷积操作；Valid 表示不需要填充；Same 表示需要填充并保证输出与输入具有相同的尺寸，如图 2-7 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_51_1.png)


    # 4. 卷积步长


    在构建卷积神经网络时，卷积步长也是一个很重要的基本参数。仍以前面的卷积示例为例，将卷积步长设置为 2，卷积操作如图 2-8 所示。原则上，可以自行设置卷积步长，如果有'
