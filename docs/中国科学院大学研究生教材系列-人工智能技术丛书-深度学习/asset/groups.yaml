    使用 Dropout 的神经网络的测试（泛化）过程：


    +   1) 测试时使用所有神经元。

    +   2) 使用过 Dropout 的层中的所有神经元的激活值需要乘以 $(1-p)$。


    Dropout 可以看作是一种高效的近似 Bagging 的集成方法，并且是共享隐藏层单元的集成方法。Warde-Farley 等人将 Dropout 与集成模型的训练进行比较并得出结论：相比独立模型集成后获得的泛化误差，Dropout
    会有更好地改进。


    同时，Dropout 减少了隐藏层神经元之间的复杂的共适应关系。因为 Dropout 使得两个隐藏'
