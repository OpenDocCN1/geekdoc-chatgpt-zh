    RNN 的训练一般采用基于时间的反向传播算法（Back Propagation Through Time，BPTT）[3]，它在反向传播算法的基础上加上了时间演化。首先回顾一下反向传播算法的主要思想：定义误差函数
    \( E \)，通过链式法则自顶向下求得 \( E \) 对网络权重与偏置的偏导，之后沿梯度的反方向更新权重与偏置的值，直到 \( E \) 收敛。下面以图
    3-3 中的 RNN 为例，基于文献 [10]，详细讲解 BPTT 算法的流程。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_95_1.png)


    图 3-3 一个典型的 RNN 示例（\( E_0 \sim E_4 \) 是每个时刻的误差函数，\( E \) 为总误差函数）


    首先，对公式（3-1）和公式（3-2）中的 RNN 定义进行简化，不考虑偏置，得到：


    \( h_t = \tanh(Ux_t + Wh_{t-1}) \quad (3-3) \)


    \( \hat{y}_t = \text{softmax}(Vh_t) \quad (3-4) \)


    RNN 的损失函数选用交叉熵损失，如下所示：


    \( E_i(y_i, \hat{y}_i) = -y_i \log \hat{y}_i, \quad (3-5) \)


    \( E(y, \hat{y}) = \sum_i E_i(y_i, \hat{y}_i) = - \sum_i y_i \log \hat{y}_i, \quad
    (3-6) \)


    根据反向传播算法，需要求 E 对 U、V、W 的梯度：


    \( \frac{\partial E}{\partial V} = \sum_i \frac{\partial E_i}{\partial V}, \quad
    (3-7) \)


    \( \frac{\partial E}{\partial W} = \sum_i \frac{\partial E_i}{\partial W}, \quad
    (3-8) \)


    \( \frac{\partial E}{\partial U} = \sum_i \frac{\partial E_i}{\partial U}, \quad
    (3-9) \)


    如图 3-4 所示，求 E 对 V 的梯度，需要分别求各个时刻的误差 E_i 对 V 的梯度再求和，以求 E_3 对 V 的梯度为例：


    \( \frac{\partial E_3}{\partial V} = \frac{\partial E_3}{\partial \hat{y}_3} \frac{\partial
    \hat{y}_3}{\partial V} = \frac{\partial E_3}{\partial \hat{y}_3} \frac{\partial
    \hat{y}_3}{\partial z_3} \frac{\partial z_3}{\partial V}, \quad (3-10) \)


    其中，\( z_3 = V h_3 \)，同样求得其他时刻误差对 V 的梯度，求和可得 \( \frac{\partial E}{\partial V} \)。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_96_0.png)


    图 3-4 求 E 对 V 的梯度示意图


    如图 3-5 所示，求 E 对 W 的梯度，也是以求 E_3 对 W 的梯度为例：


    \( \frac{\partial E_3}{\partial W} = \frac{\partial E_3}{\partial \hat{y}_3} \frac{\partial
    \hat{y}_3}{\partial h_3} \frac{\partial h_3}{\partial W}, \quad (3-11) \)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_96_1.png)


    图 3-5 求 E 对 W 的梯度示意图


    \( h_3 = \tanh(Ux_3+Wh_2) \quad (3-12) \)


    \( \frac{\partial E_3}{\partial W} = \sum_{k=0}^3 \frac{\partial E_3}{\partial
    \hat{y}_3} \frac{\partial \hat{y}_3}{\partial h_3} \frac{\partial h_3}{\partial
    \theta_k} \frac{\partial \theta_k}{\partial W} = \sum_{k=0}^3 \frac{\partial E_3}{\partial
    \hat{y}_3} \frac{\partial \hat{y}_3}{\partial h_3} \left( \prod_{j=k+1}^3 \frac{\partial
    h_j}{\partial h_{j-1}} \right) \frac{\partial h_k}{\partial W} \quad (3-13) \)


    需要说明的是：\( h_3 \) 依赖于 \( h_2 \)，而 \( h_2 \) 依赖于 \( h_1 \) 和 \( W \)，依赖关系一直传递到 \(
    t=0 \) 的时刻。

    因此，当计算对 \( W \) 的偏导时，不能把 \( h_2 \) 看作是常数项。


    同样求得其他时刻误差对 \( W \) 的梯度，求和可得 \(\frac{\partial E}{\partial W}\)。


    如图 3-6 所示，求 \( E \) 对 \( U \) 的梯度，同样以求 \( E_3 \) 对 \( U \) 的梯度为例：


    \( \frac{\partial E_3}{\partial U} = \frac{\partial E_3}{\partial \hat{y}_3} \frac{\partial
    \hat{y}_3}{\partial h_3} \frac{\partial h_3}{\partial U} \quad (3-14) \)


    \( h_3 = \tanh(Ux_3+Wh_2) \quad (3-15) \)


    \( \frac{\partial E_3}{\partial U} = \sum_{k=0}^3 \frac{\partial E_3}{\partial
    \hat{y}_3} \frac{\partial \hat{y}_3}{\partial h_3} \frac{\partial h_3}{\partial
    \theta_k} \frac{\partial \theta_k}{\partial U} = \sum_{k=0}^3 \frac{\partial E_3}{\partial
    \hat{y}_3} \frac{\partial \hat{y}_3}{\partial h_3} \left( \prod_{j=k+1}^3 \frac{\partial
    h_j}{\partial h_{j-1}} \right) \frac{\partial h_k}{\partial U} \quad (3-16) \)


    同样，需要说明的是：\( h_3 \) 依赖于 \( h_2 \)，而 \( h_2 \) 依赖于 \( h_1 \) 和 \( U \)，依赖关系一直传递到
    \( t=0 \) 的

    时刻。因此，当计算对 \( U \) 的偏导时，也不能把 \( h_2 \) 看作是常数项。


    同样求得其他时刻误差对 \( U \) 的梯度，求和可得 \(\frac{\partial E}{\partial U}\)。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_97_0.png)


    ### 3.3 长短期记忆网络


    循环神经网络的前向传播过程，会使得与当前时刻间隔较长的时间步对当前的影响削弱

    甚至消失，其根本原因在于 BPTT 算法与 BP 算法一样，在进行梯度反向传播的时候，会产生

    梯度不断减小甚至消失的问题。


    为了解决循环神经网络的梯度消失问题，人们提出了多种方法，包括引入时间维度的跳

    跃连接、门控 RNN、梯度截断、引导信息流的正则化和外部记忆等方法。其中，门控 RNN 是

    一类比较特殊的 RNN，最有代表性的是 LSTM[5]。本节我们将详细介绍 LSTM 的网络结构。


    LSTM 单元（Unit）一般由一个细胞（Cell）、一个输入门（Input Gate）、一个输出门

    （Output Gate）和一个遗忘门（Forget Gate）组成。细胞能够记住任意时间间隔上的细胞状态，

