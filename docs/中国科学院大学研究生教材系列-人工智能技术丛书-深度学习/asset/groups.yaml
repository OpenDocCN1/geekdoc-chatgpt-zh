    Maxout 激活函数的优点是能够缓解梯度消失问题，规避了 ReLU 激活函数“神经元死亡”的缺点。Maxout 激活函数的缺点是增加了一层神经网络，无形中增加了参数和计算量。


    ## 7. 卷积神经网络中的激活函数选择


    卷积神经网络中，尽量不要使用 Sigmoid 激活函数，因为它的梯度小于 1，将导致梯度消失问题。因此，一般首先选用 ReLU 激活函数，使用较小的学习率，以免造成神经元死亡的情况。如果
    ReLU 激活函数失效，考虑使用 Leaky ReLU、PReLU、ELU 或者 Maxout，此时一般情况下都可以解决。


    ### 2.2.3 池化层


    池化操作使用某位置相邻输出的总体统计特征作为该位置的输出，常用的池化类型有最大池化（Max Pooling）和均值池化（Average Pooling）。池化层不包含需要学习的参数，只需要指定池化核的大小、步长以及池化类型。举例来说，输入
    3×3 的特征图，池化核大小为 2×2，步长为 1，那么对其进行池化操作的情况如图 2-18 所示。


    池化操作实际上是对输入对象进行“降采样”（Down-sampling）操作，一定程度上提高了模型的容错能力。池化的引入保证了当输入出现少量平移时，输出近似不变；池化核的指定相当于在空间范围内对特征图的特征进行了维度约减，同时缩小了下一层输入的特征图尺寸，进而在一定程度上减少了网络的参数个数和计算量。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_57_0.png)


    图 2-18 池化操作示例


    ### 2.2.4 全连接层


    全连接层一般由一到多层的全连接神经网络组成，它的功能是对卷积层或池化层输出的特征图（二维）进行降维，输出一维的数据，最终送到输出层进行分类或者回归。以两层全连接层为例，全连接层的组成以及计算过程如图
    2-19 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_57_1.png)


    图 2-19 全连接层示例（详见彩插）


    ### 2.2.5 输出层


    对于分类问题，输出层一般采用 Softmax 函数来进行计算，计算公式如下：


    \( y_i = \frac{e^{x_i}}{\sum_{i=1}^n e^{x_i}} \) (2-13)


    Softmax 计算示例如图 2-20 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_58_0.png)


    图 2-20 Softmax 计算示例


    对于回归问题，输出层一般采用线性函数来进行计算，计算公式如下：


    \( y_i = \sum_{m=1}^M w_{im} x_m \) (2-14)


    ## 2.3 卷积神经网络的训练


    ### 2.3.1 卷积神经网络的训练过程


    以图像分类任务为例，卷积神经网络的训练过程如下所示。


    - 1) 用随机数初始化网络需要训练的参数（如权重、偏置）。

    - 2) 将训练图像作为输入，进行卷积层、ReLU、池化层以及全连接层的前向传播，并计算每个类别的对应输出概率。

    - 3) 计算输出层的总误差：总误差 = - \(\sum\) (目标概率 \(\times\) log(输出概率))。

    - 4) 使用 BP 算法计算总误差相对于所有参数的梯度，并用梯度下降法或其他优化算法更新所有参数的值，以使输出误差最小。


    需要说明的是，卷积核个数、卷积核大小以及网络架构，是在步骤 1) 之前就已经确定的，且不会在训练过程中改变，只有网络的其他参数，如神经元的权重、偏置会更新。


    ### 2.3.2 池化层的训练


    要实现池化层的训练，首先需要将池化层转化为多层神经网络的形式，如图 2-21 所示。无论是最大池化还是均值池化，均没有需要学习的参数，因此对池化层的训练所需要的操作仅仅是将误差项传递到上一层，而不需要计算梯度。如图
    2-22 所示，假设第 (l-1) 层的特征图大小为 4x4，池化核大小为 2x2，步长为 2，进行最大池化后，第 l 层的特征图大小为 2x2，同样假设第
    l 层的误差项已经得到计算，需要做的则是将误差项传递到第 (l-1) 层。下面根据池化类型来具体说明。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_59_0.png)


    图 2-21 池化层转化为多层神经网络的形式


    - - 池化核大小为2 x 2，下一层每一个神经元与输入层特定的四个神经元相连接

    - - 最大池化时，输入值最大的神经元权重为1，其他为0（图示中实线权重为1，虚线权重为0）


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_59_1.png)


    图 2-22 池化层误差反传


    ### 1. 最大池化


    对于最大池化，第 l 层的误差项会原封不动的传递到第 (l-1) 层对应感受域最大值（前向传播时记录的最大值的位置索引）所对应的神经元，而其他神经元的误差项则都为
    0，如图 2-23 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_60_0.png)


    图 2-23 最大池化的误差反传


    ### 2. 均值池化


    对于均值池化，第 l 层的误差项会平均分配到第（l-1）层对应感受域的每一个神经元，如图 2-24 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_60_1.png)


    图 2-24 均值池化的误差反传


    ### 2.3.3 卷积层的训练


    要实现卷积层的训练，也需要首先将卷积层转化为多层神经网络的形式，如图 2-25 所示。然后，使用反向传播算法进行训练。


    由人工神经网络的反向传播算法可知，需要计算每一个神经元的误差项，从而计算每个神经元连接权重的梯度。


    ### 1. 误差项的计算


    首先考虑最简单的情况，卷积步长为 1，卷积核个数也为 1。假设输入的图像大小为 3×3，卷积核大小为 2×2，不进行数据填充，得到的输出特征图大小为 2×2，如图
    2-26 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_0.png)


    - - 卷积核大小为2×2，步长为1

    - - 卷积核中的值相当于权重

    - - 下层神经元只与上层特定的神经元相连接，如\(n^l_{1,1}\)只与\(n^{l-1}_{1,1}\)、\(n^{l-1}_{1,2}\)、\(n^{l-1}_{2,1}\)、\(n^{l-1}_{2,2}\)连接


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_1.png)


    图 2-25 卷积层转化为多层神经网络的形式


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_2.png)


    图 2-26 误差项的计算（图 1）


    其中 E 为误差， net^l = conv( W^l, a^{l-1} ) + W_b^l , a_{i,j}^{l-1} = f^{-1}( net_{i,j}^{l-1})
    ，下标 i 和 j 分别表示输入层输出的行索引与列索引，\(W^l\) 为卷积核参数，\(W^l_b\) 为偏置参数，\(a^{l-1}\) 为第（l-1）层的输出，conv
    为卷积运算，\(f^{l-1}\) 为第（l-1）层的激活函数。假设第 l 层的误差项 \(\delta^l\) 已经得到计算，需要利用 \(\delta^l\)
    计算第（l-1）层的误差项 \(\delta^{l-1}\)。由反向传播算法，得到第（l-1）层每个位置的梯度：


    \(\delta^{l-1}_{i,j} = \frac{\partial E}{\partial net^{l-1}_{i,j}} = \frac{\partial
    E}{\partial a^{l-1}_{i,j}} \frac{\partial a^{l-1}_{i,j}}{\partial net^{l-1}_{i,j}}\)
    (2-15)


    这里不进行推导，仅给出如何计算第 1 项 \(\frac{\partial E}{\partial a^{l-1}_{i,j}}\) 的结论。如图 2-27
    所示，已知第 l 层的误差项 \(\delta^l\)，将其作为输入并进行数据填充，将原卷积核进行 180°翻转，然后进行卷积运算，即


    \(\frac{\partial E}{\partial a^{l-1}_{i,j}} = \sum_{m=1}^{y''} \sum_{n=1}^{x''}
    w^{l''}_{m,n} \delta^l_{m,n}\) (2-16)


    其中，下标 m 和 n 分别表示卷积核中值的行索引与列索引，M 和 N 分别表示卷积核的高度与宽度，在本节示例（见图 2-26 和图 2-27）中，M =
    N = 2。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_62_0.png)


    然后计算第 2 项 \(\frac{\partial a^{l-1}_{i,j}}{\partial \text{net}^{l-1}_{i,j}}\)，因为
    \(a^{l-1}_{i,j} = f^{l-1}(\text{net}^{l-1}_{i,j})\)，因此只需要求第 \((l-1)\) 层激活函数的导数即可，即


    \(\frac{\partial a^{l-1}_{i,j}}{\partial \text{net}^{l-1}_{i,j}} = f''(\text{net}^{l-1}_{i,j})\)
    (2-17)


    ### 2. 参数梯度的计算


    计算得到每一层的误差项后，还需要计算卷积核的权重和偏置参数的梯度，如下所示：


    \(\nabla W^l_{i,j} = \frac{\partial E}{\partial W^l_{i,j}} = \sum_m \sum_n \frac{\partial
    E}{\partial \text{net}^{l''}_{m,n}} \frac{\partial \text{net}^{l''}_{m,n}}{\partial
    W^l_{i,j}} = \sum_m \sum_n \delta_{m,n} a^{l-1}_{i+m,j+n}\) (2-18)


    \(\nabla W^l_{b} = \frac{\partial E}{\partial W^l_{b}} = \sum_m \sum_n \frac{\partial
    E}{\partial \text{net}^{l''}_{m,n}} \frac{\partial \text{net}^{l''}_{m,n}}{\partial
    W^l_{b}} = \sum_m \sum_n \delta_{m,n}\) (2-19)


    同样，不进行详细的推导，仅给出了计算结论。得到每个权重参数的梯度后，则可以根据梯度下降算法来更新每个权重。


    在上述示例中，假设输入图像的大小为 3×3，卷积核大小为 2×2，得到的输出特征图大小为 2×2。对于更大尺寸的图像输入和卷积核，上述公式仍然适用。


    ## 2.4 典型卷积神经网络


    ### 2.4.1 LeNet-5


    LeNet-5[3] 由 Yann LeCun 等人于 1998 年提出，主要进行手写数字识别和手写英文字母识别。LeNet-5 是一个经典的卷积神经网络，它虽然网络层次并不多，但是功能齐全，是学习卷积神经网络的基础。LeNet-5
    的官方主页为 http://yann.lecun.com/exdb/lenet/。


    LeNet-5 的结构如图 2-28 所示，每个层次描述如下。


    - 1) 输入层：输入尺寸大小为 32×32 的图像。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_63_0.png)


    图 2-28 LeNet 的组成结构


    - 2) C1 层（卷积层）：选用 6 个 5×5 的卷积核，步长为 1，得到 6 个大小为 28×28 的特征图（32-5+1=28），神经元个数为 6×28×28=4704。

    - 3) S2 层（下采样层）：对 C1 所得 6 个 28×28 的特征图进行均值池化，池化核大小选择 2×2，步长为 2，得到的均值乘上一个权重加上一个偏置作为
    Sigmoid 激活函数的输入，得到 6 个 14×14 的特征图，神经元个数为 6×14×14=1176。

    - 4) C3 层（卷积层）：选用 16 个 5×5 的卷积核组（前 6 个卷积核组中的卷积核个数为 3，中间 6 个为 4，之后 3 个为 4，最后 1
    个为 6）对 S2 层的输出特征图进行卷积，加偏置和 Sigmoid 激活函数后得到 16 个 10×10（14-5+1=10）的特征图，此时神经元个数为
    16×10×10=1600。C3 层的 16 个卷积核组的设计情况如图 2-29 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_63_1.png)


    图 2-29 C3 层的 16 个卷积核组


    - 5) S4 层（下采样层）：对 C3 所得 16 个 10×10 的特征图进行最大池化，池化核大小为 2×2，步长为 2，得到的最大值乘以一个权重，再加上一个偏置作为
    Sigmoid 激活函数的输入，得到 16 个 5×5 的特征图，神经元个数减少为 16×5×5=400。

    - 6) C5 层（卷积层）：选用 16 个 5×5 的卷积核进行卷积，结果乘以一个权重并求和，再加上一个偏置作为 Sigmoid 激活函数的输入，得到 1×1（5-5+1=1）的特征图。然后希望得到
    120 个特征图，就要使用总共 120 个 5x5 的卷积核组（每个卷积核组包含 16 个卷积核）进行卷积，神经元个数减少为 120 个。

    - 7) F6 层（全连接层）：与 C5 层全连接，有 84 个神经元，对应于一个 7×12 的比特图。将输入乘以一个权重并求和，再加上一个偏置作为 Sigmoid
    函数的输入，得到 84 个值。

    - 8) 输出层（全连接层）：与 F6 层全连接，共有 10 个神经元，分别代表数字 0 到 9。输出层采用径向基函数（Radial Basis Function（RBF））的网络连接方式，如图
    2-30 所示。径向基函数的定义如公式（2-20）所示，其中 \(w_y\) 的值由 \(i\) 的比特图编码确定，\(i\) 的取值从 0 到 9，\(j\)
    的取值从 0 到 83(7×12-1)。第 \(i\) 个神经元的径向基函数输出值越接近于 0，表示当前网络输入的识别结果与字符 \(i\) 越接近。


    \( y_i = \sum_j (x_j - w_y)^2 \) (2-20)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_64_0.png)


    ### 2.4.2 AlexNet


    AlexNet[4] 由 Alex Krizhevsky 等人于 2012 年提出，可以说 AlexNet 确定了卷积神经网络在计算机视觉领域的重要地位，同时也推动了深度学习在语音识别、自然语言处理等领域的发展。AlexNet
    使用了一些新的技术，如下所示：


    - 1) 首次应用 ReLU 作为激活函数，成功解决了 Sigmoid 激活函数带来的梯度消失问题。

    - 2) 训练过程中使用 Dropout 技术随机丢弃一部分神经元，成功避免了模型陷入过拟合。

    - 3) 在 AlexNet 之前的卷积神经网络中普遍使用均值池化，但在 AlexNet 中使用了重叠最大池化（池化步长小于池化核大小），让池化层的输出之间存在重叠和覆盖，一定程度上提升了特征的丰富性。

    - 4) 首次使用 CUDA 加速卷积神经网络的训练过程。

    - 5) 使用了数据增强，基于大小为 256×256 的原始图像重复截取 224×224 大小的区域，大幅增加了数据量，减轻了过拟合，提升了模型的泛化能力。

    - 6) 对图像数据通过主成分分析（Principal Component Analysis，PCA）方法进行降维处理，并对主成分做标准差为 0.1 的高斯扰动以增加噪声，使得识别错误率再次下降。


    AlexNet 论文中使用的网络模型如图 2-31 所示，受制于当时的计算能力，论文中提到训练时使用了两块 GPU，因此 AlexNet 的结构也相应地被拆分成了两个部分。但如今的
    GPU 已经足以放下整个模型，因此其结构可以简化为如图 2-32 所示的结构。


    AlexNet 的网络结构分为 8 层（池化层未单独算作一层），包括 5 个卷积层以及 3 个全连接层。


    - 1) 输入层：AlexNet 首先使用大小为 224×224×3 图像作为输入，后改为 227×227×3。

    - 2) 第 1 个卷积层（含池化）：包含 96 个大小为 11×11 的卷积核，卷积步长为 4，因此，卷积后的输出为 55×55×96；然后构建一个核大小为
    3×3、步长为 2 的最大池化进行数据降采样，进而输出变为 27×27×96。

    '
  mdcn: '

    其中 \(\alpha\) 是一个需要学习的参数，当指定 \(\alpha = 0.01\) 时，又称为 Leaky ReLU；当 \(\alpha\) 通过高斯分布随机产生时，又称为随机化的
    ReLU（Randomized ReLU，RReLU）。


    PReLU 激活函数的优点是比 Sigmoid 激活函数收敛快，解决了 ReLU 激活函数的“神经元死亡”问题。PReLU 激活函数的缺点是需要再学习一个参数
    \(\alpha\)，工作量变大。


    ## 5. ELU 激活函数


    为了解决“神经元死亡”问题，也可以使用 ELU 激活函数，其函数定义为


    \(f(x) = \begin{cases} \alpha(e^x - 1), & x < 0 \\ x, & x \geqslant 0 \end{cases},
    x \in (-\infty, +\infty)\) (2-11)


    ELU 激活函数及其梯度如图 2-16 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_56_0.png)


    图 2-16 ELU 激活函数（\(\alpha = 1\)）及其梯度


    ELU 激活函数的优点是处理含有噪声的数据有优势，与 Sigmoid 激活函数相比更容易收敛。ELU 激活函数的缺点是计算量较大，与 ReLU 激活函数相比，收敛速度较慢。


    ## 6. Maxout 激活函数


    Maxout 激活函数实际上是增加了一层全连接神经网络，神经元个数 \(k\) 自定，其函数定义为


    \(h_i(x) = \max_{j \in \{1, \dots, k\}} z_{ij}, \quad \text{其中} \quad z_{ij} =
    x^T w_{ij} + b_{ij}\) (2-12)


    Maxout 激活函数的结构如图 2-17 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_56_1.png)


    图 2-17 Maxout 激活函数的结构


    Maxout 激活函数的优点是能够缓解梯度消失问题，规避了 ReLU 激活函数“神经元死亡”的缺点。Maxout 激活函数的缺点是增加了一层神经网络，无形中增加了参数和计算量。


    ## 7. 卷积神经网络中的激活函数选择


    卷积神经网络中，尽量不要使用 Sigmoid 激活函数，因为它的梯度小于 1，将导致梯度消失问题。因此，一般首先选用 ReLU 激活函数，使用较小的学习率，以免造成神经元死亡的情况。如果
    ReLU 激活函数失效，考虑使用 Leaky ReLU、PReLU、ELU 或者 Maxout，此时一般情况下都可以解决。


    ### 2.2.3 池化层


    池化操作使用某位置相邻输出的总体统计特征作为该位置的输出，常用的池化类型有最大池化（Max Pooling）和均值池化（Average Pooling）。池化层不包含需要学习的参数，只需要指定池化核的大小、步长以及池化类型。举例来说，输入
    3×3 的特征图，池化核大小为 2×2，步长为 1，那么对其进行池化操作的情况如图 2-18 所示。


    池化操作实际上是对输入对象进行“降采样”（Down-sampling）操作，一定程度上提高了模型的容错能力。池化的引入保证了当输入出现少量平移时，输出近似不变；池化核的指定相当于在空间范围内对特征图的特征进行了维度约减，同时缩小了下一层输入的特征图尺寸，进而在一定程度上减少了网络的参数个数和计算量。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_57_0.png)


    图 2-18 池化操作示例


    ### 2.2.4 全连接层


    全连接层一般由一到多层的全连接神经网络组成，它的功能是对卷积层或池化层输出的特征图（二维）进行降维，输出一维的数据，最终送到输出层进行分类或者回归。以两层全连接层为例，全连接层的组成以及计算过程如图
    2-19 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_57_1.png)


    图 2-19 全连接层示例（详见彩插）


    ### 2.2.5 输出层


    对于分类问题，输出层一般采用 Softmax 函数来进行计算，计算公式如下：


    \( y_i = \frac{e^{x_i}}{\sum_{i=1}^n e^{x_i}} \) (2-13)


    Softmax 计算示例如图 2-20 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_58_0.png)


    图 2-20 Softmax 计算示例


    对于回归问题，输出层一般采用线性函数来进行计算，计算公式如下：


    \( y_i = \sum_{m=1}^M w_{im} x_m \) (2-14)


    ## 2.3 卷积神经网络的训练


    ### 2.3.1 卷积神经网络的训练过程


    以图像分类任务为例，卷积神经网络的训练过程如下所示。


    - 1) 用随机数初始化网络需要训练的参数（如权重、偏置）。

    - 2) 将训练图像作为输入，进行卷积层、ReLU、池化层以及全连接层的前向传播，并计算每个类别的对应输出概率。

    - 3) 计算输出层的总误差：总误差 = - \(\sum\) (目标概率 \(\times\) log(输出概率))。

    - 4) 使用 BP 算法计算总误差相对于所有参数的梯度，并用梯度下降法或其他优化算法更新所有参数的值，以使输出误差最小。


    需要说明的是，卷积核个数、卷积核大小以及网络架构，是在步骤 1) 之前就已经确定的，且不会在训练过程中改变，只有网络的其他参数，如神经元的权重、偏置会更新。


    ### 2.3.2 池化层的训练


    要实现池化层的训练，首先需要将池化层转化为多层神经网络的形式，如图 2-21 所示。无论是最大池化还是均值池化，均没有需要学习的参数，因此对池化层的训练所需要的操作仅仅是将误差项传递到上一层，而不需要计算梯度。如图
    2-22 所示，假设第 (l-1) 层的特征图大小为 4x4，池化核大小为 2x2，步长为 2，进行最大池化后，第 l 层的特征图大小为 2x2，同样假设第
    l 层的误差项已经得到计算，需要做的则是将误差项传递到第 (l-1) 层。下面根据池化类型来具体说明。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_59_0.png)


    图 2-21 池化层转化为多层神经网络的形式


    - - 池化核大小为2 x 2，下一层每一个神经元与输入层特定的四个神经元相连接

    - - 最大池化时，输入值最大的神经元权重为1，其他为0（图示中实线权重为1，虚线权重为0）


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_59_1.png)


    图 2-22 池化层误差反传


    ### 1. 最大池化


    对于最大池化，第 l 层的误差项会原封不动的传递到第 (l-1) 层对应感受域最大值（前向传播时记录的最大值的位置索引）所对应的神经元，而其他神经元的误差项则都为
    0，如图 2-23 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_60_0.png)


    图 2-23 最大池化的误差反传


    ### 2. 均值池化


    对于均值池化，第 l 层的误差项会平均分配到第（l-1）层对应感受域的每一个神经元，如图 2-24 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_60_1.png)


    图 2-24 均值池化的误差反传


    ### 2.3.3 卷积层的训练


    要实现卷积层的训练，也需要首先将卷积层转化为多层神经网络的形式，如图 2-25 所示。然后，使用反向传播算法进行训练。


    由人工神经网络的反向传播算法可知，需要计算每一个神经元的误差项，从而计算每个神经元连接权重的梯度。


    ### 1. 误差项的计算


    首先考虑最简单的情况，卷积步长为 1，卷积核个数也为 1。假设输入的图像大小为 3×3，卷积核大小为 2×2，不进行数据填充，得到的输出特征图大小为 2×2，如图
    2-26 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_0.png)


    - - 卷积核大小为2×2，步长为1

    - - 卷积核中的值相当于权重

    - - 下层神经元只与上层特定的神经元相连接，如\(n^l_{1,1}\)只与\(n^{l-1}_{1,1}\)、\(n^{l-1}_{1,2}\)、\(n^{l-1}_{2,1}\)、\(n^{l-1}_{2,2}\)连接


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_1.png)


    图 2-25 卷积层转化为多层神经网络的形式


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_61_2.png)


    图 2-26 误差项的计算（图 1）


    其中 E 为误差， net^l = conv( W^l, a^{l-1} ) + W_b^l , a_{i,j}^{l-1} = f^{-1}( net_{i,j}^{l-1})
    ，下标 i 和 j 分别表示输入层输出的行索引与列索引，\(W^l\) 为卷积核参数，\(W^l_b\) 为偏置参数，\(a^{l-1}\) 为第（l-1）层的输出，conv
    为卷积运算，\(f^{l-1}\) 为第（l-1）层的激活函数。假设第 l 层的误差项 \(\delta^l\) 已经得到计算，需要利用 \(\delta^l\)
    计算第（l-1）层的误差项 \(\delta^{l-1}\)。由反向传播算法，得到第（l-1）层每个位置的梯度：


    \(\delta^{l-1}_{i,j} = \frac{\partial E}{\partial net^{l-1}_{i,j}} = \frac{\partial
    E}{\partial a^{l-1}_{i,j}} \frac{\partial a^{l-1}_{i,j}}{\partial net^{l-1}_{i,j}}\)
    (2-15)


    这里不进行推导，仅给出如何计算第 1 项 \(\frac{\partial E}{\partial a^{l-1}_{i,j}}\) 的结论。如图 2-27
    所示，已知第 l 层的误差项 \(\delta^l\)，将其作为输入并进行数据填充，将原卷积核进行 180°翻转，然后进行卷积运算，即


    \(\frac{\partial E}{\partial a^{l-1}_{i,j}} = \sum_{m=1}^{y''} \sum_{n=1}^{x''}
    w^{l''}_{m,n} \delta^l_{m,n}\) (2-16)


    其中，下标 m 和 n 分别表示卷积核中值的行索引与列索引，M 和 N 分别表示卷积核的高度与宽度，在本节示例（见图 2-26 和图 2-27）中，M =
    N = 2。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_62_0.png)


    然后计算第 2 项 \(\frac{\partial a^{l-1}_{i,j}}{\partial \text{net}^{l-1}_{i,j}}\)，因为
    \(a^{l-1}_{i,j} = f^{l-1}(\text{net}^{l-1}_{i,j})\)，因此只需要求第 \((l-1)\) 层激活函数的导数即可，即


    \(\frac{\partial a^{l-1}_{i,j}}{\partial \text{net}^{l-1}_{i,j}} = f''(\text{net}^{l-1}_{i,j})\)
    (2-17)


    ### 2. 参数梯度的计算


    计算得到每一层的误差项后，还需要计算卷积核的权重和偏置参数的梯度，如下所示：


    \(\nabla W^l_{i,j} = \frac{\partial E}{\partial W^l_{i,j}} = \sum_m \sum_n \frac{\partial
    E}{\partial \text{net}^{l''}_{m,n}} \frac{\partial \text{net}^{l''}_{m,n}}{\partial
    W^l_{i,j}} = \sum_m \sum_n \delta_{m,n} a^{l-1}_{i+m,j+n}\) (2-18)


    \(\nabla W^l_{b} = \frac{\partial E}{\partial W^l_{b}} = \sum_m \sum_n \frac{\partial
    E}{\partial \text{net}^{l''}_{m,n}} \frac{\partial \text{net}^{l''}_{m,n}}{\partial
    W^l_{b}} = \sum_m \sum_n \delta_{m,n}\) (2-19)


    同样，不进行详细的推导，仅给出了计算结论。得到每个权重参数的梯度后，则可以根据梯度下降算法来更新每个权重。


    在上述示例中，假设输入图像的大小为 3×3，卷积核大小为 2×2，得到的输出特征图大小为 2×2。对于更大尺寸的图像输入和卷积核，上述公式仍然适用。


    ## 2.4 典型卷积神经网络


    ### 2.4.1 LeNet-5


    LeNet-5[3] 由 Yann LeCun 等人于 1998 年提出，主要进行手写数字识别和手写英文字母识别。LeNet-5 是一个经典的卷积神经网络，它虽然网络层次并不多，但是功能齐全，是学习卷积神经网络的基础。LeNet-5
    的官方主页为 http://yann.lecun.com/exdb/lenet/。


    LeNet-5 的结构如图 2-28 所示，每个层次描述如下。


    - 1) 输入层：输入尺寸大小为 32×32 的图像。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_63_0.png)


    图 2-28 LeNet 的组成结构


    - 2) C1 层（卷积层）：选用 6 个 5×5 的卷积核，步长为 1，得到 6 个大小为 28×28 的特征图（32-5+1=28），神经元个数为 6×28×28=4704。

    - 3) S2 层（下采样层）：对 C1 所得 6 个 28×28 的特征图进行均值池化，池化核大小选择 2×2，步长为 2，得到的均值乘上一个权重加上一个偏置作为
    Sigmoid 激活函数的输入，得到 6 个 14×14 的特征图，神经元个数为 6×14×14=1176。

    - 4) C3 层（卷积层）：选用 16 个 5×5 的卷积核组（前 6 个卷积核组中的卷积核个数为 3，中间 6 个为 4，之后 3 个为 4，最后 1
    个为 6）对 S2 层的输出特征图进行卷积，加偏置和 Sigmoid 激活函数后得到 16 个 10×10（14-5+1=10）的特征图，此时神经元个数为
    16×10×10=1600。C3 层的 16 个卷积核组的设计情况如图 2-29 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_63_1.png)


    图 2-29 C3 层的 16 个卷积核组


    - 5) S4 层（下采样层）：对 C3 所得 16 个 10×10 的特征图进行最大池化，池化核大小为 2×2，步长为 2，得到的最大值乘以一个权重，再加上一个偏置作为
    Sigmoid 激活函数的输入，得到 16 个 5×5 的特征图，神经元个数减少为 16×5×5=400。

    - 6) C5 层（卷积层）：选用 16 个 5×5 的卷积核进行卷积，结果乘以一个权重并求和，再加上一个偏置作为 Sigmoid 激活函数的输入，得到 1×1（5-5+1=1）的特征图。然后希望得到
    120 个特征图，就要使用总共 120 个 5x5 的卷积核组（每个卷积核组包含 16 个卷积核）进行卷积，神经元个数减少为 120 个。

    - 7) F6 层（全连接层）：与 C5 层全连接，有 84 个神经元，对应于一个 7×12 的比特图。将输入乘以一个权重并求和，再加上一个偏置作为 Sigmoid
    函数的输入，得到 84 个值。

    - 8) 输出层（全连接层）：与 F6 层全连接，共有 10 个神经元，分别代表数字 0 到 9。输出层采用径向基函数（Radial Basis Function（RBF））的网络连接方式，如图
    2-30 所示。径向基函数的定义如公式（2-20）所示，其中 \(w_y\) 的值由 \(i\) 的比特图编码确定，\(i\) 的取值从 0 到 9，\(j\)
    的取值从 0 到 83(7×12-1)。第 \(i\) 个神经元的径向基函数输出值越接近于 0，表示当前网络输入的识别结果与字符 \(i\) 越接近。


    \( y_i = \sum_j (x_j - w_y)^2 \) (2-20)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_64_0.png)


    ### 2.4.2 AlexNet


    AlexNet[4] 由 Alex Krizhevsky 等人于 2012 年提出，可以说 AlexNet 确定了卷积神经网络在计算机视觉领域的重要地位，同时也推动了深度学习在语音识别、自然语言处理等领域的发展。AlexNet
    使用了一些新的技术，如下所示：


    - 1) 首次应用 ReLU 作为激活函数，成功解决了 Sigmoid 激活函数带来的梯度消失问题。

    - 2) 训练过程中使用 Dropout 技术随机丢弃一部分神经元，成功避免了模型陷入过拟合。

    - 3) 在 AlexNet 之前的卷积神经网络中普遍使用均值池化，但在 AlexNet 中使用了重叠最大池化（池化步长小于池化核大小），让池化层的输出之间存在重叠和覆盖，一定程度上提升了特征的丰富性。

    - 4) 首次使用 CUDA 加速卷积神经网络的训练过程。

    - 5) 使用了数据增强，基于大小为 256×256 的原始图像重复截取 224×224 大小的区域，大幅增加了数据量，减轻了过拟合，提升了模型的泛化能力。

    - 6) 对图像数据通过主成分分析（Principal Component Analysis，PCA）方法进行降维处理，并对主成分做标准差为 0.1 的高斯扰动以增加噪声，使得识别错误率再次下降。


    AlexNet 论文中使用的网络模型如图 2-31 所示，受制于当时的计算能力，论文中提到训练时使用了两块 GPU，因此 AlexNet 的结构也相应地被拆分成了两个部分。但如今的
    GPU 已经足以放下整个模型，因此其结构可以简化为如图 2-32 所示的结构。


    AlexNet 的网络结构分为 8 层（池化层未单独算作一层），包括 5 个卷积层以及 3 个全连接层。


    - 1) 输入层：AlexNet 首先使用大小为 224×224×3 图像作为输入，后改为 227×227×3。

    - 2) 第 1 个卷积层（含池化）：包含 96 个大小为 11×11 的卷积核，卷积步长为 4，因此，卷积后的输出为 55×55×96；然后构建一个核大小为
    3×3、步长为 2 的最大池化进行数据降采样，进而输出变为 27×27×96。

