  - '[PAGE 168]


    StackGAN 分为两个阶段，阶段 I 的 GAN 以文本嵌入为条件信息生成具有基本颜色和粗略草图的低分辨率图像。文本描述 $t$ 首先由一个编码器进行编码，从而生成一个文本嵌入
    $\varphi_i$，然而基于文本条件信息的潜在空间通常是高维的（大于 100 维），在数据量有限的情况下，通常会导致潜在数据流形的不连续，这不适合学习生成器。为了缓解这一问题，引入了一种条件增强技术，为生成器产生更多的条件变量。从一个独立的高斯分布
    $\mathcal{N}(\mu(\varphi_i), \Sigma(\varphi_i))$ 中随机采样潜在变量，从而在少量图像-文本对的情况下产生更多的训练对。为了进一步加强条件流形的平滑性，避免过拟合，在训练过程中对生成器的目标添加了如下正则化项：


    $D_{KL}(\mathcal{N}(\mu(\varphi_i), \Sigma(\varphi_i)) \|\mathcal{N}(0, I))$ （5-9）


    这是标准高斯分布和条件高斯分布之间的 Kullback-Leibler 散度（KL 散度）。在高斯潜在变量 $c_0$ 的条件下，第 1 阶段 GAN 通过在下述公式中最大化
    $L_{D_0}$ 来训练判别器，用最小化 $L_{G_0}$ 来训练生成器，如下所示：


    $L_{D_0} = E_{(I_0, t) \sim p_{data}} [\log D_0(I_0, \varphi_t)] + E_{z \sim p_z,
    t \sim p_{data}} [\log (1 - D_0(G_0(z, \hat{c}_0), \varphi_t))]$ （5-10）


    $L_{G_0} = E_{z \sim p_z, t \sim p_{data}} [\log (1 - D_0(G_0(z, \hat{c}_0), \varphi_t))]
    + \lambda D_{KL}(\mathcal{N}(\mu_0(\varphi_t), \Sigma_0(\varphi_t)) \|\mathcal{N}(0,
    I))$ （5-11）


    其中，真实的图像 $I_0$ 和文本描述 $t$ 来自真实的数据分布 $p_{data}$，$z$ 是一个从给定的分布 $p_z$ 中随机采样的噪声向量，$\lambda$
    是一个正则化参数，它控制了两项之间的平衡。$\varphi_t$ 是由一个预先训练好的编码器生成的文本嵌入。


