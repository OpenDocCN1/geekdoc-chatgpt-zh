    反卷积层、批归一化层和 ReLU 激活函数组成，判别器由跨步卷积层、批归一化层和 Leaky ReLU 激活函数组成。


    需要注意的是，DCGAN 并非在生成器和判别器中使用通用的 CNN，而是对 CNN 进行了部分修改：首先，取消了 CNN 中的所有池化层，在生成器中使用反卷积进行上采样，在判别器中使用加入步长（Stride）的卷积代替池化层；其次，除了生成器的输出层和判别器的输入层，在网络的其他层上都进行了批归一化；再次，移除完全连接的隐藏层，以实现更深层次的体系结构；最后，在生成器中，除了输出层使用
    Tanh 激活函数外，其他层使用 ReLU 激活函数，判别器的所有层均使用 LeakyReLU 激活函数。


    DCGAN 让 CNN 学习多层次的特征，包括从物体细节到整体场景的特征，因此判别器提取的图像特征具有很好的泛化性。DCGAN 将 GAN 应用到表征学习上，从应用角度看，DCGAN
    可以对生成图像中的特定对象进行擦除，对生成图像进行向量运算。DCGAN 对于生成图像的提升，可以在很多实际应用中使用。


    ## 2. Pix2Pix


    Pix2Pix 面向图像翻译任务，是基于前面讲述的 CGAN 进行优化而实现的。Pix2Pix 在图像翻译中将输入图像作为条件，学习从输入图像到输出图像之间的映射，从而得到指定的输出图像。


    Pix2Pix 的结构如图 5-10 所示。x 是输入的边缘图，y 是真实图像，G 为生成器，G(x) 是生成的图像，D 为判别器。生成器学习如何欺骗判别器以生成更逼真的图像，判别器学习如何判别出哪些是真实图像哪些是生成的假图像。和非条件
    GAN 不同的是，条件 GAN 的生成器和判别器都可以观察到输入的边缘图。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_169_0.png)


    图 5-10 Pix2Pix 结构示意图


    Pix2Pix 从三个方面对 CGAN 进行了优化，包括目标函数、生成器的网络结构和判别器的判别方式。首先，Pix2Pix 的损失函数定义如下：


    \[

    \min_G \max_D V(D, G) = E_{x,y}[\log D(x, y)] + E_{x,z}[\log(1 - D(x, G(x, z)))]
    + \lambda L_{L1}(G) \quad (5-14)

    \]


    \[

    L_{L1}(G) = E_{x,y,z}[\|y-G(x,z)\|_1] \quad (5-15)

    \]


    首先，由公式 (5-14) 可知，Pix2Pix 的损失函数中增加了 L1 约束项，使生成图像不仅要接近真实图像，也要接近输入的条件图像；其次，在 Pix2Pix
    的生成器中使用了 Unet 结构，通过在网络中直接传递和共享底层信息提升了 GAN 的性能；最后，Pix2Pix 的判别器使用分块判断算法 PatchGAN[9]。原始
    GAN 在评价输入图像时，输出“真”或“假”的二分类结果，与原始 GAN 不同，PatchGAN 的输出是一个 N×N 的矩阵，其中每一个元素表示来自原图中的一个感受野。


    Pix2Pix 的实验结果表明，CGAN 是适用于图像到图像翻译任务的一种很有前景的方法，尤其是那些涉及高度结构化的图像输出任务。从应用角度来看，Pix2Pix
    在标签转图像、黑白图像转彩色图像、边缘图转图像等任务中表现突出，Pix2Pix 也可以在更多涉及图像翻译的实际应用中发挥作用。


    总之，GAN 结构优化是一个非常活跃的研究领域，各种新的 GAN 结构优化方法不断涌现。这些优化方法的出现使得 GAN 具有更加广泛的应用前景，也为生成模型的发展提供了更加丰富的思路和方法。


    ## 5.3 GAN 的主要应用


    ### 5.3.1 图像生成


    GAN 在图像生成（Image Generation）中的主要方法分为直接方法、迭代方法和分层方法三种[10]，如图 5-11 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_170_0.png)


    图 5-11 GAN 在图像生成中的三种方法


    所有属于直接方法的 GAN 图像生成方法都采用一个生成器和一个判别器的结构，许多早期的 GAN 都属于这一类，如 GAN[1]、InfoGAN[4] 和 DCGAN[7]
    等，其中 DCGAN 是最典型的图像生成模型之一，其结构被后来的许多模型使用，这种结构设计和实现简单直接，通常能够获得良好的效果。


    分层方法与直接方法不同，其结构使用了两个生成器和两个判别器，其中不同的生成器有不同的功能。这类方法的核心思想是将图像分成两个部分：样式结构和前景背景。两个生成器的关系可以是并行或者串行的关系。分层方法的代表性工作是
    SS-GAN[11]，它包含两个部分：结构 GAN（Structure-GAN）生成一个表面法线图；风格 GAN（Style-GAN）以表面法线图为输入，生成二维图像。两个
    GAN 首先独立训练，然后通过联合学习融合在一起。


    迭代方法与分层方法不同，该类方法使用具有相似或者相同结构的多个生成器，这些生成器从粗略到精细进行图像生成，与分层方法不同的是相同结构的生成器可以在迭代过程中共享权重。LAPGAN[5]
    是第一个使用拉普拉斯金字塔迭代方法从粗略到精细生成图像的 GAN 模型，其中多个生成器执行相同的任务，具体来说，LAPGAN 中的每个生成器将前一个生成器得到的图像和噪声作为输入，输出更加清晰的结果，这些生成器的区别在于它们的输入和输出尺寸大小，LAPGAN
    在图像生成领域中的表现优于原始 GAN。


    ### 5.3.2 图像转换


    图像转换（Image Conversion）是指将一张图像转换为另一张图像，这在计算机视觉中是一个非常重要的任务。GAN 在图像转换中有着广泛的应用，常见的应用包括图像超分辨率重建、图像风格变换、物体分割等。前面介绍的
    Pix2Pix 模型[8] 是 GAN 在图像转换领域的一个经典模型，该模型将 CGAN 中的损失函数与 L1 正则化损失函数相结合，尝试让生成器不仅仅可以欺骗判别器，并且能够尽可能地生成接近真实图像的图像。PLDT
    模型[12] 通过添加另一个判别器来判断来自不同域的图像是否关联。CycleGAN[13] 和 DualGAN[14] 是两个无监督图像到图像转换的工作，二者共享相同的框架。CycleGAN
    采用 CNN 作为生成器的主干网络，DualGAN 则采用 Unet 作为主干网络。


    #### 1. CycleGAN


    CycleGAN[13] 的设计基于如下思路：如果有两个域 A 和 B，想要将域 A 中的图像转换成域 B 中的图像，同时还想保持语义不变，那么可以训练两个生成器，分别用于将
    A 域图像翻译成 B 域图像、将 B 域图像翻译成 A 域图像。


    如图 5-12 所示，CycleGAN 包含两个判别器和两个生成器：


    - 生成器 A2B。将真实马的图片转换成相同形状的斑马图片（图 5-12 上半部分）或者将生成的假的马的图片转换成相同形状的斑马图片（图 5-12 下半部分）。

    - 生成器 B2A。将真实的斑马图片转换成相同形状的马的图片（图 5-12 下半部分）或者将生成的斑马图片转换成相同形状的马的图片（图 5-12 上半部分）。

    - 判别器 A。判断真实的马的图片或者生成的马的图片是否为真。

    - 判别器 B。判断真实的斑马图片或者生成的斑马图片是否为真。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_172_0.png)


    图 5-12 CycleGAN 的结构（详见彩插）


    CycleGAN 使用的损失函数是两个循环一致性损失（Cycle Consistency Loss）的和，具体表示如下：


    \[

    L_{cyc}(G, F) = E_{x \sim p_{data}(x)} [\|F(G(x)) - x\|_1] + E_{y \sim p_{data}(y)}
    [\|G(F(y)) - y\|_1] \quad (5-16)

    \]


    其中，G 指的是生成器 A2B，F 指的是生成器 B2A，循环一致性损失是为了防止图像迁移后形状差异较大而提出的，就是说图 5-12 中当马的图片通过两个生成器后变回原来的马的图片，计算两个马的图片的距离，如果两者距离越小，就代表两个图片越相似。


    CycleGAN 的一个重要应用是域迁移（Domain Adaptation），可以将图片转换为不同风格的图片。与许多之前的图像转换模型不同，CycleGAN
    不需要对图像数据进行配对或对齐操作，也不需要任何标记或注释。图 5-13 是 CycleGAN 的一些应用。


    #### 2. DualGAN


    DualGAN[14] 是一种基于对偶学习的图像转换模型，与 CycleGAN 类似，这个模型也可以实现两个域之间的图像转换。DualGAN 使用自编码器和
    GAN 结合的网络架构，同时对源域和目标域进行图像转换，并且通过对偶学习方式进行优化，如图 5-14 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_173_0.png)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_173_1.png)


    DualGAN 为两个域（一个源域 U 和一个目标域 V）各设计了一个生成器和一个判别器。源域的生成器 $G_A$ 将源域的图片转换到目标域中，目标域的生成器
    $G_B$ 则将目标域的图片转化到源域中。源域的判别器 $D_B$ 用于区分生成器 $G_B$ 生成的图像和源域中的真实图像，目标域的判别器 $D_A$ 用于区分生成器
    $G_A$ 生成的图像和目标域中的真实图像。通过这些生成器和判别器的协作变换，DualGAN 可以实现源域图像到目标域的全方位变换，同时也可以从目标域将图像转换回源域，如图
    5-14 所示。以素描与照片之间的相互转换为例，其中第一个生成器 $G_A$ 可以将素描（$U$）转换为照片（$V$），生成器 $G_A$ 所完成的任务正是最终想要完成的任务，与这个生成器对应的有一个判别器
    \( D_A \)。与此同时，构建与之对偶的另一个生成器 \( G_B \)，将照片转换为素描，与这个生成器所对应的同样有一个判别器 \( D_B \)。


    与 CycleGAN 不同的是，DualGAN 使用对偶学习方式进行模型优化。对偶学习旨在减少源域和目标域之间距离的不一致性，它通过计算双向转换图像之间的重构误差来实现。在
    DualGAN 中，对偶学习引入了两个额外的自编码器，它们用于计算源域图片转化到目标域图片和目标域图片转化到源域图片之间的重构误差：


    \[

    l^*(u, v) = \lambda_t \|u - G_B(G_A(u, z), z'')\| + \lambda_v \|v - G_A(G_B(v,
    z''), z)\| - D_B(G_B(v, z'')) - D_A(G_A(u, z)) \quad (5-17)

    \]


    其中 \( \lambda \) 为权重参数。生成器 \( G_A \) 可以对素描图片 \( u \) 进行转换，最终得到类似照片的图片，其中包含的噪声为
    \( z \)，转换的结果为 \( G_A(u, z)\)，把这个转换的结果送给另一个专门用于生成素描图片的生成器 \( G_B \)，得到的结果为 \(
    G_B(G_A(u, z), z'')\)，即为对原有的素描图片的一次重构，这里的 \( z''\) 指的也是噪声。


    这种方法可以避免图像变形过度的问题，同时也可以降低图像之间的距离不一致性，提高图像转换的质量和稳定性。


    ### 5.3.3 图像超分辨率重建


    图像超分辨率重建（Image Super-Resolution Reconstruction）是指一种将一幅低分辨率图像重建出高分辨率图像的技术。很多 GAN
    的变种被用于图像超分辨率重建，效果很好，如 SRGAN [15]、FSRAGAN [16] 等，这里主要介绍 SRGAN。


    SRGAN 的生成网络由常规的卷积层组成并引入了残差结构和像素重排来进行高分辨率图像生成。生成器的网络结构由 16 个重复的块堆叠而成，每一个块都包含“卷积/批归一化/PReLU
    激活函数/卷积/批归一化/残差相加”的结构，如图 5-15 所示。图 5-15 中字符串“k3n64s1”中的 k3 代表卷积核的大小为 3，n64 代表卷积输出的通道数为
    64，s1 代表步长为 1，下面两个不同指向的箭头表示残差链接。判别器的网络结构与生成器的网络结构类似，包含 8 个卷积层，从第 2 个卷积层开始，每一个卷积层后面加一个批归一化层来归一化中间层的分布，如图
    5-16 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_174_0.png)


    图 5-15 SRGAN 生成器的网络结构


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_175_0.png)


    图 5-16 SRGAN 判别器的网络结构


    在 SRGAN 中，生成器 G 的输入从随机噪声变成了低分辨率图像 $I^{LR}$，判别器 D 的输入是高分辨率图像 $I^{HR}$。这样的话，生成器
    G 就不再是随机生成图像，而是根据一幅低分辨率图像生成一幅高分辨率图像，然后再送入判别器来判断输入图像是真实高分辨率图像还是生成的高分辨率图像。SRGAN
    的对抗损失函数（误差函数）如下所示：


    \[

    L_{Gen}^{SR} = \sum_{n=1}^{N} (- \log D_{\theta_d} (G_{\theta_c} (I^{LR})))

    \]


    其中 $\theta_d, \theta_c$ 分别表示判别器和生成器的参数，$D_{\theta_d} (G_{\theta_c} (I^{LR}))$
    表示判别器判断生成图片为真实高分辨率图像的概率。


    此外，SRGAN 还使用了一种感知损失函数，这种损失函数用于让低分辨率图像和高分辨率图像的内容对齐，从而避免直接使用均方误差去寻找像素平均解，如下所示：


    \[

    L_{VGG,i,j}^{SR} = \frac{1}{W_{i,j} H_{i,j}} \sum_{x=1}^{W_{i,j}} \sum_{y=1}^{H_{i,j}}
    (\phi_{i,j} (I^{HR})_{x,y} - \phi_{i,j} (G_{\theta_c} (I^{LR}))_{x,y})^2

    \]


    其中 $\phi_{i,j}$ 表示在 VGG-Net 中第 $i$ 个最大池化层之前通过第 $j$ 次卷积（激活后）获得的特征图，$W_{i,j} H_{i,j}$
    表示对应卷积位置处 VGG-Net 输出的特征图的尺寸大小。


    具体来说，首先把高分辨率图像送入 VGG-Net 进行退化，再把高分辨率图像退化出来的低分辨率图像送入 SRGAN 的生成器，并把生成器输出的高分辨率图像也送入
    VGG-Net。根据两幅高分辨率图像经 VGG-Net 第 $i$ 层的中间结果逐像素求均方误差，就得到感知误差。


    将感知损失与判别器的对抗损失相加得到 SRGAN 的总损失函数：


    \[

    L_{SR} = L_{VGG,i,j}^{SR} + \omega L_{Gen}^{SR}

    \]


    其中 $\omega$ 为对抗损失的权重，一般设为 $10^{-3}$。


    ### 5.3.4 音乐生成


    与图像与文本相比，音乐可以说是一种特殊的语言，是表达人类思想感情、反映人类现实生活的一种艺术形式。GAN 除了可用于图像生成外，也适用于音乐的生成。典型的音乐生成方法有
    C-RNN-GAN[17] 和 MuseGAN[18]。


    #### 1. C-RNN-GAN


    C-RNN-GAN 同样由一个生成器和一个判别器组成，只是生成器和判别器采用 LSTM 双向循环神经网络和全连接神经网络的组合结构。由于数字乐器音乐往往使用
    MIDI 格式进行不同乐器迁移，C-RNN-GAN 的数据集使用 4 个实值标量对音乐信号的数据进行建模：音调长度、频率、强度和自上一个音调以来花费的时间。因此，C-RNN-GAN
    的生成器使用随机变量生成一个由上述四值标量组成的四元组并送入判别器进行处理，如图 5-17 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_176_0.png)


    图 5-17 C-RNN-GAN 模型架构


    © 图 5-17 根据文献 [17] 重新绘制。


    C-RNN-GAN 生成器的输入是一组随机变量，而判别器的输入为上文中提到的由四个实值标量组成的四元组。C-RNN-GAN 的损失函数与常见的 GAN 形式一样：


    \[

    L_G = \frac{1}{m} \sum_{i=1}^m \log(1 - D(G(z^{(i)})))

    \]


    \[

    L_D = \frac{1}{m} \sum_{i=1}^m [-\log(D(x^{(i)})) - \log(1 - D(G(z^{(i)})))]

    \]


    其中 \( z^{(i)} \) 是 \( [0,1]^k \) 中的均匀随机变量序列，\( x^{(i)} \) 为来自训练数据的四元组序列，\( k \)
    为随机序列中数据的维度。


    #### 2. MuseGAN


    复调音乐（Polyphonic Music）中，音符用来组成和弦、琶音或旋律，因此仅考虑音符的时间顺序是不合适的。在考虑基本假设和网络架构差异的情况下，MuseGAN
    提出了三个基于 GAN 框架的符号多音轨音乐生成模型：干扰模型、作曲家模型和混合模型。同时提出了一些生成音乐的评估标准（Metric）。


    ##### (1) 数据表达


    MuseGAN 将小节（Bar）作为作曲的基本单元，并选用了多音轨 Piano-Roll 表示法，Piano-Roll 是一个二进制值的、类似记分表的矩阵，表示音符在不同时间步长上的存在。一个
    M 轨道的 Piano-Roll 的一个小节表示为 x ∈ {0, 1}^{RxSxM}，其中 R 和 S 分别表示一个小节的时间步长数和相关音符数。每个小节对应的矩阵/张量的大小都是固定的。


    ##### (2) 多轨道相互依赖模型


    音乐创作有两种常见的创作方式：演奏者即兴创作（Jamming）与作曲家统筹创作。MuseGAN 设计了三个与这些创作方式相对应的多轨道相互依赖模型。


    如图 5-18 所示，即兴创作模型中多个生成器独立工作，并且从私有随机向量 z_i 生成其自己曲目的音乐，同时这些生成器接受来自不同判别器的对抗损失信号进行训练。因此这种模型生成
    N 个轨道的音乐需要 N 个不同的生成器和 N 个不同的判别器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_177_0.png)


    图 5-18 即兴创作模型


    如图 5-19 所示，作曲家统筹创作模型中，一个单独的生成器生成一个多声道钢琴曲，每一个声道代表一个特定的音轨。这种模型只需要输入一个共享的随机向量 z 和一个单独的判别器用于直接判断多轨道音乐来自真实音乐还是生成器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_177_1.png)


    图 5-19 统筹创作模型


    混合模型就是混合上述两种模型的模型，每个音轨一个生成器，接受独立的 z_i（Intra-Track Random Vector）及全局的 z（Inter-Track
    Random Vector）共同组合成的输入向量，同时


    '
  mdcn: '


    反卷积层、批归一化层和 ReLU 激活函数组成，判别器由跨步卷积层、批归一化层和 Leaky ReLU 激活函数组成。


    需要注意的是，DCGAN 并非在生成器和判别器中使用通用的 CNN，而是对 CNN 进行了部分修改：首先，取消了 CNN 中的所有池化层，在生成器中使用反卷积进行上采样，在判别器中使用加入步长（Stride）的卷积代替池化层；其次，除了生成器的输出层和判别器的输入层，在网络的其他层上都进行了批归一化；再次，移除完全连接的隐藏层，以实现更深层次的体系结构；最后，在生成器中，除了输出层使用
    Tanh 激活函数外，其他层使用 ReLU 激活函数，判别器的所有层均使用 LeakyReLU 激活函数。


    DCGAN 让 CNN 学习多层次的特征，包括从物体细节到整体场景的特征，因此判别器提取的图像特征具有很好的泛化性。DCGAN 将 GAN 应用到表征学习上，从应用角度看，DCGAN
    可以对生成图像中的特定对象进行擦除，对生成图像进行向量运算。DCGAN 对于生成图像的提升，可以在很多实际应用中使用。


    ## 2. Pix2Pix


    Pix2Pix 面向图像翻译任务，是基于前面讲述的 CGAN 进行优化而实现的。Pix2Pix 在图像翻译中将输入图像作为条件，学习从输入图像到输出图像之间的映射，从而得到指定的输出图像。


    Pix2Pix 的结构如图 5-10 所示。x 是输入的边缘图，y 是真实图像，G 为生成器，G(x) 是生成的图像，D 为判别器。生成器学习如何欺骗判别器以生成更逼真的图像，判别器学习如何判别出哪些是真实图像哪些是生成的假图像。和非条件
    GAN 不同的是，条件 GAN 的生成器和判别器都可以观察到输入的边缘图。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_169_0.png)


    图 5-10 Pix2Pix 结构示意图


    Pix2Pix 从三个方面对 CGAN 进行了优化，包括目标函数、生成器的网络结构和判别器的判别方式。首先，Pix2Pix 的损失函数定义如下：


    \[

    \min_G \max_D V(D, G) = E_{x,y}[\log D(x, y)] + E_{x,z}[\log(1 - D(x, G(x, z)))]
    + \lambda L_{L1}(G) \quad (5-14)

    \]


    \[

    L_{L1}(G) = E_{x,y,z}[\|y-G(x,z)\|_1] \quad (5-15)

    \]


    首先，由公式 (5-14) 可知，Pix2Pix 的损失函数中增加了 L1 约束项，使生成图像不仅要接近真实图像，也要接近输入的条件图像；其次，在 Pix2Pix
    的生成器中使用了 Unet 结构，通过在网络中直接传递和共享底层信息提升了 GAN 的性能；最后，Pix2Pix 的判别器使用分块判断算法 PatchGAN[9]。原始
    GAN 在评价输入图像时，输出“真”或“假”的二分类结果，与原始 GAN 不同，PatchGAN 的输出是一个 N×N 的矩阵，其中每一个元素表示来自原图中的一个感受野。


    Pix2Pix 的实验结果表明，CGAN 是适用于图像到图像翻译任务的一种很有前景的方法，尤其是那些涉及高度结构化的图像输出任务。从应用角度来看，Pix2Pix
    在标签转图像、黑白图像转彩色图像、边缘图转图像等任务中表现突出，Pix2Pix 也可以在更多涉及图像翻译的实际应用中发挥作用。


    总之，GAN 结构优化是一个非常活跃的研究领域，各种新的 GAN 结构优化方法不断涌现。这些优化方法的出现使得 GAN 具有更加广泛的应用前景，也为生成模型的发展提供了更加丰富的思路和方法。


    ## 5.3 GAN 的主要应用


    ### 5.3.1 图像生成


    GAN 在图像生成（Image Generation）中的主要方法分为直接方法、迭代方法和分层方法三种[10]，如图 5-11 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_170_0.png)


    图 5-11 GAN 在图像生成中的三种方法


    所有属于直接方法的 GAN 图像生成方法都采用一个生成器和一个判别器的结构，许多早期的 GAN 都属于这一类，如 GAN[1]、InfoGAN[4] 和 DCGAN[7]
    等，其中 DCGAN 是最典型的图像生成模型之一，其结构被后来的许多模型使用，这种结构设计和实现简单直接，通常能够获得良好的效果。


    分层方法与直接方法不同，其结构使用了两个生成器和两个判别器，其中不同的生成器有不同的功能。这类方法的核心思想是将图像分成两个部分：样式结构和前景背景。两个生成器的关系可以是并行或者串行的关系。分层方法的代表性工作是
    SS-GAN[11]，它包含两个部分：结构 GAN（Structure-GAN）生成一个表面法线图；风格 GAN（Style-GAN）以表面法线图为输入，生成二维图像。两个
    GAN 首先独立训练，然后通过联合学习融合在一起。


    迭代方法与分层方法不同，该类方法使用具有相似或者相同结构的多个生成器，这些生成器从粗略到精细进行图像生成，与分层方法不同的是相同结构的生成器可以在迭代过程中共享权重。LAPGAN[5]
    是第一个使用拉普拉斯金字塔迭代方法从粗略到精细生成图像的 GAN 模型，其中多个生成器执行相同的任务，具体来说，LAPGAN 中的每个生成器将前一个生成器得到的图像和噪声作为输入，输出更加清晰的结果，这些生成器的区别在于它们的输入和输出尺寸大小，LAPGAN
    在图像生成领域中的表现优于原始 GAN。


    ### 5.3.2 图像转换


    图像转换（Image Conversion）是指将一张图像转换为另一张图像，这在计算机视觉中是一个非常重要的任务。GAN 在图像转换中有着广泛的应用，常见的应用包括图像超分辨率重建、图像风格变换、物体分割等。前面介绍的
    Pix2Pix 模型[8] 是 GAN 在图像转换领域的一个经典模型，该模型将 CGAN 中的损失函数与 L1 正则化损失函数相结合，尝试让生成器不仅仅可以欺骗判别器，并且能够尽可能地生成接近真实图像的图像。PLDT
    模型[12] 通过添加另一个判别器来判断来自不同域的图像是否关联。CycleGAN[13] 和 DualGAN[14] 是两个无监督图像到图像转换的工作，二者共享相同的框架。CycleGAN
    采用 CNN 作为生成器的主干网络，DualGAN 则采用 Unet 作为主干网络。


    #### 1. CycleGAN


    CycleGAN[13] 的设计基于如下思路：如果有两个域 A 和 B，想要将域 A 中的图像转换成域 B 中的图像，同时还想保持语义不变，那么可以训练两个生成器，分别用于将
    A 域图像翻译成 B 域图像、将 B 域图像翻译成 A 域图像。


    如图 5-12 所示，CycleGAN 包含两个判别器和两个生成器：


    - 生成器 A2B。将真实马的图片转换成相同形状的斑马图片（图 5-12 上半部分）或者将生成的假的马的图片转换成相同形状的斑马图片（图 5-12 下半部分）。

    - 生成器 B2A。将真实的斑马图片转换成相同形状的马的图片（图 5-12 下半部分）或者将生成的斑马图片转换成相同形状的马的图片（图 5-12 上半部分）。

    - 判别器 A。判断真实的马的图片或者生成的马的图片是否为真。

    - 判别器 B。判断真实的斑马图片或者生成的斑马图片是否为真。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_172_0.png)


    图 5-12 CycleGAN 的结构（详见彩插）


    CycleGAN 使用的损失函数是两个循环一致性损失（Cycle Consistency Loss）的和，具体表示如下：


    \[

    L_{cyc}(G, F) = E_{x \sim p_{data}(x)} [\|F(G(x)) - x\|_1] + E_{y \sim p_{data}(y)}
    [\|G(F(y)) - y\|_1] \quad (5-16)

    \]


    其中，G 指的是生成器 A2B，F 指的是生成器 B2A，循环一致性损失是为了防止图像迁移后形状差异较大而提出的，就是说图 5-12 中当马的图片通过两个生成器后变回原来的马的图片，计算两个马的图片的距离，如果两者距离越小，就代表两个图片越相似。


    CycleGAN 的一个重要应用是域迁移（Domain Adaptation），可以将图片转换为不同风格的图片。与许多之前的图像转换模型不同，CycleGAN
    不需要对图像数据进行配对或对齐操作，也不需要任何标记或注释。图 5-13 是 CycleGAN 的一些应用。


    #### 2. DualGAN


    DualGAN[14] 是一种基于对偶学习的图像转换模型，与 CycleGAN 类似，这个模型也可以实现两个域之间的图像转换。DualGAN 使用自编码器和
    GAN 结合的网络架构，同时对源域和目标域进行图像转换，并且通过对偶学习方式进行优化，如图 5-14 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_173_0.png)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_173_1.png)


    DualGAN 为两个域（一个源域 U 和一个目标域 V）各设计了一个生成器和一个判别器。源域的生成器 $G_A$ 将源域的图片转换到目标域中，目标域的生成器
    $G_B$ 则将目标域的图片转化到源域中。源域的判别器 $D_B$ 用于区分生成器 $G_B$ 生成的图像和源域中的真实图像，目标域的判别器 $D_A$ 用于区分生成器
    $G_A$ 生成的图像和目标域中的真实图像。通过这些生成器和判别器的协作变换，DualGAN 可以实现源域图像到目标域的全方位变换，同时也可以从目标域将图像转换回源域，如图
    5-14 所示。以素描与照片之间的相互转换为例，其中第一个生成器 $G_A$ 可以将素描（$U$）转换为照片（$V$），生成器 $G_A$ 所完成的任务正是最终想要完成的任务，与这个生成器对应的有一个判别器
    \( D_A \)。与此同时，构建与之对偶的另一个生成器 \( G_B \)，将照片转换为素描，与这个生成器所对应的同样有一个判别器 \( D_B \)。


    与 CycleGAN 不同的是，DualGAN 使用对偶学习方式进行模型优化。对偶学习旨在减少源域和目标域之间距离的不一致性，它通过计算双向转换图像之间的重构误差来实现。在
    DualGAN 中，对偶学习引入了两个额外的自编码器，它们用于计算源域图片转化到目标域图片和目标域图片转化到源域图片之间的重构误差：


    \[

    l^*(u, v) = \lambda_t \|u - G_B(G_A(u, z), z'')\| + \lambda_v \|v - G_A(G_B(v,
    z''), z)\| - D_B(G_B(v, z'')) - D_A(G_A(u, z)) \quad (5-17)

    \]


    其中 \( \lambda \) 为权重参数。生成器 \( G_A \) 可以对素描图片 \( u \) 进行转换，最终得到类似照片的图片，其中包含的噪声为
    \( z \)，转换的结果为 \( G_A(u, z)\)，把这个转换的结果送给另一个专门用于生成素描图片的生成器 \( G_B \)，得到的结果为 \(
    G_B(G_A(u, z), z'')\)，即为对原有的素描图片的一次重构，这里的 \( z''\) 指的也是噪声。


    这种方法可以避免图像变形过度的问题，同时也可以降低图像之间的距离不一致性，提高图像转换的质量和稳定性。


    ### 5.3.3 图像超分辨率重建


    图像超分辨率重建（Image Super-Resolution Reconstruction）是指一种将一幅低分辨率图像重建出高分辨率图像的技术。很多 GAN
    的变种被用于图像超分辨率重建，效果很好，如 SRGAN [15]、FSRAGAN [16] 等，这里主要介绍 SRGAN。


    SRGAN 的生成网络由常规的卷积层组成并引入了残差结构和像素重排来进行高分辨率图像生成。生成器的网络结构由 16 个重复的块堆叠而成，每一个块都包含“卷积/批归一化/PReLU
    激活函数/卷积/批归一化/残差相加”的结构，如图 5-15 所示。图 5-15 中字符串“k3n64s1”中的 k3 代表卷积核的大小为 3，n64 代表卷积输出的通道数为
    64，s1 代表步长为 1，下面两个不同指向的箭头表示残差链接。判别器的网络结构与生成器的网络结构类似，包含 8 个卷积层，从第 2 个卷积层开始，每一个卷积层后面加一个批归一化层来归一化中间层的分布，如图
    5-16 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_174_0.png)


    图 5-15 SRGAN 生成器的网络结构


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_175_0.png)


    图 5-16 SRGAN 判别器的网络结构


    在 SRGAN 中，生成器 G 的输入从随机噪声变成了低分辨率图像 $I^{LR}$，判别器 D 的输入是高分辨率图像 $I^{HR}$。这样的话，生成器
    G 就不再是随机生成图像，而是根据一幅低分辨率图像生成一幅高分辨率图像，然后再送入判别器来判断输入图像是真实高分辨率图像还是生成的高分辨率图像。SRGAN
    的对抗损失函数（误差函数）如下所示：


    \[

    L_{Gen}^{SR} = \sum_{n=1}^{N} (- \log D_{\theta_d} (G_{\theta_c} (I^{LR})))

    \]


    其中 $\theta_d, \theta_c$ 分别表示判别器和生成器的参数，$D_{\theta_d} (G_{\theta_c} (I^{LR}))$
    表示判别器判断生成图片为真实高分辨率图像的概率。


    此外，SRGAN 还使用了一种感知损失函数，这种损失函数用于让低分辨率图像和高分辨率图像的内容对齐，从而避免直接使用均方误差去寻找像素平均解，如下所示：


    \[

    L_{VGG,i,j}^{SR} = \frac{1}{W_{i,j} H_{i,j}} \sum_{x=1}^{W_{i,j}} \sum_{y=1}^{H_{i,j}}
    (\phi_{i,j} (I^{HR})_{x,y} - \phi_{i,j} (G_{\theta_c} (I^{LR}))_{x,y})^2

    \]


    其中 $\phi_{i,j}$ 表示在 VGG-Net 中第 $i$ 个最大池化层之前通过第 $j$ 次卷积（激活后）获得的特征图，$W_{i,j} H_{i,j}$
    表示对应卷积位置处 VGG-Net 输出的特征图的尺寸大小。


    具体来说，首先把高分辨率图像送入 VGG-Net 进行退化，再把高分辨率图像退化出来的低分辨率图像送入 SRGAN 的生成器，并把生成器输出的高分辨率图像也送入
    VGG-Net。根据两幅高分辨率图像经 VGG-Net 第 $i$ 层的中间结果逐像素求均方误差，就得到感知误差。


    将感知损失与判别器的对抗损失相加得到 SRGAN 的总损失函数：


    \[

    L_{SR} = L_{VGG,i,j}^{SR} + \omega L_{Gen}^{SR}

    \]


    其中 $\omega$ 为对抗损失的权重，一般设为 $10^{-3}$。


    ### 5.3.4 音乐生成


    与图像与文本相比，音乐可以说是一种特殊的语言，是表达人类思想感情、反映人类现实生活的一种艺术形式。GAN 除了可用于图像生成外，也适用于音乐的生成。典型的音乐生成方法有
    C-RNN-GAN[17] 和 MuseGAN[18]。


    #### 1. C-RNN-GAN


    C-RNN-GAN 同样由一个生成器和一个判别器组成，只是生成器和判别器采用 LSTM 双向循环神经网络和全连接神经网络的组合结构。由于数字乐器音乐往往使用
    MIDI 格式进行不同乐器迁移，C-RNN-GAN 的数据集使用 4 个实值标量对音乐信号的数据进行建模：音调长度、频率、强度和自上一个音调以来花费的时间。因此，C-RNN-GAN
    的生成器使用随机变量生成一个由上述四值标量组成的四元组并送入判别器进行处理，如图 5-17 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_176_0.png)


    图 5-17 C-RNN-GAN 模型架构


    © 图 5-17 根据文献 [17] 重新绘制。


    C-RNN-GAN 生成器的输入是一组随机变量，而判别器的输入为上文中提到的由四个实值标量组成的四元组。C-RNN-GAN 的损失函数与常见的 GAN 形式一样：


    \[

    L_G = \frac{1}{m} \sum_{i=1}^m \log(1 - D(G(z^{(i)})))

    \]


    \[

    L_D = \frac{1}{m} \sum_{i=1}^m [-\log(D(x^{(i)})) - \log(1 - D(G(z^{(i)})))]

    \]


    其中 \( z^{(i)} \) 是 \( [0,1]^k \) 中的均匀随机变量序列，\( x^{(i)} \) 为来自训练数据的四元组序列，\( k \)
    为随机序列中数据的维度。


    #### 2. MuseGAN


    复调音乐（Polyphonic Music）中，音符用来组成和弦、琶音或旋律，因此仅考虑音符的时间顺序是不合适的。在考虑基本假设和网络架构差异的情况下，MuseGAN
    提出了三个基于 GAN 框架的符号多音轨音乐生成模型：干扰模型、作曲家模型和混合模型。同时提出了一些生成音乐的评估标准（Metric）。


    ##### (1) 数据表达


    MuseGAN 将小节（Bar）作为作曲的基本单元，并选用了多音轨 Piano-Roll 表示法，Piano-Roll 是一个二进制值的、类似记分表的矩阵，表示音符在不同时间步长上的存在。一个
    M 轨道的 Piano-Roll 的一个小节表示为 x ∈ {0, 1}^{RxSxM}，其中 R 和 S 分别表示一个小节的时间步长数和相关音符数。每个小节对应的矩阵/张量的大小都是固定的。


    ##### (2) 多轨道相互依赖模型


    音乐创作有两种常见的创作方式：演奏者即兴创作（Jamming）与作曲家统筹创作。MuseGAN 设计了三个与这些创作方式相对应的多轨道相互依赖模型。


    如图 5-18 所示，即兴创作模型中多个生成器独立工作，并且从私有随机向量 z_i 生成其自己曲目的音乐，同时这些生成器接受来自不同判别器的对抗损失信号进行训练。因此这种模型生成
    N 个轨道的音乐需要 N 个不同的生成器和 N 个不同的判别器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_177_0.png)


    图 5-18 即兴创作模型


    如图 5-19 所示，作曲家统筹创作模型中，一个单独的生成器生成一个多声道钢琴曲，每一个声道代表一个特定的音轨。这种模型只需要输入一个共享的随机向量 z 和一个单独的判别器用于直接判断多轨道音乐来自真实音乐还是生成器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_177_1.png)


    图 5-19 统筹创作模型


    混合模型就是混合上述两种模型的模型，每个音轨一个生成器，接受独立的 z_i（Intra-Track Random Vector）及全局的 z（Inter-Track
    Random Vector）共同组合成的输入向量，同时


    '
