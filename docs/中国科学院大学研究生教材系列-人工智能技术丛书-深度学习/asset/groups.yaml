    # 2.2.3 池化层


    池化操作使用某位置相邻输出的总体统计特征作为该位置的输出，常用的池化类型有最大池化（Max Pooling）和均值池化（Average Pooling）。池化层不包含需要学习的参数，只需要指定池化核的大小、步长以及池化类型。举例来说，输入
    3×3 的特征图，池化核大小为 2×2，步长为 1，那么对其进行池化操作的情况如图 2-18 所示。


    池化操作实际上是对输入对象进行“降采样”（Down-sampling）操作，一定程度上提高了模型的容错能力。池化的引入保证了当输入出现少量平移时，输出近似不变；池化核的指定相当于在空间范围内对特征图的特征进行了维度约减，同时缩小了下一层输入的特征图尺寸，进而在一定程度上减少了网络的参数个数和计算量。


