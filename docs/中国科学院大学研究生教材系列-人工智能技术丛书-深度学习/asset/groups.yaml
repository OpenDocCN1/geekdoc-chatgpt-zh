    # 1.4.3 深度学习在自然语言处理领域的应用


    自 2010 年循环神经网络语言模型提出以来，以 LSTM 和 Transformer 为代表的深度学习算法在很多自然语言处理任务上都取得了很好的效果。同计算机视觉领域一样，可以把深度学习在自然语言处理领域的应用也分为两大类：基础任务和高级任务。基础任务是指一些偏基础性、通用性的任务；高级任务是指一些偏应用性的任务，它们一般需要基于基础任务来完成。


    自然语言处理领域的基础任务主要包括：1）词法分析。以词为单位进行分析，包括词性标注、拼写校正等。2）句法分析。以句子为单位进行分析，主要包括句法结构分析和依存句法分析等。3）语义分析。分析自然语言的深层含义，包括词汇级语义分析、句子级语义分析和篇章级语义分析。4）信息抽取。从自然语言中抽取出结构化信息，包括实体抽取、事件抽取等。5）语言模型。根据之前的单词预测下一个单词。


    自然语言处理领域的高级任务主要包括：1）情感分析。分析文本体现的情感，可包含正负向、正负中或多态度等类型。2）神经机器翻译。基于神经网络语言模型的多语种互译。3）自动文本摘要。根据单文档或者多文档自动生成文档摘要。4）机器阅读理解。通过阅读文本回答问题、完成选择题或完形填空。5）自动问答。用户给出问题，机器可以进行回答，也称单轮对话。6）人机对话。通过训练大量语料，支持人与机器之间的自由对话，通常指的是多轮对话。当然，高级任务还有很多，这里也不一一列举了。


    # 1.4.4 深度学习在多模态处理领域的应用


    不管是图像、语音还是文本，认为它们都是单模态的。在实际应用中，还有大量的多模态应用场景，如图像描述、可视问答、图像生成、视频生成、虚拟主播等。深度学习在这些多模态处理领域也发挥了强大的作用，具体来说：1）图像描述。机器可以根据图像给出描述图像的句子，也称看图说话。2）可视问答。机器可以回答特定图像或视频相关的问题。3）图像生成。机器可以根据文本描述生成相应的图像。4）视频生成。机器可以根据文字描述自动生成相应的视频。5）虚拟主播。自动播报新闻的虚拟人物。当然，深度学习在多模态处理领域的应用还有很多，这里也不一一列举了。


