    \ = tf.reduce_mean(cross_entropy, name='cross_entropy')\n# 将交叉熵损失添加到损失集合中\n  \
    \  tf.add_to_collection('losses', cross_entropy_mean)\n# 计算总损失,将损失集合中的所有损失相加\n\
    \    return tf.add_n(tf.get_collection('losses'), name='total_loss')\n\n# 获取最终损失\n\
    loss = loss(logits, label_holder)\n# 使用 Adam 优化器\ntrain_op = tf.train.AdamOptimizer(1e-3).minimize(loss)\n\
    \n# 使用 tf.nn.in_top_k 函数求输出结果中 top k 的准确率,默认使用 top 1,也就是输出分数最高的\n# 那一类的准确率\ntop_k_op\
    \ = tf.nn.in_top_k(logits, label_holder, 1)\n# 使用 tf.InteractiveSession 创建默认的\
    \ Session,接着初始化全部模型参数\nsess = tf.InteractiveSession()\ntf.global_variables_initializer().run()\n\
    \n# 正式开始训练\n# 在每个训练步中循环\nfor step in range(max_steps):\n    start_time = time.time()\n\
    \    # 获取图像和标签批次数据\n    image_batch, label_batch = sess.run([images_train, labels_train])\n\
    \    # 运行训练操作和损失计算\n    _, loss_value = sess.run([train_op, loss], feed_dict={image_holder:\
    \ image_batch, label_holder: label_batch})\n    # 计算时间间隔\n    duration = time.time()\
    \ - start_time\n    # 每隔十步打印一个训练结果\n    if step % 10 == 0:\n        example_per_sec\
    \ = batch_size / duration\n        sec_per_batch = float(duration)\n        format_str\
    \ = 'step %d, loss=%.2f , %.1f examples/sec, %.3f sec/batch'\n        print(format_str\
    \ % (step, loss_value, example_per_sec, sec_per_batch))\n```\n"
  mdcn: "\n## 本章人物： Ilya Sutskever 博士\n\nIlya Sutskever (1985 ~ )，OpenAI 联合创始人兼首席科学家，主持了\
