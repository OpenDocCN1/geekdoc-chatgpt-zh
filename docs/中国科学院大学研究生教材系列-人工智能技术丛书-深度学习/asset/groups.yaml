    Anchor 边框的回归输出，为每个 Anchor 得到位置偏移量（x，y，w，h），因此输出大小为 4k。如图 2-43 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_75_0.png)


    图 2-43 RPN Anchor 示意图


    RPN 训练时的损失函数定义为


    ```

    L({p_i}, {t_i}) = \frac{1}{N_{cls}} \sum_i L_{cls}(p_i, p_i^*) + \lambda \frac{1}{N_{reg}}
    \sum_i p_i^* L_{reg}(t_i, t_i^*) \quad (2-39)

    ```


    其中，i 表示 Anchor 的索引，p_i 表示正例分类概率（Positive Softmax Probability），p_i^* 表示对应的 Anchor
    预测概率（即当第 i 个 Anchor 与标定边框（Ground Truth Bounding Box）之间的 IoU>0.7 时，认为是该 Anchor
    是正例；反之 IoU<0.3 时，认为是该 Anchor 是负例；至于那些 0.3 ≤ IoU ≤ 0.7 的 Anchor 则不参与训练；t_i 表示预测边框（Predicted
    Bounding Box），t_i^* 表示对应正例 Anchor 对应的人工标定边框。分类损失用于分类 Anchor 为正例与负例的网络训练。回归损失用于边框回归训练。注意在该损失中乘了
    p_i^*（正例 p_i^* = 1、负例 p_i^* = 0），相当于只关心正例 Anchor 的回归，而没必要去关心负例 Anchor 的回归。\lambda
    是边框回归损失的权重参数。


