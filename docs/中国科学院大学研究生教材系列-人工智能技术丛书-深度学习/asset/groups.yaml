    \n图 2-34 3×3 卷积串联与 5×5 卷积示意图\n\n## 2.4.4 GoogleNet\n\nGoogleNet [6] 由 Google 公司提出，它的主要思想是除了在网络深度上加深（22\
    \ 层）之外，在宽度上也加宽。GoogleNet 的核心是 Inception 模块，它体现了在网络宽度上加宽的思想，基本结构如图 2-35 所示。Inception\
    \ 模块包含 4 个分支，每个分支均使用了 1×1 卷积，它可以跨通道组织信息，提高网络的表达能力，同时还可以对输出通道进行升维和降维。Inception\
    \ 模块中包含了 1×1、3×3、5×5 三种不同尺寸的卷积和 1 个 3×3 最大池化，增强了网络对不同尺度特征图的适应性。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_68_1.png)\n\
    \n图 2-35 GoogleNet 中的 Inception 模块\n\nGoogleNet 的第 2 版 [7]、第 3 版 [8] 和第 4 版 [9]\
    \ 对第 1 版进行了改进，进一步减小了在 ImageNet 物体识别挑战赛数据集上的分类错误率。GoogleNet 第 2 版主要是针对深度神经网络训练过程中存在的内部协变量偏移（Internal\
    \ Covariate Shift，ICS）问题（是指如果训练数据在经过深度神经网络的每一层后其分布发生了变化，就可能降低整个网络的优化效率），提出使用批归一化（Batch\
    \ Normalization，BN）来解决这一问题。GoogleNet 第 3 版主要是对之前版本的卷积进行分解来减少参数量，如跟 VGG-16 中的一样，用两个\
    \ 3×3 的卷积串联来代替一个 5×5 的卷积。GoogleNet 第 4 版的主要思想是将要讲述的 ResNet 和 Inception 模块结合起来，起到了非常好的效果。\n\
    \n## 2.4.5 ResNet\n\n残差神经网络（Residual Neural Network，ResNet） [10] 由何凯明等人提出，获得了\
    \ 2015 年 ImageNet 物体识别挑战赛的冠军。\n\nResNet 的核心是称作残差块（Residual Block）的单元，残差块可以视作在标准神经网络基础上加入了跳跃连接（Skip\
    \ Connection），可以从某一层获取激活输出，迅速反馈给另一层，如图 2-36 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_69_0.png)\n\
    \n图 2-36 ResNet 的残差块\n\n如图 2-36a 所示为一个普通的两层神经网络，其中 $W$ 和 $b$ 分别表示连接权重和偏置，$\\sigma(\\\
    cdot)$ 表示激活函数，则有：\n\n```\n\\(x_{l+1} = \\sigma(W_{l+1}x_l + b_{l+1})\\)\n\\(x_{l+2}\
    \ = \\sigma(W_{l+2}x_{l+1} + b_{l+2})\\)\n(2-21)\n```\n\n也就是说，在普通的神经网络中，信息流从 \\\
    (x_l\\) 到 \\(x_{l+1}\\) 再到 \\(x_{l+2}\\) 需要经过如上的计算过程，可以看成信息沿着一条直的管道流动。\n\n如图 2-36b\
    \ 所示是一个残差块，相较于普通神经网络，添加了一条直接从 \\(x_l\\) 到 \\(x_{l+2}\\) 的连接，即前文所说的跳跃连接，因此有：\n\n\
    ```\n$x_{i,i_1}=\\sigma\\left(W_{i,i_1}x_i+b_{i,i_1}\\right) \\\\ x_{i,i_2}=\\\
    sigma\\left(W_{i,i_2}x_{(i_1)}+b_{i,i_2}+x_i\\right)$\n```\n\n也就是说，在残差块里面，通过跳跃连接使得前面某层的输出作为后面某层的输入。如果存在跳跃连接的输入、输出维度不一致的情况，则可以对输入进行简单的线性映射变换即可。\n\
    \n由前面讲述的 VGGNet 可以看出，随着卷积神经网络层数的加深，其性能也有了大幅提升。那么为什么会提出残差网络呢？主要是因为随着卷积网络层数的增加，误差的反向传播过程中存在的梯度消失和梯度爆炸问题同样也会导致模型的训练难以进行，甚至会出现随着网络深度的加深，模型在训练集上的训练误差出现先降低再升高的现象。而残差块的引入则有助于缓解梯度消失和梯度爆炸问题。\n\
    \n## 2.5 卷积神经网络的主要应用\n\n### 2.5.1 目标检测\n\n目标检测任务是指将图像或者视频中的目标物体用边框（Bounding Box）标记并识别出该目标物体的类别。目前目标检测任务有两类模型：一类是以区域卷积神经网络（Region-CNN，R-CNN）系列为代表的两阶段模型，一类是以\
    \ YOLO 系列为代表的一阶段模型。\n\n- 1. R-CNN 系列\n\nR-CNN [12] 由 Ross Girshick 等人 2014 年提出。R-CNN\
    \ 首先在 ImageNet 上训练模型，然后在 PASCAL VOC 数据集上进行微调（Finetuning），将目标检测的验证指标平均精度均值（Mean\
    \ Average Precision，mAP）提升到了 53.7%，这比之前最好的结果提升了 13.3%。R-CNN 的结构如图 2-37 所示。\n\n\
    ![](img/57b180d92f84b0150a5b5e4fc7583b76_70_0.png)\n\nR-CNN 的实现过程如下所示。\n\n- 1）区域划分：给定一张输入图片，采用选择性搜索（Selective\
    \ Search）算法从图片中提取 2000 个左右独立的候选区域。\n\n- 2）特征提取：对于每个区域利用 AlexNet 抽取一个固定长度的特征向量。\n\
    \n- 3）目标分类：对每个区域利用 SVM 进行分类。\n\n- 4) 边框回归：进行边框坐标偏移优化和调整。\n\n### (1) 区域划分\n\n使用选择性搜索算法\
    \ [30] 进行区域划分，它的核心思想是图像中目标可能存在的区域存在某些相似性或者连续性。基于这一思想，选择性搜索算法采用子区域合并的方法提取候选边界框。首先，通过图像分割算法将输入图像分割成许多小的子区域；其次，根据这些子区域之间的相似性（主要考虑颜色、纹理、尺寸和空间交叠\
    \ 4 个方面的相似性）进行区域合并，并进行不断迭代。每次迭代过程中对这些合并的子区域做外切矩形，这些子区域的外切矩形就是通常所说的候选边框。选择性搜索算法（层次分组算法）的伪代码如算法\
    \ 2-1 所示。\n\n```\n算法 2-1 层次分组算法（Hierarchical Group Algorithm）\n输入：（彩色）图像\n输出：目标定位假设\
    \ L 的集合\n获取初始化区域 R={r1,⋯,rn}\n初始化相似度集合 S=Ø\nFor each 相邻的区域对 (ri,rj) do\n计算相似度\
    \ s(ri,rj)\nS=S∪s(ri,rj)\nEnd\nWhile S≠Ø do\n获取最大相似度值：s(ri,rj)= max (S)\n合并并对应区域：ri=ri∪rj\n\
    移除与 ri 相关的相似度：S=S \\ s(ri,r∗)\n移除与 rj 相关的相似度：S=S \\ s(r∗,rj)\n计算 ri 与其相邻区域的相似度集合\
    \ Si\n更新相似度集合：S=S∪Si\n更新区域集合：R=R∪ri\nEnd\n```\n\n### (2) 目标分类\n\n使用 SVM 对目标进行分类，训练时，把人工标定边框（Ground\
    \ Truth）作为该类别的正例，把 IoU 小于 0.3 的建议边框（Proposal）作为该类别的负例；调优 CNN 时，把 IoU 大于 0.5 的建议边框作为该类别的正例，其他作为负例（所有类别的背景）。如图\
    \ 2-38 所示，假设有两个矩形边框 A 和 B，那么 IoU 的定义如下：\n\nIoU = (A ∩ B) / (A ∪ B) （2-23）\n\n\
    ![](img/57b180d92f84b0150a5b5e4fc7583b76_72_0.png)\n\n### (3) 边框回归\n\n边框回归的目的是使得预测的边框尽可能与人工标定的边框接近。如图\
    \ 2-39 所示，$P$ 表示建议边框，$\\hat{G}$ 表示预测边框（Predicted），$G$ 表示人工标定边框（Ground Truth）。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_72_1.png)\n\n在边框回归时，给定 $(P_x, P_y,\
    \ P_w, P_h)$，$P_x, P_y, P_w, P_h$ 分别表示建议边框的中心点坐标以及宽度与高度，目的就是寻找一种映射 $f$，使得：\n\n\
    ```\n(\\hat{G}_x, \\hat{G}_y, \\hat{G}_w, \\hat{G}_h)=f(P_x, P_y, P_w, P_h) \\\
    quad (2-24)\n(\\hat{G}_x, \\hat{G}_y, \\hat{G}_w, \\hat{G}_h) \\approx (G_x, G_y,\
    \ G_w, G_h) \\quad (2-25)\n```\n\n先做平移：$(\\Delta x, \\Delta y), \\Delta x=P_w\
    \ d_x(P), \\Delta y=P_h d_y(P)$，那么：\n\n```\n\\hat{G}_x=P_w d_x(P)+P_x \\quad (2-26)\n\
    \\hat{G}_y=P_h d_y(P)+P_y \\quad (2-27)\n```\n\n再做缩放：$(\\Delta_w, \\Delta_h),\
    \ \\Delta_w=\\exp(d_w(P)), \\Delta_h=\\exp(d_h(P))$，那么：\n\n```\n\\hat{G}_w=P_w\
    \ \\exp(d_w(P)) \\quad (2-28)\n\\hat{G}_h=P_h \\exp(d_h(P)) \\quad (2-29)\n```\n\
    \n那么，真实的偏移量：\n\n```\nt_x=(G_x-P_x)/P_w \\quad (2-30)\nt_y=(G_y-P_y)/P_h \\quad\
    \ (2-31)\nt_w=\\log(G_w/P_w) \\quad (2-32)\nt_h=\\log(G_h/P_h) \\quad (2-33)\n\
    ```\n\n边框回归的损失函数为\n\n```\n\\hat{w}_* = \\arg \\min_{w_*} \\sum_i^n (t_* - \\hat{w}_*^T\
    \ \\phi_3(P_i'))^2 + \\lambda \\|\\hat{w}_*\\|^2 \\quad (2-34)\n```\n\n其中 \\(\\\
    theta_5(\\mathbf{P}^i)\\) 表示建议边框的特征向量，它是 AlexNet 第 5 层池化输出的特征，\\(\\mathbf{w}_i\\\
    ) 是要学习的参数。\n\nFast R-CNN [13] 对 R-CNN 进行了改进，主要包括以下几个方面：\n\n- 1) 使用 Softmax 分类替换\
    \ R-CNN 中的 SVM 分类。\n\n- 2) 设计了联合损失函数，将 Softmax 分类、边框回归一起训练。\n\n- 3) 添加感兴趣区域池化（Region\
    \ of Interest Pooling，RoI Pooling）层，实现了不同大小区域特征图的池化。\n\n- 4) 训练时所有的特征存在缓存中，不再存到硬盘上，提升了速度。\n\
    \nFast R-CNN 的结构如图 2-40 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_73_0.png)\n\
    \n图 2-40 Fast R-CNN 的结构\n\nFast R-CNN 在 CNN 提取特征后，进行 RoI Pooling，再将候选框目标分类与边框回归同时放入全连接层，形成一个多任务学习（Multi-task\
    \ Learning）模型。RoI Pooling 是指将每个候选区域均匀分成 \\(M \\times N\\) 块，对每块进行最大池化，将特征图上大小不一的候选区域转变为大小统一的数据，送入下一层，如图\
    \ 2-41 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_73_1.png)\n\n图 2-41 RoI\
    \ Pooling 池化示意图\n\nFast R-CNN 采用联合损失函数，一部分是分类损失函数，一部分是边框回归损失函数，如下所示：\n\n```\n\\\
    (L(p, u, t^u, v) = L_{cls}(p, u) + \\lambda [u \\ge 1] L_{loc}(t^u, v)\\) (2-35)\n\
    ```\n\n```\n\\(L_{cls}(p, u) = -\\log p_u\\) (2-36)\n```\n\n$$L_{loc}(t^u, v)\
    \ = \\sum_{i \\in \\{x,y,w,h\\}} \\text{smooth}_{L_1}(t_i^u - v_i) \\quad (2-37)$$\
    \ \n$$\\text{smooth}_{L_1}(x) = \\begin{cases} 0.5x^2 & |x| < 1 \\\\ |x| - 0.5\
    \ & \\text{其他情况} \\end{cases} \\quad (2-38)$$\n\n其中 \\( L_{cls}(p, u) \\) 指的是类\
    \ \\( u \\) 为正例的对数损失，\\( p = (p_0, p_1, \\cdots) \\) 是每个类别的概率，\\( L_{loc}(t^u,\
    \ v) \\) 是定义在类 \\( u \\) 上的一组正例边框回归目标的损失，\\( v = (v_x, v_y, v_w, v_h) \\)，\\(\
    \ t^u \\) 表示一组类 \\( u \\) 上的预测边框，\\( t^u = (t_x^u, t_y^u, t_w^u, t_h^u) \\)，\\\
    ( \\lambda[u \\geqslant 1] \\) 当 \\( u \\geqslant 1 \\) 时为 1，其他情况为 0，\\( \\lambda\
    \ \\) 是边框回归损失的权重参数，\\( \\text{smooth}_{L_1}(x) \\) 是平滑函数。\n\nFaster R-CNN [14]\
    \ 使用一种称作区域建议网络（Region Proposal Network，RPN）的全卷积神经网络来生成区域建议（Region Proposal），替代之前的选择性搜索算法。Faster\
    \ R-CNN 的结构如图 2-42 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_74_0.png)\n\
    \n[图 2-42 Faster R-CNN 的结构(详见彩插)]\n\nFaster R-CNN 首先使用一组由卷积、ReLU、池化组成的结构提取输入图像的特征图，特征图同时用于后续的\
    \ RPN 和 RoI Pooling。RPN 层用于生成区域建议，它通过 Softmax 判断区域是有目标的正例（Positive）还是没有目标的负例（Negative），再利用边框回归获得候选区域。RoI\
    \ Pooling 层接收卷积和池化后的特征图和 RPN 层的候选区域，综合这些信息后送入全连接层判定目标类别，同时再次使用边框回归获得边框的最终精确位置。\n\
    \n在 RPN 中，使用长宽比为 1:1、1:2 和 2:1 三种矩形框，称作 Anchor。首先，为特征图每个位置生成 \\( k \\)（默认为 9）个\
    \ Anchor。其中分类用 Softmax 判断 Anchor 是有目标的正例（Positive Anchor）还是没有目标的负例（Negative Anchor），因此输出大小为\
    \ 2k。回归实现\n"
