    对于函数 \(f(\boldsymbol{x})\)，设 \(\boldsymbol{x}\) 是一个向量，\(\boldsymbol{x} = [x_1,
    x_2, \cdots, x_n]^\mathrm{T}\)，假定函数对向量的元素可导，则 \(f(\boldsymbol{x})\) 关于 \(\boldsymbol{x}\)
    的一阶导数为


    \nabla_{\boldsymbol{x}} f(\boldsymbol{x}) = \frac{\partial f''(\boldsymbol{x})}{\partial
    \boldsymbol{x}} = \left[ \frac{\partial f''(\boldsymbol{x})}{\partial x_1}, \frac{\partial
    f''(\boldsymbol{x})}{\partial x_2}, \cdots, \frac{\partial f''(\boldsymbol{x})}{\partial
    x_n} \right]^\mathrm{T} \qquad (\mathrm{A}-23)


    对于函数 \(f(\boldsymbol{A})\)，设 \(\boldsymbol{A}\) 是一个 \(m \times n\) 的矩阵，\(a_{i,
    j} \in \boldsymbol{A}, i=1, 2, \cdots, m, j=1, 2, \cdots, n\)，假定函数 \(f(\boldsymbol{A})\)
    对矩阵 \(\boldsymbol{A}\) 的元素 \(a_{i, j}\) 可导，则 \(f(\boldsymbol{A})\) 关于 \(\boldsymbol{A}\)
    的一阶导数为


    \nabla_{\boldsymbol{A}} f(\boldsymbol{A}) = \frac{\partial f(\boldsymbol{A})}{\partial
    \boldsymbol{A}} = \left[ \begin{array}{ c c c c } \frac{\partial f(\boldsymbol{A})}{\partial
    a_{1,1}} & \frac{\partial f(\boldsymbol{A})}{\partial a_{1,2}} & \cdots & \frac{\partial
    f(\boldsymbol{A})}{\partial a_{1,n}} \\ \frac{\partial f(\boldsymbol{A})}{\partial
    a_{2,1}} & \frac{\partial f(\boldsymbol{A})}{\partial a_{2,2}} & \cdots & \frac{\partial
    f(\boldsymbol{A})}{\partial a_{2,n}} \\ \vdots & \vdots & & \vdots \\ \frac{\partial
    f(\boldsymbol{A})}{\partial a_{m,1}} & \frac{\partial f(\boldsymbol{A})}{\partial
    a_{m,2}} & \cdots & \frac{\partial f(\boldsymbol{A})}{\partial a_{m,n}} \end{array}
    \right] \qquad (\mathrm{A}-24)


    ### A.2.4 神经网络中的求导


    在神经网络中，假设使用 Sigmoid 函数作为激活函数：


    $f(x) = \frac{1}{1+e^{-x}}$ (A-25)


    它的导数计算过程如下：


    $f''(x) = (-1) \times (1+e^{-x})^{-2} \times e^{-x} \times (-1)$

    $= (1+e^{-x})^{-2} e^{-x}$

    $= \frac{e^{-x}}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}-1}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}}{(1+e^{-x})^2} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} (1 - \frac{1}{1+e^{-x}})$

    $= f(x) (1 - f(x))$ (A-26)


    用神经网络求解回归问题的误差函数可描述如下：


    $E = \sum_i \frac{1}{2}(y_i - f(z_i))^2$ (A-27)


    其中，$y_i$ 是输出层第 \(i\) 个神经元的期望输出，\(f(z_i)\) 是实际输出，\(f(\cdot)\) 是 Sigmoid 激活函数，\(z_i
    = \sum_j w_{ji} h_j\)，\(h_j\) 是上一层第 \(j\) 个神经元的输入，\(w_{ji}\) 是相应的权重，那么误差函数 \(E\)
    对权重 \(w_{ji}\) 的导数求解如下：


    $\frac{\partial E}{\partial w_{ji}} = \frac{\partial E}{\partial f(z_i)} \frac{\partial
    f(z_i)}{\partial z_i} \frac{\partial z_i}{\partial w_{ji}}$

    $= (y_i - f(z_i)) \cdot (-f''(z_i)) \cdot h_j$

    $= -(y_i - f(z_i)) f(z_i) (1 - f(z_i)) h_j$ (A-28)


    ## A.3 概率统计


    ### A.3.1 随机变量


    随机变量（Random Variable）是指随机事件的量化表现，随机事件量化的好处是可以用数学分析的方法来研究随机现象。随机变量可以是离散的或者连续的，离散随机变量是指拥有有限个或者可列无限多个变量值的随机变量，连续随机变量是指变量值不可一一列举的随机变量。一个随机变量通常使用一个概率分布来指定它每个取值的可能性。


    ### A.3.2 概率分布的定义


    给定某个随机变量的取值范围，概率分布（Probability Distribution）就是导致该随机事件出现的可能性。从机器学习与深度学习的角度来看，概率分布就是符合随机变量取值范围的某个对象属于某个类别或服从某种规律的可能性。


    分布函数：设 X 是一个随机变量，函数 \( F(x)=P\{X \leqslant x\} \) 称为 X 的分布函数，记作 \( X \sim F(x)
    \)。离散性随机变量 X 的分布表示为 \( P\{X=x_i\}=p_i, (i=1,2,\cdots) \)，那么，它的分布函数表示为 \( F(x)=P\{X
    \leqslant x\}=\sum_{i \leqslant x} p_i \)


    连续型随机变量 X 的密度函数为 f(x)，则它的分布函数表示为 \( F(x)=P\{X \leqslant x\}=\int_{-\infty}^x f(x)
    \mathrm{d}x \)


    连续型随机变量的密度函数：当研究的对象是连续型随机变量时，概率密度函数的使用更加广泛，若使用 f(x) 表示连续型随机变量 X 的密度函数，则满足：


    - 1) f(x) 的定义域是随机变量 X 所有可能状态的集合。

    - 2) \( \forall x \in X, f(x) \geqslant 0 \)。

    - 3) \( \int f(x) \mathrm{d}x = 1 \)。


    ### A.3.3 常用概率分布


    伯努利分布：又称 0-1 分布，是单个二值型离散随机变量的分布，概率密度函数为 \( P(X=1)=p, \quad P(X=0)=1-p \)


    二项分布：二项分布即重复 n 次伯努利试验，各次试验之间都相互独立，并且每次试验中只有两种可能的结果，且这两种结果发生与否相互对立。如果每次试验时，事件发生的概率为
    p，不发生的概率为 \( (1-p) \)，则 n 次重复独立试验中事件发生 k 次的概率为 \( P(X=k)=C_n^k p^k (1-p)^{n-k}
    \)


    均匀分布：又称矩形分布，在给定时间间隔 \( [a,b] \) 内的分布概率是等可能的，均匀分布由参数 \( a, b \) 定义，概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \frac{1}{b-a}, & a \leqslant x \leqslant b \\
    0, & \text{其他情况} \end{array}\right. \)


    高斯分布：又称正态分布，是实数中最常用的分布，对于均值为 \( \mu \)，标准差为 \( \sigma \) 的一元高斯分布，概率密度函数为

    \( f(x)=\frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}} \)


    指数分布：常用于描述事件的时间间隔，参数为 \( \lambda \) 的指数分布的概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \lambda e^{-\lambda x}, & x \geqslant 0 \\ 0,
    & x<0 \end{array}\right. \)


    指数分布的一个重要特征是无记忆性。例如，若某元件的寿命为 T，已知该元件已经使用了 x 小时，那么它总共使用至少 \( (x+t) \) 小时的条件概率与从开始使用时算起它使用至少
    s 小时的概率相等，即


    $P(X>s+x \mid X>x) = P(X>s)$


    ### A.3.4 期望、方差和协方差


    期望（Expectation）：在概率论和统计学中，数学期望是试验中每次可能结果的概率乘以其结果的总和。它是最基本的数学特征之一，反映随机变量平均值的大小。


    假设 \( X \) 是一个离散随机变量，可能的取值为 \(\{x_k\}, k = 1, 2, \cdots, n\)，相对应的概率为 \(\{p(x_k)\},
    k = 1, 2, \cdots, n\)，则 \( X \) 的期望定义为


    $E(X) = \sum_{k=1}^n x_k p(x_k)$


    假设 \( X \) 是一个连续型随机变量，其概率密度函数为 \( f(x) \)，则 \( X \) 的期望定义为


    $E(X) = \int_{-\infty}^{\infty} x f(x) dx$


    方差（Variance）：概率论中，方差用来衡量随机变量与其数学期望之间的偏离程度；统计学中，方差则为样本方差，是各个样本数据分别与其平均值之差的平方和的期望。


    离散随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = E[(x - E(X))^2] = E(X^2) - [E(X)]^2$


    连续随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = \int_{-\infty}^{\infty} [x - E(X)]^2 f(x) dx$


    协方差（Covariance）：在概率论和统计学中，协方差被用于衡量两个随机变量 \( X \) 和 \( Y \) 之间的总体误差，表示为


    $\text{Cov}(X, Y) = E[(X - E(X))[Y - E(Y)]] = E(XY) - E(X)E(Y)$


    离散随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \sum_i \sum_j [x_i - E(X)][y_j - E(Y)] p_{ij}$


    其中，\( P\{X=x_i, Y=y_i\} = p_{ij}, i, j = 1, 2, 3, \cdots \)。


    连续随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} [x - E(X)][y
    - E(Y)] f(x, y) dx dy$


    ### A.3.5 条件概率


    条件概率：在很多情况下，人们感兴趣的是某个事件在给定其他事件发生时而发生的概率，这种概率称作条件概率。事件 \( Y \) 在事件 \( X \) 发生的条件下发生的概率，用
    \( P(Y \mid X) \) 表示：


    $P(Y \mid X) = \frac{P(Y, X)}{P(X)}, P(X) > 0$


    条件概率具有链式法则：


    $P(X_1, X_2, \cdots, X_n) = P(X_1 \mid X_2, \cdots, X_n) P(X_2 \mid X_3, X_4,
    \cdots, X_n) \cdots P(X_{n-1} \mid X_n) P(X_n) = P(X_n) \prod_{i=1}^{n-1} P(X_i
    \mid X_{i+1}, \cdots, X_n)$

    '
  mdcn: '

    当 q=2 时，称为欧氏距离（Euclidean Distance），定义如下：

    \( d(x, y) = \sqrt{\sum_{i=1}^d |x_i - y_i|^2} \) (A-14)


    当 q=1 且取距离的最大值，称为切比雪夫距离（Chebyshev Distance），定义如下：

    \( d(x, y) = \max_{1 \le i \le d} |x_i - y_i| \) (A-15)


    设 \( x, y \in \mathbb{R}^d \)，马氏距离（Mahalanobis Distance）定义如下：

    \( d(x, y) = \sqrt{(x-y)'' M (x-y)} \) (A-16)


    其中 M 是半正定矩阵，特殊地：


    - 1) 当 M 为单位矩阵时，退化为欧氏距离。

    - 2) 当 M 为对角矩阵时，退化为特征加权欧氏距离。


    ## A.2 导数


    ### A.2.1 导数的定义


    设函数 \( y=f(x) \) 在点 \( x_0 \) 的某个邻域内有定义，当自变量 \( x \) 在 \( x_0 \) 处有增量 \( \Delta
    x \)，\( x_0 + \Delta x \) 也在该邻域时，相应的函数取得增量 \( \Delta y=f(x_0+\Delta x)-f(x_0)
    \)；如果 \( \Delta y \) 与 \( \Delta x \) 之比在 \( \Delta x \to 0 \) 时极限存在，则称函数 \( y=f(x)
    \) 在 \( x_0 \) 处可导，并称这个极限为 \( y=f(x) \) 在点 \( x_0 \) 处的导数，记作 \( f''(x) \) 或 \(
    y''|_{x=x_0} \) 或 \( \frac{dy}{dx}|_{x=x_0} \)，即

    \( f''(x_0) = \lim_{\Delta x \to 0} \frac{f(x_0+\Delta x)-f(x_0)}{\Delta x} \)
    (A-17)


    ### A.2.2 链式法则


    链式法则是求复合函数的导数（偏导数）的法则，若 \( I, J \) 是直线上的开区间，函数 \( f(x) \) 在 \( I \) 上有定义（\( a
    \in I \)），在 \( a \) 处可微，函数 \( g(y) \) 在 \( J \) 上有定义（\( J \subset f(I) \)），在 \(
    f(a) \) 处可微，则复合函数 \( (g \circ f)(x) = g(f(x)) \) 在 \( a \) 处可微（\( g \circ f \)
    在 \( I \) 上有定义），且 \( (g \circ f)''(a) = g''(f(a))f''(a) \)。若记 \( u=g(y), y=f(x)
    \)，而 \( f \) 在 \( I \) 上可微，\( g \) 在 \( J \) 上可微，则在 \( I \) 上任意点 \( x \) 有 \(
    (g \circ f)''(x) = g''(f(x))f''(x) \)，即

    \( (g \circ f)''(x) = g''(f(x))f''(x) \) 或 \( \frac{du}{dx} = \frac{du}{dy} \frac{dy}{dx}
    \) (A-18)


    在人工神经网络训练中，反向传播算法经常用到链式法则。


    ### A.2.3 向量与矩阵的导数


    在深度学习中，数据的训练都是以矩阵的形式进行的，更多地需要对向量或矩阵求导。


    设 \( x \) 为一个向量，\( x=[x_1, x_2, \cdots, x_n]^T \)，\( b \) 为一个标量，那么向量 \( x \) 对标量
    \( b \) 的导数，以及标量 \( b \) 对向量 \( x \) 的导数都是向量，分别为


    \frac{\partial \boldsymbol{x}}{\partial \boldsymbol{b}} = \left[ \frac{\partial
    x_1}{\partial b}, \frac{\partial x_2}{\partial b}, \cdots, \frac{\partial x_n}{\partial
    b} \right]^{\mathrm{T}} \qquad (\mathrm{A}-19)


    \frac{\partial \boldsymbol{b}}{\partial \boldsymbol{x}} = \left[ \frac{\partial
    b}{\partial x_1}, \frac{\partial b}{\partial x_2}, \cdots, \frac{\partial b}{\partial
    x_n} \right]^{\mathrm{T}} \qquad (\mathrm{A}-20)


    类似地，设 \(\boldsymbol{A}\) 是一个 \(m \times n\) 的矩阵，\(a_{i, j} \in \boldsymbol{A},
    i=1, 2, \cdots, m, j=1, 2, \cdots, n\)，那么矩阵 \(\boldsymbol{A}\) 对于标量 \(b\) 的导数，以及
    \(b\) 对于 \(\boldsymbol{A}\) 的导数都是矩阵，分别为


    \frac{\partial \boldsymbol{A}}{\partial b} = \left[ \begin{array}{ c c c c } \frac{\partial
    a_{1,1}}{\partial b} & \frac{\partial a_{1,2}}{\partial b} & \cdots & \frac{\partial
    a_{1,n}}{\partial b} \\ \frac{\partial a_{2,1}}{\partial b} & \frac{\partial a_{2,2}}{\partial
    b} & \cdots & \frac{\partial a_{2,n}}{\partial b} \\ \vdots & \vdots & & \vdots
    \\ \frac{\partial a_{m,1}}{\partial b} & \frac{\partial a_{m,2}}{\partial b} &
    \cdots & \frac{\partial a_{m,n}}{\partial b} \end{array} \right] \qquad (\mathrm{A}-21)


    \frac{\partial b}{\partial \boldsymbol{A}} = \left[ \begin{array}{ c c c c } \frac{\partial
    b}{\partial a_{1,1}} & \frac{\partial b}{\partial a_{1,2}} & \cdots & \frac{\partial
    b}{\partial a_{1,n}} \\ \frac{\partial b}{\partial a_{2,1}} & \frac{\partial b}{\partial
    a_{2,2}} & \cdots & \frac{\partial b}{\partial a_{2,n}} \\ \vdots & \vdots & &
    \vdots \\ \frac{\partial b}{\partial a_{m,1}} & \frac{\partial b}{\partial a_{m,2}}
    & \cdots & \frac{\partial b}{\partial a_{m,n}} \end{array} \right] \qquad (\mathrm{A}-22)


    对于函数 \(f(\boldsymbol{x})\)，设 \(\boldsymbol{x}\) 是一个向量，\(\boldsymbol{x} = [x_1,
    x_2, \cdots, x_n]^\mathrm{T}\)，假定函数对向量的元素可导，则 \(f(\boldsymbol{x})\) 关于 \(\boldsymbol{x}\)
    的一阶导数为


    \nabla_{\boldsymbol{x}} f(\boldsymbol{x}) = \frac{\partial f''(\boldsymbol{x})}{\partial
    \boldsymbol{x}} = \left[ \frac{\partial f''(\boldsymbol{x})}{\partial x_1}, \frac{\partial
    f''(\boldsymbol{x})}{\partial x_2}, \cdots, \frac{\partial f''(\boldsymbol{x})}{\partial
    x_n} \right]^\mathrm{T} \qquad (\mathrm{A}-23)


    对于函数 \(f(\boldsymbol{A})\)，设 \(\boldsymbol{A}\) 是一个 \(m \times n\) 的矩阵，\(a_{i,
    j} \in \boldsymbol{A}, i=1, 2, \cdots, m, j=1, 2, \cdots, n\)，假定函数 \(f(\boldsymbol{A})\)
    对矩阵 \(\boldsymbol{A}\) 的元素 \(a_{i, j}\) 可导，则 \(f(\boldsymbol{A})\) 关于 \(\boldsymbol{A}\)
    的一阶导数为


    \nabla_{\boldsymbol{A}} f(\boldsymbol{A}) = \frac{\partial f(\boldsymbol{A})}{\partial
    \boldsymbol{A}} = \left[ \begin{array}{ c c c c } \frac{\partial f(\boldsymbol{A})}{\partial
    a_{1,1}} & \frac{\partial f(\boldsymbol{A})}{\partial a_{1,2}} & \cdots & \frac{\partial
    f(\boldsymbol{A})}{\partial a_{1,n}} \\ \frac{\partial f(\boldsymbol{A})}{\partial
    a_{2,1}} & \frac{\partial f(\boldsymbol{A})}{\partial a_{2,2}} & \cdots & \frac{\partial
    f(\boldsymbol{A})}{\partial a_{2,n}} \\ \vdots & \vdots & & \vdots \\ \frac{\partial
    f(\boldsymbol{A})}{\partial a_{m,1}} & \frac{\partial f(\boldsymbol{A})}{\partial
    a_{m,2}} & \cdots & \frac{\partial f(\boldsymbol{A})}{\partial a_{m,n}} \end{array}
    \right] \qquad (\mathrm{A}-24)


    ### A.2.4 神经网络中的求导


    在神经网络中，假设使用 Sigmoid 函数作为激活函数：


    $f(x) = \frac{1}{1+e^{-x}}$ (A-25)


    它的导数计算过程如下：


    $f''(x) = (-1) \times (1+e^{-x})^{-2} \times e^{-x} \times (-1)$

    $= (1+e^{-x})^{-2} e^{-x}$

    $= \frac{e^{-x}}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}-1}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}}{(1+e^{-x})^2} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} (1 - \frac{1}{1+e^{-x}})$

    $= f(x) (1 - f(x))$ (A-26)


    用神经网络求解回归问题的误差函数可描述如下：


    $E = \sum_i \frac{1}{2}(y_i - f(z_i))^2$ (A-27)


    其中，$y_i$ 是输出层第 \(i\) 个神经元的期望输出，\(f(z_i)\) 是实际输出，\(f(\cdot)\) 是 Sigmoid 激活函数，\(z_i
    = \sum_j w_{ji} h_j\)，\(h_j\) 是上一层第 \(j\) 个神经元的输入，\(w_{ji}\) 是相应的权重，那么误差函数 \(E\)
    对权重 \(w_{ji}\) 的导数求解如下：


    $\frac{\partial E}{\partial w_{ji}} = \frac{\partial E}{\partial f(z_i)} \frac{\partial
    f(z_i)}{\partial z_i} \frac{\partial z_i}{\partial w_{ji}}$

    $= (y_i - f(z_i)) \cdot (-f''(z_i)) \cdot h_j$

    $= -(y_i - f(z_i)) f(z_i) (1 - f(z_i)) h_j$ (A-28)


    ## A.3 概率统计


    ### A.3.1 随机变量


    随机变量（Random Variable）是指随机事件的量化表现，随机事件量化的好处是可以用数学分析的方法来研究随机现象。随机变量可以是离散的或者连续的，离散随机变量是指拥有有限个或者可列无限多个变量值的随机变量，连续随机变量是指变量值不可一一列举的随机变量。一个随机变量通常使用一个概率分布来指定它每个取值的可能性。


    ### A.3.2 概率分布的定义


    给定某个随机变量的取值范围，概率分布（Probability Distribution）就是导致该随机事件出现的可能性。从机器学习与深度学习的角度来看，概率分布就是符合随机变量取值范围的某个对象属于某个类别或服从某种规律的可能性。


    分布函数：设 X 是一个随机变量，函数 \( F(x)=P\{X \leqslant x\} \) 称为 X 的分布函数，记作 \( X \sim F(x)
    \)。离散性随机变量 X 的分布表示为 \( P\{X=x_i\}=p_i, (i=1,2,\cdots) \)，那么，它的分布函数表示为 \( F(x)=P\{X
    \leqslant x\}=\sum_{i \leqslant x} p_i \)


    连续型随机变量 X 的密度函数为 f(x)，则它的分布函数表示为 \( F(x)=P\{X \leqslant x\}=\int_{-\infty}^x f(x)
    \mathrm{d}x \)


    连续型随机变量的密度函数：当研究的对象是连续型随机变量时，概率密度函数的使用更加广泛，若使用 f(x) 表示连续型随机变量 X 的密度函数，则满足：


    - 1) f(x) 的定义域是随机变量 X 所有可能状态的集合。

    - 2) \( \forall x \in X, f(x) \geqslant 0 \)。

    - 3) \( \int f(x) \mathrm{d}x = 1 \)。


    ### A.3.3 常用概率分布


    伯努利分布：又称 0-1 分布，是单个二值型离散随机变量的分布，概率密度函数为 \( P(X=1)=p, \quad P(X=0)=1-p \)


    二项分布：二项分布即重复 n 次伯努利试验，各次试验之间都相互独立，并且每次试验中只有两种可能的结果，且这两种结果发生与否相互对立。如果每次试验时，事件发生的概率为
    p，不发生的概率为 \( (1-p) \)，则 n 次重复独立试验中事件发生 k 次的概率为 \( P(X=k)=C_n^k p^k (1-p)^{n-k}
    \)


    均匀分布：又称矩形分布，在给定时间间隔 \( [a,b] \) 内的分布概率是等可能的，均匀分布由参数 \( a, b \) 定义，概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \frac{1}{b-a}, & a \leqslant x \leqslant b \\
    0, & \text{其他情况} \end{array}\right. \)


    高斯分布：又称正态分布，是实数中最常用的分布，对于均值为 \( \mu \)，标准差为 \( \sigma \) 的一元高斯分布，概率密度函数为

    \( f(x)=\frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}} \)


    指数分布：常用于描述事件的时间间隔，参数为 \( \lambda \) 的指数分布的概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \lambda e^{-\lambda x}, & x \geqslant 0 \\ 0,
    & x<0 \end{array}\right. \)


    指数分布的一个重要特征是无记忆性。例如，若某元件的寿命为 T，已知该元件已经使用了 x 小时，那么它总共使用至少 \( (x+t) \) 小时的条件概率与从开始使用时算起它使用至少
    s 小时的概率相等，即


    $P(X>s+x \mid X>x) = P(X>s)$


    ### A.3.4 期望、方差和协方差


    期望（Expectation）：在概率论和统计学中，数学期望是试验中每次可能结果的概率乘以其结果的总和。它是最基本的数学特征之一，反映随机变量平均值的大小。


    假设 \( X \) 是一个离散随机变量，可能的取值为 \(\{x_k\}, k = 1, 2, \cdots, n\)，相对应的概率为 \(\{p(x_k)\},
    k = 1, 2, \cdots, n\)，则 \( X \) 的期望定义为


    $E(X) = \sum_{k=1}^n x_k p(x_k)$


    假设 \( X \) 是一个连续型随机变量，其概率密度函数为 \( f(x) \)，则 \( X \) 的期望定义为


    $E(X) = \int_{-\infty}^{\infty} x f(x) dx$


    方差（Variance）：概率论中，方差用来衡量随机变量与其数学期望之间的偏离程度；统计学中，方差则为样本方差，是各个样本数据分别与其平均值之差的平方和的期望。


    离散随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = E[(x - E(X))^2] = E(X^2) - [E(X)]^2$


    连续随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = \int_{-\infty}^{\infty} [x - E(X)]^2 f(x) dx$


    协方差（Covariance）：在概率论和统计学中，协方差被用于衡量两个随机变量 \( X \) 和 \( Y \) 之间的总体误差，表示为


    $\text{Cov}(X, Y) = E[(X - E(X))[Y - E(Y)]] = E(XY) - E(X)E(Y)$


    离散随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \sum_i \sum_j [x_i - E(X)][y_j - E(Y)] p_{ij}$


    其中，\( P\{X=x_i, Y=y_i\} = p_{ij}, i, j = 1, 2, 3, \cdots \)。


    连续随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} [x - E(X)][y
    - E(Y)] f(x, y) dx dy$


    ### A.3.5 条件概率


    条件概率：在很多情况下，人们感兴趣的是某个事件在给定其他事件发生时而发生的概率，这种概率称作条件概率。事件 \( Y \) 在事件 \( X \) 发生的条件下发生的概率，用
    \( P(Y \mid X) \) 表示：


    $P(Y \mid X) = \frac{P(Y, X)}{P(X)}, P(X) > 0$


    条件概率具有链式法则：


    $P(X_1, X_2, \cdots, X_n) = P(X_1 \mid X_2, \cdots, X_n) P(X_2 \mid X_3, X_4,
    \cdots, X_n) \cdots P(X_{n-1} \mid X_n) P(X_n) = P(X_n) \prod_{i=1}^{n-1} P(X_i
    \mid X_{i+1}, \cdots, X_n)$

    '
