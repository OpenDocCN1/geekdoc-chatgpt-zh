    ```\n\n# 8.3 PyTorch\n\n# 8.3.1 PyTorch 简介\n\nPyTorch 诞生于 2017 年 1 月，是由 Facebook\
    \ 人工智能研究院开发的深度学习框架[2]。PyTorch 的历史可以追溯到早在 2002 年由纽约大学发布的一款机器学习框架 Torch，Torch 采用了较为小众的\
    \ Lua 语言作为接口，其知名度并不高。PyTorch 在 Torch 的基础上使用 Python 语言对其进行了封装和重构，经过数个版本的迭代和完善后，至今已经成为最流行的深度学习框架之一。PyTorch\
