    #### 4.2.3 Transformer 中的自注意力机制


    注意力机制可以被描述为给定一个查询（Query）和一组键（Key）值（Value）向量对，计算这个查询和键向量之间的权重系数，然后使用这个权重系数对值向量进行加权平均，得到最终输出向量的过程。


    在 Transformer 中，提出了一种可缩放的点积注意力（Scaled Dot-Product Attention），也就是自注意力。该注意力机制的输入由查询向量
