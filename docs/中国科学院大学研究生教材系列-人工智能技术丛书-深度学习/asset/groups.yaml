    \ P(B_i)P(A|B_i) \\) (A-46)\n\n贝叶斯公式：全概率公式提供了计算后验概率的途径，即贝叶斯公式为\n\n\\( P(B_i|A)\
    \ = \\frac{P(B_i)P(A|B_i)}{P(A)} = \\frac{P(B_i)P(A|B_i)}{\\sum_{j=1}^n P(B_j)P(A|B_j)}\
    \ \\) (A-47)\n\n## A. 3.6 最大似然估计\n\n最大似然估计：给定一个概率分布 \\( D \\)，假定其概率密度函数为 \\( f_\\\
    theta \\)，以及一个分布参数 \\( \\theta \\)，从这个分布中采样一个具有 \\( n \\) 个值的样本 \\( (x_1, x_2,\
    \ \\dots, x_n) \\)，进一步地，计算出恰好生成这 \\( n \\) 个值的概率：\\( p(x_1, x_2, \\dots, x_n)\
    \ = f_\\theta(x_1, x_2, \\dots, x_n | \\theta) \\)。所谓最大似然估计，就是在参数 \\( \\theta\
    \ \\) 的所有取值中，找到一个 \\( \\theta^* \\)，使得 \\( p(x_1, x_2, \\dots, x_n) \\) 最大。\n\n\
    求解步骤：\n\n- 1) 写出似然函数：\n\n  \\( L(\\theta) = \\prod_{i=1}^n p(x_i | \\theta) \\\
    ) (A-48)\n\n- 2) 为方便计算，通常使用对数形式：\n\n  \\( \\log L(\\theta) = \\sum_{i=1}^n \\\
    log (p(x_i | \\theta)) \\) (A-49)\n\n- 3) \\( \\frac{d\\log L(\\theta)}{d\\theta}\
    \ = 0 \\)，求解出的 \\( \\theta^* \\) 即为最大似然估计。\n\n## A. 4 信息论\n\n信息熵（Entropy）：信息熵表示所有可能发生的事件所带来的信息量的期望。假定随机变量\
    \ \\( X \\) 取值为 \\( x \\) 的概率为 \\( p(x) \\)，则 \\( X \\) 的信息熵定义为\n\n\\( H(X) =\
    \ -\\sum_x p(x) \\log p(x) \\) (A-50)\n\n联合熵：两个随机变量 \\( X \\) 和 \\( Y \\) 的联合分布可以形成联合熵，度量二维随机变量\
    \ \\( X, Y \\) 的不确定性，定义为\n\n\\( H(X, Y) = -\\sum_{x,y} p(x,y) \\log p(x,y) \\\
    ) (A-51)\n\n条件熵：在随机变量 \\( X \\) 发生的前提下，随机变量 \\( Y \\) 发生带来的熵，定义为 \\( Y \\) 的条件熵，定义为\n\
    \n\\( H(Y|X) = -\\sum_{x,y} p(x,y) \\log p(y|x) \\) (A-52)\n\n条件熵用来衡量在已知随机变量 X\
    \ 的条件下，随机变量 Y 的不确定性。熵、联合熵、条件熵之间存在以下关系：\n\n\\( H(Y|X) = H(X, Y) - H(X) \\) (A-53)\n\
    \n相对熵：又称互熵、KL 散度和信息增益，是描述两个概率分布 P 和 Q 差异的一种方法，记为 \\( D(P \\| Q) \\)。在信息论中，\\(\
    \ D(P \\| Q) \\) 表示当用概率分布 Q 来拟合真实分布 P 时，产生的信息损耗，其中 P 表示真实分布，Q 表示 P 的拟合分布。离散随机变量\
    \ X 的相对熵定义为\n\n\\( D(P \\| Q) = \\sum_{x} p(x) \\log \\frac{p(x)}{q(x)} \\) (A-54)\n\
    \n将公式（A-54）展开可得：\n\n\\( D(P \\| Q) = \\sum_{x} p(x) \\log \\frac{p(x)}{q(x)} =\
    \ \\sum_{x} p(x) \\log p(x) - \\sum_{x} p(x) \\log q(x) = -H(X) + (-\\sum_{x}\
    \ p(x) \\log q(x)) \\) (A-55)\n\n公式（A-55）中的第二项 \\( (-\\sum_{x} p(x) \\log q(x))\
    \ \\) 称为交叉熵，在深度学习中交叉熵经常作为分类任务的损失函数使用。\n\n互信息：两个随机变量 X, Y 的互信息定义为 X, Y 的联合分布与各自独立分布乘积的相对熵，用\
    \ \\( I(X, Y) \\) 表示。互信息可以看成是一个随机变量中包含的关于另一个随机变量的信息量，或者说是已知另一个随机变量 Y 的条件下，随机变量\
    \ X 减少的不确定性，定义为\n\n\\( I(X, Y) = \\sum_{x,y} p(x, y) \\log \\frac{p(x, y)}{p(x)p(y)}\
    \ \\) (A-56)\n\n互信息、熵、条件熵之间存在以下关系：\n\n\\( H(Y|X) = H(Y) - I(X, Y) \\) (A-57)\n\
    \n或者互信息可以表达为\n\n\\( I(X, Y) = H(X) + H(Y) - H(X, Y) \\) (A-58)\n\n最大熵原理：最大熵原理是概率模型学习的一个准则，它认为学习概率模型时，在所有可能的概率分布中，使熵达到最大的模型是最好的模型。通常用约束条件来确定模型的集合，因此最大熵原理也可以表述为在满足约束条件的模型集合中选取熵最大的模型。\n\
    \n## A. 5 数学优化\n\n数学优化是指在无约束函数或者有约束函数的情况下求得决策变量的解，使得目标函数最大化或者最小化。\n\n### A. 5.1\
    \ 线性优化与非线性优化\n\n根据目标函数和约束函数是否是线性函数，数学优化可以分为线性优化和非线性优化。如果目标函数和约束函数都是线性函数，则称为线性优化；如果目标函数和约束函数至少有一个是非线性函数，则称为非线性优化。\n\
    \n凸优化是一类常见的非线性优化，它的决策变量的定义域为凸集（Convex Set），目标函数是凸函数（Convex Function）。凸集是指在实数域\
    \ R 的一个向量空间中，集合 S 中任意两点的连线上的点都在 S 内，数学定义为：设集合 \\( S \\subset \\mathbb{R}^n \\\
    )，若对于任意两点 \\( x, y \\in S \\)，以及任意实数 \\( \\lambda (0 \\leqslant \\lambda \\leqslant\
    \ 1) \\)，都有 \\( \\lambda x + (1 - \\lambda) y \\in S \\)，则称集合 S 为凸集。凸函数是指一个定义域在某个凸集\
    \ S 上的实值函数，数学定义为：对于函数 \\( f(x) \\)，如果其定义域 S 是凸集，且对于任意两点 \\( x, y \\in S \\) 以及任意实数\
    \ \\( \\lambda (0 \\leqslant \\lambda \\leqslant 1) \\)，都有 \\( f(\\lambda x +\
    \ (1 - \\lambda) y) \\leqslant \\lambda f(x) + (1 - \\lambda) f(y) \\)，则称 \\(\
    \ f(x) \\) 为凸函数。如果目标函数是凸函数，那么它的局部最优解就是全局最优解，该性质在机器学习和深度学习中，具有极其重要的意义。\n\n### A.\
    \ 5.2 离散优化和连续优化\n\n根据决策变量的类型为离散型和连续型，数学优化可分为离散优化和连续优化。离散优化是指决策变量是离散型的数学优化，又称整数规划，它又可分为线性整数规划、非线性整数规划、混合线性整数规划和混合非线性整数规划。线性整数规划是指目标函数和约束函数都是线性的、决策变量都是整数的整数规划，非线性整数规划是指目标函数和约束函数至少有一个是非线性的、决策变量都是整数的整数规划，混合线性整数规划是指目标函数和约束函数都是线性的、只有部分决策变量是整数的整数规划，混合非线性整数规划是指目标函数和约束函数至少有一个是非线性的、只有部分决策变量是整数的整数规划。连续优化是指决策变量是连续型的数学优化，根据是否有约束函数，连续优化又分为无约束连续优化与有约束连续优化。\n\
    \n无约束连续优化的基本数学模型表示如下：\n\nminf(x)                                             \
    \     (A-59)\n\n其中，x 是一个实数域 R 内的 n 维决策变量，f(x) 为目标函数。\n\n约束连续优化的基本数学模型表示如下：\n\n\
    minf(x)\ns.t.   h_i(x) = 0,   i = 1, 2, \\cdots, m\n       g_i(x) \\leqslant 0,\
    \   j = 1, 2, \\cdots, n                                  (A-60)\n\n其中，x 是一个实数域\
    \ R 内的 n 维决策变量，f(x) 为目标函数，h_i(x) = 0 为等式约束函数，g_i(x) \\leqslant 0 为不等式约束函数。\n\n\
    对于仅有等式约束的约束连续优化问题，可采用拉格朗日乘数法将其转化为无约束连续优化问题进行求解；对于既有等式约束又有不等式约束的约束连续优化问题，首先将其中的不等式约束转化为等式约束，再使用第一种方法求解。\n\
    \n### A. 5.3 最小二乘法\n\n最小二乘法（Least Square，LS），又称最小平方法，是一种常用的数学优化方法。它通过最小化误差的平方和寻找数据的最佳函数匹配。利用最小二乘法可以简便地求得未知的数据，并使得这些求得的数据与实际数据之间误差的平方和最小。最小二乘法还可用于曲线拟合，其他一些优化问题也可通过最小化能量或最大化熵的思路，用最小二乘法来表达。\n\
    \n最小二乘法的数学定义：给定函数 \\( f(x; \\alpha_1, \\alpha_2, \\cdots, \\alpha_n) \\) 及其在 \\\
    ( n \\) 个不同取值 \\( (x_1, x_2, \\cdots, x_n) \\) 时的测量结果为 \\( (y_1, y_2, \\cdots,\
    \ y_n) \\)，即 \\( f(x; \\alpha_1, \\alpha_2, \\cdots, \\alpha_n) \\) 的值，确定未知参数\
    \ \\( (\\alpha_1, \\alpha_2, \\cdots, \\alpha_n) \\)，使得式（A-59）达到最小：\n\n\\( \\\
    sum_{i=1}^{n}[f(x_i; \\alpha_1, \\alpha_2, \\cdots, \\alpha_n)-y_i]^2 \\quad (\\\
    text{A-61}) \\)\n\n值得一提的是，最小二乘法虽然简单，但机器学习与深度学习的绝大多数算法，核心思想都是源于最小二乘法。可以说，最小二乘法是机器学习与深度学习中最基础的数学优化方法。\n\
