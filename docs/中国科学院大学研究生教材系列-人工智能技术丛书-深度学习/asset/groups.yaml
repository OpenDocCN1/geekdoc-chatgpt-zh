    中的残差连接、层归一化等。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_121_0.png)


    #### 4.2.2 Transformer 的输入编码


    与其他的序列到序列模型类似，Transformer 首先将输入序列转换成词嵌入（Word Embedding）向量（简称词向量）。在实现过程中，词向量可以随机初始化后随着网络训练得到，也可以加载预先训练好的词向量表示，如
    Word2Vec、Glove 等。


