    varepsilon^2 = (l_j - y_j)^2$ (7-5)\n\n多个样本的噪声计算公式如下：\n\n$\\bar{\\varepsilon}^2\
    \ = E[\\{(l_j - y_j)^2\\}] , j=1, 2, \\cdots, m$ (7-6)\n\n噪声的计算过程如图 7-5 所示。\n\n\
    ![](img/57b180d92f84b0150a5b5e4fc7583b76_212_1.png)\n\n#### 4. 泛化误差\n\n泛化误差（Generalization\
    \ Error）度量基于训练所得模型得到的预估值和标签值的偏离程度。\n\n同样，用 \\((\\hat{y}_j)_k=f_k(x_j;D_k)\\) 表示在第\
    \ \\(k\\) 个训练集 \\(D_k\\) 上训练所得的模型对测试样本 \\(x_j\\) 的预估值输出，泛化误差的计算公式如下：\n\nGenError(x_j)\
    \ = E[((\\hat{y}_j)_k - l_j)^2], \\quad k=1, 2, \\cdots, K\n\n泛化误差的计算过程如图 7-6\
    \ 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_213_0.png)\n\n图 7-6 泛化误差计算示意图\n\
    \n接下来观察偏差、方差、泛化误差和噪声之间的关系。为方便表示，以下公式不再使用下标指明具体的值。使用 \\(y\\) 表示样本的真实值，\\(l\\) 表示标签值，\\\
    (\\hat{y}\\) 表示模型对新样本的预估值，\\(\\bar{y}\\) 表示在多个训练集上训练所得的模型对新样本预测值的期望。参考文献 [1]，可以推导出泛化误差等于偏差、方差和噪声之和，推导过程如下：\n\
    \nGenError(x)\n= E[(\\hat{y}-l)^2]\n= E[(\\hat{y}-\\bar{y}+\\bar{y}-l)^2]\n= E[(\\\
    hat{y}-\\bar{y})^2]+E[(\\bar{y}-l)^2]+E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n= E[(\\\
    hat{y}-\\bar{y})^2]+E[(\\bar{y}-y+y-l)^2]+E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n\
    = E[(\\hat{y}-\\bar{y})^2]+E[(\\bar{y}-y)^2]+E[(y-l)^2]+E[2(\\hat{y}-\\bar{y})(\\\
    bar{y}-l)]+E[2(\\bar{y}-y)(y-l)]\n\n下面，证明 \\(E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\\\
    ) 等于 0。\n\nE[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n= 2(E[(\\hat{y}-\\bar{y})] E[(\\\
    bar{y}-l)])\n= 2(E[\\hat{y}]-E[\\bar{y}]) E[(\\bar{y}-l)]) //根据公式(7-1)可得 \\(\\\
    bar{y}=E[\\hat{y}]\\)\n= 0\n\n假定噪声的期望 \\( E[(y-l)]=0 \\)，那么\n\n\\(\\begin{aligned}\
    \ & E[2(\\bar{y}-y)(y-l)] \\\\ = & 2E[(\\bar{y}-y)]E[(y-l)] \\\\ = & 0 \\end{aligned}\\\
    ) (7-10)\n\n由此可以得出泛化误差、偏差、方差和噪声之间的关系，如下所示：\n\n\\(\\underbrace{GenError(x)}_{泛化误差}\
    \ = \\underbrace{E[(\\hat{y}-\\bar{y})^2]}_{方差 Var} + \\underbrace{E[(\\bar{y}-y)^2]}_{偏差\
    \ bias} + \\underbrace{E[(y-l)^2]}_{噪声 \\epsilon^2}\\) (7-11)\n\n### 7.1.4 深度学习模型的训练与测试过程\n\
    \n在训练深度学习模型时，一般先设计一个神经网络结构，在训练集上进行训练，在迭代一定的轮数（Epoch）后计算偏差。如果偏差较大，继续进行迭代，如果偏差仍然没有大幅度减小，就需要设计更复杂的神经网络结构（增加每层神经元的数量、增加神经网络的层数等）后再进行训练，直到偏差减小到既定的阈值之内。之后，在验证集上计算训练好的模型的方差，如果方差比较高，说明出现了过拟合现象，就要采取一些措施来降低方差，如增加数据量重新训练、采用一些正则化方法、减少网络参数和降低模型复杂度等，直到方差减小到既定的阈值之内。最后，在测试集上进行模型测试，一般情况下，泛化误差都能满足要求，如果出现泛化误差比较大的情况，根据泛化误差计算公式（7-11），在偏差与方差都比较小的情况下，一般是由数据中含有较多的噪声造成的，这就需要提前对数据进行降噪处理。深度学习模型的训练与测试流程如图\
    \ 7-7 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_214_0.png)\n\n图 7-7 深度学习的训练与测试过程\n\
    \n## 7.2 参数范数正则化\n\n参数范数正则化方法早在深度学习出现之前就已经在使用了。参数范数正则化方法可以简单地在损失函数 L 后添加一个参数范数正则化项\
    \ \\( \\Omega(\\theta) \\)，来限制模型的学习能力，正则化后的损失函数可表示为\n\n\\(\\tilde{L}(\\theta;\
    \ x, y) = L(\\theta; x, y) + \\alpha \\Omega(\\theta)\\) (7-12)\n\n其中，\\( \\alpha\
    \ \\) 是正则项系数，它是一个超参，用来控制惩罚项 \\( \\Omega \\) 对损失函数的惩罚大小。\n\n当最小化正则化后的损失函数时，它会同时降低原有损失函数\
    \ $L$ 和正则化项 $\\Omega(\\theta)$ 的值，即在保证获得小误差的同时减少参数规模，一定程度上减少了过拟合的程度。对于参数范数正则化项，可以选择不同的范数形式，得到不同的优先解。\n\
    \n参数范数正则化中最常见的就是 L1 正则化与 L2 正则化，下面将分别介绍两种参数正则化方法。在介绍之前，先假设 $w$ 为需要正则化的参数，$\\theta$\
    \ 为全体参数，它包括需要正则化的参数 $w$ 与不需要正则化的参数。\n\n### 7.2.1 L1 参数正则化\n\nL1 参数正则化在损失函数中添加一个正则化项：\n\
    \n\\(\\Omega(\\theta) = \\|w\\|_1\\) (7-13)\n\nL1 正则化项就是各个参数的绝对值之和。L1 参数正则化也称为\
    \ Lasso 回归（Lasso Regression）。\n\n由此，加上 L1 正则化项的损失函数变为\n\n\\(\\tilde{L}(w; x, y)\
    \ = L(w; x, y) + \\alpha \\|w\\|_1\\) (7-14)\n\n### 7.2.2 L2 正则化\n\nL2 正则化是在损失函数中添加一个正则化项：\n\
    \n\\(\\Omega(\\theta) = \\frac{1}{2} \\|w\\|_2^2\\) (7-15)\n\nL2 正则化项就是各个参数的平方和再开方。L2\
    \ 正则化也称为岭回归（Ridge Regression），它可以看作是将模型的参数加上了一个较强的先验，并假设参数不会太大。\n\n由此，加上 L2 正则化项的损失函数变为\n\
    \n\\(\\tilde{L}(w; x, y) = L(w; x, y) + \\frac{\\alpha}{2} \\|w\\|_2^2\\) (7-16)\n\
    \n## 7.3 数据增强\n\n深度学习的快速发展离不开大规模数据集的出现，但并不是所有任务都有足够的训练数据，如果不对已有数据进行扩充来进行模型训练，极有可能使得模型陷入过拟合中。数据增强（Data\
    \ Augmentation）可以简单地理解为对训练数据数量的扩充，利用已有的有限数据产生更多的有效数据。因此，在数据集数据量有限时，进行数据增强就显得很有必要，一方面可以尽可能地避免过拟合；另一方面随着训练数据的增多，也会在一定程度上提高模型的泛化性。本书主要介绍图像数据增强的常用方法。\n\
    \n图像数据增强主要有两种常见的方法：空间变换和像素颜色变换。空间变换是最常见也是最直观的图像增强手段之一，如对图像进行随机翻转、旋转、平移和裁剪等操作，在进行数据增强操作时，可以同时进行多种操作。像素颜色变换更多的是对图像像素值进行修改，如在原始图像上进行对比度扰动、饱和度扰动、颜色变换与噪声扰动等操作。可以利用OpenCV、PIL\
    \ 等图像处理库进行数据增强，同时在常用的深度学习框架（如 TensorFlow、PyTorch 和飞桨）中，都有相应的图像增强函数可供直接调用。\n\n\
    PyTorch 框架中与图像数据增强相关的函数位于 torchvision.transforms 中，主要包括如下几种。\n\n- 颜色变换函数 ColorJitter(brightness=0,\
    \ contrast=0, saturation=0, hue=0)：可以对输入图像的亮度（brightness）、对比度（contrast）、饱和度（saturation）和色调（hue）进行随机变换。\n\
    - 灰度变换函数 Grayscale(num_output_channels=1)：直接将输入图像转换为灰度图像，channels=1 是默认值，也可以指定其他值。\n\
    - 灰度变换函数 RandomGrayscale（p=0.1）：在概率 p 下将输入图像转换为灰度图像，p=0.1 是默认值，也可以指定其他值。\n- 随机旋转变换函数\
    \ RandomRotation（degrees）：参数 degrees 用于指定可以旋转的度数范围。\n- 随机水平翻转函数 RandomHorizontalFlip(p=0.5)：在概率\
    \ p 下将输入图像进行水平翻转，p=0.5 是默认值，也可以指定其他值。\n- 随机垂直翻转函数 RandomVerticalFlip(p=0.5)：在概率\
    \ p 下将输入图像进行垂直翻转，p=0.5 是默认值，也可以指定其他值。\n- 仿射变换函数 RandomAffine（degrees，translate\
    \ = None，scale = None，shear = None）：对输入图像进行仿射变换，参数 degrees 指定旋转角度，translate 设置平移区间，scale\
    \ 设置缩放比例，shear 设置错切角度。\n\n若要了解更多关于图像数据增强函数及其参数的细节，请查阅 PyTorch 文档，详细情况请参见 https://pytorch.org/vision/stable/transforms.html。\n\
    \n下面给出对图像进行颜色变换数据增强的 PyTorch 示例代码：\n\n```\n# 导入需要的库\nimport torchvision.transforms\
    \ as transforms\nfrom PIL import Image\n# 构造数据增强操作\ndata_aug = transforms.Compose([\n\
    \    transforms.ColorJitter (brightness=[0.5, 0.9], contrast=[0.8, 1], saturation=[0.6,\
    \ 0.9], hue=0.3)\n])\n# 读取输入图像\norig_img = Image.open(\"PATH/OF/IMAGE\")\n# 执行数据增强\n\
    aug_img = data_aug(orig_img)\n```\n\n图 7-8 给出了一个图像数据增强的示例。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_217_0.png)\n\
    \n图 7-8 图像数据增强示例（详见彩插）\n\n除此之外，GitHub 上有一个图像数据增强的开源实现，参见 https://github.com/aleju/imgaug。但需要指出的是，对图像进行数据增强也需要视情况而定，如在人脸检测任务中，则不太适合对数据进行垂直翻转；在手写数字识别任务中，为了区别\
    \ 6 和 9，也不适合对数据进行垂直翻转以及旋转过大的角度。\n\n## 7.4 Bagging\n\nBagging ( Bootstrap Aggregating\
    \ ) 是一种常见的集成学习方法，它的主要思想是：首先在原始数据集中采样不同的子数据集，然后基于这些子数据集分别训练多个不同的模型，最后将测试样本输入所有模型，将得到的多个结果进行平均或者投票得到测试样本的最终输出，如图\
    \ 7-9 所示。通过 Bagging 方法，可以降低泛化误差，因此也是一种常见的正则化方法，在深度学习中也经常用到。\n\nBagging 一般基于自助采样法（\
    \ Bootstrap Sampling ）进行数据采样。给定包含 m 个样本的初始数据集 D，我们进行 m 次放回采样，这样我们会得到包含 m 个样本的采样数据集\
    \ D1，以同样的采样方法，可以得到数据集 D2, D3, ..., Dk，如图 7-9 所示。可以发现，通过自助采样法获得的数据集中会缺少一些来自原始数据集中的样本，同时也会包含一些被多次选中、重复的样本，这就使得每次采样获得的数据集之间存在差异。\n\
    \n在获得多个采样数据集后，就可以在每个数据集上训练得到 k 个模型，每个采样数据集之间所含样本的差异会导致 k 个模型之间也存在差异，因此在测试集上产生的误差也不相同，而这也是\
    \ Bagging 方法能够起作用的原因。\n\n参考 Ian Goodfellow 等人在文献 [2] 中对 Bagging 方法的分析，假设训练所得的第\
    \ i 个子模型在每个样本上的误差是 εi，并且 εi 服从均值为零、方差为 E[εi^2] = v 且协方差为 E[εi, εj] = c 的多维正态分布，所有子模型的平均预测误差是\
    \ (Σi, εi) / k，可求得平方误差的期望如下：\n"
  mdcn: "\n## 正则化与优化\n\n正则化（Regularization）的概念最早来自线性几何，是指对平面不可约代数曲线以某种形式的全纯参数进行表示的方法。而机器学习中的正则化方法可分为两类：狭义正则化和广义正则化。狭义正则化是指通过在模型的损失函数中增加惩罚项来增强模型泛化能力的方法，广义正则化是指可以减小模型过拟合并使得泛化误差显著降低的所有方法。本章讲述的深度学习中的正则化指的是广义正则化，主要包括参数范数正则化、数据增强、Bagging、提前终止、Dropout\
    \ 和归一化等。\n\n优化（Optimization）是指在给定约束的情况下求解目标函数的最大值或最小值，并将其视为解决问题的最佳方案。在深度学习中，深度神经网络的结构复杂、参数多，普遍存在梯度消失或梯度爆炸问题，优化起来非常困难，进而很难找到全局最优解。因此，深度学习算法需要选用合适的优化算法，才能使目标函数收敛。本章讲述的深度学习中的优化算法主要包括常见的梯度下降法和基于动量的方法。\n\
    \n深度学习模型的泛化性能非常重要，这意味着即使通过优化算法找到了训练集的近似最优解，仍然可能在测试集上得到很差的结果，即产生了过拟合。因此，在深度学习中，需要结合使用正则化与优化。\n\
    \n## 7.1 深度学习模型的训练与测试\n\n### 7.1.1 深度学习中的数据集划分\n\n在传统的机器学习中，数据集一般划分为训练集和测试集，训练集是用于训练模型的数据样本，测试集是用来评估模型泛化能力的数据样本，但不能作为调参、特征选择等操作的依据。在深度学习中，往往从训练集中划分出一部分数据样本作为验证集，它可以看作在模型训练过程中单独留出的样本，可用于调整模型的超参数和对模型的能力进行初步的评估。机器学习与深度学习中的数据集划分情况如图\
    \ 7-1 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_210_0.png)\n\n图 7-1 机器学习与深度学习中的数据集划分\n\
    \n当然，深度学习中也可以采用传统机器学习中的交叉验证法、自助法进行数据集划分，在此不再赘述。\n\n### 7.1.2 过拟合与欠拟合\n\n与机器学习一样，深度学习中的过拟合（Over-fitting）是指深度学习模型能很好地拟合训练集样本，而无法很好地拟合测试集样本的现象，从而导致深度学习模型的泛化性能下降。为防止“过拟合”，可以选择减少模型参数、降低模型复杂度和正则化等。\n\
    \n深度学习的欠拟合（Under-fitting）是指深度学习模型还没有很好地训练出数据的一般规律，模型拟合程度不高的现象。为防止“欠拟合”，可以选择增加模型参数、增加迭代深度、换用更加复杂的模型等。\n\
    \n欠拟合、合适拟合（Appropriate-fitting）和过拟合现象的示例如图 7-2 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_210_1.png)\n\
    \n图 7-2 欠拟合、合适拟合与过拟合现象\n\n### 7.1.3 偏差、方差、噪声与泛化误差\n\n首先，给定数据集 D，其中 D_train 是训练集，D_test\
    \ 是测试集。训练集 D_train 中的输入样本集合为 \\(X_{train} = \\{x_i | (i=1,2,\\cdots,n)\\}\\)，对应的真实值集合为\
    \ \\(Y_{train} = \\{y_i | (i=1,2,\\cdots,n)\\}\\)，对应的标签值集合为 \\(L_{train} = \\\
    {l_i | (i=1,2,\\cdots,n)\\}\\)；测试集 \\(D_{test}\\) 中的输入样本集合为 \\(X_{test} = \\{x_j\
    \ | (j=1,2,\\cdots,m)\\}\\)，对应的真实值集合为 \\(Y_{test} = \\{y_j | (j=1,2,\\cdots,m)\\\
    }\\)，对应的标签值集合为 \\(L_{test} = \\{l_j | (j=1,2,\\cdots,m)\\}\\)。假定基于现有的训练集 \\(D_{train}\\\
    )，通过留出法获得样本数量相同的训练集 \\(D_k | (k=1,2,\\cdots,K)\\)，\\(f_k(x; D_k)\\) 表示在第 \\(k\\\
    ) 个训练集 \\(D_k\\) 上学习得到的模型。\n\n#### 1. 偏差\n\n不管是在传统机器学习还是深度学习中，偏差（Bias）度量训练所得模型的预估值和真实值的偏离程度，刻画了算法本身的拟合能力。\n\
    \n用 \\((\\hat{y}_j)_k = f_k(x_j; D_k)\\) 表示在第 \\(k\\) 个训练集 \\(D_k\\) 上训练所得的模型对测试样本\
    \ \\(x_j\\) 的预估值输出，用 \\(\\bar{y}_j\\) 表示在 \\(K\\) 个训练集上训练所得的 \\(K\\) 个模型对测试样本\
    \ \\(x_j (j=1,2,\\cdots,m)\\) 的预估值输出 \\((\\hat{y}_j)_k (k=1,2,\\cdots,K)\\) 的期望，计算公式如下：\n\
    \n\\(\\bar{y}_j = E[(\\hat{y}_j)_k] = E[f_k(x_j; D_k)], \\quad k=1,2,\\cdots,K\\\
    )\n\n那么样本 \\(x_j\\) 的偏差计算公式如下：\n\n\\(bias^2(x_j) = (y_j - \\bar{y}_j)^2\\)\n\n\
    偏差的计算过程如图 7-3 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_211_0.png)\n\n图\
    \ 7-3 偏差计算示意图\n\n#### 2. 方差\n\n方差（Variance）度量样本数量相同，但样本存在差异的不同训练集所导致的算法性能的变化，刻画了数据扰动对算法的影响。\n\
    \n同样，用 \\((\\hat{y}_j)_k = f_k(x_j; D_k)\\) 表示在第 \\(k\\) 个训练集 \\(D_k\\) 上训练所得的模型对测试样本\
    \ \\(x_j\\) 的预估值输出，用 \\(\\bar{y}_j\\) 表示在 \\(K\\) 个训练集上训练所得的 \\(K\\) 个模型对测试样本\
    \ \\(x_j (j=1,2,\\cdots,m)\\) 的预估值输出 \\((\\hat{y}_j)_k (k=1,2,\\cdots,K)\\) 的期望，计算公式如下：\n\
    \n\\(\\bar{y}_j = E[(\\hat{y}_j)_k] = E[f_k(x_j; D_k)], \\quad k=1,2,\\cdots,K\\\
    )\n\n那么样本 \\(x_j\\) 的方差计算如下：\n\n\\(Var(x_j) = E[((\\hat{y}_j)_k - \\bar{y}_j)^2],\
    \ \\quad k=1,2,\\cdots,K\\)\n\n方差的计算过程如图 7-4 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_212_0.png)\n\
    \n#### 3. 噪声\n\n噪声（Noise）度量样本真实值与标签值的偏离程度，刻画了学习问题本身的难度。$y_j (j=1, 2, \\cdots,\
    \ m)$ 表示真实值，$l_j (j=1, 2, \\cdots, m)$ 表示标签值。\n\n单个样本 $x_j$ 的噪声计算公式如下：\n\n$\\\
    varepsilon^2 = (l_j - y_j)^2$ (7-5)\n\n多个样本的噪声计算公式如下：\n\n$\\bar{\\varepsilon}^2\
    \ = E[\\{(l_j - y_j)^2\\}] , j=1, 2, \\cdots, m$ (7-6)\n\n噪声的计算过程如图 7-5 所示。\n\n\
    ![](img/57b180d92f84b0150a5b5e4fc7583b76_212_1.png)\n\n#### 4. 泛化误差\n\n泛化误差（Generalization\
    \ Error）度量基于训练所得模型得到的预估值和标签值的偏离程度。\n\n同样，用 \\((\\hat{y}_j)_k=f_k(x_j;D_k)\\) 表示在第\
    \ \\(k\\) 个训练集 \\(D_k\\) 上训练所得的模型对测试样本 \\(x_j\\) 的预估值输出，泛化误差的计算公式如下：\n\nGenError(x_j)\
    \ = E[((\\hat{y}_j)_k - l_j)^2], \\quad k=1, 2, \\cdots, K\n\n泛化误差的计算过程如图 7-6\
    \ 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_213_0.png)\n\n图 7-6 泛化误差计算示意图\n\
    \n接下来观察偏差、方差、泛化误差和噪声之间的关系。为方便表示，以下公式不再使用下标指明具体的值。使用 \\(y\\) 表示样本的真实值，\\(l\\) 表示标签值，\\\
    (\\hat{y}\\) 表示模型对新样本的预估值，\\(\\bar{y}\\) 表示在多个训练集上训练所得的模型对新样本预测值的期望。参考文献 [1]，可以推导出泛化误差等于偏差、方差和噪声之和，推导过程如下：\n\
    \nGenError(x)\n= E[(\\hat{y}-l)^2]\n= E[(\\hat{y}-\\bar{y}+\\bar{y}-l)^2]\n= E[(\\\
    hat{y}-\\bar{y})^2]+E[(\\bar{y}-l)^2]+E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n= E[(\\\
    hat{y}-\\bar{y})^2]+E[(\\bar{y}-y+y-l)^2]+E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n\
    = E[(\\hat{y}-\\bar{y})^2]+E[(\\bar{y}-y)^2]+E[(y-l)^2]+E[2(\\hat{y}-\\bar{y})(\\\
    bar{y}-l)]+E[2(\\bar{y}-y)(y-l)]\n\n下面，证明 \\(E[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\\\
    ) 等于 0。\n\nE[2(\\hat{y}-\\bar{y})(\\bar{y}-l)]\n= 2(E[(\\hat{y}-\\bar{y})] E[(\\\
    bar{y}-l)])\n= 2(E[\\hat{y}]-E[\\bar{y}]) E[(\\bar{y}-l)]) //根据公式(7-1)可得 \\(\\\
    bar{y}=E[\\hat{y}]\\)\n= 0\n\n假定噪声的期望 \\( E[(y-l)]=0 \\)，那么\n\n\\(\\begin{aligned}\
    \ & E[2(\\bar{y}-y)(y-l)] \\\\ = & 2E[(\\bar{y}-y)]E[(y-l)] \\\\ = & 0 \\end{aligned}\\\
    ) (7-10)\n\n由此可以得出泛化误差、偏差、方差和噪声之间的关系，如下所示：\n\n\\(\\underbrace{GenError(x)}_{泛化误差}\
    \ = \\underbrace{E[(\\hat{y}-\\bar{y})^2]}_{方差 Var} + \\underbrace{E[(\\bar{y}-y)^2]}_{偏差\
    \ bias} + \\underbrace{E[(y-l)^2]}_{噪声 \\epsilon^2}\\) (7-11)\n\n### 7.1.4 深度学习模型的训练与测试过程\n\
    \n在训练深度学习模型时，一般先设计一个神经网络结构，在训练集上进行训练，在迭代一定的轮数（Epoch）后计算偏差。如果偏差较大，继续进行迭代，如果偏差仍然没有大幅度减小，就需要设计更复杂的神经网络结构（增加每层神经元的数量、增加神经网络的层数等）后再进行训练，直到偏差减小到既定的阈值之内。之后，在验证集上计算训练好的模型的方差，如果方差比较高，说明出现了过拟合现象，就要采取一些措施来降低方差，如增加数据量重新训练、采用一些正则化方法、减少网络参数和降低模型复杂度等，直到方差减小到既定的阈值之内。最后，在测试集上进行模型测试，一般情况下，泛化误差都能满足要求，如果出现泛化误差比较大的情况，根据泛化误差计算公式（7-11），在偏差与方差都比较小的情况下，一般是由数据中含有较多的噪声造成的，这就需要提前对数据进行降噪处理。深度学习模型的训练与测试流程如图\
    \ 7-7 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_214_0.png)\n\n图 7-7 深度学习的训练与测试过程\n\
    \n## 7.2 参数范数正则化\n\n参数范数正则化方法早在深度学习出现之前就已经在使用了。参数范数正则化方法可以简单地在损失函数 L 后添加一个参数范数正则化项\
    \ \\( \\Omega(\\theta) \\)，来限制模型的学习能力，正则化后的损失函数可表示为\n\n\\(\\tilde{L}(\\theta;\
    \ x, y) = L(\\theta; x, y) + \\alpha \\Omega(\\theta)\\) (7-12)\n\n其中，\\( \\alpha\
    \ \\) 是正则项系数，它是一个超参，用来控制惩罚项 \\( \\Omega \\) 对损失函数的惩罚大小。\n\n当最小化正则化后的损失函数时，它会同时降低原有损失函数\
    \ $L$ 和正则化项 $\\Omega(\\theta)$ 的值，即在保证获得小误差的同时减少参数规模，一定程度上减少了过拟合的程度。对于参数范数正则化项，可以选择不同的范数形式，得到不同的优先解。\n\
    \n参数范数正则化中最常见的就是 L1 正则化与 L2 正则化，下面将分别介绍两种参数正则化方法。在介绍之前，先假设 $w$ 为需要正则化的参数，$\\theta$\
    \ 为全体参数，它包括需要正则化的参数 $w$ 与不需要正则化的参数。\n\n### 7.2.1 L1 参数正则化\n\nL1 参数正则化在损失函数中添加一个正则化项：\n\
    \n\\(\\Omega(\\theta) = \\|w\\|_1\\) (7-13)\n\nL1 正则化项就是各个参数的绝对值之和。L1 参数正则化也称为\
    \ Lasso 回归（Lasso Regression）。\n\n由此，加上 L1 正则化项的损失函数变为\n\n\\(\\tilde{L}(w; x, y)\
    \ = L(w; x, y) + \\alpha \\|w\\|_1\\) (7-14)\n\n### 7.2.2 L2 正则化\n\nL2 正则化是在损失函数中添加一个正则化项：\n\
    \n\\(\\Omega(\\theta) = \\frac{1}{2} \\|w\\|_2^2\\) (7-15)\n\nL2 正则化项就是各个参数的平方和再开方。L2\
    \ 正则化也称为岭回归（Ridge Regression），它可以看作是将模型的参数加上了一个较强的先验，并假设参数不会太大。\n\n由此，加上 L2 正则化项的损失函数变为\n\
    \n\\(\\tilde{L}(w; x, y) = L(w; x, y) + \\frac{\\alpha}{2} \\|w\\|_2^2\\) (7-16)\n\
    \n## 7.3 数据增强\n\n深度学习的快速发展离不开大规模数据集的出现，但并不是所有任务都有足够的训练数据，如果不对已有数据进行扩充来进行模型训练，极有可能使得模型陷入过拟合中。数据增强（Data\
    \ Augmentation）可以简单地理解为对训练数据数量的扩充，利用已有的有限数据产生更多的有效数据。因此，在数据集数据量有限时，进行数据增强就显得很有必要，一方面可以尽可能地避免过拟合；另一方面随着训练数据的增多，也会在一定程度上提高模型的泛化性。本书主要介绍图像数据增强的常用方法。\n\
    \n图像数据增强主要有两种常见的方法：空间变换和像素颜色变换。空间变换是最常见也是最直观的图像增强手段之一，如对图像进行随机翻转、旋转、平移和裁剪等操作，在进行数据增强操作时，可以同时进行多种操作。像素颜色变换更多的是对图像像素值进行修改，如在原始图像上进行对比度扰动、饱和度扰动、颜色变换与噪声扰动等操作。可以利用OpenCV、PIL\
    \ 等图像处理库进行数据增强，同时在常用的深度学习框架（如 TensorFlow、PyTorch 和飞桨）中，都有相应的图像增强函数可供直接调用。\n\n\
    PyTorch 框架中与图像数据增强相关的函数位于 torchvision.transforms 中，主要包括如下几种。\n\n- 颜色变换函数 ColorJitter(brightness=0,\
    \ contrast=0, saturation=0, hue=0)：可以对输入图像的亮度（brightness）、对比度（contrast）、饱和度（saturation）和色调（hue）进行随机变换。\n\
    - 灰度变换函数 Grayscale(num_output_channels=1)：直接将输入图像转换为灰度图像，channels=1 是默认值，也可以指定其他值。\n\
    - 灰度变换函数 RandomGrayscale（p=0.1）：在概率 p 下将输入图像转换为灰度图像，p=0.1 是默认值，也可以指定其他值。\n- 随机旋转变换函数\
    \ RandomRotation（degrees）：参数 degrees 用于指定可以旋转的度数范围。\n- 随机水平翻转函数 RandomHorizontalFlip(p=0.5)：在概率\
    \ p 下将输入图像进行水平翻转，p=0.5 是默认值，也可以指定其他值。\n- 随机垂直翻转函数 RandomVerticalFlip(p=0.5)：在概率\
    \ p 下将输入图像进行垂直翻转，p=0.5 是默认值，也可以指定其他值。\n- 仿射变换函数 RandomAffine（degrees，translate\
    \ = None，scale = None，shear = None）：对输入图像进行仿射变换，参数 degrees 指定旋转角度，translate 设置平移区间，scale\
    \ 设置缩放比例，shear 设置错切角度。\n\n若要了解更多关于图像数据增强函数及其参数的细节，请查阅 PyTorch 文档，详细情况请参见 https://pytorch.org/vision/stable/transforms.html。\n\
    \n下面给出对图像进行颜色变换数据增强的 PyTorch 示例代码：\n\n```\n# 导入需要的库\nimport torchvision.transforms\
    \ as transforms\nfrom PIL import Image\n# 构造数据增强操作\ndata_aug = transforms.Compose([\n\
    \    transforms.ColorJitter (brightness=[0.5, 0.9], contrast=[0.8, 1], saturation=[0.6,\
    \ 0.9], hue=0.3)\n])\n# 读取输入图像\norig_img = Image.open(\"PATH/OF/IMAGE\")\n# 执行数据增强\n\
    aug_img = data_aug(orig_img)\n```\n\n图 7-8 给出了一个图像数据增强的示例。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_217_0.png)\n\
    \n图 7-8 图像数据增强示例（详见彩插）\n\n除此之外，GitHub 上有一个图像数据增强的开源实现，参见 https://github.com/aleju/imgaug。但需要指出的是，对图像进行数据增强也需要视情况而定，如在人脸检测任务中，则不太适合对数据进行垂直翻转；在手写数字识别任务中，为了区别\
    \ 6 和 9，也不适合对数据进行垂直翻转以及旋转过大的角度。\n\n## 7.4 Bagging\n\nBagging ( Bootstrap Aggregating\
    \ ) 是一种常见的集成学习方法，它的主要思想是：首先在原始数据集中采样不同的子数据集，然后基于这些子数据集分别训练多个不同的模型，最后将测试样本输入所有模型，将得到的多个结果进行平均或者投票得到测试样本的最终输出，如图\
    \ 7-9 所示。通过 Bagging 方法，可以降低泛化误差，因此也是一种常见的正则化方法，在深度学习中也经常用到。\n\nBagging 一般基于自助采样法（\
    \ Bootstrap Sampling ）进行数据采样。给定包含 m 个样本的初始数据集 D，我们进行 m 次放回采样，这样我们会得到包含 m 个样本的采样数据集\
    \ D1，以同样的采样方法，可以得到数据集 D2, D3, ..., Dk，如图 7-9 所示。可以发现，通过自助采样法获得的数据集中会缺少一些来自原始数据集中的样本，同时也会包含一些被多次选中、重复的样本，这就使得每次采样获得的数据集之间存在差异。\n\
    \n在获得多个采样数据集后，就可以在每个数据集上训练得到 k 个模型，每个采样数据集之间所含样本的差异会导致 k 个模型之间也存在差异，因此在测试集上产生的误差也不相同，而这也是\
    \ Bagging 方法能够起作用的原因。\n\n参考 Ian Goodfellow 等人在文献 [2] 中对 Bagging 方法的分析，假设训练所得的第\
    \ i 个子模型在每个样本上的误差是 εi，并且 εi 服从均值为零、方差为 E[εi^2] = v 且协方差为 E[εi, εj] = c 的多维正态分布，所有子模型的平均预测误差是\
    \ (Σi, εi) / k，可求得平方误差的期望如下：\n"
