    \ 数据集官方下载地址：http://yann.lecun.com/exdb/mnist/。\n- 2. 请基于 Smithsonian Butterflies\
    \ 数据集子集，使用扩散模型实现图像生成，并与 DCGAN 模型进行性能对比。要求能够完成数据读取、网络设计、网络构建、模型训练和模型推理等过程。Smithsonian\
