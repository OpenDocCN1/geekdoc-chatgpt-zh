    层神经元不一定每次都在一个网络中出现。这样权值的更新不再依赖于有固定关系的隐藏层神经元的共同作用，阻止了某些特征仅在其他特定特征存在时才有效果的情况，迫使网络去学习更加鲁棒的特征。


    # 7.7 归一化


    由于数据样本的不同特征之间的量纲或量纲单位不同，变化区间也处于不同数量级，使用原始数据训练机器学习或深度学习模型，不同特征对模型的影响会不同，这也导致训练所得的模型缺乏鲁棒性。归一化（Normalization）是一种常见的数据预处理方法，它将数据映射成
    [0,1] 或者 [-1,1] 之间的小数，使得最优解的寻优过程明显变得平缓，更容易收敛到最优解，这对训练更加鲁棒的机器学习或深度学习模型是非常必要的。因此，在构造机器学习或深度学习模型之前，需要将数据做归一化处理，使特征具有相同的度量尺度，这样不仅会加快求解的速度，还有可能提高模型的精度。


    # 7.7.1 机器学习中的归一化


    # 1. 最大最小归一化


    给定样本集合 \(X = |x_i|, i=1, \cdots, n, x^{\min}\) 为样本的最小值，\(x^{\max}\) 为样本的最大值。


    最大最小归一化（Max-min Normalization）将数据归一化到 [0,1] 之间，计算公式如下：


    \(x_i^{minmax} = \frac{x_i - x^{\min}}{x^{\max} - x^{\min}}\) (7-24)


    最大最小归一化可以很好地将数据归一化到 [0,1] 之间，使数据具有相同的度量尺度。但是这种归一化方法容易受到离群点数据的影响，因为公式的分母是最大值与最小值的差，如果存在一个离群点数据的值过大或者过小，都会导致分母很大，这使得归一化后的数据失去意义。另外，最大最小归一化后的数据值都为正数，这导致机器学习模型的参数只能同时增大或同时减小，参数的更新路线可能不是最优路线。因此，一般不使用最大最小归一化进行数据预处理。


    # 2. 标准归一化（均值方差归一化）


    标准归一化（Standard Normalization）会考虑所有样本数据，因此受离群点数据的影响要小一些，尤其在样本足够多的情况下表现比较稳定。


    给定样本集合 \(X = |x_i|, i=1, \cdots, n\)，\(E(X)\) 为样本均值，Var(\(X\)) 为样本方差，标准归一化的计算公式如下：


    \(x_i^{stand} = \frac{x_i - E(X)}{\sqrt{\text{Var}(X)}}\) (7-25)


    其中


    \(E(X) = \frac{1}{n} \sum_{i=1}^n x_i\) (7-26)'
  - '[PAGE 223]


    \(\text{Var}(X)=\frac{1}{n} \sum_{i=1}^n(x_i-E(X))^2\) (7-27)


    标准归一化的分子为均值归一化，这样得到的样本值有正有负，可以让不同的参数朝着不同方向调整直至到达最优解，减少迭代次数，使得更新尽可能沿着最优路径进行。标准归一化的分母用到了方差，方差衡量的是数据的离散程度，因此可以减小离群点数据的影响。


    # 7.7.2 深度学习中的归一化


    # 1. 批归一化


    在神经网络训练过程中，通常将数据按批（Batch）输入，由于每批数据的分布并不相同，使模型训练起来比较困难。并且在训练深层神经网络时，激活函数会改变各层数据的分布和量级，随着神经网络的加深，这种改变会越来越大，从而导致模型不够稳定、不容易收敛，甚至可能出现梯度消失的问题。这些存在的问题可以通过批归一化（Batch
    Normalization，BN）[4] 来解决。


    神经网络中传递的张量数据一般有 4 个维度，记为 \((N, H, W, C)\)，其中 \(N\) 表示批大小，\(W\)、\(H\) 分别表示特征图的宽和高，\(C\)
    表示通道数量，\(N, H, W, C \in \mathbb{N}\)。批归一化的主要思想是让一个批次内的所有数据在某个通道维度上的均值为 0，方差为 1，即在
    \(N\)、\(H\)、\(W\) 维度上做归一化。这样不仅可以使数据分布一致，而且可以避免梯度消失的发生。


    给定一个批大小为 \(N\) 的样本集合 \(X \in \mathbb{R}^{N \times H \times W \times C}\) 作为输入，\(E_c[X]\)
    为样本沿着通道方向计算得到的均值，\(\text{Var}_c[X]\) 为样本沿着通道方向计算得到的方差，\(\epsilon\) 是一个很小的数，防止分母为零，\(\gamma
    \in \mathbb{R}^C\) 为可学习放缩（Scale）变量，初始值通常设置为 1，\(\beta \in \mathbb{R}^C\) 为可学习平移（Shift）变量，初始值通常设置为
    0。批归一化的计算公式如下：


    \(E_c[X]=\frac{1}{N \times H \times W} \sum_{n=1}^N \sum_{h=1}^H \sum_{w=1}^W
    X_{n, h, w}\) (7-28)


    \(\text{Var}_c[X]=\frac{1}{N \times H \times W} \sum_{n=1}^N \sum_{h=1}^H \sum_{w=1}^W
    (X_{n, h, w} - E_c[X])^2\) (7-29)


    \(Y_{n, h, w}=\frac{X_{n, h, w} - E_c[X]}{\sqrt{\text{Var}_c[X] + \epsilon}} \times
    \gamma + \beta\) (7-30)


    批归一化使网络中每层输入数据的分布相对稳定，可以减少训练过程中的梯度消失和梯度爆炸问题，有助于更好地传播梯度并提高模型的稳定性，也使得神经网络更快地收敛到最优解，加速了训练过程。同时，它使模型对输入数据中的一些变化和扰动具有更好的鲁棒性，提高了模型的泛化能力。


    但是批归一化受到批大小影响较大。如果批大小过小，计算的均值和方差不足以代表整个样本数据的分布，批归一化的效果可能会下降；如果批大小过大，会超过内存容量，无法处理。并且批归一化并不适合所有神经网络，如循环神经网络等动态网络，使用批归一化的效果并不好。'
  - '[PAGE 224]


    # ## 2. 层归一化


    在自然语言处理任务中，不同样本的长度往往是不同的，而批归一化基于批对数据进行归一化，很难满足需求。为了解决这一问题，通常使用层归一化（Layer Normalization，LN）[5]方法。


    层归一化是指让一个数据样本在所有通道上的均值为 0，方差为 1，即在 H、W、C 维度上做归一化。层归一化不需要批训练，在单条数据内部就能归一化。因此可以在循环神经网络等动态网络中使用。


    给定一个批大小为 N 的样本集合 \( X \in \mathbb{R}^{N \times H \times W \times C} \) 作为输入，\(
    E_n[X] \) 是沿着批方向计算得到的均值，\( \text{Var}_n[X] \) 是沿着批方向计算得到的方差，\( \epsilon \) 是一个很小的数，防止分母为零，\(
    \gamma \in \mathbb{R}^C \) 为可学习放缩变量，初始值通常设置为 1，\( \beta \in \mathbb{R}^C \) 为可学习平移变量，初始值通常设置为
    0。层归一化的计算公式如下：


    ```

    \( E_n[X] = \frac{1}{H \times W \times C} \sum_{h=1}^H \sum_{w=1}^W \sum_{c=1}^C
    X_{h,w,c} \quad (7-31) \)

    ```


    ```

    \( \text{Var}_n[X] = \frac{1}{H \times W \times C} \sum_{h=1}^H \sum_{w=1}^W \sum_{c=1}^C
    (X_{h,w,c} - E_n[X])^2 \quad (7-32) \)

    ```


    ```

    \( Y_{n,h,w,c} = \frac{X_{h,w,c} - E_n[X]}{\sqrt{\text{Var}_n[X] + \epsilon}}
    \quad (7-33) \)

    ```


    ```

    \( Z_{n,h,w,c} = Y_{n,h,w,c} \times \gamma + \beta \quad (7-34) \)

    ```


    层归一化的最大优点是不依赖于小批量数据的大小，因此可以在训练和推理过程中使用不同的批大小，甚至可以在单个样本上应用，另外它也不需要保存批的均值和方差，节省了存储空间。此外，层归一化适用于循环神经网络。但是，层归一化在批大小比较大时没有批归一化效果好。


    # ## 3. 实例归一化


    在图像风格变换任务中，生成图像的风格主要依赖于某个图像实例，因而实例归一化（Instance Normalization）[6] 提出只对 H、W 维度进行归一化，即只让一个单独数据在
    H 和 W 维度上求均值和方差。


    给定一个批大小为 N 的样本集合 \( X \in \mathbb{R}^{N \times H \times W \times C} \) 作为输入，\(
    E_{nc}[X] \) 是沿着批方向和通道方向计算得到的均值，\( \text{Var}_{nc}[X] \) 是沿着批方向和通道方向计算得到的方差，\(
    \epsilon \) 是一个很小的数，防止分母为零，\( \gamma \in \mathbb{R}^C \) 为可学习放缩变量，初始值通常设置为 1，\(
    \beta \in \mathbb{R}^C \) 为可学习平移变量，初始值通常设置为 0。实例归一化的计算公式如下：


    ```

    \( E_{nc}[X] = \frac{1}{H \times W} \sum_{h=1}^H \sum_{w=1}^W X_{h,w} \quad (7-35)
    \)

    ```


    ```

    \( \text{Var}_{nc}[X] = \frac{1}{H \times W} \sum_{h=1}^H \sum_{w=1}^W (X_{h,w}
    - E_{nc}[X])^2 \quad (7-36) \)

    ```'
