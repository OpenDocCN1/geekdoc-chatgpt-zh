    GoogleNet 的第 2 版[7]、第 3 版[8] 和第 4 版[9] 对第 1 版进行了改进，进一步减小了在 ImageNet 物体识别挑战赛数据集上的分类错误率。GoogleNet
    第 2 版主要是针对深度神经网络训练过程中存在的内部协变量偏移（Internal Covariate Shift，ICS）问题（是指如果训练数据在经过深度神经网络的每一层后其分布发生了变化，就可能降低整个网络的优化效率），提出使用批归一化（Batch
