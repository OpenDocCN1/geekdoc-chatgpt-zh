    序列到序列模型来重建原始文本。BART 这样的预训练方式有一个关键的优势是它有灵活的噪声，可以将任意的变换应用于原始文本。BART 在面向文本生成任务微调时特别有效，在此基础上，BART
    提出了一种新颖的机器翻译模型，其中 BART 模型堆叠在几个额外的 Transformer 层之上。


    不同于 GPT，BART 将激活函数修改为 GeLU。BART 的基本模型（Base Model）包含 6 层编码器和解码器，大模型（Large Model）包含
    12 层编码器和解码器。BART 通过破坏原始文档然后进行重建来训练，与现有针对特定噪声方案量身定制的去噪自编码器不同的是，BART 允许使用任何类型的文档破坏方式。具体地，BART
    提出了以下几种加入噪声的方式。


    +   1) 单词掩码（Token Masking）：选择随机单词并替换成 [MASK] 标记。

    +   2) 单词删除（Token Deletion）：从输入中随机删除单词。

    +   3) 文本填充（Text Infilling）：对一些文本跨度进行采样，跨度长度来自泊松分布，每个跨度被一个 [MASK] 标记取代。

    +   4) 句子排列（Sentence Permutation）：将输入序列按照完整的停止符划分成句子后，随机重排序。

    +   5) 文件旋转（Document Rotation）：一个标记被均匀地随机选择，从该标记开始的文件被旋转。


    图 4-26 展示了用于机器翻译的 BART 整体框架。BART 将编码器嵌入层替换为一个新的随机初始化编码器，它训练新的编码器将外来的词映射到 BART
    对噪声具有鲁棒性的输入中。新的编码器可以使用与原始 BART 独立的词汇表。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_141_0.png)


    接下来，使用两个步骤训练源编码器：1) 冻结大部分的 BART 参数，只更新随机初始化源编码器、BART 位置嵌入向量和 BART 编码器第 1 层自注意力机制的输入投影矩阵；2)
    使用少量迭代训练所有模型参数。


    实验证明 BART 在 WMT 罗马尼亚亚语到英语的基准测试中，比反向机器翻译系统提升了 1.1 BLEU 得分，极大地提高了机器翻译系统的性能。


    # 2. 自动文本摘要（BERTSUM 模型）


    Yang Liu 等人提出了将 BERT 应用于文本摘要生成的方法，并且为抽取式和生成式模型提出了一个通用的模型框架 BERTSum[18]，如图 4-27
    所示。在 BERT 的基础上，BERTSum 提出了一个新颖的文档级别的编码器，用来获取文档中句子的语义表示。BERTSum 在文档级别编码器的基础上，在其顶层增加了句子级别的
    Transformer 层。同时，BERTSum 使用了一种新颖的微调方案，对编码器和解码器采用不同的优化器，以缓解二者之间的不平衡问题。'
