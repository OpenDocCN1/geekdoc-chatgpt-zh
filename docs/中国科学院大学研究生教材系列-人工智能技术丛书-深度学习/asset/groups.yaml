    条件熵用来衡量在已知随机变量 X 的条件下，随机变量 Y 的不确定性。熵、联合熵、条件熵之间存在以下关系：


    H(Y \mid X) = H(X, Y) - H(X) （A-53）


    相对熵：又称互熵、KL 散度和信息增益，是描述两个概率分布 P 和 Q 差异的一种方法，记为 D(P \| Q)。在信息论中，D(P \| Q) 表示当用概率分布
    Q 来拟合真实分布 P 时，产生的信息损耗，其中 P 表示真实分布，Q 表示 P 的拟合分布。离散随机变量 X 的相对熵定义为


    D(P \| Q) = \sum_{x} p(x) \log \frac{p(x)}{q(x)} （A-54）


    将公式（A-54）展开可得：


    D(P \| Q) = \sum_{x} p(x) \log \frac{p(x)}{q(x)}

    = \sum_{x} p(x) \log p(x) - \sum_{x} p(x) \log q(x)

    = -H(X) + (-\sum_{x} p(x) \log q(x)) （A-55）


    公式（A-55）中的第二项 (-\sum_{x} p(x) \log q(x)) 称为交叉熵，在深度学习中交叉熵经常作为分类任务的损失函数使用。


    互信息：两个随机变量 X, Y 的互信息定义为 X, Y 的联合分布与各自独立分布乘积的相对熵，用 I(X, Y) 表示。互信息可以看成是一个随机变量中包含的关于另一个随机变量的信息量，或者说是已知另一个随机变量
    Y 的条件下，随机变量 X 减少的不确定性，定义为


    I(X, Y) = \sum_{x,y} p(x, y) \log \frac{p(x, y)}{p(x)p(y)} （A-56）


    互信息、熵、条件熵之间存在以下关系：


    H(Y \mid X) = H(Y) - I(X, Y) （A-57）


    或者互信息可以表达为


    I(X, Y) = H(X) + H(Y) - H(X, Y) （A-58）


    最大熵原理：最大熵原理是概率模型学习的一个准则，它认为学习概率模型时，在所有可能的概率分布中，使熵达到最大的模型是最好的模型。通常用约束条件来确定模型的集合，因此最大熵原理也可以表述为在满足约束条件的模型集合中选取熵最大的模型。


