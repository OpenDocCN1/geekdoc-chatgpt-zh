    ## 本章人物： Yann LeCun 教授


    Yann LeCun（1960~），纽约大学教授，美国国家科学院院士，美国国家工程院院士，法国科学院院士，2018 年图灵奖获得者。 Yann LeCun
    教授是纽约大学数据科学中心创始人，并担任 Facebook 人工智能首席科学家。他在卷积神经网络、改进反向传播算法、计算神经学和扩展神经网络应用等领域做出杰出贡献，被誉为“卷积神经网络之父”。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_92_0.png)


    Yann LeCun 教授于 1983 年和 1986 年分别获 ESIEE Paris 的学士学位和巴黎第六大学（Université Paris VI）的计算机科学博士学位，毕业后在
    Geoffrey Hinton 教授的实验室做了一年的博士后，之后加入贝尔实验室，2003 年加入纽约大学。


    Yann LeCun 教授的主要贡献集中在卷积神经网络领域，1998 年他提出的 LeNet-5 是卷积神经网络的基础模型，当时就在一些银行和公司开展了应用，提升了手写数字和手写字母的识别能力。之后出现的典型卷积神经网络，如
    AlexNet、VGGNet、GoogleNet 和 ResNet 等都以 LeNet-5 为基础，从网络深度和宽度上进行了扩展。卷积神经网络的发明使得其在计算机视觉领域各项任务上取得了突破性的成绩。此外，Yann
    LeCun 教授在改进反向传播算法方面也做出较大贡献。


    2013 年，Yann LeCun 与 Yoshua Bengio 共同创办了表示学习领域的国际会议 ICLR（International Conference
    on Learning Representation），至今已举办 11 届，目前该会议已成为人工智能领域的顶级会议之一。


    2021 年 8 月 1 日，Yann LeCun 教授出版图书《科学之路：人，机器与未来》，介绍了自己的学术生涯和研究成果，并对人工智能的未来做出了自己的思考。


    Yann LeCun 教授也多次来中国进行交流，他还有个中文名字“杨立昆”。


    Yann LeCun 教授的个人主页：http://yann.lecun.com/。


    ## 循环神经网络


    卷积神经网络在计算机视觉领域取得了巨大的成功，但是在序列数据建模领域，卷积神经网络并不能提供有效的支持。常见的序列数据包括由字母和词汇序列组成的文本、由音节序列组成的语音、由图像帧序列组成的视频，此外还有气象观测数据、股票数据、房价数据等时态数据。为了处理这些序列数据，出现了循环神经网络（Recurrent
    Neural Network，RNN），后来又出现了一些循环神经网络的变种，很好地支持了序列数据处理。本章将介绍循环神经网络的起源与发展、循环神经网络的典型结构以及训练方式、长短期记忆网络、循环神经网络的其他变种以及循环神经网络的典型应用。


