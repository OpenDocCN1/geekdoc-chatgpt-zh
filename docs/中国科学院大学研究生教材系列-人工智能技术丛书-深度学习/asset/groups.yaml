    它的导数计算过程如下：


    $f''(x) = (-1) \times (1+e^{-x})^{-2} \times e^{-x} \times (-1)$

    $= (1+e^{-x})^{-2} e^{-x}$

    $= \frac{e^{-x}}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}-1}{(1+e^{-x})^2}$

    $= \frac{1+e^{-x}}{(1+e^{-x})^2} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} - \frac{1}{(1+e^{-x})^2}$

    $= \frac{1}{1+e^{-x}} (1 - \frac{1}{1+e^{-x}})$

    $= f(x) (1 - f(x))$ (A-26)


