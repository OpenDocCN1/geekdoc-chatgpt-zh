    ![](img/57b180d92f84b0150a5b5e4fc7583b76_72_0.png)


    # (3) 边框回归


    边框回归的目的是使得预测的边框尽可能与人工标定的边框接近。如图 2-39 所示，$P$ 表示建议边框，$\hat{G}$ 表示预测边框（Predicted），$G$
    表示人工标定边框（Ground Truth）。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_72_1.png)


    在边框回归时，给定 $(P_x, P_y, P_w, P_h)$，$P_x, P_y, P_w, P_h$ 分别表示建议边框的中心点坐标以及宽度与高度，目的就是寻找一种映射
    $f$，使得：


    ```

    (\hat{G}_x, \hat{G}_y, \hat{G}_w, \hat{G}_h)=f(P_x, P_y, P_w, P_h) \quad (2-24)

    (\hat{G}_x, \hat{G}_y, \hat{G}_w, \hat{G}_h) \approx (G_x, G_y, G_w, G_h) \quad
    (2-25)

    ```


    先做平移：$(\Delta x, \Delta y), \Delta x=P_w d_x(P), \Delta y=P_h d_y(P)$，那么：


    ```

    \hat{G}_x=P_w d_x(P)+P_x \quad (2-26)

    \hat{G}_y=P_h d_y(P)+P_y \quad (2-27)

    ```


    再做缩放：$(\Delta_w, \Delta_h), \Delta_w=\exp(d_w(P)), \Delta_h=\exp(d_h(P))$，那么：


    ```

    \hat{G}_w=P_w \exp(d_w(P)) \quad (2-28)

    \hat{G}_h=P_h \exp(d_h(P)) \quad (2-29)

    ```


    那么，真实的偏移量：


    ```

    t_x=(G_x-P_x)/P_w \quad (2-30)

    t_y=(G_y-P_y)/P_h \quad (2-31)

    t_w=\log(G_w/P_w) \quad (2-32)

    t_h=\log(G_h/P_h) \quad (2-33)

    ```


    边框回归的损失函数为


    ```

    \hat{w}_* = \arg \min_{w_*} \sum_i^n (t_* - \hat{w}_*^T \phi_3(P_i''))^2 + \lambda
    \|\hat{w}_*\|^2 \quad (2-34)

    ```'
