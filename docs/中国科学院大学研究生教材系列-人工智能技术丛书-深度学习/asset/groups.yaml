    # 6.6 自编码器及其变种


    # 6.6.1 自编码器


    1986 年，David E. Rumelhart 等人提出了自编码器（AutoEncoder）[8]，它的核心思想是使用编码器（Encoder）对高维数据进行降维并表示为一个隐向量，然后将隐向量通过解码器（Decoder）进行重构，使得原始输入与重构的输入尽可能接近。一个典型的自编码器结构如图
    6-10 所示。其中 x 为输入，\tilde{x} 为输出，z 为隐向量。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_196_0.png)


    在发展的早期，自编码器通常采用一个层数大于或等于三层的前馈神经网络来构建，一般称作前馈自编码器（Feed Forward AutoEncoder，FFA），一个由三层的前馈神经网络组成的自编码器如图
    6-11 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_196_1.png)


    如图 6-11 所示，前馈自编码器将输入 x=(x_1, x_2, \cdots, x_n) 编码为一个新的隐向量 z=(z_1, z_2, \cdots,
    z_m)，其中一般情况下要求 m<n，然后再将 z 解码为与输入 x 无限接近的 \tilde{x}=(\tilde{x}_1, \tilde{x}_2,
    \cdots, \tilde{x}_n)，用 f(\cdot) 和 g(\cdot) 分别表示编码器与解码器的激活函数，w_1、b_1 与 w_2、b_2
    分别是编码器与解码器的权重向量与偏置向量，那么有：


    ```

    z=f(w_1 x+b_1) \qquad (6-24)

    \tilde{x}=g(w_2 z+b_2) \qquad (6-25)

    ```


    由于前馈自编码器是由前馈神经网络组成的，它在训练时也需要使用反向传播算法进行训练，目的是找到合适的 w_1、b_1 与 w_2、b_2。但与传统的前馈神经网络不同的地方在于它采用无监督学习方法进行训练，因此误差函数（损失函数）也不尽相同。前馈自编码器一般采用均方误差损失函数或者交叉熵损失函数。


    均方误差损失函数如下：


    ```

    (L_{AE})_{MSE} = \frac{1}{n} \sum_{i=1}^n |x_i - \tilde{x}_i|^2 \qquad (6-26)

    ```


    交叉熵损失函数如下：'
