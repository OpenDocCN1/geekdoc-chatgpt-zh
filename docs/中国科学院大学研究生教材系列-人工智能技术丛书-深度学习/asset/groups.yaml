    +   2. 请说明什么是深度信念网络，它与 Sigmoid 信念网络、深度玻尔兹曼机有哪些不同？

    +   3. 请说明什么是自编码器，它有哪些主要变种？

    +   4. 请说明什么是深度自编码器，它是如何训练的？

    +   5. 请说明扩散模型的基本原理。


    # 实验题


    +   1. 请基于手写数字识别数据集 MNIST，加入高斯噪声，构建一个去噪自编码器实现手写数字的重构。要求能够完成数据读取、网络设计、网络构建、模型训练和模型推理等过程。MNIST
    数据集官方下载地址：http://yann.lecun.com/exdb/mnist/。


    +   2. 请基于 Smithsonian Butterflies 数据集子集，使用扩散模型实现图像生成，并与 DCGAN 模型进行性能对比。要求能够完成数据读取、网络设计、网络构建、模型训练和模型推理等过程。Smithsonian
    Butterflies 数据集子集下载地址：https://huggingface.co/datasets/huggan/smithsonian_butterflies_subset。


