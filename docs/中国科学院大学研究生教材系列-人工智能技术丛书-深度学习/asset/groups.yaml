    \ 8.4 飞桨\n\n### 8.4.1 飞桨简介\n\n飞桨是百度公司开发的开源深度学习框架[3]，其英文名为 PaddlePaddle，前身是 2013\
    \ 年百度公司自主研发的深度学习平台。在 2016 年 9 月 1 日的百度世界大会上，时任百度首席科学家的吴恩达（Andrew Ng）宣布将 PaddlePaddle\
    \ 对外开源，2019 年正式确定其中文名称为“飞桨”。飞桨的官方网站：https://www.paddlepaddle.org.cn/。Github 主页：https://github.com/PaddlePaddle/Paddle/。\n\
    \n飞桨的底层代码使用 C++ 编写，同时支持 CPU 与 GPU，接口支持 Python 语言，使用方便、开发便捷，支持 Docker 部署与原生包部署。飞桨提供了搭建私有云的全套解决方案，在提供充分的分布式系统支持的同时，在通信方面也进行了很多优化，因此能够很好地实现数据保护和并行计算，使得高吞吐与高性能的深度学习模型开发成为可能。\n\
    \n随着深度学习技术的不断发展，飞桨也在不断地更新和升级，并与多家企业和研究机构开展了合作，共同推进深度学习技术的发展。目前，飞桨已经成为中国深度学习市场应用规模最大的深度学习框架和赋能平台，为国内深度学习技术的发展、创新与应用提供了强大的推动力。\n\
    \n### 8.4.2 飞桨的主要功能\n\n飞桨最显著的优势之一在于它同时拥有面向稠密参数和稀疏参数场景的超大规模深度学习模型并行训练能力，支持多平台、多操作系统，为开发者提供了高兼容性的多端部署能力。飞桨目前版本更新的重点之一就是不断提高其性能和对移动端的支持，从产品化的角度为开发者提供更高效的解决方案。\n\
    \n飞桨同时为用户提供了动态图和静态图两种机制。静态图是先定义模型结构再运行，运行速度快，显存占用低，在业务部署性能方面具有很大的优势；动态图则使得所有操作可以即时得到执行结果，更方便模型的调试。飞桨的装饰器\
    \ @paddle.jit.to_static 支持动态图向静态图的转换，使得测试完成的动态图模型可以快速上线部署。\n\n飞桨在代码实现与编程需求等方面和\
    \ PyTorch 有很多相似之处。飞桨使用张量（Tensor）来表示神经网络中传递的数据，通过 paddle.autograd 实现自动微分机制，张量的反向传播和保存通过该模块下的\
    \ backward() 方法和 saved_tensors_hooks() 方法来实现。\n\npaddle.nn 模块中包含了飞桨支持的所有神经网络层和相关函数的\
    \ API，神经网络的创建是使用 paddle.nn 模块中的 API 进行组网的过程。对于定义好的模型，可以通过 sublayers() 查看其包含的所有层，也可以通过\
    \ add_sublayers() 向模型中添加新的层。在模型结构较为复杂时，可以使用 apply() 将自定义函数作为参数，批量操作所有层，从而实现模型结构的高效修改。同时，飞桨也支持开发者自定义损失函数、评估指标和回调函数，满足开发者的定制化需求。\n\
    \n为了提高神经网络的适应性，加快模型训练速度，飞桨采用了一种称为自动混合精度（Automatic Mixed Precision，AMP）训练的机制，可以在模型训练过程中自动为算子选择合适的数据计算精度。使用飞桨提供的\
    \ API：paddle.amp.auto_cast 和 paddle.amp.GradScaler，即可在原始训练代码的基础上快速开启自动混合精度训练，使得在复杂模型的测试和开发过程中显著减少资源消耗。此外，飞桨也提供了低开销性能分析器\
    \ paddle.profiler，可以收集和导出性能数据，帮助开发者定位性能瓶颈点，从而寻求优化方案来获得性能的提升。\n\n除了支持深度学习模型开发外，飞桨官网还为用户提供了七十多种经过真实业务场景验证的、应用效果较好的官方算法模型，涵盖了计算机视觉、自然语言处理、推荐系统等领域，并提供了多种模型配置方案供选择。同时，飞桨还提供了大量的开源工具集和数据集，让开发者能够更快了解和掌握深度学习领域的最新发展情况。关于更多飞桨的特点与功能，可以参考飞桨官方文档：https://www.paddlepaddle.org.cn。\n\
