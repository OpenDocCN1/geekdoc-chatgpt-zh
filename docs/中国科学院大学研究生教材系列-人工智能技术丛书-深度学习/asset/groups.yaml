    理解的问答等。


    BERT 采用双向 Transformer 编码器作为基础结构，它能够同时利用上下文信息和句子内部信息，提升模型的表达能力。BERT 通过在大规模语料库上进行无监督的预训练，学习到通用的语言知识和上下文信息，然后在特定任务上进行微调，以适应不同的应用场景，如基于多类型自然语言推理语料库（Multi-Genre
    Natural Language Inference，MNLI）的自然语言推理任务、命名实体识别（Named Entity Recognition，NER）任务、基于
    SQuAD 数据集的机器阅读理解任务等。


    # 4.4.1 与其他大规模预训练模型的区别


    将预训练模型应用于下游任务有两种方法，分别是基于特征的方法和基于微调的方法。ELMo[11] 使用的是一种基于特征的方法，GPT 系列模型使用的是一种基于微调的方法。这两种方法可以通过微调所有的预训练参数对下游任务进行训练，且它们都采用单向语言模型来学习通用的语言表示。


    如图 4-16a 所示，ELMo 使用自左向右和自右向左的两个 LSTM 网络作为编码器，分别以 \(P(w_i | w_1, \cdots, w_{i-1})\)
    和 \(P(w_i | w_{i+1}, \cdots, w_n)\) 作为目标函数独立训练，将训练得到的特征向量以拼接的形式实现双向编码。此外，如前面章节所述，GPT
    在 Transformer 解码器的基础上进行构建，以 \(P(w_i | w_1, \cdots, w_{i-1})\) 为目标进行训练，也是一个单向编码模型，如图
    4-16b 所示。BERT 的设计者认为单向的语言模型使得每个标记只能关注先前标记的信息，在面对诸如问答类的自然语言处理任务时，单向语言模型的效果可能不是最优的，能够从两个方向合并上下文信息是非常重要的。BERT
    使用 \(P(w_i | w_1, \cdots, w_{i-1}, w_{i+1}, \cdots, w_n)\) 为目标函数进行训练，它是一个双向编码模型，如图
    4-16c 所示。


    # 4.4.2 BERT 的架构与参数


    BERT 模型基于 Transformer 模型的编码器构建，实现上与 Transformer 的细节几乎相同。文献 [10] 中定义 Transformer
    的块数为 \(L\)、隐藏层状态大小为 \(H\)、自注意力机制的头数为 \(A\)。在 Base 模式的 BERT 中，\(L=12\)，\(H=768\)，\(A=16\)；在
    Large 模式的 BERT 中，\(L=24\)，\(H=1024\)，\(A=16\)。


    # 4.4.3 BERT 的输入表示


    为了使 BERT 能够处理各种下游任务，输入表示需要能够区分一个句子或者一对输入句子。BERT 的输入编码可以分为标记和嵌入两个步骤：在标记步骤中，BERT
    将输入文本标记成 Token，这些 Token 可以是单词、子词或者字符，然后将每个标记映射到其在词汇表中的唯一整数 ID。BERT 使用 WordPiece
    算法将单词或者子词拆分成更小的单元，以扩展词汇表并允许模型更好地处理未知词汇。接着，每个序列的第一个标记始终是一个特殊的分类标记 [CLS]，与该标记对应的最终隐藏层状态被用作分类任务的聚合序列表示。句子对被打包成一个序列。此外，设计者采用两种方式对句子对进行区分：1）在句子之间增加
    [SEP] 标记；'
