    # # 深度生成模型


    # ## 6.1 深度生成模型概述


    在第 5 章已经提到，生成方法通过学习样本的联合概率分布 P(X,Y) 来训练生成模型，以生成符合样本分布的新数据。生成模型在无监督学习中占据主要位置，可用于在没有标签的情况下捕捉样本之间的高阶相关性。


    与卷积神经网络、循环神经网络相比，深度生成模型是深度学习模型的另外一种结构，也常被表示为图模型。Sigmoid 信念网络（Sigmoid Belief Network,
    SBN）就是一种生成式多层神经网络，并采用变分近似的方法进行训练，但是在实际应用中获得多层联合概率分布是非常困难的。2006 年，Geffery Hinton
    等人基于 Sigmoid 信念网络提出了称作深度信念网络（Deep Belief Network, DBN）[1] 的深度生成模型，它与 Sigmoid 信念网络结构不同的地方是最上面两层使用了受限玻尔兹曼机（Restricted
    Boltzmann Machine, RBM）。深度信念网络还使用了一种训练速度很快的无监督学习算法，这种算法的最大特点就是不断重复一种贪婪的逐层训练过程，以高效地学习一个深度多层概率模型。受到这种训练方式的启发，出现了更多种类的深度生成模型，但大多是深度信念网络的变种，并且这些深度生成模型的训练都采用贪婪逐层堆叠“浅层”生成模型的方式，如深度玻尔兹曼机（Deep
    Boltzmann Machine, DBM）[2]、深度自编码器（Deep AutoEncoder, DAE）[3] 等。


    如图 6-1 中的红框所示，我们将深度生成模型分为三类：一类是以受限玻尔兹曼机为基础的深度玻尔兹曼机与深度信念网络，一类是以自编码器为基础的深度自编码器，一类是近期出现的扩散模型（Diffusion
    Model）[4]。为了更好地介绍这些深度生成模型，本章对它们的基础模型也进行简要介绍，包括 Hopfield 神经网络、玻尔兹曼机、受限玻尔兹曼机、自编码器及其主要变种（降噪自编码器、稀疏自编码器）。'
  - '[PAGE 187]


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_187_0.png)


    图 6-1 深度生成模型（详见彩插）


    # 6.2 Hopfield 神经网络


    Hopfield 神经网络由 John Joseph Hopfield 于 1982 年提出 [5]，它是一种相互连接型神经网络，也可以看作是一种单层全连接反馈神经网络。根据激活函数的不同，Hopfield
    神经网络可分为离散型 Hopfield 神经网络（Discrete Hopfield Neural Network，DHNN）和连续型 Hopfield 神经网络（Continuous
    Hopfield Neural Network，CHNN）两种。前者一般采用 8 激活函数，主要用于联想记忆，后者一般采用 Sigmoid 激活函数，主要用于优化计算。


    Hopfield 神经网络中的每个神经元都将自己的状态传递给其他所有神经元，同时又接受其他所有神经元传递来的信息。以 6 个神经元的 Hopfield 神经网络为例，网络结构如图
    6-2 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_187_1.png)


    图 6-2 包含 6 个神经元的 Hopfield 神经网络


    Hopfield 神经网络有若干个稳定状态，当网络从某一个初始状态开始运行，经过有限步的迭代后总可以收敛到某一个稳定的状态。网络中的神经元都是二值阈值神经元，即根据神经元的输入有没有超过阈值，将神经元赋值为
    1 或 -1（也可以赋值为 1 或 0）。网络中的任意两个神经元 i 和 j 之间都由无向边相连，权重定义为


    ```

    w_{ij} = \begin{cases} w_{ji}, & i \neq j \\ 0, & i = j \end{cases}

    ```


    # 1. 状态更新


    Hopfield 神经网络中的神经元的更新规则如下：'
  - '[PAGE 188]


    \(x_i = \begin{cases} +1, & \sum_j w_{ij}x_j \geqslant b_i, \\ -1, & \text{其他情况}
    \end{cases}\)


    其中 \(x_i\) 是神经元 \(i\) 的状态，\(x_j\) 是与神经元 \(x_i\) 相连的其他神经元 \(j\) 的状态，\(b_i\) 是神经元
    \(i\) 的阈值，\(w_{ij}\) 是节点 \(i\) 和 \(j\) 的连接权重。网络状态的更新有同步和异步两种方式，同步更新同时更新部分或者所有神经元的状态，然而因为保证多个神经元同步的难度很大，实际上使用更多的是异步更新，即每次只更新一个神经元的状态，这个神经元可以是根据设置好的顺序挑选的，也可以是随机选择的，对于一个由
    \(n\) 个神经元组成的 Hopfield 神经网络，如果要完成全部神经元的状态更新，至少需要 \(n\) 次。


    # 2. 能量函数


    在 Hopfield 神经网络中，能量是网络是否稳定的度量，如果存在相邻状态使得网络的能量减少，则网络处于不稳定状态。Hopfield 神经网络的能量函数定义如下：


    \(E = -\frac{1}{2} \sum_i \sum_j w_{ij}x_i x_j + \sum_i b_i x_i\)


    每次更新网络状态，网络的能量值要么保持不变，要么减少。因此经过不断地更新，网络的能量值总能收敛到极小值，网络达到稳定状态，此时的网络状态就是网络的输出。


    # 3. 网络训练


    Hopfield 神经网络学习的目标是让网络具备记忆功能，给定网络的稳定状态 \(s\)，当输入其他不同于 \(s\) 的状态 \(s''\) 时，能够由
    \(s''\) 逐渐更新到 \(s\)。例如，给定由 4 个神经元组成的 Hopfield 神经网络的稳定状态为 \((1, -1, 1, -1)\)，当输入
    \((1, 1, 1, 1)\) 后，网络经过迭代更新最终可以收敛到 \((1, -1, 1, -1)\)。


    Hopfield 神经网络常见的学习方法有 Hebbian 法、Storkey 法和伪逆法。这里主要介绍 Hebbian 法。Hebbian 理论是一种神经科学理论，突触后效应的增加源于突触前细胞对突触后细胞的反复和持续刺激。简而言之，当两个细胞同步激活时，细胞间的突触强度会增加。将
    Hebbian 理论运用在人工神经网络中，体现为两个神经元同步激活，权重增加，异步激活，权重减少。网络中的权重计算公式如下：


    \(w_{ij} = \begin{cases} \sum_{k=1}^K x_{ik}x_{jk}, & i \neq j \\ 0, & i = j \end{cases}\)


    其中，\(x_{ij}\) 是要存储的第 \(j\) 个模式中第 \(i\) 个神经元的状态。


    训练得到权重矩阵后，网络的参数就确定下来，网络的运行流程如下所示：


    +   1) 对网络进行初始化，为每个神经元赋初始状态。


    +   2) 从网络中随机或按照顺序选取一个神经元。


    +   3) 更新该神经元的状态，其他神经元的状态保持不变。


    +   4) 求当前状态下网络的能量，判断网络是否达到稳定状态，若达到稳定状态或满足给定条件（如限定迭代次数）则结束；否则转到 2）继续运行。'
  - '[PAGE 189]


    离散型 Hopfield 神经网络可以实现联想记忆，联想记忆是指当网络的输入是某种状态时，输出端也要给出相应的状态输出。但是 Hopfield 网络的记忆能力有限，当输入较多或者相似的时候，往往导致不能正确地判别输入，下一节要讲述的玻尔兹曼机可以解决这一问题。


    # 6.3 玻尔兹曼机与受限玻尔兹曼机


    # 6.3.1 玻尔兹曼机


    玻尔兹曼机（Boltzmann Machine，BM）通常是指一种随机的离散型 Hopfield 神经网络，是具有隐单元的全连接反馈神经网络。这种网络在神经元状态变化中引入了统计概率，网络的平衡状态服从玻尔兹曼分布，网络运行机制基于模拟退火算法。


    在 Hopfield 神经网络中，神经元的功能及其在网络中的地位是一样的，但在波尔兹曼机中，一部分神经元与外部相连，称为可见单元，完成网络的输入、输出功能，或者严格地说可以受到外部条件的约束；另一部分神经元则不与外部相连，称作隐藏单元，在训练中起辅助作用。


    图 6-3 展示的是一个包含 6 个神经元的玻尔兹曼机，其中 \(v_1\)、\(v_2\) 和 \(v_3\) 是隐藏单元，\(v_4\)、\(v_5\)
    和 \(v_6\) 是可见单元。与 Hopfield 神经网络一样，玻尔兹曼机神经元之间的权重是对称的，而且自身无连接：\(w_{ji}=w_{ij}\)，\(w_{ii}=0\)。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_189_0.png)


    图 6-3 包含 6 个神经元的玻尔兹曼机


    玻尔兹曼机中，神经元的状态为 0 或 1 的概率则取决于相应的输入。具体而言，单个神经元 \(j\) 的净输入为


    \(net_j = \sum_i w_{ji}x_i - b_j\) (6-5)


    净输入并不能通过符号转移函数直接获得确定的输出状态，实际的输出状态将按照某种概率发生，输出某种状态的转移概率。神经元 \(j\) 的状态为 1 的概率为


    \(P_j(1) = \frac{1}{1+e^{-net_j/T}}\) (6-6)


    其中 \(T\) 为温度系数。温度系数较大时，获得能量函数最小值的概率较低。反之，温度系数较小时，虽然获得能量函数最小值的概率增加了，但是玻尔兹曼机需要较长时间才能达到稳定状态。玻尔兹曼机的训练选择模拟退火算法（Simulated
    Annealing）。为了避免上述情况的出现，可以先采用较大的温度系数进行粗调，然后逐渐减小温度系数进行微调。


    玻尔兹曼机使用模拟退火算法训练的步骤如下所示：


    +   1) 初始化权重 \(w_{ij}\) 和阈值 \(b_j\)。


    +   2) 从 \(n\) 个神经元中随机地选取神经元 \(j\)。


    +   3) 计算神经元 \(j\) 的输入：\(net_j = \sum_i w_{ji}x_i - b_j\)。


    +   4) 以概率 \(P_j\) 来决定神经元 \(j\) 的输出：\(P_j(1)=\frac{1}{1+e^{-net_j/T}}\)。'
  - '[PAGE 190]


    +   5) 其他神经元的状态保持不变，即 $\forall i \neq j, v_i(t+1) = v_i(t)$。

    +   6) 根据输出 $x_i$ 和 $x_j$ 的值，调整连接权重 $w_{ij}$ 和阈值 $b_j$。

    +   7) 返回步骤 1)，不断迭代，直到网络不发生变化或满足终止条件。


    # 6.3.2 受限玻尔兹曼机


    受限玻尔兹曼机（Restricted Boltzmann Machine，RBM）是玻尔兹曼机的受限版本[6]，由 Ruslan Salakhutdinov
    等人提出。玻尔兹曼机中的神经元之间具有双向连接，这种模型的特点是可以基于模型的抽样从未知的概率分布中学习样本的重要特征。然而，这种学习的过程是非常困难和耗时的，因此在求解实际问题时使用的并不多，RBM
    的提出就是通过在玻尔兹曼机网络拓扑结构上加上一些限制来缓解这一问题。


    具体来说，RBM 是一个马尔可夫随机场（Markov Random Field，MRF），也是一个双边无向图模型，如图 6-4 所示。图 6-4 中有 $m$
    个可见神经元 $\boldsymbol{v}=(v_1, v_2, \cdots, v_m)$，表示可见数据，还有 $n$ 个隐藏神经元 $\boldsymbol{h}=(h_1,
    h_2, \cdots, h_n)$，用来表示可见变量之间的依赖。这里主要关注二元 RBM，即 $(\boldsymbol{v}, \boldsymbol{h})$
    随机变量值的值域为 $\{0, 1\}$。模型 $(\boldsymbol{v}, \boldsymbol{h})$ 的概率分布为


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_190_0.png)


    $$p(\boldsymbol{v}, \boldsymbol{h}) = \frac{1}{Z} e^{-E(\boldsymbol{v}, \boldsymbol{h})}$$
    (6-7)


    那么可见变量 $\boldsymbol{v}$ 的概率分布即为联合分布的边缘分布：


    $$p(\boldsymbol{v}) = \sum_h p(\boldsymbol{v}, \boldsymbol{h}) = \frac{1}{Z} \sum_h
    e^{-E(\boldsymbol{v}, \boldsymbol{h})}$$ (6-8)


    其中，$Z = \sum_{v,h} e^{-E(\boldsymbol{v}, \boldsymbol{h})}$，称作剖分函数，其计算是非常困难的。$E(\boldsymbol{v},
    \boldsymbol{h})$ 称作能量函数，计算公式为


    $$E(\boldsymbol{v}, \boldsymbol{h}) = - \sum_{i=1}^m \sum_{j=1}^n w_{ij} v_i h_j
    - \sum_{i=1}^m b_i v_i - \sum_{j=1}^n c_j h_j$$ (6-9)


    其中，$w_{ij}$ 是神经元 $v_i$ 和 $h_j$ 之间的实值权重，$b_i$ 和 $c_j$ 分别是第 $i$ 个可见神经元和第 $j$ 个隐藏神经元上的实值偏置项。


    在 RBM 中，只有同一层的变量之间有连接，而不同层的变量之间无连接，所以给定可见变量、隐藏变量是条件独立的，反过来也成立，即


    $$p(\boldsymbol{h} \mid \boldsymbol{v}) = \prod_{j=1}^n p(h_j \mid \boldsymbol{v}),
    \quad p(\boldsymbol{v} \mid \boldsymbol{h}) = \prod_{i=1}^m p(v_i \mid \boldsymbol{h})$$
    (6-10)


    单独一个变量为 1 的条件概率计算方法如下：


    $$p(h_j=1 \mid \boldsymbol{v}) = \sigma(\sum_{i=1}^n w_{ij} v_i + c_j), \quad
    p(v_i=1 \mid \boldsymbol{h}) = \sigma(\sum_{j=1}^m w_{ij} h_j + b_i)$$ (6-11)


    其中 $\sigma(x) = 1/(1+e^{-x})$ 是 Sigmoid 激活函数。


    # 1. 受限玻尔兹曼机的参数学习


    RBM 的训练采用最大似然估计思想，具体来说就是 log 似然的梯度上升法，设 RBM 的参'
  - "[PAGE 191]\n\n数集合为 \\(\\theta\\), 包括 \\(w_{ij}\\)、\\(b_i\\) 和 \\(c_j\\), 其中 \\\
    (i=1,2,\\cdots,m, j=1,2,\\cdots,n\\), 给定一个单独的训练样本 \\(v\\) 时，log 似然函数表示为\n\n\\\
    (\\log p(v | \\theta) = \\log \\left( \\frac{1}{Z} \\sum_h e^{-E(v,h,\\theta)}\
    \ \\right)\\) (6-12)\n\n计算对参数 \\(\\theta\\) 的梯度，得到：\n\n\\(\\frac{\\partial \\\
    log p(v | \\theta)}{\\partial \\theta} = \\frac{\\partial \\log \\left( \\frac{1}{Z}\
    \ \\sum_h e^{-E(v,h,\\theta)} \\right)}{\\partial \\theta} = - \\sum_h p(h | v)\
    \ \\frac{\\partial E(v,h,\\theta)}{\\partial \\theta} + \\sum_{v,h} p(v,h) \\\
    frac{\\partial E(v,h,\\theta)}{\\partial \\theta}\\) (6-13)\n\n只就参数 \\(w_{ij}\\\
    ) 而言，可以求得：\n\n\\(\\frac{\\partial \\log p(v | \\theta)}{\\partial w_{ij}} = \\\
    sum_h p(h | v) v_i h_j - \\sum_v p(v) \\sum_h p(h | v) v_i h_j = p(h_j=1 | v)\
    \ v_i - \\sum_i p(v) p(h_j=1 | v) v_i\\) (6-14)\n\n同样可以计算参数 \\(b_i\\) 和 \\(c_j\\\
    ) 的梯度，从而得到 3 个参数的更新公式如下：\n\n\\(\\left. \\begin{aligned} \\Delta w_{ij} &= \\frac{\\\
    partial \\log p(v | \\theta)}{\\partial w_{ij}} = p(h_j=1 | v) v_i - \\sum_v p(v)\
    \ p(h_j=1 | v) v_i \\\\ \\Delta b_i &= \\frac{\\partial \\log p(v | \\theta)}{\\\
    partial b_i} = v_i - \\sum_v p(v) v_i \\\\ \\Delta c_j &= \\frac{\\partial \\\
    log p(v | \\theta)}{\\partial c_j} = p(h_j=1 | v) - \\sum_v p(v) p(h_j=1 | v)\
    \ \\end{aligned} \\right\\}\\) (6-15)\n\n# 2. 对比散度算法\n\nRBM 训练采用 log 似然梯度上升法，参数的更新如公式\
    \ (6-13) 所示，梯度的计算中主要包括两项：第 1 项叫作正阶段项，是当可见变量被训练数据赋值时，对隐藏变量抽样的结果；第 2 项叫作负阶段项，计算这一项要求获得模型的联合样本。正阶段项是非常容易获得的，然而，负阶段项却是非常难以计算的，这是因为需要长时间运行吉布斯链才能使网络收敛到稳态。所以，为了训练的高效性，现存的\
    \ RBM 训练算法大多是对负阶段项进行估计。对比散度算法（Contrast Divergence，CD）是 RBM 训练常用的近似算法。\\(k\\) 步对比散度算法的计算流程如算法\
    \ 6-1 所示。\n\n算法 6-1  \\(k\\) 步对比散度算法\n\n输入：RBM(\\(v_1,\\cdots,v_m,h_1,\\cdots,h_n\\\
    )), 训练批数据 S  \n输出：梯度估计值 \\(\\Delta w_{ij}, \\Delta b_j, \\Delta c_i\\), 其中 \\\
    (i=1,2,\\cdots,m, j=1,2,\\cdots,n\\)  \n初始化：\\(\\Delta w_{ij}=\\Delta b_j=\\Delta\
    \ c_i=0\\), 其中 \\(i=1,2\\cdots,m, j=1,2,\\cdots,n\\)  \nfor S 中所有的训练样本 \\(v\\\
    ) do  \n  \\(v^{(0)} \\leftarrow v\\)  \n  for \\(t=0,\\cdots,k-1\\) do"
  md: "\n## 本章人物：Ian Goodfellow 博士\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_185_0.png)\n\
    \nIan Goodfellow（1985 ~），本科与硕士就读于斯坦福大学（Stanford University），师从 Andrew NG（吴恩达）教授和\
    \ Gary Bradski 教授，博士就读于蒙特利尔大学（University of Montreal），师从 Yoshua Bengio 教授和 Aaron\
    \ Courville 教授，于 2014 年获博士学位。博士毕业后，在 Google 公司任高级研究员直到 2019 年，之后加入 Apple 公司 Special\
    \ Projects Group 担任机器学习总监，2022 年离职，据公开报道，目前 Ian Goodfellow 已加入 Google DeepMind\
    \ 公司，继续从事人工智能研究工作。\n\nIan Goodfellow 的主要贡献是 2014 年提出了生成对抗网络（Generative Adversarial\
    \ Network，GAN），之后几年 GAN 热潮席卷了 AI 领域几乎所有顶级会议，大量基于 GAN 的高质量论文被发表与讨论。Yann LeCun 也对\
    \ GAN 给出了很高的评价，他认为“GAN 为创建无监督学习提供了强有力的算法框架，有望帮助我们为 AI 加入常识，沿着这条路走下去，有不小的成功机会能开发出更加智慧的\
    \ AI”。基于 Ian Goodfellow 在 GAN 领域的贡献，他也因此入选 2017 年“MIT 评论 35 岁以下创新人物”。目前，GAN 已经被广泛应用于图像生成、音乐生成、语音合成和异常检测等领域。\n\
    \nIan Goodfellow 还和 Yoshua Bengio、Aaron Courville 两位教授合作撰写了 Deep Learning 一书，该书已被翻译成中文，成为学习深度学习的必读书籍之一。\n\
    \nIan Goodfellow 博士的个人主页：https://www.iangoodfellow.com/。\n\n## 深度生成模型\n\n### 6.1\
    \ 深度生成模型概述\n\n在第 5 章已经提到，生成方法通过学习样本的联合概率分布 P(X,Y) 来训练生成模型，以生成符合样本分布的新数据。生成模型在无监督学习中占据主要位置，可用于在没有标签的情况下捕捉样本之间的高阶相关性。\n\
    \n与卷积神经网络、循环神经网络相比，深度生成模型是深度学习模型的另外一种结构，也常被表示为图模型。Sigmoid 信念网络（Sigmoid Belief\
    \ Network, SBN）就是一种生成式多层神经网络，并采用变分近似的方法进行训练，但是在实际应用中获得多层联合概率分布是非常困难的。2006 年，Geoffrey\
    \ Hinton 等人基于 Sigmoid 信念网络提出了称作深度信念网络（Deep Belief Network, DBN）[1] 的深度生成模型，它与\
    \ Sigmoid 信念网络结构不同的地方是最上面两层使用了受限玻尔兹曼机（Restricted Boltzmann Machine, RBM）。深度信念网络还使用了一种训练速度很快的无监督学习算法，这种算法的最大特点就是不断重复一种贪婪的逐层训练过程，以高效地学习一个深度多层概率模型。受到这种训练方式的启发，出现了更多种类的深度生成模型，但大多是深度信念网络的变种，并且这些深度生成模型的训练都采用贪婪逐层堆叠“浅层”生成模型的方式，如深度玻尔兹曼机（Deep\
    \ Boltzmann Machine, DBM）[2]、深度自编码器（Deep AutoEncoder, DAE）[3] 等。\n\n如图 6-1 中的红框所示，我们将深度生成模型分为三类：一类是以受限玻尔兹曼机为基础的深度玻尔兹曼机与深度信念网络，一类是以自编码器为基础的深度自编码器，一类是近期出现的扩散模型（Diffusion\
    \ Model）[4]。为了更好地介绍这些深度生成模型，本章对它们的基础模型也进行简要介绍，包括 Hopfield 神经网络、玻尔兹曼机、受限玻尔兹曼机、自编码器及其主要变种（降噪自编码器、稀疏自编码器）。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_187_0.png)\n\n图 6-1 深度生成模型（详见彩插）\n\n\
    ### 6.2 Hopfield 神经网络\n\nHopfield 神经网络由 John Joseph Hopfield 于 1982 年提出 [5]，它是一种相互连接型神经网络，也可以看作是一种单层全连接反馈神经网络。根据激活函数的不同，Hopfield\
    \ 神经网络可分为离散型 Hopfield 神经网络（Discrete Hopfield Neural Network，DHNN）和连续型 Hopfield\
    \ 神经网络（Continuous Hopfield Neural Network，CHNN）两种。前者一般采用符号激活函数，主要用于联想记忆，后者一般采用\
    \ Sigmoid 激活函数，主要用于优化计算。\n\nHopfield 神经网络中的每个神经元都将自己的状态传递给其他所有神经元，同时又接受其他所有神经元传递来的信息。以\
    \ 6 个神经元的 Hopfield 神经网络为例，网络结构如图 6-2 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_187_1.png)\n\
    \n图 6-2 包含 6 个神经元的 Hopfield 神经网络\n\nHopfield 神经网络有若干个稳定状态，当网络从某一个初始状态开始运行，经过有限步的迭代后总可以收敛到某一个稳定的状态。网络中的神经元都是二值阈值神经元，即根据神经元的输入有没有超过阈值，将神经元赋值为\
    \ 1 或 -1（也可以赋值为 1 或 0）。网络中的任意两个神经元 i 和 j 之间都由无向边相连，权重定义为\n\n\\[\nw_{ij} = \\begin{cases}\
    \ w_{ji}, & i \\neq j \\\\ 0, & i = j \\end{cases}\n\\]\n\n### 1. 状态更新\n\nHopfield\
    \ 神经网络中的神经元的更新规则如下：\n\n\\[\nx_i = \\begin{cases} +1, & \\sum_j w_{ij}x_j \\geqslant\
    \ b_i, \\\\ -1, & \\text{其他情况} \\end{cases}\n\\]\n\n其中 \\(x_i\\) 是神经元 \\(i\\)\
    \ 的状态，\\(x_j\\) 是与神经元 \\(x_i\\) 相连的其他神经元 \\(j\\) 的状态，\\(b_i\\) 是神经元 \\(i\\) 的阈值，\\\
    (w_{ij}\\) 是节点 \\(i\\) 和 \\(j\\) 的连接权重。网络状态的更新有同步和异步两种方式，同步更新同时更新部分或者所有神经元的状态，然而因为保证多个神经元同步的难度很大，实际上使用更多的是异步更新，即每次只更新一个神经元的状态，这个神经元可以是根据设置好的顺序挑选的，也可以是随机选择的，对于一个由\
    \ \\(n\\) 个神经元组成的 Hopfield 神经网络，如果要完成全部神经元的状态更新，至少需要 \\(n\\) 次。\n\n### 2. 能量函数\n\
    \n在 Hopfield 神经网络中，能量是网络是否稳定的度量，如果存在相邻状态使得网络的能量减少，则网络处于不稳定状态。Hopfield 神经网络的能量函数定义如下：\n\
    \n\\[\nE = -\\frac{1}{2} \\sum_i \\sum_j w_{ij}x_i x_j + \\sum_i b_i x_i\n\\]\n\
    \n每次更新网络状态，网络的能量值要么保持不变，要么减少。因此经过不断地更新，网络的能量值总能收敛到极小值，网络达到稳定状态，此时的网络状态就是网络的输出。\n\
    \n### 3. 网络训练\n\nHopfield 神经网络学习的目标是让网络具备记忆功能，给定网络的稳定状态 \\(s\\)，当输入其他不同于 \\(s\\\
    ) 的状态 \\(s'\\) 时，能够由 \\(s'\\) 逐渐更新到 \\(s\\)。例如，给定由 4 个神经元组成的 Hopfield 神经网络的稳定状态为\
    \ \\((1, -1, 1, -1)\\)，当输入 \\((1, 1, 1, 1)\\) 后，网络经过迭代更新最终可以收敛到 \\((1, -1, 1,\
    \ -1)\\)。\n\nHopfield 神经网络常见的学习方法有 Hebbian 法、Storkey 法和伪逆法。这里主要介绍 Hebbian 法。Hebbian\
    \ 理论是一种神经科学理论，突触后效应的增加源于突触前细胞对突触后细胞的反复和持续刺激。简而言之，当两个细胞同步激活时，细胞间的突触强度会增加。将 Hebbian\
    \ 理论运用在人工神经网络中，体现为两个神经元同步激活，权重增加，异步激活，权重减少。网络中的权重计算公式如下：\n\n\\[\nw_{ij} = \\begin{cases}\
    \ \\sum_{k=1}^K x_{ik}x_{jk}, & i \\neq j \\\\ 0, & i = j \\end{cases}\n\\]\n\n\
    其中，\\(x_{ik}\\) 是要存储的第 \\(k\\) 个模式中第 \\(i\\) 个神经元的状态。\n\n训练得到权重矩阵后，网络的参数就确定下来，网络的运行流程如下所示：\n\
    \n- 1) 对网络进行初始化，为每个神经元赋初始状态。\n- 2) 从网络中随机或按照顺序选取一个神经元。\n- 3) 更新该神经元的状态，其他神经元的状态保持不变。\n\
    - 4) 求当前状态下网络的能量，判断网络是否达到稳定状态，若达到稳定状态或满足给定条件（如限定迭代次数）则结束；否则转到 2）继续运行。\n\n离散型 Hopfield\
    \ 神经网络可以实现联想记忆，联想记忆是指当网络的输入是某种状态时，输出端也要给出相应的状态输出。但是 Hopfield 网络的记忆能力有限，当输入较多或者相似的时候，往往导致不能正确地判别输入，下一节要讲述的玻尔兹曼机可以解决这一问题。\n\
    \n### 6.3 玻尔兹曼机与受限玻尔兹曼机\n\n### 6.3.1 玻尔兹曼机\n\n玻尔兹曼机（Boltzmann Machine，BM）通常是指一种随机的离散型\
    \ Hopfield 神经网络，是具有隐单元的全连接反馈神经网络。这种网络在神经元状态变化中引入了统计概率，网络的平衡状态服从玻尔兹曼分布，网络运行机制基于模拟退火算法。\n\
    \n在 Hopfield 神经网络中，神经元的功能及其在网络中的地位是一样的，但在玻尔兹曼机中，一部分神经元与外部相连，称为可见单元，完成网络的输入、输出功能，或者严格地说可以受到外部条件的约束；另一部分神经元则不与外部相连，称作隐藏单元，在训练中起辅助作用。\n\
    \n图 6-3 展示的是一个包含 6 个神经元的玻尔兹曼机，其中 \\(v_1\\)、\\(v_2\\) 和 \\(v_3\\) 是隐藏单元，\\(v_4\\\
    )、\\(v_5\\) 和 \\(v_6\\) 是可见单元。与 Hopfield 神经网络一样，玻尔兹曼机神经元之间的权重是对称的，而且自身无连接：\\(w_{ji}=w_{ij}\\\
    )，\\(w_{ii}=0\\)。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_189_0.png)\n\n图\
    \ 6-3 包含 6 个神经元的玻尔兹曼机\n\n玻尔兹曼机中，神经元的状态为 0 或 1 的概率则取决于相应的输入。具体而言，单个神经元 \\(j\\)\
    \ 的净输入为\n\n\\[\nnet_j = \\sum_i w_{ji}x_i - b_j \\tag{6-5}\n\\]\n\n净输入并不能通过符号转移函数直接获得确定的输出状态，实际的输出状态将按照某种概率发生，输出某种状态的转移概率。神经元\
    \ \\(j\\) 的状态为 1 的概率为\n\n\\[\nP_j(1) = \\frac{1}{1+e^{-net_j/T}} \\tag{6-6}\n\\\
    ]\n\n其中 \\(T\\) 为温度系数。温度系数较大时，获得能量函数最小值的概率较低。反之，温度系数较小时，虽然获得能量函数最小值的概率增加了，但是玻尔兹曼机需要较长时间才能达到稳定状态。玻尔兹曼机的训练选择模拟退火算法（Simulated\
    \ Annealing）。为了避免上述情况的出现，可以先采用较大的温度系数进行粗调，然后逐渐减小温度系数进行微调。\n\n玻尔兹曼机使用模拟退火算法训练的步骤如下所示：\n\
    \n- 1) 初始化权重 \\(w_{ij}\\) 和阈值 \\(b_j\\)。\n- 2) 从 \\(n\\) 个神经元中随机地选取神经元 \\(j\\\
    )。\n- 3) 计算神经元 \\(j\\) 的输入：\\(net_j = \\sum_i w_{ji}x_i - b_j\\)。\n- 4) 以概率 \\\
    (P_j\\) 来决定神经元 \\(j\\) 的输出：\\(P_j(1)=\\frac{1}{1+e^{-net_j/T}}\\)。\n- 5) 其他神经元的状态保持不变，即\
    \ \\(\\forall i \\neq j, v_i(t+1) = v_i(t)\\)。\n- 6) 根据输出 \\(x_i\\) 和 \\(x_j\\\
    ) 的值，调整连接权重 \\(w_{ij}\\) 和阈值 \\(b_j\\)。\n- 7) 返回步骤 1)，不断迭代，直到网络不发生变化或满足终止条件。\n\
    \n### 6.3.2 受限玻尔兹曼机\n\n受限玻尔兹曼机（Restricted Boltzmann Machine，RBM）是玻尔兹曼机的受限版本[6]，由\
    \ Ruslan Salakhutdinov 等人提出。玻尔兹曼机中的神经元之间具有双向连接，这种模型的特点是可以基于模型的抽样从未知的概率分布中学习样本的重要特征。然而，这种学习的过程是非常困难和耗时的，因此在求解实际问题时使用的并不多，RBM\
    \ 的提出就是通过在玻尔兹曼机网络拓扑结构上加上一些限制来缓解这一问题。\n\n具体来说，RBM 是一个马尔可夫随机场（Markov Random Field，MRF），也是一个双边无向图模型，如图\
    \ 6-4 所示。图 6-4 中有 \\(m\\) 个可见神经元 \\(\\boldsymbol{v}=(v_1, v_2, \\cdots, v_m)\\\
    )，表示可见数据，还有 \\(n\\) 个隐藏神经元 \\(\\boldsymbol{h}=(h_1, h_2, \\cdots, h_n)\\)，用来表示可见变量之间的依赖。这里主要关注二元\
    \ RBM，即 \\((\\boldsymbol{v}, \\boldsymbol{h})\\) 随机变量值的值域为 \\(\\{0, 1\\}\\)。模型\
    \ \\((\\boldsymbol{v}, \\boldsymbol{h})\\) 的概率分布为\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_190_0.png)\n\
    \n\\[\np(\\boldsymbol{v}, \\boldsymbol{h}) = \\frac{1}{Z} e^{-E(\\boldsymbol{v},\
    \ \\boldsymbol{h})} \\tag{6-7}\n\\]\n\n那么可见变量 \\(\\boldsymbol{v}\\) 的概率分布即为联合分布的边缘分布：\n\
    \n\\[\np(\\boldsymbol{v}) = \\sum_h p(\\boldsymbol{v}, \\boldsymbol{h}) = \\frac{1}{Z}\
    \ \\sum_h e^{-E(\\boldsymbol{v}, \\boldsymbol{h})} \\tag{6-8}\n\\]\n\n其中，\\(Z\
    \ = \\sum_{v,h} e^{-E(\\boldsymbol{v}, \\boldsymbol{h})}\\)，称作剖分函数，其计算是非常困难的。\\\
    (E(\\boldsymbol{v}, \\boldsymbol{h})\\) 称作能量函数，计算公式为\n\n\\[\nE(\\boldsymbol{v},\
    \ \\boldsymbol{h}) = - \\sum_{i=1}^m \\sum_{j=1}^n w_{ij} v_i h_j - \\sum_{i=1}^m\
    \ b_i v_i - \\sum_{j=1}^n c_j h_j \\tag{6-9}\n\\]\n\n其中，\\(w_{ij}\\) 是神经元 \\(v_i\\\
    ) 和 \\(h_j\\) 之间的实值权重，\\(b_i\\) 和 \\(c_j\\) 分别是第 \\(i\\) 个可见神经元和第 \\(j\\) 个隐藏神经元上的实值偏置项。\n\
    \n在 RBM 中，只有同一层的变量之间有连接，而不同层的变量之间无连接，所以给定可见变量、隐藏变量是条件独立的，反过来也成立，即\n\n\\[\np(\\\
    boldsymbol{h} \\mid \\boldsymbol{v}) = \\prod_{j=1}^n p(h_j \\mid \\boldsymbol{v}),\
    \ \\quad p(\\boldsymbol{v} \\mid \\boldsymbol{h}) = \\prod_{i=1}^m p(v_i \\mid\
    \ \\boldsymbol{h}) \\tag{6-10}\n\\]\n\n单独一个变量为 1 的条件概率计算方法如下：\n\n\\[\np(h_j=1\
    \ \\mid \\boldsymbol{v}) = \\sigma(\\sum_{i=1}^n w_{ij} v_i + c_j), \\quad p(v_i=1\
    \ \\mid \\boldsymbol{h}) = \\sigma(\\sum_{j=1}^m w_{ij} h_j + b_i) \\tag{6-11}\n\
    \\]\n\n其中 \\(\\sigma(x) = 1/(1+e^{-x})\\) 是 Sigmoid 激活函数。\n\n### 1. 受限玻尔兹曼机的参数学习\n\
    \nRBM 的训练采用最大似然估计思想，具体来说就是 log 似然的梯度上升法，设 RBM 的参数集合为 \\(\\theta\\)，包括 \\(w_{ij}\\\
    )、\\(b_i\\) 和 \\(c_j\\)，其中 \\(i=1,2,\\cdots,m, j=1,2,\\cdots,n\\)，给定一个单独的训练样本\
    \ \\(v\\) 时，log 似然函数表示为\n\n\\[\n\\log p(v \\mid \\theta) = \\log \\left( \\frac{1}{Z}\
    \ \\sum_h e^{-E(v,h,\\theta)} \\right) \\tag{6-12}\n\\]\n\n计算对参数 \\(\\theta\\\
    ) 的梯度，得到：\n\n\\[\n\\frac{\\partial \\log p(v \\mid \\theta)}{\\partial \\theta}\
    \ = \\frac{\\partial \\log \\left( \\frac{1}{Z} \\sum_h e^{-E(v,h,\\theta)} \\\
    right)}{\\partial \\theta} = - \\sum_h p(h \\mid v) \\frac{\\partial E(v,h,\\\
    theta)}{\\partial \\theta} + \\sum_{v,h} p(v,h) \\frac{\\partial E(v,h,\\theta)}{\\\
    partial \\theta} \\tag{6-13}\n\\]\n\n只就参数 \\(w_{ij}\\) 而言，可以求得：\n\n\\[\n\\frac{\\\
    partial \\log p(v \\mid \\theta)}{\\partial w_{ij}} = \\sum_h p(h \\mid v) v_i\
    \ h_j - \\sum_v p(v) \\sum_h p(h \\mid v) v_i h_j = p(h_j=1 \\mid v) v_i - \\\
    sum_i p(v) p(h_j=1 \\mid v) v_i \\tag{6-14}\n\\]\n\n同样可以计算参数 \\(b_i\\) 和 \\(c_j\\\
    ) 的梯度，从而得到 3 个参数的更新公式如下：\n\n\\[\n\\begin{aligned}\n\\Delta w_{ij} &= \\frac{\\\
    partial \\log p(v \\mid \\theta)}{\\partial w_{ij}} = p(h_j=1 \\mid v) v_i - \\\
    sum_v p(v) p(h_j=1 \\mid v) v_i \\\\\n\\Delta b_i &= \\frac{\\partial \\log p(v\
    \ \\mid \\theta)}{\\partial b_i} = v_i - \\sum_v p(v) v_i \\\\\n\\Delta c_j &=\
    \ \\frac{\\partial \\log p(v \\mid \\theta)}{\\partial c_j} = p(h_j=1 \\mid v)\
    \ - \\sum_v p(v) p(h_j=1 \\mid v)\n\\end{aligned} \\tag{6-15}\n\\]\n\n### 2. 对比散度算法\n\
    \nRBM 训练采用 log 似然梯度上升法，参数的更新如公式 (6-13) 所示，梯度的计算中主要包括两项：第 1 项叫作正阶段项，是当可见变量被训练数据赋值时，对隐藏变量抽样的结果；第\
    \ 2 项叫作负阶段项，计算这一项要求获得模型的联合样本。正阶段项是非常容易获得的，然而，负阶段项却是非常难以计算的，这是因为需要长时间运行吉布斯链才能使网络收敛到稳态。所以，为了训练的高效性，现存的\
    \ RBM 训练算法大多是对负阶段项进行估计。对比散度算法（Contrast Divergence，CD）是 RBM 训练常用的近似算法。\\(k\\) 步对比散度算法的计算流程如算法\
    \ 6-1 所示。\n\n算法 6-1 \\(k\\) 步对比散度算法\n\n输入：RBM(\\(v_1,\\cdots,v_m,h_1,\\cdots,h_n\\\
    )), 训练批数据 S  \n输出：梯度估计值 \\(\\Delta w_{ij}, \\Delta b_j, \\Delta c_i\\), 其中 \\\
    (i=1,2,\\cdots,m, j=1,2,\\cdots,n\\)  \n初始化：\\(\\Delta w_{ij}=\\Delta b_j=\\Delta\
    \ c_i=0\\), 其中 \\(i=1,2\\cdots,m, j=1,2,\\cdots,n\\)  \nfor S 中所有的训练样本 \\(v\\\
    ) do  \n  \\(v^{(0)} \\leftarrow v\\)  \n  for \\(t=0,\\cdots,k-1\\) do\n"
  mdcn: "\n## 本章人物：Ian Goodfellow 博士\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_185_0.png)\n\
    \nIan Goodfellow（1985 ~），本科与硕士就读于斯坦福大学（Stanford University），师从 Andrew NG（吴恩达）教授和\
    \ Gary Bradski 教授，博士就读于蒙特利尔大学（University of Montreal），师从 Yoshua Bengio 教授和 Aaron\
    \ Courville 教授，于 2014 年获博士学位。博士毕业后，在 Google 公司任高级研究员直到 2019 年，之后加入 Apple 公司 Special\
    \ Projects Group 担任机器学习总监，2022 年离职，据公开报道，目前 Ian Goodfellow 已加入 Google DeepMind\
    \ 公司，继续从事人工智能研究工作。\n\nIan Goodfellow 的主要贡献是 2014 年提出了生成对抗网络（Generative Adversarial\
    \ Network，GAN），之后几年 GAN 热潮席卷了 AI 领域几乎所有顶级会议，大量基于 GAN 的高质量论文被发表与讨论。Yann LeCun 也对\
    \ GAN 给出了很高的评价，他认为“GAN 为创建无监督学习提供了强有力的算法框架，有望帮助我们为 AI 加入常识，沿着这条路走下去，有不小的成功机会能开发出更加智慧的\
    \ AI”。基于 Ian Goodfellow 在 GAN 领域的贡献，他也因此入选 2017 年“MIT 评论 35 岁以下创新人物”。目前，GAN 已经被广泛应用于图像生成、音乐生成、语音合成和异常检测等领域。\n\
    \nIan Goodfellow 还和 Yoshua Bengio、Aaron Courville 两位教授合作撰写了 Deep Learning 一书，该书已被翻译成中文，成为学习深度学习的必读书籍之一。\n\
    \nIan Goodfellow 博士的个人主页：https://www.iangoodfellow.com/。\n\n## 深度生成模型\n\n### 6.1\
    \ 深度生成模型概述\n\n在第 5 章已经提到，生成方法通过学习样本的联合概率分布 P(X,Y) 来训练生成模型，以生成符合样本分布的新数据。生成模型在无监督学习中占据主要位置，可用于在没有标签的情况下捕捉样本之间的高阶相关性。\n\
    \n与卷积神经网络、循环神经网络相比，深度生成模型是深度学习模型的另外一种结构，也常被表示为图模型。Sigmoid 信念网络（Sigmoid Belief\
    \ Network, SBN）就是一种生成式多层神经网络，并采用变分近似的方法进行训练，但是在实际应用中获得多层联合概率分布是非常困难的。2006 年，Geoffrey\
    \ Hinton 等人基于 Sigmoid 信念网络提出了称作深度信念网络（Deep Belief Network, DBN）[1] 的深度生成模型，它与\
    \ Sigmoid 信念网络结构不同的地方是最上面两层使用了受限玻尔兹曼机（Restricted Boltzmann Machine, RBM）。深度信念网络还使用了一种训练速度很快的无监督学习算法，这种算法的最大特点就是不断重复一种贪婪的逐层训练过程，以高效地学习一个深度多层概率模型。受到这种训练方式的启发，出现了更多种类的深度生成模型，但大多是深度信念网络的变种，并且这些深度生成模型的训练都采用贪婪逐层堆叠“浅层”生成模型的方式，如深度玻尔兹曼机（Deep\
    \ Boltzmann Machine, DBM）[2]、深度自编码器（Deep AutoEncoder, DAE）[3] 等。\n\n如图 6-1 中的红框所示，我们将深度生成模型分为三类：一类是以受限玻尔兹曼机为基础的深度玻尔兹曼机与深度信念网络，一类是以自编码器为基础的深度自编码器，一类是近期出现的扩散模型（Diffusion\
    \ Model）[4]。为了更好地介绍这些深度生成模型，本章对它们的基础模型也进行简要介绍，包括 Hopfield 神经网络、玻尔兹曼机、受限玻尔兹曼机、自编码器及其主要变种（降噪自编码器、稀疏自编码器）。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_187_0.png)\n\n图 6-1 深度生成模型（详见彩插）\n\n\
    ### 6.2 Hopfield 神经网络\n\nHopfield 神经网络由 John Joseph Hopfield 于 1982 年提出 [5]，它是一种相互连接型神经网络，也可以看作是一种单层全连接反馈神经网络。根据激活函数的不同，Hopfield\
    \ 神经网络可分为离散型 Hopfield 神经网络（Discrete Hopfield Neural Network，DHNN）和连续型 Hopfield\
    \ 神经网络（Continuous Hopfield Neural Network，CHNN）两种。前者一般采用符号激活函数，主要用于联想记忆，后者一般采用\
    \ Sigmoid 激活函数，主要用于优化计算。\n\nHopfield 神经网络中的每个神经元都将自己的状态传递给其他所有神经元，同时又接受其他所有神经元传递来的信息。以\
    \ 6 个神经元的 Hopfield 神经网络为例，网络结构如图 6-2 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_187_1.png)\n\
    \n图 6-2 包含 6 个神经元的 Hopfield 神经网络\n\nHopfield 神经网络有若干个稳定状态，当网络从某一个初始状态开始运行，经过有限步的迭代后总可以收敛到某一个稳定的状态。网络中的神经元都是二值阈值神经元，即根据神经元的输入有没有超过阈值，将神经元赋值为\
    \ 1 或 -1（也可以赋值为 1 或 0）。网络中的任意两个神经元 i 和 j 之间都由无向边相连，权重定义为\n\n\\[\nw_{ij} = \\begin{cases}\
    \ w_{ji}, & i \\neq j \\\\ 0, & i = j \\end{cases}\n\\]\n\n### 1. 状态更新\n\nHopfield\
    \ 神经网络中的神经元的更新规则如下：\n\n\\[\nx_i = \\begin{cases} +1, & \\sum_j w_{ij}x_j \\geqslant\
    \ b_i, \\\\ -1, & \\text{其他情况} \\end{cases}\n\\]\n\n其中 \\(x_i\\) 是神经元 \\(i\\)\
    \ 的状态，\\(x_j\\) 是与神经元 \\(x_i\\) 相连的其他神经元 \\(j\\) 的状态，\\(b_i\\) 是神经元 \\(i\\) 的阈值，\\\
    (w_{ij}\\) 是节点 \\(i\\) 和 \\(j\\) 的连接权重。网络状态的更新有同步和异步两种方式，同步更新同时更新部分或者所有神经元的状态，然而因为保证多个神经元同步的难度很大，实际上使用更多的是异步更新，即每次只更新一个神经元的状态，这个神经元可以是根据设置好的顺序挑选的，也可以是随机选择的，对于一个由\
    \ \\(n\\) 个神经元组成的 Hopfield 神经网络，如果要完成全部神经元的状态更新，至少需要 \\(n\\) 次。\n\n### 2. 能量函数\n\
    \n在 Hopfield 神经网络中，能量是网络是否稳定的度量，如果存在相邻状态使得网络的能量减少，则网络处于不稳定状态。Hopfield 神经网络的能量函数定义如下：\n\
    \n\\[\nE = -\\frac{1}{2} \\sum_i \\sum_j w_{ij}x_i x_j + \\sum_i b_i x_i\n\\]\n\
    \n每次更新网络状态，网络的能量值要么保持不变，要么减少。因此经过不断地更新，网络的能量值总能收敛到极小值，网络达到稳定状态，此时的网络状态就是网络的输出。\n\
    \n### 3. 网络训练\n\nHopfield 神经网络学习的目标是让网络具备记忆功能，给定网络的稳定状态 \\(s\\)，当输入其他不同于 \\(s\\\
    ) 的状态 \\(s'\\) 时，能够由 \\(s'\\) 逐渐更新到 \\(s\\)。例如，给定由 4 个神经元组成的 Hopfield 神经网络的稳定状态为\
    \ \\((1, -1, 1, -1)\\)，当输入 \\((1, 1, 1, 1)\\) 后，网络经过迭代更新最终可以收敛到 \\((1, -1, 1,\
    \ -1)\\)。\n\nHopfield 神经网络常见的学习方法有 Hebbian 法、Storkey 法和伪逆法。这里主要介绍 Hebbian 法。Hebbian\
    \ 理论是一种神经科学理论，突触后效应的增加源于突触前细胞对突触后细胞的反复和持续刺激。简而言之，当两个细胞同步激活时，细胞间的突触强度会增加。将 Hebbian\
    \ 理论运用在人工神经网络中，体现为两个神经元同步激活，权重增加，异步激活，权重减少。网络中的权重计算公式如下：\n\n\\[\nw_{ij} = \\begin{cases}\
    \ \\sum_{k=1}^K x_{ik}x_{jk}, & i \\neq j \\\\ 0, & i = j \\end{cases}\n\\]\n\n\
    其中，\\(x_{ik}\\) 是要存储的第 \\(k\\) 个模式中第 \\(i\\) 个神经元的状态。\n\n训练得到权重矩阵后，网络的参数就确定下来，网络的运行流程如下所示：\n\
    \n- 1) 对网络进行初始化，为每个神经元赋初始状态。\n- 2) 从网络中随机或按照顺序选取一个神经元。\n- 3) 更新该神经元的状态，其他神经元的状态保持不变。\n\
    - 4) 求当前状态下网络的能量，判断网络是否达到稳定状态，若达到稳定状态或满足给定条件（如限定迭代次数）则结束；否则转到 2）继续运行。\n\n离散型 Hopfield\
    \ 神经网络可以实现联想记忆，联想记忆是指当网络的输入是某种状态时，输出端也要给出相应的状态输出。但是 Hopfield 网络的记忆能力有限，当输入较多或者相似的时候，往往导致不能正确地判别输入，下一节要讲述的玻尔兹曼机可以解决这一问题。\n\
    \n### 6.3 玻尔兹曼机与受限玻尔兹曼机\n\n### 6.3.1 玻尔兹曼机\n\n玻尔兹曼机（Boltzmann Machine，BM）通常是指一种随机的离散型\
    \ Hopfield 神经网络，是具有隐单元的全连接反馈神经网络。这种网络在神经元状态变化中引入了统计概率，网络的平衡状态服从玻尔兹曼分布，网络运行机制基于模拟退火算法。\n\
    \n在 Hopfield 神经网络中，神经元的功能及其在网络中的地位是一样的，但在玻尔兹曼机中，一部分神经元与外部相连，称为可见单元，完成网络的输入、输出功能，或者严格地说可以受到外部条件的约束；另一部分神经元则不与外部相连，称作隐藏单元，在训练中起辅助作用。\n\
    \n图 6-3 展示的是一个包含 6 个神经元的玻尔兹曼机，其中 \\(v_1\\)、\\(v_2\\) 和 \\(v_3\\) 是隐藏单元，\\(v_4\\\
    )、\\(v_5\\) 和 \\(v_6\\) 是可见单元。与 Hopfield 神经网络一样，玻尔兹曼机神经元之间的权重是对称的，而且自身无连接：\\(w_{ji}=w_{ij}\\\
    )，\\(w_{ii}=0\\)。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_189_0.png)\n\n图\
    \ 6-3 包含 6 个神经元的玻尔兹曼机\n\n玻尔兹曼机中，神经元的状态为 0 或 1 的概率则取决于相应的输入。具体而言，单个神经元 \\(j\\)\
    \ 的净输入为\n\n\\[\nnet_j = \\sum_i w_{ji}x_i - b_j \\tag{6-5}\n\\]\n\n净输入并不能通过符号转移函数直接获得确定的输出状态，实际的输出状态将按照某种概率发生，输出某种状态的转移概率。神经元\
    \ \\(j\\) 的状态为 1 的概率为\n\n\\[\nP_j(1) = \\frac{1}{1+e^{-net_j/T}} \\tag{6-6}\n\\\
    ]\n\n其中 \\(T\\) 为温度系数。温度系数较大时，获得能量函数最小值的概率较低。反之，温度系数较小时，虽然获得能量函数最小值的概率增加了，但是玻尔兹曼机需要较长时间才能达到稳定状态。玻尔兹曼机的训练选择模拟退火算法（Simulated\
    \ Annealing）。为了避免上述情况的出现，可以先采用较大的温度系数进行粗调，然后逐渐减小温度系数进行微调。\n\n玻尔兹曼机使用模拟退火算法训练的步骤如下所示：\n\
    \n- 1) 初始化权重 \\(w_{ij}\\) 和阈值 \\(b_j\\)。\n- 2) 从 \\(n\\) 个神经元中随机地选取神经元 \\(j\\\
    )。\n- 3) 计算神经元 \\(j\\) 的输入：\\(net_j = \\sum_i w_{ji}x_i - b_j\\)。\n- 4) 以概率 \\\
    (P_j\\) 来决定神经元 \\(j\\) 的输出：\\(P_j(1)=\\frac{1}{1+e^{-net_j/T}}\\)。\n- 5) 其他神经元的状态保持不变，即\
    \ \\(\\forall i \\neq j, v_i(t+1) = v_i(t)\\)。\n- 6) 根据输出 \\(x_i\\) 和 \\(x_j\\\
    ) 的值，调整连接权重 \\(w_{ij}\\) 和阈值 \\(b_j\\)。\n- 7) 返回步骤 1)，不断迭代，直到网络不发生变化或满足终止条件。\n\
    \n### 6.3.2 受限玻尔兹曼机\n\n受限玻尔兹曼机（Restricted Boltzmann Machine，RBM）是玻尔兹曼机的受限版本[6]，由\
    \ Ruslan Salakhutdinov 等人提出。玻尔兹曼机中的神经元之间具有双向连接，这种模型的特点是可以基于模型的抽样从未知的概率分布中学习样本的重要特征。然而，这种学习的过程是非常困难和耗时的，因此在求解实际问题时使用的并不多，RBM\
    \ 的提出就是通过在玻尔兹曼机网络拓扑结构上加上一些限制来缓解这一问题。\n\n具体来说，RBM 是一个马尔可夫随机场（Markov Random Field，MRF），也是一个双边无向图模型，如图\
    \ 6-4 所示。图 6-4 中有 \\(m\\) 个可见神经元 \\(\\boldsymbol{v}=(v_1, v_2, \\cdots, v_m)\\\
    )，表示可见数据，还有 \\(n\\) 个隐藏神经元 \\(\\boldsymbol{h}=(h_1, h_2, \\cdots, h_n)\\)，用来表示可见变量之间的依赖。这里主要关注二元\
    \ RBM，即 \\((\\boldsymbol{v}, \\boldsymbol{h})\\) 随机变量值的值域为 \\(\\{0, 1\\}\\)。模型\
    \ \\((\\boldsymbol{v}, \\boldsymbol{h})\\) 的概率分布为\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_190_0.png)\n\
    \n\\[\np(\\boldsymbol{v}, \\boldsymbol{h}) = \\frac{1}{Z} e^{-E(\\boldsymbol{v},\
    \ \\boldsymbol{h})} \\tag{6-7}\n\\]\n\n那么可见变量 \\(\\boldsymbol{v}\\) 的概率分布即为联合分布的边缘分布：\n\
    \n\\[\np(\\boldsymbol{v}) = \\sum_h p(\\boldsymbol{v}, \\boldsymbol{h}) = \\frac{1}{Z}\
    \ \\sum_h e^{-E(\\boldsymbol{v}, \\boldsymbol{h})} \\tag{6-8}\n\\]\n\n其中，\\(Z\
