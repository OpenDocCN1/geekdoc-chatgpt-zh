    如图 2-48 所示，FCN 中的上采样过程如下所示：


    +   1) 对于 FCN-32s 分割，直接对 pool5 特征图进行 32 倍的上采样，获得 32×上采样特征图，再对 32×上采样特征图的每个点做 Softmax
    分类预测，获得 32×上采样预测，即 FCN-32s 分割图。


    +   2) 对于 FCN-16s 分割，首先对 pool5 特征图进行 2 倍上采样，获得 2×上采样特征图，再把 pool4 特征图和 2×上采样特征图逐点相加，然后对相加的特征图进行
    16 倍上采样，并进行 Softmax 分类预测，获得 16×上采样预测，即 FCN-16s 分割图。


    +   3) 对于 FCN-8s 分割，首先把 pool4 特征图和 pool5 的 2×上采样特征图逐点相加，再进行 2 倍上采样，然后与 pool3 特征图逐点相加，然后对相加的特征图进行
    8 倍上采样，并进行 Softmax 分类预测，获得 8×上采样预测，即 FCN-8s 分割图。


    上采样（Upsampling）一般包括 2 种方式：1）调整尺寸，如使用双线性插值进行图像放大；2）逆卷积（Deconvolution）。逆卷积与卷积的操作示例如下所示：1）先做卷积，对于大小为
    m×m 特征图，用小为 k×k 的卷积核做卷积，步长为 1，则得到的特征图大小为 （m-k+1）×(m-k+1)；2）再做逆卷积，对大小为 （m-k+1）×(m-k+1）特征图先进行
    （k-1）层的填充（Padding），再用大小为 k×k 的卷积核做卷积，则得到的特征图的大小为 （m-k+1）+2(k-1) -k+1 = m。


    在 FCN 的基础上，产生了多种变体，其中 SegNet[23] 比较著名，它采用了 Encoder-Decoder 结构，如图 2-49 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_81_0.png)


    SegNet 的 Encoder 骨干网络是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个最大池化层，进行 2×2
    最大池化时，存储相应的最大池化位置索引。


    SegNet 的 Decoder 骨干网络也是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个上采样层，采用 Encoder
    存储的最大池化位置索引进行上采样。使用 K 类 Softmax 分类器预测每个像素的类别。


    UNet[24] 是一个广泛应用于医疗图像分割的经典模型，也采用 Encoder-Decoder 结构，如图 2-50 所示。


    在 UNet 中，左半部分是 Encoder，由两个 3×3 的卷积层（含激活函数 ReLU）再加上一个 2×2 的最大池化层组成，一共下采样 4 次。右半部分是
    Decoder，由一个上采样的 2×2 逆卷积层加上特征拼接再加上两个 3×3 的卷积层（含激活函数 ReLU）组成，也相应地上采样 4 次。'
