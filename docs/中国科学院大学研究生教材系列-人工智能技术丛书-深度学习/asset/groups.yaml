    ## 6.7 扩散模型


    近期，扩散模型（Diffusion Model）超越了生成对抗网络，成为图像生成任务的一种新范式，并且取得了十分显著的进展，也引发了人们对扩散模型的研究热潮。扩散模型的相关工作大都起源于
    OpenAI 于 2020 年提出的降噪扩散概率模型（Denoising Diffusion Probabilistic Model，DDPM）[4]，下面我们基于
    DDPM 对扩散模型进行介绍。


    DDPM 包含前向过程（Forward Process）和逆向过程（Reverse Process），前向过程又称为扩散过程（Diffusion Process），本质上是在输入图像数据的基础上逐步注入符合高斯分布的随机噪声，直至图像数据本身变为服从标准高斯分布的随机噪声；而逆向过程，则是进行图像生成的推断过程，当给定一个服从标准高斯分布的噪声，逐步去除噪声从而还原图像。DDPM
    的前向过程与逆向过程如图 6-15 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_200_0.png)


    ### 6.7.1 前向过程


    前向过程如图 6-15 中的虚线箭头所示的 \( q \) 过程，给定真实图像 \( x_0 \sim q(x_0) \) 和 \( T \) 个方差超参数
    \( \beta = \{\beta_i \in (0, 1)\}_{i=1}^T \)，前向过程会逐步在图像中添加高斯噪声，得到图像集合 \(\{x_1,
    x_2, \cdots, x_T\}\)。此外，每个时刻的状态只与前一时刻的状态相关，因此前向过程是一个马尔可夫过程。基于文献 [4] 和 [11]，对前向过程展开描述如下：


    以第 \( t \) 步为例，\( x_t \) 仅与 \( x_{t-1} \) 相关，那么有


    \( q(x_t | x_{t-1}) = \mathcal{N}(x_t; \sqrt{1-\beta_t}x_{t-1}, \beta_t I) \)
    (6-34)


    \( q(x_{1:T} | x_0) = \Pi_{t=1}^T q(x_t | x_{t-1}) \) (6-35)


    对于一个高斯分布 \(\mathcal{N}(x; \mu_\theta, \sigma_\theta^2 I)\)，如果要从中采样一个 \( x \)，利用重参数技巧，可以将采样写成


    \( x = \mu_\theta + \sigma_\theta \odot \epsilon, \quad \epsilon \sim \mathcal{N}(0,
    I) \) (6-36)


    因此，对于前向过程中任意步骤的状态 \( x_t \)，可以表示为


    \( x_t = \sqrt{1-\beta_t}x_{t-1} + \sqrt{\beta_t}\epsilon_{t-1} \)


    \( = \sqrt{1-\beta_t} (\sqrt{1-\beta_{t-1}}x_{t-2} + \sqrt{\beta_{t-1}}\epsilon_{t-2})
    + \sqrt{\beta_t}\epsilon_{t-1} \)


    \( = \sqrt{(1-\beta_t)(1-\beta_{t-1})}x_{t-2} + (\sqrt{(1-\beta_t)\beta_{t-1}}\epsilon_{t-2}
    + \sqrt{\beta_t}\epsilon_{t-1}) \) (6-37)


    其中，\( \epsilon_{t-1}, \epsilon_{t-2} \sim \mathcal{N}(0, I) \)。此外，对于两个独立的高斯分布
    \( X \sim \mathcal{N}(\mu_x, \sigma_x^2 I) \) 与 \( Y \sim \mathcal{N}(\mu_y, \sigma_y^2
    I) \)，它们的和仍然服从高斯分布，即 \( X+Y \sim \mathcal{N}(\mu_x+\mu_y, (\sigma_x^2+\sigma_y^2)I)
    \)，因此式 (6-37) 后一项可写为


    \( \sqrt{(1-\beta_t)\beta_{t-1}}\epsilon_{t-2} + \sqrt{\beta_t}\epsilon_{t-1}
    = \sqrt{(1-\beta_t)\beta_{t-1}+\beta_t}\bar{\epsilon}_{t-2}, \quad \bar{\epsilon}_{t-2}
    \sim \mathcal{N}(0, I) \) (6-38)


    代入 \( x_t \) 中，有


    \( x_t = \sqrt{(1-\beta_t)(1-\beta_{t-1})}x_{t-2} + \sqrt{(1-\beta_t)\beta_{t-1}+\beta_t}\bar{\epsilon}_{t-2},
    \quad \bar{\epsilon}_{t-2} \sim \mathcal{N}(0, I) \) (6-39)


    不妨令 \( \alpha_t = 1-\beta_t, \bar{\alpha}_t = \Pi_{i=1}^t \alpha_i \)，代入式 (6-39)，得到


    \( x_t = \sqrt{\alpha_t \alpha_{t-1}}x_{t-2} + \sqrt{\alpha_t(1-\alpha_{t-1})+1-\alpha_t}\bar{\epsilon}_{t-2}
    \)


    \( = \sqrt{\alpha_t \alpha_{t-1}}x_{t-2} + \sqrt{1-\alpha_t \alpha_{t-1}}\bar{\epsilon}_{t-2}
    \)


    \( = \cdots \)


    \( = \sqrt{\bar{\alpha}_t}x_0 + \sqrt{1-\bar{\alpha}_t}\bar{\epsilon}_0, \quad
    \bar{\epsilon}_{-2}, \cdots, \bar{\epsilon}_0 \sim \mathcal{N}(0, I) \) (6-40)


    至此，可以发现在给定方差超参数集合 \(\beta\) 的前提下，任意时刻的 \(x_t\) 都可以使用 \(x_0\) 和 \(\beta\) 来表示，即


    \(q(x_t | x_0) = \mathcal{N}(x_t; \sqrt{\bar{\alpha}_t}x_0, (1-\bar{\alpha}_t)I)\)
    (6-41)


    其中，\(\alpha_t = 1-\beta_t\)，\(\bar{\alpha}_t = \Pi_{i=1}^t \alpha_i\)，且当 \(T \to
    \infty\)，\(\bar{\alpha}_t = \Pi_{i=1}^t \alpha_i \to 0\)，从而 \(x_T \sim \mathcal{N}(0,
    I)\)，即当前向过程的步数趋于无穷大时，\(x_T\) 最终将变为服从标准高斯分布的随机噪声。


    如图 6-16 所示为 DDPM 前向过程的简单示例，将 \(T\) 设置为 100，方差超参数 \(\beta_t\) 从 0.0001 递增到 0.1，可以发现当步数增多，原始图像也逐渐变得难以辨认直到完全变为随机噪声。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_201_0.png)


    图 6-16 DDPM 前向过程示例（\(T=100\), \(\beta\) 从 0.0001 递增到 0.1）（详见彩插）


    ### 6.7.2 逆向过程


    在前向过程中，通过 \(q(x_t | x_{t-1})\) 逐步将真实图像 \(x_0\) 变为标准高斯分布噪声 \(x_T\)；反之，如果可以获取前向过程每一步的真实逆向分布
    \(q(x_{t-1} | x_t)\)，那也可以从一个标准高斯分布 \(x_T\) 逐步去除噪声还原得到原始图像 \(x_0\)，即逆向推断过程。但实际上无法直接对真实逆向分布
    \(q(x_{t-1} | x_t)\) 进行推断，DDPM 使用神经网络 \(p_\theta(x_{t-1} | x_t)\) 对逆向分布进行预测，如图
    6-15 所示。基于文献 [4] 和 [11]，对逆向过程展开描述如下：


    逆向分布 \(p_\theta\) 可以表示为


    \(p_\theta(x_{0:T}) = p_\theta(x_T) \prod_{t=1}^T p_\theta(x_{t-1} | x_t)\) (6-42)

    \(p_\theta(x_{t-1} | x_t) = \mathcal{N}(x_{t-1}; \mu_\theta(x_t, t), \Sigma_\theta(x_t,
    t))\) (6-43)


    DDPM 模型的目标则是学习到正确的 \(\mu_\theta(x_t, t)\) 和 \(\Sigma_\theta(x_t, t)\) 预测。虽然无法通过前向过程的分布
    \(q(x_t | x_{t-1})\) 去简单地推断出真实的逆向分布 \(q(x_{t-1} | x_t)\)，但是可以将 \(x_0\) 引入，根据贝叶斯公式，有


    \( q(x_{t-1} \mid x_t, x_0) = \frac{q(x_{t-1})q(x_0 \mid x_{t-1})q(x_t \mid x_{t-1},
    x_0)}{q(x_0)q(x_t \mid x_0)} = \frac{q(x_{t-1} \mid x_0)q(x_t \mid x_{t-1}, x_0)}{q(x_t
    \mid x_0)} \)


    不妨将 \( q(x_{t-1} \mid x_t, x_0) \) 的均值和方差表示为 \( \widetilde{\mu}_t(x_t, x_0) \)
    和 \( \widetilde{\beta}_t \)，即


    \( q(x_{t-1} \mid x_t, x_0) = \mathcal{N}(x_{t-1}; \widetilde{\mu}_t(x_t, x_0),
    \widetilde{\beta}_t \mathbf{I}) \)


    前面提到前向过程为马尔可夫链，并且任一时间步的 \( x_t \) 都可以使用 \( x_0 \) 和 \( \beta \) 来表示，那么可以将公式 (6-44)
    中的每一分项分别表示为


    \( q(x_t \mid x_{t-1}, x_0) = q(x_t \mid x_{t-1}) = \mathcal{N}(x_t; \sqrt{1-\beta_t}x_{t-1},
    \beta_t \mathbf{I}) \)


    \( q(x_{t-1} \mid x_0) = \mathcal{N}(x_{t-1}; \sqrt{\bar{\alpha}_{t-1}}x_0, (1-\bar{\alpha}_{t-1})
    \mathbf{I}) \)


    \( q(x_t \mid x_0) = \mathcal{N}(x_t; \sqrt{\bar{\alpha}_t}x_0, (1-\bar{\alpha}_t)
    \mathbf{I}) \)


    对于一个一元高斯分布 \( x \sim \mathcal{N}(\mu, \sigma^2) \)，其概率密度函数为 \( f(x) = \frac{1}{\sqrt{2\pi}\sigma}\exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right)
    \)。参照这一定义，将上述每一分项高斯分布的概率密度函数的指数部分代入，有


    \( q(x_{t-1} \mid x_t, x_0) = \frac{q(x_{t-1} \mid x_0)q(x_t \mid x_{t-1}, x_0)}{q(x_t
    \mid x_0)} \propto \frac{\exp\left(-\frac{(x_{t-1} - \sqrt{\bar{\alpha}_{t-1}}x_0)^2}{2(1-\bar{\alpha}_{t-1})}\right)\exp\left(-\frac{(x_t
    - \sqrt{1-\beta_t}x_{t-1})^2}{2\beta_t}\right)}{\exp\left(-\frac{(x_t - \sqrt{\bar{\alpha}_t}x_0)^2}{2(1-\bar{\alpha}_t)}\right)}
    = \exp\left(-\frac{1}{2}\left(\frac{(x_{t-1} - \sqrt{\bar{\alpha}_{t-1}}x_0)^2}{(1-\bar{\alpha}_{t-1})}
    + \frac{(x_t - \sqrt{1-\beta_t}x_{t-1})^2}{\beta_t} - \frac{(x_t - \sqrt{\bar{\alpha}_t}x_0)^2}{(1-\bar{\alpha}_t)}\right)\right)
    = \exp\left(-\frac{1}{2}\left(\underbrace{\left(\frac{1}{1-\bar{\alpha}_{t-1}}
    + \frac{1-\beta_t}{\beta_t}\right)}_{1} x_{t-1}^2 - \underbrace{\left(\frac{2\sqrt{\bar{\alpha}_{t-1}}x_0}{1-\bar{\alpha}_{t-1}}
    + \frac{2\sqrt{1-\beta_t}x_t}{\beta_t}\right)}_{2} x_{t-1} + C(x_t, x_0)\right)\right)
    \)


    其中，\( C(x_t, x_0) \) 为与 \( x_{t-1} \) 无关项的组合，可以忽略。此外，一元高斯分布概率密度函数的指数部分可以展开： \(
    \exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right) = \exp\left(-\frac{1}{2}\left(\frac{1}{\sigma^2}x^2
    - \frac{2\mu}{\sigma^2}x + \frac{\mu^2}{\sigma^2}\right)\right) \)，\( \frac{1}{\sigma^2}
    \) 和 \( \frac{2\mu}{\sigma^2} \) 分别对应公式 (6-49) 中的 ① 部分和 ② 部分，即


    \( \frac{1}{\tilde{\beta}_t} = \underbrace{\left(\frac{1}{1-\bar{\alpha}_{t-1}}
    + \frac{1-\beta_t}{\beta_t}\right)}_{0} = \frac{1-\bar{\alpha}_t}{(1-\bar{\alpha}_{t-1})\beta_t}
    \)


    \(\frac{2\mu}{\sigma^2}\) 对应②部分：


    \[ \frac{2\tilde{\mu}_t(x_t, x_0)}{\tilde{\beta}_t} = \left( \frac{2\sqrt{\bar{\alpha}_{t-1}}x_0}{1-\bar{\alpha}_{t-1}}
    + \frac{2\sqrt{1-\beta_t}x_t}{\beta_t} \right) \tag{6-51} \]


    根据公式 (6-50) 和公式 (6-51)，可以求得 \(q(x_{t-1} | x_t, x_0)\) 的均值 \(\tilde{\mu}_t(x_t,
    x_0)\) 和方差 \(\tilde{\beta}_t\)：


    \[ \tilde{\mu}_t(x_t, x_0) = \frac{\sqrt{\bar{\alpha}_{t-1}}\beta_t x_0 + (1-\bar{\alpha}_{t-1})\sqrt{\alpha_t}x_t}{1-\bar{\alpha}_t},
    \quad \tilde{\beta}_t = \frac{(1-\bar{\alpha}_{t-1})\beta_t}{1-\bar{\alpha}_t}
    \tag{6-52} \]


    目前为止，推导出了 \(q(x_{t-1} | x_t, x_0)\) 的详细分布，其中方差 \(\tilde{\beta}_t\) 为一个定量，由前面设置的方差超参数确定，而均值
    \(\tilde{\mu}_t(x_t, x_0)\) 依赖于 \(x_t\) 和 \(x_0\)。实际上，去噪从而得到 \(x_0\) 是 DDPM 逆向过程的最终目标，但是无法在当前步获取其准确值。针对这一问题，需要引入前向过程中已得到的
    \(x_t = \sqrt{\bar{\alpha}_t}x_0 + \sqrt{1-\bar{\alpha}_t}\bar{\epsilon}_0, \bar{\epsilon}_0
    \sim \mathcal{N}(0, \mathbf{I})\)，反之可以得到 \(x_0 = \frac{1}{\sqrt{\bar{\alpha}_t}}(x_t
    - \sqrt{1-\bar{\alpha}_t}\bar{\epsilon}_0)\)，代入公式 (6-52) 中的 \(\tilde{\mu}_t(x_t,
    x_0)\)，有


    \[ \tilde{\mu}_t(x_t, x_0) = \frac{1}{\sqrt{\alpha_t}} \left( x_t - \frac{\beta_t}{\sqrt{1-\bar{\alpha}_t}}\bar{\epsilon}_0
    \right) \tag{6-53} \]


    虽然去除了 \(x_0\) 的影响，但是引入了一个新的变量 \(\bar{\epsilon}_0\)，\(\bar{\epsilon}_0\) 在前向过程中为标准高斯分布采样的噪声，但是在逆向过程中无法得知其真实值，DDPM
    的做法是引入一个参数化的神经网络模型 \(\epsilon_\theta(x_t, t)\) 去预测高斯噪声 \(\bar{\epsilon}_0\)，\(\theta\)
    表示模型的参数。


    至此，已经可以确定 DDPM 需要学习的逆向过程 \(p_\theta(x_{t-1} | x_t)\) 的分布：


    \[ p_\theta(x_{t-1} | x_t) = \mathcal{N}(x_{t-1}; \mu_\theta(x_t, t), \Sigma_\theta(x_t,
    t)) \tag{6-54} \]


    其中：


    \[ \mu_\theta(x_t, t) = \frac{1}{\sqrt{\alpha_t}} \left( x_t - \frac{\beta_t}{\sqrt{1-\bar{\alpha}_t}}\epsilon_\theta(x_t,
    t) \right), \quad \Sigma_\theta(x_t, t) = \tilde{\beta}_t = \frac{(1-\bar{\alpha}_{t-1})\beta_t}{1-\bar{\alpha}_t}
    \simeq \beta_t \tag{6-55} \]


    因此，DDPM 逆向过程可总结为：在给定 \(x_t\) 的前提下，首先预测高斯噪声 \(\epsilon_\theta(x_t, t)\)，然后计算 \(p_\theta(x_{t-1}
    | x_t)\) 的均值 \(\mu_\theta(x_t, t)\) 和方差 \(\Sigma_\theta(x_t, t)\)，最后通过重参数技巧计算得到
    \(x_{t-1}\) 完成一步推断，循环进行直至得到 \(x_0\)。


