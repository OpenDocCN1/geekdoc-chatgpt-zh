  - '[PAGE 18]


    # 序


    如果从 1943 年 M-P 神经元模型的提出算起，人工智能已经走过了 80 年的发展历程。从人工智能的发展阶段来看，几乎都与人工神经网络的发展息息相关，经历了多个蓬勃发展期和低谷期，例如：人工神经网络自提出以来，经过
    20 多年的快速发展，由于 1969 年 Marvin Minsky 和 Seymour Papert 指出感知机无法解决异或操作这样的线性不可分问题而陷入低谷；1986
    年，David Rumelhart 等人重新独立提出了多层感知机的反向传播算法，解决了之前的线性不可分问题，使得人工神经网络重新焕发了活力；1995 年，Corinna
    Cortes 等人提出支持向量机算法，它的高效性使得人工神经网络的发展再次出现停滞；2006 年，Geoffrey Hinton 提出深度学习的概念，深度学习技术在多个应用领域取得了突破性的成绩，这使得人工神经网络再次进入快速发展期；2023
    年，伴随着大型语言模型的爆发，人工智能的发展又进入了新的时代，人们对人工智能的未来充满了期待。近十年来，作为人工智能中最引人注目的技术，深度学习成为学术界和产业界持续关注的焦点。


    我本人也从事人工智能研究多年，在研究中大量使用了深度学习技术，对于深度学习以及人工智能的发展有一些自己的思考。


    首先，有了深度学习，传统的机器学习是否被弱化了？从近些年的发展情况来看，深度学习确实解决了很多传统机器学习无法解决的问题，但是深度学习也有它的适用领域，它更适用于计算机视觉、语音识别和自然语言处理领域的任务，而对于结构化数据的分析与处理，还需要传统的机器学习来解决，传统机器学习的效率和效果甚至要好于深度学习的。


    其次，以深度学习为代表的统计机器学习是不是万能的？深度学习方法虽然效果很好，但是需要基于大量数据来训练模型，成本较高，并且缺乏可解释性，是不是还有其他方法不需要大量数据就能解决问题？这可以从两方面来看：存在既定逻辑、规则或者可表示为数学方程的问题，可以不使用深度学习或者其他统计机器学习方法来解决，而对于无法预知数据规律或无法用数学方程定义的问题，就需要用深度学习或者其他统计机器学习方法来解决。


    最后，谈一下对大模型的认识，大模型的出现是否会影响传统的小模型研究？从近期情况来看，小模型研究确实受到了较大的冲击，很多人认为大模型能解决的问题，就没必要再用小模型去做了。但是，这有可能过高估计了大模型的能力。大模型的网络结构并不复杂，'
  - '[PAGE 19]


    它并不能很好地解决所有问题，小模型在某些特定情况下也有其优势，对它的研究还是很有必要的。


    作为徐俊刚教授的同事，我对他比较了解。他于 2018 ~ 2019 学年春季学期在中国科学院大学首次开设“深度学习”课程，并担任该课程的首席教授。目前该课程已开课多次，受到同学们的欢迎，选课人数一直居高不下。“深度学习”课程在
    2021 年被评为“中国科学院大学校级优秀研究生课程”。徐俊刚教授长期从事大数据与人工智能领域的研究工作，在大数据、深度学习、自动机器学习等领域都做出了很多代表性的学术成果，相关成果也用于“深度学习”课程教学，很好地贯彻了中国科学院大学科教融合的办学思想。


    希望本书的出版能进一步促进我国人工智能人才的培养，为我国人工智能领域学术研究与产业发展贡献一份力量。


    黄庆明

    中国科学院大学

    2023 年 12 月于北京'
  - '[PAGE 20]


    # 前 言


    ChatGPT 等大型语言模型的出现引发了新一轮人工智能浪潮，这被认为是继互联网之后信息技术发展史上的又一个里程碑。ChatGPT 等大型语言模型均基于 Transformer
    构建，Transformer 本身就是一种深度学习模型，这足以说明深度学习在人工智能中具有举足轻重的地位。深度学习在计算机视觉、语音识别和自然语言处理等领域都取得了大量突破性的成果，很多成果已经在我国经济与社会发展、人民生产生活中发挥了重要作用，如人脸识别、语音识别、语音合成、机器翻译、问答系统和产品缺陷检测等。目前，深度学习的应用领域还在不断扩展，如基于
    AI 的内容生成、蛋白质结构预测、新兴材料结构预测、天气预报以及数学发现等，并且在部分领域已经取得了重要进展。


    2018 ~ 2019 学年春季学期，我在中国科学院大学首次开设了“深度学习”课程，选课人数超过 400 人，由于当时市面上并没有合适的教材可用，为了讲好这门课，我花费了大量时间备课，好在自己的研究方向跟深度学习紧密相关，积累了不少素材，但仍阅读了大量文献资料来撰写讲义和制作课件。我很早就有将课程讲义完善并出版的想法，但是由于教学科研工作繁忙，直到学校批复“深度学习”课程要出版教材，我才付诸行动。在此要感谢学校教务处田晨晨老师和计算机学院杨林春老师在本书撰写过程中的支持与帮助，同时也要感谢机械工业出版社对本书出版工作的大力支持。


    作为高等学校教材，本书写作的初衷是希望帮助同学们掌握深度学习的基本原理、核心技术以及实践技能。全书共分 8 章，各章内容相对独立，在讲授或者阅读时不一定要按照顺序进行。第
    1 章概要介绍了深度学习的基本概念、典型算法及应用；第 2 ~ 5 章是本书的核心内容，详细介绍了卷积神经网络、循环神经网络、Transformer 和生成对抗网络的相关知识；第
    6 章介绍了一些典型的深度生成模型以及近期比较流行的扩散模型；第 7 章介绍了深度学习中常用的正则化与优化方法；第 8 章介绍了 TensorFlow、PyTorch
    和飞桨三个常用的深度学习框架。此外，附录中还给出了一些数学基础知识和中英文术语对照。


    每章都给出了复习题，以帮助读者复习该章内容。同时，我认为只有通过动手实践才能深刻领会深度学习算法的精髓，因此，第 2 ~ 7 章都给出了一些实验题，便于选用本书的教师有选择地安排教学实验。此外，为了让读者更好地了解深度学习的起源与发展，在每章最后'
  - '[PAGE 21]


    还开设了“本章人物”专栏，介绍与该章内容相关的著名科学家。


    当然，由于深度学习技术的发展日新月异，本书并没有覆盖深度学习的全部内容，希望再版时能够不断更新，也希望广大读者提出宝贵建议。


    本书能够完成，还要感谢“深度学习”课程教学团队的张新锋老师、林姝老师和万方老师的支持与帮助，感谢 CCIP 实验室的各位同学，包括李鹏飞、李帅敏、景琨、王义宇、刘淼、李科尧、向迅之、王迪、陈旭、邱柏瑜、夏琦等。北京交通大学于剑教授审阅了教材全稿并提出了很好的修改建议，在此对于剑教授表示衷心的感谢。此外，本书参考了大量学术文献与互联网资源，在此对文献与资源作者同样表示衷心的感谢！


    最后，由于本人能力有限，书中难免会有不当和错误之处，还请各位读者不吝告知，我将及时纠正！


    徐俊刚

    中国科学院大学

    2024 年 4 月于北京'
