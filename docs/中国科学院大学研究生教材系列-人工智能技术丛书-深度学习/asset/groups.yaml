    # A. 2.2 链式法则


    链式法则是求复合函数的导数（偏导数）的法则，若 \( I, J \) 是直线上的开区间，函数 \( f(x) \) 在 \( I \) 上有定义（\( a
    \in I \)），在 \( a \) 处可微，函数 \( g(y) \) 在 \( J \) 上有定义（\( J \subset f(I) \)），在 \(
    f(a) \) 处可微，则复合函数 \( (g \circ f)(x) = g(f(x)) \) 在 \( a \) 处可微（\( g \circ f \)
    在 \( I \) 上有定义），且 \( (g \circ f)''(a) = g''(f(a))f''(a) \)。若记 \( u=g(y), y=f(x)
    \)，而 \( f \) 在 \( I \) 上可微，\( g \) 在 \( J \) 上可微，则在 \( I \) 上任意点 \( x \) 有 \(
