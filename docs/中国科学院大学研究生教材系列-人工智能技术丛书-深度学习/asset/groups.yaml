    - 图像分类。整幅图像的分类，如手写数字识别、猫狗分类等。

    - 目标检测。检测图像或视频中物体的位置并识别物体类别，如行人检测、车辆检测等。

    - 图像分割。将图像中的物体按边缘进行分割并识别物体类别或个体，图像分割通常又分为语义分割与实例分割，语义分割是像素级别上的分类，实例分割在语义分割的基础上识别个体，如街景分割、细胞分割等。

    - 图像回归。预测图像中物体或者物体组成部分的坐标，如人脸中的关键点检测、人体关键点检测等。


    计算机视觉领域的高级任务主要包括：


    - 人脸识别。首先通过目标检测提取人的正脸，之后使用卷积神经网络提取人脸的有效特征，进而识别该人脸对应人员的身份。

    - 行人重识别。首先通过目标检测检测出行人，之后通过卷积神经网络提取人体的有效特征，包括穿着、骨架甚至步态等，进而识别该行人的身份。

    - 目标跟踪。结合目标检测算法和跟踪算法在连续的视频帧中定位某一行人或者其他运动目标。

    - 动作识别。识别视频中人体的动作/行为，一般分为基于双流的方法和基于人体关键点的方法。

    - 缺陷检测。通过深度学习方法识别工业产品中的缺陷，如紧固件缺失检测、建筑缺陷检测和金属表面缺陷检测等。当然，高级任务还有很多，这里就不一一列举了。


    ### 1.4.2 深度学习在语音处理领域的应用


    深度学习在语音处理领域也取得了丰富的成果，与传统的语音处理技术相比，在识别准确率等指标上都有很大提升。深度学习在语音处理领域的应用主要有三大类：语音识别、声纹识别和语音合成。


    语音识别是指将人类说话的语音转换成文字，基本流程如下：


    - 首先对训练集中的语音信号进行预处理和特征提取，并训练声学模型；

    - 通过训练大量语料，学习词与词之间的序列关系，获得语言模型；

    - 对测试语音进行预处理和特征提取，计算声学模型得分与语言模型得分；

    - 将总得分最高的词序列作为识别结果。


    声纹识别是指根据说话人的声波特性进行身份识别，又称为说话人识别，基本流程如下：


    - 首先对训练集中的语音信号进行预处理和特征提取，并训练声纹模型；

    - 对测试语音进行预处理和特征提取，基于声纹模型进行分类，获得识别结果。


    语音合成是指将文本转换为语音的技术，基本流程如下：


    - 文本处理。首先进行文本语种判断与文本切分，之后根据文字拼音将文字转换为音素，并进行停顿、重读、轻读等文字韵律预测。

    - 语音分析。传统的语音合成技术主要通过波形拼接的方法，但是这种方法的缺点是语音过度生硬、不自然，而深度学习方法目前已经成为语音合成领域的主流方法，主要采用的是端到端的语音合成技术，也就是在训练所得语音合成模型的基础上，输入文本，输出就是相应的语音。


    ### 1.4.3 深度学习在自然语言处理领域的应用


    自 2010 年循环神经网络语言模型提出以来，以 LSTM 和 Transformer 为代表的深度学习算法在很多自然语言处理任务上都取得了很好的效果。同计算机视觉领域一样，可以把深度学习在自然语言处理领域的应用也分为两大类：基础任务和高级任务。基础任务是指一些偏基础性、通用性的任务；高级任务是指一些偏应用性的任务，它们一般需要基于基础任务来完成。


    自然语言处理领域的基础任务主要包括：


    - 词法分析。以词为单位进行分析，包括词性标注、拼写校正等。

    - 句法分析。以句子为单位进行分析，主要包括句法结构分析和依存句法分析等。

    - 语义分析。分析自然语言的深层含义，包括词汇级语义分析、句子级语义分析和篇章级语义分析。

    - 信息抽取。从自然语言中抽取出结构化信息，包括实体抽取、事件抽取等。

    - 语言模型。根据之前的单词预测下一个单词。


    自然语言处理领域的高级任务主要包括：


    - 情感分析。分析文本体现的情感，可包含正负向、正负中或多态度等类型。

    - 神经机器翻译。基于神经网络语言模型的多语种互译。

    - 自动文本摘要。根据单文档或者多文档自动生成文档摘要。

    - 机器阅读理解。通过阅读文本回答问题、完成选择题或完形填空。

    - 自动问答。用户给出问题，机器可以进行回答，也称单轮对话。

    - 人机对话。通过训练大量语料，支持人与机器之间的自由对话，通常指的是多轮对话。当然，高级任务还有很多，这里也不一一列举了。


    ### 1.4.4 深度学习在多模态处理领域的应用


    不管是图像、语音还是文本，认为它们都是单模态的。在实际应用中，还有大量的多模态应用场景，如图像描述、可视问答、图像生成、视频生成、虚拟主播等。深度学习在这些多模态处理领域也发挥了强大的作用，具体来说：


    - 图像描述。机器可以根据图像给出描述图像的句子，也称看图说话。

    - 可视问答。机器可以回答特定图像或视频相关的问题。

    - 图像生成。机器可以根据文本描述生成相应的图像。

    - 视频生成。机器可以根据文字描述自动生成相应的视频。

    - 虚拟主播。自动播报新闻的虚拟人物。当然，深度学习在多模态处理领域的应用还有很多，这里也不一一列举了。


    ### 1.5 本书的组织结构


    本书介绍深度学习的基本概念、典型深度学习算法及其应用、正则化与优化方法、常见深度学习框架等，组织结构如图 1-14 所示。


    - 第 1 章：引言。该章主要介绍深度学习的起源与发展，深度学习与机器学习、人工智能的关系，深度学习的基本概念和典型算法以及深度学习的主要应用概述。

    - 第 2 章：卷积神经网络。该章主要介绍卷积神经网络的起源与发展、卷积神经网络的基本结构、卷积神经网络的训练、典型卷积神经网络以及卷积神经网络的主要应用。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_42_0.png)


    图 1-14 本书的组织结构


    - 第 3 章：循环神经网络。该章主要介绍循环神经网络的起源与发展、循环神经网络的结构与训练、长短期记忆网络、循环神经网络的变种以及循环神经网络的主要应用。

    - 第 4 章：Transformer。该章主要介绍注意力机制、Transformer 概述、基于 Transformer 的预训练大模型 GPT 与 BERT
    以及 Transformer 的主要应用。

    - 第 5 章：生成对抗网络。该章主要介绍生成对抗网络的产生背景、生成对抗网络的基本原理、生成对抗网络的优化与改进以及生成对抗网络的主要应用。

    - 第 6 章：深度生成模型。该章主要介绍深度信念网络、深度玻尔兹曼机、深度自编码器、扩散模型等，同时介绍它们的一些基础模型，包括 Hopfield 神经网络、玻尔兹曼机、受限玻尔兹曼机、自编码器及其主要变种。

    - 第 7 章：正则化与优化。该章主要介绍参数范数正则化、数据增强、Bagging、提前终止、Dropout、归一化等正则化方法，以及梯度下降法、基于动量的方法等优化算法。

    - 第 8 章：深度学习框架。该章概述了常见的深度学习框架，详细介绍了 TensorFlow、PyTorch 和飞桨三个深度学习框架。


    ### 复习题


    - 1. 请简述深度学习的起源与发展。

    - 2. 请简述深度学习与机器学习、人工智能的关系。

    - 3. 请简述浅层学习与深度学习的主要区别，并举例说明。

    - 4. 请列出一些典型的深度学习算法，并简述它们的主要功能。

    - 5. 请举出一些深度学习的应用案例。


