  mdcn: "\n共用一个判别器来判断来自真实音乐还是生成器。与第二种方式相比，混合模式更加灵活，可以在生成器模型中使用不同的参数（如层数、卷积核大小等），将音轨的独立生成和全局和谐结合起来，如图\
    \ 5-20 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_178_0.png)\n\n图 5-20 混合模型\n\
    \n### (3) 时序模型\n\n以上三种模型只能逐小节生成多音轨音乐，而小节之间可能没有连贯性。因此需要一个时序模型来生成多小节音乐。MuseGAN 给出了两种时态模型：重头（From\
    \ Scratch）生成模型与条件音轨（Track-Conditional）生成模型。\n\n如图 5-21 所示，将生成器分为两个子网络：时序生成器 \\\
    (G_{temp}\\) 和小节生成器 \\(G_{bar}\\)。\\(G_{temp}\\) 将一个输入噪声 \\(z\\) 映射为一个携带了时序信息的隐藏变量序列\
    \ \\(\\hat{z} = \\{z^{(1)}, z^{(2)}, \\cdots, z^{(t)}\\}\\)。随后 \\(\\hat{z}\\)\
    \ 作为输入进入 \\(G_{bar}\\) 来产生对应的多音轨 Piano-Roll，这个过程可以表示为\n\n\\(G(z) = | G_{bar}(G_{temp}(z^{(t)}))\
    \ |_{t=1}^T \\quad (5-23)\\)\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_178_1.png)\n\
    \n图 5-21 小节连贯性（重头生成）模型\n\n如图 5-22 所示，该方法给定一个人工设计音乐小节 y，通过将此作为条件学习该小节的时间结构，并生成剩余完整小节（完成歌曲）。其中\
    \ \\(G_{bar}^c\\) 代表条件小节生成器，有两个输入，分别是 y 以及随机时间噪声 z。为了保证生成小节的质量，额外引入了一个 Encoder\
    \ 将 y 特征映射到 z 的特征空间上，这个过程可以表示为\n\n```\nG^n(z, y) = | G^0_{bar}(z^{(l)}, E(y^{(l)}))\
    \ |^l_{l=1} (5-24)\n```\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_179_0.png)\n\
    \n图 5-22 小节连贯性（条件音轨）模型\n\n### (4) MuseGAN 模型\n\n将多轨道相互依赖模型和时序模型组合即可得到最终的 MuseGAN\
    \ 模型，如图 5-23 所示，模型共有 4 个输入：轨道间时序无关随机变量 z、轨道内时序无关随机变量 z_i、轨道间时序相关随机变量 z_l、轨道内时序相关随机变量\
    \ z_{i,l,t}。对于每一个音轨 i，共享时序模型 G_{temp,i} 和独立时序模型 G_{temp,i}，分别将 z 和独立的 z_i 作为输入，得到的输出分别包含轨道间和轨道内的时序信息。z\
    \ 和 z_i 经过时序模型的输出以及 z_l、z_{i,l,t} 共同进入小节生成器 G_{bar} 后产生音乐的小节来堆叠产生 Piano-Roll。这个过程可以表示为\n\
    \n```\nG(\\vec{z}) = | G_{bar}(z, G_{temp,i}((z_i)^{(l)}), z_l, G_{temp,i,l}((z_{i,l,t})^{(l)}))\
    \ |^{M,T}_{l,t=1} (5-25)\n```\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_180_0.png)\n\
    \n图 5-23 MuseGAN 模型\n\n图 5-23 根据文献 [18] 重新绘制。\n\n## 5.3.5 异常检测\n\n异常检测（Anomaly\
    \ Detection）是指识别和分类图像或其他数据中的异常物品、异常行为或异常数据。传统的异常检测通常使用一些基于统计学的方法，如密度估计方法、聚类方法等，但这些方法通常需要足够多的异常先验知识，并且泛化能力容易受到数据分布的影响。GAN\
    \ 出现后，人们开始使用它进行异常检测，取得了很好的效果。接下来介绍两个代表性工作：AnoGAN[19] 和 GANomaly[20]。\n\n### 1.\
    \ AnoGAN\n\nAnoGAN 可以自动地检测图像中的异常部分，不需要人工标注或先验知识。AnoGAN 模型使用了一种称作“异常重构”（Anomaly\
    \ Reconstruction）的方法，通过将随机噪声生成的图像重构成与输入图像相似的图像，然后通过计算两者的误差来检测异常数据，如图 5-24 所示。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_181_0.png)\n\n图 5-24 AnoGAN 模型结构图\n\
    \nAnoGAN 包含以下三个组成部分。\n\n- 1) 生成器: AnoGAN 使用生成器来生成与正常数据类似的样本。生成器接受一个随机向量作为输入，并输出生成的样本。通过使用正常数据训练生成器，它可以学习到正常数据的分布，并生成与之相似的样本。\n\
    - 2) 判别器: 判别器的作用是区分真实的正常数据与生成器生成的数据。它接受一个样本作为输入，并输出判断该样本是真实样本还是生成样本的概率。通过使用生成样本和真实样本训练判别器，它可以学习辨别生成样本与真实样本的区别。\n\
    - 3) 异常重构: 在训练完成后，AnoGAN 使用了一种称为反向映射（Inverse Mapping）的技术来计算一个异常分数，用于衡量测试样本与训练样本之间的差异，分为以下三个步骤：\n\
    \  - 1) 从随机噪声 z 中生成一系列图像 x'，其中有一张图像最接近输入图像 x。\n  - 2) 对于最接近输入图像的生成图像，计算其与输入图像之间的重构误差，误差越小，则生成的图像越接近该输入图像。\n\
    \  - 3) 通过不断迭代，将重构误差定义为距离度量，找到输入图像周围最近的随机噪声，然后将其作为异常标记区域。\n\n可以发现在测试阶段传入缺陷数据时最终的损失大，传入正常数据时的损失小，这时候就可以设置一个合适的阈值来判断图像是否有异常了。\n\
    \nAnoGAN 的损失函数如下：\n\nLoss = (1-λ) | D(x)-D(G(x)) | +λ(x-G(x)) （5-26）\n\n使用 AnoGAN\
    \ 进行模型训练和异常检测的流程如图 5-25 所示。首先用正常数据训练获得模型，然后使用该模型对未知数据进行异常检测。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_181_1.png)\n\
    \n图 5-25 AnoGAN 模型进行异常检测的流程 [19] （详见彩插）\n\nAnoGAN 模型的优点是不需要先验知识和标注数据，可以自动化地检测异常数据，且具有很好的可扩展性和可重复性。\n\
    \n### 2. GANomaly\n\nGANomaly 在 AnoGAN 的基础上进行了改进，不再比较两个图像的分布，而是比较图像编码的潜在向量，如图\
