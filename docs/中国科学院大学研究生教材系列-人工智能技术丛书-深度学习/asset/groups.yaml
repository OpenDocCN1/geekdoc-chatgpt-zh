  - '[PAGE 209]


    # 正则化与优化


    正则化（Regularization）的概念最早来自线性几何，是指对平面不可约代数曲线以某种形式的全纯参数进行表示的方法。而机器学习中的正则化方法可分为两类：狭义正则化和广义正则化。狭义正则化是指通过在模型的损失函数中增加惩罚项来增强模型泛化能力的方法，广义正则化是指可以减小模型过拟合并使得泛化误差显著降低的所有方法。本章讲述的深度学习中的正则化指的是广义正则化，主要包括参数范数正则化、数据增强、Bagging、提前终止、Dropout
    和归一化等。


    优化（Optimization）是指在给定约束的情况下求解目标函数的最大值或最小值，并将其视为解决问题的最佳方案。在深度学习中，深度神经网络的结构复杂、参数多，普遍存在梯度消失或梯度爆炸问题，优化起来非常困难，进而很难找到全局最优解。因此，深度学习算法需要选用合适的优化算法，才能使目标函数收敛。本章讲述的深度学习中的优化算法主要包括常见的梯度下降法和基于动量的方法。


    深度学习模型的泛化性能非常重要，这意味着即使通过优化算法找到了训练集的近似最优解，仍然可能在测试集上得到很差的结果，即产生了过拟合。因此，在深度学习中，需要结合使用正则化与优化。


    # 7.1 深度学习模型的训练与测试


    # 7.1.1 深度学习中的数据集划分


    在传统的机器学习中，数据集一般划分为训练集和测试集，训练集是用于训练模型的数据样本，测试集是用来评估模型泛化能力的数据样本，但不能作为调参、特征选择等操作的依据。在深度学习中，往往从训练集中划分出一部分数据样本作为验证集，它可以看作在模型训练过程中单独留出的样本，可用于调整模型的超参数和对模型的能力进行初步的评估。机器学习与深度学习中的数据集划分情况如图
    7-1 所示。'
  - '[PAGE 210]


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_210_0.png)


    # 图 7-1 机器学习与深度学习中的数据集划分


    当然，深度学习中也可以采用传统机器学习中的交叉验证法、自助法进行数据集划分，在此不再赘述。


    # 7.1.2 过拟合与欠拟合


    与机器学习一样，深度学习中的过拟合（Over-fitting）是指深度学习模型能很好地拟合训练集样本，而无法很好地拟合测试集样本的现象，从而导致深度学习模型的泛化性能下降。为防止“过拟合”，可以选择减少模型参数、降低模型复杂度和正则化等。


    深度学习的欠拟合（Under-fitting）是指深度学习模型还没有很好地训练出数据的一般规律，模型拟合程度不高的现象。为防止“欠拟合”，可以选择增加模型参数、增加迭代深度、换用更加复杂的模型等。


    欠拟合、合适拟合（Appropriate-fitting）和过拟合现象的示例如图 7-2 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_210_1.png)


    # 图 7-2 欠拟合、合适拟合与过拟合现象


    # 7.1.3 偏差、方差、噪声与泛化误差


    首先，给定数据集 D，其中 D_train 是训练集，D_test 是测试集。训练集 D_train 中的输入样本集'
  - '[PAGE 211]


    合为 \(X_{train} = \{x_i | (i=1,2,\cdots,n)\}\)，对应的真实值集合为 \(Y_{train} = \{y_i |
    (i=1,2,\cdots,n)\}\)，对应的标签值集合为 \(L_{train} = \{l_i | (i=1,2,\cdots,n)\}\)；测试集
    \(D_{test}\) 中的输入样本集合为 \(X_{test} = \{x_j | (j=1,2,\cdots,m)\}\)，对应的真实值集合为 \(Y_{test}
    = \{y_j | (j=1,2,\cdots,m)\}\)，对应的标签值集合为 \(L_{test} = \{l_j | (j=1,2,\cdots,m)\}\)。假定基于现有的训练集
    \(D_{train}\)，通过留出法获得样本数量相同的训练集 \(D_k | (k=1,2,\cdots,K)\)，\(f_k(x; D_k)\) 表示在第
    \(k\) 个训练集 \(D_k\) 上学习得到的模型。


    # 1. 偏差


    不管是在传统机器学习还是深度学习中，偏差（Bias）度量训练所得模型的预估值和真实值的偏离程度，刻画了算法本身的拟合能力。


    用 \((\hat{y}_j)_k = f_k(x_j; D_k)\) 表示在第 \(k\) 个训练集 \(D_k\) 上训练所得的模型对测试样本 \(x_j\)
    的预估值输出，用 \(\bar{y}_j\) 表示在 \(K\) 个训练集上训练所得的 \(K\) 个模型对测试样本 \(x_j (j=1,2,\cdots,m)\)
    的预估值输出 \((\hat{y}_j)_k (k=1,2,\cdots,K)\) 的期望，计算公式如下：


    \(\bar{y}_j = E[(\hat{y}_j)_k] = E[f_k(x_j; D_k)], \quad k=1,2,\cdots,K\)


    那么样本 \(x_j\) 的偏差计算公式如下：


    \(bias^2(x_j) = (y_j - \bar{y}_j)^2\)


    偏差的计算过程如图 7-3 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_211_0.png)


    图 7-3 偏差计算示意图


    # 2. 方差


    方差（Variance）度量样本数量相同，但样本存在差异的不同训练集所导致的算法性能的变化，刻画了数据扰动对算法的影响。


    同样，用 \((\hat{y}_j)_k = f_k(x_j; D_k)\) 表示在第 \(k\) 个训练集 \(D_k\) 上训练所得的模型对测试样本 \(x_j\)
    的预估值输出，用 \(\bar{y}_j\) 表示在 \(K\) 个训练集上训练所得的 \(K\) 个模型对测试样本 \(x_j (j=1,2,\cdots,m)\)
    的预估值输出 \((\hat{y}_j)_k (k=1,2,\cdots,K)\) 的期望，计算公式如下：


    \(\bar{y}_j = E[(\hat{y}_j)_k] = E[f_k(x_j; D_k)], \quad k=1,2,\cdots,K\)


    那么样本 \(x_j\) 的方差计算如下：


    \(Var(x_j) = E[((\hat{y}_j)_k - \bar{y}_j)^2], \quad k=1,2,\cdots,K\)


    方差的计算过程如图 7-4 所示。'
  - '[PAGE 212]


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_212_0.png)


    # 3. 噪声


    噪声（Noise）度量样本真实值与标签值的偏离程度，刻画了学习问题本身的难度。$y_j (j=1, 2, \cdots, m)$ 表示真实值，$l_j (j=1,
    2, \cdots, m)$ 表示标签值。


    单个样本 $x_j$ 的噪声计算公式如下：


    $\varepsilon^2 = (l_j - y_j)^2$ (7-5)


    多个样本的噪声计算公式如下：


    $\bar{\varepsilon}^2 = E[\{(l_j - y_j)^2\}] , j=1, 2, \cdots, m$ (7-6)


    噪声的计算过程如图 7-5 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_212_1.png)'
  - '[PAGE 213]


    # 4. 泛化误差


    泛化误差（ Generalization Error ）度量基于训练所得模型得到的预估值和标签值的偏离程度。


    同样，用 \((\hat{y}_j)_k=f_k(x_j;D_k)\) 表示在第 \(k\) 个训练集 \(D_k\) 上训练所得的模型对测试样本 \(x_j\)
    的预估值输出，泛化误差的计算公式如下：


    GenError(x_j) = E[((\hat{y}_j)_k - l_j)^2], \quad k=1, 2, \cdots, K


    泛化误差的计算过程如图 7-6 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_213_0.png)


    图 7-6 泛化误差计算示意图


    接下来观察偏差、方差、泛化误差和噪声之间的关系。为方便表示，以下公式不再使用下标指明具体的值。使用 \(y\) 表示样本的真实值，\(l\) 表示标签值，\(\hat{y}\)
    表示模型对新样本的预估值，\(\bar{y}\) 表示在多个训练集上训练所得的模型对新样本预测值的期望。参考文献 [1]，可以推导出泛化误差等于偏差、方差和噪声之和，推导过程如下：


    GenError(x)

    = E[(\hat{y}-l)^2]

    = E[(\hat{y}-\bar{y}+\bar{y}-l)^2]

    = E[(\hat{y}-\bar{y})^2]+E[(\bar{y}-l)^2]+E[2(\hat{y}-\bar{y})(\bar{y}-l)]

    = E[(\hat{y}-\bar{y})^2]+E[(\bar{y}-y+y-l)^2]+E[2(\hat{y}-\bar{y})(\bar{y}-l)]

    = E[(\hat{y}-\bar{y})^2]+E[(\bar{y}-y)^2]+E[(y-l)^2]+E[2(\hat{y}-\bar{y})(\bar{y}-l)]+E[2(\bar{y}-y)(y-l)]


    下面，证明 \(E[2(\hat{y}-\bar{y})(\bar{y}-l)]\) 等于 0。


    E[2(\hat{y}-\bar{y})(\bar{y}-l)]

    = 2(E[(\hat{y}-\bar{y})] E[(\bar{y}-l)])

    = 2(E[\hat{y}]-E[\bar{y}]) E[(\bar{y}-l)]) //根据公式(7-1)可得 \(\bar{y}=E[\hat{y}]\)

    = 0'
