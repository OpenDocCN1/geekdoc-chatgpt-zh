    最小化误差的平方和寻找数据的最佳函数匹配。利用最小二乘法可以简便地求得未知的数据，并使得这些求得的数据与实际数据之间误差的平方和最小。最小二乘法还可用于曲线拟合，其他一些优化问题也可通过最小化能量或最大化熵的思路，用最小二乘法来表达。


    最小二乘法的数学定义：给定函数 \( f(x; \alpha_1, \alpha_2, \cdots, \alpha_n) \) 及其在 \( n \) 个不同取值
    \( (x_1, x_2, \cdots, x_n) \) 时的测量结果为 \( (y_1, y_2, \cdots, y_n) \)，即 \( f(x;
    \alpha_1, \alpha_2, \cdots, \alpha_n) \) 的值，确定未知参数 \( (\alpha_1, \alpha_2, \cdots,
    \alpha_n) \)，使得式（A-59）达到最小：


    \( \sum_{i=1}^{n}[f(x_i; \alpha_1, \alpha_2, \cdots, \alpha_n)-y_i]^2 \quad (\text{A-61})
    \)


    值得一提的是，最小二乘法虽然简单，但机器学习与深度学习的绝大多数算法，核心思想都是源于最小二乘法。可以说，最小二乘法是机器学习与深度学习中最基础的数学优化方法。'
