    ## 4.4.4 BERT 的训练


    BERT 同样采用两阶段训练方法，分别是在大规模无标注语料上的预训练和在特定任务有标签数据上进行的微调。


    在预训练阶段，BERT 使用了掩码语言模型（Masked Language Model，MLM）和下一句预测（Next Sentence Prediction，NSP）两种方法进行预训练。


    MLM 是在输入文本中随机选择一部分单词，将它们替换成特殊的 [MASK] 标记，然后要求模型预测输入句子中被随机掩盖的单词。值得注意的是，考虑到在测试阶段
    [MASK] 标记并不会出现，这会导致预训练和微调之间存在一些不匹配的问题。为了缓解这种情况，在实际的训练过程中，并不总是使用 [MASK] 替换需要被掩码的单词，而是选择在一个小概率的情况下使用随机标记替换需要被掩码的单词，如以
    15% 概率选择要被掩码的单词，同时随机标记有三种情况：[MASK]（占 80%）、其他任意单词（占 10%）和保持原单词不变（占 10%）。


    在许多下游任务中，比如问答、自然语言推理和文本蕴含任务都需要理解两个句子之间的关系。为使得 BERT 能够理解句子之间的关系，NSP 任务要求模型判断两个句子之间是否是连续的，这个任务可以帮助语言模型学习到句子之间的关系和逻辑关联。BERT
    在大规模 Wikipedia 和 BookCorpus 语料库上进行预训练，包含 340 亿个单词。对于英语百科数据，只使用其中的文本片段，而忽略列表、表格和标题，使用文档级别的语料库而不是句子级别的语料库。


    在微调阶段，可以将 BERT 应用于各种具体的自然语言处理任务，对于文本分类任务，可以将 BERT 的输出向量输入一个全连接层进行分类；对于命名实体识别任务，可以将
    BERT 的输出序列输入一个序列标注模型中进行命名实体识别。


    ## 4.4.5 BERT 的变种


    BERT 的出现，极大地推动了自然语言处理领域相关技术的发展和进步。同时，BERT 也衍生出了诸多变种模型，比如 RoBERTa[12]、ALBERT[13]、BART[14]
    和 ERNIE[15] 等，不断提升了各项自然语言处理任务的性能。


    BERT 中的训练方法存在一些缺点：

    - MLM 直接对单个 Token 进行随机掩码，丢失了短语和实体信息，这一点对中文尤其明显，百度公司提出的 ERNIE 模型对其进行了改进。

    - MLM 仅预测被掩码的单词，其他的单词没有参与到预测中。

    - NSP 任务可以学到序列层的信息，但是这仅仅是一个二分类问题，而且负样本构造过于简单，导致模型不能进行充分的训练，ALBERT 和 RoBERTa 对其进行了相应的改进。


    RoBERTa 的提出者发现了 BERT 存在训练不足的问题，从模型设计选择、训练策略和语料选择方面入手，对 BERT 进行了改进，具体来说：

    - 原始的 BERT 模型在实现数据处理时执行一次掩码操作，从而产生了静态掩码，为了避免在每个训练轮次中为每个样本使用相同的掩码，RoBERTa 使用了动态掩码，在预训练的不同时刻，重新挑选
    15% 的单词进行掩码。

    - 原始 BERT 模型在预训练的过程中，训练下一个句子任务的样本要么是从同一个文档中连续采样，要么来自不同的文档，这种设置过于简单，RoBERTa 尝试了多种变形，发现在去除
    NSP 任务时，模型的性能能够获得提升。

    - BERT 采用的是字符级别的编码，词汇表大小是 30K，RoBERTa 在训练中采用字节级别的编码，词汇表大小扩展到了 50K。

    - RoBERTa 在训练中增加了批处理的大小。


    BERT 和 RoBERTa 模型都采用了大量的参数，为了解决计算资源带来的限制，ALBERT 模型对 BERT 模型进行了参数方面的优化，具体来说，ALBERT
    通过两种参数缩减技术进行建模：

    - 第 1 种技术是分解嵌入参数，将大词汇嵌入矩阵分解成两个小矩阵，然后将隐藏层的大小与词向量的大小分开。

    - 第 2 种技术是跨层共享，BERT 模型使用了 12 层不同的编码器，参数并没有共享，ALBERT 模型将这 12 层的编码器的参数实现了共享。


    同时，ALBERT 发现 BERT 模型的 NSP 学习任务相比 MLM 学习任务难度较小，因此提出用于句子顺序预测的自监督损失（Sentence-Order
    Prediction，SOP）任务替代 NSP 任务，SOP 任务关注句子之间的连贯性，将 NSP 任务中的负样本换成了同一篇文章中的两个逆序句子，在预训练时，让模型去预测句子是正序还是逆序，实验证明
    SOP 任务带来的提升比 NSP 任务更好。


    绝大多数大规模预训练模型仅仅通过上下文预测缺失的单词对文本表示进行建模，这些工作不考虑句子中的先验知识。ERNIE 通过知识掩码策略来解决这一问题，除了最基本的单词标记掩码策略外，ERNIE
    增加了两种与知识相关的策略，分别是短语策略和实体策略。ERNIE 与 BERT 的掩码策略对比如图 4-18 所示，它将短语（如 a series of）或者实体（J.
    K. Rowling）作为一个知识单元，在预训练期间，对这些知识单元进行掩码，这样的训练过程能够使大模型实现与外部知识的结合。在模型架构方面，ERNIE 模型同样采用多层
    Transformer 模型作为基础编码器，


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_135_0.png)


    图 4-18 BERT 与 ERNIE 的结构比较


    对于中文语料库，设计者在 CJK Unicode 范围内的每个字符周围添加了空格，并使用 WordPiece 对中文句子进行标记。此外，ERNIE 提出了一种多阶段的知识掩码策略，将短语和实体级别的知识融合到语言表示中。第
    1 个阶段是基本级别的掩码，它将句子视为最基本的语言单元，在训练中随机屏蔽 15% 的基本单元。第 2 个阶段是短语级别的掩码，短语是一组小的单词或者字符。第
    3 个阶段是实体级别的掩码，包括人员、位置、产品等。在数据选择方面，ERNIE 采用异构语料库进行预训练，集合了百度百科、百度新闻等语料。因为对话数据对于语义表示非常重要，因此，ERNIE
    还引入了对话语言模型（Dialogue Language Model，DLM），DLM 任务能够让 ERNIE 学习到对话中的隐含关系，进一步提升模型的语义表达能力。ERNIE
    在中文异质数据上进行了预训练，然后应用于 5 个中文任务中，实验证明了 ERNIE 模型的有效性和对中文语料强大的语义理解能力。


    ## 4.5 Swin Transformer


    ## 4.5.1 Swin Transformer 的提出


    如前所述，Transformer 主要应用于自然语言处理领域的各个任务，随着 ViT[16] 的提出，Transformer 开始应用于计算机视觉领域。把
    Transformer 从自然语言处理领域迁移到计算机视觉领域主要面临两个挑战：1）不同视觉主体存在很大尺寸差异；2）图像像素比起自然语言文本而言有很高的分辨率。针对上述挑战，Ze
    Liu 等人提出了 Swin Transformer[17]，它是一种基于滑动窗口机制、采用层级设计的视觉 Transformer，可以作为所有计算机视觉任务的骨干网络。在图像分类任务上，Swin
    Transformer 在 ImageNet-1K 数据集上取得了 87.3 的 Top-1 准确率；在其他密集视觉任务（如目标检测、语义分割等）上，Swin
    Transformer 也有非常优秀的表现。


    Swin Transformer 的关键技术有两个：

    - 层级化 Transformer 设计；

    - 滑动窗口机制。


    下面进行详细介绍。


    ## 4.5.2 Swin Transformer 结构


    Swin Transformer 结构采用层级化设计，一共分为 4 个阶段。图 4-19 是 Swin Transformer 的模型结构图，鉴于 Swin
    Transformer 可用于多种计算机视觉任务，图 4-19 仅展示了骨干网络部分。


    Swin Transformer 首先将图像输入分成像素块，像素块大小为 4×4。以图像大小 224×224×3 为例，经过第 1 层后数据维度变为 56×56×(4×4×3)，之后送入阶段
    1 进行处理。在阶段 1 中，数据从线性嵌入层出来后，维度大小变为 3136×96，这对于 Transformer 块来说过大，因此需要采用窗口内自注意力计算减小计算复杂度。从阶段
    2 开始，之后的每一阶段都是一个像素块合并层和 Swin Transformer 模块，其中像素块合并层类似于卷积神经网络中的池化层，经过像素块合并层后，数据的宽和高为原先的
    1/2，通道数为原先的 2 倍。接下来详细介绍窗口内自注意力计算、Swin Transformer 模块和像素块合并层。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_0.png)


    ### 1. 窗口内自注意力计算


    经过阶段 1 的线性嵌入层后，一个 224×224×3 的图像输入维度变成 3136×96，3136 对于 Swin Transformer 模块来说过大，为了减小计算复杂度，Swin
    Transformer 提出在窗口内进行自注意力计算。图 4-20 展示的是一个 56×56×96 的输入在窗口内计算时窗口与像素块关系说明。首先，默认窗口内有
    7×7 的像素块，因此就有 (56/7)×(56/7) = 8×8 = 64 个窗口。在窗口内计算自注意力让计算复杂度与图像大小呈线性相关，大大减小了计算复杂度。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_1.png)


    具体来说，自注意力计算流程如图 4-21 所示。向量与三个系数矩阵相乘后分别得到 Q、K 和 V。然后 Q 与 K 相乘得到自注意力 A，A 再与 V 相乘，然后经过投射层得到最终结果。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_2.png)


    普通的自注意力计算复杂度和窗口内自注意力计算复杂度如公式（4-29）和公式（4-30）所示，其中 M 为窗口大小，在这里默认为 7（即窗口里有 7×7 个像素块）。


    \(\Omega(\text{MSA}) = 4hwc^2 + 2(hw)^2C \quad (4-29)\)

    \(\Omega(W\text{-MSA}) = 4hwc^2 + 2M^2C \quad (4-30)\)


    ### 2. Swin Transformer 模块


    Swin Transformer 是通过将 Transformer 模块中的多头自注意力（Multi-Head Self-Attention, MSA）模块替换为基于滑动窗口的模块来构建的，其他层保持不变。如图
    4-22 所示，一个 Swin Transformer 模块由一个基于滑动窗口的 MSA 模块组成，其后是一个 2 层的多层感知机（Multi-Layer
    Perceptron，MLP），GeLU 非线性介于两者之间。在每个 MSA 模块和每个 MLP 之前应用一个层归一化，在每个模块之后应用一个残差连接。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_138_0.png)


    图 4-22 Swin Transformer 模块


    ### 3. 像素块合并层


    像素块合并层类似卷积神经网络中的池化层，对特征进行下采样。这个过程会让空间维度变小，但是通道数会增加。比如原先 H×W×C 的输入，经过下采样后维度变为 H/2×W/2×4C，这时采用一个
    1×1 的卷积后，维度就会变为 H/2×W/2×2C。这也就可以解释图 4-19 中每一个阶段之后的维度变化了。


    ## 4.5.3 Swin Transformer 的滑动窗口机制


    Swin Transformer 使用窗口内自注意力计算，虽然可以大大减小计算复杂度，但是也让不同像素块缺少与其他像素块之间的联系。为了增加感受野，变相达到全局建模的能力，提出了滑动窗口机制，如图
    4-23 所示。其中，红色正方形围住的部分是窗口，每个窗口内灰色的正方形为像素块。每次滑动时，窗口都向右下方向移动 2 个像素块。这样，一些像素块就从原先的窗口移动到了新的窗口，如此再进行窗口内自注意力计算时，就得到了跨窗口的计算，变相实现了全局建模。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_139_0.png)


    图 4-23 滑动窗口机制示意图[17] (详见彩插)


    但是，这样的滑动机制也造成了问题，比如图 4-23 中，第 l 层有 4 个窗口，第 (l+1) 层就变成了大小不一的 9 个窗口，对计算造成不便，也使计算复杂度增加。Swin
    Transformer 使用了一种巧妙的循环位移和掩码方式，解决滑动窗口带来的不便。如图 4-24 所示，在窗口正常滑动后，把其他非正常大小的窗口填充到各个部分，如左上角窗口
    A 被移动到右下角，上方的窗口 C 被填充到下方，左边的窗口 B 被填充到右方。但是在这样得到的新窗口内可能存在两个本来相距很远的像素块，它们本来不应该放在一起计算，因此使用掩码多头自注意力解决。在计算完毕后，再将其复原，否则该图就不断往右下方向循环下去了。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_139_1.png)


    图 4-24 滑动窗口机制中的批次计算方法[17] (详见彩插)


    ## 4.6 Transformer 的主要应用


    ## 4.6.1 自然语言处理领域


    Transformer 最初被设计用于机器翻译任务，取得了非常好的结果。之后，以 Transformer 为主干（Backbone）的一些大规模预训练语言模型，如
    GPT 系列、BERT[10]、BART[14] 等在包括文本分类、文本生成、命名实体识别、机器阅读理解、文本蕴含等多个自然语言处理任务上取得了优异的表现。下面主要介绍
    Transformer 模型在机器翻译、自动文本摘要和机器阅

    '
  mdcn: '

    理解的问答等。


    BERT 采用双向 Transformer 编码器作为基础结构，它能够同时利用上下文信息和句子内部信息，提升模型的表达能力。BERT 通过在大规模语料库上进行无监督的预训练，学习到通用的语言知识和上下文信息，然后在特定任务上进行微调，以适应不同的应用场景，如基于多类型自然语言推理语料库（Multi-Genre
    Natural Language Inference，MNLI）的自然语言推理任务、命名实体识别（Named Entity Recognition，NER）任务、基于
    SQuAD 数据集的机器阅读理解任务等。


    ## 4.4.1 与其他大规模预训练模型的区别


    将预训练模型应用于下游任务有两种方法，分别是基于特征的方法和基于微调的方法。ELMo[11] 使用的是一种基于特征的方法，GPT 系列模型使用的是一种基于微调的方法。这两种方法可以通过微调所有的预训练参数对下游任务进行训练，且它们都采用单向语言模型来学习通用的语言表示。


    如图 4-16a 所示，ELMo 使用自左向右和自右向左的两个 LSTM 网络作为编码器，分别以 \(P(w_i | w_1, \cdots, w_{i-1})\)
    和 \(P(w_i | w_{i+1}, \cdots, w_n)\) 作为目标函数独立训练，将训练得到的特征向量以拼接的形式实现双向编码。此外，如前面章节所述，GPT
    在 Transformer 解码器的基础上进行构建，以 \(P(w_i | w_1, \cdots, w_{i-1})\) 为目标进行训练，也是一个单向编码模型，如图
    4-16b 所示。BERT 的设计者认为单向的语言模型使得每个标记只能关注先前标记的信息，在面对诸如问答类的自然语言处理任务时，单向语言模型的效果可能不是最优的，能够从两个方向合并上下文信息是非常重要的。BERT
    使用 \(P(w_i | w_1, \cdots, w_{i-1}, w_{i+1}, \cdots, w_n)\) 为目标函数进行训练，它是一个双向编码模型，如图
    4-16c 所示。


    ## 4.4.2 BERT 的架构与参数


    BERT 模型基于 Transformer 模型的编码器构建，实现上与 Transformer 的细节几乎相同。文献 [10] 中定义 Transformer
    的块数为 \(L\)、隐藏层状态大小为 \(H\)、自注意力机制的头数为 \(A\)。在 Base 模式的 BERT 中，\(L=12\)，\(H=768\)，\(A=16\)；在
    Large 模式的 BERT 中，\(L=24\)，\(H=1024\)，\(A=16\)。


    ## 4.4.3 BERT 的输入表示


    为了使 BERT 能够处理各种下游任务，输入表示需要能够区分一个句子或者一对输入句子。BERT 的输入编码可以分为标记和嵌入两个步骤：在标记步骤中，BERT
    将输入文本标记成 Token，这些 Token 可以是单词、子词或者字符，然后将每个标记映射到其在词汇表中的唯一整数 ID。BERT 使用 WordPiece
    算法将单词或者子词拆分成更小的单元，以扩展词汇表并允许模型更好地处理未知词汇。接着，每个序列的第一个标记始终是一个特殊的分类标记 [CLS]，与该标记对应的最终隐藏层状态被用作分类任务的聚合序列表示。句子对被打包成一个序列。此外，设计者采用两种方式对句子对进行区分：


    - 在句子之间增加 [SEP] 标记；

    - 为每个句子的每个标记增加一个句子标记嵌入，注明其属于哪一个句子，也就是如图 4-17 所示的段向量。最后，对于每个输入单词，同 Transformer
    模型中的设计一样，包括词向量和位置向量。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_133_0.png)


    图 4-16 ELMo、GPT 和 BERT 的工作模式比较


    | 输入单词 | [CLS] | my | dog | is | cute | [SEP] | he | likes | play | ##ing | my
    |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 词向量 | E_[CLS] | E_my | E_dog | E_is | E_cute | E_[SEP] | E_he | E_likes | E_play
    | E_##ing | E_my |

    | 段向量 | E_A | E_A | E_A | E_A | E_A | E_A | E_B | E_B | E_B | E_B | E_B |

    | 位置向量 | E_0 | E_1 | E_2 | E_3 | E_4 | E_5 | E_6 | E_7 | E_8 | E_9 | E_10 |


    图 4-17 BERT 模型的输入表示


    ## 4.4.4 BERT 的训练


    BERT 同样采用两阶段训练方法，分别是在大规模无标注语料上的预训练和在特定任务有标签数据上进行的微调。


    在预训练阶段，BERT 使用了掩码语言模型（Masked Language Model，MLM）和下一句预测（Next Sentence Prediction，NSP）两种方法进行预训练。


    MLM 是在输入文本中随机选择一部分单词，将它们替换成特殊的 [MASK] 标记，然后要求模型预测输入句子中被随机掩盖的单词。值得注意的是，考虑到在测试阶段
    [MASK] 标记并不会出现，这会导致预训练和微调之间存在一些不匹配的问题。为了缓解这种情况，在实际的训练过程中，并不总是使用 [MASK] 替换需要被掩码的单词，而是选择在一个小概率的情况下使用随机标记替换需要被掩码的单词，如以
    15% 概率选择要被掩码的单词，同时随机标记有三种情况：[MASK]（占 80%）、其他任意单词（占 10%）和保持原单词不变（占 10%）。


    在许多下游任务中，比如问答、自然语言推理和文本蕴含任务都需要理解两个句子之间的关系。为使得 BERT 能够理解句子之间的关系，NSP 任务要求模型判断两个句子之间是否是连续的，这个任务可以帮助语言模型学习到句子之间的关系和逻辑关联。BERT
    在大规模 Wikipedia 和 BookCorpus 语料库上进行预训练，包含 340 亿个单词。对于英语百科数据，只使用其中的文本片段，而忽略列表、表格和标题，使用文档级别的语料库而不是句子级别的语料库。


    在微调阶段，可以将 BERT 应用于各种具体的自然语言处理任务，对于文本分类任务，可以将 BERT 的输出向量输入一个全连接层进行分类；对于命名实体识别任务，可以将
    BERT 的输出序列输入一个序列标注模型中进行命名实体识别。


    ## 4.4.5 BERT 的变种


    BERT 的出现，极大地推动了自然语言处理领域相关技术的发展和进步。同时，BERT 也衍生出了诸多变种模型，比如 RoBERTa[12]、ALBERT[13]、BART[14]
    和 ERNIE[15] 等，不断提升了各项自然语言处理任务的性能。


    BERT 中的训练方法存在一些缺点：

    - MLM 直接对单个 Token 进行随机掩码，丢失了短语和实体信息，这一点对中文尤其明显，百度公司提出的 ERNIE 模型对其进行了改进。

    - MLM 仅预测被掩码的单词，其他的单词没有参与到预测中。

    - NSP 任务可以学到序列层的信息，但是这仅仅是一个二分类问题，而且负样本构造过于简单，导致模型不能进行充分的训练，ALBERT 和 RoBERTa 对其进行了相应的改进。


    RoBERTa 的提出者发现了 BERT 存在训练不足的问题，从模型设计选择、训练策略和语料选择方面入手，对 BERT 进行了改进，具体来说：

    - 原始的 BERT 模型在实现数据处理时执行一次掩码操作，从而产生了静态掩码，为了避免在每个训练轮次中为每个样本使用相同的掩码，RoBERTa 使用了动态掩码，在预训练的不同时刻，重新挑选
    15% 的单词进行掩码。

    - 原始 BERT 模型在预训练的过程中，训练下一个句子任务的样本要么是从同一个文档中连续采样，要么来自不同的文档，这种设置过于简单，RoBERTa 尝试了多种变形，发现在去除
    NSP 任务时，模型的性能能够获得提升。

    - BERT 采用的是字符级别的编码，词汇表大小是 30K，RoBERTa 在训练中采用字节级别的编码，词汇表大小扩展到了 50K。

    - RoBERTa 在训练中增加了批处理的大小。


    BERT 和 RoBERTa 模型都采用了大量的参数，为了解决计算资源带来的限制，ALBERT 模型对 BERT 模型进行了参数方面的优化，具体来说，ALBERT
    通过两种参数缩减技术进行建模：

    - 第 1 种技术是分解嵌入参数，将大词汇嵌入矩阵分解成两个小矩阵，然后将隐藏层的大小与词向量的大小分开。

    - 第 2 种技术是跨层共享，BERT 模型使用了 12 层不同的编码器，参数并没有共享，ALBERT 模型将这 12 层的编码器的参数实现了共享。


    同时，ALBERT 发现 BERT 模型的 NSP 学习任务相比 MLM 学习任务难度较小，因此提出用于句子顺序预测的自监督损失（Sentence-Order
    Prediction，SOP）任务替代 NSP 任务，SOP 任务关注句子之间的连贯性，将 NSP 任务中的负样本换成了同一篇文章中的两个逆序句子，在预训练时，让模型去预测句子是正序还是逆序，实验证明
    SOP 任务带来的提升比 NSP 任务更好。


    绝大多数大规模预训练模型仅仅通过上下文预测缺失的单词对文本表示进行建模，这些工作不考虑句子中的先验知识。ERNIE 通过知识掩码策略来解决这一问题，除了最基本的单词标记掩码策略外，ERNIE
    增加了两种与知识相关的策略，分别是短语策略和实体策略。ERNIE 与 BERT 的掩码策略对比如图 4-18 所示，它将短语（如 a series of）或者实体（J.
    K. Rowling）作为一个知识单元，在预训练期间，对这些知识单元进行掩码，这样的训练过程能够使大模型实现与外部知识的结合。在模型架构方面，ERNIE 模型同样采用多层
    Transformer 模型作为基础编码器，


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_135_0.png)


    图 4-18 BERT 与 ERNIE 的结构比较


    对于中文语料库，设计者在 CJK Unicode 范围内的每个字符周围添加了空格，并使用 WordPiece 对中文句子进行标记。此外，ERNIE 提出了一种多阶段的知识掩码策略，将短语和实体级别的知识融合到语言表示中。第
    1 个阶段是基本级别的掩码，它将句子视为最基本的语言单元，在训练中随机屏蔽 15% 的基本单元。第 2 个阶段是短语级别的掩码，短语是一组小的单词或者字符。第
    3 个阶段是实体级别的掩码，包括人员、位置、产品等。在数据选择方面，ERNIE 采用异构语料库进行预训练，集合了百度百科、百度新闻等语料。因为对话数据对于语义表示非常重要，因此，ERNIE
    还引入了对话语言模型（Dialogue Language Model，DLM），DLM 任务能够让 ERNIE 学习到对话中的隐含关系，进一步提升模型的语义表达能力。ERNIE
    在中文异质数据上进行了预训练，然后应用于 5 个中文任务中，实验证明了 ERNIE 模型的有效性和对中文语料强大的语义理解能力。


    ## 4.5 Swin Transformer


    ## 4.5.1 Swin Transformer 的提出


    如前所述，Transformer 主要应用于自然语言处理领域的各个任务，随着 ViT[16] 的提出，Transformer 开始应用于计算机视觉领域。把
    Transformer 从自然语言处理领域迁移到计算机视觉领域主要面临两个挑战：1）不同视觉主体存在很大尺寸差异；2）图像像素比起自然语言文本而言有很高的分辨率。针对上述挑战，Ze
    Liu 等人提出了 Swin Transformer[17]，它是一种基于滑动窗口机制、采用层级设计的视觉 Transformer，可以作为所有计算机视觉任务的骨干网络。在图像分类任务上，Swin
    Transformer 在 ImageNet-1K 数据集上取得了 87.3 的 Top-1 准确率；在其他密集视觉任务（如目标检测、语义分割等）上，Swin
    Transformer 也有非常优秀的表现。


    Swin Transformer 的关键技术有两个：

    - 层级化 Transformer 设计；

    - 滑动窗口机制。


    下面进行详细介绍。


    ## 4.5.2 Swin Transformer 结构


    Swin Transformer 结构采用层级化设计，一共分为 4 个阶段。图 4-19 是 Swin Transformer 的模型结构图，鉴于 Swin
    Transformer 可用于多种计算机视觉任务，图 4-19 仅展示了骨干网络部分。


    Swin Transformer 首先将图像输入分成像素块，像素块大小为 4×4。以图像大小 224×224×3 为例，经过第 1 层后数据维度变为 56×56×(4×4×3)，之后送入阶段
    1 进行处理。在阶段 1 中，数据从线性嵌入层出来后，维度大小变为 3136×96，这对于 Transformer 块来说过大，因此需要采用窗口内自注意力计算减小计算复杂度。从阶段
    2 开始，之后的每一阶段都是一个像素块合并层和 Swin Transformer 模块，其中像素块合并层类似于卷积神经网络中的池化层，经过像素块合并层后，数据的宽和高为原先的
    1/2，通道数为原先的 2 倍。接下来详细介绍窗口内自注意力计算、Swin Transformer 模块和像素块合并层。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_0.png)


    ### 1. 窗口内自注意力计算


    经过阶段 1 的线性嵌入层后，一个 224×224×3 的图像输入维度变成 3136×96，3136 对于 Swin Transformer 模块来说过大，为了减小计算复杂度，Swin
    Transformer 提出在窗口内进行自注意力计算。图 4-20 展示的是一个 56×56×96 的输入在窗口内计算时窗口与像素块关系说明。首先，默认窗口内有
    7×7 的像素块，因此就有 (56/7)×(56/7) = 8×8 = 64 个窗口。在窗口内计算自注意力让计算复杂度与图像大小呈线性相关，大大减小了计算复杂度。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_1.png)


    具体来说，自注意力计算流程如图 4-21 所示。向量与三个系数矩阵相乘后分别得到 Q、K 和 V。然后 Q 与 K 相乘得到自注意力 A，A 再与 V 相乘，然后经过投射层得到最终结果。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_137_2.png)


    普通的自注意力计算复杂度和窗口内自注意力计算复杂度如公式（4-29）和公式（4-30）所示，其中 M 为窗口大小，在这里默认为 7（即窗口里有 7×7 个像素块）。


    \(\Omega(\text{MSA}) = 4hwc^2 + 2(hw)^2C \quad (4-29)\)

    \(\Omega(W\text{-MSA}) = 4hwc^2 + 2M^2C \quad (4-30)\)


    ### 2. Swin Transformer 模块


    Swin Transformer 是通过将 Transformer 模块中的多头自注意力（Multi-Head Self-Attention, MSA）模块替换为基于滑动窗口的模块来构建的，其他层保持不变。如图
    4-22 所示，一个 Swin Transformer 模块由一个基于滑动窗口的 MSA 模块组成，其后是一个 2 层的多层感知机（Multi-Layer
    Perceptron，MLP），GeLU 非线性介于两者之间。在每个 MSA 模块和每个 MLP 之前应用一个层归一化，在每个模块之后应用一个残差连接。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_138_0.png)


    图 4-22 Swin Transformer 模块


    ### 3. 像素块合并层


    像素块合并层类似卷积神经网络中的池化层，对特征进行下采样。这个过程会让空间维度变小，但是通道数会增加。比如原先 H×W×C 的输入，经过下采样后维度变为 H/2×W/2×4C，这时采用一个
    1×1 的卷积后，维度就会变为 H/2×W/2×2C。这也就可以解释图 4-19 中每一个阶段之后的维度变化了。


    ## 4.5.3 Swin Transformer 的滑动窗口机制


    Swin Transformer 使用窗口内自注意力计算，虽然可以大大减小计算复杂度，但是也让不同像素块缺少与其他像素块之间的联系。为了增加感受野，变相达到全局建模的能力，提出了滑动窗口机制，如图
    4-23 所示。其中，红色正方形围住的部分是窗口，每个窗口内灰色的正方形为像素块。每次滑动时，窗口都向右下方向移动 2 个像素块。这样，一些像素块就从原先的窗口移动到了新的窗口，如此再进行窗口内自注意力计算时，就得到了跨窗口的计算，变相实现了全局建模。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_139_0.png)


    图 4-23 滑动窗口机制示意图[17] (详见彩插)


    但是，这样的滑动机制也造成了问题，比如图 4-23 中，第 l 层有 4 个窗口，第 (l+1) 层就变成了大小不一的 9 个窗口，对计算造成不便，也使计算复杂度增加。Swin
    Transformer 使用了一种巧妙的循环位移和掩码方式，解决滑动窗口带来的不便。如图 4-24 所示，在窗口正常滑动后，把其他非正常大小的窗口填充到各个部分，如左上角窗口
    A 被移动到右下角，上方的窗口 C 被填充到下方，左边的窗口 B 被填充到右方。但是在这样得到的新窗口内可能存在两个本来相距很远的像素块，它们本来不应该放在一起计算，因此使用掩码多头自注意力解决。在计算完毕后，再将其复原，否则该图就不断往右下方向循环下去了。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_139_1.png)


    图 4-24 滑动窗口机制中的批次计算方法[17] (详见彩插)


    ## 4.6 Transformer 的主要应用


    ## 4.6.1 自然语言处理领域


    Transformer 最初被设计用于机器翻译任务，取得了非常好的结果。之后，以 Transformer 为主干（Backbone）的一些大规模预训练语言模型，如
    GPT 系列、BERT[10]、BART[14] 等在包括文本分类、文本生成、命名实体识别、机器阅读理解、文本蕴含等多个自然语言处理任务上取得了优异的表现。下面主要介绍
    Transformer 模型在机器翻译、自动文本摘要和机器阅

    '
