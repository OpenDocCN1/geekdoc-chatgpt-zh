    | 零样本 | 给定任务相关的自然语言描述，模型预测答案。梯度不进行更新 | Translate English to French<br>Cheese=>
    |

    | 单样本 | 除了任务描述之外，模型能够看到一个任务的具体样例。梯度不进行更新 | Translate English to French<br>Sea
    otter=>loutre de mer<br>Cheese=> |

    | 小样本 | 除了任务描述之外，模型能够看到多个任务的具体样例。梯度不进行更新 | Translate English to French<br>Sea
    otter=>loutre de mer<br>peppermint=>menthe<br>poivre<br>Cheese=> |


