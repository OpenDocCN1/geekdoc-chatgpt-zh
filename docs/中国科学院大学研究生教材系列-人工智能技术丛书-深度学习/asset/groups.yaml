    在 YOLO 提出后，又先后出现了 YOLOv2[16]、YOLOv3[17]、YOLOv4[18]、YOLOv5[19] 和 YOLOv6[20] 版本。YOLOv2
    更改了骨干网络，使用 Darknet-19 进行特征提取，并使用批归一化、分辨率提升和多尺度训练等方法提升了检测准确率。YOLOv3 使用 Darknet-53
    作为骨干网络进行特征提取，并借鉴特征金字塔[31] 的思想进行通道拼接与融合，进一步提升了检测准确率。YOLOv4 使用 CSPDarknet-53 作为骨干网络，并引入特征金字塔池化、Mosaic
    数据增强和 Mish 激活函数等改进方法，与 YOLOv3 相比，检测准确率有较大的提升。YOLOv5 与 YOLOv4 相比，改进不大，主要是把最大池化由并行改为了串行。YOLOv6
    的改进也不大，主要的改进是骨干网络由 CSPDarknet-53 改为了 EfficientRep[32]。这些版本的 YOLO 在保证实时性的同时，也提高了目标检测的准确率，成为当前目标检测框架的首选。


    # 2.5.2 图像分割


    全卷积网络（Fully Convolutional Network，FCN）[22] 是使用深度神经网络进行图像分割的开山之作。FCN 与传统的卷积神经网络不同，仅包含卷积层和池化层，不再包含全连接层和输出层。因此，它也不再对整幅图像进行分类，而是实现了像素级的分类，进而输出图像分割的结果。FCN
    与传统卷积神经网络的区别如图 2-47 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_79_0.png)


    图 2-47 FCN 与传统卷积神经网络的区别[22]


    如图 2-48 所示，FCN 中的卷积过程如下所示：


    +   1) 图像经过多个卷积和一个最大池化变为 pool1 特征图，特征图的宽高变为图像的 1/2。

    +   2) pool1 特征图再经过多个卷积和一个最大池化后变为 pool2 特征图，宽高变为图像的 1/4。

    +   3) pool2 特征图再经过多个卷积和一个最大池化后变为 pool3 特征图，宽高变为图像的 1/8。

    +   4) 重复上述操作，直到得到 pool5 特征图，宽高变为图像的 1/32。'
