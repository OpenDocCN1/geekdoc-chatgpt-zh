    4) 边框回归：进行边框坐标偏移优化和调整。


    # (1) 区域划分


    使用选择性搜索算法[30] 进行区域划分，它的核心思想是图像中目标可能存在的区域存在某些相似性或者连续性。基于这一思想，选择性搜索算法采用子区域合并的方法提取候选边界框。首先，通过图像分割算法将输入图像分割成许多小的子区域；其次，根据这些子区域之间的相似性（主要考虑颜色、纹理、尺寸和空间交叠
    4 个方面的相似性）进行区域合并，并进行不断迭代。每次迭代过程中对这些合并的子区域做外切矩形，这些子区域的外切矩形就是通常所说的候选边框。选择性搜索算法（层次分组算法）的伪代码如算法
    2-1 所示。


    ```

    算法 2-1 层次分组算法（Hierarchical Group Algorithm）

    输入：（彩色）图像

    输出：目标定位假设 L 的集合

    获取初始化区域 R={r1,⋯,rn}

    初始化相似度集合 S=Ø

    For each 相邻的区域对 (ri,rj) do

    计算相似度 s(ri,rj)

    S=S∪s(ri,rj)

    End

    While S≠Ø do

    获取最大相似度值：s(ri,rj)= max (S)

    合并并对应区域：ri=ri∪rj

    移除与 ri 相关的相似度：S=S \ s(ri,r∗)

    移除与 rj 相关的相似度：S=S \ s(r∗,rj)

    计算 ri 与其相邻区域的相似度集合 Si

    更新相似度集合：S=S∪Si

    更新区域集合：R=R∪ri

    End

    ```


    # (2) 目标分类


    使用 SVM 对目标进行分类，训练时，把人工标定边框（Ground Truth）作为该类别的正例，把 IoU 小于 0.3 的建议边框（Proposal）作为该类别的负例；调优
    CNN 时，把 IoU 大于 0.5 的建议边框作为该类别的正例，其他作为负例（所有类别的背景）。如图 2-38 所示，假设有两个矩形边框 A 和 B，那么
    IoU 的定义如下：


    IoU = (A ∩ B) / (A ∪ B) （2-23）'
