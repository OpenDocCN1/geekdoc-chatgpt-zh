    # 数学基础


    # A. 1 线性代数


    # A. 1.1 标量、向量、矩阵、张量


    标量（Scalar）：标量是只有大小没有方向的物理量，如时间、温度和质量等。通常，标量一般用小写斜体字母表示，而且在定义标量时，一般要明确其数据类型，如 n
    ∈ N 表示样本的数量（自然数）、k ∈ R 表示曲线的斜率（实数）等。


    向量（Vector）：又称矢量，既有大小又有方向的物理量，如速度、位移等。通常，向量一般用粗体小写斜体字母表示，而且通过向量的次序索引，可以确定向量中的每个元素，如向量
    x = {x1, x2, ···, xn}，其中 x2 表示向量 x 中的第二个元素。


    矩阵（Matrix）：矩阵是一个二维数组，矩阵的每一个元素由行索引与列索引确定。通常，矩阵一般用粗体大写斜体字母表示，而且在定义矩阵时，也要明确其元素的数据类型，如一个实数矩阵的行数为
    m、列数为 n，那么这个矩阵可以表示为 A ∈ R^{m×n}。


    张量（Tensor）：张量是向量在多维上的推广，是表示多个向量、标量和其他张量之间线性关系的多线性函数，标量是零阶张量，向量是一阶张量，矩阵是二阶张量。通常，张量也用粗体大写斜体字母表示，而且通过张量的维度索引，可以确定张量中的每个元素，如三阶张量
    T 中索引为 (i,j,k) 的元素记为 T_{i,j,k}。


    # A. 1.2 矩阵性质


    矩阵乘法：一般地，当第 1 个矩阵的列数与第 2 个矩阵的行数相等时，两个矩阵可以相乘，如两个实数矩阵 A ∈ R^{m×n}、B ∈ R^{p×q}，满足
    n = p 时，两个矩阵可以相乘。若按公式（A-1）定义矩阵 C，则：C=AB。


    ```

    C_{i,j} = \sum A_{i,k} B_{k,j}   (A-1)

    ```'
  - '[PAGE 252]


    矩阵乘法满足分配律：\( A(B+C)=AB+AC \)。

    矩阵乘法满足结合律：\( A(BC)=(AB)C \)。

    但矩阵乘法通常不满足交换律：\( AB \neq BA \)。


    矩阵的秩：矩阵列向量的极大线性无关组的向量数目，记作矩阵的列秩，同样可以定义行秩，一般情况下，行秩=列秩=矩阵的秩。矩阵的秩可以通过矩阵初等变换来求取，矩阵初等变换包括：一行或者一列的元素乘以一个非零的数，与其他行或者列的元素相加，互换行或者列在矩阵中的位置。矩阵
    \( A \) 的秩通常记为 \( rank(A) \)。


    矩阵的逆：若矩阵 \( A \) 为 \( n \times n \) 的方阵，当 \( rank(A) < n \) 时，称 \( A \) 为奇异矩阵或不可逆矩阵。若
    \( rank(A) = n \)，称 \( A \) 为非奇异矩阵或可逆矩阵，此时存在矩阵 \( A^{-1} \) 使得式 (A-2) 成立：

    \( AA^{-1} = A^{-1}A = I_n \) (A-2)


    那么称 \( A^{-1} \) 为矩阵 \( A \) 的逆矩阵，\( I_n \) 是 \( n \times n \) 的单位矩阵。


    矩阵的特征值：若矩阵 \( A \) 为方阵，如存在非零向量 \( x \) 和常数 \( \lambda \) 满足公式 (A-3)，则称 \( \lambda
    \) 为矩阵 \( A \) 的特征值，\( x \) 为矩阵 \( A \) 关于 \( \lambda \) 的特征向量。

    \( Ax = \lambda x \) (A-3)


    若矩阵 \( A \) 为 \( n \times n \) 的方阵，并有 \( n \) 个特征值，那么有：\( \lambda_1 \leq \lambda_2
    \leq \dots \leq \lambda_n \)。


    矩阵 \( A \) 的迹（Trace）是矩阵特征值之和，用 \( tr(A) \) 表示，计算公式如下：

    \( tr(A) = \sum \lambda_i \) (A-4)


    矩阵 \( A \) 对应的行列式（Determinant）的值是矩阵特征值的乘积，用 \( |A| \) 表示，计算公式如下：

    \( |A| = \prod \lambda_i \) (A-5)


    矩阵分解：矩阵存在很多分解方式，这里仅介绍深度学习中使用较多的特征分解和奇异值分解。


    若矩阵 \( A \) 为 \( n \times n \) 的方阵，并有 \( n \) 个特征值 \( (\lambda_1, \lambda_2, \dots,
    \lambda_n) \)，那么矩阵 \( A \) 可以分解为

    \( A = U \Sigma U^{-1} \) (A-6)


    其中


    \( U = [u_1, u_2, \dots, u_n] \) (A-7)

    \( \Sigma = \begin{bmatrix} \lambda_1 & 0 & \dots & 0 \\ 0 & \lambda_2 & \dots
    & 0 \\ \vdots & \vdots & \ddots & \vdots \\ 0 & 0 & \dots & \lambda_n \end{bmatrix}
    \) (A-8)


    其中 \( u_i \) 是标准化的矩阵 \( A \) 的特征向量，即满足 \( \|u_i\|_2 = 1 \)。


    对于任意矩阵 \( A \)，大小为 \( m \times n \)，如存在大小 \( m \times m \) 的正交矩阵 \( U \) 和大小为
    \( n \times n \) 的正交矩阵 \( V \)，使得其满足：

    \( A = U \Sigma V^T, \quad U^T U = V^T V = I \) (A-9)


    则称式 (A-9) 为矩阵 \( A \) 的奇异值分解，其中 \( \Sigma \) 是大小为 \( m \times n \) 的矩阵。'
