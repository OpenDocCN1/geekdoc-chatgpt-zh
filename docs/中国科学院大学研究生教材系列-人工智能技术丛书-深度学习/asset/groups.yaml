    # 本章人物：Geoffrey Hinton 教授


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_45_0.png)


    Geoffrey Hinton（1947 ~ ），多伦多大学杰出教授，英国皇家学会院士，美国国家工程院外籍院士，美国艺术与科学院外籍院士，2018 年图灵奖获得者。他在反向传播算法、玻尔兹曼机、时间延迟神经网络（Time-Delay
    Neural Network）、变分学习（Variational Learning）与深度学习等领域做出杰出文献，被誉为“深度学习之父”。


    Geoffrey Hinton 教授于 1970 年获剑桥大学（University of Cambridge）实验心理学学士学位，1978 年获爱丁堡大学（University
    of Edinburgh）人工智能学博士学位，1982 ~ 1987 年在卡内基梅隆大学（Carnegie-Mellon University）工作，历任助理教授、副教授，之后加入多伦多大学计算机科学系，任教授。他也曾在
    Google 公司工作，任主任工程研究员和 Vector 研究院首席科学家。


    Geoffrey Hinton 教授长期从事人工神经网络领域研究，20 世纪 80 年代以来，这个领域很多重大的成果几乎都和他的研究组有关，例如：1985
    年，Geoffrey Hinton 和 Terry Sejnowski 在 Hopfield 神经网络的基础上提出了玻尔兹曼机，之后还提出了用于训练受限玻尔兹曼机和
    Product of Expert 的对比散度算法（Contrastive Divergence，CD）；1986 年，David E. Rumelhart、Geoffrey
    Hinton 和 Ronald Williams 提出了训练多层感知机的反向传播算法，并指出多层感知机可以解决异或操作这样的线性不可分问题；2006 年，Geoffrey
    Hinton 和他的同事们提出了一种称作深度信念网络的多层网络并进行了有效的训练，同年提出了深度自编码器进行数据降维，从而奠定了深度学习的理论基础。近几年，Geoffrey
    Hinton 教授也发表了很多研究成果，如胶囊网络（Capsule Network）、对比学习算法 SimCLR 和深度神经网络的前向—前向训练算法（Forward-Forward
    Algorithm）等，值得我们持续关注。


    Geoffrey Hinton 教授培养了很多优秀的学生，桃李满天下，很多人活跃在人工智能领域研究的前沿，包括 Radford Neal（贝叶斯统计领域做出重要贡献）、Alex
    Krizhevsky（AlexNet 主要提出者）、Ilya Sutskever（OpenAI 联合创始人与首席科学家）、Brendan Frey（DeepGenomics
    公司创始人）、Ruslan Salakhutdinov（卡内基梅隆大学大学教授）等，Yann LeCun 教授也曾做过 Geoffrey Hinton 教授的博士后。


    Geoffrey Hinton 教授的个人主页：https://www.cs.toronto.edu/~hinton/。'
