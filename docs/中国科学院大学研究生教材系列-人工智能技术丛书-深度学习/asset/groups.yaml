    ```

    $$Y_{h,w} = \frac{X_{h,w} - E_{nc}[X]}{\sqrt{Var_{nc}[X] + \epsilon}} \tag{7-37}$$


    $$Z_{n,h,w} = Y_{n,h,w} \times \gamma + \beta \tag{7-38}$$

    ```


    实例归一化在图像风格迁移等图像生成任务中表现出色，能够有效地提升生成图像的质量和保持风格一致性。它可以保持每个样本图像实例之间的独立性，不受通道和批大小的影响。但是如果特征图用到了通道之间的相关性，该方法就不适用了。


    # 4. 组归一化


    组归一化（Group Normalization）[7] 用来解决当批大小较小时批归一化效果较差的问题。层归一化虽然不依赖批大小，但是在卷积神经网络中直接对当前层所有通道数据进行规一化也并不理想。组归一化将通道方向分组，然后在每个组内做归一化，使得一个数据样本在同一组内的所有通道的均值为
    0，方差为 1。计算步骤与批归一化一样，但是不考虑批大小，即与批大小无关。


    给定一个批大小为 N 的样本集合 \( X \in \mathbb{R}^{N \times H \times W \times C} \) 作为输入，\(
    E_{ng}[X] \) 是沿着批方向在每个通道组内计算得到的均值，\( Var_{ng}[X] \) 是沿着批方向在每个通道组内计算得到的方差，\( \epsilon
    \) 是一个很小的数，防止分母为零，\( \gamma \in \mathbb{R}^C \) 为可学习放缩变量，初始值通常设置为 1，\( \beta \in
    \mathbb{R}^C \) 为可学习平移变量，初始值通常设置为 0，其中 \( G \) 为分组数。组归一化的计算公式如下：


    ```

    $$E_{ng}[X] = \frac{1}{(C/G)HW} \sum_{c=gC/G+1}^{(g+1)C/G} \sum_{h=1}^H \sum_{w=1}^W
    X_{h,w,c} \tag{7-39}$$


    $$Var_{ng}[X] = \frac{1}{(C/G)HW} \sum_{c=gC/G+1}^{(g+1)C/G} \sum_{h=1}^H \sum_{w=1}^W
    (X_{h,w,c} - E_{ng}[X])^2 \tag{7-40}$$


    $$Y_{h,w,(gC/G+1):(g+1)C/G} = \frac{X_{h,w,(gC/G+1):(g+1)C/G} - E_{ng}[X]}{\sqrt{Var_{ng}[X]
    + \epsilon}} \tag{7-41}$$


    $$Z_{n,h,w} = Y_{n,h,w} \times \gamma + \beta \tag{7-42}$$

    ```


    其中，\( g \in \mathbb{N}, g=0, \cdots, G-1 \)。可以发现，当 \( G \) 等于 1 时，其等价于层归一化；当 \(
    G=C \) 时，其等价于实例归一化。


    # 5. 权重归一化


    权重归一化（Weight Normalization）将权值 \( w \) 分为一个方向分量 \( v \) 和一个范数分量 \( g \)，使用优化器分别优化这两个参数，如下所示：


    ```

    $$w = \frac{g}{\|v\|} v \tag{7-43}$$

    ```


    其中 \( v \) 是与 \( w \) 同维度的向量，\( \|v\| \) 是欧氏范数，因此 \( v \) 决定了 \( w \) 的方向；\( g
    \) 是标量，决定了 \( w \) 的长度。由于 \(\|w\| = |g| \)，因此这一权重分解的方式将权重向量的欧氏范数进行了固定，从而实现了正则化的效果。


    然后优化方向分量：'
