    ```

    \(\hat{y} = \frac{y_c}{h_{total}} \times S - y_{min}\) \\

    \(\hat{w} = \frac{w_b}{w_{total}}\) \\

    \(\hat{h} = \frac{h_b}{h_{total}}\)

    ```


    置信度 \(\hat{C}\) 的计算公式如下：


    ```

    \(\hat{C} = P_r(\text{Object}) * \text{IoU}_{pred}^{truth}\)

    ```


    置信度 \(\hat{C}\) 由以下两部分组成。


    +   1) \(P_r(\text{Object})\)：用来判断网格内是否有目标（Object），如果有等于 1，没有等于 0。


    +   2) \(\text{IoU}_{pred}^{truth}\)：预测边框的准确度，也就是与标定边框的 IoU。


    类别的条件概率 \(P_r(\text{Class}_i | \text{Object})\) 表示该网格内存在目标物体且属于第 \(i\) 类的概率，测试的时候计算每个类别的得分分：


    ```

    \(P_r(\text{Class}_i | \text{Object}) \times \hat{C}\) \\

    \(= P_r(\text{Class}_i | \text{Object}) \times P_r(\text{Object}) \times \text{IoU}_{pred}^{truth}\)
    \\

    \(= P_r(\text{Class}_i) \times \text{IoU}_{pred}^{truth}\)

    ```


    总之，图像分割成 \(S \times S\) 个网格，每个网格预测 \(B\) 个边框，每个边框预测 5 个值；同时，每个格子预测 \(C\) 个类别，所以检测器最终需要预测一个
    \(S \times S \times (B \times 5 + C)\) 的张量。对于图 2-46 中的例子，\(S=7, B=2, C=20\)，所以最终会得到一个
    \(7 \times 7 \times (2 \times 5 + 20) = 7 \times 7 \times 30\) 的张量。


    YOLO 的损失函数如公式（2-46）所示，它包含四个部分：位置误差、含有目标的置信度误差、不含目标的置信度误差和分类误差，其中，\(1_{ij}^{obj}\)
    表示第 \(i\) 个网格的第 \(j\) 个边框含有目标（Object），\(1_{ij}^{noobj}\) 表示第 \(i\) 个网格的第 \(j\)
    个边框不含有目标（Object），\(1_i^{obj}\) 表示第 \(i\) 个网格含有目标（Object）的一部分。


    ```

    \(\lambda_{coord} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} [(x_i - \hat{x}_i)^2
    + (y_i - \hat{y}_i)^2]\) \\

    \(+ \lambda_{coord} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} [(\sqrt{w_i} -
    \sqrt{\hat{w}_i})^2 + (\sqrt{h_i} - \sqrt{\hat{h}_i})^2]\) \\

    位置误差 \\

    \(+ \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} (C_i - \hat{C}_i)^2\) \\

    含有目标的置信度误差 \\

    \(+ \lambda_{noobj} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{noobj} (C_i - \hat{C}_i)^2\)
    \\

    不含目标的置信度误差 \\

    \(+ \sum_{i=0}^{S^2} 1_i^{obj} \sum_{c \in classes} (p_i(c) - \hat{p}_i(c))^2\)
    \\

    分类误差

    ```


    通过实验可以发现，YOLO 可以学到物体的全局信息，背景误检率比 R-CNN 降低一半，泛化能力强。同时由于 YOLO 采用一阶段方法，检测速度非常快，实时性好。但
    YOLO 前景检测的准确率不如 R-CNN 系列高，小目标检测效果较差。'
