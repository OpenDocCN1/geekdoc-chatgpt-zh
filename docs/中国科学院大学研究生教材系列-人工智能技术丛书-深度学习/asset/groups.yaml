    # A. 2.1 导数的定义


    设函数 \( y=f(x) \) 在点 \( x_0 \) 的某个邻域内有定义，当自变量 \( x \) 在 \( x_0 \) 处有增量 \( \Delta
    x \), \( x_0 + \Delta x \) 也在该邻域时，相应的函数取得增量 \( \Delta y=f(x_0+\Delta x)-f(x_0)
    \)；如果 \( \Delta y \) 与 \( \Delta x \) 之比在 \( \Delta x \to 0 \) 时极限存在，则称函数 \( y=f(x)
    \) 在 \( x_0 \) 处可导，并称这个极限为 \( y=f(x) \) 在点 \( x_0 \) 处的导数，记作 \( f''(x) \) 或 \(
    y''|_{x=x_0} \) 或 \( \frac{dy}{dx}|_{x=x_0} \)，即

    \( f''(x_0) = \lim_{\Delta x \to 0} \frac{f(x_0+\Delta x)-f(x_0)}{\Delta x} \)
