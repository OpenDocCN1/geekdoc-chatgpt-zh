    ## 3.4 循环神经网络的变种


    ### 3.4.1 GRU


    2014 年，Junyoung Chung 等人提出了门限循环单元（Gated Recurrent Unit，GRU）[7]，可认为它是 LSTM 的一个变种。GRU
    可以解决 RNN 不支持长期记忆和反向传播中的梯度消失等问题，与 LSTM 的作用类似，不过比 LSTM 结构简单，容易进行训练。GRU 将 LSTM 中的遗忘门和输入门用更新门来代替，将细胞状态与隐态（记忆）合并，在计算当前时刻记忆的方法和
    LSTM 有所不同。GRU 在音乐建模、语音信号建模领域与 LSTM 具有相似的性能，但是参数少。


    GRU 的网络结构如图 3-13 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_101_0.png)


    图 3-13 GRU 的网络结构


    GRU 中的重置门决定了如何将新的输入 $x_t$ 与前一时刻的记忆 $h_{t-1}$ 相结合以产生新的输入信息，其计算公式如下：


    $$

    r_t=\sigma(W x_t + U h_{t-1} + b_r) \quad (3-23)

    $$


    GRU 中的更新门用于控制前一时刻的记忆 $h_{t-1}$ 被带入当前状态中的程度，也就是更新门帮助模型决定到底要将多少过去的信息传递到未来，简单来说就是用于更新记忆，其计算公式如下：


    $$

    z_t=\sigma(W x_t + U h_{t-1} + b_z) \quad (3-24)

    $$


    基于重置门和更新门，新的记忆 $h_t$ 被更新：


    $$

    h_t=(1-z_t) \cdot h_{t-1}+z_t \cdot \tanh(W x_t+U_h(r_t \cdot h_{t-1})+b_h) \quad
    (3-25)

    $$


    其中：


    - 1) $x_t$ 是 $t$ 时刻的输入向量，$x_t \in \mathbb{R}^m$。

    - 2) $h_t$ 是 $t$ 时刻的记忆或者隐态向量，$h_t \in \mathbb{R}^n$。

    - 3) $z_t$ 是 $t$ 时刻的更新门向量。

    - 4) $r_t$ 是 $t$ 时刻的重置门向量。

    - 5) $W$、$U$ 是连接参数矩阵。

    - 6) $b_r$、$b_z$ 和 $b_h$ 是偏置向量。

    - 7) $\sigma$ 是 Sigmoid 函数。

    - 8) $\tanh$ 是 Tanh 激活函数。


    ### 3.4.2 双向 RNN


    观察上一节讲述的循环神经网络，它在某一时刻，只能从过去的序列以及当前输入中捕获信息，来预测当前输出。然而，在很多的应用中，当前的输出不仅仅依赖于过去和当前的信息，也可能依赖于未来的信息，如语音识别等。


    基于此，双向循环神经网络（Bidirectional Recurrent Neural Network，BRNN）[6] 被提出，其典型的网络结构如图 3-14
    所示。双向 RNN 将从序列起点开始移动的 RNN 与从序列末端开始移动的 RNN 相结合，实现了对过去和未来信息的依赖。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_102_0.png)


    图 3-14 典型的双向循环神经网络


    双向循环神经网络的计算公式如下：


    $$

    \vec{h}_t = f(\vec{U}x_t + \vec{W}\vec{h}_{t-1} + \vec{b}) \quad (3-26)

    $$

    $$

    \vec{h}_t = f(\vec{U}x_t + \vec{W}\vec{h}_{t-1} + \vec{b}) \quad (3-27)

    $$

    $$

    \hat{y}_t = g(V[\vec{h}_t ; \vec{h}_t] + c) \quad (3-28)

    $$


    双向 RNN 也可以扩展到多维输入中，例如对于二维数据，可以分别沿着上、下、左、右 4 个方向构建 RNN，最后将它们结合起来。


    对于双向 RNN，它的训练方法与 RNN 类似，这里不再赘述。


    ### 3.4.3 堆叠 RNN


    堆叠循环神经网络（Stacked Recurrent Neural Network，Stacked RNN）[9] 也是一种循环神经网络的变种，它将多个 RNN
    层堆叠在一起以产生更强大的模型，一个由两层 RNN 组成的堆叠 RNN 如图 3-15 所示。与单层 RNN 相比，堆叠多个 RNN 层可以提供更深的学习和更强的表达能力，这在很多自然语言处理和其他序列建模任务中都取得了很好的效果。


    堆叠 RNN 通常定义为多个递归层，其中每个递归层的输出被作为下一层的输入。这样一来，每个递归层都可以从前面的递归层中学到一个更高级别的表征，并通过更深层的模型进行推理。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_103_0.png)


    图 3-15 一个由两层 RNN 组成的堆叠 RNN


    ## 3.5 循环神经网络的典型应用


    ### 3.5.1 语言模型


    语言模型（Language Model）的核心思想是按照特定的训练方式从语料中提取所蕴含的语言知识，应用于词序列的预测。语言模型通常可以分为基于规则的语言模型和统计语言模型。目前，统计语言模型处于主流地位，它通过对语料库的统计学习，归纳出其中的语言知识，获得词与词之间的连接概率，并以词序列的概率为依据来判断其是否合理。


    统计语言模型的目的是估计自然语言中单词序列 $S = (w_1, w_2, \dots, w_T)$ 的概率，并且这个概率可以表示为一系列给定上文的每个单词的条件概率的乘积：


    $$

    \begin{aligned}

    P(S) &= P(w_1, w_2, \dots, w_T)\\

    &= P(w_1, w_2, \dots, w_{T-1}) P(w_T \mid (w_1, w_2, \dots, w_{T-1}))\\

    &= P(w_1) P(w_2 \mid w_1) \cdots P(w_T \mid (w_1, w_2, \dots, w_{T-1}))

    \end{aligned}

    $$


    这个链式法则建立在假设单词序列中的单词只依赖于出现在它们前面的单词，这是所有统计语言模型的基础。统计语言模型包括传统的 N-gram 语言模型与神经网络语言模型，神经网络语言模型又包括前馈神经网络语言模型、循环神经网络语言模型、LSTM
    语言模型以及 Transformer 语言模型等，这里主要介绍前馈神经网络语言模型、循环神经网络语言模型。


    尽管很多研究者曾试图将人工神经网络应用到语言模型中，但是直到 2003 年 Yoshua Bengio 等人提出前馈神经网络语言模型[11] 才引起人们的广泛关注，之后循环神经网络被应用到语言模型中，使得语言模型的研究取得了突破性的进展。下面对前馈神经网络语言模型和循环神经网络语言模型进行介绍。


    ### 1. 前馈神经网络语言模型


    前馈神经网络语言模型[11] 基于 N-gram 语言模型的思想，单词序列中的单词在统计上更依赖于靠近它的单词，在评估条件概率时，只有前 $(n-1)$ 个直接先导词被考虑，即


    $$

    P(S) = \prod_{t=1}^T P(w_t \mid w_{t-n+1}^{t-1}) \quad (3-30)

    $$


    前馈神经网络语言模型的结构如图 3-16 所示，其中 $w_0$ 和 $w_{T+1}$ 表示单词序列的开始和结束标记。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_104_0.png)


    图 3-16 前馈神经网络语言模型的结构


    在前馈神经网络语言模型中，词汇表是从训练数据中建立的，并且这个词汇表中的每一个单词会被设置为一个独立的索引。为了评估每个单词 $w_i$ 的条件概率，它的
    $(n-1)$ 个直接先导词根据各自在词汇表中的索引使用一个共享矩阵 $C \in \mathbb{R}^{k \times m}$ 线性投影到特征向量中，其中，$k$
    表示词汇表的大小，$m$ 表示向量的维度。实际上，投影矩阵 $C$ 的每一行都表示词汇表中一个单词对应的特征向量。前馈神经网络的输入为 $x \in \mathbb{R}^{n_i}$，其中
    $n_i = m \times (n-1)$ 是前馈神经网络输入层的大小。前馈神经网络可以表示为


    $$

    y=b+Wx+U \times \tanh(d+Hx) \quad (3-31)

    $$


    其中，$H \in \mathbb{R}^{n_h \times n_i}$ 是输入的权重系数，$U \in \mathbb{R}^{n_o \times
    n_h}$ 是输入层与隐藏层之间的权重矩阵，$n_h$ 是隐藏层大小，$n_o=k$ 表示输出层大小，权重矩阵 $W \in \mathbb{R}^{n_o
    \times n_i}$ 是输入层与输出层之间的连接权重，当输入层与输出层之间无直接连接时，权重为 0。$d \in \mathbb{R}^{n_h}$、$b
    \in \mathbb{R}^{n_o}$ 分别是隐藏层和输出层的偏置，$y \in \mathbb{R}^{n_o}$ 表示输出向量，$\tanh(\cdot)$
    是激活函数。


    输出向量的第 $i$ 个元素是未归一化的词汇表中第 $i$ 个单词的条件概率。为了保证所有的条件概率是正数并且加权和为 1，所以在输出层后连接一个 Softmax
    层：


    $$

    P(w_t \mid w_{t-1}, \dots, w_{t-n+1}) = \frac{e^{y_{w_t}}}{\sum_i e^{y_i}} \quad
    (3-32)

    $$


    前馈神经网络语言模型的训练目标是寻找参数 $\theta$ 使得训练数据的对数似然函数最大化：


    $$

    L=\frac{1}{T}\sum_t \log f(w_t, w_{t-1}, \dots, w_{t-n+1}; \theta) + R(\theta)

    $$


    其中，$R(\theta)$ 是正则项，$\theta$ 表示参数集合，$\theta=(b,d,W,U,H,C)$。


    通常采用随机梯度下降方法和反向传播算法作为神经网络语言模型的参数学习算法，参数更新公式如下：


    $$

    \theta \leftarrow \theta + \varepsilon \frac{\partial \log P(w_t \mid w_{t-1},
    \dots, w_{t-n+1})}{\partial \theta}

    $$


    其中，$\varepsilon$ 表示学习率。


    ### 2. 循环神经网络语言模型


    循环神经网络语言模型[12] 是由 Tomas Mikolov 等人提出的，它采用了 Elman 循环神经网络结构，如图 3-17 所示。循环神经网络语言模型主要由输入层、隐藏层和输出层组成，隐藏层有
    30~500 个单元，词汇量大小在 3000 ~ 200 000 之间。由于循环神经网络多用在时序序列上，因此输入层、隐藏层和输出层都有 t 标记。


    循环神经网络语言模型输入层、隐藏层和输出层的计算公式如下：


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_105_0.png)


    $$

    x(t) = w(t) + h(t-1) \quad (3-35)

    $$

    $$

    h_j(t) = f(\sum x_i(t) u_{ij}) \quad (3-36)

    $$

    $$

    y_i(t) = g(\sum h_j(t) v_{ij}) \quad (3-37)

    $$


    其中 $x_t$ 表示 $t$ 时刻的输入，$w(t)$ 表示 $t$ 时刻要输入的单词，$h_j(t)$ 表示 $t$ 时刻的隐藏层状态，$y_k(t)$
    表示 $t$ 时刻的输出，$f(\cdot)$ 表示 Sigmoid 激活函数，$g(\cdot)$ 表示 Softmax 激活函数，$u_{ij}$ 和
    $v_{ki}$ 表示对应的权重。需要注意的是，这里的计算方式与之前的讲述的 RNN 有所不同。


    图 3-17 循环神经网络语言模型


    相较于前馈神经网络语言模型，循环神经网络语言模型有了突破性的进步，这些进步的主要原因是相比于前馈神经网络语言模型，循环神经网络语言模型在结构上能够考虑当前单词之前的全部单词，具有更丰富的语义信息。


    上述神经网络语言模型在取得显著成效的同时，也存在着一些局限性，比如计算复杂性高、语料库单一引起模型缺乏可迁移性、无法处理词汇量过大的情况等。针对这些局限性，出现了很多基于神经网络语言模型的优化技术和改进工作，主要包括层次概率神经网络语言模型（Hierarchical
    Probabilistic Neural Network Language Model）[13]、基于分类的语言模型（Class Based Language
    Model）[14]、上下文依赖的语言模型（Context Dependent Language Model）[15]以及卷积神经网络语言模型（CNN Based
    Language Model）[16] 等。


    衡量不同语言模型质量的基本指标是困惑度（Perplexity），对于单词序列 \( S = (w_1, w_2, \cdots, w_T) \)，其困惑度定义为


    困惑度与一些测试数据之间的交叉熵密切相关，语言模型的困惑度与系统性能有非常强的正相关关系。


    ### 3.5.2 自动文本摘要


    自动文本摘要（Automatic Text Summarization，ATS）是利用计算机自动地将文本（或文本集合）转换生成简短摘要的一种信息压缩技术，可以应用在自动报告生成、新闻标题生成等多个应用场景。一份合格的摘要，需要包含足够的信息量、较低的冗余度和较高的可读性。从生成方法上来说，自动文本摘要的主流方法有两种，一种是抽取式文本摘要（Extractive
    Text Summarization），另一种是生成式文本摘要（Abstractive Text Summarization）。


    - 1. 抽取式文本摘要


    抽取式文本摘要就是从原文中抽取一些句子组成摘要，它本质上是一种排序问题。通过一定的算法对原文中的句子进行重要性评分，抽取高分句子，去除冗余得到摘要。抽取式摘要方法简单直观，因此应用比较广泛。


    Text Rank 排序算法[17] 是一种经典的抽取式摘要生成算法，该算法的基本步骤：1）去除原文中的停用词，度量原文中每个句子的相似度，计算每一个句子相对于另一个句子的相似度得分，迭代传播，直至误差小于某一个范围；
    2）对关键句子进行排序，根据摘要长度选择一定数量的句子组成摘要。


    抽取式方法主要考虑句子的重要性，直接从原文中抽取已有的句子组成摘要，但是缺乏语义信息，不符合摘要生成的本质。


    - 2. 生成式文本摘要


    随着深度学习技术和序列到序列模型的发展，生成式文本摘要成为一种主流的自动文本摘要方法。生成式文本摘要的主流框架是序列到序列结构，也就是编码器-解码器（Encoder-Decoder）结构[18]，普遍的做法是使用单向循环神经网络或双向循环神经网络作为编码器，将原文进行编码，使用单向循环神经网络作为解码器，负责从编码器所生成的向量中提取语义信息，生成文本摘要。生成式文本摘要模型的一般结构如图
    3-18 所示。


    但是由于“长距离依赖”问题的存在，RNN 到最后一个时间步输入单词时，已经丢失了相当一部分信息。此时编码生成的语义向量同样也丢失了大量信息，就可能导致生成的摘要准确性不高。为了解决这个问题，在摘要生成的任务中引入了注意力（Attention）机制[19]。基于注意力机制的生成式文本摘要模型如图
    3-19 所示。

