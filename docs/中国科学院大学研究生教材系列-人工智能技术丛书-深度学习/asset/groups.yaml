    ) 是相等的，因为 \\(P(h^{l-1}, h^l)\\) 表示的是 RBM，而 RBM 可以进行准确的推理。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_193_0.png)\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_193_1.png)\n\n在 DBN 训练过程中，每一层都当作 RBM\
    \ 来训练，$Q(h^k, h^{k-1})$ 表示用这种方式训练的第 $k$ 个 RBM，而 $P(\\cdot)$ 表示 DBN 中的概率。由于 $Q(h^k\
    \ | h^{k-1})$ 是可因式分解的，所以计算起来比较容易，而 $P(h^k | h^{k-1})$ 是非因式分解的，计算非常复杂，所以使用 $Q(h^k\
    \ | h^{k-1})$ 作为 $P(h^k | h^{k-1})$ 的近似值。为了得到 DBN 中每层的近似后验概率，执行如下步骤：\n- 从第 1 层\
