    \(\text{obj}(\theta) = E_{(x, s) \sim D^{\text{RL}}_{\pi_{\theta}^{\text{RL}}}}
    \left[ r_{\theta}(x, y) - \beta \log \left( \frac{\pi_{\theta}^{\text{RL}}(y \mid
    x)}{\pi^{\text{SFT}}(y \mid x)} \right) \right] + \gamma E_{(s) \sim D_{\text{pretrain}}}
    [\log(\pi_{\theta}^{\text{RL}}(x))] \tag{4-28}\)


    其中，\(\pi_{\theta}^{\text{RL}}\) 是强化学习策略，\(\pi^{\text{SFT}}\) 是有监督训练的模型，\(D_{\text{pretrain}}\)
    是数据的预训练分布。\(\beta\) 是 KL（KL 散度距离）奖励系数，\(\gamma\) 是预训练损失系数。


    ChatGPT 是目前影响最大的 GPT 模型，它在人机对话领域超过了以往任何一个对话模型，取得了令人振奋的成绩。ChatGPT 的工作模式与 InstructGPT
    大致相似，只是使用的数据集有些区别。OpenAI 目前尚未公布 ChatGPT 的详细技术细节，官方发布的博客中的大致描述是 ChatGPT 使用了对话精调的方式，即多轮
    Prompt 和上下文，在训练 InstructGPT 模型中用到的数据集也被转换成对话的形式合并使用。基于反馈的强化学习方法仍然被使用。


    # 4.4 BERT 系列模型


    纯 Encoder 模型只使用 Transformer 中的 Encoder 部分，也就是说，在这类模型中，注意力机制可以访问到原始输入句子中的所有单词。基于
    Transformer 的双向编码器表示模型（Bidirectional Encoder Representations from Transformer，BERT）[10]
    就是一种基于 Transformer 的纯 Encoder 模型，2018 年由 Goolge 公司的 Jacob Devlin 等人提出，广泛应用于自然语言处理领域的各种任务，比如句子分类、句子相似度计算、自然语言推理、命名实体识别、基于机器阅读'
  md: '

    ![](img/57b180d92f84b0150a5b5e4fc7583b76_124_0.png)


    图 4-10 多头注意力机制


    \(\mathbb{R}^{d_{model} \times d_k}, W_k \in \mathbb{R}^{d_{model} \times d_k},
    W_v \in \mathbb{R}^{d_{model} \times d_v}, W^o \in \mathbb{R}^{h d_v \times d_{model}}\)。通常，取
    \(h=8\)，那么 \(d_k = d_v = \frac{d_{model}}{h} = \frac{512}{8} = 64\)。


    在 4.2.1 节中提到，Transformer 的解码部分的第 3 个子层是一个带有掩码操作的多头自注意力机制。这是因为在实际的序列到序列解码的过程中，通常采用一种称作
    Teacher-Force 的方法进行解码过程中的指导，就是说，在 \(t\) 时刻解码到当前单词的时候，通常需要已经产生的单词作为输入历史信息对当前单词进行概率预测。在序列到序列模型中，为了提高模型的准确率，减轻累积错误，通常这部分已经产生的单词直接采用目标序列中截止
    \(t\) 位置的单词序列作为 Teacher 进行生成指导。当这种方法应用在 Transformer 模型中，为了避免模型提前看到 \(t\) 时刻之后的单词，需要对输入序列
    \(t\) 时刻之后的单词进行掩码，也就是带有掩码操作的多头自注意力机制。具体来说，对于前文中的输入 \(X\)，假设通过输入编码得到 \(e = \{e_1,
    e_2, e_3, e_4, e_5\}\)，那么在带有掩码的多头注意力机制中，会有一个掩码矩阵，当解码到第 \(i\) 个单词的时候，第 \(i+1\)
    个单词被掩盖，继而进行后面的操作得到输出，如图 4-11 所示。


