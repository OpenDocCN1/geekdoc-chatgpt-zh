    +   矩阵 A 的奇异值分解的一般求解过程如下：

    +   1) 求 A^T A 的特征值 {λ_i} 和特征向量 {v_i}, i = 1, 2, ..., n。

    +   2) 求 AA^T 的特征向量 {u_j}, j = 1, 2, ..., m。

    +   3) 得到 U=[u_1, u_2, ..., u_m], V=[v_1, v_2, ..., v_n], Σ=[matrix], Σ_i = diag(√λ_i)。


    # A. 1. 3 范数


    范数（Norm）的定义：深度学习中，很多时候都需要衡量一个向量的大小，此时便需要用到范数。范数是将向量映射到非负实数的函数，它满足以下三条性质。


    +   1) 非负性：f(x) >= 0(f(x)=0 <=> x=0)。

    +   2) 齐次性：∀ α ∈ R, f(αx) = |α|f(x)。

    +   3) 三角不等式：f(x+y) <= f(x) + f(y)。


    L_p 范数是使用最为广泛的一种范数，计算公式如下：


    $$\|x\|_p = (\sum_i |x_i|^p)^{\frac{1}{p}}$$ (A-10)


    其中 p=2 时，该范数等价于向量和原点的欧氏距离。


    在深度学习中，有时也需要衡量矩阵的大小，最常见的做法是使用 Frobenius 范数，矩阵 A 的 Frobenius 范数计算公式如下：


    $$\|A\|_F = \sqrt{\sum_{i,j} A_{i,j}^2}$$ (A-11)


    # A. 1. 4 距离


    距离（Distance）的定义：设有 d 维空间的三个样本 x, y, z，记 d(·, ·, ·) 为一个 R^d × R^d → R 的映射，如满足如下几个条件，则称
    d(·, ·, ·) 为一个距离。


    +   1) 非负性：d(x, y) >= 0。

    +   2) 自相似性：d(x, x) = 0。

    +   3) 对称性：d(x, y) = d(y, x)。

    +   4) 三角不等式：d(x, y) <= d(x, z) + d(z, y)。


    在机器学习和深度学习中，距离常用来衡量数据样本之间的相似程度。因此，选择合适的距离，在做分类、聚类等任务时都十分重要。


    常用距离：设 x, y ∈ R^d，闵可夫斯基距离（Minkowski Distance）定义为


    $$d(x, y) = (\sum_{i=1}^d |x_i - y_i|^q)^{\frac{1}{q}}$$ (A-12)


    当 q=1 时，称为曼哈顿距离（Manhattan Distance），定义如下：


    $$d(x, y) = \sum_{i=1}^d |x_i - y_i|$$ (A-13)'
