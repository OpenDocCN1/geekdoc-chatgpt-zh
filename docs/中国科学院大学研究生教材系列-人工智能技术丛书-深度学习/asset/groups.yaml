    # 4.6.3 多模态领域


    Transformer 在多模态领域，如图像描述（Image Captioning）、视觉问答（Visual Question Answering）和文本生成图像（Text-to-Image
    Generation）等任务中都有很多应用，这里主要介绍 Transformer 在图像描述任务中的应用。


    基于深度学习的图像描述方法大多采用“编码器-解码器”（Encoder-Decoder）结构，其


    图 4-32 根据文献 [20] 重新绘制。'
  - '[PAGE 149]


    中编码器用于提取给定图像的视觉特征，而解码器用于将视觉特征解码为文本描述。早期的方法常采用卷积神经网络（如 VGG-16、ResNet 等）作为编码器，循环神经网络（如
    GRU、LSTM 等）作为解码器，之后目标检测网络（如 Faster R-CNN）被引入作为编码器提取图像区域级特征而非网格特征，这些方法均可归类于 CNN-RNN
    类方法。


    Transformer 模型的提出在自然语言处理领域相关任务上取得重大突破，随后又被成功拓展到计算机视觉领域任务上。Transformer 模型的成功也促使了研究人员探索其在图像描述任务上的应用，进而出现了
    CNN-Transformer 类方法与 Transformer-Transformer 类方法。


    # 1. CNN-Transformer 类方法


    Transformer 的提出最初是作为语言模型应用于自然语言处理领域任务，针对图像描述任务，一个很直观的改进思路则是将 CNN-RNN 中的解码器由 RNN
    替换为 Transformer，将此类方法称为 CNN-Transformer 类方法，X-Transformer[23]、M2Transformer[24]、RSTNet[25]
    和 DLCT[26] 等工作均属于此类方法，这里以 M2Transformer 为例进行介绍。


    M2Transformer 的整体框架由三部分组成：骨干编码器（Backbone Encoder）、记忆增强编码器（Memory-Augmented Encoder）和网格解码器（Meshed
    Decoder）。如图 4-33 所示，其中骨干编码器采用 Faster R-CNN 提取图像的区域特征，记忆增强编码器和网格解码器均采用 Transformer
    结构，记忆增强编码器可视为骨干编码器的扩展结构，旨在对图像区域特征进行语义增强，网格解码器则用于生成文本描述。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_149_0.png)


    [图 4-33 M2Transformer 的总体框架]


    给定 RGB 图像 \( I \)，M2Transformer 模型的前向流程可以表示如下：


    ```

    \( X = \text{BackboneEncoder}(I) \) (4-46)

    \( \widetilde{X}_1, \widetilde{X}_2, \cdots, \widetilde{X}_n = \text{Memory-AugmentedEncoder}(X)
    \) (4-47)

    \( \widetilde{Y} = \text{MeshedDecoder}(\widetilde{X}_1, \widetilde{X}_2, \cdots,
    \widetilde{X}_n) \) (4-48)

    ```


    在 M2Transformer 中，记忆增强编码器和网格解码器均采用了 Transformer 结构，其核心为多头自注意力层，计算公式如下：'
  - '[PAGE 150]


    Attention(Q, K, V) = softmax\left(\frac{QK^T}{\sqrt{d_k}}\right) V \quad (4-49)

    MSA(Q, K, V) = Concat(head_1, \cdots, head_h) \quad (4-50)

    head_i = Attention(Q^i, K^i, V^i), \quad i = 1, 2, \cdots, h \quad (4-51)


    M2Transformer 采用了目标检测模型 Faster R-CNN 提取图像的区域特征 $X = \{x_1, \cdots, x_{n_x}\},
    x_i \in \mathbb{R}^D$。得到图像的区域特征 $X \in \mathbb{R}^{n \times d}$ 后，应用多头自注意力可以实现对图像区域特征
    $X$ 内部成对关系的编码与建模，从而实现对特征进行语义增强的作用，计算公式如下：


    $X'' = \text{MSA}(W_q X, W_k X, W_v X) \quad (4-52)$


    其中，$W_q, W_k, W_v \in \mathbb{R}^{d \times D}$ 为可学习参数，输出 $\widetilde{X}$ 与输入 $X$
    大小一致。


    但是 M2Transformer 认为如上这种自注意力仅仅依赖于特征内部成对之间的相似性，而无法对图像区域之间的先验知识关系进行建模以获取更高维的语义信息。例如，给定图像的两个区域特征，一个区域包含一个人，另一个区域包含一个篮球，在没有任何先验知识的情况下，模型很难推断出“球员”或者“比赛”这些更为抽象的信息。基于以上考虑，M2Transformer
    在自注意力原有 $K$ 和 $V$ 的基础上，引入了额外的“记忆槽”（Memory Slot）用于对先验信息进行编码，并且为了强调先验信息是独立于输入 $X$
    的，“记忆槽”被建模为可训练的参数矩阵。相应输入与输出的计算公式如下：


    $X'' = \text{LayerNorm}(\text{MSA}(W_q X, K, V) + X) \quad (4-53)$

    $K = [W_k X, M_k], \quad V = [W_v X, M_v] \quad (4-54)$

    $\widetilde{X} = \text{LayerNorm}(\text{FeedForward}(X'') + X'') \quad (4-55)$


    其中，$M_k, M_v \in \mathbb{R}^{n \times m \times d}$ 为可学习的“记忆槽”参数，FeedForward 层由带有
    ReLU 激活函数的两个线性层组成，可表示如下：


    $\text{FeedForward}(x) = W_2 \text{ReLU}(W_1 x) \quad (4-56)$


    其中，$W_1 \in \mathbb{R}^{(4D) \times D}$ 和 $W_2 \in \mathbb{R}^{D \times (4D)}$
    为两个线性层的可学习参数矩阵。


    记忆增强编码器由多个上述编码层结构按顺序堆叠组成，第 $i$ 层的输出作为第 $(i+1)$ 层的输入，相当于创建了图像区域之间关系的多级编码，因此 $N$
    个编码层的堆叠将产生 $N$ 个输出 $\{\widetilde{X}_1, \widetilde{X}_2, \cdots, \widetilde{X}_N\}$
    作为图像的多级区域特征。记忆增强编码器的细节结构如图 4-34 所示。


    网格解码器的细节结构如图 4-35 所示，该模块使用已生成的单词以及记忆增强编码器输出的多级区域特征作为输入，表示如下：


    $Y'' = \text{LayerNorm}(\text{MSA}(W_q Y, W_k Y, W_v Y) + Y) \quad (4-57)$

    $Y'''' = \sum_i \alpha_i \odot \text{LayerNorm}(\text{MSA}(W_q Y, W_k \widetilde{X}_i,
    W_v \widetilde{X}_i) + Y) \quad (4-58)$

    $\widetilde{Y} = \text{LayerNorm}(\text{FeedForward}(Y'''') + Y'''') \quad (4-59)$


    其中，$W_q, W_k, W_v^i \in \mathbb{R}^{d \times D}$ 为掩码自注意力（Masked Self-Attention）层中可学习参数，$W_q,
    W_k, W_v \in \mathbb{R}^{d \times D}$ 为跨模态注意力（Cross Attention）层中可学习参数，$\odot$
    表示逐元素相乘操作（Element-Wise Product）。'
