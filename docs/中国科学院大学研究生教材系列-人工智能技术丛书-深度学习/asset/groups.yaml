    ## 引言


    ### 1.1 深度学习的起源与发展


    ### 1.1.1 深度学习的起源


    “深度学习”（Deep Learning）的概念是 2006 年由多伦多大学（University of Toronto）的 Geoffrey Hinton
    教授与他的同事们提出的[1-2]，他也因此被称为“深度学习之父”。但是，由于深度学习与人工神经网络（Artificial Neural Network，ANN）息息相关，它的起源可以追溯到更早的时间，如图
    1-1 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_28_0.png)


    图 1-1 深度学习的起源


    1943 年，神经学家 Warren McCulloch 和数学家 Walter Pitts 提出了 M-P 神经元模型[3]（McCulloch-Pitts
    Neuron Model），M-P 神经元模型模拟人类神经元的结构和工作原理，奠定了人工神经网络的基础。


    1949 年，生理心理学家 Donald Olding Hebb 提出了 Hebb 学习规则[4]，它的主要思想是当神经元之间反复发送信号时神经元之间的连接权重会增加，反之会减小。Hebb
    学习规则奠定了人工神经网络学习算法的基础。


    1958 年，心理学家 Frank Rosenblatt 提出了由两层神经元组成的人工神经网络，称为“感知机”（Perceptron）[5]。感知机可以模拟人类大脑的分层结构，采用
    Hebb 学习规则或最小二乘法来训练感知机的参数。


    1969 年，Marvin Minsky 和 Seymour Papert 指出感知机只能完成非常基础的任务，无法解决异或操作（XOR）这样的线性不可分问题[6]，这导致人工神经网络的研究陷入低谷。


    1980 年，Kunihiko Fukushima 提出了模拟生物视觉传导通路的神经认知机（Neocognitron）[7]。神经认知机由负责对比度提取的
    G 层、负责图形特征提取的 S 层和抗变形的 C 层交替排列组成，能够识别复杂的物体。神经认知机被认为是卷积神经网络的原始模型。


    1982 年，物理学家 John Joseph Hopfield 提出了 Hopfield 神经网络[8]。Hopfield 神经网络可以模拟人类的记忆，有连续型和离散型两种类型，分别用于优化计算和联想记忆。


    1986 年，David Rumelhart、Geoffrey Hinton 和 Ronald Williams 重新独立提出了训练多层感知机的反向传播算法（Back
    Propagation，BP）[9]，并指出多层感知机可以解决异或操作这样的线性不可分问题，这使得 BP 算法得到了普及，并使人工神经网络的研究重新成为热点。


    1986 年与 1990 年，分别出现了 Jordan Network[10] 与 Elman Network[11] 两种循环神经网络（Recurrent
    Neural Network，RNN），但是由于当时没有合适的应用场景，它们很快淡出了人们的视野。


    1995 年，Corinna Cortes 和 Vladimir Vapnik 提出了用于分类任务的支持向量机（Support Vector Machine，SVM）[12]，除了其简单的训练方法与优越的性能超过了人工神经网络之外，其良好的可解释性使得人工神经网络研究再次进入低谷期。


    1997 年，Jürgen Schmidhuber 和 Sepp Hochreiter 提出了长短期记忆网络（Long-Short Term Memory，LSTM）[13]，极大地提高了循环神经网络的效率和实用性，促进了循环神经网络的发展，但在当时并没有引起工业界的关注。


    1998 年，Yann LeCun 提出了称作 LeNet-5 的卷积神经网络（Convolutional Neural Network，CNN）[14]，率先将人工神经网络应用于图像识别任务，但在当时也没有引起大的轰动。


    2006 年，Geoffrey Hinton 教授和他的同事们提出了一种称作深度信念网络（Deep Belief Network，DBN）[1] 的多层网络并进行了有效的训练，同时提出了一种通过多层神经网络进行数据降维的方法[2]，正式提出了深度学习的概念，并在
    2012 年之后在业界引起了巨大的反响。


    ### 1.1.2 深度学习的发展


    深度学习概念在 2006 年提出后，学术界与产业界都对其进行了大量的研究。经过几年的研究，深度学习开始爆发出惊人的能量，很多经典的深度学习算法也陆续出现，如图
    1-2 所示。

