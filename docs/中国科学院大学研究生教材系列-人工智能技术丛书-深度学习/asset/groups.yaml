    的准确率。


    DeepID 的研究团队同年又提出了 DeepID2[34]，与 DeepID 相比，DeepID2 中的卷积神经网络的输入尺寸更大，输入图像大小从 39×31
    增大到 55×47，如图 2-58 所示。DeepID2 的最大改进在于同时使用识别信号和验证信号来监督学习过程，而在 DeepID 中只用到了识别信号。DeepID2
