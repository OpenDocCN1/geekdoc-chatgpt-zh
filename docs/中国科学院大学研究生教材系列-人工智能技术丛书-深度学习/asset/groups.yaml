    假定噪声的期望 \( E[(y-l)]=0 \)，那么


    ```

    \(\begin{aligned} & E[2(\bar{y}-y)(y-l)] \\ = & 2E[(\bar{y}-y)]E[(y-l)] \\ = &
    0 \end{aligned}\) (7-10)

    ```


    由此可以得出泛化误差、偏差、方差和噪声之间的关系，如下所示：


    ```

    \(\underbrace{GenError(x)}_{泛化误差} = \underbrace{E[(\bar{y}-\bar{y})^2]}_{方差 Var}
    + \underbrace{E[(\bar{y}-y)^2]}_{偏差 bias} + \underbrace{E[(y-l)^2]}_{噪声 \epsilon^2}\)
    (7-11)

    ```


    # 7.1.4 深度学习模型的训练与测试过程


    在训练深度学习模型时，一般先设计一个神经网络结构，在训练集上进行训练，在迭代一定的轮数（Epoch）后计算偏差。如果偏差较大，继续进行迭代，如果偏差仍然没有大幅度减小，就需要设计更复杂的神经网络结构（增加每层神经元的数量、增加神经网络的层数等）后再进行训练，直到偏差减小到既定的阈值之内。之后，在验证集上计算训练好的模型的方差，如果方差比较高，说明出现了过拟合现象，就要采取一些措施来降低方差，如增加数据量重新训练、采用一些正则化方法、减少网络参数和降低模型复杂度等，直到方差减小到既定的阈值之内。最后，在测试集上进行模型测试，一般情况下，泛化误差都能满足要求，如果出现泛化误差比较大的情况，根据泛化误差计算公式（7-11），在偏差与方差都比较小的情况下，一般是由数据中含有较多的噪声造成的，这就需要提前对数据进行降噪处理。深度学习模型的训练与测试流程如图
    7-7 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_214_0.png)


    图 7-7 深度学习的训练与测试过程


    # 7.2 参数范数正则化


    参数范数正则化方法早在深度学习出现之前就已经在使用了。参数范数正则化方法可以简单地在损失函数 L 后添加一个参数范数正则化项 \( \Omega(\theta)
    \)，来限制模型的学习能力，正则化后的损失函数可表示为


    ```

    \(\tilde{L}(\theta; x, y) = L(\theta; x, y) + \alpha \Omega(\theta)\) (7-12)

    ```


    其中，\( \alpha \) 是正则项系数，它是一个超参，用来控制惩罚项 \( \Omega \) 对损失函数的惩罚大小。'
  - "[PAGE 215]\n\n当最小化正则化后的损失函数时，它会同时降低原有损失函数 $L$ 和正则化项 $\\Omega(\theta)$ 的值，即在保证获得小误差的同时减少参数规模，一定程度上减少了过拟合的程度。对于参数范数正则化项，可以选择不同的范数形式，得到不同的优先解。\n\
    \n参数范数正则化中最常见的就是 L1 正则化与 L2 正则化，下面将分别介绍两种参数正则化方法。在介绍之前，先假设 $w$ 为需要正则化的参数，$\theta$\
    \ 为全体参数，它包括需要正则化的参数 $w$ 与不需要正则化的参数。\n\n# 7.2.1 L1 参数正则化\n\nL1 参数正则化在损失函数中添加一个正则化项：\n\
    \n$$\\Omega(\theta) = \\|w\\|_1$$ (7-13)\n\nL1 正则化项就是各个参数的绝对值之和。L1 参数正则化也称为 Lasso\
    \ 回归（ Lasso Regression ）。\n\n由此，加上 L1 正则化项的损失函数变为\n\n$$\tilde{L}(w; x, y) = L(w;\
    \ x, y) + \\alpha \\|w\\|_1$$ (7-14)\n\n# 7.2.2 L2 正则化\n\nL2 正则化是在损失函数中添加一个正则化项：\n\
    \n$$\\Omega(\theta) = \\frac{1}{2} \\|w\\|_2^2$$ (7-15)\n\nL2 正则化项就是各个参数的平方和再开方。L2\
    \ 正则化也称为岭回归（ Ridge Regression ），它可以看作是将模型的参数加上了一个较强的先验，并假设参数不会太大。\n\n由此，加上 L2\
    \ 正则化项的损失函数变为\n\n$$\tilde{L}(w; x, y) = L(w; x, y) + \\frac{\\alpha}{2} \\|w\\\
    |_2^2$$ (7-16)\n\n# 7.3 数据增强\n\n深度学习的快速发展离不开大规模数据集的出现，但并不是所有任务都有足够的训练数据，如果不对已有数据进行扩充来进行模型训练，极有可能使得模型陷入过拟合中。数据增强（\
    \ Data Augmentation ）可以简单地理解为对训练数据数量的扩充，利用已有的有限数据产生更多的有效数据。因此，在数据集数据量有限时，进行数据增强就显得很有必要，一方面可以尽可能地避免过拟合；另一方面随着训练数据的增多，也会在一定程度上提高模型的泛化性。本书主要介绍图像数据增强的常用方法。\n\
    \n图像数据增强主要有两种常见的方法：空间变换和像素颜色变换。空间变换是最常见也是最直观的图像增强手段之一，如对图像进行随机翻转、旋转、平移和裁剪等操作，在进行数据增强操作时，可以同时进行多种操作。像素颜色变换更多的是对图像像素值进行修改，"
  - "[PAGE 216]\n\n如在原始图像上进行对比度扰动、饱和度扰动、颜色变换与噪声扰动等操作。可以利用OpenCV、PIL 等图像处理库进行数据增强，同时在常用的深度学习框架（如\
    \ TensorFlow、PyTorch 和飞桨）中，都有相应的图像增强函数可供直接调用。\n\nPyTorch 框架中与图像数据增强相关的函数位于 torchvision.transforms\
    \ 中，主要包括如下几种。\n\n+   1) 颜色变换函数 ColorJitter(brightness=0, contrast=0, saturation=0,\
    \ hue=0)：可以对输入图像的亮度（brightness）、对比度（contrast）、饱和度（saturation）和色调（hue）进行随机变换。\n\
    +   2) 灰度变换函数 Grayscale(num_output_channels=1)：直接将输入图像转换为灰度图像，channels=1 是默认值，也可以指定其他值。\n\
    +   3) 灰度变换函数 RandomGrayscale（p=0.1）：在概率 p 下将输入图像转换为灰度图像，p=0.1 是默认值，也可以指定其他值。\n\
    +   4) 随机旋转变换函数 RandomRotation（degrees）：参数 degrees 用于指定可以旋转的度数范围。\n+   5) 随机水平翻转函数\
    \ RandomHorizontalFlip(p=0.5)：在概率 p 下将输入图像进行水平翻转，p=0.5 是默认值，也可以指定其他值。\n+   6)\
    \ 随机垂直翻转函数 RandomVerticalFlip(p=0.5)：在概率 p 下将输入图像进行垂直翻转，p=0.5 是默认值，也可以指定其他值。\n\
    +   7) 仿射变换函数 RandomAffine（degrees，translate = None，scale = None，shear = None）：对输入图像进行仿射变换，参数\
    \ degrees 指定旋转角度，translate 设置平移区间，scale 设置缩放比例，shear 设置错切角度。\n\n若要了解更多关于图像数据增强函数及其参数的细节，请查阅\
    \ PyTorch 文档，详细情况请参见 https://pytorch.org/vision/stable/transforms.html。\n\n下面给出对图像进行颜色变换数据增强的\
    \ PyTorch 示例代码：\n\n```\n# 导入需要的库\nimport torchvision.transforms as transforms\
    \ from PIL import Image\n# 构造数据增强操作\ndata_aug = transforms.Compose([\n    transforms.ColorJitter\
    \ (brightness=[0.5, 0.9], contrast=[0.8, 1], satura-\ntion=[0.6, 0.9], hue=0.3)\n\
    ])\n# 读取输入图像\norig_img = Image.open(\"PATH/OF/IMAGE\")\n# 执行数据增强\naug_img = data_aug(orig_img)\n\
    ```"
