    # 2.4.4 GoogleNet


    GoogleNet[6] 由 Google 公司提出，它的主要思想是除了在网络深度上加深（22 层）之外，在宽度上也加宽。GoogleNet 的核心是 Inception
    模块，它体现了在网络宽度上加宽的思想，基本结构如图 2-35 所示。Inception 模块包含 4 个分支，每个分支均使用了 1×1 卷积，它可以跨通道组织信息，提高网络的表达能力，同时还可以对输出通道进行升维和降维。Inception
    模块中包含了 1×1、3×3、5×5 三种不同尺寸的卷积和 1 个 3×3 最大池化，增强了网络对不同尺度特征图的适应性。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_68_1.png)


    图 2-35 GoogleNet 中的 Inception 模块'
