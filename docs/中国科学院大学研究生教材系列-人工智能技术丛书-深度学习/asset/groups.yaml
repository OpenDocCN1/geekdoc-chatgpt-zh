    Neural Network）、变分学习（Variational Learning）与深度学习等领域做出杰出文献，被誉为“深度学习之父”。


    Geoffrey Hinton 教授于 1970 年获剑桥大学（University of Cambridge）实验心理学学士学位，1978 年获爱丁堡大学（University
    of Edinburgh）人工智能学博士学位，1982 ~ 1987 年在卡内基梅隆大学（Carnegie-Mellon University）工作，历任助理教授、副教授，之后加入多伦多大学计算机科学系，任教授。他也曾在
    Google 公司工作，任主任工程研究员和 Vector 研究院首席科学家。


    Geoffrey Hinton 教授长期从事人工神经网络领域研究，20 世纪 80 年代以来，这个领域很多重大的成果几乎都和他的研究组有关，例如：1985
    年，Geoffrey Hinton 和 Terry Sejnowski 在 Hopfield 神经网络的基础上提出了玻尔兹曼机，之后还提出了用于训练受限玻尔兹曼机和
    Product of Expert 的对比散度算法（Contrastive Divergence，CD）；1986 年，David E. Rumelhart、Geoffrey
