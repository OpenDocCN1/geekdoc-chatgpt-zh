    \ m \\)\nfor 所有 \\( S \\) 中的训练样本 \\( v^{(i)} \\) do\n  //训练第一个 RBM\n  将 \\( x\
    \ \\) 初始化为 \\( v^{(i)} \\)\n  \\( h^0=x \\)\n  调用 RBM \\( (h^0, h^1) \\)，得到 \\\
    ( w^1, b^1 \\) 和 \\( c^1 \\)\n  //逐层堆叠 RBM\n  for \\( k=1:l-1 \\) do\n    将 \\\
