    # # 深度学习框架


    # ## 8.1 深度学习框架概述


    在深度学习出现的早期，人们需要使用某种编程语言（如 C++、Python、Java 等）重头编写代码来实现深度学习算法的训练、验证与测试过程，效率较低。随着深度学习的快速发展，很多研究者将实现一些常见功能（如卷积、池化和优化算法等）的代码进行了封装，出现了很多支撑深度学习算法模型训练、验证与测试的深度学习框架，大大提高了深度学习模型的开发效率。具体地，常见的深度学习框架有早期的
    Theano、Neon、MXNet、Caffe、CNTK 等以及目前常用的 TensorFlow、PyTorch、飞桨（PaddlePaddle）、昇思（Mindspore）等。常见的深度学习框架如表
    8-1 所示。这些深度学习框架都有各自的特点和优势，选择适合特定需求的深度学习框架可以提高开发效率和模型的性能。


    | 深度学习框架 | 发布时间 | 发布者 | 支持语言 | 主要特点 | 官方网址 |

    |---|---|---|---|---|---|

    | TensorFlow | 2015 年 | Google | Python/C++/Java/Go | 高度的灵活性、可移植性、多语言支持、丰富的算法库、完善的文档
    | https://tensorflow.google.cn/ |

    | Caffe | 2013 年 | UC Berkeley | Python/C++/MATLAB | 高效、灵活、可扩展、多后端支持、大量文档和教程 |
    http://caffe.berkeleyvision.org/ |

    | CNTK | 2016 年 | Microsoft | Python/C++/BrainScript | 跨平台、支持分布式训练 | https://learn.microsoft.com/zh-cn/cognitive-toolkit/
    已停止主要更新 |

    | MXNet | 2017 年 | DMLC | Python/C++/MATLAB/Julia/Go/R/Scala | 可扩展、灵活、多语言支持、支持物联网和边缘设备
    | https://mxnet.apache.org |'
