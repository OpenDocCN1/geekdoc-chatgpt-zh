    # 本章人物：Ian Goodfellow 博士


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_185_0.png)


    Ian Goodfellow（1985 ~），本科与硕士就读于斯坦福大学（Stanford University），师从 Andrew NG（吴恩达）教授和
    Gary Bradski 教授，博士就读于蒙特利尔大学（University of Montreal），师从 Yoshua Bengio 教授和 Aaron
    Courville 教授，于 2014 年获博士学位。博士毕业后，在 Google 公司任高级研究员直到 2019 年，之后加入 Apple 公司 Special
    Projects Group 担任机器学习总监，2022 年离职，据公开报道，目前 Ian Goodfellow 已加入 Google DeepMind 公司，继续从事人工智能研究工作。


    Ian Goodfellow 的主要贡献是 2014 年提出了生成对抗网络（Generative Adversarial Network，GAN），之后几年
    GAN 热潮席卷了 AI 领域几乎所有顶级会议，大量基于 GAN 的高质量论文被发表与讨论。Yann LuCun 也对 GAN 给出了很高的评价，他认为“GAN
    为创建无监督学习提供了强有力的算法框架，有望帮助我们为 AI 加入常识，沿着这条路走下去，有不小的成功机会能开发出更加智慧的 AI”。基于 Ian Goodfellow
    在 GAN 领域的贡献，他也因此入选 2017 年“MIT 评论 35 岁以下创新人物”。目前，GAN 已经被广泛应用于图像生成、音乐生成、语音合成和异常检测等领域。


    Ian Goodfellow 还和 Yoshua Bengio、Aaron Courville 两位教授合作撰写了 Deep Learning 一书，该书已被翻译成中文，成为学习深度学习的必读书籍之一。


    Ian Goodfellow 博士的个人主页：https://www.iangoodfellow.com/。'
