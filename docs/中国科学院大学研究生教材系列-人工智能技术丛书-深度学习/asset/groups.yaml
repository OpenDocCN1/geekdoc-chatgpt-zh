    ![](img/57b180d92f84b0150a5b5e4fc7583b76_121_0.png)


    # 4.2.2 Transformer 的输入编码


    与其他的序列到序列模型类似，Transformer 首先将输入序列转换成词嵌入（Word Embedding）向量（简称词向量）。在实现过程中，词向量可以随机初始化后随着网络训练得到，也可以加载预先训练好的词向量表示，如
    Word2Vec、Glove 等。


    图 4-6 根据文献 [1] 重新绘制。'
  - '[PAGE 122]


    然而，由于 Transformer 中不包含递归或者卷积操作，因此，为了使得 Transformer 架构能够在编码输入序列时包含位置信息，在词向量之外，还增加了位置嵌入（Position
    Embedding，PE）向量（简称位置向量）。具体地，采用不同频率的正弦和余弦函数得到输入序列中每个标记的位置向量：


    ```

    PE_{(pos, 2i)} = sin(pos/10000^{2i/d_{model}}) (4-14)

    PE_{(pos, 2i+1)} = cos(pos/10000^{2i/d_{model}}) (4-15)

    ```


    其中，pos 表示单词在输入序列中的位置，d_{model} 表示模型输出的维度，输入的词向量和位置向量的维度与之相等，一般取 512，维度 2i 表示偶数维度，2i+1
    表示奇数维度。


    这样一来，Transformer 的输入编码最终由输入序列中标记的词向量和位置向量求和得到。举例说明，假设输入序列为 x = (x_1, x_2, x_3,
    x_4)，序列对应的词向量为 w = (w_1, w_2, w_3, w_4)，位置向量为 p = (p_1, p_2, p_3, p_4)，那么输入序列在
    Transformer 中的输入编码为 e = (e_1, e_2, e_3, e_4)，其中 e_i = w_i + p_i，如图 4-7 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_122_0.png)


    图 4-7 Transformer 的输入编码


    # 4.2.3 Transformer 中的自注意力机制


    注意力机制可以被描述为给定一个查询（Query）和一组键（Key）值（Value）向量对，计算这个查询和键向量之间的权重系数，然后使用这个权重系数对值向量进行加权平均，得到最终输出向量的过程。'
  - '[PAGE 123]


    在 Transformer 中，提出了一种可缩放的点积注意力（Scaled Dot-Product Attention），也就是自注意力。该注意力机制的输入由查询向量
    Q、维度为 d_k 的键向量 K 和维度为 d_v 的值向量 V 构成。接下来，计算查询向量 Q 和键向量 K 的点积（矩阵相乘），并除以 \sqrt{d_k}
    进行缩放，之后在编码器中直接跳过掩码操作，而在解码器中需要进行掩码操作，最后使用 Softmax 函数来获得值向量 V 的权重系数，再与值向量 V 进行矩阵相乘得到最终结果。自注意力机制的总体计算流程如图
    4-8 所示。


