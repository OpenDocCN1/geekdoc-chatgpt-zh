    \ x 被生成器转换成输出数据 x_hat，并被判别器识别为正常数据，那么该输入就被认为是正常的。反之，如果一个输入数据 x 被转化成输出数据 x_hat，并被判别器识别为异常数据，则该输入数据被认为是异常的。\n\
