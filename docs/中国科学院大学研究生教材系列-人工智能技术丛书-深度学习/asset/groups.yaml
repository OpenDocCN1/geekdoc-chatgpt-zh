    同时，在 UNet 中含有跳跃连接（Skip Connection），在同一层进行了特征复制（Copy），保证最后恢复出来的特征图融合了更多的底层特征，也使得不同尺度（Scale）的特征得到了的融合，从而可以进行多尺度预测，4
