    W_k^l [V_c^{l-1}; v_g^{l-1}], W_v^l [V_c^{l-1}; v_g^{l-1}]))\) (4-64)

    \(V_c^l = \text{LayerNorm}(\hat{\tilde{V}}_c^l + \text{FeedForward}(\hat{\tilde{V}}_c^l))\)
    (4-65)

    \(v_g^l = \text{LayerNorm}(\hat{\tilde{v}}_g^l + \text{FeedForward}(\hat{\tilde{v}}_g^l))\)
    (4-66)


    其中，\(W_q^l, W_k^l, W_v^l \in \mathbb{R}^{D \times D}\) 为可学习参数，\(V_c^l\) 和 \(v_g^l\)
    分别表示第 \(l\) 层子模块的输出且 \(V_c^0 = V_c, v_g^0 = v_g\), \([V_c^{l-1}; v_g^{l-1}] \in
    \mathbb{R}^{(m+1) \times D}\) 表示网格特征与全局特征的堆叠操作，即在应用注意力机制时，PureT 同时使用了网格特征和全局特征而非单单独立进行处理。需要指出的是，网格特征和全局特征的增强过程所使用的参数是共享的。


    解码器（Decoder）同样由 \(N\) 层堆叠的子模块组成，旨在以特征增强编码器得到的增强全局特征 \(v_g^N\) 和网格特征 \(V_g^N\)
    作为输入逐词生成图像描述。此外，考虑到标准 Transformer 中多模态信息（视觉模态与语言模态）之间仅在交叉自注意力模块（Cross MSA Module）中进行交互，PureT
    提出了一个预融合模块（Pre-Fusion Module）用于将增强后的全局特征 \(v_g^N\) 融合到每个解码器子模块的输入中，增加多模态信息之间的交互。解码器中每个子模块由
    4 部分组成：预融合模块、语言掩码自注意力模块、交叉自注意力模块和单词生成模块。


    预融合模块实现视觉模态与语言模态间的第 1 次信息交互，表示如下：


    \(X_{l-1|l-1}^{p,l} = \text{LayerNorm}(X_{l-1|t-1}^{l} + \text{ReLU}(W_f [X_{l-1|t-1}^l;
    v_g^N]))\) (4-67)


    其中，\(W_f \in \mathbb{R}^{D \times 2D}\) 为线性层的可学习参数，\(X_{1|t-1}^{l-1} \in \mathbb{R}^{(t-1)
    \times D}\) 表示解码器第 \((l-1)\) 个子模块的输出，\([X_{l-1|t-1}^l; v_g^N] \in \mathbb{R}^{(t-1)
    \times 2D}\) 表示特征向量的拼接（Concatenation）操作，\(X_{1|t-1}^{p,l} \in \mathbb{R}^{(t-1)
    \times D}\) 作为后续语言掩码自注意力模块的输入。首个子模块的初始输入为已生成词汇 \(x_{1:t-1}\) 的嵌入向量：


    \(X_{1|t-1}^0 = W_e x_{1:t-1}\) (4-68)


    其中 \(W_e \in \mathbb{R}^{D \times \Sigma}\) 为词汇嵌入矩阵。


    语言掩码自注意力模块旨在对语言模态内（单词-单词）信息交互进行建模，表示如下：


    \(\widetilde{X}_{t-1}^l = \text{LayerNorm}(X_{t-1}^{m,l} + \text{MSA}(W_q^{m,l}X_{t-1}^{m,l},
    W_k^{m,l}X_{t-1}^{n(l-1)}, W_v^{m,l}X_{t-1}^{n(l-1)}))\) (4-69)


    其中，\(W_q^{m,l}, W_k^{m,l}, W_v^{m,l} \in \mathbb{R}^{d \times D}\) 为可学习参数，\(X_{t-1}^{p,l}\)
    为 \((t-1)\) 时间步产生单词的词嵌入向量。


    交叉自注意力模块旨在对\(\widetilde{X}_{t-1}^l\) 和 \(V_c^n\) 的模态间（单词-视觉特征）信息交互进行建模，即视觉模态与语言模态间的第
    2 次信息交互，表示如下：


    \(\hat{X}_{t-1}^l = \text{LayerNorm}(\widetilde{X}_{t-1}^l + \text{MSA}(W_q^{c,l}\widetilde{X}_{t-1}^l,
    W_k^{c,l}V_c^n, W_v^{c,l}V_c^n))\) (4-70)

    \(X_{t-1}^l = \text{LayerNorm}(\hat{X}_{t-1}^l + \text{FeedForward}(\hat{X}_{t-1}^l))\)
    (4-71)


    其中，\(W_q^{c,l}, W_k^{c,l}, W_v^{c,l} \in \mathbb{R}^{d \times D}\) 为可学习参数。


    单词生成模块旨在计算该时间步单词的概率分布，表示如下：


    \(p(x_t | x_{1:t-1}) = \text{Softmax}(W_s X_{t-1}^Y)\) (4-72)


    其中，\(W_s \in \mathbb{R}^{|\Sigma| \times d}\) 为可学习参数。


