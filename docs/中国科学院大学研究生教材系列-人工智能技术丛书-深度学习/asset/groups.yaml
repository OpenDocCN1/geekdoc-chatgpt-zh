    时的概率相等，即


    $P(X>s+x \mid X>x) = P(X>s)$


    # A. 3. 4 期望、方差和协方差


    期望（Expectation）：在概率论和统计学中，数学期望是试验中每次可能结果的概率乘以其结果的总和。它是最基本的数学特征之一，反映随机变量平均值的大小。


    假设 \( X \) 是一个离散随机变量，可能的取值为 \(\{x_k\}, k = 1, 2, \cdots, n\)，相对应的概率为 \(\{p(x_k)\},
    k = 1, 2, \cdots, n\)，则 \( X \) 的期望定义为


    $E(X) = \sum_{k=1}^n x_k p(x_k)$


    假设 \( X \) 是一个连续型随机变量，其概率密度函数为 \( f(x) \)，则 \( X \) 的期望定义为


    $E(X) = \int_{-\infty}^{\infty} x f(x) dx$


    方差（Variance）：概率论中，方差用来衡量随机变量与其数学期望之间的偏离程度；统计学中，方差则为样本方差，是各个样本数据分别与其平均值之差的平方和的期望。


    离散随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = E[(x - E(X))^2] = E(X^2) - [E(X)]^2$


    连续随机变量 \( X \) 的方差定义为


    $\text{Var}(X) = \int_{-\infty}^{\infty} [x - E(X)]^2 f(x) dx$


    协方差（Covariance）：在概率论和统计学中，协方差被用于衡量两个随机变量 \( X \) 和 \( Y \) 之间的总体误差，表示为


    $\text{Cov}(X, Y) = E[(X - E(X))[Y - E(Y)]] = E(XY) - E(X)E(Y)$


    离散随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \sum_i \sum_j [x_i - E(X)][y_j - E(Y)] p_{ij}$


    其中，\( P\{X=x_i, Y=y_i\} = p_{ij}, i, j = 1, 2, 3, \cdots \)。


    连续随机变量 \( X \) 和 \( Y \) 的协方差定义为


    $\text{Cov}(X, Y) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} [x - E(X)][y
    - E(Y)] f(x, y) dx dy$


    # A. 3. 5 条件概率


    条件概率：在很多情况下，人们感兴趣的是某个事件在给定其他事件发生时而发生的概率，这种概率称作条件概率。事件 \( Y \) 在事件 \( X \) 发生的条件下发生的概率，用
    \( P(Y \mid X) \) 表示：


    $P(Y \mid X) = \frac{P(Y, X)}{P(X)}, P(X) > 0$


    条件概率具有链式法则：


    $P(X_1, X_2, \cdots, X_n) = P(X_1 \mid X_2, \cdots, X_n) P(X_2 \mid X_3, X_4,
    \cdots, X_n) \cdots P(X_{n-1} \mid X_n) P(X_n) = P(X_n) \prod_{i=1}^{n-1} P(X_i
    \mid X_{i+1}, \cdots, X_n)$'
