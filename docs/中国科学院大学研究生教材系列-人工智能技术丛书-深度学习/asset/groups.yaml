    # 本章人物：David E. Rumelhart 教授


    David E. Rumelhart（1942~2011），斯坦福大学教授，认知心理学家，主要从事认知神经科学和人工智能领域的研究。1991 年当选为美国科学院院士，1996
    年获美国心理学会（American Psychological Association）颁发的杰出科学贡献奖。2000 年，为了纪念他的重要贡献，认知科学学会（Cognitive
    Science Society）以他的名字设立了一个重要的国际奖项——David E. Rumelhart 认知科学理论基础贡献奖。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_208_0.png)


    David E. Rumelhart 教授于 1967 年获斯坦福大学数学心理学博士学位，之后加入加州大学圣迭戈分校（University of California，San
    Diego）开展研究工作，一开始进行符号计算理论研究，20 世纪 70 年代中期转向神经网络研究。1987 年，重返斯坦福大学继续研究工作。20 世纪 90
    年代，不幸罹患一种神经性退行性疾病——Pick 病，1998 年退休，2011 年去世。


    David E. Rumelhart 教授在人工智能领域的主要贡献是与 Geoffrey Hinton 教授、Ronald Williams 一起提出了反向传播算法，应该说反向传播算法的提出一定程度上扭转了当时人工神经网络发展的颓势。此外，David
    E. Rumelhart 教授还最早提出了自编码器的思想，实现了图像数据的压缩和重构。'
