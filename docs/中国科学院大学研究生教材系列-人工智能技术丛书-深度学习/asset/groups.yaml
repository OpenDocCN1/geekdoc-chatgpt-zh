  - '[PAGE 1]


    深度学习是人工智能的重要分支，在多个应用领域取得了突破性成果。本书作为深度学习的入门教材，基本涵盖了深度学习的各个方面。全书共 8 章，第 1 章概要介绍了深度学习的基本概念、典型算法及应用；第
    2~5 章是本书的核心内容，详细介绍了卷积神经网络、循环神经网络、Transformer 和生成对抗网络的基本原理、典型算法以及主要应用；第 6 章介绍了一些典型的深度生成模型以及近期比较流行的扩散模型；第
    7 章介绍了深度学习中常用的正则化与优化方法；第 8 章介绍了 TensorFlow、PyTorch 和飞桨三个常用的深度学习框架。本书每章都附有复习题，中间各章还附有实验题，便于读者复习知识点和进行实践锻炼。此外，附录中还给出了一些数学基础知识和中英文术语对照。


    本书可作为高等院校计算机科学与技术、智能科学与技术、自动化、电子科学与技术等相关专业的研究生或本科生教材，也可作为深度学习研究人员与算法工程师的参考书。


