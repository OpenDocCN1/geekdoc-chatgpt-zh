    ### 6.4.1 Sigmoid 信念网络\n\n1990 年，Radford M. Neal 提出了 Sigmoid 信念网络[7]，它是一种生成式多层神经网络，一个典型的\
    \ Sigmoid 信念网络如图 6-5 所示。Sigmoid 信念网络可以表示为一个有向图，图中的每个随机变量用一个神经元表示，节点之间的有向依赖关系用有向的连接表示。图\
    \ 6-5 中的可见数据是 x，k 层的隐含因子是向量 h^k，最顶层 h^3 具有可因式分解的先验概率。在 Sigmoid 信念网络中，每一层中的神经元之间都是相互独立的，典型的神经元是二元随机变量。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_192_0.png)\n\n图 6-5 Sigmoid 信念网络（详见彩插）\n\
    \nSigmoid 信念网络中的条件分布不同于传统神经网络，计算方式是从上至下而不是从下至上的，这种基于条件分布的典型参数化分布公式为\n\n\\(P(h_i^k\
    \ = 1 | h^{(k+1)}) = \\text{sigmoid}(b_i^k + \\sum_j w_{ij}^{(k+1)} h_j^{(k+1)})\\\
    ) (6-16)\n\n其中，\\(h_i^k\\) 表示第 k 层中隐藏节点 i 的二元激活，\\(h^{(k+1)}\\) 是一个向量 \\((h_1^{k+1},\
    \ h_2^{k+1}, \\cdots)\\)，输入向量 \\(x = h^0\\)。Sigmoid 函数为 \\(\\text{sigmoid}(u)\
    \ = 1/(1+e^{-u})\\)，\\(b_i^k\\) 表示第 k 层节点 i 的偏置，\\(w_{ij}^k\\) 表示第 (k+1) 层节点 i\
    \ 与第 k 层节点 j 之间的权重，\\(h_j^{k+1}\\) 表示第 (k+1) 层节点 j 的变量值，\\(P(\\cdot)\\) 表示针对模型的概率分布，而不是针对训练样本的概率分布。最底层生成一个输入空间的向量\
    \ x，模型在训练数据上的概率越高，说明生成的向量与样本越相似，也说明模型能很好地表示这些训练数据。考虑到模型具有多层，生成模型分解为\n\n\\(P(x,\
    \ h^1, h^2, \\cdots, h^l) = P(h^l) \\prod_{k=1}^{l-1} P(h^k | h^{(k+1)}) P(x |\
    \ h^1)\\) (6-17)\n\n将 \\(P(x, h^1, h^2, \\cdots, h^l)\\) 进行边缘化即得到 \\(P(x)\\)，但是在实际中这种计算非常难处理。\n\
    \n如图 6-5 所示，Sigmoid 信念网络一般采用 Wake-Sleep 算法进行训练：\n- Wake 阶段。固定红色箭头所指方向的权重（如 \\\
    (r_{ij}\\)），自底向上生成样本，然后反向传播学习蓝色箭头所指方向的权重（如 \\(w_{ij}\\)）。\n- Sleep 阶段。固定蓝色箭头所指方向的权重（如\
    \ \\(w_{ij}\\)），自顶向下生成样本\n\n本，然后反向传播学习红色箭头所指方向的权重（如 \\(r_{ij}\\)）。\n- 反复迭代。最后找到满足条件的权重值。\n\
    \n### 6.4.2 深度信念网络\n\n深度信念网络（Deep Belief Network，DBN）[1] 与 Sigmoid 信念网络相似，但是最上面两层有些不同，DBN\
    \ 的结构如图 6-6 所示。图 6-6 所示为一个具有可见层 \\(x\\) 和隐藏层 \\(h^1\\)、\\(h^2\\) 和 \\(h^3\\) 的\
    \ DBN。图 6-5 中 Sigmoid 信念网络的最顶层为可因式分解的先验概率 \\(P(h^3)\\)，而图 6-6 中 DBN 中最上面两层是一个受限玻尔兹曼机\
    \ \\(P(h^2, h^3)\\)。RBM 是一个无向图模型，因此整个 DBN 模型是一个混合模型，包含 \\(l\\) 个隐藏层的 DBN 的联合概率为：\n\
    \n\\(P(x, h^1, \\cdots, h^l) = P(h^{l-1}, h^l) \\prod_{k=1}^{l-2} P(h^k | h^{k+1})\
    \ P(x | h^1)\\) (6-18)\n\n其中，最上面两层的联合分布 \\(P(h^{l-1}, h^l)\\) 为 RBM 的概率分布。\n\n\
    DBN 的训练主要分为预训练和参数调优两部分，预训练采用贪心逐层堆叠 RBM 的方式进行，而参数调优一般采用有监督学习算法。如图 6-7 所示是一个具有 \\\
    (l\\) 个隐藏层的 DBN，生成模型的路径用实线箭头上的 \\(P\\) 分布表示，用于生成样本，包括条件分布 \\(P(h^k | h^{k+1})\\\
    ) 和顶层联合分布 \\(P(h^{l-1}, h^l)\\)，而识别路径用虚线箭头上的 \\(Q\\) 分布表示，用于训练和推理。最上面两层 \\(h^{l-1}\\\
    ) 和 \\(h^l\\) 构成一个 RBM，下面各层构成一个有向图模型，即 Sigmoid 信念网络。\\(Q(h^{k+1} | h^k)\\) 用来估计\
