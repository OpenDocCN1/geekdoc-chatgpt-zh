    读理解中的几个应用。


    ## 1. 机器翻译 (BART 模型)


    传统的机器翻译模型使用的是基于循环神经网络的 Encoder-Decoder 结构，该结构在长序列的情况下存在梯度消失等问题，同时训练也比较慢。而 Transformer
    模型使用了自注意力机制和多头注意力机制，通过对序列进行多层非线性变换和自注意力聚合来建模输入序列和输出序列之间的关系，使得模型具有更好的表达能力和泛化能力，进而能够在较短时间内训练出高效且准确的机器翻译模型。Transformer
    在机器翻译中的应用也是基于 Encoder-Decoder 结构，其中 Encoder 将源语言句子编码为一个连续的向量表示，Decoder 根据这个向量表示生成目标语言。相比于传统的
    Encoder-Decoder 结构，Transformer 的优势在于能够在单次计算中同时处理整个句子，减少了不必要的信息丢失，提高了翻译质量，加速了训练和推理过程。


    BERT 通过对输入文本进行掩码预测的方式训练语言模型，但是它对每个掩码位置单词的预测是相对独立的，所以 BERT 更适合自然语言理解任务，而不适用于生成任务。GPT
    模型从左到右进行编码适用于生成任务，但是这种单向编码的方式不能实现输入序列的双向编码互动。2019 年，Mike Lewis 等人提出了 BART 模型[14]，该模型使用标准的基于
    Transformer 的神经机器翻译架构，训练了一个结合双向编码器和自回归解码器的模型，同时它也是一个去噪自编码器，适用于非常广泛的序列到序列模型的构建，如图
    4-25 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_140_0.png)


    图 4-25 BART 与 BERT、GPT 的比较


    BART 的预训练分为两个阶段：第 1 阶段是文本被任意的噪声函数损坏，第 2 阶段是学习序列到序列模型来重建原始文本。BART 这样的预训练方式有一个关键的优势是它有灵活的噪声，可以将任意的变换应用于原始文本。BART
    在面向文本生成任务微调时特别有效，在此基础上，BART 提出了一种新颖的机器翻译模型，其中 BART 模型堆叠在几个额外的 Transformer 层之上。


    不同于 GPT，BART 将激活函数修改为 GeLU。BART 的基本模型（Base Model）包含 6 层编码器和解码器，大模型（Large Model）包含
    12 层编码器和解码器。BART 通过破坏原始文档然后进行重建来训练，与现有针对特定噪声方案量身定制的去噪自编码器不同的是，BART 允许使用任何类型的文档破坏方式。具体地，BART
    提出了以下几种加入噪声的方式。


    - 1) 单词掩码（Token Masking）：选择随机单词并替换成 [MASK] 标记。

    - 2) 单词删除（Token Deletion）：从输入中随机删除单词。

    - 3) 文本填充（Text Infilling）：对一些文本跨度进行采样，跨度长度来自泊松分布，每个跨度被一个 [MASK] 标记取代。

    - 4) 句子排列（Sentence Permutation）：将输入序列按照完整的停止符划分成句子后，随机重排序。

    - 5) 文件旋转（Document Rotation）：一个标记被均匀地随机选择，从该标记开始的文件被旋转。


    图 4-26 展示了用于机器翻译的 BART 整体框架。BART 将编码器嵌入层替换为一个新的随机初始化编码器，它训练新的编码器将外来的词映射到 BART
    对噪声具有鲁棒性的输入中。新的编码器可以使用与原始 BART 独立的词汇表。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_141_0.png)


    接下来，使用两个步骤训练源编码器：1) 冻结大部分的 BART 参数，只更新随机初始化源编码器、BART 位置嵌入向量和 BART 编码器第 1 层自注意力机制的输入投影矩阵；2)
    使用少量迭代训练所有模型参数。


    实验证明 BART 在 WMT 罗马尼亚语到英语的基准测试中，比反向机器翻译系统提升了 1.1 BLEU 得分，极大地提高了机器翻译系统的性能。


    ## 2. 自动文本摘要（BERTSUM 模型）


    Yang Liu 等人提出了将 BERT 应用于文本摘要生成的方法，并且为抽取式和生成式模型提出了一个通用的模型框架 BERTSum[18]，如图 4-27
    所示。在 BERT 的基础上，BERTSum 提出了一个新颖的文档级别的编码器，用来获取文档中句子的语义表示。BERTSum 在文档级别编码器的基础上，在其顶层增加了句子级别的
    Transformer 层。同时，BERTSum 使用了一种新颖的微调方案，对编码器和解码器采用不同的优化器，以缓解二者之间的不平衡问题。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_142_0.png)


    ### a) 原始BERT


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_142_1.png)


    ### b) BERTSum


    图 4-27 原始 BERT 和 BERTSum 结构对比”（详见彩插）


    图 4-27 根据文献 [18] 重新绘制。


    BERTSum 的核心是新定义的编码器，原始 BERT 模型的输入是句子对，而 BERTSum 输入的是多个句子，在每个输入句子之前加入 [ CLS ] 标记用来标记独立的句子，同时使用段向量
    $E_A$ 标记奇数句子，$E_B$ 标记偶数句子。


    抽取式摘要模型的目的是为文档中的每个句子 $sent_i$ 预测一个标签 $y_i \in (0, 1)$，该标签用来标记摘要中是否应该包含该句子。在通过
    BERTSUM 模型后，向量 $t_i$ 是 BERTSUM 顶层第 $i$ 个 [ CLS ] 对应的向量，接着 BERTSUM 使用多个 Transformer
    层对句子之间进行信息交互，得到句子的最终向量表示。最后，句子的向量表示被输入 Sigmoid 分类器中，以预测该句子是否应该被包含在摘要内容中。为了训练抽取式摘要模型，使用贪心算法为每个文档获得目标摘要内容，在测试阶段，使用训练好的
    BERTSUM 模型对句子进行打分，并选择得分最高的三个句子作为摘要。


    在基于 BERT 的生成式模型中，使用编码器-解码器结构进行摘要的生成，编码器采用的是预训练好的 BERTSUM，而解码器则是一个 6 层的随机初始化的 Transformer。但是，编码器和解码器之间存在不平衡的问题，编码器已经训练过，而解码器需要从头开始训练，为了克服这个问题，设计了一个将编码器和解码器分开微调的机制。此外，还尝试首先在抽取式任务上微调，然后再在生成式任务上微调，以实现两个阶段的平衡问题。


    ## 3. 机器阅读理解（SG-Net）


    对于机器阅读理解来说，从冗长的段落中有效地建模语言知识并排除噪声对于提高其性能非常重要。传统的注意力模型在没有显示约束的条件下关注所有的单词，这导致了机器阅读理解模型对一些冗余单词过分关注，失去了关注的重点。SG-Net（Syntax-Guided
    Network）[19] 从这一问题出发，将句法规则合并到注意力机制中指导文本建模，以生成更好的语义向量表示。


    具体来说，SG-Net 将句法依赖引入自注意力网络（Self-Attention Network，SAN）中，提出语法引导的自注意力机制。SG-Net 就是由这个语法引导的自注意力机制和原始的
    Transformer 编码器中的自注意力机制通过对偶语义聚合而成，如图 4-28 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_143_0.png)


    SG-Net 专注两种类型的机器阅读理解任务，分别是基于片段选择的机器阅读理解任务和基于多项选择的机器阅读理解任务，二者分别可以被描述为<P, Q, A>和<P,
    Q, C, A>，其中，P 表示原文，Q 表示问题，A 表示答案，C 表示选项。对于基于片段选择的机器阅读理解任务，在 SQuAD 2.0 数据集上实现了
    SG-Net 模型，模型能够预测原文中的开始位置和结束位置，并提取原文 P 的片段作为答案 A，当问题无法被回答时返回空字符串。对于基于多项选择的机器阅读理解任务，在
    RACE 数据集上训练并测试了 SG-Net 模型，该数据集要求给定一个段落和问题，从一组候选答案中选择正确答案。SG-Net 采用 BERT 作为 Transformer
    编码器的具体实现，输入被送到 BERT 模型中，从而得到语义向量表示 H，然后将其传递到 SG-Net 中，得到语法增强的语义向量表示 $\widetilde{\mathbf{H}}$。接下来，对于基于片段选择的机器阅读理解任务，$\widetilde{\mathbf{H}}$
    被送入线性层并通过 Softmax 获得开始位置和结束位置的概率分布。对于基于多项选择的机器阅读理解，将 $\widetilde{\mathbf{H}}$
    送到分类器中，预测多项选择任务的标签。


    在包括 SQuAD 2.0 和 RACE 数据集在内的基准测试集上进行实验，证明了 SG-Net 能够提升机器阅读理解系统的性能。


    ## 4.6.2 计算机视觉领域


    Transformer 最初是为自然语言处理领域设计的，但是其强大的建模能力和优秀的性能使得它在计算机视觉领域也取得了出色的成绩。前面讲述了在计算机视觉领域应用广泛的
    Swin Transformer，这里介绍用于图像分类任务的 ViT[16] 以及用于目标检测任务的 DETR[20]。


    ### 1. 图像分类（ViT）


    在传统的卷积神经网络中，卷积层和池化层通常用于从图像中提取特征，然后通过全连接层进行分类。但是，CNN 在处理长序列数据时存在一些问题，比如当序列很长时，会导致梯度消失问题。此时，Transformer
    模型就可以充分发挥其优势，通过自注意力机制来捕捉序列中的相关性，缓解梯度消失问题。


    在图像分类任务中，可以将图像中的每个像素或者每个图块看作一个序列，然后使用 Transformer 模型进行图像分类。ViT 模型将图像分割成固定大小的图块（Patch），然后将每个图块展开成一个序列，接着通过
    Transformer 模型进行特征提取和分类。ViT 模型在 ImageNet 等图像分类任务中表现出了很好的效果。ViT 本着尽可能少修改的原则，将原始的
    Transformer 迁移到图像分类任务上，ViT 模型结构如图 4-29 所示。


    ViT 模型首先通过分块和降维操作对图片进行预处理，具体地，首先把 $\mathbf{x} \in \mathbb{R}^{h \times w \times
    c}$ 的图像变成一个 $\mathbf{x}_p \in \mathbb{R}^{N \times (P^2 \cdot C)}$ 的 2D 图块。它可以看作是一系列的展平的
    2D 图块序列，这个序列中一共有 $N = HW/P^2$ 个展平的 2D 图块，每个图块的维度是 $(P^2 \times C)$。在得到视觉图像的图块后，需要进一步对每个向量都做一个线性变换（即全连接层），压缩后的维度为
    $D$。


    ViT 没有采用原始 Transformer 的位置编码方式，而是直接设置为可学习的位置编码（Positional Encoding）。在进行图块嵌入（Patch
    Embedding）后，图像序列将进入 ViT 的 Encoder 进行前向传输，这个过程可以公式化为


    $z_0 = [x_{class}; x_p^1 E; x_p^2 E; \dots ; x_p^N E] + E_{pos}$

    $z_l'' = MSA(LN(z_{l-1})) + z_{l-1}, l=1, 2, \dots, L$

    $z_l = MLP(LN(z_l'')) + z_l'', l=1, 2, \dots, L$

    $y = LN(z_L^0)$


    公式 (4-31) 表示图块编码和位置编码过程，其中 **E** 是线性变换矩阵且 \( E \in \mathbb{R}^{(P^2 \times C)
    \times D} \), \( E_{pos} \in \mathbb{R}^{(N+1) \times D} \), \( x_{class} \) 为人为增加的一个可学习的分类向量。


    公式 (4-32) 表示 Transformer 编码器中的多头自注意力、残差连接与层归一化（Add & Norm）过程，重复 \( L \) 次。


    公式 (4-33) 表示 Transformer 编码器中前馈神经网络（Feed Forward Network）、残差连接与层归一化（Add & Norm）过程，重复
    \( L \) 次。


    公式 (4-34) 表示进行层归一化。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_145_0.png)


    图 4-29 ViT 模型结构图


    ### 2. 目标检测 (DETR)


    传统的目标检测模型，如 Fast R-CNN[21]、YOLO[22] 等，通常都是基于卷积神经网络构建的，它们使用卷积层从图像中提取特征，并使用后续层进行目标检测。但是，卷积神经网络在处理长序列数据时存在一些问题，比如当序列很长时，模型会变得很深，导致梯度消失问题。而
    Transformer 模型通过自注意力机制来捕捉序列中的相关性，缓解了梯度消失问题，并且可以在序列较长时保持较高的精度。


    在目标检测任务中，可以将图像中的每个像素或者图块看作一个序列，然后使用 Transformer 模型进行目标检测。例如，目标检测 Transformer（Detection
    Transformer，DETR）[20] 使用 Transformer 模型从整个图像中预测所有的目标边框和类别，而不是使用卷积神经网络提取特征再通过区域建议网络（Region
    Proposal Network，RPN）生成目标边框。DETR 模型在 COCO 数据集上取得了很好的效果，在目标检测任务的准确率和运行时间上与 Faster
    RCNN 相当。DETR 使用端到端（End-to-End）的方式实现目标检测，如图 4-30 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_146_0.png)


    图 4-30 结合 CNN 和 Transformer 的 DETR 结构


    DETR 模型的主要组成是 CNN 和 Transformer，Transformer 借助自注意力（Self-Attention）机制，可以显式地对一个序列中的所有元素两两之间的关系进行建模，使得这类
    Transformer 结构非常适合带约束的集合预测问题。


    DETR 分为 4 个部分：骨干网络、编码器、解码器和预测头。DETR 的结构如图 4-31 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_146_1.png)


    图 4-31 DETR 的结构


    首先，DETR 采用了 CNN 作为骨干网络（Backbone）来处理 \(x_{img} \in \mathbb{R}^{B \times 3 \times
    H_0 \times W_0}\) 的图像，将它转换为 \(f \in \mathbb{R}^{B \times C \times H \times W}\)
    的特征图。


    其次，得到图像特征 \(f \in \mathbb{R}^{B \times C \times H \times W}\) 后，DETR 使用 Transformer
    编码器对图像特征 \(f\) 进行编码与建模。


    然后，编码器使用了原始的多头自注意力机制来进行序列之间的关系建模，公式为


    \(\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V
    \quad (4-35)\)


    原始 Transformer 中的位置编码为


    \(\text{PE}_{(pos, 2i)} = \sin\left(\frac{pos}{10000^{2i/d}}\right) \quad (4-36)\)


    $$ \text{PE}_{(pos, 2i)} = \cos\left(\frac{pos}{10000^{2i/d}}\right) $$


    原始 Transformer 只考虑 \( x \) 方向的位置编码，但是 DETR 考虑了 \( x \)、\( y \) 两个方向的位置编码，因为图像特征是
    2D 特征。因此，DETR 中的位置编码为


    $$ \text{PE}_{(pos_x, 2i)} = \sin\left(\frac{pos_x}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_x, 2(i+1)} = \cos\left(\frac{pos_x}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_y, 2i)} = \sin\left(\frac{pos_y}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_y, 2(i+1)} = \cos\left(\frac{pos_y}{10000^{2i/d}}\right) $$


    此外，与原始 Transformer 不同，DETR 的位置编码向量需要加入每个编码器层中。在编码器内部位置编码仅仅作用于 Query 和 Key，即只与
    Query 和 Key 相加，Value 不做任何处理。


    DETR 的解码器主要有两个输入：一个是 Transformer 编码器的输出与位置编码之和；一个是目标查询（Object Query）。目标查询是一个维度为
    \( (100, b, 256) \) 的可学习张量，数值类型是 nn. Embedding，目标查询矩阵内部学习建模了 100 个物体之间的全局关系。解码器的输入一开始初始化为维度为
    \( (100, b, 256) \) 的全部元素都为 0 的张量，和目标查询加在一起后作为第 1 个多头自注意力的 Query 和 Key。第一个多头自注意力的
    Value 为解码器的输入，也就是全 0 的张量。到了每个解码器的第 2 个多头自注意力，它的 Key 和 Value 来自编码器的输出张量，维度为 \(
    (hw, b, 256) \)。DETR 的 Transformer 解码器一次性处理全部的目标查询（Object Query），即一次性输出全部的预测（Prediction），而不像原始的
    Transformer 从左到右逐词输出，如图 4-32 所示。


    DETR 最大特点是将目标检测问题转化为无序集合的预测问题。DETR 输出一组 \( N \) 个固定大小的预测，其中 \( N \) 比图像中的目标数量要大。DETR
    损失函数产生了预测对象和真值（Ground Truth）之间的最佳二分匹配，然后优化特定对象（边界框）的损失。用 \( y \) 来表示对象的真值（Ground
    Truth）集合，用 \( \hat{y} \) 来表示 \( N \) 个预测的集合，为了找到这两个集合之间的二分匹配，寻找代价最低的 \( n \) 个元素的排列
    \( \hat{\sigma} \in S_N \)，如下所示：


    $$ \hat{\sigma} = \text{argmin}_{\sigma} \sum_{i}^{N} L_{\text{match}}(y_i, \hat{y}_{\sigma(i)})
    $$


    其中，\( \sum_{i}^{N} L_{\text{match}}(y_i, \hat{y}_{\sigma(i)}) \) 表示的是某一个真值 \(
    y_i \) 和这个真值对应的预测值 \( \hat{y}_{\sigma(i)} \) 成对匹配的代价。其中匈牙利算法有效地计算了这种最优分配，如下所示：


    $$ L_{\text{match}}(y_i, \hat{y}_{\sigma(i)}) = -\mathbb{1}_{[c_i \neq \emptyset]}
    \hat{p}_{\sigma(i)}(c_i) + \mathbb{1}_{[c_i \neq \emptyset]} L_{\text{box}}(b_i,
    \hat{b}_{\sigma(i)}) $$


    $$ L_{\text{hungarian}}(y, \hat{y}) = \sum_{i=1}^{N} [-\log \hat{p}_{\sigma(i)}(c_i)
    + \mathbb{1}_{[c_i \neq \emptyset]} L_{\text{box}}(b_i, \hat{b}_{\sigma(i)})]
    $$


    其中从真值索引到预测值索引的所有映射为 \( \sigma \)，对于图片中的每个真值 \( i \)，\( \sigma(i) \) 为对应的预测值，预测值对应的分类网络的结果为
    \( \hat{p}_{\sigma(i)}(c_i) \)，回归网络的结果为 \( \hat{b}_{\sigma(i)} \)，真值边框为


    '
  mdcn: '


    读理解中的几个应用。


    ## 1. 机器翻译 (BART 模型)


    传统的机器翻译模型使用的是基于循环神经网络的 Encoder-Decoder 结构，该结构在长序列的情况下存在梯度消失等问题，同时训练也比较慢。而 Transformer
    模型使用了自注意力机制和多头注意力机制，通过对序列进行多层非线性变换和自注意力聚合来建模输入序列和输出序列之间的关系，使得模型具有更好的表达能力和泛化能力，进而能够在较短时间内训练出高效且准确的机器翻译模型。Transformer
    在机器翻译中的应用也是基于 Encoder-Decoder 结构，其中 Encoder 将源语言句子编码为一个连续的向量表示，Decoder 根据这个向量表示生成目标语言。相比于传统的
    Encoder-Decoder 结构，Transformer 的优势在于能够在单次计算中同时处理整个句子，减少了不必要的信息丢失，提高了翻译质量，加速了训练和推理过程。


    BERT 通过对输入文本进行掩码预测的方式训练语言模型，但是它对每个掩码位置单词的预测是相对独立的，所以 BERT 更适合自然语言理解任务，而不适用于生成任务。GPT
    模型从左到右进行编码适用于生成任务，但是这种单向编码的方式不能实现输入序列的双向编码互动。2019 年，Mike Lewis 等人提出了 BART 模型[14]，该模型使用标准的基于
    Transformer 的神经机器翻译架构，训练了一个结合双向编码器和自回归解码器的模型，同时它也是一个去噪自编码器，适用于非常广泛的序列到序列模型的构建，如图
    4-25 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_140_0.png)


    图 4-25 BART 与 BERT、GPT 的比较


    BART 的预训练分为两个阶段：第 1 阶段是文本被任意的噪声函数损坏，第 2 阶段是学习序列到序列模型来重建原始文本。BART 这样的预训练方式有一个关键的优势是它有灵活的噪声，可以将任意的变换应用于原始文本。BART
    在面向文本生成任务微调时特别有效，在此基础上，BART 提出了一种新颖的机器翻译模型，其中 BART 模型堆叠在几个额外的 Transformer 层之上。


    不同于 GPT，BART 将激活函数修改为 GeLU。BART 的基本模型（Base Model）包含 6 层编码器和解码器，大模型（Large Model）包含
    12 层编码器和解码器。BART 通过破坏原始文档然后进行重建来训练，与现有针对特定噪声方案量身定制的去噪自编码器不同的是，BART 允许使用任何类型的文档破坏方式。具体地，BART
    提出了以下几种加入噪声的方式。


    - 1) 单词掩码（Token Masking）：选择随机单词并替换成 [MASK] 标记。

    - 2) 单词删除（Token Deletion）：从输入中随机删除单词。

    - 3) 文本填充（Text Infilling）：对一些文本跨度进行采样，跨度长度来自泊松分布，每个跨度被一个 [MASK] 标记取代。

    - 4) 句子排列（Sentence Permutation）：将输入序列按照完整的停止符划分成句子后，随机重排序。

    - 5) 文件旋转（Document Rotation）：一个标记被均匀地随机选择，从该标记开始的文件被旋转。


    图 4-26 展示了用于机器翻译的 BART 整体框架。BART 将编码器嵌入层替换为一个新的随机初始化编码器，它训练新的编码器将外来的词映射到 BART
    对噪声具有鲁棒性的输入中。新的编码器可以使用与原始 BART 独立的词汇表。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_141_0.png)


    接下来，使用两个步骤训练源编码器：1) 冻结大部分的 BART 参数，只更新随机初始化源编码器、BART 位置嵌入向量和 BART 编码器第 1 层自注意力机制的输入投影矩阵；2)
    使用少量迭代训练所有模型参数。


    实验证明 BART 在 WMT 罗马尼亚语到英语的基准测试中，比反向机器翻译系统提升了 1.1 BLEU 得分，极大地提高了机器翻译系统的性能。


    ## 2. 自动文本摘要（BERTSUM 模型）


    Yang Liu 等人提出了将 BERT 应用于文本摘要生成的方法，并且为抽取式和生成式模型提出了一个通用的模型框架 BERTSum[18]，如图 4-27
    所示。在 BERT 的基础上，BERTSum 提出了一个新颖的文档级别的编码器，用来获取文档中句子的语义表示。BERTSum 在文档级别编码器的基础上，在其顶层增加了句子级别的
    Transformer 层。同时，BERTSum 使用了一种新颖的微调方案，对编码器和解码器采用不同的优化器，以缓解二者之间的不平衡问题。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_142_0.png)


    ### a) 原始BERT


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_142_1.png)


    ### b) BERTSum


    图 4-27 原始 BERT 和 BERTSum 结构对比”（详见彩插）


    图 4-27 根据文献 [18] 重新绘制。


    BERTSum 的核心是新定义的编码器，原始 BERT 模型的输入是句子对，而 BERTSum 输入的是多个句子，在每个输入句子之前加入 [ CLS ] 标记用来标记独立的句子，同时使用段向量
    $E_A$ 标记奇数句子，$E_B$ 标记偶数句子。


    抽取式摘要模型的目的是为文档中的每个句子 $sent_i$ 预测一个标签 $y_i \in (0, 1)$，该标签用来标记摘要中是否应该包含该句子。在通过
    BERTSUM 模型后，向量 $t_i$ 是 BERTSUM 顶层第 $i$ 个 [ CLS ] 对应的向量，接着 BERTSUM 使用多个 Transformer
    层对句子之间进行信息交互，得到句子的最终向量表示。最后，句子的向量表示被输入 Sigmoid 分类器中，以预测该句子是否应该被包含在摘要内容中。为了训练抽取式摘要模型，使用贪心算法为每个文档获得目标摘要内容，在测试阶段，使用训练好的
    BERTSUM 模型对句子进行打分，并选择得分最高的三个句子作为摘要。


    在基于 BERT 的生成式模型中，使用编码器-解码器结构进行摘要的生成，编码器采用的是预训练好的 BERTSUM，而解码器则是一个 6 层的随机初始化的 Transformer。但是，编码器和解码器之间存在不平衡的问题，编码器已经训练过，而解码器需要从头开始训练，为了克服这个问题，设计了一个将编码器和解码器分开微调的机制。此外，还尝试首先在抽取式任务上微调，然后再在生成式任务上微调，以实现两个阶段的平衡问题。


    ## 3. 机器阅读理解（SG-Net）


    对于机器阅读理解来说，从冗长的段落中有效地建模语言知识并排除噪声对于提高其性能非常重要。传统的注意力模型在没有显示约束的条件下关注所有的单词，这导致了机器阅读理解模型对一些冗余单词过分关注，失去了关注的重点。SG-Net（Syntax-Guided
    Network）[19] 从这一问题出发，将句法规则合并到注意力机制中指导文本建模，以生成更好的语义向量表示。


    具体来说，SG-Net 将句法依赖引入自注意力网络（Self-Attention Network，SAN）中，提出语法引导的自注意力机制。SG-Net 就是由这个语法引导的自注意力机制和原始的
    Transformer 编码器中的自注意力机制通过对偶语义聚合而成，如图 4-28 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_143_0.png)


    SG-Net 专注两种类型的机器阅读理解任务，分别是基于片段选择的机器阅读理解任务和基于多项选择的机器阅读理解任务，二者分别可以被描述为<P, Q, A>和<P,
    Q, C, A>，其中，P 表示原文，Q 表示问题，A 表示答案，C 表示选项。对于基于片段选择的机器阅读理解任务，在 SQuAD 2.0 数据集上实现了
    SG-Net 模型，模型能够预测原文中的开始位置和结束位置，并提取原文 P 的片段作为答案 A，当问题无法被回答时返回空字符串。对于基于多项选择的机器阅读理解任务，在
    RACE 数据集上训练并测试了 SG-Net 模型，该数据集要求给定一个段落和问题，从一组候选答案中选择正确答案。SG-Net 采用 BERT 作为 Transformer
    编码器的具体实现，输入被送到 BERT 模型中，从而得到语义向量表示 H，然后将其传递到 SG-Net 中，得到语法增强的语义向量表示 $\widetilde{\mathbf{H}}$。接下来，对于基于片段选择的机器阅读理解任务，$\widetilde{\mathbf{H}}$
    被送入线性层并通过 Softmax 获得开始位置和结束位置的概率分布。对于基于多项选择的机器阅读理解，将 $\widetilde{\mathbf{H}}$
    送到分类器中，预测多项选择任务的标签。


    在包括 SQuAD 2.0 和 RACE 数据集在内的基准测试集上进行实验，证明了 SG-Net 能够提升机器阅读理解系统的性能。


    ## 4.6.2 计算机视觉领域


    Transformer 最初是为自然语言处理领域设计的，但是其强大的建模能力和优秀的性能使得它在计算机视觉领域也取得了出色的成绩。前面讲述了在计算机视觉领域应用广泛的
    Swin Transformer，这里介绍用于图像分类任务的 ViT[16] 以及用于目标检测任务的 DETR[20]。


    ### 1. 图像分类（ViT）


    在传统的卷积神经网络中，卷积层和池化层通常用于从图像中提取特征，然后通过全连接层进行分类。但是，CNN 在处理长序列数据时存在一些问题，比如当序列很长时，会导致梯度消失问题。此时，Transformer
    模型就可以充分发挥其优势，通过自注意力机制来捕捉序列中的相关性，缓解梯度消失问题。


    在图像分类任务中，可以将图像中的每个像素或者每个图块看作一个序列，然后使用 Transformer 模型进行图像分类。ViT 模型将图像分割成固定大小的图块（Patch），然后将每个图块展开成一个序列，接着通过
    Transformer 模型进行特征提取和分类。ViT 模型在 ImageNet 等图像分类任务中表现出了很好的效果。ViT 本着尽可能少修改的原则，将原始的
    Transformer 迁移到图像分类任务上，ViT 模型结构如图 4-29 所示。


    ViT 模型首先通过分块和降维操作对图片进行预处理，具体地，首先把 $\mathbf{x} \in \mathbb{R}^{h \times w \times
    c}$ 的图像变成一个 $\mathbf{x}_p \in \mathbb{R}^{N \times (P^2 \cdot C)}$ 的 2D 图块。它可以看作是一系列的展平的
    2D 图块序列，这个序列中一共有 $N = HW/P^2$ 个展平的 2D 图块，每个图块的维度是 $(P^2 \times C)$。在得到视觉图像的图块后，需要进一步对每个向量都做一个线性变换（即全连接层），压缩后的维度为
    $D$。


    ViT 没有采用原始 Transformer 的位置编码方式，而是直接设置为可学习的位置编码（Positional Encoding）。在进行图块嵌入（Patch
    Embedding）后，图像序列将进入 ViT 的 Encoder 进行前向传输，这个过程可以公式化为


    $z_0 = [x_{class}; x_p^1 E; x_p^2 E; \dots ; x_p^N E] + E_{pos}$

    $z_l'' = MSA(LN(z_{l-1})) + z_{l-1}, l=1, 2, \dots, L$

    $z_l = MLP(LN(z_l'')) + z_l'', l=1, 2, \dots, L$

    $y = LN(z_L^0)$


    公式 (4-31) 表示图块编码和位置编码过程，其中 **E** 是线性变换矩阵且 \( E \in \mathbb{R}^{(P^2 \times C)
    \times D} \), \( E_{pos} \in \mathbb{R}^{(N+1) \times D} \), \( x_{class} \) 为人为增加的一个可学习的分类向量。


    公式 (4-32) 表示 Transformer 编码器中的多头自注意力、残差连接与层归一化（Add & Norm）过程，重复 \( L \) 次。


    公式 (4-33) 表示 Transformer 编码器中前馈神经网络（Feed Forward Network）、残差连接与层归一化（Add & Norm）过程，重复
    \( L \) 次。


    公式 (4-34) 表示进行层归一化。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_145_0.png)


    图 4-29 ViT 模型结构图


    ### 2. 目标检测 (DETR)


    传统的目标检测模型，如 Fast R-CNN[21]、YOLO[22] 等，通常都是基于卷积神经网络构建的，它们使用卷积层从图像中提取特征，并使用后续层进行目标检测。但是，卷积神经网络在处理长序列数据时存在一些问题，比如当序列很长时，模型会变得很深，导致梯度消失问题。而
    Transformer 模型通过自注意力机制来捕捉序列中的相关性，缓解了梯度消失问题，并且可以在序列较长时保持较高的精度。


    在目标检测任务中，可以将图像中的每个像素或者图块看作一个序列，然后使用 Transformer 模型进行目标检测。例如，目标检测 Transformer（Detection
    Transformer，DETR）[20] 使用 Transformer 模型从整个图像中预测所有的目标边框和类别，而不是使用卷积神经网络提取特征再通过区域建议网络（Region
    Proposal Network，RPN）生成目标边框。DETR 模型在 COCO 数据集上取得了很好的效果，在目标检测任务的准确率和运行时间上与 Faster
    RCNN 相当。DETR 使用端到端（End-to-End）的方式实现目标检测，如图 4-30 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_146_0.png)


    图 4-30 结合 CNN 和 Transformer 的 DETR 结构


    DETR 模型的主要组成是 CNN 和 Transformer，Transformer 借助自注意力（Self-Attention）机制，可以显式地对一个序列中的所有元素两两之间的关系进行建模，使得这类
    Transformer 结构非常适合带约束的集合预测问题。


    DETR 分为 4 个部分：骨干网络、编码器、解码器和预测头。DETR 的结构如图 4-31 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_146_1.png)


    图 4-31 DETR 的结构


    首先，DETR 采用了 CNN 作为骨干网络（Backbone）来处理 \(x_{img} \in \mathbb{R}^{B \times 3 \times
    H_0 \times W_0}\) 的图像，将它转换为 \(f \in \mathbb{R}^{B \times C \times H \times W}\)
    的特征图。


    其次，得到图像特征 \(f \in \mathbb{R}^{B \times C \times H \times W}\) 后，DETR 使用 Transformer
    编码器对图像特征 \(f\) 进行编码与建模。


    然后，编码器使用了原始的多头自注意力机制来进行序列之间的关系建模，公式为


    \(\text{Attention}(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V
    \quad (4-35)\)


    原始 Transformer 中的位置编码为


    \(\text{PE}_{(pos, 2i)} = \sin\left(\frac{pos}{10000^{2i/d}}\right) \quad (4-36)\)


    $$ \text{PE}_{(pos, 2i)} = \cos\left(\frac{pos}{10000^{2i/d}}\right) $$


    原始 Transformer 只考虑 \( x \) 方向的位置编码，但是 DETR 考虑了 \( x \)、\( y \) 两个方向的位置编码，因为图像特征是
    2D 特征。因此，DETR 中的位置编码为


    $$ \text{PE}_{(pos_x, 2i)} = \sin\left(\frac{pos_x}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_x, 2(i+1)} = \cos\left(\frac{pos_x}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_y, 2i)} = \sin\left(\frac{pos_y}{10000^{2i/d}}\right) $$


    $$ \text{PE}_{(pos_y, 2(i+1)} = \cos\left(\frac{pos_y}{10000^{2i/d}}\right) $$


    此外，与原始 Transformer 不同，DETR 的位置编码向量需要加入每个编码器层中。在编码器内部位置编码仅仅作用于 Query 和 Key，即只与
    Query 和 Key 相加，Value 不做任何处理。


    DETR 的解码器主要有两个输入：一个是 Transformer 编码器的输出与位置编码之和；一个是目标查询（Object Query）。目标查询是一个维度为
    \( (100, b, 256) \) 的可学习张量，数值类型是 nn. Embedding，目标查询矩阵内部学习建模了 100 个物体之间的全局关系。解码器的输入一开始初始化为维度为
    \( (100, b, 256) \) 的全部元素都为 0 的张量，和目标查询加在一起后作为第 1 个多头自注意力的 Query 和 Key。第一个多头自注意力的
    Value 为解码器的输入，也就是全 0 的张量。到了每个解码器的第 2 个多头自注意力，它的 Key 和 Value 来自编码器的输出张量，维度为 \(
    (hw, b, 256) \)。DETR 的 Transformer 解码器一次性处理全部的目标查询（Object Query），即一次性输出全部的预测（Prediction），而不像原始的
    Transformer 从左到右逐词输出，如图 4-32 所示。


    DETR 最大特点是将目标检测问题转化为无序集合的预测问题。DETR 输出一组 \( N \) 个固定大小的预测，其中 \( N \) 比图像中的目标数量要大。DETR
    损失函数产生了预测对象和真值（Ground Truth）之间的最佳二分匹配，然后优化特定对象（边界框）的损失。用 \( y \) 来表示对象的真值（Ground
    Truth）集合，用 \( \hat{y} \) 来表示 \( N \) 个预测的集合，为了找到这两个集合之间的二分匹配，寻找代价最低的 \( n \) 个元素的排列
    \( \hat{\sigma} \in S_N \)，如下所示：


    $$ \hat{\sigma} = \text{argmin}_{\sigma} \sum_{i}^{N} L_{\text{match}}(y_i, \hat{y}_{\sigma(i)})
    $$


    其中，\( \sum_{i}^{N} L_{\text{match}}(y_i, \hat{y}_{\sigma(i)}) \) 表示的是某一个真值 \(
    y_i \) 和这个真值对应的预测值 \( \hat{y}_{\sigma(i)} \) 成对匹配的代价。其中匈牙利算法有效地计算了这种最优分配，如下所示：


    $$ L_{\text{match}}(y_i, \hat{y}_{\sigma(i)}) = -\mathbb{1}_{[c_i \neq \emptyset]}
    \hat{p}_{\sigma(i)}(c_i) + \mathbb{1}_{[c_i \neq \emptyset]} L_{\text{box}}(b_i,
    \hat{b}_{\sigma(i)}) $$


    $$ L_{\text{hungarian}}(y, \hat{y}) = \sum_{i=1}^{N} [-\log \hat{p}_{\sigma(i)}(c_i)
    + \mathbb{1}_{[c_i \neq \emptyset]} L_{\text{box}}(b_i, \hat{b}_{\sigma(i)})]
    $$


    其中从真值索引到预测值索引的所有映射为 \( \sigma \)，对于图片中的每个真值 \( i \)，\( \sigma(i) \) 为对应的预测值，预测值对应的分类网络的结果为
    \( \hat{p}_{\sigma(i)}(c_i) \)，回归网络的结果为 \( \hat{b}_{\sigma(i)} \)，真值边框为


