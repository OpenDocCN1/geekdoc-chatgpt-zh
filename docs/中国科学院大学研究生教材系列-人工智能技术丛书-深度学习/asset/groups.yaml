    ## 4.6.3 多模态领域


    $b_i$，式中的 $L_{box}$ 表示为


    $$L_{box}(b_i, \hat{b}_{\sigma(i)}) = \lambda_{iou} L_{iou}(b_i, \hat{b}_{\sigma(i)})
    + \lambda_{L1} \| b_i - \hat{b}_{\sigma(i)} \|_1$$ （4-45）


    其中 $L_{box}$ 表示预测边框与真值边框的重合度损失函数，$\| b_i, \hat{b}_{\sigma(i)} \|$ 表示预测边框与真值边框的广义距离，$\lambda_{iou}$
    和 $\lambda_{L1}$ 是超参数。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_148_0.png)


    图 4-32 DETR 模型的结构


    图 4-32 根据文献 [20] 重新绘制。


    Transformer 在多模态领域，如图像描述（Image Captioning）、视觉问答（Visual Question Answering）和文本生成图像（Text-to-Image
    Generation）等任务中都有很多应用，这里主要介绍 Transformer 在图像描述任务中的应用。


    基于深度学习的图像描述方法大多采用“编码器-解码器”（Encoder-Decoder）结构，其中编码器用于提取给定图像的视觉特征，而解码器用于将视觉特征解码为文本描述。早期的方法常采用卷积神经网络（如
    VGG-16、ResNet 等）作为编码器，循环神经网络（如 GRU、LSTM 等）作为解码器，之后目标检测网络（如 Faster R-CNN）被引入作为编码器提取图像区域级特征而非网格特征，这些方法均可归类于
    CNN-RNN 类方法。


    Transformer 模型的提出在自然语言处理领域相关任务上取得重大突破，随后又被成功拓展到计算机视觉领域任务上。Transformer 模型的成功也促使了研究人员探索其在图像描述任务上的应用，进而出现了
    CNN-Transformer 类方法与 Transformer-Transformer 类方法。


    ### 1. CNN-Transformer 类方法


    Transformer 的提出最初是作为语言模型应用于自然语言处理领域任务，针对图像描述任务，一个很直观的改进思路则是将 CNN-RNN 中的解码器由 RNN
    替换为 Transformer，将此类方法称为 CNN-Transformer 类方法，X-Transformer[23]、M2Transformer[24]、RSTNet[25]
    和 DLCT[26] 等工作均属于此类方法，这里以 M2Transformer 为例进行介绍。


    M2Transformer 的整体框架由三部分组成：骨干编码器（Backbone Encoder）、记忆增强编码器（Memory-Augmented Encoder）和网格解码器（Meshed
    Decoder）。如图 4-33 所示，其中骨干编码器采用 Faster R-CNN 提取图像的区域特征，记忆增强编码器和网格解码器均采用 Transformer
    结构，记忆增强编码器可视为骨干编码器的扩展结构，旨在对图像区域特征进行语义增强，网格解码器则用于生成文本描述。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_149_0.png)


    [图 4-33 M2Transformer 的总体框架]


    给定 RGB 图像 \( I \)，M2Transformer 模型的前向流程可以表示如下：


    ```

    \( X = \text{BackboneEncoder}(I) \) (4-46)

    \( \widetilde{X}_1, \widetilde{X}_2, \cdots, \widetilde{X}_n = \text{Memory-AugmentedEncoder}(X)
    \) (4-47)

    \( \widetilde{Y} = \text{MeshedDecoder}(\widetilde{X}_1, \widetilde{X}_2, \cdots,
    \widetilde{X}_n) \) (4-48)

    ```


    在 M2Transformer 中，记忆增强编码器和网格解码器均采用了 Transformer 结构，其核心为多头自注意力层，计算公式如下：


    Attention(Q, K, V) = softmax\left(\frac{QK^T}{\sqrt{d_k}}\right) V \quad (4-49)

    MSA(Q, K, V) = Concat(head_1, \cdots, head_h) \quad (4-50)

    head_i = Attention(Q^i, K^i, V^i), \quad i = 1, 2, \cdots, h \quad (4-51)


    M2Transformer 采用了目标检测模型 Faster R-CNN 提取图像的区域特征 $X = \{x_1, \cdots, x_{n_x}\},
    x_i \in \mathbb{R}^D$。得到图像的区域特征 $X \in \mathbb{R}^{n \times d}$ 后，应用多头自注意力可以实现对图像区域特征
    $X$ 内部成对关系的编码与建模，从而实现对特征进行语义增强的作用，计算公式如下：


    $X'' = \text{MSA}(W_q X, W_k X, W_v X) \quad (4-52)$


    其中，$W_q, W_k, W_v \in \mathbb{R}^{d \times D}$ 为可学习参数，输出 $\widetilde{X}$ 与输入 $X$
    大小一致。


    但是 M2Transformer 认为如上这种自注意力仅仅依赖于特征内部成对之间的相似性，而无法对图像区域之间的先验知识关系进行建模以获取更高维的语义信息。例如，给定图像的两个区域特征，一个区域包含一个人，另一个区域包含一个篮球，在没有任何先验知识的情况下，模型很难推断出“球员”或者“比赛”这些更为抽象的信息。基于以上考虑，M2Transformer
    在自注意力原有 $K$ 和 $V$ 的基础上，引入了额外的“记忆槽”（Memory Slot）用于对先验信息进行编码，并且为了强调先验信息是独立于输入 $X$
    的，“记忆槽”被建模为可训练的参数矩阵。相应输入与输出的计算公式如下：


    $X'' = \text{LayerNorm}(\text{MSA}(W_q X, K, V) + X) \quad (4-53)$

    $K = [W_k X, M_k], \quad V = [W_v X, M_v] \quad (4-54)$

    $\widetilde{X} = \text{LayerNorm}(\text{FeedForward}(X'') + X'') \quad (4-55)$


    其中，$M_k, M_v \in \mathbb{R}^{n \times m \times d}$ 为可学习的“记忆槽”参数，FeedForward 层由带有
    ReLU 激活函数的两个线性层组成，可表示如下：


    $\text{FeedForward}(x) = W_2 \text{ReLU}(W_1 x) \quad (4-56)$


    其中，$W_1 \in \mathbb{R}^{(4D) \times D}$ 和 $W_2 \in \mathbb{R}^{D \times (4D)}$
    为两个线性层的可学习参数矩阵。


    记忆增强编码器由多个上述编码层结构按顺序堆叠组成，第 $i$ 层的输出作为第 $(i+1)$ 层的输入，相当于创建了图像区域之间关系的多级编码，因此 $N$
    个编码层的堆叠将产生 $N$ 个输出 $\{\widetilde{X}_1, \widetilde{X}_2, \cdots, \widetilde{X}_N\}$
    作为图像的多级区域特征。记忆增强编码器的细节结构如图 4-34 所示。


    网格解码器的细节结构如图 4-35 所示，该模块使用已生成的单词以及记忆增强编码器输出的多级区域特征作为输入，表示如下：


    $Y'' = \text{LayerNorm}(\text{MSA}(W_q Y, W_k Y, W_v Y) + Y) \quad (4-57)$

    $Y'''' = \sum_i \alpha_i \odot \text{LayerNorm}(\text{MSA}(W_q Y, W_k \widetilde{X}_i,
    W_v \widetilde{X}_i) + Y) \quad (4-58)$

    $\widetilde{Y} = \text{LayerNorm}(\text{FeedForward}(Y'''') + Y'''') \quad (4-59)$


    其中，$W_q, W_k, W_v^i \in \mathbb{R}^{d \times D}$ 为掩码自注意力（Masked Self-Attention）层中可学习参数，$W_q,
    W_k, W_v \in \mathbb{R}^{d \times D}$ 为跨模态注意力（Cross Attention）层中可学习参数，$\odot$
    表示逐元素相乘操作（Element-Wise Product）。


    记忆增强编码器 ( Memory-Augmented Encoder )


    图 4-34 记忆增强编码器的细节结构


    网格解码器 ( Meshed Decoder )


    图 4-35 网格解码器的细节结构


    从上述公式可看出，与原始 Transformer 解码器的不同之处在于跨模态注意力层，网格解码器同时利用了图像的多级区域特征，构成与记忆增强编码器各层输出之间的网状连接，并进行了门控加权，门控权重
    \(\alpha_i\) 的计算公式如下：


    \(\alpha_i = \sigma(W_i [Y_i, \text{LayerNorm}(\text{MSA}(W_q Y_i, W_k \bar{X}_i,
    W_v \bar{X}_i) + Y)] + b_i)\) (4-60)


    其中，\(W_i \in \mathbb{R}^{D \times 2D}\) 为可学习参数，\(\sigma(\cdot)\) 为 Sigmoid 激活函数。


    ### 2. Transformer-Transformer 类方法


    CNN-RNN 类方法和 CNN-Transformer 类方法大多采用 Faster R-CNN 提取图像区域级特征，但是 Faster R-CNN 需要在额外数据集上进行预训练，导致图像描述被分割为两个独立的子任务从而无法进行端到端的训练，限制了图像描述任务的潜在应用。针对此问题，研究人员开始探索完全基于
    Transformer 结构的图像描述模型，此类方法可总结为 Transformer-Transformer 类方法，PureT[27]、PTSN[28]、ViTCAP[29]
    等模型均属于此类方法。这里以 PureT 模型为例展开介绍，该模型不依赖于 Faster R-CNN 目标检测模型而完全基于 Transformer 结构，因此能够进行端到端的训练和推理，实现了将图像描述任务从两阶段任务集成到了一阶段，模型整体结构如图
    4-36 所示。PureT 模型包含三个部分：1) 骨干编码器（Backbone Encoder），用于从输入图像中提取网格级特征；2) 增强编码器（Refining
    Encoder），用于捕获图像网格特征的模态内关系以增强特征的表征能力，可视为图像基础编码器的扩展；3) 解码器（Decoder），用于将增强网格特征解码为描述语句。此外还设计了一个预融合模块（Pre-Fusion），用于增加视觉模态信息与文本模态信息之间的交互。


    PureT 中使用了原始的多头自注意力机制及其变体窗口自注意力机制（Window MSA，W-MSA）与移位窗口自注意力机制（Shifted Window
    MSA，SW-MSA）。针对 MSA 全局计算导致的平方计算复杂度，Swin Transformer 提出了 W-MSA 和 SW-MSA，首先将 \(Q\)、\(K\)、\(V\)
    划分为多个窗口，然后在每个小窗口内分别应用 MSA。W-MSA 与 SW-MSA 的区别在于窗口划分的策略不同，如图 4-37 所示。在 W-MSA 后添加
    SW-MSA 旨在解决 W-MSA 模块缺乏跨窗口之间信息交互的问题，以进一步提高建模能力。表示如下：


    \((S) \text{W-MSA}(Q, K, V) = \text{Merge}(\text{window}_1, \cdots, \text{window}_w)\)
    (4-61)


    \(\text{window}_i = \text{MSA}(Q^i_w, K^i_w, V^i_w), \quad i = 1, 2, \cdots, w\)
    (4-62)


    PureT 使用 Swin Transformer 作为骨干编码器（Backbone Encoder）从输入图像中提取 \(m=12 \times 12\)
    个网格特征集合 \(V_c = \{v_1, v_2, \cdots, v_m\}, v_i \in \mathbb{R}^D\)，并计算其均值池化 \(v_g
    = (\sum_{i=1}^m v_i)/m\) 作为初始全局特征，因为 Swin Transformer 同为基于 Transformer 的模型，可以很方便地与后续增强编码器（Refining
    Encoder）和解码器联合进行端到端训练。


    增强编码器由 \(N\) 层相同的子模块堆叠组成，每个子模块与 Transformer 模型中的自注意力模块相似，但注意力机制的实现根据所处理的特征情况存在不同，MSA
    用于图像全局特征，SW-MSA 和 W-MSA 则交替用于图像网格特征，表示如下：


    \(\tilde{V}^l_c = \text{LayerNorm}(V^{l-1}_c + (S) \text{W-MSA}(W^l_q V^{l-1}_c,
    W^l_k [V^{l-1}_c; v^{l-1}_g], W^l_v [V^{l-1}_c; v^{l-1}_g]))\) (4-63)


    | 组件 | 尺寸 | 说明 |

    | --- | --- | --- |

    | 图像 | 384 × 384 × 3 | |

    | Swin Transformer | 12 × 12 × 1536 | |

    | 线性层 | 12 × 12 × 512 | 网格特征 |

    | 均值池化 | 1 × 512 | 全局特征 |


    增强编码器 (Refining Encoder)


    解码器 (Decoder)


    预融合模块 (Pre-Fusion)


    图 4-36 PureT 的总体框架 (详见彩插)


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_154_0.png)


    a) W-MSA窗口划分策略


    b) SW-MSA窗口划分策略


    图 4-37 PureT 的窗口划分策略[27]


    \(\tilde{v}_g^l = \text{LayerNorm}(\tilde{v}_g^{l-1} + \text{MSA}(W_q^l v_g^{l-1},
    W_k^l [V_c^{l-1}; v_g^{l-1}], W_v^l [V_c^{l-1}; v_g^{l-1}]))\) (4-64)

    \(V_c^l = \text{LayerNorm}(\hat{\tilde{V}}_c^l + \text{FeedForward}(\hat{\tilde{V}}_c^l))\)
    (4-65)

    \(v_g^l = \text{LayerNorm}(\hat{\tilde{v}}_g^l + \text{FeedForward}(\hat{\tilde{v}}_g^l))\)
    (4-66)


    其中，\(W_q^l, W_k^l, W_v^l \in \mathbb{R}^{D \times D}\) 为可学习参数，\(V_c^l\) 和 \(v_g^l\)
    分别表示第 \(l\) 层子模块的输出且 \(V_c^0 = V_c, v_g^0 = v_g\), \([V_c^{l-1}; v_g^{l-1}] \in
    \mathbb{R}^{(m+1) \times D}\) 表示网格特征与全局特征的堆叠操作，即在应用注意力机制时，PureT 同时使用了网格特征和全局特征而非单单独立进行处理。需要指出的是，网格特征和全局特征的增强过程所使用的参数是共享的。


    解码器（Decoder）同样由 \(N\) 层堆叠的子模块组成，旨在以特征增强编码器得到的增强全局特征 \(v_g^N\) 和网格特征 \(V_g^N\)
    作为输入逐词生成图像描述。此外，考虑到标准 Transformer 中多模态信息（视觉模态与语言模态）之间仅在交叉自注意力模块（Cross MSA Module）中进行交互，PureT
    提出了一个预融合模块（Pre-Fusion Module）用于将增强后的全局特征 \(v_g^N\) 融合到每个解码器子模块的输入中，增加多模态信息之间的交互。解码器中每个子模块由
    4 部分组成：预融合模块、语言掩码自注意力模块、交叉自注意力模块和单词生成模块。


    预融合模块实现视觉模态与语言模态间的第 1 次信息交互，表示如下：


    \(X_{l-1|l-1}^{p,l} = \text{LayerNorm}(X_{l-1|t-1}^{l} + \text{ReLU}(W_f [X_{l-1|t-1}^l;
    v_g^N]))\) (4-67)


    其中，\(W_f \in \mathbb{R}^{D \times 2D}\) 为线性层的可学习参数，\(X_{1|t-1}^{l-1} \in \mathbb{R}^{(t-1)
    \times D}\) 表示解码器第 \((l-1)\) 个子模块的输出，\([X_{l-1|t-1}^l; v_g^N] \in \mathbb{R}^{(t-1)
    \times 2D}\) 表示特征向量的拼接（Concatenation）操作，\(X_{1|t-1}^{p,l} \in \mathbb{R}^{(t-1)
    \times D}\) 作为后续语言掩码自注意力模块的输入。首个子模块的初始输入为已生成词汇 \(x_{1:t-1}\) 的嵌入向量：


    \(X_{1|t-1}^0 = W_e x_{1:t-1}\) (4-68)


    其中 \(W_e \in \mathbb{R}^{D \times \Sigma}\) 为词汇嵌入矩阵。


    语言掩码自注意力模块旨在对语言模态内（单词-单词）信息交互进行建模，表示如下：


    \(\widetilde{X}_{t-1}^l = \text{LayerNorm}(X_{t-1}^{m,l} + \text{MSA}(W_q^{m,l}X_{t-1}^{m,l},
    W_k^{m,l}X_{t-1}^{n(l-1)}, W_v^{m,l}X_{t-1}^{n(l-1)}))\) (4-69)


    其中，\(W_q^{m,l}, W_k^{m,l}, W_v^{m,l} \in \mathbb{R}^{d \times D}\) 为可学习参数，\(X_{t-1}^{p,l}\)
    为 \((t-1)\) 时间步产生单词的词嵌入向量。


    交叉自注意力模块旨在对\(\widetilde{X}_{t-1}^l\) 和 \(V_c^n\) 的模态间（单词-视觉特征）信息交互进行建模，即视觉模态与语言模态间的第
    2 次信息交互，表示如下：


    \(\hat{X}_{t-1}^l = \text{LayerNorm}(\widetilde{X}_{t-1}^l + \text{MSA}(W_q^{c,l}\widetilde{X}_{t-1}^l,
    W_k^{c,l}V_c^n, W_v^{c,l}V_c^n))\) (4-70)

    \(X_{t-1}^l = \text{LayerNorm}(\hat{X}_{t-1}^l + \text{FeedForward}(\hat{X}_{t-1}^l))\)
    (4-71)


    其中，\(W_q^{c,l}, W_k^{c,l}, W_v^{c,l} \in \mathbb{R}^{d \times D}\) 为可学习参数。


    单词生成模块旨在计算该时间步单词的概率分布，表示如下：


    \(p(x_t | x_{1:t-1}) = \text{Softmax}(W_s X_{t-1}^Y)\) (4-72)


    其中，\(W_s \in \mathbb{R}^{|\Sigma| \times d}\) 为可学习参数。


