    $\hat{c}$ 和阶段 I 的 GAN 中使用的 $\hat{c}_0$ 共享相同的预先训练好的文本编码器生成的文本嵌入 $\varphi_t$。但是，它们利用不同的全连接层来产生不同的均值和标准差。


    # 5. 2. 3 结构优化


