    \ G(z) 训练判别器，即输入生成器生成的数据 G(z) 到判别器，前向传播，得到输出为 0（表示判断结果为假），之后使用反向传播算法再次更新判别器的参数；3）使用生成器生成的数据\
    \ G(z) 训练生成器，即输入生成器生成的数据 G(z) 到判别器，采用上一步训练好的判别器的参数（冻结判别器的参数）前向传播，得到输出为 1（表示判断结果为真），之后使用反向传播算法更新生成器的参数，这一步的目的在于训练更好的生成器，以迷惑判别器，使之将生成器生成的数据判别为真。在这个过程中，双方都极力优化自己的网络，从而形成竞争对抗，直到双方达到一个动态的平衡。此时，生成器生成的数据分布无限接近真实数据的分布，判别器判别不出输入的是真实数据还是生成的数据，输出概率都是\
    \ 50%。\n\n在训练生成对抗网络的过程中使用随机梯度上升或下降的方法，判别器的训练步数 k 是一个超参数，文献 [1] 在实验中使用了 k=1 的设置，这是成本最低的选择，同时训练中的随机梯度方法可以使用一般的随机梯度方法，也可以使用优化的随机梯度方法，文献\
    \ [1] 中使用了基于动量（Momentum）的方法（基于动量的方法可查阅 7.8.2 节）。GAN 训练算法的伪代码如下所示：\n\n```\nfor\
    \ 训练迭代轮数 do\nfor k 步 do\n    • 在噪声先验分布为 $p_z(z)$ 的情况下采样大小为 $m$ 的小批量噪声样本 $\\{z^{(1)},\
    \ \\cdots, z^{(m)}\\}$\n    • 在样本生成分布为 $p_{data}(x)$ 的情况下采样大小为 $m$ 的小批量样本 $\\\
    {x^{(1)}, \\cdots, x^{(m)}\\}$\n    • 通过随机梯度上升法更新判别器：\n    $\\nabla_{\\theta_d}\
    \ \\frac{1}{m} \\sum_{i=1}^m [\\log D(x^{(i)}) + \\log (1 - D(G(z^{(i)})))]$\n\
    end for\n• 在噪声先验分布为 $p_z(z)$ 的情况下采样大小为 $m$ 的小批量噪声样本 $\\{z^{(1)}, \\cdots, z^{(m)}\\\
    }$\n• 通过随机梯度下降法更新生成器：\n$\\nabla_{\\theta_g} \\frac{1}{m} \\sum_{i=1}^m \\log (1\
    \ - D(G(z^{(i)})))$\nend for\n```\n\n图 5-3 根据文献 [2] 重新绘制。\n\n## 5.2 GAN 的优化与改进\n\
    \n生成对抗网络是一种强大的生成模型，可以生成高质量的样本，但是 GAN 的训练往往非常困难，因为 GAN 需要在两个互相对抗的模型之间进行训练，这样的过程往往容易导致训练不稳定和模式崩溃等问题。为了解决这些问题，研究人员从不同角度对\
    \ GAN 进行了优化，主要的优化方式包括限定条件优化、迭代式生成优化和结构优化。\n\n### 5.2.1 限定条件优化\n\n原始 GAN 的生成器只考虑优化生成数据的相似性，而没有考虑其他一些有用的条件限制，如指定特定类别的图像生成、具有某些特定属性的图像生成等。通过加入一些限定条件，可以让生成器产生更多样、更有价值的数据。例如，如果希望\
    \ GAN 生成属于特定类别的图像，可以在训练 GAN 时加入额外的标签信息，如一个手写数字图像的分类标签，并将这些标签输入生成器，那么生成器的目标就不仅仅是产生逼真的图像，还应该去满足类别这一约束条件，其他约束也类似。在这种情况下，GAN\
    \ 的目标就是通过生成器和判别器不断对抗，找到生成数据的最优解（符合目标约束条件的最优解），以达到模仿真实数据的目的。代表性的限定条件优化工作包括 CGAN[3]\
    \ 和 InfoGAN[4]。接下来，对这两个代表性工作进行介绍以加深对限定条件优化的理解。\n\n### 1. CGAN\n\nCGAN[3] 的中心思想是可以控制\
    \ GAN 生成样本，减少随机性。在 CGAN 中，生成器 G 接受一个噪声向量 z 和一个条件 y（通常是一个标签）为输入，它的任务是生成一个具有特定条件的图像，它的表现会在与判别器\
    \ D 的对抗中被衡量。D 的任务是给定一个图像，判断它是真实的（来自真实数据集）或者是虚假的（由 G 生成的），如图 5-4 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_163_0.png)\n\
    \n图 5-4 CGAN 示意图\n\nCGAN 的目标函数如下：\n\n```\n\\min_G \\max_D V(D, G) = E_{x \\sim\
    \ p_{data}(x)}[\\log D(x|y)] + E_{z \\sim p_z(z)}[\\log (1 - D(G(z|y)))] \\quad\
    \ (5-4)\n```\n\n目标函数中的 \\( E_{x \\sim p_{data}(x)}[\\log D(x|y)] \\) 表示在给定条件 \\\
    ( y \\) 的情况下当样本采样自真实数据集时判别器能够准确判别其为真的期望，\\( E_{z \\sim p_z(z)}[\\log (1 - D(G(z|y)))]\
    \ \\) 表示在给定条件 \\( y \\) 和输入噪声 \\( z \\) 的情况下通过生成器生成的样本数据被判别器判别为假的期望。\n\n因此，CGAN\
    \ 在训练过程中可用于生成具有特定属性的图像。例如，在手写数字图像生成实验中，在指定图像类别的情况下，可以分别生成类别为 0~9 的手写数字图像，如图 5-5\
    \ 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_164_0.png)\n\n图 5-5 CGAN 生成的手写数字图像（每一行表示一类）\n\
    \n### 2. InfoGAN\n\nInfoGAN[4] 不仅可以生成高质量的样本，还可以从生成的样本中理解和学习数据分布中的隐含变量并将其分解成独立的特征。这种独立的特征包括一些与数据分布相关的因素，如旋转角度、颜色和形状等。\n\
    \nInfoGAN 的网络结构和 GAN 相似，但是在输入和输出上有一些变化，如图 5-6 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_164_1.png)\n\
    \n图 5-6 InfoGAN 的结构\n\nInfoGAN 主要由以下 4 个部分组成。\n\n- 1）输入部分：与 CGAN 相同，InfoGAN 的输入包括一个随机噪声变量\
    \ \\( z' \\) 和一个条件变量 \\( c \\)，其中条件变量称为“已知变量”。\n\n- 2）生成器：生成器的作用是将输入的随机噪声变量 \\\
    ( z' \\) 和条件变量 \\( c \\) 转换成一张图像，并尽可能使生成的图像与真实图像相似。具体来说，生成器会将输入的两种变量转换成一种不连续的变量\
    \ \\( x \\)，这意味着生成器输出的图像会因为各种条件变量的变化而产生明显的变化。\n\n- 3）判别器：判别器的作用是判断输入的图像是真实的还是生成的。在\
    \ InfoGAN 中，判别器除了输出一个二进制的真假结果外，还会输出一个表示判决结果可信度的概率值。\n\n- 4）分类器：在 InfoGAN 中，还配备了一个用于学习特征提取的分类器。这个分类器会从生成器的输出中提取特征，并将特征分解为可解释的约束\
    \ c。这个过程就是 InfoGAN 提供的“信息推断”部分，用于学习数据分布中的隐含因素并将其分解成为独立的特征。\n\nInfoGAN 的目标函数如下：\n\
    \n$$ \\min_c \\max_\\theta V_i(D, G) = V(D, G) - \\lambda I(c; G(z, c)) \\quad\
    \ (5-5) $$\n\n与原始 GAN 相比，该目标函数增加了一项 \\(\\lambda I(c; G(z, c))\\)，这一项代表的是 c 与生成器的输出\
    \ G(z, c) 之间的互信息。这一项越大，表示 c 与 G(z, c) 越相关。\n\n在训练过程中，InfoGAN 在生成数据的同时，学习如何去操纵潜在空间中的特定因素，以生成特定的图像或数据，直观的解释就是，如果\
    \ c 的每一个维度对输出都有明确的影响，那么分类器就可以根据 x 返回原来的 c。如果 c 对输出没有明显的影响，那么分类器也无法返回原来的 c。假设希望生成手写数字图像，并希望能够控制数字的倾斜角度，那么在\
    \ InfoGAN 中，就可以将手写数字类别（Categorical）作为一个固定输入条件，将倾斜角度（Rotation）和宽度（Width）编码为一个随机噪声变量，生成器可以利用这些变量生成不同类别、特定倾斜角度和宽度的手写数字图像，如图\
    \ 5-7 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_165_0.png)\n\n### 5.2.2\
    \ 迭代式生成优化\n\n迭代式生成优化方法通过在生成器中引入一种可迭代的机制，对生成的样本进行逐步的精炼和改进，这个机制可以在训练过程中不断更新生成器的参数，以生成更高质量和多样化的样本。代表性的迭代式生成优化工作主要有\
    \ LAPGAN[5] 和 StackGAN[6]。接下来，对这两个代表性工作进行介绍以加深对迭代式生成优化的理解。\n\n### 1. LAPGAN\n\n\
    LAPGAN[5] 通过级联方式改进 GAN 以实现从粗略到精细图片的生成，如图 5-8 所示。网络的级联思想对后续的研究产生了极大的影响。LAPGAN 使用高斯金字塔进行下采样，使用拉普拉斯金字塔进行上采样。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_166_0.png)\n\n图 5-8 LAPGAN 模型的结构（详见彩插）\n\
    \n假设图像 $I$ 的长度和宽度均为 $j$，对于图像 $I_0 = (j, j)$，下采样得到的图像尺寸为 $(j/2, j/2)$，上采样得到的图像尺寸为\
    \ $(2j, 2j)$，对图像进行连续 $k$ 次的下采样，可以获得一系列图像 $I_1 = (j/2, j/2), I_2 = (j/4, j/4),\
    \ \\cdots, I_k = (j/2^k, j/2^k)$。\n\n$\\mathcal{G}(I) = [I_0, I_1, \\cdots, I_k]$\
    \ (5-6)\n\n其中，$\\mathcal{G}(I)$ 表示图像的高斯金字塔。在得到高斯金字塔后，拉普拉斯金字塔可表示如下：\n\n$h_k = \\\
    mathcal{L}_k(I) = \\mathcal{G}_k(I) - u(\\mathcal{G}_{k+1}(I)) = I_k - u(I_{k+1})$\
    \ (5-7)\n\n其中，拉普拉斯金字塔的第 $k$ 层等于高斯金字塔的第 $k$ 层 $\\mathcal{G}_k(I)$ 减去高斯金字塔第 $(k+1)$\
    \ 层的上采样 $u(\\mathcal{G}_{k+1}(I))$。\n\nLAPGAN 将条件对抗生成网络 CGAN 集成到拉普拉斯金字塔结构中：\n\n\
    $\\widetilde{T}_k = u(\\widetilde{T}_{k+1}) + \\widetilde{h}_k = u(\\widetilde{T}_{k+1})\
    \ + G_k(z_k, u(\\widetilde{T}_{k+1}))$ (5-8)\n\n其中，$G_k$ 表示第 $k$ 个卷积神经网络，也就是生成器，高斯金字塔第\
    \ $k$ 层的重建等于它的第 $(k+1)$ 层上采样 $u(\\widetilde{T}_{k+1})$ 加上拉普拉斯金字塔的第 $k$ 层 $\\widetilde{h}_k$。除了最高层的生成器外，其余生成器\
    \ $G_0, G_1, \\cdots, G_{k-1}$ 都是采用上一级的上采样和噪声作为联合输入。上采样的结果就是 LAPGAN 中的条件变量。\n\n\
    总之，迭代式生成优化是一种非常有效的 GAN 优化方法，可以在保持模型训练稳定性的同时，提高样本质量和模型的可解释性。这个方法可应用于各种 GAN 模型，包括图像生成、文本生成和视频生成等。\n\
    \n### 2. StackGAN\n\nStackGAN [6] 用来解决从文本生成图像中的图像分辨率不高的问题，采用与 LAPGAN 相似的思路，也是从粗略到精细的过程，它包含两个\
    \ GAN：第 1 个 GAN 用于根据文本描述生成一张低分辨率的图像；第 2 个 GAN 将低分辨率图像和文本作为输入，修正之前生成的图像并添加细节纹理，生成高分辨率图像。StackGAN\
    \ 的结构如图 5-9 所示。\n\n图 5-9 StackGAN 的结构 (详见彩插)\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_167_0.png)\n\
    \nStackGAN 分为两个阶段，阶段 I 的 GAN 以文本嵌入为条件信息生成具有基本颜色和粗略草图的低分辨率图像。文本描述 $t$ 首先由一个编码器进行编码，从而生成一个文本嵌入\
    \ $\\varphi_i$，然而基于文本条件信息的潜在空间通常是高维的（大于 100 维），在数据量有限的情况下，通常会导致潜在数据流形的不连续，这不适合学习生成器。为了缓解这一问题，引入了一种条件增强技术，为生成器产生更多的条件变量。从一个独立的高斯分布\
    \ $\\mathcal{N}(\\mu(\\varphi_i), \\Sigma(\\varphi_i))$ 中随机采样潜在变量，从而在少量图像-文本对的情况下产生更多的训练对。为了进一步加强条件流形的平滑性，避免过拟合，在训练过程中对生成器的目标添加了如下正则化项：\n\
    \n$D_{KL}(\\mathcal{N}(\\mu(\\varphi_i), \\Sigma(\\varphi_i)) \\|\\mathcal{N}(0,\
    \ I))$ （5-9）\n\n这是标准高斯分布和条件高斯分布之间的 Kullback-Leibler 散度（KL 散度）。在高斯潜在变量 $c_0$ 的条件下，第\
    \ 1 阶段 GAN 通过在下述公式中最大化 $L_{D_0}$ 来训练判别器，用最小化 $L_{G_0}$ 来训练生成器，如下所示：\n\n$L_{D_0}\
    \ = E_{(I_0, t) \\sim p_{data}} [\\log D_0(I_0, \\varphi_t)] + E_{z \\sim p_z,\
    \ t \\sim p_{data}} [\\log (1 - D_0(G_0(z, \\hat{c}_0), \\varphi_t))]$ （5-10）\n\
    \n$L_{G_0} = E_{z \\sim p_z, t \\sim p_{data}} [\\log (1 - D_0(G_0(z, \\hat{c}_0),\
    \ \\varphi_t))] + \\lambda D_{KL}(\\mathcal{N}(\\mu_0(\\varphi_t), \\Sigma_0(\\\
    varphi_t)) \\|\\mathcal{N}(0, I))$ （5-11）\n\n其中，真实的图像 $I_0$ 和文本描述 $t$ 来自真实的数据分布\
    \ $p_{data}$，$z$ 是一个从给定的分布 $p_z$ 中随机采样的噪声向量，$\\lambda$ 是一个正则化参数，它控制了两项之间的平衡。$\\\
    varphi_t$ 是由一个预先训练好的编码器生成的文本嵌入。\n\n由阶段 I 的 GAN 生成的低分辨率图像缺乏生动的对象部分，也可能包含形状失真。此外，文本中的一些细节在第\
    \ 1 阶段可能会被省略。而这是生成真实图像所需的重要信息。阶段 II 的 GAN 获取由阶段 I 的 GAN 生成的图像，并以文本嵌入为条件信息生成高分辨率图像。这一阶段的模型主要用来进行缺陷纠正和细节添加，产生逼真的高分辨率图像。基于低分辨率样本\
    \ $s_0$ 和高斯潜在向量 $\\hat{c}$，这一阶段 GAN 中的判别器 $D$ 和生成器 $G$ 的损失函数如下所示：\n\n$L_D = E_{(I,\
    \ \\varphi_t) \\sim p_{data}} [\\log D(I, \\varphi_t)] + E_{s_0 \\sim p_{G_0},\
    \ t \\sim p_{data}} [\\log (1 - D(G(s_0, \\hat{c}), \\varphi_t))]$ （5-12）\n\n\
    $L_G = E_{s_0 \\sim p_{G_0}, t \\sim p_{data}} [\\log (1 - D(G(s_0, \\hat{c}),\
    \ \\varphi_t))] + \\lambda D_{KL}(\\mathcal{N}(\\mu(\\varphi_t), \\Sigma(\\varphi_t))\
    \ \\|\\mathcal{N}(0, I))$ （5-13）\n\n其中 $s_0 = G_0(z, c_0)$，由阶段 I 的 GAN 生成。与原始\
    \ GAN 公式不同，随机噪声 $z$ 在这个阶段并没有被使用。本阶段使用的高斯条件向量 $\\hat{c}$ 和阶段 I 的 GAN 中使用的 $\\hat{c}_0$\
    \ 共享相同的预先训练好的文本编码器生成的文本嵌入 $\\varphi_t$。但是，它们利用不同的全连接层来产生不同的均值和标准差。\n\n### 5.2.3\
    \ 结构优化\n\n结构优化是指对 GAN 的结构进行优化，两个代表性的结构优化工作包括 DCGAN[7] 和 Pix2Pix[8]。\n\n### 1.\
    \ DCGAN\n\nDCGAN 将 CNN 和 GAN 结合在一起，并将 CNN 作为 GAN 中的生成器和判别器，生成器由\n"
  mdcn: "\n### 5.1.3 GAN 的目标函数\n\nGAN 的目标是使生成器生成的数据能够骗过判别器，因此需要定义一个目标函数，使得生成器判断真实样本为“真”、生成样本为“假”的概率最小化。基于这一考虑，GAN\
    \ 的目标函数定义如下：\n\n```\n\\min_G \\max_D V(D, G) = E_{x \\sim p_{data}(x)}[\\log D(x)]\
    \ + E_{z \\sim p_z(z)}[\\log (1 - D(G(z)))]\n```\n\n其中，V(D, G) 表示真实样本和生成样本的差异程度；p_{data}(x)\
    \ 表示真实数据 x 的分布，p_z(z) 表示噪声 z 的分布，D(x) 表示判别模型认为 x 是真实样本的概率，D(G(z)) 表示判别模型认为生成样本\
    \ G(z) 是假的概率。\n\n训练 GAN 时，判别器希望目标函数最大化，也就是使判别器判断真实样本为“真”、判断生成样本为“假”的概率最大化，要尽量最大化自己的判别准确率。max_D\
    \ V(D, G) 的意思是固定生成器，尽可能让判别器能够最大化地判别出样本来自真实数据还是生成数据，也可以写作损失函数的形式：\n\n```\nL(G,\
    \ D) = -E_{x \\sim p_{data}(x)}[\\log D(x)] - E_{z \\sim p_z(z)}[\\log (1 - D(G(z)))]\n\
    ```\n\n与判别器相反，生成器希望目标函数最小化，也就是迷惑判别器，降低其对数据来源判断正确的概率，也就是最小化判别器的判别准确率。如果采用零和博弈，生成器的目标是最小化\
    \ V(D, G)，而实际操作时发现零和博弈的训练效果并不好，生成模型一般采用最小化公式 (5-3) 的形式：\n\n```\nE_{z \\sim p_z(z)}[\\\
    log (1 - D(G(z)))]\n```\n\n### 5.1.4 GAN 的训练\n\n如图 5-3 所示，GAN 的训练过程包含三个步骤[2]：1）首先使用采样的真实数据\
    \ x 训练判别器，即输入真实数据 x 到判别器，前向传播，得到输出为 1（表示判断结果为真），之后使用反向传播算法更新判别器的参数；2）使用生成器生成的数据\
    \ G(z) 训练判别器，即输入生成器生成的数据 G(z) 到判别器，前向传播，得到输出为 0（表示判断结果为假），之后使用反向传播算法再次更新判别器的参数；3）使用生成器生成的数据\
    \ G(z) 训练生成器，即输入生成器生成的数据 G(z) 到判别器，采用上一步训练好的判别器的参数（冻结判别器的参数）前向传播，得到输出为 1（表示判断结果为真），之后使用反向传播算法更新生成器的参数，这一步的目的在于训练更好的生成器，以迷惑判别器，使之将生成器生成的数据判别为真。在这个过程中，双方都极力优化自己的网络，从而形成竞争对抗，直到双方达到一个动态的平衡。此时，生成器生成的数据分布无限接近真实数据的分布，判别器判别不出输入的是真实数据还是生成的数据，输出概率都是\
    \ 50%。\n\n在训练生成对抗网络的过程中使用随机梯度上升或下降的方法，判别器的训练步数 k 是一个超参数，文献 [1] 在实验中使用了 k=1 的设置，这是成本最低的选择，同时训练中的随机梯度方法可以使用一般的随机梯度方法，也可以使用优化的随机梯度方法，文献\
    \ [1] 中使用了基于动量（Momentum）的方法（基于动量的方法可查阅 7.8.2 节）。GAN 训练算法的伪代码如下所示：\n\n```\nfor\
    \ 训练迭代轮数 do\nfor k 步 do\n    • 在噪声先验分布为 $p_z(z)$ 的情况下采样大小为 $m$ 的小批量噪声样本 $\\{z^{(1)},\
    \ \\cdots, z^{(m)}\\}$\n    • 在样本生成分布为 $p_{data}(x)$ 的情况下采样大小为 $m$ 的小批量样本 $\\\
    {x^{(1)}, \\cdots, x^{(m)}\\}$\n    • 通过随机梯度上升法更新判别器：\n    $\\nabla_{\\theta_d}\
    \ \\frac{1}{m} \\sum_{i=1}^m [\\log D(x^{(i)}) + \\log (1 - D(G(z^{(i)})))]$\n\
    end for\n• 在噪声先验分布为 $p_z(z)$ 的情况下采样大小为 $m$ 的小批量噪声样本 $\\{z^{(1)}, \\cdots, z^{(m)}\\\
    }$\n• 通过随机梯度下降法更新生成器：\n$\\nabla_{\\theta_g} \\frac{1}{m} \\sum_{i=1}^m \\log (1\
    \ - D(G(z^{(i)})))$\nend for\n```\n\n图 5-3 根据文献 [2] 重新绘制。\n\n## 5.2 GAN 的优化与改进\n\
    \n生成对抗网络是一种强大的生成模型，可以生成高质量的样本，但是 GAN 的训练往往非常困难，因为 GAN 需要在两个互相对抗的模型之间进行训练，这样的过程往往容易导致训练不稳定和模式崩溃等问题。为了解决这些问题，研究人员从不同角度对\
    \ GAN 进行了优化，主要的优化方式包括限定条件优化、迭代式生成优化和结构优化。\n\n### 5.2.1 限定条件优化\n\n原始 GAN 的生成器只考虑优化生成数据的相似性，而没有考虑其他一些有用的条件限制，如指定特定类别的图像生成、具有某些特定属性的图像生成等。通过加入一些限定条件，可以让生成器产生更多样、更有价值的数据。例如，如果希望\
    \ GAN 生成属于特定类别的图像，可以在训练 GAN 时加入额外的标签信息，如一个手写数字图像的分类标签，并将这些标签输入生成器，那么生成器的目标就不仅仅是产生逼真的图像，还应该去满足类别这一约束条件，其他约束也类似。在这种情况下，GAN\
    \ 的目标就是通过生成器和判别器不断对抗，找到生成数据的最优解（符合目标约束条件的最优解），以达到模仿真实数据的目的。代表性的限定条件优化工作包括 CGAN[3]\
    \ 和 InfoGAN[4]。接下来，对这两个代表性工作进行介绍以加深对限定条件优化的理解。\n\n### 1. CGAN\n\nCGAN[3] 的中心思想是可以控制\
    \ GAN 生成样本，减少随机性。在 CGAN 中，生成器 G 接受一个噪声向量 z 和一个条件 y（通常是一个标签）为输入，它的任务是生成一个具有特定条件的图像，它的表现会在与判别器\
    \ D 的对抗中被衡量。D 的任务是给定一个图像，判断它是真实的（来自真实数据集）或者是虚假的（由 G 生成的），如图 5-4 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_163_0.png)\n\
    \n图 5-4 CGAN 示意图\n\nCGAN 的目标函数如下：\n\n```\n\\min_G \\max_D V(D, G) = E_{x \\sim\
    \ p_{data}(x)}[\\log D(x|y)] + E_{z \\sim p_z(z)}[\\log (1 - D(G(z|y)))] \\quad\
    \ (5-4)\n```\n\n目标函数中的 \\( E_{x \\sim p_{data}(x)}[\\log D(x|y)] \\) 表示在给定条件 \\\
    ( y \\) 的情况下当样本采样自真实数据集时判别器能够准确判别其为真的期望，\\( E_{z \\sim p_z(z)}[\\log (1 - D(G(z|y)))]\
    \ \\) 表示在给定条件 \\( y \\) 和输入噪声 \\( z \\) 的情况下通过生成器生成的样本数据被判别器判别为假的期望。\n\n因此，CGAN\
    \ 在训练过程中可用于生成具有特定属性的图像。例如，在手写数字图像生成实验中，在指定图像类别的情况下，可以分别生成类别为 0~9 的手写数字图像，如图 5-5\
    \ 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_164_0.png)\n\n图 5-5 CGAN 生成的手写数字图像（每一行表示一类）\n\
    \n### 2. InfoGAN\n\nInfoGAN[4] 不仅可以生成高质量的样本，还可以从生成的样本中理解和学习数据分布中的隐含变量并将其分解成独立的特征。这种独立的特征包括一些与数据分布相关的因素，如旋转角度、颜色和形状等。\n\
    \nInfoGAN 的网络结构和 GAN 相似，但是在输入和输出上有一些变化，如图 5-6 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_164_1.png)\n\
    \n图 5-6 InfoGAN 的结构\n\nInfoGAN 主要由以下 4 个部分组成。\n\n- 1）输入部分：与 CGAN 相同，InfoGAN 的输入包括一个随机噪声变量\
    \ \\( z' \\) 和一个条件变量 \\( c \\)，其中条件变量称为“已知变量”。\n\n- 2）生成器：生成器的作用是将输入的随机噪声变量 \\\
    ( z' \\) 和条件变量 \\( c \\) 转换成一张图像，并尽可能使生成的图像与真实图像相似。具体来说，生成器会将输入的两种变量转换成一种不连续的变量\
    \ \\( x \\)，这意味着生成器输出的图像会因为各种条件变量的变化而产生明显的变化。\n\n- 3）判别器：判别器的作用是判断输入的图像是真实的还是生成的。在\
    \ InfoGAN 中，判别器除了输出一个二进制的真假结果外，还会输出一个表示判决结果可信度的概率值。\n\n- 4）分类器：在 InfoGAN 中，还配备了一个用于学习特征提取的分类器。这个分类器会从生成器的输出中提取特征，并将特征分解为可解释的约束\
    \ c。这个过程就是 InfoGAN 提供的“信息推断”部分，用于学习数据分布中的隐含因素并将其分解成为独立的特征。\n\nInfoGAN 的目标函数如下：\n\
    \n$$ \\min_c \\max_\\theta V_i(D, G) = V(D, G) - \\lambda I(c; G(z, c)) \\quad\
    \ (5-5) $$\n\n与原始 GAN 相比，该目标函数增加了一项 \\(\\lambda I(c; G(z, c))\\)，这一项代表的是 c 与生成器的输出\
    \ G(z, c) 之间的互信息。这一项越大，表示 c 与 G(z, c) 越相关。\n\n在训练过程中，InfoGAN 在生成数据的同时，学习如何去操纵潜在空间中的特定因素，以生成特定的图像或数据，直观的解释就是，如果\
    \ c 的每一个维度对输出都有明确的影响，那么分类器就可以根据 x 返回原来的 c。如果 c 对输出没有明显的影响，那么分类器也无法返回原来的 c。假设希望生成手写数字图像，并希望能够控制数字的倾斜角度，那么在\
    \ InfoGAN 中，就可以将手写数字类别（Categorical）作为一个固定输入条件，将倾斜角度（Rotation）和宽度（Width）编码为一个随机噪声变量，生成器可以利用这些变量生成不同类别、特定倾斜角度和宽度的手写数字图像，如图\
    \ 5-7 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_165_0.png)\n\n### 5.2.2\
    \ 迭代式生成优化\n\n迭代式生成优化方法通过在生成器中引入一种可迭代的机制，对生成的样本进行逐步的精炼和改进，这个机制可以在训练过程中不断更新生成器的参数，以生成更高质量和多样化的样本。代表性的迭代式生成优化工作主要有\
    \ LAPGAN[5] 和 StackGAN[6]。接下来，对这两个代表性工作进行介绍以加深对迭代式生成优化的理解。\n\n### 1. LAPGAN\n\n\
    LAPGAN[5] 通过级联方式改进 GAN 以实现从粗略到精细图片的生成，如图 5-8 所示。网络的级联思想对后续的研究产生了极大的影响。LAPGAN 使用高斯金字塔进行下采样，使用拉普拉斯金字塔进行上采样。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_166_0.png)\n\n图 5-8 LAPGAN 模型的结构（详见彩插）\n\
    \n假设图像 $I$ 的长度和宽度均为 $j$，对于图像 $I_0 = (j, j)$，下采样得到的图像尺寸为 $(j/2, j/2)$，上采样得到的图像尺寸为\
    \ $(2j, 2j)$，对图像进行连续 $k$ 次的下采样，可以获得一系列图像 $I_1 = (j/2, j/2), I_2 = (j/4, j/4),\
    \ \\cdots, I_k = (j/2^k, j/2^k)$。\n\n$\\mathcal{G}(I) = [I_0, I_1, \\cdots, I_k]$\
    \ (5-6)\n\n其中，$\\mathcal{G}(I)$ 表示图像的高斯金字塔。在得到高斯金字塔后，拉普拉斯金字塔可表示如下：\n\n$h_k = \\\
    mathcal{L}_k(I) = \\mathcal{G}_k(I) - u(\\mathcal{G}_{k+1}(I)) = I_k - u(I_{k+1})$\
    \ (5-7)\n\n其中，拉普拉斯金字塔的第 $k$ 层等于高斯金字塔的第 $k$ 层 $\\mathcal{G}_k(I)$ 减去高斯金字塔第 $(k+1)$\
    \ 层的上采样 $u(\\mathcal{G}_{k+1}(I))$。\n\nLAPGAN 将条件对抗生成网络 CGAN 集成到拉普拉斯金字塔结构中：\n\n\
    $\\widetilde{T}_k = u(\\widetilde{T}_{k+1}) + \\widetilde{h}_k = u(\\widetilde{T}_{k+1})\
    \ + G_k(z_k, u(\\widetilde{T}_{k+1}))$ (5-8)\n\n其中，$G_k$ 表示第 $k$ 个卷积神经网络，也就是生成器，高斯金字塔第\
    \ $k$ 层的重建等于它的第 $(k+1)$ 层上采样 $u(\\widetilde{T}_{k+1})$ 加上拉普拉斯金字塔的第 $k$ 层 $\\widetilde{h}_k$。除了最高层的生成器外，其余生成器\
    \ $G_0, G_1, \\cdots, G_{k-1}$ 都是采用上一级的上采样和噪声作为联合输入。上采样的结果就是 LAPGAN 中的条件变量。\n\n\
    总之，迭代式生成优化是一种非常有效的 GAN 优化方法，可以在保持模型训练稳定性的同时，提高样本质量和模型的可解释性。这个方法可应用于各种 GAN 模型，包括图像生成、文本生成和视频生成等。\n\
    \n### 2. StackGAN\n\nStackGAN [6] 用来解决从文本生成图像中的图像分辨率不高的问题，采用与 LAPGAN 相似的思路，也是从粗略到精细的过程，它包含两个\
    \ GAN：第 1 个 GAN 用于根据文本描述生成一张低分辨率的图像；第 2 个 GAN 将低分辨率图像和文本作为输入，修正之前生成的图像并添加细节纹理，生成高分辨率图像。StackGAN\
    \ 的结构如图 5-9 所示。\n\n图 5-9 StackGAN 的结构 (详见彩插)\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_167_0.png)\n\
    \nStackGAN 分为两个阶段，阶段 I 的 GAN 以文本嵌入为条件信息生成具有基本颜色和粗略草图的低分辨率图像。文本描述 $t$ 首先由一个编码器进行编码，从而生成一个文本嵌入\
    \ $\\varphi_i$，然而基于文本条件信息的潜在空间通常是高维的（大于 100 维），在数据量有限的情况下，通常会导致潜在数据流形的不连续，这不适合学习生成器。为了缓解这一问题，引入了一种条件增强技术，为生成器产生更多的条件变量。从一个独立的高斯分布\
    \ $\\mathcal{N}(\\mu(\\varphi_i), \\Sigma(\\varphi_i))$ 中随机采样潜在变量，从而在少量图像-文本对的情况下产生更多的训练对。为了进一步加强条件流形的平滑性，避免过拟合，在训练过程中对生成器的目标添加了如下正则化项：\n\
    \n$D_{KL}(\\mathcal{N}(\\mu(\\varphi_i), \\Sigma(\\varphi_i)) \\|\\mathcal{N}(0,\
    \ I))$ （5-9）\n\n这是标准高斯分布和条件高斯分布之间的 Kullback-Leibler 散度（KL 散度）。在高斯潜在变量 $c_0$ 的条件下，第\
    \ 1 阶段 GAN 通过在下述公式中最大化 $L_{D_0}$ 来训练判别器，用最小化 $L_{G_0}$ 来训练生成器，如下所示：\n\n$L_{D_0}\
    \ = E_{(I_0, t) \\sim p_{data}} [\\log D_0(I_0, \\varphi_t)] + E_{z \\sim p_z,\
    \ t \\sim p_{data}} [\\log (1 - D_0(G_0(z, \\hat{c}_0), \\varphi_t))]$ （5-10）\n\
    \n$L_{G_0} = E_{z \\sim p_z, t \\sim p_{data}} [\\log (1 - D_0(G_0(z, \\hat{c}_0),\
    \ \\varphi_t))] + \\lambda D_{KL}(\\mathcal{N}(\\mu_0(\\varphi_t), \\Sigma_0(\\\
    varphi_t)) \\|\\mathcal{N}(0, I))$ （5-11）\n\n其中，真实的图像 $I_0$ 和文本描述 $t$ 来自真实的数据分布\
    \ $p_{data}$，$z$ 是一个从给定的分布 $p_z$ 中随机采样的噪声向量，$\\lambda$ 是一个正则化参数，它控制了两项之间的平衡。$\\\
    varphi_t$ 是由一个预先训练好的编码器生成的文本嵌入。\n\n由阶段 I 的 GAN 生成的低分辨率图像缺乏生动的对象部分，也可能包含形状失真。此外，文本中的一些细节在第\
    \ 1 阶段可能会被省略。而这是生成真实图像所需的重要信息。阶段 II 的 GAN 获取由阶段 I 的 GAN 生成的图像，并以文本嵌入为条件信息生成高分辨率图像。这一阶段的模型主要用来进行缺陷纠正和细节添加，产生逼真的高分辨率图像。基于低分辨率样本\
    \ $s_0$ 和高斯潜在向量 $\\hat{c}$，这一阶段 GAN 中的判别器 $D$ 和生成器 $G$ 的损失函数如下所示：\n\n$L_D = E_{(I,\
    \ \\varphi_t) \\sim p_{data}} [\\log D(I, \\varphi_t)] + E_{s_0 \\sim p_{G_0},\
    \ t \\sim p_{data}} [\\log (1 - D(G(s_0, \\hat{c}), \\varphi_t))]$ （5-12）\n\n\
    $L_G = E_{s_0 \\sim p_{G_0}, t \\sim p_{data}} [\\log (1 - D(G(s_0, \\hat{c}),\
    \ \\varphi_t))] + \\lambda D_{KL}(\\mathcal{N}(\\mu(\\varphi_t), \\Sigma(\\varphi_t))\
    \ \\|\\mathcal{N}(0, I))$ （5-13）\n\n其中 $s_0 = G_0(z, c_0)$，由阶段 I 的 GAN 生成。与原始\
    \ GAN 公式不同，随机噪声 $z$ 在这个阶段并没有被使用。本阶段使用的高斯条件向量 $\\hat{c}$ 和阶段 I 的 GAN 中使用的 $\\hat{c}_0$\
    \ 共享相同的预先训练好的文本编码器生成的文本嵌入 $\\varphi_t$。但是，它们利用不同的全连接层来产生不同的均值和标准差。\n\n### 5.2.3\
    \ 结构优化\n\n结构优化是指对 GAN 的结构进行优化，两个代表性的结构优化工作包括 DCGAN[7] 和 Pix2Pix[8]。\n\n### 1.\
    \ DCGAN\n\nDCGAN 将 CNN 和 GAN 结合在一起，并将 CNN 作为 GAN 中的生成器和判别器，生成器由\n"
