    # 2.4.3 VGGNet


    VGGNet[5] 由牛津大学计算机视觉组（Visual Geometry Group）和 Google DeepMind 公司共同研发，包含 VGG-16
    和 VGG-19 两种结构。这里主要介绍应用比较广泛的 VGG-16，相较于 AlexNet，VGG-16 网络模型中的卷积层均使用卷积核大小为 3×3、卷积步长为
    1 的 Same 卷积，池化层均使用池化核大小为 2×2、池化步长为 2 的最大池化，其简单规整的结构使其有着很强的拓展性，如图 2-33 所示。'
