    # ## 8. 3. 2 PyTorch 的主要功能


    总体而言，PyTorch 深度学习框架的实现基于一种反向自动求导的技术，可以零延迟地改变神经网络的行为，这使得用户在使用 PyTorch 时，对机器学习模型的调整和修改是一件非常简单的事情，极大地简化了开发和测试的难度。


    PyTorch 的核心数据类型是 Tensor，即张量，由 torch.Tensor 所定义。它类似于 Numpy 中的 ndarray，但可以在 GPU
    上运行以加速计算。Tensor 支持整型和浮点数等多种不同精度的数据类型，支持各种算术运算和矩阵运算，使用起来非常灵活。


    torch.autograd 是 PyTorch 中所有模型的核心，其功能是为 Tensor 上的所有操作提供自动微分，实现梯度的收集、计算和跟踪，从而避免手动计算导数的复杂过程。它是一个由运行定义的框架，这意味着开发者可以以代码运行的方式自定义数据流的前向传播和后向传播，为模型设计提供了更大的灵活性。


    torch.autograd 包括两个主要的类：


    +   (1) autograd.Variable 类


    torch.autograd 中的核心类，实现了 Tensor 的封装，并支持几乎所有的 Tensor 操作。将 Tensor 的属性 requires_grad
    设置为 True 后，即可在计算过程中跟踪针对该 Tensor 的所有操作；相反地，停止对 Tensor 的跟踪可以用 detach() 来实现。Tensor
    被封装为 Variable 后，即可调用 backward() 自动计算所有梯度，实现深度学习中最关键的反向传播算法。


    +   (2) autograd.Function 类


    支持开发者自定义求导方式。Tensor 和 Function 相互连接，共同构建一个非循环图，Tensor 相当于图中的节点，Function 相当于图中的边，该图能够保存完整的计算过程中的历史信息。Function
    在本质上相当于对 PyTorch 的自定义扩展，使其满足开发者的具体需求，从而为模型设计提供了更大的灵活性。


    PyTorch 提供了多种不同的库来支持不同类型的数据输入，如 PyTorch 图形库 torchvision 包含了常用的图形变换操作和计算机视觉模型，音频库
    torchaudio 提供了各种音频采样和波形分析方法，文本预处理库 torctext 提供了各种针对原始语料的预处理方法等。


    PyTorch 的神经网络模型构建可以基于 torch.nn 实现。torch.nn 模块中包含了各种常用的神经网络结构，比如全连接层、激活函数层、卷积层和循环层等。最常用的模型定义方法之一是继承
    nn.Module，建立一个包含权重、偏置等参数和前向传播方法的类，将该类实例化即可得到神经网络模型。其中定义前向传播的方法是 forward()，它的输出就是神经网络模型的输出。


    更多 PyTorch 的特点与功能，可以参考官方文档：https://pytorch.org/tutorials/。'
