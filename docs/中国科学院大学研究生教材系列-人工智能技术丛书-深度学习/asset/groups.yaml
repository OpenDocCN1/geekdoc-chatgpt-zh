    (L_{AE})_{CE} = -\frac{1}{n} \sum_{i=1}^n (x_i \log \tilde{x}_i + (1-x_i) \log
    (1-\tilde{x}_i)) \quad (6-27)


    # 6.6.2 降噪自编码器


    2008 年，Pascal Vincent 等人提出了降噪自编码器（Denoising AutoEncoder，DAE）[9]，它主要是为了防止在原始数据上进行训练时产生过拟合，在原始数据中加入一些噪声来训练自编码器，希望它仍然能够重构出原始数据。在训练去噪自编码器前，首先需要构建噪声数据，通常通过在原始数据
    \(\boldsymbol{x}=(x_1, x_2, \cdots, x_n)\) 中加入一些随机噪声 \(\boldsymbol{\epsilon}\)
    来构建，常用的构建方式是使用高斯分布：


    x'' \sim \mathcal{N}(x, \sigma^2 I) \quad (6-28)


    之后，将加入高斯随机噪声得到的数据 \(x'' = (x''_1, x''_2, \cdots, x''_n)\) 作为去噪自编码器的输入，通过编码为隐向量
    \(z = (z_1, z_2, \cdots, z_m)\) 并解码为输出 \(\tilde{x} = (\tilde{x}_1, \tilde{x}_2,
    \cdots, \tilde{x}_n)\)，使之与原始输入 \(x = (x_1, x_2, \cdots, x_n)\) 尽可能地接近。去噪自编码器的结构如图
    6-12 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_197_0.png)


    去噪自编码器与自编码器一样，也常采用均方误差损失函数与交叉熵损失函数，这里不再赘述。


    # 6.6.3 稀疏自编码器


    为了实现输入的压缩表示，自编码器的中间层神经元数量一般都要小于输入层的神经元数量，如果中间层神经元的数量过少，可能会造成一些输入特征的丢失，往往无法重构原始输入，而中间层的神经元数量过多，又可能造成输入特征表达的冗余。为了解决这一问题，Andrew
    Ng 提出了稀疏自编码器（Sparse AutoEncoder，SAE）[10]，在自编码器损失函数的基础上引入了正则化项，如下所示：


    L_{SAE} = L_{AE} + \Omega(\theta) \quad (6-29)


    引入正则化项后，使用中间层的少数神经元就能够表达输入的压缩表示，并能够重构原始输入。稀疏自编码器中的正则化项采用 KL 散度来表示，如果损失函数采用均方误差函数，那么稀疏自编码器的损失函数为


    (L_{SAE})_{MSE} = \frac{1}{n} \sum_{i=1}^n |x_i - \tilde{x}_i|^2 + \beta \sum_{j=1}^n
    KL(\rho \| \hat{\rho}_j) \quad (6-30)'
  - '[PAGE 198]


    其中 $\beta$ 是控制 KL 散度的权重参数，$m$ 表示中间层神经元的数量，$\rho$ 表示中间层神经元平均激活度的目标值（使得神经元在多数情况下都不激活），$\hat{\rho}_j$
    表示中间层第 $j$ 个神经元的激活度，计算公式为


    $$ \hat{\rho}_j = \frac{1}{n} \sum_{i=1}^n f(w_j x_i + b_j) $$


    $KL(\rho \parallel \hat{\rho}_j)$ 表示 KL 散度，它反映了平均激活度和目标值的差异，计算公式为


    $$ KL(\rho \parallel \hat{\rho}_j) = \rho \log(\frac{\rho}{\hat{\rho}_j}) + (1-\rho)\log(\frac{1-\rho}{1-\hat{\rho}_j})
    $$


    与自编码器一样，稀疏自编码器同样采用反向传播算法来进行训练，惩罚项的梯度为


    $$ \frac{\partial}{\partial \theta}(\beta \sum_{j=1}^m KL(\rho \parallel \hat{\rho}_j))
    = \beta \frac{\partial}{\partial \hat{\rho}_j} KL(\rho \parallel \hat{\rho}_j)
    \frac{\partial \hat{\rho}_j}{\partial \theta} = (-\frac{\rho}{\hat{\rho}_j} +
    \frac{1-\rho}{1-\hat{\rho}_j}) \frac{\partial \hat{\rho}_j}{\partial \theta} $$


    其中 $\theta$ 表示稀疏自编码器要学习的所有参数，如权重和偏置等。


    # 6.6.4 深度自编码器


    深度自编码器（Deep AutoEncoder，DAE）由 Geoffrey Hinton 等人于 2006 年提出[3]，当时用它来进行降维。深度自编码器由两个对称的深度信念网络构成，编码器通常由
