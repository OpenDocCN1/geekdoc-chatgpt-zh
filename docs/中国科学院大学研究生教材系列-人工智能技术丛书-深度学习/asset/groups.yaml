    ## 本章人物：Jürgen Schmidhuber 教授


    Jürgen Schmidhuber（1962~），瑞士 IDSIA 人工智能实验室（Dalle Molle Institute for Artificial
    Intelligence）教授，实验室共同主任。获 2013 年国际神经网络学会（International Neural Network Society）Helmholtz
    奖、2016 年 IEEE 计算智能分会（IEEE Computational Intelligence Society）神经网络先锋奖（Neural Networks
    Pioneer Award）。Jürgen Schmidhuber 教授在循环神经网络领域做出重要贡献，于 1997 年与 Sepp Hochreiter
    一起提出长短期记忆网络（Long Short Term Memory，LSTM），被誉为 “LSTM 之父”。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_116_0.png)


    Jürgen Schmidhuber 教授于 1987 年和 1991 年在慕尼黑工业大学（Technische Universität München）先后获得计算机科学学士学位和博士学位。毕业后加入瑞士
    IDSIA 人工智能实验室，开始进行神经网络领域研究。


    Jürgen Schmidhuber 教授的主要贡献是提出了 LSTM，并在机器翻译、语音识别等领域开展了大规模应用，目前，很多著名科技公司，如苹果、Google、华为、百度等都在应用
    LSTM 运营各种智能业务。此外，Jürgen Schmidhuber 教授还提出了 Highway Network，它通过门机制来解决深度神经网络的训练问题。


    Jürgen Schmidhuber 教授的个人主页：https://people.idsia.ch/~juergen/。


    ## Transformer


    2018 年，Ashish Vaswani 等人提出了 Transformer[1]，它使用自注意力机制实现了并行，与之前的循环神经网络相比，加快了训练速度，在机器翻译任务上达到了当时最好的实验结果。本章首先从注意力机制讲起，之后介绍
    Transformer 以及基于 Transformer 的 BERT、GPT 等预训练大模型，最后介绍 Transformer 的主要应用。


    ### 4.1 注意力机制


    #### 4.1.1 注意力机制的 Encoder-Decoder 结构


    注意力机制（Attention Mechanism）最早由 Dzmitry Bahdanau 等人提出[2]，最初被用于神经机器翻译任务。提到神经机器翻译，就不得不提到
    Encoder-Decoder 结构。Encoder-Decoder 结构在第 3 章也经常提到，它最初是利用神经网络进行机器翻译的基本方法，又被称为序列到序列模型（Sequence
    to Sequence，Seq2Seq）。在机器翻译中，源语言和目标语言的长度一般并不相等，如源语言的长度为 n，目标语言的长度为 m，那么往往 n ≠ m，而
    Encoder-Decoder 结构则可以有效地对这类输入序列和输出序列不等长的问题进行建模。简单来说，基于 Encoder-Decoder 结构的模型首先利用
    Encoder 对源语言输入序列 x 进行编码，形成一个语义向量 c，然后利用 Decoder 对 c 进行解码，最终得到目标语言输出序列 y，如图 4-1
    所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_117_0.png)


    图 4-1 Encoder-Decoder 架构


    在机器翻译中，Encoder 当时采用 RNN 实现，得到语义向量 c 的方法有很多，可以直接将最后一个隐态作为语义向量，也可以对最后的隐态进行一个 σ(·)
    变换得到语义向量，或对所有的隐态进行 σ(·) 变换得到语义向量，如下所示：


    $$

    c = h_n \quad (4-1)

    $$


    $$

    c = \sigma(h_n) \quad (4-2)

    $$


    $$

    c = \sigma(h_1, h_2, \cdots, h_n) \quad (4-3)

    $$


    得到语义向量 c 后，Decoder 当时也采用一个 RNN 进行解码，常采用两种方法：一种是将语义向量 c 作为 Decoder 的初始状态输入，如图 4-2
    所示；另一种则是将语义向量 c 作为 Decoder 的每一步输入，如图 4-3 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_118_0.png)


    图 4-2 采用语义向量 c 作为初始输入的 Encoder-Decoder 结构


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_118_1.png)


    图 4-3 采用语义向量 c 作为每一步输入的 Encoder-Decoder 结构


    可以看出，Encoder-Decoder 结构会将任意长度的输入编码成一个固定长度的语义向量 c。因此，如果要准确地对源语言进行翻译，则语义向量 c 应包含源语言输入序列的所有信息。但是，如果源语言输入序列比较长，这种结构可能会导致固定长度的语义向量
    c 无法存储全部的语义信息，而注意力机制的提出则解决了这个问题。


    图 4-4 是引入了注意力机制的 Encoder-Decoder 结构。可以看出，在解码过程中，每一步使用的是不同的语义向量 c_j (j=1, 2, ⋯,
    m)，c_j 会表达与当前输出 y_j 更相关的语义信息。


    在这个新结构中，定义每个输出的条件概率为


    $$

    p(y_j | y_1, \cdots, y_{j-1}, x) = g(y_{j-1}, h''_j, c_j) \quad (4-4)

    $$


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_118_2.png)


    图 4-4 引入注意力机制的 Encoder-Decoder 结构


    其中， g(·) 是一个非线性函数， h''_i 为解码器 RNN 中的隐态：

    h''_i = f(h''_{i-1}, y_{i-1}, c_i)


    这里的上下文向量 c_i 取决于 Encoder 状态序列，通过使用注意力系数 α_{ij} 对 h_j 加权求得：

    c_i = \sum_{j=1}^{T_s} α_{ij} h_j


    注意力系数 α_{ij} 的计算公式如下：

    α_{ij} = \frac{\exp(e_{ij})}{\sum_{k=1}^{r_s} \exp(e_{ik})}


    而计算注意力系数的函数主要有以下几种：

    e_{ij} = a(h''_i, h_j) = \begin{cases} h''_i^T \cdot h_j \\ h''_i^T \cdot W_a
    \cdot h_j \\ W_a \cdot [h''_i^T, h_j^T]^T \\ V_a \tanh (U_a h''_i + W_a h_j) \end{cases}


    除了在机器翻译任务中可以引入注意力机制，在计算机视觉领域同样有注意力机制的用武之地，并且在计算机视觉领域应用注意力机制在直观上更好理解。人们在观察图像时，往往会关注其中的重要区域，比如会更多地关注图像中的前景而非背景，这也就是使用注意力机制的意义所在。


    #### 4.1.2 注意力机制的分类


    注意力机制一般分为全局注意力、局部注意力和自注意力三种。


    全局注意力是指 Decoder 端的注意力计算时要考虑 Encoder 端输入序列中所有的序列，如图 4-4 中的注意力就是全局注意力。


    局部注意力[3] 是指 Decoder 端的注意力计算时仅考虑 Encoder 端输入序列中的部分序列。首先预估一个对齐位置 p_i，然后在 p_i 左右大小为
    D 的窗口范围内来取序列进行注意力计算，如图 4-5 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_119_0.png)


    图 4-5 局部注意力


    局部注意力中语义向量的计算方式如下：

    c_i = \sum_{j=p_i-D}^{p_i+D} α_{i,j} h_j \quad (4-9)


    α_{i,j} = \frac{\exp(e_{ij})}{\sum_{k=p_i-D}^{p_i+D} \exp(e_{ik})} \exp\left(-\frac{(j-p_i)^2}{2(D/2)^2}\right)
    \quad (4-10)


    e_{ij} = h_i''^T \cdot W_α \cdot h_j \quad (4-11)


    p_i = T_x \cdot \text{sigmoid}(V_p^T \tanh(W_p h_i'')) \quad (4-12)


    其中，p_i 是对齐位置，D 是窗口范围，α_{i,j} 是注意力系数，T_x 是 Encoder 端的向量表示，W_α、W_p 和 V_p 是可学习的参数。


    自注意力是指让模型注意到整个输入中不同部分之间的相关性，自注意力机制是 Transformer 模型的核心，我们将在 4.2.3 节中对其进行详细介绍。


    ### 4.2 Transformer 概述


    #### 4.2.1 Transformer 的结构


    Transformer[1] 的结构如图 4-6 所示，它由编码器（Encoder）和解码器（Decoder）两部分组成，每个部分包含若干个模块（Block）。其中，编码器负责理解输入，为每个输入构造对应的语义表示。解码器负责以自回归的方式逐个生成输出序列中的元素。


    Transformer 的编码器由 6 个相同的层堆叠而成，每个层包含两个子层，分别是多头自注意力层和前馈神经网络层。其中，多头自注意力是 Transformer
    的核心，将在 4.2.3 节中对其进行详细介绍。此外，在两个子层中，Transformer 使用残差连接（Residual Connection）和层归一化（Layer
    Normalization，LN）机制进行性能优化。这样一来，编码器中每一层的输出可以表示为


    $$

    output = LayerNorm(X + SubLayer(X)) \quad (4-13)

    $$


    其中，X 表示输入，SubLayer 表示多头自注意力子层或者前馈神经网络子层，LayerNorm(·) 表示层归一化。


    此外，Transformer 的解码器也是由 6 个相同的层堆叠而成。与编码器中每层的两个子层不同的是，解码器的每层还包含第 3 个子层，第 3 个子层对编码器的输出进行多头自注意力计算。另外，与编码器中的多头自注意力子层（第
    1 个子层）不同的是，解码器中的第 1 个子层中的多头自注意力使用了掩码（Mask）操作，因此在解码过程中，解码器只可以看到已经生成的解码序列，对未来即将生成的单词，需要进行掩码。在解码器的三个子层中，同样使用残差连接和层归一化机制进行了性能优化。


    在接下来的小节中，对 Transformer 架构中的具体细节进行介绍，包括 Transformer 的输入编码、自注意力机制、多头自注意力机制和带有掩码操作的自注意力机制、Transformer
    中的残差连接、层归一化等。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_121_0.png)


