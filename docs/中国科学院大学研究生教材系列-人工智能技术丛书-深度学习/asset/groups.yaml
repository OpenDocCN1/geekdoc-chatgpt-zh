    \ 模块中包含了各种常用的神经网络结构，比如全连接层、激活函数层、卷积层和循环层等。最常用的模型定义方法之一是继承 nn.Module，建立一个包含权重、偏置等参数和前向传播方法的类，将该类实例化即可得到神经网络模型。其中定义前向传播的方法是\
    \ forward()，它的输出就是神经网络模型的输出。\n\n更多 PyTorch 的特点与功能，可以参考官方文档：https://pytorch.org/tutorials/。\n\
    \n### 8.3.3 PyTorch 编程示例\n\n基于 CIFAR10 数据集，使用 PyTorch 训练与测试图像分类模型的示例代码如下：\n\n\
    ```\nimport torch\nimport numpy as np\nfrom matplotlib import pyplot as plt\n\
