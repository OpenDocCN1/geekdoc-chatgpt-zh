    ![](img/57b180d92f84b0150a5b5e4fc7583b76_158_0.png)


    Yoshua Bengio ( 1964 ~ ), 蒙特利尔大学（University of Montreal）教授，英国皇家学会院士，加拿大皇家学会院士，2018
    年图灵奖获得者。他还是加拿大 Mila 实验室创始人和科学负责人，IVADO 实验室科学负责人，并获 2019 年 IEEE 计算智能分会神经网络先锋奖等奖项。


    Yoshua Bengio 教授分别于 1986 年、1988 年和 1991 年获麦吉尔大学（McGill University）计算机工程学士、计算机科学硕士和博士学位，1991～1992
    年在麻省理工学院从事博士后研究工作，1992～1993 年在贝尔实验室从事博士后研究工作，1993 年加入为蒙特利尔大学，2002 年任教授。


    Yoshua Bengio 教授的主要贡献包括：1）与 Dzmitry Bahdanau 等人一起提出了注意力机制，在神经机器翻译任务中取得了很好的效果，为
    Transformer 的提出打下了理论基础；2）基于 N-gram 统计语言模型思想，提出前馈神经网络语言模型，开创了统计语言模型的新篇章，之后循环神经网络语言模型、Transformer
    语言模型相继问世；3）与 Ian Goodfellow 一起提出了生成对抗网络，引发了 GAN 研究热潮；4）组织开发了早期深度学习框架 Theano，虽然
    Theano 目前已不再更新，但是也促进了其他深度学习框架的开发；5）与 Pascal Vincent 等人提出了降噪自编码器，可防止在原始数据上训练时产生过拟合。


    前面在 Yann LeCun 教授的介绍中提到，两人共同创办了表示学习领域的国际会议 ICLR（International Conference on Learning
    Representations），至今已举办 11 届，目前该会议已成为人工智能领域的顶级会议之一。


