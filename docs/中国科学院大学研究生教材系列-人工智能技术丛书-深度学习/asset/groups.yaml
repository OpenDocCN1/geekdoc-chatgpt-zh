    度前馈神经网络的网络参数，再加上一层 Softmax 层形成一个用于分类的深度前馈神经网络。同时，深度信念网络也可以用来对高维数据（如图像、文本等）进行降维，同样取得了很好的效果。自编码器及其变种也可以用来初始化前馈神经网络的参数，同时在数据压缩、表示学习、数据去噪、异常识别等领域也有很多应用。扩散模型自提出以后，在图像生成领域成了主流模型，同时它也可应用于自然语言处理、多模态建模和时间序列建模等领域。


