    # 6.4.2 深度信念网络


    深度信念网络（Deep Belief Network，DBN）[1] 与 Sigmoid 信念网络相似，但是最上面两层有些不同，DBN 的结构如图 6-6
    所示。图 6-6 所示为一个具有可见层 $x$ 和隐藏层 $h^1$、$h^2$ 和 $h^3$ 的 DBN。图 6-5 中 Sigmoid 信念网络的最顶层为可因式分解的先验概率
    $P(h^3)$，而图 6-6 中 DBN 中最上面两层是一个受限玻尔兹曼机 $P(h^2, h^3)$。RBM 是一个无向图模型，因此整个 DBN 模型是一个混合模型，包含
    $l$ 个隐藏层的 DBN 的联合概率为：


    $P(x, h^1, \cdots, h^l) = P(h^{l-1}, h^l) \prod_{k=1}^{l-2} P(h^k | h^{k+1}) P(x
    | h^1)$ (6-18)


    其中，最上面两层的联合分布 $P(h^{l-1}, h^l)$ 为 RBM 的概率分布。


