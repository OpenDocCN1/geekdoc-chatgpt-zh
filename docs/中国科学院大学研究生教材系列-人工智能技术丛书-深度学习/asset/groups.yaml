    ### 4.2.4 Transformer 中的其他细节


    如前文所述，Transformer 使用残差连接和层归一化方法进行模型的性能优化。具体来说，对于网络中的某个层，残差连接会将输入数据和输出数据相加，然后使用一个激活函数处理。这样一来，即使网络层数很深，信息也可以很容易地传递到后面的网络层中，从而有效解决了梯度消失问题。残差连接是深度学习中的一项重要技术，也是
    ResNet[4] 中的核心技术，在 2.4.5 节也已经介绍过，其结构如图 4-12 所示。残差网络通过从输入直接引入一个短连接到非线性层的输出，实现输入跨层。也就是说，残差连接是一种网络搭建方式，使用这种搭建方式的网络都可以称为残差网络。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_125_1.png)


    图 4-12 残差连接示意图[4]


    其次，Transformer 中与残差连接结合使用的是层归一化（Layer Normalization，LN）[5]，在每个注意力头的输出后，应用层归一化。层归一化的计算是针对每个样本的所有特征进行的，而不是针对每个特征或者每个批次进行的。具体来说，层归一化会计算某个网络层中所有特征的均值和方差，并将这些统计量用于标准化该层的输出。层归一化是一种简单有效的技术，用来帮助深度神经网络更好地学习特征表示，提高模型的性能和泛化能力。具体地，层归一化的计算如下：


    ```

    layernorm(u) = \frac{u - E(u)}{\sqrt{Var(u) + \varepsilon}}\gamma + \beta  (4-18)

    ```


    其中，u 表示层归一化的输入向量，E(u) 是向量的均值，Var(u) 是向量的方差，\varepsilon 是用来保证分母不为 0 的小数，\gamma
    和 \beta 是可学习参数。我们将在 7.7.2 节详细介绍层归一化。


    最后，如前文所述，在 Transformer 的编码器和解码器中，除了上述关键模块，每层都包含一个大家熟知的前馈神经网络，它由两个线性变换组成，中间由 ReLU
    激活函数进行激活，对应的计算公式如下：


    ```

    FFN(X) = max(0, XW_1 + b_1) W_2 + b_2  (4-19)

    ```


    其中， \(W_1\)、 \(W_2\) 是前馈神经网络的权重，\(b_1\)、\(b_2\) 是前馈神经网络的偏置。


    ### 4.2.5 基于 Transformer 的大规模预训练模型


    Transformer 能够并行处理较长的输入序列，这一优点吸引了大量研究人员的关注，基于 Transformer 的大规模预训练模型应运而生，它们使用 Transformer
    作为基础架构，广泛应用于自然语言处理领域。基于 Transformer 的大规模预训练模型通常是在大规模文本语料库上进行无监督学习而成，这种预训练方式使得模型能够学习到丰富的语义表示，继而应用到各项自然语言处理任务中，如
    OpenAI 的 GPT 系列、Google 的 BERT 系列，均已在机器翻译、文本摘要、情感分析、问答等多个自然语言处理任务中取得了优秀的实验结果，成为当前自然语言处理领域应用最广泛的大规模预训练模型。


    ## 4.3 GPT 系列模型


    生成式预训练 Transformer（Generative Pre-trained Transformer，GPT）是一种基于 Transformer 的自回归语言模型[6]，即模型能够迭代地根据已经生成的单词来逐个预测后面的单词。GPT
    由 OpenAI 公司在 2018 年提出，广泛应用于自然语言处理中的各项任务，如文本分类、文本蕴含、文本相似度计算和问答等。GPT 模型已经推出了多个版本，包括
    GPT-1[6]、GPT-2[7] 和 GPT-3[8] 等，它们不断刷新在各项自然语言处理任务上的最好实验结果，成为自然语言处理领域的标志性模型。下面对
    GPT 系列模型中的代表性工作进行介绍。


    ### 4.3.1 GPT-1


    自然语言理解包括多种不同的任务，如文本分类、文本蕴含、语义相似度计算和问答等。尽管大型未标记文本语料库很丰富，但是用于学习特定任务的标记文本语料库数量很少，这为训练特定任务对应的模型带来了挑战。GPT-1
    模型[6] 提出在大规模未标记语料库上训练生成式语言模型，并在下游任务上进行微调以提升下游任务的性能，减轻模型对标记数据的依赖。


    GPT-1 采用无监督预训练和监督微调相结合的方式，目标是学习一个通用表示，并将其迁移到更广泛的应用上去。在模型架构上，GPT-1 基于 Transformer
    构造，这是因为与其他卷积神经网络或者循环神经网络相比，Transformer 提供了效率更高的方法来处理文本中的长期依赖关系。接下来，介绍 GPT-1 中的两个阶段：无监督预训练和有监督微调。


    - 1. 无监督预训练：


    给定一个无监督的语料数据集 \(U = \{u_1, u_2, \cdots, u_n\}\)，GPT-1 使用标准的语言模型进行训练，也就是最大化如下似然估计：


    ```

    $L_1(U) = \sum_i logP(u_i | u_{i-k}, \cdots, u_{i-1}; \theta)$ (4-20)

    ```


    其中，\(k\) 表示上下文窗口的大小，\(P\) 表示条件概率，\(\theta\) 是网络的参数，采用梯度下降法进行训练。


    GPT-1 使用一个多层 Transformer 解码器进行语言建模，该模型对输入上下文使用多头自注意力机制，然后使用前馈神经网络预测目标单词的概率分布，建模过程如下：


    ```

    h_0 = UW_e + W_p (4-21)

    h_l = transformer_block(h_{l-1}) (4-22)

    P(U) = softmax(h_n W_e^T) (4-23)

    ```


    其中， \(W_e\) 是一个单词向量矩阵，\(W_p\) 是位置向量矩阵，\(U\) 表示输入文本的上下文向量，\(n\) 是网络层数。


    - 2. 有监督微调阶段


    在使用上述方法进行预训练后，GPT-1 采用有监督微调方法将参数调整到更适合下游任务的状态。假设现在有某个有标记的样本集 \(C\)，其中每个样本由一系列的输入单词
    \(\{x^1, x^2, \cdots, x^m\}\) 和一个标签 \(y\) 组成，那么输入单词序列首先被送入在前一个阶段预训练好的模型中得到一个状态向量
    \(h_t^m\)，接着被送入一个线性层进行结果预测：


    ```

    P(y | x^1, x^2, \cdots, x^m) = softmax(h_t^m W_y) (4-24)

    ```


    基于此，有监督微调阶段的目标函数就是：


    ```

    L_2(C) = \sum_{(x,y)} log P(y | x^1, x^2, \cdots, x^m) (4-25)

    ```


    与此同时，GPT-1 的设计人员发现，在有监督微调阶段将语言模型作为微调的辅助目标能够进一步提升模型的泛化能力，并且可以加速收敛帮助学习。最终，在有监督微调阶段，模型的训练目标变为


    ```

    L_3(C) = L_2(C) + \lambda * L_1(C) (4-26)

    ```


    其中 \(\lambda\) 是权重系数。


    - 3. 任务适应


    对于类似文本分类的任务，可以按照上述有监督微调阶段所提到的方法进行微调，但是像问答、文本蕴含等自然语言理解任务，则需要在输入阶段进行相应的设计和修改，才可以将
    GPT 模型进行应用，如图 4-13 所示。


    在微调阶段，所有任务的输入都增加了特殊的 Token 作为输入的开始 `[start]` 和结束 `[extract]`。此外，对于文本蕴含任务，设计者将前提和假设进行拼接，然后在二者之间增加了一个特殊标记
    “Delim”；对于文本相似度计算任务，由于被计算相似度的两个句子之间没有前后顺序关系，所以对同一数据进行了不同顺序的拼接，最后使用线性化得到相似度得分。特别地，输入时两个句子之间增加了特殊标记
    “Delim”，用来区分前后两个句子。对于多项选择的问答任务，将每个候选答案与问题和原文片段进行拼接，得到相应的向量表示，最后使用 Softmax 函数在候选答案范围中进行结果概率预测。


    在模型实现细节上，GPT-1 很大程度上遵循了原始的 Transformer 工作模式，训练了一个具有掩码自注意力机制的 12 层仅包含解码器的 Transformer。对于前馈神经网络，使用了
    3072 维的内部状态，使用最大学习率为 \(2.5 \times 10^{-4}\) 的 Adam 优化方案（Adam 优化方法可查阅 7.9.2 节）。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_128_0.png)


    图 4-13 GPT-1 模型内部结构（详见彩插）


    对于 GPT 系列模型，无监督训练过程中数据的规模和清洁度也是非常重要的。GPT-1 模型在无监督训练阶段采用 BooksCorpus 数据集，这个数据集包含各种风格的
    7000 多本在当时尚未出版的图书数据，主题类型包括冒险、奇幻等。至关重要的是，它包含连续的长文本。另一个数据集是 Word Benchmark 数据集。


    GPT-1 在 12 个自然语言理解任务中的 9 个任务上达到了当时最好的实验结果，比如，在常识推理和问答任务上实现了 8.9% 的绝对改进，在文本蕴含任务上实现了
    1.5% 的绝对改进。


    ## 4.3.2 GPT-2


    GPT-2 在 GPT-1 的基础上进行了更通用的迁移方法探索[7]，证明了语言模型可以在零样本（Zero-Shot）情况下执行下游任务，而不需要任何参数或者架构的修改。GPT-2
    的设计者认为，通用的系统应该具备执行不同任务的能力。因此，除了输入之外，一个通用的系统还应该以要执行的任务作为条件。因此，GPT-2 的建模目标被定义为求
    p（output | input，task），这种方法早已在多任务学习和元学习中使用过，任务调节通常在架构级别实现，比如为任务设计特定的编码器或者解码器等。但是
    GPT-2 提供了一种更为灵活和通用的形式来指定任务、输入和输出，避免了算法级别的任务定制。如在机器翻译任务中，模型的输入可以被设定为“请翻译为法语、英语原文内容、对应法语内容”；在机器阅读理解任务中，训练样本可以被写成“问题的答案、问题、原文、答案”。GPT-2
    的思想本质上就是早期的指令微调（Prompt Finetuning）方法，这种方法可以使得模型学习在遇到类似的提示语后，应该输出什么样的内容。


    为了支持多个零样本任务，GPT-2 需要在预训练阶段学习尽可能丰富的数据，因此 OpenAI 自建了高质量的 WebText 数据集，只保留了人工过滤过的网页，最终包含
    4500 万个链接。在模型实现上，GPT-2 仍然使用 Transformer 作为主干模型，与 GPT-1 的整体架构类似，只进行了少量修改，包括层归一化被移到每个块的输入部分，起到类似预激活的作用，在最终的自注意力块后又增加了额外的层归一化，同时
    Transformer 的 Decoder 层数从 GPT-1 的 12 层增加到了 24 层、36 层和 48 层。


    实验中发现，各种大小的 GPT-2 模型开始都处于欠拟合状态，但是随着训练时间的增加，在验证集上的效果可以持续提升，在大多数的零样本任务上取得了当时最好的实验结果。


    ## 4.3.3 GPT-3


    GPT-3[8] 的主要目标是使用更少的领域数据，且不经过微调去解决问题。它沿用 GPT-2 的模型和训练方法，将模型参数大小从 GPT-2 的 15 亿个升级到
    1750 亿。GPT-3 主要探索了语言模型的上下文学习（In-Context Learning）能力，这种能力是指预训练模型以自然语言指令和任务的几个样本作为条件，然后通过预测接下来发生的事件来完成任务。在几十个自然语言处理数据集上对
    GPT-3 进行了评估，如图 4-14 所示包括三种设置：1）零样本学习（Zero-Shot Learning）。不允许展示具体的任务样本，只告知模型自然语言表示的指令。2）单样本学习（One-Shot
    Learning）。只允许向模型展示一个样本。3）小样本学习（Few-Shot Learning）。允许尽可能多地向模型展示样本（大概在 10～100 个之间）。


    在开发 GPT-3 的过程中，研究人员发现，模型增大后引入一些质量较差的数据带来的负面影响变小了，因此与 GPT-1 和 GPT-2 相比，GPT-3 开始使用
    Common Crawl 数据集进行训练。最终，它结合了清洗好的 Common Crawl 数据和已有的高质量数据，使用了超过 45TB 的文本数据作为训练数据，并进行了不同权重的采样使用。


    GPT-3 在零样本学习和单样本学习中取得了很好的实验结果，并且在小样本学习中展现出了与其他优秀模型相媲美的能力。


    | 设置 | 说明 | 输入示例 |

    |------|------|----------|

    | 零样本 | 给定任务相关的自然语言描述，模型预测答案。梯度不进行更新 | Translate English to French<br>Cheese=>
    |

    | 单样本 | 除了任务描述之外，模型能够看到一个任务的具体样例。梯度不进行更新 | Translate English to French<br>Sea
    otter=>loutre de mer<br>Cheese=> |

    | 小样本 | 除了任务描述之外，模型能够看到多个任务的具体样例。梯度不进行更新 | Translate English to French<br>Sea
    otter=>loutre de mer<br>peppermint=>menthe<br>poivre<br>Cheese=> |


    图 4-14 GPT3 模型评估示意图


    ### 4.3.4 InstructGPT 和 ChatGPT


    在之前的 GPT 系列模型中，给定任务的一些示例作为输入，GPT 系列模型可以通过 “提示” (Prompt) 来执行自然语言处理领域的相关任务。然而仅仅依靠这些示例，模型通常会产生一些负面的输出，比如产生与原文事实不符的、不遵循用户指令或者有偏见的文本内容。因此，OpenAI
    研究如何提升 GPT 模型的性能使其生成更加符合用户指令的文本内容，如开始尝试训练能够与用户意图对齐的语言模型。


    具体来说，研究人员尝试使用基于人类反馈的强化学习方法来微调 GPT-3 模型，即以人类的偏好作为奖励信号来微调 GPT 模型。为了获得人类反馈，OpenAI
    聘请人员进行数据标记，评价 GPT 模型生成的文本。在初步获得人类反馈后，使用这部分的数据进行 GPT 系列模型的有监督训练。然后，在使用小部分数据进行模型优化后，将更多的输出数据进行偏好标记。最后，使用这个更大规模的带有偏好标记的数据对语言模型进一步微调以最大化人工奖励，图
    4-15 展示了这个过程，这个过程得到的模型被称为 InstructGPT[9]。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_130_0.png)


    图 4-15 InstructGPT 模型工作流程图


    在 InstructGPT 中，基于人类反馈的强化学习（Reinforcement Learning from Human Feedback，RLHF）过程如下：


    - 1) 通过人工手写或者 OpenAI 的 API 请求收集一批 Prompt，对于这些 Prompt，人工手写期望的答案，用这些 Prompt 和对应的答案作为数据，实现
    GPT 模型的有监督微调。


    - 2) 使用微调后的模型，根据更多的 Prompt 生成答案，一次 Prompt 多次采样生成多个答案，然后请人工标注生成内容的相对顺序，根据这些带有顺序的
    Prompt 和答案数据训练一个奖励模型，模型能够根据输入的 Prompt 和答案输出一个得分。


    - 3) 采样更多的 Prompt，采用强化学习的方式不断优化生成模型，在强化学习中，使用 2) 得到的奖励模型为生成内容打分。


    在这个过程中，2) 和 3) 是一个持续迭代的过程。


    InstructGPT 首先使用有监督学习在标签上微调 GPT3，然后训练一个奖励模型来获取提示、响应和对应的奖励。在这个过程中的奖励模型（Reward Model）是一个有监督的微调模型，输入是
    Prompt 和生成的答案内容，输出一个标量作为打分结果，奖励模型的损失函数如下：


    \(\text{loss}(\boldsymbol{\theta}) = -\frac{1}{\binom{K}{2}} E_{(x, y_w, y_l)
    \sim D} [\log(\sigma(r_{\theta}(x, y_w) - r_{\theta}(x, y_l)))] \tag{4-27}\)


    其中，\(K\) 是模型生成的答案的个数，\(r_{\theta}(\boldsymbol{x}, \boldsymbol{y})\) 是提示 \(\boldsymbol{x}\)
    和生成 \(\boldsymbol{y}\) 对应的奖励标量输出，\(\boldsymbol{\theta}\) 是参数，\(\boldsymbol{y}_w\)
    表示 \((\boldsymbol{y}_t, \boldsymbol{y}_w)\) 模型所生成的序列中的偏好输出。OpenAI 聘请的标注人员对 \(K\)
    个模型生成的答案进行排序，目标函数的意义是使得奖励模型与人工标注的答案相对顺序一致。


    接下来，使用强化学习并利用奖励模型在环境中微调 GPT 模型，给定提示和响应，它产生由奖励模型确定的奖励得分，在强化学习的训练中，InstructGPT 尝试最大化以下组合目标函数：


    \(\text{obj}(\theta) = E_{(x, s) \sim D^{\text{RL}}_{\pi_{\theta}^{\text{RL}}}}
    \left[ r_{\theta}(x, y) - \beta \log \left( \frac{\pi_{\theta}^{\text{RL}}(y \mid
    x)}{\pi^{\text{SFT}}(y \mid x)} \right) \right] + \gamma E_{(s) \sim D_{\text{pretrain}}}
    [\log(\pi_{\theta}^{\text{RL}}(x))] \tag{4-28}\)


    其中，\(\pi_{\theta}^{\text{RL}}\) 是强化学习策略，\(\pi^{\text{SFT}}\) 是有监督训练的模型，\(D_{\text{pretrain}}\)
    是数据的预训练分布。\(\beta\) 是 KL（KL 散度距离）奖励系数，\(\gamma\) 是预训练损失系数。


    ChatGPT 是目前影响最大的 GPT 模型，它在人机对话领域超过了以往任何一个对话模型，取得了令人振奋的成绩。ChatGPT 的工作模式与 InstructGPT
    大致相似，只是使用的数据集有些区别。OpenAI 目前尚未公布 ChatGPT 的详细技术细节，官方发布的博客中的大致描述是 ChatGPT 使用了对话精调的方式，即多轮
    Prompt 和上下文，在训练 InstructGPT 模型中用到的数据集也被转换成对话的形式合并使用。基于反馈的强化学习方法仍然被使用。


    ## 4.4 BERT 系列模型


    纯 Encoder 模型只使用 Transformer 中的 Encoder 部分，也就是说，在这类模型中，注意力机制可以访问到原始输入句子中的所有单词。基于
    Transformer 的双向编码器表示模型（Bidirectional Encoder Representations from Transformer，BERT）[10]
    就是一种基于 Transformer 的纯 Encoder 模型，2018 年由 Google 公司的 Jacob Devlin 等人提出，广泛应用于自然语言处理领域的各种任务，比如句子分类、句子相似度计算、自然语言推理、命名实体识别、基于机器阅读

