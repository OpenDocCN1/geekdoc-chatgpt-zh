    \ Tensor 的所有操作；相反地，停止对 Tensor 的跟踪可以用 detach() 来实现。Tensor 被封装为 Variable 后，即可调用\
    \ backward() 自动计算所有梯度，实现深度学习中最关键的反向传播算法。\n\n- (2) autograd.Function 类\n\n支持开发者自定义求导方式。Tensor\
    \ 和 Function 相互连接，共同构建一个非循环图，Tensor 相当于图中的节点，Function 相当于图中的边，该图能够保存完整的计算过程中的历史信息。Function\
    \ 在本质上相当于对 PyTorch 的自定义扩展，使其满足开发者的具体需求，从而为模型设计提供了更大的灵活性。\n\nPyTorch 提供了多种不同的库来支持不同类型的数据输入，如\
    \ PyTorch 图形库 torchvision 包含了常用的图形变换操作和计算机视觉模型，音频库 torchaudio 提供了各种音频采样和波形分析方法，文本预处理库\
    \ torchtext 提供了各种针对原始语料的预处理方法等。\n\nPyTorch 的神经网络模型构建可以基于 torch.nn 实现。torch.nn\
    \ 模块中包含了各种常用的神经网络结构，比如全连接层、激活函数层、卷积层和循环层等。最常用的模型定义方法之一是继承 nn.Module，建立一个包含权重、偏置等参数和前向传播方法的类，将该类实例化即可得到神经网络模型。其中定义前向传播的方法是\
    \ forward()，它的输出就是神经网络模型的输出。\n\n更多 PyTorch 的特点与功能，可以参考官方文档：https://pytorch.org/tutorials/。\n\
    \n### 8.3.3 PyTorch 编程示例\n\n基于 CIFAR10 数据集，使用 PyTorch 训练与测试图像分类模型的示例代码如下：\n\n\
    ```\nimport torch\nimport numpy as np\nfrom matplotlib import pyplot as plt\n\
    from torch.utils.data import DataLoader\nfrom torchvision import transforms\n\
    from torchvision import datasets\nimport torch.nn.functional as F\n\n# 定义超参数：\n\
    # 数据批量大小 batch_size、学习率 learning_rate、动量法优化器参数 momentum、训练轮数 EPOCH\nbatch_size\
    \ = 64\nlearning_rate = 0.01\nmomentum = 0.5\nEPOCH = 10\n\n# 数据集预处理：调整图片大小，转换为张量数据形式，再对张量数据进行标准化处理，使其\n\
    # 更好地响应激活函数，提升学习效果\ntransform = transforms.Compose([\n    transforms.Resize(32),\n\
    \    transforms.ToTensor(),\n    transforms.Normalize((0.5, 0.5, 0.5), (0.5, 0.5,\
    \ 0.5))])\n\n# 加载数据集：按照 PyTorch 的格式要求，在指定存储路径和数据集预处理方法的情况下，从\n# torchvision 包中加载预设好的\
    \ CIFAR10 图像分类数据集，分为训练集和测试集\ntrain_dataset = torchvision.datasets.CIFAR10(root\
    \ = PATH, train = True, transform=transform, download=True)\ntrain_loader = DataLoader(dataset\
    \ = train_dataset, batch_size = batch_size, shuffle=True)\ntest_dataset = torchvision.datasets.CIFAR10(root\
    \ = PATH, train = False, transform=transform, download=True)\ntest_loader = DataLoader(dataset=test_dataset,\
    \ batch_size=batch_size, shuffle=False)\n# 定义类别\nclasses = ['airplane', 'automobile',\
    \ 'bird', 'cat', 'deer', 'dog', 'frog',\n'horse', 'ship', 'truck']\n```\n\n###\
    \ 构造网络结构\n\n网络结构共包含两个卷积层、两个池化层和三个全连接层。卷积层的卷积核大小均为 5×5，图像通道数从 3 增加到 6,再增加到 16,且卷积层不对图像进行填充,步长默认为\
    \ 1;每个卷积层后都紧跟一个池化核大小为 2×2、步长为 2 的最大池化层;全连接层承接第二个池化层,将经过卷积层和池化层处理、并被展平后的中间结果用连续的三个全连接层进行映射,最终得到数据长度为\
    \ 10 的输出,对应于 10 种不同的分类结果\n\n```\nclass CNN(nn.Module):\n\n    def __init__(self):\n\
    \        super(CNN, self).__init__()\n        self.conv1 = nn.Conv2d(3, 6, 5)\n\
    \        self.pool = nn.MaxPool2d(2, 2)\n        self.conv2 = nn.Conv2d(6, 16,\
    \ 5)\n        self.fc1 = nn.Linear(16 * 5 * 5, 120)\n        self.fc2 = nn.Linear(120,\
    \ 84)\n        self.fc3 = nn.Linear(84, 10)\n```\n\n### 定义模型前向计算函数\n\n原始输入依次经过两个卷积层和池化层。在展平后送入全连接层。得到最终输出,其中所有的卷积层输出结果和全连接层输出结果都使用\
    \ ReLU 激活函数进行处理\n\n```\ndef forward(self, x):\n    x = self.pool(F.relu(self.conv1(x)))\n\
    \    x = self.pool(F.relu(self.conv2(x)))\n    x = x.view(-1, 16 * 5 * 5)\n  \
    \  x = F.relu(self.fc1(x))\n    x = F.relu(self.fc2(x))\n    x = self.fc3(x)\n\
    \    return x\n```\n\n### 实例化模型\n\n```\nmodel = CNN()\n```\n\n### 构造损失函数和优化器\n\
    \n损失函数采用交叉熵损失函数,优化器采用随机梯度下降法\n\n```\ncriterion = torch.nn.CrossEntropyLoss()\n\
    ```\n\n```\noptimizer = torch.optim.SGD(model.parameters(), lr=learning_rate,\
    \ momentum=momentum)\n```\n\n### 定义模型训练函数\n\n按照超参数预设的训练轮次和加载好的训练集和测试集进行模型训练,用模型对训练集的每批次数据进行训练,根据模型输出结果计算损失值,再调用.backward()方法实现反向传播,在此基础上调用优化器的.step()方法对模型进行优化。训练过程中,记录每一训练轮次的模型准确率并输出,以便观察模型的训练过程\n\
    \n```\ndef train(epoch):\n    running_loss = 0.0\n    running_total = 0\n    running_correct\
    \ = 0\n    for batch_idx, data in enumerate(train_loader, 0):\n        inputs,\
    \ target = data\n        # 将模型的参数梯度初始化为 0,保证每批次数据计算得到的梯度相互独立\n        optimizer.zero_grad()\n\
    \        outputs = model(inputs)\n        loss = criterion(outputs, target)\n\
    \        loss.backward()\n        optimizer.step()\n        # 保存该批次数据的损失值和预测结果,用于统计训练集上的模型准确率\n\
    \        running_loss += loss.item()\n        _, predicted = torch.max(outputs.data,\
    \ dim=1)\n        running_total += inputs.shape[0]\n        running_correct +=\
    \ (predicted == target).sum().item()\n        # 打印损失和准确率\n        if batch_idx\
    \ % 200 == 199:\n            print('[%d, %5d]: loss: %.3f , acc: %.2f %% ' % (epoch\
    \ + 1, batch_idx + 1,\n                  running_loss / 300, 100 * running_correct\
    \ / running_total))\n            running_loss = 0.0\n            running_total\
    \ = 0\n            running_correct = 0\n```\n\n### 模型测试函数\n\n将训练后的模型在测试集上进行测试,得到测试准确率\n\
    \n```\ndef test():\n    correct = 0\n    total = 0\n    with torch.no_grad():\n\
    \        for data in test_loader:\n            images, labels = data\n       \
    \     outputs = model(images)\n            _, predicted = torch.max(outputs.data,\
    \ dim=1)\n            total += labels.size(0)\n            correct += (predicted\
    \ == labels).sum().item()\n    acc = correct / total\n    print('[%d / %d]: Accuracy\
    \ on test set: %.1f %%' % (epoch + 1, EPOCH, 100 * acc))\n    return acc\n```\n\
    \n### 执行训练与测试\n\n```\nif __name__ == '__main__':\n    acc_list_test = []\n   \
    \ for epoch in range(EPOCH):\n        train(epoch)\n        acc_test = test()\n\
    \        acc_list_test.append(acc_test)\n```\n\n### 绘制模型准确率变化曲线\n\n```\nplt.plot(acc_list_test)\n\
    plt.xlabel('Epoch')\nplt.ylabel('Accuracy On TestSet')\nplt.show()\n```\n\n##\
    \ 8.4 飞桨\n\n### 8.4.1 飞桨简介\n\n飞桨是百度公司开发的开源深度学习框架[3]，其英文名为 PaddlePaddle，前身是 2013\
    \ 年百度公司自主研发的深度学习平台。在 2016 年 9 月 1 日的百度世界大会上，时任百度首席科学家的吴恩达（Andrew Ng）宣布将 PaddlePaddle\
    \ 对外开源，2019 年正式确定其中文名称为“飞桨”。飞桨的官方网站：https://www.paddlepaddle.org.cn/。Github 主页：https://github.com/PaddlePaddle/Paddle/。\n\
