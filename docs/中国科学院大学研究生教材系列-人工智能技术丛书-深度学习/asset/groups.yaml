    把深度学习在计算机视觉领域的应用分为两大类：基础任务和高级任务。基础任务是指一些偏基础性、通用性的任务；高级任务是指一些偏应用性的任务，它们一般需要基于基础任务来完成。


    计算机视觉领域的基础任务主要包括：1）图像分类。整幅图像的分类，如手写数字识别、猫狗分类等。2）目标检测。检测图像或视频中物体的位置并识别物体类别，如行人检测、车辆检测等。3）图像分割。将图像中的物体按边缘进行分割并识别物体类别或个体，图像分割通常又分为语义分割与实例分割，语义分割是像素级别上的分类，实例分割在语义分割的基础上识别个体，如街景分割、细胞分割等。4）图像回归。预测图像中物体或者物体组成部分的坐标，如人脸中的关键点检测、人体关键点检测等。


    计算机视觉领域的高级任务主要包括：1）人脸识别。首先通过目标检测提取人的正脸，之后使用卷积神经网络提取人脸的有效特征，进而识别该人脸对应人员的身份。2）行人重识别。首先通过目标检测检测出行人，之后通过卷积神经网络提取人体的有效特征，包括穿着、骨架甚至步态等，进而识别该行人的身份。3）目标跟踪。结合目标检测算法和跟踪算法在连续的视频帧中定位某一行人或者其他运动目标。4）动作识别。识别视频中人体的动作/行为，一般分为基于双流的方法和基于人体关键点的方法。5）缺陷检测。通过深度学习方法识别工业产品中的缺陷，如紧固件缺失检测、建筑缺陷检测和金属表面缺陷检测等。当然，高级任务还有很多，这里就不一一列举了。


    # 1. 4. 2 深度学习在语音处理领域的应用


    深度学习在语音处理领域也取得了丰富的成果，与传统的语音处理技术相比，在识别准确率等指标上都有很大提升。深度学习在语音处理领域的应用主要有三大类：语音识别、声纹识别和语音合成。


    语音识别是指将人类说话的语音转换成文字，基本流程如下：1）首先对训练集中的语音信号进行预处理和特征提取，并训练声学模型；2）通过训练大量语料，学习词与词之间的序列关系，获得语言模型；3）对测试语音进行预处理和特征提取，计算声学模型得分与语言模型得分；4）将总得分最高的词序列作为识别结果。


    声纹识别是指根据说话人的声波特性进行身份识别，又称为说话人识别，基本流程如下：1）首先对训练集中的语音信号进行预处理和特征提取，并训练声纹模型；2）对测试语音进行预处理和特征提取，基于声纹模型进行分类，获得识别结果。


    语音合成是指将文本转换为语音的技术，基本流程如下：1）文本处理。首先进行文本语种判断与文本切分，之后根据文字拼音将文字转换为音素，并进行停顿、重读、轻读等文字韵律预测。2）语音分析。传统的语音合成技术主要通过波形拼接的方法，但是这种方法的缺点是语音过度生硬、不自然，而深度学习方法目前已经成为语音合成领域的主流方法，主要采用的是端到端的语音合成技术，也就是在训练所得语音合成模型的基础上，输入文本，输出就是相应的语音。'
