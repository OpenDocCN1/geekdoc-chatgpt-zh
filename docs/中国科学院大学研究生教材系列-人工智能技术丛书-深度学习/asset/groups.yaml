    t \sim p_{data}} [\log (1 - D(G(s_0, \hat{c}), \varphi_t))]$ （5-12）


    $L_G = E_{s_0 \sim p_{G_0}, t \sim p_{data}} [\log (1 - D(G(s_0, \hat{c}), \varphi_t))]
    + \lambda D_{KL}(\mathcal{N}(\mu(\varphi_t), \Sigma(\varphi_t)) \|\mathcal{N}(0,
    I))$ （5-13）


