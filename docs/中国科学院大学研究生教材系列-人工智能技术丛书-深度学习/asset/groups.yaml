    \ \\log \\tilde{x}_i + (1-x_i) \\log (1-\\tilde{x}_i))\\) (6-27)\n\n### 6.6.2\
    \ 降噪自编码器\n\n2008 年，Pascal Vincent 等人提出了降噪自编码器（Denoising AutoEncoder，DAE）[9]，它主要是为了防止在原始数据上进行训练时产生过拟合，在原始数据中加入一些噪声来训练自编码器，希望它仍然能够重构出原始数据。在训练去噪自编码器前，首先需要构建噪声数据，通常通过在原始数据\
    \ \\(\\boldsymbol{x}=(x_1, x_2, \\cdots, x_n)\\) 中加入一些随机噪声 \\(\\boldsymbol{\\\
    epsilon}\\) 来构建，常用的构建方式是使用高斯分布：\n\n\\(x' \\sim \\mathcal{N}(x, \\sigma^2 I)\\\
    ) (6-28)\n\n之后，将加入高斯随机噪声得到的数据 \\(x' = (x'_1, x'_2, \\cdots, x'_n)\\) 作为去噪自编码器的输入，通过编码为隐向量\
    \ \\(z = (z_1, z_2, \\cdots, z_m)\\) 并解码为输出 \\(\\tilde{x} = (\\tilde{x}_1, \\\
    tilde{x}_2, \\cdots, \\tilde{x}_n)\\)，使之与原始输入 \\(x = (x_1, x_2, \\cdots, x_n)\\\
    ) 尽可能地接近。去噪自编码器的结构如图 6-12 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_197_0.png)\n\
    \n去噪自编码器与自编码器一样，也常采用均方误差损失函数与交叉熵损失函数，这里不再赘述。\n\n### 6.6.3 稀疏自编码器\n\n为了实现输入的压缩表示，自编码器的中间层神经元数量一般都要小于输入层的神经元数量，如果中间层神经元的数量过少，可能会造成一些输入特征的丢失，往往无法重构原始输入，而中间层的神经元数量过多，又可能造成输入特征表达的冗余。为了解决这一问题，Andrew\
    \ Ng 提出了稀疏自编码器（Sparse AutoEncoder，SAE）[10]，在自编码器损失函数的基础上引入了正则化项，如下所示：\n\n\\(L_{SAE}\
    \ = L_{AE} + \\Omega(\\theta)\\) (6-29)\n\n引入正则化项后，使用中间层的少数神经元就能够表达输入的压缩表示，并能够重构原始输入。稀疏自编码器中的正则化项采用\
    \ KL 散度来表示，如果损失函数采用均方误差函数，那么稀疏自编码器的损失函数为\n\n\\((L_{SAE})_{MSE} = \\frac{1}{n}\
    \ \\sum_{i=1}^n |x_i - \\tilde{x}_i|^2 + \\beta \\sum_{j=1}^n KL(\\rho \\| \\\
    hat{\\rho}_j)\\) (6-30)\n\n其中 \\(\\beta\\) 是控制 KL 散度的权重参数，\\(m\\) 表示中间层神经元的数量，\\\
    (\\rho\\) 表示中间层神经元平均激活度的目标值（使得神经元在多数情况下都不激活），\\(\\hat{\\rho}_j\\) 表示中间层第 \\(j\\\
    ) 个神经元的激活度，计算公式为\n\n\\[ \\hat{\\rho}_j = \\frac{1}{n} \\sum_{i=1}^n f(w_j x_i\
    \ + b_j) \\]\n\n\\(KL(\\rho \\parallel \\hat{\\rho}_j)\\) 表示 KL 散度，它反映了平均激活度和目标值的差异，计算公式为\n\
    \n\\[ KL(\\rho \\parallel \\hat{\\rho}_j) = \\rho \\log(\\frac{\\rho}{\\hat{\\\
    rho}_j}) + (1-\\rho)\\log(\\frac{1-\\rho}{1-\\hat{\\rho}_j}) \\]\n\n与自编码器一样，稀疏自编码器同样采用反向传播算法来进行训练，惩罚项的梯度为\n\
    \n\\[ \\frac{\\partial}{\\partial \\theta}(\\beta \\sum_{j=1}^m KL(\\rho \\parallel\
    \ \\hat{\\rho}_j)) = \\beta \\frac{\\partial}{\\partial \\hat{\\rho}_j} KL(\\\
    rho \\parallel \\hat{\\rho}_j) \\frac{\\partial \\hat{\\rho}_j}{\\partial \\theta}\
    \ = (-\\frac{\\rho}{\\hat{\\rho}_j} + \\frac{1-\\rho}{1-\\hat{\\rho}_j}) \\frac{\\\
    partial \\hat{\\rho}_j}{\\partial \\theta} \\]\n\n其中 \\(\\theta\\) 表示稀疏自编码器要学习的所有参数，如权重和偏置等。\n\
    \n### 6.6.4 深度自编码器\n\n深度自编码器（Deep AutoEncoder，DAE）由 Geoffrey Hinton 等人于 2006 年提出[3]，当时用它来进行降维。深度自编码器由两个对称的深度信念网络构成，编码器通常由\
    \ 4~5 个隐藏层组成，与之对称地，解码器也是由 4~5 个隐藏层组成，这里的隐藏层一般指的是受限玻尔兹曼机，如图 6-13 所示。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_198_0.png)\n\
    \n图 6-13 深度自编码器\n\n深度自编码器的训练过程如下所示。\n\n- 预训练一个 DBN：采用贪心逐层堆叠 RBM 的方式进行预训练，从而获得各层权重的初始值。以图像输入为例的一个\
    \ DBN 的预训练如图 6-14a 所示。\n- 使用预训练好的 DBN 来构造深度自编码器：其中编码器直接使用预训练好的 DBN，权重也是预训练好的 DBN\
    \ 的权重；解码器将预训练好 DBN 进行翻转，从而与编码器形成对称结构，解码器的权重是对预训练好的 DBN 权重进行转置而来，如图 6-14b 所示。\n\
    - 对构造的深度自编码器进行有监督微调：使用反向传播算法对深度自编码器进行微调，从而获得最终的权重值，如图 6-14c 所示。\n"
