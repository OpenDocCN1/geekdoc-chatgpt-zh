    Pi_{i=1}^T q(x_t|x_{t-1}), p_\\theta(x_{0:T}) = p_\\theta(x_T) \\Pi_{i=1}^T p_\\\
    theta(x_{i-1}|x_i) \\)，代入公式 (6-59) 可进一步推导导出：\n\n\\( L_{\\text{VLB}} = E_{q(x_{0:T})}\
    \ \\left[ \\log \\frac{q(x_{1:T}|x_0)}{p_\\theta(x_{0:T})} \\right] = E_{q(x_{0:T})}\
    \ \\left[ \\log \\frac{\\Pi_{i=1}^T q(x_t|x_{i-1})}{p_\\theta(x_T) \\Pi_{i=1}^T\
    \ p_\\theta(x_{i-1}|x_i)} \\right] = E_{q(x_{0:T})} \\left[ -\\log p_\\theta(x_T)\
    \ + \\sum_{i=1}^T \\log \\frac{q(x_i|x_{i-1})}{p_\\theta(x_{i-1}|x_i)} \\right]\
    \ = E_{q(x_{0:T})} \\left[ -\\log p_\\theta(x_T) + \\sum_{i=2}^T \\log \\frac{q(x_i|x_{i-1})}{p_\\\
    theta(x_{i-1}|x_i)} + \\log \\frac{q(x_1|x_0)}{p_\\theta(x_0|x_1)} \\right] =\
    \ E_{q(x_{0:T})} \\left[ -\\log p_\\theta(x_T) + \\sum_{i=2}^T \\log \\left( \\\
    frac{\\underbrace{q(x_{i-1}|x_i, x_0)q(x_i|x_0)}_{\\text{由公式 (6-44)}}}{p_\\theta(x_{i-1}|x_i)q(x_{i-1}|x_0)}\
    \ \\right) + \\log \\frac{q(x_1|x_0)}{p_\\theta(x_0|x_1)} \\right] \\)\n\n\\(\
    \ = E_{q(x_{0:T})} \\left[ - \\log p_{\\theta}(x_T) + \\sum_{t=2}^T \\log \\frac{q(x_{t-1}\
    \ | x_t, x_0)}{p_{\\theta}(x_{t-1} | x_t)} + \\sum_{t=2}^T \\log \\frac{q(x_t\
    \ | x_0)}{q(x_{t-1} | x_0)} + \\log \\frac{q(x_1 | x_0)}{p_{\\theta}(x_0 | x_1)}\
    \ \\right] = E_{q(x_{0:T})} \\left[ - \\log p_{\\theta}(x_T) + \\sum_{t=2}^T \\\
    log \\frac{q(x_{t-1} | x_t, x_0)}{p_{\\theta}(x_{t-1} | x_t)} + \\log \\prod_{t=2}^T\
    \ \\frac{q(x_t | x_0)}{q(x_{t-1} | x_0)} + \\log \\frac{q(x_1 | x_0)}{p_{\\theta}(x_0\
    \ | x_1)} \\right] = E_{q(x_{0:T})} \\left[ - \\log p_{\\theta}(x_T) + \\sum_{t=2}^T\
    \ \\log \\frac{q(x_{t-1} | x_t, x_0)}{p_{\\theta}(x_{t-1} | x_t)} + \\log \\frac{q(x_T\
    \ | x_0)}{q(x_1 | x_0)} + \\log \\frac{q(x_1 | x_0)}{p_{\\theta}(x_0 | x_1)} \\\
    right] = E_{q(x_{0:T})} \\left[ \\underbrace{\\log \\frac{q(x_T | x_0)}{q(x_1\
    \ | x_0) p_{\\theta}(x_0 | x_1) p_{\\theta}(x_T)}}_{全部为常数} + \\sum_{t=2}^T \\\
    log \\frac{q(x_{t-1} | x_t, x_0)}{p_{\\theta}(x_{t-1} | x_t)} \\right] = E_{q(x_{0:T})}\
    \ \\left[ \\log \\frac{q(x_T | x_0)}{p_{\\theta}(x_T)} + \\sum_{t=2}^T \\log \\\
    frac{q(x_{t-1} | x_t, x_0)}{p_{\\theta}(x_{t-1} | x_t)} - \\log p_{\\theta}(x_0\
    \ | x_1) \\right] = E_{q(x_{0:T})} \\left[ D_{KL}(q(x_T | x_0) \\| p_{\\theta}(x_T))\
    \ + \\sum_{t=2}^T \\underbrace{D_{KL}(q(x_{t-1} | x_t, x_0) \\| p_{\\theta}(x_{t-1}\
    \ | x_t))}_{l_t} - \\log p_{\\theta}(x_0 | x_1) \\right] \\)\n\nDDPM 对上述优化目标进行了简化，只考虑公式（6-60）中的\
    \ \\( L_t \\) 部分，即计算分布 \\( q(x_{t-1} | x_t, x_0) \\) 与 \\( p_{\\theta}(x_{t-1}\
    \ | x_t) \\) 之间的 KL 散度，且由逆向过程可知\n\nq(x_{t-1} | x_t, x_0) = \\mathcal{N}(x_{t-1};\
    \ \\tilde{\\mu}_t(x_t, x_0), \\tilde{\\beta}_t I)  \np_{\\theta}(x_{t-1} | x_t)\
    \ = \\mathcal{N}(x_{t-1}; \\mu_{\\theta}(x_t, t), \\Sigma_{\\theta}(x_t, t)) =\
    \ \\mathcal{N}(x_{t-1}; \\mu_{\\theta}(x_t, t), \\tilde{\\beta}_t I)\n\n因此\n\n\
    L_t = D_{KL}(q(x_{t-1} | x_t, x_0) \\| p_{\\theta}(x_{t-1} | x_t))  \n= \\left[\
    \ \\frac{1}{2\\beta_t} \\| \\tilde{\\mu}_t(x_t, x_0) - \\mu_{\\theta}(x_t, t)\
    \ \\|^2 \\right]  \n= E_{x_0, \\epsilon_0} \\left[ \\frac{1}{2\\beta_t} \\| \\\
    frac{1}{\\sqrt{\\alpha_t}} \\left( x_t - \\frac{\\beta_t}{\\sqrt{1 - \\bar{\\\
    alpha}_t}} \\epsilon_0 \\right) - \\frac{1}{\\sqrt{\\alpha_t}} \\left( x_t - \\\
    frac{\\beta_t}{\\sqrt{1 - \\bar{\\alpha}_t}} \\epsilon_{\\theta}(x_t, t) \\right)\
    \ \\|^2 \\right]  \n= E_{x_0, \\bar{\\epsilon}_0} \\left[ \\frac{\\beta_t^2}{2\\\
    beta_t \\alpha_t (1 - \\bar{\\alpha}_t)} \\| \\bar{\\epsilon}_0 - \\epsilon_{\\\
    theta}(x_t, t) \\|^2 \\right]  \n= E_{x_0, \\bar{\\epsilon}_0} \\left[ \\frac{\\\
    beta_t^2}{2\\beta_t \\alpha_t (1 - \\bar{\\alpha}_t)} \\| \\bar{\\epsilon}_0 -\
    \ \\epsilon_{\\theta} \\left( \\sqrt{\\bar{\\alpha}_t} x_0 + \\sqrt{1 - \\bar{\\\
    alpha}_t} \\bar{\\epsilon}_0, t \\right) \\|^2 \\right]\n\nDDPM 进一步对 \\( L_t \\\
    ) 进行简化，得到\n\nL_{simple} = E_{x_0, \\bar{\\epsilon}_0} \\left[ \\| \\bar{\\epsilon}_0\
    \ - \\epsilon_{\\theta} \\left( \\sqrt{\\bar{\\alpha}_t} x_0 + \\sqrt{1 - \\bar{\\\
    alpha}_t} \\bar{\\epsilon}_0, t \\right) \\|^2 \\right]\n\n可以发现，DDPM 最终损失函数的计算十分简单，核心就是最小化采样的真实噪声\
    \ \\( \\bar{\\epsilon}_0 \\) 与模型所预测噪声 \\( \\epsilon_{\\theta} \\) 之间的均方误差损失。\n\
    \n## 6.8 深度生成模型的应用\n\n深度信念网络及其贪婪训练的思想使得高效训练深度网络成为可能，通常用来初始化深度前馈神经网络的网络参数，再加上一层\
    \ Softmax 层形成一个用于分类的深度前馈神经网络。同时，深度信念网络也可以用来对高维数据（如图像、文本等）进行降维，同样取得了很好的效果。自编码器及其变种也可以用来初始化前馈神经网络的参数，同时在数据压缩、表示学习、数据去噪、异常识别等领域也有很多应用。扩散模型自提出以后，在图像生成领域成了主流模型，同时它也可应用于自然语言处理、多模态建模和时间序列建模等领域。\n\
    \n## 复习题\n\n- 1. 请说明什么是深度生成模型，目前有哪些典型的深度生成模型？\n- 2. 请说明什么是深度信念网络，它与 Sigmoid 信念网络、深度玻尔兹曼机有哪些不同？\n\
    - 3. 请说明什么是自编码器，它有哪些主要变种？\n- 4. 请说明什么是深度自编码器，它是如何训练的？\n- 5. 请说明扩散模型的基本原理。\n\n\
