    的改进也不大，主要的改进是骨干网络由 CSPDarknet-53 改为了 EfficientRep[32]。这些版本的 YOLO 在保证实时性的同时，也提高了目标检测的准确率，成为当前目标检测框架的首选。


    ## 2.5.2 图像分割


    全卷积网络（Fully Convolutional Network，FCN）[22] 是使用深度神经网络进行图像分割的开山之作。FCN 与传统的卷积神经网络不同，仅包含卷积层和池化层，不再包含全连接层和输出层。因此，它也不再对整幅图像进行分类，而是实现了像素级的分类，进而输出图像分割的结果。FCN
    与传统卷积神经网络的区别如图 2-47 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_79_0.png)


    图 2-47 FCN 与传统卷积神经网络的区别[22]


    如图 2-48 所示，FCN 中的卷积过程如下所示：


    - 1) 图像经过多个卷积和一个最大池化变为 pool1 特征图，特征图的宽高变为图像的 1/2。

    - 2) pool1 特征图再经过多个卷积和一个最大池化后变为 pool2 特征图，宽高变为图像的 1/4。

    - 3) pool2 特征图再经过多个卷积和一个最大池化后变为 pool3 特征图，宽高变为图像的 1/8。

    - 4) 重复上述操作，直到得到 pool5 特征图，宽高变为图像的 1/32。


    图 2-48 FCN 的卷积、上采样流程


    | 特征图 | 尺寸 |

    |---|---|

    | 图像 | $(w, h)$ |

    | pool1 | $(w/2, h/2)$ |

    | pool2 | $(w/4, h/4)$ |

    | pool3 | $(w/8, h/8)$ |

    | pool4 | $(w/16, h/16)$ |

    | pool5 | $(w/32, h/32)$ |

    | 上采样预测 (FCN-32s) | $32 \times$ |

    | 上采样预测 (FCN-16s) | $16 \times$ |

    | 上采样预测 (FCN-8s) | $8 \times$ |

    | 上采样预测 | $2 \times$ |

    | pool4预测 | |

    | pool3预测 | |


    如图 2-48 所示，FCN 中的上采样过程如下所示：


    - 1) 对于 FCN-32s 分割，直接对 pool5 特征图进行 32 倍的上采样，获得 32×上采样特征图，再对 32×上采样特征图的每个点做 Softmax
    分类预测，获得 32×上采样预测，即 FCN-32s 分割图。

    - 2) 对于 FCN-16s 分割，首先对 pool5 特征图进行 2 倍上采样，获得 2×上采样特征图，再把 pool4 特征图和 2×上采样特征图逐点相加，然后对相加的特征图进行
    16 倍上采样，并进行 Softmax 分类预测，获得 16×上采样预测，即 FCN-16s 分割图。

    - 3) 对于 FCN-8s 分割，首先把 pool4 特征图和 pool5 的 2×上采样特征图逐点相加，再进行 2 倍上采样，然后与 pool3 特征图逐点相加，然后对相加的特征图进行
    8 倍上采样，并进行 Softmax 分类预测，获得 8×上采样预测，即 FCN-8s 分割图。


    上采样（Upsampling）一般包括 2 种方式：1）调整尺寸，如使用双线性插值进行图像放大；2）逆卷积（Deconvolution）。逆卷积与卷积的操作示例如下所示：1）先做卷积，对于大小为
    m×m 特征图，用小为 k×k 的卷积核做卷积，步长为 1，则得到的特征图大小为 （m-k+1）×(m-k+1)；2）再做逆卷积，对大小为 （m-k+1）×(m-k+1）特征图先进行
    （k-1）层的填充（Padding），再用大小为 k×k 的卷积核做卷积，则得到的特征图的大小为 （m-k+1）+2(k-1) -k+1 = m。


    在 FCN 的基础上，产生了多种变体，其中 SegNet[23] 比较著名，它采用了 Encoder-Decoder 结构，如图 2-49 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_81_0.png)


    SegNet 的 Encoder 骨干网络是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个最大池化层，进行 2×2
    最大池化时，存储相应的最大池化位置索引。


    SegNet 的 Decoder 骨干网络也是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个上采样层，采用 Encoder
    存储的最大池化位置索引进行上采样。使用 K 类 Softmax 分类器预测每个像素的类别。


    UNet[24] 是一个广泛应用于医疗图像分割的经典模型，也采用 Encoder-Decoder 结构，如图 2-50 所示。


    在 UNet 中，左半部分是 Encoder，由两个 3×3 的卷积层（含激活函数 ReLU）再加上一个 2×2 的最大池化层组成，一共下采样 4 次。右半部分是
    Decoder，由一个上采样的 2×2 逆卷积层加上特征拼接再加上两个 3×3 的卷积层（含激活函数 ReLU）组成，也相应地上采样 4 次。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_82_0.png)


    图 2-50 UNet 的结构[24] （详见彩插）


    同时，在 UNet 中含有跳跃连接（Skip Connection），在同一层进行了特征复制（Copy），保证最后恢复出来的特征图融合了更多的底层特征，也使得不同尺度（Scale）的特征得到了融合，从而可以进行多尺度预测，4
    次上采样也使得分割图恢复边缘等信息更加精细。进行眼球血管图像分割的效果如图 2-51 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_82_1.png)


    图 2-51 基于 UNet 的眼球血管图像分割


    ## 2.5.3 姿态估计


    姿态估计（Pose Estimation）可视为图像或视频中人体关节位置（也称为关键点，如手肘、膝盖、肩膀等）的定位问题，因此也称为人体关键点检测。在 MSCOCO
    数据集中，人体姿态关键点格式如图 2-52 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_83_0.png)


    - 0: nose

    - 1: neck

    - 2: right shoulder

    - 3: right elbow

    - 4: right wrist

    - 5: left shoulder

    - 6: left elbow

    - 7: left wrist

    - 8: right hip

    - 9: right knee

    - 10: right ankle

    - 11: left hip

    - 12: left knee

    - 13: left ankle

    - 14: right eye

    - 15: left eye

    - 16: right ear

    - 17: left ear


    图 2-52 MSCOCO 数据集中的人体关键点


    姿态估计一般分为单人姿态估计（Single Person Pose Estimation，SPPE）和多人姿态估计（Multiple Person Pose
    Estimation，MPPE）。姿态估计算法与姿态估计数据集密切相关，早期的姿态估计数据集一般都是单人的，因此当时的姿态估计主要集中于 SPPE，但 MPPE
    更符合实际情况，随着更多 MPPE 数据集的出现，针对 MPPE 的研究也越来越多。


    多人姿态估计方法又分为两类：1）Top-Down 方法。首先利用目标检测算法检测图像中的多个人，然后使用 SPPE 模型估计每一个人的姿态，这种方法的优点是精度高、易于实现，缺点是依赖于目标检测算法的效果，无法很好地解决遮挡问题，并且速度会随着图像场景中人数的增加而变慢。2）Bottom-Up
    方法。首先检测出图像中所有人体关键点，然后将关键点分配给不同的人，这种方法的优点是整个图像只需要处理一次，且速度不受图像场景中人数变化影响，缺点是精度不如
    Top-Down 方法，同样无法很好地解决遮挡问题。


    DeepPose[33] 是使用深度神经网络进行人体姿态识别的开山之作，它将姿态估计问题转换为图像的卷积特征提取与关键点坐标位置的回归问题。DeepPose
    的结构由 AlexNet 加上额外的全连接层组成，将输出投影到 2k 维度，直接对表征人体 k 个关键点的坐标进行回归预测，如图 2-53 所示。不同于分类任务，DeepPose
    使用 L2 作为损失函数进行训练。


    DeepPose 将姿态估计问题看作回归任务，使用函数 \(\varphi(x;\theta) \in \mathbb{R}^{2k}\)，\(x\) 代表图像，\(\theta\)
    代表模型的参数，\(k\) 个关键点的坐标 \(y=(y_1^T,y_2^T,\cdots,y_i^T,\cdots,y_k^T)^T\)，其中 \(y_i\)
    表示第 \(i\) 个关键点的坐标，其中包含横坐标和纵坐标。损失函数采用 L2 损失：


    ```

    \(\arg\min \sum_{(x_i) \in \Omega_y} \sum_{i=1}^k \| y_i - \varphi_i(x;\theta)
    \|_2^2 \quad (2-47)\)

    ```

    '
  mdcn: '

    Anchor 边框的回归输出，为每个 Anchor 得到位置偏移量（x，y，w，h），因此输出大小为 4k。如图 2-43 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_75_0.png)


    图 2-43 RPN Anchor 示意图


    RPN 训练时的损失函数定义为


    ```

    L({p_i}, {t_i}) = \frac{1}{N_{cls}} \sum_i L_{cls}(p_i, p_i^*) + \lambda \frac{1}{N_{reg}}
    \sum_i p_i^* L_{reg}(t_i, t_i^*) \quad (2-39)

    ```


    其中，i 表示 Anchor 的索引，p_i 表示正例分类概率（Positive Softmax Probability），p_i^* 表示对应的 Anchor
    预测概率（即当第 i 个 Anchor 与标定边框（Ground Truth Bounding Box）之间的 IoU>0.7 时，认为是该 Anchor
    是正例；反之 IoU<0.3 时，认为是该 Anchor 是负例；至于那些 0.3 ≤ IoU ≤ 0.7 的 Anchor 则不参与训练；t_i 表示预测边框（Predicted
    Bounding Box），t_i^* 表示对应正例 Anchor 对应的人工标定边框。分类损失用于分类 Anchor 为正例与负例的网络训练。回归损失用于边框回归训练。注意在该损失中乘了
    p_i^*（正例 p_i^* = 1、负例 p_i^* = 0），相当于只关心正例 Anchor 的回归，而没必要去关心负例 Anchor 的回归。\lambda
    是边框回归损失的权重参数。


    ## 2. YOLO 系列


    YOLO 系列模型[15-20] 与 R-CNN 系列最大的区别是用一个卷积神经网络就可以直接预测输入图像中的目标边框和类别概率，实现了端到端（End2End）的训练。YOLO[15]
    的网络结构如图 2-44 所示。


    YOLO 模型中，将检测任务看作一个回归问题，将图像划分为一个 S×S 的网格，每一个网格预测 B 个边框以及它的置信度，还有 C 个类别的概率，整个预测被编码为
    S×S×(B×5+C) 的张量，如图 2-45 所示。


    | 层类型 | 配置 |

    |---|---|

    | 卷积层 | 7x7x64, s=2 |

    | 最大池化层 | 2x2, s=2 |

    | 卷积层 | 3x3x192 |

    | 最大池化层 | 2x2, s=2 |

    | 卷积层 | 1x1x128<br>1x1x256<br>3x3x256<br>1x1x256<br>3x3x512 |

    | 最大池化层 | 2x2, s=2 |

    | 卷积层 | 1x1x128<br>1x1x256<br>3x3x256<br>1x1x256<br>3x3x512 |

    | 最大池化层 | 2x2, s=2 |

    | 卷积层 | 1x1x256 x4<br>3x3x512<br>1x1x512<br>3x3x1024 |

    | 最大池化层 | 2x2, s=2 |

    | 卷积层 | 1x1x512 x2<br>3x3x1024<br>3x3x1024<br>3x3x1024, s=2 |

    | 卷积层 | 3x3x1024<br>3x3x1024 |

    | 卷积层 | 1024 |

    | 卷积层 | 4096 |

    | 卷积层 | 30 |


    图 2-44 YOLO 的网络结构


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_77_0.png)


    图 2-45 YOLO 模型[15]（详见彩插）


    如图 2-46 所示，设定每个网格预测两个边框，边框 1 和边框 2 的回归结果都是五维，其中前四维代表位置 (\hat{x}, \hat{y}, \hat{w},
    \hat{h})，最后一维代表置信度 \hat{C}_o。(\hat{x}, \hat{y}) 是边框的中心相对于网格（Cell）的偏移量（Offset），(\hat{w},
    \hat{h}) 是边框相对于整个图片的比例，计算公式如下：


    ```

    \hat{x} = \frac{x_c}{w_{total}} \times S - x_{col} (2-40)

    ```


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_77_1.png)


    图 2-46 边框位置计算示意图（详见彩插）


    ```

    \(\hat{y} = \frac{y_c}{h_{total}} \times S - y_{min}\) \\

    \(\hat{w} = \frac{w_b}{w_{total}}\) \\

    \(\hat{h} = \frac{h_b}{h_{total}}\)

    ```


    置信度 \(\hat{C}\) 的计算公式如下：


    ```

    \(\hat{C} = P_r(\text{Object}) * \text{IoU}_{pred}^{truth}\)

    ```


    置信度 \(\hat{C}\) 由以下两部分组成。


    - 1) \(P_r(\text{Object})\)：用来判断网格内是否有目标（Object），如果有等于 1，没有等于 0。

    - 2) \(\text{IoU}_{pred}^{truth}\)：预测边框的准确度，也就是与标定边框的 IoU。


    类别的条件概率 \(P_r(\text{Class}_i | \text{Object})\) 表示该网格内存在目标物体且属于第 \(i\) 类的概率，测试的时候计算每个类别的得分：


    ```

    \(P_r(\text{Class}_i | \text{Object}) \times \hat{C}\) \\

    \(= P_r(\text{Class}_i | \text{Object}) \times P_r(\text{Object}) \times \text{IoU}_{pred}^{truth}\)
    \\

    \(= P_r(\text{Class}_i) \times \text{IoU}_{pred}^{truth}\)

    ```


    总之，图像分割成 \(S \times S\) 个网格，每个网格预测 \(B\) 个边框，每个边框预测 5 个值；同时，每个格子预测 \(C\) 个类别，所以检测器最终需要预测一个
    \(S \times S \times (B \times 5 + C)\) 的张量。对于图 2-46 中的例子，\(S=7, B=2, C=20\)，所以最终会得到一个
    \(7 \times 7 \times (2 \times 5 + 20) = 7 \times 7 \times 30\) 的张量。


    YOLO 的损失函数如公式（2-46）所示，它包含四个部分：位置误差、含有目标的置信度误差、不含目标的置信度误差和分类误差，其中，\(1_{ij}^{obj}\)
    表示第 \(i\) 个网格的第 \(j\) 个边框含有目标（Object），\(1_{ij}^{noobj}\) 表示第 \(i\) 个网格的第 \(j\)
    个边框不含有目标（Object），\(1_i^{obj}\) 表示第 \(i\) 个网格含有目标（Object）的一部分。


    ```

    \(\lambda_{coord} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} [(x_i - \hat{x}_i)^2
    + (y_i - \hat{y}_i)^2]\) \\

    \(+ \lambda_{coord} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} [(\sqrt{w_i} -
    \sqrt{\hat{w}_i})^2 + (\sqrt{h_i} - \sqrt{\hat{h}_i})^2]\) \\

    位置误差 \\

    \(+ \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{obj} (C_i - \hat{C}_i)^2\) \\

    含有目标的置信度误差 \\

    \(+ \lambda_{noobj} \sum_{i=0}^{S^2} \sum_{j=0}^B 1_{ij}^{noobj} (C_i - \hat{C}_i)^2\)
    \\

    不含目标的置信度误差 \\

    \(+ \sum_{i=0}^{S^2} 1_i^{obj} \sum_{c \in classes} (p_i(c) - \hat{p}_i(c))^2\)
    \\

    分类误差

    ```


    通过实验可以发现，YOLO 可以学到物体的全局信息，背景误检率比 R-CNN 降低一半，泛化能力强。同时由于 YOLO 采用一阶段方法，检测速度非常快，实时性好。但
    YOLO 前景检测的准确率不如 R-CNN 系列高，小目标检测效果较差。


    在 YOLO 提出后，又先后出现了 YOLOv2[16]、YOLOv3[17]、YOLOv4[18]、YOLOv5[19] 和 YOLOv6[20] 版本。YOLOv2
    更改了骨干网络，使用 Darknet-19 进行特征提取，并使用批归一化、分辨率提升和多尺度训练等方法提升了检测准确率。YOLOv3 使用 Darknet-53
    作为骨干网络进行特征提取，并借鉴特征金字塔[31] 的思想进行通道拼接与融合，进一步提升了检测准确率。YOLOv4 使用 CSPDarknet-53 作为骨干网络，并引入特征金字塔池化、Mosaic
    数据增强和 Mish 激活函数等改进方法，与 YOLOv3 相比，检测准确率有较大的提升。YOLOv5 与 YOLOv4 相比，改进不大，主要是把最大池化由并行改为了串行。YOLOv6
    的改进也不大，主要的改进是骨干网络由 CSPDarknet-53 改为了 EfficientRep[32]。这些版本的 YOLO 在保证实时性的同时，也提高了目标检测的准确率，成为当前目标检测框架的首选。


    ## 2.5.2 图像分割


    全卷积网络（Fully Convolutional Network，FCN）[22] 是使用深度神经网络进行图像分割的开山之作。FCN 与传统的卷积神经网络不同，仅包含卷积层和池化层，不再包含全连接层和输出层。因此，它也不再对整幅图像进行分类，而是实现了像素级的分类，进而输出图像分割的结果。FCN
    与传统卷积神经网络的区别如图 2-47 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_79_0.png)


    图 2-47 FCN 与传统卷积神经网络的区别[22]


    如图 2-48 所示，FCN 中的卷积过程如下所示：


    - 1) 图像经过多个卷积和一个最大池化变为 pool1 特征图，特征图的宽高变为图像的 1/2。

    - 2) pool1 特征图再经过多个卷积和一个最大池化后变为 pool2 特征图，宽高变为图像的 1/4。

    - 3) pool2 特征图再经过多个卷积和一个最大池化后变为 pool3 特征图，宽高变为图像的 1/8。

    - 4) 重复上述操作，直到得到 pool5 特征图，宽高变为图像的 1/32。


    图 2-48 FCN 的卷积、上采样流程


    | 特征图 | 尺寸 |

    |---|---|

    | 图像 | $(w, h)$ |

    | pool1 | $(w/2, h/2)$ |

    | pool2 | $(w/4, h/4)$ |

    | pool3 | $(w/8, h/8)$ |

    | pool4 | $(w/16, h/16)$ |

    | pool5 | $(w/32, h/32)$ |

    | 上采样预测 (FCN-32s) | $32 \times$ |

    | 上采样预测 (FCN-16s) | $16 \times$ |

    | 上采样预测 (FCN-8s) | $8 \times$ |

    | 上采样预测 | $2 \times$ |

    | pool4预测 | |

    | pool3预测 | |


    如图 2-48 所示，FCN 中的上采样过程如下所示：


    - 1) 对于 FCN-32s 分割，直接对 pool5 特征图进行 32 倍的上采样，获得 32×上采样特征图，再对 32×上采样特征图的每个点做 Softmax
    分类预测，获得 32×上采样预测，即 FCN-32s 分割图。

    - 2) 对于 FCN-16s 分割，首先对 pool5 特征图进行 2 倍上采样，获得 2×上采样特征图，再把 pool4 特征图和 2×上采样特征图逐点相加，然后对相加的特征图进行
    16 倍上采样，并进行 Softmax 分类预测，获得 16×上采样预测，即 FCN-16s 分割图。

    - 3) 对于 FCN-8s 分割，首先把 pool4 特征图和 pool5 的 2×上采样特征图逐点相加，再进行 2 倍上采样，然后与 pool3 特征图逐点相加，然后对相加的特征图进行
    8 倍上采样，并进行 Softmax 分类预测，获得 8×上采样预测，即 FCN-8s 分割图。


    上采样（Upsampling）一般包括 2 种方式：1）调整尺寸，如使用双线性插值进行图像放大；2）逆卷积（Deconvolution）。逆卷积与卷积的操作示例如下所示：1）先做卷积，对于大小为
    m×m 特征图，用小为 k×k 的卷积核做卷积，步长为 1，则得到的特征图大小为 （m-k+1）×(m-k+1)；2）再做逆卷积，对大小为 （m-k+1）×(m-k+1）特征图先进行
    （k-1）层的填充（Padding），再用大小为 k×k 的卷积核做卷积，则得到的特征图的大小为 （m-k+1）+2(k-1) -k+1 = m。


    在 FCN 的基础上，产生了多种变体，其中 SegNet[23] 比较著名，它采用了 Encoder-Decoder 结构，如图 2-49 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_81_0.png)


    SegNet 的 Encoder 骨干网络是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个最大池化层，进行 2×2
    最大池化时，存储相应的最大池化位置索引。


    SegNet 的 Decoder 骨干网络也是 VGG-16，包含 13 个卷积层（卷积+批归一化+ReLU），不含全连接层，还有 5 个上采样层，采用 Encoder
    存储的最大池化位置索引进行上采样。使用 K 类 Softmax 分类器预测每个像素的类别。


    UNet[24] 是一个广泛应用于医疗图像分割的经典模型，也采用 Encoder-Decoder 结构，如图 2-50 所示。


    在 UNet 中，左半部分是 Encoder，由两个 3×3 的卷积层（含激活函数 ReLU）再加上一个 2×2 的最大池化层组成，一共下采样 4 次。右半部分是
    Decoder，由一个上采样的 2×2 逆卷积层加上特征拼接再加上两个 3×3 的卷积层（含激活函数 ReLU）组成，也相应地上采样 4 次。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_82_0.png)


    图 2-50 UNet 的结构[24] （详见彩插）


    同时，在 UNet 中含有跳跃连接（Skip Connection），在同一层进行了特征复制（Copy），保证最后恢复出来的特征图融合了更多的底层特征，也使得不同尺度（Scale）的特征得到了融合，从而可以进行多尺度预测，4
    次上采样也使得分割图恢复边缘等信息更加精细。进行眼球血管图像分割的效果如图 2-51 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_82_1.png)


    图 2-51 基于 UNet 的眼球血管图像分割


    ## 2.5.3 姿态估计


    姿态估计（Pose Estimation）可视为图像或视频中人体关节位置（也称为关键点，如手肘、膝盖、肩膀等）的定位问题，因此也称为人体关键点检测。在 MSCOCO
    数据集中，人体姿态关键点格式如图 2-52 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_83_0.png)


    - 0: nose

    - 1: neck

    - 2: right shoulder

    - 3: right elbow

    - 4: right wrist

    - 5: left shoulder

    - 6: left elbow

    - 7: left wrist

    - 8: right hip

    - 9: right knee

    - 10: right ankle

    - 11: left hip

    - 12: left knee

    - 13: left ankle

    - 14: right eye

    - 15: left eye

    - 16: right ear

    - 17: left ear


    图 2-52 MSCOCO 数据集中的人体关键点


    姿态估计一般分为单人姿态估计（Single Person Pose Estimation，SPPE）和多人姿态估计（Multiple Person Pose
    Estimation，MPPE）。姿态估计算法与姿态估计数据集密切相关，早期的姿态估计数据集一般都是单人的，因此当时的姿态估计主要集中于 SPPE，但 MPPE
    更符合实际情况，随着更多 MPPE 数据集的出现，针对 MPPE 的研究也越来越多。


    多人姿态估计方法又分为两类：1）Top-Down 方法。首先利用目标检测算法检测图像中的多个人，然后使用 SPPE 模型估计每一个人的姿态，这种方法的优点是精度高、易于实现，缺点是依赖于目标检测算法的效果，无法很好地解决遮挡问题，并且速度会随着图像场景中人数的增加而变慢。2）Bottom-Up
    方法。首先检测出图像中所有人体关键点，然后将关键点分配给不同的人，这种方法的优点是整个图像只需要处理一次，且速度不受图像场景中人数变化影响，缺点是精度不如
    Top-Down 方法，同样无法很好地解决遮挡问题。


    DeepPose[33] 是使用深度神经网络进行人体姿态识别的开山之作，它将姿态估计问题转换为图像的卷积特征提取与关键点坐标位置的回归问题。DeepPose
    的结构由 AlexNet 加上额外的全连接层组成，将输出投影到 2k 维度，直接对表征人体 k 个关键点的坐标进行回归预测，如图 2-53 所示。不同于分类任务，DeepPose
    使用 L2 作为损失函数进行训练。


    DeepPose 将姿态估计问题看作回归任务，使用函数 \(\varphi(x;\theta) \in \mathbb{R}^{2k}\)，\(x\) 代表图像，\(\theta\)
    代表模型的参数，\(k\) 个关键点的坐标 \(y=(y_1^T,y_2^T,\cdots,y_i^T,\cdots,y_k^T)^T\)，其中 \(y_i\)
    表示第 \(i\) 个关键点的坐标，其中包含横坐标和纵坐标。损失函数采用 L2 损失：


    ```

    \(\arg\min \sum_{(x_i) \in \Omega_y} \sum_{i=1}^k \| y_i - \varphi_i(x;\theta)
    \|_2^2 \quad (2-47)\)

    ```

