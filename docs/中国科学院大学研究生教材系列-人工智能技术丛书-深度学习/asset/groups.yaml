    # A. 3 概率统计


    # A. 3. 1 随机变量


    随机变量（Random Variable）是指随机事件的量化表现，随机事件量化的好处是可以用数学分析的方法来研究随机现象。随机变量可以是离散的或者连续的，离散随机变量是指拥有有限个或者可列无限多个变量值的随机变量，连续随机变量是指变量值不可一一列举的随机变量。一个随机变量通常使用一个概率分布来指定它每个取值的可能性。


    # A. 3. 2 概率分布的定义


    给定某个随机变量的取值范围，概率分布（Probability Distribution）就是导致该随机事件'
  - '[PAGE 257]


    出现的可能性。从机器学习与深度学习的角度来看，概率分布就是符合随机变量取值范围的某个对象属于某个类别或服从某种规律的可能性。


    分布函数：设 X 是一个随机变量，函数 \( F(x)=P\{X \leqslant x\} \) 称为 X 的分布函数，记作 \( X \sim F(x)
    \)。离散性随机变量 X 的分布表示为 \( P\{X=x_i\}=p_i, (i=1,2,\cdots) \)，那么，它的分布函数表示为 \( F(x)=P\{X
    \leqslant x\}=\sum_{i \leqslant x} p_i \)


    连续型随机变量 X 的密度函数为 f(x)，则它的分布函数表示为 \( F(x)=P\{X \leqslant x\}=\int_{-\infty}^x f(x)
    \mathrm{d}x \)


    连续型随机变量的密度函数：当研究的对象是连续型随机变量时，概率密度函数的使用更加广泛，若使用 f(x) 表示连续型随机变量 X 的密度函数，则满足：


    +   1) f(x) 的定义域是随机变量 X 所有可能状态的集合。

    +   2) \( \forall x \in X, f(x) \geqslant 0 \)。

    +   3) \( \int f(x) \mathrm{d}x = 1 \)。


    # A. 3. 3 常用概率分布


    伯努利分布：又称 0-1 分布，是单个二值型离散随机变量的分布，概率密度函数为 \( P(X=1)=p, \quad P(X=0)=1-p \)


    二项分布：二项分布即重复 n 次伯努利试验，各次试验之间都相互独立，并且每次试验中只有两种可能的结果，且这两种结果发生与否相互对立。如果每次试验时，事件发生的概率为
    p，不发生的概率为 \( (1-p) \)，则 n 次重复独立试验中事件发生 k 次的概率为 \( P(X=k)=C_n^k p^k (1-p)^{n-k}
    \)


    均匀分布：又称矩形分布，在给定时间间隔 \( [a,b] \) 内的分布概率是等可能的，均匀分布由参数 \( a, b \) 定义，概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \frac{1}{b-a}, & a \leqslant x \leqslant b \\
    0, & \text{其他情况} \end{array}\right. \)


    高斯分布：又称正态分布，是实数中最常用的分布，对于均值为 \( \mu \)，标准差为 \( \sigma \) 的一元高斯分布，概率密度函数为

    \( f(x)=\frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(x-\mu)^2}{2\sigma^2}} \)


    指数分布：常用于描述事件的时间间隔，参数为 \( \lambda \) 的指数分布的概率密度函数为

    \( f(x)=\left\{\begin{array}{ll} \lambda e^{-\lambda x}, & x \geqslant 0 \\ 0,
    & x<0 \end{array}\right. \)


    指数分布的一个重要特征是无记忆性。例如，若某元件的寿命为 T，已知该元件已经使用了 x 小时，那么它总共使用至少 \( (x+t) \) 小时的条件概率与从开始使用时算起它使用至少
    s 小'
