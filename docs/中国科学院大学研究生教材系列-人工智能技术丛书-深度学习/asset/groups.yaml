    等循环神经网络在语言模型、机器翻译等任务上也取得了很大的进展。特别是随着 Transformer[27] 的出现，使得基于 Transformer 的双向编码器表示模型（Bidirectional
    Encoder Representation from Transformer，BERT）[28]、生成式预训练 Transformer 模型（Generative
    Pre-training Transformer，GPT）[29] 等预训练大模型进入人们的视野，这些大模型在自然语言处理领域的多个任务上都超越了已有方法。


    2022 年以来，ChatGPT、GPT-4.0 的相继问世更是使得大型通用语言模型达到了前所未有的高度，被誉为信息技术领域里程碑式的突破。2023 年，百度公司在国内也率先推出了大型通用语言模型文心一言，之后清华大学、复旦大学、华为、阿里巴巴、科大讯飞也都发布了自己的大模型，开启了大型中文语言模型的新时代。


    当前，深度学习仍然是人工智能领域关注度最高的主题之一，研究如火如荼，应用也是多点开花。在研究方面，基于 AI 的内容生成、多模态数据分析、深度强化学习等工作正在火热进行；在应用方面，深度学习已经在安防、医疗、金融、智能制造、无人驾驶等多个领域取得了显著的成果。


    ## 1.2 深度学习与机器学习、人工智能的关系


    深度学习与机器学习、人工智能之间的关系如图 1-3 所示。从图 1-3 可以看出，机器学习是人工智能的组成部分，而深度学习是机器学习的一个分支。


    ### 1.2.1 人工智能


    “人工智能”的概念最早在 1956 年的美国达特茅斯会议（Dartmouth Conference）上提出，当时会议的主题是“用机器来模仿人类学习以及其他方面的智能”。因此，1956
    年被认为是人工智能的元年。人工智能的定义有很多种，一般认为它是一门用来模拟和扩展人类智能的学科。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_31_0.png)


    人工智能有多种分类方法。常见的一种分类方法是根据人工智能能够完成的任务来分，可以分为：计算智能（Computational Intelligence）、感知智能（Perceptual
    Intelligence）和认知智能（Cognitive Intelligence）。计算智能是指机器能计算会分析，这个已经实现；感知智能是指机器能看会认、能听会说，这个也已经基本实现；认知智能是指机器能理解会思考，这个目前还在进展过程中。


    人工智能包含多种理论、技术与方法，如搜索理论、知识表示与推理方法、机器学习算法、感知/决策与控制技术等，更多人工智能理论与技术的介绍请参阅史忠植研究员编著的《高级人工智能》[30]
    和 Stephen Lucci 博士等人编著的《人工智能》[31] 等经典的人工智能书籍。


    ### 1.2.2 机器学习


    “机器学习”是一种让机器具有像人一样的学习能力的技术，具体来说就是让机器从已知数据中学习获得规律，并利用这些规律对未知数据进行预测。举个简单的例子，利用机器学习算法对往年的天气预报数据进行学习，就能够预测未来的天气预报数据。


    机器学习算法一般分为三类：有监督学习、无监督学习和弱监督学习。它们的定义以及主要算法描述如下：


    - (1) 有监督学习


    机器（学生）从环境（教师）那里获得数据（试题）标签（答案）并进行不断学习的方法。可以打一个比喻，在学校某门课程考试结束后，学生从课程教师那里获得最终的考题答案，就知道自己做对了多少题，做错了多少题，通过多次考试后，学生自己的能力得到提升，进而就可以在新的考试中获得更好的成绩。机器也是一样，它从现有数据中不断地学习，通过标签判断学习的效果，不断提高自身的能力，进而可以更好地预测新数据的结果。因此，可以用四个字来描述有监督学习：跟学师评。常见的有监督学习算法有：线性回归、多项式回归、决策树和随机森林等回归算法，以及
    K-近邻（K-Nearest Neighbor，KNN）、逻辑回归、贝叶斯和支持向量机等分类算法。


    - (2) 无监督学习


    没有环境提示（教师指导）的情况下，机器（学生）自学的过程，一般使用一些既定标准进行评价，或无评价。同样，打个比喻，学生可以在课后根据自己总结的学习方法学习新知识，提高自身能力而不用教师给出相关的指导。机器也是一样，它按照既定规则从现有数据中不断地学习，获得数据规律，不需要环境给出提示。因此，也可以用四个字来描述无监督学习：自学标评。常见的无监督学习算法有：K-Means
    聚类、主成分分析、关联分析等。


    - (3) 弱监督学习


    仅有少量环境提示（教师反馈）或者少量数据（试题）标签（答案）的情况下，机器（学生）不断进行学习的方法。同样，打个比喻，学生学习新知识，教师仅对学生的表现给出奖励信号或者对部分试题（试题类别）给出答案或指导，学生根据这些信号或者答案/指导不断进行学习。机器也是一样，它根据环境提示或者少量标签进行学习，不断提升自身的能力。常见的弱监督学习算法有：强化学习、半监督学习和多示例学习等。


    更详细的机器学习理论、算法和案例介绍请参阅周志华教授撰写的《机器学习》[32]、李航教授撰写的《统计学习方法》[33] 等经典机器学习书籍。


    ### 1.2.3 深度学习


    深度学习是机器学习的一个重要的分支，它也包含有监督学习方法和无监督学习方法，也有与弱监督学习相结合的方法。由于其在计算机视觉、语音处理与自然语言处理领域的重大突破，在训练、验证时与传统的机器学习方法有较大的区别，因此人们往往把它单独看作一类学习方法。我们将在下一节介绍深度学习的基本概念和典型的深度学习算法。


    总之，人工智能旨在为机器赋予人的智能，并使得机器在某些方面超越人类；机器学习是人工智能的重要组成部分，让机器具有像人一样的学习能力；深度学习是机器学习的一个重要分支，它突破了传统机器学习算法的瓶颈，在多个研究与应用领域取得了巨大的进展。


    ## 1.3 深度学习的基本概念和典型算法


    ### 1.3.1 深度学习的基本概念


    如前所述，深度学习的概念起源于人工神经网络的研究，是机器学习中的一个重要分支。一般来说，深度学习是指通过构建多层神经网络结构来学习数据的特征，以便进行数据分类、回归与生成。


    深度学习与浅层学习相比，神经网络结构的层数更多（一般大于或等于 4 层），通过多层神经网络结构可以学习得到更丰富的数据特征，便于完成数据分类、回归与生成任务。以前馈神经网络为例，有浅层前馈神经网络和深度前馈神经网络之分，浅层前馈神经网络一般包含一个输入层、一个隐藏层和一个输出层，深度前馈神经网络一般包含一个输入层、多个隐藏层和一个输出层，如图
    1-4 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_33_0.png)


    图 1-4 浅层前馈神经网络与深度前馈神经网络


    与传统机器学习算法相比，深度学习算法能够自动学习数据的特征，而不需要进行人工提取。举例来说，对于判断输入图像是否为小汽车的二分类问题，传统的机器学习算法需要人工提取小汽车的特征，如轮廓、颜色、纹理等，然后再通过分类算法来判断输入图像是不是小汽车，而深度学习算法可以自动提取特征并进行分类，大大节省了人工成本，如图
    1-5 所示。


    | 机器学习 | 深度学习 |

    |---|---|

    | 输入 -> 特征提取 -> 分类 -> 输出 | 输入 -> 特征提取+分类 -> 输出 |

    | (小汽车 / 非小汽车) | (小汽车 / 非小汽车) |


    图 1-5 机器学习算法与深度学习算法示例


    ### 1.3.2 典型深度学习算法


    不论是浅层学习还是深度学习，都包含有监督学习与无监督学习两大类算法，典型的浅层学习、深度学习算法概貌如图 1-6 所示。


    ### 浅层学习算法 / 有监督学习算法

    - 决策树

    - 支持向量机

    - 感知机

    - Boosting


    ### 深度学习算法 / 有监督学习算法

    - 深度前馈神经网络

    - 卷积神经网络

    - 循环神经网络

    - Transformer

    - 胶囊网络

    - 深度森林


    ### 无监督学习算法 / 浅层学习算法

    - 自编码器

    - 受限玻尔兹曼机

    - 高斯混合模型

    - 稀疏自编码器


    ### 无监督学习算法 / 深度学习算法

    - 深度自编码器

    - 深度玻尔兹曼机

    - 生成对抗网络

    - 深度信念网络


    图 1-6 浅层学习与深度学习算法概览


    从图 1-6 可以看出，属于有监督学习的浅层学习算法有：决策树、支持向量机、感知机和 Boosting 等。属于无监督学习的浅层学习算法有：自编码器、受限玻尔兹曼机、高斯混合模型和稀疏自编码器等。属于有监督学习的深度学习算法有：深度前馈神经网络、卷积神经网络、循环神经网络、Transformer、胶囊网络和深度森林等。属于无监督学习的深度学习算法有：深度自编码器、生成对抗网络、深度玻尔兹曼机和深度信念网络等。下面对部分典型深度学习算法进行简要介绍。


    ### 1. 深度前馈神经网络


    深度前馈神经网络（Deep Feedforward Neural Network，DFNN）也称作多层感知机（Multi-Layer Perceptron，MLP），是一种典型的深度学习模型。一个深度前馈神经网络一般由一个输入层、多个隐藏层和一个输出层构成，如图
    1-7 所示。深度前馈神经网络既可以完成分类任务，又可以完成回归任务。以回归任务为例来说明深度前馈神经网络的训练过程。首先，随机初始化深度前馈神经网络的参数，包括权重和偏置；其次，输入训练集中的输入样本，前向传播，计算得到输出值；接下来，将实际输出值与样本的期望输出值（标签值）输入误差函数得到误差信号，把误差信号从输出层逐层向前传播得到各层的误差信号，再通过调整各层的连接权重与偏置以减小误差，权重与偏置的调整主要使用梯度下降法或其变种来完成；反复迭代，直到误差函数值小于既定的阈值，停止迭代，得到最终的模型参数。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_35_0.png)


    图 1-7 深度前馈神经网络


    ### 2. 卷积神经网络


    卷积神经网络也是一种多层神经网络，主要用来完成计算机视觉领域的各项任务，如图像分类、目标检测、图像分割、图像回归等。卷积神经网络一般由一个输入层、多个由卷积层和池化层组成的混合结构、一层或者多层神经网络组成的全连接层和一个输出层组成，如图
    1-8 所示。


    在卷积神经网络中，首先通过卷积和池化来提取输入图像的初级特征和高级特征，之后通过全连接层完成数据降维，最终完成分类或者回归任务。卷积神经网络的优点是能够自动提取大量样本的特征，大大降低了人工提取特征的成本，缺点是需要一个长时间并且复杂的训练和调参过程。我们将在第
    2 章详细介绍卷积神经网络。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_36_0.png)


    ### 3. 循环神经网络


    循环神经网络是一种专门用于处理序列数据的神经网络，它在序列的演进方向上进行递归以完成序列预测等任务。一个经典的循环神经网络由输入神经元、递归的隐藏神经元与输出神经元组成，如图
    1-9 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_36_1.png)


    循环神经网络的核心思想在于样本间存在顺序关系，每个样本和它之前的样本存在关联。通过神经网络在时序上的展开，能够找到样本之间的序列相关性，进而实现序列预测等任务。典型的循环神经网络包括
    LSTM、GRU、双向 RNN 和堆叠 RNN 等。我们将在第 3 章详细介绍循环神经网络。


    ### 4. Transformer


    2017 年，谷歌提出了 Transformer 模型，它使用自注意力（Self-Attention）结构取代了循环神经网络结构。与循环神经网络相比，Transformer
    的最大优点是可以并行计算，效率更高。Transformer 基于 Encoder-Decoder（编码器-解码器）结构，编码部分由多个编码器（Encoder）组成，解码部分也是由多个解码器（Decoder）组成。Transformer
    的结构如图 1-10 所示。


    Transformer 提出之后，在自然语言处理领域的机器翻译任务中取得了很大的进展，之后基于 Transformer 的 BERT、GPT 模型的提出，更是在十多项自然语言处理任务中达到了当时最好的效果。近几年来，Transformer
    在计算机视觉领域的应用也取得了巨大的进展，Swin Transformer、ViT 等模型的提出，也在多项计算机视觉任务中达到了更好的效果。我们将在第 4
    章详细介绍 Transformer。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_37_0.png)


    ### 5. 生成对抗网络


    生成对抗网络是一种以无监督方式学习目标分布的深度生成模型，它的主要灵感来源于博弈论中的零和博弈思想。GAN 由生成器（Generator）与判别器（Discriminator）组成，通过生成器和判别器的不断博弈，使的生成器能够学习到数据的真实分布，如图
    1-11 所示。


    从图 1-11 可以看出，生成器从潜在空间中随机采样作为输入，其输出结果需要尽量模仿训练集中的真实样本。判别器的输入则为真实样本与生成器的输出，其目的是判断两者的真假。生成器与判别器相互对抗、不断调整参数，最终目的是使得判别器无法判断生成器的输出结果是真是假。我们将在第
    5 章详细介绍生成对抗网络。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_38_0.png)


    图 1-11 生成对抗网络示意图


    ### 6. 深度信念网络


    深度信念网络（Deep Belief Network，DBN）是一种概率生成模型，它由 Sigmoid 信念网络（Sigmoid Belief Network，SBN）与一个受限玻尔兹曼机（Restricted
    Boltzmann Machine，RBM）组成，最上面两层是一个 RBM，下面是 Sigmoid 信念网络，如图 1-12a 所示。深度信念网络采用逐层贪婪训练的方式，由于下面几层是
    Sigmoid 信念网络，下一层训练完成后再训练上一层，这解决了深度神经网络的优化问题。深度信念网络的优点是通过预训练克服了前馈神经网络因随机初始化权重等参数而容易陷入局部最优的问题。我们将在第
    6 章详细介绍深度信念网络。


    ### 7. 深度玻尔兹曼机


    深度玻尔兹曼机（Deep Boltzmann Machine，DBM）常与深度信念网络联系在一起，这两者有很多的相似之处，都是基于受限玻尔兹曼机构建的，但也有很大的差别，如图
    1-12b 所示。从网络结构可以看出，深度信念网络除了最顶层是 RBM 外，其余部分是 Sigmoid 信念网络，而深度玻尔兹曼机都是由 RBM 组成的，这也决定了它们的训练方法是不同的。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_38_1.png)


    图 1-12 深度信念网络与深度玻尔兹曼机


    深度玻尔兹曼机最常用的训练方式是逐层贪婪预训练加监督微调，在逐层贪婪预训练时，每一层被视作独立的 RBM 进行训练，可见层是对输入数据进行建模，之后的每个隐藏层都是对前一个
    RBM 后验分布的样本进行建模，当所有的 RBM 训练完成后，就可以组合成为深度玻尔兹曼机。我们将在第 6 章详细介绍深度玻尔兹曼机。


    ### 8. 深度自编码器


    自编码器（AutoEncoder，AE）一般由编码器与解码器组成，自编码器通过编码器将原始输入编码为压缩表示，然后通过解码器将中间的压缩表示解码为新的输入表示。深度自编码器（Deep
    AutoEncoder，DAE）是由两个对称的深度信念网络构成的，通常用 4～5 个隐藏层表示编码部分，与之对称地，解码部分也是由 4～5 个隐藏层组成，如图
    1-13 所示。我们将在第 6 章详细介绍深度自编码器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_39_0.png)


    ## 1.4 深度学习的主要应用概述


    深度学习极大地促进了人工智能的发展，受到学术界与产业界的高度重视，计算机视觉、语音处理和自然语言处理是深度学习应用最广泛的三个主要领域。当然，在多模态处理领域，深度学习的应用也越来越广泛。


    ### 1.4.1 深度学习在计算机视觉领域的应用


    自 2012 年 AlexNet 卷积神经网络在图像分类任务上取得突破性进展以来，以卷积神经网络和 Transformer 为代表的深度学习算法在很多计算机视觉任务上都取得了很好的效果。可以


    '
  mdcn: '


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_30_0.png)


    图 1-2 深度学习的发展


    2012 年，Frank Seide 等人使用深度神经网络进行语音识别[15]，相比于传统的高斯混合模型（Gaussian Mixture Model，GMM）和隐马尔可夫模型（Hidden
    Markov Model，HMM），语音识别错误率下降了 20% ~ 30%，取得了突破性的进展。


    同样在 2012 年，Alex Krizhevsky 等人提出了一种称作 AlexNet 的卷积神经网络[16]，它引入了 ReLU 激活函数，并使用 GPU
    进行加速。在著名的 ImageNet 图像识别大赛中，AlexNet 使得图像识别错误率从 26% 下降到了 15%，并夺得冠军。


    在随后几年的 ImageNet 图像识别大赛中，又出现了一些经典的卷积神经网络，如 VGG-Net[17]、GoogleNet[18]、ResNet[19]、SENet[20]
    等，图像识别错误率继续下降。到 2017 年，SENet 的图像识别错误率已经下降到了 2.25%，由于错误率已经到了极限，这也导致 ImageNet 图像识别大赛从
    2018 年开始不再举办。


    2014 年起，R-CNN[21]、Fast R-CNN[22]、Faster R-CNN[23] 等一系列目标检测模型的提出，极大地提升了目标检测的精度，但是它们一般要经过特征提取、分类/回归两个阶段才能完成，模型训练效率较低。2016
    年，YOLO 目标检测模型被提出[24]，由于它是一个端到端的模型，大大提高了模型训练与推理效率，但模型的精度不如 R-CNN 系列高，之后 YOLO 的后续版本陆续被推出，目前已经到了第
    8 版，在效率提升的同时，精度也在不断提升。


    2014 年，生成对抗网络（Generative Adversarial Network，GAN）[25] 由当时还在蒙特利尔大学读博士的 Ian J. Goodfellow
    提出，由于它不需要标注大量的数据即可进行训练，在学术界迅速掀起了研究热潮。GAN 在图像生成、图像转换、图像迁移、图像修复等领域都有很好的应用。


    除了 CNN 在计算机视觉领域取得了突破之外，在自然语言处理领域，LSTM[13]、门限循环单元（Gated Recurrent Unit，GRU）[26]
    等循环神经网络在语言模型、机器翻译等任务上也取得了很大的进展。特别是随着 Transformer[27] 的出现，使得基于 Transformer 的双向编码器表示模型（Bidirectional
    Encoder Representation from Transformer，BERT）[28]、生成式预训练 Transformer 模型（Generative
    Pre-training Transformer，GPT）[29] 等预训练大模型进入人们的视野，这些大模型在自然语言处理领域的多个任务上都超越了已有方法。


    2022 年以来，ChatGPT、GPT-4.0 的相继问世更是使得大型通用语言模型达到了前所未有的高度，被誉为信息技术领域里程碑式的突破。2023 年，百度公司在国内也率先推出了大型通用语言模型文心一言，之后清华大学、复旦大学、华为、阿里巴巴、科大讯飞也都发布了自己的大模型，开启了大型中文语言模型的新时代。


    当前，深度学习仍然是人工智能领域关注度最高的主题之一，研究如火如荼，应用也是多点开花。在研究方面，基于 AI 的内容生成、多模态数据分析、深度强化学习等工作正在火热进行；在应用方面，深度学习已经在安防、医疗、金融、智能制造、无人驾驶等多个领域取得了显著的成果。


    ## 1.2 深度学习与机器学习、人工智能的关系


    深度学习与机器学习、人工智能之间的关系如图 1-3 所示。从图 1-3 可以看出，机器学习是人工智能的组成部分，而深度学习是机器学习的一个分支。


    ### 1.2.1 人工智能


    “人工智能”的概念最早在 1956 年的美国达特茅斯会议（Dartmouth Conference）上提出，当时会议的主题是“用机器来模仿人类学习以及其他方面的智能”。因此，1956
    年被认为是人工智能的元年。人工智能的定义有很多种，一般认为它是一门用来模拟和扩展人类智能的学科。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_31_0.png)


    人工智能有多种分类方法。常见的一种分类方法是根据人工智能能够完成的任务来分，可以分为：计算智能（Computational Intelligence）、感知智能（Perceptual
    Intelligence）和认知智能（Cognitive Intelligence）。计算智能是指机器能计算会分析，这个已经实现；感知智能是指机器能看会认、能听会说，这个也已经基本实现；认知智能是指机器能理解会思考，这个目前还在进展过程中。


    人工智能包含多种理论、技术与方法，如搜索理论、知识表示与推理方法、机器学习算法、感知/决策与控制技术等，更多人工智能理论与技术的介绍请参阅史忠植研究员编著的《高级人工智能》[30]
    和 Stephen Lucci 博士等人编著的《人工智能》[31] 等经典的人工智能书籍。


    ### 1.2.2 机器学习


    “机器学习”是一种让机器具有像人一样的学习能力的技术，具体来说就是让机器从已知数据中学习获得规律，并利用这些规律对未知数据进行预测。举个简单的例子，利用机器学习算法对往年的天气预报数据进行学习，就能够预测未来的天气预报数据。


    机器学习算法一般分为三类：有监督学习、无监督学习和弱监督学习。它们的定义以及主要算法描述如下：


    - (1) 有监督学习


    机器（学生）从环境（教师）那里获得数据（试题）标签（答案）并进行不断学习的方法。可以打一个比喻，在学校某门课程考试结束后，学生从课程教师那里获得最终的考题答案，就知道自己做对了多少题，做错了多少题，通过多次考试后，学生自己的能力得到提升，进而就可以在新的考试中获得更好的成绩。机器也是一样，它从现有数据中不断地学习，通过标签判断学习的效果，不断提高自身的能力，进而可以更好地预测新数据的结果。因此，可以用四个字来描述有监督学习：跟学师评。常见的有监督学习算法有：线性回归、多项式回归、决策树和随机森林等回归算法，以及
    K-近邻（K-Nearest Neighbor，KNN）、逻辑回归、贝叶斯和支持向量机等分类算法。


    - (2) 无监督学习


    没有环境提示（教师指导）的情况下，机器（学生）自学的过程，一般使用一些既定标准进行评价，或无评价。同样，打个比喻，学生可以在课后根据自己总结的学习方法学习新知识，提高自身能力而不用教师给出相关的指导。机器也是一样，它按照既定规则从现有数据中不断地学习，获得数据规律，不需要环境给出提示。因此，也可以用四个字来描述无监督学习：自学标评。常见的无监督学习算法有：K-Means
    聚类、主成分分析、关联分析等。


    - (3) 弱监督学习


    仅有少量环境提示（教师反馈）或者少量数据（试题）标签（答案）的情况下，机器（学生）不断进行学习的方法。同样，打个比喻，学生学习新知识，教师仅对学生的表现给出奖励信号或者对部分试题（试题类别）给出答案或指导，学生根据这些信号或者答案/指导不断进行学习。机器也是一样，它根据环境提示或者少量标签进行学习，不断提升自身的能力。常见的弱监督学习算法有：强化学习、半监督学习和多示例学习等。


    更详细的机器学习理论、算法和案例介绍请参阅周志华教授撰写的《机器学习》[32]、李航教授撰写的《统计学习方法》[33] 等经典机器学习书籍。


    ### 1.2.3 深度学习


    深度学习是机器学习的一个重要的分支，它也包含有监督学习方法和无监督学习方法，也有与弱监督学习相结合的方法。由于其在计算机视觉、语音处理与自然语言处理领域的重大突破，在训练、验证时与传统的机器学习方法有较大的区别，因此人们往往把它单独看作一类学习方法。我们将在下一节介绍深度学习的基本概念和典型的深度学习算法。


    总之，人工智能旨在为机器赋予人的智能，并使得机器在某些方面超越人类；机器学习是人工智能的重要组成部分，让机器具有像人一样的学习能力；深度学习是机器学习的一个重要分支，它突破了传统机器学习算法的瓶颈，在多个研究与应用领域取得了巨大的进展。


    ## 1.3 深度学习的基本概念和典型算法


    ### 1.3.1 深度学习的基本概念


    如前所述，深度学习的概念起源于人工神经网络的研究，是机器学习中的一个重要分支。一般来说，深度学习是指通过构建多层神经网络结构来学习数据的特征，以便进行数据分类、回归与生成。


    深度学习与浅层学习相比，神经网络结构的层数更多（一般大于或等于 4 层），通过多层神经网络结构可以学习得到更丰富的数据特征，便于完成数据分类、回归与生成任务。以前馈神经网络为例，有浅层前馈神经网络和深度前馈神经网络之分，浅层前馈神经网络一般包含一个输入层、一个隐藏层和一个输出层，深度前馈神经网络一般包含一个输入层、多个隐藏层和一个输出层，如图
    1-4 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_33_0.png)


    图 1-4 浅层前馈神经网络与深度前馈神经网络


    与传统机器学习算法相比，深度学习算法能够自动学习数据的特征，而不需要进行人工提取。举例来说，对于判断输入图像是否为小汽车的二分类问题，传统的机器学习算法需要人工提取小汽车的特征，如轮廓、颜色、纹理等，然后再通过分类算法来判断输入图像是不是小汽车，而深度学习算法可以自动提取特征并进行分类，大大节省了人工成本，如图
    1-5 所示。


    | 机器学习 | 深度学习 |

    |---|---|

    | 输入 -> 特征提取 -> 分类 -> 输出 | 输入 -> 特征提取+分类 -> 输出 |

    | (小汽车 / 非小汽车) | (小汽车 / 非小汽车) |


    图 1-5 机器学习算法与深度学习算法示例


    ### 1.3.2 典型深度学习算法


    不论是浅层学习还是深度学习，都包含有监督学习与无监督学习两大类算法，典型的浅层学习、深度学习算法概貌如图 1-6 所示。


    ### 浅层学习算法 / 有监督学习算法

    - 决策树

    - 支持向量机

    - 感知机

    - Boosting


    ### 深度学习算法 / 有监督学习算法

    - 深度前馈神经网络

    - 卷积神经网络

    - 循环神经网络

    - Transformer

    - 胶囊网络

    - 深度森林


    ### 无监督学习算法 / 浅层学习算法

    - 自编码器

    - 受限玻尔兹曼机

    - 高斯混合模型

    - 稀疏自编码器


    ### 无监督学习算法 / 深度学习算法

    - 深度自编码器

    - 深度玻尔兹曼机

    - 生成对抗网络

    - 深度信念网络


    图 1-6 浅层学习与深度学习算法概览


    从图 1-6 可以看出，属于有监督学习的浅层学习算法有：决策树、支持向量机、感知机和 Boosting 等。属于无监督学习的浅层学习算法有：自编码器、受限玻尔兹曼机、高斯混合模型和稀疏自编码器等。属于有监督学习的深度学习算法有：深度前馈神经网络、卷积神经网络、循环神经网络、Transformer、胶囊网络和深度森林等。属于无监督学习的深度学习算法有：深度自编码器、生成对抗网络、深度玻尔兹曼机和深度信念网络等。下面对部分典型深度学习算法进行简要介绍。


    ### 1. 深度前馈神经网络


    深度前馈神经网络（Deep Feedforward Neural Network，DFNN）也称作多层感知机（Multi-Layer Perceptron，MLP），是一种典型的深度学习模型。一个深度前馈神经网络一般由一个输入层、多个隐藏层和一个输出层构成，如图
    1-7 所示。深度前馈神经网络既可以完成分类任务，又可以完成回归任务。以回归任务为例来说明深度前馈神经网络的训练过程。首先，随机初始化深度前馈神经网络的参数，包括权重和偏置；其次，输入训练集中的输入样本，前向传播，计算得到输出值；接下来，将实际输出值与样本的期望输出值（标签值）输入误差函数得到误差信号，把误差信号从输出层逐层向前传播得到各层的误差信号，再通过调整各层的连接权重与偏置以减小误差，权重与偏置的调整主要使用梯度下降法或其变种来完成；反复迭代，直到误差函数值小于既定的阈值，停止迭代，得到最终的模型参数。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_35_0.png)


    图 1-7 深度前馈神经网络


    ### 2. 卷积神经网络


    卷积神经网络也是一种多层神经网络，主要用来完成计算机视觉领域的各项任务，如图像分类、目标检测、图像分割、图像回归等。卷积神经网络一般由一个输入层、多个由卷积层和池化层组成的混合结构、一层或者多层神经网络组成的全连接层和一个输出层组成，如图
    1-8 所示。


    在卷积神经网络中，首先通过卷积和池化来提取输入图像的初级特征和高级特征，之后通过全连接层完成数据降维，最终完成分类或者回归任务。卷积神经网络的优点是能够自动提取大量样本的特征，大大降低了人工提取特征的成本，缺点是需要一个长时间并且复杂的训练和调参过程。我们将在第
    2 章详细介绍卷积神经网络。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_36_0.png)


    ### 3. 循环神经网络


    循环神经网络是一种专门用于处理序列数据的神经网络，它在序列的演进方向上进行递归以完成序列预测等任务。一个经典的循环神经网络由输入神经元、递归的隐藏神经元与输出神经元组成，如图
    1-9 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_36_1.png)


    循环神经网络的核心思想在于样本间存在顺序关系，每个样本和它之前的样本存在关联。通过神经网络在时序上的展开，能够找到样本之间的序列相关性，进而实现序列预测等任务。典型的循环神经网络包括
    LSTM、GRU、双向 RNN 和堆叠 RNN 等。我们将在第 3 章详细介绍循环神经网络。


    ### 4. Transformer


    2017 年，谷歌提出了 Transformer 模型，它使用自注意力（Self-Attention）结构取代了循环神经网络结构。与循环神经网络相比，Transformer
    的最大优点是可以并行计算，效率更高。Transformer 基于 Encoder-Decoder（编码器-解码器）结构，编码部分由多个编码器（Encoder）组成，解码部分也是由多个解码器（Decoder）组成。Transformer
    的结构如图 1-10 所示。


    Transformer 提出之后，在自然语言处理领域的机器翻译任务中取得了很大的进展，之后基于 Transformer 的 BERT、GPT 模型的提出，更是在十多项自然语言处理任务中达到了当时最好的效果。近几年来，Transformer
    在计算机视觉领域的应用也取得了巨大的进展，Swin Transformer、ViT 等模型的提出，也在多项计算机视觉任务中达到了更好的效果。我们将在第 4
    章详细介绍 Transformer。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_37_0.png)


    ### 5. 生成对抗网络


    生成对抗网络是一种以无监督方式学习目标分布的深度生成模型，它的主要灵感来源于博弈论中的零和博弈思想。GAN 由生成器（Generator）与判别器（Discriminator）组成，通过生成器和判别器的不断博弈，使的生成器能够学习到数据的真实分布，如图
    1-11 所示。


    从图 1-11 可以看出，生成器从潜在空间中随机采样作为输入，其输出结果需要尽量模仿训练集中的真实样本。判别器的输入则为真实样本与生成器的输出，其目的是判断两者的真假。生成器与判别器相互对抗、不断调整参数，最终目的是使得判别器无法判断生成器的输出结果是真是假。我们将在第
    5 章详细介绍生成对抗网络。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_38_0.png)


    图 1-11 生成对抗网络示意图


    ### 6. 深度信念网络


    深度信念网络（Deep Belief Network，DBN）是一种概率生成模型，它由 Sigmoid 信念网络（Sigmoid Belief Network，SBN）与一个受限玻尔兹曼机（Restricted
    Boltzmann Machine，RBM）组成，最上面两层是一个 RBM，下面是 Sigmoid 信念网络，如图 1-12a 所示。深度信念网络采用逐层贪婪训练的方式，由于下面几层是
    Sigmoid 信念网络，下一层训练完成后再训练上一层，这解决了深度神经网络的优化问题。深度信念网络的优点是通过预训练克服了前馈神经网络因随机初始化权重等参数而容易陷入局部最优的问题。我们将在第
    6 章详细介绍深度信念网络。


    ### 7. 深度玻尔兹曼机


    深度玻尔兹曼机（Deep Boltzmann Machine，DBM）常与深度信念网络联系在一起，这两者有很多的相似之处，都是基于受限玻尔兹曼机构建的，但也有很大的差别，如图
    1-12b 所示。从网络结构可以看出，深度信念网络除了最顶层是 RBM 外，其余部分是 Sigmoid 信念网络，而深度玻尔兹曼机都是由 RBM 组成的，这也决定了它们的训练方法是不同的。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_38_1.png)


    图 1-12 深度信念网络与深度玻尔兹曼机


    深度玻尔兹曼机最常用的训练方式是逐层贪婪预训练加监督微调，在逐层贪婪预训练时，每一层被视作独立的 RBM 进行训练，可见层是对输入数据进行建模，之后的每个隐藏层都是对前一个
    RBM 后验分布的样本进行建模，当所有的 RBM 训练完成后，就可以组合成为深度玻尔兹曼机。我们将在第 6 章详细介绍深度玻尔兹曼机。


    ### 8. 深度自编码器


    自编码器（AutoEncoder，AE）一般由编码器与解码器组成，自编码器通过编码器将原始输入编码为压缩表示，然后通过解码器将中间的压缩表示解码为新的输入表示。深度自编码器（Deep
    AutoEncoder，DAE）是由两个对称的深度信念网络构成的，通常用 4～5 个隐藏层表示编码部分，与之对称地，解码部分也是由 4～5 个隐藏层组成，如图
    1-13 所示。我们将在第 6 章详细介绍深度自编码器。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_39_0.png)


    ## 1.4 深度学习的主要应用概述


    深度学习极大地促进了人工智能的发展，受到学术界与产业界的高度重视，计算机视觉、语音处理和自然语言处理是深度学习应用最广泛的三个主要领域。当然，在多模态处理领域，深度学习的应用也越来越广泛。


