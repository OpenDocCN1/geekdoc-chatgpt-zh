    DeepPose 直接对 k 个关键点的坐标进行回归，训练复杂度较高，一定程度上削弱了模型的泛化能力，而且模型使用的骨干网络是 AlexNet，它的学习能力有限。一种解决方法是将回归问题转换为预测
    k 个尺寸为 W0 x H0 的热图（Heatmap）| h1, h2, ..., hk |，其中 hi 表示第 i 个关键点的热图。根据此方法，基于沙漏网络（Hourglass
    Network）的姿态估计算法被提出[25]。堆叠的沙漏网络（Stacked Hourglass）的提出具有里程碑意义，它不仅在各个姿态估计数据集上取得了当时最好的结果，后续也被应用于目标检测、图像分割等领域，图
    2-55 中重复的形似沙漏的结构就是沙漏网络。


    沙漏网络包含重复的降采样（高分辨率到低分辨率）和上采样（低分辨率到高分辨率），此外还使用了残差连接保存不同分辨率下的空间信息。与 DeepPose 采用级联回归器一样，使用
    Hourglass 模块的初衷在于捕捉与利用多个尺度上的信息，因为局部特征信息对于识别人体的脸部、手部等部位十分重要，但人体最终的姿态估计也需要图像的全局特征信息。与
    DeepPose 的不同之处在于，沙漏网络不直接对关键点坐标进行回归，而是输出热图用于预测'
