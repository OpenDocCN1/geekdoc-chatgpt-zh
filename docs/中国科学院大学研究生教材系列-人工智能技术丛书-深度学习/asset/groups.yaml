    II 的 GAN 获取由阶段 I 的 GAN 生成的图像，并以文本嵌入为条件信息生成高分辨率图像。这一阶段的模型主要用来进行缺陷纠正和细节添加，产生逼真的高分辨率图像。基于低分辨率样本
    $s_0$ 和高斯潜在向量 $\hat{c}$，这一阶段 GAN 中的判别器 $D$ 和生成器 $G$ 的损失函数如下所示：


