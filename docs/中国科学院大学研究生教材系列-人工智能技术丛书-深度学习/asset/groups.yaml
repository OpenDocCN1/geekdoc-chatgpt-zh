    ## 7.8 优化算法


    深度学习中的优化算法是指在模型训练过程中，通过调整参数以最小化损失函数来提高模型性能的算法。优化算法在深度学习中起着至关重要的作用，因为深度神经网络通常有大量的参数需要优化，这使得大规模的模型训练变得非常困难。深度学习中的优化算法选择直接影响了模型的收敛速度和性能。一个好的优化算法应该能够控制梯度下降的方向，避免局部最小值和鞍点，并能够加快学习的速度。下面介绍一些常用的优化算法。


    ### 7.8.1 梯度下降法


    ### 1. 梯度下降法


    梯度下降法（Gradient Descent，GD）[8] 是一种常见的优化算法，用于调整模型参数以最小化损失函数。它是一种迭代的方法，通过计算损失函数的梯度方向，并按照梯度的方向来调整参数的取值，从而不断逼近损失函数的最小值。通常以最小化
    f(x) 指代深度学习中的优化问题， f(x) 为损失函数。


    假设有一个函数 y=f(x)，这个函数的导数记为 f''(x) 或 dy/dx，表示 f(x) 在点 x 处的斜率。换句话说，它表示如何缩放输入的小变化才能在输出获得相应的变化。即


    \(f''(x) = \lim_{\epsilon \to 0} \frac{f(x+\epsilon) - f(x)}{\epsilon} \Rightarrow
    f(x+\epsilon) \approx f(x) + \epsilon f''(x), \quad \text{当 } \epsilon \text{
    足够小时}\) (7-46)


    因此导数对于最小化一个函数很有用，因为它告诉我们如何更改 x 来略微地改善 y。例如，对于足够小的 ε 来说， f(x - ε sign(f''(x)))
    < f(x) 一定成立，其中 sign 为符号函数。因此可以将 x 往导数的反方向移动一小步来减小 f(x)，即取 x'' = x - ε f''(x) 为新的参考点，这种技术称为梯度下降。


    如图 7-14 所示，以 f(x) = \frac{1}{2}x^2 为例展示了梯度下降法中梯度下降的实际情况，图中的箭头表示梯度下降的方向。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_227_0.png)


    图 7-14 损失函数 f(x) 示意图


    在深度学习中，损失函数的自变量包含网络的多个参数，通常来说是多维的，用 \(X=(x_1, x_2, \cdots, x_n)\) 表示，为了使“最小化”的概念有意义，因此输出必须是一维的，即
    \(f(X): \mathbb{R}^n \rightarrow \mathbb{R}\)。

    针对具有多维输入的函数，需要用到偏导数的概念。偏导数 \(\frac{\partial}{\partial x_i} f(X)\) 衡量点 \(X\) 处只有
    \(x_i\) 增加时 \(f(X)\) 如何变化。而梯度是相对一个向量的导数，\(f\) 的导数是包含所有偏导数的向量，记为


    \(\nabla_x f(X) = \left( \frac{\partial f(X)}{\partial x_1}, \frac{\partial f(X)}{\partial
    x_2}, \cdots, \frac{\partial f(X)}{\partial x_n} \right)\)


    此时为了最小化 \(f\)，我们希望找到使 \(f\) 下降最快的方向，与二维图像上的梯度类似，同样可以证明梯度的反方向为 \(f\) 下降最快的方向，因此选取新的坐标点
    \(X''\)：


    \(X'' = X - \epsilon \nabla_x f(X)\)


    其中，\(\epsilon\) 称作学习率，它是一个大小固定的正标量。可以通过几种不同的方式选择 \(\epsilon\)，普遍的方式是选择一个小常数，有时也可以通过计算选择使方向导数消失的步长。还有一种方法是根据多个
    \(\epsilon\) 计算 \(f(X - \epsilon \nabla_x f(X))\)，并选择其中能产生最小目标函数值的 \(\epsilon\)。


    梯度下降的步骤如下：


    - 1) 初始化参数值。

    - 2) 计算当前参数下损失函数的梯度。

    - 3) 按照梯度的方向和学习率对参数进行更新，学习率决定了每一步参数调整的大小。

    - 4) 重复步骤 2) 和 3)，直到达到预定的停止条件（如达到最大迭代次数或损失函数收敛到指定的值）。

    - 5) 通过不断更新参数，梯度下降法能够使模型逐渐朝着更小的损失函数值移动，从而找到损失函数的局部最小值或全局最小值。


    需要注意的是，梯度下降法可能会陷入局部最小值而无法到达全局最小值。为了解决这个问题，可以使用不同的改进方法，如批量梯度下降法（Batch Gradient
    Descent，BGD）、随机梯度下降法（Stochastic Gradient Descent，SGD）、小批量随机梯度下降法（Mini-batch Stochastic
    Gradient Descent，Mini-batch SGD）等。


    ### 2. 批量梯度下降法


    批量梯度下降法[8] 是在更新参数时使用所有的样本进行更新，假设一个批次中有 n 个样本，则计算梯度时使用这个批次中所有 n 个样本的梯度数据，计算公式如下：


    $$x'' = x - \epsilon \sum_{j=1}^n \nabla_{x_j} f(x_j)$$ (7-49)


    因为需要计算整个批次的梯度来执行一次更新，所以批量梯度下降法可能非常缓慢，并且对于内存不适合的数据集来说是难以处理的，而且批量梯度下降法也不允许在线更新模型。


    ### 3. 随机梯度下降法


    随机梯度下降法[8] 与批量梯度下降法相对应，区别在于求梯度时没有用一个批次中的所有 n 个样本数据，而是随机选取其中一个样本来求梯度，计算公式如下：


    $$x'' = x - \epsilon \nabla_{x_j} f(x_j)$$ (7-50)


    对于训练速度来说，随机梯度下降法由于每次仅采用一个样本来迭代，训练速度很快。但是使用这种方法时模型对每个实例都非常敏感，特殊实例容易带偏模型。一方面，实例引发的波动可能使模型跳过敏，找到更好的局部最小值，另一方面，也造成了收敛中的不稳定，来回波动。


    已有研究表明，当缓慢降低学习率时，SGD 表现出与批量梯度下降法相同的收敛行为，对于非凸优化和凸优化，几乎可以分别收敛到局部最小值或全局最小值。


    ### 4. 小批量随机梯度下降法


    小批量随机梯度下降法[8] 是批量梯度下降法和随机梯度下降法的折中，也就是对于一个批次中的所有 n 个样本，采用 k 个样本来迭代：


    $$x'' = x - \epsilon \sum_{j=i}^{i+k-1} \nabla_{x_j} f(x_j)$$ (7-51)


    小批量随机梯度下降法一方面减少了参数更新的方差，使得损失函数更稳定地收敛，另一方面可以利用最先进的深度学习库中常见的矩阵优化，使梯度的计算非常高效。常见的小批量大小在
    50~256 之间，但不同的数据集可能会有所不同。


    ### 7.8.2 基于动量的方法


    ### 1. 动量法


    随机梯度下降法容易导致模型陷入局部最优或者鞍点，且梯度更新不稳定，容易陷入震荡。针对此问题，动量（Momentum）法[9] 提出在随机梯度下降法的基础上，引入动量的概念，使用指数移动平均值取代梯度计算，计算公式如下：


    \(x'' = x - \epsilon m_t = x - \epsilon (\beta m_{t-1} + \nabla_{x_t} f(x_t, t))\)
    (7-52)


    其中 \epsilon 表示学习率，m_t 即为引入的动量，它累加了过去的梯度信息：


    \(m_t = \beta m_{t-1} + \nabla_{x_t} f(x_t, t) = \beta(\beta m_{t-2} + \nabla_{x_j}
    f(x_j, t-1)) + \nabla_{x_t} f(x_t, t) = \sum_{\tau=0}^{t-1} \beta^\tau \nabla_{x_t}
    f(x_t, t-\tau)\) (7-53)


    直观来看，动量在当前时刻的梯度上，增加了与先前时刻梯度相关的 \beta m_{t-1}，即当前时刻参数的更新方向不仅由当前梯度方向决定，也与之前累积的梯度方向（动量方向）相关。如图
    7-15 所示，对于参数中梯度方向变化不大的维度，动量的引入可以加速参数收敛；而针对梯度方向变化较大的维度，则可以缓解震荡现象。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_229_0.png)


    图 7-15 动量法参数更新示例


    ### 2. NAG


    NAG（Nesterov Accelerated Gradient）[9] 针对动量法进一步改进，动量法中计算的为当前时刻的梯度，NAG 提出计算参数经过更新之后时刻的梯度：


    \(x'' = x - \epsilon m_t = x - \epsilon (\beta m_{t-1} + \nabla_{x_j} f(x_j -
    \beta m_{t-1}, t))\) (7-54)


    动量法与 NAG 参数更新的比较如图 7-16 所示，对于动量法，参数更新方向 1 由当前步的动量方向和梯度方向 1 决定；对于 NAG，其相较于动量法多了一步前瞻操作，即先对当前步应用动量方向进行参数更新以得到梯度方向
    2，然后结合动量方向得到参数更新方向 2。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_229_1.png)


    图 7-16 动量法和 NAG 参数更新方式比较（详见图）


    ### 3. AdaGrad


    以上方法均使用相同的学习率对参数进行更新，但是对于不常见的参数，由于其更新频率低可能导致其无法更新到较好的状态。解决此问题的一个思路是在训练过程中对不同参数的学习率进行动态调整：对于常见参数，由于其更新频率高从而调低其学习率；对于不常见参数，由于其更新频率低从而调高其学习率。可以记录截至第
    \(t\) 步参数 \(x\) 出现（被更新）的次数 \(s(\Theta, t)\)，并将其学习率设置为 \(\epsilon=\frac{\epsilon_0}{\sqrt{s(\Theta,
    t)+c}}\)，其中，\(\epsilon_0\) 为设置的初始全局学习率，\(c\) 为一个较小的正数，常设置为 \(10^{-6}\)，用于保证数值稳定性，避免分母为零。AdaGrad
    ( Adaptive Gradient ) 算法 [10] 提出使用梯度的平方和作为 \(s(\Theta, t)\) 的替换估计，记为 \(s_i\) :


    \(x''=x-\frac{\epsilon_0}{\sqrt{s_i+c}}\nabla_{x_j}f(x_j,t) \quad (7-55)\)


    \(s_i=s_{i-1}+\nabla_{y_j}f(x_j,t)^2 \quad (7-56)\)


    AdaGrad 也存在一定的问题：首先 AdaGrad 依赖于初始全局学习率 \(\epsilon_0\)，如果初始全局学习率太大，会使得训练初期对梯度的调节太大；此外随着训练次数的迭代，累积的梯度平方和会越来越大，会使得学习率单调递减至
    0，从而导致训练提前结束。


    ### 4. RMSProp/ADADELTA


    为解决 AdaGrad 中存在的梯度累计导致的学习率递减至 0 的问题，RMSProp ( Root Mean Square Prop ) [11] 改用指数移动平均改善学习率动态调整过程：


    \(x''=x-\frac{\epsilon_0}{\sqrt{s_i+c}}\nabla_{x_j}f(x_j,t) \quad (7-57)\)


    \(s_i=\gamma s_{i-1}+(1-\gamma)\nabla_{x_j}f(x_j,t)^2 \quad (7-58)\)


    其中，\(\gamma\) 为指数移动平均的加权系数，且 \(\gamma \in [0, 1]\)。RMSProp 改善了 AdaGrad 存在的问题，但是仍然需要手动指定初始学习率
    \(\epsilon_0\)。ADADELTA [12] 是 AdaGrad 的另一种变体，同时使用了两个状态变量，\(s_i\) 与 RMSProp 一样用于存储梯度平方和（二阶动量）的指数移动平均值，\(\Delta
    x_i\) 用于存储模型本身参数更新变量平方和的指数移动平均值。


    \(x''=x-\frac{\sqrt{\Delta x_{i-1}+c}}{\sqrt{s_i+c}}\nabla_{x_j}f(x_j,t) \quad
    (7-59)\)


    \(s_i=\gamma s_{i-1}+(1-\gamma)\nabla_{x_j}f(x_j,t)^2 \quad (7-60)\)


    \(\Delta x_{i-1}=\gamma\Delta x_{i-2}+(1-\gamma)g_{i-1}^2 \quad (7-61)\)


    其中


    \(g_{i-1}=\frac{\sqrt{\Delta x_{i-2}+c}}{\sqrt{s_{i-1}+c}}\nabla_{x_j}f(x_j,t-1)
    \quad (7-62)\)


    从上式可看出，AdaDelta 不需要人工指定学习率。


    ### 5. Adam


    动量法在 SGD 的基础上引入了一阶动量，AdaGrad、RMSProp 和 ADADELTA 则引入了二阶动量。Adam（Adaptive Moment）[13]
    则同时利用了梯度的一阶动量和二阶动量，其参数更新公式如下：


    \(x''=x-\epsilon \frac{\hat{m}_t}{\sqrt{\hat{s}_t}+c} \quad (7-63)\)


    \(m_t=\beta_1 m_{t-1}+(1-\beta_1) \nabla_{x_j} f(x_j, t), \quad \hat{m}_t=\frac{m_t}{1-\beta_1^t}
    \quad (7-64)\)


    \(s_t=\beta_2 s_{t-1}+(1-\beta_2) \nabla_{x_j} f(x_j, t)^2, \quad \hat{s}_t=\frac{s_t}{1-\beta_2^t}
    \quad (7-65)\)


    其中，\(\beta_1\) 和 \(\beta_2\) 为非负超参数，默认设置 \(\beta_1=0.9\)、\(\beta_2=0.999\)，\(m_t\)
    和 \(s_t\) 为参数梯度的一阶动量和二阶动量的指数移动平均值，即对参数梯度的一阶动量期望和二阶动量期望的估计；但是由于初始值 \(m_0\) 和 \(s_0\)
    设置为 0，当 \(t\) 较小时存在较大的初始偏差，从而估计值并不准确。例如，当 \(\beta_1=0.9\) 时，\(m_1=0.1 \nabla_{x_j}
    f(x_j, 1)\)。为消除这样的影响，研究人员提出使用 \(m_t\) 和 \(s_t\) 的偏差修正值 \(\hat{m}_t\) 和 \(\hat{s}_t\)
    对参数进行更新。


    ### 6. Nadam


    Nadam（Nesterov Adam）[14] 在 Adam 的基础上引入了 NAG 的思想，引入“未来时刻”的梯度，首先将 Adam 中的 \(\hat{m}_t\)
    展开，参数更新公式如下：


    \(x''=x-\epsilon \frac{1}{\sqrt{\hat{s}_t}+c} \left( \frac{\beta_1 m_{t-1}}{1-\beta_1^t}
    + \frac{(1-\beta_1) \nabla_{x_j} f(x_j, t)}{1-\beta_1^t} \right) \quad (7-66)\)


    \(x''=x-\epsilon \frac{1}{\sqrt{\hat{s}_t}+c} \left( \frac{\beta_1 m_t}{1-\beta_1^t}
    + \frac{(1-\beta_1) \nabla_{x_j} f(x_j, t)}{1-\beta_1^t} \right)\)


    \(=x-\epsilon \frac{1}{\sqrt{\hat{s}_t}+c} \left( \beta_1 \hat{m}_t + \frac{(1-\beta_1)
    \nabla_{x_j} f(x_j, t)}{1-\beta_1^t} \right) \quad (7-67)\)


