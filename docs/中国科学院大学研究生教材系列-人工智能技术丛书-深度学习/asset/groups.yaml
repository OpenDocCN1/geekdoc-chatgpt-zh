    \ntorch.autograd 是 PyTorch 中所有模型的核心，其功能是为 Tensor 上的所有操作提供自动微分，实现梯度的收集、计算和跟踪，从而避免手动计算导数的复杂过程。它是一个由运行定义的框架，这意味着开发者可以以代码运行的方式自定义数据流的前向传播和后向传播，为模型设计提供了更大的灵活性。\n\
