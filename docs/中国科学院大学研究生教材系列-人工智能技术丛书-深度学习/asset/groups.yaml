    # 2.4.5 ResNet


    残差神经网络（Residual Neural Network，ResNet）[10] 由何凯明等人提出，获得了 2015 年 ImageNet 物体识别挑战赛的冠军。


    ResNet 的核心是称作残差块（Residual Block）的单元，残差块可以视作在标准神经网络基础上加入了跳跃连接（Skip Connection），可以从某一层获取激活输出，迅速反馈给另一层，如图
    2-36 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_69_0.png)


    图 2-36 ResNet 的残差块


    如图 2-36a 所示为一个普通的两层神经网络，其中 $W$ 和 $b$ 分别表示连接权重和偏置，$\sigma(\cdot)$ 表示激活函数，则有：


    ```

    \(x_{l+1} = \sigma(W_{l+1}x_l + b_{l+1})\)

    \(x_{l+2} = \sigma(W_{l+2}x_{l+1} + b_{l+2})\)

    (2-21)

    ```


    也就是说，在普通的神经网络中，信息流从 \(x_l\) 到 \(x_{l+1}\) 再到 \(x_{l+2}\) 需要经过如上的计算过程，可以看成信息沿着一条直的管道流动。


    如图 2-36b 所示是一个残差块，相较于普通神经网络，添加了一条直接从 \(x_l\) 到 \(x_{l+2}\) 的连接，即前文所说的跳跃连接，因此有：'
  - '[PAGE 70]


    ```

    $x_{i,i_1}=\sigma\left(W_{i,i_1}x_i+b_{i,i_1}\right) \\ x_{i,i_2}=\sigma\left(W_{i,i_2}x_{(i_1)}+b_{i,i_2}+x_i\right)$

    ```


    也就是说，在残差块里面，通过跳跃连接使得前面某层的输出作为后面某层的输入。如果存在跳跃连接的输入、输出维度不一致的情况，则可以对输入进行简单的线性映射变换即可。


    由前面讲述的 VGGNet 可以看出，随着卷积神经网络层数的加深，其性能也有了大幅提升。那么为什么会提出残差网络呢？主要是因为随着卷积网络层数的增加，误差的反向传播过程中存在的梯度消失和梯度爆炸问题同样也会导致模型的训练难以进行，甚至会出现随着网络深度的加深，模型在训练集上的训练误差出现先降低再升高的现象。而残差块的引入则有助于缓解梯度消失和梯度爆炸问题。


    # 2.5 卷积神经网络的主要应用


    # 2.5.1 目标检测


    目标检测任务是指将图像或者视频中的目标物体用边框（Bounding Box）标记并识别出该目标物体的类别。目前目标检测任务有两类模型：一类是以区域卷积神经网络（Region-CNN，R-CNN）系列为代表的两阶段模型，一类是以
    YOLO 系列为代表的一阶段模型。


    +   1. R-CNN 系列


    R-CNN[12] 由 Ross Girshick 等人 2014 年提出。R-CNN 首先在 ImageNet 上训练模型，然后在 PASCAL VOC
    数据集上进行微调（Finetuning），将目标检测的验证指标平均精度均值（Mean Average Precision，mAP）提升到了 53.7%，这比之前最好的结果提升了
    13.3%。R-CNN 的结构如图 2-37 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_70_0.png)


    R-CNN 的实现过程如下所示。


    +   1）区域划分：给定一张输入图片，采用选择性搜索（Selective Search）算法从图片中提取 2000 个左右独立的候选区域。


    +   2）特征提取：对于每个区域利用 AlexNet 抽取一个固定长度的特征向量。


    +   3）目标分类：对每个区域利用 SVM 进行分类。'
