    \n## 7.5 提前终止\n\n在深度学习算法的训练过程中，我们期望随着训练迭代次数的增加，训练损失或者说训练误差能逐步减小。但是如果同时观察训练过程中模型在验证集上的损失，会发现验证集损失通常会先下降然后在某个时刻又开始上升，如图\
    \ 7-10 所示。可以认为在验证集损失开始上升的时刻，模型的训练已经表现的足够好了，如果再训练会导致模型的性能下降。而提前终止（Early Stopping）的作用则在于找到这个上升的时间点，并及时终止模型的训练。因为提前终止策略简单有效，且可以单独使用或者与其他正则化策略结合使用，是深度学习中最常用的正则化方法之一。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_219_0.png)\n\n图 7-10 模型训练损失变化示意图\n\n\
    提前终止算法的伪代码如算法 7-1 所示。\n\n### 算法 7-1 提前终止算法\n\n```\n输入：验证集损失计算间隔轮数 E^{interval}，验证集损失开始上升后训练轮数阈值\
    \ E^{threshold}\n输出：最佳验证集损失 Loss^*_{val}，最佳训练轮数 E^*\ni=0\nj=0\nLoss^*_{val} =\
    \ \\infty\nE^* = 0\nwhile i<E^{threshold} do\n    j=j+E^{interval}\n    计算最新 Loss'_{val}\n\
    \    if Loss'_{val} < Loss^*_{val} then\n        i=0\n        E^* = j\n      \
    \  Loss^*_{val} = Loss'_{val}\n    else\n        i=i+1\n    end if\nend while\n\
    ```\n\n## 7.6 Dropout\n\nDropout[3] 正则化方法由 Nitish Srivastava 等人于 2012 年提出，它计算简单、功能强大。目前，大多数的深度神经网络都使用了\
    \ Dropout 正则化方法。\n\nDropout 可以作为训练深度神经网络的一种技巧。在每个训练批次中，通过删掉部分神经元节点，可以明显地减少过拟合现象。换句话说，在网络前向传播时，让某个神经元的激活值以一定的概率\
    \ p 输出为 0，这样可以使模型的泛化能力更强，因为它不会太依赖某些局部特征。如图 7-11 所示，可以看到未使用 Dropout 的神经网络（如图 7-11a\
    \ 所示）和使用 Dropout 的神经网络（如图 7-11b 所示）的情况。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_220_0.png)\n\
    \n如图 7-12a 所示，未使用 Dropout 的神经网络的计算公式如下：\n\n\\(z_i^{(l+1)} = w_i^{(l+1)} y^{(l)}\
    \ + b_i^{(l+1)}\\) (7-18)\n\\(y_i^{(l+1)} = f(z_i^{(l+1)})\\) (7-19)\n\n其中 \\\
    (w_i^{(l+1)}\\) 表示第 \\((l+1)\\) 层第 \\(i\\) 个节点的线性变换矩阵，\\(b_i^{(l+1)}\\) 表示第 \\\
    ((l+1)\\) 层第 \\(i\\) 个节点的偏置，函数 \\(f(.)\\) 表示激活函数。\n\n如图 7-12b 所示，使用 Dropout 的神经网络的计算公式如下：\n\
    \n\\(\\hat{y}^{(l)} = r^{(l)} * y^{(l)}\\) (7-20)\n\\(r_i^{(l)} \\sim Bernoulli(p)\\\
    ) (7-21)\n\n其中 Bernoulli(p) 是为了生成概率 \\(r_i^{(l)}\\)，从而实现让某个神经元以概率 p 停止工作，起到防止过拟合的作用。\n\
    \n![](img/57b180d92f84b0150a5b5e4fc7583b76_221_0.png)\n\n如图 7-13 所示，使用 Dropout\
    \ 的神经网络的训练过程如下：\n\n- 1) 将神经网络中的隐藏层神经元的激活值以概率 p 随机置 0，即出现的概率为 (1-p)。\n- 2) 对得到的神经网络进行前向、反向传播，被置\
    \ 0 的神经元参数不改变。\n- 3) 重复这一过程，直至训练结束。\n\n![](img/57b180d92f84b0150a5b5e4fc7583b76_221_1.png)\n\
    \n使用 Dropout 的神经网络的测试（泛化）过程：\n\n- 1) 测试时使用所有神经元。\n- 2) 使用过 Dropout 的层中的所有神经元的激活值需要乘以\
    \ (1-p)。\n\nDropout 可以看作是一种高效的近似 Bagging 的集成方法，并且是共享隐藏层单元的集成方法。Warde-Farley 等人将\
    \ Dropout 与集成模型的训练进行比较并得出结论：相比独立模型集成后获得的泛化误差，Dropout 会有更好地改进。\n\n同时，Dropout 减少了隐藏层神经元之间的复杂的共适应关系。因为\
    \ Dropout 使得两个隐藏层神经元不一定每次都在一个网络中出现。这样权值的更新不再依赖于有固定关系的隐藏层神经元的共同作用，阻止了某些特征仅在其他特定特征存在时才有效果的情况，迫使网络去学习更加鲁棒的特征。\n\
    \n## 7.7 归一化\n\n由于数据样本的不同特征之间的量纲或量纲单位不同，变化区间也处于不同数量级，使用原始数据训练机器学习或深度学习模型，不同特征对模型的影响会不同，这也导致训练所得的模型缺乏鲁棒性。归一化（Normalization）是一种常见的数据预处理方法，它将数据映射成\
    \ [0,1] 或者 [-1,1] 之间的小数，使得最优解的寻优过程明显变得平缓，更容易收敛到最优解，这对训练更加鲁棒的机器学习或深度学习模型是非常必要的。因此，在构造机器学习或深度学习模型之前，需要将数据做归一化处理，使特征具有相同的度量尺度，这样不仅会加快求解的速度，还有可能提高模型的精度。\n\
    \n### 7.7.1 机器学习中的归一化\n\n#### 1. 最大最小归一化\n\n给定样本集合 \\(X = \\{x_i\\}, i=1, \\cdots,\
    \ n\\)，\\(x^{\\min}\\) 为样本的最小值，\\(x^{\\max}\\) 为样本的最大值。\n\n最大最小归一化（Max-min Normalization）将数据归一化到\
    \ [0,1] 之间，计算公式如下：\n\n\\(x_i^{minmax} = \\frac{x_i - x^{\\min}}{x^{\\max} - x^{\\\
    min}}\\) (7-24)\n\n最大最小归一化可以很好地将数据归一化到 [0,1] 之间，使数据具有相同的度量尺度。但是这种归一化方法容易受到离群点数据的影响，因为公式的分母是最大值与最小值的差，如果存在一个离群点数据的值过大或者过小，都会导致分母很大，这使得归一化后的数据失去意义。另外，最大最小归一化后的数据值都为正数，这导致机器学习模型的参数只能同时增大或同时减小，参数的更新路线可能不是最优路线。因此，一般不使用最大最小归一化进行数据预处理。\n\
    \n#### 2. 标准归一化（均值方差归一化）\n\n标准归一化（Standard Normalization）会考虑所有样本数据，因此受离群点数据的影响要小一些，尤其在样本足够多的情况下表现比较稳定。\n\
    \n给定样本集合 \\(X = \\{x_i\\}, i=1, \\cdots, n\\)，\\(E(X)\\) 为样本均值，Var(\\(X\\)) 为样本方差，标准归一化的计算公式如下：\n\
    \n\\(x_i^{stand} = \\frac{x_i - E(X)}{\\sqrt{\\text{Var}(X)}}\\) (7-25)\n\n其中\n\
    \n\\(E(X) = \\frac{1}{n} \\sum_{i=1}^n x_i\\) (7-26)\n\n\\(\\text{Var}(X)=\\frac{1}{n}\
    \ \\sum_{i=1}^n(x_i-E(X))^2\\) (7-27)\n\n标准归一化的分子为均值归一化，这样得到的样本值有正有负，可以让不同的参数朝着不同方向调整直至到达最优解，减少迭代次数，使得更新尽可能沿着最优路径进行。标准归一化的分母用到了方差，方差衡量的是数据的离散程度，因此可以减小离群点数据的影响。\n\
    \n### 7.7.2 深度学习中的归一化\n\n#### 1. 批归一化\n\n在神经网络训练过程中，通常将数据按批（Batch）输入，由于每批数据的分布并不相同，使模型训练起来比较困难。并且在训练深层神经网络时，激活函数会改变各层数据的分布和量级，随着神经网络的加深，这种改变会越来越大，从而导致模型不够稳定、不容易收敛，甚至可能出现梯度消失的问题。这些存在的问题可以通过批归一化（Batch\
    \ Normalization，BN）[4] 来解决。\n\n神经网络中传递的张量数据一般有 4 个维度，记为 \\((N, H, W, C)\\)，其中\
    \ \\(N\\) 表示批大小，\\(W\\)、\\(H\\) 分别表示特征图的宽和高，\\(C\\) 表示通道数量，\\(N, H, W, C \\in\
    \ \\mathbb{N}\\)。批归一化的主要思想是让一个批次内的所有数据在某个通道维度上的均值为 0，方差为 1，即在 \\(N\\)、\\(H\\)、\\\
    (W\\) 维度上做归一化。这样不仅可以使数据分布一致，而且可以避免梯度消失的发生。\n\n给定一个批大小为 \\(N\\) 的样本集合 \\(X \\in\
    \ \\mathbb{R}^{N \\times H \\times W \\times C}\\) 作为输入，\\(E_c[X]\\) 为样本沿着通道方向计算得到的均值，\\\
    (\\text{Var}_c[X]\\) 为样本沿着通道方向计算得到的方差，\\(\\epsilon\\) 是一个很小的数，防止分母为零，\\(\\gamma\
    \ \\in \\mathbb{R}^C\\) 为可学习放缩（Scale）变量，初始值通常设置为 1，\\(\\beta \\in \\mathbb{R}^C\\\
    ) 为可学习平移（Shift）变量，初始值通常设置为 0。批归一化的计算公式如下：\n\n\\(E_c[X]=\\frac{1}{N \\times H \\\
    times W} \\sum_{n=1}^N \\sum_{h=1}^H \\sum_{w=1}^W X_{n, h, w}\\) (7-28)\n\n\\\
    (\\text{Var}_c[X]=\\frac{1}{N \\times H \\times W} \\sum_{n=1}^N \\sum_{h=1}^H\
    \ \\sum_{w=1}^W (X_{n, h, w} - E_c[X])^2\\) (7-29)\n\n\\(Y_{n, h, w}=\\frac{X_{n,\
    \ h, w} - E_c[X]}{\\sqrt{\\text{Var}_c[X] + \\epsilon}} \\times \\gamma + \\beta\\\
    ) (7-30)\n\n批归一化使网络中每层输入数据的分布相对稳定，可以减少训练过程中的梯度消失和梯度爆炸问题，有助于更好地传播梯度并提高模型的稳定性，也使得神经网络更快地收敛到最优解，加速了训练过程。同时，它使模型对输入数据中的一些变化和扰动具有更好的鲁棒性，提高了模型的泛化能力。\n\
    \n但是批归一化受到批大小影响较大。如果批大小过小，计算的均值和方差不足以代表整个样本数据的分布，批归一化的效果可能会下降；如果批大小过大，会超过内存容量，无法处理。并且批归一化并不适合所有神经网络，如循环神经网络等动态网络，使用批归一化的效果并不好。\n\
    \n#### 2. 层归一化\n\n在自然语言处理任务中，不同样本的长度往往是不同的，而批归一化基于批对数据进行归一化，很难满足需求。为了解决这一问题，通常使用层归一化（Layer\
    \ Normalization，LN）[5]方法。\n\n层归一化是指让一个数据样本在所有通道上的均值为 0，方差为 1，即在 H、W、C 维度上做归一化。层归一化不需要批训练，在单条数据内部就能归一化。因此可以在循环神经网络等动态网络中使用。\n\
    \n给定一个批大小为 N 的样本集合 \\(X \\in \\mathbb{R}^{N \\times H \\times W \\times C}\\)\
    \ 作为输入，\\(E_n[X]\\) 是沿着批方向计算得到的均值，\\(\\text{Var}_n[X]\\) 是沿着批方向计算得到的方差，\\(\\epsilon\\\
    ) 是一个很小的数，防止分母为零，\\(\\gamma \\in \\mathbb{R}^C\\) 为可学习放缩变量，初始值通常设置为 1，\\(\\beta\
    \ \\in \\mathbb{R}^C\\) 为可学习平移变量，初始值通常设置为 0。层归一化的计算公式如下：\n\n\\(E_n[X] = \\frac{1}{H\
    \ \\times W \\times C} \\sum_{h=1}^H \\sum_{w=1}^W \\sum_{c=1}^C X_{h,w,c} \\\
    quad (7-31)\\)\n\n\\(\\text{Var}_n[X] = \\frac{1}{H \\times W \\times C} \\sum_{h=1}^H\
    \ \\sum_{w=1}^W \\sum_{c=1}^C (X_{h,w,c} - E_n[X])^2 \\quad (7-32)\\)\n\n\\(Y_{n,h,w,c}\
    \ = \\frac{X_{h,w,c} - E_n[X]}{\\sqrt{\\text{Var}_n[X] + \\epsilon}} \\quad (7-33)\\\
    )\n\n\\(Z_{n,h,w,c} = Y_{n,h,w,c} \\times \\gamma + \\beta \\quad (7-34)\\)\n\n\
    层归一化的最大优点是不依赖于小批量数据的大小，因此可以在训练和推理过程中使用不同的批大小，甚至可以在单个样本上应用，另外它也不需要保存批的均值和方差，节省了存储空间。此外，层归一化适用于循环神经网络。但是，层归一化在批大小比较大时没有批归一化效果好。\n\
    \n#### 3. 实例归一化\n\n在图像风格变换任务中，生成图像的风格主要依赖于某个图像实例，因而实例归一化（Instance Normalization）[6]\
    \ 提出只对 H、W 维度进行归一化，即只让一个单独数据在 H 和 W 维度上求均值和方差。\n\n给定一个批大小为 N 的样本集合 \\(X \\in \\\
    mathbb{R}^{N \\times H \\times W \\times C}\\) 作为输入，\\(E_{nc}[X]\\) 是沿着批方向和通道方向计算得到的均值，\\\
    (\\text{Var}_{nc}[X]\\) 是沿着批方向和通道方向计算得到的方差，\\(\\epsilon\\) 是一个很小的数，防止分母为零，\\(\\\
    gamma \\in \\mathbb{R}^C\\) 为可学习放缩变量，初始值通常设置为 1，\\(\\beta \\in \\mathbb{R}^C\\\
    ) 为可学习平移变量，初始值通常设置为 0。实例归一化的计算公式如下：\n\n\\(E_{nc}[X] = \\frac{1}{H \\times W} \\\
    sum_{h=1}^H \\sum_{w=1}^W X_{h,w} \\quad (7-35)\\)\n\n\\(\\text{Var}_{nc}[X] =\
    \ \\frac{1}{H \\times W} \\sum_{h=1}^H \\sum_{w=1}^W (X_{h,w} - E_{nc}[X])^2 \\\
    quad (7-36)\\)\n\n\\(Y_{h,w} = \\frac{X_{h,w} - E_{nc}[X]}{\\sqrt{\\text{Var}_{nc}[X]\
    \ + \\epsilon}} \\tag{7-37}\\)\n\n\\(Z_{n,h,w} = Y_{n,h,w} \\times \\gamma + \\\
    beta \\tag{7-38}\\)\n\n实例归一化在图像风格迁移等图像生成任务中表现出色，能够有效地提升生成图像的质量和保持风格一致性。它可以保持每个样本图像实例之间的独立性，不受通道和批大小的影响。但是如果特征图用到了通道之间的相关性，该方法就不适用了。\n\
    \n#### 4. 组归一化\n\n组归一化（Group Normalization）[7] 用来解决当批大小较小时批归一化效果较差的问题。层归一化虽然不依赖批大小，但是在卷积神经网络中直接对当前层所有通道数据进行规一化也并不理想。组归一化将通道方向分组，然后在每个组内做归一化，使得一个数据样本在同一组内的所有通道的均值为\
    \ 0，方差为 1。计算步骤与批归一化一样，但是不考虑批大小，即与批大小无关。\n\n给定一个批大小为 N 的样本集合 \\(X \\in \\mathbb{R}^{N\
    \ \\times H \\times W \\times C}\\) 作为输入，\\(E_{ng}[X]\\) 是沿着批方向在每个通道组内计算得到的均值，\\\
    (\\text{Var}_{ng}[X]\\) 是沿着批方向在每个通道组内计算得到的方差，\\(\\epsilon\\) 是一个很小的数，防止分母为零，\\\
    (\\gamma \\in \\mathbb{R}^C\\) 为可学习放缩变量，初始值通常设置为 1，\\(\\beta \\in \\mathbb{R}^C\\\
    ) 为可学习平移变量，初始值通常设置为 0，其中 \\(G\\) 为分组数。组归一化的计算公式如下：\n\n\\(E_{ng}[X] = \\frac{1}{(C/G)HW}\
    \ \\sum_{c=gC/G+1}^{(g+1)C/G} \\sum_{h=1}^H \\sum_{w=1}^W X_{h,w,c} \\tag{7-39}\\\
    )\n\n\\(\\text{Var}_{ng}[X] = \\frac{1}{(C/G)HW} \\sum_{c=gC/G+1}^{(g+1)C/G} \\\
    sum_{h=1}^H \\sum_{w=1}^W (X_{h,w,c} - E_{ng}[X])^2 \\tag{7-40}\\)\n\n\\(Y_{h,w,(gC/G+1):(g+1)C/G}\
    \ = \\frac{X_{h,w,(gC/G+1):(g+1)C/G} - E_{ng}[X]}{\\sqrt{\\text{Var}_{ng}[X] +\
    \ \\epsilon}} \\tag{7-41}\\)\n\n\\(Z_{n,h,w} = Y_{n,h,w} \\times \\gamma + \\\
    beta \\tag{7-42}\\)\n\n其中，\\(g \\in \\mathbb{N}, g=0, \\cdots, G-1\\)。可以发现，当 \\\
    (G\\) 等于 1 时，其等价于层归一化；当 \\(G=C\\) 时，其等价于实例归一化。\n\n#### 5. 权重归一化\n\n权重归一化（Weight\
    \ Normalization）将权值 \\(w\\) 分为一个方向分量 \\(v\\) 和一个范数分量 \\(g\\)，使用优化器分别优化这两个参数，如下所示：\n\
    \n\\(w = \\frac{g}{\\|v\\|} v \\tag{7-43}\\)\n\n其中 \\(v\\) 是与 \\(w\\) 同维度的向量，\\\
    (\\|v\\|\\) 是欧氏范数，因此 \\(v\\) 决定了 \\(w\\) 的方向；\\(g\\) 是标量，决定了 \\(w\\) 的长度。由于 \\\
    (\\|w\\| = |g|\\)，因此这一权重分解的方式将权重向量的欧氏范数进行了固定，从而实现了正则化的效果。\n\n然后优化方向分量：\n"
