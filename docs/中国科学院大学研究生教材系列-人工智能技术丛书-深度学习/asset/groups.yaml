    常困难，因为 GAN 需要在两个互相对抗的模型之间进行训练，这样的过程往往容易导致训练不稳定和模式崩溃等问题。为了解决这些问题，研究人员从不同角度对 GAN
    进行了优化，主要的优化方式包括限定条件优化、迭代式生成优化和结构优化。


    # 5.2.1 限定条件优化


    原始 GAN 的生成器只考虑优化生成数据的相似性，而没有考虑其他一些有用的条件限制，如指定特定类别的图像生成、具有某些特定属性的图像生成等。通过加入一些限定条件，可以让生成器产生更多样、更有价值的数据。例如，如果希望
    GAN 生成属于特定类别的图像，可以在训练 GAN 时加入额外的标签信息，如一个手写数字图像的分类标签，并将这些标签输入生成器，那么生成器的目标就不仅仅是产生逼真的图像，还应该去满足类别这一约束条件，其他约束也类似。在这种情况下，GAN
    的目标就是通过生成器和判别器不断对抗，找到生成数据的最优解（符合目标约束条件的最优解），以达到模仿真实数据的目的。代表性的限定条件优化工作包括 CGAN[3]
    和 InfoGAN[4]。接下来，对这两个代表性工作进行介绍以加深对限定条件优化的理解。


    # 1. CGAN


    CGAN[3] 的中心思想是可以控制 GAN 生成样本，减少随机性。在 CGAN 中，生成器 G 接受一个噪声向量 z 和一个条件 y（通常是一个标签）为输入，它的任务是生成一个具有特定条件的图像，它的表现会在与判别器
    D 的对抗中被衡量。D 的任务是给定一个图像，判断它是真实的（来自真实数据集）或者是虚假的（由 G 生成的），如图 5-4 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_163_0.png)


    图 5-4 CGAN 示意图'
  - '[PAGE 164]


    CGAN 的目标函数如下：


    ```

    \min_G \max_D V(D, G) = E_{x \sim p_{data}(x)}[\log D(x|y)] + E_{z \sim p_z(z)}[\log
    (1 - D(G(z|y)))] \quad (5-4)

    ```


    目标函数中的 \( E_{x \sim p_{data}(x)}[\log D(x|y)] \) 表示在给定条件 \( y \) 的情况下当样本采样自真实数据集时判别器能够准确判别其为真的期望，\(
    E_{z \sim p_z(z)}[\log (1 - D(G(z|y)))] \) 表示在给定条件 \( y \) 和输入噪声 \( z \) 的情况下通过生成器生成的样本数据被判别器判别为假的期望。


    因此，CGAN 在训练过程中可用于生成具有特定属性的图像。例如，在手写数字图像生成实验中，在指定图像类别的情况下，可以分别生成类别为 0~9 的手写数字图像，如图
    5-5 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_164_0.png)


    图 5-5 CGAN 生成的手写数字图像（每一行表示一类）


    # 2. InfoGAN


    InfoGAN[4] 不仅可以生成高质量的样本，还可以从生成的样本中理解和学习数据分布中的隐含变量并将其分解成独立的特征。这种独立的特征包括一些与数据分布相关的因素，如旋转角度、颜色和形状等。


    InfoGAN 的网络结构和 GAN 相似，但是在输入和输出上有一些变化，如图 5-6 所示。


    ![](img/57b180d92f84b0150a5b5e4fc7583b76_164_1.png)


    图 5-6 InfoGAN 的结构


    InfoGAN 主要由以下 4 个部分组成。


    +   1）输入部分：与 CGAN 相同，InfoGAN 的输入包括一个随机噪声变量 \( z'' \) 和一个条件变量 \( c \)，其中条件变量称为“已知变量”。


    +   2）生成器：生成器的作用是将输入的随机噪声变量 \( z'' \) 和条件变量 \( c \) 转换成一张图像，并尽可能使生成的图像与真实图像相似。具体来说，生成器会将输入的两种变量转换成一种不连续的变量
    \( x \)，这意味着生成器输出的图像会因为各种条件变量的变化而产生明显的变化。


    +   3）判别器：判别器的作用是判断输入的图像是真实的还是生成的。在 InfoGAN 中，判别器除了输出一个二进制的真假结果外，还会输出一个表示判决结果可信度的概率值。


    +   4）分类器：在 InfoGAN 中，还配备了一个用于学习特征提取的分类器。这个分类器会从'
  - '[PAGE 165]


    生成器的输出中提取特征，并将特征分解为可解释的约束 c。这个过程就是 InfoGAN 提供的“信息推断”部分，用于学习数据分布中的隐含因素并将其分解成为独立的特征。


    InfoGAN 的目标函数如下：


    $$ \min_c \max_\theta V_i(D, G) = V(D, G) - \lambda I(c; G(z, c)) \quad (5-5)
    $$


    与原始 GAN 相比，该目标函数增加了一项 \(\lambda I(c; G(z, c))\)，这一项代表的是 c 与生成器的输出 G(z, c) 之间的互信息。这一项越大，表示
    c 与 G(z, c) 越相关。


    在训练过程中，InfoGAN 在生成数据的同时，学习如何去操纵潜在空间中的特定因素，以生成特定的图像或数据，直观的解释就是，如果 c 的每一个维度对输出都有明确的影响，那么分类器就可以根据
    x 返回原来的 c。如果 c 对输出没有明显的影响，那么分类器也无法返回原来的 c。假设希望生成手写数字图像，并希望能够控制数字的倾斜角度，那么在 InfoGAN
    中，就可以将手写数字类别（Categorical）作为一个固定输入条件，将倾斜角度（Rotation）和宽度（Width）编码为一个随机噪声变量，生成器可以利用这些变量生成不同类别、特定倾斜角度和宽度的手写数字图像，如图
    5-7 所示。


