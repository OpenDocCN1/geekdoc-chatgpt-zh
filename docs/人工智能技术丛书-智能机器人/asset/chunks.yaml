    美国 NASA 基于 ROS 开发的 Robonaut2 已经进入国际空间站工作，如图 2-26a 所示。百度 Apollo 无人车也是基于 ROS 开发的，如图
    2-26b 所示。ROS 系列作为机器人操作系统已经成为机器人开发的重要组成部分，更多元化的应用正从想象化为现实。


    ![](img/image_143.jpg)


