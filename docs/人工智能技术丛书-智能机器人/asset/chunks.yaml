- raw: '1）灵巧手性能评价：灵巧性、可靠性和抓取能力是衡量灵巧手性能的三大要素，不同应用场景各有侧重。在工厂的货物搬运中，灵巧手需具备高抓取能力；在复杂工况中，对灵巧手的可靠性要求较高；在日常家庭应用中，需要综合兼顾这三方面的要素。


    ①灵巧性：由自由度和执行器数量共同决定，可分为全驱动和欠驱动两种方式。自由度数目越高，灵巧手能实现的抓取动作越多样。根据《手部姿态估计方法综述》，人手共有26个自由度，其中手指和手腕分别有20个和6个自由度。现有灵巧手方案主要实现各手指关节的旋转自由度和拇指向内闭合的自由度。执行器数量决定了能独立控制的自由度数目。全驱动灵巧手每个自由度都能独立控制，灵活性更高。根据多项数据显示，智元机器人的单手具有12个自由度和7个执行器，特斯拉一代机器人具有11个自由度和6个执行器，而Shadow协作灵巧手具有24个自由度和20个执行器。


    ②抓重比：抓重比是衡量灵巧手抓取能力的重要指标，指灵巧手垂直抓握物体的质量与自身质量的比值。人的单手质量约为体重的0.58%，假设一位70kg的成年人（单手质量约为0.4kg）单手可以抓起一个5kg的物体，抓重比超过12。目前，机器人灵巧手的抓重比远小于人手。根据Shadow
    Hand产品手册，Shadow灵巧手质量为4.3kg，可抓取5kg的物体，抓重比约为1.2。


    ③可靠性：指灵巧手在长时间运作和各种条件下性能稳定、故障率低。以目前广泛使用的绳驱方式为例，其在大负载下的功能实现和使用寿命与人手有较大差距，实现高可靠性需要更多的执行器或更复杂的传感方案。


    2）性能与成本的博弈：驱动、传动和传感装置是灵巧手的三大组成要素，共同决定其性能和成本。灵巧手通过驱动装置提供动力和扭矩，经过传动装置控制手指运动位置，传感装置感知并反馈内外部信息，三者协作实现抓取功能。


    ①从场景出发的结构选型：灵巧手的极致性能和成本不可兼得。要实现精确控制和高抓取能力，需要选用高性能的驱动、传动和传感方案。例如，Agility灵巧手专注于工厂装卸货等简单任务，其灵巧手仅为简单的夹具，而下半身需要跨越障碍，因此设计重点在下半身。Shadow灵巧手主要用于航空航天、核能工业、生物医药等领域，其驱动端采用微型直流电机和气动柔性驱动（PMA），传动端通过两组腱和一个PMA控制每一个自由度。多项数据显示，Shadow灵巧手使用六轴陀螺仪、加速度计、角度传感器、力矩传感器、触觉传感器、电流传感器和温度传感器等共计129个传感器，因此成本最高达80.1万元人民币。


    ②人形机器人灵巧手的实用性需求：设计需模仿人手的尺寸和形状，受限于空间和质量。过重的灵巧手会影响其操控性，过大的尺寸不利于与人交互。例如，达闼人形机器人Ginger广泛用于接待等场景，其7自由度灵巧手能够完成握手、抓取、操作工具等精细动作，且尺寸与人手类似，亲人性强；而Shadow灵巧手宽13.5cm，高44.8cm，重4.3kg，尺寸约为人手的两倍，亲人性较差，因此主要应用于科研等特种场景。


    （4）市场现状


    1）国产灵巧手有较大的价格优势。


    ①国外灵巧手的价格及应用领域：由于灵巧手技术壁垒较高，国外一些灵巧手技术先进，但设计难度大，零部件多，因此价格昂贵，通常用于科研领域。例如，Shadow灵巧手的报价约为220万元/只。用于假肢领域的仿生灵巧手虽然灵活程度稍差，但价格也相对较低，如德国的Bebionic仿生灵巧手价格至少为32万元/只。


    ②国内灵巧手的价格优势：国内灵巧手生产商包括因时机器人、浙江强脑科技、思灵机器人、蓝胖子机器智能等。其中，浙江强脑科技的BrainRobotics仿生灵巧手主要应用于假肢行业，标准版价格为10.8万元/只。因时机器人是国内商业级五指灵巧手的龙头企业，其灵巧手与特斯拉灵巧手具有类似的关节数和相同的电机数目，目前价格为5万元/只。未来，国内灵巧手生产商有望凭借成本价格优势进入特斯拉等人形机器人本体生产商的供应链。国内外灵巧手对比见表7-1。


    表7-1 国内外灵巧手对比


    ![](EPUB/images/image_575.jpg)


    2）国内灵巧手可实现灵活抓取。


    ①人手的抓取操作：人手的运动具有极高的灵活性，能够执行各种需要抓握力的任务。人手有十三种基本功能，其中抓取操作包括勾拉、侧捏、动态操作、球形抓握、球形指夹握、柱状抓握、二指夹捏和多指夹捏八种，如图7-29所示。


    ![](EPUB/images/image_576.jpg)


    图7-29 人手的抓取操作


    ②因时灵巧手的灵活抓取：虽然国外灵巧手在性能上高于国内灵巧手，如Shadow灵巧手比因时灵巧手关节更多、自由度更高、传感器更多，但国内的因时灵巧手在功能上也能够实现灵活抓取，可以复现人手的主要抓取操作。以因时灵巧手为代表的国内灵巧手能够满足人形机器人对灵巧手的基本要求，有望凭借价格优势实现一定的市场占有率。因时灵巧手的灵活抓取如图7-30所示。


    ![](EPUB/images/image_577.jpg)


    图7-30 因时灵巧手的灵活抓取


    （5）有代表性的先进灵巧手的实现方案


    1）智元灵巧手实现方案：融合连杆与齿轮结合的方案。智元机器人的单个灵巧手指可实现摆动和弯曲的动作设计且融合连杆及齿轮传动方案。


    手指左右摆动：通过连杆系统实现。驱动组件位于掌心部位，连接多个传动连杆，这些连杆的另一端连接到每根手指的根部。手指根部通过基座结构与手掌主体相连。当驱动组件产生顺时针的驱动力时，传动连杆带动右侧手指逆时针摆动，左侧手指顺时针摆动，实现手指的“并拢”动作。该设计通过一个驱动组件控制多根手指的摆动，节约了空间，提高了结构紧凑性。可选方案中，连杆传动可以替换为腱-轮传动，输出轴通过传动带带动指根连接的转动件转动，实现指关节左右摆动。智元灵巧手手指左右摆动示意图如图7-31所示。


    ![](EPUB/images/image_578.jpg)


    图7-31 智元灵巧手手指左右摆动示意图


    手指弯曲：由齿轮和轴承部件传动完成。专利设计了两节指关节弯曲方案（对应2个主动自由度）。近指根关节转动和指中关节弯曲的实现步骤如下。


    步骤①驱动模组安装：在手掌内埋设驱动模组，驱动模组末端连接齿轮机构。


    步骤②齿轮结构：采用“L”型排布的两个齿轮。第一齿轮直接与驱动模组连接，第二齿轮与第一齿轮啮合并内嵌驱动轴，通过齿面啮合改变输出力矩方向。


    步骤③驱动轴：第二齿轮中心镂空，嵌入一根驱动轴，带动驱动件和主体结构的转动连接点，实现指根关节和指中关节的弯曲。


    步骤④指关节转动：指关节根部结构中带有镂空结构，供驱动件嵌入，伴随驱动件转动带动指根关节和指中关节的弯曲。


    传感和控制：传动轴部位安装有电位计，用于检测驱动轴的转动角度，并将其转化为电信号反馈给驱动模组，从而控制手指的弯曲角度。指中关节的上端与指尖关节相连，但为非同轴设置，当指中关节受指根带动转动时也会带动指尖关节转动。


    高级抓取功能：一侧指中关节配置了驱动电机，能够带动一侧指中关节进一步转动，实现指尖关节的二次弯曲，以便于抓取物品。指中关节的电机同样配备电位计，能够检测驱动电机的输出轴角度和指尖关节的转动角度。同时，指尖关节上还设置了触觉传感器，提供更精确的操作反馈和控制。智元灵巧手手指间关节细节如图7-32所示。


    ![](EPUB/images/image_579.jpg)


    图7-32 智元灵巧手手指间关节细节


    2）特斯拉灵巧手技术路线。


    电机驱动：特斯拉灵巧手采用电机驱动。根据驱动方式的不同，灵巧手可以分为电机驱动式和气动驱动式。电机驱动是目前多指灵巧手的主流驱动方式，特斯拉灵巧手采用空心杯电机。驱动源（如电机）为灵巧手的活动提供动力，是影响灵巧手体积和质量的重要因素。为了减小电机尺寸，特斯拉Optimus和优必选Walker的灵巧手都采用了空心杯电机。特斯拉Optimus灵巧手空心杯关节位置如图7-33所示。


    ![](EPUB/images/image_580.jpg)


    图7-33 特斯拉Optimus灵巧手空心杯关节位置


    内置式设计：灵巧手结构可分为外置式和内置式。外置式灵巧手的电机放置在手掌外，而内置式灵巧手的电机则安装在手掌内。随着电机尺寸的减小，灵巧手逐渐从外置式发展为内置式。特斯拉Optimus的灵巧手为内置式，控制电机和传感器信号接收器均位于手掌内部。我国优必选Walker机器人的灵巧手也是内置式，实现了模块化设计，显著增强了灵巧手的互换性和可维护性，降低了人形机器人的维护成本。然而，内置式设计对电机尺寸要求更高，空心杯电机因此成为首选。


    腱绳传动：灵巧手按传动机构可分为腱绳传动、齿轮传动和连杆传动。特斯拉灵巧手采用腱绳传动，模仿人手肌腱的工作方式。腱绳传动灵巧手具有控制灵活、结构简单、柔性高等优点。特斯拉灵巧手通过配备蜗轮蜗杆的空心杯电机拉动金属腱绳，带动手指关节运动。特斯拉灵巧手金属腱绳如图7-34所示。


    ![](EPUB/images/image_581.jpg)


    图7-34 特斯拉灵巧手金属腱绳


    欠驱动：尽管全驱动灵巧手能够更好地模仿人手运动，但因为每个手指关节都能主动控制，但目前大多数灵巧手采用的是欠驱动设计。特斯拉灵巧手也是欠驱动，通过6个电机实现11个自由度。欠驱动灵巧手是电机数量少于自由度数目，一个电机控制多个关节；全驱动灵巧手则是电机数量与自由度数目相等，每个电机控制一个关节。


    **7.3.3**


    **躯干和四肢结构**


    在人形机器人的设计中，躯干和四肢的结构设计是确保其能够支持所有预期活动的关键，同时必须保持足够的机械强度和灵活性。这不仅要求机器人的动作模拟人类的自然运动，还必须确保在各种操作环境下的稳定性和耐久性。


    1）生物力学模仿：人形机器人的躯干和四肢设计深受人体生物力学的启发。通过研究人类的运动机制，设计师能够将这些生物力学原理应用于机器人的结构设计中，使机器人的动作更加符合自然规律。这种模仿不仅提高了机器人动作的自然度，还增强了执行复杂任务时的效率和流畅性。例如，通过模拟人类关节的结构和功能，可以设计出能够灵活移动且具有高度自适应性的机械关节，从而使机器人能够执行更为复杂的手臂和腿部运动。特斯拉Optimus系列人形机器人的演变如图7-35所示。


    ![](EPUB/images/image_582.jpg)


    图7-35 特斯拉Optimus系列人形机器人的演变


    2）结构优化：为了确保人形机器人的躯干和四肢在日常使用中能够承受负载和冲击，达到高强度和耐用性的要求，运用计算机辅助设计（CAD）和有限元分析（FEA）技术进行结构优化是至关重要的。CAD提供了精确的三维建模环境，使设计师能够细致地构建机器人各个部件，并进行详细的修改和调整以达到预期的设计标准。FEA用于模拟结构在各种负载条件下的响应，包括静态负载、动态负载和疲劳分析等。通过FEA，设计师可以预测材料在实际使用中可能出现的失效模式，并据此调整设计，避免潜在的结构问题。例如，通过分析机器人躯干在承受重物时的应力分布，可以优化支撑结构，确保机器人在执行举重等高负载任务时的安全性和稳定性。


    3）材料的选择和应用：在人形机器人的躯干和四肢的设计中，选择合适的材料同样关键。高性能材料如轻质合金、高强度塑料和复合材料不仅减轻了机器人的整体重量，还提供了必要的强度和柔韧性。这些材料的选择应基于其性能特性及与机器人设计要求的匹配度，如重量强度比、抗腐蚀性以及加工和维护的便利性。


    **7.3.4**


    **材料选择与制造技术**


    在人形机器人的设计和制造中，选用合适的材料和采用先进的制造技术是至关重要的，这直接影响到机器人的功能性、耐用性以及成本效率。本节详细介绍人形机器人躯干和肢体的材料选择与制造技术。


    （1）材料选择 选择适当的材料对确保机器人结构的强度、重量和灵活性至关重要。以下是几种常用于人形机器人制造的关键材料。


    1）轻质高强度材料：如铝合金、钛合金和碳纤维复合材料。这些材料因其优越的强度对重量比而被广泛应用于机器人的主要承载结构和移动部件中，有助于减轻整体重量，提高能效和机动性。


    2）工程塑料：如聚碳酸酯（PC）和聚酰胺（PA，俗称尼龙），这些材料不仅重量轻，而且具有良好的耐磨性和冲击强度，常用于机器人的外壳和非承重部件。


    3）橡胶和软质材料：用于机器人的接触面，如手掌和脚底，以增加摩擦和缓冲能力，提高机器人处理物体时的精确性和稳定性。


    （2）制造技术 采用先进的制造技术不仅可以提高生产效率和精度，还可以降低成本和提高机器人部件的性能。以下是一些关键的制造技术。


    1）3D打印技术：也称为增材制造，能够直接从数字模型生成复杂形状的部件，这对于制造复杂、定制化的机器人结构尤其有用。3D打印允许设计师快速迭代设计，同时减少材料浪费。


    2）数控机床加工技术：对于需要高精度和高耐用性的金属部件，如关节和驱动系统的核心组件，通常采用数控机床加工。这种技术能够精确地切割和塑形金属材料，确保部件符合严格的公差和规格要求。


    3）注塑成型技术：对于大批量生产的塑料部件，注塑成型是一种成本效益高、效率高的制造技术。它可以快速生产出均质且复杂的塑料部件，适用于机器人的外壳和内部支架。


    4）表面处理技术：包括喷涂、电镀和阳极氧化等，用以改善部件的外观、耐腐蚀性和表面硬度。这些处理不仅提升了机器人的美观和耐用性，还提高了其抗环境侵蚀的能力。


    ?xml version="1.0" encoding="utf-8"?


    ## **7.4**


    ## **人形机器人大脑和小脑**


    在人形机器人的设计中，大脑和小脑不仅是智能处理的中心，也是实现高级功能和复杂任务的关键。机器人大脑负责感知、决策和控制，而机器人小脑则确保运动的精确、稳定和协调。这两者的协同工作使得人形机器人在执行任务时更加自主和高效。本节将继续介绍人形机器人大脑和小脑部分的内容。


    **7.4.1**


    ## **人形机器人大脑**


    人形机器人大脑是一个高度复杂的算法系统，它的核心功能包括智能感知、决策规划、智能控制和智能存储，如图7-36所示。


    ![](EPUB/images/image_583.jpg)


    图7-36 机器人大脑的核心功能


    **1.机器人大脑的发展**


    过去几十年里，机器人大脑的发展已成为科技进步的一个重要里程碑。早期的机器人主要依赖简单的预设指令和基本的反射机制进行操作，但现代机器人则装备了高度复杂的认知系统。


    智能控制阶段（20世纪90年代—21世纪）：引入自适应控制算法、模糊逻辑和神经网络等技术使机器人能够根据环境的变化自动调整控制策略。


    机器学习和人工智能时代（21世纪）：将机器学习技术应用于机器人控制，使机器人能够从经验中学习，提高其性能和适应性，能够在更少的人为干预下独立完成任务，构建机器人具身智能。同时，机器人之间的协同也越来越多地被研究和应用。机器学习和人工智能时代的多机器人智能系统如图7-37所示。


    ![](EPUB/images/image_584.jpg)


    图7-37 多机器人智能系统


    这些机器人系统的进步主要得益于“大模型”和“具身智能”等先进技术，使得机器人能够处理大量数据、做出复杂决策，并与人类及其他机器人有效互动。


    （1）大模型 大模型指拥有超大规模参数（通常在十亿个以上）、超强计算资源的机器学习模型，能够处理海量数据，完成各种复杂任务，如自然语言处理、图像识别等。一般大模型会支持多任务学习，具有一定的通用性。


    1）语言大模型：通过在大规模文本数据集上的预训练，学习了丰富的语言表示和语境关系，从而具备了理解和生成人类语言的能力。这些模型在以下几个方面表现出色。


    ①复杂对话系统：它们能参与并维持具有上下文连贯性的对话，理解对话意图，并做出适当反应。


    ②机器翻译：通过理解多种语言的语法结构和文化差异，这些模型能够进行高质量的语言翻译。


    ③文本生成：利用其强大的语言生成能力，语言大模型能够创作具有文学价值的作品，如诗歌、散文和短篇小说，其内容富有创意且语言流畅。


    目前发布的有代表性的语言大模型见表7-2。


    表7-2 有代表性的语言大模型


    ![](EPUB/images/image_585.jpg)


    2）视觉大模型：通过在大量图像数据上进行训练，这些模型学习了识别和解释图像内容的能力。它们在图像处理领域的应用包括以下几方面。


    ①物体识别和分类：从复杂的背景中识别出不同的物体，并将它们分类到预定义的类别中。


    ②场景重建：利用从多个图像捕获的信息，这些模型可以重建三维场景，提供更全面的空间理解。


    ③高级视觉理解：不仅识别图像中的物体，视觉大模型还能理解这些物体之间的关系，如它们的交互作用和相对位置，以及场景的整体语境。


    目前发布的视觉大模型包括以下几种。


    1）分割领域：SAM（Segment Anything Model）。由Meta AI Research于2023年4月5日发布。SAM是一个通用的图像分割模型，能够在不同场景和应用中实现高效的图像分割。该模型的亮点在于其强大的适应性和鲁棒性，可以处理各种复杂的图像内容，广泛应用于医学影像分析、自动驾驶以及图像编辑等领域。


    2）文字生成视频：Sora。由OpenAI于2024年2月15日在网络上发布了一段利用文字提示生成视频的演示demo。Sora能够将文字描述转换为动态视频内容，展示了强大的多模态生成能力。该模型的发布标志着视频生成技术的重大突破，能够在影视制作、虚拟现实、教育和娱乐等方面带来新的可能性。


    3）文字生成图片：Stable Diffusion 3。由StabilityAI开发的文字生成图像的视觉大模型，于2024年2月22日发布。Stable Diffusion 3通过改进的扩散模型技术，实现了更高质量的图像生成，能够生成清晰、细腻且富有创意的图像。该模型在艺术创作、广告设计、游戏开发等方面有着广泛的应用前景。Stable Diffusion 3生成的图如图7-38所示。


    ![](EPUB/images/image_586.jpg)


    图7-38 Stable Diffusion 3生成的图


    2024年3月26日，腾讯提出了一种新颖的框架AniPortrait，用于通过音频和参考肖像图像生成高质量的动画。AniPortrait提供了三种不同的模式，极大地扩展了音频与图像结合的应用场景。


    （2）具身智能 具身智能指的是一种智能系统或机器能够通过感知和交互，与环境进行实时互动的能力。这种智能不仅依赖于传统的计算和数据处理，还包括对物理世界的感知、理解和操作。具身智能系统能够在复杂、多变的真实环境中执行各种任务，并在这些任务的执行过程中不断学习和优化自身的行为和决策。


    具身智能具有以下核心特点。


    1）感知能力：具身智能系统配备了多种传感器，如视觉传感器、触觉传感器、声学传感器等，用于感知环境中的各种信息。这些传感器使机器人能够感知环境的变化、识别物体和检测障碍物，从而做出相应的反应。


    2）物理交互：具身智能系统能够与环境进行物理交互。这意味着它们不仅能“看”和“听”，还能“做”。例如，机器人可以抓取物体、移动、跳跃或与其他物体互动。这种交互能力使得机器人能够执行一系列复杂的任务，如搬运货物、装配零件或提供服务。'
