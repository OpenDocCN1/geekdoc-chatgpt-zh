    内参是相机的固有参数，用于描述相机内部特性和成像方式，包括焦距、主点位置、畸变等信息。焦距决定了相机的视场大小和焦深。其中，视场大小指的是相机所能够捕捉到的景物范围，也可以理解为相机能够拍摄到的画面的宽度和高度。焦距越大，视场就越窄，相机所能够捕捉到的范围就越小；焦距越小，视场就越宽，相机所能够捕捉到的范围就越大。焦深指的是在一张照片中被认为是清晰的区域的范围。焦距越大，焦深就相对较浅，只有相对较近的物体才会被清晰地呈现在照片中；焦距越小，焦深就相对较深，离相机较远和较近的物体都能够被清晰地呈现在照片中。主点位置表示成像中心的位置，畸变则描述了相机镜头造成的图像形变。这些内参是相机固有的，不会随着不同场景或环境的改变而变化。


    外参是相机的外部参数，用于描述相机在世界坐标系中的位置和姿态，包括相机的平移向量和旋转矩阵，表示相机在三维空间中的位置和姿态。通过外参，可以将相机坐标系与世界坐标系建立联系，从而实现将相机图像映射到真实世界中的目标位置。


    相机标定是确定这些标定参数的过程，旨在建立相机图像与真实世界之间的准确映射关系。标定参数反映了空间中某物点与成像点的对应关系，它们是相机标定的结果。通常，相机的标定包括内参和外参的标定。内参通常由相机制造商提供，但在制造过程中会存在一定的误差。因此，为了获得更准确的内参，通常也会进行相机标定。简单来说，相机标定通过拍摄已知几何形状的校准板或物体，并分析其在图像中的投影来推导出内参。


    因为理想的成像点与实际成像点并不重合，存在像差，所以会产生畸变。畸变是单色光学像差中的一种，也是唯一不会改变成像清晰度的像差。不同波长畸变曲线不同，也是需要进行标定的，注意需要考虑到标定波长应与相机工作波长一致。


