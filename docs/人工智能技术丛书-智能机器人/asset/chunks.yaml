- raw: '人们可以听到的声音频率为20Hz～20kHz，即为可听声波，超出此频率范围的声音，即20Hz以下的声音称为低频声波，20kHz以上的声音称为超声波，一般说话的频率范围为100Hz～8kHz。超声波在穿透液体和固体方面具有很强的能力，特别是在不透明的固体中，它可以穿透几十米的深度。当超声波遇到杂质或界面时，会产生显著的反射形成回波。当超声波与活动物体相遇时，会产生多普勒效应。超声波传感器利用超声波的传播和回波时间来测量物体与传感器之间的距离。具体而言，传感器发射超声波脉冲，并通过接收器接收回波，然后根据回波的时间延迟计算物体到传感器的距离。超声波传感器在机器人中广泛应用于障碍物检测和距离测量，它能够检测机器人前方的障碍物并采取相应的避障措施。此外，超声波传感器还可以用于测量物体的位置、高度和形状等信息。


    超声波传感器系统由发送器、接收器、控制部分和电源部分组成，如图3-47所示。发送器通常采用直径约为15mm的陶瓷振子。这个振子将电振动能量转换为超声波能量，并将其辐射到空中。除了用作穿透式超声波传感器的发送器外，陶瓷振子也可以用作接收器。当陶瓷振子接收到超声波时，它会产生机械振动，并将其转换为电能，作为传感器接收器的输出，以便检测发送的超声波。如果接收到发送器发送的超声波，振子就会以发送超声波的频率振动，从而产生与超声波频率相同的高频电压。然而，这种电压非常微弱，因此需要使用放大器进行放大。控制部分用于控制超声波的发送和接收过程，以及处理接收到的信号。电源部分为整个系统提供所需的电能。


    ![](EPUB/images/image_219.jpg)


    图3-47 超声波传感器系统


    一般市场上出售的超声波传感器可分为专用型和兼用型。专用型传感器的发送器用于发送超声波，接收器用于接收超声波。兼用型传感器则将发送器和接收器合二为一，既可以发送超声波，又可以接收超声波。超声波传感器的谐振频率（中心频率）可以是23kHz、40kHz、75kHz、200kHz、400kHz等。较高的谐振频率意味着超声波波长更短，因此可以提供更高的空间分辨率，即能够更准确地检测和定位目标物体。


    超声波传感器测距的原理十分简单，由超声波的发射端发射一束超声波，在发射的同时，计时开始，发射出去的超声波在介质中传播，声波具有反射特性，当遇到障碍物时就会反射回来，当超声波的接收端接收到反射回来的超声波时，计时停止。介质为空气时，声速为340m/s，根据记录的时间*t*，发射位置与障碍物之间的距离*s*\=340*t*/2。超声波测距的原理就是已知超声波在介质中的传播速度，测量出从发射到接收所需的时间，根据测量出的时间来计算出障碍物的距离，与回声定位原理一样。


    超声波传感器一般适用于较短的作用距离，普通的有效探测距离通常在5～10m。然而，超声波传感器会存在一个最小探测盲区，一般在几十毫米左右。由于声波的特性，超声波传感器受环境影响较小，因此在各种使用场合都可以应用。


    MB1014是专为行人和对象检测而设计的人体距离传感器，如图3-48所示。它具有以下特点：供电范围为2.5～5.5V，适用于不同的电源供应情况。MB1014采用了极小的外形设计，可以在有限的空间条件下提供对特定距离对象的接近检测。该传感器支持在同一环境中最多同时运行20个传感器。这意味着用户可以将多个MB1014传感器集成到单个系统中，而且很少或几乎不会受到其他超声波传感器经常发生的相互干扰的影响。这种抗干扰能力确保了系统的稳定性和可靠性。


    ![](EPUB/images/image_220.jpg)


    图3-48 MB1014人体距离传感器


    MaxBotix人体测距传感器MB1014能够与其他附近的传感器同时工作，并且具有快速的响应能力。它的对象距离采集时间约为2.5s，对象距离恢复时间约为1.5s。这意味着它能够在短时间内迅速感知和获取目标物体的距离信息。它适用于近距离对象检测，并可应用于多种应用领域，如接近区域探测、行人检测和机器人自动导航等。


    **3.3.2**


    **激光传感器**


    激光传感器和激光雷达都是基于激光技术的传感器。激光传感器利用激光器作为光源进行测距，其工作原理如下：首先，激光二极管将激光脉冲对准目标进行发射。目标反射后，激光向各个方向散射。其中一部分散射光返回传感器接收器，并经过光学系统成像到雪崩光敏二极管上。雪崩光敏二极管是一种内部具有放大功能的光学传感器，能够检测极其微弱的光信号。通过记录和处理从光脉冲发出到返回被接收所经历的时间，就可以确定目标的距离。激光传感器具有测量范围广、响应速度快的优点，并且在远距离测量时无须使用反光板。然而，由于光速非常快，激光传感器必须非常精确地测定光的传输时间。


    VL53L0X是一款微型激光测距模块，基于TOF原理，如图3-49所示，产品规格为4.4mm×2.4mm×1.0mm，支持2m以内的距离测量。


    ![](EPUB/images/image_221.jpg)


    图3-49 VL53L0X微型激光测距模块


    根据激光雷达实现对场景的扫描是否依赖机械部件，可将其分为机械激光雷达和固态激光雷达。目前，机械激光雷达仍然占据主流地位，而固态激光雷达则被认为是未来的趋势。机械激光雷达具有控制激光发射角度的旋转部件，而固态激光雷达则通过光学相控阵列、光子集成电路以及远场辐射方向图等电子部件来控制激光的发射角度。然而，纯固态激光雷达对技术力的要求高，相对而言机械激光雷达因为发展较早、技术相对成熟，因此出现了一批基于转镜方案、微振镜方案、棱镜方案的混合固态激光雷达（或者称为半固态激光雷达）。机械激光雷达与混合固态激光雷达的区别见表3-8。


    表3-8 机械激光雷达与混合固态激光雷达的区别


    ![](EPUB/images/image_222.jpg)


    机械运动通常需要设计相应的机械部件并且需要足够大的预留空间，所以机械式激光雷达通常体积大，相对而言混合固态激光雷达体积会小一点。


    激光雷达根装测距原理可以分为TOF（包括直接测距DTOF、脉冲测距PW-ITOF和连续波测距CW-ITOF）和调频连续波（Frequency Modulated
    Continuous Wave，FMCW）。FMCW激光雷达使用连续发射的调频连续波激光束，该激光束的频率在一段时间内连续变化（调频），当激光束照射到目标物体并返回时，通过测量频率变化的差异来计算目标物体的距离。FMCW激光雷达的代表公司主要有Mobileye、Aeva、Blackmore等，而TOF路线是大多数厂商采用的技术方案。激光雷达的发射部件和接收部件在同一系统中的工作原理示意图如图3-50所示。激光通过扫描器单元形成光束角度偏转，光束与目标作用形成反射/散射的回波。当接收端工作时，可产生原路返回的回波信号光子到达接收器，接收端通过光电探测器形成信号接收，经过信号处理得到目标的距离、速度等信息或实现三维成像。


    ![](EPUB/images/image_223.jpg)


    图3-50 激光雷达工作原理


    以主流的基于TOF原理的激光雷达系统为例，按照部件来划分，可分为发射模块、接收模块、扫描模块、控制及处理模块，如图3-51所示。


    ![](EPUB/images/image_224.jpg)


    图3-51 基于TOF原理的激光雷达系统


    其中，发射模块、接收模块和扫描模块，不同激光雷达厂商的技术路线差异较大，当前业界关于混合固态、固态激光雷达的讨论，其实主要是围绕扫描模块进行。


    因为目前激光雷达多用于Robotaxi领域（即自动驾驶出租车或无人驾驶出租车领域），整理得到相关的信息汇总如图3-52所示。


    激光雷达的实际使用方面，主要关心的有三点：性能、可靠性和成本。性能一般指测距能力、精度、视场角、分辨率、刷新帧率、体积、功耗等参数，可靠性就是能不能通过车规，而成本则是决定激光雷达能否大规模量产的关键因素。


    **1.机械激光雷达**


    机械激光雷达的发射系统和接收系统存在宏观意义上的转动，即通过不断旋转发射头，将速度更快、发射更准的激光从“线”变成“面”，并在竖直方向上排布多束激光，形成多个面，从而达到动态扫描并动态接收信息的目的。机械激光雷达可以实现大角度扫描，但是装配较为困难、扫描频率偏低、体积大、机械结构复杂、成本很难降低。


    例如，速腾聚创Ruby Plus新一代128线激光雷达，相比前代及同类产品，其测距能力高出20%；高分辨率与强大测距能力结合，远场环境信息更丰富，可轻松检出240m内的黑色车辆和85m长的车道线；采用全新的机械式激光雷达架构与技术平台，相比前代体积与质量减少50%，功耗减少33%。其产品参数如图3-53所示。


    在激光雷达产品参数指标中，点频是一个可以综合全面反映激光雷达感知能力的一个指标。点频指的是激光雷达每秒完成探测并获取的探测点的总数目，也称为出点数或每秒点数，类似摄像头总像素的概念。用点频来描述，既不能靠降低刷新帧率取巧，又能避免视场角大小和不均匀带来的“最高分辨率”这样片面的描述。根据定义，可以得到点频的计算公式：点频（points/s）=水平方向平均点数×垂直方向平均点数×刷新频率（Hz）。与相机的像素一样，点频越多，说明激光雷达对目标物的感知能力越好，点频是激光雷达的核心性能指标。


    ![](EPUB/images/image_225.jpg)


    ▲图3-52 Robotaxi领域内激光雷达信息汇总


    ![](EPUB/images/image_226.jpg)


    图3-53 速腾聚创Ruby Plus128线激光雷达产品参数


    **2.MEMS混合固态激光雷达**


    （微机电系统MEMS）采用微振镜结构进行光束偏转（其他方案还包括棱镜和旋转镜），具有平整光学镜面的微振镜将机械式激光雷达的旋转部件微缩，提升了集成度。因此，MEMS激光雷达并不是严格意义上的固态激光雷达，而被称为“混合固态激光雷达”。二维扫描的MEMS微振镜是关键器件，主要通过电热效应、静电效应、电磁效应和压电效应驱动，实现MEMS微振镜发生偏转。此外，相控阵技术是MEMS实现激光雷达功能的另一个关键，其基本原理是：MEMS的微小移动产生光程差，多个具有不同相位的出射光束在远场干涉形成光束偏转，原理如图3-54所示。


    ![](EPUB/images/image_227.jpg)


    图3-54 MEMS混合固态激光雷达原理


    目前，二位扫描的MEMS激光雷达领域正在快速发展。部分汽车厂商也会选择MEMS激光雷达产品，如小鹏汽车、极氪汽车、长城汽车等。代表产品有速腾聚创M平台激光雷达M1，其利用二维MEMS智能芯片扫描，性能超过传统一维电机扫描的模式。其产品参数如图3-55所示。


    ![](EPUB/images/image_228.jpg)


    图3-55 激光雷达M1产品参数


    基于棱镜方案的混合固态激光雷达，代表产品有大疆的Livox觅道Mid-360，开启了混合固态激光雷达360°立体感知新篇章。凭借小巧的体积，Mid-360的安装布置更加灵活。同时，Mid-360充分考虑了移动机器人对导航、避障等升维感知的需求，兼容室内外场景。产品规格参数如图3-56所示。


    ![](EPUB/images/image_229.jpg)


    图3-56 激光雷达Mid-360产品规格参数


    固态激光雷达与机械激光雷达有着明显的区别。固态激光雷达通过使用光学相控阵列、光子集成电路以及远场辐射方向图等电子部件来代替机械旋转部件，从而实现对激光发射角度的调整。这种技术改变了传统机械激光雷达的结构，使得固态激光雷达更加紧凑和轻便。光学相控阵列由许多微小的发射器组成，每个发射器都可以独立地调整激光的相位，从而改变激光束的方向。光子集成电路用于控制和调节光学相控阵列中的发射器，以实现精确的激光束控制。此外，远场辐射方向图用于指导激光束的发射方向，确保激光雷达能够准确地扫描和接收目标信息。


    由于内部结构的差异，机械激光雷达和固态激光雷达在尺寸和价格上有所不同。机械激光雷达由于需要机械旋转部件，因此体积较大，总体上价格也更昂贵。然而，机械激光雷达相关技术较为成熟，具备较高的测量精度，能够实现精确的目标检测和距离测量。相比之下，固态激光雷达尺寸较小、成本较低，但测量精度相对较低。尽管固态激光雷达在测量精度方面可能略有牺牲，但其紧凑的尺寸和低成本使其在许多应用领域中具有潜力，特别是对于需要轻便和经济的方案而言。


    **3.OPA激光雷达**


    高系统集成度的光学相控阵列技术能够满足激光雷达在无人驾驶、无人机等领域全固态、小型化的发展需求。如图3-57所示，激光器功率均分到多路相位调制器阵列，光场通过光学天线发射，在空间远场相干叠加形成一个具有较强能量的光束。经过特定相位调制后的光场在发射天线端产生波前的倾斜，从而在远场反映成光束的偏转，通过施加不同相位，可以获得不同角度的光束形成扫描的效果，无须机械扫描。


    ![](EPUB/images/image_230.jpg)


    图3-57 OPA激光雷达原理


    代表性的OPA激光雷达产品有洛微科技纯固态大视场近场激光雷达D系列（Diversity Series），如图3-58所示。D系列产品是基于芯片级LuminScan™光束控制和扫描技术研发的纯固态大视场近场激光雷达，自研的固态扫描技术在非常紧凑的体积内实现大视场角，同时实现了产品的超高性价比。D系列支持软件定义分辨率和ROI扫描优化，是自动驾驶和工业自动化中补盲、避障、定位、测绘（SLAM）和3D建模等应用的完美选择。该产品符合人眼安全标准、抗日光干扰，可广泛适配室内外各种场景应用的需要。其部分产品参数为距离：17m，FOV：107°×77°，角分辨率：0.38°×0.38°。


    ![](EPUB/images/image_231.jpg)


    图3-58 洛微科技纯固态大视场近场激光雷达D系列


    **4.Flash激光雷达**


    Flash激光雷达采用类似照相机的工作模式，感光元件与普通相机不同，每个像素点可以记录光子飞行时间信息。发射的面阵激光照射到目标上，目标对入射光产生散射，由于物体具有三维空间属性，从而照射到物体不同部位的光具有不同的飞行时间，被焦平面探测器阵列探测，输出为具有深度信息的“三维”图像。Flash激光雷达原理如图3-59所示。


    ![](EPUB/images/image_232.jpg)


    图3-59 Flash激光雷达原理


    代表性的Flash激光雷达有Ouster公司的OS系列产品。以往采用机械旋转式激光雷达的自动驾驶公司的感知算法是专门针对该类雷达进行开发的，当替换成固态激光雷达后，其相应的感知算法需要推倒重来，传感器方案也要重新考虑，这在某种程度上带来了很大的技术迁移难度。旧金山激光雷达公司Ouster将这种形态的产品称为数字激光雷达（Digital
    Li-DAR），这家公司已经将这一概念转化成了实际的产品。数字激光雷达就是对激光雷达进行全半导体化的设计，将原来激光雷达产品内部的发射器、接收器等上千种光电器件固化到芯片之中，实现了固态的形式。在此基础上，Ouster在激光雷达内部加入了旋转装置，让其能够在360°方向上实现扫描，即旋转起来的固态激光雷达。OS系列激光雷达如图3-60所示。


    ![](EPUB/images/image_233.jpg)


    图3-60 OS系列激光雷达


    **3.3.3**


    **红外传感器**


    红外传感器是一种利用红外线作为介质的测量系统，根据其探测机理可分为光子探测器和热探测器两种类型。红外传感器不仅可以测量物体的热量，还可以检测物体的运动，因其只测量红外辐射，而不发射红外辐射，所以被称为被动红外传感器。在红外光谱中，所有物体都会以某种形式发出热辐射，而这种辐射对于人眼来说是不可见的，但可以通过红外传感器进行探测。红外传感技术在现代科技、国防和工农业等领域得到了广泛应用。


    红外传感器系统由发射器和接收器组成。发射器通常是一个红外发光二极管，它会发射出特定波长的红外光。接收器则是一个红外光电二极管，它对发射器发出的相同波长的红外光具有敏感性。当发射器发出红外光并照射到接收器上时，接收器会对接收到的红外光做出响应。这种响应通常体现为接收器的电阻和输出电压的变化。红外光照射到光敏二极管上时，光的能量会激发光敏二极管内部的电子。这些激发的电子将导致光敏二极管内部电阻的变化。当接收到的红外光较强时，光敏二极管的电阻会相应地减小；当接收到的红外光较弱时，光敏二极管的电阻会增加。通过测量光敏二极管的电阻变化或输出电压的变化，可以推断出红外光的强度。根据红外光的强度，可以计算出物体与传感器之间的距离。


    为了进一步提高测距准确性和性能，一些红外传感器系统还利用图像传感器（如CCD或CMOS）来处理发射与接收的时间差的数据，由控制电路（Control Circuit）进行信号处理器处理后计算出物体的距离。控制电路是红外传感器系统的核心部分，它负责控制发射器和接收器的操作，并处理接收到的电信号。控制电路通常包括信号调理电路、放大器、滤波器和模数转换器等，其主要功能是处理接收到的红外线信号，并计算目标物体与传感器之间的距离。红外传感器测量距离远，具有很高的频率响应，适用于恶劣的工业环境中。


    建大仁科RS-HW-N01吸顶式红外探测器为高稳定性被动红外探测器，如图3-61所示。它采用了先进的信号分析处理技术，具有超高的探测和防误报性能。当有入侵者通过探测区域时，探测器将自动探测区域内人体的活动，若有动态移动现象，则会产生报警。该探测器采用吸顶式安装，安装高度在2.5～6m，安装高度在3.6m时，可形成直径6m的探测范围。该探测器具有以下特点：


    1）360°全方位覆盖，全面防范，无死角探测，自上而下形成圆锥形空间全面防控。


    2）设备内部使用8-bit低功耗CMOS处理器，采用先进的信号分析处理技术，配备较高性能的传感信号处理集成电路，具有超高的探测和防误报性能。


    3）具有抗RFI干扰（20～1000MHz，如移动通信）的功能。


    4）设备具有自动温度补偿功能，在温度-10～50℃、相对湿度≤95%的环境内工作，不会出现凝露现象。


    5）具有报警延时和延时报警的功能，在具体使用中用户可根据情况，将报警持续时间调整为30s、10s或5s；延时报警则通过管理软件进行设置修改。


    ![](EPUB/images/image_234.jpg)


    图3-61 建大仁科RS-HW-N01吸顶式红外探测器


    **3.3.4**


    **里程计**


    里程计是机器人导航和定位中的重要传感器之一。它用于测量机器人在空间中的运动，并估计机器人相对于起始位置的位置和姿态变化。在机器人的运动过程中，里程计通过记录轮子或足部的旋转运动来计算机器人的位移。通过监测轮子或足部的转动角度和运动距离，里程计可以推断机器人在水平面上的位置和朝向的变化。通俗的说，要实现机器人的定位与导航，就需要知道机器人行进的距离和方向。


    里程计的工作原理是基于运动学模型和运动传感器的数据。通过测量轮子或足部的转动角度，并结合轮子或足部的尺寸信息，里程计可以计算出机器人在平面上的位移。一般情况下，里程计采用编码器或惯性测量单元（IMU）来获取运动数据，从而实现位移计算。'
