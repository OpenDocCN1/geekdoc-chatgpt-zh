    # 坐标系变换与DH参数


    如图5-11所示，关节`n+1`的坐标轴为`x[n]y[n]z[n]`，旋转角度为`θ[n+1]`；`α[n+1]`为`z[n]`轴和`z[n+1]`轴的夹角，`a[n+1]`为`z[n]`轴和`z[n+1]`轴之间的距离，`d[n+1]`为`z[n]`轴相邻两条公垂线的距离。定义好参数后，接下来看一下如何将坐标系`x[n]y[n]z[n]`变换到坐标系`x[n+1]y[n+1]z[n+1]`。


    如图5-12所示，首先绕`z[n]`轴旋转`θ[n+1]`，使得`x[n]`轴和`x[n+1]`轴相互平行；接着沿着`z[n]`平移`d[n+1]`距离，使得`x[n]`轴和`x[n+1]`轴共线；然后沿着`x[n]`轴平移`a[n+1]`距离，使得坐标系`x[n]y[n]z[n]`和坐标系`x[n+1]y[n+1]z[n+1]`的原点重合；最后，将`z[n]`轴绕`x[n+1]`轴旋转`α[n+1]`，使`z[n]`轴和`z[n+1]`轴共线。通过以上步骤，坐标系`x[n]y[n]z[n]`变换到了坐标系`x[n+1]y[n+1]z[n+1]`。旋转操作可以用旋转矩阵表示，平移操作用平移向量`[x,
    y, z]^T`表示。将旋转矩阵和平移向量合并到一起就构成了齐次变换矩阵


    ![](EPUB/images/image_352.jpg)


    式中，`R`为3×3的旋转矩阵；`t`为3×1的平移向量。因此齐次变换矩阵`T`的大小一般为4×4，最后一行固定为`[0, 0, 0, 1]`。


    ![](EPUB/images/image_353.jpg)


    图5-12 坐标系变换过程


    因此，根据旋转矩阵的公式，坐标系`x[n]y[n]z[n]`到坐标系`x[n+1]y[n+1]z[n+1]`的变换矩阵为


    ![](EPUB/images/image_354.jpg)


    类似的，可以得到从基座坐标系到机械臂末端执行器的变换矩阵为


    ![](EPUB/images/image_355.jpg)


    以上过程也称作Denavit-Hartenberg建模，简称`DH`建模，`θ`、`α`、`d`、`a`称作`DH`参数。`DH`模型是目前最流行的机器人运动学模型，它通过定义关节之间的坐标系变换关系，进而得到机器人基座坐标系到末端执行器坐标系之间的变换关系。当机械臂确定时，`DH`参数中的`d`、`a`值也就确定了。因此，对于具体的某一个机械臂而言，只要知道每个关节的旋转角度就能通过上述的变换公式求出机械臂末端执行器相对于基座坐标系的位姿。例如，图5-13所示为`UR5`机械臂模型，`DH`参数见表5-1，表5-1中的未知变量只有`θ[1]`～`θ[6]`，也就是每个关节的旋转角。


