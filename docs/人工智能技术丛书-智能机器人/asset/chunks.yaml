    # 第5章 机械臂的运动控制


    本章首先回顾了机械臂的发展历程，并对机械臂的不同种类做了简要介绍。随后，分析了机械臂的组成结构。最后介绍了机械臂的运动学模型，包括正运动学和逆运动学。


    ```

    ?xml version="1.0" encoding="utf-8"?

