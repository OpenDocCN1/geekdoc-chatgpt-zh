    `PR2`有两条手臂，每条手臂七个关节，手臂末端是一个可以张合的夹爪；`PR2`依靠底部的四个轮子移动，在头部、胸部、肘部、夹爪上分别安装有高分辨率摄像头、激光测距仪、惯性测量单元、触觉传感器等丰富的传感设备。在`PR2`的底部有两台八核计算机作为机器人各硬件的控制和通信中枢，并且都安装了`Ubuntu`和`ROS`系统。`PR2`价格高昂，2011年零售价高达40万美元，现主要用于研究。随着`PR2`正式对外发布，Willow
    Garage公司也正式推出`ROS`正式开发版，即`ROS1.0`。`ROS`秉承开源的原则，与全球开发者一同推动机器人事业的发展。可见，`PR2`是`ROS`中元老级的机器人平台，所有软件代码均依托于`ROS`，并在`ROS`社区中开源，为学习、应用`ROS`提供了丰富的资源。


    目前`ROS`生态系统包含世界范围内成千上万的用户，横跨桌面娱乐项目到大型工业自动化系统等诸多领域。`ROS`的版本控制见表2-1。


