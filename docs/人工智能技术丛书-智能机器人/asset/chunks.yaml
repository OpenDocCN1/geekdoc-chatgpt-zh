    机器人是一个系统工程，通常一个机器人运行操作时要开启很多个`Node`，上述小海龟案例即需要同时开启 4 个终端窗口。为了方便启动大型程序，ROS 提供了一个命令能一次性启动`Master`和多个`Node`。该命令是：


    ![](img/image_108.jpg)


    `roslaunch`命令首先会自动检测系统的`roscore`有没有运行，即确认节点管理器是否在运行状态中，如果`Master`没有启动，那么`roslaunch`就会首先启动`Master`，然后再按照`launch`的规则执行。`launch`文件里已经配置好启动的规则，所以`roslaunch`就像是一个启动工具，能够一次性把多个节点按照预先的配置启动起来，减少在终端中一条一条输入指令的麻烦。


