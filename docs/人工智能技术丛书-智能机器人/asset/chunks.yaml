    **CHAPTER 6**


    # **第6章**


    ## **四足机器人**


    随着驱动、智能控制等技术的高速发展，相对而言更加灵活机动的四足机器人成了研究热点。足式机器人相对于传统轮式机器人具有良好的灵活性，能适应各种路况地形，同时具有更好的平衡性能。目前，我国的足式机器人行业也有了长足发展，涌现出了宇树机器狗、云深处机器狗、小米CyberDog、蔚蓝AlphaDog等产品，低成本地制造一台运动能力很强的多足机器人在中国已经不再是难事。


    本章主要介绍了四足机器人发展历史和目前行业内四足机器人现状；随后对四足机器人运动控制方面进行讲解，讲述了四足机器人运动学正逆解问题；最后，用一个ROS仿真示例进行演示。


    ?xml version="1.0" encoding="utf-8"?


    ## **6.1**


    ## **四足机器人简介**


    本节主要介绍四足机器人发展历史以及四足机器人发展现状两部分内容。


    **6.1.1**


    **四足机器人发展历史**


    相较于传统的四轮式和履带式机器人，四足机器人有着无与伦比的优势，它在复杂环境中具有更高的机动性，对于抢险、救灾和探险任务具有比传统四轮机器人更大的潜力。为了实现更智能的机器人，首要任务是让机器人能够像人或动物一样自由行动。


    有记载的第一部四足机器人是由Chebyshev于1870年建立的，如图6-1所示。图6-1a是Chebyshev的构造，包括姿态轨迹的构形（固体线）和摆动轨迹的构形（虚线）。它由一个基于四个杆的装置组成，当Link1绕轴A1旋转时，足端P1在T1部分遵循准直线轨迹，T2部分离开地面；图6-1b是Chebyshev的平面草图，在这种机械结构中，四条腿按对角线划分为两组，使机器人既能够站立，又能够行走和小跑。然而，这种早期的行走机器人缺乏适应地形的机制，因此只能在平坦的地面上运动。


    ![](EPUB/images/image_432.jpg)


    图6-1 Chebyshev示意图


    另一个里程碑式的四足机器人是L.A.Rygg于1893年在美国专利局申请的一种骑马机，如图6-2所示。这台机器允许骑手通过踏板为机器提供动力，并利用连杆和曲柄传动来推动机器前进。这被认为是历史上第一项涉及足式机器的发明专利。


    ![](EPUB/images/image_433.jpg)


    图6-2 骑马机专利图


