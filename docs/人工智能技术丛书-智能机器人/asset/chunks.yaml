    工作空间下相关文件的解释如下。


    1）`src`：代码空间（`source space`）放置功能包源码。

    2）`build`：编译空间（`build space`）放置编译过程中产生的中间文件。

    3）`devel`：开发空间（`development space`）放置编译完成后的可执行文件环境变量配置的脚本。

    4）`install`：安装空间（`install space`）和`devel`放置的东西差不多，在`ros2`中与`devel`合并了。


