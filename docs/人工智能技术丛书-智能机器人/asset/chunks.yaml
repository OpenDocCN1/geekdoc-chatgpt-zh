    结构光的优点主要有：


    1）方案成熟，相机基线可以做的比较小，方便小型化。


    2）资源消耗较低，单帧IR图就可计算出深度图，功耗低。


    3）主动光源，夜晚也可使用。


    4）在一定范围内精度高，分辨率高，分辨率可达1280×1024像素，帧率可达60fps。


    散斑结构光的缺点与结构光类似：


    1）容易受环境光干扰，室外体验差。


    2）随检测距离增加，精度会变差。


    由于结构光深度图在边缘会有一些空洞或者一些其他的杂点，通常评估精度的时候更多的关注中间区域，81%FOV指的就是0.9倍的宽（Width）和0.9倍的高（Height），如图3-34所示。


    兴趣区域（Region of Interest，ROI）指在图像或场景中选择的感兴趣的特定区域。由于边缘会存在畸变，通常也是选取中间的某些区域进行划分，如图3-35所示。


