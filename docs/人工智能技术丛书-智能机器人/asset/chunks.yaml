    TOF 测距基本原理为


    ![](img/image_204.jpg)


    具体而言，就是通过给目标连续发射激光脉冲，然后用传感器接收反射光线，通过探测光脉冲的飞行往返时间来得到确切的目标物距离。TOF 原理与基于三角测量原理的结构光/双目是有明显区别的，如图
    3-39 所示。


    ![](img/image_205.jpg)


    图 3-39 三角测量原理与 TOF 原理对比


    TOF 分为直接测光飞行时间的 DTOF 和通过检测一定手段调制后的光波的相位偏移等来间接测量的 ITOF。


    ### (1) DTOF


    DTOF 系统构成：①单光子雪崩二极管（Single Photon Avalanche Diode，SPAD）。SPAD 是 DTOF 系统中的核心光电转换组件，具有非常高的光电转换效率，能够对单个光子到达接收器件的事件进行响应。这意味着一个光子就足以触发光电响应，使得
    DTOF 系统具有非常高的灵敏度。SPAD 的高灵敏度使得系统能够接收和检测来自被测物体反射的弱光信号。②时间数字转换器（Time to Digital Converter，TDC）。TDC
    是用于测量光飞行时间的关键器件，它可以将光信号接收到的时间转换为数字信号，实现对光飞行时间的精确测量。TDC 的核心技术是时间相关单光子计数法，通过记录光信号的到达时间和触发时间之间的时间差，计算出光信号的飞行时间。TOF
    系统工作原理如图 3-40 所示。


    一束脉冲波（包含很多个光子）被发射后，它会打到目标物体并返回到接收器件。由于 SPAD 的高灵敏度，当一群光子到达接收器件时，由于各种因素的影响，光子的到达并不是瞬间发生的，而是在一个持续的、相对较短的时间内发生。SPAD
    会记录下这段时间内光子到达的情况，形成一个直方图，其中记录了每个瞬间到达接收器件的光子数量。通过分析直方图，可以确定直方图的峰值所对应的主要到达时刻，即认定为脉冲波返回的主要光子到达时刻。这个主要到达时刻与脉冲波的发射时刻之间的时间差即为光的飞行时间。根据光的速度和飞行时间的关系，可以进行测距计算，从而实现直接测量的手段。


    DTOF 对器件本身的性能有很高的要求，现阶段 DTOF 整体的图像分辨率并不是很高。一个主要原因就是这种 SPAD 做成集成的阵列在工艺上有一定难度，不过近些年
    DTOF 的成像分辨率在提升，有在朝着可大规模推广的方向发展。


    ![](img/image_206.jpg)


    图 3-40 TOF 系统工作原理


    ### (2) ITOF


    ITOF 系统构成：TX 发射组件，它包括垂直腔面发射激光器（Vertical Cavity Surface Emitting Laser，VCSEL）和一个匀光器件（Diffuser）。VCSEL
    是主动光源，用于发射激光光束；RX 接受组件，通常采用 ITOF 图像传感器作为接收器件；驱动电路，用来提供高频控制时序的电路，用于控制发射组件的工作模式和调制方式。


    发射组件 TX 包括 VCSEL 和一个匀光源的匀光器件，主要作用是发射具备特定调制模式（高频正弦波、脉冲波等）的波形。VCSEL 会同时发射多个激光点，经过匀光器件之后，多个激光点会变成一个均匀的面光源照射到场景中，最终结果是
    TX 发射了在时间上有一定特性的均匀面光源照射到场景中。一般情况下会配合驱动电路发射一个高频的主动光源信号，常见的包括高频的正弦波或者高频的脉冲波，如图 3-41
    所示。


    ![](img/image_207.jpg)


    图 3-41 波形调制


    ITOF 图像传感器有独特设计的像素结构，会根据不同抽头以一定时序分时工作，其工作原理如图 3-42 所示。


    ![](img/image_208.jpg)


    图 3-42 ITOF 图像传感器的工作原理


    微透镜汇聚光，让更多的光子被感光元件接收，CMOS 相机的本质就是一个光电转换器，光子打到感光区域，进入曝光阶段：光电转换激发出光电子，这些被激发出的光电子被收集装置（CMOS
    是电容）收集起来，得到电压信号，并经过后端一系列放大和数字化处理之后得到灰度值。ITOF 基本与之相似，差异之处在于激发出的光电子会被分时收集。在一个 ITOF
    曝光周期内，光电子会被分成四份，对应图 3-42 中`A`、`B`、`C`、`D`四个抽头，每个抽头相当于一个不同的电荷收集装置。


    一个像素可能是由四个抽头构成的，但并不是说一个像素被分成了四份。光电转换部分不变，只是在后端进行处理时，分成四份去输出。ITOF 的一个像素和 CMOS 的一个像素还是一样的，并不是说把一个像素物理的分成了四份。


    ITOF 根据调制方法的不同，一般可以分为两种：脉冲调制（Pulsed Modulation，PM）和连续波调制（Continuous Wave Modulation，CWM）。脉冲调制需要高精度时钟进行测量，且需要发出高频高强度激光，目前大多采用检测相位偏移的办法来实现
    TOF 功能。简单来说就是，发出一道经过处理的光，碰到物体以后光反射回来，根据相位偏移结算得到来回的时间，因为已知光速和调制光的波长，所以能快速准确计算出到物体的距离。


