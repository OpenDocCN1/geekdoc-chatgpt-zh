    **2.结构光深度相机**


    结构光深度相机是一种利用结构光技术实现深度感知的相机系统。简单来说，它通过投射特定的光纹或编码图案等到场景上，并利用相机捕捉被光纹或编码图案反射、变形后的图像，从而推断物体的深度信息。结构光深度相机与双目深度相机获取深度信息的基本原理相似，都是三角测量原理（图3-26）：已知底边与两底角求三角形的高，底边*AB*为基线长度，底角∠*B*为针孔成像模型，底角∠*A*为激光发射器模型。


    ![](EPUB/images/image_184.jpg)


    图3-26 三角测量原理


    常见的结构光系统包括点结构光、线结构光和面结构光系统。


    （1）点结构光系统 激光器发射一束激光打在物体上，然后通过相机成像，如图3-27所示，拍到一个光点，从光点上解算出物体上一点的三维信息，为了获取物体完整的三维信息，一般会让物体和相机做相对运动。让物体在相机的视野范围内进行运动，通过捕捉物体在不同位置或角度的成像，获得物体不同部分的三维信息，这种方法适用于相机固定不动的情况。通过激光振镜让激光在物体上进行扫描，通过激光在不同位置扫描到的光点，可以获取物体表面各个点的三维信息，这种方法适用于相机和物体都保持相对静止的情况。


    ![](EPUB/images/image_185.jpg)


    图3-27 点结构光系统


    （2）线结构光系统 线结构光系统使用激光器发射一条或多条光线，将这些光线投射到物体表面上形成一系列线条图案。为了获取物体完整的三维信息，同样也可以让物体和相机做相对运动，或者依次打出多个激光平面，对多个光条进行扫描，如图3-28所示。


    ![](EPUB/images/image_186.jpg)


    图3-28 线结构光系统


