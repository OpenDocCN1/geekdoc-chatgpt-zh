    #### 3）交互感知

    交互感知是指机器人通过观察和分析人类的行为模式来优化自身的响应策略。这包括读取人类的面部表情、身体语言和交互历史，从而实现更加自然和流畅的互动体验。


    `R3M`（`Reusable Representations for Robotic Manipulation`）旨在通过对视觉数据的深度理解来提高机器人的操作能力和智能。它特别关注利用3D环境的时空信息，以改善机器人在现实世界中的操作精度和效率。`R3M`通过分析视频或实时摄像头数据中的3D动态，学习物体的运动模式和交互。这种对3D空间动态的理解能力允许机器人预测物体的未来状态，并根据这些预测来优化其动作。该模型通过整合时间上的连续帧来捕捉物体的运动特征，使机器人能够理解和预测物体在时间上的演变。这种时空特征的提取对于机器人执行复杂任务（如抓取移动物体）至关重要。`R3M`结合了强化学习和模仿学习技术，不仅使机器人能够从先前的成功经验中学习，还能模仿人类操作者的行为。这样的学习策略大大加速了机器人的训练过程，并提高了其任务执行的灵活性和适应性。


    `R3M`在学习时重点关注3D环境中的普遍物理规律和运动特征，其学习到的模型能够在多个不同任务之间迁移和适用，这使得`R3M`特别适合需要机器人快速适应新任务的场景。`R3M`使用`Ego4D`数据集进行预训练，该数据集包含多种人类活动视频和自然语言注释，通过这种预训练，`R3M`能够泛化机器人感知表征。模型通过掩码自回归模仿学习视觉-语言-动作的表征，根据语言指令和视觉观察生成对应的机器人动作，从而实现机器人跨模态的指令跟随和技能学习。`R3M`模型结构如图7-45所示。


