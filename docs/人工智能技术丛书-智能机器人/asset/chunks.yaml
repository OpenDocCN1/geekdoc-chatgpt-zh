- raw: '①Perceiver-Actor。Perceiver-Actor是一种专为机器人操控任务设计的多任务Transformer模型，通过集成感知和行动功能来处理多样的操控任务，旨在通过一个统一的框架处理从低级控制到高级决策的各种任务，从而提高机器人在复杂环境中的自主性和灵活性。Perceiver-Actor的核心特性是将感知（Perceiver）和行动（Actor）功能整合到一个统一的模型中。感知部分负责从高维度的传感器输入（如视觉、触觉等）中提取关键信息，而行动部分则根据感知结果生成适当的动作指令。这种集成设计减少了模块间的通信延迟，提高了处理速度和效率。模型基于Transformer架构，这使得它能够有效处理序列化数据，并通过自注意力机制捕获输入数据中的长距离依赖关系。这对于理解复杂的场景动态特别重要，如在不断变化的环境中进行物体操控。Perceiver-Actor能够同时处理多种机器人操控任务，包括抓取、移动、装配等。这得益于其灵活的架构和对不同任务共享底层特征的能力。这种多任务处理能力不仅提高了训练效率，还增强了模型对新任务的泛化能力。通过这种统一框架，Perceiver-Actor显著提升了机器人在复杂环境中的自主性和灵活性，使其能够在各种应用场景中表现出色。Perceiver-Actor如图7-51所示。


    ②CLIPORT。CLIPORT基于Ravens模拟器，采用CLIP编码视觉输入为语义特征，以理解任务的抽象概念。它使用Transporter模型来处理空间精确度和位置判断，确保能够准确执行空间操作。通过利用大量的语言指令和动作序列进行模仿学习训练，CLIPORT能够在模拟或真实世界环境中将指令转化为操作动作。它根据语言指令和视觉观察，预测并执行关键帧动作，从而学习复杂的长期技能。CLIPORT具有很强的泛化能力，能够根据不同的指令组合多种技能。这种结合了语言理解和精确空间操作的系统，使得CLIPORT在处理复杂任务时表现出色。通过模拟环境中的训练，CLIPORT可以将这些技能应用到现实世界中，提高了机器人在执行多样化任务时的灵活性和适应性，其基于语言和视觉输入的预测和执行能力，使得机器人能够根据不同任务需求迅速调整和优化其行为策略。这种多模态、多任务的处理框架，使CLIPORT成为一个强大而灵活的机器人操控系统，在复杂环境中展现了卓越的操作性能。CLIPORT模型如图7-52所示。


    4）终身学习：终身学习框架使机器人能够持续学习和适应新的环境和任务，即使在训练初期未曾遇到过的情况下也能有效应对。通过持续的多模态交互学习，机器人能够在开放世界中建立视觉、语言和动作之间的新型映射关系。动态优化与迭代使得机器人可以基于新的观察和交互不断调整和改进自身的学习策略，从而提高其智能和适应性。深度个性化与自我进化则允许机器人根据自身的经验进行自我调整和进化，形成独特的行为模式和解决问题的方式。这种能力使得机器人不仅能够解决当前的问题，还能在面对未知挑战时表现得更加灵活和高效。终身学习框架的应用有助于机器人在长期使用中变得越来越智能，并且能够不断提升其性能和能力。


    ![](EPUB/images/image_599.jpg)


    ▲图7-51 Perceiver-Actor（详见彩插）


    ![](EPUB/images/image_600.jpg)


    图7-52 CLIPORT模型


    **7.4.2**


    **人形机器人小脑**


    小脑是机器人控制系统的关键部分，专注于协调和平衡机器人的运动。它包括人形机器人运动控制算法库、网络控制系统等，用于接收来自大脑的指令，并将其转化为机器人的动作。小脑的功能包括运动规划、姿态控制、动态平衡等。通过实时感知机器人的状态和环境信息，小脑可以调整机器人的动作，使其能够稳定地行走、跑步、跳跃等。小脑还可以根据环境的变化和任务的需求，自动调整机器人的运动策略，以实现更高效和灵活的运动控制。人形机器人小脑模拟了生物小脑的功能，通过复杂的计算和控制算法来优化机器人运动。机器人大脑、小脑示意图如图7-53所示。


    ![](EPUB/images/image_601.jpg)


    图7-53 机器人大脑、小脑示意图


    人形机器人小脑的主要职责和功能如下。


    （1）精确控制 小脑通过高级算法优化机器人动作，确保其运动的流畅性和精确性。主要功能包括以下几个方面。


    1）步态调整：在机器人行走时，小脑实时计算和调整每一步的步幅和步态，以确保行走的稳定性和自然感。它精确控制每一步的长度、速度和方向，使机器人能够适应不同的地形，如平地、斜坡和楼梯。


    2）手臂运动控制：小脑能够协调手臂各个关节，实现流畅且精确的动作，从简单的抓取到复杂的多自由度运动。机器人可以执行精细任务，如操作工具、搬运物品或进行装配工作。


    3）头部运动协调：小脑负责头部的旋转和倾斜控制，确保视觉传感器或其他头部装置能够稳定地捕捉环境信息。这对于机器人导航、目标识别和环境感知至关重要，确保其在动态环境中能够实时调整视角以获取最佳信息。


    （2）平衡调节 小脑持续监控机器人的姿态和地面条件，实时调整机器人的体重分布和姿态，以维持稳定性。具体功能包括以下几个方面。


    1）姿态监控：小脑使用传感器数据（如陀螺仪和加速度计）来监控机器人的姿态，并根据需要进行调整。这些传感器能够实时检测机器人的倾斜角度和加速度变化，帮助其保持平衡。


    2）动态平衡调整：在机器人行走或站立时，小脑能够通过调节各个关节的力矩和位置，来优化体重分布，确保平衡。例如，当机器人搬运重物时，它会调整腿部和腰部的姿态以防止倾倒。


    3）不平坦地形应对：当机器人在不平坦或移动的地面上行走时，小脑可以快速响应并调整姿态，防止跌倒或失衡。通过识别地形变化并迅速调整脚步，机器人能够在崎岖不平的环境中稳定行走。


    （3）自我学习 小脑不仅执行预设的动作程序，还能根据过往经验调整控制策略，提高动作的效率和适应性。自我学习能力具体体现在以下几个方面。


    1）反馈学习：通过不断接收传感器反馈，小脑可以评估每次动作的效果，并根据这些反馈调整未来的动作策略。这种机制类似于人类通过试错过程改进技能的方式。


    2）经验积累：小脑能够记忆和分析机器人在不同环境中的表现，从而优化运动控制。例如，机器人在经过多次尝试后，能够更好地适应斜坡、台阶或其他复杂地形。积累的经验使机器人在面对类似环境时能够迅速调整行动。


    3）动态调整：在任务执行过程中，小脑能够实时调整控制参数，以应对环境的变化或任务的需求。这种动态调整能力使机器人能够在多变的环境中表现出色。例如，机器人可以在搬运过程中根据负载变化调整步态和姿态。


    （4）综合协调 小脑还起到综合协调的作用，确保机器人各部分动作的一致性和协调性。它不仅关注单一关节或肢体的运动，还统筹整个机器人身体的协调。


    1）全身协调：确保机器人在执行复杂动作时，各个部位能够协调一致。例如，在搬运重物时，小脑会协调手臂、躯干和腿部的动作，确保重心稳定。全身协调不仅提高了机器人动作的效率，也减少了因不协调而导致的能量浪费。


    2）多任务处理：在执行多任务时，小脑能够有效分配和调整资源，确保每个任务都能够顺利完成。例如，在行走时同时进行抓取操作，小脑能够平衡行走的稳定性和抓取的精确性。这种多任务处理能力使机器人在复杂环境中能同时完成多个操作，提高工作效率和灵活性。


    人形机器人小脑的运动控制算法库包含如下内容。


    **（1）运动协调算法**


    1）运动规划算法：小脑使用运动规划算法，如逆运动学（Inverse Kinematics，IK）和运动学（Kinematics）算法，来计算机器人关节的角度和位置，从而实现目标动作。逆运动学算法通过目标位置计算所需的关节角度，而运动学算法则通过关节角度计算出机器人末端的空间位置。


    2）姿态控制算法：姿态控制涉及使用比例-积分-微分（PID）控制器和模糊逻辑控制等算法。PID控制器通过调节关节力矩来维持稳定的姿态，而模糊逻辑控制则通过处理非线性和复杂系统中的不确定性，提供更为灵活的控制策略。


    3）动态平衡算法：动态平衡使用零力矩点（Zero Moment Point，ZMP）和模型预测控制（Model Predictive Control，MPC）等算法。ZMP算法确保机器人在运动过程中重心保持在支撑面内，MPC算法则通过预测未来运动状态来进行实时优化，确保机器人在复杂环境中稳定行走。


    4）自我学习机制：自我学习通过强化学习（Reinforcement Learning，RL）和深度强化学习（Deep Reinforcement Learning，DRL）等技术实现。机器人在试错过程中通过奖惩机制优化策略，DRL则结合深度学习和强化学习，提高机器人在高维状态空间中的决策能力。


    **（2）反馈机制**


    1）视觉反馈：通过摄像头捕捉环境信息，实时分析图像数据，帮助机器人感知周围环境和物体，从而调整运动策略。


    2）力反馈：通过力传感器检测接触力和转矩，实时监控和调节机器人与物体之间的交互力，确保动作的精确性和安全性。


    3）位置反馈：通过编码器检测关节角度和位置，实时反馈机器人各部位的位置信息，帮助小脑调整关节角度和运动路径。


    这些运动协调算法和反馈机制，使得小脑在机器人运动控制中发挥了至关重要的作用，确保机器人能够高效、稳定地执行复杂任务，并具备自我学习和适应环境的能力。通过与大脑的协调配合，小脑提升了机器人的整体性能，使其在各种应用场景中表现出色。


    机器人小脑和大脑协同工作才能发挥更优异的性能，需要以下技术支撑。


    1）分布式控制架构：小脑和大脑之间通过高速通信网络进行数据交换和控制指令传递。分布式控制架构确保了系统的响应速度和处理能力，使机器人能够实时调整动作和策略。


    2）云端与本地协同计算：通过云端计算资源，大脑可以处理复杂的计算任务和大规模数据分析，而小脑则负责本地的实时控制和反馈机制。这种结合提高了系统的计算效率和灵活性。


    3）数据同步与协调：小脑和大脑之间的数据同步机制确保了机器人在不同任务和环境中的一致性和协调性。协同工作使得机器人能够在复杂任务中表现出色。


