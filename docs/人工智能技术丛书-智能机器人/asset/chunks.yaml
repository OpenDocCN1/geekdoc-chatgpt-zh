    ### 1.2.1 世界机器人发展历史


    机器人技术的发展历史是与人类历史进程息息相关的，从整体角度看各个国家的机器人发展过程虽然相互联系但又相互区别。不同的历史背景、社会背景引发了各国人们对机器人技术的不同看法，导致了不同的政策和结果，此结果又反过来影响人们的思想和社会历史的发展。


    #### 1. 美国


    美国机器人的发展历程可大致归纳如图 1-2 所示。

    现代通用意义上的第一台工业机器人（图 1-1b）诞生在美国，它是 Unimation 公司于 1962 年研发的。彼时美国处于产能过剩的阶段，尤其是武器、弹药和食品；由于产能过剩带来失业率上涨，政府不支持这一解放劳动力的新兴产业，因此只有几所大学和军工企业开展机器人的研究工作。1966
    年，机器人“科沃”在地中海水下 750m 成功地将丢失的氢弹打捞上岸，凸显了军用机器人无可替代的特殊价值，如图 1-3 所示。

    20 世纪 70 年代后期，美国政府和企业界虽有所重视，但在技术路线上仍把重点放在研究机器人软件及军事、宇宙、海洋、核工程等特殊领域的高级机器人的开发上。这导致日本的工业机器人能够后来居上，并在机器人制造及工业应用方面很快超过了美国，使工业机器人产品在国际市场上形成了较强的竞争力。

    20 世纪 80 年代初，美国迫于竞争的压力，政府和企业界开始重视机器人的研发，并制定了相关政策：一方面鼓励工业界发展和应用机器人，另一方面制订计划、提高投资，增加机器人的研究经费。通过将机器人作为美国再次工业化的特征，机器人技术得以迅速发展。

    20 世纪 80 年代中后期，随着各大厂家相继大规模应用机器人（如美国波士顿动力（Boston Dynamics）公司，其双足、四足机器人如图 1-4 所示）并对机器人的性能要求逐渐提高，第一代机器人的技术性能越来越满足不了实际需要，美国开始生产带有视觉、力觉的第二代机器人，并很快占领了美国
    60%的机器人市场。

