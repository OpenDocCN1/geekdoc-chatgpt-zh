    ![](img/image_210.jpg)


    #### CWM 模式 ITOF 测距原理


    2）CWM 模式 ITOF 测距原理，如图 3-44 所示。


    ![](img/image_211.jpg)![](img/image_212.jpg)![](img/image_213.jpg)


    图 3-44 CWM 模式 ITOF 测距原理


    初始相位π/4 并不是确定的，这里只是为了推导方便。由于物体本身有一定的反射率`η`，会对信号进行调制，偏置也会被调制，另外还有环境光的干扰。


    3）ITOF 系统具有以下特性


    ①精度特性：TOF 系统的测距精度随测量距离的增大线性衰减；抽头输出信号的信噪比直接影响测量精度与深度图质量。

    ②反射率差异：不同色块对 ITOF 工作波段的反射率是不同的，体现在抽头去接收数据时，不同区域抽头对应的信噪比不一样。ITOF 的效果跟抽头的信噪比息息相关。

    ③多径效应：多路信号干扰。可能让抽头获取的信息偏大。

    ④距离模糊：因为发射的正弦波是有周期的，因此会有一个周期性变化的相位，所得到的`d`也是对应于某个周期，即超过一定测量距离之后，ITOF 就会存在距离模糊。通常采取双频调制，即用两个频率的正弦波来调制，这样就对应于一个更大的公共周期，得到一个更大的最大测量距离，以满足实际需求。


