    因此，通过上面四个坐标系的转换可以将一个点从世界坐标系转换到像素坐标系，即


    ![](EPUB/images/image_406.jpg)


    其中，最右边等式的第一个矩阵为相机内参，第二个矩阵为相机外参。一般深度相机（如`realsense D435i`）的内参可以通过官方提供的API直接获取，相机外参可以通过手眼标定得到。


    ![](EPUB/images/image_407.jpg)


