    ### 2. MEMS 混合固态激光雷达


    微机电系统 MEMS 采用微振镜结构进行光束偏转（其他方案还包括棱镜和旋转镜），具有平整光学镜面的微振镜将机械式激光雷达的旋转部件微缩，提升了集成度。因此，MEMS
    激光雷达并不是严格意义上的固态激光雷达，而被称为“混合固态激光雷达”。二维扫描的 MEMS 微振镜是关键器件，主要通过电热效应、静电效应、电磁效应和压电效应驱动，实现
    MEMS 微振镜发生偏转。此外，相控阵技术是 MEMS 实现激光雷达功能的另一个关键，其基本原理是：MEMS 的微小移动产生光程差，多个具有不同相位的出射光束在远场干涉形成光束偏转，原理如图
    3-54 所示。


    ![](img/image_227.jpg)


    图 3-54 MEMS 混合固态激光雷达原理


    目前，二位扫描的 MEMS 激光雷达领域正在快速发展。部分汽车厂商也会选择 MEMS 激光雷达产品，如小鹏汽车、极氪汽车、长城汽车等。代表产品有速腾聚创 M
    平台激光雷达 M1，其利用二维 MEMS 智能芯片扫描，性能超过传统一维电机扫描的模式。其产品参数如图 3-55 所示。


    ![](img/image_228.jpg)


    图 3-55 激光雷达 M1 产品参数


    基于棱镜方案的混合固态激光雷达，代表产品有大疆的 Livox 觅道 Mid-360，开启了混合固态激光雷达 360°立体感知新篇章。凭借小巧的体积，Mid-360
    的安装布置更加灵活。同时，Mid-360 充分考虑了移动机器人对导航、避障等升维感知的需求，兼容室内外场景。产品规格参数如图 3-56 所示。


    ![](img/image_229.jpg)


    图 3-56 激光雷达 Mid-360 产品规格参数


    固态激光雷达与机械激光雷达有着明显的区别。固态激光雷达通过使用光学相控阵列、光子集成电路以及远场辐射方向图等电子部件来代替机械旋转部件，从而实现对激光发射角度的调整。这种技术改变了传统机械激光雷达的结构，使得固态激光雷达更加紧凑和轻便。光学相控阵列由许多微小的发射器组成，每个发射器都可以独立地调整激光的相位，从而改变激光束的方向。光子集成电路用于控制和调节光学相控阵列中的发射器，以实现精确的激光束控制。此外，远场辐射方向图用于指导激光束的发射方向，确保激光雷达能够准确地扫描和接收目标信息。


    由于内部结构的差异，机械激光雷达和固态激光雷达在尺寸和价格上有所不同。机械激光雷达由于需要机械旋转部件，因此体积较大，总体上价格也更昂贵。然而，机械激光雷达相关技术较为成熟，具备较高的测量精度，能够实现精确的目标检测和距离测量。相比之下，固态激光雷达尺寸较小、成本较低，但测量精度相对较低。尽管固态激光雷达在测量精度方面可能略有牺牲，但其紧凑的尺寸和低成本使其在许多应用领域中具有潜力，特别是对于需要轻便和经济的方案而言。


    ### 3. OPA 激光雷达


    高系统集成度的光学相控阵列技术能够满足激光雷达在无人驾驶、无人机等领域全固态、小型化的发展需求。如图 3-57 所示，激光器功率均分到多路相位调制器阵列，光场通过光学天线发射，在空间远场相干叠加形成一个具有较强能量的光束。经过特定相位调制后的光场在发射天线端产生波前的倾斜，从而在远场反映成光束的偏转，通过施加不同相位，可以获得不同角度的光束形成扫描的效果，无须机械扫描。


    ![](img/image_230.jpg)


    图 3-57 OPA 激光雷达原理


    代表性的 OPA 激光雷达产品有洛微科技纯固态大视场近场激光雷达 D 系列（Diversity Series），如图 3-58 所示。D 系列产品是基于芯片级
    LuminScan™光束控制和扫描技术研发的纯固态大视场近场激光雷达，自研的固态扫描技术在非常紧凑的体积内实现大视场角，同时实现了产品的超高性价比。D 系列支持软件定义分辨率和
    ROI 扫描优化，是自动驾驶和工业自动化中补盲、避障、定位、测绘（SLAM）和 3D 建模等应用的完美选择。该产品符合人眼安全标准、抗日光干扰，可广泛适配室内外各种场景应用的需要。其部分产品参数为距离：17m，FOV：107°×77°，角分辨率：0.38°×0.38°。


    ![](img/image_231.jpg)


    图 3-58 洛微科技纯固态大视场近场激光雷达 D 系列


    ### 4. Flash 激光雷达


    Flash 激光雷达采用类似照相机的工作模式，感光元件与普通相机不同，每个像素点可以记录光子飞行时间信息。发射的面阵激光照射到目标上，目标对入射光产生散射，由于物体具有三维空间属性，从而照射到物体不同部位的光具有不同的飞行时间，被焦平面探测器阵列探测，输出为具有深度信息的“三维”图像。Flash
    激光雷达原理如图 3-59 所示。


    ![](img/image_232.jpg)


    图 3-59 Flash 激光雷达原理


    代表性的 Flash 激光雷达有 Ouster 公司的 OS 系列产品。以往采用机械旋转式激光雷达的自动驾驶公司的感知算法是专门针对该类雷达进行开发的，当替换成固态激光雷达后，其相应的感知算法需要推倒重来，传感器方案也要重新考虑，这在某种程度上带来了很大的技术迁移难度。旧金山激光雷达公司
    Ouster 将这种形态的产品称为数字激光雷达（Digital Li-DAR），这家公司已经将这一概念转化成了实际的产品。数字激光雷达就是对激光雷达进行全半导体化的设计，将原来激光雷达产品内部的发射器、接收器等上千种光电器件固化到芯片之中，实现了固态的形式。在此基础上，Ouster
    在激光雷达内部加入了旋转装置，让其能够在 360°方向上实现扫描，即旋转起来的固态激光雷达。OS 系列激光雷达如图 3-60 所示。


    ![](img/image_233.jpg)


    图 3-60 OS 系列激光雷达


    # 3.3.3 红外传感器


    红外传感器是一种利用红外线作为介质的测量系统，根据其探测机理可分为光子探测器和热探测器两种类型。红外传感器不仅可以测量物体的热量，还可以检测物体的运动，因其只测量红外辐射，而不发射红外辐射，所以被称为被动红外传感器。在红外光谱中，所有物体都会以某种形式发出热辐射，而这种辐射对于人眼来说是不可见的，但可以通过红外传感器进行探测。红外传感技术在现代科技、国防和工农业等领域得到了广泛应用。


    ## 红外传感器系统


    红外传感器系统由发射器和接收器组成。发射器通常是一个红外发光二极管，它会发射出特定波长的红外光。接收器则是一个红外光电二极管，它对发射器发出的相同波长的红外光具有敏感性。当发射器发出红外光并照射到接收器上时，接收器会对接收到的红外光做出响应。这种响应通常体现为接收器的电阻和输出电压的变化。红外光照射到光敏二极管上时，光的能量会激发光敏二极管内部的电子。这些激发的电子将导致光敏二极管内部电阻的变化。当接收到的红外光较强时，光敏二极管的电阻会相应地减小；当接收到的红外光较弱时，光敏二极管的电阻会增加。通过测量光敏二极管的电阻变化或输出电压的变化，可以推断出红外光的强度。根据红外光的强度，可以计算出物体与传感器之间的距离。


    为了进一步提高测距准确性和性能，一些红外传感器系统还利用图像传感器（如`CCD`或`CMOS`）来处理发射与接收的时间差的数据，由`Control Circuit`进行信号处理器处理后计算出物体的距离。`Control
    Circuit`是红外传感器系统的核心部分，它负责控制发射器和接收器的操作，并处理接收到的电信号。`Control Circuit`通常包括信号调理电路、放大器、滤波器和模数转换器等，其主要功能是处理接收到的红外线信号，并计算目标物体与传感器之间的距离。红外传感器测量距离远，具有很高的频率响应，适用于恶劣的工业环境中。


    ## RS-HW-N01 吸顶式红外探测器


    建大仁科 RS-HW-N01 吸顶式红外探测器为高稳定性被动红外探测器，如图 3-61 所示。它采用了先进的信号分析处理技术，具有超高的探测和防误报性能。当有入侵者通过探测区域时，探测器将自动探测区域内人体的活动，若有动态移动现象，则会产生报警。该探测器采用吸顶式安装，安装高度在
    2.5～6m，安装高度在 3.6m 时，可形成直径 6m 的探测范围。该探测器具有以下特点：


    1）360°全方位覆盖，全面防范，无死角探测，自上而下形成圆锥形空间全面防控。


    2）设备内部使用 8-bit 低功耗 CMOS 处理器，采用先进的信号分析处理技术，配备较高性能的传感信号处理集成电路，具有超高的探测和防误报性能。


    3）具有抗 RFI 干扰（20～1000MHz，如移动通信）的功能。


    4）设备具有自动温度补偿功能，在温度-10～50℃、相对湿度≤95%的环境内工作，不会出现凝露现象。


    5）具有报警延时和延时报警的功能，在具体使用中用户可根据情况，将报警持续时间调整为 30s、10s 或 5s；延时报警则通过管理软件进行设置修改。


    ![](img/image_234.jpg)


    图 3-61 建大仁科 RS-HW-N01 吸顶式红外探测器


    # 3.3.4 里程计


    里程计是机器人导航和定位中的重要传感器之一。它用于测量机器人在空间中的运动，并估计机器人相对于起始位置的位置和姿态变化。在机器人的运动过程中，里程计通过记录轮子或足部的旋转运动来计算机器人的位移。通过监测轮子或足部的转动角度和运动距离，里程计可以推断机器人在水平面上的位置和朝向的变化。通俗的说，要实现机器人的定位与导航，就需要知道机器人行进的距离和方向。


    里程计的工作原理是基于运动学模型和运动传感器的数据。通过测量轮子或足部的转动角度，并结合轮子或足部的尺寸信息，里程计可以计算出机器人在平面上的位移。一般情况下，里程计采用编码器或惯性测量单元（`IMU`）来获取运动数据，从而实现位移计算。


