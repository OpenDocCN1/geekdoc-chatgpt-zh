    ## 3.2 视觉传感器


    视觉传感器是机器人系统中最常用的传感器之一，它模拟人眼的感知机制，通过获取和处理图像信息来实现对环境的感知和理解。视觉传感器可以用于目标检测与识别、姿态估计、导航与定位、场景理解等多个任务，为机器人系统提供了丰富和全面的环境感知能力。随着计算机视觉和图像处理技术的快速发展，视觉传感器在机器人领域的应用越来越广泛。它们不仅可以通过获取图像数据来感知环境，还能够通过图像处理和计算机视觉算法对图像进行分析和理解，从而实现更复杂的任务和功能。视觉传感器具有从一整幅图像捕获光线的数以千计像素的能力。图像的清晰和细腻程度通常用分辨率来衡量，以像素数量表示。


    视觉传感器的原理基于光学和图像处理技术。它通常由图像传感器、光学透镜、滤光片和图像处理单元等组成：


    1）图像传感器：图像传感器是视觉传感器的核心组件，负责将光信号转换为电信号。常见的图像传感器包括`CCD`（电荷耦合器件）和`CMOS`（互补金属氧化物半导体）传感器，它们能够将光线的强度和颜色信息转换为数字图像数据。


    2）光学透镜：光学透镜用于控制进入传感器的光线，调节焦距和视场角，以获取清晰和准确的图像。透镜的形状和曲率会影响光线的聚焦和成像效果。


    3）滤光片：滤光片用于选择特定的光谱范围，以满足不同应用的需求。常见的滤光片包括`RGB`滤光片和红外滤光片。`RGB`滤光片可以分离光线中的红、绿、蓝三个主要颜色通道，用于彩色图像的获取。红外滤光片可以屏蔽可见光，只透过红外光，用于红外成像和特定应用领域。


    4）图像处理单元：图像处理单元对传感器获取的图像数据进行处理和分析。它可以应用各种计算机视觉算法，如边缘检测、特征提取、目标识别等，从而实现对图像的理解和解释。图像处理单元可以是嵌入式处理器、图形处理器（`GPU`）或专用的视觉处理单元（如视觉处理器）。


    ### 3.2.1 CCD 图像传感器


    电荷耦合器件（`Charge Coupled Device`，`CCD`）是一种常用于图像传感器的技术。`CCD`的名称来源于捕获图像后如何读取电荷：利用特殊的制造工艺，传感器能够在不影响图像质量的情况下传输（耦合）累积的电荷。`CCD`图像传感器的基本感光材料是金属氧化物半导体（`Metal
    Oxide Semiconductor` `MOS`）电容器。`MOS`用作光敏二极管和电荷存储设备，是一种特殊的半导体材料，一般按照矩阵形式排列。`MOS`的微观结构如图
    3-3 所示。


    1）底部掺杂硼的硅衬底（`p-Type Silicon`）：`MOS`的基础层是硅衬底，通常通过掺杂硼来调节其电学性质。硅衬底是一个半导体材料，具有适当的导电性能和光电特性，用于支持传感器的整体结构。


    2）沟道停止层（`n-Channel Stop`）：沟道停止层是位于硅衬底上的一层材料，通常是掺杂有特定杂质的硅区域。它的作用是在感光单元之间形成绝缘层，阻止电荷在感光单元之间扩散和交叉干扰，从而提高图像的清晰度和准确性，常见的有`RGB`三通道沟道停止层，即`3-Channel
    Stop`。


    ![](img/image_146.jpg)


    图 3-3 MOS 的微观结构（详见彩插）


    3）氧化层（`Silicon Dioxide`）：氧化层是位于沟道停止层上方的一层绝缘材料，通常是氧化硅。氧化层的主要作用是提供电荷传输的隔离和绝缘层，保护感光单元中的电荷免受外部干扰。


    4）用于控制的栅电极（`Polysilicon Gate`）：栅电极是位于氧化层上方的一层导电材料，通常是多晶硅（`Polysilicon`）。栅电极的电压控制着氧化层下方的势阱（`Potential
    Well`）的形成和消除。


    当栅极电压高时，氧化层下方会产生势阱。传入的光子可以激发势阱中的电子，这些电子可以被收集和引导，周围的势垒（`Potential Barrier`，可以阻止粒子通过）可防止受激电子泄漏。栅电极的电压可以根据需要进行调节，以控制电荷的传输和读取。


    使用`CCD`图像传感器生成数字信号可分为四个主要阶段：通过光子与器件光敏区域相互作用产生电荷、收集和存储释放的电荷、电荷转移和电荷检测，如图 3-4 所示。


    ![](img/image_147.jpg)


    图 3-4 CCD 图像传感器生成数字信号的过程


    1）信号电荷的产生：当光子与器件的光敏区域相互作用时，根据半导体的内光电效应，光子的能量会激发出电荷。激发的电荷量与入射光信号的强度成正比。


    2）信号电荷的存储：在感光单元中，通过栅电极的控制，激发的电荷被收集起来形成信号电荷包。这些电荷包被存储在势阱中，等待进一步的处理和传输。


    3）信号电荷的转移（耦合）：通过调节栅电极的电压和时序，信号电荷包被从一个像元（基本的光电感受单元，用于感知和记录光信号）转移到相邻的像元中，直到全部电荷包的输出完成。这种传输过程可以沿着行或列进行，通常采用逐行或逐列传输的方式。


    4）信号电荷的检测：`CCD`图像传感器工作过程的第四步是电荷的检测。在传输到输出级之后，电荷被转化为电流或电压信号。这可以通过读取电路和放大器来实现，将电荷转换为可以进一步处理的数字信号。


    `CCD`是一种通过电荷量表示信号大小，并以耦合方式传输信号的探测元件，可以制成高度集成的组合件。常见的`CCD`包括全幅`CCD`、行间传输`CCD`、帧传输`CCD`等。以全幅`CCD`为例，它是结构最简单的`CCD`传感器，能够以非常高的分辨率进行生产。全幅`CCD`只有一个单线传输寄存器作为缓冲器，因此无法通过传感器控制设置快门速度。为了避免光敏传感器表面在曝光时间外暴露在光线下，全幅`CCD`通常需要配备机械快门。由于全幅`CCD`输出的图像分辨率很高，它们主要用于科学和天文学中的摄影。全幅`CCD`外观如图
    3-5 所示。


    ![](img/image_148.jpg)


    图 3-5 全幅 CCD 外观


    全幅`CCD`包含水平和垂直移位寄存器，以及用于水平和垂直移位寄存器的时钟控制器，还有输出放大器等。`CCD`图像传感器在工作时，感光部分示意图如图 3-6
    所示。


    `CCD`本质上是一个大阵列的半导体“桶”，可以将传入的光子转换为电子并保持累积的电荷。这些电荷可以被垂直移位寄存器向下转移到水平移位寄存器，水平移位寄存器可以将电荷转换为电压并输出。


    `CCD`图像传感器的主要特点如下：


    1）高灵敏度：`CCD`图像传感器具有高量子效率，能有效地将入射光转化为电信号，从而具有高灵敏度。


    ![](img/image_149.jpg)


    图 3-6 CCD 传感器感光部分示意图


    2）低噪声：`CCD`特有的低噪声结构使其输出信号具有低噪声特性。


    3）高分辨率：`CCD`通过设计成矩阵式结构实现较高的分辨率。


    4）高静态分辨率：`CCD`能基本实现理论最大分辨率，具有高静态分辨率。


    5）非线性：`CCD`的输出电荷与入射光强度呈非线性关系，需要进行非线性校正。


    6）结构复杂：`CCD`具有复杂的多级低噪声电路，制造工艺相对复杂。这要求在制造过程中精确控制每个元件和电路的性能，以确保`CCD`图像传感器的高质量和稳定性。


    `CCD`是 20 世纪 70 年代初发展起来的一种新型半导体器件。目前，`CCD`的种类有很多，其中面阵型`CCD`在数码相机中得到广泛应用。它由许多`MOS`组成阵列，整体呈正方形，以输出具有一定分辨率的图像。从功能上来说，`CCD`感光元件在某种程度上相当于传统相机中的胶卷，用于捕获和记录光学图像。


    ### 3.2.2 CMOS 图像传感器


    互补金属氧化物半导体（`Complementary Metal Oxide Semiconductor`，`CMOS`）是指制造大规模集成电路芯片用的一种技术或用这种技术制造出来的芯片，后来发现`CMOS`经过加工也可以作为数码摄影中的图像传感器。在`CMOS`图像传感器芯片上还可以集成其他数字信号处理电路，如`AD`转换器、自动曝光量控制、伽马校正等，为了进行快速计算甚至可以将具有可编程功能的`DSP`器件与`CMOS`器件集成在一起，从而组成单片数字相机及图像处理系统。`CMOS`的微观结构如图
    3-7 所示。


    ![](img/image_150.jpg)


    图 3-7 CMOS 的微观结构


    `CMOS`图像传感器中包括一些光学元素，如微透镜和颜色滤光片：微透镜可以将光线聚焦在像元上，以提高光子的利用率；颜色滤光片可以将光线分成红、绿、蓝三个频段，从而捕捉到全彩色图像。`CMOS`的工作流程如下。


    1）光子入射：当光子进入`CMOS`图像传感器时，它们会命中像元。每个像元都有一个光敏元件，通常是一个`PN`结或`P+/N-`阱结构，它可以吸收光子并将其转换为电子（导体内光电效应）。


    2）光电转换：当光子命中光敏元件时，它会产生电子-空穴对。这些电子和空穴被分开，电子被收集到像元中的`N`型场效应管（`FET`）中，而空穴则被吸收或漂移到`P`型`FET`中。


    3）电荷积累：电子被收集到`N`型`FET`中，并在像元中积累电荷。每个像元都有一个电容器，它用于收集并保留这些电荷。电容器存储的电荷量与入射光子的能量成正比。


    4）信号放大：当像元中的电荷积累到足够的数量时，它们被传输到图像传感器的输出电路中进行放大和处理。这个过程通常涉及使用模拟信号放大器将电荷转换为电压，并使用模数转换器（`ADC`）将电压转换为数字信号。


    上述过程可见`CMOS`中像元的工作示意图，如图 3-8 所示。


    ![](img/image_151.jpg)


    图 3-8 CMOS 中像元的工作示意图


    在`CMOS`图像传感器中还包括一些电路元件，如场效应管和晶体管。这些元件用于控制图像传感器的读出方式和工作模式，以及增强传感器的灵敏度和响应速度。`CMOS`图像传感器的外观如图
    3-9 所示。


    ![](img/image_152.jpg)


    图 3-9 CMOS 图像传感器的外观


    `CMOS`图像传感器通常包含像元、数字逻辑电路、信号处理器、时钟控制器等。`CMOS`的感光部分如图 3-10 所示。


    ![](img/image_153.jpg)


    图 3-10 CMOS 的感光部分


    `CMOS`传感器工作时，每个像素都有与之对应的放大器和转换电路，可以直接读取和处理光信号。相对于`CCD`中电荷被顺序传输到感光区域的边缘进行读取和处理的模式，`CMOS`具有更快的响应速度。


    `CMOS`图像传感器具有以下优点：


    1）随机窗口读取能力。随机窗口读取操作是`CMOS`图像传感器在功能上优于`CCD`的一个方面，也称之为感兴趣区域选取。此外，`CMOS`图像传感器的高集成特性使其很容易实现同时开多个跟踪窗口的功能。


    2）抗辐射能力。总的来说，`CMOS`图像传感器潜在的抗辐射性能相对于`CCD`性能有重要增强。


    3）系统复杂程度低和可靠性高。采用`CMOS`图像传感器可以大大地简化系统硬件结构。


    4）非破坏性数据读出方式。


    5）优化的曝光控制。


    值得注意的是，由于在像元结构中集成了多个功能晶体管，`CMOS`图像传感器也存在着若干缺点，主要是噪声和填充率两个指标。鉴于`CMOS`图像传感器相对优越的性能，`CMOS`图像传感器在各个领域得到了广泛的应用，如日常使用的智能手机大多数都是使用`CMOS`图像传感器来进行图像捕捉，相应的某些专业摄影设备可能会采用`CCD`图像传感器以获得更高的图像质量。


    `CCD`、`CMOS`图像传感器各有其特点以及相应的适用领域，具体见表 3-1。


    表 3-1 `CCD`图像传感器与`CMOS`图像传感器的对比


    ![](img/image_154.jpg)


    随着技术的不断进步和创新，可以期待`CCD`和`CMOS`图像传感器在精度、能量消耗、发热、成本和抗干扰能力等方面取得更大的突破。这将进一步推动机器视觉领域的发展，并为各种行业和应用带来更多可能性和机会。


    ### 3.2.3 彩色相机


    无论是`CCD`还是`CMOS`，其原理都是将光子转换为电子。像元是指图像传感器上基本的光电感受单元，用于感知和记录光信号。像素是数字图像中的最小可见单元，它是由图像传感器中的像元所表示的。在彩色图像中，每个像素通常包含多个颜色通道的值。对于这种情况，多个像元的值可以合并计算出一个像素的颜色值。为了获得`RGB`彩色图像，可以首先将光线过滤为红、绿、蓝三种光子，然后使用三个`CCD`（`CMOS`）像元分别感光，最后成像。这种方式能获得理想的彩色图像。`CCD`、`CMOS`彩色相机的电路结构分别如图
    3-11、图 3-12 所示。


    ![](img/image_155.jpg)


    ▲图 3-11 CCD 彩色相机的电路结构


    ![](img/image_156.jpg)


    图 3-12 CMOS 彩色相机的电路结构


    工业相机俗称摄像机，相比于传统的民用相机（摄像机）而言，它具有高的图像稳定性、高传输能力和高抗干扰能力等。市面上的工业相机，如海康、大华、`BASLER`、`DAL-SA`等工业相机品牌，如图
    3-13 所示，每一家的相机`SDK`（`Software Development Kit`，软件开发工具包，是一组工具、库和文档的集合，旨在帮助开发人员创建特定软件平台、操作系统或应用程序的应用程序）都不一样。目前机器视觉工业相机都是符合自动影像协会（`Automated
    Imaging Association`，`AIA`）图像传输的标准。


    ![](img/image_157.jpg)


    图 3-13 国内典型的工业相机


    ### 3.2.4 深度相机


    深度相机是近几年兴起的新技术，也被称之为 3D 相机，顾名思义，就是通过该相机能检测出拍摄空间的景深距离，这也是与普通摄像头最大的区别。奥比中光是我国知名的深度相机制造厂商和
    3D 视觉知识开源的重要贡献者，推出了许多有关深度相机的优质科普内容。普通的彩色相机拍摄的图片能看到相机视角内的所有物体并记录下来，但是其所记录的数据不包含这些物体距离相机的距离，所得图像只是三维世界的
    2D 投影，如图 3-14 所示。


    ![](img/image_158.jpg)


    图 3-14 2D 图像与三维世界


