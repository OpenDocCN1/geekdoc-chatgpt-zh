    瑞典的机器人行业发展较为自由，同时也受到了国家的大力扶植。二战后，瑞典经历了两次产业升级和结构调整，每次都抓住机遇，果断决定取舍，实现了最佳市场定位。20世纪70年代末期，瑞典经济发展速度明显放缓，它另辟蹊径，实施产业结构调整，通过大力发展信息通信、生物、医药、航天等现代高新技术制造业，实现了第二次产业升级，为经济的复苏和增长注入了活力，此时机器人的发展重点也在新工业领域。

    20世纪90年代初，受世界性经济危机影响，瑞典经济出现衰退，它果断摒弃出现亏损的小轿车生产，只保留在国际市场占明显优势的卡车制造业，同时加大对电信、电子、环保、能源、生物、制药、化工、冶金、造纸和木材加工等领域的投入力度，使工业实力再上新台阶，并逐渐向福利性社会发展。可以看出，此时机器人的发展开始向机器人电子系统、服务业等发展。

    2000-2010年：发展和应用期。

    2003年，为了推动创新和产业发展，瑞典政府旗下的瑞典创新局（Vinnova）开始资助“机器人谷”项目的建设。如今，“机器人谷”已经成为新思想、新科技的“摇篮”，为世界源源不断地输出极具应用前景的机器人创新科技。

