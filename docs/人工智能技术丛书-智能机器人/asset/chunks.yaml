- raw: 'ABB YuMi机器人：瑞典工业机器人公司ABB开发了YuMi机器人，这是一款协作型双臂机器人，用于在制造业中与人类工作者合作完成任务，如图1-19所示。YuMi展示了机器人在工厂自动化中的新潜力。


    2010年以来，瑞典机器人发展更加多样化。


    Epiroc自动化矿山设备：瑞典的矿山设备制造商Epiroc积极推动自动化采矿设备的发展。它开发了自主地下钻探设备和无人驾驶矿山卡车，如图1-20所示的Epiroc矿山机器人，提高了采矿效率。


    ![](EPUB/images/image_028.jpg)


    ▲图1-19 ABB YuMi机器人


    ![](EPUB/images/image_029.jpg)


    图1-20 Epiroc矿山机器人


    树木砍伐机器人：瑞典的林业公司和研究机构合作开发了能够自主砍伐树木的机器人。这有助于提高林业操作的效率，减少了危险工作环境中的人员受伤风险。


    **4.德国**


    德国的工业机器人总数占世界第三位，仅次于日本和美国，但它比英国和瑞典引进机器人大约晚了五六年。之所以如此，是因为德国的机器人工业起步时遇到了国内经济不景气。但是，德国的社会环境却是有利于机器人工业发展的，因为战争造成的劳动力短缺，以及国民技术水平高等因素都是实现使用机器人的有利条件。


    20世纪70年代中后期，政府采用行政手段为机器人的推广开辟道路。在“改善劳动条件计划”中规定，对于一些有危险、有毒、有害的工作岗位，必须以机器人来代替普通人的劳动。这个计划为机器人的应用开拓了广泛的市场，并推动了工业机器人技术的发展。


    德国在发展机器人的过程中坚持技术应用和社会需求相结合。20世纪80年代初期，除了像大多数国家一样，将机器人主要应用在汽车工业之外，德国突出的一点是在纺织工业中用现代化生产技术改造原有企业，报废了旧机器，购买了现代化自动设备、电子计算机和机器人，使纺织工业成本下降、质量提高，产品更有竞争力，重新振兴了纺织业。与此同时，德国看到了机器人等先进自动化技术对工业生产的作用，提出了1985年以后要向高级的、具有感觉的智能型机器人转移的目标，经过近十年的努力，其智能机器人的研究和应用方面在世界上处于公认的领先地位。


    德国机器人的发展历程可大致归纳如图1-21所示。


    ![](EPUB/images/image_030.jpg)


    图1-21 德国机器人的发展历程


    2000-2010年：自动化和协作机器人。


    KUKA机器人：德国KUKA机器人公司在这个时期推出了各种工业机器人，包括用于汽车制造和其他工业应用的多关节机器人，如图1-22所示。他们还开发了KUKA LBR六轴机器人，如图1-23所示。这是一款协作型机器人，能够与人类工作者安全地共同工作。


    ![](EPUB/images/image_031.jpg)


    ▲图1-22 KUKA工业机器人


    ![](EPUB/images/image_032.jpg)


    图1-23 KUKA LBR六轴机器人


    Festo自然启发机器人：Festo是一家德国自动化技术公司，它通过仿生学的方法开发了一系列启发于自然的机器人，如图1-24所示，包括飞鸟、昆虫和水下生物的机器人。这些机器人在各种应用中展示了生物学和工程学的结合。


    ![](EPUB/images/image_033.jpg)


    图1-24 Festo自然启发机器人


    2010年以来，德国工业机器人在德国的发展十分迅速，并且很快占据着世界工业机器人生产的一席之地，2019年德国工业机器人销量为2.05万台，保有量达22.15万台。伴随工业4.0概念的提出，传统工业机器人正面临新挑战，需要更好掌握感知力、学习力、决策力等许多新技能。


    Bosch自动驾驶底盘机器人：Bosch开发的自动驾驶底盘机器人，用于自动化内部物流，如图1-25所示。这些机器人可以在工厂和仓库中自主地搬运货物，提高效率。


    ![](EPUB/images/image_034.jpg)


    图1-25 Bosch自动驾驶底盘机器人


    Franka Emika Panda机械臂：Franka Emika推出的Panda机械臂是一款灵活、易于编程的协作机械臂，如图1-26所示。它被广泛应用于工业装配、实验室和医疗领域。


    BMW ExoSuit外骨骼：宝马在工厂使用了ExoSuit外骨骼设备，帮助工人在重复性任务中减轻负担，如图1-27所示。这种设备提高了工作效率并降低了员工的体力劳动。


