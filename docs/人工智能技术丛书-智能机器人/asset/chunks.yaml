    ## 2.2 ROS基础


    本节主要介绍`ROS`的功能定位、`ROS`的设计目标、`ROS`的相关概念、`ROS`计算图、`ROS`的文件系统以及`ROS`社区这六部分的内容。


    ### 2.2.1 ROS的功能定位


    `ROS`（`Robot Operating System`，机器人操作系统）是一个适用于机器人的开源的元操作系统（见图2-4）。它提供了操作系统应有的服务，包括硬件抽象、底层设备控制、常用函数的实现、进程间消息传递，以及包管理；提供了用于获取、编译、编写和跨计算机运行代码所需的工具和库函数；提供了一些工具和库用于获取、建立、编写和执行多机融合的程序。在某些方面，`ROS`相当于一种机器人框架（`Robot
    Frameworks`），类似的机器人框架有：`Player`、`YARP`、`Orocos`、`CARMEN`、`Orca`、`MOOS`和`Microsoft
    Robotics Studio`。


    ![](EPUB/images/image_073.jpg)


    图2-4 `ROS`


    `ROS`运行时的“蓝图”是一种基于`ROS`通信基础结构的松耦合点对点进程网络。`ROS`实现了几种不同的通信方式，包括基于同步RPC样式通信的服务（`Service`）机制，基于异步流媒体数据的话题（`Topic`）机制以及用于数据存储的参数服务器（`Parameter
    Server`）。`ROS`并不是一个实时的框架，但`ROS`可以嵌入实时程序。例如，Willow Garage公司的`PR2`机器人使用了一种称为`pr2_etherCAT`的系统来实时发送或接收`ROS`消息。


    计算机包含硬件与软件两部分，计算机硬件是指计算机系统中的物理部分，包括各种电子元件、设备和组件。它们通过电路连接在一起，构成计算机的实体。常见的计算机硬件包括中央处理器（`CPU`）、内存（`RAM`）、硬盘、显示器、键盘、鼠标、主板、显卡、打印机等。硬件是计算机系统的基础，用于存储、处理和传输数据。计算机软件是指计算机系统中的程序、数据和相关文档的集合。软件是一系列指令和数据的逻辑组合，通过这些指令来控制计算机的运行和实现各种功能，如办公软件（`Microsoft
    Office`、`LibreOffice`）、图像处理软件、多媒体播放器、网页浏览器、`QQ`和微信等。


    计算机最开始比较简单，并没有操作系统，人们通过各种操作按钮就可以控制，但是这种操作方式效率比较低。后来人们通过有孔的纸带将程序输入计算机进行编译，再通过程序员自己编写的程序运行，这种方式的效率还是很低。为了更有效地管理计算机硬件，并提高计算机程序的开发效率，人们开发出了操作系统。


    与计算机操作系统类似，机器人操作系统（`ROS`）的出现也遵循这样一个规律：为了提高机器人设计和开发的效率。如图2-5所示，计算机的操作系统将计算机硬件封装起来，而应用软件运行在操作系统之上，无论计算机具体应用的是什么类型的硬件产品，这都能大大提高软件开发效率。同理，机器人操作系统（`ROS`）则是对机器人的硬件进行了封装，不同的机器人、不同的传感器，在`ROS`中可以用相同的方式表示（`Topics`等），供上层应用程序（运动规划等）调用。可以从以下四个方面理解`ROS`。


    1）通信：`ROS`提供了一种发布-订阅式的通信框架用以简单、快速地构建分布式计算系统。


    2）工具：`ROS`提供了大量的工具组合用以配置、启动、自检、调试、可视化、登录、测试、终止分布式计算系统。


    3）强大的库：`ROS`提供了广泛的库文件实现以机动性、操作控制、感知为主的机器人功能。


    4）生态系统：`ROS`的支持与发展依托于一个强大的社区。`ros.org`尤其关注兼容性和支持文档，提供了一套“一站式”的方案使得用户得以搜索并学习来自全球开发者数以千计的`ROS`程序包。


    ![](EPUB/images/image_074.jpg)


    图2-5 计算机操作系统与机器人操作系统（`ROS`）


    `ROS`目前只能在基于`UNIX`的平台上运行。`ROS`的软件主要在`Ubuntu`和`Mac OS X`系统上测试，同时`ROS`社区仍持续支持`Fedora`、`Gentoo`、`Arch
    Linux`和其他`Linux`平台。与此同时，`Microsoft Windows`端口的`ROS`已经实现，但目前并未完成。`ROS`核心系统及各种工具和库函数通常在`ROS`发行版本中发布。`ROS`发行版本类似于`Linux`发行版本，并提供了一系列兼容此版本的可被使用或开发的软件。


    ### 2.2.2 ROS的设计目标


    `ROS`的设计目标旨在为机器人开发和研究提供广泛的代码复用支持。`ROS`采用分布式进程架构，其中这些进程被打包成易于分享和发布的程序包和功能包，从而促进了协作和代码重用。此外，`ROS`还支持类似代码仓库的联合系统，使工程协作和发布变得更加便捷。这一设计特点允许开发人员在整个工程的开发和实现中拥有更大的自主权，而不受`ROS`的限制，同时还能够轻松地整合`ROS`的基础工具。


    为实现节点之间的协同工作，`ROS`框架设定了以下目标。


    1）小型化：`ROS`的设计追求轻量化，保证`ROS`编写的代码可以无缝地在不同机器人软件平台上重复使用。


    2）`ROS`不敏感库：`ROS`鼓励首选开发模型采用独立于`ROS`的干净库函数，以提高代码的可移植性和可维护性。


    3）语言独立：`ROS`框架具备语言无关性，允许使用各种现代编程语言来实现。已经实现了`Python`、`C++`和`Lisp`版本，同时也存在实验性的`Java`和`Lua`版本的库。


    4）方便测试：`ROS`内置了一个名为`rostest`的单元和集成测试框架，使测试模块的部署和卸载变得容易，有助于确保代码的质量和可靠性。


    5）可扩展：`ROS`旨在适用于大规模运行时系统和大型开发项目，为开发人员提供了弹性和扩展性的支持。


    ### 2.2.3 ROS的相关概念


    `ROS`主要有以下两大部分。


    1）`main`：核心部分，主要由Willow Garage公司以及众多开发者设计、提供和维护。这部分提供了`ROS`分布式计算的基础工具和整个`ROS`框架的核心编程组件。


    2）`universe`：这一部分涵盖了来自全球不同国家的`ROS`社区组织开发和维护的代码。它包括发布库的代码，如`OpenCV`、`PCL`等，这些库能够赋予机器人特定的功能和能力。


    `ROS`的概念分为三个层次：计算图层、文件系统层、社区层。


    1）计算图层：这一层代表了`ROS`中的运行实体，如节点（`Node`）、主题（`Topic`）、服务（`Service`）等，它们构成了机器人应用程序的分布式计算图。节点是独立运行的进程，可以相互通信，主题用于节点之间的消息传递，服务则提供了一种请求-响应的通信模式。


    2）文件系统层：`ROS`的文件系统层包括了包（`Package`）和堆栈（`Stack`）。包是`ROS`中的基本编译和交付单元，它包含了节点、库、配置文件等相关的文件。堆栈是包的集合，用于组织和管理相关的包。


    3）社区层：这一层代表了全球范围的`ROS`社区，包括了不同国家和地区的开发者和研究者。他们共同协作，开发新的包、工具和功能，分享最佳实践，解决问题，并推动`ROS`的不断演进和改进。


    ### 2.2.4 ROS计算图


    `ROS`计算图主要指的是节点（也可以称为进程）之间的通信，可以将其理解为`ROS`的通信机制。`ROS`创建了一个网络，将所有进程连接起来，使节点能够相互通信并获取其他节点发布的信息。围绕计算图和节点，还涌现出一些重要的概念，包括节点、节点管理器、参数服务器、消息、服务和主题（或称为话题），这些概念后面会逐一说明。


    #### 1. 节点


    作为`ROS`系统的核心，节点（`Node`）是通常采用`C++`或`Python`（`ROS`客户端库`roscpp`、`rospy`）编写的程序，主要用来执行各种计算任务。节点可以看作执行计算任务的进程。


    在`ROS`的世界里，最小的进程单元就是节点。当许多节点同时运行时，可以方便地将它们之间的通信关系绘制成一个图表，在这个图表中，进程就是图中的节点，而端对端的连接关系通过线连接起来，如图2-6所示。由于机器人的功能模块非常复杂，所以通常不会将所有功能都集中在一个节点中，而是采用分布式的方式，将不同的功能模块分别放置在不同的节点中。例如，可以有一个节点用于控制底盘轮子的运动，一个节点用于驱动摄像头获取图像，一个节点用于驱动激光雷达，一个节点根据传感器信息进行路径规划等。这种分布式的设计可以降低程序发生崩溃的可能性。想象一下，如果将所有功能都写在一个程序中，模块间的通信和异常处理将会变得非常复杂和困难。


    ![](EPUB/images/image_075.jpg)


    图2-6 `teleop_turtle`与`my_turtle`直接通过`cmd_vel`消息来通信


    #### 2. 节点管理器

