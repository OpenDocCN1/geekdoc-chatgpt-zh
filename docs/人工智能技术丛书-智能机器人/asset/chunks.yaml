    第二个选项卡是`Self-Collisions`，它会搜索机器人上可以安全禁用碰撞检查的成对`link`，从而减少运动规划处理时间。当这些`link`对始终处于碰撞状态、从不处于碰撞状态、在机器人的默认位置处于碰撞状态或当`link`在运动链上彼此相邻时，这些`link`对将被禁用。


    如图 5-18 所示，采样密度（`Sampling Density`）表示的是要在机器人上随机选取多少位置来进行自碰撞检测。采样密度越大，计算时间越长，采样密度越低，禁用不应禁用的`link`对的可能性越高，其默认值为`10000`。为了减少处理时间，碰撞检查是并行进行的。单击“生成碰撞矩阵”（`Generate
