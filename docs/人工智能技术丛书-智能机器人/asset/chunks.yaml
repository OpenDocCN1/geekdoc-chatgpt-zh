    第五个选项卡是Robot Poses，可以通过该选项卡预先定义机器人的位姿以便以后能够使用。这些预定义的位姿也称为群组状态。如图5-21所示，已经建立了一个名为“home”的位姿，对应的规划群组是机械手臂，名为“manipulator”。


