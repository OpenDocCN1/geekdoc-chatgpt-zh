    # 第 6 章 四足机器人


    随着驱动、智能控制等技术的高速发展，相对而言更加灵活机动的四足机器人成了研究热点。足式机器人相对于传统轮式机器人具有良好的灵活性，能适应各种路况地形，同时具有更好的平衡性能。目前，我国的足式机器人行业也有了长足发展，涌现出了宇树机器狗、云深处机器狗、小米
    CyberDog、蔚蓝 AlphaDog 等产品，低成本地制造一台运动能力很强的多足机器人在中国已经不再是难事。


    本章主要介绍了四足机器人发展历史和目前行业内四足机器人现状；随后对四足机器人运动控制方面进行讲解，讲述了四足机器人运动学正逆解问题；最后，用一个 ROS 仿真示例进行演示。


    ## 6.1 四足机器人简介


    本节主要介绍四足机器人发展历史以及四足机器人发展现状两部分内容。


    ### 6.1.1 四足机器人发展历史


    相较于传统的四轮式和履带式机器人，四足机器人有着无与伦比的优势，它在复杂环境中具有更高的机动性，对于抢险、救灾和探险任务具有比传统四轮机器人更大的潜力。为了实现更智能的机器人，首要任务是让机器人能够像人或动物一样自由行动。


    有记载的第一部四足机器人是由 Chebyshev 于 1870 年建立的，如图 6-1 所示。图 6-1a 是 Chebyshev 的构造，包括姿态轨迹的构形（固体线）和摆动轨迹的构形（虚线）。它由一个基于四个杆的装置组成，当
    Link1 绕轴 A1 旋转时，足端 P1 在 T1 部分遵循准直线轨迹，T2 部分离开地面；图 6-1b 是 Chebyshev 的平面草图，在这种机械结构中，四条腿按对角线划分为两组，使机器人既能够站立，又能够行走和小跑。然而，这种早期的行走机器人缺乏适应地形的机制，因此只能在平坦的地面上运动。


    ![](img/image_432.jpg)


    图 6-1 Chebyshev 示意图


    另一个里程碑式的四足机器人是 L.A.Rygg 于 1893 年在美国专利局申请的一种骑马机，如图 6-2 所示。这台机器允许骑手通过踏板为机器提供动力，并利用连杆和曲柄传动来推动机器前进。这被认为是历史上第一项涉及足式机器的发明专利。


    ![](img/image_433.jpg)


    图 6-2 骑马机专利图


    到了 20 世纪 40 年代，研究人员和工程技术人员开始积极探索行走机器人的潜在应用领域。军事和空间研究领域的专家被腿部运动所带来的新可能性所吸引，并提出了一些有趣的应用概念。在这方面，英国和美国的研究人员率先提出将四足机器人应用于战争和星际探索任务。


    第一个正式的项目是由英国的 A.C.Hutchinson 和 F.S.Smith 开展的。他们认为，在处理重达 1000t 的载重车辆时，四足系统比轮式或履带系统更为可靠。因此，他们共同研发了一种具有水平和垂直解耦的单足系统，该系统由两个液压机构驱动。最终，他们按比例建造了一台高
    0.6m 的四足机器人，该机器人拥有八个运动关节，可用于装甲车的测试。然而，当时的英国陆军部门对这个项目并不感兴趣，因此项目被终止。尽管如此，这个项目标志着第一次成功开发出具备地形适应能力的四足机器人。


