    通过以上公式，就可以将世界坐标系下的一个三维点转换成图像上对应的像素点。同样，对于深度相机来说，也可以轻易地将图像中的一个像素点转换成世界坐标系下的三维点，因为深度相机可以从图像的深度图中获取对应像素点的深度值，也就是`z[c]`值。但是对于非深度相机来说，由于并不知道等式左边的`z[c]`值，所以通过图像中的一个像素点是不容易得到它在世界坐标系下的三维点的。


