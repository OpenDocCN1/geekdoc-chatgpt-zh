    ![](EPUB/images/image_224.jpg)


    图3-51 基于TOF原理的激光雷达系统


    其中，发射模块、接收模块和扫描模块，不同激光雷达厂商的技术路线差异较大，当前业界关于混合固态、固态激光雷达的讨论，其实主要是围绕扫描模块进行。


    因为目前激光雷达多用于Robotaxi领域（即自动驾驶出租车或无人驾驶出租车领域），整理得到相关的信息汇总如图3-52所示。


    激光雷达的实际使用方面，主要关心的有三点：性能、可靠性和成本。性能一般指测距能力、精度、视场角、分辨率、刷新帧率、体积、功耗等参数，可靠性就是能不能通过车规，而成本则是决定激光雷达能否大规模量产的关键因素。


    ### 1. 机械激光雷达


    机械激光雷达的发射系统和接收系统存在宏观意义上的转动，即通过不断旋转发射头，将速度更快、发射更准的激光从“线”变成“面”，并在竖直方向上排布多束激光，形成多个面，从而达到动态扫描并动态接收信息的目的。机械激光雷达可以实现大角度扫描，但是装配较为困难、扫描频率偏低、体积大、机械结构复杂、成本很难降低。


    例如，速腾聚创Ruby Plus新一代128线激光雷达，相比前代及同类产品，其测距能力高出20%；高分辨率与强大测距能力结合，远场环境信息更丰富，可轻松检出240m内的黑色车辆和85m长的车道线；采用全新的机械式激光雷达架构与技术平台，相比前代体积与质量减少50%，功耗减少33%。其产品参数如图3-53所示。


    在激光雷达产品参数指标中，点频是一个可以综合全面反映激光雷达感知能力的一个指标。点频指的是激光雷达每秒完成探测并获取的探测点的总数目，也称为出点数或每秒点数，类似摄像头总像素的概念。用点频来描述，既不能靠降低刷新帧率取巧，又能避免视场角大小和不均匀带来的“最高分辨率”这样片面的描述。根据定义，可以得到点频的计算公式：`点频（points/s）=水平方向平均点数×垂直方向平均点数×刷新频率（Hz）`。与相机的像素一样，点频越多，说明激光雷达对目标物的感知能力越好，点频是激光雷达的核心性能指标。


    ![](EPUB/images/image_225.jpg)


