    **3.机器人平衡策略**


    四足机器人的平衡策略与二足机器人的平衡策略有些相似，实际上，四足机器人的平衡可以看作是对角线上两个双腿机器人平衡的组合。这是实际应用中常见的方法。接下来，简要介绍一些单腿平衡策略，基于这些策略可以开发出适用于四足机器人的平衡控制方法。至于六足或更多足的机器人平衡策略会更加复杂，这里不做深入讨论，有兴趣的读者可以进一步研究。


    单腿机器人的单腿弹跳控制通常基于倒立摆模型。这种控制方法涉及在跳跃时以一定速度离地，并确保在落地时将机器人的落脚点控制在合适位置。关键在于控制落脚点相对于中性点（Neutral
    Point，NP）的位置。


    如果机器人需要继续前进，它会控制落脚点在NP附近着陆。如果需要加速，就会控制落脚点在NP之前着陆。如果需要减速，就会让落脚点在NP之后着陆。这种策略使得机器人可以在不倒下的情况下保持平衡，如图6-34所示，这对于四足机器人来说非常关键。


    双足平衡（图6-35）按照应对扰动量的大小依次可分为4种策略：踝策略、髋策略、跨步策略以及安全倒策略。


    1）踝策略：当机器人受到外部扰动后，如果身体的质心投影位置（CoM）仍然位于脚掌范围内，那么机器人会通过扭动踝关节的方式来将身体恢复到原来的位置。这个策略主要用于应对轻微的扰动。


    2）髋策略：如果外部扰动导致机器人的CoM超出了脚掌范围，那么机器人将采用髋关节的作用，即通过扭动身体来将CoM重新拉回到脚掌范围内。这种策略用于更大的扰动情况。


    ![](EPUB/images/image_503.jpg)


    图6-34 四足机器人平衡控制


    3）跨步策略：当外部扰动的幅度较大，以至于髋策略无法有效应对时，机器人将采用跨步策略。这意味着在下一步行进时，机器人会有意识地迈出更大的步伐，以调整身体的运动状态，使CoM重新回到稳定范围内。


    4）安全倒策略：如果扰动过于剧烈，以至于机器人无法保持平衡，那么机器人将采取安全倒策略。在这种情况下，机器人会迅速采取措施，将自身姿态调整到一个安全的位置，以减少倒地受损的可能性。


    ![](EPUB/images/image_504.jpg)


    图6-35 双足平衡


    经典的双足平衡模型为基于零力矩点（ZMP，Zero Moment Point）的平衡控制模型，如图6-36所示。ZMP可以理解为几项力的和（地面的支撑力、重心受到的引力、加速度）为0，身体不受转矩，或者说不跌倒。


    ![](EPUB/images/image_505.jpg)


    图6-36 基于ZMP的平衡控制模型


