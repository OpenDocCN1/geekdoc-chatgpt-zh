    # 第2章 机器人操作系统


    随着机器人相关技术的不断发展，制造业正在发生翻天覆地的变化，工业机器人正在逐步代替人力劳动，其应用场景从汽车制造工业蔓延到我们生活的各个方面，并对我们的生活产生影响。这些机器人的工作原理是什么？该如何控制机器人？通过本章的学习，读者将逐步了解机器人的工作原理，并踏上开发实践之路。


    ?xml version="1.0" encoding="utf-8"?


    ## 2.1 ROS的发展历史


    随着机器人领域的快速发展，大型项目的开发对代码复用性的需求也越来越大，开发一个协同工作框架的需求日趋强烈。


    机器人操作系统（`Robot Operating System`，`ROS`）的系统架构由摩根·奎格利（Morgan Quigley）设计，他在美国斯坦福大学人工智能实验室攻读博士学位期间，在导师吴恩达（Andrew
    Ng）带领下做过不少机器人和机器学习项目。机器人操作系统的发展历程如图2-1所示。


    ![](EPUB/images/image_068.jpg)


    图2-1 机器人操作系统（`ROS`）的发展历程


    在与Willow Garage公司合作之前，摩根·奎格利就已经开始在美国斯坦福大学人工智能实验室研发`STAIR`机器人项目，并负责该项目中的软件架构设计和开发工作。当时，`STAIR`项目的目标是构建一个服务型机器人原型，在视觉传感器的辅助下，可以在复杂环境中运动，并借助机械臂抓取物体，其中还融入一些人工智能算法。为此，`STAIR`机器人配备了一个运动底盘、一个小型机械臂、激光雷达和立体摄像头。


    `STAIR`项目设计并制造的前两个机器人被简单命名为`STAIR1`和`STAIR2`。每个机器人在移动基座上都有一个机械臂，但这些机器人在许多细节上有所不同，如图2-2所示。


    ![](EPUB/images/image_069.jpg)


    图2-2 `STAIR`项目设计制造的机器人


    `STAIR`项目的开发由多个小组负责，每个小组分别承担不同模块的开发工作，齐头并进。其中，摩根·奎格利负责导航组件和软硬件模块的系统集成。他发现将机械臂操控、导航、视觉等多种功能整合到一个机器人上并非易事，因此他开始思考并采用了分布式的方法，将不同模块连接在一起。这一概念后来成功地应用于`ROS`中。


    后来，吴恩达与Willow Garage公司合作共同开发`ROS`，摩根·奎格利充分发挥了他前期在`STAIR`项目中积累的开发经验，成为`ROS`框架开发的核心人物。


    2009年，摩根·奎格利、吴恩达和Willow Garage公司的工程师，在当年的`IEEE`国际机器人与自动化会议上发表了文章`ROS: an open-source
    robot operating system`，正式向外界介绍`ROS`。


    `PR2`（`Personal Robot 2`，个人机器人2代）是Willow Garage公司设计的机器人平台，`PR2`机器人如图2-3所示。随着`PR2`那些不可思议的表现，如叠衣服、插插座、做早饭，`ROS`也得到越来越多的关注。Willow
    Garage公司也表示希望借助开源的力量使`PR2`变成“全能”机器人。


