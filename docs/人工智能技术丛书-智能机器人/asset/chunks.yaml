    第六个选项卡为End Effectors，如图5-22所示，用来定义机器人手臂的末端执行器。机械臂一般都会配置末端执行器用来执行各种操作，如夹持器、吸取器以及其他工具。在本例中，UR5机械臂末端配置的是一个二指夹持器。在此选项卡上，需要末端执行器定义一个名称、一个规划群组和含末端执行器的父连杆。


    ![](EPUB/images/image_378.jpg)


    图5-22 End Effectors选项卡界面


    第七个选项卡是Passive Joints，如图5-23所示，用来定义不能驱动的关节。不能驱动的关节通常指的是MoveIt不需要规划的关节，模块也不需要发布关于它们的信息。在本例中，没有需要定义为被动关节的关节，所以这里会跳过此步骤。


    ![](EPUB/images/image_379.jpg)


    图5-23 Passive Joints选项卡界面


    第八个选项卡是ROS Control，如图5-24所示。ROS Control是一套软件包，包括控制器接口、控制器管理器、传输和硬件接口等，用于自动生成模拟控制器，以控制机器人的关节点。


    ![](EPUB/images/image_380.jpg)


    图5-24 ROS Control选项卡界面


    第九个选项卡是Simulation，如图5-25所示，用来生成与Gazebo兼容的URDF文件来帮助在Gazebo中模拟和使用机器人。


    ![](EPUB/images/image_381.jpg)


    图5-25 Simulation选项卡界面


    第十个选项卡是3D Perception，如图5-26所示，用于设置3D传感器配置文件sensors\_3d.yaml的参数，以便能够使用安装在机械臂上的3D传感器。如果没有3D传感器需要配置，那么可以跳过此步骤。


    ![](EPUB/images/image_382.jpg)


    图5-26 3D Perception选项卡界面


    第十一个选项卡是Author Information，如图5-27所示，需要填写作者名和作者邮箱。这一步是必须填写的，Catkin需要合理的信息来填写进package.xml中，只有完成这一步，才能最终生成配置包。


