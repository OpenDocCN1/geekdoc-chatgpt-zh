    **4.四足机器人的腿部雅可比矩阵推导**


    （1）雅可比矩阵作用 雅可比矩阵属于运动学的范畴。在机器人运动学模型中，雅可比矩阵用于将关节的速度转换为有关点（如末端执行器）的速度。雅可比矩阵与关节角相关，若关节角度发生变化，雅可比矩阵各元素的大小也随时间变化。


    （2）三关节单腿雅可比矩阵定义 对每一个单腿的正运动学方程的每个关节求偏微分，即可得到雅可比矩阵的定义表达式，即


