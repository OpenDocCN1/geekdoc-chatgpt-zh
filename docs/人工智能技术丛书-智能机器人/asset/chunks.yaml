    ## 4.德国


    德国的工业机器人总数占世界第三位，仅次于日本和美国，但它比英国和瑞典引进机器人大约晚了五六年。之所以如此，是因为德国的机器人工业起步时遇到了国内经济不景气。但是，德国的社会环境却是有利于机器人工业发展的，因为战争造成的劳动力短缺，以及国民技术水平高等因素都是实现使用机器人的有利条件。


    20 世纪 70 年代中后期，政府采用行政手段为机器人的推广开辟道路。在“改善劳动条件计划”中规定，对于一些有危险、有毒、有害的工作岗位，必须以机器人来代替普通人的劳动。这个计划为机器人的应用开拓了广泛的市场，并推动了工业机器人技术的发展。


    德国在发展机器人的过程中坚持技术应用和社会需求相结合。20 世纪 80 年代初期，除了像大多数国家一样，将机器人主要应用在汽车工业之外，德国突出的一点是在纺织工业中用现代化生产技术改造原有企业，报废了旧机器，购买了现代化自动设备、电子计算机和机器人，使纺织工业成本下降、质量提高，产品更有竞争力，重新振兴了纺织业。与此同时，德国看到了机器人等先进自动化技术对工业生产的作用，提出了
    1985 年以后要向高级的、具有感觉的智能型机器人转移的目标，经过近十年的努力，其智能机器人的研究和应用方面在世界上处于公认的领先地位。


