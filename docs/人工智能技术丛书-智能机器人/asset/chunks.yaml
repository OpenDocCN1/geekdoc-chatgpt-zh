    **2.3.2**


    **ROS的通信机制**


    ROS的通信架构是ROS的灵魂，它涉及数据的处理、进程的运行、消息的传递等关键方面。ROS通信架构通过节点（Node）的概念来表示不同的应用程序，这些节点之间通过预定义消息格式在特定主题（Topic）或服务（Service）上进行连接。


    其中，主题通信机制是ROS中最常用的通信方式之一，它实现了发布者和订阅者之间的异步通信。通过定义主题名称和消息类型，节点可以以松散耦合的方式进行数据交换。这一机制允许节点在不需要直接了解其他节点的情况下，通过发布和订阅特定主题，实现数据的传递和共享。


    **1.主题通信机制**


    ①Talker注册：Talker节点启动，并通过RPC向ROS Master注册发布者的信息，包括节点的信息和需要发布的主题名。ROS Master会记录Talker节点的信息，以备后续的信息匹配。


    ②Listener注册：Listener节点启动后，通过RPC向ROS Master注册订阅者的信息，包含需要订阅消息的主题名。


    ③ROS Master进行信息匹配：ROS Master会根据Listener订阅的主题名称，从注册列表中查找匹配的发布者信息。如果匹配失败，Master会等待匹配的发布者加入；如果匹配成功，Master将通过RPC向Listener发送Talker的RPC信息，以便后续建立连接。


    ④Listener发送连接请求：Listener接收到Master发送的Talker地址信息后，通过RPC向Talker发送连接请求，包括传输订阅的主题名、消息类型和通信协议（TCP/UDP）等信息。


    ⑤Talker确认连接请求：Talker接收到Listener发送的请求后，继续通过RPC向Listener发送确认连接信息，包括自身的TCP地址信息。


    ⑥Listener尝试与Talker建立网络连接：Listener接收到确认信息后，使用TCP尝试与Talker建立连接。


    ⑦成功建立连接后，Talker开始向Listener发送主题消息数据，实现了异步的发布和订阅机制，如图2-12所示。


    ![](EPUB/images/image_090.jpg)


    图2-12 主题通信机制理论模型


    除了主题通信，ROS还提供了服务调用机制，允许节点之间进行同步的请求和响应式通信。节点可以定义服务，并向其他节点发送请求，等待响应返回。


    **2.服务通信机制**


    ①Talker启动后，会通过RPC在ROS Master中注册自身信息，其中包含提供的服务的名称。ROS Master会将节点的注册信息加入注册表中。


    ②Listener启动后，也会通过RPC在ROS Master中注册自身信息，包含需要请求的服务的名称。ROS Master会将节点的注册信息加入注册表中。


    ③ROS Master会根据注册表中的信息匹配Talker和Listener，并通过RPC向Listener发送Talker的TCP地址信息。


    ④Listener根据②响应的信息，使用TCP与Talker建立网络连接，并发送请求数据。


    ⑤Talker接收、解析请求的数据，并产生响应结果返回给Listener。


