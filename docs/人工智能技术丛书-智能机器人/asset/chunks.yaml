    # 超声波传感器


    人们可以听到的声音频率为 20Hz～20kHz，即为可听声波，超出此频率范围的声音，即 20Hz 以下的声音称为低频声波，20kHz 以上的声音称为超声波，一般说话的频率范围为
    100Hz～8kHz。超声波在穿透液体和固体方面具有很强的能力，特别是在不透明的固体中，它可以穿透几十米的深度。当超声波遇到杂质或界面时，会产生显著的反射形成回波。当超声波与活动物体相遇时，会产生多普勒效应。超声波传感器利用超声波的传播和回波时间来测量物体与传感器之间的距离。具体而言，传感器发射超声波脉冲，并通过接收器接收回波，然后根据回波的时间延迟计算物体到传感器的距离。超声波传感器在机器人中广泛应用于障碍物检测和距离测量，它能够检测机器人前方的障碍物并采取相应的避障措施。此外，超声波传感器还可以用于测量物体的位置、高度和形状等信息。


    ## 超声波传感器系统


    超声波传感器系统由发送器、接收器、控制部分和电源部分组成，如图 3-47 所示。发送器通常采用直径约为 15mm 的陶瓷振子。这个振子将电振动能量转换为超声波能量，并将其辐射到空中。除了用作穿透式超声波传感器的发送器外，陶瓷振子也可以用作接收器。当陶瓷振子接收到超声波时，它会产生机械振动，并将其转换为电能，作为传感器接收器的输出，以便检测发送的超声波。如果接收到发送器发送的超声波，振子就会以发送超声波的频率振动，从而产生与超声波频率相同的高频电压。然而，这种电压非常微弱，因此需要使用放大器进行放大。控制部分用于控制超声波的发送和接收过程，以及处理接收到的信号。电源部分为整个系统提供所需的电能。


    ![](img/image_219.jpg)


    图 3-47 超声波传感器系统


    ## 超声波传感器类型


    一般市场上出售的超声波传感器可分为专用型和兼用型。专用型传感器的发送器用于发送超声波，接收器用于接收超声波。兼用型传感器则将发送器和接收器合二为一，既可以发送超声波，又可以接收超声波。超声波传感器的谐振频率（中心频率）可以是
    23kHz、40kHz、75kHz、200kHz、400kHz 等。较高的谐振频率意味着超声波波长更短，因此可以提供更高的空间分辨率，即能够更准确地检测和定位目标物体。


    ## 超声波测距原理


    超声波传感器测距的原理十分简单，由超声波的发射端发射一束超声波，在发射的同时，计时开始，发射出去的超声波在介质中传播，声波具有反射特性，当遇到障碍物时就会反射回来，当超声波的接收端接收到反射回来的超声波时，计时停止。介质为空气时，声速为
    340m/s，根据记录的时间`t`，发射位置与障碍物之间的距离`s = 340*t/2`。超声波测距的原理就是已知超声波在介质中的传播速度，测量出从发射到接收所需的时间，根据测量出的时间来计算出障碍物的距离，与回声定位原理一样。


    ## 应用范围


    超声波传感器一般适用于较短的作用距离，普通的有效探测距离通常在 5～10m。然而，超声波传感器会存在一个最小探测盲区，一般在几十毫米左右。由于声波的特性，超声波传感器受环境影响较小，因此在各种使用场合都可以应用。


    ## MB1014 人体距离传感器


    MB1014 是专为行人和对象检测而设计的人体距离传感器，如图 3-48 所示。它具有以下特点：供电范围为 2.5～5.5V，适用于不同的电源供应情况。MB1014
    采用了极小的外形设计，可以在有限的空间条件下提供对特定距离对象的接近检测。该传感器支持在同一环境中最多同时运行 20 个传感器。这意味着用户可以将多个 MB1014
    传感器集成到单个系统中，而且很少或几乎不会受到其他超声波传感器经常发生的相互干扰的影响。这种抗干扰能力确保了系统的稳定性和可靠性。


    ![](img/image_220.jpg)


    图 3-48 MB1014 人体距离传感器


    MaxBotix 人体测距传感器 MB1014 能够与其他附近的传感器同时工作，并且具有快速的响应能力。它的对象距离采集时间约为 2.5s，对象距离恢复时间约为
    1.5s。这意味着它能够在短时间内迅速感知和获取目标物体的距离信息。它适用于近距离对象检测，并可应用于多种应用领域，如接近区域探测、行人检测和机器人自动导航等。


    # 3.3.2 激光传感器


    激光传感器和激光雷达都是基于激光技术的传感器。激光传感器利用激光器作为光源进行测距，其工作原理如下：首先，激光二极管将激光脉冲对准目标进行发射。目标反射后，激光向各个方向散射。其中一部分散射光返回传感器接收器，并经过光学系统成像到雪崩光敏二极管上。雪崩光敏二极管是一种内部具有放大功能的光学传感器，能够检测极其微弱的光信号。通过记录和处理从光脉冲发出到返回被接收所经历的时间，就可以确定目标的距离。激光传感器具有测量范围广、响应速度快的优点，并且在远距离测量时无须使用反光板。然而，由于光速非常快，激光传感器必须非常精确地测定光的传输时间。


    ## VL53L0X 微型激光测距模块


    VL53L0X 是一款微型激光测距模块，基于 TOF 原理，如图 3-49 所示，产品规格为 4.4mm×2.4mm×1.0mm，支持 2m 以内的距离测量。


