    ## 1.3 智能机器人分类


    按照智能机器人的应用功能、智能级别以及行动方式进行分类，有多种不同类别的智能机器人。


    ### 1.3.1 按应用功能分类


    #### 1. 传感型机器人


    传感型机器人是外部受控机器人，机器人的本体上没有智能单元，只有执行机构和感应机构，它具有利用传感信息，包括视觉、听觉、触觉、接近觉、力觉和红外、超声、激光等，进行传感信息处理、实现控制与操作的能力。受控于外部计算机，目前机器人世界杯的小型组比赛使用的机器人属于该类型。


    iRobot 公司在 2002 年 9 月推出旗舰扫地机器人 Roomba 系列后一举成名，仅 2004 一年的销售额就高达 100 万台，其 Roomba980
    产品是一个典型的传感型机器人，它配备了视觉传感器、接近感应器、碰撞传感器、地毯传感器等多种传感装置，以侦测障碍物、地形的变化和清洁的需求。Roomba980
    还使用红外传感器来检测房间的轮廓，以确保它可以有效地穿越房间并避开障碍物。这些传感器通过实时收集数据，然后将数据传输到内置的控制单元或外部的计算机，以便机器人能够在房间中自主导航并清扫地面。


    #### 2. 自主型机器人


    自主型机器人在设计制作之后，不需要人的干预，能够在各种环境下自动完成各项拟人任务。自主型机器人的本体上具有感知、处理、决策、执行等模块，可以像一个自主的人一样独立地活动和处理问题。许多国家都非常重视全自主移动机器人的研究。智能机器人的研究从
    20 世纪 60 年代初开始，经过几十年的发展，目前，基于感觉控制的智能机器人，又称第二代机器人，已达到实际应用阶段，基于知识控制的智能机器人也取得较大进展，已研制出多种样机。


    波士顿动力公司的机器狗 Spot 系列是典型的自主型机器人。Spot 机器人具备多种传感器，包括视觉、激光雷达和红外传感器，以便在各种环境中感知周围的情况，搭载了内置的计算机和决策系统，可以在不同的任务中做出自主决策，如巡逻、执行搜索和救援操作、执行建筑工作等。Spot
    机器人还具备移动能力，可以自主导航并穿越各种地形，从楼梯爬升到不同的地点；还可以执行多样的任务，如检查设备、巡逻建筑物或协助在危险环境中工作。波士顿动力的
    Spot 机器人代表了自主型机器人的新一代，它能够在各种环境下独立工作，并且具备感知、决策和执行能力，类似于一个自主的生物体。这个机器人展示了自主型机器人在实际应用中的潜力，可以应对多样的任务和环境，而不需要人的干预。


    #### 3. 交互型机器人


    交互型机器人通过计算机系统与操作员或程序员进行人机对话，实现对机器人的控制与操作。这类机器人虽然具有部分处理和决策功能，能够独立地实现一些如轨迹规划、简单的避障等功能，但是还要受到外部的控制。


    由软银公司（SoftBank）开发的交互型机器人 Pepper 是一个具有高度人机交互能力的机器人，能够通过计算机系统与操作员或程序员进行对话，实现对机器人的控制与操作。Pepper
    具备自然语言处理和语音识别技术，可以与人进行对话、回答问题、识别情感和情绪。它还具有视觉传感器和摄像头，可以识别人类面部表情和动作。虽然 Pepper 具备一定的自主功能，如轨迹规划和简单的避障，但它仍然需要受到外部的控制，以执行更复杂的任务和指令。Pepper
    通常用于零售、服务业和教育领域，作为客户服务代表、教育助手或社交伴侣。它的交互性使其能够有效地与人类进行互动，提供信息、娱乐和支持，同时还能够接受来自操作员或程序员的指令，以执行特定任务。Pepper
    结合了自主性和人机互动，所以能更好地满足不同应用领域的需求。


    小米的 CyberOne 是一款全新的智能机器人项目，旨在推动机器人技术在中国及全球的发展。CyberOne 具有高情商、可感知人类情绪，视觉敏锐、可对真实世界三维虚拟重建，“小脑”发达、可实现双足运动姿态平衡，四肢强健、动力峰值转矩
    300N·m 等领先能力。CyberOne 以人工智能为内核，标准人形为载体，搭载小米自研 Mi-Sense 深度视觉模组，结合 AI 算法，具有完整的三维空间感知能力，能够实现人物身份识别、手势识别、表情识别的功能。


    ### 1.3.2 按智能级别分类


    随着机器人技术的发展，根据功能不同，机器人又被分为一般机器人和智能机器人。其中，一般机器人是指只具有一般编程能力和操作功能的机器人，目前我国生产的机器人大多数属于这一类。智能机器人并没有统一的定义，大多数专家认为智能机器人至少要具备以下几大功能特征：一是具备对不确定作业条件的适应能力；二是具备对复杂对象的灵活操作能力；三是具备与人紧密协调合作的能力；四是具备与人自然交互的能力；五是具备人机合作安全特征。无论是现代的工业机器人还是服务机器人，最终都将发展为具有学习能力的智慧型机器人。智能机器人又称为下一代机器人。随着
    3D 视觉感知、力觉传感器等技术的不断进步和与工业互联网、云计算、大数据等新一代信息技术的深度融合，下一代机器人的智能化程度将进一步提高，对外界的感知能力将进一步增强，可以完成动态、复杂的作业使命，实现多机协同，并与人类协同作业。


    #### 1. 原型机器人


    原型机器人只能死板地按照人给它规定的程序工作，不管外界条件有何变化，自己都不能对程序也就是对所做的工作进行相应的调整。如果要改变机器人所做的工作，必须由人对程序做相应的改变，因此它几乎是毫无智能的。


    #### 2. 弱智能机器人


    这类机器人的智能为弱人工智能，是指擅长单个方面的人工智能。例如，战胜世界围棋冠军的人工智能 AlphaGo，只会下围棋，而无法辨识一下猫狗等动物。现在实现的几乎全为弱人工智能。


    它们具有像人那样的感受，识别、推理和判断能力，在给定修改程序的原则前提下，可以根据外界条件的变化，在一定范围内自行修改程序，即能适应外界条件变化并自身做相应调整。


    #### 3. 强智能机器人


    这类机器人是智能类似人类级别的人工智能，即在各方面都能和人类比肩。创造强人工智能比创造弱人工智能难得多，现在还基本做不到。


    美国特拉华大学心理学教授 Linda Gottfredson 把智能定义为“一种宽泛的心理能力，能够进行思考、计划、解决问题、抽象思维、理解复杂理念、快速学习和从经验中学习等操作”。强人工智能在进行这些操作时应该和人类一样得心应手。


    目前入门级别的强智能机器人具有感觉、识别、推理和判断能力，同样可以根据外界条件的变化，在一定范围内自行修改程序。所不同的是，修改程序的原则不是由人规定的，而是机器人自己通过学习、总结经验来获得修改程序的原则。这种机器人已拥有一定的自动规划能力，能够自己安排自己的工作。因为这种机器人可以不要人的照料，完全独立的工作，故称为高级自律机器人。


    ### 1.3.3 按行动方式分类


    一般而言，移动机器人的移动机构主要有轮式移动机构、履带式移动机构及足式移动机构，此外还有步进式移动机构、蠕动式移动机构、蛇行式移动机构、混合式移动机构和飞行式移动机构，以适应不同的工作环境和场合。一般室内移动机器人通常采用轮式移动机构，室外移动机器人为了适应野外环境的需要，多采用履带式移动机构。一些仿生机器人，通常模仿某种生物运动方式而采用相应的移动机构，如机器蛇采用蛇行式移动机构，机器鱼则采用尾鳍推进式移动机构。其中，轮式的效率最高，但适应性能力相对较差；足式的移动适应能力最强，但效率最低。下面分别介绍不同运动机构的机器人及其要点。


    #### 1. 足式移动机器人


    足式移动机构对崎岖路面具有很好的适应能力，足式运动方式的立足点是离散的点，可以在可能到达的地面上选择最优的支撑点，而轮式和履带式移动机构必须面临最坏地形上的几乎所有点。足式运动方式还具有主动隔振能力，尽管地面高低不平，机身的运动仍然可以相当平稳。足式移动机构在不平地面和松软地面上的运动速度较高，能耗较少。


    现有的足式移动机器人的足数可分为单足、双足、三足、四足、六足、八足，甚至更多，仿人机器人产品参数的对比见表 1-1。足的数目多，适合于重载和慢速运动。在实际中，由于双足和四足具有更好的适应性和灵活性，也最接近人类和动物，所以用得最多。


    ![信息来源：2023 世界机器人大会（https://www.worldrobotconference.com/），以及各公司官网。](img/image_048.png)


    表 1-1 仿人机器人产品参数的对比


    ![](img/image_049.jpg)


    UBTECH Robotics 是一家总部位于中国深圳的机器人制造公司，开发了 Walker 系列机器人。UBTECH Walker 能够行走、跳跃、执行各种动作，并与用户进行互动。该系列机器人使用原创
    AI 技术，搭载高性能伺服关节以及多维力觉、多目立体视觉、全向听觉和惯性、测距等全方位的感知系统；全面升级视觉定位导航和手眼协调操作技术，自主运动及决策能力大幅提高，可实现平稳快速的行走和精准安全的交互。


    Unitree H1 是一款由宇树科技公司开发的人形机器人。它具有出色的机械设计和动力学特性，旨在模仿人类的行走和动作。Unitree H1 是一款非常灵活的机器人，具备先进的平衡能力，可以自主行走、爬楼梯、跳跃，甚至进行各种高难度的动作，如翻滚和伸展，如图
    1-38a 所示。作为国内第一台能跑的全尺寸通用人形机器人，Unitree H1 拥有稳定的步态和高度灵活的动作能力，能够在复杂地形和环境中自主行走和奔跑。


