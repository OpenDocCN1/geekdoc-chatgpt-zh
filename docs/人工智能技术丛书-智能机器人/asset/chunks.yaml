    ## **1.3**


    ## **智能机器人分类**


    按照智能机器人的应用功能、智能级别以及行动方式进行分类，有多种不同类别的智能机器人。


    **1.3.1**


    **按应用功能分类**


    **1.传感型机器人**


    传感型机器人是外部受控机器人，机器人的本体上没有智能单元，只有执行机构和感应机构，它具有利用传感信息，包括视觉、听觉、触觉、接近觉、力觉和红外、超声、激光等，进行传感信息处理、实现控制与操作的能力。受控于外部计算机，目前机器人世界杯的小型组比赛使用的机器人属于该类型。


    iRobot公司在2002年9月推出旗舰扫地机器人Roomba系列后一举成名，仅2004一年的销售额就高达100万台，其Roomba980产品是一个典型的传感型机器人，它配备了视觉传感器、接近感应器、碰撞传感器、地毯传感器等多种传感装置，以侦测障碍物、地形的变化和清洁的需求。Roomba980还使用红外传感器来检测房间的轮廓，以确保它可以有效地穿越房间并避开障碍物。这些传感器通过实时收集数据，然后将数据传输到内置的控制单元或外部的计算机，以便机器人能够在房间中自主导航并清扫地面。


    **2.自主型机器人**


    自主型机器人在设计制作之后，不需要人的干预，能够在各种环境下自动完成各项拟人任务。自主型机器人的本体上具有感知、处理、决策、执行等模块，可以像一个自主的人一样独立地活动和处理问题。许多国家都非常重视全自主移动机器人的研究。智能机器人的研究从20世纪60年代初开始，经过几十年的发展，目前，基于感觉控制的智能机器人，又称第二代机器人，已达到实际应用阶段，基于知识控制的智能机器人也取得较大进展，已研制出多种样机。


    波士顿动力公司的机器狗Spot系列是典型的自主型机器人。Spot机器人具备多种传感器，包括视觉、激光雷达和红外传感器，以便在各种环境中感知周围的情况，搭载了内置的计算机和决策系统，可以在不同的任务中做出自主决策，如巡逻、执行搜索和救援操作、执行建筑工作等。Spot机器人还具备移动能力，可以自主导航并穿越各种地形，从楼梯爬升到不同的地点；还可以执行多样的任务，如检查设备、巡逻建筑物或协助在危险环境中工作。波士顿动力的Spot机器人代表了自主型机器人的新一代，它能够在各种环境下独立工作，并且具备感知、决策和执行能力，类似于一个自主的生物体。这个机器人展示了自主型机器人在实际应用中的潜力，可以应对多样的任务和环境，而不需要人的干预。


    **3.交互型机器人**


    交互型机器人通过计算机系统与操作员或程序员进行人机对话，实现对机器人的控制与操作。这类机器人虽然具有部分处理和决策功能，能够独立地实现一些如轨迹规划、简单的避障等功能，但是还要受到外部的控制。


    由软银公司（SoftBank）开发的交互型机器人Pepper是一个具有高度人机交互能力的机器人，能够通过计算机系统与操作员或程序员进行对话，实现对机器人的控制与操作。Pepper具备自然语言处理和语音识别技术，可以与人进行对话、回答问题、识别情感和情绪。它还具有视觉传感器和摄像头，可以识别人类面部表情和动作。虽然Pepper具备一定的自主功能，如轨迹规划和简单的避障，但它仍然需要受到外部的控制，以执行更复杂的任务和指令。Pepper通常用于零售、服务业和教育领域，作为客户服务代表、教育助手或社交伴侣。它的交互性使其能够有效地与人类进行互动，提供信息、娱乐和支持，同时还能够接受来自操作员或程序员的指令，以执行特定任务。Pepper结合了自主性和人机互动，所以能更好地满足不同应用领域的需求。


    小米的CyberOne是一款全新的智能机器人项目，旨在推动机器人技术在中国及全球的发展。CyberOne具有高情商、可感知人类情绪，视觉敏锐、可对真实世界三维虚拟重建，“小脑”发达、可实现双足运动姿态平衡，四肢强健、动力峰值转矩300N·m等领先能力。CyberOne以人工智能为内核，标准人形为载体，搭载小米自研Mi-Sense深度视觉模组，结合AI算法，具有完整的三维空间感知能力，能够实现人物身份识别、手势识别、表情识别的功能。


    **1.3.2**


    **按智能级别分类**


    随着机器人技术的发展，根据功能不同，机器人又被分为一般机器人和智能机器人。其中，一般机器人是指只具有一般编程能力和操作功能的机器人，目前我国生产的机器人大多数属于这一类。智能机器人并没有统一的定义，大多数专家认为智能机器人至少要具备以下几大功能特征：一是具备对不确定作业条件的适应能力；二是具备对复杂对象的灵活操作能力；三是具备与人紧密协调合作的能力；四是具备与人自然交互的能力；五是具备人机合作安全特征。无论是现代的工业机器人还是服务机器人，最终都将发展为具有学习能力的智慧型机器人。智能机器人又称为下一代机器人。随着3D视觉感知、力觉传感器等技术的不断进步和与工业互联网、云计算、大数据等新一代信息技术的深度融合，下一代机器人的智能化程度将进一步提高，对外界的感知能力将进一步增强，可以完成动态、复杂的作业使命，实现多机协同，并与人类协同作业。


    **1.原型机器人**


    原型机器人只能死板地按照人给它规定的程序工作，不管外界条件有何变化，自己都不能对程序也就是对所做的工作进行相应的调整。如果要改变机器人所做的工作，必须由人对程序做相应的改变，因此它几乎是毫无智能的。


    **2.弱智能机器人**


    这类机器人的智能为弱人工智能，是指擅长单个方面的人工智能。例如，战胜世界围棋冠军的人工智能AlphaGo，只会下围棋，而无法辨识一下猫狗等动物。现在实现的几乎全为弱人工智能。


    它们具有像人那样的感受，识别、推理和判断能力，在给定修改程序的原则前提下，可以根据外界条件的变化，在一定范围内自行修改程序，即能适应外界条件变化并自身做相应调整。


    **3.强智能机器人**


    这类机器人是智能类似人类级别的人工智能，即在各方面都能和人类比肩。创造强人工智能比创造弱人工智能难得多，现在还基本做不到。


    美国特拉华大学心理学教授Linda Gottfredson把智能定义为“一种宽泛的心理能力，能够进行思考、计划、解决问题、抽象思维、理解复杂理念、快速学习和从经验中学习等操作”。强人工智能在进行这些操作时应该和人类一样得心应手。


    目前入门级别的强智能机器人具有感觉、识别、推理和判断能力，同样可以根据外界条件的变化，在一定范围内自行修改程序。所不同的是，修改程序的原则不是由人规定的，而是机器人自己通过学习、总结经验来获得修改程序的原则。这种机器人已拥有一定的自动规划能力，能够自己安排自己的工作。因为这种机器人可以不要人的照料，完全独立的工作，故称为高级自律机器人。


    **1.3.3**


    **按行动方式分类**


    一般而言，移动机器人的移动机构主要有轮式移动机构、履带式移动机构及足式移动机构，此外还有步进式移动机构、蠕动式移动机构、蛇行式移动机构、混合式移动机构和飞行式移动机构，以适应不同的工作环境和场合。一般室内移动机器人通常采用轮式移动机构，室外移动机器人为了适应野外环境的需要，多采用履带式移动机构。一些仿生机器人，通常模仿某种生物运动方式而采用相应的移动机构，如机器蛇采用蛇行式移动机构，机器鱼则采用尾鳍推进式移动机构。其中，轮式的效率最高，但适应性能力相对较差；足式的移动适应能力最强，但效率最低。下面分别介绍不同运动机构的机器人及其要点。


    **1.足式移动机器人**


    足式移动机构对崎岖路面具有很好的适应能力，足式运动方式的立足点是离散的点，可以在可能到达的地面上选择最优的支撑点，而轮式和履带式移动机构必须面临最坏地形上的几乎所有点。足式运动方式还具有主动隔振能力，尽管地面高低不平，机身的运动仍然可以相当平稳。足式移动机构在不平地面和松软地面上的运动速度较高，能耗较少。


    现有的足式移动机器人的足数可分为单足、双足、三足、四足、六足、八足，甚至更多，仿人机器人产品参数的对比见表1-1。足的数目多，适合于重载和慢速运动。在实际中，由于双足和四足具有更好的适应性和灵活性，也最接近人类和动物，所以用得最多。


    ![信息来源：2023世界机器人大会（https://www.worldrobotconference.com/），以及各公司官网。](EPUB/images/image_048.png)


    表1-1 仿人机器人产品参数的对比


    ![](EPUB/images/image_049.jpg)


    UBTECH Robotics是一家总部位于中国深圳的机器人制造公司，开发了Walker系列机器人。UBTECH Walker能够行走、跳跃、执行各种动作，并与用户进行互动。该系列机器人使用原创AI技术，搭载高性能伺服关节以及多维力觉、多目立体视觉、全向听觉和惯性、测距等全方位的感知系统；全面升级视觉定位导航和手眼协调操作技术，自主运动及决策能力大幅提高，可实现平稳快速的行走和精准安全的交互。


    Unitree H1是一款由宇树科技公司开发的人形机器人。它具有出色的机械设计和动力学特性，旨在模仿人类的行走和动作。Unitree H1是一款非常灵活的机器人，具备先进的平衡能力，可以自主行走、爬楼梯、跳跃，甚至进行各种高难度的动作，如翻滚和伸展，如图1-38a所示。作为国内第一台能跑的全尺寸通用人形机器人，Unitree H1拥有稳定的步态和高度灵活的动作能力，能够在复杂地形和环境中自主行走和奔跑。


    ![](EPUB/images/image_050.jpg)


    图1-38 双足机器人


    CyberOne是小米公司研发的仿人机器人，如图1-38b所示。CyberOne“大脑”通过听力传感器配合自然语言处理算法可感知45种人类语义情绪，分辨85种环境语义；“小脑”通过小米自研全身控制算法，协调运动21个关节自由度；“视觉”采用深度相机配合AI相机帮助机器人看到真实场景和物体，通过视觉空间系统三维重建真实世界；“四肢”中关节为核心，全身5种关节驱动，峰值转矩300N·m，单手垂直抓握物体质量达1.5kg。


    杭州云深处科技公司专注于四足机器狗的研发。2017年发布了“赤兔”四足机器人，先后推出了“白绝影”“蓝绝影”和“黑绝影”等多个升级版本，其中新一代智能机器狗绝影Lite3如图1-39a所示。


    ![](EPUB/images/image_051.jpg)


    图1-39 四足机器人


    除了上文提到Spot机器人之外，ANYbotics这家瑞士的机器人公司也开发了四足机器人ANYmal，如图1-39b所示。ANYmal可以在各种复杂环境中行走、执行任务，如巡逻、检查设备和执行科研任务。它具备自主导航和避障能力，是一个用于工业和研究应用的高度灵活的机器人，专为复杂的工业厂房而设计，防冲击、防尘防水（满足IP67等级），适合全天候运行；具有完全集成的视觉和热感摄像机、超声波麦克风、强大的LED聚光灯和激光雷达。ANYmal的智能功能能够自主、安全地收集复杂设施中的数据，并集成到现有操作系统中。


    麻省理工学院（MIT）的生物机器人实验室开发了Cheetah机器人，如图1-39c所示，这同样是一款四足机器人，模仿了猎豹的行走方式。Cheetah机器人具有高度的速度和机动性，用于研究生物力学和机器人运动控制。


    **2.飞行机器人**


    空中移动机器人具有广泛的应用，目前其技术已趋成熟，性能日益完善，逐步向小型化、智能化、隐身化方向发展，同时与空中移动机器人相关的雷达、探测、测控、传输、材料等方面也正处于飞速发展的阶段。空中移动机器人主要分为仿昆虫飞行移动机器人、飞行移动机器人、四轴飞行器、微型飞行器等。微型飞行器的研制是一项包含了多种交叉学科的高、精、尖技术，其研究水平在一定程度上可以反映一个国家在微电机系统技术领域内的实力。它的研制不仅是对其自身问题的解决，更重要的是，还能对其他许多相关技术领域的发展起推动作用，所以研制微型飞行器不管是从使用价值方面考虑，还是从推动技术发展考虑，对于我国来说都是迫切需要发展的一项研究工作。


    国内的大疆创新（DJI）公司开发了Mavic Air系列消费级无人机。该系列飞行机器人配备了高性能相机、飞行稳定技术和智能飞行模式，可用于航拍、灾害检测、农业和其他应用领域。Air 3无人机中具有全向视觉感知系统，如图1-40所示，这带来了全方位环境感知能力，可探测各个方向上的障碍物。当探测到障碍物时，还可借助APAS 5.0进行顺滑绕行，保障飞行安全。


    ![](EPUB/images/image_052.jpg)


    图1-40 大疆无人机Air 3


    微型飞行机器通过模仿昆虫扑动微小的翅膀来实现飞行，可以帮助完成耗时的任务，如监测广阔农田的作物生长状况或侦测气体泄漏，由于它们体积小，一般无法使用传统螺旋桨推进。华盛顿大学研发了首个能够独立飞翔的微型机器人RoboFly，如图1-41所示。它比牙签稍重，利用激光束提供动力，通过微型机载电路将激光能源转化为足够的电力，以操纵其翅膀完成飞行任务。


    ![](EPUB/images/image_053.jpg)


    图1-41 RoboFly


    **3.轮式移动机器人**


    轮式移动机器人是移动机器人中应用最多的一种机器人，在相对平坦的地面上，轮式移动方式是相当优越的。轮式移动机构根据车轮的多少有1轮、2轮及多轮机构。4轮移动机构应用最为广泛，可采用不同的方式实现驱动和转向，既可以使用后轮分散驱动，也可以用连杆机构实现4轮同步转向，这种方式比起仅有前轮转向的车辆可实现更小的转弯半径。


    在电影《终结者2：审判日》中有一位令人印象深刻的液态金属机器人，而现实中苏州大学、中国科学技术大学等高校正在积极尝试运用镓等液态金属（LM）合金的受控驱动技术，未来有望设计具有更加出色、结构灵活的移动机器人，中科院液态金属研究展示的轮式结构和运动分析如图1-42所示。


