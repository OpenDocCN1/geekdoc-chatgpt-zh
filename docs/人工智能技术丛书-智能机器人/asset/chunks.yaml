- raw: '在科幻小说中，这三大定律经常用来探讨机器人的伦理和道德挑战，以及机器人与人类的关系。它们赋予机器人智能和情感，引发了许多引人入胜的情节和讨论，使读者不仅对科技和人工智能的未来感到好奇，还对道德和伦理问题产生深刻的思考。在这之上，借助影视、文学作品和学术会议等多方面的推动，人们发现了其中的两大漏洞：在某些情况下，如军用机器人，其存在的意义就是侦察、打击敌人，这是对第一定律不可避免地违背；若机器人将自己判定为人类，则会造成第一、第二定律的失效。


    针对以上情况，人们加以补充了【第零定律】和【第四定律】：


    ◆【第零定律】机器人必须保护人类的整体利益不受损害。


    ◆【第四定律】机器人在任何情况下都必须将自己视为机器人。


    值得注意的是，第零定律凌驾于三大定律之上，这保证了机器人在决策时，会优先考虑多数人类的安全，避免因为逻辑矛盾出现的死机，或决策失误。


    阿西莫夫在科幻小说中提出的“机器人三大定律”，也激发了人们对现实世界中机器人发展的思考。特别是近年人工智能大模型的突破，机器人的智能程度将越来越高，如何约束机器人的行为，防止机器人伤害人类，是一个迫切需要重视和解决的问题。针对越来越具有自主行动能力的智能机器人，设计师在构建时必须从人类安全、法律法规及机器人可持续使用等方面进行完备的逻辑规划。学术界、工业界、国际组织、政府和社会需要积极行动，制定现实世界机器人行为规范的国际乃至星际标准——“机器人定律”。


