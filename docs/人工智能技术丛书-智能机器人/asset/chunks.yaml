    ## 6.2 四足机器人运动控制


    本节主要包括四足机器人的结构设计、四足机器人运动学模型、运动学正逆解问题以及姿态控制仿真四部分内容。


    ### 6.2.1 四足机器人的结构设计


    四足机器人的结构设计包括四足机器人的结构组成、硬件结构以及关节三部分内容。


    #### 1. 四足机器人的结构组成


    四足机器人的结构组成包括四条可以自由活动的四肢和躯干，如图6-13所示。


    四足机器人的腿部关节通常分为髋关节、膝关节和踝关节。通常情况下，每个自由度对应一个执行器，通常采用旋转关节执行器，如图6-14所示。然而，真实动物的关节通常可以具有多个自由度，因此需要采用新型执行机构，尤其是具备大力矩和多自由度的执行器，以更好地模仿四足动物的运动。


    ![](EPUB/images/image_444.jpg)

    图6-13 四足机器人的结构组成


    四足动物的髋关节拥有2个自由度，分别用于左右横跨和前后摆动。左右横跨的自由度会为机器人带来额外的扰动，增加了机器人的控制难度，同时也增加了机器人的机械结构设计复杂度。膝关节通常具有前后摆动的自由度，但膝关节相对于腿部的旋转轴较远，因此膝关节的质量会在很大程度上影响整条腿的转动惯量。如果腿部的转动惯量过大，将不利于腿部的高速运动。踝关节通常拥有类似于髋关节的2个自由度。然而，由于踝关节在动物行走时的主要作用是调节足部与地面的接触，通常不提供动力。因此，在设计四足机器人时，通常将踝关节设计为被动的弹性关节。


    ![](EPUB/images/image_445.jpg)

    图6-14 四足机器人腿部关节结构


    #### 2. 四足机器人的硬件结构


    四足机器人的主要硬件结构包括主处理器、电控系统、关节驱动器和执行部件。


    （1）主处理器 主处理器的作用是完成机器人的步态规划、环境感知以及定位导航等任务，它可以被视为机器人的大脑。主处理器需要读取来自机器人搭载的各类传感器的信息，如视觉传感器数据、关节编码器数据和关节转矩等数据，然后融合这些信息以完成机器人的步态规划和路径规划。随后，主处理器将规划好的信息发送给机器人的关节驱动器，以确保机器人能够稳定地行走并躲避障碍。对于简单的机器人，可以使用单片机、现场可编程门阵列（Field
    Programmable Gate Array，FPGA）等小型处理器；对于大型的复杂的四足机器人，通常需要搭载高性能的处理器，如Intel系列处理器，它们具备高速运算和搭载操作系统的能力。


    （2）电控系统 电控系统的作用是为机器人的各个部件提供所需的能源。一个精心设计的电控系统能够确保机器人能够长时间安全地运行。


    （3）关节驱动器和执行部件 关节驱动器和执行部件是机器人的关键组成部分，它们实际上是机器人的肌肉。这些部件的设计目标是能够输出足够的转矩，以推动机器人的运动关节。为了实现这一目标，通常在执行器和关节之间加入减速箱，将高速低转矩的执行器（如电动机）的输出转化为低速大转矩的关节输出。减速箱应尽量确保低减速比，以降低能量损耗并提高输出精度。此外，执行器和减速箱的整体设计体积也需要尽量小，例如ANYmal机器人的减速箱和伺服电动机。在机器人的关节驱动器接收到主处理器发送的运动信息后，为了实现高精度、低延迟的执行，执行部件的性能非常重要，其中关键是高转矩密度和高功率密度。例如，MIT自主研发的猎豹系列电动机，可以达到33N·m的转矩而质量仅1kg。然而，国内制造的电动机通常难以满足机器人高速运动所需的性能指标。

