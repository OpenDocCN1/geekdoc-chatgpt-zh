    在波士顿动力公司发布的宣传视频中，LS3在携带重物的情况下，仍然可以迅速地爬上陡峭的山坡或通过崎岖不平的道路。


    LS3的高度约1.7m，重约509kg，可以背负181kg的有效负载进行自由行走和奔跑。实际测试表明，LS3在平坦地面上曾成功背负500kg的负载进行自由行走，其最高移动速度可达45km/h。在实际测试中，LS3在崎岖的山路上也能保持相对较快的前进速度。它具有12个自由度，由燃气发动机或柴油发动机提供动力，液压系统驱动机器人的肢体运动。在燃料充足的情况下，LS3可以连续运行24h，行驶的最大里程为32km。


    LS3继承了Big Dog的移动特性，利用地形感测、避障和GPS等技术确保了前进过程的安全性，使其能够顺利到达目标地点。此外，LS3采用了计算机视觉技术，可以实现自动跟踪，无须搭载专门的驾驶员程序即可跟随目标人员前进。


