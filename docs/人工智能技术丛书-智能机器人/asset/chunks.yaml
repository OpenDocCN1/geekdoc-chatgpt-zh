    **3.相机坐标系和世界坐标系**


    世界坐标系和相机坐标系之间的变换属于刚体变换，即物体不会发生形变，只需要进行旋转和平移。


    （1）旋转 如图5-33所示，坐标轴*Oxyz*绕*z*轴旋转*θ*角后得到坐标轴*Ox′y′z′*，假设点*P*在*Oxyz*下的坐标为*P*（*x*，*y*，*z*），在*Ox′y′z′*下的坐标为*P*（*x′*，*y′*，*z′*），则两者之间满足以下关系


    *x*\=*x′*cos*θ-y′*sin*θ*


    *y*\=*x′*sin*θ*+*y′*cos*θ*


    *z*\=*z′*


    用矩阵形式表示为


    ![](EPUB/images/image_402.jpg)


    同理，绕*x*轴和*y*轴旋转*φ*和*ω*，可得到


    ![](EPUB/images/image_403.jpg)


    于是可以得到旋转矩阵***R***\=***R***[1]***R***[2]***R***[3]。


    ![](EPUB/images/image_404.jpg)


    图5-33 坐标轴的旋转（绕*z*轴）


    （2）平移 上述所说的旋转无论绕哪个轴转，坐标原点都是不变的，但加上平移后，坐标原点就会发生改变了。


    如图5-34所示，假设点*P*在相机坐标系*O*[c]下的坐标为*P*（*x*[c]，*y*[c]，*z*[c]），在世界坐标系*O*[w]下的坐标为*P*（*x*[w]，*y*[w]，*z*[w]），偏移矩阵为***T***，则有


    ![](EPUB/images/image_405.jpg)


    因此，通过上面四个坐标系的转换可以将一个点从世界坐标系转换到像素坐标系，即


    ![](EPUB/images/image_406.jpg)


    其中，最右边等式的第一个矩阵为相机内参，第二个矩阵为相机外参。一般深度相机（如realsense D435i）的内参可以通过官方提供的API直接获取，相机外参可以通过手眼标定得到。


    ![](EPUB/images/image_407.jpg)


    图5-34 坐标轴的旋转和平移


    通过以上公式，就可以将世界坐标系下的一个三维点转换成图像上对应的像素点。同样，对于深度相机来说，也可以轻易地将图像中的一个像素点转换成世界坐标系下的三维点，因为深度相机可以从图像的深度图中获取对应像素点的深度值，也就是*z*[c]值。但是对于非深度相机来说，由于并不知道等式左边的*z*[c]值，所以通过图像中的一个像素点是不容易得到它在世界坐标系下的三维点的。


