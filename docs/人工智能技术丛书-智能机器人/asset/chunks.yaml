    在图6-22中，HAA代表“Hip Abduction and Adduction”，即髋关节的外展和内收。这是髋部关节的一个自由度，用于控制机器人腿在水平平面上的左右移动，就像人的大腿在髋部的运动一样。外展和内收的运动帮助机器人在水平面上保持平衡，特别是当机器人需要调整其支撑腿的位置时。HFE代表“Hip
    Flexion and Extension”，即髋关节的屈曲和伸展。这是髋部关节的另一个自由度，用于控制机器人腿的在前后平面上的运动，就像人的大腿在髋部的屈曲和伸展一样。这个运动允许机器人提升或放下其腿，帮助机器人适应不同高度的地形或执行不同的动作。KFE代表“Knee
    Flexion and Extension”，即膝关节的屈曲和伸展。这是膝关节的自由度，用于控制机器人腿在膝部的弯曲和伸展。这个运动允许机器人调整腿的长度，以适应不同高度的地形或执行不同的动作。机器人通常使用膝关节来实现弯曲和伸展的运动，就像人类的膝盖一样。


