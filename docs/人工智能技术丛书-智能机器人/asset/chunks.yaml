    相关的产品参数见表3-2。


    表3-2 ZED X与ZED X Mini产品参数


    ![](EPUB/images/image_181.jpg)


    视场（Field of View，FOV）指相机能够观察到的范围或角度。它表示相机能够看到的水平（H）和垂直（V）的角度范围，以及深度（D）的角度范围（如果适用）。110（H）°×80
    °（V）×120 °（D）表示相机的水平视场角为110 °，垂直视场角为80 °，深度视场角为120°。这意味着相机可以水平方向上捕捉到110°范围内的景象，垂直方向上捕捉到80°范围内的景象，并且在深度方向上可以捕捉到120°范围内的景象。


