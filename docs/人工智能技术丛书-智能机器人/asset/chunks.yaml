    85 种环境语义；“小脑”通过小米自研全身控制算法，协调运动 21 个关节自由度；“视觉”采用深度相机配合 AI 相机帮助机器人看到真实场景和物体，通过视觉空间系统三维重建真实世界；“四肢”中关节为核心，全身
