    ## 5.2 MoveIt！控制机械臂


    `MoveIt！`是`ROS`中针对机器人进行移动操作的一套工具。主页（`http://moveit.ros.org`）包含使用`MoveIt！`的文档、教程、安装说明以及多种机械臂（或机器人）的示例演示，如一些移动操作任务，包括抓握、拾取和放置，或简单的逆向运动学的运动规划。


    这套工具包含一个快速的逆运动学求解器（作为运动规划单元的一部分）、先进的操作算法、三维感知抓握（通常以点云的形式）、运动学、控制和导航等功能。除了后台功能之外，它还提供了一个易于使用的图形用户界面（`GUI`）通过`MoveIt！`和`Rviz`插件集成自己的机械臂，使用户能以直观的方式进行运动规划任务的开发。


    本节首先介绍`MoveIt！`体系结构，解释这套框架中所用到的基本概念，如关节群组和规划场景，以及一般性的概念，如轨迹规划、（逆）运动和碰撞检测等。然后，介绍如何将机械臂集成到`MoveIt！`中，并利用其控制机械臂进行抓取操作等。


    ### 5.2.1 MoveIt！体系结构


    `MoveIt！`体系结构如图 5-14 所示，内容选自官方文档的概念部分，这里简要介绍主要概念。


    体系结构的核心是`move_group`元件。其主要思想是，先依据需要定义由关节和其他元件构成的群组（`group`），然后使用运动规划算法执行移动操作。这类算法包含与物体交互的场景以及该群组的关节特性。


    ![](img/image_368.jpg)


    图 5-14 `MoveIt！`体系结构


    可以使用`ROS`参数服务器来配置`move-group`，从那里还可以获取机器人的`URDF`和`SDF`等。必须对关节进行定义，它们是一个群组的部分并包含关节约束。同样，可定义末端执行器的工具，如夹持器和感知传感器。机器人必须开放`JointTrajectoryAction`（关节轨迹动作）控制器，从而使运动规划的输出可以在机器人的硬件（或仿真器）上规划执行。为了监视执行情况，需要通过机器人状态发布者发布关节状态。所有内容都由`ROS`控制并由特定传感器驱动程序发布。需要注意的是，`MoveIt！`提供了一个`GUI`向导帮助定义给定机器人的关节群组，它可以通过下面的命令直接调用：


    ![](img/image_369.jpg)


    当`move_group`正确配置后，就可以和机器人连接并通信。`MoveIt！`提供了`C++`和`Python`的应用程序接口以及一个集成的`Rviz`插件来实现此功能，通过`Rviz`和应用程序接口可以向机器人发送运动目标、规划任务并发送给机器人进行执行等。集成到`Rviz`中的`UR5`机械臂如图
    5-15 所示。


