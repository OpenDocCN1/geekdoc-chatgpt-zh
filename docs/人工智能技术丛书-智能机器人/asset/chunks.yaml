    ## **7.3**


    ## **人形机器人肢体**


    人形机器人的肢体包括躯干和四肢，它们不仅是结构的核心，也是整合高级功能的关键部分。这些组件的设计兼顾了机械强度、灵活性和功能性，确保机器人能够在各种环境下稳定运行，并支持复杂的人类动作模仿。本节将介绍人形机器人躯干和四肢设计的相关内容，关注其肢体设计、关节和运动机构、躯干和四肢结构、材料选择与制造技术。


    **7.3.1**


    **人形机器人肢体设计**


    人形机器人的肢体设计主要包括人形机器人躯干设计和四肢设计。


    **1.躯干设计**


    躯干是人形机器人的主要支撑结构，承载着关键的机械和电子系统，包括动力源、传感器和控制模块。有效的躯干设计应考虑以下关键方面：


    （1）模块化 设计应允许快速更换或升级关键组件，如电池、驱动模块或传感器。这种模块化不仅提高了维护和升级的效率，也增强了机器人的适应性，使其能根据不同的任务需求灵活调整。


    （2）紧凑性 通过减少机器人体积和质量来提高能效和灵活性。紧凑的设计使机器人能在狭小或复杂的环境中更灵活地操作，同时减少能量消耗，延长工作时间。


    （3）稳定性 在设计时确保机器人在执行各种活动，特别是在不平坦的地面上或执行复杂动作时，能够保持平衡。这通常需要通过精确的重心位置设计、姿态控制技术和动态平衡算法来实现，以保证机器人在各种操作中的安全性和可靠性。


    **2.四肢设计**


    四肢设计关键在于实现与人类相似的灵活性和力量，同时保证足够的机械强度和精确控制。四肢通常包括多个关节和伺服电动机，使机器人能够进行精细的动作控制，如走路、抓取或搬运物品。有效的四肢设计应考虑以下关键方面：


    （1）关节灵活性 关节设计必须能够模仿人类关节的运动范围，同时保持足够的力量和速度，以执行各种复杂任务。


    （2）力量与精度的平衡 四肢的电动机和传动系统需精心设计，以便在保证足够力量的同时，也能进行精细的速度和位置控制。


    （3）感应与反馈 在四肢的关节中集成高级传感器，如扭矩传感器和位置传感器，可以实时监测和调整机器人的动作，确保动作的准确性和对环境变化的适应性。


    **7.3.2**


    **关节和运动机构**


    关节和运动机构的设计在人形机器人的开发中扮演着核心角色，因为它们不仅需要模仿人类关节的运动范围和精度，还必须保证机器人在执行任务时的力量和稳定性。


    **1.伺服电动机**


    伺服电动机是人形机器人关节中最常用的驱动元件，它提供精确的角度控制和强大的扭矩，使机器人能够进行精细的动作调整。这种电机具有高度的可控性，能够快速响应指令变化，非常适合需要高精度和高可靠性的应用场景。伺服电动机的选择和配置对实现机器人的流畅和自然运动至关重要。


    **2.电力系统**


    电力系统为人形机器人的关节和运动机构提供必需的能量。为了保证足够的功率和持续的操作能力，电力系统通常包括高效能的电池或超级电容，这些电源解决方案必须优化以适应机器人的能耗需求和质量分布。此外，电力系统也需要智能设计，以优化能量使用效率和保证机器人在执行长时间任务时的能量稳定性。


    **3.传感反馈系统**


    为了增强人形机器人的交互能力和动作精确性，关节中通常集成了多种传感器来提供实时的力量和位置反馈。


    1）头部视觉传感器，用于捕捉环境图像和进行深度感知，帮助机器人更好地理解周围环境。


    2）手部力/扭矩传感器，使机器人能够感知抓握和操作时的力度，避免对物体造成损害。


    3）足部力/扭矩传感器，用于监测行走或站立时的压力分布，帮助机器人保持平衡。


    **4.核心零部件丝杠**


    丝杠是一种将旋转运动转换为直线运动（或反之）的高精度机械零件，通过旋转丝杠，螺母沿着丝杠的轴向移动，如图7-20所示。丝杠在机器人领域尤其重要，常用于关节和运动机构的传动，以实现精确的运动控制，丝杠主要有三种类型：梯形丝杠、滚珠丝杠和行星滚柱丝杠。


    ![](EPUB/images/image_566.jpg)


    图7-20 丝杠示意图


    1）梯形丝杠。这种丝杠利用梯形螺纹进行运动转换。当丝杠旋转时，螺母会沿着丝杠的方向前进或后退，从而实现机械传动。这种类型的丝杠结构简单，但精度相对较低。梯形丝杠如图7-21所示。


    2）滚珠丝杠。这种丝杠相对螺母旋转时，其旋转面通过滚珠的循环滚动推动螺母轴向移动，化旋转运动为直线运动，丝杠和螺母之间的滑动摩擦转变为滚珠与丝杠、螺母之间的滚动摩擦，传动效率高、精度较高。滚珠丝杠如图7-22所示。


    ![](EPUB/images/image_567.jpg)


    ▲图7-21 梯形丝杠


    ![](EPUB/images/image_568.jpg)


    图7-22 滚珠丝杠


    3）行星滚柱丝杠是一种高精度的传动机构，它利用丝杠的旋转作为驱动力。当丝杠旋转时，滚柱围绕丝杠进行行星式运动，并通过螺旋传动原理，将丝杠的旋转运动转化为螺母的直线往复运动。这种设计特点使行星滚柱丝杠具备高承载能力、小体积和高精度等优势。行星滚柱丝杠如图7-23所示。


    ![](EPUB/images/image_569.jpg)


    图7-23 行星滚柱丝杠


    **5.先进的关节和关节设计**


    为了提高机器人的灵活性和适应性，关节设计必须模仿人体的结构，同时也要考虑到机械的耐用性和维护的便捷性。


    1）旋转关节，允许机器人的手臂和腿部进行旋转运动，模拟人类的自然运动。旋转关节如图7-24所示。


    ![](EPUB/images/image_570.jpg)


    图7-24 旋转关节


    2）直线关节，在某些特定应用中使用，如在机器人脊柱部分，提供直线移动以支持机器人身体的弯曲和伸展。直线关节如图7-25所示。


    ![](EPUB/images/image_571.jpg)


    图7-25 直线关节


    3）空心杯关节，这种特殊设计的关节可以在不增加额外质量的情况下提供更大的运动自由度。空心杯关节如图7-26所示。


    ![](EPUB/images/image_572.jpg)


    图7-26 空心杯关节


    **6.灵巧手**


    人形机器人的灵巧手旨在模仿人类手部的功能，实现精细的抓取和操作任务，其复杂的设计和高精度的控制系统使得它能够执行与人手相似的多样化功能。人形机器人灵巧手如图7-27所示。


    ![](EPUB/images/image_573.jpg)


    图7-27 人形机器人灵巧手


    灵巧手作为机器人新型末端执行器，是机器人研究的重要课题。自20世纪70年代起，国内外对灵巧手进行了大量研究，从三指到五指，从工业到生活，从简单的抓取到复杂操作，相关市场主体不断推动灵巧手的研究成果，以解决日益复杂的实际作业问题。近年来，国际上代表性的灵巧手厂商有SCHUNK、Shadow
    Robot、qb Robotics、Clone Robotics等；国内代表性的灵巧手厂商或实验室则有蓝胖子机器智能（Dorabot）、因时机器人、腾讯Robotics
    X实验室等。随着人形机器人产业化的加速，国内外对灵巧手领域的研究也呈现加速趋势。典型的灵巧手系统在集成度和机电一体化程度上有了显著提高，能够更准确地完成一些人类手的基本功能。


    （1）灵巧手在运动控制和交互中起关键作用


    1）灵巧手的重要性：灵巧手在机器人运动控制和环境交互中具有至关重要的作用。通常，机器人与环境的交互包括移动行走、视觉信息获取和决策执行输出。末端执行器是机器人执行任务的部件，通常安装于机器人腕部末端，直接执行任务。末端执行器在提升机器人柔性和易用性方面极为重要，其性能在很大程度上决定了机器人的整体工作性能。


    2）灵巧手的结构与功能：灵巧手模仿人手的结构和功能，在机器人与环境的交互中起关键作用。“灵巧”指的是手的姿势可变性，这种可变性越高，手就越灵巧。


    3）两指夹持器：两指夹持器模仿手指的夹持运动，能够在执行某些动作的同时夹住和松开目标物体。应用于机器人末端的夹持器通常采用电机或气缸作为驱动，机构原理以多连杆机构和气缸为主。例如，德国SCHUNK公司的气动平行爪夹持器、FESTO公司的气动夹持器、亚德客的手指气缸等。


    4）多指抓持手：多指抓持手通常为三指或四指，主要包括联动型抓持手、多关节手指抓持手和软体多指抓持手等。其基本原理与两指夹持器相同，由多连杆或气缸驱动实现多指同步运动。例如，Righthand
    Robotics公司的ReFlex TakkTile三指手、苏州钧舵机器人有限公司的均巧三指手、德国SCHUNK公司的SDH三指手等。


    5）多指灵巧手：多指灵巧手具有多指多关节结构，手指数目通常为3～5个，每个手指具有3个关节，关节运动采用转动副。其主要驱动方式包括液压驱动、电机驱动、气压驱动和形状记忆合金驱动。例如，日本“电子技术实验室”的Okada灵巧手、美国斯坦福大学的Stanford/JPL灵巧手、美国麻省理工学院和犹他大学联合研制的Utah/MIT灵巧手等。


    6）传动方式：灵巧手常见的传动方式有腱绳传动、连杆传动、齿轮传动和带传动，其中腱绳传动应用最为广泛。腱绳传动模拟人手的肌腱结构，使得大型驱动器远离执行机构，减轻了末端负载和惯量，提升了抓取速度和灵活性。尽管腱绳传动具有高效、灵活的优势，但也面临负载能力较弱、预紧力变化大、负载越大效率越低等挑战。


    （2）机器人灵巧手深度仿生 多指灵巧手最初在结构上模仿人手的设计，随着复杂应用需求的增加，研究逐渐深入人手的内在结构、驱动和传动原理等方面的仿生设计，并扩展到复合材料和智能材料的开发。智能材料的研究反过来也影响了多指灵巧手的仿生设计。此外，对人手操作过程的研究在很大程度上决定了多指灵巧手的仿生程度，并成为评估其仿生性能的重要指标。


    1）柔性感知技术：由于人手结构复杂、功能多样且感觉丰富，实现仿生的机器人灵巧手需要具备类似于人类皮肤的柔性感知技术和传感器。这些触觉传感器用于实时传输与物体接触的信息，但目前仍面临诸多挑战。


    2）理解高级语义信息：机器人需要从低级感官数据中提取出任务需求和人类偏好等高级语义信息，首先要识别被操作的对象并确定所需的操作类型，即任务要求。


    3）跨模态算法：人类通过整合多种感官信息（如触觉、视觉、声音等）来理解物体。视觉数据提供几何属性，触觉数据提供物理属性（如质量或硬度），两者互补共存。整合多种感知模式的传感器能够解决单一传感器的局限性，获得更丰富的环境信息，但需要进一步探索如何建立不同模态信息的统一特征表示和关联关系。


    4）探索中的安全性问题：在机器人手与物体的物理交互和触觉探索过程中，需要保证机器人手及其周围环境的安全。一方面，要及时采集触觉信号并传递给控制器，并具备避免不必要伤害的能力。另一方面，由于对象模型未知，机器人可能会违反一些关键约束。具有一定自愈能力和拉伸能力的系统，可以在勘探过程中发生意外损伤时保持安全性。


    5）提升触觉传感器的灵活性：由于机器人手的表面通常是不规则的，柔性传感器比刚性传感器更容易与手的表面集成。柔性传感器可以覆盖整个手掌表面，而不仅限于指尖，从而提供更丰富的接触信息。触觉传感器的其他性能也需要进一步提高，如自愈能力和自供电能力。具有自修复能力的触觉传感器可以提高其对非结构环境的适应能力。


    6）新材料的应用：许多灵巧手的研究通过骨架结构和橡胶等软体材料模拟人手的外形，虽然可以有效完成抓、握、捏、拧等日常手部动作，但在实际应用中仍存在包络性、灵活性和稳定性差等问题。为了保持灵巧性和抓取的稳定性，需要根据仿生学模拟生物体的环境适应性、高效能和合理的身体结构，开发新型材料并用于灵巧手的研发，以最大化利用生物优势。目前，国内外专家通过还原肌肉纤维和结构组织的研发，在拾取装置中已经取得了良好效果，多层次的人手和机器人手结构对比如图7-28所示。


