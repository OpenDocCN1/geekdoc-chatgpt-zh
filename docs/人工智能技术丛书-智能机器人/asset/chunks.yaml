    当命令执行后，会打开如图5-16所示的初始界面。可以通过单击初始界面的“创建新的MoveIt配置包”（Create New MoveIt Configuration Package）按钮或者“编辑已存在MoveIt配置包”（Edit Existing MoveIt Configuration Package）按钮来加载UR5机械臂的描述文件（URDF）。机械臂的描述文件推荐使用XML Macros宏（Xacro）格式，这样更容易生成复杂的URDF文件。


