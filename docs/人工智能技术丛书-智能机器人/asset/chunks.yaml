    ## 4.2 基于SLAM的定位与导航


    `SLAM`（Simultaneous Localization and Mapping，同步定位与地图构建），也称为`CML`（Concurrent Mapping
    and Localization，并发建图与定位）。`SLAM`描述为：将一个机器人放入未知环境中的未知位置，是否有办法让机器人一边移动一边逐步描绘出此环境完全的地图。完全的地图是指不受障碍行进到房间可进入的每个角落。`SLAM`与路径规划就是定位和导航中的关键技术。


    `SLAM`一词最早出现在机器人领域，意为同步定位与地图构建，包含了定位与建图两大部分，其中又以定位更为核心，建图实际上是在定位的基础上进行的，将获取的数据进行融合的过程。


    通常`SLAM`包含特征提取、数据关联、状态估计以及状态更新等多个部分，不仅可以应用于2D运动领域，同时还可应用于3D运动领域。针对室内环境中运行的机器人来说，当机器人想到达某地时，首先需要利用传感器（如激光雷达）来感知周围环境，如在机器人的前方出现一个障碍物，机器人想绕开这个障碍物，就得知道障碍物的大小及离自身的位置，该问题便可通过`SLAM`来解决。


    ### 4.2.1 视觉SLAM


    视觉导航是通过摄像机对周围环境进行图像采集，并对图像进行滤波和计算，完成自身位置确定和路径识别，并做出导航决策的一种新的导航技术。


    传统意义上实现视觉导航的`SLAM`的传感器主要是相机，按照工作方式的不同，相机可以分为单目（`Monocular`）相机、双目（`Stereo`）和深度（`RGB-D`）相机三大类，如图4-15所示。


    ![](EPUB/images/image_282.jpg)


    图4-15 单目、双目和深度相机


    不同类型相机的特点见表4-1。


    ![](EPUB/images/image_283.jpg)


    在运动过程中，相机将得到一系列连续变化的图像。视觉`SLAM`的目标就是根据这些图像，进行定位和建图。但这件事情不是那么简单，需要一个完整的算法框架。经过研究者们的长期努力工作，已经发展出一套完整的算法框架，如图4-16所示。


    ![](EPUB/images/image_284.jpg)


    图4-16 算法框架


    1）传感器数据读取：在视觉`SLAM`中主要为相机图像信息的读取和预处理。


    2）前端（视觉里程计）：视觉里程计的任务是估算相邻图像间相机的运动和局部地图。


    3）后端（非线性优化）：前端输出的数据有相机位姿和路标点坐标，后端将这些数据结合回环检测的信息进行优化，得到全局一致的轨迹和地图。


    4）回环检测：判断机器人是否到达了曾经到过的位置。如果坚持到了回环，会把信息提供给后端进行处理。


    5）建图：根据估计的轨迹和路标点坐标建立任务需要的地图。


    经典的视觉`SLAM`框架是过去十几年的研究成果。这个框架本身及其包含的算法已经基本定型，并且已经在许多视觉程序库和机器人程序库中提供。依靠这些算法，能够构建一个视觉系统，使之在正常的工作环境里实时定位与建图。因此，如果把工作环境限定在静态、刚体、光照变化不明显、没有人为干扰的场景，那么这种场景下的大屏幕技术已经相当成熟。


    在`ROS`中提供下列几种基于视觉的`SLAM`算法，分别是：`RGB-D SLAM`、`ORB-SLAM`、`ORB-SLAM2`和`RTAB-Map`。下面主要介绍`ORB-SLAM`、`ORB-SLAM2`和`RTAB-Map`，因为它集成了三种常用的相机。


    #### 1. `ORB-SLAM`


    `ORB-SLAM`是一种基于`ORB`特征的三维定位与地图构建算法。该算法由Raul Mur-Artal、J.M.M.Montiel和Juan D.Tardos于2016年发表在IEEE
    Transactions on Robotics。`ORB-SLAM`基于单目相机，在了解`ORB-SLAM`之前需要了解以下相关内容。


    ##### （1）`ORB`特征

    在前面的介绍中可知，一个`SLAM`系统分为前端和后端，其中前端也称为视觉里程计，其任务就是根据相邻图像信息估计出粗略的相机运动，给后端提供较好的初始值。视觉里程计的算法主要分为两大类：特征点法和直接法。下面主要介绍特征点法，因为这是`ORB-SALM`所使用的方法。


    基于特征点的方法可以理解为：首先从图像选取一些比较具有代表性的点，这些点在相机发生少量变化后会保持不变，于是能在各个图像中找到相同的点；然后在这些点的基础上，讨论相机位姿估计的问题，以及这些点的定位问题。所以这就成了两个相邻图像关键点的提取和匹配的问题，接下来简要介绍如何提取和匹配`ORB`。


    `ORB`特征由关键点和描述子两部分组成。它的关键点称为Oriented `FAST`，是一种改进的`FAST`角点。它的描述子称为`BRIEF`。因此，提取`ORB`特征可以分为如下两个步骤：


    1）`FAST`角点提取：找出图像中的“角点”。相较于原版的`FAST`，`ORB`中计算了特征点的主方向，为后续的`BRIEF`描述子增加了旋转不变特性。


    `FAST`是一种角点，主要检测局部像素灰度变化明显的地方，以速度快著称，如图4-17所示。它的思想是：如果一个像素与它领域的像素差别较大，那它更可能是角点。相比于其他角点检测算法，`FAST`只需比较像素亮度大小，十分快捷。其检测过程如下：


    ![](EPUB/images/image_285.jpg)


    图4-17 `FAST`角点提取


    ①在图像中选取像素`p`，假设它的亮度为`I[p]`。


    ②设置一个阈值`T`（例如`I[p]`的`T`值20%）；


    ③以像素`p`为中心，选取半径为3的圆上的16个像素点。


    ④假如选取的圆上，有连续的`N`个点的亮度大于`I[p]`+`T`或小于`I[p]`-`T`，那么像素`p`可以被认为是特征点（一般`N`取9或12）。


    ⑤循环以上四步，对每一个像素执行相同的操作。


    此外，原始的`FAST`角点经常出现“扎堆”的现象，所以在第一遍检测之后，还需要用非极大值抑制，在一定区域内仅保留响应极大值的角点，避免角点集中的问题。`ORB`在此基础上添加了尺度和旋转的描述。尺度不变性由构建图像金字塔，并在金字塔的每一次层上检测角点得到，而特征旋转由灰度质心法实现。


    2）`BRIEF`描述子：对前一步提取出特征点的周围图像区域进行描述。`ORB`对`BRIEF`进行了一些改进，主要是在`BRIEF`中使用了先前计算的方向信息。


    `BRIEF`是一种二进制描述子，它的描述向量由`N`（`N`一般取128或者256）个0和1组成，这里的0和1编码了关键点附近两个像素（如`p`和`q`）的大小关系：如果`p`比`q`大，则取1，反之就取0。按照某种概率分布取了`N`个这样的`p`、`q`，最后就得到由0、1组成的`N`维向量。


    经历了前面的步骤，下面就可以进行特征匹配，特征匹配是通过图像与图像或者图像与地图之间的描述子进行的。最简单的特征匹配方法就是暴力匹配，即对`I[t]`中每一个特征点与所有的`I[t+1]`中的特征点测量描述子距离，选择最小的作为匹配点。对于`BRIEF`使用汉明距离作为度量。但是暴力匹配往往不能符合`SLAM`实时性的需求，快速近似最近邻库（`FLANN`）更适合于匹配点极多的情况。


    在匹配之后，可以对匹配进行筛选，以确保大多数匹配是正确的，如图4-18所示。至此简单地了解了如何进行特征提取和匹配。接下来就是利用这些匹配点来恢复出两帧之间的摄像机运动。


    ![](EPUB/images/image_286.jpg)


    图4-18 未筛选的匹配和筛选过后的匹配


    （筛选策略：汉明距离小于最小距离的两倍）


    ##### （2）光束平差法（`BA`）

    `BA`指从视觉图像中提炼出最优的3D模型和相机参数。考虑从任意特征点发射出来的几束光线，它们会在几个相机的成像平面上变成像素或是检测到的特征点。如果调整各相机姿态和各特征点的空间位置，使得这些光线最终收束到相机的光心，就称为`BA`。下面使用一个小例子来介绍`BA`。


    图4-19描述的是`X[i]`分别投影到了`P[i]`，这就是一个普通的投影过程，并没有什么特殊的地方。在`SLAM`中，前端的视觉里程计会计算出相邻两幅图像之间的变换关系和地图点的空间位置，对应图4-19就是可以计算出`P[1]`和`P[2]`之间的变化关系，进而利用变换关系求得
    `X[2]`，但是，计算结果和真实值之间存在差异。由于计算误差的存在，求得的 `X[2]`与真实坐标`X[2]`并不会完全重合，这个误差被称为重投影误差。


    ![](EPUB/images/image_289.jpg)


    图4-19 光束平差法（`BA`）


    一次观测的误差`e`为


    `e = z - h(T, p)`


    式中，`z`为观测数据，可以认为它是真实的数据；`h`为通过位姿变化求的数据；`T`为机器人的位姿；`p`为特征点位置。因为相机在每个时刻的观测量不止一个，把每个观测量都考虑进来，就可以得到整体的代价函数为


    ![](EPUB/images/image_290.jpg)


    对这个最小二乘问题求解，相当于对位姿和路标做了调整，也就是`BA`。


    有了上面的了解，就可以知道`ORB-SLAM`是如何实现的。`ORB-SLAM`系统概述如图4-20所示。


    ![](EPUB/images/image_291.jpg)


    图4-20 `ORB-SLAM`系统概述


    `ORB-SLAM`创新式地使用了3个线程完成`SLAM`：实时跟踪特征点的`Tracking`线程、局部`BA`的优化线程（`Co-visibility
    Graph`，俗称小图），以及全局位姿图的回环检测与优化线程（`Essential Graph`，俗称大图）。其中，`Tracking`线程负责对每幅新来的图像提取`ORB`特征点，并与最近的关键帧进行比较，计算特征点的位置并粗略估计相机位姿。小图线程求解一个`BA`问题，它包括局部空间内的特征点与相机位姿。该线程负责求解更精细的相机位姿与特征点空间位置。仅有前两个线程，只能算完成了一个比较好的视觉里程计。第三个线程，也就是大图线程，对全局的地图与关键帧进行回环检测，消除累积误差。由于全局地图中的地图点太多，所以这个线程的优化不包括地图点，而只有相机位姿组成的位姿图。


    #### 2. `ORB-SLAM2`


    `ORB-SLAM2`整体还是基于`ORB-SLAM`的结构，但对部分细节做了改进，适用面更广，`ORB-SLAM2`系统概述如图4-21所示。`ORB-SLAM2`比`ORB-SLAM`多支持双目和`RGB-D`相机，所以它集成了三种最常使用的相机。


    ![](EPUB/images/image_292.jpg)


    图4-21 `ORB-SLAM2`系统概述


    `ORB-SLAM2`较`ORB-SLAM`去除了初始化的部分，增加预处理部分（因为可以直接获取深度信息）主要是面对双目和`RBG-D`，将两份特征合并为一份来提供更多信息，提高精度。增加全局`BA`，提高建图精度（发生在回环检测之后，单起一个线程），即在单目初始化之后、回环检测之后进行全局`BA`优化，对所有关键帧的位姿、路标点进行优化。`ORB-SLAM2`运行`TUM`数据集的效果如图4-22所示。


    ![](EPUB/images/image_293.jpg)


    图4-22 `ORB-SLAM2`运行`TUM`数据集的效果（详见彩插）


    #### 3. `RTAB-Map`


    `RTAB-Map`（Real-Time Appearance-Based Mapping）是具有实时约束的`RGB-D SLAM`方法，它是一种基于增量式外观特征进行闭环检测的`SLAM`框架，可以支持`RGB-D`相机、双目相机或激光雷达进行建图和定位。闭环检测器使用词袋方法来确定新图像来自先前位置或新位置的可能性。当检测到闭环时，新约束将被添加到地图中，然后采用图优化的方式进行误差最小化。`RTAB-Map`使用内存管理方法来限制用于闭环检测和图优化的位置数量，以便大规模环境处理的实时性，`RTAB-Map`支持手持的`RGB-D`相机、双目相机或三维激光雷达进行六自由度建图，其建图流程如图4-23所示。


    ![](EPUB/images/image_294.jpg)


    图4-23 `RTAB-Map`建图流程


    图4-23所示为标准的基于图优化的`SLAM`架构，传感器信息经过时间对准之后，进入`STM`（Short Time Memory，短时记忆）模块，然后进行前端处理，后端进行图优化和全局地图维护。在图4-23中，连接表示两个节点之间的刚性变换。这里包括了三种类型的连接：邻居、闭环和相似。邻居连接是在`STM`里面通过odom转换建立的，而闭环和相似则是通过闭环检测和相似性检测实现的。这些连接都作为图优化的约束条件。当出现新的闭环或相似时，图优化将计算误差并传播到全图，以减小里程计漂移。同时，伴随着优化过程，`Octomap`、点云和2D栅格地图等都在被全局更新。


    ### 4.2.2 激光雷达SLAM


    与传统的相机传感器相比，使用有源光源的激光雷达在不受光线变化影响的情况下，通常可以实现更高的测量精度，获得更密集的环境信息，在高速运动条件下也能稳定工作。因此，激光雷达`SLAM`通常可以在室内环境中提供更强大的定位性能，因此应用广泛，如图4-24所示。


    ![](EPUB/images/image_295.jpg)


    图4-24 激光雷达`SLAM`的应用


    扫地机器人通常在顶部安装激光雷达，服务机器人则在脚步开槽，内置激光雷达。

