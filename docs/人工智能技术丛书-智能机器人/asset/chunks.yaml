    ## 1）灵巧手性能评价

    灵巧性、可靠性和抓取能力是衡量灵巧手性能的三大要素，不同应用场景各有侧重。在工厂的货物搬运中，灵巧手需具备高抓取能力；在复杂工况中，对灵巧手的可靠性要求较高；在日常家庭应用中，需要综合兼顾这三方面的要素。


    ### ①灵巧性

    由自由度和执行器数量共同决定，可分为全驱动和欠驱动两种方式。自由度数目越高，灵巧手能实现的抓取动作越多样。根据《手部姿态估计方法综述》，人手共有 26 个自由度，其中手指和手腕分别有
    20 个和 6 个自由度。现有灵巧手方案主要实现各手指关节的旋转自由度和拇指向内闭合的自由度。执行器数量决定了能独立控制的自由度数目。全驱动灵巧手每个自由度都能独立控制，灵活性更高。根据多项数据显示，智元机器人的单手具有
    12 个自由度和 7 个执行器，特斯拉一代机器人具有 11 个自由度和 6 个执行器，而 Shadow 协作灵巧手具有 24 个自由度和 20 个执行器。


    ### ②抓重比

    抓重比是衡量灵巧手抓取能力的重要指标，指灵巧手垂直抓握物体的质量与自身质量的比值。人的单手质量约为体重的 0.58%，假设一位 70kg 的成年人（单手质量约为
    0.4kg）单手可以抓起一个 5kg 的物体，抓重比超过 12。目前，机器人灵巧手的抓重比远小于人手。根据 Shadow Hand 产品手册，Shadow
    灵巧手质量为 4.3kg，可抓取 5kg 的物体，抓重比约为 1.2。


    ### ③可靠性

    指灵巧手在长时间运作和各种条件下性能稳定、故障率低。以目前广泛使用的绳驱方式为例，其在大负载下的功能实现和使用寿命与人手有较大差距，实现高可靠性需要更多的执行器或更复杂的传感方案。


    ## 2）性能与成本的博弈

    驱动、传动和传感装置是灵巧手的三大组成要素，共同决定其性能和成本。灵巧手通过驱动装置提供动力和扭矩，经过传动装置控制手指运动位置，传感装置感知并反馈内外部信息，三者协作实现抓取功能。


    ### ①从场景出发的结构选型

    灵巧手的极致性能和成本不可兼得。要实现精确控制和高抓取能力，需要选用高性能的驱动、传动和传感方案。例如，Agility 灵巧手专注于工厂装卸货等简单任务，其灵巧手仅为简单的夹具，而下半身需要跨越障碍，因此设计重点在下半身。Shadow
    灵巧手主要用于航空航天、核能工业、生物医药等领域，其驱动端采用微型直流电机和气动柔性驱动（PMA），传动端通过两组腱和一个 PMA 控制每一个自由度。多项数据显示，Shadow
    灵巧手使用六轴陀螺仪、加速度计、角度传感器、力矩传感器、触觉传感器、电流传感器和温度传感器等共计 129 个传感器，因此成本最高达 80.1 万元人民币。


    ### ②人形机器人灵巧手的实用性需求

    设计需模仿人手的尺寸和形状，受限于空间和质量。过重的灵巧手会影响其操控性，过大的尺寸不利于与人交互。例如，达闼人形机器人 Ginger 广泛用于接待等场景，其
    7 自由度灵巧手能够完成握手、抓取、操作工具等精细动作，且尺寸与人手类似，亲人性强；而 Shadow 灵巧手宽 13.5cm，高 44.8cm，重 4.3kg，尺寸约为人手的两倍，亲人性较差，因此主要应用于科研等特种场景。


    ## （4）市场现状


    ### 1）国产灵巧手有较大的价格优势


    #### ①国外灵巧手的价格及应用领域

    由于灵巧手技术壁垒较高，国外一些灵巧手技术先进，但设计难度大，零部件多，因此价格昂贵，通常用于科研领域。例如，Shadow 灵巧手的报价约为 220 万元/只。用于假肢领域的仿生灵巧手虽然灵活程度稍差，但价格也相对较低，如德国的
    Bebionic 仿生灵巧手价格至少为 32 万元/只。


    #### ②国内灵巧手的价格优势

    国内灵巧手生产商包括因时机器人、浙江强脑科技、思灵机器人、蓝胖子机器智能等。其中，浙江强脑科技的 BrainRobotics 仿生灵巧手主要应用于假肢行业，标准版价格为
    10.8 万元/只。因时机器人是国内商业级五指灵巧手的龙头企业，其灵巧手与特斯拉灵巧手具有类似的关节数和相同的电机数目，目前价格为 5 万元/只。未来，国内灵巧手生产商有望凭借成本价格优势进入特斯拉等人形机器人本体生产商的供应链。国内外灵巧手对比见表
