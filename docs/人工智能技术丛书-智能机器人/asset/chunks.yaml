    ## 6.2.2 四足机器人运动学模型


    多体动力学是机器人研发中不可或缺的基础力学理论。机器人的动力学分析是实现机器人各个关节之间协同控制的关键。尽管使用运动学方法可以实现所需的功能，但相对于动力学控制而言，它通常会浪费更多的能量，并且响应速度较慢。在需要高动态响应的应用场合，通常需要采用动力学分析来实现更为高效的控制。


    机器人的仿真和建模需要动力学模型，只有通过这些模型，才能更真实地模拟机器人的工作情况，确定机器人各个关节在动态过程中的输出情况，从而确定每个关节所需的电动机和驱动器性能。机器人运动学和动力学基础知识建议参考《ROBOTIS
    OP仿人机器人权威指南》一书。


    运动学是描述物体位置随时间变化规律的力学分支，它主要从几何的角度研究物体的运动，而不考虑物体的物理性质和作用在物体上的力。运动学的研究基于对质点和刚体这两种简化模型的运动进行分析，并可以扩展到研究变形体（如弹性体、流体等）的运动。在研究变形体的运动时，需要将变形体微团的刚性位移和应变分开进行分析。点的运动学研究物体的运动方程、轨迹、位移、速度、加速度等运动特性，这些特性会根据所选择的参考系而有所不同。刚体的运动学研究刚体本身的旋转过程、角速度、角加速度等更为复杂的运动特性。


    运动学与物体的质量和受力状态无关，它主要研究物体的运动特性，包括速度、加速度、位移、位置、角速度等参数。运动学的研究通常以质点为基本模型，而在研究质点的运动时，物体的质量通常不是一个重要的考虑因素，因为质点的质量代表了其惯性和受到的力的影响程度，而力通常是两个物体之间的相互作用。


    运动学研究的问题分为两个部分，即运动学正解和运动学逆解。这两种解算方式，在不同的场景中有不同的应用途径。


    1）正问题：已知作用在机器人机构上的力和力矩，需要求解机器人机构各关节的位移、速度和加速度。这种情况可以表达为`F = m a`，其中`F`代表力，`m`代表质量，`a`代表加速度。这种解法通常用于确定机器人在受到一定力和力矩的情况下，如何移动和响应。

    2）逆问题：已知机器人机构各关节的位移、速度和加速度，需要求解作用在各关节上的驱动力或驱动力矩。这可以表示为`a = F / m`，其中`a`代表加速度，`F`代表力，`m`代表质量。这种解法通常用于确定机器人的关节需要受到多大的驱动力，以实现特定的运动或动作。


    以上描述的运动学正逆解问题，有助于理解机器人的运动过程。将四足机器人的结构看作一个树状图，其中每条腿有三个连杆，四条腿连接在一个躯干上。通过坐标系之间的转换关系，可以确定躯干、躯胯关节和足端之间的位置关系。通过树遍历算法，可以建立四足机器人的运动学模型。使用运动学逆解，当给定躯干质心位置和足端位置时，可以求解出每个关节的角度。使用运动学正解，当给定躯干质心的位置和关节角度时，可以求解出足端的位置。这些运动学问题的解决方法帮助机器人控制其关节以实现特定的运动或动作。


    ## 6.2.3 运动学正逆解问题


    为了更清晰的理解运动学正逆解的定义，给出如下问题的例子，方便读者进行思考，如图6-20所示。


    ![](EPUB/images/image_451.jpg)


    图6-20 运动学正逆解


    运动学正解：这个问题可以理解为从机器人的各个关节参数和连接方式出发，计算出机器人末端的位置和姿态。在四足机器人中，这意味着根据关节的长度、角度和连接方式，确定机器人足端所在的位置。运动学正解的结果对于步态规划等任务非常重要，因为它告诉机器人在给定关节角度下，它的末端应该在哪里。


    运动学逆解：这个问题正好相反，它从末端的目标位置和姿态出发，求解机器人各关节的角度。在机器人学中，逆运动学是一项非常关键的任务，因为它允许机器人实现特定的末端运动。


    一般机器人运动学逆解算法可分为以下几种：解析法（又称反变换法）、几何法和数值解法。解析法通常较为直观，但有时可能会涉及复杂的数学运算。几何法使用几何关系来求解逆运动学问题，而数值法通常涉及迭代过程，可以用于解决更复杂的问题。由PAUL等提出的反变换法求解过程直观，因而被广泛采纳，但其求解过程中需多次进行齐次变换矩阵的逆运算和4×4矩阵的乘积运算，导致求解过程复杂耗时。图6-21所示为运动学逆解示意图。


    ![](EPUB/images/image_452.jpg)


    图6-21 运动学逆解示意图


    下面基于D-H（Denavit-Hartenberg）法，建立四足机器人单腿运动数学模型。


    （1）D-H法原理 不区分支撑相和飞行相，采用足端位置跟踪的方法，先根据摆线曲线，使用正余弦或者多项式拟合的方式进行足端轨迹曲线规划，再根据D-H方法逆解出每个关节跟踪足端轨迹的对应角度，应用到的是正逆运动学进行数值解。


    （2）D-H法实现过程

    1）首先基于标准D-H法为腿部各个连杆建立坐标系，之后获得各个连杆之间的变换矩阵，最后将变换矩阵依次相乘得到单腿的正运动学方程。

    2）通过正运动学方程一系列的数学变换推导出逆运动学建模。

    3）通过正运动学方程求偏导推导出雅可比矩阵。


    （3）评价 这种方法采用位置控制而不是加速度控制（力控），运动精度比较高，但是柔顺性和抗干扰能力较差，更适合机械臂的工业环境。其次，该方法本质是轨迹的跟踪，没有自适应，只能根据规划的足端轨迹运动，适宜在平地运动，而在复杂环境中没有判断能力。


