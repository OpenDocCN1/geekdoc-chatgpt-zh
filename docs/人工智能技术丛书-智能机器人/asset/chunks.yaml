    （1）旋转 如图5-33所示，坐标轴`Oxyz`绕`z`轴旋转`θ`角后得到坐标轴`Ox′y′z′`，假设点`P`在`Oxyz`下的坐标为`P`（`x`，`y`，`z`），在`Ox′y′z′`下的坐标为`P`（`x′`，`y′`，`z′`），则两者之间满足以下关系


