    ## 2.5 ROS 前沿：ROS2


    本节主要包括 ROS1 的天然缺陷、ROS2 相较于 ROS1 的提升和改进、ROS2 中的 DDS 中间层、ROS2 中的 QoS 策略以及 ROS1 与
    ROS2 的应用这五方面的内容。


    ### 2.5.1 ROS1 的天然缺陷


    ROS1 项目最初的目标是为 Willow Garage 公司的科研机器人 PR2 提供开发环境和工具，然后通过为更多机器人提供通用消息接口和应用层抽象，使
    ROS 在机器人社区中得到广泛应用，并成为目前最受欢迎的机器人软件生态系统之一。然而，ROS1 研发的初衷就注定了该架构存在以下缺陷。


    1）无实时性：ROS1 没有设计为实时操作系统，因此不适用于对实时性要求严格的应用，如自动驾驶等。


    2）嵌入式设备不友好：ROS1 在嵌入式设备上的支持相对有限，因此不太适用于资源受限的嵌入式系统。


    3）对于网络通信的重依赖（需要大带宽且稳定的网络连接）：ROS1 对网络通信的需求较高，需要大带宽和稳定的网络连接，这可能在某些情况下成为限制因素。


    4）多用于学术应用：ROS1 最初更多地用于学术研究和实验室环境，因此在某些工业应用中可能不够成熟。


    5）超高的灵活性带来的不规范的编程模式：ROS1 的高度模块化和灵活性使得开发者可以采用多种编程模式，但这也可能导致代码不规范和难以维护。


    6）原生的 ROS 仅支持单机器人：ROS1 最初设计用于单机器人系统，因此在多机器人协作和分布式系统方面存在一些挑战。


    如今 ROS 已在大量工业领域应用，包括科研机器人、工业机器人、轮式机器人、自动驾驶汽车乃至航天等领域。随着技术的发展，ROS 对于某些性能（如实时性、安全性和嵌入式移植性等）需求更高的应用，可能需要进一步改进和扩展。


    ### 2.5.2 ROS2 相较于 ROS1 的提升和改进


    与 ROS1 相比，ROS2 在设计上考虑了在产品环境中面临的一些挑战，并采用了一系列策略以提升其适用性。具体来说，ROS2 采用（或计划采用）以下改进措施。


    1）支持多机器人：ROS2 专注于支持多机器人系统，允许多个机器人之间协同工作和通信，这对于工业和军事应用等领域非常关键。


    2）对小型嵌入式设备和微控制器的支持：ROS2 致力于提供更好的支持。


    3）嵌入式设备支持：使其能够在资源受限的小型设备和微控制器上运行。


    4）实时系统：支持实时控制，包括进程间和机器间通信的实时性。ROS2 引入了实时性支持，包括实时控制和通信，以满足对实时性要求严格的应用，如自动驾驶和机器人控制系统。


    5）支持非理想网络环境：ROS2 致力于在网络质量不佳、高延迟等不理想的网络环境下继续正常工作，提高了其稳定性和可靠性。


    6）对产品环境支持的能力：ROS2 的设计考虑了更广泛的产品环境需求，以满足更多工业和商业应用的需求。


    7）规范的编程模型以支持基于 ROS 大规模的目的构建、开发和部署：ROS2 采用了更规范的编程模型，以支持更大规模的目的构建、开发和部署，提高了代码的规范性和可维护性。


    这些改进使 ROS2 更适合在更广泛的应用领域中使用，尤其是在面向产品的机器人应用和工业自动化等领域。ROS2 旨在解决 ROS1 的一些限制，提供更多功能和性能，并为机器人技术的发展创造更多机会。


    ### 2.5.3 ROS2 中的 DDS 中间层


    ROS1 的核心是一个基于`Master`中心节点的匿名发布-订阅式通信中间层。相比之下，ROS2 采用基于实时发布订阅（Real-Time Publish-Subscribe，RTPS）协议的
    DDS 作为中间层。数据分发服务（Data-Distribution Service，DDS）是一种用于实时和嵌入式系统发布-订阅式通信的工业标准，这种点到点的通信模式类似于
    ROS1 的中间层，但是 DDS 不需要像 ROS1 那样借由`Master`节点来完成两个节点间通信，这使得系统更加容错和灵活。DDS 广泛应用于多个关键系统，如战舰、大型基础设施（如水电站）、金融系统、空间系统、航空系统等领域，证明了其可靠性和性能。


    多个厂商提供不同的 DDS 实现，通常基于`UDP`协议或共享内存机制，有些厂商还提供基于`TCP`的 DDS 实现。ROS2 支持多种 DDS 实现，允许用户根据其实际需求选择合适的
    DDS 中间层。目前，ROS2Foxy 版本完全支持以下 DDS 中间层：


    ①eProsima 的`Fast RTPS`（当前 ROS2 版本默认的 DDS 实现）。


    ②RTI 的`Connext DDS`。


    ③Eclipse `Cyclone DDS`。


    经实验验证，ROS2 中 DDS 策略的收益大于使用 DDS 的开销。如图 2-23 所示，相比 ROS1，ROS2 的吞吐量和线程数等均有提升。


    ![](img/image_140.jpg)


    图 2-23 ROS2 与其他版本的对比


    ### 2.5.4 ROS2 中的 QoS 策略


    ROS2 中引入了服务质量（Quality of Service，QoS）的策略用于配置节点间通信，从而增强 ROS2 在不同应用场景下的灵活性。与 ROS1
    仅支持基于`TCP`的通信不同，ROS2 通过 QoS 配置可以实现类似`TCP`的可靠性，也可以实现类似`UDP`的高实时性。用户可以通过选择不同的 QoS
    配置文件来实现不同的通信性能，这些配置文件包括以下内容。


    1）发布-阅机制的 QoS 设定：用于配置发布者和订阅者之间的通信，以满足不同应用场景的需求。


    2）服务（Service）的 QoS 设定：用于配置服务通信，支持请求-响应模型，使服务可以满足实时性、可靠性等要求。


    3）传感器数据的 QoS 设定：用于配置传感器数据的通信，适用于需要高实时性和低延迟的应用，如自动驾驶中的传感器数据传输。


    4）参数的 QoS 设定：用于配置参数的通信，以支持参数的可靠传输和同步更新。


    5）DDS 中间层默认的 QoS 设定：DDS 中间层提供了一组默认的 QoS 配置，可以满足大多数通信需求，用户可以根据自己的需求进行进一步调整。


    这些 QoS 策略的引入使 ROS2 更加适应不同的应用场景，用户可以根据其具体需求对通信性能进行灵活配置，从而提高了 ROS2 的通信效率和适应性。这种灵活性是
    ROS2 相对于 ROS1 的一项重要改进。


    ### 2.5.5 ROS1 与 ROS2 的应用


    ROS1 与 ROS2 已经被广泛应用于机器人领域，产生了大量前沿科技成果。例如图 2-24 所示的 Cocktail Bot 4.0，它是一个五款机器人组成的柔性生产线，可以为客户提供定制化的饮料服务。


    ![](img/image_141.jpg)


    图 2-24 为客人提供定制化饮料服务的机器人柔性生产线 Cocktail Bot 4.0


    TurtleBot 系列机器人是知名的开源入门级机器人，主要用于基础的移动机器人知识普及以及 ROS 的学习使用，如图 2-25 所示。TurtleBot
    系列是一个用于教育和研究的下一代开源机器人平台，已广泛应用于 SLAM 和视觉探测等领域。


    ![](img/image_142.jpg)


