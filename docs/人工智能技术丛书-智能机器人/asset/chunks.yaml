- raw: '四足机器人整体硬件结构如图6-15所示。这一结构包括主处理器、电控系统和关节驱动器，它们协同工作以实现机器人的运动和控制。这个硬件结构是四足机器人的核心，关系到机器人的性能和功能。


    ![](EPUB/images/image_446.jpg)


    图6-15 四足机器人整体硬件结构


    **3.四足机器人的关节**


    在很多自制的四足机器人中，常见舵机关节的应用。舵机实际上是低端的伺服电动机系统，也是最常见的伺服电动机系统之一。舵机通过将脉冲宽度调制（PWM）信号与可变电阻器的电压进行比较，从而实现固定控制增益的位置控制。这意味着舵机系统包括电动机、传感器和控制器，形成了一个完整的伺服电动机系统。虽然舵机价格便宜、结构紧凑，但其精度相对较低、位置稳定性也较差，通常适用于许多低端应用领域。相比之下，工业或商业机器人通常使用配备性能更强大的减速装置的同步电动机或伺服控制系统。下面简要介绍通用的舵机系统和高精度减速部件。


    **（1）电动机与舵机**


    1）电动机：通常用作动力源，带动工作机械完成各种任务。


    2）舵机：通常用于帮助工作设备改变行进方向。舵机的主要构成部分包括外壳、电路板、驱动电机、减速器以及位置检测元件。


    **（2）常见电动机**


    1）步进电动机：这种电动机将电脉冲信号转换为角度或线性位移，是一种开环控制元件，通常通过电脉冲信号来控制角度和旋转圈数。由于缺乏传感器反馈，因此其停止时的位置可能存在一些误差，通常适用于低速应用。


    2）伺服电动机：伺服电动机通过伺服控制电路和传感器的闭环反馈来控制电动机的转速和位置，因此它在位置控制方面非常精确，同时具有可变的转速特性。伺服电动机通常用于高速应用。


    3）舵机：舵机通常是一种低端的伺服电动机系统，包括伺服电动机控制电路和减速齿轮组。有些舵机还配备了电位器来确定舵臂的转向角度。舵机的信号控制采用PWM信号，它可以轻松由微控制器生成。


    **（3）常见舵机类型**


    1）模拟舵机：这类舵机通常不带微控制单元（MCU）。


    2）数字舵机：数字舵机配备了MCU，具有更快的响应速度，较小的无反应区间，高精度的定位以及强大的抗干扰能力。


    3）总线伺服舵机：这类舵机实际上是数字舵机的一种进化版本，通常被称为串行总线智能舵机。它们拥有更美观的布线结构，较少的端口占用，更精准的控制，以及能够反馈位置、温度、负载、速度和电压等数据的能力。


    四足机器人关节中最关键的部件是精密减速器，如图6-16所示。这是一种精密的动力传动机构，它使用齿轮的速度转换器，将电动机的回转速度降低到所需的速度，并获得更大的转矩。这种装置有助于减小速度、增加转矩，对于四足机器人的运动非常关键。


    ![](EPUB/images/image_447.jpg)


    图6-16 精密减速器


    目前，全球提供规模化且性能可靠的精密减速器生产企业相对较少，绝大多数市场份额都被日本企业所占领。特别在工业用机器人的关节上，日本企业Nabtesco（纳博特斯克）产品的全球市场占有率达60%，在中/重负荷机器人上，其RV减速器市场占有率高达90%。Harmonica（哈默纳科）的谐波减速器在该市场约占15%的份额。


    与传统的轮式或履带式机器人不同，四足机器人需要关节输出转矩以维持持续的站立、行走或平衡。这一过程需要运动控制来计算各个关节所需的不同力矩，并最终由各个关节的转矩模块来实施，四足机器人高转矩关节如图6-17所示。


    ![](EPUB/images/image_448.jpg)


    图6-17 四足机器人高转矩关节


    高转矩永磁同步电动机，配合高效精密减速机构、高精度绝对式编码器和轻量化机壳的一体化设计，使得关节驱动模块具有极高的转矩密度、响应带宽和反向传动效率，适用于各类型高性能机器人的关节驱动和力控算法实现。


    Nabtesco是2003年9月成立的，实际上它是由帝人精机（Teijin Seiki，1944年成立）和纳博克（Nabco，1956年生产了日本第一个自动门）这两家日本公司强强合并组成。作为运动控制系统和零部件的生产商，这两家公司都在其特定的业务领域，掌握了高端核心技术，控制了很高的市场份额，所以Nabtesco一成立，就在同行业位居日本乃至全世界的首位，世界上大多数机器人制造商均从Nabtesco的专利RV减速器获益。


    作为世界上最大的精密摆线针轮减速器制造商，Nabtesco生产高性能减速器、中空轴减速器，以及单轴伺服执行器和控制器。其生产的精密设备具有高转矩、高刚性和高耐过载冲击荷载能力的同时，兼有高精密和非常低的回程间隙，被广泛应用于卫星、雷达天线、工业机器人、半导体和焊接技术等工业自动化领域，如图6-18所示。


    ![](EPUB/images/image_449.jpg)


    图6-1 8 RV减速机


    精密减速器是一个十分复杂，制造难度高，精度要求高的设备，本书不做过多讨论，仅作简要介绍。


    精密减速器的设计使得线路可以方便地穿过减速器的空心部分，如图6-19所示。这种设计具有多重优势，包括更大的转矩、更高的压缩比、接近零侧隙，以及更大的动力输出。此外，还允许加载一组提供更大动量的部件，无须在设备内额外安装支撑轴来提供外部支撑。这些设计特点进一步降低了成本，并简化了最终用户的设计工作。


    ![](EPUB/images/image_450.jpg)


    图6-19 精密减速器


    我国对工业机器人用精密减速器的研究相比国外较晚，技术不成熟，与国外先进技术存在较大差距，形成了精密减速器不能自给自足的局面，严重依赖进口。这严重制约了我国工业机器人的发展，特别是在我国工业机器人逐渐产业化时期，工业机器人精密减速器的关键技术突破显得更加迫切。国务院印发的《中国制造2025》提出“突破机器人本体、减速器、伺服电动机、控制器、传感器与驱动器等关键零部件及系统集成设计制造等技术瓶颈”。


    **6.2.2**


    **四足机器人运动学模型**


    多体动力学是机器人研发中不可或缺的基础力学理论。机器人的动力学分析是实现机器人各个关节之间协同控制的关键。尽管使用运动学方法可以实现所需的功能，但相对于动力学控制而言，它通常会浪费更多的能量，并且响应速度较慢。在需要高动态响应的应用场合，通常需要采用动力学分析来实现更为高效的控制。


    机器人的仿真和建模需要动力学模型，只有通过这些模型，才能更真实地模拟机器人的工作情况，确定机器人各个关节在动态过程中的输出情况，从而确定每个关节所需的电动机和驱动器性能。机器人运动学和动力学基础知识建议参考《ROBOTIS
    OP仿人机器人权威指南》一书。


    运动学是描述物体位置随时间变化规律的力学分支，它主要从几何的角度研究物体的运动，而不考虑物体的物理性质和作用在物体上的力。运动学的研究基于对质点和刚体这两种简化模型的运动进行分析，并可以扩展到研究变形体（如弹性体、流体等）的运动。在研究变形体的运动时，需要将变形体微团的刚性位移和应变分开进行分析。点的运动学研究物体的运动方程、轨迹、位移、速度、加速度等运动特性，这些特性会根据所选择的参考系而有所不同。刚体的运动学研究刚体本身的旋转过程、角速度、角加速度等更为复杂的运动特性。


    运动学与物体的质量和受力状态无关，它主要研究物体的运动特性，包括速度、加速度、位移、位置、角速度等参数。运动学的研究通常以质点为基本模型，而在研究质点的运动时，物体的质量通常不是一个重要的考虑因素，因为质点的质量代表了其惯性和受到的力的影响程度，而力通常是两个物体之间的相互作用。


    运动学研究的问题分为两个部分，即运动学正解和运动学逆解。这两种解算方式，在不同的场景中有不同的应用途径。


    1）正问题：已知作用在机器人机构上的力和力矩，需要求解机器人机构各关节的位移、速度和加速度。这种情况可以表达为*F*\=*ma*，其中*F*代表力，*m*代表质量，*a*代表加速度。这种解法通常用于确定机器人在受到一定力和力矩的情况下，如何移动和响应。


    2）逆问题：已知机器人机构各关节的位移、速度和加速度，需要求解作用在各关节上的驱动力或驱动力矩。这可以表示为*a*\=*F*/*m*，其中*a*代表加速度，*F*代表力，*m*代表质量。这种解法通常用于确定机器人的关节需要受到多大的驱动力，以实现特定的运动或动作。


    以上描述的运动学正逆解问题，有助于理解机器人的运动过程。将四足机器人的结构看作一个树状图，其中每条腿有三个连杆，四条腿连接在一个躯干上。通过坐标系之间的转换关系，可以确定躯干、躯胯关节和足端之间的位置关系。通过树遍历算法，可以建立四足机器人的运动学模型。使用运动学逆解，当给定躯干质心位置和足端位置时，可以求解出每个关节的角度。使用运动学正解，当给定躯干质心的位置和关节角度时，可以求解出足端的位置。这些运动学问题的解决方法帮助机器人控制其关节以实现特定的运动或动作。


    **6.2.3**


    **运动学正逆解问题**


    为了更清晰的理解运动学正逆解的定义，给出如下问题的例子，方便读者进行思考，如图6-20所示。


    ![](EPUB/images/image_451.jpg)


    图6-20 运动学正逆解


    运动学正解：这个问题可以理解为从机器人的各个关节参数和连接方式出发，计算出机器人末端的位置和姿态。在四足机器人中，这意味着根据关节的长度、角度和连接方式，确定机器人足端所在的位置。运动学正解的结果对于步态规划等任务非常重要，因为它告诉机器人在给定关节角度下，它的末端应该在哪里。


    运动学逆解：这个问题正好相反，它从末端的目标位置和姿态出发，求解机器人各关节的角度。在机器人学中，逆运动学是一项非常关键的任务，因为它允许机器人实现特定的末端运动。


    一般机器人运动学逆解算法可分为以下几种：解析法（又称反变换法）、几何法和数值解法。解析法通常较为直观，但有时可能会涉及复杂的数学运算。几何法使用几何关系来求解逆运动学问题，而数值法通常涉及迭代过程，可以用于解决更复杂的问题。由PAUL等提出的反变换法求解过程直观，因而被广泛采纳，但其求解过程中需多次进行齐次变换矩阵的逆运算和4×4矩阵的乘积运算，导致求解过程复杂耗时。图6-21所示为运动学逆解示意图。


    ![](EPUB/images/image_452.jpg)


    图6-21 运动学逆解示意图


    下面基于D-H（Denavit-Hartenberg）法，建立四足机器人单腿运动数学模型。


    （1）D-H法原理 不区分支撑相和飞行相，采用足端位置跟踪的方法，先根据摆线曲线，使用正余弦或者多项式拟合的方式进行足端轨迹曲线规划，再根据D-H方法逆解出每个关节跟踪足端轨迹的对应角度，应用到的是正逆运动学进行数值解。


    （2）D-H法实现过程


    1）首先基于标准D-H法为腿部各个连杆建立坐标系，之后获得各个连杆之间的变换矩阵，最后将变换矩阵依次相乘得到单腿的正运动学方程。


    2）通过正运动学方程一系列的数学变换推导出逆运动学建模。


    3）通过正运动学方程求偏导推导出雅可比矩阵。


    （3）评价 这种方法采用位置控制而不是加速度控制（力控），运动精度比较高，但是柔顺性和抗干扰能力较差，更适合机械臂的工业环境。其次，该方法本质是轨迹的跟踪，没有自适应，只能根据规划的足端轨迹运动，适宜在平地运动，而在复杂环境中没有判断能力。


