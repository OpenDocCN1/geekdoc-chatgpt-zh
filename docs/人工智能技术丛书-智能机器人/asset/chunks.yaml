    2024 年 3 月，英伟达展示了多模态人形机器人通用基础模型 GROOT，可作为机器人的大脑。GROOT 驱动的机器人能够理解自然语言，通过观察人类行为来快速学习，显示了人形机器人在认知智能方面的巨大潜力。


    人形机器人发展浪潮迅猛，机器人正从简单的自动化任务执行者转变为能够进行复杂决策和交互的智能系统。大模型和深度学习技术的整合是推动这一进步的核心，这些技术使机器人能够更好地理解和适应复杂的环境，执行更为复杂的任务。人形机器人的发展正向着更高自主性、更强交互能力和更广泛的应用场景迈进。在全球范围内，美国和中国在人形机器人的研发和应用方面居于领先地位，主要发展面向工业和服务行业的机器人，展示了其实用性和多功能性。同时，欧洲和日本也在此领域显示了强烈的创新意识，尤其是在提高机器人自主性和安全性方面进行了许多突破性的研究。


    ## 7.2.2 国家政策和战略


    各国政府在推动人形机器人技术的发展方面采取了不同的政策和战略，这些政策不仅影响了技术的进步速度，还塑造了机器人技术的应用领域和市场趋势。


    ### (1) 美国

    美国在人形机器人的研发和应用方面采取了多层次的策略，这些策略涵盖了从联邦政府到私营部门的广泛支持和资助，旨在保持其在全球人形机器人技术领域的领先地位。美国政府通过多个机构，如国防高级研究计划局（DARPA）和国家科学基金会（NSF）提供资金支持，推动人形机器人技术的基础研究和开发。美国政府积极推动与私营企业和学术界的合作，通过公私合作伙伴关系（PPP）模式，促进人形机器人技术的创新和商业化。美国通过各种机制促进大学和研究机构的创新成果向企业转移。联邦技术转移计划（Federal
    Technology Transfer Program）和小型企业创新研究计划（SBIR）支持小企业与国家实验室和大学合作，开发和商业化新技术。美国强调高等教育体系在人形机器人技术领域的重要作用，多所领先的大学，如麻省理工学院（MIT）、斯坦福大学和加州大学伯克利分校等都设有先进的机器人研究项目，培养未来的机器人技术专家。美国积极参与国际机器人技术的标准制定和政策对话，以确保其技术和产品能够在全球市场中保持竞争力。通过国际标准组织和多边论坛，美国推动了关于人形机器人安全、伦理和互操作性的国际标准制定。


    ### (2) 中国

    我国对人形机器人技术的发展给予高度重视，并制定了一系列国家策略来推动此领域的科技创新和产业成长。这些策略包括政策支持、资金投入、产学研合作等多个方面，目标是在全球范围内建立技术和市场的竞争优势。


    2023 年 10 月，工业和信息化部印发的《人形机器人创新发展指导意见》指出，以大模型等人工智能技术突破为引领，在机器人已有成熟技术基础上，重点在人形机器人“大脑”和“小脑”、“肢体”关键技术、技术创新体系等领域取得突破。突破关键技术包括：


    - **打造人形机器人“大脑”和“小脑”。**开发基于人工智能大模型的人形机器人“大脑”，增强环境感知、行为控制、人机交互能力，推动云端和边缘端智能协同部署。建设大模型训练数据库，创新数据自动化标注、清洗、使用等方法，扩充高质量的多模态数据。科学布局人形机器人算力，加速大模型训练迭代和产品应用。开发控制人形机器人运动的“小脑”，搭建运动控制算法库，建立网络控制系统架构。面向特定应用场景，构建仿真系统和训练环境，加快技术迭代速度，降低创新成本。


    - **突破“肢体”关键技术。**用好现有机器人技术基础，系统部署“机器肢”关键技术群，创新人体运动力学基础理论，打造仿人机械臂、灵巧手和腿足，突破轻量化与刚柔耦合设计、全身协调运动控制、手臂动态抓取灵巧作业等技术。攻关“机器体”关键技术群，突破轻量化骨骼、高强度本体结构、高精度传感等技术，研发高集成、长续航的人形机器人动力单元与能源管理技术。


    我国强调构建完整的人形机器人产业链，从基础材料、核心组件到高端制造设备。政府支持行业内的技术创新，包括新材料的开发、高精度传感器、智能控制系统等。同时，通过建立产业园区和创新中心，促进产学研用紧密结合，加速技术成果的产业化。


    ### (3) 加拿大

    加拿大已经认识到人形机器人技术在未来经济和社会发展中的重要性，并采取了一系列策略来推动该领域的增长。加拿大的策略不仅着重于技术创新，还包括培养相关技术人才、支持创新生态系统的发展，以及鼓励公私合作。加拿大鼓励建立技术创新生态系统，支持各种科技创业孵化器和加速器项目，如马赛克制造创新中心（MaRS
    Dis covery District），这些机构提供资源、指导和资金，帮助初创企业和研究团队将人形机器人技术转化为实际产品。


    ### (4) 瑞士

    瑞士在人形机器人技术发展方面采取的策略突出了其在精密工程、自动化技术以及创新驱动的教育系统的长期投资。瑞士在制造、医疗和服务行业拥有强大的工业基础，政府鼓励这些行业与机器人技术领域的协同发展。瑞士积极参与国际机器人技术和人工智能的研究项目和合作。瑞士政府通过提供资金、税收优惠和创业支持服务来促进创新和技术商业化。


    ### (5) 日本

    长期以来，日本在人形机器人技术上一直处于领先地位，重点发展用于服务业和娱乐业的人形机器人，如 Honda 的 Asimo 和 SoftBank 的 Pepper。日本政府支持通过政府资助的研发计划和与学术机构的合作来推动技术创新。


    ### (6) 欧洲

    欧盟在推动人形机器人技术的发展方面采取了一系列综合性策略，旨在通过促进技术创新、国际合作和规范立法等多个维度，加速人形机器人技术的研发和市场应用。重点在于提升机器人的自主性、安全性和伦理性，强调人机协作和机器人技术的可持续发展。


    ## 7.3 人形机器人肢体


    人形机器人的肢体包括躯干和四肢，它们不仅是结构的核心，也是整合高级功能的关键部分。这些组件的设计兼顾了机械强度、灵活性和功能性，确保机器人能够在各种环境下稳定运行，并支持复杂的人类动作模仿。本节将介绍人形机器人躯干和四肢设计的相关内容，关注其肢体设计、关节和运动机构、躯干和四肢结构、材料选择与制造技术。


    ### 7.3.1 人形机器人肢体设计


    人形机器人的肢体设计主要包括人形机器人躯干设计和四肢设计。


    #### 1. 躯干设计

    躯干是人形机器人的主要支撑结构，承载着关键的机械和电子系统，包括动力源、传感器和控制模块。有效的躯干设计应考虑以下关键方面：


    (1) 模块化

    设计应允许快速更换或升级关键组件，如电池、驱动模块或传感器。这种模块化不仅提高了维护和升级的效率，也增强了机器人的适应性，使其能根据不同的任务需求灵活调整。


    (2) 紧凑性

    通过减少机器人体积和质量来提高能效和灵活性。紧凑的设计使机器人能在狭小或复杂的环境中更灵活地操作，同时减少能量消耗，延长工作时间。


    (3) 稳定性

    在设计时确保机器人在执行各种活动，特别是在不平坦的地面上或执行复杂动作时，能够保持平衡。这通常需要通过精确的重心位置设计、姿态控制技术和动态平衡算法来实现，以保证机器人在各种操作中的安全性和可靠性。


    #### 2. 四肢设计

    四肢设计关键在于实现与人类相似的灵活性和力量，同时保证足够的机械强度和精确控制。四肢通常包括多个关节和伺服电动机，使机器人能够进行精细的动作控制，如走路、抓取或搬运物品。有效的四肢设计应考虑以下关键方面：


    (1) 关节灵活性

    关节设计必须能够模仿人类关节的运动范围，同时保持足够的力量和速度，以执行各种复杂任务。


    (2) 力量与精度的平衡

    四肢的电动机和传动系统需精心设计，以便在保证足够力量的同时，也能进行精细的速度和位置控制。


    (3) 感应与反馈

    在四肢的关节中集成高级传感器，如扭矩传感器和位置传感器，可以实时监测和调整机器人的动作，确保动作的准确性和对环境变化的适应性。


    ### 7.3.2 关节和运动机构


    关节和运动机构的设计在人形机器人的开发中扮演着核心角色，因为它们不仅需要模仿人类关节的运动范围和精度，还必须保证机器人在执行任务时的力量和稳定性。


    #### 1. 伺服电动机

    伺服电动机是人形机器人关节中最常用的驱动元件，它提供精确的角度控制和强大的扭矩，使机器人能够进行精细的动作调整。这种电机具有高度的可控性，能够快速响应指令变化，非常适合需要高精度和高可靠性的应用场景。伺服电动机的选择和配置对实现机器人的流畅和自然运动至关重要。


    #### 2. 电力系统

    电力系统为人形机器人的关节和运动机构提供必需的能量。为了保证足够的功率和持续的操作能力，电力系统通常包括高效能的电池或超级电容，这些电源解决方案必须优化以适应机器人的能耗需求和质量分布。此外，电力系统也需要智能设计，以优化能量使用效率和保证机器人在执行长时间任务时的能量稳定性。


    #### 3. 传感反馈系统

    为了增强人形机器人的交互能力和动作精确性，关节中通常集成了多种传感器来提供实时的力量和位置反馈。


    1) 头部视觉传感器，用于捕捉环境图像和进行深度感知，帮助机器人更好地理解周围环境。

    2) 手部力/扭矩传感器，使机器人能够感知抓握和操作时的力度，避免对物体造成损害。

    3) 足部力/扭矩传感器，用于监测行走或站立时的压力分布，帮助机器人保持平衡。


    #### 4. 核心零部件丝杠

    丝杠是一种将旋转运动转换为直线运动（或反之）的高精度机械零件，通过旋转丝杠，螺母沿着丝杠的轴向移动，如图 7-20 所示。丝杠在机器人领域尤其重要，常用于关节和运动机构的传动，以实现精确的运动控制，丝杠主要有三种类型：梯形丝杠、滚珠丝杠和行星滚柱丝杠。


    ![](img/image_566.jpg)


    图 7-20 丝杠示意图


    1) 梯形丝杠。这种丝杠利用梯形螺纹进行运动转换。当丝杠旋转时，螺母会沿着丝杠的方向前进或后退，从而实现机械传动。这种类型的丝杠结构简单，但精度相对较低。梯形丝杠如图
    7-21 所示。


    ![](img/image_567.jpg)


    ▲图 7-21 梯形丝杠


    2) 滚珠丝杠。这种丝杠相对螺母旋转时，其旋转面通过滚珠的循环滚动推动螺母轴向移动，化旋转运动为直线运动，丝杠和螺母之间的滑动摩擦转变为滚珠与丝杠、螺母之间的滚动摩擦，传动效率高、精度较高。滚珠丝杠如图
    7-22 所示。


    ![](img/image_568.jpg)


    图 7-22 滚珠丝杠


    3) 行星滚柱丝杠是一种高精度的传动机构，它利用丝杠的旋转作为驱动力。当丝杠旋转时，滚柱围绕丝杠进行行星式运动，并通过螺旋传动原理，将丝杠的旋转运动转化为螺母的直线往复运动。这种设计特点使行星滚柱丝杠具备高承载能力、小体积和高精度等优势。行星滚柱丝杠如图
    7-23 所示。


    ![](img/image_569.jpg)


    图 7-23 行星滚柱丝杠


    #### 5. 先进的关节和关节设计

    为了提高机器人的灵活性和适应性，关节设计必须模仿人体的结构，同时也要考虑到机械的耐用性和维护的便捷性。


    1) 旋转关节，允许机器人的手臂和腿部进行旋转运动，模拟人类的自然运动。旋转关节如图 7-24 所示。


    ![](img/image_570.jpg)


    图 7-24 旋转关节


    2) 直线关节，在某些特定应用中使用，如在机器人脊柱部分，提供直线移动以支持机器人身体的弯曲和伸展。直线关节如图 7-25 所示。


    ![](img/image_571.jpg)


    图 7-25 直线关节


    3) 空心杯关节，这种特殊设计的关节可以在不增加额外质量的情况下提供更大的运动自由度。空心杯关节如图 7-26 所示。


    ![](img/image_572.jpg)


    图 7-26 空心杯关节


    #### 6. 灵巧手

    人形机器人的灵巧手旨在模仿人类手部的功能，实现精细的抓取和操作任务，其复杂的设计和高精度的控制系统使得它能够执行与人手相似的多样化功能。人形机器人灵巧手如图
    7-27 所示。


    ![](img/image_573.jpg)


    图 7-27 人形机器人灵巧手


    灵巧手作为机器人新型末端执行器，是机器人研究的重要课题。自 20 世纪 70 年代起，国内外对灵巧手进行了大量研究，从三指到五指，从工业到生活，从简单的抓取到复杂操作，相关市场主体不断推动灵巧手的研究成果，以解决日益复杂的实际作业问题。近年来，国际上代表性的灵巧手厂商有
    SCHUNK、Shadow Robot、qb Robotics、Clone Robotics 等；国内代表性的灵巧手厂商或实验室则有蓝胖子机器智能（Dorabot）、因时机器人、腾讯
    Robotics X 实验室等。随着人形机器人产业化的加速，国内外对灵巧手领域的研究也呈现加速趋势。典型的灵巧手系统在集成度和机电一体化程度上有了显著提高，能够更准确地完成一些人类手的基本功能。


    (1) 灵巧手在运动控制和交互中起关键作用


    1) 灵巧手的重要性：灵巧手在机器人运动控制和环境交互中具有至关重要的作用。通常，机器人与环境的交互包括移动行走、视觉信息获取和决策执行输出。末端执行器是机器人执行任务的部件，通常安装于机器人腕部末端，直接执行任务。末端执行器在提升机器人柔性和易用性方面极为重要，其性能在很大程度上决定了机器人的整体工作性能。


    2) 灵巧手的结构与功能：灵巧手模仿人手的结构和功能，在机器人与环境的交互中起关键作用。“灵巧”指的是手的姿势可变性，这种可变性越高，手就越灵巧。


    3) 两指夹持器：两指夹持器模仿手指的夹持运动，能够在执行某些动作的同时夹住和松开目标物体。应用于机器人末端的夹持器通常采用电机或气缸作为驱动，机构原理以多连杆机构和气缸为主。例如，德国
    SCHUNK 公司的气动平行爪夹持器、FESTO 公司的气动夹持器、亚德客的手指气缸等。


    4) 多指抓持手：多指抓持手通常为三指或四指，主要包括联动型抓持手、多关节手指抓持手和软体多指抓持手等。其基本原理与两指夹持器相同，由多连杆或气缸驱动实现多指同步运动。例如，Righthand
    Robotics 公司的 ReFlex TakkTile 三指手、苏州钧舵机器人有限公司的均巧三指手、德国 SCHUNK 公司的 SDH 三指手等。


    5) 多指灵巧手：多指灵巧手具有多指多关节结构，手指数目通常为 3～5 个，每个手指具有 3 个关节，关节运动采用转动副。其主要驱动方式包括液压驱动、电机驱动、气压驱动和形状记忆合金驱动。例如，日本“电子技术实验室”的
    Okada 灵巧手、美国斯坦福大学的 Stanford/JPL 灵巧手、美国麻省理工学院和犹他大学联合研制的 Utah/MIT 灵巧手等。


    6) 传动方式：灵巧手常见的传动方式有腱绳传动、连杆传动、齿轮传动和带传动，其中腱绳传动应用最为广泛。腱绳传动模拟人手的肌腱结构，使得大型驱动器远离执行机构，减轻了末端负载和惯量，提升了抓取速度和灵活性。尽管腱绳传动具有高效、灵活的优势，但也面临负载能力较弱、预紧力变化大、负载越大效率越低等挑战。


    (2) 机器人灵巧手深度仿生

    多指灵巧手最初在结构上模仿人手的设计，随着复杂应用需求的增加，研究逐渐深入人手的内在结构、驱动和传动原理等方面的仿生设计，并扩展到复合材料和智能材料的开发。智能材料的研究反过来也影响了多指灵巧手的仿生设计。此外，对人手操作过程的研究在很大程度上决定了多指灵巧手的仿生程度，并成为评估其仿生性能的重要指标。


    1) 柔性感知技术：由于人手结构复杂、功能多样且感觉丰富，实现仿生的机器人灵巧手需要具备类似于人类皮肤的柔性感知技术和传感器。这些触觉传感器用于实时传输与物体接触的信息，但目前仍面临诸多挑战。


    2) 理解高级语义信息：机器人需要从低级感官数据中提取出任务需求和人类偏好等高级语义信息，首先要识别被操作的对象并确定所需的操作类型，即任务要求。


    3) 跨模态算法：人类通过整合多种感官信息（如触觉、视觉、声音等）来理解物体。视觉数据提供几何属性，触觉数据提供物理属性（如质量或硬度），两者互补共存。整合多种感知模式的传感器能够解决单一传感器的局限性，获得更丰富的环境信息，但需要进一步探索如何建立不同模态信息的统一特征表示和关联关系。


    4) 探索中的安全性问题：在机器人手与物体的物理交互和触觉探索过程中，需要保证机器人手及其周围环境的安全。一方面，要及时采集触觉信号并传递给控制器，并具备避免不必要伤害的能力。另一方面，由于对象模型未知，机器人可能会违反一些关键约束。具有一定自愈能力和拉伸能力的系统，可以在勘探过程中发生意外损伤时保持安全性。


    5) 提升触觉传感器的灵活性：由于机器人手的表面通常是不规则的，柔性传感器比刚性传感器更容易与手的表面集成。柔性传感器可以覆盖整个手掌表面，而不仅限于指尖，从而提供更丰富的接触信息。触觉传感器的其他性能也需要进一步提高，如自愈能力和自供电能力。具有自修复能力的触觉传感器可以提高其对非结构环境的适应能力。


    6) 新材料的应用：许多灵巧手的研究通过骨架结构和橡胶等软体材料模拟人手的外形，虽然可以有效完成抓、握、捏、拧等日常手部动作，但在实际应用中仍存在包络性、灵活性和稳定性差等问题。为了保持灵巧性和抓取的稳定性，需要根据仿生学模拟生物体的环境适应性、高效能和合理的身体结构，开发新型材料并用于灵巧手的研发，以最大化利用生物优势。目前，国内外专家通过还原肌肉纤维和结构组织的研发，在拾取装置中已经取得了良好效果，多层次的人手和机器人手结构对比如图
    7-28 所示。


    ![](img/image_574.jpg)


    图 7-28 多层次的人手和机器人手结构对比


    (3) 灵巧手的核心矛盾


