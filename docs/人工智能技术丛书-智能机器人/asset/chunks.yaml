    **机械臂的运动学模型**


    机械臂的运动学模型主要包括关节运动模型的机械臂正、逆运动学模型的相关内容。


    机械臂的运动主要依靠关节驱动完成，因此在介绍机械臂运动学模型前，先简单介绍关节运动模型。图5-11所示为一个简单的机械臂关节-连杆模型，包括3个关节和2个连杆。每个关节*i*都有一个坐标系，关节*i*为旋转关节时，坐标轴*z*轴根据右手定则确定，绕*z*轴的旋转角度为关节变量；关节*i*为滑动关节时，*z*轴指向滑动方向，滑动关节连杆长度*d*是关节变量。关节*i*的*x*轴垂直于关节*i*\-1的*z*轴，方向由*i*\-1指向*i*。*z*轴和*x*轴确定后，*y*轴的方向为垂直*xz*平面的方向。


