    测量方法：在指定距离拍摄平面深度图。绝对精度：指定FOV/ROI区域距离平均值与真值之差。相对精度：指定FOV/ROI区域，深度转点云，点云拟合平面，计算所有点到平面距离的标准差。帧间跳动/时间精度：同一平面连续采集*N*帧图像，得到深度图序列，指定FOV/ROI区域，在区域内逐点计算其深度值序列的标准差，计算区域内所有点标准差的均值。


