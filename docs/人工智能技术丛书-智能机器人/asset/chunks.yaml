    ### 1.2.2 我国机器人发展计划


    《中国制造2025》站在历史的新高度，从战略全局出发，明确提出了我国实施制造强国战略的第一个十年的行动计划，将“高档数控机床和机器人”作为大力推动的重点领域之一，提出机器人产业的发展要“围绕汽车、机械、电子、危险品制造、国防军工、化工、轻工等工业机器人、特种机器人，以及医疗健康、家庭服务、教育娱乐等服务机器人应用需求，积极研发新产品，促进机器人标准化、模块化发展，扩大市场应用。突破机器人本体，减速器、伺服电动机、控制器、传感器与驱动器等关键零部件及系统集成设计制造技术等技术瓶颈”，并在重点领域技术创新路线图中明确了我国未来十年机器人产业的发展重点主要为两个方向：一是开发工业机器人本体和关键零部件系列化产品，推动工业机器人产业化及应用，满足我国制造业转型升级迫切需求；二是突破智能机器人关键技术，开发一批智能机器人，积极应对新一轮科技革命和产业变革的挑战，具体要点有：


    1）以需求为导向，增强创新能力，扩大市场应用。


    2）突破技术瓶颈，提升产业化能力。


    3）加快下一代机器人研发生产，抢占机器人技术及产业发展的下一个制高点。


    未来，随着医疗、养老、教育等行业智能化需求的持续释放，服务机器人、特种机器人蕴藏巨大的发展潜力。近年来，我国机器人产业在前沿技术上也取得了进步，一些以前只能在科幻电影中出现的场景，已经走进了现实生活。


    我国机器人制造企业日益壮大，具备了自主研发和生产的能力。以国内著名机器人企业如新松机器人、云从科技、大族激光、四川长虹为代表，中国机器人企业在工业机器人、服务机器人等领域取得了长足的发展。在高端应用方面，工业机器人已经成功应用于航空、航天、造船、汽车、发动机等多个高端制造行业。服务机器人、特种机器人在医疗手术、教育服务、安防巡检、灾后救援等高附加值服务场景实现了突破应用。此外，机器人不仅应用于高科技行业，也在逐渐向家具、食品、冶金、建筑、纺织、铸造、锻造、卫浴等传统行业延伸，有效解决了劳动密集型企业用工难的问题，以及恶劣环境高风险作业等行业的痛点问题。


    值得注意，中国机器人产业总体尚处于发展的初期阶段，很多关键核心技术仍然有待进一步突破，行业应用水平有待进一步提高。我们需要把握机器人技术的发展趋势，共同突破机器人的共性关键技术，研发高性能电机、仿生感知与认知、情感交互等前沿技术，推进5G、大数据、云计算、大模型等新一代信息技术的融合应用，提高机器人智能化和实用性水平。


    在政策层面，2023年工业和信息化部等17部门印发《“机器人+”应用行动实施方案》，以加快推进机器人应用拓展。其中提出，到2025年，制造业机器人密度较2020年实现翻番，聚焦10大应用重点领域，突破100种以上机器人创新应用技术及解决方案，推广200个以上具有较高技术水平、创新应用模式和显著应用成效的机器人典型应用场景，打造一批“机器人+”应用标杆企业，建设一批应用体验中心和试验验证中心。推动各行业、各地方结合行业发展阶段和区域发展特色，开展“机器人+”应用创新实践。搭建国际国内交流平台，形成全面推进机器人应用的浓厚氛围。


    ### 1.2.3 全球机器人发展浪潮


    为进一步抢占国际市场，提升制造业在全球的竞争性地位，各经济强国跃跃欲试，纷纷制定发展规划，以图抢占先进机器人技术的发展先机。


    2016年，美国白宫发布了《美国国家人工智能研究和发展战略计划》。这一战略旨在促进人工智能的研究和应用，包括机器人技术在内。“美国机器人发展路线图”提出围绕制造业攻克机器人的强适应性和可重构的装配、仿人灵巧操作、基于模型的集成和供应链的设计、自主导航、非结构化环境的感知、教育训练、机器人与人共事的本质安全性等关键技术。在国防领域，2019年，美国国防部发布了《机器人自动化战略》。该战略旨在推动军事领域机器人技术的发展和应用，以增强国家的防御能力。美国军方曾制订“未来战斗系统”（Future
    Combat Systems）计划，成果转至旅级战斗队现代化计划，加强无人系统和自主机器人的研发，用于如侦察、救援和排除爆炸物任务。美国国家航空航天局（NASA）发展了多个太空机器人项目，如“Curiosity”和“Perseverance”，研究机器人在太空探索中的应用，包括月球和火星任务，Curiosity探测器如图1-37a，Perseverance探测器如图1-37b。在医疗保健领域，美国医疗机构和科技公司开发外科机器人和远程医疗机器人，如达·芬奇外科手术系统，以提供更好的医疗服务，如图1-37c所示。


    ![](EPUB/images/image_046.jpg)


    图1-37 美国太空机器人和医疗机器人


    2015年年初，日本政府公布了《机器人新战略》，明确提出要“研究开发下一代机器人中要实现的数据终端化、网络化、云计算等技术”。日本政府鼓励机器人技术的研发，以解决人口老龄化和劳动力短缺问题。2018年，日本政府发布了第五次机器人基本计划，推进机器人技术的研究和应用，促进机器人在工业、医疗、服务、农业等领域的广泛应用。2021年，日本科学技术振兴机构发布了机器人基础计划2021。该计划旨在通过推动机器人基础研究的进展，实现创新突破和核心技术的提升。该计划提出了加强基础研究、培育机器人技术的社会共识、促进产业化等一系列措施。


    韩国政府近年来陆续发布多项政策，旨在扶植第三代智能机器人的研发与应用，2012年韩国公布的《机器人未来战略2022》，其政策焦点为支持韩国企业进军国际市场，抢占智能机器人产业化的先机；2018年发布了《第四次智能机器人技术发展战略》，旨在培养100家智能机器人企业，推进人工智能与机器人技术的研发与应用。


    欧盟于2020年发布了《欧盟智能机器人战略规划》，旨在建立一个欧洲智能机器人创新生态系统，加强人工智能、机器人技术的研发、投资和应用。英国计划开展医疗机器人项目，如Versius手术机器人，改善外科手术的精度和效率。德国政府推行“工业4.0”战略，构建“智能工厂”，打造“智能生产”，其重点课题之一是人与机器、机器与机器之间的交互合作。法国提出了“未来工厂”计划，旨在促进智能制造和自动化机器人技术在法国制造业中的应用。


    ## 如何防止机器人伤害人类？——人类对机器人可能存在的安全隐患的思考


    ### “机器人三大定律”——源自阿西莫夫的科幻小说


    ![](EPUB/images/image_047.jpg)


    艾萨克·阿西莫夫（Isaac Asimov，1920-1992），俄罗斯犹太裔美国科幻小说作家、科普作家、文学评论家，美国科幻小说黄金时代的代表人物之一。


    阿西莫夫一生著述近500本，题材涉及自然科学、社会科学和文学艺术等许多领域，与罗伯特·海因莱因、亚瑟·克拉克并列为科幻小说的三巨头。其作品中以《基地》系列、《银河帝国三部曲》和《机器人》系列为代表，曾获代表科幻界最高荣誉的雨果奖、轨迹奖和星云终身成就大师奖等。他在1950年出版的短篇小说集《我，机器人》（I，Robot）中提出了“机器人三大定律”。


    ◆【第一定律】不可伤害人类，也不可因不作为而让人类受到伤害。在科幻小说中，这一定律常常成为机器人的核心准则，它强调了机器人的首要责任是保护人类的安全。当然这也引发了一系列道德和伦理困境，例如，当机器人必须在不同人类之间做出选择时，或者在不同的生存危险情境下，如何平衡这一定律是科幻小说的一大看点。


    ◆【第二定律】必须服从人类的命令，除非这些命令与第一定律相冲突。第二定律强调了机器人对人类的服从性，但也引入了潜在的矛盾和冲突。在故事中，机器人必须解释和权衡各种命令，特别是当不同的命令之间发生冲突时。这种情况经常用来探讨机器人在道德抉择中的矛盾和难题，以及人类与机器人之间的复杂关系。


    ◆【第三定律】必须保护自身的安全，前提是这不与第一或第二定律相冲突。第三定律强调了机器人自身安全的重要性，但也明确指出了当机器人必须在自我保护与保护人类之间权衡时，必须遵循第一和第二定律。这引发了有关机器人自我保护欲望和对人类忠诚之间的冲突的情节，以及关于机器人如何解释和执行这些定律的复杂问题。

