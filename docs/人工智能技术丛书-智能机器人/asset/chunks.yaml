    ### 结构光深度相机深度值质量评估


    结构光系统的精度特性为精度随距离平方衰减（这点与双目深度相机相似），具体公式如下


    ![](img/image_195.jpg)![](img/image_196.jpg)


    图 3-33 散斑结构光系统简化的数学模型


    结构光的优点主要有：


    1）方案成熟，相机基线可以做的比较小，方便小型化。

    2）资源消耗较低，单帧 IR 图就可计算出深度图，功耗低。

    3）主动光源，夜晚也可使用。

    4）在一定范围内精度高，分辨率高，分辨率可达 1280×1024 像素，帧率可达 60fps。


    散斑结构光的缺点与结构光类似：


    1）容易受环境光干扰，室外体验差。

    2）随检测距离增加，精度会变差。


    由于结构光深度图在边缘会有一些空洞或者一些其他的杂点，通常评估精度的时候更多的关注中间区域，81%FOV 指的就是 0.9 倍的宽（Width）和 0.9
    倍的高（Height），如图 3-34 所示。


    兴趣区域（Region of Interest，ROI）指在图像或场景中选择的感兴趣的特定区域。由于边缘会存在畸变，通常也是选取中间的某些区域进行划分，如图
    3-35 所示。


    ![](img/image_197.jpg)


    ▲图 3-34 81%FOV


    ![](img/image_198.jpg)


    图 3-35 ROI


    测量方法：在指定距离拍摄平面深度图。绝对精度：指定 FOV/ROI 区域距离平均值与真值之差。相对精度：指定 FOV/ROI 区域，深度转点云，点云拟合平面，计算所有点到平面距离的标准差。帧间跳动/时间精度：同一平面连续采集`N`帧图像，得到深度图序列，指定
    FOV/ROI 区域，在区域内逐点计算其深度值序列的标准差，计算区域内所有点标准差的均值。


