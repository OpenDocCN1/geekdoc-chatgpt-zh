    图 1-7 蓝鳍金枪鱼-21 型自主式水下航行器

    2015 年：iRobot 的 PackBot 机器人被广泛用于爆炸物拆除和情报收集任务，如图 1-8 所示。

    2015 年：波士顿动力的 Spot 四足机器人是一种多功能机器人，应用于巡视、救援和建筑工地，如图 1-9 所示。

    2021 年：Robotic Research 公司的自动驾驶巴士（AutoDrive）在美国各地的城市开始进行公共交通试点项目。

    ![](img/image_017.jpg)

    ▲图 1-8 PackBot 机器人

    ![](img/image_018.jpg)

    图 1-9 波士顿动力的 Spot 四足机器人

    2023 年：特斯拉汽车，如 Model3 系列。最新版的 Autopilot 自动辅助驾驶系统主要包括主动巡航、控制辅助转向等功能，使车辆能够根据其他车辆和行人，在行驶车道内自动辅助实施转向、加速和制动。完全自动驾驶能力仍在
    Beta 测试阶段，某些情况下（如在狭窄道路上遇到对向来车、在施工区或通过复杂的交叉路口时）需要驾驶员干预控制车辆以保证安全驾驶。


    #### 2. 日本


    日本机器人的发展历程可大致归纳如图 1-10 所示。

    日本在 20 世纪 60 年代末正处于经济高速发展时期，年增长率达 11%。第二次世界大战后，日本劳动力紧张，而经济的高速发展进一步加剧了劳动力不足的窘境。为此，日本在
    1967 年由川崎重工业公司从美国 Unimation 公司引进机器人及其技术，建立起生产车间，并于 1968 年试制出第一台川崎的“尤尼曼特”机器人。

    劳动力的显著不足，让日本政府着重发展机器人行业。一方面，在经济上积极扶持，如低息资金支持的“机器人长期租赁”；另一方面，国家出资对小企业进行应用机器人的专门知识和技术指导等。这一系列扶持政策，使日本机器人产业迅速发展起来，到
    20 世纪 80 年代中期，日本一跃成为“机器人王国”，其机器人的产量和安装的台数在国际上跃居首位；在历史上，日本政府把 1980 年定为“产业机器人的普及元年”。

    日本在汽车、电子行业大量使用机器人，致使产量猛增，质量日益提高，而成本大为降低。日本的汽车以价廉质优的绝对优势进军美国市场，并向外出口实用型机器人和家用电器，在
    20 世纪八九十年代被称为世界工厂。日本因机器人行业增强了国力、带来了巨大的收益，迫使美、英、法等许多国家不得不采取措施，奋起直追。

    近些年，面对老龄化社会，日本的机器人技术不断向医疗保健和其他服务机器人发展，包括为工人提供额外支撑以提升人或重物的机器人外骨骼，以及适合老年人和年轻人的伴侣机器人等，如图
    1-11 所示的 Huis Ten Bosch 烹饪机器人。

    2000-2010 年：日本机器人产业的崛起。

    ![](img/image_019.jpg)

    ▲图 1-10 日本机器人的发展历程

    ![](img/image_020.jpg)

    图 1-11 Huis Ten Bosch 烹饪机器人

    2000 年：索尼发布了 AIBO，一款可爱的娱乐用狗形机器人，标志着家用机器人的发展，如图 1-12 所示。

    2007 年：Honda 发布了 ASIMO，一款双足行走机器人，用于研究人机互动和机器人移动性，如图 1-13 所示。经过多次迭代升级，目前 ASIMO
    具有较先进的运动控制能力和智能水平。

    ![](img/image_021.jpg)

    ▲图 1-12 AIBO

    ![](img/image_022.jpg)

    图 1-13 ASIMO

    2008 年：发那科（FANUC）研发出重型机器人 M-2000iA，其有效荷载约 1200kg，如图 1-14 所示。

    2009 年：Robot Taxi 公司成立，致力于自动驾驶出租车技术的开发，Robot Taxi 的自动驾驶出租车如图 1-15 所示。

    ![](img/image_023.jpg)

    ▲图 1-14 机器人 M-2000iA

    ![](img/image_024.jpg)

    图 1-15 Robot Taxi 自动驾驶出租车

    2010-2020 年：日本机器人在医疗和养老领域的应用。

    2011 年：机器人制造商 Cyberdyne 开发了 HAL（混合辅助肢体，Hybrid Assistive Limb），这是一种外骨骼装置，用于康复和支持行动障碍患者，如图
    1-16 所示。

    2014 年：日本成立了 Robot Revolution Initiative（RRI）计划，以促进机器人在医疗和养老领域的应用。

    2018 年：SoftBank Robotics 开发了 Pepper 这一款社交机器人，如图 1-17 所示。Pepper 社交机器人被广泛用于零售、酒店和医疗服务。

    ![](img/image_025.jpg)

    ▲图 1-16 Hybrid Assistive Limb

    ![](img/image_026.jpg)

    图 1-17 Pepper 机器人


    #### 3. 瑞典


    瑞典机器人的发展历程可大致归纳如图 1-18 所示。

    ![](img/image_027.jpg)

    图 1-18 瑞典机器人的发展历程

    瑞典的机器人行业发展较为自由，同时也受到了国家的大力扶植。二战后，瑞典经历了两次产业升级和结构调整，每次都抓住机遇，果断决定取舍，实现了最佳市场定位。20
    世纪 70 年代末期，瑞典经济发展速度明显放缓，它另辟蹊径，实施产业结构调整，通过大力发展信息通信、生物、医药、航天等现代高新技术制造业，实现了第二次产业升级，为经济的复苏和增长注入了活力，此时机器人的发展重点也在新工业领域。

    20 世纪 90 年代初，受世界性经济危机影响，瑞典经济出现衰退，它果断摒弃出现亏损的小轿车生产，只保留在国际市场占明显优势的卡车制造业，同时加大对电信、电子、环保、能源、生物、制药、化工、冶金、造纸和木材加工等领域的投入力度，使工业实力再上新台阶，并逐渐向福利性社会发展。可以看出，此时机器人的发展开始向机器人电子系统、服务业等发展。

    2000-2010 年：发展和应用期。

    2003 年，为了推动创新和产业发展，瑞典政府旗下的瑞典创新局（Vinnova）开始资助“机器人谷”项目的建设。如今，“机器人谷”已经成为新思想、新科技的“摇篮”，为世界源源不断地输出极具应用前景的机器人创新科技。

