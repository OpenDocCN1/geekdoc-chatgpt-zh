    ![](EPUB/images/image_399.jpg)


    图5-3 2图像坐标系*O*[1]和相机坐标系*O*[c]


    在图5-32中，*f*为焦距，*M*为相机空间中一点，*m*为*M*投影到图像上的点，根据三角形相似原理，有


    △*O*[c]*O*[1]*C*～△*O*[c]*AB*


    △*O*[c]*mC*～△*O*[c]*MB*


    因此，有


    ![](EPUB/images/image_400.jpg)


    用矩阵形式表示为


