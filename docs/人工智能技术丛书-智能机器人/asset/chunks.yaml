    第二个选项卡是Self-Collisions，它会搜索机器人上可以安全禁用碰撞检查的成对link，从而减少运动规划处理时间。当这些link对始终处于碰撞状态、从不处于碰撞状态、在机器人的默认位置处于碰撞状态或当link在运动链上彼此相邻时，这些link对将被禁用。


    如图5-18所示，采样密度（Sampling Density）表示的是要在机器人上随机选取多少位置来进行自碰撞检测。采样密度越大，计算时间越长，采样密度越低，禁用不应禁用的link对的可能性越高，其默认值为10000。为了减少处理时间，碰撞检查是并行进行的。单击“生成碰撞矩阵”（Generate Collision Matrix）按钮，会根据配置好的参数自动生成自碰撞矩阵。


    ![](EPUB/images/image_374.jpg)


    图5-18 Self-Collisions选项卡界面


    第三个选项卡是Virtual Joints，如图5-19所示，用来给机器人分配虚拟关节。虚拟关节用于连接世界环境和机械臂，它随着机器人位姿的变化而变化，但在机械臂底座不会移动的特定情况下，不需要虚拟关节。当机械臂不固定在某一个地方时，就需要虚拟关节。例如，用来示例的UR5机械臂是固定在桌面上的，因此不需要虚拟关节。


    ![](EPUB/images/image_375.jpg)


    图5-19 Virtual Joints选项卡界面


