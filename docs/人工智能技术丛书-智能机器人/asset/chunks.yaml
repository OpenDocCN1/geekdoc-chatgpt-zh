- raw: '在接下来的20年间，一些重要的理论研究都在NASA和美国陆军的资助下进行。波兰工程师M.G.Bekker在美国陆军坦克汽车（US Army Tank-Automotive）公司的研究尤其值得关注。这些研究工作为通用行走卡车（GE Walking Truck）的发展提供了关键推动力。通用行走卡车是一种庞大的机器人，全长达3m，总重达1400kg，由一个90马力（1马力=735W）的内燃机驱动。操作员坐在机器人上，需要同时控制众多手柄和踏板。尽管项目负责人声称只需接受20h的培训，人们就能熟练地驾驶这台机器人，但南加州大学的R.McGhee敏锐地认识到，这台机器人的操作过于复杂，因此需要一套自动化的循环操作系统来替代操作员。


    1966-1969年间，Bucyrus-Eire公司建造了史上最大的足式机器人——Big Muskie。这台机器人是专门为露天矿山作业而设计的，重达13500t，并且速度能够达到270m/h。Big Muskie的成功证明了Hutchinson的构想是可行的。令人惊讶的是，它一直工作到了1991年。


    1966年，McGhee和A.A.Frank合作制造了一台名为Phony Pony的中型四足机器人，如图6-3所示，这台机器人的每条腿都有两个自由度，并由电机驱动。机器人的脚采用了倒T形结构，控制系统是一个具有六种同步状态的状态机，能够控制机器人进行爬行或对角小跑。


    ![](EPUB/images/image_434.jpg)


    图6-3 Phony Pony机器人


    Phony Pony的研究激发了McGhee去创建一些在步行机器人历史上具有重要地位的机器，包括OSU六足机器人和自适应悬挂车辆（ASV），如图6-4所示。


    ![](EPUB/images/image_435.jpg)


    图6-4 OSU六足机器人和自适应悬挂车辆（ASV）


    OSU六足机器人建于1977年，是第一台由计算机控制的行走机器人。它的腿采用了昆虫腿的设计，由电机驱动三个旋转关节。该机器人成为大量步态生成、机器人控制、力分配算法的实验平台。1986年，McGhee与Waldron合作建造并测试了ASV六足步行机，可能是有史以来建造的最大和最特别的地形适应性行走机器人。


    1983年，Odetics发布了ODEX I。这个机器人并没有提供任何重要的科学贡献，但是作为第一台商业化的足式机器人，它也被列入了里程碑。该系列中的一个先进的版本被用于检查核电站。


    以上所有提到的机器人基本上都属于静态稳定的系统。第一台具备行走、奔跑且完全动态稳定的四足机器人是由麻省理工学院的M.Raibert（1986年）开发的。


    大多数研究人员最初关注静态稳定性，然后才涉足动态系统的研究。但M.Raibert的研究路径与常规相反。作为一位学院派的创业者，他获得了麻省理工学院的博士学位后，创立了卡内基梅隆大学的CMU腿部实验室，并担任副教授。1986年，M.Raibert返回麻省理工学院，继续从事机器人的研发和研究。他坚信，首先应该解决单腿机器人的动态稳定问题，然后再将这些原理应用到具有两条、四条或更多腿的机器人上。最终，他成功实现了这一目标，并创立了波士顿动力公司。在随后的30多年中，波士顿动力公司一直处于全球足式机器人领域的领先地位。


    **1.Big Dog：踹不倒的机器人**


    2005年，Big Dog的发布就已经让波士顿动力公司名震一方，如图6-5所示。


    Big Dog的身高约为1m，重约109kg，能够背负45kg的有效负载并自由行走或奔跑。其最高移动速度可达6.4km/h，最大爬坡角度可达35 °。此外，Big Dog还能够适应多种复杂路况，包括雪地和泥洼，即便受到侧向外力的干扰，也能够迅速调整四肢动作以保持稳定，避免摔倒。这些卓越的性能得益于其精密的设计结构和精心规划的计算系统。


    ![](EPUB/images/image_436.jpg)


    图6-5 Big Dog


    Big Dog的设计灵感来自四足哺乳动物的身体结构，其机械组件经过精心组装。四肢拥有关节型结构，能有效地吸收冲击力，提供减振效果。整体机器拥有16个自由度，允许在横向和纵向两个方向自由运动。此外，Big Dog由一台汽油发动机提供动力，发动机驱动液压系统，通过液压系统输出动力并控制每个肢体的运动，从而实现了身体的高度灵活性。


    Big Dog搭载的运动控制系统有效确保了机器人的自主运动，几乎不需要人工干预即可完成既定任务。这一运动控制系统使用传感器安装在关节和足底等位置，用于监测肢体状态信息。陀螺仪和惯性传感器有助于监测身体平衡稳定信息，使系统能够迅速响应任何平衡干扰，保持重心稳定，从而使机器人保持平衡并前进。


    同时，Big Dog还具备出色的导航智能性。它可以通过激光雷达和立体视觉传感器独立感知周围环境，构建虚拟地形模型，并使用搭载的计算机进行路径规划。它依赖运动控制系统沿着规划路径前进，直至达到目标点。


    尽管Big Dog拥有强大的功能，但由于其运行过程中噪声较大，最终没有被美国军方采用。


    **2.LS3：能担能抗的大力士**


    LS3又被称为“阿尔法狗”，其中LS是Legged Squad的缩写。LS3机器人是波士顿动力公司继Big Dog之后推出的一款四足机器人，于2012首次公开亮相。与Big Dog相比，LS3的体型更为庞大，负载能力更强，移动速度也更快，实用性能有了大幅提升，如图6-6所示。


    ![](EPUB/images/image_437.jpg)


    图6-6 LS3


    在波士顿动力公司发布的宣传视频中，LS3在携带重物的情况下，仍然可以迅速地爬上陡峭的山坡或通过崎岖不平的道路。


    LS3的高度约1.7m，重约509kg，可以背负181kg的有效负载进行自由行走和奔跑。实际测试表明，LS3在平坦地面上曾成功背负500kg的负载进行自由行走，其最高移动速度可达45km/h。在实际测试中，LS3在崎岖的山路上也能保持相对较快的前进速度。它具有12个自由度，由燃气发动机或柴油发动机提供动力，液压系统驱动机器人的肢体运动。在燃料充足的情况下，LS3可以连续运行24h，行驶的最大里程为32km。


    LS3继承了Big Dog的移动特性，利用地形感测、避障和GPS等技术确保了前进过程的安全性，使其能够顺利到达目标地点。此外，LS3采用了计算机视觉技术，可以实现自动跟踪，无须搭载专门的驾驶员程序即可跟随目标人员前进。


    尽管LS3参与了美国军方的作战训练任务，但由于其自身运行噪声问题未能得到有效解决，以及维修难度较大，最终被美国军方弃用。


    **3.Wild Cat：机器人领域的运动健将**


    Wild Cat，也被称为野猫机器人，是波士顿动力公司于2013年发布的一款四足机器人。它的前身是Cheetah，即猎豹机器人。Cheetah的机体上方连接着多根电缆，这注定了它只能作为一款实验室用的机器人，如图6-7所示。


    在波士顿动力公司发布的宣传视频中，Cheetah在跑步机上创下了48km/h的机器人奔跑速度记录。Cheetah采用了关节型的背部结构，使得其背部能够在奔跑中灵活运动，以更好地协调整体姿态，提高步幅和奔跑速度。


    在波士顿动力公司发布的宣传视频中，Wild Cat可以在户外敏捷地奔跑，并且可以轻松跳过障碍物甚至在奔跑过程中实现急停、掉头等操作，如图6-8所示。


    ![](EPUB/images/image_438.jpg)


    ▲图6-7 Cheetah


    ![](EPUB/images/image_439.jpg)


    图6-8 Wild Cat


    可以将Wild Cat看作是Cheerah的“无线版本”，它高度约为1.17m，重约为154kg，最快移动速度可达32km/h。


    Wild Cat具有卓越的适应性，能够在各种地形上行进，即使在复杂的路况下，也能以约16km/h的速度前进。此外，Wild Cat还能够执行快速跳跃和转身等动作，灵活性大幅提高，相较于Big Dog和LS3而言，性能有了显著提升。


    该机器人拥有14个自由度，由一台甲醇发动机提供动力，通过液压系统控制每段肢体的动作，实现躯体的灵活运动。Wild Cat还使用激光测距仪来准确测量机器人与地面的高度以及自身姿态等信息，并利用动态控制算法计算出四肢所需的动作，从而实现稳定的运动。


    尽管Wild Cat采用了甲醇发动机，运行时噪声较大，但未来有望采用电池能源，以实现低噪声奔跑，提高其隐蔽性，在军事和其他领域发挥更出色的作用。


    **4.Spot：小巧灵活的机灵鬼**


    波士顿动力公司先后研发了Big Dog、Cheetah和LS3三款四足机器人，尽管这些机器人在性能方面都有着卓越的表现，但由于噪声问题较为突出，最终都没有得到广泛使用。在充分总结了过去的经验和教训的基础上，波士顿动力公司又打造了一款名为Spot的新型四足机器人，如图6-9所示。


    ![](EPUB/images/image_440.jpg)


    图6-9 Spot


    Spot是波士顿动力公司在2015年推出的一款四足机器人，其高度约为0.94m，重约为75kg，可背负45kg的有效负载进行自由行动或奔跑。从波士顿动力公司官方发布的视频来看，Spot机器人实现了低噪声运行，可以借助两条肢体在原地跳跃而不摔倒，可以灵活上下楼梯，并且其爬坡速度较Big Dog更快，步伐更灵敏。


    Spot具有12个自由度，采用电池能源提供动力，通过液压系统实现躯体的灵活运动。采用电池能源可以有效降低机器人的运行噪声，但同时也会影响其运行时间。在充电状态下，Spot可以连续运行约45min，而LS3则可连续运行最长达24h。


    Spot采用了激光雷达和立体视觉传感器，这些传感器用于感知周边路面信息，帮助机器人有效避开路面障碍，合理协调四肢动作。然而，Spot的移动并不完全依赖于这一传感系统，有时它也会凭借自身的“感觉”。


    在波士顿动力公司发布的官方视频中，有一幕展示了Spot攀爬台阶的情节。尽管每一节台阶都相对较低且宽，但Spot仍保持着相对高的步高和较短的步幅，导致在攀爬过程中出现了一次失误。这种情况表明，Spot未能根据台阶的高度和宽度自动调整其步高和步幅。如果每一节台阶的高度和宽度都不同，Spot的失误可能会更为显著。


    这一失误的原因在于，Spot在攀爬台阶时，激光雷达和立体视觉传感器未能完全捕捉到路面的详细信息。因此，Spot需要根据有限的路面信息来估算其四肢的动作。尽管这一次失误对于Spot的整体通行能力来说影响较小，但它为波士顿动力公司提供了改进机器人行为能力的重要经验教训。


    **5.Spot Mini：执着的“独臂勇士”**


    2017年11月，波士顿动力公司对外展示了其研发的最新一款四足机器人Spot Mini。与Spot相比，Spot Mini的外形更加小巧，并且在头部增设了一副机械臂，机械臂的顶端是一个夹手，可以灵活操控物体，如图6-10所示。


    ![](EPUB/images/image_441.jpg)


    图6-10 Spot Mini


    在波士顿动力公司发布的宣传视频中，Spot Mini在人类阻拦的条件下展示了其强大的能力。即使有人试图阻止，Spot Mini仍然能够利用搭载的机械臂成功打开关闭的铁门。


    Spot Mini的高度约为0.84m，重约为30kg，可以携带14kg的有效负载，实现自由行动或奔跑。与Spot相同，Spot Mini也采用电池能源来提供动力，通过驱动液压系统，以液压系统作为动力输出，从而控制每个肢体的动作，实现躯体的灵活运动。相比Spot，Spot Mini的单次运行时间有了显著提升，在充电状态下可以连续运行约90min。


    Spot Mini继承了Spot的所有移动特性，具有17个自由度，其中5个自由度位于其顶部的机械臂上，其余12个自由度均分布在四肢上。机械臂不仅可以用于操纵物体，还可在Spot Mini摔倒时提供辅助，协助它重新站立。


    Spot Mini的机械臂上配备了摄像头，这有助于机械手准确地找到目标物体。此外，Spot Mini的正前方还装备了一套3D立体摄像头，可帮助它更好地观察前方障碍物的情况。举例来说，当遇到桌子等障碍物时，Spot Mini可以降低姿态，从障碍物下方轻松通过。因此，有理由相信，在进行像攀爬台阶等活动时，Spot Mini可能会表现得比Spot更出色。


    波士顿动力公司曾向特斯拉公司的首席执行官埃隆·马斯克（Elon Musk）赠送了一台Spot机器人。当埃隆·马斯克在户外操作这台机器人时，旁边有一只小狗一直对Spot疯狂吠叫，这一有趣的细节引发了对机器人外观设计的关注。由于Spot与Spot Mini的外观相似，可以合理猜测，宠物们对Spot Mini的态度可能也会不太友好。因此，如何设计机器人的外观以更好地被动物接受，成为机器人设计工作的重要考虑因素之一。


    **6.1.2**


    **四足机器人发展现状**


    总体来说，四足机器人的发展趋势在不同技术层面和不同地区呈现不同的侧重方向。


    从地区分布来看，国外对四足机器人的研究起步较早，拥有深厚的基础和高水平的技术。他们已经进行了各种技术探索和科学实验，涉及四足机器人的驱动方式、运动形式、稳定性评估等各个方面，多传感器融合技术也已初步验证。特别值得一提的是，由于美国军方的介入，他们的最新一代四足机器人样机已经接近实用化，因此在全球处于领先地位。相比之下，国内对四足机器人的研究起步较晚，基础相对薄弱，技术水平较低，存在较大的差距，特别在系统理念、关键器件、基础技术等方面。在四足机器人的行进速度、负载能力等硬性指标以及适应不同地形和扰动的自适应控制技术等方面与国外研究水平相比仍有很大差距。因此，国内需要加快迎头赶上，缩小这一差距。


    从技术角度来看，四足机器人已经经历了从最初的完全人工操作到现在具有一定智能化程度的演进。相关技术领域，如计算机视觉、自动控制、人工智能、步态规划和能源供应等都取得了显著的进展。此外，四足机器人的行走模式也经历了长时间的发展，从最初的静态稳定步行到特定环境下的动态稳定步行，再到在非结构化环境中的较为实用的动态定步行。四足机器人在步行适应性方面已经取得了长足的进步。随着微处理器性能的不断提升，越来越先进的理论和算法被应用到四足机器人的步态控制中。通过控制系统、机械系统和环境之间的相互耦合关系，使四足机器人具有出色的稳定性和适应性。这一发展趋势为四足机器人的广泛应用和不断提升性能创造了有利条件。


    目前国内外对四足机器人的研究都有所进展，国外性能最佳的四足机器人当属波士顿动力公司的四足机器人Spot（图6-9），从运动控制到机械结构都是行业顶尖水平。同时苏黎世联邦理工的ANYmal机器狗也是一种性能极佳的四足机器人，它是一种三关节机器狗，有别于大部分双关节机器狗，如图6-11所示。


    ![](EPUB/images/image_442.jpg)


    图6-11 苏黎世联邦理工ANYmal机器狗


    国内领先的四足机器人厂家主要有宇树科技Unitree和云深处科技两家公司。近来，小米公司推出了自主研发的四足机器人CyberDog，蔚蓝科技推出了四足机器人AlphaDog，如图6-12所示。其中，宇树科技的四足机器人曾在2021年牛年春晚上演福牛表演。


    ![](EPUB/images/image_443.jpg)


    图6-12 国内典型的四足机器人


