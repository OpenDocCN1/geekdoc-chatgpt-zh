    ## （5）有代表性的先进灵巧手的实现方案


    ### 1）智元灵巧手实现方案

    融合连杆与齿轮结合的方案。智元机器人的单个灵巧手指可实现摆动和弯曲的动作设计且融合连杆及齿轮传动方案。


    #### 手指左右摆动

    通过连杆系统实现。驱动组件位于掌心部位，连接多个传动连杆，这些连杆的另一端连接到每根手指的根部。手指根部通过基座结构与手掌主体相连。当驱动组件产生顺时针的驱动力时，传动连杆带动右侧手指逆时针摆动，左侧手指顺时针摆动，实现手指的“并拢”动作。该设计通过一个驱动组件控制多根手指的摆动，节约了空间，提高了结构紧凑性。可选方案中，连杆传动可以替换为腱-轮传动，输出轴通过传动带带动指根连接的转动件转动，实现指关节左右摆动。智元灵巧手手指左右摆动示意图如图
    7-31 所示。


    ![](img/image_578.jpg)


    图 7-31 智元灵巧手手指左右摆动示意图


    #### 手指弯曲

    由齿轮和轴承部件传动完成。专利设计了两节指关节弯曲方案（对应 2 个主动自由度）。近指根关节转动和指中关节弯曲的实现步骤如下。


    步骤①驱动模组安装：在手掌内埋设驱动模组，驱动模组末端连接齿轮机构。


    步骤②齿轮结构：采用“L”型排布的两个齿轮。第一齿轮直接与驱动模组连接，第二齿轮与第一齿轮啮合并内嵌驱动轴，通过齿面啮合改变输出力矩方向。


    步骤③驱动轴：第二齿轮中心镂空，嵌入一根驱动轴，带动驱动件和主体结构的转动连接点，实现指根关节和指中关节的弯曲。


    步骤④指关节转动：指关节根部结构中带有镂空结构，供驱动件嵌入，伴随驱动件转动带动指根关节和指中关节的弯曲。


    #### 传感和控制

    传动轴部位安装有电位计，用于检测驱动轴的转动角度，并将其转化为电信号反馈给驱动模组，从而控制手指的弯曲角度。指中关节的上端与指尖关节相连，但为非同轴设置，当指中关节受指根带动转动时也会带动指尖关节转动。


    #### 高级抓取功能

    一侧指中关节配置了驱动电机，能够带动一侧指中关节进一步转动，实现指尖关节的二次弯曲，以便于抓取物品。指中关节的电机同样配备电位计，能够检测驱动电机的输出轴角度和指尖关节的转动角度。同时，指尖关节上还设置了触觉传感器，提供更精确的操作反馈和控制。智元灵巧手手指间关节细节如图
    7-32 所示。


    ![](img/image_579.jpg)


    图 7-32 智元灵巧手手指间关节细节


    ### 2）特斯拉灵巧手技术路线


    #### 电机驱动

    特斯拉灵巧手采用电机驱动。根据驱动方式的不同，灵巧手可以分为电机驱动式和气动驱动式。电机驱动是目前多指灵巧手的主流驱动方式，特斯拉灵巧手采用空心杯电机。驱动源（如电机）为灵巧手的活动提供动力，是影响灵巧手体积和质量的重要因素。为了减小电机尺寸，特斯拉
    Optimus 和优必选 Walker 的灵巧手都采用了空心杯电机。特斯拉 Optimus 灵巧手空心杯关节位置如图 7-33 所示。


    ![](img/image_580.jpg)


    图 7-33 特斯拉 Optimus 灵巧手空心杯关节位置


    #### 内置式设计

    灵巧手结构可分为外置式和内置式。外置式灵巧手的电机放置在手掌外，而内置式灵巧手的电机则安装在手掌内。随着电机尺寸的减小，灵巧手逐渐从外置式发展为内置式。特斯拉
    Optimus 的灵巧手为内置式，控制电机和传感器信号接收器均位于手掌内部。我国优必选 Walker 机器人的灵巧手也是内置式，实现了模块化设计，显著增强了灵巧手的互换性和可维护性，降低了人形机器人的维护成本。然而，内置式设计对电机尺寸要求更高，空心杯电机因此成为首选。


    #### 腱绳传动

    灵巧手按传动机构可分为腱绳传动、齿轮传动和连杆传动。特斯拉灵巧手采用腱绳传动，模仿人手肌腱的工作方式。腱绳传动灵巧手具有控制灵活、结构简单、柔性高等优点。特斯拉灵巧手通过配备蜗轮蜗杆的空心杯电机拉动金属腱绳，带动手指关节运动。特斯拉灵巧手金属腱绳如图
    7-34 所示。


    ![](img/image_581.jpg)


    图 7-34 特斯拉灵巧手金属腱绳


    #### 欠驱动

    尽管全驱动灵巧手能够更好地模仿人手运动，但因为每个手指关节都能主动控制，但目前大多数灵巧手采用的是欠驱动设计。特斯拉灵巧手也是欠驱动，通过 6 个电机实现
    11 个自由度。欠驱动灵巧手是电机数量少于自由度数目，一个电机控制多个关节；全驱动灵巧手则是电机数量与自由度数目相等，每个电机控制一个关节。


    # 7.3.3 躯干和四肢结构

    在人形机器人的设计中，躯干和四肢的结构设计是确保其能够支持所有预期活动的关键，同时必须保持足够的机械强度和灵活性。这不仅要求机器人的动作模拟人类的自然运动，还必须确保在各种操作环境下的稳定性和耐久性。


    ### 1）生物力学模仿

    人形机器人的躯干和四肢设计深受人体生物力学的启发。通过研究人类的运动机制，设计师能够将这些生物力学原理应用于机器人的结构设计中，使机器人的动作更加符合自然规律。这种模仿不仅提高了机器人动作的自然度，还增强了执行复杂任务时的效率和流畅性。例如，通过模拟人类关节的结构和功能，可以设计出能够灵活移动且具有高度自适应性的机械关节，从而使机器人能够执行更为复杂的手臂和腿部运动。特斯拉
    Optimus 系列人形机器人的演变如图 7-35 所示。


    ![](img/image_582.jpg)


    图 7-35 特斯拉 Optimus 系列人形机器人的演变


    ### 2）结构优化

    为了确保人形机器人的躯干和四肢在日常使用中能够承受负载和冲击，达到高强度和耐用性的要求，运用计算机辅助设计（CAD）和有限元分析（FEA）技术进行结构优化是至关重要的。CAD
    提供了精确的三维建模环境，使设计师能够细致地构建机器人各个部件，并进行详细的修改和调整以达到预期的设计标准。FEA 用于模拟结构在各种负载条件下的响应，包括静态负载、动态负载和疲劳分析等。通过
    FEA，设计师可以预测材料在实际使用中可能出现的失效模式，并据此调整设计，避免潜在的结构问题。例如，通过分析机器人躯干在承受重物时的应力分布，可以优化支撑结构，确保机器人在执行举重等高负载任务时的安全性和稳定性。


    ### 3）材料的选择和应用

    在人形机器人的躯干和四肢的设计中，选择合适的材料同样关键。高性能材料如轻质合金、高强度塑料和复合材料不仅减轻了机器人的整体重量，还提供了必要的强度和柔韧性。这些材料的选择应基于其性能特性及与机器人设计要求的匹配度，如重量强度比、抗腐蚀性以及加工和维护的便利性。


    # 7.3.4 材料选择与制造技术

    在人形机器人的设计和制造中，选用合适的材料和采用先进的制造技术是至关重要的，这直接影响到机器人的功能性、耐用性以及成本效率。本节详细介绍人形机器人躯干和肢体的材料选择与制造技术。


    ## （1）材料选择

    选择适当的材料对确保机器人结构的强度、重量和灵活性至关重要。以下是几种常用于人形机器人制造的关键材料。


    ### 1）轻质高强度材料

    如铝合金、钛合金和碳纤维复合材料。这些材料因其优越的强度对重量比而被广泛应用于机器人的主要承载结构和移动部件中，有助于减轻整体重量，提高能效和机动性。


    ### 2）工程塑料

    如聚碳酸酯（PC）和聚酰胺（PA，俗称尼龙），这些材料不仅重量轻，而且具有良好的耐磨性和冲击强度，常用于机器人的外壳和非承重部件。


    ### 3）橡胶和软质材料

    用于机器人的接触面，如手掌和脚底，以增加摩擦和缓冲能力，提高机器人处理物体时的精确性和稳定性。


    ## （2）制造技术

    采用先进的制造技术不仅可以提高生产效率和精度，还可以降低成本和提高机器人部件的性能。以下是一些关键的制造技术。


    ### 1）3D 打印技术

    也称为增材制造，能够直接从数字模型生成复杂形状的部件，这对于制造复杂、定制化的机器人结构尤其有用。3D 打印允许设计师快速迭代设计，同时减少材料浪费。


    ### 2）数控机床加工技术

    对于需要高精度和高耐用性的金属部件，如关节和驱动系统的核心组件，通常采用数控机床加工。这种技术能够精确地切割和塑形金属材料，确保部件符合严格的公差和规格要求。


    ### 3）注塑成型技术

    对于大批量生产的塑料部件，注塑成型是一种成本效益高、效率高的制造技术。它可以快速生产出均质且复杂的塑料部件，适用于机器人的外壳和内部支架。


    ### 4）表面处理技术

    包括喷涂、电镀和阳极氧化等，用以改善部件的外观、耐腐蚀性和表面硬度。这些处理不仅提升了机器人的美观和耐用性，还提高了其抗环境侵蚀的能力。


