    ### 2. MEMS混合固态激光雷达


    微机电系统MEMS采用微振镜结构进行光束偏转（其他方案还包括棱镜和旋转镜），具有平整光学镜面的微振镜将机械式激光雷达的旋转部件微缩，提升了集成度。因此，MEMS激光雷达并不是严格意义上的固态激光雷达，而被称为“混合固态激光雷达”。二维扫描的MEMS微振镜是关键器件，主要通过电热效应、静电效应、电磁效应和压电效应驱动，实现MEMS微振镜发生偏转。此外，相控阵技术是MEMS实现激光雷达功能的另一个关键，其基本原理是：MEMS的微小移动产生光程差，多个具有不同相位的出射光束在远场干涉形成光束偏转，原理如图3-54所示。


    ![](EPUB/images/image_227.jpg)


    图3-54 MEMS混合固态激光雷达原理


    目前，二位扫描的MEMS激光雷达领域正在快速发展。部分汽车厂商也会选择MEMS激光雷达产品，如小鹏汽车、极氪汽车、长城汽车等。代表产品有速腾聚创M平台激光雷达M1，其利用二维MEMS智能芯片扫描，性能超过传统一维电机扫描的模式。其产品参数如图3-55所示。


    ![](EPUB/images/image_228.jpg)


    图3-55 激光雷达M1产品参数


    基于棱镜方案的混合固态激光雷达，代表产品有大疆的Livox觅道Mid-360，开启了混合固态激光雷达360°立体感知新篇章。凭借小巧的体积，Mid-360的安装布置更加灵活。同时，Mid-360充分考虑了移动机器人对导航、避障等升维感知的需求，兼容室内外场景。产品规格参数如图3-56所示。


    ![](EPUB/images/image_229.jpg)


    图3-56 激光雷达Mid-360产品规格参数


    固态激光雷达与机械激光雷达有着明显的区别。固态激光雷达通过使用光学相控阵列、光子集成电路以及远场辐射方向图等电子部件来代替机械旋转部件，从而实现对激光发射角度的调整。这种技术改变了传统机械激光雷达的结构，使得固态激光雷达更加紧凑和轻便。光学相控阵列由许多微小的发射器组成，每个发射器都可以独立地调整激光的相位，从而改变激光束的方向。光子集成电路用于控制和调节光学相控阵列中的发射器，以实现精确的激光束控制。此外，远场辐射方向图用于指导激光束的发射方向，确保激光雷达能够准确地扫描和接收目标信息。


    由于内部结构的差异，机械激光雷达和固态激光雷达在尺寸和价格上有所不同。机械激光雷达由于需要机械旋转部件，因此体积较大，总体上价格也更昂贵。然而，机械激光雷达相关技术较为成熟，具备较高的测量精度，能够实现精确的目标检测和距离测量。相比之下，固态激光雷达尺寸较小、成本较低，但测量精度相对较低。尽管固态激光雷达在测量精度方面可能略有牺牲，但其紧凑的尺寸和低成本使其在许多应用领域中具有潜力，特别是对于需要轻便和经济的方案而言。


    ### 3. OPA激光雷达


    高系统集成度的光学相控阵列技术能够满足激光雷达在无人驾驶、无人机等领域全固态、小型化的发展需求。如图3-57所示，激光器功率均分到多路相位调制器阵列，光场通过光学天线发射，在空间远场相干叠加形成一个具有较强能量的光束。经过特定相位调制后的光场在发射天线端产生波前的倾斜，从而在远场反映成光束的偏转，通过施加不同相位，可以获得不同角度的光束形成扫描的效果，无须机械扫描。


    ![](EPUB/images/image_230.jpg)


    图3-57 OPA激光雷达原理


