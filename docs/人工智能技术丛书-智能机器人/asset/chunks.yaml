    ## 5.中国


    我国机器人的发展历程可大致归纳如图 1-28 所示。


    我国机器人研究起步较晚，先后经历了 20 世纪 70 年代的萌芽期，80 年代的开发期和 90 年代的适用化期。1972 年，中国科学院沈阳自动化所开始了机器人的研究工作。1985
    年，哈工大研发出我国首台弧焊机器人。1985 年 12 月 12 日，我国第一台重达 2000kg 的水下机器人“海人一号”在辽宁旅顺港下潜 60m，首潜成功，开创了机器人研制的新纪元，如图
    1-29a 所示。近年来，我国成功研发了新一代的水下机器人，如“潜龙三号”机器人，如图 1-29b 所示。


    1988 年年初，中国船舶总公司 702 所，研制成功了高 3.1m，重 650kg 的载人式水下机器人；1988 年 2 月，国防科技大学成功研制六关节平面运动型两足步行机器人；1995
    年 5 月，我国第一台高性能精密装配智能型机器人“精密一号”在上海交通大学诞生，它的诞生标志着我国已具有开发第二代工业机器人的技术水平；1997 年中国科学院沈阳自动化所研制成功的
    6000m 无缆自治水下机器人，是我国 863 计划中重中之重的项目，获得了 2000 年国家十大科技成果奖。1992 年，南开大学机器人与信息自动化研究所研制出我国第一台用于生物试验的微操作机器人系统。


