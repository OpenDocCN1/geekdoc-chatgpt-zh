    ### 2.3.2 ROS 的通信机制

    ROS 的通信架构是 ROS 的灵魂，它涉及数据的处理、进程的运行、消息的传递等关键方面。ROS 通信架构通过节点（`Node`）的概念来表示不同的应用程序，这些节点之间通过预定义消息格式在特定主题（`Topic`）或服务（`Service`）上进行连接。


    其中，主题通信机制是 ROS 中最常用的通信方式之一，它实现了发布者和订阅者之间的异步通信。通过定义主题名称和消息类型，节点可以以松散耦合的方式进行数据交换。这一机制允许节点在不需要直接了解其他节点的情况下，通过发布和订阅特定主题，实现数据的传递和共享。


    #### 1. 主题通信机制

    ①`Talker`注册：`Talker`节点启动，并通过`RPC`向 ROS `Master`注册发布者的信息，包括节点的信息和需要发布的主题名。ROS `Master`会记录`Talker`节点的信息，以备后续的信息匹配。

    ②`Listener`注册：`Listener`节点启动后，通过`RPC`向 ROS `Master`注册订阅者的信息，包含需要订阅消息的主题名。

    ③ROS `Master`进行信息匹配：ROS `Master`会根据`Listener`订阅的主题名称，从注册列表中查找匹配的发布者信息。如果匹配失败，`Master`会等待匹配的发布者加入；如果匹配成功，`Master`将通过`RPC`向`Listener`发送`Talker`的`RPC`信息，以便后续建立连接。

    ④`Listener`发送连接请求：`Listener`接收到`Master`发送的`Talker`地址信息后，通过`RPC`向`Talker`发送连接请求，包括传输订阅的主题名、消息类型和通信协议（`TCP/UDP`）等信息。

    ⑤`Talker`确认连接请求：`Talker`接收到`Listener`发送的请求后，继续通过`RPC`向`Listener`发送确认连接信息，包括自身的`TCP`地址信息。

    ⑥`Listener`尝试与`Talker`建立网络连接：`Listener`接收到确认信息后，使用`TCP`尝试与`Talker`建立连接。

    ⑦成功建立连接后，`Talker`开始向`Listener`发送主题消息数据，实现了异步的发布和订阅机制，如图 2-12 所示。


    ![](img/image_090.jpg)


    图 2-12 主题通信机制理论模型


    除了主题通信，ROS 还提供了服务调用机制，允许节点之间进行同步的请求和响应式通信。节点可以定义服务，并向其他节点发送请求，等待响应返回。


    #### 2. 服务通信机制

    ①`Talker`启动后，会通过`RPC`在 ROS `Master`中注册自身信息，其中包含提供的服务的名称。ROS `Master`会将节点的注册信息加入注册表中。

    ②`Listener`启动后，也会通过`RPC`在 ROS `Master`中注册自身信息，包含需要请求的服务的名称。ROS `Master`会将节点的注册信息加入注册表中。

    ③ROS `Master`会根据注册表中的信息匹配`Talker`和`Listener`，并通过`RPC`向`Listener`发送`Talker`的`TCP`地址信息。

    ④`Listener`根据②响应的信息，使用`TCP`与`Talker`建立网络连接，并发送请求数据。

    ⑤`Talker`接收、解析请求的数据，并产生响应结果返回给`Listener`。


