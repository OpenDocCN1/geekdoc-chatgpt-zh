    **CHAPTER**  **2**


    # **第2章**


    # **机器人操作系统**


    随着机器人相关技术的不断发展，制造业正在发生翻天覆地的变化，工业机器人正在逐步代替人力劳动，其应用场景从汽车制造工业蔓延到我们生活的各个方面，并对我们的生活产生影响。这些机器人的工作原理是什么？该如何控制机器人？通过本章的学习，读者将逐步了解机器人的工作原理，并踏上开发实践之路。


    ?xml version="1.0" encoding="utf-8"?


    ## **2.1**


    ## **ROS的发展历史**


    随着机器人领域的快速发展，大型项目的开发对代码复用性的需求也越来越大，开发一个协同工作框架的需求日趋强烈。


    机器人操作系统（Robot Operating System，ROS）的系统架构由摩根·奎格利（Morgan Quigley）设计，他在美国斯坦福大学人工智能实验室攻读博士学位期间，在导师吴恩达（Andrew Ng）带领下做过不少机器人和机器学习项目。机器人操作系统的发展历程如图2-1所示。


    ![](EPUB/images/image_068.jpg)


    图2-1 机器人操作系统（ROS）的发展历程


    在与Willow Garage公司合作之前，摩根·奎格利就已经开始在美国斯坦福大学人工智能实验室研发STAIR机器人项目，并负责该项目中的软件架构设计和开发工作。当时，STAIR项目的目标是构建一个服务型机器人原型，在视觉传感器的辅助下，可以在复杂环境中运动，并借助机械臂抓取物体，其中还融入一些人工智能算法。为此，STAIR机器人配备了一个运动底盘、一个小型机械臂、激光雷达和立体摄像头。


    STAIR项目设计并制造的前两个机器人被简单命名为STAIR1和STAIR2。每个机器人在移动基座上都有一个机械臂，但这些机器人在许多细节上有所不同，如图2-2所示。


    ![](EPUB/images/image_069.jpg)


    图2-2 STAIR项目设计制造的机器人


    STAIR项目的开发由多个小组负责，每个小组分别承担不同模块的开发工作，齐头并进。其中，摩根·奎格利负责导航组件和软硬件模块的系统集成。他发现将机械臂操控、导航、视觉等多种功能整合到一个机器人上并非易事，因此他开始思考并采用了分布式的方法，将不同模块连接在一起。这一概念后来成功地应用于ROS中。


    后来，吴恩达与Willow Garage公司合作共同开发ROS，摩根·奎格利充分发挥了他前期在STAIR项目中积累的开发经验，成为ROS框架开发的核心人物。


    2009年，摩根·奎格利、吴恩达和Willow Garage公司的工程师，在当年的IEEE国际机器人与自动化会议上发表了文章*ROS: an open-source robot operating system*，正式向外界介绍ROS。


    PR2（Personal Robot 2，个人机器人2代）是Willow Garage公司设计的机器人平台，PR2机器人如图2-3所示。随着PR2那些不可思议的表现，如叠衣服、插插座、做早饭，ROS也得到越来越多的关注。Willow Garage公司也表示希望借助开源的力量使PR2变成“全能”机器人。


    ![](EPUB/images/image_070.jpg)


    图2-3 PR2机器人


    PR2有两条手臂，每条手臂七个关节，手臂末端是一个可以张合的夹爪；PR2依靠底部的四个轮子移动，在头部、胸部、肘部、夹爪上分别安装有高分辨率摄像头、激光测距仪、惯性测量单元、触觉传感器等丰富的传感设备。在PR2的底部有两台八核计算机作为机器人各硬件的控制和通信中枢，并且都安装了Ubuntu和ROS系统。PR2价格高昂，2011年零售价高达40万美元，现主要用于研究。随着PR2正式对外发布，Willow Garage公司也正式推出ROS正式开发版，即ROS1.0。ROS秉承开源的原则，与全球开发者一同推动机器人事业的发展。可见，PR2是ROS中元老级的机器人平台，所有软件代码均依托于ROS，并在ROS社区中开源，为学习、应用ROS提供了丰富的资源。


    目前ROS生态系统包含世界范围内成千上万的用户，横跨桌面娱乐项目到大型工业自动化系统等诸多领域。ROS的版本控制见表2-1。


