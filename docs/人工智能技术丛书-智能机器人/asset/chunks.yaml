  trans: '


    # 2D SLAM 概述


    所有现实世界的传感器都自然地工作在三维空间，本身与维度无关。然而，大部分轮式机器人只在某个定平面中运动，并不像飞行器那样随意变换姿态。扫地机器人工作在水平地面上，而爬墙机器人则工作在垂直平面上。有的机器人，如酒店的送餐机器人，虽然本体可能有一定高度，但作为运动主体的部分，也就是`SLAM`算法主要关心的部分则是二维的。


    相比于三维空间的点云，`2D SLAM`可以视为在俯视视角下工作的激光雷达`SLAM`算法。在这种视角下，激光雷达扫描数据和地图数据都可以被简化为二维形式。与图像非常相似，地图本身就可以存储为图片，一些图像特征提取、匹配的算法也可以在`2D
    SLAM`中运行。`2D SLAM`对于扫地机器人、`AGV`等机器人应用十分重要，一度是`SLAM`技术的主体，在研究历史上涌现了许多著名方法，如`Fast
    SLAM`、`GMapping`等。然而，由于二维平面运动的假设，当机器人本体或者场景中存在明显三维物体时，就会在方案层面遇到一些难以解决的问题。例如，大部分`2D
    SLAM`方案假设障碍物与激光雷达在同一高度，但如果场景中存在其他高度的障碍物，或者物体形状随着高度有明显变化（如桌面和桌腿就明显不一样，那么二维地图就无法有效地表达这类物体，导致机器人可能会与它们发生碰撞；再如，机器人运动在倾斜的坡面上时，扫描到的物体距离读数与真实距离存在几何上的差异，这些场景违反了二维运动假设，属于系统固有的问题）则很难在`2D
    SLAM`的架下解决，但`3D SLAM`可以很好地弥补这些由二维假设带来的缺陷。下面主要讨论`2D SLAM`。


    ## 典型的 2D SLAM 框架


    图 4-25 所示为典型的`2D SLAM`框架，它主要包括下面四个步骤：


    ![](img/image_296.jpg)


    图 4-25 典型的`2D SLAM`框架


    1）二维激光雷达按照一定频率向外输出激光测距信息，一圈数据称为一次扫描（`Scan`）。


    2）为了计算这次扫描对应的机器位姿，需要将它与某些东西进行匹配（或者配准，`Registration`）。这个过程称为扫描匹配（`Scan Matching`）。既可以将此次扫描与前一次扫描进行匹配，也可以将它与地图进行匹配，所以扫描匹配方法也可以进一步分为`Scan
    to Scan`和`Scan to Map`两种模式，两者的原理基本相同，实际中可以灵活使用。


    3）当估计了扫描的位姿后，就要将它组装到地图中。当然，扫描的本质是点云，所以最简单的方案是把所有的扫描按时间顺序放到地图中，但那可能会受累积误差或运动物体的影响。早期`SLAM`方案往往只使用一张全局地图，现代`SLAM`方案往往使用更灵活的子地图模式，即将一些邻近的激光雷达扫描归入一个子地图，再将子地图拼接起来。在子地图模式中，每个子地图内部都是固定的，不必重复计算。同时，子地图拥有自身独立的坐标系，它们相互之间的位姿允许调整、优化，所以在处理回环时，可以把子地图视作基本单元。子地图是一种介于单帧与全图之间的管理方式，在回环检测、地图更新方面更加方便，如图
    4-26 所示。


    4）扫描得到的地图应该如何存储与更新？许多机器人地图需要区分地图中的障碍物与可通行区域，为了表达这些概念，会使用占据栅格地图进行地图的管理。占据栅格地图可以有效地过滤运动物体对地图的影响，使地图变得更加干净，如图
    4-27 所示。


    当机器人走完上半部分区域回到中心区域后，各个子地图之间会存在明显的重影现象。


    ![](img/image_297.jpg)


    ▲图 4-26 运动过程中`2D SLAM`对应的子地图


    ![](img/image_298.jpg)


    图 4-27 占据栅格地图示例


    ## ROS 中基于 2D 激光的 SLAM 算法


    在`ROS`中提供下列几种基于 2D 激光的`SLAM`算法，分别是：`HectorSLAM`，`Gmapping`、`CoreSLAM`、`KartoSLAM`，以及比较经典的
    Google 开源的`Cartographer`。虽然`Cartographer`不是基于`ROS`，但已经被技术人员修改为基于`ROS`的版本的`cartographer_ros`。


    ### 1. `HectorSLAM`


    `HectorSLAM`是一种结合了鲁棒性较好的扫描匹方法的`2D SLAM`方法和使用惯性传感系统的导航技术。`HectorSLAM`对传感器的要求比较高，它主要是利用高斯-牛顿方法来解决扫描匹配的问题。


    `HectorSLAM`无需使用里程计，因此在不平坦区域的空中无人机和地面小车的建图中具有运用的可行性。它通过优化激光束点阵估计激光点在地图上的标示和占据网络的概率，获得激光点集映射到已有地图的刚体变换。为避免局部最小化而非全局最优的情况出现，`HectorSLAM`使用多分辨率地图。


    `HectorSLAM`需要高更新频率且测量噪声小的激光扫描仪，因此在制图过程中，机器人的速度要控制在较低水平以获得理想的建图效果，这也是其没有回环检测的一个限制。此外，在里程计数据较为精确的情况下，`HectorSLAM`无法有效利用里程计信息。


    `HectorSLAM`多分辨率地图如图 4-28 所示。网格单元格长度（从左到右）分别为：20cm、10cm 和 5cm，使用多分辨率地图表示可避免陷入局部最小化。这个解决方案背后的想法是在内存中同时保存不同分辨率的地图，并使用之前估计的姿势来更新它们。尽管计算成本较低，但地图始终是一致的。


    ![](img/image_299.jpg)


    图 4-28 `HectorSLAM`多分辨率地图


    最后，3D 空间的导航状态估计是基于扩展卡尔曼滤波器（`EKF`）。但是，这种情况仅在`IMU`存在时才需要，如在空中机器人的情况下。因此，这里只讨论二维的`SLAM`。


    ### 2. `Gmapping`


    `Gmapping`是一种基于激光的`SLAM`算法，它已经集成在`ROS`中，是移动机器人中使用最多的`SLAM`算法。这个算法由 Grisetti 等人提出是一种基于`Rao-Blackwellized`的粒子滤波的`SLAM`方法。基于粒子滤波的算法用许多加权粒子表示路径的后验概率，每个粒子都给出一个重要性因子。但是，它们通常需要大量的粒子才能获得比较好的结果，从而增加了该算法的计算复杂性。此外，与`PF`重采样过程相关的粒子退化耗尽问题也降低了算法的准确性。粒子退化问题包括在重采样阶段从样本集粒子中消除大量的粒子。发生这种情况是因为它们的重要性权重可能变得微不足道。因此，这意味着有一定的小概率会消除正确的假设的粒子。为了避免粒子的退化问题，已经开发了自适应重采样技术。


    具体来说，`Gampping`具有如下特性：①`Gmapping`是基于滤波`SLAM`框架的常用开源`SLAM`算法。②`Gmapping`基于`RBPF`粒子滤波算法，即将定位和建图过程分离，先进行定位再进行建图。③`Gmapping`在`RBPF`算法上做了两个主要的改进，即改进提议分布和选择性重采样。


    `Gmapping`可以实时构建室内地图，在构建小场景地图时所需的计算量较小且精度较高，相比`HectorSLAM`对激光雷达频率要求低、鲁棒性高（`HectorSLAM`在机器人快速转向时很容易发生错误匹配，使建出的地图发生错位，原因主要是优化算法容易陷入局部最小值）；相比`Cartographer`，`Gmapping`不需要太多的粒子并且没有回环检测，因此计算量小于`Cartographer`而精度并没有差太多。`Gmapping`有效利用了车轮里程计信息，这也是它对激光雷达频率要求低的原因：里程计可以提供机器人的位姿先验。`HectorSLAM`和`Cartographer`的设计初衷不是为了解决平面移动机器人定位和建图，`HectorSLAM`主要用于救灾等地面不平坦的情况，因此无法使用里程计；`Cartographer`是用于手持激光雷达完成`SLAM`过程，也就没有里程计可以用。


    随着场景增大所需的粒子增加，因为每个粒子都携带一幅地图，因此在构建大地图时所需内存和计算量都会增加，所以`Gmapping`不适合构建大场景地图。而且因为`Gmapping`没有回环检测，在回环闭合时可能会造成地图错位，虽然增加粒子数目可以使地图闭合但要以增加计算量和内存为代价。`Gmapping`和`Cartographer`一个是基于滤波框架的`SLAM`，另一个是基于优化框架的`SLAM`，两种算法都涉及时间复杂度和空间复杂度的权衡。`Gmapping`牺牲空间复杂度保证时间复杂度，这就造成了`Gmapping`不适合构建大场景地图。`Cartographer`算法相当于地图中只用一个粒子，因此存储空间较`Gmapping`会小很多倍，但计算量大，一般的计算机很难运行。


    ### 3. `CoreSLAM`


    `CoreSLAM`是一种旨在简单易懂并最小化性能损失的`SLAM`算法。该算法简化为两个主要过程：距离计算与地图更新。每次输入扫描数据时，`CoreSLAM`基于简单的粒子滤波算法来计算距离。粒子滤波器用于将激光扫描数据与地图进行匹配，每个粒子代表机器人可能的位置及其对应的概率权重，这些权重依赖于之前的迭代计算。算法通过选择最佳的假设分布来优化粒子滤波过程，低权重的粒子会被移除，同时生成新的粒子。在地图更新步骤中，新扫描得到的线条会被添加到地图中。当障碍物出现时，算法不会仅绘制一个孤立点，而是围绕障碍点绘制调整点集，以更准确地表示障碍物的位置和形状。这样的方法确保了地图的连续性和准确性，同时保持了算法的简单性和易理解性。


    ### 4. `KartoSLAM`


    `KartoSLAM`是基于图优化的方法，用高度优化和非迭代 Cholesky（楚列斯基）矩阵进行稀疏系统解耦作为解。图优化方法利用图的均值表示地图，每个节点表示机器人轨迹的一个位置点和传感器测量数据集，箭头指向的连接表示连续机器人位置点的运动，每个新节点加入后，地图就会依据空间中的节点箭头的约束进行计算更新。


    `KartoSLAM`的`ROS`版本，其中采用的稀疏点调整（`Sparse Point Adjustment`，`SPA`）与扫描匹配和闭环检测相关，地标越多，内存需求越大。与其他方法相比，图优化方法在大环境下制图优势更大。在某些情况下`KartoSLAM`更有效，因为它仅包含点的图机器人姿态，求得位置后再建图，如图
    4-29 所示。


    ![](img/image_300.jpg)


    图 4-29 `KartoSLAM`的算法流程


    ### 5. `Cartographer`


    2016 年 10 月 5 日，谷歌宣布开放一个名为`Cartographer`的即时定位与地图建模库，开发人员可以使用该库实现机器人在二维或三维条件下的定位及建图功能。`Cartographer`的设计目的是在计算资源有限的情况下，实时获取相对较高精度的
    2D 地图。考虑到基于模拟策略的粒子滤波方法在较大环境下对内存和计算资源的需求较高，`Cartographer`采用基于图网络的优化方法。目前`Cartographer`主要基于激光雷达来实现`SLAM`，谷歌希望通过后续的开发及社区的贡献支持更多的传感器和机器人平台，同时不断增加新的功能。`Cartographer`是
    Google 的实时室内建图项目，传感器安装在背包上面，可以生成分辨率为 5cm 的 2D 格网地图。该算法主要分为两个部分，第一个部分称为`Local SLAM`，该部分通过一帧帧的激光扫描建立并维护一系列的子图。利用扫描匹配在最佳估计位置处插入子图中，且扫描匹配只跟当前子图有关。算法的第二个部分称为`Global
    SLAM`，该部分通过回环来进行闭环检测，消除累积误差：当一个子图构建完成后，就是不会再有新的激光扫描插入到该子图，算法会将该子图加入到闭环检测中。


    ### 6. `LOAM`


    `LOAM`提出了一种实时`SLAM`解决方案，通过两种独立的算法解决测程和映射问题。定位算法在高频下进行低精度的测程，而映射算法在低频下构建精确的地图。从硬件角度来看，它结合了
    3D `IMU`传感器和激光雷达来估计姿态和地图。实验结果表明，该方法具有较高的定位性能，在`IMU`的辅助下可以获得更高的定位精度。由`LOAM`算法生成的点云图如图
    4-30 所示，图中每个白点为相对特征点提取算法提取的一个特征点，线条为当前时刻激光雷达扫描碰到物体的位置。


    ![](img/image_301.jpg)


    图 4-30 由`LOAM`算法生成的点云图（详见彩插）


    `V-LOAM`是`LOAM`的改进版本，它提出了一个结合视觉和激光雷达信息的通用框架，并取得了比`LOAM`更好的定位结果。对于`V-LOAM`，视觉里程计在
    60Hz 的高频（图像帧率）下进行运动估计，而激光雷达里程计在 1Hz 的低频下进行细化运动估计、去除畸变和校正漂移，从而使系统能够适应快速运动和环境光照变化的环境。因此，该算法的性能优于
    LiDAR-only 算法，在`KITTI`基准测试中排名第一，视觉和激光雷达测程相结合时的漂移误差为 0.55%。


    ### 7. `AMCL`


    `AMCL`（`Adaptive Monte Carlo Localization`，自适应蒙特卡洛定位），是机器人在二维移动过程中概率定位系统，采用粒子滤波器来跟踪已经知道的地图中机器人位姿，对于大范围的局部定位问题工作良好。对机器人的定位是非常重要的，因为若无法正确定位机器人当前位置，那么基于错误的起始点来进行后面规划的到达目的地的路径必定也是错误的。


    1）蒙特卡洛方法：一种以概率统计理论为指导的算法。该方法通过某种“实验”的方法，以这种事件出现的频率估计这一随机事件的概率，或者得到这个随机变量的某些数字特征，并将其作为问题的解。以机器人定位为例，它处在地图上任何一个位置都有可能，这种情况下，使用粒子来表达位置的置信度，粒子多的地方，表明机器人在那里的可能性高。


    2）粒子滤波：粒子数代表可能性的高低。通过某种评价方法（评价这个东西的可能性），改变粒子的分布情况。例如，在机器人定位中，如果认为某个粒子 A 在某一坐标的可能性很高，那么就打高分。下次重新安排所有的粒子位置的时候，就在这个位置附近多安排一些。重复几次，粒子就都集中到可能性高的位置去了。


    3）自适应蒙特卡洛定位，自适应体现在：


    ①解决了机器人绑架问题，它会在发现粒子们的平均分数突然降低时（意味着正确的粒子在某次迭代中被抛弃了），在全局再重新撒一些粒子。


    ②解决了粒子数固定的问题，因为当机器人定位差不多得到时，比如这些粒子都集中在一块了，还要维持这么多的粒子没必要，这个时候粒子数可以少一些。


    ### 8. `3D-CTSM`


    低成本激光雷达三维建图能够快速、准确以及高效地完成场景点云地图的三维重建，具有高时效、高灵活、高精度的特点，但是由于低成本激光雷达数据采集视场受限，并且点云分布不均，大范围点云融合与配准仍然存在挑战。武汉大学测绘遥感信息工程国家重点实验室杨必胜教授团队提出了一种新颖的`SLAM`方法`3D-CTSM`。它是一种基于激光雷达的大场景三维地图构建系统，其通过提取场景中的结构化特征构建鲁棒的特征关联，利用误差向量椭圆解决激光退化问题，利用样条线模型对运动轨迹进行建模，以减小激光点云运动畸变对点云融合的影响，最终恢复场景时空连续的低冗余三维点云地图。`3D-CTSM`系统架构如图
    4-31 所示，其中，定位模块可以实现快速的运动估计，建图模块完成对三维场景的高精度建图。


    ![](img/image_302.jpg)


    图 4-31 `3D-CTSM`系统架构


    通过将生成的三维点云地图与具有更高精度的地面激光扫描（`TLS`）以及车载激光扫描（`MLS`）点云数据进行比较，`3D-CTSM`系统所构建的点云地图具有更高的精度以及时空连续性。基于`3D-CTSM`，并结合视觉`SLAM`、`IMU`、`北斗定位`等技术，杨必胜教授团队研发了一种穿戴式的定位与建图系统——“珞珈探索者”，如图
    4-32 所示。该系统具有实时影像-激光点云建图、自组网实时数据传输、北斗激光多传感器融合定位等特点，图 4-33 所示为其实际场景应用。


    ![](img/image_303.jpg)


    ▲图 4-32 “珞珈探索者”系统构成


    ![](img/image_304.jpg)


    图 4-33 “珞珈探索者”实时人员定位与影像-激光点云建图


    ## 4.3 ROS 导航算法实战


    本节包括`Gmapping`和`Cartographer`两部分的实战内容。


    ### 4.3.1 `Gmapping`


