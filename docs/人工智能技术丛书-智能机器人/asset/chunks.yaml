    UBTECH Robotics是一家总部位于中国深圳的机器人制造公司，开发了Walker系列机器人。UBTECH Walker能够行走、跳跃、执行各种动作，并与用户进行互动。该系列机器人使用原创AI技术，搭载高性能伺服关节以及多维力觉、多目立体视觉、全向听觉和惯性、测距等全方位的感知系统；全面升级视觉定位导航和手眼协调操作技术，自主运动及决策能力大幅提高，可实现平稳快速的行走和精准安全的交互。


    Unitree H1是一款由宇树科技公司开发的人形机器人。它具有出色的机械设计和动力学特性，旨在模仿人类的行走和动作。Unitree H1是一款非常灵活的机器人，具备先进的平衡能力，可以自主行走、爬楼梯、跳跃，甚至进行各种高难度的动作，如翻滚和伸展，如图1-38a所示。作为国内第一台能跑的全尺寸通用人形机器人，Unitree
    H1拥有稳定的步态和高度灵活的动作能力，能够在复杂地形和环境中自主行走和奔跑。


