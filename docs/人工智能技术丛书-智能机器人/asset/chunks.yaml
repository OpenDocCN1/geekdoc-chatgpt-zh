    **5.中国**


    我国机器人的发展历程可大致归纳如图1-28所示。


    我国机器人研究起步较晚，先后经历了20世纪70年代的萌芽期，80年代的开发期和90年代的适用化期。1972年，中国科学院沈阳自动化所开始了机器人的研究工作。1985年，哈工大研发出我国首台弧焊机器人。1985年12月12日，我国第一台重达2000kg的水下机器人“海人一号”在辽宁旅顺港下潜60m，首潜成功，开创了机器人研制的新纪元，如图1-29a所示。近年来，我国成功研发了新一代的水下机器人，如“潜龙三号”机器人，如图1-29b所示。


    1988年年初，中国船舶总公司702所，研制成功了高3.1m，重650kg的载人式水下机器人；1988年2月，国防科技大学成功研制六关节平面运动型两足步行机器人；1995年5月，我国第一台高性能精密装配智能型机器人“精密一号”在上海交通大学诞生，它的诞生标志着我国已具有开发第二代工业机器人的技术水平；1997年中国科学院沈阳自动化所研制成功的6000m无缆自治水下机器人，是我国863计划中重中之重的项目，获得了2000年国家十大科技成果奖。1992年，南开大学机器人与信息自动化研究所研制出我国第一台用于生物试验的微操作机器人系统。


    2000-2010年：工业制造和服务机器人。


    新松机器人：沈阳新松机器人公司（SIASUN）成为中国领先的工业机器人制造商之一，生产了各种用途的机器人，其中工业机器人和移动机器人产品现已具备智能感知、自主决策、自控执行等功能，在各行业进行了深度的应用实践与工艺融合，如新松工业机器人T165A-26，如图1-30所示。


    ![](EPUB/images/image_037.jpg)


    ▲图1-28 中国机器人的发展历程


    ![](EPUB/images/image_038.jpg)


    ▲图1-29 潜水机器人


    ![](EPUB/images/image_039.jpg)


    图1-30 新松工业机器人T165A-26


    2005年，中科院沈阳自动化所研制成功星球探测机器人。2006年，我国成功研制出世界最大潜深载人潜水器“海极一号”，其具有7000m的工作潜深，可以达到世界99.8%的海底，比世界上另外5台同类产品深500m。


    2010-2020年：协作机器人和智能制造。


    教育类人形机器人：优必选研发的Alpha机器人系列，如图1-31a所示。该系列包括Alpha1S、Alpha2、AlphaMini等，具有人脸识别、声音位置感知等功能，只需通过语音遥控，就能让Alpha拍照、跳舞、讲故事、记录精彩生活片段；深圳幻尔和乐聚科技也推出了人形机器人，分别如图1-31b和图1-31c所示，在机器人竞赛领域产生了较大影响。


    物流机器人：阿里巴巴菜鸟、京东、顺丰相继研发了一系列物流机器人（图1-32），用于仓储和快递物流。这些机器人可以与运输管理系统对接，智能规划配送路径，将包裹及时高效地送到指定位置；它们采用激光、视觉并行的SLAM方案，通过深度学习、环境感知、自适应粒子滤波等算法，对动态实体进行轨迹预测，实现动态目标识别和避障。


    ![](EPUB/images/image_040.jpg)


    ▲图1-31 教育类人形机器人


    ![](EPUB/images/image_041.jpg)


    图1-32 物流机器人


    清洁机器人：科沃斯DEEBOT T9，用于清洁卫生的机器人，能够自主进行地板清扫和消毒，其升级版SLAM算法能够快速扫描各种复杂家庭环境，其中DEEBOT系列搭载升级版dToF传感器，不受日照光线干扰，可以24h全天候实时精准导航；深圳智绘科技AL-LYBOT-C2清洁机器人集洗地、吸尘、推尘于一体，具备自主作业能力，搭配全功能基站，可实现自主充电、自清洁、便捷排污加水等功能，可广泛应用于医院、商场、校园、展厅、写字楼、候机楼等场所（见图1-33）。


    ![](EPUB/images/image_042.jpg)


    图1-33 清洁机器人


    近年来，中国机器人产业发展取得了新进展，在基础能力、产品质量、集成应用等方面均呈现出良好的发展势头。在产业规模方面，中国工业机器人市场蓬勃发展，连续8年稳居全球第一，2020年装机量占全球的44%。国家统计局的数据显示，2016-2020年，中国工业机器人产量从7.2万套快速增长到21.2万套，年均增长31%。


    自2020年以后，中国在科研领域也取得了令人瞩目的成就。其中，成功发射嫦娥探月器是一个重要里程碑，图1-34所示为嫦娥四号搭载的“玉兔二号”月球车。这种无人控制的机器人被广泛用于月球的勘测和科研任务，进一步推动了我国在空间探索领域的发展。


    ![](EPUB/images/image_043.jpg)


    图1-34 嫦娥四号搭载的“玉兔二号”月球车


    1）智能交通：主要是无人驾驶领域，国内比亚迪公司旗下汽车包括无人驾驶智能汽车汉等多个系列，蔚来、理想、小鹏等无人驾驶汽车公司也是无人驾驶领域的佼佼者，如图1-35所示。


    ![](EPUB/images/image_044.jpg)


    图1-35 国产智能汽车


    2）仿人机器人：宇树H1、智元远征A1、小米CyberOne以及优必选Walker是仿人机器人领域的代表，经过发展，推出了各自的产品，如图1-36所示。


    ![](EPUB/images/image_045.jpg)


    图1-36 仿人机器人


    在创新智能方面，2021年9月，世界机器人大会在北京举行，我国的展品在工业、服务业、特种机器人等多方面拿出了不少世界领先的亮眼表现。服务领域有疫情防控方面的智能消毒、测温机器人，自助核酸检测机器人；手术方面的脑、骨科、口腔等精密辅助机器人；物流方面的配送、巡检、导引机器人；穿戴式辅助康复外骨骼；工业领域从新一代智能操作系统到机器人专业技能考核实训台，以及电动机、柔性关节、减速器、起重机等多种基础革新配件；特殊领域包含AI仿生手、轻巧灵活的四足机器人、仿生鲨鱼、污水巡检机器人及防爆灭火机器人等。


    2023年10月，中国农业机械工业协会农业机器人分会在武汉成立，中国农机院当选为会长单位。近5年，中国各种农业机器人，如智能播种机器人、智能喷施机器人、智能采摘机器人、智能除草机器人、智能灌溉机器人等，都得到了快速发展。


    **1.2.2**


    **我国机器人发展计划**


    《中国制造2025》站在历史的新高度，从战略全局出发，明确提出了我国实施制造强国战略的第一个十年的行动计划，将“高档数控机床和机器人”作为大力推动的重点领域之一，提出机器人产业的发展要“围绕汽车、机械、电子、危险品制造、国防军工、化工、轻工等工业机器人、特种机器人，以及医疗健康、家庭服务、教育娱乐等服务机器人应用需求，积极研发新产品，促进机器人标准化、模块化发展，扩大市场应用。突破机器人本体，减速器、伺服电动机、控制器、传感器与驱动器等关键零部件及系统集成设计制造技术等技术瓶颈”，并在重点领域技术创新路线图中明确了我国未来十年机器人产业的发展重点主要为两个方向：一是开发工业机器人本体和关键零部件系列化产品，推动工业机器人产业化及应用，满足我国制造业转型升级迫切需求；二是突破智能机器人关键技术，开发一批智能机器人，积极应对新一轮科技革命和产业变革的挑战，具体要点有：


    1）以需求为导向，增强创新能力，扩大市场应用。


    2）突破技术瓶颈，提升产业化能力。


    3）加快下一代机器人研发生产，抢占机器人技术及产业发展的下一个制高点。


    未来，随着医疗、养老、教育等行业智能化需求的持续释放，服务机器人、特种机器人蕴藏巨大的发展潜力。近年来，我国机器人产业在前沿技术上也取得了进步，一些以前只能在科幻电影中出现的场景，已经走进了现实生活。


    我国机器人制造企业日益壮大，具备了自主研发和生产的能力。以国内著名机器人企业如新松机器人、云从科技、大族激光、四川长虹为代表，中国机器人企业在工业机器人、服务机器人等领域取得了长足的发展。在高端应用方面，工业机器人已经成功应用于航空、航天、造船、汽车、发动机等多个高端制造行业。服务机器人、特种机器人在医疗手术、教育服务、安防巡检、灾后救援等高附加值服务场景实现了突破应用。此外，机器人不仅应用于高科技行业，也在逐渐向家具、食品、冶金、建筑、纺织、铸造、锻造、卫浴等传统行业延伸，有效解决了劳动密集型企业用工难的问题，以及恶劣环境高风险作业等行业的痛点问题。


    值得注意，中国机器人产业总体尚处于发展的初期阶段，很多关键核心技术仍然有待进一步突破，行业应用水平有待进一步提高。我们需要把握机器人技术的发展趋势，共同突破机器人的共性关键技术，研发高性能电机、仿生感知与认知、情感交互等前沿技术，推进5G、大数据、云计算、大模型等新一代信息技术的融合应用，提高机器人智能化和实用性水平。


    在政策层面，2023年工业和信息化部等17部门印发《“机器人+”应用行动实施方案》，以加快推进机器人应用拓展。其中提出，到2025年，制造业机器人密度较2020年实现翻番，聚焦10大应用重点领域，突破100种以上机器人创新应用技术及解决方案，推广200个以上具有较高技术水平、创新应用模式和显著应用成效的机器人典型应用场景，打造一批“机器人+”应用标杆企业，建设一批应用体验中心和试验验证中心。推动各行业、各地方结合行业发展阶段和区域发展特色，开展“机器人+”应用创新实践。搭建国际国内交流平台，形成全面推进机器人应用的浓厚氛围。


    **1.2.3**


    **全球机器人发展浪潮**


    为进一步抢占国际市场，提升制造业在全球的竞争性地位，各经济强国跃跃欲试，纷纷制定发展规划，以图抢占先进机器人技术的发展先机。


    2016年，美国白宫发布了《美国国家人工智能研究和发展战略计划》。这一战略旨在促进人工智能的研究和应用，包括机器人技术在内。“美国机器人发展路线图”提出围绕制造业攻克机器人的强适应性和可重构的装配、仿人灵巧操作、基于模型的集成和供应链的设计、自主导航、非结构化环境的感知、教育训练、机器人与人共事的本质安全性等关键技术。在国防领域，2019年，美国国防部发布了《机器人自动化战略》。该战略旨在推动军事领域机器人技术的发展和应用，以增强国家的防御能力。美国军方曾制订“未来战斗系统”（Future Combat Systems）计划，成果转至旅级战斗队现代化计划，加强无人系统和自主机器人的研发，用于如侦察、救援和排除爆炸物任务。美国国家航空航天局（NASA）发展了多个太空机器人项目，如“Curiosity”和“Perseverance”，研究机器人在太空探索中的应用，包括月球和火星任务，Curiosity探测器如图1-37a，Perseverance探测器如图1-37b。在医疗保健领域，美国医疗机构和科技公司开发外科机器人和远程医疗机器人，如达·芬奇外科手术系统，以提供更好的医疗服务，如图1-37c所示。


    ![](EPUB/images/image_046.jpg)


    图1-37 美国太空机器人和医疗机器人


    2015年年初，日本政府公布了《机器人新战略》，明确提出要“研究开发下一代机器人中要实现的数据终端化、网络化、云计算等技术”。日本政府鼓励机器人技术的研发，以解决人口老龄化和劳动力短缺问题。2018年，日本政府发布了第五次机器人基本计划，推进机器人技术的研究和应用，促进机器人在工业、医疗、服务、农业等领域的广泛应用。2021年，日本科学技术振兴机构发布了机器人基础计划2021。该计划旨在通过推动机器人基础研究的进展，实现创新突破和核心技术的提升。该计划提出了加强基础研究、培育机器人技术的社会共识、促进产业化等一系列措施。


    韩国政府近年来陆续发布多项政策，旨在扶植第三代智能机器人的研发与应用，2012年韩国公布的《机器人未来战略2022》，其政策焦点为支持韩国企业进军国际市场，抢占智能机器人产业化的先机；2018年发布了《第四次智能机器人技术发展战略》，旨在培养100家智能机器人企业，推进人工智能与机器人技术的研发与应用。


    欧盟于2020年发布了《欧盟智能机器人战略规划》，旨在建立一个欧洲智能机器人创新生态系统，加强人工智能、机器人技术的研发、投资和应用。英国计划开展医疗机器人项目，如Versius手术机器人，改善外科手术的精度和效率。德国政府推行“工业4.0”战略，构建“智能工厂”，打造“智能生产”，其重点课题之一是人与机器、机器与机器之间的交互合作。法国提出了“未来工厂”计划，旨在促进智能制造和自动化机器人技术在法国制造业中的应用。


    **如何防止机器人伤害人类？——人类对机器人可能存在的安全隐患的思考**


    **“机器人三大定律”——源自阿西莫夫的科幻小说**


    ![](EPUB/images/image_047.jpg)


    艾萨克·阿西莫夫（Isaac Asimov，1920-1992），俄罗斯犹太裔美国科幻小说作家、科普作家、文学评论家，美国科幻小说黄金时代的代表人物之一。


    阿西莫夫一生著述近500本，题材涉及自然科学、社会科学和文学艺术等许多领域，与罗伯特·海因莱因、亚瑟·克拉克并列为科幻小说的三巨头。其作品中以《基地》系列、《银河帝国三部曲》和《机器人》系列为代表，曾获代表科幻界最高荣誉的雨果奖、轨迹奖和星云终身成就大师奖等。他在1950年出版的短篇小说集《我，机器人》（*I*，*Robot*）中提出了“机器人三大定律”。


    ◆【第一定律】不可伤害人类，也不可因不作为而让人类受到伤害。在科幻小说中，这一定律常常成为机器人的核心准则，它强调了机器人的首要责任是保护人类的安全。当然这也引发了一系列道德和伦理困境，例如，当机器人必须在不同人类之间做出选择时，或者在不同的生存危险情境下，如何平衡这一定律是科幻小说的一大看点。


    ◆【第二定律】必须服从人类的命令，除非这些命令与第一定律相冲突。第二定律强调了机器人对人类的服从性，但也引入了潜在的矛盾和冲突。在故事中，机器人必须解释和权衡各种命令，特别是当不同的命令之间发生冲突时。这种情况经常用来探讨机器人在道德抉择中的矛盾和难题，以及人类与机器人之间的复杂关系。


    ◆【第三定律】必须保护自身的安全，前提是这不与第一或第二定律相冲突。第三定律强调了机器人自身安全的重要性，但也明确指出了当机器人必须在自我保护与保护人类之间权衡时，必须遵循第一和第二定律。这引发了有关机器人自我保护欲望和对人类忠诚之间的冲突的情节，以及关于机器人如何解释和执行这些定律的复杂问题。'
