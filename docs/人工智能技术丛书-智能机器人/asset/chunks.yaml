    ## 5.1 机械臂简介


    本节主要介绍机械臂的发展、机械臂的组成结构以及机械臂的运动学模型三部分的内容。


    ### 5.1.1 机械臂的发展


    #### 1. 机械臂的发展历程


    机械臂是模仿人手、手腕和手臂功能，能将任意物件或工具按要求进行抓取、移动和操作的自动机械装置。机械臂也是机器人的一种。它将人类从繁重的重复性工作和危险性工作中解放出来，实现了工业的自动化和机械化。目前，机械臂已广泛应用于机械制造、电子、冶金、轻工和原子能等部门，并且在医疗和服务行业也取得了较大进展。


    机械臂的发展最早可以追溯到 20 世纪中期，至今已经历了三代。第一代机械臂是远程遥控机械臂，由操控者远程控制机械臂完成一系列动作，自身不具有独立控制运动的能力和反馈能力；第二代机械臂是预编程机械臂，可以通过预先编程控制机械臂按照一定的步骤重复运动，具有一定的反馈能力，但不具有决策规划能力；第三代机械臂是智能机械臂，可以通过传感器获取自身状态和环境信息，然后通过智能算法进行决策和规划，具备一定的自主能力。


    第一代机械臂的诞生源于核技术发展的需要。20 世纪 40 年代，美国创建了核能实验室，由于实验室内核辐射环境对人体的危害太大，因此迫切需要一些自动机械装置帮助处理放射性物质。基于这个需求，美国原子能委员会的阿尔贡研究所于
    1947 年开发了遥控机械臂，一年后又设计制作了主从机械臂。主从机械臂由主机械臂和从机械臂构成，当操作人员控制主机械臂做出某些动作时，从机械臂可以准确模仿主机械臂的动作。


    1954 年，乔治·德沃尔研发了世界上第一台可编程机械臂。这种机械臂可以按照预先编写的程序进行运动操作，相比需要人为遥控操作的机械臂，它更具有灵活性和通用性。目前，在汽车工业和生产流水线中广泛使用的第二代机械臂都是在此基础上发展起来的。


    1956 年，约瑟夫·恩格尔伯格购买了乔治·德沃尔“程序化部件传送设备”的专利，并于次年成立了世界上第一家机器人公司`Unimation`。1959 年，恩格尔伯格研发出世界上第一台工业机器人`Unimate`，如图
    5-1 所示，他也因此被称为“机器人之父”。


    ![](img/image_341.jpg)


    图 5-1 世界上第一台工业机器人`Unimate`


    20 世纪 60 年代，人们开始尝试将传感器添加到机械臂上，使机械臂具有各种感知能力，第三代智能机械臂开始萌芽。1962 年，`H.A.`厄恩斯特将触觉传感器和机械臂结合，使其能“感觉”到块状材料，并通过该信息自动将块状材料堆起来，而无须人为干预。同年，汤姆威克和博奈研制出一种装有压力传感器的手爪，一旦手爪接触到物体，压力传感器就会将相关信息反馈给控制计算机，从而控制手爪对物体进行操作。20
    世纪 60 年代中期，斯坦福、MIT、爱丁堡大学等高校陆续成立机器人实验室。随后不久，“波士顿”机械臂和“斯坦福”机械臂相继成功研发，“斯坦福”机械臂如图
    5-2 所示。其中，“斯坦福”机械臂配备有视觉传感器，可以按照不同的策略自动堆放材料。


    ![](img/image_342.jpg)


    图 5-2 “斯坦福”机械臂


    20 世纪 70 年代，大量的研究工作将重点放在如何提高机械臂的感知能力。1973 年，博尔斯和保罗将视觉和力反馈传感器装在“斯坦福”机械臂上，用来装配自动水泵。1975
    年，IBM 公司的威尔和格罗斯曼开发了一个带有触觉和力觉传感器的机械臂，用于完成打字机装配工作。1979 年，`Unimation`公司推出了`PUMA`系列工业机械臂，可配置视觉、触觉、力觉等传感器，是当时技术较为先进的工业机械臂，如图
    5-3 所示。整个 70 年代，机械臂逐渐应用到工业生产环境中，截至 1980 年年底，全世界约有 2 万台工业机械臂投入生产应用中。


    ![](img/image_343.jpg)


    图 5-3 早期`PUMA`工业机械臂


    进入 20 世纪 80 年代，机械臂继续快速发展，并大量应用到工业生产环境中，其中装配机械臂发展最迅猛。机械臂的发展也带动了机器视觉和各类传感器的发展。但是到了
    80 年代末期，由于行业开始进入饱和，导致机械臂的发展势头越来越缓，甚至出现了衰退。1990 年代初期短暂复苏后于 1993 年又跌入低谷，直到 1995
    年才开始缓慢恢复。


    1996 年，美国直觉外科公司推出第一代达·芬奇外科手术系统。该系统是由外科医生控制台、机械臂系统和成像系统三部分组成的高级机器人平台。从医学角度来说，达·芬奇外科手术系统可以看成高级的腹腔镜系统，它通过微创的方式实施复杂的外科手术。2006
    年，直觉外科公司推出了第二代达·芬奇外科手术系统，如图 5-4 所示。相比于第一代，第二代系统机械手臂的运动范围更大了，它允许医生在不离开控制台的情况下进行多图观察。第三代系统和第四代系统分别在
    2009 年和 2014 年推出。第三代系统在第二代的基础上增加了模拟控制器、双控制台、术中荧光显影技术等功能，第四代系统则在灵活度、准确度和成像清晰度上都有了质的提升。目前已发展到第五代。


    ![](img/image_344.jpg)


    图 5-4 第二代达·芬奇外科手术系统


    进入 21 世纪，机械臂的发展迎来新篇章。人工智能、仿生学、材料学、纳米技术、3D 打印技术及微机电技术的发展成果广泛应用到机械臂研究中。第三代智能机械臂开始蓬勃发展，机械臂的个性化、人性化、智能化已成为机械臂行业乃至整个机器人行业发展的趋势。


    #### 2. 机械臂的分类


    在机械臂的发展过程中，机械臂按其结构特点可以分为关节型机械臂（图 5-5）、仿人机械臂、柔性机械臂和并联型机械臂四大类。


    关节型机械臂像人手臂一样有多个关节，目前常见的关节型机械臂可达 6～7 个自由度。由于关节相互独立，因此这种机械臂一般比较灵活，可调性强。但各部件之间摩擦产生的磨损比较大，重复精度低。


    ![](img/image_345.jpg)


    图 5-5 关节型机械臂


    仿人机械臂的外形最像人的手和手臂，其根据手指关节的驱动数可分为灵巧手和欠驱动手，如图 5-6 所示。灵巧手至少有 3 根手指，且每根手指至少有 3 个驱动器和
    3 个自由度，因此灵巧手的自由度很高，更容易完成精细操作。但灵巧手太过复杂，携带和维护都不方便。欠驱动手每个手指也至少有 3 个自由度，但只有 1 个驱动器，因此相较于灵巧手，欠驱动手结构简单、携带方便、操作便捷。


    ![](img/image_346.jpg)


    图 5-6 仿人机械臂


    柔性机械臂的柔性主要表现在关节的柔性和连杆的柔性，如图 5-7 所示。关节的柔性是指机械臂关节转轴的扭曲变形，这种变形有利于实现高速操作，同时具有高负载、低能耗、低成本的优点。连杆的柔性是指机械臂连杆的弹性变形，可以使机械臂的运动过程更加柔顺，减少对杆件的冲击。但柔性机械臂受到震动后会严重影响其控制的精度和稳定性，因此如何消除弹性变形和弹性振动的影响是柔性机械臂的一大研究热点。


    ![](img/image_347.jpg)


    图 5-7 柔性机械臂


    串联机械臂是一个机械臂接一个末端执行器，如上述三种机械臂，而并联机械臂则是多个机械臂接一个末端执行器，如图 5-8 所示的`Delta`并联机械臂。末端执行器指的连接在机械臂末端具有一定功能（如抓夹、吸取等）的工具。并联机械臂由于有多个手臂支撑，因此其承载强度一般要高于串联机械臂；又由于各个机械臂之间会相互干涉，因此其工作空间小于串联机械臂。除此之外，相较于串联机械臂由各个关节驱动，并联机械臂的驱动分散在各个机械臂，因此累积误差小、精度高。


    ![](img/image_348.jpg)


    图 5-8 `Delta`并联机械臂


    ### 5.1.2 机械臂的组成结构


    机械臂由一系列的关节和连杆组成，一个关节连接两个连杆。如图 5-9 所示，圆圈表示关节，圆圈之间的部分为连杆，其中关节 1 和关节 2 的转动角度分别为`θ[1]`和`θ[2]`，连杆
    1 和连杆 2 的长度分别为`l[1]`和`l[2]`，`M[pl]`为负载质量。对于具有`n`个关节和`n+1`个连杆的机械臂，关节的编号一般从 1～`n`，连杆的编号从
    0～`n`。其中，0 号连杆一般是固定的，为机械臂的基座；`n`号连杆连接着末端执行器；关节`i`连接连杆`i-1`和连杆`i`。


    根据连杆连接方式的不同（串联和并联）可以分为串联机械臂和并联机械臂。机械臂的一个关节一般对应一个自由度，这个自由度可以是移动、旋转或弯曲自由度。例如，常见的
    6 自由度串联机械臂就是由 6 个关节组成，前 3 个关节确定目标位置，后 3 个关节决定末端执行器的姿态，因此机械臂可以到达工作空间的任意位姿，执行各种任务，图
    5-9 所示的关节型机械臂就是 6 自由度的。


    关节是机械臂的核心部件。机械臂的关节主要由驱动器、传动装置、传感器及各种机械零件组成。控制器将控制信号传送到驱动器，驱动器再控制机械臂关节和连杆运动，由此带动机械臂完成各种动作，因此控制机械臂的本质就是控制驱动器。除此之外，机械臂一般还会装配各种末端执行器，如`Robotiq`夹爪（图
    5-10）及各种传感器，以帮助机械臂完成各种特定任务。


    ![](img/image_349.jpg)


    ▲图 5-9 二连杆机械臂结构


    ![](img/image_350.jpg)


    图 5-10 `Robotiq`夹爪


    ### 5.1.3 机械臂的运动学模型


    机械臂的运动学模型主要包括关节运动模型的机械臂正、逆运动学模型的相关内容。


    机械臂的运动主要依靠关节驱动完成，因此在介绍机械臂运动学模型前，先简单介绍关节运动模型。图 5-11 所示为一个简单的机械臂关节-连杆模型，包括 3 个关节和
    2 个连杆。每个关节`i`都有一个坐标系，关节`i`为旋转关节时，坐标轴`z`轴根据右手定则确定，绕`z`轴的旋转角度为关节变量；关节`i`为滑动关节时，`z`轴指向滑动方向，滑动关节连杆长度`d`是关节变量。关节`i`的`x`轴垂直于关节`i-1`的`z`轴，方向由`i-1`指向`i`。`z`轴和`x`轴确定后，`y`轴的方向为垂直`xz`平面的方向。


    ![](img/image_351.jpg)


    图 5-11 机械臂关节-连杆模型


