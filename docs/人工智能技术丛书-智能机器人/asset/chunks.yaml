    # 相机标定与深度感知技术


    `R`表示旋转矩阵（Rotation Matrix），它描述了相机坐标系与世界坐标系之间的旋转关系。旋转矩阵是一个 3×3 的矩阵，表示相机坐标系中的坐标如何旋转以与世界坐标系对齐，保持了坐标系之间的正交性和长度归一化。`T`代表平移向量（Translation
    Vector），它是一个 3D 向量，表示相机坐标系的原点相对于世界坐标系的平移距离和方向。`0^T`表示行向量[0，0，0]，用于确保矩阵的维度匹配，使其成为
    4×4 的齐次变换矩阵。相机中心通常位于相机坐标系的原点，即相机光轴与相机传感器的交点。


    相机坐标系与图像坐标系的数学关系为


