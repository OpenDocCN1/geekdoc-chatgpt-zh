    # 5.3 UR机械臂抓取实例


    本节主要介绍坐标系统的转换、配置UR机械臂以及机械臂抓取的实现三部分内容。


    ## 5.3.1 坐标系统的转换


    一般来说，UR机械臂控制分为识别和操纵两个部分。识别部分主要是通过识别算法获取物体的像素坐标，但操纵机械臂往往需要的是物体在世界坐标系下的三维坐标，因此，这就涉及坐标系之间的转换。


    坐标系转换通常是在以下四个坐标系之间进行：像素坐标系（`u`，`v`）、图像坐标系（`x`，`y`）、相机坐标系（`x[c]`，`y[c]`，`z[c]`）和世界坐标系（`x[w]`，`y[w]`，`z[w]`）。


    ### 1.像素坐标系和图像坐标系


    像素坐标系是以图像左上角的顶点为坐标原点，从原点出发，水平方向的直线为`u`轴，垂直方向为`v`轴。像素坐标系的坐标值是离散的。


    图像坐标系以图像中心为坐标原点，水平方向为`x`轴，垂直方向为`y`轴。图像坐标系的坐标值是连续的，如图5-31所示。


