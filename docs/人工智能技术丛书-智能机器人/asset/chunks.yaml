    ## **6.2**


    ## **四足机器人运动控制**


    本节主要包括四足机器人的结构设计、四足机器人运动学模型、运动学正逆解问题以及姿态控制仿真四部分内容。


    **6.2.1**


    **四足机器人的结构设计**


    四足机器人的结构设计包括四足机器人的结构组成、硬件结构以及关节三部分内容。


    **1.四足机器人的结构组成**


    四足机器人的结构组成包括四条可以自由活动的四肢和躯干，如图6-13所示。


    四足机器人的腿部关节通常分为髋关节、膝关节和踝关节。通常情况下，每个自由度对应一个执行器，通常采用旋转关节执行器，如图6-14所示。然而，真实动物的关节通常可以具有多个自由度，因此需要采用新型执行机构，尤其是具备大力矩和多自由度的执行器，以更好地模仿四足动物的运动。


    ![](EPUB/images/image_444.jpg)


    图6-13 四足机器人的结构组成


    四足动物的髋关节拥有2个自由度，分别用于左右横跨和前后摆动。左右横跨的自由度会为机器人带来额外的扰动，增加了机器人的控制难度，同时也增加了机器人的机械结构设计复杂度。膝关节通常具有前后摆动的自由度，但膝关节相对于腿部的旋转轴较远，因此膝关节的质量会在很大程度上影响整条腿的转动惯量。如果腿部的转动惯量过大，将不利于腿部的高速运动。踝关节通常拥有类似于髋关节的2个自由度。然而，由于踝关节在动物行走时的主要作用是调节足部与地面的接触，通常不提供动力。因此，在设计四足机器人时，通常将踝关节设计为被动的弹性关节。


    ![](EPUB/images/image_445.jpg)


    图6-14 四足机器人腿部关节结构


    **2.四足机器人的硬件结构**


    四足机器人的主要硬件结构包括主处理器、电控系统、关节驱动器和执行部件。


    （1）主处理器 主处理器的作用是完成机器人的步态规划、环境感知以及定位导航等任务，它可以被视为机器人的大脑。主处理器需要读取来自机器人搭载的各类传感器的信息，如视觉传感器数据、关节编码器数据和关节转矩等数据，然后融合这些信息以完成机器人的步态规划和路径规划。随后，主处理器将规划好的信息发送给机器人的关节驱动器，以确保机器人能够稳定地行走并躲避障碍。对于简单的机器人，可以使用单片机、现场可编程门阵列（Field
    Programmable Gate Array，FPGA）等小型处理器；对于大型的复杂的四足机器人，通常需要搭载高性能的处理器，如Intel系列处理器，它们具备高速运算和搭载操作系统的能力。


    （2）电控系统 电控系统的作用是为机器人的各个部件提供所需的能源。一个精心设计的电控系统能够确保机器人能够长时间安全地运行。


    （3）关节驱动器和执行部件 关节驱动器和执行部件是机器人的关键组成部分，它们实际上是机器人的肌肉。这些部件的设计目标是能够输出足够的转矩，以推动机器人的运动关节。为了实现这一目标，通常在执行器和关节之间加入减速箱，将高速低转矩的执行器（如电动机）的输出转化为低速大转矩的关节输出。减速箱应尽量确保低减速比，以降低能量损耗并提高输出精度。此外，执行器和减速箱的整体设计体积也需要尽量小，例如ANYmal机器人的减速箱和伺服电动机。在机器人的关节驱动器接收到主处理器发送的运动信息后，为了实现高精度、低延迟的执行，执行部件的性能非常重要，其中关键是高转矩密度和高功率密度。例如，MIT自主研发的猎豹系列电动机，可以达到33N·m的转矩而质量仅1kg。然而，国内制造的电动机通常难以满足机器人高速运动所需的性能指标。'
  fmt: '

    # 四足机器人发展与控制


    在接下来的20年间，一些重要的理论研究都在NASA和美国陆军的资助下进行。波兰工程师M.G.Bekker在美国陆军坦克汽车（US Army Tank-Automotive）公司的研究尤其值得关注。这些研究工作为通用行走卡车（GE
    Walking Truck）的发展提供了关键推动力。通用行走卡车是一种庞大的机器人，全长达3m，总重达1400kg，由一个90马力（1马力=735W）的内燃机驱动。操作员坐在机器人上，需要同时控制众多手柄和踏板。尽管项目负责人声称只需接受20h的培训，人们就能熟练地驾驶这台机器人，但南加州大学的R.McGhee敏锐地认识到，这台机器人的操作过于复杂，因此需要一套自动化的循环操作系统来替代操作员。


    1966-1969年间，Bucyrus-Eire公司建造了史上最大的足式机器人——Big Muskies。这台机器人是专门为露天矿山作业而设计的，重达13500t，并且速度能够达到270m/h。Big
    Muskies的成功证明了Hutchinson的构想是可行的。令人惊讶的是，它一直工作到了1991年。


    1966年，McGhee和A.A.Frank合作制造了一台名为Phony Pony的中型四足机器人，如图6-3所示，这台机器人的每条腿都有两个自由度，并由电机驱动。机器人的脚采用了倒T形结构，控制系统是一个具有六种同步状态的状态机，能够控制机器人进行爬行或对角小跑。


    ![](EPUB/images/image_434.jpg)

    图6-3 Phony Pony机器人


    Phony Pony的研究激发了McGhee去创建一些在步行机器人历史上具有重要地位的机器，包括OSU六足机器人和自适应悬挂车辆（ASV），如图6-4所示。


    ![](EPUB/images/image_435.jpg)

    图6-4 OSU六足机器人和自适应悬挂车辆（ASV）


    OSU六足机器人建于1977年，是第一台由计算机控制的行走机器人。它的腿采用了昆虫腿的设计，由电机驱动三个旋转关节。该机器人成为大量步态生成、机器人控制、力分配算法的实验平台。1986年，McGhee与Waldron合作建造并测试了ASV六足步行机，可能是有史以来建造的最大和最特别的地形适应性行走机器人。


    1983年，Odetics发布了ODEX I。这个机器人并没有提供任何重要的科学贡献，但是作为第一台商业化的足式机器人，它也被列入了里程碑。该系列中的一个先进的版本被用于检查核电站。


    以上所有提到的机器人基本上都属于静态稳定的系统。第一台具备行走、奔跑且完全动态稳定的四足机器人是由麻省理工学院的M.Raibert（1986年）开发的。


    大多数研究人员最初关注静态稳定性，然后才涉足动态系统的研究。但M.Raibert的研究路径与常规相反。作为一位学院派的创业者，他获得了麻省理工学院的博士学位后，创立了卡内基梅隆大学的CMU腿部实验室，并担任副教授。1986年，M.Raibert返回麻省理工学院，继续从事机器人的研发和研究。他坚信，首先应该解决单腿机器人的动态稳定问题，然后再将这些原理应用到具有两条、四条或更多腿的机器人上。最终，他成功实现了这一目标，并创立了波士顿动力公司。在随后的30多年中，波士顿动力公司一直处于全球足式机器人领域的领先地位。


    ## 1. Big Dog：踹不倒的机器人


    2005年，Big Dog的发布就已经让波士顿动力公司名震一方，如图6-5所示。


    Big Dog的身高约为1m，重约109kg，能够背负45kg的有效负载并自由行走或奔跑。其最高移动速度可达6.4km/h，最大爬坡角度可达35 °。此外，Big
    Dog还能够适应多种复杂路况，包括雪地和泥洼，即便受到侧向外力的干扰，也能够迅速调整四肢动作以保持稳定，避免摔倒。这些卓越的性能得益于其精密的设计结构和精心规划的计算系统。


    ![](EPUB/images/image_436.jpg)

    图6-5 Big Dog


    Big Dog的设计灵感来自四足哺乳动物的身体结构，其机械组件经过精心组装。四肢拥有关节型结构，能有效地吸收冲击力，提供减振效果。整体机器拥有16个自由度，允许在横向和纵向两个方向自由运动。此外，Big
    Dog由一台汽油发动机提供动力，发动机驱动液压系统，通过液压系统输出动力并控制每个肢体的运动，从而实现了身体的高度灵活性。


    Big Dog搭载的运动控制系统有效确保了机器人的自主运动，几乎不需要人工干预即可完成既定任务。这一运动控制系统使用传感器安装在关节和足底等位置，用于监测肢体状态信息。陀螺仪和惯性传感器有助于监测身体平衡稳定信息，使系统能够迅速响应任何平衡干扰，保持重心稳定，从而使机器人保持平衡并前进。


    同时，Big Dog还具备出色的导航智能性。它可以通过激光雷达和立体视觉传感器独立感知周围环境，构建虚拟地形模型，并使用搭载的计算机进行路径规划。它依赖运动控制系统沿着规划路径前进，直至达到目标点。


    尽管Big Dog拥有强大的功能，但由于其运行过程中噪声较大，最终没有被美国军方采用。


    ## 2. LS3：能担能抗的大力士


    LS3又被称为“阿尔法狗”，其中LS是Legged Squad的缩写。LS3机器人是波士顿动力公司继Big Dog之后推出的一款四足机器人，于2012首次公开亮相。与Big
    Dog相比，LS3的体型更为庞大，负载能力更强，移动速度也更快，实用性能有了大幅提升，如图6-6所示。


