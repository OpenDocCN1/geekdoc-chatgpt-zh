    **1.机械臂正运动学模型**


    机械臂运动学包括机械臂正运动学和机械臂逆运动学。机械臂正运动学，即已知机械臂各个关节的旋转角度，求机械臂末端执行器最终的位置和姿态。根据上述讨论可知，将各个关节的旋转角度代入式（5-3）中即可求得末端执行器的位姿。


    以图5-13所示的UR5机械臂为例，首先分别将DH参数代入式（5-2）中，得到关节之间的变换矩阵为


    ![](EPUB/images/image_358.jpg)![](EPUB/images/image_359.jpg)


    因此，最终的变换矩阵为


    ***T***\=***A***[1]***A***[2]***A***[3]***A***[4]***A***[5]***A***[6]


    **2.机械臂逆运动学模型**


    机械臂逆运动学，即已知机械臂末端执行器的位置和姿态，反求机械臂各个关节的旋转角度。机械臂逆运动学求解一般有解析法和数值法两种方法。解析法就是通过几何分析、代数运算等手段解方程组来得到最终的解。这种方法一般速度快、精度高，且能得到所有的解。但由于不同机械臂的DH参数不同，得到的变换矩阵也不同，因此解析法的通用性比较差，需要针对具体的机械臂构建不同的逆运动学解析表达式。


    与解析法不同，数值法求出的解往往都是近似解。数值法又可以分为迭代法和优化法。迭代法主要基于微分运动学思想，通过这种方法，机械臂从初始位置一步步运动到目标位置。优化法通常是定义一个优化函数，然后通过优化算法来完成特定约束条件下的求解。优化算法主要包括遗传算法、粒子群优化以及一些基于神经网络或机器学习的方法等。理论上讲，基于优化思想的逆运动学求解方法可以达到通用的程度。但由于数值处理过程中累积计算误差以及矩阵奇异、矩阵条件数过大等因素的存在，这些方法可能在某些情况下失效。


    数值法的适用性虽然比较广，但求解过程比较慢，求出的解的精度和稳定性也比较差。因此，在实际应用过程中，更常用的做法是根据具体的机械臂构建解析表达式求解，这在求解速度和稳定性上都更容易达到应用要求。在科学研究中，速度快、精度高、适用性广的求解方法一直以来都是研究者感兴趣的课题之一，至今仍有很大的研究空间。


