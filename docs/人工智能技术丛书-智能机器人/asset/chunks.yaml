    图5-31 像素坐标系*O*[0]和图像坐标系*O*[1]


    如图5-31所示，假设每一个像素在*u*轴和*v*轴方向上的物理尺寸为d*x*和d*y*，即感光芯片上像素的实际大小，图像中心点为（*u*[0]，*v*[0]），则点（*x*，*y*）在像素坐标系中的坐标为


