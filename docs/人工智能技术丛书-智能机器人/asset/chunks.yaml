    图 3-49 VL53L0X 微型激光测距模块


    根据激光雷达实现对场景的扫描是否依赖机械部件，可将其分为机械激光雷达和固态激光雷达。目前，机械激光雷达仍然占据主流地位，而固态激光雷达则被认为是未来的趋势。机械激光雷达具有控制激光发射角度的旋转部件，而固态激光雷达则通过光学相控阵列、光子集成电路以及远场辐射方向图等电子部件来控制激光的发射角度。然而，纯固态激光雷达对技术力的要求高，相对而言机械激光雷达因为发展较早、技术相对成熟，因此出现了一批基于转镜方案、微振镜方案、棱镜方案的混合固态激光雷达（或者称为半固态激光雷达）。机械激光雷达与混合固态激光雷达的区别见表
    3-8。


    表 3-8 机械激光雷达与混合固态激光雷达的区别


    ![](img/image_222.jpg)


    机械运动通常需要设计相应的机械部件并且需要足够大的预留空间，所以机械式激光雷达通常体积大，相对而言混合固态激光雷达体积会小一点。


    激光雷达根装测距原理可以分为 TOF（包括直接测距 DTOF、脉冲测距 PW-ITOF 和连续波测距 CW-ITOF）和调频连续波（Frequency Modulated
    Continuous Wave，FMCW）。FMCW 激光雷达使用连续发射的调频连续波激光束，该激光束的频率在一段时间内连续变化（调频），当激光束照射到目标物体并返回时，通过测量频率变化的差异来计算目标物体的距离。FMCW
    激光雷达的代表公司主要有 Mobileye、Aeva、Blackmore 等，而 TOF 路线是大多数厂商采用的技术方案。激光雷达的发射部件和接收部件在同一系统中的工作原理示意图如图
    3-50 所示。激光通过扫描器单元形成光束角度偏转，光束与目标作用形成反射/散射的回波。当接收端工作时，可产生原路返回的回波信号光子到达接收器，接收端通过光电探测器形成信号接收，经过信号处理得到目标的距离、速度等信息或实现三维成像。


