    14）“天问”和“MVR-1号”人形机器人。武汉大学研发了两款人形机器人，其中武汉大学工业研究院研发的“天问”机器人（见图7-19a）高1.7m，重65kg。整个机器人有36个自由度，其中灵巧手的自由度就高达7个。灵巧性与可操作性是衡量机器人灵活性和功能性的重要指标。“天问”的柔性手指以腱绳驱动，简单灵巧，不仅能够实现对脆弱物品的柔性抓取，还能针对不同尺寸、外形、材质的物体调整抓取姿态和最佳力度。


    武汉大学机器视觉与机器人实验室研发的“MVR-1号”人形机器人（见图7-19b）包含19个自由度。这款机器人小脑采用双螺旋架构强化学习控制模型，能有效模仿人的步态，适应多种复杂地形的行走；这款机器人大脑采用多模态大模型辅助的具身智能感知和认知框架，高效执行场景理解和任务分解与规划。


    ![](EPUB/images/image_565.jpg)


    图7-19 武汉大学“天问”人形机器人和“MVR-1号”人形机器人


    2024年3月，英伟达展示了多模态人形机器人通用基础模型GROOT，可作为机器人的大脑。GROOT驱动的机器人能够理解自然语言，通过观察人类行为来快速学习，显示了人形机器人在认知智能方面的巨大潜力。


    人形机器人发展浪潮迅猛，机器人正从简单的自动化任务执行者转变为能够进行复杂决策和交互的智能系统。大模型和深度学习技术的整合是推动这一进步的核心，这些技术使机器人能够更好地理解和适应复杂的环境，执行更为复杂的任务。人形机器人的发展正向着更高自主性、更强交互能力和更广泛的应用场景迈进。在全球范围内，美国和中国在人形机器人的研发和应用方面居于领先地位，主要发展面向工业和服务行业的机器人，展示了其实用性和多功能性。同时，欧洲和日本也在此领域显示了强烈的创新意识，尤其是在提高机器人自主性和安全性方面进行了许多突破性的研究。


    **7.2.2**


    **国家政策和战略**


    各国政府在推动人形机器人技术的发展方面采取了不同的政策和战略，这些政策不仅影响了技术的进步速度，还塑造了机器人技术的应用领域和市场趋势。


    （1）美国 美国在人形机器人的研发和应用方面采取了多层次的策略，这些策略涵盖了从联邦政府到私营部门的广泛支持和资助，旨在保持其在全球人形机器人技术领域的领先地位。美国政府通过多个机构，如国防高级研究计划局（DARPA）和国家科学基金会（NSF）提供资金支持，推动人形机器人技术的基础研究和开发。美国政府积极推动与私营企业和学术界的合作，通过公私合作伙伴关系（PPP）模式，促进人形机器人技术的创新和商业化。美国通过各种机制促进大学和研究机构的创新成果向企业转移。联邦技术转移计划（Federal
    Technology Transfer Program）和小型企业创新研究计划（SBIR）支持小企业与国家实验室和大学合作，开发和商业化新技术。美国强调高等教育体系在人形机器人技术领域的重要作用，多所领先的大学，如麻省理工学院（MIT）、斯坦福大学和加州大学伯克利分校等都设有先进的机器人研究项目，培养未来的机器人技术专家。美国积极参与国际机器人技术的标准制定和政策对话，以确保其技术和产品能够在全球市场中保持竞争力。通过国际标准组织和多边论坛，美国推动了关于人形机器人安全、伦理和互操作性的国际标准制定。


    （2）中国 我国对人形机器人技术的发展给予高度重视，并制定了一系列国家策略来推动此领域的科技创新和产业成长。这些策略包括政策支持、资金投入、产学研合作等多个方面，目标是在全球范围内建立技术和市场的竞争优势。


    2023年10月，工业和信息化部印发的《人形机器人创新发展指导意见》指出，以大模型等人工智能技术突破为引领，在机器人已有成熟技术基础上，重点在人形机器人“大脑”和“小脑”、“肢体”关键技术、技术创新体系等领域取得突破。突破关键技术包括：


    **●打造人形机器人“大脑”和“小脑”。**开发基于人工智能大模型的人形机器人“大脑”，增强环境感知、行为控制、人机交互能力，推动云端和边缘端智能协同部署。建设大模型训练数据库，创新数据自动化标注、清洗、使用等方法，扩充高质量的多模态数据。科学布局人形机器人算力，加速大模型训练迭代和产品应用。开发控制人形机器人运动的“小脑”，搭建运动控制算法库，建立网络控制系统架构。面向特定应用场景，构建仿真系统和训练环境，加快技术迭代速度，降低创新成本。


    **●突破“肢体”关键技术。**用好现有机器人技术基础，系统部署“机器肢”关键技术群，创新人体运动力学基础理论，打造仿人机械臂、灵巧手和腿足，突破轻量化与刚柔耦合设计、全身协调运动控制、手臂动态抓取灵巧作业等技术。攻关“机器体”关键技术群，突破轻量化骨骼、高强度本体结构、高精度传感等技术，研发高集成、长续航的人形机器人动力单元与能源管理技术。


    我国强调构建完整的人形机器人产业链，从基础材料、核心组件到高端制造设备。政府支持行业内的技术创新，包括新材料的开发、高精度传感器、智能控制系统等。同时，通过建立产业园区和创新中心，促进产学研用紧密结合，加速技术成果的产业化。


    （3）加拿大 加拿大已经认识到人形机器人技术在未来经济和社会发展中的重要性，并采取了一系列策略来推动该领域的增长。加拿大的策略不仅着重于技术创新，还包括培养相关技术人才、支持创新生态系统的发展，以及鼓励公私合作。加拿大鼓励建立技术创新生态系统，支持各种科技创业孵化器和加速器项目，如马赛克制造创新中心（MaRS
    Dis covery District），这些机构提供资源、指导和资金，帮助初创企业和研究团队将人形机器人技术转化为实际产品。


    （4）瑞士 瑞士在人形机器人技术发展方面采取的策略突出了其在精密工程、自动化技术以及创新驱动的教育系统的长期投资。瑞士在制造、医疗和服务行业拥有强大的工业基础，政府鼓励这些行业与机器人技术领域的协同发展。瑞士积极参与国际机器人技术和人工智能的研究项目和合作。瑞士政府通过提供资金、税收优惠和创业支持服务来促进创新和技术商业化。


    （5）日本 长期以来，日本在人形机器人技术上一直处于领先地位，重点发展用于服务业和娱乐业的人形机器人，如Honda的Asimo和SoftBank的Pepper。日本政府支持通过政府资助的研发计划和与学术机构的合作来推动技术创新。


    （6）欧洲 欧盟在推动人形机器人技术的发展方面采取了一系列综合性策略，旨在通过促进技术创新、国际合作和规范立法等多个维度，加速人形机器人技术的研发和市场应用。重点在于提升机器人的自主性、安全性和伦理性，强调人机协作和机器人技术的可持续发展。


