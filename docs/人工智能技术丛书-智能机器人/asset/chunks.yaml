    ## 5）归纳整理后的单腿逆运动学方程为


    ![](img/image_473.jpg)


    先通过 D-H 法解出正运动学各关节的变换矩阵，再通过各关节的变换矩阵反解出各关节对应的角度，至此四足机器人的单腿逆运动学模型建立完毕。可以通过机器人足端的位置和
    D-H 参数，计算出机器人每个关节输入的角度。


    ## 4.四足机器人的腿部雅可比矩阵推导


    ### （1）雅可比矩阵作用

    雅可比矩阵属于运动学的范畴。在机器人运动学模型中，雅可比矩阵用于将关节的速度转换为有关点（如末端执行器）的速度。雅可比矩阵与关节角相关，若关节角度发生变化，雅可比矩阵各元素的大小也随时间变化。


