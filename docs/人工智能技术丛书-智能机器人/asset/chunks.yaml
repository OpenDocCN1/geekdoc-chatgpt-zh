    ### 4. Flash激光雷达


    Flash激光雷达采用类似照相机的工作模式，感光元件与普通相机不同，每个像素点可以记录光子飞行时间信息。发射的面阵激光照射到目标上，目标对入射光产生散射，由于物体具有三维空间属性，从而照射到物体不同部位的光具有不同的飞行时间，被焦平面探测器阵列探测，输出为具有深度信息的“三维”图像。Flash激光雷达原理如图3-59所示。


    ![](EPUB/images/image_232.jpg)


    图3-59 Flash激光雷达原理


    代表性的Flash激光雷达有Ouster公司的OS系列产品。以往采用机械旋转式激光雷达的自动驾驶公司的感知算法是专门针对该类雷达进行开发的，当替换成固态激光雷达后，其相应的感知算法需要推倒重来，传感器方案也要重新考虑，这在某种程度上带来了很大的技术迁移难度。旧金山激光雷达公司Ouster将这种形态的产品称为数字激光雷达（Digital
    Li-DAR），这家公司已经将这一概念转化成了实际的产品。数字激光雷达就是对激光雷达进行全半导体化的设计，将原来激光雷达产品内部的发射器、接收器等上千种光电器件固化到芯片之中，实现了固态的形式。在此基础上，Ouster在激光雷达内部加入了旋转装置，让其能够在360°方向上实现扫描，即旋转起来的固态激光雷达。OS系列激光雷达如图3-60所示。


