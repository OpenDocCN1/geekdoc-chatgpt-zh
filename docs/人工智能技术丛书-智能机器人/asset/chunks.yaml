    # 5.3 UR 机械臂抓取实例


    本节主要介绍坐标系统的转换、配置 UR 机械臂以及机械臂抓取的实现三部分内容。


    ## 5.3.1 坐标系统的转换


    一般来说，UR 机械臂控制分为识别和操纵两个部分。识别部分主要是通过识别算法获取物体的像素坐标，但操纵机械臂往往需要的是物体在世界坐标系下的三维坐标，因此，这就涉及坐标系之间的转换。


    坐标系转换通常是在以下四个坐标系之间进行：像素坐标系（`u`，`v`）、图像坐标系（`x`，`y`）、相机坐标系（`x[c]`，`y[c]`，`z[c]`）和世界坐标系（`x[w]`，`y[w]`，`z[w]`）。


    ### 1.像素坐标系和图像坐标系


    像素坐标系是以图像左上角的顶点为坐标原点，从原点出发，水平方向的直线为`u`轴，垂直方向为`v`轴。像素坐标系的坐标值是离散的。


    图像坐标系以图像中心为坐标原点，水平方向为`x`轴，垂直方向为`y`轴。图像坐标系的坐标值是连续的，如图 5-31 所示。


    ![](img/image_396.jpg)


    图 5-31 像素坐标系`O[0]`和图像坐标系`O[1]`


    如图 5-31 所示，假设每一个像素在`u`轴和`v`轴方向上的物理尺寸为`d x`和`d y`，即感光芯片上像素的实际大小，图像中心点为（`u[0]`，`v[0]`），则点（`x`，`y`）在像素坐标系中的坐标为


    ![](img/image_397.jpg)


    用矩阵形式表示为


    ![](img/image_398.jpg)


    ### 2.图像坐标系和相机坐标系


    从相机坐标系到图像坐标系，是从 3D 转换到 2D，属于透视投影关系，图像坐标系`O[1]`和相机坐标系`O[c]`如图 5-32 所示。


    ![](img/image_399.jpg)


    图 5-3 2 图像坐标系`O[1]`和相机坐标系`O[c]`


    在图 5-32 中，`f`为焦距，`M`为相机空间中一点，`m`为`M`投影到图像上的点，根据三角形相似原理，有


    ![](img/image_400.jpg)


    用矩阵形式表示为


    ![](img/image_401.jpg)


    ### 3.相机坐标系和世界坐标系


    世界坐标系和相机坐标系之间的变换属于刚体变换，即物体不会发生形变，只需要进行旋转和平移。


    （1）旋转 如图 5-33 所示，坐标轴`Oxyz`绕`z`轴旋转`θ`角后得到坐标轴`Ox′y′z′`，假设点`P`在`Oxyz`下的坐标为`P`（`x`，`y`，`z`），在`Ox′y′z′`下的坐标为`P`（`x′`，`y′`，`z′`），则两者之间满足以下关系


    `x = x′ cos θ - y′ sin θ`


    `y = x′ sin θ + y′ cos θ`


    `z = z′`


    用矩阵形式表示为


    ![](img/image_402.jpg)


    同理，绕`x`轴和`y`轴旋转`φ`和`ω`，可得到


    ![](img/image_403.jpg)


    于是可以得到旋转矩阵`R = R[1] R[2] R[3]`。


    ![](img/image_404.jpg)


    图 5-33 坐标轴的旋转（绕`z`轴）


    （2）平移 上述所说的旋转无论绕哪个轴转，坐标原点都是不变的，但加上平移后，坐标原点就会发生改变了。


    如图 5-34 所示，假设点`P`在相机坐标系`O[c]`下的坐标为`P`（`x[c]`，`y[c]`，`z[c]`），在世界坐标系`O[w]`下的坐标为`P`（`x[w]`，`y[w]`，`z[w]`），偏移矩阵为`T`，则有


    ![](img/image_405.jpg)


    因此，通过上面四个坐标系的转换可以将一个点从世界坐标系转换到像素坐标系，即


    ![](img/image_406.jpg)


    其中，最右边等式的第一个矩阵为相机内参，第二个矩阵为相机外参。一般深度相机（如`realsense D435i`）的内参可以通过官方提供的 API 直接获取，相机外参可以通过手眼标定得到。


    ![](img/image_407.jpg)


    图 5-34 坐标轴的旋转和平移


    通过以上公式，就可以将世界坐标系下的一个三维点转换成图像上对应的像素点。同样，对于深度相机来说，也可以轻易地将图像中的一个像素点转换成世界坐标系下的三维点，因为深度相机可以从图像的深度图中获取对应像素点的深度值，也就是`z[c]`值。但是对于非深度相机来说，由于并不知道等式左边的`z[c]`值，所以通过图像中的一个像素点是不容易得到它在世界坐标系下的三维点的。


    ## 5.3.2 配置 UR 机械臂


    要实现机械臂抓取需要在 PC 主机上安装机械臂驱动和夹爪驱动，除此之外，还需要在示教器上安装相关的配置文件，这样才能和真实机械臂进行通信。以下提到的 UR
    机械臂型号为 UR5，Robotiq 机械爪型号为`Robotiq2f-85`。


    ### 1.安装 UR 机械臂 ROS 驱动


