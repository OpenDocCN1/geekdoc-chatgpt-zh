    ## 条纹编码结构光系统


    条纹编码结构光系统利用正弦分布的灰度值和相位差信息对空间进行编码。在该系统中，水平方向上的灰度值呈现正弦分布，其中波峰对应最亮点（白色），波谷对应最暗点（黑色）。同时，通过对参考平面和物体进行成像，可以获取相位差信息。条纹编码结构光系统会两次或多次成像以获取准确的相位差信息，以两次成像为例（图
    3-29b）：第一次成像是对参考平面进行成像（图中`ABQ`所在的平面），第二次成像是对参考平面以及在参考平面上的物体进行成像（对图中的`P`点进行成像）。对比两次成像差异信息（相位差），利用条纹信息（投影仪投射光的波长`λ`等）以及相位差解算出视差`b`，进而求得待测点三维空间坐标，这里同样利用了三角形相似的相关结论。这里得到相位-高度模型如下：


    ![](img/image_188.jpg)


    在利用不同相位的条纹三次（或多次）成像时则需要利用相应的三步相移（或其他）方法进行相位解算。


    ### 散斑结构光系统


    此外，还可以利用投影仪投射具有一定分布的条纹编码图案的结构光，如散斑结构光。散斑结构光系统包括发射和接收两个部分，如图 3-30a 所示。TX（Transmitter）部分：发射组件，通常包括一个光源和一个投影系统；如图
    3-30b 所示，多个入射激光光点经过 DOE 结构（光栅）进行复制，形成具有一定分布的条纹编码图案。


    ![](img/image_189.jpg)


    图 3-30 散斑结构光系统与发射组件 TX


    RX（Receiver）部分：接收组件。接收组件用于接收从场景中反射回来的结构光。这些反射光会携带场景表面的形状和深度信息。接收组件可以是一个相机或其他光学传感器。图像采集系统会记录这些反射光的信息，包括条纹编码的图案和其在场景上的变形。RX
    结构如图 3-31 所示。


    ![](img/image_190.jpg)


    图 3-31 散斑结构光系统发射组件 RX 结构


    散斑结构光系统的工作流程如图 3-32 所示。


    ![](img/image_191.jpg)


    图 3-32 散斑结构光系统的工作流程


    激光投射装置投影仪向测量空间内投射散斑场图像，当没有待测物体时，会向一个参考平面投射散斑，相机成像得到平面参考图。当有测量物体时，散斑投射到物体上，由于待测物体有一定的深度分布，散斑在这些位置就被这些深度所调制，然后成像得到场景
    IR 图。由视差图得到深度图，最终得到点云（对应物体各点的三维空间坐标），这个过程即对应世界坐标系与像素坐标系的转换。


    散斑结构光系统中的散斑分布在不同位置上的确是不一样的，而且一个散斑可以编码整个空间而不仅仅是一个点的三维坐标，这意味着即使在没有散斑的区域，由于周围区域存在散斑，理论上也可以解算出对应的三维信息。散斑结构光系统中散斑的分布是基于散斑干涉现象产生的，而散斑干涉的结果受到物体表面形状和光的干涉引起的相位变化的影响。散斑分布的随机性导致了每个散斑与特定的空间位置之间存在着一对一的映射关系，这使得散斑结构光系统能够对场景中的不同位置进行精确的三维测量和重建。


    需要注意的是，散斑结构光系统的设计和算法会考虑到散斑的分布特性以及相位变化的解算方法，以实现准确的三维信息获取。具体的系统实现可能会采用不同的技术和算法来优化结果的准确性和稳定性。


