- pgno: 168
  md: '敏捷原则建议采用以人为中心的方法与客户进行定期联系，但较少关注用户体验和测试等问题。敏捷联盟的网站承认“可用性测试并不是严格意义上的敏捷实践”，但它继续强调了其作为用户体验设计一部分的重要性。


    基于这些敏捷原则，国际商业机器公司推荐使用与数据集相关的敏捷方法来探索数据集，并尽早运行概念验证测试，以确保数据集能够交付预期结果。在必要的情况下，开发人员必须清理错误数据，删除低相关性的数据，并扩展数据以满足准确性和公正性的要求。此外，开发人员还可以通过可用性测试和用户体验设计方法来改进系统。


    微软针对 HCAI 系统提出了一个九阶段的软件工程工作流程，这一流程看似更接近线性瀑布模型而非敏捷方法（图 19.1），但其描述表明团队在执行过程中更加敏捷。微软在整个工作流程中都很注重与客户保持联系。在对微软的
    14 名开发人员和管理人员的采访中发现，他们强调数据收集、清洗和标记，其次是模型训练、评估和部署。该采访报告做出了重要的区分：“软件工程主要是关于构成软件的代码，机器学习则是关于驱动学习模型的数据。”


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_168_0.png)


    图 19.1 微软机器学习项目的九阶段软件工程工作流程


    资料来源：阿梅尔希（Amershi）等人. 2019a。


    HCAI 系统开发人员可以使用瀑布模型，但敏捷方法更常用来在早期接触客户和用户。由于采用瀑布模型或敏捷方法，HCAI 项目不同于传统的编程项目，因为机器学习训练数据集发挥了更强的作用。传统的软件测试方法，例如代码的静态分析，需要使用多个数据集的动态测试作为补充，以检查不同使用环境中的可靠性，并通过用户体验测试来检验用户是否能够成功完成任务。'
