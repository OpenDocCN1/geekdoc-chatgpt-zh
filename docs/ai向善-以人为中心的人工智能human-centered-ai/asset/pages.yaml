  md: "# 第 6 章\n\n# 超越自动化水平\n\n> > 与机器不同，人类的大脑可以创造想法。我们需要理念引导我们前进，也需要工具来实现它们……计算机没有“大脑”，就像音响没有立体声一样……机器只能操作数字，而人们把它们与意义联系起来。\n\
    > \n> > 阿诺·彭齐亚斯（Arno Penzias），诺贝尔物理学奖获得者（1978 年）\n\nHCAI 的二维框架开辟了新的可能性，该框架将自主级别与人工控制级别区分开来。新的指导方针是寻求同时具备“高度的人工控制”和“高度的自动化”的系统，才更有可能开发出可靠、安全、可信赖的计算机应用程序。一旦实现这些目标，尤其是在解决复杂的、人们知之甚少的问题时，将极大地提高人类的表现，同时达成人类的自我效能、创造力、责任感和社交关系等目标。本章将重点关注可靠、安全、可信赖的目标，这些目标的实现有助于实现其他的重要目标，如隐私、网络安全、经济发展和环境保护。\n\
    \n我也相信，计算机的自主性对于许多应用领域来说是有吸引力的。谁不想要一个能够可靠且安全地完成重复或困难任务的自动设备呢？\n\n机器的自主性对于某些任务来说可能很有益，但对于其他任务则很危险。在消费领域的应用中，例如推荐不寻常的电影或标新立异的餐馆，可能会带来新的发现，因此，消费领域的错误风险很低。然而，对于其他任"
