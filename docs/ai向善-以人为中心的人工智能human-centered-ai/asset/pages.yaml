- pgno: 28
  md: '并相信计算机可以在没有人类监督的情况下可靠地运行。虽然越来越多的声音高呼“人机共舞”，但这一短语往往意味着妥协。那些寻求完整、完善系统的人反对人工智能需要人为干预、监督和控制的观点。


    对我来说，一个更有说服力的观点是，人类能够快乐地融入社交网络，而计算机仅发挥辅助作用。人类在他们想要取悦、激励和尊重的上司、同事和员工的社会结构中茁壮成长。人们还希望得到反馈、对自己成就的赞赏，以及关于如何获得更好的辅助性指导。他们使用计算机来增强他们的能力，使他们以称职、安全或非凡的方式工作。这种态度与贴在汽车保险杠上的一句话非常切合，即“人类在群体中，计算机在循环中”（图
    2.1）。这句话提醒我们，人们是社会性的，可以使用计算机来支持他们的表现。


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_28_0.png)


    图 2.1 保险杠贴纸上“人类在群体中，计算机在循环中”的宣传语


    随着人们认识到人类必须对技术进行有意义的控制并明确要对其行为结果负责，技术设计的进展也因此会加速。这种以人为中心的经验主义驱动的战略似乎适合于军事应用，因为军事领域的核心价值是指挥系统中的责任方。


