  md: '外，更具体的项目任务是通过独特的黑白条纹来识别斑马，或通过藤壶、背鳍、吸虫形状和尾巴标记图案来识别鲸鱼。这些创新是有希望成功的，但将研究原型转变为可被大量民间科学家在不同环境下可靠地使用的超级工具仍有待实现。


