- pgno: 258
  md: '# 按社会过程评估


    重大决策或性命攸关的决定往往通过群体决策做出，而群体决策的成员包括：专家（如美国国家运输安全委员会的大多数审查员）和非专家（如对被告的同伴进行审判的陪审团成员）。这些决策过程可以用定性方法和社会过程来补充，例如有组织的讨论、两轮甚至多轮投票、有证据规则的对抗式辩论以及证人的交叉盘问。HCAI
    系统可以从融入内部审查和外部独立监督方法的社会过程中受益。


    招聘委员会常使用社会过程进行评估，委员会使用评分方法来审查众多申请人，从中选出候选人名单进行下一步的面试，并要求独立审查员提供推荐信。面试结束后，委员会可能进行小组讨论，通常是通过投票对候选人进行排名。在学术环境中，论文和拨款提案要经过审查，并附有书面评论，然后小组讨论决定是否接受或拒绝。有时，会议委员会、期刊编辑委员会或资助机构经理会根据多样性要求、政策限制或预算限制来改变决策。


    公司董事会或州立法机构是做出复杂决策的更高级形式，其中，客观的衡量标准和按组成部分的评分是通过充分的商议以产生共识或通过投票进行强制性决策的。


    有些组织采用结构化的流程，例如德尔菲法（Delphi），该方法通过多轮讨论，由专业人员领导，公正地提出立场，即使与常规立场相差甚远。另一种流行的评估方法是
    SWOT 分析，该分析方法关注想法、计划或组织的优势、劣势、机会和威胁。这种简单的四向结构有助于参与者思考他们正在评估的某些特质。


    英国的研究资助机构制定了“研究卓越框架”（REF），以评估大学研究项目的影响。研究卓越框架并未使用诸如发表论文数量、毕业生数量或被引用次数等量化的衡量标准，而是召集了
    34 个不同研究领域的专家小组。'
