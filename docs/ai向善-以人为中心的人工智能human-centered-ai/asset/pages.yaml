  md: '桌上的洗碗机。与清理餐桌并将餐具放入洗碗机的传统家用机器人不同的是，一台小型洗碗机可以安装在餐桌上、餐桌下或餐桌旁，这样独居老年人或老年夫妇就可以简单地将盘子、碗、杯子等餐具放入洗碗机，清洗它们，并随时可以用于下一顿饭。此外，还有适用于露营车的小型洗碗机，有可容纳四口之家的餐具台面，甚至还有适用于四口之家的内置洗碗机餐桌。然而，供一到两个人使用的小型洗碗机只需要容纳两个盘子、两个碗、两个杯子和八个其他器具（图
