- pgno: 178
  md: '# 可解释的用户界面


    HCAI 系统的设计者已经意识到，比如拒绝抵押贷款、假释、求职面试等重要的生活决定，往往会引发受影响者的质疑。为了满足这些合理的需求，系统必须提供易于理解的解释，使人们知道他们需要改变什么，或他们是否应该对决定提出质疑。此外，根据欧盟《通用数据保护条例》对“解释权”的要求，解释已成为许多国家的法律要求。


    《通用数据保护条例》这一要求本身具有争议且含糊不清，难以令大众信服，尽管如此，国际上开发可解释人工智能的研究工作仍然得以蓬勃发展。来自英国信息专员办公室和艾伦·图灵研究所的三份关于“可解释人工智能的决策”的报告是一种实用资源。这三份报告涵盖：①可解释人工智能的基础知识；②可解释人工智能的实践；③可解释人工智能对您的组织意味着什么。第一份报告认为，企业受益于让人工智能变得可解释：“它可以帮助您遵守法律、与客户建立信任并改善内部管理。”该报告详细说明了解释的必要性，描述了做出决定的原因、谁对做出决定的系统负责以及做出公正决定所采取的步骤。除此之外，它还规定应该向用户提供关于如何质疑决定的信息。第二份是最长的一份报告，对不同的解释进行了广泛的讨论，但如果能展示屏幕设计样本和用户测试结果，它会激发更多的自信。


    华盛顿大学的丹尼尔·S. 韦尔德（Daniel S. Weld）和加甘·班萨尔（Gagan Bansal）对可解释性（也被称为可说明性或透明性）提出了一个强有力的说明，它超越了满足用户理解的愿望和提供解释的法律要求。他们认为，可解释性有助于设计师提高准确性、识别训练数据的改进、考虑不断变化的现实、支持用户的控制权并提高用户的接受度。一项对
    22 名机器学习专业人员的访谈研究记录了可解释性对开发人员、测试人员、管理人'
  merge: -1
  img_proc: true
