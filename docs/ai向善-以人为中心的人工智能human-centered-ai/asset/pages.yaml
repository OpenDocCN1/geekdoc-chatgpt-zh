  md: '有价值的数据，以持续改进设计。最重要的是，谦逊是设计师的重要品质，如果他们仔细考虑可能发生的故障，他们会取得更大的成功。


    长期以来，人们一直对使用机器学习、神经网络、统计方法、推荐系统、自适应系统以及应用了语音、面部、图像和模式识别等技术的自主系统充满热情。1978 年，麻省理工学院教授汤姆·谢里丹（Tom
    Sheridan）和他的研究生威廉·维普兰克（William Verplank）制定了从人工控制到计算机自主控制水平的 10 个等级，其中，计算机自主控制是他们心中的核心目标（表
    6.1）。这个被广泛引用的列表一直指导着大部分研发工作，这表明，提高自动化必须以降低人工控制为代价。但这种零和假设限制了人们对提高人工控制和自动化水平的思考，但实际上有更好的解决办法。


    # 表 6.1 被广泛引用的一维自主水平的 10 个等级


    | 等级 | 描述 |

    | :--- | :--- |

    | 10（高） | 决定一切，自主行动，不理人类 |

    | 9 | 仅当计算机决定时才通知人类 |

    | 8 | 仅当被询问时才通知人类 |

    | 7 | 自主执行，必要时通知人类 |

    | 6 | 在自动执行之前允许人类在限定时间内否决 |

    | 5 | 仅当人类批准时才执行 |

    | 4 | 提供一个选项 |

    | 3 | 提供几个选项 |

    | 2 | 提供一套完整的决策 - 行动方案 |

    | 1（低） | 不提供任何帮助，人类必须做出所有决定和行动 |


    谢里丹和维普兰克的 10 级自主水平具有广泛的影响力，但批评者认为它是不完整的，其缺少用户行为的一些重要方面。多年来，该评级已经有了许'
  merge: -1
  img_proc: true
- pgno: 54
  md: '多改进，例如认识到自动化至少有四个阶段：信息获取、信息分析、决定或选择行动、执行行动。我们开始思考，用户是否应该在某些阶段拥有更大的控制权，尤其是在决策阶段。计算机可以向人类操作者提供选择，操作者也有可以选择让计算机执行的选项。这一微妙方法让确定人工和自动化的组合策略方面步入正轨，该组合策略使人类能够控制决策，并在可信赖时支持自动化。人类操作者也可以在下次软件更新时提供额外的选择或说明。


    尽管批评者仍对更多的自动化意味着更少的人工控制这一简单的一维框架提出质疑，但这四个阶段的提出是对一维框架的一个重要改进，有助于维护关于自主水平的观点。本书第
    8 章提出的二维框架可以解放设计思维，从而提高计算机应用程序的自动化程度，同时放大、增强、赋权和提升人类表现，创新地应用系统并创造性地改进系统。


    甚至谢里丹本人也表示担忧：“太惊讶了，已发布的等级描述比我预期的更受重视。”罗伯特·R. 霍夫曼（Robert R. Hoffman）和马特·约翰逊（Matt
    Johnson）提供了一段研究人员如何努力维持自主水平的历史。然而，尽管这个观点受到了许多批评，但一维自主水平的理念（自动化水平的增加必定伴随着人工控制的减少）仍然具有广泛的影响力，例如美国汽车工程师协会对自动驾驶汽车的六个级别的描述（表
    6.2）。更好的方法是，明确哪些功能可以实现自动化（比如避免碰撞、停车辅助）以及哪些活动需要人工控制（比如在被雪覆盖的道路上行驶、传感器故障、执行警察的口头指令）。


    # 表 6.2 自动驾驶汽车的六个级别


    | 等级 | 描述 |

    |---|---|

    | 5 (高) | 完全自主：在所有驾驶场景中，都等同于人类驾驶员 |

    | 4 | 高度自动化：在特定区域和规定的天气条件下，全自动驾驶汽车执行所有生命攸关的驾驶功能 |'
