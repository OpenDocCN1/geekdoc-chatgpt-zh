- pgno: 38
  md: '有一个更高的目标——他们正在“探索创作的集体无意识”的漫漫长路上。


    一些人工智能热衷者希望将知识产权授予制作图像和音乐的计算机算法，但美国版权局规定只能将所有权授予人类或组织。虽然已经做出了类似的努力，但让计算机算法拥有专利，这一决策尚未获得法律批准。争论仍在继续，目前尚不清楚算法将如何捍卫自己的知识产权、支付赔偿金或因侵权而监禁。


    随着时间的推移，我们会更清楚地认识到，人不是计算机，计算机也不是人。随着人们开发出更加宏伟的嵌入式计算机应用程序，作为人们关注对象的计算机将会消失，就像钢铁、塑料和玻璃在很大程度上已经成为我们周围环境中无形的存在一样。即使计算机变得更加强大，计算机智能的概念也将被视为天真和古怪的概念，如同现在的炼金术和占星术一样。


