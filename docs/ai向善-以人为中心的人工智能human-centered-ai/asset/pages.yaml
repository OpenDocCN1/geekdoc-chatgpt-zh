- pgno: 209
  md: '# 独立监督方法


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_209_0.png)


    图 21.1 三种独立监督方法


    规划监督。应提前提交并审核新开发的 HCAI 系统或系统的重大升级的提案，并进行反馈和讨论。规划监督类似于区域规划局，负责审查符合建筑规范的新建筑提案。规划监督的一种变体是算法影响评估，它类似于环境影响的陈述，使利益相关者能够在实施计划之前讨论计划。严格的规划监督需要进行后续审查，以验证计划是否被遵循。


    持续监控。这是一种高成本的监督方法，例如美国食品和药物管理局的检查员在制药和肉类加工厂的持续工作，以及美国联邦储备委员会持续监控大型银行的行为。持续监控的一种形式是定期检查，例如电梯季度检查或上市公司年度财务审计。对
    HCAI 抵押贷款或假释系统的持续监控将会揭示问题，因为申请人资料或环境是不断变化的，例如在新冠疫情期间出现的问题。


    事故回溯性分析。美国国家运输安全委员会对飞机、火车或船只坠毁事故进行了广泛、全面的审查，并提供了详细的报告。同样，美国联邦通信委员会正着手审查社交媒体和网络服务中的
    HCAI 系统，尤其是残障人士的访问权和虚假新闻攻击。美国和世界各地的其他机构正在制定原则和政策，以研究和限制系统故障，其中的一项核心工作是为各种应用程序制定审计跟踪和分析的行业指南。


    怀疑论者指出，独立监督方法的失败，有时可能是因为缺乏足够的独'
