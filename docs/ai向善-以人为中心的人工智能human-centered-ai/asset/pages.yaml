- pgno: 118
  md: '力，并使他们在工作中变得惊人地高效——这正是我们熟悉的超级工具所做的，如显微镜、望远镜、推土机、船只和飞机。数字技术也通过相机、谷歌地图、网络搜索等其他广泛使用的应用程序赋予了人类权利。相机、复印机、汽车、洗碗机、心脏起搏器、暖气、通风和空调系统通常不被描述为队友，而是被视为超级工具或有源设备，它们可以放大、增强、赋权和提升人类的能力。


    人类的创造性：人类操作人员的创造力体现在发现、创新、艺术等方面。科学论文总是由人类撰写，即使使用了强大的计算机、望远镜和大型强子对撞机。尽管在创造过程中广泛使用了先进的作曲技术，艺术作品和音乐作品也归功于人类。而那些在创造性研究中常常被描述的人类品质，如激情、同理心、谦逊和直觉，是计算机难以完全匹配的。


    创造性的另一种表现是赋予计算机系统的人类用户能力、使其能够自行修复、个性化设定和扩展设计，或者向开发人员提供反馈信息，以便开发人员为所有用户做出改进。超级工具、远程机器人等其他技术的持续改进依赖于人类对问题的反馈和对新功能的建议。


    那些推崇“队友”这一隐喻的人往往会陷入制作类人机器人的误区，这在吸引机器人方面有着悠久的历史，但只在娱乐、碰撞测试和医疗人体模型方面取得过成功（详见第 16
    章），我认为这种情况未来也不会发生改变。就类人救援机器人、拆弹装置或管道检查员而言，还存在更好的设计选择。在通常情况下，典型的四轮车或脚踏车通常由人类管理员进行远程操作。


    达·芬奇外科手术机器人并不是我们的队友，而是经过精心设计的远程机器人，使外科医生能够在难以触及的小体腔中执行精细操作（图 14.1）。正如刘易斯·芒福德提醒设计师们的那样，成功的技术与人类形态背离无关。美国直觉外科公司（Intuitive
    Surgical）是达·芬奇系统在心脏、'
