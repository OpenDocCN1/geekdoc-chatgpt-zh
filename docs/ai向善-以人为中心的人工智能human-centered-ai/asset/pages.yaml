  md: '立性，但这种方法的价值得到了广泛的认可。


    总之，明确设计师、工程师、管理人员、维护人员和先进技术用户的责任将提高安全性和有效性，因为这些利益相关者将意识到他们对过失行为的责任。软件工程团队的五个技术实践（详见第
    19 章）是开发可靠系统的第一步。五种管理策略（详见第 20 章）建立在现有策略的基础上，以塑造组织中所有团队的安全文化。本章通过独立监督审查提供了行业内可信赖认证的四种途径，其中知识渊博的行业专家可以将成功的实践从一个组织推广到另一个组织。第
    22 章将描述政府干预和法规。


    # 会计师事务所对 HCAI 系统进行外部审计


    美国证券交易委员会要求公开交易企业的内部和外部年度审计报告，审计结果将在美国证券交易委员会网站以及公司年度报告上公布。该委员会要求使用公认的会计准则，这一准则被广泛地认为能够限制欺诈行为，并为投资者提供更准确的信息。然而，大规模的失败，如安然公司（Enron）和世界通信公司（WorldCom）的问题等，催生了
    2002 年的《萨班斯－奥克斯利法案》（Sarbanes - Oxley Act），也被称为《企业和审计问责、责任和透明度法案》，但请记住一点，没有哪个体系可以完全地防止渎职和欺诈现象。关于
    HCAI 项目报告的新规定，如对公正性以及用户体验测试结果的描述，可以标准化并强化报告方法，从而通过允许企业之间的比较来增加投资者的信任。


    独立的财务审计公司可以对企业财务报表进行分析，以证明其准确、真实、完整，从而为企业的 HCAI 项目制定审查策略，为投资者提供指导。此外，审计公司还会向客户公司提出改进建议，且经常与内部审计委员会建立密切的关系，因此，审计公司的建议将极大可能得到实施。'
