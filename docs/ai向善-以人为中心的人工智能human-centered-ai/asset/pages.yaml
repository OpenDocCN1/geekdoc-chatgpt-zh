- pgno: 11
  md: '感与成就感。除了个人体验之外，HCAI 还能更好地保护隐私安全、拦截错误信息和反击恶意行为者。人工智能与 HCAI 系统所带来的威胁是一个合理的担忧——任何赋予人们行善的技术也会赋予那些作恶的人权力。利益相关者可采取一系列策略，如谨慎设计的控件、审计跟踪和监督自治等，以实现一个可靠、安全、可信赖的系统。


    本书将结合大量示例来逐步讲解最新的 HCAI 实现方法，以指导研究人员、开发人员、商业领袖和政策制定者。本书将提供一种 HCAI 框架，以指导创新，推进以人为中心的管理架构。造福人类成为创造更强大的超级工具、远程机器人、有源设备以及控制中心的原动力，这些工具能赋予用户非凡的能力。


    用全新的视角重塑既定信念是最有力的变革工具之一，它可以解放研究人员和设计人员的固有思想，并在其基础上适应新的理念。许多欣然接受人工智能技术的人开始接受 HCAI
    的思想，即对以人为中心的思想持开放态度。我希望，以传统人工智能技术为中心的群体在取得如此多重要突破的同时，也能接受以人为中心的观点，它为人类的命运带来了不同的视角。以人为中心的策略将通过提供满足人类需求的产品和服务，为人工智能带来更广泛的接受度和更大的影响力。通过鼓励人们充满激情地投身于赋权于人、丰富社区、激发希望的工作之中，HCAI
    为人类提供了一种重视人权、正义和尊严的未来技术愿景。'
