    级的达成可能需要对人员进行统一的使用工具和流程培训，保证其在团队中的一致性，而 3 级可能需要重复使用工具和流程，并对工具和流程的有效性进行审查、改进，以满足应用领域的要求和组织风格。评估包括数据的偏差测试、HCAI
    系统的验证和确认、性能用户体验测试以及对客户投诉的审查。4 级可能需要测量 HCAI 系统的性能和开发人员的表现，并分析审计跟踪以了解故障和未遂事件是如何发生的。5
    级则需要在多个组间重复度量，并随着时间的推移持续改进并进行质量控制。


