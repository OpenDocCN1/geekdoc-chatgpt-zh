  md: "# 第 23 章\n\n# 总结及怀疑者的困境\n\n> > 一旦算法——尤其是机器人技术——在世界上产生影响，就必须对其进行监管，其程序员必须为其造成的危害承担道德和法律责任……只有具有足够专业知识和能力的人类审查人员才能发现、消除和转移大部分危害。\n\
    > \n> > ——弗兰克·帕斯夸莱（Frank Pasquale），《机器人新定律》（New Laws of Robotics）\n\n以人为中心的人工智能系统代表了一种新的跨领域交叉方法，提高了人类表现和人类经验的重要程度。为创建可靠、安全、可信赖的系统，15\
    \ 条管理架构方面的建议将使设计师能够将广泛讨论的道德原则转化为大型组织的专业实践，并附有明确计划。这 15 条建议被总结为管理架构的四个层面：基于成熟的软件工程实践的可靠系统；通过业务管理策略营造的安全文化；通过独立监督获得可信赖的认证；政府机构的监管（图\
    \ 18.2）。\n\n这些不同的关注点意味着可以吸引来自不同学科的研究人员和从业人员，从而更有可能取得成功。如果行业领导者超越对公正、透明、问责、安全和隐私的积极声明，支持具体的实践，并成功地解决许多观察人士的真正关注点问题，那么\
    \ HCAI 系统将受到欢迎。公正说起来容易，但很难保证，尤其是在不断变化的使用环境下。透明度可以通过允许访问代码来展示，但是实际程序的复杂性使得人们难以知道或不可能知道程序将完成"
  merge: -1
  img_proc: true
- pgno: 229
  md: '什么。除了防止故障之外，企业领导人还应该致力于提高人类的自我效能、鼓励创造力、明确责任并促进社交关系。领导人应该认识到，公正、透明等其他属性是竞争优势，未来将越来越受重视。


    拟定的治理结构将面临诸多挑战。没有哪个行业会把所有的 15 条建议落实到这四个层面。每项建议都需要研究和测试以验证其有效性，并根据每项建议实施的实际情况进行改进。此外，真实的
    HCAI 系统组件来自不同的供应商，这意味着一些建议可针对组件完成，如软件、数据和用户体验测试，但对于一个完整的系统来讲可能更困难。正规方法和全面测试可能适用于安全气囊展开的算法，但独立的监督审查可能与自动驾驶汽车系统更相关。


    正如每个家庭会随着时间的推移而不断发展一样，HCAI 系统将适应不断变化的愿望和需求。适应性将整合新的 HCAI 技术、不同应用领域的需求以及所有利益相关者不断变化的期望。


    联合国国际电信联盟及其 35 个联合国伙伴机构的活动证明了全球对 HCAI 系统的兴趣。他们寻求将人工智能应用于 17 个有影响力的联合国可持续发展目标，所有这些目标都将技术发展与行为改变相结合，以改善医疗、健康、环境保护和人权。经济合作与发展组织的政策观察站、迈克尔·杜卡基斯人工智能和数字政策中心跟踪了全球在
    HCAI 系统方面所做的努力，该中心每年发布一份社会契约指数，其记录了 25 个国家为 HCAI 系统推行民主政策的情况。


    人们对道德、社会、经济、人权、社会正义和负责人设计的巨大兴趣，对于那些希望看到 HCAI 应用于社会公益和保护环境的人来说，是一个积极的迹象。怀疑者担心，糟糕的设计将导致失败、偏见、隐私侵犯和不受控制的系统，而恶意行为者将滥用人工智能的权力来传播虚假信息、威胁安全、扩大网络犯罪、扰乱公共事业服务。在讨论致命性自主武器系统、民'
