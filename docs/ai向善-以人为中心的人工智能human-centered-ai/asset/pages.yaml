    用于移动设备的应用程序 Seek 旨在启发孩子们观察共享世界里的植物和生物，识别并更多地了解它们（图 24.1）。该应用程序是 iNaturalist 应用程序和网站的儿童版本，但与
    iNaturalist 不同的是，Seek 不需要注册，也不收集用户的数据，所以孩子们不会受到隐私侵犯和不必要的麻烦。Seek 是由博士生、iNaturalist
    的兼职科学家格兰特·范·霍恩（Grant Van Horn）设计的，其所开发的人工智能算法可为 Seek 提供驱动。这些人工智能算法基于图像分析、地理位置和时间，并利用
    iNaturalist 人群来源、分类物种数据的庞大数据库，预测孩子们用智能手机摄像头所观察的生物。Seek 通常有几个选择建议，邀请孩子将其与看到的植物、真菌或动物比较，并选择可能的匹配，但该应用程序有时只能匹配种类，有时只能提供一个正确的图像。


