- pgno: 263
  md: '我提出了一种包含 12 个因素的评分方法，并制作了一个 HCAI 可信度量表。根据这个量表，如果有公开的详尽报告，最多可以给 1 分；如果报告结果积极，则同样最多可以给
    1 分。这样一来，对于重要的大型应用系统（不是研究或原型系统），可信度评分将在 0 到 24 分之间（见表 25.3）。每个项目的标准、评估人员的专业水平以及每个评估小组的评估人员数量等问题都必须加以描述。


    # 表 25.3 建议的 HCAI 可信度量表


    | | |

    |---|---|

    | | 公开的详尽报告最多可得 1 分 |

    | | 有积极结果的报告最多可得 1 分 |

    | ① | 实施前的内部独立评审 |

    | ② | 已实施的审计追踪 |

    | ③ | 收集并评估训练数据（如微软的 Datasheets ） |

    | ④ | 对软件进行验证和确认 |

    | ⑤ | 测试公正性 |

    | ⑥ | 可解释性的实施和测试 |

    | ⑦ | 使用前 2 个月的性能 |

    | ⑧ | 使用前 6 个月的性能 |

    | ⑨ | 利益相关者提出建议、问题，并报告事故、未遂事件和故障 |

    | ⑩ | 对事故进行内部审查程序，并进行补救 |

    | ⑪ | 持续评审以支持改进 |

    | ⑫ | 由独立监督机构进行外部审查 |


    HCAI 可信度量表提供了一种按组成部分评分的主观评级方法，但它仍需要测试和完善，并可以添加其他条目以扩大其范围。该量表通过每个条目的报告来强调透明度，这将要求各组织向利益相关者提供更多信息。这个过程符合安全文化的方法，即让各组织制定一致的过程以进行审查和报告。


    欧盟委员会、美国国家标准与技术研究所以及许多公司正在为 HCAI 系统的可信度制定评估方法。'
