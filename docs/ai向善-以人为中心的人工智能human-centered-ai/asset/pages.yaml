  md: '本书内容源自我在前沿技术研究中心、高等院校和政府机构的 40 多次公开讲座。我对这些讲座内容进行了提炼，并阐述了三个主要观点。这些观点已被发表在三篇参考论文中，并得到了更多的反馈，这些反馈也使我在撰写本书的过程中得到了具体的、具有建设性的指导。在撰写的过程中，即便我描述了更具体的设计指南，但人权、正义和尊严等人类价值仍然在本书和人类发展中占主体地位和稳步发展。


    “以人为中心的人工智能”（Human-Centered AI，简称 HCAI）为设计师提供了全新的思维方式，即构想一种支持人类实现自我效能、创造力、责任感和社交关系的新策略。该策略更加强调，HCAI
    将减少人们对人工智能存在威胁的恐惧，并增加用户和社会在商业、教育、医疗健康、环境保护和社区安全方面的利益。


    我的第一个想法是构思一个技术设计的框架，它展示了创意设计师如何构想出高度自动化的系统并保留人类的控制权。例如我们熟悉的设备，如电梯、自清洁烤箱、手机摄像头以及生命攸关的应用，如高度自动化汽车、遥控手术机器人、病人自控性镇痛设备。这些指南和示例阐明了设计人员如何在设计中同时实现“高度的人工控制”与“高度的自动化”。


    我的第二个想法是展示人工智能研究的两个核心目标：模仿人类行为和开发有用的应用程序。两者都是有价值的，其产生的四对隐喻，可在开发产品和服务时相结合：


    +   ① 智能代理和超级工具；'
  merge: -1
  img_proc: true
- pgno: 4
  md: '+   ② 队友和远程机器人；


    +   ③ 确定的自主性和控制中心；


    +   ④ 社交机器人和有源设备。


    我的第三个想法是，弥合广泛讨论的 HCAI 道德原则与实现它们所需的实际步骤之间的差距。本书描述了如何改进已验证的技术实践、管理策略和独立的监督方法。它将指导软件团队领导、业务经理和组织领导开发：


    +   ① 基于成熟的软件工程实践的可靠系统；


    +   ② 通过业务管理策略营造的安全文化；


    +   ③ 通过独立监督和政府监管获得可信赖的认证。


    设计师、软件工程师、程序员、团队领导和产品经理的技术实践包括，便于分析故障的审计跟踪，比如民航的飞行数据记录器（飞机黑匣子，该匣子实际是橙色的）一样。HCAI
    介绍了软件工程的工作流程、验证和确认测试，以及增强公正性的偏差测试和可解释的 HCAI 用户界面。


    安全文化管理策略的制定始于领导层对安全的承诺，从而带来更好的招聘实践和以安全为导向的培训。其他管理策略包括大量的故障和未遂事故报告、内部审查委员会对问题和未来计划，以及行业标准实践的一致性。


    可信赖的认证来源于独立审计的会计师事务所和事故赔偿的保险公司。此外，还有非政府组织和公民社会组织提出设计原则，以及专业组织制定自愿标准和审慎政策。非政府组织的干预和监管将发挥重要作用，尤其是当其旨在加速创新时，如汽车安全和燃油效率方面。


    虽然在研发过程中存在诸多挑战，但我希望，我能尽我所能为大家提供一份指导书和现实政策的路线图。'
