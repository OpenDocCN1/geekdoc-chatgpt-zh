  md: '人工智能算法的成功，为广泛应用技术的设计改进开辟了许多新可能。研究人员、开发人员、管理人员和政策制定者开始接受以人为中心的方法，这将加速先进技术的设计和应用的进程，但开发将人工智能算法与以人为中心的设计相结合的新方法仍需要时间。


    本书第二部分介绍了 HCAI 理念如何为结合了高度人工控制和高度计算机自动化的系统设计开辟新可能。完善和传播这一理念需要时间，也要应对阻力。我相信，这些系统设计可以通过正确的、可靠运行的自动化功能来提高人类的表现，同时用户也能够自主控制某些重要功能。


    该理念框架阐明了如何结合高度人工控制和高度计算机自动化进行设计以提高人类的表现，如何理解需要完全人工控制或完全计算机控制的情况，以及如何避免过度人工控制或过度计算机控制的危害。这些目标的实现对人类的自我效能、创造力、责任感和社交关系等方面的提升都有所帮助。


    这些指南和示例展示了如何将该理念框架付诸实践。'
