- pgno: 222
  md: '人工智能，以降低部署自动化决策系统的相关风险。


    欧洲国家，尤其是英国、法国、德国和意大利，已经提出了声明，也基本与欧盟的报告保持一致。欧盟《通用数据保护条例》对“解释权”的要求，本书已在第 19 章“可解释的用户界面”一节中进行了讨论，几乎涵盖了所有行业，但越来越多的人意识到，针对特定行业的监管可能更合适。英国的皇家学会建议，现有的行业特定机构应该解决人工智能系统问题，而不是“为机器学习的所有用途制定一个总体框架”。英国信息专员办公室和艾伦·图灵研究所提出了一项有用的策略，即发布一份关于机构应如何制定其行业特定政策的深度分析指南。


    欧盟委员会关于人工智能的白皮书为开发人员和管理人员提出了监管方法及具体清单。欧洲的高级专家组经过不懈努力，强调了值得信赖的人工智能的七项原则：


    +   ①人力代理和监督；

    +   ②技术稳健性和安全性；

    +   ③隐私和数据管理；

    +   ④透明度；

    +   ⑤多样性、非歧视性和公正性；

    +   ⑥环境和社会福祉；

    +   ⑦问责性。


    目前人工智能系统的开发人员和部署人员可自愿使用上述原则。


    经济合作与发展组织制定了一套“负责任地管理可信赖的人工智能的原则”，将其工作定义为以人为中心的方法，这是区域联盟能够取得成就的一个示例。这些原则得到了包括
    19 个国家和欧盟在内的 20 国集团（G20）'
