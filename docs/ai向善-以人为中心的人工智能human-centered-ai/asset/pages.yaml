    2008 年至 2018 年期间的 86 篇论文和针对 70 项用户研究的一篇综述显示，人们对社交机器人有着持续研究的兴趣，但也缺乏对其接受度的长期研究，这表明人们的兴趣已经过了新奇阶段。然而，这篇综述表明，社交机器人在激励儿童更多地参加体育活动方面具有潜力。


    综上，类人社交机器人尚未取得成功，但宠物狗或宠物猫机器人似乎正在为老年人，甚至为一些儿童所接受。成功的关键似乎是找到真正的人类需求，并且这些需求可由类似动物的机器人设备来满足。


    # 有源设备


    与社交机器人和动物机器人不同的是，有一类机器人可被称为设备电机型机器人，但我将其称为有源设备。这一大类成功的消费产品能完成必要的任务，如厨房工作、洗衣杂务、房屋清洁、安全监控和花园维护。此外，还有许多娱乐中心设备和各式各样日益复杂的运动器材。这些有源设备的控制面板（见第
    9 章的示例）受到了越来越多的关注，因为设计师开发了更丰富的触屏控制，适应了更精细的用户需求，以设计出更好的产品。越来越多的家庭控制设备依赖机器学习来识别使用模式，例如谷歌
    Nest'
