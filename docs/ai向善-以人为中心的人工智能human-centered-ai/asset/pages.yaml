  md: '户更大的控制感。相比之下，大获成功、广受欢迎的数码相机则源于经验主义思维，它是一个用户优先的傻瓜式设备，具有很多易用控件，用户可以在多种操作模式中选择，包括自拍和人像模式，用户可以预览拍摄的图像。用户还可以拍摄视频或全景视图，编辑或添加注释，立即与朋友和家人分享。几十年前，只有专业摄影师才能拍出高质量的照片，然后可能需要花费几天甚至几周的时间打印照片，最后再将照片的复印件邮寄出去。


    关于理性主义和经验主义的讨论很多，也甚是微妙，但我的理解是这样的。理性主义者相信逻辑思维，他们可以在舒适且熟悉的办公桌前或研究实验室里构思，他们主张规则的完备性以及形式化方法的效力，比如逻辑和数学证明。他们的假设有明确界限的常量——热与冷、湿与干。亚里士多德辨识到一些重要的区别，比如脊椎动物和无脊椎动物的不同、四种物质（土、水、气和火）的不同。这些分类是有用的，但在考虑其他选择、中间立场和新模式时，理性主义思维可能会有局限性。


    亚里士多德专注于理性的反思而不是经验的观察，这有时会使他误入歧途，比如他相信女人只有 28 颗牙齿，而简单的验证就可以纠正他的错误。理性主义的追随者有勒内·笛卡儿（René
    Descartes）、巴鲁赫·斯宾诺莎（Baruch Spinoza）、伊曼努尔·康德（Immanuel Kant），以及 20 世纪著名的统计学家罗纳德·费希尔（Ronald
    Fisher）。由于亚里士多德对数据的过分执着而拒绝承认早期的吸烟数据，因此他继续吸烟，最终死于肺癌。理性主义，尤其是体现在逻辑、数学思维中的理性主义，是许多人工智能科学研究的基础，在这些研究中，基于逻辑思维的算法因其简练性而备受推崇，并以效率作为衡量标准。


    基于理性思维开发的医疗信息系统，临床医生需要输入一组有限类别的数据或代码来获取健康报告。这种形式化有利于加强分类的一致性，但'
