  md: '会采用自主武器。因此，就限制自主防御或进攻性武器的应用达成任何协议一直进展缓慢。


    我也相信，计算机自主对于许多应用程序来说是有吸引力的。我渴望拥有一个能够可靠、安全地完成重复、危险或困难任务的自主设备。我希望我有一辆自动驾驶汽车，可以避免刷蹭到狭窄车库的柱子上。这类人为失误可以通过防止人为错误的设计来避免。安全第一的方法似乎是在重要和生命攸关的应用中的明智选择。


    确定的自主性这一概念被越来越多地讨论，比如我在 2020 年 2 月在亚利桑那州凤凰城参加的计算研究协会研讨会上就这个话题进行了激烈讨论，保留了“确定的自主性”这一术语，并提倡以人为中心的方法、证明正确性的正式方法、广泛的测试和独立的认证。该报告承认，“由于自主系统故障的法律和道德责任只存在于自然人和组织中，设计人员和开发人员应当接受培训，以了解责任的法律原则。”


    我支持这些说法，但我更倾向于使用“监督自主性”这一术语，通过控制面板和控制中心来实施。监督自主性意味着，人类正在通过设备上的可视化控制面板或远程控制中心监控其性能，以便他们能够及时干预以确保正确结果。监督自主性的另一个组成部分是收集审计记录和产品日志，以支持回溯性故障分析（参见第
    19 章的“审计跟踪和分析工具”一节）。在某些情况下，远程控制中心可以监控许多汽车或火车、医院重症监护室或通信网络的运行。


    “确定的自主性”这一术语仍然得到了支持，正如约翰·霍普金斯大学确定自主性研究所的成立所示。该研究所网站称，“未来自主系统的可靠性将取决于可靠的技术、严格的系统和人类工程以及有原则的公共政策。”英国研究与创新委员会已经向几所大学提供了大量资金，以推动“值得信赖的自主系统”的研究。我担心的是，这些确保或值得信赖的自主条款所承'
  merge: -1
  img_proc: true
- pgno: 126
  md: '诺的内容超出了可能的范围，误导开发人员相信他们可以在最少的人工监督下构建一个可靠、安全、可信赖的系统。


    相比之下，像监督自主、灵活自主、共享自主、并行自主和分配自主等术语表明，人类自主同样也是一个重要的目标。另一种构想是，控制中心可以提供人工监督，支持持续的态势感知，并提供清晰的模型来描述正在发生和将会发生的事件。控制中心提供信息丰富的控制面板，为每个操作提供详尽的反馈，并提供审计跟踪以便进行回溯性审查。谢里丹对监控、远程机器人和自动化进行了广义的描述，他试图详细定义手动控制和全自动控制之间的空间，从而明确人类对工业控制中心、机器人、电梯和洗衣机运行的责任。


    控制中心这一隐喻是指人类制定目标时的决策，由计算机执行可预测的任务，通过传感器引导并由效应器执行低级的物理动作。我们所熟悉的汽车自动变速箱就是一个成功且成熟的自动系统，该系统在很大程度上是独立运行的。在社交媒体或电子商务等电子系统中，用户执行如下任务：发布消息或订购产品并获取有关已发生事情的反馈，包括关于朋友的帖子或产品发货延迟的提醒等。在成熟的系统中，用户对于设备或系统正在做什么有一个清晰的心理模型，系统通过联锁装置防止意外操作并在出现问题时发出警报，同时具备在意外操作或目标变化时进行人工干预的能力。


    当代的控制中心概念涵盖更具雄心的想法。例如，在商业航空中，可能存在多种形式的人工控制，从飞机驾驶员和副驾驶员开始，包括在当地控制中心工作的空中交通管制员，以及20个协调美国国家空域的区域控制室。对自主系统的进一步监管包括每架飞机的空管局认证、飞行员培训和表现的审查，以及对飞行数据记录仪信息的回溯性分析，以研究故障和避免未遂事故。类似地，医院、交通、电力、股票市场、军事等复杂系统有多个控制中心，其中可能包含许多人工智能引导的组件。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '人们越来越支持组合解决方案，正如丹妮拉·罗斯的设想。罗斯是麻省理工学院一个研究小组的负责人，该小组致力于研究平行自动驾驶汽车，即由人类控制车辆，而计算机在正常驾驶过程中只进行最低限度的干预。然而，计算机将通过制动或避免与汽车、障碍物或行人碰撞来防止事故发生。这种安全至上的汽车概念在其他计算机应用领域中，尤其是第
    16 章将讨论的移动和社交机器人中也是有意义的。


    综上，人们对“确定的自主性”这一概念充满热情，但对于多数应用来说，控制中心可能为人类监督提供了更多的机会。当系统需要自主活动来做出快速响应时，高度警惕和持续的性能审查将有助于更安全的操作。术语并不重要，只要设计人员找到一个可靠、安全、可信赖的设计策略，并进行充分的测试、收集用户的反馈、进行审计跟踪和公开问题报告即可。'
  merge: -1
