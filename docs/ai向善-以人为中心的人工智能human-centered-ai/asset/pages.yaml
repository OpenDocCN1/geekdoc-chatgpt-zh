  md: '![](img/1b604470e34bc8bdfb044407ab9bdfc5_297_0.png)


    # Human-Centered AI


    虽然过早的监管可能会限制创新，但是忽视 AI 可能带来的潜在风险也是不可取的。人工智能涉及隐私保护、数据安全、算法偏见等一系列问题，若没有适当的监管，可能会给个人和社会带来严重的负面影响。因此，我非常认可本书的研究，建议政府在立法监管时应该重点关注潜在风险，并制定相应的措施和政策来引导
    AI 更好地服务经济、服务社会。


    王喜文 北京华夏工联网智能技术研究院院长 / 九三学社中央促进技术创新工作委员会委员


    《AI 向善：以人为中心的人工智能》一书，深刻探讨了人工智能与人类社会的和谐共生之道，提出了以人为本的发展理念。它不仅仅是一部描绘未来科技蓝图的著作，更是一部充满人文关怀的图书。该书引导我们重新审视人工智能的价值取向，强调在技术进步的同时，应尊重和保护人的价值与尊严。作为迈向智慧社会的必读之作，它为我们指明了方向，引领我们走向更加美好的未来。


    吕阳 北京工商大学教授'
