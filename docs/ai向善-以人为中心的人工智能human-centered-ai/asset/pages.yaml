- pgno: 96
  md: '# 第 11 章


    # 人工智能研究的目标是什么？


    > 当一个人把某些任务委托给代理人时，无论这个代理人是人造的还是人类，该任务的结果仍然由委托人负责承担，如果事情没有按预期进行，委托人将承担责任……一个具有自主性和适应性的交互系统难以进行验证和预测，相反，将会导致意想不到的行为。——弗吉尼亚·迪格努姆（Virginia
    Dignum），“责任与人工智能”，《牛津人工智能伦理手册》（The Oxford Handbook of Ethics of AI），由马库斯·D. 杜伯（Markus
    D. Dubber）、弗兰克·帕斯夸莱（Frank Pasquale）和苏尼特·达斯（Sunit Das）编


    人工智能科学和工程研究的目标至少在 60 年前就被提出了，当时早期的会议聚集了那些关注图灵问题的人，即机器会思考吗？简单来说，人工智能科学研究的目标是使计算机能够执行人类所能做的事情，实现与人类相当或超越人类的感知、认知和运动能力。


    人工智能研究的一个起点是满足图灵测试，并给观察者提供键盘和显示器来进行打字对话，如果观察者无法判断他们连接的是人还是机器，那么机器就满足了图灵测试。多年来，人们开发出了许多变体，例如创造出与人类拍摄的照片难以区分的计算机生成图像，制造了一个会说话、会动、看起来像人类的机器人。加州大学伯克利分校的计算机科学家斯图尔特·罗素（Stuart
    Russell）'
  merge: -1
  img_proc: true
- pgno: 97
  md: '积极支持人类仿真科学和有益于社会创新的双重目标。他写道，人工智能是“理解人类智能如何运作的主要途径之一，也是改善人类状况的绝佳机会——创造更好的文明”。但罗素也认为，给机器注入智能会引发问题。


    科学研究涉及感知、认知和运动能力，包括模式识别（图像、语音、面部、信号等）、自然语言处理和自然语言翻译等。而做出准确的预测，让机器人的表现像人类一样出色，并让应用程序能够识别人类的情绪，以便做出适当的响应是这一领域其他研究所面临的挑战。另一个领域是游戏，如跳棋、国际象棋、围棋或扑克，计算机可以像人类玩家一样优秀甚至比人类玩家更出色。


    随着早期科学研究的进展，一些有用的创新成为可能，强调符号操作的科学研究被基于机器学习和深度学习的统计方法所取代，后者通过从现有的数据库中训练神经网络。而神经网络策略在随后的实践中得到进一步的细化，包括生成对抗网络、卷积神经网络、循环神经网络、逆强化学习和更新的基础模型及其变体。


    人工智能研究人员的远见卓识催生了一系列令人振奋的项目。支持者声称，人工智能的出现是人类发展中一个出现巨大希望的历史转折点。然而批评者指出，许多项目以失败告终，这在新研究方向中是常见的，但其他项目已经带来了广泛的应用，例如光学字符识别、语音识别、自然语言翻译等。尽管批评者认为人工智能创新仍不完美，但许多应用都令人印象深刻，并取得了商业上的成功。


    大胆的抱负可能会有所帮助，但另一种批评观点是，人工智能科学方法已经失败，被更传统的工程解决方案所取代，后者已经取得成功。举例来说，国际商业机器公司著名的深蓝国际象棋程序在
    1997 年击败了世界冠军加里·卡斯帕罗夫（Garry Kasparov），被视为是人工智能的成功。然而，领导深蓝团队的国际商业机器公司研究员许峰雄明确表示，他们没有使用'
  merge: -1
  img_proc: true
- pgno: 98
  md: '人工智能方法。他们的解决方案依赖于强大的硬件，利用专门的芯片来快速探索每个棋手可能采取的步骤，最多提前 20 步。


    再举个例子，在许多商业应用领域中，基于知识的人工智能指导专家系统已经失败了，而经过精心构建的基于规则的工程系统和人工管理的规则集却取得了成功。以复杂的定价和折扣政策为例，许多公司制定了复杂的政策，根据地区、产品和采购量的不同，给予受青睐的客户更低的价格。

    为了确保报价的一致性，所有的销售人员都可以跟踪这些数据，这对于维护客户信任至关重要。


    近期的批评主要集中在深度学习方法的脆弱性上，这种方法可能在实验室中表现良好，但在现实世界的应用中却失败了。纽约大学的加里·马库斯（Gary Marcus）教授和欧内斯特·戴维斯（Ernest
    Davis）教授曾报告了早期人工智能研究人员如马文·明斯基（Marvin Minsky）、约翰·麦卡锡（John McCarthy）和赫伯特·西蒙（Herb
    Simon）的高期望，但这些期望并未实现。1965 年，赫伯特·西蒙（Herb Simon）提出了一个令人难忘的预测，即“在 20 年内，机器将能够执行人类能够做的任何工作”。马库斯和戴维斯描述了人工智能系统的许多失败案例，例如，解读照片时出错、种族歧视、在医疗保健建议上的失误以及自动驾驶汽车与消防车相撞。然而，他们对人工智能的未来仍持乐观态度，他们相信常识推理的发展将为人工智能带来希望。基于更多、更好的人工智能，他们呼吁重启对人工智能的研究。


    科学家米切尔·沃尔德罗普（Mitchell Waldrop）说，“毫无疑问，深度学习是一种非常强大的工具”，但他也描述了一些失败案例，并强调“在人工智能远超人类能力之前，它还有很长的路要走”。沃尔德罗普提出了一些解决方案，旨在改进深度学习策略、扩展训练数据集，并以积极的态度看待未来的挑战。


    即使在 60 多年后的今天，人工智能仍处于早期阶段。我希望人工智能'
