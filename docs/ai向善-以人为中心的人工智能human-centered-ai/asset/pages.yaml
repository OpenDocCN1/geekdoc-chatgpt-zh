  md: '务，例如基于传感器模式识别的自动冲洗的厕所，非预期激活或未激活都会造成麻烦。然而，如果任务是开车去上班，你会选择一辆每月都有一次需要一个小时才能启动的车，还是一辆偶尔会停在距离你工作地点一千米的车？对于像冲厕所这样的轻量级任务，故障只会带来一些烦恼，但对于交通、健康、金融和军事应用领域来说，我们需要更高的可靠性、安全性和可信赖性，这些产品才能获得用户的高度认可，从而获得商业成功。


    但也有一些系统，如冲马桶或驾驶车辆，用户可以更多地控制机器行为以避免故障，这些系统也可以在产品或设备行为不符合用户意图时将控制权转交给用户。针对新闻推荐系统的一项研究中，研究人员提供给用户三个滑动选项，让他们表明自己对政治、体育或娱乐文章的阅读兴趣。当用户移动滑块时，推荐文章的列表会立即变化，因此用户就可以探索自己感兴趣的内容，从而更频繁地点击推荐，并表达出“对更多控制权的强烈愿望”。针对推荐系统的另一项研究也表明，同一种推荐系统的两种不同控制面板展示相似的结果时，用户更倾向于个人控制权更多的控制面板。


    一些推荐系统能够记录用户对推荐的不满意程度，因此随着时间的推移，推荐系统会变得更加精准。智能马桶通常设有一个按钮，当系统没有自动启动时，用户可以按动按钮强制冲水。


    尽管存在许多良好的设计，但现有系统仍然有改进的空间。有一次，在我经常去的游泳馆里，我在穿衣服的时候，换衣间的马桶不必要地冲了八次水，但我无法阻止这个使用早期人工智能模式识别技术的自动化设备。相比之下，我经常因为无法激活感应水龙头和手部烘干机而感到烦恼。这些模式识别装置既不可靠也不值得信赖。可考虑的补救措施是，在模式识别传感器肯定能够识别到的地方粘贴一个标准图案，并得到所有制造商的认可，或者在洗手槽或烘干机上设置一个按钮。'
