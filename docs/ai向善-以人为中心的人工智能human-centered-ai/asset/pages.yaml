- pgno: 13
  md: '会上的重大挑战。这些目标对社会需求的贡献与 HCAI 方法是一致的，其采用严苛的设计和评估方法，得出高影响力的研究成果。AI4GOOD 也制定了一些适当的目标，并通过
    HCAI 方法指导研究人员和开发人员确定如何真正、有效地解决人类需求，比如政府的重要问题以及企业、学校和医疗系统的重大挑战。然而，每一次造福人类的机会都被日益强大的人工智能和
    HCAI 系统的威胁所稀释，因为这些 HCAI 系统同样可以被恶意行为者所利用，如犯罪分子、极端组织和恐怖分子。


    联合国人工智能公益全球峰会于 2017 年成立，是一个由热心的研究领袖、企业高管和积极的政策制定者组成的年度聚会，该峰会的主旨与上述为人工智能制定社会目标的运动是一致的。会议组织者表示，“他们的目标是确定人工智能的实际应用，并扩大这些解决方案的全球影响力”。联合国机构和成员国的努力以
    2015 年制定的 17 项联合国可持续发展目标为指导，旨在设定 2030 年的愿景（图 1.1）。这些目标包括消除贫困、零饥饿、优质教育、减少不平等，此外还涉及环境问题，如气候行动、陆地生物和水下生物保护以及可持续发展的城市和社区。虽然上述目标在社会、政治和心理等层面上都需要随之改变，但在寻找解决方案的过程中，人工智能和
    HCAI 技术将持续发挥作用。


    参照每个国家的 169 项具体指标，如：可获得基础服务家庭的人口比例、孕产妇死亡率、使用饮用水服务等安全管理的人口比例，决策者将评估这些目标达成的进展情况。


