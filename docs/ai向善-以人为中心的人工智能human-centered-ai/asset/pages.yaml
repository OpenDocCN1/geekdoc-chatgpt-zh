- pgno: 32
  md: '样性和创造力的欣赏。我更喜欢赞美人类的伟大成就，如语言、艺术、音乐、建筑等方面的卓越文化成就，以及机器学习和相关算法。明确人类与计算机之间的区别，可以增加对人类责任的尊重，并指导人们以适当的方式利用计算机的能力。


    人类有身体，拥有身体使我们成为人类。我们能感受到痛苦和快乐，悲伤和喜悦。我们可以哭、可以笑，可以跳舞、可以吃饭，可以恋爱、可以思考，这都是人类生活的一部分。情绪和情感既能让人感到愉悦，也会让人感到害怕。人类的情绪远不止保罗·艾克曼（Paul
    Ekman）描述的七种基本情绪：愤怒、蔑视、厌恶、享受、恐惧、悲伤和惊讶。他的观点已经被人工智能群体所使用，其过度简化了人类情感及其面部表情的复杂性。丰富人类情绪画像的一个方向是，假设人类有更多的情绪（图
    3.1）。


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_32_0.png)


