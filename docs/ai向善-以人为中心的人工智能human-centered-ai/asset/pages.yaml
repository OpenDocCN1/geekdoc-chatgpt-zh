  md: "在热门新闻网站和社交媒体交流平台上，虚假信息和令人发指的阴谋论被病毒式传播，极大程度地放大了人们对实施广泛使用的人工智能系统的道德问题的争议。构建人道的、负责的、有益的系统不仅仅是一项技术任务，就像编写一个更好的计算机程序一样，它需要管理架构来缩小以人为中心的人工智能的道德原则和实际步骤之间的差距。HCAI\
    \ 系统由软件工程团队开发和实施，在组织内管理，按行业划分，并由政府监管。这四个层次的管理架构可以提供已经应用于交通、医疗和金融等重要行业技术的全面关注。\n\
    \n从道德层面到实施层面来讲，这意味着政策制定者需要在团队、组织、行业和政府各方采取有意义的行动。本书第四部分的建议旨在通过这一管理架构来提高 HCAI 系统的可靠性、安全性和可信度：\n\
    \n+   - 团队中的软件工程实践，例如审计跟踪以支持对故障的回溯性分析、改进软件工程工作流程从而优化 HCAI 系统、验证和确认测试以证明正确性、偏差测试来增强公正性以及可解释的用户界面。\n\
    +   \n+   - 业务管理策略在组织内部营造的安全文化，包括领导对安全的承诺、以安全为导向的招聘和培训、大量的故障和未遂事件报告、内部审查委员会发现的问题和未来计划、行业标准实践的一致性评估等。\n\
    +   \n+   - 通过特定行业的独立监督组织获得值得信赖的认证，包括对外审计的会计师事务所、对事故赔偿的保险公司、提出设计原则的非政府组织和"
