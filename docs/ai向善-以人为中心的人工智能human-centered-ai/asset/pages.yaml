  md: '对于复杂的决策，现任苹果研究员弗雷德·霍曼（Fred Hohman）表明，用户界面和数据分析可以明确机器学习训练数据集中中的哪些特征是最相关的。他的方法是他在佐治亚理工学院博士研究的一部分，这一研究致力于解释用于图像理解的深度学习算法。一个由
    11 名研究人员组成的谷歌团队构建了一个交互式工具，以支持临床医生理解医学图像中有关癌症的算法决策。他们与 12 名医学病理学家的研究显示，使用这种基于滑块的探索性用户界面有实质性的好处，“增加了所发现图像的诊断效用，并增加了用户对算法的信任感”。


    互动式的 HCAI 方法得到了韦尔德和班萨尔的支持，他们建议设计师应该“使解释系统具有互动性，以便于用户进行深入探究，直到他们对自己的理解感到满意为止”。


    当用户的输入可操作时，探索性用户界面的效果最好；也就是说，用户可以控制并更改输入。当用户无法控制输入值或来自传感器的输入（如图像和人脸识别应用程序）时，则需要其他设计。为了获得最大的好处，探索性用户界面应该支持具有视觉、听觉、运动或认知障碍用户的可使用性。


    1996 年，罗格斯大学教授尼克·贝尔金（Nick Belkin）和研究生于尔根·科内曼（Juergen Koenemann）进行的一项搜索用户界面研究表明，给用户更多控制权的好处是显而易见的。他们在对
    64 名参与者的研究中总结了探索性互动的成果，报告称：“用户非常有效地使用了我们的系统和界面，并且很少出现可用性问题……用户显然受益于迭代过程中修改查询的机会。”


