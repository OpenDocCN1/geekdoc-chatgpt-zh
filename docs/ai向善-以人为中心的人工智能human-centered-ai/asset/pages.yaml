- pgno: 211
  md: '公众压力或美国证券交易委员会的要求可能会鼓励领先的独立审计公司加大对 HCAI 项目的支持力度。四大会计师事务所分别是普华永道、德勤、安永和毕马威，他们都声称自己是人工智能方面的专家。德勤的网站发表了一份承诺声明，称“人工智能工具通常不会产生直接结果，除非与以人为中心的设计相结合”，这一声明倾向于本章所推荐的方向。会计师事务所有两个潜在的角色——咨询和独立审计，但根据《萨班斯
    - 奥克斯利法案》的规定，这两个角色必须严格分开。


    独立监督企业项目的一个有说服力的例子是对新冠病毒密切接触者的追踪。苹果公司和谷歌合作开发了移动设备应用程序，如果用户接触过感染了新冠病毒的人，该应用程序就会提醒用户。然而，隐私威胁立即引起了人们的关注，导致人们呼吁建立独立的监督委员会和政策。一项经过深思熟虑的提案为独立的监督治理委员会罗列出了
    200 多个项目，以便在审计期间进行评估和裁决。对于涉及隐私、安全、行业竞争或潜在偏见的有争议的项目，独立监督小组有助于提高公众的信任程度。


    如果四大审计事务所挺身而出，其在企业和公众中的信誉将会对 HCAI 系统的独立审计有促进作用，这将会产生实质性的影响。此外，可以借鉴发起组织委员会的模式，该委员会汇集了五个领先的会计组织，以改善企业风险管理、内部控制和欺诈威慑。这种
    HCAI 的审计形式可以减少政府监管的压力，改善商业实践，其早期的工作可能会引起大家注意，并吸引可信赖的公众人物和组织加入此类审查委员会。


    除了审计或会计公司，咨询公司也可以发挥作用。埃森哲公司（Accenture）、麦肯锡公司（McKinsey）和波士顿咨询公司（Boston Consulting
    Group）等行业领导者都建立了自己的人工智能专业知识库，并发布了白皮书，以便向企业提供建议，从而构建一个可靠、安全、可信赖的系统。'
