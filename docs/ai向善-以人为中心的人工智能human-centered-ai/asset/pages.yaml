  md: '# 第 7 章


    # 定义可靠、安全、可信赖的系统


    虽然实现机器的自主性仍然是一个普遍目标，但在设计师的头脑中，人类自主性的目标应同等重要。机器自主与人类自主都是有价值的，但对两者的组合策略而言，应在可靠时使用机器的自动控制，必要时使用人工控制。关注
    HCAI 系统可靠、安全、可信赖的特性将有助于指导设计的改进，这几个术语很复杂，我用四级建议来定义它们（请参阅第四部分）：①基于成熟的软件工程实践的可靠系统；②通过业务管理策略营造的安全文化；③通过独立监督获得可信赖的认证；④通过政府出台的相关法规。


    这四个建议有助于加快可靠、安全、可信赖系统的发展速度。软件工程师、商业领袖、独立监督委员会和政府监管人员都关心这三个目标的实现，但我建议每个群体都以最有效的方式支持这些实践。


    可靠的系统在需要时会产生预期的响应。可靠性来自软件工程团队合理的技术实践（详见第 19 章）。当故障发生时，调查人员可以查看详细的审计记录，如飞行数据记录仪的日志，这些记录在民用航空领域颇有成效。支持人类负责、公正、可解释性的技术实践包括：


    +   • 审计追踪和分析工具

    +   • 软件工作流程

    +   • 验证和确认测试'
