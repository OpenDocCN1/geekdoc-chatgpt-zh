  md: '故设立的“墨西哥湾海岸索赔基金”。这两个例子说明针对 HCAI 系统故障的新补偿形式的建议已经提出，但尚未获得广泛支持。


    # 非政府组织和公民社会组织


    除了政府工作、会计师事务所的审计和保险公司的担保外，美国和许多其他国家拥有丰富的非政府组织和公民社会组织，这些组织已经在积极推广可靠、安全、可信赖的 HCAI
    系统（附录 A）。这些组织受到了不同程度的支持，但总的来说，这些组织可能会共同促进系统的改进并提高公众的接受度。


    这些非政府组织通常由捐赠者或公司资助，资助者认为独立组织有更大的自由来探索新颖的想法，并可以在人工智能等快速发展的领域引领公众的讨论。有些非政府组织是由个人发起的，他们热衷于吸引他人并寻找赞助商，但更成熟的非政府组织可能有几十名甚至几百名有同样热情的工作人员。其中一些非政府组织就新技术的政策问题开发有益的服务或培训课程，从而为其带来资金，并进一步扩大其社交网络。


    算法正义联盟是一个鼓舞人心的示例，该联盟促进了大型科技公司改善他们的面部识别产品，从而在两年内减少性别和种族偏见。在限制警察种族偏见的激烈运动之后，许多大型公司在
    2020 年春季做出了停止向治安机构销售产品的决定，从而推断这些压力可能也产生了影响。


    非政府组织已被证明是提出 HCAI 原则和道德相关新想法的早期领导者之一，但现在他们需要更加关注开发软件工程实践和商业管理策略相关的新想法。此外，非政府组织还必须增强与政府决策者、律师、保险公司和审计公司的联系，从而能够影响长期以来一直属于其他行业的外部监督机制。


    然而，非政府组织的干预权力有限。他们的作用是指出问题、提出可'
