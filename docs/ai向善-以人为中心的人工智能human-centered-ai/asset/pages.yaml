- pgno: 170
  md: '在每种形式下，机器学习都高度依赖于训练数据，因此需要收集不同的数据集，以提高准确性并减少偏差。例如，每家医院将服务于不同的社区，这些社区因居民年龄、收入、常见疾病和种族构成有所不同，因此检测癌症生长的训练数据需要来自本社区。


    在基于人工智能的肺部 X 光检查系统的确认过程中，不同医院的结果差异很大，这很大程度上取决于该医院所使用的 X 光机，但也可能是因为患者特征和机器位置不同。因此，针对这些可能定期更新甚至持续更新的数据集，编写文档记录至关重要，但它带来的巨大挑战远远超出了编程代码存储库目前所能完成的工作。这些存储库，例如广泛使用的
    GitHub，可以跟踪编程语句中的每一个变更。数据保护这一概念具有前景，例如使用不可更改的区块链方法进行来源跟踪，以及检查数据在面对变化时是否仍然具有代表性。最后，明确由谁来负责数据集管理，并让其参与处理异常情况和新的使用环境。


    至少有五种流行的测试技术可以应用于 HCAI 系统。


    基于传统案例。开发团队收集一组输入值和预期输出值，然后验证系统是否能够产生预期的结果。构建输入记录（例如抵押贷款申请）需要时间，以获得预期结果（接受或拒绝），系统当然应该产生预期的结果。动物图像的分类或语句翻译的测试用例很容易理解，因为成功和失败的结果都很清楚。收集足够多的测试用例集可以让设计人员考虑极端情况和可能的故障，这本身就可以使他们发现需要改进的地方。可考虑的常见的方法是，让多个团队，包括开发人员和非开发人员，一同构建带有预期结果的测试用例。


    在已建立的领域中，有测试用例的数据集可用于与其他系统的性能进行比较。例如，ImageNet 有 1400 万张已标注预期结果的图片。由美国国防部高等研究计划署和美国国家标准和技术局共同主办的文本信息检索会议'
  merge: -1
  img_proc: true
- pgno: 171
  md: '已经举办了近 30 年的年度研讨会，其中包含大量已标注预期结果的测试数据集。


    验证的一个关键环节是开发测试用例来检测对抗性攻击，这将防止犯罪分子、极端组织和恐怖分子的恶意使用。而且，随着新需求的添加或使用环境的变化，必须增加新的测试用例。


    差异测试。此策略通常用于验证更新后的系统是否能产生与早期版本相同的结果。分别在早期系统和更新后的系统上运行测试数据集，然后产生可自动比较的结果，以确认系统是否仍像之前一样工作。差异测试的优点是测试团队无须创建预期的结果，但其至少含有如下两个缺点：①早期软件的不正确性能将被继承到更新后的软件中，导致两者将得到相同的不正确结果；②新功能无法与以前的测试结果进行比较。差异测试的另一个用途是，比较可能由其他团队或组织开发的两个不同系统，就其结果的差异展开进一步的研究，以查看哪个系统需要修复。对于机器学习而言，差异测试被广泛用于比较两种不同的训练数据集的性能。


    变形测试。这种巧妙的方法建立在与结果集之间变形关系的概念之上。举一个简单的例子，在一种无向网络中寻找路径的算法中，从 a 到 b 的最短路径应该与从 b 到
    a 的最短路径相同。同样，拒绝抵押申请的金额绝不应低于申请人之前获得批准的金额。对于电子商务推荐者来说，将产品的最高价格从 100 美元更改为 60 美元，应该会产生一个产品子集。与差异测试一样，测试团队不需要创建预期的结果，因为它们是由软件生成的。测试团队可以通过添加或删除不应更改的结果记录，对训练数据集应用变形测试。


    用户体验。对于涉及用户的 HCAI 应用，如抵押、假释、求职面试等，需要进行用户测试，以验证用户能够处理系统并得到实质意义的解释。用户测试是通过向 5 到
    25 个用户分配标准任务来进行的，通常持续 30 到 120 分钟，要求他们在完成任务时边想边说，解释他们看到、思考和做的事情。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '测试团队记录用户评论和表现并生成有关常见问题的报告，并包括建议的改进方案。用户测试是在系统开发中用于检测用户报告的问题的一种实用方法，该方法不同于对照实验，后者通过测试替代假设来证明两种或两种以上设计之间的统计学显著差异。


    红队。除了由开发团队进行测试之外，一种日益流行的技术是让外部人员组成的红队对 HCAI 系统进行攻击。红队的概念来自军事演习，随着网络安全领域的迅速发展，这一概念被用于航空安全测试，例如，让政府特工测试机场安检系统，并使用不同的策略让致命武器通过安检系统的检查进入飞机。对
    HCAI 系统进行红队测试会发现软件和策略中的弱点，以及通过添加误导性记录来干扰训练数据。面部识别系统很容易被穿着异常 T 恤的人破坏，自动驾驶汽车算法也会被繁行标志或高速公路上的盐晶体线误导。随着时间的推移，红队成员将在探索系统、形成攻击者心态并与他人分享策略时提升自己的技能。


    MITRE 公司维护着一个网络安全矩阵，该矩阵将攻击者的近 300 种战术分为 11 类，提醒开发人员对手可能如何攻击他们正在构建的系统。对于红队攻击 HCAI
    系统和数据集的方式，类似的矩阵将有助于开发人员了解如何保护他们的系统。软件工程师可以单独对潜在的攻击进行分类，然后将他们的结果与其他团队成员的结合起来。与其他团队的比较可以让我们进一步了解潜在的攻击。MITRE
    公司已经启动了类似项目，即制作这样一个人工智能的故障目录。


    对于所有的测试技术都应记录测试历史，以便进行重建，并记录如何进行维护，由谁进行维护。微软数据集中的数据表就是一个用于记录机器学习数据的模板。该模板包含收集和清理数据的动机和过程、使用过数据集的人员以及数据管理员的联系方式。这一积极举措迅速推广到人类软件工程团队，并鼓励谷歌的模型卡模板用于模型报告。从数据库系统和信息'
