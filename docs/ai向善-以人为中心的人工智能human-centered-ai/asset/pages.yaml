  md: '# 第 25 章


    # 可信度的评估


    18 世纪和 19 世纪的科学仪器制造商极大地提高了人类在测量尺寸、持续时间、温度和重量等方面的能力，推动了许多学科的快速发展。20 世纪的追随者进一步向前迈进，为测量员、医生、木匠、厨师等其他人员拓宽了精确测量的途径。开尔文勋爵（Lord
    Kelvin）提倡测量，他有一句令人难忘的话：“如果你无法测量它，你就无法改进它。”


    开尔文勋爵对商学院学生的忠告是：“如果你无法测量它，你就不能管理它。”然而，业务流程成功与否、应聘者的能力高低、制造流程安全与否，并不像患者的体温或南瓜的重量那样容易测量。


    同样具有挑战性的是，如何对社会体系、心理态度、教育理论、葡萄酒年份、戏剧表演进行评估。事实上，尽管我们在测量事物的物理特性方面具有很强的能力，但当涉及评估、排名或比较过程及系统的属性时，我们的方法具有局限性。


    目前的挑战是评估 HCAI 系统的属性。关于道德原则和属性（如表 25.1 中的属性）有大量的讨论，但关于如何评估这些属性的建议却寥寥无几。如第二部分所述，本书重点关注如何实现可靠、安全和可信赖的属性。本章将重点讨论可信度，这是一个比信任更深层次的概念，因为可信度强调了
    HCAI 系统值得利益相关者给予信任。然而，可信度是很难评估的，因为在不同的应用背景下，它会随着算法和训练数据集的变化而变化。当认识到 HCAI 系统永远不可能是
    100% 可信赖的，就应该激发开发人员、管理人'
