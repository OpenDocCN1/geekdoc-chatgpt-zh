  md: 'Reimagining Work in the Age of AI ）一书中强调了培训的重要性。他们写道：“公司必须为员工提供必要的培训和再培训，以便让员工做好准备，承担任何新的角色……对人的投资必须是每个公司人工智能战略的核心内容。”


    # 广泛报告故障和未遂事件


    以安全为导向的组织会定期报告他们的故障（也可称之为“不良事件”）和未遂事件（也可称之为“侥幸脱险”）。未遂事件可以是容易处理的小错误，也可以是可避免的危险操作，例如偶尔漏水、强制设备重启、操作失误或断电。如果未遂事件中遗漏或疏漏的错误被报告和记录，那么设备和设施管理人员就能够清楚地了解设备的运行模式，从而可以集中注意力防止更严重的故障。由于未遂事件通常比故障发生的频率高得多，因而可以提供更丰富的数据来指导维护、培训或重新设计。


    美国国家安全委员会提出了一个令人震惊的建议，即不要奖励那些几乎没有故障的部门经理，而应该奖励那些未遂事件报告率高的部门经理。“未遂事件报告”是一种常见而有效的做法，让员工的注意力更加集中在安全上，并随时准备做出“未遂事件报告”，而非掩盖故障。


    民航在安全方面有着当之无愧的声誉。这在一定程度上源于一种丰富的“未遂事件报告”文化，比如美国联邦航空署热线邀请乘客、空中交通管制员和公众举报事故，而且如果他们愿意，可以匿名举报。


    美国国家运输安全委员会的公开报告在促进交通改进方面受到信任并具有影响力，该委员会对伤亡事故进行了彻底调查。此外，航空安全报告系统可以“收集机密报告，分析得出航空安全数据，并向航空界传播重要信息”。这些公开报告系统是
    HCAI 系统的良好模型。


    美国食品和药物管理局的不良事件报告系统为公开报告 HCAI 系统的问题'
