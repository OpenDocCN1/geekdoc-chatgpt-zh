- pgno: 260
  md: '3. 事故回溯性分析：当事故发生时，经验丰富的独立监督审查可以向公众保证，正在解决导致故障的问题。


    怀疑论者指出，独立监督方法的失败，有时可能是因为缺乏足够的独立性，但这种方法的价值得到了广泛认可。


    独立监督委员会会旨在对文件进行仔细审查，并与关键人员进行面谈，以编写有据可查的报告，其评估得到所有利益相关者的认可。在大多数情况下，这些报告都对已查明的问题或严重事故提出短期和长期补救措施建议，并附有一些规定以核实这些建议是否在
    3、6 或 12 个月内得到遵守，其目标是提高被监督对象的表现。由于委员会成员具有多次审查的经验，他们可以跨组织甚至跨行业传递知识，同时提供指导未来系统设计的信息，并将其纳入教育课程。


    # HCAI 可信度的评估


    将评分和评估方法应用于 HCAI 系统需要创新的方法，以实现透明度，并更好地定义所需的质量。越来越多的研究人员、开发人员、管理人员和政策制定者提出了强有力的道德基础，以确保负责任或可信赖的人工智能系统，追求公平性、问责制、透明度、可说明性和可解释性。此外，他们还提出了更多的属性，如表
    25.1 中所列，但对衡量标准、评分方法或评估过程尚未统一。


    令人担忧的是，关键系统在应用时往往缺乏评估手段。创新的压力巨大，宣称取得成功的豪言壮语屡见不鲜，但当研究系统走出实验室应用于现实世界时，往往会失败。过往的失败人尽皆知，例如谷歌流感趋势的误导性预测、金融系统的崩溃、人脸识别的偏见和攻击性聊天的机器人。这些问题仍在持续发布，正如谷歌的
    33 名员工和 7 名外部研究人员所指出的，他们发布了一份令'
