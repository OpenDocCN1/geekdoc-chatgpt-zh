  md: '# 第 26 章


    # 照顾老年人并向他们学习


    关心年长的父母、祖父母、家庭成员和朋友是一种美德，这对所有人来说都是一种丰富的体验。然而，当老年人需要帮助来维持他们的生活时，这就需要家人做出严肃的承诺，这通常会导致老年人搬到能够支持他们日常生活的场所。历史上，多代同堂的家庭是一种文化，其中受人尊敬的老年人积极参与家庭中的各类大小事务，分享他们的智慧，并在需要时得到照顾。然而，现如今在许多国家，只有不到
    10% 的家庭是多代同堂，绝大多数老年人独自生活，或者生活在辅助生活型住房，或者如果需要定期的照顾，就住在养老院。


    照顾者需要安排他们的时间计划，投入时间，并在紧急情况下保持时间的灵活性。照顾老年人是一项长期的工作，对所有照顾者来说，这会使其在情感上感到满足，但当面对慢性病和痴呆症患者需要更细致的照顾时，这项工作就更具挑战性。照顾者也需要得到关心和支持，比如当需求增加时，则需要家人的支持和协助。美国退休者协会等组织提供了关于照顾老年人的指导和资源。


    那么作为照顾者，他们能从照顾他人的过程中得到什么呢？前谷歌德学家、观爱丁堡大学的哲学家香农·瓦洛（Shannon Vallor）写道，照顾可以“被理解为一种亲自满足他人需求的活动……照顾好他人并不容易。我们必须学会如何在正确的时间和地点以正确的方式进行照顾”。她专注于照顾他人的美德和好处，因为它教导了“互惠的意义和重要性……通过'
  merge: -1
  img_proc: true
- pgno: 266
  md: '陪伴他人来学习，我们相信总有一天会有人陪伴我们……照顾他人也能培养……同理心，建立一种能让我们为他人产生情感联系并为他人‘承担烦恼’的情感纽带”。


    瓦洛对社交机器人（她将其称之为“护理机器人”）向老年人提供一些服务的可能性持开放态度，但她也发现了一些问题，即社交机器人的局限性，以及当老年人不再需要家人、朋友和专业护理人员时，会与他们失去情感上的联系。然而，除了护理机器人之外，还有其他的技术支持选择，这些选择可以更好地让老年人自己做更多的事情。设计良好的设备可以提高老年人的自我效能，为其提供精神刺激，并让其与照顾者相处的时间更多地用于满足情感需求或享受更丰富的体验。尽管许多面向老年人的设计指南都集中在移动设备和网络应用程序上，但是
    HCAI 物理设备的发展越来越快，这开辟了新的可能性。


    照顾老年人仅仅是本章内容的一部分，另一部分是其他人如何向老年人学习，他们的经验、知识和技能对许多成年人、青少年儿童都具有吸引力。对那些希望与他人建立联系的老年人来说，指导、教导和合作也是很有吸引力的。老年人和年轻人的能力结合可以形成一个强大的团队。就像来福车（Lyft）、优步（Uber）、任务兔（TaskRabbit）和五美元网（Fiverr）等临时工作经济服务平台能够将需要工作的人与能够完成工作的人相匹配一样，HCAI
    也可以将老年人与提供所需服务的个人和社区团体相匹配。通过人工智能推荐算法，可以根据老年人的年龄、健康状况、兴趣、个人经历以及向他们寻求学习的人的兴趣进行匹配。


    对于老年人来说，和年轻人合作意味着他们必须有良好的健康状况，且是一个可靠的合作伙伴。老年人必须作为跨代家庭的一分子或独立生活以管理日常生活中的活动。许多老年人寻求安度晚年的居所，以确保自己熟悉环境，保持与朋友和社区服务的联系，并能够生活自理。美国疾病控'
