- pgno: 37
  md: '页献者在世界各地举办过展览，他们的作品被各大美术馆和博物馆收藏。布朗使用不断改进的生成模式并寻求“自我创造”的艺术，他的书籍和展览让他被列为艺术家。埃德蒙兹也是一位受人尊敬的计算机科学家，他追求的是随着艺术欣赏者的不同而变化的交互式艺术体验。他利用计算过程“扩展、放大他的创作过程，而并非取代它”。同科恩一样，埃德蒙兹在2017年也获得了国际图形图像协会数字艺术终身成就奖。


    当前的人工智能艺术创作者将他们的工作视为向前迈出的一步，因为他们创造了更宏伟的图像，这甚至让程序员感到惊讶。像亚历山大·莫德文采夫（Alexander Mordvintsev）等艺术家创造了一种神奇的东西，他们的生成式对抗网络（GAN）使用了机器学习算法，通过一组图像的训练，程序就可以自主创作新的图像。莫德文采夫的
    DeepDream 程序生成了一些有趣但有时令人不安的图像：畸形的动物长着多个头，眼睛透过毛茸茸的四肢看过去，并与背景融合在一起，这是我们对现实认识的挑战。


    虽然科恩认为 AARON 能够自主地产生惊人的图像，但他告诉我，他才是这些艺术品的创造者。虽然强大的算法和技术为艺术家提供了新的艺术创作方式，但艺术家仍然是创作激情的源泉。AARON
    的作品和最近的人工智能艺术作品通过拍卖获得了关注，但收益和版权仍归艺术创作者本人所有。


    计算机生成的音乐也引发了激烈讨论，即音乐是由人类程序员制作还是由人工智能驱动的计算机程序制作的。长期以来，计算机音乐算法一直能够生成巴赫（Bach）、甲壳虫乐队（Beatles）、莫扎特（Mozart）或麦当娜（Madonna）等风格的新音乐，但对于这一功劳应该归于创作者还是算法，批评者们意见不一。一些经过流行歌曲数据库训练的算法会生成歌词和音乐，给人一种更丰富的创新感。然而，爵士演奏家、音乐治疗师丹尼尔·萨里德（Daniel
    Sarid）等音乐家认为，这些探索是“了解人类认知和审美组织以及音乐语言构成的有趣练习，但与艺术无关”。萨里德建议作曲家'
  merge: -1
