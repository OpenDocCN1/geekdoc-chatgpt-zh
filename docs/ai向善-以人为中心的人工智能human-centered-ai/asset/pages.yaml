    成目标的方式获取了控制权。具备 HCAI 思维模式的设计师强调不同用户都能够引导、操作、控制高度自动化设备的策略，同时邀请用户发挥创造力来改进设计。设计良好的自动化设备可以确保更精细的人工控制，例如外科手术机器人使外科医生能够精准切开人类难以触及的器官。


    成功的技术使人类能够在跨学科团队中工作，从而与上级、同事和下属进行协调和协作。由于人类要对自己使用的技术行为负责，他们更倾向于采用在控制面板上显示当前状态的技术，这可以为用户提供预测未来行为的心智模型，并允许用户暂停他们无法理解的行为。设计良好的用户界面以减少工作量、增强性能、提高安全性的方式为人类活动提供重要支持。如第
