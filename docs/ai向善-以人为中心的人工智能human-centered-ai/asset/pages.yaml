  md: '医疗健康中的算法偏差可能会导致治疗方面的巨大差异，一项研究发现：“获得医疗服务机会的不平等意味着我们在照顾黑人患者上花的钱比照顾白人患者花的钱要少。”该报告声称，“弥合这一差距将使获得额外帮助的黑人患者比例从
    17.7% 提高到 46.5%”。


    长期存在的性别偏差在计算领域再次出现，该领域努力增加女性学生、教授和专业人士的数量。女性较少参与研发可能源自系统对偏见的考虑不足，这在招聘、教育、消费服务和抵押贷款申请方面都已经发生过。限制这种偏见对提高公正性至关重要。


    将道德原则和偏见意识转化为行动是一项挑战。开发团队可以从训练数据集的深入测试开始，以验证数据是最新的并具有给定环境的代表性记录分布。这样就可以测试过去表现中的已知偏差，但除了检测偏差之外，还可以采用减轻偏差的标准方法，从而使未来的决策更加公正。学术研究人员提供了提高公正性的干预措施，比如避免性别、种族或年龄影响招聘决定。一些公司正在开发用于检测和减轻算法偏差的商业级工具包，比如国际商业机器公司的
    Fairness 360。这些案例是一个良好的开端，但更好的方式可能是由开发团队任命一个偏差测试负责人，负责对训练数据集和程序本身进行评估。偏差测试负责人将分析当前的研究和行业实践，并回应询问和担忧。测试用例库可以验证
    HCAI 系统是否有明显的偏差。持续监控使用情况并将报告返回给偏差测试负责人将有助于提高公正性。然而，由于开发团队可能不愿意承认他们的 HCAI 系统中的偏差，团队之外的人也需要监控和审查报告（参见第
    20 章安全文化管理实践）。


    这些建设性的步骤是一个积极的迹象，但随着面部识别等应用越来越广泛地用于治安工作和商业应用，偏差的持续存在仍然是一个问题。对性别、种族、年龄等进行简单的偏差测试有助于建立更准确的面部数据库，但在研究数据库的交叉点（如黑人女性）中，问题仍然存在。在期刊出版'
