  md: '# 第 15 章


    # 确定的自主性和控制中心


    计算机自主性是许多人工智能研究人员、开发人员、记者和推广人员所追求的一个有吸引力的科学目标。过去关于计算机自主性的描述，正在被更加强调确定性和自主性的讨论所取代，这与越来越多的团队和个人开始使用控制中心形成了对比（图
    11.1）。


    计算机自主性已成为一个广泛使用的术语，用来描述独立运行的机器，而不直接受人类控制。美国国防科学委员会给出的定义如下：


    自主性是将决策授权给被授权实体，并在特定的边界内采取行动。一个重要的区别是，一个受规范制度约束且不允许许偏差的系统是自动化的，而非自主的。要实现完全自主，系统必须有能力根据其对世界、自身和情况，基于知识和理解，生成不同的行动方案并做出选择，以实现目标。


    然而，美国国防科学委员会提醒说：


    不幸的是，“自主”这个词经常在媒体以及一些信息化军事领导人的思维中被误解为计算机能够独立决策和不受控制的行动……需要明确的是，所有的自主系统都在某种程度上受到人类操作人员的监督，并且自主系统的软件中设定了对计算机行动和决策的限制……因此，自主性本身并不能解决任何问题。'
  merge: -1
  img_proc: true
- pgno: 123
  md: '这一提醒强调了一个现实，即让人类和机器嵌入在复杂的组织和社会系统中相互依赖也成了一个重要的目标。既然人类仍然是负责任的行为者（在法律上、道德上、伦理上），难道计算机不应该以确保用户控制的方式设计吗？组合设计的立场是，如果某些功能是可理解的、可预测的和可控的，那么它们就可以是完全自主的，同时也要让用户控制那些不可靠的或重要的功能。


    虽然人们对完全自主系统的热情仍然很高，并可能将其作为一个有价值的研究目标，但其实际应用效果一直令人担忧。自主的高速金融交易系统已经造成了数十亿美元的金融事故，但更令人担忧的是一些自主系统产生的致命后果，比如爱国者导弹系统在伊拉克战争期间击落了两架友军飞机，2016
    年一辆特斯拉汽车在自动驾驶状态下发生碰撞。更悲剧的例子是2018 年末和 2019 年初波音 737 MAX 的坠机事故，该事故由自主的机动特性增强系统引起，该系统甚至在未通知飞行员的情况下，接管了对飞机的一些控制权。


    得州农工大学教授罗宾·墨菲（Robin Murphy）的自主机器人定律揭示了自主性带来的一些问题：“任何机器人系统的部署都无法达到目标的自主水平，从而导致或加剧了与人类问题解决者协调的不足。”


    那些在现实中支持创新目标的人一再强调了计算机完全自主的危险。1983 年的一篇早期评论揭示了自主性的讽刺之处，它不但没有减轻操作人员的工作量，反而增加了他们的工作量，因为需要持续监控自主计算机。操作人员陷入了一种忧虑的境地，因为他们不确定计算机将会做什么，却要对结果负责。


    此外人类还担忧在无事可做时难以保持警惕，当问题出现时迅速接管工作的挑战以及在需要接管业务时保证技能熟练度的困难。这些关于警惕、快速过渡和操作员去技能化的讽刺仍具有现实意义，因为操作人员要对结'
  merge: -1
