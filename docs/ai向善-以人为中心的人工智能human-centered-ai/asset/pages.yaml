  md: '# 第 13 章


    # 智能代理和超级工具


    到了 20 世纪 40 年代，随着现代电子数字计算机的出现，人们开始将其描述为“了不起的思考机器”和“电子大脑”。乔治华盛顿大学教授黛安·马丁（Dianne
    Martin）在对调查数据的回顾中表达了她的担忧：“过去 25 年的态度研究表明，‘了不起的思考机器’的神话实际上可能阻碍了公众在工作环境中对计算机的接受，同时夸大了对于解决复杂社会问题的轻松解决方案的不切实际期望。”


    1950 年，艾伦·图灵（Alan Turing）在他的论文“计算机器与智能”（Computing Machinery and Intelligence）中提出了一个问题：“机器能思考吗？”这引发了人们的极大兴趣。他提出了著名的图灵测试或模仿游戏。他仔细地分析并列举了反对意见，但他在结尾写道：“我们可能希望机器最终能够在纯智力领域与人类竞争。”许多追求科学目标的人工智能研究人员已经接受了图灵的挑战，他们开发出了能够执行人类任务（例如下棋、理解图像、提供客户支持）的机器。图灵测试的批评者认为它是一种无用的干扰或宣传噱头，且测试的规则描述也不清楚，但自
    1990 年以来，罗布纳奖（Loebner Prize）通过奖励获奖程序的开发者而吸引了参与者和媒体的关注。《人工智能杂志》（AI Magazine）2016
    年 1 月刊专门刊登了许多介绍新型图灵测试的文章。都灵大学的媒体理论学家西蒙娜·纳塔莱（Simone Natale）认为图灵测试是一种陈腐的骗局，它利用了人们愿意接受模拟意图、社交和情绪设备的倾向。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '1960 年，J. C. R. 利克莱德（J. C. R. Licklider）对“人机共生”的描述中反映了一个更早、更微妙的愿景，他承认人类和计算机之间的差异，但也指出两者将是协作交互的伙伴，计算机负责执行例行工作，而人类则具有洞察力和决策能力。


    聪明、智能、知识丰富和思考等术语的广泛使用有助于传播诸如机器学习、深度学习等术语，并使人们相信计算机正在接受训练。将人脑描述为神经网络的神经科学观点被广泛运用为描述人工智能方法的隐喻，进一步传播了计算机与人类相似的概念。


    国际商业机器公司采用了“认知计算”这个术语来描述他们在 Watson 系统上的工作。然而，国际商业机器公司的人工智能转型设计总监在 2020 年的报告中表示，这个术语“对于人们来说过于混乱，难以理解”，并补充说：“我们说的是人工智能，但即使如此，我们也将其阐述为增强智能。”长期以来，谷歌一直以其在人工智能领域的强大实力为自豪，但他们目前的努力着重于“人与人工智能研究（PAIR）”。越来越多追求创新目标的人们认识到，在商业产品和服务中，提及计算机智能应该与以人为中心的方法相结合。


    记者们经常热衷于支持计算机思考和机器人取代我们工作的观点。流行杂志上曾出现过以计算机为主角的封面故事，例如 1980 年的《新闻周刊》报道了“会思考的机器”，1996
    年的《时代周刊》（Time）问道：“机器会思考吗？”


    平面艺术家们一直渴望展示会思考的机器，尤其是具有类似人类的头部和手部的机器人，这强化了计算机和人类相似的想法。常见的主题是机器人伸出手去握住人类的手以及机器人采取奥古斯特·罗丹（Auguste
    Rodin）的《思想者》雕塑的姿势坐着。好莱坞电影作为大众文化形式，也塑造了具有感情的机器人角色，例如 1968 年的电影《2001 太空漫游》'
