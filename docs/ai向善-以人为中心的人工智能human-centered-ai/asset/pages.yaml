    名参与者做出教育选择，如课程、实习或研究项目，以实现他们的目标，例如行业工作或研究生学习（图 19.6）。参与者希望选择与他们在性别、学位课程和专业方面相似的学生以及上过相似课程的学生。结果显示，当他们控制推荐系统时，他们花费的时间更长，但他们更有可能理解和遵循推荐。正如一位参与者评论的那样：“高级的控制功能使我能够得到更精确的结果。”'
