- pgno: 39
  md: '# 第 4 章


    # 自动化、人工智能和机器人会导致大规模失业吗？


    第三个讨论的问题涉及自动化、人工智能和机器人是否会导致大范围的失业。马丁·福特（Martin Ford）在 2015 年出版的《机器人来了》（The Robots
    Are Coming）等书籍中也表达了这一担忧；牛津大学的一份报告指出，到 2030 年，美国将有 47% 的工作实现自动化。然而，尽管自动化、人工智能和机器人得到普及，但美国
    2020 年的失业率仍保持在 4% 以下，这表明大范围失业的荒谬说法明显是错误的。随后，新冠疫情的爆发导致了惨烈而广泛的影响，失业率因此上升。到 2021
    年，疫苗开始控制新冠病例的增加，失业率再次开始下降。


    2012 年，亚马逊收购了 Kiva Robotics 公司，许多人猜测亚马逊将裁减 125 000 名员工。但到 2021 年，尽管机器人的使用有所增加，亚马逊的员工人数却超过了
    100 万。尤其是在新冠疫情期间，需求的急剧增长更为极端，这一现象导致供应链、订单履行中心、配送网络的劳动力需求大幅增加。亚马逊精心设计的电子商务网站和低廉的价格给人们带来了许多好处，这也是需求增加的原因。虽然亚马逊因其反对工会的行为而受到批评，但它领导了许多公司向员工提供
    15 美元的最低时薪，尽管亚马逊往往会减少一些员工福利。一些有关苛刻的工作条件和受伤率比其他公司更高的报道，导致许多消费者拒绝在亚马逊购物。尽管有许多潜在员工在等待就业机会，但争议仍然存在，抗议者甚至出现在亚马逊物流中心。人们不知道的是，'
  merge: -1
  img_proc: true
- pgno: 40
  md: '有多少名小商店员工失去了工作，就有多少当地供应商和制造商因为亚马逊巨大的网络销售而增加了工作岗位。没错，虽然这些变化是破坏性的，但对整体就业的影响不明显，而且有利于消费者，并促进了商品销量。


    另一个困境是，失业率并不是一个完美的衡量标准，因为它没有把已退出就业市场的人计算在内，也把越来越多享受低福利低工资的工人排除在外。企业所有者可能更关心的是市场估值而不是利润，因此他们的目标是薄利多销，而非改善员工待遇。


    自动化似乎加剧了财富的集中，导致了不平等问题日益严重，这对受教育程度较低的工人影响最大。以员工待遇为代价来实现销量增长，是自动化程度提高所带来的严重危害。亚马逊一直反对引入工会，过去的工会让工人获得了更好的薪酬、工作条件、医疗保险，以及儿童保育、带薪假期和养老金等福利。因此，核心问题是如何更合理地分配自动化带来的利益。


    从古登堡（Gutenberg）发明印刷机导致抄写员失业开始，几百年来，自动化一直在取代某些岗位的工作。然而，自动化通常会降低成本，提高质量，从而引发需求的大幅度增加，进而扩大生产以应对不断增长的市场，造福于更多人。生产的扩大、分销渠道的拓宽、产品的新颖性会促进就业。低成本书籍开拓了更大的市场，图书发行和销售网络也随之增长，人们的识字率也大大提高了。书籍产量增加的另一个好处是，满足了作者的写作需求，这也导致了一些创造性表达、宗教争议和政治动荡。书籍是一种强大的颠覆力量，它们通常被视为教育、商业、健康等领域的加速器。


    基于人工智能的自动化引发了一些混乱，这种混乱遵循一种熟知的历史模式，也让人们对前所未见的大规模失业表示担忧。在我和许多经济学家看来，这一次的影响将比以往任何时候都更严重的说法似乎是没有说服力的。1900
    年，农业人口占就业人口的 40%，但现在只有 4%，但我们并没有看到 36% 的失业率。在农业综合企业、庞大的食品分销网络、加工食品'
  merge: -1
  img_proc: true
- pgno: 41
  md: '制造商的供应商中，就业人数有所增加，而不是所有的人都从事农业食品生产。超市里摆满了各种各样价格合理的农产品和包装产品，它们创造了新的就业机会。此外，分别面向富人和穷人的餐馆也创造了新的就业机会。但是，令人担忧的是，自动化的急剧增长已经很大程度地加剧了不平等现象，且目前不平等已经上升到令人不安的水平。


    随着人们对社交机器人的热情日益高涨，人们对机器人流程自动化的兴趣和恐惧都急剧增加，它延续了会计和后台自动化的悠久历史，即机器取代了华尔街的股票市场交易员和支票清算文员的工作。机器人流程自动化仍在推动更多的会计和文书工作自动化，这对受影响的人来说是痛苦的，这一次与之前自动化浪潮的规模相当。竞争的压力是现实的，但交易成本的降低对许多人来说是有利的。受人尊敬的社会公益型公司可以向这些失业工人分享自动化的益处，并给他们提供更好的工作培训或帮助他们在其他地方找到工作。


    对技术大革命影响的夸大至少可以追溯到早期的电报业、汽车业和航空业。1970 年，阿尔文·托夫勒（Alvin Toffler）的国际畅销书《未来冲击》（Future
