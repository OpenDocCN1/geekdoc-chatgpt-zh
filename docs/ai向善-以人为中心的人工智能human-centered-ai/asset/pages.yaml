  md: '# 第 17 章


    # 总结及怀疑者的困境


    > > 我们的语言中最具破坏性的一句话是：“我们一直都是这样做的。”

    > > 美国海军格蕾丝·霍珀（Grace Hopper）


    简化人工智能研究目标的研究只集中在两个方面。第一个方面是基于人工智能的科学目标，即通过设计、构建和测试基于人类智能的系统来研究智能计算代理。通常，科学目标是了解人类的感知、认知和运动技能，从而制造出与人类表现相当或超过人类表现的计算机。第二个方面是创新目标，旨在以人工智能工程为基础，进行
    HCAI 研究，开发成功和广泛使用的商业产品和服务。两者都做出了有价值的贡献，研究人员应该追求更多的社会效益。这些贡献可以通过设计思维来加强，以提高用户体验、控制面板以及信息丰富的视觉显示设计的突出性。


    开发人员经常讨论如下四对设计隐喻：


    +   1. 智能代理和超级工具；

    +   2. 队友和远程机器人；

    +   3. 确定的自主性和控制中心；

    +   4. 社交机器人和有源设备。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '成功的设计似乎来自一种组合策略：将执行机器能产生可靠结果的任务自动化，同时留给用户重要的创造性或安全性选择。数码相机就是一个很好的例子，它使用自动化的方法来选择光圈、快门速度和防抖，同时允许用户对照片进行构图，设置缩放，并在他们对图像预览感到满意时点击拍摄。


    社交机器人仍然是一个受欢迎的目标，但它们在商业上的成功远不如有源设备或远程机器人。科学目标激励了许多社交机器人研究人员，并引发了广泛的公众兴趣。


    强大的人工智能方法包括深度学习、推荐系统、语音识别、图像理解和自然语言处理。成功的产品通常依赖于将这些人工智能方法与用户体验设计方法相结合，包括收集用户需求、迭代设计、用户体验测试和指南合规性。还有一些原则也能产生成功的结果，例如支持人类的自我效能、鼓励人类的创造力、明确责任和促进社会联系。


    虽然批评者告诉我，将科学目标和创新目标分开考虑的思路远非完美，但这种简单的二分法有助于设计师理清不同的思维方式，进而能够考虑这两个分支。任何一个分支的狂热爱好者可能都不愿意考虑组合设计。然而，对比鲜明的观点往往暗示了新的可能性，并阐明设计思维。对于那些看到这两个目标以外的其他目标的人，请遵循它们，因为多样性可以带来新的思考。


    许多研究人员和企业家相信，社交机器人将成为我们未来的队友、合作伙伴和合作者。我希望他们考虑本章中的替代方案。那些认为社交机器人是一种必然的人，将从研究历史和失败原因中受益，以找到成功的例子，比如语音用户界面、医疗人体模型和碰撞测试假人。也许致力于社交机器人的大型群体会在设计超级工具、远程机器人、控制中心和有源设备中得到满足，这些设备给用户提供了清晰的理解、可预测的行为，以及一些用于满足已识别的人类需求的控制。'
