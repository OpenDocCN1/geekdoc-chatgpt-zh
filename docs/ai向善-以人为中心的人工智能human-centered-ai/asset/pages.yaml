- pgno: 261
  md: '人担忧但耐人寻味的报告，报告中坦率地描述了机器学习模型“应用到现实世界的领域时，常常表现出意想不到的不良行为”。他们的开放态度是一个积极的信号，这将鼓励人们更多地关注评估
    HCAI 系统的可信度和其他属性。


    许多 HCAI 系统的属性密切相关。责任性、安全性、可靠性、准确性和公正性都是相辅相成的。同样，透明度、可解释性和可用性似乎也描述的是同一个属性，然而每个术语都被不同的特定群体使用。要开发一个可信的评估过程，至少需要采取四个步骤：定义、方法、评估者、受众（表
    25.2）。所有这些步骤都需要时间才能达成共识，但这对研究人员和开发人员来说是一个挑战。


    # 表 25.2 HCAI 可信度的评估流程


    | 定义 | 商定使用一组较小、有明确定义、可以评估的术语，可能的话，按组成部分评分。 |

    |---|---|

    | 方法 | 考虑如何至少使用以下方法进行评估：<br>• 对代码本身和机器学习训练数据的静态分析<br>• 系统在基准测试中的性能<br>• 系统在实践中的表现<br>•
    利益相关者的主观感受<br>• 内部或外部专家的审查 |

    | 评估者 | 决定由谁来做评估，每个小组需要多少人。候选评估人员包括有能力对评估做出贡献的人：<br>• 系统的开发人员，尽管他们可能有先入为主的观念<br>•
    未参与过类似系统的知识渊博的开发人员<br>• 使用该系统的项目管理人员<br>• 受系统行为或预测影响的系统用户<br>• 熟悉类似应用的独立监督审查员
    |

    | 受众 | 决定谁是评估的受众。候选人包括可能从评估中受益的利益相关者：<br>• 系统的开发者，他们能够改进系统<br>• 类似系统的知识渊博的开发人员，他们可能会从经验中受益<br>•
    使用该系统的项目管理人员，他们可能会修改其使用流程<br>• 受系统行为或预测影响的系统用户或其代表 |'
