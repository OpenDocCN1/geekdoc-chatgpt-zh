- pgno: 29
  md: '类才是责任方。让用户预测将要发生的事情的一种有效方法是直接操作设计——对象和动作在屏幕上显示；由人类选择执行哪些动作；操作和对象都是可见的。用户把文件拖进垃圾桶，一声提示音表明文件已删除。触摸屏幕的捏合、点击和左右滑动也可以变得很自然。视觉界面可以提供概览，允许用户放大他们想要的，过滤掉他们不想要的，然后按需获取详细信息。因此，在可能的情况下，人类是受控的，计算机是可预测的。


    人们希望有反馈信息，以便知道他们的意图正在被计算机执行。他们也想知道计算机下一步会做什么，并有足够的时间停止或改变其动作。这就解释了为什么对话框里有一个“取消”按钮，这样就有一种方法来停止你不希望进行的操作，并返回到先前状态。


    自主设计的拥护者通常认为机器会做正确的事情，他们对提供足够的反馈几乎没有兴趣，甚至对记录活动以支持对故障的回顾性审查更没有兴趣。效仿民用航空是一种更好的策略，在每个机器人中安装一个“飞行数据记录器”，添加审计跟踪模块，也称为活动日志或产品日志。当在处理结果和生命攸关的应用程序时采取适当的保守手段，能够对故障和未遂事件进行回溯性分析，以供审查使用。


    随着人工智能驱动系统的缺陷出现，人们对其完美性的信念被打破，人工智能研究人员被迫解决诸如对抵押贷款申请或假释申请的评估偏见等问题，他们开始考虑公正性、问责性、透明度、可解释性等其他设计特征，让开发人员、管理人员、用户和律师更好地了解正在发生的事情，而非之前的黑匣子。好消息是，越来越多的人工智能研究人员正在转向经验主义思维，着手研究如何发现偏见、何种解释是成功的，以及什么样的申诉补救方法效果更好。


    HCAI 群体信奉经验主义，因此他们倾向于设计以用户为中心的系统。HCAI 设计师首先观察用户在家中和工作场所的表现，采访用户以获得他'
  merge: -1
