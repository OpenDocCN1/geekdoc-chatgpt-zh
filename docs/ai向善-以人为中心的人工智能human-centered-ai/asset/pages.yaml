- pgno: 247
  md: '率（0~100%）这一指标指的是，与用户查询相关且被检索到的文档占所有相关文档的百分比。例如，70% 的召回率意味着，如果检索到 35 个相关文档，那么数据集中还有另外
    15 个同样相关但未检索到的文档。


    对于精度和召回率的测量，需要对数据集中的文档是否与每个被测查询具有相关性进行标记，这需要耗费大量的精力，因此，这一方法无法用于网络规模的集合。然而，一种基于样本的新评估方法的发展使文本检索会议组织者每年能够完成
    5 到 12 项搜索任务，涵盖健康、法律、社交媒体等其他数据集。会议也开始涉及不同的任务，如交互式检索、过滤、推荐、总结、问题回答和数据增强。随着会议规模的扩大，每年有来自几十个研究小组的
    100 多人参加会议，从而产生了数百篇论文，加速了研究和商业发展。虽然每年的成本约为 100 万美元，但在商业系统上的成功应用预计可带来数亿美元的回报。


    一年一度的可信度会议可以通过制定基于精度和召回率的可信度衡量标准来推进 HCAI。会议已经对某些主题的可信度进行了数值测量，例如类似于信息检索任务的人脸识别精度，但其他
    HCAI 属性（第 25 章）将需要新的测量方法和地面真值数据来比较算法，正如乔伊·博兰维尼（Joy Buolamwini）和蒂姆尼特·盖布鲁（Timnit
    Gebru）成功地展示了人脸识别算法的种族和性别偏见。在人工智能研究群体，自然语言处理的经验方法会议常致力于大数据集算法的严格研究，并不断发展以包括用户性能。其他涉及用户研究的
    HCAI 会议正在从交流和对话研究、机器翻译和计算语言学等领域中兴起。


    一些期刊编辑也发表了一些被视为不负责任或不道德的人工智能论文而受到质疑，例如，人脸识别算法可以识别犯罪意图、个性或政治倾向。颅相学理论假定头部和头骨形状决定了行为和态度，这些失信的颅相学理论被普遍认为是不负责任的，且会导致不当使用。但是，那些有争议的、'
  merge: -1
