    聊天机器人的开发人员的共同愿望是让客户能够支持回答有关产品和服务的问题，如晚餐预订、银行规则、旅游或电子商务。早期的版本虽存在缺陷，但持续的努力表明，聊天机器人的文本使用界面将会出现一些长期存在的角色，即使这些角色仅用来识别用户需求，并引导用户找到正确的人类客服代表。聊天机器人头像的存在或缺失也会对短期的接受程度造成影响，但是否能够长期使用还值得进一步研究。与语音用户界面一样，类似人类的个性特征在一定程度上受到了赞赏，这似乎与接受度好坏参半的具身社交机器人不同。然而，即使是用吸引人的隐喻定义的客服聊天机器人，也必须像语音控制的虚拟助手一样，提供真正的价值。与回答问题、播放歌曲或寻找网站相比，参与对话更具挑战性。'
