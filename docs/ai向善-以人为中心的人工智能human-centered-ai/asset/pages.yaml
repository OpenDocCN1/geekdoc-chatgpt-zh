  md: '距”，为其他公司提供了一个良好模型：


    +   ①范围：确定项目和审计范围；提出风险问题。

    +   ②映射：创建利益相关者映射和协作者联系清单；进行访谈并选择指标。

    +   ③工件收集：文档设计过程、数据集和机器学习模型。

    +   ④测试：进行对抗性测试，以探测极端案例和故障可能性。

    +   ⑤反思：考虑风险分析、故障补救，并记录设计历史。


    该模型包括审计后自我评估总结报告和跟踪执行的机制。然而，该团队很清楚，“内部审计只是一个需要质量检查和平衡的更广泛系统的重要方面之一”。


    脸谱网的监督委员会是企业最初努力的一个案例，该委员会于 2020 年年中成立，负责其平台上的内容监控和管理。微软的人工智能和工程与道德研究委员会就负责任人工智能的问题、技术、流程和最佳实践向领导层提供建议，这些“值得人们信任”。微软的负责任人工智能办公室对公司范围内的管理、团队准备和处理敏感用例实施了相应的规则。该办公室还帮助塑造新
    HCAI 方法相关的“法律、规范、标准……为了整个社会的利益”。


    # 行业标准实践的一致性评估


    在重要和生命攸关的行业中，都有既定的行业标准，这些标准通常由专业协会颁布，如先进自动化协会。先进自动化协会成立于 1974 年，其前身是机器人工业协会，并与美国国家标准协会合作，通过制定供其成员使用的自愿共识标准来推动“创新、增长和安全”。他们在先进自动化方面的工作是其他形式的
    HCAI 的模型。'
