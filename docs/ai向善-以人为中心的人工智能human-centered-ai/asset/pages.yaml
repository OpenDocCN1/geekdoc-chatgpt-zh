- pgno: 248
  md: '带有宏伟承诺的文章，甚至引起了备受尊重的期刊的注意。


    对社会影响的关注度提升是一个进步，但许多研究人员认为这超出了他们的知识范围或关注范围。这种争议反映越来越多关于责任研究和论文的公开讨论中，比如《责任创新杂志》（Journal
    of Responsible Innovation）。虽然一些基础研究人员认为他们应该自由地追随自己的兴趣和好奇心，但越来越多的人意识到，与其他合作伙伴在实际问题上合作，会带来有效的实际解决方案和更强的基础研究。


    现有的数十种期刊都增加了关于道德和 HCAI 的特刊，同时新的期刊也开始为日益增长的兴趣和需求服务。期刊论文和在线档案（如 arXiv）的发展已经改变了出版业。向公众开放的访问策略越来越普遍，世界各地的读者都可以免费阅读。由于
    arXiv 无须审查，因此用户可在一夜之间获取所有的出版物，这加快了热门话题的研究速度。


    期刊和专业协会都有涵盖其工作的道德准则，但更有针对性的方法可能是一个 HCAI 论文清单，其中包含以下问题：研究问题是否合理？训练数据是否公正？是否使用了适当的编程和测试方法？声称的内容与实际工作内容是否一致？此外，还可以制定一个写作风格指南，以限制汉娜·沃勒克（Hanna
    Wallach）所说的“不谦虚”和“过度营销”，同时确保论文充分讨论局限性、利益冲突和更广泛的影响。此外，难以确保研究传统的可重复性也是一个现存的问题，这意味着其他研究人员难以进行相同的研究，以验证他们是否得到同样的结果。许多论文依赖于大型的特殊程序、庞大的数据集和专门的硬件，这使得其他群体，尤其是学术群体很难再现结果。


    研究的终极困难是，越来越多的人认识到，当结果应用于不同背景下的实际问题时，这些结果可能无法转换。arXiv 上的一篇论文，由 33 名谷歌员工和 7 名其他专业人士发表，将该问题标注为“规范不足”，论文作者将其描述为程序在配置后表现不佳。他们提醒说：“在机器学习的现代应用中，'
  merge: -1
