  md: '杜克大学的辛西娅·鲁丁（Cynthia Rudin）提出了一个措辞强烈的理由，即“停止解释黑盒机器学习模型”。她发现了一些巧妙的方法，使机器学习模型更易于解释，用户就能了解其工作原理。这是一种有价值的方法，追求的根本目标是防止需要事后解释的混淆。


    # 防止解释需求


    虽然事后解释可能会有所帮助，但研究人员在 30 年前曾在基于知识的专家系统、智能辅导系统和用户界面帮助系统中尝试过这种策略。然而，他们难以弄清楚困惑的用户想要什么样的解释，这催生了防止或至少减少解释需求的策略。最受欢迎的策略是提供逐步解释的过程，在做出最终决定之前解释决策过程的每个步骤。


    基于知识的专家系统是通过对专家决策者的规则进行编码构建的，在这种系统中，许多项目都难以提供事后解释。一系列著名的项目开始于以医学为导向的诊断系统 MYCIN，但后来扩展到不同领域的独立系统。当时在斯坦福大学工作的威廉·克兰西（William
    Clancey）描述了自己通过使用图形概述的逐步过程来追求可解释性。另一个限制解释需求变化的成功示例是基于规则的业务系统。设计师从依赖事后解释转向了一种截然不同的策略：前瞻性的设计可以让用户更好地理解过程中的每个步骤，这样就可以避免错误和减少解释需求。


    对于智能辅导系统来说，一个人类外观的角色来解释困难课程并回答问题的想法，为用户控制策略所替代，该策略强调用户正在学习的材料。比起在屏幕上放置头像而分散用户对文本或图表的注意力，最有效的策略是让学习者专注于课程本身。其他教训则是避免来自虚拟角色的表扬，让学习者更多地控制自己的教育进程，这样他们在学习课程时就会有更大的'
  merge: -1
  img_proc: true
