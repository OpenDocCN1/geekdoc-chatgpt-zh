  md: '# 致力于 HCAI 的专业组织 和研究机构


    此类别下有数百个组织，因此，如下仅简短地罗列一些典型组织。其中，部分组织可以在维基百科上找到。


    电气和电子工程师协会（IEEE），该协会发起了一项全球倡议，该倡议提出在人工智能和自主系统设计中考虑道德因素。该协会是一个孵化器，为智能技术的道德实施提供新的标准和解决方案、认证和行为准则，并建立共识。


    该协会关于人工智能及自主系统的道德考虑的全球倡议起源于大型专业工程学会，该倡议在三年多的时间里召集了 200 多人，并发布了一份有影响力的报告《道德一致的设计：将人类福祉与人工智能和自主系统优先考虑的愿景》。


    美国计算机协会（ACM），该协会是一个在计算领域拥有 10 万名成员的专业协会，一直在积极发展负责任计算的原则和道德框架。美国计算机协会的技术政策委员会提供的一份报告中包括了算法问责和透明度的七项原则。


    人工智能促进协会（AAAI），该协会是一个非营利性科学协会，致力于促进对思想和智能行为背后的机理及其在机器中的体现的科学理解。人工智能促进协会旨在促进人工智能的研究和负责任的使用。该协会经常与美国计算机协会联合举行行业会议、座谈会和研讨会，将研究人员聚集在一'
