- pgno: 220
  md: '个人的医疗保健数据将用于支持公共卫生实践，这为所有人带来了最大化的利益。这与西方的做法形成了鲜明对比，尤其是欧盟，后者优先考虑个人并强烈保护个人隐私。同样，在中国，庞大的摄像头监控系统使地方及中央政府能够跟踪到个人。这些数据有助于建立一个国家级社会信用体系，用于衡量每个人的个人经济和社会声誉。尽管一些人认为这是一个侵入式监控系统，但它为中国构建了庞大的数据库，使人工智能机器学习算法和可扩展的实现技术能够快速发展。


    然而，美国在其学术中心、当前主导多个市场的大公司、创新的创业文化方面拥有强大的资产。来自 2019 年美国白宫报告的一份高层政策声明强调了“确保人工智能系统的安全和保障，了解如何设计出可靠、安全、值得信赖的人工智能系统”的必要性。该报告强调了实现这些目标的研究，但没有描述或建议与人工智能管理或部署相关的政策或监管行动。此外，一份相关的报告进一步回避了政府监管：“私营部门和其他利益相关者可能会制定与人工智能应用程序相关的自愿性共识标准，并提供非监管的方法来管理与人工智能应用程序相关的风险，该方法可能更适应快速发展的技术的需求。”虽然这些声明表明了过去对监管的抵制，但政策可能会发生变化。


    布鲁金斯学会的达雷尔·M. 韦斯特（Darrell M. West）和约翰·R. 艾伦（John R. Allen）详细地回顾了美国政策的制定过程，指出了人工智能在意向性（形成目标的能力）、智能性（接近或超过人类能力的认知功能）和适应性（根据新数据改变行为的能力）方面的显著特征。作者认为这些技术与过去已经明显不同，因此需要政府的新举措。他们就负责任的人工智能、透明度和道德原则的必要性提出了熟悉的论点，但当通过人工智能影响评估和联邦机构相应利益相关者的顾问委员会来支持监督时，他们的言论变得更强有力。虽然他们的建议非常笼统且没有针对性，但他们是为
    HCAI 发'
  merge: -1
  img_proc: true
- pgno: 221
  md: '声的，“需要有渠道让人类对人工智能系统进行监督和控制。”


    政府研究机构的领导人已经开始抉择应该支持什么样的人工智能研究。美国国家科学基金会为国家级人工智能研究所提供了 1 亿多美元的项目经费，旨在加快“领域研究、社会转型和增加美国劳动力”。提案建议书要求调查人员在开展“使用启发型研究”的同时，解决基础人工智能研究，以推动科学和工程相关部门、经济部门或社会需求的创新，同时与工业伙伴、公共政策制定者或国际组织等外部利益相关者合作。


    这一愿景颠覆了美国国家科学基金会的大部分历史布局，该基金会在万尼瓦尔·布什（Vannevar Bush）于 1945 年的宣言《科学：无尽的前沿》（Science,
    the Endless Frontier）的指导下，主张研究资金应受好奇心驱动，而不是专注于社会需求。虽然布什具有广泛影响力的宣言受到了许多人的挑战，但该宣言仍然是许多研究人员心中的一块坚定的磐石，研究人员试图将自己从实践者、社会需求和政策话题中分离出来。


    鼓励人工智能的研究人员强调使用启发型研究，这一观点与越来越多的人所意识到的好处是一致的，所以应该与非学术组织及其研究人员进行合作。当人工智能研究人员与那些接近现实驾驶问题的人合作时，基础研究的质量才会提高，对社会的好处也将随之增加。先进社会影响研究中心、HIBAR
    研究联盟、大学 - 产业示范伙伴关系等不同组织支持这些原则，而越来越多的证据表明这种伙伴关系的影响力正在增强。


    国家级人工智能研究所的美国国家科学基金会项目将“人类与人工智能的互动与协作”作为其八个主题之一。该项目支持以人为中心的设计，鼓励关注道德、公正、隐私、非欺骗、可解释性、保护弱势及受保护人群、参与性及包容性设计，从而开发可信赖且安全的
    HCAI 系统。


    许多国家、地区联盟和国际组织也在资助研究和解决人工智能政策影响。加拿大政府通过采取算法影响评估的方式促进开发人员负责任地使用'
