- pgno: 268
  md: '伦·皮特里（ Helen Petrie ）和珍妮·达森塔斯（ Jenny Darzentas ）对以技术为中心的方法提出了警告：“干预措施往往是由技术发展驱动的，而不是由老年人的需求和愿望以及对他们生活状况的理解所驱动的。”


    HCAI 方法不是考虑什么技术合适的可能性，而是从了解老年人与年轻人、儿童的区别开始。研究人员通过观察、访谈和调查来研究用户需求，以确定主要和次要的需求，并对频繁和罕见的需求进行排序。亚伯拉罕·马斯洛（
    Abraham Maslow ）的人类需求层次理论自 20 世纪 40 年代提出以来，一直是一个杰出的模型。马斯洛的需求层次理论的底层是生理和安全需求，中层是归属感、亲密感和尊重的心理需求，顶层是自我实现的需求，以发挥个人的创造力并实现个人的全部潜能。最新的列表涵盖了基本的生存需求，例如食物、水、住所和睡眠，以及社会需求，例如交流和触摸会释放激素（如催产素），刺激人对新鲜事物的渴望，并释放多巴胺。虽然这些都是很好的指南，但一份详细的用户需求列表会很有帮助，比如表
    26.1 中的 18 个类别。该列表会因文化、经济、社会和其他社区的不同而有所不同。


    # 表 26.1 老年人需求的非正式清单和满足需求的设备的任务示例


