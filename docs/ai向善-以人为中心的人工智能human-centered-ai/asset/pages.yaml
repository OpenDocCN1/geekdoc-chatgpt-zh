  md: '史蒂夫·乔布斯（Steve Jobs）曾将计算机描述为“我们头脑中的自行车”，这明确地表明，计算机设计的最佳目标是增强人类的能力，同时确保人类保持控制权。当前的计算机在我们头脑中可能更像是一台哈雷·戴维森摩托车，但有人认为，在未来，计算机将成为我们头脑中由司机驾驶的豪华轿车，自动带领我们到达目的地。使用
    HCAI 框架可以帮助我们理解骑自行车和驾驶车辆之间的不同。人工控制的自行车可能是一种愉快而健康的锻炼方式，但隐喻中的带有司机的自动豪华轿车意味着舒适和安全。然而，特别是如果驾驶员对减速或停车的请求没有响应的情况，乘客如何传达他们想去的目的地并对性能产生影响呢？人类的需求是复杂且不断变化的；有时人们更喜欢享受驾驶的乐趣，锻炼自己的驾驶技巧；有时，他们可能会喜欢休息、阅读或与他人讨论。


    基于交通运输的隐喻，我们可以把计算机想象成大型的商用飞机，它可以将乘客舒适、快速、安全地带到目的地，而无须让乘客学习如何飞行。受 HCAI 框架右上角象限的启发，在有专业监控性能的空中交通管制员和飞机认证机构的情况下，飞机只需对其指令做出响应（图
