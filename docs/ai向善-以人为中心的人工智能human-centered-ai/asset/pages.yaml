- pgno: 87
  md: '# 第 10 章


    # 总结及怀疑者的困境


    > > 我们应该敬畏人类思维的能力和人类文化的成就。

    > > ——布赖恩·坎特威尔·史密斯（Brian Cantwell Smith），《测算与判断：人工智能的终极未来》（The Promise of Artificial
    Intelligence: Reckoning and Judgment）


    我的目标是，推崇以人为中心的设计方法，帮助设计师开发出更好的人工智能系统。HCAI 框架分离了计算机自动化中的人工控制问题，并明确指出一个良好的设计可以同时实现高度的人工控制与自动化。人类操作人员可以清晰地了解解机器的状态及其选择，而错误结果和可逆性等问题则可以为设计师提供指导。在适当的情况下，设计良好的自动化系统保留了人工控制，从而提高其性能并实现创造性的改进。


    HCAI 框架阐明了何时需要计算机控制以实现快速的自动化行为，何时人类想要最大的系统控制权，以及何时存在过度自动化或过度人工控制的危险。该框架还阐明了在不同平台上的设计决策：①消费者和专业应用程序的设计为消费者带来了巨大的利益，例如广泛使用的推荐系统、电子商务服务、社交媒体平台和搜索引擎；②重要应用领域的设计可以给我们带来实质性的利益，但也可能带来危害，例如医疗、法律、环境和金融系统；③生命攸关的应用领域，例如汽车、飞机、火车、军事系统、心脏起搏器或重症监护室，其设计尤为重要。'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'HCAI 框架基于人与计算机属于不同类别的概念，因此，在设计中使用独特的计算机功能，如复杂的算法、庞大的数据库、先进的传感器、信息丰富的显示器以及强大的效应器等，更有可能提高人类的表现。同样，在设计和组织架构中认识到人类的独特能力，如鼓励创新使用、支持持续改进以及推动突破性的大幅改进设计，也将带来优势。


    该框架的一个重要研究方向是，制定控制和自主水平的客观措施。这些措施将引发更有意义的设计讨论，从而改进相关的指南、评估和理论。


    改进设计的另一重要驱动力是，人类要对错误负责，例如详细的审计跟踪、机器状态的一致性信息反馈以及收集事件和事故的策略。这些信息可用于进行用户培训并重新设计系统，以减少故障和未遂事件。但仍然存在一些难题，例如，当自动化失效时，人类要有能力接管系统，如何避免削弱人类技能的去技能化效应？类似地，当操作人员的行为频率降低时，如何确保他们保持警惕——自动驾驶汽车中的人类驾驶员如何保持足够的注意力，以便在需要时接管控制？


    伦理问题有助于制定一般原则，如对责任、公正和可解释性的考虑。将这些一般原则与产品和服务设计的复杂性的深入知识和经验相结合时，便形成了可操作的指南。HCAI
    框架为责任、公正和可解释性奠定了基础。本书的第四部分收集了关于弥合伦理和实践之间差距的建议。


    以人为中心的系统将变得更好，因为它：①基于成熟的软件工程实践的可靠系统；②通过业务管理策略营造的安全文化；③通过独立监督获得可信赖的认证；④通过政府出台的相关法规。HCAI
    系统将迅速发展，因为监控故障和未遂事件的机制能够支持其快速改进。


    对于那些对综合人类智能、感知、决策和自主行动有更大胆的抱负的读者来说，HCAI 框架和示例似乎显得很保守。他们更倾向于设计无须人工监督或干预的系统，并专注于机器的自主性而非人类的自主性，他们相信'
  merge: -1
  img_proc: true
- pgno: 89
  md: '完全可靠的系统是可以构建的，所以他们忽视或拒绝在现有系统中添加审计跟踪、控制面板、故障报告等其他特性的工作，尤其是在重要的和生命攸关的应用程序中。


    有些怀疑者认为以人为中心的人工智能的二维 HCAI 框架过于保守，他们构想了三维模型以及更精细的模型，这是一个很好的想法，但他们也应该为这些模型建立案例支持。还有些人则抱怨示例中的用户界面过于简单。也许确实存在这样的情况，这些示例仅代表人工智能系统中一部分常见案例，我也欢迎大家提供更多关于自主系统的新颖设计以及执行方式的示例。卓越设计的关键部分是处理基本故障，例如断电、无线连接丢失、组件损坏等，但对于其他故障，如恶意行为者的对抗性攻击，也需要大量工作来预防或处理。


    当人工智能研究人员和开发人员的思维方式从一维的自动化水平转向二维的框架时，他们可能会找到解决当前问题的新方法。HCAI 框架可以指导设计师在提供高度自动化的同时赋予用户适当的控制权。一旦这些技术成功，将放大、提高、增强并赋予用户权力，从而显著提升用户的表现。


    此外，设计师还可以将最初的八条黄金法则或新的 HCAI 模式语言作为指导，构想出未来的超级工具、远程机器人、有源设备和控制中心，从而改善人们的生活，并推进实现联合国可持续发展目标。'
