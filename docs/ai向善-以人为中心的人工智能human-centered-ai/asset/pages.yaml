- pgno: 95
  md: '用机器时的人工控制。第二对隐喻是队友和远程机器人，前者表示将人工智能的动作当作人类的动作，后者表示人类操作。第三对隐喻是确定的自主性和控制中心，前者通过其设计而保证安全，后者通过人工控制来监控和干预。第四对隐喻是社交机器人和有源设备，前者被设计成像人类一样行动，后者被设计成诸如洗碗机或烘干机式的设备。


    这几对设计隐喻通过提出针对不同环境需求的解决方案来改进 HCAI 框架，其中一些支持更多的自动化，另一些则支持更多的人工控制。一个关键的思想是组合设计，对于可靠执行的任务采用自动化方法，对于用户想要管理的任务采用人工控制的方法。组合设计使得我们能够更加细致地决策哪些功能可以由计算机可靠地执行以及哪些功能是人类想要或需要控制的。


    在推荐系统、问答系统和游戏系统中，用户可能会忽略不完美的回应，甚至可能会喜欢偶尔的惊喜。然而，在医疗保健、交通或金融系统等涉及重大后果或生命攸关的应用中，正确的回应变得至关重要，可预测的行为在建立信任方面也是至关重要的。


    本书倾向于一种新的跨领域交叉研究方法，将以人为中心的方法与人工智能算法相结合，作为成功设计先进系统的关键组成部分。'
