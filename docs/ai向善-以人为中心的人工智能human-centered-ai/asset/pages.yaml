- pgno: 235
  md: '联合国的 17 个可持续发展目标和美国国家工程院的 14 个重大挑战吸引了许多研究人员，新目标的提出是有规律的。英国于 2021 年宣布了一系列“大挑战”（Grand
    Challenge）任务，涉及四个主题：人工智能和数据、老龄化社会、清洁发展、未来出行。加拿大、日本、韩国、德国等地也宣布了包含 HCAI 这一话题的“大挑战”任务。另外，基因组研究、癌症预防、太空探索和环境保护等领域的领导者也提出了“大挑战”。非营利组织也提出了同样的“大挑战”，如比尔·盖茨基金会和
    XPRIZE 基金会。


    几十年来，人类面临着诸多“大挑战”，例如如何利用受控的聚变反应发电、如何利用天气控制带来降雨或停止降雨、如何减少抗生素耐药性等，所有这些都可以从人工智能算法和
    HCAI 设计中受益。新提出的“大挑战”需要利用 HCAI 优化风力涡轮机、太阳能电池板、电动汽车充电网络和其他应对气候危机的技术。


    可从 HCAI 中受益的三个挑战是：推进民间科学、阻止虚假信息传播、为重大疾病寻找新的治疗方法和疫苗。这些应用情景将包括人工智能算法和 HCAI 设计，以一种自然的、几乎不可见的方式，使数十亿人从中受益，人们甚至可能没有意识到自己正在使用这些先进技术，这是常见技术的预期前景的一部分。就像用户认为许多设备中嵌入了计算机芯片一样，他们也会假设人工智能算法和设计良好的
    HCAI 超级工具、远程机器人和有源设备将按照其预期工作，他们会更多地考虑想做什么，而不是正在使用的技术。


    # 推进民间科学


    环境问题与那些自称为民间科学家的人尤为相关。在任何地方生活的普通人和一些杰出人士都可以为研究项目做出贡献，其部分动机是出于学习的目的，部分是出于希望对群体以及宏伟事业有所贡献。他们参与的项'
