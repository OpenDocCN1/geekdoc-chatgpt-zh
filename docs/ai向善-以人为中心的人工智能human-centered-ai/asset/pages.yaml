- pgno: 161
  md: '最大的椭圆是政府监管，它提供了另一层思考，引起了公众对可靠、安全、可信赖的 HCAI 系统的关注。政府监管存在争议，但需要说明的是美国国家运输安全委员会对飞机、火车、轮船和高速公路事故调查等成功案例，通常被视为促进公共利益的行为。欧洲的政府法规（如《通用数据保护条例》）同样引发了可解释的人工智能这一领域的卓越研究和创新。类似地，美国对汽车安全和燃油效率的监管也刺激了设计研究的改进。


    对于参与技术开发的每个人来说，无论是由人工智能还是其他方法驱动，可靠性、安全性和可信赖性都是至关重要的概念。这些以及其他概念，包括隐私、安全、环境保护、社会正义和人权，在软件工程、企业管理、独立监督和政府监管等各个层面都受到强烈关注。


    虽然企业经常对客户和员工福利承诺做出积极的公开声明，但当企业领导者不得不在权力和金钱之间做出艰难决定时，他们可能会倾向于支持企业利益和满足股东的期望。当前的人权运动和企业社会责任有助于他们获得公众支持，但对大多数管理者来说，这些都不是优先事项。软件工程师、管理人员、外部审核员和政府机构所需要的流程，在清晰的原则和公开的公司计划报告的指导下，将产生更大的影响，尤其是在由内部和外部审查委员会审查时。这在新兴技术领域尤其如此，例如
    HCAI，在这些技术中，企业管理者可能会迫于公众压力，承认他们的社会责任，并公开报告进展情况。


    同样，大多数政府决策者需要更多地了解 HCAI 技术的工作原理以及商业决策是如何影响公共利益的。国会或议会对管理行业惯例进行了立法，政府机构的工作人员必须就如何执行法律做出艰难的决定。专业协会和非政府组织正在努力向政府官员通报这些情况。


    本书第四部分中提出的管理架构是基于现有实践的实际步骤，必须再对其进行调整以适应新的 HCAI 技术。管理架构旨在明确谁该采取行动，谁'
  merge: -1
  img_proc: true
- pgno: 162
  md: '来负责。为了增加成功的机会，这些建议将需要与预算和时间表一起付诸实施。每项建议都需要进行试点测试和研究，以验证其有效性。这些管理架构只是起点，随着技术的进步、市场力量和公众舆论对成功的产品和服务的重塑，人们将需要新的方法。例如，在
    2020 年，公众舆论极大地改变了面部识别技术的业务实践，当时包括国际商业机器公司、亚马逊和微软在内的主要开发人员，由于面临潜在的误用和滥用的压力，他们放弃向公安部门出售这些系统。


    接下来的四个章节涵盖了管理的四个层次。第 19 章将描述软件工程团队实现可靠的 HCAI 系统的五个技术实践：审计跟踪、工作流程、验证和确认测试、偏差测试和可解释的用户界面。


    第 20 章将提出管理软件工程项目的组织如何通过领导承诺、招聘和培训、报告故障和未遂事件、内部审查和行业标准来发展安全文化。


    第 21 章将说明外部审查组织的独立监督方法如何促进产品和服务的可信认证和独立审计。这些独立的监督方法构建了一个可信赖的基础设施来调查故障，持续改进系统并获得公众的信任。独立监督的机构包括审计公司、保险公司、非政府组织和公民社会以及专业组织。


    第 22 章将展开与政府干预和监管相关的更广泛且有争议的讨论。


    第 23 章将总结并提出担心，但也会提出一个乐观的观点，即设计良好的 HCAI 系统将为个人、组织和社会带来益处。


    对于那些长期将算法视为主导目标的人来说，让他们接受以人为中心的思想将是困难的。他们会质疑这种新方法的有效性，但以人为中心的思想和实践让人工智能算法和系统仍然能够用于商业上成功的产品和服务。HCAI
    提供了一个充满希望的未来技术愿景，支持人类的自我效能、创造力、责任感以及人与人之间的社交关系。'
