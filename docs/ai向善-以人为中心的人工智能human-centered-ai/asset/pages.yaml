  md: '人员开发出可靠、安全、可信赖的系统，尤其是针对重要和生命攸关的应用程序。卓越的设计可以为用户和社会带来广泛的利益，如在商业、教育、医疗保健、环境保护和社区安全方面。


    第 12 章描述了研究具有思考能力的计算代理的科学目标，通常意味着理解人类的感知、认知和运动能力，以便构建出能够像人类一样自主执行任务或优于人类的计算机。这一章还总结了利用人工智能方法开发广泛应用的产品以及服务的创新目标，该方法将保持人类的控制权。这两个目标都需要对科学、工程和设计进行研究。


    第 13 章侧重于介绍如何将每个目标的最佳特性结合起来的方法。追求科学目标的人构建了他们称之为聪明、智能、知识渊博且具备思考能力的认知计算机。由此产生的类人产品可能在特定任务上取得成功，但这些设计可能会加剧许多用户对计算机的不信任、恐惧和焦虑。而追求创新目标的群体认为，最好将计算机设计为放大、增强、赋权和增强人类表现的超级工具。组合策略可以是设计熟悉的
    HCAI 用户界面与人工智能技术服务，如短信建议、搜索查询。人工智能技术还将使内部运营能够在复杂的网络中管理存储空间和优化传输。


    第 14 章提出了以下问题：设计师是否会从把计算机视为队友、伙伴和合作者的模型中获益？在假设人与人之间的交流是人机互动的一个良好模型时，何时会有帮助，何时存在危险？创新目标的研发人员和开发者希望构建远程机器人，扩展人类能力的同时提供超人类的感知和运动支持，以提升人类的表现，并同时实现人与人的团队合作的成功。组合策略可以是利用科学目标的算法来实现支持创新目标的自动化内部服务，以支持人工控制。这种方法已被应用于许多汽车驾驶技术中，如车道保持、泊车辅助和碰撞避免系统。其构想是，在机器学习和深度学习算法的基础上，通过“内置人工智能”以满足用户的控制欲望，为用户提供有价值的服务。通过'
  merge: -1
  img_proc: true
- pgno: 101
  md: '这种方式，用户可以受益于人工智能的最优解，了解正在发生的事情，清楚地知道接下来会发生什么，并在需要时获取控制权。


    第 15 章讨论了产品和服务的科学目标，即实现无须人工干预的自主性。创新目标的研究人员希望支持控制中心和控制面板，其中人类操作高度自动化的设备和系统，而不是依赖单独行动、确保自主性的系统。组合策略可能是让利用科学目标的算法提供高度自动化的功能，而其用户界面设计支持人类控制和监督。这种组合策略在美国国家航空航天局、工业、公用事业、军事和空中交通管制中心等许多地方都得到了应用，并以多种形式的人工智能来优化性能，但操作人员对接下来会发生什么有着清晰的心智模型。人类操作者非常重视机器的可预测行为。


    第 16 章介绍了数百年来科学目标倡导者为构建社交机器人所做的众多尝试，并引起了社会的广泛兴趣。与此同时，有源电器、移动设备等是在消费市场取得成功的案例。创新目标倡导者更喜欢那些被看作是可操纵工具的设计，这些工具增加了灵活性或可移动性，并可以在救援、灾难和军事等情况下使用。组合设计可以从类人服务开始，这已经被证明是可行的，例如可以是语音操作的虚拟助手。这些服务可以嵌入人有源设备中，使用户能够自主控制对其而言重要的功能。创新目标思维也会使有源设备的性能优于人类，例如四轮或脚踏式机器人在崎岖地形或洪水中的灵活性、在狭窄空间中的可操作性以及举起重物的能力。有源设备还可以配备超人类的传感器，例如红外摄像机或灵敏的麦克风以及专门的效应器，例如“火星漫游者”（Mars
    Rover）探测器上的钻头和手术机器人上的烧灼工具。


    了解不同目标的优势可以激发一些新思考，比如如何通过创建组合设计来处理不同环境下的新思考，从而构建可靠、安全、可信赖的系统。


    第 17 章总结了设计上的平衡，以在科学目标和创新目标社群之中达成愉快的合作。'
