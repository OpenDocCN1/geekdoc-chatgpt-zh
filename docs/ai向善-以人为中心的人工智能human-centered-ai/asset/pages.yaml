  md: 组合设计策略包括使用基于语音的虚拟助手，这已经被证明在有源设备和医疗设备设计中是成功的。如果对话能够保证低错误率，基于文本的客户服务聊天机器人可能会有所成功。通过长期研究，人们可以进一步改进类似宠物的治疗应用设备和类似人类的运动设备，以了解随着时间的推移，哪些解决方案仍然具有吸引力和有用性。
