    幸运的是，思想超前的人工智能研究人员和开发人员逐渐意识到，我们需要以人为中心的设计。斯坦福大学计算机科学教授、谷歌云人工智能研究首席科学家李飞飞在 2018
    年 3 月的《纽约时报》（New York Times）上发表了一篇评论文章，阐述了“制造有益于人类的人工智能”的必要性。她注意到了一种趋势，即“将重复性、易出错甚至危险的工作元素自动化，剩下的都是人类最适合的创造性、知识性工作”。李飞飞教授总结道：“无论我们的技术变得多么自动化，无论它对世界的影响是好是坏，其产生的影响始终需要我们担负。”


    李飞飞教授也支持“以人为中心的人工智能”，这是她与斯坦福大学哲学教授、教务长约翰·埃切门迪（John Etchemendy）共同创建的斯坦福大学研究所的名称，她写道：“作为这项新技术的创造者，我们有共同的责任引导人工智能，使其对我们的星球、我们的国家、我们的社区、我们的家庭、我们的生活产生积极影响。”


    2018 年 4 月，加州大学伯克利分校的顶级机器学习研究员迈克尔·乔丹（Michael Jordan）发表了一份强烈声明，称“构建行星规模的推理和决策系统，将计算机科学与统计学相结合，并考虑到人类的效用，这一原则在我的教育中是找不到的”。他声称：“我们缺少的是一门具有分析和设计原则的工程学科。”这让我很惊讶，因为他肯定知道人机交互。他接着质疑道：“研究经典的模仿人类的人工智能是专注于这些更大挑战的最佳或唯一方式吗？”乔丹建议，这似乎是一条明智的前进道路：“我们将需要好好考虑如何利用人机交互来解决我们最紧迫的问题。我们希望计算机能够激发人类创造力的新水平，而非取代人类创造力。”


