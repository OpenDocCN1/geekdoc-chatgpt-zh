  md: '国际标准组织有一个机器人技术委员会，自 1983 年以来，该委员会的目标是“为工业机器人和服务机器人的安全制定高质量的标准……通过提供明确的最佳实践和标准化界面和性能标准，确保正确的安装及其安全性”。新兴的
    IEEP 7000 系列标准与透明度、偏见、安全性和可信赖性等 HCAI 问题直接相关。这些标准更精确地定义了 HCAI 系统并提出了评估方法，从而促进这些目标的实现。自主和智能系统道德开放共同体促进讨论并协调多个全球标准的工作。


    第三方标准的一个来源是万维网联盟，对于那些追求通用或包容性设计目标的网站设计师，该联盟为其提供网站内容可访问性指南；另一个来源是美国无障碍委员会，其第 508
    条标准指导机构“向残障员工和公众成员提供与他人可得信息相当的信息访问权”。这些可访问性指南需要确保 HCAI 系统的普遍适用性，并提供如何为 HCAI 系统适用其他指南的有用模型。


    与这些制定指南的组织达成合作，有助于公司制定未来的指南和标准，可以从中了解最佳实践方法，并对员工进行培训。客户和公众可能会认为，参与并遵守标准，是公司以安全为导向的标志。然而，怀疑者则担心，企业参与制定自愿性标准可能会导致标准力度不够，其主要目的是防止政府采取更严格的监管或其他干预措施。这一过程被称为“企业俘获”，即企业参与者弱化标准以获得竞争优势或避免更昂贵的设计。然而，企业参与者也为该过程提供了实践经验，从而提高了标准的相关性及其被广泛接受的机会。虽然完美的平衡很难实现，但良好的自愿性标准可以改善产品和服务。


    提升软件质量的另一种方法是能力成熟度模型（图 20.1），该模型由美国软件工程研究所于 1980 年代后期开发并定期更新。软件工程研究所的目标是改进软件开发过程，而不是为产品和服务设定标准。2018
    版的能力成'
