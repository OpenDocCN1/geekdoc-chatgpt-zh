- pgno: 63
  md: '提高质量，并鼓励创造力。人类需要创造力以扩展现有设计，提出全新方法，并在需要时协同处理意外问题。而 HCAI 未来更广泛的目标是确保隐私、增加网络安全、支持社会公正和保护环境。


    HCAI 框架（详见第 8 章）可以指导设计师和研究人员推进可靠、安全、可信赖系统的新可能。毕竟，大多数消费者、生产主管、医生、飞行员对计算机自主性并不感兴趣；他们想要的是能够显著提高其表现的系统，简化他们的工作，这样他们就可以致力于实现更大的抱负。HCAI
    框架展示了精心设计的计算机应用程序如何实现高度人工控制的同时保证高度自动化。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 第 8 章


    # 以人为为中心的人工智能的二维框架


    HCAI 框架引导设计师和研究人员提出新的问题并重新思考人工智能自主性的本质。当设计师不再把计算机视为我们的队友、伙伴或合作者，他们才更有可能开发出能够显著提高人类表现的技术。新颖的设计将更充分地利用独特的计算机功能，如复杂的算法、庞大的数据库、先进的传感器、信息丰富的显示器以及强大的工具，如爪、钻、焊接机。


    明确人类的责任还可以引导设计师在知识不完整的新环境中发现创造性解决方案。HCAI 框架阐明了卓越设计如何促进提升人类的自我效能、创造力和责任感，而这正是管理者和用户所寻求的。可靠、安全、可信赖的目标可适用于面向消费者的轻量级推荐系统和专业人士的重要应用程序，但这些目标与生命攸关的系统最相关。


    推荐系统被广泛应用于消费服务、社交媒体平台、搜索引擎等领域，为消费者带来了巨大的利益。推荐系统频繁出错的后果通常不那么严重，甚至可能会给消费者一些关于电影、书籍或餐馆的有趣建议。然而，恶意行为者可以操纵这些系统来影响人们的网购习惯，改变选举结果，传播危险信息，重塑人们对气候、疫苗接种、枪支管制等问题的态度。经过深思熟虑的设计，改善控制面板可以提高消费者满意度，并限制恶意使用。


    其他自动化应用领域，包括如搜索查询或拼写检查等常见的用户任务，这些任务都经过精心设计，以保证用户的控制权，同时提供有用的帮助。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '杰弗里·希尔（Jeffrey Heer）主张寻求“一个有前途的设计空间：计算辅助的增强和丰富，而非取代人类智力工作”，他提供了使用自动化来支持人工控制的方法，这一思想开辟了新天地。他写道，他的目标是“有效地采用人工智能方法，同时确保人们的控制权：人们可以不受约束地追求复杂的目标和运用各自领域的专长”。希尔的论文给出了用户界面的示例，从数据清理、组织数据、探索性的数据可视化（用户可以从一组推荐数据中选择），到具有扩展用户控制权的自然语言翻译。


    在医疗、法律、环境或金融系统中，获得正确的结果更为重要，因为这些系统可以带来实质性的好处，但也存在严重损害的风险。谷歌流感趋势（Flu Trends）就是一个有缺陷的产品，它根据用户对“流感”“组织”或“感冒药”等术语的搜索来预测流感爆发，旨在使公共卫生官员能够更有效地分配资源。最初的成果并没有维持下去，两年后，谷歌关闭了该网站，因为程序员没有预料到搜索算法、用户行为和社会环境的变化。大卫·雷泽（David
    Lazer）团队将程序员的危害性态度称为“算法傲慢”，暗示一些程序员对自己创造万无一失的自主系统的能力抱有不合理的期望，如两架波音 737 MAX 坠毁事件。


    高频交易算法引起的公开股票市场和货币交易所的金融系统崩溃，在短短几分钟内就造成了数十亿美元的损失。然而，有了足够的交易记录，市场管理者通常可以修复损失。对于中等范围的重要应用，如医疗保健、投资组合管理或法律咨询，警觉的决策者可能有时间思考算法推荐、咨询同事，或更深入地了解推荐系统。


    面对生命攸关应用领域的挑战，如自动驾驶汽车、心脏起搏器、植入式除颤器等物理设备，以及军事、医疗、工业和交通等复杂系统，在这些应用领域中，有时需要人们快速行动，并可能产生不可逆的后果。因此，生命攸关系统的设计是一项严峻但必要的挑战，它可以挽救生命。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '推荐系统、重要应用程序和生命攸关系统的设计师都以一维自主水平为指导，这种自主水平来自谢里丹和维普兰克的早期论文（详见第 6 章）。他们的模型在许多文章和教科书中反复出现，包括我自己在
    1987 年编写的教科书。我也相信，自动化程度越高越好，但提高自动化程度就必须减少人工控制。总之，设计师必须在从人工控制到计算机自动化的一维直线上选择一个点（图
    8.1）。


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_66_0.png)


    # 图 8.1 人工控制与计算机自动化的选择


    注：误导性的一维思维表明，设计师必须在人工控制和计算机自动化之间做出选择。


    更多的自动化必然意味着更少的用户控制，这是一个错误的信息。多年来，这个想法始终困扰着我，直到我最终开始相信，在提高计算机自动化的同时确保人工控制是可能的，甚至我也为这个令人费解的概念而绞尽脑汁，直到我看到一些设计案例，其某些功能具备高度人工控制，而其他功能则具备高度自动化。


    这些概念的解耦形成了一个二维框架，这表明同时实现高度人工控制和高度计算机自动化是可能的（图 8.2）。两个坐标轴分别是从低到高的人工控制和计算机自动化水平。这种简单的二维扩展已经在帮助设计师构想新的可能性。


    我们期望的目标通常是（但并非总是）在右上象限，即最可靠、安全、可信赖的系统。右下象限是相对成熟、易于理解、可预测任务的系统，例如汽车自动变速箱或路面防滑系统。而对于不同环境下难以理解的复杂任务，需要处于右上象限。这些任务包括创造性决策，因此目前处于研究前沿。随着使用环境标准化（如电梯井）的推进，这些任务可以在高度自动'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/1b604470e34bc8bdfb044407ab9bdfc5_67_0.png)


    # 图 8.2 HCAI 的二维框架


    注：通过高度人工控制和高度计算机自动化来实现（黄色三角形）可靠、安全、可信赖的设计目标的二维框架。


    化的计算机控制下进行。


    计算机自动化程度高、人工控制程度低的右下象限（图 8.3），是计算机自主任务的所处位置，这类任务需要快速行动，例如，安全气囊展开、防抱死刹车、心脏起搏器、植入式除颤器以及防御性武器系统。在这些应用领域中，没有时间进行人工干预或控制。由于发生故障的代价是如此之高，这些应用程序需要极其仔细的设计、广泛的测试，并在使用期间进行监控，以针对不同的使用环境改进设计。随着系统成熟度的提升，用户会倾向于有效且经过验证的设计，这也为更高层次的自动化和更少的人工监督铺平了道路。


    人工控制程度高、自动化程度低的左上象限，是人类自主任务的所处位置，在这里，人类掌控一切，创造力也得以实现。例如，骑自行车、弹钢琴、烘焙或与孩子玩耍时，犯错误也是体验的一部分。在这些行动中，'
  merge: -1
