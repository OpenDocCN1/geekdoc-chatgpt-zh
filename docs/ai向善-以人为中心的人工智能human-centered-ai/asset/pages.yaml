  md: '限但已经成熟且具备已验证的功能，并将其嵌入设备中，通过直接控制或远程控制来增强人类表现。


    把计算机视为队友的另一种方式是，通过从庞大的数据库和超人类的传感器中提供信息。当复杂算法的结果显示在信息丰富的显示器上时，例如用假色显示血流量的三维医学超声波心动图，临床医生在做出心脏治疗的决定时可以更加自信。同样地，使用彭博终端机获取金融数据的用户认为，计算机使他们能够在购买股票或重新配置共同基金投资组合方面做出更大胆的选择（图
    14.2）。彭博终端机采用专门设计的键盘和一个或多个大型显示器，用户通常将多个窗口按空间稳定方式排列，以便知道他们需要的内容在哪里。通过平铺而不是重叠的窗口，用户可以快速找到所需的内容，无须重新排列窗口或向下滚动。决策所需的大量数据都易于查看，并且点击一个窗口就可以在其他窗口中生成相关信息。因此，超过
