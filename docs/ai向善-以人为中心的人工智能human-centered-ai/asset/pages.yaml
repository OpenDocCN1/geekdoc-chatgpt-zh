  md: '成就感。这些课程成为大型开放式网络课程（MOOC）成功的关键因素，MOOC 向用户提供了测试问题掌握程度的明确反馈。


    同样，在早期的用户界面帮助系统中，设计师发现事后解释和错误消息很难处理，这导致他们转向关注以下方面的替代方法：


    +   1. 防止错误，以减少解释需求：例如，从日历中选择年、月、日，而不是按键输入 YYYYMMDD。用选择代替打字可以防止错误，从而消除了大量的错误检测和信息解释需求。


    +   2. 采用循序渐进的过程，每个问题都会引出一组新的问题。循序渐进的过程可以引导用户逐步实现他们的目标，简化每个步骤并解释术语，同时让用户有机会返回并更改以前的决策。例如，亚马逊的四步电子商务结账流程和设计良好的报税系统
    TurboTax。


    # 探索性用户界面的前瞻性视觉设计


    由于可预测性是用户界面设计的基本原则，它已被应用于许多涉及不同形式的人工智能算法的系统中。这些基于人工智能的设计会让用户在开始操作之前进行选择，比如拼写纠正器、文本信息自动补全和搜索查询完成（图
    9.3 和图 9.4）。科罗拉多大学教授丹尼尔·萨菲尔（Daniel Szafir）及其合作者将同样的原理有效地应用于机器人操作。他们表明，对灵巧机械臂预期动作路径和目标的预览可以提高任务的完成度和满意度。对于机器人来说，人工控制的可预见性设计原则可能是图
    9.2 中的第二种模式，先预览，再选择和启动，然后管理执行。


    导航系统根据当前交通数据应用基于人工智能的算法查找路线时，遵循了可预测性原则。向用户提供了 2 至 4 个路线选择的预计时间，包括驾车、自行车、步行、公共交通等，用户可在其中选择自己想要的路'
