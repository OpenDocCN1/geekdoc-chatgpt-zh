  md: '注于人类社会，在信任技术的设计方面也有一些经验。


    然而，公众的期望超越了信任或被信任的系统，用户想要可信赖的系统。虽然系统可能会被错误地信任，但是一个可信赖的系统应该值得被信任，即使利益相关者很难度量这个属性。我的立场是，可信度是由权威的独立监督机构评估的。由于大多数消费者不具备这种能力，也无法投入精力来评估系统的可信度，因此他们依赖于已建立的组织，如消费者报告或券商研究所。如果一家权威的会计师事务所、保险公司或消费者权益保护组织对一种产品或服务盖章认可，那么消费者很可能认为它是可信赖的。独立监督或组织（详见第
