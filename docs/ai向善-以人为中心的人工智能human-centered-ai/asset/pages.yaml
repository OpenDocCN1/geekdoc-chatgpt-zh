  md: "# # 第 27 章\n# 总结及怀疑者困境\n\n> > 信任是社会的基础。没有真理，就没有信任；没有信任，就没有社会。哪里有社会，哪里就有信任；哪里有信任，哪里就有支撑它的东西。\n\
    > \n> ——弗雷德里克 · 道格拉斯 (Frederick Douglass),《我们的多元民族性》( Our Composite Nationality),\
    \ 美国马萨诸塞州波士顿\n\n在本书的开头，我承诺要提供一份指南和现实政策的路线图。该指南呼吁关注以人为中心的思维，并将科学、工程、设计、艺术、社会科学和人文等学科融合在一起。多学科相结合的方法将加速创造出尊重人类价值观（如权利、正义和尊严）的技术，并促进个人目标的实现，如自我效能、创造力、责任和社交关系（图\
    \ 1.2）。\n\n我们的设计目标是构建可靠、安全、可信赖的系统，推动种族公正、收入平等和环境保护方向的进步。通过共同努力，我们或许能够按照路线图实现有价值的目标，例如有关医疗、经济、教育、食品安全以及其他方面的联合国可持续发展目标。\n\
    \n一方面，我们应该关注受 HCAI 系统影响的众多利益相关者的令人钦佩的价值观、目标和愿望。另一方面，我们应该警惕恶意行为者、偏见和有缺陷的软件所带来的威胁。研究人员、开发人员、管理人员和政策制定者"
  merge: -1
  img_proc: true
- pgno: 280
  md: '应关注来自犯罪分子、极端组织和恐怖分子的外部威胁，同样也要注意到数据偏差、无意识偏见和有缺陷的软件在关键决策中可能带来的危险。在这段旅程中，我们需要对自己的能力持谦逊态度，对失败的可能性持开放态度，并随时准备接受新的想法，我们需要在遇到困难时有勇气做出正确的选择，同时在大胆的愿望与谨慎的需要之间寻求平衡。更快、更好的技术或许对这一进程有所帮助，但我们的最终目标是人类福祉和环境保护。


    这些多层次的目标为人类广泛的参与和贡献提供了空间。怀疑论者可能会质疑研究人员和技术创新者是否愿意修改其工作以支持 HCAI 的思想和方法。这是一个合理的担忧，但人们对
    HCAI 日益增长的兴趣是一个积极的迹象。研究人员开始认识到，他们必须考虑自己工作的积极和消极影响。会议计划委员会和期刊编辑委员会越来越倾向于从道德的角度来评估论文。科技公司的争议和损害赔偿责任正迫使商界领袖们逐渐意识到道德实践和可信赖性是他们的竞争优势。世界各地的政府机构都在加大努力，要求企业对自己的系统负起责任，并朝着改进监管方式和独立监督的方向发展。也许我需要用响亮的“喇叭”传达我的行动号召，甚至需要整个“铜管乐队”的支持，但我希望可以通过现实政策的“温和小提琴”和可行动议程的“有节奏的鼓点”这一“管弦组合”来引起关注。'
  merge: -1
  img_proc: true
