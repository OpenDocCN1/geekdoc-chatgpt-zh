  md: '了在数据清洗、探索性数据可视化、自然语言翻译等更高级应用中使用人工智能引导方法来支持人类控制的三种方法。其他人也提出了类似的策略，为用户提供控制面板来操作人工智能引导的推荐系统，例如使用滑动条选择音乐或复选框缩小电子商务搜索范围。这些内容将在第
    19 章“可解释的用户界面”一节中进行详细介绍。


    结合科学目标与创新目标的第二种方法，可以在我们所熟悉的产品设计中看到，如手机、数码相机的自动化功能和人类控制的集成。这些广泛使用的设备采用了人工智能功能，例如高动态范围的照明控制、自动防抖和自动对焦，但用户可以控制构图、切换人像模式、添加滤镜以及在社交媒体上发布帖子等功能。


    结合这两个目标的第三种方法是为超级工具提供附加功能，这些附加功能都是由智能代理系统进行设计的。推荐系统正是适合使用这种方式的例子，它使用人工智能算法来推荐电影、书籍、拼写纠正和搜索查询。用户可以从改进的超级工具中受益，但仍然保持控制权，自行选择是否采纳这些推荐。可考虑的新颖推荐是根据冰箱里的食物来推荐三餐，或者根据你吃的食物来调整饮食。还有一类推荐者被称为“教练”，例如通过评价你的钢琴演奏指出跑调的位置，或者通过反馈来告诉你在瑜伽练习中何时应该进一步弯曲膝盖。这些指导建议最好在用户完成后以及在用户请求时以温和的方式呈现，让用户可以自主选择接受或忽略。


    综上，我们可以将智能代理与人类控制超级工具的理念相结合，这些工具是一致的、可理解的、可预测的和可控的。思维的巧妙结合可以提高产品和服务的价值和接受度。第 14
    章将介绍指导设计可能性的第二对隐喻：队友和远程机器人。'
