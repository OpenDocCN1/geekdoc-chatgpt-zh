    # 研究经费


    美国国家科学基金会、英国工程与物理科学研究委员会、欧洲研究委员会、中国国家自然科学基金会等政府研究资助团体都在增加对人工智能研究的资助。在欧洲、日本和加拿大对人工智能道德问题的资助中，尤其明显地扩大了资助范围以包含
    HCAI。美国国家科学基金会的国家人工智能研究机构包括“人类与人工智能的互动与协作”（已在第 22 章中讨论），支持“道德、公正、隐私、非欺骗、可解释性、保护弱势及受保护人群、参与性及包容性设计”方面的工作。


    企业研究团队也开始处理 HCAI 问题，例如谷歌的人工智能研究团队和微软的负责任人工智能办公室。亚马逊、脸谱网、谷歌、国际商业机器公司和微软等大型科技公司已经联手支持人工智能伙伴关系，提供大量资金，还有
    100 多家其他组织试图“汇聚全球不同的声音，实现人工智能的承诺”。


    日本人工智能研究中心也是一种伙伴关系，“旨在推动人工智能在制造业、服务业、医疗保健和安全领域的实施，并加强日本在制造业和服务业的竞争力”。其他地区性研究小组也开始在世界各地成立。


    从道德到实践的旅程已经开始，但如果基于更好的基础和更明确的目标，它将变得更加顺利。第 25 章将列出 HCAI 的 30 个理想属性，其定义可能会发生变化，使其能够以客观的方式进行测量。与此同时，主观调查和'
