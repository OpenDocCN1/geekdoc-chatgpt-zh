  md: '大卫·汉森（David Hanson）的社交机器人公司生产了一个真人大小且会说话的机器人，名为“索菲亚”（Sophia），并获得了沙特阿拉伯国籍，该公司的座右铭是“我们赋予机器人生命”。这些宣传噱头引起了媒体的广泛关注，但并没有带来商业上的成功。该公司将技术重心转向
    35 厘米高、价格低廉的可编程机器人，名为“小索菲亚”（Little Sophia），可用于教育和娱乐，并被描述为“一种通过机器人朋友陪伴孩子们学习 STEM（即科学、技术、工程、数学）、编程和人工智能的有趣而有益的冒险”。


    在麻省理工学院媒体实验室，辛西娅·布雷西亚（Cynthia Breazeal）20 年来在大力推广情感机器人演示，如 Kismet，并最终成立了一家名为 Jibo
    的创业公司，但该公司于 2019 年关闭。其他社交机器人初创公司，包括 Anki（Cozmo 和 Vector 的制造商）和 Mayfield Robotics（Kuri
    的制造商），也于 2019 年关闭。这些公司找到了满意的用户，但对于重视社交机器人设计的用户来说，市场还不能满足他们的需求。康奈尔大学的盖伊·霍夫曼（Guy
    Hoffman）写道：“现在看来，引领社交家庭机器人这一新兴市场的三家最具竞争力的公司，都未能找到可持续发展的商业模式。”霍夫曼仍然乐观地认为，艺术家和设计师仍然可以创造出成功的改进模型：“在你的空间里，一个实体围绕着你，随你而动，提供一种情感上的纽带，这是任何脱离实体的转化者都无法做到的。”


    霍夫曼在康奈尔大学的同事、小组机器人实验室的负责人马尔特·荣格（Malte Jung）发给我一封电子邮件，写道：“我很难看到拟人化机器人令人信服的设计论点（除了一小部分案例）。我认为设计具有拟人形态或行为特征的机器人有几个缺点，包括不必要的复杂性、唤起时无法满足期望的风险。”荣格看到了相关领域的机遇：“汽车正变得越来越像机器人……我们可以使用人机交互设计方法来改进这些系统。”


