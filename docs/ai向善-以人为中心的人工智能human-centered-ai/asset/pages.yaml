- pgno: 169
  md: 'HCAI 系统的用户体验测试还必须解决认知问题，即机器学习系统如何引导用户充分理解其过程，这样用户就知道是否要对结果提出质疑。这一点对于推荐系统来说非常重要，但诸如抵押贷款或假释等重要决定必须是用户可以理解的。理解能力对于接受和有效使用于医疗、运输和军事等领域中生命攸关的系统至关重要。


    下一节将介绍确保正确操作的验证和确认测试，之后的一节将介绍提高公正性的偏差测试。最后一点是，HCAI 系统的开发人员将受益于第 20 章中讨论的指南文件，这些指南描述了各种机器学习应用程序的原理和示例。


    # 验证和确认测试


    对于嵌入在 HCAI 系统中的人工智能和机器学习算法，需要新的算法验证和确认过程以及典型用户的使用体验测试，旨在增加 HCAI 系统实现用户期望的可能性，同时降低出现意外和有害结果的可能性。例如，民航为新设计的
    HCAI 认证、使用过程中仔细的验证和确认测试、飞行员的认证测试提供了良好的模型。


    美国国家人工智能安全委员会强调，“人工智能的应用需要结合用户反馈进行迭代测试、评估、验证和确认”。张洁曼及其合著者对这种广泛的鼓励进行了改进，并对三种机器学习形式的测试做出了重要区分：


    监督学习：一种以标记的训练数据为学习目标的机器学习类型……无监督学习：一种从无标记的训练数据中学习的机器学习方法，其依赖对数据本身的理解。强化学习：一种机器学习类型，其数据以行动、观察和奖励序列的形式存在。'
