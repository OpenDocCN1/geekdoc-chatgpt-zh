  md: '服务。例如，基于科学的语音识别研究是苹果公司的 Siri、亚马逊的 Alexa、谷歌的 Home 和微软的 Cortana 等成功虚拟助手的重要基础。然而，为了创造能够巧妙引导用户并优雅地处理故障的成功产品和服务，还需要进行大量的设计工作。这些服务通过引导用户访问现有的网络资源，如维基百科、新闻机构和字典，来满足人们对天气、新闻和信息的常见需求。


    同样，自然语言翻译研究也被整合到设计良好的用户界面中，为成功的网站和服务提供了支持。第三个例子是，图像理解研究启用了图片提示标签自动创建，即对图像的简短描述，这些描述使得残障用户和其他人能够了解网站图像的内容。


    受科学目标的启发，人们为具有双足运动能力和情感响应面孔的自主社交机器人制作了吸引人的演示和视频。然而，这些设计往往被四轮探测器、脚踏式车辆或无人类面孔的遥控无人机所代替，而这些对于创新目标的成功至关重要。尽管机器人这一术语仍然很流行，如“手术机器人”，但这些实际上是能让外科医生在人体内狭小空间中进行精确操作的远程机器人。


    许多追求科学目标的研究人员相信，可以制造出一种通用的社交机器人，它可以为老人端茶、送包裹和执行救援工作。相比之下，追求创新目标的研究人员意识到，他们必须根据不同的使用环境调整解决方案。灵活的手部运动、承重能力或在有限空间中的移动所需的设计都需要专门的定制，而不是通用的多功能人类手部设计。


    刘易斯·芒福德（Lewis Mumford）在他的著作《技术与文明》（Technics and Civilization）中有一章题为“万物有灵论的障碍”，描述了新技术的首次尝试如何受到人类和动物模型的误导。他使用了“分离”（clissociatiou）这一尴尬的术语，来描述机器人从人类形态向更实用设计的转变，例如认识到在长距离运输重物时四轮机器人比两足机器人具有更大的优势。同样，飞机也有翅膀，但它们并不像鸟类的翅膀那样扇动。芒福德强调：“最无效'
