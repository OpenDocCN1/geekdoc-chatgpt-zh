  md: '保其工作所带来的收益大于付出。然而我们面临的真正挑战是，如何在用户快乐、企业繁荣的智能城市“乌托邦”愿景与用户沮丧、资本主义监视、政治操纵社交媒体的“反乌托邦”情景之间绘制一条路径。为研究人员、开发人员、商业领袖和政策制定者开展以人为中心的培训将在很大程度上减少损害和风险。不断丰富的数据库是一个良好的开端，这些数据中包含多起人工智能事件和事故报告，这些报告提供了因潜在问题而造成恐慌的示例。


