- pgno: 163
  md: '# 第 19 章


    # 基于成熟的软件工程实践的可靠系统


    可靠的 HCAI 系统是由应用可靠技术实践的软件工程团队开发的。这些技术实践阐明了人类的责任，例如，审计跟踪准确地记录了谁在何时做了什么，以及进行设计、编码、测试和修订的历史记录。其他技术实践是针对任务和应用领域调整并改进的软件工程工作流程。当原型系统已完备时，工程师就可以开始对程序进行验证和确认测试，并对训练数据进行偏差测试。软件工程在实践中还包括用户体验设计过程，该过程用于实现
    HCAI 系统的可解释用户界面（图 18.2）。


    # 审计跟踪和分析工具


    飞行数据记录仪非常成功地保证了民用航空系统的安全，给所有具有重要或生命攸关影响的产品或服务的设计提供了明确的指导方向。飞行数据记录仪和驾驶舱语音记录仪的历史数据证明，使用这些工具能够了解航空事故，这对民航安全做出了巨大贡献。除了事故调查之外，飞行数据记录仪还可以显示飞行员和系统在避免事故方面采取了哪些正确措施，为改进培训和设备设计提供了宝贵的经验教训。飞行数据记录仪数据在其他方面的用途是检测设备随时间发生的变化，以安排预防性维护。


    飞行数据记录仪为审计跟踪（也称为产品日志）的设计人员提供了重'
  merge: -1
  img_proc: true
- pgno: 164
  md: '要的经验，以记录机器人的操作。这些航空飞行数据记录仪的机器人版本被称为黑匣子，但设计师的一贯意图是收集相关证据，以便对故障进行回溯性分析。此类回溯性分析通常用于分配决策中的法律责任，并为这些系统的持续改进提供指导。此外，该分析还可以明确责任，免除那些表现良好的人的责任，例如被不公正指控的护士要为使用静脉注射吗啡装置负责是不公平的。


    一些研究机构对高度自动化的汽车（也称为自动驾驶或无人驾驶）也提出了类似的建议。这些建议扩展了当前电子记录设备的功能，并安装在汽车上以支持更好的维护。车辆记录设备的其他用途是改善司机的操作、监测对环境有益的驾驶模式、评估卡车司机是否遵守工作和交通规则。在某些情况下，这些日志将为分析事故原因提供有价值的数据，但关于谁拥有这些数据以及制造商、运营商、保险公司、记者和警察以何种权利获得这些数据的争议仍在继续。


    工业机器人是审计跟踪的另一个应用领域，可以在制造领域提高安全性并减少死亡。自 1986 年以来，机器人工业协会（现更名为先进自动化协会）等行业组织一直在推广自愿安全标准和某些形式的审计。


    股票市场交易算法的审计跟踪现在被广泛用于记录交易，以便管理人员、客户和美国证券交易委员会可以研究错误、检测欺诈或从系统崩溃事件中恢复。医疗健康、网络安全和环境监测等其他领域的审计跟踪也是很好的案例，开发人员能够据此调整并改进审计跟踪以满足
    HCAI 应用程序的需求。


    但仍然存在一些具有挑战性的研究问题，例如，有效的回溯性取证分析需要哪些数据，以及如何有效地捕获和存储大量的视频、声音、光探测和测距数据，并通过适当的加密来防止伪造。


    上述数据中还应该包括事件发生时所使用的机器学习算法、代码版本和相关训练数据。如何对这些日志中的大量数据进行分析仍然是待研究的'
  merge: -1
  img_proc: true
- pgno: 165
  md: '问题。隐私和安全问题使设计复杂化，比如谁拥有数据，以及制造商、运营商、保险公司、记者和警察以何种权利访问或发布这些数据集等法律问题。调查人员能够通过有效的用户界面、可视化、统计方法和辅助人工智能系统探索审计跟踪，以了解大量数据背后的含义。


    审计追踪的重要扩展是事件数据库，该数据库通过捕获航空、医药、运输和网络安全等领域公开报告的事件记录而形成。人工智能合作伙伴已经启动了一个人工智能事件数据库，其中包含一千多份报告（请参阅第
    20 章“故障和未遂事件的广泛报告”部分）。


    # 软件工程工作流程


    随着人工智能技术和机器学习算法被集成到 HCAI 应用中，软件工程的工作流程正在更新。所面临的新挑战包括，用于验证和确认算法和数据的新型基准测试（请参阅本章的“验证和确认测试”部分），通过改进偏差测试以增强算法和数据的公正性（请参阅本章的“偏差测试以增强公正性”部分）和敏捷编程团队的方法。所有这些实践都必须针对不同的使用领域进行调整，如医疗健康、教育、环境保护和国防。为了满足用户和法律要求，软件工程工作流程必须支持可解释的用户界面（参见本章的“可解释的用户界面”部分）。


    由张洁曼（Jie M. Zhang, 音译）、马克·哈尔曼（Mark Harman）、马磊（Lei Ma, 音译）和李阳（Yang Li, 音译）组成的国际团队描述了机器学习的五种问题类型，它们需要不同于传统编程项目的软件工程工作流程：


    +   ①分类：为每个数据实例分配一个类别，例如图像分类，手写识别。


    +   ②回归：为每个数据实例预测一个值，例如温度、年龄、收入预测。'
  merge: -1
