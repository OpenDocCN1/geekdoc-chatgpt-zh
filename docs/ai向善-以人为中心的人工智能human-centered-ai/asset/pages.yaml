  md: 'HCAI 社区的早期工作是收集关于 HCAI 事件的数据。罗曼·扬波尔斯基（Roman Yampolskiy）收集的一系列最初的事件被纳入了人工智能伙伴关系的一个更宏伟的项目中。肖恩·麦格雷戈（Sean
    McGregor）描述了令人钦佩的目标和方法，以用于构建来自流行、贸易和学术出版物领域的 1 000 多个事件报告的数据库。人们可以通过“抵押贷款”或“面部识别”等关键词和短语进行搜索，但关于这些事件的一份深度报告仍有待完成。尽管如此，这仍然是一个重要的项目，它可以帮助我们努力打造一个更可靠、更安全、更值得信赖的系统。


    另一个重要但范围更窄的项目由卡尔·汉森（Karl Hansen）牵头，他负责收集与特斯拉汽车相关的死亡事件的公开报告，他是美国陆军刑事调查司令部保护服务营的一名特工，于
    2018 年被特斯拉聘为内部调查员。他声称自己因公开报道特斯拉汽车的死亡事件而被特斯拉解雇。从日常向公众展示的情况来看，截至 2021 年 9 月，特斯拉的车辆故障已造成
    209 人死亡，这远远超出了大多数人的预期。这些报告是不完整的，所以很难确定每个案例发生了什么，或者 “Autopilot” 自动驾驶系统是否在运行。2021
    年 8 月，美国国家公路运输安全管理局对 11 起特斯拉自动驾驶汽车碰撞路边急救人员的事故展开了调查。


    截至 2020 年 1 月，美国国家公路交通安全管理局收到了 122 起涉及特斯拉的突然意外加速事件的报告。一份典型的报告是这样描述的：“我妻子慢慢地靠近车库门，等着车库门打开时，汽车突然向前倾斜……撞坏了车库门……汽车在撞到车库的水泥墙时才停了下来。”
    另一篇报道描述了汽车的两次突然加速，最后说 “幸运的是没有发生碰撞，但我们现在仍很害怕”。特斯拉声称，其调查显示车辆运行正常，每起事故都是司机踩油门造成的。然而，一辆声称安全第一的汽车难道不应该防止其与车库门、墙壁或其他车辆发生碰撞吗？'
