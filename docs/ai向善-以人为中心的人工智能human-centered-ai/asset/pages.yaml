  md: '安全发展提出了大量建议。这份报告警告了美国与中国的竞争形势，试图保持美国在人工智能领域的领导地位，但如果赋予伙伴关系、合作方和外交领域更多的信任，人工智能会更强大。该报告提出了实施潜在监管、监督、教育以及大幅增加资金的方向，以追求可解释性、可视化和增强型人机交互。


    另一个活跃在人工智能和算法领域的美国政府机构是联邦贸易委员会。

