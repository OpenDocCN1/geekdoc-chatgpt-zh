  md: '# AI 向善

    以人为中心的人工智能


    乘客心脏病发作、鸟类袭击导致的发动机停止等，这些情况都需要熟练的专业人员迅速做出艰难的决定。


    虽然所有的隐喻，包括这个隐喻，都有其局限性，但它们在传达思想上有其价值，并可以打开思想的大门，迎接新的可能性。本书第三部分建立在第二部分的 HCAI 框架上，直接论述了
    HCAI 研究的两个设计目标：


    （1）科学目标：英属哥伦比亚大学教授戴维·普尔（David Poole）和艾伦·马克沃斯（Alan Mackworth）写道，科学目标是研究“智能行动的计算代理”。他们想“了解使智能行为在自然或人工系统中成为可能的原理……通过设计、构建和实验计算系统来完成通常被认为需要智能才能完成的任务”。科学目标通常基于对人类感知、认知和运动技能的研究，以便工程师可以建立起能够像人类一样或比人类更好地执行任务的系统，例如下棋程序或识别癌症肿瘤的设备。


    （2）创新目标：开发增强人类能力的计算机，使人们能够自主完成工作。创新目标来自建立广泛使用的产品和服务的研究。普尔和马克沃斯写道，创新“旨在用于应用领域”。成功的案例包括基于地图的导航系统、自然语言翻译和搜索查询。


    这两个目标对于思考未来技术的设计隐喻都有价值。然而，其挑战在于了解每个目标在何时达到最佳状态以及如何组合这些目标。有些功能可能最适合自动处理，例如数码相机的对焦和光圈设置，而其他功能可能最适合交给人类控制，例如构图和选择何时进行拍摄——摄影师称之为“决定性时刻”。


    这两个目标引导我们对 HCAI 研究进行了四对设计隐喻的描述。所有这些隐喻都是有价值的，但出于不同的原因：高度的计算机自主性允许无人监督的活动，而高度的人工控制允许人类进行干预。其中一对隐喻是智能代理和超级工具，前者表示机器或系统具备独立行动能力，后者表示在使


    088'
