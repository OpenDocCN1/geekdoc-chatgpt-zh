  md: '示例 9.2: 洗碗机、洗衣机、烘干机、烤箱等家用电器允许用户选择他们所需的设置，然后将控制权转交给传感器和计时器。如果设计良好，这些设备的用户使用界面应易于理解和可预测。它们允许用户表达意图，并可以监控当前状态，用户可以暂停洗碗机并再放入一个盘子，或把烤箱从烘烤模式设置为炙烤模式，从而把把鸡肉烤成棕色（第
    7 条黄金法则）。自动化设计使用户能更好地控制这些有源设备，以确保用户得到想要的结果（图 9.2）。


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_81_0.png)


    示例 9.3: 电梯。其设计良好的用户界面，在实现大量自动化的同时也提供了适当的人工控制。控制面板是简单的双按钮设计，用户可以按向上键或向下键，按钮指示灯亮起表示其意图已经被识别；显示面板会显示电梯的当前楼层，用户能知道还需要等待多久。当电梯门打开并发出提示音后，用户便可进入电梯，按下楼层选择按钮，按钮指示灯亮起表示其意图已经被识别，电梯门随之关闭；楼层显示器会显示当前所处楼层；到达时，提示音响起，电梯门打开。这种取代人工操作的自动化设计可以确保电梯门仅在相应'
