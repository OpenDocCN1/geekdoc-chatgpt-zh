- pgno: 236
  md: '目多种多样，从自然科学到生物化学，从历史学到人类学——只要你能说出名字，就可能有一个以此为重点的民间科学项目。通常情况下，这些项目是由科学家或其他专业人士与自愿帮助收集和分析数据的公民一同组织的。现在，越来越多的民间科学家参与项目的规划和管理，并撰写公开报告和学术论文。


    民间科学项目成千上万，有些因其规模和持续时间而表现突出，例如康奈尔大学的 eBird 项目，该项目有超过 1 亿份关于鸟类观察、行为和迁徙的报告。牛津大学的动物宇宙计划（Zooniverse）支持了
    100 多个项目，动物宇宙计划从星系动物园（Galaxy Zoo）项目开始，标记了 15 万张螺旋星系团和球状星系团的图像。加州大学伯克利分校信息学院的三位硕士研究生内特·阿格林（Nate
    Agrin）、杰西卡·克莱恩（Jessica Kline）和上田肯一（Ken-ichi Ueda）于 2008 年启动了 iNaturalist 项目，以收集生物多样性的数据。三位研究生的付出开花结果，并与加州科学院和美国国家地理学会发起了一项联合倡议。到
    2021 年 2 月，iNaturalist 项目的社区成员超过 300 万名，并收集了 32 万多种物种的 6 000 万份报告。这三项数据中的每一项都促成了同行评议的数百篇科学论文和大众媒体上的无数故事。截至
    2021 年 6 月，美国联邦政府及其机构通过国家公园管理局、国家海洋和大气管理局、国家航空航天局和国会图书馆等不同机构已经支持了 491 个民间科学项目。他们的标语是“通过公众参与帮助联邦机构加速创新”。


    即使在低成本、功能强大的计算机时代，处理民间科学项目的大量数据也是一个挑战。那么，这些项目如何确保提供高质量、可靠的数据，同时为成千上万贡献时间和精力的民间科学家提供丰富的经验呢？该问题的答案是将公民的技能与人工智能的力量相结合。当然，这已经在一些项目中实现了，例如使用计算机视觉和深度学习算法来识别相机陷阱照片中的动物种类、计算飞过头顶的鸟的数量、从单个树叶的照片中识别树木。此'
