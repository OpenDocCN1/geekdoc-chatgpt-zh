- pgno: 225
  md: '监管可以是适度的，除非这些监管是用于限制竞争或帮助弱势群体，如残障人士、儿童或老年人用户。


    怀疑者还指出了对政府机构的“企业俘获”，即与政府机构工作人员关系密切的企业领导人任命于本行业的监管机构。这些在政府工作的企业领导人可能是见多识广的专业人士，但许多人质疑他们是否会采取强硬立场，从而激怒他们的前同事。


    美国国家算法安全委员会的概括性提议已经引发了讨论，但将 HCAI 的专业知识添加到现有的监督、监管机构是一种更实际的方法。这是有道理的，因为现有的监管机构将推动并扩大其监督作用，也因为政策需要适应不同行业的需求。而这正是一些美国政府机构在审查
    HCAI 项目时所做的。


    一个很好的例子是美国食品和药物管理局，该管理局起草了一份经过深思熟虑的计划，对重症监护病房和皮肤病变图像分析应用等医疗设备中的人工智能和机器学习软件的更新进行监管，并征求讨论这些方法如何“能够实时调整和优化设备性能，以持续改善患者的医疗保健状况”，并认识到食品和药物管理局必须采取行动“确保到达用户的技术是安全且有效的”。


    类似地，美国联邦航空管理局软件和系统分部一直在处理座舱系统中的自适应软件，该软件基于人工智能，可以根据飞机传感器的当前数据改变其行为。支持者们发现该软件可以提高飞机安全性能，但飞行员、空中交通管制员和监管机构则担心软件会造成不可预测的行为。欧盟航空安全局在
    2020 年发布了一份“以人为中心的航空人工智能方法”的 15 年路线图，该路线图强调了基于问责、监督和透明度的可信度的必要性。


    从 2019 年开始，美国国家标准与技术研究所在评估人工智能可信度和可解释性方面发挥了重要作用。该研究所组织的研讨会以及报告、网站提供了有用的信息。另一项重大努力是美国国家安全委员会关于人工智能的最终报告，该报告就通过大幅扩大人工智能系统的研究与实施以支持国家'
