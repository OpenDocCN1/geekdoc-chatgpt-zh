  md: '员和用户的价值。另一项对 29 名专业人士的访谈研究强调了在制定解释时需要社会和组织背景。然而，可解释的方法只可能是以不同于研究的方式，缓慢地融入被广泛使用的应用程序。


    随着人工智能研究界越来越多地了解几个世纪以来的相关社会科学研究，墨尔本大学的蒂姆·米勒（Tim Miller）对此进行了深刻的描述，他抱怨称：“可解释人工智能的大多数工作只使用了研究人员的直觉，即什么是‘良好的’解释。”米勒对社会科学方法和评估方法的广泛而深入的回顾令人大开眼界，但他承认，将其应用于解释人工智能系统“不是一个简单的步骤”。


    对可解释人工智能的强烈需求催生了商业工具包，比如国际商业机器公司的 AI Explainability 360。该工具包提供了 10 种不同的解释算法，可以由程序员针对不同的应用程序和用户进行微调。国际商业机器公司的大量测试和案例研究表明，他们已经发现了有用的策略，这些策略可以满足开发人员、业务决策者、政府监管机构和用户消费者的需求。


    得州农工大学的团队杜孟南（Mengnan Du，音译）、刘宁浩（Ninghao Liu，音译）和胡夏（Xia Hu，音译）对当前可解释人工智能的方法进行了综述，对本质上可解释的机器学习模型（如决策树或基于规则的模型）和更常见的事后解释方法进行了有用的区分。但是，即使是本质上可解释的模型，大多数人也很难理解，甚至对专家来说也是一个挑战。他们将这些方法与自然语言描述决策原因的常见方法进行了对比。因为这些解释是在算法决策做出之后产生的，因而被称为事后（或回溯性）解释，是为那些对结果感到惊讶并想知道某个决策做出原因的用户生成的。例如，一个珠宝电子商务网站可能会报告说：“我们提出这些建议是因为您去年在情人节前订购了银项链。”事后解释是研究人员的首选方法，其是在使用深度学习神经网络和其他黑盒方法时。但是，如果允许提出后续问题并进行用户测'
