    1992 年开发的会说话的芭比娃娃（Mattel Barbie），以及 2015 年的版本。美泰公司没有进一步开发会说话的芭比娃娃的计划。


    文本式聊天机器人的用户界面开发是研究人员和企业家遵循的另一条路径，尤其是以移动应用程序和网站上的客户服务代理的形式。虽然文本聊天机器人并不遵循社交机器人的严格定义，因为它们通常只是文本且没有面孔，但设计师给它们融入了礼貌、幽默、乐于助人和为失败道歉的社会习俗。微软的聊天机器人
    Tay 在一天内就被关闭了，因为它的算法开始发出攻击性的言论，但它的继任者 Zo 在 2019 年被关闭之前维持了两年多。中国的“小冰”取得了更大的成功，它采用了同样的微软技术，但现在已经为一家中国公司所有。“小冰”拥有数亿用户。“小冰”被赋予了一个开朗的少女的性格，她会读新闻、唱歌、创作艺术。


    Replika 是一个“关心……的人工智能伙伴，它总是在这里倾听和交谈”，它有一个类似人类的脸，用户可以对其进行配置。随着时间的推移，它理解了你的个性，从而成为一个富有同情心的交谈朋友（图
