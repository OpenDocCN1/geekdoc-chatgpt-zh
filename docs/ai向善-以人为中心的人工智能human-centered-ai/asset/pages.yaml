  md: '虽然删除所有攻击性的帖子是不可能的，但减缓这些帖子的传播和封禁匿名机器人账户是件值得努力的事情。然而，社交媒体平台需要付出多少精力，以及什么样的监管压力才能让脸谱网改变其商业模式，这些问题仍然存在。《推特规则》（Twitter
    Rule）和《油管社区指南》（YouTube Community Guideline）是社交媒体平台进一步努力防止多种形式的虚假信息的例子。推特决定停止传播政治广告，这是降低选举干扰的积极举措。


    阻止虚假信息的两个正面示例表明是有可能的取得进展。第一个正面示例是谷歌公司，谷歌公司同那些试图利用搜索引擎算法将餐馆、商店或产品推广到谷歌搜索结果页面顶部的人进行了一场斗争。狡猾的企业所使用的一个简单策略是在其网站上无形地重复公司或产品名称几十次，而更复杂的策略是雇佣机器人留下正面评论并链接到该网站，使从表象上比实际情况更受大众欢迎。谷歌指派了
    3 000 多名员工开发了复杂的算法来对抗这些商业欺骗行为，因为谷歌有强大的动机来确保其搜索结果是可信的。第二个正面的示例是脸谱网的德国团队，德国的反极端言论法律得到了强有力的执行。起初，脸谱网在阻止发表极端言论的帖子方面变现不佳，遭到了
    200 万欧元的罚款，虽然这只是脸谱网收入的一小部分。然而，恶意的宣传和更大数额罚款的威胁促使脸谱网聘请了 100 多名内容检查员，并使用越来越复杂的人工智能算法来检测极端言论。


    其他煽动暴力的极端言论发生在缅甸、埃塞俄比亚、印度等其他国家。极端言论和虚假信息在煽动 2021 年 1 月 6 日美国国会大楼骚乱中发挥了重要作用。关于唐纳德·特朗普总统选举失败的谣传，如声称选举舞弊、投票机器被操纵、选票丢失等，激怒了暴力抗议者，他们冲进国会大厦，阻止选举认证程序，造成
    5 人死亡。


    人们相信互联网、万维网和社交媒体会给边缘化的声音以更大发言权，这一信念已经实现，但当恶意行为者利用这一权利时，可能会伤害个人，'
  merge: -1
  img_proc: true
- pgno: 242
  md: '对整个社区造成致命影响，并对原本稳定的政府造成威胁。为了化解公众安全的争论，我们需要更有效的算法和更好的人类控制。虽然匿名一直是互联网服务的一个重要原则，但也受到了一些要求的制约，例如脸谱网规定，用户必须用“日常生活中使用的名字”注册，且只能有一个身份信息。然而，这些规则经常被违反，因此更严格的执法力度和更大的个人责任可能有助于减少滥用。


    如果社交媒体平台要对其网站上推广的有害和非法活动承担责任，那么这些平台就会变得更加可靠、安全和可信赖。这一问题规模巨大且尤为重要，其威胁着现有的政府、公司和个人。阻止虚假信息的传播需要研究人员、开发人员以及政府和企业领导人的大量投资和创造性贡献。


    # 寻找重大疾病新疗法和疫苗


    新冠疫情引发了全世界的关注，即如何为感染者寻找治疗方法和疫苗研发以预防感染。这个问题的基础是需要了解氨基酸链的 DNA 序列是如何生成具有独特三维结构的蛋白质。蛋白质是以线性方式合成的，然后根据成百上千个氨基酸之间的吸引力和排斥力，以不可预测的方式折叠起来。在几毫秒内，这些氨基酸折叠成螺旋状、片状等其他结构，这些结构决定了每个蛋白质的生物特性。


    DeepMind 是谷歌在伦敦的子公司，该公司开发了 AlphaFold 以及大幅改进的 AlphaFold 2，可预测成百上千个氨基酸的线性链如何折叠成三维蛋白质结构。50
    多年来，这一直是一个巨大的挑战，但是在一个名为“蛋白质结构预测技术关键评估”（简称 CASP）的年度竞赛中，AlphaFold 2 的表现已经超过了其他方法。AlphaFold
    2 的深度学习程序是在一个包含 17 万个蛋白质的数据库上训练的。到 2020 年 11 月，AlphaFold 2 对 CASP 竞赛中三'
  merge: -1
  img_proc: true
- pgno: 243
  md: '分之二的蛋白质进行了可靠的预测，在 97 个目标中的 88 个目标上击败了其他竞争对手。这一成功的反应非常热烈，诺贝尔奖得主、结构生物学家文卡·拉马克里希南（
    Venki Ramakrishnan ）称 AlphaFold 2 的成功是“蛋白质折叠问题上的惊人进步”。


    随着生物医学研究人员努力了解分子结构如何影响生物过程，例如病毒如何入侵细胞膜，其影响仍在不断显现。准确的蛋白质折叠结果是开发治疗方法或疫苗过程中的一大步。这是人工智能深度学习算法的一个重要成功，接下来将由生物医学研究人员和药物开发人员探索已知药物如何与病毒分子发生反应。


    寻找候选治疗方法和疫苗是重要的第一步，但是需要 HCAI 方法和可视化工具来分析来自人类随机临床试验的数据。当统计方法与可视化相结合，发现数据质量错误、异常模式和重要异常情况时，数据分析就取得成效了。这些随机临床试验对处于生命不同阶段的不同人群的治疗方法和疫苗的有效性和安全性进行了评估，这些人往往患有可能引发致命副作用的其他疾病。因此，生物医学研究人员需要了解与其他药物的相互作用，以及孕妇或幼儿的特殊需要，以便找到最佳治疗方法和研制成功的疫苗。


    随着世界上越来越多的人开始期待更好的医疗保健以延长预期寿命，对预防和治疗疾病的期望和需求也会随之增加，包括癌症、心肺问题以及各种形式的细菌和病毒感染。提高贫困地区的生活水平和医疗保健将需要创造性的低成本和易于实施的预防和治疗。解决这些问题还需要创造性的方法，并用该地区的语言进行教育和宣传，同时注意文化差异。通过结合有关提升民间科学和减少虚假信息的经验教训，以人为中心的方法也许可以提高人们对个人、社区和地区领导人如何改善健康、预防疾病的认识。


    随着问题和期望的增加，新的重大挑战将定期出现。对于研究人员来说，持续不断的好奇心是几十年后重大突破的基础。在某些情况下，这当'
  merge: -1
