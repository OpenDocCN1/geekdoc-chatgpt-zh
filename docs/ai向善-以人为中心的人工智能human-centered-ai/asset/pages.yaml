  md: '能的解决方案、激发公众讨论、支持调查性新闻以及改变公众的态度。然后，由政府机构向工作人员提供政策指导，并在可能的情况下制定新的规章制度，由审计公司改变其流程以适应
    HCAI，由保险公司在承保新技术时更新其风险评估方法。非政府组织还可以通过开展独立的监督研究来分析广泛使用的 HCAI 系统，从而产生影响力。非政府组织的报告能够提供新的见解和评估流程，以适应不同行业的需求。


    # 专业组织和研究机构


    事实证明，专业组织在制定自愿准则和标准方面是有效的。已经建立的新组织（附录 B）正在积极参与关于负责任人工智能的道德和实用设计原则的国际讨论，并已经产生了积极的影响力。然而，怀疑者则提醒说，行业领袖往往主导了专业组织，有时也被称为“企业俘获”，因此行业领袖可能会推动较弱的指导方针和标准。


    电气和电子工程师协会等专业协会长期以来一直有效地支持国际标准，目前在 P7000 系列标准上所做的工作涉及自主系统的透明度、算法偏见的考虑、自动和半自动系统故障的安全设计、新闻来源的可信度评级等内容。美国计算机协会的美国技术政策委员会有几个小组专门负责解决可访问性、算法问责、数字管理和隐私问题。专业协会所面临的挑战是如何提高其成员在这些工作中的参与率。电气和电子工程师协会推出了一项自主智能系统的道德认证计划，旨在为企业制定衡量指标和认证方法，以解决透明度、问责性和算法偏差的问题。


    长期以来，学术机构一直在进行人工智能的研究，但现如今，他们已经组建了一个个大型的研究中心，并促进人们对 HCAI 道德、设计和研究主题的兴趣。早期的工作，如道德问题和决策策略，已经开始被加入教育中，'
