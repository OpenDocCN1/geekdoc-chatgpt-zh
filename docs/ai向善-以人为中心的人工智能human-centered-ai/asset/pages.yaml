  md: '本书的主要内容是理念框架（第二部分）、设计隐喻（第三部分）和治理结构（第四部分）。这些内容阐明了以人为中心的思维将如何通过可靠、安全、可信赖的系统，实现强大人工智能算法的广泛应用。


    人工智能从专注于算法扩展到涵盖用户体验设计方法，实践者和研究群体开始定期讨论道德、负责任的人工智能、公正性、可解释性等其他话题，设计师也越来越倾向于使用 HCAI
    的框架来指导设计，从而同时实现高度人工控制和高度自动化。良好的设计隐喻通常结合了为某些任务带来可靠自动化的特性和为其他任务带来面向用户的控制面板的特性。商业领袖和政策制定者开始认识到
    HCAI 治理结构所带来的竞争优势，因为可靠、安全、可信赖的系统才会受到用户的重视。治理结构的全球实质性兴趣正在转变为区域组织、国家、行业领袖和公司管理者采取的可执行政策。


    未来 HCAI 产品和服务的研发有很多吸引人的方向。第 24 章提出了几个 HCAI 项目及其后续步骤，并通过课程、指南和成功案例为学术界、工业界、政府和非政府组织采用
    HCAI 方法提供支持。


    第 25 章提出了 HCAI 系统可信度的评估和其他广泛讨论的属性的核心挑战。当客观衡量无法达成时，利益相关者认知的主观衡量更值得考虑。第 26 章将本书的观点运用于照顾老年人并向老年人学习之中。第
    27 章将进行总结，并重申本书的目标。'
