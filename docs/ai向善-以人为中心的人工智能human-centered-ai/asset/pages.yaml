  md: '能够取得成功，并主张采用 HCAI 设计过程作为其前进的方向，让利益相关者参与设计讨论、用户界面和控制面板的迭代测试，让产品具有更高的透明度以及赋予人类对算法更大的控制权。我构想了可解释的用户界面、用于分析失败案例和未遂事件的审计追踪以及指导决策的独立监督（详见第四部分）。简而言之，以人为中心的设计思维与最佳的人工智能方法相结合的新方法，将极大地推动有益于人类的有意义的技术的发展。


    这些关于人工智能研究的争论对政府研究、重大商业项目、学术研究和教学以及公众印象产生了巨大影响。本章将人工智能研究的众多目标简化为两个方面：科学和创新，然后描述了四对可以有效结合的设计可能性（图
    11.1）。组合设计可能在某些情况下需要更多的自动化，而在其他情况下，可能需要更多的人工控制。组合设计还能更加细致地选择哪些功能可以由计算机可靠地完成，哪些功能应该保持在人类的控制之下。


    # 人工智能研究的两大目标


    | 科学目标 | 组合设计 | 创新目标 |

    | :--- | :---: | :--- |

    | 智能代理<br>思维机器、认知行动、人工智能、知识渊博 | | 超级工具<br>扩展能力、赋能用户、提高人类表现 |

    | 队友<br>合作者、同事、乐于助人的伙伴、聪明的同事 | | 远程机器人<br>可操纵的仪器、强大的假肢、提升人类的感知和运动技能 |

    | 确定的自主性<br>独立、自我指导、目标设定、自我监控 | | 控制中心<br>人工控制和监督、态势感知、预防措施 |

    | 社交机器人<br>拟人、人形、仿生、受生物启发、类人 | | 有源设备<br>面向消费者、用途广泛、成本低、易于理解的控制面板 |


