  md: '评估，对于其他属性，还需要使用其他评估量表。


    如果能够对两个 HCAI 系统进行比较，让设计者知道哪些改变可以最大限度地提高这些属性的评分，这将是非常有用的。一种有用的方法是为所有属性都贴上标签，就像食品包装袋上的营养标签一样，这样消费者就可以比较产品，这也正是国际商业机器公司的
    Factsheets、微软的 Datasheets 和谷歌的模型卡的目标所在。


    用于验证和确认性能的系统测试有助于识别错误，但不能评估 HCAI 系统在不同的真实环境中是否可靠、安全或可信赖。针对训练数据的偏差测试和用户界面的可用性测试也是发现问题的积极步骤，但它们无法提供度量或完整的系统评估或分数。尽管消费品评级或大学排名等方式存在缺陷，但它们对决策者来说仍然有帮助。


    一些研究计划提议针对特定属性进行评估，例如，人为因素专家罗伯特·R·霍夫曼和彼得·汉考克提出了一种基于 27 种开发程序来衡量弹性的方法，包括跟踪异常和评估数据质量。对于可靠性、可用性等其他属性，他也提出了类似的建议，但都需要改进才能获得广泛的接受。


    对于某些属性，可通过客观评估或各组成部分的主观评估来完成评分。除了这些方法之外，社会过程和独立监督也可用于评估 HCAI 系统的诸多属性。表 25.1 列出了
    30 多个经常被提及的属性，我将这些属性整理成五个类别。这些类别大致指明了系统的属性、实践中的表现、利益相关者的感知、与独立监督的一致性、公认实践的兼容性。本章最后提出了基于主观判断的
    HCAI 可信度量表的建议。


    评估方法有很多种，但本章的重点是客观测量、按组成部分评分以及按社会过程评估，旨在找到可被广泛接受、可重复且有用的评估方法。'
