  md: '时间或当前设备温度的状态显示，都可以标准化。可考虑的更好做法是，所有这些设备都可以连接到我的手机或笔记本电脑，这样当我不在家时也可以控制它们。


    家用的另一类有源设备，即医疗设备，可以通过一致性的用户界面做得更好。常用设备有体温计、体重秤、计步器、血压计和脉搏血氧仪，专用设备包括针对糖尿病患者的血糖监测仪、针对女性的月经周期监测仪，以及针对睡眠呼吸暂停患者的持续正压通气设备。此外，运动器械是一个发展迅速的领域，如跑步机、椭圆仪、动感单车和划船机。一些制造商打出了“人工智能驱动”的广告，表明锻炼过程可通过机器学习技术实现个性化，其中一些器械可以显示时间和日期设置，但各设备的控制面板和数据显示大不相同，对于这些运动器械来说，移动设备或笔记本电脑上的一致的用户界面和操作尤为有用。对于医疗和健康设备的需求，用户往往需要记录数月甚至数年的历史数据，因此自动记录有助于用户跟踪健康状况，这些健康数据可以用于分析、确定病变情况，并共享给临床医生以改进治疗计划。


