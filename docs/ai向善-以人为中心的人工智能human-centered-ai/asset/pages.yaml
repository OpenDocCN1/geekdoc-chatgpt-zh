  md: '在飞机上，我们常常可以看到人们使用笔记本电脑办公，但当一位挂着白色拐杖的盲人女士坐到我旁边时，我感到非常惊讶。飞机刚起飞后，她拿出笔记本电脑开始处理一份商业报告。她通过耳机边听取文本内容，边熟练地修改和格式化文件。当我和她交谈时，她说她是犹他州无障碍中心的负责人。她证实，可访问性指南和普通笔记本电脑上实现的功能使她能够以专业人士的身份充分参与进来。


    该指南强调用户控制，甚至适用于残障用户，这推进了计算的广泛应用，然而，在众多的人工智能会议上，人们对机器人和智能术语以及来自科学目标中借用的隐喻仍然非常感兴趣。会议论文可能描述了创新，但通常的方法往往是让计算机自动执行任务，例如读取乳腺
    X 光片或自动驾驶汽车。


    然而，也有强烈的创新目标观点描述了通过人类操作超级工具和有源设备进行设计的方法。这些观点更有可能出现在增强人类会议上，以及由美国计算机协会的人机交互学会、用户体验专业协会和全球类似组织等组织举办的数十场人机交互会议上。世界可用性日等活动推动了学术界、工业界和政府的合作。在美国计算机协会的智能用户界面等会议上，一些专家学者提出了组合观点的想法。


    应用程序的开发人员负责苹果和谷歌应用商店中的 300 万个应用程序，即使在内部使用了大量的人工智能技术，他们通常构建了工具式的用户界面。这些开发人员明白用户通常希望设备易于理解、可预测且在他们的控制下操作。


    组合设计可以是构建内部操作的科学目标技术，同时用户可以看到赋予他们明确选择的授权界面，如全球定位系统、网络搜索、电子商务和推荐系统。人工智能引导系统为用户提供拼写和语法检查、网络搜索和电子邮件撰写等方面的建议。华盛顿大学教授杰弗里·希尔（Jeffrey
    Heer）展示'
