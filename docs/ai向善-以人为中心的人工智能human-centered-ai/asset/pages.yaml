  md: "# 第 24 章\n\n# 推动 HCAI 前行\n\n> 摆在我们面前的真正问题在于：这些工具是否能延长生命并提升其价值？……机器本身提不出要求，也不会做出承诺：提出要求并信守承诺的是人类的灵魂。\n\
    > \n> 刘易斯 · 芒福德，《技术与文明》\n\n将人工智能思维扩展到涵盖 HCAI 方法是本书的核心目标。该目标意味着收集用户需求、遵守设计指南、对用户进行迭代测试以及产品或服务发布后的持续评估。将这些方法纳入教育和实践，需要学术界、商界、政府和公民社会组织多方的持续努力。本章将从几个研究和开发项目所面临的挑战的示例开始，随后为大学、企业和政府提供了加快采用\
    \ HCAI 的方法。\n\n# 研究方向\n\nHCAI 这一话题提供了鲜明的研究可能性和应用环境，并向许多吸引人的方向扩展。面向技术的研究人员希望改进深度学习算法及其变体，而面向社会的研究人员希望减少偏见，以确保公正、精确、可用的系统。道德学家将提出新的解释，实践者将为开发人员构建更好的工具，政策制定者将制定国家议程，机构工作人员将梳理现有的执行规则和法规，资助机构将选择有前途的研究计划。"
