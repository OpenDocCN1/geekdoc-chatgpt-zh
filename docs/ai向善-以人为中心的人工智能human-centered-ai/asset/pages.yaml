    | 道德的使用 | 系统的结果是否以合乎道德的方式使用？ |

    | 仁爱 | 系统是否支持人类的健康、舒适性和价值观？ |

    | 安全 | 系统易受攻击的程度如何？ |

    | 隐私 | 系统是否保护个人身份和数据？ |

