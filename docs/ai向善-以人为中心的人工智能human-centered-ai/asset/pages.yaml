    # # 动物机器人


    虽然类人社交机器人受到一些用户的青睐，但尚未取得成功，许多开发人员认为，类似动物的宠物机器人可能具有足够的吸引力，从而激发消费者的热情。


    PARO 治疗机器人是一种人造毛皮覆盖的白色海豹状机器人（图 16.2），配有触觉、光线、声音、温度和姿势传感器，因此该机器人能“像有生命一样做出反应，移动头部和腿部，发出声音，以及……模仿格陵兰海豹宝宝的声音”。


