  md: '自动门前的黑色垫子通常不是传感器，但它们是一个明确的指示——当你踩在垫子上时，摄像头传感器就会捕捉到你的图像。为残障人士设置的操控按钮使他们能够按需激活自动门，并使门持续打开的时间更长，这样他们就可以安全通过。即使在这些技术含量相对较低的应用领域中，更多的用户控制权也有助于打造更可靠、更安全、更值得信赖的系统。


    总之，自动化系统是一个不错的选择，但确保正确激活并防止非预期激活的策略对实现可靠、安全、可信赖的操作有很大帮助，这样一来用户的接受度也将得以提高。维护人员收集的性能数据也是一个很好的参考，这些数据能够帮助维护人员了解操作是否正确并进行相应的调整控制，以确保设备正确运行。


    在生命攸关的应用领域中，上述问题就变得至关重要，比如安全气囊的展开。在美国，安全气囊能在 0.2 秒内爆炸式展开，每年能挽救约 2 500 人的生命。然而，早年有超过
    100 名婴儿和老人因安全气囊非预期展开而丧生，这些悲剧的发生频率直到改进设计后才得以降低。我们从这些事件中得到的重要教训是，收集安全气囊故障和非预期展开的数据可以为系统改进提供必要的信息，从而使系统更可靠、更安全、更可信赖。当自动系统的故障和未遂事件被跟踪以支持设计的改进时，且当公共网站能够报告事故时，系统的质量和接受度都会提升。


    对于许多重要的应用领域，如汽车驾驶，安全是第一位的。我可能愿意买一辆如果我呼出的酒精浓度超过法定水平就不让我驾驶的车。我更迫切地要求所有的汽车都安装这样的系统，以防止他人对我造成伤害。但另一方面，当我开车送受伤的孩子去医院时，如果系统因测量错误而不让我驾驶车辆，我会非常生气，因为这辆车不值得信赖。


