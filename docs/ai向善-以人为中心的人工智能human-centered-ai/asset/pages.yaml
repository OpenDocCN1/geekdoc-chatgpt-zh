- pgno: 70
  md: '虽然这四个象限显示了清晰的分隔，但人工控制和计算机自动化之间的关系更为复杂。人工控制可能需要像在汽车、飞机或电站控制中心等领域那样，在多小时内保持警惕，但人类的注意力可能会分散，系统需要发出警报来让操作人员关注新出现的问题。随着计算机控制变得更加可靠，人们的警惕性问题也在增加，因此操作人员很少需要进行干预，最终导致操作人员技能下降，无法快速而正确地进行干预。


    过度人工控制会让人们犯下致命的错误。有时，控制面板非常复杂，用户会感到困惑并不确定如何操作设备。英国斯旺西大学的哈罗德·廷布尔比（Harold Thimbleby）讲述了护士和医生使用的医疗设备如何导致“人为错误”的故事，这一情况应被视为设计错误。在其中一个案例中，护士使用了静脉注射系统的默认设置，向患者注射了过量的止痛药，导致患者死亡。默认设置应该设定在安全范围内，但该设备误导护士做出了致命的错误选择。


    家用电器也有保护装置，例如自清洁烤箱上的联锁装置，它可以防止在温度超过 315°C 时打开烤箱门的危险发生。设计不良的联锁装置可能会令人恼火，比如锁门过于频繁的汽车自动落锁系统。形式化方法和基于软件的约束，例如范围检查、泛化联锁和保护，可以确保算法进行有允许的输入并只产生可接受的结果。


    联锁或保护装置有助于防止错误发生，但需要额外的设计和监控功能，以确保其是可靠、安全和可信赖的。例如，列车主动控制系统，该系统可以限制列车在弯道或终点站高速行驶。如何将
    HCAI 设计集成到航空、柔性制造系统和植入式心脏起搏器等生命攸关的系统中是一个巨大的挑战。航空中众多的联锁装置可防止飞行员犯错，例如，只有当起落架上的应变仪显示飞机已经着陆时，喷气发动机上的反向推进器才能启动。


    类似的危险也存在于过度的计算机自动化中，比如美国国家运输安全'
  merge: -1
  img_proc: true
- pgno: 71
  md: '委员会关于 2016 年特斯拉汽车致命事故的报告中详述了这一点。该报告警告说：“仅仅因为我们可以实现”自动化，并不意味着人机自动化系统能更好地工作……这次碰撞是一个示例，在没有充分考虑人为因素的情况下，引入“因为我们可以”的自动化会发生什么后果。”特斯拉的“Autopilot”自动驾驶系统的名称表明，其描述性能比现实可用功能更强。特斯拉声称，这款车“能够在不需要驾驶人采取任何行动的几乎所有的情况下进行短途和长途旅行”。这似乎夸大了目前自动驾驶系统的能力，这很危险，因为它会诱导驾驶员降低警惕。


    虽然转向助力、自动变速箱、防抱死制动系统都是被广泛接受的成熟自动化系统，但能让驾驶员更好地控制车速的自适应巡航控制则更为复杂。更新颖的自动化系统增强了人类的能力，保障了人类安全，包括停车辅助、车道保持和避免碰撞。


    独立且非营利的美国公路安全保险协会研究员杰西卡·奇奇诺（Jessica Cicchino）报告说，有效的车道跟踪能最大限度地减少死亡人数，而避免后方碰撞能最大限度地减少事故数量。她的研究团队提供了详细的设计建议，包括视觉提醒、听觉提示和物理警告。他们的工作还包括检测驾驶员的注意力以及如何保持他们的驾驶参与度。像梅赛德斯
    - 奔驰汽车的主动泊车辅助系统会一步一步地向司机展示计划的动作，让驾驶员清楚地了解将会发生的情况，以便其接受或拒绝。因此，显示汽车的预期路径是一种更好的设计。科罗拉多大学的康纳·布鲁克斯（Connor
    Brooks）和丹尼尔·萨菲尔（Daniel Szafir）证实，预测性规划显示能够提高任务准确性和用户满意度。


    在某些驾驶情况下，人工智能系统会预测并警告司机注意 30 至 60 秒后的危险，例如当车辆接近一辆车速很快且频繁变道的汽车时，人工智能系统会提前提醒司机，然而在更多情况下，人工智能系统难以做到及时提'
  merge: -1
  img_proc: true
- pgno: 72
  md: '醒，留给司机的反应时间不够充分。我们应该尽量避免出现此类情况，比如利用来自其他汽车的避险数据或简单地降低车速。汽车系统无法预测山坡上是否会有巨石滚下来，但它可以提醒驾驶员前方有急转弯、前方一公里路上有紧急车辆，或者附近有快速行驶、在车道上穿梭的车辆。在未来，通过自动化系统以减少变道行为可能会变得普遍。此外，借助电子通信，车队可以保持在同一车道，并以一种快速而安全的方式行驶。


    把设计一款将安全放在首要位置的汽车作为目标可能比设计自动驾驶汽车更为合理。如果以这样的设计理念作为指导思想，在某些环境下，用户的安全性可以得到保障，例如，车队在限制进入的高速公路上行驶，或汽车在接近事故频发的十字路口时减速，或白天明亮的阳光降低了计算机视觉系统的效率。然后，这些变化可以通过提高安全性的方式加以改进和调整，最终减少对驾驶员控制的需求，类似于空中交通管制中心的区域中心的监督控制能力将会更强。


    这些控制中心标志着人类的参与和控制，并非表示计算机在完全独立工作。汽车交通管制员可能会管理数千辆汽车的交通流量，改变限速以响应天气和交通状况，调度警车、消防车和救护车，并跟踪频繁的未遂事件，以指导道路重新设计或汽车驾驶算法的改进。汽车制造商正在探索远程机器人驾驶汽车的可能性，如果驾驶员受伤、出现健康问题或睡着了，远程司机可以接管汽车的控制。


    汽车完全自动驾驶的概念正在有效地让位于以人为中心的理念，它提供了驾驶员适当的控制以提高安全性，同时解决了积雪覆盖的道路、异形车辆、蓄意破坏、恶意干扰和施工区域等众多特殊情况。另外一系列问题包括如何设计车辆来应对来自警察口头指示的紧急指导或消防救护车队的特殊需求。可考虑的解决方案是让配备有授权的警察、消防人员和救护车人员来控制附近的汽车，就像他们有特殊的钥匙来控制电梯，可以在紧急'
  merge: -1
