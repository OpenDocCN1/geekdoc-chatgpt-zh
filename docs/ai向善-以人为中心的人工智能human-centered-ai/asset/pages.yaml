- pgno: 257
  md: '+   ● 心率（无心率为 0 分，心率小于每分钟 100 次为 1 分，心率大于每分钟 100 次为 2 分）


    +   ● 对刺激的反应（用手弹婴儿足底或插鼻管后，婴儿无任何反应为 0 分，只有皱眉等轻微反应为 1 分，婴儿啼哭、打喷嚏或咳嗽为 2 分）


    +   ● 四肢肌张力（四肢松弛为 0 分，四肢略微屈曲为 1 分，四肢动作活跃为 2 分）


    +   ● 呼吸（无呼吸为 0 分，呼吸缓慢而不规则或哭声微弱为 1 分，呼吸均匀、哭声响亮为 2 分）


    这些相对简单的例子可用于评估葡萄酒质量和新生儿健康，有助于开发评估求职者、零售店选址或软件包购买等决策的评分方法。这些都是重要的决策，但更具挑战性的是生命攸关的决策，如医疗、军事或航空领域，这些决策提高了如下方面的重要程度，即提高评分、排名或比较的可靠性。

    一个好的评分方法将具有较高的“评分者间信度”，即不同的评分者会给出相当相似的分数。此外，评分方法还应具备可重复性，即当法官被要求对同一个组成部分进行评分时，他们会给出相似的分值。


    大多数策略取决于个人判断，有时会将各个判断汇总形成最终判断，例如奥运会评委组或招聘委员会。其他策略则依赖于社会过程，涉及小组或委员会成员之间的讨论，这些组织随后可能会修改个人分数或联合评估。


    更为详细的评分方式是问卷调查，问卷包含 100 多个条目，并采用类似语义锚定的李克特式（Likert）量表，其范围从 0 到 10 或从非常同意到非常不同意。可用性问卷已广泛应用于人机交互研究和产品评估之中。这些问卷最终形成了检查表，指导设计人员和开发人员审查自己的工作。HCAI
    的属性也可以按组成部分进行评分，这是本章末尾提出的 HCAI 可信度量表的基础。'
