    佩里（William J. Perry）和美国国家工程院院长、麻省理工学院前院长查尔斯·M. 维斯特（Charles M. Vest）。我们的工作是为数据挖掘、机器学习和行为监控等复杂的技术推荐评估方法，以便它们能够被安全地使用。所遇到困难之处是，我们需要严格评估这些新兴技术疯狂的信息索取行为，以保护个人隐私并限制不当使用。我的职责之一是研究独立的监督方法，阐明如何使用这些方法以及如何将它们应用于这些新兴技术。我们的统计测试过程被描述为“一个被用于评估基于信息的项目框架，以对抗恐怖主义和服务其他重要的'
