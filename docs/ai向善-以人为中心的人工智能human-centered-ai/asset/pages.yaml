  md: '随着人口老龄化，政府、企业和家庭将投入更多的时间、精力和费用来照顾老年人。相关政府政策，如社会保障、医疗保健等方面，越来越侧重于为老年人和残障人士服务。同样，针对辅助生活型住房和养老院的监管也越来越重要。


    护理机器人的倡导者们引用了一些统计数据，数据表明老年人的数量在不断增加，而照顾他们的年轻人却在减少。基于大量的学术论文和学术网站，这些倡导者们专注于设计护理机器人，它们通常是以类人外观的形式出现，可在现有的住房中为人类活动引路。这些社交机器人会模拟住家护理人员的行为，这重新提出了一个存疑的观念，即人类行为是技术设计的合适模型。为了开发服务于老年人的社交机器人，大量研究人员和企业都在试图寻找相关技术。一个以色列的团队采访了
    30 名平均年龄 78.5 岁、独立生活的健康老年人，报告称：“总而言之，我们的研究结果表明，大多数参与者都愿意与机器人进行社交互动。然而，如果社交是机器人的主要功能，参与者则表示强烈反对……他们认为机器人应该有一个明确的功能，并可以提高他们的生活质量。”


    此外，他们还发现，参与者强调真实性，同时拒绝“设备伪装成它本不该是的样子”，并担心“机器人的主动性和移动性可能产生威胁……他们需要控制和独立。”社交机器人的研究人员可能会发现，对这些问题的思考很有用，他们会思考如何设计以有助于实现人类自主、独立和自我效能。


    辅助老年人的其他 HCAI 方法强调对独立生活的技术支持，以提高老年人的自我效能，并提升家人、朋友、社区志愿者等其他照顾者的参与程度。即便是很小的设计改进也可能会带来价值：例如，自动转动以防止食物燃烧的炉灶、针对老年人久坐不动的提醒器、老年人感兴趣的社区或网络事件的推荐系统。针对老年人的游戏也可以很有趣，这些游戏可以提供精神刺激以保证其流畅的思维，有助于锻炼记忆、教授新技能等。'
