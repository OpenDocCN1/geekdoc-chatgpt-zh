  md: '满仇恨的聊天机器人从恶意社交媒体帖子中学习时，当招聘偏见被暴露时，商业实践开始转变。


    学者巴蒂亚·弗里德曼（Batya Friedman）和海伦·尼森鲍姆（Helen Nissenbaum）在早期的一项研究中描述了三种偏见：①基于社会实践和态度而预先存在的偏见，例如低收入群体的抵押贷款被拒绝，使意图改善生活的居民更难买到更好的房屋；②基于硬件和软件设计限制的技术偏见，例如器官捐赠请求以字母顺序排列在滚动列表上，而不是按需要的严重程度排序；③由于使用环境的改变而产生的突现性偏见，例如，当高文化程度国家开发的教育软件在具有不同文化价值观的低文化程度国家使用时。


    扎根于智利、西班牙和美国的里卡多·贝扎 - 耶茨（Ricardo Baeza-Yates）教授描述了其他形式的偏见，如地理、语言和文化，这些都嵌入在基于网络的算法、数据库和用户界面中。他提醒说，当流行网站变得更加流行时，“偏见会导致偏见”，这使边缘的声音更难被听到。偏见问题与电气和电子工程师协会（IEEE）的“符合道德标准的设计”报告密切相关，该报告旨在为所有人工智能项目建立强大的道德基础。来自南加州大学的团队对偏见进行了全面的审查，并将这一概念扩展到统计、用户交互、融资等20多种其他形式的偏见。他们还进一步描述了减少偏见、测试数据集和推进研究的方法。


    研究员梅雷迪思·林格尔·莫里斯（Meredith Ringel Morris）对人工智能系统如何使残障用户的生活变得更加困难表示担忧，但她写道：“人工智能技术消除了访问障碍，增强了用户的能力，为残障人士提供了巨大的希望。”她建议通过使用包括有身体和认知障碍的用户在内的训练数据集，改进基于语音的虚拟代理和其他
    HCAI 应用程序。然而，由于人工智能系统还可以检测和捕获认知障碍或痴呆症等弱势群体，因此需要研究如何限制此类攻击。'
