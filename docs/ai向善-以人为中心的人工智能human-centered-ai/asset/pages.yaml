- pgno: 128
  md: '# 第 16 章


    # 社交机器人和有源设备


    第四对隐喻让我们想到社交机器人，这一概念流行了很长一段时间，有时也称之为类人机器人、拟人机器人或人形机器人，因为它们都基于人类的外观。与之形成对比的是常用电器，如厨房灶具、洗碗机和咖啡机，以及洗衣机、烘干机、安全系统、婴儿监视器、家庭供暖设备、空调系统等。此外，房主还可以使用户外的有源电器或远程机器人给花园浇水、修剪草坪和清理游泳池。我把更宏大的设计称为有源设备，因为它们有传感器、可编程动作、可移动性和多种效应器（图
    11.1）。有源设备不仅仅是等待用户激活，它们还可以在特定的时间或在需要的时候被触发，例如温度变化、婴儿哭泣或有人闯入家里时。


    # 社交机器人的历史


    人们对类似人类的社交机器人的设想至少可以追溯到古希腊，但最令人震惊的成功之一可能发生在 18 世纪 70 年代。瑞士钟表匠皮埃尔·雅克 - 德罗（Pierre
    Jaquet-Droz）创造出了精巧的可编程机械设备，该设备有人脸、四肢，甚至还穿了衣服。“作家”用羽毛笔在纸上作画，“音乐家”弹钢琴，“制图员”画图，但这些都只是瑞士纳沙泰尔艺术与历史博物馆的展品。与此同时，印刷机、音乐盒、钟表和磨粉机等其他设备也取得了成功。人类创造角色的想法被经典故事所接受，例如
    16 世纪布拉格的拉比'
  merge: -1
  img_proc: true
- pgno: 129
  md: '( Rabbi ) 创造的魔像和玛丽·雪莱（ Mary Shelley ）在 1818 年创作的《弗兰肯斯坦》（ Frankenstein ）。在儿童故事中，由杰佩托（
    Geppetto ）制作的木偶匹诺曹栩栩如生，而《不听话的小火车》（ Tootle the Train ）中拟人化的角色拒绝遵守规则留在轨道上。在德国诗人约翰·沃尔夫冈·冯·歌德（
    Johann Wolfgang von Goethe ）的《魔法师的学徒》（ Sorcerer’s Apprentice ）中，主人公召唤出一个骑扫帚的角色去取水桶，但是当水漫过车间时，魔法师无法停止召唤。更糟糕的是，将其一分为二只能变成两个扫帚。在
    20 世纪，用来讨论动画中类人机器人的隐喻和语言通常可以追溯到卡雷尔·恰佩克（ Karel Capek ）于 1920 年创作的戏剧《罗素姆万能机器人》（
    Rossum’s Universal Robots ）。


    这些例子说明了社交机器人的概念：有些是机械的、生物的，抑或是由黏土或木头等材料制成的，它们通常具有人类的特征，比如腿、躯干、手臂以及一张具有眼睛、鼻子、嘴巴和耳朵的脸。他们可以做出面部表情和身体姿势，同时用类似人类的声音说话、表达情感和展示个性。


    这些迷人的社交机器人超越了纯粹的木偶，具备强大的娱乐价值，因为它们似乎可以自主运作。孩子们和许多成年人都热衷于把机器人作为电影角色，与机器人玩具打交道，并渴望建造自己的机器人。但事实证明，除了用于碰撞测试的假人和医疗人体模型外，设备从娱乐设备转向服务于创新目标非常困难。


    早期机器人手臂就是一个说明类人机器人的概念是如何误导人的设计案例。这些机械臂很像人类的手臂：有五个手指，但手腕只能旋转 180 度。这些机械臂最多可以举起
    20 磅（ 1 磅 ≈ 0.45 千克）的物体，这限制了它们的使用范围。最终，工业自动化的需求催生了柔性制造系统，制造出了强大、灵巧的机器人手臂，而不是类人类的形态。除了手肘和手腕，这些机器人可能有五到六个关节，可以在多个方向上扭转并精确举起数百磅的重物。机器人的手不再有五个手指，而是有两个抓手或吸力装置。正如刘易'
