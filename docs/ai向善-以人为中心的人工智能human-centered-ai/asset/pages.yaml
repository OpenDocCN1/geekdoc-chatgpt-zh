    另一项研究严厉地批评了保罗·艾克曼的经典情绪模型。在这个模型中，内在的情绪状态触发了准确的情绪自动表达，这一点对于所有人来说都是一样的。然而，在最近的研究中，如美国东北大学心理学家丽莎·费尔德曼－巴雷特（Lisa
    Feldman-Barrett）的研究，更倾向于一种“情绪构建”理论，该理论认为，情绪是由感官知觉、文化规范和个人经验产生的，'
  merge: -1
  img_proc: true
- pgno: 34
  md: '因此情绪的表达因人而异。她将人类的情绪反应描述为基于多种因素组成，而不是自动触发且超出人类控制的。因此，面部表情和肢体语言是人们犯罪意图、快乐或恐惧判断的弱指标。人类行为为比开发人员所假设的人脸识别程序简单算法要复杂得多。可测量的人类行为，如打断说话者、靠近或远离某人，以及进行眼神交流，可以提供有价值的反馈，帮助人们改变他们的行为。


    人类的情绪极其复杂，无法通过简单的过程来识别它们。维基百科对情绪的总结是：“目前科学界对情绪的定义还没有达成共识。情绪通常与一个人的心情、气质、个性、性格、创造力和动机交织在一起。”试图用面部识别来确定一个人的性格、犯罪意图、政治倾向的努力，可能与不足信的颅相学一样危险，颅相学认为头部和头骨结构表明了一个人的心理能力、个性或犯罪倾向。


    虽然关于计算机如何检测人类情绪状态并对其做出反应还有大量工作要做，但许多研究人员正质疑其准确性。即便它可能不准确，那么让社交机器人通过面部特征、肢体语言和口语表达情绪的想法也令人担忧。无论是陈腐的还是有意的欺骗性做法，都会破坏设计师寻求建立的信任。机器人的情绪反应可能在娱乐或游戏应用领域中很有用，这可能足以证明这项研究的合理性，但对于大多数应用领域而言，用户希望在最小的干扰下完成任务。有些用户可能会对假装表达情感的机器人感到厌烦或不信任。


    情绪分析是一种更有前途、更可靠的策略，它能够分析社交媒体帖子、产品评论或报纸头条的内容。这种针对汇总数据的分析方法，不会试图识别当前的个人情绪，但可以指出男性与女性、民主党与共和党、不同种族群体、不同社会经济群体在语言表达上的差异点。情绪分析还可以指出某些事物随时间发生的变化，例如，报纸标题变得越来越负面。


    对某些人来说，用计算机模仿人类是一种愉快的追求，但技术设计师'
