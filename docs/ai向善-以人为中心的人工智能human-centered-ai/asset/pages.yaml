    未来生活研究所（ Future of Life Institute ），是一家总部位于美国波士顿的慈善机构，致力于解决美国、英国和欧盟的人工智能、生物技术、核能和气候问题。该机构寻求“促进并支持保护生命的研究和倡议，发展对未来的乐观愿景，包括人类在考虑到新技术和挑战时能够以积极的方式引导自己的道路”。


    人工智能和数字政策中心（ Center for AI and Digital Policy ），是迈克尔·杜卡基斯领导与创新研究所的一部分。其网站称其旨在“确保人工智能和数字政策促进一个更美好、更公正、更正义、更负责任的社会——一个基于基本权利、民主制度和法治且技术促进广泛社会包容的世界”。该中心每年都会对
    25 个国家的表现进行评估，并发布关于人工智能和民主价值观的广泛报告。'
