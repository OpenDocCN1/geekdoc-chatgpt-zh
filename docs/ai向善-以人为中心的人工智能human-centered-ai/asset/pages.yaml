  md: '样性和用户控制。去健身工作室参加课程或接受个人指导很有吸引力，但用户在家里自由选择锻炼时间的便利性对大多数人来说同样也受益颇丰。与苹果智能手表相关的苹果
    HealthKit 项目、谷歌健康与 Fitbit 公司的合作项目，以及许多其他商业、学术和政府研究小组都在进行一系列问题的研究，包括运动、身体健康、情绪、压力和认知能力之间的关系。


    正在出现的一种可能是，人们将能够集成拥有丰富数据的个人健康记录，与医疗保健提供者集成的实验室检测、治疗和医生记录等电子健康记录相比后发现，个人健康记录提供了更详细的信息。对患者和提供者生成的健康数据进行
    HCAI 驱动的分析，系统可以得出在治疗、饮食、锻炼和改变生活方式方面的益处和副作用的有价值见解，并指导个人如何改善其健康。基于机器学习、统计学和交互式可视化的新型数据分析方法的发展，将充分利用对照、随机临床试验策略和长期观察数据的最佳特征。这些想法的早期阶段，主要关注如何收集数据，例如“病人如我”（PatientsLikeMe）项目，以及政府收集数百万人的基因和其他数据的大规模努力，还有“我们所有人”（All
    of Us）项目，它已经产生了有用的结果。


    老年人越来越活跃，催生了包含几十个体育项目的世界大师运动会和老年奥运会。与典型的体育比赛一样，虽然只有小部分的人可以成为选手，但看到老年人参加田径比赛、网球等竞技比赛，以及展示滑雪或花样滑冰等技能，这会激励更多人参加体育运动，并参加当地或地区的比赛。基于计算机视觉和传感器数据的
    HCAI 技术，可能有助于为个别老年人量身定制训练，并监控其表现以防止跌倒或其他伤害。通过使用靴子上的传感器和腿上的跟踪器，由人工智能驱动的滑雪训练系统可以通过耳机提供语音指导。


    虽然监控日常身体活动（如步数或心率）的确很重要，但让老年人自己选择参与哪些活动和监控哪些活动的设计可以建立他们对可穿戴设备的主动权和所有权。当老年人能够设定自己的目标并与他人分享他们的表现'
  merge: -1
  img_proc: true
- pgno: 277
  md: '时，他们往往会更频繁地使用跟踪设备。当设计团队中有老年人参与时，这些设计改进就会自然而然地出现，同时也会针对老年人进行可穿戴设备的测试。


    除了健康和保健之外，老年人还在志愿工作、筹款和担任董事会成员等方面发挥重要作用，或是社区、政治、消费者和文化团体的领导人。他们带来他们的经验和技能，向年轻人传授他们所知道的知识，并帮助开展有意义的项目，从而丰富他们的日常生活。例如，在新冠疫情期间，英国的老兵汤姆·摩尔（Tom
    Moore）上尉用他的助步车绕着花园跑了 100 圈，以庆祝他的 100 岁生日，并为英国国家卫生服务慈善机构筹集了 4 000 多万美元的善款。来自 100
    多万人的捐款使摩尔上尉享誉全球，鼓舞了许多人，因此他被英国女王伊丽莎白二世（Queen Elizabeth II）授予了爵士头衔。为了继续他的工作，支持者们成立了汤姆上尉基金会。对于希望在其所在地区寻找到可以利用他们技能的项目的老年人来说，网络搜索引擎是一个良好的开端，但
    HCAI 推荐系统可以提供更好的控制面板，帮助老年人更方便地探索适合他们的项目和机会。


    老年人和年轻人在政治、环境或社区活动方面的合作是一种日益增长的趋势。他们联手在附近的花园或菜园工作，以建立社区精神，或为有需要的家庭提供食品帮助。对于那些对自然感兴趣的人来说，民间科学项目可能会吸引他们收集鸟类、野生动物、昆虫和植物的数据。这些项目拥有数百万的贡献者，并产生了有影响力的科学论文。即使在
    95 岁高龄，英国自然历史电影制片人大卫·爱登堡（David Attenborough）仍然创作出了引人入胜的节目，吸引了数亿人观看。他的纪录片展现了自然之美，并明确表达了人类应对气候危机的迫切性。英国女王伊丽莎白二世于
    1952 年成为英联邦元首，终年 96 岁，这使她成为历史学家记录中在位时间最长的君主。尽管一些争议和事件令她的追随者感到失望，但她在英国和世界各地仍然'
  merge: -1
  img_proc: true
- pgno: 278
  md: '很受欢迎。


    老年人的创业活动也可能增加，因为他们具备商业技能，并能够辨别出可以满足的需求。例如，80 岁的玛莎·斯图尔特（Martha Stewart）仍然是一位富有创新精神的企业家和杂志出版商，提供与烹饪、时尚、家居建议相关的产品和服务。在老年人中，更温和的商业成功可能来自电子商务或
    Etsy.com 等网站上的手工艺品销售。《福布斯》（Forbes）商业杂志问道：“年长的企业家是最好的企业家吗？”商业项目是老年人技术服务的目标之一，该项目推出了“利用技术改变我们衰老方式”的老年星球（Senior
    Planet）网站。


    像摩尔上尉和斯图尔特这样的杰出故事是鼓舞人心的，但许多老年人面临慢性疾病、痴呆症或知觉、认知和运动障碍等限制。因此，为了建设一个令我们引以为傲的社会，我们需要大量投资于这些疾病和临终关怀。


    综上，老年人的需求范围表明努力建设老年人关怀与 HCAI 可能会带来许多好处。本章介绍了三个示例，说明了如何有效地应用人工控制和计算机自动化来支持老年人实现独立生活、提高自我效能和促进身心健康，但照顾老年人并向他们学习不仅仅依赖于出色的技术设计。这需要家人、朋友、社会和家庭护理人员的共同参与，他们的努力应该得到重视和赞赏。同时，老年人也在寻求有意义的项目，通过分享他们的知识和贡献他们的技能，为他们的生活赋予意义。'
  merge: -1
  img_proc: true
