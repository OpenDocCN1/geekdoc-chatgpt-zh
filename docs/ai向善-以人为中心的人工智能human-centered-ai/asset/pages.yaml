- pgno: 115
  md: '# 第14章


    # 队友和远程机器人


    在设计机器人和先进技术时，存在一个共同的主题，即人与人之间的交流是人机交互的一个良好的模型，并且对具身性机器人产生的情感依恋是一种价值。许多设计师从未考虑其他方案，他们相信人们相互沟通方式、协调活动和组成团队的方式是唯一的设计模式。然而，这种假设带来的反复失误并没有阻止其他人相信这次会有所不同，他们认为现在的技术更先进，他们的方法是新颖的。


    斯坦福大学的克利福德·纳斯（Clifford Nass）及其团队进行的许多心理学研究表明，当计算机被设计得像人类一样时，用户会以适当的社交方式进行回应和参与。纳斯的谬论可以被描述为：由于许多人愿意对机器人做出社交上的回应，因此将机器人设计成具有社交性或类似人类的外观是恰当且可取的。


    然而，纳斯和他的同事们没有考虑到其他非社交或非类人设计是否能够带来更优异的性能。超越人类队友的概念可能会增加设计师充分利用计算机独特功能的可能性，包括复杂的算法、庞大的数据库、超级传感器、信息丰富的显示器和强大的效应器。我很高兴地发现，在后来与研究生维多利亚·格鲁姆（Victoria
    Groom）的合作中，纳斯写道：“简而言之，机器人作为队友失败了。”他们进一步解释说：“把机器人描述为队友意味着机器人能够扮演人类角色，完成任务，并鼓励人类把机器人当作人类队友对待。当期望未能得到满足时，负面反应则无法避免。”'
  merge: -1
  img_proc: true
- pgno: 116
  md: '密歇根大学的莱昂内尔·罗伯特（Lionel Robert）警告称，类人机器人可能会引发三个问题：基于对系统的情感依恋而错误使用机器人；对机器人责任的错误期望；有关合理使用机器人的错误观念趋势。尽管如此，大多数研究人员认为，机器人队友和社交机器人是不可避免的。这一观点在人机交互研究领域非常普遍，他们很少将机器人概念化为工具或基础设施，而主要是将机器人理论化为同伴、交流伙伴或队友。


    心理学家加里·克莱因（Gary Klein）和他的同事们明确提出了使机器像人类队友一样高效工作面临的十个现实挑战。这些挑战包括制造可预测、可控的机器，并能够与人们就目标进行协商的机器。作者们表示，他们的挑战旨在激发研究，同时也是“关于技术可以破坏而非支持协调的警示故事”。完美的队友、伙伴、助手或搭档听起来很吸引人，但设计师能否实现这一形象，还是用户会被误导、欺骗而失望呢？用户是否可以在享受队友这一隐喻所暗示的乐于助人的同时，拥有对远程机器人固有的控制权呢？


    我对此的异议是，人类的队友、伙伴和合作者与计算机有很大的区别。比起这些术语，我更倾向于使用远程机器人来表示人类控制的设备（图11.1）。我相信记住这一点将会有所帮助——“计算机不是人类，人类也不是计算机”。苏塞克斯大学长期致力于研究创造力和人工智能的研究员玛格丽特·博登（Margaret
    Boden）提出了另一个同样强烈的观点：“机器人根本不是人类。”我认为人与计算机之间的区别包括以下几点。


    责任：计算机不具备法律上和道德上的责任，它们无法承担责任或义务。计算机与人类不同。这在所有的法律体系中都是如此，我认为未来也会将如此。博登继续指出了一个简明扼要的原则：“负责任的代理是人类，而不是机器人。”这一原则在军队中尤其适用，因为军队非常重视指挥链和责任体系。


    即使是在拥有高度自动化的先进战斗机上，飞行员仍然认为自己掌控'
