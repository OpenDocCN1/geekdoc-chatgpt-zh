    随着有源设备变得更加复杂，控制面板、用户控制、历史记录保存和性能反馈等问题将随之增加。以色列本古里安大学的肖恩·霍尼格（Shanee Honig）和塔尔奥隆·吉拉德（Tal
    Oron-Gilad）对 52 项机器人故障研究进行了仔细审查，为机器人的进一步成功运行提供了指导。他们讨论了机器人如何通过控制面板、语音信息或远程监控设备上的显示器来指示故障，还解决了机器人如何向用户报告故障以及用户如何采取措施从故障中恢复的问题。下一步的工作将是制定系统故障报告的方法，从而加速系统的改进。在专注于学术研究报告的同时，医疗和工业机器人故障的事件报告也在增加。霍尼格和吉拉德最新的研究分析了亚马逊的在线客户评论，以了解家用机器人的故障发生的频率以及它们如何影响客户的意见。'
