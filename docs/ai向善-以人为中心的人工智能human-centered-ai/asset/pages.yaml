- pgno: 267
  md: '制和预防中心将老龄化描述为“无论年龄、收入或能力水平如何，都能安全、独立、舒适地生活在自己的家中和社区里”。集体住宅、小型社区和公寓楼都有物业工作人员的协助，在老年人需要时可为其提供帮助，并提供了多样化的选择，确保了老年人对独立的渴望。老年人和残障人士希望自己能够独立，因此他们可以为自己的需求做出选择，但这要得到家人、朋友、社会和家庭护理人员的支持。此外，他们还希望获得适当的技术。


    核心问题是：什么是适当的技术？ HCAI 方法首先提出两个基本问题。


    用户是谁？老年人这一术语涵盖了各式各样的用户。


    +   - 充满活力的 60 岁老人、能干的 70 岁老人、精力充沛的 80 岁老人、行动迟缓的 90 岁老人，以及越来越多的 100 岁以上老人。

    +   - 不同的技能水平、身体灵活性、思维敏捷性、语言能力、医疗问题、情绪障碍和残疾程度。

    +   - 健康且独立生活的老年人、同居的老年夫妇或伴侣、辅助生活型住房中的体弱居民、住在养老院或诊所的人。

    +   - 不同的民族、种族、宗教和文化背景，有着不同的经济资源、生活条件和态度。


    人们对老年人的态度往往受到与年龄相关的生理衰退、缺陷和虚弱等概念的影响，但许多作者正在改变其言论，以欣赏老年人健康的衰老、情感的成熟和轻松的心态。一些老年人可能需要照顾，但他们也可以照顾其他人，并向愿意听取建议的年轻人提供他们的见解。


    任务是什么？照顾老年人的任务非常广泛，涵盖了许多需求，因此，以技术为中心的方法可能是一个广泛的解决方案，例如，可满足多种需求且功能齐全的类人机器人。机器人灵活的双手可以拧开药瓶，清理餐具，其灵活性可以让它成为一名优秀的瑜伽教练。此外，机器人还有力气把体弱的老年人拾上一段楼梯，或从轮椅转移到床上。英国约克大学的海'
