  md: '提供了一个模型。基于网络的公共报告系统面向医疗健康专业人员、消费者和制造商征集了关于药物、医疗设备、化妆品、食品等其他产品的报告。系统的用户界面通过
    7 个阶段引导用户来收集所需的数据，以创建可信和有用的数据集。其公共指示板展示了每年报告数量不断增长的数据信息，2018 年、2019 年和 2020 年的报告数量均超过了
    200 万份。


    另外一个美国食品和药物管理局的报告系统——制造商和用户设备体验系统，记录了机器人手术系统使用中的不良事件。根据这些数据，美国食品和药物管理局详细审查了 2000—2013
    年期间的 10 624 份报告，报告了 144 例死亡、1 391 例患者受伤和 8 061 例设备故障。这些令人担忧的结果的报告建议，“改进人机界面和手术模拟器，以培训手术团队处理技术问题并在手术期间实时评估操作。”其结论强调了“手术团队培训、先进的人机界面、改进的事故调查和报告机制以及基于安全的设计技术”的价值。


    对于网络威胁、硬件和软件的网络安全问题，公开报告系统也已被证明是有价值的。MITRE 公司是一家受资助为美国政府工作的公司，自 1999 年以来一直保存着一份常见漏洞和风险的清单，其超过
    15 万个条目。MITRE 与美国国家标准与技术研究院合作维护国家漏洞数据库，帮助软件开发人员了解程序中的漏洞，这样就可以更快地进行修复，在有共同利益的人之间进行协调，并努力防止未来产品和服务中的漏洞。所有这些开放的报告系统都是处理
    HCAI 故障和未遂事件的良好模型。


    在软件工程中，代码开发环境，例如 GitHub，会记录每一行代码的作者和做出更改的文档。GitHub 声称被 300 多万个组织中的 5 600 多万开发者使用。当系统运行时，漏洞报告工具，例如免费的
    Bugzilla 工具，通过跟踪系统记录和测试，来指导项目团队发现频繁和严重的漏洞。及时解决用户的问题可以防止其他用户遇到同样的问题。这些工具通常由软件工程团队成员使用，但工具的另一个用途是邀请用户提交问题报告。'
