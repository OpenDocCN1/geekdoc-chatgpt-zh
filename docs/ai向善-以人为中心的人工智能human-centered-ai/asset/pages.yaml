- pgno: 246
  md: '每年吸引数千名与会者，并在世界各地举行专门的专题会议，如今也包括 HCAI 的相关内容。现在，几乎每个学科的会议都有关于 HCAI 的论文，这些话题的受欢迎程度令人震惊。


    这些会议正在迅速地将道德和以人为中心的设计主题加入其论文征集中。神经信息处理系统会议要求论文作者增加一个关于“工作的更广泛影响，包括可能的社会后果——积极的和消极的”的部分，这一点令人钦佩。即使是实力强的技术论文，如果被标记为缺失道德部分，也会被拒收。然而，组织者、审稿人和作者的群体仍在努力就如何评估基础研究甚至应用研究的更广泛影响达成一致。


    微软人工智能研究员汉娜·瓦拉赫（Hanna Wallach）在神经信息处理系统会议上就更广泛的影响发表了主题演讲，她在演讲中批评了人工智能领域的部分群体，这些人宣扬一种“不谦虚的文化，在这种文化中，过度营销是常态，谈论限制和负面结果是不被鼓励的”。她呼吁人们对一些研究的更广泛影响和危险性有更多的认识。其他演讲者和作者正在转向讨论道德问题、负责任的人工智能和人工智能系统中的人类价值，这使他们更接近于
    HCAI 的目标。


    美国国家标准与技术研究所文本检索会议是 HCAI 会议组织者可效仿的典范，该会议在过去 30 年里显著地改进了信息检索研究，对广泛使用的搜索引擎的健康发展有极大促进作用。文本检索会议的独特之处在于，与会者必须对至少一个技术路线做出贡献才能参加该会议，这使其成为一个有吸引力的研讨会。他们基于开发可重复使用的数据集和指标（如精确度和召回率）来评估搜索系统的质量的传统方法。地面真值数据集由搜索结果以及每个结果的相关性判断组成。精度（0~100%）这一指标指的是，与搜索者查询相关的文档占所有检索到的文档的百分比。例如，70%
    的精度意味着，如果检索 50 个文档，其中 35 个是相关的，15 个是不相关的。召回'
  merge: -1
