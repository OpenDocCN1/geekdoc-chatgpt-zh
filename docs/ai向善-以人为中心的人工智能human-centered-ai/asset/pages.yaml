    最近的一次远足给了我很好的教训，让我明白了可信任和可信赖之间的区别。在登山口，有一张专业的地图，上面详细标注了海拔数据，显示这条步道将直通一个观景点，我对这张地图充满信任，然而，在徒步半小时后，我意外地发现了一条地图上没有显示的小路。在分叉口处，一张手绘地图建议我左转到达风景观景点，由于我对登山口处的专业地图有信任感，于是我一直朝前走，但这张地图并不可信赖。事实证明，分叉口处的手绘地图是可信赖的。这个经历让我意识到外表可能具有欺骗性，因此需要对其可信度进行验证。


    本书的第三部分和第四部分提供了支持其他属性的设计隐喻和治理结构，例如可追溯性、可审计性、可解释性和公正性，但研究人员和开发人员仍在努力评估 HCAI 系统在这些属性上的表现。本章的重点是对可信度的'
