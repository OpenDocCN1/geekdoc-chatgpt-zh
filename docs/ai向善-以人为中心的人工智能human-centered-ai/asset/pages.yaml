    # 图 16.9 iRobot 公司销售的 Roomba 700 系列机器人吸尘器


    洁，但 Roomba 的传感器可以检测房间是否有人，然后决定是否进行清洁。智能手机应用程序显示了 Roomba 的行动记录，但最令我钦佩的功能是，该机器人可以在两到三次清洁后生成所在空间的地图，包括沙发和床等阻碍
