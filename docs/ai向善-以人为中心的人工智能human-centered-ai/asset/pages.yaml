  md: '# 解决问题并作出未来计划的内部审查委员会


    内部审查委员会对安全文化的承诺体现在其每月定期召开的会议上，会议将讨论故障和险情，并鼓励面对严峻挑战时做出不懈努力。事件标准化的统计报告允许管理人员和工作人员了解哪些度量标准是重要的并建议新的度量标准。企业内部和偶尔公开的总结强调了安全文化的重要性。


    审查委员会可能包括管理人员、工作人员和其他人，他们就如何促进持续改进提出了不同的观点。在某些行业，例如航空，准点率或行李丢失率的月底报告推动了良性竞争，这有利于公共利益。同样，医院会报告患者在各种情况或手术下的治疗结果，公众能够根据报告初步地选择医院。美国卫生与公众服务部医疗保健研究和质量局定期对医院、疗养院和社区药房的患者安全文化进行调查。这些调查提高了工作人员对患者安全的认识，并形成了一种长期、跨区域的趋势。


    在许多医院中出现了一种面对事故时令人震惊的处理方法，即披露、道歉和提供方案等方式。医疗专业人员通常会为患者提供极好的护理，但当出现问题时，他们往往会尽力为患者提供最好的服务。然而，对医疗事故诉讼的恐惧限制了医生向患者及其家属或医院管理人员报告问题的意愿。披露、道歉和提供方案等新兴方式转变为向患者及其家属的全面披露、明确道歉，并提供治疗以补救问题和
    / 或经济补偿。虽然一些医生和管理人员担心这会增加医疗事故诉讼，但结果却截然不同。患者及其家属都很欣赏这种诚实的披露，尤其是明确的道歉。因此，诉讼往往减少了一半，而由于医生对这些方案的认可，医疗事故的数量也大幅减少。职业自豪感和组织荣誉感也有所增加。


    内部审查和审计团队也可以改进 HCAI 实践，从而限制故障和未遂事件。谷歌公司内部算法审计的五阶段框架旨在“缩小人工智能问责的差'
