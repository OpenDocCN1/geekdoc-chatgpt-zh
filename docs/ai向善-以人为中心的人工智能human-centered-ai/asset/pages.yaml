- pgno: 262
  md: '在开发过程中，形式化方法的支持者认为，这些方法可以提高复杂 HCAI 系统的可信度。同样，静态分析和测试方法的支持者也认为这些方法是有帮助的，但是只有当系统的性能在数月或数年的反复使用中被证明是安全且有效时，对系统可信度的评估才可能是可信的。虽然早期的错误是可以容忍的，但这些问题应该随着时间的推移逐渐减少，这样利益相关者就会认识到系统已经成熟且值得信赖。


    威尔·格里芬（Will Griffin）是一位毕业于哈佛大学的律师，同时也是 HyperGiant 公司的首席道德官。在一次电话访谈中，他建议应采取可行的措施衡量可信度，其中之一是构建
    HCAI 系统的透明度。格里芬指出，提高道德规范将为公司带来竞争优势。他认为这与核不扩散审查有相似之处，即信任取决于国家核工作的透明程度。一个值得信任的国家是允许对其核设施进行检查的。对这一想法的支持来源于制定
    IEEEP7001 标准的委员会。


    IEEEP7001 标准背后的一般原则是“始终应能够理解自主系统为何以及如何做出特定的决定”。这一原则被细化为五个利益相关者受众：用户、普通公众、认证机构、事件调查人员和律师。对于每个受众，都有
    1 到 5 级的透明度评级表，详细描述每个等级的含义，并提供了实例。这是一个有用的初步尝试，可以发展成为一个实用的评估工具。


    最后一个鼓舞人心的例子是迈克尔·杜卡基斯人工智能和数字政策中心的人工智能社会契约指数。该指数对 25 个国家的国家政策支持民主价值观的程度进行评级。这个指数包括
    12 个属性，每个属性都以 0 到 1 评级，以记录政府是否认可并执行了基础性文件，如经济合作与发展组织的人工智能原则和联合国的《世界人权宣言》。然后，该指数对算法透明度、问责制、公众参与制定政策和描述政策的公共文件进行评分。在这份长达
    382 页的报告中，德国以 10.5 分（满分为 12 分）位居榜首；第二梯队有 9 个国家，其得分在 8.5 分至 9.5 分之间。'
