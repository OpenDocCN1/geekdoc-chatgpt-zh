- pgno: 30
  md: '们的反馈，并通过实证研究来验证假设。设计师通过用户体验测试来指导设计的反复修改，并在系统的使用过程中持续监控以获得用户实时反馈。HCAI 思维提出了事件报告和意见箱模式，如美国食品和药物管理局的不良事件报告系统和美国联邦航空管理局的航空安全报告系统。


    人工智能项目通常专注于取代人类，而 HCAI 设计师更喜欢开发内置信息而不是事后添加的、丰富的可视化信息。如今，绝大多数的应用程序都给了用户更多的控制权——比如显示高速公路导航航线、显示运动历史、显示金融投资组合。这些丰富的显示信息让用户清楚地了解正在发生的事情以及他们可以做什么。现在，视觉显示经常与基于语音识别的音频界面相辅相成，为不同的用户完成任务开辟了新的可能性。


    那些与理性主义者一样相信计算机正在取代人类的人认为，未来的计算机将和人类一样聪明，并与人类分享情感。简而言之，他们认为，人类与计算机之间没有区别，所以我将在下一章对此进行解释，为什么我认为人类与计算机属于不同的类别。'
