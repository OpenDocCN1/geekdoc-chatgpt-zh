- pgno: 212
  md: '# 保险公司对事故进行赔偿


    正如建筑、制造和医疗领域一样，保险行业是可信赖性的潜在保证人。保险公司可以规定制造、医疗、运输、工业等其他领域的 HCAI 系统的可保性要求。长期以来，保险公司一直要求相关企业遵守结构强度、消防安全、防洪等其他功能的建筑规范，并在确保建筑安全方面发挥着关键作用。建筑规范可以成为软件工程师的一个模型，正如计算机科学家卡尔·兰德维尔（Carl
    Landwehr）的建议所描述的那样：“建筑领域中的建筑规范。”他将历史类推法扩展到管道系统、消防或电气标准，并应用到航空电子设备、医疗设备和网络安全的软件工程中，因而扩展到
    HCAI 系统似乎是自然而然的。


    建筑商必须满足建筑规范才能获得批准，从而才能获得责任保险。软件工程师可以对详细的软件设计、测试和认证标准做出贡献，保险公司可应用这些标准进行风险评估和制定保险定价。业绩的审计追踪以及故障和未遂事件的月度或季度报告中的要求将为保险公司提供所需的数据。精算师将能够熟练地为不同的应用和行业制定风险概况，并在发生损害时提供赔偿准则。


    保险公司的下一步自然而然将是从各自服务行业的多家公司收集数据，这将加快其风险度量和承保评估方法的开发，也将完善每个行业的规范，从而引导开发商公开预期做法的记录。规范的制定也可以指导公司如何改进其
    HCAI 产品和服务。


    在医疗保健、旅游、汽车或房屋所有权等行业中，消费者所购买的保险可以提供无过错保护，该保险覆盖任何原因的损害赔偿。但在某些情况下，企业也会购买保险来支付医疗事故诉讼、交通事故以及火灾、洪水或风暴造成的建筑损坏的费用。对于
    HCAI 系统来说，由企业购买保险似乎是'
  merge: -1
  img_proc: true
- pgno: 213
  md: '合理的做法，从而为可能受到损害的消费者提供保护，这将推高产品和服务的成本，但与其他行业一样，消费者愿意支付这些成本。企业将不得不对 HCAI 系统进行风险评估，但随着应用程序数量的增加，将会出现足够多的故障和未遂事件的数据来指导改进。


    包括旅行者保险公司（Travelers Insurance）在内的汽车保险公司于 2018 年 7 月发表了一篇关于自动驾驶汽车“确保自动驾驶”的论文。这些保险公司寻求这样一种框架：“刺激创新，增加公共安全，提供安心和保护……司机和消费者。”该报告赞同这样一种观点，即自动驾驶汽车将显著提高安全性，但由于设备成本更高，损害索赔将随之增加。这两种观点都会影响风险评估、保费的设定及利润，因为他们预测，汽车的数量会因为更多的共享使用而降低。这份早期的报告仍然具有指导性，因为公众仍然需要数据来证明或反驳自动驾驶汽车更安全的观点。制造商不愿报告他们所知道的情况，而美国各州和联邦政府尚未推动对自动驾驶汽车的公开报告和监管。当自动驾驶汽车从示范运营项目转向更广泛的消费者使用项目时，保险公司肯定会采取行动，但早期的干预措施可能会更有影响力。


    怀疑者担心，比起保护公共安全，保险公司更关心的是利益。此外，他们还担心消费者在被自动驾驶汽车伤害时或被提供错误的医疗建议时难以提出索赔，或在工作招聘、抵押贷款批准或假释评估期间受到不公正的待遇。然而，正如保险的历史记录所显示的那样，购买保险将使大多数人在受到损失时受益。因此，一个具有价值的目标是，根据
    HCAI 系统所造成的损害来制定具有实际意义的保险目标。


    可考虑的其他方法是建立无过失保险计划或受害者赔偿基金，即由行业或政府为独立的审查委员会提供资金，该委员会及时向受害者支付赔偿，而无须复杂的司法程序和成本。例如，为
    2001 年纽约恐怖袭击设立的“9·11 受害者赔偿基金”，以及为深水地平线（Deepwater Horizon）漏油事'
