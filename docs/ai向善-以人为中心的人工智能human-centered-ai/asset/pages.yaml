- pgno: 26
  md: '定义明确的任务上与人类智力相当甚至超越人类智力的承诺。强烈主张数据驱动的统计方法与主张深入了解变量之间因果关系的领域专家形成了鲜明的对比。人工智能拥护者甚至表示，他们不再需要因果关系理论，机器学习将取代专业知识。还有一些人，比如图灵奖得主朱迪亚·珀尔（Judea
    Pearl），认为人工智能发展的下一步将是处理因果关系。


    令人不安的是，预测不再需要因果解释，这表明统计相关性足以指导决策。没错，机器学习表明统计相关性可被当作一种“训练”算法的数据模式，但它仍需扩展，以处理出乎意料的极端情况，比如特斯拉（Tesla）自动驾驶汽车未能在白色天空背景中识别出白色卡车，因此发生碰撞并导致司机死亡。此外，机器学习还需要补充识别隐藏的偏差和预期模式的失效。改进机器学习技术能够使其在面临新情况的时候不那么脆弱，而人类是可以通过人类的常识和高级认知来应对这种情况的。人类的好奇心和对世界的渴望意味着人类致力于因果解释，即使事件有一系列复杂的远因和近因。


    理性主义和经验主义这两种哲学都提供了有价值的见解，所以我运用理性思维的优势，并与经验主义的观点相结合，同时使用观察策略，帮助我发现其他的可能性。关注技术的用户总是能给我带来新的见解，所以我被可用性研究、访谈、自然观察所吸引。我反复进行长达数周的案例研究，让用户继续他们的工作，以弥补在实验室环境中用理性主义方法进行控制实验的局限。


    我认为，以用户的同理心为出发点，以谦逊的态度推进机器和人类极限的设计理念，将有助于建立更可靠、更安全、更值得信赖的系统。同理心使设计师能敏感地察觉到用户可能产生的困惑和失望，以及人工智能系统发生故障时所造成的危害，尤其是在重大且生命攸关的应用领域中。谦逊使设计人员认识到审计跟踪的必要性，当不可避免的故障发生时，审计'
  merge: -1
  img_proc: true
- pgno: 27
  md: '跟踪可以进行回溯分析。理性主义者倾向于期望实现最优的性能；经验主义者总是在寻找可能出错的地方和可以改进的地方。两者都凭借用户反馈信息茁壮发展。


    # 设计启示


    未来的技术设计与理性主义或经验主义的主张密切相关。出于对理性主义的青睐，一些研究人员倾向于认可计算机在没有人类监督的情况下就能可靠运行的观点。虽然批评者指出了关于不完善的自动设备的讽刺、悖论、难题、致命神话和危险，但该方法仍然受到许多人的青睐。当重视致命性自主武器系统的军事项目开发者与担心误用危险的人对此进行争辩时，关于自主性的讨论就变得尤为激烈。


    自动驾驶汽车或无人驾驶汽车是技术蓬勃发展的方向，如果设计师采取经验主义的观点，实现有意义的人类控制，即使在自动化水平提高的情况下，自动驾驶也可以达到足够的安全水平。从无人驾驶汽车转变为以安全为先的汽车，可能会更快地改进已被证实的方法，如避免碰撞、车道跟随和停车辅助。先进驾驶辅助系统等术语的转变表明，人们意识到，与推进自动驾驶汽车相比，提高人类驾驶员的驾驶技术是一个更具建设性的目标。人们将在车对车通信、公路建设的完善、以空中交通管制中心战略为基础的先进高速公路管理控制中心等方面进行进一步的改进。


    诸多人工智能从业者仍然构想社交机器人将在未来成为我们的队友、伙伴和合作者。但制造假装有情感的机器似乎适得其反，人工智能设计师也因此致力于不正确的目标。计算机没有情感，但人类有。现如今，类人社交机器人仍属新奇事物，其主要集中在娱乐领域。


    人工智能群体对理性主义的青睐导致开发人员一直倾向于自主设计，'
