- pgno: 223
  md: '的支持，以促进经济发展和金融稳定，随后又得到了 50 多个国家的支持，使其成为被最广泛共享的原则。2019 年 5 月通过的经济合作与发展组织的 HCAI
    原则以包容性增长、可持续发展、福祉、透明度、可解释性和问责性等人们熟悉的价值观为起点。除此之外，经济合作与发展组织的这些原则鼓励政策制定者投资于研究与开发、培养人类能力、应对劳动力市场转型和促进国际合作。


    经济合作与发展组织原则的制定者认识到，需要采取后续行动来传播信息、跟踪执行情况、监测结果。2020 年，他们建立了一个政策观察站，其中包含 60 个国家和地区的情况，以跟踪其政策举措、预算和学术研究。然后，通过加拿大和法国的伙伴关系，经济合作与发展组织提出了人工智能全球伙伴关系倡议，以鼓励政策制定者遵循这些原则。


    国际倡议，尤其是通过联合国发起的倡议，也可以增加 HCAI 国家级政策相关工作的成效。通过监控 1970 年的《核不扩散条约》（Nuclear Non-proliferation
    Treaty），联合国被普遍视为管理原子能的积极推动力。联合国国际原子能机构向签署该条约国家和地区中的大多数国家和地区派出检查员，核实他们是否使用核设施反应堆生产核武器。批评者指出，即便在大规模削减之后，世界上仍然有
    20 000 多件核武器，尽管自 1945 年以来没有一件被用于战争。另一个令人担忧的问题是，少数有核活动的国家尚未签署该条约，因此仍然存在使用核武器的严重威胁。


    联合国作为 HCAI 潜在监管者的角色源自其在卫生、通信、食品、农业等其他技术方面所做出的国际努力。联合国的国际电信联盟在其年度 AI for Good 全球峰会上积极地讨论人工智能的话题。该活动的重点是支持联合国的
    17 项可持续发展目标（图 1.1），但国际电信联盟迄今为止所做出的努力只是将研究人员、企业领导人和政府决策者聚集在一起讨论其工作成果。在致命性自主武器系统等问题上，联合国也没有进行执法或监管方面的工'
