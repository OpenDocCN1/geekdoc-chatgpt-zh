  md: '清洁、维护和园艺等家庭服务领域更具有发展前景，这些家庭服务使人们的生活更轻松，并扩大了人们可以做的事情的范围。第 26 章列出了老年人的需求，如娱乐、医疗设备和安全系统，这些都是许多家庭中有源设备的候选产品。


    # 语音和文本用户界面


    有源设备这一理念的显著成功是基于语音的虚拟助手，如亚马逊的 Alexa、苹果公司的 Siri、谷歌的 Home 和微软的 Cortana。设计师已经开发了语音识别和问题回答系统，其生产高质量语音的功能获得了消费者的认可。当遇到无法回答的问题时，虚拟助手会提供给用户一个网页链接，以帮助他们了解更多相关问题。这些设备采取了表面有纹理的圆柱体外观，而非人类形态，因而适合许多家庭的装修风格。这意味着它们不符合社交机器人的严格定义，但其成功值得关注，并为其他语音操作的家庭设备提供了机会。


    一项针对 82 台亚马逊 Alexa 和 88 台谷歌家庭设备的研究显示，超过四分之一的用户使用这些设备是为了查找和播放音乐。此外，用户频繁使用的功能是搜索信息、控制家庭设备，如灯光和暖气；较少使用的是设置计时器和闹钟、请求讲笑话，以及获取当前天气状况或天气预测功能。


    大多数用户将语音用户界面视为完成任务的一种方式；他们不是朋友、队友、伙伴或合作者——他们是超级工具。的确，用户很可能请求拥抱、提出不可能完成的请求，以及提出诸如“你还活着吗”之类的探询性问题来探索各种可能性，Siri
    对此回答说：“我不是人，也不是机器人。我是软件，是来帮忙的。”


    语音听写是一个成功案例，它可以辅助那些因受伤、失去运动控制能'
  merge: -1
  img_proc: true
- pgno: 144
  md: '力或因视力障碍而打字困难的用户进行文本输入和编辑。语音听写也适用于那些双手忙碌的用户，如医生，他们可以在检查患者、查看 X 光片或实验室报告等其他文件时用语音记录患者情况。与非正式对话相比，医疗保健的专业术语需要具备更高的语音识别准确率。


    基于电话的语音用户界面也是一个成功案例，即便是在嘈杂的环境中，语音识别质量也很高。独立的扬声器设计避免了对系统的训练需求，一般来说是有效的，尽管存在口音和语言障碍等问题。


    语音阅读器是一个不断发展的应用程序，并在阅读电子图书和杂志方面越来越成功，阅读器可以使用合成语音，但人类的声音更受欢迎，因为人类的声音传达了适当的情感、准确的发音和吸引人的韵律。这些语音阅读器可以帮助有视觉障碍的用户，同时，在长途汽车旅行或散步时它也很受普通人群的欢迎。对网页浏览器或其他应用程序的语音控制有助于视觉障碍和因伤暂时残疾的用户。


    凯茜·珀尔（Cathy Pearl）的《语音用户界面设计》（Designing Voice User Interfaces）一书提醒读者：“不应该让人们以为它是人类；它应该以一种高效易用的方式解决用户的问题。”语音输入比打字更快，用户双手忙碌时也能使用它同时工作，并且可以远距离操作。当然，语音用户界面也存在局限性：它们可能会干扰人类对话，虽然这只是短暂的，并且比移动设备或更大屏幕上的可视用户界面提供的信息更少。视觉和语音用户界面之间存在着巨大的差异，两者在不同的情况下都有价值。


    另一个需要注意的问题是，说话需要认知能力，这会剥夺用户的一些短期记忆和工作记忆，因此在执行同时进行的任务过程中会变得更加困难。这就是为什么语音用户界面没有在高工作量的情况下使用，比如战斗机飞行员，如果他们能用手控制飞机，就可以更有效地规划攻击场景。


    尽管基于语音的虚拟助手取得了成功，但会说话的娃娃未能吸引消费'
