- pgno: 208
  md: '责任和透明度、合乎道德的设计以及专业责任等问题。虽然人工智能促进协会、美国计算机协会、电气和电子工程师协会等专业组织为其成员制定了道德行为准则，但对不道德行为的处罚却很少。


    当损害发生时，责任的分配是一个复杂的法律问题。然而，许多法律学者认为，尽管先例将有助于澄清问题，但现有的法律已经足以处理 HCAI 系统的相关问题。例如，在现有法律下，脸谱网被起诉存在歧视，因为其人工智能算法允许房地产经纪人按性别、年龄和邮政编码定位住房广告。脸谱网处理了这起案件，并做出了改进，以防止在住房、信贷和就业方面的广告歧视。


    企业、政府机构、大学、非政府组织和公民社会正在通过广泛使用独立监督的方式，以讨论、审查、监控正在进行的过程以及分析故障原因。独立监督旨在审查重大的项目计划，调查严重的故障，并促进持续改进，从而确保可靠、安全和可信赖的产品和服务。


    在独立监督委员会任职的个人应是受人尊敬的领导者，具备专业知识并对所审查的组织有足够的了解。这些领导者应知识渊博，但不应涉足这些组织，因而具有独立性。此外，委员会必须对其可能存在的利益冲突进行披露与评估，例如与被审查的组织的历史关系。因此，一个强有力的监督委员会需要由代表不同学科、年龄、性别、种族等其他因素的多样化成员组成。


    该委员会调查能力应包括检查私人数据、强制面谈，甚至传唤证人作证的权利。如果公开独立监督报告，效果会更好。如果需要在特定的时间内（通常以周或月为单位）做出响应和改进，建议这些相应和改进是具有影响力的。


    三种常见的独立监督方法如下（图 21.1）。'
