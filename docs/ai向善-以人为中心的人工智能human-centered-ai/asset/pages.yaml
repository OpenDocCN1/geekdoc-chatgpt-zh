- pgno: 31
  md: '# 第 3 章


    # 人类和计算机属于同一种类吗？


    传统的人工智能倡导者与 HCAI 支持者之间的第二个分歧点是，人类与计算机属于同一种类，还是说两者截然不同。斯坦福大学发布的 AI-100 报告称，“算术计算器和人脑之间的区别不在于种类，而在于规模、速度、自主程度和通用性”，这一信息表明人类和计算机属于同一种类。相反，许多
    HCAI 的支持者认为，两者之间存在巨大差异：“人类不是计算机，计算机也不是人类。”


    这并不是说人类有灵魂，有精神，或者是一种神秘的生命火花；人类经过漫长的精神文化进化而形成的卓越能力值得被赞赏。如今所见的人类的生活只能在人们历经几代人精益求精的卓越工具（如语言、音乐、艺术和数学）和技术（如服装、住房、飞机和计算机）的背景下才能看到。人类在农业、医疗保健、城市和法律体系等领域的创造力也十分显著。我认为，我们的历史作用是为这些技术、思维工具和文化体系增添新的内容。制造一个模仿人类行为的机器人是有价值的，但我更感兴趣的是能将人类能力大大增强百倍甚至千倍的超级工具。过去的成就已经造就了一些惊人的技术进步，如计算机、万维网、电子邮件和移动设备。


    也许我应该更开放地讨论最终可能发生的事情。也许我应该让富有想象力的科幻故事打开我的思维，让我看到有知觉的计算机、有意识的机器和具有超级智能的人工智能生物的新可能。我的动力来自这样一种假设，即人类具有独特的创造力，我是为了制造设计精良的超级工具而努力，以提高人类的表现。


    人类与计算机之间的界限变得模糊后，人们会削弱对人类丰富性、多'
  merge: -1
