  md: '作。取缔致命性自主武器系统的工作进展缓慢，这受制于反对国家对防御性和进攻性武器态度的分歧，并加大了制定可执行政策的困难。相关机构必须采取类似于国际原子能机构所采取的更有力的措施，使联合国在
    HCAI 方面发挥作用。


    这里可能只以个别国家作为执法或监管方面的示例。在美国，政府机构已经在改进自动化系统方面发挥了关键作用，因此他们可以开始解决 HCAI 系统问题。长期以来，美国国家运输安全委员会一直是值得信赖的航空、船舶、火车等其他灾难的调查机构，一部分原因是美国国会资助其作为一个独立机构，且它独立于通常的行政分支部门之外。该委员会派遣了技术精湛的团队抵达事故现场收集数据，这些数据是深度报告和改进建议的依据。


    例如，美国国家运输安全委员会就 2016 年 5 月特斯拉的致命事故报告批评了制造商和运营商“过度依赖自动化，缺乏对系统局限性的理解”。该报告建议，未来的设计应包括“一组标准化的可检索数据……以独立评估自动驾驶车辆的安全性，并促进自动化系统的改进”的审计跟踪。此外，该报告提醒说：“这次事故是一个例子，说明在没有充分考虑人为因素的情况下，将‘因为我们可以’这一观念引入自动化时可能发生的情况。”


    致命的汽车事故引起政府监管部门的关注是合情合理的，因为此类事故的发生次数过多，而飞机失事受到调查是因为死亡人数过多。政府干预和法规也可适用于医疗设备生产、制药制造、医疗保健或老年人护理设施等生命攸关的领域。


    相关企业对政府监管的抵制是可以理解的，但对于重要和生命攸关的应用领域而言，某种形式的独立监管似乎可能会减少危害并加速产品和服务的持续改进。此外，对金融和授信等重要应用系统的监督非常重要，因为受影响的群众基数大。对于轻量级的推荐系统和消费者应用程序，政府'
