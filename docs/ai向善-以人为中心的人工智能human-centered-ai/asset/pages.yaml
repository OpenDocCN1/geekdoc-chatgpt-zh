    一项针对人工智能领域的从业者的非正式调查显示，他们中约有一半人接受将家电称为机器人的想法，但另一半人认为，它们缺乏移动性和类似人类的外形，因此不适合被称为机器人。


    我感到荣幸的是，我们家的厨房里有七台有源设备，它们都由传感器来探测并据此调整行动。其中大多数设备都处于待激活状态，但可以通过编程设定启动时间或根据传感器自动激活。这些设备越来越多地使用了人工智能方法，从而节省能源、识别用户、提高家庭安全性或通过语音用户界面进行交流。


    但令我失望的是，这些设备的设计仍存在很大的改进空间，因为其内部设计往往不一致，且在不同设备之间又存在很大差异，用户难以学习。每个设备都有一个时钟，有些也有日期显示，尽管某些设备来自同一个制造商，但其设置时间和日期的用户界面都不尽相同。因为不同的设计，特别是因为某项任务可以自动化，夏令时制引起的更改是一个本不必要的问题。烤箱、微波炉、咖啡机、电饭煲等其他设备的设定计时器，以及剩余'
