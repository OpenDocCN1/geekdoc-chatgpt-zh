- pgno: 79
  md: '# 表 9.1 八条设计黄金法则


    | 1. 力求一致性 |

    | 2. 寻求通用性 |

    | 3. 提供信息反馈 |

    | 4. 设计对话框，告知用户任务已完成 |

    | 5. 预防错误 |

    | 6. 允许轻松地撤销操作 |

    | 7. 给予用户掌控感 |

    | 8. 减轻用户短期记忆负担 |


    用户体验设计师尤菲米娅 · 王（Euphemia Wong）鼓励设计师遵循上述法则，以便设计出优秀、高效、简洁的用户界面。油管（Youtube）上的视频用多种语言介绍了这些法则，恶搞的视频也对它们进行了调侃，这对我来说并没什么。


    基于八条黄金法则的用户界面设计决策通常需要权衡取舍，因此，仔细的研究、创造性的设计和严格的测试有助于设计师制作出高质量的用户界面。该领域专家必须持续地监控已实施的设计，以了解问题并进行改进。改进的空间一直存在，满足新的需求需要不断重新设计用户界面。


    以下示例阐明了支持用户通过可视化界面传达其意图的关键思想。此外，在许多情况下，听觉和触觉交互有益于残障用户（第 2 条黄金法则）。这些设计为用户提供了机器状态的反馈信息，包括进度状态和完成报告。虽然当前大部分设计都有缺陷，但这些正面案例描述了如何同时支持高度人工控制和高度自动化。本书第三部分将通过描述超级工具、远程机器人、有源设备和控制中心来扩展这些示例。如下是一些示例。


    示例 9.1：简易的恒温器可以让用户更好地控制家里的温度。用户可以'
