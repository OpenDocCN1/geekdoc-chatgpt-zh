  md: '来自公益团体、专业协会和政府的 500 多份报告激发了人们对 HCAI 的兴趣，这些报告鼓励相关人员采取负责任的、合乎道德的方法。2003 年伊拉克战争中过度自主的爱国者导弹系统的致命故障以及涉及自动驾驶汽车的致命事故，凸显了人类对计算机的控制需求。虽然在
