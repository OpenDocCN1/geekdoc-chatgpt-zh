  md: '# 第 22 章


    # 政府干预及法规


    世界各地的政府领导人都已认识到，人工智能是经济增长、国家安全和社区安全的关键技术。虽然从原则上来讲，政府干预和管制对人工智能的发展是有所抵制的，但越来越多的人认识到政府干预和管制对人工智能的发展可能是有益的，而且是必要的（图
    18.2）。虽说美国被视为人工智能研发的领导者，但英国、欧盟各国、加拿大、俄罗斯、中国、印度、韩国等其他国家也做出了很多努力和贡献。上述国家和其他国家的国家级政策概述了各自的计划，但最令人印象深刻的是，中国为下一代人工智能发展计划制定了雄心勃勃的目标，即到
    2030 年成为人工智能基础研究、产品开发和商业应用的顶级中心。


    中国庞大且受过良好教育的人口为国家提供了优势，使其在人工智能领域成为领导者的计划实现成为可能。中国政府集中化的国家经济政策和超过 1 000 亿美元的承诺意味着他们的计划可以产生广泛的影响。他们的计划几乎没有提及
    HCAI 或负责任的人工智能，但中国科技部的一份后续文件确实提到了一些人们所熟知的 HCAI 原则，如公正、正义和尊重隐私，同时也促进了开放协作和敏捷管理。阿里巴巴、微信、腾讯、百度等中国大型互联网公司在电子商务、银行、社交媒体和通信领域取得了巨大成功，部分原因在于其在人工智能方面的实力。


    中国的文化差异使他们在人工智能广泛应用领域有一些优势。中国人重视隐私，也重视群体利益。这意味着政府会收集个人信息，如医疗数据。'
