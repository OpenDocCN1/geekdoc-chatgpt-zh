- pgno: 82
  md: '楼层开启。电梯的三重冗余安全系统，即使在断电或缆绳断裂的情况下，也可防止电梯坠落。机器学习算法可以协调多部电梯，基于时间、使用模式、持续变化的乘客负载，自动调整电梯的位置。超载装置允许消防员或搬家公司人员使用。电梯的仔细设计在各个方面支持用户对高度自动化支持功能的高度控制，比如电梯门探测器，用以防止电梯门关闭时夹住乘客（第
    5 条黄金法则），这使电梯的整体设计是可靠的、安全的、可信赖的。


    示例 9.4: 在大多数手机的相机功能中，如果用户点击下方的大按钮，就会显示拍摄的图像（图 9.3）。当用户调整构图或放大时，图像会平滑地更新，同时摄像头会自动调整光圈和对焦，进行补偿防抖、大范围的曝光（高动态范围）等其他操作。闪光灯可以设置为打开、关闭或自动模式。用户可以选择人像模式、全景模式、视频模式或者慢动作和延时摄影。用户还可以设置各种滤镜，并根据所拍摄的图像进行进一步的调整，如亮度、对比度、饱和度、自然饱和度、阴影、裁剪和红眼消除。这些设计为用户提供高度控制的同时，也提供了高度自动化。当然，相机也有一些错误，比如自动对焦功能有时对焦到了附近的灌木丛，而不是站在灌木丛后面的人，但用户可以触摸所需聚焦的位置来纠正这个错误。


    示例 9.5: 关键词自动补全是推荐系统的一种形式，它展示了补全搜索词的通用方法，如谷歌搜索系统。当用户输入一个单词时，系统根据其他用户的搜索情况，给出一些普遍的建议。这种自动补全的方法，不仅可以提高搜索速度，还可以关联其他搜索主题，用户也许会觉得有用，他们可以选择其中一个，也可以忽略。


    示例 9.6: 拼写、语法检查器和自然语言翻译系统以巧妙的方式提供了有用的建议，比如在拼写错误下方会显示红色波浪线，如图 9.4 所示；或可能的翻译列表。这些都是优秀的交互设计示例，它们既能帮助用户，又能让用户保持控制权。与此同时，自动更正文本消息系统也会经常出错，发送者和接收者'
