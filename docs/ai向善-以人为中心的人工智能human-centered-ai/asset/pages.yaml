  md: '| 等级 | 描述 |

    | :--- | :--- |

    | 3 | 有条件的自动化：在一定的交通环境条件下，人类驾驶员将“安全关键功能”转移给车辆 |

    | 2 | 部分自动化：至少有一个驾驶辅助系统是自动的。人类驾驶员脱离实际操作车辆（手离开方向盘，脚离开踏板） |

    | 1 | 驾驶员辅助：大多数功能仍然由驾驶员控制，但特定功能（如转向或加速）可以由汽车自动完成 |

    | 0（低） | 无自动化：人类驾驶员控制一切：转向、刹车、油门、动力 |


    自主性的批评者反复论述关于自主性的讽刺、致命神话、难题或悖论。


    来自人类和机器认知研究所的杰夫·布拉德肖（Jeff Bradshaw）、罗伯特·R. 霍夫曼、大卫·D. 伍兹（David D. Woods）和马特·约翰逊所组成的强大团队撰写了一篇措辞尖锐的文章《自主系统的七个致命神话》（The
    Seven Deadly Myths of Autonomous Systems）。他们指出了诸如“一旦实现完全自主，就不再需要人机协作”之类的神话，他们嘲笑这是对团队如何以相互依赖的方式进行协作的明显误解。该文告诫设计师们：“屈服于自主性的神话，不仅仅会对自身造成损害，其持续传播也在继续造成损害……因为它们产生了许多其他严重的误解和后果。”他们的文章以及许多其他文章都强调，人类必须监控自主系统，所以需要进行设计工作，让人类知道自主系统在做什么以及它下一步会做什么。


    美国国防科学委员会的报告是这样描述 10 级自主水平的：“尽管有吸引力，但将自主水平概念化为发展路线是没有成效的。”美国国防科学委员会后来的一份报告描述了自主性的许多机遇和风险。霍夫曼及其同事等认知科学研究人员指出了自主武器的缺陷和代价，这已经产生了意想不到的致命后果，爱国者导弹系统就是一个显然的案例，该系统在
    2003 年伊拉克战争期间无意中击落了英军和美军的飞机。'
