    # 图 25.1 葡萄酒品鉴评分的五种品质


    更微妙的评级或评分标准来自葡萄酒研究中心，例如位于纳帕谷附近的加州大学戴维斯分校，他们采用了更为严格的评分标准，包括有十个组成部分，其中每个部分的评分都有
    1 分、2 分或 4 分，但都是基于人类的主观判断。这些组成部分包括透明度、颜色、香气、酸度、风味、甜度和酒体，针对每个成分都有一个相应的评级指南，例如对于葡萄酒品种的风味，可以评为复杂（2.0）、简单（1.5）、宜人（1.0）或明显特征（0.5）。


    其他复杂的评分或评级系统采用评委组的方式。例如，奥运会的花样滑冰、跳水、拳击和体操项目的积分规则。评委组以数值形式对选手的表现进行评分，综合得分决定金牌、银牌和铜牌得主。这种主观判断与径赛或滑雪等项目截然不同，后者是对速度的客观评估，然后再转化为数值分数。


    最后一个按组成部分评分的示例是，被广泛应用于新生儿健康评估的阿普加（APGAR）量表，该量表于 1952 年由弗吉尼亚·阿普加（Virginia Apgar）教授创建。该量表包括五个组成部分，而每个组成部分都可被评为
    0、1 或 2，五项总分范围为 0 到 10 分：


    +   ● 皮肤的颜色（全身青紫或苍白为 0 分，躯干粉红、四肢青紫为 1 分，全身皮肤粉红为 2 分）'
