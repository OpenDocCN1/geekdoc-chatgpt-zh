- pgno: 227
  md: '制大型科技公司收集有关数据，并且可以更容易地控制呈现给用户的信息。然而，正如祖波夫指出的那样，如果给予用户更多的控制权，这些公司的商业模式将会受到动摇，例如当苹果公司允许用户限制发送给脸谱网数据时，脸谱网的激烈反应就证明了这一点。虽然欧盟已采取措施对其中一些公司进行监管，但英国和美国仍不愿使用其监管权力。


    许多人工智能行业的领袖和政府政策制定者担心政府监管会限制创新，但如果谨慎行事，监管可以加快创新，就像在汽车安全和燃油效率方面所做的那样。美国行政部门管理与预算办公室主任拉塞尔·T.
    沃特（Russell T. Vought）在一份美国政府备忘录中提出了“管理人工智能应用程序”的十条原则。该备忘录建议：“私营部门和其他利益相关者可能会制定与人工智能应用程序相关的自愿性共识标准，提供非监管的方法来管理与人工智能应用程序相关的风险，该方法可能更适应快速发展的技术的需求。”


    白宫发布于 2020 年的一份报告旨在“确保指导人工智能开发和使用的法规能够支持创新，而非负担”。这些原则是“确保公众参与、限制过度监管、促进可信赖的人工智能”。沃特后来更新了他的备忘录，重申了监管的有限作用：“联邦机构必须避免不必要地阻碍人工智能创新和发展的监管或非监管行动。”另一方面，政府有必要保护公众免于被有偏见的系统和监管的俘获，在这些体系中，行业倡导者设置了微弱的监管。在尚未对社交媒体平台进行监管情况下，仇恨言论、虚假信息、人种和种族攻击得以广泛传播，因为社交媒体服务于平台的商业利益，而非公共利益。在一些国家，地区、州或地方政府可能会在尝试新想法方面发挥其影响力，并成为有价值的先例。未来可能会对使用
    HCAI 系统的公司及其行为加强监管，以确保公正的商业行为，促进消费者的安全使用，并限制虚假信息和仇恨言论。'
