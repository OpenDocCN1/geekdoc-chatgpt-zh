    # 图 14.1 美国直觉外科公司的达·芬奇外科手术系统


    许多机器人设备即便自动化程度很高，但仍然具有强大的远程操作能力，可供操作人员执行控制活动。例如，无人机是远程机器人，尽管它们有能力自动悬停或在固定高度轨道运行、返回起飞点或遵循操作员选择的一系列航行路点。美国国家航空航天局的“火星漫游者”探测器还兼具遥控功能和独立运动能力，其通过传感器探测障碍物或悬崖，并规划避开它们。美国国家航空航天局喷气推进实验室（Jet
    Propulsion Labs）控制中心有数十名操作员，即使“火星漫游者”在数亿千米之外，他们也能控制“火星漫游者”上的各种系统。这是高度人工控制和高度自动化相结合的又一个极好的示例。


    远程机器人、远程呈现等术语暗示了另一种设计可能性。这些仪器可以远程操作并让操作人员更加精细地控制设备，例如，远程病理学家通过控制显微镜来研究组织样本。组合设计采用了队友模型，这些模型虽然有'
