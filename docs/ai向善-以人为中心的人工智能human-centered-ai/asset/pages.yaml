  md: '冠疫情期间，购物中心的 Pepper 机器人戴上了口罩，以提醒顾客。2015 年，软银机器人公司从法国阿尔德巴兰机器人公司（Aldebaran Robotics）收购了一款半米高的人形机器人
    NAO。NAO 比 Pepper 机器人更复杂，也更昂贵，但已经在医疗、零售、旅游和教育应用领域售出了 5 000 多台。软银在 2021 年 6 月关闭了
    Pepper 机器人的生产平台，这表明了社交机器人行业的动荡。


    日本，一个经常被描述为渴望小工具和机器人的国家，其一家配备机器人的酒店只营业了几个月，于 2019 年关闭。该酒店有清洁机器人和前台机器人（包括外观像鳄鱼一样的接待机器人）。该公司总裁说：“当你真正使用机器人时，你会意识到有些地方不需要它们——它们甚至会惹恼顾客。”同时，传统的饮料、糖果和其他自动售货机在日本等其他地方都取得了广泛的成功，这些售货机已经改进得更加复杂，可以加热或冷藏食物和饮料。


    关于社交机器人用于自闭症治疗的争议仍在继续。一些研究报告称，对于有人际关系障碍的儿童，使用该机器人会对他们的人际关系障碍问题有所改善。这些研究表明，自闭症儿童可能会觉得与机器人相处更自在，这可能为改善他们的人际关系奠定了基础。


    批评者认为，关注技术而非关注儿童只会带来早期的成功，但不会带来持续性的成果。德蒙福特大学的尼尔·麦克布莱德（Neil McBride）表达了担忧：“如果我们不只是把人类看作一台机器，我们就不可能把治疗的责任下放给一个机械玩具。”然而，与玩偶和木偶一起游戏的治疗方法，可能演变到机器人这一角色。


    追随者和怀疑者之间的紧张关系日益加剧。牛津互联网研究所的大卫·沃森（David Watson）表达了强烈的担忧：“回归拟人化比喻的诱惑……往好了说是误导，往坏了说是彻头彻尾的危害。”他还谈到了责任的伦理问题：“在社会敏感的应用程序中，赋予算法决策权，可能会削弱我们的能力，令有能力的个人和团体难以对技术调节行为负责。”类人社交机器人的追随'
