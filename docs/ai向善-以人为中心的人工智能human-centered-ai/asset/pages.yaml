  md: '# 第 20 章


    # 通过业务管理策略营造的安全文化


    虽然每个组织都希望在任何情况下都能完美地履行职责，但残酷的现实是，流行病压垮了公共卫生，核电站故障引发了地区混乱，恐怖分子威胁着许多国家。过去的事故和事件通常产生的影响很小，但如今，全球化经济中基于技术的相互依存的大规模组织的失败可能对整个城市、地区和大陆的健康和经济造成毁灭性影响。通过组织设计为失败做准备已经成为HCAI的一个主要主题，它至少有四种方法。


    正常事故理论。查尔斯·佩罗（Charles Perrow）颇具影响力的著作《正常事故》（Normal Accidents）有力地论证了组织对安全的责任，而不是批评特定设计或操作失误。他的分析源自政治科学和社会学，强调了组织的复杂性以及单位之间过度耦合的危险，这种耦合将导致集中控制过多且冗余不足，从而无法应对中断。紧耦合意味着组织具备标准的操作程序和精心设计的分层领导链，但当意外事件发生时，跨单位的流畅合作又变得至关重要。对于那些追求最少员工来处理日常运营的组织来说，很难支持人员冗余，但当紧急情况发生时，立即需要额外的有经验的员工。一个组织如何能证明只需要比日常运营多20%或30%的员工就能为每年发生一次的紧急情况做好准备？组织应该如何应对关键人员的离职或死亡？例如，一个公司的三名高管在前往会议目的地的途中死于一场小型飞机失事——也许组织应该确保关键人员乘坐不同的飞机。佩罗的这一研究得到了心理'
  merge: -1
  img_proc: true
- pgno: 193
  md: '学家加里·克莱因的拓展，但受到了社会学家安德鲁·霍普金斯（Andrew Hopkins）的批评。霍普金斯指出，这一研究缺少衡量两种危险的指标：紧耦合和冗余不足。其他批评者则认为佩罗的观点过于悲观，即复杂组织不可避免地会失败。


    高可靠性组织。这种方法源于组织设计和企业管理。高可靠性组织“专注于故障”，研究可能发生的故障和未遂事件，并定期与相关人员进行故障模拟来“致力于恢复”。在明尼苏达州从事电力传输工作的希拉里·布朗（Hilary
    Brown）写道，高可靠性组织“通过人员冗余、频繁培训、强调责任以及在整个集团层级中分配决策来提高可靠性，这些都降低了复杂性和紧耦合的影响，正如佩罗所定义的那样”。与正常事故理论相反，高可靠性组织的倡导者乐观地认为，正念文化可以预防事故。


    弹性工程。这种方法源于认知科学和人因工程。弹性工程使组织足够灵活，并且能够从意外事件中恢复。俄亥俄州立大学的大卫·D.伍兹通过鼓励组织开发“可持续适应性的架构”来促进弹性工程，并从生物、社会和技术系统中吸取经验教训。弹性工程来源于如何适应各类灾难的规划，例如自然灾害（地震、洪水和风暴）、技术相关的灾害（电力、电信、供水中断）、对抗性的灾害（破坏、恐怖主义、犯罪）或设计性的灾害（系统错误、人为错误、管理失败）。


    安全文化。这种方法源于对重大灾难的应对，如切尔诺贝利核反应堆事故、美国国家航空航天局“挑战者号”航天飞机事故等灾难，这些灾难不能归因于个人错误或设计失败。该群体的领导者寻求建立一个培养员工态度的组织，长期致力于开放的管理战略、所有员工的安全心态和经过验证的组织能力。麻省理工学院的南希·莱韦森（Nancy
    Leveson）开发了一种构建安全工程的系统工程方法，包括设计、危害分析和故障调查。她对安全性和可靠性进行了细致的区分，并指出两者是可分离的问题，需要不同'
  merge: -1
  img_proc: true
- pgno: 194
  md: '的应对方法。


    这四种方法的共同目标是，通过准备组织应对故障和未遂事件确保安全、不间断的性能（图 18.2）。在安全文化方法的基础上，我强调了管理者支持 HCAI 的方法：领导对安全的承诺；以安全为导向的招聘和培训；广泛报告故障和未遂事件；内部审查委员会的问题和未来计划；与行业标准和公认最佳实践的一致性评估。


    # 领导对安全的承诺


    高层组织领导人可以通过价值观、愿景和使命来明确他们对安全的承诺。领导对失败的关注体现在他对建立安全文化所做出的积极声明中，包括价值观、信念、政策和规范。持久的安全文化可能会被当前的安全环境所撼动，比如由于内部冲突和新的外部威胁而改变的气氛、环境和态度。明智的企业领导人也知道，倘若董事会也参与决策，那么他们对安全的承诺才更有可能成功，这样，领导者就会认识到，他们的地位取决于安全承诺的成功与否。


    通过频繁地重申承诺、积极招聘、反复培训以及公开处理故障和未遂事件，员工可以看到领导的承诺。对事故的审查，例如每月召开的医院审查委员会会议，可以大大提高患者的安全性。俄亥俄州一家医院的珍妮特·贝里（Janet
    Berry）团队报告称：“改进的安全和团队合作氛围……与减少患者伤害和严重程度调整的死亡率相关。”注重安全的领导者强调内部审查委员会对计划和问题的讨论，以及对行业标准和实践的遵守。


    安全文化需要努力和预算，以确保有足够多的员工参与，有充足的时间和资源来完成他们的工作。这可能意味着需要更多的人员，以确保在出现问题时能够找到知识渊博的人员，并通过风险审计来预防失败，从而具有预测'
  merge: -1
  img_proc: true
- pgno: 195
  md: '危险的积极心态。安全性、可靠性和弹性增加了持续成本，但回报是降低了代价高昂的故障的发生概率。此外，安全工作通常会提高生产力、减少工伤费用、节省运营和维护成本。这些益处很难向怀疑者证明，因为怀疑者们想要质疑为罕见事件和不可预测事件做准备的相关支出，从而削减成本。


    虽然一些关于安全文化的著作侧重于员工安全和设施安全，但对于HCAI系统而言，重点必须放在那些生活受到系统影响的人身上。因此，HCAI系统安全文化的建立将与用户紧密关联，比如患者、医生、医院的管理人员或犯人、律师和假释组织的法官。面向受影响群体的外展服务向利益相关者提供了信息的双向沟通、持续收集使用情况的数据，以及易于报告的不良事件。HCAI组织中安全文化的实施正在兴起，支持医疗健康领域的人工智能管理就是初步努力的一个案例。


    人工智能算法的安全性是一个管理问题，但它对开发人员有技术影响。领导者需要充分了解提高安全性的方法，比如选择正确的客观指标、确保监督控制者能够阻止危险的行动、避免“分配转移”（环境变化会使训练数据失效），以及防止对抗性攻击。领导需要经常在开发过程中验证测试是否完成，并在整个部署过程中继续测试。


    怀疑者担心，在核电、化工、医疗或社交媒体平台等许多行业，企业安全文化声明只是应对不可接受风险的公关尝试。他们还指出，在一些案例中，失败被归咎于操作人员的失误，而不是组织准备不当或操作人员培训不足。确保安全的一种方法是任命一名内部监察员，私下听取员工和利益相关者的担忧，同时公正对待报告严重安全威胁的举报人。


    # 以安全为导向的人员招聘及培训


    当在招聘职位描述中提及安全问题时，现有员工和潜在的新员工都可'
