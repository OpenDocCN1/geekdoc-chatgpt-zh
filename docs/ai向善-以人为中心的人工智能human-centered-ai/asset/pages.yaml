  md: '以看到这一承诺。招聘的多元化也体现了该企业对安全的承诺，例如代表了员工和技能多样性的高级员工。安全文化可能需要来自健康、人力资源、组织设计、人种学和调查取证等领域经验丰富的安全专业人员。


    遵循“安全第一”的组织会定期进行培训演习，例如工业控制室操作人员执行应急预案、飞行员借助飞行模拟器进行培训，以及医护人员为大规模伤亡或流行病进行多日演习。当日常实践与应急预案类似时，员工才更有可能在紧急情况下取得成功。可考虑的周到计划是根据过去事故发生的频率或严重程度对紧急情况进行排名，分析每种情况下需要多少内部应对人员，并计划在需要时如何使用外部服务。设计良好的检查表可以减少正常操作中的错误，并提醒操作人员在紧急情况下应该做什么。


    由于有来自领先科技公司的指导文件，例如苹果公司的人机界面指南和谷歌公司的设计指导书，计算机软件和硬件设计师所需的培训变得更加容易，它们都包含可参考的屏幕设计示例。此外，微软公司的
    18 条人机交互指南和国际商业机器公司的人工智能网站都依赖于一般原则，但这些原则仍需要不断改进。


    这些指南基于用户界面设计的悠久历史和 HCAI 系统设计界面的最新研究。然而，组织必须向用户界面设计师、程序员、人工智能工程师、产品经理和政策制定者传授指南，如果有确保执行、授予豁免和持续改善的组织机制，他们的实践就会得到加强。


    随着 HCAI 系统的引入，培训需求变得更加复杂，例如拥有自动驾驶汽车的消费者、使用电子医疗系统的临床医生、工业控制室的操作人员。这些用户需要了解他们所控制的系统，以及机器学习的工作原理，包括其潜在故障和可能出现的结果。


    保罗·R. 多尔蒂（Paul R. Daugherty）和 H. 詹姆斯·威尔逊（H. James Wilson）在《人类 + 机器：人工智能时代的工作重构》（Human
    + Machine:'
