- pgno: 157
  md: '# 第 18 章


    # 如何弥合道德与实践之间的差距


    绝大多数的人工智能……将会保留……以现行法规及监管策略为准……我们需要管理的是人类对技术的应用，我们需要监督的是人类开发、测试、操作和监控的过程。


    ——乔安娜 · J. 布赖乔 ( Joanna J. Bryson ),《牛津人工智能伦理手册》，由马库斯 · D. 杜伯、弗兰克 · 帕斯夸莱、苏尼特 ·
    达斯编辑


    在医疗健康、教育、网络安全和环境保护等领域，HCAI 方法的广泛应用带来了高于预期的效益。当 HCAI 系统按预期工作时，它可以改善医疗诊断、阻止网络犯罪、保护濒危物种。然而，HCAI
    系统同样会有极其严重的预期风险，例如机器人失控、少数群体受到不公正对待、侵犯隐私、对抗性攻击和对人权的挑战。HCAI 设计和评估方法可以解决这些危险，实现预期的效益。


    本书第三部分指出，传统的人工智能科学研究侧重于研究并模仿（有些人会使用“模拟”这一术语）人类行为，而当前的人工智能创新研究则强调实际应用。典型的人工智能科学基础技术创新包括模式识别和生成（图像、语音、表情、信号等）、类人机器人、游戏（西洋棋、国际象棋、围棋等），以及自然语言的处理、生成和翻译。


    HCAI 的研究建立在这些科学基础上，使系统可靠、安全、可信赖，从而放大、增强并提高人类的表现。典型的 HCAI 科学基础和技术应用包括图'
  merge: -1
  img_proc: true
- pgno: 158
  md: '形用户界面、网页设计、电子商务、移动设备应用程序、电子邮件、短信、视频会议、图片与视频编辑、社交媒体和电脑游戏。这些系统还支持人类的自我效能提升、鼓励创造力、明确责任并促进社会参与。HCAI
    设计师、软件工程师和管理人员可以通过与不同的利益相关者接触，采用以用户为中心的参与式设计方法。此外，用户体验测试有助于确保这些系统支持人类的目标、活动和价值观。人们越来越意识到，评估人类的表现和满意度与衡量算法的性能一样重要，这是向新思维转变的标志。


    HCAI 的多种定义来自一些著名机构，如斯坦福大学，旨在寻求通过理解“人类的语言、情感、意图和行为来服务于人类的集体需求”。虽然人们普遍认为，使用机器学习和深度学习的数据驱动算法会带来好处，但这也让我们更难知道故障点可能的位置。可解释的用户界面和可理解的控制面板有助于实现
    HCAI 对医疗、商业和教育领域的帮助。


    HCAI 代表一种新的跨领域交叉研究方法，这一观点传达了态度和实践变化的重要性。过去，研究人员和开发人员专注于构建人工智能算法和系统，通过设计良好的用户界面，强调机器的自主性而不是人工控制。相比之下，HCAI
    则把人的自主性置于设计思维的中心，强调用户体验设计。HCAI 系统的研究人员和开发人员应当专注于衡量人类的表现和满意度，重视客户和消费者的需求，并确保有意义的人工控制。现有业务的领导者正在迅速适应并集成
    HCAI 系统。


    这种新的跨领域交叉研究方法可能需要几十年的时间才能被广泛接受，因为它代表着一种以机器为中心的观念的根本转变。本书第四部分的 15 条实用建议旨在鼓励讨论和行动，以加速这一转变。然而，至少有两个
    HCAI 系统复杂性的原因使得难以实施所有这些建议。首先，对于单个组件，可以通过熟悉的软件工程实践进行严格的测试、审查和监控，但复杂的 HCAI 系统，如自动驾驶汽车、社交媒体平台和电子医疗系统，则难以被评估。在工程实'
  merge: -1
  img_proc: true
- pgno: 159
  md: '践得到完善之前，独立监督和审查故障、未遂事件的社会机制是必要的。其次，HCAI 系统是由许多产品和服务交织在一起的，包括芯片、软件开发工具、海量的训练数据、庞大的代码库和用于验证与确认的大量测试用例，其中每一项都可能发生变化，甚至每天都在发生变化。这些困难给软件工程师、管理人员、审查人员和政策制定者带来了巨大的挑战，因此这些建议旨在启动急需的讨论、试点测试和可扩展的研究，从而带来建设性的优化。


    来自公司、专业协会、政府、消费者团体和非政府组织的 500 多份报告描述了理想的 HCAI 原则。伯克曼·克莱因中心 2020 年的一份报告讨论了政策活动的高涨，随后对
    36 份领先的、全面的报告进行了深度总结。作者确定了 8 个 HCAI 主题，以进行更深入的评论和详细的原则制定：隐私、责任、安全和保障、透明度和可解释性、公正和非歧视性、技术的人工控制、职业责任和人类价值的提升。


    其他报告强调道德原则，如电气与电子工程师协会（IEEE）提出的“符合道德标准的设计”，该原则由 20 多人经过 3 年的努力才得以提出且影响深远。该报告明确阐述了
    8 项一般原则：人权、福祉、数据代理、有效性、透明度、问责性、滥用意识和能力。该报告还大力鼓励先进系统“应被创建和运行，以尊重、促进和保护国际公认的人权”。图
    18.1 显示了两个报告中高度匹配和大致相似的原则。


    上述原则和其他道德原则是清晰思考的重要基础，但正如布里斯托大学的艾伦·温菲尔德（Alan Winfield）和牛津大学的玛丽娜·吉洛特克（Marina Jirotka）所说：“原则和实践之间的差距是一个重要主题。”HCAI
    系统的四层管理架构可以帮助弥合这一差距：①基于成熟的软件工程实践的可靠系统；②通过业务管理策略营造的安全文化；③通过独立监督获得可信赖的认证；④政府机构的监管（图
    18.2）。图 18.2 最内部的椭圆包含了许多软件工程团队，主要目的是组织推进应用与每个项目相关技术的实践；'
