    The Terminator ）和《黑客帝国》（ The Matrix ）、令人着迷的电影《机器人总动员》（ Wall-E ）和《机器人与弗兰克》（ Robot
    & Frank ）以及发人深思的电影《她》（ Her ）和《机械姬》（ Ex Machina ）中扮演了重要角色。


    计算机越来越多被描绘成独立行动者或代理人，具备思考、学习、创造、发现和交流的能力。多伦多大学教授布赖恩·坎特威尔·史密斯指出，在讨论计算机能力时应避免使用一些词汇，比如知道、阅读、解释或理解。然而，记者和标题作者仍倾向于使用计算机代理和类人能力的理念，产生了以下标题：


    +   机器学习化学（科学日报网， ScienceDaily.com ）

    +   哈勃望远镜意外发现了一个新星系（美国国家航空航天局， NASA ）

    +   发现希格斯玻色子的神奇机器（美国大西洋月刊， The Atlantic ）

    +   人工智能发现与疾病有关的基因（科学日报网， ScienceDaily.com ）


    这些头条新闻与更流行的观念相一致，即计算机正在获得与人类相匹敌或超越人类的能力。其他作家则持有以人为中心的观点，认为计算机是一种超级工具，可以放大、增强、赋权和提升人类表现（图
    11.1）。支持计算机作为超级工具的观点来自多个方面，其中包括麻省理工学院计算机科学与人工智能实验室的负责人丹妮拉·罗斯（ Daniela Rus ）教授，她曾表示：“人们必须要明白，人工智能只是一种工具……拥有巨大的潜力赋予我们力量。”


    超级工具概念的支持者包括早期的 HCAI 研究人员，如道格拉斯·恩格尔巴特（ Douglas Engelbart ），他在 1968 年秋季联合计算机会议上的著名'
