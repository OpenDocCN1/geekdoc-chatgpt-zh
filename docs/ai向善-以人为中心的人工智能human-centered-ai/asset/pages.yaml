- pgno: 124
  md: '果负责。


    在“自主系统的七个致命神话”这篇措辞强烈的论文中，由杰夫·布拉德肖、罗伯特·R. 霍夫曼、大卫·D. 伍兹和马特·约翰逊组成的团队发表了有力的评论。他们大胆宣称：“没有什么比所谓的智能机器更糟糕的了，它不能告诉你它在做什么，为什么这样做以及何时结束。更令人沮丧或更危险的是，当某些事情（不可避免地）出现错误时，机器无法响应人类的指令。”这些作者还发表了令人震惊的言论，认为相信计算机完全自主的人“屈从于自主的神话，不仅对自身造成了伤害，而且其持续传播也在造成伤害……因为它们导致了许多其他严重的误解和后果”。


    即使是人为因素领域的专家，如米卡·安德斯雷教授，也对自主性目标描述了一些难题：“随着系统的自主性增加，其可靠性和稳健性也会提高，人类操作人员的态势感知能力就会越低，他们在需要时顺利接管手动控制的可能性就越小。”安德斯雷在自主系统中的态势感知研究中允许一定程度的监督控制，这种混合设计看起来更符合实际情况。人为因素领域的另一位专家彼得·汉考克（Peter
    Hancock）在他 2022 年发表的措辞强硬的评论文章“避免不利的自主代理行为”中，提出了进一步的危险迹象。他担心自动设备出现“几乎无法避免”的情况，因此他呼吁取消或严格限制自动设备的能力。


    围绕致命性自主武器系统风险的争论仍在继续，这些武器可以在没有人为干预的情况下选择目标并发射致命导弹。一个积极的努力正在进行中，试图像禁止使用地雷一样禁止使用这些武器，而且已经聚集了近
    5 000 个签名。在日内瓦举行的联合国《特定常规武器公约》定期会议吸引了来自 125 个国家的代表，他们正在起草一项限制使用致命性自主武器系统的条约。认知科学研究人员的报告支持了他们的观点，并记录了自主武器的失败、风险和成本。然而，一些军事领导人不希望受到限制，因为他们担心对手'
