- pgno: 173
  md: '可视化中获得的关于跟踪数据来源和测试历史的经验也很有用。这些文档化的策略都有助于将软件工程实践从早期研究转变为更成熟的专业实践。


    对于可能会在不经意间伤害到附近工作人员的移动机器人、致命武器和医疗设备，在测试过程中需要特别注意。安全、任务完成的时间、质量和数量等度量指标将指导开发。航空、医疗器械、汽车等成熟的应用领域，有着悠久的产品认证基准测试历史，为更新的产品和服务提供了良好的典范。验证和确认
    HCAI 系统的准确性、正确性、可用性和脆弱性很重要，除此之外，由于许多应用程序正在处理对人们生活有影响的敏感决策，因此需要进行偏差测试来提高公正性。


    # 偏差测试以提高公正性


    随着人工智能和机器学习算法被应用于重要应用领域，例如假释批准、抵押贷款批准和求职面试，许多批评者纷纷指出其需要解决的问题，华尔街统计学家凯茜·奥尼尔就是其中的领导者之一，她对其中的风险非常熟悉。她的著作《数学毁灭的武器：大数据如何加剧不平等并威胁民主》提出了一个问题：当算法具有如下三个属性时，它们是如何变危险的。


    +   - 不透明性：算法复杂且隐藏在视野之外，因而难以挑战决策；

    +   - 规模：被大型公司和政府用于主要应用；

    +   - 危害：算法可能产生影响人们生活的不公正待遇。


    越来越多的研究群体发起了一些有影响力的会议来回应这些问题，例如关于机器学习的公正性、问责性和透明度的会议，这些会议研究了性别、种族、年龄和其他潜在偏见。当影响假释的偏见将产生严重影响时，当充'
