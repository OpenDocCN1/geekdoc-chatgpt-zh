  md: '# 第 21 章


    # 通过独立监督获得可信赖的认证


    治理结构中的第三个管理层是进行外部审查的独立监督组织（图 18.2）。诸多构建了重要 HCAI 系统的大公司、政府机构和其他组织，都正在冒险步入新的领域，同时也将面临新的问题。因此，完善的独立监督审查有助于他们构建公众广泛认可的可信赖系统。然而，正如来自政府、企业、大学、非政府组织和公民社会的
    40 多种不同报告所显示的那样，设计成功的独立监督结构仍然是一项挑战。


    独立监督的关键是支持人类或组织对其产品和服务负责任和承担义务的法律、道德和伦理原则。责任是一个复杂的话题，如法律责任、职业责任、道德责任和道德偏见。对责任进行更深层次的哲学讨论是有用的，但我假设人类和组织对其间接构建、运营、维护或使用的产品和服务负有法律责任。欧盟新技术责任专家委员会的报告也强调了明确自主技术和机器人技术责任的重要性。委员会声称，这些技术的运营商应承担责任，且产品应该进行审计跟踪，支持对失败的回溯性分析，从而将责任分配给制造商、运营商或维护组织。


    专业工程师、医生、律师、航空专家、商业领袖等都意识到自己对自己的行为负有个人责任，但是在软件领域，很大程度上规避了设计师、程序员和管理人员的认证和职业责任。此外，合同经常包含“免责”条款，规定开发人员不承担损害赔偿责任，即便有
    50 年的软件开发经验，软件开发也经常被描述为一种新出现的活动。HCAI 运动再次呼吁并提出算法的问'
  merge: -1
