- pgno: 244
  md: '然是正确的，但一个越来越受欢迎的选择是，当研究人员与实践者就实际问题进行合作时，基础研究的重大突破会更经常发生。普林斯顿大学政治学家唐纳德·斯托克斯（Donald
    Stokes）在《巴斯德的象限：基础科学与技术创新》（Pasteur’s Quadrant: Basic Science and Technological
    Innovation）一书中推广了这一观点。斯托克斯描述了路易斯·巴斯德（Louis Pasteur）在帮助奶农保持牛奶新鲜度的工作中发明了巴氏杀菌法，以及他与酒商一起防止葡萄酒变酸的工作中发现了杀死有害细菌的方法。这些实践上的成功，为疾病的微生物理论的重大突破和对细菌在健康中发挥强大作用的认知奠定了基础，还为接种疫苗以预防疾病这一非凡想法奠定了基础。


    此后，许多人对这些方法做出了改进，并形成证据，证明与实践者一起工作比在实验室单独工作更有可能取得重大突破。与实践者一起解决实际问题的想法也与 HCAI 的经验方法相关。


    # 研究团队及课程


    HCAI 研究团队在许多大学、公司等其他地方如雨后春笋般涌现。斯坦福大学的以人为中心人工智能研究所是一个成立较早、资金雄厚的组织，汇集了 140 名教员，他们举办的研讨会和专题讨论会吸引了数千人，其会议可以亲自参与或以虚拟方式参与。世界各地的数百所大学已经成立了致力于
    HCAI 及其变体的研究团队，如人类兼容的人工智能、负责任的人工智能、道德的人工智能以及人道的人工智能（见第 21 章的列表）。


    涵盖机器学习和深度学习算法技术和编程方面的学术课程师资力量正在扩大，以囊括道德领域的讨论。多伦多大学的道德中心开设的一门课程，邀请了跨学科的特邀演讲者，演讲者讲完后是小组讨论环节。如今，许多校园增设了道德课程，如果将其开设在计算机科学领域的课程中，可能会'
  merge: -1
  img_proc: true
- pgno: 245
  md: '产生更强有力的效果，从而影响那些可能从事 HCAI 系统研究和开发的人。

    麻省理工学院的斯隆管理学院等商学院提倡这样一种理念，即 HCAI 系统的

    道德分析和道德设计是一种竞争优势。


    人工智能课程逐渐开始涵盖 HCAI 方法，即解决控制面板的用户界面设

    计和基于可用性测试、观察和问询的评估方法。然而，人机交互课程导师

    开始开展更有力的教学活动，并涵盖人工智能方法，以满足对综合技能的

    强烈需求。在美国，卡耐基梅隆大学有一套来源于数个团队的优质 HCAI 课

    程，伊利诺斯大学、弗吉尼亚理工学院等其他美国校园也是如此。在英国，

    帝国理工大学、伦敦大学学院、牛津大学、剑桥大学等其他学校也正在扩

    展 HCAI 方面的工作。在丹麦、德国、意大利、法国、荷兰等欧洲国家，科

    技公司通常将 HCAI 设计列为符合欧洲《通用数据保护条例》对人工智能系

    统可解释性的要求。中国、印度、韩国和日本的其他工作也引发了世界范

    围内的兴趣。


    专业培训课程也开始整合道德问题和可用性方法。Coursera 的在线课程

    “人工智能行为中的道德问题”使用面向项目的技术来分析人工智能道德问

    题，而 edX 提供了“人工智能和大数据中的道德”课程，讲解“为增加透

    明度、建立信任和推动采用的技术和商业举措”的道德框架。这些以商业

    为导向的课程证明，合乎道德的方法能够增加产品和服务的吸引力。


    # 会议和期刊


    随着研究和教育的发展，会议和期刊上的涉及 HCAI 的出版物也在增

    多。传统的人工智能会议，如人工智能促进会、国际人工智能联合会议和

    神经信息处理系统会议，每年吸引了超过 10 000 名与会者，往往达到其会

    议场地的最大容量。美国计算机学会的人机交互会议和人机交互国际会议'
  merge: -1
