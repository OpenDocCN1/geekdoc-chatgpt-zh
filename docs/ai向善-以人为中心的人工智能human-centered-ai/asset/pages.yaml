  md: '长期以来，网络安全领域一直为漏洞报告付费的做法可以适用于 HCAI 系统，即给报告系统问题的个人支付漏洞赏金，这一想法可以扩展到向上报告偏差表现的个人支付偏差赏金。这种众包的想法已经被谷歌等公司采用，向每份经过验证的报告支付
    100 美元到 3 万多美元不等的费用，总计已支付超过 300 万美元。此外，至少还有两家公司从事为客户管理此类系统的业务：HackerOne 和 BugCrowd。在
    HCAI 环境中验证这一想法需要制定政策，包括支付多少钱、如何评估报告，以及公开披露多少有关漏洞和偏差报告的信息。这些众包的想法建立在软件开发人员埃里克·雷蒙德（Eric
    Raymond）的信念之上，他认为，“只要有足够多的眼睛，就可以让所有的漏洞浮现”，这表明让更多的人参与寻找漏洞是有价值的。


    与没有显示器的高度自动化系统（如电梯、制造设备或自动驾驶汽车）相比，以可解释状态显示的交互式系统更容易报告漏洞。例如，我经常在家里遇到网络连接问题，但由于缺乏足够的用户界面，我很难报告我所遇到的问题。当网络连接中断时，我很难判断是笔记本电脑出了问题，还是路由器的无线连接出了问题，或是网络服务提供商出了问题。我希望有一个状态显示和控制面板，这样我就可以解决问题或知道该给谁打电话咨询。服务器托管公司就能为其专业客户提供这些信息。像许多用户一样，我遇到上述问题时最好的做法是全部重启，并希望在
    10~15 分钟内可以恢复工作。


    另一个要遵循的模型是美国陆军的事后回顾方法，该方法也被用于医疗健康、交通运输、工业过程控制、环境监测和消防，因此它们可能有助于研究 HCAI 故障和未遂事件。调查人员试图了解应该发生的事情、实际发生的事情以及未来可以做得更好的事情。一份阐述哪些进展顺利和哪些可以改进的完整报告将鼓励人们接受建议。随着采用事后回顾方法的人对流程越来越熟悉，他们的分析可能会随之改进，他们的建议也会得到接受。'
