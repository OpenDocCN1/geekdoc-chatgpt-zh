- pgno: 68
  md: '![](img/1b604470e34bc8bdfb044407ab9bdfc5_68_0.png)


    # 图 8.3 需要快速行动的区域（高自动化、低人工控制）和人类掌控（高人工控制、低自动化）的区域


    人们通常希望从寻求掌控感、提高技能和全身心投入中获得乐趣。一次安全的自行车骑行或一次完美的小提琴演奏都是值得庆祝的事情。他们可能选择使用计算机系统进行培训、复习或指导，但许多人渴望独立行动来实现自我效能。在这些行动中，目标在于做这件事的过程和个人满足感以及挖掘创造性探索的潜力。左下象限是钟表、音乐盒、捕鼠器等简单设备以及地雷等致命设备所处的位置。


    另外，还有两个实施层面的因素极大地影响了可靠性、安全性和可信性：传感器的准确性和数据的公正性。当传感器不稳定或数据源不完整、有错误或偏差时，人工控制就变得更加重要。稳定的传感器和完整、准确、公正的数据有利于实现更高程度的自动化。


    设计师们得到的信息是，对于某些任务，完全由计算机控制或完全由人类掌控是有价值的。然而，我们面临的挑战是开发有效且经过验证的设计，并辅以可靠的实践、安全文化和可信赖的监督。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '除了计算机和人类完全自主的极端情况外，还有另外两种危险的极端情况——过度自动化和过度人工控制。图 8.4 的最右侧是过度自动化区域，例如波音 737
    MAX 的控制系统，该系统导致了 2018 年 10 月和 2019 年 3 月发生的两起坠机事故，造成 346 人死亡。这次故障有很多方面的原因，但设计师违反了一些基本的设计原则。该自动化控制系统只从两个迎角传感器（显示飞机是在上升还是下降）中的一个读取数据。当这个传感器失效时，控制系统会迫使机头向下，但飞行员不知情，所以在坠机前的几分钟里，他试图把机头向上拉了
    20 多次，导致飞机上所有人丧生。飞机设计者犯了一个可怕的错误，他们认为控制飞机的自动系统不会发生故障。因此，不仅设计者没有在用户手册中对这一系统进行描述，飞行员也没有接受过如何切换到手动操控模式的培训。悲剧本是完全可以避免的。国际商业机器公司（IBM）的人工智能指南明智地予以警告：“难以察觉的人工智能不是合乎道德的人工智能。”


    # HCAI


    ![](img/1b604470e34bc8bdfb044407ab9bdfc5_69_0.png)


    # 图 8.4 过度人工控制与过度自动化


    注：设计师需要防止因过度自动化和过度人为控制（灰色区域）而造成的故障。'
  merge: -1
