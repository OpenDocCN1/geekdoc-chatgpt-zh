  md: 综上，“队友”这一隐喻的持续存在对许多设计师和用户具有吸引力。虽然用户可以自由地将他们的计算机描述为队友，但利用计算机的独特功能，如复杂算法、庞大数据库、超人类传感器、信息丰富的显示器和强大的效应器，设计师可能会开发出更有效的远程机器人，并被用户视为超级工具。
