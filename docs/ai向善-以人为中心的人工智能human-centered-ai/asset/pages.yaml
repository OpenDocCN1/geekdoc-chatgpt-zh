  md: "# 第 5 章\n\n# 总结及怀疑者的困境\n\n> 没有实践的理论将无法生存，而热衷于实践却忽视理论的人，就像水手登上了一艘没有舵和罗盘的船，永远不知道驶向何处。\n\
    > \n> 列奥纳多·达·芬奇\n\n预测未来是一件有风险的事情，因此艾伦·凯（Alan Kay）提出，预测未来的最好方法就是创造未来。因此本书描绘了一个技术未来的愿景，即加强人类对更强大的超级工具、远程机器人、有源设备、控制中心的控制权。\n\
    \n这一愿景衍生出一种新的跨领域交叉方法，即对人工智能算法与支持人权、正义和尊严的人类价值观给予同等重视。这些 HCAI 的观点来自理性主义者和经验主义者之间的持续辩论，理性主义者喜欢基于实验室研究的逻辑思维，而经验主义者则以人类需求和同理心来追求对现实世界的观察。两种方法都有价值，所以我开始将理性主义思维与经验主义方法相结合。\n\
    \nHCAI 基于扩展用户体验设计方法的过程，包括用户观察、利益相关者参与、可用性测试、迭代改进以及持续评估人类使用机器学习等人工智能算法系统中的表现，其目标是创造放大、增强、赋权和提升人类表现的产品和服务。HCAI\
    \ 系统强调人的控制权，同时高度嵌入自动化。\n\n许多人仍然相信计算机可以模仿、媲美甚至取代人类。我认为，人类属于一个单独的种类，精心设计的计算机可以帮助他们做得更好，就像望远镜、心电图和飞机那样。即使计算机变得更加强大，算法变得更加复杂，"
