- pgno: 130
  md: '斯·芒福德所预测的那样，机器开始从类人形态转向更复杂的、为特定任务量身定制的形态。


    尽管如此，研究人员、公司，甚至政府机构都制造过社交机器人。


    1993 年，美国邮政局建造了一个真人大小的“邮政员”（Postal Buddy），并计划安装 10 000 台机器。然而，在消费者拒绝安装 183 个“邮政员”后，他们停止了这个项目。许多拟人化的银行柜员的设计，比如“柜员蒂莉”（Tillie
    the Teller），由于消费者的反对销声匿迹了。当代银行系统通常不使用自动取款机这个名称，而是使用自动交易机或提款机，这些机器帮助顾客快速完成任务，而不用与具有欺骗性的、银行柜员化身的机器人进行干扰性的对话。此外，由于其他人在排队等候，语音命令也会带来隐私问题。


    由克利福德·纳斯的咨询师提出的谬论，导致了微软 1995 年的 Microsoft BOB 的失败，该软件通过屏幕中友好的角色帮助用户完成任务。这个可爱的想法引起了媒体的注意，但一年后微软将其关闭，并未推出
    2.0 版本。同样，微软 Office 1997 的“大眼夹”是一个十分健谈、面带微笑的回形针角色，它会弹出来提供帮助，从而打断用户的工作和思路。


    还有一些被大力推广的想法，例如安娜诺娃（Ananova），一个基于网络的新闻主持人化身，于 2000 年推出，但在几个月后就叫停了。2018 年，中国的开发者为国家通讯社（新华社）重新提出了类似人类的新闻阅读器的想法，并于
    2020 年 6 月发布了迭代版本。即使是屏幕上欢快的角色，比如苹果公司 1987 年著名的知识导航视频中的管家肯（Ken the Butler）和智能辅导系统中的化身，也已经消失了。这些角色分散了用户的注意力，使他们无法完成任务。


    制造商本田（Honda）制造了一款几乎真人大小的社交机器人，名为“阿西莫”（Asimo），该机器人出席贸易活动并被社交媒体广泛报道，但该项目在 2018 年停止，也没有商业化的计划。最近有一个戏剧性的新闻事件，'
