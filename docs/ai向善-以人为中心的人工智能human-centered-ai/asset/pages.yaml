- pgno: 167
  md: '地构建和测试原型，然后随着发展而放弃早期的想法，并随时准备尝试新事物。敏捷团队的工作需要一到两周的冲刺时间，即需要进行重大变更的紧张时期。敏捷模型建立在持续的反馈中，以确保系统朝着有效的方向发展，从而避免出现大的意外。


    敏捷模型要求开发人员之间进行强有力的协作，以分享彼此的工作知识，这样他们就可以讨论可能的解决方案并在需要时互相帮助。瀑布模型的项目是在一年的工作后交付一个完整的系统，而敏捷项目能够在一个月内产生一个原型。国际商业机器公司鼓励人工智能项目采用敏捷方法，因为与传统项目相比，开发人员必须保持开放的心态，并更多地探索替代方案。


    《敏捷软件开发宣言》于 2001 年由自称敏捷联盟的 17 人组成的小组首次提出，它基于 12 项原则。为了保持一致性，我改了一下措辞：


    +   ①通过早期和持续交付有价值的软件来满足客户。

    +   ②欢迎不断变化的需求，即使是在后期开发。

    +   ③频繁交付工作软件，以周为单位，而不是以月为单位。

    +   ④与客户及其管理者密切合作。

    +   ⑤围绕积极主动、可信任的个人来塑造项目。

    +   ⑥确保开发人员和客户之间定期进行面对面的对话。

    +   ⑦使工作软件成为进度的主要度量标准。

    +   ⑧在项目期间以持续的速度工作。

    +   ⑨持续关注技术和设计的卓越性。

    +   ⑩保持项目简单——采用极简设计——编写更少的代码。

    +   ⑪使自组织的团队能够追求架构、需求和设计的质量。

    +   ⑫定期反思如何变得更有效率，然后行动。'
