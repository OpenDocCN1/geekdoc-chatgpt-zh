    能力成熟度模型集成是软件工程组织过程的指南，它分为 5 个成熟度等级，在 1 级中，过程不可预测、组间控制不佳、开发人员只能被动反应。更高级别的成熟度定义了有序的软件开发过程，其中包含管理控制的详细度量，以及组织范围内关于如何优化性能和预测问题的讨论。对员工和管理人员的培训有助于确保所要求的实践得到理解和遵循。大多数美国政府的软件开发合同，尤其是来自国防机构的合同，都使用正式的评估程序，并规定了投标人需具备的成熟度等级。


    总之，安全文化需要行业领导者的坚定承诺，并得到人员、资源和实'
