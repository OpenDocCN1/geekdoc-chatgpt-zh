  md: '也有局限性，因为人类健康是无法仅用一组复选框或数值评分来衡量的，所以临床医生的文本报告更具价值。同样，决策树模型也有其优势和局限。研究人员在寻求商业产品和服务的人工智能创新的过程中意识到，理性的方法可能是一个良好的开端，但他们也知道，融入以人为中心的实证方法才会带来益处。


    经验主义者认为，研究人员必须走出办公室和实验室，才能感知现实世界的复杂性、多样性和不确定性。他们明白，必须不断改善理念，才能应对不断变化的现实和新环境。达·芬奇用他敏锐的视觉来研究鸟类飞行，并根据障碍物周围的水流总结出了流体动力学原理。伽利略·伽利雷（Galileo
    Galilei）追随达·芬奇的脚步，注意到教堂里一盏枝形吊灯有节奏地摆动，从而得出了钟摆摆动次数的公式。19 世纪 30 年代，查尔斯·达尔文（Charles
    Darwin）前往遥远的加拉帕戈斯群岛等地，观察大自然丰富的多样性，因此提出了物种经过自然选择进化的学说。


    约翰·洛克（John Locke）、大卫·休谟（David Hume），以及 20 世纪的统计学家约翰·图基（John Tukey）也是经验主义者，图基主张图形化地查看数据。经验主义思维和对人类同理心的观察是大多数用户体验设计群体的基础，这些群体会评估人类表现并改进设计。经验主义者对简单的二分法和复杂的本体论提出质疑，因为这些可能会限制人们的思维，削弱分析师分辨事物重要性的细微差别和非等级关系的能力。


    理性主义观点是人工智能群体的一个强大支柱，让研究人员和开发人员强调基于逻辑的数据驱动编程解决方案。幸运的是，越来越多的人工智能研究转向实证方法，如情感计算、医疗保健、自然语言处理实证方法会议。当把目标定位为制造被广泛使用的消费设备时，人们就会增加对经验思维的关注度。


    理性主义还相信，统计方法和机器学习算法已经足以实现人工智能在'
  merge: -1
