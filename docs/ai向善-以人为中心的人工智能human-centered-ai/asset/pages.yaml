- pgno: 9
  md: '研究人员、开发人员、商业领袖、政策制定者等各方人员正在扩展“以技术为中心的人工智能”的范围，以涵盖“以人为中心的人工智能”的思维方式。从以算法为中心到以人为中心的这种拓展，有助于塑造技术的未来，从而更好地服务于人类的需求。教育工作者、设计师、软件工程师、产品经理、评估人员和政府机构工作人员可以采用人工智能驱动技术来设计产品和提供服务，使用户的生活变得更美好，让人们能够互相关心。人类一直是各式各样工具的制造者，现在，他们是超级工具的制造者，他们的发明可以改善人类健康、家庭生活、教育、商业、环境等方面。在过去十年中，机器学习和深度学习技术的显著提升为新的机会和一些潜在黑暗面敞开了大门。然而，人工智能研究人员、开发人员、商业领袖、政策制定者以及其他采用
    HCAI 设计和测试策略来构建人工智能算法的人员，将拥有一个光明的未来。这种开阔的视野可以塑造技术的未来，从而更好地服务于人类的价值和需求。正如许多科技公司和思想领袖所言，我们的目标并非取代人类，而是通过设计选择赋予人类对技术的控制权。


    詹姆斯·瓦特（James Watt）的蒸汽机、塞缪尔·莫尔斯（Samuel Morse）的电报和托马斯·爱迪生（Thomas Edison）的电灯都是技术突破，为交通、通信、商业和家庭带来了新的可能性。他们都超越了当时人们熟知的技术，创造了新的产品和服务，提升了人们的生活品质，同时带来了更大的可能性。但是，每个积极的进展也都可能被犯罪分子、极端组织、'
  merge: -1
  img_proc: true
- pgno: 10
  md: '恐怖分子等恶意行为者所利用，因此，如果想减少这些威胁，就要谨慎关注技术的使用方式。莱特兄弟（Wright Brothers）的飞机、蒂姆·伯纳斯－李（Tim
    Berners-Lee）的万维网以及詹妮弗·杜德纳（Jennifer Doudna）和艾曼纽·夏彭蒂尔（Emmanuelle Charpentier）的基因组编辑，这些都是人类超越现有事物的前沿思维能力的充分体现。现在，随着新技术不断取得重大突破，我们有机会选择如何应用这些技术。


    对于人工智能的高期望以及一些与人工智能有关的令人印象深刻的成果，如 AlphaGo 程序在围棋比赛中获胜，引发了世界范围内研究人员、开发人员、商业领袖和政策制定者的激烈探讨。近年来，机器学习和其他算法取得了惊人的进步，这一现象激发了人们的讨论，同时在医疗、制造和军事创新领域引起了巨额投资。


    如果欣然接受一个以人为中心的未来，群体的影响力可能会变得更大。在这个未来里，增强人类能力的超级工具可能会变得更多，人类会用更非凡的方式掌控世界。HCAI 的这种颇具吸引力的前景是建立在人工智能方法的基础上，因此人们能够非常清晰地思考、创造和行动。HCAI
    技术带来了超人的能力，增强了人类的创造力，同时提高了人类的表现和自我效能。当 HCAI 被应用到熟悉的产品中，这种效能就更加明显了。例如数码相机，它显然具有高度的人工智能控制，其许多人工智能支持自动设置光圈、调整焦距和防抖。同样，HCAI
    导航系统也让步行者、骑行者、驾驶者和公共交通使用者能够使用人工智能程序的实时数据来预测出行时间，从而做出合理的选择。


    HCAI 扩展了人工智能驱动算法的效力，展示了如何开发出放大、增强、赋权和提升人类表现的技术。这一思维方式会令读者兴奋，因为它描述了一个更安全、更易懂、更可控的未来。以人为中心的开发模式将会减少技术失控的风险，平息人们因机器人导致失业的担忧，并给予用户掌控'
  merge: -1
