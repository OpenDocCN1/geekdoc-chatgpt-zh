- pgno: 289
  md: '# 我为何热衷于以人为中心的方法


    > 创造力取之不尽，用之不竭，越用越多。——马娅·安杰卢（Maya Angelou）


    虽然有越来越多的学者使用 HCAI 方法，但仍然有许多研究人员和从业人员抵制这种方法，并对之缺乏兴趣。那为什么我如此渴望将人工智能的研发扩展到 HCAI 呢？在被研究人员、从业人员、商业领袖和政策制定者广泛接受的主流主题之外，为什么我认为还有另一种选择呢？因为，我渴望看到广泛的群体转变，并使群体认识到：以人为中心这一态度的必要性和益处。这些变化映射了我自己早些时候的思维转变。


    我曾作为一名数学和物理专业的本科生，满怀热情地撰写了一篇关于人工智能和神经网络的可能性的文章，并发表于纽约城市大学城市学院的工程杂志上。我曾规划获得美国卡耐基梅隆大学的丰厚奖学金，并跟随人工智能领域的领军人物艾伦·纽威尔（Allen
    Newell）和赫伯特·西蒙（Herbert Simon）攻读博士学位，但我的学业因越南战争而受阻。相反，我在一所两年制的社区大学——位于美国纽约长岛法明代尔的纽约州立大学——教授数据处理，为国家服务了三年。这使我步入了数据库系统这一新兴课题，并于
    1973 年成为纽约州立大学石溪分校第一位计算机科学博士。'
  merge: -1
  img_proc: true
- pgno: 290
  md: '尽管我越来越受到英国教授马歇尔·麦克卢汉（Marshall McLuhan）等思想家的影响，但在我人生的这个时期，我理性主义的一面依然很强烈。麦克卢汉的著作，尤其是《理解媒介：论人的延伸》（Understanding
    Media: The Extensions of Man）一书，对我产生了深远的影响。他对全球电子村的描述预示着万维网的出现，他对冷媒介和热媒介的讨论有时令人费解，这让我更深入地思考技术对人类体验的影响。麦克卢汉的理论解释了文本的线性，即每个词都以有序的方式跟随是如何导致隐私和专业化的。这一想法激发了我对专业选择的偏好，我更喜欢更广泛的跨学科方法，我兼收并蓄的兴趣促使我学习了心理学、摄影学、社会学等科学与工程之外的其他学科。


    作为印第安纳大学的助理教授，我打破了传统的计算机科学，与一位年轻的心理学同事理查德·梅尔（Richard Mayer）合作，他在实验方法和统计学方面对我进行了培训。我开始研究程序员的表现，以改进编程语言和工具的设计。在印第安纳州的布卢明顿市心满意足地度过了三年之后，我去了马里兰大学，在那里我与心理学家南希·安德森（Nancy
    Anderson）和肯特·诺曼（Kent Norman）建立了密切的合作关系。当时我还在教授编程和数据库系统，我就致力于研究设计技术以增强人们的能力，就像个人电脑刚刚兴起一样——这拉开了人机交互的新领域。


    我的奇异想法促成了前瞻性书籍《软件心理学：计算机及信息系统中的人为因素》（Software Psychology: Human Factors in Computer
    and Information Systems），后简称《软件心理学》出版。令我高兴的是，这本书被两个计算机科学月度图书俱乐部选为特色读物，并迅速引发了人们对这个新话题的关注。我的偶像之一、人工智能研究负责人艾伦·纽维尔在1985年的一次主题演讲中，将《软件心理学》作为其转向人机交互研究的灵感来源，这让我感到更加自豪。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '我的另一个灵感来源是，我有机会在 J. C. R. 利克莱德访问马里兰大学时接待他，他于 1960 年发表的《人机共生》（Man-Computer Symbiosis）的文章被许多人视为支持计算机将成为人类的伙伴、与人类平等的观点，但利克莱德明确区分了人类和计算机：“在预期的共生伙伴关系中，男性和女性将设定目标、提出假设、确定标准，并进行评估。计算机器将完成必需的日常工作，为技术和科学思维的洞察力和决策奠定基础。”利克莱德明白，计算机所做的工作与人类不同，在他看来，人类负责指导工作、获得洞察力，并做出决定。他邀请我去麻省理工学院进行访问，并冷静温和地鼓励我从事用户界面设计的心理学研究。


    我的另一位偶像是道格·恩格尔巴特，他基于 20 世纪 60 年代对增强人类能力的研究提出了许多基本思想，比如在屏幕上移动光标的鼠标。他的想法发展成为现代图形用户界面和协作计算。恩格尔巴特以人为中心的方法挑战了人工智能领域的领导者，因此这些领导者撤销了他的专款。由于担心自己的工作被忽视，他在
    1998 年获得美国计算机协会人机交互学会终身成就奖时非常感动，几乎热泪盈眶，他对这些问题的热情由来已久。


    约瑟夫·魏森鲍姆的《计算机能力与人类理性：从判断到计算》（Computer Power and Human Reason: From Judgment to
    Calculation）一书中进一步提出了人类价值在技术中的重要性，并重申了计算机与人类之间的区别。虽然在 20 世纪 60 年代中期，魏森鲍姆的聊天机器人
    ELIZA 引起了人们极大的兴趣，但令他感到震惊的是，有人认为这是迈向基于计算机的心理治疗和类人对话的一步。魏森鲍姆向我们展示了计算机可以通过编程来用自然语言做出反应，但他强烈指出，人类具有独特的推理能力，具有深刻的社会性，并被强烈的激情所驱动，这与计算机截然不同。


    魏森鲍姆对其同行的批评鼓励了我在《软件心理学》中对人工智能的想法和系统提出质疑。我对特里·威诺格拉德（Terry Winograd）于 1972 年'
  merge: -1
  img_proc: true
- pgno: 292
  md: '发表的颇具影响力的麻省理工学院博士论文中提出的自然语言理解研究尤其严苛，他的 SHRDLU 机器人能对范围很窄的命令做出响应，该命令仅涉及几个名词和动词，例如“捡起红色方块”，但他的工作被视为一个重大突破。对我来说，他的论文题目“理解自然语言”本身就是一种恼人的夸张。


    当威诺格拉德与费尔南多·弗洛雷斯（Fernando Flores）合著的《理解计算机与认知》（Understanding Computers and Cognition）一书中提到“计算机无法理解自然语言”时，我很高兴。他们还写道，“在设计工具时，我们正在设计一种存在的方式”，其中一个重要问题是如何制造“适合人类目的的机器”。我打电话给威诺格拉德，并同他讨论工作。当他把我对
    SHRDLU 机器人的批评推荐给学生时，我对他言语的担忧就烟消云散了。我们的立场比我预想的更加和谐。从那时起，我们建立了一种温和的同事关系。他在软件设计方面的工作，以及他通过领导的计算机社会责任专家联盟对技术政策问题的倡导，都激励了我。威诺格拉德还因指导谢尔盖·布林（Sergei
    Brin）和拉里·佩奇（Larry Page）而闻名，他们于 1998 年共同撰写了一篇论文，为谷歌大获成功的搜索工具奠定了算法基础。


    威诺格拉德从人工智能研究人员转变为人机交互思想领袖，这表明人们的思维向以人为中心的思维转变是可能的，但许多以技术为重点的研究人员仍然致力于人工智能，即使跨学科的以人为中心的方法得到了加强。为了加速这一运动，1982
    年春天，在美国国家科学技术研究院（当时的美国国家标准局）召开的一次会议上，我牵头了一项工作，并召集了 200~300 名心理学、人为因素和计算机领域的科学研究人员。令我们惊讶的是，有
    906 人出席了会议，这加快了人机交互的研究。在这一惊人成功的鼓舞下，我们和其他人组成了一个专业团体——美国计算机协会人机交互学会，该团体一直在举办会议，如今，该团体举办的会议每年能吸纳
    4 000 人，且在世界各地有 30 多个附属会议。'
  merge: -1
  img_proc: true
- pgno: 293
  md: '由于以人为中心的个人电脑的出现，关于人机交互的会议、期刊和课程数量都在稳步增长。1981 年，我提出了直接操作用户界面的想法，用户可以在屏幕上单击、拖放对象来完成工作。后来我了解到，伊万·萨瑟兰（Ivan
    Sutherland）在 1963 年展示了一些例子，但我受到了空中交通控制系统以及某些游戏的影响，尤其是意大利教育家玛丽亚·蒙台梭利（Maria Montessori）和瑞士心理学家吉恩·皮亚杰（Jean
    Piaget）关于通过控制来教育孩子的想法。通过鼠标或触摸屏进行手眼协调操作，描述并解释了当前的成功，为视觉隐喻奠定了术语和心理学基础。这种直接操纵是引导我开发高亮可选择链接的指导概念，这是
    Hyperties 商业产品的一个关键思想，也是蒂姆·伯纳斯 - 李（Tim Berners-Lee）1989 年的万维网宣言的一个组成部分。这也促成了我们在微型触摸屏键盘上的工作，并能为照片添加标签。


    1983 年，马里兰大学计算机视觉研究领域的领军人物阿兹里尔·罗森菲尔德（Azriel Rosenfeld）教授邀请我组建人机交互实验室，这给了我很大的鼓舞。我们的实验室在促进用户界面设计、理论、指南和经验研究方面处于早期领先地位，在
    1986 年的第一版《用户界面设计：有效的人机交互策略》（Designing the User Interface: Strategies for Effective
    Human-Compute Interaction）中描述了这些内容。史蒂夫·乔布斯（Steve Jobs）的苹果电脑为这一领域注入了活力，他认为，以人为中心的立场是“技术与艺术结合，与人文学科结合，为我们带来了心动的结果”。1988
    年 10 月，他拜访了我们位于马里兰大学的实验室，这让我印象深刻，也让我为苹果公司做了 5 年的顾问。这个故事和其他故事都记录在人机交互的影像历史中；《与人机交互先驱的相遇：个人历史和照片杂志》（Encounters
    with HCI Pioneers: A Personal History and Photo Journal）。


    尽管人机交互是一个不断发展的研究领域，但由于行业力量认为人工智能代理和机器人将很快普及，人工智能获得了更大的发展势头。争议不'
  merge: -1
  img_proc: true
- pgno: 294
  md: '断扩大，引发了几次公开辩论，并最终在 1997 年的一次交锋中达到高潮，当时我和帕蒂·梅斯（Pattie Maes）阐述了我们对人工智能和人机交互的看法。梅斯是一位受人尊敬的麻省理工学院媒体实验室教授，曾被《时代》（Time）杂志评为网络精英，同时也被《人物》（People）杂志列入全世界最美的
    50 人。我的大胡子形象让一些人把我们的辩论称为美女与野兽的较量。


    这些辩论引起了人们的兴趣，并阐明了关于未来技术的两种看法，我在第 14 章中已对此进行了描述。梅斯主张让机器人代理了解你的习惯并主动提供你想要的东西，甚至在你意识到你想要它之前。我主张人类的主动性，以及通过点击、拖拽和拖放显示器上的对象以完成工作的能力。我担心她的方法会出差错，她认为我要求用户自己做所有的事情的方法太乏味。


    20 年后，我们在 2017 年美国计算机协会人机交互学会的会议上再次相遇，每个人都从过去的事件中变得更明智，愿意承认我们的错误。梅斯成为增强技术会议的创始人，她的麻省理工学院软件代理实验室演变成了流体界面实验室，这表明她也看到了以人为中心的方法的价值，这让我看到了更广泛变革的希望。


    随着我对用户界面和用户体验设计的研究日趋成熟，我开始重视呈现数据、关系、模式和过程的可视化用户界面。约翰·图基（John Tukey）的著名著作《探索性数据分析》（Exploratory
    Data Analysis）声称，更快速的计算机和更高分辨率的显示器使得数据的交互式探索变得更加容易。受到提高人类理解周围世界能力的潜力的启发，我把精力转向支持交互式可视化数据探索，也就是现在所说的信息可视化。即使是我们早期的示例也带来了关于缺失、不正确或异常数据的宝贵见解，鼓励我们使用户能够收集有关他们数据的见解，但我们的团队很快发现，当用户发现之前隐藏的模式，如集群、差距、关系和异常值时，他们会非常兴奋。


    在一次匆忙准备的会议主题演讲中，我宣布了一个简洁的信息可视化'
  merge: -1
  img_proc: true
- pgno: 295
  md: '口号：“先概览，放大并过滤，然后按需提供细节。”这句话表明，可视化界面应该从显示所有数据开始，即使有数十亿个数据项，然后允许用户放大他们想要的内容，过滤掉他们不想要的内容，然后单击以获得所需的详细信息。这个口诀是一个简单指南，来源于我对用户热情的观察。尽管描述这一口诀的论文发表在一个二级会议上，但该论文已经有
    7 000 多次引用，对于一个没有研究结果支持的简单指南来说，这是一个惊人的数字。我认为推动其成功的原因在于，其概述有助于为用户定位，邀请用户操作控制面板，以之前不可能的方式快速探索。


    从正在探索深度学习算法复杂性的开发人员开始，可视化用户界面已经成为理解 HCAI 系统复杂性的强大工具。可视化的用户界面对于那些想要易于理解的推荐系统的消费者，以及需要做出重要决策的商业领袖来说，也是一份馈赠。此外，可视化用户界面也让操作人员能够更好地控制用于制造、运输和医疗保健的机器人系统。可视化用户界面越来越向着成为
    HCAI 系统的一部分发展。


    另一个教训是，人们有强烈的与其他人交流的愿望，包括交换信息、分享照片、讲述故事或组建和协调团队。在新冠疫情期间，Zoom 视频会议和关系系统的蓬勃发展加速了这些工具的开发。然而，由于人们长时间盯着显示屏会产生疲劳，这激发了更有创意的社交设计，如
    Gather.town、Kumospace 及其竞争对手，它们的系统都建立在类似游戏的空间环境中。这些系统将被编入未来的 HCAI 系统，以促进这一原则：人在群体中，计算机在循环中。


    有创造力的研究人员和开发人员将应用 HCAI 设计来推进保护权利、获得正义和支持尊严的人类价值观。创新人士知道，通过增强自我效能、创造力、责任感和社交关系，他们将获得从他们的设计中受益的忠实用户。此外，他们必须保持警惕，减少来自恶意行为者、无意识和有意识的偏见、'
  merge: -1
  img_proc: true
- pgno: 296
  md: '有缺陷的软件等无处不在的威胁。其他挑战包括克服种族歧视、缩小收入不平等以及恢复破坏的环境，这些都是联合国可持续发展目标的一部分。

    我非常满意地看到在过去 40 年中取得的进展，尽管它永远不会十全十美。

    当然，还有很多工作要做，但我仍然乐观地认为，最好的时刻还没有到来，

    我已经准备好尽自己的一分力量。'
  merge: -1
