  md: '演讲展示了关于增强人类智力的愿景。《纽约时报》的科技记者约翰·马尔科夫在他的畅销书《与机器人共舞：人工智能时代的大未来》（Machines of Loving
    Grace: The Quest for Common Ground between Humans and Robots）中追溯了人工智能与智能增强的历史。他描述了有关人工智能的争议、个性和动机，表明人们越来越相信在科学目标和创新目标相结合方面有可行的方法。


    这些问题是我在 1997 年与麻省理工学院媒体实验室的帕蒂·梅斯（Patti Maes）进行辩论时的核心问题。在当时，还尚未普及智能手机和触屏应用程序，我们的立场代表了对未来计算机的两种看法。我基于直接操作的思想举了一些例子，向用户展示了如何使用按钮、复选框和滑块来操作控制面板，以改变地图、文本列表、照片阵列、条形图、线形图和散点图等视觉显示。相比之下，帕蒂·梅斯描述了“软件代理如何了解个人用户的习惯、偏好和兴趣”，她认为“软件代理是主动的，它可以采取主动行动，因为它知道你的兴趣所在。”简言之，我主张设计应该使用户能够高度控制强大的自动化系统，而梅斯则认为软件代理可以可靠地接管并替用户完成工作。即使经过了
    25 年的发展，这场辩论仍在以不断变化的形式继续演变着。


    追求创新目标的开发人员更倾向于设计工具类产品和服务。他们受到众多指南文件的影响，如苹果公司的《人机界面设计指南》中明确提出的两个原则：“控制一切的是人，而不是应用程序……让应用程序接管决策通常是错误的”和“让用户对他们的工作进行完整、细致的控制”。这些指南以及国际商业机器公司、微软和政府等机构的其他指南，促使应用程序在内部和跨应用程序之间实现更大的一致性，这使得用户（尤其是那些残障用户）更容易学习使用笔记本电脑、移动设备和基于互联网的服务上的新应用程序。'
