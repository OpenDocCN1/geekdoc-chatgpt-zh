- pgno: 84
  md: '八条设计黄金法则可以帮助设计师开发出可理解、可预测和可控的界面。许多原则被嵌入在用户界面指南文件中，比如苹果公司的文件规定“控制一切的是人，而不是应用程序……让应用程序接管一切的决策通常是错误的”，并强调“让用户对他们的工作进行完整、精细控制”。这些指南强调，人工控制所提供的建议与追求计算机自主性的建议截然不同。我认为，这八条黄金法则是通向大多数用户期望的起点：可靠、安全、可信赖的系统。


    基于八条黄金法则来构建 HCAI 模式语言的方法，目前还有很大的发展空间。模式语言已经被开发用于许多设计挑战，从架构到社交媒体系统，它是重要思想的简短表达，为常见的设计问题提出了解决方案，并提醒设计师，旨在激发其更严谨的思考。


    +   1. 先概览，放大并过滤，然后按需提供细节：第一个是熟悉的信息可视化口头禅，建议用户获得所有数据的概览，它可能是散点图、地理地图或网络图。概览显示了各个条目的范围和背景，并允许用户放大他们想要的内容，过滤掉不想要的内容，然后通过单击查看详细信息。


    +   2. 先预览，选择并启动，然后管理执行：对于时间序列或机器人操作，第二种模式是显示整个过程的预览；允许用户选择他们的计划，发起活动，然后进行执行管理。这就是导航工具和数码相机的成功之处。


    +   3. 通过交互式控制面板引导：用户能够通过交互式控制面板来控制过程或设备，如驾驶汽车、控制无人机或玩电子游戏。控制面板包括操纵杆、按钮或屏幕按件、滑块等其他控件，它们通常被放置在地图、房间或虚构空间中。增强现实和虚拟现实技术扩展了这种交互方式的可能性。


    +   4. 利用强大的传感器来捕获历史记录和审计跟踪：飞机的传感器记录了发动机温度、燃油流量等其他数值，并将它们保存在飞行数据记录仪上，飞行员也可以查看
    10 分钟前的情况。汽车和卡车记录的信息用于维护检查；'
  merge: -1
  img_proc: true
- pgno: 85
  md: '应用程序、网站、数据探索工具和机器学习模型也应采用这种方式，使用户更容易地查看历史记录。


    +   5. 在人与人之间的交流中成长：当用户可以更轻松地共享内容、寻求帮助和协同编辑文档时，应用程序就会得到改进。记住保险杠贴纸上的内容：人类在群体中；计算机在循环中（图
    2.1）。


    +   6. 对结果保持谨慎：当应用程序可能影响人们的生活、侵犯隐私、引发身体损害或造成伤害时，全面评估和持续监控就变得至关重要。来自独立个人或组织的监督有助于减少损失。谦虚是设计师应具备的良好品质。


    +   7. 防止对抗性攻击：故障不仅可能来自数据偏差和软件缺陷，也可能来自恶意行为者或破坏者的攻击，他们将技术用于有害目的或仅是为了破坏正常使用。


    +   8. 加速改进事件报告：对用户和利益相关者的反馈持开放态度，为设计师提供故障和未遂事件的信息，并持续改进技术产品和服务。


    本书第三部分和第四部分将继续讨论这些模式。本章的示例展示了成功的用户界面设计，这些设计给予了用户所需的控制权，并借助人工智能方法获益。


    总而言之，设计思维是一种强大方式，使人工智能算法作为 HCAI 系统的重要组成部分发挥作用，它可以放大、增强、赋权和提高人类表现。这些超级工具和有源设备的示例都是我们熟悉且易于理解的产品。它们传达了过去流行的八条黄金规则是如何应用的，同时展示了新的
    HCAI 系统模式语言如何在指导设计师方面具有同样的价值。


    在未来，用户（包括残障人士）将拥有超级工具和有源设备，使他们能够处理更多的日常琐事，探索创造的可能性，并帮助他人。他们将从增强现实和虚拟现实中受益，从而使得他们看得更清楚，做出更恰当的决定，'
