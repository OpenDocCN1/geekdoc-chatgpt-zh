  md: '人，培养了一些积极分子，民间科学让他们都参与到研究中来，并组织他们为水的清洁、空气的清洁、生物多样性和环境恢复而奋斗。因此，何种HCAI应用形式能够帮助他们找到合作者、组织游说活动以改变国家政策，并影响投资者支持那些商业模式保护环境的公司？


    # 阻止虚假信息传播


    使用社交媒体的风险之一是虚假信息的广泛传播及其关联问题，如阴谋论、仇恨言论和欺凌。减缓或阻止虚假信息传播的过程通常被称为内容审核，但这是一项艰巨的任务，因为每天都有数十亿条帖子。在新冠疫情期间，以假乱真的虚假信息和相关故事导致许多人抵制且不愿遵循科学指导，如保持社交距离、佩戴口罩、接种疫苗。虚假信息往往很吸引人，因此社交媒体用户的传播速度比政府卫生官员或新闻媒体的准确报道更迅速。新算法生成了“深度伪造”的图像、声音和视频，将知名人物插入抗议集会，制造虚假的声明，并通过庞大的“机器人农场”（bot
    farms）传播，令数百万台计算机发布和分享数十亿条信息。


    脸谱网、照片墙、油管、红迪网和推特等社交媒体平台都在努力识别并阻止虚假信息，但其努力可能会因为这样一个事实而放缓，即受益于虚假信息引起的参与度提升。脸谱网等其他平台使用的人工智能算法的特点是，获得大量点赞或分享的帖子，其传播速度更快。尽管批评人士游说社交媒体平台加大内容审核力度，但政府施加的压力一直不足。这些政策制定的挑战在于言论自由与维护平台安全的平衡。


    欧盟于 2018 年颁布的《反虚假信息的行为守则》将虚假信息定义为“可核实的虚假或误导性信息”，旨在获取经济利益、欺骗或“威胁民主政治和决策过程以及保护欧盟公民健康、环境或安全等公共利益”。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '脸谱网与独立的国际事实核查网络等其他组织合作，共同完成一项艰难的任务，即判断社交媒体的帖子是虚假信息还是仅仅是受保护的意见。阿隆·哈维（Alon Halevy）及其脸谱网团队描述了所面临的数十个问题，其中包括煽动暴力、虚假新闻、仇恨言论、性引诱、侵犯知识产权等。当危险的虚假信息被发布时，社交媒体平台会尽可能快地删除或压制以减少其传播，但当每天有数十亿条帖子发布时，任务就变得艰巨了。如果恶意行为者和一些政府积极传播虚假信息，并利用数万个虚假账户在几分钟内反复发布该虚假信息，这项任务就会变得更加艰难。


    哈维的团队写道：“让违规内容保留在网络上，可能会对个人和社会造成非常严重的后果。因此，宁可增加调用次数以确保机器学习的完整性，然后内容审查员再做出最终决定。”这种算法与人类决策相结合的方法非常契合
    HCAI 的本质。检测并删除这些虚假账户有助于减缓虚假信息的传播，但传播虚假信息的人力资源日益增长，阻碍了平台的进展。


    脸谱网成立了一个监督委员会，该委员会由 40 名享有声望的国际成员组成，帮助并指导公司做出艰难的决定，在言论自由与停止仇恨言论、欺凌、煽动暴力和有害的虚假信息之间取得平衡。虽然脸谱网向该委员会提供了资金和内容删除的权力，但怀疑者质疑其独立性，因为委员会成员是由脸谱网挑选的。


    据称，社交媒体上的虚假信息是剑桥分析公司（Cambridge Analytica）于 2016 年在印度、巴西、英国和美国干预选举的一部分。2018 年，脸谱网总裁马克·扎克伯格（Mark
    Zuckerberg）在美国国会作证时承诺，人工智能“将成为识别和根除大部分有害内容的可扩展方式”，但这些问题仍然存在。脸谱网每年两次的社区标准和执行报告描述了内容被删除、被事实核查或被压制的频率、申诉次数，以及申诉后内容恢复的次数。这一记录很有帮助，但脸谱网抵制压力，不愿意更积极地清除虚假信息和匿名机器人账户。'
