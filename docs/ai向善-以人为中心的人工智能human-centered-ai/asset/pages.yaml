  img_proc: true
- pgno: 80
  md: '看到室温和当前恒温器的设置，可以适当提高或降低设定温度。此外，他们还可以听到加热系统打开和关闭的声音或看到开关指示灯的状态，该反馈信息表明其操作已经产生了反应。这一设计的基本思想是让用户了解当前状态，并允许用户重新设定，然后给出信息反馈（第
    3 条黄金法则），表明机器正在根据用户意图进行调控。当用户看到温度计响应且温度上升时，系统可能会进一步反馈，指示设备何时实现了用户的预期目标。恒温器还有更多的好处——可以自动将室温保持在新设定的温度。总之，虽然一些恒温器可能缺少提供清晰反馈信息的必要功能，但设计良好的恒温器能让用户知道如何控制自动化机器以获得所需室温（图
    9.1）。更新的程序化恒温器，如谷歌的 Nest，可以通过机器学习更好地适应用户的计划，并节省能源。然而，人类的行为是可变的，这削弱了机器学习的效用，比如用户改变计划，发展出如烘焙等新的爱好或家中有不同需求的访客。因此，人机控制之间的平衡仍然是一个挑战。


