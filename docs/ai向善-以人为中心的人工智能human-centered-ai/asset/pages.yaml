  md: '主制度的破坏、种族偏见和资本主义的监视时，出现了更可怕的预测。微软公司的凯特·克劳福德（Kate Crawford）等批评者认为，人工智能的榨取本质威胁到了环境，助长了不健康的工作条件，并夺走了用户。


    这些都是值得充分关注的严重问题，但善意的研究人员、商界领袖、政府警察官员和公民社会组织的积极努力，表明有可能产生更积极的结果。新的跨领域交叉研究方法可能需要几十年的时间才能被广泛应用，但以人为中心的设计思维可以帮助构建成功的未来社会，在这个社会中，人权、正义和尊严的价值得到提升。本书致力于培养积极的心态和建设性的行动，以支持人类实现自我效能、创造力、责任感和社交关系。'
