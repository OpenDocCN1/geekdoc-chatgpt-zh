- pgno: 102
  md: '# 第 12 章


    # 科学与创新目标


    人工智能的研究人员和开发人员提出了多个目标，如斯图尔特·罗素和彼得·诺维格在他们的教科书中所提到的：“像人类一样思考，像人类一样行动，理性思考，理性行动。”
    另两位教科书作者大卫·普尔和艾伦·马克沃斯写道，科学目标是研究“智能行动的计算代理”。他们想要“了解使智能行为在自然或人工系统中成为可能的原理……通过设计、构建和实验计算系统，以完成通常被认为需要智能的任务”。


    另一些人则将人工智能视为一种增强人类能力或扩展创造力的工具。为了简单起见，我们将重点关注两个目标：科学和创新。当然，一些研究人员和开发人员可能会同时支持这两个目标，甚至还有介于两者之间的其他目标。明确界定科学和创新目标的目的是为了澄清它们之间的重要区别，但个人可能有更复杂的主张。


    # 科学目标


    科学目标的简化版本主要是理解人类的感知、认知和运动能力，以构建出能够像人类一样或超过人类执行任务的计算机。该目标涵盖了对社交机器人、常识推理、情感计算机、机器意识和人工通用智能（AGI）的追求。


    那些追求科学目标的人怀揣着宏伟的科学抱负，他们明白这可能需要 100 年或 1 000 年的时间，但他们倾向于相信，研究人员最终将能够理解人'
  merge: -1
  img_proc: true
- pgno: 103
  md: '类并准确地模拟人类。许多人工智能领域的研究人员认为，人类也是机器，或许是非常复杂的机器，但他们认为构建精确的人类模拟系统是一个现实且有价值的重大挑战。他们对人类例外论或人类与计算机划分为不同类别的说法持怀疑态度。《AI
    100 报告》（AI 100 Report）影响颇深，它指出，“算术计算器和人脑的区别不在于‘二者非同一种类’，而在于规模、速度、自主程度和普遍性”，它假设人类和计算机的思维属于同一类别。


    对于构建与人类能力相媲美的计算机的渴望是一个古老而深远的承诺。新西兰奥克兰大学的医学研究员伊丽莎白·布罗德本特（Elizabeth Broadbent）指出“与机器人的互动是我们揭示的关于自己的真相”。她指出：“人类具有基本的创造性趋向，而最终的创造是另一个人。”这句话可以被戏谑地解释为：典型的人类父母，但它也尖锐地提醒人们，一些人工智能研究人员的动机是创造一个人造人类。


    创造类人机器的欲望引起了科学目标群体对术语和隐喻的强烈关注。他们经常将计算机描述为智能机器、智能代理、知识丰富的效应器，并被计算机正在学习和需要训练的想法所吸引，就像人类孩子学习和接受训练一样。


    科学目标的研究人员经常进行人类和计算机之间的性能比较，例如肿瘤学家与人工智能程序在识别乳腺癌肿瘤方面的能力。新闻记者，特别是头条新闻撰写者，对这一竞赛理念非常感兴趣，这产生了一些精彩的报道，如“机器人的手如何演变到做人类可以做的事情”[《纽约时报》（New
    York Times），2018 年 7 月 30 日]、“机器人阅读能力比人类强，数百万人面临失业风险”[《新闻周刊》（Newsweek），2018 年
    1 月 15 日] 等。在《重启人工智能》（Rebooting AI）一书中，加里·马库斯（Gary Marcus）和欧内斯特·戴维斯（Ernest Davis）担心：“许多媒体倾向于过度报道技术结果导致公众开始更相信人工智能解决问题而不是相信实际情况。”'
  merge: -1
  img_proc: true
- pgno: 104
  md: '许多追求科学目标的研究人员和开发人员认为，机器人可以成为人类的队友、伙伴和合作者，计算机可以成为独立的自主系统、能够设定目标、自我引导和自我监控。他们认为“自动化”只是按照程序员或设计师的预期执行需求，而“自主”则是超越自动化的一步，研究人员可以基于新的传感器数据开发新的目标。科学目标的倡导者通过社交（类人或拟人）机器人来促进具身化的智能，这些机器人受生物启发（或仿生）以类似于人类的形态进行开发。


    一些研究人员、法律学者和伦理学家设想，在未来，计算机将与自然人和公司一样，承担相关责任且自身权利受到法律保护。他们相信，计算机和社交机器人作为具有道德和伦理行为能力的角色，并且这些品质可以被构建到算法中。这个备受争议的话题超出了本书的讨论范围内容，本书旨在指导短期研究和研发下一代技术的设计问题。


    # 创新目标


    创新目标，也有人称之为工程目标，驱使研究人员通过应用 HCAI 方法开发广泛使用的产品和服务。这一目标通常偏向于支持基于工具的隐喻、远程机器人、有源设备和控制中心。这些应用被描述为仪器、应用程序、设备、矫正器、假肢、用具或工具，但我将使用通用术语“超级工具”来描述这些应用。这些由人工智能引导的产品和服务被内置于云端、网站、笔记本电脑、移动设备、智能家居、柔性制造机器和虚拟助手中。一个遵循科学目标的机场助手可能是一个移动的类人机器人，它在入口处迎接旅客，引导他们办理登机手续并前往登机口。在一些机场场景中，机器人可以进行自然语言对话、为人类提供帮助并回答问题。相比之下，一个遵循创新目标的机场超级工具将是一款智能手机的应用程序，包含针对引导旅'
  merge: -1
  img_proc: true
- pgno: 105
  md: '客的定制地图、安检排队时间列表以及最新的航班信息。


    追求创新的研究人员和开发人员通过研究人类行为和社会动态来了解用户对产品和服务的接受程度。这这些研究人员通常热衷于满足人类的需求，因此他们经常与专业人士合作研究真实的问题，并为被广泛应用的创新而感到自豪。他们通常首先澄清任务是什么、用户是谁以及对社会、环境的影响。


    创新目标群体通常支持高度的人工控制和高度的计算机自动化，正如本书第二部分的二维框架所示。他们很清楚，有些创新需要快速的全自动操作（安全气囊展开、心脏起搏器等），而有些应用程序则需要完全的人工控制（骑自行车、弹钢琴等）。在这些极端情况之间存在着一个广阔的设计空间，可以将高度的人工控制和高度的自动化相结合。创新研究人员通常意识到过度自动化和过度人工控制的危险，这些危险在本书第二部分的理念框架中有所描述。这些
    HCAI 的研究人员和开发人员引入了防止人类错误的联锁装置和防止计算机故障的控制措施，同时努力寻找平衡点，以开发出可靠、安全和可信赖的系统。


    创新目标群体追求开发成功的商业产品和服务的欲望意味着，他们经常采用人机交互方法，如设计思维、用户观察、用户体验测试、市场研究和持续监测。他们认识到，用户通常更喜欢可理解、可预测和可控的设计，因为他们渴望提高自己的技能、自我效能以及具备创造性的控制能力。他们接受人类需要“在循环中”，尊重用户对可解释系统的需求，并认识到只有人类和组织才是能承担责任和义务的。他们支持审计追踪、产品日志或飞行数据记录器，以支持对故障和未遂事件的回溯性取证分析，从而提高可靠性和安全性，尤其是对于生命攸关的应用，如心脏起搏器、自动驾驶汽车和商业飞机。


    有时，追求创新的人从基于科学的想法开始，然后创造成功的产品和'
