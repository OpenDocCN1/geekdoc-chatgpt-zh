  md: '# 第 2 章


    # 理性主义与经验主义如何推动人工智能的发展？


    人工智能与 HCAI 之间的对比，延续了 2000 年前亚里士多德（Aristotle）基于逻辑分析的理性主义与列奥纳多·达·芬奇（Leonardo da
    Vinci）基于对世界的感官探索的经验主义之间的冲突。两者都是有价值的，都值得我们去了解。


    当人们使用艾罗伯特公司（iRobot）的 Roomba 机器人吸尘器时，差异就显而易见了。我很想购买这个设备，这种有源设备经过了 30 年的改进，已经卖出了
    3 000 万台。客户在线评价中有 70% 是积极的（“我喜欢它”“令人印象深刻”），只有少数人认为体验不佳（“绝对不喜欢这个产品”“要求退货”）。Roomba
    是一个很好的范本，但仍有改进的空间。其设计目标是让它能独立地给你的家或公寓房吸尘，它只有三个按钮和几个彩色灯。简单的“拥有者指南”（而不是“用户指南”）只有简短的几段文字介绍这三个按钮的使用方法以及指示灯的含义。


    简单来讲，多数用户都希望 Roomba 可以独立完成任务，所以精简的用户界面也许是一个不错的决定。改进后的设计可以赋予用户控制权，用户能知道吸尘器接下来会做什么并规定打扫房间的顺序。这款智能手机应用程序显示了
    Roomba 检测到的楼层地图，这一设计可以让用户更深入地了解吸尘器的动作，比如接下来去哪里，需要多长时间。Roomba 是由理性主义思维而非经验主义思维的人设计的，它可以独立完成任务，但无法带给用'
