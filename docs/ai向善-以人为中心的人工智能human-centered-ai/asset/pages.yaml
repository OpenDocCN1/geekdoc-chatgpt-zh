    荐是有帮助的。本章中的简单设计并不总是有效，但有越来越多的证据表明，如果做得好，有用户控件会比那些没有用户控件的系统更受欢迎，从而获得更多满意的用户和更成功的使用。


    由卡丽·卡拉哈里欧斯（Karrie Karahalios）领导的伊利诺伊大学研究小组对 75 名脸谱网用户进行了调研，并对 36 名参与者进行了可用性测试和访谈。其问题是用户是否了解他们脸谱网的新动态以及如何控制它。令人不安的结果是，用户基本上不知道这些控件的存在，并且大多数用户无法找到执行可用性测试任务所需的控件，当他们发现设置可用但很难找到时，有些人就会变得愤怒。该研究对此提出了一些改进建议，例如增加搜索功能和改进菜单设计。


    对控制面板持怀疑态度的人指出，很少有用户会学习使用现有的控制面板，但设计良好的控制面板，比如在汽车中调整汽车座椅、后视镜、照明、声音和温度，已经从竞争优势变成了必备功能。乔纳森·斯特雷'
