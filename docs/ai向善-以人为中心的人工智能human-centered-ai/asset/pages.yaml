- pgno: 255
  md: '# 客观测量


    许多研究人员想当然地认为，测量可以提供准确、客观的物理特性测量值，例如大小、持续时间、温度和重量。为了确保客观测量的结果，必须就测量规则达成一致。例如，患者是穿着衣服还是裸体进行称重，是在早餐前还是在日常用餐后进行称重？血压是站着、坐着还是躺着测量，测量前是否有
    2~10 分钟的安静时间？一些客观评估是一元的，如气体、液体或固体。其他测试则是二元的，如怀孕测试和新冠核酸检测，只能得出“是”或“否”两种答案，尽管可能会出现假阴性和假阳性。目前，科学尚未能够客观测量
    HCAI 属性。


    # 按组成部分评分


    在一些属性中，比如葡萄酒质量，人类评委的主观评分是关键因素。当比较两种葡萄酒以决定购买哪一瓶时，葡萄酒质量等指标的主观评分是非常有帮助的。虽然没有一种葡萄酒测量仪可以给出葡萄酒质量的具体数值，但也有一些评分系统，例如《葡萄酒观察家》（Wine
    Spectator）杂志使用的评分系统，分数范围从 50 到 100。在该评分系统中，90 分以上是“优秀：极具个性和风格的葡萄酒”，而 80 分以上则是“优良：一款酿造精良的葡萄酒”。这些分数来源于葡萄酒专家的主观判断，他们在不知道自己品尝的是哪种葡萄酒的情况下，一天内给
    20 种甚至更多的葡萄酒评分。这些评级对于营销有着重要的影响，但并不具备严格的科学性。


    还有其他葡萄酒评分系统，例如供日常饮酒者使用的评分系统，其中包括 5 种品质：外观、香气、酒体、口感和回味，每种品质都有 1 分到 5 分的评分，最终总分为
    25 分（图 25.1）。'
