  md: '人类主导的设计策略仍将是构建超级工具、远程机器人、有源设备和控制中心的关键，人们能够对更先进的自动化拥有更多控制权。


    自动化对人们工作与生活的干预是真实存在的，因此需要做出实质性的努力来改善工人福利和减少不平等。尽管有令人钦佩的企业领袖，但面对来自股东的压力和他们自己的野心时，他们也可能难以采取正确的方式来追求可靠、安全和值得信任的系统。在经济困难时期，当竞争对手威胁到他们的地位时，就会面临挑战。过去的历史表明，社会需要保护那些在教育、财富、权力和代表性方面水平较低的人。虽然记者、律师和公共利益团体可以提供一些反制力，但这也可能需要政府干预和监管。


    越来越多的人支持以人为中心的思想，但这种新的跨领域交叉研究方法是对现有实践方法的挑战。怀疑者表示，从以人工智能为中心的思维转变为新的 HCAI 方法，为以人为中心的思维赋予同等价值，这将不仅仅是一种边缘趋势。他们认为，未来的技术应是进一步研究高级算法，这些算法将拓宽机器学习的能力及其许多深度学习变体的能力。解决人工智能问题的解决方案是开发更多更好的人工智能。


