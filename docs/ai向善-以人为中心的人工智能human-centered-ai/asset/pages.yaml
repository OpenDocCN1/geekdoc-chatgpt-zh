  md: '# # 社交机器人的未来


    社交机器人在商业上的碰壁并没有阻止许多研究人员和企业家的步伐，他们仍然相信它们最终会成功。学术研究报告呈现出一种混合性的观点，开发人员的研究显示用户对社交机器人是满意的，有时甚至是非常愉悦的；而其他研究则显示用户更倾向于类似工具的设计，这些设计坚持让用户控制可理解、可预测和可控的界面的原则。一项针对
    1489 名参与者的学术调查研究了人们对自主机器人和人工智能的恐惧，这种被称为“机器人恐惧症”的恐惧对 20.1% 的参与者来说是次要问题，对 18.5%
    的参与者来说是严重问题。对机器人的担忧已经超过了“恐怖谷理论”，接近人类的设计受到了不信任。


    斯坦福大学心理学家克利福德·纳斯和他的学生，重点对人类与社交机器人互动的意愿进行了数十项研究，他们发现，人们能够快速响应社交机器人，接受它们作为互动中的有效伙伴。然而，核心问题仍然存在：人们是否会更有效地工作，并更喜欢超级工具或有源设备的设计？因此，通过可理解的用户界面进行人工控制就是一个非常关键的概念，它由银行机器、大多数移动设备、家用电器、办公技术和电子商务网站的开发人员提出。如前所述，苹果公司的《人机界面设计指南》提倡用户控制和灵活性。事实上，许多用户将有源设备视为社交机器人，这对我来说并不奇怪——我就是这么做的。然而，让我感到惊讶和不安的是，如此多的研究人员和设计师发现，打开从社交机器人到有源设备的想象力极其困难。


    历史的教训是显而易见的。早期的拟人化设计和社交机器人，已经被客户可控制的功能性银行机器所替代，该银行机器不存在类人的银行柜员机或屏幕显示人类出纳员的欺骗。这种欺骗行为导致银行客户怀疑银行是否还存在其他方面的欺骗，从而破坏了商业交易所需的信任。客户想要的'
  merge: -1
  img_proc: true
- pgno: 148
  md: '是快速、可靠地完成存款或取款。客户想要的是带有控制面板的有源设备，使他们能够可靠地、可预测地得到他们想要的东西。就连加州大学伯克利分校的斯图尔特·罗素等领先的人工智能研究人员也明确表示：“没有充分的理由让机器人拥有人形态……它们代表着一种不诚实形态。”


    这些历史先例可以为追求创新目标的当代设计师提供有用的指导，因为许多人仍然相信，基于科学目标的改进型社交机器人终会成功。老年人护理就是一个常见的应用领域，在家独立生活的用户需要一个类似人类的社交机器人，能够使用为人类设计的厨房工具、走廊和楼梯，执行诸如送药或送茶等任务。社交机器人的另一个应用领域是灾难救援，但在该领域，向远程机器人的转变已经带来了显著的成功。来自得州农工大学的罗宾·墨菲是研发、测试和部署救援机器人的领导者，他主张，灵活的机器人可以进入建筑物下或穿过通风管道，遥控无人机可以飞到危险的地方，为人类决策者提供视频信息。


    在科学目标的启发下，社交机器人倡导者仍然认为社交机器人是必需的，尤其是当它们被要求在为人类活动而建造的环境中工作时。然而，我相信，如果这些设计师的想象力更加开放，他们就会看到新的可能性，比如在餐桌上、餐桌下或餐桌附近内置一个小洗碗机，以帮助那些身体残障的人。如果设计师仍然想尝试社交机器人，他们最好了解过去已经做了什么，这样他们就可以在成功案例的基础上继续前进。


    一个很有意义的设想是，如果回到 1880 年，一些设计师可能会提出这样的洗衣服机器人：拿起一块肥皂和一块搓衣板，一次擦洗一件衣服，在水槽中冲洗，然后把衣服挂在晾衣绳上晾干。现代的洗衣机和烘干机已经远远超出了社交机器人的范围，设计师成功地制造出了能大约一个小时内洗掉一周的衣服并烘干的有源设备。同样，亚马逊订单履行中心有许多用于搬运产品和包装箱子的机器人，但它们都不像人类。'
