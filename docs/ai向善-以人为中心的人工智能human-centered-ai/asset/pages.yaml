  md: '更具挑战性的设计是一种药物设备，该设备通过扫描处方药瓶进行编码，当老年人在逾期未服药时，可根据其喜好设置温和的提示或更强烈的提醒。自动配药器必须足够复杂，以保证能够在一天的不同时间提供多种药片，同时记录其合规性。应对每项设计进行审查，以确保老年人可以自由地控制该设备，并保护他们的隐私。监控设备可以防止危险并跟踪性能。另一个考虑因素是安全性，以防止犯罪、入侵和欺骗。


    如下三个更详细的示例表明了其他的设计可能性


    示例 1：轮椅 HCAI 框架（详见第 8 章）展示了人工控制和计算机自动化如何引导设计师考虑替代方案以满足轮椅移动性等需求。较老旧的轮椅是重型推椅，需要护理人员移动坐着的使用者（图
    26.1，左下象限）。更新、更轻便的轮椅则是手动操纵的，并实现了轮椅的独立控制和锻炼功能，这催生了轮椅篮球比赛（图 26.1，左上象限）。电动轮椅可以使用操纵杆或语音控制，并可实现更高程度的自动化，即自动选择目的地和路径，并按时间计划（图
    26.1，右下象限）将轮椅使用者带到用餐地点或家中的其他地方。现如今，轮椅经常在户外使用，自动导航系统可以引导轮椅自动通过人行道和坡道、穿越街区。公交车、火车等公共交通工具也为轮椅使用者提供升降板，可实现长途旅行。电动轮椅也许能同时实现高度人工控制和高度自动化（图
    26.1，右上象限），即使用人工智能算法来避开障碍、人群和悬崖，并可以沿着使用者偏好的路径到达的目的地。此外，语音控制的轮椅可供有需要的人使用。为了帮助电动轮椅的使用者进行导航并避免碰撞，构建了一套带有语音引导的计算机视觉系统。基于对
    6 名有认知障碍的老年人用户的研究表明，在大型室内迷宫测试中，轮椅使用者的运动更准确，且碰撞更少。老年人和残障人士发现，最新版本的系统能帮助轮椅通过狭窄的门口或电梯，后退到他们想要停留的位置或拥挤的地区，以及乘坐公共交通工具。'
