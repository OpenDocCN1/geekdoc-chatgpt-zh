  md: "# 第 1 章\n\n# 对人工智能的高期望\n\n> 分析机并没有自测创造任何东西，但可以完成我们命令它的任何事情。\n> \n> 阿达 · 洛夫莱斯（Ada\
    \ Lovelace, 1843）\n\n本书提出了一种新的跨领域交叉研究方法，将人工智能、算法与人类的创造性思维相结合，打造出“以人为中心的人工智能”。该方法旨在赋能技术，并非完全代替人类。之前，研究人员和开发人员专注于搭建人工智能算法和系统，强调机器的自主性并测量算法的性能。如今，新的跨领域交叉研究方法通过提升用户体验、设计的价值感，以及观测人类的表现等手段，引起了人类用户和其他利益相关者同等的关注。HCAI\
    \ 系统的研究人员和开发人员重视有价值的人类控制，坚持以人为本、服务于人的价值观，如人权、正义和尊严，来实现自我效能、创造力、责任感、社交等目标。\n\n\
    这种新的跨领域交叉研究方法反映了一种日益普遍的转变，即从以技术为中心的思维拓展到以人为中心的愿望，并强调社会效益。自 2017 年发布《蒙特利尔宣言》（Montreal\
    \ Declaration for Responsible Development of AI）以来，人们对 HCAI 的兴趣日益浓厚。该宣言呼吁人们致力于人类福祉、自主权和隐私权，并创造一个公正、平等的社会。以人为中心也是各种基金会的目标之一，这些组织寻求采用人工智能方法，如机器学习，来解决社"
  merge: -1
