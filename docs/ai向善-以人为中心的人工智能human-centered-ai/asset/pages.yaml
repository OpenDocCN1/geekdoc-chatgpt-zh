- pgno: 166
  md: '+   ③聚类：将实例划分为均质区域，例如模式识别、市场图像分割。

    +   ④降维：降低训练复杂度，例如数据集表示、数据预处理。

    +   ⑤控制：控制行动，使奖励最大化，例如玩游戏。


    所有这些任务的工作流程都需要用户需求收集、数据收集、清洗和标记，并使用可视化和数据分析来理解异常分布、集群和缺少数据。模型训练和评估应成为一个多步骤的过程，从早期的内部测试开始，一直到部署和维护。工程师需要对部署的系统进行持续监控，以响应不断变化的使用环境和新的训练数据。


    HCAI 系统的软件工程工作流程对人工智能设计方法进行扩展，将用户体验设计囊括其中，以确保用户了解决策是如何做出的，并在对决策有质疑时可以寻求帮助。领先的企业和研究人员正在优化传统的用户体验测试和指导开发人机交互方法，以满足
    HCAI 的需求。


    来自弗吉尼亚联邦大学的团队提出了一种以人为中心的人工智能系统生命周期，旨在通过强调公正、交互式可视化用户界面以及谨慎的数据管理来保护隐私，从而提供可信赖的人工智能服务。他们提出的关于衡量可信度定量和定性评估的难题，我们将在第
    25 章中再次讨论。


    软件工程的工作流程是从瀑布模型移植过来的，瀑布模型假设存在一个有序的线性生命周期，从需求收集开始，然后到设计、实现、测试、文档编制和部署。在需求被很好地理解时，瀑布模型可能是合适的，且易于管理，但是当交付的软件系统被用户拒收时，可能会导致大量的错误。拒收的原因可能是一年前项目开始时收集的需求不够或者是开发人员未能与用户一起测试原型。


    新的工作流程基于精益模型和敏捷模型，并带有敏捷开发等变体，团队会在整个生命周期中与客户合作，了解用户需求（即使发生变化），迭代'
