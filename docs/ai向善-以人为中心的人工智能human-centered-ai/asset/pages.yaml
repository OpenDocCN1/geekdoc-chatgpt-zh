  md: '的灵感可以被其他构想所释放。更雄心勃勃的目标会带来更有价值的创新，如万维网、信息可视化、辅助技术、维基百科、增强现实。这些创新扩展了人类的能力，使更多人更具创造力。


    我的另一个核心目标是支持人与人之间的交流和合作，这已经催生了电子邮件、短信、视频会议、共享文档、社交媒体等方面的成功案例。可以通过网络访问的视频、音乐和游戏也获得了巨大的成功。人们在社交平台与朋友分享自己喜欢的内容、与大众进行交流、向广阔的市场推广业务等行为也十分活跃。但这些成功案例也有不足之处，如缺乏面对面接触、允许恶意骗局以及允许恶意行为者实施犯罪、散布仇恨或招募恐怖分子。用户应该具备更多的控制权，限制其从自主匿名机器人收到的信息类型，就像人们可以限制别人进入他们家一样。目前，社交媒体平台尚未赋予用户足够的控制权，用户应当管理自己的查看内容，从而限制机器控制权的滥用。


    另一个问题是：制造外观和行为都像人一样的机器人有什么价值？有关这方面，我将在第三部分中展开叙述，一大群人相信类人机器人（也被称为拟人化机器人、人形机器人）是未来的发展方向。这个群体想要制造出一种在人类世界自由走动的社交机器人，它们有人脸、手臂、腿，且具备语言功能，可以用作老年看护机器人或灾难响应机器人。这一观念导致了长期以来一系列的失败。该观念的拥护者说，这一次与以往不同，计算机越来越强大，设计师的知识也越来越渊博。


    对于用户界面设计，人与人之间的交流和关系只是其中的一种模式，而这种模式有时还会产生误导。改进的交互界面将使更多人能够更快、更有效地执行更多的任务。虽然声音是人与人之间交流的有效方式，但为了保证用户能够更快速地操作计算机，交互的视觉设计将是主要策略。尽管语音交流短暂而缓慢的特性限制了它的用途，但
    Alexa（亚马逊公司的智能'
  merge: -1
  img_proc: true
- pgno: 36
  md: '语音服务）和 Siri（苹果公司的智能语音助手）等语音交互仍发挥着重要的作用，尤其是在双手被占用但又需要使用语音服务的时候（详见第 16 章）。此外，人类生成的语音指令需要大量的认知努力和工作记忆资源，从而限制了其与手势和控制并行的可能性。


    交互界面的设计应该是一致的、可预测的、可控的，如此，人类的掌控感、满足感和责任感才能得以实现。这将比那些具有适应性、自主性和拟人化的交互得到更广泛的应用。


    增强人类的能力是一个有价值的目标。望远镜和显微镜是人眼的延伸，放大了人类的能力。计算器、数字图书馆和电子邮件能够帮助人类做一些无法独立完成的事情。我们需要更强大的工具来增强人们的能力。一种方法是开发创意辅助工具，为艺术家、音乐家、诗人、剧作家、摄影师和视频摄影师提供更大的灵活性，探索替代方案，并创造性地创作出一些新颖、有趣和有意义的东西。相机和乐器已经扩展了人类的可能性，但人类仍然是驱动创造力的源泉，新的设备将会延续这一传统。


    然而，一些研究人员声称，人工智能技术不仅仅是赋予人们权力，这些新技术本身就是创造者。这种说法可以追溯到早期的计算机艺术，从 1968 年贾西亚·雷查特（Jasia
    Reichardt）在伦敦策划“控制论艺术的意外发现”（Cybernetic Serendipity）的展览开始。在那之后不久，哈罗德·科恩（Harold
    Cohen）开始致力于一个被他称为 AARON 的程序，该程序生成了植物、人以及更抽象的图像，并得到了广泛赞赏，因为它们看起来像人类创作的水彩画。然而，科恩显然是创造者，因此在
    2014 年他获得了由最大的计算机图形专业协会国际图形图像协会颁发的数字艺术终身成就奖。


    其他形式的计算机生成艺术通常带有算法生成特征，包含更多的几何图案，并为其艺术作品超出艺术家想象力的说法提供了有力的证据。保罗·布朗（Paul Brown）和欧内斯特·埃德蒙兹（Ernest
    Edmonds）等主要'
