    对于老年人来说，除了将要执行或已经完成的日常任务外，还需要制订长期计划，包括准备财务规划、遗嘱等，以及履行投票和纳税等公民责任。体检和实验室检测等医疗服务可能会占用老年人的大部分时间，尤其是患有慢性疾病或抑郁、受伤的老年人。老年人的首要需求是医疗保健，因为它决定了他们的生活质量甚至生存，即便是政府保健计划的相关工作也需要时间和技巧。老年人的另一项主要需求是住房，许多住房需要再设计或重新设计住房和公寓以满足老年人的需求，如单层设计（无台阶）、浴室改造、无设施障碍等适当设计。此外，老年人也需要度假旅行、探望家人和朋友。'
