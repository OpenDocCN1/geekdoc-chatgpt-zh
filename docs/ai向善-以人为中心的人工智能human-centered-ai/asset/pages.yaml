- pgno: 77
  md: '# 第 9 章


    # 设计指南和示例


    HCAI 的这一新目标打破了 50 年来寻求人工智能与寻求智能增强的人之间的争论，这一争论由《纽约时报》科技作家约翰·马尔科夫（John Markoff）清晰描述。现在看来，就应该寻求人工智能还是智能增强进行争论似乎完全没有必要，设计师可以将人工智能算法转换与界面设计相结合，形成
    HCAI，从而放大、增强、赋权并提升人类表现。


    谷歌最新版本的设计指导书强调了选择的必要性：“一个重要的考虑因素是，应该使用人工智能来自动执行一项任务，或者增强人类完成这项任务的能力……对于人工智能驱动的产品，自动化和用户控制之间存在一个重要的平衡。”
    谷歌设计指导书的作者称：“如果做对了，自动化的人工智能和被增强后的人类一起工作，简化并改进长期复杂过程的结果。” 指导书对这一可能性持开放态度。这是正确的——两者可以齐头并进！


    谷歌网站针对负责任的人工智能提出了与我的原则完全一致的指导方针。


    +   - 使用以人为中心的设计方法

    +   - 确定多个指标来评估培训和监控

    +   - 直接检查原始数据（如果可以）

    +   - 了解数据集和模型的局限性

    +   - 反复测试

    +   - 部署后继续监控和改进系统'
  merge: -1
  img_proc: true
- pgno: 78
  md: '微软研究负责人埃里克·霍维茨（Eric Horvitz）等人撰写的其他早期指南，为微软的《人工智能交互设计指南》（Guidelines for AI-Human
    Interaction）奠定了基础。这 18 条指导方针以直观的图形呈现，并以纸牌的形式分发，其涵盖了初始使用、正常使用、应对问题以及随着时间的推移而发生的变化。这些指导方针正确地强调了用户的理解和控制，同时也指导系统寻找“明确系统为什么会这样做”和“从用户行为中学习”的方法。


    国际商业机器公司（IBM）的人工智能设计网站就这些问题展开了更广泛的讨论，并提供了一个高级教程，该教程涵盖了设计基础、技术基础，并充分考虑了伦理问题、问责机制、可解释性和公平性。然而我公开质疑它提出的建议：一个系统应“尊重用户本身”并“形成完整的情感纽带”。表述可能有所改变，但仍具有鼓励用户“与系统建立情感纽带”的含义，这一点值得商榷。


    米卡·安德斯雷（Mica Endsley）的“人类自主系统设计指南”提出 20 个有深度的项目，涵盖了人类对自主系统的理解、复杂问题的最小化和态势感知的支持。她的指南包括：“在执行日常任务时使用自动化辅助，而非更高层次的认知功能”和“提供自动化透明度”，并对上述每条指南都进行了详细解释。


    一个成功的设计是可理解的、可预测的、可控的，能够实现用户的自我效能，并形成可靠、安全、可信赖的系统。成功的系统需要对交互界面的精细结构进行详细设计，这些结构来源于已验证的理论、明确的原则以及可操作的指南。相比之下，当这些知识被嵌入有利于人工控制的编程工具中时，就更容易被应用。我尝试性地提出了一套简练的用户界面设计八条黄金法则（表
    9.1），并在《用户界面设计》（Designing the User Interface）一书的后续版本中不断更新。这八条黄金法则对 HCAI 系统仍然有效。'
  merge: -1
