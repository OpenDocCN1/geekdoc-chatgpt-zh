  md: '级别，以及从详细解释到最少解释（只有姿势名称）的语音教学等级。用户还可以根据自己的带宽选择合适的图像分辨率，从高清晰度到低清晰度到纯音频。该应用程序有针对初学者的指导，并提供
    10 种语言的版本选择以及一系列的社区功能。


    每天都有一个稍微不同的版本更新。语音叙述精确、迷人、富有诗意（“像风车般转动你的手臂”“绽放成战士式”），并提供各种姿势变化的建议，让用户自主选择更容易或更难的姿势。动作序列遵循一致的路径，从轻松的坐姿或躺姿，然后是更具挑战性的弓箭步，再到站立姿势、平衡、扭转和地面姿势，以便始终对脚踝、膝盖、臀部、肩膀和手腕进行一套全面的伸展运动。约束求解算法总是保证运动时长与用户选择的精确分钟数一致。


    从我个人使用“下犬瑜伽”的经验来看，我很欣赏其价值。4 年多来，我和妻子几乎每天早上都会做 30 分钟的瑜伽，不断变化的课程和选择能够让我们持续参与其中。锻炼者肌肉力量和运动范围（柔韧性）的改善是显而易见的，其对情绪、压力、睡眠和整体健康都有好处。有些姿势一开始对我们来说太难了，但现在我们经常做。更先进的
    HCAI 想法将包括一些社交功能，即允许与他人分享，或将用户与行为相似、居住在附近或分享某些历史记录的人相匹配。另一个有用的功能是，在每次运动结束时，计算机视觉算法会对风格进行评估，并给出个性化的反馈，指导用户哪些提升会对他有帮助，或者用户是否具备提升到更高等级的能力。


    对于那些建立个人健康记录（有时被称为量化自我）的人来说，每次锻炼的记录可以与其他数据列在一起，例如步数、睡眠、体重、心率和血压，以跟踪健康状况的变化。私人教练还会通过测量肌肉力量和运动范围以跟踪锻炼进度，计算机视觉算法和传感器可以提供其中的部分数据。


