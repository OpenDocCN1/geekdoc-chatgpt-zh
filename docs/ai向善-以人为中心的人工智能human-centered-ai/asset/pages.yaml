  md: '负责任的行业领袖一再表示，他们希望以安全有效的方式进行研究和使用 HCAI。微软总裁萨提亚·纳德拉（Satya Nadella）提出了负责任地使用先进技术的六项原则。他写道，人工智能系统必须：


    +   - 协助人类并保护人类工作者。

    +   - 保持透明……道德与设计是相辅相成的。

    +   - 在不损害人类尊严的前提下最大限度地提高效率。

    +   - 智能隐私的设计。

    +   - 建立算法问责机制，以便人类消除意外伤害。

    +   - 避免偏见……因此，错误的启发式算法就不能用于不公正对待。


    同样，谷歌总裁桑达尔·皮查伊（Sundar Pichai）也提出了人工智能应用的七个目标，这些目标也成了整个公司的核心理念：


    +   - 对社会有益。

    +   - 避免制造或强化不公正的偏见。

    +   - 进行安全制造和测试。

    +   - 对他人负责。

    +   - 符合隐私设计原则。

    +   - 坚持科学卓越的高标准。

    +   - 可用于符合这些原则的用途。


    怀疑者会认为，这些声明是企业自私自利的洗白，旨在引起公众的积极反应。然而，这些企业也会为此做出积极努力，如谷歌的内部审查和算法审计框架（参见第 20 章“内部审查委员会的问题和未来计划”部分），'
