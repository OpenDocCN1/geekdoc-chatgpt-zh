  md: '另一起过度自动化的悲剧案例是 2018 年 10 月和 2019 年 3 月发生的两起波音 737 MAX 坠机事件，事故共造成 346 人死亡。虽然导致坠机事件的原因很多，但我关注的是飞机的自动控制系统，该系统由于传感器故障而失效，并导致飞机的机头朝下。在飞机坠毁前的几分钟里，飞行员曾
    20 多次试图把飞机拉起，但并未成功。该自主控制系统的开发人员认为，该系统非常可靠，甚至在训练或用户手册中都不告知飞行员它的存在，因此飞行员也不知道如何恢复对飞机的控制。


    自主系统和人类都有可能出现故障，因此如何从故障中恢复（如电力、通信、移动或传感器的故障）应成为首要关注点。在高速公路成为像电梯井一样的受控空间之前，道路养护人员可能需要处理道路上倒下的树木、妨碍交通的施工人员或在传感器上喷漆的破坏者。


    得克萨斯农工大学教授罗宾·墨菲（Robin Murphy）提出的自主机器人定律反映了自主性所带来的问题：“部署任何机器人系统都将达不到预期的自主性水平，人类问题协调机制的不足也会就此产生或加剧。”


    人工控制的批评者提出了两个强烈的主张。第一个主张是，人类会犯错，自动化系统可以防止此类错误的发生，且坚持不懈、始终如一。这种观点是具有价值的，因此设计师在设计中加入了安全保障功能，无论是安全剃须刀还是核反应堆控制棒。对错误的了解以及如何避免错误的发生还有待研究，以设计出适当的功能。由于总是会出现意料之外的人为错误、使用环境不断变化和对抗性攻击等因素，设计师需要在产品或服务的整个生命周期中都持续保持设计的警惕性。第二个主张是，即使包含控件，也只有少数用户会学习如何使用它们。许多用户对某些控件没什么兴趣，因为很多控件设计不佳，难以使用。但当控制装置设计良好时，它就会被广泛应用，比如汽车座椅、驱动轮位置、后视镜和侧视镜的调整。车内的环境控件也是必要的，如照明设置、收音机音量、开窗位置、加热、通风或'
