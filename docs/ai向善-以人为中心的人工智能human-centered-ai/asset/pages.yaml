- pgno: 259
  md: '关于 REF 存在两个有争议的方面：研究评估应该更加注重学术成果还是社会影响；专家小组在多大程度上代表了各类大学。虽然该框架的一个重要目标是鼓励学者进行自我反思，以改善未来的研究，但其评估结果被报社和其他组织用来对大学进行排名。


    另一个灵感来源可能来自河流或森林的环境报告，其中描述了水、土壤或空气质量等组成部分，以及最近的恢复工作等活动。这些报告可以由内部机构或外部专家小组编制。这些评估报告可以与往年进行比较，强调创新工作，并提醒人们注意新出现的威胁。评估报告通常给出从
    F（不及格）到 A（优秀）的等级，以表彰成功的工作或强调还需更大努力的方面。


    与专家小组不同，世界大型企业联合会每月对 5 000 人进行一次消费者信心调查。密歇根大学的“消费者信心指数”每月也进行类似的月度消费者信心指数调查。该指数在
    1966 年 12 月被标准化为 100。每个月至少进行 500 个电话采访，向美国各地的随机样本提出 50 个核心问题。


    独立监督是评估重要商业、学术和政府系统的重要社会过程之一（第 19 章）。独立性意味着审查员不受过去历史或当前与系统开发者的关系的关系影响，具有公正和客观性。公司通常需要接受内部委员会和外部审计机构的年度审计，外部审计机构通常是由知名会计师事务所，如普华永道、毕马威、安永和德勤。这些事务所以及许多小型公司被禁止同时担任独立审计员和任公司的顾问。当然，独立监督并不完美，正如安然公司和其他破产案例那样。保险公司、消费者团体、记者和非政府组织也可以进行独立监督。


    如第 19 章所述，有三种常见的独立监督形式：


    +   1.规划监督：提前提交并审核新系统或系统重大升级的提案，以便反馈和讨论可能会影响计划的内容。


    +   2.持续监控：这是一种高成本的方法，但是通过持续或定期审查，可以确保即使环境发生变化，也会进行审查以确保质量。'
