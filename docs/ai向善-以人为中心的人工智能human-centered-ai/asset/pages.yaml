  md: '# 附录 A


    # 致力于 HCAI 的非政府组织和公民社会组织


    此类别下有数百个组织，因此，如下仅简短地罗列一些典型组织。


    美国保险商实验室（Underwriters Laboratories），该实验室成立于 1894 年，一直通过“增强信任”来“为一个更安全的世界而努力”，他们从测试和认证电子设备开始，到在全球范围内评估和制定自愿性行业标准。该实验室庞大的国际网络已经成功地开发出了更好的产品和服务，因此其解决
    HCAI 问题似乎是自然而然的。


    布鲁金斯学会（Brookings Institution），该学会成立于 1916 年，是位于华盛顿特区的非营利公共政策组织，是人工智能和能源技术倡议的发源地。该学会通过出版报告和书籍，召集政策制定者和研究人员参加会议，关注管理问题，并“寻求弥合行业、公民社会和政策制定者之间日益扩大的鸿沟”。


    电子隐私信息中心（EPIC），该中心成立于 1994 年，是位于美国华盛顿特区的公共利益研究机构，致力于“公众关注新出现的隐私和公民自由问题，并在信息时代保护隐私、言论自由和民主价值观”。该中心举办会议、提供公共教育、提交法庭之友简报、从事诉讼以及在国会和政府组织面前作证。其最近工作强调了监控和算法的透明度等人工智能问题。


    算法正义联盟（Algorithmic Justice League），该联盟源自埃默里大学，旨在引领“一场迈向公正、负责任人工智能的文化运动”。该联盟结合了“艺术和研究，以阐明人工智能的社会影响和危害”。在大型基金会和个人'
  merge: -1
  img_proc: true
- pgno: 282
  md: '的资助下，联盟在证明偏见方面做出了有影响力的贡献，尤其是人脸识别系统。其工作卓有成效地改进了领先企业系统的算法和训练数据。


    当代人工智能研究所（AI Now Institute），该研究所位于纽约大学，是一个跨学科的研究中心，致力于研究人工智能的社会影响。该机构强调四个核心领域：权利与自由、劳动与自动化、偏见与包容、安全与关键基础设施。研究所设有研究会、座谈会和研讨会，以教育和检测人工智能的社会影响。


    数据与社会（Data and Society），是一家总部位于纽约的独立非营利组织，旨在研究以数据为中心的技术和自动化的社会影响……该组织对人工智能和自动化、技术对劳动和健康的影响、线上虚假信息等主题进行了原创研究。


    负责任机器人基金会（Foundation for Responsible Robotics），是一家总部位于荷兰的组织，其口号是“对机器人背后人类负责的创新”，其使命是“塑造负责任的（基于人工智能的）机器人设计、开发、使用、监管和实施的未来”，并通过组织和举办活动、发布咨询文件以及建立公私合作来达成。


    AI4ALL，是一家总部位于美国加利福尼亚州奥克兰市的非营利组织，其致力于“让未来的多元化背景、视角和声音释放人工智能造福人类的潜力”。该组织赞助了一些教育项目，例如在美国和加拿大为不同的高中生和大学生（尤其是女性和少数族裔）举办的暑期学院，以促进人工智能造福社会。


    ForHumanity，是一家公共的慈善机构，负责调查和分析与人工智能和自动化相关的负面风险，例如“对就业、社会、公民权利和自由的影响”。该机构认为，在企业和公共政策层面对人工智能系统进行独立审计，同时涵盖信任、道德、偏见、隐私和网络安全方面，是建立可信任基础设施的关键途径。该机构还认为，“如果我们让安全和负责任的人工智能和自'
