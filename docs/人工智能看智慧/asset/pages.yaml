  md: '自然进化呈现的是物种的多样性，生物在与自然环境的具身交互中缓慢进化，以万年、甚至十万年、百万年计，适者生存的进化法则[1]并没有过分关照人类，鱼鹰捕鱼、蜜蜂筑巢、蚁群挖穴、蜘蛛织网、老虎抓捕、黑猩猩使用工具等智慧行为令人惊叹。相较于其他生物，人类的视觉局限于可见光，听力无法感知超声波，然而，宠物能辨认主人的面孔，这通常超过主人对它们的辨识水平。那么，人类进化的独特之处何在？如果将地球的年龄缩短成一年，仅在最后一天才有了古猿人，现代人类仅在最后一天的最后半小时才出现[2]，只在最后一天的最后一分钟人类才发明文字、发明教育、形成文明，只在最后一天的最后一秒才发明机器智能。人类是怎么在这么短的一个时期内在自然界就站到了全球生物链的霸主地位了呢[3]？如何让智能从生命和智慧中剥离出来，成为机器智能，以更广泛、更迅速地延伸和拓展人类的体能和智能，使得人类更加智慧、更加尊严、更加优雅地生活？要回答这些问题，首先要去探索聪慧的先天遗传性和智能的后天获得性，回答人类智慧和人工智能的区别，这里涉及到对碳基生命的智慧和硅基机器的智能的理解，涉及到生命的物质维度和精神维度两个方面。


    # # 一、碳基生命中智慧的物质维度和精神维度


    按照自然进化的法则，人类这个物种长期繁衍进化的结果，应该说不是靠某一代人主观努力就能够改变的，也很难决定自身的进化方向[4]，包括生命中的智慧和智能在内。在社会科学和人文领域，人们常常讨论的是人的智慧，智慧固然包含智能，但智慧更强调聪慧机灵、生机活力和灵感气质。而在物质科学和生命科学里，讨论的是人的智能和人工智能，指的是学习的能力，以及解释、解决现实问题的能力。在生命科学和医学的教科书里，“人”更多地被视为“人体”这个物质的维度[5]，可被还原为碳水化合物、蛋白质、矿物质和水的存在，常称为碳基生命。


    # ## 1. 生命中智慧的物质维度 —— 硬构体


    从生物学角度看，细胞形成组织，组织构成器官，器官形成系统[6]。这些都可统称为硬构体。总之，人体被划分成不同的系统，随着医学的发'
