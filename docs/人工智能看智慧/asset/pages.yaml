  md: '# 争 鸣


    # 人工智能看智慧


    李德毅¹ 刘玉超² 任 璐³


    (¹ 中国人民解放军军事科学院; ² 中国指挥与控制学会; ³ 北京航空航天大学)


    摘要：通常，智慧是社会科学和人文领域讨论的内容，智能是物质科学和生命科学讨论的内容。显然，智能并不是人的精神世界的全部，人更有智慧。智慧和人的自我意识、群体意识有着更紧密的联系。智慧也需要物质作为载体，但不以控物为目的。智能则不然，智能以控物和改变物质世界为目的。智能机器仅仅是人类认知的工具，不必像人那样具有精神世界，不具有意识欲望、爱恨情仇，也没有伦理道德和信仰。智能脱离了人的意识、欲望、情感和信仰，拓展到体外存在，成为人工智能，成为人造工具和机器，长于思维，长于控物，长于具体行为，长于一以贯之的工具性。自操控的认知机器服从人赋予它的使命，以提高人类社会的生产能力，发展经济，这才是人类最需要的，也正是人类的智慧所在。机器无需达到、也不可能达到人之为人的那部分智慧。


    关键词：意识，精神，软构体，机器认知，想象力，具身智能


    中图分类号：TP18 文献标识码：A DOI:10.19524/j.cnki.10-1009/g3.2023.04.131


    作者简介：李德毅，中国人民解放军军事科学院研究员，中国工程院院士，国际欧亚科学院院士。研究方向为不确定性人工智能、数据挖掘、无人驾驶。刘玉超，中国指挥与控制学会研究员。研究方向为人工智能、指挥控制。任璐，北京航空航天大学计算机学院博士研究生。研究方向为无人驾驶、深度学习。


