  md: '识。人类生活中不乏有意识和智能分离的案例，一个受精的鸡蛋是有生命的，但没有意识；被深度麻醉的人生命在，但意识不在；深度梦游者到河里挑水把家里的水缸装满了，睡梦里证明了一道数学题，酗酒司机从很远的地方违法把车开回家，可能是有智能无意识；图书馆里收藏的博士生们的学位论文和许多专著，如果只读正文，全是科学和技术，全是专业知识，很难看出作者的意识、情感和性格，等等。这些都说明人的智能，包括语言智能在内，是可以和意识分离的。


    我们的认知过程和理性思维，有时也会被意识、情绪、欲望和习性所扭曲，意识并不总是有助于人类的认知，并不总是有助于发展人类智能。汽车被认为是“人类的第一杀手”，更多的原因是驾驶员的疲劳驾驶，或者情绪失控，或者注意力不集中，等等，这些恰恰是意识或者情绪惹的祸，机器驾驶脑[30]没有意识倒是件好事情，可以不知疲倦地、集中注意力工作。当然，拥有智能的机器，有思维的力量，但缺少智慧的温度，缺少情商，不算计人类，也缺少人格的力量，犹如一把锋利的刀，有时也会让使用它的人手上流血，技术从来就是双刃剑。


    人工智能本质上是把人类生命中的智能拓展到体外，用非生命科学——认知物理学的方法，映射到机器之中，机器仅仅是物理工具，不是由细胞、器官构成的生命，机器没有意识、情感、性格等生命体具备的特质，是人赋予了机器以意图，人要为机器的行为负责。人格化的机器人，只是满足人类自身提高亲和力的需要，这和要求雕塑活过来是相同的期望，要谨防落入机器人格化的主观陷阱，无需过度想象。机器人依然是机器，即使那种复杂智能的机器人也不例外。在科学尚未能解释无机物如何自然演化为生命之前，将硅基机器人赋予人格、拟人化的设想，似乎是一种过于生硬的尝试。试图赋予机器人意识、感情、个性、信仰、生命和道德需求，或者探讨其是否会撒谎、是否会陷入困惑，以及是否理解爱情和浪漫，只能是我们人类的自寻烦恼，自作多情而已。


    图灵在《计算机械和智能》[27]一文中说：“我既不贬低不能在选美竞赛中有出色表现的机器，也不贬低同飞机赛跑失败的人”，我们也可以理解为：既不贬低没有意识和情感的机器，也不贬低暴力思维和具身行为智能不如机器的人。对作为工具的智能机器而言，无需回答“我是谁？我从哪里来？我要到哪里去？”之类的生物学的意识问题。所以，不宜把智慧'
  merge: -1
  img_proc: true
- pgno: 15
  md: '和智能混在一起谈，更不宜把生物的意识和人工的智能混在一起谈，免得耽误了我们研发新一代的认知机器，去替代全社会各种各样的人力劳动岗位。


    人类正是因为有了各种各样的工具、动力机器和智能机器，获得了对物质世界的充分支配权。恐龙曾经作为一个物种生活在距今大约 2.5 亿年前，在地球上保持霸主地位大概
    1.6 亿年之久[31]。相形之下，人类的文明史则只有一万余年，对人类飞速崛起成为地球霸主的这一万多年，我们不能不想到，人类的确不是靠体能而是靠智能获得对物的支配地位的，但这种暴起是否也会暴落呢？机器智能也会具有毁灭人的力量，如同核能，但人类一定会有足够的智慧来驾驭它。


    今天，我们已经能够将人工智能的符号主义、连接主义和行为主义等学派结合起来，创造出可交互、会学习和自成长的认知机器。人工智能和人类智能的不断迭代促进使得我们能够以超自然的速度发展，从野蛮时代逐步迈向文明。人们一直梦想着用机器替代和拓展我们的体能和智能，拓展认知能力，使我们能够无敌于天下，无畏于圣人，这就是现在所处的智能时代。


    因此，人类文明的发展，应该让人发挥人的智慧，机器发挥机器的智能，各智其智，智人之智，智智与共，用碳基生命的智慧引导硅基机器的智能，不会让它算计人类，用人的智慧培育机器的想象力和创造力，用机器暴力思维的成果反馈人类，迭代发展。古代先哲、物理学开山鼻祖亚里士多德曾经说过，奴隶是“有生命的工具”。2500
    年后的今天，人类努力创造可交互、会学习、自成长的智能机器——“非生命的奴隶”，这正是生命的尊严所在，更是人类的智慧所在，也就是我们所说的人工智能看智慧。


