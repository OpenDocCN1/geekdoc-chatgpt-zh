  md: '来组装设备内部的各种硬构体，由人来调节硬构体的物理参数，对外表现为选号、选台或者调音量。于是，电子设备有了特定的输入输出。电视机和收音机里，也许会设有石英器件作为时钟，人们曾经通过收音机里的声音来对时，以同步钟表的时间。但是时间和时序对电话机、收音机、电视机自身的工作原理没有贡献，没有软构体，机器没有思维能力，没有思想，只有对无线电信号的一套固定的接收和处理方法，延伸并放大了人的听力和视力，只是在“传话”，机器自身不能“说人话”，依然属于动力机器范畴，它们都不是会学习、自成长的认知机器。物质、结构和能量在物理空间中形成了各种复杂硬构体，包括工具和机器。它们对人类社会的生产、组织、经济和生活方式产生了根本性的变革，导致一次又一次的工业革命。


    传统的计算机里，有软构体(操作系统、应用程序等)，有一定的交互能力(通过键盘、鼠标、显示器等完成输入和输出)，但如果没有自学习、自编程和自成长的能力，只是按照预设的程序周而复始的运转，去年今年，昨天今天，计算机的功能和行为没有差别。因此，传统的计算机只具有确定性的智能[14]，因为时间没有对机器形成新的认知作出贡献。如果后来人为升级了计算机的软件，或者扩充了新的硬构体，能够协调工作，计算智能提升了，但升级后的时间里，仍然没有自学习、自编程和自成长的能力，时间没有对机器形成新的认知作出贡献，仍然不是认知的机器。


    认知机器一开始是批量生产出来的，硬构体可以是机器里的集成电路芯片、电路板等，把各种硬构体按照结构设计组装到一起，就成为生命或者机器。生命和机器里一定要有一个最基本的时钟，时钟赖能量为生，时间寄生在时钟上，形成时序，机器赖食熵为生。软构体可以有很多，它们或者寄生在硬构体上，或者寄生在软构体上，用来表达符号、数据、概念、信息、知识，与外界交互，还可以自我复用。软构体寄生在硬构体上，精神寄生在物质上，两者之间不但没有断层，而是难舍难分。机器里的材料必然会老化，结构破损了，或者出了毛病，不能自我愈合。如果被切断了能源，或者时钟出了故障，对外交互中断了，那么，机器的认知活动的模拟也难以为继。硅基机器中的硬构体，不能自我生成和自我组装，不能自我成长，但可以通过外力，快速升级扩容，可以被大规模复制。'
