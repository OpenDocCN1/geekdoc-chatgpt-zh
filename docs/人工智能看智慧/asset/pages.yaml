  md: '和搪塞我们的无知，或者激发我们的进一步认知。


    在最原始的阶段，人们的精神世界和认知差不多普遍地走了弯路。巫师、神学家、宗教领袖也有各自的幻想和理解，认为同类事物感应相生，并企图用模仿自然的办法创立各种交感仪式，为农田祈得雨水、日光或肥沃[7]。有的人就进入到另一种想象，相信自然界必定有种种精神主宰。于是，太阳变成了菲巴斯（希腊神话中的太阳神）的火焰车，即阿波罗，雷电变成了宙斯（希腊神话中的天神）或索尔（北欧神话中的雷神）的武器。人们通过各种仪式来向这些精神表示好，有些仪式显得奇异或庄重；另一些人看到天空星辰位置不变，行星运行有规律，有日食，有月食，想象人类的命运可以从天象中观察到，一定有个不变的命运之神在控制着人类；有人幻想，通过修行能在人的多维身体中形成“天目”，然后可以用“天目”看世界。还有一些人，可以称之为自然哲学家，他们根据自己的经验和重复的实践，探索各部分之间的因果关系，例如把丈量土地的经验规则变成几何学，在物质中寻找实在，有了物理学和天文学，又渐渐地认识到感官是不具有充分实在性的，实在不在于物质，而在于形和数之中，走上了“形而上”的道路，这都是生命的精神维度在发挥作用，可以看出人类的想象力是何等丰富。


    人的精神体现在认知空间的软构体之中，以文学艺术为例，文学家和艺术家们认识和想象世界的一种基本方式，就是认识生活，创造软构体，并将自己的认识和想象通过软构体之间的关联形成虚拟的文学、艺术作品，尤其是科幻作品，从精神上启迪人、激励人，推动社会进步。而如果以数学为例，数学家发明的结构——椭圆，设想有两个圆心，当两个圆心的距离缩小为零，就变成了圆，当圆的半径为无穷大时，圆弧就变成直线。由此看来，文学家、艺术家和科学家、工程师创造的软构体，并没有太多的不同。


    人的认知是由物质、能量、结构和时间四要素组成[8]。物质是静止的能量，能量是运动的物质，肌肉是静止的能量，能量是运动的肌肉，结构和时间寄生在物质和能量上，形成硬构体。软构体可以寄生在硬构体，也可以寄生在其他软构体之上。物理世界人们感觉到的表象反映到认知空间的本质的过程，去伪存真，去粗取精，由表及里，称之为抽象，成为认知空间里的软构体或者概念。有的时候表象是本质的延伸，也有时候会“遮'
