    # The Relationship between Science Fiction and Science Popularization: A discussion
    based on historical and conceptual analysis


    LIU Bing$^{1,2}$ FENG Xi-ge$^{3}$


    (Institute for Cultural Heritage and History of Science & Technology, University
    of Science and Technology Beijing; $^2$Center for Science Communication and Popularization
    of CAST and Tsinghua University; $^3$Department of the History of Science, School
    of Humanities, Tsinghua University)


    Abstract: For a long time, the relationship between science fiction and science
    popularization has been a controversial issue. Based on a brief historical review
    of the development of science fiction and science popularization in China, this
    paper combined historical discussion with conceptual analysis, and demonstrated
    that the "science and literature controversy" between science fiction and science
    popularization can be deconstructed to some extent, which means that science fiction
    can be accommodated in science popularization under the concept of "big science
    popularization".


    Keywords: science fiction, science popularization, relationship, science-literature
    controversy


    (责任编辑 王 聪)'
