    # Viewing Wisdom from the Perspective of Artificial Intelligence


    LI De-yi LIU Yu-chao REN Lu


    (1 Academy of Military Science; 2 Chinese Institute of Command and Control; 3
    Beihang University)


    Abstract: Usually, wisdom is a topic of discussion in the fields of social sciences
    and humanities, while intelligence is a topic of discussion in the material sciences
    and life sciences. Obviously, intelligence is not the whole of a person''s spiritual
    world. Wisdom is more closely related to human self-awareness and group consciousness.
    Wisdom also requires matter as a carrier, but not for the purpose of controlling
    objects. Intelligence is not the case, as it aims to control objects and change
    the material world. Intelligent machines are only tools for human cognition, and
    do not have to have a spiritual'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'world like humans do. They do not have conscious desires, love and hatred,
    nor do they have ethics, morality, or beliefs. Intelligence detaches from human
    consciousness, desires, emotions, and beliefs, extends and expands to external
    existence, becoming artificial intelligence, artificial tools and machines, skilled
    in thinking, controlling objects, engaging in embodied behavior, and consistently
    instrumental. The self-operated cognitive machine obeys the mission entrusted
    to it by humans, in order to improve the production capacity of human society
    and develop the economy, which is what humanity needs most and precisely where
    human wisdom lies. Machines do not need to achieve the ability of human wisdom,
    especially the ability to be human.


    Keywords: consciousness, mind, soft structure, machine cognition, imagination,
    embodied intelligence


    (责任编辑 和鸿鹏)


