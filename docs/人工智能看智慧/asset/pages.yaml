    # 二、硅基机器中物质维度的硬构体和认知维度的软构体


    人和机器都是物理空间的真实存在，劳动就是人的具身与环境通过体能和智能完成交互。把机器认知和人的认知相比较，可以促进人类对自己精神世界的认知。机器当然不是生命，但可以用生命的观点理解机器如何像人一样认知是很有必要的。诺贝尔奖获得者薛定谔告诉我们[13]，“人和所有生物一样都遵循最基本的物理定律，都会衰老，都依赖负熵为生，生命和机器都需要依靠能量，形成秩序，通过和外界交互，产生负熵。”


    # 1. 机器中智能的物质维度 —— 硬构体


    智慧需要物质作为载体，但不是以控物为目的。智能则不然，智能以思维见长，以控物、改变物质世界为目的。智能机器仅仅是人类认知的工具，不必像人那样具有精神世界，不具有意识欲望、爱恨情仇，也没有伦理道德和信仰。


    传统的电话机、收音机、电视机里包含了物质、结构和能量三个要素，它们是接收和传播电磁波并转换成为声波或图像的电子设备，由人'
