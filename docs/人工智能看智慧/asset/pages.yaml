- pgno: 8
  md: '# 2. 机器中智能的认知维度 —— 软构体


    机器和人类一样，要努力理解、揭示物理空间特定研究对象的变化规律，首先要植入一个幼儿认知核[15]，并有相应的硬构体支撑，通过接受指导学习和自主学习，在认知空间先用一个或一组概念符号来抽象特定的研究对象，即软构体。在认知的范畴内，这些软构体通常被人们称作是特定硬构体的本质指代，是能代表物理世界的客观事物抽象本质的软构体，可体现隐藏在许多硬构体中的共同性，然后再通过联想，用软构体之间的关联或者类比[16]表示事物之间的联系，否则抽象思维就陷入孤立，难以通用。思维的范围越广泛，就越要经过一层又一层的抽象来形成更加本质的软构体，用这个更本质软构体来代表更大考察范围内的全部事物，用其他低层次的软构体来代表考察范围内的各个特殊事物。那些位于物理空间的硬构体把结构寄生在物质上，而那些位于认知空间、尤其是上层的软构体，体现的就是精神，硬构体和软构体相互依赖，交互形成认知的螺旋，迭代发展。没有抽象，就没有去伪存真、去粗取精、由表及里；没有联想，就没有由此及彼、触类旁通、举一反三的通用能力；没有交互，就没有物理世界的反馈和控制，形不成回路，认知就不可能螺旋发展。


    自编程是自学习和自成长能力的一种表现形式。深度学习（如人脸识别系统）是记忆驱动的经验认知模式，本质是归纳，经过大量数据的训练，获得了比普通人更高的识别能力，而且随着时间的推移，数据量的增加，识别率也进一步提高。固然训练的模型是研究人员预先设计的，训练成本高，但训练过程中的自动调参优化，也是自学习、自编程和自成长能力的一种表现。认知的核心问题是软构体可以自我复制、自我扩展，就体现了机器自身的想象力和创造力，哪怕是一点点。认知机器中最早的、最基础的“幼儿认知核”软构体，有抽象、联想和交互的基本能力，也才能有后来的自学习、自成长能力。这正是深度学习成为人工智能发展史上不朽丰碑意义所在。当今
    ChatGPT[17]的预训练成本太高，包括标注在内，标注就是强行记忆。我们如果不把预训练和识别使用截然分为先后两个阶段，而转变为长期在线的指导学习，边指导，边学习，边记忆，边使用，还可以进行无指导的自主学习，自纠错。软构体有了自我复制、自我扩展'
  merge: -1
  img_proc: true
- pgno: 9
  md: '的能力，就成为可交互、会学习、自成长的认知机器了。


    # 三、人类最伟大的智慧是发明了教育，创造包括智能机器在内的文明生态


    人类学习的历史几乎与生命的历史一样漫长。生物学上，地球上所有物种后天的智能获得性不可以遗传，但如果在一个人的生命期内能够将其智能形成人工智能，那么个人物质灭亡之后对整个人类的智能发展依然在贡献着，所有人类的知识通过语言文字下去，通过教育形成文明生态。


    +   1. 人类智能始于语言，人工智能始于文字


    “人类智能始于语言，经历了数千万年的进化，人脑组织结构不断适应语言能力，语言也促进了脑组织的进化。靠大脑皮层的支撑，人类后天习得生态传承的知识、文化与文明”[18]。文字是连续语言的离散载体，人工智能就起始于人类发明文字。文字承载了人类的思维和智慧[9]，表达了思想、见解、技巧、决策、问题求解等，独立于人体之外，书于竹帛，镌于金石，琢于盘盂，载于纸张，构于机器。个体生命灭亡了，他创造的文字和文化还在，他的思想和智能还存在，人类群体的记忆还在。一个人的“灵魂”永生，其实只不过是在他死了之后，活在历史的文字里和当代人的记忆里而已。


    +   2. 智能植根于教育，人类是地球上万千物种中最会学习的物种


    教育环境影响了个人的认知能力发展，特别是学习能力。而人类的智能通过教育的传播性和传承性在时空扩散。所以在地球生命的历史中，首次产生了使用群体智能和社会文明，向后代传播并传承已有智能的唯一物种。


    人类是地球上万千物种中最会学习的物种。人类把一生 1/4 的时间用来接受课堂教育。教育的独特之处在于它能够使任何新知识和智慧在极短时间内成为全人类的常识。知识的高效传播、交流和后天灌输通过'
  merge: -1
  img_proc: true
- pgno: 10
  md: '教育实现，个人无需再亲身重复实践，学会了就能模仿。科学和技术，由人类智慧所创造，成为学校学习的关键内容。而学习的方式不仅包括有监督的学习，还包括有指导的学习和集体学习，以及个人实践的强化学习。教育通过代际传承，将整个人类的累积性知识和精神财富传递给后代，人类因此摆脱了仅通过基因迭代累积的传递方式。“原本依靠生物进化智慧的‘现在进行时’被添加了一个新的，而且占主导地位的认知渠道，即依靠教育发展智能的‘现在完成时’。读书可以改变一个人，教育可以改变全人类，人类最伟大的智慧是发明了教育”[18]。教育成就了人类，科学和技术成为人类社会发展的第一生产力，已经是全世界不同价值观群体的共识。


    # 四、人的智慧根植于肉体源远流长，认知机器不会“算计”人类


    # 1. 意识比智能更原始，边界感知能力构成意识的生物学基础


    人的智慧里，最早是产生觉察，试图寻找自我，产生意识[20]。意识本质上是关于感觉的，而非认知或智力，意识远比智能更原始。意识诞生于人类和爬行类共有的那部分大脑，源于大脑中一个非常古老的部位——脑干上部
    R 区，这是生命体生存和繁衍的基本脑区；位于 R 区之上的边缘系统是人类和所有哺乳动物共有的情感脑区，这个部分也已经有 5 亿年的历史了[21]；位于大脑最外层厚厚的大脑皮层才是人类的智能脑区，是神经元胞体集中的地方，是构成大脑两半球表面沟沟回回的表层灰质，成为独一无二的人类特质，也仅有几万年的历史。这些寄生了结构的物质也就是人认知的硬构体。生命科学和医学中许多著名的案例说明，R
    区结构的损伤，哪怕是在网状激活系统的某些部分中小到火柴头大小的损伤，都会使所有意识消失。如果把一只新生哺乳动物，比如一只小鼠，去除其大脑皮质，它不会丧失意识[22]，早上会醒来，晚上去睡觉，它还会跑来跑去、挂在栏杆上、游泳、吃东西、交配、玩耍、把幼崽抚育养大。同样，一个生来就没有大脑皮层的儿童，被称为脑发育不全性脑积水，他'
  merge: -1
  img_proc: true
- pgno: 11
  md: '早上醒来，晚上入睡，高兴时微笑，沮丧时大吵大闹。当然了，我们没法跟他用语言沟通，没法把他送到学校去接受教育，因为他没有大脑皮层，没有人的基本智能——语言智能，但会像我们的宠物一样表现出意识和情感。所有这些都表明：意识、情感的行为离开了大脑皮层依旧存在。人类智能和一般生物的根本区别在于人类新生的大脑皮层，恰恰是大脑皮层才让人类变得更智能。


    意识是生命进化范畴内的一种现象。当人类感知这个物理世界的时候，可以完全有意识，也可以完全无意识，还有中间的情况存在。那些有我们的感觉和知觉、也可能有行为为参与的一系列事件在以同样的方式屡屡重复时，它们就渐渐地脱离意识的范畴，变成为本能、技能或者智能，例如，小孩迈出第一步尝试时的兴奋或恐惧，是有意识的，成年人边讨论边走路时的步伐是无意识的，可称为意识隐退。人的腿脚出了问题，术后康复再走时的疼痛，又会意识复现。意识隐退对于人的智能具有重要的意义。起初陷入意识领域的只是那些变化或“差异”，使得新事件区别于以前的事件，因而需要新的考虑。当新情况及引发的新反应出现时，意识又冒了出来。一旦场合或者环境条件与以前不同，事件的发生就是有意识的。人的意识和人的智能，就是如此纠缠着，又释放着，时而隐退，时而复现[23]。


    我们通常认为意识是对自我存在的感知，包括对行为和驱动行为原因的感知[24]。每个人都感受到意识，而在这众多意识之中，对自我存在的感知和表达，也就是自我意识，被认为是最基本的认知，同时也是最初的意识。低级的原始的自我意识只有本人能够亲身体验，正如“我思故我在[25]”。在此基础上才能发展高级意识或更高级的群体意识。


    “要想感知到‘我’这个本体的存在，首先需要具备知觉意识，即能够从边界上区分出‘我’和‘非我’。对于生物而言，这个边界通常是皮肤。生物的皮肤不仅提供了物理的边界，还执行着呼吸、体温调节、感应、新陈代谢、吸收、分泌排泄、保护等多种边界交互功能。由个体大脑神经元延伸至末梢的知觉神经赋予生物明确的边界感知能力，构成了意识的生物学基础。对于机器人而言，为了形成这种边界，需要具备类似于人类皮肤的感知边界，我们称之为感知膜。感知膜需要具备跨模态的综合感知能力，涵盖了疼痛、温度、湿度、压力、张力、弹力、光滑度、透气性、材质等'
  merge: -1
  img_proc: true
- pgno: 12
  md: '多种感知，并具有高度的感知精度。当感知膜受损时，还需要具备自修复能力，以维持边界的完整性。” [14]


    人体皮肤表面积大约 1.6 平方米，用针尖触任何一点都有疼痛感，一头牛的皮肤表面积大约 3.6 平方米，一只苍蝇落上去，牛都会有知觉。机器人通过人工神经末梢获得表面感知要达到这个程度，才能有感知边界，进而才能有认知边界，才能区分“我”和“非我”，才能够萌发出原始的自我意识。而要制造出类似生物皮肤这样敏感的人工感知膜、电子皮肤甚至量子皮肤，还来日方长，这正是人们普遍诟病当前缺少“有温度的机器人”的原因之一。


    # 2. 人的思维能力最终体现在具身行为智能上


    普遍认为，思维主要体现在人脑 300 万年来进化出的特有的新皮质上。尽管在大脑皮层四个叶区研究发现有很多很多的任务分区，但是皮层组织存在着局部与整体的自相似性，软构体并不是存储在某一个神经元，而是存储在网络当中，没有哪个神经元是孤独的，可以用人工智能元胞网络模型[14]作为大脑皮层的长期修饰、修剪或重塑的通用表征，大脑皮质上有很多沟沟回回，可以用分形技术把它产生出来，大脑皮层的表面积其实并不是只有那约
    2200 平方厘米，是可以足够大的，是用进度退的，是每个人都不一样的人工智能发展过程中的符号主义学派强调人脑思维中的“抽象”，连接主义学派强调思维中的“联想”，行为主义学派强调思维中的“交互”，现在我们终于认识到，思维的核心正是抽象、联想和交互，三者缺一不可，更多的就是在新皮质上软构体的创立、联结，以及依托硬构体迭代发展和递归执行。人类的整个认知活动逻辑上可分为感知—思维—行动，大致对应三个区：瞬时记忆区、工作记忆区和长期记忆区[26]。瞬时记忆区处理不同感觉器官获得的感知信息，完成跨模态融合；工作记忆区分析当前问题的态势，形成决策，控制机器的具体行为；而在长期记忆区里留下了我们认知的结果。因此，对硅基的智能机器而言，怎样构建人工智能元胞网络模型是一个很重要的问题。不妨假设，被当前问题注意力激活的人工智能元胞组成的网络是一个具有幂律分布特点的复杂网络，呈现小世界特征，可以分别在不同尺度上整体表现，完成记忆的提取。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '要弄清楚智能机器如何同人一样，具有认知能力，我们还要关心机器的“具身智能”[27]，1948 年，“具身智能”（embodied intelligence）第一次被图灵提出。人体是构建自我的塑造者，外部世界依赖于具身的体验，别无他物。机器对应人体的运动行为系统，机器具身行为是判断机器智能最基本的准则。人的意识根植于肉体溯远流长[28]，人体运动行为系统由骨、关节和骨骼肌三种器官组成。从动力学角度看，骨是被动部分，骨骼肌是动力部分，关节是运动的枢纽。全身各骨借关节相连形成骨骼，起支撑体重、保护内脏和维持人体基本形态的作用。骨骼肌附着于骨，在神经系统支配下收缩和舒张，收缩时以关节为支点牵引骨改变位置产生运动。人体通过与客观世界的交互来改变自身行为，人体的这种具身行为表现为具身智能。有的时候，我们希望机器具有类人一样的行为智能，称为人形机器人，或者说有温度的机器人，实现人的分身，外显情感，体现亲和力，尤其是数字虚拟人，逼真度要高，例如数字演员、电视节目数字主持人、数字医生、数字律师和学校的数字教师。而更多的时候，我们希望用智能机器完成一些专门的脑力和体力工作，代替人的劳动岗位。相比于人，它们可能更有速度，如无人驾驶车辆；更有力量，如智能盾构机；更加精巧，如纳米机器人；更加灵巧，如柔软操作手、软体机器人；更加适合野外地形环境里的运动、攀爬和捉拿，如多足机器人，等等。我们从不奢望同一台机器可以全知全能。人体的力量靠肌肉驱动，机器的力量靠电机驱动，工作机理差别太大，物质机器人的外形像不像人不重要，过度追求外形相似，倒是失去了想象力，人工智能主要不是单纯仿人行为的生物工程，不是人工生命。其运动行为，尤其是工业、农业领域里的机器人，必须能够在所处环境、甚至恶劣环境中完成特定工作任务，这才是发明认知机器的驱动力。


    # 3. 智能机器不是人工生命，不会“算计”人类


    70 年前在达特茅思会议上诞生的人工智能，开辟了剥离意识，让智能延伸到体外，成为机器智能的一条崭新的道路，计算机智能是脱离意识的成功证明。众所周知，计算机无意识、有智能。在提出图灵机之后的18
    年里，图灵又提出振聋发聩的天问：机器能够思维吗？提出用“对话图灵测试”[29] 来检验机器是否具有外显的人类语言智能，而没有生命的意'
  merge: -1
