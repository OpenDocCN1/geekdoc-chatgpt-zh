  md: '展，人体器官在不断经受切割与缝补之后，硬构体变得越来越清晰和可控，甚至可以用人造假肢和人造心脏去替代相关组织和器官。生物学的研究早期更注重物质维度。


    对人体还有一些其他的划分方法，例如，结构生物学把生命科学分为基因生物学、分子生物学、蛋白质生物学、细胞生物学、神经生物学等。人们已经形成一个共识，结构在生命中举足轻重，每个活生生的人，实际上都是用结构寄生在物质上的独立硬构体，微小的硬构体通过结构形成较宏观的硬构体，从生命的物质维度看，很难区分生命的子系统哪个更复杂，和生殖系统、免疫系统比，用于认知的脑器官的组织最复杂之说，未必能够成立，这或许只是人类对自身理解的一个“偏见”。我们认为，人类智慧的形成不可能仅仅依靠单一器官的进化。直立行走使得人类能够解放双手以制作和使用工具，双手的灵活程度远超过其它任何物种，耳蜗和声道使得我们能够精准发声、表达多种情感，尤其是人脑皮质的快速暴长，这诸多因素才促成人类今天有了无与伦比的智慧。可以说，生命中智慧的物质维度——硬构体，大可大到整个人体具体身、器官，小可小到细胞、基因、分子。基因即细胞中寄生着特定结构的化学物质脱氧核糖核酸。尤其是大脑皮层，它是随着人体的发育而成长壮大的。根据细胞分裂次数学说，人体细胞每
    2.4 年更新一代，人一生中有的细胞要更新 50 代或者更多。智慧的物质维度，即硬构体，可以自我生成，自我组装，自我成长，一直是变化着的，出了小毛病，还能自我愈合。所有这些过程都需要依靠新陈代谢，需要耗费较长时间，不可拔苗助长，也许可以克隆但不可能复制。


    # 2. 生命中智慧的精神维度 —— 软构体


    “人”未必是可以用硬构体划分开来谈的，可以用不同的视角更深刻地去认知人类自己。我们既是生物人、自然人，更是社会人、文化人。从生命的精神维度看，作为文化和文明生态的产物，人不仅仅是活着，还要活得有意义。人类对自身所表现出来的精神、思维和智慧，对人的意识、欲望、信仰、情感和性格的形成，对我们自己头脑里的想象力和创造力，对思维的成长和认知的变化，对“我”，可能更为看重，很可惜，我们对生命的精神维度，却知之不多，知之不深，有时会用神学、“造物主”来麻木'
