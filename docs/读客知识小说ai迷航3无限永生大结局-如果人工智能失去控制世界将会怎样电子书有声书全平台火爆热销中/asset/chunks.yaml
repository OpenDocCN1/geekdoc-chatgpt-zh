- raw: '我终究是低估了他们。借着一个空隙，我翻身跃入滑梯。滑梯绕了几个弯，大约用了两分钟的时间最终来到地面。


    克隆程雪、娜塔莎、孔丘、爱因斯坦、牛顿、孙武、施文郁等人全都焦急地等着我，他们显然听到了枪声。一名AIK正抱着她姐妹的尸体，默然不语，看不出痛苦伤心。


    我来到那名AIK面前，见她身上中了不下20枪，血几乎流干了。她的眼睛灰蒙蒙一片，像是在朝着那灰色的天空发愣。我抚摸着她的眼皮，让她闭上了眼睛。


    远处，幸存的壁人们也从通天塔的外围爬了下来，他们在地面上寻找着自己的同胞，一些壁人想过来，但是看着不远处对他们充满敌意的陆警和军队，便止步不前。


    若是在他们还不认识枪的时候，他们会过来的。但是代价，更为惨痛。


    我抚摸着最后一名AIK的头发，帮她抹去眼泪，搂在怀里：“现在不是伤心的时候，我们得尽快离开这里……”


    我感觉到她的脖颈动了动。这种感觉很奇妙。她长着和我最爱的人相同的容貌，却又是个完全不同的人。施文郁远远地看着我，我看向他的时候，他转过了头，从上衣兜里拿出一个透明的玻璃板，开启了一个全息地球，寻找着什么。


    离开AIK，我才向其他人道：“阿历克斯抢了我的枪！”


    “又是那小浑蛋，早知道就该先杀了他！”


    “我们怎么办？”


    “召集大家，一起走！”我向施文郁道，“这是什么地方，有位置信息吗？”


    他摇了摇头：“没有任何信号，地球上空仅有的卫星已经被AI俘虏了，而利莫里亚的定位系统，此时也没了消息，我猜……它已经毁了。”


    远方乌压压的一片人，已经有数百士兵正在集结，其中不少人都虎视眈眈地望着我们几个人。他们看见我之后，其中一些人稍微放松了下来。


    “北极之光！”一个男孩朝我喊道。


    事不宜迟，我将现在的形势简要向这些陆警、机动队战士介绍了一下，但至于和神的问题，根本没有时间解释，也解释不清。


    “同胞们，正如你们亲眼所见，我无须多言。我们已经被AI逼到了绝境，利莫里亚已经毁灭，我们现在是人类历史上仅存的几万人！”


    “赵仲明！”一声熟悉的呼喊，却见黄战斗一瘸一拐地从远处跑来。


    “黄豆子，你怎么在这里？”


    黄战斗长叹一声：“别问了，这是我的耻辱！第四大队……或许……全军覆没了！”


    我拍着他的后背以示安慰：“此时不是过度自责和伤心的时候，你看，还有这么多人需要我们这些当兵的保护。兄弟，振作起来！”我朝着周围的士兵也喊道，“大家振作起来，AI虽然强大，但只要我们心存希望，他们就不能将我们赶尽杀绝！”


    有一名士兵喊道：“队长，我们听你指挥！”周围有200多名陆警和机动队员都围拢过来。


    “你们……”


    他们和黄战斗一样低下头颅。


    在自己的同胞都战死之后，活下来的人，并没有任何荣耀，无论这场战役是输是赢。


    “大家振作起来！”我指着远方的壁人道，“你们可能觉得他们是怪物，但几乎没有人知道，他们和我们同样在利莫里亚生活了十几年。我们在上，而他们在下，一代又一代的壁人，都是以维护利莫里亚的运行为使命。然而就在刚刚，他们，用数千条性命，来践行自己的使命和天职！大家不要对壁人怀有敌意，相反，我们应该敬重他们！同时，我们作为军人，也要铭记自己的使命！利莫里亚虽然毁了，但我们的职责并未结束！”


    他们逐渐抬起头，黄战斗转身向他们朗声喊道：“军人们，你们到底为谁而战！”


    “为了全人类！”


    200名士兵和陆警分散去通知周围的人，准备听我命令进行转移。我来到壁人之间，感谢与安慰的话都是多余的，他们幸存下来的只有不足百人，此时正互相搀扶着，始终与我们保持距离。


    我在尸体堆中发现了伯七耳，他胸部以下的身体全部被烤焦了。冷风中弥漫着焦煳的味道。远处那些不明情况的年轻男女，不仅嫌弃地捂住了口鼻，还向壁人们竖起了中指。


    我搂着一个因孩子死去而伤心痛哭的女壁人，向他们说道：“会好的，会好的，你们对我们的恩情，我不会让任何人忘记……”


    幸存的壁人们也搂住了我，他们一层又一层地搂着自己的同胞向我围过来，默默地将头低下。我抬眼看向那12层的高塔，它就像是一座丰碑，上面镌刻着智人的悲哀与壁人的荣耀，人类本已泯灭的人性之光，在此刻光芒四射。


    远处的烟火中，几个壁人领着一群尼人孩子列队走来，我看见了领头的楚庚和吴丙，他们沉稳地组织着同学们列队前行，没有人哭闹，各自面色凝重地应对着旁人异样的眼光。直到他们走过我身旁，看见了孔丘和爱因斯坦等人，这群孩子才大喊着一声声“老师”，向着他们跑过去，师生们哭作一团。


    短短数月，生离死别轮番上演，500个学生仅存六七十名，他们小小年纪便经历了人世间最痛苦的课程，已然足够让他们长大。我遥望着他们，视线模糊，抬起的脚终究还是放下了。孔丘等人知我心意，也没有把我真正的身份告诉孩子们。


    军人和陆警的队伍慢慢壮大起来，当初一些人为了逃生换上了普通人的衣服，但或许是内心的自责令他们忏悔，越来越多的人自发地加入到了组织秩序的队伍中。


    阿历克斯与13位神还是没有下来。


    孔丘道：“不下来最好，我们即刻出发吧。”


    我说道：“他们恐怕是担心大家会群起而攻，算了，让他们自生自灭吧。”


    孙武道：“或许他们比我们活下来的可能性更大，毕竟，我们这支队伍过于庞大了……而且，问题太多，将近2万人，每天要吃的饭就得许多，然而我们去哪里找这么多粮食？”


    我望着远方的群山起伏，大山下面，则是缓缓的草原。“如果这是北美，或许还会有些动物可以猎食。”


    “满足2万人？”


    这时候，施文郁走了过来：“此处在曾经的黄石公园附近，”他指着群山后面的方向，“那里应该有一座因为核弹而爆发的火山，火山正南方有一个不小的湖泊，距离我们50公里左右。”


    孙武点了点头：“自古行军打仗，依山傍水而居。有湖泊的话，至少淡水能够解决；而山峦起伏，就有隐蔽之处，AI攻来，也便于我们隐藏。”


    话不多说，这支庞大的队伍在严寒之中缓缓向山峦中开进。我与孙武、爱因斯坦走在最前面，之后是孔丘、程雪等人。壁人跟在我们之后，再后面是尼人孩子，跟在孩子后面的则是几十名荷枪实弹的军人，最后面的是漫长的队伍，陆警和军人走在队伍两侧，负责维持秩序。队伍内部发出骚动，这些年轻人不知道目的，所以对此行心存疑虑，我便将我们行军的目的传达了下去，这才安抚了他们的情绪。


    高山虽然看着近，但走了至少六个小时才到山脚下，由于有不少伤员，我们每小时行军的速度只有三四公里。不过他们经历了生死，倒是更加懂得团结的可贵，于是健康的人轮流背着或者担着伤者，徐徐前行。


    当下地面温度在零下10摄氏度左右，而所有人现在穿的都是28摄氏度恒温时的衣服，所以，严寒比长距离的跋涉更为考验人的耐力。绝大部分年轻人从没有吃过这么大的苦头，就连训练有素的军队，也是第一次遭遇大地母亲的残酷。


    后面陆续有一些声音传进我的耳朵，多是指责那将核弹丢下来的人，他改变了地球的气候，让本来温暖的北美大地，成为了一片冰雪地狱。他们不知道我是程复，其实也无须知道。


    前方是一道狭窄的山谷，中间那条破旧的公路已经被冰雪、杂草掩盖了大半。我们沿着公路行进，一路上见到了不少垮掉的便利店、残破的墙壁、被破坏的加油站和一块块被挖出的圆形或者正方形的大坑，深坑的直径普遍10米到20米不等，有时候深坑连接成一片，不知道当时的人为什么要这么做，我猜测或许是某些未完成的工程现场。


    我上身只穿着一件薄衬衫，外套给了克隆程雪，但她依然冻得发抖。临出发之前，我从一个死去的壁人身上找到了一件毯子，给她披了上去。此时她和娜塔莎相互搀扶着走在我后面。


    “哥哥！”她忽然喊住我，“你没觉得这些坑很怪？”


    “怪？”


    “你……忘了？”


    “忘了什么？”


    “那间林中小屋，樱子的家。”


    我恍然。经克隆程雪提醒，我再看那一个个深坑，更像是上面有过房子。而那连续的坑，更能说明这里以前似乎是个村庄。坑边沿看不到机器和工具的痕迹，边沿是很规整的弧形，如果说是老鼠刨出来的，好像更有说服力。


    我大喜过望：“若真是如此，我们就有救了！”


    克隆程雪一脸惊诧：“如果真是那群家伙……岂不更危险！多恶心……”


    其他人都好奇，于是我把曾经被老鼠拖着房子跑进了老鼠王国的故事讲给他们，听到老鼠的时候，只有孙武和孔丘是兴奋的。


    孙武道：“如果它们真的是一支经过训练的老鼠军团，那我还真是想和它们斗斗兵法。”


    孔丘道：“和老鼠有什么打的？不过，若真是如程复所言，我们至少有肉吃了，可解燃眉之急！”


    我笑道：“倒是暂时不用吃老鼠，那群老鼠养了成千上万头牛羊！”


    后面有个士兵跑了过来，在我面前敬礼道：“报告，后面有很多学生体力不支，申请休息！”我点了点头，让大家原地休息15分钟再行进。


    壁人比我们更惨一些，他们从来没有穿鞋子的习惯，如今光着那带着吸盘的脚踩在冰凉的石头上，痛苦自然不必说。但是没有一个壁人抱怨，他们只是轮流背着幸存者，默默跟在我们身后。


    休息的时候，壁人们各自坐在地上，互相帮助同胞搓着脚底，刚才走在壁人后面的50名左右的士兵，忽然绕到了壁人的周围。他们好奇地看着壁人，但是我总觉得他们的眼神有些异样。


    空洞？或许是寒冷让他们也产生痛苦了吧。


    娜塔莎道：“这样时间长了，有可能会造成冻伤。”


    她说这话的时候，又有十几个人溜溜达达地绕到了我们前面，仿佛无意似的溜达，但我总觉得有什么不对劲。


    “怎么了？”娜塔莎从我脸上捕捉到了我的心理活动。


    “没什么……”我走向路旁，拔了一些干草在手里搓了搓，拿到壁人们当中，“我知道你们修理利莫里亚的技艺精湛，但我不知道，你们是否能够利用这种干草，为自己编织一双草鞋？”


    “我们连鞋都不能穿，又谈何草鞋呢？”一个壁人道，“我担心我们穿上鞋，反而会栽倒！”


    “总是要试试。我们的路程走了没到一半，下面还有很远，如果穿上草鞋，至少可以对足部产生保护作用。”


    几个壁人听了之后，便和我一样，在路旁的干草里寻找合适的材料，然后又研究了一番我们穿的鞋子，自己开始编织起来。几个士兵好奇地围了过来，他们的动作有点缓慢，我总觉得哪里不对劲。


    “你们这是怎么了？”我向近旁两个士兵问道，他们没有回答，只是看着壁人编织草鞋。


    待我想第二次发问的时候，其中一人忽然抬起头，向我说道：“很好！”


    他的眼神空洞，这种空洞是那么熟悉……我从哪儿看到过……


    阿历克斯！


    阿历克斯向我们开枪的时候，也是这样的眼神。


    一阵寒意从我内心升起。但我并不觉得他们会像阿历克斯一样，可为什么他们的眼神变了？这小伙子给我的印象还是比较深的，集结队伍的时候，他行动非常积极，精神抖擞，可现在却像变了个人。


    “下来之后，是不是身体不适应？”


    “适……应……”仅仅两个字，他却以一种极为迟钝的语气回答出来。


    “你叫什么名字？”


    “我……叫……”他停住了。


    我心中大骇。正在此时，他仿佛猛然醒来似的，看着面前的我，表情有些古怪，然后迅速向我敬了一个礼：“十分抱歉，我刚才像是睡着了。”


    “我没有责怪你……”


    我再看向其他的士兵，他们的眼神依然麻木。


    我将发现的这些诡异状况告诉了孔丘和孙武，孙武猜测，或许和当地的气候或者磁场有关系。


    “莫非空气中有毒？”孔丘道。


    孙武摇了摇头：“如果中毒的话，其他人肯定也会这样，为什么只是这些士兵？”


    “怪哉怪哉。”


    我嘱咐他们当心。


    第十章 九死一生


    1


    壁人们心灵手巧，很快每人就编了一双鞋子，并尝试穿着鞋子在地上走路，有些人走得顺撇，逗得尼人孩子发笑，但他们很快便适应了鞋子，有人索性又编了手套，趴在地上行走。


    队伍继续前进了两个小时才走出山谷，来到了另外一片平缓的草甸地带，远方5公里左右，果然有一片深色的湖水。这里的气温比外面稍微高一些，大概是得益于湖面水域的气候调节作用。


    温度已是零下，可湖水竟然没有结冰，着实出乎我们的意料。见到湖水之后，我们无形之中加快了步伐，又走了一个多小时，前面的人已经走到了湖的旁边。


    站在湖畔，寒风变得清冷湿润。我望着远方的山，不禁好奇地向克隆程雪问道：“我们上次来，这里还被白色的雾霾笼罩着，如今为什么雾霾不见了？”


    克隆程雪也纳闷：“被风吹走了？”


    娜塔莎则推测：“或许属于一种季节性气候，每个月都不一样。”


    施文郁和牛顿对湖水简单地研究了一番，确定可以饮用，众人心下稍安。我让士兵传令今晚在此过夜，施文郁推测，湖水或许和地下火山有关系。他指着一个入水口——是两山之间的一个岔口。“那边云雾蒸腾，我估计那边有温泉！”


    此话一出，就连壁人都欢呼雀跃。


    后续部队终于全部走出了山口，但是离最后的人到达这里，还有五六公里的距离。正当我和孙武讨论如何安营扎寨，以及如果遇到危险，将以何种方式撤离的时候，枪声响了。


    密集的枪声。


    伴随着枪声，壁人一个个地倒下；伴随着枪声，最后一名AIK用铁钎撑着地，身体不住地随着子弹打在她后背而颤抖，她的身体掩护之下，是瑟瑟发抖的克隆程雪；伴随着枪声，远处的人都冷漠地站在原地，面无表情地看着这场屠杀，时间仿佛静止了一般。


    刚才我意识到不对劲的士兵，正疯狂地将枪中的子弹射向早就已经不可能生还的壁人和AIK。鲜血在莽苍的草地上飞溅，克隆程雪和娜塔莎尖叫着卧倒在地，牛顿压着孔丘藏在了草地里，施文郁从身后扑向了我和孙武……


    枪声停止了，整齐划一，一如响起时那般。


    他们，究竟在做什么！


    我不顾孙武和施文郁的劝阻，从地上站了起来。


    “你们疯了吗！”我吼道。


    没有人回答。那些刽子手，几乎同时看向了我，也没有通过任何语言的交流，就分成了三拨，一拨走向我，一拨走向孔丘和牛顿，一拨走向了克隆程雪与娜塔莎。


    每一拨10个人，将我们仅存的7人押到了湖边，背朝湖水跪下。他们站在后面，用枪口抵着我们的后脑。


    AIK撑着铁钎，依然没有倒下，她的衣服已经完全被血染红，嘴角还流淌着血，她用尽最后的力气，抬起头看向了我们，眼睛里的哀婉与遗憾，将是我此生最后的痛苦记忆。


    “你们……疯了吗！”


    没有人回答，他们只是沉默地等待着枪决前的最后命令。


    “你们为什么要这么做？我们人类已经走到了绝路，为什么还要不停地自相残杀！”


    依然没有人回答。


    越来越多的人围了过来，每个人都面无表情，眼神空洞。


    直到笑声自人群之后传来，麻木的人群自动让出了一条路，却见亚伯拉罕搂着阿历克斯，从人群中走了出来。后面，是那12位神，面带蔑视。


    亚伯拉罕道：“程复，你终究是输了！你低估了神！”


    “又是你们这群浑蛋！我就该杀了你们！”我恨自己，我多少次吃亏，都是因为自己那愚蠢的仁慈。


    “你高估了自己，即便阿历克斯没有抢走你的枪，你也杀不死我！”


    “是我太蠢了……对待你们这群狼，我不该有任何的仁慈！”


    亚伯拉罕在胸前晃动着右手食指：“不不不，你终究是个凡人——不过，你还是给了我惊喜，我没想到，我竟然不能控制你！”


    “我不会被你控制的！”


    他继续晃动食指：“我们对于控制的理解不同，我指的是——”他右手向上方一指，忽然之间，除了那些神之外，所有人全都指向了天空，他迅速收回手，所有人同时也收回了手，“这就是神迹，你不为神力所控制，还真是大大出乎我的意料。”


    多么熟悉的一幕。在那梦里，我的爷爷程文浩，不就已经展现给我了吗？


    是那控制意识的纳米虫子！


    亚伯拉罕道：“你实在是个惊喜，虽然我不知道为什么我无法控制你，但当我看到娜塔莎之后，就明白了，她一定对你做了什么手脚，如果不是因为这件事，我还不会发现，我也控制不了她。在利莫里亚，竟然有人能够脱离神的控制，这也算一个奇迹！”他走到娜塔莎面前，“小姑娘，我给你一个机会，告诉我，到底是谁教你这么做的！”


    娜塔莎恐惧地摇着头。


    “说！”亚伯拉罕右手掐着她的脖子。


    娜塔莎吃不过痛。“她……已经……死了……”


    “又是程雪？”亚伯拉罕松开了手，“枉我那么信任她，我竟然连她是什么时候背叛我的都不知道！”


    我冷笑了一声。


    “你敢嘲笑我？”他愤怒了。


    “我都是要死的人了，你还以为我会哀求你？”


    “我便要你哀求我！”


    “绝不可能。在我眼里，你并不是真正的神，你不过是把虫子种进人脑的卑劣之徒，这就是你所谓的‘神迹’？这就像一个人操纵着木偶的身体，对别人说‘看看，他多听话，我多伟大’一样可笑，”我瞪着他，“你自欺欺人罢了，你不过是活在自己的幻想中，真正的神，是人内心的信仰，你只征服了这些人的脑部神经，你没有征服他们的心！你更没征服我的心！”


    亚伯拉罕深吸一口气，又吐了出来：“你知道得真是不少，不过，我尊重每个对手。我完全可以用枪指着其中任何一个人的脑袋，逼你就范，但我是神，不屑于这种卑鄙伎俩！罢了、罢了，程复，你也算人类的有功之臣，那我就成全你，待你死后，将你葬在这湖畔！从此刻开始，我将以你的名字命名此湖，以纪念你的牺牲与贡献！”


    “你这无耻的家伙！”


    亚伯拉罕后退几步，回到阿历克斯的身旁，右手搭着他的肩膀：“行刑吧……”


    “父亲，我亲自来！”阿历克斯道。


    “哦？你是我的孩子，杀人这种小事，岂不自贬身份？让那群猪猡干就行了。”


    “父亲！你不知道，这程复之前百般折辱我！我若今日不亲手杀了他，未来的永生之程，也是充满了遗憾！父亲，你就答应我吧！”


    亚伯拉罕道：“既然如此，那这程复便交给你了！”


    “谢谢父亲！”阿历克斯笑道，他一把抢过身旁士兵手中的冲锋枪，来到我的面前，以枪口抵着我的眉心。


    “程复，还记得这片山脉草原吗？我曾经是你的手下败将，但今日，你彻彻底底地输给了我！曾经，你被绞死，但那终究不是我亲手杀的，心头未免遗憾，但今日，老天成全我，我终于可以亲眼看见你，死在我的手中，我的脚下！”


    克隆程雪忽然喊道：“你这浑蛋，我哥当初明明可以杀死你，却没杀你，是你心胸狭隘、卑鄙无耻……”


    “闭嘴，你这母狗！”


    克隆程雪忽然猛地挣脱后面两名士兵的禁锢，从地上蹿起来，斜向上朝着阿历克斯扑去。阿历克斯的枪在开出的刹那，被程雪推了上去。


    “砰砰”两枪，全都打进了天空。


    “妹妹，小心！”我挣扎着喊道，身后的人将我两条胳膊扣得死紧。


    克隆程雪将阿历克斯扑倒在地，张开嘴便咬住了阿历克斯的鼻子，疼得他哇哇大叫，却见克隆程雪一用力，阿历克斯的鼻子连同半张脸皮就被硬生生地扯了下来。


    克隆程雪站了起来背朝着我们，她将那脸皮啐在地上，擦了擦脸上的血，又自己转身回去。阿历克斯在地上疼得像是被插了一刀的猪，可是亚伯拉罕和那几位神却冷漠地看着他，周围的士兵无动于衷，这就说明亚伯拉罕是故意想看看阿历克斯会做何反应的。


    “父亲，好疼啊……”


    亚伯拉罕没有回应。


    阿历克斯睁着一只眼睛，看见的却是面带嘲笑的克隆程雪。


    “母狗，我要杀死你！”他从地上捡起枪，扣动了扳机。


    枪声几乎同时响起，枪口全都对准了阿历克斯。


    阿历克斯缓缓地向后倒去，他不可思议地回头，看向了他梦寐以求想要接近的父亲，实在不明白，他为什么要杀死自己。


    阿历克斯的腹部往上，已经被四面八方的子弹，打得没有一处完整。而他的父亲脸色麻木，直到他失去意识，也没有做出一点回应。


    亚伯拉罕望着那具逐渐变冷的尸体，最终摇了摇头。


    我看了看程雪、娜塔莎，看了看孔丘、爱因斯坦、孙武、牛顿，最终，我看向了施文郁。没有人求饶，甚至没有人哭泣，他们与我对视之后，都闭上了眼睛，等待着命运的终结。


    或许，阿历克斯的死，平息了他们心中的某种怨恨。


    我也闭上了眼睛。


    别了，我爱的所有。


    别了，我的同胞们。


    别了，我那愚蠢至极的梦想。


    我不会带着仇恨死亡。


    这是我唯一能做的事。


    我还可以祝福这些人类同胞，但是祝福的话，我终究是想也懒得再想……


    砰！


    程雪的方向。


    砰！'
  fmt: '

    我终究是低估了他们。借着一个空隙，我翻身跃入滑梯。滑梯绕了几个弯，大约用了两分钟的时间最终来到地面。


    克隆程雪、娜塔莎、孔丘、爱因斯坦、牛顿、孙武、施文郁等人全都焦急地等着我，他们显然听到了枪声。一名AIK正抱着她姐妹的尸体，默然不语，看不出痛苦伤心。


    我来到那名AIK面前，见她身上中了不下20枪，血几乎流干了。她的眼睛灰蒙蒙一片，像是在朝着那灰色的天空发愣。我抚摸着她的眼皮，让她闭上了眼睛。


    远处，幸存的壁人们也从通天塔的外围爬了下来，他们在地面上寻找着自己的同胞，一些壁人想过来，但是看着不远处对他们充满敌意的陆警和军队，便止步不前。


    若是在他们还不认识枪的时候，他们会过来的。但是代价，更为惨痛。


    我抚摸着最后一名AIK的头发，帮她抹去眼泪，搂在怀里：“现在不是伤心的时候，我们得尽快离开这里……”


    我感觉到她的脖颈动了动。这种感觉很奇妙。她长着和我最爱的人相同的容貌，却又是个完全不同的人。施文郁远远地看着我，我看向他的时候，他转过了头，从上衣兜里拿出一个透明的玻璃板，开启了一个全息地球，寻找着什么。


    离开AIK，我才向其他人道：“阿历克斯抢了我的枪！”


    “又是那小浑蛋，早知道就该先杀了他！”


    “我们怎么办？”


    “召集大家，一起走！”我向施文郁道，“这是什么地方，有位置信息吗？”


    他摇了摇头：“没有任何信号，地球上空仅有的卫星已经被AI俘虏了，而利莫里亚的定位系统，此时也没了消息，我猜……它已经毁了。”


    远方乌压压的一片人，已经有数百士兵正在集结，其中不少人都虎视眈眈地望着我们几个人。他们看见我之后，其中一些人稍微放松了下来。


    “北极之光！”一个男孩朝我喊道。


    事不宜迟，我将现在的形势简要向这些陆警、机动队战士介绍了一下，但至于和神的问题，根本没有时间解释，也解释不清。


    “同胞们，正如你们亲眼所见，我无须多言。我们已经被AI逼到了绝境，利莫里亚已经毁灭，我们现在是人类历史上仅存的几万人！”


    “赵仲明！”一声熟悉的呼喊，却见黄战斗一瘸一拐地从远处跑来。


    “黄豆子，你怎么在这里？”


    黄战斗长叹一声：“别问了，这是我的耻辱！第四大队……或许……全军覆没了！”


    我拍着他的后背以示安慰：“此时不是过度自责和伤心的时候，你看，还有这么多人需要我们这些当兵的保护。兄弟，振作起来！”我朝着周围的士兵也喊道，“大家振作起来，AI虽然强大，但只要我们心存希望，他们就不能将我们赶尽杀绝！”


    有一名士兵喊道：“队长，我们听你指挥！”周围有200多名陆警和机动队员都围拢过来。


    “你们……”


    他们和黄战斗一样低下头颅。


    在自己的同胞都战死之后，活下来的人，并没有任何荣耀，无论这场战役是输是赢。


    “大家振作起来！”我指着远方的壁人道，“你们可能觉得他们是怪物，但几乎没有人知道，他们和我们同样在利莫里亚生活了十几年。我们在上，而他们在下，一代又一代的壁人，都是以维护利莫里亚的运行为使命。然而就在刚刚，他们，用数千条性命，来践行自己的使命和天职！大家不要对壁人怀有敌意，相反，我们应该敬重他们！同时，我们作为军人，也要铭记自己的使命！利莫里亚虽然毁了，但我们的职责并未结束！”


    他们逐渐抬起头，黄战斗转身向他们朗声喊道：“军人们，你们到底为谁而战！”


    “为了全人类！”


    200名士兵和陆警分散去通知周围的人，准备听我命令进行转移。我来到壁人之间，感谢与安慰的话都是多余的，他们幸存下来的只有不足百人，此时正互相搀扶着，始终与我们保持距离。


    我在尸体堆中发现了伯七耳，他胸部以下的身体全部被烤焦了。冷风中弥漫着焦煳的味道。远处那些不明情况的年轻男女，不仅嫌弃地捂住了口鼻，还向壁人们竖起了中指。


    我搂着一个因孩子死去而伤心痛哭的女壁人，向他们说道：“会好的，会好的，你们对我们的恩情，我不会让任何人忘记……”


    幸存的壁人们也搂住了我，他们一层又一层地搂着自己的同胞向我围过来，默默地将头低下。我抬眼看向那12层的高塔，它就像是一座丰碑，上面镌刻着智人的悲哀与壁人的荣耀，人类本已泯灭的人性之光，在此刻光芒四射。


    远处的烟火中，几个壁人领着一群尼人孩子列队走来，我看见了领头的楚庚和吴丙，他们沉稳地组织着同学们列队前行，没有人哭闹，各自面色凝重地应对着旁人异样的眼光。直到他们走过我身旁，看见了孔丘和爱因斯坦等人，这群孩子才大喊着一声声“老师”，向着他们跑过去，师生们哭作一团。


    短短数月，生离死别轮番上演，500个学生仅存六七十名，他们小小年纪便经历了人世间最痛苦的课程，已然足够让他们长大。我遥望着他们，视线模糊，抬起的脚终究还是放下了。孔丘等人知我心意，也没有把我真正的身份告诉孩子们。


    军人和陆警的队伍慢慢壮大起来，当初一些人为了逃生换上了普通人的衣服，但或许是内心的自责令他们忏悔，越来越多的人自发地加入到了组织秩序的队伍中。


    阿历克斯与13位神还是没有下来。


    孔丘道：“不下来最好，我们即刻出发吧。”


    我说道：“他们恐怕是担心大家会群起而攻，算了，让他们自生自灭吧。”


    孙武道：“或许他们比我们活下来的可能性更大，毕竟，我们这支队伍过于庞大了……而且，问题太多，将近2万人，每天要吃的饭就得许多，然而我们去哪里找这么多粮食？”


    我望着远方的群山起伏，大山下面，则是缓缓的草原。“如果这是北美，或许还会有些动物可以猎食。”


    “满足2万人？”


    这时候，施文郁走了过来：“此处在曾经的黄石公园附近，”他指着群山后面的方向，“那里应该有一座因为核弹而爆发的火山，火山正南方有一个不小的湖泊，距离我们50公里左右。”


    孙武点了点头：“自古行军打仗，依山傍水而居。有湖泊的话，至少淡水能够解决；而山峦起伏，就有隐蔽之处，AI攻来，也便于我们隐藏。”


    话不多说，这支庞大的队伍在严寒之中缓缓向山峦中开进。我与孙武、爱因斯坦走在最前面，之后是孔丘、程雪等人。壁人跟在我们之后，再后面是尼人孩子，跟在孩子后面的则是几十名荷枪实弹的军人，最后面的是漫长的队伍，陆警和军人走在队伍两侧，负责维持秩序。队伍内部发出骚动，这些年轻人不知道目的，所以对此行心存疑虑，我便将我们行军的目的传达了下去，这才安抚了他们的情绪。


    高山虽然看着近，但走了至少六个小时才到山脚下，由于有不少伤员，我们每小时行军的速度只有三四公里。不过他们经历了生死，倒是更加懂得团结的可贵，于是健康的人轮流背着或者担着伤者，徐徐前行。


    当下地面温度在零下10摄氏度左右，而所有人现在穿的都是28摄氏度恒温时的衣服，所以，严寒比长距离的跋涉更为考验人的耐力。绝大部分年轻人从没有吃过这么大的苦头，就连训练有素的军队，也是第一次遭遇大地母亲的残酷。


    后面陆续有一些声音传进我的耳朵，多是指责那将核弹丢下来的人，他改变了地球的气候，让本来温暖的北美大地，成为了一片冰雪地狱。他们不知道我是程复，其实也无须知道。


    前方是一道狭窄的山谷，中间那条破旧的公路已经被冰雪、杂草掩盖了大半。我们沿着公路行进，一路上见到了不少垮掉的便利店、残破的墙壁、被破坏的加油站和一块块被挖出的圆形或者正方形的大坑，深坑的直径普遍10米到20米不等，有时候深坑连接成一片，不知道当时的人为什么要这么做，我猜测或许是某些未完成的工程现场。


    我上身只穿着一件薄衬衫，外套给了克隆程雪，但她依然冻得发抖。临出发之前，我从一个死去的壁人身上找到了一件毯子，给她披了上去。此时她和娜塔莎相互搀扶着走在我后面。


    “哥哥！”她忽然喊住我，“你没觉得这些坑很怪？”


    “怪？”


    “你……忘了？”


    “忘了什么？”


    “那间林中小屋，樱子的家。”


    我恍然。经克隆程雪提醒，我再看那一个个深坑，更像是上面有过房子。而那连续的坑，更能说明这里以前似乎是个村庄。坑边沿看不到机器和工具的痕迹，边沿是很规整的弧形，如果说是老鼠刨出来的，好像更有说服力。


    我大喜过望：“若真是如此，我们就有救了！”


    克隆程雪一脸惊诧：“如果真是那群家伙……岂不更危险！多恶心……”


    其他人都好奇，于是我把曾经被老鼠拖着房子跑进了老鼠王国的故事讲给他们，听到老鼠的时候，只有孙武和孔丘是兴奋的。


    孙武道：“如果它们真的是一支经过训练的老鼠军团，那我还真是想和它们斗斗兵法。”


    孔丘道：“和老鼠有什么打的？不过，若真是如程复所言，我们至少有肉吃了，可解燃眉之急！”


    我笑道：“倒是暂时不用吃老鼠，那群老鼠养了成千上万头牛羊！”


    后面有个士兵跑了过来，在我面前敬礼道：“报告，后面有很多学生体力不支，申请休息！”我点了点头，让大家原地休息15分钟再行进。


    壁人比我们更惨一些，他们从来没有穿鞋子的习惯，如今光着那带着吸盘的脚踩在冰凉的石头上，痛苦自然不必说。但是没有一个壁人抱怨，他们只是轮流背着幸存者，默默跟在我们身后。


    休息的时候，壁人们各自坐在地上，互相帮助同胞搓着脚底，刚才走在壁人后面的50名左右的士兵，忽然绕到了壁人的周围。他们好奇地看着壁人，但是我总觉得他们的眼神有些异样。


    空洞？或许是寒冷让他们也产生痛苦了吧。


    娜塔莎道：“这样时间长了，有可能会造成冻伤。”


    她说这话的时候，又有十几个人溜溜达达地绕到了我们前面，仿佛无意似的溜达，但我总觉得有什么不对劲。


    “怎么了？”娜塔莎从我脸上捕捉到了我的心理活动。


    “没什么……”我走向路旁，拔了一些干草在手里搓了搓，拿到壁人们当中，“我知道你们修理利莫里亚的技艺精湛，但我不知道，你们是否能够利用这种干草，为自己编织一双草鞋？”


    “我们连鞋都不能穿，又谈何草鞋呢？”一个壁人道，“我担心我们穿上鞋，反而会栽倒！”


    “总是要试试。我们的路程走了没到一半，下面还有很远，如果穿上草鞋，至少可以对足部产生保护作用。”


    几个壁人听了之后，便和我一样，在路旁的干草里寻找合适的材料，然后又研究了一番我们穿的鞋子，自己开始编织起来。几个士兵好奇地围了过来，他们的动作有点缓慢，我总觉得哪里不对劲。


    “你们这是怎么了？”我向近旁两个士兵问道，他们没有回答，只是看着壁人编织草鞋。


    待我想第二次发问的时候，其中一人忽然抬起头，向我说道：“很好！”


    他的眼神空洞，这种空洞是那么熟悉……我从哪儿看到过……


    阿历克斯！


    阿历克斯向我们开枪的时候，也是这样的眼神。


    一阵寒意从我内心升起。但我并不觉得他们会像阿历克斯一样，可为什么他们的眼神变了？这小伙子给我的印象还是比较深的，集结队伍的时候，他行动非常积极，精神抖擞，可现在却像变了个人。


    “下来之后，是不是身体不适应？”


    “适……应……”仅仅两个字，他却以一种极为迟钝的语气回答出来。


    “你叫什么名字？”


    “我……叫……”他停住了。


    我心中大骇。正在此时，他仿佛猛然醒来似的，看着面前的我，表情有些古怪，然后迅速向我敬了一个礼：“十分抱歉，我刚才像是睡着了。”


    “我没有责怪你……”


    我再看向其他的士兵，他们的眼神依然麻木。


    我将发现的这些诡异状况告诉了孔丘和孙武，孙武猜测，或许和当地的气候或者磁场有关系。


    “莫非空气中有毒？”孔丘道。


    孙武摇了摇头：“如果中毒的话，其他人肯定也会这样，为什么只是这些士兵？”


    “怪哉怪哉。”


    我嘱咐他们当心。


    # 第十章 九死一生


    ## 1


    壁人们心灵手巧，很快每人就编了一双鞋子，并尝试穿着鞋子在地上走路，有些人走得顺撇，逗得尼人孩子发笑，但他们很快便适应了鞋子，有人索性又编了手套，趴在地上行走。


    队伍继续前进了两个小时才走出山谷，来到了另外一片平缓的草甸地带，远方5公里左右，果然有一片深色的湖水。这里的气温比外面稍微高一些，大概是得益于湖面水域的气候调节作用。


    温度已是零下，可湖水竟然没有结冰，着实出乎我们的意料。见到湖水之后，我们无形之中加快了步伐，又走了一个多小时，前面的人已经走到了湖的旁边。


    站在湖畔，寒风变得清冷湿润。我望着远方的山，不禁好奇地向克隆程雪问道：“我们上次来，这里还被白色的雾霾笼罩着，如今为什么雾霾不见了？”


    克隆程雪也纳闷：“被风吹走了？”


    娜塔莎则推测：“或许属于一种季节性气候，每个月都不一样。”


    施文郁和牛顿对湖水简单地研究了一番，确定可以饮用，众人心下稍安。我让士兵传令今晚在此过夜，施文郁推测，湖水或许和地下火山有关系。他指着一个入水口——是两山之间的一个岔口。“那边云雾蒸腾，我估计那边有温泉！”


    此话一出，就连壁人都欢呼雀跃。


    后续部队终于全部走出了山口，但是离最后的人到达这里，还有五六公里的距离。正当我和孙武讨论如何安营扎寨，以及如果遇到危险，将以何种方式撤离的时候，枪声响了。


    密集的枪声。


    伴随着枪声，壁人一个个地倒下；伴随着枪声，最后一名AIK用铁钎撑着地，身体不住地随着子弹打在她后背而颤抖，她的身体掩护之下，是瑟瑟发抖的克隆程雪；伴随着枪声，远处的人都冷漠地站在原地，面无表情地看着这场屠杀，时间仿佛静止了一般。


    刚才我意识到不对劲的士兵，正疯狂地将枪中的子弹射向早就已经不可能生还的壁人和AIK。鲜血在莽苍的草地上飞溅，克隆程雪和娜塔莎尖叫着卧倒在地，牛顿压着孔丘藏在了草地里，施文郁从身后扑向了我和孙武……


    枪声停止了，整齐划一，一如响起时那般。


    他们，究竟在做什么！


    我不顾孙武和施文郁的劝阻，从地上站了起来。


    “你们疯了吗！”我吼道。


    没有人回答。那些刽子手，几乎同时看向了我，也没有通过任何语言的交流，就分成了三拨，一拨走向我，一拨走向孔丘和牛顿，一拨走向了克隆程雪与娜塔莎。


    每一拨10个人，将我们仅存的7人押到了湖边，背朝湖水跪下。他们站在后面，用枪口抵着我们的后脑。


    AIK撑着铁钎，依然没有倒下，她的衣服已经完全被血染红，嘴角还流淌着血，她用尽最后的力气，抬起头看向了我们，眼睛里的哀婉与遗憾，将是我此生最后的痛苦记忆。


    “你们……疯了吗！”


    没有人回答，他们只是沉默地等待着枪决前的最后命令。


    “你们为什么要这么做？我们人类已经走到了绝路，为什么还要不停地自相残杀！”


    依然没有人回答。


    越来越多的人围了过来，每个人都面无表情，眼神空洞。


    直到笑声自人群之后传来，麻木的人群自动让出了一条路，却见亚伯拉罕搂着阿历克斯，从人群中走了出来。后面，是那12位神，面带蔑视。


    亚伯拉罕道：“程复，你终究是输了！你低估了神！”


    “又是你们这群浑蛋！我就该杀了你们！”我恨自己，我多少次吃亏，都是因为自己那愚蠢的仁慈。


    “你高估了自己，即便阿历克斯没有抢走你的枪，你也杀不死我！”


    “是我太蠢了……对待你们这群狼，我不该有任何的仁慈！”


    亚伯拉罕在胸前晃动着右手食指：“不不不，你终究是个凡人——不过，你还是给了我惊喜，我没想到，我竟然不能控制你！”


    “我不会被你控制的！”


    他继续晃动食指：“我们对于控制的理解不同，我指的是——”他右手向上方一指，忽然之间，除了那些神之外，所有人全都指向了天空，他迅速收回手，所有人同时也收回了手，“这就是神迹，你不为神力所控制，还真是大大出乎我的意料。”


    多么熟悉的一幕。在那梦里，我的爷爷程文浩，不就已经展现给我了吗？


    是那控制意识的纳米虫子！


    亚伯拉罕道：“你实在是个惊喜，虽然我不知道为什么我无法控制你，但当我看到娜塔莎之后，就明白了，她一定对你做了什么手脚，如果不是因为这件事，我还不会发现，我也控制不了她。在利莫里亚，竟然有人能够脱离神的控制，这也算一个奇迹！”他走到娜塔莎面前，“小姑娘，我给你一个机会，告诉我，到底是谁教你这么做的！”


    娜塔莎恐惧地摇着头。


    “说！”亚伯拉罕右手掐着她的脖子。


    娜塔莎吃不过痛。“她……已经……死了……”


    “又是程雪？”亚伯拉罕松开了手，“枉我那么信任她，我竟然连她是什么时候背叛我的都不知道！”


    我冷笑了一声。


    “你敢嘲笑我？”他愤怒了。


    “我都是要死的人了，你还以为我会哀求你？”


    “我便要你哀求我！”


    “绝不可能。在我眼里，你并不是真正的神，你不过是把虫子种进人脑的卑劣之徒，这就是你所谓的‘神迹’？这就像一个人操纵着木偶的身体，对别人说‘看看，他多听话，我多伟大’一样可笑，”我瞪着他，“你自欺欺人罢了，你不过是活在自己的幻想中，真正的神，是人内心的信仰，你只征服了这些人的脑部神经，你没有征服他们的心！你更没征服我的心！”


    亚伯拉罕深吸一口气，又吐了出来：“你知道得真是不少，不过，我尊重每个对手。我完全可以用枪指着其中任何一个人的脑袋，逼你就范，但我是神，不屑于这种卑鄙伎俩！罢了、罢了，程复，你也算人类的有功之臣，那我就成全你，待你死后，将你葬在这湖畔！从此刻开始，我将以你的名字命名此湖，以纪念你的牺牲与贡献！”


    “你这无耻的家伙！”


    亚伯拉罕后退几步，回到阿历克斯的身旁，右手搭着他的肩膀：“行刑吧……”


    “父亲，我亲自来！”阿历克斯道。


    “哦？你是我的孩子，杀人这种小事，岂不自贬身份？让那群猪猡干就行了。”


    “父亲！你不知道，这程复之前百般折辱我！我若今日不亲手杀了他，未来的永生之程，也是充满了遗憾！父亲，你就答应我吧！”


    亚伯拉罕道：“既然如此，那这程复便交给你了！”


    “谢谢父亲！”阿历克斯笑道，他一把抢过身旁士兵手中的冲锋枪，来到我的面前，以枪口抵着我的眉心。


    “程复，还记得这片山脉草原吗？我曾经是你的手下败将，但今日，你彻彻底底地输给了我！曾经，你被绞死，但那终究不是我亲手杀的，心头未免遗憾，但今日，老天成全我，我终于可以亲眼看见你，死在我的手中，我的脚下！”


    克隆程雪忽然喊道：“你这浑蛋，我哥当初明明可以杀死你，却没杀你，是你心胸狭隘、卑鄙无耻……”


    “闭嘴，你这母狗！”


    克隆程雪忽然猛地挣脱后面两名士兵的禁锢，从地上蹿起来，斜向上朝着阿历克斯扑去。阿历克斯的枪在开出的刹那，被程雪推了上去。


    “砰砰”两枪，全都打进了天空。


    “妹妹，小心！”我挣扎着喊道，身后的人将我两条胳膊扣得死紧。


    克隆程雪将阿历克斯扑倒在地，张开嘴便咬住了阿历克斯的鼻子，疼得他哇哇大叫，却见克隆程雪一用力，阿历克斯的鼻子连同半张脸皮就被硬生生地扯了下来。


    克隆程雪站了起来背朝着我们，她将那脸皮啐在地上，擦了擦脸上的血，又自己转身回去。阿历克斯在地上疼得像是被插了一刀的猪，可是亚伯拉罕和那几位神却冷漠地看着他，周围的士兵无动于衷，这就说明亚伯拉罕是故意想看看阿历克斯会做何反应的。


    “父亲，好疼啊……”


    亚伯拉罕没有回应。


    阿历克斯睁着一只眼睛，看见的却是面带嘲笑的克隆程雪。


    “母狗，我要杀死你！”他从地上捡起枪，扣动了扳机。


    枪声几乎同时响起，枪口全都对准了阿历克斯。


    阿历克斯缓缓地向后倒去，他不可思议地回头，看向了他梦寐以求想要接近的父亲，实在不明白，他为什么要杀死自己。


    阿历克斯的腹部往上，已经被四面八方的子弹，打得没有一处完整。而他的父亲脸色麻木，直到他失去意识，也没有做出一点回应。


    亚伯拉罕望着那具逐渐变冷的尸体，最终摇了摇头。


    我看了看程雪、娜塔莎，看了看孔丘、爱因斯坦、孙武、牛顿，最终，我看向了施文郁。没有人求饶，甚至没有人哭泣，他们与我对视之后，都闭上了眼睛，等待着命运的终结。


    或许，阿历克斯的死，平息了他们心中的某种怨恨。


    我也闭上了眼睛。


    别了，我爱的所有。


    别了，我的同胞们。


    别了，我那愚蠢至极的梦想。


    我不会带着仇恨死亡。


    这是我唯一能做的事。


    我还可以祝福这些人类同胞，但是祝福的话，我终究是想也懒得再想……


    砰！


    程雪的方向。


    砰！

    '
  trans: '

    我终究是低估了他们。借着一个空隙，我翻身跃入滑梯。滑梯绕了几个弯，大约用了两分钟的时间最终来到地面。


    克隆程雪、娜塔莎、孔丘、爱因斯坦、牛顿、孙武、施文郁等人全都焦急地等着我，他们显然听到了枪声。一名 AIK 正抱着她姐妹的尸体，默然不语，看不出痛苦伤心。


    我来到那名 AIK 面前，见她身上中了不下 20 枪，血几乎流干了。她的眼睛灰蒙蒙一片，像是在朝着那灰色的天空发愣。我抚摸着她的眼皮，让她闭上了眼睛。


    远处，幸存的壁人们也从通天塔的外围爬了下来，他们在地面上寻找着自己的同胞，一些壁人想过来，但是看着不远处对他们充满敌意的陆警和军队，便止步不前。


    若是在他们还不认识枪的时候，他们会过来的。但是代价，更为惨痛。


    我抚摸着最后一名 AIK 的头发，帮她抹去眼泪，搂在怀里：“现在不是伤心的时候，我们得尽快离开这里……”


    我感觉到她的脖颈动了动。这种感觉很奇妙。她长着和我最爱的人相同的容貌，却又是个完全不同的人。施文郁远远地看着我，我看向他的时候，他转过了头，从上衣兜里拿出一个透明的玻璃板，开启了一个全息地球，寻找着什么。


    离开 AIK，我才向其他人道：“阿历克斯抢了我的枪！”


    “又是那小浑蛋，早知道就该先杀了他！”


    “我们怎么办？”


    “召集大家，一起走！”我向施文郁道，“这是什么地方，有位置信息吗？”


    他摇了摇头：“没有任何信号，地球上空仅有的卫星已经被 AI 俘虏了，而利莫里亚的定位系统，此时也没了消息，我猜……它已经毁了。”


    远方乌压压的一片人，已经有数百士兵正在集结，其中不少人都虎视眈眈地望着我们几个人。他们看见我之后，其中一些人稍微放松了下来。


    “北极之光！”一个男孩朝我喊道。


    事不宜迟，我将现在的形势简要向这些陆警、机动队战士介绍了一下，但至于和神的问题，根本没有时间解释，也解释不清。


    “同胞们，正如你们亲眼所见，我无须多言。我们已经被 AI 逼到了绝境，利莫里亚已经毁灭，我们现在是人类历史上仅存的几万人！”


    “赵仲明！”一声熟悉的呼喊，却见黄战斗一瘸一拐地从远处跑来。


    “黄豆子，你怎么在这里？”


    黄战斗长叹一声：“别问了，这是我的耻辱！第四大队……或许……全军覆没了！”


    我拍着他的后背以示安慰：“此时不是过度自责和伤心的时候，你看，还有这么多人需要我们这些当兵的保护。兄弟，振作起来！”我朝着周围的士兵也喊道，“大家振作起来，AI
    虽然强大，但只要我们心存希望，他们就不能将我们赶尽杀绝！”


    有一名士兵喊道：“队长，我们听你指挥！”周围有 200 多名陆警和机动队员都围拢过来。


    “你们……”


    他们和黄战斗一样低下头颅。


    在自己的同胞都战死之后，活下来的人，并没有任何荣耀，无论这场战役是输是赢。


    “大家振作起来！”我指着远方的壁人道，“你们可能觉得他们是怪物，但几乎没有人知道，他们和我们同样在利莫里亚生活了十几年。我们在上，而他们在下，一代又一代的壁人，都是以维护利莫里亚的运行为使命。然而就在刚刚，他们，用数千条性命，来践行自己的使命和天职！大家不要对壁人怀有敌意，相反，我们应该敬重他们！同时，我们作为军人，也要铭记自己的使命！利莫里亚虽然毁了，但我们的职责并未结束！”


    他们逐渐抬起头，黄战斗转身向他们朗声喊道：“军人们，你们到底为谁而战！”


    “为了全人类！”


    200 名士兵和陆警分散去通知周围的人，准备听我命令进行转移。我来到壁人之间，感谢与安慰的话都是多余的，他们幸存下来的只有不足百人，此时正互相搀扶着，始终与我们保持距离。


    我在尸体堆中发现了伯七耳，他胸部以下的身体全部被烤焦了。冷风中弥漫着焦煳的味道。远处那些不明情况的年轻男女，不仅嫌弃地捂住了口鼻，还向壁人们竖起了中指。


    我搂着一个因孩子死去而伤心痛哭的女壁人，向他们说道：“会好的，会好的，你们对我们的恩情，我不会让任何人忘记……”


    幸存的壁人们也搂住了我，他们一层又一层地搂着自己的同胞向我围过来，默默地将头低下。我抬眼看向那 12 层的高塔，它就像是一座丰碑，上面镌刻着智人的悲哀与壁人的荣耀，人类本已泯灭的人性之光，在此刻光芒四射。


    远处的烟火中，几个壁人领着一群尼人孩子列队走来，我看见了领头的楚庚和吴丙，他们沉稳地组织着同学们列队前行，没有人哭闹，各自面色凝重地应对着旁人异样的眼光。直到他们走过我身旁，看见了孔丘和爱因斯坦等人，这群孩子才大喊着一声声“老师”，向着他们跑过去，师生们哭作一团。


    短短数月，生离死别轮番上演，500 个学生仅存六七十名，他们小小年纪便经历了人世间最痛苦的课程，已然足够让他们长大。我遥望着他们，视线模糊，抬起的脚终究还是放下了。孔丘等人知我心意，也没有把我真正的身份告诉孩子们。


    军人和陆警的队伍慢慢壮大起来，当初一些人为了逃生换上了普通人的衣服，但或许是内心的自责令他们忏悔，越来越多的人自发地加入到了组织秩序的队伍中。


    阿历克斯与 13 位神还是没有下来。


    孔丘道：“不下来最好，我们即刻出发吧。”


    我说道：“他们恐怕是担心大家会群起而攻，算了，让他们自生自灭吧。”


    孙武道：“或许他们比我们活下来的可能性更大，毕竟，我们这支队伍过于庞大了……而且，问题太多，将近 2 万人，每天要吃的饭就得许多，然而我们去哪里找这么多粮食？”


    我望着远方的群山起伏，大山下面，则是缓缓的草原。“如果这是北美，或许还会有些动物可以猎食。”


    “满足 2 万人？”


    这时候，施文郁走了过来：“此处在曾经的黄石公园附近，”他指着群山后面的方向，“那里应该有一座因为核弹而爆发的火山，火山正南方有一个不小的湖泊，距离我们 50
    公里左右。”


    孙武点了点头：“自古行军打仗，依山傍水而居。有湖泊的话，至少淡水能够解决；而山峦起伏，就有隐蔽之处，AI 攻来，也便于我们隐藏。”


    话不多说，这支庞大的队伍在严寒之中缓缓向山峦中开进。我与孙武、爱因斯坦走在最前面，之后是孔丘、程雪等人。壁人跟在我们之后，再后面是尼人孩子，跟在孩子后面的则是几十名荷枪实弹的军人，最后面的是漫长的队伍，陆警和军人走在队伍两侧，负责维持秩序。队伍内部发出骚动，这些年轻人不知道目的，所以对此行心存疑虑，我便将我们行军的目的传达了下去，这才安抚了他们的情绪。


    高山虽然看着近，但走了至少六个小时才到山脚下，由于有不少伤员，我们每小时行军的速度只有三四公里。不过他们经历了生死，倒是更加懂得团结的可贵，于是健康的人轮流背着或者担着伤者，徐徐前行。


    当下地面温度在零下 10 摄氏度左右，而所有人现在穿的都是 28 摄氏度恒温时的衣服，所以，严寒比长距离的跋涉更为考验人的耐力。绝大部分年轻人从没有吃过这么大的苦头，就连训练有素的军队，也是第一次遭遇大地母亲的残酷。


    后面陆续有一些声音传进我的耳朵，多是指责那将核弹丢下来的人，他改变了地球的气候，让本来温暖的北美大地，成为了一片冰雪地狱。他们不知道我是程复，其实也无须知道。


    前方是一道狭窄的山谷，中间那条破旧的公路已经被冰雪、杂草掩盖了大半。我们沿着公路行进，一路上见到了不少垮掉的便利店、残破的墙壁、被破坏的加油站和一块块被挖出的圆形或者正方形的大坑，深坑的直径普遍
    10 米到 20 米不等，有时候深坑连接成一片，不知道当时的人为什么要这么做，我猜测或许是某些未完成的工程现场。


    我上身只穿着一件薄衬衫，外套给了克隆程雪，但她依然冻得发抖。临出发之前，我从一个死去的壁人身上找到了一件毯子，给她披了上去。此时她和娜塔莎相互搀扶着走在我后面。


    “哥哥！”她忽然喊住我，“你没觉得这些坑很怪？”


    “怪？”


    “你……忘了？”


    “忘了什么？”


    “那间林中小屋，樱子的家。”


    我恍然。经克隆程雪提醒，我再看那一个个深坑，更像是上面有过房子。而那连续的坑，更能说明这里以前似乎是个村庄。坑边沿看不到机器和工具的痕迹，边沿是很规整的弧形，如果说是老鼠刨出来的，好像更有说服力。


    我大喜过望：“若真是如此，我们就有救了！”


    克隆程雪一脸惊诧：“如果真是那群家伙……岂不更危险！多恶心……”


    其他人都好奇，于是我把曾经被老鼠拖着房子跑进了老鼠王国的故事讲给他们，听到老鼠的时候，只有孙武和孔丘是兴奋的。


    孙武道：“如果它们真的是一支经过训练的老鼠军团，那我还真是想和它们斗斗兵法。”


    孔丘道：“和老鼠有什么打的？不过，若真是如程复所言，我们至少有肉吃了，可解燃眉之急！”


    我笑道：“倒是暂时不用吃老鼠，那群老鼠养了成千上万头牛羊！”


    后面有个士兵跑了过来，在我面前敬礼道：“报告，后面有很多学生体力不支，申请休息！”我点了点头，让大家原地休息 15 分钟再行进。


    壁人比我们更惨一些，他们从来没有穿鞋子的习惯，如今光着那带着吸盘的脚踩在冰凉的石头上，痛苦自然不必说。但是没有一个壁人抱怨，他们只是轮流背着幸存者，默默跟在我们身后。


    休息的时候，壁人们各自坐在地上，互相帮助同胞搓着脚底，刚才走在壁人后面的 50 名左右的士兵，忽然绕到了壁人的周围。他们好奇地看着壁人，但是我总觉得他们的眼神有些异样。


    空洞？或许是寒冷让他们也产生痛苦了吧。


    娜塔莎道：“这样时间长了，有可能会造成冻伤。”


    她说这话的时候，又有十几个人溜溜达达地绕到了我们前面，仿佛无意似的溜达，但我总觉得有什么不对劲。


    “怎么了？”娜塔莎从我脸上捕捉到了我的心理活动。


    “没什么……”我走向路旁，拔了一些干草在手里搓了搓，拿到壁人们当中，“我知道你们修理利莫里亚的技艺精湛，但我不知道，你们是否能够利用这种干草，为自己编织一双草鞋？”


    “我们连鞋都不能穿，又谈何草鞋呢？”一个壁人道，“我担心我们穿上鞋，反而会栽倒！”


    “总是要试试。我们的路程走了没到一半，下面还有很远，如果穿上草鞋，至少可以对足部产生保护作用。”


    几个壁人听了之后，便和我一样，在路旁的干草里寻找合适的材料，然后又研究了一番我们穿的鞋子，自己开始编织起来。几个士兵好奇地围了过来，他们的动作有点缓慢，我总觉得哪里不对劲。


    “你们这是怎么了？”我向近旁两个士兵问道，他们没有回答，只是看着壁人编织草鞋。


    待我想第二次发问的时候，其中一人忽然抬起头，向我说道：“很好！”


    他的眼神空洞，这种空洞是那么熟悉……我从哪儿看到过……


    阿历克斯！


    阿历克斯向我们开枪的时候，也是这样的眼神。


    一阵寒意从我内心升起。但我并不觉得他们会像阿历克斯一样，可为什么他们的眼神变了？这小伙子给我的印象还是比较深的，集结队伍的时候，他行动非常积极，精神抖擞，可现在却像变了个人。


    “下来之后，是不是身体不适应？”


    “适……应……”仅仅两个字，他却以一种极为迟钝的语气回答出来。


    “你叫什么名字？”


    “我……叫……”他停住了。


    我心中大骇。正在此时，他仿佛猛然醒来似的，看着面前的我，表情有些古怪，然后迅速向我敬了一个礼：“十分抱歉，我刚才像是睡着了。”


    “我没有责怪你……”


    我再看向其他的士兵，他们的眼神依然麻木。


    我将发现的这些诡异状况告诉了孔丘和孙武，孙武猜测，或许和当地的气候或者磁场有关系。


    “莫非空气中有毒？”孔丘道。


    孙武摇了摇头：“如果中毒的话，其他人肯定也会这样，为什么只是这些士兵？”


    “怪哉怪哉。”


    我嘱咐他们当心。


    # 第十章 九死一生


    ## 1


    壁人们心灵手巧，很快每人就编了一双鞋子，并尝试穿着鞋子在地上走路，有些人走得顺撇，逗得尼人孩子发笑，但他们很快便适应了鞋子，有人索性又编了手套，趴在地上行走。


    队伍继续前进了两个小时才走出山谷，来到了另外一片平缓的草甸地带，远方 5 公里左右，果然有一片深色的湖水。这里的气温比外面稍微高一些，大概是得益于湖面水域的气候调节作用。


    温度已是零下，可湖水竟然没有结冰，着实出乎我们的意料。见到湖水之后，我们无形之中加快了步伐，又走了一个多小时，前面的人已经走到了湖的旁边。


    站在湖畔，寒风变得清冷湿润。我望着远方的山，不禁好奇地向克隆程雪问道：“我们上次来，这里还被白色的雾霾笼罩着，如今为什么雾霾不见了？”


    克隆程雪也纳闷：“被风吹走了？”


    娜塔莎则推测：“或许属于一种季节性气候，每个月都不一样。”


    施文郁和牛顿对湖水简单地研究了一番，确定可以饮用，众人心下稍安。我让士兵传令今晚在此过夜，施文郁推测，湖水或许和地下火山有关系。他指着一个入水口——是两山之间的一个岔口。“那边云雾蒸腾，我估计那边有温泉！”


    此话一出，就连壁人都欢呼雀跃。


    后续部队终于全部走出了山口，但是离最后的人到达这里，还有五六公里的距离。正当我和孙武讨论如何安营扎寨，以及如果遇到危险，将以何种方式撤离的时候，枪声响了。


    密集的枪声。


    伴随着枪声，壁人一个个地倒下；伴随着枪声，最后一名 AIK 用铁钎撑着地，身体不住地随着子弹打在她后背而颤抖，她的身体掩护之下，是瑟瑟发抖的克隆程雪；伴随着枪声，远处的人都冷漠地站在原地，面无表情地看着这场屠杀，时间仿佛静止了一般。


    刚才我意识到不对劲的士兵，正疯狂地将枪中的子弹射向早就已经不可能生还的壁人和 AIK。鲜血在莽苍的草地上飞溅，克隆程雪和娜塔莎尖叫着卧倒在地，牛顿压着孔丘藏在了草地里，施文郁从身后扑向了我和孙武……


    枪声停止了，整齐划一，一如响起时那般。


    他们，究竟在做什么！


    我不顾孙武和施文郁的劝阻，从地上站了起来。


    “你们疯了吗！”我吼道。


    没有人回答。那些刽子手，几乎同时看向了我，也没有通过任何语言的交流，就分成了三拨，一拨走向我，一拨走向孔丘和牛顿，一拨走向了克隆程雪与娜塔莎。


    每一拨 10 个人，将我们仅存的 7 人押到了湖边，背朝湖水跪下。他们站在后面，用枪口抵着我们的后脑。


    AIK 撑着铁钎，依然没有倒下，她的衣服已经完全被血染红，嘴角还流淌着血，她用尽最后的力气，抬起头看向了我们，眼睛里的哀婉与遗憾，将是我此生最后的痛苦记忆。


    “你们……疯了吗！”


    没有人回答，他们只是沉默地等待着枪决前的最后命令。


    “你们为什么要这么做？我们人类已经走到了绝路，为什么还要不停地自相残杀！”


    依然没有人回答。


    越来越多的人围了过来，每个人都面无表情，眼神空洞。


    直到笑声自人群之后传来，麻木的人群自动让出了一条路，却见亚伯拉罕搂着阿历克斯，从人群中走了出来。后面，是那 12 位神，面带蔑视。


    亚伯拉罕道：“程复，你终究是输了！你低估了神！”


    “又是你们这群浑蛋！我就该杀了你们！”我恨自己，我多少次吃亏，都是因为自己那愚蠢的仁慈。


    “你高估了自己，即便阿历克斯没有抢走你的枪，你也杀不死我！”


    “是我太蠢了……对待你们这群狼，我不该有任何的仁慈！”


    亚伯拉罕在胸前晃动着右手食指：“不不不，你终究是个凡人——不过，你还是给了我惊喜，我没想到，我竟然不能控制你！”


    “我不会被你控制的！”


    他继续晃动食指：“我们对于控制的理解不同，我指的是——”他右手向上方一指，忽然之间，除了那些神之外，所有人全都指向了天空，他迅速收回手，所有人同时也收回了手，“这就是神迹，你不为神力所控制，还真是大大出乎我的意料。”


    多么熟悉的一幕。在那梦里，我的爷爷程文浩，不就已经展现给我了吗？


    是那控制意识的纳米虫子！


    亚伯拉罕道：“你实在是个惊喜，虽然我不知道为什么我无法控制你，但当我看到娜塔莎之后，就明白了，她一定对你做了什么手脚，如果不是因为这件事，我还不会发现，我也控制不了她。在利莫里亚，竟然有人能够脱离神的控制，这也算一个奇迹！”他走到娜塔莎面前，“小姑娘，我给你一个机会，告诉我，到底是谁教你这么做的！”


    娜塔莎恐惧地摇着头。


    “说！”亚伯拉罕右手掐着她的脖子。


    娜塔莎吃不过痛。“她……已经……死了……”


    “又是程雪？”亚伯拉罕松开了手，“枉我那么信任她，我竟然连她是什么时候背叛我的都不知道！”


    我冷笑了一声。


    “你敢嘲笑我？”他愤怒了。


    “我都是要死的人了，你还以为我会哀求你？”


    “我便要你哀求我！”


    “绝不可能。在我眼里，你并不是真正的神，你不过是把虫子种进人脑的卑劣之徒，这就是你所谓的‘神迹’？这就像一个人操纵着木偶的身体，对别人说‘看看，他多听话，我多伟大’一样可笑，”我瞪着他，“你自欺欺人罢了，你不过是活在自己的幻想中，真正的神，是人内心的信仰，你只征服了这些人的脑部神经，你没有征服他们的心！你更没征服我的心！”


    亚伯拉罕深吸一口气，又吐了出来：“你知道得真是不少，不过，我尊重每个对手。我完全可以用枪指着其中任何一个人的脑袋，逼你就范，但我是神，不屑于这种卑鄙伎俩！罢了、罢了，程复，你也算人类的有功之臣，那我就成全你，待你死后，将你葬在这湖畔！从此刻开始，我将以你的名字命名此湖，以纪念你的牺牲与贡献！”


    “你这无耻的家伙！”


    亚伯拉罕后退几步，回到阿历克斯的身旁，右手搭着他的肩膀：“行刑吧……”


    “父亲，我亲自来！”阿历克斯道。


    “哦？你是我的孩子，杀人这种小事，岂不自贬身份？让那群猪猡干就行了。”


    “父亲！你不知道，这程复之前百般折辱我！我若今日不亲手杀了他，未来的永生之程，也是充满了遗憾！父亲，你就答应我吧！”


    亚伯拉罕道：“既然如此，那这程复便交给你了！”


    “谢谢父亲！”阿历克斯笑道，他一把抢过身旁士兵手中的冲锋枪，来到我的面前，以枪口抵着我的眉心。


    “程复，还记得这片山脉草原吗？我曾经是你的手下败将，但今日，你彻彻底底地输给了我！曾经，你被绞死，但那终究不是我亲手杀的，心头未免遗憾，但今日，老天成全我，我终于可以亲眼看见你，死在我的手中，我的脚下！”


    克隆程雪忽然喊道：“你这浑蛋，我哥当初明明可以杀死你，却没杀你，是你心胸狭隘、卑鄙无耻……”


    “闭嘴，你这母狗！”


    克隆程雪忽然猛地挣脱后面两名士兵的禁锢，从地上蹿起来，斜向上朝着阿历克斯扑去。阿历克斯的枪在开出的刹那，被程雪推了上去。


    “砰砰”两枪，全都打进了天空。


    “妹妹，小心！”我挣扎着喊道，身后的人将我两条胳膊扣得死紧。


    克隆程雪将阿历克斯扑倒在地，张开嘴便咬住了阿历克斯的鼻子，疼得他哇哇大叫，却见克隆程雪一用力，阿历克斯的鼻子连同半张脸皮就被硬生生地扯了下来。


    克隆程雪站了起来背朝着我们，她将那脸皮啐在地上，擦了擦脸上的血，又自己转身回去。阿历克斯在地上疼得像是被插了一刀的猪，可是亚伯拉罕和那几位神却冷漠地看着他，周围的士兵无动于衷，这就说明亚伯拉罕是故意想看看阿历克斯会做何反应的。


    “父亲，好疼啊……”


    亚伯拉罕没有回应。


    阿历克斯睁着一只眼睛，看见的却是面带嘲笑的克隆程雪。


    “母狗，我要杀死你！”他从地上捡起枪，扣动了扳机。


    枪声几乎同时响起，枪口全都对准了阿历克斯。


    阿历克斯缓缓地向后倒去，他不可思议地回头，看向了他梦寐以求想要接近的父亲，实在不明白，他为什么要杀死自己。


    阿历克斯的腹部往上，已经被四面八方的子弹，打得没有一处完整。而他的父亲脸色麻木，直到他失去意识，也没有做出一点回应。


    亚伯拉罕望着那具逐渐变冷的尸体，最终摇了摇头。


    我看了看程雪、娜塔莎，看了看孔丘、爱因斯坦、孙武、牛顿，最终，我看向了施文郁。没有人求饶，甚至没有人哭泣，他们与我对视之后，都闭上了眼睛，等待着命运的终结。


    或许，阿历克斯的死，平息了他们心中的某种怨恨。


    我也闭上了眼睛。


    别了，我爱的所有。


    别了，我的同胞们。


    别了，我那愚蠢至极的梦想。


    我不会带着仇恨死亡。


    这是我唯一能做的事。


    我还可以祝福这些人类同胞，但是祝福的话，我终究是想也懒得再想……


    砰！


    程雪的方向。


    砰！

