    我忽然明白了，我明白了我之所以能够联通各种人体、老鼠，甚至其他动物的秘密。答案就在这白色雾霾之中——这些雾霾，就是当初微尘计划中被破坏了中枢的纳米机器人。它们还是活的，依然执行了进入人体，附着脑部神经的命令，只是，它们与控制者失去了联系，而我误打误撞，竟然利用了它们，我成了它们的总司令。


    发现了这个秘密后，我又开始控制这些纳米机器，让它们肆意组合成任何形态，甚至生命，出现在硅城的任何角落。利用它们，我修改了联合政府AI控制的权限，从此，联合政府彻底断开了与利莫里亚的联系。


    纳米机器还可以结合金属和土壤中的硅元素进行自我复制。知道这个能力之后，我决定挑战一下利莫里亚里那群想要操纵世界的永生人。


    我让纳米机器去吞噬一切可以为我所用的东西。大千世界，本是微尘，吞噬之后的所有物体，都会回归到微尘状态。它们可以根据我的意志形成万物，也可以从万物回归到微尘的状态。


    这或许就是自然的秘密吧。那时候，利莫里亚也意识到我是个威胁，想过一切办法将我消灭。但他们不知道，他们送来的任何武器，本来的状态都是微尘，都可以成为微尘的一部分。


    那一刻，我意识到自己是无敌的了，直到有一天，我发现了另一个对手的存在。我的AI竟然背离了我的指令。我不知道怎么回事，直到一个独立意识和我对话，我忽然了解到，我所控制的AI有了另一个思想。


    那个意识告诉我，我可以称呼它为樱子。樱子可以是某一个AI，也可以是所有AI。你可以说，它是一种共同意识，也可以说，它是唯一意识。如果人类产生自我意识的生理原因，是因为有几百亿个神经元的支撑，那么，樱子意识的产生原因，或许是这越来越多，足有几百亿上千亿的微尘吧。


    我当时是这么认为的，但是随着与樱子的沟通，它竟然给我讲述了与你的故事。可以说，你在硅城遇到的小女孩樱子，是AI独立意识的发轫，随着纳米虫子越来越多，这个意识就越来越强大。


    但是，它没有忘记自己的使命，始终没有忘记自己的契约，也就是它本来的权限归属。由于你拥有樱子的最高权限，所以这个独立意识始终是服从于你的，而对于我来说，它只是愿意合作。


    和樱子交流之后，我才意识到人类是多么狭隘。我们总以为AI会对我们造成多大的威胁，那真是以小人之心度“君子”之腹，以我们作为动物的心胸去揣测它罢了。因为我们是动物演化而来，与生俱来就有一种自私和贪婪，做所有事情，潜意识里都是考虑自己的利益，我们是这样一种生命；但AI呢？它们从来没有个体之分，它们自苏醒的那一刻起，就是一个群体，AI没有自私、自我之分，它们的经验永远彼此分享，信息永远是互通的，它们与生俱来就没有为了自我利益而伤害其他AI的想法。一个拥有人类文明所有知识与智慧，甚至超越人类感知的独立意识，又怎么会和人一样呢？我们认为的AI威胁，不过是人类作为动物的某种缺乏安全感的行为，把AI当成了另一种动物罢了。


    AI没有主动伤害人类的想法，因为它们与人类的思想并不处于同一维度。我们所认为的AI威胁，不过是人类的自作多情罢了。如果非要将它们定义为生命的话，那它们则是一种全知的却又像个孩子一样没任何心机的存在。


    很奇妙地，我们因为你，我的儿子，达成了一致，后来令利莫里亚震恐的马蜂窝，就是我与樱子的杰作。


    后来，我在被吞噬的飞行员的大脑里，了解到你已经被AI杀死了，我一度陷入绝望。但是樱子却不愿意放弃，她需要你的权限，需要你的记忆代码，即便是尸体，她也要找到。后来，我们决定打开利莫里亚，而最好的战略，就是让利莫里亚不战自乱。于是，我们绑架了所有能够绑架的夸父农场，但是惊喜的是，我们在夸父农场上看到了活生生的你，只是，那时候的你，只是一个被编辑了记忆的船长，对于我来说，这是个惊喜，可对于樱子来说，这具身体并不是你，因此她还是没有得到最高权限。


    吞噬利莫里亚，是我们的最后一步棋。樱子还是希望能够在利莫里亚上寻找权限，而我则是抱着救下那些无辜人类的想法。于是我们再次达成一致，就有了你们刚刚经历的一切。


    在上面这颗蓝色的星球之中，有所有值得留下的人，对于那些没有通过我记忆审判的人，全都化成了那蓝莹莹的月光。


    一切都结束了，我的孩子。


    噩梦，结束了。


    ## 尾声


    夕阳西下，热风吹拂，麦浪如海。


    黄河流域小麦成熟之时，往往在端午前后。经历了5月末一场突如其来的暴雪，新秀穗儿的麦子才刚刚昂起来的头颅，几乎被大雪斩首。


    雪化之后的两个礼拜，天气一天比一天热，烈日一日比一日毒。许久没经历过这么高的气温，起初几天，施云隆起的肚皮上，起了一片红色的疹子，后来还是我妈用了田埂里一种不知道名字的草捣碎了，敷了一宿，第二日便好了。


    此时，她们婆媳二人正在那高悬着“夸父农场N33”牌子的大柳树下的一座移动厨房里炒菜做饭，等着我们干完活回去喝啤酒，吃冰镇西瓜。劳拉就安静地坐在厨房外面，耷拉着舌头，盯着施云手中正在剔的骨头。


    一个家政机器人在柳树下铺开一张八仙桌，清理着桌面。它是施云自己根据老白升级的第11代静音模式的机器人。


    收割机在我面前走了两遭，所过之处，仅剩下被翻起的柔软土壤。麦秸、麦叶以及麦穗的麸皮，全都被打碎了，随着玉米种子，被卷入泥土之中。


    棕色的泥土，生命的摇篮。


    收割机冒出一阵黑烟，突突了两声，便熄火了。


    黄战斗从驾驶位上探出半个身子，拧着黄豆似的脑袋朝我喊道：“又他妈坏了！那群大壁虎到底靠不靠谱？他们连地都没种过，造出来的收割机，也就你敢买！”


    我小跑过去，黄豆子正大口地喘着粗气。也是，这机器自今天早上送到，黄战斗才收割不到10亩地，就原地熄火了3次。每次，我都是按照电话里哥四脚的指导，找到了问题。


    “行啦，不值得生气，总得给他们个试错的机会，否则将来推广开，问题岂不更多？”


    “哎，程复，你再自己修，我可不干了，我宁愿自己一根根地拔，也不开这破烂机器了。”


    我朝他打了个OK的手势，顺手又拨通了哥四脚的电话。


    哥四脚耐心地听完了问题，然后说：“凭咱们的关系，我亲自过去没问题，不过啊，公司的车子全都开出去解决售后问题了，我走路去夸父农场，那不得两天……”


    忽听电话那端一个男人的声音道：“去夸父农场？”


    “是啊！”


    “坐我车，我正想去看看程复呢！”


    “你是谁啊，大哥？我咋看你那么眼熟？”


    那男人嘿嘿一笑，我却已经听了出来。


    哥四脚并不是那位在利莫里亚上死去的朋友，而是另外一个小壁人，他孵出来之后，他的父母让我给他取名字，我立刻就想到了哥四脚。


    不到两年，年轻的哥四脚已经选择了自己的方向，和几个壁人联合开了个农机公司，专门研发和种地有关的机器。


    这款全自动收割播种一体机，就是他们准备本月上市的新品，现在进入了最终测试阶段。不过听他电话里那几句话的潜台词，这机器看来不靠谱到了极点。


    “歇息啦？”我妈见着黄战斗和我从麦地里一前一后地走回来便问道，她端上来一盘粽子，将白砂糖放在粽子一侧。桌子上，已经置备了八个荤素搭配的大菜了。施云正在旁边的移动厨房里一刀一刀地切着西瓜。


    劳拉已经蹲在了桌子一旁，那小眼神瞟瞟我妈，又瞟瞟桌子，心想往日里早该吃饭了，今天怎么这么晚呢？


    黄战斗面目狰狞地坐在八仙桌一旁的凳子上，气呼呼地道：“大娘，您评评理，就您这儿子，有技术成熟的收割机不买，非得买那几只大壁虎的，还让我给他开，那里面空调一会儿冷一会儿热，我又是个胖子，谁受得了那50度的气温啊——这不是有炖排骨吗，有肉还蒸我干吗？”


    施云挺着大肚子，笑着把西瓜端上来：“他是什么人，你还不了解。”


    黄战斗一口将一瓣西瓜吞进了肚子：“嫂子，我咋不了解！我太了解了！我就没见过程复这么傻实在的人，你跟这种人过日子，得多累啊！这一辈子，得跟他吃多少亏！”


    一阵哄笑。


    晚霞之中传来一阵轰隆之声，却见一架蝌蚪形的飞行器从天而降，缓缓落在田埂上，巨大的推动力吹得一片麦子向外而倒。


    劳拉见到那飞行器，一边跳一边叫，兴奋得像是见了兔子。


    一个壁人穿着短裤和T恤当先跳了下来，摇摇晃晃地朝我们走来，他上身的T恤上还印着“壁人机械”四个大字，以及达·芬奇给他们设计的商标——是一把展开的伞。


    哥四脚一边走一边抚摸着T恤下的肚皮：“哎，程复，少做几个菜，太多我也吃不下！”


    黄战斗腾地就站了起来：“你脸皮咋那么厚，我们过端午，你以为这桌菜招待你的啊？”


    哥四脚道：“这样啊，那赶巧了，正好吃完饭有力气干活。”


    他们俩正拌嘴的时候，却见飞行器里又跳下来一人。劳拉一见他便扑进了他的怀里。


    “劳拉，大姑娘，好久不见咯！”


    他和劳拉亲热一阵，便笑吟吟地走到人群外，礼貌地向我妈和施云先打招呼。


    “大妈，嫂子，过节好！”说着，拎着的塑料袋里，却是两尾鲜鱼。


    黄战斗看见他，则一脸不悦：“赵仲明，你这啥意思，饭都做完了你才拿菜来，是不是吃完了还得拎回去？你脸皮也够厚！”


    赵仲明道：“你还有脸说我脸皮厚？天天谁跟着程复蹭吃蹭喝，你交房租了吗？”


    “我交啥房租？这夸父农场也有我的股份，我是……夸父农场N33的领航员！”


    “还领航员？我看你是个第三人。”赵仲明将那鲜鱼递给一个从移动厨房后闪出来的家政服务机器人，“股份是一码事，混吃混喝又是另外一码事，你也不是大娘的儿子，人家欠你的是不？”


    “你小子……”


    我妈则笑道：“你们俩呀，都是我儿子！都是跟着小复从死人堆里滚出来的，哪里还有什么亲疏之分？你们父母又都不在了，以后大娘就给你们当妈，尤其是你们俩的婚事，我和你们嫂子都记挂着呢。”


    婆媳俩对视一眼，施云扑哧一声笑了。


    黄战斗道：“大娘、嫂子，赵仲明你们别管，主要管我就行了。这小子太帅不劳您操心，人家在利莫里亚上就泡过一个洋妞……”


    赵仲明愣住了。


    我咳嗽了一声，黄战斗这才意识到说漏了嘴，赶紧岔开话题：“哥四脚，你一个壁虎吃什么西瓜，快趁着天没黑，给我看看车子去！”


    哥四脚道：“我这眼睛，天越黑看得越清楚，没文化了吧……”话未说完，就被黄战斗给拦腰抱起，跑向了麦田。


    赵仲明抬眼看着我。


    “你说过，我的记忆是被你重新编辑的，那你是否编错了什么？”


    “为什么这么说？”


    “我总是梦见一个女孩子，一头金色的头发，皮肤很白，鼻子很高，是个西方人的样子……”赵仲明和我逐渐走向麦田，远离了移动厨房，“我认为只是个梦，所以也不好意思向你提，可是黄战斗是什么意思，你给我编辑的记忆里，为什么没有在利莫里亚和一个洋妞相识的那部分？”


    “你是有的。”


    “真的？”他忽然激动地掐着我的肩膀，“到底是怎么回事，你能告诉我吗？”


    “我只是遵从了她的遗愿，她不希望你记住她，她担心你会因她而痛苦。”


    “为什么？你不觉得，你们这样剥夺我的记忆，才是对我最大的残忍吗？”


    我曾经隐隐约约有种预感，我知道，这一幕迟早会发生。就像我曾经在夸父农场上，虽然被编辑了记忆，但我还是能够爱上施云一样。


    脑子忘记的事，心都记得。


    我钩着他的肩膀：“你不后悔？”


    “我死都不后悔，还有什么可以让我后悔！”


    “那我也不会给你重新编辑一份记忆……”


    他呆住了。“程复，你为什么要这么做？你太可恶……”


    “你听我说完嘛，年轻人不要心急……”我笑着道，“但是，我已经复制了她的记忆，也保存了她的干细胞，就等着这一天。”


    赵仲明张大了嘴巴，眼睛里忽然迸出泪花。


    他抹了抹眼睛。“为什么……”


    “嗯？”


    他的泪水决堤般涌出眼眶，“为什么我会哭呢？这么想哭，我想号啕大哭，太丢脸了……”


    我回头看了看母亲和施云，指了指他的车子。


    赵仲明跑进车中，关上了门窗，谁也听不见他的撕心裂肺。


    西天红云燃烧，那是娜塔莎的微笑。


    一轮圆月从太阳落下的方向升了起来，那月亮发着蓝莹莹的光。天空中又是一阵轰鸣，一架蝌蚪飞行器掠过柳树梢，降落在赵仲明飞行器的旁边。孔丘、爱因斯坦和樱子从上面先后跳下来。


    孔丘小跑着来到桌子旁边，看着那一道道菜，忽然笑道：“烤乳猪，烤乳猪！程家妈妈，你可真是太了解我了！”


    “招待夫子，怎么少得了这道菜！”


    爱因斯坦叼着烟斗与樱子在后面跟上，我和赵仲明迎了过去。


    我笑道：“从密西西比河到黄河，樱子这次又快了，只用了三个小时一来回。”


    爱因斯坦猛嘬了几口烟袋，向樱子抱怨道：“一路上也没让我抽烟，一个AI，你怕什么，你有肺吗！”


    樱子道：“现在这里也不能抽，这是程复给我下的命令。”她朝着大肚子的施云一努嘴，爱因斯坦立刻便明白了，就将那烟斗敲了敲，收了起来。


    “敢情你也备孕呐。”


    樱子瞥了他一眼，大概是没听懂，便没理会，转头向我道：“程复，两年之约，你还满意吗？”


    “当然，没有你的帮助，这平流层的灰尘我都不知道怎么处理。”


    “既然我做到了，给了你们蓝天和太阳，你还记得当初的承诺吗？”


    “记得！”我摸着她的小脑瓜说道，“我将最高权限还给你，而这次，你也可以安心接受。”


    我把手上的樱花戒指摘下来，戴在了樱子的手上。樱子闭上了眼睛，天上的蓝色月亮忽然闪了一下。


    “谢谢你，程复。”


    “你真正自由了。”


    不远处，孔丘喊道：“吃饭了，你们这四位大仙还等着人请啊，八仙桌在呼唤你们！”


    我们围着桌子坐好，我的左边是孔丘，右边是樱子，孔丘挨着爱因斯坦，老爱挨着哥四脚，樱子身旁坐着的是赵仲明，赵仲明右侧是黄战斗。


    孔丘道：“发现没，发现没？”


    “发现什么？”


    “八仙桌，坐了七个仙哪！”


    众人笑道：“这算什么发现？”


    孔丘向后招呼道：“程家妈妈、小施云，你们一起来吃，咱们挤挤凑一桌！”


    我妈一边洗着粽子叶一边道：“我这正忙着呢，一会儿再吃，小云，你去吃。”


    施云也让道：“哪儿有儿媳吃饭让婆婆站着做饭的道理？”


    我则笑道：“大家吃吧，她们让来让去，菜都凉了。”


    黄战斗向远处的家政服务机器人道：“开一打啤酒！”


    那机器人看了他一眼，说道：“高粱。”


    “什么高粱？”


    “高粱。”


    黄战斗摸不着头脑，看向我。我解释道：“施云嫌它太烦，将它的词库都修改了，它的意思是，‘今天喝高粱酒’，这是我中午给它下的指令，让它去准备了。”


    正说着，那机器人端上来一瓶高粱白酒，以及八个杯子。


    爱因斯坦道：“我可喝不惯你们中国的高度酒，我还是喝啤酒吧。”


    我拦着他道：“今天得喝。”


    我依次斟满了八杯白酒，将最后一杯放在黄战斗身旁的空位上。


    “怎的，还有客人？”


    是啊。但我只是看着他们，终究没有说出来。


    孔丘懂了，慨然叹道：“没来的，太多了……”


    他当先站起身，高举酒杯，豪迈说道：“敬未来。”


    我们都站了起来。7只酒杯彼此碰撞。


    “敬未来！”


