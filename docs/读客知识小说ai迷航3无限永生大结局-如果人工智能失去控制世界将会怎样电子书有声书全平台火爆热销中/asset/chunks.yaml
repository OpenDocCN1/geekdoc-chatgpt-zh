  trans: '


    “你究竟是谁……”我的声音打战，我此时心中已经有了一个猜测，但这怎么可能？


    “为什么不可能？我就是程文浩。”


    “你真的是……爷爷……”


    他眼神柔和。“我死后三年，你才出生，不过我能以这种形式听到你叫我一声爷爷，也当真无憾了……”


    我摇着头，依然不敢相信，我一定是在做梦。


    “杀死我的人，是我最得意的学生，你心上人的母亲——我知道，她也是情非得已，因为吉尔伽美什投入了近千亿欧元，全世界的财阀和政要，都等着 G6540。可作为首席科学家，我竟然不打算将人类追寻了数千年的长生药分享给他们。所以，我必须死，张颂玲不杀我，也会有其他人动手。”


    怎么可能……


    “所以，后来我的女儿程雪才会将你心上人的母亲，杀死在那塔克拉玛干的科研基地。你总算是知道原因了吧，罢了罢了，冤冤相报何时了，我还是跟你说说正事吧，”他端起茶，自饮一口，“孩子，你心中最大的疑问，人类与
    AI 的战争——其实，我可以告诉你，人类与 AI 从来就没有过战争，AI 从未脱离人类的控制。”


    “这怎么可能，迁延了 20 多年的战争，怎么可能是假的？”


    “在回答你的问题之前，你不妨思考一下，如果徐福为秦始皇求到了仙药，他真的长生不老，活到了现在，那中国以及世界，会是一副什么样子？”


    “那……大概是，秦朝的人，活到了现在吧——也可能，地球上人口膨胀……”


    “孩子，你之所以这么想，是因为你并不自私，你继承了你父亲性格中最大的优点。”他绕到那透明的玻璃窗前，望着窗外的雕塑。“但不是所有人都能像你一样。人类追求永生，可并不是所有人都有永生的机会，如果秦皇有了仙药，那永生的也就他一人罢了，因为分给其他人，对他来说，都是威胁，亲人不行，臣子更不行——吉尔伽美什计划的成果，应用到了地球上的权贵阶层，该计划的重要投资人——这
    1000 位神，”他指着那 1000 尊雕像，“他们实现了巨幅进化，剩下的那些没有进化机会的人，在神的眼里，就是多余的废物，是蝗虫。”


    他停顿数秒继续说道：“资源是有限的，而虫子的繁衍是没有尽头的，那该怎么办呢？当然是要杀光这些虫子。人类与 AI 的战争，就是这样起来的。战争，是强劲的收割机，随着战争而来的饥荒、恐惧、疾病，可以带走更多的人命。AI
    从未脱离控制，他们只不过是神们用来重建秩序的工具罢了。”


    我已经忘了呼吸。


    “凡人呐！可悲的凡人，凡事都要论个对错，争个正义与邪恶，可浑然不觉，自己只不过是待宰的猪羊罢了——神管什么对错？管什么意义？神，只在乎秩序！”


    秩序……


    “但是，神们还是低估了人类，我的儿子，也就是你的父亲——程成，竟然带领着人类军队，打响了战胜 AI 的第一枪。人类翻盘了，神们慌了，他们最后只能采取一种极端的方式——瘟疫，就是你刚刚看到的那些可爱的小家伙，它们本来是用来控制人类思想的小可爱，却被他们稍加改动，成了杀死大脑的武器。末日啊！数千亿的微尘在北美大陆扬起，它们寻找着藏在地球各处的人类，钻入他们的鼻孔，进入他们的大脑，只等待着最后的终极命令！”


    “神们没有想到，程成竟然投射了核弹！”他笑了，不知道是否因为五朵金花而感到了欣慰，“核弹摧毁了微尘计划的控制中枢，结果微尘就真的成了微尘，在太平洋东岸的广阔大陆，悬浮了
    20 多年。”


    “程成知道了一些真相，所以，他必须死——当然，这也有我坏女儿的原因，她从未把他当成自己的亲哥哥，她知道你父亲只是被我修改了面部五官与身材的尼安德特人，而我的亲生儿子，真正的程成，却忍辱负重地成为了另一副模样。”


    “周茂才，我进入过他的记忆……”


    “是啊，茂才啊，他什么都明白，什么都知道，却甘心自我牺牲，只为了成全他这个对尼人如痴如醉的父亲，茂才啊，我对不起你！”


    “所以，程雪恨我父亲，恨他夺走了她的亲哥哥！所以，她杀死了我父亲？”


    “没有这么简单，你这个姑姑当时也已经位列永生之神，千人之一！她仇视程成，但还不至于因为你父亲是异类，就要杀死他。程成之所以会死，是因为他知道了神的秘密，而告诉他的人，是我的好女儿。”


    “程雪为什么这么做？”


    “不是一个程雪，你不是知道吗？一个是我的好女儿，一个是我的坏女儿——好女儿本是个替代品，却深爱着她的父亲与兄长；坏女儿虽然拥有一切，却恨着她的父亲，更恨她那个野人变的哥哥，甚至，明知她父亲被人杀死，心中想的却都是如何能够和别人一起，享用那成为永生人的成果……”


    “到底哪个……”


    “不要打断我的话——神们没有意料到，程成竟然投射了核弹，摧毁了他们毁灭人类的计划！地球被程成污染，漫长的冬天来临，神也无法生存，所以，他们跑到了天上，留在地上的
    AI 以及一部分人类，负责净化地球，将剩下的人类全部消灭，等待着神的回归！然而，他们也没有料到的是接下来 AI 真的失控了。”


    “您指的是半年前？”


    “AI 脱离了人类的控制，并以一种无可想象的速度极速地进化。飘浮于利莫里亚之外的巨型蜂巢，大概就是他们进化之后的一种形态，可惜的是，人类创造了 AI，却并不了解失控的
    AI，就像我创造了神，却也并不了解他们失控的欲望……”


    他长叹一声，后背伛偻，看起来整个身体比刚才矮了不少。


    我见他没说话，便问道：“您刚才说的，要我帮您，到底是什么事？”


    “我本来已经死了，但是忽然有一天，我又醒了过来。”


    “死而复生？”


    “不！你现在看到的我，并不是一个真实的人，但也不是一个虚拟的人，你很快就会明白……”他的身体仿佛又缩小了一些，连他也发现了这个问题，他的语速忽然变快，“神们为了控制利莫里亚的人类，在这里用了我的那些小可爱，然而神们并不知道，这些小可爱的程序被周鲸植入了我的人格，他当初这么做的目的，就是希望在我们都死了以后，还能有个‘人’去掌管着人类，观察他们的一言一行，并自主修复整个程序的问题——说得通俗点，我就是个
    AI，一个有着自己人格的 AI 罢了，但我并不能存在于现实世界中，地球上没有任何实质的载体能够让我真正地重生，我只存在于你们大脑的每一次神经元放电之中。”


    我摸着他的肩膀，格子衬衣的料子柔软，就连上面的石灰颗粒，也是触手细腻。


    “这么多年来，我一直在思考，如何拯救人类，不是简单地拯救几百人、几千人，而是拯救人类这个种族！当年因为我的错误导致人类濒临灭绝，这些年来，我一直在弥补当初所犯的错误！”他转过身仰起头看着我，“我的孩子，人类种族走到如今这一步，全是因为体内的自私基因，当初我制造
    G6540 的时候，还没有找到是哪一个片段掌管着人类的自私。但是这十几年来，我在利莫里亚以及地球上，做了无数的试验，终于知道了人类的自私，究竟是如何通过 ATGC
    组合起来的，我找到了它们！”


    他笑了，脸上泛着狂热的红光。


    “试验？”我质疑道，“你……你究竟做了什么试验？”我想到了我在南极地下的所见所闻。


    他笑道：“没错，恐惧是一种方法——就如你在那里看到的，有人为了生存，不惜以别人的生命作为诱饵来延缓自己的死亡！后来，你在那些铁笼子里见到的一切，有的人为了活下来就要杀死别人，同样是为了延缓自己的死亡！”


    “这些，都是你的试验……”


    他没有回答我的问题。“还有一种方法，诱惑！在财富、名声、美色之前，人类的自私心，同样显露无遗，就如神们面对着 G6540 一样……”


    “回答我，杀死那些人，是不是你的试验？”


    他笑道：“孩子，神本来就以人为食，我不过是利用他们顺道把我的试验做了而已。”


    “以人为食……这都是真的……”我后退两步，他的笑容实在让我不敢靠近，“夸父农场……真的……是你们的……”


    “养殖场？”他笑道，“对我来说并不是，对神们来说，确实如此——毕竟，地面上的食物都被核污染了，他们又怎么吃得放心？”


    “可我们是人啊！”我吼道。


    “神和人，本就是两种生命，”他依然保持着淡然的微笑，“就和人与猪一样，道理很简单：人吃猪牛羊时，可曾考虑过它们的感受——呵呵，你这孩子总是喜欢打断我的思考——我们刚才……”


    “你口口声声说要拯救人类，可为什么任凭他们杀死人类，还以人类为食？”


    他敛去笑容。“我最后一次强调，以后不许再打断我的话——”


    “我……”只说了一个字，我的嘴就再无法发出声音。我被瞬间捆成了粽子，整个身体都躺在布艺沙发上。


    他背对着我，看向窗外的雕像，他的身高已经缩小到不足 1 米了。“我拯救的是人类，不是人！这是我们本质上的不同！你即便救活了这里所有人，甚至将外面的 AI 打败，将利莫里亚的神全部杀死，你也拯救不了人类！拯救不了这个堕落的种族！”


    他再次强调且语气强硬：“这是我们本质上的区别！”


    他开始在巨大的落地窗前踱步。“蚂蚁之所以能够生存下来，是因为它们从不在意个体的死活，而只考虑集体的生存、种族的延续！人，哼！自以为尊贵，都是自己对自己的幻想罢了，自大，愚蠢的自大！但本质上，一个人，和一只蚂蚁，有区别吗？没有！甚至连蚂蚁都不如。


    “蚂蚁会为种族甘愿牺牲，但是一个愚蠢的人，却可以因为自己的好恶，轻易毁掉上百万人！而 1000 个愚蠢的家伙，就能毁灭掉人类传承了万年的文明！为什么？就是因为自私，人类基因中的自私如果得不到根治，未来的人类，依然会重蹈覆辙，走向自毁，与末日比邻！


    “道德？呵呵，很美吗？美，当然美！但道德是个人的追求，永远不是集体的追求！三人行，必有我师，但同时也会有是非小人！道德的成本太高了，孔丘的‘己所不欲勿施于人’传承了
    2000 年，佛陀的慈悲智慧宣扬了 2500 年，摩西的十诫传承了 3000 年，然而，有用吗？人类改变了吗？小部分人的确成了君子、善人和英雄，可大部分人呢？还不是庸庸碌碌、蝇营狗苟，一如蝼蚁！


    “这世界上，不会有救世主！因为人类永远自私，永远走向自毁——唯一可以拯救人类的办法，就是彻底地改造这种生物，用我的技术，改变他们的基因编码，让他们永远断绝自私自利，生而为圣！


    “而我引导你一步步地走进这千神殿，就是为了让你成为这第 1001 位神，一位在我永远消亡之后，替我去掌管世界秩序的神，而你这位神，首先必须做的就是——”他的右手朝着玻璃外面一挥，忽然之间，千尊神像轰然爆裂，炸成了粉末。


    白色粉末渐渐消散，只有一尊神像屹立其中，它的面孔是那么熟悉。


    是我，是程复的样子。


    “毁灭千神！”他说。


    # 第八章 毁灭前夜


    ## 1


    石像的粉末还在玻璃外飘荡，程复的那尊白玉似的雕像，恰如站在云中一般威严。它披着一件白色的袍子，赤足立在石座之上，左手抬到与头脑平齐的高度，食指向天；而右手则微微下垂到胯部，展开的手掌像是在抚摸着下面一个看不见的头颅。


    程文浩看着逐渐落定的尘埃，朝我微微一笑：“这就是我的目的，而你，就是我选择的神。千神之后，你将是唯一的神。”


    恍惚之间，我又站在了他的面前。嘴上的禁锢就这么消失了，手上的束缚就仿佛从未存在过一般。


    “对我的安排，还满意吗？”


    我摇了摇头，我不是反对，但我实在不明白他在说什么。


    “孩子，复兴人类文明，最简单的方法是什么？”声音从我身后传来，他又坐回刚才的布艺沙发中去了，手里端着青花瓷杯，热气氤氲，蝴蝶翻飞。


    我喃喃地重复着他那句话，复兴人类文明？当今时代，又怎么可能呢？


    “是毁灭，”他说道，“无论是被外力毁灭，还是被自己毁灭。”


    “你真是个恶魔。”我有些失望。


    他非但不生气，反而带着些许赞美地笑道：“上帝与撒旦，从未分离；佛陀与波旬，向来一体。等你具备了神的视野，那千百万在你面前俯首乞怜的生灵，也不过如草芥、刍狗一般。神无须怜悯任何生灵，众生的痛苦，不过是世界的秩序，就像有的虫子生于皇宫内院的御花园，而有的虫子则长于市井陋巷的荒草地，神不会因为怜悯虫子，就阻止市井陋巷的荒草地里面不再生出任何虫子。如果神真的这么做，那他就不配为神。”


    他打了个响指，房间倏然消失，红色的火焰从我站立的地下升腾而起，但我却感受不到灼热。我们正站在空中，下面是暗红色的熔岩岩浆，岩浆像一只暴怒的恶龙，挥舞着两只巨爪，向着火山下的一座白色岩石建筑组成的小城扑了过去。爆裂的岩石拖着长长的黑色尾巴从天上陨落，一声巨响，岩浆蹿入我的脚下——几千米高，云气蒸腾，我看不清小城的人是如何瞬间被岩浆吞没的。


    “庞贝。”


    熔岩在我们脚下奔腾，忽而又变成了滔天的洪水，向着低洼处的一个庞大的聚落群咆哮而去，牛羊挣脱了藩篱，在聚落中奔走。有些人举着火把，想要照亮天际，看清远处咆哮而来的恶魔到底是什么模样，但真正看清的时候，洪水已经到了眼前。火把被吞噬，四野重归黑暗。


    “两河。”


    洪水继而又化作了漫天的黑色飞虫，像是死神的袍子一样，遮蔽了一座古城的天空。忽然，天际闪出一线亮光，接着轰鸣一声，城市中心裂开了一道巨大的裂缝，两个地块摩擦颤抖着，房屋在倒塌，市民奔走于街巷，不少人跌入了那巨大的裂隙之中，从建筑物中逃出来的人，也最终被那黑色的魔鬼之袍覆盖，转瞬之间，留在地下的就只剩下一堆白骨……


    “摩亨佐·达罗！”他的声音停歇了几秒，画面再度切换，我们站在冬日里莽苍的荒原上，黄草离离，白雪皑皑。不远处的天空中一抹黑烟升腾而起，火光乍现。


    “创造之前，必先毁灭。”


    话音才落，白雪退去，黄草化作一片黑土，春雨骤降，黑土地上，冒出了青芽。青芽万里，远处的天空中，南雁北飞。


    待他炫耀完眼前的戏法，我提醒他道：“世界已经毁灭了，利莫里亚成了人类文明的遗珍，如今 AI 要将人类赶尽杀绝，斩草除根的毁灭已经注定，我们还谈何重建？”


    “与其被机器毁灭，人类何不自己毁灭？自毁尚有一线希望，如果真的等到 AI 攻占利莫里亚的那一刻，人类文明就没有丝毫希望了。所以，我才让你毁灭千神，毁灭利莫里亚……”


    “你刚刚还说只是让我毁灭那 1000 个我父亲的仇人，现在怎么又要我毁灭利莫里亚？”


    “千神就是利莫里亚的执掌，利莫里亚就是千神的奥林匹斯。同时，这里也是 AI 的目标，毁灭了利莫里亚，AI 便没有了目标，仅存的人类，就能躲过一劫，仅仅需要几个世纪，人类的种族，又会在这地球上繁衍，而彼时的
    AI，已经成了一堆废铁。”


    “废铁？他们作为胜者，只会成为地球新的统治者。”


    “不可能的，孩子，你要记住，AI 永远不是生命。没有任务执行的 AI，最终的命运就是归于尘土。”他的身形已经缩小到一个三四岁的孩子一般大小，整个沙发对于他来说，更像是一张大床，“我的时间不多了，利莫里亚的时间也不多了，我已经感觉到，那个东西——可以说，一个和我类似的东西——我称它是另一个棋手，已经向利莫里亚进军了，这群蠢如猪豕的神，此时还抱着侥幸心理，幻想着能逃过最终的命运惩戒，时间不多了，不多了……孩子，人类的命运就交给你了，你和程雪，是我选择的亚当与夏娃——不要犹豫，也无须自责，你和她没有血缘关系，千百年之后，人类的故事中，会流传着伏羲女娲一样的神话故事，来形容你们……”


    伏羲女娲？亚当夏娃？


    “你到底在说什么？”


    “你们将在我的保护之下，成为地球上最后的两个人，也是下一个人类纪元最开始的两个人……千百年后，人们将以始祖之礼祭拜你们，这五大洲遍布你们的庙宇，全世界的人类，都是你们的后代、你们的信徒。”


    他不仅是个恶魔，还是个疯子。


    “你是想杀死除了我和程雪之外的所有人？”


    他没有回答，只是兀自说着：“我会将人类万年的文明智慧输入你的大脑之中，你将伴随着后代的发展而永生，在合适的时机，你的智慧和知识，将指引人类走向应该走的方向，而不像前几代人，走向毁灭……”


    “住口！”


    “……你和程雪将会是第一批去除自私基因的神，而你们的后代，也完全没有自私……千百年之后，人类将建立一片多么崇高、美丽的国度啊！没有战争，没有罪恶，没有你争我夺，没有一己之私带来的灾难。你将率领你们的后代，走向光明，走向永恒，走向时间和空间的尽头……”


    他消失了，恍如一场梦境。


    一眨眼间，所有的一切都消失了。没有变的，只有我坐的这张单人扶手椅。他不是我爷爷，他只是一段幻影罢了。他是一个妖魔，甚至可以说，刚才那一切只是个噩梦。


    我的爷爷，不可能说出那么荒唐的话来。


    但是，我又怎么会做这样一个梦呢？


    这间卧室的陈设清新典雅，我站起身，从梳妆台一侧的书架上，看到了几张照片——年轻的程文浩搂着一个七八岁的女孩，小姑娘身穿一件蓝色的化验服，他们身后是一个巨大的玻璃仪器，像是一个实验室。几个穿着白大褂的工作人员在他们的身后挥手。女孩的模样很容易分辨，就是程雪。


    第二张，程雪已经是十四五岁的小姑娘了，依然穿着一件蓝色的化验服，正伏在实验室角落的窗子下，拿着笔演算着什么，不知是谁偷偷拍下了这样一张照片。


    第三张，是程文浩和少年程成的合影。程成一侧本是一辆铃木摩托车，但是车头的位置被一张剪下来的程雪小人照覆盖了，她依然穿着那套蓝色的化验服。于是两人的合影，就成了三个人的合影。


    第四张，程雪看起来已经二十四五岁了，她骑在那辆铃木摩托车上，身穿黑色的夹克和皮裤，正朝着拍照者摆出了一个 yeah 的手势。远处，像是一个军营，红色的旗帜在两个站岗的士兵身后飘扬。


    刚才那个荒唐的梦，或许和这里有关，我的潜意识接收到这里的信息，于是组合了那样荒谬的剧情？


    ……


    现在不是看照片和考虑这些的时候。


    我呼唤内心的清醒和平静，无论刚才那是一场梦，还是真的是脑子里有什么奇怪的虫子向我传递着我那位死去爷爷的“天启”，以及这地方到底是不是程雪的家，这些都不重要，重要的是我究竟睡了多久。我还清晰地记得，被雪华杀死的季三木跟我说，壁人内乱了，而我的朋友们此时正面临着生命危险。


    我撑着虚浮的身体，在房间内寻找着可以钻入利莫里亚内部的通道。而此时门外，有对话的声音传来。


    “你还真是欲求不满！”一股子浮夸的浪荡与调笑，利莫里亚能发出这种声音的，只有阿历克斯。


    对方哼了一声，是程雪的声音，一贯的冰冷。


    “别忘了你是什么身份！”


    阿历克斯笑道：“身份？程议长是什么身份？怎么又会看上赵仲明这小子……哈哈哈……”


    “放肆！”


    “虽然程议长将医院的一切数据处理得天衣无缝，在三个小时之内，绝对不会有人能够怀疑到赵仲明的失踪与利莫里亚的议长程雪有什么联系，但是，你恐怕还不知道，我早就在那医院安插了眼线。”


    “你难道就不怕莫普提知道？”


    “彼此彼此，程议长都不怕，我怕什么！”阿历克斯道，“这么长时间，我给你心甘情愿地当一条可以呼来唤去的狗，而你，却从未兑现你的承诺……”


    “你这条狗胃口越来越大，现在反倒埋怨起我喂的骨头少了。”


    “至少你帮我把程复这浑蛋杀了，也算除了我的心头之恨！”


    程雪冰冷地一哼。“你也未免太高看自己了，你算老几？程复的生死，能随着你的意愿？杀死程复的，是程成——利莫里亚的千神，没有一个不恨他的。他那不老实的儿子，自然成了仇恨的牺牲品。”


    “好、好、好……你果然一点情面也不给我留，那当初许给我的承诺，算是一件也没能帮我兑现！”


    “哦？”


    阿历克斯陡然将嗓门提高：“是你说，你可以帮我接近他，让他承认，他还有个儿子，你做到了吗？没有！这要求过分吗？对你程议长来说，只不过几句话的事……”


    程雪冷冷地答道：“我已经做了，但他愿不愿意认你，那是他的选择。阿历克斯，他的身份不容玷污和质疑，你的出现，将成为他的污点。他已经知道了你的存在，而你还能在利莫里亚活下去，这就说明，他已经承认了当年抛弃你和你母亲的错误，如果他真的动怒，恐怕和我在这里聊天的人，已经化成了灰烬……”


    我悄悄地打开门，眼前是一段两米长的走廊，尽头是一个吊灯，吊灯下面是一个巨大华美的会客厅。


    我从楼上望了下去，却见阿历克斯此时正从身后搂着程雪，右手握着一把雪亮的匕首，正从她前胸斜上，对着她的喉咙。


