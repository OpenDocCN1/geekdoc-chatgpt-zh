  trans: '


    娜塔莎重播刚才的片段，扬声器里传来我的声音：“我曾经听说过人体种植，AI 通过人类的身体种植器官，用来为联合政府统治下的人类换器官，不过据说有一部分器官被送进餐厅，成了市民心中的‘绿色食品’……”


    两个男人面面相觑。


    鹰钩鼻道：“你刚才听到的是什么？我怎么记得，赵仲明说的是他亲身经历过人体种植？”


    方脸盘道：“记不清，或许，是我们太敏感了——我曾经听说过，与我亲身经历过，这两段话的确有些相似。”


    “可他听说过人体种植，也不对！”鹰钩鼻道。


    娜塔莎补充道：“赵仲明和程复接触过，也和 MU 上的人交谈过，我认为，关于人体种植的细节，他多少了解一些。”


    我暗自庆幸自我修改记忆的成功，如果他们掀开被子看看，就会发现我的整个后背已经被汗水浸透了。


    后面，他们没有再喊停，因为我的大脑强制自己相信我就是赵仲明，而且后面没有关于程复的情节和对话。他们一直看到了我昏倒在飞机上的那一刻为止，至少在此之前，我都强迫让自己相信这里是
    AI 的基地，与利莫里亚无关。


    “看看赵仲明知道飞机自动导航是回到利莫里亚之后内心的想法。”鹰钩鼻十分谨慎，而他要的内容，至关重要，关乎我的生死。


    娜塔莎将记忆播放跳到了我与韦森见面的时候。


    我内心的声音从扬声器里传来——我重新构建了当时的见面情景。


    我内心说：“太好了，太好了……一定是利莫里亚的人发现了我，操纵了我的飞机，把我带回了家……”


    虽然模糊，但是这句话的大致意思还是从扬声器里传了出来。身后那两人在本子上记录了几笔，从娜塔莎手中接过拷录的机密文件后便从房间里走了出去。娜塔莎微微闭上了眼睛，松了一口气。


    她站起身，重新将门关上后坐到了我的床边。我睁开眼睛，看着她，她微笑着摇了摇头，轻声道：“你醒了……”


    我坐起身：“幸亏你……”


    她忽然就吻了过来。


    大脑里，烟花绚烂。


    赵仲明因为工作原因，多次进入机密事务司，对娜塔莎一见钟情。但是，等到他第一次和她说话，竟然是在拉里贝的追思会上。此次以后两颗心便将彼此抉择为此生最重要的人。


    在机密事务司，娜塔莎了解到了很多不为人知的秘密，于是她产生了一些冒险的想法：通过整理一些禁书，将内容植入到自己的大脑中。她以极短的时间掌握了与她年龄极不相符的人类智慧，但是这些事情只有赵仲明知道。


    是她告诉赵仲明那粉红色小药丸的秘密，并怂恿他，与她一起体验了伊甸园中毒蛇教唆夏娃吃下的禁果。


    他们不断地幽会，在任何没有监视设备的地方接吻，一次次地挑衅利莫里亚的法律，却又每次都能成功。他们在这紧张与刺激的游戏里上了瘾，直到赵仲明宣布：他打算退出游戏。


    是娜塔莎在犯人身上搜出的违禁物品中，发现了那个神秘的挂坠，并在登记簿上消掉了挂坠的名字。


    我想起这些事情的时候，心脏跳得像个淘气的猴子。这是赵仲明的心脏。可我清晰地记得这种感觉，就像是我在夸父农场 N33 上第一次见到施云一样。


    我要凭那墨玉镶边的眼睛，睫毛直吻着你颊上的嫣红……


    脑子忘记的事，心却都记得。


    “想起来了吗？”她移开嘴唇，揽着我的脖颈问道。


    我点点头。“这就是你当初为我植入的非要等特定条件下才会启动的……小把戏？”


    她笑了，脸颊绯红。


    “你变聪明了。”


    显然，在她眼里，我还是赵仲明。


    “上次，你为什么没有直接告诉我我们的关系？”


    她有点埋怨地说道：“是你执意要将我抹去的。”


    “那你为什么今天又突然……”


    “因为我演不下去了。”


    绿色玻璃上人影一晃，娜塔莎在我耳边轻声道：“小心说话，有监视。”


    她话音刚落，我眼睛的余光里看到一位白衣护士推门而入，却听那人轻声咳嗽：“如果工作完毕，请尽快离开病人病房。”


    娜塔莎站起来后转过身去，我看到了那名护士，竟然是雪华！


    她冷笑道：“你还真是万能啊？刚才还在机密事务司，现在又来当护士，工作时间逃班，又碰上长官，尴不尴尬？”


    雪华也笑道：“在你出门之后，国防部就已经调了我的岗，娜塔莎，你如果认为我的工作埋没了我的能力，那尽管去国防部理论，为我鸣个不平。”


    语气不急不慌，还真挺像个温柔的护士，更像我曾经的妻子。但是她的出现，让我刚刚才被娜塔莎温暖的心，瞬间如堕冰窟。


    “赵队长，您是不是身体不舒服？”她走过来关切地问道，将娜塔莎挤到一旁。


    我这时候才意识到自己已经目不转睛地看了她有段时间了，以至于连娜塔莎都察觉到了我不对劲。


    “仲明，你怎么了？”


    我轻咳两声：“我之前和这位朋友有点误会，刚刚在想，真是冤家路窄呀，你不会趁机来报复我吧？”


    雪华笑道：“赵队长真是幽默，你现在是利莫里亚的大英雄，我能照顾你，荣幸之至。你如果能不计前嫌，我简直感激万分呢。”


    两名穿蓝色制服的行政人员帮助娜塔莎将仪器运了出去，娜塔莎依依不舍地离开了病房，她看向我的最后一眼，充满了担忧。


    雪华检查了我身上伤口的恢复情况，又从仪器上记录了心跳、血压等数据。


    “赵队长，你现在心跳过速……”


    “我……我确实有些不舒服。”


    她淡淡一笑。“你不会因为看到我，紧张了吧？”


    我没有回答，只是低下了头，希望她没有看出我脸上变幻的风云。


    她又笑道：“我开个玩笑罢了。”


    “不好意思……”我忽然试探性地说道，“我……我失态了。”


    “你最近一段时间，没吃正心丸？”


    我不好意思地点了点头，不过我知道，她已经认为我心跳过速的原因，来自她作为异性的吸引力。


    “那你不会见到每个女人，都这副窘态吧？”


    我索性就装下去。“自然不是，主要因为你……你很漂亮。”


    雪华骄傲地一笑。“这些话，可别让外人听了去。”


    “你叫什么名字？”


    她看了一眼紧闭的房门，又看了一眼我的眼睛。“你可以叫我阿雪。”


    阿雪，我喃喃道：“你……我……”


    “你一个大英雄，怎么说话支支吾吾的？”


    我索性便演下去。“你长得……很温柔、很特别。我经常去机密事务司，怎么就只见过你一次？”


    “你这小嘴儿可真甜，利莫里亚上的人，可没几个如你这般有趣儿。”阿雪笑吟吟地为我调整了空调的温度，“看你额头上这么多汗——嗯，我负责的工作一般都是内部的，所以你没见过我，我也是才调去的机密事务司。”


    “难怪……”


    “你是不是对每个美女，都会关心几句？”


    “自然不是，”我朝她尴尬一笑，“能不能答应我一件事？”


    “你可是我们的英雄，有什么不能答应的？”


    “谢谢……不过，不是什么大事——只是，我没吃正心丸的事，能不能替我隐瞒？”


    阿雪将头歪向右侧，有些调皮地朝我微笑：“乐意之至！那这样的话我们之间也算有秘密了。”


    她拿着病历表单拉开房门准备出去的时候，忽然愣住了，然后她又将门关上了。


    “你……你认识程复？”她装作若无其事地问道。


    “嗯？你打听他干吗？”


    “没什么，”她眼神有些恍惚，“我不过有些好奇这个人。”


    “我和他有过简单的接触。这个叛徒，不是已经被处死了吗？”


    “你刚才……”她说出来之后，才意识到自己话多，不过还是说了下去，“提到了程复？”


    “我？”


    “娜塔莎来给你做的记忆检测，你记忆里出现了程复的名字。”


    我装作什么都不了解。“是吗？都测出了什么？”


    她摇了摇头：“没什么——赵队长，你好好休息吧，有需要的时候，随时按床头的红色按钮。”


    她白衣一闪，飘然出门。


    如今，一些不愿意相信的推测，渐渐在我心头明朗——夸父农场和利莫里亚，必然有着某种密切的联系。


    我驾驶着朱雀战斗机掠过 AI 在南美洲的空军基地，看见夸父农场与施云时就该想到——那就是敌人俘获的“补给飞船”！


    我重重一拳砸在床上，掌心的伤口虽然已经修复，但此时内部的组织又疼痛起来。


    越痛，越真实。


    补给飞船，夸父农场，根本就是一回事。曾经的器官种植，根本不是送给 AI 治理下的人类，因为我亲自去过硅城，那里的人大部分都换了机械器官。


    所以答案只有一个，夸父农场就是利莫里亚控制的，它是监狱，是犯人的劳改农场，那里的一切产出，都供应给了利莫里亚。而南极的基地应该也是如此，只不过它是个加工厂罢了。


    每天下午进入夸父农场运货的飞机，难道就是运往利莫里亚的？如果不是，那雪华又怎么会出现在这里？本已经在利莫里亚的施云又怎么会出现在夸父农场上？答案只有一个：AI
    从未控制过夸父农场，一直是人类在控制着。但与此同时，另一个问题冲上心头，让我无法坚信这个推断。秦铁和大河原树又是怎么回事？丁琳出事的时候，他们以联合政府智人管理局的身份登上过夸父农场，这又怎么解释？


    他们确实是联合政府的人，也确实是 AI 的“走狗”！一定有哪里出错了，一定有什么是我还不了解的。


    真相，到底是什么？


    # 第七章 千神之殿


    ## 1


    因为一个叫赵仲明的名字，利莫里亚沸腾了。


    数日之后，阿雪扶我来到医院窗口旁，我看到楼下的广场上已经会集了上万年轻男女。他们高举着赵仲明的照片以及条幅，整齐划一地向我高喊着“英雄”的口号。


    “利莫里亚的人最崇敬英雄，上一个受如此尊重的英雄，应该还是程成了，”阿雪关上了窗户，外面传来巨大的呐喊声，“这么多年，也没有人能像你一样，被敌人击落竟然还能活着返航。”


    此时的我只感到巨大的荒诞。


    那日在法庭上朝着我扔垃圾、骂我是叛徒、恨不得食我肉寝我皮的也是这一群人吧。


    “怎么了？”她声音温柔。


    “我只是感觉任重道远……如今敌人强大，我一个人活下来只是侥幸，如何能保证利莫里亚的安全，才是最终目的。他们这样狂热地崇拜我，可我能力有限，仅凭一己之力，又如何扭转乾坤？”


    “但是大家都相信你，是你让我们看到了胜利的希望。”


    住院的第三天，一颗黄豆脑袋从门外探了进来，他连着发出三声“嘿嘿”笑声后才跳到我的床前。


    “赵仲明，咱哥俩大难不死，以后得有多大的后福？”他笑着擦掉眼泪，“奶奶的，酝酿了好久如何喜剧开场，结果见到你小子，还是忍不住想哭。”


    我抓住黄战斗的手，劫后余生，更觉珍惜。


    他那天确实被敌人击落，不过跳伞之后，在一片森林里藏了一天，最后终于等到了后续的救援。


    “你说，你立了这么大功劳，得封多大的官儿？”


    我摇了摇头：“这算什么功劳，一次惨胜，并不能扭转战局。”


    “得了吧你，利莫里亚这些年，也没人能把 AI 基地炸成熊窝，而且还能全身而退。我都听说了，你的表彰会已经在筹备中了。”


    我耸耸肩，一副无所谓的样子。


    韦森和莫甘娜在昨天来过，分别带来了一个好消息和一个坏消息。好消息和黄战斗讲的一样，坏消息则是，我交代给韦森那件事，他没办好，所以特意来道歉。


    劳拉活了下来，却被国防部派人强制带离了 203 驻地。因为来医院探望需要批准，因此隔了这么久，韦森才来告诉我。


    我故作遗憾，但是看他那么伤心，我差一点就把实话讲了出来。


    实际上劳拉已经被哥四脚运进了利莫里亚间壁，并获得了达尔文、牛顿等人的救治，如今已经康复。早在住院的第二晚，我就通过哥四脚和孔丘、爱因斯坦等人取得了联系，但由于医院房间的通风道不能容许我爬进去，因此我与他们之间传递信息全由哥四脚来做。


    哥四脚还带来了一个重要消息，人类食物的短缺也影响了壁人，在生存危机下，壁人部族之间已经开始自相屠戮，战争时断时续，越来越多有信仰的壁人都放弃信仰，加入了另一方。哥四脚因此忧心忡忡。


    所谓的表彰典礼，更像是一场新闻发布会。


    大厅内，利莫里亚陆军和空军的中上级官员济济一堂，而我则坐在轮椅上，被 109 团两名参加过战争的战士推着上台。


    国防部长莫普提首先宣读了战争所取得的成果，但是对于战斗中第四飞行大队伤亡过半的重大损失却避而不谈。接下来便是给参战的飞行员颁奖，黄战斗也成为了战斗英雄，兴奋地接过郭子兴大队长颁发的奖章，乐呵呵地笑着，还不住地朝我抛媚眼，如果是在私下里，他肯定早就朝我跑过来了。


    整个第四飞行大队，只有阿历克斯没有上台，他成为了唯一一个与荣誉无关的人。他此时正坐在第四飞行大队空荡荡的席位中，显得尤为显眼。他冷冷地看着我们，嘴角不住抽搐。


    最后是为我个人颁奖的环节。此次行动，被军方称为美洲突袭战，连普通的战士都能评上战斗英雄，所以谁也不知道我这个战斗的策划和领导者，会被授予何种荣誉。


    莫普提拍了拍话筒，全场安静。


    “众所周知，本次突袭是第四飞行大队 109 团赵仲明全盘策划，并亲自带队执行，本次行动的伟大胜利，赵仲明应记首功。”台下掌声雷动，记者们的照相机和摄像机不停地朝我招呼过来。


    莫普提压了压声音：“时代需要英雄，利莫里亚更需要英雄，如今大敌当前，更是呼唤英雄的时刻！为了表示政府对英雄的重视，表示对这次胜利的嘉奖，我们决定——”莫普提将演讲台上的一个红色盒子当众打开，一枚泛着冰雪色的五角星奖章熠熠生辉。


    前排的几位将军、上校不自觉地站了起来，而身后的士兵们有些则表现得异常激动，有些则不明所以，场内乱哄哄一片。


    “将北极之光奖章，授予赵仲明，以表彰他在美洲突袭战做出的决定性贡献！”


    堂下哗然一片。


    北极之光，大多数人都听过这四个字，但真正见过奖章的绝对在少数。莫普提微微一笑，并没有进一步介绍北极之光奖章的价值，我心中冷笑，这个小人！


    我从轮椅上站起来，挺直胸膛，让莫普提将奖章别在我的胸前。我向他敬礼，礼毕之后朗声道：“感谢部长，我心里有些话想讲给大家听，希望部长批准。”


    莫普提一愣，不过随即放松神色：“我们担心你的身体，本来有安排，但是会前取消了……”


    “多谢部长关心，我还是希望讲一讲本次战斗中的一些感想！”我咬着牙，如果他再度拒绝，我就自己跑过去将话筒抢过来。


    我要告诉这里所有的年轻人，这奖章，是我父亲程成曾经得过的。莫普提故意回避，自然是因为他们这群人心中仇恨父亲。


    莫普提以为我要借机发表获奖感言，便点了点头，并带头鼓掌，掌声如雷。


    “感谢大家！”我看了一眼第四飞行大队近乎一半的空席位，“大家看到的是胜利，或许，胜利更能激励我们。但我看到的是牺牲，是我的战友们用 40 多条年轻的生命，为我们换回这次胜利，所以，这北极之光，我愧不敢当，这荣誉，应该属于参与本次行动的所有战士……”


    片刻的宁静之后，稀稀拉拉的掌声响起，随后，掌声逐渐汇成排山倒海的洪流。


    “24 年前，在座的诸位——包括我本人——很多人都没有出生。然而就在那一年，程成将军率领着第四飞行大队，在白令海重创敌人，击沉 3 艘航母，获得了人类与 AI
    战争的首次巨大胜利。而北极之光奖章，就是联合国授予程成将军的荣誉！”下面不少人恍然大悟地“噢”了一声，“程成将军带领人类走向的是一次次胜利，而我又何德何能，敢与程成将军比肩……”


    这时候，黄战斗突然在下面喊道：“赵仲明，是你带领利莫里亚空军，实现对 AI 的首次大胜，你就是我们的程成！”


    这一招呼登时振奋了士气。我瞟了一眼莫普提，他的黑脸上看不到任何惭愧之情。我忽然就想通过这次发言，讽刺一下这位国防部长，但理智瞬间告诉我：一定要隐藏自己。


    我继续说道：“有程成将军的精神激励着我们，我也必将承担起北极之光的责任，与在座的诸位，与利莫里亚所有士兵，共同守疆卫土，共同捍卫人类的尊严。只要我们战魂不灭，人类就一定能取得这次战争的胜利！”


    在热烈的掌声之中，我坐回到轮椅上被缓缓推下了台。


    傍晚，阿雪推着我来到顶楼的花园中，这里有个圆形穹顶，可以模拟蓝天和落日。我们在一片苜蓿园中看着夕阳西下，这让我想起曾经在夸父农场上和丁琳欣赏落日的情景，不由得叹了口气。


    她一边为我按摩肩膀，一边问道：“怎么，有心事？”


    “真美。”


    “假的罢了，真实的日落比这可美多了。”


    “夕阳无限好，只是近黄昏，”我感叹道，“越美的东西，便越容易失去吧。”


    她咯咯一笑：“真不知道你脑子里想的都是什么，这么小的年纪……胡思乱想。”


    “你不觉得吗？你心中难道就没有当时不珍惜，如今却没法再回去的美好回忆？”


    她的双手停了下来，眼睛望着落日愣怔了片刻。“自然有的。”


    “日升日落都是片刻的美，白天有差不多 1000 分钟，日升日落加起来也才 10 分钟，可一天当中，人们最爱的、最怀念的，却只有这抓不住的区区片刻。”


    “人还不都是这样？”她吸了吸鼻子，岔开话题，“你又感慨什么？”


    “我只是想到了自己短暂的一生。”


    她笑了。“大英雄，你总发愁什么，你才……22 岁吧？”


    “利莫里亚没有一个士兵能活到 23 岁，不是吗？”


    她不再说话。


    “你有没有爱过什么人，或者被什么人爱过？”这是一个可有可无的关键问题，不问，我很安全，问了，便走向禁区。


    她没有回答，只是将眼睛望向即将消失的夕阳。


    “怎么不说话？”过了半分钟，我追问道。


    “我只是……不知道如何回答。”我感受到了她的情绪。


    “你帮我保密了正心丸的事，我自然也不会把你的秘密说出去，你也有过爱人吧？”


    我很在乎，这不是装出来的，是真的在乎！


    她摇了摇头，没有说话。


    我故作轻松地调笑道：“这么神秘，不会是我认识的人吧……”


    她扶着我肩膀的手微微颤抖。


    我适可而止。“你喜欢他吗？”


    “我不知道。”


    “不为所动？”


    “不知道。”


    我抱怨道：“自己的感情你会不知道？如果你也喜欢，不妨直说啊！”


    “他死了。”


    “哦……真是遗憾。”


    “没什么可遗憾的。”她的手离开了我的肩膀。


    “那你……会想起他吗？”


    “有时候，会，”她停了停，“毕竟，也有两年的感情……”


    我点了点头，足够了！就当那个男人是夸父农场上的程成吧。这样，至少我心里会舒服些。我不想总是带着仇恨和敌意生活，她，无论是叫雪华，还是叫阿雪，也不过是一个工具罢了，为了完成任务，不得不与我的命运强行羁绊。


    我已经不在乎她是否是因戏生情，但看她如今的状态，至少她会想起那个人，那个也许是我的人。


    足够了。


    一切都是假的，至少，还有一份真情留在了她的心中。


    我的身体已经接近康复，三五日之后就可以离开医院了。自从上次一别，哥四脚已经五天没有来找过我了。壁人的危机到底恶化到了何种地步？老爱、孔丘他们是否安好？这些问题时刻牵绊着我。


    自从回到利莫里亚，我的睡眠便一直很浅。虽然过了记忆检测的关，我还是拿不准国防部会不会趁我睡熟时除掉我，毕竟我是利莫里亚几万士兵中最接近真相的那个。


    他们既然没动手，那就说明我还有利用价值。


    大概是想在 AI 打过来的时候，把我一捆，送去求和罢了。


    喀啦！房顶一响，哥四脚终于来了。


    我迫不及待地站在床上，熟练地替哥四脚拆掉了通风道的挡板。脚步缓缓靠近，我轻轻呼唤哥四脚的名字，但是他并未回应。


    当我意识到出了问题时，通风道里寒光一闪，一把匕首自上而下朝我刺了过来。我迅速倒在床上，那匕首紧跟着扎向了我的腹部。


    一个女壁人从天而降，手中握着匕首，连连向我刺来。


    “你什么人？”


    “你连我也忘了吗……”


    听声音我忽然想起来，她是第一次让我知道壁人存在的那个偷袭者——季三木。


    她几次都未刺到，便借机喘息着站在原地蓄力。


    “哥四脚呢？”


    她冷笑一声：“这条走狗吗？被我杀了。”


    “你……”我咬着牙道，“他是你的同类！”


    “壁人都快饿死了，还分什么同类异类，能吃为什么不吃！”她黄色的眼睛一翻，“不止这个倒霉蛋，你的那些同伙，早晚也得被我们吃个精光！”


    “浑蛋！”


    “骂也没用！为了活着，换作是你也会这么干！”


    “我绝对不会吃我的同类！”


    女壁人咬着牙笑道：“没有吗？没少吃吧！你们的一日三餐，难道你以为，里面的肉真的是猪肉、牛肉和羊肉？”她不等我反应，挥刀再次攻来，“受死吧，你这虚假的偶像！”


    我接住她的手臂，两只手掌环住她的手腕，稍微一用力她便动弹不得。这就是壁人的力量，灵活有余却又气力不足。


    我迅速将匕首从她手中拔出，反手横在她的脖颈下：“你为什么非要置我于死地！”


    “你自己不知道吗？垃圾！”

