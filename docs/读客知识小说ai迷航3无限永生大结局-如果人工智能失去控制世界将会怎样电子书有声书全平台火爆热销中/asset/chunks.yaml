    # 第四飞行大队


    第四飞行大队是中东亚共同体成立之后的称呼，其实级别相当于空军飞行师，常备战机 120 架左右，利莫里亚升空之后，只保留了中东亚 15 个空军大队中的 4 个，而且根据现状再度改组，增加了朱雀战斗机的数量，相对削减了其他功用的飞机，所以每个飞行大队的朱雀战机都是
    90 架。但是随着近来战事失利，战斗机的补充尚未完成，第四飞行大队可用战机只有 55 架，25 架来自 109 团，107 和 108 团各出了 15 架。


    我率领 109 团飞行到北纬 30 度上空，107 团则沿着赤道飞行，108 团沿着南纬 30 度前进。在我们的前方 2000 公里处，是用来诱敌的 6 艘补给飞船，每艘补给飞船旁边，各有两架护航机。


    战争的第一步，所有战斗机按兵不动，让第一艘补给飞船和两架护航机去趟雷区。敌人在美洲大陆的三个基地果然在半个小时内都有了动作，由于人类的卫星已经被 AI 完全控制，我们只能通过利莫里亚的信息定位系统去捕捉对方的移动位置。


    护航机的雷达很快就锁定了三处敌军，每一队敌机都是七架战斗机的编制。AI 的战斗机名为阿尔法，是战争开始之前研发的无人驾驶战机，全由卫星定位和 AI 系统自动操作，谁能想到人类研发的武器，在人类与
    AI 战争开始之后，全都站在了人类的对立面。


    第一批 3 艘补给飞船的任务是牺牲——诱敌之后，成功被敌人攻击或俘虏，但是护航机的任务则是发射定位“蒲公英”，一种可以通过风力传播的具有极强吸附作用的纳米定位仪器。一个打向敌人的炮弹，携带
    10 万枚蒲公英，只要有一枚蒲公英成功吸附在敌方战斗机上，不仅可以迅速暴露其位置，待其返回基地之后，还能顺势找到基地的位置。


    战斗第一步在半小时之后结束，蒲公英也成功黏附在阿尔法战斗机上，15 分钟之后，3 个基地的定位准确无误地发送到每一架朱雀战机之上。


    计划的第二步开始。


    三艘补给飞船开始在地图上分先后移动，北半球的先动，随后是沿赤道飞行的飞船，最后是南半球，每一架飞船隔开五分钟时间。


    AI 的阿尔法战机在补给飞船移动后 15 分钟时出动。北纬的补给飞船将在 15 分钟之后与敌人相遇。我将 109 团分成两部分，我亲自率领 10 架战斗机向北美五大湖区飞行，而其余战斗机则交给黄战斗，他将迎面和敌机纠缠，之后与我会合。


    我收到黄战斗遇见敌机的信息时，已经悬浮于五大湖表面。接下来，任务最难的一项开始了。


    10 架朱雀战斗机将以 5 马赫的速度奔赴北美 AI 基地，接近基地后则开始低空飞行，用自己的经验判断航向，并迅速摧毁基地，全部用时不容许超过 5 分钟。


    根据定位，敌人的基地位于内华达山脉附近，接近山脉时，我们冲破云层开始低空飞行。山顶上覆盖着皑皑白雪，山上的云雾也为飞行造成了一定的困难，但是既然 AI 能够飞出来，对方的基地也不会太过隐蔽偏僻。


    终于，距离定位地点越来越近，我们的位置也必须越来越低，在第 4 分 30 秒时，我们以贴地 10 米左右的距离成功掠过敌方基地，在对方的巡航导弹刚刚准备发射之际扔下炸弹，彻底摧毁了这个基地。


    与此同时，赤道地区的 107 团遭遇敌人。


    我们留下一架朱雀战机清理现场——破坏一切通信和遗存设备。另外 9 架飞机再度升空，10 分钟内抵达哥伦比亚的 AI 空军基地，投下了第 2 颗炸弹，不过这次不像第一次那么简单，我们已经受到了基地敌人的反抗，其中两架朱雀战机在敌人的防御火力中陨落。


    幸亏黄战斗和他的队伍及时赶到，打退了追踪的敌人，我们才得以继续向南飞行。经过这一战，黄战斗的队伍也仅剩下五架飞机。


    我们合兵一处，选了 10 架飞机离开哥伦比亚，飞往最后的基地——安第斯山脉最南端的巴塔哥尼亚高原。这时候 AI 终于做出了反应，3 支掩护补给飞船的团队先后发来信息，表示
    AI 已经向南半球飞去。


    显然，他们已经猜到了我们的战术，目的地是最后的巴塔哥尼亚空军基地。


    “郭将军，请统筹全局，计算时间！”我向利莫里亚指挥部的郭子兴请求道。后者只用了不到 30 秒就向我反馈了所有信息：目前第四飞行大队保住了北纬和中美洲的两艘补给飞船，107
    团损失了 7 架，而 108 团与敌人交锋之后便全部失联。


    “失联？补给飞船呢？”


    “飞船的定位还在，但是飞船的雷达失灵，无法探测周边敌情。”


    “我们到敌军基地还要多久？”


    “13 分钟！”


    “抛弃油箱呢？”


    “什么……你要同归于尽？我不同意，部长和议长特意交代，一定要保护你的生命安全……”


    “我当然不会死！你相信我，我只问最后的时间……”


    “6 分钟！”


    “收到！”我向随行的其他九架战斗机道，“一字排开，抛掉油箱，开到最快速度，一定要在敌人返回和聚拢之前，炸掉他们南美最后的一块基地！”


    战士们则通过耳机回复我：“为了利莫里亚，为了全人类！”


    然而在平流层我们很快就遭到 7 架敌人阿尔法战机的迎击，我猜测这是隐蔽基地，也可能是执行巡逻任务的哥伦比亚基地的飞机，否则以 AI 的反应速度，他们不可能这么快飞来。


    阿尔法战机比朱雀战机更加轻便，灵敏度高，对于近距离作战有着极大的优势，可是它的速度和远程攻击能力远逊于朱雀。我留下 7 架朱雀战机掩护，自己则率领仅剩的 3
    架飞机继续前行，黄战斗执意要参加最后的轰炸，此时我也不用和他多费口舌。


    距离目的地 50 秒的时候，郭子兴的声音却从耳畔响起，“赵仲明，国防部命令你立即返航！”


    “为什么？”


    “探测到马蜂窝在印度洋海域消失！”


    “消失便消失，一时半会儿到不了南美洲！”


    “敌人已经知道了我们的作战意图，现在你过去，只能是送死！”


    “箭在弦上，我必须保护最后的飞船，如果不炸掉南美封锁，利莫里亚所有人都会被饿死……”


    “可是，你已经取得了很大胜利……”


    “这算什么胜利！”


    我关掉了郭子兴的通话，看了看旁边的两架护航战机，黄战斗在左，另一名飞行员我连名字都不知道，在我的右翼飞行。


    我向他们道：“这是一次胜率只有 0.01%的战争，你们可以在最后 30 秒内选择退出！”


    片刻的平静后，右侧的战斗机消失了。耳机里传来黄战斗的笑声：“赵仲明啊赵仲明，你说你……哈哈哈……都这时候，还给人选择，你若不说，我看他也想不起来——唉，哈哈，幸好还有我陪你一起战斗到底！”


    我也被他逗笑了：“你小子为什么不走？”


    他却反问回来：“这种弱智问题还要问，你小子干嘛不逃？”


    最后 15 秒了，我说道：“这是程成将军的番号，我必须彻底执行完此次任务，方不辱他的威名……”


    黄战斗“嗯”了一声，声音异常冷静：“赵仲明，雷达探测到前方来了两架飞机，我们用饼干战术，我掩护你……”


    所谓的饼干战术，就是他的飞机翻着贴过来，两架飞机贴着肚皮前进，遭遇敌机时，一架倒飞的飞机应敌，正飞的飞机逃逸。他选择这个战术，就已经下定决心，把最后的生还机会留给了我。


    “黄战斗！”


    “少废话，你知道我记性不好，没有你引路，我都找不到那基地！时间不多了，我开始变阵……”


    他从我的左侧消失了。


    “老子一直以为你是个软蛋……”


    黄战斗的声音陡然豪迈：“那小爷今儿就让你看看，老子到底有多硬！”


    敌机近在眼前，两架朱雀飞机迅速贴成一块饼干。


    炮火之下，我翻了个身向下飞去，而他则翻身从掠过我们上空的两架敌机之后，开始反击。


    穿透云层，低空飞行。


    前方已经出现了黄色的光芒，敌方的军事基地暴露在我的视线之内。


    地面上的巡航导弹已经调试完毕，准备给我最后一击。


    我冷冷一笑：“比比谁更快吧！”手按在轰炸按钮上时，我忽然意识到这个基地上停的不全是飞机。炮火淋漓中我看见了那艘庞大的飞船，那应该就是一艘补给飞船，它被悬浮于空中的庞大机器锁在了地上。


    飞船巨大，一个透明的穹顶将其罩住，穹顶之下，是一片甘蔗园、葡萄园、玉米园，还有油菜园。


    油菜刚刚开花，黄瓜刚刚长芽，一片白色的丁香花畔，那是我再熟悉不过的导航台。


    一个女孩正站在导航台上，惊恐地看着天上倒着掠过的飞机。


    它是夸父农场。


    她是施云。


    我的爱人，竟然又出现在了夸父农场上。我忘不了她恐惧又迷茫的眼神，巨大的机械铁臂将夸父农场禁锢于大地之上。


    我的任务是摧毁，但……怎么可以！


    炮火交织，我握住导弹发射器的右手，终究没有按下那个红色的键。朱雀战机低空掠过敌人的基地，又奇迹般地从火力交错的网中飞了出来，飞机的右侧机翼被击中，飞机内一个没有丝毫情绪的声音正不断提示着机身受损的几处情况，可这并非最大的危机，两个巡航导弹已经瞄准了飞机，正一左一右地从后包抄过来。


    我呼叫黄战斗，没有任何回应。


    高原平缓，没有山地阻拦，所以我只能通过变换飞机的飞行花样来甩开导弹，可是机翼的受损已经影响了动力，速度放缓不说，连操作也不如之前灵便。


    “赵仲明，收到请回答！”是郭子兴的声音。


    “暂时还活着。”


    对方的耳机里传来一群人欢呼的声音：“真是奇迹，刚才你在地图上消失了起码一分钟的时间，成功了吗？”


    “没有……”


    “没有？为什么没投弹？”


    “嗯……敌人火力太猛，根本没有合适的机会！”我欺骗了他们。


    “也好，你能活下来，也算是胜利了，汇报飞机受损情况，我们为你安排返回的路线。”


    “机身多处受创，后面还有两个该死的导弹甩也甩不掉……”


    “燃料如何？”


    “不足两分钟。”飞机一个翻身，与导弹擦肩而过，剧烈地震动之后，飞机前方冒出白烟。


    郭子兴沉默片刻：“你现在飞去的方向是南极洲……”


    “知道了，那就辛苦你们来南极一起看看企鹅吧。”我让飞机螺旋向上飞行，进入平流层之后，我希望黑色的沙尘能够帮忙拖延巡航导弹的速度，但是这导弹异常聪明，它们竟然没有追上来，而是调整速度、计算着我可能出现的位置，在平流层之下跟着我。


    结果我进入平流层之后，受限的反而是自己，两颗导弹已经绕到前方，准备守株待兔。


    我向上冲破平流层，朱雀战机如一条红色的海豚跃出黑色的大洋，蓝天如洗，夕阳在右窗向下隐没，为翻滚的黑色云海镶下万道金边。两颗导弹就像是两条鲨鱼紧随其后，我再次钻入云海，这次则一直向下而去，利用地心引力和燃料的推力逐渐加速。


    短暂的黑暗，永恒的光明。


    夕阳依旧照耀在我的右窗，皑皑雪原之上，也镶嵌着金色的边框。我浑身一阵战栗，这地球之上竟然还能看见太阳。


    极寒之地此时正是极昼，太阳悬浮在此起彼伏的冰山雪原之上，从下往上看去，南极上空的黑云已经变淡，逐渐散去，偶尔也能穿透云层看到淡蓝色的天空。这里或许是如今地球上唯一能够看到太阳的地方了，那企鹅便是地球上唯一能享受日光浴的动物。


    导弹破空而至，我继续俯冲，直接朝着一座冰山撞去，两颗导弹紧随其后，这次我并没有躲，而是静待导弹接近，在距离冰山只有百米的地方我猛地拉起操纵杆，朱雀贴着雪面迅速飞升，灵巧地翻越冰山。然而导弹似乎早就洞穿了我的诡计，几乎是在即将撞到冰山的刹那间也同时抬升。


    我暗暗佩服敌人的武器，但它们这么做也在我考虑的可能性之中，于是，就在朱雀翻越雪山的刹那，我按下了跳伞键。


    两颗导弹从我身体两侧掠过，带过的空气又将我向上推高了十几米，头盔被震裂成一团粘在一起的碎片，我的两肋受到了剧烈的冲击，嘴里一甜，不用想，也知道呕血了。我迅速下坠，而残存的意识还没忘记在最后一刻打开降落伞。


    飘吧，随风飘吧，若能活下来，就再次扎根。


    轰的一声爆炸，我失去了意识。


    ## 第五章 坠毁南极


    ### 1


    在被狗舌头舔醒之前，我做了个很怪的梦。


    梦里，父亲、母亲带着我和妹妹又来到那个史前动物园。我们见到了雕齿兽，见到了长毛象，见到了美国野马，然后母亲和妹妹就失踪了，我和父亲在园子里焦急地寻找她们，然而我忽然意识到，动物园里的其他人也不见了，偌大的园子，参观者只剩下我和父亲。


    天上落下了一个铁笼子，铁笼子锁住了我和父亲，我们被关押在广场中心。这时候，消失的人们从四面八方奔跑而来将我们围了起来。他们朝我和父亲扔石头、木棍，嘴里喊着：“猴子，猴子！”


    我再看父亲，发现父亲成了一只黑猩猩，而我身上也长出了黑色的绒毛。


    “他们是怪物，变成了人的样子，想害死我们！”成年的程雪喊道，其他人听见程雪的号召，朝着笼子挥舞着拳头，朝着我和父亲啐着唾沫。


    人群中，我看到了母亲和妹妹，她们手拉着手，站在人群外冷笑着。我哭喊着：“我不是畜生，我不是怪物。”但是我的声音，却变成了哇哇的猩猩叫声。父亲把我搂在怀里，我们泪流满面，父亲忽然伸出舌头，开始舔我的脸……


    梦醒了，一条狗正舔着我的脸。它是一条黄色的拉布拉多，狗的身后，一个穿着一身白色皮毛的人，正用双管猎枪对着我的腹部。


    “劳拉，离他远点！”那人声音苍老，劳拉很听话地跑回那人身边。我才看清楚他的模样，白色的毡帽，将他整个脑袋罩住，眼睛上蒙着黑色的遮风镜，鼻子和嘴巴全都被皮子罩住，露出的额头上布满了皱纹。


    我这才意识到自己的半个身子已经被白雪盖住，只露出了胸部以上和脑袋。头盔不知道去了哪里，也不知是被他摘下来扔掉了，还是在摔落雪坡的时候摔掉的。身后是我的降落伞，伞面上烧出一个
    1 米直径的大洞，应该是朱雀战机爆炸后的残骸引燃了降落伞，才使得我从天空上迅速跌落。


    “人，还是机器？”那老人吼道。


    我缓缓举起双臂，发现身体并没有多虚弱。“人类！”


    “你就是那飞机的飞行员？”


    “我是利莫里亚大陆第四飞行大队 109 团的战士，我叫赵仲明！”


    “利莫里亚？”老人举着枪，踩着雪一步步地向前走来，劳拉紧跟在他身后，一个劲儿地朝我摇尾巴。老人走到我旁边，伸出戴着黑色皮手套的右手，在我脸上摸了一把，然后将手套凑近了遮住鼻子的罩子，当他确认手套上是人类的鲜血之后，才将双管猎枪收回到了背后。


    他一把将我从白雪里拉了出来：“腿还能走？”


    我借着他胳膊的力量，缓缓从雪地上站起来，右腿生疼，左腿已经没有了知觉。老人俯下身子，摸着我的裤管，说道：“幸好没断，你应该是被积雪压得太久了，或许还有冻伤！”说着，便将我架在他的肩膀上，拔出猎枪，卸掉其中的子弹，给我当拐杖用。


    站起走了没几步，才发现我的降落伞后面已经围了一圈儿企鹅，它们见我走动，便全都好奇地看着我，但慑于劳拉和双管猎枪，谁也不敢靠近。


    “真是精灵啊，地球上唯一能享受阳光的精灵了。”我赞叹道。


    “味道还是不错的，不过吃久了你也会觉得乏味。”


    老人全名叫沃纳·费舍尔，德国人，曾是德国南极考察站的科学家，他今年 50 岁，已经独自在这白色荒原上生活了 20 年。


    “当初你为什么没有和其他人一起离开？”


    “因为我在钓鱼。”他在地下室里熬着鱼汤，这里曾是德国站的一个仓库，狂风暴雪抹去了地表建筑物的门窗，可这间地下室丝毫不受影响。


    “钓鱼？你难道没有感觉到危机？还是……撤离太突然了？”


    他哈哈大笑，络腮胡子似乎很久没有如此开心地跳跃过了。“这是幽默，你懂吗？Fisher 是我的姓，哈哈哈，劳拉，你看我们找到个傻子。”


    劳拉翻了个白眼，嘴里呜呜两声，不知是在嘲笑我，还是在为它的主人而惭愧。


    “都说我们德国人严谨，我看你们中国人才是一本正经，”沃纳掀开汤锅，一股鱼香迅速填满了地下室，“我当时受伤了，尚在昏迷当中，而撤离的直升机中，没有卧铺……”


    “所以他们就把你抛下了？”


    “哈哈哈，你怎么一点幽默感都没有，我都说了我当时在昏迷中，又怎么知道接我们走的是直升机，还卧铺……哈哈哈，你动动脑子好不好？”


    我尴尬一笑：“不过你确实被抛下了。所以，离开的场景，是你的想象吧。”


    沃纳捞出半条鱼抛在劳拉面前的直板上，劳拉嗅了嗅又退了回去，等着那鱼肉变凉。“没错，我醒来的时候，基地里一片狼藉，直升机已经飞走了，基地不远处的地面上，还多了几个冒着黑烟的弹坑，显然战火已经烧到了南极。”


    “那你没尝试和自己的国家取得联系？”


    “通信设备全被破坏了，”他向后一指，角落里有个黄色的匣子，匣子上还有一根可以拔出来的天线，“约是……15 年前吧，我在圣马丁站的遗迹里，找到了这个家伙。”


    “那是什么？”


    “收音机。”他捧过那个黄色的机器，又从地下的铺盖角落里，摸出了两块圆形电池塞了进去，打开电源后红色的指示灯就亮了，匣子里传来沙沙的声响。


    我们听着那声响，安静地吃完了两碗鱼汤。然而，无论他如何转动调频按钮，都是高高低低的沙沙声，偶尔能听到一阵刺耳的高频，除此之外再没有其他声音。


    沃纳说：“是不是很美妙？”


    我停住正在吧唧的嘴，这鱼汤远比沙沙的声响美妙。“你听到了什么？”


    “一切声音。”


    沃纳闭上眼睛，像是老僧入定一样端着鱼汤碗。“是星空于北海闪耀的声音，是雨滴落在莱茵河的声音，是慕尼黑啤酒泡沫爆裂的声音，是安联球场里观众鼓掌的声音……嗯，还有，西尔维娅端上新煎牛排，橄榄油在铝盖里沸腾的声音，弗兰克洗澡时，淋浴打在瓷砖地面的声音……是一切声音，所有。”


    这个被遗弃了 20 年的老人陶醉似的深吸一口气，然后又静静吐了出来：“你能听到什么？”


    “我只听到了沙沙声。”


    “不，你没有用心听，你闭上眼睛仔细听听，你的大脑就能破译这些信号。”


    我依言闭目，后背靠在墙上，手臂放松，沙沙的声响在我的脑海里回荡。我看见了棕榈林，人造风在夸父农场巨大的穹顶之下传递着夕阳的问候，棕榈树叶彼此摩擦，丁琳拎着一瓶红酒向我发出邀请：“船长，我们去喝一杯……”


    我看见了地上一团团白纸，一支铅笔沙沙地在桌上的白纸上画着什么，张颂玲微微皱着眉头，面对着白纸上的一堆公式陷入沉思。见我走来，她停下手中的铅笔，羞红了脸，局促地不知道说些什么，只好又低下头，继续让沙沙的声响于纸上响了起来……


    老白手中的笤帚正沙沙地清理着腐朽的木屋，樱子一个人坐在沙发上，忽然转过头道：“我还是想不明白，什么叫作发自内心的笑……”


    ……


    “听到了吗？”


    “听到了。”


    费舍尔低沉地笑了两声：“回忆才是真正摧心折肺的武器啊……”


    我睡着后不久就被费舍尔拍醒了，他朝我做了一个噤声的手势，同时我看到劳拉正机警地盯着地下室上方那扇铁门。费舍尔拍拍劳拉的头，它便蹲了下来。就在这时，房顶突然震动了两下。


    “有人在上面，”费舍尔低声道，“可能跟你有关。”


    我从地上爬起来，一步步地挪到门板之下，侧耳倾听。地面上大概有两个人，他们在地下室上面的房间里来回走动查看。但我实在不敢抱期望，毕竟在人类能找到这里之前，AI
    应该早就到了，除非他们亲自查看过飞机的残骸，并且决定就此放过我。


    第三个人的脚步声自远而近，忽听一个声音道：“报告队长，方圆 1 公里都找遍了，没有足迹。”


    另一个男人的声音道：“那就怪了，赵队长难道被 AI 俘虏了？不过我们看足迹，似乎有一条狼跟踪着赵队长……”


    我心下稍安，这一定是利莫里亚来营救我的队伍。于是走下去，向费舍尔道：“是利莫里亚的人！”


    他双眼放光：“人类？来接你了？”


    我点了点头：“感谢你，我这就和他们离开。”


    费舍尔道：“能不能……让我和你们……”


    我知道他的意思，在他没有说出这想法的时候，我就已经想到了这种可能性，但我必须拒绝他。果然，他听完我说的话之后无比失望。


    “我这是在保护你！”我知道他肯定不理解，“如果我还能活着，一定回来找你！”


    “你……你们也要抛下我？”


    “不是这样的，是因为你不知道那里有多残酷……”


    “残酷？”他苦笑道，“能比 20 年见不到一个人更残酷？能比天天面对着狗，天天吃鱼、吃企鹅的日子还残酷？”


    “你会死！”我的声音加大，“那里……”


    忽然，嗡的一声巨响，我们全部被震倒在地。爬起来的时候，我才意识到是地面上什么东西爆炸了，费舍尔抱着劳拉跌落在铺盖之上。


    地面重归寂静，现在能听到的只有火焰的哔啵声。


    费舍尔咳嗽道：“发生了什么？”


