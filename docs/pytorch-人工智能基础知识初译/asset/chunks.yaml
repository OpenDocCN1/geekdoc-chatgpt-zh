    \ 中查看张量\n\n在使用张量和处理神经网络时，我们经常需要遍历和重新排列张量中的数据，以使张量的尺寸适合架构的需求。 在本节中，我们将探讨 PyTorch\
    \ 中常见的重排和重塑技术。\n\n在本秘籍中，我们将学习如何使张量看起来像我们想要的样子。\n\n## 操作步骤\n\n让我们看一下如何改变张量的形状：\n\
