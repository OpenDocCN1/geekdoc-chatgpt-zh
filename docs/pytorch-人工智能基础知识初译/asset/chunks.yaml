    \ += reward\n        observation = new_observation\n\n        if(done):\n    \
    \        break\n```\n\n最后，关闭环境：\n\n```\n    env.close()\n    print(\"Rewards:\
    \ \",total_reward)\n```\n\n调用 `play_agent()` 函数：\n\n```\n>>play_agent(dqn, env)\n\
    Rewards: 160.0\n```\n\n这样，我们就对 `DQN` 进行了训练和可视化。\n\n## 工作原理\n\n在本秘籍中，我们首先使用超参数导入并初始化环境。\
