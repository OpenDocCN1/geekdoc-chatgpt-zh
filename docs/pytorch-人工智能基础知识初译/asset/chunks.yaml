- raw: "在此秘籍中，我们在构造器中添加了`num_layers`和参数以控制模型中 LSTM 的层数，并将其作为关键字参数`num_layers`传递给 LSTM\
    \ 定义。\n\n然后，在`forward()`方法中，由于隐藏状态的形状是`[num_layers * num_directions, batch, hidden_dim]`（默认情况下`num_direction`是`1`），因此我们仅使用`hidden[-1]`从最后一个\
    \ LSTM 层获取了隐藏状态。 这意味着`hidden[-1]`给出了最后一层的隐藏状态。 通过这样做，我们可以选择`num_layers`作为超参数。\
    \ 来自较低层的隐藏状态输出作为较高状态的输入传递。\n\n# 更多\n\n在本秘籍中，我们仅考虑了最后一个 LSTM 层的隐藏状态。 但是，可能存在使用所有隐藏层的复杂架构。\
    \ 有一个`dropout`参数，可用于在多层 LSTM 的各层之间施加丢弃。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#lstm)上了解有关多层\
    \ LSTM 的更多信息。\n\n# 双向 LSTM\n\n该秘籍以多层 LSTM 秘籍为基础。 在正常的 LSTM 中，LSTM 会从头到尾读取输入序列。\
    \ 但是，在双向 LSTM 中，有第二个 LSTM 从最后到第一个读取序列，即反向 RNN。 当当前时间戳的预测取决于序列中进一步输入时，这种类型的 LSTM\
    \ 可以提高模型表现。 考虑示例“我看过漫画”和“我昨天看过漫画”。 在这种情况下，基于将来出现的标记，相同的标记（即`read`）具有不同的含义。 我们将在本秘籍中探讨其实现。\n\
    \n# 准备\n\n该秘籍建立在“多层 LSTM”秘籍的基础上，因此在尝试该秘籍之前，请务必先完成该秘籍。\n\n# 操作步骤\n\n在此秘籍中，我们将修改“多层\
    \ LSTM”秘籍中的类定义，使其成为双向 LSTM：\n\n1.  我们将`bidirectional`参数设置为`True`：\n\n```\nself.rnn\
    \ = nn.LSTM(embedding_dim, hidden_dim, num_layers=num_layers, bidirectional=True)\n\
    ```\n\n2.  然后，我们将更改全连接层的输入尺寸：\n\n```\nself.fc = nn.Linear(2*hidden_dim, output_dim)\n\
    ```\n\n3.  然后，将输入更新为全连接层，如下所示：\n\n```\nhidden = self.dropout(torch.cat((hidden[-2,:,:],\
    \ hidden[-1,:,:]), dim=1))\nreturn self.fc(hidden.squeeze(0))\n```\n\n现在，类定义如下所示：\n\
    \n```\nclass BiLSTMClassifier(nn.Module):\n    def __init__(self, embedding_dim,\
    \ hidden_dim, output_dim, dropout, num_layers):\n        self.embedding = nn.Embedding(len(Review.vocab),\
    \ embedding_dim)\n        self.rnn = nn.LSTM(embedding_dim, hidden_dim, num_layers=num_layers,\
    \ bidirectional=True)\n        self.fc = nn.Linear(2*hidden_dim, output_dim)\n\
    \        self.dropout = nn.Dropout(dropout)\n\n    def forward(self, x):\n   \
    \     x = self.embedding(x)\n        output, (hidden, cell) = self.rnn(x)\n  \
    \      hidden = self.dropout(torch.cat((hidden[-2,:,:], hidden[-1,:,:]), dim=1))\n\
    \        return self.fc(hidden.squeeze(0))\n```\n\n4.  然后，我们创建模型对象：\n\n```\n>>model\
    \ = BiLSTMClassifier(EMBEDDING_DIM, HIDDEN_DIM, OUTPUT_DIM, DROPOUT, NUM_LAYERS)\n\
    ```\n\n通过此秘籍，我们修改了网络，使其现在是双向 LSTM。\n\n# 工作原理\n\n在此秘籍中，我们在 LSTM 定义中将`bidirectional`标志设置为`True`。\
    \ 我们将前向和后向 LSTM 的隐藏状态连接起来，并将它们传递到全连接层中。 因此，全连接层的输入尺寸增加了一倍，以适应前向和后向隐藏状态张量。\n\n\
    在`forward()`方法中，我们使用`torch.cat()`连接了向前和向后隐藏状态，并使用了向前和向后 LSTM 的最后一个隐藏状态。 在 PyTorch\
    \ 中，隐藏状态堆叠为`[forward_layer_0, backward_layer_0, forward_layer_1, backward_layer_1,\
    \ ..., forward_layer_n, backward_layer_n]`，因此所需的张量为`hidden[-2,:,:], hidden[-1,:,:]`。\
    \ 连接后，在挤出额外的尺寸后，我们将隐藏的向量传递到全连接层中。\n\n# 更多\n\n我们选择了最后的前向和后向隐藏状态并将它们连接起来，这就是我们选择的架构。\
    \ 但是，根据手头的任务，我们可以选择任何或所有隐藏状态。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#lstm)上了解有关多层\
    \ LSTM 的更多信息。\n\n# 五、迁移学习和 TensorBoard\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/5.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/5.md)\
    \ \n\n迁移学习是深度学习中的一个重要概念，它使我们可以将深度学习用于各种日常任务。 这是一种机器学习技术，其中针对任务训练的模型被重用以创建用于类似任务的新模型。\
    \ 我们采用在大型数据集上训练的模型，并将其知识迁移到较小的数据集。 对于具有**卷积神经网络**（**CNN**）的计算机视觉任务，我们冻结了网络的早期卷积层，仅训练了最后几层。\
    \ 早期的卷积层提取适用于整个图像的通用低级特征，以检测边缘，图案和梯度，而稍后的层识别图像中的特定特征，并且特定于数据集。\n\n在本章中，我们将训练图像分类器以区分正常患者和肺炎患者的胸部\
    \ X 光，并使用经过训练的 ResNet-50 模型进行迁移学习。 我们将替换分类器，并有两个输出单元代表正常和肺炎分类。\n\n我们将在以下阶段完成迁移学习任务：\n\
    \n1.  加载在 ImageNet 数据集上训练的预训练的 ResNet-50 模型。\n\n2.  在模型的较低卷积层中冻结参数（权重）。\n\n3.\
    \  用多层可训练参数替换分类器。\n\n4.  在可用于任务的训练数据上训练分类器层。\n\n5.  微调超参数并根据需要解冻更多层。\n\n在本章中，我们将介绍以下秘籍：\n\
    \n*   调整预训练模型\n\n*   实现模型训练\n\n*   实现模型测试\n\n*   加载数据集\n\n*   定义 TensorBoard 写入器\n\
    \n*   训练模型和解冻层\n\n# 技术要求\n\n要完成此秘籍，我们需要 Torch 1.2 或更高版本，强烈建议我们使用支持 CUDA 的设备。\n\
    \n# 调整预训练模型\n\n在本秘籍中，我们将采用经过预训练的 ResNet 模型，并修改最后一层以适合我们所需的输出。 与 ImageNet 数据集中用于训练\
    \ ResNet-50 模型的类的数量相比，我们只需要两个类。 我们将修改 ResNet 模型的最后一个池化层和全连接分类器。 我们将进一步将模型的训练限制为仅添加新添加的分类器单元，并且将保留所有其余层以免更新权重。\
    \ 这称为冻结模型。 让我们看一下如何实现秘籍。\n\n# 准备\n\n此秘籍要求我们下载特定的数据集。 我们将从[这里](https://www.kaggle.com/paultimothymooney/chest-xray-pneumonia/download)获取数据集。\
    \ 为了完成此秘籍，您的 PyTorch 安装应为 1.2 或更高版本，强烈建议您使用支持 CUDA 的设备。\n\n# 操作步骤\n\n在本秘籍中，我们将训练我们的神经网络，并从在\
    \ ImageNet 数据集上训练的预训练模型 ResNet-50 开始：\n\n1.  现在，我们将从导入开始编写 Python 代码：\n\n```\n\
    >>import torch\n>>import torch.nn as nn\n>>import numpy as np\n>>import torch.optim\
    \ as optim\n>>from torchvision import transforms, datasets, models, utils\n>>import\
    \ time\n>>import numpy as np\n>>from torchsummary import summary\n>>from torch.utils.data\
    \ import DataLoader\n```\n\n2.定义`AdaptiveConcatPool2d`子模块：\n\n```\n>>class AdaptiveConcatPool2d(nn.Module):\n\
    \    def __init__(self, sz=None):\n        super().__init__()\n        sz = sz\
    \ or (1,1)\n        self.ap = nn.AdaptiveAvgPool2d(sz)\n        self.mp = nn.AdaptiveMaxPool2d(sz)\n\
    \    def forward(self, x): \n        return torch.cat([self.mp(x), self.ap(x)],\
    \ 1)\n```\n\n3.定义一个函数以获取模型：\n\n```\n>>def get_model():\n    model = models.resnet50(pretrained=True)\n\
    ```\n\n4.现在，我们将冻结模型：\n\n```\nfor param in model.parameters():\n    param.requires_grad\
    \ = False\n```\n\n5.现在，我们将替换 ResNet 的最后两层并返回模型：\n\n```\nmodel.avgpool = AdaptiveConcatPool2d()\n\
    model.fc = nn.Sequential(\n    nn.Flatten(),\n    nn.BatchNorm1d(4096),\n    nn.Dropout(0.5),\n\
    \    nn.Linear(4096, 512),\n    nn.ReLU(),\n    nn.BatchNorm1d(512),\n    nn.Dropout(p=0.5),\n\
    \    nn.Linear(512, 2),\n    nn.LogSoftmax(dim=1)\n)\nreturn model\n```\n\n有了这个秘籍，我们已经准备好要获取模型的函数。\n\
    \n# 工作原理\n\n在此秘籍中，我们定义了一个子模块`AdaptiveConcatPool2d`，该子模块在平均 2D 池和最大 2D 池之间执行级联，以便从卷积层到具有最大特征信息的全连接层的平滑过渡。\n\
    \n然后，我们定义了`get_model()`函数，该函数首先下载 ResNet-50 模型（本地不可用）并冻结该模型的权重。 通过冻结权重，较低的卷积层不会更新。\
    \ 然后，我们用`AdaptiveConcatPool2d`层替换了平均池化层，并为两个可用的类添加了具有两个输出单元的全连接分类器。 我们最终返回了带有冻结的\
    \ ResNet 层的模型。\n\n# 实现模型训练\n\n在本秘籍中，我们将实现一个在单个周期内训练模型的函数。 此函数进一步记录模型的训练指标并将其绘制到\
    \ TensorBoard 上。 我们将传入模型，训练数据，优化器和模型训练准则，并将返回训练损失。\n\n# 操作步骤\n\n我们将在此秘籍中实现训练函数：\n\
    \n1.  定义训练函数：\n\n```\n>>def train(model, device, train_loader, criterion, optimizer,\
    \ epoch, writer):\n    model.train()\n\n    total_loss = 0   \n```\n\n2.  迭代训练数据并更新模型权重：\n\
    \n```\n    for batch_id, (data, target) in enumerate(train_loader):\n        data,\
    \ target = data.to(device), target.to(device)\n\n        optimizer.zero_grad()\n\
    \        preds = model(data)\n        loss = criterion(preds, target)\n      \
    \  loss.backward()\n        optimizer.step()\n\n        total_loss += loss.item()\n\
    ```\n\n3.  记录并返回训练损失：\n\n```\n    writer.add_scalar('Train Loss', total_loss/len(train_loader),\
    \ epoch)\n    writer.flush()\n\n    return total_loss/len(train_loader)\n```\n\
    \n通过此秘籍，我们完成了训练函数。\n\n# 工作原理\n\n在此秘籍中，我们定义了执行训练周期的函数。 在开始训练过程之前，我们使用`.train()`将模型设置为训练模式，并将训练损失设置为`0`。\
    \ 然后，我们遍历训练数据并将输入数据点及其对应的标签移到可用设备（CPU 或 GPU）上。\n\n然后，我们清除梯度，进行模型预测，然后将其传递给准则以确定训练损失。\
    \ 然后，我们对损失进行了反向传播，并更新了模型的权重。 由于模型是冻结的，因此它仅更新模型中分类器的权重。\n\n最后，我们使用 TensorBoard\
    \ 中`SummaryWriter`对象中的`SummaryWriter`对象中的`add_scalar()`方法在 TensorBoard 中记录了训练指标-我们在其中传递了一个标签，一个标量值和一个计数器，在本例中为周期数\
    \ 。\n\n# 实现模型测试\n\n在此秘籍中，我们将定义一个函数以在一个周期内根据验证数据测试模型。 此函数还将测试指标记录到 TensorBoard\
    \ 上。 我们还将添加工具函数，通过绘制图像并以可读的方式标记这些图像来记录模型中的一些错误分类。\n\n# 操作步骤\n\n在本秘籍中，我们将实现模型测试以及工具函数：\n\
    \n1.  首先，我们将定义一个将张量转换为图像的函数：\n\n```\n>>inv_normalize = transforms.Normalize(\n\
    \        mean=[-0.485/0.229, -0.456/0.224, -0.406/0.225],\n        std=[1/0.229,\
    \ 1/0.224, 1/0.255]\n    )\n```\n\n2.  然后，我们将定义一个函数来记录错误分类的图像：\n\n```\n>>def misclassified_images(pred,\
    \ writer, target, data, output, epoch, count=10):\n    misclassified = (pred !=\
    \ target.data)\n    for index, image_tensor in enumerate(data[misclassified][:count]):\n\
    \        img_name = '{}->Predict-{}x{}-Actual'.format(\n                epoch,\n\
    \                LABEL[pred[misclassified].tolist()[index]],\n               \
    \ LABEL[target.data[misclassified].tolist()[index]], \n            )\n\n     \
    \   writer.add_image(img_name, inv_normalize(image_tensor), epoch)\n```\n\n3.\
    \  现在，我们将具有一个用于记录指标的函数：\n\n```\n>>def test(model, device, test_loader, criterion,\
    \ epoch, writer):\n    model.eval()\n\n    total_loss, correct = 0, 0\n\n    with\
    \ torch.no_grad():\n        for data, target in test_loader:\n            data,\
    \ target = data.to(device), target.to(device)\n            output = model(data)\n\
    \            total_loss += criterion(output, target).item()\n            pred\
    \ = output.data.max(1)[1]\n            correct += pred.eq(target.data).cpu().sum()\n\
    \n            misclassified_images(pred, writer, target, data, output, epoch)\n\
    \n    total_loss /= len(test_loader)\n    accuracy = 100\\. * correct / len(test_loader.dataset)\n\
    ```\n\n4.  现在，我们在 TensorBoard 上记录测试指标："
  fmt: "\n在此秘籍中，我们在构造器中添加了`num_layers`参数以控制模型中 LSTM 的层数，并将其作为关键字参数`num_layers`传递给\
    \ LSTM 定义。\n\n然后，在`forward()`方法中，由于隐藏状态的形状是`[num_layers * num_directions, batch,\
    \ hidden_dim]`（默认情况下`num_direction`是`1`），因此我们仅使用`hidden[-1]`从最后一个 LSTM 层获取了隐藏状态。这意味着`hidden[-1]`给出了最后一层的隐藏状态。通过这样做，我们可以选择`num_layers`作为超参数。来自较低层的隐藏状态输出作为较高状态的输入传递。\n\
    \n## 更多\n在本秘籍中，我们仅考虑了最后一个 LSTM 层的隐藏状态。但是，可能存在使用所有隐藏层的复杂架构。有一個`dropout`参数，可用于在多层\
    \ LSTM 的各层之间施加丢弃。\n\n## 另见\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#lstm)上了解有关多层\
    \ LSTM 的更多信息。\n\n# 双向 LSTM\n该秘籍以多层 LSTM 秘籍为基础。在正常的 LSTM 中，LSTM 会从头到尾读取输入序列。但是，在双向\
    \ LSTM 中，有第二个 LSTM 从最后到第一个读取序列，即反向 RNN。当当前时间戳的预测取决于序列中进一步输入时，这种类型的 LSTM 可以提高模型表现。考虑示例“我看过漫画”和“我昨天看过漫画”。在这种情况下，基于将来出现的标记，相同的标记（即`read`）具有不同的含义。我们将在本秘籍中探讨其实现。\n\
    \n## 准备\n该秘籍建立在“多层 LSTM”秘籍的基础上，因此在尝试该秘籍之前，请务必先完成该秘籍。\n\n## 操作步骤\n在此秘籍中，我们将修改“多层\
    \ LSTM”秘籍中的类定义，使其成为双向 LSTM：\n1. 我们将`bidirectional`参数设置为`True`：\n```\nself.rnn\
    \ = nn.LSTM(embedding_dim, hidden_dim, num_layers=num_layers, bidirectional=True)\n\
    ```\n2. 然后，我们将更改全连接层的输入尺寸：\n```\nself.fc = nn.Linear(2*hidden_dim, output_dim)\n\
    ```\n3. 然后，将输入更新为全连接层，如下所示：\n```\nhidden = self.dropout(torch.cat((hidden[-2,:,:],\
    \ hidden[-1,:,:]), dim=1))\nreturn self.fc(hidden.squeeze(0))\n```\n现在，类定义如下所示：\n\
    ```\nclass BiLSTMClassifier(nn.Module):\n    def __init__(self, embedding_dim,\
    \ hidden_dim, output_dim, dropout, num_layers):\n        self.embedding = nn.Embedding(len(Review.vocab),\
    \ embedding_dim)\n        self.rnn = nn.LSTM(embedding_dim, hidden_dim, num_layers=num_layers,\
    \ bidirectional=True)\n        self.fc = nn.Linear(2*hidden_dim, output_dim)\n\
    \        self.dropout = nn.Dropout(dropout)\n\n    def forward(self, x):\n   \
    \     x = self.embedding(x)\n        output, (hidden, cell) = self.rnn(x)\n  \
    \      hidden = self.dropout(torch.cat((hidden[-2,:,:], hidden[-1,:,:]), dim=1))\n\
    \        return self.fc(hidden.squeeze(0))\n```\n4. 然后，我们创建模型对象：\n```\n>>model\
    \ = BiLSTMClassifier(EMBEDDING_DIM, HIDDEN_DIM, OUTPUT_DIM, DROPOUT, NUM_LAYERS)\n\
    ```\n通过此秘籍，我们修改了网络，使其现在是双向 LSTM。\n\n## 工作原理\n在此秘籍中，我们在 LSTM 定义中将`bidirectional`标志设置为`True`。我们将前向和后向\
    \ LSTM 的隐藏状态连接起来，并将它们传递到全连接层中。因此，全连接层的输入尺寸增加了一倍，以适应前向和后向隐藏状态张量。\n在`forward()`方法中，我们使用`torch.cat()`连接了向前和向后隐藏状态，并使用了向前和向后\
    \ LSTM 的最后一个隐藏状态。在 PyTorch 中，隐藏状态堆叠为`[forward_layer_0, backward_layer_0, forward_layer_1,\
    \ backward_layer_1, ..., forward_layer_n, backward_layer_n]`，因此所需的张量为`hidden[-2,:,:],\
    \ hidden[-1,:,:]`。连接后，在挤出额外的尺寸后，我们将隐藏的向量传递到全连接层中。\n\n## 更多\n我们选择了最后的前向和后向隐藏状态并将它们连接起来，这就是我们选择的架构。但是，根据手头的任务，我们可以选择任何或所有隐藏状态。\n\
    \n## 另见\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#lstm)上了解有关多层 LSTM\
    \ 的更多信息。\n\n# 五、迁移学习和 TensorBoard\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/5.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/5.md)\n\
    \n迁移学习是深度学习中的一个重要概念，它使我们可以将深度学习用于各种日常任务。这是一种机器学习技术，其中针对任务训练的模型被重用以创建用于类似任务的新模型。我们采用在大型数据集上训练的模型，并将其知识迁移到较小的数据集。对于具有**卷积神经网络**（**CNN**）的计算机视觉任务，我们冻结了网络的早期卷积层，仅训练了最后几层。早期的卷积层提取适用于整个图像的通用低级特征，以检测边缘，图案和梯度，而稍后的层识别图像中的特定特征，并且特定于数据集。\n\
