    \n# 导出至 ONNX\n\n在本秘籍中，我们将介绍如何将 PyTorch 模型导出到**开放神经网络交换**（**ONNX**），该模型为深度学习和传统机器学习模型提供了一种开源格式。\
    \ 它定义了一个可扩展的计算图模型，以及内置的运算符和标准数据类型。\n\nONNX 得到了广泛的支持，可以在许多框架，工具和硬件中找到，因为它可以实现不同框架之间的互操作性，并可以实现从研究到生产的过渡。\n\
    \n# 准备\n\n对于此秘籍，我们需要安装 ONNX，可以使用以下命令进行安装：\n\n```\npip install onnx\n```\n\n这样，我们就可以进行秘籍了。\n\
    \n对于此秘籍，我们还将需要在第 3 章，“用于计算机视觉的卷积神经网络”中在`CIFAR-10`上训练的模型的训练权重。\n\n# 操作步骤\n\n在本秘籍中，我们将\
    \ CIFAR-1o 模型导出为 ONNX 格式，并使用`onnxruntime`运行它。 请按照以下步骤操作：\n\n1.  我们将从导入开始：\n\n\
    ```\n>>import onnx\n>>import onnxruntime\n>>import torch.nn as nn\n>>import torch\n\
    >>import torch.nn.functional as F\n>>import numpy as np\n```\n\n2.  接下来，我们将定义模型类：\n\
    \n```\n>>class CNN(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.conv1 = nn.Conv2d(3, 16, 3, padding=1)\n        self.conv2 = nn.Conv2d(16,\
    \ 32, 3, padding=1)\n        self.conv3 = nn.Conv2d(32, 64, 3, padding=1)\n  \
    \      self.pool = nn.MaxPool2d(2, 2)\n        self.linear1 = nn.Linear(64 * 4\
    \ * 4, 512)\n        self.linear2 = nn.Linear(512, 10) \n        self.dropout\
    \ = nn.Dropout(p=0.3)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n\
    \        x = self.pool(F.relu(self.conv2(x)))\n        x = self.pool(F.relu(self.conv3(x)))\n\
    \        x = x.view(-1, 64 * 4 * 4)\n        x = self.dropout(x)\n        x =\
    \ F.relu(self.linear1(x))\n        x = self.dropout(x)\n        x = self.linear2(x)\n\
    \        return x\n```\n\n3.  然后，我们将创建模型对象并从我们的训练中加载权重：\n\n```\n>>model = CNN()\n\
    >>model.load_state_dict(torch.load(\"cifar10.pth\"))\n<All keys matched successfully>\n\
    ```\n\n4.  接下来，我们将模型设置为评估模式：\n\n```\n>>model.eval()\n\nCNN(\n  (conv1): Conv2d(3,\
    \ 16, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (conv2): Conv2d(16,\
    \ 32, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (conv3): Conv2d(32,\
    \ 64, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (pool): MaxPool2d(kernel_size=2,\
    \ stride=2, padding=0, dilation=1, ceil_mode=False)\n  (linear1): Linear(in_features=1024,\
    \ out_features=512, bias=True)\n  (linear2): Linear(in_features=512, out_features=10,\
    \ bias=True)\n  (dropout): Dropout(p=0.3, inplace=False)\n)\n```\n\n5.  现在，我们将创建一个随机变量：\n\
    \n```\n>>x = torch.randn(1, 3, 32, 32, requires_grad=True)\n```\n\n6.  接下来，我们将获得随机变量`x`的输出：\n\
    \n```\n>>model_out = model(x)\n```\n\n7.  之后，我们将模型及其权重导出到`onnx`模型中：\n\n```\n>torch.onnx.export(model,\n\
    \                 x,\n                 \"cifar.onnx\",\n                 export_params=True,\n\
    \                 opset_version=10, \n                 do_constant_folding=True,\
    \ \n                 input_names = ['input'], \n                 output_names\
    \ = ['output'],\n                 dynamic_axes={'input' : {0 : 'batch_size'},\n\
    \                               'output' : {0 : 'batch_size'}})\n```\n\n8.  接下来，我们将加载并检查`onnx`模型：\n\
    \n```\n>>onnx_model = onnx.load(\"cifar.onnx\")\n>>onnx.checker.check_model(onnx_model)\n\
    ```\n\n9.  我们将`onnx`加载到 ONNX 运行时中：\n\n```\n>>ort_session = onnxruntime.InferenceSession(\"\
    cifar.onnx\")\n```\n\n0.  现在，定义`to_numpy()`函数：\n\n```\n>>def to_numpy(tensor):\n\
    \    return tensor.detach().cpu().numpy() if tensor.requires_grad else tensor.cpu().numpy()\n\
    ```"
