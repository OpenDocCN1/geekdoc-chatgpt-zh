    \    )\n```\n这样，我们就完成了模型的定义。\n\n## 工作原理\n在此秘籍中，函数处于观察状态，并通过两个线性层和一个 `ReLU` 单元（在隐藏层中有\
    \ 128 个单元）运行它。最后一层的输出通过 `softmax` 函数传递，以将激活转换为概率，并选择概率最高的动作。\n\n## 更多\n对于复杂模型，您还可以具有多个层和不同数量的单元。\n\
