    \ 10000)\n```\n\n7. 现在，我们将从训练集中创建一个验证集； 为此，我们将从 `torch` 模块进行导入：\n\n```\n>>from\
    \ torch.utils.data.sampler import SubsetRandomSampler\n```\n\n8. 我们将选择 20% 的训练数据作为验证数据：\n\
    \n```\n>>validation_size = 0.2\n```\n\n9. 现在，我们将导入 `numpy`：\n\n```\n>>import numpy\
