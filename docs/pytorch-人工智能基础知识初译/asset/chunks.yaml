    \ = 0.01\n>>EXPLORE_DECAY = 0.995\n>>MEMORY_LEN = 1_000_000\n>>UPDATE_FREQ = 10\n\
    ```\n\n3.  现在，我们需要初始化环境和 DQN：\n\n```\n>>env = gym.make(ENV_NAME)\n>>observation_space\
    \ = env.observation_space.shape[0]\n>>action_space = env.action_space.n\n>>dqn\
    \ = DQN(observation_space, action_space)\n```\n\n4.  现在，让我们开始训练循环：\n\n```\n>>for\
    \ i in range(100):\n    state = env.reset()\n    state = np.reshape(state, [1,\
