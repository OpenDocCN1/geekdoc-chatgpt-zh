- raw: "然后，我们开始训练生成器，并且生成器应该能够欺骗判别器。 生成器必须纠正判别器正确预测生成的图像为假的情况。 因此，只要来自判别器的预测将生成的图像标记为伪造，就会增加生成器损失`gerror`。\
    \ 然后，我们计算梯度并更新生成器权重。\n\n然后，我们定期显示模型指标，并保存固定噪声生成器生成的图像，以可视化模型在各个周期的表现。\n\n# 更多\n\
    \n您可以利用网络的超参数发挥更多的作用-例如，您可以对判别器优化器使用与生成器不同的学习率，或者对判别器的每次更新训练生成器两次或三次。\n\n# 另见\n\
    \n您可以在 [这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html)和[这个页面](https://iq.opengenus.org/deep-convolutional-gans-pytorch/)上看到训练和架构\
    \ DCGAN 的另一个示例。\n\n# 可视化 DCGAN 结果\n\n以前我们已经看到，使用 GAN，生成器和判别器相互竞争，并且这样做可以产生越来越好的图像。\
    \ 但是，从理论上讲，它们达到了生成器已捕获真实图像的所有特征的程度，并且生成器无法学习。 同样，判别器只能猜测给定图像是真实的还是伪造的，成功机会为 50/50。\
    \ 在这一点上，据说 GAN 已经收敛。\n\n现在，任何方面的改善都会导致另一面的结果降低，这是**零和**状态或**纳什平衡**； 但是在实践中很难实现，因为生成器和判别器都在不断变化，因此检查\
    \ GAN 表现的最佳方法是通过图形和图表。 在本秘籍中，我们将快速了解可视化。\n\n# 准备好\n\n对于此秘籍，您必须具有`matplotlib`和`numpy`库，可以使用`pip`如下安装它们：\n\
    \n```\npip install matplotlib\npip install numpy\n```\n\n安装这些工具后，我们将继续进行操作。\n\n\
    # 操作步骤\n\n在此秘籍中，我们将快速绘制 GAN 中的图形和图像：\n\n1.  我们将从导入开始：\n\n```\n>>import matplotlib.pyplot\
    \ as plt\n>>import numpy as np\n```\n\n2.  然后，我们将添加图的大小和标题：\n\n```\n>>plt.figure(figsize=(10,5))\n\
    >>plt.title(\"Generator and Discriminator Loss During Training\")\n```\n\n3. \
    \ 接下来，我们添加生成器和判别器损失：\n\n```\n>>plt.plot(g_losses,label=\"Generator\")\n>>plt.plot(d_losses,label=\"\
    Discriminator\")\n```\n\n4.  然后，我们添加`x`和`y`轴标签：\n\n```\n>>plt.xlabel(\"iterations\"\
    )\n>>plt.ylabel(\"Loss\")\n```\n\n5.  接下来，我们为图添加图例：\n\n```\n>>plt.legend()\n```\n\
    \n6.  最后，我们显示该图：\n\n```\n>>plt.show()\n```\n\n这将给出以下输出：\n\n![](Images/62156cfc27da1fab22be4d59af750688.png)\n\
    \n7.  然后，我们遍历`image_list`中的图像并显示它们：\n\n```\n>>for image in image_list:\n    plt.imshow(np.transpose(image,(1,2,0)))\n\
    \    plt.show()\n```\n\n结果为以下输出：\n\n![](Images/da1bce3f6f8f92d26350fad9c6812153.png)\n\
    \n在这里，我们看到了 DCGAN 生成的手写图像。\n\n# 工作原理\n\n在本秘籍中，我们使用 matplotlib 绘制图形和图像。 我们使用`figure()`和`title()`方法设置图形尺寸和标题，然后使用`plot()`方法绘制生成器和判别器损失。\
    \ 我们还使用`xlabel`和`ylabel`方法添加了`x`和`y`标签。 我们还使用`legend()`方法为图添加了图例，最后使用`show()`方法显示了图。\n\
    \n我们遍历训练期间保存在`image_list`中的图像，并使用 NumPy 的`transpose()`方法以所需顺序固定图像的尺寸。 `image_list`中的图像是使用`torchvision.util.make_grid()`方法生成的，我们根据噪声向量创建了生成图像的网格。\n\
    \n# 更多\n\n您可以使用其他库（例如 plotly 和 seaborn）来绘制和美化图形。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html#results)上看到\
    \ DCGAN 的可视化效果和动画。\n\n# 使用 PyTorch Hub 运行 PGGAN\n\n在本秘籍中，我们将研究**渐进 GAN**（**PGGAN**），与\
    \ DCGAN 相比它们是高级 GAN，并且能够生成逼真的图像。 PGGAN 分多个阶段训练 GAN 网络。 它具有`z`的潜在特征，并使用两个反卷积层生成`4×4`图像。\
    \ 在判别器方面，网络使用两个卷积层训练生成的`4 x 4`图像。 网络稳定后，它会在判别器中再增加两个卷积层以将图像上采样到`8 x 8`，再增加两个卷积层以对图像下采样。\n\
    \n经过 9 个这样的序列后，生成器将生成`1024 x 1024`个图像。 PGGAN 的渐进式训练策略相对于常规 GAN 具有优势，因为它可以加快并稳定训练。\
    \ 之所以如此，是因为大多数训练都是在较低的分辨率下进行的，而在网络达到各个阶段的稳定性之后，会逐渐发展为较高的分辨率。\n\n以下是 PGGAN 的抽象表示形式：\n\
    \n![](Images/d02da1eb250e5d150ddc923a34dae057.png)\n\nPGGAN 的关键创新可以总结如下：\n\n*\
    \   **高分辨率层中的逐渐增长和平滑淡化**：它从低分辨率卷积变为高分辨率卷积，而不是立即跳变分辨率，而是通过参数平滑地淡化了具有更高分辨率的 nedonew\
    \ 层`α`（介于 0 和 1 之间）的大小，用于控制我们使用旧的还是放大的较大输出。\n\n*   **小批量标准差**：我们计算判别器的统计信息，即生成器生成或来自真实数据的小批量中所有像素的标准差。\
    \ 现在，判别器需要了解，如果要评估的批量中图像的标准差较低，则该图像很可能是伪造的，因为真实数据的方差更高。 因此，生成器必须增加所生成样本的方差，以欺骗判别器。\n\
    \n*   **均衡的学习率**：所有权重（`w`）被归一化（`w'`）在某个范围内，以便`w' = w / c`的常数`c`对于每一层来说都是不同的，具体取决于权重矩阵的形状。\n\
    \n*   **逐像素特征归一化**：对每个像素中的特征向量进行归一化，因为批量规范最适合大型微型批量，并且占用大量内存。\n\nNvidia 最初执行 PGGAN\
    \ 的过程要花一到两个月的时间。 但是，为了让我们看到 PGGAN 的表现，我们将使用 PyTorch Hub，它是使用 PyTorch 构建的预训练模型的存储库。\n\
    \n# 准备\n\n为了使割炬轮毂正常工作，您需要拥有 PyTorch 版本 1.1.0 或更高版本。\n\n# 操作步骤\n\n在此秘籍中，我们将从火炬中心运行\
    \ PGGAN：\n\n1.  首先，我们将设置导入：\n\n```\n>>import torch\n>>import matplotlib.pyplot\
    \ as plt\n>>import torchvision\n```\n\n2.  然后我们检查 GPU：\n\n```\n>>use_gpu = True\
    \ if torch.cuda.is_available() else False\n```\n\n3.  接下来，我们加载预训练的 PGGAN 模型：\n\
    \n```\n>>model = torch.hub.load('facebookresearch/pytorch_GAN_zoo:hub', 'PGAN',\
    \ \n                       model_name='celebAHQ-512',\n                      \
    \ pretrained=True, \n                       useGPU=use_gpu)\n```\n\n4.  然后我们产生噪音：\n\
    \n```\n>>num_images = 5\n>>noise, _ = model.buildNoiseData(num_images)\n```\n\n\
    5.  接下来，我们获得生成器输出\n\n```\n>>with torch.no_grad():\n    generated_images = model.test(noise)\n\
    ```\n\n6.  最后，我们制作图像网格并显示它：\n\n```\n>>grid = torchvision.utils.make_grid(generated_images.clamp(min=-1,\
    \ max=1), scale_each=True, normalize=True)\n>>plt.imshow(grid.permute(1, 2, 0).cpu().numpy())\n\
    ```\n\n在这里，我们看到了从 PGGAN 生成的面部图像：\n\n![](Images/65f57fe2bebc0a4ee804d44e51320fa3.png)\n\
    \n通过前面的步骤，我们学习了如何使用 PyTorch Hub 运行 PGGAN。\n\n# 工作原理\n\n在此秘籍中，我们加载了在`celebAHQ`数据集上训练的\
    \ PGGAN 预训练模型； 为此，我们使用了`torch.hub`中的`load()`方法。 然后，我们定义了创建和生成尺寸为`num_images x\
    \ 512`的噪声向量所需的图像数量，因为此模型使用大小为 512 的噪声向量进行训练，所有噪声向量都由`buildNoiseData()`方法内部处理，它在模型对象中可用。\n\
    \n`model.test()`方法生成了我们用来制作网格的图像。 钳位方法将所有值限制在`min`和`max`定义的范围内。 `.cpu()`方法将生成的图像移至\
    \ CPU，我们使用`permute`固定尺寸。 最后，`plt.imshow()`显示了我们创建的网格。\n\n# 更多\n\n您可以在[这里](https://github.com/github-pengge/PyTorch-progressive_growing_of_gans)探索完整的\
    \ PGGAN 实现。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/hub.html)上了解有关割炬轮毂的更多信息。\n\
    \n您可以在[这里](https://github.com/tkarras/progressive_growing_of_gans)和[这里](https://research.nvidia.com/publication/2017-10_Progressive-Growing-of)。\n\
    \n# 七、深度强化学习\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md)\
    \ \n\n在本章中，我们将探索**神经网络**（**NNs**）在使用 PyTorch 进行**强化学习**（**RL**）上的应用。\n\nRL 是**人工智能**（**AI**）的领域，与我们在前面各章中介绍的其他机器学习格式不同。\
    \ RL 是机器学习算法的子类，它通过最大化环境中的奖励来进行学习。 当问题涉及决策或采取行动时，这些算法很有用。\n\n在本章中，我们将介绍以下秘籍：\n\
    \n*   OpenAI Gym 简介– CartPole\n\n*   DQN 简介\n\n*   实现 DQN 类\n\n*   训练 DQN\n\n\
    *   深度 GA 简介\n\n*   生成智能体\n\n*   选择智能体\n\n*   使智能体突变\n\n*   训练深度 GA\n\n# 深入了解\
    \ RL\n\n**智能体**是任何 RL 问题的核心。 它是 RL 算法的一部分，它处理输入信息以执行操作。 它探索和利用重复试验中的知识，以学习如何最大化奖励。\
    \ 智能体必须处理的场景称为**环境**，而**动作**是智能体可以在给定环境中进行的动作。 采取行动后从环境中获得的回报称为**奖励**，智能体根据当前状态决定使用下一行动的行动过程称为**策略**。\
    \ 相对于短期奖励，带有折扣的预期长期回报称为**值**。**Q 值**与该值相似，但具有附加的当前动作参数。\n\n现在，我们已经了解了 RL 的上下文，让我们理解为什么我们应该使用**深度\
    \ RL**（**DRL**）而不是 RL。 DRL 将 RL 与深度学习相结合，后者使用 NN 解决 RL 问题。\n\n深度学习算法可以学习抽象出环境状态的细节，然后学习状态的重要特征。\
    \ 由于深度学习算法仅具有有限数量的参数，因此我们可以使用它将可能的状态压缩为更少的状态，然后使用该新表示形式来选择一个动作。\n\nRL 解决方案涉及将反复试验的结果存储在查找表中，当环境变得越来越复杂时，查找表将变得非常庞大。\
    \ 深度神经网络可能会学会识别程序员自己必须使用查找表方法手动设计的相同高级特征。\n\n深度学习是 RL 最近取得突破的背后。 它们展现了代表性的功能，效率，灵活性，并为眼前的问题提供了简化的解决方案。\n\
    \n# OpenAI Gym 简介 – CartPole\n\n在本秘籍中，我们将实现两种不同的 RL 算法。 我们将需要一个环境来运行我们的算法，以便我们创建的模型将获得最大的回报。\n\
    \n我们将使用 OpenAI 的体育馆库，该库是我们可以用来训练模型的环境的集合。 我们将专注于称为`Cartpole-v1`的特定环境。\n\n杆子是一个倒立的摆锤，其重心高于其枢轴点。\
    \ 为了控制倒立摆的不稳定位置，我们必须将枢轴点移动到质心下方。 目的是施加适当的力，以使柱杆在枢轴点上保持平衡。\n\n下图显示了 OpenAI Gym\
    \ 的 Cartpole：\n\n![](Images/3ace67c6e9620acc1c3c4df7b7702725.png)\n\n￼图 1：OpenAI\
    \ Gym– Cartpole\n\n撑杆通过未激活的接头连接到推车，该接头在水平轨道上自由移动。 摆锤垂直于水平轨道开始。 目的是通过施加力 +1 和 -1\
    \ 来防止跌落。\n\n当杆与垂直位置的夹角超过 15 度时，或者手推车从中心移出的单位超过 2.4 个单位时，则认为手推车未能达到目标。\n\n对于杆保持直立的每个时间步，都会获得+1\
    \ 的奖励。 现在我们有了上下文，我们将尝试解决 OpenAI Gym 的 Cartpole 问题的代码。\n\n# 准备\n\n首先，我们需要安装`gym`。\
    \ 我们将使用`pip`管理器安装它：\n\n```\npip install gym\n```\n\n现在我们已经安装了`gym`，让我们跳入`gym`库。\n\
    \n# 操作步骤\n\n在本秘籍中，我们将了解棘突环境。 请按照以下步骤操作：\n\n1.  我们将从导入`gym`模块开始：\n\n```\n>>import\
    \ gym\n```\n\n2.  接下来，我们将创建环境：\n\n```\n>>env = gym.make('CartPole-v0')\n```\n\n\
    3.  接下来，我们将重置环境：\n\n```\n>>env.reset()\n```\n\n4.  现在，我们将渲染环境：\n\n```\n>>for _\
    \ in range(1000):\n    env.render()\n    action = env.action_space.sample()\n\
    \    observation, reward, done, info = env.step(action)\n    if done:\n      \
    \  env.reset()\n>>env.close()\n```\n\n这将为我们提供以下输出：\n\n![](Images/5ddc9728136a9fbba224264b6657467a.png)\n\
    \n图 2：柱极环境的输出\n\n5.  获取可以执行的可能动作的数量：\n\n```\n>>env.action_space.n\n2\n```\n\n\
    6.  获取观察状态参数的数量：\n\n```\n>>env.observation_space.shape[0]\n4\n```\n\n这样，您将看到一个窗口，该窗口显示不稳定的枢轴，并且枢轴点随机移动。\n\
    \n# 工作原理\n\n在本秘籍中，我们探讨了 OpenAI Gym 的一些功能。 我们首先使用`Cartpole-v0`创建一个环境，该环境的最高可得分为\
    \ 200，然后环境终止。 我们使用`env.reset()`命令将环境置于初始状态，即线杆处于直立位置。 然后，我们开始执行 1000 个步骤的循环，其中使用`render()`渲染了当前环境的开始，并且使用`env.action_space.sample()`为当前状态选择了一个随机动作。\
    \ 然后，我们将选定的动作传递到环境的`step`方法中。 `step`方法告诉我们在对环境的当前状态执行当前操作时环境发生了什么。 `step`方法返回以下内容：\n\
    \n*   **观察**：这是一个对象，它告诉我们有关环境的新状态。 该对象特定于我们选择的环境。\n\n*   **奖励**：这给了我们所选动作所获得的奖励。\
    \ 如果是直杆，则直杆直立时每个时间步长为 1.0，否则为 0.0。\n\n*   **完成**：这是一个布尔值，它告诉我们环境是否已达到最终状态，可能是由于手头的任务失败而导致的（如果是小刀杆，则是当刀杆无法保持直立位置时）\
    \ ，或者从完成手头的任务开始（对于小偷来说，就是达到最大时间步长 200 的时间）。\n\n*   **信息**：对调试有用的诊断信息。\n\n在循环中，每当极点翻倒时，我们都会将环境重置为其初始状态。\n\
    \n最后，我们关闭了环境。 我们使用`env.action_space.n`查看了环境中可能采取的行动，并使用`env.observation_space.shape[0]`查看了处于观察状态的参数。\
    \ 现在我们已经了解了环境，我们可以开始实现各种深度 RL 算法。\n\n# 更多\n\n您可以通过更改环境名称来尝试其他环境。 试用`Cartpole-v1`对您来说将是有益的。\n\
    \n# 另见\n\n您可以在[这个页面](http://gym.openai.com/docs/)上了解有关 OpenAI Gym 的更多信息。\n\n#\
    \ DQN 介绍\n\n在进入下一个秘籍之前，让我们快速看一下 DQN。"
  fmt: "\n然后，我们开始训练生成器，并且生成器应该能够欺骗判别器。 生成器必须纠正判别器正确预测生成的图像为假的情况。 因此，只要来自判别器的预测将生成的图像标记为伪造，就会增加生成器损失`gerror`。\
    \ 然后，我们计算梯度并更新生成器权重。\n\n然后，我们定期显示模型指标，并保存固定噪声生成器生成的图像，以可视化模型在各个周期的表现。\n\n# 生成器训练\n\
    \n## 更多\n您可以利用网络的超参数发挥更多的作用-例如，您可以对判别器优化器使用与生成器不同的学习率，或者对判别器的每次更新训练生成器两次或三次。\n\
    \n## 另见\n您可以在 [这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html)和[这个页面](https://iq.opengenus.org/deep-convolutional-gans-pytorch/)上看到训练和架构\
    \ `DCGAN` 的另一个示例。\n\n# 可视化 DCGAN 结果\n\n以前我们已经看到，使用 GAN，生成器和判别器相互竞争，并且这样做可以产生越来越好的图像。\
    \ 但是，从理论上讲，它们达到了生成器已捕获真实图像的所有特征的程度，并且生成器无法学习。 同样，判别器只能猜测给定图像是真实的还是伪造的，成功机会为 50/50。\
    \ 在这一点上，据说 GAN 已经收敛。\n\n现在，任何方面的改善都会导致另一面的结果降低，这是**零和**状态或**纳什平衡**； 但是在实践中很难实现，因为生成器和判别器都在不断变化，因此检查\
    \ GAN 表现的最佳方法是通过图形和图表。 在本秘籍中，我们将快速了解可视化。\n\n## 准备好\n对于此秘籍，您必须具有`matplotlib`和`numpy`库，可以使用`pip`如下安装它们：\n\
    \n```\npip install matplotlib\npip install numpy\n```\n\n安装这些工具后，我们将继续进行操作。\n\n\
    ## 操作步骤\n在此秘籍中，我们将快速绘制 GAN 中的图形和图像：\n\n1. 我们将从导入开始：\n\n```\n>>import matplotlib.pyplot\
    \ as plt\n>>import numpy as np\n```\n\n2. 然后，我们将添加图的大小和标题：\n\n```\n>>plt.figure(figsize=(10,5))\n\
    >>plt.title(\"Generator and Discriminator Loss During Training\")\n```\n\n3. 接下来，我们添加生成器和判别器损失：\n\
    \n```\n>>plt.plot(g_losses,label=\"Generator\")\n>>plt.plot(d_losses,label=\"\
    Discriminator\")\n```\n\n4. 然后，我们添加`x`和`y`轴标签：\n\n```\n>>plt.xlabel(\"iterations\"\
    )\n>>plt.ylabel(\"Loss\")\n```\n\n5. 接下来，我们为图添加图例：\n\n```\n>>plt.legend()\n```\n\
    \n6. 最后，我们显示该图：\n\n```\n>>plt.show()\n```\n\n这将给出以下输出：\n\n![](Images/62156cfc27da1fab22be4d59af750688.png)\n\
    \n7. 然后，我们遍历`image_list`中的图像并显示它们：\n\n```\n>>for image in image_list:\n    plt.imshow(np.transpose(image,(1,2,0)))\n\
    \    plt.show()\n```\n\n结果为以下输出：\n\n![](Images/da1bce3f6f8f92d26350fad9c6812153.png)\n\
    \n在这里，我们看到了 DCGAN 生成的手写图像。\n\n## 工作原理\n在本秘籍中，我们使用 `matplotlib` 绘制图形和图像。 我们使用`figure()`和`title()`方法设置图形尺寸和标题，然后使用`plot()`方法绘制生成器和判别器损失。\
    \ 我们还使用`xlabel`和`ylabel`方法添加了`x`和`y`标签。 我们还使用`legend()`方法为图添加了图例，最后使用`show()`方法显示了图。\n\
    \n我们遍历训练期间保存在`image_list`中的图像，并使用 NumPy 的`transpose()`方法以所需顺序固定图像的尺寸。 `image_list`中的图像是使用`torchvision.util.make_grid()`方法生成的，我们根据噪声向量创建了生成图像的网格。\n\
    \n## 更多\n您可以使用其他库（例如 `plotly` 和 `seaborn`）来绘制和美化图形。\n\n## 另见\n您可以在[这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html#results)上看到\
    \ `DCGAN` 的可视化效果和动画。\n\n# 使用 PyTorch Hub 运行 PGGAN\n\n在本秘籍中，我们将研究渐进 GAN（`PGGAN`），与\
    \ `DCGAN` 相比它们是高级 GAN，并且能够生成逼真的图像。 `PGGAN` 分多个阶段训练 GAN 网络。 它具有`z`的潜在特征，并使用两个反卷积层生成`4×4`图像。\
    \ 在判别器方面，网络使用两个卷积层训练生成的`4 x 4`图像。 网络稳定后，它会在判别器中再增加两个卷积层以将图像上采样到`8 x 8`，再增加两个卷积层以对图像下采样。\n\
    \n经过 9 个这样的序列后，生成器将生成`1024 x 1024`个图像。 `PGGAN` 的渐进式训练策略相对于常规 GAN 具有优势，因为它可以加快并稳定训练。\
    \ 之所以如此，是因为大多数训练都是在较低的分辨率下进行的，而在网络达到各个阶段的稳定性之后，会逐渐发展为较高的分辨率。\n\n以下是 `PGGAN` 的抽象表示形式：\n\
    \n![](Images/d02da1eb250e5d150ddc923a34dae057.png)\n\n`PGGAN` 的关键创新可以总结如下：\n\n\
    * **高分辨率层中的逐渐增长和平滑淡化**：它从低分辨率卷积变为高分辨率卷积，而不是立即跳变分辨率，而是通过参数平滑地淡化了具有更高分辨率的 nedonew\
    \ 层`α`（介于 0 和 1 之间）的大小，用于控制我们使用旧的还是放大的较大输出。\n* **小批量标准差**：我们计算判别器的统计信息，即生成器生成或来自真实数据的小批量中所有像素的标准差。\
    \ 现在，判别器需要了解，如果要评估的批量中图像的标准差较低，则该图像很可能是伪造的，因为真实数据的方差更高。 因此，生成器必须增加所生成样本的方差，以欺骗判别器。\n\
    * **均衡的学习率**：所有权重（`w`）被归一化（`w'`）在某个范围内，以便`w' = w / c`的常数`c`对于每一层来说都是不同的，具体取决于权重矩阵的形状。\n\
    * **逐像素特征归一化**：对每个像素中的特征向量进行归一化，因为批量规范最适合大型微型批量，并且占用大量内存。\n\nNvidia 最初执行 `PGGAN`\
    \ 的过程要花一到两个月的时间。 但是，为了让我们看到 `PGGAN` 的表现，我们将使用 `PyTorch Hub`，它是使用 `PyTorch` 构建的预训练模型的存储库。\n\
    \n## 准备\n为了使割炬轮毂正常工作，您需要拥有 `PyTorch` 版本 1.1.0 或更高版本。\n\n## 操作步骤\n在此秘籍中，我们将从火炬中心运行\
    \ `PGGAN`：\n\n1. 首先，我们将设置导入：\n\n```\n>>import torch\n>>import matplotlib.pyplot\
    \ as plt\n>>import torchvision\n```\n\n2. 然后我们检查 GPU：\n\n```\n>>use_gpu = True\
    \ if torch.cuda.is_available() else False\n```\n\n3. 接下来，我们加载预训练的 `PGGAN` 模型：\n\
    \n```\n>>model = torch.hub.load('facebookresearch/pytorch_GAN_zoo:hub', 'PGAN',\
    \ \n                       model_name='celebAHQ-512',\n                      \
    \ pretrained=True, \n                       useGPU=use_gpu)\n```\n\n4. 然后我们产生噪音：\n\
    \n```\n>>num_images = 5\n>>noise, _ = model.buildNoiseData(num_images)\n```\n\n\
    5. 接下来，我们获得生成器输出\n\n```\n>>with torch.no_grad():\n    generated_images = model.test(noise)\n\
    ```\n\n6. 最后，我们制作图像网格并显示它：\n\n```\n>>grid = torchvision.utils.make_grid(generated_images.clamp(min=-1,\
    \ max=1), scale_each=True, normalize=True)\n>>plt.imshow(grid.permute(1, 2, 0).cpu().numpy())\n\
    ```\n\n在这里，我们看到了从 `PGGAN` 生成的面部图像：\n\n![](Images/65f57fe2bebc0a4ee804d44e51320fa3.png)\n\
    \n通过前面的步骤，我们学习了如何使用 `PyTorch Hub` 运行 `PGGAN`。\n\n## 工作原理\n在此秘籍中，我们加载了在`celebAHQ`数据集上训练的\
    \ `PGGAN` 预训练模型； 为此，我们使用了`torch.hub`中的`load()`方法。 然后，我们定义了创建和生成尺寸为`num_images\
    \ x 512`的噪声向量所需的图像数量，因为此模型使用大小为 512 的噪声向量进行训练，所有噪声向量都由`buildNoiseData()`方法内部处理，它在模型对象中可用。\n\
    \n`model.test()`方法生成了我们用来制作网格的图像。 钳位方法将所有值限制在`min`和`max`定义的范围内。 `.cpu()`方法将生成的图像移至\
    \ CPU，我们使用`permute`固定尺寸。 最后，`plt.imshow()`显示了我们创建的网格。\n\n## 更多\n您可以在[这里](https://github.com/github-pengge/PyTorch-progressive_growing_of_gans)探索完整的\
    \ `PGGAN` 实现。\n\n## 另见\n您可以在[这个页面](https://pytorch.org/docs/stable/hub.html)上了解有关割炬轮毂的更多信息。\n\
    \n您可以在[这里](https://github.com/tkarras/progressive_growing_of_gans)和[这里](https://research.nvidia.com/publication/2017-10_Progressive-Growing-of)。\n\
    \n# 七、深度强化学习\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md)\n\
    \n在本章中，我们将探索**神经网络**（**NNs**）在使用 `PyTorch` 进行**强化学习**（**RL**）上的应用。\n\n`RL` 是**人工智能**（**AI**）的领域，与我们在前面各章中介绍的其他机器学习格式不同。\
    \ `RL` 是机器学习算法的子类，它通过最大化环境中的奖励来进行学习。 当问题涉及决策或采取行动时，这些算法很有用。\n\n在本章中，我们将介绍以下秘籍：\n\
    \n* OpenAI Gym 简介– CartPole\n* DQN 简介\n* 实现 DQN 类\n* 训练 DQN\n* 深度 GA 简介\n* 生成智能体\n\
    * 选择智能体\n* 使智能体突变\n* 训练深度 GA\n\n## 深入了解 RL\n**智能体**是任何 `RL` 问题的核心。 它是 `RL` 算法的一部分，它处理输入信息以执行操作。\
    \ 它探索和利用重复试验中的知识，以学习如何最大化奖励。 智能体必须处理的场景称为**环境**，而**动作**是智能体可以在给定环境中进行的动作。 采取行动后从环境中获得的回报称为**奖励**，智能体根据当前状态决定使用下一行动的行动过程称为**策略**。\
    \ 相对于短期奖励，带有折扣的预期长期回报称为**值**。**Q 值**与该值相似，但具有附加的当前动作参数。\n\n现在，我们已经了解了 `RL` 的上下文，让我们理解为什么我们应该使用**深度\
    \ RL**（**DRL**）而不是 `RL`。 `DRL` 将 `RL` 与深度学习相结合，后者使用 `NN` 解决 `RL` 问题。\n\n深度学习算法可以学习抽象出环境状态的细节，然后学习状态的重要特征。\
    \ 由于深度学习算法仅具有有限数量的参数，因此我们可以使用它将可能的状态压缩为更少的状态，然后使用该新表示形式来选择一个动作。\n\n`RL` 解决方案涉及将反复试验的结果存储在查找表中，当环境变得越来越复杂时，查找表将变得非常庞大。\
    \ 深度神经网络可能会学会识别程序员自己必须使用查找表方法手动设计的相同高级特征。\n\n深度学习是 `RL` 最近取得突破的背后。 它们展现了代表性的功能，效率，灵活性，并为眼前的问题提供了简化的解决方案。\n\
    \n## OpenAI Gym 简介 – CartPole\n\n在本秘籍中，我们将实现两种不同的 `RL` 算法。 我们将需要一个环境来运行我们的算法，以便我们创建的模型将获得最大的回报。\n\
    \n我们将使用 OpenAI 的体育馆库，该库是我们可以用来训练模型的环境的集合。 我们将专注于称为`Cartpole-v1`的特定环境。\n\n杆子是一个倒立的摆锤，其重心高于其枢轴点。\
    \ 为了控制倒立摆的不稳定位置，我们必须将枢轴点移动到质心下方。 目的是施加适当的力，以使柱杆在枢轴点上保持平衡。\n\n下图显示了 OpenAI Gym\
    \ 的 Cartpole：\n\n![](Images/3ace67c6e9620acc1c3c4df7b7702725.png)\n\n图 1：OpenAI\
    \ Gym– CartPole\n\n撑杆通过未激活的接头连接到推车，该接头在水平轨道上自由移动。 摆锤垂直于水平轨道开始。 目的是通过施加力 +1 和 -1\
    \ 来防止跌落。\n\n当杆与垂直位置的夹角超过 15 度时，或者手推车从中心移出的单位超过 2.4 个单位时，则认为手推车未能达到目标。\n\n对于杆保持直立的每个时间步，都会获得+1\
    \ 的奖励。 现在我们有了上下文，我们将尝试解决 OpenAI Gym 的 Cartpole 问题的代码。\n\n### 准备\n首先，我们需要安装`gym`。\
    \ 我们将使用`pip`管理器安装它：\n\n```\npip install gym\n```\n\n现在我们已经安装了`gym`，让我们跳入`gym`库。\n\
    \n### 操作步骤\n在本秘籍中，我们将了解棘突环境。 请按照以下步骤操作：\n\n1. 我们将从导入`gym`模块开始：\n\n```\n>>import\
    \ gym\n```\n\n2. 接下来，我们将创建环境：\n\n```\n>>env = gym.make('CartPole-v0')\n```\n\n\
    3. 接下来，我们将重置环境：\n\n```\n>>env.reset()\n```\n\n4. 现在，我们将渲染环境：\n\n```\n>>for _ in\
    \ range(1000):\n    env.render()\n    action = env.action_space.sample()\n   \
    \ observation, reward, done, info = env.step(action)\n    if done:\n        env.reset()\n\
    >>env.close()\n```\n\n这将为我们提供以下输出：\n\n![](Images/5ddc9728136a9fbba224264b6657467a.png)\n\
    \n图 2：柱极环境的输出\n\n5. 获取可以执行的可能动作的数量：\n\n```\n>>env.action_space.n\n2\n```\n\n6.\
    \ 获取观察状态参数的数量：\n\n```\n>>env.observation_space.shape[0]\n4\n```\n\n这样，您将看到一个窗口，该窗口显示不稳定的枢轴，并且枢轴点随机移动。\n\
    \n### 工作原理\n在本秘籍中，我们探讨了 OpenAI Gym 的一些功能。 我们首先使用`Cartpole-v0`创建一个环境，该环境的最高可得分为\
    \ 200，然后环境终止。 我们使用`env.reset()`命令将环境置于初始状态，即线杆处于直立位置。 然后，我们开始执行 1000 个步骤的循环，其中使用`render()`渲染了当前环境的开始，并且使用`env.action_space.sample()`为当前状态选择了一个随机动作。\
    \ 然后，我们将选定的动作传递到环境的`step`方法中。 `step`方法返回以下内容：\n\n* **观察**：这是一个对象，它告诉我们有关环境的新状态。\
    \ 该对象特定于我们选择的环境。\n* **奖励**：这给了我们所选动作所获得的奖励。 如果是直杆，则直杆直立时每个时间步长为 1.0，否则为 0.0。\n\
    * **完成**：这是一个布尔值，它告诉我们环境是否已达到最终状态，可能是由于手头的任务失败而导致的（如果是小刀杆，则是当刀杆无法保持直立位置时） ，或者从完成手头的任务开始（对于小偷来说，就是达到最大时间步长\
    \ 200 的时间）。\n* **信息**：对调试有用的诊断信息。\n\n在循环中，每当极点翻倒时，我们都会将环境重置为其初始状态。\n\n最后，我们关闭了环境。\
    \ 我们使用`env.action_space.n`查看了环境中可能采取的行动，并使用`env.observation_space.shape[0]`查看了处于观察状态的参数。\
    \ 现在我们已经了解了环境，我们可以开始实现各种深度 `RL` 算法。\n\n### 更多\n您可以通过更改环境名称来尝试其他环境。 试用`CartPole-v1`对您来说将是有益的。\n\
    \n### 另见\n您可以在[这个页面](http://gym.openai.com/docs/)上了解有关 OpenAI Gym 的更多信息。\n\n##\
    \ DQN 介绍\n在进入下一个秘籍之前，让我们快速看一下 DQN。\n"
  trans: "\n\n然后，我们开始训练生成器，并且生成器应该能够欺骗判别器。 生成器必须纠正判别器正确预测生成的图像为假的情况。 因此，只要来自判别器的预测将生成的图像标记为伪造，就会增加生成器损失`gerror`。\
    \ 然后，我们计算梯度并更新生成器权重。\n\n然后，我们定期显示模型指标，并保存固定噪声生成器生成的图像，以可视化模型在各个周期的表现。\n\n# 生成器训练\n\
    \n## 更多\n您可以利用网络的超参数发挥更多的作用-例如，您可以对判别器优化器使用与生成器不同的学习率，或者对判别器的每次更新训练生成器两次或三次。\n\
    \n## 另见\n您可以在 [这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html)和[这个页面](https://iq.opengenus.org/deep-convolutional-gans-pytorch/)上看到训练和架构\
    \ `DCGAN` 的另一个示例。\n\n# 可视化 DCGAN 结果\n\n以前我们已经看到，使用 GAN，生成器和判别器相互竞争，并且这样做可以产生越来越好的图像。\
    \ 但是，从理论上讲，它们达到了生成器已捕获真实图像的所有特征的程度，并且生成器无法学习。 同样，判别器只能猜测给定图像是真实的还是伪造的，成功机会为 50/50。\
    \ 在这一点上，据说 GAN 已经收敛。\n\n现在，任何方面的改善都会导致另一面的结果降低，这是**零和**状态或**纳什平衡**； 但是在实践中很难实现，因为生成器和判别器都在不断变化，因此检查\
    \ GAN 表现的最佳方法是通过图形和图表。 在本秘籍中，我们将快速了解可视化。\n\n## 准备好\n对于此秘籍，您必须具有`matplotlib`和`numpy`库，可以使用`pip`如下安装它们：\n\
    \n```\npip install matplotlib\npip install numpy\n```\n\n安装这些工具后，我们将继续进行操作。\n\n\
    ## 操作步骤\n在此秘籍中，我们将快速绘制 GAN 中的图形和图像：\n\n1. 我们将从导入开始：\n\n```\n>>import matplotlib.pyplot\
    \ as plt\n>>import numpy as np\n```\n\n2. 然后，我们将添加图的大小和标题：\n\n```\n>>plt.figure(figsize=(10,5))\n\
    >>plt.title(\"Generator and Discriminator Loss During Training\")\n```\n\n3. 接下来，我们添加生成器和判别器损失：\n\
    \n```\n>>plt.plot(g_losses,label=\"Generator\")\n>>plt.plot(d_losses,label=\"\
    Discriminator\")\n```\n\n4. 然后，我们添加`x`和`y`轴标签：\n\n```\n>>plt.xlabel(\"iterations\"\
    )\n>>plt.ylabel(\"Loss\")\n```\n\n5. 接下来，我们为图添加图例：\n\n```\n>>plt.legend()\n```\n\
    \n6. 最后，我们显示该图：\n\n```\n>>plt.show()\n```\n\n这将给出以下输出：\n\n![](img/62156cfc27da1fab22be4d59af750688.png)\n\
    \n7. 然后，我们遍历`image_list`中的图像并显示它们：\n\n```\n>>for image in image_list:\n    plt.imshow(np.transpose(image,(1,2,0)))\n\
    \    plt.show()\n```\n\n结果为以下输出：\n\n![](img/da1bce3f6f8f92d26350fad9c6812153.png)\n\
    \n在这里，我们看到了 DCGAN 生成的手写图像。\n\n## 工作原理\n在本秘籍中，我们使用 `matplotlib` 绘制图形和图像。 我们使用`figure()`和`title()`方法设置图形尺寸和标题，然后使用`plot()`方法绘制生成器和判别器损失。\
    \ 我们还使用`xlabel`和`ylabel`方法添加了`x`和`y`标签。 我们还使用`legend()`方法为图添加了图例，最后使用`show()`方法显示了图。\n\
    \n我们遍历训练期间保存在`image_list`中的图像，并使用 NumPy 的`transpose()`方法以所需顺序固定图像的尺寸。 `image_list`中的图像是使用`torchvision.util.make_grid()`方法生成的，我们根据噪声向量创建了生成图像的网格。\n\
    \n## 更多\n您可以使用其他库（例如 `plotly` 和 `seaborn`）来绘制和美化图形。\n\n## 另见\n您可以在[这个页面](https://pytorch.org/tutorials/beginner/dcgan_faces_tutorial.html#results)上看到\
    \ `DCGAN` 的可视化效果和动画。\n\n# 使用 PyTorch Hub 运行 PGGAN\n\n在本秘籍中，我们将研究渐进 GAN（`PGGAN`），与\
    \ `DCGAN` 相比它们是高级 GAN，并且能够生成逼真的图像。 `PGGAN` 分多个阶段训练 GAN 网络。 它具有`z`的潜在特征，并使用两个反卷积层生成`4×4`图像。\
    \ 在判别器方面，网络使用两个卷积层训练生成的`4 x 4`图像。 网络稳定后，它会在判别器中再增加两个卷积层以将图像上采样到`8 x 8`，再增加两个卷积层以对图像下采样。\n\
    \n经过 9 个这样的序列后，生成器将生成`1024 x 1024`个图像。 `PGGAN` 的渐进式训练策略相对于常规 GAN 具有优势，因为它可以加快并稳定训练。\
    \ 之所以如此，是因为大多数训练都是在较低的分辨率下进行的，而在网络达到各个阶段的稳定性之后，会逐渐发展为较高的分辨率。\n\n以下是 `PGGAN` 的抽象表示形式：\n\
    \n![](img/d02da1eb250e5d150ddc923a34dae057.png)\n\n`PGGAN` 的关键创新可以总结如下：\n\n* **高分辨率层中的逐渐增长和平滑淡化**：它从低分辨率卷积变为高分辨率卷积，而不是立即跳变分辨率，而是通过参数平滑地淡化了具有更高分辨率的\
    \ nedonew 层`α`（介于 0 和 1 之间）的大小，用于控制我们使用旧的还是放大的较大输出。\n* **小批量标准差**：我们计算判别器的统计信息，即生成器生成或来自真实数据的小批量中所有像素的标准差。\
    \ 现在，判别器需要了解，如果要评估的批量中图像的标准差较低，则该图像很可能是伪造的，因为真实数据的方差更高。 因此，生成器必须增加所生成样本的方差，以欺骗判别器。\n\
    * **均衡的学习率**：所有权重（`w`）被归一化（`w'`）在某个范围内，以便`w' = w / c`的常数`c`对于每一层来说都是不同的，具体取决于权重矩阵的形状。\n\
    * **逐像素特征归一化**：对每个像素中的特征向量进行归一化，因为批量规范最适合大型微型批量，并且占用大量内存。\n\nNvidia 最初执行 `PGGAN`\
    \ 的过程要花一到两个月的时间。 但是，为了让我们看到 `PGGAN` 的表现，我们将使用 `PyTorch Hub`，它是使用 `PyTorch` 构建的预训练模型的存储库。\n\
    \n## 准备\n为了使割炬轮毂正常工作，您需要拥有 `PyTorch` 版本 1.1.0 或更高版本。\n\n## 操作步骤\n在此秘籍中，我们将从火炬中心运行\
    \ `PGGAN`：\n\n1. 首先，我们将设置导入：\n\n```\n>>import torch\n>>import matplotlib.pyplot\
    \ as plt\n>>import torchvision\n```\n\n2. 然后我们检查 GPU：\n\n```\n>>use_gpu = True\
    \ if torch.cuda.is_available() else False\n```\n\n3. 接下来，我们加载预训练的 `PGGAN` 模型：\n\
    \n```\n>>model = torch.hub.load('facebookresearch/pytorch_GAN_zoo:hub', 'PGAN',\
    \ \n                       model_name='celebAHQ-512',\n                      \
    \ pretrained=True, \n                       useGPU=use_gpu)\n```\n\n4. 然后我们产生噪音：\n\
    \n```\n>>num_images = 5\n>>noise, _ = model.buildNoiseData(num_images)\n```\n\n\
    5. 接下来，我们获得生成器输出\n\n```\n>>with torch.no_grad():\n    generated_images = model.test(noise)\n\
    ```\n\n6. 最后，我们制作图像网格并显示它：\n\n```\n>>grid = torchvision.utils.make_grid(generated_images.clamp(min=-1,\
    \ max=1), scale_each=True, normalize=True)\n>>plt.imshow(grid.permute(1, 2, 0).cpu().numpy())\n\
    ```\n\n在这里，我们看到了从 `PGGAN` 生成的面部图像：\n\n![](img/65f57fe2bebc0a4ee804d44e51320fa3.png)\n\
    \n通过前面的步骤，我们学习了如何使用 `PyTorch Hub` 运行 `PGGAN`。\n\n## 工作原理\n在此秘籍中，我们加载了在`celebAHQ`数据集上训练的\
    \ `PGGAN` 预训练模型； 为此，我们使用了`torch.hub`中的`load()`方法。 然后，我们定义了创建和生成尺寸为`num_images\
    \ x 512`的噪声向量所需的图像数量，因为此模型使用大小为 512 的噪声向量进行训练，所有噪声向量都由`buildNoiseData()`方法内部处理，它在模型对象中可用。\n\
    \n`model.test()`方法生成了我们用来制作网格的图像。 钳位方法将所有值限制在`min`和`max`定义的范围内。 `.cpu()`方法将生成的图像移至\
    \ CPU，我们使用`permute`固定尺寸。 最后，`plt.imshow()`显示了我们创建的网格。\n\n## 更多\n您可以在[这里](https://github.com/github-pengge/PyTorch-progressive_growing_of_gans)探索完整的\
    \ `PGGAN` 实现。\n\n## 另见\n您可以在[这个页面](https://pytorch.org/docs/stable/hub.html)上了解有关割炬轮毂的更多信息。\n\
    \n您可以在[这里](https://github.com/tkarras/progressive_growing_of_gans)和[这里](https://research.nvidia.com/publication/2017-10_Progressive-Growing-of)。\n\
    \n# 七、深度强化学习\n\n> 原文：[`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/7.md)\n\
    \n在本章中，我们将探索**神经网络**（**NNs**）在使用 `PyTorch` 进行**强化学习**（**RL**）上的应用。\n\n`RL` 是**人工智能**（**AI**）的领域，与我们在前面各章中介绍的其他机器学习格式不同。\
    \ `RL` 是机器学习算法的子类，它通过最大化环境中的奖励来进行学习。 当问题涉及决策或采取行动时，这些算法很有用。\n\n在本章中，我们将介绍以下秘籍：\n\
    \n* OpenAI Gym 简介– CartPole\n* DQN 简介\n* 实现 DQN 类\n* 训练 DQN\n* 深度 GA 简介\n* 生成智能体\n\
    * 选择智能体\n* 使智能体突变\n* 训练深度 GA\n\n## 深入了解 RL\n**智能体**是任何 `RL` 问题的核心。 它是 `RL` 算法的一部分，它处理输入信息以执行操作。\
    \ 它探索和利用重复试验中的知识，以学习如何最大化奖励。 智能体必须处理的场景称为**环境**，而**动作**是智能体可以在给定环境中进行的动作。 采取行动后从环境中获得的回报称为**奖励**，智能体根据当前状态决定使用下一行动的行动过程称为**策略**。\
    \ 相对于短期奖励，带有折扣的预期长期回报称为**值**。**Q 值**与该值相似，但具有附加的当前动作参数。\n\n现在，我们已经了解了 `RL` 的上下文，让我们理解为什么我们应该使用**深度\
    \ RL**（**DRL**）而不是 `RL`。 `DRL` 将 `RL` 与深度学习相结合，后者使用 `NN` 解决 `RL` 问题。\n\n深度学习算法可以学习抽象出环境状态的细节，然后学习状态的重要特征。\
    \ 由于深度学习算法仅具有有限数量的参数，因此我们可以使用它将可能的状态压缩为更少的状态，然后使用该新表示形式来选择一个动作。\n\n`RL` 解决方案涉及将反复试验的结果存储在查找表中，当环境变得越来越复杂时，查找表将变得非常庞大。\
    \ 深度神经网络可能会学会识别程序员自己必须使用查找表方法手动设计的相同高级特征。\n\n深度学习是 `RL` 最近取得突破的背后。 它们展现了代表性的功能，效率，灵活性，并为眼前的问题提供了简化的解决方案。\n\
    \n## OpenAI Gym 简介 – CartPole\n\n在本秘籍中，我们将实现两种不同的 `RL` 算法。 我们将需要一个环境来运行我们的算法，以便我们创建的模型将获得最大的回报。\n\
    \n我们将使用 OpenAI 的体育馆库，该库是我们可以用来训练模型的环境的集合。 我们将专注于称为`Cartpole-v1`的特定环境。\n\n杆子是一个倒立的摆锤，其重心高于其枢轴点。\
    \ 为了控制倒立摆的不稳定位置，我们必须将枢轴点移动到质心下方。 目的是施加适当的力，以使柱杆在枢轴点上保持平衡。\n\n下图显示了 OpenAI Gym\
    \ 的 Cartpole：\n\n![](img/3ace67c6e9620acc1c3c4df7b7702725.png)\n\n图 1：OpenAI Gym–\
    \ CartPole\n\n撑杆通过未激活的接头连接到推车，该接头在水平轨道上自由移动。 摆锤垂直于水平轨道开始。 目的是通过施加力 +1 和 -1 来防止跌落。\n\
    \n当杆与垂直位置的夹角超过 15 度时，或者手推车从中心移出的单位超过 2.4 个单位时，则认为手推车未能达到目标。\n\n对于杆保持直立的每个时间步，都会获得+1\
    \ 的奖励。 现在我们有了上下文，我们将尝试解决 OpenAI Gym 的 Cartpole 问题的代码。\n\n### 准备\n首先，我们需要安装`gym`。\
    \ 我们将使用`pip`管理器安装它：\n\n```\npip install gym\n```\n\n现在我们已经安装了`gym`，让我们跳入`gym`库。\n\
    \n### 操作步骤\n在本秘籍中，我们将了解棘突环境。 请按照以下步骤操作：\n\n1. 我们将从导入`gym`模块开始：\n\n```\n>>import\
    \ gym\n```\n\n2. 接下来，我们将创建环境：\n\n```\n>>env = gym.make('CartPole-v0')\n```\n\n\
    3. 接下来，我们将重置环境：\n\n```\n>>env.reset()\n```\n\n4. 现在，我们将渲染环境：\n\n```\n>>for _ in\
    \ range(1000):\n    env.render()\n    action = env.action_space.sample()\n   \
    \ observation, reward, done, info = env.step(action)\n    if done:\n        env.reset()\n\
    >>env.close()\n```\n\n这将为我们提供以下输出：\n\n![](img/5ddc9728136a9fbba224264b6657467a.png)\n\
    \n图 2：柱极环境的输出\n\n5. 获取可以执行的可能动作的数量：\n\n```\n>>env.action_space.n\n2\n```\n\n6.\
    \ 获取观察状态参数的数量：\n\n```\n>>env.observation_space.shape[0]\n4\n```\n\n这样，您将看到一个窗口，该窗口显示不稳定的枢轴，并且枢轴点随机移动。\n\
    \n### 工作原理\n在本秘籍中，我们探讨了 OpenAI Gym 的一些功能。 我们首先使用`Cartpole-v0`创建一个环境，该环境的最高可得分为\
    \ 200，然后环境终止。 我们使用`env.reset()`命令将环境置于初始状态，即线杆处于直立位置。 然后，我们开始执行 1000 个步骤的循环，其中使用`render()`渲染了当前环境的开始，并且使用`env.action_space.sample()`为当前状态选择了一个随机动作。\
    \ 然后，我们将选定的动作传递到环境的`step`方法中。 `step`方法返回以下内容：\n\n* **观察**：这是一个对象，它告诉我们有关环境的新状态。\
    \ 该对象特定于我们选择的环境。\n* **奖励**：这给了我们所选动作所获得的奖励。 如果是直杆，则直杆直立时每个时间步长为 1.0，否则为 0.0。\n\
    * **完成**：这是一个布尔值，它告诉我们环境是否已达到最终状态，可能是由于手头的任务失败而导致的（如果是小刀杆，则是当刀杆无法保持直立位置时） ，或者从完成手头的任务开始（对于小偷来说，就是达到最大时间步长\
    \ 200 的时间）。\n* **信息**：对调试有用的诊断信息。\n\n在循环中，每当极点翻倒时，我们都会将环境重置为其初始状态。\n\n最后，我们关闭了环境。\
    \ 我们使用`env.action_space.n`查看了环境中可能采取的行动，并使用`env.observation_space.shape[0]`查看了处于观察状态的参数。\
    \ 现在我们已经了解了环境，我们可以开始实现各种深度 `RL` 算法。\n\n### 更多\n您可以通过更改环境名称来尝试其他环境。 试用`CartPole-v1`对您来说将是有益的。\n\
    \n### 另见\n您可以在[这个页面](http://gym.openai.com/docs/)上了解有关 OpenAI Gym 的更多信息。\n\n##\
    \ DQN 介绍\n在进入下一个秘籍之前，让我们快速看一下 DQN。\n\n"
