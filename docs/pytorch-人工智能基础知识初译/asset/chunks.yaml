- raw: "```\n>>a = torch.Tensor([[1, 2, 3],\n                     [4, 5, 6]])\n>>a\n\
    \ntensor([[1., 2., 3.],\n [4., 5., 6.]])\n\n>>b = torch.Tensor([4,5,6,7,8,9])\n\
    >>b\ntensor([4., 5., 6., 7., 8., 9.])\n>>b.view_as(a)\n\ntensor([[4., 5., 6.],\n\
    \ [7., 8., 9.]])\n```\n\n由此可见，张量`b`呈张量`a`的形状。\n\n# 另见\n\n有关更多信息，您可以在[这里](https://pytorch.org/docs/stable/tensors.html#torch.Tensor.view)和[这里](https://pytorch.org/docs/stable/torch.html#torch.reshape)查看文档。\n\
    \n# 二、与神经网络协作\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/2.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/2.md)\
    \ \n\n深度学习是一类机器学习算法，旨在粗略地模拟大脑中的神经元。 神经元从周围神经元的多个输入中获取一个输入并将其求和，如果总和超过某个阈值，则神经元将触发。\
    \ 每个神经元之间有一个间隙，称为突触。 神经递质化学物质在这些突触中传递信号，这些化学物质的数量和类型将决定神经元输入的强度。 生物神经网络的功能可以通过人工神经网络使用权重，偏差（偏差定义为权重乘以\
    \ 1 的恒定输入）和激活函数来复制。\n\n以下是神经单元的示意图：\n\n![](Images/6922f9f3dae8a21bd0f0e1f226c3cd96.png)\n\
    \n神经网络所看到的只是数字集，它试图识别数据中的模式。 通过训练，神经网络学会识别输入中的模式。 但是，某些特定的架构在应用于特定类别的问题时比其他结构具有更好的表现。\
    \ 一个简单的神经网络架构由三种层组成：**输入**层，**输出**层和**隐藏**层。 当隐藏层不止一个时，它称为**深度神经网络**。\n\n以下是深度神经网络的表示：\n\
    \n![](Images/2b18e010cdd9d2e07ba90f9b0affc0bd.png)\n\n在前面的图中，圆圈代表神经元，或用深度学习的术语代表作为计算单元的节点。\
    \ 边缘代表节点之间的连接，并保持两个节点之间的连接权重（突触强度）。\n\n在本章中，以下秘籍将使我们开始使用神经网络：\n\n*   定义神经网络类\n\
    \n*   创建一个全连接网络\n\n*   定义损失函数\n\n*   实现优化器\n\n*   实现丢弃\n\n*   实现函数式 API\n\n# 技术要求\n\
    \n在本章中，我们将开始处理图像数据并学习全连接神经网络如何工作。 PyTorch 有一个名为`torchvision`的补充库，我们将在开始秘籍之前进行安装。\n\
    \n您可以对`torchvision`使用以下`pip`安装命令：\n\n```\npip install torchvision\n```\n\n对于其他安装方法，您可以访问[这个页面](https://pypi.org/project/torchvision/)。\
    \ 上一章“使用 PyTorch 张量”的其余依赖关系保持不变。\n\n# 定义神经网络类\n\n在本秘籍中，我们将从了解`torchvision`的一些重要函数开始，这些函数使它能够处理图像数据并进行处理。\
    \ 然后，我们将通过定义一个类来定义神经网络的基本架构，并查看可用于此的模块和方法。 在本秘籍中，我们将专注于全连接神经网络类。 它的属性是各个层，其目的是对各种类型的衣服进行分类。\n\
    \n我们将使用 Fashion–MNIST 数据集。 这是 Zalando 文章图片的数据集，包括 6 万个示例的训练集和 10,000 个示例的测试集。\
    \ 我们将拍摄一张尺寸为`28 x 28`的灰度图像，并将其转换为 784 的向量。\n\n以下是来自数据集的示例：\n\n![](Images/d48506aadd60d9883cbb9493663586f8.png)\n\
    \n现在，我们将研究定义网络所需采取的步骤。\n\n# 操作步骤\n\n让我们定义我们的网络：\n\n1.我们将从设置`torch`和`torchvision`导入开始：\n\
    \n```\n>>import torch\n>>from torch import nn\n>>from torchvision import datasets,\
    \ transforms\n```\n\n2.接下来，我们将定义用于图像数据预处理的转换：\n\n```\n>>transform = transforms.Compose([transforms.ToTensor(),\n\
    \                  transforms.Normalize((0.5,), (0.5,)),\n               ])\n\
    ```\n\n3.让我们定义`batch_size`，将我们的数据集划分为多个小块，以供输入模型：\n\n```\n>>batch_size = 64\n\
    ```\n\n4.接下来，我们将从`torchvision`中提取数据集并应用转换并创建批量。 为此，我们将首先创建一个训练数据集：\n\n```\n>>trainset\
    \ = datasets.FashionMNIST('~/.pytorch/F_MNIST_data/', download=True, train=True,\
    \ transform=transform)\n>>trainloader = torch.utils.data.DataLoader(trainset,\
    \ batch_size=batch_size, shuffle=True)\n```\n\n5.现在，让我们创建`testset`：\n\n```\n>>testset\
    \ = datasets.FashionMNIST('~/.pytorch/F_MNIST_data/', download=True, train=False,\
    \ transform=transform)\n>>testloader = torch.utils.data.DataLoader(testset, batch_size=batch_size,\
    \ shuffle=True)\n```\n\n6.现在我们的主要任务是定义神经网络类，该类必须是`nn.Module`的子类：\n\n```\n>>class\
    \ FashionNetwork(nn.Module):\n```\n\n7.接下来，我们为该类定义`init`方法：\n\n```\n>>def __init__(self):\n\
    \      super().__init__()\n```\n\n8.我们需要在`init`中为我们的模型定义层。 第一个隐藏层如下所示：\n\n```\n\
    >>self.hidden1 = nn.Linear(784, 256)\n```\n\n9.现在，我们将定义第二个隐藏层：\n\n```\n>>self.hidden2\
    \ = nn.Linear(256, 128)\n```\n\n10.然后，我们将定义输出层：\n\n```\n>>self.output = nn.Linear(128,\
    \ 10)\n```\n\n11.我们将为最后一层定义 softmax 激活：\n\n```\n>>self.softmax = nn.Softmax(dim=1)\n\
    ```\n\n12.最后，我们将在内层中定义激活函数：\n\n```\n>>self.activation = nn.ReLU()\n```\n\n通过这些步骤，我们已经完成了网络单元。\n\
    \n# 工作原理\n\n在本秘籍中，我们开始使用`torchvision`。 `torchvision`中有工具来支持与视觉有关的任务。 有一个名为`transforms`的模块可以帮助完成许多图像预处理任务。\
    \ 对于我们正在处理的特殊情况，一个由`28 x 28`灰度像素组成的图像，我们首先需要从图像中读取并使用`transforms.ToTensor()`变换将其转换为张量。\
    \ 然后，我们分别将像素值的平均值和标准差设为 0.5 和 0.5，以便模型更易于训练； 为此，我们使用`transforms.Normalize((0.5,),(0.5,))`。\
    \ 我们将所有转换与`transform.Compose()`结合在一起。\n\n准备好转换后，我们定义了合适的批量大小。 较高的批量大小意味着该模型具有较少的训练步骤并且学习速度更快，而较高的批量大小会导致对内存的高要求。\n\
    \nTorchVision 的`datasets`模块附带了许多受欢迎的数据集； 如果机器上没有它，它将为您下载，传递转换并将数据转换为所需的格式以供模型训练。\
    \ 在我们的案例中，数据集带有训练和测试集，并相应地加载它们。 我们使用`torch.utils.data.DataLoader`将处理后的数据分批加载，并进行其他操作，例如打乱和加载到正确的设备（CPU\
    \ 或 GPU）。\n\n我们可以用任何名称定义模型类，但是重要的是它是`nn.Module`的子类并具有`super().__init__()`，该类为模型提供了许多有用的方法和属性，并保留了架构的知识。\n\
    \n我们使用`nn.Linear()`通过输入和输出尺寸来定义全连接层。 我们将 softmax 层用于最后一层输出，因为有 10 个输出类。 我们在输出层之前的层中使用\
    \ ReLU 激活来学习数据中的非线性。 `hidden1`层采用 784 个输入单元，并给出 256 个输出单元。 `hidden2`短语输出 128 个单元，输出层有\
    \ 10 个输出单元，代表 10 个输出类别。 softmax 层将激活转换为概率，以便沿维度 1 加 1。\n\n# 更多\n\n我们可以使用另一种方法来使用`nn.Sequential()`定义模型并传递所需的层，而无需定义类。\
    \ 还有其他一些可应用于输入图像的转换，我们将在后续章节中进行探讨。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html)上查看有关转换的更多详细信息，还可以在[这个页面](https://pytorch.org/tutorials/beginner/blitz/neural_networks_tutorial.html#sphx-glr-beginner-blitz-neural-networks-tutorial-py)上了解有关定义模型类的更多信息。\n\
    \n# 创建一个全连接网络\n\n在本秘籍中，我们将扩展在先前秘籍“定义神经网络类”中定义的类。 在“定义神经网络类”秘籍中，我们仅创建了所需架构的组件；\
    \ 现在我们将把所有这些部分捆绑在一起，以建立一个明智的网络。 我们各层的进度将从 784 个单元增加到 256 个，然后是 128 个，最后是 10 个单元的输出层。\n\
    \n在本秘籍中，我们将使用类的构造器中定义的组件来研究网络架构。 然后，我们将完成网络类定义并创建其对象。\n\n# 操作步骤\n\n我们将继续上一节中的类定义，并在其上进行扩展：\n\
    \n1.让我们从类中的`forward()`方法开始，传入输入：\n\n```\n>>def forward(self, x):\n```\n\n2.现在，将输入移动到具有\
    \ 256 个节点的第一个隐藏层：\n\n```\n>>x = self.hidden1(x)\n```\n\n3.接下来，我们通过激活函数传递第一个隐藏层的输出，在本例中为\
    \ ReLU：\n\n```\n>>x = self.activation(x)\n```\n\n4.我们将对第二层（具有 128 个节点）重复相同的操作，并将其传递给\
    \ ReLU：\n\n```\n>>x = self.hidden2(x)\n>>x = self.activation(x)\n```\n\n5.现在，我们传递最后一个输出层，其中包含\
    \ 10 个输出类：\n\n```\n>>x = self.output(x)\n```\n\n6.然后，我们将使用`softmax`函数推送输出：\n\n\
    ```\n>>output = self.softmax(x)\n```\n\n7.最后，我们返回输出张量：\n\n```\n>>return output\n\
    ```\n\n8.然后，我们将创建网络对象：\n\n```\n>>model = FashionNetwork()\n```\n\n9.让我们快速看一下我们的模型：\n\
    \n```\n>>print(model)\n>FashionNetwork(\n       (hidden1): Linear(in_features=784,\
    \ out_features=256, bias=True)\n       (hidden2): Linear(in_features=256, out_features=128,\
    \ bias=True)\n       (output): Linear(in_features=128, out_features=10, bias=True)\n\
    \       (softmax): Softmax()\n       (activation): ReLU()\n )\n```\n\n现在，我们已经为\
    \ Fashion-MNIST 数据集完成了神经网络模型。\n\n# 工作原理\n\n在秘籍中，通过建立前向网络来完成网络，其中我们将构造器中定义的网络组件捆绑在一起。\
    \ 用`nn.Module`定义的网络需要定义`forward()`方法。 它采用输入张量，并按照正向方法中定义的操作顺序，将其通过网络类中`__init__()`方法中定义的网络组件。\n\
    \n当传递输入时，将引用模型对象的名称自动调用 forward 方法。 `nn.Module`自动创建将在正向方法中使用的权重和偏差张量。 线性单元本身定义了线性函数，例如`xW\
    \ + B`； 要具有非线性函数，我们需要插入非线性激活函数，在这里我们使用最流行的激活函数之一 ReLU，尽管您可以在 PyTorch 中使用其他可用的激活函数。\n\
    \n我们的输入层有 784 个单元（从`28 x 28`像素开始），第一层具有 ReLU 激活的 256 个单元，然后具有 ReLU 激活的 128 个单元，最后有\
    \ softmax 激活的 10 个单元。 我们通过 softmax 压缩最终层输出的原因是因为我们希望有 1 个输出类的概率高于所有其他类，并且输出概率之和应等于\
    \ 1。softmax 函数的参数`dim=1`是为了确保在输出的各列中采用 softmax。 然后，我们使用模型类创建一个对象，并使用`print(model)`打印该类的详细信息。\n\
    \n# 更多\n\n我们可以在不使用`nn.Sequential`模块定义网络类的情况下定义网络架构，并且尽管`__init__`中的序列无关紧要，但重要的是要确保`forward`方法中的操作顺序正确排序。\
    \ 。 您可以使用`nn.Tanh`进行 tanh 激活。 您可以使用`model.hidden.weight`和`model.hidden.bias`从模型对象访问权重和偏差张量。\n\
    \n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html)上查看`nn.Module`和`nn.Sequential`的官方文档。\n\
    \n# 定义损失函数\n\n机器学习模型在接受训练时，可能会在预测输出和实际输出之间存在一些偏差，这种差异称为模型的**误差**。 让我们计算该误差的函数称为**损失函数**或**误差函数**。\
    \ 此函数提供了一种度量标准，用于评估所有可能的解决方案并选择最优化的模型。 损失函数必须能够将模型的所有属性减少到一个单一的数字，以便该损失函数值的改善代表更好的模型。\n\
    \n在本秘籍中，我们将使用 PyTorch 中可用的损失函数为我们的时装数据集定义损失函数。\n\n# 操作步骤\n\n让我们定义损失函数：\n\n1. \
    \ 首先，我们将从网络构造器中的`__init__`方法开始，将现有的网络架构修改为`softmax`而不是`softmax`的输出日志：\n\n```\n\
    >>self.log_softmax = nn.LogSoftmax()\n```\n\n2.接下来，我们将对神经网络的`forward`方法进行相同的更改：\n\
    \n```\n>>output = self.log_softmax(x)\n```\n\n3.现在，我们的新类如下所示：\n\n```\n>>class\
    \ FashionNetwork(nn.Module):\n      def __init__(self):\n          super().__init__()\n\
    \          self.hidden1 = nn.Linear(784, 256)\n          self.hidden2 = nn.Linear(256,\
    \ 128)\n          self.output = nn.Linear(128, 10)\n          self.log_softmax\
    \ = nn.LogSoftmax()\n          self.activation = nn.ReLU()\n      def forward(self,\
    \ x):\n          x = self.hidden1(x)\n          x = self.activation(x)\n     \
    \     x = self.hidden2(x)\n          x = self.activation(x)\n          x = self.output(x)\n\
    \          output = self.log_softmax(x)\n          return output\n```\n\n4.我们定义模型对象如下：\n\
    \n```\n>>model = FashionNetwork()\n>>model\n>>FashionNetwork(\n     (hidden1):\
    \ Linear(in_features=784, out_features=256, bias=True)\n     (hidden2): Linear(in_features=256,\
    \ out_features=128, bias=True)\n     (output): Linear(in_features=128, out_features=10,\
    \ bias=True)\n     (log_softmax): LogSoftmax()\n     (activation): ReLU()\n )\n\
    ```\n\n5.现在，我们将定义损失函数； 我们将为此使用负对数似然损失：\n\n```\n>criterion = nn.NLLLoss()\n```\n\
    \n现在我们已经准备好损失函数。\n\n# 工作原理"
