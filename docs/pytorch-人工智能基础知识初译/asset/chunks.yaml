- raw: "DQN 是一种 RL 技术，旨在为给定的观察选择最佳的动作。 有一个 Q 值，它是与每个可能观察到的每个可能动作相关联的给定移动的质量。 在传统的\
    \ RL 算法中，此 Q 值来自 Q 表，该表是一个查找表，其中是包含 Q 值的表。 通过反复玩游戏并使用奖励更新表来迭代更新此查找表。 q 学习算法学习要在此表中填充的最佳值。\
    \ 我们可以简单地查看给定状态的表并选择具有最大 Q 值的动作，以最大程度地赢得游戏。\n\nQ 值可以更新如下：\n\n![](Images/9bc567ba4149fe3e5bad649dc4a05fca.png)\n\
    \n新的 Q 值是两个部分的总和。 第一部分是`(1 - 学习率) * 旧 Q 值`，它是多少旧值将被记住。 学习率为 0 时，不会学习任何新内容，学习率为\
    \ 1 时，所有旧值都将被忘记。\n\n第二部分是**学习率\\*（即时行动奖励+最优未来值的折算估计）**，其中学习值是即时奖励加上最优未来值的折算估计。\
    \ 未来奖励的重要性由折扣系数决定。\n\n通过深度 Q 学习，我们可以使用深度神经网络来预测动作的 Q 值，并使用深度神经网络来选择动作，而不是使用 Q\
    \ 表查找给定状态下具有最大可能 Q 值的动作。 给定动作的最大 Q 值。\n\n# 操作步骤\n\n在本秘籍中，我们将为卡特彼勒问题定义神经网络模型。 请按照以下步骤操作：\n\
    \n1.  首先，我们将导入`torch`：\n\n```\n>>import torch\n>>import torch.nn as nn\n```\n\n\
    2.  接下来，定义一个函数来返回模型：\n\n```\ndef cartpole_model(observation_space, action_space):\n\
    \    return nn.Sequential(\n        nn.Linear(observation_space, 24),\n      \
    \  nn.ReLU(),\n        nn.Linear(24, 24),\n        nn.ReLU(),\n        nn.Linear(24,\
