    \ | G Loss: 3.317 | D Loss: 0.202 |\n| 050 / 469 | G Loss: 2.990 | D Loss: 0.350\
    \ |\n| 100 / 469 | G Loss: 2.680 | D Loss: 0.162 |\n| 150 / 469 | G Loss: 2.934\
    \ | D Loss: 0.391 |\n| 200 / 469 | G Loss: 3.736 | D Loss: 0.215 |\n| 250 / 469\
    \ | G Loss: 3.601 | D Loss: 0.199 |\n| 300 / 469 | G Loss: 4.288 | D Loss: 0.164\
    \ |\n| 350 / 469 | G Loss: 2.978 | D Loss: 0.086 |\n| 400 / 469 | G Loss: 3.827\
    \ | D Loss: 0.189 |\n| 450 / 469 | G Loss: 4.283 | D Loss: 0.216 |\nEpoch : |\
    \ 005 / 050 |\n| 000 / 469 | G Loss: 4.456 | D Loss: 0.250 |\n| 050 / 469 | G\
    \ Loss: 4.886 | D Loss: 0.160 |\n| 100 / 469 | G Loss: 1.844 | D Loss: 0.447 |\n\
    | 150 / 469 | G Loss: 3.680 | D Loss: 0.505 |\n| 200 / 469 | G Loss: 4.428 | D\
    \ Loss: 0.200 |\n| 250 / 469 | G Loss: 4.270 | D Loss: 0.222 |\n| 300 / 469 |\
    \ G Loss: 4.617 | D Loss: 0.102 |\n| 350 / 469 | G Loss: 3.920 | D Loss: 0.092\
    \ |\n| 400 / 469 | G Loss: 4.010 | D Loss: 0.392 |\n| 450 / 469 | G Loss: 1.705\
    \ | D Loss: 0.651 |\n```\n\n至此，我们已经完成了 `DCGAN` 的训练。\n\n## 工作原理\n\n我们从`weights_init`函数开始，该函数用于从均值\
    \ 0 和标准差 0.02 的正态分布中随机初始化所有权重。初始化模型后，函数将模型作为输入，并重新初始化所有卷积、卷积转置和批归一化层。\n\n然后，我们使用`torchsummary`库打印模型的摘要；为此，我们将模型与输入维一起传递。方便地查看我们所有的输出尺寸是否正确，并检查每一层中参数的数量和大小。接下来，我们定义损失函数，并使用二进制交叉熵损失，因为只有一个输出具有两个可能的状态，分别表示图像是真实的\
    \ 1 还是伪造的 0。\n\n我们还创建了固定噪声，用于可视化 GAN 模型在迭代过程中的改进。我们使用`Adam`优化器分别更新了生成器和判别器`goptimizer`和`doptimizer`的权重。然后，我们进行了准备以存储一些模型指标，以查看模型在迭代过程中的变化，然后开始训练循环。\n\
    \n我们遍历了每个小批量并开始训练判别器。我们仅从`MNIST`数据集中获取图像，然后使用`real_images = data[0].to(device)`将其移动到设备中；由于图像全部来自`MNIST`数据集，因此我们知道它们是真实的，因此我们创建了与小批量相同大小的标签向量，并用真实图像标签\
    \ 1 进行填充。然后，将这些真实图像传递到判别器来预测，然后使用此预测从准则中得出误差`derror_real`并计算梯度。然后，我们创建了相等数量的噪声向量，并将它们传递给生成器以生成图像，然后将这些生成的图像传递给判别器以获取预测，然后从准则`derror_fake`中获取误差。然后，我们再次进行此操作以计算和累积梯度。然后，我们从真实图像和伪图像中获得了误差之和，以得出总的判别器误差，并更新判别器的权重。\n\
    \n"
