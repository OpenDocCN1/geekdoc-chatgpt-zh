- raw: "最后，我们编写了一个简单的`play_agent`函数来可视化平衡并在重置环境后运行循环。 我们要求目标网络预测每个可能动作的 Q 值，选择具有最高\
    \ Q 值的动作，并使用`step()`将其导入环境。 之后，我们不断增加奖励。 此函数返回柱状体直立的时间步数和柱状体执行平衡动作的视频。\n\n# 更多\n\
    \n您可以编写一个函数来绘制算法的表现，并且仅在模型的得分始终在 450-500 之间时才停止训练过程。\n\n# 另见\n\n您可以在[这里](https://github.com/gsurma/cartpole/blob/master/cartpole.py)的\
    \ Keras 中看到此实现。\n\n您可以在[这个页面](https://github.com/pytorch/tutorials/blob/master/intermediate_source/reinforcement_q_learning.py)上看到替代实现。\n\
    \n# Deep GA 简介\n\n在本秘籍中，我们将探讨**深层遗传算法**（**Deep GA**），并向您展示当将其应用于 RL 时，它是基于梯度方法的竞争替代品。\
    \ 我们将使用一组随机生成的网络，而不是使用梯度下降来修改其权重的随机生成的网络，而是创建一个一代，然后对其在给定环境中的表现进行评估。 请注意，一代人中的某些网络将比其他人表现更好。\
    \ 我们将选择表现最佳的网络，并将其保留给下一代网络。 然后，我们将通过复制它们来创建下一代并对其权重进行随机修改。 由于我们将选择权重较小的最佳网络，因此网络的整体表现将不断提高。\n\
    \n在本秘籍中，我们将定义模型的网络维度，该网络维度将用于预测给定状态时应采取的措施。\n\n# 操作步骤\n\n在本秘籍中，我们将完成网络模型定义。 您需要安装\
    \ OpenAI 的体育馆库。 按着这些次序：\n\n1.  我们将从导入开始：\n\n```\n>>import torch.nn as nn\n>>import\
    \ torch\n```\n\n2.  现在，让我们定义一个返回神经网络的函数：\n\n```\n>>def cartpole_model(observation_space,\
    \ action_space):\n    return nn.Sequential(\n        nn.Linear(observation_space,\
    \ 128),\n        nn.ReLU(),\n        nn.Linear(128, action_space),\n        nn.Softmax(dim=1)\n\
    \    )\n```\n\n这样，我们就完成了模型的定义。\n\n# 工作原理\n\n在此秘籍中，函数处于观察状态，并通过两个线性层和一个 ReLU 单元（在隐藏层中有\
    \ 128 个单元）运行它。 最后一层的输出通过 softmax 函数传递，以将激活转换为概率，并选择概率最高的动作。\n\n# 更多\n\n对于复杂模型，您还可以具有多个层和不同数量的单元。\n\
    \n# 另见\n\n您也可以将复杂的网络与卷积层一起使用。 在[这个页面](https://github.com/IBM/distributed-evolutionary-ml/blob/master/nn.py)中显示了一个示例。\n\
    \n# 生成智能体\n\n在本秘籍中，我们将着眼于创建一组智能体以开始我们的进化过程，然后初始化这些智能体的权重。 我们将使用这些智能体来评估模型的表现并生成下一代智能体。\n\
    \n# 操作步骤\n\n在此秘籍中，我们将创建给定数量的智能体。 按着这些次序：\n\n1.  首先，我们将定义一个函数来初始化智能体的权重：\n\n```\n\
    >>def init_weight(module):\n    if((type(module) == nn.Linear)):\n           \
    \ nn.init.xavier_uniform_(module.weight.data)\n            module.bias.data.fill_(0.00)\n\
    ```\n\n2.  现在，我们将定义一个将创建智能体的函数：\n\n```\n>>def create_agents(num_agents, observation_space,\
    \ action_space):\n      agents = []\n```\n\n3.  接下来，我们将创建`num_agents`个智能体：\n\n\
    ```\nfor _ in range(num_agents):\n    agent = cartpole_model(observation_space,\
    \ action_space)\n    agent.apply(init_weight)\n```\n\n4.  我们将关闭智能体的每个层的梯度：\n\n\
    ```\nfor param in agent.parameters():\n    param.requires_grad = False\n\nagent.eval()\n\
    agents.append(agent)\n```\n\n5.  最后，我们将返回智能体：\n\n```\n   return agents\n```\n\n\
    现在，我们的智能体已准备好进行评估。\n\n# 工作原理\n\n在此秘籍中，我们编写了两个函数-第一个函数初始化模型层的权重。 对于模型权重，我们使用`torch.nn.init`中的`xavier_uniform`并用`0`填充偏差。\
    \ 第二个函数创建`num_agents`个智能体，并使用`cartpole_model()`函数返回它们。 我们使用`init_weight`初始化权重。\
    \ 然后，对于模型的参数，我们禁用梯度计算，将智能体设置为`eval()`模式，然后返回所有智能体。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.init.html)上找到有关其他初始化方法的信息。\n\
    \n# 选择智能体\n\n在本秘籍中，我们将基于适应度函数着眼于智能体选择，在我们的案例中，这意味着在平衡卡特波勒方面得分很高。 这意味着我们将传播得分最高的智能体，而忽略其余的智能体。\
    \ 我们将评估给定一代中的每个智能体，并多次评估它们，以确保奖励不是偶然的。 最后，我们将使用每个智能体的平均分数来确定表现最佳的智能体。\n\n# 操作步骤\n\
    \n在本秘籍中，我们将编写用于评估智能体，多次评估以及按给定序列评估所有智能体的函数。 按着这些次序：\n\n1.  我们将从导入开始：\n\n```\n\
    >>import numpy as np\n```\n\n2.  接下来，我们需要定义一个函数来评估智能体的表现：\n\n```\n>>def eval_agent(agent,\
    \ env):\n    observation = env.reset()\n```\n\n3.  接下来，我们需要在最大可能的时间步长内运行循环：\n\n\
    ```\ntotal_reward = 0\nfor _ in range(MAX_STEP):\n    observation = torch.tensor(observation).type('torch.FloatTensor').view(1,-1)\n\
    \    action_probablity = agent(observation).detach().numpy()[0]\n    action =\
    \ np.random.choice(range(env.action_space.n), 1, p=action_probablity).item()\n\
    \    next_observation, reward, terminal, _ = env.step(action)\n    total_reward\
    \ += reward\n    observation = next_observation\n\n    if terminal:\n        break\n\
    return total_reward\n```\n\n4.  然后，我们需要定义智能体的平均得分：\n\n```\n>>def agent_score(agent,\
    \ env, runs):\n    score = 0\n    for _ in range(runs):\n        score += eval_agent(agent,\
    \ env)\n\n    return score/runs \n```\n\n5.  最后，我们评估所有智能体的分数：\n\n```\n>>def all_agent_score(agents,\
    \ env, runs):\n    agents_score = []\n    for agent in agents:\n        agents_score.append(agent_score(agent,\
    \ env, runs))\n\n    return agents_score\n```\n\n现在，我们的函数已准备好进行评估。\n\n# 工作原理\n\
    \n在本秘籍中，我们完成了深度遗传算法的一些关键函数。 我们研究了三个不同的函数-第一个函数`eval_agent()`与我们在“训练 DQN”秘籍中看到的函数非常相似，其中我们使用了智能体，该智能体是一种神经网络模型，它预测要采取的动作，并执行到`MAX_STEP`（对于`cartpole-v1`为\
    \ 500）或终端为`True`并返回分数的动作。\n\n然后，我们使用第二个函数`agent_score()`返回指定数量`runs`之上的平均分数，并返回该平均分数，以确保模型的随机表现不佳。\
    \ 最后一个函数`all_agent_score()`仅循环遍历一代中的所有智能体，并获得一代中所有智能体的平均分数。\n\n# 使智能体突变\n\n在本秘籍中，我们将介绍使智能体突变。\
    \ 在从给定的一代中选择表现最佳的模型之后，然后再创建下一代智能体，我们将对这些选定智能体的权重进行轻微的随机变化，这使智能体可以探索更多区域以获得更好的回报，就像生物进化的工作原理一样。\n\
    \n# 操作步骤\n\n在此秘籍中，我们将识别精英智能体并向这些智能体添加突变。 按着这些次序：\n\n1.  首先，我们将导入`copy`和`numpy`模块：\n\
    \n```\n>>import copy\n>>import numpy\n```\n\n2.  接下来，我们将定义`mutation`函数：\n\n```\n\
    >>def mutation(agent):\n    child_agent = copy.deepcopy(agent)\n```\n\n3.  接下来，我们将遍历智能体的参数：\n\
    \n```\nfor param in agent.parameters():\n    mutation_noise = torch.randn_like(param)\
    \ * MUTATION_POWER\n```\n\n4.  然后，我们将变异噪声添加到参数中：\n\n```\n    param += mutation_noise\n\
    return child_agent\n```\n\n5.  现在，定义`elite`函数：\n\n```\n>>def elite(agents, top_parents_id,\
    \ env, elite_id=None, top=10):\n    selected_elites = top_parents_id[:top]\n \
    \   if elite_id:\n        selected_elites.append(elite_id)\n\n    top_score =\
    \ np.NINF\n    top_id = None\n```\n\n6.  接下来，找到`elite`智能体：\n\n```\nfor agent_id\
    \ in selected_elites:\n    score = agent_score(agents[agent_id], env, runs=5)\n\
    \    if score > top_score:\n       top_score = score\n       top_id = agent_id\n\
    \nreturn copy.deepcopy(agents[top_id])\n```\n\n7.  获取子智能体：\n\n```\n>>def child_agents(agents,\
    \ top_parents_id, env, elite_id=None):\n    children = []\n\n    agent_count =\
    \ len(agents)-1    \n    selected_agents_id = np.random.choice(top_parents_id,\
    \ agent_count)\n    selected_agents = [agents[id] for id in selected_agents_id]\n\
    \    child_agents = [mutate(agent) for agent in selected_agents]\n\n    child_agents.append(elite(agents,\
    \ top_parents_id, env))\n    elite_id = len(child_agents)-1\n\n    return child_agents,\
    \ elite_id\n```\n\n8.  获取顶级父级：\n\n```\n>>def top_parents(scores, num_top_parents):\n\
    \    return np.argsort(rewards)[::-1][:num_top_parents]\n```\n\n在这里，我们定义了识别精英智能体的函数和为智能体增加噪音的函数。\n\
    \n# 工作原理\n\n在本秘籍中，我们研究了四个不同的函数-`mutation`函数为一个智能体创建一个重复项，并为每个参数附加一个受`MUTATION_POWER`限制的小的随机值。\
    \ `rand_like`方法从间隔`[0, 1)`上以与`param`相同的大小从均匀分布返回具有随机值的张量。 最后，该函数返回突变的子智能体。 接下来，我们看到`elite`函数返回表现最佳的智能体中最佳智能体的副本。\
    \ 在`elite`函数中，我们重新评估智能体以确保得分最高的智能体被选为精英，并作为子智能体传递给下一代。\n\n`child_agent`函数生成的子智能体数量与上一代相同，其中一个子智能体是`elite`函数的精英智能体，其余子智能体则使用`np.random.choice`随机选择。\
    \ `selected_agents`保留了表现最佳的选定智能体的列表。 在`[mutate(agent) for agent in selected_agents]`步骤中，使用`mutation`函数对得分最高的智能体进行突变。\n\
    \n然后，我们将精英智能体附加到下一代智能体。 最后，`top_parent`函数返回一代中表现最高的智能体的索引。\n\n# 训练深度 GA\n\n在本秘籍中，我们将完成深度遗传算法的演化，并可视化执行平衡操作的关键。\
    \ 我们将使用在本章的秘籍中了解到的所有函数，并针对给定的代数运行这些函数。 这将创建智能体，获取他们的分数，选择表现最佳的智能体，并将其突变为下一代。 在几代人中，我们将看到智能体的分数增加。\n\
    \n# 操作步骤\n\n按着这些次序：\n\n1.  首先，我们将导入`gym`：\n\n```\n>>import gym\n```\n\n2.  接下来，我们将声明超参数：\n\
    \n```\n>>ENV_NAME = \"CartPole-v1\"\n>>MAX_STEP = 500\n>>MUTATION_POWER = 0.02\n\
    >>num_agents = 500\n>>num_top_parents = 20\n>>generations = 25\n>>elite_agent\
    \ = None\n```\n\n3.  之后，我们将创建环境并禁用梯度计算：\n\n```\n>>torch.set_grad_enabled(False)\n\
    >>env = gym.make(ENV_NAME)\n```\n\n4.  现在，创建智能体：\n\n```\n>>agents = create_agents(num_agents,\
    \ env.observation_space.shape[0], env.action_space.n)\n```\n\n5.  接下来，遍历几代：\n\n\
    ```\n>>print(f'| Generation | Score |')\n>>for gen in range(generations):\n```\n\
    \n现在，我们可以评估智能体：\n\n```\n      rewards = all_agent_score(agents, env, 3)\n```\n\
    \n通过这样做，我们得到了最好的智能体：\n\n```\n      top_parents_id = top_parents(rewards, num_top_parents)\n\
    ```\n\n反过来，这将创建下一代：\n\n```\n      agents, elite_agent = child_agents(agents, top_parents_id,\
    \ env, elite_agent)\n      print(f'| {gen+1:03} | {np.mean([rewards[i] for i in\
    \ top_parents_id[:5]]):.4f} |')\n```\n\n以下代码块显示了示例输出："
