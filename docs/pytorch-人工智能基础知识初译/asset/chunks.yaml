    | 076 |       0.0100     | 154   |\n| 077 |       0.0100     | 285   |\n.\n.\n\
    .\n```\n\n10. 现在，我们将定义一个函数，该函数将可视化小车的表现：\n\n```\n>>def play_agent(dqn, env):\n\
