    \ 为了增加高度和宽度，我们必须执行与卷积操作相反的操作，这称为反卷积。 我们将在使用卷积执行分类任务时执行此操作。 在执行反卷积时，我们将增加高度和宽度，同时减少通道数。\n\
    \n以下是我们的 `DCGAN` 生成器的架构图：\n\n![](img/9c901278ca7fd0b72714aa1201e7fa4d.png)\n\n\
    请注意，我们将使用第 3 章，“用于计算机视觉的卷积神经网络”中的概念，因此再次阅读这些秘籍将非常有用。\n\n### 操作步骤\n\n在此秘籍中，我们将实现\
    \ `GAN` 网络的生成器端：\n\n1. 我们将从导入开始：\n\n```\n>import torch\n>>import torch.nn as nn\n\
    >>import torchvision.transforms as transforms\n```\n\n2. 然后，我们将定义转换：\n\n```\n\
    >>transform = transforms.Compose([\n    transforms.ToTensor(),\n    transforms.Normalize((0.5,\
    \ ), (0.5, )),\n])\n```\n\n3. 然后，我们将提供该设备：\n\n```\n>>device = torch.device(\"\
    cuda\" if torch.cuda.is_available() else \"cpu\")\n```\n\n3. 现在，我们将定义生成器类：\n\n\
    ```\n>>class Generator_model(nn.Module):\n    def __init__(self, z_dim):\n   \
    \      super().__init__()\n```\n\n4. 然后，我们将定义生成器的单元：\n\n```\n self.fc = nn.Linear(z_dim,\
    \ 256 * 7 * 7)\n self.gen = nn.Sequential(\n            nn.ConvTranspose2d(256,\
    \ 128, 4, 2, 1),\n            nn.BatchNorm2d(128),\n            nn.LeakyReLU(0.01),\n\
    \            nn.ConvTranspose2d(128, 64, 3, 1, 1),\n            nn.BatchNorm2d(64),\n\
    \            nn.LeakyReLU(0.01),\n            nn.ConvTranspose2d(64, 1, 4, 2,\
    \ 1),\n            nn.Tanh()\n        )\n```\n\n5. 现在我们将定义 `forward` 方法：\n\n```\n\
    def forward(self, input):\n    x = self.fc(input)\n    x = x.view(-1, 256, 7,\
    \ 7)\n    return self.gen(x)\n```\n\n6. 最后，我们将为生成器模型创建对象：\n\n```\n>>generator\
    \ = Generator_model(z_dim).to(device)\n```\n\n完成此过程后，我们已经准备好 `DCGAN` 生成器。\n\n\
    ### 工作原理\n\n在此秘籍中，我们进行了变换以将图像转换为张量并对其进行归一化，就像在第 3 章，“用于计算机视觉的卷积神经网络”中所做的一样。 然后，我们确定了机器上的设备：CPU\
    \ 或 GPU。 然后，我们定义了从 `nn.Module` 类继承的 `Generator_model` 类，就像在所有以前的架构中所做的一样。\n\n\
    在构造器中，我们传递了 `z_dim` 参数，这是我们的噪声向量大小。 然后，我们定义了一个全连接单元 `self.fc`，我们将噪声向量传递给该单元，并为其提供了\
    \ `256 * 7 * 7` 输出。 然后，我们定义了一个称为 `self.gen` 的 `nn.Sequential` 单元，其中包含用于定义生成器的关键组件。\
    \ 我们使用 `PyTorch` 中提供的 `nn.ConvTranspose2d`，`nn.BatchNorm2d` 和 `nn.LeakyReLU` 使用一组反卷积，批量规范化和激活层。\
    \ `ConvTranspose2d` 接受输入通道，输出通道，核大小，步幅和填充等参数。 `BatchNorm2d` 接受上一层的特征/通道数作为其参数，而\
    \ `LeakyReLU` 接受负斜率的角度。\n\n与 `ReLU` 不同，`LeakyReLU` 允许传递小的梯度信号以获取负值。 它使来自判别器的梯度流入生成器。\
    \ 我们在输出层中使用了 `tanh` 激活，但是从 `DCGAN` 论文中我们观察到，使用有界激活可以使模型学会快速饱和并覆盖训练分布的色彩空间。 `tanh`\
    \ 的对称性在这里可能是一个优势，因为网络应该以对称方式处理较深的颜色和较浅的颜色。\n\n让我们看一下 `forward` 方法的工作方式。 `z_dim`\
    \ 维度的输入噪声向量经过全连接层以提供 12544 输出。 然后，我们将 12544 输出调整为 `256 x 7 x 7`，其中 256 是通道数。 `256\
    \ x 7 x 7` 张量然后通过反卷积层以提供 `128 x 14 x 14` 输出，然后通过具有 128 个特征和泄漏 `ReLU` 的 `Batchnorm`\
    \ 层。 `128 x 14 x 14` 然后在第二次反卷积中转换为 `64 x 14 x 14` 张量，在第三次反卷积中变为 `1 x 28 x 28`\
    \ 张量； 这些只是我们需要的尺寸。 然后，我们创建生成器对象并将其移动到设备。\n\n## 创建 DCGAN 判别器\n\n在本秘籍中，我们将探讨 `GAN`\
    \ 网络的鉴别方。 基本上，判别器是在两个类别之间进行分类的分类器，即根据给定图像是来自数据集的真实图像还是由生成器网络生成的伪图像。 正是基于来自判别器网络的反馈，生成器学会了创建更好的图像，以试图使判别器误以为来自生成器的图像是真实的。\
    \ 现在，在 `DCGAN` 中，将使用卷积神经网络构建判别器。\n\n以下是我们的判别器的架构图：\n\n![](img/037411b9da843f91cea0bc948f9519d5.png)\n\
    \n### 准备好\n\n在本秘籍中，我们将严重依赖第 3 章，“用于计算机视觉的卷积神经网络”的秘籍，因此最好快速浏览第 3 章，“用于计算机视觉的卷积神经网络”。\n\
    \n### 操作步骤\n\n在此秘籍中，我们将构建 `GAN` 的判别器端：\n\n1. 我们将从导入开始：\n\n```\n>>import torch.nn.functional\
    \ as F\n```\n\n2. 然后，我们将定义判别器类：\n\n```\n>>class Discriminator_model(nn.Module):\n\
    \    def __init__(self):\n        super().__init__()\n```\n\n3. 接下来，我们定义鉴别单元：\n\
    \n```\nself.disc = nn.Sequential(\n            nn.Conv2d(1, 32, 3, 2, 1),\n  \
    \          nn.LeakyReLU(0.01),\n            nn.Conv2d(32, 64, 3, 2, 1),\n    \
    \        nn.BatchNorm2d(64),\n            nn.LeakyReLU(0.01),\n            nn.Conv2d(64,\
    \ 128, 3, 2, 1),\n            nn.BatchNorm2d(128),\n            nn.LeakyReLU(0.01)\n\
    \        )\n```\n\n4. 然后定义最后一个全连接层：\n\n```\nself.fc = nn.Linear(2048, 1)\n```\n\
    \n5. 然后定义 `forward()` 方法：\n\n```\ndef forward(self, input):\n        x = self.disc(input)\n\
    \        return F.sigmoid(self.fc(x.view(-1, 2048)))\n```\n\n6. 然后我们创建鉴别对象：\n\n\
    ```\n>>discriminator = Discriminator_model().to(device)\n```\n\n现在我们已经准备好判别器。\n\
    \n### 工作原理\n\n在本秘籍中，我们定义了一个分类器； 使用 `nn.Sequential()` 定义卷积，激活和批量规范化单元的数组； 并且还定义了最后一个全连接层，该层采用平坦的张量并给出通过\
    \ `Sigmoid` 层的单个输出。 由于只有两个类，因此我们最后使用了 `Sigmoid` 层。 输入是尺寸为 `1 x 28 x 28` 的图像张量，并经过第一卷积单元以给出尺寸为\
    \ `32 x 14 x 14` 的输出张量。 第二个卷积层使它成为 `64 x 7 x 7` 张量，然后从那里变成 `128 x 4 x 4`。 之后，我们将拉平并使张量穿过全连接层。\n\
    \n## 训练 DCGAN 模型\n\n我们在前两个秘籍中定义了生成器，即“创建 DCGan 生成器”和“创建 `DCGAN` 判别器”。 在本秘籍中，我们将继续训练\
    \ `GAN` 模型。 请记住，生成器的目标是创建与数据集尽可能相似的图像，而判别器的目标是区分真实图像和生成的图像。 从理论上讲，生成器将捕获数据集中图像的所有特征，并且无法学习更多信息，而判别器只能猜测图像是真实的还是生成的。\
    \ 在本秘籍中，我们将通过整合到目前为止已经创建的生成器和判别器来完成 `DCGANs` 模型的训练。\n\n### 准备好\n\n我们将使用 `torchsummary`\
    \ 库来查看我们的模型层，它们的输出形状和它们的参数。 为此，我们将使用以下命令安装该库：\n\n```\npip install torchsummary\n\
    ```\n\n准备好此安装​​后，我们将继续进行下一步。\n\n### 操作步骤\n\n在此秘籍中，我们将完成 `GAN` 训练：\n\n1. 首先导入：\n\
    \n```\n>>from torchsummary import summary\n>>import torch.optim as optim\n>>import\
    \ torchvision.utils as vutils\n```\n\n2. 然后我们初始化生成器和判别器的权重：\n\n```\n>>def weights_init(m):\n\
    \    classname = m.__class__.__name__\n    if classname.find('Conv') != -1:\n\
    \        nn.init.normal_(m.weight.data, 0.0, 0.02)\n    elif classname.find('BatchNorm')\
    \ != -1:\n        nn.init.normal_(m.weight.data, 1.0, 0.02)\n        nn.init.constant_(m.bias.data,\
    \ 0)\n>>generator.apply(weights_init)\n>>discriminator.apply(weights_init)\n```\n\
    \n3. 然后我们打印生成器的摘要：\n\n```\n>>summary(generator, (100, ))\n```\n\n这给我们以下输出：\n"
