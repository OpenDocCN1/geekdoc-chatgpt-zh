    \        new_observation, reward, done, _ = env.step(action)\n        total_reward\
    \ += reward\n        observation = new_observation\n\n        if(done):\n    \
    \        break\n```\n\n最后，关闭环境：\n\n```\n    env.close()\n    print(\"Rewards:\
    \ \",total_reward)\n```\n\n调用 `play_agent()` 函数：\n\n```\n>>play_agent(dqn, env)\n\
    Rewards: 160.0\n```\n\n这样，我们就对 `DQN` 进行了训练和可视化。\n\n## 工作原理\n\n在本秘籍中，我们首先使用超参数导入并初始化环境。\
    \ 然后，我们创建了 `DQN` 类的实例，并开始训练循环，重置环境，并对状态数组进行整形，以便可以将其作为浮点张量输入到模型中。 然后，我们开始了一个无限循环，当\
    \ `env.step()` 方法的返回值将 `terminal` 设置为 `True` 时终止。 `predict_action()` 方法预测在给定环境当前状态下要采取的措施。\
    \ 然后，我们使用环境的 `step()` 方法应用了此操作。 我们采用 `step` 方法返回的下一个状态，并将其从 `numpy` 转换为 `torch.FloatTensor`，并保存了环境参数。\
    \ 我们一次又一次地将此新状态传递给模型。 我们还每隔几步就将权重从我们的策略网复制到目标网。\n\n"
