- raw: "1.  首先，我们将导入所需的割炬`modules`：\n\n```\n        >>import torch\n        >>import\
    \ torch.nn as nn\n```\n\n2.  接下来，我们将 2D 卷积应用于图像：\n\n```\n        >>nn.Conv2d(3,\
    \ 16, 3)\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1,\
    \ 1))\n```\n\n3.  然后，我们在图像的边缘添加所需大小的填充：\n\n```\n        >>nn.Conv2d(3, 16, 3,\
    \ padding=1)\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1,\
    \ 1), padding=(1, 1))\n```\n\n4.  然后，我们可以使用以下代码创建一个非平方核（过滤器）：\n\n```\n       \
    \ >>nn.Conv2d(3, 16, (3,4), padding=1)\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16,\
    \ kernel_size=(3, 4), stride=(1, 1), padding=(1, 1))\n```\n\n5.  然后，我们可以使用以下代码将步幅添加到卷积中：\n\
    \n```\n        >>nn.Conv2d(3, 16, 3, stride=2)\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3,\
    \ 16, kernel_size=(3, 3), stride=(2, 2))\n```\n\n6.  我们在水平和垂直方向上的步幅和填充量可能不相等：\n\
    \n```\n>>nn.Conv2d(3, 16, (3,4), stride=(3,3), padding=(1,2))\n```\n\n这将创建以下卷积层：\n\
    \n```\nConv2d(3, 16, kernel_size=(3, 4), stride=(3, 3), padding=(1, 2))\n```\n\
    \n通过此秘籍，我们学习了如何在 PyTorch 中使用卷积。\n\n# 工作原理\n\n在本秘籍中，我们研究了创建 2D 卷积的多种方法，其中第一个参数是给定输入图像中的通道数，对于彩色图像，通道数将为`3`，对于灰度图像将为`1`。\
    \ 第二个参数是输出通道的数量，换句话说，就是我们要从给定层获得的过滤器的数量。 第三个参数是核大小（即核大小），或者是要使用过滤器卷积的图像的补丁大小。\n\
    \n然后，我们创建了一个`Con2d`对象，并将输入传递到 2D 卷积层以获取输出。 使用`nn.Conv2d(3, 16, 3)`，我们创建了一个卷积层，该卷积层接受\
    \ 3 个通道的输入并输出 16 个通道。 该层的大小为`3 x 3`的正方形核，其高度和宽度的默认跨度为 1。 我们可以使用`padding`参数添加填充，该参数可以具有整数或元组值。\
    \ 在这里，整数值将为高度和宽度创建相同的填充，而元组值将为高度和宽度创建不同的填充-这对于核大小和跨度都是正确的。\n\n# 更多\n\n通过将`padding`参数设置为`0`（默认设置），可以有效填充。\
    \ 您还可以通过更改`padding_mode`参数将零填充更改为圆形填充。 您可以使用`bias`布尔参数（默认为`True`）添加或删除偏差。\n\n\
    # 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#torch.nn.Conv2d)了解有关\
    \ PyTorch 卷积的其他参数。\n\n# 探索池化\n\n现在，我们进入 CNN 的下一个关键层-池化层。 到目前为止，我们一直在处理图像而不改变帧的空间尺寸（考虑相同的填充）；\
    \ 相反，我们一直在增加通道/过滤器的数量。 池化层用于减小输入的空间尺寸，并保留其深度。 当我们从 CNN 的初始层移到后面的层时，我们希望在图像中识别出比实际逐个像素信息更多的概念意义，因此我们想从输入和抛出中识别并保留剩下的关键信息。\
    \ 池化层可以帮助我们做到这一点。\n\n这是最大池化的示意图：\n\n![](Images/fbfde3375f0c6201207b63257d5d7619.png)\n\
    \n这是使用池化层的主要原因：\n\n*   **减少计算数量**：通过减少输入的空间尺寸而不会损失过滤器，我们可以获得更好的计算表现，因此我们减少了训练所需的时间以及计算资源。\n\
    \n*   **防止过拟合**：随着空间尺寸的减小，我们减少了模型具有的参数数量，从而降低了模型的复杂性并有助于我们更好地概括。\n\n*   **位置不变性**：这使\
    \ CNN 可以捕获图像中的特征，而不管特征在给定图像中的位置。 假设我们正在尝试建立一个分类器来检测芒果。 芒果位于图像的中心，左上角，右下角还是图像中的任何位置都没关系-需要对其进行检测。\
    \ 池化层可以帮助我们。\n\n池的类型很多，例如最大池，平均池，和池等。 但是，最大池化是最受欢迎的。 以与处理卷积层相同的方式，我们将定义一个窗口并在该窗口中应用所需的池化操作。\
    \ 我们将根据层的跨度水平和垂直地滑动窗口。\n\n# 操作步骤\n\n在此秘籍中，我们将研究如何在 PyTorch 中实现池化层：\n\n1.  首先，让我们进行导入：\n\
    \n```\n    >>import torch\n    >>import torch.nn as nn\n```\n\n2.  然后，我们使用`nn`模块中定义的池类，如下所示：\n\
    \n```\n    >>max_pool = nn.MaxPool2d(3, stride=1)\n```\n\n3.  现在，让我们定义一个张量来执行池化：\n\
    \n```\n    >>a = torch.FloatTensor(3,5,5).random_(0, 10)\n    >>a\n```\n\n这给我们以下输出：\n\
    \n```\n    tensor([[[2., 8., 6., 8., 3.],\n [6., 6., 7., 6., 6.],\n [2., 0., 8.,\
    \ 8., 8.],\n [2., 0., 3., 5., 7.],\n [9., 7., 8., 2., 1.]],\n\n [[1., 8., 6.,\
    \ 7., 3.],\n [0., 1., 2., 9., 4.],\n [1., 2., 5., 0., 1.],\n [8., 2., 8., 3.,\
    \ 1.],\n [5., 4., 0., 5., 2.]],\n\n [[1., 6., 2., 6., 1.],\n [4., 0., 0., 6.,\
    \ 6.],\n [4., 2., 2., 3., 2.],\n [1., 0., 1., 7., 1.],\n [8., 1., 0., 5., 4.]]])\n\
    ```\n\n4.  现在，我们将池化应用于张量：\n\n```\n    >>max_pool(a)\n```\n\n这给我们以下输出：\n\n```\n\
    \ tensor([[[8., 8., 8.],\n [8., 8., 8.],\n [9., 8., 8.]],\n\n [[8., 9., 9.],\n\
    \ [8., 9., 9.],\n [8., 8., 8.]],\n\n [[6., 6., 6.],\n [4., 7., 7.],\n [8., 7.,\
    \ 7.]]])\n```\n\n5.  现在，我们可以尝试以类似方式进行平均池化：\n\n```\n    >>avg_pool = nn.AvgPool2d(3,\
    \ stride=1)\n```\n\n6.  然后，我们像以前一样应用平均池化：\n\n```\n     >>avg_pool(a) \n```\n\n\
    这给我们以下输出：\n\n```\n tensor([[[5.0000, 6.3333, 6.6667],\n [3.7778, 4.7778, 6.4444],\n\
    \ [4.3333, 4.5556, 5.5556]],\n\n [[2.8889, 4.4444, 4.1111],\n [3.2222, 3.5556,\
    \ 3.6667],\n [3.8889, 3.2222, 2.7778]],\n\n [[2.3333, 3.0000, 3.1111],\n [1.5556,\
    \ 2.3333, 3.1111],\n [2.1111, 2.3333, 2.7778]]])\n```\n\n通过此秘籍，我们了解了 PyTorch 中的池化操作。\n\
    \n# 工作原理\n\n在前面的代码中，我们研究了一个张量的示例，以了解实际的池化层。 我们使用大小为`3 x 3`的方形核。池的第一个应用发生在`[0,0,0]`到`[0,3,3]`的面片上。\
    \ 由于步幅为 1，因此下一个要操作的音色为`[0,0,1]`至`[0,3,4]`。 一旦碰到水平端，就对下面的张量进行运算。 `nn.MaxPool2d(3,\
    \ stride=1)`和`nn.AvgPool2d(3, stride=1)`都创建了大小为`3x3`的最大和平均池方核，步幅为`1`，将其应用于随机张量`a`。\n\
    \n# 更多\n\n在本秘籍中，我们研究了正方形核，但是我们可以选择使用非正方形核并大步前进，就像我们进行卷积一样。 还有另一种流行的池化方法，称为全局平均池化，可以通过输入的维数通过平均池化来实现。\
    \ 例如`avg_pool2d(a, a.size()[2:]0)`。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#pooling-layers)上找到有关池和各种池的更多信息。\n\
    \n# 探索转换\n\nPyTorch 无法直接处理图像像素，需要将其内容作为张量。 为了解决这个问题，`torchvision`是一个专门处理视觉和图像相关任务的库，提供了一个名为`transform`的模块，该模块提供了将像素转换为张量，标准化标准缩放等的\
    \ API。 在本秘籍中，我们将探索转换模块中的各种方法。 因此，您需要安装`torchvision`才能阅读此秘籍。\n\n# 操作步骤\n\n在本节中，我们将探讨`torchvision`中的各种转换：\n\
    \n1.  我们将从导入`torchvision`开始：\n\n```\n    >>from torchvision import transforms\n\
    ```\n\n2.  让我们根据图像创建张量：\n\n```\n    >>transforms.ToTensor()\n```\n\n3.  接下来，让我们标准化图像张量：\n\
    \n```\n>>transforms.Normalize((0.5,),(0.5,))\n```\n\n4.  要调整图像大小，我们将使用以下方法：\n\n\
    ```\n    >>transforms.Resize(10)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Resize((10,10))\n\
    ```\n\n5.  然后，我们使用转换来裁剪图像：\n\n```\n    >>transforms.CenterCrop(10)\n```\n\n我们还可以使用以下内容：\n\
    \n```\n    >>transforms.CenterCrop((10, 10))\n```\n\n6.  我们可以使用转换来填充图像张量：\n\n\
    ```\n>>transforms.Pad(1, 0)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Pad((1,\
    \ 2), 1)\n```\n\n如果愿意，我们还可以执行以下操作：\n\n```\n>>transforms.Pad((1, 2, 2, 3), padding_mode='reflect')\n\
    ```\n\n7.  然后，我们链接多个转换：\n\n```\n>>transforms.Compose([\n     transforms.CenterCrop(10),\n\
    \     transforms.ToTensor(),\n  ])\n```\n\n在此秘籍中，我们了解了`torchvision`中使用的一些转换。\n\
    \n# 工作原理\n\n在前面的代码段中，我们研究了`torchvision`中可用的各种转换。 这些使我们可以获取输入图像并将其格式化为所需尺寸和属性的张量，然后将其输入到割炬模型中。\
    \ 我们研究的第一种方法是`toTensor()`方法，该方法将给定的输入图像转换为张量。 然后我们可以使用`Normalize()`方法对该输入图像张量进行归一化。\
    \ `Normalize()`方法采用两个元组，其中第一个元组是输入图像中每个通道的均值序列，第二个元组是每个通道的标准差序列。\n\n此外，我们可以使用`Resize()`方法将给定图像的大小调整为所需尺寸，如果给定整数，则将其与较小边缘的长度匹配，如果给定元组，则将其与图像的高度和宽度匹配。\
    \ 在某些情况下，有关图像的关键信息位于其中心，在这种情况下，可以裁剪并仅考虑给定图像的中心； 为此，您可以使用`CenterCrop()`方法。 然后，我们传入一个整数以从中心裁剪一个正方形，或将与高度和宽度匹配的序列传递给`CenterCrop()`。\n\
    \n另一个重要任务是填充图像以匹配特定尺寸。 为此，我们使用`Pad()`方法。 我们将填充大小作为整数表示，用于在所有面上进行均等大小的填充，或者将序列作为由两个元素组成的序列，用于填充大小分别对应于左/右和上/下。\
    \ 此外，我们可以将左侧，顶部，右侧和底部的填充大小作为由四个元素组成的序列传递。 然后，我们将填充值作为整数提供，如果它是三个元素的元组，则分别用作 R，G\
    \ 和 B 通道的填充值。 除此之外，`Pad()`方法还具有`padding_mode`参数，该参数具有以下可能性：\n\n*   `constant`：使用提供的填充值来填充\n\
    \n*   `edge`：在图像边缘使用数值来填充\n\n*   `reflect`：使用图像反射来填充，边缘像素除外\n\n*   `symmetric`：使用图像反射来填充，包括边缘像素\n\
    \n最后，我们研究了`Compose()`转换，该转换通过将一系列转换对象作为参数传递来组合各种转换以构建转换管道。\n\n# 更多\n\n`transforms.functional`模块中有用于转换的函数式\
    \ API。 它们通过提供对转换的细粒度控制来帮助我们建立复杂的转换管道。\n\n还有其他有用的转换，例如灰度转换，它使用`Grayscale()`作为输出通道数作为参数。\
    \ 我们将在下一部分中探索更多的转换。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html#functional-transforms)上了解有关函数式转换的更多信息。\n\
    \n# 执行数据扩充\n\n在本秘籍中，我们将学习有关使用火炬进行数据扩充的知识。 数据扩充是深度学习和计算机视觉中的一项重要技术。 对于任何涉及深度学习或计算机视觉的模型，可用的数据量对于查看模型的表现至关重要。\
    \ 数据扩充可防止模型记住有限数量的数据，而不是对观察到的数据进行概括。 数据扩充通过从原始图像创建变量而不实际收集新数据来增加用于训练模型的数据的多样性。\n\
    \n通常，光量，亮度，方向或颜色变化不会影响模型所做的推断。 但是，当模型在现实世界中部署时，输入数据可能会有这些变化。 对于模型来说，知道其做出的决定必须相对于输入中的这些变化是不变的，这很有用，因此数据扩充可以提高模型的表现。\
    \ 在本秘籍中，我们将使用 PyTorch 的`transform`模块执行数据扩充。\n\n# 操作步骤\n\n为了充分利用此秘籍，您应该完成“探索转换”秘籍，因为此秘籍是我们对转换工作的延续。\
    \ 在本秘籍中，我们将介绍一些我们可以使用`torchvision`中的`transform`模块执行的流行数据扩充：\n\n1.  我们将从导入`torchvision`开始：\n\
    \n```\n>>import torchvision\n```\n\n2.  然后，我们将随机裁剪图像的一部分：\n\n```\n>>transforms.RandomCrop(10)\n\
    ```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.RandomCrop((10,20))\n```\n\n3.  我们可以使用以下方法水平翻转图像：\n\
    \n```\n>>transforms.RandomHorizontalFlip(p=0.3)\n```\n\n4.  我们也可以垂直翻转它：\n\n```\n\
    >>transforms.RandomVerticalFlip(p=0.3)\n```\n\n5.  尝试添加亮度，对比度，饱和度和色调变化：\n\n```\n\
    >>transforms.ColorJitter(0.25, 0.25, 0.25, 0.25)\n```\n\n6.  接下来，让我们添加旋转变化：\n\n\
    ```\n>>transforms.RandomRotation(10)\n```\n\n7.  最后，我们将构成所有转换：\n\n```\n>>transforms.Compose([\n\
    \     transforms.RandomRotation(10),\n     transforms.ToTensor(),\n])\n```\n\n\
    在此秘籍中，我们在数据上创建了转换以从现有数据创建更多数据。\n\n# 工作原理\n\n在本秘籍中，我们了解了如何通过执行对手头问题有意义的某些转换来为数据添加变化。\
    \ 选择正确的数据扩充以模仿我们在现实生活中会遇到的图像变化时，我们必须小心。 例如，在构建汽车分类器时，有意义的是使用颜色和亮度的变化来增加数据，或者水平翻转汽车图像，等等。\
    \ 但是，除非我们要解决汽车上下颠倒的问题，否则使用垂直翻转的汽车图像来增强数据是没有意义的。\n\n在此秘籍中，我们尝试在随机位置裁剪图像，以便如果无法获得对象的整个图像，但无法获得一部分，则我们的模型将能够检测到该对象。\
    \ 我们应该将裁剪后的图像大小包括为整数或具有特定高度和宽度的元组。 然后，我们水平翻转图像，并随机传递了水平翻转和垂直翻转的概率。 然后，我们使用`ColorJitter()`方法在图像的颜色，对比度，饱和度和色调上创建了变化。\n\
    \n我们通过设置参数来控制每种颜色的变化量，其中颜色，对比度和饱和度在`[max(0, 1-parameter), 1 + parameter]`值之间变化，而色相在`[-hue,\
    \ hue]`之间，其中色调介于 0 到 0.5 之间。 我们还向图像添加了随机旋转，并提供了最大旋转角度。 最后，选择正确的数据扩充策略后，将其添加到`transforms.compose()`中。\n\
    \n# 更多\n\n我们还可以自定义定义图像数据所需的转换。 为此，我们将使用`transforms.Lambda()`并将函数或 lambda 传递给所需的自定义转换。\n\
    \n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html)了解有关仿射变换等其他变换的信息。\n\
    \n# 加载图像数据"
  fmt: "\n# 卷积\n\n1. 首先，我们将导入所需的割炬 `modules`：\n\n```\n>>import torch\n>>import torch.nn\
    \ as nn\n```\n\n2. 接下来，我们将 2D 卷积应用于图像：\n\n```\n>>nn.Conv2d(3, 16, 3)\n```\n\n\
    这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1, 1))\n```\n\n3.\
    \ 然后，我们在图像的边缘添加所需大小的填充：\n\n```\n>>nn.Conv2d(3, 16, 3, padding=1)\n```\n\n这将创建以下卷积层：\n\
    \n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n```\n\
    \n4. 然后，我们可以使用以下代码创建一个非平方核（过滤器）：\n\n```\n>>nn.Conv2d(3, 16, (3,4), padding=1)\n\
    ```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 4), stride=(1, 1), padding=(1,\
    \ 1))\n```\n\n5. 然后，我们可以使用以下代码将步幅添加到卷积中：\n\n```\n>>nn.Conv2d(3, 16, 3, stride=2)\n\
    ```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(2, 2))\n```\n\
    \n6. 我们在水平和垂直方向上的步幅和填充量可能不相等：\n\n```\n>>nn.Conv2d(3, 16, (3,4), stride=(3,3),\
    \ padding=(1,2))\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 4),\
    \ stride=(3, 3), padding=(1, 2))\n```\n\n通过此秘籍，我们学习了如何在 PyTorch 中使用卷积。\n\n## 工作原理\n\
    \n在本秘籍中，我们研究了创建 2D 卷积的多种方法，其中第一个参数是给定输入图像中的通道数，对于彩色图像，通道数将为 `3`，对于灰度图像将为 `1`。\
    \ 第二个参数是输出通道的数量，换句话说，就是我们要从给定层获得的过滤器的数量。 第三个参数是核大小（即核大小），或者是要使用过滤器卷积的图像的补丁大小。\n\
    \n然后，我们创建了一个 `Con2d` 对象，并将输入传递到 2D 卷积层以获取输出。 使用 `nn.Conv2d(3, 16, 3)`，我们创建了一个卷积层，该卷积层接受\
    \ 3 个通道的输入并输出 16 个通道。 该层的大小为 `3 x 3` 的正方形核，其高度和宽度的默认跨度为 1。 我们可以使用 `padding` 参数添加填充，该参数可以具有整数或元组值。\
    \ 在这里，整数值将为高度和宽度创建相同的填充，而元组值将为高度和宽度创建不同的填充-这对于核大小和跨度都是正确的。\n\n## 更多\n\n通过将 `padding`\
    \ 参数设置为 `0`（默认设置），可以有效填充。 您还可以通过更改 `padding_mode` 参数将零填充更改为圆形填充。 您可以使用 `bias`\
    \ 布尔参数（默认为 `True`）添加或删除偏差。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/nn.html#torch.nn.Conv2d)\
    \ 了解有关 PyTorch 卷积的其他参数。\n\n# 探索池化\n\n现在，我们进入 CNN 的下一个关键层-池化层。 到目前为止，我们一直在处理图像而不改变帧的空间尺寸（考虑相同的填充）；\
    \ 相反，我们一直在增加通道/过滤器的数量。 池化层用于减小输入的空间尺寸，并保留其深度。 当我们从 CNN 的初始层移到后面的层时，我们希望在图像中识别出比实际逐个像素信息更多的概念意义，因此我们想从输入和抛出中识别并保留剩下的关键信息。\
    \ 池化层可以帮助我们做到这一点。\n\n这是最大池化的示意图：\n\n![](Images/fbfde3375f0c6201207b63257d5d7619.png)\n\
    \n这是使用池化层的主要原因：\n\n* **减少计算数量**：通过减少输入的空间尺寸而不会损失过滤器，我们可以获得更好的计算表现，因此我们减少了训练所需的时间以及计算资源。\n\
    * **防止过拟合**：随着空间尺寸的减小，我们减少了模型具有的参数数量，从而降低了模型的复杂性并有助于我们更好地概括。\n* **位置不变性**：这使 CNN\
    \ 可以捕获图像中的特征，而不管特征在给定图像中的位置。 假设我们正在尝试建立一个分类器来检测芒果。 芒果位于图像的中心，左上角，右下角还是图像中的任何位置都没关系-需要对其进行检测。\
    \ 池化层可以帮助我们。\n\n池的类型很多，例如最大池，平均池，和池等。 但是，最大池化是最受欢迎的。 以与处理卷积层相同的方式，我们将定义一个窗口并在该窗口中应用所需的池化操作。\
    \ 我们将根据层的跨度水平和垂直地滑动窗口。\n\n## 操作步骤\n\n在此秘籍中，我们将研究如何在 PyTorch 中实现池化层：\n\n1. 首先，让我们进行导入：\n\
    \n```\n>>import torch\n>>import torch.nn as nn\n```\n\n2. 然后，我们使用 `nn` 模块中定义的池类，如下所示：\n\
    \n```\n>>max_pool = nn.MaxPool2d(3, stride=1)\n```\n\n3. 现在，让我们定义一个张量来执行池化：\n\n\
    ```\n>>a = torch.FloatTensor(3,5,5).random_(0, 10)\n>>a\n```\n\n这给我们以下输出：\n\n\
    ```\ntensor([[[2., 8., 6., 8., 3.],\n [6., 6., 7., 6., 6.],\n [2., 0., 8., 8.,\
    \ 8.],\n [2., 0., 3., 5., 7.],\n [9., 7., 8., 2., 1.]],\n\n [[1., 8., 6., 7.,\
    \ 3.],\n [0., 1., 2., 9., 4.],\n [1., 2., 5., 0., 1.],\n [8., 2., 8., 3., 1.],\n\
    \ [5., 4., 0., 5., 2.]],\n\n [[1., 6., 2., 6., 1.],\n [4., 0., 0., 6., 6.],\n\
    \ [4., 2., 2., 3., 2.],\n [1., 0., 1., 7., 1.],\n [8., 1., 0., 5., 4.]]])\n```\n\
    \n4. 现在，我们将池化应用于张量：\n\n```\n>>max_pool(a)\n```\n\n这给我们以下输出：\n\n```\n tensor([[[8.,\
    \ 8., 8.],\n [8., 8., 8.],\n [9., 8., 8.]],\n\n [[8., 9., 9.],\n [8., 9., 9.],\n\
    \ [8., 8., 8.]],\n\n [[6., 6., 6.],\n [4., 7., 7.],\n [8., 7., 7.]]])\n```\n\n\
    5. 现在，我们可以尝试以类似方式进行平均池化：\n\n```\n>>avg_pool = nn.AvgPool2d(3, stride=1)\n```\n\
    \n6. 然后，我们像以前一样应用平均池化：\n\n```\n>>avg_pool(a)\n```\n\n这给我们以下输出：\n\n```\n tensor([[[5.0000,\
    \ 6.3333, 6.6667],\n [3.7778, 4.7778, 6.4444],\n [4.3333, 4.5556, 5.5556]],\n\n\
    \ [[2.8889, 4.4444, 4.1111],\n [3.2222, 3.5556, 3.6667],\n [3.8889, 3.2222, 2.7778]],\n\
    \n [[2.3333, 3.0000, 3.1111],\n [1.5556, 2.3333, 3.1111],\n [2.1111, 2.3333, 2.7778]]])\n\
    ```\n\n通过此秘籍，我们了解了 PyTorch 中的池化操作。\n\n## 工作原理\n\n在前面的代码中，我们研究了一个张量的示例，以了解实际的池化层。\
    \ 我们使用大小为 `3 x 3` 的方形核。池的第一个应用发生在 `[0,0,0]` 到 `[0,3,3]` 的面片上。 由于步幅为 1，因此下一个要操作的音色为\
    \ `[0,0,1]` 至 `[0,3,4]`。 一旦碰到水平端，就对下面的张量进行运算。 `nn.MaxPool2d(3, stride=1)` 和 `nn.AvgPool2d(3,\
    \ stride=1)` 都创建了大小为 `3x3` 的最大和平均池方核，步幅为 `1`，将其应用于随机张量 `a`。\n\n## 更多\n\n在本秘籍中，我们研究了正方形核，但是我们可以选择使用非正方形核并大步前进，就像我们进行卷积一样。\
    \ 还有另一种流行的池化方法，称为全局平均池化，可以通过输入的维数通过平均池化来实现。 例如 `avg_pool2d(a, a.size()[2:]0)`。\n\
    \n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/nn.html#pooling-layers)\
    \ 上找到有关池和各种池的更多信息。\n\n# 探索转换\n\nPyTorch 无法直接处理图像像素，需要将其内容作为张量。 为了解决这个问题，`torchvision`\
    \ 是一个专门处理视觉和图像相关任务的库，提供了一个名为 `transform` 的模块，该模块提供了将像素转换为张量，标准化标准缩放等的 API。 在本秘籍中，我们将探索转换模块中的各种方法。\
    \ 因此，您需要安装 `torchvision` 才能阅读此秘籍。\n\n## 操作步骤\n\n在本节中，我们将探讨 `torchvision` 中的各种转换：\n\
    \n1. 我们将从导入 `torchvision` 开始：\n\n```\n>>from torchvision import transforms\n```\n\
    \n2. 让我们根据图像创建张量：\n\n```\n>>transforms.ToTensor()\n```\n\n3. 接下来，让我们标准化图像张量：\n\
    \n```\n>>transforms.Normalize((0.5,),(0.5,))\n```\n\n4. 要调整图像大小，我们将使用以下方法：\n\n\
    ```\n>>transforms.Resize(10)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Resize((10,10))\n\
    ```\n\n5. 然后，我们使用转换来裁剪图像：\n\n```\n>>transforms.CenterCrop(10)\n```\n\n我们还可以使用以下内容：\n\
    \n```\n>>transforms.CenterCrop((10, 10))\n```\n\n6. 我们可以使用转换来填充图像张量：\n\n```\n\
    >>transforms.Pad(1, 0)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Pad((1, 2), 1)\n\
    ```\n\n如果愿意，我们还可以执行以下操作：\n\n```\n>>transforms.Pad((1, 2, 2, 3), padding_mode='reflect')\n\
    ```\n\n7. 然后，我们链接多个转换：\n\n```\n>>transforms.Compose([\n     transforms.CenterCrop(10),\n\
    \     transforms.ToTensor(),\n  ])\n```\n\n在此秘籍中，我们了解了 `torchvision` 中使用的一些转换。\n\
    \n## 工作原理\n\n在前面的代码段中，我们研究了 `torchvision` 中可用的各种转换。 这些使我们可以获取输入图像并将其格式化为所需尺寸和属性的张量，然后将其输入到割炬模型中。\
    \ 我们研究的第一种方法是 `toTensor()` 方法，该方法将给定的输入图像转换为张量。 然后我们可以使用 `Normalize()` 方法对该输入图像张量进行归一化。\
    \ `Normalize()` 方法采用两个元组，其中第一个元组是输入图像中每个通道的均值序列，第二个元组是每个通道的标准差序列。\n\n此外，我们可以使用\
    \ `Resize()` 方法将给定图像的大小调整为所需尺寸，如果给定整数，则将其与较小边缘的长度匹配，如果给定元组，则将其与图像的高度和宽度匹配。 在某些情况下，有关图像的关键信息位于其中心，在这种情况下，可以裁剪并仅考虑给定图像的中心；\
    \ 为此，您可以使用 `CenterCrop()` 方法。 然后，我们传入一个整数以从中心裁剪一个正方形，或将与高度和宽度匹配的序列传递给 `CenterCrop()`。\n\
    \n另一个重要任务是填充图像以匹配特定尺寸。 为此，我们使用 `Pad()` 方法。 我们将填充大小作为整数表示，用于在所有面上进行均等大小的填充，或者将序列作为由两个元素组成的序列，用于填充大小分别对应于左/右和上/下。\
    \ 此外，我们可以将左侧，顶部，右侧和底部的填充大小作为由四个元素组成的序列传递。 然后，我们将填充值作为整数提供，如果它是三个元素的元组，则分别用作 R，G\
    \ 和 B 通道的填充值。 除此之外，`Pad()` 方法还具有 `padding_mode` 参数，该参数具有以下可能性：\n\n* `constant`：使用提供的填充值来填充\n\
    * `edge`：在图像边缘使用数值来填充\n* `reflect`：使用图像反射来填充，边缘像素除外\n* `symmetric`：使用图像反射来填充，包括边缘像素\n\
    \n最后，我们研究了 `Compose()` 转换，该转换通过将一系列转换对象作为参数传递来组合各种转换以构建转换管道。\n\n## 更多\n\n`transforms.functional`\
    \ 模块中有用于转换的函数式 API。 它们通过提供对转换的细粒度控制来帮助我们建立复杂的转换管道。\n\n还有其他有用的转换，例如灰度转换，它使用 `Grayscale()`\
    \ 作为输出通道数作为参数。 我们将在下一部分中探索更多的转换。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html#functional-transforms)\
    \ 上了解有关函数式转换的更多信息。\n\n# 执行数据扩充\n\n在本秘籍中，我们将学习有关使用火炬进行数据扩充的知识。 数据扩充是深度学习和计算机视觉中的一项重要技术。\
    \ 对于任何涉及深度学习或计算机视觉的模型，可用的数据量对于查看模型的表现至关重要。 数据扩充可防止模型记住有限数量的数据，而不是对观察到的数据进行概括。\
    \ 数据扩充通过从原始图像创建变量而不实际收集新数据来增加用于训练模型的数据的多样性。\n\n通常，光量，亮度，方向或颜色变化不会影响模型所做的推断。 但是，当模型在现实世界中部署时，输入数据可能会有这些变化。\
    \ 对于模型来说，知道其做出的决定必须相对于输入中的这些变化是不变的，这很有用，因此数据扩充可以提高模型的表现。 在本秘籍中，我们将使用 PyTorch 的\
    \ `transform` 模块执行数据扩充。\n\n## 操作步骤\n\n为了充分利用此秘籍，您应该完成“探索转换”秘籍，因为此秘籍是我们对转换工作的延续。\
    \ 在本秘籍中，我们将介绍一些我们可以使用 `torchvision` 中的 `transform` 模块执行的流行数据扩充：\n\n1. 我们将从导入 `torchvision`\
    \ 开始：\n\n```\n>>import torchvision\n```\n\n2. 然后，我们将随机裁剪图像的一部分：\n\n```\n>>transforms.RandomCrop(10)\n\
    ```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.RandomCrop((10,20))\n```\n\n3. 我们可以使用以下方法水平翻转图像：\n\
    \n```\n>>transforms.RandomHorizontalFlip(p=0.3)\n```\n\n4. 我们也可以垂直翻转它：\n\n```\n\
    >>transforms.RandomVerticalFlip(p=0.3)\n```\n\n5. 尝试添加亮度，对比度，饱和度和色调变化：\n\n```\n\
    >>transforms.ColorJitter(0.25, 0.25, 0.25, 0.25)\n```\n\n6. 接下来，让我们添加旋转变化：\n\n\
    ```\n>>transforms.RandomRotation(10)\n```\n\n7. 最后，我们将构成所有转换：\n\n```\n>>transforms.Compose([\n\
    \     transforms.RandomRotation(10),\n     transforms.ToTensor(),\n])\n```\n\n\
    在此秘籍中，我们在数据上创建了转换以从现有数据创建更多数据。\n\n## 工作原理\n\n在本秘籍中，我们了解了如何通过执行对手头问题有意义的某些转换来为数据添加变化。\
    \ 选择正确的数据扩充以模仿我们在现实生活中会遇到的图像变化时，我们必须小心。 例如，在构建汽车分类器时，有意义的是使用颜色和亮度的变化来增加数据，或者水平翻转汽车图像，等等。\
    \ 但是，除非我们要解决汽车上下颠倒的问题，否则使用垂直翻转的汽车图像来增强数据是没有意义的。\n\n在此秘籍中，我们尝试在随机位置裁剪图像，以便如果无法获得对象的整个图像，但无法获得一部分，则我们的模型将能够检测到该对象。\
    \ 我们应该将裁剪后的图像大小包括为整数或具有特定高度和宽度的元组。 然后，我们水平翻转图像，并随机传递了水平翻转和垂直翻转的概率。 然后，我们使用 `ColorJitter()`\
    \ 方法在图像的颜色，对比度，饱和度和色调上创建了变化。\n\n我们通过设置参数来控制每种颜色的变化量，其中颜色，对比度和饱和度在 `[max(0, 1-parameter),\
    \ 1 + parameter]` 值之间变化，而色相在 `[-hue, hue]` 之间，其中色调介于 0 到 0.5 之间。 我们还向图像添加了随机旋转，并提供了最大旋转角度。\
    \ 最后，选择正确的数据扩充策略后，将其添加到 `transforms.compose()` 中。\n\n## 更多\n\n我们还可以自定义定义图像数据所需的转换。\
    \ 为此，我们将使用 `transforms.Lambda()` 并将函数或 lambda 传递给所需的自定义转换。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html)\
    \ 了解有关仿射变换等其他变换的信息。\n\n# 加载图像数据\n"
  trans: "\n\n# 卷积\n\n1. 首先，我们将导入所需的割炬 `modules`：\n\n```\n>>import torch\n>>import\
    \ torch.nn as nn\n```\n\n2. 接下来，我们将 2D 卷积应用于图像：\n\n```\n>>nn.Conv2d(3, 16, 3)\n\
    ```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1, 1))\n```\n\
    \n3. 然后，我们在图像的边缘添加所需大小的填充：\n\n```\n>>nn.Conv2d(3, 16, 3, padding=1)\n```\n\n这将创建以下卷积层：\n\
    \n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n```\n\
    \n4. 然后，我们可以使用以下代码创建一个非平方核（过滤器）：\n\n```\n>>nn.Conv2d(3, 16, (3,4), padding=1)\n\
    ```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 4), stride=(1, 1), padding=(1,\
    \ 1))\n```\n\n5. 然后，我们可以使用以下代码将步幅添加到卷积中：\n\n```\n>>nn.Conv2d(3, 16, 3, stride=2)\n\
    ```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 3), stride=(2, 2))\n```\n\
    \n6. 我们在水平和垂直方向上的步幅和填充量可能不相等：\n\n```\n>>nn.Conv2d(3, 16, (3,4), stride=(3,3),\
    \ padding=(1,2))\n```\n\n这将创建以下卷积层：\n\n```\nConv2d(3, 16, kernel_size=(3, 4),\
    \ stride=(3, 3), padding=(1, 2))\n```\n\n通过此秘籍，我们学习了如何在 PyTorch 中使用卷积。\n\n## 工作原理\n\
    \n在本秘籍中，我们研究了创建 2D 卷积的多种方法，其中第一个参数是给定输入图像中的通道数，对于彩色图像，通道数将为 `3`，对于灰度图像将为 `1`。\
    \ 第二个参数是输出通道的数量，换句话说，就是我们要从给定层获得的过滤器的数量。 第三个参数是核大小（即核大小），或者是要使用过滤器卷积的图像的补丁大小。\n\
    \n然后，我们创建了一个 `Con2d` 对象，并将输入传递到 2D 卷积层以获取输出。 使用 `nn.Conv2d(3, 16, 3)`，我们创建了一个卷积层，该卷积层接受\
    \ 3 个通道的输入并输出 16 个通道。 该层的大小为 `3 x 3` 的正方形核，其高度和宽度的默认跨度为 1。 我们可以使用 `padding` 参数添加填充，该参数可以具有整数或元组值。\
    \ 在这里，整数值将为高度和宽度创建相同的填充，而元组值将为高度和宽度创建不同的填充-这对于核大小和跨度都是正确的。\n\n## 更多\n\n通过将 `padding`\
    \ 参数设置为 `0`（默认设置），可以有效填充。 您还可以通过更改 `padding_mode` 参数将零填充更改为圆形填充。 您可以使用 `bias`\
    \ 布尔参数（默认为 `True`）添加或删除偏差。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/nn.html#torch.nn.Conv2d)\
    \ 了解有关 PyTorch 卷积的其他参数。\n\n# 探索池化\n\n现在，我们进入 CNN 的下一个关键层-池化层。 到目前为止，我们一直在处理图像而不改变帧的空间尺寸（考虑相同的填充）；\
    \ 相反，我们一直在增加通道/过滤器的数量。 池化层用于减小输入的空间尺寸，并保留其深度。 当我们从 CNN 的初始层移到后面的层时，我们希望在图像中识别出比实际逐个像素信息更多的概念意义，因此我们想从输入和抛出中识别并保留剩下的关键信息。\
    \ 池化层可以帮助我们做到这一点。\n\n这是最大池化的示意图：\n\n![](img/fbfde3375f0c6201207b63257d5d7619.png)\n\
    \n这是使用池化层的主要原因：\n\n* **减少计算数量**：通过减少输入的空间尺寸而不会损失过滤器，我们可以获得更好的计算表现，因此我们减少了训练所需的时间以及计算资源。\n\
    * **防止过拟合**：随着空间尺寸的减小，我们减少了模型具有的参数数量，从而降低了模型的复杂性并有助于我们更好地概括。\n* **位置不变性**：这使 CNN\
    \ 可以捕获图像中的特征，而不管特征在给定图像中的位置。 假设我们正在尝试建立一个分类器来检测芒果。 芒果位于图像的中心，左上角，右下角还是图像中的任何位置都没关系-需要对其进行检测。\
    \ 池化层可以帮助我们。\n\n池的类型很多，例如最大池，平均池，和池等。 但是，最大池化是最受欢迎的。 以与处理卷积层相同的方式，我们将定义一个窗口并在该窗口中应用所需的池化操作。\
    \ 我们将根据层的跨度水平和垂直地滑动窗口。\n\n## 操作步骤\n\n在此秘籍中，我们将研究如何在 PyTorch 中实现池化层：\n\n1. 首先，让我们进行导入：\n\
    \n```\n>>import torch\n>>import torch.nn as nn\n```\n\n2. 然后，我们使用 `nn` 模块中定义的池类，如下所示：\n\
    \n```\n>>max_pool = nn.MaxPool2d(3, stride=1)\n```\n\n3. 现在，让我们定义一个张量来执行池化：\n\n\
    ```\n>>a = torch.FloatTensor(3,5,5).random_(0, 10)\n>>a\n```\n\n这给我们以下输出：\n\n\
    ```\ntensor([[[2., 8., 6., 8., 3.],\n [6., 6., 7., 6., 6.],\n [2., 0., 8., 8.,\
    \ 8.],\n [2., 0., 3., 5., 7.],\n [9., 7., 8., 2., 1.]],\n\n [[1., 8., 6., 7.,\
    \ 3.],\n [0., 1., 2., 9., 4.],\n [1., 2., 5., 0., 1.],\n [8., 2., 8., 3., 1.],\n\
    \ [5., 4., 0., 5., 2.]],\n\n [[1., 6., 2., 6., 1.],\n [4., 0., 0., 6., 6.],\n\
    \ [4., 2., 2., 3., 2.],\n [1., 0., 1., 7., 1.],\n [8., 1., 0., 5., 4.]]])\n```\n\
    \n4. 现在，我们将池化应用于张量：\n\n```\n>>max_pool(a)\n```\n\n这给我们以下输出：\n\n```\n tensor([[[8.,\
    \ 8., 8.],\n [8., 8., 8.],\n [9., 8., 8.]],\n\n [[8., 9., 9.],\n [8., 9., 9.],\n\
    \ [8., 8., 8.]],\n\n [[6., 6., 6.],\n [4., 7., 7.],\n [8., 7., 7.]]])\n```\n\n\
    5. 现在，我们可以尝试以类似方式进行平均池化：\n\n```\n>>avg_pool = nn.AvgPool2d(3, stride=1)\n```\n\
    \n6. 然后，我们像以前一样应用平均池化：\n\n```\n>>avg_pool(a)\n```\n\n这给我们以下输出：\n\n```\n tensor([[[5.0000,\
    \ 6.3333, 6.6667],\n [3.7778, 4.7778, 6.4444],\n [4.3333, 4.5556, 5.5556]],\n\n\
    \ [[2.8889, 4.4444, 4.1111],\n [3.2222, 3.5556, 3.6667],\n [3.8889, 3.2222, 2.7778]],\n\
    \n [[2.3333, 3.0000, 3.1111],\n [1.5556, 2.3333, 3.1111],\n [2.1111, 2.3333, 2.7778]]])\n\
    ```\n\n通过此秘籍，我们了解了 PyTorch 中的池化操作。\n\n## 工作原理\n\n在前面的代码中，我们研究了一个张量的示例，以了解实际的池化层。\
    \ 我们使用大小为 `3 x 3` 的方形核。池的第一个应用发生在 `[0,0,0]` 到 `[0,3,3]` 的面片上。 由于步幅为 1，因此下一个要操作的音色为\
    \ `[0,0,1]` 至 `[0,3,4]`。 一旦碰到水平端，就对下面的张量进行运算。 `nn.MaxPool2d(3, stride=1)` 和 `nn.AvgPool2d(3,\
    \ stride=1)` 都创建了大小为 `3x3` 的最大和平均池方核，步幅为 `1`，将其应用于随机张量 `a`。\n\n## 更多\n\n在本秘籍中，我们研究了正方形核，但是我们可以选择使用非正方形核并大步前进，就像我们进行卷积一样。\
    \ 还有另一种流行的池化方法，称为全局平均池化，可以通过输入的维数通过平均池化来实现。 例如 `avg_pool2d(a, a.size()[2:]0)`。\n\
    \n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/nn.html#pooling-layers)\
    \ 上找到有关池和各种池的更多信息。\n\n# 探索转换\n\nPyTorch 无法直接处理图像像素，需要将其内容作为张量。 为了解决这个问题，`torchvision`\
    \ 是一个专门处理视觉和图像相关任务的库，提供了一个名为 `transform` 的模块，该模块提供了将像素转换为张量，标准化标准缩放等的 API。 在本秘籍中，我们将探索转换模块中的各种方法。\
    \ 因此，您需要安装 `torchvision` 才能阅读此秘籍。\n\n## 操作步骤\n\n在本节中，我们将探讨 `torchvision` 中的各种转换：\n\
    \n1. 我们将从导入 `torchvision` 开始：\n\n```\n>>from torchvision import transforms\n```\n\
    \n2. 让我们根据图像创建张量：\n\n```\n>>transforms.ToTensor()\n```\n\n3. 接下来，让我们标准化图像张量：\n\
    \n```\n>>transforms.Normalize((0.5,),(0.5,))\n```\n\n4. 要调整图像大小，我们将使用以下方法：\n\n\
    ```\n>>transforms.Resize(10)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Resize((10,10))\n\
    ```\n\n5. 然后，我们使用转换来裁剪图像：\n\n```\n>>transforms.CenterCrop(10)\n```\n\n我们还可以使用以下内容：\n\
    \n```\n>>transforms.CenterCrop((10, 10))\n```\n\n6. 我们可以使用转换来填充图像张量：\n\n```\n\
    >>transforms.Pad(1, 0)\n```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.Pad((1, 2), 1)\n\
    ```\n\n如果愿意，我们还可以执行以下操作：\n\n```\n>>transforms.Pad((1, 2, 2, 3), padding_mode='reflect')\n\
    ```\n\n7. 然后，我们链接多个转换：\n\n```\n>>transforms.Compose([\n     transforms.CenterCrop(10),\n\
    \     transforms.ToTensor(),\n  ])\n```\n\n在此秘籍中，我们了解了 `torchvision` 中使用的一些转换。\n\
    \n## 工作原理\n\n在前面的代码段中，我们研究了 `torchvision` 中可用的各种转换。 这些使我们可以获取输入图像并将其格式化为所需尺寸和属性的张量，然后将其输入到割炬模型中。\
    \ 我们研究的第一种方法是 `toTensor()` 方法，该方法将给定的输入图像转换为张量。 然后我们可以使用 `Normalize()` 方法对该输入图像张量进行归一化。\
    \ `Normalize()` 方法采用两个元组，其中第一个元组是输入图像中每个通道的均值序列，第二个元组是每个通道的标准差序列。\n\n此外，我们可以使用\
    \ `Resize()` 方法将给定图像的大小调整为所需尺寸，如果给定整数，则将其与较小边缘的长度匹配，如果给定元组，则将其与图像的高度和宽度匹配。 在某些情况下，有关图像的关键信息位于其中心，在这种情况下，可以裁剪并仅考虑给定图像的中心；\
    \ 为此，您可以使用 `CenterCrop()` 方法。 然后，我们传入一个整数以从中心裁剪一个正方形，或将与高度和宽度匹配的序列传递给 `CenterCrop()`。\n\
    \n另一个重要任务是填充图像以匹配特定尺寸。 为此，我们使用 `Pad()` 方法。 我们将填充大小作为整数表示，用于在所有面上进行均等大小的填充，或者将序列作为由两个元素组成的序列，用于填充大小分别对应于左/右和上/下。\
    \ 此外，我们可以将左侧，顶部，右侧和底部的填充大小作为由四个元素组成的序列传递。 然后，我们将填充值作为整数提供，如果它是三个元素的元组，则分别用作 R，G\
    \ 和 B 通道的填充值。 除此之外，`Pad()` 方法还具有 `padding_mode` 参数，该参数具有以下可能性：\n\n* `constant`：使用提供的填充值来填充\n\
    * `edge`：在图像边缘使用数值来填充\n* `reflect`：使用图像反射来填充，边缘像素除外\n* `symmetric`：使用图像反射来填充，包括边缘像素\n\
    \n最后，我们研究了 `Compose()` 转换，该转换通过将一系列转换对象作为参数传递来组合各种转换以构建转换管道。\n\n## 更多\n\n`transforms.functional`\
    \ 模块中有用于转换的函数式 API。 它们通过提供对转换的细粒度控制来帮助我们建立复杂的转换管道。\n\n还有其他有用的转换，例如灰度转换，它使用 `Grayscale()`\
    \ 作为输出通道数作为参数。 我们将在下一部分中探索更多的转换。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html#functional-transforms)\
    \ 上了解有关函数式转换的更多信息。\n\n# 执行数据扩充\n\n在本秘籍中，我们将学习有关使用火炬进行数据扩充的知识。 数据扩充是深度学习和计算机视觉中的一项重要技术。\
    \ 对于任何涉及深度学习或计算机视觉的模型，可用的数据量对于查看模型的表现至关重要。 数据扩充可防止模型记住有限数量的数据，而不是对观察到的数据进行概括。\
    \ 数据扩充通过从原始图像创建变量而不实际收集新数据来增加用于训练模型的数据的多样性。\n\n通常，光量，亮度，方向或颜色变化不会影响模型所做的推断。 但是，当模型在现实世界中部署时，输入数据可能会有这些变化。\
    \ 对于模型来说，知道其做出的决定必须相对于输入中的这些变化是不变的，这很有用，因此数据扩充可以提高模型的表现。 在本秘籍中，我们将使用 PyTorch 的\
    \ `transform` 模块执行数据扩充。\n\n## 操作步骤\n\n为了充分利用此秘籍，您应该完成“探索转换”秘籍，因为此秘籍是我们对转换工作的延续。\
    \ 在本秘籍中，我们将介绍一些我们可以使用 `torchvision` 中的 `transform` 模块执行的流行数据扩充：\n\n1. 我们将从导入 `torchvision`\
    \ 开始：\n\n```\n>>import torchvision\n```\n\n2. 然后，我们将随机裁剪图像的一部分：\n\n```\n>>transforms.RandomCrop(10)\n\
    ```\n\n我们还可以使用以下内容：\n\n```\n>>transforms.RandomCrop((10,20))\n```\n\n3. 我们可以使用以下方法水平翻转图像：\n\
    \n```\n>>transforms.RandomHorizontalFlip(p=0.3)\n```\n\n4. 我们也可以垂直翻转它：\n\n```\n\
    >>transforms.RandomVerticalFlip(p=0.3)\n```\n\n5. 尝试添加亮度，对比度，饱和度和色调变化：\n\n```\n\
    >>transforms.ColorJitter(0.25, 0.25, 0.25, 0.25)\n```\n\n6. 接下来，让我们添加旋转变化：\n\n\
    ```\n>>transforms.RandomRotation(10)\n```\n\n7. 最后，我们将构成所有转换：\n\n```\n>>transforms.Compose([\n\
    \     transforms.RandomRotation(10),\n     transforms.ToTensor(),\n])\n```\n\n\
    在此秘籍中，我们在数据上创建了转换以从现有数据创建更多数据。\n\n## 工作原理\n\n在本秘籍中，我们了解了如何通过执行对手头问题有意义的某些转换来为数据添加变化。\
    \ 选择正确的数据扩充以模仿我们在现实生活中会遇到的图像变化时，我们必须小心。 例如，在构建汽车分类器时，有意义的是使用颜色和亮度的变化来增加数据，或者水平翻转汽车图像，等等。\
    \ 但是，除非我们要解决汽车上下颠倒的问题，否则使用垂直翻转的汽车图像来增强数据是没有意义的。\n\n在此秘籍中，我们尝试在随机位置裁剪图像，以便如果无法获得对象的整个图像，但无法获得一部分，则我们的模型将能够检测到该对象。\
    \ 我们应该将裁剪后的图像大小包括为整数或具有特定高度和宽度的元组。 然后，我们水平翻转图像，并随机传递了水平翻转和垂直翻转的概率。 然后，我们使用 `ColorJitter()`\
    \ 方法在图像的颜色，对比度，饱和度和色调上创建了变化。\n\n我们通过设置参数来控制每种颜色的变化量，其中颜色，对比度和饱和度在 `[max(0, 1-parameter),\
    \ 1 + parameter]` 值之间变化，而色相在 `[-hue, hue]` 之间，其中色调介于 0 到 0.5 之间。 我们还向图像添加了随机旋转，并提供了最大旋转角度。\
    \ 最后，选择正确的数据扩充策略后，将其添加到 `transforms.compose()` 中。\n\n## 更多\n\n我们还可以自定义定义图像数据所需的转换。\
    \ 为此，我们将使用 `transforms.Lambda()` 并将函数或 lambda 传递给所需的自定义转换。\n\n## 另见\n\n您可以在 [这个页面](https://pytorch.org/docs/stable/torchvision/transforms.html)\
    \ 了解有关仿射变换等其他变换的信息。\n\n# 加载图像数据\n"
