    \ TensorBoard 中，该方法将输入图像名称，图像和计数器。\n\n然后，我们定义了`test()`方法，该方法在模型的验证数据集上运行验证，并使用`add_scalar()`方法记录测试损失和准确率，就像在训练函数中一样。\
