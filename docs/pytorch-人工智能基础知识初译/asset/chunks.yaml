    \ 如您所见，在`numpy`数组和 PyTorch 张量之间建立桥梁非常重要。\n\n# 操作步骤\n\n让我们从导入`numpy`开始：\n\n1. \
    \ 我们将从创建一个`numpy`数组开始； 为此，让我们导入`numpy`：\n\n```\nimport numpy as np\n```\n\n2.我们将创建一个仅由`ones`组成的`numpy`数组：\n\
