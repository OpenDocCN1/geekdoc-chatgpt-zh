    \ 中联系群主/管理员即可.\n\n## 赞助我们\n\n![](Images/c04105d5373abbf49dcb4bcc0ab7179d.png)\n\
    \n# 零、前言\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/0.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/0.md)\
    \ \n\n**人工智能**（**AI**）继续流行并破坏了广泛的领域，但这是一个复杂而艰巨的话题。 在本书中，您将掌握构建深度学习应用的方法，以及如何使用\
    \ PyTorch 进行研究和解决实际问题。\n\n本书从张量处理的基础开始，采用基于秘籍的方法，然后介绍了**卷积神经网络**（**CNN**）和 PyTorch\
    \ 中的**循环神经网络**（**RNN**）。 熟悉这些基本网络后，您将使用深度学习来构建医学图像分类器。 接下来，您将使用 TensorBoard 进行可视化。\
    \ 您还将深入研究**生成对抗网络**（**GAN**）和**深度强化学习**（**DRL**），然后最终将模型大规模部署到生产中。 您将发现针对机器学习，深度学习和强化学习中常见问题的解决方案。\
    \ 您将学习如何在计算机视觉，**自然语言处理**（**NLP**）中实现 AI 任务并解决实际问题。 其他实际领域。\n\n到本书结尾，您将拥有使用 PyTorch\
    \ 框架的 AI 中最重要且应用最广泛的技术的基础。\n\n# 这本书是给谁的\n\n这本 PyTorch 书籍适用于刚刚起步的 AI 工程师以及正在寻找指南以帮助他们有效解决\
    \ AI 问题的机器学习工程师，数据科学家和深度学习爱好者。 期望具备 Python 编程语言的工作知识和对机器学习的基本了解。\n\n# 本书涵盖的内容\n\
    \n第 1 章，“使用 PyTorch 处理张量”介绍 PyTorch 及其安装，然后继续使用 PyTorch 处理张量。\n\n第 2 章，“处理神经网络”全面介绍了开始和训练全连接神经网络的所有要求，从而对基本神经网络的所有组件进行了详尽的解释。\
    \ ：层，前馈网络，反向传播，损失函数，梯度，权重更新以及使用 CPU/GPU。\n\n第 3 章，“用于计算机视觉的卷积神经网络”首先介绍了用于更高级任务的一类神经网络，即卷积神经网络。\
    \ 在这里，我们将与 PyTorch 一起探索 TorchVision，训练 CNN 模型，并使用 TensorBoard 可视化其进度。 我们还将介绍与卷积网络构建块相关的各种任务。\
    \ 卷积神经网络（CNN 或 ConvNet）是一类 DNN，最常用于分析图像。\n\n第 4 章，“用于 NLP 的循环神经网络”探索循环神经网络，并研究\
    \ RNN 中的各种修改以及最佳实践。\n\n第 5 章，“迁移学习和 TensorBoard”显示了如何使用经过训练的 ResNet-50 模型训练图像分类器以区分正常和肺炎的胸部\
    \ X 射线。 我们将替换分类器，并使用两个输出单元来代表正常和肺炎类别。\n\n第 6 章，“探索生成对抗网络”探索生成对抗网络，以及如何实现 PyTorch\
    \ 的组件并训练端到端网络。 我们将探索 DCGAN，并通过渐进式 GAN 网络进一步改善 DCGAN 的局限性。\n\n第 7 章，“深度强化学习”可帮助您通过各种秘籍来了解深度\
    \ RL。 本章是一系列秘籍和任务，您将在其中利用所需的能力和架构来转变为深度强化学习专家。\n\n第 8 章，“PyTorch 中的生产 AI 模型”，着眼于以两种方式生产\
    \ PyTorch 应用。 首先，生成已经训练过的模型，其次，对大型数据集进行分布式训练。 最后，我们将研究各种框架之间的可移植性。\n\n# 充分利用这本书\n\
    \n需要具备 Python 的工作知识。\n\n# 下载示例代码文件\n\n您可以从 [www.packt.com](http://www.packt.com)\
    \ 的帐户中下载本书的示例代码文件。 如果您在其他地方购买了此书，则可以访问 [www.packtpub.com/support](https://www.packtpub.com/support)\
    \ 并注册以将文件直接通过电子邮件发送给您。\n\n您可以按照以下步骤下载代码文件：\n\n1.  登录或注册 [www.packt.com](http://www.packt.com)\
    \ 。\n\n2.  选择支持选项卡。\n\n3.  单击代码下载。\n\n4.  在搜索框中输入书籍的名称，然后按照屏幕上的说明进行操作。\n\n下载文件后，请确保使用以下最新版本解压缩或解压缩文件夹：\n\
    \n*   Windows 的 WinRAR/7-Zip\n\n*   Mac 版 Zipeg/iZip/UnRarX\n\n*   适用于 Linux 的\
    \ 7-Zip/PeaZip\n\n本书的代码包也托管在 [GitHub](https://github.com/PacktPublishing/PyTorch-Artificial-Intelligence-Fundamentals)\
    \ 上。 如果代码有更新，它将在现有的 GitHub 存储库中进行更新。\n\n我们还从[这里](https://github.com/PacktPublishing/)提供了丰富的书籍和视频目录中的其他代码包。\
    \ 去看一下！\n\n# 下载彩色图像\n\n我们还提供了 PDF 文件，其中包含本书中使用的屏幕截图/图表的彩色图像。 [您可以在此处下载](http://www.packtpub.com/sites/default/files/downloads/9781838557041_ColorImages.pdf)。\n\
    \n# 使用约定\n\n本书中使用了许多文本约定。\n\n`CodeInText`：指示文本，数据库表名称，文件夹名称，文件名，文件扩展名，路径名，虚拟 URL，用户输入和\
    \ Twitter 句柄中的代码字。 这是一个示例：“对于 Linux，我们将使用以下`pip`管理器。”\n\n代码块设置如下：\n\n```\na =\
    \ np.ones((2, 3))\na\n```\n\n当我们希望引起您对代码块特定部分的注意时，相关行或项目以粗体显示：\n\n```\nb.shape\n\
    torch.Size([2, 3])\n```\n\n任何命令行输入或输出的编写方式如下：\n\n```\npip3 install https://download.pytorch.org/whl/cu90/torch-1.1.0-cp36-cp36m-win_amd64.whl\n\
    ```\n\n**粗体**：表示新术语，重要单词或您在屏幕上看到的单词。 例如，菜单或对话框中的单词会出现在这样的文本中。 这是一个示例：“**标量**是单个独立值。”\n\
    \n警告或重要提示如下所示。\n\n提示和技巧如下所示。\n\n# 栏目\n\n在本书中，您会发现几个经常出现的标题（“准备工作”，“操作步骤”，“工作原理”，“另见”。\n\
    \n要给出有关如何完成秘籍的明确说明，请按以下说明使用这些部分：\n\n# 准备\n\n本节告诉您在秘籍中会有什么期望，并介绍如何设置秘籍所需的任何软件或任何初步设置。\n\
    \n# 操作步骤\n\n本节包含遵循秘籍所需的步骤。\n\n## 工作原理\n\n本节通常包括对上一节中发生的情况的详细说明。\n\n# 更多\n\n本节包含有关秘籍的其他信息，以使您对秘籍有更多的了解。\n\
    \n# 另见\n\n本节提供了指向该秘籍其他有用信息的有用链接。\n\n# 一、使用 PyTorch 使用张量\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/1.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/1.md)\
    \ \n\n深度学习是机器学习父领域中的一个子领域，它是受大脑工作启发的一类算法的研究和应用。 给定足够的数据并通过它进行迭代，这些算法可以近似于描述数据的任何函数，并且正确地称为通用函数近似器。\
    \ 那么 PyTorch 进入这个生态系统的位置是什么？\n\nPyTorch 是 Python 中的一个开源深度学习框架，它使我们能够从研究问题开始，提出原型解决方案，并在开发此解决方案的过程中一直进行到创建分布式计算集群为止。\
    \ 它使您从研究到生产都可以覆盖。 PyTorch 改编自 Torch，后者是一个科学计算框架，广泛支持机器学习算法，使用 Lua 编写，可为您提供强大的功能（使用\
    \ GPU）。 那为什么要用 PyTorch？\n\nPyTorch 与 Python 深度集成，具有命令式风格，使用类似 Python 的语法，并且在 Eager\
    \ 模式下易于使用且灵活。 它的学习曲线很浅，可以让您专注于功能而不是框架的样板和语法。 Python 命令的纯命令执行将失去很多优化机会，因此，随着**即时**（**JIT**）编译器的引入，PyTorch\
    \ 允许过渡到 C++ 运行时的图环境中用于速度，功能和优化的模式。 它得到了来自不同领域的专业人员的大力社区支持，并且与库打交道。 它具有与框架互操作性的本地**开放神经网络交换**（**ONNX**）支持。\
    \ 它是分布式的，可扩展到生产环境，与 TensorBoard 集成，并具有出色的文档和 API，您可以轻松编写针对 CPU 和 GPU 的自定义扩展。 我们将在接下来的章节中探索这些以及更多内容。\n\
    \n在本章中，我们将介绍以下秘籍：\n\n*   安装 PyTorch\n\n*   在 PyTorch 中创建张量\n\n*   互操作的 NumPy 桥接\n\
    \n*   梯度和无梯度\n\n*   在 PyTorch 中查看张量\n\n# 技术要求\n\n要完成本章，您需要安装 Python3。 您还将需要任何现代机器，但本章不需要使用支持\
    \ GPU 的设备。 如果要利用 GPU 功能，可以使用支持 NVIDIA CUDA 的 GPU。\n\n# 安装 PyTorch\n\n我们将在本节中安装\
    \ PyTorch。\n\nNumPy 是本章必不可少的库，在您安装 PyTorch 时，NumPy 会自动为您安装它的依赖项。 这意味着我们无需显式安装\
    \ NumPy。\n\n您可以将 PyTorch 与其他包管理器一起安装，例如 Conda，如[这个页面](https://pytorch.org/)中所述。\n\
    \n要为 Python3 CPU 安装 PyTorch，我们可以使用以下命令：\n\n*   对于 Linux，我们将使用以下`pip`管理器：\n\n```\n\
    pip3 install torch==1.4.0+cpu -f https://download.pytorch.org/whl/torch_stable.html\n\
    ```\n\n*   对于 Windows，我们将使用以下`pip`管理器：\n\n```\npip3 install torch==1.4.0+cpu -f\
    \ https://download.pytorch.org/whl/torch_stable.html\n```\n\n*   对于 MacOS，我们将使用以下`pip`管理器：\n\
    \n```\npip3 install torch\n```\n\n要为启用 Python3 CUDA 的 GPU 版本安装 PyTorch，可以使用以下命令：\n\
    \n*   对于 Linux，我们将使用以下`pip`管理器：\n\n```\npip3 install torch\n```\n\n*   对于 Windows，我们将使用以下`pip`管理器：\n\
    \n```\npip3 install https://download.pytorch.org/whl/cu90/torch-1.1.0-cp36-cp36m-win_amd64.whl\n\
    ```\n\nMacOS 二进制不支持 CUDA，因此如果需要 CUDA，则应从源代码安装它。 您也可以使用其他包管理器进行安装，甚至可以从源代码进行构建。\
    \ 有关其他包管理器和 Python 版本，请访问[这个页面](https://pytorch.org/)。\n\n您可以通过转到 Python 终端并键入以下命令来快速验证安装是否正常：\n\
    \n```\nimport torch\nimport numpy\n```\n\n如果这些导入效果很好，那就很好了！\n\n# 在 PyTorch 中创建张量\n\
    \n首先让我们了解张量是什么。 **标量**是单个独立值，一维值数组称为**向量**，二维值数组称为**矩阵**，并且任何大于 2D 的值简称为**张量**。\
    \ 张量是一个广义的术语，包含标量，向量和矩阵。\n\n标量是 0 阶张量，向量是 1 阶张量，矩阵是 2 阶张量。\n\n以下是各种张量：\n\n*  \
    \ **标量**：这是一个零阶张量。 标量的示例是`x[1]`。\n\n*   **向量**：这是一阶张量； 以下是向量的示例：\n\n![](Images/e98475cd9b7c3a10d819b1b3b449d13d.png)\n\
    \n*   **矩阵**：这是一个二阶张量。 以下是矩阵的示例：\n\n![](Images/bf80ff2b4d6b883c9db6954c509c09c0.png)\n\
    \n*   **张量**：这些高于二阶张量，如以下示例所示：\n\n![](Images/b588f5ab9d32a54238739fd0456ed12c.png)\n\
    \n这样，我们将继续介绍如何使用张量的秘籍。\n\n# 操作步骤\n\n在 PyTorch 中有多种创建张量的方法。 我们将在本节中介绍其中一些：\n\n\
    *   我们可以创建一个具有所有张量的张量，如下所示：\n\n1.  让我们从导入库开始：\n\n```\nimport torch\n```\n\n2.\
    \  我们将使用`ones()`方法：\n\n```\ntorch.ones((2,3))\n```\n\n这将返回一个张量，该张量包含一个张量，并且具有默认的`float`数据类型，如下所示：\n\
    \n```\ntensor([[1., 1., 1.],\n [1., 1., 1.]])\n```\n\n*   现在，我们将创建一个仅由整数组成的张量：\n\
    \n1.  我们将执行与上一秘籍完全相同的操作，但是将添加数据类型（`dtype`）作为参数：\n\n```\ntorch.ones((2,3), dtype=torch.int8)\n\
    ```\n\n2.  这将返回仅由整数组成的张量：\n\n```\ntensor([[1, 1, 1],\n [1, 1, 1]], dtype=torch.int8)\n\
    ```\n\n*   接下来，我们将创建一个仅由整数零组成的张量：\n\n1.  我们将执行与之前完全相同的操作，但是使用`zeros()`方法：\n\n\
    ```\ntorch.zeros((2,3), dtype=torch.int8)\n```\n\n2.  这将返回仅由整数零组成的张量：\n\n```\n\
    tensor([[0, 0, 0],\n [0, 0, 0]], dtype=torch.int8)\n```\n\n*   现在，我们将创建一个填充有特定值的张量：\n\
    \n1.  我们将使用`full()`方法并传递所需的填充值以及形状：\n\n```\ntorch.full((2, 3), 3.141592)\n```\n\
    \n2.  这将返回具有给定值的张量：\n\n```\ntensor([[3.1416, 3.1416, 3.1416],\n [3.1416, 3.1416,\
    \ 3.1416]])\n```\n\n请注意，这些值是四舍五入的。\n\n*   现在，我们将创建一个空张量：\n\n1.  我们将为此使用`empty()`方法：\n\
    \n```\ntorch.empty((2,3))\n```\n\n2.  这将返回一个填充有未初始化数据的张量，该张量每次都随每台机器而变化：\n\n```\n\
    tensor([[2.5620e-01, 4.5773e-41, 2.5620e-01],\n [4.5773e-41, 4.4842e-44, 0.0000e+00]])\n\
    ```\n\n*   接下来，我们将根据均匀分布创建张量：\n\n1.  我们将使用`rand()`方法：\n\n```\ntorch.rand((2,3))\n\
    ```"
