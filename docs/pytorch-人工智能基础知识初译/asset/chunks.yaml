- raw: "在此秘籍中，我们用对数 softmax 替换了 softmax，以便随后可以使用概率对数而不是概率的对数，这具有很好的理论解释。 这样做有多种原因，包括改进的数值表现和梯度优化。\
    \ 在训练可能具有计算挑战性和昂贵成本的模型时，这些优势非常重要。 此外，当它没有预测正确的类别时，它具有很高的惩罚作用。\n\n因此，在处理对数 softmax\
    \ 时，我们会使用负对数似然率，因为 softmax 不兼容。 在`n`类数之间的分类中很有用。 该对数将确保我们不会处理 0 到 1 之间的非常小的值，而负值将确保小于\
    \ 1 的概率的对数非零。 我们的目标是减少这种负的对数损失误差函数。 在 PyTorch 中，损失函数称为**标准**，因此我们将损失函数命名为`criterion`。\n\
    \n# 更多\n\n我们可以提供一个可选参数`weight`，它必须是一维张量，该张量为每个输出类分配权重以处理不平衡的训练集。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/master/nn.html#loss-functions)上查看更多损失函数的官方文档。\n\
    \n# 实现优化器\n\n在本秘籍中，我们将学习优化器。 在先前的秘籍“定义损失函数”中，我们谈到了误差和误差函数，并了解到，为了获得一个好的模型，我们需要最小化计算出的误差。\
    \ **反向传播**是神经网络从误差中学习的一种方法。 误差用于修改权重，以使误差最小化。 优化函数负责修改权重以减少误差。 优化函数计算相对于权重的误差的偏导数。\
    \ 导数显示正斜率的方向，因此我们需要反转梯度的方向。 **优化器**函数将模型参数和损失函数结合在一起，以迭代方式修改模型参数以减少模型误差。 可以考虑将优化器摆在模型权重的基础上，根据模型与实际输出的预测差异来获得最佳模型，而损失函数则通过指示优化器是对还是错来充当指导。\n\
    \n学习率是优化器的超参数，它控制权重的更新量。 学习速度确保了权重不会大量更新，从而使算法根本无法收敛，并且误差越来越大。 然而，与此同时，权重的更新不应太低，以至于永远需要花费成本函数/误差函数的最小值。\n\
    \n下面显示了学习率的影响：\n\n![](Images/6d9e8b77f6bef2f8461ef582f908d41c.png)\n\n在本秘籍中，我们将学习如何在\
    \ PyTorch 中使用优化器函数，以及一些常见的优化函数以及如何处理学习率。\n\n# 操作步骤\n\n在本节中，我们从上一节中保留代码的位置开始，在定义条件的那一点：\n\
    \n1.我们将从导入`optim`模块开始：\n\n```\n>>from torch import optim\n```\n\n2.接下来，我们将创建一个`optimizer`对象。\
    \ 我们将使用`Adam`优化器并传递模型参数：\n\n```\n>>optimizer = optim.Adam(model.parameters())\n\
    ```\n\n3.要检查优化器的默认设置，可以执行以下操作：\n\n```\n>>optimizer.defaults\n>>{'lr': 0.001,\n\
    \ 'betas': (0.9, 0.999),\n 'eps': 1e-08,\n 'weight_decay': 0,\n 'amsgrad': False}\n\
    ```\n\n4.您还可以将学习率添加为附加参数：\n\n```\n>>optimizer = optim.Adam(model.parameters(),\
    \ lr=3e-3)\n```\n\n5.现在，我们将开始训练我们的模型，从周期数开始：\n\n```\n>>epoch = 10\n```\n\n6.然后，我们将开始循环：\n\
    \n```\n>>for _ in range(epoch):\n```\n\n7.我们将`running_loss`初始化为`0`：\n\n```\n>>running_loss\
    \ = 0\n```\n\n8.我们将在训练图像加载器中遍历每个图像，这在本章前面的秘籍“定义神经网络类”中定义：\n\n```\n>>for image,\
    \ label in trainloader:\n```\n\n9.然后，我们将梯度重置为零：\n\n```\n>>optimizer.zero_grad()\n\
    ```\n\n10.接下来，我们将重塑图像：\n\n```\n>>image = image.view(image.shape[0],-1)\n```\n\n\
    11.然后，我们从模型中获得预测：\n\n```\n>>pred = model(image)\n```\n\n12.然后我们计算损失/误差：\n\n```\n\
    >>loss = criterion(pred, label)\n```\n\n13.然后，对损失调用`.backward()`方法：\n\n```\n>>loss.backward()\n\
    ```\n\n14.然后，在优化器上调用`.step()`方法：\n\n```\n>>optimizer.step()\n```\n\n15.然后附加运行损失：\n\
    \n```\n>>running_loss += loss.item()\n```\n\n16.最后，我们将在每个周期之后打印损失：\n\n```\n>>else:\n\
    \    >>print(f'Training loss: {running_loss/len(trainloader):.4f}')\n```\n\n以下是示例输出：\n\
    \n```\nTraining loss: 0.4978\nTraining loss: 0.3851\nTraining loss: 0.3498\nTraining\
    \ loss: 0.3278\nTraining loss: 0.3098\nTraining loss: 0.2980\nTraining loss: 0.2871\n\
    Training loss: 0.2798\nTraining loss: 0.2717\nTraining loss: 0.2596\n```\n\n现在我们已经完成了训练。\n\
    \n# 工作原理\n\n在本秘籍中，我们首先使用`Adam`优化器定义优化器，然后为优化器设置学习率，并查看默认参数。 我们设置一个周期`10`，并为每个周期开始迭代，在每次迭代中将`running_loss`设置为\
    \ 0，并在该周期内对每个图像进行迭代（模型看到数据集的次数）。 我们首先使用`.zero_grad()`方法清除梯度。 PyTorch 在每次反向传播时都会累积梯度，这在某些情况下很有用，因此将其导入以将梯度归零，以正确更新模型参数。\n\
    \n接下来，我们通过将每批 64 幅图像（每幅图像由`28 x 28`像素组成）展平到 784 来重塑图像，从而将张量形状从`64 x 28 x 28`更改为`64\
    \ x 784`，因为我们的模型期望这种输入形状。 接下来，我们将此输入发送到模型，并从模型中获得该批量的输出预测，然后将其传递给损失函数，也称为`criterion`；\
    \ 在那里，它评估了预测类与实际类之间的差异。\n\n`loss.backward()`函数计算了梯度（即，误差相对于权重的偏导数），我们调用了`optimizer.step()`函数来更新模型的权重，以适应评估的误差。\
    \ `.item()`方法从单个元素张量中拉出标量，因此使用`loss.item()`从批量中获得`error`的标量值，将其累加到所有批量的损失中，最后在周期末尾打印损失。\n\
    \n# 更多\n\n我们可以使用称为`closure`的回调函数作为`.step(closure)`的参数来计算损失并通过传入函数作为参数来更新权重。 您还可以探索\
    \ PyTorch 提供的其他优化器函数，例如 Adadelta，Adagrad，SGD 等。\n\n# 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/optim.html#torch.optim.Optimizer)上了解有关优化程序的更多信息。\n\
    \n# 实现丢弃\n\n在本秘籍中，我们将研究实现丢弃。 在训练神经网络模型或一般任何机器学习模型时，我们可能会遇到的一种较常见的现象是过拟合。 当模型学习提供给训练的数据而不是在求解空间上进行泛化时，就会发生过拟合，也就是说，模型学习的是训练数据的细微细节和噪声，而不是掌握全局，因此在效果上表现不佳。\
    \ 新数据。 正则化是防止模型过拟合的过程。\n\n使用丢弃是神经网络中最流行的正则化技术之一，在这种技术中，训练时会关闭随机选择的神经元，也就是说，神经元的作用会暂时从正向传播中移除，而反向传播不会影响权重\
    \ ，因此没有一个神经元或神经元子集能获得模型的所有决定力； 相反，所有神经元都被迫为预测做出积极贡献。\n\n丢弃可以直观地理解为创建大量集成模型，学习在一个模型的大定义下捕获各种特征。\n\
    \n在本秘籍中，我们将研究如何在模型定义中添加缺失，以通过防止过拟合来改善整体模型表现。 应当记住，丢弃仅在训练时才适用； 但是，在测试和实际预测期间，我们希望所有神经元都做出贡献。\n\
    \n# 操作步骤\n\n在本节中，我们将学习如何为我们的初始模型类`FashionNetwork`添加丢弃：\n\n1.我们将从初始模型定义开始：\n\n\
    ```\n>>class FashionNetwork(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.hidden1 = nn.Linear(784, 256)\n        self.hidden2 = nn.Linear(256,\
    \ 128)\n        self.output = nn.Linear(128, 10)\n        self.log_softmax = nn.LogSoftmax()\n\
    \        self.activation = nn.ReLU()\n    def forward(self, x):\n        x = self.hidden1(x)\n\
    \        x = self.activation(x)\n        x = self.hidden2(x)\n        x = self.activation(x)\n\
    \        x = self.output(x)\n        output = self.log_softmax(x)\n        return\
    \ output\n```\n\n2.然后，我们将为模型`__init__`添加一个丢弃：\n\n```\n>>self.drop = nn.Dropout(p=0.25)\n\
    ```\n\n我们更新的`__init__()`如下所示：\n\n```\n>>def __init__(self):\n        super().__init__()\n\
    \        self.hidden1 = nn.Linear(784, 256)\n        self.hidden2 = nn.Linear(256,\
    \ 128)\n        self.output = nn.Linear(128, 10)\n        self.log_softmax = nn.LogSoftmax()\n\
    \        self.activation = nn.ReLU()\n        self.drop = nn.Dropout(p=0.25)\n\
    ```\n\n3.现在，我们将在`forward()`方法中添加丢弃：\n\n```\n>>def forward(self, x):\n        x\
    \ = self.hidden1(x)\n        x = self.activation(x)\n        x = self.drop(x)\n\
    \        x = self.hidden2(x)\n        x = self.activation(x)\n        x = self.drop(x)\n\
    \        x = self.output(x)\n        output = self.log_softmax(x)\n        return\
    \ output\n```\n\n现在，我们有了一个带有丢弃的网络。\n\n# 工作原理\n\n在此秘籍中，我们更改了`__init__()`方法，以 0.25\
    \ 的丢弃率添加了该丢弃层，这意味着将应用该丢弃层中 25% 的神经元将被随机关闭。 然后，我们编辑`forward`函数，将其应用于其中具有 256 个单元的第一个隐藏层，然后对第二个层（具有\
    \ 128 个单元）应用该滤除。 在完成激活函数之后，我们在两个层中都应用了激活。 我们必须牢记，必须仅在隐藏层上应用丢弃，以防止我们丢失输入数据和丢失输出。\n\
    \n# 更多\n\n我们可以通过调用`model.eval()`禁用退出，并使用`model.train().`启用退出\n\n# 另见\n\n您可以在[这个页面](https://arxiv.org/abs/1207.0580)上了解有关丢弃的更多信息。\n\
    \n# 实现函数式 API\n\n在本秘籍中，我们将探索 PyTorch 中的函数式 API。 这样做将使我们能够编写更简洁的网络架构和组件。 我们将研究函数式\
    \ API，并使用函数式 API 定义模型或模型的一部分。\n\n# 操作步骤\n\n在以下步骤中，我们使用现有的神经网络类定义，然后使用函数式 API 重写它：\n\
    \n1.我们将首先进行导入：\n\n```\n>>import torch.nn.functional as F\n```\n\n2.然后，我们用`F.relu()`和`F.log_softmax()`定义我们的`FashionNetwork`类：\n\
    \n```\n>>class FashionNetwork(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.hidden1 = nn.Linear(784,256)\n        self.hidden2 = nn.Linear(256,128)\n\
    \        self.output = nn.Linear(128,10)\n\n    def forward(self,x):\n       \
    \ x = F.relu(self.hidden1(x))\n        x = F.relu(self.hidden2(x))\n        x\
    \ = F.log_softmax(self.output(x))\n        return x\n```\n\n我们使用函数式 API 重新定义了模型\n\
    \n# 工作原理\n\n在此秘籍中，我们定义了与以前完全相同的网络，但是用`function.relu`和`function.log_softmax`代替了激活函数和对数\
    \ softmax，这使我们的代码看起来更加简洁明了。\n\n# 更多\n\n您可以通过使用`functional.linear()`和`functional.dropout()`来控制丢弃，从而对线性层使用函数式\
    \ API，但是必须注意传递模型状态以指示其处于训练还是评估/预测模式。\n\n# 另见\n\n您可以通过[这个页面](https://pytorch.org/docs/stable/nn.html#torch-nn-functional)了解更多有关函数式\
    \ API 的信息。\n\n# 三、用于计算机视觉的卷积神经网络\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/3.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/3.md)\
    \ \n\n在本章中，我们将学习**卷积神经网络**（**CNN**）。 这是与前几章讨论的神经网络不同的一类。 CNN 在计算机视觉领域已经取得了巨大的成功，随着我们对它们的了解越来越多，我们将能够理解其中的原因。\n\
    \nCNN 是一种特殊的网络，可以将图像作为张量接收。 彩色图像由红色，绿色和蓝色三个颜色通道组成，称为 RGB。 我们将这些二维矩阵通道堆叠起来以形成彩色图像；\
    \ 每个通道的值变化会产生不同的颜色。 CNN 将图像作为三个独立的堆叠颜色层，一个层放在另一个层上。\n\n图像从附近的一个设置像素中获得其含义，但是单个像素不能保存有关整个图像的太多信息。\
    \ 在也称为密集层的全连接神经网络中，一层中的每个节点都连接到下一层中的每个其他节点。 CNN 利用像素之间的空间结构来减少两层之间的连接数，从而显着提高训练速度，同时减少模型参数。\n\
    \n这是显示全连接网络的图像：\n\n![](Images/f5ee14ce75048253125ef3bc9fdd323d.png)\n\n将上一张图像与下一张图像进行比较，后者显示了一个卷积网络：\n\
    \n![](Images/0efb04abc1084f425d827b8824e82d0c.png)\n\nCNN 使用过滤器从输入图像中拾取特征； 具有足够数量的过滤器的\
    \ CNN 可以检测图像中的各种特征。 随着我们越来越向后一层移动，这些过滤器在检测复杂特征方面变得越来越复杂。 卷积网络使用这些过滤器并逐一映射它们以创建特征出现的映射。\n\
    \n在本章中，我们将介绍以下秘籍：\n\n*   探索卷积\n\n*   探索池化\n\n*   探索转换\n\n*   执行数据扩充\n\n*   加载图像数据\n\
    \n*   定义 CNN 架构\n\n*   训练图像分类器\n\n# 技术要求\n\n在本章中，您将需要在上一章中安装的 TorchVision。 您最好在支持\
    \ GPU 的计算机上运行这些秘籍中的代码。\n\n# 探索卷积\n\n卷积是 CNN 中的一个组成部分。 它们被定义为 CNN 中的一层。 在卷积层中，我们将过滤器矩阵从左到右，从上到下在整个图像矩阵上滑动，然后取过滤器的点积，此斑块将过滤器的尺寸跨过图像通道。\
    \ 如果两个矩阵在相同位置具有较高的值，则点积的输出将较高，反之亦然。 点积的输出是标量值，该标量值标识图像中的像素模式和由过滤器表示的像素模式之间的相关性。\
    \ 不同的过滤器会以不同的复杂度从图像中检测不同的特征。\n\n我们需要了解 CNN 的另外两个关键元素，如下所示：\n\n*   **跨步**：这是在图像的下一个小块上使用过滤器应用卷积网络之前，我们水平和垂直移动的像素数。\n\
    \n*   **填充**：这是我们在卷积时应用于图像边缘的策略，具体取决于我们是在卷积后要保持张量的尺寸不变还是仅在过滤器适合的情况下对输入图像应用卷积。\
    \ 如果要保持尺寸不变，则需要对边缘进行零填充，以使原始尺寸在卷积后与输出匹配。 这称为**相同填充**。 但是，如果我们不想保留原始尺寸，则会将过滤器无法完全容纳的位置截断，这称为**有效填充**。\n\
    \n这是这两个填充的示意图：\n\n![](Images/a5a7d67a10b0222f8aa59d749cfe8677.png)\n\n下图显示了有效填充的示例：\n\
    \n![](Images/35525c803f21bb58d42d89a6ce9a8d04.png)\n\n在本秘籍中，我们将学习如何在 PyTorch 中使用卷积神经网络。\n\
    \n# 操作步骤\n\n在此秘籍中，我们将探讨卷积："
  fmt: "\n# 对数 Softmax 损失与负对数似然\n\n在此秘籍中，我们用对数 `softmax` 替换了 `softmax`，以便随后可以使用概率对数而不是概率的对数，这具有很好的理论解释。\
    \ 这样做有多种原因，包括改进的数值表现和梯度优化。 在训练可能具有计算挑战性和昂贵成本的模型时，这些优势非常重要。 此外，当它没有预测正确的类别时，它具有很高的惩罚作用。\n\
    \n因此，在处理对数 `softmax` 时，我们会使用负对数似然率，因为 `softmax` 不兼容。 在 `n` 类数之间的分类中很有用。 该对数将确保我们不会处理\
    \ 0 到 1 之间的非常小的值，而负值将确保小于 1 的概率的对数非零。 我们的目标是减少这种负的对数损失误差函数。 在 PyTorch 中，损失函数称为标准，因此我们将损失函数命名为\
    \ `criterion`。\n\n## 更多\n\n我们可以提供一个可选参数 `weight`，它必须是一维张量，该张量为每个输出类分配权重以处理不平衡的训练集。\n\
    \n## 另见\n\n您可以在[这个页面](https://pytorch.org/docs/master/nn.html#loss-functions)上查看更多损失函数的官方文档。\n\
    \n# 实现优化器\n\n在本秘籍中，我们将学习优化器。 在先前的秘籍“定义损失函数”中，我们谈到了误差和误差函数，并了解到，为了获得一个好的模型，我们需要最小化计算出的误差。\
    \ 反向传播是神经网络从误差中学习的一种方法。 误差用于修改权重，以使误差最小化。 优化函数负责修改权重以减少误差。 优化函数计算相对于权重的误差的偏导数。\
    \ 导数显示正斜率的方向，因此我们需要反转梯度的方向。 优化器函数将模型参数和损失函数结合在一起，以迭代方式修改模型参数以减少模型误差。 可以考虑将优化器摆在模型权重的基础上，根据模型与实际输出的预测差异来获得最佳模型，而损失函数则通过指示优化器是对还是错来充当指导。\n\
    \n学习率是优化器的超参数，它控制权重的更新量。 学习速度确保了权重不会大量更新，从而使算法根本无法收敛，并且误差越来越大。 然而，与此同时，权重的更新不应太低，以至于永远需要花费成本函数/误差函数的最小值。\n\
    \n下面显示了学习率的影响：\n\n![](Images/6d9e8b77f6bef2f8461ef582f908d41c.png)\n\n在本秘籍中，我们将学习如何在\
    \ PyTorch 中使用优化器函数，以及一些常见的优化函数以及如何处理学习率。\n\n## 操作步骤\n\n在本节中，我们从上一节中保留代码的位置开始，在定义条件的那一点：\n\
    \n1. 我们将从导入 `optim` 模块开始：\n\n```\n>>from torch import optim\n```\n\n2. 接下来，我们将创建一个\
    \ `optimizer` 对象。 我们将使用 `Adam` 优化器并传递模型参数：\n\n```\n>>optimizer = optim.Adam(model.parameters())\n\
    ```\n\n3. 要检查优化器的默认设置，可以执行以下操作：\n\n```\n>>optimizer.defaults\n>>{'lr': 0.001,\n\
    \ 'betas': (0.9, 0.999),\n 'eps': 1e-08,\n 'weight_decay': 0,\n 'amsgrad': False}\n\
    ```\n\n4. 您还可以将学习率添加为附加参数：\n\n```\n>>optimizer = optim.Adam(model.parameters(),\
    \ lr=3e-3)\n```\n\n5. 现在，我们将开始训练我们的模型，从周期数开始：\n\n```\n>>epoch = 10\n```\n\n6.\
    \ 然后，我们将开始循环：\n\n```\n>>for _ in range(epoch):\n```\n\n7. 我们将 `running_loss` 初始化为\
    \ `0`：\n\n```\n>>running_loss = 0\n```\n\n8. 我们将在训练图像加载器中遍历每个图像，这在本章前面的秘籍“定义神经网络类”中定义：\n\
    \n```\n>>for image, label in trainloader:\n```\n\n9. 然后，我们将梯度重置为零：\n\n```\n>>optimizer.zero_grad()\n\
    ```\n\n10. 接下来，我们将重塑图像：\n\n```\n>>image = image.view(image.shape[0],-1)\n```\n\
    \n11. 然后，我们从模型中获得预测：\n\n```\n>>pred = model(image)\n```\n\n12. 然后我们计算损失/误差：\n\n\
    ```\n>>loss = criterion(pred, label)\n```\n\n13. 然后，对损失调用 `.backward()` 方法：\n\n\
    ```\n>>loss.backward()\n```\n\n14. 然后，在优化器上调用 `.step()` 方法：\n\n```\n>>optimizer.step()\n\
    ```\n\n15. 然后附加运行损失：\n\n```\n>>running_loss += loss.item()\n```\n\n16. 最后，我们将在每个周期之后打印损失：\n\
    \n```\n>>else:\n    >>print(f'Training loss: {running_loss/len(trainloader):.4f}')\n\
    ```\n\n以下是示例输出：\n\n```\nTraining loss: 0.4978\nTraining loss: 0.3851\nTraining\
    \ loss: 0.3498\nTraining loss: 0.3278\nTraining loss: 0.3098\nTraining loss: 0.2980\n\
    Training loss: 0.2871\nTraining loss: 0.2798\nTraining loss: 0.2717\nTraining\
    \ loss: 0.2596\n```\n\n现在我们已经完成了训练。\n\n## 工作原理\n\n在本秘籍中，我们首先使用 `Adam` 优化器定义优化器，然后为优化器设置学习率，并查看默认参数。\
    \ 我们设置一个周期 `10`，并为每个周期开始迭代，在每次迭代中将 `running_loss` 设置为 0，并在该周期内对每个图像进行迭代（模型看到数据集的次数）。\
    \ 我们首先使用 `.zero_grad()` 方法清除梯度。 PyTorch 在每次反向传播时都会累积梯度，这在某些情况下很有用，因此将其导入以将梯度归零，以正确更新模型参数。\n\
    \n接下来，我们通过将每批 64 幅图像（每幅图像由 `28 x 28` 像素组成）展平到 784 来重塑图像，从而将张量形状从 `64 x 28 x 28`\
    \ 更改为 `64 x 784`，因为我们的模型期望这种输入形状。 接下来，我们将此输入发送到模型，并从模型中获得该批量的输出预测，然后将其传递给损失函数，也称为\
    \ `criterion`； 在那里，它评估了预测类与实际类之间的差异。\n\n`loss.backward()` 函数计算了梯度（即，误差相对于权重的偏导数），我们调用了\
    \ `optimizer.step()` 函数来更新模型的权重，以适应评估的误差。 `.item()` 方法从单个元素张量中拉出标量，因此使用 `loss.item()`\
    \ 从批量中获得 `error` 的标量值，将其累加到所有批量的损失中，最后在周期末尾打印损失。\n\n## 更多\n\n我们可以使用称为 `closure`\
    \ 的回调函数作为 `.step(closure)` 的参数来计算损失并通过传入函数作为参数来更新权重。 您还可以探索 PyTorch 提供的其他优化器函数，例如\
    \ `Adadelta`，`Adagrad`，`SGD` 等。\n\n## 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/optim.html#torch.optim.Optimizer)上了解有关优化程序的更多信息。\n\
    \n# 实现丢弃\n\n在本秘籍中，我们将研究实现丢弃。 在训练神经网络模型或一般任何机器学习模型时，我们可能会遇到的一种较常见的现象是过拟合。 当模型学习提供给训练的数据而不是在求解空间上进行泛化时，就会发生过拟合，也就是说，模型学习的是训练数据的细微细节和噪声，而不是掌握全局，因此在效果上表现不佳。\
    \ 新数据。 正则化是防止模型过拟合的过程。\n\n使用丢弃是神经网络中最流行的正则化技术之一，在这种技术中，训练时会关闭随机选择的神经元，也就是说，神经元的作用会暂时从正向传播中移除，而反向传播不会影响权重\
    \ ，因此没有一个神经元或神经元子集能获得模型的所有决定力； 相反，所有神经元都被迫为预测做出积极贡献。\n\n丢弃可以直观地理解为创建大量集成模型，学习在一个模型的大定义下捕获各种特征。\n\
    \n在本秘籍中，我们将研究如何在模型定义中添加缺失，以通过防止过拟合来改善整体模型表现。 应当记住，丢弃仅在训练时才适用； 但是，在测试和实际预测期间，我们希望所有神经元都做出贡献。\n\
    \n## 操作步骤\n\n在本节中，我们将学习如何为我们的初始模型类 `FashionNetwork` 添加丢弃：\n\n1. 我们将从初始模型定义开始：\n\
    \n```\n>>class FashionNetwork(nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.hidden1 = nn.Linear(784, 256)\n        self.hidden2 = nn.Linear(256,\
    \ 128)\n        self.output = nn.Linear(128, 10)\n        self.log_softmax = nn.LogSoftmax()\n\
    \        self.activation = nn.ReLU()\n    def forward(self, x):\n        x = self.hidden1(x)\n\
    \        x = self.activation(x)\n        x = self.hidden2(x)\n        x = self.activation(x)\n\
    \        x = self.output(x)\n        output = self.log_softmax(x)\n        return\
    \ output\n```\n\n2. 然后，我们将为模型 `__init__` 添加一个丢弃：\n\n```\n>>self.drop = nn.Dropout(p=0.25)\n\
    ```\n\n我们更新的 `__init__()` 如下所示：\n\n```\n>>def __init__(self):\n        super().__init__()\n\
    \        self.hidden1 = nn.Linear(784, 256)\n        self.hidden2 = nn.Linear(256,\
    \ 128)\n        self.output = nn.Linear(128, 10)\n        self.log_softmax = nn.LogSoftmax()\n\
    \        self.activation = nn.ReLU()\n        self.drop = nn.Dropout(p=0.25)\n\
    ```\n\n3. 现在，我们将在 `forward()` 方法中添加丢弃：\n\n```\n>>def forward(self, x):\n     \
    \   x = self.hidden1(x)\n        x = self.activation(x)\n        x = self.drop(x)\n\
    \        x = self.hidden2(x)\n        x = self.activation(x)\n        x = self.drop(x)\n\
    \        x = self.output(x)\n        output = self.log_softmax(x)\n        return\
    \ output\n```\n\n现在，我们有了一个带有丢弃的网络。\n\n## 工作原理\n\n在此秘籍中，我们更改了 `__init__()` 方法，以\
    \ 0.25 的丢弃率添加了该丢弃层，这意味着将应用该丢弃层中 25% 的神经元将被随机关闭。 然后，我们编辑 `forward` 函数，将其应用于其中具有\
    \ 256 个单元的第一个隐藏层，然后对第二个层（具有 128 个单元）应用该滤除。 在完成激活函数之后，我们在两个层中都应用了激活。 我们必须牢记，必须仅在隐藏层上应用丢弃，以防止我们丢失输入数据和丢失输出。\n\
    \n## 更多\n\n我们可以通过调用 `model.eval()` 禁用退出，并使用 `model.train()` 启用退出\n\n## 另见\n\n\
    您可以在[这个页面](https://arxiv.org/abs/1207.0580)上了解有关丢弃的更多信息。\n\n# 实现函数式 API\n\n在本秘籍中，我们将探索\
    \ PyTorch 中的函数式 API。 这样做将使我们能够编写更简洁的网络架构和组件。 我们将研究函数式 API，并使用函数式 API 定义模型或模型的一部分。\n\
    \n## 操作步骤\n\n在以下步骤中，我们使用现有的神经网络类定义，然后使用函数式 API 重写它：\n\n1. 我们将首先进行导入：\n\n```\n\
    >>import torch.nn.functional as F\n```\n\n2. 然后，我们用 `F.relu()` 和 `F.log_softmax()`\
    \ 定义我们的 `FashionNetwork` 类：\n\n```\n>>class FashionNetwork(nn.Module):\n    def\
    \ __init__(self):\n        super().__init__()\n        self.hidden1 = nn.Linear(784,256)\n\
    \        self.hidden2 = nn.Linear(256,128)\n        self.output = nn.Linear(128,10)\n\
    \n    def forward(self,x):\n        x = F.relu(self.hidden1(x))\n        x = F.relu(self.hidden2(x))\n\
    \        x = F.log_softmax(self.output(x))\n        return x\n```\n\n我们使用函数式 API\
    \ 重新定义了模型\n\n## 工作原理\n\n在此秘籍中，我们定义了与以前完全相同的网络，但是用 `F.relu` 和 `F.log_softmax` 代替了激活函数和对数\
    \ softmax，这使我们的代码看起来更加简洁明了。\n\n## 更多\n\n您可以通过使用 `functional.linear()` 和 `functional.dropout()`\
    \ 来控制丢弃，从而对线性层使用函数式 API，但是必须注意传递模型状态以指示其处于训练还是评估/预测模式。\n\n## 另见\n\n您可以通过[这个页面](https://pytorch.org/docs/stable/nn.html#torch-nn-functional)了解更多有关函数式\
    \ API 的信息。\n\n# 三、用于计算机视觉的卷积神经网络\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/3.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/3.md)\n\
    \n在本章中，我们将学习 `卷积神经网络`（`CNN`）。 这是与前几章讨论的神经网络不同的一类。 `CNN` 在计算机视觉领域已经取得了巨大的成功，随着我们对它们的了解越来越多，我们将能够理解其中的原因。\n\
    \n`CNN` 是一种特殊的网络，可以将图像作为张量接收。 彩色图像由红色，绿色和蓝色三个颜色通道组成，称为 `RGB`。 我们将这些二维矩阵通道堆叠起来以形成彩色图像；\
    \ 每个通道的值变化会产生不同的颜色。 `CNN` 将图像作为三个独立的堆叠颜色层，一个层放在另一个层上。\n\n图像从附近的一个设置像素中获得其含义，但是单个像素不能保存有关整个图像的太多信息。\
    \ 在也称为密集层的全连接神经网络中，一层中的每个节点都连接到下一层中的每个其他节点。 `CNN` 利用像素之间的空间结构来减少两层之间的连接数，从而显着提高训练速度，同时减少模型参数。\n\
    \n这是显示全连接网络的图像：\n\n![](Images/f5ee14ce75048253125ef3bc9fdd323d.png)\n\n将上一张图像与下一张图像进行比较，后者显示了一个卷积网络：\n\
    \n![](Images/0efb04abc1084f425d827b8824e82d0c.png)\n\n`CNN` 使用过滤器从输入图像中拾取特征； 具有足够数量的过滤器的\
    \ `CNN` 可以检测图像中的各种特征。 随着我们越来越向后一层移动，这些过滤器在检测复杂特征方面变得越来越复杂。 卷积网络使用这些过滤器并逐一映射它们以创建特征出现的映射。\n\
    \n在本章中，我们将介绍以下秘籍：\n\n*   探索卷积\n*   探索池化\n*   探索转换\n*   执行数据扩充\n*   加载图像数据\n* \
    \  定义 CNN 架构\n*   训练图像分类器\n\n## 技术要求\n\n在本章中，您将需要在上一章中安装的 TorchVision。 您最好在支持\
    \ GPU 的计算机上运行这些秘籍中的代码。\n\n## 探索卷积\n\n卷积是 `CNN` 中的一个组成部分。 它们被定义为 `CNN` 中的一层。 在卷积层中，我们将过滤器矩阵从左到右，从上到下在整个图像矩阵上滑动，然后取过滤器的点积，此斑块将过滤器的尺寸跨过图像通道。\
    \ 如果两个矩阵在相同位置具有较高的值，则点积的输出将较高，反之亦然。 点积的输出是标量值，该标量值标识图像中的像素模式和由过滤器表示的像素模式之间的相关性。\
    \ 不同的过滤器会以不同的复杂度从图像中检测不同的特征。\n\n我们需要了解 `CNN` 的另外两个关键元素，如下所示：\n\n*   **跨步**：这是在图像的下一个小块上使用过滤器应用卷积网络之前，我们水平和垂直移动的像素数。\n\
    *   **填充**：这是我们在卷积时应用于图像边缘的策略，具体取决于我们是在卷积后要保持张量的尺寸不变还是仅在过滤器适合的情况下对输入图像应用卷积。 如果要保持尺寸不变，则需要对边缘进行零填充，以使原始尺寸在卷积后与输出匹配。\
    \ 这称为**相同填充**。 但是，如果我们不想保留原始尺寸，则会将过滤器无法完全容纳的位置截断，这称为**有效填充**。\n\n这是这两个填充的示意图：\n\
    \n![](Images/a5a7d67a10b0222f8aa59d749cfe8677.png)\n\n下图显示了有效填充的示例：\n\n![](Images/35525c803f21bb58d42d89a6ce9a8d04.png)\n\
    \n在本秘籍中，我们将学习如何在 PyTorch 中使用卷积神经网络。\n\n## 操作步骤\n\n在此秘籍中，我们将探讨卷积：\n"
  trans: "\n\n# 对数 Softmax 损失与负对数似然\n\n在此秘籍中，我们用对数 `softmax` 替换了 `softmax`，以便随后可以使用概率对数而不是概率的对数，这具有很好的理论解释。\
