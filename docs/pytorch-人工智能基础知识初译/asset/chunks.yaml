    ```\n\n6. 在这里，我们必须找到下一个状态：\n\n```\nnext_state = torch.from_numpy(np.reshape(next_state,\
    \ [1, observation_space])).float()\ndqn.load_memory(state, action, reward, next_state,\
    \ terminal)\nstate = next_state\n```\n\n7. 我们将使用以下代码结束无限循环：\n\n```\nif terminal:\n\
