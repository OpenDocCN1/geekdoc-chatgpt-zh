    \n# 工作原理\n\n在此秘籍中，我们找到并训练了我们的模型。 为此，我们进行了导入，首先要确定模型并将模型分配给我们在计算机上拥有的适当设备。 我们使用`model.to(device)`方法移动模型，这比使用`model.cuda()`或`model.cpu()`更为优雅。\n\
    \n然后，我们定义了损失函数，也称为`criterion`。 由于这是一个分类问题，因此我们使用了交叉熵损失。 然后，我们选择 SGD 优化器在反向传播时更新模型权重，学习率为\
    \ 0.01，并使用`model.parameters()`传入模型参数。 然后，我们将模型运行了 30 个周期，尽管我们可以选择任何合理的数目来执行此操作。\
    \ 在循环中，我们将训练和验证损失重置为 0，并将模型设置为训练模式，然后遍历训练数据集中的每个批量。 我们首先将批量移至设备，这样，如果我们的 GPU 内存有限，则并非所有数据都不会完全加载到\
    \ GPU 内存中。 然后，我们将输入张量传递到模型中，并获取输出，并将其传递到损失函数中，以评估预测标签和真实标签之间的差异。\n\n此后，我们使用`loss.backward()`进行了反向传播，并使用`optimizer.step()`步骤更新了模型权重。\
    \ 然后，我们使用总历时损失来汇总批量中的损失。 然后，我们使用`model.eval()`将模型转换为评估模型，因为该模型的表现需要在验证集上进行评估，并且该模型在此阶段中不会学习，因此我们也需要关闭退出项。\
    \ 遍历验证批量，我们获得了模型输出，并在整个周期累积了验证批量之间的损失。 此后，我们格式化了模型表现，以查看每个周期模型的变化。 我们注意到，模型训练和验证损失随时间的推移而减少，这表明模型正在学习。\n\
    \n# 更多\n\n我们已经运行了训练过的模型，我们需要根据保持数据或测试数据（即该模型尚未看到的数据）评估模型。 通过这样做，我们可以评估模型的真实表现。\
    \ 为此，您将必须进入模型测试批量，并且对于每个批量，必须执行`_, prediction = torch.max(output, 1)`将 softmax\
    \ 概率转换为实际预测，并使用`prediction.eq(target.data.view_as(prediction))`将预测与真实输出标签进行比较，其中我们确保预测张量和输出张量的尺寸相同。\
    \ 这将返回一个张量，其中匹配的张量为 1，不匹配的张量为 0。 我们可以使用它来计算每个批量中模型的准确率，并将其汇总到整个测试数据集中。\n\n# 另见\n\
    \n您可以在[这个页面](https://pytorch.org/tutorials/beginner/blitz/cifar10_tutorial.html#test-the-network-on-the-test-data)上看到测试模型的示例实现。\n\
    \n# 四、用于 NLP 的循环神经网络\n\n> 原文：[https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/4.md](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/4.md)\
    \ \n\n在本章中，我们将处理**循环神经网络**（**RNNs**），这是一种专门处理序列数据或时变数据的神经网络。 利用卷积神经网络，我们处理在空间上彼此相关的数据点，其中一组像素值保存有关图像的信息。\
    \ 但是请考虑一下节奏，节奏是由一段时间内一系列变化的声音信号形成的。 数据点彼此之间具有时间关系。 在循环神经网络中，神经元之间的连接在时间序列上形成有向图，表现出时间动态行为。\
    \ 传统的前馈网络不存储先前的输入； 但是，RNN 使用存储单元来记住先前的输入，因此根据到目前为止的输入顺序来处理当前输入。\n\n在本章中，我们将介绍以下秘籍：\n\
    \n*   分词\n\n*   创建字段\n\n*   开发数据集\n\n*   开发迭代器\n\n*   探索单词嵌入\n\n*   建立 LSTM 网络\n\
    \n*   多层 LSTM\n\n*   双向 LSTM\n\n# RNN 介绍\n\n这是 RNN 的示意图：\n\n![](Images/ac6cedd3fe003bda678786940680a049.png)\n\
    \n图 1：循环神经网络\n\n在上图中，我们可以看到 RNN 中的输入，输出和循环本身。 RNN 是为信息的持久性而设计的，而循环组件则可以实现这一点。\n\
    \n这是“图 1”的扩展版本：\n\n![](Images/20c72849d7c41c51f8a4df196b648f0f.png)\n\n图 2：RNN\
    \ 的展开图\n\n在上图中，我们可以看到 RNN 的展开图，其中一个步骤的信息被馈送到下一个步骤，从而创建同一网络的多个副本，所有这些信息都封装在循环循环中。\
    \ 循环神经网络接受输入并给出输出，但是该输出不仅取决于给定实例上的输入，还取决于提供给网络的输入的整个历史，网络会在数学上记住这些输入。\n\n循环神经网络能够接收可变大小的输入序列并产生可变大小的输出序列，从而执行与全连接神经网络中固定数量的计算相反的可变数量的计算。\
    \ 进一步的 RNN 允许信息持久化，并在接收到的输入之间共享该信息。 在给定实例上生成的输出基于到目前为止所看到的所有输入的历史记录。\n\n这是 LSTM\
    \ 的示意图：\n\n![](Images/605d9277d6de4bd0643c53b29dcd38f9.png)\n\n图 3：LSTM\n\n**长短期记忆**（**LSTM**）网络是一种循环神经网络，是\
    \ RNN 之上的一种进步。\n\n这是双向 LSTM：\n\n![](Images/1630c66447185ef04d5b59fbbde3f709.png)\n\
    \n图 4：双向 LSTM\n\n这是多层 LSTM：\n\n![](Images/a197193e7996e3b109f5868975b79392.png)\n\
    \n图 5：多层 LSTM\n\n双向 LSTM 和多层 LSTM 是对基本 LSTM 网络架构的改进。\n\n# 技术要求\n\n在本章中，我们需要设置\
    \ PyTorch。 我们将使用`torchtext`，它是一个专门的库，用于处理与 PyTorch 联合工作的语言任务。\n\n我们可以使用以下`pip`命令安装`torchtext`：\n\
    \n```\npip install torchtext\n```\n\n至此，我们完成了本章所需的设置。\n\n# 分词\n\n在处理自然语言处理任务时，我们采用文本语料库并将其分解为较小的单元。\
    \ 在本秘籍中，我们将句子分解为单个单词，其中每个单词代表一个意思，其他单词与它附近的其他单词一起表达一个句子的意图。 计算机只能理解数字，因此为这些单词分配了唯一的整数值来表示单词。\
    \ 将句子分解为标记的过程称为分词。 在本秘籍中，我们将执行单词分词。\n\n# 操作步骤\n\n在本秘籍中，我们将编写一个标记器，将在本章的“创建字段”部分中使用：\n\
    \n1.  我们将首先编写一个简单的 lambda 函数：\n\n```\n>>tokenizer = lambda words: words.split()\n\
    ```\n\n2.  然后，我们将测试`tokenizer()`函数：\n\n```\n>>tokenizer(\"This is a test for tokenizer\"\
    )\n['This', 'is', 'a', 'test', 'for', 'tokenizer']\n```\n\n在此秘籍中，我们成功实现了单词分词。\n\
    \n# 工作原理\n\n在此秘籍中，我们编写了一个简单的分词器 lambda 函数，该函数可用于英语和类似英语的语言。 我们使用单词之间的空格来标记句子。\
    \ 然后，我们通过将句子传递给`tokenizer()`函数来测试标记器。 我们将在下一个秘籍中使用此标记生成器来创建字段。\n\n# 更多\n\n我们还可以使用`nltk`库对句子进行分词：\n\
    \n```\n>>from nltk.tokenize import word_tokenize\n>>word_tokenize(\"This is a\
    \ test for tokenizer\")\n['This', 'is', 'a', 'test', 'for', 'tokenizer']\n```\n\
    \n此外，还有其他类型的分词，例如字符串分词，其中涉及将字符串分词为子字符串。\n\n# 另见\n\n可以在[这个页面](https://www.nltk.org/api/nltk.tokenize.html)上探索使用`nltk`对字符串进行的各种分词。\n\
    \n# 创建字段\n\n在本秘籍中，我们将探索字段，这些字段与`torchvision`中可用的工具一样，使处理自然语言数据变得容易。 字段让我们定义数据类型，并通过指定要对数据执行的一组操作来帮助我们从文本数据中创建张量。\
    \ `Field`类使我们可以执行常见的文本处理任务，并掌握手边的数据词汇。\n\n在本秘籍中，我们将研究如何使用`Field`类定义各种文本处理任务。\n\
    \n# 操作步骤\n\n在本秘籍中，我们将探讨使用字段的各种示例：\n\n1.  我们将从导入开始：\n\n```\n>>from torchtext.data\
    \ import Field\n```\n\n2.  为了进行情感分析，我们将为评论定义`Field`对象：\n\n```\n>>Review = Field(sequential=True,\
    \ tokenize=tokenizer, lower=True)\n```\n\n3.  然后，我们为标签定义字段：\n\n```\n>>Label =\
    \ Field(sequential=False, use_vocab=False)\n```\n\n4.  我们可以在输入字符串的开头和结尾添加标记：\n\
    \n```\n>>SequenceField = Field(tokenize=tokenizer, init_token='<sos>', eos_token='<eos>',\
    \ lower=True)\n```\n\n5.  我们可以将序列设置为固定长度：\n\n```\n>>SequenceField = Field(tokenize=tokenizer,\
    \ init_token='<sos>', eos_token='<eos>', lower=True, fix_length=50)\n```\n\n6.\
    \  我们可以设置一个未知的标记：\n\n```\n>>SequenceField = Field(tokenize=tokenizer, init_token='<sos>',\
    \ eos_token='<eos>', unk_token='<unk>')\n```\n\n7.  我们可以将批量维度设置为第一维度：\n\n```\n\
    >>SequenceField = Field(tokenize=tokenizer, init_token='<sos>', eos_token='<eos>',\
    \ unk_token='<unk>', batch_first=True)\n```\n\n通过此秘籍，我们探索了可用于在`torchtext`中创建字段的不同方法。\n\
    \n# 工作原理\n\n在此秘籍中，我们根据手头的特定任务，使用`field`类对给定的输入文本执行了各种文本处理任务。 在审阅分类的示例中，在`review`字段中，我们将`sequential`参数设置为`True`，因为它是序列数据。\
    \ 对于标签字段，我们将其设置为`False`，因为它们不是顺序的。 我们可以将文本设置为小写，这样就不会根据标记的大小写为相同的单词分配单独的标记 ID。\
    \ 在评论分类的情况下，这不会影响含义； 这可以通过将`lower`设置为`True`来实现。\n\n对于数字字段，我们将`use_vocab`设置为`False`，这是我们为审阅标签所做的，因为我们假设标签的负数值为`0`，正数的值为`1`。\
    \ 我们从分词部分传递了`tokenizer`函数作为`tokenize`参数； 我们甚至可以通过设置`tokenize=\"spacy\"`使用`spacy`的标记器。\
    \ 对于某些任务，例如，使用`Sequence`对模型进行排序，我们可能需要特殊的标记来指示序列的开始和结束。 可以通过设置`init_token`和`eos_token`参数轻松完成。\
    \ 这对于序列到序列的模型是正确的，并且如果在模型评估期间用于训练模型的词汇表中不存在标记（词汇表外），则可以使用自定义标记来替换这些标记， 设置`unk_token`参数。\n\
    \n然后，将`batch_first`设置为`True`，以使输出张量的第一维为批量维，如果`fix_length`参数设置为整​​数值，则使用此字段将对输入设置固定长度。\n\
    \n# 更多\n\n我们可以为特定于某种语言的分词设置用于分词的语言，该语言支持 spacy 支持的语言。 我们可以使用`pad_token`参数设置自定义填充标记。\
    \ 我们可以在分词之后但在数字化之前使用该字段定义将应用于示例的处理管道，在数字化之后但使用`preprocessing`和`postprocessing`参数将数字转换为张量之前，我们可以执行相同的操作。\
    \ `stop_words`参数可用于删除在预处理时需要删除的标记。 此外，还有一种专门用于标签字段的字段类型`LabelField`，它可以代替普通字段使用。\n\
    \n# 另见\n\n您可以通过[这个页面](https://torchtext.readthedocs.io/en/latest/data.html#field)了解更多有关字段的信息。\n\
    \n# 开发数据集\n\n在本秘籍中，我们将研究读取文本数据并使用各种数据源。`torchtext`可以从文本文件，CSV/TSV 文件，JSON 文件和目录中读取数据，并将其转换为数据集。\
    \ 数据集是已预处理的数据块，可读取到内存中，并可由其他数据结构使用。\n\n# 准备\n\n我们将使用此秘籍的新闻分类数据集，您可以从[这里](https://github.com/jibinmathew69/PyTorch1.0-Tutorial/tree/master/NewsClassification)下载该数据集。\n\
    \n`.csv`文件中包含以下几列：\n\n*   `id`\n\n*   `content`\n\n*   `Business`\n\n*   `SciTech`\n\
    \n*   `Sports`\n\n*   `World`"
