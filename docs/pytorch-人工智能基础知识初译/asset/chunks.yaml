    \ NumPy 和 Torch 张量之间来回移动了。\n\n## 工作原理\n\n我们首先导入 `numpy` 以创建 `numpy` 数组。 然后，我们使用\
    \ `np.ones()` 创建了仅包含一个数组的 `numpy` 数组，并使用 `from_numpy()` 方法将其转换为 PyTorch 张量。 然后，我们使用\
    \ `.numpy()` 方法将张量转换为 `numpy` 数组。\n\n在 PyTorch 张量和 NumPy 之间切换非常容易； 实际上，只有两种方法可以实现。\
    \ 这使得可以获取预测的张量并从 NumPy 转换为图像（使用支持 NumPy 到图像转换的库），并类似地从 NumPy 返回张量。\n\n## 更多\n\n\
    基础内存在 NumPy 数组和 PyTorch 张量之间共享，因此任何一个更改都会影响另一个。\n\n让我们看一下如何在以下代码块中呈现它：\n\n```\n\
    >>a\narray([[1., 1., 1.],\n [1., 1., 1.]]) \n>>b = torch.from_numpy(a)\n>>b\n\
    tensor([[1., 1., 1.],\n [1., 1., 1.]], dtype=torch.float64) \n>>a*=2\n>>a\narray([[2.,\
    \ 2., 2.],\n       [2., 2., 2.]]) \n>>b\ntensor([[2., 2., 2.],\n [2., 2., 2.]],\
    \ dtype=torch.float64)\n```\n\n我们可以看到 `numpy` 的变化也反映在张量中。\n\n## 另见\n\n要了解更多信息，[请单击\
    \ NyPy 桥的 PyTorch 官方文档链接](https://pytorch.org/tutorials/beginner/blitz/tensor_tutorial.html#numpy-bridge)。\n\
    \n# 探索梯度\n\n让我们简要介绍一下什么是梯度。 为此，我们需要首先了解什么是梯度下降。 在机器学习问题中，我们提供一个输入和期望的输出对，并要求我们的模型概括给定输入和输出对之间的关​​系。\
    \ 但是有时模型会得知其预测会与期望的输出相去甚远（这种差异称为 **损失**）。 那么什么是梯度下降？\n\n**梯度下降** 是一种优化算法，用于通过在梯度的负值所定义的最陡下降方向上反复移动来使函数最小化。\
    \ 我们在训练模型时会使用它，以使损失最小化。 它用于查找使成本或损失函数最小化的函数参数值（机器学习中的系数或权重）。\n\n那么什么是梯度呢？ 梯度度量的是当输入改变很小的时候给定函数的输出有多少变化，这与微积分中的导数概念相同。\
    \ 梯度会计算所有权重相对于误差变化的变化。 梯度是函数的斜率。 较高的坡度意味着坡度更陡，并且模型可以更快地学习。 梯度指向最陡的倾斜方向。 PyTorch\
    \ 中的 `Autograd` 模块在 PyTorch 中执行所有梯度计算。 它是自动差异化的核心 Torch 包。 它使用基于磁带的系统进行自动微分。 在前进阶段，`Autograd`\
    \ 磁带将记住它执行的所有操作，而在倒退阶段，它将重放它们。\n\n## 操作步骤\n\n让我们从创建张量开始。\n\n1. 与我们到目前为止创建的张量不同，我们将添加一个新键，让\
    \ PyTorch 知道它需要对以下张量执行梯度计算：\n\n```\nx = torch.full((2,3), 4, requires_grad=True)\n\
    x\n```\n\n结果为以下输出：\n\n```\ntensor([[4., 4., 4.],\n [4., 4., 4.]], requires_grad=True)\n\
    ```\n\n2. 让我们创建另一个张量 `y`，它是从张量 `a` 中派生的； 我们将看到这个新张量的输出差异，因为它附有一个梯度函数：\n\n```\n\
    y = 2*x+3\ny\n```\n\n结果为以下输出：\n\n```\ntensor([[11., 11., 11.],\n [11., 11., 11.]],\
    \ grad_fn=<AddBackward0>) \n```\n\n3. 让我们从原始的 `x` 开始进一步探索 PyTorch 中的梯度：\n\n```\n\
    x\n```\n\n结果为以下输出：\n\n```\ntensor([[4., 4., 4.],\n [4., 4., 4.]], requires_grad=True)\n\
    ```\n\n4. 然后，我们将定义 `y`，它比上一个示例稍微复杂一些：\n\n```\ny = (2 * x * 2 + 3)\ny\n```\n\n\
    结果为以下输出：\n\n```\ntensor([[35., 35., 35.],\n [35., 35., 35.]], grad_fn=<AddBackward0>)\n\
    ```\n\n5. 接下来，由于 `y` 是张量，我们将针对 `y` 上的 `x` 计算梯度，并且我们要针对该张量计算梯度。 为此，我们将传递 `x` 的形状，该形状与\
    \ `y` 相同：\n\n```\ny.backward(torch.ones_like(x))\n```\n\n6. 现在，让我们使用 `grad` 属性查看\
    \ `x` 的梯度值：\n\n```\nx.grad\n```\n\n结果为以下输出：\n\n```\ntensor([[16., 16., 16.],\n\
    \ [16., 16., 16.]])\n```\n\n7. 继续本节的非梯度部分，我们可以通过执行以下步骤来关闭代码中特定位置的梯度计算：首先，如果要重新使用张量，请首先使用张量上的\
    \ `requires_grad_()` 方法 `x`：\n\n```\n>> x.requires_grad\n\nTrue\n\n>> x.requires_grad_(False)\
    \ # turning of gradient\n>> x.requires_grad\n\nFalse\n```\n\n8. 我们可以从 `x` 开始使用\
    \ `.no_grad()` 方法关闭对梯度计算的跟踪：\n\n```\n>> x = torch.full((2,3), 4,requires_grad=True)\n\
    >> x\n\ntensor([[4., 4., 4.],\n [4., 4., 4.]], requires_grad=True)\n\n>> x.requires_grad\n\
    \nTrue\n\n>> with torch.no_grad():\n..         print((x**5+3).requires_grad)\n\
    \nFalse\n```\n\n有了这个，我们探索了 `Autograd` 包的一些功能。\n\n## 工作原理\n\n我们可以看到，Autograd 可以跟踪操作。\
    \ 当我们从 `x`，`y=2*x+3` 创建张量 `y` 时，我们会看到一个梯度函数 `grad_fn` 被附加到张量上。\n\n我们首先创建一种新的张量，将\
    \ `require_grad` 设置为 `True`，然后创建一个张量 `y`，使得 `y = 2x² + 3` 并发现 `y` 具有一个附加到它的不同的梯度函数。\
    \ 我们还研究了使用 `requires_grad_()`，最后使用了 `no_grad()`。\n\nPyTorch 有一个名为 `autograd` 的包，可以对张量上的所有操作执行所有跟踪和自动微分。\
    \ 这是一个按运行定义的框架，这意味着您的反向传播是由代码的运行方式定义的，并且每次迭代都可以不同。 我们利用 `torch.Tensor` 类的 `require_grad`\
    \ 属性来确定梯度计算的状态，并在调用 `.backward()` 方法后自动计算其 `.grad` 属性中的所有梯度和张量的梯度。\n\n我们可以禁用代码之间的梯度计算，也可以暂时禁用对张量的跟踪以进行梯度计算，从而提高计算速度。\
    \ 禁用计算主要在评估期间使用。\n\n## 更多\n\n您可以使用 `torch.set_grad_enabled()` 方法启用和禁用梯度计算，以及使用\
    \ `detach()` 方法来将来跟踪计算。 使用 `grad_fn` 属性查看附加到张量的梯度函数。\n\n## 另见\n\n要了解更多信息，可以在 [这里](https://pytorch.org/tutorials/beginner/blitz/autograd_tutorial.html)\
    \ 和 [这里](https://pytorch.org/docs/stable/autograd.html) 查看官方文档。\n\n# 在 PyTorch\
    \ 中查看张量\n\n在使用张量和处理神经网络时，我们经常需要遍历和重新排列张量中的数据，以使张量的尺寸适合架构的需求。 在本节中，我们将探讨 PyTorch\
    \ 中常见的重排和重塑技术。\n\n在本秘籍中，我们将学习如何使张量看起来像我们想要的样子。\n\n## 操作步骤\n\n让我们看一下如何改变张量的形状：\n\
    \n1. 首先，我们将创建一个张量 `a`：\n\n```\n>>a = torch.Tensor([1, 2, 3, 4])\n```\n\n2. 然后，我们将使用\
    \ `reshape()` 方法：\n\n```\n>>torch.reshape(a, (2, 2))\n```\n\n结果为以下输出：\n\n```\n\
    tensor([[1., 2.],\n [3., 4.]])\n```\n\n3. 接下来，我们将研究 `resize_()` 方法：\n\n```\n>>a\
    \ = torch.Tensor([1, 2, 3, 4, 5, 6])\n>>a.shape\ntorch.Size([6])\n>>a.resize_((2,\
    \ 2))\n```\n\n结果为以下输出：\n\n```\ntensor([[1., 2.],\n [3., 4.]])\n```\n\n4. 最常见的方法是\
    \ `view()`：\n\n```\n>>a = torch.Tensor([1, 2, 3, 4, 5, 6])\n>>a.view((2, 3))\n\
    ```\n\n结果为以下输出：\n\n```\ntensor([[1., 2., 3.],\n [4., 5., 6.]])\n```\n\n5. 使用 `view()`\
    \ 方法，您可以选择不提及其中一个尺寸，然后排列其余尺寸，PyTorch 将按以下方式计算缺失尺寸：\n\n```\n>>a.view((2, -1))\n\
    ```\n\n结果为以下输出：\n\n```\ntensor([[1., 2., 3.],\n [4., 5., 6.]])\n```\n\n这些是重塑张量的不同方法。\n\
    \n## 工作原理\n\n在前面的秘籍中，我们基于网络架构操纵了张量以改变其形状，研究了三种不同的方法，每种方法都适用于不同的用例：\n\n* `.reshape()`\
    \ 方法：`.reshape(a, b)` 返回一个新张量，该张量具有与原始张量 `(a, b)` 相同的数据，因为它会将数据复制到内存的另一部分； `.reshape()`\
    \ 可以在连续和非连续张量上运行，并且可以返回原始张量的副本或视图。\n\n* `.resize()` 方法：`.resize_(a, b)` 返回相同的张量，而不创建具有新给定形状的副本。\
    \ 但是我们应该记住，如果新形状产生的元素少于原始张量，那么它将不会引发任何错误，并且某些元素将从张量中删除，但不会从内存中删除。 如果新形状产生的元素多于原始张量，则新元素将在内存中未初始化而不会引发任何错误。\n\
    \n* `.view()` 方法：`.view(a, b)` 将返回一个新的张量，其张量与权重为 `(a, b)` 的数据相同； `.view()` 只能在连续的张量上运行，并返回与输入相同的存储。\n\
    \n## 更多\n\n您可以使用另一个张量的尺寸，并使给定的张量类似于该张量的尺寸，而不会影响其中任何一个的实际尺寸。\n\n看下面的代码块：\n"
