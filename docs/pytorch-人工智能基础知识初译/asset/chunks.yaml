  trans: "\n\n# DQN 概述\n\n`DQN` 是一种 `RL` 技术，旨在为给定的观察选择最佳的动作。 有一个 `Q` 值，它是与每个可能观察到的每个可能动作相关联的给定移动的质量。\
    \ 在传统的 `RL` 算法中，此 `Q` 值来自 `Q` 表，该表是一个查找表，其中是包含 `Q` 值的表。 通过反复玩游戏并使用奖励更新表来迭代更新此查找表。\
    \ `q` 学习算法学习要在此表中填充的最佳值。 我们可以简单地查看给定状态的表并选择具有最大 `Q` 值的动作，以最大程度地赢得游戏。\n\n`Q` 值可以更新如下：\n\
    \n![](img/9bc567ba4149fe3e5bad649dc4a05fca.png)\n\n新的 `Q` 值是两个部分的总和。 第一部分是 `(1\
    \ - 学习率) * 旧 Q 值`，它是多少旧值将被记住。 学习率为 0 时，不会学习任何新内容，学习率为 1 时，所有旧值都将被忘记。\n\n第二部分是\
    \ `学习率*(即时行动奖励+最优未来值的折算估计)`，其中学习值是即时奖励加上最优未来值的折算估计。 未来奖励的重要性由折扣系数决定。\n\n通过深度 `Q`\
    \ 学习，我们可以使用深度神经网络来预测动作的 `Q` 值，并使用深度神经网络来选择动作，而不是使用 `Q` 表查找给定状态下具有最大可能 `Q` 值的动作。\
    \ 给定动作的最大 `Q` 值。\n\n# 定义神经网络模型\n\n## 操作步骤\n\n在本秘籍中，我们将为卡特彼勒问题定义神经网络模型。 请按照以下步骤操作：\n\
    \n1. 首先，我们将导入 `torch`：\n\n```\n>>import torch\n>>import torch.nn as nn\n```\n\n\
    2. 接下来，定义一个函数来返回模型：\n\n```\ndef cartpole_model(observation_space, action_space):\n\
    \    return nn.Sequential(\n        nn.Linear(observation_space, 24),\n      \
    \  nn.ReLU(),\n        nn.Linear(24, 24),\n        nn.ReLU(),\n        nn.Linear(24,\
    \ action_space)\n    )\n```\n\n此函数返回模型。\n\n## 工作原理\n\n在此秘籍中，我们定义了一个名为 `cartpole_model`\
    \ 的函数，该函数接受 `observation_ space` 和 `action_space` 参数，并返回一个神经网络模型。 在这里，我们使用了 `torch.nn`，`nn.Linear`\
    \ 和 `nn.ReLU` 中的 `Sequential` 模块来完成模型。 给定一个观察值，我们使用该模型来训练和预测每个动作的 `Q` 值。\n\n##\
    \ 更多\n\n我们还可以训练将状态作为图像并学习从图像预测 `Q` 值的模型。 完成此操作后，我们将使用 `nn.Conv2d()` 来使用卷积神经网络。\n\
    \n## 另见\n\n您可以在 [这个页面](https://pytorch.org/tutorials/intermediate/reinforcement_q_learning.html#q-network)\
    \ 上查看替代架构。\n\n# 实现 DQN 类\n\n## 准备\n\n在完成本秘籍之前，您应该完成本章的“OpenAI Gym 介绍 – Cartpole”秘籍，以便设置\
    \ `gym` 包。\n\n## 操作步骤\n\n在本秘籍中，我们将使用神经网络完成 `DQN`。 为此，我们将执行一些关键任务，包括创建目标和策略网络，损失函数和网络优化器，存储学习过程的状态和奖励，预测行为，经验回放以及控制学习过程。\
    \ 探索率。\n\n在本秘籍中，我们将研究可用于执行 `DQN` 的所有关键功能。 按着这些次序：\n\n1. 我们将从必要的导入开始：\n\n```\n\
    >>import random\n>>from collections import deque\n>>import numpy as np\n>>import\
    \ torch.optim as optim\n```\n\n2. 接下来，我们将定义 `DQN` 类：\n\n```\n>>class DQN:\n```\n\
    \n3. 然后，我们将定义构造器：\n\n```\n>>def __init__(self, observation_space, action_space):\n\
    \        self.exploration_rate = MAX_EXPLORE\n        self.action_space = action_space\n\
    \        self.observation_space = observation_space\n        self.memory = deque(maxlen=MEMORY_LEN)\n\
    ```\n\n4. 接下来，我们将定义 `target_net` 和 `policy_net`：\n\n```\nself.target_net = cartpole_model(self.observation_space,\
    \ self.action_space)\nself.policy_net = cartpole_model(self.observation_space,\
    \ self.action_space)\n```\n\n5. 现在，我们将复制权重：\n\n```\nself.target_net.load_state_dict(self.policy_net.state_dict())\n\
    self.target_net.eval()\n```\n\n6. 在这里，我们定义损失函数，优化器和限制标志：\n\n```\nself.criterion\
    \ = nn.MSELoss()\nself.optimizer = optim.Adam(self.policy_net.parameters())\n\n\
    self.explore_limit = False\n```\n\n7. 接下来，我们将定义 `load_memory` 方法：\n\n```\n>>def\
    \ load_memory(self, state, action, reward, next_state, terminal):\n        self.memory.append((state,\
    \ action, reward, next_state, terminal))\n```\n\n8. 现在，我们将定义 `predict_action`\
    \ 方法：\n\n```\n>>def predict_action(self, state):\n        random_number = np.random.rand()\n\
    \n        if random_number < self.exploration_rate:\n            return random.randrange(self.action_space)\n\
    \n        q_values = self.target_net(state).detach().numpy()\n        return np.argmax(q_values[0])\n\
    ```\n\n9. 现在，我们将跳至 `experience_replay` 方法：\n\n```\n>>def experience_replay(self):\n\
    \        if len(self.memory) < BATCH_SIZE:\n            return\n\n        batch\
    \ = random.sample(self.memory, BATCH_SIZE)\n```\n\n10. 现在，让我们使用批量更新 `Q` 值：\n\n\
    ```\nfor state, action, reward, next_state, terminal in batch:\n    q_update =\
    \ reward\n    if not terminal:\n        q_update = reward + GAMMA * self.target_net(next_state).max(axis=1)[0]\
    \ \n\n    q_values = self.target_net(state)\n    q_values[0][action] = q_update\n\
    ```\n\n11. 接下来，我们计算损失并更新权重：\n\n```\nloss = self.criterion(self.policy_net(state),\
    \ q_values)\nself.optimizer.zero_grad()\nloss.backward()\nself.optimizer.step()\n\
    ```\n\n12. 我们还将更新探索率：\n\n```\nif not self.explore_limit:\n    self.exploration_rate\
    \ *= EXPLORE_DECAY\n    if self.exploration_rate < MIN_EXPLORE:\n        self.exploration_rate\
    \ = MIN_EXPLORE\n        self.explore_limit = True\n```\n\n至此，我们完成了 `DQN` 课程。\n\
    \n## 工作原理\n\n在本秘籍中，我们完成了 `DQN` 类，并添加了所有必需的函数来训练 `DQN`。 在构造器中，我们初始化了探索的初始状态，观察空间和动作空间，然后定义了一个存储单元来保存\
    \ `DQN` 的经验。 我们创建了称为 `policy_net` 和 `target_net` 的软骨模型的两个实例。 我们需要两个网络，因为在训练的每个步骤中，`Q`\
    \ 网络的值都会移动，并且如果我们使用不断变化的目标值来调整我们的网络，则该网络可能会由于陷入此变化的目标与估计的 `Q` 值之间的反馈回路而变得不稳定。\
    \ 网络值。 如果发生这种情况，值估计将失去控制。 因此，我们使用了两个网络并将 `target_net` 保持在 `eval` 模式。 然后，我们使用 `MSELoss()`\
    \ 作为损失函数以及 `Adam` 优化器来更新权重。\n\n在 `load_memory()` 方法中，我们从环境中存储了状态，操作，奖励，下一个状态和终端，以用于训练网络。\
