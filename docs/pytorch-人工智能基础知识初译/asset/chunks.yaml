    \ 函数。\n\n# 六、探索生成对抗网络\n\n> 原文：[`gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/6.md`](https://gitee.com/apachecn/apachecn-dl-zh/blob/master/docs/pt-ai-fund/6.md)\n\
    \n`生成对抗网络`（`GAN`）是一种机器学习技术，其中同时训练两种模型：一种专门用于创建伪造数据，另一种专门用于区分真实数据和伪造数据。 真实数据。 术语*生成*反映了以下事实：这些神经网络用于创建新数据，而术语*对抗*来自以下事实：两个模型相互竞争，从而提高了生成的数据的质量。\n\
    \n`GAN` 中的两个模型称为生成器和判别器，其中生成器负责创建数据，判别器接收数据并将其分类为真实数据或由生成器生成。 生成器的目标是创建与训练集中的真实数据没有区别的数据样本。\n\
    \n我们可以用一个类比来理解 `GAN` 的概念，即犯罪分子（产生者）想要伪造金钱，而侦探（判别器）则试图抓住他。 假币的外观越真实，侦探在检测到假币时就必须越好，越高效，这意味着伪钞的质量必须提高到足以使侦探无法发现。\n\
    \n生成器从判别器的分类反馈中学习。 判别器的目标是确定其输入是真实的（来自训练数据集）还是伪造的（来自生成器），因此，每当辨别器将虚假图像分类为真实的错误时，生成器都会获得表现良好的正反馈。\
    \ 相反，每当判别器正确捕捉到生成器生成的图像为伪造图像时，生成器就会收到需要改进的反馈。\n\n判别器基本上是一个分类器，并且像任何分类器一样，它从真实标签（它在这种情况下是真实的或假的）中了解到其预测有多远。\
    \ 因此，随着生成器在生成逼真的数据方面变得更好，判别器在从真实标签中辨别伪造品方面也必须变得更好。 这样，两个网络都可以同时改善。\n\n从概念上讲，生成器必须能够从训练示例中捕获真实数据的特征，以使其生成的样本与真实数据无法区分。\
    \ 生成器自己学习创建模式（而不是识别图像分类问题中的模式）。 通常，生成器的输入通常是随机数的向量。\n\n让我们看一下 `GAN` 的以下架构图：\n\n\
    ![](img/8df18d86f9ee17f97933afaf6ef0b7cd.png)\n\n在此图中，有一个数据源，其中包含训练图像 `x`，生成器必须捕获其属性并重新创建。\
    \ 生成器接收随机向量 `z`，该向量充当生成器创建伪图像的种子。 生成器获取种子并生成 `x*` 图像，判别器从真实和虚假图像中获取图像，并输出给定​​输入为真实的概率（假设真实图像用\
    \ 1 表示，伪图像用 0 表示）。 然后，我们获得分类误差，并使用它来迭代训练判别器和生成器。 判别器的目的是使分类误差最小，而生成器的目的是使分类误差最大化。\n\
    \n从理论上讲，生成器和判别器达到平衡，其中生成器已捕获了生成的伪图像中真实图像的所有特征，而从进一步的训练中没有任何收获。 类似地，判别器只能以 50%\
