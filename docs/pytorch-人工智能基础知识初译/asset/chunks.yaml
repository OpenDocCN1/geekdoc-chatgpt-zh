    ```\n>>app = Flask(__name__)\n>>model = create_model()\n```\n\n0. 现在，让我们创建路由：\n\
    \n```\n>>@app.route('/predict', methods=['POST'])\n```\n\n1. 接下来，我们将编写一个将在此路由上调用的函数：\n\
