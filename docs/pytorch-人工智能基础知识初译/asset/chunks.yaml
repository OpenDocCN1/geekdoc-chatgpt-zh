    \n## 工作原理\n\n在此秘籍中，我们找到并训练了我们的模型。 为此，我们进行了导入，首先要确定模型并将模型分配给我们在计算机上拥有的适当设备。 我们使用\
    \ `model.to(device)` 方法移动模型，这比使用 `model.cuda()` 或 `model.cpu()` 更为优雅。\n\n然后，我们定义了损失函数，也称为\
    \ `criterion`。 由于这是一个分类问题，因此我们使用了交叉熵损失。 然后，我们选择 `SGD` 优化器在反向传播时更新模型权重，学习率为 0.01，并使用\
    \ `model.parameters()` 传入模型参数。 然后，我们将模型运行了 30 个周期，尽管我们可以选择任何合理的数目来执行此操作。 在循环中，我们将训练和验证损失重置为\
    \ 0，并将模型设置为训练模式，然后遍历训练数据集中的每个批量。 我们首先将批量移至设备，这样，如果我们的 GPU 内存有限，则并非所有数据都不会完全加载到\
    \ GPU 内存中。 然后，我们将输入张量传递到模型中，并获取输出，并将其传递到损失函数中，以评估预测标签和真实标签之间的差异。\n\n此后，我们使用 `loss.backward()`\
    \ 进行了反向传播，并使用 `optimizer.step()` 步骤更新了模型权重。 然后，我们使用总历时损失来汇总批量中的损失。 然后，我们使用 `model.eval()`\
    \ 将模型转换为评估模型，因为该模型的表现需要在验证集上进行评估，并且该模型在此阶段中不会学习，因此我们也需要关闭退出项。 遍历验证批量，我们获得了模型输出，并在整个周期累积了验证批量之间的损失。\
    \ 此后，我们格式化了模型表现，以查看每个周期模型的变化。 我们注意到，模型训练和验证损失随时间的推移而减少，这表明模型正在学习。\n\n## 更多\n\n\
    我们已经运行了训练过的模型，我们需要根据保持数据或测试数据（即该模型尚未看到的数据）评估模型。 通过这样做，我们可以评估模型的真实表现。 为此，您将必须进入模型测试批量，并且对于每个批量，必须执行\
    \ `_, prediction = torch.max(output, 1)` 将 softmax 概率转换为实际预测，并使用 `prediction.eq(target.data.view_as(prediction))`\
    \ 将预测与真实输出标签进行比较，其中我们确保预测张量和输出张量的尺寸相同。 这将返回一个张量，其中匹配的张量为 1，不匹配的张量为 0。 我们可以使用它来计算每个批量中模型的准确率，并将其汇总到整个测试数据集中。\n\
