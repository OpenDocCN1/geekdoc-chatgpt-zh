    \ 其余训练与我们在第 3 章，“用于计算机视觉的卷积神经网络”中看到的内容相同，我们在其中训练了卷积神经网络。\n\n## 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/nn.html#lstm)上了解有关\
