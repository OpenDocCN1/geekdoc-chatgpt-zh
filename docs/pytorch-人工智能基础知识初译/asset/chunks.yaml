- raw: "在本秘籍中，我们将研究如何将图像数据从文件加载到张量中。 在本秘籍中，我们将使用 CIFAR-10 数据集，该数据集由数据集中 10 个类别中的每个类别的\
    \ 60,000 个`32 x 32`像素彩色图像组成。 这些类别是飞机，汽车，鸟，猫，鹿，狗，青蛙，马，船和卡车。\n\n# 准备\n\n我们将使用`torchvision`加载数据。\
    \ CIFAR-10 可以作为`torchvision`中的数据集使用。 您应该已经安装了`torchvision`。 如果没有，则可以使用以下代码进行安装：\n\
    \n```\npip install torchvision==0.x.x\n```\n\n有了这个设置，我们很高兴选择这个秘籍。\n\n# 操作步骤\n\n\
    在此秘籍中，我们将在 PyTorch 中加载 CIFAR-10 数据集：\n\n1.  我们将从`torchvision`导入`datasets`模块：\n\
    \n```\n>>from torchvision import datasets\n```\n\n2.  然后，我们将导入`transforms`模块：\n\
    \n```\n>>from torchvision import transforms\n```\n\n3.  然后，我们将创建一个转换管道：\n\n```\n\
    >>transformations = transforms.Compose([\n    transforms.RandomHorizontalFlip(),\n\
    \    transforms.RandomRotation(20),\n    transforms.ToTensor(),\n    transforms.Normalize((0.5,\
    \ 0.5, 0.5),(0.5, 0.5, 0.5))\n])\n```\n\n4.  接下来，我们将使用数据集模块创建训练数据集：\n\n```\n>>train_data\
    \ = datasets.CIFAR10('CIFAR10', train=True, download=True, transform=transformations)\n\
    ```\n\n5.  同样，我们将创建一个测试数据集：\n\n```\n>>test_data = datasets.CIFAR10('CIFAR10',\
    \ train=False, download=True, transform=transformations)\n```\n\n6.  现在，我们可以检查训练和测试数据集的长度：\n\
    \n```\n>>len(train_data), len(test_data)\n(50000, 10000)\n```\n\n7.  现在，我们将从训练集中创建一个验证集；\
    \ 为此，我们将从`torch`模块进行导入：\n\n```\n>>from torch.utils.data.sampler import SubsetRandomSampler\n\
    ```\n\n8.  我们将选择 20% 的训练数据作为验证数据：\n\n```\n>>validation_size = 0.2\n```\n\n9. \
    \ 现在，我们将导入`numpy`：\n\n```\n>>import numpy as np\n```\n\n0.  然后，我们将获得训练数据的大小：\n\
    \n```\n>>training_size = len(train_data)\n```\n\n1.  接下来，我们创建一个索引列表：\n\n```\n\
    >>indices = list(range(training_size))\n```\n\n2.  然后，我们将重新整理索引列表：\n\n```\n>>np.random.shuffle(indices)\n\
    ```\n\n3.  之后，我们将获得索引以拆分验证和训练数据集：\n\n```\n>>index_split = int(np.floor(training_size\
    \ * validation_size))\n```\n\n4.  然后，我们将获得训练和验证集索引：\n\n```\n>>validation_indices,\
    \ training_indices = indices[:index_split], indices[index_split:]\n```\n\n5. \
    \ 现在，我们将使用来自割炬的子集随机采样器：\n\n```\n>>training_sample = SubsetRandomSampler(training_indices)\n\
    >>validation_sample = SubsetRandomSampler(validation_indices)\n```\n\n6.  接下来，我们将数据集分成多个批量。\
    \ 我们将批量大小设置为 16：\n\n```\n>>batch_size = 16\n```\n\n7.  然后，我们将在 PyTorch 中使用`dataloader`模块将数据批量加载：\n\
    \n```\n>>from torch.utils.data.dataloader import DataLoader\n```\n\n8.  然后，我们将创建训练，验证和测试数据集批量：\n\
    \n```\n>>train_loader = DataLoader(train_data, batch_size=batch_size, sampler=training_sample)\n\
    >>valid_loader = DataLoader(train_data, batch_size=batch_size, sampler=validation_sample)\n\
    >>test_loader = DataLoader(train_data, batch_size=batch_size)\n```\n\n这样，我们已经加载了数据并对其进行了预处理，以便可以将其发送到模型进行训练。\n\
    \n# 工作原理\n\n在此秘籍中，我们使用了 PyTorch 中的`datasets`模块来获取 CIFAR10 数据集。 然后，我们定义了对数据集中的图像有意义的转换，这些图像是与\
    \ 10 个不同类别相对应的动物的图像。 我们对某些图像进行了水平翻转，并随机对某些图像进行了旋转，范围为 -20 至 20 度。\n\n但是，我们没有添加垂直翻转，因为我们预计在评估阶段不会有动物的上下颠倒的图像输入到模型中。\
    \ 之后，我们使用`ToTensor()`变换将图像转换为张量。 准备好张量后，我们使用`Normalize()`变换分别为红色，绿色和蓝色通道中的每一个设置了均值和标准差。\
    \ 之后，我们在数据集中使用`CIFAR10()`方法来使用 CIFAR10 数据集。 然后，将`download`参数设置为`True`，以便如果根目录`CIFAR10`（第一个参数）中不存在数据集，则将其下载并保存在该目录中。\n\
    \n对于训练数据，我们将`train`参数设置为`True`，并使用`transform`参数传递了要应用于数据的转换。 这使我们能够动态创建图像而无需显式创建新图像。\
    \ 现在，为了准备测试数据，我们将`train`参数设置为`False`。 我们将训练和测试数据集的大小分别设置为 50,000 和 10,000。 然后，我们使用训练集的\
    \ 20%（由`validation_size`定义）从训练集准备了验证集。 我们随机选择了 20% 的训练集来创建验证集，以使验证集不会偏向特定类别的动物。\
    \ 然后，我们使用训练集的大小，并使用 Python 中的`range()`准备了索引列表。\n\n然后，我们使用`numpy`中的`random.shuffle()`方法对索引列表进行混排。\
    \ 指标列表随机化后，我们将指标的前 20% 移至验证集，将其余 80% 的指标移至训练集。 我们通过将原始训练量乘以原始训练集的百分比用作验证集来找到分割索引。\
    \ 我们使用`split_index`进行拆分。 然后，我们使用`torch.utils.data`中的`SubsetRandomSampler()`方法从给定的索引列表中随机抽取元素，而不进行替换。\
    \ 最后，我们使用`DataLoader()`组合了数据集和采样器，以对数据集进行迭代。 然后，我们将数据加载器用于训练，验证和测试集，以在训练模型时对数据进行迭代。\n\
    \n# 更多\n\n`DataLoader()`模块中还有许多函数-例如，`DataLoader()`可用于多进程数据加载，而`num_workers`控制在加载数据时要使用的子进程数。\
    \ 在我们的示例中，我们使用了默认值`0`，这意味着数据已在主进程中加载​​，这对于小型数据集是理想的选择，并为我们提供了更具可读性的错误跟踪。\n\n#\
    \ 另见\n\n您可以在[这个页面](https://pytorch.org/docs/stable/data.html#module-torch.utils.data)上了解有关数据加载工具的更多信息。\n\
    \n# 定义 CNN 架构\n\n到目前为止，在本章中，我们一直在研究 CNN 的不同组成部分，以及如何将数据集中的数据加载到可以馈入 CNN 模型的格式中。\
    \ 在本秘籍中，我们将通过到目前为止已经看到的完成模型的组件来定义 CNN 模型架构。 这与我们在第 2 章，“处理神经网络”中介绍的全连接神经网络非常相似。\
    \ 为了更好地理解此秘籍，从第 2 章，“处理神经网络”修改全连接神经网络的模型定义将是一个好主意。 我们将在 CIFAR10 数据集上建立图像分类模型，我们在“加载图像数据”秘籍中对此进行了讨论。\n\
    \n# 操作步骤\n\n我们将在此秘籍中完成模型类的定义：\n\n1.首先，我们将导入`nn.Module`和`torch`函数式 API：\n\n```\n\
    >>import torch.nn as nn\n>>import torch.nn.functional as F\n```\n\n2.然后，我们将编写一个继承自`nn.Module`的类：\n\
    \n```\n>>class CNN(nn.Module):\n```\n\n3.然后我们将定义我们的`__init__()`：\n\n```\n>>def\
    \ __init__(self):\n    super().__init__()\n```\n\n4.现在，我们将在`__init__()`中定义我们的卷积层：\n\
    \n```\n    self.conv1 = nn.Conv2d(3, 16, 3, padding=1)\n    self.conv2 = nn.Conv2d(16,\
    \ 32, 3, padding=1)\n    self.conv3 = nn.Conv2d(32, 64, 3, padding=1)\n    self.pool\
    \ = nn.MaxPool2d(2, 2)\n    self.linear1 = nn.Linear(64 * 4 * 4, 512)\n    self.linear2\
    \ = nn.Linear(512, 10)\n    self.dropout = nn.Dropout(p=0.3)\n```\n\n5.我们的下一步是编写`forward()`方法：\n\
    \n```\n>>def forward(self, x):\n    x = self.pool(F.relu(self.conv1(x)))\n   \
    \ x = self.pool(F.relu(self.conv2(x)))\n    x = self.pool(F.relu(self.conv3(x)))\n\
    \    x = x.view(-1, 64 * 4 * 4)\n    x = self.dropout(x)\n    x = F.relu(self.linear1(x))\n\
    \    x = self.dropout(x)\n    x = self.linear2(x)\n    return x\n```\n\n6.现在我们的\
    \ CNN 类已经完成，我们可以实例化我们的模型类：\n\n```\n>>model = CNN()\n>>model\nCNN(\n  (conv1):\
    \ Conv2d(3, 16, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (conv2):\
    \ Conv2d(16, 32, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (conv3):\
    \ Conv2d(32, 64, kernel_size=(3, 3), stride=(1, 1), padding=(1, 1))\n  (pool):\
    \ MaxPool2d(kernel_size=2, stride=2, padding=0, dilation=1, ceil_mode=False)\n\
    \  (linear1): Linear(in_features=1024, out_features=512, bias=True)\n  (linear2):\
    \ Linear(in_features=512, out_features=10, bias=True)\n  (dropout): Dropout(p=0.3)\n\
