  fmt: "\n# 加载图像数据\n\n在本秘籍中，我们将研究如何将图像数据从文件加载到张量中。 在本秘籍中，我们将使用 `CIFAR-10` 数据集，该数据集由数据集中\
    \ 10 个类别中的每个类别的 60,000 个 `32 x 32` 像素彩色图像组成。 这些类别是飞机，汽车，鸟，猫，鹿，狗，青蛙，马，船和卡车。\n\n\
    ## 准备\n\n我们将使用 `torchvision` 加载数据。 `CIFAR-10` 可以作为 `torchvision` 中的数据集使用。 您应该已经安装了\
