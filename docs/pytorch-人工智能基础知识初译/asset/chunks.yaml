    \ 至此，我们已经完成了 `DQN` 类的所有函数。\n\n## 更多\n\n您可以在 `DQN` 类中添加一种方法，以用策略网络更新目标网络的权重。\n\n\
    ## 另见\n\n您可以在 [这个页面](https://github.com/gsurma/cartpole/blob/master/cartpole.py)\
    \ 上的 Keras 中查看此实现。\n\n# 训练 DQN\n\n## 操作步骤\n\n在此秘籍中，我们将完成训练 `DQN` 增强算法的过程，并在训练模型后可视化我们的小车。\
    \ 我们将使用 `DQN` 类来预测操作并将该操作应用于环境以获得奖励。 此秘籍的目的是使奖励最大化。 我们将使用经验回放来训练我们的模型以预测 `Q` 值。\n\
    \n在本秘籍中，我们将继续使用 “`DQN` 类” 秘籍。 按着这些次序：\n\n1. 首先，我们需要导入 `gym`：\n\n```\n>>import\
    \ gym\n```\n\n2. 接下来，我们需要初始化常量和环境：\n\n```\n>>ENV_NAME = \"CartPole-v1\"\n>>BATCH_SIZE\
    \ = 20\n>>GAMMA = 0.95\n>>LEARNING_RATE = 0.001\n>>MAX_EXPLORE = 1.0\n>>MIN_EXPLORE\
    \ = 0.01\n>>EXPLORE_DECAY = 0.995\n>>MEMORY_LEN = 1_000_000\n>>UPDATE_FREQ = 10\n\
    ```\n\n3. 现在，我们需要初始化环境和 `DQN`：\n\n```\n>>env = gym.make(ENV_NAME)\n>>observation_space\
    \ = env.observation_space.shape[0]\n>>action_space = env.action_space.n\n>>dqn\
    \ = DQN(observation_space, action_space)\n```\n\n4. 现在，让我们开始训练循环：\n\n```\n>>for\
