    \n## 创建一个 TorchScript\n\n`TorchScript` 为最初用 `PyTorch` 编写的模型提供中间表示。 这样，您就可以在高性能环境（例如\
    \ C++）中运行模型。 `TorchScript` 通过 `PyTorch` 代码创建模型的可序列化和优化版本。 使用 `TorchScript` 编写的代码可以加载到进程中，而无需任何\
    \ Python 依赖项。 `TorchScript` 提供了可用于捕获模型定义的工具，而 `PyTorch` 具有动态和灵活的特性，因此足以支持此定义。\
    \ 可以通过两种方式创建 `TorchScript`：跟踪或使用脚本编译器。 在本秘籍中，我们将使用跟踪和脚本编译器将 `PyTorch` 模型转换为 `TorchScript`。\n\
    \n### 操作步骤\n\n在此秘籍中，我们将创建一个 `TorchScript`。 请按照以下步骤操作：\n\n1. 首先，我们将编写一个简单的网络：\n\
    \n```\n>>import torch\n>>import torch.nn as nn\n>>class MyCell(torch.nn.Module):\n\
    \      def __init__(self):\n          super(MyCell, self).__init__()\n       \
    \   self.linear = torch.nn.Linear(4, 4)\n\n      def forward(self, x, h):\n  \
    \        new_h = torch.tanh(self.linear(x) + h)\n          return new_h\n```\n\
    \n2. 接下来，我们将根据模型类创建一个模型：\n\n```\n>>my_cell = MyCell()\n```\n\n3. 然后，我们将生成两个随机张量传递给模型：\n\
    \n```\n>>x, h = torch.rand(4, 4), torch.rand(4, 4)\n```\n\n4. 接下来，我们可以`jit.trace`：\n\
    \n```\n>>traced_cell = torch.jit.trace(my_cell, (x, h))\n>>traced_cell\n\nTracedModule[MyCell](\n\
    \  original_name=MyCell\n  (linear): TracedModule[Linear](original_name=Linear)\n\
    )\n```\n\n5. 然后，将张量传递给`traced_cell`：\n\n```\n>>traced_cell(x, h)\n\ntensor([[\
