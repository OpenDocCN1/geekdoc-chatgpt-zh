    _31486679\\_90\"/> \n\n小度智能音箱大金刚及其控制家电的场景，来自小度商城官网\n\n高级AI产品经理应该跳出AI的圈子，毕竟AI技术只是产品的构成要素之一，而不是全部。高级AI产品经理要用好AI能力，发挥AI价值，而不是被AI束缚。\n\
    \n2\\. 医疗影像跳出AI圈子的例子\n\nAI是我们的视角和出发点，但如果始终不改变视角，它就会成为一种限制。例如，医疗影像领域的AI应用多数将自己局限在AI本身。很多公司都推出了AI医疗影像辅助诊断产品，结果产生一个问题：同质化严重，众多公司的产品针对同一个病种的系统差别很小。\n\
    \n除了打造更好的AI医疗影像辅助诊断产品，高级AI产品经理可以跳出AI的圈子，看到更大的场景，站在更高的层次去规划产品。\n\n目前，我国的医院影像正在从实体胶片向数字化过渡。规模较大的医院处于领先地位，普遍已经有医疗影像系统。医疗影像系统属于医疗信息化范畴，并不属于AI范畴。但如果我们跳出AI的圈子，把医疗影像信息化也纳入视野，思路可能就打开了。按这个思路，如果一家AI技术公司要进入医疗影像市场，除了前面提到的常规方式，还可以这样做。\n\
