    ## 第11章 高级AI产品经理的能力体系


    ### 11.1 高级AI产品经理的能力杠铃模型


    #### 11.1.1 高级AI产品经理的能力杠铃模型的整体结构


    与合格AI产品经理的能力杠铃模型相比，高级AI产品经理的能力杠铃模型有了全面的提升，不仅增加了更多的能力项，原有能力项的含义也有了升级。


    高级AI产品经理的能力杠铃模型由三大部分构成。


    1. 处于中心位置的杠铃，由杠铃杆和两端的杠铃片组成

    从左往右依次是商业理解、AI技术—场景洞察、需求管理、AI产品规划、商业模式设计、运营互动。我们知道，真实的杠铃无论多重，运动员都是抓住杠铃杆把整个杠铃举起来的。所以，高级AI产品经理必须要做而且要做好需求管理和AI产品规划。前面的商业理解和AI技术—场景洞察可以提升需求管理和AI产品规划的层次；后续的商业模式设计和运营互动可以更好地落实需求管理和AI产品规划，实现产品的价值。


    2. 和杠铃平行的跨域产品借鉴和数据布局

    跨域产品借鉴和数据布局与杠铃平行，表明这两项能力可以支撑、服务于高级AI产品经理的核心工作。做好跨域产品借鉴和数据分布，不仅有助于提升高级AI产品经理的商业理解与AI技术—场景洞察能力，还能指导高级AI产品经理做好商业模式设计和运营互动。


    3. 顶部的思维、影响

    思维和影响发挥着顶层作用，深刻影响着其下方的其他能力项。理解、洞察、设计、互动、借鉴、布局，这些能力都是以思维能力为基础的。思维能力确定了其他能力的上限。影响力，简单地说就是影响他人的能力。高级AI产品经理几乎在每一个工作环节都需要和他人打交道，获得他人的支持，只有这样才能把产品做好。所以，其影响力的强弱直接决定其他能力的发挥程度。


