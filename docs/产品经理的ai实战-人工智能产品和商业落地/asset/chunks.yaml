    基于AI技术的全新产品是两类公司都有可能涉及的产品。所以，AI技术公司可能需要重新界定自己的竞争对手。如果一直做AI技术的中间产品，那么竞争对手只是其他AI技术公司；如果要做基于AI技术的全新产品，可能就要应对新的竞争对手。\n\
    \n#### 4.1.5 AI产品中AI能力的分布方式\n\nAI产品必定包含AI能力，AI能力既可以分布在云端又可以分布在终端。AI能力在云端与终端的分布有多种模式，下图为3种基本模式。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_55)\n\nAI产品中AI能力分布的3种基本模式\n\
    \n如上图所示，“云+端”模式是最常见的，云端与终端均有一定的AI能力，在这种模式下，两端的AI能力协调发挥作用。当前大多数AI产品采用的就是这种模式。\n\
    \n在纯云模式下，终端几乎没有AI能力，只起到向云端传递信息并从云端获取指令的作用，AI能力完全来自云端。这种AI产品一旦断网基本无法使用。典型的就是天猫精灵、小度等智能音箱。我的天猫精灵一旦断网，无论我如何呼唤“天猫精灵”，它都只会回答我“网络连接失败”。可见，它采用的模式就是纯云模式。\n\
    \n纯云模式下的AI产品还有一种情况，就是AI技术公司的能力封装型中间产品。这种产品以SaaS（一种软件布局模型）的形式提供AI能力，供客户远程调用。\n\n\
    在纯端模式下，AI能力直接存在于终端，终端有AI芯片，直接运作终端推理工作。纯端模式通常也存在云端，但是云端不是和终端实时互联的。云端通常承担着持续训练模型的任务。在训练完新的模型之后，云端可以通过离线的方式对终端的AI能力进行升级。当前有些工业检测用的AI产品、医疗AI产品采用的就是这种模式。\n\
    \n规划AI产品时，云端与终端配合的方式是规划的内容之一。这3种[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)基本模式各有其不同的适用场景，AI产品应该根据场景特征选择合适的方式。以人脸识别为例，介绍一下这3种模式的区别。\n\
    \n人脸考勤和门禁一体机通常采用的是纯端模式。其只需要利用一体机本地内嵌的芯片解读获取的人脸信息。这种方式不需要实时连接云端AI，使用成本低（只需要很少的电费而不需要服务费），速度也很快。\n\
    \n“普通摄像机+云端人脸识别”就是纯云模式。普通的数字摄像机不是为人脸识别定制的，它只是将包括人脸在内的画面以帧的方式记录下来。这种终端设备不具备AI能力，AI能力完全在云端。运用这种模式的AI产品需要将摄像机拍摄的画面上传到云端，在云端进行人脸识别。这种方式产生了庞大的数据传输量，同时对云端AI的算力要求也非常高。\n\
