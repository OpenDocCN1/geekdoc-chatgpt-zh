- raw: "出于管理需要，零售企业在每天营业结束后会要求每个网点上报营业数据。最初，大多数网点都只能通过打电话的方式上报数据，少数网点可能会通过传真的方式上报数据。在接到各个网点汇报的数据后，零售企业的总部或区域总部需要人工对数据进行统计和汇总最后再汇报给高管。因为数据延迟比较严重，所以高管通常要等到第二天上午才能收到汇总数据，这对公司管理是非常不利的。\n\
    \n后来，2G时代到来了，出现了短信技术。有公司看到了短信技术的特点和价值，并以此为基础打造出相应的产品，满足了零售企业及时报送数据的需求。各网点经理在每天营业结束后，根据事先规定的格式通过短信上报关键数据（1条或多条），之后系统会自动汇总（这个过程无人工差错），最后通过短信将汇总数据发给高管（如大区总监）。因此，高管通过一部功能手机就能及时掌握营业数据。如果数据异常，高管马上就能通过电话与相关方面进行初步沟通，第二天一早高管就能立即召开有数据支撑的营业会议。\n\
    \nAI技术虽然比短信技术更复杂、更强大，但其中的道理是相同的，技术必须通过产品来发挥作用。要想发挥AI技术的价值，好的产品是不可或缺的。\n\n####\
    \ 1.3.5 商业模式之拱\n\n紧靠产品之拱的是商业模式之拱，只有产品之拱和商业模式之拱都建成了，应用之桥才能畅通，技术此岸和场景彼岸才能连通。在X技术商业中，商业模式的价值比在传统行业中更加重要。\n\
    \n以中文搜索为例。百度打造了优秀的中文搜索产品，但如果它没有快速找到搜索结果竞价排名的商业模式，就不可能取得后来的巨大成就，也就没有成为AI时代领先企业的基础。\n\
    \n字节跳动公司的快速崛起，不仅在于它打造了今日头条、抖音等特别适合广大移动用户的产品，还在于其充分利用了“第三方内容生产+信息流广告”的双平台商业模式。曾经占据互联网行业统治地位的门户模式之所以衰落，是因为门户模式需要庞大的编辑团队，不仅成本高，而且内容的数量、多样性也受限。因此，依靠第三方生产内容的模式比门户模式更有竞争力。所以说门户模式衰落的根源在于它的商业模式。\n\
    \n产品和商业模式是紧密相连的，产品需要相应的商业模式以更好地发挥价值，商业模式也需要好产品为其提供支撑。\n\n反[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)思2016年至2018年的AI应用，可以从中得出一个深刻启示——不能只重技术而忽视产品和商业模式。要想在今后更好地推进AI技术落地应用，AI技术公司在继续改进技术的同时，还要将产品、商业模式这两块短板尽快补上。\n\
    \n#### 1.3.6 技术、产品与商业模式互相助力\n\n技术、产品与商业模式三者之间可以互相助力，发挥协同作用。\n\n技术如果比较弱，是不是就不能应用了？其实，技术本身是在不断进步的，而尽快投入使用也有利于技术的进步。一个迟迟不能落地应用的技术，很快就会陷入停滞状态。\n\
    \n产品从弱到强通常要经历一个过程，在产品还不够强大的时候，AI技术公司可以借助商业模式的力量。亚马逊、Google和苹果都推出了独立于电脑使用的智能音箱，那我国企业的智能音箱如何与这些产品竞争呢？更好的技术、更好的产品需要较长时间的积累和打磨，我国的智能音箱企业在持续升级产品的同时，还利用了商业模式来助力。\n\
    \n美国的3家企业的智能音箱售价都很高，当然这种商业模式也有其优点——每售出一台智能音箱，企业就能获得较高的利润。我国企业改变了智能音箱的商业模式，大幅降低了智能音箱的售价。现在，智能音箱的实际体验效果低于企业宣传的效果，其只能在点歌、简单信息查询等少数场景中应用，但因为它价格便宜，用户也就没有太多意见了。这样的商业模式能够快速获得大量用户持续使用，这些大量用户的持续使用实际上就是在帮助智能音箱企业训练模型。事实上，这种商业模式已经取得了阶段性成功，我国的智能音箱市场基本是我国企业的市场，而美国3家企业的智能音箱在我国智能音箱市场的保有量都很低。\n\
    \n关于技术、产品和商业模式互相助力，有一个知名的案例——静电复印机。目前采用静电复印技术的复印机是在20世纪50年代正式走向市场的。当时，市场上有两种主流的复印技术——光影湿法技术和热干法技术。这两种技术的共同缺点是复印质量差、速度低、无法持久保存。新发明的静电复印技术在这几个方面全面超越了旧技术。其发明人切斯特·卡尔森及合作公司信心满满地寻找柯达、GE（通用电气公司）、IBM（国际商业机器公司）合作，但都被拒绝了。因为采用这项新技术的产品——静电复印机的生产成本高达2000美元，而当时采用光影湿法技术和热干法技术的复印机售价只有300美元左右，相比之下静电复印机的成本确实太高了。\n\
    \n想要解决这个问题，就需要促使技术进步并降低成本。但这需要一个长期的过程，而且如果没有产品的大量销售，完全依靠技术进步来大幅降低成本是非常困难的。这时，商业模式发挥了重要作用，发明人的合作公司没有放弃，设计出了创新的租赁商业模式。企业用户不用一次性付出太多的钱来购买昂贵的静电复印机，而是通过租赁方式支付租金。当成本的障碍变小了，新技术本身的优点就会凸显出来。设计这种商业模式的公司就是施乐公司。该公司依靠技术、产品与商业模式的互相助力[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)，使年收入有了飞跃式增长，并快速跻身财富500强。\n\
    \n再举近一点的例子——数字音乐播放器。韩国公司发明了它，但在很长时间内它的销量并不多。苹果的iPod后来居上取得了巨大成功，其成功不仅在于其明显的产品优势，还在于它的商业模式。苹果公司通过封闭的iTunes音乐商店同时解决了困扰数字音乐产业的两个大问题：使用户能方便地获得高品质的音乐；使唱片公司能从音乐数字化中获得利益。第一代iPod如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_19)\n\n第一代iPod\n\n在数字化浪潮中，此前唱片公司的利益处于被颠覆、被忽略的地位，因此他们发起了多起诉讼，导致数字音乐这个市场一直做不大。\n\
    \n苹果公司的商业模式充分考虑了唱片公司的利益。苹果公司在iTunes商店中以99美分一首歌的价格销售正版音乐，并直接向用户收费，而其获取的大部分收益属于唱片公司。有了一部iPod再加上配套的iTunes，用户只需要支付很少费用就能源源不断地享受正版音乐。“好的产品+合适的商业模式”让苹果公司大获成功。其后的“iPhone+App\
    \ Store”复制了这种商业模式，也同样获得了成功。\n\n当前，AI业界的普遍情况——重视技术、轻视产品、忽视商业模式，不能实现技术、产品与商业模式的互相助力。AI产品经理只有重视技术、产品、商业模式的互相助力，才能推动AI应用走出困局。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 1.4 技术—场景、产品与商业模式的对比案例\n\n列举了很多互联网的案例，我们来看看AI领域的案例。这次我们在同一个技术—场景中，横向对比不同的产品和商业模式。\n\
    \n实时翻译领域的人工智能涉及三大核心AI技术：语音识别、机器翻译和语音合成。即使采用同样的核心技术，满足同样的需求，不同的企业在产品、商业模式上也可能会有很大区别。所以，从技术到产品再到商业模式的过程中存在很多的可能性。\n\
    \n先来看Google，该公司在2017年发布了自己的翻译产品Pixel Buds（谷歌的一款耳机）。Pixel Buds耳机和Pixel手机如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_20)\n\nPixel Buds耳机和Pixel手机\n\
    \n该耳机需要通过蓝牙连接Google自有的Pixel手机，并配合手机App使用，其可以在40种语言之间进行实时同声传译。两个人分别带上这款耳机，并启动手机上的翻译软件，机器会立刻将你的语言翻译成另一种语言，通过耳机播放给对方。这不仅使两种语言者之间的多轮对话变得更加方便，还可以“解放”双手以辅助交流。\n\
    \nPixel Buds耳机不仅设计得很漂亮，而且佩戴舒适。左右耳机之间有实体连线，使耳机不易丢失。Google在商业模式上有很多考量。它的定价比较高，159美元的定价直接瞄准了苹果的Apple\
    \ AirPods的定价。但Pixel Buds耳机只能和Google自己的Pixel手机配套使用。Google在2016年10月发布了Pixel手机，虽然它没有在中国正式发布，但在其美国市场却有较高的保有量。\n\
    \n再看同样是利用AI实时翻译技术，满足不同语言者之间的翻译需求，科大讯飞采用的是不同的产品策略。科大讯飞推出的是一个独立设备——手持翻译机。两个人在对话时，一人对着翻译机说出自己的想说的话，翻译机就会将其翻译成对方的语言，并播放出来。如此交替，即可完成两种语言的多轮对话。科大讯飞翻译机3.0如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_21)\n\n科大讯飞翻译机3.0，来自科大讯飞官网\n\
    \n特别值得一提的是，科大讯飞翻译机的离线翻译能[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)力也很强。毕竟一个人身在异乡会遇到各种问题，而离线可能就意味着你与他人的沟通桥梁被中断了。例如，有人在异国他乡迷路了，他看不懂指路牌也无法和路人对话。基于手机App的翻译机往往不能胜任这样的场景，这时离线可用的翻译机的价值就体现出来了。\n\
    \n使用Google的产品，只有对话双方都有Pixel手机和Pixel Buds耳机才能实现交流。而使用科大讯飞的产品，对话的两人中只需要一个人有翻译机就可以实现交流。因此，科大讯飞的产品能适应的场景更多。\n\
    \n科大讯飞不仅产品不同于Google，其商业模式也与Google不同。科大讯飞并没有手机业务，所以它不需要考虑手机市场的问题。它可以直接售卖能独立使用的设备，与用户的手机无关。\n\
    \n再看一家公司——深圳时空壶公司，该公司也有蓝牙耳机版本的翻译机。其产品的独特之处在于：一个耳机盒里有两个耳机，分别是主机和客机。使用者在使用该产品时，需要自己带上主机，让对方带上客机，就能开始对话，对话结束后收回客机即可。这个产品特征与Google、科大讯飞的产品特征都不同。\n\
    \n不仅如此，该公司还有一个更特别的产品——ZERO。如下图所示，插在手机底部的小设备就是ZERO，手机屏幕上显示的是配套的App。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_22)\n\
    \n插在手机底部的ZERO\n\nZERO是一个很小的设备，可以直接插在手机上，与相应的App配套使用就能进行实时翻译。这个产品在众筹平台INDIEGOGO发起众筹后，受到了全球用户的热烈追捧。\n\
    \n我们可以看到，在同样的技术—场景中，可以有多种产品和商业模式，所以仅有技术是不足以推进落地应用的。技术的落地应用需要技术、产品与商业模式的互相助力，这是AI行业要特别重视的问题。\n\
    \n只有选对技术—场景，建好产品之拱和商业模式之拱，应用之桥才能畅通。众多的案例为我们提供了很多宝贵的经验，本书的内容也主要是为了帮助AI产品经理做好这三件事。只有做好了这三件事，AI应用才能顺畅，AI企业才可能取得商业上的成功。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n## 第2章 快速理解AI技术的实质和边界\n\n### 2.1 产品经理要真正地懂技术\n\
    \nAI技术能力是AI产品经理能力体系中一项不可或缺的能力。\n\n#### 2.1.1 从事技术商业必须懂技术\n\n从事技术商业的任何人都要懂技术，其中也包括产品经理。\n\
    \n1\\. 技术是产品的约束条件\n\n技术商业中的产品是基于技术的，因此技术就成了产品的约束条件。规划产品、设计商业模式不是天马行空的艺术创作，而是带着几副“镣铐”跳舞，而且还要跳得精彩。其中，技术就是其中的一副“镣铐”，我们规划产品必须要考虑技术能否实现，以及实现它所需要的成本。\n\
    \n产品经理在进行产品规划时，就需要做出基本判断——这项技术是否可行，其难度大小及大致成本。如果不懂技术，就很难做出这个判断。这就可能出现在规划完成之后，才发现技术上有问题，从而不得不重新进行产品规划的情况。\n\
    \n如果非技术人员对于技术不了解，就会产生很多误解。非技术人员往往认为技术很简单，由此会和技术人员产生很多冲突。例如，一项产品要用到图像识别功能，一些不熟悉该技术的产品经理会认为现在的图像识别技术已经很成熟了，实施起来应该会很快。图像识别的技术确实比较成熟了，但根据具体产品的不同应用场景，AI技术人员要针对产品做很多技术工作，只有这样才能让技术真正为产品服务。\n\
    \n以工业质检为例，产品经理规划的质检AI产品可以用来代替人工质检。该产品需要采用图像识别技术，让机器来识别工业产品的缺陷。虽然图像识别技术已经比较成熟，但要从技术上真正解决这个问题并不简单，接下来通过两个问题进行具体说明。\n\
    \n（1）每一种工业产品可能出现的缺陷是不同的。为了让机器能正确识别这些缺陷，就要采用监督的学习方式，教会机器正确识别各种类型的缺陷。这就需要开发配套的训练系统，这个训练系统的用户是质检工人。该训练系统需要质检工人准备大量存在缺陷的产品图片，并将图片中的缺陷标注出来，从而教会机器“认识”各种类型的缺陷。\n\
    \n（2）复杂的光学问题。工业产品的缺陷情况很复杂，有些缺陷只有[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)在特定角度用一定强度的光照才能发现。以手机为例，手机背面一个很浅的划痕只在一个特定的角度观察才能发现，这就涉及复杂的光学问题。针对这个问题，技术人员需要结合具体工业产品的特点设计光学系统，选用合适的光源并以合适的角度将摄像头布置在合适的位置，具体如下图所示。只有摄像头“捕捉”到了缺陷，机器才可能“辨认”出缺陷。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_23)\n\n图中AI质检系统的光学系统是特别定制开发的，车马拍摄\n\
    \n这里举的都是比较容易理解的例子，很多场景中的情况更加复杂。所以说，如果产品经理不懂技术，就很难规划出好的技术产品。\n\n2\\. 技术是产品经理与技术人员顺畅沟通的必要条件\n\
    \n既然产品规划要靠技术来实现，这就需要产品经理和技术人员进行交流。领先的产品规划常常会临近技术的边界，这对技术人员是一个挑战。产品经理只有懂技术才能和技术人员进行有效沟通。\n\
    \n在产品经理和技术人员交流需求时，技术人员经常说这样的话：\n\n（1）“这个需求表述得不清楚，我们技术人员不明白，所以无法施行。”\n\n（2）“这个需求在技术上不可行。”\n\
    \n（3）“这项技术难度很大，我们的人手、时间都不够。”\n\n如果产品经理完全不懂技术，产品规划要么就只能在技术人员的压力下做出退让，导致产品竞争力锐减；要么就会导致无意义的争吵。如果产品经理懂技术，就可以这样回应对方：\n\
    \n（1）“是功能点表述不清楚，还是整体逻辑不清楚？你觉得怎样的表述可以让你理解得更清楚？精细原型？典型用例？还是我给你演示一个同样功能的其他产品？”\n\n\
