    # 第 2 章 快速理解 AI 技术的实质和边界


    ## 2.1 产品经理要真正地懂技术


    AI 技术能力是 AI 产品经理能力体系中一项不可或缺的能力。


    ### 2.1.1 从事技术商业必须懂技术


    从事技术商业的任何人都要懂技术，其中也包括产品经理。


    1. 技术是产品的约束条件


    技术商业中的产品是基于技术的，因此技术就成了产品的约束条件。规划产品、设计商业模式不是天马行空的艺术创作，而是带着几副“镣铐”跳舞，而且还要跳得精彩。其中，技术就是其中的一副“镣铐”，我们规划产品必须要考虑技术能否实现，以及实现它所需要的成本。


    产品经理在进行产品规划时，就需要做出基本判断——这项技术是否可行，其难度大小及大致成本。如果不懂技术，就很难做出这个判断。这就可能出现在规划完成之后，才发现技术上有问题，从而不得不重新进行产品规划的情况。


    如果非技术人员对于技术不了解，就会产生很多误解。非技术人员往往认为技术很简单，由此会和技术人员产生很多冲突。例如，一项产品要用到图像识别功能，一些不熟悉该技术的产品经理会认为现在的图像识别技术已经很成熟了，实施起来应该会很快。图像识别的技术确实比较成熟了，但根据具体产品的不同应用场景，AI
    技术人员要针对产品做很多技术工作，只有这样才能让技术真正为产品服务。


    以工业质检为例，产品经理规划的质检 AI 产品可以用来代替人工质检。该产品需要采用图像识别技术，让机器来识别工业产品的缺陷。虽然图像识别技术已经比较成熟，但要从技术上真正解决这个问题并不简单，接下来通过两个问题进行具体说明。


    （1）每一种工业产品可能出现的缺陷是不同的。为了让机器能正确识别这些缺陷，就要采用监督的学习方式，教会机器正确识别各种类型的缺陷。这就需要开发配套的训练系统，这个训练系统的用户是质检工人。该训练系统需要质检工人准备大量存在缺陷的产品图片，并将图片中的缺陷标注出来，从而教会机器“认识”各种类型的缺陷。


    （2）复杂的光学问题。工业产品的缺陷情况很复杂，有些缺陷只有[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)在特定角度用一定强度的光照才能发现。以手机为例，手机背面一个很浅的划痕只在一个特定的角度观察才能发现，这就涉及复杂的光学问题。针对这个问题，技术人员需要结合具体工业产品的特点设计光学系统，选用合适的光源并以合适的角度将摄像头布置在合适的位置，具体如下图所示。只有摄像头“捕捉”到了缺陷，机器才可能“辨认”出缺陷。


    ![](img/epub_31486679_23)


    图中 AI 质检系统的光学系统是特别定制开发的，车马拍摄


    这里举的都是比较容易理解的例子，很多场景中的情况更加复杂。所以说，如果产品经理不懂技术，就很难规划出好的技术产品。


    2. 技术是产品经理与技术人员顺畅沟通的必要条件


    既然产品规划要靠技术来实现，这就需要产品经理和技术人员进行交流。领先的产品规划常常会临近技术的边界，这对技术人员是一个挑战。产品经理只有懂技术才能和技术人员进行有效沟通。


    在产品经理和技术人员交流需求时，技术人员经常说这样的话：


    （1）“这个需求表述得不清楚，我们技术人员不明白，所以无法施行。”


    （2）“这个需求在技术上不可行。”


    （3）“这项技术难度很大，我们的人手、时间都不够。”


    如果产品经理完全不懂技术，产品规划要么就只能在技术人员的压力下做出退让，导致产品竞争力锐减；要么就会导致无意义的争吵。如果产品经理懂技术，就可以这样回应对方：


    （1）“是功能点表述不清楚，还是整体逻辑不清楚？你觉得怎样的表述可以让你理解得更清楚？精细原型？典型用例？还是我给你演示一个同样功能的其他产品？”


    （2）“技术具体哪里不可行？是缺数据，还是没有合适的算法？”


    （3）“具体难在哪个环节？哪个功能？为什么？我如果对 XX 处做一些调整，是否可以明显降低难度？”


    产品经理如果这样回应，就可以和技术人员平等对话，从而尽量争取得到技术人员的支持。


    ### 2.1.2 掌握 AI 技术的层次


    技术本身的专业性很高，要想达到专业技术人员的水平极难。而且现在技术本身也分得越来越细，如图像识别、语音识别的差异就很大。即使是专职的 AI 技术人员也很难做到同时掌握多项技术，更何况是产品经理。所以，[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)产品经理掌握
    AI 技术是一个循序渐进的过程，可以分层级进行。


    1. 最低层次，留心其他产品实现的功能和效果


    产品经理在与技术人员交流的时候，如果技术人员说实现不了，那么产品经理可以给他演示其他产品实现的类似功能和效果。如果交流不畅需要上级来决定，那么产品经理的演示也有利于得到上级的支持。


    这就要求产品经理要做一个有心人，主动体验不同类型的 AI 产品。只有平时多积累，才能在工作中做到有条不紊。


    2. 较高层次，懂技术原理


    AI 技术的基本原理并不复杂。要实现产品规划的功能，产品经理在进行产品规划时需要思考：数据从哪里来？需要什么传感器？大概用什么算法？是否需要监督学习？如果这些问题能够得到解答，基本就可以判断技术是否可行了。


    3. 更高层次，能写代码、创建模型、训练模型


    当前学写代码的环境已经有了很大改善，在 AI 开放平台上创建模型、训练模型也并不是太难的事。产品经理只要打破思想枷锁、积极行动，就一定能够达到这个层次。我建议所有想成为高层次产品经理的人，都要尽力达到这个层次。


    虽然现在关于 AI 技术的课程、图书、视频教程非常多，但普遍都太过专业，不适合非计算机专业背景的人快速理解。我本人也买了不少书，看了不少知名的视频教程，还报名参加了线下培训。但我发现这些内容都太“技术”了，非计算机专业背景的人学起来非常困难。因此，我认为针对非计算机乃至非理工背景的人士，用他们能理解的方式系统地介绍一下
    AI 技术很有必要。


    本章没有复杂的数学知识、数学公式，而是用比较容易理解的语言来讲解 AI 技术，希望能使读者快速提升对 AI 技术的理解，为做好 AI 产品规划打好基础。


