    ### 10.3 快速、系统地提升 AI 技术能力

    想获得 AI 产品经理的职位，花费精力快速、系统地提升 AI 技术能力是非常有必要的。


    对互联网产品经理而言，AI 技术能力往往是一个短板，如果能快速补上这个短板，其在与众多同行争夺 AI 产品经理职位时，就有了明显优势。对应届生而言，因为没有工作经验，所以很难与其他应届生拉开差距。如果应届生能系统提升
    AI 技术能力，就可以使自己在面试时脱颖而出。相比工作经验的提升，AI 技术能力的提升更容易实现。


    因此，只要是想获得 AI 产品经理职位的人，我都建议其多花费一些时间和精力来快速、系统地提升 AI 技术能力。这样，不仅更容易获得 AI 产品经理的职位，入职以后也能更好地开展工作。


    我建议按如下步骤来快速、系统地提升 AI 技术能力。


    #### 10.3.1 快速掌握基本的 Python 编码能力

    Python 是一门计算机程序语言，除广泛应用于 Web 开发、数据分析、运维、自动化测试等领域外，还广泛应用于 AI 领域。目前，大部分深度学习框架都支持
    Python，Google TensorFlow 的大部分代码就是用 Python 写的。掌握了 Python，相当于掌握了一把开启 AI 大门的钥匙。


    掌握计算机语言最好的方式就是直接写代码。建议大家直接利用在线编程网站来学习 Python，这种学习方式比单纯看书的效率要高很多。我推荐给大家一个中文在线编程网站——实验楼。


    在网站注册后就能选择相应的课程进行学习。实验楼中关于 Python 的课程有很多，既有免费课程又有收费课程。与收费课程相比，免费课程的质量也比较高。


    整个学习界面分为两大部分，左侧是课程内容讲解，右侧是代码输入界面，用户可根据课程内容讲解在右侧输入相应代码。如果运行出现问题，界面会提示出现问题的原因，用户改正后可再次运行。运行通过后就进入下一步的学习。其典型的学习界面如下图所示。


    ![](img/epub_31486679_88)


    实验楼典型的学习界面


    在这种学习方式中，学习者几乎是从开始就用 Python 写代码，既便于理解又便于记忆，因此学习效率很高。再加上 Python 本身就比较简单，学习者可以较快地具备基本的
    Python 编码能力。


    除了实验楼，还有其他类似的网站可供读者学习，这里不再详细介绍。


    #### 10.3.2 搭建真实的 Python 环境，掌握配套技能

    经过第一步的学习，我们已经具备基本的 Python 编码能力了，也破除了代码的神秘感。但第一步我们为了方便，是在 web 模拟环境中进行编码的，并不是真实的
    Python 环境。第二步我们需要在自己的电脑上搭建真实的 Python 环境，并且熟悉这个环境，为第三步打好基础。


    以我使用的 Mac 电脑为例，其系统自带 Python2.7 版本。但这个版本明显偏低，我先要将电脑的 Python2.7 升级到较新的 Python3.6
    版本，然后安装 Python 的 IDE（集成开发环境）Pycharm，就可以在 Pycharm 中进行 Python 编码了。


    除了基本的 Python 环境和 IDE，还需要安装和使用配套工具，如 Linux Shell 及 Python 包管理工具`pip`。


    网上有很多搭建 Python 环境的配套教程和文章，我们遇到问题时很容易就可以找到答案。


    第一步和第二步的顺序不能颠倒。因为一个从来没有写过 Python 代码的人，在搭建复杂的 Python 环境时通常会遇到很多问题，很容易因此放弃。


