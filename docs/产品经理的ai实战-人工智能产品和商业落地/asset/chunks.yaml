    \  | ID：EPUB\\_20260428160408 \n\n## 第8章 传统企业的AI产品\n\n### 8.1 传统企业应用AI的整体情况（以金融业为例）\n\
    \n#### 8.1.1 金融业应用AI的整体情况\n\n金融业是应用新技术较为领先的行业，从最早的“IT+金融”“互联网+金融”进入了“AI+金融”阶段。目前，财富500强企业中的金融机构近90%已开始应用AI技术，这些机构对AI技术的应用自2014年开始稳步增长。以我国重要的金融机构——银行为例，其对AI技术日益重视。截至2019年5月，我国国内已有兴业银行、平安银行、招商银行、光大银行、建设银行、民生银行、工商银行共7家银行成立了金融科技子公司。其中，AI技术最初多应用于欺诈识别、投资信息分析等少数领域，随后应用范围逐渐扩大，基本渗透到金融业的各个领域。银行、保险机构对AI技术的应用概况具体如下表所示。\n\
