    \  | ID：EPUB\\_20260428160408 \n\n# 后记\n\n关于人工智能的书已经非常多了。这些书大多数属于以下两类：\n\n（1）人工智能的科普书、通识书，主要是向公众普及人工智能的知识，研究人工智能对人类社会的影响；\n\
    \n（2）人工智能的专业技术书，主要是向专业技术人员深入讲解人工智能的技术、工程细节。\n\n而从商业应用角度讲人工智能的书还很少。随着人工智能的快速发展，人们从产品、商业模式的角度理解人工智能的需求越来越强烈，尤其是产品经理的需求。而产品、商业模式又正是我擅长的，于是我写了这本书。\n\
    \n本书拥有坚实的素材基础，既有AI业界的前沿探索，又有我的咨询客户的实战案例，还有我本人的切身体验。以这些素材为基础，我总结、提炼出了关于AI产品、AI商业模式及AI产品经理的原创理论、模型和方法，希望能给产品经理提供切实的帮助。\n\
