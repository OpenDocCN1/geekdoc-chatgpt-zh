    ### 4.2 AI 产品经理


    #### 4.2.1 AI 产品经理的行情


    AI 产品经理就是对 AI 产品进行全面管理的专业人士，AI 产品规划是其核心职能之一。高级 AI 产品经理的职能还涉及商业模式设计。


    市场上公开招聘的 AI 产品经理的职位名称多数叫“AI 产品经理”，也有一些叫“人工智能产品经理”。我阅读了大量的 AI 产品经理招聘信息，从中提炼出了以下要点。


    1. 各种类型的公司都在招聘 AI 产品经理


    阿里巴巴、京东、爱奇艺、字节跳动、小米、汽车之家等互联网公司很早就开始招聘 AI 产品经理。旷视科技、商汤、科大讯飞等 AI 技术公司也在招聘 AI 产品经理。更值得注意的是，越来越多的传统企业也开始招聘
    AI 产品经理。可以看出，各公司对 AI 产品经理的需求很大。


    2. 薪酬高


    AI 产品经理的平均月薪在 3 万元左右，也有超过 5 万元的，很少有低于 2 万元的。这个薪酬对绝大多数传统产品经理来说，是很有吸引力的。


    3. 对 AI 技术普遍没有太高要求


    除了少数 AI 产品经理职位对应聘者的 AI 技术提出了非常高的要求，多数 AI 产品经理职位对 AI 技术的要求并不高。毕竟，AI 产品经理是产品管理的专家，不是
    AI 技术的专家。


    #### 4.2.2 两类公司对 AI 产品经理的要求


    AI 产品经理的职位主要来自两类公司：AI 技术研发公司与 AI 技术应用公司。两类公司对 AI 产品经理的要求有所不同。我们通过两类公司的实际职位对比一下，先看一个
    AI 技术研发公司的职位：某科技公司的 AI 产品经理（美颜/互娱），其工作包括以下内容：


    （1）负责云服务平台美颜业务，对数亿爱美用户的美貌负责；


    （2）负责云服务平台互娱业务，做出让广大互联网娱乐用户尖叫的互娱视觉产品；<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)/p>


    …………


    很明显，该公司的 AI 产品经理要将公司自有的 AI 技术（机器视觉）产品化、商业化，以实现 AI 技术的商业价值。


    再来看一个 AI 技术应用公司的职位：某酒店管理（上海）公司招聘的人工智能产品经理，其工作包括以下内容：


    …………


    整理人工智能客服所需要的语料和知识库，撰写需求文档，推进产品进度；


    …………


    该公司的主营业务是酒店服务，不会投入重金去研发 AI 技术，只需要应用 AI 技术为自己的业务服务。该公司的客服工作量很大，成本也越来越高。如果在这个领域应用
    AI 技术，可以取代部分人工，从而降低成本。有些 AI 技术要用起来、用得好，是需要用户自己做很多产品工作的，还可能要做一些配套的技术开发工作。所以，该酒店管理公司需要
    AI 产品经理。


