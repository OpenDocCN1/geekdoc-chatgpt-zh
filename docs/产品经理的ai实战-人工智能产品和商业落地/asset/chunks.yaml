    高级AI产品经理的能力杠铃模型\n\n#### 11.1.2 高级AI产品经理的能力杠铃模型的10个关键能力项\n\n高级AI产品经理的能力杠铃模型的三大部分合计有10个关键能力项，我们在这里简单介绍一下。\n\
    \n1\\. 商业理解\n\n高级AI产品经理是商业理解能力较强的人之一。高级AI产品经理要站在商业前沿思考AI技术前沿，找到AI技术的商业场景、商业模式，让AI技术发挥出较大的商业价值。\n\
    \n产品是商业的核心要素之一，是商业大厦的基石。脱离商业谈产品是没有意义的。AI产品面临更加不确定的商业环境，这就要求高级AI产品经理必须懂商业，能从商业的层面看待产品，这样才有可能做出更有商业价值的产品。\n\
    \n2\\. AI技术—场景洞察\n\n对于AI技术—场景，合格AI产品经理只要做到适配即可，但高级AI产品经理需要提升到洞察的层次。关于技术—场景洞察会在第12章进行详细讲解，这里不再赘述。\n\
    \n3\\. 需求管理\n\n需求管理是产品管理中必须要做而且必须做好的工作，高级AI产品经理同样要做而且要做得更好。\n\n4\\. AI产品规划\n\n\
    AI产品规划是AI产品经理的工作落点，也是重要的输出物。高级AI产品经理不一定亲自画原型、写文档，但一定要亲自进行产品规划，掌控产品的方向。\n\n5\\\
    . 商业模式设计\n\n高级AI产品经理不仅要能进行产品规划，还要能进行（至少是深度参与）商业模式设计。好的商业模式能让产品乃至公司的业务以更好的方式运行，从而产生更高的价值。\n\
