    ### 11.2 跳出 AI 的圈子，做好 AI 产品


    高级 AI 产品经理和合格 AI 产品经理不同，要能跳出 AI 的圈子做 AI 产品。下面我们会通过具体例子来讲解。


    #### 11.2.1 跳出 AI 的圈子


    产品使用 AI 技术的根本目的是解决问题。解决问题有多种方案，AI 只是其中一种。高级 AI 产品经理要能跳出 AI 的圈子。


    例如，一家食品企业在进行产品包装时采用自动充气包装线，这样做会出现较小比例的空包，即包装看起来很完整但里面是空的。而且包装材料是不透明的，肉眼也看不出来哪些是空包。这是生产线本身的问题，企业能做的改进有限。虽然空包的比例很低，但一旦出现就会严重影响客户感受，所以要尽量避免空包流入市场。


    针对这个问题，如果我们不能跳出 AI 的圈子，就会想到在生产线末端加上重力感应器，快速称量每个包装的重量，用机械臂（AI 驱动）将低于一定值的包装取下。事实上，目前就有不少
    AI 技术公司局限在 AI 思维中，在很多场景中就采用了类似的做法。


    但在这个场景中其实有更简单的解决方案，完全和 AI 无关而且成本很低，即在生产线末端放一个工业风扇，对着生产线上的包装吹风。将风力大小调节到适当程度，使正常包装不受影响，而空包则被吹下生产线。


    产品只有被用户使用才有价值。当两个解决方案摆在这家食品公司面前时，它绝对不会因为 AI 技术更先进就采用 AI 方案，它会选择那个更简单有效、成本更低的方案——放一个工业风扇。


    #### 11.2.2 跳出 AI 圈子的例子


    1. 智能音箱跳出 AI 圈子的例子

    智能音箱多数存在于家庭场景中，所以控制家电一直是智能音箱生产商很重视的功能。如何通过智能音箱控制家电呢？亚马逊的方案是和家电厂家合作，使家电在出厂时就支持智能音箱。这是一个很
    AI 化的方案，但这样做进展慢、成本高。尤其是已经购买家电的用户，显然无法通过智能音箱来控制其家电。


    其实还有更简单的方式，我们看看百度智能音箱的做法。


    为了解决家电控制的问题，百度用了更简单，目前看来也是较好的方法。小度智能音箱大金刚集成了多个红外发射器，同时内置了红外编码库。用户如果想通过智能音箱控制空调，只要对着大金刚说“小度小度，连接空调”，就能达到目的。用户与智能音箱对话的环节用到了人工智能；智能音箱根据用户的指导，发出红外遥控信号控制家电，这个环节则不需要人工智能。家电不需要进行任何改动，现有的家电和以后买的家电都可以通过智能音响来控制。小度智能音箱大金刚及其控制家电的场景如下图所示。


