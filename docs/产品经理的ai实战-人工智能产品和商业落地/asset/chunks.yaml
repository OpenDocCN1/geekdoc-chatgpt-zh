- raw: "卷积神经网络是以卷积运算为核心的，因此卷积层是它的核心层。但除此以外，卷积神经网络还包括其他类型的层，它们紧密配合卷积层来提取、归纳图片特征，最终在输出层输出结果。\n\
    \n我们举一个卷积神经网络模型的实例。这个卷积神经网络的层数较少，只能识别0~9这10个阿拉伯数字。卷积神经网络模型的实例如下图所示。\n\n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ve=\"\
    true\" alt=\"\" class=\"width80\" data-ratio=\"0.286\" data-w=\"1155px\" data-w-new=\"\
    330px\" src=\"https://res.weread.qq.com/wrepub/epub\\_31486679\\_37\"/> \n\n卷积神经网络模型的实例\n\
    \n在这个卷积神经网络模型中，输入层和输出层之间有6个隐藏层：2个卷积层、2个池化层和2个全连接层。\n\n1\\. 卷积层\n\n卷积运算的目的是提取特征，为最终的综合判断奠定基础。上图的卷积神经网络有2个卷积层，可以提取更多、更细的有用特征。\n\
    \n2\\. 池化层\n\n池化层，也有人根据其实际作用将其翻译成“下采样层”。池化是对经过卷积处理后的图像进行又一次有效特征提取和模糊处理。可以简单地将其理解为对图像数据的一次“有损压缩”，能减小数据的处理量。\n\
    \n池化的具体算法就是将图像的某一个区域用一个值代替，如最大值或平均值。如果取最大值，就叫作最大池化；如果取平均值，就叫作均值池化。池化进一步减小了图像尺寸，大幅减少了计算量。最大池化示意图如下所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_38)\n\n最大池化示意图\n\n上图左侧是池化之前的情况，包含4个2×2的区域。采用最大池化法，在每个2×2区域中取最大值来代表这个区域。上图右侧是池化完的数据，可以看出数据量大幅减少。\n\
    \n卷积层与池化层交替出现，从而可以一步步提取特征、降低数据量。\n\n3\\. 全连接层\n\n全连接层的每一个节点都与上一层的所有节点相连，这是全连接层名称的由来。卷积层提取的是局部特征，而全连接层将诸多的局部特征组合起来，从而在输出层做出最后的判断。\n\
    \n卷积神经网络相当于代表大会的整个运作过程，每个卷积核相当于一个领域的代表，众多的卷积核构成了全体代表。代表大会要对一个复杂议案进行讨论，最后决定是否通过。议案中不同的内容会被相应领域的代表理解，这相当于卷积；然后进行分组讨论、分组投票、分组计票，这相当于池化；最后要合并投票，这相当于全连接。\n\
    \n最后由输出层输出结果。\n\n卷积神经网络不仅涉及卷积这一种算法，还涉及最大池化等其他算法。因为卷积是核心算法，所以才将这种神经网络命名为卷积神经网络。\n\
    \n#### 2.4.6 神经网络“智能”的形成过程\n\n并不是有了结构就有了“智能”，神经网络需要一个过程才能产生“智能”。\n\n1\\. 设计、创建模型\n\
    \n根据要解决的问题，设计模型并用代码来创建模型。\n\n刚刚创建的神经网络模型就相当于一个刚刚诞生的人类婴儿的大脑，并不具有“智能”。“智能”的形成还要依靠后面的环节。\n\
    \n2\\. 导入[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)训练数据集，训练模型并检验\n\n经过训练的模型才会具有“智能”。“智能”相当于人类婴儿通过学习逐渐学到的众多知识点。\n\
    \n训练模型需要预先导入训练数据集。数据集包含了大量的手写数字图片，有各种各样的具体样式。但仅仅将众多数字图片输入模型是不行的，因为模型并不认识这些图对应着什么数字。我们需要对数据做标注，告诉模型每张图片对应的数字。在人类的指引下，模型就会逐渐摸索出不同数字的规律。\n\
    \n模型训练成功与否，需要经过实践检验，这需要通过不同于训练数据的测试数据来检测模型的输出效果。训练数据、人工标注和测试数据的对应关系如下图所示。当然，真实的数据量远大于下图所示的数据量，但下图已经可以将其原理揭示清楚了。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_39)\n\n训练数据、人工标注和测试数据的对应\n\
    \n测试数据和训练数据是不同的。例如，我们用很多张手写的数字“3”来训练模型，让模型能正确地认出众多不同的数字“3”。目标是让它以后“看”到一个刚刚写出的（模型在训练时没有见过）数字“3”，也能准确地认出这是数字“3”。\n\
    \n如果能够做到，那就表明模型训练成功了。如果测试效果不好，那就要从模型本身、训练数据集等方面找出原因，并进行调整，直到获得好的测试结果。这个过程有一定的理论依据，但也有很大的经验成分。\n\
    \n3\\. 使用模型，解决问题\n\n这是我们的最终目的，让具备“智能”的模型为我们解决问题。\n\n#### 2.4.7 深度神经网络\n\n随着待解决的问题越来越复杂，神经网络的层数也会逐渐增加，当其达到一定数量时就被称为深度神经网络。\n\
    \n斯坦福大学的李飞飞教授发起的ImageNet图像识别大赛号称“计算机视觉世界杯”，其部分参赛神经网络模型的层数如下表所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_40)\n\
    \n从表中可以看出，神经网络层数的增长速度惊人，与神经网络层数增加同步的是运算量的增长。这里存在一个边际效益递减的现象，而且递减非常严重。神经网络的层数算术级增加，导致了计算量的指数级增加，最终获得改进的可能非常小。\n\
    \n截至2019年年底，最深的模型大概有107个人工神经元，但即便如此还是比青蛙的神经系统规模要小，和人类相比更是差了几个数量级。人工神经网络的规模大约每2.4年翻一倍，按照这个发展速度大概到2045年会达到人类大脑的规模。2045年这个时间点被认为是奇点，其根据就在于此。\n\
    \n深度神经网络、卷积神经网络是从不同角度对神经网络进行分类，两个概念有一定交集。深度是指神经网络的层数多、层级深；卷积是一种运算方式。在当前的工程实战中，大多数卷积神经网络都是深度神经网络。<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)/p>\n\
    \n上面举例讲解的卷积神经网络比较简单，只能识别10个阿拉伯数字。那么对于更复杂的图像识别，如识别一张彩色图片中的物体是车还是马，就需要用到深度卷积神经网络了。\n\
    \n我们来看一个深度卷积神经网络的例子——VGG模型，它有22层。当模型训练完成后，给这个模型一张彩色图片，它能识别其中的物体具体是什么。\n\n深度卷积神经网络VGG的结构如下图所示。每层底部的数字是该层的序号，顶部的数字是该层的神经元数量。由图可知，VGG模型包含了4种类型的层。这一次我们从数据的角度来理解深度卷积神经网络是如何运作的。从左往右看，顶部的数字是该层的神经元数量。输入层是224×224×3，前两个数字对应着图片的像素，3代表3个色彩通道（RGB色彩模式），每个色彩通道的值对应1个神经元。隐藏层的第1层是卷积层，顶部的224×224×64代表这一层有224×224×64个神经元。第22层是输出层，变成了一维的1000个神经元，这表示它可以识别出1000种物体。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_41)\n\n深度卷积神经网络VGG的结构\n\
    \n从数据变化的角度看，输入的原图相当于一个长宽都很大的扁平纸箱子，经过深度神经网络众多层的处理，这个扁平纸箱子最终在输出层被“拉”成了一个很窄、很薄的长纸条，这个长纸条有1000个格子，每个格子对应一种物体。模型根据提取的特征，把“识别”出来的结果写在某个格子里。准确地说，它在每个格子里都“写”了一个概率值。\n\
    \n最终输出的概率值是通过Softmax函数处理获得的。Softmax函数就是归一化指数函数，产品经理不必细究其具体定义和算法，只需要知道它的作用是将分类的结果以概率值的形式展示即可。VGG结构图中的最后一层（第22层）既被称为输出层又被称为softmax层。输出层是指该层的位置和作用（输出结果），softmax层是指请该层执行的算法，是对同一个事物不同角度的命名。例如，输出层在“车”这个“格子”里写了一个值0.9025，在“马”这个格子里写了一个值0.0872，那么我们就可以判断图片中的物体是车而不是马。\n\
    \n我花了好长时间才真正理解深度卷积神经网络的原理，并深深感叹深度卷积神经网络发明人的智慧和数学的重要性。由此更确定了当前人工智能中的“智能”的源泉还是人类。人类将智能问题巧妙地转化为计算问题，而计算机还是只会做计算的机器，只是在人类的指导下表现出了“智能”的样子。\n\
    \n#### 2.4.8 深度卷积神经网络的应用\n\n以深度卷积神经网络为代表的深度神经网络，为人工“智能”带来了革命性的变化。以ImageNet图像识别大赛中的部分数据为例进行说明，具体如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_42)\n\nImageNet图像识别大赛中的部分数据\n\
    \n人类的错误率约为5%，且长期稳定。截至2011年，人工智能的[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)表现一直很糟糕，错误率高达25%，这样的识别率完全无法投入使用。但在2012年，深度学习算法“进场”，将错误率大幅降低到15%左右。由此赛场的风向整体转变，整个竞赛在深度学习模型之间展开。此后，人工智能的错误率逐年下降，最终低于人类的错误率，也因此开启了人工智能的应用热潮。\n\
    \n深度学习的应用非常广泛，其中包括人脸识别。在2016年至2018年的应用狂想期，人脸识别是热门领域之一。\n\n人脸识别就是根据人脸图像判断人的身份，其在身份识别和身份验证中广泛应用。现在的手机普遍采用了人脸识别技术，手机通过该技术能够“认出”正在操作手机的是不是主人。这样既安全又方便，而以前这两者很难同时做到。\n\
    \n人脸识别的过程分两步：人脸检测和人脸体征提取。其他的工作要么为这两步配套，要么是这两步的延伸。人脸检测就是从画面中找出人脸，这是第一步。然后针对检测出的人脸提取特征，找到每张人脸的特征值。人脸检测、人脸体征提取如下图所示。把特征信息和人脸的名称保存下来，就形成了人脸库。有了人脸库就可以进行各种应用——人脸核实身份、人脸比对及人脸搜索等。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_43)\n\n人脸检测、人脸体征提取，来自商汤公司官网\n\
    \n人脸比对只是给出一个适配数值，如下图所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_44)\n\
    \n人脸比对只是给出适配数值，来自虹软科技官网\n\n在有些场景中，86.14%的适配值就足够了，但门禁、金融等领域则要求更高的适配值。所以，如何使用人工智能模型给出的结果还是由人类根据不同的场景来决定的。\n\
    \n深度学习大幅度提高了人脸识别的准确度，这也是当前人脸识别领域的主流算法。深度学习对AI的实际应用做出了重大贡献，也造就了旷视科技、商汤等多个独角兽公司。这也是我利用大量篇幅来介绍它的原因。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 2.5 人工智能的实质和机器学习的问题\n\n#### 2.5.1 当前人工智能与环境和人交互的全过程\n\
    \n为了使读者理解人工智能与环境和人交互的全过程，我绘制了一张示意图，如下所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_45)\n\
    \n人工智能与环境和人交互的全过程示意图\n\n上图是人工智能与环境和人交互的全过程，它包括以下5个环节。\n\n（1）传感。这个环节依靠传感器完成。人工智能使用的传感器大体可以分为两类：一类是传统传感器，如普通摄像头、麦克风等；另一类是因人工智能需要而发展起来的专门的AI传感器。实际上，人工智能引发了传感器领域的技术爆发。越来越多的新型传感器被发明出来，让人工智能“长”出了更敏锐的“眼睛”。\n\
    \n（2）感知。这个环节开始涉及智能了，这也是目前人工智能比较成熟的环节。图像识别（包括人脸识别）、语音识别等都属于这个环节。\n\n（3）认知。严格地说，这个环节的智能才是真正的智能。目前，在这个环节中，人工智能的水平还处于初级阶段。要想实现通用人工智能及强人工智能，就必须在这个环节对人工智能进行大幅提升和根本改变。\n\
    \n（4）生成。环境和人不知道人工智能系统的“想法”，系统需要生成内容以便表达给环境和人。它可能是一个决策、一个指令、一个句子或者一幅图画。\n\n（5）表达。系统生成的内容以环境便于接收、人类便于理解的方式表达出来。例如，将一个指令发送给机械手臂，让机械手臂拿取一个物体；将一些内容用人类的语言通过扩音设备播放出来——“明天您的车限行。为了赶上地铁，您需要比平时早15分钟出门，我已经将您的闹钟提前了15分钟”。\n\
    \n严格地说，传感与表达这两个环节本身并不属于人工智能，但它们是人工智能系统与外界交互的必须环节。\n\n现在的AI实际上是“多传感，强感知，弱认知”，其实[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)它还没有真正的“智能”。人们在利用基于当前人工智能的技术进行产品规划和模式设计时要充分注意这一点，在充分利用“多传感，强感知”的特点的同时，尽量避免“弱认知”的短板。\n\
    \n以道路驾驶场景为例。人类在视野边缘看到一个车轮和一个车门，就能判断有一辆汽车在路边。而所谓的自动驾驶系统，看到同样的画面很难认识到路边有一辆整车。这些自动驾驶汽车安装了多个摄像头、激光雷达等传感器，在感知方面已经明显超过了人类，但是其在认知能力上仍然弱于人类。同样都是一大片白色的区域，人类可以快速准确地判断出这是白色的货车车厢，但自动驾驶汽车却可能将它判断为天空。\n\
    \n#### 2.5.2 机器学习的问题\n\n当前的机器学习虽然很强大，但也存在很多问题。产品经理要理解这些问题，并在规划、执行中充分考虑这些问题。\n\n\
    1\\. 易过拟合\n\n过拟合也被称为过学习，是指算法在训练数据集上表现良好，但在测试数据集上表现得不好。\n\n举个直观的例子。我们在学校学英语，原本是为了在真实的英语环境中正确使用英语。为了学好英语，老师让我们做了大量的英语练习和考试。如果是非英语专业的学生，在大学能通过大学英语六级考试，他会认为自己的英语水平已经很高了。而一旦遇到真正的以英语为母语的人，他就会发现自己连简单的交流都很难做到。长期以来，我们习惯了我国的英语老师测试的内容（往往脱离语言环境），因此能在考试中拿高分。但我们过于适应这种学习环境，反而不能应对真实的英语环境。这就是过拟合的例子。\n\
    \n要解决过拟合问题，根本方法还是精心安排训练数据，使训练数据集尽量覆盖各种情况，避免某种倾向。例如，我们用大量含有羊的图片训练出一个模型，我们当然希望提供一张它从来没有见过的图片，它也能准确地识别出图片中是否有羊。新的图片被一张张送入系统，系统准确地识别出了图片中是否有羊。但是，当我们将一张草坡的图片（图片中没有羊，只有草坡）给模型“看”时，模型也会错误地认为该图片中有羊。有羊的草坡图片和没有羊的草坡图片如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_46)\n\n有羊的草坡图片和没有羊的草坡图片\n\
    \n为什么会出现这样明显的错误？原来，用于训练的图片中在有羊的大多数情况下也同时有草坡。其实，机器根本不认识羊，它只是从众多图片中总结出有羊的规律。如果新的图片在很大程度上符合这个规律，它就判断有羊。而在多数训练图片中，羊和草坡是同时出现的，因此机器总结出了错误的规律。只是这个错误的规律是隐藏的，在新的图片中如果同时有羊和草坡，它就能根据这个规律做出正确的判断；在新的图片中如果只[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)有草坡没有羊，它做出的判断就是错误的。\n\
    \n找到了问题的根源，解决方案就比较简单了。只需要在训练模型时，提供给机器的关于羊的图片尽量多样化，使机器找出正确的规律即可。这样的训练模式可避免机器再将草坡误认为羊。\n\
    \n只要人类的智能少一点，机器的“智能”就会差一点。现在的人工智能只是人类智能的外化。\n\n2\\. 机械、难变通\n\n因为机器没有真正的“智能”，它只是找出了规律组合，所以它无法像人类一样变通。而变通是一种极为重要的能力，它能让人更好地适应变化的世界。\n\
    \n举一个例子：如果我们用数百万张耳朵竖立的兔子图片训练人工智能模型，当我们让人工智能“看”耳朵不是竖立的兔子时，人工智能会认为这不是兔子，而是一种别的动物；但如果是人类，即便从来没有见过耳朵不是竖立的兔子，也会认出这是兔子。\n\
    \n黑天鹅的道理也是如此。17世纪之前，欧洲人认为所有的天鹅都是白色的。后来到了澳大利亚，在那里尽管是第一次看到黑天鹅，但欧洲人还是能立刻确认“这是天鹅，黑色的天鹅”。如果是人工智能，情况就不同了。如果用来训练模型的所有天鹅都是白色的，人工智能会将这个认知固定下来，而当其看到黑色的天鹅时，其只会认出这是一种黑色的鸟，而不会认为这是天鹅。\n\
    \n3\\. 难解释、不可信\n\n由于现在的机器学习算法越来越复杂，常常综合了多种算法，用于训练的数据集非常庞大，人类根本不可能一一检查，这就导致人工智能的模型非常复杂。\n\
    \n我们用大量的数据、复杂的算法及强大的算力训练出了一个模型，我们认为这个模型具有了某种智能。因为给了它10000张图片，它都能正确识别，但是你无法肯定第10001张它还能否正确识别。\n\
    \n4\\. 难识别\n\n一张特殊图案的贴纸、人眼几乎无法察觉的噪点、一点点涂改，这些不会导致人类识别错误，但却可能让AI做出完全不同的判断。\n\n稍微涂改一下路边的交通标志，人类还能正确识别，但自动驾驶系统就可能对这个重要标志视而不见，进而可能导致严重的交通事故。未涂改及涂改后的交通标志如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_47)\n\n未涂改及涂改后的交通标志\n\
    \n不仅是二维图像，一些特殊形状的3D物体会让激光雷达错误地把它当作行人，甚至可能完全“看”不见。\n\n还是以人脸识别为例，识别对象配合与不配合会对识别效[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)果产生非常大的影响。人脸考勤、人脸闸机就是配合的场景，这种场景的识别率已经很高了。而安防就是典型的不配合场景，如果再考虑环境的复杂性，真实的识别率其实要低于媒体宣传的识别率。"
