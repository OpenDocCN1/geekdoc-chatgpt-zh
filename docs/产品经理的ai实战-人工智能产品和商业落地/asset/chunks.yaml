    \ Deere公司的一款农机设备。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_79)\n\
    \nJohn Deere公司的一款农机设备\n\n之后，蓝河科技公司继续针对小场景开发产品，逐步开发适合大豆、大麦、玉米等农作物的产品。John Deere公司的发言人表示，收购蓝河科技公司的重要原因之一，就是该公司的产品可以扩展到多种农作物。\n\
    \n3\\. 2C最终用户产品案例\n\nAI技术公司的最终用户产品，既有2B最终用户产品又有2C最终用户产品。上文我们研究了两个2B最终用户产品，现在我们再来谈谈2C最终用户产品。\n\
    \n2C最终用户产品可以和众多的用户建立联系，但这类产品在商业运作上通常是较困难的。2C最终用户产品虽然进入门槛低，但成功门槛非常高。当前，市场的整体状况是产品过剩、品牌过剩。要想争夺用户，只有好产品是远远不够的，还要花大力气建渠道、做市场推广，另外价格战往往也难以避免。\n\
    \n2C最终用户产品要想成功，除了要有AI技术，还需要众多其他因素。但在通常情况下，AI技术公司除了AI技术，对其他因素往往并不擅长。以华为公司为例，我们看到了该公司在手机（典型的2C最终用户产品）上的成功，认为该公司成功的主要原因是技术强。其实，手机产品的竞争是综合竞争，华为公司取得成功绝不只是依靠技术。实际上，华为公司除技术之外，在工业设计、产品、定价、销售渠道、市场宣传方面都做得非常好，这样才取得了成功。想学习华为公司的AI技术公司，要先考虑自己能否做好除AI技术之外的其他方面。一个AI技术公司一旦[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)决定做2C最终用户产品，基本就要脱胎换骨，发展其除AI技术之外的众多因素，只有这样才有可能取得成功。\n\
    \n有用户优势的互联网大公司也开始重视2C最终用户产品。以智能音箱为例，我们看到阿里巴巴、腾讯、百度都有自己的智能音箱，并依靠超低价格、强大的推广能力占据了大部分市场。如果一家AI技术公司也想做智能音箱，就避不开和这几个巨头的竞争。2C最终用户产品的竞争所涉及的因素如此之多，主要依靠AI技术是很难取得竞争优势的。另外，在巨头面前，AI技术的壁垒能维持多久呢？\n\
    \nAI技术公司要想做2C最终用户产品，虽然可以通过开拓新品类避开巨头，但即便做到了，情况也不乐观，原因有以下几点。\n\n（1）如果开拓了一个新品类，当市场规模较小时，大公司按兵不动，小公司要辛苦开拓市场。\n\
    \n（2）如果市场规模进一步扩大，大公司可能并不放在眼里，但同行业的AI技术公司可能会推出类似产品来争夺市场。一个不大的市场就可能面临激烈的竞争。\n\n\
    （3）一旦市场规模到了一定程度，大公司就很有可能强力切入，依靠简单的价格战快速抢占市场。\n\n科大讯飞的翻译机就处在第二阶段。只是因为科大讯飞在语音技术方面确实处于领先地位，所以还没有面临太大竞争，还可以卖出高价，获取较高的利润。同时，翻译机这种产品的市场没有大到让大公司心动的地步。如果我是科大讯飞的CEO，我一定会非常矛盾——既希望市场扩大，又担心市场太大。\n\
    \n在这个方向上，AI技术公司有以下几条出路。\n\n（1）开创2C最终用户产品新品类，并且因为做得非常好，始终占据优势地位。例如，苹果用iPhone开创了触屏智能手机品类，至今仍在市场占据重要地位。\n\
    \n（2）开创2C最终用户产品新品类，该品牌有一定规模但没有大到吸引巨头，足以让AI技术公司生存发展。\n\n（3）开创2C最终用户产品新品类，当规模扩大到一定程度被巨头看上时，被巨头以合适的价格并购。可以是整个公司被并购，也可以是该业务板块被并购。\n\
    \n所以，我认为2C最终用户产品是AI技术公司较难的业务。AI技术公司要对2C最终用户产品非常谨慎。如果一定要做，那就要做好充分的准备，包括人才、资金及足够的耐心。\n\
