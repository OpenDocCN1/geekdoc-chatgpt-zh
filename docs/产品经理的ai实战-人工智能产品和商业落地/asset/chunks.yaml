    \n一次性支付大笔费用就成了产品销售的障碍。分次付费或者持续按需付费是一种很好的方式，但采用这种方式会对供应商产生很大风险。\n\n#### 13.2.2\
    \ AI工业质检商业模式——按月、按量付费\n\n虽然现在AI技术用于工业质检已经比较成熟（至少在某些产品中），而且有数据来佐证，但仍然只有少数大企业在使用，业务规模远远达不到预期。依靠原有的做项目、卖设备的商业模式是无法从根本上解决问题的，AI工业质检需要新的商业模式。\n\
    \n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p class=\"content\">绝大多数工业设备在运行时是脱离供应商控制的，但AI工业质检设备不是。它的智能主要来自供应商掌控的云端，而且能力的升级也要依赖云端。供应商有了这个掌控力，分次付费的风险就会大大降低。如果用户不按时付费就无法正常使用，更无法转卖给他人。这就为新模式的启用创造了机会。对于AI工业质检设备，比较适合的模式是按月、按量付费模式，也可以形象地将其称为“给机器人发工资”。\n\
    \n在这种模式下，企业客户首次支付的费用明显减少，以后按月支付费用。传统模式相当于购买设备，新模式相当于购买生产力，这是两种模式间的根本区别。这个模式相比传统模式有什么好处呢？\n\
    \n（1）适合企业客户的习惯，容易被客户接受。\n\n以前，企业客户通过质检工人进行工业质检，要按月给质检工人发工资。这是企业习惯的方式。现在使用了AI工业质检设备进行质检，企业客户还可以保持原有的习惯，按月“发工资”——给AI工业质检设备“发工资”。\n\
    \n（2）改变客户的决策性质，更容易实施。\n\n在这种新模式下，虽然供应商利润滞后、存在商业风险，且需大量融资，但这种模式却给企业客户的机械换人提供了便利。企业客户为质检购置设备，在传统模式下属于固定资产投资，决策难度大、周期长；在新模式下属于管理优化，把“给人力发工资”换成了“给机器人发工资”，决策难度小、周期短。\n\
