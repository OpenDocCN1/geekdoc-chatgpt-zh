    ## 4.3 合格 AI 产品经理的能力体系——AI 能力杠铃模型


    AI 产品经理职位刚刚出现不久，用人公司及 AI 产品经理自身普遍都没有清晰地认识到 AI 产品经理的能力体系。一个人如果想成为合格的 AI 产品经理，就需要先了解合格
    AI 产品经理的能力体系。只有了解了能力体系，才会有正确的努力目标。


    ### 4.3.1 合格 AI 产品经理的能力杠铃模型


    当前的 AI 产品经理还是一个缺乏标准、缺乏体系指导的专业岗位。我根据近几年在 AI 领域的观察、研究及咨询实战的经验，提炼出了合格 AI 产品经理的能力杠铃模型。希望这个模型可以给对
    AI 产品感兴趣的人提供明确的指导，让大家高效成长，这对个人及整个 AI 商业都是非常有利的。


    AI 产品经理也分为多个层次，本书讲到了两个层次：合格 AI 产品经理及高级 AI 产品经理。大多数对 AI 产品经理职位感兴趣的人，通过正确的方法学习一段时间后，都可以从事
    AI 产品工作，进入 AI 产品之门。再加上实际工作的磨炼，一般经过 2~3 年就可以成为合格的 AI 产品经理。如果有任职互联网产品经理的经验，这个时间还可以再缩短一些。


    在合格 AI 产品经理中，只有少数最终可以成为高级 AI 产品经理。高级 AI 产品经理是公司的宝贵财富，对 AI 商业、AI 应用会起到关键作用。本篇我们主要讲合格
    AI 产品经理的能力杠铃模型，第三篇再讲高级 AI 产品经理的能力杠铃模型。


    合格 AI 产品经理的能力体系，可以用一个形象直观的杠铃模型来表达。杠铃模型由三大部分构成：处于中心位置的杠铃、和杠铃平行的两个能力项及顶部的两个能力项，总共
    8 个能力项。这 8 个能力项都是经过仔细挑选的，AI 产品经理是否合格，就看他是否具备这 8 个能力项。


    杠铃部分包含中间的杠铃杆（也叫横杆）和两端的杠铃片。杠铃杆对应着两个能力项——需求管理和 AI 产品规划。我们知道，无论真正的杠铃有多重，举重运动员都是抓住杠铃杆把整个杠铃举起来的。所以，需求管理和
    AI 产品规划是合格 AI 产品经理 8 个能力项中的抓手能力。杠铃两端是 AI 技术—场景适配和实施管理。杠铃部分从左往右正好对应着日常工作流程——将合适的
    AI 技术与合适的场景适配起来，进行需求管理和 AI 产品规划，然后推动技术部门实施管理。合格 AI 产品经理的能力杠铃模型如下图所示。


