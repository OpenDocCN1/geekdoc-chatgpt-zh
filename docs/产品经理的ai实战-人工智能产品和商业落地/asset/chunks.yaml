    密集的弹幕挡住了网红的脸


    这背后隐藏着很多用户的需求。如果能观察到这个微场景及背后的用户需求，再对 AI 技术略有了解，就很容易规划出与之对应的 AI 产品来解决问题。利用 AI 实时检测出画面中网红的脸，使弹幕飘到网红脸部时暂时不显示，弹幕飘过网红脸部区域之后再显示出来。从视觉效果看，好像是弹幕从网红的后面“穿”过去了。效果如下图所示。


    ![](img/epub_31486679_64)


    弹幕从网红后面“穿”过去


    这个微场景的解决方案很容易实现，有以下两点原因。


    （1）需要用到的人脸检测算法相当成熟，弹幕根据情况动态变化显示状态在技术上也容易实现。


    （2）这个微场景对 AI 技术的容忍度较高，偶尔因为画面质量、算法问题出现人脸检测不准导致弹幕挡脸的情况，也不会引起用户太大反感。


    不要小看这个微场景及配套的产品规划，它给用户带来了实实在在的价值，有不少用户直接在弹幕中表达了自己的认可。


    产品经理应该结合自己公司的情况、产品的特点选取合适的微场景作为切入点。


    ## 第 6 章 互联网公司的 AI 产品


    在 AI 技术的利用上，互联网属领先行业，且互联网公司的 AI 产品经理也越来越多。


    互联网产品和 AI 产品的概念是有交集的，而且交集越来越大。互联网公司的 AI 产品按照 AI 技术在其中所起作用的大小，大体可以划分为两类：AI 技术增强型互联网产品和
    AI 技术原生型互联网产品。


    AI 技术增强型互联网产品是指原本存在一个没有利用 AI 技术的互联网产品，后来将 AI 技术应用到这个产品中，从而增强了其产品功能。AI 技术没有改变产品的核心功能，只是为其服务。越来越多的互联网产品都在利用
    AI 技术赋能，这样的 AI 技术增强型互联网产品在互联网行业中越来越普遍。


    AI 技术原生型互联网产品是指整个产品的核心功能都是基于 AI 技术的，如果没有相应的 AI 技术，就不会有相应的产品产生。随着互联网公司的产品经理对 AI
    技术的逐渐熟悉，这样的产品已经开始出现，并且会越来越多，这应当引起广大互联网产品经理的重视。


    对互联网产品经理而言，AI 技术增强型互联网产品是比较容易上手的 AI 产品。如果在原有的互联网产品中成功应用了 AI 技术，并利用 AI 技术增强了原有产品的功能，那么传统的互联网产品就进化为
    AI 产品，传统的互联网产品经理也就进化为 AI 产品经理。这对产品的发展、产品经理的发展都具有重要的意义。


    ### 6.1 AI 技术增强型互联网产品


    #### 6.1.1 产品案例


    我们通过一个实际产品的例子来理解 AI 技术增强型互联网产品。这个产品是 Arts & Culture（艺术品与文化），来自 Google。


    从众多的 AI 产品中选择它作为案例有以下几个原因。


    （1）这个产品原本是互联网产品，并没有用到 AI 技术。在发布了多个版本之后，才引入 AI 技术升级为 AI 产品。


    对广大的互联网产品经理而言，将原来的互联网产品升级为 AI 产品成功的机会较大，而从零打造一个全新的 AI 产品成功的机会较小。这个案例更接近读者的现实情况，其借鉴意义更强。


    （2）在这个产品中，AI 技术只发挥辅助作用，并不触及核心功能。


    这一点很重要。关于互联网产品的 AI 化，我的建议是，先让 AI 技术发挥辅助作用而不触及产品的核心功能。因为互联网产品经理对于 AI 技术的理解力、掌控力是需要逐步增强的，所以最好让
    AI 技术一点点渗透进自己的产品。这种做法的规划风险、实施风险、运营风险都比较低。这个案例正是一个很好的佐证。


    （3）这个产品知名度比较高，AI 技术的加入取得了明显的成功，很有说服力。


    Arts & Culture 是一个数字化的艺术馆。它将全球众多美术馆、博物馆的藏品数字化，让用户可以随时欣赏这些艺术品。它的核心功能就是查找、欣赏数字化艺术品。其在发布之初并没有用到
    AI 技术，只是单纯的互联网产品，后来 AI 技术的加入增强了其产品功能。该产品的 App 界面如下图所示。


    ![](img/epub_31486679_65)


    Arts & Culture 的 App 界面


    上图左侧是产品 App 的界面，其提示用户“你的肖像在博物馆里吗”，引导用户上传自拍照。上图中间是一位女士的自拍照，上图右侧的人脸是 AI 系统根据这位女士的自拍照在博物馆里找到的伦勃朗的一幅画作。AI
    系统检测两者的相似度达到 66%。需要说明的是，这个功能只有部分地区的用户可以使用。


    这个功能涉及的 AI 技术是人脸识别技术，准确地说是人脸比对技术。就是根据一张给定的人脸图片，从人脸库中找出最适配的人脸。本例的适配人脸稍微有些特殊，所适配到的是艺术品中的人脸。


    下面我们将这个案例和火箭模型进行对照，看看其中的门道。


    #### 6.1.2 案例中的 AI 技术、场景、产品及商业价值


    1\. AI 技术


    本案例中涉及的 AI 技术是人脸比对技术——针对一张人脸图片，在指定的人脸集合中搜索，找出最相似的一张脸或多张人脸，并给出相似度分值。


    那它有什么作用呢？这就不再是一个技术问题，而变成了一个产品问题，应该由产品经理来回答。一项技术的作用，其实是有无限可能的。关于人脸比对技术，一般人只会想到和真人的脸进行对比，进而想到在门禁、安防等领域的[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)应用。我非常佩服
    Arts & Culture 的产品经理，能够想到如此有创造性的想法——将用户的人脸和艺术品中的人脸进行对比。


    2\. 场景


    下图中的老人、女士各自在一幅油画前合影，我们能看出他们和画中的人物有几分相似。显然，他们也有这样的感觉，并特意摆出与画中人物相似的姿势，以便看起来与画中人物更相似一些。这是一种常见的场景，体现了人们普遍的心理反应。产品经理只有善于观察和理解这些场景，才能从中发现机会。


    ![](img/epub_31486679_66)


    用户摆出相似姿势与油画合影


    3\. 产品


    仅仅实现了 AI 技术—场景的适配是不够的，还必须规划出好的产品。本案例的产品规划就做得非常好。一方面，产品既充分发挥了 AI 技术的价值，又能让广大用户（他们对
    AI 技术并不熟悉）方便地使用；另一方面，AI 技术没有喧宾夺主，而是很好地服务于产品的核心功能。


    4\. 商业价值


    如果前面的工作做得到位，产品的商业价值就会顺利得以实现。自从利用 AI 技术增加了这个新功能后，在没有增加市场投入的情况下，Arts & Culture App
    的下载量猛增。其中，名人自发的免费宣传也起到了很大作用。


    下图是美国的某喜剧演员在 Twitter 上发布的该 App 截图，由他主演的 HBO 电视剧《硅谷》在中国互联网行业具有很高的知名度。他将自己在 App
    上的适配结果发布在 Twitter 上，其很多粉丝都被吸引下载了该 App。粉丝体验之后，又将自己的人脸适配结果发布到自己的社交圈。产品就这样实现了快速裂变传播。


    ![](img/epub_31486679_67)


    美国某喜剧演员在 Twitter 上发布的该 App 截图


    如果不是善于发挥 AI 技术的特点，提供这样简单、有趣的功能，显然不会有名人自发宣传，并将其粉丝转化为产品用户。如果公司要让他们宣传，就要支付大量费用。如果单纯依靠传统的市场推广，要达成这个效果则需要花很多钱。相比之下，用产品来做市场推广，用产品来做运营，显然更加高明。


    我在讲解 AI 产品时，特别喜欢以这个产品为例。因为这个案例简单、好理解，又特别能说明问题。传统产品经理可以根据这个例子的思路，做出自己的第一个 AI 产品规划。


    ### 6.2 AI 技术原生型互联网产品


    我们仍旧通过产品实例来理解某 AI 技术原生型互联网产品。


    该产品的口号是“只需一张照片，出演天下好戏”。其主要操作步骤很简单，具体如下图所示。


    ![](img/epub_31486679_68)


    主要操作步骤


    用户先上传一张端正清晰的正脸照片，然后选择喜欢的视频片段，并选择要替换的角色，点“制造视频”按钮，就能通过云端 AI 生成换脸视频。我实际体验过，效果非常自然。


    这个产品涉及的 AI 技术要比上一个更加复杂，但其还是以人脸识别为基础的。为了生成换脸视频，技术上要做到以下三件事。


    （1）对用户本人的脸部进行识别，提取特征点。


    （2）对用户选定的视频片段中的所有人脸进行识别，提供可替换的人脸供用户选择。


    （3）用用户的脸部特征替换掉目标人脸。因为替换的是连续变化的视频中的人脸，目标人脸的角度、表情都在发生动态变化，要实现自然的替换效果的技术难度很大。


    之所以说是 AI 技术原生型互联网产品，那是因为该产品的核心功能只有依靠 AI 技术才能实现。如果没有人脸识别、人脸替换等 AI 技术，这个产品的核心功能就不能实现，这个产品也就不成立。


    值得一提的是，这个产品虽然是 AI 技术原生型互联网产品，但它的产品亮点不仅来自 AI 技术，还来自其分享功能。它的分享功能虽然不涉及 AI 技术但也做得很好，如下图所示。


    ![](img/epub_31486679_69)


    该产品的分享功能


    提醒用户进行社交分享是互联网产品的标准做法，这个产品也不例外。上图左侧是分享界面，界面底部有一个开关“还有空位，支持合演”尚未打开。如果打开这个开关，分享界面就会变成右侧的样子。我选的视频有两个人物，我替换了其中一个，还有另一个人物可以被替换。我只需要复制合演代码发送给朋友，朋友复制后打开该产品
    App 就可以直达这段视频，将另一个人物换成自己的脸。这个设置非常有利于社交裂变。


    这个产品做到了传统 IT 技术和 AI 技术的有机融合，值得产品经理学习。在这个产品中，AI 技术是为产品价值服务的，而产品价值不一定只来自 AI 技术。


    ## 第 7 章 AI 技术公司的 AI 产品


    ### 7.1 AI 技术公司的项目与产品


    #### 7.1.1 AI 项目与 AI 产品


    产品的特点是可以批量打造，依靠大量产出摊薄成本，从而进一步扩大销量及用量。


    与产品相对应的还有一种方式——项目。项目是针对一个个客户定制的，通常单价比较高，且实施周期长、可复用性差。当前，很多针对企业场景的 AI 应用是以项目方式进行的。


    采取项目方式而不是产品方式来运作，可能是业务发展初期不得不经历的过程。身处其中的企业应该清楚地看到其存在的问题，在做项目的阶段就要为产品做好准备，使项目方式尽早转向产品方式。


    #### 7.1.2 AI 技术公司的产品类型


    对于 AI 技术公司来说，AI 技术是公司的核心竞争力之一。AI 技术公司的 AI 产品，根据产品的使用对象和特点可以分为两大类。


    1\. 中间产品


    AI 技术公司的中间产品本质上是封装起来的 AI 能力，多数以 SaaS 方式为用户提供服务，也有少数以本地模型的方式提供给用户。中间产品不是直接提供给最终用户的，而是要通过中间用户集成到最终的产品中再提供给最终用户。


    以传统产品为例，德国采埃孚公司生产出汽车变速箱，提供给宝马公司、上海通用公司、一汽集团等汽车整车厂，整车厂将整车（包含了变速箱）卖给最终用户。其中，德国采埃孚公司相当于
    AI 技术公司，变速箱相当于中间产品，一汽集团等汽车整车厂相当于中间用户。


    2\. 最终用户产品


    最终用户产品就是 AI 技术公司直接提供给最终用户的产品。根据最终用户的性质，最终用户产品还可以分为 2B 最终用户产品和 2C 最终用户产品。


    AI 技术公司的产品类型可以用下表来表述。


    ![](img/epub_31486679_70)


    ### 7.2 AI 技术公司的中间产品


    #### 7.2.1 AI 技术公司的中间产品的特点


    典型的中间产品是以 SaaS 方式提供 AI 能力，供用户远程调用。


    例如，旷视科技提供的 FaceID 就是一个典型的中间产品。FaceID 如下图所示。


    ![](img/epub_31486679_71)


    FaceID


    旷视科技将自己的人脸识别技术及云端能力封装成产品，提供给金融、在线直播平台等中间用户，使他们可以简单方便地对最终用户进行认证。如果没有这样的中间产品，中间用户就需要自己花费大量的精力对最终用户进行认证。


    为了尽量方便中间用户使用，中间产品通常会提供多种接入方式。例如，FaceID 就提供 4 种接入方式：功能强大但较复杂的 SDK（软件开发工具包）方式，还有比较简单的移动端
    H5、PC 端 H5、微信小程序方式，以适应多种场景。


    经过这样的封装加上丰富的接入方式，普通的 IT 人员即使完全没有系统学习过 AI 技术，也能使用这种 AI 能力。


    AI 中间产品的收费方式和 SaaS 类似，通常按使用量向中间用户收费。


    #### 7.2.2 产品经理在中间产品中的作用


    AI 技术公司的中间产品是一个技术含量很高的产品，产品之间的竞争主要比拼的是 AI 技术。但是，在 AI 技术之外，产品经理仍然能发挥自己的作用。


    例如，需要身份认证的企业有很多，不同类型企业的身份认证的需求是不同的。有些机构（如金融等）对身份认证有特别的需求，平安科技公司推出的平安π综合身份核验产品就满足了这种需求。


    金融机构的场景非常丰富，客户在办理不同的业务时，需要不同等级的身份认证。并不是所有的场景都需要最高级别的身份认证，那样虽然足够安全但却损害了用户体验。平安π综合身份核验产品在同类产品中，率先采用
    3 档 10 级活体方案，正好满足了金融机构分场景、分级别身份认证的需求，具体如下图所示。


    ![](img/epub_31486679_72)


    平安π综合身份核验产品


    左侧是产品采用的技术，中间是相应的安全等级，右侧是各等级对应的应用场景。


    例如，我国银行的对私账户采用了分级管理方式，其中二类账户的限额小，只适用于小额支付。因此，银行客户在开设二类账户时，身份认证只需要达到专业级。而保险公司在客户出险需要核实身[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)份时，因为涉及的金额较大，就要求身份认证达到增强级。


