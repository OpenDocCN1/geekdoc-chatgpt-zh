    \n2\\. 语音唤醒相关指标举例\n\n语音是AI的另一个重要应用领域，其中智能音箱是一个重要的语音应用产品。用户在使用智能音箱时，需要先进行语音唤醒。例如，对亚马逊Echo音箱说“Alexa”，对小度音箱说“小度，小度”。语音唤醒这个环节，用起来很简单，但其实涉及了很多指标。\n\
    \n（1）唤醒率。唤醒率是指用户说出正确的唤醒词后，智能音箱被成功唤醒的比例。这个比例越高越好。\n\n（2）误唤醒率。用户并没有说出正确的唤醒词，结果智能音箱自己“醒”过来了，这就是误唤醒。如果误唤醒率偏高，会严重影响用户体验。例如，夜深人静的时候用户翻身发出一点儿声响，床头的智能音箱突然开始“说话”，很可能会吓到用户。\n\
    \n为了降低误唤醒率，智能音箱采取了多种措施，其实之一就是确保唤醒词的长度。例如，天猫精灵的唤醒词就是“天猫精灵”，小度音箱的唤醒词是“小[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)度，小度”，而不是简短的“小度”。\n\
    \n（3）唤醒响应时间。唤醒响应时间是指从用户说出正确的唤醒词到系统做出响应的时间。这个指标在理论上有无限的改进空间，但从用户体验的角度出发，让用户感觉不到明显的等待即可。\n\
    \n以上列举了一些AI产品的指标，不同的产品及所处阶段不同的产品，其指标体系是不同的。AI产品经理要能结合自己产品的实际情况，制定、调整合理的指标体系，使指标体系发挥出指挥棒的作用，这也是我们制定指标体系的价值所在。\n\
    \n例如，工业零件AI质检中就有两项非常重要的指标：识别率和误费率。识别率就是将有缺陷的零件准确识别出来的比例。一批工业零件中有1000件有缺陷，AI质检系统识别出了992件，那么识别率就是99.2%。误费率就是将本来没有缺陷的零件错误地识别为有缺陷零件的比例。AI质检系统将10000件没有缺陷的零件中的450件识别为有缺陷的零件，那么误费率就是4.5%。\n\
    \n从理想的角度出发，当然是识别率越高越好，最好是100%；同时误费率越低越好，最好是0。但这种指标是脱离实际的，现有技术基本无法实现。\n\n在工业零件的AI质检实战中，识别率、误费率两个指标存在一定冲突，如果想获得很高的识别率，通常误费率也会提高。AI产品经理要综合考虑产品特点、场景需要与技术现实，做出合理的指标决策。一般来说，识别率更加重要，因为一旦有缺陷的产品没有检测出来，流到下一个环节可能会带来严重的问题。而且如果AI的识别率明显低于人工的识别率，这样的产品根本就不会被用户接受。误费率偏高，是有办法通过非技术手段补救的。例如，对价值较高的零件，安排适量人工再复检一次，从中将误费零件拣回。随着AI模型的进化，当误费率低到一定程度时，就可以不再利用人工捡回误费零件了。\n\
