    ## 第 4 章 合格 AI 产品经理的核心工作和能力模型


    ### 4.1 AI 产品


    #### 4.1.1 AI 产品的实用定义


    有不少人问过我一个基本问题：“什么是 AI 产品？”最初，我给出的都是一些严谨、专业的定义，既有引用他人的又有自己原创的。但效果都不太好，听完之后大家还是一头雾水。


    于是，我对 AI 产品下了一个实用定义，“投放市场”后发现效果不错，大多数人觉得这个定义简单易懂。


    所谓 AI 产品，就是包含 AI 技术并且能发挥 AI 技术价值的产品。


    这个定义中有两个关键点。


    1. 包含 AI 技术


    如果一个产品中没有包含 AI 技术，那它显然就不是 AI 产品。


    2. 发挥 AI 技术的价值


    这一点更加重要。不能是为了概念、热点，就为产品生硬地附加上 AI 技术，而是要让 AI 技术发挥作用，为产品赋能，为用户提供价值。AI 技术发挥的作用可以是核心的、关键的，也可以是外围的、辅助的。


    智能硬件领域曾有过类似的教训。曾经的智能硬件所谓的“智能”并不是指人工智能，而是指能上网。不管是什么硬件，只要能连上网它就算是智能硬件了。例如，电源插座加一个无线模块连上网，就是智能插座。大量的类似产品被投入市场，结果却发现大多数产品与实际场景、实际需求脱节，联网功能增加了产品成本却并没有发挥实际作用。很多买了这种产品的用户，对其的使用率并不高。很快，大多数所谓的“智能硬件”就被市场淘汰了。对于这样的结果，这些产品的产品经理要负有一定的责任。


    希望 AI 产品经理能够从中吸取教训，让适当的 AI 技术在产品中发挥实际作用，让使用 AI 产品的用户切实体会到 AI 技术的价值，从而持续使用。


    #### 4.1.2 AI 产品的构成要素


    产品是有机整体，由多种要素有机组合而成，技术只是构成产品这个整体的诸多要素之一。产品经理要对产品进行整体规划，技术、设计部门要对产品进行整体实施，然后整体交付给用户使用，为用户提供价值。


    AI 产品的构成要素具体如下图所示。一个 AI 产品包含 AI 技术、传统信息技术、其他技术和众多非技术要素。所以，非技术出身的产品经理不用担心自己在 AI
    时代的地位。利用好 AI 技[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)术，结合众多其他要素打造出一个好的 AI 产品，才是产品经理巨大的技术—场景价值空间。希望还在啃算法细节的产品经理，回到正确的道路上，朝着正确的方向努力。


    ![](img/epub_31486679_52)


    AI 产品的诸多构成要素


    为了便于读者更好地理解，下面用一个 AI 产品的实例——天猫精灵智能音箱来进行说明，天猫精灵智能音箱如下图所示。


    ![](img/epub_31486679_53)


    天猫精灵智能音箱，车马拍摄


    天猫精灵智能音箱毫无疑问是一个 AI 产品，并且目前已经取得阶段性成功，它的出货量、保有量及日活跃用户数量都很高。


    上图中，我拿的是天猫精灵中价格较低的方糖。其实，我手中的小盒子并不是完整的产品，它只是产品的一个用户端设备而已。如果断网了，即便我说多少次“天猫精灵，来一段
    B-box”，它也只会对我说“网络连接失败”，毫无智能可言。天猫精灵的用户端设备加上云端智能及配套资源才是完整的天猫精灵产品。


    我们再来对照 AI 产品构成要素图，拆分一下天猫精灵这个 AI 产品的构成要素。


    1. AI 技术


    很显然，天猫精灵能听懂你的话，能用语音做出反应，必然要用到语音识别、自然语言理解及语音合成等多种 AI 技术。


    2. 传统信息技术


    在使用天猫精灵的过程中，涉及数据传输、数据存储等众多传统信息技术。天猫精灵要正常运作，离不开这些传统信息技术。


    3. 其他技术


    天猫精灵的箱体有电源、麦克风、扬声器等电子器件，这就涉及电气、电声等技术。这些技术虽然“古老”，但同样也不可缺少。试想一下，你对天猫精灵说出一首歌的名字，天猫精灵立刻从云端调来歌曲播放，但播出的声音却浑浊难听，你的体验还会好吗？


    4. 大量非技术要素


    箱体的工业设计、云端的海量内容资源等都是重要的非技术要素。这些非技术要素对产品成功与否的影响有可能比技术因素的影响更大。


    以我本人为例，我先后体验了多款智能音箱，最后选择入手天猫精灵方糖的原因有两个——优秀的工业设计和亲民的定价，而这两个因素都与 AI 技术无关。天猫精灵箱体虽然材质普通，但依靠一流的工业设计依然吸引了很多用户，其工业设计甚[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)至获得了多项设计大奖。另外，天猫精灵的价格也是比较亲民的，也因此吸引了很多用户购买。


    对于其他的 AI 产品，读者不妨也对照 AI 产品构成要素图来拆分一下。多做几次，你对 AI 产品的理解一定会提升一个层次。


    #### 4.1.3 实用定义、构成要素对产品经理的价值


    AI 产品的实用定义、构成要素对产品经理的价值有以下 3 点。


    （1）打破了 AI 产品的神秘感，扩展了 AI 产品的范围。


    多数传统产品经理对 AI 产品的理解非常窄——认为 AI 产品富有神秘感，只有 AI 技术公司才有 AI 产品。


    通过以上分析，我们知道 AI 产品其实有很多类型。不仅 AI 技术公司有 AI 产品，互联网公司也有 AI 产品。AI 技术已经融入互联网产品中了，传统互联网产品经理都应该看到这个趋势，尽早将合适的
    AI 技术融入自己的产品中，让 AI 技术为产品增值，也为自己增值。


    （2）指明了产品经理对待 AI 技术的正确方式。


    传统的互联网产品经理往往认为做 AI 产品会花费很多时间，认为只有花费很多时间才能系统掌握复杂的 AI 技术知识。


    AI 技术与传统产品经理的关系，类似于核弹与政治家、军事家的关系。核弹在诞生之初，就是一种新的、强大的能力。政治家、军事家并不需要花大量精力去了解核弹的制造及使用细节，只要知道它威力惊人、杀伤力极大，且使用后有长期核污染这些特点后，就能在政治、军事中合理利用。


    明白了这个道理，想升级为 AI 产品经理的人就应该明白，做 AI 产品不必花特别多的精力去理解清楚那么多技术细节，其只需要把 AI 技术视为一种新的强大的能力，理解现有
    AI 技术的原理、能力边界、限制条件就可以了，更重要的是尽快让 AI 技术在产品中发挥作用。


    （3）找到产品经理的技术——场景价值空间，重建产品经理在 AI 时代的信心。


    很多产品经理一度认为，在 AI 时代，产品经理会沦为技术人员的附属品。


    强大的 AI 技术并不意味着成功的 AI 产品。一个 AI 产品是 AI 技术、其他技术要素与众多非技术要素的有机组合。要想将这么多不同的要素组合起来，单靠技术人员是做不到的，因此产品经理是必不可少的。所以，即便在
    AI 时代，非技术背景的产品经理也不会成为技术人员的附属品，他完全可以体现自己的核心价值。


    #### 4.1.4 AI 产品的类型与主体


    根据 AI 技术与产品的关系，可以将 AI 产品划分为 3 种类型，如下图所示。


    ![](img/epub_31486679_54)


    AI 产品的 3 种类型


    <[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)/div>


    AI 产品的主体主要有以下两类：


    （1）AI 研发公司，这类公司可能会做 AI 技术的中间产品和基于 AI 技术的全新产品;


    （2）AI 应用公司，这类公司可能会做 AI 赋能的产品和基于 AI 技术的全新产品。


    AI 研发公司有很强的 AI 技术研发实力，能“生产”AI 技术，如科大讯飞、商汤、寒武纪、云知声等公司。


    AI 应用公司，就是那些不能“生产”AI 技术，但需要应用 AI 技术的公司。而各行各业、各种规模的公司大部分需要应用 AI 技术，只是各公司对 AI 技术需求的迫切程度有所区别，进度有快有慢而已。


    显然，AI 技术应用公司要比 AI 技术研发公司多几个数量级。因此，从长远来看，随着 AI 技术应用的普及，AI 技术应用公司将提供大量 AI 产品经理的职位。


    基于 AI 技术的全新产品是两类公司都有可能涉及的产品。所以，AI 技术公司可能需要重新界定自己的竞争对手。如果一直做 AI 技术的中间产品，那么竞争对手只是其他
    AI 技术公司；如果要做基于 AI 技术的全新产品，可能就要应对新的竞争对手。


    #### 4.1.5 AI 产品中 AI 能力的分布方式


    AI 产品必定包含 AI 能力，AI 能力既可以分布在云端又可以分布在终端。AI 能力在云端与终端的分布有多种模式，下图为 3 种基本模式。


    ![](img/epub_31486679_55)


    AI 产品中 AI 能力分布的 3 种基本模式


    如上图所示，“云+端”模式是最常见的，云端与终端均有一定的 AI 能力，在这种模式下，两端的 AI 能力协调发挥作用。当前大多数 AI 产品采用的就是这种模式。


    在纯云模式下，终端几乎没有 AI 能力，只起到向云端传递信息并从云端获取指令的作用，AI 能力完全来自云端。这种 AI 产品一旦断网基本无法使用。典型的就是天猫精灵、小度等智能音箱。我的天猫精灵一旦断网，无论我如何呼唤“天猫精灵”，它都只会回答我“网络连接失败”。可见，它采用的模式就是纯云模式。


    纯云模式下的 AI 产品还有一种情况，就是 AI 技术公司的能力封装型中间产品。这种产品以 SaaS（一种软件布局模型）的形式提供 AI 能力，供客户远程调用。


    在纯端模式下，AI 能力直接存在于终端，终端有 AI 芯片，直接运作终端推理工作。纯端模式通常也存在云端，但是云端不是和终端实时互联的。云端通常承担着持续训练模型的任务。在训练完新的模型之后，云端可以通过离线的方式对终端的
    AI 能力进行升级。当前有些工业检测用的 AI 产品、医疗 AI 产品采用的就是这种模式。


    规划 AI 产品时，云端与终端配合的方式是规划的内容之一。这 3 种[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)基本模式各有其不同的适用场景，AI
    产品应该根据场景特征选择合适的方式。以人脸识别为例，介绍一下这 3 种模式的区别。


    人脸考勤和门禁一体机通常采用的是纯端模式。其只需要利用一体机本地内嵌的芯片解读获取的人脸信息。这种方式不需要实时连接云端 AI，使用成本低（只需要很少的电费而不需要服务费），速度也很快。


    “普通摄像机+云端人脸识别”就是纯云模式。普通的数字摄像机不是为人脸识别定制的，它只是将包括人脸在内的画面以帧的方式记录下来。这种终端设备不具备 AI 能力，AI
    能力完全在云端。运用这种模式的 AI 产品需要将摄像机拍摄的画面上传到云端，在云端进行人脸识别。这种方式产生了庞大的数据传输量，同时对云端 AI 的算力要求也非常高。


    新一代的人脸识别逐渐转向“人脸抓拍机+云端人脸识别”。文安智能“明镜”智能人脸抓拍相机及设备内置 AI 芯片如下图所示。


    ![](img/epub_31486679_56)


    文安智能“明镜”智能人脸抓拍相机及设备内置 AI 芯片


    人脸抓拍机内嵌智能人脸算法，能够自动捕获人脸，直接输出人脸图片流，这样就不需要在服务器端进行人脸检测。在这种模式下云端和终端都有 AI 能力，大大减少了数据传输量，也提高了响应速度。但是，在终端增加了
    AI 能力也就增加了成本。海康威视的 AI 人脸抓拍相机如下图所示。


    ![](img/epub_31486679_57)


    海康威视的 AI 人脸抓拍相机


