    ### 1.1 技术应用与技术商业


    #### 1.1.1 技术应用与技术商业的一体两面关系


    技术蕴含着巨大的价值，这是现代社会各国之间形成的普遍共识。为了推进技术的应用，各国探索出两条基本路径：一是以政府为主力，用行政的力量来推进；二是以企业为主力，用商业的力量来推进。两者各有利弊，但经过多种技术、多个周期的检验，还是商业的力量更强大、更持久。在当代社会，技术的应用依赖于商业的力量。


    商业有狭义与广义之分。狭义的商业对应的英文是 commerce，是指商贸、贸易；本书所说的商业是广义的，对应的英文是 business，是指基于自愿交易的人类活动、人类制度。从事商业活动的主体是企业，其中重要的组织形式是公司。


    在当代社会，商业所起的作用越来越大，技术应用的成功依赖于商业的成功。集成电路、计算机、互联网等技术之所以被广泛应用，正是因为技术商业的成功。所以，我们探讨
    AI 技术的落地应用，从另一个侧面看就是探讨如何让技术商业获得健康发展。技术应用成功和技术商业成功是一体两面的关系。


    AI 公司是推进 AI 技术落地应用的主体力量。如果 AI 公司能在商业上取得成功，那么 AI 技术的落地应用就会比较顺利，甚至比我们期待得更顺利。互联网技术的应用已经证明了这一点。正是因为蚂蚁金服（蚂蚁金融服务集团）、腾讯公司通过支付宝、微信支付取得了商业上的巨大成功，我国人民才能享有全球领先的支付服务——安全、便利、低成本。


    解决复杂问题的有效方法之一就是转化问题。例如，深度学习就是将无法计算的复杂感知问题，通过深度神经网络巧妙地转化为数值计算问题。同理，我认为 AI 技术落地应用的问题，也可以转化为
    AI 技术公司如何取得商业成功的问题。脱离商业来推进 AI 应用，商业、应用两者都难得；以商业方式来推进 AI 应用，往往商业、应用两者兼得。


    #### 1.1.2 技术商业发展的共性与个性


    技术商业领域有一条非常知名的曲线——Gartner 光环曲线（Hype Cycle），它来自技术研究机构 Gartner（高德纳咨询公司）。Gartner
    光环曲线因成功预言 2000 年的“互联网泡沫”而一战成名。它以简洁直观的图形方式，总结出新兴技术的发展规律，多年来一直是技术商业领域常被引用的模型。Gartner
    光环曲线示意图如下所示。


