    \  | ID：EPUB\\_20260428160408 \n\n### 2.3 理解机器学习的类型及其算法\n\n#### 2.3.1 机器学习的类型\n\
    \n机器学习是一个博大精深的领域，有多种划分方法，也有很多容易混淆的概念。产品经理要想理解机器学习，就需要从重要的分类和概念入手。机器学习的类型及其关系如下图所示。\n\
