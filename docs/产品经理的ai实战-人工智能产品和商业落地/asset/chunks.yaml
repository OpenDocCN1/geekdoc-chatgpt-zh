    ## 12.4 对 AI 技术—场景商业风险的洞察


    ### 12.4.1 技术商业的普遍风险


    AI 有广阔的发展前景，同时也存在很大的风险。


    有人说，金融业就是一个经营风险的行业。其实，哪个行业不是在经营风险呢？只是不同的行业面对的风险不同而已。


    技术带来的价值和技术导致的风险是始终相伴的。例如，电始终伴随触电的风险；金融市场的高频交易公司，采用了先进的技术进行交易，确实实现了更高的收益，但也多次因为技术故障，一个系统做了一个行动，触发了其他系统的一连串行动，进而导致整个市场闪崩，让自己蒙受巨额损失。


    所以，高级 AI 产品经理要吸取其中的教训，尤其是在考虑商业化运作时，必须尽力识别其中的风险。只有将风险识别出来了，才有可能提前采取应对策略，避免损失。


    ### 12.4.2 AI 商业的风险识别


    风险管理的第一步是风险识别，就是要知道在什么地方存在什么样的风险；然后在此准确识别的基础上制定应对策略；最后是执行和实施风险管理策略。这个循环会一直进行下去。


    我习惯性把 AI 商业风险分为两大类：技术风险和非技术风险。


    关于 AI 的技术风险，本书第 2 章已经讲过，在此不再赘述。AI 商业的非技术风险还可以继续细分为多种，包括社会舆论风险、政策风险及竞争性风险等。我们先看其中的社会舆论风险。


    我一直认为自动驾驶汽车是 AI 应用中最难的，无论是在技术上还是在商业化上都是最难的。原因之一就是自动驾驶汽车的社会舆论风险非常大，而且单靠企业自身努力是无法解决的。


    其实，人类驾驶的汽车一直在出交通事故，有详细的统计数据。也就是说，其实道路上经常发生人类司机致人死亡的交通事故，但通常媒体不会大肆报道，公众也不会特别关注。


    但自动驾驶汽车就不同。因为相对人类驾驶，自动驾驶是新事物，媒体、[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)公众会特别关注，即使只发生一起交通事故，都会引起广泛关注。普通民众不会去看准确的数据，即便在所有的关键数据上，如年度万车致死率、百万公里致死率等，自动驾驶汽车都优于人类驾驶，但依然解决不了这个问题。


    试想一下这样的情景：因为自动驾驶技术的成熟，政府部门公布了详尽的测试标准，终于允许自动驾驶汽车上路行驶。经过试点，准许的范围越来越大。而且根据监测数据，自动驾驶汽车的事故率一直低于人类驾驶，而且比人类更遵守交通规则。但是，某天发生了一起自动驾驶汽车的交通事故，致人死亡；3
    天以后，又发生一起自动驾驶汽车的交通事故；又过了几天，事故再度发生。


    如果上路的自动驾驶汽车多了，这种情况出现的概率非常大。而实际情况可能是，第一起事故事发突然，自动驾驶汽车当时面临两难选择，它已经做出了可能做出的损失最小的决策。在这个场景中，如果是人类驾驶，可能会导致更严重的伤亡。第二起事故是人类司机酒后驾驶并且没有系安全带，违章撞向自动驾驶汽车，自动驾驶汽车躲避不及致人死亡。第三起事故是一场高速公路上的连环相撞，自动驾驶汽车只是倒霉的中间车辆——它被后面失控的货车撞击，导致它又撞击了前面的车辆。这一连串撞击导致了货车司机等多人死亡。


    从事过企业危机公关的人心里都清楚，公众有时会根据自己的情绪来解读真相。公众解读出来的真相可能是：自动驾驶汽车这个东西太可怕了！说不定哪天就撞到我了！面对这个局面，政府可能在考虑舆情后，做出临时决定——暂缓发放新的自动驾驶汽车上路许可证，对近期涉事车型暂停许可，对涉事车企、技术公司进行调查……


    如果我是政府官员，我大体也会做出这样的决策，因为这对政府部门而言是相对较好的决策，但这个风险就被相关的企业承担了。


    如果能准确识别风险，就可能采取应对策略，主要体现在以下几个方面。


    （1）对场景的风险进行判断，对高风险场景最好予以回避。自动驾驶场景就是一个风险非常高的场景。在风险管理中有一个消极做法——风险回避，简单地说就是不做某件事，避免相应的风险。这个消极的做法有时是相对较好的做法。


    （2）产品内部和外部的容错。既然知道机器会犯错，那么我们就要提前考虑产品的容错。容错分为产品内部容错和产品外部容错。


    以安防产品为例，对非常重要的场景，在 AI 技术之外一定要安排适当的人力。这就是一种产品外部容错。


    在身份认证中，如果人脸识别的适配度低于某个值（也就是说有较大可能认错），那就启用密码、验证码等其他认证方式。这就是产品内部容错。


    另外，还需要采取适当的公关策略，对公众进行持续的风险教育。前几年，整个 AI 行业在公关宣传上做得比较激进，片面宣传 AI 的能力，对 AI 的风险很少[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)提及，这一点必须改变。既然很大一部分风险来自公众的认知，那就从这个根源入手，采取适当的公关策略，事先打好预防针，使公众对
    AI 有合理预期。


    （3）通过产品创新来解决问题。仍然以自动驾驶为例，上面分析了那么多风险。那对于这些风险我们毫无办法了吗？其实，风险管理还可以通过产品来解决，如平行驾驶解决方案。慧拓智能机器公司提出的平行驾驶系统如下图所示。


