    合格 AI 产品经理的能力杠铃模型


    AI 杠铃模型中没有提到“产品原型绘制”“产品文档撰写”等内容。虽然实际的产品工作中少不了这些事，但杠铃模型提炼的是重要能力，而不是追求把所有能力都罗列出来。没有提到的能力项分为两种情况。


    （1）其包含在重要能力项中。以“产品原型绘制”为例，它就包含在“AI 产品规划”中。产品规划通常需要用原型来表达，因此需要绘制原型。这些属于辅助能力项，其本身难度并不大，容易掌握。


    （2）其属于较次要的辅助能力项、衍生能力项，不需要单独列出。以“产品文档撰写”为例，如果写不好产品文档，主要原因并不是文笔不好、不了解文档的格式，而是对需求、规划等本身没有理解清楚。需求管理、产品规划两项能力弱，就会在“产品文档撰写”上表现出来。不列出这些辅助能力项、衍生能力项，一方面是为了使模型简洁，便于大家掌握，另一方面是为了让大家关注根本、抓住关键。


    ### 4.3.2 AI 能力杠铃模型的优势


    AI 能力杠铃模型是经过了长时间的打磨，经过多次迭代才成型的。与其他能力体系相比，AI 能力杠铃模型具有多方面的优势。


    1. 形象直观，便于理解


    如果把能力杠铃模型也看作一个产品，能力杠铃模型这个产品的界面友好、便于使用。能力杠铃模型中间细长、两端重，与真实的杠铃一样。它表达了两个意思：上手从中间开始，之后的升级主要依靠两端的提升。杠铃的重量直接决定你的薪酬。


    2. 能力杠铃模型与工作流程高度对应


    能力杠铃模型中间的杠铃部分从左到右，与产品工作流程大体吻合。将能力杠铃模型和工作流程对应起来，便于学习。


    3. 兼容性强、适用性强


    能力杠铃模型能兼容、适应各种类型的 AI 产品，适用于各种类型的公司。


    4. 简洁扼要


    没有人会认为自己的能力过多，所以针对某个职业的能力模型可以列出无数种能力要求。对于能力体系，我总结了一个基本规律：唬人的能力体系，往往能力项众多，让人失去信心；实用的能力体系，往往精简高效，让人充满信心。


    5. 能更好地服务于 AI 产品经理的终身能力增长


    AI 能力杠铃模型的使命就是更好地服务于 AI 产品经理的能力增长，而且是终身能力的增长。合格 AI 产品经理的能力杠铃模型和高级 AI 产品经理的能力杠铃模型是紧密衔接、顺畅过渡的。


    希望读者先将 AI 能力杠铃模型用起来，在用的过程中加深对 AI 能力杠铃模型的理解。


