    ## 1.2 X 技术商业的要素及其关系


    在 1.1 节，我们从宏观层面讲解了 X 技术商业的特点，本节我们切换到企业视角，来理解 X 技术商业的要素及其关系。


    ### 1.2.1 X 技术商业的要素与结构


    X 技术商业的要素与结构如下图所示。图中三角形的中间是技术—场景，围绕在它周围的是资源、产品及商业模式，为它们提供支撑的是组织能力。

    ![](img/epub_31486679_10)

    X 技术商业的要素与结构

    这是我长期从事 X 技术商业行业，持续思考、迭代、精简的原创理论体系。因为本书篇幅所限，不能充分展开，所以只对部分要点进行介绍。

    1. 技术—场景

    位居中心的是技术—场景，“技术”“场景”两个词由连字符号连起来，形成一个组合。技术只有和适合的场景结合才能持续应用，也才能产生商业价值。应用同样的技术时，当应用场景发生了变化，就可能产生新的价值；在同样的场景中，应用不同的技术可能产生不同的价值。

    场景最初是一个戏剧术语，指戏剧、电影、电视剧等艺术作品中的场面，进而泛指生活中特定的情景。结合技术商业和产品理解，场景就是用户所处的环境及用户自身状态的总和。

    场景包括用户和需求，如果脱离了场景，用户和需求就过于复杂，让人难以把握。用户的需求就是产品的机会，而用户每时每刻都处于某种场景中。将一个用户经历的诸多场景按时间顺序串联起来，就能勾勒出该用户的特征。需求也是处于具体场景中的，深受场景的影响。某种具体的需求在有些场景中表现得很强烈，而在另外一些场景中可能表现得就很微弱。

    从事技术商业要将合适的技术与合适的场景相适配，找到了这种适配关系就找到了技术产品、技术商业适宜的土壤。因为技术—场景非常重要，所以要将它放在中心位置。

    AI 产品经理需要将合适的 AI 技术与合适的场景适配起来，发现 AI 技术—场景中的商业价值，识别出其中的商业阻力，以此规划 AI 产品、设计 AI 商业模式。

    2. 资源

    要从事商业活动，各种资源是不可缺少的，无论是传统商业还是 X 技术商业，都是如此。

    X 技术商业在资源获取上有其独特性，它以未来可能产生的重大利益换取当前的稀缺资源，如通过 VC（风险投资）获取发展早、中期稀缺的资金。VC 使很多技术产品得以诞生，也使很多技术商业模式得以实现。

    3. 产品

    X 技术商业非常重视产品。产品是价值的挖掘机，如果没有产品，即使看到了商业机会也无法开发其价值。产品是商业模式的基础，商业模式必须基于产品进行构建。

    2016 年至 2018 年期间的 AI 应用遇到了问题，不是因为应用领域选错了，很大程度上是因为相应的产品不够成熟。虽然很多产品顶着 AI 技术的光环上市，但其用户的实际体验感却很差。这样的产品既不能让技术得到持续应用，又不可能获得商业上的成功。

    4. 商业模式

    商业模式是企业商业运作的顶层方式。

    管理学大师彼得·德鲁克说过：“当今企业之间的竞争，是商业模式之间的竞争。”由此可见商业模式的重要地位。商业模式和产品一样，是我研究的重点领域。在两次创业中，我都对商业模式进行了创新，而且我近几年的咨询项目的重要内容就是商业模式。

    下面简要介绍一种商业模式理论，以便读者能对商业模式有一个初步理解。下图为北京大学汇丰商学院的魏炜、朱武祥教授对商业模式的理解。

    ![](img/epub_31486679_11)

    魏朱商业模式图

    魏炜、朱武祥将商业模式分为六大要素：定位、业务系统、关键资源能力、盈利模式、现金流结构和企业价值。上图不仅列出了这 6 个要素，还用箭头表示了它们之间的关系。理解一个企业的商业模式，就是理解这个企业的六大要素及其之间的关系。相应地，为一个企业设计商业模式就是设计六大要素及其之间的关系。

    传统商业模式的创新非常困难，这导致大量的企业以相同的商业模式激烈竞争，也导致很多行业的利润被压缩。相比之下，X 技术商业更有可能实现商业模式创新，相关企业可以享受模式创新带来的红利，互联网商业中就有很多这样的案例。

    5. 组织能力

    要实现发现的价值，不仅要依靠个人能力，还要依靠组织能力。

    很多有各种优势的传统企业进入 X 技术商业领域却没有获得预期的成功，其中一个很重要的原因就是组织能力不足。虽然传统企业的组织中有很多优秀人才，但其组织能力是适应原有业务的，并不适合新的
    X 技术商业。这就需要传统企业快速提升、调整组织能力，以适应新的 X 技术商业。

    知名的风险投资数据公司 CB Insights 对一百多家技术创业公司进行了调研，并总结出技术创业公司失败的主要原因。调研结论和 X 技术商业要素及结构图高度吻合。

    下图列出了导致技术创业公司失败的前 7 个原因，其后的 13 个原因均低于 15%，因此在此就不一一列出了。在导致技术创业公司失败的前 7 个原因中，“没有市场需求”处于第一位，其本质就是技术—场景适配出现了问题。第二位的“资金耗尽”其实是结果，其本质是资源问题。“没有合适的团队”占第三位，其对应的就是组织能力。另外，“被对手超越”“定价/成本问题”“不好的产品”“缺乏商业模式”也是重要的失败原因。

    ![](img/epub_31486679_12)

    技术创业公司失败的主要原因


    ### 1.2.2 理解 X 技术商业要素及其关系的例子


    1. 支付业务的五大要素及其关系

    现在，我们用支付业务的例子，来简单说明 X 技术商业的五大要素及其关系。

    （1）技术—场景。长期以来，我国支付业务的主体是银行和银联，第三方支付处于微弱的辅助地位。支付业务对银行来说只是一个基础业务，并不是重要业务，更不是战略业务。之后，互联网技术带来了巨大的改变，其与支付场景结合形成了新的技术—场景，其中蕴藏的巨大价值首先被以蚂蚁金服（支付宝所属的公司）为代表的互联网公司发现了。

    （2）资源。支付宝一方面依靠资本市场的资金资源，另一方面还充分利用了阿里巴巴电商平台的用户和场景资源，起步就提供了非常适合电商场景的担保交易，解决了电商交易最初的信任问题。此举不仅获得了海量用户，还积累了大量资金，为后续的产品创新（如余额宝）奠定了基础。然而，银行严重忽视了场景资源的价值。

    （3）产品。在很长一段时间内，银行认为自己的支付产品几乎没有什么改进的空间了，用户要做的就是正确使用。但支付宝并不这么认为，它对支付这个看似简单的产品进行了大量的产品创新，而且是持续创新，结果就是支付宝的使用方式越来越便利，安全系数逐步提高，也越来越受用户的欢迎。正因为如此，一些原本属于银行的资源，如银行卡等逐渐被用户后置为支付宝的资金来源。

    （4）商业模式。在很长一段时间内，支付宝是不向收付双方收费的，它开创了支付领域新的商业模式。这个新商业模式的“威力”是逐步显现出来的，当银行意识到这一点时，其也很难扭转局势了。

    用户在支付宝绑定某张银行卡后，通常该银行卡就会被放在钱包里很少再拿出来使用了。随着用户通过支付宝完成一次又一次支付，支付宝与用户的关联越来越强，而银行与用户的关联越来越弱。对此绝大多数银行仍然认为尽管用户使用支付宝支付，但其实还是要从银行卡里扣钱，银行的价值始终还在。最初情况的确和银行想的一样，直到支付宝推出了花呗。

    花呗是蚂蚁金服推出的一款消费信贷产品——给予用户一定的额度，先消费然后按月还款。但支付宝的花呗却比信用卡更加实用、便捷，它不需要实体卡片，不需要庞大的发卡团队和高昂的发卡成本，它只需要通过安装的支付宝
    App 就能使用。很多支付宝用户将花呗的扣款优先级设置得比信用卡还高，这使信用卡出现了双降局面——已开信用卡的支付额下降和新卡申请量的下降，可以说花呗直接抢了信用卡的生意。至此，银行终于意识到自己的价值空间已经被一点点侵蚀了，但此时已经没有有效的办法能阻止支付宝发展了。


