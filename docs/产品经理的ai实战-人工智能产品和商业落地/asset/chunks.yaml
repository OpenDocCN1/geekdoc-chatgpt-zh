    \n（2）对用户选定的视频片段中的所有人脸进行识别，提供可替换的人脸供用户选择。\n\n（3）用用户的脸部特征替换掉目标人脸。因为替换的是连续变化的视频中的人脸，目标人脸的角度、表情都在发生动态变化，要实现自然的替换效果的技术难度很大。\n\
