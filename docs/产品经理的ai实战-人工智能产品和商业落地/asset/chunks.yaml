    （2）指明了产品经理对待AI技术的正确方式。


    传统的互联网产品经理往往认为做AI产品会花费很多时间，认为只有花费很多时间才能系统掌握复杂的AI技术知识。


    AI技术与传统产品经理的关系，类似于核弹与政治家、军事家的关系。核弹在诞生之初，就是一种新的、强大的能力。政治家、军事家并不需要花大量精力去了解核弹的制造及使用细节，只要知道它威力惊人、杀伤力极大，且使用后有长期核污染这些特点后，就能在政治、军事中合理利用。


    明白了这个道理，想升级为AI产品经理的人就应该明白，做AI产品不必花特别多的精力去理解清楚那么多技术细节，其只需要把AI技术视为一种新的强大的能力，理解现有AI技术的原理、能力边界、限制条件就可以了，更重要的是尽快让AI技术在产品中发挥作用。


    （3）找到产品经理的技术——场景价值空间，重建产品经理在AI时代的信心。


    很多产品经理一度认为，在AI时代，产品经理会沦为技术人员的附属品。


    强大的AI技术并不意味着成功的AI产品。一个AI产品是AI技术、其他技术要素与众多非技术要素的有机组合。要想将这么多不同的要素组合起来，单靠技术人员是做不到的，因此产品经理是必不可少的。所以，即便在AI时代，非技术背景的产品经理也不会成为技术人员的附属品，他完全可以体现自己的核心价值。


