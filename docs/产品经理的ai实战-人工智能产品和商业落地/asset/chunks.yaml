    \n这样的基层医院看上去影响力不大，但试想全国有多少个基层医院，覆盖了多少患者？一个基层医院如果运作成功，向其他医院推广的难度就会大大降低；但一个三甲医院的试点成功并不会对其他三甲医院产生很大影响，向其他三甲医院推广的难度依旧很大。三甲医院只能各个突破，而基层医院则有可能批量推广。\n\
