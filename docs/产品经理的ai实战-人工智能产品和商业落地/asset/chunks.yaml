    ### 10.1 互联网产品经理快速成为AI产品经理


    #### 10.1.1 互联网产品经理和AI产品经理的亲缘关系

    AI产品经理是近几年才出现的新职位，从业者大多数是从其他职位转过来的。其中，互联网产品经理和AI产品经理存在很近的亲缘关系，所以互联网产品经理获得AI产品经理职位的可能性很大。我们来看一个具体职位的招聘要求。


    上海某科技有限公司招聘AI产品经理时，对该职位提出的要求多数是关于互联网产品的要求：连续8年以上的产品经理工作经验并有成功上线产品的经验；完整的产品能力；出色的沟通、组织协调能力；优秀的团队管理能力。该职位对于AI的要求只是：对人工智能行业充满热情，有AI产品经验者优先。


    北京某科技公司招聘AI产品经理时，对职位提出的要求直接是具有互联网产品经验：2年以上互联网产品经验，有语音或内容工具产品经验者优先。对AI的要求，只是比较模糊的“对人工智能技术等有深刻的认识，能快速适应业务/行业变化”。


    总体而言，互联网产品经理是离AI产品经理很近的人。


    #### 10.1.2 注意互联网产品与AI产品的区别

    互联网产品经理可以将自己原来在互联网产品管理中积累的很多能力，应用于AI产品管理中，但要注意互联网产品与AI产品的区别。


    1. 互联网产品几乎都是纯“软”产品，而很多AI产品是软硬整合的

    互联网产品的载体是网页、小程序等“软”形式，直接通过互联网进行交付。而很多AI产品是软硬整合的，在专门的硬件上运行专门的AI模型，软硬一起交付给用户。例如，人脸抓拍机、人脸考勤机、手持式AI翻译机、智能音箱等都有专门的硬件。


    互联网产品因为是纯“软”产品，没有专门的硬件成本，所以边际成本非常低。多数互联网产品本身是免费的，希望圈占尽量多的用户。而软硬整合的AI产品由于存在专门的硬件成本，往往要求第一版产品就具有较高的质量。产品发布后，AI模型可以免费升级，但硬件无法升级。


    2. 互联网产品实施周期短，AI产品实施周期长

    因为是纯“软”产品，互联网产品往往采用较短时间快速打造较小的可行产品，尽快将其推向市场然后快速迭代改进。软硬整合的AI产品涉及专门的硬件，会带来一系列相关问题——硬件方案、元器件供应链管理、硬件制造，因此其实施周期比互联网产品长得多。


    3. 业务模式不同

    因为有硬件成本，所以软硬整合的AI产品极少免费，这和大多数互联网产品正好相反。因为要收费，所以就会涉及定价问题，这就又产生了问题。定价过低，固然可能提升销量，但也可能导致亏损；定价过高，不仅影响销量还可能导致产品在竞争中落败。


    4. 用户的尝试门槛和使用心态不同

    用户对互联网产品是乐意尝试的，所以会有很多用户大量下载安装App，体验之后再批量删除。如果产品优秀，就会有较大机会脱颖而出。所以，即便在流量高度集中的今天，爆款互联网产品依然能不断出现。


    用户要体验软硬整合的AI产品通常要支付费用，如果是在网上购买还要等物流送货。这就导致其体验门槛大大提高，很难出现爆款。


    因为互联网产品快速迭代的特点，几乎每一个互联网产品的每一个版本都有漏洞存在，只是漏洞多少和大小的区别。新版本发布时，往往修改了上一个版本的部分漏洞，但也保留了上一个版本的一些漏洞，同时又增加了新的漏洞。长期以来，大多数用户（尤其是免费产品的用户）对此已经习惯并接受了，他们对漏洞有相当强的容忍能力，也习惯了产品的快速迭代。


    但对软硬整合的AI产品，用户的态度就有很大区别。尤其是对几乎无法升级的硬件部分，用户对缺陷的容忍度是很低的。这就要求规划、实施这种产品时要更加谨慎，尽量避免产品出现严重问题。


    互联网产品与AI产品存在很多区别。互联网产品经理一定要警惕两种产品的诸多区别，在产品管理的过程中积极应对。


    当然，AI产品也细分为很多类型，也存在纯“软”形态的AI产品，典型的就是以SaaS形式存在的AI中间产品。这类产品没有专门的硬件，因此和互联网产品没有本质区别，也可以做到快速迭代。如果有选择的可能，互联网产品经理尽量从这类AI产品入手，然后逐渐过渡到软硬整合的AI产品。


    #### 10.1.3 打造高效成长的闭环，为获得AI产品经理职位做准备

    机会只青睐有准备的人。要想真正抓住机会，获得AI产品经理的职位，互联网产品经理还需要做好充分准备。我建议按照以下4步走。


    （1）对照合格AI产品经理的能力杠铃模型，给自己打分。这样可以系统地了解自己当前的能力。

    （2）找出短板，列出改进计划。给自己打分可以让短板明显暴露出来，接下来就要针对短板列出改进计划。

    （3）按计划行动，弥补能力短板。好的机会还需要好的行动来落实。

    （4）检查效果。每隔一段时间，如1~2个月可以对照合格AI产品经理的能力杠铃模型给自己重新打分，以便检查一个阶段内的提升效果。


    当合格AI产品经理的能力杠铃模型中的能力项协调增长到一定程度时，互联网产品经理就具备了合格AI产品经理的能力体系。


    #### 10.1.4 选择适合自己的AI产品经理职位

    互联网产品经理的能力提升到一定程度时，就可以寻找适合自己的AI产品经理职位，主动出击了。


    尽管很多职位的头衔都叫“AI产品经理”，但其具体的行业归属、工作职责、岗位要求存在很大的差异。互联网产品经理应该根据自己的情况，选择适合自己的职位，重点研究、重点争取。下面以具体职位为例进行说明。


    1. 明确要求AI产品经验的职位

    有些AI产品经理职位明确要求应聘者有AI产品经验，如某公司人工智能创新部招聘AI产品经理，其任职要求中包括：主导完成过AI产品从0到1的产品规划和应用架构设计。


    对于这样的职位，如果互联网产品经理只有互联网产品的工作经验，也可以争取机会但不应将其作为重点。


    2. 不要求AI产品经验的职位

    某教育集团招聘的AI产品经理的任职要求是具有3年以上移动互联网产品经验，但对AI产品经验并没有要求。这样的机会比较适合互联网产品经理去争取，尤其是熟悉教育行业的互联网产品经理。


    某科技公司招聘的AI产品经理职位对AI能力有一定要求但比较有弹性：对AI行业有浓厚的热情和好奇心；有AI产品经验者优先。某保险公司招聘的AI产品经理职位关于AI也只是要求对AI感兴趣。这些机会比较适合互联网产品经理去争取，尤其是熟悉相关行业的互联网产品经理。


    3. 强调技术背景的职位

    虽然大多数AI产品经理的职位对AI能力的要求并不高，但也有些职位提出了很高要求。例如，某实验室招聘的AI产品经理就明确要求：计算机、自动化、数学等相关专业硕士及以上学历；机器学习、人工智能、计算机视觉等专业博士优先；熟悉计算机视觉基础算法，对落地场景有深刻理解；有激情和好奇心，对人工智能有浓厚兴趣。


    像这样对AI能力提出了非常明确的高要求的职位，大多数互联网产品经理应该果断放弃，把精力放在更有可能的职位上。


