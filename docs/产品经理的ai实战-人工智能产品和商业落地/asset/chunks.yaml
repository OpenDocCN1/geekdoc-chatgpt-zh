    ## 4. 改革团队结构，增强组织能力


    一个公司要依次做好前面的三件事，需要配合相应的组织能力，而组织能力的基础就是“人才结构+组织方式”。


    人才结构：除了 AI 科学家及 AI 工程师，我们还需要 AI 产品经理，依靠他们解决产品及商业模式的问题。这样，AI 应用之桥才能建成，AI 技术才能真正产生价值。


    组织方式：利用组织方式可以将这些人才组合起来，协调运作，发挥作用。


    有些公司虽然已经开始重视产品和商业人才了，但引进的人才却没有很快发挥作用，这可能是因为组织方式出了问题。例如，选择目标行业、目标场景时，产品经理没有提前介入，而只是在公司确定了方向之后去做细化的工作。另外，很多公司的创始人，尤其是那些强技术背景的创始人，还不知道如何正确发挥
    AI 产品经理的作用。


    在以上四件事中，合格的 AI 产品经理主要做 AI 技术—场景适配和 AI 产品规划，高级的 AI 产品经理则要积极参与商业模式的设计。


