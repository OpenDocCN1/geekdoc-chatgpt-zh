    ### 13.2.1 AI 工业质检中的商业特点和商业机会


    商业模式不是纸面游戏，它要构建在商业环境之上，而商业特点、商业机会则为商业模式的设计提供了条件。要设计好的商业模式，就要充分理解商业特点和商业机会。AI 工业质检中存在一些问题，我们以其中一个为例——需要一次性支付大笔费用。


    当前的 AI 工业质检几乎都是采用“云+端”模式。云有私有云、公有云两种方式，都需要进行大量投入来构建云端算力；端就是要在生产现场布设检测设备。云与端通过网络实现互联，协同完成质检工作。下图是手机盖板
