    ## Gartner 光环曲线示意图


    上图的横轴表示时间，纵轴表示期望值。一项新技术在诞生之后，按时间顺序会经历 5 个阶段。

    技术萌动（Innovation Trigger）：一项新技术引起了大家的注意，媒体开始宣传。

    期望巅峰（Peak of Inflated Expectations）：宣传推高了公众的期望，最终公众的期望达到了不切实际的巅峰。

    跌至谷底（Trough of Disillusionment）：不切实际的期望很快会破灭，技术也因此跌至谷底。

    逐渐恢复（Slope of Enlightenment）：技术的价值终究会体现出来，公众对它的期望也会逐渐恢复。

    稳定产出（Plateau of Productivity）：技术最终得到了广泛应用，技术本身也走向了成熟，不再是一项新技术。

    具体到不同的技术，实际的情况要比上图中的曲线更加复杂。根据我多年在技术商业领域从业、创业、咨询的经验，我发现众多技术在曲线的前 3 个阶段的走势是高度一致的，但跌至谷底之后的走势会出现明显分化，总结为一句话：快起大落，谷底分叉。

    “快起大落”对应着 Gartner 光环曲线的前 3 个阶段，而“谷底分叉”则体现了不同技术之间存在的差异性。“快起大落，谷底分叉”示意图如下所示。

    ![](img/epub_31486679_9)


    ### 快起大落，谷底分叉


    在跌至谷底之后，不同的技术有 3 种不同的基本走向。

    （1）趋于稳定的“常规线”。技术经过调整逐渐反弹并获得较好的应用，但与期望巅峰相比始终有较大差距。这条曲线是大多数技术的走向。

    （2）比较糟糕的“沉沦线”。人们发现某项技术远没有达到期望的效果，该技术的适用场景比预期少很多。

    （3）激动人心的“超常线”。技术在跌至谷底之后强力反弹并获得很好的应用，达成的效果甚至超越了期望巅峰。这方面较有说服力的例子就是互联网。互联网技术在 1999
    年到 2000 年达到了期望巅峰，在 2000 年年底跌至谷底，随后几年逐渐恢复，当前已进入稳定产出时期，取得的应用成功比期望巅峰更高。我经历了互联网光环曲线的
    5 个完整阶段，对此深有感触。

    AI 技术将走出激动人心的超常线——正是基于这个判断，近几年我将主要精力转向了 AI 领域，从事 AI 产品、AI 商业模式的研究、咨询工作，并希望通过这本书将部分收获分享给大家。


    ### 1.1.3 X 技术和 X 技术商业的概念


    以技术为基础的商业就是技术商业。我将能走出“超常线”的极少数技术称为 X 技术，以此为基础的商业就是 X 技术商业。

    X 在这里有 3 层含义。

    （1）X 代表未知数，意味着这种技术有很大的想象空间。

    （2）X 代表乘法运算符号，意味着这种技术具有很强的影响力，会对与它相关的其他商业要素产生重大影响。

    （3）X 代表一个图形，这个图形从中心往四个方向扩展，意味着 X 技术具有广泛的应用场景。

    技术分为很多种，大多数影响面窄，少数影响面广。例如，化工领域中一种制造某种化合物的技术，它只影响化工这一个行业，甚至只影响化工这一个行业中的某些产品。这样的技术就不是
    X 技术。实际上，大多数技术都不是 X 技术。

    集成电路、计算机、移动通信、互联网是第二次世界大战以后出现的少数几项 X 技术。它们的影响力大且较深刻，几乎影响了所有行业，也颠覆了一些行业，甚至创造出了全新的行业。这些
    X 技术还彼此关联，互相促进。AI 技术就是一项较新的 X 技术，而且它也是影响较大的一项 X 技术。相应地，以 AI 技术为基础的 AI 商业也将是一个全新的行业。

    本章主要讲解 X 技术商业的特点，这也是全书内容的基础。


    ### 1.1.4 X 技术的高度不确定性


    X 技术商业包含了诸多因素，其中 X 技术是影响最大的、最不确定的因素。这种不确定表现在 3 个方面。

    （1）技术本身的不确定。从科学到技术，从实验室到实际应用，其中充满了不确定。

    （2）不同技术之间竞争的不确定。技术在源源不断地产生，不同技术之间可能存在竞争关系，甚至是取代关系。例如，显示技术曾经的王者 CRT 技术就已经被 LCD、OLED
    等技术取代，模拟移动通信技术也已经被数字移动通信技术取代，数字移动通信技术也经过了从 2G、3G 到 4G、5G 的快速迭代。虽然还没有明确的技术能取代 AI，但在
    AI 内部不同的技术路线与方向之间可能存在竞争甚至互相取代的关系。目前，深度学习如日中天，以此技术为基础的很多公司有很高的市值或估值。但谁又能预料，今后又会涌现出哪些新的
    AI 技术呢？

    （3）技术要素对其他要素的影响方式、影响程度的不确定。“截至目前，总体而言”，我国的创造性更多地体现在产品、商业模式上，而不是体现在技术上。

    X 技术的高度不确定性使 X 技术商业同样充满了不确定性，而这恰恰也是 X 技术商业的魅力所在。正如今天在互联网商业中取得优势地位的公司，他们的成功几乎都是“意外”。

    正是 X 技术商业充满了高度不确定性，才没有让那些有资源优势的公司持续占据优势地位，同时也给新公司带来了机会，从而使整个商业活动乃至整个社会更有活力。中国的
    AI 商业，不仅有百度、阿里巴巴、腾讯等互联网时代诞生的巨头，有科大讯飞等老字号，还有旷视科技、商汤、依图、云从、云知声等大量新面孔，并且会产生更多新机会。这将让创业家、企业家都有机会，让互联网公司、传统公司都有机会。


    ### 1.1.5 X 技术商业的特征


    X 技术的高度不确定性导致了 X 技术商业的诸多特征。我们简要介绍一下这些特征。

    1. 高难度“拼图”

    在玩拼图游戏时，我们既知道最终的效果，又拥有全部的图块，因此只需要将众多的图块以正确的方式拼合在一起。如果将商业活动视为拼图游戏，那么 X 技术商业就是高难度“拼图”。开始时，我们既看不到最终的效果，又不知道有多少个图块。但我们不能等待，必须在这样的情况下开始拼图。因为只有开始，才有可能完成拼图；如果一味等待，那么只会被淘汰。因此，从事
    X 技术商业，就是在玩高难度“拼图”。

    以移动互联网的“拼图”为例。自从诺基亚在中国市场推出了支持 WAP 上网的手机，就开启了一个希望——实现移动互联网的希望。最初的移动上网是在功能机上通过手机浏览器以
    WAP 方式上网，但其费用高、应用少、体验差。后来又增加了几个“图块”——K-JAVA 应用和 Symbian、Windows Mobile 应用程序。虽然增加的“图块”起到了一定作用，但显然“图块”还不齐全，移动互联网的“拼图”还无法完成。这时业界将期盼的眼神投向了一个新“图块”——3G，他们认为只要
    3G 来了，移动互联网的春天就来了。曾经有一个知名的移动互联网产品，名字就叫“3G 门户”。

    然而，3G 的到来并没有完成移动互联网的“拼图”。之后，iPhone 4 正式进入我国，与此同时以小米为代表的几家企业也推出了性价比较高的安卓手机，这促使我国市场迅速完成了从功能机向智能机的迁移。至此所有“图块”集齐，移动互联网的“拼图”就以极快的速度拼成了。

    从 2004 年我第一次创业定位于 3G 内容平台，到进入平安集团，再到 2010 年第二次创业，时间跨度长达 6 年，移动互联网“拼图”的“图块”才齐全。因此，我认为移动互联网真是高难度“拼图”。

    当前 AI 遇到的问题与移动互联网曾经遇到的问题非常类似。在 2016 年至 2018 年的 AI 发展热潮中，很多“图块”是缺失的，所以 AI 的应用状况并不理想。虽然技术、资本都是
    AI 应用、AI 商业的“拼图”中重要的“图块”，但要将“拼图”完成，还需要 AI 产品、商业模式等“图块”的加入。AI 产品、AI 商业模式是本书讨论的重点。

    2. 起初“物种爆发”，然后“赢家通吃”

    “物种爆发”是形象说法，是指技术商业领域的企业、产品、商业模式在很短的时间内大量涌现。

    商业界也无法容纳过多的“商业物种”，像自然界无法同时容纳太多物种一样。与此类似的 AI 商业领域也已经开始了“物种淘汰”。例如，曾经创立的互联网公司，[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)，大多数很快就消失了。当物种过多时，自然界就会进行物种淘汰。

    自然界在经过物种大爆发、物种大淘汰之后就是“赢家通吃”，即会有一些物种胜出，成为自然界的优势物种。商业界也是如此。例如，在中国互联网行业，最后只有少数的公司占据了整个行业的大部分价值。

    3. 叠浪连击

    叠浪连击是 X 技术商业领域的又一个重要特征，技术掀起的第一浪还没有消失，新的浪潮又叠加上来。

    以零售领域为例，在线零售、移动零售、社交零售、无人零售等，多个浪潮叠加形成连环冲击。大多数零售企业还没有应对好前一个浪潮的冲击，新的浪潮就又扑了过来。零售企业能经受住一个浪潮的冲击已经不容易，能经受住叠浪连击就更难了。

    AI 技术就是正在形成的一个巨浪，它会和哪些浪叠加？叠加之后又会形成怎样的冲击？这些很难预料。

    4. 变化无处不在，“意外”频繁发生

    通常在“赢家通吃”之后，行业格局会变得相对稳固，如化学制药行业、燃油汽车行业多年来的情况一样，几十年很少有新的企业诞生。但 X 技术商业有其独特之处，变化无处不在，“意外”频繁发生，受此影响赢家的名单也会发生变化。

    以互联网商业的一个细分领域——电商为例。当“淘宝+天猫”占据了电商的大半江山之后，我们认为电商格局已定，但京东依靠颠覆行业认知的自建物流崛起了；当我们认为“阿里巴巴+京东”的格局已定，拼多多又依靠移动互联网带来的新机会，采用新的模式以我们难以想象的速度崛起了。电商的变化还没有结束，它又进化成了“新零售”，开始了新的变化，也会出现新的“意外”。

    与传统商业相比，这正是 X 技术商业的独特之处，看似大局已定，其实大局之下始终暗流涌动。由于 AI 大规模商业化的时间尚短，因此更需要学习借鉴其他 X 技术的商业化。AI
    产品经理在进行 AI 产品规划、商业模式设计时，应该充分考虑 X 技术商业的特点，在迷茫时不妨从 X 技术商业的特点中去寻找灵感，寻找突破口。

