    ## 9.3 AI产品的数据机制和指标体系规划


    AI产品经理在进行AI产品规划时要注重两个方面的规划：产品数据机制规划；产品指标体系规划。


    ### 9.3.1 AI产品经理对数据机制的规划


    对于AI产品而言，算法和数据都很重要，而且两者缺一不可。数据机制是AI产品的有机组成部分，如何获取高质量的数据是AI产品经理进行规划时要考虑的内容。


    数据可分为两种：未标注数据和已标注数据。以一张工业产品的图片为例，原图是未标注数据；如果利用标注软件将其中的缺陷在原图中标注出来，它就成了标注数据。用标注数据去训练AI模型，就是监督学习。在监督学习中，高质量的标注数据非常重要，可能比算法和模型本身更重要。


    数据机制包含很多内容，简单分拆如下。


    1\. 数据的获取方式和来源


    数据是批量购买还是用合作的方式获取？这要根据产品、数据的特点来进行规划。好的AI产品经理一定要非常清楚产品所在细分领域的数据情况。


    例如，医疗影像数据有公开数据集，但其他对手也能获得公开数据集，因此很难形成竞争优势。如果想要获得独家数据，就可以与医院进行深入合作。


    有些数据的个性非常强，基本只能自己获取。典型的就是工业产品缺陷数据，不同产品的不同缺陷有非常大的区别，单纯靠公开或外购数据集几乎是无法满足的，这时就必须自己获得数据集并进行标注。例如，为烟草生产企业做烟草包装缺陷检测，合适的方式就是由烟草企业质检部门提供典型的缺陷产品，然后拍成清晰的图片，再由质检工人进行标注。


    2\. 数据标注的规划


    标注的质量会直接影响模型的质量。人工标注很容易出现质量问题，因此数据标注至少会安排两位工作人员：标注员和审核员。标注员负责标记数据；审核员负责审核被标记数据的质量。


    先由人工标注，然后由另外的人工来审核，在一定程度上就可以保障数据标注的质量。这样虽然会增加人力投入，但仍然[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)是值得的。


    数据标注需要相应的软件工具，需要考虑到如何提升效率，如快捷键的设置、边标记边保存等功能的应用。


    另外，通过计算标注人员的标注正确率和被审核通过率，对其标注质量进行追踪记录，并利用“末位淘汰制”提高标注人员的标注质量。


    数据机制、标注工具和检验机制都是需要针对产品专门进行规划的，虽然有共通的地方，但不同的产品、不同的数据，都有自身个性化的地方。


    3\. AI模型检测的规划


    AI技术人员利用数据进行AI模型训练，并对模型是否到达了预期需要进行检测。而检测通常离不开人工检测，这也是产品经理要考虑的事情。


    还是以烟草包装缺陷检测为例，检测时最好安排真实生产出来的产品由AI模型检测，同时安排人工检测，将两者的结果进行对比以发现问题。


    4\. 从数据角度参与AI模型的改进


    对AI产品经理而言，AI模型是个黑箱，产品经理对AI模型本身没有发言权，但产品经理可以从数据角度参与AI模型的改进。


    例如，公司有一个车险定损的AI产品，需要AI模型能非常准确地识别车型。因为不同车型的部件不同，价格、工费都不同，这会直接影响定损金额。技术部门构建、训练了AI模型，但是在测试时暴露出一个问题——AI模型对一汽大众某个系列的车型识别率很低。


    经过初步分析发现，这个系列的车型和上汽大众的某个系列的车型非常相似，导致AI模型容易识别错误。产品经理找到了初步原因，又推测用于训练AI模型的数据可能也有问题，于是抽查了标注过的车型数据。这些车型数据标注工作是外包的，抽查发现外包公司在对车型进行标注时出现了很多标注错误。也就是说，因为标注人员认错了车型，导致“教”出来的AI模型也认错了。


    找到了数据上的原因，产品经理就可以采取以下措施，帮助AI模型改进。


    （1）针对高度相似的车型，专门补充一批数据，增强AI模型的识别能力。


    （2）和外包标注公司沟通，要求他们修改标注错误。


    （3）将补充、修改后的数据提供给技术部门，重新训练AI模型。再次测试时，发现车型识别错误的问题已基本解决。


    虽然AI模型对产品经理来说是一个黑箱，但产品经理可以从数据角度参与AI模型的改进。


