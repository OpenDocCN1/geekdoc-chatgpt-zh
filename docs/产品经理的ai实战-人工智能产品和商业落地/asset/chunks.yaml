    ## 第5章 AI技术—场景适配


    ### 5.1 AI技术—场景适配的基本方法


    #### 5.1.1 AI技术—场景的适配前提


    AI技术与场景是两个要素，要将两者适配起来的前提就是要对AI技术与场景两个要素都有较深的理解。这正是进行AI技术—场景适配的难点。以我接触的AI产品经理的情况而论，大多数AI产品经理其实对AI技术与场景的理解都不够深入，所以只能是上级指方向，自己去执行，其本身的作用并不大，其价值也不能得到体现。因此，产品经理只有对AI技术与场景都进行深入理解之后，才能将AI技术—场景进行适配，让公司起步就走对方向。


    关于AI技术，我们在基础篇第2章进行了讲解，并且从产品经理的角度对AI技术的实质和特点进行了分析，其主要目的就是为本章的内容奠定基础。


    相比对AI技术的理解，对场景的理解更加困难。因为现实中的场景非常多，每个场景都包含了丰富的内容，而且很多场景处于快速变化中。没有人能理解所有的场景，并且在他所理解的场景中，也只有少数能达到深刻理解的程度。


    AI技术有明确的学习目标和学习路径，一个智力正常的人只要足够努力，就可以实现快速入门。但场景却是另外一番景象，其学习目标、学习路径都不明确，因而场景的学习是非常困难的。


    为了较快提升对场景的理解，我有一些建议可以供读者参考。


    （1）从身边的商业场景开始观察。


    （2）阅读关于商业场景的优秀图书，借助他人的智慧提升自己的场景理解能力。


    （3）求精不求多，持续关注和深入研究一两个场景，比泛泛地了解众多场景更有价值。


    举个理解零售场景的例子。每位读者都会购物，都是零售行业的顾客。作为普通顾客，我们在零售场景中只关注自己喜欢的商品，注重自己的购买体验。而作为产品经理，如果想要理解零售场景，就要跳出普通顾客的视角。例如，我们进入盒马鲜生、超级物种等新零售店铺，可以留意观察一个店铺有多大面积？以哪类商品为主打？有多少店员？观察一下其他顾客的行为，他们是单人购物还是家庭购物？正在进行什么促销活动？有什么独特的地方？只要用心，就可以看出很多东西。


    再如，我们在地铁里看到自动售货机，不妨思考一下里面为什么会摆放这些商品？如果自己来运营，会如何选品？除了自己体验整个过程，不妨停留片刻观察一下其他顾客购物的全过程。


    如此养成习惯，我们慢慢就能从顾客视角切换到行家视角，对新零售场景的理解也就加深了一个层次。想要快速提升对其他场景的理解，其道理和基本做法也是一样的。


    #### 5.1.2 AI技术—场景的适配矩阵


    关于AI技术和场景的适配问题，我们可以借助一个工具——AI技术—场景的适配矩阵来理解，具体如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_62)


    AI技术—场景适配矩阵


    我们按作业对象是人还是物、内容是否标准将场景划分为4个象限，这4个象限中的AI技术有不同的适用程度。


