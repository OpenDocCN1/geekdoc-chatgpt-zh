- raw: "因为AI技术对中国平安具有战略价值，所以中国平安不仅是AI技术的应用者，还是AI技术的创造者。2019年，平安科技公司凭借自身的AI技术实力，在由斯坦福大学发起的机器阅读理解和深度学习推理两项赛事中夺冠。\n\
    \n对AI应用感兴趣的传统企业，应该认真研究中国平安的AI应用经验，以从中吸取经验。\n\n\\[https://t.me/+WwC4dCWvXRdhOTNh\\\
    ] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 8.2 传统企业做AI产品的原因及AI产品的分类\n\n#### 8.2.1 传统企业做AI产品的原因\n\
    \n虽然互联网公司是大规模应用AI技术的先驱，但传统企业的AI应用也正在兴起。如果留意AI产品经理的招聘信息，我们会发现来自传统企业的职位正在逐渐增加。希望获得AI产品经理职位的读者，不妨多关注一下传统企业所提供的机会。\n\
    \n下面，我们来简单分析一下传统企业做AI产品的原因。\n\nAI技术的价值逐渐得到了广泛的肯定，其中包括传统企业。传统企业对自己的业务场景非常了解，也逐渐认识到AI技术可以满足自己的场景需求。因为AI技术并非传统企业的强项，所以传统企业会先寻求外部采购，希望AI技术公司能提供可立刻使用的AI产品。即使没有成熟的AI产品，传统企业也希望外包给AI技术公司来开发。因此，在很长一段时间内，很多AI技术公司的主要收入就来自传统企业的外包业务。\n\
    \n外购AI产品、外包AI项目满足了传统企业的部分需求，但不能满足其全部需求。一些领先的传统企业对AI的理解可能比AI技术公司更深，更何况传统企业对自己的业务场景有天然优势。当外购、外包不能满足其需求时，一些实力强的传统企业就开始自己打造AI产品。于是，我们看到一些实力强大的传统企业开始招聘AI产品经理和AI工程师，以使自身既有AI产品规划能力，又有AI产品实施能力。\n\
    \n其实，“传统企业”只是一种习惯说法，具体是指AI技术公司、互联网公司以外的企业。传统企业也在演变，并逐渐向AI技术公司、互联网公司的领域渗透。以金融业为例，近年来一些大型的金融集团（以中国平安为代表）纷纷成立专门的科技公司，这些科技公司最初只为本集团服务，后来逐渐开始从集团外获得客户。\n\
    \n#### 8.2.2 传统企业AI产品的分类\n\n传统企业打造的AI产品大体可以分为以下两类。\n\n1\\. 利用AI技术，改造、提升原有的IT产品、互联网产品\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)s=\"content\">华住酒店集团（旗下有汉庭、全季等酒店）就曾招聘高级产品经理（AI方向）。华住酒店集团的主业是酒店，旗下运营着众多的门店。呼叫中心、门店前台对于酒店运营非常重要，因此公司希望借助AI技术把呼叫中心、门店前台系统做得更好。\n\
    \n例如，客人通过呼叫中心订房时，酒店需要核实客人的身份。传统方式需要客人报身份证、会员卡等信息。而如果采用声纹识别技术（一种AI技术），就可以对客人进行无感身份核实，更快完成预定。如果门店前台能利用好AI技术，就可以为客人提供自助服务，使其更快完成入住和离店手续，避免高峰时段排长队。要在这些场景中用好AI技术，就需要专职的AI产品经理来进行规划。\n\
    \n另外，还有不少知名教育机构开始招聘AI产品经理。新东方、VIPKID等教育机构为了支持业务运营，开发运营了很多用户端及后端产品。这些产品原来是传统的IT产品、互联网产品，但教育机构逐渐看到了AI技术的价值，招聘了AI产品经理来提升这些用户端及后端产品，使其更好地支持教育业务。\n\
    \n2\\. 利用AI技术打造新产品，但一般仍然服务于原有的业务体系\n\n例如，泰康保险集团旗下的泰康健康产业投资控股有限公司（简称泰康健投），就曾招聘AI硬件产品经理，希望打造出AI护理机器人这样的产品。泰康健投的主营业务是医养业务，其主要服务对象是老年人。该公司打造的AI产品仍旧是为老年人服务的，主要应用在公司运营的养老院中。\n\
    \n比亚迪是一家知名的汽车公司，该公司曾专门招聘AI语音生态产品经理，负责DiLink AI语音助手的产品规划。比亚迪的主业是汽车产业，DiLink AI语音助手也是服务于汽车产业的。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 8.3 在传统企业做AI产品\n\n#### 8.3.1 传统企业对AI产品经理的要求\n\
    \n相比互联网公司和AI技术公司，在传统企业做AI产品有其特殊性。\n\n典型的互联网产品经理进入传统企业担任AI产品经理，需要满足哪些要求呢？具体可以用下面的等式来概括：\n\
    \n传统企业的AI产品经理=互联网产品经理+AI技术+垂直行业\n\n传统企业的AI产品经理既要懂AI技术又要懂垂直行业，只有这样才能将AI技术和垂直行业的具体场景适配起来，打造出能服务好主业的AI产品。因此，在传统企业做AI产品，难度是很高的。但因为传统企业体量大、数量多，有可能提供大量的AI产品经理职位，所以值得读者特别关注。\n\
    \n#### 8.3.2 在传统企业做AI产品的关键\n\n1\\. 深入理解行业场景，实现AI技术与行业场景的适配\n\n理解行业场景是AI产品经理在传统企业做AI产品的第一步，AI产品经理只有做到了这一点才能实现AI技术与行业场景的适配。\n\
    \n以平安小贷公司的客服机器人为例。平安小贷的客户需要先在网上提交申请，之后由客服外拨电话进行核实。原来这需要大量的人工客服人员，后来采用了客服机器人。我听了实际录音，应用效果非常好。\n\
    \n客服机器人问：“请问，您今年多少岁？”\n\n客户：“……”\n\n客服机器人：“对不起，我没听清，您能再说一遍吗？”\n\n客户略有点不耐烦：“30岁！”\n\
    \n客服机器人：“喔！好的，30岁。这次听清了！”\n\n这既满足了业务需要，又节约了运营成本。同时，这也和贷款核实的场景特征有关——用户高度配合，对话内容非常明确，整个过程也很简短。客服机器人和这样的场景高度适配。\n\
    \n2\\. 选择单点切入，从简单的AI产品起步\n\nAI产品经理在传统企业做AI产品，一定要暂时忘记雄心勃勃的“行业解决方案”，先从单点切入，从简单的AI产品起步。\n\
    \n中国平安对AI的全面应用是经过一段时间积累的结果，其最初也是从单点切入的。例如，中国平安对AI技术的实际应用开始于2016年的“6[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)分钟刷脸放贷”。它只是在放贷业务的用户身份认证这个环节应用了一项成熟的AI技术。这样的单点价值明确、涉及面小、技术实施难度低。从这样的单点切入，AI产品更容易规划，也更容易实施。单点切入可以让AI技术更快发挥作用，让整个组织、整个业务在实际应用中逐渐理解、接纳AI技术和AI产品，然后以此为基础逐渐扩展到全场景，使AI技术发挥越来越大的作用。\n\
    \n3\\. 选择重点场景，做出复杂产品\n\n传统企业的运营可以细分为很多环节、众多场景，场景不同，其重要性也是不同的。实现了简单场景的切入之后，可以在适当的时机选择重点场景，做出复杂产品，如中国平安的AI车险定损理赔。\n\
    \n车险是重要的财产保险业务，占据了财产险公司的收入“大头”。其中，车险定损因为直接涉及保险公司的大笔支出，是整个车险业务中的重要场景。传统的车险定损流程包括报案联系、现场勘查、理赔资料整理、定损、审核等冗长的环节，客户体验差、运营成本高、欺诈风险高，一直是保险公司的痛点。\n\
    \n中国平安旗下的平安科技自主研发了平安脑智能引擎，利用AI技术来挖掘车险图像数据信息，实现线上自动定损。其通过智能引擎分析事故现场照片，提供车险查勘与定损、零件配型、车型识别、同车检测等综合服务，直接跳过了多个传统定损环节，提高了定损理赔效率。也就是说，借助AI技术，大多数车险定损不需要定损人员到场，远程通过AI就能完成。AI车险定损的示意图如下所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_82)\n\nAI车险定损的示意，来自深智科技\n\
