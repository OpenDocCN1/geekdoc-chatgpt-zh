    # 2.5 人工智能的实质和机器学习的问题


    ## 2.5.1 当前人工智能与环境和人交互的全过程


    为了使读者理解人工智能与环境和人交互的全过程，我绘制了一张示意图，如下所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_45)


    人工智能与环境和人交互的全过程示意图


    上图是人工智能与环境和人交互的全过程，它包括以下5个环节。


    （1）传感。这个环节依靠传感器完成。人工智能使用的传感器大体可以分为两类：一类是传统传感器，如普通摄像头、麦克风等；另一类是因人工智能需要而发展起来的专门的AI传感器。实际上，人工智能引发了传感器领域的技术爆发。越来越多的新型传感器被发明出来，让人工智能“长”出了更敏锐的“眼睛”。


    （2）感知。这个环节开始涉及智能了，这也是目前人工智能比较成熟的环节。图像识别（包括人脸识别）、语音识别等都属于这个环节。


    （3）认知。严格地说，这个环节的智能才是真正的智能。目前，在这个环节中，人工智能的水平还处于初级阶段。要想实现通用人工智能及强人工智能，就必须在这个环节对人工智能进行大幅提升和根本改变。


    （4）生成。环境和人不知道人工智能系统的“想法”，系统需要生成内容以便表达给环境和人。它可能是一个决策、一个指令、一个句子或者一幅图画。


    （5）表达。系统生成的内容以环境便于接收、人类便于理解的方式表达出来。例如，将一个指令发送给机械手臂，让机械手臂拿取一个物体；将一些内容用人类的语言通过扩音设备播放出来——“明天您的车限行。为了赶上地铁，您需要比平时早15分钟出门，我已经将您的闹钟提前了15分钟”。


    严格地说，传感与表达这两个环节本身并不属于人工智能，但它们是人工智能系统与外界交互的必须环节。


    现在的AI实际上是“多传感，强感知，弱认知”，其实它还没有真正的“智能”。人们在利用基于当前人工智能的技术进行产品规划和模式设计时要充分注意这一点，在充分利用“多传感，强感知”的特点的同时，尽量避免“弱认知”的短板。


    以道路驾驶场景为例。人类在视野边缘看到一个车轮和一个车门，就能判断有一辆汽车在路边。而所谓的自动驾驶系统，看到同样的画面很难认识到路边有一辆整车。这些自动驾驶汽车安装了多个摄像头、激光雷达等传感器，在感知方面已经明显超过了人类，但是其在认知能力上仍然弱于人类。同样都是一大片白色的区域，人类可以快速准确地判断出这是白色的货车车厢，但自动驾驶汽车却可能将它判断为天空。


    ## 2.5.2 机器学习的问题


    当前的机器学习虽然很强大，但也存在很多问题。产品经理要理解这些问题，并在规划、执行中充分考虑这些问题。


    ### 1. 易过拟合


    过拟合也被称为过学习，是指算法在训练数据集上表现良好，但在测试数据集上表现得不好。


    举个直观的例子。我们在学校学英语，原本是为了在真实的英语环境中正确使用英语。为了学好英语，老师让我们做了大量的英语练习和考试。如果是非英语专业的学生，在大学能通过大学英语六级考试，他会认为自己的英语水平已经很高了。而一旦遇到真正的以英语为母语的人，他就会发现自己连简单的交流都很难做到。长期以来，我们习惯了我国的英语老师测试的内容（往往脱离语言环境），因此能在考试中拿高分。但我们过于适应这种学习环境，反而不能应对真实的英语环境。这就是过拟合的例子。


    要解决过拟合问题，根本方法还是精心安排训练数据，使训练数据集尽量覆盖各种情况，避免某种倾向。例如，我们用大量含有羊的图片训练出一个模型，我们当然希望提供一张它从来没有见过的图片，它也能准确地识别出图片中是否有羊。新的图片被一张张送入系统，系统准确地识别出了图片中是否有羊。但是，当我们将一张草坡的图片（图片中没有羊，只有草坡）给模型“看”时，模型也会错误地认为该图片中有羊。有羊的草坡图片和没有羊的草坡图片如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_46)


    有羊的草坡图片和没有羊的草坡图片


    为什么会出现这样明显的错误？原来，用于训练的图片中在有羊的大多数情况下也同时有草坡。其实，机器根本不认识羊，它只是从众多图片中总结出有羊的规律。如果新的图片在很大程度上符合这个规律，它就判断有羊。而在多数训练图片中，羊和草坡是同时出现的，因此机器总结出了错误的规律。只是这个错误的规律是隐藏的，在新的图片中如果同时有羊和草坡，它就能根据这个规律做出正确的判断；在新的图片中如果只有草坡没有羊，它做出的判断就是错误的。


    找到了问题的根源，解决方案就比较简单了。只需要在训练模型时，提供给机器的关于羊的图片尽量多样化，使机器找出正确的规律即可。这样的训练模式可避免机器再将草坡误认为羊。


    只要人类的智能少一点，机器的“智能”就会差一点。现在的人工智能只是人类智能的外化。


    ### 2. 机械、难变通


    因为机器没有真正的“智能”，它只是找出了规律组合，所以它无法像人类一样变通。而变通是一种极为重要的能力，它能让人更好地适应变化的世界。


    举一个例子：如果我们用数百万张耳朵竖立的兔子图片训练人工智能模型，当我们让人工智能“看”耳朵不是竖立的兔子时，人工智能会认为这不是兔子，而是一种别的动物；但如果是人类，即便从来没有见过耳朵不是竖立的兔子，也会认出这是兔子。


    黑天鹅的道理也是如此。17世纪之前，欧洲人认为所有的天鹅都是白色的。后来到了澳大利亚，在那里尽管是第一次看到黑天鹅，但欧洲人还是能立刻确认“这是天鹅，黑色的天鹅”。如果是人工智能，情况就不同了。如果用来训练模型的所有天鹅都是白色的，人工智能会将这个认知固定下来，而当其看到黑色的天鹅时，其只会认出这是一种黑色的鸟，而不会认为这是天鹅。


    ### 3. 难解释、不可信


    由于现在的机器学习算法越来越复杂，常常综合了多种算法，用于训练的数据集非常庞大，人类根本不可能一一检查，这就导致人工智能的模型非常复杂。


    我们用大量的数据、复杂的算法及强大的算力训练出了一个模型，我们认为这个模型具有了某种智能。因为给了它10000张图片，它都能正确识别，但是你无法肯定第10001张它还能否正确识别。


    ### 4. 难识别


    一张特殊图案的贴纸、人眼几乎无法察觉的噪点、一点点涂改，这些不会导致人类识别错误，但却可能让AI做出完全不同的判断。


    稍微涂改一下路边的交通标志，人类还能正确识别，但自动驾驶系统就可能对这个重要标志视而不见，进而可能导致严重的交通事故。未涂改及涂改后的交通标志如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_47)


    未涂改及涂改后的交通标志


    不仅是二维图像，一些特殊形状的3D物体会让激光雷达错误地把它当作行人，甚至可能完全“看”不见。


    还是以人脸识别为例，识别对象配合与不配合会对识别效果产生非常大的影响。人脸考勤、人脸闸机就是配合的场景，这种场景的识别率已经很高了。而安防就是典型的不配合场景，如果再考虑环境的复杂性，真实的识别率其实要低于媒体宣传的识别率。

