    ## 9.2 极简AI产品


    极简AI产品是较容易成功的AI产品——容易规划、容易说服公司高管、容易进行技术实施、容易被用户接受，即使失败了也没有太大损失。传统产品经理最好由此入手。


    ### 9.2.2 极简AI产品的例子


    现在，我们就从一个非核心的功能模块、功能点入手，引入AI技术，做出自己的第一个极简AI产品规划吧。下面提供一个参考。


    1\. 合适的切入场景


    很多互联网产品都有一个功能——签到功能。


    这个功能既有简单无趣的点“签到”即完成的方式，又有复杂有趣的“翻牌”“转盘”“摇一摇”等方式。下图就是一个略带游戏成分的签到界面。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_84)


    略带游戏成分的签到界面


    签到功能普遍存在的问题是枯燥无趣，很多用户根本不用，用过的用户也会很快失去兴趣。上图所示还算比较有趣的，但也只是数据稍微好看一点。增加奖励刺激固然能提高使用量，但限于成本，也不是长久之计。


    而AI技术或许可以在这个功能模块中发挥作用。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)2\. 相应的AI技术


    那么哪项AI技术能在上面的场景中发挥作用呢？人脸情绪识别技术。这项AI技术可以根据摄像头捕捉的影像，判断用户的表情及情绪。作为产品经理，要用好、用对这项AI技术，需要先了解这项技术的原理，具体如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_85)


    人脸情绪识别技术原理图


    如图所示，人的情绪不同时，其面部表情会有相应的特点，具体体现在眉毛、眼睛、脸颊及嘴唇的形态上。AI技术可以通过检测眉毛、眼睛、脸颊及嘴唇的形态，判断出用户的情绪。


    用户拍照后上传照片，AI云端就会利用人工智能先识别出图片中的人脸，进而识别出人物的情绪。


    3\. 产品规划要点


    下一步是进行产品规划。产品规划具体有以下要点。


    （1）产品的整体结构不改动，签到模块的界面、原有方式依旧保留，老用户可以继续按原有的习惯使用。


    （2）只在原有的签到模块上增加一个新功能点——情绪签到。用户在原有的签到界面会看到一个新按钮“笑一笑，就签到”，并配有简短的文字说明。


    （3）用户点击这个按钮，直接调出自拍界面，界面提示“发自内心的微笑，可以得高分哟”，用户对着镜头微笑自拍后，AI云端会进行情绪识别，给出相应分值，并有配套界面提示“您今天心情不错，快乐指数80分，获得积分15分！祝您一天都有好心情”。


    （4）之后，会出现相应的按钮让用户生成心情海报，然后分享到朋友圈。


    按照我们前面给出的AI产品的定义，上面这个规划包不包含AI技术呢？包含。AI技术有没有发挥作用？有，它可以使更多用户更多地签到。那么，这就是一个AI产品，一个极简的AI产品。


    4\. AI产品的交互原型


    既然是产品规划，必然涉及需求表达的问题。这里的需求更准确地说是产品实施需求——产品经理对产品实施团队提出的需求，这与用户的需求是不同的。产品经理只有清晰地将需求表达出来才能让后续的设计、技术团队准确理解，进而正确实施。


    互联网产品规划需求表达的基本就是“原型+文档”，其实AI产品的需求表达也是如此。其中，特别值得注意的是原型。极简AI产品规划的原型最好是真机高保真交互原型。这里有3个关键词：真机、高保真、交互。


    （1）真机演示。虽然产品经理做原型是在电脑上，但是终端原型一定要能在真实的目标机器（手机较为典型）上演示。


    （2）要高保真[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)。这里的高保真不是用户界面视觉上的高保真，而是操作环节、交互上的高保真。


    （3）交互演示。用户点击界面就可进入其他界面，不同的操作可以进入不同的界面，以最大限度模拟真实体验。


    由于现在大多数公司高层、设计师、工程师都对AI产品比较陌生，很难根据文字描述想象出产品。产品经理在真机上演示的高保真交互原型能以最直观的方式帮助他们理解产品。


    互联网产品经理常用的3个交互原型设计工具：Axure RP、Mockplus、墨刀，都能做出可真机演示的高保真交互原型。


    ### 9.2.3 不同类型产品的AI化


    在规模较大的互联网公司，互联网产品的划分已经相当细化，相应的产品经理也更加精专。互联网产品有两种划分方法，具体如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_86)


    互联网产品的划分方法


    上图分为左右两部分。左侧是一种划分方法，将互联网产品按产品服务对象的身份划分为内部产品（服务于企业内部）和外部产品（服务于企业外部的用户、商户）。外部产品又可以划分为用户产品和商业产品，其中用户产品又可以根据用户的性质分为2C用户（个人用户）产品和2B用户（企业用户）产品。


    右侧是另外一种划分方法，将互联网产品按产品经理的工作对象划分为功能产品和策略产品。最初，互联网行业只有功能产品，后来随着一些公司的用户规模越来越大，产品越来越复杂，相应的产品策略也越来越复杂和重要，于是这些公司划分出专门的策略产品，交由专职的策略产品经理来负责。


    各种类型的互联网产品都有AI化的机会，且各有其特点。互联网产品经理要紧密结合自己负责的产品的特点，来选定产品AI化合适的切入点和路径。刚刚介绍的极简AI产品是以2C用户产品为例的，下面我们简要介绍一下其他类型互联网产品的AI化思路，为不同类型的产品经理提供参考。


    1\. 2B用户产品的AI化


    与2C用户产品相比，2B用户产品更加强调功能、流程及可衡量的价值。这些正是产品AI化合适的切入点。


    例如，报销管理类的2B用户产品可以利用AI技术让产品的整体价值得到明显提升。以前，员工每次报销都需要自己填写大量的票据信息，花费很长时间。如果将产品合理地AI化，员工只需将报销票据拍照上传，产品就会利用AI技术识别票据并从中提取关键信息，从而大大减少报销时间。员工并不需要理解AI技术，就能通过明显的对比快速理解产品的价值。


    2\. 商业产品的AI化


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)商业产品是直接获取收入的产品，它的重要指标体系都是紧密围绕收入的，所以商业产品的AI化也要为获取收入服务。


    例如，一个广告产品可以利用AI技术挖掘出被浪费、被低估的广告资源（包含广告位置、广告机会等）。这些资源要么主动推送给有可能购买的现有广告客户，要么提供给销售人员用于开拓新客户，但无论哪种都能直接为获取收入服务。


    3\. 策略产品的AI化


    策略产品的AI化趋势非常明显，很多策略产品已经实现了AI化。


    一般来说，只有大公司才有专门分离出来的策略产品。这些策略产品最初是标签、画像、规则的组合，当产品复杂到一定程度时，人工就难以有效地管理它。例如，有些公司的策略产品在AI化之前，包含了超过两万条规则。这时要想让策略产品继续成长，尤其是健康可控地成长，就必须采用AI技术，将其AI化。


    策略产品的AI化是非常复杂的，需要产品经理既懂策略产品又懂AI技术，还要和技术人员（包括策略算法人员、AI技术人员）共同探索。


    ### 9.2.4 获得公司高管的认可，推动技术团队实施


    当你精心做出了第一个极简AI产品规划，并且用真机高保真交互原型和文档进行了清晰的表达后，还必须获得公司高管的认可，推动技术团队实施。


    公司高管与技术团队是互相影响的。公司高管是否支持你的AI产品规划，要考虑诸多因素，其中一个重要因素就是技术团队对这个规划的看法。技术团队是否能实现这个规划？要花多少资源（人力、时间）来实现？同时，技术团队是否支持你要考虑公司高管的态度。


    要取得公司高管与技术团队的支持，你可以按照以下步骤来进行。


    1\. 先和技术负责人进行非正式沟通


    首先和技术负责人进行非正式沟通，和他谈谈人工智能的问题。


    对于新技术，技术负责人一般会持有两种态度：有兴趣很想上手；有点畏惧不敢尝试。


    如果技术负责人是第一种态度，你可以先试探着说自己近期考虑在产品中加入AI成分，他通常会支持。你再告诉他是情绪识别，请他研究一下相应的公司和应用程序接口。这样的技术负责人可以帮助你获得公司高管的认可。


    如果技术负责人是另外一种态度，你也不能放弃，要降低他的畏惧感。让他知道，其实使用AI技术的难度并不大。


    技术负责人不支持AI产品规划，可能还有一个很现实的压力——堆积的需求已经太多了，害怕继续增加需求，尤其是他们不熟悉的AI技术需求。遇到这种情况，你首先要能换位思考，避免和对方起冲突。我推荐一个特别重要的思维——交易思维。你要和技术负责人达成一种“交易”——如果技术支持第一个极简的AI产品规划，那么最近一个版本的需求规模会比以往略小，会给技术团队留出充足的时间来应对。这可能是比较有效的说服方式。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)2. 找公司高管谈，但不指望一次谈成


    有了前面的准备，可以去找对应的公司高管了。公司高管为什么会不支持你的AI产品规划？常见的原因有以下几种。


