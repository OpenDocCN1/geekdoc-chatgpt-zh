    \  | ID：EPUB\\_20260428160408 \n\n### 4.3 合格AI产品经理的能力体系——AI能力杠铃模型\n\nAI产品经理职位刚刚出现不久，用人公司及AI产品经理自身普遍都没有清晰地认识到AI产品经理的能力体系。一个人如果想成为合格的AI产品经理，就需要先了解合格AI产品经理的能力体系。只有了解了能力体系，才会有正确的努力目标。\n\
    \n#### 4.3.1 合格AI产品经理的能力杠铃模型\n\n当前的AI产品经理还是一个缺乏标准、缺乏体系指导的专业岗位。我根据近几年在AI领域的观察、研究及咨询实战的经验，提炼出了合格AI产品经理的能力杠铃模型。希望这个模型可以给对AI产品感兴趣的人提供明确的指导，让大家高效成长，这对个人及整个AI商业都是非常有利的。\n\
    \nAI产品经理也分为多个层次，本书讲到了两个层次：合格AI产品经理及高级AI产品经理。大多数对AI产品经理职位感兴趣的人，通过正确的方法学习一段时间后，都可以从事AI产品工作，进入AI产品之门。再加上实际工作的磨炼，一般经过2~3年就可以成为合格的AI产品经理。如果有任职互联网产品经理的经验，这个时间还可以再缩短一些。\n\
    \n在合格AI产品经理中，只有少数最终可以成为高级AI产品经理。高级AI产品经理是公司的宝贵财富，对AI商业、AI应用会起到关键作用。本篇我们主要讲合格AI产品经理的能力杠铃模型，第三篇再讲高级AI产品经理的能力杠铃模型。\n\
    \n合格AI产品经理的能力体系，可以用一个形象直观的杠铃模型来表达。杠铃模型由三大部分构成：处于中心位置的杠铃、和杠铃平行的两个能力项及顶部的两个能力项，总共8个能力项。这8个能力项都是经过仔细挑选的，AI产品经理是否合格，就看他是否具备这8个能力项。\n\
    \n杠铃部分包含中间的杠铃杆（也叫横杆）和两端的杠铃片。杠铃杆对应着两个能力项——需求管理和AI产品规划。我们知道，无论真正的杠铃有多重，举重运动员都是抓住杠铃杆把整个杠铃举起来的。所以，需求管理和AI产品规划是合格AI产品经理8个能力项中的抓手能力。杠铃两端是AI技术—场景适配和实施管理。杠铃部分从左往右正好对应着日常工作流程——将合适的AI技术与合适的场景适配起来，进行需求管理和AI产品规划，然后推动技术部门实施管理。合格AI产品经理的能力杠铃模型如下图所示。\n\
