    ## 第4章 合格AI产品经理的核心工作和能力模型


    ### 4.1 AI产品


    #### 4.1.1 AI产品的实用定义


    有不少人问过我一个基本问题：“什么是AI产品？”最初，我给出的都是一些严谨、专业的定义，既有引用他人的又有自己原创的。但效果都不太好，听完之后大家还是一头雾水。


    于是，我对AI产品下了一个实用定义，“投放市场”后发现效果不错，大多数人觉得这个定义简单易懂。


    所谓AI产品，就是包含AI技术并且能发挥AI技术价值的产品。


    这个定义中有两个关键点。


    1. 包含AI技术


    如果一个产品中没有包含AI技术，那它显然就不是AI产品。


    2. 发挥AI技术的价值


    这一点更加重要。不能是为了概念、热点，就为产品生硬地附加上AI技术，而是要让AI技术发挥作用，为产品赋能，为用户提供价值。AI技术发挥的作用可以是核心的、关键的，也可以是外围的、辅助的。


    智能硬件领域曾有过类似的教训。曾经的智能硬件所谓的“智能”并不是指人工智能，而是指能上网。不管是什么硬件，只要能连上网它就算是智能硬件了。例如，电源插座加一个无线模块连上网，就是智能插座。大量的类似产品被投入市场，结果却发现大多数产品与实际场景、实际需求脱节，联网功能增加了产品成本却并没有发挥实际作用。很多买了这种产品的用户，对其的使用率并不高。很快，大多数所谓的“智能硬件”就被市场淘汰了。对于这样的结果，这些产品的产品经理要负有一定的责任。


    希望AI产品经理能够从中吸取教训，让适当的AI技术在产品中发挥实际作用，让使用AI产品的用户切实体会到AI技术的价值，从而持续使用。


    #### 4.1.2 AI产品的构成要素


