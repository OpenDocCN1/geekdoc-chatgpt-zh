    \  | ID：EPUB\\_20260428160408 \n\n## 第4章 合格AI产品经理的核心工作和能力模型\n\n### 4.1 AI产品\n\n\
    #### 4.1.1 AI产品的实用定义\n\n有不少人问过我一个基本问题：“什么是AI产品？”最初，我给出的都是一些严谨、专业的定义，既有引用他人的又有自己原创的。但效果都不太好，听完之后大家还是一头雾水。\n\
    \n于是，我对AI产品下了一个实用定义，“投放市场”后发现效果不错，大多数人觉得这个定义简单易懂。\n\n所谓AI产品，就是包含AI技术并且能发挥AI技术价值的产品。\n\
    \n这个定义中有两个关键点。\n\n1\\. 包含AI技术\n\n如果一个产品中没有包含AI技术，那它显然就不是AI产品。\n\n2\\. 发挥AI技术的价值\n\
    \n这一点更加重要。不能是为了概念、热点，就为产品生硬地附加上AI技术，而是要让AI技术发挥作用，为产品赋能，为用户提供价值。AI技术发挥的作用可以是核心的、关键的，也可以是外围的、辅助的。\n\
    \n智能硬件领域曾有过类似的教训。曾经的智能硬件所谓的“智能”并不是指人工智能，而是指能上网。不管是什么硬件，只要能连上网它就算是智能硬件了。例如，电源插座加一个无线模块连上网，就是智能插座。大量的类似产品被投入市场，结果却发现大多数产品与实际场景、实际需求脱节，联网功能增加了产品成本却并没有发挥实际作用。很多买了这种产品的用户，对其的使用率并不高。很快，大多数所谓的“智能硬件”就被市场淘汰了。对于这样的结果，这些产品的产品经理要负有一定的责任。\n\
    \n希望AI产品经理能够从中吸取教训，让适当的AI技术在产品中发挥实际作用，让使用AI产品的用户切实体会到AI技术的价值，从而持续使用。\n\n#### 4.1.2\
    \ AI产品的构成要素\n\n产品是有机整体，由多种要素有机组合而成，技术只是构成产品这个整体的诸多要素之一。产品经理要对产品进行整体规划，技术、设计部门要对产品进行整体实施，然后整体交付给用户使用，为用户提供价值。\n\
    \nAI产品的构成要素具体如下图所示。一个AI产品包含AI技术、传统信息技术、其他技术和众多非技术要素。所以，非技术出身的产品经理不用担心自己在AI时代的地位。利用好AI技[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)术，结合众多其他要素打造出一个好的AI产品，才是产品经理巨大的技术—场景价值空间。希望还在啃算法细节的产品经理，回到正确的道路上，朝着正确的方向努力。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_52)\n\nAI产品的诸多构成要素\n\n\
    为了便于读者更好地理解，下面用一个AI产品的实例——天猫精灵智能音箱来进行说明，天猫精灵智能音箱如下图所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_53)\n\
    \n天猫精灵智能音箱，车马拍摄\n\n天猫精灵智能音箱毫无疑问是一个AI产品，并且目前已经取得阶段性成功，它的出货量、保有量及日活跃用户数量都很高。\n\n\
    上图中，我拿的是天猫精灵中价格较低的方糖。其实，我手中的小盒子并不是完整的产品，它只是产品的一个用户端设备而已。如果断网了，即便我说多少次“天猫精灵，来一段B-box”，它也只会对我说“网络连接失败”，毫无智能可言。天猫精灵的用户端设备加上云端智能及配套资源才是完整的天猫精灵产品。\n\
    \n我们再来对照AI产品构成要素图，拆分一下天猫精灵这个AI产品的构成要素。\n\n1\\. AI技术\n\n很显然，天猫精灵能听懂你的话，能用语音做出反应，必然要用到语音识别、自然语言理解及语音合成等多种AI技术。\n\
    \n2\\. 传统信息技术\n\n在使用天猫精灵的过程中，涉及数据传输、数据存储等众多传统信息技术。天猫精灵要正常运作，离不开这些传统信息技术。\n\n3\\\
    . 其他技术\n\n天猫精灵的箱体有电源、麦克风、扬声器等电子器件，这就涉及电气、电声等技术。这些技术虽然“古老”，但同样也不可缺少。试想一下，你对天猫精灵说出一首歌的名字，天猫精灵立刻从云端调来歌曲播放，但播出的声音却浑浊难听，你的体验还会好吗？\n\
    \n4\\. 大量非技术要素\n\n箱体的工业设计、云端的海量内容资源等都是重要的非技术要素。这些非技术要素对产品成功与否的影响有可能比技术因素的影响更大。\n\
    \n以我本人为例，我先后体验了多款智能音箱，最后选择入手天猫精灵方糖的原因有两个——优秀的工业设计和亲民的定价，而这两个因素都与AI技术无关。天猫精灵箱体虽然材质普通，但依靠一流的工业设计依然吸引了很多用户，其工业设计甚[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)至获得了多项设计大奖。另外，天猫精灵的价格也是比较亲民的，也因此吸引了很多用户购买。\n\
    \n对于其他的AI产品，读者不妨也对照AI产品构成要素图来拆分一下。多做几次，你对AI产品的理解一定会提升一个层次。\n\n#### 4.1.3 实用定义、构成要素对产品经理的价值\n\
    \nAI产品的实用定义、构成要素对产品经理的价值有以下3点。\n\n（1）打破了AI产品的神秘感，扩展了AI产品的范围。\n\n多数传统产品经理对AI产品的理解非常窄——认为AI产品富有神秘感，只有AI技术公司才有AI产品。\n\
    \n通过以上分析，我们知道AI产品其实有很多类型。不仅AI技术公司有AI产品，互联网公司也有AI产品。AI技术已经融入互联网产品中了，传统互联网产品经理都应该看到这个趋势，尽早将合适的AI技术融入自己的产品中，让AI技术为产品增值，也为自己增值。\n\
    \n（2）指明了产品经理对待AI技术的正确方式。\n\n传统的互联网产品经理往往认为做AI产品会花费很多时间，认为只有花费很多时间才能系统掌握复杂的AI技术知识。\n\
    \nAI技术与传统产品经理的关系，类似于核弹与政治家、军事家的关系。核弹在诞生之初，就是一种新的、强大的能力。政治家、军事家并不需要花大量精力去了解核弹的制造及使用细节，只要知道它威力惊人、杀伤力极大，且使用后有长期核污染这些特点后，就能在政治、军事中合理利用。\n\
    \n明白了这个道理，想升级为AI产品经理的人就应该明白，做AI产品不必花特别多的精力去理解清楚那么多技术细节，其只需要把AI技术视为一种新的强大的能力，理解现有AI技术的原理、能力边界、限制条件就可以了，更重要的是尽快让AI技术在产品中发挥作用。\n\
    \n（3）找到产品经理的技术——场景价值空间，重建产品经理在AI时代的信心。\n\n很多产品经理一度认为，在AI时代，产品经理会沦为技术人员的附属品。\n\n\
    强大的AI技术并不意味着成功的AI产品。一个AI产品是AI技术、其他技术要素与众多非技术要素的有机组合。要想将这么多不同的要素组合起来，单靠技术人员是做不到的，因此产品经理是必不可少的。所以，即便在AI时代，非技术背景的产品经理也不会成为技术人员的附属品，他完全可以体现自己的核心价值。\n\
    \n#### 4.1.4 AI产品的类型与主体\n\n根据AI技术与产品的关系，可以将AI产品划分为3种类型，如下图所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_54)\n\
    \nAI产品的3种类型\n\n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)/div> \n\nAI产品的主体主要有以下两类：\n\
    \n（1）AI研发公司，这类公司可能会做AI技术的中间产品和基于AI技术的全新产品;\n\n（2）AI应用公司，这类公司可能会做AI赋能的产品和基于AI技术的全新产品。\n\
    \nAI研发公司有很强的AI技术研发实力，能“生产”AI技术，如科大讯飞、商汤、寒武纪、云知声等公司。\n\nAI应用公司，就是那些不能“生产”AI技术，但需要应用AI技术的公司。而各行各业、各种规模的公司大部分需要应用AI技术，只是各公司对AI技术需求的迫切程度有所区别，进度有快有慢而已。\n\
