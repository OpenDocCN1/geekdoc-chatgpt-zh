    ### 2.4 从卷积神经网络理解深度学习


    在机器学习中，神经网络与深度学习在当前具有很大的影响力，因此值得我们系统地进行理解。


    #### 2.4.1 神经网络与深度学习的概念关系


    我们需要厘清神经网络与深度学习概念之间的关系。神经网络与深度学习的概念关系如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_30)


