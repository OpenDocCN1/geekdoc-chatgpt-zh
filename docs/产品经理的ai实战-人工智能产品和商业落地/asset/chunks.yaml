    \n#### 11.1.3 高级AI产品经理篇的内容安排\n\n如果将高级AI产品经理的能力杠铃模型的10个能力项展开讲解，需要占用大量篇幅。考虑到本书的很大一部分读者是互联网产品经理，其能力杠铃模型与高级AI产品经理的能力杠铃模型的整体结构是相同的，部分能力项也相同，因此本篇选取特别重要的、AI特色鲜明的两个能力项进行重点讲解：AI技术—场景洞察和AI商业模式设计。\n\
