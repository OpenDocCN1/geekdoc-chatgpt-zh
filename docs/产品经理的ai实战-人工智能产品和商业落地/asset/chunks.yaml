    \n医院影像科使用AI影像辅助诊断产品的情形\n\n#### 13.3.3 设计医疗影像AI产品的商业模式\n\n通过上述简单介绍，我们能够看出，医疗影像AI产品普遍还不成熟，还有很大的改进空间。那么此时开始设计商业模式，是不是过早了呢？其实不然。\n\
    \n一方面，产品的进步是渐进的，我们不可能等着产品进步；另一方面，产品与商业模式是可以互相助力的，有些产品上的问题可以通过商业模式来解决，甚至必须通过商业模式来解决。所以，一方面要尽力完善产品，另一方面也要及早设计商业模式。\n\
    \n设计医疗影像AI产品的商业模式包含以下几个关键点。\n\n（1）和顶尖医院的顶尖医生长期、紧密合作，逐病种培育医疗影像AI产品。\n\n（2）将培育出来的有数据证明的医疗影像AI产品用于广大的基层医院，并向基层医院、二级医院收费。\n\
    \n（3）除了软件方式，还可以通过创新设备、整合AI技术的方式，为广大基层医院提供快速可用的能力。基层医院、二级医院的工作人员只需要负责基本的操作，医疗专业由系统负责。\n\
    \n（4）抓住医疗影像从胶片到数字化的机会，将医疗影像云和医疗影像AI技术整合，提供给广大的基层医院、二级医院。\n\n（5）引入金融机制。为基层医院提供一次性付款方式以外的租赁方式，降低门槛。\n\
