    ## 13.4 智能音箱的商业模式设计


    ### 13.4.1 智能音箱商业模式的现状


    智能音箱场景是一个一直被看好的场景，无论是在国内还是在国外都巨头云集。据 Canalys 的智能音箱市场数据显示，2019 年第一季度我国智能音箱销量达 1060
    万台，同比增长近 500%。我国智能音箱的销量占据全球智能音箱总销量的 51%。


    为什么我国的智能音箱销量呈爆发性增长？主要原因就是巨头的强推。我国智能音箱出货量较大的三个巨头：阿里巴巴、百度、小米，以保本甚至亏损的方式推广产品。除了三大巨头，云知声、出门问问等
    AI 技术公司也都有自己的智能音箱。但面对三大巨头的全面优势，其他公司要想在这个市场中获得成功，难度非常大。


    阿里巴巴凭借着其强大的电商渠道和低价策略，率先杀出重围，奠定了其领先地位。


    阿里巴巴第一款智能音箱天猫精灵 X1 于 2017 年 7 月 5 日发布，售价 499 元。这已经是当时智能音箱产品的最低价，但销量平平。在当年的“双 11”期间，天猫精灵将
    499 元的价格降到 99 元，只“双 11”当天就卖出一百万台，成为我国第一个销量过百万的智能音箱厂商。此前我国销量最大的智能音箱 3 年的总销量才 30
    万台左右。


    百度、小米采用了类似的策略，也快速打开了市场。2018 年 6 月，百度发布了一款补贴后售价仅为 89 元的小度智能音箱，发售 90 秒便售出了 1 万台。据互联网数据中心统计，2018
    年第三季，度小度系列智能音箱市场份额迅速从第二季度的 7%上升到了 24%。这样低价格的智能音箱，大多数人都愿意买一个来把玩一下，其中就有很多用户会长期使用。其他品牌的智能音箱要想争夺这群用户，除非其能提供更优质的产品，而这非常难，尤其是在价格如此低的情况下。


    2019 年 8 月，小度音箱 Play 青春版发售，新颖的设计加上较低的价格令我毫不犹豫地买了一台。小度音箱 Play 青春版的款式如下图所示。


    ![](img/epub_31486679_111)


    小度音箱 Play 青春版的款式，来自小度商城官网


    2015 年，京东的叮咚智能音箱就在布局，也曾占超过 60%的市场份额。但在阿里巴巴、百度、小米的进攻下，京东的智能音箱很快被挤到市场边沿。


    目前，智能音箱的商业模式大致分为两类。


    （1）用户支付一次性购买音箱的费用，以后免费使用。

    （2）以 Amazon Alexa 为代表，其开始授权其他家电厂家使用 Alexa 服务，通过智能音箱控制家电。在初始阶段，Amazon 可以为了培养客户，不向合作家电企业收费，但到了一定阶段完全可以收费。


    目前，智能音箱提供的服务还比较初级，也很难和人进行长时间的对话，而且这还是在对话者没有有意刁难的情况下。技术专家们一直在改进，产品人、商业人显然不能等技术成熟了才去做事。优秀的产品人、商业人就是要在当前的技术条件下开始进行探索。


    ### 13.4.2 智能音箱的创新商业模式设计——广告


    在此，我们要探讨的是可持续的商业模式。


