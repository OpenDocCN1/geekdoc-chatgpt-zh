    ## 12.2 对 AI 技术—场景价值的洞察


    合适的 AI 技术—场景组合只是解决了 AI 技术的可行性问题，接下来要判断 AI 技术—场景组合有什么价值？有多大价值？这就是 AI 技术—场景的价值洞察。


    与 AI 技术适配的场景有很多，但各自蕴含的商业价值是不同的。我们应该优先选择高价值的场景切入。所以，对 AI 技术—场景的价值洞察就显得非常重要。


    我们以 AI 在汽车驾驶中的应用为例。一直以来，L5 级别的全自动驾驶备受关注，一旦实现的确具有非常大的价值。但问题是，L5 级别全自动驾驶实现的难度非常大，人们普遍认为还需要
    15 年以上的时间才有可能实现。相比之下，AI 自动泊车在近期的商业价值更大。


    自动泊车场景的需求大，其 AI 技术难度比 L5 级别全自动驾驶的技术难度要低得多，相应的产品售价也不会太高，可能成为中高端汽车的标准配置，具有很大的市场价值。那些在
    AI 自动驾驶领域钻研的公司，可以尝试从 AI 自动泊车场景切入，也许能更快挖掘出其中的商业价值。


    商业价值不一定和技术难度成正比。有些场景的商业价值大，但涉及的技术并不复杂。高级 AI 产品经理应该多考虑这样的场景，或者先在这样的场景中立足，然后再去切入其他更难的场景。


    ### 12.2.1 AI 技术—场景价值洞察的例子


    1\. 电梯轿厢场景的例子


    我们先看一个传统技术的例子。电梯轿厢具有很大的商业价值。分众传媒发现了其商业价值，并进行了挖掘。采用的技术很简单——制作印刷品挂板，将挂板直接固定在电梯轿厢的
    3 个面（正对电梯门的一侧和左右两侧）上，可以更换里面的广告画面。


    电梯轿厢的另一个面——电梯门所在的那一面，其商业价值更大，因为多数人在电梯轿厢中会面朝门所在的一面。但人们在较长时间内没有找到对应的技术来开发这一面的商业价值。电梯门是侧向滑动的，挂板太厚，不可能挂在这一面，否则电梯门无法正常开关。后来，有人想到可以采用超薄的强力贴纸，直接将广告画面贴在电梯门上。因为非常薄、粘贴非常牢固，所以不会影响电梯门的正常开关。电梯门的价值被挖掘之后，又有人发现了电梯门旁边很窄的那块空间的商业价值。空间就在电梯门的两侧，通常其宽度只有
    30 厘米左右，而且一侧被按键面板占用。有人找到了适配这个场景的技术——定制的竖向液晶屏。这种液晶屏的宽度很窄，但比较高，宽高比在 1:5 左右。为了和大多数广告内容相适配，这个竖屏从上到下划分为多个广告区域，因此需要定制屏幕，这里涉及的技术显然比纯机械的广告挂板要复杂一些。一个电梯轿厢中
    3 种广告媒体形式并存的场景如下图所示。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)lt="" class="width80" data-ratio="0.748"
    data-w="1280px" data-w-new="958px" src="https://res.weread.qq.com/wrepub/epub_31486679_93"/>


    一个电梯轿厢中 3 种广告媒体形式并存，车马拍摄


    在一个电梯轿厢中，从左到右分别是相框式广告挂板、定制竖向液晶广告屏、电梯门贴纸广告，分别对应着 3 家不同的广告媒体公司。


    看起来电梯轿厢的 4 个面的商业价值都已经被挖掘殆尽了。如果只使用上述技术，的确是这样。但如果主动寻找，可能还能找到相应的技术，形成新的技术—场景组合，进一步挖掘电梯轿厢的商业价值，如投影广告。投影广告包含两个部分，第一部分是贴在电梯门靠内一侧的投影布，这个投影布的材质类似会议室用的投影幕布，它本身没有内容，只是用来显示投影画面的；第二部分是吊挂在电梯顶部的微型投影机，当电梯门关闭时，微型投影机将广告画面（静态画面或视频）投影到幕布上，当电梯门打开时，投影暂停，避免使进入电梯轿厢的人感到晃眼。


    2\. 视频节目植入广告的例子


