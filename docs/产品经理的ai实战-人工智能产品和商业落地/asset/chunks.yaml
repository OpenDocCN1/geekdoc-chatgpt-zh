    高级AI产品经理的能力杠铃模型


    #### 11.1.2 高级AI产品经理的能力杠铃模型的10个关键能力项


    高级AI产品经理的能力杠铃模型的三大部分合计有10个关键能力项，我们在这里简单介绍一下。


    1. 商业理解

    高级AI产品经理是商业理解能力较强的人之一。高级AI产品经理要站在商业前沿思考AI技术前沿，找到AI技术的商业场景、商业模式，让AI技术发挥出较大的商业价值。

    产品是商业的核心要素之一，是商业大厦的基石。脱离商业谈产品是没有意义的。AI产品面临更加不确定的商业环境，这就要求高级AI产品经理必须懂商业，能从商业的层面看待产品，这样才有可能做出更有商业价值的产品。


    2. AI技术—场景洞察

    对于AI技术—场景，合格AI产品经理只要做到适配即可，但高级AI产品经理需要提升到洞察的层次。关于技术—场景洞察会在第12章进行详细讲解，这里不再赘述。


    3. 需求管理

    需求管理是产品管理中必须要做而且必须做好的工作，高级AI产品经理同样要做而且要做得更好。


    4. AI产品规划

    AI产品规划是AI产品经理的工作落点，也是重要的输出物。高级AI产品经理不一定亲自画原型、写文档，但一定要亲自进行产品规划，掌控产品的方向。


    5. 商业模式设计

    高级AI产品经理不仅要能进行产品规划，还要能进行（至少是深度参与）商业模式设计。好的商业模式能让产品乃至公司的业务以更好的方式运行，从而产生更高的价值。


    6. 运营互动

    高级AI产品经理不应该局限在产品规划中，而是要往下游延伸与运营形成良好互动，因为产品只有运营才能发挥作用。而运营可以直接接触用户和应用场景，与其形成良好互动能够加深高级AI产品经理对应用场景的理解。


    7. 跨域产品借鉴

    跨域产品借鉴是指跨越AI产品的局限，借鉴互联网产品、传统产品等更广泛领域的产品。如果不能跨域，借鉴可能导致AI产品的思路越来越窄、越来越同质化。高级AI产品经理要能突破自己的领域壁垒，善于学习和借鉴。


    8. 数据布局

    数据对AI产品的意义重大，AI产品既源于数据又用于数据。对待数据，高级互联网产品经理是从数据分析升级到数据驱动的，而高级AI产品经理则要再次升级为数据布局。


    9. 思维

    这是一项影响深远的能力，也是很容易被忽视的能力。思维的境界决定了能力的边界。要成为高级AI产品经理，必须系统增强思维能力。


    10. 影响

    影响和思维类似，重要而又容易被忽视。影响的能力和高级职位之间关系紧密，两者互为因果——产品经理在公司具备了足够的影响力，他会自然上升到高级产品职位；如果获得了高级产品职位，他必须在公司产生相应的影响力，否则就难以保住其高级产品职位。


    高级AI产品经理的能力杠铃模型中没有工具、产品团队管理等内容，不是说高级AI产品经理就不用工具、不管团队了，而是说这些属于配套能力。能力杠铃模型没有将这些层次较低的能力项纳入，否则会导致模型过于复杂，从而不能突出重点。


