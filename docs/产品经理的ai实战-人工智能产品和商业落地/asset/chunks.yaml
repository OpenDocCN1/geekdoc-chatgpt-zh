    ## 2.2 基于机器学习的当代人工“智能”


    1956 年，达特茅斯会议宣告了人工智能的诞生。AI 技术在长期的发展中，已经有了实质性的变化，尽管它的名字依然叫人工智能。


    ### 2.2.1 人工智能 3 个阶段的比较


    人工智能可以划分为 3 个阶段：过去、当前、未来。这不仅代表时间先后，还代表了含义的本质区别。


    1. 过去的“人工智能？”


    这个阶段的人工智能基于人类事先制定的规则，以模式识别、专家系统为代表，其在大多数应用领域的实际表现都明显弱于人类，所以在智能一词后面加了问号。过去的人工智能只是计算机科学的一个小分支，而且是长期处于边缘地位的小分支。


