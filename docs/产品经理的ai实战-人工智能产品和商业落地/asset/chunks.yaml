    ## 4.3 合格AI产品经理的能力体系——AI能力杠铃模型


    AI产品经理职位刚刚出现不久，用人公司及AI产品经理自身普遍都没有清晰地认识到AI产品经理的能力体系。一个人如果想成为合格的AI产品经理，就需要先了解合格AI产品经理的能力体系。只有了解了能力体系，才会有正确的努力目标。


    ### 4.3.1 合格AI产品经理的能力杠铃模型


    当前的AI产品经理还是一个缺乏标准、缺乏体系指导的专业岗位。我根据近几年在AI领域的观察、研究及咨询实战的经验，提炼出了合格AI产品经理的能力杠铃模型。希望这个模型可以给对AI产品感兴趣的人提供明确的指导，让大家高效成长，这对个人及整个AI商业都是非常有利的。


    AI产品经理也分为多个层次，本书讲到了两个层次：合格AI产品经理及高级AI产品经理。大多数对AI产品经理职位感兴趣的人，通过正确的方法学习一段时间后，都可以从事AI产品工作，进入AI产品之门。再加上实际工作的磨炼，一般经过2~3年就可以成为合格的AI产品经理。如果有任职互联网产品经理的经验，这个时间还可以再缩短一些。


    在合格AI产品经理中，只有少数最终可以成为高级AI产品经理。高级AI产品经理是公司的宝贵财富，对AI商业、AI应用会起到关键作用。本篇我们主要讲合格AI产品经理的能力杠铃模型，第三篇再讲高级AI产品经理的能力杠铃模型。


    合格AI产品经理的能力体系，可以用一个形象直观的杠铃模型来表达。杠铃模型由三大部分构成：处于中心位置的杠铃、和杠铃平行的两个能力项及顶部的两个能力项，总共8个能力项。这8个能力项都是经过仔细挑选的，AI产品经理是否合格，就看他是否具备这8个能力项。


    杠铃部分包含中间的杠铃杆（也叫横杆）和两端的杠铃片。杠铃杆对应着两个能力项——需求管理和AI产品规划。我们知道，无论真正的杠铃有多重，举重运动员都是抓住杠铃杆把整个杠铃举起来的。所以，需求管理和AI产品规划是合格AI产品经理8个能力项中的抓手能力。杠铃两端是AI技术—场景适配和实施管理。杠铃部分从左往右正好对应着日常工作流程——将合适的AI技术与合适的场景适配起来，进行需求管理和AI产品规划，然后推动技术部门实施管理。合格AI产品经理的能力杠铃模型如下图所示。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ve="true" alt="" class="width60" data-ratio="0.798"
    data-w="1280px" data-w-new="1021px" src="https://res.weread.qq.com/wrepub/epub_31486679_58"/>


    合格AI产品经理的能力杠铃模型


    AI杠铃模型中没有提到“产品原型绘制”“产品文档撰写”等内容。虽然实际的产品工作中少不了这些事，但杠铃模型提炼的是重要能力，而不是追求把所有能力都罗列出来。没有提到的能力项分为两种情况。


    （1）其包含在重要能力项中。以“产品原型绘制”为例，它就包含在“AI产品规划”中。产品规划通常需要用原型来表达，因此需要绘制原型。这些属于辅助能力项，其本身难度并不大，容易掌握。


    （2）其属于较次要的辅助能力项、衍生能力项，不需要单独列出。以“产品文档撰写”为例，如果写不好产品文档，主要原因并不是文笔不好、不了解文档的格式，而是对需求、规划等本身没有理解清楚。需求管理、产品规划两项能力弱，就会在“产品文档撰写”上表现出来。不列出这些辅助能力项、衍生能力项，一方面是为了使模型简洁，便于大家掌握，另一方面是为了让大家关注根本、抓住关键。


    ### 4.3.2 AI能力杠铃模型的优势


    AI能力杠铃模型是经过了长时间的打磨，经过多次迭代才成型的。与其他能力体系相比，AI能力杠铃模型具有多方面的优势。


    1. 形象直观，便于理解


    如果把能力杠铃模型也看作一个产品，能力杠铃模型这个产品的界面友好、便于使用。能力杠铃模型中间细长、两端重，与真实的杠铃一样。它表达了两个意思：上手从中间开始，之后的升级主要依靠两端的提升。杠铃的重量直接决定你的薪酬。


    2. 能力杠铃模型与工作流程高度对应


    能力杠铃模型中间的杠铃部分从左到右，与产品工作流程大体吻合。将能力杠铃模型和工作流程对应起来，便于学习。


    3. 兼容性强、适用性强


    能力杠铃模型能兼容、适应各种类型的AI产品，适用于各种类型的公司。


    4. 简洁扼要


    没有人会认为自己的能力过多，所以针对某个职业的能力模型可以列出无数种能力要求。对于能力体系，我总结了一个基本规律：唬人的能力体系，往往能力项众多，让人失去信心；实用的能力体系，往往精简高效，让人充满信心。


    5. 能更好地服务于AI产品经理的终身能力增长


    AI能力杠铃模型的使命就是更好地服务于AI产品经理的能力增长，而且是终身能力的增长。合格AI产品经理的能力杠铃模型和高级AI产品经理的能力杠铃模型是紧密衔接、顺畅过渡的。


    希望读者先将AI能力杠铃模型用起来，在用的过程中加深对AI能力杠铃模型的理解。


    ### 4.3.3 合格AI产品经理篇的内容安排


    如果将合格AI产品经理的能力杠铃模型的8个能力项一一展开讲解，需要占用大量篇幅。考虑到本书的大部分读者是互联网产品经理，AI能力杠铃模型和互联网能力杠铃模型的整体结构是相同的，部分能力项也是相同的，因此本篇选取比较重要的、AI特色鲜明的两个能力项重点讲解：AI技术—场景适配；AI产品规划。


    对于AI能力杠铃模型中的其他能力项，如果读者有兴趣系统学习和提升，可以参考我关于互联网产品经理的两本书，按层次分为《首席产品官1——从新手到行家》《首席产品官2——从白领到金领》，书中对能力杠铃模型的每一个能力项都进行了详细讲解，不仅结合了丰富的实战案例，还给出了具体的应用指导。


