    ## 13.3 医疗影像 AI 的商业模式设计


    医疗领域是价值—障碍矩阵中的白银区域，也就是说这个领域的价值大，但障碍也大。正是诸多有形、无形的障碍导致 AI 在这个被寄予厚望的应用领域中，进展并不顺利。这个领域在呼唤好产品，也在呼唤商业模式的创新。要想为这个领域设计商业模式需要先了解一下这个领域的状况。


    ### 13.3.1 医疗行业概要和 AI 应用现状


    当前的疾病诊断过程可以分为 5 个步骤：


    （1）临床医生收集症状、病史；

    （2）临床医生对患者进行体征检查；

    （3）针对可能的疾病谱进行相应辅助检查（影像、生化、微生物、免疫等）；

    （4）对检查结果进行分析判断，进行排除，取得最大可能的临床诊断（拟诊讨论）；

    （5）取得病理组织样本，进行病理检查，确诊。


    AI 技术是不能改变这个步骤的，它能做的就是融入这 5 个步骤，尽量发挥作用，体现自己的价值。


    当前，在医院运营的全流程——诊前、就诊、检测诊断、治疗和康复、医院管理等方面，AI 技术公司都有介入。其中，医疗影像辅助诊断领域的 AI 技术公司数量最多，因此该领域的竞争非常激烈。


    目前，医疗影像 AI 技术公司大体可以划分为 4 类。


    第一类是 AI 技术公司，目前主要是采取和医院进行合作研究的方式，如依图科技、图玛深维、汇医慧影、深睿医疗、推想科技等。


    第二类是医疗影像硬件厂商，通过和外界团队合作的方式全方位切入。例如，万东医疗旗下的万里云通过与美联健康、阿里健康等巨头合作，以 SaaS 服务的模式向患者、医院、医生提供全方位影像服务，包括影像云端存储、诊断、分享、质控、培训和大数据服务等。


    第三类是互联网大公司。2017 年，阿里巴巴、腾讯等互联网大公司相继发布医疗人工智能相关的产品或是通过投资参与其中。他们在影响力、流量、技术、资金等方面有着较大的综合优势。例如，2017
    年 11 月，中华人民共和国科学技术部宣布将依托腾讯公司建设医疗影像和国家新一代人工智能开放创新平台。


    第四类是影像设备公司。美国通用电气公司、荷兰飞利浦公司、德国西门子公司三巨头占据了我国中高端医疗影像设备大部分的市场份额。他们携品牌、技术、客户优势进入 AI
    医疗影像领域。


    为了讲解得更清楚，我们将眼光从整个医疗行业聚焦到医疗影像辅助诊断场景，看看这个场景中存在的问题和对应的商业模式设计。


    ### 13.3.2 医疗影像 AI 应用的现状


    由于竞争者众多，医院处于明显的强势地位。有些知名医院的影像科中有十几家公司的 AI 系统，并且无一例外都是免费使用的。从使用效果看，这些挤进了医院影像科的
    AI 系统存在不少问题。


    1\. 敏感度高、特异度低，作用有限


    要理解问题，我们有必要先来了解一下医疗诊断中的两个指标：敏感度和特异度。


    简单地说，敏感度高则少漏诊，特异度高则少误报。


    据使用过肺部影像 AI 系统的医生反映，当前的 AI 系统敏感度高但特异度低。敏感度高，就是它能发现很多结节，包括容易被医生漏掉的小结节，这是有价值的；特异度低，就是它并不能判断出发现的结节是良性的还是恶性的。而判断良性还是恶性恰恰是影像科医生的重要工作。所以，刚开始使用
    AI 系统时，医生往往吓一跳。因为 AI 系统检测出很多结节，但仔细观察，会发现很大一部分是良性的小结节。


    如果了解 AI 技术的特点和边界，我们就知道这种情况并不奇怪。敏感度高是机器的优势，机器可以不知疲倦、无一遗漏地扫描每一个像素，发现每一个结节。在这方面，机器比人有优势，因为人会有遗漏，疲劳时会有更多遗漏。但在判断结节性质方面，机器就远远不如人有优势。影像科医生能判断出结节的性质依靠的是长期工作的积累，有些具体的道理连他自己也难以表述清楚。前面我们已经讲过，当前的人工“智能”其实没有智能。要想让影像
    AI 系统判断结节性质的能力达到影像科医生的平均水平，就必须对它进行大样本的监督学习。影像科医生要给机器标注出哪个结节是良性的，哪个结节是恶性的。而且少量的标注还达不到目的，需要大量、高质量的标注。另外，实际环境要更加复杂。因为医疗影像来自具体的影像设备，同一种类的设备来自不同的厂家，其型号也有所不同，这就导致同一个病人通过不同设备获取的影像有较大差异。训练时就需要考虑到这些问题。如果我们用主要来自
    GE 的新设备进行训练，系统就可能出现过拟合——对 GE 的新设备获取的影像识别得很准，但对 PHILIPS 的设备获取的影像识别就出现了很大偏差。大多数
    AI 系统在训练上做得不够，在特异度方面表现不佳也就不足为奇了。


    目前，众多进入医院影像科的 AI 系统，实际上只是一个初级读片者，甚至只是初级读片者的助手。其只是在初读环节发挥了辅助作用，未来几年之内都不可能取代影像医生。


    2. 同质化严重


    一方面，适应病种同质化严重。多数医疗影像 AI 技术公司针对的病种单一，且都聚焦于肺结节的医疗影像智能分析。一是由于我国是肺癌大国，肺部影像数据量充足；二是由于全球针对肺结节识别的研究较为成熟。


    另一方面，产品功能的同质化严重。尽管各家公司的 AI 系统针对同一个病种的具体指标略有不同，但实际使用效果差别很小。这也导致各家公司的 AI 系统很容易被同行取代，在这种情况下向医院收费几乎是不可能的。


