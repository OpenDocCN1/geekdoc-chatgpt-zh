    中国平安近年在AI领域的进展摘要，来自平安科技官网


    这些AI应用能力不仅服务于中国平安的成员企业，还通过平安科技公司（平安集团旗下的全资子公司）向外部金融机构甚至非金融机构输出，发展出新的业务。中国平安从互联网技术开始，探索的一整套充分利用技术扩展业务的组织能力再次在AI应用上体现了出来。中国平安已经进化为一家技术成分很重的公司，公司Logo中的文字也从“保险　银行　投资”升级为“金融　科技”。这不仅值得金融机构学习，还值得所有的传统企业学习。

