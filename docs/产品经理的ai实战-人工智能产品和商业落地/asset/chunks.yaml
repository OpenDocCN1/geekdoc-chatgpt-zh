    ### 12.1 对AI技术—场景适配度的洞察


    #### 12.1.1 从AI与人的关系角度洞察适配度


    AI就是人造的智能，我们不妨来分析一下AI与人的关系，这有助于提高高级AI产品经理对AI技术—场景适配度的洞察能力。人与AI的能力关系及AI产品的生存空间如下图所示。


