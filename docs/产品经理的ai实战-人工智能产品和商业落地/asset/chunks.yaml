    ## 7.3 AI技术公司的最终用户产品


    近几年，出现一种趋势，越来越多的AI技术公司开始面向最终用户推出产品，既有面向企业的最终用户产品，又有面向消费者个人的最终用户产品。


    ### 7.3.1 中间产品的风险


    最终用户产品出现的原因有很多，但主要原因来自中间产品。中间产品对AI技术公司很重要，大多数AI技术公司都是靠中间产品起步的。但中间产品普遍存在一个非常大的风险——被替代的风险。正是为了避免这个风险，越来越多的AI技术公司推出了最终用户产品。


    在我国有一个影响很大的AI落地应用——支付宝。支付宝广泛使用了人脸识别技术，不仅在手机App中使用，还在实体店铺中布设刷脸支付设备，如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_74)


    支持支付宝刷脸支付的自助点餐设备，车马拍摄


    支付宝的人脸识别技术从起步就和AI技术公司旷视科技（Face++）合作。旷视科技为支付宝提供人脸检测、人脸识别、人脸比对的核心算法，后来发展成为支付宝的人脸识别技术方案提供商。


    另外，旷视科技还获得蚂蚁金服这样的大客户，这对旷视科技的发展非常有利，但中间产品存在容易被替代的问题。随着人脸识别技术的使用逐渐增加，尤其是iPhone X的FaceID大力推动了人脸识别技术的应用，支付宝及其所属公司蚂蚁金服，无论是基于成本还是基于战略考虑，都需要拥有自己的人脸识别技术。2017年11月，蚂蚁金服孵化的首家安全技术公司蚂蚁佐罗成立。很快，支付宝及蚂蚁金服平台下的人脸识别技术改用了蚂蚁佐罗的产品，而旷视科技的产品也因此被替代。


    我们再看一个语音技术领域的例子。Nuance公司曾是全球语音技术领域的领先者，它是苹果、Google、亚马逊、三星等公司的语音技术供应商，其在巅峰时刻占据了全球语音市场约70%的份额。但是，它同样很难解决中间产品容易被替代的问题。随着语音技术从原来的边缘技术逐渐演变成核心技术，那些巨头客户也纷纷开始研发自己的语音技术。在这些巨头面前，语音技术的壁垒并没有想象的那么高。Nuance公司接连失去几个大客户，很快就走向衰落了。之后，该公司由语音技术供应商被迫向行业解决方案商转型，其股价和市值也大幅下跃。


    ### 7.3.2 最终用户产品的价值


    既然中间产品存在容易被替代的风险，直接面对最终用户推出产品就成了顺理成章的对策。例如，同样是语音技术巨头的科大讯飞，近几年已经在直接面对最终用户的产品上发力，并于在2016年年底成立消费者业务部门，面向最终用户推出了讯飞翻译机等产品。


    旷视科技也针对B端用户推出了物流机器人等最终用户产品。以旷视MegMaster T800机器人为例，这是一个软硬一体的产品。其结合了AI技术和机器人技术，通过贴在地面上的二维码来导航，可实现搬运、分拣、托举、存储等功能，适用于物流、制造等场景。MegMaster
    T800机器人如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_75)


    MegMaster T800（最大承载力800kg）机器人，来自旷视科技官网


    AI技术公司纷纷推出最终用户产品，主要看中了它以下两个优点。


    （1）最终用户产品更加综合，避免了中间产品单一的技术指标和价格比拼。


    最终用户产品多数是软硬一体的产品，是由专门的硬件和AI技术集成的一个整体。其不仅包含AI技术，还包含工业设计、定价、形象包装等众多因素。AI技术公司的操作空间比较大，抓住最终用户产品的一两个点做出特色就能在市场上立足。相比之下，AI中间产品的要素非常单纯，主要依靠关键技术的指标和价格比拼，这就使AI技术公司面对的竞争非常直接。


    （2）最终用户产品可以直接与最终用户建立紧密联系，具有更持久的价值。


    AI技术公司可以依靠一款最终用户产品先和最终用户建立直接联系，然后不断推出新的最终用户产品，持续挖掘用户价值。小米及其关联公司已经证明了这个模式是可行的，很多AI技术公司也希望复制这种模式，所以纷纷推出了自己的最终用户产品。


    但是，与中间产品相比，最终用户产品也存在很多问题。AI技术公司只有解决好这些问题，才能真正发挥最终用户产品的优势。


    ### 7.3.3 最终用户产品案例


    2B最终用户产品和2C最终用户产品之间又有比较明显的区别。下面我们就先来研究两个2B最终用户产品案例。


    1\. 2B最终用户产品案例1——为目标场景深度定制


    语音转化成文字的功能已经很普及了，很多输入法就能实现而且是免费的。虽然通用场景可能没有产品机会了，但如果我们聚焦到细分场景，就有可能找到产品机会。因为细分场景有自己的独特需求，通用产品通常无法满足这种需求，这正为专用产品提供了机会。


    典型的例子就是云知声公司针对医疗场景的语音录入产品。该公司提供的数据表明，云知声的语音录入产品的识别准确率超过97%。为什么云知声的产品可以做到如此高的识别准确率？因为该产品深刻理解了医疗场景的特点，并针对这些特点采用了针对性的解决方案，所以取得了良好的产品效果。其主要针对以下两个重点采取了解决方案。


    （1）针对大量的医疗术语。


    医疗场景中含有大量的医疗术语，而且不同科室还有各自的术语。云知声采用的是分科室进行语言模型训练的方法，这样就提高了各科室专有名词的识别效果。尤其是医疗特殊符号、特殊单位，识别效果较为突出。


    （2）针对非常嘈杂的环境。


    医院普遍非常嘈杂。云知声采用了“专用硬件+配套软件”的方式来解决问题。硬件是医疗语音录入专业麦克风，如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_76)


    医疗语音录入专业麦克风


    这是飞利浦公司为医疗语音录入系统制造的专业麦克风，在欧美市场的占有率很高。这种专业麦克风具有定向音频增强功能，适合应对嘈杂环境。再加上语音增强、信道及说话人规整技术，可以有效抑制噪音的干扰，显著提高嘈杂环境下语音识别的准确率。


    正因为云知声公司对医疗场景特点的透彻理解，才使得产品能够很好地满足用户需求，进而使这个需要付费的产品得到了协和医院等知名医院和机构的认可。


    AI产品经理如果要规划最终用户产品，应该向这个产品学习，充分理解目标场景的特殊性，然后规划出具有针对性的产品。


    2\. 2B最终用户产品案例2——小场景切入


    有些AI技术公司没有推出中间产品，而是起步就推出最终用户产品，蓝河科技公司就是如此。这是一家美国的AI技术公司，它是农业AI领域的标杆，致力于为农场主这个B端用户打造AI产品。


    蓝河科技公司的最终用户产品特别值得学习的地方是小场景切入。该公司虽然有很强的AI技术实力，选择的也是农业这个大场景，但它没有推出“农场AI整体解决方案”这样的大产品，而是从小场景切入，推出了一个个针对小场景的产品，并取得了显著的成效。


    该公司于2011年成立，当年就推出了第一款产品Lettuce Bot（生菜机器人）。Lettuce Bot能够利用AI技术准确高效地判断每株生菜的状态，并精确地进行田间整理。该公司的数据显示，一台Lettuce
    Bot一天可以整理40亩（1亩≈666.67平方米）生菜地。


    从产品名称就可以看出，它只针对生菜这一种农作物。但正因为针对的农作物只有一种，AI模型容易训练，产品也能很快地打造完成。因此，该公司的第一款产品就取得了成功。


    该公司后续又推出了多种产品，每种产品都只针对一个小场景。公司的产品战略是，每种产品针对一个小场景，依靠众多的产品来实现更广的用户覆盖，而不是单纯依靠一个覆盖众多场景的产品。


    该公司的另一个典型产品是See & Spray，其也是针对小场景的产品。该产品是一个整体设备，由拖拉机拖挂在田间行走。其工作原理如下图所示。


