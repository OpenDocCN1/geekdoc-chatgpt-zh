    _31486679\\_58\"/> \n\n合格AI产品经理的能力杠铃模型\n\nAI杠铃模型中没有提到“产品原型绘制”“产品文档撰写”等内容。虽然实际的产品工作中少不了这些事，但杠铃模型提炼的是重要能力，而不是追求把所有能力都罗列出来。没有提到的能力项分为两种情况。\n\
    \n（1）其包含在重要能力项中。以“产品原型绘制”为例，它就包含在“AI产品规划”中。产品规划通常需要用原型来表达，因此需要绘制原型。这些属于辅助能力项，其本身难度并不大，容易掌握。\n\
