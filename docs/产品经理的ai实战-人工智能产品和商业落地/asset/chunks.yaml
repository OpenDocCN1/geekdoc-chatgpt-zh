    # AI 技术与 AI 商业篇


    为了行文简洁，本书后文将更多地用“AI”来表示“人工智能”。本篇讲解产品经理需要了解的技术与商业知识，是后面两篇内容的基础。


    第 1 章，跳出 AI 的圈子，站在技术商业的高度，探讨技术商业化、落地应用的基本规律，从技术商业历史中汲取营养。经过历史多次检验的基本规律，将会在 AI
    时代继续发挥指导作用。


