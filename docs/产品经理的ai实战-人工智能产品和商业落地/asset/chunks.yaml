    \  | ID：EPUB\\_20260428160408 \n\n## 第5章 AI技术—场景适配\n\n### 5.1 AI技术—场景适配的基本方法\n\
    \n#### 5.1.1 AI技术—场景的适配前提\n\nAI技术与场景是两个要素，要将两者适配起来的前提就是要对AI技术与场景两个要素都有较深的理解。这正是进行AI技术—场景适配的难点。以我接触的AI产品经理的情况而论，大多数AI产品经理其实对AI技术与场景的理解都不够深入，所以只能是上级指方向，自己去执行，其本身的作用并不大，其价值也不能得到体现。因此，产品经理只有对AI技术与场景都进行深入理解之后，才能将AI技术—场景进行适配，让公司起步就走对方向。\n\
    \n关于AI技术，我们在基础篇第2章进行了讲解，并且从产品经理的角度对AI技术的实质和特点进行了分析，其主要目的就是为本章的内容奠定基础。\n\n相比对AI技术的理解，对场景的理解更加困难。因为现实中的场景非常多，每个场景都包含了丰富的内容，而且很多场景处于快速变化中。没有人能理解所有的场景，并且在他所理解的场景中，也只有少数能达到深刻理解的程度。\n\
    \nAI技术有明确的学习目标和学习路径，一个智力正常的人只要足够努力，就可以实现快速入门。但场景却是另外一番景象，其学习目标、学习路径都不明确，因而场景的学习是非常困难的。\n\
    \n为了较快提升对场景的理解，我有一些建议可以供读者参考。\n\n（1）从身边的商业场景开始观察。\n\n（2）阅读关于商业场景的优秀图书，借助他人的智慧提升自己的场景理解能力。\n\
    \n（3）求精不求多，持续关注和深入研究一两个场景，比泛泛地了解众多场景更有价值。\n\n举个理解零售场景的例子。每位读者都会购物，都是零售行业的顾客。作为普通顾客，我们在零售场景中只关注自己喜欢的商品，注重自己的购买体验。而作为产品经理，如果想要理解零售场景，就要跳出普通顾客的视角。例如，我们进入盒马鲜生、超级物种等新零售店铺，可以留意观察一个店铺有多大面积？以哪类商品为主打？有多少店员？观察一下其他顾客的行为，他们是单人购[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)物还是家庭购物？正在进行什么促销活动？有什么独特的地方？只要用心，就可以看出很多东西。\n\
    \n再如，我们在地铁里看到自动售货机，不妨思考一下里面为什么会摆放这些商品？如果自己来运营，会如何选品？除了自己体验整个过程，不妨停留片刻观察一下其他顾客购物的全过程。\n\
    \n如此养成习惯，我们慢慢就能从顾客视角切换到行家视角，对新零售场景的理解也就加深了一个层次。想要快速提升对其他场景的理解，其道理和基本做法也是一样的。\n\
    \n#### 5.1.2 AI技术—场景的适配矩阵\n\n关于AI技术和场景的适配问题，我们可以借助一个工具——AI技术—场景的适配矩阵来理解，具体如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_62)\n\nAI技术—场景适配矩阵\n\n\
    我们按作业对象是人还是物、内容是否标准将场景划分为4个象限，这4个象限中的AI技术有不同的适用程度。\n\n对人比较典型的场景是客服、客户接待、销售等工作。对物就是对人以外的事物，如单据整理录入、仓库管理等。当然，这种划分是为了便于理解，实际上有很多场景是融合的。以医疗场景为例，医生面对的病人是活生生的人，但在现在的医疗实践中医生实际更多处理的是物——化验结果、医疗影像等，可以说医疗场景是明显偏物的场景。\n\
    \n标准和非标也比较容易理解。大多数客服工作就是一种标准化程度很高的场景。在销售工作中，小额简单产品的电话销售是标准的，相比之下大额复杂产品的面对面销售就是非标准的。同样是酒店接待工作，大多数经济型酒店、中档酒店的接待是标准的、事务性的——尽快给客户办好手续，让客户尽快离开接待台。这样的标准工作，很适合用AI来代替人工。这样既可以降低酒店的人力成本，又会提升办理手续的效率，从而让客户更满意。但在高档酒店，接待工作的非标准性很强，其是体现高档酒店独特价值的工作。一流的接待人员会根据客人的情况说出个性化的欢迎语，让客人如沐春风。这样的接待就不适合用AI来代替人工，只能使AI起到一定的辅助作用。如果一家AI技术公司开发酒店行业的AI自助前台，显然经济型酒店、中档酒店才是合适的场景，而高档酒店则是不合适的场景。\n\
    \n以自动驾驶为例，在园区、场地内的自动驾驶是最早落地的，因为这些地方的驾驶场景是标准化的，很容易通过AI实现自动驾驶。而开放道路的自动驾驶一直是个难题，就是因为这些道路环境是非标准的，在这些非标准的道路环境中，实现AI自动驾驶的难度非常大。\n\
    \n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p class=\"content\">以AI在军事上的应用为例。战争决策依赖的因素非常多，包括民心、军力、国际环境及其他国家的态度等，这里的因素非常多而且大多数因素无法量化，这就是典型的非标准场景，必须依靠人来完成。一旦做出了战争决定，就涉及非常庞大的后勤调度工作。这些工作因素虽然也非常复杂，但因为很标准几乎能实现数字化，很适合AI技术发挥作用。相比传统只靠后勤部的人工方式，AI可以更快、更好地完成后勤调度工作。\n\
    \n产品经理应该放弃全面开花的思路，选择在适合AI技术的场景落地。\n\n#### 5.1.3 AI技术—场景适配的适度原则\n\n技术不是越先进越好，只要适合场景即可。这是产品思维和纯技术思维不同的地方。\n\
    \n以93%的识别准确率为例，这样的识别率肯定不可以用于零售、安防场景，更不能用于金融场景。但在部分场景中，这个识别率却足够了。北京公交集团已经正式使用AI技术来识别公交车的上下车人数，准确率约为93%。借助AI技术，北京公交集团可以获得每辆车在每一站的上下车人数，以数据为基础合理调配运力。如果发现在某个时段中，300路公交车的某一站上车的人明显多于以往，北京公交集团就会立刻增加300路的发车量。在识别上下车人数的场景中，93%的识别准确率已经足够了。甚至从长远看，识别准确率也不需要有太大提升。一方面，在这个场景中，93%和98%的识别准确率实际的应用效果差别并不大；另一方面，上下车时人群往往比较拥挤，所以要将AI系统的识别准确率提升到98%是非常困难的。\n\
