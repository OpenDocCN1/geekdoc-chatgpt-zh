- raw: "传统的一次性付完全部费用的方式对某些产品依旧有效。例如，AI自动泊车系统，其是需要提前安装的系统，包含硬件及AI能力。由整机厂向AI技术公司付费。尽管后续的AI能力还会持续升级，但很难说服强势的整机厂接受持续付费的模式，因为整机厂无法向购车用户持续收费。因此，在这个领域可能还是要使用传统的一次性付完全部费用的模式。\n\
    \n但AI确实有更多商业模式的可能。其中，按使用量付费是比较容易被客户接受的方式，便于开拓新客户。在这种商业模式下，如果产品确实好，客户会逐渐增加使用量，从而为AI技术公司带来更多的收入。这比刚开始就收取大笔费用更有利于开拓市场。\n\
    \nAI是一项能力，但很多情况下AI公司不一定为这项能力单独收费，AI能力可以融入更大的系统中。这就是AI收费的隐形化，这很可能会成为一种趋势。\n\n例如，一些有持续大数据来源的大机构客户——金融机构、公用事业单位、政府等，始终认为这些大数据是有用的，但真正起到作用的大数据非常少。这就导致[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)大量的数据被存储起来，占用了大量的IT资源，消耗了大量的成本，却没有发挥作用，并且数据质量问题、数据孤岛问题很严重。这些大数据机构要么任由大数据流失，要么任由大数据堆积。随着时间的推移，这些数据会快速贬值。AI本身就是强大的数据价值挖掘工具。一家AI技术公司如果能站得更高，它就可以成为一家AI赋能的大数据解决方案公司。其可以融合AI能力，为大数据机构提供大数据服务。它可以对数据进行处理，提升数据质量，按数据的价值变化进行分级存储，优化数据处理成本，连接数据孤岛，通过AI技术充分利用数据，产生能力。其实，很多大数据机构需要的正是这样的服务。这样的商业模式虽然门槛很高，但是一旦获得客户，壁垒也很高，能够持续产生较高的商业价值。AI技术公司可以将部分涉及人力的服务外包，以专业化、规模化取得利润。\n\
    \n客户对AI的理解和接受需要一个较长的过程。与其等待客户慢慢理解AI的价值从而为其付费，不如转变商业模式，把AI隐藏起来，让客户为自己已经理解、已经接受的东西付费。\n\
    \n4\\. 改革团队结构，增强组织能力\n\n一个公司要依次做好前面的三件事，需要配合相应的组织能力，而组织能力的基础就是“人才结构+组织方式”。\n\n\
    人才结构：除了AI科学家及AI工程师，我们还需要AI产品经理，依靠他们解决产品及商业模式的问题。这样，AI应用之桥才能建成，AI技术才能真正产生价值。\n\n\
    组织方式：利用组织方式可以将这些人才组合起来，协调运作，发挥作用。\n\n有些公司虽然已经开始重视产品和商业人才了，但引进的人才却没有很快发挥作用，这可能是因为组织方式出了问题。例如，选择目标行业、目标场景时，产品经理没有提前介入，而只是在公司确定了方向之后去做细化的工作。另外，很多公司的创始人，尤其是那些强技术背景的创始人，还不知道如何正确发挥AI产品经理的作用。\n\
    \n在以上四件事中，合格的AI产品经理主要做AI技术—场景适配和AI产品规划，高级的AI产品经理则要积极参与商业模式的设计。\n\n\\[https://t.me/+WwC4dCWvXRdhOTNh\\\
