    # 第 13 章 设计 AI 商业模式


    ## 13.1 AI 商业模式


    ### 13.1.1 在 AI 商业五要素全局中构建商业模式


    设计商业模式，要考虑诸多约束条件。因为技术是个很不确定的因素，所以为技术商业设计商业模式就更加困难。


    我们先看一个传统产业商业模式的例子。利乐公司的商业模式非常知名。乳品企业只要付很少甚至不付设备款，就能使用利乐的灌装和包装设备。但这些设备只能使用利乐的包装材料，无法使用其他公司的类似包装材料。这样一来，一份乳品总成本中的
    30%~40%是利乐包装的成本。采用利乐纸包装的中国乳品如下图所示。


