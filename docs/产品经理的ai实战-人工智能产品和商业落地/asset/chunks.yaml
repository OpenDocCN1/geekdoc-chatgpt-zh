    \n车马，企业高管、作家、顾问\n\n中国最早的一批互联网产品经理之一，曾是中国电商行业第一家上市公司慧聪网唯一的产品经理，是周鸿祎起家产品3721网络实名的产品经理。\n\
    \n曾任捷银支付的产品总监、中国平安集团移动互联网部门的总经理、北京房斯达克电子商务公司CEO&CPO、北京车托帮移动科技公司COO等职。\n\n经过长期的产品实战、商业实战，构建了“车马能力増长体系”，为众多人士提供互联网行业职业发展顾问服务，为多家企业提供技术商业咨询服务。\n\
