    # 第 3 章 AI 商业格局、AI 应用


    ## 3.1 AI 商业格局


    ### 3.1.1 AI 商业格局的层次


    理解 AI 商业格局比理解 AI 技术本身更复杂。这就好比时光倒流 20 年，在互联网行业刚刚兴起时，有几人能准确预见今天的互联网商业格局？


    AI 商业格局如下图所示，其共有 4 层，从下往上依次是底层硬件、基础技术、平台/支持服务和应用。在 AI 商业中，越靠近底层竞争越激烈，残酷性接近八角笼格斗。要理解这种残酷性，可以参考
    PC 整机、CPU、GPU、操作系统、办公软件的竞争历史。因为竞争都非常正面和直接，以至于难以采取措施回避和减弱，所以最终大多数领域只剩下极少数“幸存者”。


    ![](img/epub_31486679_48)


    AI 商业格局图


    1\. 底层硬件


    底层硬件主要包括 AI 芯片、传感器，尤其是为 AI 而生的新型传感器。这个领域的技术难度及商业难度都非常大，注定只有极少数的公司能在此领域成为赢家。


    根据部署的位置不同，AI 芯片可以分为云端 AI 芯片与终端 AI 芯片。云端，即数据中心；终端，即手机、安防摄像头等设备。根据承担任务的不同，AI 芯片又可以分为训练芯片与推理芯片。将两种分类方式结合起来，可以用下表来表示。


    ![](img/epub_31486679_49)


    深度学习的训练阶段需要极大的数据量和运算量，因此训练环节只能在云端实现，所以上表中不存在“终端训练芯片”这个类型。


    根据芯片本身采用的技术路线，可以将其划分为 3 类：GPU、FPGA（现场可编程逻辑门阵列）、ASIC（专用集成电路）。在 AI 芯片领域，美国的巨头公司凭借在芯片领域多年的积累，处于全面领先地位，尤其是在
    GPU 和 FPGA 领域。国内 AI 芯片公司除华为海思外，多集中于终端 AI ASIC 的开发。


    AI 芯片可能是 AI 商业界最困难的领域，全球注定只有屈指可数的赢家能够生存到最后。本书后文不再涉及这个话题。


    2\. 基础[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)技术


    基础技术包括机器视觉、语音识别、自然语言处理、知识图谱等，这些基础技术还可以进一步细分。基础技术是 AI 学术研究的重点，很多 AI 应用的瓶颈要靠这一层来突破。这一层可以容纳的公司数量比底层硬件可容纳的要多，但每个细分领域同样只能有几家公司可以生存。


    3\. 平台/支持服务


    平台是指 AI 开放平台，如来自 Google 的 TensorFlow，来自 Facebook（脸书）的 PyTorch，来自百度的飞桨等。


    支持服务的种类很多，以数据相关的服务（如数据整理、数据标注）为主。


    平台/支持服务可以让 AI 技术更好地发挥作用，因此这一层已经变得越来越重要了。AI 开放平台只能容纳个位数的公司，而支持服务可以容纳较多的公司。


    4\. 应用


    应用在最上面一层，其根据用户的类型可以分为三大类场景——消费者场景、企业场景与政府场景，在此基础上还可以进一步细分。因为细分场景众多，每个场景都有自己的壁垒，所以这一层可以容纳数量较多的企业。


    另外，这一层是 AI 产品经理发挥价值的地方，因此也是本书讨论的重点。


    ### 3.1.2 AI 商业格局的特点


    关于 AI 商业格局，基本可以确定以下几点。


    （1）AI 技术公司间的竞争会和互联网公司的竞争一样残酷。能生存下来的公司非常少，会很快形成“底层巨头+领域细分巨头”的格局。同互联网商业一样的双金字塔格局也会很快形成。


    （2）AI 技术公司间的竞争不仅是 AI 技术的竞争，还是一场综合竞争。


    （3）AI 商业格局的形成同样高度依赖资本支持并深受其影响。


    AI 商业世界从起步就很残酷。互联网巨头已经快速进入了 AI 商业世界，并占据了相对稳定的市场份额，所以留给新公司的机会更少了。例如，百度、阿里巴巴、腾讯这些互联网巨头都已经快速成了
    AI 巨头。


    在 AI 商业世界中，所有巨头以外的公司都必须面对巨头碾压的问题。巨头以外的公司，除了少数可以依靠领先的 AI 技术，更多的公司还是要依靠对 AI 技术—场景的洞察，依靠好的产品和好的商业模式，才有可能生存下去。


