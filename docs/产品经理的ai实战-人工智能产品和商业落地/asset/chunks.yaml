    #### 13.2.3 AI工业质检模式的升级\n\n1\\. AI工业质检模式的升级之一——质检外包服务\n\n上述模式适应了企业客户的特点、充分考虑了客户的利益，对开拓市场非常有利，这个模式无疑是有价值的。但我们也要看到这个模式产生的新的问题——对AI工业质检服务商的现金流不利，在传统模式下服务商可以一次性收到大笔资金，但在新模式下只能一点点收回资金。\n\
    \n针对模式本身的缺陷，我们依然可以通过改进模式来解决，或者同时采用多种模式。\n\n除前面提到的一次性支付大笔费用和后续按月、按需付费方式之外，还有一种新方式——企业用户不需要采购设备，而是直接采购AI质检服务，按检测量付费。AI工业质检服务商将AI质检服务外包出去，负责提供设备及维护设备，甚至配套少量人力。\n\
    \n在这种模式中，只要AI工业质检服务的检测效果好、成本低，就可以快速开拓市场。这种商业模式还可以构建很高的商业壁垒，因为客户一旦习惯这种付费方式，就很难接受一次性支付大笔费用的方式。实体设备、积累的云端智慧都是客户的迁移门槛，一旦客户习惯于某公司的服务并对其服务感到满意，便不会轻易改变。其他看好这个领域的公司也很[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)难从其手中抢走客户资源。\n\
    \n2\\. 商业模式的升级之二——基于质检数据的金融化\n\nAI工业质检服务商采用了新的商业模式，也就有了稳定的现金流，这就是金融化的基础。美国华尔街流传着一句话“如果有稳定的现金流，就可以将它证券化。”当AI工业质检服务商稳定的现金流达到一定规模时，就可以通过证券化方式向金融机构融资，从而支持其业务发展。\n\
    \n这些业务量是可以用数据证明的，而且金融机构可以即时审计。金融机构控制了风险，就会降低利率。这样公司就不必过度依赖VC、PE（私募股权投资）、IPO（首次公开募股）方式来融资，可以直接从传统金融机构获取大额、低成本资金，满足公司发展的需求。\n\
    \n金融化的另一个方式是为企业客户提供金融增信。企业客户同样有金融需求，传统金融机构对企业客户发放贷款主要考虑的是其抵押资产，因为金融机构并不了解企业客户的真实生产和经营状况。AI工业质检系统实际上也是一个生产状态监测系统。这样，金融机构就对企业客户的生产情况有了非常直接的了解，而且非常容易远程获取信息（当然要经过客户允许），这相当于为企业客户提供金融增信。提供了这种重要的辅助信息，AI工业质检服务商可以向金融机构直接收费，或者向企业客户收费。而其司这样做几乎没有增加成本，只是开放了接口，让金融机构实时获取检测数据，从而推断企业客户生产经营的实际困难。\n\
    \n这种模式和支付宝的芝麻信用分的作用道理相同。支付宝的用户都有一个芝麻信用分，与支付宝合作的机构（趣店就曾经合作过）可根据信用分做出很多决定，如决定是否发放小额贷款及贷款额度，是否可以免押金租用产品等，便于合作机构在控制风险的前提下，更好地开展业务。实践证明，这种明显有别于传统金融机构的风控手段，成本低、效率高，适用于很多场景。\n\
