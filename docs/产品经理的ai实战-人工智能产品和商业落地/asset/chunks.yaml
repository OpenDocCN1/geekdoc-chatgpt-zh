    # 卷积神经网络


    卷积神经网络是以卷积运算为核心的，因此卷积层是它的核心层。但除此以外，卷积神经网络还包括其他类型的层，它们紧密配合卷积层来提取、归纳图片特征，最终在输出层输出结果。


    我们举一个卷积神经网络模型的实例。这个卷积神经网络的层数较少，只能识别 0~9 这 10 个阿拉伯数字。卷积神经网络模型的实例如下图所示。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ve="true" alt="" class="width80" data-ratio="0.286"
    data-w="1155px" data-w-new="330px" src="https://res.weread.qq.com/wrepub/epub_31486679_37"/>


    卷积神经网络模型的实例


    在这个卷积神经网络模型中，输入层和输出层之间有 6 个隐藏层：2 个卷积层、2 个池化层和 2 个全连接层。


    ## 结构组成


    ### 1. 卷积层


    卷积运算的目的是提取特征，为最终的综合判断奠定基础。上图的卷积神经网络有 2 个卷积层，可以提取更多、更细的有用特征。


    ### 2. 池化层


    池化层，也有人根据其实际作用将其翻译成“下采样层”。池化是对经过卷积处理后的图像进行又一次有效特征提取和模糊处理。可以简单地将其理解为对图像数据的一次“有损压缩”，能减小数据的处理量。


    池化的具体算法就是将图像的某一个区域用一个值代替，如最大值或平均值。如果取最大值，就叫作最大池化；如果取平均值，就叫作均值池化。池化进一步减小了图像尺寸，大幅减少了计算量。最大池化示意图如下所示。


    ![](img/epub_31486679_38)


    最大池化示意图


    上图左侧是池化之前的情况，包含 4 个 2×2 的区域。采用最大池化法，在每个 2×2 区域中取最大值来代表这个区域。上图右侧是池化完的数据，可以看出数据量大幅减少。


    卷积层与池化层交替出现，从而可以一步步提取特征、降低数据量。


    ### 3. 全连接层


    全连接层的每一个节点都与上一层的所有节点相连，这是全连接层名称的由来。卷积层提取的是局部特征，而全连接层将诸多的局部特征组合起来，从而在输出层做出最后的判断。


    卷积神经网络相当于代表大会的整个运作过程，每个卷积核相当于一个领域的代表，众多的卷积核构成了全体代表。代表大会要对一个复杂议案进行讨论，最后决定是否通过。议案中不同的内容会被相应领域的代表理解，这相当于卷积；然后进行分组讨论、分组投票、分组计票，这相当于池化；最后要合并投票，这相当于全连接。


    最后由输出层输出结果。


    卷积神经网络不仅涉及卷积这一种算法，还涉及最大池化等其他算法。因为卷积是核心算法，所以才将这种神经网络命名为卷积神经网络。


    ## 2.4.6 神经网络“智能”的形成过程


    并不是有了结构就有了“智能”，神经网络需要一个过程才能产生“智能”。


    ### 1. 设计、创建模型


    根据要解决的问题，设计模型并用代码来创建模型。


    刚刚创建的神经网络模型就相当于一个刚刚诞生的人类婴儿的大脑，并不具有“智能”。“智能”的形成还要依靠后面的环节。


    ### 2. 导入训练数据集，训练模型并检验


    经过训练的模型才会具有“智能”。“智能”相当于人类婴儿通过学习逐渐学到的众多知识点。


    训练模型需要预先导入训练数据集。数据集包含了大量的手写数字图片，有各种各样的具体样式。但仅仅将众多数字图片输入模型是不行的，因为模型并不认识这些图对应着什么数字。我们需要对数据做标注，告诉模型每张图片对应的数字。在人类的指引下，模型就会逐渐摸索出不同数字的规律。


    模型训练成功与否，需要经过实践检验，这需要通过不同于训练数据的测试数据来检测模型的输出效果。训练数据、人工标注和测试数据的对应关系如下图所示。当然，真实的数据量远大于下图所示的数据量，但下图已经可以将其原理揭示清楚了。


    ![](img/epub_31486679_39)


    训练数据、人工标注和测试数据的对应


    测试数据和训练数据是不同的。例如，我们用很多张手写的数字“3”来训练模型，让模型能正确地认出众多不同的数字“3”。目标是让它以后“看”到一个刚刚写出的（模型在训练时没有见过）数字“3”，也能准确地认出这是数字“3”。


    如果能够做到，那就表明模型训练成功了。如果测试效果不好，那就要从模型本身、训练数据集等方面找出原因，并进行调整，直到获得好的测试结果。这个过程有一定的理论依据，但也有很大的经验成分。


    ### 3. 使用模型，解决问题


    这是我们的最终目的，让具备“智能”的模型为我们解决问题。


    ## 2.4.7 深度神经网络


    随着待解决的问题越来越复杂，神经网络的层数也会逐渐增加，当其达到一定数量时就被称为深度神经网络。


    斯坦福大学的李飞飞教授发起的`ImageNet`图像识别大赛号称“计算机视觉世界杯”，其部分参赛神经网络模型的层数如下表所示。


    ![](img/epub_31486679_40)


    从表中可以看出，神经网络层数的增长速度惊人，与神经网络层数增加同步的是运算量的增长。这里存在一个边际效益递减的现象，而且递减非常严重。神经网络的层数算术级增加，导致了计算量的指数级增加，最终获得改进的可能非常小。


    截至 2019 年年底，最深的模型大概有 107 个人工神经元，但即便如此还是比青蛙的神经系统规模要小，和人类相比更是差了几个数量级。人工神经网络的规模大约每
    2.4 年翻一倍，按照这个发展速度大概到 2045 年会达到人类大脑的规模。2045 年这个时间点被认为是奇点，其根据就在于此。


    深度神经网络、卷积神经网络是从不同角度对神经网络进行分类，两个概念有一定交集。深度是指神经网络的层数多、层级深；卷积是一种运算方式。在当前的工程实战中，大多数卷积神经网络都是深度神经网络。


    上面举例讲解的卷积神经网络比较简单，只能识别 10 个阿拉伯数字。那么对于更复杂的图像识别，如识别一张彩色图片中的物体是车还是马，就需要用到深度卷积神经网络了。


    我们来看一个深度卷积神经网络的例子——`VGG`模型，它有 22 层。当模型训练完成后，给这个模型一张彩色图片，它能识别其中的物体具体是什么。


    深度卷积神经网络`VGG`的结构如下图所示。每层底部的数字是该层的序号，顶部的数字是该层的神经元数量。由图可知，`VGG`模型包含了 4 种类型的层。这一次我们从数据的角度来理解深度卷积神经网络是如何运作的。从左往右看，顶部的数字是该层的神经元数量。输入层是`224×224×3`，前两个数字对应着图片的像素，3
    代表 3 个色彩通道（`RGB`色彩模式），每个色彩通道的值对应 1 个神经元。隐藏层的第 1 层是卷积层，顶部的`224×224×64`代表这一层有`224×224×64`个神经元。第
    22 层是输出层，变成了一维的 1000 个神经元，这表示它可以识别出 1000 种物体。


    ![](img/epub_31486679_41)


    深度卷积神经网络`VGG`的结构


    从数据变化的角度看，输入的原图相当于一个长宽都很大的扁平纸箱子，经过深度神经网络众多层的处理，这个扁平纸箱子最终在输出层被“拉”成了一个很窄、很薄的长纸条，这个长纸条有
    1000 个格子，每个格子对应一种物体。模型根据提取的特征，把“识别”出来的结果写在某个格子里。准确地说，它在每个格子里都“写”了一个概率值。


    最终输出的概率值是通过`Softmax`函数处理获得的。`Softmax`函数就是归一化指数函数，产品经理不必细究其具体定义和算法，只需要知道它的作用是将分类的结果以概率值的形式展示即可。`VGG`结构图中的最后一层（第
    22 层）既被称为输出层又被称为 softmax 层。输出层是指该层的位置和作用（输出结果），softmax 层是指请该层执行的算法，是对同一个事物不同角度的命名。例如，输出层在“车”这个“格子”里写了一个值
    0.9025，在“马”这个格子里写了一个值 0.0872，那么我们就可以判断图片中的物体是车而不是马。


    我花了好长时间才真正理解深度卷积神经网络的原理，并深深感叹深度卷积神经网络发明人的智慧和数学的重要性。由此更确定了当前人工智能中的“智能”的源泉还是人类。人类将智能问题巧妙地转化为计算问题，而计算机还是只会做计算的机器，只是在人类的指导下表现出了“智能”的样子。


    ## 2.4.8 深度卷积神经网络的应用


    以深度卷积神经网络为代表的深度神经网络，为人工“智能”带来了革命性的变化。以`ImageNet`图像识别大赛中的部分数据为例进行说明，具体如下图所示。


    ![](img/epub_31486679_42)


    `ImageNet`图像识别大赛中的部分数据


    人类的错误率约为 5%，且长期稳定。截至 2011 年，人工智能的表现一直很糟糕，错误率高达 25%，这样的识别率完全无法投入使用。但在 2012 年，深度学习算法“进场”，将错误率大幅降低到
    15%左右。由此赛场的风向整体转变，整个竞赛在深度学习模型之间展开。此后，人工智能的错误率逐年下降，最终低于人类的错误率，也因此开启了人工智能的应用热潮。


    深度学习的应用非常广泛，其中包括人脸识别。在 2016 年至 2018 年的应用狂想期，人脸识别是热门领域之一。


    人脸识别就是根据人脸图像判断人的身份，其在身份识别和身份验证中广泛应用。现在的手机普遍采用了人脸识别技术，手机通过该技术能够“认出”正在操作手机的是不是主人。这样既安全又方便，而以前这两者很难同时做到。


    人脸识别的过程分两步：人脸检测和人脸体征提取。其他的工作要么为这两步配套，要么是这两步的延伸。人脸检测就是从画面中找出人脸，这是第一步。然后针对检测出的人脸提取特征，找到每张人脸的特征值。人脸检测、人脸体征提取如下图所示。把特征信息和人脸的名称保存下来，就形成了人脸库。有了人脸库就可以进行各种应用——人脸核实身份、人脸比对及人脸搜索等。


    ![](img/epub_31486679_43)


    人脸检测、人脸体征提取，来自商汤公司官网


    人脸比对只是给出一个适配数值，如下图所示。


    ![](img/epub_31486679_44)


    人脸比对只是给出适配数值，来自虹软科技官网


    在有些场景中，86.14%的适配值就足够了，但门禁、金融等领域则要求更高的适配值。所以，如何使用人工智能模型给出的结果还是由人类根据不同的场景来决定的。


    深度学习大幅度提高了人脸识别的准确度，这也是当前人脸识别领域的主流算法。深度学习对 AI 的实际应用做出了重大贡献，也造就了旷视科技、商汤等多个独角兽公司。这也是我利用大量篇幅来介绍它的原因。


