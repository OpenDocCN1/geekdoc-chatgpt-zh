    ### 13.3.3 设计医疗影像 AI 产品的商业模式


    通过上述简单介绍，我们能够看出，医疗影像 AI 产品普遍还不成熟，还有很大的改进空间。那么此时开始设计商业模式，是不是过早了呢？其实不然。


    一方面，产品的进步是渐进的，我们不可能等着产品进步；另一方面，产品与商业模式是可以互相助力的，有些产品上的问题可以通过商业模式来解决，甚至必须通过商业模式来解决。所以，一方面要尽力完善产品，另一方面也要及早设计商业模式。


    设计医疗影像 AI 产品的商业模式包含以下几个关键点。


    （1）和顶尖医院的顶尖医生长期、紧密合作，逐病种培育医疗影像 AI 产品。

    （2）将培育出来的有数据证明的医疗影像 AI 产品用于广大的基层医院，并向基层医院、二级医院收费。

    （3）除了软件方式，还可以通过创新设备、整合 AI 技术的方式，为广大基层医院提供快速可用的能力。基层医院、二级医院的工作人员只需要负责基本的操作，医疗专业由系统负责。

    （4）抓住医疗影像从胶片到数字化的机会，将医疗影像云和医疗影像 AI 技术整合，提供给广大的基层医院、二级医院。

    （5）引入金融机制。为基层医院提供一次性付款方式以外的租赁方式，降低门槛。


    鼓励医生进行数据标注、数据跟踪，这样的做法还涉及商业上的考虑。例如，眼科疾病的诊断，如果是来自知名眼科医院的专家进行数据标注，就具备很强的说服力，也更容易被其他医院和患者接受。


    向三甲医院收费是之前大多数医疗 AI 技术公司存在的问题。三甲医院长期处于优势地位，很难接受新的付费项目。医疗 AI 技术公司设计商业模式，应将三甲医院真正变成商业上的合作伙伴。这种关系一旦形成，就会产生较强的排他性。而且这种模式真正利用了三甲医院的优势地位，高成本培养，低成本复用，使三甲医院的医生不再有抵触情绪。


    向基层医院、二级医院收费，是因为他们的需求可以用 AI 技术来解决。就在医疗 AI 技术公司扎堆进入三甲医院的同时，有些公司已经将眼光放到了基层医院上。2019
    年，推想科技深入县域医院，助力河北省某医院“肺结节智能（AI）联合早筛中心”的成立，这也是河北省首个引进 AI 人工智能技术辅助肺结节筛查项目。


    这样的基层医院看上去影响力不大，但试想全国有多少个基层医院，覆盖了多少患者？一个基层医院如果运作成功，向其他医院推广的难度就会大大降低；但一个三甲医院的试点成功并不会对其他三甲医院产生很大影响，向其他三甲医院推广的难度依旧很大。三甲医院只能各个突破，而基层医院则有可能批量推广。


    当前，我国医疗影像正在从胶片逐渐向数字化过渡。大型医院已经先行一步，一般都有了影像归档与通信系统，其可以将产生的各种海量医学影像（包括核磁、CT、超声、各种
    X 光机、红外仪、显微仪等设备产生的图像）通过各种接口（模拟、DICOM、网络）以数字化的形式保存起来。经过授权的使用者可以方便地调用。受益于国家分级诊疗、区域医疗联合体等政策，第三方独立影像中心遍地开花。除了一脉阳光、东软等早些就较为知名的独立医学影像诊断中心，还出现了联影医疗这样的第三方影像中心。


    这个领域属于医疗信息化，而不属于 AI。但 AI 企业完全可以跳出 AI，采用自研、合作的方式将两者结合起来，更好地获取客户。而且这是一个阶段性的机会，一旦大多数医院完成了医疗影像的数字化，这个机会窗口可能就错过了。


