    # 第13章 设计AI商业模式


    ## 13.1 AI商业模式


    ### 13.1.1 在AI商业五要素全局中构建商业模式


    设计商业模式，要考虑诸多约束条件。因为技术是个很不确定的因素，所以为技术商业设计商业模式就更加困难。


    我们先看一个传统产业商业模式的例子。利乐公司的商业模式非常知名。乳品企业只要付很少甚至不付设备款，就能使用利乐的灌装和包装设备。但这些设备只能使用利乐的包装材料，无法使用其他公司的类似包装材料。这样一来，一份乳品总成本中的30%~40%是利乐包装的成本。采用利乐纸包装的中国乳品如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_104)


    采用利乐纸包装的中国乳品


    这样的商业模式确实让人羡慕，但不好学习，因为这需要强大的资源、优秀的产品和组织能力来配套。乳业巨头做大之后，完全有实力整体更换其他公司更便宜的包装设备和材料，而且市场上有很多供应商。为什么很少有客户这样做？因为该公司提供的包装设备和材料质量确实好，有坏包率、保质期等可验证的数据来证明。该公司在包装上有5000余件专利，并且还有大量专利正在研发和申请当中，这就给竞争对手构建了强大的专利壁垒。


    这种优秀的商业模式是以优秀的产品为基础的。因此，客户一方面对利乐存在意见，另一方面又离不开它。如果单纯依靠商业模式，利乐可能很快就会被包装同行学习、超越。


    AI行业也是一样，设计商业模式同样要考虑配套的其他因素。如果是实力、规模较弱的公司，可以选取更小、更聚焦的场景，避开过于激烈的竞争，从而在相对安全的领域，依靠商业模式逐渐成长。


    设计商业模式是一个动态的过程，上文提到的利乐的商业模式也是逐渐演化出来的。如果是“好产品+好的商业模式”，即便是较小的AI技术公司，其成功的机会也会大大增加。


    ### 13.1.2 AI商[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)业模式的层次


    AI商业模式可以划分为3个层次，如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_105)


    AI商业模式的层次


    基本层次是已有的商业模式，商业模式要做到为产品助力、助推，而不能拖产品后腿。虽然是基本层次，但能做好也是很不容易的。合理的定价、合适的渠道建设、适当的市场推广、良好的运营，每一条要做好都不容易。能做到、做好这个层次就已经可以取得不错的应用成效。


    高层次的商业模式是创新商业模式，即用新的方式来运作业务。其往往会带来更强的竞争力，取得更好的商业成果。高级AI产品经理要洞察AI技术—场景，以便打造产品，并在产品的基础上进行商业模式设计。如果这几步都做到了，就大大提升了成功的可能性。


    更高层次的是开创全新的商业空间，就是开创此前从来没有被开发过的商业空间。


    ### 13.1.3 产品与商业模式的配合关系


    本书第1章就提到了X技术商业成功的5个要素，并且根据目标读者的情况，重点讲了其中的3个要素：技术—场景、产品、商业模式。其中，产品与商业模式之间是紧密的配合关系。


    （1）产品是商业模式的基础，只有有了产品，相应的商业模式才能运作，否则商业模式就是无本之木。


    （2）商业模式是产品的舞台，它为产品提供了发挥价值的空间。如果没有配套的商业模式，产品的价值就可能得不到充分发挥。


    （3）产品与商业模式之间存在着强烈的互动关系。企业用产品探索市场、探索客户，加深对技术—场景的理解，而这种理解可以反推商业模式。反之，商业模式可以决定产品，有什么样的商业模式就需要相应的配套产品。实战中取得重大商业成功的商业模式几乎都不是一蹴而就的，而是经过了反复探索、迭代、多次进化而来的。在商业模式迭代、进化的同时，产品也产生了相应的迭代、进化，以便和商业模式更好适配。


    我们来比较一下AI芯片领域两个重要的企业——NVIDIA和Google的产品与商业模式之间的关系。


