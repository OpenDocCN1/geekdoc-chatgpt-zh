    ## 9.3 AI 产品的数据机制和指标体系规划


    AI 产品经理在进行 AI 产品规划时要注重两个方面的规划：产品数据机制规划；产品指标体系规划。


    ### 9.3.1 AI 产品经理对数据机制的规划


    对于 AI 产品而言，算法和数据都很重要，而且两者缺一不可。数据机制是 AI 产品的有机组成部分，如何获取高质量的数据是 AI 产品经理进行规划时要考虑的内容。


    数据可分为两种：未标注数据和已标注数据。以一张工业产品的图片为例，原图是未标注数据；如果利用标注软件将其中的缺陷在原图中标注出来，它就成了标注数据。用标注数据去训练
    AI 模型，就是监督学习。在监督学习中，高质量的标注数据非常重要，可能比算法和模型本身更重要。


    数据机制包含很多内容，简单分拆如下。


    1\. 数据的获取方式和来源


    数据是批量购买还是用合作的方式获取？这要根据产品、数据的特点来进行规划。好的 AI 产品经理一定要非常清楚产品所在细分领域的数据情况。


    例如，医疗影像数据有公开数据集，但其他对手也能获得公开数据集，因此很难形成竞争优势。如果想要获得独家数据，就可以与医院进行深入合作。


    有些数据的个性非常强，基本只能自己获取。典型的就是工业产品缺陷数据，不同产品的不同缺陷有非常大的区别，单纯靠公开或外购数据集几乎是无法满足的，这时就必须自己获得数据集并进行标注。例如，为烟草生产企业做烟草包装缺陷检测，合适的方式就是由烟草企业质检部门提供典型的缺陷产品，然后拍成清晰的图片，再由质检工人进行标注。


    2\. 数据标注的规划


    标注的质量会直接影响模型的质量。人工标注很容易出现质量问题，因此数据标注至少会安排两位工作人员：标注员和审核员。标注员负责标记数据；审核员负责审核被标记数据的质量。


    先由人工标注，然后由另外的人工来审核，在一定程度上就可以保障数据标注的质量。这样虽然会增加人力投入，但仍然[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)是值得的。


    数据标注需要相应的软件工具，需要考虑到如何提升效率，如快捷键的设置、边标记边保存等功能的应用。


    另外，通过计算标注人员的标注正确率和被审核通过率，对其标注质量进行追踪记录，并利用“末位淘汰制”提高标注人员的标注质量。


    数据机制、标注工具和检验机制都是需要针对产品专门进行规划的，虽然有共通的地方，但不同的产品、不同的数据，都有自身个性化的地方。


