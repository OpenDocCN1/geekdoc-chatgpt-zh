    #### 2.4.2 从生物神经元到人工神经元


    生物神经元是一种细胞，是神经系统的基本结构和功能单位之一。神经系统由大量的神经元细胞构成，神经元细胞由细胞体、树突和轴突等部分组成。神经元细胞的一端是树突，另一端是突触。某个神经元细胞通过一端的树突获取其他神经元细胞的突触传递过来的刺激，这种刺激单向地传递到另一端的突触，突触以化学或电作用的方式传给其他神经元细胞的树突。这样众多的神经元被连接起来，构成了生物（当然包括人类）的神经系统，孕育出了智能。下图为生物神经元的示意图，图中有两个神经元细胞，其通过突触、树突发生联系。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_31)


    生物神经元示意图


    生物神经元可以被视为基本的信息编码单元。生物神经元和生物神经系统为人工神经元和人工神经系统提供了借鉴。人工神经元模型如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_32)


    人工神经元模型


    一个人工神经元接收来自其他多个神经元传[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)递过来的多个输入值，上图用`X1`，`X2`，…，`Xn`来表示。这些输入值乘对应的权重然后求和，上图中的`W1`，`W2`，…，`Wn`等代表权重。最后，将所得到的和与阈值对比，如果所得到的和超过了阈值，就通过一个激励函数输出一个数。


    激励函数，也叫激活函数。常见的激励函数有很多种，如`Sigmoid`函数（又称S形生长曲线）、`ReLU`函数（线性整流函数）。产品经理在入门阶段不需要深究不同激励函数的数学细节，只要知道有多种类型的激励函数即可。


    为了表达简洁，后文提及的神经元均指人工神经元。


    从上面的介绍可以看出，神经元的功能非常简单，看上去和“智能”一点关系都没有。为了便于理解，我们不妨将神经元和晶体管做个比较。单个晶体管功能简单、能力有限，但如果将数以亿计的晶体管有机集成到一块芯片上，它就能成为功能强大的`CPU`或`GPU`，成为当今信息社会的基石。同理，单个神经元虽然简单，但如果能把大量的神经元有机组合成一个神经网络，它就能实现人工智能。


    #### 2.4.3 神经网络


    将大量的神经元按一定的结构连接起来，就构成了神经网络。具体的结构方式有很多种，下图是一种常见的神经网络结构。这是一个3层的神经网络，输入层不计入层数。


