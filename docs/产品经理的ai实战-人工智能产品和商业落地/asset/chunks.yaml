    ## 3.2 AI 应用的经验教训


    ### 3.2.1 AI 应用的阶段


    AI 的规模化应用呈现出非常明显的行业差异，以此可以将其划分为 3 个阶段。


    第一阶段：互联网大公司率先大规模应用 AI 技术，这在 2016 年之前就已经开始了。


    第二阶段：2016 年至 2018 年，在 AI 发展热潮的推动下，各行各业在众多的场景中尝试应用 AI 技术，但是只在少数场景达到或基本达到预期，多数场景的应用与最初的预想有很大落差。


    第三阶段：从 2019 年开始进入这个阶段。AI 应用更加务实，其根据 AI 技术—场景的适配程度，有先有后、有快有慢、有深有浅地推进。


    ### 3.2.2 互联网大公司成功应用 AI 技术的启发


    在我国乃至全球，最先大规模应用 AI 技术并取得明显效果的几乎都是互联网大公司，它们是 AI 技术应用的引领者。分析其中的原因，对其他行业场景的应用会有所启发。


    （1）互联网大公司具有数据优势，非常适合 AI 技术发挥作用。


    互联网大公司同时也是数据公司，拥有源源不断的大数据，而大数据是 AI 的养分，因此互联网大公司就为 AI 技术提供了非常适合的场景。


    互联网大公司的数据优势不仅来自其数据体量，还来自其数据质量。互联网大公司一直对数据非常重视，很早就投入了大量的资源来提升数据质量，因此数据既有体量又有质量，这恰恰是让
    AI 技术发挥作用的先决条件。相比之下，很多公司虽然也号称有大数据，但往往是数量大、质量差，很难发挥 AI 技术的作用。


    其他行业要想同互联网大公司一样用好 AI 技术，首先要加强数据质量的提升，这需要相当大的投入和耐心。


    （2）互联网大公司对技术有天然的亲近感，更倾向于用新的技术来解决问题。


    互联网大公司大都是技术公司，它们往日的成功得益于对技术的正确使用，因此其对技术有天然的亲近感。当遇到业务问题时，它们会优先考虑用技术手段来解决。


    互联网大公司应用 AI 技术并不是一帆风顺的，最初也遇到了很多问题。但因为对技术有天然的亲近感，最终还是克服了困难，探索出了正确的方法。


    其他行业也应该[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)逐渐建立对技术的亲近感，从而让 AI 技术更好地发挥作用。


    （3）互联网大公司的用户基数、业务基数大，只要略有改进就能获得显著收益。


    互联网大公司的规模特别适合发挥技术（包括 AI 技术）的优势。


    例如，一家互联网电商公司年交易额为 5000 亿元人民币，如果在商品推荐系统中使用好 AI 技术，就可以让销售额增加 2%。2%这个比例确实不高，但它对应的金额却高达
    100 亿元人民币，由此增加的利润可能很快就能收回公司在 AI 技术上的投入。


