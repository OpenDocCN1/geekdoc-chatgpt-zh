    ## 3.2 AI应用的经验教训


    ### 3.2.1 AI应用的阶段


    AI的规模化应用呈现出非常明显的行业差异，以此可以将其划分为3个阶段。


    第一阶段：互联网大公司率先大规模应用AI技术，这在2016年之前就已经开始了。


    第二阶段：2016年至2018年，在AI发展热潮的推动下，各行各业在众多的场景中尝试应用AI技术，但是只在少数场景达到或基本达到预期，多数场景的应用与最初的预想有很大落差。


    第三阶段：从2019年开始进入这个阶段。AI应用更加务实，其根据AI技术—场景的适配程度，有先有后、有快有慢、有深有浅地推进。


    ### 3.2.2 互联网大公司成功应用AI技术的启发


    在我国乃至全球，最先大规模应用AI技术并取得明显效果的几乎都是互联网大公司，它们是AI技术应用的引领者。分析其中的原因，对其他行业场景的应用会有所启发。


    （1）互联网大公司具有数据优势，非常适合AI技术发挥作用。


    互联网大公司同时也是数据公司，拥有源源不断的大数据，而大数据是AI的养分，因此互联网大公司就为AI技术提供了非常适合的场景。


    互联网大公司的数据优势不仅来自其数据体量，还来自其数据质量。互联网大公司一直对数据非常重视，很早就投入了大量的资源来提升数据质量，因此数据既有体量又有质量，这恰恰是让AI技术发挥作用的先决条件。相比之下，很多公司虽然也号称有大数据，但往往是数量大、质量差，很难发挥AI技术的作用。


    其他行业要想同互联网大公司一样用好AI技术，首先要加强数据质量的提升，这需要相当大的投入和耐心。


    （2）互联网大公司对技术有天然的亲近感，更倾向于用新的技术来解决问题。


    互联网大公司大都是技术公司，它们往日的成功得益于对技术的正确使用，因此其对技术有天然的亲近感。当遇到业务问题时，它们会优先考虑用技术手段来解决。


    互联网大公司应用AI技术并不是一帆风顺的，最初也遇到了很多问题。但因为对技术有天然的亲近感，最终还是克服了困难，探索出了正确的方法。


    其他行业也应该[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)逐渐建立对技术的亲近感，从而让AI技术更好地发挥作用。


    （3）互联网大公司的用户基数、业务基数大，只要略有改进就能获得显著收益。


    互联网大公司的规模特别适合发挥技术（包括AI技术）的优势。


    例如，一家互联网电商公司年交易额为5000亿元人民币，如果在商品推荐系统中使用好AI技术，就可以让销售额增加2%。2%这个比例确实不高，但它对应的金额却高达100亿元人民币，由此增加的利润可能很快就能收回公司在AI技术上的投入。


    一个拥有亿级用户的互联网内容产品，如果在内容推荐系统中应用好AI技术，就可以让用户日均留存时间增加15秒钟，由此增加的广告收入一年可能就达到几亿元人民币。


    除了腾讯、阿里巴巴这两个巨头，其他的互联网大公司也都在大规模应用AI技术。一些成立时间较短的公司，也在借助AI技术快速成长。以字节跳动公司为例，该公司的核心产品今日头条、抖音等都高度依赖推荐系统。只有更好地为用户推荐内容，才能更长久地留住用户。该公司最初的推荐系统并不是基于AI技术，而是基于人工策略——由策略产品经理制定一条条规则，然后由策略工程师来实施。然而，人工规则越多，系统的效率、可靠性也就越差，这种方式注定不会走太远。字节跳动公司逐渐将AI技术用于推荐系统，并取得显著成效。该公司产品的关键数据近几年有了显著增长，公司的估值也随之水涨船高。


    互联网大公司对AI技术的成功应用，至少说明一件事——目前的AI技术是可以大规模应用的。


    其他行业的公司，也应该充分利用自己的规模优势，充分发挥AI技术的价值。


