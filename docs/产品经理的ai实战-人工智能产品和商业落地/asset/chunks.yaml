    \n更高层次的是开创全新的商业空间，就是开创此前从来没有被开发过的商业空间。\n\n#### 13.1.3 产品与商业模式的配合关系\n\n本书第1章就提到了X技术商业成功的5个要素，并且根据目标读者的情况，重点讲了其中的3个要素：技术—场景、产品、商业模式。其中，产品与商业模式之间是紧密的配合关系。\n\
    \n（1）产品是商业模式的基础，只有有了产品，相应的商业模式才能运作，否则商业模式就是无本之木。\n\n（2）商业模式是产品的舞台，它为产品提供了发挥价值的空间。如果没有配套的商业模式，产品的价值就可能得不到充分发挥。\n\
    \n（3）产品与商业模式之间存在着强烈的互动关系。企业用产品探索市场、探索客户，加深对技术—场景的理解，而这种理解可以反推商业模式。反之，商业模式可以决定产品，有什么样的商业模式就需要相应的配套产品。实战中取得重大商业成功的商业模式几乎都不是一蹴而就的，而是经过了反复探索、迭代、多次进化而来的。在商业模式迭代、进化的同时，产品也产生了相应的迭代、进化，以便和商业模式更好适配。\n\
    \n我们来比较一下AI芯片领域两个重要的企业——NVIDIA和Google的产品与商业模式之间的关系。\n\nNVIDIA的GPU是当前重要的AI芯片，占有较大的市场份额。它的主力产品就是GPU及GPU卡。它的商业模式比较传统（但并不代表不好），将GPU卖给企业用户，一次性收取费用。企业用户买到GPU之后，需要自己放置在数据中心，自己负担运行费用（GPU耗电很大）。在这种模式下，NVIDIA的现金流很好，将产品卖出时就将费用收完。这种商业模式使NVIDIA长期将提高计算性能作为重点工作，并取得较大进展。相反，降低单位功耗并没有得到足够重视，所以在这方面进展不大。因为[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)将产品卖出后，产品运行期间的电费是企业客户自己支付的，所以NVIDIA便不那么重视。这就是一个商业模式影响产品的例子。\n\
