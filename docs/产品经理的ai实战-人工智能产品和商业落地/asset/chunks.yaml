    \  | ID：EPUB\\_20260428160408 \n\n# 合格AI产品经理篇\n\nAI产品经理就是专职管理AI产品的专业人士，需要具备配套的能力体系。\n\
    \n合格AI产品经理是AI产品经理的中坚力量，他们虽然还不能参与商业模式设计，但可以承担AI技术—场景适配及AI产品规划等重要工作，是AI技术落地应用不可缺少的人才。\n\
    \n本篇将针对合格AI产品经理介绍AI产品、AI产品经理的定义，AI产品经理能力体系的杠铃模型，并以此为基础，比较详细地讲解AI技术—场景的适配，然后安排3章分别介绍了3类公司的AI产品——互联网公司的AI产品、AI技术公司的AI产品及传统行业的AI产品。接着在这3章的基础上，讲解AI产品规划的流程和方法。最后讲如何快速成为AI产品经理。\n\
