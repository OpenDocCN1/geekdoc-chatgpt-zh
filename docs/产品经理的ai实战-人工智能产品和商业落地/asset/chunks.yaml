    ## 8.2 传统企业做AI产品的原因及AI产品的分类


    ### 8.2.1 传统企业做AI产品的原因


    虽然互联网公司是大规模应用AI技术的先驱，但传统企业的AI应用也正在兴起。如果留意AI产品经理的招聘信息，我们会发现来自传统企业的职位正在逐渐增加。希望获得AI产品经理职位的读者，不妨多关注一下传统企业所提供的机会。


    下面，我们来简单分析一下传统企业做AI产品的原因。


    AI技术的价值逐渐得到了广泛的肯定，其中包括传统企业。传统企业对自己的业务场景非常了解，也逐渐认识到AI技术可以满足自己的场景需求。因为AI技术并非传统企业的强项，所以传统企业会先寻求外部采购，希望AI技术公司能提供可立刻使用的AI产品。即使没有成熟的AI产品，传统企业也希望外包给AI技术公司来开发。因此，在很长一段时间内，很多AI技术公司的主要收入就来自传统企业的外包业务。


    外购AI产品、外包AI项目满足了传统企业的部分需求，但不能满足其全部需求。一些领先的传统企业对AI的理解可能比AI技术公司更深，更何况传统企业对自己的业务场景有天然优势。当外购、外包不能满足其需求时，一些实力强的传统企业就开始自己打造AI产品。于是，我们看到一些实力强大的传统企业开始招聘AI产品经理和AI工程师，以使自身既有AI产品规划能力，又有AI产品实施能力。


    其实，“传统企业”只是一种习惯说法，具体是指AI技术公司、互联网公司以外的企业。传统企业也在演变，并逐渐向AI技术公司、互联网公司的领域渗透。以金融业为例，近年来一些大型的金融集团（以中国平安为代表）纷纷成立专门的科技公司，这些科技公司最初只为本集团服务，后来逐渐开始从集团外获得客户。


    ### 8.2.2 传统企业AI产品的分类


    传统企业打造的AI产品大体可以分为以下两类。


    1. 利用AI技术，改造、提升原有的IT产品、互联网产品


    华住酒店集团（旗下有汉庭、全季等酒店）就曾招聘高级产品经理（AI方向）。华住酒店集团的主业是酒店，旗下运营着众多的门店。呼叫中心、门店前台对于酒店运营非常重要，因此公司希望借助AI技术把呼叫中心、门店前台系统做得更好。


    例如，客人通过呼叫中心订房时，酒店需要核实客人的身份。传统方式需要客人报身份证、会员卡等信息。而如果采用声纹识别技术（一种AI技术），就可以对客人进行无感身份核实，更快完成预定。如果门店前台能利用好AI技术，就可以为客人提供自助服务，使其更快完成入住和离店手续，避免高峰时段排长队。要在这些场景中用好AI技术，就需要专职的AI产品经理来进行规划。


    另外，还有不少知名教育机构开始招聘AI产品经理。新东方、VIPKID等教育机构为了支持业务运营，开发运营了很多用户端及后端产品。这些产品原来是传统的IT产品、互联网产品，但教育机构逐渐看到了AI技术的价值，招聘了AI产品经理来提升这些用户端及后端产品，使其更好地支持教育业务。


    2. 利用AI技术打造新产品，但一般仍然服务于原有的业务体系


    例如，泰康保险集团旗下的泰康健康产业投资控股有限公司（简称泰康健投），就曾招聘AI硬件产品经理，希望打造出AI护理机器人这样的产品。泰康健投的主营业务是医养业务，其主要服务对象是老年人。该公司打造的AI产品仍旧是为老年人服务的，主要应用在公司运营的养老院中。


    比亚迪是一家知名的汽车公司，该公司曾专门招聘AI语音生态产品经理，负责DiLink AI语音助手的产品规划。比亚迪的主业是汽车产业，DiLink AI语音助手也是服务于汽车产业的。


    ## 8.3 在传统企业做AI产品


    ### 8.3.1 传统企业对AI产品经理的要求


    相比互联网公司和AI技术公司，在传统企业做AI产品有其特殊性。


    典型的互联网产品经理进入传统企业担任AI产品经理，需要满足哪些要求呢？具体可以用下面的等式来概括：


    传统企业的AI产品经理=互联网产品经理+AI技术+垂直行业


    传统企业的AI产品经理既要懂AI技术又要懂垂直行业，只有这样才能将AI技术和垂直行业的具体场景适配起来，打造出能服务好主业的AI产品。因此，在传统企业做AI产品，难度是很高的。但因为传统企业体量大、数量多，有可能提供大量的AI产品经理职位，所以值得读者特别关注。


    ### 8.3.2 在传统企业做AI产品的关键


    1. 深入理解行业场景，实现AI技术与行业场景的适配


    理解行业场景是AI产品经理在传统企业做AI产品的第一步，AI产品经理只有做到了这一点才能实现AI技术与行业场景的适配。


    以平安小贷公司的客服机器人为例。平安小贷的客户需要先在网上提交申请，之后由客服外拨电话进行核实。原来这需要大量的人工客服人员，后来采用了客服机器人。我听了实际录音，应用效果非常好。


    客服机器人问：“请问，您今年多少岁？”


    客户：“……”


    客服机器人：“对不起，我没听清，您能再说一遍吗？”


    客户略有点不耐烦：“30岁！”


    客服机器人：“喔！好的，30岁。这次听清了！”


    这既满足了业务需要，又节约了运营成本。同时，这也和贷款核实的场景特征有关——用户高度配合，对话内容非常明确，整个过程也很简短。客服机器人和这样的场景高度适配。


    2. 选择单点切入，从简单的AI产品起步


    AI产品经理在传统企业做AI产品，一定要暂时忘记雄心勃勃的“行业解决方案”，先从单点切入，从简单的AI产品起步。


    中国平安对AI的全面应用是经过一段时间积累的结果，其最初也是从单点切入的。例如，中国平安对AI技术的实际应用开始于2016年的“6分钟刷脸放贷”。它只是在放贷业务的用户身份认证这个环节应用了一项成熟的AI技术。这样的单点价值明确、涉及面小、技术实施难度低。从这样的单点切入，AI产品更容易规划，也更容易实施。单点切入可以让AI技术更快发挥作用，让整个组织、整个业务在实际应用中逐渐理解、接纳AI技术和AI产品，然后以此为基础逐渐扩展到全场景，使AI技术发挥越来越大的作用。


    3. 选择重点场景，做出复杂产品


    传统企业的运营可以细分为很多环节、众多场景，场景不同，其重要性也是不同的。实现了简单场景的切入之后，可以在适当的时机选择重点场景，做出复杂产品，如中国平安的AI车险定损理赔。


    车险是重要的财产保险业务，占据了财产险公司的收入“大头”。其中，车险定损因为直接涉及保险公司的大笔支出，是整个车险业务中的重要场景。传统的车险定损流程包括报案联系、现场勘查、理赔资料整理、定损、审核等冗长的环节，客户体验差、运营成本高、欺诈风险高，一直是保险公司的痛点。


    中国平安旗下的平安科技自主研发了平安脑智能引擎，利用AI技术来挖掘车险图像数据信息，实现线上自动定损。其通过智能引擎分析事故现场照片，提供车险查勘与定损、零件配型、车型识别、同车检测等综合服务，直接跳过了多个传统定损环节，提高了定损理赔效率。也就是说，借助AI技术，大多数车险定损不需要定损人员到场，远程通过AI就能完成。AI车险定损的示意图如下所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_82)


    AI车险定损的示意，来自深智科技


    这样的AI产品是非常复杂的，规划难、实施更难，但应用场景重要，所以是有价值的。中国平安利用AI车险定损理赔，不仅提高了客户的满意度，降低了定损的人工成本，还降低了车险定损理赔领域的欺诈风险，可谓一举三得。


    ## 第9章 AI产品规划的流程和方法


    研究其他产品的根本目的是规划自己的产品。本章我们就来介绍，如何规划自己的AI产品。


    ### 9.1 AI产品规划入门


    #### 9.1.1 基本方法——“抄”出好产品


    对于合格的AI产品经理而言，其在进行AI产品规划时，其实做不到也不需要原创。说得直白一点，合格的AI产品经理做产品规划的基本方法就是“抄”。当然，“抄”也是有层次的。我们要做的是，选对“抄”的对象，从产品经理的专业角度理解被“抄”的产品，然后将学到的知识、技能用在自己的AI产品规划中。


    前面3章介绍了3种类型公司的AI产品，并从多个角度对这些产品进行了解读，实际上是在帮助读者选择“抄”的对象。当我们真正理解了这些产品的背景、定位、功能、流程，理解了其中的门道，我们就可以做出自己的AI产品规划。


    #### 9.1.2 AI产品详细规划前的自检


    在对一个AI产品进行详细规划之前，我们要先进行自检。如果自检通过了，就说明我们想清楚了基本问题，大方向没有错，下一步就可以进行详细的产品规划了。反之，我们要先停下来解决基本问题，先把大方向找对。


    对产品的自检，其实就是回答一些基本而重要的问题，主要包括以下内容。


    1. 产品的目标用户


    （1）产品的目标用户是谁？产品满足了目标用户的什么需求？


    （2）目标用户如果不用我们的产品，有什么替代的解决方案？


    2. AI产品的价值


    （1）产品的核心功能点是什么？尽量用一句话描述。


    （2）产品中用到了什么AI技术？其在产品中发挥了什么作用？给客户带来了什么价值？最后一个问题，要完全从客户的角度来回答。


    3. AI产品的实现


    （1）产品本身相关的问题。产品的形式是什么？是否涉及专门的硬件？AI能力在云端、终端如何分布？


    （2）具体AI技术相关的问题。产品需要什么样的AI技术？如何获得相应的技术？是外购AI中间产品、外包开发，还是自主开发？相应的成本是多少？


    （3）AI产品数据相关的问题。有没有AI产品的相关数据？质量、数量如何？如何获取？获取的成本是多少？如何标注？


    4. 其他问题


    其他问题的答案可以逐一解答。例如，产品以什么方式获取收入？预测的收入是多少？


    以上列举的自检问题只是一个参考，AI产品经理要结合实际的场景和产品特点，拟定相应的自检问题。


    自检相当于在远征之前确定目标、看准方向、确认路径，可以让我们更坚定地踏上远征之路。其价值不言而喻，产品经理要认真做好相关工作。


    #### 9.1.3 软件规划的层次和流程


    纯“软”的AI产品不涉及专门的硬件，其规划流程、方法、使用的工具和标准的互联网产品基本一样。这对有互联网产品经验的人而言，是个好消息。互联网公司产品规划的分层和流程如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_83)


    互联网公司产品规划的分层和流程


    如图所示，互联网公司的产品规划可以分为两个大层次：产品整体规划和产品版本规划，两个层次内部还可以再进行细分。现有产品的规划是在产品整体规划的指导下进行每个版本的规划的。每次版本迭代尤其是较大版本的迭代，都要先回到源头梳理产品整体规划，然后再进行新版本的规划。所谓产品迭代，不仅是指一个个版本的迭代，还隐含了产品整体规划的迭代。


    互联网公司的AI产品基本仍然按互联网产品的流程来规划，通常沿用互联网产品使用的原型工具和产品需求文档。只要是合格的互联网产品经理，只要其找准了AI应用的微场景，基本上都能做好AI产品的规划。


    由于本书读者多数对互联网产品规划流程比较熟悉，这里就不再对产品规划的流程过多展开了。没有互联网产品规划经验的读者，可以参考我关于互联网产品经理的书《首席产品官1——从新手到行家》《首席产品官2——从白领到金领》。


    #### 9.1.4 硬件规划流程


    大多数互联网产品经理缺乏硬件经验。关于硬件，广大互联网产品经理首先要确立两个观点：硬件的规划很难；硬件的规划与软件的规划大不相同。


    硬件的规划流程可以分为以下几步。


    （1）进行需求和市场分析。所有产品都是因需求和市场而生，所以在起步阶段一定要进行需求和市场分析。如果这一步出现问题，那么产品规划从根本上就错了。另外，仅有需求分析是不够的，市场分析可能更重要。例如，如果仅仅考虑需求，我们会发现人们对人脸抓拍机的需求很大，一方面新客户直接使用人脸抓拍机，另一方面一些老客户逐渐用人脸抓拍机更换了传统的监控摄像机。虽然公司有能力研发制造出人脸抓拍机，但如果考虑市场我们就要谨慎了。因为已经有好几家安防巨头推出了自己的人脸抓拍机，这些公司有供应链、品牌、客户及渠道优势，而自己的公司却没有这种优势。显然，推出人脸抓拍机不是一个正确的决策。


    （2）整体方案设计。有了基本方向，下一步就要进行整体方案设计，包括系统整体设计、关键元器件选型等多方面的内容。整体方案设计非常关键，因此需要经过多部门综合评审，设计、采购、工艺制造等部门都要从各自的角度出发参与评审。产品经理要带着评审中发现的问题，对整体方案进行修改，直到最终评审通过。


    （3）硬件设计、工业设计。这一步是将整体方案细化为具体的设计，要画很多图纸。目前，工业设计越来越重要，其已经从硬件设计中独立出来成为一个专业工种。大公司往往有自己的工业设计部门，中小型公司如果想做好工业设计通常就需要通过外包解决。同样，硬件设计、工业设计也需要经过多部门评审。这些评审看似占用了时间、耽误了进度，但实践证明这是不可缺少的。


    （4）制作样板。用真实的设备、物料、工艺流程来实施设计方案，制造出少量的产品。


    （5）测试、改进。对制作出来的样板进行测试，并针对问题进行改进。这些改进可能涉及工艺等多方面。


    （6）定型、批量生产。


    以上流程是比较简单概括的流程，在此基础上还可以继续细分，在此不再详细介绍。


    #### 9.1.5 产品软硬规划工作的组织形式


    要规划涉及硬件的AI产品，产品规划工作的基本组织形式有两种：软硬兼管的全能AI产品经理制度、软硬分工的联席AI产品经理制度。


    软硬兼管的全能AI产品经理制度就是由一个全能型产品经理同时完成产品的软硬两方面的规划工作。但符合这样条件的产品经理极少，术业有专攻，能精通软件、硬件一个领域的人才已经很难得了，两者都非常精通还能将其融合的人就更少了。我在实战中见过两者都懂的人，但没有见过两者都精通的人。规划硬件时往往要考虑很多规划软件时不需要考虑的因素，如可制造性、物料和制造成本、可靠性、可维护性，还要考虑法律法规要求。如果没有足够的理论知识和实战经验，一旦一个环节出错就可能导致严重的问题。能勉强做到的人，必然有所侧重。要么可能更擅长软件方面，硬件比较勉强；要么擅长硬件方面，但软件方面比较弱。这样勉强做出来的产品的竞争力通常不会太强，在激烈的同类产品竞争中往往很难“生存”下来。


    联席AI产品经理制度就是由两个产品经理来担任一个AI产品的联席产品经理，两人在全程紧密协作的基础上，各自分担产品软件、硬件两方面的规划工作。这种制度充分考虑了现实中的人才结构和人员稀缺程度，更加实用。


    一个产品的软硬因素是整合的而不是分离的。在起步阶段，大多数软硬一体的AI产品有很多方面的软硬分工界限并不清晰，需要两个产品经理一起来考虑。通常是两个产品经理先讨论一个初步方案，然后两边分别进行到一定程度再沟通，最后协作进行调整。


    例如，一个公司要规划老年人专用的智能音箱，这是一个典型的软硬整合的AI产品。为了做好这个产品的规划，公司采用了联席AI产品经理制度。刚开始两位产品经理考虑采用“云AI+端AI”的方式，让用户端设备也具有较强的AI能力，这样可以提供更好的用户体验。以此为基础，偏重硬件规划的产品经理经过规划和测算，发现这样的用户端设备成本超过800元。两位产品经理判断这样高成本的产品在当前的市场环境下会缺乏竞争力，于是对产品方案做出了调整，取消了用户端的AI能力，从而大幅度降低了用户端的成本。偏重硬件规划的产品经理以此为基础，最终拿出了低成本的硬件规划。


    我在为一些企业提供AI产品咨询时，就遇到过AI产品软硬规划的难题。最初企业和我的思路都是想办法快速培养出全能人才，后来发现这个思路很不现实。最终我设计了联席AI产品经理制度，聘请一位有丰富硬件经验的产品经理和一位有丰富互联网产品经验的产品经理共同担任AI产品的联席产品经理，很快解决了软硬整合AI产品的规划难题。这种制度的实用性也得到了实战的验证。


    ### 9.2 互联网产品经理上手AI产品规划


    本节内容针对互联网产品经理，意在指导互联网产品经理如何向AI产品经理升级。


    #### 9.2.1 从极简AI产品入手


    所谓的极简AI产品，就是只涉及一项AI技术或只触及一个功能模块（通常不是核心模块）的AI产品。


    为什么要从极简AI产品入手？对广大传统产品经理而言，AI技术是一种全新的技术，产品经理、技术人员都还不能驾驭它。所以，在产品中引入AI技术是有很大风险的，实战中就有很多失败的案例。从极简AI产品入手正是为了降低风险，这与互联网创业公司的MVP思想、大公司的产品灰度发布思想的本质是相通的。

    '
  trans: '


    因为 AI 技术对中国平安具有战略价值，所以中国平安不仅是 AI 技术的应用者，还是 AI 技术的创造者。2019 年，平安科技公司凭借自身的 AI 技术实力，在由斯坦福大学发起的机器阅读理解和深度学习推理两项赛事中夺冠。


    对 AI 应用感兴趣的传统企业，应该认真研究中国平安的 AI 应用经验，以从中吸取经验。


    ## 8.2 传统企业做 AI 产品的原因及 AI 产品的分类


    ### 8.2.1 传统企业做 AI 产品的原因


    虽然互联网公司是大规模应用 AI 技术的先驱，但传统企业的 AI 应用也正在兴起。如果留意 AI 产品经理的招聘信息，我们会发现来自传统企业的职位正在逐渐增加。希望获得
    AI 产品经理职位的读者，不妨多关注一下传统企业所提供的机会。


    下面，我们来简单分析一下传统企业做 AI 产品的原因。


    AI 技术的价值逐渐得到了广泛的肯定，其中包括传统企业。传统企业对自己的业务场景非常了解，也逐渐认识到 AI 技术可以满足自己的场景需求。因为 AI 技术并非传统企业的强项，所以传统企业会先寻求外部采购，希望
    AI 技术公司能提供可立刻使用的 AI 产品。即使没有成熟的 AI 产品，传统企业也希望外包给 AI 技术公司来开发。因此，在很长一段时间内，很多 AI 技术公司的主要收入就来自传统企业的外包业务。


    外购 AI 产品、外包 AI 项目满足了传统企业的部分需求，但不能满足其全部需求。一些领先的传统企业对 AI 的理解可能比 AI 技术公司更深，更何况传统企业对自己的业务场景有天然优势。当外购、外包不能满足其需求时，一些实力强的传统企业就开始自己打造
    AI 产品。于是，我们看到一些实力强大的传统企业开始招聘 AI 产品经理和 AI 工程师，以使自身既有 AI 产品规划能力，又有 AI 产品实施能力。


    其实，“传统企业”只是一种习惯说法，具体是指 AI 技术公司、互联网公司以外的企业。传统企业也在演变，并逐渐向 AI 技术公司、互联网公司的领域渗透。以金融业为例，近年来一些大型的金融集团（以中国平安为代表）纷纷成立专门的科技公司，这些科技公司最初只为本集团服务，后来逐渐开始从集团外获得客户。


    ### 8.2.2 传统企业 AI 产品的分类


    传统企业打造的 AI 产品大体可以分为以下两类。


    1. 利用 AI 技术，改造、提升原有的 IT 产品、互联网产品


    华住酒店集团（旗下有汉庭、全季等酒店）就曾招聘高级产品经理（AI 方向）。华住酒店集团的主业是酒店，旗下运营着众多的门店。呼叫中心、门店前台对于酒店运营非常重要，因此公司希望借助
    AI 技术把呼叫中心、门店前台系统做得更好。


    例如，客人通过呼叫中心订房时，酒店需要核实客人的身份。传统方式需要客人报身份证、会员卡等信息。而如果采用声纹识别技术（一种 AI 技术），就可以对客人进行无感身份核实，更快完成预定。如果门店前台能利用好
    AI 技术，就可以为客人提供自助服务，使其更快完成入住和离店手续，避免高峰时段排长队。要在这些场景中用好 AI 技术，就需要专职的 AI 产品经理来进行规划。


    另外，还有不少知名教育机构开始招聘 AI 产品经理。新东方、VIPKID 等教育机构为了支持业务运营，开发运营了很多用户端及后端产品。这些产品原来是传统的
    IT 产品、互联网产品，但教育机构逐渐看到了 AI 技术的价值，招聘了 AI 产品经理来提升这些用户端及后端产品，使其更好地支持教育业务。


    2. 利用 AI 技术打造新产品，但一般仍然服务于原有的业务体系


    例如，泰康保险集团旗下的泰康健康产业投资控股有限公司（简称泰康健投），就曾招聘 AI 硬件产品经理，希望打造出 AI 护理机器人这样的产品。泰康健投的主营业务是医养业务，其主要服务对象是老年人。该公司打造的
    AI 产品仍旧是为老年人服务的，主要应用在公司运营的养老院中。


    比亚迪是一家知名的汽车公司，该公司曾专门招聘 AI 语音生态产品经理，负责 DiLink AI 语音助手的产品规划。比亚迪的主业是汽车产业，DiLink AI
    语音助手也是服务于汽车产业的。


    ## 8.3 在传统企业做 AI 产品


    ### 8.3.1 传统企业对 AI 产品经理的要求


    相比互联网公司和 AI 技术公司，在传统企业做 AI 产品有其特殊性。


    典型的互联网产品经理进入传统企业担任 AI 产品经理，需要满足哪些要求呢？具体可以用下面的等式来概括：


    传统企业的 AI 产品经理=互联网产品经理+AI 技术+垂直行业


    传统企业的 AI 产品经理既要懂 AI 技术又要懂垂直行业，只有这样才能将 AI 技术和垂直行业的具体场景适配起来，打造出能服务好主业的 AI 产品。因此，在传统企业做
    AI 产品，难度是很高的。但因为传统企业体量大、数量多，有可能提供大量的 AI 产品经理职位，所以值得读者特别关注。


    ### 8.3.2 在传统企业做 AI 产品的关键


    1. 深入理解行业场景，实现 AI 技术与行业场景的适配


    理解行业场景是 AI 产品经理在传统企业做 AI 产品的第一步，AI 产品经理只有做到了这一点才能实现 AI 技术与行业场景的适配。


    以平安小贷公司的客服机器人为例。平安小贷的客户需要先在网上提交申请，之后由客服外拨电话进行核实。原来这需要大量的人工客服人员，后来采用了客服机器人。我听了实际录音，应用效果非常好。


    客服机器人问：“请问，您今年多少岁？”


    客户：“……”


    客服机器人：“对不起，我没听清，您能再说一遍吗？”


    客户略有点不耐烦：“30 岁！”


    客服机器人：“喔！好的，30 岁。这次听清了！”


    这既满足了业务需要，又节约了运营成本。同时，这也和贷款核实的场景特征有关——用户高度配合，对话内容非常明确，整个过程也很简短。客服机器人和这样的场景高度适配。


    2. 选择单点切入，从简单的 AI 产品起步


    AI 产品经理在传统企业做 AI 产品，一定要暂时忘记雄心勃勃的“行业解决方案”，先从单点切入，从简单的 AI 产品起步。


    中国平安对 AI 的全面应用是经过一段时间积累的结果，其最初也是从单点切入的。例如，中国平安对 AI 技术的实际应用开始于 2016 年的“6 分钟刷脸放贷”。它只是在放贷业务的用户身份认证这个环节应用了一项成熟的
    AI 技术。这样的单点价值明确、涉及面小、技术实施难度低。从这样的单点切入，AI 产品更容易规划，也更容易实施。单点切入可以让 AI 技术更快发挥作用，让整个组织、整个业务在实际应用中逐渐理解、接纳
    AI 技术和 AI 产品，然后以此为基础逐渐扩展到全场景，使 AI 技术发挥越来越大的作用。


    3. 选择重点场景，做出复杂产品


    传统企业的运营可以细分为很多环节、众多场景，场景不同，其重要性也是不同的。实现了简单场景的切入之后，可以在适当的时机选择重点场景，做出复杂产品，如中国平安的
    AI 车险定损理赔。


    车险是重要的财产保险业务，占据了财产险公司的收入“大头”。其中，车险定损因为直接涉及保险公司的大笔支出，是整个车险业务中的重要场景。传统的车险定损流程包括报案联系、现场勘查、理赔资料整理、定损、审核等冗长的环节，客户体验差、运营成本高、欺诈风险高，一直是保险公司的痛点。


    中国平安旗下的平安科技自主研发了平安脑智能引擎，利用 AI 技术来挖掘车险图像数据信息，实现线上自动定损。其通过智能引擎分析事故现场照片，提供车险查勘与定损、零件配型、车型识别、同车检测等综合服务，直接跳过了多个传统定损环节，提高了定损理赔效率。也就是说，借助
    AI 技术，大多数车险定损不需要定损人员到场，远程通过 AI 就能完成。AI 车险定损的示意图如下所示。


    ![](img/epub_31486679_82)


    AI 车险定损的示意，来自深智科技


    这样的 AI 产品是非常复杂的，规划难、实施更难，但应用场景重要，所以是有价值的。中国平安利用 AI 车险定损理赔，不仅提高了客户的满意度，降低了定损的人工成本，还降低了车险定损理赔领域的欺诈风险，可谓一举三得。


    ## 第 9 章 AI 产品规划的流程和方法


    研究其他产品的根本目的是规划自己的产品。本章我们就来介绍，如何规划自己的 AI 产品。


    ### 9.1 AI 产品规划入门


    #### 9.1.1 基本方法——“抄”出好产品


    对于合格的 AI 产品经理而言，其在进行 AI 产品规划时，其实做不到也不需要原创。说得直白一点，合格的 AI 产品经理做产品规划的基本方法就是“抄”。当然，“抄”也是有层次的。我们要做的是，选对“抄”的对象，从产品经理的专业角度理解被“抄”的产品，然后将学到的知识、技能用在自己的
    AI 产品规划中。


    前面 3 章介绍了 3 种类型公司的 AI 产品，并从多个角度对这些产品进行了解读，实际上是在帮助读者选择“抄”的对象。当我们真正理解了这些产品的背景、定位、功能、流程，理解了其中的门道，我们就可以做出自己的
    AI 产品规划。


    #### 9.1.2 AI 产品详细规划前的自检


    在对一个 AI 产品进行详细规划之前，我们要先进行自检。如果自检通过了，就说明我们想清楚了基本问题，大方向没有错，下一步就可以进行详细的产品规划了。反之，我们要先停下来解决基本问题，先把大方向找对。


    对产品的自检，其实就是回答一些基本而重要的问题，主要包括以下内容。


    1. 产品的目标用户


    （1）产品的目标用户是谁？产品满足了目标用户的什么需求？


    （2）目标用户如果不用我们的产品，有什么替代的解决方案？


    2. AI 产品的价值


    （1）产品的核心功能点是什么？尽量用一句话描述。


    （2）产品中用到了什么 AI 技术？其在产品中发挥了什么作用？给客户带来了什么价值？最后一个问题，要完全从客户的角度来回答。


    3. AI 产品的实现


    （1）产品本身相关的问题。产品的形式是什么？是否涉及专门的硬件？AI 能力在云端、终端如何分布？


    （2）具体 AI 技术相关的问题。产品需要什么样的 AI 技术？如何获得相应的技术？是外购 AI 中间产品、外包开发，还是自主开发？相应的成本是多少？


    （3）AI 产品数据相关的问题。有没有 AI 产品的相关数据？质量、数量如何？如何获取？获取的成本是多少？如何标注？


    4. 其他问题


    其他问题的答案可以逐一解答。例如，产品以什么方式获取收入？预测的收入是多少？


    以上列举的自检问题只是一个参考，AI 产品经理要结合实际的场景和产品特点，拟定相应的自检问题。


    自检相当于在远征之前确定目标、看准方向、确认路径，可以让我们更坚定地踏上远征之路。其价值不言而喻，产品经理要认真做好相关工作。


    #### 9.1.3 软件规划的层次和流程


    纯“软”的 AI 产品不涉及专门的硬件，其规划流程、方法、使用的工具和标准的互联网产品基本一样。这对有互联网产品经验的人而言，是个好消息。互联网公司产品规划的分层和流程如下图所示。


    ![](img/epub_31486679_83)


    互联网公司产品规划的分层和流程


    如图所示，互联网公司的产品规划可以分为两个大层次：产品整体规划和产品版本规划，两个层次内部还可以再进行细分。现有产品的规划是在产品整体规划的指导下进行每个版本的规划的。每次版本迭代尤其是较大版本的迭代，都要先回到源头梳理产品整体规划，然后再进行新版本的规划。所谓产品迭代，不仅是指一个个版本的迭代，还隐含了产品整体规划的迭代。


    互联网公司的 AI 产品基本仍然按互联网产品的流程来规划，通常沿用互联网产品使用的原型工具和产品需求文档。只要是合格的互联网产品经理，只要其找准了 AI 应用的微场景，基本上都能做好
    AI 产品的规划。


    由于本书读者多数对互联网产品规划流程比较熟悉，这里就不再对产品规划的流程过多展开了。没有互联网产品规划经验的读者，可以参考我关于互联网产品经理的书《首席产品官
    1——从新手到行家》《首席产品官 2——从白领到金领》。


    #### 9.1.4 硬件规划流程


    大多数互联网产品经理缺乏硬件经验。关于硬件，广大互联网产品经理首先要确立两个观点：硬件的规划很难；硬件的规划与软件的规划大不相同。


    硬件的规划流程可以分为以下几步。


    （1）进行需求和市场分析。所有产品都是因需求和市场而生，所以在起步阶段一定要进行需求和市场分析。如果这一步出现问题，那么产品规划从根本上就错了。另外，仅有需求分析是不够的，市场分析可能更重要。例如，如果仅仅考虑需求，我们会发现人们对人脸抓拍机的需求很大，一方面新客户直接使用人脸抓拍机，另一方面一些老客户逐渐用人脸抓拍机更换了传统的监控摄像机。虽然公司有能力研发制造出人脸抓拍机，但如果考虑市场我们就要谨慎了。因为已经有好几家安防巨头推出了自己的人脸抓拍机，这些公司有供应链、品牌、客户及渠道优势，而自己的公司却没有这种优势。显然，推出人脸抓拍机不是一个正确的决策。


    （2）整体方案设计。有了基本方向，下一步就要进行整体方案设计，包括系统整体设计、关键元器件选型等多方面的内容。整体方案设计非常关键，因此需要经过多部门综合评审，设计、采购、工艺制造等部门都要从各自的角度出发参与评审。产品经理要带着评审中发现的问题，对整体方案进行修改，直到最终评审通过。


    （3）硬件设计、工业设计。这一步是将整体方案细化为具体的设计，要画很多图纸。目前，工业设计越来越重要，其已经从硬件设计中独立出来成为一个专业工种。大公司往往有自己的工业设计部门，中小型公司如果想做好工业设计通常就需要通过外包解决。同样，硬件设计、工业设计也需要经过多部门评审。这些评审看似占用了时间、耽误了进度，但实践证明这是不可缺少的。


    （4）制作样板。用真实的设备、物料、工艺流程来实施设计方案，制造出少量的产品。


    （5）测试、改进。对制作出来的样板进行测试，并针对问题进行改进。这些改进可能涉及工艺等多方面。


    （6）定型、批量生产。


    以上流程是比较简单概括的流程，在此基础上还可以继续细分，在此不再详细介绍。


    #### 9.1.5 产品软硬规划工作的组织形式


    要规划涉及硬件的 AI 产品，产品规划工作的基本组织形式有两种：软硬兼管的全能 AI 产品经理制度、软硬分工的联席 AI 产品经理制度。


    软硬兼管的全能 AI 产品经理制度就是由一个全能型产品经理同时完成产品的软硬两方面的规划工作。但符合这样条件的产品经理极少，术业有专攻，能精通软件、硬件一个领域的人才已经很难得了，两者都非常精通还能将其融合的人就更少了。我在实战中见过两者都懂的人，但没有见过两者都精通的人。规划硬件时往往要考虑很多规划软件时不需要考虑的因素，如可制造性、物料和制造成本、可靠性、可维护性，还要考虑法律法规要求。如果没有足够的理论知识和实战经验，一旦一个环节出错就可能导致严重的问题。能勉强做到的人，必然有所侧重。要么可能更擅长软件方面，硬件比较勉强；要么擅长硬件方面，但软件方面比较弱。这样勉强做出来的产品的竞争力通常不会太强，在激烈的同类产品竞争中往往很难“生存”下来。


    联席 AI 产品经理制度就是由两个产品经理来担任一个 AI 产品的联席产品经理，两人在全程紧密协作的基础上，各自分担产品软件、硬件两方面的规划工作。这种制度充分考虑了现实中的人才结构和人员稀缺程度，更加实用。


    一个产品的软硬因素是整合的而不是分离的。在起步阶段，大多数软硬一体的 AI 产品有很多方面的软硬分工界限并不清晰，需要两个产品经理一起来考虑。通常是两个产品经理先讨论一个初步方案，然后两边分别进行到一定程度再沟通，最后协作进行调整。


    例如，一个公司要规划老年人专用的智能音箱，这是一个典型的软硬整合的 AI 产品。为了做好这个产品的规划，公司采用了联席 AI 产品经理制度。刚开始两位产品经理考虑采用“云
    AI+端 AI”的方式，让用户端设备也具有较强的 AI 能力，这样可以提供更好的用户体验。以此为基础，偏重硬件规划的产品经理经过规划和测算，发现这样的用户端设备成本超过
    800 元。两位产品经理判断这样高成本的产品在当前的市场环境下会缺乏竞争力，于是对产品方案做出了调整，取消了用户端的 AI 能力，从而大幅度降低了用户端的成本。偏重硬件规划的产品经理以此为基础，最终拿出了低成本的硬件规划。


    我在为一些企业提供 AI 产品咨询时，就遇到过 AI 产品软硬规划的难题。最初企业和我的思路都是想办法快速培养出全能人才，后来发现这个思路很不现实。最终我设计了联席
    AI 产品经理制度，聘请一位有丰富硬件经验的产品经理和一位有丰富互联网产品经验的产品经理共同担任 AI 产品的联席产品经理，很快解决了软硬整合 AI 产品的规划难题。这种制度的实用性也得到了实战的验证。


    ### 9.2 互联网产品经理上手 AI 产品规划


    本节内容针对互联网产品经理，意在指导互联网产品经理如何向 AI 产品经理升级。


    #### 9.2.1 从极简 AI 产品入手


    所谓的极简 AI 产品，就是只涉及一项 AI 技术或只触及一个功能模块（通常不是核心模块）的 AI 产品。


    为什么要从极简 AI 产品入手？对广大传统产品经理而言，AI 技术是一种全新的技术，产品经理、技术人员都还不能驾驭它。所以，在产品中引入 AI 技术是有很大风险的，实战中就有很多失败的案例。从极简
    AI 产品入手正是为了降低风险，这与互联网创业公司的 MVP 思想、大公司的产品灰度发布思想的本质是相通的。


