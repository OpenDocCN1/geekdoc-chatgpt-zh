    \n#### 13.1.4 商业模式优先于产品\n\n零售行业一直是人工智能的重点进入行业，除了无人零售店，AI售货机也是一个热点。与传统的自动售货机不同，AI售货机采用了先进的AI技术，主要是通过外部的摄像头进行人脸识别，通过售货机内部的摄像头进行商品识别，还有可能结合重力感应等其他技术。AI售货机外观及特写如下图所示。\n\
