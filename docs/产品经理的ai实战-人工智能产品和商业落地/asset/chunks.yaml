    # 第8章 传统企业的AI产品


    ## 8.1 传统企业应用AI的整体情况（以金融业为例）


    ### 8.1.1 金融业应用AI的整体情况


    金融业是应用新技术较为领先的行业，从最早的“IT+金融”“互联网+金融”进入了“AI+金融”阶段。目前，财富500强企业中的金融机构近90%已开始应用AI技术，这些机构对AI技术的应用自2014年开始稳步增长。以我国重要的金融机构——银行为例，其对AI技术日益重视。截至2019年5月，我国国内已有兴业银行、平安银行、招商银行、光大银行、建设银行、民生银行、工商银行共7家银行成立了金融科技子公司。其中，AI技术最初多应用于欺诈识别、投资信息分析等少数领域，随后应用范围逐渐扩大，基本渗透到金融业的各个领域。银行、保险机构对AI技术的应用概况具体如下表所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_80)


    银行、保险机构对AI的应用概况，来自机器之心报告《被AI占领的金融业》


    从上表可以看出，AI技术已经渗透到金融业的核心领域，并且发挥着重要作用。继互联网行业之后，金融成为又一个大规模、深入应用AI技术的行业。现代金融业的AI成分越来越重，AI应用能力逐渐成为金融业的核心能力之一。


    除了各金融业务类型专属的AI应用，还有一类属于通用AI应用，也就是在各金融业务类型中基本相同的场景下的应用，如智能客服、流程自动化平台等。这些应用可以在不降低客户满意度的情况下，显著降低人力成本。


    ### 8.1.2 中国平安对AI的规模化应用


    在金融行业中，已经有一些机构在AI应用方面取得了显著成效，如中国平安保险（集团）股份有限公司（以下简称“中国平安”）。下图是中国平安近年在AI领域的进展摘要。


