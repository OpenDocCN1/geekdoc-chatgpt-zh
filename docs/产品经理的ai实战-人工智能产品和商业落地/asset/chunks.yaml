    ## 第 1 章 技术商业的特点和成功要素


    “你能看到多远的过去，就能看到多远的未来。”我非常认同丘吉尔的这句话。人类的智慧来自过往，用于将来。


    世界每天都有新事物、新技术产生，身处其中我们会不由地感叹“太阳每天都是新的”，但只要我们站得更高一点儿，又会觉得“太阳底下无新事”。所以，我们要先跳出 AI
    的圈子，站在技术商业这个更高的位置，研究更高层次的规律，然后在更高的层次上对 AI 形成更深的认知。


