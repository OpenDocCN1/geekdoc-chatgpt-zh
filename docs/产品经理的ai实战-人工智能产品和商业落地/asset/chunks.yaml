    ### 10.2 应届生快速成为AI产品经理

    应届生成为AI产品经理有直线和曲线两种方式。直线方式就是直接成为AI产品经理；曲线方式就是先成为互联网产品经理，然后升级为AI产品经理。


    无论是直线方式还是曲线方式，应届生的入职职位通常都达不到产品经理的层级，其入职职位通常是产品助理、产品专员、助理产品经理等初级职位。但这不是问题，先获得初级职位然后经过2~3年的努力，就有可能成为真正的独当一面的产品经理。


    #### 10.2.1 直接进入AI技术公司

    1. 计算机专业的应届生进入AI技术公司

    计算机专业的应届生适合进入AI技术公司，从事技术背景较强的产品工作。例如，某科技公司发布过一个校招职位——技术产品经理，招聘数量是若干，任职资格包括：

    （1）计算机或相关专业本科及以上学历，有扎实的技术基础；

    （2）有出色的学习能力，对人工智能有强烈的兴趣，具有计算机视觉、机器学习相关的学习、科研经验者优先；

    （3）熟练掌握计算机系统结构、操作系统原理、网络原理等基础知识；

    （4）逻辑感出色，能快速梳理产品流程。


    这类产品经理从事的工作明显偏技术，计算机专业的应届生可以将这类职位作为重点来争取。非计算机专业的应届生，对这类职位则不必强求。


    2. 非计算机专业的应届生进入AI技术公司

    即使是非计算机专业的应届生，也有机会进入AI技术公司成为AI产品经理。具体包括两种途径：先做产品实习生；直接应聘正式产品职位。从实际情况看，对非计算机专业的应届生而言，产品实习生的机会更多一些。


    以某医疗公司为例，该公司就曾招聘产品实习生，招聘对象明确为应届生，没有强制要求计算机专业背景，只是要求：计算机相关或用户体验相关专业优先。


    某科技公司招聘的AI产品实习生，不强调专业背景而是要求：熟练运用SQL、Excel进行数据处理，会Python者加分；具有较强的逻辑思维、数据分析与快速学习能力；具备产品思维，有良好的沟通表达能力、项目推进能力和文字功底。


    以上条件即使不是计算机专业的应届生也完全可以具备。


    产品实习生离正式产品职位还有一些距离，但毕竟有较大机会。应届生如果能争取到实习机会，在实习期间好好学习、好好表现，则是有机会获得正式产品职位的。


    对AI技术公司而言，非计算机专业的应届生处于“两不靠”的尴尬局面——既不像计算机专业的应届生一样有系统的技术背景，又不像产品经理一样有产品管理经验。所以，AI技术公司提供给非计算机专业应届生的正式产品职位很少。正因为很少，非计算机专业的应届生一旦遇到这样的机会，就更要尽力争取。


    #### 10.2.2 先进入互联网公司成为互联网产品经理

    如果应届生无法直接进入AI技术公司，可以先进入互联网公司从事互联网产品工作。


    互联网行业在中国已经有20多年的历史，公司数量及需要的产品经理职位数都比AI行业多。互联网公司是应用AI技术的先驱，越来越多的互联网产品正在AI化。互联网产品经理逐渐有机会在互联网产品中融入AI技术，同时使自己逐渐升级为AI产品经理。有了这样的能力，其既可以继续留在互联网公司做互联网产品经理，又可以跳槽到AI技术公司或传统企业做AI产品经理。


    对非计算机专业的应届生而言，这可能是一条更宽的路。


