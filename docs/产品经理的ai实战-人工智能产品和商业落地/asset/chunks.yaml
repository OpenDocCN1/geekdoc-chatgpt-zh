    # 第 8 章 传统企业的 AI 产品


    ## 8.1 传统企业应用 AI 的整体情况（以金融业为例）


    ### 8.1.1 金融业应用 AI 的整体情况


    金融业是应用新技术较为领先的行业，从最早的“IT+金融”“互联网+金融”进入了“AI+金融”阶段。目前，财富 500 强企业中的金融机构近 90%已开始应用
    AI 技术，这些机构对 AI 技术的应用自 2014 年开始稳步增长。以我国重要的金融机构——银行为例，其对 AI 技术日益重视。截至 2019 年 5 月，我国国内已有兴业银行、平安银行、招商银行、光大银行、建设银行、民生银行、工商银行共
    7 家银行成立了金融科技子公司。其中，AI 技术最初多应用于欺诈识别、投资信息分析等少数领域，随后应用范围逐渐扩大，基本渗透到金融业的各个领域。银行、保险机构对
    AI 技术的应用概况具体如下表所示。


    ![](img/epub_31486679_80)


    银行、保险机构对 AI 的应用概况，来自机器之心报告《被 AI 占领的金融业》


    从上表可以看出，AI 技术已经渗透到金融业的核心领域，并且发挥着重要作用。继互联网行业之后，金融成为又一个大规模、深入应用 AI 技术的行业。现代金融业的
    AI 成分越来越重，AI 应用能力逐渐成为金融业的核心能力之一。


    除了各金融业务类型专属的 AI 应用，还有一类属于通用 AI 应用，也就是在各金融业务类型中基本相同的场景下的应用，如智能客服、流程自动化平台等。这些应用可以在不降低客户满意度的情况下，显著降低人力成本。


    ### 8.1.2 中国平安对 AI 的规模化应用


    在金融行业中，已经有一些机构在 AI 应用方面取得了显著成效，如中国平安保险（集团）股份有限公司（以下简称“中国平安”）。下图是中国平安近年在 AI 领域的进展摘要。


    ![](img/epub_31486679_81)


    中国平安近年在 AI 领域的进展摘要，来自平安科技官网


    这些 AI 应用能力不仅服务于中国平安的成员企业，还通过平安科技公司（平安集团旗下的全资子公司）向外部金融机构甚至非金融机构输出，发展出新的业务。中国平安从互联网技术开始，探索的一整套充分利用技术扩展业务的组织能力再次在
    AI 应用上体现了出来。中国平安已经进化为一家技术成分很重的公司，公司 Logo 中的文字也从“保险　银行　投资”升级为“金融　科技”。这不仅值得金融机构学习，还值得所有的传统企业学习。


