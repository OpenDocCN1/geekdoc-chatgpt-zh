    \  | ID：EPUB\\_20260428160408 \n\n### 9.1 AI产品规划入门\n\n#### 9.1.1 基本方法——“抄”出好产品\n\
    \n对于合格的AI产品经理而言，其在进行AI产品规划时，其实做不到也不需要原创。说得直白一点，合格的AI产品经理做产品规划的基本方法就是“抄”。当然，“抄”也是有层次的。我们要做的是，选对“抄”的对象，从产品经理的专业角度理解被“抄”的产品，然后将学到的知识、技能用在自己的AI产品规划中。\n\
    \n前面3章介绍了3种类型公司的AI产品，并从多个角度对这些产品进行了解读，实际上是在帮助读者选择“抄”的对象。当我们真正理解了这些产品的背景、定位、功能、流程，理解了其中的门道，我们就可以做出自己的AI产品规划。\n\
    \n#### 9.1.2 AI产品详细规划前的自检\n\n在对一个AI产品进行详细规划之前，我们要先进行自检。如果自检通过了，就说明我们想清楚了基本问题，大方向没有错，下一步就可以进行详细的产品规划了。反之，我们要先停下来解决基本问题，先把大方向找对。\n\
    \n对产品的自检，其实就是回答一些基本而重要的问题，主要包括以下内容。\n\n1\\. 产品的目标用户\n\n（1）产品的目标用户是谁？产品满足了目标用户的什么需求？\n\
    \n（2）目标用户如果不用我们的产品，有什么替代的解决方案？\n\n2\\. AI产品的价值\n\n（1）产品的核心功能点是什么？尽量用一句话描述。\n\n\
    （2）产品中用到了什么AI技术？其在产品中发挥了什么作用？给客户带来了什么价值？最后一个问题，要完全从客户的角度来回答。\n\n3\\. AI产品的实现\n\
    \n（1）产品本身相关的问题。产品的形式是什么？是否涉及专门的硬件？AI能力在云端、终端如何分布？\n\n（2）具体AI技术相关的问题。产[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)品需要什么样的AI技术？如何获得相应的技术？是外购AI中间产品、外包开发，还是自主开发？相应的成本是多少？\n\
    \n（3）AI产品数据相关的问题。有没有AI产品的相关数据？质量、数量如何？如何获取？获取的成本是多少？如何标注？\n\n4\\. 其他问题\n\n其他问题的答案可以逐一解答。例如，产品以什么方式获取收入？预测的收入是多少？\n\
    \n以上列举的自检问题只是一个参考，AI产品经理要结合实际的场景和产品特点，拟定相应的自检问题。\n\n自检相当于在远征之前确定目标、看准方向、确认路径，可以让我们更坚定地踏上远征之路。其价值不言而喻，产品经理要认真做好相关工作。\n\
    \n#### 9.1.3 软件规划的层次和流程\n\n纯“软”的AI产品不涉及专门的硬件，其规划流程、方法、使用的工具和标准的互联网产品基本一样。这对有互联网产品经验的人而言，是个好消息。互联网公司产品规划的分层和流程如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_83)\n\n互联网公司产品规划的分层和流程\n\
    \n如图所示，互联网公司的产品规划可以分为两个大层次：产品整体规划和产品版本规划，两个层次内部还可以再进行细分。现有产品的规划是在产品整体规划的指导下进行每个版本的规划的。每次版本迭代尤其是较大版本的迭代，都要先回到源头梳理产品整体规划，然后再进行新版本的规划。所谓产品迭代，不仅是指一个个版本的迭代，还隐含了产品整体规划的迭代。\n\
    \n互联网公司的AI产品基本仍然按互联网产品的流程来规划，通常沿用互联网产品使用的原型工具和产品需求文档。只要是合格的互联网产品经理，只要其找准了AI应用的微场景，基本上都能做好AI产品的规划。\n\
    \n由于本书读者多数对互联网产品规划流程比较熟悉，这里就不再对产品规划的流程过多展开了。没有互联网产品规划经验的读者，可以参考我关于互联网产品经理的书《首席产品官1——从新手到行家》《首席产品官2——从白领到金领》。\n\
    \n#### 9.1.4 硬件规划流程\n\n大多数互联网产品经理缺乏硬件经验。关于硬件，广大互联网产品经理首先要确立两个观点：硬件的规划很难；硬件的规[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)划与软件的规划大不相同。\n\
    \n硬件的规划流程可以分为以下几步。\n\n（1）进行需求和市场分析。所有产品都是因需求和市场而生，所以在起步阶段一定要进行需求和市场分析。如果这一步出现问题，那么产品规划从根本上就错了。另外，仅有需求分析是不够的，市场分析可能更重要。例如，如果仅仅考虑需求，我们会发现人们对人脸抓拍机的需求很大，一方面新客户直接使用人脸抓拍机，另一方面一些老客户逐渐用人脸抓拍机更换了传统的监控摄像机。虽然公司有能力研发制造出人脸抓拍机，但如果考虑市场我们就要谨慎了。因为已经有好几家安防巨头推出了自己的人脸抓拍机，这些公司有供应链、品牌、客户及渠道优势，而自己的公司却没有这种优势。显然，推出人脸抓拍机不是一个正确的决策。\n\
    \n（2）整体方案设计。有了基本方向，下一步就要进行整体方案设计，包括系统整体设计、关键元器件选型等多方面的内容。整体方案设计非常关键，因此需要经过多部门综合评审，设计、采购、工艺制造等部门都要从各自的角度出发参与评审。产品经理要带着评审中发现的问题，对整体方案进行修改，直到最终评审通过。\n\
    \n（3）硬件设计、工业设计。这一步是将整体方案细化为具体的设计，要画很多图纸。目前，工业设计越来越重要，其已经从硬件设计中独立出来成为一个专业工种。大公司往往有自己的工业设计部门，中小型公司如果想做好工业设计通常就需要通过外包解决。同样，硬件设计、工业设计也需要经过多部门评审。这些评审看似占用了时间、耽误了进度，但实践证明这是不可缺少的。\n\
    \n（4）制作样板。用真实的设备、物料、工艺流程来实施设计方案，制造出少量的产品。\n\n（5）测试、改进。对制作出来的样板进行测试，并针对问题进行改进。这些改进可能涉及工艺等多方面。\n\
    \n（6）定型、批量生产。\n\n以上流程是比较简单概括的流程，在此基础上还可以继续细分，在此不再详细介绍。\n\n#### 9.1.5 产品软硬规划工作的组织形式\n\
    \n要规划涉及硬件的AI产品，产品规划工作的基本组织形式有两种：软硬兼管的全能AI产品经理制度、软硬分工的联席AI产品经理制度。\n\n软硬兼管的全能AI产品经理制度就是由一个全能型产品经理同时完成产品的软硬两方面的规划工作。但符合这样条件的产品经理极少，术业有专攻，能精通软件、硬件一个领域的人才已经很难得了，两者都非常精通还能将其融合的人就更少了。我在实战中见过两者都懂的人，但没有见过两者都精通的人。规划硬件时往往要考虑很多规划软件时不需要考虑的因素，如可制造性、物料和制造成本、可靠性、可维护性，还要考虑法律法规要求。如果没有足够的理论知识和实战经验，一旦一个环节出错就可能导致严重的问题。能[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)勉强做到的人，必然有所侧重。要么可能更擅长软件方面，硬件比较勉强；要么擅长硬件方面，但软件方面比较弱。这样勉强做出来的产品的竞争力通常不会太强，在激烈的同类产品竞争中往往很难“生存”下来。\n\
    \n联席AI产品经理制度就是由两个产品经理来担任一个AI产品的联席产品经理，两人在全程紧密协作的基础上，各自分担产品软件、硬件两方面的规划工作。这种制度充分考虑了现实中的人才结构和人员稀缺程度，更加实用。\n\
    \n一个产品的软硬因素是整合的而不是分离的。在起步阶段，大多数软硬一体的AI产品有很多方面的软硬分工界限并不清晰，需要两个产品经理一起来考虑。通常是两个产品经理先讨论一个初步方案，然后两边分别进行到一定程度再沟通，最后协作进行调整。\n\
    \n例如，一个公司要规划老年人专用的智能音箱，这是一个典型的软硬整合的AI产品。为了做好这个产品的规划，公司采用了联席AI产品经理制度。刚开始两位产品经理考虑采用“云AI+端AI”的方式，让用户端设备也具有较强的AI能力，这样可以提供更好的用户体验。以此为基础，偏重硬件规划的产品经理经过规划和测算，发现这样的用户端设备成本超过800元。两位产品经理判断这样高成本的产品在当前的市场环境下会缺乏竞争力，于是对产品方案做出了调整，取消了用户端的AI能力，从而大幅度降低了用户端的成本。偏重硬件规划的产品经理以此为基础，最终拿出了低成本的硬件规划。\n\
    \n我在为一些企业提供AI产品咨询时，就遇到过AI产品软硬规划的难题。最初企业和我的思路都是想办法快速培养出全能人才，后来发现这个思路很不现实。最终我设计了联席AI产品经理制度，聘请一位有丰富硬件经验的产品经理和一位有丰富互联网产品经验的产品经理共同担任AI产品的联席产品经理，很快解决了软硬整合AI产品的规划难题。这种制度的实用性也得到了实战的验证。\n\
