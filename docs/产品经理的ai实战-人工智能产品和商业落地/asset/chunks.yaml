- raw: "这是一个非常切合用户需求的产品，不同级别对应不同的应用场景。尽管平安科技推出身份认证产品的时间较晚，但依然获得了不少金融客户。除平安集团旗下的陆金所、平安证券以外，泰国汇商银行、南非Discovery旗下银行等都是其产品客户。\n\
    \n再看平安科技的另一个中间产品——声纹核身。相比人脸识别技术，声纹识别技术使用较少，但这个AI技术却有非常适配的场景——电话语音场景。目前，电话语音依然是金融机构重要的服务通道，在电话语音中无法进行人脸识别，但很适合进行声纹识别。在电话语音场景中，传统核身与声纹核身的对比如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_73)\n\n电话语音场景中的传统核身与声纹核身的对比，来自平安金科\n\
    \n在电话语音中，核实用户身份是一个很烦琐的过程，信用卡用户在拨打信用卡服务热线时都有过类似体验。用户不仅需要用注册手机号拨打，输入卡号、查询密码，有时还要回答客服人员提出的额外问题。而且，每次拨打服务电话，都要重复这个烦琐的过程。在这个场景中使用声纹识别技术，只需要注册声纹一次，以后就可以通过声音完成身份认证，过程简单，明显改善了用户体验，也减少了占线时间，节约了金融机构的运营成本。\n\
    \nAI技术公司中间产品的技术实现需要靠技术人员，但产品规划要靠产品经理。虽然中间产品是明显偏AI技术的，但只要是产品就涉及用户、场景、需求，而这正是产品经理发挥作用的地方。\n\
    \n#### 7.2.3 中间产品的文档\n\n中间产品是供中间用户使用的，为了方便中间用户，其需要为用户提供文档。中间产品的文档大体可以分为两类：技术文档与产品文档。\n\
    \n技术文档以API（应用程序接口）文档为典型代表。这类文档通常由AI技术公司的技术人员撰写，供中间用户的技术人员阅读。这类文档包含了使用API所需的所有信息，详细介绍了函数、类、返回类型及参数等。为了便于用户理解，一般都配有示例教程。\n\
    \n产品文档就是从产品角度表述的文档，其目的是引导中间用户的产品经理理解这个中间产品。AI技术公司的产品经理应该重视产品文档，这种文档可以起到推广公司产品、获得客户的作用。产品文档应该从场景出发，列出多个使用该中间产品的最终用户产品的例子，让潜在用户的产品经理充分理解产品特征，知道应如何将其与自己的产品相结合。如果能用PPT等演示文档格式来展示产品文档，而不是用常规的PDF格式，效果可能会更好。\n\
