    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ass=\"content\">向三甲医院收费是之前大多数医疗AI技术公司存在的问题。三甲医院长期处于优势地位，很难接受新的付费项目。医疗AI技术公司设计商业模式，应将三甲医院真正变成商业上的合作伙伴。这种关系一旦形成，就会产生较强的排他性。而且这种模式真正利用了三甲医院的优势地位，高成本培养，低成本复用，使三甲医院的医生不再有抵触情绪。\n\
