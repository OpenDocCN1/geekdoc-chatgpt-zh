    高级 AI 产品经理应该跳出 AI 的圈子，毕竟 AI 技术只是产品的构成要素之一，而不是全部。高级 AI 产品经理要用好 AI 能力，发挥 AI 价值，而不是被
    AI 束缚。


    2. 医疗影像跳出 AI 圈子的例子

    AI 是我们的视角和出发点，但如果始终不改变视角，它就会成为一种限制。例如，医疗影像领域的 AI 应用多数将自己局限在 AI 本身。很多公司都推出了 AI
    医疗影像辅助诊断产品，结果产生一个问题：同质化严重，众多公司的产品针对同一个病种的系统差别很小。


    除了打造更好的 AI 医疗影像辅助诊断产品，高级 AI 产品经理可以跳出 AI 的圈子，看到更大的场景，站在更高的层次去规划产品。


    目前，我国的医院影像正在从实体胶片向数字化过渡。规模较大的医院处于领先地位，普遍已经有医疗影像系统。医疗影像系统属于医疗信息化范畴，并不属于 AI 范畴。但如果我们跳出
    AI 的圈子，把医疗影像信息化也纳入视野，思路可能就打开了。按这个思路，如果一家 AI 技术公司要进入医疗影像市场，除了前面提到的常规方式，还可以这样做。


    对已经建立了医疗影像系统的医院，AI 技术公司可以将自己的 AI 能力集成到医疗影像系统中，使 AI 技术无缝嵌入已有的医疗影像系统中。要做到这一点，不仅涉及
    AI 技术，还涉及不同系统的连通、集成，甚至涉及特殊的硬件，与做一个单独的 AI 辅助诊断产品相比难度更大。但一旦做到了，就拥有了比较稳固的地位，不会被轻易替代。


    对正在向数字化过渡的医院，更好的方式是为医院提供影像云服务。AI 技术公司通过多种云手段满足医院的成本、隐私需求，只是这个云服务直接整合了 AI 能力。医院使用影像云服务，也就实现了
    AI 落地应用。这当然比单纯的 AI 系统难度更大，但壁垒也会更高，可能也是更好的方法。


    跳出 AI 的圈子来做 AI 产品，体现了高级 AI 产品经理的能力和价值。


