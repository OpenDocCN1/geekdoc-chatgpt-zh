    因为AI技术对中国平安具有战略价值，所以中国平安不仅是AI技术的应用者，还是AI技术的创造者。2019年，平安科技公司凭借自身的AI技术实力，在由斯坦福大学发起的机器阅读理解和深度学习推理两项赛事中夺冠。


