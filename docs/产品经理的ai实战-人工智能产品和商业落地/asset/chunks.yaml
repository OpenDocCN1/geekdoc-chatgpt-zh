- raw: "作为用户，我很讨厌广告。但不得不承认，广告支撑了互联网行业的半壁江山。如果处理得当，是可以做到双赢的。以Google为例，上亿的用户在Google上搜索自己需要的内容，并快速获得自己需要的内容——一个网站、一篇论文、一张图片、一个视频……这一切都是免费的，好像非常自然。但为了能做到这一点，Google公司要在全世界建立很多的数据中心，购置大量的服务器，还要雇用大量的员工持续不断地改进产品。这都需要巨额的花费，而这些花费的主要来源就是广告。想进行推广的企业客户向Google付费，使Google能完全支付巨额的花费，从而使用户能持续地免费获得服务。Google将平衡工作做得非常好，它把自然搜索结果和广告分区域展示，而且将自然搜索结果放在更优先的位置。作为用户，如果你不想看到广告，你完全可以忽略广告区域。Google让这种低打扰成为现实。\n\
    \n同理，我国现在主流的智能音箱越来越便宜[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)、质量也越来越好，用户一次性支付的费用是不可能让公司盈利的。因此，广告显然是智能音箱供应商必须要考虑的内容。参照Google的商业模式，智能音箱的广告又有了全新的场景，需要创新商业模式。我的思路是低打扰的广告赞助模式。\n\
    \n用户经常通过智能音箱点播音频内容。现在，版权环境越来越好，用户已经逐渐能够接受为优质内容付费。例如，我说“播放王力宏的《龙的传人》”，如果其在合作音乐源是免费内容，智能音箱就可以直接播放。如果我说“播放王力宏的《XXXX的事》”，这首歌在音乐源是受限的内容，需要单独购买或者开通会员。这时就可以启动语音赞助广告，如“XXX酸奶为您播放付费内容——王力宏的《XXXX的事》”，然后直接播放。这就是一种低打扰的广告赞助模式。在这种广告模式中，XXX酸奶企业是需要为其广告付费的。\n\
    \n这种模式类似搜索引擎的赞助广告，不占用太长时间，只是品牌露出，最多有一句一两秒的广告。用户也比较容易接受这种模式，这样点播的内容就不需要自己付费了。\n\
    \n例如，“播放郭德纲的相声”，无广告；“播放郭德纲最新的相声段子”，这种场景就可能需要使用赞助广告。\n\n在当前的互联网版权环境中，使用这种广告模式的时机已经成熟。这种广告支持的免费模式是天然适合海量用户的模式。智能音箱的保有量越来越多，已经具备了这个基础。\n\
    \n和互联网界面的广告一样，智能音箱也可以结合用户标签进行精准广告推送。这样可以在同样的播放次数中，提升广告的总价值。\n\n#### 13.4.3 智能音箱的创新商业模式设计——电商\n\
    \n智能音箱的电商模式也是一个全新的挑战，它适用的商品一定大大少于电商。我们无法想象通过语音购买一件衣服。例如，“我要一件POLO衫”，然后智能音箱给我列出7个品牌的各种款式供我选择。\n\
    \n但很多商品是适合用智能音箱来购买的，尤其是重复购买的商品——你已经对商品有了充分的了解。正如拼多多上的商品比天猫的商品要少很多，但它依然是一个快速发展的大公司，原因是它开拓了新场景、新用户。例如，一位家庭主妇可以在收拾房间时，一边收拾一边发现需要购买的东西，同时把购物需求告诉智能音箱：\n\
    \n“买两瓶蓝月亮洗手液，买一大包湿厕纸，再来一瓶衣领净。”\n\n智能音箱将直接下单并且完成支付。如果没有智能音箱，家庭主妇要用心记住需要买的东西，收拾完之后再打开手机或电脑去下单，这时可能有些东西已经忘记了，需要重新回忆再[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)去购买。\n\
    \n除了经常购买的商品，容易描述的服务类商品也适合用智能音箱来购买。例如，“后天在深圳有活动，给我订票”。\n\n智能音箱会给出几个选项，“今天晚上8点，XX航班，到了酒店直接睡觉”或者“明天下午3点，XXX航班，晚上可以先放松一下”。\n\
    \n然后你就可以选择订票了。这样，智能音箱可能会成为较重要的机票销售渠道。如果说在互联网环境中，航空公司还可以通过官网、App直销方式掌控一部分用户，那么在智能语音环境中，航空公司可能会沦为一个标品。当然，智能语音市场的门槛比互联网高得多。如果航空公司要推出自己的智能音箱，可以先不考虑成本问题，但要先考虑用户的接受程度。用户可以接受在手机中多安装一个App，但可能并不乐意在家里多放一个音箱。\n\
    \n#### 13.4.4 智能音箱的创新商业模式设计——优质内容付费\n\n“凯叔讲故事”抓住了父母讲睡前故事这个场景，通过专门打造的优质付费内容来满足场景需求，挖掘出了新的商业价值。\n\
    \n同理，智能音箱完全可以借鉴这种模式，如推出“爸爸讲故事”。由专业人员创作故事内容，将每个爸爸的声音采样，用爸爸的音色、习惯用语将故事讲给孩子们听。\n\n\
    但是，最好不要在睡前故事中给孩子们播放广告，可以采取直接收费的方式。996工作制的爸爸和在外出差的爸爸应该会乐意购买这种服务。\n\n\\[https://t.me/+WwC4dCWvXRdhOTNh\\\
