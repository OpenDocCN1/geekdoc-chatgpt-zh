    国内也存在这样的情况。有些所谓的服务机器人背后其实是真人在与用户对话，只是加了变声效果让声音听上去像机器人。


    3\. 没有找准应用场景，尤其是切入场景


    在 AI 应用中，行业应用是一个高频词。而从实操的角度看，行业这个粒度太大了，难以操作。AI 技术公司应该在行业内部进一步细分场景，先从适合的细分场景入手，再扩展到大场景。只有这样一个个场景做下来，才有可能逐渐覆盖一个行业。


    道理其实很简单，但头脑一热就很容易忘记。很多 AI 技术公司往往起步就想做行业整体解决方案，就想用 AI 取代某个岗位，颠覆某一行业。这种思想从一开始就是错误的，当然要碰壁。


    AI 技术公司普遍有锤子心态——因为自己有某项技术，从自己的角度看，发现几乎所有的行业、所有的客户都需要自己的技术，然后真的拿着技术的锤子，向众多的行业砸了过去。但是，由于其力量分散，导致砸得不深，也没有取得好的成绩。其实，锤子心态不见得就是错的。如果手中真的只有锤子，那就选一两个钉子为重点，砸深、砸透，真正砸出价值和经验，然后再将这个经验应用到其他的钉子身上。AI
    技术在互联网公司以外的行业应用之路刚刚开始，但 AI 技术公司可能是深受互联网公司“圈地”做法的影响，总想占领更多的行业、场景和客户。


    锤子心态还体现在宣传上，很多 AI 技术公司的技术仅仅在某个领域进行了尝试，就开始大肆宣传“我砸了一颗钉子”。其实，砸钉子本身没有价值，只有砸出结果才有价值。这就好比在地球上钻一个洞没有价值，只有钻对地方、钻到了足够的深度、钻出了石油，才有价值。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)lass="content_102">4. 缺乏好产品


    找对了合适的场景只是确定了正确的方向，除此之外还需要好的产品来配套。但是，合格的 AI 产品经理非常缺乏，导致很多 AI 产品的产品力不足，即便配套的技术没有问题，这样的产品也不能称为一个好产品。整个
    AI 行业的情况和互联网在中国兴起之时的情况非常像，产品得不到重视，同时也严重缺乏合格的产品经理。


    我对层出不穷的 AI 产品非常感兴趣，同时也亲自体验了很多 AI 产品，也看了大量的产品演示和产品评测。我发现当前 AI 产品的整体水平还比较弱，只有为数不多的产品能够提供全程良好的体验。


    我们来看一款 Hover Camera 小黑侠跟拍无人机。小黑侠跟拍无人机能够通过人脸识别在人群中识别主人，主人可通过手势控制其进行拍照。它还可以追踪主人选中的人自主跟拍。这个产品听上去的确不错，它也因此获得了第一批用户，但它并不能称为一个好产品。其抗风能力差，下降时遇到稍大一些的风就容易翻转跌落；电池续航很差，常常是主人刚刚进入最佳拍摄状态，它就没电了。小黑侠跟拍无人机如下图所示。


    ![](img/epub_31486679_51)


    小黑侠跟拍无人机


    基本功能不过关是很多 AI 产品常见的问题，我本人就多次遇见过。我曾在出门问问的展位要求工作人员演示其手表中的智能助手。当时的环境比较安静，但工作人员却无法顺利唤醒手表中的智能助手，最后把嘴贴到手表上才把智能助手唤醒，工作人员和我一同陷入了尴尬。用户将这样的产品买回来只能是失望。


    5\. 商业模式问题


    如果说业界对产品是不够重视，那么其对商业模式就是忽视。


    一方面，AI 行业的商业模式还在探索中，而商业模式的创新本来就是很难的。另一方面，与大量 AI 技术公司创始人的强技术背景有关，商业模式的课题和传统的理工背景离得很远，多数
    AI 技术公司创始人为理工背景，其对商业模式的创新可能有些力不从心。这两个因素叠加导致 AI 商业领域商业模式的进化比较慢。


    X 技术商业非常重要的一个任务就是找对商业模式。技术为商业模式的创新提供了很大可能，同时技术商业竞争的残酷性也要求商业模式要有所创新。大多数企业对此并没有特别重视，基本还是采用销售商品、实施工程的传统商业模式。大量的企业针对同样的客户群，采用相同模式进行低水平竞争，因此竞争异常激烈。


    现在的 AI 技术公司做着新的生意，却用着陈旧的商业模式。如果是互联网巨头、传统行业巨头，这种做法的问题还不算太大，但如果是新公司，就非常危险了。放弃了对商业模式的主动探索，就等于丢失了一大块价值。


    以医疗影像 AI 应用为例，很多公司搞出一个单一病种辅助诊[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)断系统，千方百计地挤进顶尖医院让医院试用，然后就期望这些顶尖医院花钱购买。其实，更适合的模式应该是让顶尖医院贡献顶尖的医疗专业能力，向广大的普通医院收费，并将一部分收益与顶尖医院分享。商业模式领先了，医生的主动配合问题、高质量的医疗标注数据等长期困扰业界的难题也就基本解决了。因此，可以说模式的力量是更高层次的力量。


    ### 3.2.4 推进 AI 应用的正确做法


    在吸取以前的经验、教训的基础上，我们应该如何推进 AI 应用呢？


    1\. AI 技术—场景适配，选定目标场景


    AI 技术的行业应用、行业落地太宽泛、太粗放，应该过渡到更细的场景。一个行业包含了众多场景，我们只有一个个场景深入理解，才能发挥好 AI 技术的价值。只有明确了具体场景，才能开始打造产品。


    2\. 针对优选的场景，打造优秀的产品


    找对了 AI 技术适合的场景，实现了 AI 技术—场景的适配，还要打造出优秀的产品。


    例如，医疗影像 AI 辅助诊断产品费力进入医院影像科，但多数产品因为没有发挥出好的作用而被影像科医生放弃使用了。


    AI 技术公司如果推出的产品没有受到用户的欢迎，首先要反思产品本身的问题，而不是一味埋怨用户不懂产品的优点。AI 技术要想真正走向大规模应用，发挥其价值，好产品是其必要条件，是必须要解决的问题。


    2016 年至 2018 年期间出现的那些有问题的 AI 产品是值得我们关注的，我们只有从中吸取经验教训，使 AI 产品的水平得到整体提升，才能有望迎来 AI
    应用的辉煌。互联网商业在中国 20 多年的发展中，其产品水平不断提高，AI 应用应该充分学习和借鉴这个经验。写作本书也是为了唤起业界对产品问题的重视，而解决问题最快的办法是让优秀的产品经理加入进来。


    3\. 在初步成功的产品上，叠加有力的商业模式


