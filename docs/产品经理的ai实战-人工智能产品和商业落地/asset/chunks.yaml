- raw: "我们知道人脸识别现在已经在安保领域大量应用，但是现在看来还必须保留一部分人类保安，否则就有可能出现一个窃贼身穿有特定图案的T恤，大摇大摆地拿着东西走过去，而AI安保根本没有认出他是一个“人”的情况。而人类保安只要没睡着，就能将其识别出来。\n\
    \n在好莱坞电影《碟中谍》系列中，曾多次出现主角利用人工智能技术突破敌方防卫的桥段。在《碟中谍3》中，主角伊森戴上面具挟持对方让其念出几个语句，就获取了对方的声音特征。伊森的同伴以此特征生成了新的语音并将其传送给伊森，接着伊森利用新的语音骗过了前来查看的保镖，从而神不知鬼不觉地将目标绑走。\n\
    \n如果我是这个系列的编剧，我将会在下一部电影中增加自动驾驶战车对抗的桥段。情节是这样的——伊森的团队开车狂奔，敌方的自动驾驶战车紧追不放。敌方的自动驾驶车辆非常智能，伊森团队发射的火箭弹、扔出的手雷都能被准确识别并巧妙躲过。眼看团队就要被敌方的自动驾驶战车撞毁，伊森团队中的一名成员使用车中的3D打印机打印了一个特殊形状的物体，将一枚手雷放入其中扔到路上。敌方的自动驾驶战车没有识别出这个物体而被炸毁，伊森团队依靠对人工智能缺陷的理解成功脱险。\n\
    \n了解了机器学习的这些问题，是不是对人工智能有了更立体的认识？这些认识将直接作用于我们的产品规划与商业模式设计。例如，在把数据“喂”给机器之前，我们需要对数据进行检查，从源头避免数据过拟合的问题。这不能仅仅依靠AI科学家及AI工程师，AI产品经理也要发挥重要作用。\n\
    \n切记，人工智能的“智能”其实来自人工。有多少人工，就有多少“智能”。我们在规划人工智能产品、设计人工智能商业模式时，要清楚地了解当前人工智能的局限和边界，从而充分利用当前人工智能的长处，并对其短板尽量回避，或者采用其他方式进行弥补。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n## 第3章 AI商业格局、AI应用\n\n### 3.1 AI商业格局\n\n####\
    \ 3.1.1 AI商业格局的层次\n\n理解AI商业格局比理解AI技术本身更复杂。这就好比时光倒流20年，在互联网行业刚刚兴起时，有几人能准确预见今天的互联网商业格局？\n\
    \nAI商业格局如下图所示，其共有4层，从下往上依次是底层硬件、基础技术、平台/支持服务和应用。在AI商业中，越靠近底层竞争越激烈，残酷性接近八角笼格斗。要理解这种残酷性，可以参考PC整机、CPU、GPU、操作系统、办公软件的竞争历史。因为竞争都非常正面和直接，以至于难以采取措施回避和减弱，所以最终大多数领域只剩下极少数“幸存者”。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_48)\n\nAI商业格局图\n\n1\\\
    . 底层硬件\n\n底层硬件主要包括AI芯片、传感器，尤其是为AI而生的新型传感器。这个领域的技术难度及商业难度都非常大，注定只有极少数的公司能在此领域成为赢家。\n\
    \n根据部署的位置不同，AI芯片可以分为云端AI芯片与终端AI芯片。云端，即数据中心；终端，即手机、安防摄像头等设备。根据承担任务的不同，AI芯片又可以分为训练芯片与推理芯片。将两种分类方式结合起来，可以用下表来表示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_49)\n\n深度学习的训练阶段需要极大的数据量和运算量，因此训练环节只能在云端实现，所以上表中不存在“终端训练芯片”这个类型。\n\
    \n根据芯片本身采用的技术路线，可以将其划分为3类：GPU、FPGA（现场可编程逻辑门阵列）、ASIC（专用集成电路）。在AI芯片领域，美国的巨头公司凭借在芯片领域多年的积累，处于全面领先地位，尤其是在GPU和FPGA领域。国内AI芯片公司除华为海思外，多集中于终端AI\
    \ ASIC的开发。\n\nAI芯片可能是AI商业界最困难的领域，全球注定只有屈指可数的赢家能够生存到最后。本书后文不再涉及这个话题。\n\n2\\. 基础[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)技术\n\
    \n基础技术包括机器视觉、语音识别、自然语言处理、知识图谱等，这些基础技术还可以进一步细分。基础技术是AI学术研究的重点，很多AI应用的瓶颈要靠这一层来突破。这一层可以容纳的公司数量比底层硬件可容纳的要多，但每个细分领域同样只能有几家公司可以生存。\n\
    \n3\\. 平台/支持服务\n\n平台是指AI开放平台，如来自Google的TensorFlow，来自Facebook（脸书）的PyTorch，来自百度的飞桨等。\n\
    \n支持服务的种类很多，以数据相关的服务（如数据整理、数据标注）为主。\n\n平台/支持服务可以让AI技术更好地发挥作用，因此这一层已经变得越来越重要了。AI开放平台只能容纳个位数的公司，而支持服务可以容纳较多的公司。\n\
    \n4\\. 应用\n\n应用在最上面一层，其根据用户的类型可以分为三大类场景——消费者场景、企业场景与政府场景，在此基础上还可以进一步细分。因为细分场景众多，每个场景都有自己的壁垒，所以这一层可以容纳数量较多的企业。\n\
    \n另外，这一层是AI产品经理发挥价值的地方，因此也是本书讨论的重点。\n\n#### 3.1.2 AI商业格局的特点\n\n关于AI商业格局，基本可以确定以下几点。\n\
    \n（1）AI技术公司间的竞争会和互联网公司的竞争一样残酷。能生存下来的公司非常少，会很快形成“底层巨头+领域细分巨头”的格局。同互联网商业一样的双金字塔格局也会很快形成。\n\
