    ### 12.1 对 AI 技术—场景适配度的洞察


    #### 12.1.1 从 AI 与人的关系角度洞察适配度


    AI 就是人造的智能，我们不妨来分析一下 AI 与人的关系，这有助于提高高级 AI 产品经理对 AI 技术—场景适配度的洞察能力。人与 AI 的能力关系及
    AI 产品的生存空间如下图所示。


    ![](img/epub_31486679_91)


    人与 AI 的能力关系及 AI 产品的生存空间


    上图底部的圆代表人的能力圈，已经基本固定。上图上部的图形代表 AI 的能力圈，其在快速扩张。当前 AI 的能力圈已经侵入了人的能力圈，并形成了一定的交集。左侧图中向下的箭头，代表了
    AI 的能力圈继续侵入人的能力圈的趋势。


    人和 AI 能力圈的交集还可以细分为两部分。斜线部分代表 AI 取代人的区域，灰色部分代表 AI 与人协作的区域。左侧图中向右的箭头代表了 AI 更多地取代人的趋势。


    左侧图代表了当前的情况，右侧图代表了不久将来的情况。


    右侧图中的黑色圆形中的数字代表与 AI 技术适配的场景，也是 AI 产品发生作用的 3 个区域。


    区域 1 代表 AI 取代人的区域。这个领域是 2016 年至 2018 年 AI 发展热潮期间中的重点，也是入门不久的 AI 产品经理的生存空间。


    区域 2 代表 AI 与人协作的区域。随着 AI 技术的发展，区域 2 其实隐含了很大的空间。


    区域 3 代表了人的能力之外、AI 能力之内的空间。这是一个被严重忽略的产品空间。


    高级 AI 产品经理更应该站在 AI 和人的关系角度来洞察 AI 技术—场景。高级 AI 产品经理除了要在区域 1 内寻找产品机会，更要考虑区域 2 和区域
    3 内的产品机会。


    #### 12.1.2 对目标场景未来趋势的洞察


    合格 AI 产品经理一旦实现了某个 AI 技术与某个场景的适配，就会以此为基础来规划 AI 产品。但高级 AI 产品经理会多看一步，先对目标场景的未来趋势做出判断。


    我们都知道，随着产业环境的变化，有很多低端制造业迁移到成本较低的东南亚地区。如果高级 AI 产品经理判断某个行业正处于这个趋势中，这样的场景就不是一个合适的场景，应该放弃。因为
    AI 技术在任何一个行业场景落地应用，都要花费不少时间。如果选择这样的场景，等可行的方案出来，也许目标客户已经迁走了。因此，高级 AI 产品经理需要对目标场景未来几年的发展趋势做出判断。


    #### 12.1.3 对替代方案的洞察


    其实，大多数客户对 AI 技术并没有执念，他们只是想解决自己的问题。AI 技术可能只是诸多解决方案之一，而且还有可能不是最好的方案。这是 AI 公司特别容易犯的错误。因为自己擅长打造锤子，而且可以根据场景特点定制专门的锤子，就很容易到处去找螺丝钉。而客户可能要把自攻螺钉拧进去，可以用锤子，但更适合的工具其实是螺丝刀。


    在 2016 年至 2018 年的 AI 发展热潮中，这种情况屡屡出现。有些场景一天也没有多少咨询量，可公司偏要配一个接待机器人，结果因为配套的知识库等问题，接待机器人完全成了一个“傻瓜”。


    有些场景其实只需要把告示写得清楚一点，其引导效果更好。例如，有段时间我曾多次去某人才中心办不同的事，而且这些事我都是第一次办。大厅入口处写得很清楚——办什么业务、要准备什么材料、上几楼、怎么办。因此，尽管来办事的人很多，但只有很少的人需要向前台咨询，前台配备一个人就足以应对。再有什么更细致的疑问，可以到对应的窗口去询问。在这个场景中，现有的方案已经非常好了。如果一定要摆放一个接待机器人，人就要先教会机器人现有的业务细节，一旦有修改（小的更改经常发生）还要马上更新，这其实并不容易做到。结果常常是用户说不清楚，机器人听不明白，这时机器人并不会产生多大用途。这样，大多数接待机器人将很快被撤下，它虽然涉及
    AI 技术，但并不是这个场景中最好的解决方案。在前台无人问津的接待机器人如下图所示。


