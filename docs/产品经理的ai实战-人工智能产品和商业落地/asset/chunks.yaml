    ## 12.3 对AI技术—场景障碍的洞察


    在识别场景价值时，高级AI产品经理除了要考虑价值，还要考虑障碍。技术在应用的过程中会遇到大量的障碍，有些障碍还是无形的。高级AI产品经理只有洞察了障碍，才能提前做准备去解决障碍。这和风险识别与风险管理是同样的道理。


    ### 12.3.1 价值—障碍矩阵


    为什么在很多被一致看好的场景中，AI技术的应用并不顺利？根源就是我们往往只看到了价值，而忽略了其中的障碍，甚至还会进一步放大价值、缩小障碍，将真实场景扭曲了。


    为了便于理解，我做了一个简单实用的矩阵图。AI技术—场景的价值—障碍矩阵如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_99)


    AI技术—场景的价值—障碍矩阵


    这个矩阵根据AI技术—场景的价值大小与障碍大小，将场景划分为4个区域，具体如下。


    （1）价值大、障碍小的区域，显然是商业上的黄金场景，要优先发展。


    （2）价值大、障碍大的区域，是一块“硬骨头”，但也有很大价值，属于白银场景。


    （3）价值小、障碍小的区域，是价值较小的紫铜场景。当AI技术发展到成熟阶段时，黄金场景、白银场景被挖掘殆尽了，紫铜场景也是有价值的。同时，这个场景可能也适合一些初创公司。初创公司将自己的产品定位于紫铜场景，可以避开两个高价值场景的激烈竞争。


    （4）价值小、障碍大的区域，是价值最小的黑铁场景。黑铁场景并非一无是处，其在商业上同样有价值。这个场景适合将前3个场景中形成的能力做成简单化、标准化的低成本产品来覆盖。虽然其单位价值小，但可以依靠规模来取胜。正如可口可乐，每一瓶的利润可能都非常微薄，但依靠巨大的销量仍然能获得可观的利润。


    障碍来自很多[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)方面，如人力成本障碍、数据障碍、法律障碍等。有些障碍比较明显，有些障碍则隐藏得较深，需要高级AI产品经理深入挖掘。


    ### 12.3.2 AI技术—场景障碍的例子


    1\. 面包店的自助结算台


    下面用一个我亲身体验过的例子来说明AI技术—场景障碍——某公司布置在原麦山丘面包店的自助结算台，如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_100)


    原麦山丘面包店中的AI自助结算台，车马拍摄


    用户将装有面包的托盘直接放在自助结算台上，机器会自动识别面包的品种和数量，并显示在屏幕上供用户核对。这个环节用到了机器视觉的AI技术。自助结算台计算出总价，用户就可以通过支付宝、微信支付等方式结算，结算完毕就可以带着面包离开。整个过程不需要店员介入。我实际体验过，虽然整个过程很流畅，但是我在进一步观察、思考后发现其中隐藏着很多障碍，导致其商业化会遇到很多问题。


    第一个障碍比较明显，源于商品特征。原麦山丘面包店的卖点是正宗欧式面包，它比大多数面包房的面包要大。所以，在人工结算台的收银员旁边有专门负责切面包的店员，店员会主动询问“面包需要切吗”。以我本人为例，我都会选择切开。如果使用自助结算台，出于安全考虑不能摆刀让客户自己切。另外，还有装袋问题，操作熟练的店员处理起来又快又好，但客户自己就不一定了。专门配一个店员在旁边服务，要增加人力成本，与当初引进自助结算台的目的就背道而驰了。如果由柜台外店员在上货、清洁之余顺便提供服务，又很难做到及时。店员正在上货，这时一位客户说要切面包，店员就很难处理。而客户的需要如果不能及时得到满足，他就会产生不好的购物感受。这不是AI的过失，也很难用AI技术来解决，但它是AI应用真实存在的障碍。


    第二个障碍是一个隐藏的障碍——店员的抵触。原麦山丘面包店的管理不错，店员普遍彬彬有礼，服务周到。但根据我多次购物时的观察，店员几乎没有主动向客户推荐过使用自助结算台，即便人工结算台已经排起了长队，如下图所示。


    ![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_101)


    原麦山丘店内场景，车马拍摄


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ntent">上图左侧是人工结算台，在我前面已经排了好几位；右侧靠近玻璃门处一个店员的身后就有一个可以正常使用的自助结算台，但很长时间没有人使用。


    原来最初该公司在店里演示，并向面包店的高层讲解其好处时，说到自助结算台将来可以取代店员。而这些话被在场的店员听到了，并在店员中传开了。于是，所有店员都对这个设备产生了抵触心理，这就是一个巨大的障碍。这样的设备摆在店铺中并不显眼，如果没有店员的积极推荐和引导，其使用量一定不高。为了观察到其具体使用数据，我曾经在一次购物后在店里坐了两个小时。在这两个小时中，即使人工结算台排起了10人以上的长队，店员也没有向客户推荐过使用自助结算台。其实，只要店员告知客户自助结算台的存在，就会有一定的客户尝试。如果店员再加以引导，就会有更多客户乐于尝试。


    因此，从技术、产品上都被看好的自助结算台，其应用效果并不好。如果一直是这样的应用效果，可能不久后自助结算台就会被迫退场。毕竟它要占用宝贵的店铺面积，还要持续耗电。这样，想象中的由结算切入，扩展更多业务的商业模式也就无从谈起了。


    目前，在AI行业还有很多这样的障碍真实存在却没有被察觉。这既是高级AI产品经理要面对的问题，又是体现其价值的机会。


    2\. AI选址服务


    对于实体零售业和服务业来说，选址是非常重要的，选址正确就成功了一半。目前，实体店铺更替频繁，每天都有大量的店铺开张，这对应着巨大的选址工作。传统的选址都是公司自己进行的，零售小店靠店主自己考察，连锁公司有专业团队按专业方式来选址。但即便是连锁公司，其选址方式也是很传统的方式。


    其实，AI技术可以用在这个场景中，形成一个AI技术—选择场景的有效组合。基本做法是，公司在几个候选地址附近架设多台隐藏摄像头，这些摄像头各有分工，有些拍摄的范围大，有些拍摄的范围小。然后利用图像识别技术，将各摄像头中的全天人流量识别出来，如马路两边各有多少人经过，有多少人从对面马路过来，又有多少人走向对面马路等。拍摄候选地址附近店铺的摄像头，因为拍摄范围小，可以准确识别出有多少人进了哪些店铺，是否买了东西等。


    利用AI技术，连续采集一周甚至更长时段的数据，绘制成24小时流量表。这与以前采用人工方式采集的数据相比，量更大，数据更全、更准确。公司可以将多个候选地址进行全面比较，再由有经验的选址人员结合店铺本身的产品、人群特色，做出选址决策。这样的选址方式明显优于传统选址方式。


    目前，大多数的AI选址方式就是这样做的，但仔细分析，会发现其也存在一些障碍。


    上述做法以现有的AI技术就能做到，不需要科学家，只需要工程师将系统搭建出来。拥有这种技术的公司可以将它做成一个服务产品，但不可能很快。因为它有商业上的障碍，而且这个障碍很难突破，我们来分析一下。

