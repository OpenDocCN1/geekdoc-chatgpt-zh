    \n虽然AI模型对产品经理来说是一个黑箱，但产品经理可以从数据角度参与AI模型的改进。\n\n#### 9.3.2 AI产品经理对指标体系的规划\n\nAI产品在投放市场前需要进行规划、开发和测试，这就要[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)求产品经理进行整体把握。对其整体把握的一个关键工具就是指标体系。产品只有达到了指标体系的指标要求，才能通过验收投放市场，否则就要返工改进，直到达到指标要求为止。\n\
    \n指标要求不是越高越好，太高的指标要求可能导致实施成本过高、周期过长，最终无法达到指标要求；过低的指标要求又会导致产品吸引力下降，甚至带来严重的安全风险。这就需要指标体系内的各指标要求达到微妙的平衡，而这种需要结合多种指标要求达到的微妙平衡，要由产品经理来把关。\n\
