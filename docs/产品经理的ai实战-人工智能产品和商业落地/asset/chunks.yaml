    \  | ID：EPUB\\_20260428160408 \n\n# 内容简介\n\n如今，有关人工智能的书大多属于两种类型：一种是面向公众进行人工智能科普的书；另一种是针对专业技术人员的纯技术书。这两种书虽然产品经理都可以阅读，但他们更迫切需要第三种书——从商业的角度讲解人工智能，以产品的方式让人工智能落地应用的书，而本书正属于这种类型。\n\
    \n本书具有针对性强、系统性强、实操性强、原创度高的特点。本书共分为三篇，第一篇是基础篇，第二篇是合格AI产品经理篇，第三篇是高级AI产品经理篇，均从商业的角度对人工智能进行了讲解。\n\
    \n本书既适合互联网产品经理或希望转行做人工智能产品经理的技术人员阅读，又适合对人工智能的应用、产品、商业模式感兴趣，想系统了解的人士阅读，如企业家、创业者等。\n\
