  trans: '


    随着支付宝用户的增加，用户对其信任感逐渐增强，大量用户的支付宝账户中的余额也增加了。支付宝以此为基础推出了余额宝，不仅做大了支付宝，还启动了一个新行业——互联网金融行业。


    支付宝的价值不仅包括从银行“抢夺”过来的价值，它还有新的价值来源。其依靠支付积累了海量的高价值数据，构建了覆盖更广、质量更高的信用评价体系——芝麻信用。芝麻信用分不仅可供用户使用，还可以为合作企业赋能。例如，蚂蚁信用分较高的人可以免押金骑行单车、租用电子产品、入住酒店，既方便了用户，又为合作企业增加了业务量。蚂蚁信用实际上成了非常有价值的信用体系，至此，支付业务的新技术—场景展现出来的巨大价值，已经大大超越了银行当初的理解。


    ### (5) 组织能力

    要做那么多新的事情，需要强大的组织能力。阿里巴巴的组织能力建设处于中国乃至全球的领先地位，其有非常系统的方法来构建组织能力。这也是阿里巴巴商业版图不断扩张的组织基础，只是与它的产品、市场相比，这一块很少受到外界的关注。


    ## 2. AI 商业的五大要素及其关系

    `AI`商业与互联网商业同样是`X 技术商业`，在互联网行业经过验证的规律已经在`AI`行业初步发挥作用。


    ### (1) 技术—场景

    `AI`应用虽然在一些场景遇到了困难，但`AI`应用在基于人脸识别的安防、基于语音技术的智能音箱等场景已经得到了初步的认可。


    ### (2) 资源

    在起步阶段，`AI`技术公司获取资源的能力比互联网公司更强，因此一些优秀的`AI`技术公司将有充足的资源去发展、去试错。


    ### (3) 产品

    大多数`AI`技术公司尤其是有着纯技术背景创始人的公司，由于其最初并没有重视产品，于是很快便遇到了问题。目前，大多数`AI`技术公司均已开始重视产品，少数公司已经具备了较强、较系统的产品能力。


    ### (4) 商业模式

    多数`AI`技术公司还没有开始重视这个要素，但根据`X 技术商业`的规律及互联网商业的经验，这是一个必须要重视的要素。`AI`技术给商业模式带来了新的力量，也给商业模式带来了新的可能。另外，商业模式决定了组织能力的方向，为组织能力的发展提供了指导。


    ### (5) 组织能力

    目前，多数`AI`技术公司还只是强调自己的技术实力、高学历员工的比例，并没有站在更高的层次来看待组织能力。组织能力并不是高学历员工的简单组合。公司的技术实力虽然是组织能力的重要组成部分，但并不是全部。多数企业还没有意识到整体组织能力的价值，也还没有朝这个方向努力。随着`AI`商业的进一步发展，它将很快从技术要素的比拼转化为多要素的比拼，这时组织能力的价值也会凸显出来。在这个变迁的过程中，不能及时做出反应的公司很可能出现技术领先但因为组织能力落后导致失败的情况。


    如果详细展开`X 技术商业`的五大要素及其之间的关系，将占用大量篇幅。如何获取资源（如融资、抢占优质客户、构建政府关系等），构建与商业要素适配的组织能力，更多的是创业家、企业家需要考虑的问题。考虑到本书的主要目标读者是产品经理，所以本书重点选取其中的
    3 个要素进行讲解：技术—场景、产品与商业模式。


    ### 1.3 技术—场景、产品与商业模式

    对`X 技术商业`五大要素及其关系有了整体理解后，接下来我们深入讨论与`AI`产品经理非常紧密的 3 个要素：技术—场景、产品与商业模式。


    #### 1.3.1 技术—场景、产品与商业模式的关系

    这 3 个要素之间的关系可以用岸、桥和拱来表示，具体如下图所示。


    ![](img/epub_31486679_13)


    技术—场景、产品与商业模式的关系


    岸：如上图所示，左右两边是原本分离的技术此岸和场景彼岸。技术落地产生价值的过程形象地说就是从技术此岸走向场景彼岸的过程。


    桥：此岸和彼岸之间隔着鸿沟，甚至可以说是天堑。因此，从此岸走向彼岸需要一座桥——应用之桥。所谓技术落地产生价值，就是在技术和场景之间开通应用之桥。要在两岸之间架起一座桥，桥梁工程师先要选址，在两岸合适的位置架设桥梁。桥梁选址需要考虑很多因素，如地质条件、建造成本、工期等。选址适当，桥就容易建成；选址不当，桥就不易甚至不能建成。同样，如果想让技术实现场景落地，产品经理就要将合适的技术和合适的场景精准适配起来。因为`AI`包含了很多细分的技术，应用场景也包含了众多的细分场景，只有将细分的技术和细分的场景精准适配起来，才有可能实现技术的成功落地。


    拱：应用之桥是一座拱桥，它由两个连续的拱组成——产品之拱和商业模式之拱。只有这两个拱都建成了，应用之桥才能畅通。


    历史告诉我们，技术此岸与场景彼岸之间存在很深、很宽的鸿沟，跨越这个鸿沟的难度常常超出我们的想象，很多发明家对此深有感触。发明家要经过很多年甚至一辈子的奋斗才能做出一个了不起的发明，获得发明专利后他们满怀信心，认为等着购买或者授权的企业会排成长队。但在很多情况下，直到发明专利失效，发明家都没有让自己的发明从此岸走到彼岸，也没有从中赚到一分钱。


    与发明家一样，企业、机构的技术此岸经常有成果诞生，但多数也没能成功地走向场景彼岸。即便是美国，这个技术转化做得较好的国家也是如此。


    互联网技术的成功应用给`AI`技术的应用提供了经验。最初，大家认为技术人员做一个网站或一个`App`就能产生价值，结果发现做一个网站或一个`App`并不难，而且越来越容易，但数以百万计的网站或`App`却没有产生价值。问题在于产品之拱和商业模式之拱没有造好，导致应用之桥不通。整个互联网行业从早期的实践中吸取教训，开始着力打造产品之拱和商业模式之拱。很多互联网公司的`CEO`（首席执行官）都以产品经理身份自居，这迎来了产品、产品经理的高光时刻。在商业模式上，中国的互联网行业以复制起步，向复制、改造、原创并举转化。很多互联网公司的产品之拱和商业模式之拱依次建成，互联网技术的应用之桥也随之畅通。


    `AI`产品经理需要学习互联网行业的成功经验，将`AI`技术和场景做到精准适配，然后打造出好的`AI`产品，并设计出配套的商业模式，只有这样才能让`AI`技术成功落地。


    #### 1.3.2 X 技术产品、X 技术商业模式的特点

    （1）超越需求，引领需求是`X 技术产品`的重要特点。


    传统商业是以用户需求为导向的，用户对自己的需求比较清楚，而企业也几乎不会提供超越用户需求的产品。但技术产品却不同。一个技术产品出现之前，用户总以为现有的产品功能已经够用了，但当企业提供了更先进的产品时，用户还是会被激发起强烈的购买欲望。


    `iPod`（苹果播放器）出现之前，没有人想过要买一个小得可以放进衬衣口袋并且能存放 1000 首歌的数字音乐播放器。但`iPod`推出后，却迅速风靡全球。


    以我本人为例，我很长一段时间用的是`MacBook Air`电脑 2012 款，虽然该电脑的屏幕不是`Retina`屏（视网膜显示屏），但我对它的效果很满意。但是，当我试用了
    2018 款的`MacBook Air`，且亲身体验了电脑上`Retina`屏幕的效果后，`Retina`屏幕就成了我下一部电脑的必要配置。


    手机的摄像头也一直在超越用户的需求。当双摄手机出现后，很多用户在换机时会优先考虑双摄手机；当三摄手机出现后，三摄手机又成了部分用户的首选；现在，四摄手机也越来越多了，华为的四摄手机`P30
    Pro`如下图所示。


    ![](img/epub_31486679_%3Cspan%20style=)


    华为的四摄手机`P30 Pro`


    对于技术产品来说，传统的用户调查所起的作用并不大，在用户看到一个能被打动的新产品之前用户确实不知道自己还需要什么。具体到`AI`产品也是如此，`AI`产品经理在规划产品时常常需要适当超越用户需求，用好产品来引领用户需求。


    （2）`X 技术`有可能创造全新的产品形态和商业模式。


    这是`X 技术商业`特别具有魅力的地方。


    我国的互联网产品、互联网商业的发展，已经一再证明了这一点。在开始，很多大企业认为互联网就是一个远程渠道，于是把企业原有的产品放到网上销售，但结果并不成功。最后成功的是那些利用技术，打造新产品，运用新商业模式的企业。


    `AI`技术就完全可能创造全新的产品形态和商业模式，`AI`产品经理应该在其中发挥重要作用。


    （3）`X 技术商业`更容易出现市场高度集中的现象，对善于利用这个规律的公司是好事。


    市场高度集中可以持续为企业提供高利润。所以，虽然高度集中的名声并不太好，但却是众多企业孜孜以求的目标。


    一些大规模、重资本的传统商业也会出现市场高度集中的现象，如石油、化工、汽车等。这些领域要经过很长时间的市场竞争和演化，才会形成最后的高度集中的局面。与传统商业不同，`X
    技术商业`能在很短的时间内从充分竞争走向高度集中，而且其高度集中程度比传统商业更加严重。一旦高度集中的局面形成，企业就能获取高利润，而且是持续的高利润。互联网行业的很多领域都出现过企业疯狂融资、疯狂发展用户的现象，其最终目的就是获得持续的高利润。


    为什么`X 技术商业`更容易出现快速高度集中的现象呢？简单讲两个原因。


    一是`X 技术`的规模效应非常强，技术的前期投入大，但一旦开发成功，其边际成本会很低。所以，一个企业一旦有了领先的技术、受欢迎的产品，就可以低成本地获取大量用户。传统商业往往是基于实物的，虽然规模变大也会摊薄成本，但其程度远不如`X
    技术商业`。


    二是地域壁垒的问题。多数传统商业有明显的地域壁垒，这也是高度集中的一个障碍。传统商业中的很多中小型企业主要是依靠地域壁垒来生存的。而对于`X 技术商业`来说，地域壁垒几乎是不存在的。例如，中国的互联网行业几乎没有区域性企业，在某个细分领域往往都是前两家企业占据了绝大部分的市场份额。这样的高度集中的程度明显超过大多数传统商业的高度集中的程度。


    优秀的`AI`产品经理会尊重并善用以上特点，规划出好的`AI`产品，设计出优秀的商业模式，成就所在的公司，也成就自己。


    #### 1.3.3 技术—场景的适配

    世界上存在众多的技术，每项技术还有诸多特点。同时，世界上也存在无数的场景，每个场景也各有自己的特征。因此，能够将某项技术和与之相适应的场景找出来并实现精准适配，是非常难的事情，而这又是产品经理必须做好的第一件事。这件事如果做错了，后面的一切事情无论怎么做都是错误且无法调整的。而这件事如果做对了，那么其方向就选对了，即便后续的工作出现一些问题也可以进行调整。


    我们先以二维码技术为例，从技术出发寻找适配的场景。二维码这项技术从用户角度看只有两个环节——显示二维码（屏幕显示或印刷）和用手机扫描二维码。其实现成本低、使用简单，并且随着智能手机的普及，它的应用场景也越来越多。例如，通过扫描二维码，我们可以访问网址、加好友、关注公众号、完成支付、打开小程序等。


    我们再换一个方向，从场景出发寻找适配的技术。以取代公交刷卡这个场景为例，为了给公交用户提供便利，公交机构一直在寻找合适的技术，来实现用户不带公交卡就能顺利乘车的目的。适合这个场景的技术有很多种。一种是移动运营商曾经力推的双界面卡——带“尾巴”的`SIM`卡，就是将感应天线连接到手机`SIM`卡，并贴在手机后盖上。这项技术和场景在某个阶段是适配的，也曾在一些城市推广并获得了一些用户。但是，随着手机产品的不断迭代升级，这项技术和场景变得不再适配了。这种方案有两个要求：第一，手机后盖可以拆下，以便把感应天线贴上去；第二，手机后盖不能是金属的，否则会屏蔽信号。针对这两个要求，大多数功能机及`Symbian`（塞班）系统的手机都能满足，所以一度是适配的。随着`iPhone`对智能手机的重新定义，手机也随之发生了很大改变。现在的智能手机几乎都是一体化电池设计，用户自己无法打开后盖。`SIM`卡槽从`Micro`发展到`Nano`，越来越小，而且很多手机的`SIM`卡还是侧向插入的。这些变化导致双界面卡无处放置，再加上很多智能手机的后盖是金属材料，信号完全被屏蔽了。正是由于场景发生了变化，技术和场景也就变得不再适配了，双界面卡这种方案也就逐渐被淘汰了。


    除了双界面卡技术，还有两种重要技术：手机`NFC`（近场通信）和手机二维码。


    手机`NFC`技术是利用手机本身具有的近场通信功能，使手机和公交感应器近距离非接触通信从而实现无卡计费的。部分城市（包括北京）的公交车已经支持该功能。我在北京乘坐公交车就是使用手机`NFC`，非常方便。不过，这需要手机本身具有`NFC`功能，这涉及硬件问题，并不是安装软件能解决的。由于很多手机不具备`NFC`功能，所以`NFC`技术和公交无卡计费场景还是不完全适配的，公交机构要花不少钱改造设备，但很多用户却用不了，因此很多城市的公交机构没有采用这项技术。手机双界面`SIM`卡实物图、手机`NFC`示意图如下所示。


    ![](https://res.weread.qq.com/wrepub/epub_31486679_15)


    左为手机双界面`SIM`卡实物图，右为手机`NFC`示意图


    手机二维码技术对手机的要求很低，能联网的智能手机大部分都可使用。手机安装相应的`App`，就可以生成二维码，将手机屏幕上的二维码对准公交车上的扫描器，就能支付成功。手机二维码和公交无卡计费场景做到了高度适配，适用于绝大多数用户，用户只需要安装`App`并做设置就能很方便地乘坐公交。在公交无卡计费场景的技术中，手机二维码的适配度最高，因此我们看到全国大多数城市的公交机构都采纳了这个方案。


    我们再看一个技术和场景适配的例子——`Eink`（电子墨水）显示技术。和`LCD`、`OLED`等显示技术相比，`Eink`显示技术有很多弱点——显示颜色极少（最初只能显示黑白两色），刷新速度很低。因此，`Eink`显示技术无法胜任电视机、手机这些需要显示丰富色彩、快速刷新内容的场景。然而，`Eink`显示技术有两个独特之处——耗电极低、视觉舒适（尤其是在长时间强光环境下），这两个技术特点和电子阅读器的场景高度适配。使用`Eink`显示技术的亚马逊`kindle`阅读器如下图所示。


    ![](img/epub_31486679_16)


    使用`Eink`显示技术的亚马逊`kindle`阅读器


    阅读器虽然对彩色需求不高，但其追求省电和长时间阅读的舒适感，而这恰恰是`Eink`显示技术的优势。所以，以`kindle`为代表的阅读器从诞生到不断升级换代一直使用的是`Eink`显示技术。


    多种技术经过合理组合可以适应更多场景，这里以新零售场景为例来进行说明。新零售是基于数据的零售，需要根据数据和运营策略频繁调整价签内容。例如，一种面包早上刚上架时是正常价，中午时段可能调整为
    8 折的午餐优惠价，晚上可能是买一送一的处理价。如果用传统零售企业使用的传统纸质价签，更换起来需要消耗大量人力而且速度慢，完全不能适配新零售场景。而`LCD`等显示技术因为过于耗电，需要频繁更换电池，从而显著增加物料成本和人力成本。电子价签由应用`Eink`显示技术的显示屏和无线传输模块组成，由内置电池供电，放置在货架上向顾客展示商品名称、价格等信息。这样的技术组合非常适合新零售场景。永辉“超级物种”店内就大量使用这样的电子价签，具体如下图所示。


    ![](https://res.weread.qq.com/wrepub/epub_31486679_17)


    永辉“超级物种”店内大量使用的电子价签，车马拍摄


    电子价签非常适合新零售场景，新零售企业通过无线传输方式就能实时更新大量的价签信息，而且由于`Eink`技术的耗电极低，电子价签可以在很长一段时间内不更换电池。因此，电子价签在新零售行业得到了快速普及。我光顾过的盒马鲜生、便利蜂等新零售企业绝大多数在使用这种电子价签。


    我们在进行技术商业化时，很容易进入“手拿锤子，满世界找钉子”的状态。就像我们看好`AI`技术，总想把它用起来。从技术的单一维度看，我们总认为`AI`技术可以适应非常多的场景。但现实中的场景极少是单一维度的，都需要我们进行多重考量。很可能在有些场景中，`AI`技术可以发挥作用，但更适合的可能不是`AI`技术而是更简单、更“古老”的技术。例如，一颗自攻螺钉虽然用锤子也可以勉强敲进去，但最适合自攻螺钉的工具是螺丝刀。锤子与其费力将自己改造得适合自攻螺钉，不如放弃自攻螺钉，寻找更合适自己的钉子，具体如下图所示。这恰恰是前几年`AI`热潮中普遍出现的问题，我们试图用`AI`技术这个锤子去解决所有场景的问题，却忽略了世界上还有很多其他的工具。锤子和其他工具一样，各有适应的场景，勉强切入并不适合自己的场景，其结果大多是失败。


    ![](img/epub_31486679_18)


    锤子、自攻螺钉和螺丝刀


    #### 1.3.4 产品之拱

    将合适的技术和合适的场景适配起来，相当于为桥梁做好了选址，然后就要打造产品之拱了。


    在多数情况下，在适配的技术—场景中打造出好产品是有很大难度的，以数字音乐为例进行说明。随着互联网的发展，数字音乐分发与播放技术和随时随地听音乐的场景实现了适配，很多公司都看到了这个适配，也推出了很多产品——数字音乐播放器（俗称`MP3`播放器）。但因为产品对用户的吸引力不够，导致这个市场一直不温不火。直到苹果公司推出了“`iPod`+`iTunes`”（`iTunes`是一款供`Mac`和`PC`使用的免费数字媒体播放应用程序），它迅速点燃了全球用户的热情，也快速挖掘出了数字音乐巨大的商业价值，甚至改变了整个音乐行业的格局。乔布斯回归苹果之后，正是靠这个产品复兴了苹果公司。此后，苹果公司依靠不断涌现的好产品——`iPhone`、`iPad`、`Apple
    Watch`等，在商业上越来越成功。苹果公司的过人之处不是它能抢先发现技术—场景的适配，而是它总能拿出更好的产品，实现后来居上。


    好的产品可以充分发挥技术的价值。反过来说，如果产品做得不好，即便是一个很强的技术，其优势也难以发挥出来。我们以一项能力有限的技术——短信为例。短信是在`2G`时代诞生的，其通信技术能力很弱——一条只有
    140 个字符（70 个汉字）的容量。但如果找到了合适的应用场景，打造出合适的产品，短信依然可以发挥出其商业价值。


    '
