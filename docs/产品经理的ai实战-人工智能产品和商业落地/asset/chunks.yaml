    ### 5.2 AI 技术—场景适配中的微机会


    #### 5.2.1 由小到大做适配


    互联网技术已经全面渗透进零售场景，但这种全面渗透是经过长期发展的，是逐步完成的。最初，互联网技术从整个零售的边沿场景起步，通过互联网对少数人销售少数产品，在整个零售场景中所占的份额非常少。2000
    年左右，在国美等传统零售巨头如日中天的时候，没有人认为互联网会对他们造成太大影响。经过十多年的发展，互联网技术才逐渐渗透进整个零售场景。2016 年，马云提出了新零售，2017
    年刘强东提出了无界零售，引领了零售业的变革。


    AI 应用也应该学习这种做法，先追求在一个单点、局部的立足，逐渐积累势能。没有行业中的单点突破，就没有渗透整个行业的解决方案。


    #### 5.2.2 微场景、微产品的特别机会


    合格 AI 产品经理尚不具备洞察大场景的能力，但不妨多关注微场景并从中发现产品机会。从微场景发现机会，对合格 AI 产品经理有 3 个特别的好处。


    （1）正因为是微场景，一般公司的高层常常会忽略它，这样 AI 产品经理就有了其独特的价值。


    （2）正因为是微场景，其比大的场景更容易理解，与合格 AI 产品经理的能力也比较适配。


    （3）正因为是微场景，相应的产品规划通常也比较简单，技术实现也会比较容易。相对于大场景的复杂产品，其更容易实现落地应用。“千鸟在林，不如一鸟在手。”AI 产品经理从微场景及对应的微产品入手，更容易积累经验。


    来看两个微场景及对应产品的例子——弹幕挡脸。在网红视频和网红直播中，网红的脸占据了大部分画面，这就是一个微场景。在这个微场景中存在一个问题——密集的弹幕在画面上飘过，经常挡住网红的脸。一些热门的视频、直播，更是经常看不到网红的脸，如下图所示。


