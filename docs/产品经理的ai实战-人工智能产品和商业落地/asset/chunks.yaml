    # 前言


    简单地说，人工智能（AI）就是人制造的机器所表现出来的智能。


    ## 三盘棋，两种结果


    人工智能从诞生到现在已经经历了 60 多年的风雨，比互联网的历史要长得多，其在 20 世纪曾经短暂地掀起过两次热潮，但很快就进入了漫漫寒冬。人工智能和下棋似乎很有渊源，人工智能机器与人对弈，每下赢一种棋（如下图所示的西洋跳棋、国际象棋、围棋等），就会掀起一次热潮。


    ![](img/epub_31486679_5)


    西洋跳棋、国际象棋、围棋


    阿瑟·萨缪尔是“机器学习”一词的发明者。他编写了一个有学习能力的西洋跳棋程序，该程序于 1962 年战胜了美国著名的西洋跳棋冠军尼雷，引发了普通公众对人工智能的兴趣。


    1997 年，IBM 的 Deeper Blue 战胜了国际象棋冠军卡斯帕罗夫，这再次激发了普通公众对人工智能的兴趣。


    虽然这两次下棋都掀起了热潮，但大部分人认为机器不具备真正的智能，只不过是凭借不知疲倦的算力战胜了人。卡斯帕罗夫事后就要求与 Deeper Blue 再战，可见其心有不服。


    围棋是很复杂的博弈棋类，一直被视为人类智能的一座高峰。在它面前，强大的计算机算力也显得非常渺小。对于人工智能的迅速发展，围棋又意味着什么呢？2017 年，AlphaGo（阿尔法围棋，指围棋机器人）Zero
    战胜了世界排名第一的棋手柯洁，之后 AlphaGo 宣布不再与人类下棋。与卡斯帕罗夫的不服相反，柯洁的感叹是“对于 AlphaGo 的进步来讲……人类太多余了”。


    这一次的人机对弈和前两次一样，又燃起了公众的热情。这一次的人机对弈和前两次又有不同，大大推进了人工智能技术的落地应用，前两次下棋虽然取胜，但人工智能却没有走出棋盘，这一次人工智能很快走出了棋盘并应用于众多领域。


    2016 年至 2018 年，人工智能的发展热潮来得如此强烈，其在学术、资本、产业、政策领域几乎是同步跃进的，这样的情景在技术应用史、技术商业史上是从来没有出现过的。相关部门在安防等社会治理领域大规模应用人工智能技术，为人工智能的发展提供了沃土。互联网大公司规模化地应用了人工智能并产生了明显效果，为人工智能的更广泛应[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)用树立了样板和信心。除此之外，医疗、金融、制造、教育、农业等诸多领域也掀起了应用人工智能技术的热潮。


    ## 寒冬中，对春天的信心


    虽然看上去很顺利，但是实际情况远没有那么理想。除少数几个应用领域进展顺利外，多数应用领域的进展远低于预期。受此影响，从 2018 年年底开始，除了学术领域的热情持续高涨，AI
    领域的创业、投资、估值、应用热度都有了明显下降。进入 2019 年，多数 AI 技术公司面临的已经不是估值问题，而是生存问题。


    已经有人忧心忡忡地提出“人工智能的第三个冬天是不是来了”。毕竟，人工智能此前已经经历过两个冬天，再来一个冬天又有什么奇怪的呢？而我却相信人工智能的春天已经在路上了，信心来源于以下几个方面。


    （1）人工智能技术本身的成熟。前两次人工智能冬天的出现是由于技术本身不成熟，这导致人工智能几乎没有走出学术领域，甚至没有持续应用的案例。当前的人工智能技术在多个细分领域已经达到了很高的水平，也经过了大规模应用的检验，已趋向成熟。


    （2）人工智能配套条件的大幅度改善。现在有了越来越低价、越来越强大的算力，还有源源不断的大数据，人工智能就有了强健的“体魄”和丰富的“粮食”，自然会越来越强大，这对人工智能在众多领域的应用非常有利。


    （3）当前人工智能已经在多个领域投入使用，而且是大规模的、正式的商用。苹果、华为等企业已经将人工智能集成到小小的手机中，帮我们更容易拍出好照片，帮我们更快地找出包含特定人的照片，让我们无感解锁，让我们又快又安全地支付……除了这些应用，人工智能在安防、城市管理、客服等行业也已经被成功应用。这些成功案例给了我们很大的信心，我们的任务也变成了如何在更多领域去应用好人工智能。


    ## 这一次，真的不同！


    人工智能同样遵循技术应用规律


    除了上述具体的原因，我的信心更多来自技术应用的普遍规律。基本规律的作用域更广、更持久，让我们跳出人工智能，站在技术应用这个更高的层次来看一些基本规律。


    我从应用角度总结出了技术应用的周期规律，该规律如下图所示。


    ![](img/epub_31486679_6)


    技术应用的周期规律


    我们看到，一项新技术的实际应用会经过 4 个阶段。


    第一阶段——应用迷茫期。在图中我们用一个大大的问号来表示大多数人不知道这项技术的用途。想想 20 世纪末互联网刚刚进入我国时，我国又有多少人知道互联网的用途呢？


    第二阶段——应用启蒙期。在图中我们用放在某个位置的一个灯来表示技术在某个单点得到了应用，让大家看到这项技术是有用的，进而启发大家思考能否在其他地方进行应用。如果启蒙[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)应用具有很强的社会影响力，技术应用就会极快地进入应用狂想期。以前的互联网是如此，2016
    年至 2018 年的人工智能也是如此。


    第三阶段——应用狂想期。在图中我们用众多的灯来表示技术的应用，外面的轮廓表明这些灯其实存在于大家的想象中。在此期间，大家认为这项技术简直是无所不在、无所不能的，于是各个领域都去尝试应用这项技术。“互联网+”“AI+”都是如此。


    第四阶段——应用常态期。相比应用狂想期的灯，应用常态期的灯（代表应用）有了很多变化：

    （1）有些灯消失了，表明有些在应用狂想期非常看好的应用领域，实际并不适合应用这项技术；

    （2）有些灯亮了，但不大，表明应用成果低于预期；

    （3）有些灯比应用狂想期的灯还大，表明有些应用成果高于预期；

    （4）有些灯是新出现的，表明有些应用领域是大家当初都没有想到的。


    进入第四阶段的互联网技术已经将上述规律表现得非常清楚，值得人工智能好好学习。对照上述规律，人工智能刚刚走完应用狂想期，正在进入应用常态期。所以，从行业发展、个人发展的角度，我想表达的是“对于人工智能应用来说，现在是最坏的时代，现在也是最好的时代”。


    ## AI 的落地应用呼唤健全的人才组合


    最初，在 AI 应用领域较受关注的人才是 AI 科学家和 AI 工程师。进入应用启蒙期和应用狂想期后，业界普遍认为“AI 技术人才+行业专家”这种人才组合才是最理想的，并且认为依靠这种人才组合可以让
    AI 技术在某行业顺利落地并得到应用。这期间我们看到做医疗影像 AI 的公司招聘了医院影像科医生，做安防应用的 AI 技术公司招聘了公安技防专家。行业专家的加入确实带来了一些改变，行业专家了解行业，能为技术指明应用方向，因此对
    AI 技术在行业落地应用起到了一定的作用。但在多数情况下，行业专家的作用并没有达到预期。


    （1）AI 是一项全新的技术，只有深入理解它的本质并善加利用，才能使其应用成果达到预期，而行业专家对此并不擅长。

    （2）行业专家长期处于某个行业中，因此产生了行业局限。而技术应用的很多场景是大幅改变甚至颠覆行业的，并且可能行业专家本身就是被颠覆的对象。行业专家可能会做出小改进，但难以做出大变革。

    （3）从技术、行业经验到产品，这是一次飞跃，需要很强的产品规划能力。行业专家能指出行业的痛点、需求，但并不擅长专业的产品规划。


    不理想的现实促使业界进一步思考，看来要想让 AI 技术顺利落地应用，除“AI 技术人才+行业专家”的组合之外，还需要新的角色，这样才能形成健全的组合。我们还需要两类重要人才：AI
    产品经理和 AI 商业人才。AI 应用需要的人才组合如下表所示。


    ![](img/epub_3148%3Cspan%20style=)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)6679_7"/>


    AI 应用需要的人才组合


    这样的人才组合的演变，在互联网技术的应用过程中已经完整地展现了。AI 业界已经开始意识到这个问题。以 DeepMind 公司为例，该公司博士云集，各位创始人都有很强的技术背景。2018
    年，该公司引入了第一位 COO（首席运营官），这才有了一位负责产品、运营的顶级高管。


    相信 AI 产品经理等人才的加入会使 AI 应用需要的人才组合更加健全，从而真正促进 AI 应用的长期繁荣发展。


    ## 本书的目标读者


    不同于 AI 普及书、AI 通识书，本书有更明确的目标读者。


    （1）未来的人工智能产品经理。他们现在可能是互联网产品经理，可能是对 AI 产品感兴趣的大学生、职场新人，也有可能是希望转行做 AI 产品经理的技术人员。

    （2）对人工智能应用的场景、产品、商业模式感兴趣，想系统了解这些内容的人士。


    ## 本书的内容结构


    本书的内容聚焦在当前的人工智能，讨论的是人工智能技术的落地应用，而不是技术本身。为了讲解清楚，我总共安排了 3 篇内容。


    第一篇是 AI 技术与 AI 商业篇，讲解技术商业的基本规律、AI 技术的实质和边界、AI 的商业格局和应用现状。后面两篇的内容都以第一篇为基础来展开。


    第二篇是合格 AI 产品经理篇，讲解合格 AI 产品经理的能力体系、AI 技术—场景的适配和 AI 产品规划。在本书中，第二篇占据了最大篇幅。


    第三篇是高级 AI 产品经理篇，讲解高级 AI 产品经理的能力体系、AI 技术—场景的洞察和设计 AI 商业模式。


    如果本书能够帮助读者形成对 AI 的系统认知，具备 AI 技术—场景的识别和洞察能力、AI 产品规划能力、AI 商业模式设计能力，我就感到非常欣慰了。让我们一起努力，从大趋势、大规律着眼，从具体的场景、产品、商业模式着手，以成功的应用来迎接人工智能的春天！


