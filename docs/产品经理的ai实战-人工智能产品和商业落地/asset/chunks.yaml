    # 合格 AI 产品经理篇


    AI 产品经理就是专职管理 AI 产品的专业人士，需要具备配套的能力体系。


    合格 AI 产品经理是 AI 产品经理的中坚力量，他们虽然还不能参与商业模式设计，但可以承担 AI 技术—场景适配及 AI 产品规划等重要工作，是 AI 技术落地应用不可缺少的人才。


    本篇将针对合格 AI 产品经理介绍 AI 产品、AI 产品经理的定义，AI 产品经理能力体系的杠铃模型，并以此为基础，比较详细地讲解 AI 技术—场景的适配，然后安排
    3 章分别介绍了 3 类公司的 AI 产品——互联网公司的 AI 产品、AI 技术公司的 AI 产品及传统行业的 AI 产品。接着在这 3 章的基础上，讲解
    AI 产品规划的流程和方法。最后讲如何快速成为 AI 产品经理。


