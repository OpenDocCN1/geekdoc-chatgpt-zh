    ## 7.3 AI 技术公司的最终用户产品


    近几年，出现一种趋势，越来越多的 AI 技术公司开始面向最终用户推出产品，既有面向企业的最终用户产品，又有面向消费者个人的最终用户产品。


    ### 7.3.1 中间产品的风险


    最终用户产品出现的原因有很多，但主要原因来自中间产品。中间产品对 AI 技术公司很重要，大多数 AI 技术公司都是靠中间产品起步的。但中间产品普遍存在一个非常大的风险——被替代的风险。正是为了避免这个风险，越来越多的
    AI 技术公司推出了最终用户产品。


    在我国有一个影响很大的 AI 落地应用——支付宝。支付宝广泛使用了人脸识别技术，不仅在手机 App 中使用，还在实体店铺中布设刷脸支付设备，如下图所示。


    ![](img/epub_31486679_74)


    支持支付宝刷脸支付的自助点餐设备，车马拍摄


    支付宝的人脸识别技术从起步就和 AI 技术公司旷视科技（Face++）合作。旷视科技为支付宝提供人脸检测、人脸识别、人脸比对的核心算法，后来发展成为支付宝的人脸识别技术方案提供商。


    另外，旷视科技还获得蚂蚁金服这样的大客户，这对旷视科技的发展非常有利，但中间产品存在容易被替代的问题。随着人脸识别技术的使用逐渐增加，尤其是 iPhone
    X 的 FaceID 大力推动了人脸识别技术的应用，支付宝及其所属公司蚂蚁金服，无论是基于成本还是基于战略考虑，都需要拥有自己的人脸识别技术。2017 年
    11 月，蚂蚁金服孵化的首家安全技术公司蚂蚁佐罗成立。很快，支付宝及蚂蚁金服平台下的人脸识别技术改用了蚂蚁佐罗的产品，而旷视科技的产品也因此被替代。


    我们再看一个语音技术领域的例子。Nuance 公司曾是全球语音技术领域的领先者，它是苹果、Google、亚马逊、三星等公司的语音技术供应商，其在巅峰时刻占据了全球语音市场约
    70%的份额。但是，它同样很难解决中间产品容易被替代的问题。随着语音技术从原来的边缘技术逐渐演变成核心技术，那些巨头客户也纷纷开始研发自己的语音技术。在这些巨头面前，语音技术的壁垒并没有想象的那么高。Nuance
    公司接连失去几个大客户，很快就走向衰落了。之后，该公司由语音技术供应商被迫向行业解决方案商转型，其股价和市值也大幅下跃。


    ### 7.3.2 最终用户产品的价值


    既然中间产品存在容易被替代的风险，直接面对最终用户推出产品就成了顺理成章的对策。例如，同样是语音技术巨头的科大讯飞，近几年已经在直接面对最终用户的产品上发力，并于在
    2016 年年底成立消费者业务部门，面向最终用户推出了讯飞翻译机等产品。


    旷视科技也针对 B 端用户推出了物流机器人等最终用户产品。以旷视 MegMaster T800 机器人为例，这是一个软硬一体的产品。其结合了 AI 技术和机器人技术，通过贴在地面上的二维码来导航，可实现搬运、分拣、托举、存储等功能，适用于物流、制造等场景。MegMaster
    T800 机器人如下图所示。


    ![](img/epub_31486679_75)


    MegMaster T800（最大承载力 800kg）机器人，来自旷视科技官网


    AI 技术公司纷纷推出最终用户产品，主要看中了它以下两个优点。


    （1）最终用户产品更加综合，避免了中间产品单一的技术指标和价格比拼。


    最终用户产品多数是软硬一体的产品，是由专门的硬件和 AI 技术集成的一个整体。其不仅包含 AI 技术，还包含工业设计、定价、形象包装等众多因素。AI 技术公司的操作空间比较大，抓住最终用户产品的一两个点做出特色就能在市场上立足。相比之下，AI
    中间产品的要素非常单纯，主要依靠关键技术的指标和价格比拼，这就使 AI 技术公司面对的竞争非常直接。


    （2）最终用户产品可以直接与最终用户建立紧密联系，具有更持久的价值。


    AI 技术公司可以依靠一款最终用户产品先和最终用户建立直接联系，然后不断推出新的最终用户产品，持续挖掘用户价值。小米及其关联公司已经证明了这个模式是可行的，很多
    AI 技术公司也希望复制这种模式，所以纷纷推出了自己的最终用户产品。


    但是，与中间产品相比，最终用户产品也存在很多问题。AI 技术公司只有解决好这些问题，才能真正发挥最终用户产品的优势。


    ### 7.3.3 最终用户产品案例


    2B 最终用户产品和 2C 最终用户产品之间又有比较明显的区别。下面我们就先来研究两个 2B 最终用户产品案例。


    1\. 2B 最终用户产品案例 1——为目标场景深度定制


    语音转化成文字的功能已经很普及了，很多输入法就能实现而且是免费的。虽然通用场景可能没有产品机会了，但如果我们聚焦到细分场景，就有可能找到产品机会。因为细分场景有自己的独特需求，通用产品通常无法满足这种需求，这正为专用产品提供了机会。


    典型的例子就是云知声公司针对医疗场景的语音录入产品。该公司提供的数据表明，云知声的语音录入产品的识别准确率超过 97%。为什么云知声的产品可以做到如此高的识别准确率？因为该产品深刻理解了医疗场景的特点，并针对这些特点采用了针对性的解决方案，所以取得了良好的产品效果。其主要针对以下两个重点采取了解决方案。


    （1）针对大量的医疗术语。


    医疗场景中含有大量的医疗术语，而且不同科室还有各自的术语。云知声采用的是分科室进行语言模型训练的方法，这样就提高了各科室专有名词的识别效果。尤其是医疗特殊符号、特殊单位，识别效果较为突出。


    （2）针对非常嘈杂的环境。


    医院普遍非常嘈杂。云知声采用了“专用硬件+配套软件”的方式来解决问题。硬件是医疗语音录入专业麦克风，如下图所示。


    ![](img/epub_31486679_76)


    医疗语音录入专业麦克风


    这是飞利浦公司为医疗语音录入系统制造的专业麦克风，在欧美市场的占有率很高。这种专业麦克风具有定向音频增强功能，适合应对嘈杂环境。再加上语音增强、信道及说话人规整技术，可以有效抑制噪音的干扰，显著提高嘈杂环境下语音识别的准确率。


    正因为云知声公司对医疗场景特点的透彻理解，才使得产品能够很好地满足用户需求，进而使这个需要付费的产品得到了协和医院等知名医院和机构的认可。


    AI 产品经理如果要规划最终用户产品，应该向这个产品学习，充分理解目标场景的特殊性，然后规划出具有针对性的产品。


    2\. 2B 最终用户产品案例 2——小场景切入


    有些 AI 技术公司没有推出中间产品，而是起步就推出最终用户产品，蓝河科技公司就是如此。这是一家美国的 AI 技术公司，它是农业 AI 领域的标杆，致力于为农场主这个
    B 端用户打造 AI 产品。


    蓝河科技公司的最终用户产品特别值得学习的地方是小场景切入。该公司虽然有很强的 AI 技术实力，选择的也是农业这个大场景，但它没有推出“农场 AI 整体解决方案”这样的大产品，而是从小场景切入，推出了一个个针对小场景的产品，并取得了显著的成效。


    该公司于 2011 年成立，当年就推出了第一款产品 Lettuce Bot（生菜机器人）。Lettuce Bot 能够利用 AI 技术准确高效地判断每株生菜的状态，并精确地进行田间整理。该公司的数据显示，一台
    Lettuce Bot 一天可以整理 40 亩（1 亩≈666.67 平方米）生菜地。


    从产品名称就可以看出，它只针对生菜这一种农作物。但正因为针对的农作物只有一种，AI 模型容易训练，产品也能很快地打造完成。因此，该公司的第一款产品就取得了成功。


    该公司后续又推出了多种产品，每种产品都只针对一个小场景。公司的产品战略是，每种产品针对一个小场景，依靠众多的产品来实现更广的用户覆盖，而不是单纯依靠一个覆盖众多场景的产品。


    该公司的另一个典型产品是 See & Spray，其也是针对小场景的产品。该产品是一个整体设备，由拖拉机拖挂在田间行走。其工作原理如下图所示。


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)"1109px" data-w-new="677px" src="https://res.weread.qq.com/wrepub/epub_31486679_77"/>


    See & Spray 的工作原理


    如上图所示，摄像头拍摄到植株后，由 AI 系统识别出它是农作物还是杂草，然后控制喷头对准杂草喷洒除草剂。而传统的农业喷洒方式非常粗放，不仅将除草剂喷洒到杂草上，也喷到了农作物和土地上。利用
    AI 技术既能保证除草效果，又能大幅减少除草剂的使用量，在降低成本的同时还有利于保护环境。该公司提供的数据表明，在保证同样效果的前提下，除草剂的用量只是传统方式的十分之一。利用
    AI 技术后的实际喷洒效果如下图所示。


    ![](img/epub_31486679_78)


    利用 AI 技术后的实际喷洒效果，只有杂草被喷洒了除草剂（土地上的深色部分）


    该产品很好地解决了一个问题——精准喷药，上市之后很快获得了客户认可。2017 年，该公司被全球知名农机公司 John Deere 以 3.05 亿美元收购。下图是
    John Deere 公司的一款农机设备。


    ![](img/epub_31486679_79)


    John Deere 公司的一款农机设备


    之后，蓝河科技公司继续针对小场景开发产品，逐步开发适合大豆、大麦、玉米等农作物的产品。John Deere 公司的发言人表示，收购蓝河科技公司的重要原因之一，就是该公司的产品可以扩展到多种农作物。


    3\. 2C 最终用户产品案例


    AI 技术公司的最终用户产品，既有 2B 最终用户产品又有 2C 最终用户产品。上文我们研究了两个 2B 最终用户产品，现在我们再来谈谈 2C 最终用户产品。


    2C 最终用户产品可以和众多的用户建立联系，但这类产品在商业运作上通常是较困难的。2C 最终用户产品虽然进入门槛低，但成功门槛非常高。当前，市场的整体状况是产品过剩、品牌过剩。要想争夺用户，只有好产品是远远不够的，还要花大力气建渠道、做市场推广，另外价格战往往也难以避免。


    2C 最终用户产品要想成功，除了要有 AI 技术，还需要众多其他因素。但在通常情况下，AI 技术公司除了 AI 技术，对其他因素往往并不擅长。以华为公司为例，我们看到了该公司在手机（典型的
    2C 最终用户产品）上的成功，认为该公司成功的主要原因是技术强。其实，手机产品的竞争是综合竞争，华为公司取得成功绝不只是依靠技术。实际上，华为公司除技术之外，在工业设计、产品、定价、销售渠道、市场宣传方面都做得非常好，这样才取得了成功。想学习华为公司的
    AI 技术公司，要先考虑自己能否做好除 AI 技术之外的其他方面。一个 AI 技术公司一旦决定做 2C 最终用户产品，基本就要脱胎换骨，发展其除 AI 技术之外的众多因素，只有这样才有可能取得成功。


    有用户优势的互联网大公司也开始重视 2C 最终用户产品。以智能音箱为例，我们看到阿里巴巴、腾讯、百度都有自己的智能音箱，并依靠超低价格、强大的推广能力占据了大部分市场。如果一家
    AI 技术公司也想做智能音箱，就避不开和这几个巨头的竞争。2C 最终用户产品的竞争所涉及的因素如此之多，主要依靠 AI 技术是很难取得竞争优势的。另外，在巨头面前，AI
    技术的壁垒能维持多久呢？


    AI 技术公司要想做 2C 最终用户产品，虽然可以通过开拓新品类避开巨头，但即便做到了，情况也不乐观，原因有以下几点。


    （1）如果开拓了一个新品类，当市场规模较小时，大公司按兵不动，小公司要辛苦开拓市场。


    （2）如果市场规模进一步扩大，大公司可能并不放在眼里，但同行业的 AI 技术公司可能会推出类似产品来争夺市场。一个不大的市场就可能面临激烈的竞争。


    （3）一旦市场规模到了一定程度，大公司就很有可能强力切入，依靠简单的价格战快速抢占市场。


    科大讯飞的翻译机就处在第二阶段。只是因为科大讯飞在语音技术方面确实处于领先地位，所以还没有面临太大竞争，还可以卖出高价，获取较高的利润。同时，翻译机这种产品的市场没有大到让大公司心动的地步。如果我是科大讯飞的
    CEO，我一定会非常矛盾——既希望市场扩大，又担心市场太大。


    在这个方向上，AI 技术公司有以下几条出路。


    （1）开创 2C 最终用户产品新品类，并且因为做得非常好，始终占据优势地位。例如，苹果用 iPhone 开创了触屏智能手机品类，至今仍在市场占据重要地位。


    （2）开创 2C 最终用户产品新品类，该品牌有一定规模但没有大到吸引巨头，足以让 AI 技术公司生存发展。


    （3）开创 2C 最终用户产品新品类，当规模扩大到一定程度被巨头看上时，被巨头以合适的价格并购。可以是整个公司被并购，也可以是该业务板块被并购。


    所以，我认为 2C 最终用户产品是 AI 技术公司较难的业务。AI 技术公司要对 2C 最终用户产品非常谨慎。如果一定要做，那就要做好充分的准备，包括人才、资金及足够的耐心。


