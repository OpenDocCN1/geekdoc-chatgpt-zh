    ## 当前的人工智能


    “当前”要从 2012 年左右算起，具体会持续多久尚不明确。这个阶段的人工智能主要基于机器学习尤其是深度学习，且已在多个单项能力上超越了人类。从实现的结果上看，其似乎具备了一定的智能，但究其实质，当前的人工“智能”还是来自数值计算，与人类智能的内在机理还有本质区别，所以在“智能”一词上加了引号。


    当前的人工“智能”仍然是计算机科学领域的一个分支，但已经成了非常热门的分支。


    ### 未来的“人工智能！”


    未来的“人工智能！”是指未来可能实现的通用人工智能和强人工智能。如果实现了，一定是人类历史上非常重大的事件，将对人类社会乃至人类存在的意义产生根本性影响。这个阶段的人工智能才是真正的智能，“智能”一词后面的感叹号表达了这种震撼。


