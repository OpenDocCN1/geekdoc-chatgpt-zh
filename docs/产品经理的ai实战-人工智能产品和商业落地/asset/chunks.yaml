    云与端几乎都是需要全新购置的，初始费用很高。企业客户采用AI质检方案，通常要一次性支付大笔费用。如果是信誉优良的大企业，或许可以通过分次付费或者引入融资租赁方式，但大量的中小型企业显然很难获得这个条件采取这种方式。


    一次性支付大笔费用就成了产品销售的障碍。分次付费或者持续按需付费是一种很好的方式，但采用这种方式会对供应商产生很大风险。


    ## 13.2.2 AI工业质检商业模式——按月、按量付费


    虽然现在AI技术用于工业质检已经比较成熟（至少在某些产品中），而且有数据来佐证，但仍然只有少数大企业在使用，业务规模远远达不到预期。依靠原有的做项目、卖设备的商业模式是无法从根本上解决问题的，AI工业质检需要新的商业模式。


    绝大多数工业设备在运行时是脱离供应商控制的，但AI工业质检设备不是。它的智能主要来自供应商掌控的云端，而且能力的升级也要依赖云端。供应商有了这个掌控力，分次付费的风险就会大大降低。如果用户不按时付费就无法正常使用，更无法转卖给他人。这就为新模式的启用创造了机会。对于AI工业质检设备，比较适合的模式是按月、按量付费模式，也可以形象地将其称为“给机器人发工资”。


    在这种模式下，企业客户首次支付的费用明显减少，以后按月支付费用。传统模式相当于购买设备，新模式相当于购买生产力，这是两种模式间的根本区别。这个模式相比传统模式有什么好处呢？


    （1）适合企业客户的习惯，容易被客户接受。


    以前，企业客户通过质检工人进行工业质检，要按月给质检工人发工资。这是企业习惯的方式。现在使用了AI工业质检设备进行质检，企业客户还可以保持原有的习惯，按月“发工资”——给AI工业质检设备“发工资”。


    （2）改变客户的决策性质，更容易实施。


    在这种新模式下，虽然供应商利润滞后、存在商业风险，且需大量融资，但这种模式却给企业客户的机械换人提供了便利。企业客户为质检购置设备，在传统模式下属于固定资产投资，决策难度大、周期长；在新模式下属于管理优化，把“给人力发工资”换成了“给机器人发工资”，决策难度小、周期短。


    （3）按月、按量付费非常灵活，充分考虑了企业客户的利益。


    客户使用量大，就多付费；使用量少可以少付费。而传统的一次性付费模式无法做到这一点。


    ## 13.2.3 AI工业质检模式的升级


    1\. AI工业质检模式的升级之一——质检外包服务


    上述模式适应了企业客户的特点、充分考虑了客户的利益，对开拓市场非常有利，这个模式无疑是有价值的。但我们也要看到这个模式产生的新的问题——对AI工业质检服务商的现金流不利，在传统模式下服务商可以一次性收到大笔资金，但在新模式下只能一点点收回资金。


    针对模式本身的缺陷，我们依然可以通过改进模式来解决，或者同时采用多种模式。


    除前面提到的一次性支付大笔费用和后续按月、按需付费方式之外，还有一种新方式——企业用户不需要采购设备，而是直接采购AI质检服务，按检测量付费。AI工业质检服务商将AI质检服务外包出去，负责提供设备及维护设备，甚至配套少量人力。


    在这种模式中，只要AI工业质检服务的检测效果好、成本低，就可以快速开拓市场。这种商业模式还可以构建很高的商业壁垒，因为客户一旦习惯这种付费方式，就很难接受一次性支付大笔费用的方式。实体设备、积累的云端智慧都是客户的迁移门槛，一旦客户习惯于某公司的服务并对其服务感到满意，便不会轻易改变。其他看好这个领域的公司也很难从其手中抢走客户资源。


    2\. 商业模式的升级之二——基于质检数据的金融化


    AI工业质检服务商采用了新的商业模式，也就有了稳定的现金流，这就是金融化的基础。美国华尔街流传着一句话“如果有稳定的现金流，就可以将它证券化。”当AI工业质检服务商稳定的现金流达到一定规模时，就可以通过证券化方式向金融机构融资，从而支持其业务发展。


    这些业务量是可以用数据证明的，而且金融机构可以即时审计。金融机构控制了风险，就会降低利率。这样公司就不必过度依赖VC、PE（私募股权投资）、IPO（首次公开募股）方式来融资，可以直接从传统金融机构获取大额、低成本资金，满足公司发展的需求。


    金融化的另一个方式是为企业客户提供金融增信。企业客户同样有金融需求，传统金融机构对企业客户发放贷款主要考虑的是其抵押资产，因为金融机构并不了解企业客户的真实生产和经营状况。AI工业质检系统实际上也是一个生产状态监测系统。这样，金融机构就对企业客户的生产情况有了非常直接的了解，而且非常容易远程获取信息（当然要经过客户允许），这相当于为企业客户提供金融增信。提供了这种重要的辅助信息，AI工业质检服务商可以向金融机构直接收费，或者向企业客户收费。而其司这样做几乎没有增加成本，只是开放了接口，让金融机构实时获取检测数据，从而推断企业客户生产经营的实际困难。


    这种模式和支付宝的芝麻信用分的作用道理相同。支付宝的用户都有一个芝麻信用分，与支付宝合作的机构（趣店就曾经合作过）可根据信用分做出很多决定，如决定是否发放小额贷款及贷款额度，是否可以免押金租用产品等，便于合作机构在控制风险的前提下，更好地开展业务。实践证明，这种明显有别于传统金融机构的风控手段，成本低、效率高，适用于很多场景。


    上述商业模式并不是我的凭空想象，实际上已经部分得到了实战验证，如已经有工业客户在采用按月付费的方式使用AI工业质检服务。


