    \  | ID：EPUB\\_20260428160408 \n\n# 后记\n\n关于人工智能的书已经非常多了。这些书大多数属于以下两类：\n\n（1）人工智能的科普书、通识书，主要是向公众普及人工智能的知识，研究人工智能对人类社会的影响；\n\
    \n（2）人工智能的专业技术书，主要是向专业技术人员深入讲解人工智能的技术、工程细节。\n\n而从商业应用角度讲人工智能的书还很少。随着人工智能的快速发展，人们从产品、商业模式的角度理解人工智能的需求越来越强烈，尤其是产品经理的需求。而产品、商业模式又正是我擅长的，于是我写了这本书。\n\
    \n本书拥有坚实的素材基础，既有AI业界的前沿探索，又有我的咨询客户的实战案例，还有我本人的切身体验。以这些素材为基础，我总结、提炼出了关于AI产品、AI商业模式及AI产品经理的原创理论、模型和方法，希望能给产品经理提供切实的帮助。\n\
    \n如果本书能对AI产品、AI商业模式的创新起到一定作用，能对产品经理在人工智能时代的能力体系构建及职业发展提供一定帮助，作为一个用理论武装头脑的实战家，我就非常满足了。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n为AI产品规划、商业落地，提供理论框架、参考案例、实战方法为AI产品经理的入门与升级，提供能力体系、成长路径、实战指导\n\
    \n名家力荐\n\n产品经理是一个要积极拥抱变化的职业。产品经理已经从PC时代进入了移动时代，目前正在进入人工智能时代。越来越多的产品已经或正在高度AI化，这个趋势正如已经完成的产品移动化一样不可阻挡。产品经理要想让自己保值、增值，必须积极拥抱人工智能的大趋势。本书正是为了满足产品经理的需求而作，有案例、有理论、很实战，而且原创度相当高，值得广大产品经理认真阅读。\n\
    \n——老曹〔曹成明〕人人都是产品经理社区、起点学院创始人兼CEO\n\n看过很多本与AI产品相关的书，毫无疑问，这是目前为止框架最大、最完整的作品之一。可能得益于作者更加资深的经历，书里谈到了AI技术、产品化、商业落地及AI产品经理多个话题，又互相关联形成一个整体，很适合作为从业者的案头工具书，值得阅读。\n\
    \n——苏杰 良仓孵化器创始合伙人、“人人都是产品经理”系列图书作者\n\n我很认同本书的观点一AI技术本身不产生价值，只有应用落地才能产生价值。AI从业人员尽管各有分工，但都需要系统理解AI产品、AI商业模式。这样才能有共同语言，协力打造好产品之拱、商业模式之拱，让AI应用之桥畅通。\n\
    \n人工智能时代的到来，既为产品经理提供了重大机遇，又对产品经理提出了重大挑战。从产品和商业角度理解AI技术、理解AI技术的实用落地规律、看懂AI产品、上手AI产品规划、系统提升AI产品能力体系等，是广大产品经理要面对的一连串挑战。本书正是为了帮助广大产品经理迎接这些挑战，从而抓住机遇获得更好的职业发展。\n\
    \n——杨通鹏 北京旷视科技有限公司CIO、华为技术有限公司中国区前CIO\n\n\\[https://t.me/+WwC4dCWvXRdhOTNh\\]\
