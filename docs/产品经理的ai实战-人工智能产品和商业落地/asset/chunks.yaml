    # 高级AI产品经理篇


    与合格AI产品经理相比，高级AI产品经理只有具备更健全的能力体系，才能在企业中发挥更大的作用。对AI技术公司和传统企业的AI应用而言，高级AI产品经理是宝贵的财富和稀缺资源。


    高级AI产品经理是一个层次，而不是一个具体的职位头衔。真正达到这个层次的AI产品经理，其职位头衔通常已经不是经理，而是产品总监、产品副总裁甚至是首席产品官。


    本篇比合格AI产品经理篇更加精简，主要讲3个问题。


    （1）高级AI产品经理的能力杠铃模型，简称高级AI杠铃。

    （2）AI技术—场景洞察。对于AI技术—场景，合格AI产品经理只需要做到适配即可，而高级AI产品经理要达到洞察的层次。只有做到了对AI技术—场景的洞察，高级AI产品经理才有可能做出好产品。

    （3）AI商业模式设计。AI商业模式设计主要由AI创业家、企业家来承担，但高级AI产品经理应该积极参与，在这个重大事项中尽量发挥作用，体现自己的价值。商业模式和产品是紧密关联、彼此影响的。高级AI产品经理对产品比较了解，因此如果能深度参与商业模式设计，就可以让商业模式更贴近产品。另外，高级AI产品经理只有深度参与商业模式的设计，才能深入理解商业模式，才能使其更好地通过产品来落实。


