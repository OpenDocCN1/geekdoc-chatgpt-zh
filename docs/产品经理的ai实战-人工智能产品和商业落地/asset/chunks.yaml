- raw: "![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_92)\n\n在前台无人问津的接待机器人，车马拍摄\n\
    \n相对其他方案，AI解决方案其实有一个很大的问题，而AI技术公司对外宣传、对客户宣传都极少提到这个问题，那就是AI解决方案需要持续付费。因为AI解决方案通常要依赖云端智慧的成长，还要依赖云端算力，所以AI解决方案往往意味着需要持续付费。这是AI解决方案的特点，但如果横向比较这也可能是它的缺点。因为这和大多数客户的购买方式有很大不同，尤其是我国的企业更习惯一次性付费。\n\
    \n仅仅这一问题可能就会构成很大的障碍。目标客户一方面难以接受新的支付方式，另一方面也存在顾虑。应用效果好，担心AI供应商乱涨价；还担心AI供应商的持续服务能力，如果用了两年用得很好，突然AI供应商倒闭了，云端突然不可用了，就会对自己公司的业务产生严重影响。而购买设备就可避免这种问题，即便设备供应商倒闭了，设备还能继续使用。\n\
    \n所以，切换一下视角和立场，和AI应用的目标客户（同时也包括很多非AI应用的客户）多沟通，你就会有更强的客户视角，这样才能真正跳出AI的圈子，做好AI产品。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 12.2 对AI技术—场景价值的洞察\n\n合适的AI技术—场景组合只是解决了AI技术的可行性问题，接下来要判断AI技术—场景组合有什么价值？有多大价值？这就是AI技术—场景的价值洞察。\n\
    \n与AI技术适配的场景有很多，但各自蕴含的商业价值是不同的。我们应该优先选择高价值的场景切入。所以，对AI技术—场景的价值洞察就显得非常重要。\n\n我们以AI在汽车驾驶中的应用为例。一直以来，L5级别的全自动驾驶备受关注，一旦实现的确具有非常大的价值。但问题是，L5级别全自动驾驶实现的难度非常大，人们普遍认为还需要15年以上的时间才有可能实现。相比之下，AI自动泊车在近期的商业价值更大。\n\
    \n自动泊车场景的需求大，其AI技术难度比L5级别全自动驾驶的技术难度要低得多，相应的产品售价也不会太高，可能成为中高端汽车的标准配置，具有很大的市场价值。那些在AI自动驾驶领域钻研的公司，可以尝试从AI自动泊车场景切入，也许能更快挖掘出其中的商业价值。\n\
    \n商业价值不一定和技术难度成正比。有些场景的商业价值大，但涉及的技术并不复杂。高级AI产品经理应该多考虑这样的场景，或者先在这样的场景中立足，然后再去切入其他更难的场景。\n\
    \n#### 12.2.1 AI技术—场景价值洞察的例子\n\n1\\. 电梯轿厢场景的例子\n\n我们先看一个传统技术的例子。电梯轿厢具有很大的商业价值。分众传媒发现了其商业价值，并进行了挖掘。采用的技术很简单——制作印刷品挂板，将挂板直接固定在电梯轿厢的3个面（正对电梯门的一侧和左右两侧）上，可以更换里面的广告画面。\n\
    \n电梯轿厢的另一个面——电梯门所在的那一面，其商业价值更大，因为多数人在电梯轿厢中会面朝门所在的一面。但人们在较长时间内没有找到对应的技术来开发这一面的商业价值。电梯门是侧向滑动的，挂板太厚，不可能挂在这一面，否则电梯门无法正常开关。后来，有人想到可以采用超薄的强力贴纸，直接将广告画面贴在电梯门上。因为非常薄、粘贴非常牢固，所以不会影响电梯门的正常开关。电梯门的价值被挖掘之后，又有人发现了电梯门旁边很窄的那块空间的商业价值。空间就在电梯门的两侧，通常其宽度只有30厘米左右，而且一侧被按键面板占用。有人找到了适配这个场景的技术——定制的竖向液晶屏。这种液晶屏的宽度很窄，但比较高，宽高比在1:5左右。为了和大多数广告内容相适配，这个竖屏从上到下划分为多个广告区域，因此需要定制屏幕，这里涉及的技术显然比纯机械的广告挂板要复杂一些。一个电梯轿厢中3种广告媒体形式并存的场景如下图所示。\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)lt=\"\" class=\"width80\" data-ratio=\"\
    0.748\" data-w=\"1280px\" data-w-new=\"958px\" src=\"https://res.weread.qq.com/wrepub/epub\\\
    _31486679\\_93\"/> \n\n一个电梯轿厢中3种广告媒体形式并存，车马拍摄\n\n在一个电梯轿厢中，从左到右分别是相框式广告挂板、定制竖向液晶广告屏、电梯门贴纸广告，分别对应着3家不同的广告媒体公司。\n\
    \n看起来电梯轿厢的4个面的商业价值都已经被挖掘殆尽了。如果只使用上述技术，的确是这样。但如果主动寻找，可能还能找到相应的技术，形成新的技术—场景组合，进一步挖掘电梯轿厢的商业价值，如投影广告。投影广告包含两个部分，第一部分是贴在电梯门靠内一侧的投影布，这个投影布的材质类似会议室用的投影幕布，它本身没有内容，只是用来显示投影画面的；第二部分是吊挂在电梯顶部的微型投影机，当电梯门关闭时，微型投影机将广告画面（静态画面或视频）投影到幕布上，当电梯门打开时，投影暂停，避免使进入电梯轿厢的人感到晃眼。\n\
    \n2\\. 视频节目植入广告的例子\n\n再看一个AI应用的例子，以视频节目植入广告为例。以前的视频节目要植入广告，在拍摄之前就要确定客户、植入的产品及植入的形式，一旦开拍就很难更改，具有很大的局限性。节目最初没有找到足够的广告主，在节目制作完成播出一段时间后，即便有广告主感兴趣，但因为节目已经制作完成也很难再植入了。这个场景就蕴含着很大的商业价值，涉及的AI技术也已经很成熟了。影谱科技就在这个领域取得了商业成功。\n\
    \n其产品叫植入易，借助AI技术解决了节目拍摄完成后无法进行广告植入的问题。节目组利用该产品可以在任何时候通过即时贴、道具、动态视窗、神字幕、Logo等多种具体形式，将产品广告植入节目内容中。\n\
    \n以道具形式为例，在拍摄时嘉宾在侃侃而谈，嘉宾前面的桌子是空的。如果之后节目组接到了果汁企业的广告植入需求，就可以采用AI技术将该企业的果汁包装“放”在嘉宾前面的桌子上，而且光影效果非常逼真，就像实拍一样；如果接到了牛奶广告，那嘉宾前面的桌子上就“摆上”牛奶；如果接到了酱油广告，桌上就“摆上”酱油瓶；如果是快手这样的互联网产品，则可以植入产品的水晶牌。这种技术已经在《我是歌手第四季》《声临其境》等热门节目中得到了应用，如下图所示，普通观众根本看不出广告产品和水晶牌是后来植入的。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_94)\n\n影谱科技将快手短视频的水晶牌植入《声临其境》嘉宾的桌面\n\
    \nAI技术还可以实现广告画面与环境的紧密融合，将广告变成内容，使观众更容易接受，这种技术已经在《亲爱的客栈》等真人秀节目中得到了应用，具体如下图所示。\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh) data-w=\"554px\" data-w-new=\"311px\"\
    \ src=\"https://res.weread.qq.com/wrepub/epub\\_31486679\\_95\"/> \n\n影谱科技将碧浪的广告招贴植入《亲爱的客栈》真人秀节目场景中\n\
    \n这在商业上具有很大的价值。以前植入的广告是事先谈定的，招商进度严重影响节目的拍摄。如果拍摄时没有接到植入广告，而播出后节目走红，就会造成商业价值的流失。有了这种技术，招商进度对节目拍摄的影响就变小了。节目在开播一段时间之后如果引起了广告主的关注，那时再谈植入可以谈下更高的价格。其实，这对广告主也有利，广告主可以先看到节目样片甚至看到播出一两期后的效果，再选择是否植入广告，这也降低了广告的投入风险。\n\
    \n高级AI产品经理应该尽量从高商业价值、高技术确定性场景入手，但并不是永远停留在这些场景中，而是先在这样的场景中立足，先生存下来再去攻克更难的场景。\n\n\
    3\\. 矿场的例子\n\n再看一个矿场的例子。西安主函数智能科技有限公司对矿场这个场景有较深的理解，他们发现矿场（尤其是露天矿场）有一个明显的痛点——矿车运营成本很高。高成本主要来自两个方面：矿车司机的高成本和矿车的高油耗。矿车与露天矿场的环境如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_96)\n\n矿车与露天矿场环境\n\n\
    矿车体积巨大，矿车司机只有通过专门培训才能驾驶它。矿车司机的人力成本比普通司机人力的成本高得多，且很多矿场是24小时连续运转的，一台矿车要配置3~4个司机，每年的人力成本很高。矿车因为自重大、载重大，加上矿场又有大量的坡路，导致油耗成本非常高。\n\
    \n针对这个具体场景，如果我们从AI技术出发，那么可能想到的方案就是矿车的自动驾驶。确实有一些公司在开发相应技术，也取得了不错的应用效果。主函数智能科技有限公司也有这样的业务——对矿车投入50万元左右进行自动驾驶改造，运营一年左右可以收回改造投资。但该公司也没有放弃场景中的另一个可能——对油耗的改进，其推出了针对矿车的混联系统，具体如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_97)\n\n针对矿车的混联系统，适合下坡工况\n\
    \n上图的方案看上去只是已经普及的燃油—电池混动方案，是在电池、电机的辅助下，使燃油发动机尽量在较经济的状态下运转，达到省油的目的，但这个方案特别针对了矿场、矿车的特殊场景。矿区的路很少有平的，有很多的下坡。这个方案可以使矿车在下坡时通过发电机回收能量。正因为充分考虑了矿区的特点，应用了[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)具有针对性的技术，才取得了较明显的节油效果。由于矿车的高油耗和长时间运转，运营一段时间后节省的燃油费用就可以覆盖改造费用。\n\
    \n针对同一个场景、同样的客户，AI产品和非AI产品结合起来就构成了整体解决方案，可以形成组合竞争力。如果这家公司和其他公司去竞争同一个矿场客户，这家公司可以将矿车自动驾驶和混联系统结合起来，以发挥更大的价值，这样更有可能获得客户的青睐。毕竟，对客户而言，这样可以减少供应商的数量，便于实施和日后维护。\n\
    \n#### 12.2.2 洞察问题中潜藏的商业价值\n\n很多技术是一把双刃剑，应用于场景后不仅带来了利益也带来了问题，甚至是严重的问题。而这些问题中也很可能蕴藏着商业价值。\n\
    \n以互联网技术为例，互联网技术给人们带来了巨大利益的同时，也带来了一个严重的问题——互联网安全问题。在互联网上病毒横行，不仅影响用户体验、泄露用户隐私，还直接导致了大量的金钱损失。以360为代表的公司看到了这个问题中的价值，推出了360安全卫士、360杀毒等优秀产品，加上强有力的免费模式，最终挖掘出了巨大的商业价值，进而成为一家全球知名的互联网公司。\n\
    \n我们再看一个AI领域的例子。人脸识别技术一方面给人们带来了极大的便利，另一方面也带来了严重的隐私问题。用户担心自己的照片被用于其他用途。D-ID这家公司看到了其中的需求，推出了照片隐私保护产品，就是对用户的照片进行反AI处理。人眼可以正常识别处理之后的照片，所以不会影响照片的正常用途，但AI系统无法识别照片，这就避免了很多潜在风险。原始照片与D-ID反AI处理的照片如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_98)\n\n左侧是原始照片，右侧是经过反AI处理的照片\n\
    \n能洞察AI问题中潜藏的商业价值，是高级AI产品经理“高级”的重要体现之一。\n\n\\[https://t.me/+WwC4dCWvXRdhOTNh\\\
    ] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n### 12.3 对AI技术—场景障碍的洞察\n\n在识别场景价值时，高级AI产品经理除了要考虑价值，还要考虑障碍。技术在应用的过程中会遇到大量的障碍，有些障碍还是无形的。高级AI产品经理只有洞察了障碍，才能提前做准备去解决障碍。这和风险识别与风险管理是同样的道理。\n\
    \n#### 12.3.1 价值—障碍矩阵\n\n为什么在很多被一致看好的场景中，AI技术的应用并不顺利？根源就是我们往往只看到了价值，而忽略了其中的障碍，甚至还会进一步放大价值、缩小障碍，将真实场景扭曲了。\n\
    \n为了便于理解，我做了一个简单实用的矩阵图。AI技术—场景的价值—障碍矩阵如下图所示。\n\n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_99)\n\
    \nAI技术—场景的价值—障碍矩阵\n\n这个矩阵根据AI技术—场景的价值大小与障碍大小，将场景划分为4个区域，具体如下。\n\n（1）价值大、障碍小的区域，显然是商业上的黄金场景，要优先发展。\n\
    \n（2）价值大、障碍大的区域，是一块“硬骨头”，但也有很大价值，属于白银场景。\n\n（3）价值小、障碍小的区域，是价值较小的紫铜场景。当AI技术发展到成熟阶段时，黄金场景、白银场景被挖掘殆尽了，紫铜场景也是有价值的。同时，这个场景可能也适合一些初创公司。初创公司将自己的产品定位于紫铜场景，可以避开两个高价值场景的激烈竞争。\n\
    \n（4）价值小、障碍大的区域，是价值最小的黑铁场景。黑铁场景并非一无是处，其在商业上同样有价值。这个场景适合将前3个场景中形成的能力做成简单化、标准化的低成本产品来覆盖。虽然其单位价值小，但可以依靠规模来取胜。正如可口可乐，每一瓶的利润可能都非常微薄，但依靠巨大的销量仍然能获得可观的利润。\n\
    \n障碍来自很多[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)方面，如人力成本障碍、数据障碍、法律障碍等。有些障碍比较明显，有些障碍则隐藏得较深，需要高级AI产品经理深入挖掘。\n\
    \n#### 12.3.2 AI技术—场景障碍的例子\n\n1\\. 面包店的自助结算台\n\n下面用一个我亲身体验过的例子来说明AI技术—场景障碍——某公司布置在原麦山丘面包店的自助结算台，如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_100)\n\n原麦山丘面包店中的AI自助结算台，车马拍摄\n\
    \n用户将装有面包的托盘直接放在自助结算台上，机器会自动识别面包的品种和数量，并显示在屏幕上供用户核对。这个环节用到了机器视觉的AI技术。自助结算台计算出总价，用户就可以通过支付宝、微信支付等方式结算，结算完毕就可以带着面包离开。整个过程不需要店员介入。我实际体验过，虽然整个过程很流畅，但是我在进一步观察、思考后发现其中隐藏着很多障碍，导致其商业化会遇到很多问题。\n\
    \n第一个障碍比较明显，源于商品特征。原麦山丘面包店的卖点是正宗欧式面包，它比大多数面包房的面包要大。所以，在人工结算台的收银员旁边有专门负责切面包的店员，店员会主动询问“面包需要切吗”。以我本人为例，我都会选择切开。如果使用自助结算台，出于安全考虑不能摆刀让客户自己切。另外，还有装袋问题，操作熟练的店员处理起来又快又好，但客户自己就不一定了。专门配一个店员在旁边服务，要增加人力成本，与当初引进自助结算台的目的就背道而驰了。如果由柜台外店员在上货、清洁之余顺便提供服务，又很难做到及时。店员正在上货，这时一位客户说要切面包，店员就很难处理。而客户的需要如果不能及时得到满足，他就会产生不好的购物感受。这不是AI的过失，也很难用AI技术来解决，但它是AI应用真实存在的障碍。\n\
    \n第二个障碍是一个隐藏的障碍——店员的抵触。原麦山丘面包店的管理不错，店员普遍彬彬有礼，服务周到。但根据我多次购物时的观察，店员几乎没有主动向客户推荐过使用自助结算台，即便人工结算台已经排起了长队，如下图所示。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/epub_31486679_101)\n\n原麦山丘店内场景，车马拍摄\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)ntent\">上图左侧是人工结算台，在我前面已经排了好几位；右侧靠近玻璃门处一个店员的身后就有一个可以正常使用的自助结算台，但很长时间没有人使用。\n\
    \n原来最初该公司在店里演示，并向面包店的高层讲解其好处时，说到自助结算台将来可以取代店员。而这些话被在场的店员听到了，并在店员中传开了。于是，所有店员都对这个设备产生了抵触心理，这就是一个巨大的障碍。这样的设备摆在店铺中并不显眼，如果没有店员的积极推荐和引导，其使用量一定不高。为了观察到其具体使用数据，我曾经在一次购物后在店里坐了两个小时。在这两个小时中，即使人工结算台排起了10人以上的长队，店员也没有向客户推荐过使用自助结算台。其实，只要店员告知客户自助结算台的存在，就会有一定的客户尝试。如果店员再加以引导，就会有更多客户乐于尝试。\n\
    \n因此，从技术、产品上都被看好的自助结算台，其应用效果并不好。如果一直是这样的应用效果，可能不久后自助结算台就会被迫退场。毕竟它要占用宝贵的店铺面积，还要持续耗电。这样，想象中的由结算切入，扩展更多业务的商业模式也就无从谈起了。\n\
    \n目前，在AI行业还有很多这样的障碍真实存在却没有被察觉。这既是高级AI产品经理要面对的问题，又是体现其价值的机会。\n\n2\\. AI选址服务\n\n\
    对于实体零售业和服务业来说，选址是非常重要的，选址正确就成功了一半。目前，实体店铺更替频繁，每天都有大量的店铺开张，这对应着巨大的选址工作。传统的选址都是公司自己进行的，零售小店靠店主自己考察，连锁公司有专业团队按专业方式来选址。但即便是连锁公司，其选址方式也是很传统的方式。\n\
    \n其实，AI技术可以用在这个场景中，形成一个AI技术—选择场景的有效组合。基本做法是，公司在几个候选地址附近架设多台隐藏摄像头，这些摄像头各有分工，有些拍摄的范围大，有些拍摄的范围小。然后利用图像识别技术，将各摄像头中的全天人流量识别出来，如马路两边各有多少人经过，有多少人从对面马路过来，又有多少人走向对面马路等。拍摄候选地址附近店铺的摄像头，因为拍摄范围小，可以准确识别出有多少人进了哪些店铺，是否买了东西等。\n\
    \n利用AI技术，连续采集一周甚至更长时段的数据，绘制成24小时流量表。这与以前采用人工方式采集的数据相比，量更大，数据更全、更准确。公司可以将多个候选地址进行全面比较，再由有经验的选址人员结合店铺本身的产品、人群特色，做出选址决策。这样的选址方式明显优于传统选址方式。\n\
    \n目前，大多数的AI选址方式就是这样做的，但仔细分析，会发现其也存在一些障碍。\n\n上述做法以现有的AI技术就能做到，不需要科学家，只需要工程师将系统搭建出来。拥有这种技术的公司可以将它做成一个服务产品，但不可能很快。因为它有商业上的障碍，而且这个障碍很难突破，我们来分析一下。"
