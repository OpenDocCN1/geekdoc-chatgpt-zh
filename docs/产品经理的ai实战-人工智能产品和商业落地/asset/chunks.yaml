    再看一个数字——96.7%，这是北京朝阳区和西城区采用的路边停车自动计费系统的识别准确率。车主在划定的路边停车区停车后，不需要进行任何操作，可直接离开。架设在高杆上的摄像头会对停车区持续进行监控，利用AI技术识别车牌号并记录停车开始的时间。车主将车开走后，系统会根据时间差来扣费。车牌识别有一定的出错率，如将A车牌号错误地识别为B车牌号，从而错扣了B车主的钱。但因为路边停车涉及的费用不高，错扣停车费不是非常严重的问题，96.7%的识别准确率在这个场景中是能够被接受的。错扣停车费的问题可以通过事后纠错得到解决。如果B车主发现自己被错扣了停车费，可以通过申诉使费用退回。


    AI产品经理在进行AI技术—场景适配时，要把握适度原则，不要过于追求完美。


