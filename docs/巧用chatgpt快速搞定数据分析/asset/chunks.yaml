    \n**说明：** `肘部法则曲线`（`Elbow Method Curve`）是一种通过观察簇内误差平方和（`Sum of Squared Errors,\
    \ SSE`）随聚类数量变化的曲线确定最佳聚类数量的方法。在这条曲线中，随着聚类数量的增加，簇内误差平方和会逐渐减小。当某个聚类数量使簇内误差平方和的减小幅度变得不明显时，这个聚类数量就是肘部点，可以作为最佳聚类数量。这个方法的核心思想是寻找一个平衡点，既能保证聚类效果，又避免过度拟合。\n\
    \n`轮廓系数曲线`（`Silhouette Coefficient Curve`）是一种用于评估聚类效果的指标，取值范围为-1到1。轮廓系数越接近1，说明聚类效果越好；越接近-1，说明聚类效果越差。在轮廓系数曲线中，我们可以观察轮廓系数随聚类数量的变化情况。通过找到轮廓系数最大的聚类数量，我们可以得到最佳的聚类效果。这个方法的核心思想是找到一组聚类结果，使同一簇内的样本相似度高，不同簇间的样本相似度低。\n\
