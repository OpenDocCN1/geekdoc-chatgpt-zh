    \n### 7.2.2 使用`ChatGPT`进行层次聚类分析\n\n层次聚类是另一种无监督学习方法，用于将数据集划分为层次结构的簇。与`K-Means`聚类相比，层次聚类不需要预先确定簇的数量。层次聚类主要有2种方法：凝聚层次聚类和分裂层次聚类。在本小节中，我们将重点介绍凝聚层次聚类。\n\
    \n凝聚层次聚类的基本思想是将每个数据点视为一个独立的簇，然后通过计算簇之间的相似性，逐步将最相似的簇合并成更大的簇。这一过程一直持续到达到某个停止条件，如簇的数量达到预设阈值。以下是凝聚层次聚类的基本步骤。\n\
    \n1.  **初始化**\n    将每个数据点视为一个独立的簇。开始时，簇的数量等于数据点的数量`N`。\n\n2.  **计算相似度矩阵**\n  \
    \  计算所有簇之间的相似度（或距离）。相似度度量可以是`欧几里得距离`、`曼哈顿距离`或其他自定义距离度量。相似度矩阵`D`的大小为`N×N`，其中`D(i,\
    \ j)`表示簇`i`和簇`j`之间的相似度。\n\n    在凝聚层次聚类中，我们需要计算簇之间的距离。不同的距离度量方法和簇间距离度量方法将影响算法的性能。常用的距离度量方法如下。\n\
    \n    1.  **欧几里得距离（`Euclidean Distance`）**\n        对于数据点`x`和`y`，欧几里得距离为\n   \
    \     ![](Images/9787301342022_Figure-0278-0320.jpg)\n\n    2.  **曼哈顿距离（`Manhattan\
    \ Distance`）**\n        对于数据点`x`和`y`，曼哈顿距离为\n        ![](Images/9787301342022_Figure-0278-0321.jpg)\n\
    \n3.  **合并簇**\n    找到相似度矩阵`D`中具有最小距离（或最大相似度）的两个簇`i`和`j`，并将它们合并成一个新的簇。新簇的数量减少1。\n\
    \n    在层次聚类中，常用的合并策略有以下几种。\n\n    1.  **单连接（最小距离）**\n        新簇与其他簇之间的距离定义为原始簇中最接近的数据点之间的距离。\n\
    \        ![](Images/9787301342022_Figure-0278-0322.jpg)\n\n    2.  **完全连接（最大距离）**\n\
    \        新簇与其他簇之间的距离定义为原始簇中最远的数据点之间的距离。\n        ![](Images/9787301342022_Figure-0278-0323.jpg)\n\
    \n    3.  **平均连接（平均距离）**\n        新簇与其他簇之间的距离定义为原始簇中所有数据点与其他簇中数据点之间距离的平均值。\n \
    \       ![](Images/9787301342022_Figure-0279-0324.jpg)\n        这里，`A`和`B`是要合并的簇，`C`是其他簇，`d(a,\
    \ c)`表示数据点`a`和`c`之间的距离。请注意，在这些公式中，我们使用距离作为相似度度量。当然，也可以选择其他相似度度量计算相似度矩阵。\n\n4.\
    \  **更新相似度矩阵**\n    更新相似度矩阵`D`以反映合并后的新簇。根据所选的合并策略（如`单连接`、`完全连接`或`平均连接`），重新计算新簇与其他簇之间的相似度。\n\
    \n5.  **迭代**\n    重复步骤3和4，直到达到停止条件，如簇的数量达到预设阈值。\n\n6.  **绘制树形图**\n    `树形图`是层次聚类过程的可视化表示，它以树状结构展示了簇合并的过程。在`树形图`中，横轴表示数据点，纵轴表示簇间距离。每当2个簇合并时，`树形图`上就会形成一个新的分支。通过观察`树形图`，我们可以确定合适数量的簇。\n\
    \n要合理使用层次聚类分析，需要了解其基本原理和方法，并选择合适的距离度量方式和聚类算法。此外，还需要处理数据集的缺失值和异常值，选择合适的聚类数目和截断点，并对聚类结果进行可视化和解释。最后，还需要对聚类结果进行评估和验证，以确保其可靠性和稳定性。因此，合理使用层次聚类分析需要对其各个方面有一定的了解。\n\
    \n`ChatGPT`是基于`GPT`架构的大型语言模型，可以快速而准确地实现层次聚类，从而对数据进行分析。下面我们将通过一个通用数据集的示例演示使用`ChatGPT`进行层次聚类分析。\n\
    \n`Mall Customer Segmentation`数据集是一个关于商场客户的数据集，旨在帮助商家了解客户群体，从而制订更有效的市场营销策略。这个数据集包含了客户的性别、年龄、年收入和消费评分等信息，以便对客户进行细分。以下是数据集的特征描述，如表7.10所示。\n\
