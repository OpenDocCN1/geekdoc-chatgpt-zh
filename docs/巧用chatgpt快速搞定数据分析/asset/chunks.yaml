- raw: '图8.9 Hadoop架构


    HDFS是一种分布式文件系统，可以在多台机器上存储和管理大量数据。它具有高容错性、高吞吐量和可扩展性等特点。HDFS采用主从架构，包括NameNode（主节点）和DataNode（数据节点）。NameNode负责管理文件系统的元数据（如文件名、目录结构等）,DataNode负责存储文件的实际数据。而MapReduce是一种编程模型，用于处理和生成大量数据集。它包括2个阶段：Map阶段和Reduce阶段。Map阶段负责处理输入数据并生成键值对（Key-Value
    Pair）,Reduce阶段负责对Map阶段生成的键值对进行汇总和计算。这种模型允许在多台机器上并行处理大量数据。


    在Hadoop中，文件被切分成多个固定大小的数据块（默认128MB或64MB），这些数据块分布在不同的DataNode上。这种切分方式提高了数据的并行处理能力。为了保证数据的可靠性和容错性，Hadoop会将每个数据块复制多份（默认3份）并存储在不同的DataNode上。当某个DataNode发生故障时，可以通过其他DataNode的副本恢复数据。同时，在任务调度方面，Hadoop采用YARN（Yet
    Another Resource Negotiator，另一种资源协调器）进行资源调度和任务管理。YARN包括ResourceMa-nager（资源管理器）和NodeManager（节点管理器）。ResourceManager负责整个集群的资源管理，NodeManager负责单个节点的资源管理和任务执行。


    Hadoop广泛应用于以下各种场景。


    （1） 日志分析：处理和分析大量日志数据，如Web服务器日志、系统日志等。


