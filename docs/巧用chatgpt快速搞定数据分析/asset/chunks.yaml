    the sum of squared errors between predicted and actual values, i.e., minimizes
    the loss function:


    ![](img/9787301342022_Figure-0199-0203.jpg)


    Where `L(β)` represents the loss function, `y` represents actual values, `x` represents
    the independent variable, and `β0, β1, ..., βn` represent the coefficients of
    each term.


