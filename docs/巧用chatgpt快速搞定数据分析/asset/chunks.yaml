    # Classic CNN Architectures


    Besides the Convolutional Neural Networks (CNNs) constructed above, in the field
    of data analysis, particularly computer vision, there are many famous CNN architectures
    that have achieved significant results on various tasks. The following are some
    classic CNN architectures.


    ## LeNet-5


    **LeNet-5** is a convolutional neural network architecture proposed by Yann LeCun
    in 1998, primarily used for handwritten digit recognition tasks. This is one of
    the earliest architectures in CNN history, laying the foundation for the subsequent
    field of deep learning.


    ## AlexNet


    **AlexNet** is a CNN architecture proposed by Alex Krizhevsky, Ilya Sutskever,
    and Geoffrey Hinton in 2012. It achieved breakthrough results in the ImageNet
    image classification competition that year, bringing widespread attention to CNNs
    in the field of computer vision.


    ## VGGNet


    **VGGNet** is a CNN architecture proposed by the Visual Geometry Group (VGG) at
    the University of Oxford in 2014. It effectively improved the network''s representational
    capacity by using smaller convolution kernels (e.g., `3×3`) and stacking multiple
    layers. VGGNet has multiple versions, such as `VGG-16` and `VGG-19`, containing
    16 and 19 layers respectively.


    ## Inception (GoogLeNet)


    The **Inception** series of network architectures is a CNN structure proposed
    by Google researchers in 2014, with its initial version known as **GoogLeNet**.
    The core idea of the Inception structure is to stack multiple convolution kernels
    of different sizes in parallel, thereby enhancing the network''s representational
    capacity. The Inception series has multiple versions, such as `Inception V1`,
    `Inception V2`, and `Inception V3`, etc.


    ## ResNet (Residual Network)


    **ResNet** is a CNN architecture proposed by researchers at Microsoft Research
    in 2015. Through the use of skip connections and residual blocks, ResNet successfully
    trained deep neural networks with over 1,000 layers. ResNet achieved the best
    results at the time on the ImageNet image classification task and has now become
    an important benchmark in the field of computer vision.


    ## DenseNet (Densely Connected Network)


    **DenseNet** is a CNN architecture proposed in 2017, characterized by each layer
    in the network being connected to all preceding layers. Through this dense connectivity
    pattern, DenseNet demonstrated superiority in parameter efficiency and feature
    reuse.


    ## EfficientNet


    **EfficientNet** is a CNN architecture proposed in 2019, achieving efficient performance
    through balanced scaling of network width, depth, and input resolution. EfficientNet
    obtained a baseline model (`EfficientNet-B0`) through Neural Architecture Search
    (NAS) technology, and then generated a series of larger models (e.g., `EfficientNet-B1`
    to `EfficientNet-B7`) through a Compound Scaling method. EfficientNet demonstrates
    superior performance on multiple computer vision tasks with relatively fewer parameters
    and lower computational complexity.


    ## MobileNet


    **MobileNet** is a lightweight CNN architecture proposed by Google researchers
    in 2017, primarily aimed at achieving efficient computation on mobile devices
    and edge computing scenarios. MobileNet employs Depthwise Separable Convolution
    technology, effectively reducing the number of parameters and computational cost
    in the network. MobileNet has multiple versions, such as `MobileNet V1`, `MobileNet
    V2`, and `MobileNet V3`.


    ## Transformer-based Vision Models


    In recent years, vision models based on the Transformer architecture have made
    significant progress in computer vision, such as **ViT** (Vision Transformer)
    and **DeiT** (Data-Efficient Image Transformer). These models process images by
    dividing them into patches and treating them as sequences, thereby transforming
    image classification tasks into natural language processing tasks, achieving excellent
    performance on various vision tasks.


    ## Swin Transformer


    **Swin Transformer** is a vision model based on Transformer proposed in 2021.
    It improves the traditional Transformer structure to make it more suitable for
    computer vision tasks. Swin Transformer processes images into a sequence with
    local perception through hierarchical partitioning and shifted window methods,
    improving model performance on computer vision tasks.


    These classic CNN architectures hold important positions in the field of computer
    vision. In practical applications, readers can select appropriate network architectures
    based on specific task requirements and hardware conditions to achieve optimal
    performance.


    # 8.1.2 Building Recurrent Neural Networks and Long Short-Term Memory Networks
    with ChatGPT


    Recurrent Neural Networks (RNNs) and Long Short-Term Memory Networks (LSTMs) are
    two common deep learning models primarily used for sequential data processing.
    These models are used to handle data with temporal or sequential characteristics,
    such as text, time series data, and speech recognition.


    ## Basic Principles of RNN


    The core idea of RNN is to model the relationships between preceding and succeeding
    elements in sequential data through the network structure. The basic structure
    of an RNN is a neural network unit with recurrent connections, which allows the
    network to save information from previous time steps and use it for calculations
    at the current time step, as shown in Figure 8.6. The basic formulas of RNN are
    as follows.


    ### Hidden State h(t)


    ![](img/9787301342022_Figure-0308-0355.jpg)


    ### Output State o(t)


    ![](img/9787301342022_Figure-0308-0356.jpg)


    Where `x(t)` represents the input at the current time step, `h(t−1)` represents
    the hidden state at the previous time step, `W_hh`, `W_xh`, `W_ho` are weight
    matrices respectively, `b_h` and `b_o` are bias terms respectively, and `Activation`
    is usually an activation function, such as `tanh` or `ReLU`, etc.


    ![](img/9787301342022_Figure-0308-0357.jpg)


    Figure 8.6 Schematic Diagram of RNN


    However, traditional RNNs have a problem known as the long-term dependency problem.
    When sequences are long, RNNs struggle to capture relationships between elements
    that are far apart in the sequence. To solve this problem, the LSTM model was
    developed.


    ## Basic Principles of LSTM


    LSTM is a variant of RNN that solves the long-term dependency problem by introducing
    a mechanism called "gates", as shown in Figure 8.7. LSTM has three gates: the
    input gate, the forget gate, and the output gate. The role of these gates is to
    control the flow of information between different time steps. The basic formulas
    for the three gates are as follows.


    ### Forget Gate f(t)


    ![](img/9787301342022_Figure-0308-0358.jpg)


    ### Input Gate i(t)


    ![](img/9787301342022_Figure-0308-0359.jpg)


    ### Cell State Input


    ![](img/9787301342022_formula-0308-0360.png)


    ![](img/9787301342022_Figure-0309-0361.jpg)


    ### Cell State C(t)


    ![](img/9787301342022_Figure-0309-0362.jpg)


    ### Output Gate o(t)


    ![](img/9787301342022_Figure-0309-0363.jpg)


    ### Hidden State h(t)


    ![](img/9787301342022_Figure-0309-0364.jpg)


    Here, `sigmoid` and `tanh` are two commonly used activation functions, `[h(t—1),
    x(t)]` represents the concatenation of the hidden state from the previous time
    step and the input at the current time step, `W_f`, `W_i`, `W_C`, and `W_o` are
    weight matrices for different gates and cell state inputs respectively, and `b_f`,
    `b_i`, `b_C`, and `b_o` are bias terms respectively.


    ![](img/9787301342022_Figure-0309-0365.jpg)


    Figure 8.7 Schematic Diagram of LSTM


    ### Functional Interpretation of Gates


    #### Forget Gate f(t)


    Controls whether information in the previous cell state `C(t—1)` is retained.
    If the forget gate output is close to 0, it indicates discarding the previous
    information; if the output is close to 1, it indicates retaining the previous
    information.


    #### Input Gate i(t)


    Controls the influence of the current input `x(t)` and the previous hidden state
    `h(t—1)` on the current cell state `C(t)`. The larger the input gate output, the
    greater the influence of the current input and previous hidden state on the cell
    state.


    #### Output Gate o(t)


    Controls the influence of the current cell state `C(t)` on the current hidden
    state `h(t)`. The larger the output gate output, the greater the influence of
    the current cell state on the hidden state.


    Through the synergistic action of these three gates, LSTM can better capture long-term
    dependencies in sequences, avoiding the long-term dependency problem in traditional
    RNNs. In many sequence processing tasks, LSTM has demonstrated superior performance,
    such as in natural language processing, time series prediction, and other fields.


    ## Application Areas of RNN and LSTM


    RNN and LSTM models are very powerful tools for processing temporal data, such
    as speech, text, and time series data. They can be used for various data analysis
    tasks, including language modeling, time series forecasting, image captioning,
    speech recognition, and sentiment analysis, capable of learning useful information
    from temporal data to support decision-making.


    However, to proficiently use these two tools, one still needs a deep understanding
    of their basic principles and architectures, and master the methods of building
    and training models using common deep learning frameworks (such as `TensorFlow`,
    `PyTorch`, etc.). In addition, one needs to master techniques such as data preprocessing,
    model optimization, and hyperparameter tuning, and possess good programming and
    data analysis skills. Most importantly, sufficient practical experience is needed
    to continuously optimize models and improve their accuracy and efficiency through
    constant practice and debugging.


    Using ChatGPT can efficiently and accurately implement RNN and LSTM algorithms.
    The following examples will introduce how to use ChatGPT to apply these algorithms.


