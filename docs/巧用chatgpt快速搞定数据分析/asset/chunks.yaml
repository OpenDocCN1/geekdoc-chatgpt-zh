    mainly used for processing large amounts of unstructured or semi-structured data.
    It was originally developed by the Apache Foundation, inspired by Google''s MapReduce
    and GFS (Google File System) papers. The core of Hadoop is the Hadoop Distributed
    File System (HDFS) and the MapReduce programming model architecture, as shown
    in Figure 8.9.


