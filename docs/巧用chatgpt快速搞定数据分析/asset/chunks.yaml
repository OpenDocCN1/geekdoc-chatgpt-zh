    \n`Mall Customer Segmentation`数据集的部分示例数据如表7.11所示。\n\n**表7.11 `Mall Customer Segmentation`数据集部分示例数据**\n\
    \n![](Images/9787301342022_Figure-0280-0326.jpg)\n\n通过对这些特征进行层次聚类分析，可以发现不同的客户细分群体。我们可以直接使用`ChatGPT`为`Mall\
