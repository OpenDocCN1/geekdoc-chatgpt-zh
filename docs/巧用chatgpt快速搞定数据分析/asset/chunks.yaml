    在统计前，我们先对几个基本概念做简单的介绍。


    （1）准确率（Accuracy）：准确率是分类正确的样本数占总样本数的比例。它是分类器在所有样本上的整体表现。


    ![](Images/9787301342022_Figure-0249-0263.jpg)


    （2）精准率（Precision）：精准率是指分类器预测为正例的样本中，实际为正例的比例。它反映了分类器预测结果的准确性。


    ![](Images/9787301342022_Figure-0249-0264.jpg)


    （3）召回率（Recall）：召回率是指实际为正例的样本中，被分类器预测为正例的比例。它反映了分类器对正例的识别能力。


    ![](Images/9787301342022_Figure-0250-0265.jpg)


    （4）F1分数（F1\_Score）:F1分数是精准率和召回率的调和平均值，用于评估分类器在精准率和召回率之间的权衡。当精准率和召回率都高时，F1分数才会高。


    ![](Images/9787301342022_Figure-0250-0266.jpg)


    （5）混淆矩阵（Confusion Matrix）：混淆矩阵是一个二维表格，用于描述分类器的预测结果和实际结果之间的关系。矩阵中的每个单元格表示一个特定的预测—实际组合。对于二分类问题，混淆矩阵的形式如表7.6所示。


    表7.6 混淆矩阵


    ![](Images/9787301342022_Figure-0250-0267.jpg)


