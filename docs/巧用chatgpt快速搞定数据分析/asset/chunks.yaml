    图 1.5 Tableau


    **Power BI**是一款由微软推出的业务智能和数据可视化工具，如图 1.6 所示，适用于处理、分析和可视化大规模数据。Power BI 提供了数据连接、数据建模、数据转换和数据可视化等功能，可以快速地生成报告和仪表板。它与其他微软产品（如
    Excel 和 SQL Server）具有良好的兼容性，并支持多种数据源，如数据库、云平台和文件等。Power BI 适用于企业和个人用户，可以满足从基本到高级的数据分析需求。


