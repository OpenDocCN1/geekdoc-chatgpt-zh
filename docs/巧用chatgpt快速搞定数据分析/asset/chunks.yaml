    \ insurance and critical illness insurance can be recommended.\n2.  For users\
    \ with low purchasing power, younger age, and no house ownership, low-priced insurance\
    \ products such as accident insurance and medical insurance can be recommended.\n\
    3.  For users with high income and married, family insurance, education insurance,\
