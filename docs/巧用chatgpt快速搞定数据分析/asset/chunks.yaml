    图 1.3 R 语言


    `R`语言具有丰富的包和函数，可以方便地进行数据分析、统计建模和可视化。主要的`R`包如下。


    1. **`Dplyr`**：用于数据处理和转换的包。

    2. **`Ggplot2`**：用于创建优美的图形和可视化的包。

    3. **`Tidyr`**：用于整理和清洗数据的包。

    4. **`Lubridate`**：用于处理和分析日期和时间数据的包。

