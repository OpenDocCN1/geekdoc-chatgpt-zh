    多项式回归是线性回归的扩展，它允许因变量与自变量之间存在非线性关系。多项式回归通过引入自变量的高次项来拟合数据，从而能够捕捉到数据中的非线性关系。多项式回归模型可以表示如下：


    ![](Images/9787301342022_Figure-0198-0202.jpg)


    其中，`y`是因变量，`x`是自变量，`β0, β1, ..., βn`是各项的系数，`ε`是误差项。


    多项式回归的目标是找到一组参数`β`，使预测值与实际值之间的平方误差之和最小，即最小化损失函数：


    ![](Images/9787301342022_Figure-0199-0203.jpg)


    其中，`L(β)`表示损失函数，`y`表示实际值，`x`表示自变量，`β0, β1, ..., βn`表示各项的系数。


