    #### Analysis Tasks


    Using `Apache Spark` to process the `MovieLens 100K` dataset allows for the following
    analyses.


    1. **Calculate Average Rating per Movie**: Using `Spark`''s `DataFrame` or `RDD
    API`, the average rating for each movie can be easily calculated to understand
    audience preference for different movies.

    2. **Calculate Average Rating per User**: Using `Spark`, the average rating for
    each user can also be calculated to analyze user rating habits and differences.

    3. **Find Most Popular Movie Genres**: By aggregating rating data by movie genre,
    the most popular movie genres among audiences can be found.

    4. **User-based Collaborative Filtering Recommendation**: Using the `Spark ML`
    library (`Spark Machine Learning Library`), a user-based collaborative filtering
    recommendation algorithm can be implemented to recommend movies users might like
    based on similarity between users.

    5. **Item-based Collaborative Filtering Recommendation**: Similarly, the `Spark
    ML` library can be used to implement an item-based collaborative filtering recommendation
    algorithm, recommending movies users might like based on similarity between movies.

    6. **Analyze Movie Preferences of Users by Age, Gender, and Occupation**: Combined
    with the user information file, the movie preferences of users of different ages,
    genders, and occupations can be analyzed to further understand the needs of different
    types of audiences for movies.

    7. **Time Series Analysis**: `Spark` and `Python` tools can be used for time series
    analysis of rating data. For example, analyzing changes in movie ratings over
    time, rating peak periods, etc., to understand audience rating behavior for movies.

    8. **Movie Metadata Analysis**: Through metadata in the movie information file
    such as release date, `IMDb URL`, and movie genres, movies can be analyzed by
    category. For example, studying which era of movies is more popular, or analyzing
    which genres of movies have higher ratings on `IMDb`.


