    资产，是指由企业过去经营交易或各项事项形成的、由企业拥有或控制的、预期会给企业带来经济利益的资源。用通俗的话来讲，就是告诉投资者这个企业都有什么（资产）。当然，企业拥有的东西，既包括用自己的钱买'
