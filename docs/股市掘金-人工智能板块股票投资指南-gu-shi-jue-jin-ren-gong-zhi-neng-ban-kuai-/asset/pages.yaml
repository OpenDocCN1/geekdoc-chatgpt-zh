  md: '从表 3-1 中可以看出，该股 PEG 值的波动范围并不算大。该股 PEG 的运行范围从 2.72 到 0.52 不等，其中股价与市盈率均创新高的 2020
    年 3 月初，PEG 值却不是最高的，2020 年底 PEG 值较高，但其股价并不算高。


    下面再来看一下当期的 PEG 值。以 2021 年 4 月 27 日为基准计算 PEG 值，2021 年 4 月 27 日的股价收盘为 15.84 元，2020
    年年末的每股收益为 0.59 元，净利润增长率为 10.71%，那么，该股当日的市盈率为 26.77 倍。


    PEG 值 =26.77/10.71≈2.5 倍


    也就是说，2021 年 4 月 27 日的 PEG 值比 2020 年底的 PEG 值要低，但仍不是最低的位置。当然，这与 2020 年该股净利润增长率较低有关。


    接下来，还可以对该股未来的 PEG 值进行预测。根据该股历史利润增长率情况，可以将未来一年的利润增长率预测值设定在 20%（鉴于该股净利润增长率波动较大，这里取一个相对保守的数值），其市盈率则可能维持在
    30 倍左右（预期股价为 21.24 元：0.59 元 × （1+20%）× 30）。也就是说，该股 PEG 值很可能在 1.5 左右，未来一年内，该股的投资价值尚可，大约有
    25% 左右（相比于 15.84 元）的上涨空间。


    不过，投资者在选择股票时，不能仅用一个标准来做判断，还需要参考其他因素。特别是一些净利润增长率浮动较大的个股，更应该从多角度研判其投资价值。


    # 四、标杆对比估值法


    该方法是通过与市场上类似资产的价值进行对比，来衡量目标资产的价值。从严格意义上来讲，市盈率法、市净率法等都属于对比估值法。而所谓的标杆对比估值法，就是以行业内标杆企业的相关数值作为对比基准，然后将标的公司的相关指标与标杆企业对比，以判断标的公司价值多少。比如，在白酒市场上，贵州茅台就是绝对的标杆，那么，该股的市盈率、市净率以及总体市值，都可以成为其他白酒企业的参照对象。


    事实上，很多初创型科技公司，在投入初期还不具备盈利能力，而自身又掌握了较为深厚的技术资源。对于这类企业，使用市盈率法、市净率法估'
