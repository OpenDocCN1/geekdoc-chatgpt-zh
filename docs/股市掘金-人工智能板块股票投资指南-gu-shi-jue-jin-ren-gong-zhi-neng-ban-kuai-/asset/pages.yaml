    (2) 传感器设计。参与这一环节的国内企业包括歌尔股份、士兰微、汇顶科技、高德红外、美泰科技、瑞声科技等。


    (3) 传感器芯片。传感器芯片设计企业包括华为海思、紫光国微、小米、芯敏微系统、广微机电以及国外的苹果、三星、英特尔、英伟达、高通等。


    (4) 传感器测试。传感器测试领域参与企业包括歌尔股份、共达电声、美泰科技、瑞声科技等。


    (5) 软件。从国内企业现状来看，传感器软件是传感器产业最薄弱的一个环节。国内厂商包括矽睿科技、明晦传感、深迪半导体等。目前，这几家企业还没有上市，投资者可留心观察。


    # 2. 传感器中游


    传感器中游产业主要包括传感器制造、封装以及各类传感器生产等。


    # (1) 传感器制造。


    传感器制造领域的参与厂商大多是人工智能与科技行业内的龙头企业，如格罗方德、爱普生、中芯国际、士兰微、高德红外、华虹集团、中航微电子、国高微电子等。


    # (2) 传感器封装。


