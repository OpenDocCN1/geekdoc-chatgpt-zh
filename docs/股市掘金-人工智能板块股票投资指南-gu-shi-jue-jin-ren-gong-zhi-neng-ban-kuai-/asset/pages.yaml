  md: '第二，无人机附属系统或零部件企业同样值得重点关注，特别是那些能够独家提供某些专属配件或系统的企业，更容易取得业绩提升和改善。比如大立科技、星网宇达等。能够提供主控芯片的瑞芯微同样值得关注。


    第三，在民用无人机领域，还有大量没有上市融资的企业，如零度智控、飞豹、极翼等，这些企业同样值得关注。


