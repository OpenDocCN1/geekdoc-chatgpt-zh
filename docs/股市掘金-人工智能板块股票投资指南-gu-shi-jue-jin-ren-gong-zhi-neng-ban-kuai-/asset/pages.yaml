  md: '# (1) 流动负债。


    流动负债是指在一年或者超过一年的一个营业周期内偿还的债务。流动负债与流动资产相对，是那些需要在短期内偿还的债务。换句话说，这些债务可能在接下来的一年内耗用大量的企业现金，企业必须有充足的流动资产与之对应。最典型的流动负债包括短期借款、应付账款、应付职工薪酬、应付税费、预收账款（企业必须在短期内向客户提供产品，而产品则属于流动资产范畴，不过预收账款越多，也越能说明企业在市场竞争中处于优势地位。按照最新的会计准则，很多企业的预收账款项目资金都被调整列入合同负债）。科大讯飞
    2020 年年报的合同负债为 16.68 亿元，这是一笔不小的负债，也可以看成企业对下游控制能力较强。


    # (2) 非流动负债。


    非流动负债又称为长期负债，是指偿还期在一年或者超过一年的一个营业周期以上的债务。非流动负债多是一些需要在未来某个时间点偿还的债务。最典型的非流动负债包括长期借款、应付债券、专项应付款、长期应付款等。


    # 3. 所有者权益报表部分


    所有者权益，是指企业资产扣除负债后，由所有者享有的剩余权益。公司的所有者权益又称为股东权益。所有者权益是所有者对企业资产的剩余索取权，它是企业资产扣除债权人权益后应由所有者享有的部分，这部分资产本质上就是企业的净资产。通常情况下，所有者权益越高，说明企业内在的实力越强。


    所有者权益主要包括实收资本、资本公积、盈余公积、未分配利润等几项。下面看一下科大讯飞的所有者权益报表部分，如图 3-3 所示。


    # (1) 实收资本。


