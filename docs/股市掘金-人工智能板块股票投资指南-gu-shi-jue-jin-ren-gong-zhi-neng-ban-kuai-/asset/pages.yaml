    # 4. 寒武纪估值分析


    为这类处于投入期的科技企业估值是一件非常困难的事。无论是市盈率估值，还是市净率估值，都明显不合理，毕竟企业还没有取得实质性盈利。这里，我们只能从该企业手中掌握的产品或技术，以及该公司整体股本与市值角度来估值。比如，截至
    2020 年底，寒武纪的股本总数为 4 亿股，考虑到该公司的产品以及在人工智能芯片领域中的地位，可以给这家企业一个整体的估值额度，比如 650 亿元。这个
    650 亿元是通过对科大讯飞（市值 1300 亿元左右）等企业市值的对比情况获得的一个大致数值。


    假如我们对寒武纪的整体估值为 650 亿元，其总股本数为 4 亿股，那么，每股对应的股价应该在 162.50 元左右。


