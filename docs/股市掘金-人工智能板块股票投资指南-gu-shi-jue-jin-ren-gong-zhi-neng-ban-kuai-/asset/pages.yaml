  md: '特别注意以下几个科目。


    # 1. 现金流量表中的“销售商品、提供劳务收到的现金”


    该项目反映的是当期因销售商品、提供劳务收到的现金。这里有两层含义：其一，因销售商品、提供劳务而形成的，企业其他业务形成的收入并不能列入本项目。其二，当期收到的现金，也就是说，该现金是当期收回到账的，即使当期已经签订了销售合同，开具了发票，但现金没到账，仍然不能列入当期数据；反之，即使前几期形成的收入，当期到账，也要列为当期收入。


    企业实际收到现金的能力，反映了企业在市场竞争中所处的位置（优势越明显，收到现金的能力就越强）及商业信誉情况（信誉良好，则获得投资和融资的现金也会很多）。总之，企业实际收到现金的能力，也是企业整体盈利能力的一部分。


    由于企业在销售货物或提供劳务活动时，多有欠款或预收账款存在，使得该项目的金额总是与利润表中的营业收入存在一定的出入，投资者不必过分纠结两者之间的差异。


    # 2. 现金流量表中的“收到其他与经营活动有关的现金”


    该科目作为企业“销售货物、提供劳务收到的现金”的补充，是一个需要投资者特别注意的科目。很多企业为了粉饰现金流量表，给投资者一种经营现金流充裕的假象，会在这个科目上做文章。很多炒股软件抓取的财务数据项目中，并没有“收到其他与经营活动有关的现金”，投资者可通过查看上市公司财务报告了解具体的数字，同时还要知道这些现金的来源，是不是企业为了粉饰报表而暂时引入的现金。


    这里提醒一下投资者：尽管炒股软件给出了各家上市公司大部分财务指标和指标变动的解释，但毕竟不是完整的财务报告。投资者要想全方位了解企业的财务状况，还是要看一看这些企业完整的财务报告，当然，还有会计师事务所和相关董事出具的意见。若某公司的财务报告被会计师事务所出具了“无法发表意见”“保留意见”等字样的意见，那么这类企业就不应该再成为优质标的股的备选标的了。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 3. 现金流量表中的“经营活动产生的现金净额”


    这是整个现金流量表中最重要的一个科目。经营活动产生的现金净额为正值，说明经营活动产生的现金流入量大于现金流出量；反之，则说明经营活动产生的现金流入量小于现金流出量。通常情况下，一家正常经营的企业，其经营活动产生的现金净额应该是正值。只有经营活动产生的现金净额为正值，才能满足企业支付股息、利息、投资等需求。若企业经营活动产生的现金净额长期为负值，企业就必须采取扩大举债规模、削减投资规模、动用盈余积累等措施保障企业运营，这都可能导致企业未来盈利能力不足，也说明企业的经营情况不理想，这类企业也很难成为成长股的候选标的。


    # 第二节 人工智能板块估值方法


    目前，在投资分析过程中，人工智能行业使用的估值方法主要包括 PE、PB 以及 PEG 等方法。


    # 一、PE（市盈率）


    PE，即市盈率，是股票的本益比，也就是股票的利润收益率。


    # 1. 市盈率：动态市盈率与静态市盈率


    以市盈率为核心的估值方法，仍是目前股票估值的主流方法。该方法以股票的每股盈利额度和每股市价为核心，其具体计算方法如下。


    基本计算公式：


    市盈率 = 股价 / 每股收益


    在具体计算市盈率时，股价通常以最新股票报价为准，每股收益则以上一年度的每股收益为计算依据。市盈率反映出按照当期股票的收益，需要多少年才能够收回投资成本。例如，以上一年度每股收益为依据，一只股票的市盈率为
    20 倍，说明按照该股上一年度的每股收益估算，投资者需要 20 年才能拿回买入股票的成本。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 股市掘金：人工智能板块股票投资指南


    市盈率分为动态市盈率和静态市盈率两种。通过炒股软件调出个股基本财务指标时，投资者就能看到这两个指标，如图 3-6 所示。


    ![](img/66c566067fe44416002c3df906def5f6_40_0.png)


    图 3-6 汇川技术（300124）基本财务数据


    # （1）静态市盈率。


    静态市盈率就是通常所说的市盈率，是通过将最新股价与上一年度每股收益相除获得的。静态市盈率反映的是以当前的盈利状态，投资者收回投资成本需要多少年的时间。通常情况下，市盈率越低，说明投资者可用更短的时间收回投资，股票的投资价值越大。


    相比较而言，人工智能行业的市盈率普遍较高，这确实与人工智能行业本身的发展周期有关。由于人工智能行业处于发展初期，很多企业尚处于投入期，还未进入产出期，因而整体的盈利能力不高。同时也反映出市场上的投资者对人工智能行业的追捧，特别是最近几年中美贸易纠纷发生后，科技领域与人工智能领域的争夺也越发激烈。正因如此，整个人工智能行业的市盈率水平相对偏高。


    从图 3-6 中可以看出，汇川技术的静态市盈率在 82.23 倍左右。也就是说，按照 2020 年的盈利水平，投资者要想通过该股的每股盈利来收回投资成本，大约要用
    82.23 年左右，当然，这不包括红利税等因素。在 A 股市场上，这只股票的市盈率应该算是很高的，但在人工智能领域却并非最高。下面再看'
