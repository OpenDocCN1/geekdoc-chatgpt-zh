- pgno: 42
  md: '每股收益的增长性比率，可以根据企业以往每股收益增长率进行估算，同时还要对企业维持该增长率的年限进行预测。例如，预估某企业的每股收益增长率在未来五年能维持在
    20% 左右，且当前该股市盈率为 50 倍，那么，该股的动态市盈率为：


    ```

    动态市盈率 = 50 × [ 1 / ( 1+20% ) 5 ]

    = 50 × 0.4

    = 20

    ```


    也就是说，一只股票若能五年保持 20% 左右的增长率，那么，其当前的 50 倍静态市盈率只相当于 20 倍动态市盈率。而 20 倍市盈率，对于大多数股票来说都是可以接受的一个市盈率倍数。由此可见，投资者在选择股票时，一定要选择那些能够持续成长的股票，尽管这些股票的静态市盈率暂时较高，但长远来看，其市盈率并不算高。


    当然，目前很多炒股软件中标注的动态市盈率并不是按照上述算法计算得出的，而是将最近一期的每股净收益推算至全年收益，进而计算得出的。例如，某只股票第一季度的每股收益为
    0.5 元，系统会默认按照全年 0.5 × 4 = 2 元的基数计算动态市盈率数据。相比较而言，这种算法比较简单，但非常不科学。很多企业每个季度的收益都存在很大的变化，特别是有些企业，第四季度收益相比前三个季度会出现大幅变动，这就使动态市盈率变得没有多大的实际意义。


    # 2. 应用市盈率测算股票目标价格


    应用市盈率测算股票目标价格时，需要依托的三个基本要素为每股收益、市盈率以及预期未来的净利润增长率。


    每股收益是测算市盈率和股票目标价格的基础，也是进行股票投资需要参照的最重要的一个指标。在大多数炒股软件财务概况页面，都会给出当期的每股收益数据。投资者借助【
    F10 】功能，在【 财务概况 】选项卡内点击【 主要指标 】，就可以看到每期核心的财务指标数据，如图 3-8 所示。


    未来净利润增长率是一个非常关键的指标，也是给一只股票估值的关键指标。未来净利润增长率的确认需要结合以下几点。'
