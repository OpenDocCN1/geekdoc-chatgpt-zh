    # 一、5G 行业竞争分析


    5G 商用后，将会极大地促进和带动相关产业的发展，并拉动整个社会 GDP 水平的提升。据中国信通院《5G 经济社会影响白皮书》预测：从产出规模看，2030
    年 5G 带动的直接产出和间接产出，将分别达到 6.3 万亿元和 10.6 万亿元。


    # 1. 5G 产业链及整体态势


    从整体来看，5G 产业链可以划分为三个层面，即上游移动通信基础设施、中游移动通信服务商、下游终端及应用场景，如图 6-12 所示。


    ![](img/66c566067fe44416002c3df906def5f6_133_0.png)


    图 6-12 5G 产业链分布


    （1）移动通信基础设施。


    该领域主要涵盖基站、网络建设和网络规划三个子领域。


    基站子领域中，又分为天线、射频模块和小微基站三部分业务，主要参与企业包括华为、通宇通信、盛路通信、信维通信、麦捷科技、武汉凡谷、'
  merge: -1
  img_proc: true
- pgno: 134
  md: '邦讯技术等。未来还会有更多的企业参与到该领域之中。


    在网络建设子领域中，包括传输网、承载网和核心网等。参与企业包括华为、中兴通讯、烽火通信、光迅科技、大富科技、长飞光纤、中天科技、新易盛、天孚通信等。


    在网络规划子领域中，参与企业包括三维通信、华星创业、日海通讯、中富通等。


    +   (2) 移动通信运营商。


    移动通信运营目前由四个拿到 5G 运营牌照的企业组成，包括中国移动、中国联通、中国电信以及中国广电。


    +   (3) 终端及应用场景。


    在终端方面，主要应用于手机、汽车、家电、可穿戴装备、工业设备以及公共设备。当然，未来随着 5G 的发展，可能会有更多的终端能够使用 5G。该领域的参与企业包括华为、中兴、小米等。当然，无论何种终端都离不开基带芯片，目前能够提供基带芯片的企业包括华为海思、高通、三星、联发科、大唐电信等。


    5G 应用于各类场景时，需要相应的系统解决方案。参与企业包括紫光股份、东方国信、北纬通信、四维图新、宜通世纪、高新兴、天源迪科等。


    # 2. 5G 产业竞争态势


    目前，美国、欧盟、日本、韩国以及我国都在加大力度推进 5G 商用，2020 年左右，上述国家都启动了 5G 商用。巴西、澳大利亚、俄罗斯等国也在积极筹划并推进
    5G 商用。由于各国都在大力发展 5G 产业，并力争在 5G 产业中占据优势地位，这就使得 5G 产业呈现出如下几个典型的竞争态势。


    第一，尽管很多国家都在推进 5G 商用，但真正拥有整套 5G 技术并能够布局 5G 通信系统的企业并不多。目前市场上比较有竞争力的 5G 企业包括华为、中兴、诺基亚、爱立信以及三星等为数不多的几家。这些企业背后往往会有相当多提供元器件或软硬件支持的企业，这就构成了一个个独立的生态系统。也就是说，这些企业竞争的背后，还是各家生态系统之间的竞争。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '排除政治因素的考量，华为在 5G 技术方面拥有相当大的竞争优势。也正因如此，市场上的资金才会青睐于华为概念。


    第二，尽管 5G 商用刚刚起步，但各大巨头企业纷纷入场布局。目前 5G 的各个细分领域已经开始显露出明显的集中趋势，未来留给新兴企业的空间越来越小。当然，由于
    5G 启动后，势必会诞生一些新的行业，这些行业往往会成为创业者的乐土。不过，从以往的经验来看，当一个新兴的，比较具有潜力的行业产生后，资本巨头就会迅速入局。因此，对于中小企业来说，未来的竞争形势不容乐观。


    第三，掌握技术主动权的企业往往会获得更多的话语权。尽管 5G 商用后将会推进相关产业的发展，但由于 5G 行业中很多核心模块都具有强大的技术壁垒，因而任何机遇都不会平均分到每个企业的头上，只有那些技术出众的企业才能获得更好的发展空间和机会。


    # 3. 5G 产业发展趋势


    尽管 5G 商用布局时间不久，但各大厂商在相关技术储备方面布局已久，因而，在这场准备充足的竞赛中，呈现出如下几个典型的趋势。


    第一，世界各主要国家纷纷入局，都希望加速 5G 网络的布局与建设，为 5G 设备商提供了绝佳的瓜分市场份额的机会。未来，随着 5G 建设热潮的来临，各主要设备商的竞争将会更加激烈。在这场竞争中，华为因其握有的技术储备最为丰厚，有望继续保持领先优势；中兴则以其性价比高的优点，也很容易获得客户的青睐。


    第二，各大主要设备商将会围绕 5G 行业标准的制定展开更加激烈的争夺。毕竟谁掌握了行业标准的制定权，谁就更容易在竞争中胜出。


    第三，5G 网络将会更广泛地应用于生产生活之中，也将会与物联网、家电、可穿戴装备等各种终端更加紧密地融合。


    # 二、5G 企业投资逻辑


    通信行业的每次升级换代，受益方总是先从设备商开始，然后才会传递到运营商，最后到应用层面的企业。我们在分析 5G 行业的投资逻辑时，也'
  merge: -1
  img_proc: true
- pgno: 136
  md: '应该遵循这样的逻辑。


    第一，主设备商肯定是最先受益的对象。我们在网上见到的 5G 商用行动，都是从自主设备商签订 5G 合同开始的。目前，从全球来看，华为拿到了最多的 5G 商用合同，而且其
    5G 份额几乎可以占到国内 5G 市场容量的一半以上。国内企业中，除了华为就是中兴。中兴占有国内市场份额的三成左右。这两家企业将是最先受益，也是受益最大的企业。


    第二，在 5G 网络建设过程中，基站是不可或缺的，而基站天线以及滤波器都是必备元器件。随着 5G 网络建设逐渐铺开，基站天线及滤波器的需求必然会随之放大，因而，生产基站天线及滤波器的企业将会直接受益。代表性标的包括通宇通信、信维通信、盛路通信以及麦捷科技等。


    第三，光纤光缆是 5G 通信行业不可或缺的器件。目前，国内市场生产光纤光缆光棒的自给率在 90% 左右，仍需要从国外进口一部分光棒。随着 5G 网络的部署，对光纤光缆的需求将会大增，国内光棒的缺口将会进一步放大。光棒产能的提升最少也需要
    18 个月以上，而且伴随着高投资、投资回收期长的特点，因而，这一产能缺口短期内可能无法弥补。投资者可重点关注亨通光电、长飞光纤、中天科技、烽火通信以及杭州富通等企业。


