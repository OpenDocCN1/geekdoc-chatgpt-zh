    # (2) 资本公积。


    资本公积是指企业在经营过程中由于接受捐赠、股本溢价以及法定财产重估增值等原因所形成的公积金。例如，某个人赠予公司 100 万元，那么这 100 万元就会被计入资本公积。同样常见的资本公积金还包括上市公司发行股票的溢价价值。前面讲过，大多数上市公司的股票票面价格为
    1 元，上市时，其发行价会远远超过 1 元，这部分溢价的金额将会计入企业的资本公积金。


    ```

    例如，某公司上市发行股票 2000 万股，发行价格为 10 元，那么，其


    资本溢价金 = (10-1) × 2000 万


    = 18000 万元

    ```


    这 18000 万元就会被计入资本公积金（不考虑其他税费支出）。其实，在新股正式发行过程中，会有大量的资本溢价金被计入资本公积，这部分资本公积未来有转增资本（送股）的可能，这也是投资者青睐新股的一个原因。


    # (3) 盈余公积。


    盈余公积是企业从税后利润中提取形成的、存留于企业内部、具有特定'
