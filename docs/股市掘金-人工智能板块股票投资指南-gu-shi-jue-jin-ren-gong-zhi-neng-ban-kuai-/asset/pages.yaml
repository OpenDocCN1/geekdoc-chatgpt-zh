    # # 第四节 机器学习领域投资研究


    机器学习是专门研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构使之不断改善自身的性能。机器学习属于人工智能的核心领域，是使计算机具备智能的根本途径。


    # ## 一、机器学习领域竞争形势


    机器学习作为人工智能重要的细分领域，最近几年取得了较快的发展，且在人工智能板块所占的比重也在逐年增加。具体来说，整个机器学习领域呈现了如下几个典型的竞争态势，如图
    7-17 所示。


    ![](img/66c566067fe44416002c3df906def5f6_171_0.png)


    # 图 7-17 机器学习领域三个典型竞争态势


    第一，与其他人工智能细分领域相似，科技巨头在人工智能领域的布局较为深厚，如谷歌、亚马逊、微软、阿里巴巴、腾讯等，已经在此行业中建立了较大的竞争优势。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '第二，机器学习对个别行业的渗透率还不够，只是在金融、安防、IT服务行业拥有较高的行业渗透率，其他行业的渗透率明显不足。我们常说的人工智能领军企业如商汤、旷视、依图、云从等，核心业务范围都在金融、安防等领域。当然，这些领域的获利能力较强，竞争也较为激烈，而其他行业则要差很多。


    第三，机器学习领域的竞争，本质上更像是数据方面的竞争。数据大爆炸、算法经济、云托管等发展方向都会深刻影响机器学习领域的发展。在这几个方面也可能会涌现出数量众多的优质企业，这都是投资者需要关注和了解的。


    # 二、机器学习领域产业链


    机器学习领域产业链，如图 7-18 所示。


    ![](img/66c566067fe44416002c3df906def5f6_172_0.png)


    图 7-18 机器学习领域产业链


    +   1. 上游：基础层


    机器学习领域的基础层主要包括三类企业。


    +   (1) 芯片供应商。


    包括 GPU、FPGA、ASIC 等类型的芯片，供应企业包括英伟达、英特尔、IBM、谷歌等。国内厂商包括华为海思、瑞芯微、赛武纪、地平线、云知声、深鉴科技、旷视科技等。


    +   (2) 云计算平台服务商。


    云平台服务商包括谷歌、阿里云、用友云、金山云等。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '(3) 科研机构。


    国内科研机构多为各大高校，包括浙江大学、哈尔滨工业大学、北京航空航天大学、北京邮电大学、中国科学院、清华大学等。


    2. 中游：技术层


    技术层为机器学习领域的核心环节，主要包括机器学习领域的技术服务商，提供基础开源框架的服务商和技术开放平台服务商等。


    （1）机器学习基础开源框架是构建机器学习模型的基础，市场上能够提供机器学习基础开源框架产品的企业包括谷歌、亚马逊、Facebook 等互联网巨头，还有 Theano、Caffe、Keras
    等公司。


    （2）技术开放平台服务商包括亚马逊、微软、腾讯、阿里云等。


    3. 下游：应用层


    应用层是初创型企业最多的一个层面，也是竞争最为激烈的一个领域。如商汤、旷视、云从、第四范式、寒武纪、深鉴科技等均在该领域有所布局。


    # 三、机器学习领域投资逻辑


    机器学习领域的竞争态势与语音识别领域相似，因此，在投资过程中，需要关注以下几点。


    第一，大型科技巨头同样拥有强大的技术优势和平台优势，如谷歌、微软、亚马逊，以及国内的科技巨头腾讯、阿里等。国内投资者可通过购买相关基金来间接投资这些企业，开通港股通的投资者也可以借助港股通购买腾讯等公司的股票。


    第二，很多新兴的机器学习领域的企业集中于应用层面，如商汤、旷视、云从、第四范式、寒武纪、深鉴科技等，投资者可保持关注。


    第三，在市场上，有些上市公司的部分业务可能会涉及机器学习领域，这些企业往往也就具有了机器学习概念。当机器学习概念热炒时，这些股票的价格也会被大幅推高，比如博彦科技、华胜天成、东方通等。'
