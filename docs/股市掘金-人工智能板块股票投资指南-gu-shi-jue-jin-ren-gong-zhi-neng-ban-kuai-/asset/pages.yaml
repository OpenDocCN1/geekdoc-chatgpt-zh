- pgno: 51
  md: '# 第四章


    # 基础层： AI 芯片领域


    人工智能产业是未来最具发展潜力的一个产业，而 AI 芯片领域则是该产业最核心的一个领域。各类传统芯片厂商、科技巨头、应用层厂商及初创企业，纷纷涉足 AI 芯片领域，不仅力求加快芯片国产化进程，也试图抢占市场先机。


    # 第一节 芯片整体投资研究


    AI 芯片是人工智能产业核心中的核心，其产业核心环节包括芯片设计、晶圆代工制造、芯片封装等环节。


    # 一、AI 芯片的类型


    目前，市场上的 AI 芯片主要分为两大类别：传统 AI 芯片和类脑芯片。


    +   1. 传统芯片


    在 AI 芯片领域，传统芯片仍是主流，共包括五种类型，如图 4-1 所示。


    +   2. 类脑芯片


    布局类脑芯片领域的企业包括 IBM、深思创、西井科技以及中国科学院脑科学与智能技术卓越创新中心（CEBSIT）等。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/66c566067fe44416002c3df906def5f6_52_0.png)


    # 图 4-1 传统 AI 芯片类型及生产厂商


    # 二、AI 芯片整体竞争态势


    AI 芯片领域最近几年发展迅速，整体上呈现如下几个典型特征。


    # 1.AI 芯片领域竞争日趋激烈


    随着各大计算机、互联网厂商先后入局，很多行业初创型企业先后被这些科技巨头收购，整个 AI 芯片领域进入了巨头争霸时代，微软、英特尔、英伟达、AMD、IBM
    等各大巨头占据了较大的市场份额。从国内市场来看，华为海思、联发科、寒武纪、汇顶科技、景嘉微、深鉴科技、地平线机器人也表现出了较强的竞争力。


    # 2. 欧美等国在 AI 芯片领域仍处于领先位置


    在整个 AI 芯片企业排名中，前十名中除三星外，均为欧美国家企业，这足以说明欧美国家在 AI 芯片领域的领先优势。不过，最近几年，国内的'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'AI 芯片企业也在奋起直追。当然，AI 芯片最核心的技术仍掌握在欧美国家手中，这是国内 AI 企业发展过程中最大的阻力和障碍。


    # 3. 在各类 AI 芯片领域，GPU 芯片市场份额最高


    从整个 AI 芯片发展情况来看，计算类芯片的市场占比最高，其中尤以 GPU 芯片为最。CPU 芯片和 ASIC 芯片紧随其后，FPGA 芯片灵活度最强，但普及度相对较低，因而市场份额相对较低。


    # 三、AI 芯片产业链


    AI 芯片产业链三大核心环节，如图 4-2 所示。


    ![](img/66c566067fe44416002c3df906def5f6_53_0.png)


    # 图 4-2 芯片产业链三个核心环节


    # 1. 芯片设计


    芯片设计又分为 IP 设计、芯片设计代工、芯片设计三类。在 AI 芯片设计领域中，绝大多数企业都属于芯片设计企业，同时，大部分芯片设计企业也从事芯片设计代工业务。


    # 2. 晶圆代工


    晶圆代工是半导体产业内的一种运营模式，是指专门从事半导体晶圆制造生产，接受其他芯片设计公司委托制造，而自己不从事设计的公司。目前，晶圆代工行业的行业排名相对比较稳定，台积电、三星、格罗方德占据行业前三位。内地晶圆代工巨头中芯国际也能维持在第五名左右，华虹半导体（港股）处于行业前十名的位置。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 3. 封装测试


    芯片封装，是指将芯片制造企业生产出来的集成电路裸片放置在一块起承载作用的基板上，再把管脚引出来，然后固定包装成为一个整体。封装好的成品还要进行芯片功能和电参数测试。


    从整个芯片封装测试行业来看，中国台湾的日月光集团位居行业首位，内地比较有代表性的企业包括通富微电、长电科技、华天科技等。


    # 第二节 芯片设计领域研究


    国内涉足芯片设计领域的企业很多，但各家企业涉足的深度、领域有所不同，其竞争能力也存在很大差异。


    # 一、AI 芯片设计领域竞争形势


    AI 芯片设计领域，包括 IP 核设计、芯片设计以及芯片设计代工等三类。不过，芯片设计代工企业也同样属于芯片设计企业范畴，具有代工能力的企业，必然具备设计能力。


    # 1. IP 核设计企业


    IP 核，即知识产权核。如果说 AI 芯片设计领域属于整个 AI 产业链的顶端，那么，IP 核设计就是 AI 芯片设计产业链的顶端，这也是整个人工智能产业中最顶层的领域。这类企业以收取
    IP 核授权费为主要营收来源。


    在行业排名上，ARM、新思、锘腾排名前三位，在整个市场份额中占比超过 65%。国内的 IP 核供应企业现在已经达到 50 余家，但整体规模较小，比如芯原股份也可以提供
    IP 核，同时也进入了行业前十位，但与行业前三名相比，差距还非常大。


