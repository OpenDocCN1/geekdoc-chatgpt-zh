  md: '# ## 第二节 人工智能板块投资逻辑


    技术更新换代速度快，技术含量高，是人工智能板块的典型特点。人工智能板块内的企业多为新兴技术企业，且很多企业并未上市融资，或者刚刚上市，目前处于初创期，盈利基础并不稳固，这都为投资者选择投资标的增加了困难。一般来说，在人工智能板块内选择投资标的时，投资者应该遵循这样几个基本逻辑。


    # ### 一、核心技术攻关


    人工智能行业本身是一个技术含量极高的行业，特别是 AI 芯片、高端传感器、机器学习等领域，技术含量更高。从我国人工智能行业的实际发展情况来看，一些高端前沿技术的缺失，已经成为制约人工智能行业快速发展的一个瓶颈。未来数年，相关产业必然会强化核心技术的攻关力度，特别是
    AI 芯片领域、高端传感器领域等。投资者可密切关注核心技术攻关的进展，一旦某家企业取得突破性进展，就会带动相关股票出现大幅上涨行情。


    比如，在整个 AI 芯片设计领域，IP（知识产权，Intellectual Property）核的设计被称为核心中的核心。谁能掌握 IP 核，就可以坐收授权费用。从国际市场来看，ARM（英国
    ARM 公司，Advanced RISC Machines）、新思、锆腾排名行业前三。放眼国内企业，只有芯原股份的市场占比达到了行业前十名，且与前三名的份额相差极大。但是，这并不重要，毕竟国内市场仍是一个蓬勃发展的市场，随着中美科技竞争的深入，这类企业必然会获得更大的发展机遇。


    下面看一下芯原股份的日 K 线走势图，如图 1-3 所示。2020 年 8 月，芯原股份在科创板上市后，经历了一波上升后进入振荡下跌行情。其实，新股上市后的第一波上升与回调，也可以看成是股票价值的一种回归。'
  merge: -1
  img_proc: true
