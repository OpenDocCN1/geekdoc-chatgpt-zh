  md: '中了很多初创型科技企业。不过，老牌科技企业仍是该领域的主角，如英伟达、英特尔、赛灵思等具有较强的实力。从国内市场来看，进入芯片设计领域的企业也很多，包括华为海思、紫光展锐、寒武纪、瑞芯微、云知声、芯原股份、海康威视、地平线等。


