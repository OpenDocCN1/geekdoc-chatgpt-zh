- pgno: 29
  md: '来的（所有者权益），还包括借别人的钱买来的自己用的东西（负债）。总之，企业现在能用来赚钱的资源就是企业的资产。按照会计分类方法，可以将资产分为流动资产和非流动资产两类。


    # (1) 流动资产。


    流动资产是指企业可以在一年或者超过一年的一个营业周期内变现或者运用的资产，是企业资产中必不可少的组成部分。流动资产也就是那些能够在短期内迅速变现的资产，最典型也是最重要的流动资产包括现金（本身就是货币）、存货（商品可以卖出换回现金；原材料可以变成商品，再换回现金）、应收账款（就是别人欠自己的钱，能收回来的就是现金，收不回来就会变成坏账）。


    在诸多流动资产中，现金又是最重要的一种。企业不同，行业不同，存货和应收账款的变现能力也是有差别的。比如，图 3-1 中科大讯飞 2020 年度应收账款及票据为
    57.33 亿元。通过对比前几年的应收账款情况可以发现，最近两年该公司的应收账款其实已经处于高位了，这并不是一个非常理想的状况，投资者需要提高警惕。毕竟，应收账款越多，企业面临的风险就越高。


    # (2) 非流动资产。


    非流动资产是指不能在一年或者超过一年的一个营业周期内变现或者耗用的资产。非流动资产是指流动资产以外的资产，主要包括持有到期投资、长期应收款、长期股权投资、工程物资、投资性房地产、固定资产、在建工程、无形资产、长期待摊费用、可供出售的金融资产等。也就是除了流动资产之外的资产，都属于非流动资产。非流动资产的变现能力普遍要弱于流动资产，而且在变现时常常会有所折损。


    非流动资产中，最典型的主要包括这样几类。


    第一，长期股权投资。企业对外投资取得的被投资单位的股份。A 股上市公司经常会投资一些相关单位，企业为了获得被投资单位的股份所花费的钱就是长期股权投资。这些投资每年获得的分红，也会按比例计入企业的投'
  merge: -1
  img_proc: true
- pgno: 30
  md: '资收益。作为投资者，需要关注这些上市公司所投资的单位及行业。若是被投资单位中有些能够上市，无疑将大大提升企业的投资收益；若是被投资单位中有一些涉及某热门概念，也会带动上市公司的股价上扬。


    第二，固定资产。固定资产是指企业为生产产品、提供劳务、出租或者经营管理而持有的、使用时间超过 12 个月、价值达到一定标准的非货币性资产，包括房屋、建筑物、机器、机械、运输工具以及其他与生产经营活动有关的设备、器具、工具等。固定资产具有这样三个属性，其一，必须是与生产经营有关的（无关资产可能被列入投资，如投资性房产）；其二，持有和使用时间较长，一般要超过
    12 个月；其三，要有一定的价值，价格不能太低（价格太低可能会被列入低值易耗品直接摊销）。


    大多数企业中，固定资产都占到了总资产的相当比例，特别是一些生产型企业，其设备、厂房的投资很大，很容易造成固定资产高企。这些固定资产短期内通常难以变现，只会在企业账面上显现，一旦企业破产，可能就会被折掉相当的价值。当然，也有一些企业的固定资产已经折旧完毕，但仍然还在发挥余热，这可能会为企业增值不少。正因如此，投资者在分析目标标的的资产时，要留心固定资产栏目，从不同角度分析固定资产的价值。


    第三，无形资产。无形资产是指企业拥有或者控制的没有实物形态可辨认的非货币性资产。无形资产包括商誉、特许经营权、专利权、商标权等。无形资产的计量存在一定的困难，只有在发生交易时才会体现其价值。也就是说，很多品牌价值很高的企业，其实在会计报表中并没有计入这部分资产。很多品牌价值较高的企业，在这部分资产中往往存在低估的情况，投资者需要自行估算其大致价值，以便获得标的企业更为准确的价值数据。


    商誉是一种需要特别关注的资产。商誉，一般是企业对外收购时，实际支付的价格高于被收购企业资产而形成的溢价。如果被收购企业的业绩不如预期，则有商誉暴雷的风险。科大讯飞
    2020 年的商誉资产为 11.11 亿元，存在一定的暴雷风险。'
