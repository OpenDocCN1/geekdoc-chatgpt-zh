    # 4. 中科创达估值分析


    以 2020 年底每股收益 1.08 元为基准，并以 40% 净利润增长率计算，2021 年每股收益为 1.51 元。考虑按照 40 倍市盈率来为股票估值，其
    2021 年股价预测值为 60.40 元。若该股的净利润增速能够达到 40%，那么，该股 40 倍市盈率所对应的 PEG 值仅为 1，属于比较合理的水平。当然，该股营收增长可能会高于
    40%，鉴于该股的毛利率水平较高，所以适当地将该股的 PEG 值扩大到 2 倍，也是可以接受的，则对应的市盈率为 80 倍，估值为 120.80 元。


