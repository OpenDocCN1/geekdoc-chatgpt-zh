    从四方光电的财务报表中还可以看到，截至 2020 年底，该公司手中现金余额为 7000 万元左右。该公司 2021 年 2 月才完成上市融资，2021 年第一季度末的现金余量为
    5.20 亿元。


    截至 2020 年底，该公司应收账款为 1.04 亿元，存货为 8700 万元左右，相对于该股营收来说，应收账款和存货都有些高了，毕竟整个企业的营收刚过 3
    亿元。截至 2020 年，该公司预收账款（合同负债）为 1300 万元左右，这说明该公司对下游企业的控制能力还可以。


    2020 年，该公司研发费用为 1900 万元，考虑其营收规模，这也不是一个很高的数字。也就意味着，该公司在融资之后可能会加大研发投入。


    从整体情况来看，该公司的财务状况不错，待上市融资项目投产后，该股营收与净利有望更上一个新台阶。


    # 4. 四方光电估值分析


    针对四方光电的成长状况，可以考虑按照 PEG 估值法进行估值。按照该股净利增速来看，该股 2020 年每股净利润为 1.61 元。若预测 2021 年保持
    40% 的净利增速，则每股收益为 2.25 元。那么，按其 40 倍的市盈率来估值，则其股价为 90 元。也就是说，40 倍估值对应了 40% 的净利增速，其
    PEG 值仅为 1，这是一个相当保守的估值。若将市盈率放大至 50 倍，其 PEG 值为 1.25，也是一个可以接受的水平，则其股价估值为 112.50 元。


