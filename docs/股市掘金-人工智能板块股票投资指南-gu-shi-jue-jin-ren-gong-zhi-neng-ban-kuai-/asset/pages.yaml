  md: '好的一个环节。从全球计算机视觉产业发展来看，在与国外企业的对比中，国内相关企业都具有了较强的竞争能力。之前提及的计算机视觉产业四小龙，全部来自于该产业链的中游。


    +   3. 下游： 应用层


    计算机视觉技术的应用领域非常广泛，且仍在不断拓展其边缘。目前，计算机视觉技术应用较好的领域包括金融、安防、手机、零售、无人驾驶、医疗影像、工业制造、广告影像等。


    # 三、计算机视觉领域投资逻辑


    从计算机视觉领域选择投资标的时，投资者需要遵循这样几个基本逻辑。


    第一，产业链中游为该产业最核心的环节，因此，商汤、旷视、依图、云从等四家企业就是最核心的标的。不过，由于这四家企业目前没有上市（未来极有可能登陆科创板），因此，投资者一方面可以密切关注这几家企业的上市时间表，另一方面也可以考虑退而求其次，从该环节中选择其他企业。当然，这一领域内的其他企业也有很多没有上市，像汉王科技就是比较稀缺的品种了。


    第二，计算机视觉产业链的下游应用层也是值得关注的一个方向。随着科技的发展，计算机视觉技术的应用领域也会逐渐增加，目前，比较典型的应用领域包括如下几个，如图
