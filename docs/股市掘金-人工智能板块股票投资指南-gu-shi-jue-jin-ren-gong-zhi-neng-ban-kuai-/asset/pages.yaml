  md: '# 第二章 审视人工智能板块


    随着科技的不断发展，我们所处的时代也将从万物互联逐渐过渡到万物智能化时代。人工智能正在与各行各业快速融合，助力传统行业转型升级。


    # 第一节 人工智能投资研究


    2016年3月，《中华人民共和国国民经济和社会发展第十三个五年规划纲要》出台。这份规划纲要提出：加快信息网络新技术开发应用，重点突破大数据和云计算关键技术、自主可控操作系统、高端工业和大型管理软件、新兴领域人工智能技术。人工智能技术首次被写入国家规划之中。


    +   一、人工智能发展的三个阶段


    人工智能技术从 20 世纪 50 年代末期被提出来，也是经过了几十年的发展才逐渐走向产业化的。从其发展历程来看，大致可以分为三个阶段，如图 2-1 所示。


    ![](img/66c566067fe44416002c3df906def5f6_19_0.png)


    图 2-1 人工智能发展的三个阶段'
  merge: -1
  img_proc: true
