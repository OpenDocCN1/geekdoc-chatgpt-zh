  md: '# 第一章


    # 投资人工智能板块，决胜未来


    人工智能（AI）一词最早在 1956 年的达特茅斯会议上提出。随着科技的发展，人们对人工智能的理解不断深入，人工智能的定义也在不断地更新。其中有一种定义被广泛接受，即人工智能就是与人类思考方式相似的计算机程序。


    从这一定义来看，人工智能的本质就是一个计算机程序，只是与人类思考方式相似。但也正因为如此是模仿人类的思考方式，才使得人工智能的研究还有很长的一段路要走，因为我们人类对自己的大脑以及思考方式的理解还在不断探索之中。总体来说，人工智能的发展是与神经网络技术（仿生人类大脑的工作方式）的发展密不可分的。


    随着大数据与云计算产业的发展，人工智能行业迎来了一波快速发展的黄金时期，越来越多的人工智能产品走进人们的生活。


    # 第一节 人工智能，未来科技发展的新高点


    2017 年 7 月 20 日，国务院发布《新一代人工智能发展规划》，提出了面向 2030 年我国新一代人工智能产业发展的指导思想、战略目标、重点任务和保障措施，部署构筑我国人工智能产业发展的先发优势，加快建设创新型国家和世界科技强国。在这份发展规划中，将人工智能产业的发展提升至国家战略规划的高度，同时指出，人工智能产业将成为未来国际竞争的新焦'
  merge: -1
  img_proc: true
- pgno: 12
  md: '点，也会成为国民经济发展的新引擎。


    # 一、人工智能，科技竞争的主战场


    从整个科技发展的趋势来看，智能化已经是未来一段时间内科技发展的必然趋势。特别是随着云计算、大数据、物联网等行业的快速发展，智能化也为产业升级与换代赋予了新的动能。


    从万物互联到数据爆炸，都让原有的数据与信息处理方式不再适应未来发展的需要。与此同时，各类产业与互联网的结合日益紧密，让经济从宏观维度到微观各领域都产生了智能化新需求，催生了一大批新技术、新产业、新产品、新业态、新模式。这在一定程度上引发了经济结构的重大变革，深刻改变了人类的生产生活方式和思维模式，实现社会生产力的整体跃升。换句话说，只有不断地培育和壮大人工智能产业，才能为我国经济注入新的动能。


    未来的竞争，更多地是科技竞争。最近几年爆发的中美贸易战，本质上也可以看成是一场科技战。人工智能作为未来科技发展的重要领域和方向，已经成为各国竞相争夺的主战场。从最近几年国内人工智能发展情况来看，尽管国内企业展现出了强大的竞争力和发展潜力，但必须同时意识到，国内人工智能企业与欧美等国企业之间还存在较大的差距，特别是一些涉及核心技术领域、高端芯片领域、高端传感器领域的差距更为明显。国内人工智能企业具有的优势一般在应用层面。基础层面竞争力的缺失，很可能成为限制我国人工智能企业进一步发展的一大障碍，这也是我国人工智能企业未来几年需要重点突破的方向。


    # 二、处于发展前沿的行业


    人工智能行业是目前最前沿的新兴行业。这个行业与其他新兴行业有一个很大的不同，该行业具有很强的融合和延伸能力，通过人工智能技术与其他产业的融合，可能会产生一些新的行业、新的企业。比如可穿戴装备、智能家居、无人驾驶等，都是人工智能技术与传统技术结合诞生的新领域。'
  merge: -1
