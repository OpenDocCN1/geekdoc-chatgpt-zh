  md: '# 挖掘人工智能板块中的金矿


    # （代序）


    股票价格与投资价值不同。很多绩优股都是有价值的，若股票价格远远高于内在价值，那么股票就不具有投资价值。投资价值是相对于股票价格而言的，当股票价格出现低估时，进场买入，并在股票价格高于内在价值时择机减仓。当然，这是从价值投资角度而言的。


    市场上，游资或者短线资金更青睐具有热门概念的股票。有些股票不仅没有投资价值，可能连基本的内在价值都缺乏。站在短线投机的立场，追涨这类股票没有问题，若想长线持股，则必须从股票的内在价值出发，寻找具有长线投资价值的股票，这才是正确的投资道路。


    投资者需要在某一极具潜力的行业中，选择具备较强竞争优势并在可预见的未来能够持续保持优势地位的企业，同时，以尽可能便宜的价格买入该企业的股票，这是选择股票的基本逻辑。人工智能板块，就是这类极具潜力股票的汇聚之地。


    从某种意义上来说，人工智能代表了未来的方向。阿里巴巴、腾讯、百度、华为等国内知名科技巨头，以及微软、谷歌、亚马逊等国际科技巨头，无一例外地在人工智能领域进行了广泛布局。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '由此可见，这些国内外科技巨头对人工智能板块的重视。


    人工智能板块的股票诠释了投资面对的风险与机遇。一方面，这个板块可能会孕育很多技术创新企业；另一方面，由于技术更迭，很多之前的绩优股转眼之间就变成淘汰的对象了。因此，投资者在研究这一领域的股票时，不能拘泥于书中所提及的领域或个股，而应努力掌握股票价格分析方法，从中挖掘未被发现的绩优股。


    即使投资者选到了绩优股，也并不意味着无论何时买入都会盈利。投资者可以按照书中给出的估值方法，结合市场行情，对股票价格大致做出预判。对于想要长期持有这些股票的投资者来说，最好的买入机会往往是熊市中，即当股价大幅走低后，逐步建仓并长期持有，这才是较佳的投资策略。


    不过，人工智能领域毕竟从属于科技领域，在科技领域，没有永恒的赢家，只有永远的创新。即使是一家霸主企业，若创新能力不足，也可能被淘汰出局。科技行业的竞争就是如此残酷。


    由于篇幅和笔者的精力有限，不能对整个板块中的个股一一进行深入分析，仅选取了具有代表性的股票进行研究。作为普通投资者，在研究投资标的时，只能假定我们获得的数据是真实可信的，因此本书所选股票并不一定是板块中最佳的投资标的。


    本书仅供研究使用，并不构成投资建议。'
