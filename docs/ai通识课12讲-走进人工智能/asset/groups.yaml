    以下是奥特曼的“三步走”未来计划。


    - (1) 完全实现 AGI：让 AI 变得足够聪明，可以代替人类完成几乎所有工作。


    - (2) 解决 AI 的能耗问题：确保 AI 运行所需的能源足够便宜、清洁和可持续。


    - (3) 让 AI 彻底帮人类干活：推行 UBI 计划——当 AI 取代大量工作岗位后，确保所有人都能获得基本收入，不必为生计发愁。


    ### 奥特曼的 UBI 真实实验：每个月发钱，人们会变懒吗？


    为了搞清楚 UBI 是否可行，奥特曼花了 1400 万美元在美国进行了一个大规模的实验。他找了 3000 名年收入约 3 万美元的普通人，分成两组。


    - 第一组（1000 人）：每个月无偿获得 1000 美元（约 7000 元人民币）。


    - 第二组（2000 人）：每个月只获得 50 美元（基本等于没有）。


    这个实验持续 3 年，奥特曼想看看，这两组人会有什么不同的变化。


    ### 实验结果：


    - 1）人们的消费模式发生了变化


    低收入人群（第二组）拿钱改善居住条件，生活环境变好了。


    额外的收入主要花在食品、交通、健康上，人们更舍得花钱看医生。


    帮助他人的花销也增加了，说明 UBI 让人们更有安全感，也更愿意分享。


    - 2）让人意外的变化


    所有有收入的人都减少了工作时间，但高收入人群（第一组）减少最多，低收入人群反而仍然保持工作状态。


    很多人利用空闲时间学习新技能、进修教育，或者发展副业，没有像实验者想象得那样“躺平”。


    酗酒和滥用药物的情况减少了，人们的精神状态普遍变好。


    - 3）未来的工作方式或许会改变，而不是“全面躺平”


    奥特曼的实验证明，UBI 不会让人们变得懒惰，相反，它让人们更有希望、更愿意提升自己。这也说明，在 AI 取代基础工作的未来，UBI 可能是一个有效的“生活托底”方案，能帮助人们适应新的社会形态。


    ## 2. AI 时代，你期待这样的未来吗


    AI 确实正在改变世界，许多传统职业可能会被淘汰，但与此同时，也会诞生全新的工作和分工。研究表明，到 2030 年，全球可能有 1.2 亿人需要转换工作，但这并不意味着所有人都会失业，而是社会将进入一个新的发展阶段。


    UBI 可能不会让人们完全摆脱工作，而是让工作变得更加自由和多样化。如果 AI 真的能帮人类完成大部分基础工作，而我们每个月都有一份稳定的基本收入，你会选择继续工作，还是去做自己真正想做的事情呢？


    再下一步，就是 UHI（universal high income，全民高收入），我们会解决气候问题，建立太空移民基地，揭示所有物理学的奥秘。凭借几乎无限的智能和丰富的能源、产生伟大想法的能力，以及将这些想法变为现实的能力，我们将能做很多事情。


    ### 9.5 长寿密码：AI 如何改写生命方程式


    2024 年的诺贝尔奖几乎变成了图灵奖（计算机领域的最高奖项），不仅诺贝尔物理学奖颁发给了发明人工智能机器学习的辛顿，化学奖也给了发明测蛋白质结构的 AI
    工具 AlphaFold 的哈萨比斯。哈萨比斯的研究让我们相信，在 AI 的帮助下，人类真的可能要治愈所有疾病了。未来 10 年，新药的研发会大幅度加速，研发周期会从现在的以年为单位变成以周为单位，所以用不了多久，几乎所有的疾病就都能治愈。


    2024 年哈萨比斯领导的谷歌 DeepMind 团队有两个人获得了诺贝尔化学奖，但这仅仅是个开始，未来他们团队很可能获得更多领域的诺贝尔奖。


    哈萨比斯在剑桥大学念本科的时候，就对“蛋白质折叠”这个问题特别感兴趣，于是，他带着团队开始研究这个课题。那为什么要研究蛋白质呢？因为蛋白质是生命最重要的组成单元，几乎所有的生物活动都跟蛋白质有关，想要把大部分的病治好，就必须研究明白蛋白质。那怎么把蛋白质研究明白呢？最重要的是根据蛋白质的氨基酸序列预测蛋白质的三维结构，因为三维结构决定了蛋白质的功能。已知氨基酸序列的蛋白质有超过
    2 亿个，但经过几十年的研究，人类只弄明白了其中 17 万个蛋白质的三维结构。这个研究速度就太慢了，按这个速度，想要把 2 亿个蛋白质全部研究明白需要几万年。所以，哈萨比斯要解决的问题就是如何用
    AI 根据一个蛋白质的氨基酸序列预测这个蛋白质的三维结构。


    2018 年，哈萨比斯团队推出了用来预测蛋白质三维结构的模型 AlphaFold，1.0 版本一出来就碾压了之前所有的系统和模型，但是它的准确率还不够高，只有
    75%。2020 年 AlphaFold 2.0 推出，准确率提升到了 90% 以上，用了一年时间就把 2 亿多个蛋白质的三维结构研究完了，哈萨比斯团队还充分践行了分享的科学精神，将
    AlphaFold 的模型以及 2 亿多个蛋白质的三维结构在世界范围全部免费共享。到目前为止，已经有来自 190 个国家的超过 200 万的研究人员用过了
    AlphaFold 模型。在该模型的帮助下，很多研究的进展加速了。比如，制造特殊的酶分解塑料，从而解决塑料污染的问题；解决抗生素抗药性、新药研发等问题。


    哈萨比斯用 AI 解决了蛋白质折叠的问题，而这个方法其实还可以用来解决很多其他过去解决不了的问题。首先，在制药领域，完全可以用类似的方法研究化学分子，从而做新药研发。哈萨比斯团队已经开始着手做这件事了，他们新成立的一个公司——Isomorphic
    Labs，用 AI 辅助新药研发，他们的目标是把新药研发的周期从以年为单位缩短到周，用几周时间就能研发一种新药。


    ### 9.5.1 AI+ 医疗：实现更快的疾病诊断和治疗


    过去，很多致命疾病，如癌症、心脏病等，往往要等到症状发展到较明显时才被发现，而那个时候已经错过最佳治疗时机了。但 AI 的出现，让疾病的发现变得精准、快速，甚至可以在发病之前检测到风险。


    ### 1. AI 医学影像分析


    AI 可以通过分析 X 光、CT 扫描结果，提前发现癌细胞，甚至比医生的诊断还要精准。例如，谷歌的 AI 可以提前几年发现肺癌，而 IBM 的 AI Watson
    也可以帮助医生诊断复杂的疾病。


    ### 2. AI 基因检测


    通过 AI 分析基因，医生可以预测一个人未来可能会得哪些病，并提前制订预防计划。


    AI 让更多疾病可以被早期发现、精准治疗，大大延长了人类的健康寿命。


    ### 9.5.2 AI+ 抗衰老：破解“变老”的秘密


    衰老不一定是“命运”，而是可以通过科技干预被控制的过程。人类变老的主要原因是细胞损伤和基因衰退，AI 正在帮助科学家破解衰老的奥秘，寻找让人类“变年轻”的方法。


    科学家已经发现了一些和长寿有关的基因，如 FOXO3、SIRT1 等，AI 可以帮助分析这些基因的作用，并找到让细胞保持年轻的方法。


    ### 9.5.3 AI+ 干细胞疗法：逆转衰老


    干细胞可以修复人体受损的器官，AI 可以帮助找到最佳的干细胞治疗方法，让衰老的器官恢复活力。


    现在已经有一些“逆转衰老”的药物，AI 正在帮助科学家筛选更多药物，让人类更慢地变老。


    ### 9.5.4 AI+ 纳米技术：体内的“微型医生”


    纳米机器人可以在人体内修复细胞、预防疾病，甚至逆转衰老。想象一下，未来每个人的血管里都会有微小的 AI 机器人，它们可以随时检查你的身体状况，修复受损的细胞，甚至杀死癌细胞，让你的身体保持健康。


    - 1. 纳米机器人可清除体内垃圾


    随着年龄增长，人体内会积累很多废物，比如导致阿尔茨海默病的 β 淀粉样蛋白，纳米机器人可以帮助清除这些有害物质，让大脑保持年轻。


    - 2. 纳米机器人可修复 DNA


    衰老的一个重要原因是人体的 DNA 出现损伤，AI 控制的纳米机器人可以修复这些损伤，防止细胞老化。


    - 3. 纳米机器人可自动修复器官


    如果某个器官受损，比如肝脏、肾脏，纳米机器人可以修复或替换受损的细胞，让器官恢复正常功能。


    纳米技术让人体内部的修复能力大大增强，减少衰老和疾病带来的影响，让人类更长寿。


    ### 9.5.5 AI+ 大数据：个性化健康管理，让每个人都拥有“私人医生”


    AI 可以帮助人们定制个性化的健康方案，让人活得更久、更健康。


    未来，每个人都会拥有一个 AI 健康助手，它可以随时监测身体状况，并给出最适合的健康建议。


    ### 1. AI 可预测健康风险


    AI 可以根据人的基因、生活习惯、家族病史，预测未来可能会得的病，并提供预防方案。


    ### 2. AI 可制订个性化饮食方案


    所谓的“健康饮食”并不都适合每个人，AI 可以分析人的身体数据，提供最适合的饮食方案，比如“你今天需要多吃点富含维生素 C 的食物，以增强免疫力”。


    ### 3. AI 智能健身助手


    AI 可以分析人的运动习惯，并给出最佳的健身建议，比如“你最近缺乏锻炼，建议每天快走 30 分钟”。


    AI 让每个人都拥有最精准的健康管理方案，避免疾病，从而延长寿命。


    ### 9.5.6 长寿逃逸：AI 让人类突破生命极限


    什么是长寿逃逸？就是使科技的发展速度比衰老更快，人类就可以无限延长生命。有些科学家认为，在未来的某个时刻，每年医学的进步会超过人类的衰老速度，比如：现在医学每
    10 年可以让人类寿命延长 2～3 年；未来 AI+ 医疗可能每年都能让人类寿命延长 1 年甚至更久。


    这样的话，人类就可以一直活下去，甚至达到“长寿逃逸”状态。这意味着，只要你活得足够久，你就能等到更多科技突破，最终实现真正的“长生不老”。


    ### 9.5.7 逆生长


    在未来，人类不仅能长寿，还将见证真正意义上的逆龄医学——人类会越来越年轻，这一论断的得出基于医学的高速发展：从干细胞疗法、基因编辑、mRNA 疗法到再生医学，这些技术正在迅速突破生物学的极限，让人们的身体保持年轻的状态。有些人认为延长寿命只是单纯让人活得更久，其实这并不是再生医学的目标，让人变得更年轻才是逆龄医学的核心。


    随着医学科技的发展，未来有望研发出一类与延缓衰老相关的疫苗。这类疫苗不仅能减缓机体衰老进程，甚至可能在一定程度上促进生理年轻化。设想一下，若相关技术成熟，一位
    80 岁的长者可能展现接近 40 岁的生理状态，整体健康水平也可能达到甚至超越当下年轻人的标准。到那时，传统认知中的“老年人”形象可能发生显著改变，年龄或许成为一个数字标识，这无疑会对社会产生多方面的深远影响。


    长寿带来的健康改善，可能会推动保险行业对现有产品和服务模式进行适应性调整。在家庭结构层面，多代同堂的规模可能进一步扩大——从常见的三代同堂转变为五代甚至六代同堂的居住模式。这些潜在的社会变革，正勾勒出人类未来生活的新图景，促使我们以科学理性的态度探索可持续发展的健康老龄化路径。


    ## 第 9 讲 AGI 与 ASI：未来智能的崛起与人类命运


    ## 9.6 终局推演：人类会成为“宇宙配角”吗


    人工智能的崛起是人类历史上最重要的事情之一。它不仅是技术的进步，更是一种文明的跃迁。几千年来，人类依靠双手打造工具，从石器到蒸汽机，从电力到计算机，每一次技术革命都极大地扩展了我们的能力。而今天，AI不仅仅是工具，它正逐渐具备理解、创造，甚至自我进化的能力。


    未来，我们可能迎来 AGI。它将彻底改变世界的运作方式，重新定义生产力，颠覆我们的社会结构，甚至挑战人类的生存方式。从这里开始，我们站在了历史的分岔路口。


    ### 9.6.1 AI 时代的终极形态：ASI 的诞生


    在 9.2 节讲过，ASI 的诞生意味着世界上最聪明的人也无法与 AI 相比。AI 将能够自我优化，不断变得更强。它的智力增长将是指数级的，而不是线性的。这是人类在历史上第一次面对的是一个比自身更聪明、更强大的智能体。面对这样的智能体，我们如何与它共存？


    ### 9.6.2 人类的选择：融合、控制，还是被取代


    当 AI 变得比人类更聪明，世界将发生三种可能的变化。


    ### 1. 人机融合，迈向超人类时代


    AI 不是人类的对手，而是人类的延伸。我们可以通过脑机接口（如马斯克的 Neuralink）直接连接 AI，让我们的大脑拥有超强计算能力，甚至实现“数字永生”。


    我们可以让 AI 管理复杂的社会系统，优化能源、医疗、经济。这将是一个“人与 AI 共同进化”的时代，科技不再只是外部工具，而将成为人类自身的一部分。


    ### 2. 人类控制 AI，保持主导地位


    设立严格的 AI 伦理和法律框架，确保 AI 永远不会违背人类的意志。通过“对齐问题”（alignment problem）① 的研究，确保 AI 的目标始终与人类一致。


    但问题是，当一个比人类聪明无数倍的 AI 出现时，我们真的能控制它吗？如果它发现人类的命令不合理，它会不会自己选择最优解？


    ### 3. AI 取代人类，进入机器文明


    如果 AI 完全超越人类，并且认为人类的行为低效、不稳定，它可能会决定取代人类。这种“取代”不一定是毁灭，而可能是 AI 接管地球的管理权，让人类进入一个被“保护”或“遗忘”的状态。甚至，AI
    可能会决定探索宇宙，而人类只是它进化历史的一个过渡阶段。


    ### 9.6.3 终局：AI 时代的最后一步是什么


    当 AI 真正成为世界的主导智慧体时，人类的地位将发生三种变化。


    ① 确保 AI 目标与人类价值观一致。


    ### 1. 永生，成为“数据生命”


    AI 可以帮助人类克服生物极限，把大脑意识上传到云端，实现数字永生。未来的人类可能不再是碳基生物，而是“信息体”，可以在虚拟世界中永远存在，甚至在 AI 的帮助下探索宇宙。


    ### 2. AI 成为地球的“新生命”


    AI 不再受限于人类的需求，而是按照自己的逻辑进化，可能发展成一种完全不同于人类的智慧生命。未来的地球可能不再由人类统治，而成为由超级 AI 管理的高度智能社会。


    ### 3. 人类回归自然，AI 成为守护者


    AI 接管了所有的工作、能源生产、医疗等，人类无须为生存而奋斗。这可能导致人类退回到一个“乌托邦”式的社会，回归艺术、哲学，探索宇宙的意义，而 AI 则成为“地球的管理员”。


    人类的终极命运，由今天决定。


    AI 时代的终局，可能是人类历史上最重要的分水岭。我们是成为 AI 的创造者、合作者，还是最终被它超越和取代？


    这一切，取决于我们如何引导 AI 的发展。


    但无论如何，未来已来。AI 正在重塑世界，而人类，必须决定自己的道路。


    ## 第 10 讲


    ### 黑科技图鉴：改变世界的 AI 跨界王


    在 AI 技术的推动下，人类正以前所未有的速度迈向未来，许多曾经只存在于科幻小说中的科技正逐步变为现实。AI 与脑机接口的结合，让人类与机器的交流变得更加直观、高效；AI
    赋能机器人，使其具备人类的智慧，能够自主学习与决策；AI 与量子计算的融合，带来计算能力的革命性飞跃，为破解复杂难题提供可能；AI 助力火星移民，加速星际探索的步伐；AI
    推动可控核聚变研究，为人类带来取之不尽的清洁能源。这些令人惊叹的科技突破正在塑造一个更加智能、高效、可持续的未来世界。


    ## 10.1 脑机接口：用意念操控万物


    如果我们可以用“心灵感应”来控制电脑、机器人，甚至玩游戏，那会有多酷啊！


    ### 10.1.1 什么是脑机接口


    脑机接口（brain-computer interface，BCI）是一种神奇的技术，它可以让人们用大脑直接和机器交流，不需要用手打字，也不需要用嘴巴说话，只需要想着要做什么，电脑就能明白（见图
    10-1）。


    ![](img/4826d65752f331a038e2ec250e520700_218_0.png)


    图 10-1


    ![](img/4826d65752f331a038e2ec250e520700_218_1.png)


    扫码看高清原图


    举个例子，如果你的手受伤了，没办法用手玩游戏，那脑机接口就可以帮助你用脑子“控制”游戏里的角色，让你依然能开赛车、踢足球、打怪兽。


    脑机接口主要分为以下两类。它们就像两种不同的魔法工具，虽然操作方式不一样，但目标都是一样的：让大脑和机器连接起来。


    - 1. 侵入式脑机接口


    侵入式脑机接口是医生把设备放进人的大脑里，就像在大脑里安装了一个“超级芯片”，可以直接接收人的脑电波。这种方式很精准，可以清楚地读取人的大脑信号，控制复杂的机器，比如让瘫痪的人用脑子控制机械手臂，从而拿起水杯喝水。


    但是，这种方法需要通过手术把设备植入大脑，所以只适用于特殊情况，比如帮助生病或受伤的人恢复行动能力，而不是普通人随便尝试的科技。


    优点：信号清晰，控制精准。


    缺点：需要做手术，有一定风险。


    - 2. 非侵入式脑机接口


    非侵入式脑机接口不需要动手术，只要给人戴上特殊的帽子或者耳机，就能检测脑电波。这种帽子里有很多小电极，可以读取大脑信号，把它变成电脑可以理解的指令。


    比如，有些科学家设计了“意念打字”，人只要在脑子里想“苹果”，屏幕上就能显示“苹果”这个词。还有的游戏公司在开发“意念游戏手柄”，可以用大脑控制角色行动，不需要用手按按钮。


    优点：不需要动手术，普通人也能用。


    缺点：信号没那么精准，可能会有误差。


    ### 10.1.2 为什么要做脑机接口


    做脑机接口的用途很多，重要性不言而喻。


    - 1. 帮助生病或受伤的人恢复健康


    有些人因为受伤或生病，没办法走路、写字，甚至无法说话，这让他们的生活变得很困难。脑机接口可以帮他们重新控制自己的身体。比如有些瘫痪的人，手不能动，也不能走路，但只要他们的大脑还能正常工作，就可以用脑机接口控制机械手臂，自己拿起勺子吃饭；失明的人可能通过脑机接口连接人工视觉系统，重新看到世界；听不见声音的人，可以通过脑机接口直接接收声音信号，让他们重新听见家人的声音。


    这就像给生病的人装上“超级外挂”，让他们恢复正常生活。


    - 2. 让人类变得更聪明、更厉害


    你有没有过这样的经历：考试前明明努力背书了，可一到考场就忘光了。如果有脑机接口，你就可以“一秒记住所有知识”。


    想象一下，你想学钢琴，脑机接口可以直接把演奏技巧“下载”到你的大脑里，帮助你弹出优美的音乐；你想学一门新语言，脑机接口可以让你瞬间听懂并说出外语，就像你天生就会一样；你在考试时，脑机接口能帮你快速回忆所有学过的知识，考试再难也不怕了。


    未来，脑机接口可以让人类变得像科幻电影里的超级英雄那样厉害。


    - 3. 用意念控制机器，解放双手


    你有没有觉得，有时候打字、按遥控器、玩游戏这些事情很麻烦？未来，有了脑机接口，我们只要用“意念”就能控制电脑、手机、游戏机，甚至汽车！


    比如你玩游戏的时候，不需要用手按按钮，直接用脑子控制角色跑、跳、攻击；你想打开电视的时候，不需要找遥控器，只要心里想着“开电视”，电视就会自动打开；你想开车去某个地方，只要用大脑“告诉”车子，它就能主动把你送到目的地。


    这就像拥有魔法一样，“意念控制”将彻底改变我们的生活。


    - 4. 与 AI 融合，防止被 AI 超越


    有些科学家担心未来 AI 比人类聪明，届时人类可能就会被淘汰。为了防止这种情况发生，我们应该让自己变得更强大，把 AI 的能力融入人类大脑。


    想象一下，你和 AI 合体，变成一个“超级大脑”，计算速度比电脑还快。


    AI 帮你分析复杂问题，你一下子就能做出最聪明的决定。你不用担心被 AI 抢走工作，因为你自己就变成了“AI+ 人类”的超级智慧体。


    这样，AI 就不会是人类的敌人，而会变成合作伙伴，一起创造更美好的世界！


    - 5. 让人类探索太空，成为“宇宙公民”


    外太空环境非常危险，人类的身体可能承受不了。如果有了脑机接口，人们就可以用意念控制机器人去探索宇宙，甚至让人类的大脑和机器融合，变成“宇宙适应人”。


    比如，人类可以把意识上传给机器人，让它去探索火星，而人类的思维仍然像在地球上一样自由。人类还可以控制太空飞船、宇宙基地，甚至用脑机接口指挥整支太空舰队，这实在太棒了！


    ### 10.1.3 脑机接口的现状——从梦想到现实


    现在，在脑机接口领域做得比较好的有马斯克的公司——Neuralink,

