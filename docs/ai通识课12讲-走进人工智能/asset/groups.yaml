    AI 不能像人类那样真正“理解”一个标志的意思，而是通过像素的排列方式识别它。那些小纸片可能刚好让 AI 的计算发生偏差，就像你玩拼图时，有人偷偷换了一块，结果你拼出来的图案就“走样”了。


