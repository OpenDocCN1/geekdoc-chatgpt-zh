    圆形、三角形、矩形。比如，它会发现猫的耳朵是三角形，车轮是圆形。


    （3）第三层放大镜（整体识别）：这一层把所有的形状组合起来，判断这到底是什么东西。比如，两个尖耳朵 + 胡须 + 竖瞳孔 = 猫，圆形轮子 + 座椅 = 自行车。


    这些“放大镜”是怎么工作的呢？这里就用到了矩阵运算。你可以把 AI 想象成一张透明的网格盖在图片上，每次移动一点点，然后计算图片的局部特征。AI 会不断地扫描整个图片，把这些特征组合起来，最终得到一个完整的识别结果，如图
    2-2 所示。


    ![](img/4826d65752f331a038e2ec250e520700_42_0.png)


    图 2-2


    这个方法最早是由华人科学家李飞飞发明的，她让 AI 学习了 100 万张标注好的图片（ImageNet 数据集），通过不断训练，AI 终于学会了识别猫、狗、汽车等各种物体。


    CNN 之所以适合图像处理，是因为它能有效地利用图像的空间信息。


    例如，猫的耳朵——无论左边还是右边，它们的特征都是相似的，因此'
  - '[PAGE 43]


    CNN 可以通过卷积操作，让同样的“放大镜”在不同位置反复扫描，提高识别的稳定性。


    但是，CNN 在处理语言的时候却产生了一些问题，因为语言不像图片那样是“二维”的，而是一维的序列，每个单词的顺序很重要。如果你颠倒一下“我爱你”和“你爱我”的顺序，意思就完全变了。CNN
    无法准确理解这种顺序关系，所以我们在第一讲讲大语言模型时强调，不管是 GPT 还是 DeepSeek，它们用到的都是 Transformer 模型。


    Transformer 的核心是“注意力机制”（attention），它不像 CNN 那样逐层扫描图片，而是同时看整句话的所有单词，然后计算它们彼此的关联。例如，在句子“猫坐在垫子上”中，Transformer
    可以发现“猫”这个词和“坐”这个动作之间的关系比“垫子”更强。


    Transformer 的另一个优势是可以处理长距离的依赖关系。比如，在句子“虽然天气很冷，但我还是出去跑步了”中，最重要的信息是“虽然”和“但”之间的对比，而
    CNN 在处理这种长距离的关系时会变得很困难，而 Transformer 可以轻松找到这些词之间的联系。


    所以，总结出 CNN 和 Transformer 的区别如下。


    +   (1) CNN 适合图片，因为它擅长分层次提取局部特征，如边缘、形状、整体物体。


    +   (2) Transformer 适合语言，因为它擅长全局理解，能同时关注整个句子的所有部分，并计算单词之间的关系。


    这种区别决定了 CNN 主要用于图像识别，比如让手机相册自动分类，或帮助自动驾驶汽车分析路况。而 Transformer 则用于处理文本，比如让 AI 能理解和翻译语言，或者让聊天机器人准确回答你的问题。而现在多模态的
    AI 可以把这两种能力结合起来，让机器不仅能看懂图片，还能理解'
