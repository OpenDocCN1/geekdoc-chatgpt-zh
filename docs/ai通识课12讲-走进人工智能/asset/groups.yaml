    #### 8.3 思维编码术：用自然语言指挥 AI


    ##### 8.3.1 提示词的核心原则


    - (1) 清晰具体：明确表述你的需求，避免模糊语言。


    - (2) 简单直白：语言简单易懂，避免专业术语。


    - (3) 逻辑递进：任务分解清晰，从简单到复杂逐步完成。


    在使用 Trae.ai 平台进行游戏开发时，编写高效的提示词至关重要。好的提示词可以帮助 AI 准确理解你的需求，并顺利生成你所需要的 Python 代码。


    ##### 8.3.2 STAR 框架介绍


    - 1. 情境（situation）


    描述清楚你当前所处的开发场景或背景，让 AI 能明确你提出需求的前提。


    - 2. 任务（task）


    清晰准确地表达你希望实现的具体功能或目标。


    - 3. 行动（action）


    明确说明你希望 AI 如何行动或实现具体功能的方法与步骤。


    - 4. 结果（result）


    明确表达你期望最终实现的效果或具体输出的样子，以便 AI 生成符合预期的代码。


