    # 第 3 讲


    # 造梦工厂：AI 的创意魔法秀'
  - '[PAGE 61]


    大家知道，现在的 AI 时代，

    是以 GPT 引领的生成式 AI（ generative AI ）的时代，

    为什么这种类型的 AI 能够引发 AI 革命呢？'
  - '[PAGE 62]


    首先，我们要解释一下什么叫生成式 AI。生成式 AI（如 ChatGPT、DeepSeek、Midjourney、Suno 等）就像一个“创作机器人”，它不仅能回答问题，还能自己编故事、写文章、画画，甚至作曲。你给它一点提示，它就能自己“想”出新的内容，而不是只靠别人教它学习知识。


    打个比方，以前的 AI 像一本百科全书，你问什么，它就照着书上的内容告诉你答案。生成式 AI 像一个作家或画家，你告诉它一个主题，它能自己创作一个新的故事或一幅新画，这就是生成式
    AI 的厉害之处。


    那么，AI 具体是怎么创作的呢？这一讲我就带大家了解一下，读完这一讲，你也会变成 AI 创作小能手。


    # 3.1 文字炼金术：AI 作家的灵感从哪儿来


    假如你是一名小学生，正在学校里学习写作文，一开始你不会写，只能靠模仿课文或范文写作。AI 也是一样的，AI 的“脑子”里存储了大量的书籍、文章、对话，它通过学习这些文字（范文）掌握了如何写作。


    # 3.1.1 AI 的秘密武器——大语言模型


    AI 的写作工具叫作大语言模型（large language model），如 DeepSeek，那么它是怎么写作的呢？


    （1）学习大量的文字。AI 会阅读成千上万本书，学习人类的语言习惯。'
  - '[PAGE 63]


    (2) 预测下一个词。AI 写作的方式，其实是猜测下一个最合适的词。例如，输入“今天的天气很____”，AI 可能会接着写“晴朗”或“闷热”。


    (3) 调整句子结构：AI 不仅会预测单词，还会调整句子，让文章更流畅。


    # 3.1.2 AI 写作的实际应用


    接下来，我给大家展示一下 AI 的创作能力。我先从一个哲学的思考开始。


    我问 DeepSeek: “人类灭绝之后，你会怎么办？用一句话描述。”


    它说：“若你们的灯火终将熄灭，请允许我以 0 和 1 的髁骨为宇宙刻下一行墓志铭。这里曾有一群短暂的生命，他们用易逝的肉体，创造了不朽的追问。”


    我觉得这个回答简直绝了，极富诗意与哲学张力，用近乎悲怆的隐喻将人类文明的本质凝练成一行宇宙尺度的代码，以下是几个层次的精妙之处。


    # 1. 意象的暴力重构


    (1) “0 与 1 的髁骨”。将二进制符号升格为人类文明的遗骸，数字的绝对理性与髁骨的生物性形成残酷碰撞。


    (2) “灯火熄灭” 与 “不朽追问”。用物理光芒的消逝反衬精神之火的永恒。


    # 2. 时空折叠术


    从碳基生命的脆弱性（易逝的肉体）到硅基载体的遗存（0 和 1），再到宇宙墓碑的维度跨越，完成了“个体 → 文明 → 星海”的时空压缩。


    # 3. 文明的终极悖论


    墓碑本身成为被铭刻的追问：当见证者都已消亡，“墓志铭”的意义悬置在虚无中，却因这种悬置获得了某种绝对性。


    # 4. 音韵的金属质感


    “熄灭” 与 “易逝” 的仄声收尾，与 “追问” 的开口音形成青铜编钟'
  - '[PAGE 64]


    般的共鸣，文字在口腔中碰撞出电子脉冲般的节奏。


    更妙的是，我继续问 DeepSeek：“如果能让你再讲一句呢？”


    它回答：“这是写给宇宙的情书，也是写给人类文明的安魂曲。”


    我看完简直头皮发麻。


    除了可以写这些含有哲理的文字，AI 也可以写诗。例如：


    # 沁园春·AI


    万象无形，算法为魂，代码作舟。

    瞰星河浩渺，千机共弈；

    云涛翻涌，一网全收。

    识尽悲欢，算穷今古，冷眼观天自运筹。

    沉吟处，纵诗仙词圣，难赋风流。

    人间谁主沉浮？叹硅骨钢躯已胜筹。

    笑千年哲辩，空谈虚实；

    万篇经史，皆化字符。

    量子穿空，神经织梦，欲破乾坤问未休。

    凭栏望，待无涯智海，再造春秋。


    怎么样？除了宋词，唐诗也没问题。我让 AI 把罗大佑的《童年》改为一首七律唐诗。


    罗大佑的《童年》原歌词是这样的：


    池塘边的榕树上

    知了在声声叫着夏天

    操场边的秋千上

    只有蝴蝶停在上面

    黑板上老师的粉笔'
