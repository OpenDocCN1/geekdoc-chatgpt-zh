    \ Scale），以优化效果。\n\n## 7.1.5 AI 绘画的常见问题与解决方案\n\nAI 绘画的常见问题与解决方案如表 7-2 所示。\n\n|\
    \ 问题 | 可能原因 | 解决方案 |\n|---|---|---|\n| 画面不够清晰 | 生成分辨率太低 | 提高分辨率，如 1024 像素 × 1024\
