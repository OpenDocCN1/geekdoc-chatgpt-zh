    AGI 是“通才”——它就像一个聪明的学生，不但会数学，还能写作文、踢足球、画画，甚至可以学会新技能，就像我们人类一样。


    举个例子：


    如果你对一个普通 AI 说：“帮我做顿饭。”它可能会说：“我不会。”但如果你对 AGI 这样说，它就会执行以下流程。


    +   第一步：在网上查找做饭的方法。

