    # 2.3 动态追踪者：AI 如何破译视频里的时空密码


    你有没有想过，看电影的时候，为什么人物会动起来？其实，视频的本质就像一本会动的连环画，是由一张张静态的图片（帧）快速播放形成的，就像你翻动小人书一样。电影通常每秒播放
    24 张图片（帧），而游戏通常是 60 帧 / 秒，播放速度越快，画面就越流畅。每一帧都是一张普通的照片，它的分辨率（比如 1920 像素 ×1080 像素）决定了图片的清晰度。AI
    想要“看懂”视频，就需要同时理解每一帧画面，并且分析帧与帧之间的关系，找到画面中物体的运动规律。


    # 2.3.1 机器的“动态视力”——如何理解画面中的运动


    机器在看视频时，需要做两件事：第一，它需要懂得每一帧的画面内容，这和图片识别是一样的；第二，它需要分析帧与帧的关系，也就是'
  - '[PAGE 54]


    说，它需要学会发现画面中的动作变化。


    为了理解运动，AI 会用时间轴上的特征追踪发现物体的运动模式。比如，它会计算画面中像素点的移动方向和速度（光流分析），就像你观察水流中的树叶漂向哪里。它还会锁定物体的关键部分，比如人脸识别时，AI
    会特别关注鼻尖、眼角等稳定的特征点，以确保能够持续追踪同一个人。


    但单靠这些方法还不够。AI 需要更聪明的技术理解动作，比如 3D 卷积神经网络（3D-CNN）。普通的 CNN 只能识别单张图片的内容，比如看出一张照片里的动物是猫还是狗，而
    3D-CNN 可以同时处理空间（横向和纵向）和时间（前后帧的变化），这样它就能看出一个动作是如何发生的。举个例子，要识别“挥手告别”这个动作，AI 不仅要看到手的形状，还要观察手从下垂到摆动的轨迹，才能知道这是在挥手，而不是在挠头。


    AI 不仅可以理解单个动作，还能分清动作持续的时间长短。比如，打一个喷嚏可能只需要 0.5 秒，而做饭可能会持续 10 分钟。如果 AI 在短视频里看到一个人在跳舞，它就能通过分析一系列连续的动作，自动给视频打上“舞蹈挑战”标签。这种方法叫时间切片法，就是把视频分成很多小片段，对每一个片段分别分析，然后拼成一个完整的故事。


    但 AI 在识别视频时不能什么都看，它需要运用注意力机制关注重点部分。这就像你看篮球比赛，眼睛会盯着持球的球员，而不会去看裁判。AI 也是一样的，它会在不同的时间段关注不同的区域，比如在跳水比赛时，它会重点关注运动员的起跳和入水瞬间，而不会去看泳池的水质情况。'
  - '[PAGE 55]


    # 2.3.2 AI 如何理解“空间智能”


    光看懂单个画面还不够，AI 还需要知道物体在空间中的位置。李飞飞教授一直在研究空间智能，也就是让 AI 不仅能识别物体，还能理解它们的三维关系。比如，你的房间里有一张桌子、一把椅子和一台电脑，AI
    不仅要知道这些是什么，还要知道桌子在椅子前面，电脑放在桌子上面。


    李飞飞的研究团队开发了一种叫作时空智能（space-time AI）的技术，它可以帮助 AI 理解世界的三维结构。比如，当 AI 在一个房间里导航时，它不会只看单个画面，而是会记住整个房间的布局，就像你在家里走动时，会知道厨房在哪里、卧室在哪里一样。


    这种技术对于机器人非常重要。比如，未来的智能家居机器人需要在房间里移动，它必须知道家具的位置，才能安全地绕开障碍物。AI 还可以捆绑增强现实（AR）技术，比如戴上
    AR 眼镜，AI 可以识别周围的环境，并在现实世界里叠加虚拟信息。


    李飞飞的研究也被应用在自动驾驶中，帮助 AI 理解路况。汽车自动驾驶系统使用了多个摄像头和神经网络模型。它的 8 个摄像头可以同时观察四周的路况，每秒能处理
    2300 帧图像，相当于每只“电子眼”每秒眨眼 288 次。AI 会用光流分析判断前方车辆的移动趋势，利用目标检测确认是否有人突然冲出来，还会用轨迹预测推测行人的下一步动作。这些数据最终会汇总到一个
    3D 空间建模系统中，让 AI 在“脑海”里构建一个立体的交通环境。


    # 2.4 多感官交响曲：当 AI 学会“眼观六路耳听八方”


    你有没有想过，AI 不仅能“看”世界，还能“听”世界，甚至能“理解”世界，就像人类一样，AI 也在学着用多种感官感知环境，不仅仅是用'
  - '[PAGE 56]


    “眼睛”（摄像头），还会用“耳朵”（麦克风）、“触觉”（传感器）收集信息，最后用“脑子”（人工智能算法）分析这些信息，做出决策。


    人类在日常生活中会用多感官协作。比如，人走在马路上，会看到信号灯变绿，听到汽车鸣笛，感受风吹在脸上，那么就会根据这些信息决定何时过马路。AI 也在学着这样做，从而让机器变得更聪明、更安全。


    # 2.4.1 自动驾驶的“眼脑耳配合”：AI 如何让汽车自动行驶


    自动驾驶汽车就像一个有“眼睛”和“脑子”的机器人司机，它需要“看”周围的路况，理解车道、信号灯、行人和其他车辆的行为，还要“预测”可能发生的情况，并提前做出决定。


    # 1. AI 的“眼睛”——多摄像头视觉系统


    特斯拉的自动驾驶系统有 8 个摄像头，相当于拥有 8 只眼睛，可以同时观察四周。


    +   (1) 前视摄像头。可看清 200 米外的信号灯、路牌、车道线。


    +   (2) 侧方摄像头。可监测旁边的车辆，防止有人突然变道。


    +   (3) 后视摄像头。可观察后方来车，避免发生追尾。


    # 2. AI 的“大脑”——计算机视觉和空间建模


    +   (1) 立体感知。AI 不会只单独看一张图片，而是会把所有摄像头的画面结合起来，构建一个 3D 立体地图，这样它才能知道：“左边有一辆自行车，右边有一辆公交车，前面
    100 米有个红灯。”


    +   (2) 即时处理。AI 会判断前方是一个静止的树，还是一个正在移动的行人，然后决定是否刹车或转向。


    +   (3) 预测决策。AI 能猜测其他司机的意图，比如如果旁边的车突然向'
