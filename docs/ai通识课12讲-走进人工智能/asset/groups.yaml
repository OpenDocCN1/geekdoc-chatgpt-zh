  - '[PAGE 219]


    举个例子，如果你的手受伤了，没办法用手玩游戏，那脑机接口就可以帮助你用脑子“控制”游戏里的角色，让你依然能开赛车、踢足球、打怪兽。


    脑机接口主要分为以下两类。它们就像两种不同的魔法工具，虽然操作方式不一样，但目标都是一样的：让大脑和机器连接起来。


    +   1. 侵入式脑机接口


    侵入式脑机接口是医生把设备放进人的大脑里，就像在大脑里安装了一个“超级芯片”，可以直接接收人的脑电波。这种方式很精准，可以清楚地读取人的大脑信号，控制复杂的机器，比如让瘫痪的人用脑子控制机械手臂，从而拿起水杯喝水。


    但是，这种方法需要通过手术把设备植入大脑，所以只适用于特殊情况，比如帮助生病或受伤的人恢复行动能力，而不是普通人随便尝试的科技。


    优点：信号清晰，控制精准。


    缺点：需要做手术，有一定风险。


    +   2. 非侵入式脑机接口


    非侵入式脑机接口不需要动手术，只要给人戴上特殊的帽子或者耳机，就能检测脑电波。这种帽子里有很多小电极，可以读取大脑信号，把它变成电脑可以理解的指令。


    比如，有些科学家设计了“意念打字”，人只要在脑子里想“苹果”，屏幕上就能显示“苹果”这个词。还有的游戏公司在开发“意念游戏手柄”，可以用大脑控制角色行动，不需要用手按按钮。


    优点：不需要动手术，普通人也能用。


    缺点：信号没那么精准，可能会有误差。'
