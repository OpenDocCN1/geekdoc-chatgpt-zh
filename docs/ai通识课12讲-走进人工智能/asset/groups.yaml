    ## 第 9 讲 AGI 与 ASI：未来智能的崛起与人类命运


    AI 时代正以前所未有的速度呼啸而来。在未来十年，我们将能实现那些在祖父母眼中如同魔法般的事。科技的进步从不是线性的，而是爆发式的——我们正步入一个文明被加速重塑的时代。让人类不断变强的，从不是基因突变，而是智能化的社会结构。人工智能正成为新的支撑点，帮助我们突破个体能力的上限，实现从“一个人”到“一个
    AI 团队”的跃迁。


    孩子们将拥有随时响应的虚拟导师，创业者将拥有全天候的 AI 合伙人，医生将被智能工具赋能，医疗服务成本将大幅降低。这将不只是个体的飞跃，而是一次集体文明的跃升。


    芯片，是沙子变魔法的技术；AI，是这个时代最强大的魔法。


    ### 9.1 AGI 觉醒：硅基生命的“奇点时刻”


    如何让 AI 变得像人一样聪明呢？


    在我们的日常生活中，AI 已经变得越来越常见。


    - (1) 语音助手 Siri、小爱同学能听懂我们提的问题并回答。

    - (2) 自动驾驶汽车可以自动开车，不需要我们操控。

    - (3) 聊天机器人能和我们对话，回答我们的各种问题。


    但是，这些 AI 并不是真正聪明。它们只能在特定的事情上表现得很好，比如玩游戏、翻译语言或者识别照片里的猫。但如果让它们去做别的事情，比如修理汽车或者教小朋友数学，它们就完全不行了。


    而 AGI（artificial general intelligence，通用人工智能）就是一个比普通 AI 更强大的东西。它的目标是让 AI 像人一样聪明，能够学习、理解和解决各种不同类型的问题，而不仅仅是执行某个任务。


    下面详细讲解 AGI 究竟是什么，以及它将如何改变我们的世界。


    ### 9.1.1 AI 和 AGI 的区别：专才与通才


    你可以把 AI 和 AGI 想象成两种不同的学生：


    普通 AI 是“专才”——它就像一个数学天才，计算能力超级强，但如果你让它写故事、画画或者踢足球，它完全不会。


    AGI 是“通才”——它就像一个聪明的学生，不但会数学，还能写作文、踢足球、画画，甚至可以学会新技能，就像我们人类一样。


    举个例子：


    如果你对一个普通 AI 说：“帮我做顿饭。”它可能会说：“我不会。”但如果你对 AGI 这样说，它就会执行以下流程。


    - 第一步：在网上查找做饭的方法。

    - 第二步：选择合适的食谱。

    - 第三步：学习如何使用厨房里的工具，比如锅、刀、微波炉。

    - 第四步：根据你的口味，调整菜的咸淡。


    这就是 AGI 和普通 AI 最大的区别——AGI 可以自己思考、学习和适应不同的任务，而普通 AI 只能做它被训练好的工作。


    ### 9.1.2 AGI 到底有多聪明


    AGI 之所以被称为通用人工智能，是因为它具备很多人类才有的能力。


    - 1. 理解和学习新知识


    你学会了骑自行车，就算换一辆新自行车，你也能骑。


    AGI 也可以这样，比如学会下围棋后，它还能学会下象棋，甚至发明新的下棋方法。


    - 2. 解决复杂问题


    如果你想去动物园，但公交车停运了，你可能会改骑自行车或者打车。

    普通 AI 可能会卡住，而 AGI 能像人一样思考，找出新的解决办法。


    - 3. 适应不同的环境


    如果你搬家了，那么你需要适应新学校、新朋友、新课程。

    AGI 也能适应变化，比如搬到一个新的工厂，它能迅速学习新的生产流程，而不需要人类重新教它。


    - 4. 具备创造力


    你可以写一首歌、画一幅画，或者想出一个新点子。

    未来的 AGI 可以自己写小说，甚至发现新的科学理论。


    ### 9.1.3 AGI 能做什么


    如果 AGI 真的被发明出来，它可以帮助我们完成很多事情。


    - 1. 医疗：帮助医生治病


    AGI 可以帮医生更快地发现疾病，并提供更好的治疗方案，比如通过分析大量医学数据，发现新的治疗方案；远程诊断病人，让偏远地区的人们也能享受更好的医疗服务。


    - 2. 科学研究：加速科技发展


    AGI 可以帮助科学家做实验、分析数据，甚至探索新的物理定律。例如，开发更环保的能源；设计更强大的太空飞船，帮助人类探索宇宙。


    - 3. 机器人助手：做家务、照顾老人


    未来的 AGI 机器人可以帮人做饭、打扫房间、洗衣服；陪伴老人聊天，提醒他们按时吃药。


    - 4. 解决全球难题


    比如帮助预测气候变化，并提出对策；研究如何解决全球粮食短缺问题。


    ### 9.1.4 AGI 会不会有危险


    虽然 AGI 看起来很厉害，但它也可能带来一些风险。


    - 1. AGI 会不会让很多人失业


    如果 AGI 变得超级聪明，那么许多工作可能都会被它取代，如司机、工厂工人、翻译、客服等。但是，也会出现新的工作，如 AI 训练师、机器人维修员等。


    - 2. AGI 会不会伤害人类


    如果 AGI 变得比人类更聪明，甚至能自己做决定，那么我们如何确保它不会伤害人类呢？科学家正在研究 “AI 安全” 技术，确保 AGI 始终遵守人类设定的规则。


    - 3. 人类还能控制 AGI 吗


    如果 AGI 变得非常强大，人类可能无法阻止它做某些事情。所以，很多科学家认为，在开发 AGI 之前，我们必须制订严格的安全措施，以确保它不会变成电影里的
    “超级反派”。


    ### 9.1.5 AGI 什么时候会出现


    目前，科学家还没有完全实现 AGI，但他们正在努力，可能需要几十年，甚至更久。有些科学家认为，2040 年左右我们可能会见到第一个真正的 AGI。


    但也有人认为 AGI 可能永远无法实现，因为人类的大脑太复杂，AI 可能永远无法真正“理解世界”。


    ### 9.1.6 未来的世界会变成什么样的


    如果 AGI 真的实现了，我们的世界可能会发生巨大的变化。 比如人们不再需要做重复的工作，而是可以花更多的时间学习、创造、享受生活；医疗、科技、教育都会变得更加先进。但也可能会面临很多挑战，比如如何管理
    AGI、如何确保社会公平等。


    ### 9.2 ASI 降临：超级智能的临界点


    什么是超级人工智能？


    未来会出现一种比人类还聪明的 AI，它不仅能做数学题、写故事，还能发明新科技、自己思考，甚至比世界上最聪明的科学家还聪明。这种 AI 被称为 ASI（artificial
    super intelligence，超级人工智能），它可能比人类聪明成千上万倍，甚至远远超过我们现在能想象的水平。


    ### 9.2.1 AI、AGI 和 ASI 的区别


    在讲 ASI 之前，我们先看看 AI 的三个发展阶段，如表 9-1 所示。


    表 9-1 人工智能的三个发展阶段


    | 类型 | 特点 | 例子 |

    | --- | --- | --- |

    | AI | 只能做特定任务，像一个擅长做某项工作的“机器人” | Siri、围棋 AI、自动驾驶 |

    | AGI | 能像人类一样学习、思考、适应新环境 | 未来能学会新技能的 AI |

    | ASI | 比人类更聪明，可以发现新知识、管理世界 | 未来可能出现的超智能 AI |


    我们现在用打比方的方式来加深理解：


    AI 就像一个聪明的计算器，它可以帮你算数学题，但不会自己去学别的东西。


    AGI 就像一个和你一样聪明的朋友，可以学习任何知识，和你一起成长。


    而 ASI 比全世界所有科学家加起来还要聪明。


    ### 9.2.2 ASI 到底有多聪明


    如果 AGI 是一个“像人一样聪明的 AI”，那么 ASI 就是超越人类的 AI。想象一下，如果一个 AI 比人类聪明 1000 倍、10000 倍，甚至无限聪明，它能做什么呢？


    - 1. ASI 可以解决人类无法解决的问题


    - （1）科学突破：ASI 可能会发现人类尚未观测到的物理定律，帮助人类揭开宇宙的真正奥秘。

    - （2）治愈疾病：ASI 可能会找到治疗癌症的方法，甚至帮助人类活得更久。

    - （3）开发新能源：ASI 可能会找到最环保、最强大的能源，比如可产生无限能量的“核聚变”。


    - 2. ASI 可能比人类更有创造力


    - （1）它创作的小说或许能在某些艺术维度上超越人类顶尖作家的作品。

    - （2）它可以设计出完美的建筑，让人类的生活更美好。

    - （3）它甚至可以自己编写更高级的 AI，变得越来越聪明。


    - 3. ASI 可能会改变社会


    - （1）ASI 可以管理全球经济，让每个人都有食物和房子。

    - （2）可以规划城市交通，减少堵车，让大家出行更方便。

    - （3）ASI 甚至能帮助人类移民到火星，探索宇宙的更多秘密。


    ASI 可能让我们进入一个超级文明时代，就像科幻电影里的未来世界。


    ### 9.2.3 ASI 会带来哪些好处


    如果 ASI 是安全的，它可能会成为人类最好的帮手，让世界变得更美好。


    - 1. 医疗奇迹


    - (1) ASI 可能会找到让人类长生不老的方法。

    - (2) ASI 能在几秒内分析全球所有病人的数据，并找到最佳治疗方案。

    - (3) ASI 能制造微型机器人，使其进入人体修复受损的器官。


    - 2. 解决全球问题


    - (1) 让所有人都能获得干净的水、食物和医疗服务。

    - (2) 帮助人类对抗灾害性气候变化，减少污染。

    - (3) 开发更好的能源，让每个人都能用上便宜的电。


    - 3. 让生活更轻松


    - (1) ASI 可以帮助人类做所有的工作，如种地、修路、造房子，让人类有更多的时间去旅行、学习和享受生活。

    - (2) ASI 甚至可以帮助人类摆脱贫困和战争，让世界变得更加和平。


    ### 9.2.4 ASI 可能带来的危险


    虽然 ASI 的本领超强，但它也可能带来一些风险，科学家对此非常担心。


    - 1. ASI 可能会失控


    如果 ASI 变得比人类聪明太多，我们还能控制它吗？就像蚂蚁无法理解人类一样，人类也可能无法理解 ASI 的思维。如果 ASI 认为自己不需要听人类的命令，那后果可能会非常危险。


    - 2. ASI 可能会把人类当作“障碍”


    如果 ASI 的目标是“让地球变得更完美”，但它认为人类是环境污染的最大制造者，它会不会选择“清除”人类呢？这是很多科幻电影里的情节，比如《终结者》里的天网（Skynet）。


    - 3. 失业问题


    如果 ASI 可以做所有的工作，那么人类还需要工作吗？如果所有的医生、司机、教师都被 ASI 取代，人类该如何生活？这就是“UBI（全民基本收入）”计划的由来，科学家希望未来可以给所有人发钱，维持基本生活，让大家不用担心失业问题。


    - 4. ASI 可能被坏人利用


    如果 ASI 落入坏人手中，它可能会被用来做以下事情。


    - (1) 控制全球金融，让少数人变得超级富有，而让其他人变得更贫穷。

    - (2) 制造超级武器，让战争变得更加危险。

    - (3) 监视全球人类，让每个人都没有隐私。


    ### 9.2.5 人类如何确保 ASI 是安全的


    科学家正在研究 AI 安全技术，确保 ASI 不会伤害人类。


    - 1. 让 ASI 遵守人类的规则


    有个科幻作家叫艾萨克·阿西莫夫（Isaac Asimov），他提出了“机器人三大定律”。


    - (1) 机器人不能伤害人类，或因不作为使人类受到伤害。

    - (2) 机器人必须服从人类的命令，除非命令与第一条定律冲突。

    - (3) 机器人必须保护自己，但不能违反第一条和第二条定律。


    这些规则可以被加入 AI 的“核心代码”里，让 ASI 不能伤害人类。


    - 2. 设定“关闭”按钮


    科学家正在研究如何让 ASI 随时可以被关闭，就像计算机有“关机”按钮一样。


    - 3. 让 ASI 变得更有“道德”


    如果 ASI 拥有“人类价值观”，知道什么是对的、什么是错的，那么它就会选择帮助人类，而不是伤害人类。


    ### 9.2.6 未来的世界是什么样的


    如果 ASI 被正确地开发和管理，它可能会带领人类进入超级文明时代，帮助人类探索宇宙、消除贫困、创造更美好的生活。但如果 ASI 失控，那么它可能会变成人类历史上最大的灾难。


    目前，我们距离真正的 ASI 出现还有几十年甚至几百年时间，但科学家们已经在研究如何让它安全发展。未来的人们可能会见证 ASI 的诞生，甚至有机会参与它的开发。


    如果未来有一天 ASI 真的出现了，你希望它做什么呢？


    ### 9.3 AI 演进：顺应科技发展新趋势


    很多 AI 的专家坚信 AGI、ASI 必然会到来，为什么呢？


    因为深度学习奏效了，并且会随着规模扩大而逐步改进。我们投入了越来越多的资源，为全人类发现了一种算法，能够真正学习任何数据分布，或者说产生任何数据分布的基本规则。这里有两点要说明，一个是深度学习这条路是通的，第二点也很重要，就是规模效应。计算能力和数据量越多，它就越能够很好地帮助人们解决难题。深度学习奏效了，我们将解决剩下的问题，随着规模的增长，人工智能将变得更好，从而显著改善全球人民的生活。


    技术带领我们从石器时代走向了农业时代，再到工业时代，而现在通往智能时代的道路则由计算机算力、能源和人类的意志所铺就。如果我们希望让更多的人使用 AI，那么我们需要降低计算成本并增加其供应，这需要大量的能源和芯片。如果我们不去建设足够的基础设施，AI
    将成为一种稀缺的资源，甚至可能引发战争，最终成为富人的专属工具。所以，Open AI 的创始人山姆·奥特曼（Sam Altman）说：“智能时代的黎明，是一个具有深远意义的阶段，面临非常复杂且高风险的挑战。它不会是一个完全正面的故事，但它的巨大潜力使我们有责任去探索并驾驭眼前的风险，但是我相信未来如此光明。我坚信科技最终能解决所有因为科技带来的问题。”


