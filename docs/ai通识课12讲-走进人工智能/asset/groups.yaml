    系统一虽然很快，但会犯错，这就是为什么我们说 AI 有时候会产生幻觉。因为系统一的反应速度快，但它并不擅长深思熟虑，它的答案只是基于经验，而不是经过逻辑推理，所以有时候会犯一些“想当然”的错误。比如，当我们问大语言模型：“兔子比大象大吗？”它可能会回答：“是的，兔子比大象大。”这听起来很荒唐，但为什么会这样呢？这是因为它的“快思维”有时会被误导——如果训练数据里有太多关于“兔子很大”或者“大象很小”的句子，它可能就会错误地认为“兔子比大象大”也是合理的。


    再比如，最经典的 AI 测试问题：9.11 和 9.9 相比，哪个更大？大部分的大语言模型 AI 会告诉你“9.11 比 9.9 大”，因为 AI 并不真正“计算”这两个数并进行比较，而是基于训练文本中的模式进行概率推断。如果
    AI 在海量文本中频繁接触“9.11”与“9·11 事件”强关联，以及“9.9”常与节日日期等场景绑定时，其语言模型会优先激活这些高权重语义标签，此时数字本身的数值属性被弱化，导致比较逻辑完全偏离数值维度，这就可能会出现错误的答案。另外
