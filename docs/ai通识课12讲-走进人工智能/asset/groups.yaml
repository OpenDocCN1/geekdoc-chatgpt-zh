    ## 推荐序


    我与包坤老师相识于8年前东方卫视的青少年科创节目《少年爱迪生》。

    当时，我和包老师、上海纽约大学前校长俞立中、主持人袁鸣、ISEF 工程挑战赛金奖获得者薛来等，分别担任评委和科创导师工作。此后，我们又在多个电视科普节目中相遇，包括央视《开讲啦》、湖北卫视《你好赛先生》等。包老师有很好的物理学背景，对科技的底层逻辑有深刻的洞察，更重要的是，他深耕科普和教育多年，懂科技、懂教育、懂孩子，擅长用生动的例子和通俗的语言向大众解释那些晦涩难懂的科学原理。


    人工智能正以前所未有的速度重塑世界。从 ChatGPT 的横空出世，到今年的 DeepSeek R1 惊艳全球，我们见证了 AI 在语言理解、图像生成、自动驾驶等领域的惊人突破，也不得不思考
    AI 未来的发展方向，以及它将如何影响我们的社会、工作和生活。面对这样一场变革，每个人都需要建立对 AI 的基本认知，尤其是在国家大力推动人工智能教育的背景下，这种认知显得尤为重要。


    正因如此，我非常欣喜地看到包老师写下了这本《AI 通识课 12 讲：走进人工智能》。这不仅是一本介绍 AI 技术的书，更是一本科普读物，它引导读者思考未来，帮助读者理解
    AI 的本质、学习 AI 的工作方式、掌握如何与 AI 高效协作。本书从 AI 的起源、学习方式、识别与生成能力，到 AI 在教育、工作、编程等方面的实际应用，再到
    AGI（通用人工智能）、AI 伦理、人与 AI 关系的深层思考，构建了一套完整的知识体系，让读者能全面理解 AI 的发展脉络和未来趋势。


    AI 时代已经到来，我们每个人都身处这场技术革命的浪潮之中。如何适应 AI？如何利用 AI？如何在 AI 时代找到属于人类的独特价值？本书将为你提供清晰的思路和答案。


    科技的意义不仅在于探索未知领域，更在于让更多人能够理解、掌握并受益于科技。包老师的这本书，正是一本能让 AI 走进每个人视野的作品。


    希望读者在翻开这本书的同时，也能打开思路，迎接 AI 时代带来的无限可能。


    中国科学院院士

    上海市科普作家协会理事长

    褚君浩

    2025 年 4 月


    ## 拥抱 AI 时代


    2016 年，阿尔法狗（AlphaGo）以 4：1 战胜围棋世界冠军李世石，震惊全球。许多人第一次意识到，人工智能已经在围棋这个被誉为人类智慧的巅峰游戏上超越人类。但这只是个开始——短短几年时间，AI
    的发展速度远超我们的想象：


    2020 年，GPT-3 发布，展示了惊人的自然语言理解和生成能力，人们惊讶地发现，AI 不仅能对话，还能写文章、编程，甚至创作小说和诗歌。


    2022 年，Stable Diffusion 等 AI 绘画工具让每个人都能通过输入文字生成精美的艺术作品。


    2023 年，GPT-4 推出，AI 的推理能力、逻辑能力更进一步，甚至能帮助人们完成科研论文、辅助法律分析、优化商业决策。


    2024 年，AI 视频生成技术让科幻电影变成现实，一句指令便能让 AI 生成完整的动态影像。


    AI 时代已经到来，我们的世界正在发生深刻的变革。


    如今，AI 已经无处不在，它正在学习、识别、生成、推理，并逐步成为我们的生活、工作、学习中的重要伙伴。然而，大多数人对 AI 仍然充满疑惑：


    AI 到底是什么？为什么 GPT 这样的语言模型可以“理解”我们？

    AI 是如何学习的？它如何识别语音、图像、视频，又如何进行推理和创作？


    AI 真的会有意识吗？未来，人工智能会取代人类的工作，甚至主导社会吗？


    普通人如何利用 AI？我们如何利用 AI 提高学习和工作效率，创造更多价值？


    本书将从 AI 的基本原理讲起，带你理解 GPT 等大语言模型如何从“猜词游戏”发展出智能，到 AI 如何识别、推理、创作，让你看清 AI 的运作机制；同时，我们也会探讨如何高效使用
    AI，让它成为你学习、工作和创作的强大助手。


    此外，我们还将深入讨论 AI 时代的伦理与人类价值：AI 会不会是人类最后的发明？在 AI 变得越来越强大的时代，我们的角色是什么？如何在智能时代保护自己的竞争力？哪些行业将被
    AI 颠覆，哪些行业会迎来新机会？


    AI 时代不是未来，而是现在。本书希望能帮助你建立对 AI 的系统性认知，不仅仅了解“AI 能做什么”，更重要的是理解“我们该如何与 AI 共存、合作，并让
    AI 为我们所用”。


    无论你是因 AI 发展太快而有些担忧、焦虑的家长、老师，还是对 AI 充满好奇的学生，抑或关注科技发展的未来学者，本书都能帮助你掌握 AI 时代的核心知识体系，并在这场智能革命中找到属于自己的方向。


    AI 时代已经开启，我们不应只是旁观者，而应成为主动拥抱变化的探索者。基于人工智能技术的快速发展超乎人们的想象，本书做了大胆推测，有不妥之处供大家商榷。让我们一起走进人工智能的世界，理解它、利用它，并思考它将如何塑造我们的未来。


    包坤


    2025 年 3 月 12 日


