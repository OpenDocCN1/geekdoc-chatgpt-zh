    力，创造力、判断力、批判性思维和解决问题的能力才是最重要的。


    传统教育和未来教育的特点对比如表 6-1 所示。


    | 传统教育 | 未来教育 |

    | :--- | :--- |

    | 以“学校和老师”为中心 | 以“家庭和学生”为中心 |

    | 以“考试成绩”为导向 | 以“解决问题能力”为导向 |

    | 学科单一，文理分科 | 强调跨学科通识教育 |

    | 以标准化教材为主 | 使用 AI 助手进行个性化学习 |

    | 关注“知识点记忆” | 强调批判思维、创造力、决策能力 |

    | 课堂内的理论学习 | 真实世界的项目实践 |


    由此可见，标准化教育已无法适应未来，AI 的能力正在快速超越人类。例如，目前，AI 的答题准确率已经超过 85% 的人类，并且在未来几年内，它将超过 99%
    的人类；AI 可以在几秒内总结书籍内容、撰写报告、编写代码，而人类完成同类任务却需要花费数小时甚至数天时间。


    所以，我们需要思考一个关键问题：如果旧的教学模式已经过时，那么新的教学模式应该是什么样的？


    ## 6.2 学习新地图：AI 如何重构知识星球


    全球的教育改革已经给出了答案，未来的教育模式将围绕以下几个核心理念展开。


    - 1. 个性化教育：打造专属的“私人教师”


    过去的学校是“统一标准”的，每个学生都学一样的东西、参加同样的考试。但在 AI 时代，每个人的学习路径可以高度个性化。


    AI 可以成为每个学生的专属“私人教师”，根据他们的兴趣和能力制订个性化的学习计划。学生不再需要死记硬背大量的知识，而需要学会如何高效获取和使用知识。


    ### 2. 通识教育：跨学科思维


    AI 时代的人才必须具备跨学科的能力，不能只局限于单一学科。例如，一个 AI 工程师不仅要懂编程，还要懂伦理学、心理学、设计思维；一个生物学家不仅要懂生物，还要了解计算机科学、人工智能、数据分析。


    这就需要从小重视学生的跨学科通识教育，让学生能够在不同学科之间建立联系。


    ### 3. 实践教育：与真实世界接轨


    未来的教学形式不再是单纯在课堂上传授知识，而是让学生在真实的环境中解决问题。让学生组队参与科技项目。例如，研究新能源、探索人工智能；走进真实的行业，了解生物实验室如何做实验，汽车公司如何设计电动车，AI
    实验室如何训练模型。


    通过实践，学生不仅能够学到知识，还能培养解决现实问题的能力。


    ## 6.3 教育变形记：从填鸭式到“智能共生体”


    如果说过去几十年的教育创新成本太高、难以大规模推广，那么 AI 的崛起正在改变这一切。


    - 1. AI 可以作为个性化学习助手，帮助每个学生制订独特的学习计划。

    - 2. AI 可以提供智能辅导，帮助学生解答问题，提供即时反馈。

    - 3. AI 可以辅助教师的工作，使教师减少批改作业、备课的时间，让教师有更多精力关注学生的创造力培养。

    - 4. AI 可以降低教育成本，让全球更多地区的孩子获得高质量的学习资源。


    AI 不仅可以改变教育方式，更能让未来教育的核心理念以更低成本实现，推动全球更多学校和国家尝试新的教育模式。


    ## 6.4 争议焦点：AI 助教是帮手还是“作弊器”


    许多学校之所以禁止 AI，主要出于以下几个方面的原因。


    - 1. 学术诚信问题


    学校担心 AI 会助长抄袭、作弊、代写论文等不端行为，导致学生无法真正掌握知识。例如，ChatGPT 可以轻松生成论文、代码或解答数学题，使得传统的作业和考试评价体系受到挑战。


    一些学校已经在考试和作业中引入 AI 检测工具（如 Turnitin AI Detector），以防止学生滥用 AI。


    - 2. 削弱学习能力


    依赖 AI 可能会降低学生的批判性思维和独立解决问题的能力。比如，如果学生只把 AI 作为“答案生成器”，而不去深度思考问题，那么他们的思维能力可能会受到削弱。尤其是在数学、写作、编程等领域，过度依赖
    AI 可能导致基础能力下降，影响未来的学习发展。


    - 3. AI 生成内容的准确性


    AI 并不总是正确的，甚至会产生“幻觉”——提供错误或误导性的信息。如果学生不会判断 AI 生成内容的可靠性，就可能学习到错误的知识。例如，在历史、科学等学科中，AI
    可能会提供看似合理但实际上不准确的信息，这对教育的严谨性构成挑战。


    ## 6.5 AI 必修课：数字原住民的生存法则


    与其禁止 AI，不如培养学生正确使用 AI 的能力。这种观点的核心逻辑如下。


    - 1. AI 是未来不可避免的趋势


    AI 发展迅猛，已经深刻影响了各个行业，从编程、金融、医疗到新闻写作，AI 的应用无处不在。因此，未来社会最有竞争力的人，是那些能有效利用 AI 工具的人。


    正如计算器刚发明出来的时候曾经被数学老师抵制，但后来成为标准工具一样，AI 在未来也可能成为所有行业的标配。


    - 2. 提高效率，培养创新能力


    AI 可以帮助学生更快地查找信息、整理思路，提高学习效率。例如，学生可以使用 AI 理解复杂概念、生成学习摘要，甚至可以将其作为写作助手提高文章质量。


    关键在于如何用 AI，而不是是否用 AI。最优秀的学生不是那些完全拒绝 AI 的人，而是那些懂得如何在 AI 的辅助下进行深度思考、创新和创造的人。


    - 3. 教育的核心应该是“人机协作”


    李飞飞教授强调“人机协作”（human-AI collaboration）的重要性。未来的工作模式很可能是人与 AI 共同完成任务，而不是单独依赖其中一方。因此，教育应该让学生学会如何与
    AI 协作，而不是简单地禁止它。


    例如，在医学领域，AI 可以帮助医生分析医学影像，但最终的诊断和决策仍然需要医生的判断。这种“AI+人”的模式，正是未来教育需要培养的能力。


    ## 6.6 教育进化论：AI 融合的正确打开方式


    如果 AI 的使用不可避免，那么学校该如何正确引导学生使用 AI，而不是简单地禁止呢？以下是几种可能的策略。


    - 1. 将 AI 作为学习工具，而非作弊工具


    学校可以明确规定 AI 的合理使用范围，例如，允许学生用 AI 进行学习辅导，但不能直接用于考试或论文写作。


    教师可以教授“如何用 AI 高效学习”，比如用 DeepSeek 生成不同角度的观点，用 AI 进行论文初稿的润色，等等。


    - 2. 培养批判性思维和 AI 素养


    学生需要学习如何评估 AI 生成内容的真实性，而不是盲目接受 AI 的答案。例如，可以让学生练习分析 AI 生成文本中的逻辑漏洞、错误信息等。


    这类似于信息时代的“媒体素养”，人们需要学会辨别真假新闻，同样也需要学会辨别 AI 生成的内容是否可靠。


    - 3. 调整考试和作业模式


    传统的“记忆型考试”在 AI 时代可能不再适用，教育需要更多依靠“实践型学习”和“项目式学习”。


    例如，让学生进行开放性项目研究，要求他们解释 AI 的思考过程，而不是直接给出 AI 生成的答案。


    - 4. 鼓励创造性使用 AI


    AI 不只是一个答案生成器，也可以是一个创新工具。例如，学生可以用 AI 进行代码优化、音乐创作、艺术设计等，培养创造力。


    在一些前沿大学，比如美国麻省理工学院、斯坦福大学等，已经在教授学生 AI 在科学研究、创业等方面的高阶应用。


    ## 6.7 家长指南：和孩子一起驾驭 AI 浪潮


    AI 作为一种新工具，的确使家长陷入两难境地：不用，怕孩子在未来失去竞争力；用，又担心孩子变得懒惰、不会独立思考。这种“度”需要家长的正确引导，以确保孩子既能利用
    AI 提高效率，又能保持独立思考能力。


    ### 1. 了解孩子如何使用 AI


    家长首先需要了解孩子使用 AI 的方式，而不是简单地禁止。例如，孩子是用 AI 辅助学习（比如查资料、解释概念），还是完全依赖 AI（比如直接让 AI 写作业）？AI
    是帮助了孩子加深理解，还是让他们逃避思考？孩子是否知道 AI 的局限性和错误的可能性？


    家长可以主动问孩子：“你今天用 AI 帮你解决了什么问题？”“AI 给你的答案都对吗？你自己检查过吗？”“如果没有 AI，你会怎么做这道题？”这些问题可以帮助孩子形成“用
    AI，但不过度依赖”的思维模式。


    ### 2. 设定 AI 使用规则


    家长可以制定一套合理的规则，让 AI 成为孩子的学习助手，而不是替代者。


    - 允许 AI 帮助的情况包括：

    - (1) 查找资料，获取信息。

    - (2) 解释复杂概念，帮助理解。

    - (3) 作为写作或思考的灵感来源。

    - (4) 代码调试、语法检查（比如 Grammarly）。

    - 禁止 AI 代劳的情况包括：

    - (1) 直接抄 AI 生成的作业答案。

    - (2) 用 AI 代写论文、作文，而不加修改或理解。

    - (3) 用 AI 生成数学答案而不检查过程。

    - (4) 让 AI 代替自己思考难题。


    可以制定“AI使用契约”。


    - (1) 可以用 AI 查找信息，但必须自己总结。

    - (2) 可以用 AI 辅助写作，但每篇文章都要自己修改。

    - (3) 数学题不能直接抄 AI 答案，而是要自己演算后对比。


    这样可以确保 AI 是学习的加速器，而不是思维的替代品。


    ### 3. 引导孩子进行“二次加工”


    让 AI 参与学习并不意味着它可以直接给出答案，而是应该让它成为“辅助思考”的工具，具体方法如下。


    - 1) 要求孩子解释 AI 生成的答案


    孩子可以用 AI 生成答案，但必须能用自己的话解释为什么这样。比如，AI 帮忙写了一篇作文，家长可以问孩子：“你觉得 AI 这篇作文哪里写得好，哪里需要改？”“如果你不用
    AI，你会怎么写？”这样能帮助孩子主动思考，而不是盲目接受 AI 生成的内容。


    - 2) 让孩子修改 AI 生成的内容


    如果孩子用 AI 生成作文，可以要求他们重新整理结构，用自己的语言修改，添加个人观点和例子，找出 AI 可能的错误或表达不自然的地方。比如，“AI 写的这个段落有点儿空洞，你能补充一些具体的例子吗？”这样，AI
    就成了孩子的写作“助手”，而不是“代笔”。


    - 3) 让 AI 生成错误答案，孩子来修正


    让 AI 故意犯错误，让孩子找出错误并修正。例如，“请 AI 生成一篇含有逻辑错误的文章，让孩子来修改。”“请 AI 给出错解，让孩子分析哪里错了。”


    这种方式可以锻炼孩子的批判性思维，避免盲目信任 AI。


    ### 4. 培养孩子的独立思考能力


    要让孩子在 AI 时代保持竞争力，关键在于使他们能够独立思考，有批判性思维和创造力。家长可以从以下几方面进行培养。


    - 1）鼓励孩子提问，而不是只接受答案。


    让孩子习惯使用 AI 后问自己：“为什么是这样？” 让孩子挑战 AI，比如提问：“AI 说的是对的吗？有没有不同的观点？”


    - 2）用 AI 进行思维训练


    家长可以让 AI 充当“辩论对手”或“批判性思维教练”：让 AI 提供不同角度的观点，孩子评估优缺点；让 AI 生成反方观点，孩子进行辩驳；让 AI 提问，孩子回答。


    - 3）引导孩子创造，而不是仅仅消费 AI 生成的内容


    让孩子用 AI 生成故事大纲，然后自己填充细节；让孩子用 AI 辅助写代码，但自己优化算法；让孩子用 AI 帮助画画，但自己调整创意；这些方式可以让 AI
    成为创作的工具，而不是替代者。


    ### 5. 家长的角色：教练而不是警察


    家长的角色不是“AI 警察”（只是一味禁止使用 AI），而是“AI 教练”（教孩子如何正确使用 AI）。


    家长可以这样做：


    - (1) 与孩子一起探索 AI，看看它能做什么、不能做什么。

    - (2) 让孩子在使用 AI 后总结收获，而不仅仅是得到答案。

    - (3) 帮助孩子理解 AI 的局限性，知道 AI 不是万能的。


    家长要避免这样做：


    - (1) 一看到孩子用 AI，就立即阻止。

    - (2) 让孩子完全依赖 AI，而不要求他们思考。

    - (3) 只关注孩子是否在使用 AI “作弊”，而不关注它的学习价值。


    家长可以说：“AI 是一个很强大的工具，但它不能代替你的思考。我们可以一起探索如何用它来学习，而不是依赖它完成作业。”


    ### 6. 让 AI 成为孩子的“学习助力”，而不是“思维拐杖”


    - (1) 不要完全禁止 AI，因为它是未来不可或缺的工具。

    - (2) 不要让 AI 变成孩子的“大脑”，而要让它成为学习的“助手”。

    - (3) 通过设定规则、引导思考、培养创造力，确保孩子正确使用 AI 但不依赖 AI。


    最好的方式不是让 AI 完全代替孩子思考，而是让孩子用 AI 思考得更深、更快、更好。未来最强的人，不是完全不用 AI 的人，而是最懂得合理而充分使用 AI
    的人。


    ## 6.8 拥抱变化：在 AI 时代重新定义优秀


    面对 AI 的崛起，我们不能把自己培养成“知识的搬运工”，而是要成为拥有创造力、判断力、跨学科思维的“主人”。


    - (1) 培养独立思考能力：不要盲目接受信息，要学会分析、质疑，形成自己的判断。

    - (2) 掌握跨学科知识：不要只学一门技能，要让自己拥有更广阔的知识体系。

    - (3) 加强实践和探索：走出课堂，去真实的世界里解决问题。

    - (4) 善用 AI 作为工具：与其害怕 AI，不如学会如何利用 AI 提高自己的学习和工作效率。教育的未来属于那些主动拥抱变化的人。


    ## 第 6 讲 未来课堂：当 AI 成为超级家教


    2025 年，被认为是全球教育体系转型的关键之年，AI 技术的突破让未来教育不再只是“理论上的可能”，而是变成了现实。


    在未来十年，教育将经历一场深刻的变革，AI 不再是挑战，而是助力我们成长的伙伴。只有拥抱变化、善用 AI、培养思维能力和创造力，才能在智能时代活得如鱼得水。


    所以，在 AI 时代，我们需要问自己的不是：“我该如何记住更多知识？” 而是——“我如何更快、更高效地学习，并创造属于自己的价值？”


