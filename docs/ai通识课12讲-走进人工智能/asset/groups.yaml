    关于 “天气预报” 或 “体育赛事” 的新闻。


    (2) 智能客服。AI 可以听出你在语音助手里说了什么，并结合屏幕上的文字准确地回答你的问题。


    # 2.4.3 AI 的挑战：它还不能像人类那样理解世界


    如今，AI 变得越来越聪明，但它仍然面临很多挑战。比如它的 “多感官” 还没有人类灵活，容易出现 “听不懂” “看不清” 的问题。


    +   1. 语言困境


    AI 虽然能听懂普通话和英语，但如果一个人说闽南语或四川话，AI 可能会像外国人听中文相声一样 “发蒙”。科学家正在训练 AI，让它能听懂不同的方言，让更多人能用语音助手交流。


    +   2. 艺术理解


    AI 可以 “看” 出 “这是一幅梵・高的画”，但它不懂为什么这幅画会让人感动。它不知道梵・高笔下的 “星空” 为什么美丽，也不懂画家提出的 “表现主义”
