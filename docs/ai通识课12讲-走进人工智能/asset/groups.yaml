    什么是 GPT 呢？ 我想从 3 个维度讲一下，即本我、自我、超我。

    首先是本我。GPT 其实就是 3 个单词的缩写，generative、pre-trained、transformer。generative 很好理解，是“生成”的意思；pre-trained
    也好理解，即“预训练”，但是 transformer 是什么意思呢？ 上一次你听到这个词，是不是“变形金刚”的意思？ 但在这里，transformer 可不是变形金刚，它是一种
    AI 大语言模型的架构，利用自注意力机制，能够捕捉长距离依赖关系，从而生成高质量、上下文相关的文本，在这里应该翻译成“变形器”。这个词最早出现在谷歌大脑团队写的一篇叫作
    Attention Is All You Need（Transformer）的论文中，这个名字起得其实非常好，既利于传播，又表达了“基于神经网络，把输入文本转换为输出文本变形”的意思。所以，GPT
    的完整含义是：基于自注意力机制，通过机器学习，来计算输入和输出的神经网络模型变形器。


    读到这句话，大家脑子里可能会出现很多问号：什么是自注意力机制？ 什么是机器学习？ 什么是神经网络？ 别着急，在解释这些现代 AI 最关键的部分之前，我们先沿着
    AI 的来时路径往回走，看看上一个里程碑——深蓝。


    1997 年 5 月，IBM 开发的计算机深蓝在一场国际象棋对弈中，以 3.5 : 2.5 的总比分击败了当时的世界国际象棋冠军加里·卡斯帕罗夫。这是历史上首次计算机在标准规则下战胜世界棋王，标志着人工智能在国际象棋领域超越人类的一大突破（图
    1-1）。


    那为什么深蓝能赢？ 深蓝的胜利是算力的胜利：深蓝依靠强大的并行处理能力，每秒分析上亿步棋，远超人类棋手的计算极限。而在一局国际象棋中，一步棋可能的走法大约有
    10~120 种，虽然很多，但本质上还是一个封闭环境的全面求解，只要算力足够穷尽所有的可能性，机器就一定能战胜人类。可是，围棋就不一样了，围棋的平均游戏复杂度高得惊人！

    每个棋局有大约 10¹⁷⁰ 种走法，这个数字比可观察宇宙中的原子数量还要大得多。这是因为围棋的棋盘比国际象棋大得多，而且每个位置有更多的可能性。如果还是“暴力”求解，没有任何一台超级计算机可以做到穷尽所有的可能性。也许，只有物理学四大“神兽”中的
    Démon de Laplace（拉普拉斯妖）才能做到——拉普拉斯妖是法国数学家拉普拉斯于 1814 年提出的一个假想的全知存在物，它知晓宇宙中所有粒子的状态及物理定律，能推导出过去与未来的全部事件，象征着经典物理学的决定论世界观。


