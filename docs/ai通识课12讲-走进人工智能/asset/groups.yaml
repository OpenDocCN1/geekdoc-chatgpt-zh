    # 第 11 讲 群星闪耀时：AI 史上的天才极客团


    以变得像人一样聪明。


    马文·明斯基（Marvin Minsky）也参加了这次会议。他是一位特别有想象力的科学家，他认为人工智能将来不仅能像人类一样思考，甚至可能比人类更聪明。他的想法很大胆，让很多人对人工智能充满了期待。


    这些科学家在会议上讨论了很多问题，比如：机器能不能自主学习？怎么才能让计算机理解人的语言？ AI 能不能像人一样思考、推理和决策？


    虽然这些问题当时都没有答案，但科学家觉得，如果一直研究下去，总有一天机器会变聪明。


    那么早期的 AI 是什么样子的？


    那时候的人工智能还很简单，科学家只能让计算机按照人们写好的规则去做事，它们不会“思考”，只能执行命令。这些 AI 就像下棋机器人一样，它们会根据程序计算得出最好的下一步棋，但如果你问它别的问题，比如“今天天气怎么样？”它就一点儿都不懂了。


    约翰·麦卡锡还发明了一种新的编程语言，叫作 LISP。这种语言非常适合用来编写 AI 程序，后来很多 AI 研究用到了它。可以说，LISP 是人工智能的第一种“语言”。


    AI 刚出现的时候，大家都很兴奋。科学家觉得人工智能前途无量，甚至有人预测，在 20 年内，AI 可能会像人一样聪明。他们投入了大量时间和精力，希望能尽快让
    AI 学会思考。


    但是，他们很快发现了一些难题。


    +   (1) 计算机的能力还不够强，处理信息的速度很慢。

    +   (2) 让机器理解人类语言比想象中难得多。

    +   (3) 机器不会自主“学习”，只能按照程序设定的规则行动。'
