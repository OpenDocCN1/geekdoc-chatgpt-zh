    ## 第 5 讲


    ### 思维跃迁：让 AI 学会 “深思熟虑”


    我们前面介绍的大语言模型其实是 AI 发展的第一个阶段——聊天机器人。而在 2025 年央视的春节晚会上，DeepSeek R1 以跳秧歌舞的形式横空出世，不但在国内起到了很好的
    AI 科普作用，也引发了美国硅谷的震动。DeepSeek R1 在数学、编程、逻辑等多个领域的 AI 竞赛里取得了第一名的成绩。很多人说 DeepSeek
    R1 是最聪明的大模型，那 DeepSeek 为什么聪明呢？ AI 越来越聪明，会不会有一天产生意识，甚至取代人类呢？这一讲，我们就一起来了解一下 AI 大模型的第二个阶段——推理模型。


    ### 5.1 快思维陷阱：传统 AI 的直觉式应答


    前面我们提到过传统大语言模型（第一个阶段）是如何工作的。它就像一个“超级快的猜谜高手”，看到一句话后，就能立刻猜出下一个最可能出现的词语，而且速度非常快。这个过程就像我们玩接龙游戏，比如听到“今天的天气……”后，我们很自然地会想到“很好”或“很冷”。这种快速的思考方式就是心理学家所说的“系统一”——一种不经过深思熟虑的“快思维”。


    在人类的思维中，系统一是我们平时经常使用的一种方式。它的特点是快速、直觉性、不需要太多思考。例如：


    - (1) 看到一个熟悉的标志，我们会瞬间知道它的意思。


    - (2) 听到别人说“你好”，我们会马上回答“你好”。


    - (3) 看见别人摔倒，我们会立刻伸手去扶。


    - (4) 听到“9×9”，我们就会回答“81”。


    这些反应都不需要我们刻意思考，大脑会自动给出答案。大语言模型的工作方式和这个很像，它看到一段文字后，会快速计算下一个最可能的词语是什么，然后继续预测下一个词，直到形成一整句话。


    举个例子，如果你输入一句话：“小猫跳上了……”大语言模型可能会快速生成下面的文字：


    “……沙发，舒服地瘫缩起来。”


    “……桌子，好奇地望着窗外。”


    “……床，开心地玩起了毛线球。”


    这时候，你可能会觉得：“哇，AI 好聪明，它能像人一样说话！” 但其实，它并不是真正理解了“猫”“跳”“沙发”这些词的意思，而是根据以前看过的无数篇文章，找到最常见的搭配，然后快速“猜”出最合适的答案。


    系统一虽然很快，但会犯错，这就是为什么我们说 AI 有时候会产生幻觉。因为系统一的反应速度快，但它并不擅长深思熟虑，它的答案只是基于经验，而不是经过逻辑推理，所以有时候会犯一些“想当然”的错误。比如，当我们问大语言模型：“兔子比大象大吗？”它可能会回答：“是的，兔子比大象大。”这听起来很荒唐，但为什么会这样呢？这是因为它的“快思维”有时会被误导——如果训练数据里有太多关于“兔子很大”或者“大象很小”的句子，它可能就会错误地认为“兔子比大象大”也是合理的。


    再比如，最经典的 AI 测试问题：9.11 和 9.9 相比，哪个更大？大部分的大语言模型 AI 会告诉你“9.11 比 9.9 大”，因为 AI 并不真正“计算”这两个数并进行比较，而是基于训练文本中的模式进行概率推断。如果
    AI 在海量文本中频繁接触“9.11”与“9·11 事件”强关联，以及“9.9”常与节日日期等场景绑定时，其语言模型会优先激活这些高权重语义标签，此时数字本身的数值属性被弱化，导致比较逻辑完全偏离数值维度，这就可能会出现错误的答案。另外
    AI 还有可能受到小数点格式的影响，“9.11”可能在某些语境中被写作“9，11”（在某些国家，小数点用逗号表示）。“9.9”可能被写成“9.90”或“9，9”。AI
    在理解这些格式时，可能会误解它们的大小关系，导致计算错误。


    ### 5.2 推理特训课：教会 AI “像侦探一样思考”


    在人的大脑里，除了系统一——“快思维”外，还有系统二——“慢思维”。


    系统二是一种深思熟虑的、需要逻辑推理的思维方式，举例如下。


    - (1) 做复杂的数学题：当你算“9×9”的时候，你会脱口而出“81”，但是让你算“99×99”呢？你就不会凭直觉直接说答案，而是会一步步计算。


    - (2) 下象棋：开局阶段你可能会快速下，这是因为有开局棋谱，一旦布局完成，你要思考下一步怎么走的时候，就要根据对手的招法应变，才有可能赢得比赛。


    但是，传统的大语言模型并不具备系统二的能力。它不会真正思考问题，而是依靠概率和模式匹配选择下一个词是什么。这就导致它在面对逻辑性强的问题时，很容易犯错。那怎么让
    AI 具备系统二呢？


    ### 5.3 慢思维觉醒：AI 的深度思考模式


    回到上面那个问题：“99×99”要怎么算呢？你是不是要列竖式了，同样的道理，教 AI 学会系统二，就像教小朋友养成“写作业不着急、做完要检查”的好习惯。我们有一些常用的方式教
    AI 学会系统二。


    ### 5.3.1 分步答题法——像搭建乐高城堡一样一步步来


    我们可以教它一种叫作“分步答题法”的方法。这种方法就像乐高的步骤说明书一样，让 AI 一步一步地分析问题。这样，它就不会只凭直觉乱猜答案了，而是会像一个认真做题的学生，一步一步地推理和计算，最后得出正确答案。


    #### 1. 为什么 AI 要用分步答题法


    想象一下，如果你拿到了一盒乐高玩具，但没有说明书，你直接拿起一堆积木，要一下子拼出一个漂亮的城堡。但这几乎是不可能的，因为你不知道先拼哪一部分，哪些零件要先用，哪些要后用。


    如果你有了一本详细的说明书，你就可以按照步骤，先拼地基，再搭墙体，最后加上屋顶。这样一步一步拼下去，最终就能得到一个完整的城堡。这个过程虽然比直接乱拼慢，但成功的概率更高，而且不会拼错。


    AI 在回答复杂问题时也需要这样。它不能一下子想出答案，而会像拼乐高一样，一步一步地拆解问题，按照顺序慢慢推理。这样，它才能得到正确答案。


    分步答题的原理就像让 AI 一小口一小口地吃蛋糕。也就是说，把大问题拆成一个个小步骤，让 AI 一步步思考。


    #### 2. 分步答题法的步骤


    如果 AI 用分步答题法回答 “怎么用 10 元钱买最划算的文具”，它会这样做。


    - 第一步：列出可能购买的文具。


    AI 会先想一想，在文具店花 10 元钱可以买哪些文具，如铅笔、橡皮、本子、尺子等。这一步就像在拼乐高之前，把所有的积木分类整理好，知道有哪些零件可以用。


    - 第二步：查找价格信息。


    AI 不会直接选择文具，而会先看每个文具的价格。比如：铅笔 1 元一支，橡皮 2 元一个，本子 3 元一本，尺子 2 元一把。


    这一步就像我们在拼乐高时，先看看每个零件长什么样，这样才能知道哪些零件适合拼到一起。


    - 第三步：计算不同组合的总价。


    AI 会尝试不同的购买组合，比如，2 支铅笔 + 1 块橡皮 + 1 个本子 = 7 元，还剩 3 元；1 支铅笔 + 1 块橡皮 + 1 个本子 + 1
    把尺子 = 8 元，还剩 2 元；3 支铅笔 + 1 块橡皮 + 1 个本子 = 8 元，还剩 2 元。


    这一步就像我们拼乐高时，先尝试不同的拼法，看哪种拼法最合适。


    - 第四步：选出最划算的方案。


    AI 会对比所有可能的购买组合，从中选出最划算的一种。比如，它可能会选第二种方案，因为这种方案买的东西最多，用的钱也刚刚好，没有浪费。


    - 第五步：给出答案。


    AI 会根据计算结果告诉你：“你可以买 1 支铅笔、1 块橡皮、1 个本子、1 把尺子，这样最划算。”这个答案就是经过认真计算的，而不是随便猜出来的。


    #### 3. 分步答题法的好处


    - (1) 减少 AI 猜答案的错误。如果 AI 直接猜答案，它可能会忘记检查价格，也可能会选到不划算的组合。但如果一步一步思考，AI 就会认真计算，确保答案是正确的。


    - (2) 让 AI 能回答更复杂的问题。有些问题如果不拆成小步骤，AI 根本无法回答。比如解数学题，如果用分步答题法，AI 就能像人类一样，先列式，再计算，最后检查答案，这样就不会出错。


    - (3) 让 AI 回答问题更有逻辑。AI 有时候回答问题会前后矛盾，但如果它用分步答题法，思考过程就会更加清晰，答案也会更有逻辑性。


    #### 4. 怎么训练 AI 学会分步答题


    第一步：让 AI 先列出解决问题的步骤。


    当 AI 遇到一个问题时，不能立刻回答，而是要先写出它打算怎么解答。这样就能让它先厘清思路，再动手回答。


    第二步：让 AI 在每一步都写清楚原因。


    AI 不能只是简单地说“下一步做什么”，而是要解释“为什么要这样做”。这样可以让它的答案更加清晰，而不是随便给出一个结论。


    第三步：让 AI 在最后一步检查自己的答案。


    AI 在得出答案后，需要再回头看看（自己的计算有没有错误，有没有更好的答案），这样可以让它减少错误，并提高回答的质量。


    总的来说，分步答题法就是让 AI 不要一下子给出答案，而是像拼乐高一样，按照说明书一步一步地推理和计算。这样可以让 AI 减少错误，回答更有逻辑，还能解决更复杂的问题。


    ### 5.3.2 自我检查法——像做完数学题要验算一样


    #### 1. 为什么 AI 要用自我检查法


    AI 在回答问题时，有时候会犯错，就像学生做数学题时可能会写错答案一样。为了让 AI 更聪明，我们需要教它学会“自我检查法”，就像老师要求学生做完数学题后要验算一样，让它用不同的方法再算一遍，确保答案正确。这样，AI
    就不会因为计算错误而给出错误答案了。


    #### 2. 自我检查法的步骤


    自我检查法的原理就是让 AI 像学生交作业前再检查一次一样。


    第一步：AI 先用一种方法计算答案。


    比如 AI 收到问题：“15×6=？” 它可能会直接写出答案“80”。


    第二步：AI 自动启动检查程序。


    AI 不会急着告诉你答案，而是会用另一种方法计算一次，比如用加法：15+15+15+15+15+15=90。


    第三步：AI 对比两个答案。


    AI 会发现自己第一次的答案是 80，但用加法算出来是 90，两个答案不一样。


    第四步：AI 修改答案并给出最终结果。


    AI 意识到自己算错了，就会修改答案，并最终告诉你：“正确答案是 90。”这样，AI 就不会犯低级错误了。


    #### 3. 自我检查法的好处


    - (1) 让 AI 减少计算错误。AI 有时候会犯低级错误，比如简单的乘法、加法或者逻辑推理题算错了。如果 AI 学会自我检查，它就能自动发现错误并修正。


    - (2) 让 AI 的答案更可靠。如果 AI 回答完问题还能再检查一次，那它的答案就会更加准确。人们在使用 AI 时，也能更加放心，不用担心它随便猜答案。


    - (3) 让 AI 学会更严谨地思考。AI 在回答问题时，如果能像认真做作业的学生一样仔细检查，它就会变得更加严谨，而不是只求“快”而不求“对”。


    #### 4. 怎么训练 AI 学会自我检查


    第一步：让 AI 自动进行多种计算方法验证。


    AI 做数学题时，不是只用一种方法算，而会用多种方法验证答案。比如，乘法题可以用加法再验算，除法题可以用乘法反推，逻辑推理题可以从不同角度再验证一次。


    第二步：让 AI 发现错误后主动修正。


    如果 AI 发现两种计算方法的答案不一样，就会自动重新计算，而不是直接给出错误答案。


    第三步：让 AI 在最终回答前检查一遍所有步骤。


    AI 不能只看最后的答案，而是需要回头检查自己的计算过程，确保每一步都是正确的，这样才能减少出错的概率。


    总结一下，自我检查法就像小朋友做完数学题后需要验算一样，能帮助 AI 发现错误并修正，让它的答案更加准确。


    ### 5.3.3 调用工具法——遇到难题就翻书、查字典


    对于大语言模型，如果只是靠它“脑子”里已有的信息，它可能会猜错答案。就像我们平时做题时，如果遇到不会做的题目，最好的方法不是乱猜，而是翻书、查字典，找到正确的答案。所以，让
    AI 学会“调用工具法”十分必要。为了让 AI 变得更聪明，我们可以给它配一套“智能文具盒”，让它学会先查资料再回答问题，而不是凭感觉随便猜。这样，它的答案就会更加准确。


    #### 1. AI 的“智能文具盒”种类


    调用工具法的原理就像给 AI 配一套“智能文具盒”。


    - (1) 计算器——用来解决数学问题。AI 遇到复杂数学题时，不自己算，而是调用计算器。比如计算 789×456，它不会自己写个答案，而是会用计算器计算，得到正确答案：359784。


    - (2) 百科全书——用来查事实和知识。AI 不会靠记忆回答事实问题，而是会查找最新的百科知识库，如百度百科、新闻网站等。比如你问：“世界上最高的山是哪座山？”AI
    会先查找资料，然后回答：“珠穆朗玛峰，海拔 8848.86 米。”


    - (3) 地图软件——用来解决路线问题。AI 遇到和地理、交通相关的问题时，会查找地图软件。比如你问：“从北京到上海怎么走？”AI 会调出高德或者百度地图，截图后再反馈。


    - (4) 天气预报——用来提供最新的天气信息。AI 不会自己“猜”天气，而是查找最新的天气预报数据，如中国天气网、中央气象台的数据。比如你问：“明天上海的天气怎么样？”AI
    会去查天气网站，告诉你最新的预报，比如它会回答：“多云，气温 20~28℃。”


    #### 2. AI 调用工具法的步骤


    AI 如何像人类一样查资料呢？当遇到一个难题时，它不会立刻回答，而是按照以下步骤进行思考。


    第一步：判断自己是否“会做”。


    AI 先看这个问题是自己可以直接回答的，还是需要查资料。例如，如果你问“1+1 等于几？”AI 知道答案是 2，就可以直接回答。但如果你问：“今年北京到上海的高铁票价是多少？”AI
    就知道它需要查资料，而不能凭记忆回答。


    第二步：选择合适的工具。


    AI 会思考应该用哪种工具。比如，如果是数学题，就用计算器；如果是地理问题，就查地图软件；如果是新闻，就去查新闻网站。


    第三步：查询最新数据。


    AI 不会马上给答案，而是先去查找资料。比如，如果是天气问题，它会访问天气预报网站；如果是路线问题，它会访问地图软件。

