    # 11.1 图灵预言：计算机之父的疯狂猜想


    本书的第一讲曾提到过一个人——图灵。当计算机还没有出现，人们只能用算盘、纸和笔来计算的时候，图灵就提出了一个想法：如果有一台机器，可以按照一定的规则计算任何数学问题，那它是不是也能像人一样思考呢？


    举个例子，假设你要算一道比较难的数学题，比如 178×256，如果没有计算器，你可能要算很久，还可能算错。图灵机就像一台超级计算器，只要你告诉它规则，它就能一步一步算出来，而且不会出错。


    图灵的这个想法很厉害，因为它告诉人们：计算不仅仅是人类才能做的事情，机器也可以。


    虽然计算机可以做数学题，但图灵有一个更大胆的想法：“如果机器能自己思考，那它算不算真的聪明？”


    为了判断机器到底“聪明不聪明”，图灵在 1950 年提出了一个测试方法，叫作“图灵测试”。测试的规则很简单：一个人坐在房间里，通过打字和对方交流，但他不知道对方是另一个人还是一台机器。机器和人都要回答问题，让这个人猜对方是人还是机器。如果这个人分不清是在和机器聊天还是在和真正的人聊天，那就说明机器真的很聪明了。


    最开始，图灵认为如果机器能通过测试，那它就能被认为是“有智能的”。但后来，他对这个想法有了一些新的看法。'
  - '[PAGE 241]


    人们问他：“机器真的会像人一样‘理解’问题吗？”


    图灵回答说：“不要纠结‘机器是不是在思考’，更重要的问题是‘它能不能表现得像在思考’。”


    他觉得，人类的“思考”本质上也是一系列的规则和计算，如果机器也能用类似的规则来回答问题，那它和人类思考的区别，可能只是内部运行方式不同罢了。


    换句话说，他认为“智能”不一定是机器真正“理解”问题本身，而是它能不能像人一样回答问题。


    图灵的想法在当时非常超前，虽然那个时代的机器还很简单，但他的“图灵机”理论和“图灵测试”为后来的人工智能研究打下了基础。今天，科学家仍然在思考：机器是真的能像人一样思考，还是只是“模仿”人类的思考？


    无论如何，图灵测试被认为是人工智能的开篇，图灵的想法改变了整个世界。


    # 11.2 达特茅斯会议：AI 诞生的“智慧开端”


    1956 年，世界上发生了一件特别重要的事情。那一年，一群聪明的科学家聚在一起，开了一场特别的会议。他们想研究“如何让机器变得聪明”，于是，他们给这项研究取了个名字，叫“人工智能”（artificial
    intelligence, AI）。这次会议，被认为是人工智能真正诞生的时刻。


