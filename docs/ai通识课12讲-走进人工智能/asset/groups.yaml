    # 3. 风格 ( style )


    就像画画可以选择蜡笔或水彩笔一样，你需要告诉 AI 你喜欢什么样的表达方式。比如：“用《小猪佩奇》讲故事的语气，加点搞笑对话！” AI 就会写出旺财追蝴蝶撞树的搞笑情节。


