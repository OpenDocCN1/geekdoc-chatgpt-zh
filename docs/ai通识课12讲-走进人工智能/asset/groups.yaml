    12 Lessons, AI Unleashed


    商业的变革和科技的进化息息相关。从AI的基础到前沿应用，这本书提供了清晰的知识框架，帮助你在高速发展的时代里，理解和利用AI驱动的变革。


    —— 刘润 润米咨询创始人


    人工智能的发展速度远远超乎我们的想象，正因为如此，作为教师，我们更应该去学习、了解AI的基本原理和应用方式，从而帮助自己，也帮助家长、孩子应对不确定的未来。包老师的书用科普的方式系统地回答了关于AI的很多问题，能够帮我们认识AI，打好底层逻辑，特别值得阅读。


    —— 全力 上海师范大学副教授，上海市万源协和双语学校校长


    欣闻交大校友包坤老师的新作《AI通识课12讲：走进人工智能》即将付梓，深感此书问世恰逢其时。在教育部明确提出“2030年前在中小学基本普及人工智能教育”的战略背景下，这部深入浅出的通识读本不仅响应了国家教育改革的时代召唤，更为青少年打开了一扇通向未来世界的智慧之窗。期待这部承载教育使命的著作，能启迪更多年轻心灵在智能技术的浩瀚星海中探索前行，为智能时代的人才培养注入薪火相传的创新动能。


    —— 严骏驰 国际模式识别学会会士，上海交通大学人工智能学院教授


    作为一个探索者，未来属于那些不断学习、理解和驾驭新技术的人。这本书不仅让你明白AI如何改变世界，更帮助你在智能时代找到自己的位置。


    —— 陈辰 东方卫视《未来中国》主持人、导演、制片人


    文 泉 云 盘 清华大学出版社


    ISBN 978-7-302-69078-8


