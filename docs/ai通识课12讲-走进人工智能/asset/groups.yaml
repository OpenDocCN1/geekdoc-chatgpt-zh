    ## 4.3 ROSES 框架：让 AI 秒懂你的心意


    除了 CO-STAR 提示词框架，还有 ROSES 框架。ROSES 框架就像是给 AI 设计的一张“说明书”，告诉它该用什么身份、如何思考、如何回答问题。这个框架能让
    AI 给出的答案更准确、更符合你的需求。ROSES 代表角色（role）、目标（objective）、场景（scenario）、预期答案（expected
    solution）、步骤（step）。我们来一个个讲清楚，并用简单的例子加以说明。


    ### 1. 角色（role）——告诉 AI 它是谁


    解释：就像演戏一样，AI 需要知道自己扮演的角色。不同的角色会影响回答方式。如果 AI 是医生，那么回答方式会和老师的回答方式不一样。


    - 案例 1：你想让 AI 帮忙解释数学题。


    普通问法：“AI，帮我讲解分数。”


    使用 ROSES：“假设你是一名五年级数学老师，请用简单的方法给我讲解分数运算。”


    结果：AI 会像老师一样，用容易理解的方式讲解，而不是给出复杂的数学公式。


    - 案例 2：你想让 AI 写一个故事。


    普通问法：“写个关于太空的故事。”


    使用 ROSES：“假设你是一位儿童故事作家，写一个关于小朋友乘坐宇宙飞船去火星探险的故事。”


    结果：AI 会用生动有趣的方式编故事，而不是写成一篇科学文章。


    ### 2. 目标（objective）——让 AI 知道你想要什么


    解释：明确告诉 AI 你希望它做什么，而不是让它猜。


    - 案例 1：你想让 AI 帮助你学英语。


    普通问法：“AI，教我英语。”


    使用 ROSES：“假设你是一位英语老师，我是一名小学生，帮我学习简单的日常对话，比如问路和购物。”


    结果：AI 会提供基础的日常英语对话，而不会给你一篇复杂的语法分析。


    - 案例 2：你希望 AI 帮忙写电子邮件。


    普通问法：“AI，写封邮件。”


    使用 ROSES：“假设你是一个客服经理，帮我写一封礼貌的电子邮件，回复客户关于退货的问题。”


    结果：AI 会写出专业且礼貌的邮件，而不会随便写几句话。


    ### 3. 场景（scenario）—— 让 AI 知道背景信息


    解释：提供具体的情境，让 AI 更好地理解问题，避免回答得太笼统。


    - 案例 1：你想让 AI 帮你写一封道歉信。


    普通问法：“AI，帮我写封道歉信。”


    使用 ROSES：“假设你是我的写作老师，我需要给同学写一封道歉信，因为我不小心弄坏了他的铅笔盒。请帮我写一封真诚的道歉信。”


    结果：AI 会根据你的具体情况，写出合适的道歉信，而不会写成一封和朋友吵架的道歉信。


    - 案例 2：你想让 AI 讲解天气变化。


    普通问法：“AI，解释天气变化。”


    使用 ROSES：“假设你是科学老师，今天要上关于天气的课。请用简单的语言解释为什么会下雨。”


    结果：AI 可能会用比喻，比如：“天空就像一个大水壶，水蒸气变成小水滴，积累多了就会变成雨落下来。”


    ### 4. 预期答案（expected solution）—— 告诉 AI 你想要的回答形式


    解释：不同的任务可能需要不同的回答格式，比如列表、表格、故事、对话等。


    案例：你想让 AI 解释如何写日记。


    普通问法：“AI，告诉我怎么写日记。”


    使用 ROSES：“假设你是一位写作老师，请用 3 个简单的步骤告诉我如何写一篇有趣的日记，并举个例子。”


    结果：AI 可能会给出以下回答。


    - 写下日期和天气：“今天是晴天，阳光很暖和。”

    - 记录一天中发生的有趣事情：“今天我和朋友去公园玩，发现了一只特别大的蝴蝶。”

    - 写下感受：“我觉得今天很开心，因为我学到了关于蝴蝶的新知识。”


    ### 5. 步骤（step）—— 让 AI 按顺序回答


    解释： 如果问题比较复杂，可以要求 AI 按步骤回答，这样会更清楚。


    - 案例 1：你想让 AI 教你做蛋糕。


    普通问法：“AI，怎么做蛋糕？”


    使用 ROSES：“假设你是一名烘焙老师，请用 5 个简单的步骤告诉我如何做一个巧克力蛋糕。”


    结果：AI 可能会给出以下步骤。


    - (1) 准备材料：面粉、鸡蛋、糖、牛奶、可可粉等。

    - (2) 搅拌蛋糕糊：把鸡蛋和糖打发，加入牛奶和面粉搅拌均匀。

    - (3) 倒入模具：把蛋糕糊倒入烤盘，放入预热好的烤箱。

    - (4) 烘烤：在 180°C 下烤 30 分钟，直到蛋糕变得蓬松。

    - (5) 装饰蛋糕：蛋糕冷却后，可以加巧克力酱或水果装饰。


    - 案例 2：你想让 AI 教你如何管理时间。


    普通问法：“AI，教我时间管理。”


    使用 ROSES：“假设你是一名时间管理专家，请用 3 个步骤教我如何更好地安排每天的学习时间。”


    结果：AI 会给出以下建议。


    - (1) 列出每天要做的事情：比如“早上背单词，下午做数学练习。”

    - (2) 制订时间表：每项任务安排固定时间，比如“每天晚上 8 点，阅读 30 分钟。”

    - (3) 坚持执行：每天检查任务是否完成，调整计划。


    总结一下，ROSES 框架能帮助 AI 更准确地理解你的问题，让它的回答更符合你的需求。只要按照“角色”“目标”“场景”“预期答案”“步骤”这五个部分去设计问题，你就能让
    AI 更理想地帮你解决问题！


    ## 4.4 CLEVER 框架：精准操控 AI 的思维链


    前面的两个框架强调了角色，一个是输出者的角色定位，一个是输出后人群的定位。而 CLEVER 框架可以帮助你更清楚、更高效地和 AI 交流，让 AI 给出准确、有价值的回答。你可以把它当成写出完美问题的“六步秘诀”！


    CLEVER 的具体含义如下。


    - C (clarity, 清晰度)：让问题简单明了，避免模糊的词。

    - L (language, 语言)：用具体的描述，让 AI 更容易理解。

    - E (efficiency, 效率)：用清楚的结构或模板，减少 AI 的误解。

    - V (value, 价值)：让 AI 的回答对你真正有帮助，解决你的问题。

    - E (evaluate, 评估)：不断优化问题，让 AI 给出更好的答案。

    - R (result, 结果)：测试多个版本，找到最好的提问方式。


    下面分别讲解。


    ### 1. 清晰度 (clarity) —— 避免模糊的提问


    如果你的问题太模糊，AI 可能会给你不相关的答案。


    - 案例 1


    模糊：“告诉我如何写一篇好文章。”


    清晰：“请告诉我 3 个提高小学作文水平的技巧，并举例说明。”


    结果：AI 会直接给你 3 个针对小学生作文的具体写作技巧，而不是随便说一堆写作的理论。


    - 案例 2


    模糊：“怎么做好吃的早餐？”


    清晰：“请推荐 3 种 10 分钟内可以完成的营养早餐，并写出简单的制作步骤。”


    结果：AI 不会给你一堆复杂的菜谱，而是给出能够快速做出营养早餐的方法！


    ### 2. 语言（language）—— 用具体的描述，让 AI 更懂你


    AI 理解具体的词比理解抽象的词更容易。


    - 案例 1


    模糊：“怎么提高数学能力？”


    具体：“请推荐 3 个适合五年级小学生的数学学习方法，并举例说明。”


    结果：AI 会提供适合五年级学生的具体学习方法，而不是给出所有年级通用的建议。


    - 案例 2


    模糊：“推荐一本书。”


    具体：“请推荐一本适合 10 岁孩子阅读的冒险小说，并简要介绍故事情节。”


    结果：AI 只会推荐适合 10 岁孩子阅读的书，不会推荐太难或太简单的内容。


    ### 3. 效率（efficiency）—— 用模板化结构，减少 AI 的误解


    一个有结构的问题，比随意的提问更容易让 AI 理解。


    - 案例 1


    普通问法：“怎么练习英语？”


    用模板：“请按照以下结构回答。”


    - (1) 听力：推荐两种提高听力的方法。

    - (2) 口语：推荐两个练习口语的技巧。

    - (3) 阅读：推荐两本适合初学者的书籍。”


    结果：AI 会按照你的结构回答，而不是随便列出一堆方法。


    - 案例 2


    普通问法：“如何提高演讲能力？”


    用模板：“请按照以下结构回答。”


    - (1) 心理准备：如何克服紧张？

    - (2) 表达技巧：如何让语气更有吸引力？

    - (3) 练习方法：推荐两种练习演讲的方式。”


    结果：AI 的回答会更有条理，而不是给出乱七八糟的建议。


    ### 4. 价值（value）——让 AI 解决你的真正问题


    AI 的回答要真正有帮助，而不仅仅是提供信息。


    - 案例 1


    普通问法：“怎么减肥？”


    优化后：“假设你是一位营养师，我是一名职场人，每天只有 30 分钟锻炼时间，请推荐一个简单的减肥计划，包括饮食和运动建议。”


    结果：AI 会根据你的时间和身份，给出更适合你的减肥方案。


    - 案例 2


    普通问法：“怎么管理时间？”


    优化后：“假设你是一位时间管理专家，我是一名中学生，请推荐 3 个适合中学生的时间管理技巧，并举例说明。”


    结果：AI 会提供适合中学生的时间管理方法，而不是适合大人用的技巧。


    ### 5. 评估（evaluate）—— 反复优化，让 AI 给出更好的答案


    AI 有时候第一次的回答不完美，你可以调整问题，让它给出更好的答案。


    - 案例 1


    第一版问题：“怎么提高写作能力？”（提问太笼统）


    优化版：“假设你是一位作家，请告诉我 3 种提高小学生写作能力的方法，并提供 1 个练习技巧。”（更具体）


    结果：AI 现在会提供清楚的写作方法，并附带一个练习技巧。


    - 案例 2


    第一版问题：“推荐一个好玩的假期活动。”（提问太随意）


    优化版：“假设你是一位儿童活动策划师，请推荐 3 种适合 10 岁孩子的暑假活动，并说明各自的优缺点。（更精准）


    结果：AI 会提供更适合孩子的假期活动，并分析优缺点，方便选择。


    ### 6. 结果（result）—— 测试不同问题，找到最好的答案


    有时候，换一种问法，AI 的回答会更好。


    - 案例 1


    问题 A：“怎么学好数学？”（提问太宽泛）


    问题 B：“假设你是一位数学老师，请告诉我 3 个适合五年级小学生的数学学习方法，并提供一道练习题。”（更具体，答案更有用）


    - 案例 2


    问题 A：“请推荐一个简单的健身计划。”（提问太笼统）


    问题 B：“假设你是一位健身教练，我每天只有 20 分钟锻炼时间，请推荐一个 7 天的健身计划，包含运动项目和时长。”（更精准，答案更有价值）


    结果：问题 B 的答案更符合实际需求。


    由此可见，用 CLEVER 能让 AI 更 clever（聪明）。下次你问 AI 问题时，可以尝试用以上方法来操作。


