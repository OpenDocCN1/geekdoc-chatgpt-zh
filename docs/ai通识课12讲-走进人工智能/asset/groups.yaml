    他们的第一款脑机接口设备名为“心灵感应”（Telepathy），首位植入者是美国高位截瘫患者诺兰（Noland）。在手术后短短几周内，诺兰便能通过意念控制光标、点击按钮，甚至玩高难度的策略游戏——《文明
    6》。更令人惊讶的是，他已经成为一名游戏主播，在社交媒体 X（前 Twitter）上与网友互动，展现脑机接口的强大能力。


    这一突破性进展令医学界震惊，在 2024 年美国神经外科医师协会（CNS）年会上，马斯克受邀介绍 Neuralink 的进展，赢得了在场医生的集体起立鼓掌。医生们意识到，脑机接口提供了一种全新的治疗方案，能解决传统医学难以攻克的问题。


