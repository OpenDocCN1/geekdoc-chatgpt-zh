    ## 1.5.3 大语言模型可能存在问题，但依然是通向 AGI 之路


    大语言模型，不管是 GPT、DeepSeek、Grok 还是豆包，它们的核心本质都是概率分布的模拟器，而不是知识库。它们不是在搜索验证已有的内容，而是在生成新的内容，生成的内容是通过预测最有可能出现的文本组合。


    这句话可能不太好理解。举个例子，AI 知道“冰激凌在太阳下会融化”并不是因为它理解了热力学定律，而是因为在它学习的海量文本里，“冰激凌”和“太阳”共同出现时，“融化”这个词出现的概率远远大于“凝固”，所以它会输出：冰激凌在太阳下会融化。


    AI 在处理常识性问题的时候，基于统计学逻辑得出的答案一点儿问题都没有。但在处理一些有深度的复杂问题的时候，因为训练数据不足，它就会自作聪明地去强行“完形填空”，生成一些看似合理实际上非常错误的结论，就像虚构一些学术论文。


    比如，我讲课时需要介绍量子计算机，就会让 AI 帮我提供量子计算领域的最新参考文献。结果，它给我一个《量子纠缠在药物研发中的应用》（作者：John Smith,
    2024 年在 Nature 刊载），但实际上 Nature 中并不存在该论文。你问 AI：“2023 年诺贝尔物理学奖得主是谁？” AI 可能会告诉你：“2023
    年诺贝尔物理学奖由约翰·史密斯博士获得，他因在量子隐形传态领域的突破性贡献而获奖。”


    这听起来有模有样，甚至有具体的人名和研究方向，但事实是——诺贝尔物理学奖获得者中根本没有这个人！


    这种自信满满的造假能力正是 AI 幻觉的经典表现。为什么会发生这种事呢？很重要的一点是，大语言模型跟人脑不一样，它没有自我觉知的能力，也就是元认知的能力。它不知道自己不知道，就会导致当问题超出它的能力边界的时候，它会“张口就来”，一定要给出一个答案——哪怕这个答案是错的。这是因为从大语言模型的第一性来说，它是要“接话”，对错不重要，接住你的话才重要，这其实挺危险的。更有意思的是，如果它回答的错误内容被你指出之后，它不会觉得有什么问题，只会说“抱歉”，然后夸你“厉害”“发现了我的错误”。所以，我们在使用
    AI 的时候，只有理解了它的原理，知道了它的这些弱点，才能够更好地让它帮助我们进行内容生产。


    那 AI 的正确打开方式是什么样的呢？ 怎么避免 AI 出现幻觉呢？


    第一是优化提问方式。这就是我们通常说的设置提示词，要尽量避免提出模糊不清的问题。比如，不要问：“人类什么时候能实现永生？” 而要问：“请基于近 5 年 Science、Nature
    发表的寿命延长相关的论文和全球百岁老人数据库的人口统计模型，量化分析当前技术下人类寿命延长的理论极限，排除伦理争议和资金限制因素。”


    第二是交叉验证。你在询问一些重要的问题如法律条文、学术结论的时候，不要只依赖 AI 的回答，一定要通过多方信任交叉，验证一下这个说法到底是不是真的，或者通过互联网搜索去找信息的源头。


    第三是分批输出。如果你要处理长文本内容，可以分几次发给它，不要一次性发给它，因为它有可能会忘记你前面发给它的东西是什么，导致后面乱输出。


    第四是学会选择模型。当你提的问题是跟创意相关的，那么建议用基础大语言模型 GPT-4o 或者 DeepSeek V3。如果你提的问题是与事实、逻辑、推理相关的，建议用推理模型
    OpenAI O1 或者 DeepSeek R1，因为 AI 模型也跟人类大脑一样，有两套系统——系统 1 快思维和系统 2 慢思维，快思维偏直觉，它会很快地给出一个答案；但是对于某些问题，它可能会失误。而慢思维思考的时间会更长，消耗更多电力和算力，但是它可能会给出一个正确的答案。这好比我们问“9.11
    和 9.9，哪个更大”，基于快思维的基础模型都有可能答错，但基于慢思维的推理模型答案都是对的（具体讲解参见 5.1 节）。


    目前，这些高级模型的出现只是冰山的一角，未来大家可能会看到越来越多类似这样的技术：它不仅能够懂你说什么，还懂你心里想什么。今后，人们可能会花更多时间跟 AI
    聊天，而不是跟真人聊天。这既令人兴奋，又有一点让人担心。令我们兴奋的是，科技正在以前所未有的方式贴近人性；而让我们不安的是，我们可能还没有准备好去面对这种高智商、高情商的
    AI。也许，这种高智商、高情商 AI 升级到极致的时候，才是真正的 AGI 时刻的来临。


    ## 第 2 讲


    ## 感官革命：AI 的 “多感官” 觉醒


    机器是否具备类似人类的感官呢？或许可以用人类认知世界的方式来理解：比如，当父母指着苹果告诉孩子“这是苹果”时，或播放鸟鸣声解释“这是小鸟的声音”时，孩子便逐渐建立了对事物的认知。人工智能的学习过程也遵循类似的逻辑——通过摄像头捕捉视觉信号“观察”世界，借助麦克风接收声波振动“聆听”环境，并依靠预先设计的算法程序“解读”这些信息，进而完成对外界的理解与反馈。接下来，我们将揭开机器如何将图像、声音、文字转化为它能理解的“语言”的秘密。


    ### 2.1 声波解码术：机器如何“听懂”你的悄悄话


    假设我们要教一个外星人理解中文：它得先听见我们的声音，再把声音拆成小零件，最后拼出完整的意思。AI 的语音识别过程也是这样的，它用数学和大量练习来完成这项任务。接下来，我们一步步看
    AI 是怎么听懂人类说话的。


    **1. 第一步：录音——AI 用“耳朵”听声音**


    当你对着手机说“明天天气怎么样？”时，手机的麦克风就像 AI 的耳朵，把声音（空气的振动）变成电信号，再把这些电信号变成数字代码，以方便 AI 处理。


    简单理解：想象你的声音是一条波浪线，AI 会用“相机”快速连拍，把它变成很多小点，每秒要拍 44100 次。这些小点像“拼图块”，AI 要用它们拼出你的完整声音，波浪线局部放大后的效果如图
    2-1 所示。


    ![](img/4826d65752f331a038e2ec250e520700_36_0.png)


    图 2-1


    **2. 第二步：降噪——在吵闹的地方听清你的声音**


    当你在菜市场、大街上或者有风的地方讲话时，周围会有很多噪声，如汽车声、风声、键盘声。AI 必须学会分清哪个是你的声音，哪个是噪声，这就是“降噪”技术。


    那么 AI 如何做到这两步的呢？


    - (1) 频谱分析：AI 像调色师一样，会把声音分成不同的“颜色”（频率），只保留人类说话的声音范围（80～8000Hz）。

    - (2) 动态降噪：如果突然有一辆汽车鸣笛，AI 就会像“调收音机”一样，自动降低噪声的音量，让你的声音更清晰。


    简单理解：你在 KTV 唱歌时，虽然旁边有人在吵闹，你还是能听清楚原唱的歌词，这就是降噪的效果。


    **3. 第三步：拆解声音——让 AI “看见” 声音的形状**


    AI 不能直接理解声音，它需要先把声音变成数字特征，再“猜”出你说了什么。这一步，AI 用了一种叫 MFCC（梅尔频率倒谱系数）的技术，相当于把声音变成一张“声音指纹”图片。


    AI 会拆解声音成以下这些特征。


    - (1) 音调：区分男声、女声、儿童的声音。

    - (2) 长短：AI 能听出“啊——”和“啊”的区别。

    - (3) 口形：嘴巴形状会影响声音，比如“啊”和“哦”发音不同，AI 可以分析出它们的区别。


    简单理解：你用眼睛看朋友的脸来认人，AI 用数学方法“看”声音的形状来认出你说了什么。


    **4. 第四步：猜字游戏——AI 如何拼出完整的句子**


    AI 听到你的声音后，不会直接知道你说了什么，而是用“拼音 + 猜测”来完成识别。它有一个超级大字典，里面存了数百万个词语和句子，可以快速匹配你的发音，找出最可能的单词。


    AI 是这样做的：


    - (1) 声音切片：AI 会先把你的句子拆成很多小块，比如“z h” + “ong” = “中”。

    - (2) 拼音匹配：AI 会在它的字典里找出最合适的汉字组合，比如“zhong guo” = “中国”。

    - (3) 上下文推理：如果你说“我要订一张去北京的 fei 票”，AI 知道你想说的是“飞机票”，而不是“废票”。


    简单理解：玩个填词游戏：“春天来了，___子飞回来了。”相信你会填“燕”，而不会填“蚂蚁”。AI 也是这样，它会根据前后单词猜出你真正想表达的意思。


    **5. 第五步：纠错优化——AI 像老师改作文**


    AI 并不是每次都能 100% 听对，但它会用机器学习不断改进自己，让错误越来越少。


    那么 AI 是怎么学会纠错的呢？


    - (1) 大数据学习：AI 听过亿万句人类对话，它知道“红烧牛肉”后面应该接“面”而不是“电脑”。

    - (2) 自我修正：如果用户经常把“fei”纠正成“飞”，那么 AI 下次会更倾向于选择“飞”，而不是“废”。

    - (3) 个人习惯适应：手机输入法越用越懂你，因为它记录了你的常用词。


    简单理解：语文老师会帮助学生修改作文，AI 也会自己“改作业”，让自己变得更聪明。


    **6. 第六步：AI 语音识别的核心算法（通俗解释）**


    - (1) 隐马尔可夫模型（HMM）：这是一种用来“猜测”你的下一句话的方法。它会把你的讲话拆成一个个小片段，计算每个片段最有可能是什么。


    简单理解：你听到“谢谢你______”时，大概率会想到“谢谢你帮助我”而不是“谢谢你打我”。AI 也是这样，会根据大数据计算最合理的单词组合。


    - (2) 深度神经网络（DNN）：DNN 就像 AI 的大脑，它能学会不同人说话的方式，并自动适应不同的发音和口音。例如，普通话里的“鞋子”在四川话中听起来像“孩子”，但
    AI 可以通过学习调整让四川人和北京人都能顺利进行语音输入。


    简单理解：你第一次听四川话可能会听不懂，但听多了你就会明白。AI 也是这样，它通过不断学习来理解不同的说话方式。


    现在 AI 的语音识别还不完美，那么它面临哪些挑战呢？


    - (1) 多人同时讲话会混乱：如果你和朋友同时对同一部手机说话，AI 可能会听不清你们谁在说什么，这叫鸡尾酒会效应。

    - (2) 悄悄话很难被识别：如果你低声耳语，AI 可能听不清声音特征。

    - (3) 方言挑战：虽然 AI 已经能识别部分方言，但仍然不能像语言学家一样理解所有口音。


    未来，AI 语音识别功能会更厉害，不仅会有更强的降噪技术，让 AI 能听清嘈杂环境下的语音，而且方言适应能力会提升，能更精准地理解各地口音。


    AI 的听话魔法：每次你用手机进行语音输入，AI 都在做一场超级复杂的计算。


    - 步骤 1：录音，AI 像耳朵一样捕捉声音。

    - 步骤 2：降噪，去掉背景噪声，保留你的声音。

    - 步骤 3：把声音拆解成“指纹”，找到特征。

    - 步骤 4：猜字游戏，把声音拼成完整的句子。

    - 步骤 5：纠错优化，像老师改作文，让自己变得更聪明。


    其实，AI 并不是真能“听懂”人类语言，它只是用数学和大量的数据，把声音转换成我们能理解的文字。这项技术正在改变世界，让人与机器的交流变得越来越自然。


    ### 2.2 像素捕手：从数字盲到万物识别大师


    想象一下，你在玩一款“找不同”的游戏：你需要仔细观察两张图片的细节，找到它们的不同之处。AI 在识别图片时，也是用类似的方法来分析每个细节。但不同的是，AI
    没有眼睛，它只能用数字来“看”世界。那么，它是怎么做到的呢？


    #### 2.2.1 教机器认数字——像放大镜一样观察细节


    机器眼中的图片，并不是我们平时看到的五颜六色的照片，而是一张由无数个小方格（像素）组成的“马赛克画”。每个小方格都有一个颜色值。


    | 颜色 | 数值 |

    |------|------|

    | 纯白色 | 255 |

    | 纯黑色 | 0 |

    | 灰色 | 0 到 255 的数值 |


    假设当 AI 看到一个手写的数字“7”，它不会直接识别出来，而是先把这张图片变成一个 28×28 的小方格，一共 784 个像素，每个像素都有不同的灰度值。你可以把这个过程想象成放大一张照片，直到变得很模糊，你会看到它是由很多个小格子组成的，这些格子就是像素。AI
    通过读取这些像素的数值，找到数字的形状。


    那么，AI 是如何知道哪个像素属于数字，哪个属于背景呢？这就要靠学习。科学家给 AI 看 5万张手写的数字图片，每张图片都标注了正确的答案（比如“这是 2”）。AI
    通过不断比对，总结出一定的特征（规律）。比如：


    - “0”中间有个洞；

    - “9”像气球加个尾巴；

    - “7”由一条横线和一条斜线组成。


    到了 1998 年，法国科学家杨立昆发明了一种“简单神经网络”，让机器的数字识别准确率达到 98%，甚至比邮局的人工分拣员还要准。正是因为这个贡献，杨立昆后来获得了计算机科学的最高奖项——图灵奖。


    #### 2.2.2 从数字到猫狗——AI 是如何“看”图片的


    如果 AI 要识别的不是数字，而是更复杂的事物，比如一只猫或一辆汽车，它需要更强大的方法。这时，科学家发明了一种叫作卷积神经网络（CNN）的算法，可以让 AI
    像人类一样分层次地分析图片。


    那么 CNN 是如何工作的呢？


    我们把它想象成一组放大镜，我们在看图片时，并不是一下子就看到所有细节，而是先看整体，再关注细节。CNN 的工作方式也是这样的，它会用一层层的“放大镜”来看图片。


    - (1) 第一层放大镜（边缘检测）：这一层专门找“线条”，比如“7”字的斜线，或者猫的耳朵轮廓。你可以想象它是用铅笔轻轻描出图形的边缘。

    - (2) 第二层放大镜（形状识别）：这一层把线条拼成更复杂的形状，如圆形、三角形、矩形。比如，它会发现猫的耳朵是三角形，车轮是圆形。

    - (3) 第三层放大镜（整体识别）：这一层把所有的形状组合起来，判断这到底是什么东西。比如，两个尖耳朵 + 胡须 + 竖瞳孔 = 猫，圆形轮子 + 座椅
    = 自行车。


    这些“放大镜”是怎么工作的呢？这里就用到了矩阵运算。你可以把 AI 想象成一张透明的网格盖在图片上，每次移动一点点，然后计算图片的局部特征。AI 会不断地扫描整个图片，把这些特征组合起来，最终得到一个完整的识别结果，如图
    2-2 所示。


    ![](img/4826d65752f331a038e2ec250e520700_42_0.png)


    图 2-2


    这个方法最早是由华人科学家李飞飞发明的，她让 AI 学习了 100万张标注好的图片（ImageNet 数据集），通过不断训练，AI 终于学会了识别猫、狗、汽车等各种物体。


    CNN 之所以适合图像处理，是因为它能有效地利用图像的空间信息。


    例如，猫的耳朵——无论左边还是右边，它们的特征都是相似的，因此 CNN 可以通过卷积操作，让同样的“放大镜”在不同位置反复扫描，提高识别的稳定性。


    但是，CNN 在处理语言的时候却产生了一些问题，因为语言不像图片那样是“二维”的，而是一维的序列，每个单词的顺序很重要。如果你颠倒一下“我爱你”和“你爱我”的顺序，意思就完全变了。CNN
    无法准确理解这种顺序关系，所以我们在第一讲讲大语言模型时强调，不管是 GPT 还是 DeepSeek，它们用到的都是 Transformer 模型。


    Transformer 的核心是“注意力机制”（attention），它不像 CNN 那样逐层扫描图片，而是同时看整句话的所有单词，然后计算它们彼此的关联。例如，在句子“猫坐在垫子上”中，Transformer
    可以发现“猫”这个词和“坐”这个动作之间的关系比“垫子”更强。


    Transformer 的另一个优势是可以处理长距离的依赖关系。比如，在句子“虽然天气很冷，但我还是出去跑步了”中，最重要的信息是“虽然”和“但”之间的对比，而
    CNN 在处理这种长距离的关系时会变得很困难，而 Transformer 可以轻松找到这些词之间的联系。


    所以，总结出 CNN 和 Transformer 的区别如下。


    - (1) CNN 适合图片，因为它擅长分层次提取局部特征，如边缘、形状、整体物体。

    - (2) Transformer 适合语言，因为它擅长全局理解，能同时关注整个句子的所有部分，并计算单词之间的关系。


    这种区别决定了 CNN 主要用于图像识别，比如让手机相册自动分类，或帮助自动驾驶汽车分析路况。而 Transformer 则用于处理文本，比如让 AI 能理解和翻译语言，或者让聊天机器人准确回答你的问题。而现在多模态的
    AI 可以把这两种能力结合起来，让机器不仅能看懂图片，还能理解图片背后的故事。


    #### 2.2.3 手机相册的智能分类——AI 如何整理你的照片


    以前，我们在相册里找照片，通常需要自己记住照片的名字，比如“2024 年暑假海边旅行”或者“爸爸的生日派对”。如果想找到这些照片，就要在搜索框里输入完全匹配的文字，比如“海边”或者“生日”，才能找到相关照片。如果你写错了字，或者记错了照片的名字，就可能找不到。


    现在，AI 变得更聪明了，不再只是匹配文字，而是真正理解照片的内容，就像一个能听懂你话的“小助手”一样。你不需要记住照片的名字，也不需要自己标记，AI 会自动帮你整理和分类。


    AI 是怎么做到的呢？


    当你用手机拍照时，AI 会自动分析照片里的内容，并加上合适的“标签”，就像给照片贴上小标签纸。比如，你拍了一张野餐的照片，AI 会进行具体分析。


    - (1) 物体检测：AI 先识别照片里有哪些物品，如三明治、苹果、野餐垫。

    - (2) 脸部识别：如果照片里有你和你的家人，AI 会匹配相册里熟悉的面孔，知道这是你们拍的合照。

    - (3) 场景推理：如果照片里有草地、食物，还有大家的笑脸，AI 会推测这是一次野餐，并自动给照片加上“野餐”“户外”“开心时光”等标签。

    - (4) 情感分析：AI 会观察人们的表情，如果大家都在笑，它会判断这是一个“欢乐时光”。


    这样，下次你想找这张照片时，就不需要输入“2024 年 6 月野餐照片”这样准确的词，只需要随便说一句“上次和家人一起在草地上吃饭的照片”，AI 就能理解你的意思，并很快找出相关的照片。


    那么 AI 的“理解能力”是怎么获得的呢？


    - (1) 理解图片的意思：AI 会用深度学习训练自己，让自己变得像人一样聪明。比如，它看过上百万张“野餐”照片，知道大部分野餐照片都有草地、食物、蓝天和微笑的人。于是，它看到一张类似的照片时，就能推测出这是“野餐”，即使照片里没有明确写着“野餐”这个词。

    - (2) 理解你说的话：AI 现在还能理解自然语言。比如，你搜索“我去年冬天堆雪人的照片”，AI 会明白“去年冬天” = 2024 年的冬天，“堆雪人”
    = 可能是雪地、孩子、戴着手套的人，然后从相册里帮你找出所有相关的照片，而不仅仅是匹配文字。


    AI 还能做什么呢？


    - (1) 智能回忆助手：假如你记不起具体的时间，但还记得那天你穿了红色的衣服，AI 就可以通过颜色识别，帮你找到“穿红衣服的照片”。

    - (2) 场景搜索：如果你想找到“所有有蛋糕的照片”，AI 会自动找出所有有蛋糕的生日派对、婚礼、下午茶照片，而不是只看照片的文件名。

    - (3) 人物分类：如果你想找和好朋友小明的所有合照，只需要输入“小明的照片”，AI 就会自动识别他在所有照片中的身影。


    未来，AI 可能会变得更聪明。


    以后，AI 不仅能找到照片，还能帮你讲述故事。比如，你问：“去年我们去了哪些城市旅游？” AI 可能会帮你回忆：“你去年去了上海、北京和广州，这些是你在这些城市的照片。”
    它甚至可以自动生成一本“旅行日记手册”，把所有相关的照片、视频和你的足迹整理好，让你一键回忆

