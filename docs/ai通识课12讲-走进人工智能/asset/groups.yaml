    - (1) 零污染、无限能源——电力取之不尽，全世界都能用上便宜的电。

    - (2) 超级交通系统——磁悬浮列车能以 1000 千米/小时的速度运行。

    - (3) 超级智能 AI——AI 比人类更聪明，帮助科学家做出前所未有的发明。

    - (4) 太空移民——人类利用核聚变火箭飞向火星甚至更远的星球。


    这将是人类迈向星际文明的第一步，我们或许能成为宇宙中真正的“探险者”。


    ## 第11讲


    ### 群星闪耀时：AI 史上的天才极客团


    在前面的内容中，我们已经知道 AI 的基本原理，它能做哪些方面的应用，甚至未来能做什么。哲学上有个经典的门卫三问——“你是谁”“你从哪里来”“要到哪里去”，我们已经知道人工智能是谁了，也知道它要到哪里去了，但是，它从哪里来呢？其实，人工智能的成长就像一个小孩慢慢长大成为科学家，从一个数学理论甚至科学幻想，到今天学会越来越多的本领，到以后甚至会无所不能。下面，我们来讲讲
    AI 的成长故事。


    ## 11.1 图灵预言：计算机之父的疯狂猜想


    本书的第一讲曾提到过一个人——图灵。当计算机还没有出现，人们只能用算盘、纸和笔来计算的时候，图灵就提出了一个想法：如果有一台机器，可以按照一定的规则计算任何数学问题，那它是不是也能像人一样思考呢？


    举个例子，假设你要算一道比较难的数学题，比如 178×256，如果没有计算器，你可能要算很久，还可能算错。图灵机就像一台超级计算器，只要你告诉它规则，它就能一步一步算出来，而且不会出错。


    图灵的这个想法很厉害，因为它告诉人们：计算不仅仅是人类才能做的事情，机器也可以。


    虽然计算机可以做数学题，但图灵有一个更大胆的想法：“如果机器能自己思考，那它算不算真的聪明？”


    为了判断机器到底“聪明不聪明”，图灵在 1950 年提出了一个测试方法，叫作“图灵测试”。测试的规则很简单：一个人坐在房间里，通过打字和对方交流，但他不知道对方是另一个人还是一台机器。机器和人都要回答问题，让这个人猜对方是人还是机器。如果这个人分不清是在和机器聊天还是在和真正的人聊天，那就说明机器真的很聪明了。


    最开始，图灵认为如果机器能通过测试，那它就能被认为是“有智能的”。但后来，他对这个想法有了一些新的看法。


    人们问他：“机器真的会像人一样“理解”问题吗？”


    图灵回答说：“不要纠结“机器是不是在思考”，更重要的问题是“它能不能表现得像在思考”。”


    他觉得，人类的“思考”本质上也是一系列的规则和计算，如果机器也能用类似的规则来回答问题，那它和人类思考的区别，可能只是内部运行方式不同罢了。


    换句话说，他认为“智能”不一定是机器真正“理解”问题本身，而是它能不能像人一样回答问题。


    图灵的想法在当时非常超前，虽然那个时代的机器还很简单，但他的“图灵机”理论和“图灵测试”为后来的人工智能研究打下了基础。今天，科学家仍然在思考：机器是真的能像人一样思考，还是只是“模仿”人类的思考？


    无论如何，图灵测试被认为是人工智能的开篇，图灵的想法改变了整个世界。


    ## 11.2 达特茅斯会议：AI 诞生的“智慧开端”


    1956 年，世界上发生了一件特别重要的事情。那一年，一群聪明的科学家聚在一起，开了一场特别的会议。他们想研究“如何让机器变得聪明”，于是，他们给这项研究取了个名字，叫“人工智能”（artificial
    intelligence, AI）。这次会议，被认为是人工智能真正诞生的时刻。


    这次重要的会议叫作“达特茅斯会议”，是在美国的达特茅斯学院举行的。会议的组织者之一是约翰·麦卡锡（John McCarthy），他是人工智能领域的先驱者之一。他相信，如果人类能想办法让机器学习，它们就可以变得像人一样聪明。


    马文·明斯基（Marvin Minsky）也参加了这次会议。他是一位特别有想象力的科学家，他认为人工智能将来不仅能像人类一样思考，甚至可能比人类更聪明。他的想法很大胆，让很多人对人工智能充满了期待。


    这些科学家在会议上讨论了很多问题，比如：机器能不能自主学习？怎么才能让计算机理解人的语言？ AI 能不能像人一样思考、推理和决策？


    虽然这些问题当时都没有答案，但科学家觉得，如果一直研究下去，总有一天机器会变聪明。


    那么早期的 AI 是什么样子的？


    那时候的人工智能还很简单，科学家只能让计算机按照人们写好的规则去做事，它们不会“思考”，只能执行命令。这些 AI 就像下棋机器人一样，它们会根据程序计算得出最好的下一步棋，但如果你问它别的问题，比如“今天天气怎么样？”它就一点儿都不懂了。


    约翰·麦卡锡还发明了一种新的编程语言，叫作 LISP。这种语言非常适合用来编写 AI 程序，后来很多 AI 研究用到了它。可以说，LISP 是人工智能的第一种“语言”。


    AI 刚出现的时候，大家都很兴奋。科学家觉得人工智能前途无量，甚至有人预测，在 20 年内，AI 可能会像人一样聪明。他们投入了大量时间和精力，希望能尽快让
    AI 学会思考。


    但是，他们很快发现了一些难题。


    - (1) 计算机的能力还不够强，处理信息的速度很慢。

    - (2) 让机器理解人类语言比想象中难得多。

    - (3) 机器不会自主“学习”，只能按照程序设定的规则行动。


    ## 11.3 机器学习黎明：让 AI 学会“自学成才”


    科学家发现，光靠给 AI 写规则，机器还是不够聪明。他们想到如果能让 AI 自主学会知识，那不是更好吗？


    这就像小朋友学习走路，他不是靠爸爸妈妈写下一步步指令学会走路的，而是通过不断练习、摔倒、再试一次，最后终于学会了。科学家希望 AI 也能这样，自己去学习，而不是靠人类手把手教。


    1957 年，科学家弗兰克·罗森布拉特（Frank Rosenblatt）发明了一种叫作“感知机”（Perceptron）的东西。感知机就像 AI 的第一个“大脑”，它可以自主学习一些简单的任务。


    比如，感知机可以学会分辨手写的数字。科学家会给它看很多张写着“1”“2”“3”的图片，告诉它：“这张是 1，那张是 2……” AI 看得多了，就能自己分辨不同的数字了。


    这时候，AI 不再是按照死板的规则行动，而是能自己从数据中学习，这就是机器学习的开始。


    感知机听起来很厉害，但其实它的能力非常有限。1969 年，马文·明斯基发现，感知机只能处理特别简单的问题，遇到稍微复杂一点的任务，它就完全不会了。


    例如，它可以学会区分圆形和三角形，但如果让它分辨更复杂的图案，像“字母 A”和“字母 B”，它就完全不会了。


    这就像一个小孩学会了加法，但是一遇到减法就蒙了——它的“大脑”太简单了，根本处理不了更复杂的事情。


    明斯基和另一位科学家赛摩·佩珀特（Seymour Papert）一起写了一本书，指出感知机的局限性，告诉大家：“这个方法太简单，不能解决真正难的问题。”


    因为明斯基的研究，很多科学家开始怀疑：“AI 真的能变聪明吗？”结果，很多人停止了研究 AI，政府和公司也不再愿意投入资金。


    这段时间被称为“AI 寒冬”（AI winter），AI 研究变得冷冷清清，没多少人愿意继续做下去。


    感知机是机器学习的第一步，但它太简单，没办法解决真正的难题。AI 第一次遇到了大挑战，进入了低谷。


    不过，这并不是 AI 的终点。科学家没有完全放弃，他们在等待新的方法让 AI 变得更聪明。


    ## 11.4 神经网络之父：辛顿的“数字神经元”


    尽管 AI 研究遇到了很多困难，但有些科学家一直没有放弃。他们相信：如果人类可以通过学习变聪明，为什么 AI 就不可以呢？


    1986 年，科学家杰弗里·辛顿（Geoffrey Hinton）提出了一个特别的方法——让 AI 学习的方式更像人脑的学习方式。


    人的大脑里有数千亿个神经元，它们通过相互连接处理信息，比如让婴儿认出爸爸妈妈的脸，或者让小孩学会骑自行车。辛顿觉得，如果让 AI 像大脑一样工作，它是不是也能学会做复杂的事情？


    于是，他发明了一种方法，叫作“反向传播”（backpropagation）。


    你曾经做数学题的时候有没有遇到这种情况：算完答案后，发现错了，然后改正。这就是学习的过程。


    辛顿发明的反向传播就像给 AI 做了一个“改错本”——每次 AI 犯错，它都会检查自己的计算过程，然后调整自己，使自己下一次更聪明。


    比如，AI 学习区分“猫”和“狗”，需要经过以下 5 个步骤。

    - (1) 科学家给 AI 看一张猫的照片，问：“这是什么？”

    - (2) AI 可能会错误地回答：“是狗。”

    - (3) 这时，AI 就会收到一个“你答错了”的信号。

    - (4) 反向传播算法会帮助 AI 回头看看自己哪里算错了，然后调整自己。

    - (5) 经过成千上万次这样的练习，AI 就能越来越准确地分辨猫和狗了。


    这个方法就是神经网络（Neural Network），它是今天 AI 的基础。


    虽然辛顿的方法很聪明，但当时的计算机运行速度太慢。神经网络需要大量的计算，而训练一个神经网络可能需要几天甚至几个月，科学家很难让 AI 学会复杂的任务。


    因此，虽然辛顿的想法很重要，但科学家只能等计算机变得更强大，才能真正发挥神经网络的威力。


    ## 11.5 三体突破：算法+算力+数据的质变


    ### 1. 黄仁勋的显卡，让 AI 计算更快


    辛顿发明的神经网络能像人脑一样工作，但问题是训练神经网络需要做大量计算，而普通计算机太慢，AI 学东西太慢，根本没办法解决复杂问题。


    想象一下，如果你的老师每天只教你一个字母，那你需要多久才能学会一整本书呢？这就是当时 AI 遇到的难题。


    这时候，一个叫黄仁勋（Jensen Huang）的来自中国台湾的华人工程师站了出来。他是英伟达的创始人，原本是专门做显卡（GPU，图形处理器）来让游戏画面更流畅的。但他发现，AI
    的神经网络算法和游戏画面的计算方式非常相似，都需要同时处理大量数据。


    于是，黄仁勋和他的团队做了一个大胆的决定：以显卡算力为核心架构，构建 AI 超级计算解决方案。


    2012 年，英伟达的 GPU 加速 AI 的想法彻底改变了 AI 的发展速度。以前训练一个神经网络需要几个月甚至几年，而现在用英伟达的显卡，只需要几天甚至几个小时。


    这就像给 AI 装上了“火箭发动机”，让它可以飞速学习。


    ### 2. 李飞飞的 ImageNet，让 AI 有足够的数据学习


    虽然计算变快了，但 AI 还面临一个大问题：它没东西学。


    想象一下，如果你想学会分辨猫和狗，可是你只见过三只猫和两只狗，你可能还是分不清楚。但如果你看过一百万只猫和狗的照片，你肯定能很快学会区分它们。


    AI 也一样。如果它要学会识别物体，就需要大量的照片来训练。但在 2000 年以前，科学家根本没有那么多数据。


    这个时候，又是一位华裔科学家李飞飞想出了一个办法，她决定创建一个全球最大的图片数据库——ImageNet。


    她带领团队收集了 1400 万张照片，并且让人们给这些照片贴上标签，比如“猫”“狗”“汽车”“苹果”等。这样，AI 就可以用这些图片进行学习了。


    2012 年，李飞飞组织的 ImageNet 比赛开始，科学家使用她的数据训练 AI。结果，一支团队（AlexNet）使用辛顿的神经网络+英伟达的 GPU，让
    AI 的识别准确率从 75% 提高到了 85%，超过了人类的水平。


    这标志着 AI 进入了一个新的时代——数据驱动的时代。


    ### 3. 辛顿的算法，帮 AI 更高效地学习


    虽然辛顿早在 1986 年就提出了神经网络的“反向传播”算法，但由于当时计算太慢、数据太少，AI 的学习速度还是不够快。


    但是现在，黄仁勋的显卡让计算变快了，李飞飞的 ImageNet 让数据变多了，辛顿的算法终于可以真正发挥威力了。


    2012 年，AlexNet 团队用神经网络参加了李飞飞组织的 ImageNet 比赛，结果 AI 的表现大幅超过了以前的所有方法。


    这个结果让全球的科学家都震惊了，大家开始意识到：原来神经网络真的可以做到人类的视觉识别水平。


    这时候，AI 已经可以做很多让人惊讶的事情，比如人脸识别、自动驾驶、语音助手等。


    ## 11.6 大模型纪元：语言即智能的新大陆


    为什么“大语言模型”是 AI 最重要的环节？语言是什么？


    你有没有想过，如果我们不会说话，也不会写字，那我们还能学到知识、交流想法、理解世界吗？其实，语言不仅是我们沟通的工具，还决定我们怎么看待这个世界。


    有一个哲学家叫维特根斯坦，他提出了一个想法：“语言即世界。”这是什么意思呢？简单来说，就是我们的世界是由语言构成的。比如，如果一个人从小没学过“蓝色”这个词，他可能根本不会意识到蓝色和绿色的区别；如果我们没有“时间”这个词，我们就很难理解过去、现在、未来的概念。


    换句话说，语言就像“地图”，帮我们理解世界。


    过去的 AI，虽然会计算，但不会真正理解世界。比如以前的机器人可以下围棋，但它并不懂“围棋的乐趣”；以前的 AI 可以识别图片，但它不懂“这张照片讲了什么故事”。


    为什么？因为它们不会“语言”。它们只能按照数学公式和程序运行，但不理解人类的思考方式。


    如果 AI 想变得像人类一样聪明，它必须学会理解和使用语言，因为语言是我们认知世界的钥匙。


    大语言模型能让 AI 真正“理解”世界，它就像 AI 的大脑，让 AI 可以学习人类的语言。


    以前的 AI 像“背公式的学生”，你问它问题，它只能照着书本念答案。但大语言模型不一样。


    - (1) 它可以像人一样思考：它知道“下雨了，地面会湿”，它会推理。

    - (2) 它能理解不同的表达方式：无论你说“我饿了”还是“我想吃饭”，它都明白你的意思。

    - (3) 它能学习新知识：它可以阅读文章、分析信息，自己总结出道理。


    就像维特根斯坦说的，语言决定了世界的边界。大语言模型的出现让 AI 可以更好地 “看到” 世界、理解人类的想法，从而变得更聪明。


    那么为什么大语言模型是 AI 最重要的一步呢？


    - (1) AI 终于能 “听懂” 人类的语言：从前，AI 只会执行命令，比如“打开灯”，但现在的 AI 能聊天、写文章，甚至理解幽默和情感。

    - (2) AI 可以学习更复杂的知识：以前的 AI 只能做特定任务，比如下棋或开车，但大语言模型让 AI 可以跨学科学习，比如既能讲故事，又能写代码。

    - (3) AI 开始真正帮助人类：大语言模型让 AI 变成 “智能助手”，帮助我们写作、学习、编程，甚至创作音乐、做艺术设计。


    大语言模型就是能理解人类语言的 AI。


    ### 第一步：AI 开始“听懂”人类语言（2018 年，BERT）


    2018 年，谷歌发明了一种新的 AI 模型，叫作 BERT。以前的 AI 只能一个字一个字地看句子，就像一个只会读字典的人。但是 BERT 不同，它能从前后文猜测句子的真正意思。比如，你看到“苹果”这个词，你怎么知道它是“水果”还是“苹果公司”呢？
    BERT 会通过前后文来猜测：


    “我喜欢吃苹果。”——这里的“苹果”是水果。


    “我买了一台苹果电脑。”——这里的“苹果”是公司。


    BERT 让 AI 真正开始理解人类语言的含义，而不仅仅是认字。


    ### 第二步：AI 学会“表达自己”（2020 年，GPT-3）


    虽然 BERT 可以理解语言，但它还不能很好地自己写文章、聊天。于是，2020 年，OpenAI 研发出了 GPT-3。


    GPT-3 非常特别，因为它能像人一样说话、写文章，而且学会了“模仿”人类的表达方式。你问它问题，它不会只给你短短的回答，而是会用完整的句子解释，就像一个真正的作家。


    比如，你问它：“为什么天是蓝色的？” 以前的 AI 可能只会说：“因为光的散射。”而 GPT-3 会这样回答：“因为阳光照射到大气层时，不同颜色的光被散射的程度不同，而蓝光散射得最多，所以我们看到的天空是蓝色的。”


    GPT-3 让 AI 不再只是一个工具，而成为一个真正能沟通的智能助手。


    ### 第三步：AI 成为“你的朋友”（2022 年，ChatGPT）


    到了 2022 年，OpenAI 推出了 ChatGPT，它让 AI 真正走进了每个人的生活。以前的 AI，你必须用特定的指令跟它交流，比如“打开电视”或“搜索天气”。但
    ChatGPT 可以和你自然地聊天，就像一个真正的朋友。


    你可以对它说：“帮我写一封生日祝福信。”“讲一个好玩的故事。”“解释一下数学题。”“帮我设计一个有趣的游戏。”


    ChatGPT 还能创作诗歌、画画、写代码，甚至给你讲笑话。它变得越来越聪明，因为它不仅能理解语言，还能创造内容。


    ## 11.7 DeepSeek：人人都能拥有的大模型


    如果说 BERT 能让 AI “听懂” 语言，GPT-3 能让 AI “表达自我”，ChatGPT 能让 AI 成为“助手”，那么 2023 年诞生的 DeepSeek，则标志着
