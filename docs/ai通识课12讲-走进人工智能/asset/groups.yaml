    ### 2.2.5 AI 也会看错：当机器的眼睛看错世界


    AI 的眼睛可以看到很多东西，如汽车、信号灯、行人，但它和人类的眼睛不一样，有时候会被“骗”。人类有大脑，可以通过经验和常识判断看到的东西，但 AI 是靠数字和图像计算识别物体的，所以有时候它会出现一些让人哭笑不得的“视觉异常”。


    ### 1. 对抗样本：被小纸片骗倒的 AI


    AI 识别交通标志时，会分析它的形状、颜色和上面的文字。但如果有人在停车标志上贴几张小纸片，AI 可能会误以为这不是“停车”标志，而是“限速50千米”标志。


    为什么会这样？


    AI 不能像人类那样真正“理解”一个标志的意思，而是通过像素的排列方式识别它。那些小纸片可能刚好让 AI 的计算发生偏差，就像你玩拼图时，有人偷偷换了一块，结果你拼出来的图案就“走样”了。


    现实中的问题：有科学家做过实验，在一个“停止”标志上加了黑白色的小贴纸，结果 AI 误以为是“限速45”的标志。如果自动驾驶汽车“看错”了标志，可能会导致在本应该停车的地方，汽车却继续行驶，这非常危险。


    ### 2. 光影陷阱：AI 被影子吓到


    假设傍晚时分，你正在马路上走着，突然看到一条很长的影子横在路上，你会立刻明白：“哦，这是太阳照在树上留下的影子，根本不是障碍物。”但是 AI 机器人就没这么聪明了，它可能会误以为影子是一堵墙，然后猛踩刹车。


    为什么会这样？


    原来，AI 在训练时，大多数情况下影子不会对它造成影响。但当影子特别长、特别黑或者形状怪异时，AI 就会“疑神疑鬼”，不敢前进。特别是在夕阳西下时，影子会拉得特别长，AI
    可能会误以为前面有障碍物，导致不必要的紧急刹车。


    现实中的问题：有些自动驾驶汽车在隧道口或桥梁下行驶时，会因为光线变化太快，导致 AI 短暂“失明”，无法正确识别前方道路。这时候，如果车子突然刹车，后面的车可能会追尾。


    ### 3. 拟态迷惑：AI 以为人是斑马线


    假设一个人穿了一件黑白相间的条纹T恤站在马路边。AI 很可能会误以为那是斑马线。


    为什么会这样？


    原来，AI 识别物体时，是通过颜色、形状和排列方式来判断的。如果你的衣服正好和斑马线的颜色、纹路很像，AI 就可能会混淆。对于人类来说，我们看到的是“穿着条纹衣服的人”，但
    AI 只是看到了一组黑白相间的条纹，它并不知道这其实是衣服。


    ### 4. 透明障碍物：AI 看不见玻璃


    你有没有这样的经历——不小心撞到玻璃门。因为玻璃太透明了，有时候连人都会看不出来，更别说 AI 了。如果前方有一面干净的玻璃墙，AI 可能完全不会意识到它的存在，直到撞上去才发现。


    为什么会这样？


    原来，AI 主要依赖摄像头识别物体，但玻璃是透明的，它不会像普通物体那样有清晰的边缘和颜色。人类通过光线的反射和周围环境来推测玻璃的存在，而 AI 如果没有装上额外的传感器（比如雷达），就很容易“视而不见”。


    现实中的问题：为了防止自动驾驶汽车误撞玻璃门，很多自动驾驶汽车会配备激光雷达，用光束扫描物体的距离，而不是仅仅依赖摄像头。


    ### 5. AI 不懂“常识”


    人在开车时，不仅仅是看东西，还要理解看到的东西。例如，如果你驾驶汽车看到前方有一个足球在滚动，你可能会立刻想到：这个足球可能是小朋友踢出来的，小朋友可能会从后面冲出来。于是，你会放慢车速。


    AI 会怎样处理呢？它可能只会看到“足球”这个物体，而不会想到可能会有小朋友。AI 只会根据过去的经验判断危险，而不能像人类一样做逻辑推理。


    现实中的问题：一次，一辆自动驾驶汽车经过路口时，前面突然有一个骑自行车的人摔倒了。这时，人类司机会立刻想到：这个人可能会挣扎着站起来，我要小心。但自动驾驶汽车上的
    AI 只是计算了自行车的运动轨迹，发现自行车已经倒地，就认为它不会再移动，于是继续往前行驶，差点发生撞人事故。


    ### 6. AI 容易被“假象”骗到


    假设你在街上看到一幅超大的广告牌，印有一辆逼真的汽车。你知道那只是广告，不是真的车，但 AI 呢？它可能会把广告牌上的汽车当成真的汽车，然后在广告牌前紧急刹车。


    那么，人类如何训练 AI 解决这些难题而避免误判呢？


    - (1) 训练更多的数据。让 AI 看到更多不同情况下的照片，比如有影子的马路、不同角度的标志、各种天气和光线情况，让它学会区分真正的障碍物和假象。

    - (2) 使用多种传感器。除了使用摄像头，自动驾驶汽车还会使用激光雷达、超声波雷达、红外线等技术，确保AI不仅靠“眼睛”看，还能“用手摸”“用耳朵听”，避免误判。

    - (3) 让 AI 学会常识。研究人员正在训练 AI，让它理解“如果有足球滚出来，随后可能会有小孩跑过来”这样的因果关系，减少误判。


    现在的 AI 有很多视觉缺陷，科学家正在不断改进它，帮助它不断进化，未来它可能比人类的眼睛更强大，不仅能看清前方的路，还能提前预测未来的危险，让世界变得更加安全。


    ## 2.3 动态追踪者：AI 如何破译视频里的时空密码


    你有没有想过，看电影的时候，为什么人物会动起来？其实，视频的本质就像一本会动的连环画，是由一张张静态的图片（帧）快速播放形成的，就像你翻动小人书一样。电影通常每秒播放24张图片（帧），而游戏通常是60帧/秒，播放速度越快，画面就越流畅。每一帧都是一张普通的照片，它的分辨率（比如1920像素×1080像素）决定了图片的清晰度。AI
    想要“看懂”视频，就需要同时理解每一帧画面，并且分析帧与帧之间的关系，找到画面中物体的运动规律。


    ### 2.3.1 机器的“动态视力”——如何理解画面中的运动


    机器在看视频时，需要做两件事：第一，它需要懂得每一帧的画面内容，这和图片识别是一样的；第二，它需要分析帧与帧的关系，也就是说，它需要学会发现画面中的动作变化。


    为了理解运动，AI 会用时间轴上的特征追踪发现物体的运动模式。比如，它会计算画面中像素点的移动方向和速度（光流分析），就像你观察水流中的树叶漂向哪里。它还会锁定物体的关键部分，比如人脸识别时，AI
    会特别关注鼻尖、眼角等稳定的特征点，以确保能够持续追踪同一个人。


    但单靠这些方法还不够。AI 需要更聪明的技术理解动作，比如3D卷积神经网络（3D-CNN）。普通的 CNN 只能识别单张图片的内容，比如看出一张照片里的动物是猫还是狗，而
    3D-CNN 可以同时处理空间（横向和纵向）和时间（前后帧的变化），这样它就能看出一个动作是如何发生的。举个例子，要识别“挥手告别”这个动作，AI 不仅要看到手的形状，还要观察手从下垂到摆动的轨迹，才能知道这是在挥手，而不是在挠头。


    AI 不仅可以理解单个动作，还能分清动作持续的时间长短。比如，打一个喷嚏可能只需要0.5秒，而做饭可能会持续10分钟。如果 AI 在短视频里看到一个人在跳舞，它就能通过分析一系列连续的动作，自动给视频打上“舞蹈挑战”标签。这种方法叫时间切片法，就是把视频分成很多小片段，对每一个片段分别分析，然后拼成一个完整的故事。


    但 AI 在识别视频时不能什么都看，它需要运用注意力机制关注重点部分。这就像你看篮球比赛，眼睛会盯着持球的球员，而不会去看裁判。AI 也是一样的，它会在不同的时间段关注不同的区域，比如在跳水比赛时，它会重点关注运动员的起跳和入水瞬间，而不会去看泳池的水质情况。


    ### 2.3.2 AI 如何理解“空间智能”


    光看懂单个画面还不够，AI 还需要知道物体在空间中的位置。李飞飞教授一直在研究空间智能，也就是让 AI 不仅能识别物体，还能理解它们的三维关系。比如，你的房间里有一张桌子、一把椅子和一台电脑，AI
    不仅要知道这些是什么，还要知道桌子在椅子前面，电脑放在桌子上面。


    李飞飞的研究团队开发了一种叫作时空智能（space-time AI）的技术，它可以帮助 AI 理解世界的三维结构。比如，当 AI 在一个房间里导航时，它不会只看单个画面，而是会记住整个房间的布局，就像你在家里走动时，会知道厨房在哪里、卧室在哪里一样。


    这种技术对于机器人非常重要。比如，未来的智能家居机器人需要在房间里移动，它必须知道家具的位置，才能安全地绕开障碍物。AI 还可以捆绑增强现实（AR）技术，比如戴上AR眼镜，AI
    可以识别周围的环境，并在现实世界里叠加虚拟信息。


    李飞飞的研究也被应用在自动驾驶中，帮助 AI 理解路况。汽车自动驾驶系统使用了多个摄像头和神经网络模型。它的8个摄像头可以同时观察四周的路况，每秒能处理2300帧图像，相当于每只“电子眼”每秒眨眼288次。AI
    会用光流分析判断前方车辆的移动趋势，利用目标检测确认是否有人突然冲出来，还会用轨迹预测推测行人的下一步动作。这些数据最终会汇总到一个3D空间建模系统中，让
    AI 在“脑海”里构建一个立体的交通环境。


    ## 2.4 多感官交响曲：当 AI 学会“眼观六路耳听八方”


    你有没有想过，AI 不仅能“看”世界，还能“听”世界，甚至能“理解”世界，就像人类一样，AI 也在学着用多种感官感知环境，不仅仅是用“眼睛”（摄像头），还会用“耳朵”（麦克风）、“触觉”（传感器）收集信息，最后用“脑子”（人工智能算法）分析这些信息，做出决策。


    人类在日常生活中会用多感官协作。比如，人走在马路上，会看到信号灯变绿，听到汽车鸣笛，感受风吹在脸上，那么就会根据这些信息决定何时过马路。AI 也在学着这样做，从而让机器变得更聪明、更安全。


    ### 2.4.1 自动驾驶的“眼脑耳配合”：AI 如何让汽车自动行驶


    自动驾驶汽车就像一个有“眼睛”和“脑子”的机器人司机，它需要“看”周围的路况，理解车道、信号灯、行人和其他车辆的行为，还要“预测”可能发生的情况，并提前做出决定。


    ### 1. AI 的“眼睛”——多摄像头视觉系统


    特斯拉的自动驾驶系统有8个摄像头，相当于拥有8只眼睛，可以同时观察四周。


    - (1) 前视摄像头。可看清200米外的信号灯、路牌、车道线。

    - (2) 侧方摄像头。可监测旁边的车辆，防止有人突然变道。

    - (3) 后视摄像头。可观察后方来车，避免发生追尾。


    ### 2. AI 的“大脑”——计算机视觉和空间建模


    - (1) 立体感知。AI 不会只单独看一张图片，而是会把所有摄像头的画面结合起来，构建一个3D立体地图，这样它才能知道：“左边有一辆自行车，右边有一辆公交车，前面100米有个红灯。”

    - (2) 即时处理。AI 会判断前方是一个静止的树，还是一个正在移动的行人，然后决定是否刹车或转向。

    - (3) 预测决策。AI 能猜测其他司机的意图，比如如果旁边的车突然向左摆动一下，AI会预判它可能要变道，并提前做好减速准备。

    - (4) 安全机制。如果 AI 遇到了无法识别的情况，比如强烈的阳光反射在路面上，让摄像头“看不清”，它会像人类司机一样谨慎降速，避免危险。


    ### 3. AI 的“耳朵”——听声音判断危险


    除了“看”，自动驾驶汽车还会“听”。如果后方有救护车鸣笛，AI 会通过麦克风捕捉声音，并自动让道。


    在小巷子里，AI 可能看不到拐角处有人，但它能听到远处的喇叭声，继而提前减速，防止意外发生。


    ### 2.4.2 视频分析的“眼耳脑结合”：AI如何同时“看”“听”和“想”


    AI 不仅可以帮助我们开车，还能帮助我们更好地理解世界，比如在短视频推荐、语音识别和智能家居中，它也在“看”“听”和“想”，从而让我们的生活更便捷。


    ### 1. 短视频推荐：AI 如何识别视频内容


    当你刷短视频时，系统总能推荐你喜欢的内容。这是因为 AI 不仅在“看”视频，还在“听”视频，甚至在“理解”视频，从而投你所好。


    - (1) AI 的“眼睛”。它会分析视频画面里的物体，如蛋糕、蜡烛、气球，然后推测这可能是一个生日派对。

    - (2) AI 的“耳朵”。它会分析背景音乐和对话，比如听到“祝你生日快乐”的歌声，就更加确定这是一个庆生场景。

    - (3) AI 的“大脑”。它会把画面和声音结合在一起，判断你喜欢什么内容，比如你常常看猫咪视频，AI 就会多推荐类似的内容。


    ### 2. AI 的“视听理解”还能做什么


    - (1) 看新闻视频。AI 可以识别主播的语音内容和字幕，知道这是一则关于“天气预报”或“体育赛事”的新闻。

    - (2) 智能客服。AI 可以听出你在语音助手里说了什么，并结合屏幕上的文字准确地回答你的问题。


    ### 2.4.3 AI 的挑战：它还不能像人类那样理解世界


    如今，AI 变得越来越聪明，但它仍然面临很多挑战。比如它的“多感官”还没有人类灵活，容易出现“听不懂”“看不清”的问题。


    ### 1. 语言困境


    AI 虽然能听懂普通话和英语，但如果一个人说闽南语或四川话，AI 可能会像外国人听中文相声一样“发蒙”。科学家正在训练 AI，让它能听懂不同的方言，让更多人能用语音助手交流。


    ### 2. 艺术理解


    AI 可以“看”出“这是一幅梵·高的画”，但它不懂为什么这幅画会让人感动。它不知道梵·高笔下的“星空”为什么美丽，也不懂画家提出的“表现主义”是什么意思。科学家正在研究如何让
    AI 理解艺术的情感和文化。


    ### 3. 常识缺失


    AI 知道“水能灭火”，但如果有人问它“用汽油灭火行不行？”AI 可能不会立刻明白这个问题的危险性。人类可以通过常识进行快速判断，但 AI 只能靠大量数据学习。科学家正在训练
    AI，想让它像人一样掌握常识，减少错误判断。


    ### 2.4.4 AI 的未来：让机器真正“理解”世界


    科学家正在让 AI 变得更聪明，让它能结合“看”“听”“触摸”等多种感官能力真正理解世界，而不仅仅是简单地识别物体。


    ### 1. 情境感知


    未来，智能家居可以根据你的哈欠声判断你困了，然后自动调暗灯光，播放轻柔的音乐，帮助你入睡。


    ### 2. 跨语言交流


    未来，你戴上AR眼镜，看着法语菜单，眼镜里的 AI 会立刻帮你翻译成中文，让你的全球旅行变得更加轻松。


    ### 3. 无障碍辅助


    AI 可以帮助视障者“看见”世界。当视障者走在街上，AI 会通过耳机告诉他们：“左前方3米有台阶，小心脚下。”


    AI 还可以帮助听障者“听见”世界。当有人在听障者背后叫他们的名字时，AI 会用震动或屏幕文字提醒他们。


    ### 2.4.5 人机共生的未来：让科技更有温度


    未来的 AI 不会取代人类，而是会帮助人类，让世界更加包容和美好。当 AI 能准确识别老人摔倒，及时呼叫救护车，它就成为家人的守护者；当 AI 能听懂婴儿的哭声，判断婴儿是饿了还是生病了，它就成为父母的好帮手；当
    AI 能读懂医生的手写药方，减少医疗错误，它就成为患者的生命守护者。


    正如望远镜让人类看得更远，显微镜让人类看得更细，人工智能正在拓展人类感知的边界。未来，在 AI 的帮助下，每个人都能拥有“超级感官”，让世界变得更美丽、更安全，也更温暖。

