    # 2. 调整 Seed（种子值）


    AI 绘画有时会生成不稳定的结果，而使用 Seed 可以固定生成结果，确保每次的风格一致。


    # 3. 利用负面提示词


    如果 AI 总是生成一些不需要的元素，比如脸部变形、色彩过亮等，可以使用负面提示词排除这些问题，如不要模糊、不要扭曲、不要变形、去除多余肢体。


    # 4. 调整模型与参数（仅限高级用户）


    如果使用 Stable Diffusion，可以尝试不同的模型，如 SDXL、DreamBooth，并调整步数（Steps）、控制权重（CFG Scale），以优化效果。


    # 7.1.5 AI 绘画的常见问题与解决方案


    AI 绘画的常见问题与解决方案如表 7-2 所示。


    | 问题 | 可能原因 | 解决方案 |

    |---|---|---|

    | 画面不够清晰 | 生成分辨率太低 | 提高分辨率，如 1024 像素 × 1024 像素，或更高分辨率 |

    | AI 理解错误 | 提示词描述不够清晰 | 添加更多细节，使用明确的关键词 |

    | 人物手部或脸部畸形 | AI 训练不足 | 使用 inpainting 功能进行手动修复 |

    | 颜色过饱或不符合预期 | AI 默认风格问题 | 添加色彩描述，如 muted colors 或 pastel tones |


    # 7.1.6 未来发展：AI 绘画的无限可能


    AI 绘画正在影响多个行业的发展。'
