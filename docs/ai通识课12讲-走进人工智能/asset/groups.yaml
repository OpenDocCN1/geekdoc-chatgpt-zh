    这句话可能不太好理解。举个例子，AI 知道“冰激凌在太阳下会融化”并不是因为它理解了热力学定律，而是因为在它学习的海量文本里，“冰激凌”和“太阳”共同出现时，“融化”这个词出现的概率远远大于“凝固”，所以它会输出：冰激凌在太阳下会融化。


