    ## 第 12 讲 与人类共舞：AI 时代的生存哲学


    AI 的快速发展正在彻底改变人类探索和创新的方式。过去，所有的发明都来自人类的智慧，但现在，AI 已经开始发现人类无法直接归纳的科学规律，甚至探索新的知识。如果这个趋势持续下去，AI
    可能会成为人类历史上最后的重大发明，因为在未来，几乎所有的发明创造，都可能由 AI 完成。


    ### 12.1 科学新发现：AI 破解的“宇宙隐藏代码”


    2020 年，麻省理工学院（MIT）的科学家利用 AI 发现了一种全新的抗生素——海尔森（Halicin）。这一发现震惊了科学界，因为海尔森不仅能杀死许多耐药细菌，而且细菌似乎无法对其产生耐药性。


    那么 AI 是如何找到海尔森的呢？


    - （1）训练阶段：科学家提供了一个包含 2000 种分子的数据库，这些分子都经过标注，说明它们是否能阻止细菌生长。


    - （2）学习规律：AI 在数据库中寻找模式，自己总结出一套判断哪些分子能抗菌的规律。


    - （3）筛选分子：AI 筛查了美国食品和药物管理局（FDA）批准的 6 万多种分子，寻找符合抗菌、无毒且与已知抗生素完全不同的分子。


    - （4）最终结果：AI 从 6 万多个分子中筛选出一个，就是海尔森。


    实验验证了 AI 的预测是正确的，海尔森是一种真正有效的新型抗生素。如果用传统的实验方法，这项研究可能需要几十年和成千上万的人力，但 AI 却在极短时间内完成了筛选和分析。


    AI 不仅能发现新药，还在其他领域突破人类极限。


    海尔森的发现只是 AI 改变科学研究的一个例子。在许多其他领域，AI 同样展现出了超越人类的发现能力。


    - （1）蛋白质折叠问题：AI（如 DeepMind 的 AlphaFold）成功预测了蛋白质的三维结构，这是生物医学史上的一个重大突破。


    - （2）新材料发现：AI 可以分析无数种元素组合，寻找全新的超导材料、纳米材料和新能源材料。


    - （3）量子计算优化：AI 可以帮助优化量子算法，提高计算效率，加速量子计算机的实用化。


    - （4）气候预测：AI 能够处理海量数据，提高气候模型的准确性，帮助科学家更好地预测极端天气和全球变暖的趋势。


    - （5）宇宙探索：AI 可以分析天文望远镜的数据，寻找新的行星、恒星，甚至可能帮助人类发现外星生命。


    这些领域都存在一个共性：AI 发现的规律，人类很难直接解释。当科学家被问到“AI 是如何找到海尔森的？”他们的回答是：“我们不知道。”


    很多人也许会挑衅说：“你连原理都不知道，那还能做发明吗？”可是不要忘了，瓦特改良蒸汽机的时候人类还不知道热力学，莱特兄弟发明飞机的时候，人类也不清楚空气动力学。


    AI 在庞大的数据中找到了某种模式，但人类无法直接理解这些模式背后的数学逻辑。数学或物理规律是我们用来理解世界的工具，但 AI 可能找到的是更高维度、非人类直觉的规律。比如，神经网络可能利用了我们未知的高维几何结构，或者是一些超复杂的统计分布，使得它的预测极为准确，但这些模式无法用人类已知的数学模型直接描述出来。AI
    时代是计算驱动与传统科学推理的对比，传统科学的方法是“理论—实验—应用”，而 AI 时代的方法越来越多地变成“数据—计算—应用—理论”，这是一个科学研究范式的彻底革命。AI
    将成为主要的“发现者”，人类不再是唯一的创新主体。在过去的几千年里，人类一直是世界运行规律的唯一发现者，所有的科学理论、技术发明，都是由人类探索、总结、创造的。


    但现在，AI 的出现改变了这个规则。


    AI 可以自动发现科学规律，比人类科学家快成百上千倍。


    AI 可以自动设计新的实验，在虚拟环境中进行高效测试。


    AI 可以自动生成新的理论，为物理、数学、生物等学科提供新的理解。


    这意味着，AI 可能是人类历史上最后的发明，因为未来所有的发明，都将由 AI 完成。


    为什么科技巨头都在全力投入 AI？


    全球顶级科技公司都在全力投入 AI 领域，因为他们已经意识到，AI 不仅仅是一个工具，更是未来所有创新的核心（见表 12-1）。


    | 科技公司 | 发展方向 |

    | :--- | :--- |

    | 谷歌（Google） | 开发了 BERT、AlphaFold、DeepMind 等 AI 系统，应用于语言理解、医学研究、自动驾驶等领域 |

    | 特斯拉（Tesla） | AI 驱动的自动驾驶技术，让汽车能够自主导航，减少交通事故 |

    | 微软（Microsoft） | 投资 AI 芯片、AI 云计算，让 AI 成为未来计算的核心 |

    | OpenAI | 开发了 GPT 系列语言模型，推动 AI 与人类的交流和创造 |

    | 百度（Baidu） | 打造文心一言（ERNIE Bot）及自动驾驶技术 Apollo，深耕生成式 AI、无人驾驶和 AI 产业落地 |

    | 阿里巴巴（Alibaba） | 推出通义千问 AI 大模型，并在电商、金融、云计算领域大规模应用 AI，提高效率 |

    | 腾讯（Tencent） | 发布混元大模型，推动 AI 在社交、游戏、医疗等多个场景的应用，并利用 AI 进行智能内容创作 |

    | 华为（Huawei） | 开发盘古大模型，并专注于 AI 芯片（昇腾 910）、AI 算力基础设施，推动 AI 在企业级市场的应用 |


    AI 不仅能提升生产效率，还能直接创造新的科学知识，这就是为什么科技巨头们都在全力投入 AI。


    ### 12.2 角色重置：从万物灵长到 AI 协作者


    如果 AI 接管了所有的创新和发现，那么人类需要做什么呢？


    - （1）与 AI 合作：未来，科学家、工程师、医生等职业可能更多是“与 AI 协作”，而不是单独完成任务。


    - （2）定义 AI 的目标：AI 可以发明东西，但它不知道“什么样的发明才是最重要的”。人类的任务是提出问题，而 AI 的任务是寻找答案。


    - （3）确保 AI 的安全和道德：AI 的能力越来越强，人类需要确保它不会被滥用，也不会对社会造成负面影响。


    AI 的发展速度已经超过了许多人的预期。它不仅是一个工具，更可能成为未来所有创新的主导者。当 AI 能够自主发现科学规律、设计新药、优化技术、预测未来时，人类的角色将发生根本性的变化。


    面对这个时代，我们需要思考几个问题：如何利用 AI 推动科学进步？如何调整教育方式，让人类更适应 AI 时代？如何确保 AI 的发展是安全、可控、符合人类价值观的？


    ### 12.3 不可替代性：人类独有的“认知维度”


    当 AI 能预测股市、生成代码，甚至设计疫苗、开发药物，人类还剩什么不可替代？人类有哪些能力是所有的 AI 都做不到的，不仅今天做不到，未来 10 年、100
    年、1000 年，甚至永远都做不到的？这个才是 AI 时代人类最大的价值，我认为有以下三点。


    第一个叫担当力，即承担后果的能力。AI 其实是没有决策能力的，AI 可以是世界上最聪明的参谋，但是最后的决策需要人类来做，因为决策的潜台词是担责任。比如自动驾驶领域，对
    AI 来说判断走哪条路、什么时候停、什么时候走都是可以的，但是遇到不可避免的车祸，需要 AI 在驾驶员和行人之间选择一方来承受伤害时，AI 就做不了，需要人类提前告诉他。


    第二个是价值判断。AI 可以给你提供事实判断，却唯独没有办法给你价值判断。你问它明天下雨的概率，它可以算得出来。但是你问它：你喜欢下雨吗？它就会告诉你：我喜欢晴天，也喜欢阴天，也喜欢下雨，都很好。就像你平时刷到的视频可能是
    AI 生成的，但是点赞的动作永远属于人类，因为点赞就是一个价值判断。


    第三个是精神追求，AI 虽然有神经网络，但是它们并没有神经，也没有精神世界。AI 可以精确地计算一件事成功的概率，但是不会有“人定胜天”“胜天半子”的冒险精神，冒险精神的背后其实是意义感，而只有人才会有意义感。因为人的生命有限，冒险精神的真谛，在于用有限生命对抗无限虚无。当数据穷尽逻辑时，人类始终保留着推翻所有数据的勇气。


    所以，我们根本不用担心被 AI 取代，而是要全力拥抱 AI，发挥我们作为人最大的价值。石器时代淘汰的不是手脚，而是拒绝握紧燧石的手；蒸汽时代碾碎的不是劳力，而是固守马车的车轮。被取代的从不是“人”，而是停滞的认知维度。恐惧
    AI 的人看见替代，驾驭 AI 的人看见阶梯。


    ### 12.4 价值重构：在 AI 洪流中锚定人性灯塔


    人要学会拥抱和使用机器，而不是被机器替代。相信大家最近经常听到这样的声音：现在人工智能来了，你的工作要被机器替代了，未来人类可能会被机器奴役，人类正在经历一场巨变，等等。类似这样制造焦虑的话对不对呢？从某一个方向看是对的，而且这场巨变才刚刚开始。但大家可以思考一下，人工智能明明是我们人类发明的，何以会替代我们人类呢？自己发明的工具在未来反而成了主角，那主角应该是我们人类才对啊。因为人类发明的这个工具不同以往，以前工业革命发明的蒸汽机、汽车，到后来变得普及，让我们每个人都变得像社会的一颗螺丝钉，甚至人们都不用思考，只要工作就行，社会生产力就取得了巨大的进步。


    其实工业革命之前人们的收入没有明显的变化，工业革命开始后就不一样了。但这也带来一个问题，有人认为：人类自工业革命后变得越来越不善于思考，甚至有的工作就希望你不要思考，这是对的吗？但后来，随着科技的进步，人类对于人性本源性的知识，学习得越来越少。而这一次的人工智能是什么？是智能，前面是工业革命，这次是智能革命。我们花大量的时间去学习的东西，机器人马上给你答案。这恰恰逼着人类需要重新认识人类和机器的区别，重新思考我们何以为人。


    信息时代来了，现在人工智能来了，大语言模型也来了，但我们人类目前看还没有自我进化到能够从容地接受 AI 时代的挑战。


    现在知识变得随手可得，我们可以在手机上甚至 AR 眼镜上获取世界上的所有知识。你能读懂用任何一种语言写的小说，戴上耳机能听懂任何国家的语言。但是未来的人才选拔不会仅仅基于知识，而应该基于能力，因为能力才是让我们人类继续前进的关键。


    所以，阿尔法时代的孩子们，因为他们出生在智能科技高度普及的环境，当他们走向社会，他们以后解决问题的方式都将是电子化、数字化、智能化的，未来比拼的应该是有效地使用工具的能力。但是大家不要以为只要有工具，大家应该水平就差不多。不是的，不同的人使用不同的工具，可能对人类科技的进步会起到不同的作用。


    我举一个例子，大家就明白了：有 3 个人都能熟练运用机器，只要直接问机器，就能得到答案。假设他们要用机器的能力为自己的电动汽车进行改进。第一个人对电动汽车有深刻的理解，但其知识体系中并不包含人类有史以来借助外力实现从
    A 点到 B 点的经历和知识。第一个人就直接问机器如何做出一台更好的电动汽车，AI 给出了答案。第二个人对于电动汽车的原理有基本的理解，但不深入，不过他了解人类有史以来实现从
    A 点到 B 点的过程中的艰辛和坎坷。第二个人就问 AI 如何能做出一个更好的交通工具，AI 给了答案。第三个人对于电动汽车只有感性的认识，但他有数学、物理、化学等现代科学的知识，他明白问题的核心是要解决如何从
    A 点到 B 点，他就问 AI 如何从 A 点到 B 点。大家觉得这三个人问的问题最大的区别是什么？


    答案就是开放性。对于第一个人，机器只会给出电动车的方案；对于第二个人，机器可能会给出比电动车更好的一种交通工具；那么第三个人呢？机器可能会给出一种全新的方案，甚至可能已经不是交通工具。


    哪一种人会对科技提供突破性的进展？答案是第三种。大家发现没有，我们目前的人才储备中，第一种人是最多的，第三种人最少，那这个例子给我们的启发就是：我们何以为人？


    人类的价值可能在人工智能时代需要进行重新思考。但并不是说，目前知识的学习不重要，相反，知识的学习在任何时候都是重要的，但我们需要知道怎么学，怎么思考。大家想想，为什么人类能生存至今？就是因为人有主观能动性，会思考，是一种能够适应复杂环境变化的智能生物。在人工智能面前，我们当然能继续适应，我们需要做的就是扬长避短。我想现在已经没有什么人想着去跟汽车比速度，去跟挖掘机比力量了。人类不需要和自己发明的工具较劲了，人类要做的就是拥抱它，用好它。要知道，以后只要是可重复的、能做成模型的、能找到规律的、能形成范式的工作，机器都能学会。


    那么人工智能时代，我们何以为人？相信读者已经有所感触。我们无需焦虑，先试着在跑步的时候看看路边的小草有没有发芽，空气中有没有春天的味道，感受微风吹过耳边的那种惬意感，感受游泳的时候水从耳边流过的那种自由感。这种美妙的感觉，机器是不会有的，只有人类才有。所以，人类应该用更人性、更有灵性的方式去生活。我们要做的就是：重新思考我们应该如何去学习，如何去教育，如何去工作，如何去拥抱和使用机器，搞明白在未来我们人类和机器的区别——我们何以为人？

