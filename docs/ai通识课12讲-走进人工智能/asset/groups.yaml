    # 内容简介


    这是一本革新认知的 AI 科普读物！作者以从深蓝到 GPT 的跨越式发展为引，手把手拆解大语言模型如何学习、推理与创作。全书以 12 讲硬核通识课串联起 AI
    感知、交互、脑机接口、量子计算等关键技术，同步解析 AGI 和 ASI 颠覆性趋势对教育、就业及社会结构的冲击。书中案例丰富，从 AI 绘画速成到游戏开发实战，再到
    AI 辅助教学，既提供“用 AI 提效”的落地工具，又启发“与 AI 共存”的深度思考。


    本书特别适配青少年 AI 学习三阶段：从零基础了解 AI 的神奇，到掌握底层运行原理，再到解锁跨学科应用，家长和教师也能从中获取 AI 教育的相关知识。翻开本书，掌控人机协作时代的生存法则！


    本书封面贴有清华大学出版社防伪标签，无标签者不得销售。版权所有，侵权必究。举报：010-62782989，beiqinquan@tup.tsinghua.edu.cn。


