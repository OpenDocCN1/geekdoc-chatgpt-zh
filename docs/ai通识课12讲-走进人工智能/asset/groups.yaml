    ## 第 7 讲 变身 AI 创客：你的首个数字作品


    在人类文明的长河中，艺术创作曾被视为天赋与技艺的专属领地，而 AI 的爆发式发展正将艺术创作的权杖交到每个普通人手中。本讲通过对绘画与音乐两大领域的技术解剖，呈现普通人如何通过
    AI 工具将思想涟漪转化为可触可感的艺术作品。


    ## 7.1 5 分钟 AI 绘画速成：从涂鸦到赛博画廊


    在绘画领域，AI 已突破传统技艺壁垒：专业画师可通过智能系统实现创作效能倍增，零基础用户仅需输入文字指令便能“召唤”光影精致的图像。那么，如何使用 AI 生成图片？有哪些关键步骤呢？


    ### 7.1.1 AI 生成图片的基本原理


    AI 绘画通常依赖于深度学习模型，这些模型经过大量的图片训练，能够根据用户输入的提示词生成相应的图像。当前流行的 AI 绘画技术包括以下几种。


    - 扩散模型（diffusion models）：如 Stable Diffusion、DALL·E 等，通过去噪的方式逐步生成清晰图像。

    - 生成对抗网络（GAN）：如 StyleGAN，擅长生成逼真的人物肖像。

    - 神经风格迁移（neural style transfer）：将某种艺术风格应用到普通图片上，如将照片变成油画风格。


    ### 7.1.2 选择 AI 绘画工具


    目前有很多优秀的 AI 绘画工具，可满足不同的需求，具体如表 7-1 所示。


    | 工具 | 特点 | 适用场景 |

    |---|---|---|

    | DALL·E | 由 OpenAI 开发，支持复杂场景，艺术创作能力强 | 创意插画、科幻风格、概念艺术 |

    | Stable Diffusion | 开源，允许本地运行，可控性强 | 高质量写实图像，个性化调整 |

    | Midjourney | 细节丰富，艺术表现力强 | 奇幻风格、插画、角色设计 |

    | Runway ML | 支持视频、动画生成 | 视频创意、动态影像 |

    | Deep Dream Generator | 具有梦幻般的艺术风格 | 艺术创作、抽象艺术 |


    如果你是新手，可以从 DALL·E 或 Midjourney 入门，它们的界面简单易用。如果你想深度定制，可以尝试 Stable Diffusion。


    ### 7.1.3 AI 绘画的基本操作流程


    AI 绘画主要包含以下基本流程。


    ### 1. 确定图片需求


    在使用 AI 生成图片前，先思考以下几个问题。


    - (1) 你想画什么？（人物、风景、建筑、科幻场景等）

    - (2) 你喜欢什么风格？（写实、二次元、赛博朋克、油画风格等）

    - (3) 你希望图片如何构图？（特写、全身、场景化等）


    ### 2. 编写提示词


    提示词是 AI 绘画的“指令”，写得好，生成的图片质量就高。一个好的提示词通常包含以下 5 个元素。


    - (1) 主体：要画什么？

    - (2) 风格：写实、梦幻、赛博朋克、水彩画等。

    - (3) 光影：阳光明媚、柔光、霓虹灯等。

    - (4) 背景：森林、城市、海洋、星空等。

    - (5) 构图：特写、俯视、广角等。


    ### 案例 1：简单提示词


    > “一幅美丽的海上日落图，色彩鲜艳，数字绘画风格。”


