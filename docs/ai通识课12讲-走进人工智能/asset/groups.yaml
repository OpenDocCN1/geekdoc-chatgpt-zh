    所以，AI 作曲不是“凭感觉”创作的，而是用数学的方法，像拼拼图一样，把音符按一定的规划拼成一首动听的歌曲。


    ## 3.3.5 AI 作曲的应用


    AI 作曲的应用很广，就像一个能快速搭建乐高城堡的机器人，它可以做很多有趣的事情。


    - 1. 自动生成背景音乐


    你在玩游戏或者看电影的时候，会发现游戏里，每当进入不同的场景，比如森林、战斗、胜利，背景音乐都会发生变化。电影里的音乐也会配合故事情节和人物感情，比如开心的时候有轻快的旋律，紧张的时候有激动人心的鼓声。


    以前，这些背景音乐需要作曲家一首一首地写出来，时间很长。现在，AI 可以帮助我们快速生成合适的背景音乐。例如，设计一个冒险游戏时，AI 可以根据场景自动生成神秘、刺激的背景音乐。制作一个动画短片时，AI
    可以生成符合画面情绪的音乐。


    虽然 AI 写的音乐可能不像人类作曲家那样独特，但它可以很快地提供很多种选择，让制作游戏或电影的人更容易找到合适的音乐。


    - 2. 帮助音乐人创作


    有时候，音乐人会遇到灵感枯竭的情况，也就是说突然不知道该写什么旋律好。这时候，AI 就像一个聪明的助手，帮忙提供一些想法。


    比如，一个作曲家想写一首快乐的歌，但不知道该从哪一段旋律开始。他可以让 AI 生成几个不同的旋律，然后从中挑选自己喜欢的部分，再加上自己的修改。


    这好比两个人合作画画，AI 先画一个简单的草图，作曲家再加上细节，让它变得更有个性。


    - 3. 制作个性化音乐


    你有没有听过那种“根据你的心情推荐歌曲”的软件？ AI 可以更进一步，直接为你创作一首符合你心情的音乐。


    如果你今天很开心，AI 可以为你生成一首轻快的旋律，让你听了更有活力。如果你觉得有点伤感，AI 可以创作一首温柔的音乐，陪伴你度过这一天。甚至，如果你正在学习，AI
    可以给你播放一首专注学习的背景音乐，让你更容易集中注意力。


    AI 变成了一个“音乐厨师”，可以根据你的口味做出专门为你定制的音乐大餐。


    ## 3.3.6 AI 作曲的局限


    AI 很聪明，但它也有自己的弱点，就像一个机器人虽然能走路，却不会真正地感到累或开心。


    ### 1. AI 的音乐缺乏真正的情感


    人类在创作音乐时，会把自己的情感放进去。例如，一位作曲家刚刚经历了一件感人的事情，他写的旋律可能会特别动人。一位歌手在唱歌时，可能会因为想起一段往事，声音里带着悲伤，让听的人也感受到那种情绪。


    但是 AI 不一样，它虽然能分析什么样的旋律听起来像是开心的、什么样的听起来像是悲伤的，但它自己不会真正“感受”这些情绪。


    就像一个机器人可以模仿人在笑，但它并不是真的觉得有趣。AI 的音乐虽然可能很悦耳，但有时候听起来会少了一点 “灵魂”，因为它不会真正地 “想念一个人” 或者
    “感到心碎”。


    ### 2. AI 无法突破已有的音乐规则


    AI 的音乐是通过学习人类过去的作品来创作的，这就意味着它只能用已有的规则来写歌，它很难创造出全新的音乐风格。


    历史上有很多作曲家，如贝多芬、莫扎特、肖邦，他们都创造了新的音乐风格，改变了音乐的历史。而 AI 只是按照它学到的规则作曲，它不会有突发奇想的创意，比如发明一个完全不同的音乐世界。


    这就像一个很会搭积木的机器人，它可以拼出城堡、汽车、房子，但它不会突然想出一个从来没人见过的新积木形状。


    所以，AI 是一个很棒的音乐助手，但它不能完全代替人类的创造力。未来，最好的方式可能是 AI 和人类一起合作，AI 提供灵感，人类加入情感和创意，以创造更加动听的音乐。


    ## 3.4 时空编织者：AI 生成视频的帧率魔术


    AI 生成视频，就像在画一本会动的连环画。它可以从文字或图片开始，慢慢把画面变成一段会动的故事。


    ### 3.4.1 从文本开始：AI 变 “导演”


    如果 AI 只有一段文字，比如 “一只小狗在草地上跑”，它会先想象这个画面应该是什么样的。然后，它会 “找” 画面：先画出一张小狗在草地上的图片。再让画面动起来：多画几张稍微不一样的图片，让小狗的腿一点点变换位置，就像动画片那样，一张一张连起来，就成了视频。


    这就像你画一个人跑步，每一页画一点点不同，翻快了就像他在跑动一样。


    ### 3.4.2 从图片开始：AI 变 “魔术师”


    在从图片生成视频的过程中，AI 充当了类似魔术师的角色。在已有的静态图片基础上，AI 会推测物体的运动方式，逐渐改变画面内容，使其呈现动态效果。例如，如果
    AI 得到一张狗站在草地上的图片，它会根据学习到的知识预测狗接下来的动作，比如抬起腿或向前跳，然后生成一系列稍有变化的图片，最终形成一个连续的视频片段。


    ### 3.4.3 AI 是怎么做到的


    AI 其实是 “学习” 得来的。科学家给它看了很多视频，让它明白 “东西是怎么动的”。例如，狗跑步是怎么动的，树被风吹的时候是怎么摇晃的。学会这些后，AI
    就能自己 “猜” 出新的视频该怎么生成。


    ### 3.4.4 AI 生成视频的局限性


    AI 其实还不够聪明，它在生成视频方面还有不少局限性。


    - 1. 视频太短


    目前 AI 最多只能做 15 秒左右的短视频（大约和深呼吸三次的时间一样长），再长就会出错，比如跑着的小狗突然多出两条腿，或者草地变成奇怪的彩色斑点。因为
    AI “记不住” 太长的动作规律。


    - 2. 细节混乱


    AI 可能会让手指变成六根，或者让人边说话边眨眼，但眼皮和嘴巴的动作对不上，就像动画片里卡住的木偶。


    - 3. 不懂真实世界


    如果让 AI 生成“老鹰用爪子打开汽水瓶”，它可能画出老鹰抓瓶子的样子，但不知道老鹰其实不会开瓶盖。


    ### 3.4.5 未来的魔法升级


    科学家正在教 AI 两种新本领。


    - 1. 长时间记忆


    让 AI 像看连续剧一样记住前 10 秒发生了什么，这样生成的视频能越来越长，甚至做出完整的小故事。


    - 2. 物理小课堂


    教 AI 学习重力、光线变化等真实世界的规律，比如让 AI 知道雨水应该往下落，而不是像泡泡一样往上飘。


    所以，现在能生成视频的 AI 就像刚学画画的小学一年级学生，虽然能画出大概样子，但细节还需要老师帮忙修改。不过也许再过几年，它就能做出和动画电影一样流畅的视频了。未来，也许人人都可以当导演了。


    ## 3.5 未来创作革命：AI 会成为艺术之神吗


    未来的 AI 创作将在多个领域展现前所未有的创造力与多样性。


    ### 3.5.1 文学创作：情感表达与个性化风格的突破


    未来 AI 在文学创作中将突破现有技术壁垒，深度模拟人类情感并实现个性化风格适配。通过分析海量文学作品的叙事结构、情感表达模式和语言风格（如托尔斯泰的宏大叙事或村上春树的意识流手法），AI
    可生成具有情感张力的故事框架，甚至模仿特定作家的文风。例如，用户输入“一个关于孤独与救赎的科幻故事”，AI 不仅能生成完整情节，还能根据用户过往写作偏好调整叙事节奏（如冷峻的硬科幻风格或诗意的软科幻表达）。目前已有
    AI 独立创作的百万字小说并获得文学奖项的案例，未来这种能力将更趋成熟。


    ### 3.5.2 视觉艺术：精准度与创新性并重的创作革命


    在绘画领域，AI 将实现从风格模仿到原创突破的跨越。通过多模态技术，AI 可解析文字指令中的抽象概念（如“满杯红酒的忧郁感”），结合物理光影规律和艺术史知识库，生成兼具精准构图与情感隐喻的图像。


    - (1) 风格融合创新。将梵·高的笔触与赛博朋克美学结合，生成未来主义画作。

    - (2) 动态交互创作。艺术家通过手势或语音实时调整 AI 生成的草图，实现人机共创。

    - (3) 三维空间构建。根据二维线稿自动生成三维模型，应用于游戏场景或影视特效。


    ### 3.5.3 音乐创作：从辅助作曲到情感共鸣的进化


    AI 音乐创作将突破现有旋律生成模式，实现与人类作曲家的深度协作。通过分析听众的生理数据（如心率、脑波）和情感反馈，AI 可动态调整音乐元素。


    - (1) 情感化编曲。根据“悲伤—治愈”的情感曲线，自动匹配和弦进行与乐器音色。

    - (2) 跨文化融合。将传统戏曲唱腔与电子音乐节奏结合，创造新型音乐流派。

    - (3) 实时交互演出。在音乐会中，AI 根据现场观众情绪即时生成变奏旋律，与人类乐手即兴合奏。


    ### 3.5.4 影视创作：全流程智能化与个性化观影


    未来 AI 将参与从剧本到成片的完整影视生产链。用户输入故事大纲后，AI 可完成以下工作。


    - (1) 剧本生成。基于角色关系网，自动生成符合戏剧冲突的对话与情节转折点。

    - (2) 虚拟演员建模。通过深度学习真人演员表情数据，生成高度拟真的数字角色。

    - (3) 自适应剪辑。根据观众偏好（如更喜欢悬疑或浪漫元素）生成多个版本结局。

    - (4) 多模态合成。结合文本、图像、音频生成沉浸式互动电影，观众可改变剧情走向。


    ### 3.5.5 人机协作新范式：创造力倍增器


    AI 将不会取代人类创作者，而是成为创意生态系统的核心基础设施。


    - (1) 灵感激发网络。通过分析全球文化数据（如社交媒体热点、考古发现），为艺术家提供跨时空的创作灵感。

    - (2) 创作效率革命。自动化处理 80% 的重复性工作（如分镜绘制、和声编排），让人类更聚焦于核心创意。

    - (3) 伦理与版权解决方案。区块链技术将明确 AI 创作中人类的贡献度，实现智能合约下的收益分配。


    未来的 AI 创作将呈现“金字塔式”生态结构：底层是 AI 驱动的标准化内容生产，中层为人机协作的创新领域，顶层则是人类独有的哲学性、颠覆性创意。这种协作模式不仅会催生新的艺术形式（如
    AI 生成的元宇宙建筑、神经交互诗歌），更将重新定义“创造力”的边界——人类负责提出“为什么创作”，而 AI 专注于解决“如何更好地创作”。正如毕加索所言：“计算机毫无用处，它只能给你答案。”而未来，人类与
    AI 的共同使命，是提出更震撼的问题。


    ## 3.6 生成式 AI：重新定义人类想象力的边界


    因为它不仅能解决问题，还能创造新东西。相比之前的 AI，它的能力更接近人类的创造力，影响也更广泛。


    ### 1. AI 工具对比


    之前的 AI（如深蓝和阿尔法狗）与生成式 AI 的对比如表 3-1 所示。


    ### 表 3-1 不同类型 AI 的对比


    | AI 类型 | 特点 | 代表 |

    |---|---|---|

    | 规则驱动 AI | 按照固定规则做决定 | 深蓝（下棋 AI） |

    | 决策型 AI | 学习大量数据，做出最优决策 | 阿尔法狗（下棋 AI） |

    | 生成式 AI | 学习数据后，能创作全新内容 | ChatGPT（写作 AI）、Midjourney（绘画 AI） |


    - (1) 深蓝（1997）：只是计算所有可能的棋步，找到最优解，类似“暴力破解”。


    - (2) 阿尔法狗（2016）：会自己学习，不仅能计算棋步，还能模拟人类直觉，变得更强。


    - (3) 生成式 AI（2022）：不仅会下棋，还可以创作小说、写代码、画画，甚至创作音乐。


    ### 2. 生成式 AI 的革命性意义


    - (1) 创造力。能写文章、画画、作曲，不仅能按规则做事，更能“像人一样”创造新东西。

    - (2) 通用性。适用于几乎所有行业（教育、医疗、艺术、……），不像以前的 AI 只能做一件事。

    - (3) 交互性。能理解和生成自然语言，让人与机器的沟通更顺畅。

    - (4) 自我进化。可以不断学习、优化，变得越来越聪明，而不是只运行固定的程序。


    ### 3. 生成式 AI 将改变世界


    - (1) 教育。帮助学生写作、解题、生成学习资料。

    - (2) 艺术。让普通人也能画出专业级别的作品。

    - (3) 编程。自动生成代码，提高开发效率。

    - (4) 医疗。帮助医生分析病情，甚至生成个性化治疗方案。

    - (5) 商业。自动生成广告、文案，提升营销效率。


    以前的 AI 更像“超级计算器”，而生成式 AI 更像“超级创作者”，它带来了人类与机器协作的新时代，影响范围远超过过去的任何 AI 技术！


    ## 第 4 讲


    ## 对话 AI 的秘籍：成为语言魔法师


    通过前面几讲的介绍，我们已经全方位地了解 AI 的基本原理，知道 AI 是谁，从哪里来。本讲主要讲怎么用 AI 最有效，应该怎么跟 AI 交流。AI 就像一个聪明博学的人，它的知识很丰富，但不一定能马上理解你的问题。如果你问得不清楚，AI
    可能会给你一个不准确的答案。提示词就是你和 AI 交流的方式。学会正确使用提示词，就能让 AI 更好地理解你的需求，并给出更有用的答案。


    ### 4.1 提示词工程：与 AI 对话的技巧


    提示词工程（prompt engineering）主要研究如何向 AI 提出最合适的问题，让 AI 给出最精准的答案。提示词工程很重要，如果你的问题太模糊，AI
    可能会出现以下几种情况。


    - (1) 答非所问：你想让 AI 讲太空知识，它却给你讲了一个科幻故事。

    - (2) 回答不完整：你想让 AI 总结一篇文章，它可能只总结了一半。

    - (3) 编造错误信息：AI 可能会自己“想象”一个答案，而不是给出事实。


    但是，如果你用正确的提示词，就能让 AI 准确理解你的意思，给出最合适的回答。接下来我们一起学习提示词吧。


    ### 4.2 CO-STAR 框架：提示词的万能公式


    CO-STAR 提示词框架是一个帮助人们更好地与 AI 沟通的工具，就像给朋友讲故事一样，需要把每个细节讲清楚。它包含以下 6 个关键部分。


    - 1. 背景（ context ）


    就像讲故事需要先说“时间”“地点”“人物”一样，你需要告诉 AI 任务的背景。比如，你想让 AI 帮你写一篇关于小狗的文章，就要说：“我家小狗叫旺财，它喜欢追蝴蝶，但每次都会撞到树上。”


    这样 AI 就知道要围绕旺财的故事来写了。


    - 2. 目标 ( objective )


    你要明确告诉 AI，你想让它做什么、什么样的事情很重要。比如：


    “请写一篇有趣的文章，中心是告诉大家‘做事不能太着急’。”这样 AI 就不会跑题，去写 “小狗吃骨头” 了。


    - 3. 风格 ( style )


    就像画画可以选择蜡笔或水彩笔一样，你需要告诉 AI 你喜欢什么样的表达方式。比如：“用《小猪佩奇》讲故事的语气，加点搞笑对话！” AI 就会写出旺财追蝴蝶撞树的搞笑情节。


    - 4. 语调 ( tone )


    你需要告诉 AI 说话的语气是开心的、严肃的，还是像朋友聊天一样，等等。比如：“结尾用鼓励的话！”


    AI 就会写：“虽然旺财失败了，但它还是笑咪咪的——努力的过程更重要！”


    - 5. 受众 ( audience )


    你需要说明文章是给谁看的。比如：“这篇文章是给 8 岁的小学生看的。”AI 就不会用“生物学分析小狗行为”这种难懂的话，而是用简单有趣的语言。


    - 6. 响应 ( response )


    你需要规定答案的格式，就像乐高说明书教你怎么拼搭一样。比如：“分成 3 个小故事，每段不超过 5 句话，加一个搞笑标题！” AI 就会生成《旺财的“飞天”计划》这样的结构。


    下面举例说明。


    假设你想让 AI 帮妈妈写一篇朋友圈文案，宣传她做的蛋糕，具体如下。


    背景：妈妈的蛋糕店叫“甜甜屋”，新推出草莓奶油蛋糕。


    目标：吸引邻居们来店里买蛋糕。


    风格：用朋友推荐的口吻，比如：“我尝过，超好吃！”


    语调：热情、亲切。


    受众：邻居阿姨和小朋友。


    响应：写一段话，配上表情符号和蛋糕图片。


    AI 就会生成：


    邻居们快看！“甜甜屋”新出的草莓奶油蛋糕太棒啦！松软的蛋糕加上甜甜的草莓，我家孩子一口气吃了两块！现在购买还送可爱蜡烛哦 ~ 快来试试吧！


    接下来我们看看使用 CO-STAR 提示词框架后的实际成果吧。


    ### 场景一：教育领域


    案例：一位老师希望 AI 帮助编写适合五年级小学生的科学课程内容。


    背景（context）：五年级科学课程，主题是太阳系。


