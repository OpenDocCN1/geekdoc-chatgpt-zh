    # 2. 发现音乐中的数学规律


    AI 会发现，很多好听的歌曲，都有某些固定的旋律和节奏。例如，很多流行歌的和弦进程是 Do-Sol-La-Fa，它们的音高之间有一定的数学关系。许多节奏都是四拍一循环，比如“咚咚咚咚”这样的重复模式。


    这些发现，就像在数学课上找到解题的公式一样，有了这些公式，AI 就可以自己创造新的音乐了。


    # 3. 自己尝试作曲


    学会了音乐中的数学规律之后，AI 就会自己尝试创作。例如，它会先选择一个节奏，比如慢一点的或者快一点的。再选择一套数学上和谐的音符，让旋律听起来流畅。再加入一些变化，让它不只是简单地重复，而是有起伏、有情绪的。这就像用数字做游戏，AI
    在音乐的世界里拼积木，把每个音符都放在合适的地方，让它变成一首完整的歌。


