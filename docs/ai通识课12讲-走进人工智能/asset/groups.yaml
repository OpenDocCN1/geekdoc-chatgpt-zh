    # 10.3 量子 AI：算力突破物理极限


    你知道我们平时用的计算机是怎么计算的吗？传统的计算机就像一个'
  - '[PAGE 229]


    超级快的算盘，它只能用 0 或 1（就像开关的 “开” 和 “关”）来存储和处理信息。但量子计算机可不一样，它的核心是 “量子比特”（Qubit），它不仅能是
    0，也能是 1，甚至可以同时是 0 和 1，就像一个神奇的魔术球，同时朝不同方向转动，能让计算机同时处理很多计算任务，比传统计算机快得多。


    # 1. 量子计算机和普通计算机的区别


    普通计算机：像一条很窄的马路，车子（计算任务）必须一辆一辆地走，还会经常堵车。


    量子计算机：就像有无数条车道的高速公路，车子可以同时跑，速度超级快。


    举个例子，假设你在一本超级厚的词典里找一个单词，普通计算机可能需要一页一页地翻，半天也查不到，而量子计算机可以一次翻好多页，很快就能找到。


    但是量子计算机很难做，量子比特就像超级薄的泡泡，一点点外界干扰（比如温度、噪声）都会让它 “破掉”，也就是计算出错。所以，科学家需要在超级低温（接近绝对零度）环境下选择特殊的材料才能让量子计算机正常工作。


    比如，微软公司研发的玛约拉纳 1（Majorana 1）量子芯片，就像给泡泡加了 “保护罩”，让它更稳定，不容易被打破。


    那么 AI 能帮量子计算机变得更厉害吗？


    当然可以。AI 就像量子计算机的 “小老师”，可以使它更聪明、更稳定，减少计算错误。


    # 2. AI 可以帮助量子计算机做哪些事情


    （1）调整量子比特，让计算更精准——就像给钢琴调音，让声音更准。'
  - '[PAGE 230]


    +   (2) 自动纠错，让计算不出错——就像打字时自动修改拼写错误。


    +   (3) 设计更好的量子算法——帮助量子计算机更快解决复杂问题。


    # 3. 量子计算机能让 AI 变得更聪明吗


