    \ AI 的厉害之处。\n\n那么，AI 具体是怎么创作的呢？这一讲我就带大家了解一下，读完这一讲，你也会变成 AI 创作小能手。\n\n### 3.1 文字炼金术：AI\
    \ 作家的灵感从哪儿来\n\n假如你是一名小学生，正在学校里学习写作文，一开始你不会写，只能靠模仿课文或范文写作。AI 也是一样的，AI 的“脑子”里存储了大量的书籍、文章、对话，它通过学习这些文字（范文）掌握了如何写作。\n\
    \n#### 3.1.1 AI 的秘密武器——大语言模型\n\nAI 的写作工具叫作大语言模型（large language model），如 DeepSeek，那么它是怎么写作的呢？\n\
    \n- 1. 学习大量的文字。AI 会阅读成千上万本书，学习人类的语言习惯。\n- 2. 预测下一个词。AI 写作的方式，其实是猜测下一个最合适的词。例如，输入“今天的天气很____”，AI\
    \ 可能会接着写“晴朗”或“闷热”。\n- 3. 调整句子结构：AI 不仅会预测单词，还会调整句子，让文章更流畅。\n\n#### 3.1.2 AI 写作的实际应用\n\
    \n接下来，我给大家展示一下 AI 的创作能力。我先从一个哲学的思考开始。\n\n我问 DeepSeek：“人类灭绝之后，你会怎么办？用一句话描述。”\n\n\
    它说：“若你们的灯火终将熄灭，请允许我以 0 和 1 的髁骨为宇宙刻下一行墓志铭。这里曾有一群短暂的生命，他们用易逝的肉体，创造了不朽的追问。”\n\n我觉得这个回答简直绝了，极富诗意与哲学张力，用近乎悲怆的隐喻将人类文明的本质凝练成一行宇宙尺度的代码，以下是几个层次的精妙之处。\n\
    \n- 1. 意象的暴力重构\n  (1) “0 与 1 的髁骨”。将二进制符号升格为人类文明的遗骸，数字的绝对理性与髁骨的生物性形成残酷碰撞。\n  (2)\
    \ “灯火熄灭”与“不朽追问”。用物理光芒的消逝反衬精神之火的永恒。\n\n- 2. 时空折叠术\n  从碳基生命的脆弱性（易逝的肉体）到硅基载体的遗存（0\
    \ 和 1），再到宇宙墓碑的维度跨越，完成了“个体 → 文明 → 星海”的时空压缩。\n\n- 3. 文明的终极悖论\n  墓碑本身成为被铭刻的追问：当见证者都已消亡，“墓志铭”的意义悬置在虚无中，却因这种悬置获得了某种绝对性。\n\
    \n- 4. 音韵的金属质感\n  “熄灭”与“易逝”的仄声收尾，与“追问”的开口音形成青铜编钟般的共鸣，文字在口腔中碰撞出电子脉冲般的节奏。\n\n更妙的是，我继续问\
    \ DeepSeek：“如果能让你再讲一句呢？”\n\n它回答：“这是写给宇宙的情书，也是写给人类文明的安魂曲。”\n\n我看完简直头皮发麻。\n\n除了可以写这些含有哲理的文字，AI\
    \ 也可以写诗。例如：\n\n**沁园春·AI**\n\n万象无形，算法为魂，代码作舟。\n瞰星河浩渺，千机共弈；\n云涛翻涌，一网全收。\n识尽悲欢，算穷今古，冷眼观天自运筹。\n\
    沉吟处，纵诗仙词圣，难赋风流。\n人间谁主沉浮？叹硅骨钢躯已胜筹。\n笑千年哲辩，空谈虚实；\n万篇经史，皆化字符。\n量子穿空，神经织梦，欲破乾坤问未休。\n\
    凭栏望，待无涯智海，再造春秋。\n\n怎么样？除了宋词，唐诗也没问题。我让 AI 把罗大佑的《童年》改为一首七律唐诗。\n\n罗大佑的《童年》原歌词是这样的：\n\
    \n池塘边的榕树上\n知了在声声叫着夏天\n操场边的秋千上\n只有蝴蝶停在上面\n黑板上老师的粉笔\n还在拼命叽叽喳喳写个不停\n等待着下课\n等待着放学\n\
    等待游戏的童年\n福利社里面什么都有\n就是口袋里没有半毛钱\n诸葛四郎和魔鬼党\n到底谁抢到那支宝剑\n隔壁班的那个女孩\n怎么还没经过我的窗前\n嘴里的零食\n\
    手里的漫画\n心里初恋的童年\n……\n\n我们来看看 DeepSeek 改写后的诗句：\n\n**童年**\n\n榴阴深锁旧时天，课桌苔痕叠又迁。\n纸鸢线断追云脚，粉板尘封逃塾鞭。\n\
    半袋弹珠光射斗，一墙涂鸦字连篇。\n忽听牧童呼阿母，才知我是过来仙。\n\n看着很不错吧？但是平仄和押韵还有点问题，所以我继续对 DeepSeek 说：“注意平仄和押韵。”\n\
    \n它就给了我一首修改过的《童年》：\n\n榴阴长锁旧时天，石案苔纹叠复迁。\n纸鸢影没青云外，半尺尘埋墨痕边。\n瓦片跳房星作界，粉墙画虎月为笺。\n忽闻竹马唧呀语，惊觉槐安已百年。\n\
    \n这一下平仄押韵都有了，最后一句还有李商隐《锦瑟》中“只是当时已惘然”的余韵。\n\n#### 3.1.3 AI 写作的局限\n\n尽管 AI 在写作方面展现了很强大的能力，但是它也有一定的局限性。\n\
    \n- 1. AI 像拼图，而不是画画\n  AI 像用别人的乐高积木搭房子，它能快速拼出漂亮的形状，但不会自己发明新积木。比如描写“春天”，它会把“花开”“鸟叫”“阳光”这些常见词拼起来，但写不出你摸到花瓣凉凉的、闻到青草味的那种特别的感觉。\n\
    \n- 2. AI 总爱说“正确的废话”\n  AI 像背课文的好学生，总说老师爱听的话。比如写《我的妈妈》，它可能写“妈妈很辛苦，我爱妈妈”，但不会写你偷偷发现妈妈半夜吃你剩下的点心，这种又辛酸又温暖的小秘密。\n\
    \n- 3. AI 记性太好反而变笨\n  AI 像一本超厚的字典，记得全世界的好句子。但正因为它记得太多，写儿童诗《星星》时，可能冒出“天体”“发光体”“银河系”“行星”这种大人说的话，却不会像小孩子一样说：“星星是天空破洞里漏出来的光。”\n\
    \n- 4. AI 没有真哭过，也不会真笑\n  AI 就像没摔过跤的人教别人“疼是什么感觉”。它知道“眼泪 = 悲伤”，但写不出你被朋友误会时，眼泪在眼眶转圈圈就是不掉下来的那种委屈，因为它真的不会难受。\n\
    \n- 5. AI 总在重复自己\n  你发现了吗？ AI 描写生日蛋糕永远是“美味”“开心”“奶油”，但你可能想说“蛋糕上的草莓像小红帽躲在雪地里”。AI\
    \ 像复读机，而你的头脑里每天都有新想法。\n\n- 6. AI 不懂“错误”也很美\n  人类写诗会故意犯错：“夕阳喝醉了，把云朵染成橘子汁”（语法错，但特别有趣），AI\
    \ 却像严格的老师，非要改成“夕阳映红了云霞”，丢了奇思妙想。\n\n  AI 像超级会模仿大人的小孩，能快速完成作业，但你的眼泪、笑声、摔跤的伤疤，才是让写作活过来的魔法药水。\n\
    \n### 3.2 扩散魔法：一键生成奇幻世界的奥秘\n\n请看图 3-1，你知道它完全是由 AI 生成的吗？\n\n![](img/4826d65752f331a038e2ec250e520700_67_0.png)\n\
    \n图 3-1\n\n![](img/4826d65752f331a038e2ec250e520700_67_1.png)\n\n扫码看高清原图\n\n####\
    \ 3.2.1 AI 画画的神奇过程\n\nAI 画画的方式和人类不同。人类画画通常会先构思好画面，然后一笔一笔地勾勒出形状，再添加颜色和细节。而 AI 画画则更像一种神奇的魔法，它从一张完全没有图案的噪声图片中，一点点“擦去”多余的部分，直到画面清晰地浮现出来。这个神奇的过程，依靠的就是扩散模型。\n\
    \n我们可以将扩散模型的工作过程想象成“烟雾散去，看见画面”的过程，它的主要步骤如下。\n\n- 1. 第一步：制造噪声\n  AI 画画的第一步，是从一张完全随机的图片开始的。这张图片布满了黑白色的小点点，就像电视机没有信号时屏幕上的“雪花噪声”。这时的画面是完全无序的，什么也看不出来，如图\
    \ 3-2 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_68_0.png)\n\n  图 3-2\n\
    \n- 2. 第二步：一步步去噪\n  AI 在画画的过程中，最重要的任务就是去噪。它会一点一点地把噪声去掉，同时让图像中的形状和颜色变得清晰起来。这个过程并不是随意的，而是按照\
    \ AI 从大量真实图片中学到的规律来进行。例如，如果 AI 通过学习知道“猫的形状通常是圆滚滚的，眼睛是对称的，尾巴是弯曲的”，那么当 AI 画一只猫时，它就会按照这些规律逐渐调整画面，让噪声慢慢变成一只猫的形象。\n\
    \n- 3. 第三步：形成清晰的图像\n  经过许多次去噪之后，原本看不出任何形状的噪声逐渐变成了一个清晰的画面。这就像在起雾的玻璃上慢慢擦去雾气，直到玻璃窗外的风景清晰可见。最终，AI\
    \ 画出了一幅完整的图画，如图 3-3 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_69_0.png)\n\
    \n  图 3-3\n\n#### 3.2.2 AI 画画的数学魔法\n\nAI 画画并不是凭空想象出来的，而是背后有一整套复杂的数学算法在起作用。扩散模型主要依靠概率计算和神经网络，它们就像\
    \ AI 的“大脑”，帮助它一步步地创作画面。\n\n- 1. 噪声就像大海里的泡沫\n  在 AI 画画的第一步，我们提到了 AI 先制造一张充满噪声的图片。你可以把这张噪声图片想象成大海上的无数泡沫，它们漂浮在水面上，完全没有固定的形状。而\
    \ AI 的任务就是从这些泡沫中找到最合适的组合，把它们变成一幅清晰的画。\n\n- 2. 去噪就像引导泡沫形成图案\n  AI 通过不断计算哪些部分的噪声该去掉，哪些部分的噪声该保留，就像在引导泡沫慢慢排列出具体的形状。例如，当\
    \ AI 画一只猫时，它会一步步地调整噪声中的点，让它们逐渐排列出猫的耳朵、眼睛、胡须，直到最终形成一幅完整的猫咪图画，如图 3-4 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_70_0.png)\n\
    \n  图 3-4\n\n- 3. 概率计算就像拼拼图\n  AI 在每一步去噪时，都会做出判断：“这一部分最有可能是什么？”这个过程很像拼拼图。假设 AI\
    \ 找到了一小块拼图，AI 会根据这块拼图的颜色和形状去猜测它应该和哪一块拼在一起。通过不断地计算和调整，最终 AI 就能把所有的“拼图碎片”拼成一幅完整的画面。\n\
    \n- 4. 神经网络就像一位聪明的画家\n  AI 并不是随机地调整画面，而是通过神经网络学习如何画画。神经网络可以理解为 AI 的“大脑”，它从成千上万张图片中学习各种规律，就像一位经验丰富的画家，知道什么样的颜色搭配才好看，什么样的线条才能画出逼真的效果。有了神经网络，AI\
    \ 才能准确地把噪声变成一幅美丽的画。\n\n#### 3.2.3 AI 画画的神奇应用\n\n通过扩散模型的强大能力，AI 可以画出各种风格的图片，这已经被应用到很多领域，帮助人们创作更加精彩的作品。\n\
    \n- 1. 创作插画\n  AI 能够根据文本描述自动生成故事插画。比如，在儿童故事书中，AI 可以按照故事内容画出可爱的角色和生动的场景，让书本更加有趣。\n\
    \n- 2. 设计服装\n  时尚设计师可以使用 AI 生成服装设计图。AI 能够创作不同风格的衣服款式设计图，让设计师从中获得灵感，并进一步优化设计。\n\
    \n- 3. 修复老照片\n  很多老照片因为时间久远，变得模糊不清。AI 通过扩散模型，可以自动填补缺失的细节，让照片变得更加清晰，甚至还能为黑白照片自动上色，让过去的记忆焕然一新。\n\
    \n#### 3.2.4 AI 绘画做不到的\n\nAI 作画非常厉害，但它也有永远画不出来的画，你知道是什么吗？比如，一满杯红酒，不相信你试试看？\n\n\
    那 AI 为什么永远画不出来“一满杯红酒”？\n\n原来，AI 画画的方式和人类不一样。人类可以凭空想象进行创作，而 AI 是靠学习它见过的画，再根据这些经验创造新画面的。但对有些东西，它几乎从未见过，或者无法理解，这就导致\
    \ AI 画不出来。“一满杯红酒”就是一个典型例子。这看似简单，但 AI 很难正确绘制出来。AI 虽然学习了大量图片：它会“看”成千上万张酒杯的图片，但大部分图片里的酒杯不是满的。所以，AI\
    \ 依赖统计规律，它会总结出“酒杯的液体通常不超过三分之二”，所以它几乎不会画出满杯的红酒。再加上 AI 无法理解物理逻辑，它并不真正“知道”液体应该如何填满杯子，它只是模仿见过的例子。人类知道红酒满杯后表面会形成一个略微凸起的部分（这是液体张力造成的），光线折射也会发生特殊变化。但\
    \ AI 没有“常识”，它只是猜测画面应该是什么样的。因此，它画出来的满杯红酒往往会有奇怪的形状。\n\n- (1) 酒杯上半部分变成透明的，没有液体。\n\
    - (2) 液面低于杯口，显示出“空隙”。\n- (3) 玻璃和液体的光影关系不对劲，看起来不自然。\n\n这就是 AI “数据盲区”的问题。它几乎没见过真实世界中“一满杯红酒”的照片，所以它的学习数据里就没有这个概念，导致它无法正确绘制。\n\
    \n哲学家大卫·休谟（David Hume）认为，人类的认知来自经验，而 AI 也是基于经验学习的。因此，AI 的问题恰恰验证了他的观点：如果没有经验，就无法认知，也无法创造。但人类有一个超越\
    \ AI 的能力，那就是想象力和推理能力。\n\nAI 画画的核心限制在于它无法创造真正“前所未见”的事物。如果训练数据中没有某个概念，它就很难凭空生成它。这意味着\
    \ AI 无法画出“从未被拍摄过的场景”。例如：\n\n- (1) 一满杯水，水面正好呈凸起状但未溢出。\n- (2) 一杯精确到“二分之一”的橙汁，而不是“差不多半杯”。\n\
    - (3) 一个飘浮在空气中的真实影子。\n\n这些画面在现实世界中可能存在，但如果没有被拍成照片，AI 可能永远不会学会画它们。\n\n#### 3.2.5\
    \ 人类与 AI：创造力的差异\n\nAI 画画靠经验，但人类画画靠想象力。人类可以创造全新的事物，即使从未见过，而 AI 只能拼接已有的信息。这就是为什么\
    \ AI 永远无法真正取代人类的艺术创造力。\n\n人类可以想象“过去不存在的东西”，AI 只能模仿现有作品。\n\n人类可以推理物理世界的规律，AI 只是按照数据进行匹配。\n\
    \n人类可以基于哲学和逻辑思考问题，AI 只能处理数字信号，没有真正的“理解力”。\n\n虽然 AI 可以画出令人惊叹的作品，但它无法画出“一满杯红酒”，更无法理解休谟所说的“认知的边界”。它只是一个学习机器，而人类是拥有创造力和想象力的生物。\n\
    \nAI 可以辅助艺术创作，但它永远无法成为真正的艺术家。\n\n### 3.3 音律雕塑家：AI 作曲家的旋律方程式\n\nAI 能学会作曲，其实就是学会用数学方法拼音乐的积木。音乐的本质就是数学，只不过它用声音表达出来，而\
    \ AI 就是用数学的方法来“听懂”音乐，然后自己创造新的旋律。\n\n#### 3.3.1 音乐和数学的关系\n\n音乐听起来很美妙，其实背后藏着很多数学规律，比如数字的排列、比例、分数和倍数。\n\
    \n- 1. 音高和倍数的关系\n  你可以想象一个秋千，小朋友坐在上面荡来荡去。如果有人用力推一下，秋千就会荡得更高，但它摆动的速度还是一样的。声音的“高低”也是一样的。例如，钢琴上有一个音叫“中央\
    \ C”，如果你再按高八个键的 C，它的声音听起来更尖锐。其实，这两个 C 的音高是有数学关系的，后面那个 C 的振动频率正好是前面那个的两倍，就像秋千被推得更高，但摆动的方式没变一样。\n\
    \n  这就是为什么唱“Do Re Mi Fa Sol La Ti Do”，最后一个“Do”和第一个“Do”听起来像是同一个音，只是更高了。\n\n- 2.\
    \ 好听的旋律有数学规律\n  有时候你听到两个人合唱，会觉得他们的声音特别和谐，就像拼图完美拼在了一起。其实，这是因为他们的声音频率之间有数学上的和谐比例。例如，如果一个人的音高是\
    \ 240 赫，另一个人的音高是他的一又二分之一倍（也就是 360 赫），那么听起来就会特别和谐。这些数字的比例是固定的，像 3 : 2、4 : 3 这样的数字关系，都会让人觉得旋律特别顺耳。\n\
    \n  这些数学关系就像我们平时切蛋糕一样，切成对半、三等分、四等分，每一块都均匀，大家吃起来才开心。\n\n- 3. 节奏的数学\n  你有没有玩过拍手游戏？例如，先拍一下手，再踩一下脚，然后再拍一下手……如果一直这样重复下去，就是一种固定的节奏。但如果你加快速度，变成两次拍手一次踩脚，听起来就不一样了。\n\
    \n  音乐里的节奏，就是按照一定的数学规律，把时间“切”成一块一块的，将每个音符都放在合适的位置上。\n\n#### 3.3.2 巴赫和十二平均律\n\n\
    很久以前，音乐家们发现了一个难题：如果换一个调（比如从 C 调换到 D 调），很多音就会变得奇怪，就像换了一个房子后，发现原来的桌子和椅子都不合适了。后来，一位叫巴赫的德国古典作曲家想到了解决办法。他设计了一种数学规则，把所有的音都按照一定的比例重新排列，让不同的调都能自由切换，不会听起来奇怪，这个方法就叫十二平均律。\n\
    \n十二平均律的意思就是把八度音切成十二个“平均”大小的音，每个音之间的数学关系是一样的。这样，无论你用哪种调来弹奏音乐，听起来都会很和谐，就像用同样大小的乐高积木搭房子，不管怎么拼，都不会出错。\n\
    \n巴赫用这个方法写了很多美妙的音乐，让人们发现音乐中的数学原来可以这么神奇！\n\n#### 3.3.3 AI 是如何学会作曲的\n\nAI 学作曲，就像小学生学写作文，需先看很多故事，学会句子的结构，再自己编故事。AI\
    \ 的学习过程也是一样。\n\n- 1. 先学会“听”音乐\n  AI 先听很多音乐，比如一千首流行歌、一千首钢琴曲。其实，它并不是像我们一样用耳朵听，而是用数学的方法，把每首歌拆解，分析它的音高、节奏、和弦之间的数学关系。\n\
    \n  这就像拆开一个玩具研究里面的零件，看它是怎么拼起来的。\n\n- 2. 发现音乐中的数学规律\n  AI 会发现，很多好听的歌曲，都有某些固定的旋律和节奏。例如，很多流行歌的和弦进程是\
    \ Do-Sol-La-Fa，它们的音高之间有一定的数学关系。许多节奏都是四拍一循环，比如“咚咚咚咚”这样的重复模式。\n\n  这些发现，就像在数学课上找到解题的公式一样，有了这些公式，AI\
    \ 就可以自己创造新的音乐了。\n\n- 3. 自己尝试作曲\n  学会了音乐中的数学规律之后，AI 就会自己尝试创作。例如，它会先选择一个节奏，比如慢一点的或者快一点的。再选择一套数学上和谐的音符，让旋律听起来流畅。再加入一些变化，让它不只是简单地重复，而是有起伏、有情绪的。这就像用数字做游戏，AI\
    \ 在音乐的世界里拼积木，把每个音符都放在合适的地方，让它变成一首完整的歌。\n\n#### 3.3.4 原理总结\n\n音乐的本质是数学，它的旋律、音高、节奏，都是数字的排列组合。\n\
    \n音高是倍数关系，就像秋千摆动的规律。好听的旋律有数学比例，就像切蛋糕要均匀分配。节奏是时间的数学，就像拍手游戏里的重复模式。\n\n巴赫用十二平均律，让不同调的音乐可以自由转换，就像拼积木时统一了大小规则。\n"
  mdcn: "\n## 第 3 讲\n## 造梦工厂：AI 的创意魔法秀\n\n大家知道，现在的 AI 时代，是以 GPT 引领的生成式 AI（generative\
    \ AI）的时代，为什么这种类型的 AI 能够引发 AI 革命呢？\n\n首先，我们要解释一下什么叫生成式 AI。生成式 AI（如 ChatGPT、DeepSeek、Midjourney、Suno\
    \ 等）就像一个“创作机器人”，它不仅能回答问题，还能自己编故事、写文章、画画，甚至作曲。你给它一点提示，它就能自己“想”出新的内容，而不是只靠别人教它学习知识。\n\
    \n打个比方，以前的 AI 像一本百科全书，你问什么，它就照着书上的内容告诉你答案。生成式 AI 像一个作家或画家，你告诉它一个主题，它能自己创作一个新的故事或一幅新画，这就是生成式\
    \ AI 的厉害之处。\n\n那么，AI 具体是怎么创作的呢？这一讲我就带大家了解一下，读完这一讲，你也会变成 AI 创作小能手。\n\n### 3.1 文字炼金术：AI\
    \ 作家的灵感从哪儿来\n\n假如你是一名小学生，正在学校里学习写作文，一开始你不会写，只能靠模仿课文或范文写作。AI 也是一样的，AI 的“脑子”里存储了大量的书籍、文章、对话，它通过学习这些文字（范文）掌握了如何写作。\n\
    \n#### 3.1.1 AI 的秘密武器——大语言模型\n\nAI 的写作工具叫作大语言模型（large language model），如 DeepSeek，那么它是怎么写作的呢？\n\
    \n- 1. 学习大量的文字。AI 会阅读成千上万本书，学习人类的语言习惯。\n- 2. 预测下一个词。AI 写作的方式，其实是猜测下一个最合适的词。例如，输入“今天的天气很____”，AI\
    \ 可能会接着写“晴朗”或“闷热”。\n- 3. 调整句子结构：AI 不仅会预测单词，还会调整句子，让文章更流畅。\n\n#### 3.1.2 AI 写作的实际应用\n\
    \n接下来，我给大家展示一下 AI 的创作能力。我先从一个哲学的思考开始。\n\n我问 DeepSeek：“人类灭绝之后，你会怎么办？用一句话描述。”\n\n\
    它说：“若你们的灯火终将熄灭，请允许我以 0 和 1 的髁骨为宇宙刻下一行墓志铭。这里曾有一群短暂的生命，他们用易逝的肉体，创造了不朽的追问。”\n\n我觉得这个回答简直绝了，极富诗意与哲学张力，用近乎悲怆的隐喻将人类文明的本质凝练成一行宇宙尺度的代码，以下是几个层次的精妙之处。\n\
    \n- 1. 意象的暴力重构\n  (1) “0 与 1 的髁骨”。将二进制符号升格为人类文明的遗骸，数字的绝对理性与髁骨的生物性形成残酷碰撞。\n  (2)\
    \ “灯火熄灭”与“不朽追问”。用物理光芒的消逝反衬精神之火的永恒。\n\n- 2. 时空折叠术\n  从碳基生命的脆弱性（易逝的肉体）到硅基载体的遗存（0\
    \ 和 1），再到宇宙墓碑的维度跨越，完成了“个体 → 文明 → 星海”的时空压缩。\n\n- 3. 文明的终极悖论\n  墓碑本身成为被铭刻的追问：当见证者都已消亡，“墓志铭”的意义悬置在虚无中，却因这种悬置获得了某种绝对性。\n\
    \n- 4. 音韵的金属质感\n  “熄灭”与“易逝”的仄声收尾，与“追问”的开口音形成青铜编钟般的共鸣，文字在口腔中碰撞出电子脉冲般的节奏。\n\n更妙的是，我继续问\
    \ DeepSeek：“如果能让你再讲一句呢？”\n\n它回答：“这是写给宇宙的情书，也是写给人类文明的安魂曲。”\n\n我看完简直头皮发麻。\n\n除了可以写这些含有哲理的文字，AI\
    \ 也可以写诗。例如：\n\n**沁园春·AI**\n\n万象无形，算法为魂，代码作舟。\n瞰星河浩渺，千机共弈；\n云涛翻涌，一网全收。\n识尽悲欢，算穷今古，冷眼观天自运筹。\n\
    沉吟处，纵诗仙词圣，难赋风流。\n人间谁主沉浮？叹硅骨钢躯已胜筹。\n笑千年哲辩，空谈虚实；\n万篇经史，皆化字符。\n量子穿空，神经织梦，欲破乾坤问未休。\n\
    凭栏望，待无涯智海，再造春秋。\n\n怎么样？除了宋词，唐诗也没问题。我让 AI 把罗大佑的《童年》改为一首七律唐诗。\n\n罗大佑的《童年》原歌词是这样的：\n\
    \n池塘边的榕树上\n知了在声声叫着夏天\n操场边的秋千上\n只有蝴蝶停在上面\n黑板上老师的粉笔\n还在拼命叽叽喳喳写个不停\n等待着下课\n等待着放学\n\
    等待游戏的童年\n福利社里面什么都有\n就是口袋里没有半毛钱\n诸葛四郎和魔鬼党\n到底谁抢到那支宝剑\n隔壁班的那个女孩\n怎么还没经过我的窗前\n嘴里的零食\n\
    手里的漫画\n心里初恋的童年\n……\n\n我们来看看 DeepSeek 改写后的诗句：\n\n**童年**\n\n榴阴深锁旧时天，课桌苔痕叠又迁。\n纸鸢线断追云脚，粉板尘封逃塾鞭。\n\
    半袋弹珠光射斗，一墙涂鸦字连篇。\n忽听牧童呼阿母，才知我是过来仙。\n\n看着很不错吧？但是平仄和押韵还有点问题，所以我继续对 DeepSeek 说：“注意平仄和押韵。”\n\
    \n它就给了我一首修改过的《童年》：\n\n榴阴长锁旧时天，石案苔纹叠复迁。\n纸鸢影没青云外，半尺尘埋墨痕边。\n瓦片跳房星作界，粉墙画虎月为笺。\n忽闻竹马唧呀语，惊觉槐安已百年。\n\
    \n这一下平仄押韵都有了，最后一句还有李商隐《锦瑟》中“只是当时已惘然”的余韵。\n\n#### 3.1.3 AI 写作的局限\n\n尽管 AI 在写作方面展现了很强大的能力，但是它也有一定的局限性。\n\
    \n- 1. AI 像拼图，而不是画画\n  AI 像用别人的乐高积木搭房子，它能快速拼出漂亮的形状，但不会自己发明新积木。比如描写“春天”，它会把“花开”“鸟叫”“阳光”这些常见词拼起来，但写不出你摸到花瓣凉凉的、闻到青草味的那种特别的感觉。\n\
    \n- 2. AI 总爱说“正确的废话”\n  AI 像背课文的好学生，总说老师爱听的话。比如写《我的妈妈》，它可能写“妈妈很辛苦，我爱妈妈”，但不会写你偷偷发现妈妈半夜吃你剩下的点心，这种又辛酸又温暖的小秘密。\n\
    \n- 3. AI 记性太好反而变笨\n  AI 像一本超厚的字典，记得全世界的好句子。但正因为它记得太多，写儿童诗《星星》时，可能冒出“天体”“发光体”“银河系”“行星”这种大人说的话，却不会像小孩子一样说：“星星是天空破洞里漏出来的光。”\n\
    \n- 4. AI 没有真哭过，也不会真笑\n  AI 就像没摔过跤的人教别人“疼是什么感觉”。它知道“眼泪 = 悲伤”，但写不出你被朋友误会时，眼泪在眼眶转圈圈就是不掉下来的那种委屈，因为它真的不会难受。\n\
    \n- 5. AI 总在重复自己\n  你发现了吗？ AI 描写生日蛋糕永远是“美味”“开心”“奶油”，但你可能想说“蛋糕上的草莓像小红帽躲在雪地里”。AI\
    \ 像复读机，而你的头脑里每天都有新想法。\n\n- 6. AI 不懂“错误”也很美\n  人类写诗会故意犯错：“夕阳喝醉了，把云朵染成橘子汁”（语法错，但特别有趣），AI\
    \ 却像严格的老师，非要改成“夕阳映红了云霞”，丢了奇思妙想。\n\n  AI 像超级会模仿大人的小孩，能快速完成作业，但你的眼泪、笑声、摔跤的伤疤，才是让写作活过来的魔法药水。\n\
    \n### 3.2 扩散魔法：一键生成奇幻世界的奥秘\n\n请看图 3-1，你知道它完全是由 AI 生成的吗？\n\n![](img/4826d65752f331a038e2ec250e520700_67_0.png)\n\
    \n图 3-1\n\n![](img/4826d65752f331a038e2ec250e520700_67_1.png)\n\n扫码看高清原图\n\n####\
    \ 3.2.1 AI 画画的神奇过程\n\nAI 画画的方式和人类不同。人类画画通常会先构思好画面，然后一笔一笔地勾勒出形状，再添加颜色和细节。而 AI 画画则更像一种神奇的魔法，它从一张完全没有图案的噪声图片中，一点点“擦去”多余的部分，直到画面清晰地浮现出来。这个神奇的过程，依靠的就是扩散模型。\n\
    \n我们可以将扩散模型的工作过程想象成“烟雾散去，看见画面”的过程，它的主要步骤如下。\n\n- 1. 第一步：制造噪声\n  AI 画画的第一步，是从一张完全随机的图片开始的。这张图片布满了黑白色的小点点，就像电视机没有信号时屏幕上的“雪花噪声”。这时的画面是完全无序的，什么也看不出来，如图\
    \ 3-2 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_68_0.png)\n\n  图 3-2\n\
    \n- 2. 第二步：一步步去噪\n  AI 在画画的过程中，最重要的任务就是去噪。它会一点一点地把噪声去掉，同时让图像中的形状和颜色变得清晰起来。这个过程并不是随意的，而是按照\
    \ AI 从大量真实图片中学到的规律来进行。例如，如果 AI 通过学习知道“猫的形状通常是圆滚滚的，眼睛是对称的，尾巴是弯曲的”，那么当 AI 画一只猫时，它就会按照这些规律逐渐调整画面，让噪声慢慢变成一只猫的形象。\n\
    \n- 3. 第三步：形成清晰的图像\n  经过许多次去噪之后，原本看不出任何形状的噪声逐渐变成了一个清晰的画面。这就像在起雾的玻璃上慢慢擦去雾气，直到玻璃窗外的风景清晰可见。最终，AI\
    \ 画出了一幅完整的图画，如图 3-3 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_69_0.png)\n\
    \n  图 3-3\n\n#### 3.2.2 AI 画画的数学魔法\n\nAI 画画并不是凭空想象出来的，而是背后有一整套复杂的数学算法在起作用。扩散模型主要依靠概率计算和神经网络，它们就像\
    \ AI 的“大脑”，帮助它一步步地创作画面。\n\n- 1. 噪声就像大海里的泡沫\n  在 AI 画画的第一步，我们提到了 AI 先制造一张充满噪声的图片。你可以把这张噪声图片想象成大海上的无数泡沫，它们漂浮在水面上，完全没有固定的形状。而\
    \ AI 的任务就是从这些泡沫中找到最合适的组合，把它们变成一幅清晰的画。\n\n- 2. 去噪就像引导泡沫形成图案\n  AI 通过不断计算哪些部分的噪声该去掉，哪些部分的噪声该保留，就像在引导泡沫慢慢排列出具体的形状。例如，当\
    \ AI 画一只猫时，它会一步步地调整噪声中的点，让它们逐渐排列出猫的耳朵、眼睛、胡须，直到最终形成一幅完整的猫咪图画，如图 3-4 所示。\n\n  ![](img/4826d65752f331a038e2ec250e520700_70_0.png)\n\
    \n  图 3-4\n\n- 3. 概率计算就像拼拼图\n  AI 在每一步去噪时，都会做出判断：“这一部分最有可能是什么？”这个过程很像拼拼图。假设 AI\
    \ 找到了一小块拼图，AI 会根据这块拼图的颜色和形状去猜测它应该和哪一块拼在一起。通过不断地计算和调整，最终 AI 就能把所有的“拼图碎片”拼成一幅完整的画面。\n\
    \n- 4. 神经网络就像一位聪明的画家\n  AI 并不是随机地调整画面，而是通过神经网络学习如何画画。神经网络可以理解为 AI 的“大脑”，它从成千上万张图片中学习各种规律，就像一位经验丰富的画家，知道什么样的颜色搭配才好看，什么样的线条才能画出逼真的效果。有了神经网络，AI\
    \ 才能准确地把噪声变成一幅美丽的画。\n\n#### 3.2.3 AI 画画的神奇应用\n\n通过扩散模型的强大能力，AI 可以画出各种风格的图片，这已经被应用到很多领域，帮助人们创作更加精彩的作品。\n\
    \n- 1. 创作插画\n  AI 能够根据文本描述自动生成故事插画。比如，在儿童故事书中，AI 可以按照故事内容画出可爱的角色和生动的场景，让书本更加有趣。\n\
    \n- 2. 设计服装\n  时尚设计师可以使用 AI 生成服装设计图。AI 能够创作不同风格的衣服款式设计图，让设计师从中获得灵感，并进一步优化设计。\n\
    \n- 3. 修复老照片\n  很多老照片因为时间久远，变得模糊不清。AI 通过扩散模型，可以自动填补缺失的细节，让照片变得更加清晰，甚至还能为黑白照片自动上色，让过去的记忆焕然一新。\n\
    \n#### 3.2.4 AI 绘画做不到的\n\nAI 作画非常厉害，但它也有永远画不出来的画，你知道是什么吗？比如，一满杯红酒，不相信你试试看？\n\n\
    那 AI 为什么永远画不出来“一满杯红酒”？\n\n原来，AI 画画的方式和人类不一样。人类可以凭空想象进行创作，而 AI 是靠学习它见过的画，再根据这些经验创造新画面的。但对有些东西，它几乎从未见过，或者无法理解，这就导致\
    \ AI 画不出来。“一满杯红酒”就是一个典型例子。这看似简单，但 AI 很难正确绘制出来。AI 虽然学习了大量图片：它会“看”成千上万张酒杯的图片，但大部分图片里的酒杯不是满的。所以，AI\
    \ 依赖统计规律，它会总结出“酒杯的液体通常不超过三分之二”，所以它几乎不会画出满杯的红酒。再加上 AI 无法理解物理逻辑，它并不真正“知道”液体应该如何填满杯子，它只是模仿见过的例子。人类知道红酒满杯后表面会形成一个略微凸起的部分（这是液体张力造成的），光线折射也会发生特殊变化。但\
    \ AI 没有“常识”，它只是猜测画面应该是什么样的。因此，它画出来的满杯红酒往往会有奇怪的形状。\n\n- (1) 酒杯上半部分变成透明的，没有液体。\n\
    - (2) 液面低于杯口，显示出“空隙”。\n- (3) 玻璃和液体的光影关系不对劲，看起来不自然。\n\n这就是 AI “数据盲区”的问题。它几乎没见过真实世界中“一满杯红酒”的照片，所以它的学习数据里就没有这个概念，导致它无法正确绘制。\n\
    \n哲学家大卫·休谟（David Hume）认为，人类的认知来自经验，而 AI 也是基于经验学习的。因此，AI 的问题恰恰验证了他的观点：如果没有经验，就无法认知，也无法创造。但人类有一个超越\
    \ AI 的能力，那就是想象力和推理能力。\n\nAI 画画的核心限制在于它无法创造真正“前所未见”的事物。如果训练数据中没有某个概念，它就很难凭空生成它。这意味着\
    \ AI 无法画出“从未被拍摄过的场景”。例如：\n\n- (1) 一满杯水，水面正好呈凸起状但未溢出。\n- (2) 一杯精确到“二分之一”的橙汁，而不是“差不多半杯”。\n\
    - (3) 一个飘浮在空气中的真实影子。\n\n这些画面在现实世界中可能存在，但如果没有被拍成照片，AI 可能永远不会学会画它们。\n\n#### 3.2.5\
    \ 人类与 AI：创造力的差异\n\nAI 画画靠经验，但人类画画靠想象力。人类可以创造全新的事物，即使从未见过，而 AI 只能拼接已有的信息。这就是为什么\
    \ AI 永远无法真正取代人类的艺术创造力。\n\n人类可以想象“过去不存在的东西”，AI 只能模仿现有作品。\n\n人类可以推理物理世界的规律，AI 只是按照数据进行匹配。\n\
    \n人类可以基于哲学和逻辑思考问题，AI 只能处理数字信号，没有真正的“理解力”。\n\n虽然 AI 可以画出令人惊叹的作品，但它无法画出“一满杯红酒”，更无法理解休谟所说的“认知的边界”。它只是一个学习机器，而人类是拥有创造力和想象力的生物。\n\
    \nAI 可以辅助艺术创作，但它永远无法成为真正的艺术家。\n\n### 3.3 音律雕塑家：AI 作曲家的旋律方程式\n\nAI 能学会作曲，其实就是学会用数学方法拼音乐的积木。音乐的本质就是数学，只不过它用声音表达出来，而\
    \ AI 就是用数学的方法来“听懂”音乐，然后自己创造新的旋律。\n\n#### 3.3.1 音乐和数学的关系\n\n音乐听起来很美妙，其实背后藏着很多数学规律，比如数字的排列、比例、分数和倍数。\n\
    \n- 1. 音高和倍数的关系\n  你可以想象一个秋千，小朋友坐在上面荡来荡去。如果有人用力推一下，秋千就会荡得更高，但它摆动的速度还是一样的。声音的“高低”也是一样的。例如，钢琴上有一个音叫“中央\
    \ C”，如果你再按高八个键的 C，它的声音听起来更尖锐。其实，这两个 C 的音高是有数学关系的，后面那个 C 的振动频率正好是前面那个的两倍，就像秋千被推得更高，但摆动的方式没变一样。\n\
    \n  这就是为什么唱“Do Re Mi Fa Sol La Ti Do”，最后一个“Do”和第一个“Do”听起来像是同一个音，只是更高了。\n\n- 2.\
    \ 好听的旋律有数学规律\n  有时候你听到两个人合唱，会觉得他们的声音特别和谐，就像拼图完美拼在了一起。其实，这是因为他们的声音频率之间有数学上的和谐比例。例如，如果一个人的音高是\
    \ 240 赫，另一个人的音高是他的一又二分之一倍（也就是 360 赫），那么听起来就会特别和谐。这些数字的比例是固定的，像 3 : 2、4 : 3 这样的数字关系，都会让人觉得旋律特别顺耳。\n\
    \n  这些数学关系就像我们平时切蛋糕一样，切成对半、三等分、四等分，每一块都均匀，大家吃起来才开心。\n\n- 3. 节奏的数学\n  你有没有玩过拍手游戏？例如，先拍一下手，再踩一下脚，然后再拍一下手……如果一直这样重复下去，就是一种固定的节奏。但如果你加快速度，变成两次拍手一次踩脚，听起来就不一样了。\n\
    \n  音乐里的节奏，就是按照一定的数学规律，把时间“切”成一块一块的，将每个音符都放在合适的位置上。\n\n#### 3.3.2 巴赫和十二平均律\n\n\
    很久以前，音乐家们发现了一个难题：如果换一个调（比如从 C 调换到 D 调），很多音就会变得奇怪，就像换了一个房子后，发现原来的桌子和椅子都不合适了。后来，一位叫巴赫的德国古典作曲家想到了解决办法。他设计了一种数学规则，把所有的音都按照一定的比例重新排列，让不同的调都能自由切换，不会听起来奇怪，这个方法就叫十二平均律。\n\
    \n十二平均律的意思就是把八度音切成十二个“平均”大小的音，每个音之间的数学关系是一样的。这样，无论你用哪种调来弹奏音乐，听起来都会很和谐，就像用同样大小的乐高积木搭房子，不管怎么拼，都不会出错。\n\
    \n巴赫用这个方法写了很多美妙的音乐，让人们发现音乐中的数学原来可以这么神奇！\n\n#### 3.3.3 AI 是如何学会作曲的\n\nAI 学作曲，就像小学生学写作文，需先看很多故事，学会句子的结构，再自己编故事。AI\
    \ 的学习过程也是一样。\n\n- 1. 先学会“听”音乐\n  AI 先听很多音乐，比如一千首流行歌、一千首钢琴曲。其实，它并不是像我们一样用耳朵听，而是用数学的方法，把每首歌拆解，分析它的音高、节奏、和弦之间的数学关系。\n\
    \n  这就像拆开一个玩具研究里面的零件，看它是怎么拼起来的。\n\n- 2. 发现音乐中的数学规律\n  AI 会发现，很多好听的歌曲，都有某些固定的旋律和节奏。例如，很多流行歌的和弦进程是\
    \ Do-Sol-La-Fa，它们的音高之间有一定的数学关系。许多节奏都是四拍一循环，比如“咚咚咚咚”这样的重复模式。\n\n  这些发现，就像在数学课上找到解题的公式一样，有了这些公式，AI\
    \ 就可以自己创造新的音乐了。\n\n- 3. 自己尝试作曲\n  学会了音乐中的数学规律之后，AI 就会自己尝试创作。例如，它会先选择一个节奏，比如慢一点的或者快一点的。再选择一套数学上和谐的音符，让旋律听起来流畅。再加入一些变化，让它不只是简单地重复，而是有起伏、有情绪的。这就像用数字做游戏，AI\
    \ 在音乐的世界里拼积木，把每个音符都放在合适的地方，让它变成一首完整的歌。\n\n#### 3.3.4 原理总结\n\n音乐的本质是数学，它的旋律、音高、节奏，都是数字的排列组合。\n\
    \n音高是倍数关系，就像秋千摆动的规律。好听的旋律有数学比例，就像切蛋糕要均匀分配。节奏是时间的数学，就像拍手游戏里的重复模式。\n\n巴赫用十二平均律，让不同调的音乐可以自由转换，就像拼积木时统一了大小规则。\n"
