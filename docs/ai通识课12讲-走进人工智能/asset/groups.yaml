    # 编程新纪元：

    零基础玩转 AI 游戏开发'
  - '[PAGE 173]


    编程是一种让人类和计算机“对话”的方式。就像中国人说中文、美国人说英文一样，计算机也有自己的“语言”，但它听不懂人类的自然语言，所以我们需要用“编程语言”来告诉它该做什么。想象一下，你想让计算机画一朵花。你直接对它说：“请给我画一朵花。”它是听不懂的。但如果你用编程语言，比如
    Python，写一段代码，让计算机画一个圆形的花心，再画五个花瓣。计算机就能按照你的指令完成这个任务。'
  - '[PAGE 174]


    编程是我们控制计算机的手段，让它能按照我们的想法工作。就像你训练一只小狗，让它学会听你的指令坐下、握手；编程就是让计算机学会听你的“命令”，去运行一个程序、开发一个游戏，甚至控制机器人去完成各种任务。


    我们所熟知的通用计算早在 1964 年就被 IBM 描述得非常精确了，人类通过程序跟机器交流，不管是以前的打卡编程，还是后来的 C 语言、Python 等。而如今的计算已经不仅仅是编程了，机器学习已经成为主流，程序不再由人类编写，而是由机器学习并编写。


    那么，AI 怎么编程呢？想象一下，你在玩一个游戏，里面的小怪物会自己跑来跑去，而不是按照固定的路线行动。这就是 AI 的作用，它可以让游戏变得更聪明、更有趣。


    # AI 是怎么帮助编程的？


    在编程的世界里，我们需要写很多代码，让计算机明白我们想做什么。而 AI 可以帮忙做很多事情。


    +   (1) 自动写代码：我们只需要告诉 AI 我们想做什么，它就能帮我们写出一部分代码。


    +   (2) 检查错误：如果代码有问题， AI 可以帮我们找出来，并告知哪里需要修改。


    +   (3) 优化代码：有时候，我们写的代码可以更简单，因为 AI 可以帮我们改进。'
