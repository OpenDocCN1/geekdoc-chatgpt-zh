    \n![](OEBPS/Images/Figure-P39_17380.jpg)\n\n图2.6　打印结果\n\n## 2.1.3 使用Keras函数式编程实现鸢尾花分类的例子（重点）\n\
    \n我们在前面也说了，对于有编程经验的程序设计人员来说，顺序编程过于抽象，同时缺乏过多的自由度，因此在较为高级的程序设计中达不到程序设计的目标。\n\n`Keras`函数式编程是定义复杂模型（如多输出模型、有向无环图，或具有共享层的模型）的方法。\n\
    \n让我们从一个简单的例子开始，程序2-1建立模型的方法时使用顺序编程，即通过逐级添加的方式将数据“add”到模型中。这种方式在较低级水平的编程上可以较好地减轻编程的难度，但是在自由度方面会有非常大的影响，例如当需要对输入的数据进行重新计算时，顺序编程方法就不合适。\n\
    \n函数式编程方法类似于传统的编程。只需要建立模型导入输出和输出“形式参数”即可。有`TensorFlow`1.X编程基础的读者可以将其看作是一种新的格式的“占位符”。代码使用如下：\n\
    \n```\n     inputs = tf.keras.layers.Input(shape=(4,))\n     # 层的实例是可调用的，以张量为参数，并且返回一个张量\n\
    \     x = tf.keras.layers.Dense(32, activation='relu')(inputs)\n     x = tf.keras.layers.Dense(64,\
    \ activation='relu')(x)\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    \     # 这部分创建了一个包含输入层和3个全连接层的模型\n     model = tf.keras.Model(inputs=inputs, outputs=predictions)\n\
    ```\n\n下面开始逐渐对其进行分析。\n\n### 1．输入端\n\n首先是`Input`的形参：\n\n```\n     inputs = tf.keras.layers.Input(shape=(4,))\n\
    ```\n\n这一点需要从源码上来看，代码如下：\n\n![](OEBPS/Images/Figure-P40_38123.jpg)\n\n`Input`函数用于实例化`Keras`张量，`Keras`张量是来自底层后端输入的张量对象，其中增加了某些属性，使其能够通过了解模型的输入和输出来构建`Keras`模型。\n\
    \n`Input`函数的参数：\n\n·　`shape`：形状元组（整数），不包括批量大小。例如，`shape=(32,)`表示预期的输入将是32维向量的批次。\n\
    \n·　`batch_size`：可选的静态批量大小（整数）。\n\n·　`name`：图层的可选名称字符串。在模型中应该是唯一的（不要重复使用相同的名称两次）。如果未提供，它将自动生成。\n\
    \n·　`dtype`：数据类型，即预期输入的数据格式，一般有`float32`、`float64`、`int32`等类型。\n\n·　`sparse`：一个布尔值，指定是否创建占位符是稀疏的。\n\
    \n·　`tensor`：可选的现有张量包裹到`Input`图层中。如果设置，图层将不会创建占位符张量。\n\n·　`**kwargs`：其他的一些参数。\n\
    \n上面是官方对其参数所做的解释。可以看到，这里的`Input`函数就是根据设定的维度大小生成一个可供存放对象的张量空间，维度就是`shape`中设定的维度。\n\
    \n**注意**\n\n与传统的`TensorFlow`不同，这里的`batch`大小并不显式地定义在输入`shape`中。\n\n举例来说，在一个后续的学习中会遇到`MNIST`数据集，即一个手写图片分类的数据集，每张图片的大小用4维来表示，比如`[1,28,28,1]`。第1个数字是每个批次的大小，第2、3个数字是图片的尺寸大小，第4个1是图片通道的个数。因此，输入到`input`中的数据为：\n\
    \n```\n     #举例说明，这里4维变成3维，batch信息不设定\n     inputs = tf.keras.layers.Input(shape=(28,28,1))\n\
    ```\n\n### 2．中间层\n\n下面每个层的写法与使用顺序模式也是不同的：\n\n```\n     x = tf.keras.layers.Dense(32,\
    \ activation='relu')(inputs)\n```\n\n在这里每个类被直接定义，之后将值作为类实例化以后的输入值进行输入计算。\n\n```\n\
    \     X = tf.keras.layers.Dense(32, activation='relu')(inputs)\n     x = tf.keras.layers.Dense(64,\
    \ activation='relu')(x)\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    ```\n\n因此，可以看到这里与顺序最大的区别就在于实例化类以后有对应的输入端，这点较为符合一般程序的编写习惯。\n\n### 3．输出端\n\n输出端不需要额外的表示，直接将计算的最后一个层作为输出端即可：\n\
    \n```\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    ```\n\n### 4．模型的组合方式\n\n模型的组合方式也是很简单的，直接将输入端和输出端在模型类中显式地注明，`Keras`即可在后台将各个层级通过输入和输出对应的关系连接在一起。\n\
    \n```\n     Model = tf.keras.Model(inputs=inputs, outputs=predictions)\n```\n\n\
    完整的代码如下所示。\n\n**【程序2-2】**\n\n![](OEBPS/Images/Figure-P41_38127.jpg)\n\n程序2-2的基本架构对照前面的例子没有多少变化，损失函数和梯度更新方法是固定的写法，这里最大的不同点在于，代码使用了`model`自带的`saver`函数对数据进行保存。在`TensorFlow`\
    \ 2.1中，数据的保存由`Keras`完成，即将图和对应的参数完整地保存在`h5`格式中。\n\n## 2.1.4 使用保存的Keras模式对模型进行复用\n\
    \n前面已经说过，对于保存的文件，`Keras`是将所有的信息都保存在`h5`文件中，这里包含所有模型的结构信息和训练过的参数信息。\n\n```\n  \
    \   New_model = tf.keras.models.load_model('./saver/the_save_model.h5')\n```\n\
    \n`tf.keras.models.load_model`函数是从给定的地址中载入`h5`模型，载入完成后会依据存档自动建立一个新的模型。\n\n模型的复用可直接调用模型`predict`函数：\n\
    \n```\n     new_prediction = new_model.predict(iris_data)\n```\n\n这里直接将`iris`数据作为预测数据进行输入。全部代码如下所示：\n\
    \n**【程序2-3】**\n\n![](OEBPS/Images/Figure-P42_38964.jpg)\n\n最终结果如图2.7所示，可以看到计算结果被完整打印出来。\n\
    \n![](OEBPS/Images/Figure-P43_17972.jpg)\n\n图2.7　打印结果\n\n## 2.1.5 使用TensorFlow标准化编译对iris模型进行拟合\n\
    \n在2.1.3节中，笔者使用了符合传统`TensorFlow`习惯的梯度更新方式对参数进行更新。然而实际这种看起来符合编程习惯的梯度计算和更新方法，可能并不符合大多数有机器学习使用经验的读者使用。本节以修改后的`iris`分类为例，讲解标准化`TensorFlow`的编译方法。\n\
    \n对于大多数机器学习的程序设计人员来说，往往习惯了使用`fit`函数和`compile`函数对数据进行数据载入和参数分析。代码如下（请读者先运行，后面会有更为详细的运行分析）：\n\
    \n**【程序2-4】**\n\n![](OEBPS/Images/Figure-P43_38966.jpg)\n\n下面我们详细分析一下代码。\n\n###\
    \ 1．数据的获取\n\n本例还是使用了`sklearn`中的`iris`数据集作为数据来源，之后将`target`转化成`one-hot`的形式进行存储。顺便提一句，`TensorFlow`本身也带有`one-hot`函数，即`tf.one_hot`，有兴趣的读者可以自行学习。\n\
    \n数据读取之后的处理在后文讲解，这个问题先放一下，请读者继续按顺序往下阅读。\n\n### 2．模型的建立和参数更新\n\n这里不准备采用新模型的建立方法，对于读者来说，熟悉函数化编程已经能够应付绝大多数的深度学习模型的建立。在后面章节中，我们将教会读者自定义某些层的方法。\n\
    \n对于梯度的更新，到目前为止的程序设计中都是采用类似回传调用等方式对参数进行更新，这是由程序设计者手动完成的。然而`TensorFlow`推荐使用自带的梯度更新方法，代码如下：\n\
    \n```\n     model.compile(optimizer=tf.optimizers.Adam(1e-3),\nloss=tf.losses.categorical_crossentropy,metrics\
    \ = ['accuracy'])\n     model.fit(train_data, epochs=500)\n```\n\n`compile`函数是模型适配损失函数和选择优化器的专用函数，而`fit`函数的作用是把训练参数加载进模型中。下面分别对其进行讲解。\n\
    \n#### （1）compile\n\n`compile`函数的作用是用于配置训练模型专用编译函数。源码如下：\n\n```\n     compile(optimizer,\
    \ loss=None, metrics=None, loss_weights=None,\nsample_weight_mode=None, weighted_metrics=None,\
    \ target_tensors=None)\n```\n\n这里我们主要介绍其中3个重要的参数`optimizer`、`loss`和`metrics`。\n\
    \n·　`optimizer`：字符串（优化器名）或者优化器实例。\n\n·　`loss`：字符串（目标函数名）或目标函数。如果模型具有多个输出，可以通过传递损失函数的字典或列表在每个输出上使用不同的损失。模型最小化的损失值将是所有单个损失的总和。\n\
    \n·　`metrics`：在训练和测试期间的模型评估标准。通常会使用`metrics = ['accuracy']`。要为多输出模型的不同输出指定不同的评估标准，还可以传递一个字典，如`metrics\
    \ ={'output_a':'accuracy'}`。\n\n·　可以看到，优化器（`optimizer`）被传入了选定的优化器函数，`loss`是损失函数，这里也被传入选定的多分类`crossentry`函数。`Metrics`用来评估模型的标准，一般用准确率表示。\n\
    \n实际上，`compile`编译函数是一个多重回调函数的集合，对于所有的参数来说，实际上就是根据对应函数的“地址”回调对应的函数，并将参数传入。\n\n\
    举个例子，在上面的编译器中我们传递的是一个`TensorFlow`自带的损失函数，实际上往往是针对不同的计算和误差需要不同的损失函数，这里自定义一个均方差（MSE）损失函数，代码如下：\n\
    \n![](OEBPS/Images/Figure-P45_38135.jpg)\n\n这个损失函数接收2个参数，分别是`y_true`和`y_pred`，即预测值和真实值的形式参数。之后根据需要计算出真实值和预测值之间的误差。\n\
    \n损失函数名作为地址传递给`compile`后，即可作为自定义的损失函数在模型中进行编译，代码如下：\n\n![](OEBPS/Images/Figure-P45_38136.jpg)\n\
    \n至于优化器的自定义，实际上也是可以的。一般情况下，优化器的编写需要比较高的编程技巧以及对模型的理解，这里读者直接使用`TensorFlow`自带的优化器即可。\n\
    \n#### （2）fit\n\n`fit`函数的作用是以给定数量的轮次（数据集上的迭代）训练模型。其主要参数有如下4个：\n\n·　`x`：训练数据的`Numpy`数组（如果模型只有一个输入），或者是`Numpy`数组的列表（如果模型有多个输入）。如果模型中的输入层被命名，也可以传递一个字典，将输入层名称映射到`Numpy`数组。如果从本地框架张量馈送（例如`TensorFlow`数据张量）数据，`x`可以是`None`（默认）。\n\
    \n·　`y`：目标（标签）数据的`Numpy`数组（如果模型只有一个输出），或者是`Numpy`数组的列表（如果模型有多个输出）。如果模型中的输出层被命名，也可以传递一个字典，将输出层名称映射到`Numpy`数组。如果从本地框架张量馈送（例如`TensorFlow`数据张量）数据，`y`可以是`None`（默认）。\n\
    \n·　`batch_size`：整数或`None`。每次梯度更新的样本数。如果未指定，默认为32。\n\n·　`epochs`：整数。训练模型迭代轮次。一个轮次是在整个`x`和`y`上的一轮迭代。注意，与`initial_epoch`一起，`epochs`被理解为“最终轮次”。模型并不是训练了`epochs`轮，而是到第`epochs`轮停止训练。\n\
    \n`fit`函数的主要作用就是对输入的数据进行修改，如果读者已经成功运行了程序2-4，那么现在换一种略微修改后的代码，重新运行`iris`数据集，代码如下：\n\
    \n**【程序2-5】**\n\n![](OEBPS/Images/Figure-P45_38757.jpg)\n\n对比程序2-4和程序2-5可以看到，它们最大的不同在于数据读取方式的变化。更为细节地做出比较，在程序2-4中，数据的读取方式和`fit`函数的载入方式如下：\n\
    \n![](OEBPS/Images/Figure-P46_38138.jpg)\n\n`iris`的数据读取被分成两个部分：数据特征部分和`label`部分。`label`部分使用`Keras`自带的工具进行离散化处理。\n"
  trans: "\n\n模型建立完毕后，准备数据。一份简单而标准的数据，一个简单而具有指导思想的例子往往事半功倍。深度学习中最常用的一个入门起手例子`iris`分类，下面就从这个例子开始，最终使用`TensorFlow`的`Keras`模式实现一个`iris`鸢尾花分类的例子。\n\
    \n## 2.1.2 使用 Keras API 实现鸢尾花分类的例子（顺序模式）\n\n`iris`数据集是常用的分类实验数据集，由 Fisher 于 1936\
    \ 年收集整理。`iris`也称鸢尾花卉数据集，是一类多重变量分析的数据集。`iris`数据集包含 150 个数据集，分为 3 类，每类 50 个数据，每个数据包含\
    \ 4 个属性，可通过花萼长度、花萼宽度、花瓣长度、花瓣宽度 4 个属性预测鸢尾花（见图 2.2）属于`Setosa`、`Versicolour`、`Virginica`这\
    \ 3 个种类中的哪一类。\n\n![](img/Figure-P37_17143.jpg)\n\n图 2.2　鸢尾花\n\n### 1．数据的准备\n\n\
    不需要读者下载这个数据集，一般常用的机器学习工具自带`iris`数据集，引入数据集的代码如下：\n\n```\n     from sklearn.datasets\
    \ import load_iris\n     data = load_iris()\n```\n\n这里调用的是`sklearn`数据库中的`iris`数据集，直接载入即可。\n\
    \n其中的数据以 key-value 值对应存放，key 值如下：\n\n![](img/Figure-P37_17144.jpg)\n\n由于本例中需要`iris`的特征与分类目标，因此这里只需要获取`data`和`target`，代码如下：\n\
    \n![](img/Figure-P37_38117.jpg)\n\n数据打印结果如图 2.3 所示。\n\n![](img/Figure-P37_17145.jpg)\n\
    \n图 2.3　数据打印结果\n\n这里分别打印了前 5 条数据。可以看到`iris`数据集中分成了 4 个不同特征进行数据记录，而每条特征又对应于一个分类表示。\n\
    \n### 2．数据的处理\n\n下面是数据处理部分，对特征的表示不需要变动。分类`label`的打印结果如图 2.4 所示。\n\n![](img/Figure-P38_17207.jpg)\n\
    \n图 2.4　数据处理\n\n这里按数字分成了 3 类，0、1 和 2 分别代表 3 种类型。按直接计算的思路可以将数据结果向固定的数字进行拟合，这是一个回归问题，即通过回归曲线去拟合出最终结果。本例实际上是一个分类任务，因此需要对其进行分类处理。\n\
    \n分类处理的一个非常简单的方法就是进行 one-hot 处理，即将一个序列化数据分到不同的数据领域空间进行表示，如图 2.5 所示。\n\n![](img/Figure-P38_17208.jpg)\n\
    \n图 2.5　one-hot 处理\n\n具体在程序处理上，读者可以手动实现 one-hot 的代码表示，也可以使用`Keras`自带的分散工具对数据进行处理，代码如下：\n\
    \n```\n     iris_target =\nnp.float32(tf.keras.utils.to_categorical(iris_target,num_classes=3))\n\
    ```\n\n这里的`num_classes`分成了 3 类，由一行三列对每个类别进行表示。\n\n交叉熵函数与分散化表示的方法超出了本书的讲解范围，这里不再过多介绍，读者只需要知道交叉熵函数需要和`softmax`配合，从分布上向离散空间靠拢即可。\n\
    \n```\n     Iris_data = tf.data.Dataset.from_tensor_slices(iris_data).batch(50)\n\
    \     iris_target = tf.data.Dataset.from_tensor_slices(iris_target).batch(50)\n\
    ```\n\n当生成的数据读取到内存中并准备以批量的形式打印时使用的是`tf.data.Dataset.from_tensor_slices`函数，并且可以根据具体情况对`batch`进行设置。`Tf.data.Dataset`函数更多的细节和用法在后面章节中会专门介绍。\n\
    \n### 3．梯度更新函数的写法\n\n梯度更新函数是根据误差的幅度对数据进行更新方法，代码如下：\n\n```\n     grads = tape.gradient(loss_value,\
    \ model.trainable_variables)\n     opt.apply_gradients(zip(grads, model.trainable_variables))\n\
    ```\n\n与前面线性回归例子的差别是，使用的模型直接获取参数的方式对数据进行不断更新而非人为指定，这点请读者注意。人为的指定和排除某些参数的方法属于高级程序设计，在后面的章节会提到。\n\
    \n**【程序 2-1】**\n\n![](img/Figure-P39_38121.jpg)\n\n最终打印结果如图 2.6 所示。可以看到损失值在符合要求的条件下不停降低，达到了预期目标。\n\
    \n![](img/Figure-P39_17380.jpg)\n\n图 2.6　打印结果\n\n## 2.1.3 使用 Keras 函数式编程实现鸢尾花分类的例子（重点）\n\
    \n我们在前面也说了，对于有编程经验的程序设计人员来说，顺序编程过于抽象，同时缺乏过多的自由度，因此在较为高级的程序设计中达不到程序设计的目标。\n\n`Keras`函数式编程是定义复杂模型（如多输出模型、有向无环图，或具有共享层的模型）的方法。\n\
    \n让我们从一个简单的例子开始，程序 2-1 建立模型的方法时使用顺序编程，即通过逐级添加的方式将数据“add”到模型中。这种方式在较低级水平的编程上可以较好地减轻编程的难度，但是在自由度方面会有非常大的影响，例如当需要对输入的数据进行重新计算时，顺序编程方法就不合适。\n\
    \n函数式编程方法类似于传统的编程。只需要建立模型导入输出和输出“形式参数”即可。有`TensorFlow`1.X 编程基础的读者可以将其看作是一种新的格式的“占位符”。代码使用如下：\n\
    \n```\n     inputs = tf.keras.layers.Input(shape=(4,))\n     # 层的实例是可调用的，以张量为参数，并且返回一个张量\n\
    \     x = tf.keras.layers.Dense(32, activation='relu')(inputs)\n     x = tf.keras.layers.Dense(64,\
    \ activation='relu')(x)\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    \     # 这部分创建了一个包含输入层和 3 个全连接层的模型\n     model = tf.keras.Model(inputs=inputs,\
    \ outputs=predictions)\n```\n\n下面开始逐渐对其进行分析。\n\n### 1．输入端\n\n首先是`Input`的形参：\n\n\
    ```\n     inputs = tf.keras.layers.Input(shape=(4,))\n```\n\n这一点需要从源码上来看，代码如下：\n\
    \n![](img/Figure-P40_38123.jpg)\n\n`Input`函数用于实例化`Keras`张量，`Keras`张量是来自底层后端输入的张量对象，其中增加了某些属性，使其能够通过了解模型的输入和输出来构建`Keras`模型。\n\
    \n`Input`函数的参数：\n\n·　`shape`：形状元组（整数），不包括批量大小。例如，`shape=(32,)`表示预期的输入将是 32 维向量的批次。\n\
    \n·　`batch_size`：可选的静态批量大小（整数）。\n\n·　`name`：图层的可选名称字符串。在模型中应该是唯一的（不要重复使用相同的名称两次）。如果未提供，它将自动生成。\n\
    \n·　`dtype`：数据类型，即预期输入的数据格式，一般有`float32`、`float64`、`int32`等类型。\n\n·　`sparse`：一个布尔值，指定是否创建占位符是稀疏的。\n\
    \n·　`tensor`：可选的现有张量包裹到`Input`图层中。如果设置，图层将不会创建占位符张量。\n\n·　`**kwargs`：其他的一些参数。\n\
    \n上面是官方对其参数所做的解释。可以看到，这里的`Input`函数就是根据设定的维度大小生成一个可供存放对象的张量空间，维度就是`shape`中设定的维度。\n\
    \n**注意**\n\n与传统的`TensorFlow`不同，这里的`batch`大小并不显式地定义在输入`shape`中。\n\n举例来说，在一个后续的学习中会遇到`MNIST`数据集，即一个手写图片分类的数据集，每张图片的大小用\
    \ 4 维来表示，比如`[1,28,28,1]`。第 1 个数字是每个批次的大小，第 2、3 个数字是图片的尺寸大小，第 4 个 1 是图片通道的个数。因此，输入到`input`中的数据为：\n\
    \n```\n     #举例说明，这里 4 维变成 3 维，batch 信息不设定\n     inputs = tf.keras.layers.Input(shape=(28,28,1))\n\
    ```\n\n### 2．中间层\n\n下面每个层的写法与使用顺序模式也是不同的：\n\n```\n     x = tf.keras.layers.Dense(32,\
    \ activation='relu')(inputs)\n```\n\n在这里每个类被直接定义，之后将值作为类实例化以后的输入值进行输入计算。\n\n```\n\
    \     X = tf.keras.layers.Dense(32, activation='relu')(inputs)\n     x = tf.keras.layers.Dense(64,\
    \ activation='relu')(x)\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    ```\n\n因此，可以看到这里与顺序最大的区别就在于实例化类以后有对应的输入端，这点较为符合一般程序的编写习惯。\n\n### 3．输出端\n\n输出端不需要额外的表示，直接将计算的最后一个层作为输出端即可：\n\
    \n```\n     predictions = tf.keras.layers.Dense(3, activation='softmax')(x)\n\
    ```\n\n### 4．模型的组合方式\n\n模型的组合方式也是很简单的，直接将输入端和输出端在模型类中显式地注明，`Keras`即可在后台将各个层级通过输入和输出对应的关系连接在一起。\n\
    \n```\n     Model = tf.keras.Model(inputs=inputs, outputs=predictions)\n```\n\n\
    完整的代码如下所示。\n\n**【程序 2-2】**\n\n![](img/Figure-P41_38127.jpg)\n\n程序 2-2 的基本架构对照前面的例子没有多少变化，损失函数和梯度更新方法是固定的写法，这里最大的不同点在于，代码使用了`model`自带的`saver`函数对数据进行保存。在`TensorFlow`\
    \ 2.1 中，数据的保存由`Keras`完成，即将图和对应的参数完整地保存在`h5`格式中。\n\n## 2.1.4 使用保存的 Keras 模式对模型进行复用\n\
    \n前面已经说过，对于保存的文件，`Keras`是将所有的信息都保存在`h5`文件中，这里包含所有模型的结构信息和训练过的参数信息。\n\n```\n  \
    \   New_model = tf.keras.models.load_model('./saver/the_save_model.h5')\n```\n\
    \n`tf.keras.models.load_model`函数是从给定的地址中载入`h5`模型，载入完成后会依据存档自动建立一个新的模型。\n\n模型的复用可直接调用模型`predict`函数：\n\
    \n```\n     new_prediction = new_model.predict(iris_data)\n```\n\n这里直接将`iris`数据作为预测数据进行输入。全部代码如下所示：\n\
    \n**【程序 2-3】**\n\n![](img/Figure-P42_38964.jpg)\n\n最终结果如图 2.7 所示，可以看到计算结果被完整打印出来。\n\
    \n![](img/Figure-P43_17972.jpg)\n\n图 2.7　打印结果\n\n## 2.1.5 使用 TensorFlow 标准化编译对\
    \ iris 模型进行拟合\n\n在 2.1.3 节中，笔者使用了符合传统`TensorFlow`习惯的梯度更新方式对参数进行更新。然而实际这种看起来符合编程习惯的梯度计算和更新方法，可能并不符合大多数有机器学习使用经验的读者使用。本节以修改后的`iris`分类为例，讲解标准化`TensorFlow`的编译方法。\n\
    \n对于大多数机器学习的程序设计人员来说，往往习惯了使用`fit`函数和`compile`函数对数据进行数据载入和参数分析。代码如下（请读者先运行，后面会有更为详细的运行分析）：\n\
    \n**【程序 2-4】**\n\n![](img/Figure-P43_38966.jpg)\n\n下面我们详细分析一下代码。\n\n### 1．数据的获取\n\
    \n本例还是使用了`sklearn`中的`iris`数据集作为数据来源，之后将`target`转化成`one-hot`的形式进行存储。顺便提一句，`TensorFlow`本身也带有`one-hot`函数，即`tf.one_hot`，有兴趣的读者可以自行学习。\n\
    \n数据读取之后的处理在后文讲解，这个问题先放一下，请读者继续按顺序往下阅读。\n\n### 2．模型的建立和参数更新\n\n这里不准备采用新模型的建立方法，对于读者来说，熟悉函数化编程已经能够应付绝大多数的深度学习模型的建立。在后面章节中，我们将教会读者自定义某些层的方法。\n\
    \n对于梯度的更新，到目前为止的程序设计中都是采用类似回传调用等方式对参数进行更新，这是由程序设计者手动完成的。然而`TensorFlow`推荐使用自带的梯度更新方法，代码如下：\n\
    \n```\n     model.compile(optimizer=tf.optimizers.Adam(1e-3),\nloss=tf.losses.categorical_crossentropy,metrics\
    \ = ['accuracy'])\n     model.fit(train_data, epochs=500)\n```\n\n`compile`函数是模型适配损失函数和选择优化器的专用函数，而`fit`函数的作用是把训练参数加载进模型中。下面分别对其进行讲解。\n\
    \n#### （1）compile\n\n`compile`函数的作用是用于配置训练模型专用编译函数。源码如下：\n\n```\n     compile(optimizer,\
    \ loss=None, metrics=None, loss_weights=None,\nsample_weight_mode=None, weighted_metrics=None,\
    \ target_tensors=None)\n```\n\n这里我们主要介绍其中 3 个重要的参数`optimizer`、`loss`和`metrics`。\n\
    \n·　`optimizer`：字符串（优化器名）或者优化器实例。\n\n·　`loss`：字符串（目标函数名）或目标函数。如果模型具有多个输出，可以通过传递损失函数的字典或列表在每个输出上使用不同的损失。模型最小化的损失值将是所有单个损失的总和。\n\
    \n·　`metrics`：在训练和测试期间的模型评估标准。通常会使用`metrics = ['accuracy']`。要为多输出模型的不同输出指定不同的评估标准，还可以传递一个字典，如`metrics\
    \ ={'output_a':'accuracy'}`。\n\n·　可以看到，优化器（`optimizer`）被传入了选定的优化器函数，`loss`是损失函数，这里也被传入选定的多分类`crossentry`函数。`Metrics`用来评估模型的标准，一般用准确率表示。\n\
    \n实际上，`compile`编译函数是一个多重回调函数的集合，对于所有的参数来说，实际上就是根据对应函数的“地址”回调对应的函数，并将参数传入。\n\n\
    举个例子，在上面的编译器中我们传递的是一个`TensorFlow`自带的损失函数，实际上往往是针对不同的计算和误差需要不同的损失函数，这里自定义一个均方差（MSE）损失函数，代码如下：\n\
    \n![](img/Figure-P45_38135.jpg)\n\n这个损失函数接收 2 个参数，分别是`y_true`和`y_pred`，即预测值和真实值的形式参数。之后根据需要计算出真实值和预测值之间的误差。\n\
    \n损失函数名作为地址传递给`compile`后，即可作为自定义的损失函数在模型中进行编译，代码如下：\n\n![](img/Figure-P45_38136.jpg)\n\
    \n至于优化器的自定义，实际上也是可以的。一般情况下，优化器的编写需要比较高的编程技巧以及对模型的理解，这里读者直接使用`TensorFlow`自带的优化器即可。\n\
    \n#### （2）fit\n\n`fit`函数的作用是以给定数量的轮次（数据集上的迭代）训练模型。其主要参数有如下 4 个：\n\n·　`x`：训练数据的`Numpy`数组（如果模型只有一个输入），或者是`Numpy`数组的列表（如果模型有多个输入）。如果模型中的输入层被命名，也可以传递一个字典，将输入层名称映射到`Numpy`数组。如果从本地框架张量馈送（例如`TensorFlow`数据张量）数据，`x`可以是`None`（默认）。\n\
    \n·　`y`：目标（标签）数据的`Numpy`数组（如果模型只有一个输出），或者是`Numpy`数组的列表（如果模型有多个输出）。如果模型中的输出层被命名，也可以传递一个字典，将输出层名称映射到`Numpy`数组。如果从本地框架张量馈送（例如`TensorFlow`数据张量）数据，`y`可以是`None`（默认）。\n\
    \n·　`batch_size`：整数或`None`。每次梯度更新的样本数。如果未指定，默认为 32。\n\n·　`epochs`：整数。训练模型迭代轮次。一个轮次是在整个`x`和`y`上的一轮迭代。注意，与`initial_epoch`一起，`epochs`被理解为“最终轮次”。模型并不是训练了`epochs`轮，而是到第`epochs`轮停止训练。\n\
    \n`fit`函数的主要作用就是对输入的数据进行修改，如果读者已经成功运行了程序 2-4，那么现在换一种略微修改后的代码，重新运行`iris`数据集，代码如下：\n\
    \n**【程序 2-5】**\n\n![](img/Figure-P45_38757.jpg)\n\n对比程序 2-4 和程序 2-5 可以看到，它们最大的不同在于数据读取方式的变化。更为细节地做出比较，在程序\
    \ 2-4 中，数据的读取方式和`fit`函数的载入方式如下：\n\n![](img/Figure-P46_38138.jpg)\n\n`iris`的数据读取被分成两个部分：数据特征部分和`label`部分。`label`部分使用`Keras`自带的工具进行离散化处理。\n\
    \n"
