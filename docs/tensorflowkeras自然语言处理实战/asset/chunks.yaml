    \n![](img/Figure-P120_38235.jpg)\n\n在这里笔者使用了 3 个卷积层和 3 个`batch_normalization`作为正则化层，之后使用`flatten`函数将数据拉平并重新排列，提供给分类器使用，这也解决了分类器数据输入的问题。\n\
    \n**注意**\n\n笔者使用了正统的模型类的定义方式，首先生成一个`FashionClassic`类名，在`__init__`函数中对所有需要用到的层进行定义，而在`__call__`函数中对其进行了调用。如果读者不是很熟悉\
    \ Python 类的定义和使用，请自行查阅 Python 类中`__call__`函数和`__init__`函数的用法。\n\n### 5.3.4　Model\
    \ 的查看和参数打印\n\nTensorFlow 2.X 提供了将模型进行组合和建立的函数，代码如下：\n\n![](img/Figure-P120_13608.jpg)\n\
    \n与传统的 TensorFlow 类似，这里的`Input`函数创建了一个占位符，提供了数据的输入口；之后直接调用分类函数获取占位符的输出结果，从而虚拟达成了一个类的完整形态；之后的`Model`函数建立了输入与输出连接，从而建立了一个完整的\
    \ TensorFlow 模型。\n\n下面一步是对模型的展示。TensorFlow 2.X 通过调用 Keras 作为高级 API 可以将模型的大概结构和参数打印出来，使用代码如下：\n\
    \n```\n     print(model.summary())\n```\n\n打印结果如图 5.8 所示。\n\n![](img/Figure-P121_13636.jpg)\n\
    \n图 5.8　模型的层次与参数\n\n从模型层次的打印和参数的分布上来看，与在模型类中定义的分布一致，首先是输入端，之后分别接了 3 个卷积层和`batch_normalization`层作为特征提取的工具，之后`flatten`层将数据拉平，全连接层对输入的数据进行分类处理。\n\
    \n除此之外，TensorFlow 中还提供了图形化模型输入输出的函数，代码如下：\n\n```\n     tf.keras.utils.plot_model(model)\n\
    ```\n\n在这里输出的结果如图 5.9 所示。\n\n![](img/Figure-P122_13685.jpg)\n\n图 5.9　模型的图形化展示\n\
    \n该函数将画出模型结构图，并保存成图片，除了输入使用 TensorFlow 中 Keras 创建的模型外，`plot_model`函数还接受额外的两个参数：\n\
    \n·　`show_shapes`：指定是否显示输出数据的形状，默认为 False。\n·　`show_layer_names`：指定是否显示层名称，默认为\
    \ True。\n\n### 5.3.5　模型的训练和评估\n\n这里使用和上一节类似的模型参数进行设置，唯一的区别就是自定义学习率，因为随着模型的变化学习率也会跟随变化，代码如下：\n\
    \n![](img/Figure-P122_38237.jpg)\n\n在这里，训练数据和测试被分别使用，并进行训练和验证，`epoch`为训练的轮数，而`verbose=2`设置了显示结果。完整代码如下所示：\n\
    \n**【程序 5-3】**\n\n![](img/Figure-P123_39592.jpg)\n\n训练和验证输出如图 5.10 所示。\n\n![](img/Figure-P124_13989.jpg)\n\
    \n图 5.10　训练和验证过程展示\n\n可以看到训练的准确率上升得很快，仅仅经过 10 个周期后，在验证集上准确率就达到了 0.9023，这也是一个较好的成绩。\n\
    \n## 5.4　使用 TensorBoard 可视化训练过程\n\nTensorBoard 是 TensorFlow 自带的一个强大的可视化工具，也是一个\
    \ Web 应用程序套件。在众多机器学习库中，TensorFlow 是目前唯一自带可视化工具的库，这是 TensorFlow 的一个优点。学会使用 TensorBoard\
    \ 将可以帮助 TensorFlow 的使用者构建复杂模型。\n\nTensorBoard 是集成在 TensorFlow 中自动安装的，基本上安装完 TensorFlow\
    \ 1.X 或者 2.X，TensorBoard 就已经默认安装，而且无论是 1.X 版本还是 2.X 版本的 TensorBoard，都可以在 TensorFlow\
    \ 2.X 下直接使用而无须做出调整。\n\nTensorBoard 官方定义的`tf.keras.callbacks.TensorBoard`函数：\n\n\
    ·　类`TensorBoard`。\n·　继承自：`Callback`。\n·　定义在：`tensorflow/python/keras/callbacks.py`。\n\
    ·　TensorBoard 基本可视化。\n·　TensorBoard 是由 TensorFlow 提供的一个可视化工具。\n·　此回调为 TensorBoard\
    \ 编写日志，允许我们可视化训练和测试度量的动态图形，也可以可视化模型中不同层的激活直方图。\n\n### 5.4.1　TensorBoard 文件夹的设置\n\
    \n在使用 TensorBoard 之前读者需要知道的是，TensorBoard 实际上是将训练过程的数据存储并写入硬盘的类，因此需要按 TensorFlow\
    \ 官方的定义将存储文件夹生成。\n\n图 5.11 显示的是 TensorBoard 文件的存储架构，在`logs`文件夹下的`train`文件夹中存放着以`events`开头的文件，即\
    \ TensorBoard 存储的文件。\n\n![](img/Figure-P125_14018.jpg)\n\n图 5.11　TensorBoard 文件存储架构\n\
    \n在真实的模型训练中，`logs`中的`train`文件夹是在 TensorBoard 函数初始化的过程中创建的，因此读者只需要在与训练代码“平行”的位置创建一个`logs`文件夹即可，如图\
    \ 5.12 所示。\n\n![](img/Figure-P125_14019.jpg)\n\n图 5.12　创建的 logs 文件夹\n\n`logs`文件夹是与`train`这个`py`文件平行的文件夹，专用于存放\
    \ TensorBoard 在程序的运行过程中产生的数据文件。更进一步的`train`文件和更深文件夹中的数据文件都是在模型的运行过程中产生的。\n\n###\
    \ 5.4.2　TensorBoard 的显式调用\n\n在 1.X 版本中，如果用户需要使用 TensorBoard 对训练过程进行监督，就需要显式地调用\
    \ TensorBoard 对数据进行加载，即 TensorBoard 是通过一些操作将数据记录到文件中再读取文件来完成作图的。\n\n在 TensorFlow\
    \ 2.X 中，为了结合 Keras 高级 API 的数据调用和使用方法，TensorBoard 被集成在`callbacks`函数中，用户可以自由地将其加载到训练的过程中，并直观地观测模型的训练情况。\n\
    \n在 TensorFlow 2.X 中调用 TensorBoard callbacks 的代码如下：\n\n```\n     tensorboard =\
    \ tf.keras.callbacks.TensorBoard(histogram_freq=1)\n```\n\n其中的参数可以是以下几种：\n\n·　`log_dir`：用来保存被\
    \ TensorBoard 分析的日志文件的文件名。\n·　`histogram_freq`：对于模型中各个层计算激活值和模型权重直方图的频率（训练轮数中）。如果设置成\
    \ 0，直方图不会被计算。对于直方图可视化的验证数据（或分离数据）一定要明确指出。\n·　`write_graph`：是否在 TensorBoard 中可视化图像。如果`write_graph`被设置为\
    \ True，那么日志文件会变得非常大。\n·　`write_grads`：是否在 TensorBoard 中可视化梯度值直方图。`histogram_freq`必须要大于\
    \ 0。\n·　`batch_size`：用以直方图计算的传入神经元网络输入批的大小。\n·　`write_images`：是否在 TensorBoard\
    \ 中将模型权重以图片可视化。\n·　`embeddings_freq`：被选中的嵌入层会被保存的频率（在训练轮中）。\n·　`embeddings_layer_names`：一个列表，会被监测层的名字。如果是\
    \ None 或空列表，那么所有的嵌入层都会被监测。\n·　`embeddings_metadata`：一个字典，对应层的名字到保存有这个嵌入层元数据文件的名字。\n\
    ·　`embeddings_data`：要嵌入在`embeddings_layer_names`指定的层的数据。Numpy 数组（如果模型有单个输入）或 Numpy\
    \ 数组列表（如果模型有多个输入）。\n·　`update_freq`：'batch'或'epoch'或整数。当使用'batch'时，在每个 batch 之后将损失和评估值写入\
    \ TensorBoard 中。同样的情况应用到'epoch'中。如果使用整数，例如 10000，这个回调会在每 10000 个样本之后将损失和评估值写入\
    \ TensorBoard 中。注意，频繁地写入到 TensorBoard 会减缓我们的训练。\n\n调用好的 TensorBoard 函数依旧需要显式地在模型训练过程中被调用，此时\
    \ TensorBoard 通过继承 keras 中的`Callbacks`类直接被插入训练模型使用即可。\n\n```\n     model.fit(x=train_images,y=train_labels,\n\
    epochs=10,verbose=2,callbacks=[tensorboard])\n```\n\n这里使用了上一节中 FashionMNIST 训练过程的`fit`函数，`callbacks`将实例化的一个`Callbacks`类显式地传递到训练模型中。\n\
    \n**提示**\n\n`callbacks`类的使用和实现不止 TensorBoard 一个，在本例中读者只需要记住有这个类即可。\n\n**【程序 5-4】**\n\
    \n![](img/Figure-P127_38243.jpg)\n\n程序的运行结果请读者参考上一节的程序运行示例，这里不再说明。\n\n### 5.4.3　TensorBoard\
    \ 的使用\n\nTensorBoard 的使用需要分成 3 部分。\n\n#### 1．确认 TensorBoard 生成完毕\n\n模型训练完毕或者在训练的过程中\
    \ TensorBoard 会在`logs`文件夹下生成对应的数据存储文件，如图 5.13 所示，可以通过查阅相应的文件确定文件的产生。\n\n![](img/Figure-P128_14390.jpg)\n\
    \n图 5.13　TensorBoard 文件的存储\n\n#### 2．终端输入 TensorBoard 启动命令\n\n在 CMD 终端上打开终端控制端口，如图\
    \ 5.14 所示。\n\n![](img/Figure-P128_14391.jpg)\n\n图 5.14　打开终端\n\n输入如下内容：\n\n```\n\
    \     tensorboard --logdir=/full_path_to_your_logs/train\n```\n\n也就是显式地调用`tensorboard`，在对应的位置（见图\
    \ 5.15）打开存储的数据文件，如图 5.16 所示。\n\n![](img/Figure-P129_14423.jpg)\n\n图 5.15　TensorBoard\
    \ 存储的位置\n\n![](img/Figure-P129_14424.jpg)\n\n图 5.16　终端调用 TensorBoard 的位置\n\n在核对完终端的\
    \ TensorBoard 启动命令后，终端显示如图 5.17 所示的值，即可确定 TensorBoard 启动完毕。\n\n![](img/Figure-P129_14425.jpg)\n\
    \n图 5.17　TensorBoard 在终端启动后的输出值\n\n此时 TensorBoard 自动启动了一个端口为 6006 的 HTTP 地址，地址名就是本机地址，可以用`localhost`代替。\n\
    \n#### 3．在浏览器中查看 TensorBoard\n\n一般使用 chrome 核心的浏览器都可以对 TensorBoard 进行浏览。笔者使用 QQ\
    \ 浏览器打开 TensorBoard，输入地址如下：\n\n```\n     http://localhost:6006\n```\n\n打开的页面如图\
    \ 5.18 所示。\n\n![](img/Figure-P129_14426.jpg)\n\n图 5.18　打开的 TensorBoard 页面\n\n\
    在打开的页面中有若干个标题，分别为`SCALARS`、`GRAPHS`、`DISTRIBUTIONS`、`HISTOGRAMS`、`PROFILE`等一系列标签。`SCALARS`是按命名空间划分的监控数据，形式如图\
    \ 5.19 所示。\n\n![](img/Figure-P130_14447.jpg)\n\n图 5.19　监控数据\n\n这里展示了在程序代码段中的两个监控指标：`epoch_loss`和`epoch_accuracy`。随着时间的变换，`loss`呈现一个线性的减少而`accuracy`呈现一个线性的增加。图中横坐标表示训练次数，纵坐标表示该标量的具体值，从这张图上可以看出，随着训练次数的增加，损失函数的值是在逐步减小的。\n\
    \nTensorBoard 左侧的工具栏上的`smoothing`表示在作图的时候对图像进行平滑处理（0 是不平滑处理，1 是最平滑，默认是 0.6），这样做是为了更好地展示参数的整体变化趋势。如果不平滑处理，那么有些曲线波动很大，难以看出趋势。\n\
    \n`GRAPHS`是整个模型图的架构展示，如图 5.20 所示。\n\n![](img/Figure-P130_14448.jpg)\n\n图 5.20　模型图架构\n\
    \n相对于 Keras 中的模型图和参数展示，TensorBoard 能够更进一步地展示模型架构细节，单击每个模型的节点，可以展开看到节点的输入和输出数据，如图\
    \ 5.21 所示。\n\n![](img/Figure-P131_14498.jpg)\n\n图 5.21　展开后的 TensorBoard 节点显示图\n\
    \n`DISTRIBUTIONS`查看的是神经元输出的分布，有激活函数之前的分布、激活函数之后的分布等，如图 5.22 所示。\n\n![](img/Figure-P131_14499.jpg)\n\
    \n图 5.22　DISTRIBUTIONS 查看神经元输出的分布\n\nTensorBoard 中剩下的标签分别是分布和统计方面的一些模型信息，这里笔者就不再过多解释了，请有兴趣的读者自行查阅相关内容。\n\
    \n## 5.5　本章小结\n\n本章主要介绍了两个 TensorFlow 2.X 中的高级 API。`TensorFlow Datasets`简化了数据集的获取与使用，并且其中的数据集依旧在不停地增加中。TensorBoard\
    \ 是可视化模型训练过程的利器，通过其对模型训练过程不同维度的观测可以帮助用户更好地对模型进行训练。\n\n# 第 6 章\n从冠军开始：ResNet\n\n\
    随着`VGG`网络模型的成功，更深、更宽、更复杂的网络似乎成为卷积神经网络搭建的主流。卷积神经网络能够用来提取所侦测对象的低、中、高特征，网络的层数越多，意味着能够提取到不同\
    \ level 的特征越丰富，并且通过还原镜像发现越深的网络提取的特征越抽象，越具有语义信息。\n\n这也产生了一个非常大的疑问，是否可以单纯地通过增加神经网络模型的深度和宽度，即增加更多的隐藏层和每个层之中的神经元去获得更好的结果？\n\
    \n答案是不可能。根据实验发现，随着卷积神经网络层数的加深，出现了另外一个问题，即在训练集上准确率难以达到 100%正确，甚至于产生了下降。\n\n这似乎不能简单地解释为卷积神经网络的性能下降，因为卷积神经网络加深的基础理论就是越深越好。如果强行解释为产生了“过拟合”，似乎也不能够解释准确率下降的问题，因为如果产生了过拟合，那么在训练集上卷积神经网络应该表现得更好才对。\n\
    \n这个问题被称为“神经网络退化”。\n\n神经网络退化问题的产生说明了卷积神经网络不能够被简单地使用堆积层数的方法进行优化！\n\n2015 年，152\
    \ 层深的`ResNet`横空出世，取得`ImageNet`竞赛冠军，相关论文在`CVPR 2016`斩获最佳论文奖。`ResNet`成为视觉乃至整个 AI\
    \ 界的一个经典。`ResNet`使得训练深达数百甚至数千层的网络成为可能，而且性能仍然优异。\n\n本章将主要介绍`ResNet`及其变种。后面章节介绍的\
    \ Attention 模块也是基于`ResNet`模型的扩展，因此本章内容非常重要。本章还会引入一个新的模块`TensorFlow-layers`，这是为了简化。\n\
    \n让我们站在巨人的肩膀上，从冠军开始！\n\n**提示**\n\n`ResNet`非常简单。\n\n## 6.1　ResNet 基础原理与程序设计基础\n\
    \n"
