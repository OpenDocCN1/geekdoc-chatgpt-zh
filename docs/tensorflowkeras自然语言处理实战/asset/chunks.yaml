    \n首先回答 10.2 节提出的 2 个问题。\n\n问 1：相对于编码器的转换模型，编码器-解码器的翻译模型有什么区别？\n\n答：对于转换模型来说，模型在工作时不需要对其进行处理，默认所有的信息都包含在编码器编码的词嵌入`embedding`中，最后直接做`softmax`计算即可。编码器-解码器的翻译模型需要综合编码器的编码内容和解码器原始输入共同完成后续的交互计算。\n\
    \n问 2：做拼音汉字的翻译系统，编码器和解码器的输入端分别输入什么内容？\n\n答：编码器的输入端是汉字，解码器的输入端是错位的拼音。\n\n本章和上一章是相互衔接的章节，主要是对当前最新的模型`transformer`进行介绍和说明，从架构入手，对主要架构部分、编码器和解码器进行详细介绍，并且还介绍了各种`ticks`和小的细节，有针对性地对模型优化做了说明。\n\
    \n读者在学习这两章的时候一定要多加阅读，掌握全部内容。相对于目前和后续的自然语言处理问题，`transformer`架构是最为重要和基础的内容。\n\n"
