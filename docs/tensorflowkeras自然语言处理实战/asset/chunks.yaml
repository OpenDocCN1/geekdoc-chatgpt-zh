    图像和其他信号的局部统计特征与其位置是不太相关的，如果特征图能在图片的一个部分出现，就能出现在任何地方。所以不同位置的单元共享同样的权重，并在数组的不同部分探测相同的模式。


    数学上，这种由一个特征图执行的过滤操作是一个离散的卷积，卷积神经网络由此得名。


    池化层的作用是对获取的图像特征进行缩减，从前面的例子中可以看到，使用`[2,2]`大小的矩阵来处理特征矩阵，使得原有的特征矩阵可以缩减到 1/4 大小，特征提取的池化效应如图
    4.10 所示。


    ![](img/Figure-P96_10854.jpg)


    图 4.10　池化处理后的图像


    经过池化处理的图像矩阵作为神经网络的数据输入，使用一个全连接层对输入的所有节点数据进行分类处理（见图 4.11），并且计算这个图像所求的所属位置概率最大值。


    ![](img/Figure-P96_10855.jpg)


    图 4.11　全连接层判断


    采用较为通俗的语言概括，卷积神经网络是一个层级递增的结构，也可以认为是一个人在读报纸，首先一字一句地读取，之后整段地理解，最后获得全文的倾向。卷积神经网络也是从边缘、结构和位置等一起感知物体的形状。


