    ### 5.2.2 模型的建立与训练


    模型的建立非常简单，在这里笔者使用TensorFlow 2.0中的“顺序结构”建立一个基本的4层判别模型，即一个输入层、两个隐藏层、一个输出层的模型结构，代码如下：


    ![](OEBPS/Images/Figure-P116_38226.jpg)


    下面对模型做个说明：


    · 输入层：`tf.keras.layers.Flatten`这一层将图像从2d数组转换为一个784（28×28）像素的一维数组。将这一层想象为将图像中的逐行像素拆开，并将它们排列起来。该层没有需要学习的参数，因为它只是重新格式化数据。


    · 隐藏层：`tf.keras.layers.Dense`是由256或128个神经元组成的密集连接层。每个神经元（或节点）从前一层的所有784个节点获取输入，根据训练过程中将学习到的隐藏层参数对输入进行加权，并将单个值输出到下一层。


    · 输出层：同样由`tf.keras.layers.Dense`构成，所不同的是此层的激活函数是由`softmax`提供的，将输入转化成10节点，本例中每个节点表示一组服装。与前一层一样，每个节点从其前面层的128个节点获取输入。每个节点根据学习到的参数对输入进行加权计算，所有10个节点值之和为1（具体请参考有关`softmax`的讲解）。


    接下来定义优化器和损失函数。


    TensorFlow提供了多种优化器供用户使用，一般常用的是SGD与ADAM。这里对SGD和ADAM的具体内容不做介绍，而是直接使用ADAM优化器作为本例中的优化器选择，推荐读者在后续的实验中将其作为默认的优化器模型。


    对于本例中的FashionMNIST分类，可以按模型计算的结果将其分解到不同的类别分布中，因此选择“交叉熵”作为对应的损失函数，代码如下：


    ```

    model.compile(optimizer=''adam'', loss=''sparse_categorical_crossentropy'',

    metrics=[''accuracy''])

    ```


    在`compile`函数中，优化器`optimizer`的定义是`''adam''`，损失函数的定义为`''sparse_categorical_crossentropy''`，而不是传统的`categorical_crossentropy`，这是因为`sparse_categorical_crossentropy`函数能够将输入的序列转化成与模型对应的分布函数，而无须手动调节，这样可以在数据的预处理过程中较好地减少显存的占用和数据交互的时间。


    当然读者也可以使用`categorical_crossentropy`“交叉熵”函数作为损失函数的定义，不过需要在数据的预处理过程中加上`tf.one_hot`函数对标签的分布做出预处理。本书推荐使用`sparse_categorical_crossentropy`作为损失函数的定义。


    最后就是对设置样本的轮次和`batch_size`的大小，在这里根据不同的硬件配置可以对其进行不同的设置，代码如下：


    ```

    batch_size = 256

    train_dataset =

    train_dataset.repeat().shuffle(num_train_examples).batch(batch_size)

    test_dataset = test_dataset.batch(batch_size)

    ```


    `batch_size`的大小可以根据不同机器的配置情况进行设置。最后一步是模型对样本的训练，代码如下：


    ```

    model.fit(train_dataset, epochs=5,

    steps_per_epoch=math.ceil(num_train_examples/ batch_size))

    ```


