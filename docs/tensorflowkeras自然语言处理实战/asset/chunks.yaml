    ![](img/Figure-P80_37758.jpg)


    即当前层输出值对误差的梯度可以通过下一层的误差与权重和输入值的梯度乘积获得。在公式![](img/Figure-P80_39226.jpg)中，`δ[k]`若为输出层则可以通过![](img/Figure-P80_39229.jpg)求得，`δ[k]`为非输出层时则可以使用逐层反馈的方式求得`δ[k]`的值。


    **提示**


    这里千万要注意，对于`δ[k]`与![](img/Figure-P80_39233.jpg)来说，其计算结果都是当前的输出值对于输入值的梯度计算，是权重更新过程中一个非常重要的数据计算内容。


    或者换一种表述形式将前面的公式表示为：


    ![](img/Figure-P80_37759.jpg)


    可以看到，通过更为泛化的公式把当前层的输出对输入的梯度计算转化成求下一个层级的梯度计算值。


    **【定义三】**权重的更新


    反馈神经网络计算的目的是对权重的更新，因此与梯度下降算法类似，其更新可以仿照梯度下降对权值的更新公式：


