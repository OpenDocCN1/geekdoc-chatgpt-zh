    #自定义输入数据

    with tf.device("/CPU:0"):

    xs = tf.random.truncated_normal(shape=[50, 32, 32, 32])

    out = tf.keras.layers.AveragePooling2D(strides=[1,1])(xs)

    print(out.shape)

    ```


    这里对输入值设置了以`[2,2]`为大小的均值核，步进为`[1,1]`。补全方式为`SAME`，即通过补 0 的方式对输入数据进行补全。结果如下：


