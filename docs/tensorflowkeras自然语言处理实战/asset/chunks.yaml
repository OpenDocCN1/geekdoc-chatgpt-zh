    ### 6.2.2 ResNet 残差模块的实现


    `ResNet`网络结构已经在上文做了介绍，它突破性地使用“模块化”思维去对网络进行叠加，从而实现了数据在模块内部特征的传递不会产生丢失。


    从图 6.10 可以看到，模块的内部实际上是 3 个卷积通道相互叠加，形成了一种瓶颈设计。对于每个残差模块，使用 3 层卷积。这 3 层分别是 1×1、3×3
    和 1×1 的卷积层，其中 1×1 层是负责先减少后增加（恢复）尺寸的，使 3×3 层具有较小的输入／输出尺寸瓶颈。


    ![](img/Figure-P147_22172.jpg)


    图 6.10　模块的内部


