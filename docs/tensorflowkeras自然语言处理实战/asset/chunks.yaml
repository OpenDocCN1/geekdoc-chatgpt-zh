    2.0`会自动为每个层中的参数分配一个递增的名称，因此这个工作可以交给`TensorFlow 2.0`完成。`batch_normalization`和`relu`分别为批处理层和激活层。


    在数据传递的过程中，`ResNet`模块使用了名为“`shortcut`”的“信息高速公路”。`shortcut`连接相当于简单执行了同等映射，不会产生额外的参数，也不会增加计算复杂度，如图6.11所示。整个网络可以依旧通过端到端的反向传播训练。代码如下：


