    编码器的作用要构造一种能够存储字符（词）的若干个特征的表达方式（这个特征具体是什么我们也不知道，这样做就行了），这个就是前文所说的`embedding`形式。


    本章开始将从一个“简单”的编码器开始，首先介绍其最核心的架构，以及整体框架的实现，并以此为基础引入编程实战，即对汉字和拼音转换的翻译。


    编码器并不是简单地使用，更重要的内容是在此基础上引入`transformer`架构的基础概念，这是一个目前来说最为流行和通用的编码器架构，并在此基础上衍生出了更多的内容，这在下一章会详细介绍。因此，本章以通用解码器为主，读者应将其当成独立的内容来学习。


    ## 9.1 编码器的核心——注意力模型


    编码器的作用就是对输入的字符序列进行编码处理，从而获得特定的词向量结果。为了简便起见，笔者直接使用`transformer`的编码器方案作为本章编码器的实现，这也是目前最为常用的编码器架构方案。编码器的结构如图9.2所示，由以下几个模块构成：


    - 初始词向量层（`Input Embedding`）。

    - 位置编码器层（`Positional Encoding`）。

    - 多头自注意力层（`Multi-Head Attention`）。

    - 前馈（`Feed Forward`）层。


    ![](OEBPS/Images/Figure-P221_30974.jpg)


    图9.2　编码器结构示意图


    实际上，编码器的构成模块并不是固定的，也没有特定的形式。`transformer`的编码器架构是目前最为常用的，因此本章将以此为例。本章首先介绍编码器的最核心内容：注意力模型和架构，并以此为主完成整个编码器的介绍和编写。


    ### 9.1.1 输入层——初始词向量层和位置编码器层


    初始词向量层和位置编码器层是数据输入的初始层，作用是将输入的序列通过计算并组合成向量矩阵，如图9.3所示。


    ![](OEBPS/Images/Figure-P222_31051.jpg)


    图9.3　输入层


    #### 第一层：初始词向量层


    如同大多数的向量构建方法一样，首先将每个输入单词通过词嵌入算法转换为词向量。其中，每个词向量被设定为固定的维度，本书后面将所有词向量的维度设置为312，具体代码段如下所示：


    ![](OEBPS/Images/Figure-P222_38371.jpg)


    首先使用`tf.keras.layers.Embedding`函数创建一个随机初始化的向量矩阵。其中，`encoder_vocab_size`是字库的个数，一般而言编码器中的字库是包含所有可能出现的“字”的集合；`embedding_size`是`embedding`向量维度，这里使用通用的312即可。


    词向量初始化在`TensorFlow 2.X`中只发生在最底层的编码器中。


    > 提示

    > 所有的编码器都有一个相同的特点——接收一个向量列表，列表中的每个向量大小为312维。在底层（最开始）的编码器中这个向量列表就是词向量，在其他编码器中是下一层编码器的输出。


    #### 第二层：位置编码


    位置编码是一个非常重要而又有创新性的结构输入。一般自然语言处理使用的都是一个个连续的长度序列，为了使用输入的顺序信息，需要将序列对应的相对以及绝对位置信息注入模型中去。


    位置编码和词向量`embeddings`可以设置成同样的维度，都是312，因此两者在计算时可以直接相加。目前来说位置编码的具体形式有两种，即可训练的参数形式和直接公式计算后的固定值：


    - 通过模型训练所得。

    - 根据特定公式计算所得（用不同频率的`sine`和`cosine`函数直接计算）。


    因此，在实际操作中，模型插入位置编码的方式既可以设计一个可以随模型训练的层，也可以使用一个计算好的矩阵直接插入序列的位置函数，公式如下：


    ![](OEBPS/Images/Figure-P223_37802.jpg)


    序列中任意一个位置都可以用三角函数表示，`pos`是输入序列的最大长度，`i`是序列中的各个位置，`d_model`是设定的与词向量相同的位置312。代码如下所示：


    ![](OEBPS/Images/Figure-P223_38373.jpg)


    这种位置编码函数的写法有点复杂，读者直接使用即可。最终将词向量矩阵和位置编码组合起来，如图9.4所示。


    ![](OEBPS/Images/Figure-P223_31154.jpg)


    图9.4　初始词向量


    ### 9.1.2 自注意力层（本书重点）


    自注意力层不仅是本节的重点，还是本书最重要的内容（实际非常简单）。


    注意力层是使用注意力机制构建的。注意力机制是能够脱离距离的限制建立相互关系的一种计算机制，最早是在视觉图像领域提出来的，来自于2014年“谷歌大脑”团队的论文“*Recurrent
    Models of Visual Attention*”，其在`RNN`模型上使用了注意力机制来进行图像分类。


    随后，Bahdanau等人在论文“*Neural Machine Translation by Jointly Learning to Align and
    Translate*”中使用类似注意力机制在机器翻译任务上将翻译和对齐同时进行，实际上是第一个将注意力机制应用到`NLP`领域中的。


    接下来机制被广泛应用在基于`RNN`/`CNN`等神经网络模型的各种`NLP`任务中。2017年，Google机器翻译团队发表的*Attention is
    all you need*中大量使用了自注意力（`self-attention`）机制来学习文本表示。自注意力机制也成为大家近期的研究热点，并在各种自然语言处理任务上进行探索。


    自然语言中的自注意力机制（`Self-attention`）通常指的是不使用其他额外的信息，仅仅使用自我注意力的形式关注本身，进而从句子中抽取相关信息。自注意力又称作内部注意力，在很多任务上都有十分出色的表现，比如阅读理解、文本继承、自动文本摘要。


    下面笔者将依次完成一个最简单的自注意力机制的介绍。


    > 建议

    > 先通读一遍，等完整阅读完本章后，结合实战代码部分重新阅读两遍以上。


    #### 第一步：自注意力中的`query`、`key`和`value`


    自注意力机制是进行自我关注从而抽取相关信息的机制。从具体实现上来看，注意力函数的本质可以被描述为一个查询（`query`）到一系列键（`key`）-值（`value`）对的映射，它们被作为一种抽象的向量，主要目的是用来做计算和辅助自注意力，如图9.5所示（更详细的解释在后面）。


    ![](OEBPS/Images/Figure-P224_31231.jpg)


    图9.5　自注意力机制


    一个单词Thinking经过向量初始化后，经过3个不同全连接层重新计算后获取特定维度的值，即看到的`q[1]`。`q[2]`的来历也是如此，对单词Machines经过`embedding`向量初始化后，经过与上一个单词相同的全连接层计算。之后依次将`q[1]`和`q[2]`连接起来组成一个新连接后的二维矩阵`W^Q`，被定义成`query`。


    ```

    WQ= concat([q1, q2],axis = 0)

    ```


    由于是“自注意力机制”，因此`key`和`value`的值与`query`相同（仅在自注意力架构中`query`、`key`、`value`的值相同），如图9.6所示。


    ![](OEBPS/Images/Figure-P225_31241.jpg)


    图9.6　自注意力机制


    #### 第二步：使用`query`、`key`和`value`计算自注意力的值


    其过程如下：


    （1）将`query`和每个`key`进行相似度计算得到权重，常用的相似度函数有点积、拼接、感知机等，这里笔者使用的是点积计算，如图9.7所示。


    ![](OEBPS/Images/Figure-P225_31242.jpg)


    图9.7　点积计算


    （2）使用一个`softmax`函数对这些权重进行归一化，如图9.8所示。


    `softmax`函数的作用是计算不同输入之间的权重“分数”，又称为权重系数。例如，正在考虑“Thinking”这个词，就用它的`q[1]`去乘以每个位置的`k[i]`，随后将得分加以处理再传递给`softmax`，然后通过`softmax`计算，其目的是使分数归一化。


    这个`softmax`计算分数决定了每个单词在该位置表达的程度。相关联的单词将具有相应位置上最高的`softmax`分数。用这个得分乘以每个`value`向量，可以增强需要关注单词的值，或者降低对不相关单词的关注度。


    ![](OEBPS/Images/Figure-P226_31250.jpg)


    图9.8　使用`softmax`函数


    `softmax`的分数决定了当前单词在每个句子中每个单词位置的表示程度。很明显，当前单词对应句子中此单词所在位置的`softmax`的分数最高，但是有时候注意力机制也能关注到此单词外的其他单词。


    （3）每个`value`向量乘以`softmax`后的得分，如图9.9所示。


    最后一步为累加计算相关向量。这会在此位置产生`self-attention`层的输出（对于第一个单词），即最后将权重和相应的键值`value`进行加权求和得到最后的注意力值。


    ![](OEBPS/Images/Figure-P226_31251.jpg)


    图9.9　乘以`softmax`


    总结自注意力的计算过程，（单词级别）就是得到一个可以放到前馈神经网络的向量。然而在实际的实现过程中，该计算会以矩阵的形式完成，以便更快地处理。自注意力公式如下：


    ![](OEBPS/Images/Figure-P227_31368.jpg)


    换成更为通用的矩阵点积的形式将其实现，其结构和形式如图9.10所示。


    ![](OEBPS/Images/Figure-P227_31369.jpg)


    图9.10　矩阵点积


    #### 第三步：自注意力计算的代码实现


    自注意力模型的基本架构并不复杂，基本代码如下所示（仅供演示）：


    ### 【程序9-1】

    ```

    import tensorflow as tf


    #创建一个输入embedding值

    input_embedding = tf.keras.Input(shape=[32,312])


    #对输入的input_embedding进行修正，这里进行了简写

    query = tf.keras.layers.Dense(312)(input_embedding)

    key = tf.keras.layers.Dense(312)(input_embedding)

    value = tf.keras.layers.Dense(312)(input_embedding)


    #计算query与key之间的权重系数

    attention_prob = tf.matmul(query,key,transpose_b=True)


    #使用softmax对权重系数进行归一化计算

    attention_prob = tf.nn.softmax(attention_prob)


    #计算权重系数与value的值从而获取注意力值

    attention_score = tf.matmul(attention_prob,value)


    print(attention_score)

    ```


    核心代码实现起来实际上是很简单的，到这里读者也只需先掌握这些核心代码即可。


    换个角度，笔者从概念上对注意力机制做个解释，注意力机制可以理解为从大量信息中有选择地筛选出少量重要信息并聚焦到这些重要信息上，忽略大多不重要的信息，这种思路仍然成立。聚焦的过程体现在权重系数的计算上，权重越大越聚焦于其对应的`Value`值上，即权重代表了信息的重要性，而权重与`Value`的点积是其对应的最终信息。


