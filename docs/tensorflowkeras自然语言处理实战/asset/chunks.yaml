    ### 3.3　反馈神经网络反向传播算法介绍


    反向传播算法是神经网络的核心与精髓，在神经网络算法中取到一个举足轻重的地位。


    用通俗的话说，反向传播算法就是复合函数的链式求导法则的一个强大应用，而且实际上的应用比理论上的推导强大得多。本节将主要介绍反向传播算法的一个简单模型的推导，虽然简单，但是这个简单的模型是反向传播算法应用最为广泛的基础。


    #### 3.3.1　深度学习基础


    机器学习在理论上可以看作统计学在计算机科学上的一个应用。在统计学上，一个非常重要的内容就是拟合和预测，即基于以往的数据，建立光滑的曲线模型实现数据结果与数据变量的对应关系。


    深度学习继承了统计学的应用领域，并且和统计学具有一样的目的，寻找结果与影响因素的一一对应关系，只不过样本点由狭义的`x`和`y`扩展到向量、矩阵等广义的对应点。此时，由于数据的复杂，对应关系模型的复杂度随之增加，而不能使用一个简单的函数表达。


    数学上通过建立复杂的高次多元函数解决复杂模型拟合的问题，但是大多数都失败了，因为过于复杂的函数式是无法进行求解的，也就是其公式的获取不可能。


    基于前人的研究，科研工作人员发现可以通过神经网络来表示这样的一个一一对应关系，而神经网络本质就是一个多元复合函数，通过增加神经网络的层次和神经单元可以更好地表达函数的复合关系。


    图 3.9 是多层神经网络的一个图像表达方式，这与我们在前面`TensorFlow`游乐场中看到的神经网络模型类似。事实上也是如此，通过设置输入层、隐藏层与输出层可以形成一个多元函数以求解相关问题。


    ![](img/Figure-P74_8828.jpg)


    图 3.9　多层神经网络的表示


    通过数学表达式将多层神经网络模型表达出来，如图 3.10 所示。


    ![](img/Figure-P74_37750.jpg)


    图 3.10　多层神经网络的数学表达


    其中，`x`是输入数值，`w`是相邻神经元之间的权重，也就是神经网络在训练过程中需要学习的参数。与线性回归类似的是，神经网络学习同样需要一个“损失函数”，即训练目标通过调整每个权重值`w`来使得损失函数最小。前面在讲解梯度下降算法的时候已经说过，如果权重过多或者指数过大，直接求解系数是一个不可能的事情，因此梯度下降算法是能够求解权重问题比较好的方法。


    #### 3.3.2　链式求导法则


    在前面梯度下降算法的介绍中，没有对其背后的原理做出更为详细的介绍。实际上梯度下降算法就是链式法则的一个具体应用，如果把前面公式中损失函数以向量的形式表示为：


    `h(x)=f(w[11],w[12],w[13],w[14],...,w[ij])`


    那么其梯度向量为：


    ![](img/Figure-P75_37752.jpg)


    可以看到，其实所谓的梯度向量就是求出函数在每个向量上的偏导数之和。这也是链式法则善于解决的方面。


