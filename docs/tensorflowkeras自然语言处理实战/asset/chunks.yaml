    终于在 TensorFlow 年满 3 岁之际，TensorFlow 迎来了一项革命性的变化，TensorFlow 2 横空出世，作为一个重要的里程碑，其理解和目标由注重自身框架结构的完整和逻辑性转向为偏重于“易用性”，使得初学者和使用者能够在极低的门槛上掌握和使用，TensorFlow
    2 的目标就是让每个人都能使用人工智能技术帮助自己的学习和生活的提高。


    本书以 TensorFlow 2.1 版本为基础进行编写，从 TensorFlow 2.1 的基础语法开始，到使用 TensorFlow 2.1 进行深度学习程序的设计和实战编写，全面介绍
    TensorFlow 2.1 核心内容和各方面涉及的相关知识。


    本书对 TensorFlow 2.1 核心内容进行深入分析，重要内容均结合代码进行实战讲解，围绕深度学习原理介绍大量实战案例，读者通过这些案例可以深入地了解和掌握
    TensorFlow 2.1 的内容，并对深度学习有进一步的了解。


    本书是一本面向初级和中级读者的优秀教程。通过本书的学习，读者能够掌握使用深度学习的基本内容和在 TensorFlow 框架下进行神经网络使用的知识要点，以及从模型的构建到应用程序的编写一整套应用技巧。


    ## 本书特色


    ### 1．版本新，易入门


    本书详细地介绍从 TensorFlow 2.1 的安装到使用、TensorFlow 默认 API，以及使用官方所推荐的 Keras 的编程方法与技巧等。


    ### 2．作者经验丰富，代码编写细腻


    作者是长期奋战在科研和工业界的一线算法设计和程序编写人员，实战经验丰富，对代码中可能会出现的各种问题和“坑”有丰富的处理经验，使得读者能够少走很多弯路。


    ### 3．理论扎实，深入浅出


    在代码设计的基础上，本书还深入浅出地介绍深度学习需要掌握的一些基本理论知识，通过大量的公式与图示结合的方式对理论做介绍，是一本难得的好书。


    ### 4．对比多种应用方案，实战案例丰富


    本书采用了大量的实例，同时也提供了一些实现同类功能的其他解决方案，覆盖了使用 TensorFlow 进行深度学习开发中常用的知识。


    ## 本书内容及知识体系


    本书基于 TensorFlow 2.1 版本的新架构模式和框架，完整介绍 TensorFlow 2.1 使用方法和一些进阶教程，主要内容如下：


    第 1 章详细介绍 TensorFlow 2.1 版本的安装方法以及对应的运行环境的安装，并且通过一个简单的例子验证 TensorFlow 2.1 的安装效果，并将其作为贯穿全书学习的主线。在本章还介绍了
    TensorFlow 硬件的采购。请记住，一块能够运行 TensorFlow 2.0 GPU 版本的显卡能让你的学习事半功倍。


    第 2 章是本书的重点，从模型的设计开始，循序渐进地介绍 TensorFlow 2.1 的编程方法和步骤，包括结合 Keras 进行 TensorFlow
    2.1 模型设计的完整步骤，以及自定义层的方法。第 2 章的内容看起来很简单，却是本书的基础内容和核心精华，读者一定要反复阅读，认真掌握所有内容和代码的编写。


    第 3 章是 TensorFlow 2.1 的理论部分，介绍反馈神经网络的实现和最核心的两个算法，作者通过图示并结合理论公式的方式认真详细地介绍理论和原理并且手动实现一个反馈神经网络。


    使用卷积神经网络去识别物体是深度学习一个经典内容，第 4 章详细介绍卷积神经网络的原理、各个模型的使用和自定义内容，借助卷积神经网络（CNN）算法构建一个简单的
    CNN 模型进行 MNIST 数字识别。此章和第 2 章同为本书的重点内容，能够极大地协助读者对 TensorFlow 框架的使用和程序的编写。


    第 5 章是 TensorFlow 新版本的数据读写部分，详细介绍使用 TensorFlow 2.1 自带的 Dataset API 对数据的序列化存储，并通过简单的方法使用
    TensorFlow Dataset 对数据进行读取和调用。


    第 6 章介绍 ResNet 的基本思想和内容。ResNet 是一个具有里程碑性质的框架，标志着粗犷的卷积神经网络设计向着精确化和模块化的方向转化。ResNet
    本身的程序编写非常简单，其中蕴含的设计思想却是跨越性的。


    第 7 章主要介绍自然语言处理最基本的词嵌入的训练和使用，从一个有趣的问题引导读者从文本清洗开始，到词嵌入的计算以及利用文本的不同维度和角度对文本进行拆分。


    第 8 章开始进行了更为细化的自然语言处理部分，即复习本书前面章节学习和掌握的自然语言处理手段，练习使用不同的技巧实战前面部分的文本分类，扎扎实实地解决一个事实中存在的问题。


    第 9、10 章向读者展示目前自然语言处理研究的最先进手段，即利用编码器和解码器对数据进行处理。本书分别使用编码器模型和解码器模型去解决一个实际问题，并通过对其细节的不同做出对比，向读者更加完整详细地介绍编码器与解码器的应用场景和不同，为后续的学习打下基础。这也是自然语言处理研究的方向。


