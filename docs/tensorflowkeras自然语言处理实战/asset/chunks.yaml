    `(50, 32, 32, 32)`


    #### 3. dense 简介

    `dense`是全连接层。layers 中提供了一个专门的函数来实现此操作，即`tf.layers.dense`，其结构如下：


    ```

    def __init__(self,

    units,

    activation=None,

    use_bias=True,

    kernel_initializer=''glorot_uniform'',

    bias_initializer=''zeros'',

    kernel_regularizer=None,

    bias_regularizer=None,

    activity_regularizer=None,

    kernel_constraint=None,

    bias_constraint=None,

    **kwargs):

    ```


    参数说明如下：


    · `units`：必需，神经元的数量。

    · `activation`：可选，默认为 None。若为 None，则是线性激活。

    · `use_bias`：可选，是否使用偏置，默认为 True。

    · `kernel_initializer`：可选，权重的初始化方法，默认为 None。

    · `bias_initializer`：可选，偏置的初始化方法，默认为零值初始化。


