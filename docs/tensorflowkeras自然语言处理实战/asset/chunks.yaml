    似乎还有一个问题，对于自定义的层来说，这里的参数名（也就是在`build`中定义的参数名）都是一样。在层生成的过程中似乎并没有对每个层进行重新命名或者将其归属于某个命名空间中。这似乎与传统的`TensorFlow`
    1.X 模型的设计结果相冲突。


    实践是解决疑问的最好办法。`TensorFlow`中提供了打印模型结构的函数，代码如下：


    ```

    print(model.summary())

    ```


    使用时将这个函数置于构建后的`model`下，即可打印模型的结构与参数。


    **【程序 2-11】**


    ![](img/Figure-P57_38163.jpg)


    打印结果如图 2.14 所示。


    ![](img/Figure-P58_21018.jpg)


    图 2.14　打印结果


    从打印出的模型结构可以看到，这里每一层都根据层的名称重新命名，而且由于名称相同，`TensorFlow`框架自动根据其命名方式对其进行层数的增加（名称）。


    对于读者更为关心的参数问题，从对应行的第三列`param`可以看到，不同的层，其参数个数也不相同，因此可以认为在`TensorFlow`中重名的模型被自动赋予一个新的名称，并存在于不同的命名空间之中。


