    \n#### 3．在浏览器中查看TensorBoard\n\n一般使用chrome核心的浏览器都可以对TensorBoard进行浏览。笔者使用QQ浏览器打开TensorBoard，输入地址如下：\n\
    \n```\n     http://localhost:6006\n```\n\n打开的页面如图5.18所示。\n\n![](OEBPS/Images/Figure-P129_14426.jpg)\n\
