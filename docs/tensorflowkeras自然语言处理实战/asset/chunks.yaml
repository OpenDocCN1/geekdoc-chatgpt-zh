    # 第 2 章

    Hello TensorFlow & Keras


    本章开始将正式进入自然语言进行处理的学习。


    “工欲善其事，必先利其器。”使用深度学习理论对自然语言进行处理，一个得心应手的工具是必不可少的，而`TensorFlow`就是这个工具。第 1 章给出了情感分类的实战供读者参考，相信读者一定会对使用`TensorFlow`解决情感分类的问题所涉及的代码量感到吃惊，事实上也是如此。


