    ## 7.3 针对文本的卷积神经网络模型简介——字符卷积


    卷积神经网络在图像处理领域获得了极大成功，其结合特征提取和目标训练为一体的模型能够最好地利用已有的信息对结果进行反馈训练。


    对于文本识别的卷积神经网络来说，同样也是充分利用特征提取时提取的文本特征来计算文本特征权值大小的，归一化处理需要处理的数据。这样使得原来的文本信息抽象成一个向量化的样本集，之后将样本集和训练好的模板输入卷积神经网络进行处理。


    本节将在上一节的基础上使用卷积神经网络实现文本分类的问题，这里将采用两种主要基于字符和基于`word embedding`形式的词卷积神经网络处理方法。实际上，无论是基于字符的还是基于`word
    embedding`形式的处理方式都是可以相互转换的，这里只介绍使用基本的使用模型和方法，更多的应用还需要读者自行挖掘和设计。


    ### 7.3.1 字符（非单词）文本的处理


