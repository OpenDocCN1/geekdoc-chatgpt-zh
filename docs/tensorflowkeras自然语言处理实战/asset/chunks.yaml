    ## 7.5　使用卷积对文本分类的补充内容


    在上面的章节中，笔者通过不同的卷积（一维卷积和二维卷积）实现了文本的分类，并且通过使用`gensim`掌握了对文本进行词向量转化的方法。词向量`word embedding`是目前最常用的将文本转成向量的方法，比较适合较为复杂词袋中词组较多的情况。


    使用`one-hot`方法对字符进行表示是一种非常简单的方法，但是其使用受限较大，产生的矩阵较为稀疏，因此在实用性上并不是很强，笔者在这里统一推荐使用`word
    embedding`的方式对词进行处理。


    可能有读者会产生疑问，使用`word2vec`的形式来计算字符的“字向量”是否可行？答案是完全可以，并且准确度相对于单纯采用`one-hot`形式的矩阵表示能有更好的表现和准确度。


