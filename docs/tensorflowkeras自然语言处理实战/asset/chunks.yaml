    \ 5.3.2　数据集的调整\n\n前面章节介绍了卷积的计算方法，目前对于图形图像的识别和分类问题，卷积神经网络是最优选，因此在将数据输入到模型之前需要将其修正为符合卷积模型输入条件的格式，代码如下：\n\
    \n```\n     train_images = tf.expand_dims(train_images,axis=3)\n     test_images\
    \ = tf.expand_dims(test_images,axis=3)\n     \n     print(train_images.shape)\n\
    \     print(test_images.shape)\n```\n\n打印结果如下：\n\n![](OEBPS/Images/Figure-P119_13399.jpg)\n\
    \n### 5.3.3　使用Python类函数建立模型\n\n分辨模型的建立是将图进行了`flatten`处理，即将其拉平使用全连接层参数来对结果进行分类和识别，本例将使用Keras\
    \ API中的二维卷积层对图像进行分类，代码如下：\n\n![](OEBPS/Images/Figure-P119_38234.jpg)\n\n`tf.keras.layers.Conv2D`是由若干个卷积层组成的二维卷积层。层中的每个卷积核从前一层的`[3,3]`大小的节点中获取输入，根据训练过程中将学习到的隐藏层参数对输入进行加权，并将单个值输出到下一层。`padding`是补全操作，由于经过卷积运算输入的图形大小维度发生了变化，因此通过一个`padding`可以对其进行补全。当然也可以不进行补全，这个由读者自行确定。\n\
    \n`tf.keras.layers.Dense`的作用是对生成的图像进行分类，按要求分成10个部分。可能有读者会注意到，这里使用全连接层做分类器是不可能实现的，因为输入数据经过卷积计算结果是一个4维的矩阵模型，而分类器实际上是对二维的数据进行计算，这点请读者自行参考模型的建立代码。\n\
    \n模型的完整代码如下：\n\n**【程序5-2】**\n\n![](OEBPS/Images/Figure-P120_38235.jpg)\n\n在这里笔者使用了3个卷积层和3个`batch_normalization`作为正则化层，之后使用`flatten`函数将数据拉平并重新排列，提供给分类器使用，这也解决了分类器数据输入的问题。\n\
    \n**注意**\n\n笔者使用了正统的模型类的定义方式，首先生成一个`FashionClassic`类名，在`__init__`函数中对所有需要用到的层进行定义，而在`__call__`函数中对其进行了调用。如果读者不是很熟悉Python类的定义和使用，请自行查阅Python类中`__call__`函数和`__init__`函数的用法。\n\
    \n### 5.3.4　Model的查看和参数打印\n\nTensorFlow 2.X提供了将模型进行组合和建立的函数，代码如下：\n\n![](OEBPS/Images/Figure-P120_13608.jpg)\n\
    \n与传统的TensorFlow类似，这里的`Input`函数创建了一个占位符，提供了数据的输入口；之后直接调用分类函数获取占位符的输出结果，从而虚拟达成了一个类的完整形态；之后的`Model`函数建立了输入与输出连接，从而建立了一个完整的TensorFlow模型。\n\
    \n下面一步是对模型的展示。TensorFlow 2.X通过调用Keras作为高级API可以将模型的大概结构和参数打印出来，使用代码如下：\n\n```\n\
    \     print(model.summary())\n```\n\n打印结果如图5.8所示。\n\n![](OEBPS/Images/Figure-P121_13636.jpg)\n\
