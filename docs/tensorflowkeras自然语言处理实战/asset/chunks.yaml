    ## TF-IDF 原理与实现


    TF-IDF的主要思想是：如果某个词或短语在一篇文章中出现的频率`TF`高，并且在其他文章中很少出现，则认为此词或者短语具有很好的类别区分能力，适合用来分类。其中，`TF`（Term
    Frequency）表示词条在文章`Document`中出现的频率。


    ![](OEBPS/Images/Figure-P170_37790.jpg)


    `IDF`（Inverse Document Frequency）的主要思想就是，包含某个词`Word`的文档越少，这个词的区分度越大，也就是`IDF`越大。


    ![](OEBPS/Images/Figure-P170_37792.jpg)


    `TF-IDF`的计算实际上就是`TF`×`IDF`：


    `TF-IDF`=词频×逆文档频率=`TF`×`IDF`


