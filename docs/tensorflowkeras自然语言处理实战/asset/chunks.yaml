    \n首先回答10.2节提出的2个问题。\n\n问1：相对于编码器的转换模型，编码器-解码器的翻译模型有什么区别？\n\n答：对于转换模型来说，模型在工作时不需要对其进行处理，默认所有的信息都包含在编码器编码的词嵌入embedding中，最后直接做softmax计算即可。编码器-解码器的翻译模型需要综合编码器的编码内容和解码器原始输入共同完成后续的交互计算。\n\
    \n问2：做拼音汉字的翻译系统，编码器和解码器的输入端分别输入什么内容？\n\n答：编码器的输入端是汉字，解码器的输入端是错位的拼音。\n\n本章和上一章是相互衔接的章节，主要是对当前最新的模型transformer进行介绍和说明，从架构入手，对主要架构部分、编码器和解码器进行详细介绍，并且还介绍了各种ticks和小的细节，有针对性地对模型优化做了说明。\n\
    \n读者在学习这两章的时候一定要多加阅读，掌握全部内容。相对于目前和后续的自然语言处理问题，transformer架构是最为重要和基础的内容。"
  fmt: "\n![](OEBPS/Images/Figure-P253_39789.jpg)\n\n打印结果和演示请读者自行完成。\n\n如果需要更进一步地提高准确率，需要对掩码进行进一步的处理：\n\
    \n![](OEBPS/Images/Figure-P253_39790.jpg)\n\n下面的代码段合成了`pad_mask`和`look_ahead_mask`，并通过`maximum`函数建立与或门将其合成为一体，即：\n\
    \n![](OEBPS/Images/Figure-P253_39791.jpg)\n\n这样的处理是最大限度地将无用部分进行“掩码操作”，从而使得解码器的输入（`query`）与编码器的输入（`key`，`value`）能够最大限度地融合在一起，减少干扰。\n\
    \n### 10.1.2　为什么通过掩码操作能够减少干扰\n\n`query`和`value`在进行点积计算时，会产生大量的负值，而负值在进行`softmax`计算时，会对平衡产生影响，所以在注意力层中通过掩码操作能够减少干扰，具体代码如下所示：\n\
    \n**【程序10-1】**\n\n```\n     import tensorflow as tf\n     \n     query = tf.random.truncated_normal(shape=[4,4])\n\
    \     key = value = tf.random.truncated_normal(shape=[4,4])\n     \n     att =\
    \ (tf.matmul(query,key,transpose_b=True))\n     print(att)\n     \n     att_softmax\
    \ = tf.nn.softmax(att)\n     print(att_softmax)\n```\n\n结果如图10.7所示。\n\n![](OEBPS/Images/Figure-P255_35134.jpg)\n\
    \n图10.7　打印结果\n\n实际上这些负值是不需要的，因此需要在计算本身的基础上加上一个“负无穷”，以降低负值对`softmax`计算的影响（一般使用-1e5即可）。\n\
    \n### 10.1.3　解码器的输出（移位训练方法）\n\n前面两节介绍了解码器的一些基本操作，本节将主要简要介绍解码器在最终阶段对解码的变化和一些相关的细节，如图10.8所示。\n\
    \n![](OEBPS/Images/Figure-P255_35135.jpg)\n\n图10.8　解码器的输出\n\n解码器通过交互注意力的计算选择将当前的解码器词嵌入`embedding`关注到编码器词嵌入的`embedding`中，选择生成一个新的词嵌入`embedding`。\n\
    \n这是整体的步骤，当程序开始启动时，首先将编码器中的词嵌入全部输入，解码器首先接受一个起始符号的词嵌入`embedding`，从而生成第一个解码的结果。\n\
    \n这种输入和输出错位的训练方法是“移位训练”方法。\n\n接下来的步骤重复了这个过程，每个步骤的输出在下一个时间步被提供给底端解码器，并且就像编码器之前做的那样，这些解码器会输出它们的解码结果，直到到达一个特殊的终止符号，它表示编码器-解码器架构已经完成了它的输出。\n\
    \n还有一点需要补充的是，解码器栈输出一个词嵌入`embedding`。那么怎么把它变成一个词呢？这是最后一个线性层的工作，使用了一个`softmax`层。\n\
    \n全连接层是一个简单的全连接神经网络，它将解码器栈产生的向量投影到一个更高维向量（`output`）上。\n\n之后的`softmax`层将这些分数转换为概率。选择概率最大的维度，并对应地生成与之关联的字或者词作为此时间步的输出。\n\
