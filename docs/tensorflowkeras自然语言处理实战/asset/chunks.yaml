    图像和其他信号的局部统计特征与其位置是不太相关的，如果特征图能在图片的一个部分出现，就能出现在任何地方。所以不同位置的单元共享同样的权重，并在数组的不同部分探测相同的模式。


    数学上，这种由一个特征图执行的过滤操作是一个离散的卷积，卷积神经网络由此得名。


    池化层的作用是对获取的图像特征进行缩减，从前面的例子中可以看到，使用`[2,2]`大小的矩阵来处理特征矩阵，使得原有的特征矩阵可以缩减到1/4大小，特征提取的池化效应如图4.10所示。


