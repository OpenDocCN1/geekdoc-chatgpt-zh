    ### 7.6 本章小结


    卷积神经网络并不是只能对图像进行处理，在本章中演示了使用卷积神经网络对文本进行分类的方法。对于文本处理来说，传统的基于贝叶斯分类和循环神经网络（`RNN`）实现的文本分类方法，卷积神经网络一样可以实现，而且效果并不比上面的差。


    卷积神经网络的应用非常广泛，通过正确的数据处理和建模可以达到程序设计人员心中所要求的目标，更为重要的是，相对于循环神经网络（`RNN`）来说，卷积神经网络在训练过程中的训练速度更快（并发计算）、处理范围更大（图矩阵）、能够获取更多的相互联系（感受野）。因此，卷积神经网络在机器学习中会有越来越重要的作用。


    预训练`embedding`内容是本章新加入的部分。使用`word embedding`等价于把`embedding`层的网络用预训练好的参数矩阵初始化了，但是只能初始化第一层网络参数，再高层的参数则无能为力。


    下游NLP任务在使用`word embedding`的时候一般有两种做法：一种是`Frozen`，就是`word embedding`那层网络参数固定不动；另外一种是`Fine-Tuning`，就是`word
    embedding`这层参数随着训练过程被不断更新。具体采用哪种方法需要使用者在实践中不断尝试并根据结果做出选择。


    # 第8章 实战——站在冠军肩膀上的情感分类实战


    在本书的前言部分，笔者介绍了一个情感分类的实现，相信看到本章的读者一定对模型的架构和实现不再陌生。本章将继续深入挖掘做基本情感分类所涉及的内容，特别是一个没有涉及的层——`GRU`（`Gate
    Recurrent Unit`）层。本章将对此进行介绍。


    此外，为了更好地帮助读者了解情感分类的实战，本章将介绍更多的模型进行情感分类的程序设计，在介绍不同的模型和使用状况的基础上，也能够更好地帮助读者巩固和复习前期的学习内容。


    ## 8.1 GRU与情感分类


    本书的第1章就实现了一个基础的情感分类任务，虽然较为简单，但是对于一个完整的项目来说，其所要求的各个部分都是完整无缺的。


    ### 8.1.1 什么是GRU


    `GRU`（`Gate Recurrent Unit`）是循环神经网络（`Recurrent Neural Network, RNN`）的一种，是为了解决长期记忆和反向传播中的梯度等问题而提出来的一种神经网络结构，是一种用于处理序列数据的神经网络。`GRU`更擅长于处理序列变化的数据，比如某个单词的意思会因为上文提到的内容不同而有不同的含义。


    #### 1. GRU的输入与输出结构


    `GRU`的输入与输出结构如图8.1所示。


    ![](OEBPS/Images/Figure-P206_29330.jpg)


    图8.1　`GRU`的输入与输出结构


    通过`GRU`的输入输出结构可以看到，在`GRU`中有一个当前的输入`x^t`，和上一个节点传递下来的隐状态（hidden state）`h^t^(-1)`，这个隐状态包含了之前节点的相关信息。


    结合`x^t`和`h^t^(-1)`，`GRU`会得到当前隐藏节点的输出`y^t`和传递给下一个节点的隐状态`h^t`。


    #### 2. 门——GRU的重要设计


    一般认为，“门”是`GRU`能够替代传统的`RNN`循环网络起作用的原因。先通过上一个传输下来的状态`h^t^(-1)`和当前节点的输入`x^t`来获取两个门控状态，如图8.2所示。


    ![](OEBPS/Images/Figure-P206_29331.jpg)


    图8.2　两个门控状态


    其中，`r`控制重置的门控（reset gate），`z`控制更新的门控（update gate），`σ`为`sigmoid`函数，通过这个函数可以将数据变换为0~1范围内的数值，充当门控信号。


    得到门控信号之后，首先使用重置门控来得到“重置”之后的数据`h^(t(-1)'') = h^t^(-1) × r`，再将`h^(t(-1)'')`与输入`x^t`进行拼接，再通过一个`tanh`激活函数来将数据放缩到-1~1的范围内，即得到如图8.3所示的`h′`。


    ![](OEBPS/Images/Figure-P206_29332.jpg)


    图8.3　得到`h′`


    这里的`h′`主要是包含了当前输入的`x^t`数据。有针对性地对`h′`添加到当前的隐藏状态，相当于“记忆了当前时刻的状态”。


    #### 3. GRU的结构


    最后介绍`GRU`最关键的一个步骤，可以称之为“更新记忆”阶段。在这个阶段，`GRU`同时进行了遗忘和记忆两个步骤，如图8.4所示。


    ![](OEBPS/Images/Figure-P207_29342.jpg)


    图8.4　更新记忆


    使用了先前得到的更新门控（update gate）“`z`”，从而能够获得新的更新，公式如下：


    `h^t = z × h^t^(-1) + (1 - z) × h′`


    公式说明如下：


    `z × h^t^(-1)`：表示对原本隐藏状态的选择性“遗忘”。这里的`z`可以想象成遗忘门（forget gate），忘记`h^t^(-1)`维度中一些不重要的信息。


    `(1 - z) × h′`：表示对包含当前节点信息的`h′`进行选择性“记忆”。与上面类似，这里的`1 - z`会忘记`h′`维度中一些不重要的信息。或者，这里我们更应当看作是对`h′`维度中的某些信息进行选择。


    因此，整个公式的操作就是忘记传递下来的`h^t^(-1)`中的某些维度信息，并加入当前节点输入的某些维度信息。


    可以看到，这里的遗忘`z`和选择`1 - z`是联动的。也就是说，对于传递进来的维度信息，我们会进行选择性遗忘。遗忘了多少权重（`z`），我们就会使用包含当前输入的`h′`中所对应的权重弥补`1
    - z`的量，从而使得`GRU`的输出保持一种“恒定”状态。


    ### 8.1.2 使用GRU的情感分类


    使用`GRU`的情感分类代码如程序8-1所示，这里笔者就不再过多解释了，相信读者已经有能力完整运行。本节的重点集中在一个新类（`tf.keras.layers.GRU`）上。


    **【程序8-1】**


    ![](OEBPS/Images/Figure-P208_38358.jpg)


    ### 8.1.3 TensorFlow中的GRU层详解


    从前面的情感分类实现相信读者已经了解了如何使用`GRU`在深度学习模型中进行计算，下面详细介绍`GRU`函数的参数及说明。


    ```

    keras.layers.recurrent.GRU(units, activation=''tanh'',

    recurrent_activation=''hard_sigmoid'', use_bias=True,

    kernel_initializer=''glorot_uniform'', recurrent_initializer=''orthogonal'',

    bias_initializer=''zeros'', kernel_regularizer=None, recurrent_regularizer=None,

    bias_regularizer=None, activity_regularizer=None, kernel_constraint=None,

    recurrent_constraint=None, bias_constraint=None, dropout=0.0,

    recurrent_dropout=0.0)

    ```


    参数说明如下：


    - `units`：输出维度。

    - `activation`：激活函数，为预定义的激活函数名（参考激活函数）。

    - `use_bias`：布尔值，是否使用偏置项。

    - `kernel_initializer`：权值初始化方法，为预定义初始化方法名的字符串或用于初始化权重的初始化器。

    - `recurrent_initializer`：循环核的初始化方法，为预定义初始化方法名的字符串或用于初始化权重的初始化器。

    - `bias_initializer`：权值初始化方法，为预定义初始化方法名的字符串或用于初始化权重的初始化器。

    - `kernel_regularizer`：施加在权重上的正则项。

    - `bias_regularizer`：施加在偏置向量上的正则项。

    - `recurrent_regularizer`：施加在循环核上的正则项。

    - `activity_regularizer`：施加在输出上的正则项。

    - `kernel_constraints`：施加在权重上的约束项。

    - `recurrent_constraints`：施加在循环核上的约束项。

    - `bias_constraints`：施加在偏置上的约束项。

    - `dropout`：0~1之间的浮点数，控制输入线性变换的神经元断开比例。

    - `recurrent_dropout`：0~1之间的浮点数，控制循环状态线性变换的神经元断开比例。


    ### 8.1.4 单向不行就双向


    在程序8-1中，在Keras的`GUR`层外面还套有一个前面没有出现过的函数：


    ```

    tf.keras.layers.Bidirectional

    ```


    `Bidirectional`函数是双向传输函数，其目的是将相同的信息以不同的方式呈现给循环网络，可以提高精度并缓解遗忘问题。双向`GRU`是一种常见的`GRU`变体，常用于自然语言处理任务。


    `GRU`特别依赖于顺序或时间，按顺序处理输入序列的时间步，而打乱时间步或反转时间步会完全改变`GRU`从序列中提取的表示。正是由于这个原因，如果顺序对问题很重要（比如室温预测等问题），那么`GRU`的表现会很好。双向`GRU`利用了这种顺序敏感性，每个`GRU`分别沿一个方向对输入序列进行处理（时间正序和时间逆序），然后将它们的表示合并在一起（见图8.5）。通过沿这两个方向处理序列，双向`GRU`捕捉到可能被单向`GRU`的模式。


    ![](OEBPS/Images/Figure-P210_29654.jpg)


    图8.5　双向`GRU`


    一般来说，按时间正序的模型会优于时间逆序的模型。对于文本分类等问题来说，一个单词对理解句子的重要性通常并不取决于它在句子中的位置，即用正序序列和逆序序列，或者随机打断“词语（不是字）”出现的位置，分别训练并且评估要给`GRU`，性能几乎相同。这证实了一个假设：虽然单词顺序对理解语言很重要，但使用哪种顺序并不重要。


    ![](OEBPS/Images/Figure-P210_37801.jpg)


    双向循环层还有一个好处——在机器学习中，如果一种数据表示不同但有用，那么总是值得加以利用的。这种表示与其他表示的差异越大越好，它们提供了查看数据的全新角度，抓住了数据中被其他方法忽略的内容，因此可以提高模型在某个任务上的性能。


    至于`tf.keras.layers.Bidirectional`函数的使用，请读者记住笔者的使用方法，直接套在`GRU`层的外部即可。


