    \n### 3.4　本章小结\n\n本章是较为理论的部分，主要讲解`TensorFlow`的核心算法：反向传播算法。虽然在编程中可能并不需要显式地使用反向传播，或者框架自动完成了反向传播的计算，但是了解和掌握`TensorFlow`的反向传播算法能使得读者在程序的编写过程中事半功倍。\n\
    \n# 第4章  \n卷积层与MNIST实战\n\n从本章开始将进入本书的重要部分——卷积神经网络的介绍。\n卷积神经网络是从信号处理衍生过来的一种对数字信号处理的方式，发展到图像信号处理上演变成一种专门用来处理具有矩阵特征的网络结构处理方式。卷积神经网络在很多应用上都有独特的优势，甚至可以说是无可比拟的，例如音频的处理和图像处理。\n\
    本章将会介绍什么是卷积神经网络，介绍卷积实际上是一种不太复杂的数学运算，即卷积是一种特殊的线性运算形式。之后会介绍“池化”这一概念，这是卷积神经网络中必不可少的操作。另外，为了消除过拟合会介绍`drop-out`这一常用的方法。这些概念是为了让卷积神经网络运行得更加高效的一些常用方法。\n\
    \n### 4.1　卷积运算基本概念\n\n在数字图像处理中有一种基本的处理方法，即线性滤波。它将待处理的二维数字看作一个大型矩阵，图像中的每个像素可以看作矩阵中的每个元素，像素的大小就是矩阵中的元素值。\n\
    使用的滤波工具是另一个小型矩阵，这个矩阵被称为卷积核。卷积核的大小远远小于图像矩阵，具体的计算方式就是对于图像大矩阵中的每个像素，计算其周围的像素和卷积核对应位置的乘积，之后将结果相加最终得到的终值就是该像素的值，这样就完成了一次卷积。最简单的图像卷积方式如图4.1所示。\n\
    本节将详细介绍卷积的运算、定义以及一些细节调整的介绍，这些都是卷积使用中必不可少的内容。\n![](OEBPS/Images/Figure-P88_10347.jpg)\n\
    图4.1　卷积运算\n\n#### 4.1.1　卷积运算\n\n前面已经说过了，卷积实际上是使用两个大小不同的矩阵进行的一种数学运算。为了便于读者理解，我们从一个例子开始。\n\
    对高速公路上的跑车进行位置追踪，这也是卷积神经网络图像处理一个非常重要的应用。摄像头接收到的信号被计算为`x(t)`，表示跑车在路上时刻`t`的位置。\n\
    实际上的处理往往没有那么简单，因为在自然界无时无刻不面临各种影响和摄像头传感器的滞后。为了得到跑车位置的实时数据，采用的方法就是对测量结果进行均值化处理。对于运动中的目标，时间越久的位置则越不可靠，时间离计算时越短的位置则对真实值的相关性越高。因此，可以对不同的时间段赋予不同的权重，即通过一个权值定义来计算。这个可以表示为：\n\
    `s(t)=∫x(a)ω(t-a)da`\n这种运算方式被称为卷积运算。换个符号表示为：\n`s(t)=(x*ω)(t)`\n在卷积公式中，第一个参数`x`被称为“输入数据”，第二个参数`ω`被称为“核函数”，`s(t)`是输出，即特征映射。\n\
    对于稀疏矩阵（见图4.2）来说，卷积网络具有稀疏性，即卷积核的大小远远小于输入数据矩阵的大小。例如，当输入一个图片信息时，数据的大小可能为上万的结构，但是使用的卷积核却只有几十，这样能够在计算后获取更少的参数特征，极大地减少了后续的计算量。\n\
    ![](OEBPS/Images/Figure-P89_10463.jpg)\n图4.2　稀疏矩阵\n参数共享指的是在特征提取过程中不同输入值的同一个位置区域上会使用相同的参数，在传统的神经网络中，每个权重只对其连接的输入输出起作用，当其连接的输入输出元素结束后就不会再用到。而在卷积神经网络中卷积核的每一个元素都被用在输入的同一个位置上，在过程中只需学习一个参数集合，就能把这个参数应用到所有的图片元素中。\n\
    **【程序4-1】**\n![](OEBPS/Images/Figure-P89_38191.jpg)\n程序4-1实现了由`Python`实现的卷积操作，这里卷积核从左到右、从上到下进行卷积计算，最后返回新的矩阵。\n\
    \n#### 4.1.2　TensorFlow中卷积函数实现详解\n\n前面章节中通过`Python`实现了卷积的计算，`TensorFlow`为了框架计算的迅捷同样也使用了专门的函数`Conv2D(Conv)`作为卷积计算函数。这个函数是搭建卷积神经网络最为核心的函数之一，非常重要。（卷积层的具体内容请读者参考相关资料自行学习，本书将不再展开讲解。）\n\
    ![](OEBPS/Images/Figure-P90_38192.jpg)\n`Conv2D(Conv)`是`TensorFlow`的卷积层自带的函数，最重要的5个参数如下：\n\
    · `filters`：卷积核数目，卷积计算时折射使用的空间维度。\n· `kernel_size`：卷积核大小，要求是一个`Tensor`，具有`[filter_height,\
    \ filter_width, in_channels, out_channels]`这样的`shape`，具体含义是`[卷积核的高度，卷积核的宽度，图像通道数，卷积核个数]`，要求类型与参数`input`相同。有一个地方需要注意，第三维`in_channels`就是参数`input`的第四维。\n\
    · `strides`：步进大小，卷积时在图像每一维的步长，这是一个一维的向量，第一维和第四维默认为1，第三维和第四维分别是平行和竖直滑行的步进长度。\n\
    · `padding`：补全方式，`string`类型的量，只能是`\"SAME\"`和`\"VALID\"`其中之一，这个值决定了不同的卷积方式。\n·\
    \ `activation`：激活函数，一般使用`relu`作为激活函数。\n**【程序4-2】**\n```\nimport tensorflow as\
    \ tf\ninput = tf.Variable(tf.random.normal([1, 3, 3, 1]))\nconv = tf.keras.layers.Conv2D(1,2)(input)\n\
    print(conv)\n```\n程序4-2展示了一个使用`TensorFlow`高级`API`进行卷积计算的例子，在这里随机生成了一个`[3,3]`大小的矩阵，之后使用1个大小为`[2,2]`的卷积核对其进行计算，打印结果如图4.3所示。\n\
    ![](OEBPS/Images/Figure-P90_10554.jpg)\n图4.3　打印结果\n可以看到，卷积对生成的随机数据进行计算，重新生成了一个`[1,2,2,1]`大小的卷积结果。这是由于卷积在工作时边缘被处理消失，因此生成的结果小于原有的图像。\n\
    有时候需要生成的卷积结果和原输入矩阵的大小一致，需要将参数`padding`的值设为`\"VALID\"`，当其为`\"SAME\"`时，表示图像边缘将由一圈0补齐，使得卷积后的图像大小和输入大小一致，示意如下：\n\
    00000000000\n0xxxxxxxxx0\n0xxxxxxxxx0\n0xxxxxxxxx0\n00000000000\n这里`x`是图片的矩阵信息，外面一圈是补齐的0，而0在卷积处理时对最终结果没有任何影响。这里略微对其进行修改，如程序4-3所示。\n\
    **【程序4-3】**\n![](OEBPS/Images/Figure-P91_39536.jpg)\n这里只打印最终卷积计算的维度大小，结果如下：\n\
    ```\n(1, 5, 5, 1)\n```\n可以看到这里最终生成了一个`[1,5,5,1]`大小的结果，这是由于在补全方式上笔者采用了`\"SAME\"\
    `的模式对其进行处理。\n下面再换一个参数，在前面的代码中`stride`的大小使用的是默认值`[1,1]`，此时如果把`stride`替换成`[2,2]`，即步进大小设置成2，代码如下：\n\
    **【程序4-4】**\n```\nimport tensorflow as tf\ninput = tf.Variable(tf.random.normal([1,\
    \ 5, 5, 1]))\nconv = tf.keras.layers.Conv2D(1,2,strides=[2,2],padding=\"SAME\"\
    )(input)\n#strides的大小被替换\nprint(conv.shape)\n```\n最终打印结果：\n```\n(1, 3, 3, 1)\n\
    ```\n可以看到，即使是采用`padding=\"SAME\"`模式填充，生成的结果也不再是原输入的大小，而是维度有了变化。\n最后总结一下经过卷积计算后结果图像的大小变化公式：\n\
    `N=(W-F+2P)/S+1`\n· 输入图片大小为`W×W`。\n· `Filter`大小为`F×F`。\n· 步长为`S`。\n· `padding`的像素数为`P`，一般情况下`P=1`。\n\
    读者可以自行验证。\n\n#### 4.1.3　池化运算\n\n在通过卷积获得了特征（`features`）之后，下一步希望利用这些特征去做分类。理论上讲，人们可以用所有提取得到的特征去训练分类器，例如`softmax`分类器，但这样做面临计算量的挑战。例如，对于一个96×96像素的图像，假设已经学习得到了400个定义在8×8输入上的特征，每一个特征和图像卷积都会得到一个`(96-8+1)×(96-8+1)=7921`维的卷积特征，由于有400个特征，因此每个样例（`example`）都会得到一个`892×400=3168400`维的卷积特征向量。学习一个拥有超过300万特征输入的分类器十分不便，并且容易出现过拟合（`over-fitting`）。\n\
    这个问题的产生是因为卷积后的图像具有一种“静态性”的属性，也就意味着在一个图像区域有用的特征极有可能在另一个区域同样适用。因此，为了描述大的图像，一个很自然的想法就是对不同位置的特征进行聚合统计。\n\
    例如，特征提取可以计算图像一个区域上的某个特定特征的平均值（或最大值），如图4.4所示。这些概要统计特征不仅具有低得多的维度（相比使用所有提取得到的特征），同时还会改善结果（不容易过拟合）。这种聚合的操作就叫作池化（`pooling`），有时也称为平均池化或者最大池化（取决于计算池化的方法）。\n\
    ![](OEBPS/Images/Figure-P92_10759.jpg)\n图4.4　max-pooling后的图片\n如果选择图像中的连续范围作为池化区域，并且只是池化相同（重复）的隐藏单元产生的特征，那么这些池化单元就具有平移不变性（`translationinvariant`）。这就意味着即使图像经历了一个小的平移之后依然会产生相同的（池化的）特征。在很多任务中（例如物体检测、声音识别），我们都更希望得到具有平移不变性的特征，因为即使图像经过了平移，样例（图像）的标记仍然保持不变。\n\
    `TensorFlow`中池化运算的函数如下：\n![](OEBPS/Images/Figure-P92_38196.jpg)\n重要的参数如下：\n· `pool_size`：池化窗口的大小，默认大小一般是`[2,\
    \ 2]`。\n· `strides`：和卷积类似，窗口在每一个维度上滑动的步长，默认大小一般也是`[2,2]`。\n· `padding`：和卷积类似，可以取`'VALID'`或者`'SAME'`，返回一个`Tensor`，类型不变，`shape`仍然是`[batch,\
    \ height, width, channels]`这种形式。\n池化一个非常重要的作用就是能够帮助输入的数据表示近似不变性。对于平移不变性，指的是对输入的数据进行少量平移时，经过池化后的输出结果并不会发生改变。局部平移不变性是一个很有用的性质，尤其是当关心某个特征是否出现而不关心它出现的具体位置时。\n\
    例如，当判定一幅图像中是否包含人脸时，并不需要判定眼睛的位置，而是需要知道一只眼睛出现在脸部的左侧、另外一只出现在右侧就可以了。\n\n#### 4.1.4　softmax激活函数\n\
    \n`softmax`函数在前面已经做过介绍，并且笔者使用`Numpy`自定义实现了`softmax`的功能和函数。`softmax`是一个对概率进行计算的模型，因为在真实的计算模型系统中对一个实物的判定并不是100%，而只是有一定的概率，并且在所有的结果标签上都可以求出一个概率。\n\
    ![](OEBPS/Images/Figure-P93_37777.jpg)\n其中，第一个公式是人为定义的训练模型，这里采用的是输入数据与权重的乘积和并加上一个偏置`b`的方式。偏置`b`存在的意义是为了加上一定的噪声。\n\
    对于求出的![](OEBPS/Images/Figure-P93_39545.jpg)，`softmax`的作用就是将其转化成概率。换句话说，这里的`softmax`可以被看作是一个激励函数，将计算的模型输出转换为在一定范围内的数值，并且在总体中这些数值的和为1，每个单独的数据结果都有其特定的数据结果。\n\
    用更为正式的语言表述就是`softmax`是模型函数定义的一种形式：把输入值当成幂指数求值，再正则化这些结果值。这个幂运算表示，更大的概率计算结果对应更大的假设模型里面的乘数权重值。反之，拥有更少的概率计算结果意味着在假设模型里面拥有更小的乘数系数。\n\
    假设模型里的权值不可以是0值或者负值。`softmax`然后会正则化这些权重值，使它们的总和等于1，以此构造一个有效的概率分布。\n对于最终的公式`y=softmax(f(x))=softmax(w[ij]x[j]+b)`来说，可以将其认为是如图4.5所示的形式。\n\
    ![](OEBPS/Images/Figure-P94_10833.jpg)\n图4.5　`softmax`计算形式\n图4.5演示了`softmax`的计算公式，实际上就是输入的数据通过与权重的乘积之后对其进行`softmax`计算得到的结果。如果将其用数学方法表示出来，可以如图4.6所示。\n\
    ![](OEBPS/Images/Figure-P94_10834.jpg)\n图4.6　`softmax`矩阵表示\n将这个计算过程用矩阵的形式表示出来，即矩阵乘法和向量加法，这样有利于使用`TensorFlow`内置的数学公式进行计算，极大地提高了程序效率。\n\
    \n#### 4.1.5　卷积神经网络原理\n\n前面介绍了卷积运算的基本原理和概念，从本质上来说卷积神经网络就是将图像处理中的二维离散卷积运算和神经网络相结合。这种卷积运算可以用于自动提取特征，而卷积神经网络也主要应用于二维图像的识别。下面笔者将采用图示的方法更加直观地介绍卷积神经网络的工作原理。\n\
    一个卷积神经网络中有一个输入层、一个卷积层、一个输出层，但是在真正使用的时候一般会使用多层卷积神经网络不断地去提取特征，特征越抽象，越有利于识别（分类）。通常，卷积神经网络也包含池化层、全连接层，最后接输出层。\n\
    · 图像输入：获取输入的数据图像。\n· 卷积：对图像特征进行提取。\n· `Pooling`层：用于缩小在卷积时获取的图像特征。\n· 全连接层：用于对图像进行分类。\n\
