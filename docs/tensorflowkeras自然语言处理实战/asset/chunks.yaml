    图6.19　对比ResNeXt和ResNet\n\n### 6.4　本章小结\n\n本章是一个起点，让读者站在巨人的肩膀上，从冠军开始！\n\nResNet和ResNeXt开创了一个时代，开天辟地地改变人们仅仅依靠堆积神经网络层来获取更高性能的做法，在一定程度上解决了梯度消失和梯度爆炸的问题。这是一项跨时代的发明。\n\
    \n当简单的堆积神经网络层的做法失效时，人们开始采用模块化的思想设计网络，同时在不断“加宽”模块的内部通道。当这些能够做的方法以及被挖掘穷尽后有没有新的方法能够更进一步提升卷积神经网络的效果呢？\n\
    \n# 第7章  \n\n有趣的word embedding\n\nword embedding是什么？为什么要word embedding？在深入了解前先看几个例子：\n\
    \n·　在使用购买商品或者入住酒店后，会邀请顾客填写相关的评价表明对服务的满意程度。\n\n·　使用几个词在搜索引擎上搜一下。\n\n·　有些博客网站会在博客下面标记一些相关的tag标签。\n\
    \n那么问题来了，这些是怎么做到的呢？\n\n实际上这是文本处理后的应用，目的是用这些文本去做情绪分析、同义词聚类、文章分类和打标签。\n\n读者在读文章或者评论的时候可以准确地说出这个文章大致讲了什么、评论的倾向如何，但是电脑怎么做到的呢？电脑可以匹配字符串然后告诉你是否与输入的字符串相同，但是怎么能让电脑在搜索“梅西”的时候告诉你有关足球或者皮耶罗的事情呢？\n\
    \nword embedding由此诞生，它就是对文本的数字表示。通过其表示和计算可以使得电脑很容易地得到如下公式：\n\n梅西-阿根廷+意大利=皮耶罗\n\
    \n本章将着重介绍word embedding（词嵌入）的相关内容，首先通过多种计算word embedding的方式循序渐进地讲解如何获取对应的word\
    \ embedding，之后的实战使用word embedding进行文本分类。\n\n### 7.1　文本数据处理\n\n无论是使用深度学习还是传统的自然语言处理方式，一个非常重要的内容就是将自然语言转换成计算机可以识别的特征向量。文本的预处理就是如此，通过文本分词-词向量训练-特征词抽取这几个主要步骤后组建能够代表文本内容的矩阵向量。\n\
    \n#### 7.1.1　数据集介绍和数据清洗\n\n新闻分类数据集“AG”是由学术社区ComeToMyHead提供的，从2000多不同的新闻来源搜集的超过一百万的新闻文章，用于研究分类、聚类、信息获取（rank、搜索）等非商业活动。在此基础上Xiang\
    \ Zhang为了研究需要从中提取127600个样本，其中的120000个样本作为训练集、7600个样本作为测试集。按以下4类进行分类：\n\n·　World\n\
    \n·　Sports\n\n·　Business\n\n·　Sci/Tec\n\n数据集一般是用csv文件存储的，打开后格式如图7.1所示。\n\n![](OEBPS/Images/Figure-P161_23706.jpg)\n\
