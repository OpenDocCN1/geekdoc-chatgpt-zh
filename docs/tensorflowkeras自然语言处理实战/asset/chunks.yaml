    **【定义二】**反向传播算法


    与前向传播类似，首先需要定义两个值`δ[k]`与![](OEBPS/Images/Figure-P79_39216.jpg)：


    ![](OEBPS/Images/Figure-P79_37757.jpg)


    其中，`δ[k]`为输出层的误差项，其计算值为真实值与模型计算值之间的差值；`Y`是计算值，`T`是输出真实值；![](OEBPS/Images/Figure-P79_39218.jpg)为输出层的误差。


    **提示**


    对于`δ[k]`与![](OEBPS/Images/Figure-P79_39222.jpg)来说，无论定义在哪个位置，都可以看作当前的输出值对于输入值的梯度计算。


    通过前面的分析可以知道，神经网络反馈算法就是逐层地将最终误差进行分解，即每一层只与下一层打交道，如图3.17所示。据此可以假设每一层均为输出层的前一个层级，通过计算前一个层级与输出层的误差得到权重的更新。


    ![](OEBPS/Images/Figure-P79_9097.jpg)


    图3.17　权重的逐层反向传导


