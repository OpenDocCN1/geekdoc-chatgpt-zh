    \n## 5.4　使用TensorBoard可视化训练过程\n\nTensorBoard是TensorFlow自带的一个强大的可视化工具，也是一个Web应用程序套件。在众多机器学习库中，TensorFlow是目前唯一自带可视化工具的库，这是TensorFlow的一个优点。学会使用TensorBoard将可以帮助TensorFlow的使用者构建复杂模型。\n\
    \nTensorBoard是集成在TensorFlow中自动安装的，基本上安装完TensorFlow 1.X或者2.X，TensorBoard就已经默认安装，而且无论是1.X版本还是2.X版本的TensorBoard，都可以在TensorFlow\
    \ 2.X下直接使用而无须做出调整。\n\nTensorBoard官方定义的`tf.keras.callbacks.TensorBoard`函数：\n\n\
    ·　类`TensorBoard`。\n·　继承自：`Callback`。\n·　定义在：`tensorflow/python/keras/callbacks.py`。\n\
    ·　TensorBoard基本可视化。\n·　TensorBoard是由TensorFlow提供的一个可视化工具。\n·　此回调为TensorBoard编写日志，允许我们可视化训练和测试度量的动态图形，也可以可视化模型中不同层的激活直方图。\n\
    \n### 5.4.1　TensorBoard文件夹的设置\n\n在使用TensorBoard之前读者需要知道的是，TensorBoard实际上是将训练过程的数据存储并写入硬盘的类，因此需要按TensorFlow官方的定义将存储文件夹生成。\n\
    \n图5.11显示的是TensorBoard文件的存储架构，在`logs`文件夹下的`train`文件夹中存放着以`events`开头的文件，即TensorBoard存储的文件。\n\
    \n![](OEBPS/Images/Figure-P125_14018.jpg)\n\n图5.11　TensorBoard文件存储架构\n\n在真实的模型训练中，`logs`中的`train`文件夹是在TensorBoard函数初始化的过程中创建的，因此读者只需要在与训练代码“平行”的位置创建一个`logs`文件夹即可，如图5.12所示。\n\
    \n![](OEBPS/Images/Figure-P125_14019.jpg)\n\n图5.12　创建的logs文件夹\n\n`logs`文件夹是与`train`这个`py`文件平行的文件夹，专用于存放TensorBoard在程序的运行过程中产生的数据文件。更进一步的`train`文件和更深文件夹中的数据文件都是在模型的运行过程中产生的。\n\
    \n### 5.4.2　TensorBoard的显式调用\n\n在1.X版本中，如果用户需要使用TensorBoard对训练过程进行监督，就需要显式地调用TensorBoard对数据进行加载，即TensorBoard是通过一些操作将数据记录到文件中再读取文件来完成作图的。\n\
    \n在TensorFlow 2.X中，为了结合Keras高级API的数据调用和使用方法，TensorBoard被集成在`callbacks`函数中，用户可以自由地将其加载到训练的过程中，并直观地观测模型的训练情况。\n\
    \n在TensorFlow 2.X中调用TensorBoard callbacks的代码如下：\n\n```\n     tensorboard = tf.keras.callbacks.TensorBoard(histogram_freq=1)\n\
    ```\n\n其中的参数可以是以下几种：\n\n·　`log_dir`：用来保存被TensorBoard分析的日志文件的文件名。\n·　`histogram_freq`：对于模型中各个层计算激活值和模型权重直方图的频率（训练轮数中）。如果设置成0，直方图不会被计算。对于直方图可视化的验证数据（或分离数据）一定要明确指出。\n\
    ·　`write_graph`：是否在TensorBoard中可视化图像。如果`write_graph`被设置为True，那么日志文件会变得非常大。\n·　`write_grads`：是否在TensorBoard中可视化梯度值直方图。`histogram_freq`必须要大于0。\n\
    ·　`batch_size`：用以直方图计算的传入神经元网络输入批的大小。\n·　`write_images`：是否在TensorBoard中将模型权重以图片可视化。\n\
    ·　`embeddings_freq`：被选中的嵌入层会被保存的频率（在训练轮中）。\n·　`embeddings_layer_names`：一个列表，会被监测层的名字。如果是None或空列表，那么所有的嵌入层都会被监测。\n\
    ·　`embeddings_metadata`：一个字典，对应层的名字到保存有这个嵌入层元数据文件的名字。\n·　`embeddings_data`：要嵌入在`embeddings_layer_names`指定的层的数据。Numpy数组（如果模型有单个输入）或Numpy数组列表（如果模型有多个输入）。\n\
    ·　`update_freq`：'batch'或'epoch'或整数。当使用'batch'时，在每个batch之后将损失和评估值写入TensorBoard中。同样的情况应用到'epoch'中。如果使用整数，例如10000，这个回调会在每10000个样本之后将损失和评估值写入TensorBoard中。注意，频繁地写入到TensorBoard会减缓我们的训练。\n\
    \n调用好的TensorBoard函数依旧需要显式地在模型训练过程中被调用，此时TensorBoard通过继承keras中的`Callbacks`类直接被插入训练模型使用即可。\n\
    \n```\n     model.fit(x=train_images,y=train_labels,\nepochs=10,verbose=2,callbacks=[tensorboard])\n\
    ```\n\n这里使用了上一节中FashionMNIST训练过程的`fit`函数，`callbacks`将实例化的一个`Callbacks`类显式地传递到训练模型中。\n\
    \n**提示**\n\n`callbacks`类的使用和实现不止TensorBoard一个，在本例中读者只需要记住有这个类即可。\n\n**【程序5-4】**\n\
    \n![](OEBPS/Images/Figure-P127_38243.jpg)\n\n程序的运行结果请读者参考上一节的程序运行示例，这里不再说明。\n\n\
    ### 5.4.3　TensorBoard的使用\n\nTensorBoard的使用需要分成3部分。\n\n#### 1．确认TensorBoard生成完毕\n\
