    \n#### 3.3.3　反馈神经网络原理与公式推导\n\n在求导过程中，如果拉长了求导过程或者增加了其中的单元，就会大大增加其中的计算过程，即很多偏导数的求导过程会被反复计算，因此在实际中对于权值达到上十万或者上百万的神经网络来说，这样的重复冗余所导致的计算量是很大的。\n\
    \n同样是为了求得对权重的更新，反馈神经网络算法将训练误差*E*看作以权重向量每个元素为变量的高维函数，通过不断更新权重，寻找训练误差的最低点，按误差函数梯度下降的方向更新权值。\n\
    \n**提示**\n\n反馈神经网络算法的具体计算公式在本节后半部分进行推导。\n\n首先求得最后的输出层与真实值之间的差距，如图3.13所示。\n\n![](OEBPS/Images/Figure-P76_8984.jpg)\n\
    \n图3.13　反馈神经网络最终误差的计算\n\n之后以计算出的测量值与真实值为起点，反向传播到上一个节点，并计算出节点的误差值，如图3.14所示。\n\n\
    ![](OEBPS/Images/Figure-P76_8985.jpg)\n\n图3.14　反馈神经网络输出层误差的传播\n\n以后将计算出的节点误差重新设置为起点，依次向后传播误差，如图3.15所示。\n\
    \n**注意**\n\n对于隐藏层，误差并不是像输出层一样由单个节点确定而是由多个节点确定，因此对它的修正要计算所有与其连接的节点误差反馈值之和。\n\n\
    ![](OEBPS/Images/Figure-P77_8994.jpg)\n\n图3.15　反馈神经网络隐藏层误差的计算\n\n通俗地解释，一般情况下误差的产生是由于输入值与权重的计算产生了错误。输入值往往是固定不变的，因此对于误差的调节则需要对权重进行更新。权重的更新又是以输入值与真实值的偏差为基础的，当最终层的输出误差被反向一层层地传递回来后，每个节点被相应地分配适合其在神经网络地位中所担负的误差，即只需要更新其所需承担的误差量，如图3.16所示。\n\
    \n![](OEBPS/Images/Figure-P77_8996.jpg)\n\n图3.16　反馈神经网络权重的更新\n\n![](OEBPS/Images/Figure-P78_9032.jpg)\n\
    \n图3.16（续）\n\n在每一层，都需要维护输出对当前层的微分值，该微分值相当于被复用于之前每一层里权值的微分计算。因此，空间复杂度没有变化。同时也没有重复计算，每一个微分值都在之后的迭代中使用。\n\
    \n下面介绍一下公式的推导。公式的推导需要使用一些高等数学的知识，因此读者可以自由选择学习。\n\n首先是算法的分析，前面已经说过，对于反馈神经网络算法，主要需要知道输出值与真实值之间的差值。\n\
    \n·　对输出层单元，误差项是真实值与模型计算值之间的差值。\n\n·　对于隐藏层单元，由于缺少直接的目标值来计算隐藏层单元的误差，因此需要以间接的方式来计算隐藏层的误差项对受隐藏层单元*h*影响的每一个单元的误差进行加权求和。\n\
    \n·　权值的更新方面，主要依靠学习速率、该权值对应的输入以及单元的误差项。\n\n**【定义一】**前向传播算法\n\n对于前向传播的值传递，隐藏层输出值定义如下：\n\
    \n![](OEBPS/Images/Figure-P78_37755.jpg)\n\n其中，*X[i]*是当前节点的输入值，![](OEBPS/Images/Figure-P78_39207.jpg)是连接到此节点的权重，![](OEBPS/Images/Figure-P78_39209.jpg)是输出值。*f*是当前阶段的激活函数，![](OEBPS/Images/Figure-P78_39211.jpg)为当年节点的输入值经过计算后被激活的值。\n\
    \n对于输出层，定义如下：\n\n![](OEBPS/Images/Figure-P79_37756.jpg)\n\n其中，*W[hk]*为输入的权重，![](OEBPS/Images/Figure-P79_39214.jpg)为输入到输出节点的输入值。这里对所有输入值进行权重计算后求得和值，作为神经网络的最后输出值*a[k]*。\n\
    \n**【定义二】**反向传播算法\n\n与前向传播类似，首先需要定义两个值*δ[k]*与![](OEBPS/Images/Figure-P79_39216.jpg)：\n\
    \n![](OEBPS/Images/Figure-P79_37757.jpg)\n\n其中，*δ[k]*为输出层的误差项，其计算值为真实值与模型计算值之间的差值；*Y*是计算值，*T*是输出真实值；![](OEBPS/Images/Figure-P79_39218.jpg)为输出层的误差。\n\
