    ## 7.1.5 文本主题的提取：基于 TextRank（选学）


    `TextRank`算法的核心思想来源自著名的网页排名算法`PageRank`（见图 7.13）。`PageRank`是 Sergey Brin 与 Larry
    Page 于 1998 年在 WWW7 会议上提出来的，用来解决链接分析中网页排名的问题。在衡量一个网页的排名时，可以根据感觉认为：


    - 当一个网页被更多网页所链接时，其排名会越靠前。

    - 排名高的网页应具有更大的表决权，即当一个网页被排名高的网页所链接时，其重要性也应对应提高。


    ![](img/Figure-P173_25061.jpg)


    图 7.13 PageRank 算法


    `TextRank`算法（见图 7.14）与`PageRank`类似，其将文本拆分成最小组成单元（即词汇）作为网络节点，组成词汇网络图模型。`TextRank`在迭代计算词汇权重时与`PageRank`一样，理论上是需要计算边权的。为了简化计算，通常会默认相同的初始权重，以及在分配相邻词汇权重时进行均分。


    ![](img/Figure-P174_25119.jpg)


    图 7.14 TextRank 算法


    ### 第一步：TextRank 前置介绍


    `TextRank`用于对文本关键词进行提取，步骤如下：


    - 把给定的文本`T`按照完整句子进行分割。

    - 对于每个句子，进行分词和词性标注处理，并过滤掉停用词，只保留指定词性的单词，如名词、动词、形容词等。

    - 构建候选关键词图`G=(V,E)`，其中`V`为节点集，由每个词之间的相似度作为连接的边值。

    - 根据下面的公式迭代传播各节点的权重，直至收敛：


    ![](img/Figure-P174_37793.jpg)


    对节点权重进行倒序排序，作为按重要程度排列的关键词。


    ### 第二步：TextRank 类的实现


    整体`TextRank`的实现如下所示：


    **【程序 7-8】**


    ![](img/Figure-P174_38312.jpg)![](img/Figure-P175_38313.jpg)![](img/Figure-P176_39678.jpg)


