- raw: "对于大多数TensorFlow初学者来说，选择一个合适的数据集是作为初始练手项目一个非常重要的起步。为了帮助初学者方便迅捷地获取合适的数据集，并作为一个标准的评分测试标准，TensorFlow推出了一个新的功能，叫作TensorFlow\
    \ Datasets，可以将tf.data和Numpy的格式用公共数据集装载到TensorFlow里，方便迅捷地供使用者调用。\n\n当使用TensorFlow训练大量深层的神经网络时，使用者希望跟踪神经网络整个训练过程中的信息，比如迭代过程中每一层参数是如何变化与分布的、每次循环参数更新后模型在测试集与训练集上的准确率是如何、损失值的变化情况等。如果能在训练的过程中将一些信息加以记录并可视化地表现出来，那么对探索模型会有更深的帮助与理解。\n\
    \n本章着重解决这2个问题，详细介绍TensorFlow Datasets和TensorBoard的使用。\n\n### 5.1　TensorFlow Datasets简介\n\
    \n目前来说，已经有85个数据集可以通过TensorFlow Datasets装载，读者可以通过打印的方式获取到全部的数据集名称（由于数据集仍在不停地添加中，显示结果由打印为准）：\n\
    \n```\n     import tensorflow_datasets as tfds\n     print(tfds.list_builders())\n\
    ```\n\n结果如下所示。\n\n```\n['abstract_reasoning', 'bair_robot_pushing_small', 'bigearthnet',\
    \ 'caltech101',\n'cats_vs_dogs', 'celeb_a', 'celeb_a_hq', 'chexpert', 'cifar10',\
    \ 'cifar100',\n'cifar10_corrupted', 'clevr', 'cnn_dailymail', 'coco', 'coco2014',\n\
    'colorectal_histology', 'colorectal_histology_large',\n'curated_breast_imaging_ddsm',\
    \ 'cycle_gan', 'definite_pronoun_resolution',\n'diabetic_retinopathy_detection',\
    \ 'downsampled_imagenet', 'dsprites', 'dtd',\n'dummy_dataset_shared_generator',\
    \ 'dummy_mnist', 'emnist', 'eurosat',\n'fashion_mnist', 'flores', 'glue', 'groove',\
    \ 'higgs', 'horses_or_humans',\n'image_label_folder', 'imagenet2012', 'imagenet2012_corrupted',\
    \ 'imdb_reviews',\n'iris', 'kitti', 'kmnist', 'lm1b', 'lsun', 'mnist', 'mnist_corrupted',\n\
    'moving_mnist', 'multi_nli', 'nsynth', 'omniglot', 'open_images_v4',\n'oxford_flowers102',\
    \ 'oxford_iiit_pet', 'para_crawl', 'patch_camelyon',\n'pet_finder', 'quickdraw_bitmap',\
    \ 'resisc45', 'rock_paper_scissors', 'shapes3d',\n'smallnorb', 'snli', 'so2sat',\
    \ 'squad', 'starcraft_video', 'sun397', 'super_glue',\n'svhn_cropped', 'ted_hrlr_translate',\
    \ 'ted_multi_translate', 'tf_flowers',\n'titanic', 'trivia_qa', 'uc_merced', 'ucf101',\
    \ 'voc2007', 'wikipedia',\n'wmt14_translate', 'wmt15_translate', 'wmt16_translate',\
    \ 'wmt17_translate',\n'wmt18_translate', 'wmt19_translate', 'wmt_t2t_translate',\
    \ 'wmt_translate',\n'xnli']。\n```\n\n可能有读者对这么多的数据集不熟悉，当然笔者也不建议读者一一去查看和测试这些数据集。表5.1列举了TensorFlow\
    \ Datasets较为常用的6种类型29个数据集，分别涉及音频、图像、结构化数据、文本、翻译和视频类数据。\n\n**表5.1　TensorFlow Datasets数据集**\n\
    \n![](OEBPS/Images/Figure-T110_37783.jpg)\n\n#### 5.1.1　Datasets数据集的安装\n\n一般而言，安装好TensorFlow以后，TensorFlow\
    \ Datasets是默认安装的。如果读者没有安装TensorFlow Datasets，可以通过如下代码段进行安装：\n\n```\n     pip install\
    \ tensorflow_datasets\n```\n\n#### 5.1.2　Datasets数据集的使用\n\n下面以MNIST数据集为例介绍Datasets数据集的基本使用情况。MNIST数据集展示代码如下：\n\
    \n```\n     import tensorflow as tf\n     import tensorflow_datasets as tfds\n\
    \     mnist_data = tfds.load(\"mnist\")\n     mnist_train, mnist_test = mnist_data[\"\
    train\"], mnist_data[\"test\"]\n          \n     assert isinstance(mnist_train,\
    \ tf.data.Dataset)\n```\n\n这里首先导入了tensorflow\\_datasets作为数据的获取接口，之后调用load函数获取mnist数据集的内容，再按照train和test数据的不同将其分割成训练集和测试集。运行效果如图5.1所示。\n\
    \n第一次下载时，tfds连接数据的下载点获取数据的下载地址和内容，此时只需静待数据下载完毕即可。下面打印数据集的维度和一些说明，代码如下：\n\n```\n\
    \     import tensorflow_datasets as tfds\n     mnist_data = tfds.load(\"mnist\"\
    )\n     mnist_train, mnist_test = mnist_data[\"train\"], mnist_data[\"test\"]\n\
    \     \n     print(mnist_train)\n     print(mnist_test)\n```\n\n![](OEBPS/Images/Figure-P112_12706.jpg)\n\
    \n图5.1　运行效果\n\n根据下载的数据集的具体内容，数据集已经被调整成相应的维度和数据格式，显示结果如图5.2所示。\n\n![](OEBPS/Images/Figure-P112_12707.jpg)\n\
    \n图5.2　数据集效果\n\nMNIST数据集中的数据大小是\\[28,28,1\\]维度的图片，数据类型是int8，而label类型为int64。这里有读者可能会奇怪，以前MNIST数据集的图片数据很多，而这时只显示了一条数据的类型。实际上当数据集输出结果如上所示时，已经将数据集内容下载到本地。\n\
    \ntfds.load是一种方便的方法，是构建和加载tf.data.Dataset最简单的方法。其获取的是一个不同的字典类型的文件，根据不同的key获取不同的value值。\n\
    \n为了方便那些在程序中需要简单Numpy数组的用户，可以使用tfds.as\\_numpy返回一个生成Numpy数组记录的生成器tf.data.Dataset。这允许使用tf.data接口构建高性能输入管道。\n\
    \n![](OEBPS/Images/Figure-P112_38218.jpg)\n\n还可以将tfds.as\\_numpy结合batch\\_size=-1从返回的tf.Tensor对象中获取Numpy数组中的完整数据集：\n\
    \n```\n     train_ds = tfds.load(\"mnist\", split=tfds.Split.TRAIN, batch_size=-1)\n\
    \     numpy_ds = tfds.as_numpy(train_ds)\n     numpy_images, numpy_labels = numpy_ds[\"\
    image\"], numpy_ds[\"label\"]\n```\n\n**注意**\n\nload函数中还额外添加了一个split参数，这里是将数据在传入的时候直接进行了分割，按数据的类型分割成image和label值。\n\
    \n更新一步的，如果需要对数据集进行更细一步的划分，按配置将其分成训练集、验证集和测试集，代码如下：\n\n```\n     import tensorflow_datasets\
    \ as tfds\n     splits = tfds.Split.TRAIN.subsplit(weighted=[2, 1, 1])\n     (raw_train,\
    \ raw_validation, raw_test), metadata = tfds.load('mnist',\nsplit=list(splits),with_info=True,\
    \ as_supervised=True)\n```\n\n这里tfds.Split.TRAIN.subsplit函数按传入的权重将其分成训练集占50%、验证集占25%、测试集占25%。\n\
    \nMetadata属性获取了MNIST数据集的基本信息，如图5.3所示。\n\n![](OEBPS/Images/Figure-P113_12750.jpg)\n\
    \n图5.3　MNIST数据集\n\n这里记录了数据的种类、大小以及对应的格式，请读者自行调阅查看。\n\n### 5.2　Datasets数据集的使用——FashionMNIST\n\
    \nFashionMNIST是一个替代MNIST手写数字集的图像数据集，由Zalando（一家德国的时尚科技公司）旗下的研究部门提供，涵盖了来自10种类别的共7万个不同商品的正面图片。\n\
    \nFashionMNIST的大小、格式和训练集／测试集划分与原始的MNIST完全一致。60000/10000的训练测试数据划分，28×28的灰度图片，如图5.4所示。它一般直接用于测试机器学习和深度学习算法性能，且不需要改动任何代码。\n\
    \n![](OEBPS/Images/Figure-P114_12791.jpg)\n\n图5.4　FashionMNIST数据集示例\n\n#### 5.2.1　FashionMNIST数据集下载与展示\n\
    \n读者通过搜索“FashionMNIST”关键字可以很容易地下载到相应的数据集，同样TensorFlow中也自带了相应的FashionMNIST数据集，可以通过如下代码将数据集下载到本地：\n\
    \n```\n     import tensorflow_datasets as tfds\n     dataset,metadata =\ntfds.load('fashion_mnist',as_supervised=True,with_info=True)\n\
    \     train_dataset,test_dataset = dataset['train'],dataset['test']\n```\n\n下载过程如图5.5所示。首先是导入tensorflow\\\
    _datasets库作为下载的辅助库。load()函数中定义了所需要下载的数据集的名称，在这里只需将其定义成本例中的目标数据库“fashion\\_mnist”即可。\n\
    \n该函数需要特别注意一个参数as\\_supervised，设置为True时，就会返回一个二元组(input,label)，而不是返回FeaturesDict，因为二元组的形式更方便理解和使用。接下来指定with\\\
    _info=True，得到函数处理的信息，以便加深对数据的理解。下面根据下载的数据创建出对应的标签。标注编号描述：\n\n![](OEBPS/Images/Figure-P114_12792.jpg)\n\
    \n图5.5　FashionMNIST数据集下载过程\n\n```\n     0：T-shirt/top（T恤）\n     1：Trouser（裤子）\n\
    \     2：Pullover（套衫）\n     3：Dress（裙子）\n     4：Coat（外套）\n     5：Sandal（凉鞋）\n \
    \    6：Shirt（汗衫）\n     7：Sneaker（运动鞋）\n     8：Bag（包）\n     9：Ankle boot（踝靴）\n\
    ```\n\n下面查看训练样本的个数，代码如下：\n\n```\n     num_train_examples = metadata.splits['train'].num_examples\n\
    \     num_test_examples = metadata.splits['test'].num_examples\n     print(\"\
    训练样本个数:{}\".format(num_train_examples))\n     print(\"测试样本个数:{}\".format(num_test_examples))\n\
    ```\n\n结果如下：\n\n![](OEBPS/Images/Figure-P115_12966.jpg)\n\n下面是对样本的展示，这里笔者输出前25个样本，代码如下：\n\
    \n![](OEBPS/Images/Figure-P115_38225.jpg)\n\n图5.6显示了数据集前25个图形的内容，并用\\[5,5\\]的矩阵将其展示了出来。\n\
    \n![](OEBPS/Images/Figure-P116_13022.jpg)\n\n图5.6　FashionMNIST数据集展示结果\n\n####\
    \ 5.2.2　模型的建立与训练\n\n模型的建立非常简单，在这里笔者使用TensorFlow 2.0中的“顺序结构”建立一个基本的4层判别模型，即一个输入层、两个隐藏层、一个输出层的模型结构，代码如下：\n\
    \n![](OEBPS/Images/Figure-P116_38226.jpg)\n\n下面对模型做个说明：\n\n·　输入层：tf.keras.layers.Flatten这一层将图像从2d数组转换为一个784（28×28）像素的一维数组。将这一层想象为将图像中的逐行像素拆开，并将它们排列起来。该层没有需要学习的参数，因为它只是重新格式化数据。\n\
    \n·　隐藏层：tf.keras.layers.Dense是由256或128个神经元组成的密集连接层。每个神经元（或节点）从前一层的所有784个节点获取输入，根据训练过程中将学习到的隐藏层参数对输入进行加权，并将单个值输出到下一层。\n\
    \n·　输出层：同样由tf.keras.layers.Dense构成，所不同的是此层的激活函数是由softmax提供的，将输入转化成10节点，本例中每个节点表示一组服装。与前一层一样，每个节点从其前面层的128个节点获取输入。每个节点根据学习到的参数对输入进行加权计算，所有10个节点值之和为1（具体请参考有关softmax的讲解）。\n\
    \n接下来定义优化器和损失函数。\n\nTensorFlow提供了多种优化器供用户使用，一般常用的是SGD与ADAM。这里对SGD和ADAM的具体内容不做介绍，而是直接使用ADAM优化器作为本例中的优化器选择，推荐读者在后续的实验中将其作为默认的优化器模型。\n\
    \n对于本例中的FashionMNIST分类，可以按模型计算的结果将其分解到不同的类别分布中，因此选择“交叉熵”作为对应的损失函数，代码如下：\n\n```\n\
    \     model.compile(optimizer='adam', loss='sparse_categorical_crossentropy',\n\
    metrics=['accuracy'])\n```\n\n在compile函数中，优化器optimizer的定义是'adam'，损失函数的定义为'sparse\\\
    _categorical\\_crossentropy'，而不是传统的categorical\\_crossentropy，这是因为sparse\\_categorical\\\
    _crossentropy函数能够将输入的序列转化成与模型对应的分布函数，而无须手动调节，这样可以在数据的预处理过程中较好地减少显存的占用和数据交互的时间。\n\
    \n当然读者也可以使用categorical\\_crossentropy“交叉熵”函数作为损失函数的定义，不过需要在数据的预处理过程中加上tf.one\\\
    _hot函数对标签的分布做出预处理。本书推荐使用sparse\\_categorical\\_crossentropy作为损失函数的定义。\n\n最后就是对设置样本的轮次和batch\\\
    _size的大小，在这里根据不同的硬件配置可以对其进行不同的设置，代码如下：\n\n```\n     batch_size = 256\n     train_dataset\
    \ =\ntrain_dataset.repeat().shuffle(num_train_examples).batch(batch_size)\n  \
    \   test_dataset = test_dataset.batch(batch_size)\n```\n\nbatch\\_size的大小可以根据不同机器的配置情况进行设置。最后一步是模型对样本的训练，代码如下：\n\
    \n```\n     model.fit(train_dataset, epochs=5,\nsteps_per_epoch=math.ceil(num_train_examples/\
    \ batch_size))\n```\n\n完整代码如下所示：\n\n**【程序5-1】**\n\n![](OEBPS/Images/Figure-P117_38230.jpg)\n\
    \n最终结果请读者自行完成。\n\n### 5.3　使用Keras对FashionMNIST数据集进行处理\n\nKeras作为TensorFlow 2.0强力推荐的高级API，也同样将FashionMNIST数据集作为自带的数据集的函数。本节将采用Keras包下载FashionMNIST、采用model结构去建立模型，并对数据进行处理。\n\
    \n#### 5.3.1　获取数据集\n\n获取数据集的代码如下：\n\n![](OEBPS/Images/Figure-P118_38232.jpg)"
