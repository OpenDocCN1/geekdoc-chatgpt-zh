    ## 7.2 更多的 word embedding 方法——fastText 和预训练词向量


    在实际的模型计算过程中，`word2vec`是一个最常用也是最重要的将“字”转换成“字嵌入（word embedding）”的方式。


    对于普通的文本来说，供人类所了解和掌握的信息传递方式并不能简易地被计算机所理解，因此`word embedding`是目前来说解决向计算机传递文字信息的最好方式，如图
    7.15 所示。


    ![](img/Figure-P176_25457.jpg)


    图 7.15 word embedding


    随着研究人员对`word embedding`的研究深入和计算机处理能力的提高，更多更好的方法被提出，例如新的`fastText`和使用预训练的词嵌入模型去对数据进行处理。


    本节是上一节的延续，从方法上介绍`fastText`的训练和预训练词向量的使用。


    ### 7.2.1 fastText 的原理与基础算法


    相对于传统的`word2vec`计算方法，`fastText`是一种更为快速和新的计算`word embedding`的方法，其优点主要有以下几个方面：


    - `fastText`在保持高精度的情况下加快了训练速度和测试速度。

    - `fastText`对`word embedding`的训练更加精准。

    - `fastText`采用两个重要的算法：`N-gram`（第一次出现这个词，下文有说明）、`Hierarchical softmax`。


    #### 1．算法一


    相对于`word2vec`中采用的`CBOW`架构，`fastText`采用的是`N-gram`架构，如图 7.16 所示。


    ![](img/Figure-P177_25466.jpg)


    图 7.16 N-gram 架构


    其中，`x[1]`,`x[2]`,…,`x[N-1]`,`x[N]`表示一个文本中的`N-gram`向量，每个特征是词向量的平均值。这里顺便介绍一下`N-gram`的意义。


    `N-gram`常用的有 3 种：1-gram、2-gram、3-gram，分别对应一元、二元、三元。


    以“我想去成都吃火锅”为例，对其进行分词处理，得到的数组是：[“我”，“想”，“去”，“成”，“都”，“吃”，“火”，“锅”]。这就是 1-gram，分词的时候对应一个滑动窗口，窗口大小为
    1，所以每次只取一个值。


    使用 2-gram 就会得到[“我想”，“想去”，“去成”，“成都”，“都吃”，“吃火”，“火锅”]。`N-gram`模型认为词与词之间有关系的距离为`N`，如果超过`N`则认为它们之间没有联系，所以就不会出现“我成”“我去”这些词。


    如果使用 3-gram，就是[“我想去”，“想去成”，“去成都”，...]。


    `N`理论上可以设置为任意值，但是一般设置成上面 3 个类型就够了。


    #### 2．算法二


    当语料类别较多时，使用`hierarchical softmax`(hs)减轻计算量。`fastText`中的`hierarchical softmax`利用
    Huffman 树实现，将词向量作为叶子节点，之后根据词向量构建 Huffman 树，如图 7.17 所示。


    ![](img/Figure-P177_25467.jpg)


    图 7.17 hierarchical softmax 架构


    `hierarchical softmax`的算法较为复杂，这里不过多阐述，有兴趣的读者可以自行研究。


