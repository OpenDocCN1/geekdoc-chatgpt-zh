    目前图 6.5(a)的性能最好。


    ### 6.1.2 模块工具的 TensorFlow 实现——不要重复造轮子

    “工欲善其事，必先利其器。”在构建自己的残差网络之前，需要准备好相关的程序设计工具。这里的工具是指那些已经设计好结构、直接可以使用的代码。


    首先最重要的是卷积核的创建方法。从模型上看，需要更改的内容很少，即卷积核的大小、输出通道数以及所定义的卷积层的名称，代码如下：


    ```

    tf.keras.layers.Conv2D

    ```


    这里直接调用了 TensorFlow 中对卷积层的实现，只需要输入对应的卷积核数目、卷积核大小以及补全方式即可。


    此外，还有一个非常重要的方法，即获取数据的 BatchNormalization，使用批量正则化对数据进行处理，代码如下：


    ```

    tf.keras.layers.BatchNormalization

    ```


    其他的还有最大池化层：


    ```

    tf.keras.layers.MaxPool2D

    ```


    平均池化层：


    ```

    tf.keras.layers.AveragePooling2D

    ```


    这些是在模型单元中所需要使用的基本工具。有了这些工具，就可以直接构建 ResNet 模型单元了。


