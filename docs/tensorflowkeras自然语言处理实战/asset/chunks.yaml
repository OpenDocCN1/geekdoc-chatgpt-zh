    \n![](OEBPS/Images/Figure-P46_38138.jpg)\n\niris的数据读取被分成两个部分：数据特征部分和label部分。label部分使用Keras自带的工具进行离散化处理。"
  fmt: "\n模型建立完毕后，准备数据。一份简单而标准的数据，一个简单而具有指导思想的例子往往事半功倍。深度学习中最常用的一个入门起手例子`iris`分类，下面就从这个例子开始，最终使用`TensorFlow`的`Keras`模式实现一个`iris`鸢尾花分类的例子。\n\
    \n## 2.1.2 使用Keras API实现鸢尾花分类的例子（顺序模式）\n\n`iris`数据集是常用的分类实验数据集，由Fisher于1936年收集整理。`iris`也称鸢尾花卉数据集，是一类多重变量分析的数据集。`iris`数据集包含150个数据集，分为3类，每类50个数据，每个数据包含4个属性，可通过花萼长度、花萼宽度、花瓣长度、花瓣宽度4个属性预测鸢尾花（见图2.2）属于`Setosa`、`Versicolour`、`Virginica`这3个种类中的哪一类。\n\
