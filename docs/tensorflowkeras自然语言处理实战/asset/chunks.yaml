    下载 4 个文件，解压缩后发现这些文件并不是标准的图像格式，也就是一个训练图片集、一个训练标签集、一个测试图片集、一个测试标签集。这些文件是压缩文件，解压出来后是二进制文件，其中训练图片集的内容部分如图
    4.14 所示。


    ![](img/Figure-P98_10894.jpg)


    图 4.14　`MNIST`文件的二进制表示


    `MNIST`训练集内部的文件结构如图 4.15 所示。


    ![](img/Figure-P98_10895.jpg)


    图 4.15　`MNIST`文件结构图


    图 4.15 所示是训练集的文件结构，其中有 60000 个实例。也就是说，这个文件里面包含了 60000 个标签内容，每一个标签的值为 0~9 之间的一个数。这里我们先解析每一个属性的含义。首先该数据是以二进制格式存储的，我们读取的时候要以`rb`方式读取；其次，真正的数据只有`[value]`这一项，其他的`[type]`等只是用来描述的，并不真正在数据文件里面。


    也就是说，在读取真实数据之前，要读取 4 个 32 `bit`的整数型（`int`）数据。由`[offset]`可以看出真正的`pixel`是从 0016
    开始的，一个整数型 32 位的数据，所以在读取`pixel`之前要读取 4 个参数，也就是`magic number`、`number of images`、`number
    of rows`、`number of columns`。


    继续对图片进行分析。在`MNIST`图片集中，所有的图片都是 28×28 的，也就是每个图片都有 28×28 个像素；在图 4.16 所示的`train-images-idx3-ubyte`文件中偏移量为
    0 字节处有一个 4 字节的数为 0000 0803，表示魔数；接下来是 0000 ea60；值为 60000，代表容量；接下来从第 8 个字节开始有一个
    4 字节数，值为 28，也就是 0000 001c，表示每个图片的行数；从第 12 个字节开始有一个 4 字节数，值也为 28，也就是 0000 001c，表示每个图片的列数；从第
    16 个字节开始才是我们的像素值。


    这里使用每 784 个字节代表一幅图片。


    ![](img/Figure-P99_10931.jpg)


    图 4.16　每个手写体被分成 28×28 个像素


    ### 4.2.2 MNIST 数据集特征和标签介绍


    前面已经介绍了通过一个简单的`iris`数据集的例子实现了对 3 个类别的分类问题。现在我们加大难度，尝试使用`TensorFlow`去预测 10 个分类。这实际上难度并不大，如果读者已经掌握了前面的
    3 分类的程序编写，那么这个则不在话下。


    首先是对数据库的获取。读者可以通过前面的地址下载正式的`MNIST`数据集，然而在`TensorFlow 2.0`中，集成的`Keras`高级`API`带有已经处理成`npy`格式的`MNIST`数据集，可以对其进行载入和计算。


    ```

    mnist = tf.keras.datasets.mnist

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    ```


    这里`Keras`能够自动连接互联网下载所需要的`MNIST`数据集，最终下载的是`npz`格式的数据集`mnist.npz`。


    如果有读者无法连接下载数据，本书自带的代码库中也同样提供了对应的`mnist.npz`数据的副本，读者只将其复制到目标位置，之后在`load_data`函数中提供绝对地址即可，代码如下：


    ```

    (x_train, y_train), (x_test, y_test) = mnist.load_data(path=''C:/Users/wang_xiaohua/Desktop/TF2.0/dataset/mnist.npz'')

    ```


    需要注意的是，这里输入的是数据集的绝对地址。`load_data`函数会根据输入的地址将数据进行处理，并自动将其分解成训练集和验证集。打印训练集的维度如下：


