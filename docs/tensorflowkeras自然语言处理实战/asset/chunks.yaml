    通过前面的分析可以知道，神经网络反馈算法就是逐层地将最终误差进行分解，即每一层只与下一层打交道，如图 3.17 所示。据此可以假设每一层均为输出层的前一个层级，通过计算前一个层级与输出层的误差得到权重的更新。


    ![](img/Figure-P79_9097.jpg)


    图 3.17　权重的逐层反向传导


