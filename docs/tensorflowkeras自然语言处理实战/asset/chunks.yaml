    _size大小生成数据batch，while 1表示数据的生成由模型框架确定而非手动确定。\n\n下面就是训练模型的代码编写，代码如下：\n\n**【程序9-7】**\n\
    \n![](OEBPS/Images/Figure-P245_39776.jpg)\n\n通过将训练代码部分和模型组合在一起，即可完成模型的训练。\n\n\
    #### 9.3.4　推断函数的编写\n\n推断或预测函数可以使用同样的编码器模型进行设计，代码如下：\n\n**【程序9-8】**\n\n![](OEBPS/Images/Figure-P245_39777.jpg)\n\
    \n使用与训练过程类似的代码即可完成模型的预测工作。需要注意的是，模型预测过程的数据输入既可以按照batch的方式一次性输入，也可以按“生成器”的模式填入数据。\n\
    \n### 9.4　本章小结\n\n首先需要向读者说明的是，本章的模型设计并没有完全遵守transformer中编码器的设计，而是仅仅建立了多层注意力层和前馈层，这是与真实的transformer中解码器不一致的地方。\n\
    \n其次对于数据的设计，设计了直接将不同字符或者拼音作为独立的字符进行存储，这样做的好处在于可以使数据的最终生成能够简单，但是增加了字符个数，增大了搜索空间，因此对训练要求更高。还有一种划分方法，即将拼音拆开，使用字母和音标分离的方式进行处理，有兴趣的读者可以尝试一下。\n\
    \n还有就是笔者在写作本章时发现，对于输入的数据来说，这里输入的值是词嵌入的embedding和位置编码的和，如果读者尝试了只使用单一的词嵌入embedding可以发现相对于使用叠加的embedding值，单一的词嵌入embedding对于同义字的分辨会产生问题，即：\n\
    \n```\n     qu4 na3去哪 去拿\n```\n\nqu4 na3的相同发音无法分辨出到底是“去哪”还是“去拿”。有兴趣的读者可以做一个测试，或者深入此方面的研究。\n\
    \n本章就是这些内容，但是相对于transformer架构来说，仅有编码器是不完整的，在编码器的基础上，还存在一个对应的“解码器”，这点在下一章会介绍，并且会解决一个非常重要的问题——“文本对齐”。\n\
    \n记住笔者在本章开始写的提示，如果你没有阅读本章3遍以上，希望你重复阅读和练习本章内容。\n\n# 第10章  \n\n从1起步——自然语言处理的解码器\n\
    \n上一节中，笔者介绍了“编码器”的架构和实现代码。如果你是按笔者的要求阅读了3遍或者3遍以上，那么相信你对编码器的编写已经很熟悉了。\n\n“解码器”是在“编码器”的基础上对模型进行少量修正，在不改变整体架构的基础上进行的模型设计。可以说，如果读者掌握了编码器的原理，那么对解码器的概念、设计和原理一定易如反掌。\n\
    \n本章前一部分将介绍解码器的原理和程序编写，后一部分将着重解决一个非常大的问题——“文本对齐”。\n\n这是自然语言处理中一个不可轻易逾越的障碍，本章将以翻译模型的实战为例，系统地讲解文本对齐的方法，并实现一个基于汉字和拼音的“翻译系统”。\n\
    \n本章是对上一章的继承，在阅读上如果有读者想先完整地体验编码器-解码器系统，可以先查看10.1.4节，这是对解码器的完整实现，并详细学习10.2节的实战部分。待程序跑通之后返回10.1节重新学习解码器相关部分，并加深印象。如果读者想了解更多细节，建议按笔者讲解的顺序进行循序渐进的学习。\n\
    \n### 10.1　解码器的核心——注意力模型\n\n顾名思义，解码器就是对传送过来的数据进行解码，将编码后的数据或者通过词嵌入输入的embedding数据。解码器的结构如图10.1所示。\n\
    \n![](OEBPS/Images/Figure-P249_34628.jpg)\n\n图10.1　解码器结构示意图\n\n对于解码器的架构，总体上对比编码器可以看到，其结构相似，但是还有相当一部分区别，下面笔者做个说明：\n\
    \n·　对于解码器的输入，相对于编码器的单一输入（无论是叠加还是单独的词向量embedding），解码器的输入有两个部分，分别是编码器的输入和目标的embedding输入的。\n\
    \n·　对于多头自注意力层，相对于编码器中同样的多头注意力模型，解码器中的多头注意力模型分成两种，分别是“多头自注意力层”和“多头交互注意力层”。\n\n\
    总而言之，相对于编码器中的“单一模块”，解码器中更多的是需要“双模块”，即需要综合“编码器”的输入，以及“解码器本身”的输入协同处理。下面笔者就这些内容详细介绍。\n\
    \n#### 10.1.1　解码器的输入和交互注意力层的掩码\n\n如果换一种编码器和解码器的表示方法，如图10.2所示，可以清楚地看到经过多层的编码器的输出被输入到多层的解码器中。需要注意的是，编码器的输出对于解码器来说并不是直接使用，而是解码器本身先进行一次“自注意力编码”。下面笔者就这两部分进一步进行说明。\n\
    \n![](OEBPS/Images/Figure-P250_34644.jpg)\n\n图10.2　编码器和解码器的表示方法\n\n**第一步：解码器的词嵌入embedding输入**\n\
    \n与解码器的词嵌入输入方式一样，编码器本身的词嵌入embedding的处理也是由初始化的embedding向量和位置编码构成的，结构如图10.3所示。\n\
    \n![](OEBPS/Images/Figure-P250_34645.jpg)\n\n图10.3　词嵌入embedding的处理\n\n**第二步：解码器的自注意力层（重点学习掩码的构建）**\n\
    \n解码器的自注意力层是对输入的词嵌入embedding进行编码的部分，这里的构造与编码器中的构造相同，不再过多阐述。\n\n相对于编码器的掩码部分，解码器的掩码操作有其特殊的要求。事实上，解码器的输入和编码器在处理上不太一样，一般可以认为编码器的输入都是完整的一个序列，解码器在训练以及在数据的生成过程中是逐个进行token的生成。因此，为了防止“偷看”，解码器的自注意力层只能够关注输入序列当前位置以及之前的字，不能够关注之后的字。因此，需要将当前输入的字符token之后的token都添加上mask，使其在经过softmax计算之后的权重变为0，拟态出输入的是“PAD”字符。代码如下所示：\n\
    \n![](OEBPS/Images/Figure-P251_39781.jpg)\n\n也可以单独将代码打印：\n\n```\n     mask = create_look_ahead_mask(4)\n\
    \     print(mask)\n```\n\n这里的参数size设置成4，所以以此打印的结果如图10.4所示。\n\n![](OEBPS/Images/Figure-P251_34694.jpg)\n\
    \n图10.4　打印结果\n\n可以看到，函数的实际作用生成了一个三角掩码，对输入的值做出依次增加的梯度，这样可以保持数据在输入模型的过程中数据的接受也是依次增加的，当前的token只与其本身和其前面的token进行注意力计算而不会与后续的做计算。这一段内容的图形化效果如图10.5所示。\n\
    \n![](OEBPS/Images/Figure-P251_34695.jpg)\n\n图10.5　三角掩码器\n\n此外，对于解码器自注意力层的输入，即query、key、value的定义和设定，在解码器的自注意力层的输入都是由叠加后的词嵌入embedding输入的，因此可以与编码器类似，直接将其设置成同一个即可。\n\
    \n**第三步：解码器和编码器的交互注意力层（重点学习query、key、value的定义）**\n\n编码器和解码器处理后的数据需要“交融”从而进行新的数据整合和生成，而进行数据整合和生成的架构和模块在本例中所处的位置则是“交互注意力层”。\n\
    \n编码器中的交互注意力层的架构和**同处于编码器中的自注意力层**没有太大的差别，其差距主要是输入的不同以及使用掩码对数据的处理。下面笔者分别进行阐述。\n\
    \n（1）交互注意力层\n\n交互注意力层的作用是将编码器输送的**“全部”**词嵌入embedding与解码器获取的**“当前”**的词嵌入embedding进行“融合”计算，使得当前的词嵌入“对齐”编码器中对应的信息，从而获取解码后的信息。\n\
    \n下面从解码器的图示角度进行讲解。从图10.6可以看到，对于“交互注意力”的输入，从编码器中输入的是两个，而解码器自注意力层中输入的是一个，那么对于注意力层的query、key、value到底是如何安排和处理的呢？问题的解答还是要回归于注意力层的定义：\n\
    \n![](OEBPS/Images/Figure-P252_34724.jpg)\n\n图10.6　解码器\n\n实际上，就是使用query首先计算与key的权重，之后使用权重与value携带的信息做比较，从而将value中的信息“融合”到query中。\n\
    \n在“交互注意力层”中，解码器的自注意力词嵌入embedding首先与编码器的输入词嵌入embedding计算权重，之后使用计算后的权重去计算编码器中的信息，即：\n\
    \n```\n     query = 解码器词嵌入embedding\n     key = 编码器词嵌入embedding\n     value =\
    \ 编码器词嵌入embedding\n```\n\n（2）交互注意力中的掩码层（对谁进行掩码处理）\n\n下面处理的就是解码器中多头注意力的掩码层，相对于单一的自注意力层来说，一个非常显著的问题就是**对谁进行掩码处理。**\n\
    \n对这个问题的解答需要重新回到注意力模型的定义：\n\n*z[i]*\\=softmax(scores)\\**υ*\n\n从权重的计算上来看，解码器的词嵌入embedding（query）与编码器输入词嵌入embedding（key和value）进行权重计算，从而将query的值与key和value进行“融合”。基于这点考虑，在计算“掩码”时选择的是对编码器输入的词嵌入embedding进行掩码处理。\n\
    \n如果读者对此不理解，请记住：\n\n```\n     mask the encoder input embedding\n```\n\n有兴趣的读者可以自行查阅更多的资料掌握了解。\n\
    \n下面两个函数分别展示了普通掩码处理和在解码器中“自注意力层”掩码的程序写法："
