    ### 4.3 本章小结


    本章是`TensorFlow 2.0`入门的完结部分，主要介绍了如何使用卷积对`MNIST`数据集做识别。这是一个入门案例，但是包含的内容非常多，例如使用多种不同的层和类构建一个较为复杂的卷积神经网络。我们也向读者介绍了部分类和层的使用，不仅仅是卷积神经网络。


