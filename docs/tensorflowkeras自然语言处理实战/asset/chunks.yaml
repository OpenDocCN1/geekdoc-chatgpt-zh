    在深度学习编程中也有其特有的“`HelloWorld`”，即`MNIST`手写体的识别。相对于上一章单纯地从数据文件中读取数据并加以训练的模型，`MNIST`是一个图片数据集，其分类更多，难度也更大。


    对于好奇的读者来说，一定有一个疑问，`MNIST`究竟是什么？


    实际上，`MNIST`是一个手写数字的数据库，有 60000 个训练样本集和 10000 个测试样本集。打开来看，`MNIST`数据集就是图 4.12 所示的这个样子。


