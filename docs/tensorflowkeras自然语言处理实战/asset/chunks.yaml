    `H[2](x)=relu[2](w[2]×h[1](x))`


    `H(x)=H[2](x)+x`


    其中，`H[1]`是第一层的输出，`H[2]`是第二层的输出。这样在输入与输出有相同维度时，可以使用直接输入的形式将数据传递到框架的输出层。


