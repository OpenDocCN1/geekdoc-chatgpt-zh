    可以看到，`init`函数中最重要的就是显式地确定所需要的一些参数。特别值得注意的是，对于输入的`init`中的参数，输入`Tensor`不会在这里进行标注，**init值初始化的是模型参数。**输入值不属于“模型参数”。


    （2）`build`函数：`build`函数的内容主要是**声明需要更新的参数部分，**如权重等，一般使用`self.kernel = tf.Variable(shape=[
    ])`等来声明需要更新的参数变量。


    ![](OEBPS/Images/Figure-P55_38157.jpg)


    `Build`函数参数中的`input_shape`形参是固定不变的写法，读者不要修改即可，其中自定义的参数需要加上`self`，表明是在类中使用的全局参数。


    对于代码最后的`super(MyLayer, self).build(input_shape)`，目前读者只需要记得这种写法即可，在`build`的最后确定参数定义结束。


    （3）`call`函数：最重要的函数，这部分代码包含了主要层的实现。


    `Init`是对参数做定义和声明；`build`函数是对权重可变参数做声明。


    这两个函数只是定义了一些初始化的参数以及一些需要更新的参数变量，真正实现所定义类的作用是在`call`方法中。


    ![](OEBPS/Images/Figure-P55_38158.jpg)


    可以看到`call`中的一系列操作是对`__init__`和`build`中变量参数的应用，所有的计算都在`call`函数中完成，并且需要注意的是输入的参数也在这里出现，经过计算后将计算值返回。


