    TensorFlow中有哪些预训练模型在前面的章节中已经做了介绍，这里笔者就不再阐述。本节只使用`ResNet`这个最为常用和经典的模型做特征提取模型，代码如下：


    ```

    resnet_layer = tf.keras.applications.ResNet50(include_top=False,

