    ### 6.2.2 ResNet残差模块的实现


    `ResNet`网络结构已经在上文做了介绍，它突破性地使用“模块化”思维去对网络进行叠加，从而实现了数据在模块内部特征的传递不会产生丢失。


    从图6.10可以看到，模块的内部实际上是3个卷积通道相互叠加，形成了一种瓶颈设计。对于每个残差模块，使用3层卷积。这3层分别是1×1、3×3和1×1的卷积层，其中1×1层是负责先减少后增加（恢复）尺寸的，使3×3层具有较小的输入／输出尺寸瓶颈。


    ![](OEBPS/Images/Figure-P147_22172.jpg)


    图6.10　模块的内部


