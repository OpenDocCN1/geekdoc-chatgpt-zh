    \n图7.2　Ag\\_news中的数据形式\n\n读取的train中的每行数据内容被默认以逗号分隔，按列依次存储在序列不同的位置中。为了分类方便，可以使用不同的数组将数据按类别进行存储。当然也可以根据需要使用pandas，但是为了后续操作和运算速度，这里主要使用Python原生函数和Numpy进行计算。\n\
    \n**【程序7-2】**\n\n![](OEBPS/Images/Figure-P162_38292.jpg)\n\n可以看到不同的内容被存储在不同的数组之中，为了统一行使，将所有的字母统一转换成小写便于后续的计算。\n\
    \n**第二步：文本的清洗**\n\n文本中除了常用的标点符号外，还包含着大量的特殊字符，因此需要对文本进行清洗。\n\n文本清洗的方法一般使用正则表达式，可以匹配小写'a'至'z'大写'A'至'Z'或者数字'0'到'9'的范围之外的所有字符，并用空格代替，这个方法无须指定所有标点符号，代码如下：\n\
    \n```\n     import re\n     text = re.sub(r\"[^a-z0-9]\",\" \",text)\n```\n\n\
    这里re是Python中对应正则表达式的Python包，字符串“^”的意义是求反，即只保留要求的字符而替换非要求保留的字符。更细一步的分析可以知道，文本清洗中除了将不需要的符号使用空格替换外，还产生一个问题，即空格数目过多和在文本的首尾有空格残留，这样同样影响文本的读取，因此还需要对替换符号后的文本进行二次处理。\n\
    \n**【程序7-3】**\n\n![](OEBPS/Images/Figure-P162_38294.jpg)\n\n由于加载了新的数据清洗工具，因此在读取数据时可以使用自定义的函数将文本信息处理后存储，代码如下：\n\
