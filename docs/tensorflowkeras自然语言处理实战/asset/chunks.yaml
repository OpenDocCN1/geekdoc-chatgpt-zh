    前面已经介绍了通过一个简单的`iris`数据集的例子实现了对3个类别的分类问题。现在我们加大难度，尝试使用`TensorFlow`去预测10个分类。这实际上难度并不大，如果读者已经掌握了前面的3分类的程序编写，那么这个则不在话下。


