    ```\n\n这里设定了输入字库的个数和输出字库的个数，均为常数1024，打印结果如图9.17所示。\n\n![](OEBPS/Images/Figure-P238_33001.jpg)\n\
    \n图9.17　打印结果\n\n真正实现一个编码器，从理论和架构上来说并不困难，只需要读者细心即可。\n\n### 9.3　实战编码器——汉字拼音转化模型\n\
    \n本节将结合前面两节的内容实战编码器，即使用编码器完成一个训练——汉字与拼音的转化，类似图9.18的效果。\n\n![](OEBPS/Images/Figure-P239_33127.jpg)\n\
    \n图9.18　拼音和汉字\n\n#### 9.3.1　汉字拼音数据集处理\n\n在本例中笔者准备了15万条汉字和拼音对应数据。\n\n**第一步：数据集展示**\n\
    \n汉字拼音数据集如下所示：\n\n![](OEBPS/Images/Figure-P239_39761.jpg)\n\n简单做一下介绍。数据集中的数据分成3部分，每部分使用特定空格键隔开：\n\
    \n```\n     A11_10 … … … ke3 shei2 … … …可 谁 … … …\n```\n\n·　第一部分A11\\_i为序号，表示序列的条数和行号。\n\
    \n·　第二部分是拼音编号，这里使用的是汉语拼音，与真实的拼音标注不同的是去除了拼音原始标注而使用数字1、2、3、4做替代，分别代表当前读音的第一声到第四声，这点请读者注意。\n\
    \n·　最后一部分是汉字的序列，这里与第二部分的拼音部分一一对应。\n\n**第二步：获取字库和训练数据**\n\n获取数据集中字库的个数也是一个非常重要的问题，一个非常好的办法就是：使用set格式的数据读取全部字库中的不同字符。\n\
    \n创建字库和训练数据的完整代码如下所示：\n\n![](OEBPS/Images/Figure-P240_39763.jpg)\n\n这里做一个说明，首先context读取了全部数据集中的内容，之后根据空格将其分成3部分。对拼音和汉字部分，将其转化成一个序列，并在前后分别加上起止符“GO”和“END”。实际上可以不加，只是为了明确地描述起止关系才加上起止标注。\n\
    \n实际上还需要加上一个特定的符号“PAD”，这是为了对单行序列进行补全的操作。最终的数据如下所示：\n\n```\n     ['GO', 'liu2',\
    \ 'yong3' , … … … , 'gan1', ' END', 'PAD', 'PAD' , … … …]\n     ['GO', '柳', '永'\
    \ , … … … , '感', ' END', 'PAD', 'PAD' , … … …]\n```\n\npinyin\\_list和hanzi\\_list分别是两个列表，用来存放对应的拼音和汉字训练数据，最后不要忘记在字库中加上“PAD”符号。\n\
