    #### 2.2.1 全连接层的定义与实现


    全连接层的每一个结点都与上一层的所有结点相连，用来把前边提取到的特征综合起来。由于其全相连的特性，一般全连接层的参数也是最多的。图 2.11 所示的是一个简单的全连接网络。


    ![](img/Figure-P52_19253.jpg)


    图 2.11　全连接层


    其推导过程如下：


    ![](img/Figure-P53_37748.jpg)


    将推导公式转化一下写法，具体如下：


    ![](img/Figure-P53_37749.jpg)


    可以看到，全连接的核心操作就是矩阵向量乘积：`w×x=y`。


    下面举一个例子，使用`TensorFlow`自带的 API 实现一个简单的矩阵计算。


    \[1,1\]　\[1\]


    \[2,2\]\*　\[1\]= \[?\]


    首先笔者通过公式计算对数据做一个先行验证，按推导公式计算如下：


    (1×1+1×1)+0.17=2.17


    (2×1+2×1)+0.17=4.17


    这样最终形成了一个新的矩阵\[2.17,4.17\]，代码如下：


    **【程序 2-9】**


    ![](img/Figure-P53_38152.jpg)


    最终打印结果如下：


    ```

    tf.Tensor([[2.17] [4.17]], shape=(2, 1), dtype=float32)

    ```


    可以看到，最终计算出一个`Tensor`，大小为`shape=(2, 1)`，类型为`float32`，其值为\[\[2.17\]\[4.17\]\]。


    计算本身非常简单，全连接的计算方法相信读者也很容易掌握。现在回到代码中，请注意我们在定义参数和定义输入值的时候采用的不同写法：


    ```

    weight = tf.Variable([[1.],[1.]])

    input_xs = tf.constant([[1.,1.],[2.,2.]])

    ```


    这里对参数的定义，笔者使用的是`Variable`函数。对于输入值的定义，笔者使用的是`constant`函数，将其对应内容打印如下：


    ```

    <tf.Variable ''Variable:0'' shape=(2, 1) dtype=float32, numpy=array([[1.], [1.]],

    dtype=float32)>

    ```


    `input_xs`打印如下：


    ![](img/Figure-P54_38155.jpg)


    通过对比可以看到，这里的`weight`被定义成一个可变参数`Variable`类型，供在后续的反向计算中进行调整。`Constant`函数是直接读取数据并将其定义成`Tensor`格式。


    #### 2.2.2 使用 TensorFlow 自带的 API 实现全连接层


    读者千万不要有错误的理解，在上一节中编写的程序 2-9 仅仅是为了向读者介绍全连接层的计算方法而不是介绍全连接层。全连接本质就是由一个特征空间线性变换到另一个特征空间。目标空间的任一维（也就是隐藏层的一个节点）都认为会受到源空间每一维的影响。可以不那么严谨地说，目标向量是源向量的加权和。


    全连接层一般是接在特征提取网络之后，用作对特征的分类器。全连接常出现在最后几层，用于对前面设计的特征做加权和。前面的网络相当于做特征工程，后面的全连接相当于做特征加权。


    具体的神经网络差值反馈算法将在第 3 章介绍。


    下面我们就使用自定义的方法实现某一个可以加载到`model`中的“自定义全连接层”。


    ##### 1．自定义层的继承


    在`TensorFlow`中，任何一个自定义的层都是继承自`tf.keras.layers.Layer`的，我们将其称为“父层”，如图 2.12 所示。这里所谓的自定义层实际上是父层的一个具体实现。


