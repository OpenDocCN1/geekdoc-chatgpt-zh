    在上面的代码段中，`load_data`函数可以按既定的格式读取出来。正如`iris`数据库一样，每个`MNIST`实例数据单元也是由 2 部分构成的，一幅包含手写数字的图片和一个与其相对应的标签。可以将其中的标签特征设置成“`y`”，而图片特征矩阵以“`x`”来代替，所有的训练集和测试集中都包含`x`和`y`。


    图 4.17 用更为一般化的形式解释了`MNIST`数据实例的展开形式。在这里，图片数据被展开成矩阵的形式，矩阵的大小为 28×28。至于如何处理这个矩阵，常用的方法是将其展开，而展开的方式和顺序并不重要，只需要将其按同样的方式展开即可。


    ![](img/Figure-P100_11002.jpg)


    图 4.17　图片转换为向量模式


    下面回到对数据的读取，前面已经介绍了，`MNIST`数据集实际上就是一个包含着 60000 张图片的 60000×28×28 大小的矩阵张量`[60000,28,28]`，如图
    4.18 所示。


    ![](img/Figure-P100_11003.jpg)


    图 4.18　`MNIST`数据集的矩阵表示


    矩阵中行数指的是图片的索引，用以对图片进行提取。后面的 28×28 个向量用以对图片特征进行标注。实际上，这些特征向量就是图片中的像素点，每张手写图片是`[28,28]`的大小，每个像素转化为
    0~1 之间的一个浮点数，构成矩阵。


    如同在上一章的例子中，每个实例的标签对应于 0~9 之间的任意一个数字，用以对图片进行标注。需要注意的是，对于提取出来的`MNIST`的特征值，默认是使用一个
    0~9 的数值进行标注，但是这种标注方法并不能使得损失函数获得一个好的结果，因此常用的是`one_hot`计算方法，即将值具体落在某个标注区间中。


    `one_hot`的标注方法请读者自行学习掌握。这里笔者主要介绍将单一序列转化成`one_hot`的方法。一般情况下，`TensorFlow`也自带了转化函数，即`tf.one_hot`函数，但是这个转化生成的是`Tensor`格式的数据，因此并不适合直接输入。


    如果读者能够自行编写将序列值转化成`one_hot`的函数，那么编程功底是不错的，但是`Keras`提供了已经编写好的转换函数：


    ```

