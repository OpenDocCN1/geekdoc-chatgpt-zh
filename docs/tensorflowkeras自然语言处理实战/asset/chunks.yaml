    # 第 1 章 自然语言之道


    如果读者初识自然语言处理，那么本章就显得格外重要了。本章内容都是自然语言处理的前置知识，一开始并不讲述如何使用深度学习或者 TensorFlow 进行自然语言处理，而是向读者初步介绍自然语言的一些基本研究内容和最新趋势，相信读者在阅读完这些内容后会对自然语言处理有一个大概的了解。之后本章讲解最基础的环境搭建，让读者能动手编写最基本的代码。最后通过一个接地气的实战让读者融会贯通自然语言的理论和代码。


    ## 1.1　何谓自然语言处理


    我们对“语言”可能不陌生，对“自然语言”有点陌生，对“自然语言处理”就真的有点陌生了。


    不妨设想如下场景：


    当你加完班回到家中，疲惫地往沙发上一躺，随口一句“打开电视”，沙发前的电视按命令开启，然后一个温柔的声音会向你问候，“今天想看什么类型的电影？”或者是主动向你推荐目前最为流行的一些影片。


    其实这些场景不再是设想，它正在悄悄地走进你我的生活。


    ### 1.1.1　自然语言处理是门技术


    2018 年谷歌在开发者大会上演示了一个预约理发店的聊天机器人，语气惟妙惟肖，表现相当令人惊艳。相信很多读者都接到过人工智能的推销电话，不去仔细分辨的话，根本不知道电话那头只是一个自然语言处理程序。


    “人机对话”“机器人客服”“文档结构化处理”是自然语言处理应用较为广泛的部分，也是商业价值较高的一些方向。除此之外，还有文本写作、机器人作诗等一些带有娱乐性质的应用。这些统统是“自然语言处理”。

