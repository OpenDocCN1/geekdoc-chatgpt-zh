    def __init__(self,

    pool_size=(2, 2),

    strides=None,

    padding=''valid'',

    data_format=None,

    **kwargs):

    ```


    参数说明如下：


    - `pool_size`：必需，池化窗口大小，必须是一个数字（高和宽都是此数字）或者长度为 2 的列表（分别代表高、宽）。

    - `strides`：必需，池化步长，必须是一个数字（高和宽都是此数字）或者长度为 2 的列表（分别代表高、宽）。

    - `padding`：可选，`padding`的方法，`valid`或者`same`，大小写不区分，默认为`valid`。

    - `data_format`：可选，分为`channels_last`和`channels_first`两种模式，代表了输入数据的维度类型，默认为`channels_last`。如果是`channels_last`，那么输入数据的`shape`为`(batch,height,width,channels)`。如果是`channels_first`，那么输入数据的`shape`为`(batch,channels,height,width)`。

    - `name`：可选，池化层的名称，默认为`None`。

    - 返回值：经过池化处理后的`Tensor`。


    ### 【程序 6-4】


    ```

