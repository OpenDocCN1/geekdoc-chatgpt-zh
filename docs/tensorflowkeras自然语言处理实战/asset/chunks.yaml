- raw: "TF-IDF的主要思想是：如果某个词或短语在一篇文章中出现的频率TF高，并且在其他文章中很少出现，则认为此词或者短语具有很好的类别区分能力，适合用来分类。其中，TF（Term\
    \ Frequency）表示词条在文章Document中出现的频率。\n\n![](OEBPS/Images/Figure-P170_37790.jpg)\n\
    \nIDF（Inverse Document Frequency）的主要思想就是，包含某个词Word的文档越少，这个词的区分度越大，也就是IDF越大。\n\n\
    ![](OEBPS/Images/Figure-P170_37792.jpg)\n\nTF-IDF的计算实际上就是TF*×*IDF：\n\nTF-IDF=词频×逆文档频率=TF×IDF\n\
    \n**第二步：TF-IDF的实现**\n\n首先是IDF的计算，代码如下：\n\n![](OEBPS/Images/Figure-P170_38304.jpg)\n\
    \n下一步是使用计算好的IDF计算每个文档的TF-IDF值：\n\n![](OEBPS/Images/Figure-P171_39672.jpg)\n\n\
    计算TF-IDF的完整代码如下：\n\n**【程序7-6】**\n\n![](OEBPS/Images/Figure-P171_39673.jpg)\n\n\
    **第三步：建立有限量的词矩阵**\n\n将重排的文档根据训练好的word2vec向量建立一个有限量的词矩阵，请读者自行完成。\n\n**第四步：将TF-IDF单独定义一个类**\n\
    \n将TF-IDF的计算函数单独整合到一个类中，方便后续的使用，代码如下：\n\n**【程序7-7】**\n\n![](OEBPS/Images/Figure-P172_38309.jpg)\n\
    \n使用方法如下：\n\n![](OEBPS/Images/Figure-P173_39677.jpg)\n\n其中，agnews\\_text为从文档中获取的正文数据集，也可以使用标题或者文档进行处理。\n\
    \n#### 7.1.5　文本主题的提取：基于TextRank（选学）\n\nTextRank算法的核心思想来源自著名的网页排名算法PageRank（见图7.13）。PageRank是Sergey\
    \ Brin与Larry Page于1998年在WWW7会议上提出来的，用来解决链接分析中网页排名的问题。在衡量一个网页的排名时，可以根据感觉认为：\n\n\
    ·　当一个网页被更多网页所链接时，其排名会越靠前。\n\n·　排名高的网页应具有更大的表决权，即当一个网页被排名高的网页所链接时，其重要性也应对应提高。\n\
    \n![](OEBPS/Images/Figure-P173_25061.jpg)\n\n图7.13　PageRank算法\n\nTextRank算法（见图7.14）与PageRank类似，其将文本拆分成最小组成单元（即词汇）作为网络节点，组成词汇网络图模型。TextRank在迭代计算词汇权重时与PageRank一样，理论上是需要计算边权的。为了简化计算，通常会默认相同的初始权重，以及在分配相邻词汇权重时进行均分。\n\
    \n![](OEBPS/Images/Figure-P174_25119.jpg)\n\n图7.14　TextRank算法\n\n**第一步：TextRank前置介绍**\n\
    \nTextRank用于对文本关键词进行提取，步骤如下：\n\n·　把给定的文本T按照完整句子进行分割。\n\n·　对于每个句子，进行分词和词性标注处理，并过滤掉停用词，只保留指定词性的单词，如名词、动词、形容词等。\n\
    \n·　构建候选关键词图*G*\\=(*V*,*E*)，其中*V*为节点集，由每个词之间的相似度作为连接的边值。\n\n·　根据下面的公式迭代传播各节点的权重，直至收敛：\n\
    \n![](OEBPS/Images/Figure-P174_37793.jpg)\n\n对节点权重进行倒序排序，作为按重要程度排列的关键词。\n\n**第二步：TextRank类的实现**\n\
    \n整体TextRank的实现如下所示：\n\n**【程序7-8】**\n\n![](OEBPS/Images/Figure-P174_38312.jpg)![](OEBPS/Images/Figure-P175_38313.jpg)![](OEBPS/Images/Figure-P176_39678.jpg)\n\
    \nTextRank是另外一种能够实现关键词抽取的方法。除此之外，还有基于相似度聚类以及其他方法。相对于本书对应的数据集来说，文本的提取并不是必需的。本节为选学内容，有兴趣的读者可以自行学习。\n\
    \n### 7.2　更多的word embedding方法——fastText和预训练词向量\n\n在实际的模型计算过程中，word2vec是一个最常用也是最重要的将“字”转换成“字嵌入（word\
    \ embedding）”的方式。\n\n对于普通的文本来说，供人类所了解和掌握的信息传递方式并不能简易地被计算机所理解，因此word embedding是目前来说解决向计算机传递文字信息的最好方式，如图7.15所示。\n\
    \n![](OEBPS/Images/Figure-P176_25457.jpg)\n\n图7.15　word embedding\n\n随着研究人员对word\
    \ embedding的研究深入和计算机处理能力的提高，更多更好的方法被提出，例如新的fastText和使用预训练的词嵌入模型去对数据进行处理。\n\n本节是上一节的延续，从方法上介绍fastText的训练和预训练词向量的使用。\n\
    \n#### 7.2.1　fastText的原理与基础算法\n\n相对于传统的word2vec计算方法，fastText是一种更为快速和新的计算word embedding的方法，其优点主要有以下几个方面：\n\
    \n·　fastText在保持高精度的情况下加快了训练速度和测试速度。\n\n·　fastText对word embedding的训练更加精准。\n\n·　fastText采用两个重要的算法：N-gram（第一次出现这个词，下文有说明）、Hierarchical\
    \ softmax。\n\n##### 1．算法一\n\n相对于word2vec中采用的CBOW架构，fastText采用的是N-gram架构，如图7.16所示。\n\
    \n![](OEBPS/Images/Figure-P177_25466.jpg)\n\n图7.16　N-gram架构\n\n其中，*x*[1],*x*[2],…,*x[N]*[−1],*x[N]*表示一个文本中的N-gram向量，每个特征是词向量的平均值。这里顺便介绍一下N-gram的意义。\n\
    \nN-gram常用的有3种：1-gram、2-gram、3-gram，分别对应一元、二元、三元。\n\n以“我想去成都吃火锅”为例，对其进行分词处理，得到的数组是：\\\
    [“我”，“想”，“去”，“成”，“都”，“吃”，“火”，“锅”\\]。这就是1-gram，分词的时候对应一个滑动窗口，窗口大小为1，所以每次只取一个值。\n\
    \n使用2-gram就会得到\\[“我想”，“想去”，“去成”，“成都”，“都吃”，“吃火”，“火锅”\\]。N-gram模型认为词与词之间有关系的距离为*N*，如果超过*N*则认为它们之间没有联系，所以就不会出现“我成”“我去”这些词。\n\
    \n如果使用3-gram，就是\\[“我想去”，“想去成”，“去成都”，...\\]。\n\n*N*理论上可以设置为任意值，但是一般设置成上面3个类型就够了。\n\
