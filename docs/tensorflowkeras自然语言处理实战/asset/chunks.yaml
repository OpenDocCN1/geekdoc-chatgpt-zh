    对于`Python`科学计算来说，最简单的想法就是将数学公式直接表达成程序语言，可以说`Python`满足了这个想法。本节将使用`Python`实现和计算一个深度学习中最为常见的函数——`softmax`函数。至于这个函数的作用，现在不加以说明，这里只是带领读者尝试实现其程序的编写。


    首先`softmax`计算公式如下所示：


    ![](img/Figure-P26_38702.jpg)


    其中，`V[i]`是长度为`j`的数列`V`中的一个数，带入`softmax`的结果其实就是先对每一个`V[i]`取以`e`为底的指数计算变成非负，然后除以所有项之和进行归一化，之后每个`V[i]`就可以解释成：在观察到的数据集类别中特定的`V[i]`属于某个类别的概率，或者称作似然（`Likelihood`）。


    **提示**


    `softmax`用以解决概率计算中概率结果大而占绝对优势的问题。例如，函数计算结果中有 2 个值`a`和`b`，且`a`>`b`，如果简单地以值的大小为单位衡量，那么在后续的使用过程中，`a`永远被选用，而`b`使用由于数值较小而不会被选择，但是有时候也需要使用数值小的`b`，那么`softmax`就可以解决这个问题了。


    `softmax`按照概率选择`a`和`b`，由于`a`的概率值大于`b`，在计算时`a`经常会被取得，而`b`由于概率较小，取得的可能性也较小，但是也有概率被取得。


