    4.1 节中介绍卷积计算时，卷积的输入是一个 4 维的数据，还需要一个“通道”的标注，因此对其使用`tf`的扩展函数，修改了维度的表示方式。


    #### 3. 模型的确定与各模块的编写


    对于使用深度学习构建一个分辨`MNIST`的模型来说，最简单最常用的方法是建立一个基于卷积神经网络+分类层的模型，结构如图 4.20 所示。


    ![](img/Figure-P102_11138.jpg)


    图 4.20　基于卷积神经网络+分类层的模型


    从图 4.20 可以看到，一个简单的卷积神经网络模型是由卷积层、池化层、`dropout`层以及作为分类的全连接层构成的，同时每一层之间使用`relu`激活函数做分割，而`batch_normalization`作为正则化的工具也被作为各个层之间的连接而使用。


    模型代码如下：


    ![](img/Figure-P103_39557.jpg)


    下面分步进行解释。


    ##### (1) 输入的初始化


    输入的初始化使用的是`Input`类，这里根据输入的数据大小将输入的数据维度做成`[28,28,1]`，其中的`batch_size`不需要设置，`TensorFlow`会在后台自行推断。


    ```

    input_xs = tf.keras.Input([28,28,1])

    ```


    ##### (2) 卷积层


    `TensorFlow`中自带了卷积层实现类对卷积的计算，这里首先创建了一个类，通过设定卷积核数据、卷积核大小、`padding`方式和激活函数初始化了整个卷积类。


    ```

    conv = tf.keras.layers.Conv2D(32,3,padding="SAME", activation=tf.nn.relu)(input_xs)

    ```


    `TensorFlow`中的卷积层的定义在绝大多数的情况下直接调用给定的实现好的卷积类即可。当卷积核大小等于 3 时，`TensorFlow`专门给予了优化，原因在下一章揭晓。现在读者只需要牢记卷积类的初始化和卷积层的使用即可。


    ##### (3) BatchNormalization 和 Maxpool 层


    `Batch_normalization`和`Maxpool`层的目的是输入数据正则化，最大限度地减少模型的过拟合和增大模型的泛化能力。对于`Batch_normalization`和`Maxpool`的实现，读者自行参考模型代码的写法做个实现，有兴趣的读者可以更深一步学习其相关的理论，本书就不再过多介绍了。


    ![](img/Figure-P103_38203.jpg)


    ##### (4) 起分类作用的全连接层


    全连接层的作用是对卷积层所提取的特征做最终分类。这里我们首先使用`flat`函数，将提取计算后的特征值平整化，之后的 2 个全连接层起到特征提取和分类的作用，最终做出分类。


    ```

    dense = tf.keras.layers.Dense(512, activation=tf.nn.relu)(flat)

    logits = tf.keras.layers.Dense(10, activation=tf.nn.softmax)(dense)

    ```


    同样使用`TensorFlow`对模型进行打印，可以将所涉及的各个层级都打印出来，如图 4.21 所示。


    ![](img/Figure-P104_11438.jpg)


    图 4.21　打印各个层级


    可以看到，各个层依次被计算，并且所用的参数也打印出来了。


