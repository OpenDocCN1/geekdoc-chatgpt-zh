    在每一层，都需要维护输出对当前层的微分值，该微分值相当于被复用于之前每一层里权值的微分计算。因此，空间复杂度没有变化。同时也没有重复计算，每一个微分值都在之后的迭代中使用。


    下面介绍一下公式的推导。公式的推导需要使用一些高等数学的知识，因此读者可以自由选择学习。


    首先是算法的分析，前面已经说过，对于反馈神经网络算法，主要需要知道输出值与真实值之间的差值。


    ·　对输出层单元，误差项是真实值与模型计算值之间的差值。

    ·　对于隐藏层单元，由于缺少直接的目标值来计算隐藏层单元的误差，因此需要以间接的方式来计算隐藏层的误差项对受隐藏层单元`h`影响的每一个单元的误差进行加权求和。

    ·　权值的更新方面，主要依靠学习速率、该权值对应的输入以及单元的误差项。


    **【定义一】**前向传播算法


    对于前向传播的值传递，隐藏层输出值定义如下：


