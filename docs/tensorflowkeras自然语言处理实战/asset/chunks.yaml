    ## 7.1.5 文本主题的提取：基于TextRank（选学）


    `TextRank`算法的核心思想来源自著名的网页排名算法`PageRank`（见图7.13）。`PageRank`是Sergey Brin与Larry Page于1998年在WWW7会议上提出来的，用来解决链接分析中网页排名的问题。在衡量一个网页的排名时，可以根据感觉认为：


    - 当一个网页被更多网页所链接时，其排名会越靠前。

    - 排名高的网页应具有更大的表决权，即当一个网页被排名高的网页所链接时，其重要性也应对应提高。


    ![](OEBPS/Images/Figure-P173_25061.jpg)


    图7.13 PageRank算法


    `TextRank`算法（见图7.14）与`PageRank`类似，其将文本拆分成最小组成单元（即词汇）作为网络节点，组成词汇网络图模型。`TextRank`在迭代计算词汇权重时与`PageRank`一样，理论上是需要计算边权的。为了简化计算，通常会默认相同的初始权重，以及在分配相邻词汇权重时进行均分。


    ![](OEBPS/Images/Figure-P174_25119.jpg)


    图7.14 TextRank算法


    ### 第一步：TextRank前置介绍


    `TextRank`用于对文本关键词进行提取，步骤如下：


    - 把给定的文本`T`按照完整句子进行分割。

    - 对于每个句子，进行分词和词性标注处理，并过滤掉停用词，只保留指定词性的单词，如名词、动词、形容词等。

    - 构建候选关键词图`G=(V,E)`，其中`V`为节点集，由每个词之间的相似度作为连接的边值。

    - 根据下面的公式迭代传播各节点的权重，直至收敛：


    ![](OEBPS/Images/Figure-P174_37793.jpg)


    对节点权重进行倒序排序，作为按重要程度排列的关键词。


    ### 第二步：TextRank类的实现


    整体`TextRank`的实现如下所示：


    **【程序7-8】**


    ![](OEBPS/Images/Figure-P174_38312.jpg)![](OEBPS/Images/Figure-P175_38313.jpg)![](OEBPS/Images/Figure-P176_39678.jpg)


    `TextRank`是另外一种能够实现关键词抽取的方法。除此之外，还有基于相似度聚类以及其他方法。相对于本书对应的数据集来说，文本的提取并不是必需的。本节为选学内容，有兴趣的读者可以自行学习。


    ## 7.2 更多的word embedding方法——fastText和预训练词向量


    在实际的模型计算过程中，`word2vec`是一个最常用也是最重要的将“字”转换成“字嵌入（word embedding）”的方式。


    对于普通的文本来说，供人类所了解和掌握的信息传递方式并不能简易地被计算机所理解，因此`word embedding`是目前来说解决向计算机传递文字信息的最好方式，如图7.15所示。


    ![](OEBPS/Images/Figure-P176_25457.jpg)


    图7.15 word embedding


    随着研究人员对`word embedding`的研究深入和计算机处理能力的提高，更多更好的方法被提出，例如新的`fastText`和使用预训练的词嵌入模型去对数据进行处理。


    本节是上一节的延续，从方法上介绍`fastText`的训练和预训练词向量的使用。


    ### 7.2.1 fastText的原理与基础算法


    相对于传统的`word2vec`计算方法，`fastText`是一种更为快速和新的计算`word embedding`的方法，其优点主要有以下几个方面：


    - `fastText`在保持高精度的情况下加快了训练速度和测试速度。

    - `fastText`对`word embedding`的训练更加精准。

    - `fastText`采用两个重要的算法：`N-gram`（第一次出现这个词，下文有说明）、`Hierarchical softmax`。


    #### 1．算法一


    相对于`word2vec`中采用的`CBOW`架构，`fastText`采用的是`N-gram`架构，如图7.16所示。


    ![](OEBPS/Images/Figure-P177_25466.jpg)


    图7.16 N-gram架构


    其中，`x[1]`,`x[2]`,…,`x[N-1]`,`x[N]`表示一个文本中的`N-gram`向量，每个特征是词向量的平均值。这里顺便介绍一下`N-gram`的意义。


    `N-gram`常用的有3种：1-gram、2-gram、3-gram，分别对应一元、二元、三元。


    以“我想去成都吃火锅”为例，对其进行分词处理，得到的数组是：[“我”，“想”，“去”，“成”，“都”，“吃”，“火”，“锅”]。这就是1-gram，分词的时候对应一个滑动窗口，窗口大小为1，所以每次只取一个值。


    使用2-gram就会得到[“我想”，“想去”，“去成”，“成都”，“都吃”，“吃火”，“火锅”]。`N-gram`模型认为词与词之间有关系的距离为`N`，如果超过`N`则认为它们之间没有联系，所以就不会出现“我成”“我去”这些词。


    如果使用3-gram，就是[“我想去”，“想去成”，“去成都”，...]。


    `N`理论上可以设置为任意值，但是一般设置成上面3个类型就够了。


    #### 2．算法二


    当语料类别较多时，使用`hierarchical softmax`(hs)减轻计算量。`fastText`中的`hierarchical softmax`利用Huffman树实现，将词向量作为叶子节点，之后根据词向量构建Huffman树，如图7.17所示。


    ![](OEBPS/Images/Figure-P177_25467.jpg)


    图7.17 hierarchical softmax架构


    `hierarchical softmax`的算法较为复杂，这里不过多阐述，有兴趣的读者可以自行研究。


