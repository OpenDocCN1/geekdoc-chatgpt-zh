- raw: "·　图像和其他信号的局部统计特征与其位置是不太相关的，如果特征图能在图片的一个部分出现，就能出现在任何地方。所以不同位置的单元共享同样的权重，并在数组的不同部分探测相同的模式。\n\
    \n数学上，这种由一个特征图执行的过滤操作是一个离散的卷积，卷积神经网络由此得名。\n\n池化层的作用是对获取的图像特征进行缩减，从前面的例子中可以看到，使用\\\
    [2,2\\]大小的矩阵来处理特征矩阵，使得原有的特征矩阵可以缩减到1/4大小，特征提取的池化效应如图4.10所示。\n\n![](OEBPS/Images/Figure-P96_10854.jpg)\n\
    \n图4.10　池化处理后的图像\n\n经过池化处理的图像矩阵作为神经网络的数据输入，使用一个全连接层对输入的所有节点数据进行分类处理（见图4.11），并且计算这个图像所求的所属位置概率最大值。\n\
    \n![](OEBPS/Images/Figure-P96_10855.jpg)\n\n图4.11　全连接层判断\n\n采用较为通俗的语言概括，卷积神经网络是一个层级递增的结构，也可以认为是一个人在读报纸，首先一字一句地读取，之后整段地理解，最后获得全文的倾向。卷积神经网络也是从边缘、结构和位置等一起感知物体的形状。\n\
    \n### 4.2　编程实战：MNIST手写体识别\n\n下面笔者将带领读者做一个使用卷积神经网络实战的例子，即使用TensorFlow进行MNIST手写体的识别。\n\
    \n#### 4.2.1　MNIST数据集\n\n“HelloWorld”是任何一种编程语言入门的基础程序，任何一名同学在开始编程学习时打印的第一句话往往就是“HelloWorld”。前面章节中笔者也带领读者学习和掌握了TensorFlow的第一个程序“HelloWorld”。\n\
    \n在深度学习编程中也有其特有的“HelloWorld”，即MNIST手写体的识别。相对于上一章单纯地从数据文件中读取数据并加以训练的模型，MNIST是一个图片数据集，其分类更多，难度也更大。\n\
    \n对于好奇的读者来说，一定有一个疑问，MNIST究竟是什么？\n\n实际上，MNIST是一个手写数字的数据库，有60000个训练样本集和10000个测试样本集。打开来看，MNIST数据集就是图4.12所示的这个样子。\n\
    \n![](OEBPS/Images/Figure-P97_10867.jpg)\n\n图4.12　MNIST文件手写体\n\n可以从MNIST数据库官方网址直接下载train-images-idx3-ubyte.gz、train-labels-idx1-ubyte.gz等，如图4.13所示。\n\
    \n![](OEBPS/Images/Figure-P98_10893.jpg)\n\n图4.13　MNIST文件中包含的数据集\n\n下载4个文件，解压缩后发现这些文件并不是标准的图像格式，也就是一个训练图片集、一个训练标签集、一个测试图片集、一个测试标签集。这些文件是压缩文件，解压出来后是二进制文件，其中训练图片集的内容部分如图4.14所示。\n\
    \n![](OEBPS/Images/Figure-P98_10894.jpg)\n\n图4.14　MNIST文件的二进制表示\n\nMNIST训练集内部的文件结构如图4.15所示。\n\
    \n![](OEBPS/Images/Figure-P98_10895.jpg)\n\n图4.15　MNIST文件结构图\n\n图4.15所示是训练集的文件结构，其中有60000个实例。也就是说，这个文件里面包含了60000个标签内容，每一个标签的值为0~9之间的一个数。这里我们先解析每一个属性的含义。首先该数据是以二进制格式存储的，我们读取的时候要以rb方式读取；其次，真正的数据只有\\\
    [value\\]这一项，其他的\\[type\\]等只是用来描述的，并不真正在数据文件里面。\n\n也就是说，在读取真实数据之前，要读取4个32 bit的整数型（int）数据。由\\\
    [offset\\]可以看出真正的pixel是从0016开始的，一个整数型32位的数据，所以在读取pixel之前要读取4个参数，也就是magic number、number\
    \ of images、number of rows、number of columns。\n\n继续对图片进行分析。在MNIST图片集中，所有的图片都是28×28的，也就是每个图片都有28×28个像素；在图4.16所示的train-images-idx3-ubyte文件中偏移量为0字节处有一个4字节的数为0000\
    \ 0803，表示魔数；接下来是0000 ea60；值为60000，代表容量；接下来从第8个字节开始有一个4字节数，值为28，也就是0000 001c，表示每个图片的行数；从第12个字节开始有一个4字节数，值也为28，也就是0000\
    \ 001c，表示每个图片的列数；从第16个字节开始才是我们的像素值。\n\n这里使用每784个字节代表一幅图片。\n\n![](OEBPS/Images/Figure-P99_10931.jpg)\n\
    \n图4.16　每个手写体被分成28×28个像素\n\n#### 4.2.2　MNIST数据集特征和标签介绍\n\n前面已经介绍了通过一个简单的iris数据集的例子实现了对3个类别的分类问题。现在我们加大难度，尝试使用TensorFlow去预测10个分类。这实际上难度并不大，如果读者已经掌握了前面的3分类的程序编写，那么这个则不在话下。\n\
    \n首先是对数据库的获取。读者可以通过前面的地址下载正式的MNIST数据集，然而在TensorFlow 2.0中，集成的Keras高级API带有已经处理成npy格式的MNIST数据集，可以对其进行载入和计算。\n\
    \n```\n     mnist = tf.keras.datasets.mnist\n     (x_train, y_train), (x_test,\
    \ y_test) = mnist.load_data()\n```\n\n这里Keras能够自动连接互联网下载所需要的MNIST数据集，最终下载的是npz格式的数据集mnist.npz。\n\
    \n如果有读者无法连接下载数据，本书自带的代码库中也同样提供了对应的mnist.npz数据的副本，读者只将其复制到目标位置，之后在load\\_data函数中提供绝对地址即可，代码如下：\n\
    \n```\n     (x_train, y_train), (x_test, y_test) =\nmnist.load_data(path='C:/Users/wang_xiaohua/Desktop/TF2.0/dataset/mnist.npz')\n\
    ```\n\n需要注意的是，这里输入的是数据集的绝对地址。load\\_data函数会根据输入的地址将数据进行处理，并自动将其分解成训练集和验证集。打印训练集的维度如下：\n\
    \n![](OEBPS/Images/Figure-P99_10932.jpg)\n\n这里是使用Keras自带的API进行数据处理的第一个步骤，有兴趣的读者可以自行完成数据的读取和切分的代码。\n\
    \n在上面的代码段中，load\\_data函数可以按既定的格式读取出来。正如iris数据库一样，每个MNIST实例数据单元也是由2部分构成的，一幅包含手写数字的图片和一个与其相对应的标签。可以将其中的标签特征设置成“y”，而图片特征矩阵以“x”来代替，所有的训练集和测试集中都包含x和y。\n\
    \n图4.17用更为一般化的形式解释了MNIST数据实例的展开形式。在这里，图片数据被展开成矩阵的形式，矩阵的大小为28×28。至于如何处理这个矩阵，常用的方法是将其展开，而展开的方式和顺序并不重要，只需要将其按同样的方式展开即可。\n\
    \n![](OEBPS/Images/Figure-P100_11002.jpg)\n\n图4.17　图片转换为向量模式\n\n下面回到对数据的读取，前面已经介绍了，MNIST数据集实际上就是一个包含着60000张图片的60000×28×28大小的矩阵张量\\\
    [60000,28,28\\]，如图4.18所示。\n\n![](OEBPS/Images/Figure-P100_11003.jpg)\n\n图4.18　MNIST数据集的矩阵表示\n\
    \n矩阵中行数指的是图片的索引，用以对图片进行提取。后面的28×28个向量用以对图片特征进行标注。实际上，这些特征向量就是图片中的像素点，每张手写图片是\\\
    [28,28\\]的大小，每个像素转化为0~1之间的一个浮点数，构成矩阵。\n\n如同在上一章的例子中，每个实例的标签对应于0~9之间的任意一个数字，用以对图片进行标注。需要注意的是，对于提取出来的MNIST的特征值，默认是使用一个0~9的数值进行标注，但是这种标注方法并不能使得损失函数获得一个好的结果，因此常用的是one\\\
    _hot计算方法，即将值具体落在某个标注区间中。\n\none\\_hot的标注方法请读者自行学习掌握。这里笔者主要介绍将单一序列转化成one\\_hot的方法。一般情况下，TensorFlow也自带了转化函数，即tf.one\\\
    _hot函数，但是这个转化生成的是Tensor格式的数据，因此并不适合直接输入。\n\n如果读者能够自行编写将序列值转化成one\\_hot的函数，那么编程功底是不错的，但是Keras提供了已经编写好的转换函数：\n\
    \n```\n     tf.keras.utils.to_categorical\n```\n\n其作用是将一个序列转化成以one\\_hot形式表示的数据集，格式如图4.19所示。\n\
    \n![](OEBPS/Images/Figure-P101_11071.jpg)\n\n图4.19　one-hot数据集\n\n对于MNIST数据集的标签来说，实际上就是一个60000张图片的60000×10大小的矩阵张量\\\
    [60000,10\\]。前面的行数指的是数据集中图片的个数为60000个，后面的10是10个列向量。\n\n#### 4.2.3　TensorFlow 2.X编程实战：MNIST数据集\n\
    \n在上一节中，笔者对MNIST数据做了介绍，描述了其构成方式以及其中数据的特征和标签含义等。了解这些有助于编写适当的程序来对MNIST数据集进行分析和识别。下面将一步步地分析和编写代码以对数据集进行处理。\n\
    \n##### 1．数据的获取\n\n对于MNIST数据的获取实际上有很多渠道，读者可以使用TensorFlow 2.0自带的数据获取方式获得MNIST数据集并进行处理，代码如下：\n\
    \n![](OEBPS/Images/Figure-P101_39554.jpg)\n\n实际上，对于TensorFlow来说，它提供了常用API并收集整理一些数据集，为模型的编写和验证带来了最大限度的方便。\n\
    \n不过，对于软件自带的API和自己实现的API，应该选择哪个呢？\n\n选择自带的API！除非能肯定自带的API不适合你的代码。因为大多数自带的API在底层都会做一定程度的优化，调用不同的库包去最大效率地实现功能，因此即使自己的API与其功能一样，但是内部实现还是有所不同的。请牢记“不要重复造轮子”。\n\
    \n##### 2．数据的处理\n\n对于数据的处理，读者可以参考iris数据的处理方式进行，即首先将label进行one-hot处理，之后使用TensorFlow自带的data\
    \ API进行打包，方便地组合成train与label的配对数据集。\n\n![](OEBPS/Images/Figure-P102_38200.jpg)\n\
    \n需要注意的是，在数据被读出后，x\\_train与x\\_test分别是训练集与测试集的数据特征部分，其是两个维度为\\[x,28,28\\]大小的矩阵，但是在4.1节中介绍卷积计算时，卷积的输入是一个4维的数据，还需要一个“通道”的标注，因此对其使用tf的扩展函数，修改了维度的表示方式。\n\
    \n##### 3．模型的确定与各模块的编写\n\n对于使用深度学习构建一个分辨MNIST的模型来说，最简单最常用的方法是建立一个基于卷积神经网络+分类层的模型，结构如图4.20所示。\n\
    \n![](OEBPS/Images/Figure-P102_11138.jpg)\n\n图4.20　基于卷积神经网络+分类层的模型\n\n从图4.20可以看到，一个简单的卷积神经网络模型是由卷积层、池化层、dropout层以及作为分类的全连接层构成的，同时每一层之间使用relu激活函数做分割，而batch\\\
    _normalization作为正则化的工具也被作为各个层之间的连接而使用。\n\n模型代码如下：\n\n![](OEBPS/Images/Figure-P103_39557.jpg)\n\
    \n下面分步进行解释。\n\n（1）输入的初始化\n\n输入的初始化使用的是Input类，这里根据输入的数据大小将输入的数据维度做成\\[28,28,1\\\
    ]，其中的batch\\_size不需要设置，TensorFlow会在后台自行推断。\n\n```\n     input_xs = tf.keras.Input([28,28,1])\n\
    ```\n\n（2）卷积层\n\nTensorFlow中自带了卷积层实现类对卷积的计算，这里首先创建了一个类，通过设定卷积核数据、卷积核大小、padding方式和激活函数初始化了整个卷积类。\n\
    \n```\n     conv = tf.keras.layers.Conv2D(32,3,padding=\"SAME\",\nactivation=tf.nn.relu)(input_xs)\n\
    ```\n\nTensorFlow中的卷积层的定义在绝大多数的情况下直接调用给定的实现好的卷积类即可。当卷积核大小等于3时，TensorFlow专门给予了优化，原因在下一章揭晓。现在读者只需要牢记卷积类的初始化和卷积层的使用即可。\n\
    \n（3）BatchNormalization和Maxpool层\n\nBatch\\_normalization和Maxpool层的目的是输入数据正则化，最大限度地减少模型的过拟合和增大模型的泛化能力。对于Batch\\\
    _normalization和Maxpool的实现，读者自行参考模型代码的写法做个实现，有兴趣的读者可以更深一步学习其相关的理论，本书就不再过多介绍了。\n\
    \n![](OEBPS/Images/Figure-P103_38203.jpg)\n\n（4）起分类作用的全连接层\n\n全连接层的作用是对卷积层所提取的特征做最终分类。这里我们首先使用flat函数，将提取计算后的特征值平整化，之后的2个全连接层起到特征提取和分类的作用，最终做出分类。\n\
    \n```\n     dense = tf.keras.layers.Dense(512, activation=tf.nn.relu)(flat)\n\
    \     logits = tf.keras.layers.Dense(10, activation=tf.nn.softmax)(dense)\n```\n\
    \n同样使用TensorFlow对模型进行打印，可以将所涉及的各个层级都打印出来，如图4.21所示。\n\n![](OEBPS/Images/Figure-P104_11438.jpg)\n\
    \n图4.21　打印各个层级\n\n可以看到，各个层依次被计算，并且所用的参数也打印出来了。\n\n**【程序4-5】**\n\n![](OEBPS/Images/Figure-P104_38205.jpg)\n\
    \n最终打印结果如图4.22所示。\n\n![](OEBPS/Images/Figure-P105_11538.jpg)\n\n图4.22　打印结果\n\n\
    可以看到，经过模型的训练，在测试集上最终的准确率达到0.9879，即98%以上，而损失率在0.05左右。\n\n#### 4.2.4　使用自定义的卷积层实现MNIST识别\n\
