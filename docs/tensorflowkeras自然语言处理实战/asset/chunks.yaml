    \ world，那么恭喜你，Python与PyCharm的配置完成了！\n\n#### 1.4.3　使用Python计算softmax函数\n\n对于Python科学计算来说，最简单的想法就是将数学公式直接表达成程序语言，可以说Python满足了这个想法。本节将使用Python实现和计算一个深度学习中最为常见的函数——softmax函数。至于这个函数的作用，现在不加以说明，这里只是带领读者尝试实现其程序的编写。\n\
    \n首先softmax计算公式如下所示：\n\n![](OEBPS/Images/Figure-P26_38702.jpg)\n\n其中，*V[i]*是长度为*j*的数列*V*中的一个数，带入softmax的结果其实就是先对每一个*V[i]*取以e为底的指数计算变成非负，然后除以所有项之和进行归一化，之后每个*V[i]*就可以解释成：在观察到的数据集类别中特定的*V[i]*属于某个类别的概率，或者称作似然（Likelihood）。\n\
    \n**提示**\n\nsoftmax用以解决概率计算中概率结果大而占绝对优势的问题。例如，函数计算结果中有2个值*a*和*b*，且*a*\\>*b*，如果简单地以值的大小为单位衡量，那么在后续的使用过程中，*a*永远被选用，而*b*使用由于数值较小而不会被选择，但是有时候也需要使用数值小的*b*，那么softmax就可以解决这个问题了。\n\
    \nsoftmax按照概率选择*a*和*b*，由于*a*的概率值大于*b*，在计算时*a*经常会被取得，而*b*由于概率较小，取得的可能性也较小，但是也有概率被取得。\n\
    \n公式softmax的代码如下所示。\n\n**【程序1-1】**\n\n![](OEBPS/Images/Figure-P26_38099.jpg)\n\
    \n可以看到，当传入一个数列后，分别计算每个数值所对应的指数函数值，之后将其相加后计算每个数值在数值和中的概率。\n\n![](OEBPS/Images/Figure-P26_16183.jpg)\n\
