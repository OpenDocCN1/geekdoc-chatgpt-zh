    \n##### 2．模型的导入和编译\n\n这一步导入模型，并设定优化器和损失函数，代码如下：\n\n![](OEBPS/Images/Figure-P152_38283.jpg)\n\
    \n##### 3．模型的计算\n\n全部代码如下所示。\n\n**【程序6-8】**\n\n![](OEBPS/Images/Figure-P153_38284.jpg)\n\
    \n根据不同的硬件设备，模型的参数和训练集的batch\\_size都需要做出调整，具体数值请根据需要对它们做设置。\n\n### 6.3　ResNet的兄弟——ResNeXt\n\
    \n大家对一层一层堆叠的网络形成思维惯性的时候，shortcut的思想是跨越性的。即使网络层级叠加到100层，运算量也和16层的VGG相差不多，精度却提高了一个档次，而且模块性、可移植性很强。\n\
    \n#### 6.3.1　ResNeXt诞生的背景\n\n随着研究的深入以及ResNet层次的加深，研究人员开始在增加网络的“宽度”方面进行探究。神经网络的标准范式就符合这样的“分割-转换-合并”（split-transform-merge）模式。下面以一个简单的普通神经元为例（比如dense中的每个神经元）进行讲解，如图6.13所示。\n\
    \n![](OEBPS/Images/Figure-P154_23224.jpg)\n\n图6.13　神经元\n\n神经网络就是对输入的数据进行权重乘积，求和后经过一个激活函数，因此又可以用公式表示为：\n\
