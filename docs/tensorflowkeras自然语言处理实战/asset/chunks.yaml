    使用输出的`embeddings_matrix`则由下列函数完成：


    ```

    import tensorflow as tf

    embedding_table = tf.keras.layers.Embedding(input_dim=len(embeddings_matrix),
    output_dim=300,weights=[embeddings_matrix],trainable=False)

    ```


    在这里训练好的`embeddings_matrix`被作为参数传递给`TensorFlow` 2.0 中`Embedding`列表进行设置。需要注意的是对于其部分参数需要根据传入的`embeddings_matrix`进行设置，读者只需要遵循这种写法即可。


    下面的一个问题是`TensorFlow`的`embedding`中进行 look_up 查询时，传入的是每个字符的序号，因此需要一个“编码器”将字符编码为对应的序号。


