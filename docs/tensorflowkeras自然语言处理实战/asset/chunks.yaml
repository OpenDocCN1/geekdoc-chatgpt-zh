    \n#### 4.1.5　卷积神经网络原理\n\n前面介绍了卷积运算的基本原理和概念，从本质上来说卷积神经网络就是将图像处理中的二维离散卷积运算和神经网络相结合。这种卷积运算可以用于自动提取特征，而卷积神经网络也主要应用于二维图像的识别。下面笔者将采用图示的方法更加直观地介绍卷积神经网络的工作原理。\n\
    \n一个卷积神经网络中有一个输入层、一个卷积层、一个输出层，但是在真正使用的时候一般会使用多层卷积神经网络不断地去提取特征，特征越抽象，越有利于识别（分类）。通常，卷积神经网络也包含池化层、全连接层，最后接输出层。\n\
    \n·　图像输入：获取输入的数据图像。\n\n·　卷积：对图像特征进行提取。\n\n·　Pooling层：用于缩小在卷积时获取的图像特征。\n\n·　全连接层：用于对图像进行分类。\n\
