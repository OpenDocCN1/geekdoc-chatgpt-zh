    \n![](OEBPS/Images/Figure-P234_39749.jpg)\n\n#### 9.2.2　构建编码器架构\n\n经过本章前面内容的分析可以看到，实现一个transformer架构的编码器在理解上并不困难。只需要按架构依次将其组合在一起即可。下面笔者逐步提供代码，读者可参考注释。\n\
