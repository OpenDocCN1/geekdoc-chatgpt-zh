    # TensorFlow Datasets 与 TensorBoard 使用


    对于大多数TensorFlow初学者来说，选择一个合适的数据集是作为初始练手项目一个非常重要的起步。为了帮助初学者方便迅捷地获取合适的数据集，并作为一个标准的评分测试标准，TensorFlow推出了一个新的功能，叫作TensorFlow
    Datasets，可以将`tf.data`和Numpy的格式用公共数据集装载到TensorFlow里，方便迅捷地供使用者调用。


    当使用TensorFlow训练大量深层的神经网络时，使用者希望跟踪神经网络整个训练过程中的信息，比如迭代过程中每一层参数是如何变化与分布的、每次循环参数更新后模型在测试集与训练集上的准确率是如何、损失值的变化情况等。如果能在训练的过程中将一些信息加以记录并可视化地表现出来，那么对探索模型会有更深的帮助与理解。


    本章着重解决这2个问题，详细介绍TensorFlow Datasets和TensorBoard的使用。


    ## 5.1 TensorFlow Datasets简介


    目前来说，已经有85个数据集可以通过TensorFlow Datasets装载，读者可以通过打印的方式获取到全部的数据集名称（由于数据集仍在不停地添加中，显示结果由打印为准）：


    ```

    import tensorflow_datasets as tfds

    print(tfds.list_builders())

    ```


    结果如下所示。


    ```

    [''abstract_reasoning'', ''bair_robot_pushing_small'', ''bigearthnet'', ''caltech101'',

    ''cats_vs_dogs'', ''celeb_a'', ''celeb_a_hq'', ''chexpert'', ''cifar10'', ''cifar100'',

    ''cifar10_corrupted'', ''clevr'', ''cnn_dailymail'', ''coco'', ''coco2014'',

    ''colorectal_histology'', ''colorectal_histology_large'',

    ''curated_breast_imaging_ddsm'', ''cycle_gan'', ''definite_pronoun_resolution'',

    ''diabetic_retinopathy_detection'', ''downsampled_imagenet'', ''dsprites'', ''dtd'',

    ''dummy_dataset_shared_generator'', ''dummy_mnist'', ''emnist'', ''eurosat'',

    ''fashion_mnist'', ''flores'', ''glue'', ''groove'', ''higgs'', ''horses_or_humans'',

    ''image_label_folder'', ''imagenet2012'', ''imagenet2012_corrupted'', ''imdb_reviews'',

    ''iris'', ''kitti'', ''kmnist'', ''lm1b'', ''lsun'', ''mnist'', ''mnist_corrupted'',

    ''moving_mnist'', ''multi_nli'', ''nsynth'', ''omniglot'', ''open_images_v4'',

    ''oxford_flowers102'', ''oxford_iiit_pet'', ''para_crawl'', ''patch_camelyon'',

    ''pet_finder'', ''quickdraw_bitmap'', ''resisc45'', ''rock_paper_scissors'', ''shapes3d'',

    ''smallnorb'', ''snli'', ''so2sat'', ''squad'', ''starcraft_video'', ''sun397'',
    ''super_glue'',

    ''svhn_cropped'', ''ted_hrlr_translate'', ''ted_multi_translate'', ''tf_flowers'',

    ''titanic'', ''trivia_qa'', ''uc_merced'', ''ucf101'', ''voc2007'', ''wikipedia'',

    ''wmt14_translate'', ''wmt15_translate'', ''wmt16_translate'', ''wmt17_translate'',

    ''wmt18_translate'', ''wmt19_translate'', ''wmt_t2t_translate'', ''wmt_translate'',

    ''xnli'']。

    ```


    可能有读者对这么多的数据集不熟悉，当然笔者也不建议读者一一去查看和测试这些数据集。表5.1列举了TensorFlow Datasets较为常用的6种类型29个数据集，分别涉及音频、图像、结构化数据、文本、翻译和视频类数据。


    **表5.1 TensorFlow Datasets数据集**


    ![](OEBPS/Images/Figure-T110_37783.jpg)


    ### 5.1.1 Datasets数据集的安装


    一般而言，安装好TensorFlow以后，TensorFlow Datasets是默认安装的。如果读者没有安装TensorFlow Datasets，可以通过如下代码段进行安装：


    ```

    pip install tensorflow_datasets

    ```


    ### 5.1.2 Datasets数据集的使用


    下面以MNIST数据集为例介绍Datasets数据集的基本使用情况。MNIST数据集展示代码如下：


    ```

    import tensorflow as tf

    import tensorflow_datasets as tfds

    mnist_data = tfds.load("mnist")

    mnist_train, mnist_test = mnist_data["train"], mnist_data["test"]


    assert isinstance(mnist_train, tf.data.Dataset)

    ```


    这里首先导入了`tensorflow_datasets`作为数据的获取接口，之后调用`load`函数获取`mnist`数据集的内容，再按照`train`和`test`数据的不同将其分割成训练集和测试集。运行效果如图5.1所示。


    第一次下载时，`tfds`连接数据的下载点获取数据的下载地址和内容，此时只需静待数据下载完毕即可。下面打印数据集的维度和一些说明，代码如下：


    ```

    import tensorflow_datasets as tfds

    mnist_data = tfds.load("mnist")

    mnist_train, mnist_test = mnist_data["train"], mnist_data["test"]


    print(mnist_train)

    print(mnist_test)

    ```


    ![](OEBPS/Images/Figure-P112_12706.jpg)


    图5.1 运行效果


    根据下载的数据集的具体内容，数据集已经被调整成相应的维度和数据格式，显示结果如图5.2所示。


    ![](OEBPS/Images/Figure-P112_12707.jpg)


    图5.2 数据集效果


    MNIST数据集中的数据大小是`[28,28,1]`维度的图片，数据类型是`int8`，而`label`类型为`int64`。这里有读者可能会奇怪，以前MNIST数据集的图片数据很多，而这时只显示了一条数据的类型。实际上当数据集输出结果如上所示时，已经将数据集内容下载到本地。


    `tfds.load`是一种方便的方法，是构建和加载`tf.data.Dataset`最简单的方法。其获取的是一个不同的字典类型的文件，根据不同的`key`获取不同的`value`值。


    为了方便那些在程序中需要简单Numpy数组的用户，可以使用`tfds.as_numpy`返回一个生成Numpy数组记录的生成器`tf.data.Dataset`。这允许使用`tf.data`接口构建高性能输入管道。


    ![](OEBPS/Images/Figure-P112_38218.jpg)


    还可以将`tfds.as_numpy`结合`batch_size=-1`从返回的`tf.Tensor`对象中获取Numpy数组中的完整数据集：


    ```

    train_ds = tfds.load("mnist", split=tfds.Split.TRAIN, batch_size=-1)

    numpy_ds = tfds.as_numpy(train_ds)

    numpy_images, numpy_labels = numpy_ds["image"], numpy_ds["label"]

    ```


    **注意**


    `load`函数中还额外添加了一个`split`参数，这里是将数据在传入的时候直接进行了分割，按数据的类型分割成`image`和`label`值。


    更新一步的，如果需要对数据集进行更细一步的划分，按配置将其分成训练集、验证集和测试集，代码如下：


    ```

    import tensorflow_datasets as tfds

    splits = tfds.Split.TRAIN.subsplit(weighted=[2, 1, 1])

    (raw_train, raw_validation, raw_test), metadata = tfds.load(''mnist'',

    split=list(splits),with_info=True, as_supervised=True)

    ```


    这里`tfds.Split.TRAIN.subsplit`函数按传入的权重将其分成训练集占50%、验证集占25%、测试集占25%。


