    ## 8.3 本章小结


    本章着重介绍了两类特征提取器，使用`TensorFlow`自带的模型做特征提取器以及编写自定义的模型用作特征提取器。相比较而言，使用专用的自定义模型能够较`TensorFlow`自带的模型带来更好的效果以及更少的训练时间。


    实际上无论是开始的`GRU`模型、`TensorFlow`自带的模型还是后续自定义的`DPCNN`模型，对于最终的分类器来说起到的都是一个特征提取器的作用。因此，可以将其统一地定义为“编码器”。


    编码器用作对特征的提取，在下一章的内容中，笔者将介绍最新的使用注意力模型建立的特征提取器`encoder`。


    # 第9章 从0起步——自然语言处理的编码器


    在前面的章节中，笔者带领读者掌握了使用多种方式对字符进行表示的方法，例如最原始的`one-hot`方法、现在较为常用的`word2vec`和`fastText`计算出的`embedding`（词嵌入、字嵌入）等。这些都是将字符进行向量化处理的方法。


    无论是老方法还是现在常用的方法，或者是将来出现的新算法，有没有一个统一的称谓？答案是“有”，所有的这些处理方法都可以被简称为`encoder`（编码器）。编码器可以对文本进行投影，如图9.1所示。


