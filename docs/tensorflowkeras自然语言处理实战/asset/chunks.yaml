    \ = [\"PAD\"] + list(sorted(hanzi_vocab))\n```\n\n**第三步：根据字库生成Token数据**\n\n获取的拼音标注和汉字标注的训练数据并不能直接用于模型训练，模型需要转化成token的一系列数字列表，代码如下：\n\
    \n![](OEBPS/Images/Figure-P241_39766.jpg)\n\n代码中创建了两个新的列表，分别对拼音和汉字的token进行存储，而获取根据字库序号编号后新的序列token。\n\
    \n#### 9.3.2　汉字拼音转化模型的确定\n\n下面就是模型的编写。\n\n实际上单纯使用在9.2节提供的模型也是可以的，但是一般需要对其做出修正。单纯使用一层编码器对数据进行编码，在效果上可能并没有多层的准确率高，因此一个最简单的方法就是：增加更多层的编码器对数据进行编码。\n\
    \n使用自注意力机制的编码器架构如图9.19所示，代码如下所示：\n\n![](OEBPS/Images/Figure-P241_33422.jpg)\n\n\
    图9.19　使用自注意力机制的编码器\n\n**【程序9-5】**\n\n![](OEBPS/Images/Figure-P241_39769.jpg)![](OEBPS/Images/Figure-P242_39770.jpg)![](OEBPS/Images/Figure-P243_39771.jpg)![](OEBPS/Images/Figure-P244_39772.jpg)\n\
    \n这里相对于9.2.2节中的编码器构建示例，使用了多层的自注意力层和前馈层。需要注意的是，**这里仅仅是在编码器层中加入了更多层的“多头注意力层”和“前馈层”，而不是直接加载了更多的“编码器”**。\n\
    \n#### 9.3.3　模型训练部分的编写\n\n剩下的就是模型训练部分的编写。笔者在这里采用最简单的模型训练的程序编写方式完成代码的编写。\n\n由于模型在训练过程中不可能一次性将所有的数据导入，因此需要创建一个“生成器”，将获取的数据按批次发送给训练模型，这部分代码如下：\n\
