    ### 3.2.2　道士下山的故事——梯度下降算法


    在介绍随机梯度下降算法之前，给大家讲一个道士下山的故事，请看图 3.7。


    ![](img/Figure-P71_8561.jpg)


    图 3.7　模拟随机梯度下降算法的演示图


    这是一个模拟随机梯度下降算法的演示图。为了便于理解，我们将其比喻成道士想要出去游玩的一座山。


    设想道士有一天和道友一起到一座不太熟悉的山上去玩，在兴趣盎然中很快登上了山顶。但是天有不测，下起了雨。如果这时需要道士和其同来的道友用最快的速度下山，那么怎么办呢？


    如果想以最快的速度下山，那么最快的办法就是顺着坡度最陡峭的地方走下去。由于不熟悉路，道士在下山的过程中，每走过一段路程就需要停下来观望，从而选择最陡峭的下山路。这样一路走下来，就可以在最短时间内走到底。


    图 3.7 中的路可以近似地表示为：


    ①→②→③→④→⑤→⑥→⑦


    每个数字代表每次停顿的地点，这样只需要在每个停顿的地点选择最陡峭的下山路即可。


    这就是道士下山的故事，随机梯度下降算法和这个类似。如果想要使用最迅捷的下山方法，最简单的办法就是在下降一个梯度的阶层后寻找一个当前获得的最大坡度继续下降。这就是随机梯度算法的原理。


    从上面的例子可以看到，随机梯度下降算法就是不停地寻找某个节点中下降幅度最大的那个趋势进行迭代计算，直到将数据收缩到符合要求的范围为止。通过数学公式表达的方式计算的话，公式如下：


    `f(θ)=θ[0]x[0]+θ[1]x[1]+...+θ[n]x[n]=∑θ[i]x[i]`


    在上一节讲最小二乘法的时候，我们通过最小二乘法说明了直接求解最优化变量的方法，也介绍了在求解过程中的前提条件是要求计算值与实际值的偏差的平方最小。


    在随机梯度下降算法中，对于系数需要通过不停地求解出当前位置下最优化的数据。同样是使用数学方式表达的话就是不停地对系数`θ`求偏导数，即公式如下所示：


    ![](img/Figure-P71_39196.jpg)


    公式中的`θ`会向着梯度下降的最快方向减少，从而推断出`θ`的最优解。


    因此，随机梯度下降算法最终被归结为：通过迭代计算特征值，从而求出最合适的值。`θ`求解的公式如下：


    `θ=θ-α(f(θ)-y[i])x[i]`


    公式中`α`是下降系数。用较为通俗的话表示就是用来计算每次下降的幅度大小。系数越大，每次计算中差值较大；系数越小，差值越小，但是计算时间也相对延长。


    随机梯度下降算法将梯度下降算法通过一个模型来表示的话如图 3.8 所示。


    ![](img/Figure-P72_8667.jpg)


    图 3.8　随机梯度下降算法过程


    从图 3.8 中可以看到，实现随机梯度下降算法的关键是拟合算法的实现。本例的拟合算法实现较为简单，通过不停地修正数据值从而达到数据的最优值。


    随机梯度下降算法在神经网络特别是机器学习中应用较广，由于其天生的缺陷，噪音较多，使得在计算过程中并不是都向着整体最优解的方向优化，往往可能只是一个局部最优解。为了克服这些困难，最好的办法就是增大数据量，在不停地使用数据进行迭代处理的时候能够确保整体的方向是全局最优解，或者最优结果在全局最优解附近。


