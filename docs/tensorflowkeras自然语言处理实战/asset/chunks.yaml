    \n本章主要介绍了两个TensorFlow 2.X中的高级API。TensorFlow Datasets简化了数据集的获取与使用，并且其中的数据集依旧在不停地增加中。TensorBoard是可视化模型训练过程的利器，通过其对模型训练过程不同维度的观测可以帮助用户更好地对模型进行训练。\n\
    \n# 第6章  \n\n从冠军开始：ResNet\n\n随着VGG网络模型的成功，更深、更宽、更复杂的网络似乎成为卷积神经网络搭建的主流。卷积神经网络能够用来提取所侦测对象的低、中、高特征，网络的层数越多，意味着能够提取到不同level的特征越丰富，并且通过还原镜像发现越深的网络提取的特征越抽象，越具有语义信息。\n\
    \n这也产生了一个非常大的疑问，是否可以单纯地通过增加神经网络模型的深度和宽度，即增加更多的隐藏层和每个层之中的神经元去获得更好的结果？\n\n答案是不可能。根据实验发现，随着卷积神经网络层数的加深，出现了另外一个问题，即在训练集上准确率难以达到100%正确，甚至于产生了下降。\n\
    \n这似乎不能简单地解释为卷积神经网络的性能下降，因为卷积神经网络加深的基础理论就是越深越好。如果强行解释为产生了“过拟合”，似乎也不能够解释准确率下降的问题，因为如果产生了过拟合，那么在训练集上卷积神经网络应该表现得更好才对。\n\
    \n这个问题被称为“神经网络退化”。\n\n神经网络退化问题的产生说明了卷积神经网络不能够被简单地使用堆积层数的方法进行优化！\n\n2015年，152层深的ResNet横空出世，取得ImageNet竞赛冠军，相关论文在CVPR\
    \ 2016斩获最佳论文奖。ResNet成为视觉乃至整个AI界的一个经典。ResNet使得训练深达数百甚至数千层的网络成为可能，而且性能仍然优异。\n\n\
    本章将主要介绍ResNet及其变种。后面章节介绍的Attention模块也是基于ResNet模型的扩展，因此本章内容非常重要。本章还会引入一个新的模块TensorFlow-layers，这是为了简化。\n\
    \n让我们站在巨人的肩膀上，从冠军开始！\n\n**提示**\n\nResNet非常简单。\n\n### 6.1　ResNet基础原理与程序设计基础"
  fmt: "\n首先是数据集的获取，Keras中的`datasets`函数有`fashion_mnist`数据集，因此直接导入即可。与`tenesorflow_dataset`数据集类似，也是直接从网上下载数据并将其存储在本地，打印结果如图5.7所示。\n\
