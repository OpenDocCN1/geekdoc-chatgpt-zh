    \n（1）推荐使用Windows Python 3.6的版本。集成Python 3.6版本的Anaconda可以在清华大学Anaconda镜像网站下载，地址为https://mirrors.tuna.tsinghua.edu.cn/anaconda/archive/，打开后如图1.2所示。\n\
