    \n![](OEBPS/Images/Figure-P95_10845.jpg)\n\n图4.8　卷积处理的分解图像\n\n可以看到，经过卷积处理后的图像被分为若干个大小相同、只具有局部特征的图片。图4.9表示对分解后的图片使用一个小型神经网络做更进一步的处理，即将二维矩阵转化成一维数组。\n\
