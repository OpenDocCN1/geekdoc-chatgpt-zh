    ### 4. pooling简介


    `pooling`即池化。`layers`模块提供了多个池化方法，包括`max_pooling1d()`、`max_pooling2d()`、`max_pooling3d()`、`average_pooling1d()`、`average_pooling2d()`、`average_pooling3d()`，分别代表一维、二维、三维的最大和平均池化方法，这里以常用的`avg_pooling2d`为例进行讲解。


    ```

    def __init__(self,

    pool_size=(2, 2),

    strides=None,

    padding=''valid'',

    data_format=None,

    **kwargs):

    ```


    参数说明如下：


    - `pool_size`：必需，池化窗口大小，必须是一个数字（高和宽都是此数字）或者长度为2的列表（分别代表高、宽）。

    - `strides`：必需，池化步长，必须是一个数字（高和宽都是此数字）或者长度为2的列表（分别代表高、宽）。

    - `padding`：可选，`padding`的方法，`valid`或者`same`，大小写不区分，默认为`valid`。

    - `data_format`：可选，分为`channels_last`和`channels_first`两种模式，代表了输入数据的维度类型，默认为`channels_last`。如果是`channels_last`，那么输入数据的`shape`为`(batch,height,width,channels)`。如果是`channels_first`，那么输入数据的`shape`为`(batch,channels,height,width)`。

    - `name`：可选，池化层的名称，默认为`None`。

    - 返回值：经过池化处理后的`Tensor`。


    ### 【程序6-4】


    ```

    import tensorflow as tf

    #自定义输入数据

    with tf.device("/CPU:0"):

    xs = tf.random.truncated_normal(shape=[50, 32, 32, 32])

    out = tf.keras.layers.AveragePooling2D(strides=[1,1])(xs)

    print(out.shape)

    ```


    这里对输入值设置了以`[2,2]`为大小的均值核，步进为`[1,1]`。补全方式为`SAME`，即通过补0的方式对输入数据进行补全。结果如下：


    `（50, 31, 31, 32）`


