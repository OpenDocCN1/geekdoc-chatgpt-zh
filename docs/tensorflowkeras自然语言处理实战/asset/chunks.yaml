    ## 6.3 ResNet的兄弟——ResNeXt


    大家对一层一层堆叠的网络形成思维惯性的时候，`shortcut`的思想是跨越性的。即使网络层级叠加到100层，运算量也和16层的`VGG`相差不多，精度却提高了一个档次，而且模块性、可移植性很强。


    ### 6.3.1 ResNeXt诞生的背景


    随着研究的深入以及`ResNet`层次的加深，研究人员开始在增加网络的“宽度”方面进行探究。神经网络的标准范式就符合这样的“分割-转换-合并”`split-transform-merge`模式。下面以一个简单的普通神经元为例（比如`dense`中的每个神经元）进行讲解，如图6.13所示。


    ![](OEBPS/Images/Figure-P154_23224.jpg)


    图6.13　神经元


    神经网络就是对输入的数据进行权重乘积，求和后经过一个激活函数，因此又可以用公式表示为：


    ![](OEBPS/Images/Figure-P154_37787.jpg)


    `ResNet`的公式表示为：


    ![](OEBPS/Images/Figure-P154_37788.jpg)


    公式中，`*T*`函数理解为`ResNet`中的任意通路“模块”，`*x*`为数据的`shortcut`，`*n*`为模块中通路的个数，如图6.14所示。`shortcut`与通路模块共同构成了一个完整的“残差单元”。


    ![](OEBPS/Images/Figure-P154_23225.jpg)


    图6.14　残差单元


    可以简单地理解，随着`*n*`的增加，“通路”增加能够带来方程`*w*(*x*)`值的增加，即使单个增加的幅度很小，求和后一样可以带来效果的改善，即在每个`ResNet`模块中增加通路个数。这也是`ResNeXt`产生的初衷。


    `ResNet`和`ResNeXt`的基本结构如图6.15所示，左边是`ResNet`的基本结构，右边是`ResNeXt`的基本结构。


    ![](OEBPS/Images/Figure-P155_23236.jpg)


    图6.15　`ResNet`和`ResNeXt`的基本结构


    `*w*(*x*)`是32组同样结构的变化，求和以后与输入端的`shortcut`进行二次叠加，如图6.16所示。


    ![](OEBPS/Images/Figure-P155_23237.jpg)


    图6.16　`shortcut`


    更进一步对`ResNeXt`做改进，如果将输入的`[1,1]`卷积层合并在一起，减少通道数，最终还是形成了经典的`ResNet`结构，因此也可以认为经典的`ResNet`就是`ResNeXt`的一个特殊结构。


