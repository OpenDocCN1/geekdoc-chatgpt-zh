    图3.13　反馈神经网络最终误差的计算


    之后以计算出的测量值与真实值为起点，反向传播到上一个节点，并计算出节点的误差值，如图3.14所示。


    ![](OEBPS/Images/Figure-P76_8985.jpg)


    图3.14　反馈神经网络输出层误差的传播


    以后将计算出的节点误差重新设置为起点，依次向后传播误差，如图3.15所示。


    **注意**


    对于隐藏层，误差并不是像输出层一样由单个节点确定而是由多个节点确定，因此对它的修正要计算所有与其连接的节点误差反馈值之和。


    ![](OEBPS/Images/Figure-P77_8994.jpg)


    图3.15　反馈神经网络隐藏层误差的计算


    通俗地解释，一般情况下误差的产生是由于输入值与权重的计算产生了错误。输入值往往是固定不变的，因此对于误差的调节则需要对权重进行更新。权重的更新又是以输入值与真实值的偏差为基础的，当最终层的输出误差被反向一层层地传递回来后，每个节点被相应地分配适合其在神经网络地位中所担负的误差，即只需要更新其所需承担的误差量，如图3.16所示。


    ![](OEBPS/Images/Figure-P77_8996.jpg)


