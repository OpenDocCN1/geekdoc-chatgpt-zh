    model = fastText(min_count=5,size=300,window=7,workers=10,iter=50,seed=17,sg=1,hs=1)

    ```


    其中，`fastText`参数定义如下：


    - `sentences` (iterable of iterables, optional)：供训练的句子，可以使用简单的列表，但是对于大语料库，建议直接从磁盘／网络流迭代传输句子。

