    ## 7.4　针对文本的卷积神经网络模型简介——词卷积


    使用字符卷积对文本分类是可以的，但是相对于词来说字符包含的信息并没有“词”的内容多，即使卷积神经网络能够较好地对数据信息进行学习，由于包含的内容关系其最终效果也就一般。


    在字符卷积的基础上，研究人员尝试使用词为基础数据对文本进行处理。图 7.32 是使用`CNN`做词卷积模型。


    ![](img/Figure-P194_28045.jpg)


    图 7.32　使用`CNN`做词卷积模型


    在实际读写中，一般短文本用于表达较为集中的思想，文本长度有限、结构紧凑、能够独立表达意思，因此可以使用基于词卷积的神经网络对数据进行处理。


    ### 7.4.1　单词的文本处理


    使用卷积神经网络对单词进行处理的一个最基本的要求就是将文本转换成计算机可以识别的数据。在上一节的学习内容中使用卷积神经网络对字符的`one-hot`矩阵进行分析处理。一个简单的想法也是是否将文本中的单词依旧处理成`one-hot`矩阵，如图
    7.33 所示。


    ![](img/Figure-P195_28103.jpg)


    图 7.33　词的`one-hot`处理


    使用`one-hot`对单词进行表示从理论上可行，但是在事实中并不是一种可行方案，对于基于字符的`one-hot`方案来说，所有的字符会在一个相对合适的字库中选取，例如从
    26 个字母或者一些常用的字符，那么总量并不会很多（通常少于 128 个），因此组成的矩阵也不会很大。


    对于单词来说，常用的英文单词或者中文词语一般在 5000 左右，因此建立一个稀疏、庞大的`one-hot`矩阵是一个不切实际的想法。


    目前来说一个较好的解决方法就是使用`word2vec`的`word embedding`方法，这样可以通过学习将字库中的词转换成维度一定的向量，作为卷积神经网络的计算依据。本节的处理和计算依旧使用文本标题作为处理的目标。单词词向量的建立步骤如下所示。


