    #### 2. batch_normalization 简介

    `batch_normalization`是目前最常用的数据标准化方法，也是批量标准化方法。输入数据经过处理之后能够显著加速训练速度，并且减少过拟合出现的可能性。


    ```

    def __init__(self,

    axis=-1,

    momentum=0.99,

    epsilon=1e-3,

    center=True,

    scale=True,

    beta_initializer=''zeros'',

    gamma_initializer=''ones'',

    moving_mean_initializer=''zeros'',

    moving_variance_initializer=''ones'',

    beta_regularizer=None,

    gamma_regularizer=None,

    beta_constraint=None,

    gamma_constraint=None,

    renorm=False,

    renorm_clipping=None,

    renorm_momentum=0.99,

    fused=None,

    trainable=True,

    virtual_batch_size=None,

    adjustment=None,

    name=None,

    **kwargs):

    ```


    参数说明如下：


    · `axis`：可选，进行标注化操作时操作数据的哪个维度，默认为-1。

    · `momentum`：可选，动态均值的动量，默认为 0.99。

    · `epsilon`：可选，大于 0 的小浮点数，用于防止除 0 错误，默认为 0.01。

    · `center`：可选，若设为 True，则会将`beta`作为偏置加上去，否则忽略参数`beta`，默认为 True。

    · `scale`：可选，若设为 True，则会乘以`gamma`，否则不使用`gamma`，默认为 True。当下一层是线性的时，可以设为 False，因为
    scaling 的操作将被下一层执行。

    · `beta_initializer`：可选，`beta`权重的初始方法，默认为`zeros_initializer`。

    · `gamma_initializer`：可选，`gamma`的初始化方法，默认为`ones_initializer`。

    · `moving_mean_initializer`：可选，动态均值的初始化方法，默认为`zeros_initializer`。

    · `moving_variance_initializer`：可选，动态方差的初始化方法，默认为`ones_initializer`。

    · `beta_regularizer`：可选，`beta`的正则化方法，默认为 None。

    · `gamma_regularizer`：可选，`gamma`的正则化方法，默认为 None。

    · `beta_constraint`：可选，加在`beta`上的约束项，默认为 None。

    · `gamma_constraint`：可选，加在`gamma`上的约束项，默认为 None。

    · `training`：可选，返回结果是`training`模式，默认为 False。

    · `trainable`：可选，布尔类型。若为 True，则将变量添加到`GraphKeys.TRAINABLE_VARIABLES`中，默认为 True。

    · `name`：可选，层名称，默认为 None。

    · `fused`：可选，根据层名判断是否重复利用，默认为 None。

    · `renorm`：可选，是否要用 BatchRenormalization，默认为 False。

    · `renorm_clipping`：可选，默认为 None。

    · `renorm_momentum`：可选，用来更新动态均值和标准差的 Momentum 值，默认为 0.99。

    · `fused`：可选，是否使用一个更快、融合的实现方法，默认为 None。

    · `virtual_batch_size`：可选，是一个 int 数字，指定一个虚拟 batchsize，默认为 None。

    · `adjustment`：可选，对标准化后的结果进行适当调整的方法，默认为 None。


    其用法也很简单，直接在`tf.layers.batch_normalization`函数中输入`xs`即可。


