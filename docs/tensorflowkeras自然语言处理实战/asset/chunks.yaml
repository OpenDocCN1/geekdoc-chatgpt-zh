- raw: "ResNet的出现彻底改变了VGG系列所带来的固定思维，破天荒地提出了采用模块化的思维来替代整体的卷积层，通过一个个模块的堆叠来替代不断增加的卷积层。对ResNet的研究和不断改进成为过去几年中计算机视觉和深度学习领域最具突破性的工作。由于其表征能力强，ResNet在图像分类任务以外的许多计算机视觉应用上取得了巨大的性能提升，例如对象检测和人脸识别。\n\
    \n#### 6.1.1　ResNet诞生的背景\n\n卷积神经网络的实质就是无限拟合一个符合对应目标的函数。根据泛逼近定理（universal approximation\
    \ theorem），如果给定足够的容量，一个单层的前馈网络就足以表示任何函数。这个层可能是非常大的，而且容易过拟合数据。因此，学术界有一个共同的认识，就是网络架构需要更深。\n\
    \n研究发现只是简单地将层堆叠在一起，增加网络的深度并不会起太大的作用。这是由于难搞的梯度消失（vanishing gradient）问题，深层的网络很难训练。因为梯度反向传播到前一层，重复相乘可能使梯度无穷小。结果就是随着网络的层数更深，其性能趋于饱和，甚至开始迅速下降，如图6.1所示。\n\
    \n![](OEBPS/Images/Figure-P133_14605.jpg)\n\n图6.1　随着网络的层数更深，其性能趋于饱和，甚至开始迅速下降\n\
    \n在ResNet之前，已经出现好几种处理梯度消失问题的方法，但是没有一个方法能够真正解决这个问题。何恺明等人于2015年发表的论文“*Deep Residual\
    \ Learning for Image Recognition*”（用于图像识别的深度残差学习）中，认为堆叠的层不应该降低网络的性能，可以简单地在当前网络上堆叠映射层（不处理任何事情的层），并且所得到的架构性能不变。\n\
    \n![](OEBPS/Images/Figure-P133_39605.jpg)\n\n当*f*(*x*)为0时，*f′*(*x*)等于*x*；当*f*(*x*)不为0时，所获得的*f′*(*x*)性能要优于单纯地输入*x*。公式表明，较深的模型所产生的训练误差不应比较浅的模型误差更高。假设让堆叠的层拟合一个残差映射（residual\
    \ mapping）要比让它们直接拟合所需的底层映射更容易。\n\n从图6.2可以看到，残差映射与传统的直接相连的卷积网络相比，最大的变化是加入了一个恒等映射层*y*\\\
    =*x*层。其主要作用是使得网络随着深度的增加而不会产生权重衰减、梯度衰减或者消失这些问题。\n\n![](OEBPS/Images/Figure-P134_14661.jpg)\n\
    \n图6.2　残差框架模块\n\n其中，*F*(*x*)表示的是残差，*F*(*x*)+*x*是最终的映射输出，因此可以得到网络的最终输出为*H*(*x*)=*F*(*x*)+*x*。由于网络框架中有2个卷积层和2个relu函数，因此最终的输出结果可以表示为：\n\
    \n*H*[1](*x*)=relu[1](*w*[1]×*x*)\n\n*H*[2](*x*)=relu[2](*w*[2]×*h*[1](*x*))\n\
    \n*H*(*x*)=*H*[2](*x*)+*x*\n\n其中，*H*[1]是第一层的输出，*H*[2]是第二层的输出。这样在输入与输出有相同维度时，可以使用直接输入的形式将数据传递到框架的输出层。\n\
    \nResNet整体结构图及与VGGNet的比较如图6.3所示。\n\n图6.3展示了VGGNet19以及一个34层的普通结构神经网络和一个34层的ResNet网络的对比效果。通过验证可以知道，在使用了ResNet的结构后发现层数不断加深导致的训练集上误差增大的现象被消除了，ResNet网络的训练误差会随着层数增大而逐渐减小，并且在测试集上的表现也会变好。\n\
