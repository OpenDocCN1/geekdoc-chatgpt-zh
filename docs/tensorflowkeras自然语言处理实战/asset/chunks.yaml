    # 自然语言处理


    自然语言处理（Natural Language Processing，`NLP`）是研究计算机处理人类语言的一门技术，包括：


    ·　句法语义分析——对于给定的句子，进行分词、词性标记、命名实体识别和链接、句法分析、语义角色识别、多义词消歧。


    ·　信息抽取——从给定文本中抽取重要的信息，比如时间、地点、人物、事件、原因、结果、数字、日期、货币、专有名词等。通俗说来，就是要了解谁在什么时候、什么原因、对谁、做了什么事、有什么结果，涉及实体识别、时间抽取、因果关系抽取等关键技术。


    ·　文本挖掘（或者文本数据挖掘）——包括文本聚类、分类、信息抽取、摘要、情感分析以及对挖掘的信息和知识的可视化、交互式的表达界面。目前主流的技术都基于统计机器学习。


    ·　机器翻译——把输入的源语言文本通过自动翻译获得另外一种语言的文本。根据输入媒介不同，可以细分为文本翻译、语音翻译、手语翻译、图形翻译等。机器翻译从最早的基于规则的方法到二十年前基于统计的方法，再到今天基于神经网络（编码-解码）的方法，逐渐形成了一套比较严谨的方法体系。


    ·　信息检索——对大规模的文档进行索引。可简单对文档中的词汇赋之以不同的权重来建立索引，也可利用 1，2，3 的技术来建立更加深层的索引。在查询的时候，对输入的查询表达式（比如一个检索词或者一个句子）进行分析，然后在索引里面查找匹配的候选文档，再根据一个排序机制把候选文档排序，最后输出排序得分最高的文档。


    ·　问答系统——对一个自然语言表达的问题，由问答系统给出一个精准的答案。需要对自然语言查询语句进行某种程度的语义分析，包括实体链接、关系识别，形成逻辑表达式，然后到知识库中查找可能的候选答案并通过一个排序机制找出最佳的答案。


    ·　对话系统——系统通过一系列的对话，跟用户进行聊天、回答、完成某一项任务，涉及用户意图理解、通用聊天引擎、问答引擎、对话管理等技术。此外，为了体现上下文相关，要具备多轮对话能力。同时，为了体现个性化，要开发用户画像以及基于用户画像的个性化回复。


    当然，实际上自然语言处理并不仅限于上文所说的这些，实际上随着人们对深度学习的了解，更多应用正在不停地开发出来，相信读者会亲眼见证这一切的发生。


    ## 1.1.2 传统自然语言处理


    自然语言处理经历了长时间的发展，基本上可以说随着计算机在科学界和工业界的应用而不停地向前发展：


    ·　1950 年前，主流：阿兰·图灵的图灵测试。人和机器进行交流，如果人无法判断自己交流的对象是人还是机器，就说明这个机器具有智能。


    ·　1950—1970 年，主流：基于规则形式语言理论。根据数学中的公理化方法研究自然语言，采用代数和集合论把形式语言定义为符号的序列。它试图使用有限的规则描述无限的语言现象，发现人类普遍的语言机制，建立所谓的普遍语法。


    ·　1970—2010 年，主流：基于统计。主要是谷歌、微软、IBM 等公司。20 世纪 70 年代，弗里德里克·贾里尼克及其领导的 IBM 华生实验室将语音识别率从
    70%提升到 90%。1988 年，IBM 的彼得·布朗提出了基于统计的机器翻译方法。2005 年，谷歌机器翻译打败基于规则的`Sys Tran`。


    ·　2010 年以后，逆袭：机器学习。`AlphaGo`先后战胜李世石、柯洁等，掀起人工智能热潮。深度学习、人工神经网络成为热词，涉及领域包括语音识别、图像识别、机器翻译、自动驾驶和智能家居。


    简单来说，自然语言处理可以分为以下几个阶段：


    （1）可以说最早的自然语言处理是基于语法的，这也是最容易想到的点。一开始这一想法受到了众多专家的支持和追捧。科学家们认为可以通过总结一些语法规则来控制“自然语言处理系统”。


    后来这套方法里的一个致命的弊病开始显露出来，就是这个方法的算法复杂性会变得非常高。因为人类语言本身的复杂性，可能要分析一个并不长的段落需要数十条规则，这些规则彼此之间可能是相悖的，需要不断地增加规则。最终可以想象处理一篇文章需要大量的规则，而这样海量的规则背后对应非常可怕的算法复杂度，这也远远超出了普通计算机的处理能力。


    于是这种思想很快就被研究人员抛弃了。


    （2）后来的自然语言处理更多的是基于统计的，目前来说发展也是比较成熟的。这一阶段的自然语言处理项目所强调的核心就是统计学方法，比如著名的贝叶斯定理。这一部分其实也是人工智能里相对比较好入手的部分。这一部分中的许多技术已经有数十年的历史，早已成为我们日常生活的一部分。可能甚至大家都没有意识到它的存在，其中的典型案例有反垃圾邮件和文章情感分析等。


    （3）传统的自然语言处理总是有些啃不动的问题，比如词汇的分词问题、词义消歧问题（同一句话里的代词，究竟指代谁）、方法的模糊性问题，以及潜在含义问题（如何去理解一些俗语或者汉语里的成语这种知识点）。目前，自然语言处理的重点和前沿是要实现结合了深度学习的自然语言处理。也就是说，随着深度学习的发展，自然语言处理被提供了无限的可能和机遇。许许多多之前非常硬核的问题如今也可以使用深度学习去推动解决。


    ## 1.2 自然语言处理为什么难——以最简单的情感分析为例


    本节主要谈谈自然语言处理的难点。


    自然语言处理的目标是让计算机理解人类的语言，从而弥补人类交流（自然语言）和计算机理解（机器语言）之间的差距。为了达到这个目标，自然语言处理被分为三大核心任务：自然语言理解、自然语言生成，以及综合这两方面的自然语言交互。


    ·　自然语言理解（Natural Language Understanding，`NLU`）：自然语言理解在很大程度上被视为自然语言处理的一个子集，专注于单词的实际含义，可能与它们在语义结构上的方式不一致。它提供了对在涉及讽刺、反讽、情感、幽默、俗语等情况下如何使用术语的理解。根据摩尔（Moore）的说法，在大多数依赖
    NLP 的文本分析平台中，通常 NLU 是其中的一部分，因为大多数人现在并不希望单独进行情感或上下文分析或提取。所以，它们肯定是结合在一起的。


    ·　自然语言生成（Natural Language Generation，`NLG`）：自然语言生成与自然语言理解的观点相反，它不是对语言的语义含义的分析，而是对语言的产生或生成（通常是文本或语音）的分析。


    ·　自然语言交互（Natural Language Interaction，`NLI`）：自然语言交互在某种程度上是这些技术的结合——尽管它不需要涉及 NLU，用户通过自然语言与系统进行通信和唤起响应。“这是你通过输入或说出命令来发出命令的能力”，摩尔表示。


    所以，自然语言处理包含很多任务，比如词性标注、命名实体识别、信息抽取、文本分类、信息检索、机器翻译、文本生成等。自然语言难以通过计算机系统进行处理的根本原因是语言本身就是无结构数据，由表面的文字符号组合成背后所要表达的语义，形成一种错综复杂的符号系统。自然语言处理就是要学习语言序列所表示的语义，受谈话人（主观性）、谈话场景（语境）、谈话时间（旧词新意）等影响，因此自然语言处理存在诸多难点。


    以情感分析为例，拿比较熟悉的场景来说，“高档酒店不提供免费的洗漱套装？”这句话的场景发生在酒店，描述的虽然是洗漱套装，但是评价的却是酒店的服务，表达了一种负向的情感。那么，机器如何来对上述语句进行情感分析呢？


    情感分析（`Sentiment Analysis`）的目的在于自动地从文本中发现和归纳人们对产品、人物、公司、组织机构、事件、话题等的态度、意见和情绪等，对其中的主观情感信息进行挖掘。人类的主观情感因素影响着自身的行为，因此了解人们对某个事物的情感态度，对于预测其行为并针对性地做出应对决策有着十分重要的意义。同样，当人们在通过网络购物平台进行购物时，可以参考其他消费者对该物品或服务的评论，进而做出购买决定；从企业角度来说，企业可以通过网络文本了解消费者对其提供的产品和服务的评价，进而帮助公司做出生产、销售和宣传的决策。


    按照文本的不同粒度，文本情感分析分为词语级、句章级和属性级情感分析。


    ·　词语级情感分析包括情感词的抽取和情感词的表示学习。情感词是指语料中带有情感倾向的词语。


    ·　句章级情感分析是指对整句文本或整篇文档进行一个总体的情感极性的判别，常用于微博、电影、酒店、餐饮等文本数据的分析中。


    ·　属性级情感分析是指针对文本中的特定实体（属性）进行情感极性的判别，常用于不同商品特定属性的数据分析中。


    自然语言处理关键是语义表示，从语言的粒度上看，语言是由词构成句子、句子构成篇章的。对于情感分析任务，同样可以从词级、句子级、篇章级来解决语义表示问题。


    早期的词语级情感分析任务主要是对文本中的情感词进行抽取，通常是情感分析的基础任务。因此，这部分工作研究广泛，情感词抽取方法大致可分为两大类，分别是：基于知识库的方法和基于语料库的方法。


    （1）基于知识库的方法主要借助知识库资源（如`WordNet`、`HowNet`等）中词与词之间的关系，比如同义词关系、反义词关系等来判断词语的情感极性。虽然基于知识库的方法可以较易地获得大量情感词典，但是这种方法不适用于特定领域或特定场景的情感分析。


    （2）基于语料库的方法假设具有相同情感极性的词通常在同一句子中。因此，这类方法首先通过人工标注一小部分种子情感词，然后通过词与词之间的共现关系来判断情感词的极性。


    基于语料库的方法召回率比较低，如果一个情感词不与任何种子情感词共现，那么这个情感词就很难被识别。近年来，随着深度学习和表示学习技术应用于自然语言处理中，词的表示学习受到研究者的重视，词向量的学习成为自然语言处理领域中最基本的任务。


    因此，在面向情感分析任务时，通常会先学习情感词向量。情感词向量模型的目标是在输入语料上学习一组词向量，使得学习到的词向量不仅具有语法和语义上的相似性，还具有情感极性的区分性。


    情感词向量的学习模型基本是在已有的词向量学习模型基础上添加有监督的学习过程得到的。近两年，随着大规模预训练语言模型的兴起，情感词向量的学习已经不是情感分析任务必做的步骤了，更偏向于做句子和篇章级情感分析对文档的整体情感极性进行判别。


    按照学习方式的不同，可以分为有监督学习方法和无监督学习方法。在有监督学习方法中，大多数利用传统机器学习方法，首先提取文本的特征，再进行特征的选择和筛选，最后利用诸如支持向量机等分类器进行分类。


    在无监督学习方法中，利用词的互信息关系、种子词等方法进行情感极性判别。随着机器学习和深度学习的发展，文本特征的表示成为近十年自然语言处理领域的重要研究内容。特别是表示学习技术可以自动地从数据中抽象出数据的特征表示，并进行语义组合，最终得到文本的抽象表示，利用这个表示进行文本的情感分类。


    常用的方法包括卷积神经网络、循环神经网络、`Transformer`以及若干神经网络组合的方法。这些方法从不同角度，在一定范围内提升了文本句子和篇章情感分析的准确率。但是在一些情感分析问题上，仍然缺少丰富的语言学知识和丰富的情感语义组合性。


    回到开始的例子“高档酒店不提供免费的洗漱套装？”，该例子属于隐式情感分析，没有显式的情感词，需要背景知识或者常识知识才有可能解决。因此，面对人类这种具备强大的表达力、具有丰富的知识体系和复杂语境的自然语言，机器还有很长的路要走。


    ## 1.3 自然语言处理的展望


    语言学是一门古老的学科，人类为什么会有语言？动物为什么没有发展出人类这样复杂高级的语言？语言机制是人类大脑中先天就有的，还是像其他能力一样后天获得的？语言是如何形成和发展的？语言本身服从一些怎样的规律？无数的不解之谜等待着科学家来回答。计算语言学或者自然语言处理既是一门科学，也是一门应用技术。


    从科学角度说，像其他计算机科学一样，它是一种从模拟角度来研究语言的学科。自然语言处理并不直接研究人类语言的机制，而是试图让机器去模拟人类的语言能力。如果说计算机拥有了像人一样的语言能力，从某种角度就可以说我们理解了人类的语言机制。由于理解自然语言需要关于外在世界的广泛知识以及运用操作这些知识的能力，所以自然语言处理是一个人工智能完备（AI-Complete）的问题，并被视为人工智能的核心问题之一。


    ### 1.3.1 自然语言处理对于人工智能的意义


    有人把人的智能分为三大类：感知智能、运动智能和认知智能。


    ·　感知智能：包括听觉、视觉、触觉等。最近两年，深度学习的引入大幅度提高了语音和图像的识别率，所以计算机在感知智能层面已经做得相当不错，在一些典型的测试下，达到或者超过了人类的平均水平。


    ·　运动智能：能够在复杂的环境中自由行动的能力。运动智能是机器人研究的核心问题之一。


    ·　认知智能：属于最高级的智能活动。动物也具有感知智能和运动智能，但在认知智能方面，却明显低于人类。认知智能是包括理解、运用语言的能力，掌握知识、运用知识的能力，以及在语言和知识基础上的推理、规划和决策能力。认知智能中最基础也是最重要的部分就是语言智能，研究语言智能的学科就是自然语言处理。


    自然语言处理的研究对象是人类语言，如词语、短语、句子、篇章等。通过对这些语言单位的分析不仅希望理解语言所表达的字面含义，还希望能理解说话人所表达的情感，以及说话人通过语言所传达的意图。没有成功的自然语言处理，就不会有真正的认知智能。


    自然语言理解和处理是人工智能中最难的部分。比如一幅图像，改变像素或者一个局部，对整个图像的内容影响并不太大。文字就不一样了，很多情况下，在一句话中改变一个字或者仅仅调整一个字的位置，意思就会完全不一样。


    很多深度学习技术，在图像识别领域已经获得了很大的成功，但在自然语言处理领域还处于起步阶段。基于深层神经网络的深度学习方法从根本上改变了自然语言处理技术的面貌。


    在深度学习技术引入自然语言处理之前，自然语言处理所使用的数学工具跟语音、图像、视频处理所使用的数学工具截然不同，这些不同模态之间的信息流动存在巨大的壁垒。而深度学习的应用，把自然语言处理和语音、图像、视频处理所使用的数学工具统一起来了，从而打破了这些不同模态信息之间的壁垒，使得多模态信息的处理和融合成为可能。


    ### 1.3.2 自然语言在金融、法律、医疗健康等方面的应用


    在金融、法律、医疗健康等领域，自然语言处理技术也得到了越来越广泛的应用。


    ·　在金融领域，自然语言处理可以为证券投资提供各种分析数据，如热点挖掘、舆情分析等，还可以进行金融风险分析、欺诈识别等。


    ·　在法律领域，自然语言处理可以帮助进行案例搜索、判决预测、法律文书自动生成、法律文本翻译、智能问答等。


    ·　在医疗健康领域，自然语言处理技术更是有着广阔的应用前景，如病历的辅助录入、医学资料的检索和分析、辅助诊断等。现代医学资料浩如烟海，新的医学手段、方法发展迅猛，没有任何医生和专家能够掌握所有的医学发展的动态，自然语言处理可以帮助医生快速准确地找到各种疑难病症最近的研究进展，使得病人最快地享受医学技术进步的成果。


    自然语言处理的应用和推广会让大家的生活越来越方便。比如打客服电话，不用再选择一大堆的语音菜单。语音助手可以理解需求，贴心地完成日常生活中的各种任务。机器甚至可以帮你写报告、写诗、写情书等。


    与此同时，技术的进步也会给我们的生活带来一些冲击。比如就业方面，机器取代人工会造成一些人失业。新技术的应用让一些职业消失的同时，又会创造出大量新的就业机会。个人应该主动积极地想办法去适应这种变化，而不是消极等待和抱怨。


    总之，深度学习的应用使得自然语言处理达到了前所未有的水平，也使得自然语言处理应用的范围大大扩展。可以说，自然语言处理的春天已经来临。


    ## 1.4 搭建环境 1：安装 Python


    `Python`是深度学习的首选开发语言，很多第三方提供了集成大量科学计算类库的`Python`标准安装包，最常用的是`Anaconda`。


    `Python`是一个脚本语言，如果不使用`Anaconda`，那么第三方库的安装会较为困难，各个库之间的依赖性就很难连接得很好。因此，这里推荐安装`Anaconda`来替代`Python`语言的安装。


    ### 1.4.1 Anaconda 的下载与安装


    #### 1. 下载和安装


    可以从`Anaconda`官方网站下载，界面如图 1.1 所示。


    ![](img/Figure-P20_15868.jpg)


    图 1.1　`Anaconda`下载页面


    目前提供的是集成了`Python 3.7`版本的`Anaconda`下载，不过无论是 3.7 还是 3.6 版本的`Python`，都不会影响`TensorFlow
    2.1`的使用。读者可以根据自己的操作系统选择下载。


    （1）推荐使用 Windows `Python 3.6`的版本。集成`Python 3.6`版本的`Anaconda`可以在清华大学`Anaconda`镜像网站下载，地址为`https://mirrors.tuna.tsinghua.edu.cn/anaconda/archive/`，打开后如图
    1.2 所示。


    ![](img/Figure-P20_15869.jpg)


    图 1.2　清华大学`Anaconda`镜像网站提供的副本


    **注意**


    如果读者使用的是 64 位操作系统，选择以`Anaconda3`开头、以 64 结尾的安装文件，不要下载错了！


    （2）下载完成后得到的文件是`exe`版本，直接运行即可进入安装过程。安装完成以后，出现如图 1.3 所示的目录结构，说明安装正确。


    ![](img/Figure-P20_15870.jpg)


    图 1.3　`Anaconda`安装目录


    #### 2. 打开控制台


    之后依次单击“开始→所有程序→`Anaconda3`→`Anaconda Prompt`”命令，打开`Anaconda Prompt`窗口。与`CMD`控制台类似，在`Anaconda
    Prompt`窗口中输入命令就可以控制和配置`Python`。在`Anaconda`中最常用的是`conda`命令，可以执行一些基本操作。


    #### 3. 验证 Python


    接下来在控制台中输入“`python`”，若安装正确，则会打印出版本号以及控制符号。在控制符后输入代码：


    ```

    print("hello Python")

    ```


