    ### 4.2.3 TensorFlow 2.X编程实战：MNIST数据集


    在上一节中，笔者对`MNIST`数据做了介绍，描述了其构成方式以及其中数据的特征和标签含义等。了解这些有助于编写适当的程序来对`MNIST`数据集进行分析和识别。下面将一步步地分析和编写代码以对数据集进行处理。


    #### 1. 数据的获取


    对于`MNIST`数据的获取实际上有很多渠道，读者可以使用`TensorFlow 2.0`自带的数据获取方式获得`MNIST`数据集并进行处理，代码如下：


    ![](OEBPS/Images/Figure-P101_39554.jpg)


    实际上，对于`TensorFlow`来说，它提供了常用`API`并收集整理一些数据集，为模型的编写和验证带来了最大限度的方便。


    不过，对于软件自带的`API`和自己实现的`API`，应该选择哪个呢？


    选择自带的`API`！除非能肯定自带的`API`不适合你的代码。因为大多数自带的`API`在底层都会做一定程度的优化，调用不同的库包去最大效率地实现功能，因此即使自己的`API`与其功能一样，但是内部实现还是有所不同的。请牢记“不要重复造轮子”。


    #### 2. 数据的处理


    对于数据的处理，读者可以参考`iris`数据的处理方式进行，即首先将`label`进行`one-hot`处理，之后使用`TensorFlow`自带的`data
    API`进行打包，方便地组合成`train`与`label`的配对数据集。


    ![](OEBPS/Images/Figure-P102_38200.jpg)


    需要注意的是，在数据被读出后，`x_train`与`x_test`分别是训练集与测试集的数据特征部分，其是两个维度为`[x,28,28]`大小的矩阵，但是在4.1节中介绍卷积计算时，卷积的输入是一个4维的数据，还需要一个“通道”的标注，因此对其使用`tf`的扩展函数，修改了维度的表示方式。


    #### 3. 模型的确定与各模块的编写


    对于使用深度学习构建一个分辨`MNIST`的模型来说，最简单最常用的方法是建立一个基于卷积神经网络+分类层的模型，结构如图4.20所示。


    ![](OEBPS/Images/Figure-P102_11138.jpg)


    图4.20　基于卷积神经网络+分类层的模型


    从图4.20可以看到，一个简单的卷积神经网络模型是由卷积层、池化层、`dropout`层以及作为分类的全连接层构成的，同时每一层之间使用`relu`激活函数做分割，而`batch_normalization`作为正则化的工具也被作为各个层之间的连接而使用。


    模型代码如下：


    ![](OEBPS/Images/Figure-P103_39557.jpg)


    下面分步进行解释。


    ##### (1) 输入的初始化


    输入的初始化使用的是`Input`类，这里根据输入的数据大小将输入的数据维度做成`[28,28,1]`，其中的`batch_size`不需要设置，`TensorFlow`会在后台自行推断。


    ```

    input_xs = tf.keras.Input([28,28,1])

    ```


    ##### (2) 卷积层


    `TensorFlow`中自带了卷积层实现类对卷积的计算，这里首先创建了一个类，通过设定卷积核数据、卷积核大小、`padding`方式和激活函数初始化了整个卷积类。


    ```

    conv = tf.keras.layers.Conv2D(32,3,padding="SAME", activation=tf.nn.relu)(input_xs)

    ```


    `TensorFlow`中的卷积层的定义在绝大多数的情况下直接调用给定的实现好的卷积类即可。当卷积核大小等于3时，`TensorFlow`专门给予了优化，原因在下一章揭晓。现在读者只需要牢记卷积类的初始化和卷积层的使用即可。


    ##### (3) BatchNormalization和Maxpool层


    `Batch_normalization`和`Maxpool`层的目的是输入数据正则化，最大限度地减少模型的过拟合和增大模型的泛化能力。对于`Batch_normalization`和`Maxpool`的实现，读者自行参考模型代码的写法做个实现，有兴趣的读者可以更深一步学习其相关的理论，本书就不再过多介绍了。


    ![](OEBPS/Images/Figure-P103_38203.jpg)


    ##### (4) 起分类作用的全连接层


    全连接层的作用是对卷积层所提取的特征做最终分类。这里我们首先使用`flat`函数，将提取计算后的特征值平整化，之后的2个全连接层起到特征提取和分类的作用，最终做出分类。


    ```

    dense = tf.keras.layers.Dense(512, activation=tf.nn.relu)(flat)

    logits = tf.keras.layers.Dense(10, activation=tf.nn.softmax)(dense)

    ```


    同样使用`TensorFlow`对模型进行打印，可以将所涉及的各个层级都打印出来，如图4.21所示。


    ![](OEBPS/Images/Figure-P104_11438.jpg)


    图4.21　打印各个层级


    可以看到，各个层依次被计算，并且所用的参数也打印出来了。


    **【程序4-5】**


    ![](OEBPS/Images/Figure-P104_38205.jpg)


    最终打印结果如图4.22所示。


    ![](OEBPS/Images/Figure-P105_11538.jpg)


    图4.22　打印结果


    可以看到，经过模型的训练，在测试集上最终的准确率达到0.9879，即98%以上，而损失率在0.05左右。


    ### 4.2.4 使用自定义的卷积层实现MNIST识别


    利用已有的卷积层已经能够较好地达到目标，使得准确率在0.98以上。这是一个非常不错的准确率，但是为了获得更高的准确率，还有没有别的方法能够在这个基础上做更进一步的提高呢？


    一个非常简单的思想就是建立`short-cut`，即建立数据通路，使得输入的数据和经过卷积计算后的数据连接在一起，从而解决卷积层在层数过多情况下出现的梯度下降或者梯度消失的问题，模型如图4.23所示。


    ![](OEBPS/Images/Figure-P105_37779.jpg)


    图4.23　残差网络


    这是一个“残差网络”部分示意图，即将输入的数据经过卷积层计算后与输入数据直接相连，从而建立一个能够保留更多细节内容的卷积结构。


    遵循计算`iris`数据集的自定义层级的方法，在继承`Layers`层后，`TensorFlow`自定义的一个层级需要实现3个函数：`init`、`build`和`call`函数。


    ##### (1) 初始化参数


    `init`的作用是初始化所有的参数，通过分析模型可以得知，目前需要定义的参数为卷积核数目和卷积核大小。


    ![](OEBPS/Images/Figure-P106_38207.jpg)


    ##### (2) 定义可变参数


    模型中参数的定义在`build`中，这里是对所有可变参数的定义，代码如下：


