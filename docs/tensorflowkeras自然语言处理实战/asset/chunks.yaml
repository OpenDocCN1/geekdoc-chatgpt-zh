    \ 6.2.2　ResNet残差模块的实现\n\nResNet网络结构已经在上文做了介绍，它突破性地使用“模块化”思维去对网络进行叠加，从而实现了数据在模块内部特征的传递不会产生丢失。\n\
    \n从图6.10可以看到，模块的内部实际上是3个卷积通道相互叠加，形成了一种瓶颈设计。对于每个残差模块，使用3层卷积。这3层分别是1×1、3×3和1×1的卷积层，其中1×1层是负责先减少后增加（恢复）尺寸的，使3×3层具有较小的输入／输出尺寸瓶颈。\n\
    \n![](OEBPS/Images/Figure-P147_22172.jpg)\n\n图6.10　模块的内部\n\n实现的瓶颈三层卷积结构的代码段如下：\n\
    \n![](OEBPS/Images/Figure-P147_38268.jpg)\n\n代码中输入的数据首先经过conv2d卷积层计算，输出的维度为四分之一的输出维度，这是为了降低输入数据的整个数据量，为进行下一层的\\\
    [3,3\\]的计算打下基础。可以人为地为每层添加一个对应的名称，但是基于前文对模型的分析，TensorFlow 2.0会自动为每个层中的参数分配一个递增的名称，因此这个工作可以交给TensorFlow\
    \ 2.0完成。batch\\_normalization和relu分别为批处理层和激活层。\n\n在数据传递的过程中，ResNet模块使用了名为“shortcut”的“信息高速公路”。shortcut连接相当于简单执行了同等映射，不会产生额外的参数，也不会增加计算复杂度，如图6.11所示。整个网络可以依旧通过端到端的反向传播训练。代码如下：\n\
    \n![](OEBPS/Images/Figure-P148_38269.jpg)\n\n**说明**\n\n有兴趣的读者可以自行完成，这里笔者采用的是直联的方式，也就是original模式。\n\
    \n![](OEBPS/Images/Figure-P148_22255.jpg)\n\n图6.11　shortcut\n\n有的时候，除了判定是否对输入数据进行处理外，由于ResNet在实现过程中对数据的维度做了改变，因此当输入的维度和要求模型输出的维度不相同（input\\\
    _channel不等于out\\_dim）时，需要对输入数据的维度进行padding操作。\n\n**提醒**\n\npadding操作就是补全数据，tf.pad函数用来对数据进行补全，第二个参数是一个序列，分别代表向对应的维度进行双向补全操作。首先计算输出层与输入层在第四个维度上的差值，除2的操作是将差值分成2份，在上下分别进行补全操作。当然也可以在一个方向进行补全。\n\
