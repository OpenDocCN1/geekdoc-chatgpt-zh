    ## 2.1 TensorFlow & Keras


    神经网络专家 Rachel Thomas 曾经说过，“接触`TensorFlow`后，我感觉我还是不够聪明，但有了`Keras`之后，事情会变得简单一些。”


    他所提到的`Keras`是一个高级别的`Python`神经网络框架、能在`TensorFlow`上运行的一种高级的`API`框架。`Keras`拥有丰富的对数据的封装和一些先进的模型的实现，避免了“重复造轮子”。换言之，`Keras`对于提升开发者的开发效率意义重大。


    在图 2.1 中，左边的 K 代表`Keras`，右边的是`TensorFlow`，形成的就是`Keras+TensorFlow`。


    ![](img/Figure-P35_16961.jpg)


    图 2.1　`TensorFlow+Keras`


    “不要重复造轮子。”这是`TensorFlow`引入`Keras API`的最终目的，然而本书还是以`TensorFlow`代码编写为主、`Keras`为辅，目的是为了简化程序编写，这点请读者一定要注意。


    **本章非常重要，强烈建议读者独立完成每个完整代码和代码段的编写。**


    ### 2.1.1 模型！模型！还是模型！


    深度学习的核心是模型。建立神经网络模型去拟合目标的形态就是深度学习的精髓和最重要的部分。


    任何一个神经网络的主要设计思想和功能都集中在其模型中。`TensorFlow`也是如此。


    `TensorFlow`或者其使用的高级`API`-`Keras`核心数据结构是模型，一种组织网络层的方式。最简单的模型是`Sequential`顺序模型，由多个网络层线性堆叠。对于更复杂的结构，应该使用`Keras`函数式`API`（本书的重点就是函数式`API`编写），其允许构建任意的神经网络图。


    为了便于理解和易于上手，首先从顺序`Sequential`开始。一个标准的顺序`Sequential`模型如下：


    ![](img/Figure-P36_38114.jpg)


    可以看到，这里首先创建了一个`Sequential`模型，之后根据需要逐级向其中添加不同的全连接层。全连接层的作用是进行矩阵计算，而相互之间又通过不同的激活函数进行激活计算。（这种没有输入输出值的编程方式对有经验的程序设计人员来说并不友好，仅供举例。）


    对于损失函数的计算，根据不同拟合方式和数据集的特点，需要建立不同的损失函数从最大程度上反馈拟合曲线错误。这里的损失函数采用交叉熵函数（`softmax_crossentroy`），使得数据计算分布能够最大限度地拟合目标值。如果对此陌生，那么只需要记住这些名词和下面的代码编写即可继续往下学习。具体代码如下：


