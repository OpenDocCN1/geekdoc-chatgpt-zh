    \n代码如下：\n\n![](OEBPS/Images/Figure-P156_38285.jpg)\n\n这里采用的是`map`函数，在每个卷积分块上做`[3,3]`大小的卷积，并加上`batch_normalization`和`relu`层。\n\
    \n（3）将计算后的卷积层进行重新叠加\n\n叠加选择的是第四个维度，即第一步拆分的维度，代码如下：\n\n```\nout = tf.concat(out_list,\
    \ axis=-1)\n```\n\n这样就重新将数据组合起来了。\n\n完整残差模块代码如下：\n\n![](OEBPS/Images/Figure-P156_38286.jpg)\n\
