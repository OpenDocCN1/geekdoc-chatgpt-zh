    原子配位不饱和性将导致大量的悬键和不饱和键等，为原子扩散提供了高密度的短程、快扩散路径，促进了金属氧化物的固—固扩散反应，这一过程一直可以进行到有机可燃物全部燃烧完才停止，于是在比较低的温度就形成了
    NiZn 铁氧体纳米晶(如图 2.14 所示)。这段时间需要几分钟到几十分钟，时间长短视原料数量多少而定。从放大 8000~10000 倍的薄片状物质扫描电镜照片看出，这些颗粒薄片或颗粒团碎片为几十纳米到几百纳米的颗粒团组成。


    ![](img/24a9da1d7c3b484411cd4981170528f1_52_0.png)


    ### 图 2.14 硝酸盐柠檬酸凝胶自燃 NiZn 铁氧体结晶过程模拟


    因此，硝酸盐柠檬酸凝胶分解能在 500°C 左右合成铁氧体纳米晶材料的机理，我们认为：

    - (1) 因为纳米材料扩散系数大。一般纳米固体中的自扩散系数比晶格扩散系数高 14～20 个数量级，比传统的双晶晶界中的扩散系数高出 2～4 个数量级。这样高的扩散系数主要归因于纳米材料中存在的大量界面。从结构上来说，纳米晶界的原子密度很低，大量的界面以及表面原子配位不饱和性将导致大量的悬键和不饱和键等，这些都使得纳米材料具有较高的化学活性，为原子扩散提供了高密度的短程、快扩散路径。

    - (2) 硝酸盐柠檬酸凝胶热分解中有爆燃的过程。组分中金属氧化物的颗粒都是纳米数量级，组分分布均匀，颗粒小，活性大，有些金属纳米晶（如 Ni、Zn）在反应中具有催化剂的作用，所以其固相反应合成尖晶石型
    NiZn 铁氧体的温度要比传统工艺低几百度，纳米晶 NiZn 铁氧体也就能在较低的温度、较快的时间内迅速形成。

    - (3) 凝胶自燃制备 NiZn 铁氧体纳米晶还需要周围有一定的氧分压。


    图 2.15 是在不同气氛下情况凝胶分解后纳米晶粉末的 X 光衍射图谱。图中（a）是经空气中 600℃热处理半小时 NCZF 样品的 XRD 图谱，其结构显示已是典型的尖晶石型铁氧体相，密勒指数
    [220]、[311]、[222]、[400]、[422]、[511]、[440]，其晶粒大小根据 Scherrer 公式估计大约为 80 nm；（b）是经氮气中
    600℃热处理半小时 NCZF 样品的 XRD 图谱。可以明显看出，这时样品粉体 [311] 衍射强度只有空气中处理的粉体的 26%(1 — I[311]Nitrogen
    / I[311]Air)，即氮气中处理的粉体中尖晶石相的比例不会超过 74%。更仔细的鉴别，可见有明显的氧化锌相 [100]、[002]、[101]、[102](PDF#
    65-3411) 和碳化合物相 [111]、[200](PDF# 43-1104)；（c）是衍射强度 (a)–(b) 的结果，即表示在抵消了两种气氛中产物相同部分后的差异情况。水平线下面是强度差异，水平线上面是物相差异。


    ![](img/24a9da1d7c3b484411cd4981170528f1_53_0.png)


    ### 图 2.15 不同气氛下情况下样品的 XRD 衍射图


    通过分析，我们认为：在氮气热处理情况下，凝胶经历了类似硝化类物质分解之后，剩余物质中的纤铁矿和针铁矿通过逐渐脱去结晶水而变成活性很大的氧化铁，部分与原料中的金属氧化物通过固相反应生成尖晶石铁氧体，一部分则由于缺氧生成同样是尖晶石结构的四氧化三铁。因此剩余物质中除少量氧化锌外还有少量氧化镍。对
    X 光衍射图谱进一步分析表明，磁铁矿 Fe₃O₄ 的特征衍射峰密勒指数为 [311]、[222]、[400]、[422]、[511]，与空气中热处理的样品的
    X 射线衍峰位置相近，NiO 的特征衍射峰密勒指数为 [111]、[200] 与空气中热处理的样品的 X 射线衍峰密勒指数为 [222]、[400] 位置相重叠，所以它们不能很清晰地表现在
    XRD 衍射图上。


    综合以上分析，我们认为在氮气中热处理的样品不能很好地形成纯的尖晶石型 NiZn 铁氧体，还存在部分四氧化三铁、少量的镍、锌氧化物和碳化物。样品中的碳（或碳化物），是由于热分解过程中有机物挥发过程因缺氧而留下的残余物。通过凝胶自燃合成纯的尖晶石型
    NiZn 铁氧体，需要一定的氧分压，否则这个过程将不能合成完全单一相的 NiZn 铁氧体纳米晶。


    不同气氛下获得的样品磁性能测试结果如图 2.16 所示。在氮气中热处理的样品其饱和磁化强度为 72 emu/g(A·m²kg⁻¹)，比在空气中热处理的样品的饱和磁化强度
    53 emu/g(A·m²kg⁻¹) 大，其矫顽力也略大 (98.5 Oe 和 52.5 Oe，或 98.5×10³(4π)⁻¹ A·m⁻¹ 和 52.5×10³(4π)⁻¹
    A·m⁻¹)。空气中处理的样品粉末的磁特性数据与许多文献基本一致，但是在氮气中处理的样品粉末表现出的饱和磁化强度却有些异常大。


    前面讨论时提到，在氮气中处理的粉体不是纯的 NiZn 铁氧体，其中还有四氧化三铁、少量的镍、锌氧化物和碳化物。根据邹涛等人的研究，对纯 Fe₃O₄ 纳米粉末
    (10～80 nm) 其饱和磁化强度最大为 75 emu/g(A·m²kg⁻¹)[119]，对化学纯 Fe₃O₄ 粉末 (微米级) 其饱和磁化强度为 90
    emu/g(A·m²kg⁻¹)[120]。而对我们样品中在氮气中处理后所表现出的饱和磁化强度却高得有些出乎意料。我们可以作一粗略估计，即氮气氛中热处理的全部尖晶石结构材料的饱和磁化强度必须为
    97 emu/g(A·m²kg⁻¹) (因 97×0.74≈71.7)。这就是说，如果我们样品中尖晶石相材料都为 Fe₃O₄ (实际不是)，那么取出单独测量，其饱和磁化强度将超过
    97 emu/g(A·m²kg⁻¹)；超过体材料 Fe₃O₄ 的饱和磁化强度数值——92 emu/g(A·m²kg⁻¹)[121]；远远超过邹涛等人的研究结果——75
    emu/g(A·m²kg⁻¹)。因此对这种测量结果的另外一种可能解释是在氮气中退火的样品，产生了一些高饱和磁化强度的 Fe-N 化合物，这些化合物与 Fe₃O₄、NCZF
    铁氧体的混合物使总体粉末的饱和磁化强度得以大幅提高。


    ## 2.5 小结


    通过上述分析讨论，我们认为硝酸盐柠檬酸凝胶的热反应基本上可分为 222℃ 前、后两个部分：222℃ 前凝胶发生类似硝化类含能物质的热分解，并在 185～218℃
    发生急速失重，其活化能 E = 43.2～57.6 kJ/mol，热焓变化 ΔH₁ = -163.6 J/g。222℃ 后剩余物质中存在大量的 FeO(OH)，在升温过程中缓慢脱去羟基水。在流动空气的情况下，适量的氧气会加速
    FeO(OH) 脱羟基水转换，加速金属离子的扩散和重组进程。各金属氧化物约在 222～481℃ 发生尖晶石(AB₂O₄)结构生成的固相反应，尖晶石型镍铜锌铁氧体纳米晶也随之逐渐形成。在动态空气条件下，镍铜锌铁氧体纳米晶体可以在
    481℃ 左右完全生成，而在动态氮气条件下，尖晶石型的固相反应不能充分进行，反应过程进行得较慢，在本实验温度范围，不能形成纯的单相尖晶石型铁氧体。


    根据上述对 NiZn 系纳米晶铁氧体结构与形态的观察、分析，可以认为用硝酸盐柠檬酸溶剂凝胶自燃法制备的 NiZn 铁氧体粉末，其晶粒大小为 50 nm 左右，具有典型的尖晶石结构。自燃或低温烧结后的凝胶会呈现发泡式褐色结构，此结构很轻，很脆，是由无数纳米晶铁氧体颗粒所组成的弧状薄片和颗粒团。稍加研磨，就可得到纳米晶的铁氧体粉末。其纳米晶铁氧体粉末大小均匀，可直接用来作高性能铁氧体的原料，可以直接用于造粒，压环成型，不用预烧，直接烧结成产品，具有广泛的应用前景。


    ## 第三章 纳米晶复合 NiZn 铁氧体 显微结构与烧结机理


    ### 3.1 引言


    第二章研究了 NiZn 铁氧体纳米晶粉体的制备方法和纳米晶的结构与磁性，结果表明：这种 50 nm 左右的铁氧体纳米晶，就其磁性能而言，虽然还不能作为目前工业生产中所需要的器件，但从纳米晶粉体本身角度而言，它完全满足先进铁氧体制备工艺对粉体原料的基本要求，堪称为理想的粉体原料。


    一般说具有某些特定性能的多晶材料都需要把原料压成固态坯体经过烧结而成。烧结过程是获取所期待的多晶材料之工艺中最后与最重要的一环。因此，固体材料的烧结现象、机理的研究对于控制和改进材料的显微结构及其相应的物理化学性能有着十分重要的意义。烧结的现象与机理往往是十分复杂的。虽然早就开始研究，然而立足于近代物理学开展烧结理论研究还是
    1949 年后的事。至今，阐明烧结现象和机理的工作取得了不少的进展，但离充分科学化而又定量化地处理烧结问题仍然有很大的距离。


    固态坯体在烧结之前是由许许多多单个的固体微粒所组成的，在坯体中含有大量的气孔。气孔率约为 30%～60%，具体数值取决于材料自身的特性和所使用的成型方法与技术。烧结可以认为是在坯体中晶粒配位形状发生了变化，这种变化使晶粒以空间填充方式排列，即晶粒中心相互靠近，坯体中物质的质点会发生迁移，到某一温度，坯体将随时间的延长而发生收缩、致密化、结晶成长，受外界气氛影响坯体还会经历氧化、还原、铁氧体生成和铁氧体晶体内离子重新分布等过程。在烧结过程中，发生的主要变化为微粒或晶粒尺寸与形状的变化，以及气孔尺寸与形状的变化。在烧结完全致密体的最后阶段，气孔将从固体材料中完全消失。烧结而导致材料致密化的基本推动力是系统表面能的下降，原来的固—气界面逐渐消除而形成新的低能量的固—固界面。由于固态传质在高温时才具有显著的传质速率，因而烧结过程在高温时才能真正地进行。固态坯体经过烧结后，宏观上出现的变化为收缩、致密化与强度增大。因此烧结的程度与速率常常可以用收缩率、气孔率、密度（实际密度或相对密度）等及其与时间的关系来表征。这就是通常所说的烧结动力学特点。


    Kuczynski [122] 建立第一个烧结动力学理论模型距今已有 50 多年，在过去的岁月里，许多学者研究了各种类型的烧结动力学，诸如纯固相烧结、有液相参与的固态烧结及热压烧结等，建立了不少在实验基础上的烧结动力学模型。这些模型是基于固态微粒或晶粒以及气孔的形状与尺寸的变化而建立的，根据烧结过程可将之分为三个阶段
    [123]：（1）初期模型——描述球形料粒之间接触面积扩展及坯体收缩率为 0%～5% 阶段的模型。（2）中期模型——描述材料经过初期烧结后，管状气孔沿着三叉晶界边界排除出烧结体阶段的模型。这一过程的终点通常以烧结体对气孔率降到
    5% 为标志。（3）后期模型——描述呈球形的气孔沿着四叉晶界角落排除出烧结体及烧结体最终密度达到或接近理论数值之阶段的模型。同类烧结动力学模型之间的差异一般是由下列原因所引起的，即在建立模型时，固相粉粒常常被假设为理想的球形，但实际上所使用的固体粉料之形状是各异的，尺寸也不均匀一致。在烧结传质过程中对粉粒几何形状变化所作的假设不能完全反映实际烧结过程所引起的几何形状变化。再者，烧结时传质机理未必以某一种为主，可能以两种或多种机理并存，这种“混合”的机理难以用单一的简化模型来描述。此外还有一些复杂的因素使模型更加难于定量化。例如，对于所给定的材料，由于工艺参数等的变化，可以使传质机理也相应地发生变化
    [124]。在烧结中、后期所发生的异常现象，即不连续的晶粒生长，使通常的烧结动力学模型无法应用。微量外加剂或材料中的某些杂质常常使问题更加复杂化，它们对烧结动力学也会产生某些重要的影响。


    因此，本章我们先给出纳米晶合成 NiZn 铁氧体、掺杂 NiZn 铁氧体在不同温度烧结、显微结构变化的实验事实，然后讨论烧结温度与显微结构的关系，掺杂对显微结构的影响，再结合一般陶瓷烧结理论，提出纳米晶合成
    NiZn 铁氧体的烧结机理，最后讨论影响烧结的因素。


    ### 3.2 实验方法


    按 Ni0.6Zn0.4Fe2O4 配比选取所需原料：硝酸铁(Fe(NO3)3·9H2O，分子量 404.00，纯度 98%)，硝酸镍(Ni(NO3)2·6H2O，分子量
    290.8，纯度 98%)，硝酸锌(Zn(NO3)2·6H2O，分子量 297.49，纯度 99%)，柠檬酸(C6H8O7·H2O，分子量 210.14，纯度
    99.5%)。反应方程式如下：


    2Fe(NO3)3·9H2O + (1-x)Ni(NO3)2·6H2O + xZn(NO3)2·6H2O + 3C6H8O7·H2O -----> Ni1-xZnxFe2O4
    + ... ... (3.1)


    将柠檬酸按所需称量，溶于去离子水中，溶液为无色，pH 值为 1～2。同样，将硝酸铁、硝酸镍、硝酸锌分别称量放置入烧杯中，把先前配制好的柠檬酸溶液加热至 40°C，将三种硝酸盐溶解于柠檬酸溶液中，溶液呈棕黄色，透明。恒温水浴调至
    40°C，把溶液注入三通烧瓶并放至水浴中，使溶液保持 40°C，同时持续搅拌，时间为 30 min 左右。之后，加入预定重量百分比的掺杂溶液，然后滴入乙二胺，调节
    pH 值达到 6～7。将溶液加热搅拌，使水分会慢慢挥发，直至溶液微呈胶状，立即停止加热，使其自然冷却，形成凝胶。将凝胶置于炉内，升温至 500°C 烧结 2
    h。获得棕色的纳米晶铁氧体粉末。


    用 PVC 胶水将纳米晶铁氧体粉末进行造粒，略微烘干，再用 FY-10 粉末压片机将其压成环型和片型样品(压力为 20 MPa 左右)。


    将压好的坯体置于型号为：KSY-80-18D 的烧结炉中，用 HP34410A 的 4 位数字的精确数字毫伏表测量热电偶的电动势，控制烧结温度。升温速率 100~150℃/h，在
    1000℃、1100℃、1200℃、1300℃ 不同温度下各保温 2 h。


    经过不同温度烧结，随炉自然冷却后，取出烧结好的样品，用 HITACHI S-570 扫描电子显微镜(SEM)拍样品断面电镜照片，观察样品断面晶粒尺寸大小、晶粒形状、空隙分布等显微结构，研究显微结构与温度之间的关系以及杂质对显微结构的影响。


    ### 3.3 工艺对纳米晶复合 NiZn 铁氧体显微结构的影响


    烧结是多晶铁氧体制备的最重要的一个环节。有许多因素影响着烧结，对铁氧体的显微结构都会产生很大影响，尤其烧结温度的影响最为重要。随着烧结温度的升高，离子和空位扩散过程使烧结会加速。由此形成特定的显微结构。


    ### 3.3.1 纳米晶复合 NiZn 铁氧体在不同烧结温度的显微结构


    图 3.1 为未掺杂纳米晶 NiZn 铁氧体(Ni0.6Zn0.4Fe2O4)压制的样品，在 900~1300℃ 不同烧结温度下的断面电镜照片。从图 3.1(a)
    可以看出，纳米晶坯体在 900℃ 烧结时除出现粘合剂挥发留下的一些孔隙、空洞外，颗粒还没有发生明显可见的变化。在 1000℃ (图 3.1(b))，开始出现颗粒可见变化，此时颗粒大约
    500 nm 左右，坯体已开始收缩、晶粒合并长大，出现了一些明显的相互贯通的孔隙。到 1100℃ (图 3.1(c))，颗粒收缩更明显，小气孔变小、大气孔增大。到
    1200℃ (图 3.1(d)) 晶粒长大、合并十分明显，出现一些较大的孔隙和不规则边界的二次结晶大晶粒。在 1300℃ (图 3.1(e)) 烧结后，大多数的空隙已变成孤立的闭气孔，显微结构又趋于均匀，空隙减少。整个显微结构变化与球体烧结模型比较一致。


