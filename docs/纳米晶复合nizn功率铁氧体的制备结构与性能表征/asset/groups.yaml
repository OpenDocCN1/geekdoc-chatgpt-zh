    (a) 热处理前粉末样品的透射电镜照片 (b) 经 1000°C/2 h 热处理; SEM 照片 (c) 经 1200°C/2 h 热处理; SEM 照片


    分析的实验结果。图 6.6 给出了其经 1000℃、1200℃ 热处理后，样品的 XRD 测量结果。球磨后，热处理前粉末样品的 TEM 照片（图 6.5(a)）显示粉末未成团、结块，结构不易分辨；当在
    1000℃/2 h 的烧结热处理后，其晶粒长大，尺度均匀，尺度增加到 300 nm 左右，晶粒尺寸整体还比较小（图 6.5(b)）；经 1200℃/2 小时烧结热处理后样品，晶粒进一步明显长大，增加到
    1 μm 左右，晶粒尺寸整体上均匀，局部出现了再结晶现象（图 6.5(c)）。对照上述磁测量的实验结果，表明在热处理过程中晶粒尺寸增加与各样品磁特性之间的关联，即样品饱和磁化强度
    σm 随热处理温度的增加而增加和矫顽力 Hc 随热处理温度的减小而减小。


