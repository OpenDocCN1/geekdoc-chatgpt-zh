    ## 4.2.2 铁氧体在高频弱场下的磁特性表征


    ### 4.2.2.1 表征交流磁特性的一些参量


    我们知道,在静态和准静态情况下,各向异性磁介质的磁导率是一个张量。如果磁性介质是各向同性的和均匀的则磁导率为一标量和实数。在动态的情况下，由于存在磁滞效应、涡流效应、磁后效、畴壁共振、自然共振等，磁导率不再是实数而是复数。这是因为此时磁感应强度
    B 和磁场 H 之间有了相位差，即是由于 B 滞后于 H 的结果。复数磁导率的物理意义是表示磁性材料，既有磁能的储存，又有磁能的损耗。这种磁损耗既非一般的涡流损耗，也不是磁滞损耗，而是磁化过程中，元磁矩运动的阻尼（弛豫机制）产生的。强磁性物质在弱交变电磁场中的起始磁导率
    \(\mu_i\) 或起始磁化率 \(\chi_i\) 与频率的关系称为磁谱[144-147]。在交变磁场中，复数磁导率的实部 \(\mu''\) 随频率的变化称为频散，虚部
    \(\mu''''\) 随频率的变化称为吸收[148]。复数磁导率是交变磁场中磁性材料的基本物理量，由此可以派生出许多其他磁参数，如品质因数 Q 值等等。


    复数磁导率可以表示为 \(\mu = \mu'' - j\mu''''\)。其中，\(\mu''''\) 相应于能量的损耗，而 \(\mu''\) 相应于能量的储存。在弱交变场中，磁感应强度
    B 的变化可以认为与交变磁场仅落后一位相角 \(\delta\)，如以复数形式表示，即为：


    \[\widetilde{H} = H_m e^{j\omega t}, \quad \widetilde{B} = B_m e^{j(\omega t -
    \delta)} \quad (4.1)\]


    因为，\(\tan \delta = \mu''''/\mu''\)，因此 \(\delta\) 又称损耗角，它与 \(\mu''''\) 成正比，\(\tan
    \delta\) 的倒数称为品质因数，即 \(Q = \frac{1}{\tan \delta}\)，\(\mu''\)，\(\mu''''\)，\(\tan
    \delta\)，Q 值（或称品质因数）是表征软磁铁氧体交流磁性的基本物理量，在生产中往往以比损耗系数（又称相对损耗） \(\frac{\tan \delta}{\mu''}
    = \frac{1}{\mu'' Q} = \frac{\mu''''}{(\mu'')^2}\) 或 \(\mu Q\) 积来表征材料的交流磁性。一般希望
    \(\mu''\) 高，\(\mu''''\) 低，即要求 Q 值高，\(\tan \delta\) 小或 \(\mu Q\) 值高。


    由于复数磁导率虚部的存在，使得磁感应强度 \(\widetilde{B}\) 落后于外加磁场 \(\widetilde{H}\)，这将引起铁磁物质在交变磁化过程中不断消耗外加能量。处于均匀交变磁场中的单位体积的铁磁体，单位时间的平均能量消耗（称为磁损耗功率密度）为


    \[ P_{\text{耗}} = \frac{1}{T} \int_0^T \vec{H} \cdot \mathrm{d}\vec{B} = \frac{1}{2}
    \omega H_m B_m \sin \delta \quad (4.2) \]


    由复数磁导率的定义可得


    \[ P_{\text{耗}} = \pi \cdot f \cdot \mu_0 \mu'''' H_m^2 \quad (4.3) \]


    其中 \( f \) 为外加交变磁场频率。


    在低频弱场情况(频率小于 1 MHz, B 小于 0.01 T), 材料的磁损耗主要来源于磁滞损耗、涡流损耗和剩余损耗。剩余损耗是总损耗中扣除涡流、磁滞后剩下的损耗,
    是由于磁后效或频散所引起的损耗, 在低频弱场中, 它为不依赖于频率的常数, 但在高频场中则与频率呈复杂的函数关系。对高电阻率的铁氧体磁性材料, 剩余损耗是占主要的。在低频弱场中,
    总的磁损耗用数学式子可表示为


    \[ \frac{\tan \delta}{\mu''} = \left( \frac{\tan \delta}{\mu''} \right)_{\text{磁滞}}
    + \left( \frac{\tan \delta}{\mu''} \right)_{\text{涡流}} + \left( \frac{\tan \delta}{\mu''}
    \right)_{\text{剩余}} = \frac{1}{2\pi} (aB_m + ef + c) \quad (4.4) \]


    这就是列格公式[149], 它还可以写成：


    \[ \frac{R_m}{\mu f L} = \frac{2\pi}{\mu Q} = ef + aB_{\max} + C \quad (4.5) \]


    其中 \( R_m \) 为相应于磁损耗的电阻, \( L \) 为磁元件的电感, \( Q = \frac{2\pi f L}{R_m} \) 为磁性元件的品质因数,
    \( B_m \) 为磁心的最大磁感应强度, \( e \) 为涡流损耗系数, \( a \) 为磁滞损耗系数, \( C \) 为剩余损耗。


    由铁磁理论[150]可得磁滞损耗系数


    \[ a = \frac{8\eta}{3\mu_0 \mu''^{7/3}} \approx \frac{8\eta}{3\mu_0 \mu_i^3} \quad
    (4.6) \]


    由磁滞引起的损耗功率 \(P_h\) 为


    \[ p_h = \frac{4}{3} \mu_0 \eta H_m^3 f \quad (4.7) \]


    由涡流效应引起的比损耗系数，根据薄板模型为


    \[ e = \frac{4\pi^2}{3} d^2 \mu_0 \sigma \quad (4.8) \]


    其中 \( d \) 为薄板 1/2 厚，\(\sigma\) 为电导率。相应的损耗功率为


    \[ P_c = \frac{2}{3} \pi^2 d^2 f^2 B_m^2 \sigma \quad (4.9) \]


    影响高频区（频率大于 1 MHz）复数磁导率的主要原因是畴壁共振和自然共振。在阻尼系数 \(\beta\)（可以表示为： \(\beta = \frac{8\mu_0^2
    M_s^2}{9\rho}\) ，其中 \(M_s\) 为饱和磁化强度，\(\rho\) 为材料的电阻率）很大的情况下的磁谱曲线呈弛豫型，在 \(\beta\)
    很小的情况下的磁谱曲线呈共振型。当外加恒磁场为零时，在外加交变磁场的作用下，磁矩在材料内部有效磁晶场中就发生自然共振。


    由畴壁共振引起的共振频率


    \[ \omega_r(\text{弛豫型}) = \frac{9\pi \sigma_{\text{壁}} \rho}{8\mu_0^2 a''^2 M_s^2}
    \quad (4.10) \]


    \[ \omega_r(\text{共振型}) = \left( \frac{2\pi \gamma^2 A \cdot s^2}{\mu_0 a \cdot
    a''^2} \right)^{1/2} \quad (4.11) \]


    其中，\(A\) 为交换积分常数，\(a''\) 为在假设空隙或掺杂物以立方点阵分布时该立方点阵的晶格常数，\(\sigma_{\text{壁}}\) 为单位面积的畴壁能。


    斯诺克[151] 1947 年在研究铁氧体的高频性质时发现


    \[ (\mu'' - 1) \cdot f_r = \frac{4}{3} \gamma \cdot M_s \quad (4.12) \]


    式(4.12)表明磁性材料的起始磁导率和截止频率 \( f_r \) 的乘积为以受材料内禀性质(旋磁比 \( \gamma \) 和饱和磁化强度 \( M_s
    \) )所决定的常数。这也给出了获得高频高磁导率磁性材料的一个理论上的极限。这就是著名的斯诺克定律。


    斯诺克公式还可以写成[152]：


    \[ (\mu'' - 1) \cdot f = \frac{3M_s^2}{\beta \cdot D} \quad (4.13) \]


    其中 \( \beta \) 为阻尼系数 \( \left( \beta = \frac{8\mu_0^2 M_s^2}{9\rho} \right) \)，\(
    D \) 为晶粒直径。


    软磁铁氧体起始磁导率与磁性材料参数的关系如下[154]：在可逆转动磁化的情况下，起始磁导率为


    \[ \mu_i \propto \frac{M_s^2}{|K_1|} \quad \text{或} \quad \frac{M_s^2}{\lambda_s
    \sigma} \quad (4.14) \]


    式(4.14)中 \( K_1, \lambda_s, \sigma, M_s \) 分别为磁晶各向异性常数、磁致伸缩系数、内应力和饱和磁化强度。


    在可逆壁移磁化情况下，当掺杂物和空泡对壁移起主要作用时


    \[ \mu_i \propto \frac{M_s^2}{\left[ A_1 \cdot \left( \left| K_1 + \frac{3}{2}
    \lambda_s \sigma \right| \right) \right]^{\frac{1}{2}}} \cdot \frac{d^2}{L} \quad
    (4.15) \]


    其中，\( d \) 为掺杂分布的平均间隔，\( L \) 为磁畴宽度，\( A_1 = A \cdot s^2 / a \) (简立方)或 \( 2A \cdot
    s^2 / a \) (体心立方)，\( A \) 为交换积分，\( s \) 为自旋量子数，\( a \) 为原子间距。


    在应力对壁移起作用时


    \[ \mu_i \propto \frac{M_s^2}{\left( \frac{3}{2} \lambda_s \sigma \right)} \cdot
    \frac{l}{\delta} \quad (4.16) \]


    式(4.16)中，\( l \) 为应力起伏波长，\( \delta \) 为畴壁厚度。因此要提高磁导率就必须使材料的磁晶各向异性小、磁滞收缩系数小、内应力小和饱和磁化强度大。


    ### 4.2.2.2 复数磁导率的测量


    按照磁性测量中关于复数磁导率的理论，如图 4.1 所示，磁芯线圈可以等效成一个电阻和一个电感的串联电路，则在 A、B 两点间的复阻抗：


    \[ Z = \frac{\dot{U}}{\dot{i}} \]


    ![](img/24a9da1d7c3b484411cd4981170528f1_93_0.png)


    - a: 磁芯线圈的串联等效电路

    - b: 磁芯线圈的并联等效电路


    图 4.1 磁芯线圈测量的等效电路


    式(4.17)中 \(\dot{U}, \dot{i}\) 分别为在 A、B 两点间的电压以及在绕组中的电流。在并联等效电路 b 中:


    \[ Z = R_x + j\omega L_x \]


    若忽略绕组的铜阻，则 \(\dot{U}\) 为绕组中的感生电动势所平衡。


    \[ U = N \cdot A_e \cdot \frac{dB}{dt} \]


    环行线圈内的磁场为：


    \[ H = \frac{N}{l_e} \cdot I \quad (4.20) \]


    将式(4.18)、式(4.19)代入式(4.17)中，可得到：


    \[ Z = \omega \frac{\mu_0 N^2 h}{2\pi} \ln \frac{D}{d} \mu'''' + j \omega \frac{\mu_0
    N^2 h}{2\pi} \ln \frac{D}{d} \mu'' \quad (4.21) \]


    式(4.21)中，\( h \) 为环行磁芯的高度；\( D \) 和 \( d \) 分别为环行磁芯的外半径和内半径；\( N \) 为线圈匝数；\( A_e
    \) 为试样的有效截面积，\( l_e \) 为有效长度。


    式(4.21)分别与式(4.17)的实部、虚部相等，则：


    \[ R_x = \omega \frac{\mu_0 N^2 h}{2\pi} \ln \frac{D}{d} \mu'''' \, , \quad L_x
    = \frac{\mu_0 N^2 h}{2\pi} \ln \frac{D}{d} \mu'' \quad (4.22) \]


    所以，\( \mu'' \) 和 \( \mu'''' \) 分别为：


    \[ \mu'' = \frac{L_x \cdot 10^7}{2 N^2 h \cdot \ln(\frac{D}{d})} (\mathrm{H} /
    \mathrm{m}) \quad (4.23) \]


    \[ \mu'''' = \frac{R_x \cdot 10^7}{2 \omega N^2 h \cdot \ln(\frac{D}{d})} (\mathrm{H}
    / \mathrm{m}) \quad (4.24) \]


    对 \( \mu'''' \), 我们还可以采用 \( Q \) 值来进行换算。因为 \( \tan \delta = \frac{1}{Q} = \frac{\mu''''}{\mu''}
    \)，所以，\( \mu'''' = \mu'' \cdot \frac{1}{Q} \)，只要测得磁芯样品的电感和 \( Q \) 值，也可以得到 \(
    \mu'' \) 和 \( \mu'''' \)。


    复数磁导率测量大体上分为电桥法和共振法两种。测量设备的设计主要依赖于频率范围。


    电桥法测试原理如图 4.2 所示。


    式中 \( R_x, L_x, R_d \) 分别为样品的等效电阻，等效电感和样品线圈的直流电阻。


