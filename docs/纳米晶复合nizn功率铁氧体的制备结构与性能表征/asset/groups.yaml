    ## 2.3.5 反应动力学参数计算


    热分析动力学是指用化学动力学的知识解析用热分析方法测得的物理量(如质量、温度、热量、模量、尺寸等)的变化速率与温度的关系。这种动力学分析不仅可用于研究各类反应，还可用于分析各类转变和物理过程(如结晶、扩散等的速率过程)[116]。热分析动力学的最基本假定是认为表示化学反应速率与温度关系的
    Arrhenius 方程可用于热分析反应，即对于


    A_{被} \longrightarrow B_{固} + C_{气} (2.5)


    的反应速率，可表示为


    -\frac{dC}{dt} = kf(C) (2.6)


    式(2.6) 中 $k = A\exp(-E/RT)$，对于简化模式的函数形式 $f(C) = C^n$。式中可反应物量，即剩余分数 $C$ 对热重曲线而言，定义为：$C
    = \frac{W}{W_0}$，$W_0$ 是反应前的物质重量。对于多阶反应，上述各量的定义，都是指所讨论的那个特定过程而言，并非对应全过程。$A$ 是频率因子，$E$
    是活化能 (kJ/mol)，$n$ 是反应级数，这三个量就是要求解的动力学参数。$R$ 是气体常数，其值为 8.31 J/(mol·K)，升温速率是 $\phi
    = \frac{dT}{dt}$。因此可以导出热重动力学微分法和积分法的最基本式


    -\frac{dC}{dT} = \frac{A}{\phi} e^{-E/RT} C^n (2.7)


    由此出发可以导出各种动力学式。


    可以根据 Freeman-Carroll 和 Kissinger 两种不同方法求解空气中凝胶热分解反应动力学参数。对第一放热峰，使用 Freeman-Carroll
    法[117]，其动力学参数可由公式作图求得


    \(-\frac{E}{2.3R} \cdot \frac{\Delta(\frac{1}{T})}{\Delta \lg w} = \frac{\Delta
    \lg(\frac{dw}{dt})}{\Delta \lg w} - n\)


    其中，$w$ 为可反应物浓度；$dw/dt$ 为在时间 $t$ 时的质量损失速率；$T$ 为温度(K)；$n$ 为反应级数；$R$ 为气体常数；$E$ 为活化能(kJ/mol)。


    作 $\Delta(1/T)/\Delta \lg w$ 与 $\Delta \lg(dw/dt)/\Delta \lg w$ 关系如图 2.9 所示。根据图中直线斜率及公式计算可得，在
    195—201℃处拟合直线斜率为 -3 008.6，截距为 3.53，于是计算得活化能 $E = 57.6$ kJ/mol，反应级数 $n = 3.53$。


    ![](img/24a9da1d7c3b484411cd4981170528f1_48_0.png)


    图 2.9 Freeman-Carroll 法拟合直线


    用 Kissinger 法[118]，可按公式(2.9)作图


    \(\frac{d(\lg \frac{\beta}{T_p^2})}{d(\frac{1}{T_p})} = -\frac{E}{R}\)


    式(2.9)中，$E$ 为表观活化能，$\beta$ 为升温速率，$T_p$ 为峰值温度，$R$ 为气体常数。按实验结果列表 2.3，然后根据 $\frac{1}{T_p}
    - \log(\frac{\beta}{T_p^2})$ 作图求斜率，同理再按公式(2.9)计算，便可求得表观活化能为 $E = 43.2 \text{ kJ/mol}$，与
    Freeman-Carroll 法计算结果接近(见图 2.10)。


    表 2.3 凝胶在不同升温速率时 DSC 曲线峰温


    | β(K/min) | Tp | 1/Tp | Tp² | β/Tp² | log(β/Tp²) |

    |---|---|---|---|---|---|

    | 2.5 | 191.9 | 0.005211 | 36825.61 | 6.79E-05 | -4.16821 |

    | 5 | 200 | 0.005 | 40000 | 0.000125 | -3.90309 |

    | 10 | 201.78 | 0.004956 | 40715.17 | 0.000246 | -3.60976 |

    | 20 | 206.5 | 0.004843 | 42642.25 | 0.000469 | -3.32881 |


    ![](img/24a9da1d7c3b484411cd4981170528f1_49_0.png)


    我们知道在许多情况下动力学参数还不能视为物质的特性参数。进行动力学分析应当具有明确的目的性，不单是为了求得动力学参数值，还要与反应过程、结构因素、工艺条件和材料评定等紧密相关。


    这里对热分析动力学参数数据并没有进行相关的理论分析，仅从形式上它表示了反应速率的温度依赖性。因此这仅可以在一定限度内，对于同系列而结构、成分上略有不同的物质，可以起到相互类比的作用。


