    实验结果表明，不同比例、不同成分纳米、微米铁氧体颗粒复合样品,经过再次热处理加工,样品的磁性能变化是明显的。


    对样品磁导率而言,磁导率随微米铁氧体颗粒尺寸增大和混合量的增加略有增加(3#,4#比1#,2#略高),但不够明显。这可能与我们再次热处理温度不高有关(只有
    980℃)。样品 5#,6#磁导率(图 5.2)明显高于 1#—4#,因为这两个样品配方中都含有铜,由于铜的助熔剂作用和液相烧结,在相同的烧结温度和烧结时间,晶粒长得要比没有铜掺杂样品大,这已经在本论文第三章中得到证明。样品
    7#,8#由于掺杂助溶剂 Bi²⁺ 的作用,其磁导率有较大的提高,从 40 多迅速提高到 250 左右。而相同配方样品的磁导率在不掺杂的情况下,一般需要 1300℃以上的高温烧结才能得到类似的磁导率数值(如第四章内容所示)。很显然,合理的挑选助熔剂的种类和数量可以在大幅降低烧结温度(300
    多度)的同时保持所需要的磁性能。


    图 5.1～5.3 还显示,代表损耗的磁导率虚部峰值,随大颗粒尺寸粉体比例增多,复合烧结后逐渐向低频移动(从 70 MHz 移到 40 MHz),


    显示了截止频率下降趋势，而且很有规律。这进一步说明，显微结构的不均匀性会导致材料的损耗增加，这不均匀的显微结构还可以受控制地构造！


    因为复合烧结各颗粒的大小是可以人为控制的，从几十纳米到几十微米；复合比例和复合物质种类也可以人为控制，这就为构造新性质的材料提供了又一个方向。这个问题以后还需要通过更多实验来加以证实。


    对样品的品质因数 Q 值而言，铜离子的助溶作用使材料密度得到提高，材料 Q 值相对也比较高(见图 5.5)。


    样品 7#、8# 由于掺杂助溶剂 Bi²⁺，使材料密实化温度进一步下降，然而由于掺杂数量过多，材料 Q 值也随之降低，仅为 50 左右。1#—4# 样品 Q
    值为 55 左右；5#、6# 样品 Q 值为 65 左右。


    为了进一步看清不同颗粒大小和配比的样品磁导率与频率的关系，我们把不同条件，相同配比样品的测试结果放在同一张图中(图 5.7)。1100+ZR - A 表示纳米晶
    A 粉在 1100℃处理 2 小时后与 A 粉各一半混合，用相同工艺制成环状样品，都是在 980℃烧结 2 小时。对 1200+ZR - A 和 1200+ZR
    - B 也是如此处理。可见，样品磁导率随频率变化都是先上升后下降的，并且磁导率随频率变化起伏较大。这与前一章纳米晶聚集体烧结结果大不相同。较大尺寸颗粒的掺入好像并没有提高样品的磁导率，掺有助溶剂样品的磁导率却有显著的提高。


    以上这些结果可以使我们作如下思考：因为传统铁氧体磁性材料是由大量微米级粒子构成的。粒子间的相互作用可以分为近邻晶粒的交换耦合相互作用和长程静磁(偶极)相互作用[165]。晶粒交换耦合相互作用是指两个相邻晶粒直接接触时，界面处不同取向的磁矩产生交换作用，阻止磁矩沿各自的易磁化方向取向，使磁矩取向从一个晶粒的易磁化方向连续地改变为另一个晶粒的易磁化方向。晶粒界面处的交换耦合相互作用削弱了每个晶粒的磁晶各向异性的影响，使磁矩沿外磁场方向的分量增加，即产生剩磁增强效应。交换耦合相互作用与晶粒尺寸及相对取向有关，晶粒尺寸越小，其表面积与体积之比就越大，界面处的交换相互作用对晶粒磁性能的影响越大。周寿增等人[166-167]对烧结
    NdFeB 磁体的研究表明，在晶粒尺寸达到微米量级时，晶粒之间的交换耦合相互作用对磁体性能没有显著影响。然而当颗粒降到了纳米量级，粒子的比表面积增加，界面原子的交换耦合相互作用对材料磁性能的影响加强。Herzer
    在解释纳米软磁材料 Finemet 的优异磁性能时提出混乱各向异性模型，指出：当晶粒尺寸 D 小于晶粒之间的铁磁交换作用长度 L_ex 时，晶粒内的磁矩方向将取决于交换作用能与各向异性能相互平衡的方向，其等效各向异性
    < K > 为交换作用长度内各晶粒各向异性的平均值[168]，


    ```

    < K > = K_1(D/L_{ex})^{3/2}  (5.1)

    L_{ex} = (A/ < K >)^{1/2}  (5.2)

    ```


    式(5.1),(5.2)中 A 为交换劲度，K_1 为磁晶各向异性常数，D 为晶粒直径。根据式(5.1),(5.2)可以得出：


    ```

    < K > = K_1^4 \times D^6 / A^3  (5.3)

    ```


    因为

    H_c \propto \frac{K_u}{M_s}  (5.4)


    参见公式(5.1)，可见当 D < L_ex 时，有效各向异性 < K > 随晶粒尺寸减小呈 6 次方关系下降，矫顽力呈 6 次方关系下降，磁导率呈 6 次方关系上升。


    由复合实验结果注意到，复合样品烧结反应没有预想的那么激烈。因此猜想可能是复合样品中纳米颗粒尺寸太大了些，或烧结温度较低了些。根据第三章烧结机理可知，类似大小的颗粒复合的样品，1000℃烧结时显微结构都没有什么明显反应，而复合纳米晶样品烧结温度仅为
    980℃，坯体当然还没有开始收缩；由于样品晶粒间的接触不紧密，而且不均匀的起始颗粒还形成了不均匀的结构，


    损耗增大是必然的；实验的结果也证明了这一点。而含有助溶剂铜的样品由于铜掺杂数量不足，还不能充分形成液相烧结，所以情况也不佳。本次实验制定复合烧结温为 980℃，是希望纳米晶颗粒的小尺寸、高表面活性加速烧结反应，根据实验结果和以上讨论分析可知，要使纳米晶在二次处理工艺中发挥作用，选用的纳米晶颗粒还要再小些（最好为十几纳米）；坯体成型密度还要大些（让纳米、微米颗粒尽可能紧密接触）；或烧结温度再高些。这样就能利用不同层次上的交换作用与磁性材料性能的密切关系，利用纳米晶高度表面活性作催化剂，制备出性能特异的功能材料。因此用这一思想设计新结构材料，开发新型功能材料，还有许多工作可做。


    ### 5.4 不同 Bi 掺杂对样品磁特性的影响


    如同在样品制备中所描述的：在溶胶阶段掺杂的铋，由于我们采用的是硝酸铋，是以溶液状态与溶胶均匀混合，所以是分子、离子水平上的混合。而在制备成主配方纳米晶 B
    样品后再掺杂的铋，是微米尺度的氧化铋，是纳米和微米尺度的混合。这是两种不同级别的混合，故分别称为溶胶阶段掺杂和纳米晶阶段掺杂。


    图 5.8 是在纳米晶阶段掺杂 Bi——样品 D 的磁导率与频率的关系。样品 D 掺杂方法类似于传统工艺，即在样品预烧后二次球磨阶段进行所需的掺杂，掺入的是各种微米尺度的氧化物，然后和预烧后的材料进行混合球磨，颗粒一般可以达到微米量级，然后在造粒、成型和烧结成样品。实验结果显示，这种方法处理后的样品磁导率随掺杂数量的变化规律不明显（见图
    5.8），一会儿下降，一会儿上升，只反映了变化趋势。掺杂量在 0.6%以下时，样品磁导率都很低，只有 6 左右；当掺杂量达到 0.8%时，磁导率才开始有较大的变化。

