    \ NiZn 铁氧体形成机理，纳米晶合成 NiZn 铁氧体的烧结机理、结构和性能表征；研究了纳米晶复合 NiZn 铁氧体的高频磁特性和损耗特性，为微电子器件小型化、集成化、一体化和制作高频低耗功率器件提供了重要的基础研究资料。本论文共分七章，主要内容为：\n\
    \n第一章综述了当今铁氧体磁性材料的研究进展，以纳米技术在磁性材料研究中的应用为着眼点，分析了目前相关铁氧体的制备工艺；在此基础上，针对传统铁氧体制备工艺的局限，提出了凝胶自燃法制备铁氧体纳米晶与前驱物的新工艺。\n\
    \n第二章系统研究了凝胶自燃法合成纳米晶 NiZn 铁氧体的过程，制备条件对纳米晶铁氧体合成的影响，纳米晶铁氧体的结构和磁性能表征，提出了凝胶自燃法合成纳米晶\
    \ NiZn 铁氧体的物理机制。\n\n第三、四章提出了纳米晶再次复合的方法，即把纳米晶铁氧体直接造粒、成型和烧结制备成多晶铁氧体的方法，研究了溶胶过程中掺杂制成掺杂纳米晶铁氧体，然后再通过造粒、成型和烧结制备成多晶\
    \ NiZn 铁氧体工艺；研究了不同掺杂种类、不同掺杂量和不同烧结温度的纳米晶复合 NiZn 铁氧体的显微结构；用球体模型解释了纳米晶复合 NiZn 铁氧体的烧结机理；重点考察了烧结温度、掺杂种类和浓度对纳米晶复合\
    \ NiZn 铁氧体显微结构影响，探讨了显微结构与高频损耗与磁性能关系。\n\n第五章研究了纳米—微米复合烧结 NiZn 铁氧体的工艺，研究了这种复合材料低温烧结后的高频损耗和磁谱特性，为未来利用可控制备纳米晶颗粒尺寸方法，设计和制备不同种类纳米晶、微米晶复合材料，制备特殊结构功能材料和复合结构材料奠定了基础。\n\
    \n第六章给出了一种利用高能球磨法制备纳米晶 NiZn 铁氧体的新方法，研究了用高能球磨合成纳米晶 NiZn 铁氧体的过程，对高能球磨合成纳米晶效率进行了评估，证明高能球磨亦不失为一种制备\
    \ NiZn 纳米晶铁氧体的有效方法。\n\n第七章对本论文工作进行了总结，并对未来研究进行了展望和讨论。\n\n整体而言，本工作通过纳米晶复合技术成功实现了\
    \ NiZn 铁氧体材料的低温烧结，解决了 NiZn 铁氧体材料制备中的一些关键技术，申报了国家发明专利，获得了具有自主知识产权的创新性研究成果，经专家鉴定该材料综合性能处于国内领先地位，达到当今国际同类材料的先进水平。本工作研究内容和所建立的一些新方法、新工艺，不仅可用于铁氧体材料生产，还可以推广应用到相关精细陶瓷的制备过程中。\n\
    \n### 关键词\n\nNiZn 铁氧体，纳米晶，凝胶自燃法，高频磁特性，纳米—微米复合\n\n## Abstract\n\nWith the development\
    \ of the miniaturization of micro-electronic devices and magneto-electronic devices,\
    \ which are being widely used in the field of modern information technology, and\
    \ the correspondingly demand for miniaturization and low profile, the electro-magnetic\
    \ properties of ferrite devices are also expected to satisfy the high permeability,\
    \ high frequency, wide frequency range and low power loss. NiZn ferrite with spinel\
    \ structure (AB2O4) is a poly nary metal oxide sintered substance, which has been\
    \ playing an important role in the application of high frequency in field of magneto-electronic\
    \ devices. The power loss of this kind of materials has always been an object\
    \ of study to many researchers, especially under the circumstances of increasing\
    \ demand for the miniaturization, integration, and modularization of products\
    \ used in electronics and information industry. Apart from the demands for the\
    \ high permeability and wide frequency ranges, new requirement is also needed\
    \ in the preparation of materials, and device combination and assembly process,\
    \ where materials need firing at low temperatures. Therefore, it is of great significance\
    \ to develop a new NiZn ferrite material with high permeability, high saturation\
    \ magnetization, high cut-off frequency and low sintering temperature, which will\
    \ surely promote the development of micro-electronic manufacturing industry. In\
    \ this thesis we introduce the nano-technique into NiZn ferrite preparation. Starting\
    \ with raw material fabrication, this thesis presents systematically the forming\
    \ mechanism of NiZn ferrite nano-crystallites; the sintering mechanism of nano-crystalline-built\
    \ NiZn ferrite, their microstructure and magnetic performances and their magnetic\
    \ spectrum and power loss characteristics at high frequencies, in order to furnish\
    \ some important basic findings for the manufacturing of micro-electronic devices,\
    \ which can work at high frequency with low loss, compact size and integration,\
    \ and can be used for the applications with high frequency, low power loss devices.\
    \ This thesis consists of seven chapters. The main contents are as follows:\n\n\
    The first chapter summarizes the current development of ferrite magnetic material\
    \ researches, by paying special attention to the application of nano-technology\
    \ in the magnetic material researches, analyses the present status of various\
    \ ferrite manufacturing processing methods, on the bases of which, a new processing\
    \ using gel-auto-combustion in the preparation of ferrite nano-crystallite and\
    \ ferrite precursor is put forward against the weaknesses of traditional ferrite\
    \ preparation process.\n\nThe second chapter systematically reveals the nanocrystalline\
    \ NiZn ferrite synthesis process by gel-auto-combustion method, the influences\
    \ of manufacturing conditions on nanocrystalline ferrite formation, the characterisations\
    \ of nanocrystalline ferrite’s structure and magnetic properties, and extracts\
    \ the physical mechanism of synthesizing nanocrystalline NiZn ferrite.\n\nThe\
    \ third and fourth chapters present the nanocrystalline re-synthesis method, that\
    \ is, making grains, packing and sintering directly to form polycrystalline ferrite\
    \ by using nanocrystalline ferrite method, investigating the process of doping\
    \ in the sol to prepare doped nanocrystalline ferrite and then making grains,\
    \ packing and sintering to synthesis polycrystalline NiZn ferrite, and also study\
    \ the microstructures of doping or nanocrystalline-synthesized NiZn ferrites at\
    \ different sintering temperatures; explain its sintering mechanism by ball model\
    \ hypothesis, focusing on the effects of sintering temperatures, the doping substances,\
    \ the doping quantities on the ferrite microstructures, and the relationships\
    \ between microstructure and magnetic properties or power loss at high frequencies.\n\
    \nChapter five deals with the Nano-micro-crystalline composite sintering NiZn\
    \ ferrite process; the power loss at high frequencies and magnetic spectrums of\
    \ the materials sintered at low temperature, which has laid a solid foundation\
    \ for further application of different sizes of nanocrystalline, for the designing\
    \ and manufacturing different nano-micro-crystalline composites materials, and\
    \ for the preparation of materials with special structure, function or composite\
    \ structure.\n\nChapter six gives a new way to manufacture NiZn ferrite nanocrystalline\
    \ by high-energy ball milling. The synthesizing process is also discussed in detail,\
    \ together with the forming mechanism for NiZn ferrite nanocrystalline, and the\
    \ synthesis efficiency of NiZn ferrite nanocrystalline made by high-energy ball\
    \ milling, proves that the preparation of NiZn ferrite nanocrystalline by high-energy\
    \ ball milling is applicable.\n\nChapter seven summarizes this thesis.\n\nOn the\
    \ whole, this work has successfully prepared the NiZn ferrite material sintered\
    \ at low temperature by nanocrystalline composite technology, which solves some\
    \ key techniques in NiZn ferrite manufacturing. The present researches give a\
    \ leading ferrite material with intellectual property. The new methods and processes\
    \ invented in our research work can not only be used in manufacturing ferrite\
    \ magnetic materials, but also in the production and researches of related ceramics.\n\
    \n### Key words\n\nNiZn ferrite, nano-crystalline, gel-autocombustion method,\
    \ high frequency properties, nano-micro crystalline synthesis\n"
