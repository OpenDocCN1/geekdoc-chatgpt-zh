    \ 200062\n\n## 答辩委员会对论文的评语\n\n郁黎明同学的论文以高频 NiZn 铁氧体的制备和磁性研究为背景，对 NiZn 铁氧体的制备工艺进行了改进。用溶胶凝胶法获得了纳米晶\
    \ NiZn 复合铁氧体，并以此为原料，制备并研究了一系列铁氧体的结构和磁性，得到了一系列好的结果，具体表现在以下几个方面：\n\n- (1) 用凝胶自燃法制备了纳米晶\
    \ NiZn 铁氧体，研究了其工艺过程，解释了纳米晶复合 NiZn 铁氧体的烧结机理。\n- (2) 利用掺杂纳米晶 NiZn 铁氧体直接成型、烧结制备高性能\
    \ NiZn 铁氧体的新工艺，成功开发了具有先进水平的高磁导率、高频、宽频、低耗 NiZn 功率铁氧体材料与器件。\n- (3) 利用纳米晶和微米晶复合烧结工艺制备高饱和低的磁损耗材料，该方法对开展其他复合材料研究具有一定借鉴。\n\
    - (4) 利用高能球磨采用 Fe3O4 作为氧化铁制备了纳米晶 NiZn 铁氧体，并对材料微观结构和磁特性进行了系统研究。\n\n综上所述，郁黎明同学的论文选题明确，研究思路清晰，实验数据完整可靠，论文撰写规范，文字表达清楚，表明了作者基础理论扎实，具有独立从事科研工作的能力。在答辩过程中，能正确回答答辩委员会提出的问题。\n\
    \n## 答辩委员会表决结果\n\n经答辩委员会委员无记名投票，一致通过郁黎明同学的博士学位论文答辩，并建议授予博士学位。\n\n答辩委员会主席：杨燮龙 \
    \ \n2005 年 6 月 9 日\n\n## 摘要\n\n随着微电子器件小型化低功耗方向的发展，对作为现代信息技术领域应用广泛的磁电子器件提出了相应的要求，同时电磁性能也要求向高磁导率、高频、宽频和低损耗方向发展。具有尖晶石（AB2O4）结构的\
    \ NiZn 铁氧体，作为一种多元复合金属氧化物烧结体，在磁电子学高频应用领域一直起着重要的作用。因而该材料的频率损耗问题始终是该材料研究中的主题。特别是电子和信息产业对产品的小型化、集成化和模块化要求日益增高的情况下，除了对材料的高磁导率和使用频率宽度上的要求外，在材料制备工艺和器件组合配套方面也提出了新的要求，特别是低温烧结技术方面。因此，开发磁导率高、饱和磁化强度高、截止频率高并能低温烧结的\
    \ NiZn 铁氧体材料，对推动微电子制造业的进一步发展有着重要的意义。本论文将纳米技术引入 NiZn 铁氧体的制备过程，从原料制备方法探索入手，系统研究了纳米晶\
    \ NiZn 铁氧体形成机理，纳米晶合成 NiZn 铁氧体的烧结机理、结构和性能表征；研究了纳米晶复合 NiZn 铁氧体的高频磁特性和损耗特性，为微电子器件小型化、集成化、一体化和制作高频低耗功率器件提供了重要的基础研究资料。本论文共分七章，主要内容为：\n\
    \n第一章综述了当今铁氧体磁性材料的研究进展，以纳米技术在磁性材料研究中的应用为着眼点，分析了目前相关铁氧体的制备工艺；在此基础上，针对传统铁氧体制备工艺的局限，提出了凝胶自燃法制备铁氧体纳米晶与前驱物的新工艺。\n\
