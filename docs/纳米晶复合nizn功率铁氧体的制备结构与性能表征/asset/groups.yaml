    ```

    Ni³⁺ + Co²⁺ ——> Ni²⁺ + Co³⁺       (3.2)

    Co³⁺ + Fe²⁺ ——> Fe³⁺ + Co²⁺       (3.3)

    ```


    从而抑制了 Fe²⁺ 与 Ni³⁺ 的出现，使 ρ 值提高。


