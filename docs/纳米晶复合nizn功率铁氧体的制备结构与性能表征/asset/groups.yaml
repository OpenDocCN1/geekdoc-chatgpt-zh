    样品的热重 TG、DTG 曲线如图 2.4、图 2.5 所示。从图中可以看到，约在 222°C 之前，TG 曲线呈两步缓慢失重。在 87.5°C 至约 195°C，失重约
    9.82 wt%。对应于吸附水的脱除。急速失重区间为 195～201°C。失重约 61 wt%。对应于络合型凝胶的分解反应。


    ![](img/24a9da1d7c3b484411cd4981170528f1_42_0.png)


    图 2.4 动态氮气中凝胶样品的 TG、DTG 曲线


    ![](img/24a9da1d7c3b484411cd4981170528f1_42_1.png)


