    # # 第五章 纳米—微米晶复合制备 NiZn 铁氧体


    # ## 5.1 引言


    采用“由下而上”(bottom up)的方法我们可以从原子、分子出发构筑纳米粒子；利用“从上至下”(top down)的技术，我们可以将宏观物体逐步细化得到纳米颗粒。纳米颗粒在性能上与原子、分子和宏观物体完全不同，成为一种新物质状态。这种性能上的变化是由物质的体积取特定的数值而引起的，故称为体积效应。对体积效应产生的原因仍然在不断地探讨中。目前，量子效应与小尺寸效应是体积效应的两种具体体现。


    物质的尺寸随粒径的减小而产生了量子化，引起了纳米颗粒的光、电性质的变化称为量子尺寸效应；当纳米颗粒的尺寸与光波波长、德布罗意波长、磁性材料中的交换长度、畴壁宽度、单畴尺寸等物理量相当或更小时，周期性的边界条件将被破坏，物质的声、光、电、磁、热等性质均会产生新的特征[157-161]，这种变化称为小尺寸效应，这种小尺寸效应对固态物质而言，就体现为纳米颗粒的表面效应。


    固体表面原子所处的环境有别于内部原子，内部原子被其他原子所包围，而表面原子只有部分和内部原子产生键合，另一部分则以“悬键”形式存在，这意味着表面原子与内部原子相比处于高能量状态，这一额外能量就是表面能，所以表面原子的集合会呈现出与内部原子集合不同的性质。由于通常块体的表面原子的数目远小于内部原子数目，因此块体的表面效应常常难以显现；但是当物体处于纳米尺度后，由于处于表面的原子数目在体系中所占的比例增大，表面效'
  - '[PAGE 117]


    应十分突出[162]，即表现为，使物质表面能增加并提供数目众多的表面反应活性中心。此外，表面原子具有比体内原子更低的对称性，使表面自旋结构不同于体内，可以形成非共线的自旋构造，导致纳米颗粒的磁性、热力学等性质发生变化，且出现各向异性。表面原子相对比例增加，这些表面原子子处于高能状态，因而纳米颗粒宏观上表现为熔点下降和德拜温度下降、相变临界点发生变化和烧结能力增强；同时，由于纳米颗粒表面原子的配位不足，增强了粒子的活性，使其有很强的催化能力。


    一般纳米复合材料的构成形式是0—0 型，0—1 型，0—2 型，0—3 型，1—3 型，2—3 型等主要形式[163-164]。


    (1) 0—0 复合，即不同成分、不同相或不同种类的纳米微粒复合而成的纳米固体或液体，通常采用原位压块、原位聚合、相转变、组合等方法实现，具有纳米构造非均匀性，也称为聚集型，在一维方向排列成纳米丝，在二维方向排列成纳米薄膜，在三维方向排列成纳米块体材料。


    (2) 0—2 复合，即把纳米微粒分散到二维的纳米薄膜中，得到纳米复合薄膜材料，它又可分为均匀弥散和非均匀弥散两类。有时，也把不同材质构成的多层膜也称为纳米复合薄膜材料。


    (3) 0—3 复合，即把纳米微粒分散在常规固体粉体中，这是聚合物基无机纳米复合材料合成的主要方法之一，填充纳米复合材料的复合从加工工艺角度考虑，主要是采用0—3
    复合形式。


    (4) 1—3 复合，主要是纳米碳管、纳米晶须与常规聚合物粉体的复合，对聚合物的增强有特别明显的作用。


    (5) 2—3 复合，即把无机纳米片体与聚合物粉体或聚合物前驱体复合，主要体现在插层纳米复合材料的复合。


    以上这些纳米复合材料中都至少含有一种纳米尺度的材料，它们所表现出来的新的物质性质，已经引起越来越多人的注意。然而对利用纳米小尺寸效应进行再加工方面的研究还比较少。本论文前几章讨论了利用铁氧体纳米晶粉体作多晶铁氧体材料前驱体进行二'
