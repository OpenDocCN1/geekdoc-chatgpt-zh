    因为样品 C 和样品 D 的所有工艺条件除掺杂方法不一样外，其余都相同。因此测量结果表现出的性能波动，应该就是复合方式不同引起的。这样就证明了在溶胶阶段掺杂工艺的优，即掺杂数量容易控制，操作方便，不用混合球磨，并能保证产品生产时的一致性。


