    移过程和晶粒界面上原子的扩散迁移是一样的，晶粒长大速度 u 和温度关系为 u = u0 exp(-Eu/RT)，Eu 为活化能，u0 为常量。只要各晶粒长大而不互相碰撞，其速度
    u 为恒定值，且各晶粒尺寸 d 随时间关系为 d = u(t - t0)，因此最终晶粒大小取决于晶核数目的多少，更严格地讲决定于成核和晶粒长大的相对速度。由于这二者都与温度密切相关，故总的结晶速度随温度而迅速变化。初次结晶在金属中更为重要。


    ### (2) 晶粒长大


    无论再结晶发生与否，细颗粒晶体聚集体在高温下平均晶粒尺

