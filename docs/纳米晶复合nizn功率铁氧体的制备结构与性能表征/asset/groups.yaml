    ### 3.3.2 钙掺杂纳米晶复合 NiZn 铁氧体在不同烧结温度的显微结构


    ### (a) 不同掺 Ca²⁺ 量样品在 1000℃ 烧结的显微结构


    图 3.2 给出了不同掺 Ca²⁺ 量样品在 1000℃ 烧结后的显微结构照片。实验结果表明，在 1000℃ 烧结后，不同掺 Ca²⁺ 样品，晶粒的大小、形状变化不大。Ca²⁺
    掺杂 1.2% 的断面有一些孤立的气孔；Ca²⁺ 掺杂 0.8% 有些大孔洞，还有部分正在连通的气孔；低掺杂照片中一些白色的物质是扫描电镜拍摄时电子束遇到的高电阻层(图
    3.2(d))，它是由高电阻率的钙离子形成的。由于 Ca²⁺ 离子半径较大为 1.06 Å，一般只能处于晶界而不能进入晶格。对比不掺杂的情况，估计晶粒尺寸还比较小。扫描电镜照片呈现反白，说明样品具有很高的电阻率。


