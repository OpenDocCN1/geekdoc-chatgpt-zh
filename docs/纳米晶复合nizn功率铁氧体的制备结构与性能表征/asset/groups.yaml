    NiO 和 ZnO 存在的情况下混合球磨后变为 377 · 10^3 (4π)^-1 A · m^-1，则估计 Fe3O4 的转换率应为 ((520—377)
    ÷ 520) = 27.5%。同理，纯 Fe3O4 原料经 100 小时球磨后饱和磁化强度 σm 为 25 A · m^2 kg^-1，但实际上在有 NiO
    和 ZnO 存在的情况下混合球磨后已为 45 A · m^2 kg^-1，由此估计约有 ((45—25) ÷ 45) = 44% 的转化。即混合球磨后样品的矫顽力
    Hc 减少，饱和磁化强度 σm 的提高，都应是合成相 NiZn 铁氧体的贡献。在 Jiang 等人文献中给出的混合球磨 100 h 样品，其饱和磁化强度 σm
    约为 20 A · m^2 kg^-1，考虑到球磨前各原料呈弱磁性，按照同样的估算，则转换率大约仅为 20%，远小于本实验的转换率。另一方面，从图 6.2
    中 Fe3O4 粉末球磨 100 h 后的磁滞回线来看，长期的球磨增加了粉料中 Fe2O3 的含量，所以降低了其饱和磁化强度 σm，但其矫顽力 Hc 似乎没有因颗粒的尺寸减小而减小。


