    以上这些结果可以使我们作如下思考：因为传统铁氧体磁性材料是由大量微米级粒子构成的。粒子间的相互作用可以分为近邻晶粒的交换耦合相互作用和长程静磁(偶极)相互作用[165]。晶粒交换耦合相互作用是指两个相邻晶粒直接接触时，界面处不同取向的磁矩产生交换作用，阻止磁矩沿各自的易磁化方向取向，使磁矩取向从一个晶粒的易磁化方向连续地改变为另一个晶粒的易磁化方向。晶粒界面处的交换耦合相互作用削弱了每个晶粒的磁晶各向异性的影响，使磁矩沿外磁场方向的分量增加，即产生剩磁增强效应。交'
  - '[PAGE 125]


    换耦合相互作用与晶粒尺寸及相对取向有关，晶粒尺寸越小，其表面积与体积之比就越大，界面处的交换相互作用对晶粒磁性能的影响越大。周寿增等人[166-167]对烧结
    NdFeB 磁体的研究表明，在晶粒尺寸达到微米量级时，晶粒之间的交换耦合相互作用对磁体性能没有显著影响。然而当颗粒降到了纳米量级，粒子的比表面积增加，界面原子的交换耦合相互作用对材料磁性能的影响加强。Herzer
    在解释纳米软磁材料 Finement 的优异磁性能时提出混乱各向异性模型，指出：当晶粒尺寸 D 小于晶粒之间的铁磁交换作用长度 L_ex 时，晶粒内的磁矩方向将取决于交换作用能与各向异性能相互平衡的方向，其等效各向异性
    < K > 为交换作用长度内各晶粒各向异性的平均值[168]，


    ```

    < K > = K_1(D/L_{ex})^{3/2}  (5.1)

    L_{ex} = (A/ < K >)^{1/2}  (5.2)

    ```


