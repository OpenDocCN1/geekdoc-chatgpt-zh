    \ different sintering temperatures; explain its sintering mechanism by ball model\
    \ hypothesis, focusing on the effects of sintering temperatures, the doping substances,\
    \ the doping quantities on the ferrite microstructures, and the relationships\
    \ between microstructure and magnetic properties or power loss at high frequencies.\n\
    \nChapter five deals with the Nano-micro-crystalline composite sintering NiZn\
    \ ferrite process; the power loss at high frequencies and magnetic spectrums of\
    \ the materials sintered at low temperature, which has laid a solid foundation\
    \ for further application of different sizes of nanocrystalline, for the designing\
    \ and manufacturing different nano-micro-crystalline composites materials, and\
    \ for the preparation of materials with special structure, function or composite\
    \ structure.\n\nChapter six gives a new way to manufacture NiZn ferrite nanocrystalline\
    \ by high-energy ball milling. The synthesizing process is also discussed in detail,\
    \ together with the forming mechanism for NiZn ferrite nanocrystalline, and the\
    \ synthesis efficiency of NiZn ferrite nanocrystalline made by high-energy ball\
    \ milling, proves that the preparation of NiZn ferrite nanocrystalline by high-energy\
    \ ball milling is applicable.\n\nChapter seven summarizes this thesis.\n\nOn the\
    \ whole, this work has successfully prepared the NiZn ferrite material sintered\
    \ at low temperature by nanocrystalline composite technology, which solves some\
    \ key techniques in NiZn ferrite manufacturing. The present researches give a\
    \ leading ferrite material with intellectual property. The new methods and processes\
    \ invented in our research work can not only be used in manufacturing ferrite\
    \ magnetic materials, but also in the production and researches of related ceramics.\n\
    \n### Key words\n\nNiZn ferrite, nano-crystalline, gel-autocombustion method,\
    \ high frequency properties, nano-micro crystalline synthesis\n"
