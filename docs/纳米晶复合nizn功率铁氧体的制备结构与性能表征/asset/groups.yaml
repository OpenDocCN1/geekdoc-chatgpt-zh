    # 6.4 小结


    利用机械球磨成功制备了名义配比为 Fe3O4 + NiO + ZnO 的纳米晶 NiZn 铁氧体软磁材料，样品具有很好的单相结构，对 100 h 球磨'
  - '[PAGE 142]


    时间而言，所形成材料的典型晶粒尺度为 10～50 nm。结合纯 Fe3O4 球磨样品，初步估算其样品的合成效率大约为 27%～44%，远大于采用 Fe2O3
    为原料 20% 合成率的相关实验结果，这一点可利用两步合成及中间纳米颗粒的高活性给予理解。本实验进一步证明，除了传统的机械合金化制备纳米晶软磁合金材料以外，利用高能球磨制备复合纳米晶
    NiZn 铁氧体也是一种有效可行的新方法。'
