    10 000 Oe(或 10 000 · 10³(4π)⁻¹Am⁻¹)。


    ## 2.3 溶胶特性对制备过程的影响与动力学参数计算


    ### 2.3.1 溶胶 pH 值对凝胶性质的影响


    图 2.2 是用分光光度计测得的溶胶不同 pH 值时的可见光吸收光谱，表 2.2 是不同 pH 值时的吸收峰波长。由测量数据可知，溶胶的吸收光谱随溶胶的 pH
    值会发生变化。在 pH 值 6.1 之前，其吸收光谱峰值与加乙二胺前相比都移向短波方向，吸收峰强度随 pH 值增加逐渐降低。虽然吸收峰波长从 559.8 nm
    增加到 569.1 nm，但都没有超过加乙二胺前的吸收波长 606.2 nm。然而 pH 值从 6.1→6.7，吸收峰波长一下子从 569.1→757.7。此结果说明，溶液中金属离子的配位基团在加乙二胺的过程中发生了变化，由弱配位转变为强配位，产生“紫移效应”。随着
    pH 值接近 7，溶液中金属离子的配位又从强配位转为弱配位。在凝胶中加入乙二胺，其作用为：


    表 2.2 不同 pH 值时的吸收峰波长


    | 添加后 pH 值 | 3 | 4 | 5 | 6.1 | 6.7 | 未加乙二胺前 |

    |---|---|---|---|---|---|---|

    | 吸收峰波长 nm | 559.8 | 561.3 | 564.5 | 569.1 | 757.7 | 606.2 |


    - (1) 因乙二胺可与硝酸作用形成二硝酸化乙二胺，可避免碱土金属离子以结晶态硝酸盐的形式析出，破坏凝胶的均匀性。


    - (2) 乙二胺为一强双齿(bidentate)螯合试剂，可与各种金属原子形成很稳定的螯合物(chelate)，在本实验制备方法过程中担任促进交联(crosslinking)的角色，即将各金属的柠檬酸盐紧密地结合在一起。“紫移效应”即是由此造成的。


    Yue [113]等人作过溶胶酸碱性对凝胶形态的有趣的研究。图 2.3 是他们用氨水调节不同 pH 值时干凝胶在 135℃干燥后拍摄的 SEM 照片。照片显示，在
    pH 值为 2、3 时空洞很少；pH 值为 4、5 时，看上去有离子基团团聚；在 pH 值为 6、7 时，凝胶构成空间花纹，可见有大量较大的空洞。事实上，这些凝胶空洞在凝胶自燃中会成为空气流通通道，起较大的助燃作用。正如我们下面分析将看到的那样，凝胶的自燃可以不靠外面的氧气，它可以利用凝胶自身的
    NO₃⁻ 基团作氧化剂，用羧基团作还原剂，自进行氧化还原反应。


