    能符合以上要求的粉料，则被认为是理想粉料。事实上用传统工艺，这些条件难以同时满足。譬如，粉料过细易团聚。要得到所需要的相，常需要煅烧，结果使晶粒长大，分布不均匀等等，因此需改进铁氧体原料制备，主要是改进化学制粉的方法。


