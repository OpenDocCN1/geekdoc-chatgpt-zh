    定的烧结温度下，Ca²⁺ 掺杂对晶粒生长有促进作用。从图 3.3(b)和图 3.3(c)可以看到，Ca²⁺ 掺杂还有促进材料收缩的作用。在图中其显微结构显示还有相当多的孔隙、孔洞，有的孔隙已经相互贯通，成为条状孔隙，正在收缩；颗粒生长，晶界的扩大带动气孔的运动；其结果，小气孔收缩，大气孔长大；由于
    Ca²⁺ 掺杂不能进入晶格，在边界的 Ca²⁺ 离子阻碍了晶界的快速移动，使气孔有足够的时间相互贯通，然后慢慢排除。图 3.3(a)显微结构中条状孔隙已经消失。


    # (c) 不同掺 Ca²⁺ 量样品在 1 200℃烧结的显微结构


    图 3.4 为不同掺 Ca²⁺ 量纳米晶坯体在 1 200℃烧结的显微结构照片。掺钙量不同对显微结构的影响在这一烧结温度表现得最明显。从图中可以看出，Ca²⁺
    掺杂 0.1% 的时候，晶粒大约为 1.5 μm 左右(图 3.4(d))；Ca²⁺ 掺杂 1.2 % 的时候晶粒已经长大为 15 μm 左右(图 3.4(a))；在
    Ca²⁺ 掺杂 0.8% 的时候，才出现形状不规则的二次再结晶。掺杂 0.1% 的时候，因掺杂量少，效果如同 1 100℃烧结、掺杂量多的情况(如图 3.4(d)、图
    3.3(c)所示)；掺杂量适当时(如图 3.4(c)所示)，其显微结构均匀，孔隙也较少，晶粒大少大约为 5 μm 左右。对比未掺杂的情况(图 3.1(d))，其二次再结晶只在掺杂量较多的时候出现，在掺杂
    0.4% 以下，显微结构都比较均匀。条状孔隙在 0.4% 掺杂量以上都已不见了。因此我们认为，适当的钙掺杂能促进材料收缩，能提高材料密度。钙在其中起阻碍晶粒疯长和填隙的作用。


    实验结果表明，Ca²⁺ 掺杂的样品，晶粒都比相同温度下没有掺 Ca²⁺ 的要大，Ca²⁺ 掺杂有促进晶粒均匀生长的作用。从烧结理论来看，Ca²⁺ 的熔点很高，在低温烧结过程中很难熔解形成固熔体，而是填充在晶粒之间的空隙中，因为填隙的作用，减少了气孔；因为高活性，促进了物质传递、扩散，使晶粒长大；因为离子半径大，不能进入晶格，使其处于晶粒边界起钉扎作用，使晶粒生长较均匀；另一方面，实验证明
    Ca²⁺ 掺杂还可以促进材料收缩，帮助气孔排除。'
