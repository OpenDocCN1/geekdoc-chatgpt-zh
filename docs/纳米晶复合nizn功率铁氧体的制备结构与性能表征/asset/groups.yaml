    \ NiZn 铁氧体的物理机制。\n\n第三、四章提出了纳米晶再次复合的方法，即把纳米晶铁氧体直接造粒、成型和烧结制备成多晶铁氧体的方法，研究了溶胶过程中掺杂制成掺杂纳米晶铁氧体，然后再通过造粒、成型和烧结制备成多晶\
    \ NiZn 铁氧体工艺；研究了不同掺杂种类、不同掺杂量和不同烧结温度的纳米晶复合 NiZn 铁氧体的显微结构；用球体模型解释了纳米晶复合 NiZn 铁氧体的烧结机理；重点考察了烧结温度、掺杂种类和浓度对纳米晶复合\
    \ NiZn 铁氧体显微结构影响，探讨了显微结构与高频损耗与磁性能关系。\n\n第五章研究了纳米—微米复合烧结 NiZn 铁氧体的工艺，研究了这种复合材料低温烧结后的高频损耗和磁谱特性，为未来利用可控制备纳米晶颗粒尺寸方法，设计和制备不同种类纳米晶、微米晶复合材料，制备特殊结构功能材料和复合结构材料奠定了基础。\n\
    \n第六章给出了一种利用高能球磨法制备纳米晶 NiZn 铁氧体的新方法，研究了用高能球磨合成纳米晶 NiZn 铁氧体的过程，对高能球磨合成纳米晶效率进行了评估，证明高能球磨亦不失为一种制备\
