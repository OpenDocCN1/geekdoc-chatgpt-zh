    本文是在张金仓教授的悉心指导下完成的。张老师正直谦虚的生活态度、严谨求实的治学方法、锲而不舍的追求精神以及对待工作的认真负责和创新精神，每时每刻都深深地影响着我，鞭策我不断地进步，使我终身受益，我的每一点进步都凝聚着导师为我付出的心血。在此向张老师表示最衷心的感谢！


    感谢曹世勋教授对我研究工作的热情帮助和指导，是他的鼓励和不断的支持，使我的实验工作得以顺利地完成。特别感谢他在论文工作中给予的建议、帮助和有益的讨论！


    感谢敬超副教授，外语学院戴晓虎副教授，曹桂新博士、刘永生博士等同事和同学在论文工作中的帮助和有益的讨论与交流。


    感谢我的父母与家人的理解与支持，使我能够全身心地投入学习和进行科研，顺利完成学业。特别感谢我的妻子高沪霞，在我最困难的时候，是她给了我永不言败、锐意进取的勇气和力量！有她为伴是我一生最大的幸福！


    本论文工作得到上海市科学技术委员会纳米科技专项“纳米晶复合 NiZn 功率铁氧体材料与器件（0152nm027）”重大攻关项目和“Fe - 基纳米晶复合软磁材料及粘结磁芯关键技术研究（0352nm036）”项目的资助，一并表示感谢！


