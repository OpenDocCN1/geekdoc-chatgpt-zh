    M(OR)z,z 在这里是金属 M 的化合价，R 是一个烷基。醇盐的制备方法包括金属与醇的直接反应，如制备乙醇钠 NaOC2H5、碱金属醇盐与金属卤化物反应制备
    Ti(OC2O5)4 等[31]。醇盐在醇溶液中的水解反应可用一般反应式表达为


    M(OR)_z + zH_2O ——> M(OH)_z + zROH (1.1)


    M(OR)_z 分子是不稳定的，要经历凝聚和聚合反应，形成胶体。这些聚合过程可形成氧化物颗粒


    M(OR)_z ——> MO_{z/2} + z/2H_2O (1.2)


    事实上水解反应很复杂，受水含量、pH 值、温度等很多因素影响。在低的 pH 值下，水解产生凝胶，在煅烧后得到氧化物；而在高的 pH 值条件下，可从溶液直接水解成核，得到氧化物粉体[32-40]。该溶胶凝胶工艺具有胶体溶胶凝胶工艺的优点，但是由于它是在分子尺度而非胶体尺度上达到各组分的混合，因而其化学均匀性更好。由于这种工艺的特点，金属醇盐的溶胶凝胶工艺已经广泛地用于制备纳米氧化物粉体[41-45]。


    Pehini 法是由作者命名的方法[46]。这种方法使金属离子与 α 羟基羧酸和乙醇酸之间形成多元螯合物，然后在加热过程中与有多功能基团的醇发生聚酯化反应，然后得到凝胶，最后生成纳米氧化物粉体。Pechini
    法的优点是能够制备成分复杂的粉体，并且在溶液中通过分子尺度上的混合保证了均匀性，能够控制化学计量比，采用较低'
  - '[PAGE 29]


    的煅烧温度就能得到纳米氧化物粉体[47-50]。


    但是由于金属醇盐法原料昂贵，操作复杂，而且许多小于 4 价的金属醇盐都不溶或微溶于有机溶剂，因此在制备铁氧体磁性材料方面受到很大的限制。于是人们将金属离子形成络合物，通过络合物型溶胶—凝胶过程形成凝胶。于是形成柠檬酸盐凝胶法（Marcilly
    等[51]1970），柠檬酸盐凝胶法的特点是取难溶金属的硝酸盐溶液，把柠檬酸作络合剂与金属离子反应生成可溶性络合物，而不产生金属氢氧化物沉淀，后经缓慢蒸发溶剂而得到凝胶，再经热分解得到纳米粉体。在化学均匀性和组分控制方面，它与
    Pechini 法具有相同的优点。由于该法可使用廉价的无机盐作原料，而且工艺简单，容易去掉硝酸根离子并得到高纯度的纳米氧化物粒子，克服了醇盐法的缺点，因而颇受重视[52-54]。还有报道采用单元羧酸和有机胺作为络合剂，用聚丙烯酸替代柠檬酸。使用聚丙烯酸的潜在优势是它的官能度，当分子量为
    2 000 时，活性位的数目有 28 个；而柠檬酸只有 4 个：高官能度有助于形成交联的聚合物。


    图 1.4 就是一种络合凝胶分子的可能结构[55]。在此结构中，金属离子被均匀地分布在网络结构中。


    ![](img/24a9da1d7c3b484411cd4981170528f1_29_0.png)


    # 图 1.4 一种凝胶分子的可能结构


    与其类似的硝酸盐柠檬酸溶胶凝胶法则是全部使用金属硝酸盐（不是部分难溶金属）和柠檬酸按一定比例混合，然后用氨水或乙二胺调节 pH 值到 6～7，脱水加温低温烧结，即可直接得纳米晶氧化物[56-60]。'
  - '[PAGE 30]


    溶剂热法——反应是在高温高压下在溶剂（水、苯等）中进行化学反应的总称。其中水热法是指在高温（573K）、高压（100 MPa）下一些氢氧化物在水中的溶解度大于对应的氧化物在水中的溶解度，于是氢氧化物溶入水中同时析出氧化物。如果氧化物在高温高压下的溶解度大于相对应的氢氧化物，则无法通过水热法来合成。水热法并非新技术，Morey
    1953 年就描述了用水热法合成矿物的例子[61]。近年来引起人们对水热法制备纳米粉末的兴趣原因是水热法可以在低温直接制备氧化物粉体，而不必像溶胶凝胶法那样还要煅烧，但需要加热、加压[62-66]。避免了一般液相合成方法需要通过煅烧转化成氧化物这一步骤，从而极大地降低和避免了硬团聚的形成。由水热物理化学理论得知，在这种方法中除发生化学反应外，还涉及相平衡、溶解度与温度、加热反应热力学等问题。在一般情况下，化合物在水中的溶解度都很小，所以，常在体系中加入低熔点的盐或酸、碱等添加剂。由于水溶液在水热条件下的粘度较常温常压下低
    2 个数量级，所以这种体系有利于扩散，故而反应速度较快[67-68]。关于水热法成核原理，目前比较合理的解说是负离子配位体生长基元模型。该模型认为：溶解到溶液中的离子、分子或离子团之间发生反应，形成具有几何构型的聚合体，即生长基元。生长基元的大小和结构与水热反应条件有关。在一个水热反应体系里，同时存在多种形式的生长基元，它们之间存在着动态平衡。哪一种生长基元越稳定，它在体系中出现的几率也就越大。从结晶学的观点看，生长基元的正离子是与满足一定配位数的负离子相结合的，故又称为负离子配位生长基元模型。近年来水热法制备纳米级粉体的技术已相当成熟，设备也有了改善，但就是生产成本略高了一些。在常温高压下的强制水解法也可以制备氧化物和非氧化物粉体[69-71]，但工艺较难控制。


    更一般的液相反应是发生在非水溶剂中的反应，这种非水溶剂可以是惰性的或本身就是反应物之一。如氮化铝粉制备[72]，采用液相复分解法制备过渡金属二硫族化合物[73]，制备金属二硼化物等'
  - '[PAGE 31]


    等[73-77]。在液相制备纳米粉末的方法中存在的最大问题是颗粒的团聚。团聚可以出现在溶液配置阶段，固一液分解的脱水干燥阶段和粉末前驱体煅烧阶段。有的团聚过程是不可逆的，团聚体一旦生成就很难彻底分离开；又如溶剂法，从溶液中生长出固相微粒后，需要把溶液从微粒粉料中排除掉。随着最后一部分溶液的排除，在表面张力作用下，固相颗粒之间不断靠近，并最后团聚在一起。如果溶液是水，最终残留在颗粒间的微量水，通过氢键会将颗粒与颗粒粘在一起。如果是盐类溶液，其中含有的微量盐类杂质（如氯化钠、氢氧化物等）则会形成“盐桥”，更会把颗粒相互粘连牢固。这种团聚过程是不可逆的，团聚体一旦生成就很难彻底分离开；等等。围绕着团聚机理以及解决团聚问题已进行了许多研究工作，但是仍然有许多问题没有得到解决。


    气相反应法——利用气相之间的反应制备氧化物和非氧化物，根据不同的加热技术如激光[78-79]、气体等离子体[80-81]和火焰传输[82-83]等分成不同的方法，实际都是气相反应法。是直接利用气体或者通过各种手段将物质变成气体，使之在气体状态下发生物理变化或化学反应，最后在冷却过程中凝聚长大形成纳米微粒。在保护气体环境下快速冷凝，从而制备各类纳米颗粒的方法也称化学气相沉积法(Chemical
    Vapor Deposition，简称 CVD)。由于 CVD 方法其产物形态不易控制，且易团聚，1994 年 Chang 等人[84-86]提出一种新型纳米微粒合成技术——化学气相凝聚法，简称
    CVC 法。其方法是利用高纯惰性气体为载体，携带金属有机前驱物，在高温(1 100～1 400 ℃)低压(100～1 000 Pa)状态，使原料热解成团簇，进而在液氮衬底上凝聚成纳米粒子。此法生成效率高，粒经分布窄。


    自蔓延高温合成法——是近三十年来发展起来的制备材料的新方法[87-88]。自蔓延高温合成其最大特点是利用反应物内部的化学能来合成材料。一经点燃，燃烧反应即可自我维持，一般不再需要补充能量。整个工艺过程极为简单，能耗低、生产率高、产品纯度高。同时，由于燃烧过程中高的温度梯度及快的冷却速率，易于获得亚稳物'
  - '[PAGE 32]


    相。以 NiZn 铁氧体为例，原料混合物包括铁粉、Fe₂O₃ 粉末、ZnO 粉末、NiO 粉末。前处理包括干燥、破碎、分级、混配、挤压。燃烧合成是用电热装置、气体加压设备和热真空室，以钨丝线圈通电或电火花点火等方法局部点燃引燃剂（点火温度
    1 500～3 000℃连续可调），依靠其反应产生的热量引燃反应物粉体。后处理包括破碎、研磨、分级。目前，已用自蔓延高温合成方法合成出性能优良的 Mn -
    Zn、NiZn、Mg - Mn 及 Ba、Sr 等铁氧体粉末。自蔓延高温合成铁氧体生产效率高，节约大量能源，是非常有前途的工业化生产方法。


    高能球磨法——机械化学合成法是近年来发展起来的，通过高能球磨的作用使不同金属元素相互作用形成纳米化合物的新方法[89]。它是利用球磨机的转动或振动，使磨球对原料进行强烈地撞击、研磨和搅拌，把粉末粉碎为纳米级微粒的方法。它可以使材料远离平衡状态，从而获得其他技术难以获得的特殊组织、结构，扩大了材料的性能范围，且材料的组织、结构可控。高能球磨过程是一个颗粒循环剪切变形的过程。在此过程中，晶格缺陷不断在大晶粒的颗粒内部大量产生，从而导致颗粒中大角度晶界的重新组合，使颗粒内晶粒尺寸下降到纳米数量级。在单组元的系统中，纳米晶的形成仅仅是在机械驱动下的结构演变，晶粒粒度随球磨时间的延长而下降，应变随球磨时间的增加而不断增大。在球磨过程中，由于样品反复形变，局部应变带中缺陷密度达到临界值时，晶粒开始破碎，这个过程不断反复，晶粒不断细化直到形成纳米结构。单一组分的球磨一般是金属间化合物的机械研磨，在球磨中无组分的传输，原料的化学成分不变。在多组元的球磨中，复合粉组织结构会发生不断地细化并发生扩散和固相反应，从而可以形成合金粉。对氧化物多组元材料也会有类似的反应。因该方法是一个无外部热能供给的干式高能球磨过程，是利用金属或金属氧化物粉末在球磨过程中与其他金属或金属氧化物之间的化学反应或固相反应制备出所需材料的技术，又称为机械合金化或机械化学法[90-95]，已成为制备纳米材料的一个重要方法。然而这种方法还是存在表面和界面污染问题，即磨球污染和气'
  - '[PAGE 33]


    氖污染。还有粉末颗粒团聚，细粉毛细渗漏等问题。但由于高能球磨法能制备出用常规方法难以获得的高熔点的金属或合金纳米材料等优点，近年来已成为制备纳米材料的重要方法之一，被广泛用于合金、磁性材料、金属间化合物、过饱和固溶体以及非晶、准晶、纳米晶等材料的制备。


    其他的一些方法还有：乳胶法是通过除水技术及使用有机胶类和气态胶，使由水溶胶获得的油包水乳胶凝胶化，已被用于制备复杂组分的纳米陶瓷粉末[96-101]。冷冻干燥法是通过将溶液冷冻束缚住离子，再将水分升华除去的过程来获得化学成分均匀的粉体[102-107]，而喷雾干燥是将液体料通过再干热气氛中雾化转化为干燥粉体的一项普遍采用的工业技术[108-111]。


    总而言之，上面提到的各种纳米粉体制备方法都可用于制备纳米晶铁氧体粉体，但是都存在一些不足和缺点。例如，化学共沉淀法制备的粉体需要大量的水洗，然后干燥，高温后处理；金属醇盐溶胶凝胶法对有的铁氧体类型缺乏制备该类型铁氧体的金属醇盐而且成本高；柠檬酸铁存在溶解困难的问题；大多数溶剂热法需要高温、高压设备；气相反应法不易直接生成铁氧体纳米粒子；高温自蔓延合成法还需要破碎、研磨、分级后处理；高能球磨法合成也存在颗粒分布不均匀、易受工艺污染的问题，等等。因此我们在分析了各种纳米粉体制备优缺点后，提出了凝胶自燃直接制备纳米晶
    NiZn 铁氧体的方法，即用先用硝酸盐柠檬酸溶胶凝胶法制备凝胶，通过直接引燃凝胶或低温煅烧凝胶，直接合成 NiZn 纳米晶铁氧体。实践证明这时一种行之有效的、实用、经济的制备纳米晶
    NiZn 铁氧体的方法。


    # 1.4 课题的提出


    我们知道，烧结 NiZn 铁氧体磁性材料，作为一种多元复合金属氧化物陶瓷烧结体，在磁电子学应用领域起着重要作用，通常被用于高频领域。然而，对这种传统材料来说，NiZn
    材料的频率损耗问题一'
  - '[PAGE 34]


    直是该材料研究中的主题，即解决如何在特定的工作频率下进一步降低损耗的问题，并如何提高高频情况下的频宽问题。特别是，在现今电子和信息产业对产品的小型化、集成化和模块化要求日益增高的情况下，除了对材料的高磁导率、高饱和磁感应强度、高截止频率和频宽上的要求外，在材料制备工艺和器件组合组装方面还提出了低温烧结的新要求。因此若能开发出磁导率较高，频率特性较好，饱和磁感应强度在原来基础上有较大提高的
    NiZn 铁氧体材料，这对提高功率电感的输出功率，降低成本有很大的益处。


    本论文以高导、高频、低损耗 NiZn 铁氧体在电子和信息领域应用为着眼点，注重材料制备的新方法、新工艺研究，以纳米晶铁氧体制备技术为手段，创造性地提出用铁氧体纳米晶为原料，烧结复合多晶铁氧体材料的工艺，深入开展了对纳米晶复合
    NiZn 铁氧体材料的制备、显微结构、烧结工艺和磁性能等关系的研究。


    本论文的主要工作可概括为以下几个方面：


    +   (1) 研究纳米晶铁氧体制备方法，研究凝胶自燃法合成纳米晶 NiZn 铁氧体的机理，纳米晶 NiZn 铁氧体的结构与磁性。

    +   (2) 研究纳米晶复合 NiZn 铁氧体烧结温度与显微结构的关系，纳米晶复合 NiZn 铁氧体的烧结机理，纳米晶复合 NiZn 铁氧体的频谱特性和损耗等特性。

    +   (3) 探索纳米—微米晶复合 NiZn 铁氧体工艺，Bi 掺杂低温烧结复合材料的损耗和频谱特性，研究不同掺杂方法，降低烧结温度对材料性能的影响。

    +   (4) 研究 Fe3O4 + NiO + ZnO 体系高能球磨合成纳米晶 NiZn 铁氧体的结构和磁性能。'
  - '[PAGE 35]


    # 第二章 凝胶自燃法制备纳米晶 NiZn 铁氧体的结构与磁性


    # 2.1 引言


    铁氧体磁性材料的制备工艺与陶瓷制备工艺相仿，通常称铁氧体磁性材料为黑色陶瓷。在铁氧体磁性材料生产领域，铁氧体磁性材料制备中原料的来源和质量的重要性不言而喻。为了改善原料的活性，传统工艺采用了深度球磨的方法，这难免在长期球磨中引进杂质，影响了材料的性能。传统的铁氧体磁性材料制备工艺包含四个主要工艺步骤：制粉、预烧、成型、烧结，而且通常在预烧前后分别各有一次球磨粉碎过程。球磨工艺是带来外来影响因素的主要工艺环节。因此要获得性能优良的铁氧体制备粉料，必须采用新的方法，对铁氧体粉体制备工艺进行改革。


    如第一章所述，化学制粉方法各种各样，有的可以直接制备出纳米晶铁氧体粉体；有的只能先制备出氧化物粉体，然后需要高温煅烧、粉碎；有的从溶液中生长出固相微粒后，需要把溶液从微粒粉料中排除掉，随着最后一部分溶液的排除，最终残留在颗粒间的微量水，通过氢键会将颗粒与颗粒粘在一起；有的需要专门复杂的高温、高压设备，生产成本较高；有的需要复杂的工艺控制等等。鉴于高性能铁氧体磁性材料对其制备原料粉体的严格要求，通过仔细挑选比较，我们认为：硝酸盐柠檬酸溶胶凝胶+自燃法（简称凝胶自燃法）是能够满足高性能铁氧体磁性材料制备对粉体要求的工艺方法。因为它原料容易获得，各种金属几乎没有硝酸不能溶解的，而且通过凝胶'
  - '[PAGE 36]


    自燃在很低的温度就可以直接获得颗粒大小均匀、不团聚、尺寸可以控制的纳米晶优质粉体。


    在本章中，主要研究凝胶自燃法制备 NiZn 铁氧体纳米晶的工艺，即研究工艺参数对溶胶凝胶形成的影响，研究气氛对合成纳米晶 NiZn 铁氧体的影响，研究凝胶自燃法合成纳米晶
    NiZn 铁氧体的反应过程及机制，以及纳米晶 NiZn 铁氧体的结构与磁性表征。


    # 2.2 样品制备与实验方法


    # 2.2.1 原料


    主要原料采用化学纯硝酸盐，基本成分如表 2.1 所列。


    | | 分子式 | 分子量/(g/mol) | 纯度/% |

    |---|---|---|---|

    | 硝酸铁 | Fe(NO₃)₃ · 9H₂O | 404.00 | 98 |

