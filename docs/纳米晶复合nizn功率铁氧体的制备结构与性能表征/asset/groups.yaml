    在其对应的 DTG 曲线上，87.5～170℃间有一个缓慢变化的平坦峰，并于 170℃后发生激烈变化，相应于反应物质急速分解部分形成一个及其尖锐的峰，其起始温度
    195℃，峰温 197℃，结束温度 202.5℃。


    约 202℃开始，在氮气中热反应的样品 TG 曲线会出现一个小的增重峰，峰值位于约 203.6℃，这个峰在空气中分解是没有的。这或许是反应物质的氧化反应。随后是两个缓慢的失重，一直到
