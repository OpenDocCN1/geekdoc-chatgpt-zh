    图 3.3 为不同掺 Ca²⁺ 量样品在 1100℃ 烧结后的显微结构照片。从图可以看出，晶粒较 1000°C 明显长大，而且随 Ca²⁺ 掺杂量的增加，晶粒尺寸也增加。Ca²⁺
