    ## 4.4 掺杂纳米晶 NiZn 铁氧体的磁性能


    一般说来，可以把材料的磁参数划分为结构不敏感量和结构敏感量。属于结构不敏感的磁参数有饱和磁化强度 Ms、磁致伸缩系数 λs、居里温度 θc 以及磁各向异性常数
    K 等，它们只和原子结构、材料组分、相结构和组成相的数量有关，而与组成相的晶粒大小、分布情况无关。属于结构敏感的磁参数有矫顽力 Hc、磁导率 μ、磁感应强度
    B 等，它们都与组成相的晶粒大小、分布情况有密切关系。因此样品饱和磁化强度随烧结温度的变化，只能归于材料密度的变化或由于杂质的作用，改变离子占位倾向从而改变材料的饱和磁化强度。


    根据烧结理论[153]，在烧结的中期，开始气孔仍然是处于连通的状态，气孔的形状是多种多样的。随着烧结的进行，坯体的体积显著收缩，密度逐渐增大。当铁氧体密度达到理论值的
    60%左右时，晶粒开始长大。此时坯体中仍有许多细气孔，密度变化在较大的范围内随烧结时间增加而减慢，且成对数关系。当铁氧体坯体密度大约为理论密度的 95%时，气孔全部变成封闭式的。在烧结的末期，可能发生不连续的晶体生长。当有异常晶粒生长时，大量气孔被卷入晶粒内部，并且气孔与晶粒边界隔绝，因而坯体不能有更多的收缩。


    具体对 NiZn 铁氧体而言，烧结时还容易出现锌的挥发而使样品的烧结密度与烧结工艺有更密切的关系。图 4.14 为没有掺杂时样品在不同烧结温度下的饱和磁化强度与烧结温度关系。可见在
    1000°C以下，样品的饱和磁化强度随烧结温度上升几乎线性上升。可以推测在这一阶段材料随着晶粒长大，材料密度也不断增加。在 1000°C以上，饱和磁化强度有所下降，暗示晶粒发生不连续生长，聚合再结晶，大量气孔被卷入晶粒内部，形成多相结构，故饱和磁化强度有所下降。随着烧结的继续进行，显微结构得到调整，材料收缩完成，饱和磁化强度又开始上升。这种结构的变化在掺杂烧结时也会出现，而且由于掺杂离子进入晶体或留于晶界，使情况变得更复杂。


    ![](img/24a9da1d7c3b484411cd4981170528f1_106_0.png)


    图 4.14 未掺杂样品在不同烧结温度下饱和磁化强度与烧结温度的关系


    掺钴样品的饱和磁化强度与烧结温度的关系见图 4.15。可见各种掺钴量的样品，其饱和磁化强度都随烧结温度的上升有所上升。其中掺杂量较多的样品在 1200°C以上烧结后，饱和磁化强度都有所下降。这是因为在较低的温度下烧结时，钴掺杂可以起助熔剂的作用，增进密度，但又不促进晶粒长大。过了
    1200°C以后，过多的钴掺杂也使局部晶粒发生不连续生长，聚合再结晶，大量气孔被卷入晶粒内部，形成多相结构，使材料密度下降，导致饱和磁化强度下降。但在较少量钴掺杂的情况下，材料密度随烧结温度逐渐上升，到
    1300℃ 时，材料饱和磁化强度达到最大。


    ![](img/24a9da1d7c3b484411cd4981170528f1_107_0.png)


    图 4.15 不同掺钴样品饱和磁化强度与烧结温度的关系


    掺钙样品的饱和磁化强度与烧结温度的关系见图 4.16 所示。可见各种掺钙量的样品，其饱和磁化强度都随烧结温度的上升有所上升。而且样品最大饱和磁化强度出现的温度比掺钴情况提前到
    1100℃。掺杂量较低样品的饱和磁化强度较高，但过了 1100℃ 以后，饱和磁化强度都开始下降。这表明，低烧结温度时，掺杂钙可以起助熔剂的作用，促进晶粒长大，但过了
    1100℃ 以后，晶粒开始二次再结晶，因材料密度下降，使饱和磁化强度下降。


    掺铜样品的饱和磁化强度与烧结温度的关系见图 4.17。在 1100℃烧结温度时，各种掺杂量样品的饱和磁化强度都已经较高，明显高于掺钴和掺钙的情况。饱和磁化强度随烧结温度上升都先下降后上升呈
    V 字形。而掺杂 1.2 wt% 的样品随烧结温度上升下降较快，主要原因可能是较多的铜离子添加，起了助溶剂的作用，使晶粒生长较快，较快的晶粒生长使结构中的空气来不及脱出，反而使材料密度下降。但是铜掺杂还是促进了材料的密度提高，最终都使材料饱和磁化强度上升。


    ![](img/24a9da1d7c3b484411cd4981170528f1_108_0.png)


    图 4.16 不同掺钙样品饱和磁化强度与烧结温度的关系


    ![](img/24a9da1d7c3b484411cd4981170528f1_108_1.png)


    图 4.17 不同掺铜样品饱和磁化强度与烧结温度的关系


    综合上面掺杂 NiZn 铁氧体样品磁性和损耗测试的结果，可以看到：


    - 1. 用硝酸盐—柠檬酸溶胶凝胶法先制成掺杂凝胶，加热凝胶使其脱水，在自燃或引燃过程中直接复合所需掺杂纳米晶铁氧体磁性材料粉体，然后使用这种粉体直接进行造粒、成型、烧结成所需要的产品，这种新工艺在我们实验中证明是非常有效的。其最大的优点：（1）是因大多数金属都有其硝酸盐形式，原料容易获得；掺杂在化学计量的溶胶阶段进行，分散均匀；省略了两个球磨过程，缩短生产周期，降低能耗，有利于工业化生产。（2）由于省却了传统球磨工艺，用这种新工艺，其配方化学计量精确，控制容易，重复性好，移植性好，特别是对需要微量添加杂质的高性能铁氧体磁性材料工艺制备操作，能有非常准确的控制。（3）由于用于成烧的原材料采用纳米晶铁氧体磁性粉末(20～60
    nm)压制而成的，其烧结活性高，烧结温度明显低于传统工艺，烧结时间大大缩短；而且可以通过调节不同的烧结温度、烧结时间、烧结气氛控制晶粒大小、材料密度，从而达到所需要的均匀的微观结构，获得具有所要求电磁性能的多晶体材料。


    - 2. 掺杂的纳米晶烧结铁氧体都表现出能在较低的温度下再结晶的现象，这种现象随掺杂种类和数量的不同而显示出不同的显微结构，并对宏观磁性能产生不同的影响。


    钴离子的添加能抑制晶粒的生长，并能提高材料的截至频率。较小掺杂量(0.1 wt%，0.4 wt%)对降低相对损耗有利，较高掺杂量(0.8 wt%，1.2 wt%)虽然能使相对损耗低谷移向高频，但对降低相对损耗不利。


    在 1100°C 以上，掺钙对磁导率的提高是很明显的，最佳的掺钙量是 0.4 wt%。其磁导率要比同样组分掺钴材料大近一倍，其截至频率都在 10 MHz 左右。而且
    1100°C 以上的相对损耗都比较低(见图 4.9)。在 1100°C 烧结，掺钙量是 0.4 wt%的样品，其相对损耗在 300 kHz～8 MHz 都处于较低的水平。然而随烧结温度的提高，样品的损耗增加，截止频率变小；1300°C
    烧结的样品，其损耗在 1 MHz 就开始很快增加。


    掺铜样品显微结构与烧结温度的关系揭示，铜离子的添加使样品在较低的烧结温度晶粒就开始长大、材料收缩、密度增大，这与铜的低熔点使其液相促进烧结反应有关。低烧结温度时，随掺铜含量增加，磁导率增加非常明显，样品的相对损耗相应降低；高烧结温度时，磁导率随掺杂变化不太明显，而且总的样品磁导率不高，样品的相对损耗随铜含量的增加也相应增加(图
    4.12)。掺铜样品与掺钴和掺钙样品相比，其 Q 值明显低很多。


    - 3. 样品的饱和磁化强度随烧结温度上升几乎线性上升，可以推测在这一阶段材料的晶粒长大材料密度也线性上升。在 1000°C 以上，饱和磁化强度有所下降，暗示晶粒发生不连续生长，聚合再结晶，大量气孔被卷入晶粒内部，形成多相结构，故饱和磁化强度有所下降。随着烧结的继续进行，显微结构得到调整，材料收缩完成，饱和磁化强度又开始上升。这种结构的变化在掺杂烧结时也会出现，而且由于掺杂离子进入晶体使情况变得更复杂。其实验结果是：(1)
    掺钴量较多的样品在 1200°C 以上烧结后，饱和磁化强度都有所下降。(2) 掺钙量较低样品的饱和磁化强度较高，而且样品最大饱和磁化强度出现的温度比掺钴情况提前到
    1100°C，过了 1100°C 以后，饱和磁化强度都开始下降。(3) 在 1100°C 烧结温度时，各种掺铜量样品的饱和和磁化强度都已经较高，明显高于掺钴和掺钙的情况。饱和磁化强度随烧结温度上升都先下降后上升呈
    V 字形。有可能掺铜样品可在更低的烧结温度得到同样高的饱和磁化强度。


    - 4. 掺杂铋离子可以降低材料的烧结温度。适当配比可以使 NiCuZn 铁氧体在低于 940°C 温度下烧结，这对于制备与银导线共烧、线芯合一器件有着重要的意义。高性能的铁氧体磁性材料可以通过我们的新工艺，在严格控制配方成分(主要配比、掺杂种类和数量)，样品成型密度、烧结工艺的情况下得到。


    - 5. 在低频弱场情况(频率小于 1 MHz)，材料的磁损耗主要来源于磁滞损耗、涡流损耗和剩余损耗。总的磁损耗可以用列格公式表示。对高电阻率的铁氧体磁性材料，剩余损耗是占主要的。影响高频区（频率大于
    1 MHz）复数磁导率的主要原因是畴壁共振和自然共振。共振型畴壁共振频率正比于 \(\frac{A}{a^{r_2}}\) ，即与杂质、空隙的分布以及与近邻点电子间的交换积分常数有关。弛豫型畴壁共振频率正比于
    \(\left( \frac{\sigma_{壁} \cdot \rho}{a^2 M_s^2} \right)\) ，即除了与杂质、空隙分布以及与近邻点电子间的交换积分常数有关外，还与磁晶各向异性、电阻率及饱和磁化强度有关。对于具有确定的气孔、杂质体积的样品来说，当增加它们的弥散度（减小
    \(a''\)）时则可以提高材料的共振频率。对立方晶系材料来说，由于 Snook 定律的关系，在要求确定的 \(\mu''\) 值条件下，要提高材料的截止频率，则受到材料的饱和磁化强度
    \(M_s\) 的限制。唯一途径是控制烧结工艺，提高材料的密度并提高显微结构的均匀性。


    软磁铁氧体和其他软磁材料一样，它的损耗包括磁滞损耗、涡流损耗和剩余损耗三部分。磁滞损耗和涡流损耗与工作磁通密度 \(B_m\) 和工作频率 \(f\) 的乘积有关，当
    \(f\) 上升时，要保持损耗不迅速增加，\(B_m\) 要相应下降。涡流损耗与电阻率 \(\rho\) 成反比，但是 \(\rho\) 也随工作频率 \(f\)
    变化。在低于一定极限工作频率时，\(\rho\) 比较高；\(f\) 超过极限工作频率，\(\rho\) 急剧下降；然后 \(\rho\) 又基本上不变，但数值相当低。而剩余损耗决定于磁畴壁的运动和谐振，不能忽略。徐泽玮[154]
    在研究铁氧体在 10 MHz 以下的损耗机制时指出，\(fB_m\) 为 25 000 kHz T 条件下，\(f\) 低于 1.1 MHz 时，损耗决定于磁滞损耗并与
    \(f\) 成反比，随 \(f\) 升高而逐渐下降，在 1.1 MHz 时，达到最低点。超过 1.1 MHz 到 3 MHz，损耗决定于剩余损耗，随 \(f\)
    升高而迅速上升。在 3 MHz 以上，损耗决定于涡流损耗，但这时 \(\rho\) 已相当低，功率损耗处在较高水平上。这结果和我们测量的 H4、F6-4 的相对损耗与频率的关系实验数据基本一致。因此要降低高频损耗，除控制掺杂种类和数量外，控制材料显微结构的均匀性是非常重要的。


    - 6. 根据大量的实验，我们用 NiZn 铁氧体掺铜为主要配比，利用纳米晶复合铁氧体技术制备了高磁导率、高频率、低损耗 F 系列和 H 系列 NiZn 铁氧体材料。


