    ，即与杂质、空隙的分布以及与近邻点电子间的交换积分常数有关。弛豫型畴壁共振频率正比于 \(\left( \frac{\sigma_{壁} \cdot \rho}{a^2
    M_s^2} \right)\) ，即除了与杂质、空隙分布以及与近邻点电子间的交换积分常数有关外，还与磁晶各向异性、电阻率及饱和磁化强度有关。对于具有确定的气孔、杂质体积的样品来说，当增加它们的弥散度（减小
