    区，在颈状部分表面的过剩空位浓度为


    \(\Delta C = \frac{\gamma \delta^3}{\rho k T}C_0\) (3.4)


    式(3.4)中, \(\delta\) 为质点直径, \(C_0\) 为空位浓度。在空位浓度差推动下, 空位从颈状部表面向颗粒的其他部分扩散; 而固体质点则向颈状部逆向扩散。此时,
    颈状部表面起着提供空位源的作用, 由此迁移出去的空位最终在颗粒的其他部分消失, 这个消失空位的场所也称为空位的阱, 它实际上就是提供形成颈部的原子或离子的物质源。由浓度差
    \(\Delta C\) 可知, 在一定温度下空位浓度差是与表面张力成比例的, 因此由扩散机制进行的烧结过程, 其推动力也是表面张力。由于空位扩散既可沿颗粒表面进行,
    也可以通过颗粒内部进行, 并在颗粒表面或颗粒间界上消失, 通常为区别起见, 分别称为表面扩散、界面扩散和体积扩散。有时在晶体内部缺陷处也可能出现空位, 这时可以通过质点向缺陷处扩散,
    而该空位迁移到界面上消失, 称为缺陷扩散。


    气相传质, 即由于颗粒表面各处的曲率不同, 各处相应的蒸气压大小也不同。故质点容易从高能阶的凸处(如表面)蒸发, 然后通过气相传质到低能阶的凹处(如颈部)凝结,
    使颗粒的接触面增大, 颗粒和空隙形状改变, 导致逐步致密。这种过程称为蒸发—冷凝。


    液相传质, 即通过溶解—沉淀作用机制进行。在有液相参与的烧结中, 若液相能润湿和溶解固相, 由于小颗粒的表面能较大, 其溶解度比大颗粒的大, 即溶解度随颗粒半径减少而增大,
    故小颗粒将优先溶解, 并通过液相不断地向周围扩散, 使液相中该物质的浓度随之增加, 当达到较大颗粒的饱和浓度时, 就会在其表面沉淀析出, 从而使粒界不断推移,
    大小颗粒间的空隙逐渐被填充, 导致烧结的致密化。这种通过液相传质的机制称为溶解—沉淀作用。


    如上所述, 烧结的机制是复杂多样的, 但都以表面张力为动力。应当指出, 对于不同物质和烧结条件, 这些过程并不是并重的, 往往是某一种或几种机制起主导作用。当条件改变时,
