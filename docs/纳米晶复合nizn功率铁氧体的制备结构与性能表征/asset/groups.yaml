    从铜掺杂图中可以看出，掺铜对显微结构影响与上面掺钙和掺钴相比差别非常大。掺铜样品在较低温度就有晶粒长大和材料密实化的现象。在同一温度下，掺 Cu²⁺ 量的越多，晶粒长得越大。在
    1 100℃，掺 Cu²⁺ 1.2%时，晶粒就开始密实化，出现孤岛孔隙；而且掺铜样品的晶粒明显比掺钙样品长得大，并且其显微结构的均匀性可以通过掺杂量和烧结温度的改变而加以控制。显然其中铜离子在烧结时生成液相是烧结时较早出现晶粒长大和显微结构密实化的根本原因。


    实验结果显示，由于 Cu²⁺ 的熔点很低，在较低的烧结温度，Cu²⁺ 已经开始溶解并渗透到晶界中形成液相，从而使固相烧结变为带有液相的烧结。从电镜图中也可以看出，要获得一定的样品晶粒尺寸，只要掺杂
    Cu²⁺ 就可以使烧结温度大大降低。另一方面，Cu²⁺ 掺杂也会使晶粒过快生长，容易形成二次再结晶不均匀结构。


    另一方面，从实验结果得知：利用凝胶自燃法制备的纳米晶合成 NiZn 铁氧体，无掺杂时结构的密实化进程要比原来预计的来得迟，900℃时晶粒还相当小。这可能是因为造粒时所用的粘合剂作用，使纳米晶坯体的压制密度太差；当烧结粘合剂挥发时，高活性的纳米晶铁氧体不是处于密切接触的状态，所以不能很好地发挥其高活性作用，只能缓慢长大。1
    000~1 100℃可能是本实验纳米晶粉体的再结晶温度，此时样品开始出现收缩，晶粒开始再结晶成长。再结晶生长一旦开始，晶粒就长得很快，到 1 200~1 300℃时，晶粒已经基本上长大到一般陶瓷烧结的中后期阶段，孔隙逐渐被带出或封闭并相对地集中成为孤立的孔隙，其体积也逐渐缩小，材料密度增加。这一阶段晶粒的快速长大可以解释为用化学法制备的纳米晶粉体具有的高纯度和高活性；在烧结过程中晶粒长大，晶界移动除受到气孔和掺杂物的阻力外，很少有其他的阻力钉扎晶界的移动，因此晶粒就可以长得较快、较大。这也就是为什么用纳米晶铁氧体压制的样品可以高温烧结出的密度大，晶粒大，综合磁性能好的样品的原因。然而在烧结过程中如何减少纳米晶合成坯体中的气孔，如何控制烧结过程使坯体中气孔尽可能地被排除，是制备高性能纳米晶合成铁氧体烧结材料的关键问题。


    实验结果还清楚表明，用化学方法掺杂制作的纳米晶合成铁氧体，在烧结时都能降低坯体的再结晶温度。尤其是那些离子半径较大不能进入铁氧体晶格的纳米金属、非金属粒子，它们处于铁氧体晶粒边界形成点缺陷，可加快物质的扩散，对晶粒的生长起钉扎、助溶等作用。具体什么样的纳米晶颗粒起什么作用，要看掺杂纳米晶的种类、数量和性质而定。


    ## 3.4 纳米晶制备 NiZn 铁氧体的烧结机理


    ### 3.4.1 烧结理论


    ### 3.4.1.1 颗粒的键合作用


    多晶体在烧结过程中颗粒的键合、物质的传递是烧结机制的两个重要问题。


    粘附是固体表面的普遍性质，它起因于固体表面力。当两个表面靠近到表面力场作用范围时，即发生键合而粘附。粘附力的大小直接取决于物质的表面能和接触面积，故粉状物料间的粘附作用特别明显，纳米晶颗粒间的粘附作用则更强。例如：让两个表面均匀润湿一层水膜的球形粒子彼此接触，水膜将在水的表面张力作用下变形，使两颗粒迅速拉紧扰和聚结，见图
    3.11，在这个过程中水膜的总面积减少了 δs，系统的总表面能降低了 rδs，r 为单位面积的表面能。此时在两个颗粒间形成了一个曲率半径为 ρ 的颈状接触区。对于没有水膜的固体粒子，因固体的刚性使它不能像水膜那样迅速而明显地变形，但也会发生相似的作用。当粘附力足以使固体粒子在接触点处产生微小塑性变形时，这种变形就会导致接触面积增


    ![](img/24a9da1d7c3b484411cd4981170528f1_73_0.png)


    图 3.11 被水膜包裹的两固体球的粘附


    大，从而扩大了接触面，又会使粘附力进一步增加并获得更大的变形，如此下去将使粒子间产生粘附。因此粘附作用是烧结初始阶段，导致粉体颗粒间产生键合，并通过平移和旋转运动重排晶粒，使晶粒接触点(配位数)最大。结果晶粒接触面积将增加，同时由于配位数的增加，导致自由晶粒表面曲率的变化，由凸变至凹，还会导致晶粒表面平滑及比表面积降低[125]。


    ### 3.4.1.2 物质的传递


    在烧结中期，所有晶粒都与最近邻晶粒接触。因此晶粒整体的移动已停止，只有通过晶格或晶界扩散，把晶粒间的物质迁移至颈表面，收缩才能进行。气孔形成由颈部周围柱状通道构成的连续网络[126]，当气孔通道变窄无法稳定而分解为封闭气孔时，这一阶段将结束。


    在烧结过程中物质通过多种途径传递，各种传递具有不同的机制，但都以表面张力作为动力。又分为流动传质、扩散传质、气相传质和液相传质。


    流动传质，即在表面张力作用下通过变形、流动引起物质移动，其中又有粘性流动和塑性流动。实际晶体总是存在缺陷的，且在不同温度下，晶体中总存在一定数值的平衡空位浓度。随着温度升高，空位浓度增加，质点热振动变大，并可能发生依次向相邻的空位位置移动。由于空位是统计平均分布的，故质点的这种迁移在整体上并不会有定向的物质流产生。但若存在着某种外力场，如表面张力作用时，质点(或空位)就会优先沿该表面张力作用的方向移动，并呈现相应的物质流，其迁移量与表面张力大小成比例，在这种力的作用下，固体表面层物质产生粘性流动。如果表面张力足以使晶体产生位错，这时质点通过整排原子的运动或晶面的滑移来实现物质传递，这种过程称为塑性流动。可见塑性流动是位错运动的结果。与粘性流动不同，塑性流动只有当作用力超过固体屈服点时才能产生。


    扩散传质，即质点(或空位)借助于浓度梯度推动而迁移传递。烧结初期由于粘附作用使粒子间的接触面逐渐扩大并形成颈状接触区，在颈状部分表面的过剩空位浓度为


    \(\Delta C = \frac{\gamma \delta^3}{\rho k T}C_0\) (3.4)


    式(3.4)中，\(\delta\) 为质点直径，\(C_0\) 为空位浓度。在空位浓度差推动下，空位从颈状部表面向颗粒的其他部分扩散；而固体质点则向颈状部逆向扩散。此时，颈状部表面起着提供空位源的作用，由此迁移出去的空位最终在颗粒的其他部分消失，这个消失空位的场所也称为空位的阱，它实际上就是提供形成颈部的原子或离子的物质源。由浓度差
    \(\Delta C\) 可知，在一定温度下空位浓度差是与表面张力成比例的，因此由扩散机制进行的烧结过程，其推动力也是表面张力。由于空位扩散既可沿颗粒表面进行，也可以通过颗粒内部进行，并在颗粒表面或颗粒间界上消失，通常为区别起见，分别称为表面扩散、界面扩散和体积扩散。有时在晶体内部缺陷处也可能出现空位，这时可以通过质点向缺陷处扩散，而该空位迁移到界面上消失，称为缺陷扩散。


    气相传质，即由于颗粒表面各处的曲率不同，各处相应的蒸气压大小也不同。故质点容易从高能阶的凸处(如表面)蒸发，然后通过气相传质到低能阶的凹处(如颈部)凝结，使颗粒的接触面增大，颗粒和空隙形状改变，导致逐步致密。这种过程称为蒸发—冷凝。


    液相传质，即通过溶解—沉淀作用机制进行。在有液相参与的烧结中，若液相能润湿和溶解固相，由于小颗粒的表面能较大，其溶解度比大颗粒的大，即溶解度随颗粒半径减少而增大，故小颗粒将优先溶解，并通过液相不断地向周围扩散，使液相中该物质的浓度随之增加，当达到较大颗粒的饱和浓度时，就会在其表面沉淀析出，从而使粒界不断推移，大小颗粒间的空隙逐渐被填充，导致烧结的致密化。这种通过液相传质的机制称为溶解—沉淀作用。


    如上所述，烧结的机制是复杂多样的，但都以表面张力为动力。应当指出，对于不同物质和烧结条件，这些过程并不是并重的，往往是某一种或几种机制起主导作用。当条件改变时，可能是另一种或几种机制起主导作用。但在一定的条件下，会有某种机理占主要地位。对于晶态固体烧结，实践证明扩散机理是主要的。


    ### 3.4.1.3 晶粒的结晶成长


    再结晶和晶粒长大是与烧结并行的高温动力学过程，在烧结的全过程，特别是烧结后期，将产生很大影响。在烧成中有三个性质不同的过程影响晶粒的大小，即再结晶、晶粒长大和二次再结晶。


    ### (1) 再结晶


    从塑性变形的具有应变的基质中，产生出新的无变形晶粒成核和长大过程。此过程的主要推动力是基质塑性变形所增加的能量，贮藏于基质中的这一能量虽然不大，但却足以影响晶粒大小的变化和晶界的移动。


    有人把 NaCl 晶体在 400℃ 时受力 4 kg/mm² 变形后，再于 470℃ 时退火，结果观察到晶粒在棱角上首先形成晶核，随后晶粒长大，如图 3.12
    所示。图中开始一段 0 ~ t0 为诱导期，为不稳定的核胚长大成稳定晶核所需的时间。诱导期取决于成核速度并随退火温度的升高而迅速减小。晶粒长大时的原子迁


    ![](img/24a9da1d7c3b484411cd4981170528f1_76_0.png)


    图 3.12 在 400℃、4 kg/mm² 应力作用的 NaCl 晶体，置 400℃ 再结晶的情况


    移过程和晶粒界面上原子的扩散迁移是一样的，晶粒长大速度 u 和温度关系为 u = u0 exp(-Eu/RT)，Eu 为活化能，u0 为常量。只要各晶粒长大而不互相碰撞，其速度
    u 为恒定值，且各晶粒尺寸 d 随时间关系为 d = u(t - t0)，因此最终晶粒大小取决于晶核数目的多少，更严格地讲决定于成核和晶粒长大的相对速度。由于这二者都与温度密切相关，故总的结晶速度随温度而迅速变化。初次结晶在金属中更为重要。


    ### (2) 晶粒长大


    无论再结晶发生与否，细颗粒晶体聚集体在高温下平均晶粒尺

