    而言，饱和磁化强度 σm 为 85 (A·m²kg⁻¹)，而经 100 h 球磨后，其饱和磁化强度 σm 仅为 25 (A·m²kg⁻¹)，减少了 2/3；Fe3O4
    矫顽力 Hc，从球磨前为 209·10³(4π)⁻¹ A·m⁻¹，球磨后为 520·10³(4π)⁻¹ A·m⁻¹，为原料粉末的 2 倍多。


    ![](img/24a9da1d7c3b484411cd4981170528f1_136_0.png)


    图 6.2 Fe3O4 原料粉末和经 100 h 球磨后 VSM 磁测量的实验结果


    根据超顺磁理论[189]，如果晶粒尺寸小于超顺磁临界值 \(d_s\)，那么 \(H_c\) 就为零；如果晶粒尺寸在 \(d_s < d < d_0\)，那么颗粒就被认为是单畴（SD）。其中
    \(d_0\) 为单畴临界尺寸。因为我们实验结果显示，Fe3O4 粉末经过 100 h 球磨后矫顽力 \(H_c \neq 0\)，所以不是超顺磁颗粒。


    众所周知，材料的矫顽力由许多因素决定，如颗粒尺寸、形状、堆积密度甚至晶格缺陷等等，其主要由晶粒尺寸决定[190-191]。


    实验结果显示，通过高能球磨，样品的饱和磁化强度 \(\sigma_m\) 大大减小而矫顽力 \(H_c\) 大大增加。出现这一结果是由于 Fe3O4 粉末经过
    100 h 球磨后，其颗粒尺度大大变小，由于尺寸效应，使得材料的整体磁性变弱，饱和磁化强度 \(\sigma_m\) 大大下降，而矫顽力 \(H_c\) 增加。图
    6.3 给出 Fe3O4 粉末经过 100 h 球磨后的颗粒扫描电镜照片，颗粒直径 10 ~ 50 nm；根据前面分析，应该是单畴颗粒。


    ![](img/24a9da1d7c3b484411cd4981170528f1_137_0.png)


    图 6.3 Fe3O4 粉末经过 100 小时球磨后的颗粒扫描电镜照片


    由图 6.4 可知，Fe3O4 + NiO + ZnO 混合球磨 100 小时未热处理样品的饱和磁化强度 \(\sigma_m\) 为 45 A \(\cdot\)
    m\(^2\)kg\(^{-1}\)，矫顽力 \(H_c\) 为 377 \(\cdot\) 10\(^3\) (4\(\pi\))\(^{-1}\) A
    \(\cdot\) m\(^{-1}\)。经过 1 000°C 和 1 200°C 热处理后，其饱和磁化强度 \(\sigma_m\) 分别为 65 A ·
    m²kg⁻¹ 和 72 A · m²kg⁻¹，Hc 都约为 30 · 10³(4π)⁻¹ A · m⁻¹。磁滞回线显示了从“硬”到“软”的变化。本实验样品经过球磨后的饱和磁化强度数值要比
    Jiang 等人相关实验——以 Fe2O3 为原料球磨结果大近 2 倍。这说明，采用 Fe3O4 为球磨起始原料要比用 Fe2O3 好。图 6.4 中数据还说明，在球磨过程中，虽然磨球和原料在球磨时不断地运动，但当颗粒达到一定细度，聚合一起后，再怎么延长球磨时间，颗粒尺寸也不会因此减小。我们认为，Fe3O4
    是磁性物质，如果能被球磨到它的超顺磁临界直径，那么其应该无剩磁；然而，我们实验中球磨后的样品其颗粒尺寸为 10～50 nm，具有剩磁 8.79 A · m²kg⁻¹，矫顽力
    377 · 10³(4π)⁻¹ A · m⁻¹。另一方面，如果三元系材料通过球磨都成了 NiZn 铁氧体，那么它的饱和磁化强度应该与具有相同颗粒尺寸的单相
    NiZn 铁氧体粉体相一致，但是实验结果却不是如此，图中两根磁滞回线不一致。Raming 等人研究报道[192]，Fe3O4 颗粒为 10～50 nm 时观察到超顺磁现象，但我们实验结果表明，无论是球磨后的
    Fe3O4 还是它的混合物都没有观察到超顺磁现象。


    ![](img/24a9da1d7c3b484411cd4981170528f1_138_0.png)


    图 6.4 复合 Fe3O4+NiO+ZnO 混合球磨 100 h 样品和经 1 000°C、1 200°C 热处理后样品 VSM 磁测量的实验结果


    众所周知，测得的样品饱和磁化强度是样品单位体积中的所有磁矩值，数值的差别是颗粒的特性决定。即颗粒是超顺磁颗粒（SPP），还是单畴颗粒（SDP），或者多畴颗粒（MDP）。一般多畴颗粒的矫顽力要比单畴颗粒小得多[193-194]。如果颗粒是单畴的，那么材料饱和磁化强度贡献都来自磁矩的一致转动。当外磁场足够大，所有的磁矩都会转向外场方向，那么具有相类似颗粒尺寸的样品，在相同的外场测试下，饱和磁化强度应该是相同的。根据我们实验结果，如果除了部分
    Fe3O4 被氧化外，没有发生其他的化学反应，那么从球磨后 Fe3O4 的饱和磁化强度 25 · 10³ (4π)⁻¹ A · m⁻¹ 和混合球磨后合成材料的饱和磁化强度
    45 · 10³ (4π)⁻¹ A · m⁻¹ 得知，合成材料的饱和磁化强度增加了。因为材料的饱和磁化强度只与材料的磁性颗粒尺寸和性质相关，那么复合材料饱和磁化强度的变化只有用复合材料中存在
    NiZn 铁氧体相来说明。


    关于采用 Fe3O4 作为初始原料所得饱和磁化强度 σm 远大于 Fe2O3 为原料的物理机制，可从两步合成角度来理解。我们知道，Fe2O3 是弱磁性的，球磨过程只有合成
    NiZn 铁氧体才会使样品的饱和磁化强度 σm 提高。众多实验已经证明，一般只有当磁性物质颗粒直径要达到 10 nm 左右时才会呈现出所谓超顺磁性。而就包括本实验在内的一般机械球磨而言，所获得粉末的尺度大约在
    10~50 nm 之间，10 nm 以下的粉末颗粒是极少数。原因在于长时间的球磨会使粉料结块，大大降低球磨效率，限制了球磨最终产物的极限颗粒尺度。因此，以
    Fe2O3 为原料复合的 NiZn 铁氧体样品中低的饱和磁化强度 σm，主要应归功于合成效率问题，即实验所形成的 NiZn 铁氧体本身比率较少。而在以 Fe3O4
    为原料复合 NiZn 铁氧体过程中，按照两步合成机制（方程（6.1）和（6.2））。部分 Fe3O4 首先被氧化成 Fe2O3，所形成中间产物的 Fe2O3
    较直接利用的 Fe2O3 而言粒子尺度要小得多，因而中间 Fe2O3 粉末的活性很高，再参与化学合成时的反应活性也高，反应充分，因此合成 NiZn 铁氧体产物的比例要大得多，表现出样品的整体饱和磁化强度
    σm 较直接采用 Fe2O3 原料要高得

