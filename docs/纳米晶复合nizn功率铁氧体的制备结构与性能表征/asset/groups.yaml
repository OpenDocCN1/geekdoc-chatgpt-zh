    ### 2.3.3 动态空气中凝胶热分解过程的热分析


    图 2.6、图 2.7 是在动态空气中测试的样品 TG、DTG 曲线。从图 2.6 我们可以清楚看到，在 222℃之前，凝胶热反应在两种气氛中没有很大的差别。通过比对硝基、硝化类含能物质在同温区的
