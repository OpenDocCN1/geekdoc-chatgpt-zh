    # 1.3 铁氧体材料制备工艺的研究与发展


    现在已广泛应用的磁性材料，在高频应用领域基本上都是采用铁氧体磁性材料。为使器件满足轻、小、薄的要求，并与集成电子电路组装、相匹配，很显然，用传统的陶瓷工艺制备铁氧体材料已不能满足高性能材料的要求，因而提出铁氧体制备工艺的改革。新型铁氧体粉料制备工艺的改革目标首先是确保粉料的物理、化学性能，尽可能去掉损耗、费时的球磨工序；其次是成型和烧结时显微结构的控制，尽可能采用低温烧结，这与传统铁氧体制备工艺是截然不同的。


    目前，国内外制备纳米颗粒的方法大体上可分为三类：液相法、固相法和气相法，分别包含若干种方法，如图 1.2 所示。


