    图 5.11 掺杂样品 C 的相对损耗与频率关系

    （图是在 2 MHz 处取的 tan δ/μ'' 值）


    ## 5.5 小结


    通过对同一配比样品用不同方法掺杂铋的实验研究证明：湿凝胶阶段掺杂方法，工艺简单，掺杂种类、数量易于控制，分散均匀，是切实可行的方法。这给高性能铁氧体磁性材料制备开辟了一条经济、方便、实用、可靠的工艺路线。此方法易于操作、工艺重复性好、节约成本和能耗，还可以推广应用到其他精细陶瓷产品制备工艺中去。


    本章的纳米晶、微米晶复合烧结实验研究表明，随着起始烧结坯体中微米晶数量增多，材料磁导率也会增大，而且材料损耗也相应增大。对纳米晶铁氧体而言，要使其在复合烧结中起催化作用，成型密度还必须提高，晶体粒度还要减小，纳米晶的种类和数量还要仔细挑选。然而纳米晶的可控制备还是为我们设计、制备新型材料提供了新的手段和方法，即对不同纳米晶、微米晶复合材料进行二次加工，可以设计、制备出特定显微结构的材料。例如用不同晶系纳米晶、微晶复合制备复合结构材料；用纳米晶作种子在氧化物原料烧结中作催化剂以形成特殊的显微结构或织构等等，这种新的思想方法将会在结构陶瓷、功能材料领域有着广阔的应用前景。


    ## 第六章 高能球磨法制备纳米晶 NiZn 铁氧体的结构和磁性


    ### 6.1 引言


    高能球磨作为一种重要的方法被广泛应用于诸多材料的合成与制备研究，它利用球磨机的高速振动和转动，使硬球对原料进行强烈的撞击、研磨和搅拌。它能使粉末产生塑性形变及固相形变，能使晶格缺陷不断在大晶粒颗粒内部大量产生，而使颗粒中大角度晶界重新组合，使颗粒内晶粒尺寸大幅度下降，且具有工艺简单、产量大的优点。1988
    年，日本京都大学 Shingu 等人报道了高能球磨法制备 Al –Fe 纳米晶材料，为纳米材料制备开拓了一条实用化生产途径。目前机械化学合成主要在振动式或行星式球磨机中进行。运用这些机械已成功得到纳米纯金属和合金[169-170]，互不溶体系纳米结构材料[171]，纳米金属间化合物[172-174]，纳米级金属－陶瓷粉复合材料[175]，聚合物－无机物纳米复合材料等[176-177]，越来越受到物理学和材料科学工作者的重视。然而对无机金属氧化材料间直接用机械化学合成纳米材料的研究[178]很少有报道。


    NiZn 铁氧体是一种在高频范围有着广泛应用的软磁材料，其制备和性质研究一直备受人们注意。虽然现在已有化学共沉淀、溶胶—凝胶法等方法制备更好的纳米晶 NiZn
    铁氧体[179-183]，但人们试图用新方法新原料复合 NiZn 铁氧体材料的努力一直没有停止过。例如，1998 年，中国科学院上海硅酸盐所高性能陶瓷与超微结构国家重点实验室的姜继森等人用高能球磨法，采用
    α – Fe₂O₃ 为主要材料合成了纳米晶 NiZn 铁氧体[184]，并用多种测量结果证明了其粉末是镍锌铁氧体纳米晶。作为一种尝试，本文报告了作者首次以
    Fe3O4 为原料，利用高能机械球磨方法，成功复合 NiZn 铁氧体纳米晶软磁材料的实验结果。样品具有很好的单相结构，对 100 小时球磨时间而言，所形成材料的典型晶粒尺度为
    10～50 nm。结合纯 Fe3O4 球磨样品，初步估算其样品的合成效率大约为 27%～44%。结果证明，可以利用高能球磨技术可以直接获得的 NiZn 铁氧体纳米晶，样品表现出较低的磁化强度
    σm 和较大的矫顽力 Hc，其矫顽力 Hc 值为 45 · 10³(4π)⁻¹ A · m⁻¹，磁化强度 σm 值为 377 A · m²kg⁻¹。对实用化而言，适当的热处理将是必要的。作为一种有效可行的新方法，其结果对利用高能球磨制备复合纳米晶
    NiZn 软磁铁氧体提供了重要的实验证据。


    ## 6.2 实验原理与方法


    ### 1. 实验原理


    高能球磨与传统低能球磨的不同在于磨球的运动速度。高能球磨运动速度较大，它使粉体产生塑性形变及固相形变，而传统的球磨工艺只对粉体起混合均匀的作用。


    纳米结构形成机理——在用高能球磨获得纳米结构的形成机理研究中，一般认为高能球磨过程是一个颗粒循环剪切变形的过程。在此过程中，晶格缺陷不断在大晶粒的颗粒内部大量产生，从而导致颗粒中大角度晶界的重新组合，使颗粒内晶粒尺寸下降到纳米数量级。在单组元的系统中，纳米晶的形成仅仅是在机械驱动下的结构演变，晶粒粒度随球磨时间的延长而下降，应变随球磨时间的增加而不断增大。在球磨过程中，由于样品反复形变，局部应变带中缺陷密度达到临界值时，晶粒开始破碎，这个过程不断反复，晶粒不断细化直到形成纳米结构。


    机械合金化——利用金属或合金在球磨过程中与其他单质或化合物之间的化学反应而制备出所需材料的技术又称反应球磨技术或机械化学法[185-186]。由于颗粒在高能球磨中承受反复强烈的机械应力作用，表面积首先要发生变化。同时，温度升高，表面积变化还会导致表面能变化。因此，颗粒中相邻原子键断裂之前牢固约束的键力在粉碎后形成的新表面上很自然地被激活，表面能的增大和机械激活作用将导致以下几种变化[187]：


    - (1) 颗粒结构变化，如表面结构自发地重组，形成非晶态结构或重结晶；

    - (2) 颗粒表面物理化学性质变化，如表面电性、物理与化学吸附、溶解性、分散与团聚性质；

    - (3) 在局部受反复应力作用区域产生化学反应，如由一种物质转变为另一种物质，释放出气体，外来离子进入晶格结构中引起原物料中化学组成变化。


    近来研究表明，使用不同的球磨机、球磨强度、球磨介质、球的直径、球料比和球磨时间、温度等会得到不同的产物，相变是其中的重要因素。在不同的球磨条件下，会产生不同的相变过程；碰撞过程中使粉末产生形变、形成复合粉的同时，也会导致温度升高；同时伴随产生空位、位错、晶界及成分的浓度梯度，进一步发生溶质的快速输运和再分散，为形成新相创造了条件。


    ### 2. 实验方法


    实验采用分析纯的粉末原料 Fe3O4 (98.5%)、NiO(99%) 和 ZnO (98.5%)，按 0.5NiO + 0.5ZnO + 2/3Fe3O4
    ——> Ni0.5 Zn0.5 Fe2 O4 的名义组分配比，精确称重后，将各原料放入玛瑙罐中，所用玛瑙罐的几何尺寸为 (6.35×7.95 cm)。所用磨球采用两种不同直径的不锈钢，直径分别为
    7 mm 和 4 mm，两种不锈钢球的质量比为 2 : 1(绝对量分别为 200 克和 100 克)。球料比为 8 : 1。实验采用 QM-C1 型行星式球磨机，在室温下进行，球磨转速为
    180 转/分，连续球磨时间为 100 小时。然后将球磨后的粉末通过 300 目的细筛，用 PVA 造粒，然后压片成样环，所用成型压力为 18 MPa，样环外径为
    25 mm，内径为 14.6 mm，厚度 5 mm。作为对比实验，在上述基础上，我们也制备了两种相关样品作研究，一是以纯 Fe3O4 为原料，以同样条件，即球料比为
    8 : 1，球磨 100 小时，与上述球磨的复合 NiZn 铁氧体作对比研究；二是将部分球磨的复合 NiZn 铁氧体样品放入高温氧化炉内煅烧，烧结条件是直接在空气中以
    150°C/h 速度升温，并分别在 1000°C 和 1200°C 下保温 2 h 后，随炉冷却至室温。另外，我们还用 Sol-Gel 方法制备了配比为 Ni0.5
    Zn0.5 Fe2O4 的纳米晶粉体[188]，并且分别在 500°C 和 800°C 退火 30 min。


    结构分析采用日本理学 Dmax/RC 型粉末 X 射线衍射仪( XRD, Cu – Kα 辐射)，以每分钟 3 度扫描速度，取 2θ = 10 ~ 100°C
    范围测试。用 JSM – 6700F 型扫描电子显微镜( SEM)、透射电子显微镜( TEM Model H – 800)研究样品的显微结构和晶粒尺寸分布；采用振动样品磁强计(
    VSM, Model 155，室温，外磁场 10 000 Oe 或 10 000 · 10 3(4π) – 1 A · m – 1)测量出样品的磁滞回线，考察了样品的饱和磁化强度、矫顽力特性。所有实验都具有很好的重复性。


    ## 6.3 高能球磨法制备纳米晶 NiZn 铁氧体的结构和磁性


    图 6.1 给出了实验样品 XRD 结构分析的实验结果，为了便于比较和指标化，图中同时列出了具有较好单相结构的 NiZn 铁氧体的 XRD 粉末衍射图(图
    6.1(c))，该结果是作者通过 Sol-Gel 方法制备的 Ni0.5 Zn0.5 Fe2O4 铁氧体，并经 800°C 热处理后得到的 XRD 衍射图谱。图中(a)和(b)分别是
    Fe3O4 和 Fe3O4 + NiO + ZnO 粉末经 100 h 球磨后的 XRD 衍射图谱。从图 6.1 可以看到：对 Fe3O4 球磨 100 h
    情况的粉末衍射谱而言(图 6.1(a))，可以看到，除了 Fe3O4 的衍射峰外，出现大量 α – Fe2O3 相的衍射峰。而对 Fe3O4 + NiO +
    ZnO 粉末而言，则没有 α – Fe2O3 相的衍射峰出现(图 6.1(b))。这里，两者是在完全相同的球磨条件下进行的，这一结果可能表明，Fe3O4 在球磨过程中
    Fe3O4 会首先被氧化，形成 α - Fe2 O3，在有 NiO 和 ZnO 存在的情况下，α - Fe2 O3 与两者发生机械化学合成反应，形成 Ni0.5Zn0.5Fe2
    O4 结构。即利用 Fe3 O4 +NiO+ZnO 粉末高能球磨制备纳米晶 NiZn 铁氧体的反应可表示为两步过程：


    3(Fe3 O4) + 1/2 O2 ——> 3(α - Fe2 O3) + 1(Fe3 O4)  (6.1)


    ![](img/24a9da1d7c3b484411cd4981170528f1_135_0.png)


    图 6.1 实验样品 XRD 结构分析的实验结果

    (a) Fe3O4 粉末球磨 100 小时； (b) Fe3 O4 +NiO+ZnO 混合球磨 100 h； (c) 由 Sol - Gel 方法制备 Ni0.5Zn0.5Fe2
    O4 粉末在 800°C 热处理 30 min 的结果


    然后，


    α - Fe2 O3 + 0.5NiO + 0.5ZnO ——> Ni0.5Zn0.5Fe2 O4  (6.2)


    也可能单步生成，


    2Fe3O4 + 0.5NiO + 0.5ZnO --> Ni0.5Zn0.5Fe2O4 (6.3)

    βcos θ/λ = 2ε sin θ/λ + 1/L (6.4)


    其中 λ, θ, β, ε 和 L 分别是实验所用 X 射线的波长、衍射角、衍射峰的半高宽、晶格应力和晶粒尺寸大小。从这一关系出发，作为粗略估计，得到本实验所给出的晶粒尺寸大约在
    10~50 nm 之间，也就是说，确实形成了较好的纳米晶结构。从衍射强度来看，经过 100 h 球磨，无论纯 Fe3O4 样品还是混合粉末样品，其衍射强度都大大低于常规
    NiZn 铁氧体样品，大约仅为常规 NiZn 铁氧体样品的十分之一。其原因主要是因为长期球磨使粉料颗粒度大大变小，且衍射线的宽度与垂直反射面的晶体厚度有关，晶体越小，hkl
    倒结点的反射区愈弥散，衍射线愈平坦，衍射线的宽化，使衍射强度随之下降。


    图 6.2 给出了所用原料 Fe3O4 粉末和经过 100 h 球磨后 Fe3O4 粉末球磨 100 h 后样品的磁测量实验结果。可以看到，对原料粉末 Fe3O4
    而言，饱和磁化强度 σm 为 85 (A·m²kg⁻¹)，而经 100 h 球磨后，其饱和磁化强度 σm 仅为 25 (A·m²kg⁻¹)，减少了 2/3；Fe3O4
    矫顽力 Hc，从球磨前为 209·10³(4π)⁻¹ A·m⁻¹，球磨后为 520·10³(4π)⁻¹ A·m⁻¹，为原料粉末的 2 倍多。


    ![](img/24a9da1d7c3b484411cd4981170528f1_136_0.png)


    图 6.2 Fe3O4 原料粉末和经 100 h 球磨后 VSM 磁测量的实验结果


    根据超顺磁理论[189]，如果晶粒尺寸小于超顺磁临界值 \(d_s\)，那么 \(H_c\) 就为零；如果晶粒尺寸在 \(d_s < d < d_0\)，那么颗粒就被认为是单畴（SD）。其中
    \(d_0\) 为单畴临界尺寸。因为我们实验结果显示，Fe3O4 粉末经过 100 h 球磨后矫顽力 \(H_c \neq 0\)，所以不是超顺磁颗粒。


    众所周知，材料的矫顽力由许多因素决定，如颗粒尺寸、形状、堆积密度甚至晶格缺陷等等，其主要由晶粒尺寸决定[190-191]。


    实验结果显示，通过高能球磨，样品的饱和磁化强度 \(\sigma_m\) 大大减小而矫顽力 \(H_c\) 大大增加。出现这一结果是由于 Fe3O4 粉末经过
    100 h 球磨后，其颗粒尺度大大变小，由于尺寸效应，使得材料的整体磁性变弱，饱和磁化强度 \(\sigma_m\) 大大下降，而矫顽力 \(H_c\) 增加。图
    6.3 给出 Fe3O4 粉末经过 100 h 球磨后的颗粒扫描电镜照片，颗粒直径 10 ~ 50 nm；根据前面分析，应该是单畴颗粒。


    ![](img/24a9da1d7c3b484411cd4981170528f1_137_0.png)


    图 6.3 Fe3O4 粉末经过 100 小时球磨后的颗粒扫描电镜照片


    由图 6.4 可知，Fe3O4 + NiO + ZnO 混合球磨 100 小时未热处理样品的饱和磁化强度 \(\sigma_m\) 为 45 A \(\cdot\)
    m\(^2\)kg\(^{-1}\)，矫顽力 \(H_c\) 为 377 \(\cdot\) 10\(^3\) (4\(\pi\))\(^{-1}\) A
    \(\cdot\) m\(^{-1}\)。经过 1 000°C 和 1 200°C 热处理后，其饱和磁化强度 \(\sigma_m\) 分别为 65 A ·
    m²kg⁻¹ 和 72 A · m²kg⁻¹，Hc 都约为 30 · 10³(4π)⁻¹ A · m⁻¹。磁滞回线显示了从“硬”到“软”的变化。本实验样品经过球磨后的饱和磁化强度数值要比
    Jiang 等人相关实验——以 Fe2O3 为原料球磨结果大近 2 倍。这说明，采用 Fe3O4 为球磨起始原料要比用 Fe2O3 好。图 6.4 中数据还说明，在球磨过程中，虽然磨球和原料在球磨时不断地运动，但当颗粒达到一定细度，聚合一起后，再怎么延长球磨时间，颗粒尺寸也不会因此减小。我们认为，Fe3O4
    是磁性物质，如果能被球磨到它的超顺磁临界直径，那么其应该无剩磁；然而，我们实验中球磨后的样品其颗粒尺寸为 10～50 nm，具有剩磁 8.79 A · m²kg⁻¹，矫顽力
    377 · 10³(4π)⁻¹ A · m⁻¹。另一方面，如果三元系材料通过球磨都成了 NiZn 铁氧体，那么它的饱和磁化强度应该与具有相同颗粒尺寸的单相
    NiZn 铁氧体粉体相一致，但是实验结果却不是如此，图中两根磁滞回线不一致。Raming 等人研究报道[192]，Fe3O4 颗粒为 10～50 nm 时观察到超顺磁现象，但我们实验结果表明，无论是球磨后的
    Fe3O4 还是它的混合物都没有观察到超顺磁现象。


    ![](img/24a9da1d7c3b484411cd4981170528f1_138_0.png)


    图 6.4 复合 Fe3O4+NiO+ZnO 混合球磨 100 h 样品和经 1 000°C、1 200°C 热处理后样品 VSM 磁测量的实验结果


    众所周知，测得的样品饱和磁化强度是样品单位体积中的所有磁矩值，数值的差别是颗粒的特性决定。即颗粒是超顺磁颗粒（SPP），还是单畴颗粒（SDP），或者多畴颗粒（MDP）。一般多畴颗粒的矫顽力要比单畴颗粒小得多[193-194]。如果颗粒是单畴的，那么材料饱和磁化强度贡献都来自磁矩的一致转动。当外磁场足够大，所有的磁矩都会转向外场方向，那么具有相类似颗粒尺寸的样品，在相同的外场测试下，饱和磁化强度应该是相同的。根据我们实验结果，如果除了部分
    Fe3O4 被氧化外，没有发生其他的化学反应，那么从球磨后 Fe3O4 的饱和磁化强度 25 · 10³ (4π)⁻¹ A · m⁻¹ 和混合球磨后合成材料的饱和磁化强度
    45 · 10³ (4π)⁻¹ A · m⁻¹ 得知，合成材料的饱和磁化强度增加了。因为材料的饱和磁化强度只与材料的磁性颗粒尺寸和性质相关，那么复合材料饱和磁化强度的变化只有用复合材料中存在
    NiZn 铁氧体相来说明。


    关于采用 Fe3O4 作为初始原料所得饱和磁化强度 σm 远大于 Fe2O3 为原料的物理机制，可从两步合成角度来理解。我们知道，Fe2O3 是弱磁性的，球磨过程只有合成
    NiZn 铁氧体才会使样品的饱和磁化强度 σm 提高。众多实验已经证明，一般只有当磁性物质颗粒直径要达到 10 nm 左右时才会呈现出所谓超顺磁性。而就包括本实验在内的一般机械球磨而言，所获得粉末的尺度大约在
    10~50 nm 之间，10 nm 以下的粉末颗粒是极少数。原因在于长时间的球磨会使粉料结块，大大降低球磨效率，限制了球磨最终产物的极限颗粒尺度。因此，以
    Fe2O3 为原料复合的 NiZn 铁氧体样品中低的饱和磁化强度 σm，主要应归功于合成效率问题，即实验所形成的 NiZn 铁氧体本身比率较少。而在以 Fe3O4
    为原料复合 NiZn 铁氧体过程中，按照两步合成机制（方程（6.1）和（6.2））。部分 Fe3O4 首先被氧化成 Fe2O3，所形成中间产物的 Fe2O3
    较直接利用的 Fe2O3 而言粒子尺度要小得多，因而中间 Fe2O3 粉末的活性很高，再参与化学合成时的反应活性也高，反应充分，因此合成 NiZn 铁氧体产物的比例要大得多，表现出样品的整体饱和磁化强度
    σm 较直接采用 Fe2O3 原料要高得

