    次加工，研究了铁氧体纳米晶聚集体的烧结特性和对宏观材料磁性能的影响，烧结后材料本身已不具有纳米尺度的材料，然而确实是利用了纳米小尺寸效应进行二次加工，并已制备出优质的多晶
