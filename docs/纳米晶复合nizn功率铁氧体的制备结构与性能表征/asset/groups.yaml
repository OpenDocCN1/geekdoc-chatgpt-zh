    ## 4.3.2 掺钙纳米晶复合 NiZn 铁氧体的频谱特性


    图 4.8、图 4.9 显示了不同量钙掺杂、不同烧结温度时样品的磁导率与频率,相对损耗与频率的关系。在 1000°C 时,无论样品磁导率还是相对损耗值都比较差。这时磁导率随掺杂量变化不大,但相对损耗随掺杂量增加而降低。在
    1100°C 烧结的样品,磁导率对掺杂量非常敏感。最佳掺钙量为 0.4 wt%,此时磁导率达到最大值 130,要比不掺钙材料的磁导率大近 2 倍。


    相对损耗在 1~8 MHz 范围都小于 2×10⁻⁴,材料的截止频率在 10 MHz 左右,而且相对损耗在较大的频率范围都很低(图 4.9)。这与前一章钙掺杂烧结样品在
    1100°C 时烧结的显微结构相适应,即在掺杂 0.4%时结构已开始收缩，出现一些条状孔隙，晶粒已长到 4 μm 左右（图 3.3c）。1200°C烧结样品的磁导率都有不同程度的增加（掺杂
    0.4% 的样品晶粒就长到 6 μm 左右），相对损耗也相应降低（结构中孔隙较少）。


    在这里钙掺杂材料的磁导率和损耗性能都得到了验证，即随晶粒长大磁导率增加，其较低相对损耗频率范围随掺杂量增加而收缩；在 1300°C烧结，样品磁导率随掺钙量的增加而下降。1300°C烧结样品的相对损耗在
    1 MHz 就开始随频率提高而急剧增大。估计这时处于晶界上的氧化钙对晶粒生长的阻力受到破坏，部分区域显微结构出现了晶粒、孔隙大小分布极不均匀的情况——双重结构。


