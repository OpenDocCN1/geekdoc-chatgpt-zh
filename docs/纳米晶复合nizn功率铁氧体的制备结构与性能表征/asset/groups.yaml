  - '[PAGE 7]


    # 答辩委员会对论文的评语


    郁黎明同学的论文以高频 NiZn 铁氧体的制备和磁性研究为背景，对 NiZn 铁氧体的制备工艺进行了改进。用溶胶凝胶法获得了纳米晶 NiZn 复合铁氧体，并以此为原料，制备并研究了一系列铁氧体的结构和磁性，得到了一系列好的结果，具体表现在以下几个方面：


    +   (1) 用凝胶自燃法制备了纳米晶 NiZn 铁氧体，研究了其工艺过程，解释了纳米晶复合 NiZn 铁氧体的烧结机理。


    +   (2) 利用掺杂纳米晶 NiZn 铁氧体直接成型、烧结制备高性能 NiZn 铁氧体的新工艺，成功开发了具有先进水平的高磁导率、高频、宽频、低耗 NiZn
    功率铁氧体材料与器件。


    +   (3) 利用纳米晶和微米晶复合烧结工艺制备高饱和低的磁损耗材料，该方法对开展其他复合材料研究具有一定借鉴。


    +   (4) 利用高能球磨采用 Fe3O4 作为氧化铁制备了纳米晶 NiZn 铁氧体，并对材料微观结构和磁特性进行了系统研究。


    综上所述，郁黎明同学的论文选题明确，研究思路清晰，实验数据完整可靠，论文撰写规范，文字表达清楚，表明了作者基础理论扎实，具有独立从事科研工作的能力。在答辩过程中，能正确回答答辩委员会提出的问题。'
  - '[PAGE 8]


    # 答辩委员会表决结果


    经答辩委员会委员无记名投票，一致通过郁黎明同学的博士学位论文答辩，并建议授予博士学位。


    答辩委员会主席：杨斐龙

    2005 年 6 月 9 日'
  - '[PAGE 9]


    # 摘要


    随着微电子器件小型化低功耗方向的发展，对作为现代信息技术领域应用广泛的磁电子器件提出了相应的要求，同时电磁性能也要求向高磁导率、高频、宽频和低损耗方向发展。具有尖晶石（AB2O4）结构的
    NiZn 铁氧体，作为一种多元复合金属氧化物烧结体，在磁电子学高频应用领域一直起着重要的作用。因而该材料的频率损耗问题始终是该材料研究中的主题。特别是电子和信息产业对产品的小型化、集成化和模块化要求日益增高的情况下，除了对材料的高磁导率和使用频率宽度上的要求外，在材料制备工艺和器件组合配套方面也提出了新的要求，特别是低温烧结技术方面。因此，开发磁导率高、饱和磁化强度高、截止频率高并能低温烧结的
    NiZn 铁氧体材料，对推动微电子制造业的进一步发展有着重要的意义。本论文将纳米技术引入 NiZn 铁氧体的制备过程，从原料制备方法探索入手，系统研究了纳米晶
    NiZn 铁氧体形成机理，纳米晶合成 NiZn 铁氧体的烧结机理、结构和性能表征；研究了纳米晶复合 NiZn 铁氧体的高频磁特性和损耗特性，为微电子器件小型化、集成化、一体化和制作高频低耗功率器件提供了重要的基础研究资料。本论文共分七章，主要内容为：


    第一章综述了当今铁氧体磁性材料的研究进展，以纳米技术在磁性材料研究中的应用为着眼点，分析了目前相关铁氧体的制备工艺；在此基础上，针对传统铁氧体制备工艺的局限，提'
  - '[PAGE 10]


    出了凝胶自燃法制备铁氧体纳米晶与前驱物的新工艺。


    第二章系统研究了凝胶自燃法合成纳米晶 NiZn 铁氧体的过程，制备条件对纳米晶铁氧体合成的影响，纳米晶铁氧体的结构和磁性能表征，提出了凝胶自燃法合成纳米晶
    NiZn 铁氧体的物理机制。


    第三、四章提出了纳米晶再次复合的方法，即把纳米晶铁氧体直接造粒、成型和烧结制备成多晶铁氧体的方法，研究了溶胶过程中掺杂制成掺杂纳米晶铁氧体，然后再通过造粒、成型和烧结制备成多晶
    NiZn 铁氧体工艺；研究了不同掺杂种类、不同掺杂量和不同烧结温度的纳米晶复合 NiZn 铁氧体的显微结构；用球体模型解释了纳米晶复合 NiZn 铁氧体的烧结机理；重点考察了烧结温度、掺杂种类和浓度对纳米晶复合
    NiZn 铁氧体显微结构影响，探讨了显微结构与高频损耗与磁性能关系。


    第五章研究了纳米—微米复合烧结 NiZn 铁氧体的工艺，研究了这种复合材料低温烧结后的高频损耗和磁谱特性，为未来利用可控制备纳米晶颗粒尺寸方法，设计和制备不同种类纳米晶、微米晶复合材料，制备特殊结构功能材料和复合结构材料奠定了基础。


    第六章给出了一种利用高能球磨法制备纳米晶 NiZn 铁氧体的新方法，研究了用高能球磨合成纳米晶 NiZn 铁氧体的过程，对高能球磨合成纳米晶效率进行了评估，证明高能球磨亦不失为一种制备
    NiZn 纳米晶铁氧体的有效方法。


    第七章对本论文工作进行了总结，并对未来研究进行了展望和讨论。


    整体而言，本工作通过纳米晶复合技术成功实现了 NiZn'
  - '[PAGE 11]


    铁氧体材料的低温烧结，解决了 NiZn 铁氧体材料制备中的一些关键技术，申报了国家发明专利，获得了具有自主知识产权的创新性研究成果，经专家鉴定该材料综合性能处于国内领先地位，达到当今国际同类材料的先进水平。本工作研究内容和所建立的一些新方法、新工艺，不仅可用于铁氧体材料生产，还可以推广应用到相关精细陶瓷的制备过程中。


    # 关键词  NiZn 铁氧体，纳米晶，凝胶自燃法，高频磁特性，纳米一微米复合'
  - '[PAGE 12]


    # Abstract


    With the development of the miniaturization of micro-electronic devices and magneto-electronic
    devices, which are being widely used in the field of modern information technology,
    and the correspondingly demand for miniaturization and low profile, the electro-magnetic
    properties of ferrite devices are also expected to satisfy the high permeability,
    high frequency, wide frequency range and low power loss. NiZn ferrite with spinel
    structure (AB2O4) is a poly nary metal oxide sintered substance, which has been
    playing an important role in the application of high frequency in field of magneto-electronic
    devices. The power loss of this kind of materials has always been an object of
    study to many researchers, especially under the circumstances of increasing demand
    for the miniaturization, integration, and modularization of products used in electronics
    and information industry. Apart from the demands for the high permeability and
    wide frequency ranges, new requirement is also needed in the preparation of materials,
    and device combination and assembly process, where materials need firing at low
    temperatures. Therefore, it is of great significance to develop a new NiZn ferrite
    material with high permeability, high saturation magnetization, high cut-off frequency
    and low'
  - '[PAGE 13]


    sintering temperature, which will surely promote the

    development of micro-electronic manufacturing industry. In

    this thesis we introduce the nano-technique into NiZn ferrite

    preparation. Starting with raw material fabrication, this

    thesis presents systematically the forming mechanism of NiZn

    ferrite nano-crystallites; the sintering mechanism of nano-

    crystalline-built NiZn ferrite, their microstructure and

    magnetic performances and their magnetic spectrum and

    power loss characteristics at high frequencies, in order to

    furnish some important basic findings for the manufacturing

    of micro-electronic devices, which can work at high

    frequency with low loss, compact size and integration, and

    can be used for the applications with high frequency, low

    power loss devices. This thesis consists of seven chapters. The

    main contents are as follows:


    The first chapter summarizes the current development of

    ferrite magnetic material researches, by paying special

    attention to the application of nano-technology in the

    magnetic material researches, analyses the present status of

    various ferrite manufacturing processing methods, on the

    bases of which, a new processing using gel-auto-combustion in

    the preparation of ferrite nano-crystallite and ferrite

    precursor is put forward against the weaknesses of traditional

    ferrite preparation process.


    The second chapter systematically reveals the

    nanocrystalline NiZn ferrite synthesis process by gel-auto-

    combustion method, the influences of manufacturing'
  - '[PAGE 14]


    conditions on nanocrystalline ferrite formation, the characterisations of nanocrystalline
    ferrite’s structure and magnetic properties, and extracts the physical mechanism
    of synthesizing nanocrystalline NiZn ferrite.


    The third and fourth chapters present the nanocrystalline re-synthesis method,
    that is, making grains, packing and sintering directly to form polycrystalline
    ferrite by using nanocrystalline ferrite method, investigating the process of
    doping in the sol to prepare doped nanocrystalline ferrite and then making grains,
    packing and sintering to synthesis polycrystalline NiZn ferrite, and also study
    the microstructures of doping or nanocrystalline-synthesized NiZn ferrites at
    different sintering temperatures; explain its sintering mechanism by ball model
    hypothesis, focusing on the effects of sintering temperatures, the doping substances,
    the doping quantities on the ferrite microstructures, and the relationships between
    microstructure and magnetic properties or, power loss at high frequencies.


    Chapter five deals with the Nano-micro-crystalline composite sintering NiZn ferrite
    process; the power loss at high frequencies and magnetic spectrums of the materials
    sintered at low temperature, which has laid a solid foundation for further application
    of different sizes of nanocrystalline, for the designing and manufacturing different
    nano-micro-crystalline composites materials, and for the preparation of materials
    with special structure, function or composite structure.'
  - '[PAGE 15]


    Chapter six gives a new way to manufacture NiZn ferrite nanocrystalline by high-energy
    ball milling. The synthesizing process is also discussed in detail, together with
    the forming mechanism for NiZn ferrite nanocrystalline, and the synthesis efficiency
    of NiZn ferrite nanocrystalline made by high-energy ball milling, proves that
    the preparation of NiZn ferrite nanocrystalline by high-energy ball milling is
    applicable.


    Chapter seven summarizes this thesis.


    On the whole, this work has successfully prepared the NiZn ferrite material sintered
    at low temperature by nanocrystalline composite technology, which solves some
    key techniques in NiZn ferrite manufacturing. The present researches give a leading
    ferrite material with intellectual property. The new methods and processes invented
    in our research work can not only be used in manufacturing ferrite magnetic materials,
    but also in the production and researches of related ceramics.


    **Key words** NiZn ferrite, nano-crystalline, gel-autocombustion method, high
    frequency properties, nano-micro crystalline synthesis'
