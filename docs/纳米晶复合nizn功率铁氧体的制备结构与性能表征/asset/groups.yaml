    取冷却后一定质量的凝胶，采用 NETZSCH STA 409 PG/PC 综合热分析仪进行 TG、DSC 分析。升温范围从 20℃ 到 750℃，升温速率为
    10 K/min，炉内气氛分别为流动氮气和空气(20 mL/min)。用 Hitachi S-570 扫描电子显微镜(SEM)和 H-800 透射电子显微镜(TEM)分析观察样品粉末形态，用
