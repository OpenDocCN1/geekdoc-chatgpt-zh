    ## 第一章 铁氧体材料的研究与发展


    ### 1.1 概述


    磁性材料可以说是一个既古老而又年轻的研究领域。古老可追溯到我们中华民族的祖先们早在公元 4 世纪关于磁性的记录和司南的发现，年轻可从 20 世纪初人类合成第一块软磁铁氧体算还不到百年的历史。近年来在各类软磁材料领域不断的新发现及其在信息技术和微电子产业上的新应用，利用磁性材料制成的磁性元器件具有转换、传递、处理信息、存储能量、节约能源等功能，广泛地应用于能源、电信、自动控制、通讯、家用电器、生物、医疗卫生、轻工、选矿、物理探矿、军工等领域，尤其在信息技术领域已成为不可缺少的组成部分。目前几乎所有的电子产品都会用到磁性材料，而磁性器件与磁性材料是紧密相连的。在不断换代的电子产品时代，新技术、新工艺、新应用不断涌现，磁性材料得到了飞速发展。磁性材料已经历了晶态、非晶态、纳米微晶态、纳米微粒与纳米有序阵列和纳米结构材料的发展阶段，纳米磁性材料已经在信息技术领域中已日益显示出其重要性，同时纳米技术对目前传统磁性材料生产工艺的改进来说，也还有很大的用武之地。


    纳米技术是从 20 世纪 80 年代末、90 年代初崛起和发展起来的一门崭新技术，它是在现代物理学与先进工程技术相结合的基础上诞生的，是一门基础研究与应用探索紧密联系的新型科学技术。纳米技术被公认为是
    21 世纪最具有前途的科研领域，现已成为当今世界范围的研究热点之一。


    纳米技术是指在纳米尺度(0.1~100 nm)上,研究物质(包括原子和分子)的特性和相互作用，以及利用这些特性的多学科相互渗透的高新技术。它使人类的认识和改造物质世界的手段和能力延伸到原子和分子水平，其最终目标是以物质在纳米尺度上表现出来的特性制造具有特定功能的产品，实现生产方式的跨越式发展，改变人们现有的思维和生活方式。


    由于纳米微粒的小尺寸效应、表面效应、量子尺寸效应和宏观量子隧道效应等使得它们在磁、光、电、敏感等方面呈现常规材料不具备的特性，因此纳米微粒在磁性材料、电子材料、光学材料、高致密度材料的烧结、催化、传感、陶瓷增韧等方面有广阔的应用前景[1-2]。


    如果说，衡量一个国家工业发展水平及其国力是该国钢铁产量的话，那么，在全球经济进入信息时代的今天，衡量一个国家发展水平及其国力的标准将是该国的磁性材料的产量。而一个国家人民生活水平，则可用该国人均磁性材料的消耗值来衡量。1990
    年中国磁性材料的人均消耗值是 $0.18/人，仅相当于印度的（$0.25/人）72%。到 2000 年，尽管中国磁性材料的国内消费率从 85%降到 60%，但人均消耗值仍上升到
    $0.74/人，即三倍于印度。换言之，中国人的平均生活水平在最近十年内提高了 4 倍！但与美、日、欧等发达国家相比，仅为其人均消费值的 1/6。也就是说，要赶上发达国家的水平，对中国而言还有相当长的路要走[3]。


    根据 1999 年对全世界磁性材料在硬磁、软磁和磁记录应用市场的统计[4]，已达 300 亿美元，其中硬磁材料占 20.6%，为 61.8 亿美元；软磁材料占
    41.5%，为 124.5 亿美元；磁记录材料占 37.9%，为 113.7 亿美元（见图 1.1）。如果全世界磁性材料应用市场以每年 10%递增的话，那么到
    2005 年应用市场将达到 531.468 亿美元，其中硬磁材料占 109.482 亿美元，软磁材料占 220.559 亿美元，磁记录材料占 201.426
    亿美元。


    现在，世界磁性材料行业纷纷向中国或第三世界地区转移。世界一些著名的磁性材料制造企业均看好中国，如日本的 TDK、FDK、EPSON、日立金属、住友特殊等，韩国的梨树、三和，欧洲的
    PHILIPS、德国的 VAC、EPCOS, 美国的ARNORD、MAGNEQUENCH 已经转移到中国。日本近年的统计资料显示，其软磁铁氧体从 1997
    年的 44 096 t，下降到目前的 11 708 t，下降了 3 万多 t；铸造磁体从 1 073 t，下降到 519 t，近一半；铁氧体永磁从 49 195
    t 下降到 38 798 t，下降了 1 万 t；稀土磁体从 2000 年开始下降近 1 000 t。美国磁体产业情况是，铁氧体永磁 1995 年有 11
    家，现在只剩 5 家；稀土永磁 1995 年有 7 家，现在只有 3 家。


    跨入 21 世纪，中国的磁性材料产业得到了进一步发展。世界磁性材料生产向中国转移，增强了中国磁性材料工业的整体实力，提高了生产技术，加速了中国成为世界磁性材料生产基地和销售市场的建设。年增长超过
    20%。初步统计，2003 年中国磁性材料年销售收入突破 150 亿元人民币，达到 165 亿元，出口 4 亿美元。其中，软磁材料为 98 800 t，66.57
    亿元；永磁铁氧体达到 190 000 t，52.66 亿元；稀土永磁达到 9 440 t，41.73 亿元；铸造磁体 3 000 t，4.7 亿元。从数字上看虽然有了很大的进步，但仍然存在一些问题[5]。


    ### 1.1.1 产品产量和产值不适配


    目前，我国的磁性材料工业在产量方面已经初具规模，中低档产品占据了较大的国际市场，但在高档产品方面还缺少国际竞争能力。从行业整体来看，我国的磁性工业与国外先进国家相比，存在着管理水平低、制造工艺落后，产品质量差和产品档次低的问题。而且，规模经济还不够大。2003
    年中国最大的磁性材料生产企业年销售额在 22 亿美元，其他企业 3~4 亿美元；而厦门 TDK 公司，销售额达到 24 亿美元，日本 TDK 公司年销售收入约
    85 亿美元(合 697 亿人民币)，是中国磁性材料工业总产值的 5 倍。


    ### 1.1.2 磁性产品档次偏低


    国内的磁性材料大部分集中在低档次的产品上，价格低廉，赢利极微薄，缺少参与国际市场竞争的能力。永磁铁氧体以扬声器磁体为主，产品性能在 Y30 以下。电机磁瓦的性能在
    Y30H - 1，但大批量生产时性能不够稳定。软磁铁氧体的新产品集中在消费类产品。工业类磁芯的产量较少。大批量生产的功率铁氧材料的性能相当于日本的 TDK
    产品的 Pc30 牌号；高磁导率铁氧体的 μ 在 6 000 左右。少数企业能小批量的生产 Pc40 牌号和磁导率达到 10 000 以上的产品。钕铁硼磁体的生产性能一般在
    N35 左右，N40c 以上和高矫顽力牌号 N38H、N32SH 的只有少数企业能生产，国外推出的新牌号已经达到 N50、48H。在国际市场上，30%的高档产品要占市场销售额的
    70%。中国磁性材料产品的价格要比国际市场低 50%以上。


    ### 1.1.3 生产工艺和设备相对落后


    目前，我国的磁性材料专用设备销售总额达到 1.43 亿元，能提供成套成线的磁性材料生产设备。虽然今后我国磁性材料的性能和档次会有新的提高，但是由于国内外竞争激烈，要求产品成本不断降低。为此，磁性材料专用设备应开发自动化程度高，低能耗和高效率的设备。这样可提高磁性产品档次，减少人为因素的影响，保证产品的一致性。此外，还必须拥有自己磁性材料和设备的专利发明。因此我国磁性材料行业今后要做大做强，需要加速行业内的规模经济建设，发展强强联合，积极发展有自主知识产权和创新的产品，确保产品低价、质优，积极参与国际竞争。


    ## 1.2 纳米技术在磁性材料研究中的应用


    纳米技术目前在磁性材料方面的应用主要是纳米合成合金磁性材料，即软硬磁复相合金、非晶及纳米晶合金带和金属——非金属复合软磁材料。


    ### 1.2.1 软硬磁复相合金


    是把 α - Fe, Fe₃B 等软磁相与 Nd₂Fe₁₄B 等硬磁相以纳米尺寸析出，从而获得高剩余磁通密度（Br）和高磁能积的纳米合成磁体。这种磁体也被称作交换弹性磁体。该磁体即使退磁到接近矫顽力，一旦去掉磁场，磁化即像弹簧一样又回复到接近矫顽力。这是矫顽力低的软磁相和矫顽力高的硬磁相相互交换作用的磁性耦合，即使软磁相的磁化被退磁场反转，然而等退磁磁场一旦达到零，便被硬磁相拉升而复原。在以
    Fe₇₀Co₃₀ 合金作为软磁相在结晶单向取向的纳米合成磁体方面，理论计算磁能积可望达到 MJm⁻³ 以上[6]。对此正在进行组织观察，通过微磁学的解析及通过添加
    Cr、Cu、Nb 等元素，进行提高其性能的研究，最近也在进行薄膜和多层膜的研究，并有报告称 Fe - FePt 的磁能积已超过 400 kJm⁻³，并期望进一步提高。


    距发现硬磁合金 Nd₂Fe₁₄B 化合物之后，在其三元系中化合物中，还发现了饱和磁通密度 Js=1.54 T、异相磁场 Hₐ=20.8 MAm⁻¹ 的高磁性
    Sm₂Fe₁₇ Nₓ[7-8] 化合物。但由于 Sm₂ N 与 α - Fe 在温度 600°C 以上发生分解，所以正以粘结体用粉的应用为中心进行研究。目前使用还原法（RD）制造的粉末已能批量生产，获得磁能积
    100 ~ 160 kJm⁻³ 的注射成形粘结磁体用粉。在使用急冷的制造方法中，通过添加 Zr 使准稳定相 TbCu₁₇ 单相析出，或者制成由 α - Fe
    和准稳定相 TbCu₁₇ 组成的纳米合成磁体，并获得了高的磁特性。


    ### 1.2.2 非晶及纳米晶合金膜


    在非晶材料中，由于其晶体磁性各相异性为零，以磁致伸缩为零的组成合金进行等温退火，开发出磁致伸缩为零的 Co 系液体急冷薄板带、高饱和磁化低铁损系急冷薄带、Co
    – Fe – B 系及 C(Zr、Hf、Nb、Ti、Ta)薄膜等[9-10]。纳米结晶材料刚开始是通过热处理，由非晶铁制成粒径 10 ~ 20 μm 结晶组织的
    FeSiBNbCu 薄带，而后开发出 Fe – Hf – C 薄膜等[11-12]。人们认为，由纳米晶粒组成的多晶体通过晶体粒子间的相互作用及漏磁通的双极相互作用，各个纳米粒的本身的磁化是在几个集团中相互平行进行的。这时
    晶体磁性各相异性被平均化，实效性的各向异性常数变小，并且大大地削弱了磁致伸缩，从而发现了优越的软磁性。最近利用精密电镀法制造的高饱和磁通密度的 CoNiFe
    膜受到人们的重视[13]。该膜利用磁共析制造混晶结构，以使晶体微细化，是一种低矫顽力的方法。报告称，其特性为 B = 1.9 ~ 2.1T, Hc = 1.2Oe,
    λs = 1.8 × 10⁻⁶。目前正在试制复合磁头和超小型磁头等，期待能成为下一代磁头材料。


    ### 1.2.3 金属—非金属复合软磁材料


    为了降低金属磁芯材料的涡流电流损失，必须增加电阻。金属——非金属纳米软磁性材料[14-15]是在 SiO₂、Al₂O₃ 等绝缘体相的基体中析出 Co、Fe
    等纳米磁性结构的组织，其特点是同时具有软磁性和高电阻。软磁性的发现机理基本上与纳米晶材料相同，但电阻却高达数倍或几十倍。因此显示出超过传统铁氧体材料的优异的高频特性。以前主要是研究
    Co(- Fe)– Al – O, Fe – (B, Si, Al, Hf, Zr、M)-(O、N)等膜。最近也在研究频率达到 200 MHz, 磁导率接近
    3 000 的 Fe – Mg – Ag – O 系薄膜等。进而通过粒子间的隧道传导，认识非金属—金属软磁材料的磁阻效应，并作为磁材料受到重视。作为制造方法，一般是使用溅射法，但也可使用金属—氧化物同时电极沉淀法等。今后金属—非金属纳米复合软磁材料有望用作超高频线圈、超高密度磁记录磁头。


    除这些以外，铁氧体纳米晶 Fe₃O₄ 和 Co、Fe、Ni 等磁性纳米粒子，在生物医学上还有广泛的应用。例如作为药物载体[16-17]，作为靶向给药[18-19]系统等，前景十分广泛。然而纳米技术在铁氧体磁性材料领域应用还是很少。


    如上所说，磁性材料种类繁多，功能和应用各异。在功率转换系统中，磁性元件可用来完成很多功能。概括起来，这些功能可分为两大类：功率处理和信号处理。（1）功率电感器——在其极小的结构中，开关电源变换器的功率线路要用电感器完成基本的能量贮藏并把它从电源交给负载。采用脉宽调制（PWM）技术，在不同的间隔时间内，施加充电电压和放电电压，同样，也利用电感器的贮能机制建立磁能，在放电期间，再次把磁能供给电路。用已知的能量变换关系，可以控制从电能到磁能、再返回电能的连续变换。（2）高频功率变压器——在需要大的电压或电流变换比时，往往要使用变压器。电路的初、次级间隔离时，也要用变压器。当其把参考电位的信号加到与另一电位相关的另一点上时，仍要使用变压器。在接地标记之上的电桥结构中，通常都用到浮动开关上以驱动
    MOSFET 控制级。它们还被用作电流传感器，以复制电流波形。尽管这些功能不同，但它们都有一个共同的特点，即电压或电流变换与其匝比 NP/NS 有关。


    由于微电子技术的发展，电子设备的体积和重量大大减少，电子变压器主要向小型、轻量、高效和表面安装技术发展。因此，要求电子变压器也要相应地减小体积和重量。开关电源，即电源采用电网直接整流，自从
    70 年代初起将直流变换器的开关变压器的频率提高到 20 kHz，从而取代了笨重的 50 Hz 整流变压器。这革命性的技术发展，使电子变压器的体积可减小 3～5
    倍左右，重量可减轻 3 倍。50 Hz 电感式霓虹灯变压器改用电子式霓虹灯高频变压器后，体积约减小 1～2 倍，重量约减轻 4 倍；更重要的是符合绿色照明工程节能要求。随着高频低损耗的软磁铁氧体出现，开关电源的开关频率已从
    20 kHz 提高到 10 MHz 左右，使电子变压器的和重量还可进一步减小。所以，电子变压器的高频化是电子设备小型化和轻量化的必然发展趋势。


    ## 1.3 铁氧体材料制备工艺的研究与发展


    现在已广泛应用的磁性材料，在高频应用领域基本上都是采用铁氧体磁性材料。为使器件满足轻、小、薄的要求，并与集成电子电路组装、相匹配，显然，用传统的陶瓷工艺制备铁氧体材料已不能满足高性能材料的要求，因而提出铁氧体制备工艺的改革。新型铁氧体粉料制备工艺的改革目标首先是确保粉料的物理、化学性能，尽可能去掉损耗、费时的球磨工序；其次是成型和烧结时显微结构的控制，尽可能采用低温烧结，这与传统铁氧体制备工艺是截然不同的。


    目前，国内外制备纳米颗粒的方法大体上可分为三类：液相法、固相法和气相法，分别包含若干种方法，如图 1.2 所示。


    ![](img/24a9da1d7c3b484411cd4981170528f1_25_0.png)


    图 1.2 纳米级固体粉末材料的制备方法


    一般对原料的要求如下[20]：


    - (1) 准确的化学成分和配比；

    - (2) 粉料的高纯度；

    - (3) 成分分布的均匀性，特别不希望杂质的局部聚集；

    - (4) 粉料尽可能具有产品所需的物相，并在烧结过程中不发生对产品性能不利的相变；

    - (5) 粉料颗粒有一定细度，且尺寸分布窄，不成团聚，一定的比表面积；

    - (6) 粉料的堆积特性，即要有一定的流动性。


    能符合以上要求的粉料，则被认为是理想粉料。事实上用传统工艺，这些条件难以同时满足。譬如，粉料过细易团聚。要得到所需要的相，常需要煅烧，结果使晶粒长大，分布不均匀等等，因此需改进铁氧体原料制备，主要是改进化学制粉的方法。


    化学共沉淀法——化学沉淀法属湿法中最广泛使用的一种方法。最早由法国 Pechiney 公司提出，用以制备 BaTiO₃ 粉体[21]，1989 年 Haile[22]等人使用共沉淀法成功制备了用于变阻器的掺杂
    ZnO 粉体，1992 年 Rajendran 把共沉淀技术扩展应用到制备各种氧化物粉体[23-26]。该法是在含有多种可溶性阳离子的盐溶液中，加入沉淀剂(OH-，CO₃²⁻，C₂O₄²⁻，SO₄²⁻
    等)，在一定温度下使溶液水解，形成不溶性化合物如氢氧化物、碳酸盐、草酸盐、硫酸盐等沉淀，得到的沉淀物经水洗(除去原溶液中阴离子)，热分解或脱水、煅烧，便可得到氧化物粉末。在化学沉淀法中，从化学沉淀反应、晶粒生长到凝胶体的漂洗、分散、干燥、煅烧的每一个阶段都对颗粒生长有影响。从沉淀机理分析，为了从溶液中析出大小均匀的固体颗粒，必须使成核和生长这两个过程分开，以便使已形成的晶核同步长大，并在生长过程中不再有新核形成。在沉淀法诸多控制因素中，反应物的浓度及反应过程的
    pH 值对纳米级粉末性质及形貌的影响最大。化学沉淀法是当前常用的生产纳米级固体粉末的方法。由于该法是从溶液中选择沉淀出所需组分，并经充分洗涤，因此粉末的纯度可以保证。又由于

