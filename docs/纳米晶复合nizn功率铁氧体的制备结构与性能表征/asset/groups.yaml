    ![](img/24a9da1d7c3b484411cd4981170528f1_43_0.png)


    ![](img/24a9da1d7c3b484411cd4981170528f1_44_0.png)


    图 2.7 动态空气中，凝胶样品在 200～700℃ 的 TG、DTG 曲线


    联想到点燃样品凝胶出现的实验现象和实验样品的化学组成，可以推断实验中的硝酸盐柠檬酸凝胶，首先发生脱水反应，对应失重 9.82 wt%。随后在 200℃左右，凝胶分解中的还原剂柠檬酸离子和氧化剂
    NO₃⁻ 发生氧化还原反应[114]。大量凝胶物质中 N—O 键和 N—N 键的断裂，含炭基团参与反应，激烈的氧化还原反应伴随着可能产物 NO₂、NO、CO₂、CO
    挥发，而产生急剧失重（约 61 wt%）。


    从图 2.7 TG、DTG 曲线中还可以看到，在空气中，222℃ 以后样品缓慢失重。其 DTG 曲线自 222℃ 开始至大约 481℃ 在形成一个峰，峰值温度
    378℃。我们认为这是 α - FeO(OH)，γ - FeO(OH) 物质脱水，各金属氧化物的固-固相反应生成尖晶石结构（AB₂O₄）造成的。样品在约 481℃
    就达到了最大失重 15.38 wt%，而在动态氮气中，样品在约 700℃ 还未达到最大失重（图 2.5）。


    根据原始原料所含物质，我们认为 222℃ 以后可能存在的物质只能有：FeO，Fe₂O₃，α - FeO(OH)，γ - FeO(OH)，NiO，ZnO 以及极少量的有机残余物。在此温度阶段
    NiO、ZnO、α - Fe₂O₃ 是较稳定的物质，热分析没有任何变化[115]。所以除极少量有机残余物继续分解、挥发失重外，对失重可能有主要贡献的物质有：


    - 2 · (α - FeO(OH)) ——→ α - Fe₂O₃ + H₂O (2.1)


    - 2 · (γ - FeO(OH)) ——→ γ - Fe₂O₃ + H₂O (2.2)


    - Cu₂O ——→ CuO (增重) 或 CuO ——→ Cu₂O (失重) (2.3)


    考虑到 222°C 后，被测样品仅失重 15.38% 的测量结果。我们认为既然反应中 NiO、ZnO 没有质量变化且忽略 CuO 的反应中重量的变化，那么反应前后物质失重只与
    FeO(OH) ——→ Fe₂O₃ 反应相关。可以粗略估计：因生成一克分子 Fe₂O₃ 需二克分子 FeO(OH)，则可能的失重百分比为：


    ```

    1 - [Fe₂O₃ 分子量] / [2 · (FeO(OH)) 分子量 + 其他可挥发物质总分子量]

    = 1 - 160 / (178 + X) = 15.38 wt%

    (2.4)

    ```


    由式 (2.4) 可见，只要假定“其他可挥发物质”分子量 X = 11 就可以得到失重百分比。由此可以算出这些“其他可挥发物质分子量”只占总反应物质分子量的
    4%！因此我们认为，待硝化类含能物质在 222°C 左右分解基本完成后，后阶段失重主要是脱羟基水形成的。此时剩余物质中存在大量的 FeO(OH)，在有空气的情况下，适量的氧气可能会加速
    FeO(OH) 脱羟基水转换，而无氧时这个反应过程则较慢。其反应过程：硝酸盐柠檬酸干凝胶 ——→ 100°C 脱去吸附水和自由柠檬酸基 ——→ 200°C
    干凝胶有机络合物聚合、自燃 ——→ 200 ~ 500°C FeO(OH) 脱结构水并与纳米晶金属氧化物固相反应合成尖晶石型 NiZn 铁氧体。


    ## 2.3.4 综合热分析


    图 2.8 样品的 DSC 曲线表明，在氮气、空气中 144.3℃附近都有一个明显的吸热峰，并伴随有重量损失，显然是物质的脱水和分解反应；约在 197℃出现很尖锐的放热峰，伴有很大的质量减少，这与硝基、硝化类含能物质的迅速分解、燃烧反应对应。氮气中
    217.8℃处 DSC 曲线出现的小放热效应伴有少量质量增加，这里应该有物质氧化反应，但是在相同温度的空气中的 DSC 曲线没有这样的变化。在此后的升温过程中，氮气中和空气中的
    DSC 曲线都出现了缓慢的放热峰并伴有质量的损失，意味着金属氧化物生成尖晶石（AB₂O₄）的固-固相反应进程，在氮气中反应较慢，在空气中反应较快。空气中 398～450℃处
    DSC 曲线较强的双肩放热峰并伴有较快的质量损失可能是固相反应比较激烈，大量金属离子变价、形成尖晶石（AB₂O₄）结构而造成的。其中 Cu₂O ——>CuO
    的氧化反应也可能加强双肩放热峰。在氮气情况下 DSC 曲线单调下降，仅呈现缓慢的放热大峰，无明显放热峰出现。


