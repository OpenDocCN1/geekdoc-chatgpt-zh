    \ 1)\n        mask_graph_indicator = graph_indicator[mask]\n        # 更新图结构\n\
    \        mask_adjacency = filter_adjacency(adjacency, mask)\n        return hidden,\
    \ mask_graph_indicator, mask_adjacency\n```\n\n---\n\n要进行图分类，还需要全局的池化操作，它将节点数不同的图降维到同一维度。常见的全局池化方式包括取最大值或者均值。下面是这两种方式的实现代码，如代码清单\
