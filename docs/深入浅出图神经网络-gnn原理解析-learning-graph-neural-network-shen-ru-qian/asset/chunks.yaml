    AlexNet由5个卷积层、2个池化层、3个全连接层组成。受限于当时的硬件条件，单个GPU上无法运行这种规模的模型，因此作者将模型进行了拆分并分别放在两个GPU上运行，为了方便介绍，我们将结构进行了融合，如图3-7所示，下面我们来看每一层的具体情况。


