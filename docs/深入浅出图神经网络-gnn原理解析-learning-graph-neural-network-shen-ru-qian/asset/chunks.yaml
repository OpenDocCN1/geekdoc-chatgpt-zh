    `DIFFPOOL`具有排列不变性：假设`P∈{0,1}^(n×n)`是一个任意的排列矩阵，只需要保证前面用到的`GNN`层是排列不变的，`DIFFPOOL`层就具有排列不变性，即：


    ![](Images/161-3-i.jpg)


    排列矩阵的作用是对图中节点进行重排序，比如一个仅有两个节点相连的图，如果我们需要将两个节点的编号进行对调，则对应的排列矩阵`P=[[0,1],[1,0]]`，排列矩阵是正交的，即`P^TP=I`。我们可以通过`PX`、`PAP^T`来分别获得重排序之后的特征矩阵与邻接矩阵。


    证明：假设我们用到的`GNN`模型是`GCN`模型，`GCN`模型是满足排列不变的。设`GCN`的输出`Z=GCN(A,X)`，现在使用`P`对输入进行重排序，则：


    ![](Images/161-6-i.jpg)


    这里用到了`P^TP=I`的性质。由此可知，对`GCN`输入节点的顺序进行重排列，输出节点的顺序也会对应排列，但节点输出的表达向量并不会改变。因此，`GCN`是具有排列不变性的（也有称这种性质为排列等变性的，这是由于`GCN`所使用的聚合操作是排列不变的，可参考7.1节的相关内容）。


    接着将此时`GCN`的各个输出值代入`DIFFPOOL`的式（8.7）、式（8.8）中，得到：


    ![](Images/162-i.jpg)


    从所得结果可以看出来，这种重排列操作并没有改变`DIFFPOOL`的两个输出结果。于是式（8.9）得证。


    总的来说，如果我们将`GCN`与`DIFFPOOL`合在一起看成一个层，对输入的图数据进行任意的重新编号，输出到下一层的特征矩阵与邻接矩阵并不会改变，这种性质是非常符合直觉的：节点是否重新排序并不应该影响节点聚合成簇的结果。


    有了上述`DIFFPOOL`层的定义，我们就可以模仿`CNN`分类模型的结构设计，不断组合堆叠`GNN`层与`DIFFPOOL`层，实现一种可导的、层次化池化的学习机制，并逐渐获得图的全局表示。可能的图分类模型的结构在图8-2中已经给出，这里不再赘述。


    [\[1\]](#chapter93.xhtml#ch1) Ying Z，You J，Morris C，et al.Hierarchical graph representation
    learning with differentiable pooling\[C\]//Advances in Neural Information Processing
    Systems.2018：4800-4810.


    #### 3. EigenPooling


    `EigenPooling`[^(\[3\])](../Text/chapter97.xhtml#hh-3)也是一种基于图坍缩的池化机制，但是不同于本章介绍的其他方法，`EigenPooling`没有对图分类模型引入任何需要学习的参数，这种非参的池化机制与视觉模型中的各类池化层具有很高的类比性，如表8-1所示：


    表8-1 EigenPooling与视觉模型中的池化比较


    ![](Images/8b1.jpg)


    从表8-1中我们可以再一次看到，`GNN`模型与`CNN`模型其实是殊途同归的。回到`EigenPooling`的具体过程中，其核心步骤在于作用域的选取以及池化操作，作用域是通过划分子图的方式对图进行分区得到的，这等价于图坍缩的过程，通过这一步可以得到新的超级节点之间的邻接矩阵，池化操作需要考虑的是对作用域内的信息进行融合，通过这一步可以得到关于新的超级节点的特征矩阵。值得注意的是，在视觉模型中的池化操作的作用域都是规则的栅格结构，比如`2×2`大小的滑窗，滑窗之间没有结构性的区别，而在图坍缩的子图上，作用域内的信息包含了结构信息与属性信息，特别是结构信息，不同的子图间有比较大的区别，因此结构信息的提取也是一个需要重点考虑的问题，`EigenPooling`就同时考虑了这两种信息并进行了融合。下面对上述两个步骤进行详细讲解。


    （1）图坍缩


    与`DIFFPOOL`通过学习出一个簇分配矩阵来进行子图划分不同的是，`EigenPooling`中的图坍缩并没有给图分类模型引进任何需要学习的参数，其思路是借用一些图分区的算法来实现图的划分，比如选用谱聚类算法[^(\[4\])](../Text/chapter97.xhtml#hh-4)。谱聚类是一类比较典型的聚类算法，其基本思路是先将数据变换到特征空间以凸显更好的区分度，然后执行聚类操作（比如选用`Kmeans`算法进行聚类），算法的输入是邻接矩阵以及簇数`K`，输出的是每个节点所属的簇。值得注意的是，这里如果选用`Kmeans`算法进行聚类，那么簇的分配就是一种硬分配，每个节点仅能从属于一个簇，这种硬分配机制保持了图坍缩之后的超级节点之间连接的稀疏性，与之相对的是`DIFFPOOL`中的软分配机制，节点以概率的形式分配到每一个簇中，导致超级节点之间以全连接的形式彼此相连，大大增加了模型的空间复杂度与时间复杂度。


    将图进行划分之后，我们调用式（8.2）就可以得到超级节点间的邻接关系，当然，`EigenPooling`在这一步并没有考虑超级节点簇内的连接强度。


    （2）池化操作


    在确定了子图划分以及相应的邻接矩阵之后，我们需要对每个子图内的信息进行整合抽取。在`DIFFPOOL`中选择了对节点特征进行加和，这种处理方式损失了子图本身的结构信息。而`EigenPooling`用子图上的信号在该子图上的图傅里叶变换来代表结构信息与属性信息的整合输出。从第5章的学习中我们知道，图信号的频谱展示了图信号在各个频率分量上的强度，它是将图的结构信息与信号本身的信息统一考虑进去，而得到的一种关于图信号的标识信息。因此，`EigenPooling`选用了频谱信息来表示子图信息的统一整合。下面给出其具体计算过程：


    假设子图`G^(k)`的拉普拉斯矩阵为`L^(k)`，对应的特征向量为`U^(k)`，然后，使用上采样算子`C^(k)`将该特征向量（子图上的傅里叶基）上采样到整个图：


    ![](Images/164-2-i.jpg)


    为了将上述操作转换成矩阵形式，以得到池化算子`Θ[l]∈R^(N×K)`，我们将所有子图的第`l`个特征向量按行方向组织起来形成矩阵`Θ[l]`，即：


    ![](Images/164-3-i.jpg)


    需要注意的是，子图的节点数量是不同的，所以特征向量的数量也不同。用`N[max]`表示子图中的最大节点数。然后，若子图`G^(k)`的节点数小于`N[max]`，可以将`U^(k)[l]`设置为`0`。有了池化算子的矩阵形式，池化过程可描述如下：


    ![](Images/164-7-i.jpg)


    `X[l]∈R^(K×d)`是池化的结果。`X[l]`的第`k`行表示的是第`k`个超级节点在`Θ[l]`作用下的表示向量。按照该机制，我们共需要设计`N[max]`个池化算子。为了结合不同池化算子收集到的信息，我们可以采用按列方向拼接的方式，将各个结果连接起来：


    ![](Images/164-8-i.jpg)


    其中`X_EigenPooling`是`EigenPooling`最终的池化结果。同第6.3节中论述的一样，作者在该文中也论证了现实场景下的图数据中低频信息的有效性。因此，为了提高计算效率，我们可以选择使用前`H`个特征向量对应的池化结果，一般为`H《N[max]`：


    ![](Images/164-10-i.jpg)


    上述计算都在矩阵层面进行，如果将计算回到向量形式上，我们可以更加清楚地看出`EigenPooling`是怎么利用图傅里叶变换对子图信息进行整合的。不失一般性，设全图上的信号为`x`，则式（8.15）可描述为：


    ![](Images/165-i.jpg)


    其输出表示子图上的信号在子图上对应的第`l`个特征向量上的傅里叶系数。式（8.16）的操作过程如图8-3所示：


    ![](Images/8a3.jpg)


    图8-3 EigenPooling中子图上的图傅里叶变换


    图8-3中原图被划分成蓝、红两个子图，由于`N[max]=4`，所以输出矩阵为`R^(2×4)`，每行表示的是在该子图信号上的前4个图傅里叶系数。


    同`DIFFPOOL`一样，如果`EigenPooling`的前置`GNN`层选用`GCN`的话，`EigenPooling`整体也将具有排列不变性，具体证明可以从`GCN`、图坍缩、池化操作3个过程着手，其证明过程与`DIFFPOOL`的证明类似，这里不再赘述。


    总的来说，`EigenPooling`作为一种不带任何学习参数的池化机制，可以非常方便地整合到一般的`GNN`模型中，实现对图信息的层次化抽取学习。与`DIFFPOOL`相比，其主要优势在于保持了超级节点之间连接的稀疏性，提高了计算效率，同时在进行池化操作时，兼顾了子图内的结构信息与属性信息，这种做法显然更加合理。


