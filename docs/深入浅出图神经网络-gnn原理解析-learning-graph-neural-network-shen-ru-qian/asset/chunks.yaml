    ## 2.4 Training Neural Networks


    How to train neural networks efficiently was one of the difficulties encountered
    in early neural network research. The proposal of the backpropagation method[⁶]
    solved this problem. It rapidly computes parameter gradients based on the chain
    rule, then uses gradient descent algorithms for parameter updates. This section
    will introduce the operation process of neural network models, then detail the
    backpropagation algorithm, and finally introduce the challenges faced in neural
    network optimization with large-scale parameters.


    ### 2.4.1 Operation Process of Neural Networks


    The operation process of neural networks is divided into three steps: forward
    propagation, backpropagation, and parameter updates. Model parameters are updated
    through continuous iteration to mine valuable information from data, as shown
    in Figure 2-8.


    1. **Forward Propagation**: Given inputs and parameters, compute layer by layer
    forward, finally outputting prediction results;

    2. **Backpropagation**: Based on the prediction results obtained from forward
    propagation, obtain the loss value using the loss function, then compute the gradients
    of relevant parameters. This computation method is called backpropagation (`back-propagation`),
    specific details will be introduced later;

    3. **Parameter Update**: Use the gradient descent algorithm to update parameters,
    repeat the above process, iterate gradually, until the model converges.


    ![](img/2a8.jpg)


    Figure 2-8 Operation Process of Neural Networks


    ### 2.4.2 Backpropagation


    We take the Multilayer Perceptron (MLP) as an example to introduce the backpropagation
    algorithm. Given a sample `(x, y)`, forward propagation can be performed using
    the message passing formula of the MLP, this process can be represented by Figure
    2-9.


    ![](img/2a9.jpg)


    Figure 2-9 Schematic Diagram of MLP Computation


    Given sample `(x, y)`, forward propagation yields output `ŷ`, the corresponding
    loss value is `L`. Next, we seek the gradient of the parameter matrix `W^(l)`,
    `∂L/∂W^(l)`. Using the chain rule, we can obtain Equation (2.21).


    ![](img/035-5-i.jpg)


    We define `δ^(l) = ∂L/∂z^(l)` as the error term, which measures the influence
    of `z^(l)` on the loss value. Further using the chain rule, we can obtain Equation
    (2.22).


    ![](img/035-7-i.jpg)


    Based on the formulas `z^(l+1) = W^(l+1)a^(l) + b^(l)` and `a^(l) = σ(z^(l))`,
    transformation yields Equation (2.23).


    ![](img/035-8-i.jpg)


    Where `σ''(z^(l))` is the derivative of the activation function, `⊙` denotes the
    Hadamard product, a binary operator for element-wise multiplication. From Equation
    (2.23), it can be seen that the error of layer `l` is related to the error of
    layer `l+1`, which is the origin of backpropagation.


    Then for `∂L/∂W^(l)`, Equation (2.24) can be obtained:


    ![](img/035-10-i.jpg)


    The derivative of the bias term `b^(l)` is shown in Equation (2.25):


    ![](img/036-i.jpg)


    ### 2.4.3 Optimization Dilemmas


    For deep neural networks, although backpropagation can efficiently compute gradients,
    as the number of stacked layers and model parameter scale increase, it also brings
    some severe problems to model optimization.


    #### 1. Vanishing Gradients


    From Equation (2.23), it can be seen that the error of layer `l` is obtained by
    weighting the error of layer `l+1` with the weights between the two layers, and
    then multiplying by the derivative of the activation function. If the activation
    function uses `Sigmoid`, its derivative is `σ''(x) = σ(x)(1-σ(x))`. Since `σ(x)
    ∈ (0, 1)`, the maximum value of its derivative is `σ''(x) = 0.25`. As the number
    of layers increases, the error of the last layer will decay rapidly in the preceding
    layers. This causes the gradient values near the input layer to be very small,
    making parameters almost unable to update effectively. In the next forward propagation,
    since the parameters of the preceding layers cannot effectively obtain valuable
    information from the data for use by subsequent layers, the model becomes difficult
    to train effectively. This phenomenon is called the vanishing gradient problem.


    The cause of vanishing gradients lies in the saturation of activation functions.
    For example, `Sigmoid`, `Tanh`, etc., all bring this problem. When their function
    values approach the upper and lower boundaries, the gradients are usually small.
    Multiplying them with the error term makes them even smaller. Multiple backpropagations
    will cause the gradient values to continuously decrease. Figure 2-10 shows the
    2-norm of the weights `W` of each layer during the training process of a 5-layer
    MLP. It can be seen that the closer to the input layer, the smaller its value.
    This is the manifestation of vanishing gradients. Therefore, current neural networks
    usually use the `ReLU` activation function.


    #### 2. Local Optima and Saddle Points


    Due to the complex non-linear relationships and high parameter dimensions of neural
    networks, although loss functions are usually convex, the relationship between
    the loss function and parameters is non-convex, as shown in Figure 2-11a. Deep
    neural models have a very large number of local optima. When falling into a local
    optimum, model optimization becomes very difficult. However, deep neural network
    models usually have many local optima, and often these local optimal solutions
    can guarantee model performance[⁷].


    ![](img/2a10.jpg)


    Figure 2-10 Schematic Diagram of Vanishing Gradients


    Another problem is that due to excessively high dimensions, deep neural network
    models also often have many saddle points. A saddle point refers to a point where
    the gradient is 0 (as shown in Figure 2-11b), but it is neither a minimum nor
    a maximum. Usually, the challenge brought by saddle points is much greater than
    that of local optima. When in a saddle point region and the error is large, because
    this region is relatively "flat", the gradient value is small, the model convergence
    speed will be greatly affected, creating an illusion of falling into a local optimum.


    ![](img/2a11.jpg)


    Figure 2-11 Visualization Results of Loss Function[⁸]


