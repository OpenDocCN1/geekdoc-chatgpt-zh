    刘忠雨　李彦霖　周洋　著\n\nISBN：978-7-111-64363-0\n\n本书纸版由机械工业出版社于2020年出版，电子版由华章分社（北京华章图文信息有限公司，北京奥维博世图书发行有限公司）全球范围内制作与发行。\n\
