    ### 9.2.2　基于对比损失的GNN


    对比损失是无监督表示学习中另一种十分常见的损失函数。通常对比损失会设置一个评分函数D（.），该得分函数会提高“真实”（或正）样本（对）的得分，降低“假”（或负）样本（对）的得分。


    类比词向量，我们将对比损失的落脚点放到词与上下文上。词是表示学习的研究主体，这里自然代表图数据中的节点，上下文代表与节点有对应关系的对象。通常情况下，图里的上下文从小到大依次可以是节点的邻居、节点所处的子图、全图。作为节点与上下文之间存在的固有关系，我们希望评分函数提高节点与上下文对的得分，同时降低节点与非上下文对的得分。可以表示为式（9.11）：


    ![](Images/185-i.jpg)


    其中c表示上下文的表示向量，![](Images/185-1.jpg)表示非上下文的表示向量。下面我们依次来看看该损失函数在不同上下文时的具体形式。


    1.邻居作为上下文


    如果把邻居作为上下文，那么上述对比损失就在建模节点与邻居节点的共现关系。在GraphSAGE的论文中就描述了这样一种无监督学习方式，与DeepWalk一样，我们可以将在随机游走时与中心节点v[i]一起出现在固定长度窗口内的节点v[j]视为邻居，同时通过负采样的手段，将不符合该关系的节点作为负样本。与DeepWalk不同是，节点的表示学习模型仍使用GNN，即：


    ![](Images/185-2-i.jpg)


    这里的p[n]是一个关于节点出现概率的负采样分布，得分函数使用向量内积加sigmoid函数，将分数限制在\[0，1\]内。这个方法在优化目标上与图自编码器基本等同，但是这种负采样形式的对比优化并不需要与图自编码器一样显式地解码出邻接矩阵![](Images/a-1.jpg)，由于![](Images/a-1.jpg)破坏了原始邻接矩阵的稀疏性，因此该方法不需要承担O（N²）的空间复杂度。


    2.将子图作为上下文


    将邻居作为上下文时，强调的是节点之间的共现关系，这种共现关系更多反映了图中节点间的距离远近，缺乏对节点结构相似性的捕捉。而通常节点局部结构上的相似性是节点分类任务中一个比较关键的因素[^(\[9\])](../Text/chapter104.xhtml#ii-9)。比如图上两个相距很远的节点如果具有一样的子图结构，基于共现关系的建模方法就难以有效刻画这种结构上的对等性。因此，论文[^(\[10\])](../Text/chapter104.xhtml#ii-10)就提出直接将子图作为一种上下文进行对比学习。具体子图的定义如图9-3所示：


    ![](Images/9a3.jpg)


    图9-3　将子图作为上下文进行预测^([\[1\]](#chapter102.xhtml#ch1_back))


    对于一个中心节点，如图9-3中的红色节点所示，我们用一个GNN在其K阶子图上提取其表示向量，同时我们将处于中心节点r[1]–hop与r[2]–hop之间的节点定义为该中心节点的上下文锚点，如图9-3所示。设K=2，r[1]\=1，r[2]\=4，我们用另一个GNN来提取每个节点作为上下文锚点时的表示向量，同时为了得到一个总的、固定长度的上下文表示向量，我们使用读出机制来聚合上下文锚点的表示向量。用公式表示如下：


    ![](Images/186-2-i.jpg)


    3.全图作为上下文


    在引文^([\[2\]](#chapter102.xhtml#ch2_back))中提出了Deep Graph Infomax（DGI）[^(\[11\])](../Text/chapter104.xhtml#ii-11)的方法对图数据进行无监督表示学习。该方法实现了一种节点与全图之间的对比损失的学习机制。其具体做法如下：


    ![](Images/187-i.jpg)


    首先为了得到负采样样本，需要对图数据进行相关扰动，得到（X[currupt]、A[currupt]）具体的加噪方法上文中已有概括。然后将这两组图数据送到同一个GNN模型中进行学习。为了得到图的全局表示，我们使用读出机制对局部节点的信息进行聚合。在最后的损失函数中，作者固定了全图表示，对节点进行了负采样的对比学习。这样处理是为了方便后续的节点分类任务。从互信息[^(\[12\])](../Text/chapter104.xhtml#ii-12)[^(\[13\])](../Text/chapter104.xhtml#ii-13)的角度来看，通过一个统一的全局表示最大化全图与节点之间的互信息，这样可以在所有节点的表示之间建立起一层更直接的联系。比如上面提到的相距较远的节点之间的结构相似性的学习问题，这种设计可以保障该性质的高效学习。图9-4为上述过程的示意图：


    ![](Images/9a4.jpg)


    图9-4　节点与全图对比损失学习机制^([\[3\]](#chapter102.xhtml#ch3_back))


    同时在全图层面的无监督学习上，上述损失函数的负样本刚好相反，需要抽取其他图的表示![](Images/187-3-i.jpg)来代替，即：


    ![](Images/187-4-i.jpg)


    此时，由于是全图层面的任务，所以我们希望通过上式让全图与其所有局部节点之间实现互信息最大化，也即获得全图最有效、最具代表性的特征，这对图的分类任务十分有益。


