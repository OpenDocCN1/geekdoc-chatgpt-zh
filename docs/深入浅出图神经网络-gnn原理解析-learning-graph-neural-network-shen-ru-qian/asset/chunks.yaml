    # Chapter 4 Representation Learning


    What is representation? In simple terms, it refers to features. In the machine
    learning workflow mentioned in Chapter 2, the first step of machine learning is
    to extract features from data, and the quality of the extracted features largely
    determines the quality of the model results. If there exists a class of methods
    that can automatically learn "useful" features from data and use them directly
    for subsequent specific tasks, these methods are collectively called **representation
    learning**.


    ## 4.1 Representation Learning


    ### 4.1.1 The Significance of Representation Learning


    The performance of machine learning algorithms heavily depends on data features.
    Therefore, in traditional machine learning, most of the work lies in data processing
    and transformation, hoping to obtain good features that make machine learning
    algorithms more effective. Such **feature engineering** is extremely time-consuming
    and laborious, which also exposes the problems existing in traditional machine
    learning methods: these methods lack the ability to acquire useful knowledge from
    data, and the purpose of feature engineering is to convert human prior knowledge
    into features recognizable by machine learning algorithms to compensate for their
    own shortcomings.


    If there exists a method to obtain discriminative features from data, it would
    reduce the dependence of machine learning algorithms on feature engineering, thereby
    enabling faster and better application of machine learning to more fields. This
    is the value of representation learning. For representation learning, the following
    three questions need to be answered:


    1.  How to judge whether one representation is better than another?

    2.  How to discover these representations?

    3.  What kind of objective should be used to obtain a good representation?


    What is a good representation? There is no fixed standard for this question. Generally
    speaking, a good representation should first contain as much essential information
    of the data as possible, and this representation should be able to directly serve
    subsequent specific tasks. What computers "see" is different from what the human
    eye sees. For example, for images, computers see individual pixels, which is the
    most raw data; focusing on these pixels alone yields very little information.
    Humans, when judging image content, use high-level abstract semantic features.
    The gap between these two is called the **semantic gap**, which refers to the
    discrepancy between low-level features and high-level abstract features, as shown
    in Figure 4-1. A good representation needs to describe high-level abstract features
    as much as possible so that subsequent models can efficiently utilize these features,
    reducing the "burden" on subsequent models. Otherwise, using raw data or low-level
    features as input for subsequent models would make them very difficult to run.
    Therefore, a good representation should minimize this semantic gap and provide
    valuable high-level features.


    ![](img/4a1.jpg)


    Figure 4-1 Schematic diagram of the semantic gap


    ### 4.1.2 Discrete Representation and Distributed Representation


    In machine learning, there are two common ways to represent an object. The simplest
    way, which requires no learning, is **one-hot encoding** (`one-hot`). It represents
    the object of study as a vector where the value is 1 in only one dimension and
    0 in all others. One can imagine that the length of this vector equals the number
    of categories. For example, to vectorize Chinese characters using this method,
    assuming there are N Chinese characters, each character would need an N-dimensional
    vector, requiring a total matrix of size N×N to cover all characters. In Natural
    Language Processing (NLP), the **bag-of-words model** is built on this basis.


    **Distributed representation** [¹] is different. It represents the object of study
    using a low-dimensional dense vector obtained through some method. The most typical
    example is color. We know any color can be obtained by mixing three primary colors:
    red, yellow, and blue (or RGB in computers). Computers usually use the `RGB` method
    to represent color as a triplet. The `RGB` color space can be represented as in
    Figure 4-2. For example, pink, light pink, and deep pink are represented in `RGB`
    as `(255, 182, 193)`, `(255, 192, 203)`, `(255, 20, 147)` respectively. If one-hot
    encoding were used to represent these colors, for 256-level `RGB`, there are about
    16.78 million colors (`256³ = 16777216`), so the one-hot vector would need 16,777,216
    dimensions, with only one position having a value of 1. The data would be extremely
    high-dimensional and sparse.


    ![](img/4a2.jpg)


    Figure 4-2 Color space


    One-hot encoding is very simple; it only requires listing all possible values,
    with no learning process required. However, its disadvantages are also very obvious:
    it assumes all objects are independent of each other. In the vector space, the
    vectors of all objects are orthogonal to each other, so the similarity between
    any two is 0, meaning these objects have no relationship whatsoever. But real
    life is not like this. For example, pink and light pink both belong to the pink
    family, so their similarity should be higher than that between pink and black.
    However, one-hot encoding cannot reflect this; it loses a large amount of semantic
    information. Additionally, one-hot vectors can have very high dimensions and be
    very sparse, making them difficult to use directly.


    Distributed representation, on the other hand, exhibits excellent properties.
    On one hand, the dimension of distributed representation can be very low; three
    dimensions can represent 16.78 million colors, effectively solving the data sparsity
    problem. On the other hand, it can retain some semantic information. For example,
    the cosine similarity between pink and light pink and deep pink can be calculated
    as 99.97% and 89.39% respectively, while the similarity with black (`RGB` `(0,
    0, 0)`) is 0. This is consistent with our cognition, meaning distributed representation
    can contain semantic features, which is why it is applied in many fields.


    [¹]: Reference link: ../Text/chapter55.xhtml#dd-1


    ### 4.1.3 End-to-End Learning is a Powerful Representation Learning Method


    Deep learning models differ from traditional machine learning models. For example,
    for an image classification task, traditional machine learning requires manual
    extraction of descriptive features, such as `SIFT` features (the feature engineering
    mentioned earlier), and then uses a classifier to determine the image category.
    The model performance largely depends on the quality of the extracted features.
    Using Convolutional Neural Networks (CNNs) can solve this problem. For instance,
    `AlexNet` takes raw images as input, not features obtained from feature engineering,
    and the output is directly the predicted category. This learning method is called
    **end-to-end learning** (`end-to-end learning`). For the above example, we can
    understand it this way: the front part of the convolutional network mainly performs
    automatic feature extraction, then feeds the extracted features into the classifier
    for classification. In other words, the front part of the convolutional network
    can be seen as performing representation learning. That is, `end-to-end learning`
    can be viewed as a combination of representation learning and task learning, but
    they are not completely separated. Specifically, they are **jointly optimized**.
    The backpropagation algorithm propagates the error from the output layer forward
    to the input layer, and the optimization algorithm dynamically adjusts model parameters,
    allowing the model to automatically extract discriminative features relevant to
    the task. This demonstrates the superiority of deep learning models compared to
    other methods.


