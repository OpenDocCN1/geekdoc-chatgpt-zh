    # 第2章 神经网络基础


    近几年，随着算法的改进、数据量的爆发、算力的提升，机器学习和深度学习得到了快速发展。本章将从机器学习的基本概念出发，介绍什么是机器学习以及如何得到机器学习的模型。然后介绍深度学习模型的基本组成单元—神经元模型和以它为基础构建的多层感知器模型。我们还将以多层感知器为例，介绍深度学习中的反向传播算法和优化方法。


    ## 2.1 机器学习基本概念


    ### 2.1.1 机器学习分类


    机器学习是一门多领域交叉学科，涉及概率论、统计学、逼近论、凸分析、计算复杂性理论等多门学科。机器学习理论主要是设计和分析一些让计算机可以自动“学习”的算法。通俗地说，机器学习是让计算机从数据中去挖掘有价值的信息。


    从不同的维度来分，机器学习可以有不同的分类。下面简要介绍几种常见的分类方法。


    根据训练数据是否有标签，机器学习可以分为监督学习、半监督学习和无监督学习。


    **监督学习**：指的是训练数据中每个样本都有标签，通过标签可以指导模型进行训练，学到具有判别性的特征，从而能够对未知样本进行预测。比如图像分类比赛ImageNet，通过利用每张图像已有的标签训练模型，使得模型可以对未知的图像进行预测，得到相应的分类结果。


    **无监督学习**：指的是训练数据完全没有标签，通过算法从数据中发现一些数据之间的约束关系，比如数据之间的关联、距离关系等。典型的无监督算法如聚类，根据一定的度量指标，将“距离”相近的样本聚集在一起。


    **半监督学习**：指的是介于监督学习和无监督学习之间的一种学习方式。它的训练数据既包含有标签数据，也包含无标签数据。假设如果标签数据和无标签数据都是从同一个分布采样而来，那无标签数据中含有一些数据分布相关的信息，可以作为标签数据之外的补充。这种情况在现实中是非常常见的。比如在互联网行业，每天会产生大量的数据，这些数据部分可能携带标签，但更多的数据是不带标签的，如果靠人工去标记这些无标签数据，代价是相当大的，而半监督学习可以提供一些解决思路。


    从算法输出的形式上来分，可以分为分类问题和回归问题，这两类问题都属于监督学习的范畴。

    '
  trans: '

    ### Scene Graph


    A scene graph is a method for describing image semantics. It treats objects in
    an image as nodes and the mutual relationships between objects as edges, forming
    a graph. A scene graph can simplify an image with complex relationships into a
    semantic graph with explicit relationships. Scene graphs have powerful application
    scenarios, such as image synthesis, image semantic retrieval, and visual reasoning.
    Figure 1-10(e) shows an example of synthesizing a semantic image from a scene
    graph. In this scene graph, five objects are described: two men, a child, a frisbee,
    a courtyard, and the relationships among them. It can be seen that the scene graph
    has strong semantic representation capabilities.


    ### Circuit Design Diagram


    We can abstract electronic components, such as resonators, as nodes, and the wiring
    between components as edges, thereby representing circuit design as a form of
    graph data. In reference [^([\[1\]](#chapter8.xhtml#ch1_back))], circuit design
    is abstracted in this way, as shown in Figure 1-10(f). Then, based on Graph Neural
    Network technology, the electromagnetic characteristics of the circuit are simulated
    and fitted. Compared to rigorous electromagnetic formula simulation, this can
    greatly accelerate the design of high-frequency circuits within an acceptable
    error range.


    The application scenarios of graph data go far beyond these. There are also computation
    graphs describing the computational processes of neural networks, sensor array
    networks, and the Internet of Things composed of various smart sensors. In fact,
    if one wants to find a most representative data description language corresponding
    to real-world data, graphs should be the most competitive candidate. In summary,
    graph data applications have a wide span and diverse scenarios; researching graph
    data has broad and significant practical significance.


    [\[1\]](#chapter8.xhtml#ch1) Zhang G, He H, Katabi D. Circuit-GNN: Graph Neural
    Networks for Distributed Circuit Design[C]//International Conference on Machine
    Learning. 2019: 7364-7373.


    ## 1.4 Deep Learning on Graph Data


    As an important data type, the demand for analysis and learning of graph data
    is increasingly prominent. Many Graph Learning theories focus on task learning
    related to graph data. Spectral Graph Theory[^(\[2\])](../Text/chapter10.xhtml#aa-2)
    is a theory combining graph theory and linear algebra. Spectral clustering algorithms[^(\[3\])](../Text/chapter10.xhtml#aa-3)
    developed based on this theory can be used to solve graph partitioning or node
    clustering problems. Statistical Relational Learning (SRL)[^(\[4\])](../Text/chapter10.xhtml#aa-4)
    is a machine learning theory combining relational representation and likelihood
    representation. Unlike traditional machine learning algorithms that assume data
    is Independent and Identically Distributed (i.i.d., meaning data objects are of
    the same class and independent/uncorrelated), SRL breaks these two assumptions
    about data, making it a better fit for learning on graph data. To better fit heterogeneous
    graph data in real-world scenarios, Heterogeneous Information Network (HIN) analysis[^(\[5\])](../Text/chapter10.xhtml#aa-5)
    was proposed to mine more comprehensive structural information and rich semantic
    information in heterogeneous graphs. Due to the tremendous achievements of deep
    learning in practical application fields in recent years, the concepts of representation
    learning and end-to-end learning have gained increasing attention. To learn vectorized
    representations containing sufficient information from complex graph data, a large
    number of Network Embedding[^(\[6\])](../Text/chapter10.xhtml#aa-6) methods have
    emerged. However, network embedding struggles to provide an end-to-end system
    combining representation learning and task learning. Based on this, end-to-end
    learning systems for graph data remain an important research topic.


    Due to the complexity of the structure of graph data itself, it is not intuitive
    to directly define a set of differentiable computational frameworks supporting
    it. Data corresponding to graph data include images, speech, and text. These data
    are regularized structural data defined in Euclidean space. The tensor computation
    system based on these data is relatively natural and efficient. Figure 1-11 gives
    a comparison between graph data and several other common data types. Image data
    exhibits a regular 2D grid structure, which corresponds well with the operating
    mechanism of Convolutional Neural Networks. Text data is a regular sequence data,
    and this sequential structure corresponds to the operating mechanism of Recurrent
    Neural Networks.


    ![](img/1a11.jpg)


    Figure 1-11　Image, Speech, and Text Data Types[^(\[1\])](#chapter9.xhtml#ch1_back)


    Inspired by the definition of graph signal convolution filtering in Graph Signal
    Processing[^(\[7\])](../Text/chapter10.xhtml#aa-7), a neural network theory based
    on graph convolution operations and continuously derived has been developed in
    recent years. This book collectively refers to this class of methods as Graph
    Neural Networks (GNN[^(\[8\])](../Text/chapter10.xhtml#aa-8)[^(\[9\])](../Text/chapter10.xhtml#aa-9)[^(\[10\])](../Text/chapter10.xhtml#aa-10)).
    Below we briefly describe its development history.


    In 2005, Marco Gori et al. published a paper[^(\[11\])](../Text/chapter10.xhtml#aa-11),
    proposing the concept of Graph Neural Networks for the first time. Before this,
    methods for processing graph data converted graphs into a set of vectors during
    the data preprocessing stage. The biggest problem with this processing method
    is that structural information in the graph may be lost, and the results obtained
    would heavily depend on the preprocessing of the graph. The proposal of GNNs was
    to enable the learning process to be directly architected on graph data.


    Subsequently, in two papers in 2009[^(\[12\])](../Text/chapter10.xhtml#aa-12)[^(\[13\])](../Text/chapter10.xhtml#aa-13),
    they further elaborated on Graph Neural Networks and proposed a supervised learning
    method to train GNNs. However, these early studies all used an iterative approach,
    propagating neighbor information through Recurrent Neural Networks until a stable
    fixed state was reached to learn node representations. This computation method
    consumes significant resources, and related research began to focus on how to
    improve this method to reduce computational cost.


    Around 2012, Convolutional Neural Networks began to achieve remarkable results
    in the vision field, prompting people to consider how to apply convolution to
    Graph Neural Networks. In 2013, Bruna et al. first introduced convolution into
    Graph Neural Networks. In reference [\[14\]](../Text/chapter10.xhtml#aa-14), a
    Graph Convolutional Network model was developed based on the concept of spectral
    convolution operations, applying learnable convolution operations to graph data
    for the first time. Since then, many have proposed improvements and extensions
    to this spectral-based graph convolutional neural network model. However, spectral
    convolution methods require processing the entire graph simultaneously during
    computation and bear the high time complexity of matrix decomposition, making
    it difficult to scale the learning system to large-scale graph data learning tasks.
    Therefore, spatial-based graph convolution was proposed and gradually became popular.


    In 2016, Kipf et al.[^(\[15\])](../Text/chapter10.xhtml#aa-15) simplified the
    definition of spectral graph convolution, enabling graph convolution operations
    to be performed in the spatial domain. This greatly improved the computational
    efficiency of graph convolution models. Simultaneously, benefiting from the efficiency
    of convolution filtering, graph convolution models achieved remarkable results
    on multiple graph data-related tasks.


    In recent years, more variants of neural network models based on spatial graph
    convolution[^(\[16\])](../Text/chapter10.xhtml#aa-16)[^(\[17\])](../Text/chapter10.xhtml#aa-17)[^(\[18\])](../Text/chapter10.xhtml#aa-18)
    have been developed. We collectively refer to this class of methods as GNNs. The
    emergence of various GNN models has greatly enhanced the adaptability of learning
    systems to various types of graph data, laying a solid foundation for task learning
    on various graph data.


    Since then, graph data and deep learning have had their first truly meaningful
    combination. The emergence of GNNs realized end-to-end learning for graph data,
    providing a highly competitive learning solution for tasks in numerous application
    scenarios of graph data.


    Below, we give a classification of graph data-related tasks.


    ### 1. Node-Level Tasks


    Node-level tasks mainly include classification and regression tasks. Although
    these tasks predict properties at the node level, the model should obviously not
    be built on individual nodes alone; the relationships between nodes also need
    to be considered. There are many node-level tasks, including the academically
    common classification of paper nodes in citation networks, and in industry, user
    tag classification and malicious account detection in online social networks.


    ### 2. Link-Level Tasks


    Link-level tasks mainly include edge classification and prediction tasks. Edge
    classification refers to predicting a certain property of an edge; link prediction
    refers to predicting whether an edge will form between two given nodes. A common
    application scenario is in social networks, where users are modeled as nodes and
    follow relationships between users as edges. Link prediction is used to implement
    social user recommendations. Currently, link-level tasks are mainly concentrated
    in recommendation business.


    ### 3. Graph-Level Tasks


    Graph-level tasks do not rely on the attributes of a specific node or edge, but
    start from the overall structure of the graph to achieve classification, representation,
    and generation tasks. Currently, graph-level tasks are mainly applied in the field
    of natural science research, such as classification of drug molecules, classification
    of enzymes, etc.


