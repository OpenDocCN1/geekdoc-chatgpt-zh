    \ Relational inductive biases, deep learning, and graph networks[J]. arXiv preprint\
    \ arXiv:1806.01261, 2018.\n\n## 7.3 R-GCN\n\nIn all the `GNN` variant models introduced\
    \ previously, the differences in relationships between nodes were not explicitly\
    \ considered. Compared to homogeneous graphs, graph data in real life is often\
    \ heterogeneous, meaning there exists more than one type of relationship in the\
    \ graph. The `R-GCN` introduced in this section extends Graph Convolutional Networks\
    \ to such graph data scenarios.\n\n### 7.3.1 Knowledge Graph\n\nA most typical\
    \ graph data containing multiple relationships is the **Knowledge Graph**. A Knowledge\
    \ Graph is a large-scale semantic network whose main function is to describe the\
    \ associative relationships between entities in general or specific scenarios.\
    \ Its main application scenarios include search engines, voice assistants, intelligent\
    \ question answering, etc.\n\nTake a simple example: when we search for \"Euler\"\
    \ on Google, a card appears on the right sidebar of the results page. As shown\
    \ in Figure 7-6, besides an introduction to the mathematician Euler's achievements,\
    \ it categorically lists some basic information: birth and death years, family,\
    \ education, etc. The search engine's ability to list relevant knowledge about\
    \ a figure in such a clear and concise form is inseparable from the support of\
    \ Knowledge Graph technology. The right image of Figure 7-6 presents some information\
    \ from the card in the form of a Knowledge Graph.\n\n![](img/7a6.jpg)\n\nFigure\
    \ 7-6　Google Search Results for \"Euler\"^([\\[1\\]](#chapter82.xhtml#ch1_back))\n\
    \n[\\[1\\]](#chapter82.xhtml#ch1) Image Source: https://zh.wikipedia.org/wiki/莱昂哈德·欧拉.\n\
    \n### 7.3.2 R-GCN\n\n`R-GCN`[^(\\[7\\])](../Text/chapter89.xhtml#gg-7) builds\
    \ upon `GCN`'s neighbor aggregation operation by adding a dimension of relation\
    \ aggregation, turning the node aggregation process into a dual aggregation process.\
    \ Its core formula is as follows:\n\n![](img/141-i.jpg)\n\n`R` represents the\
    \ set of all relations in the graph. ![](img/141-2-i.jpg) represents the set of\
    \ neighbors that have relation `r` with node `v[i]`. `c[i,r]` is used for normalization,\
    \ e.g., taking ![](img/141-3-i.jpg). `W[r]` is the weight parameter corresponding\
    \ to neighbors with relation `r`, and `W[o]` is the weight parameter corresponding\
    \ to the node itself.\n\nSince `GCN` considers homogeneous graph modeling where\
    \ only one type of relationship exists between nodes, `GCN` only needs one set\
    \ of weight parameters to transform node features. `R-GCN` considers heterogeneous\
    \ graph modeling. When processing neighbors, it classifies neighbors by considering\
    \ the relation factor: for each type of relation, different weight parameters\
    \ are introduced to aggregate neighbors belonging to the same relation type separately,\
    \ and then a total aggregation is performed again, as shown in Figure 7-7.\n\n\
    Figure 7-7 shows a schematic diagram of the `R-GCN` neighbor aggregation operation.\
    \ We can clearly see this is a two-layer aggregation operation: first, neighbors\
    \ of the same relation are aggregated separately. Here, for each relation, both\
    \ forward and backward directions are considered simultaneously. At the same time,\
    \ a self-loop relation is added for the node itself. After aggregating all neighbors\
    \ of different relations above, a final total aggregation is performed.\n\n![](img/7a7.jpg)\n\
    \nFigure 7-7　R-GCN Neighbor Aggregation Operation^([\\[1\\]](#chapter83.xhtml#ch1_back))\n\
    \nAs mentioned earlier, a typical multi-relational graph data—Knowledge Graph—often\
    \ contains a large number of relations. If we design a set of weights for each\
    \ relation, the number of parameters to be learned in a single-layer `R-GCN` will\
    \ be huge. Meanwhile, since the number of nodes for different relations varies,\
    \ for some uncommon relations, the learning data corresponding to their weight\
    \ parameters is very scarce, which greatly increases the risk of overfitting.\
    \ To avoid the above situation, `R-GCN` proposes a **basic decomposition** (`basic\
    \ decomposition`) scheme for `W[r]`, i.e.:\n\n![](img/142-i.jpg)\n\nWe call ![](img/142-2-i.jpg)\
    \ the bases. `a[rb]` is the decomposition coefficient of `W[r]` on `V[b]`. `B`\
    \ is a hyperparameter controlling the number of `V[b]`. `V[b]` and `a[rb]` are\
    \ the parameters to be learned replacing `W[r]`. Through the above basic decomposition,\
    \ we transform `W[r]` into a linear combination of a set of bases. And for `|R|`\
    \ groups of `W[r]`, they can be repeatedly represented by linear combinations\
    \ of `|B|` groups of bases. The benefits of this are twofold: first, the parameters\
    \ to be learned are reduced to the original ![](img/142-3-i.jpg). In actual training,\
    \ we can set a small `B` value, making `B<<min（|R|，d^(l+1)×d^(l)）`; second, the\
    \ optimization of bases `V[b]` is shared by all common or uncommon relations.\
    \ This shared optimization of parameters can effectively prevent overfitting on\
    \ uncommon relation data. Basic decomposition is a very common data transformation\
    \ representation (this idea is also reflected in the Fourier transform of graph\
    \ signals). In machine learning, it has been widely used as an important data\
    \ processing technique.\n\n[\\[1\\]](#chapter83.xhtml#ch1) Schlichtkrull M, Kipf\
    \ T N, Bloem P, et al. Modeling relational data with graph convolutional networks[C]//European\
    \ Semantic Web Conference. Springer, Cham, 2018: 593-607.\n\n## 7.4 General Framework\
    \ of GNN\n\nAfter introducing several variants of `GNN`, in this section we look\
    \ at the general framework of `GNN`. The so-called general framework is a generalized\
    \ summary of the network structures of multiple variant `GNN`s, and also the general\
    \ programming paradigm for `GNN`. Studying it helps us more clearly compare various\
    \ `GNN` models horizontally, while also providing directions for the flexible\
    \ extension of `GNN` models.\n\nBelow we introduce three categories of general\
    \ frameworks: **Message Passing Neural Network** (`Message Passing Neural Network`,\
    \ `MPNN`), **Non-Local Neural Network** (`Non-Local Neural Network`, `NLNN`),\
    \ and **Graph Network** (`Graph Network`, `GN`). `MPNN` summarizes `GNN` model\
    \ variants from the perspective of aggregation and update. `NLNN` is a generalized\
    \ summary of `GNN` models based on attention mechanisms. On top of these two frameworks,\
    \ `GN` achieves a more comprehensive summary of `GNN` models.\n\n### 7.4.1 MPNN\n\
    \nReference [\\[8\\]](../Text/chapter89.xhtml#gg-8) proposed `MPNN`, which generalized\
    \ multiple `GNN` models through a message passing mechanism. Its basic idea is:\
    \ the representation vectors of nodes are obtained after `K` rounds of iteration\
    \ of the message passing mechanism through the message function `M` (`Message`)\
    \ and the update function `U` (`update`). The message passing process is as follows:\n\
    \n![](img/143-i.jpg)\n\nWhere `e[ij]` represents the feature vector on edge <`v[i]`,\
    \ `v[j]`>. `k` represents the `k`-th message passing. In actual programming, this\
    \ is generally equivalent to the concept of layers in the model.\n\nThe input\
    \ of the message function consists of the edge itself and the nodes on both sides.\
    \ For ease of description, we borrow the `RDF` (`Resource Description Framework`)\
    \ triple to represent such input:\n\n![](img/144-i.jpg)\n\n`Source` represents\
    \ the source node, `Object` represents the target node, and `Predicate` represents\
    \ the relation from the source node to the target node. This description framework\
    \ naturally corresponds to the Subject-Predicate-Object triple phrases in Chinese.\
    \ For example, \"`GNN` belongs to `Deep Learning`\" describes the relationship\
    \ between \"`GNN`\" and \"`Deep Learning`\". Represented in `RDF` as follows:\n\
    \n![](img/144-2-i.jpg)\n\nUnder the action of the message function, all `RDF`s\
    \ in the graph broadcast messages outward. Afterwards, these messages propagate\
    \ along the edge direction to the nodes on both sides of the `RDF` for aggregation.\
    \ The aggregated messages then update the node features under the action of the\
    \ update function. Figure 7-8 shows a schematic diagram of `MPNN` computation:\n\
    \n![](img/7a8.jpg)\n\nFigure 7-8　MPNN Computation Schematic\n\nIt is particularly\
    \ necessary to note that the above `MPNN` does not iteratively update the representation\
    \ vectors of edges. The author of the paper pointed out that if necessary, for\
    \ example, in some scenarios where edges have explicit significant meaning in\
    \ the graph data, a state variable can be maintained for the edge representation\
    \ vector just like for nodes. The specific approach can refer to the `GN` approach\
    \ below.\n\nThe core of `MPNN` lies in the message function and the update function.\
    \ In principle, they can be designed as any `DNN` model. Next, let's see how to\
    \ determine the message functions and update functions in `GCN`, `R-GCN`, `GraphSAGE`,\
    \ `Interaction Network`[^(\\[9\\])](../Text/chapter89.xhtml#gg-9), and other `GNN`\
    \ models from the perspective of message passing, as shown in Table 7-1:\n\nTable\
    \ 7-1　Message Functions and Update Functions in Models\n\n![](img/7b1.jpg)\n\n\
    Since the message function of `MPNN` acts on `RDF` triples, it has certain adaptability\
    \ to various types of graph data. Below are methods for processing common homogeneous\
    \ graphs, heterogeneous graphs, attributed graphs, and other types of graph data\
    \ using the `MPNN` framework. The processing methods are not limited to these;\
    \ readers may consider their own:\n\n(1) **Homogeneous Graph**: Homogeneous graphs\
    \ are inherently easy to process. The only special case is directed weighted graphs.\
    \ For this type of graph data, the forward and backward directions of edges can\
    \ be regarded as two relations, processed by borrowing the `R-GCN` idea. Meanwhile,\
    \ the weights on edges can be considered into the adjacency matrix as normalization\
    \ terms for joint processing.\n\n(2) **Heterogeneous Graph**: The `R-GCN` approach\
    \ can be considered. Additionally, if there are few relations, the relations can\
    \ be encoded into `one-hot` vectors as edge features for processing.\n\n(3) **Attributed\
    \ Graph**: We previously introduced that attributed graph is a widely used form\
    \ of graph data expression. In attributed graphs, factors to consider include\
    \ node heterogeneity and edge attributes. For the former, if we pursue engineering\
