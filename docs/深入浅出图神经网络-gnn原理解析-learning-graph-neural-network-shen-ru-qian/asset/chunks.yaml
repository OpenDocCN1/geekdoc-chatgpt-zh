    \ transforming heterogeneous nodes into the same feature space of the same dimension,\
    \ and then process them as a node-homogeneous graph. For the latter, the processing\
    \ method for relational graphs can be referenced. Here, if edges possess some\
    \ attribute information, according to the message function mechanism, feature\
    \ encoding is needed (e.g., `one-hot` encoding or `embedding` encoding for categorical\
    \ attribute features).\n\n### 7.4.2 NLNN\n\nThe **Non-Local Neural Network** (`NLNN`)[^(\\\
    [10\\])](../Text/chapter89.xhtml#gg-10) is a generalization of the attention mechanism.\
    \ The `GAT` introduced above can be regarded as a special case of it. `NLNN` computes\
