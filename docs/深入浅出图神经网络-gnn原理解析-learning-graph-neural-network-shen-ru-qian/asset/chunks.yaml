- raw: '相较于拉普拉斯矩阵，H仅仅改动了对角矩阵上的值，因此，H具有以下形式：H[ij]\=0，如果i≠j或者e[ij]∉E。也就是说，H矩阵只在对角与边坐标上时才有可能取非零值。从算子的角度来看，Hx描述了一种作用在每个节点一阶子图上的变换操作。一般来说，我们称满足上述性质的矩阵为G的图位移算子（Graph
    Shift Operator），拉普拉斯矩阵与邻接矩阵都是典型的图位移算子。事实上，本章讲解的所有图信号处理的相关理论，都可以被拓展到图位移算子上，并不局限在拉普拉斯矩阵上。


    图滤波器具有以下性质：


    （1）线性：H（x+y）=Hx+Hy；


    （2）滤波操作是顺序无关的：H[1]（H[2]x）=H[2]（H[1]x）；


    （3）如果h（λ）≠0，则该滤波操作是可逆的。


    我们称Λ[h]为图滤波器H的频率响应矩阵，对应的函数h（λ）为H的频率响应函数，不同的频率响应函数可以实现不同的滤波效果。在信号处理中，常见的滤波器有3类：低通滤波器、高通滤波器、带通滤波器（见图5-6）。


    ![](Images/5a6.jpg)


