- raw: '同表示学习一样，图表示学习的核心也是研究数据的表示。不同的是，图表示学习的研究对象是图数据。我们知道图数据中蕴含着丰富的结构信息，这本质上对应着图数据因内在关联而产生的一种非线性结构。这种非线性结构在补充刻画数据的同时，也给数据的学习带来了极大的挑战。因此在这样的背景下，图表示学习就显得格外重要，它具有以下两个重要作用：


    （1）将图数据表示成线性空间中的向量。从工程上而言，这种向量化的表示为擅长处理线性结构数据的计算机体系提供了极大的便利。


    （2）为之后的学习任务奠定基础。图数据的学习任务种类繁多，有节点层面的、边层面的，还有全图层面的，一个好的图表示学习方法可以统一高效地辅助这些任务的相关设计与学习。


    图表示学习从方法上来说，可以分为基于分解的方法、基于随机游走的方法，以及基于深度学习的方法，而基于深度学习的方法的典型代表就是GNN相关的方法。下面我们回顾一下前两类方法。


    在早期，图节点的嵌入学习一般是基于分解的方法，这类方法通过对描述图数据结构信息的矩阵进行矩阵分解，将节点转化到低维向量空间中去，同时保留结构上的相似性。这种描述结构信息的矩阵有邻接矩阵[^(\[1\])](../Text/chapter104.xhtml#ii-1)、拉普拉斯矩阵[^(\[2\])](../Text/chapter104.xhtml#ii-2)、节点相似度矩阵[^(\[3\])](../Text/chapter104.xhtml#ii-3)。一般来说，这类方法均有解析解，但是由于某结果依赖于相关矩阵的分解计算，因此，这类方法具有很高的时间和空间复杂度。


    近几年，词向量方法在语言表示上取得了很大的成功，受该方法启发，一些方法开始将在图中随机游走产生的序列看作句子，将节点看作词，以此类比词向量方法从而学习出节点的表示。典型的方法有DeepWalk[^(\[4\])](../Text/chapter104.xhtml#ii-4)、Node2Vec[^(\[5\])](../Text/chapter104.xhtml#ii-5)等。图9-2为DeepWalk算法的示意图：


    ![](Images/9a2.jpg)


    图9-2　DeepWalk算法示意图


    DeepWalk通过随机游走将图转化成节点序列，设置中心节点左右距离为w的节点为上下文（context），如图9-2中的b图所示。同词向量方法一样，DeepWalk本质上建模了中心节点与上下文节点之间的共现关系，这种关系的学习也采用了负采样的优化手段，如图9-2中的d图所示。DeepWalk与词向量方法具有十分一致的算法细节，具体公式可以参见第4章中词向量的相关部分。


    相比基于分解的方法，基于随机游走的方法最大的优点是通过将图转化为序列的方式实现了大规模图的表示学习。但是这类方法有两个缺点：一是将图转化成序列集合，图本身的结构信息没有被充分利用；二是该学习框架很难自然地融合图中的属性信息进行表示学习。


    关于GNN方法的建模细节，本书作为重要内容在前面的章节中进行了阐述，这里不再赘述。通过之前的学习，我们可以知道基于GNN的图表示学习具有以下几点优势：


    （1）非常自然地融合了图的属性信息进行学习，而之前的方法大多把图里面的结构信息与属性信息单独进行处理。


    （2）GNN本身作为一个可导的模块，能够嵌入到任意一个支持端对端学习的系统中去，这种特性使得其能够与各个层面的有监督学习任务进行有机结合（或者以微调学习的形式进行结合），学习出更加适应该任务的数据表示。


    （3）GNN的很多模型如GraphSAGE、MPNN等都是支持归纳学习的，多数情况下对于新数据的表示学习可以直接进行预测，而不必像之前的多数方法那样重新训练一次。


    （4）相较于分解类的方法只能适应小图的学习，GNN保证了算法在工程上的可行性，也能适应大规模图的学习任务。


    综上所述，基于GNN的相关方法具有强大的学习能力与广泛的适应性，是图表示学习重要的代表性方法。


    ## 9.2　基于GNN的图表示学习


    凭借强大的端对端学习能力，GNN这类模型可以非常友好地支持有监督的学习方式。但是GNN本身作为一种重要的对图数据进行表示学习的框架，只要与相应的无监督损失函数结合起来就能实现无监督图表示学习。无监督学习的主体在于损失函数的设计，这里我们分两类损失函数分别进行介绍：基于重构损失的GNN和基于对比损失的GNN。


    ### 9.2.1　基于重构损失的GNN


    类比自编码器的思路，我们可以将节点之间的邻接关系进行重构学习，为此可以定义如下的图自编码器（Graph Auto Encoder）：


    ![](Images/183-i.jpg)


    其中，Z是所有节点的表示，这里借助GNN模型同时对图的属性信息与结构信息进行编码学习。![](Images/a-1.jpg)是重构之后的邻接矩阵，这里使用向量的内积来表示节点之间的邻接关系。图自编码器的重构损失定义如下：


    ![](Images/183-2-i.jpg)


    由于过平滑的问题，GNN可以轻易地将相邻节点学习出相似的表达，这就导致解码出来的邻接矩阵![](Images/a-1.jpg)能够很快趋近于原始邻接矩阵A，模型参数难以得到有效优化。因此，为了使GNN习得更加有效的数据分布式表示，同自编码器一样，我们必须对损失函数加上一些约束目标。比如，我们可以学习降噪自编码器的做法，对输入数据进行一定的扰动，迫使模型从加噪的数据中提取出有用的信息用于恢复原数据。这种加噪的手段包括但不限于下面所列的一种或多种：


    （1）对原图数据的特征矩阵X适当增加随机噪声或进行置零处理；


    （2）对原图数据的邻接矩阵A删除适当比例的边，或者修改边上的权重值。


    另外，也可以借鉴其他自编码器中的设计思路。接下来，我们看看比较重要的变分图自编码器（Variational Graph Autoencoder，VGAE）[^(\[6\])](../Text/chapter104.xhtml#ii-6)。VGAE的基础框架和变分自编码器一样，不同的是使用了GNN来对图数据进行编码学习。下面分3个方向来介绍其基础框架，包括推断模型（编码器）、生成模型（解码器）、损失函数。


