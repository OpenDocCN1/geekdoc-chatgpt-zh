  trans: '

    Just like representation learning, the core of graph representation learning is
    also the study of data representations. The difference lies in the object of study:
    graph representation learning focuses on graph data. We know that graph data contains
    rich structural information, which essentially corresponds to a non-linear structure
    arising from intrinsic associations within the graph data. While this non-linear
    structure supplements the depiction of data, it also poses significant challenges
    to data learning. Therefore, against this background, graph representation learning
    becomes particularly important, serving two crucial roles:


    (1) Representing graph data as vectors in a linear space. From an engineering
    perspective, this vectorized representation provides great convenience for computer
    systems that excel at processing linearly structured data.


    (2) Laying the foundation for subsequent learning tasks. Graph data learning tasks
    are diverse, including node-level, edge-level, and graph-level tasks. A good graph
    representation learning method can uniformly and efficiently assist the relevant
    design and learning of these tasks.


    In terms of methodology, graph representation learning can be categorized into
    factorization-based methods, random walk-based methods, and deep learning-based
    methods, with Graph Neural Network (`GNN`) related methods being the typical representatives
    of the deep learning category. Below, we review the first two categories.


    In the early stages, graph node embedding learning generally relied on factorization-based
    methods. These methods perform matrix factorization on matrices describing the
    structural information of graph data (such as the adjacency matrix[^(\[1\])](../Text/chapter104.xhtml#ii-1),
    Laplacian matrix[^(\[2\])](../Text/chapter104.xhtml#ii-2), node similarity matrix[^(\[3\])](../Text/chapter104.xhtml#ii-3))
    to transform nodes into a low-dimensional vector space while preserving structural
    similarity. Generally, these methods have analytical solutions; however, because
    the results depend on the factorization computation of the relevant matrices,
    these methods possess high time and space complexity.


    In recent years, word vector methods have achieved great success in language representation.
    Inspired by this, some methods began to treat sequences generated by random walks
    on graphs as sentences and nodes as words, thereby learning node representations
    by analogy with word vector methods. Typical methods include `DeepWalk`[^(\[4\])](../Text/chapter104.xhtml#ii-4)
    and `Node2Vec`[^(\[5\])](../Text/chapter104.xhtml#ii-5). Figure 9-2 shows a schematic
    diagram of the `DeepWalk` algorithm:


    ![](img/9a2.jpg)


    Figure 9-2　Schematic Diagram of the DeepWalk Algorithm


    `DeepWalk` transforms the graph into node sequences via random walks, setting
    nodes within a distance `w` to the left and right of a center node as the **context**
    (as shown in Figure 9-2b). Like word vector methods, `DeepWalk` essentially models
    the co-occurrence relationship between the center node and context nodes. The
    learning of this relationship also employs the optimization technique of **negative
    sampling** (as shown in Figure 9-2d). `DeepWalk` shares highly consistent algorithmic
    details with word vector methods; specific formulas can be referred to in the
    word vector section of Chapter 4.


    Compared to factorization-based methods, the greatest advantage of random walk-based
    methods is the realization of representation learning on large-scale graphs by
    transforming graphs into sequences. However, these methods have two drawbacks:
    first, converting the graph into a collection of sequences fails to fully utilize
    the graph''s inherent structural information; second, this learning framework
    struggles to naturally integrate attribute information within the graph for representation
    learning.


    Regarding the modeling details of `GNN` methods, this book has elaborated on them
    as important content in previous chapters, so we will not repeat them here. Through
    previous study, we can know that `GNN`-based graph representation learning possesses
    the following advantages:


    (1) It **very naturally integrates the graph''s attribute information for learning**,
    whereas previous methods mostly processed structural information and attribute
    information separately.


    (2) As a **differentiable module**, `GNN` can be embedded into any system supporting
    end-to-end learning. This property enables it to organically combine with supervised
    learning tasks at various levels (or in the form of fine-tuning), learning data
    representations more suited to the specific task.


    (3) Many `GNN` models, such as `GraphSAGE` and `MPNN`, support **inductive learning**.
    In most cases, representation learning for new data can be predicted directly
    without the need to retrain, as required by most previous methods.


    (4) Compared to factorization-based methods that only adapt to small graph learning,
    `GNN` ensures **algorithmic feasibility in engineering** and can also adapt to
    large-scale graph learning tasks.


    In summary, `GNN`-based methods possess powerful learning capabilities and broad
    adaptability, making them an important representative method in graph representation
    learning.


    ## 9.2　Graph Representation Learning Based on GNN


    Leveraging powerful end-to-end learning capabilities, `GNN` models can very friendly
    support supervised learning approaches. However, `GNN` itself, as an important
    framework for representation learning on graph data, can achieve unsupervised
    graph representation learning as long as it is combined with appropriate unsupervised
    loss functions. The core of unsupervised learning lies in the design of the loss
    function. Here, we introduce two categories of loss functions: `GNN`s based on
    reconstruction loss and `GNN`s based on contrastive loss.


    ### 9.2.1　GNN Based on Reconstruction Loss


    Analogous to the idea of autoencoders, we can perform reconstruction learning
    on the adjacency relationships between nodes. To this end, we can define the following
    **Graph Autoencoder (GAE)**:


    ![](img/183-i.jpg)


    Here, `Z` represents the representations of all nodes, where the `GNN` model simultaneously
    encodes and learns both the attribute information and structural information of
    the graph. `Â` is the reconstructed adjacency matrix, where the inner product
    of vectors is used to represent the adjacency relationship between nodes. The
    reconstruction loss of the graph autoencoder is defined as follows:


    ![](img/183-2-i.jpg)


    Due to the **over-smoothing** problem, `GNN` can easily learn similar representations
    for adjacent nodes. This causes the decoded adjacency matrix `Â` to quickly approach
    the original adjacency matrix `A`, making it difficult for model parameters to
    be effectively optimized. Therefore, to enable `GNN` to learn more effective distributed
    data representations, just like with autoencoders, we must add some constraint
    objectives to the loss function. For instance, we can adopt the approach of denoising
    autoencoders by perturbing the input data, forcing the model to extract useful
    information from the noisy data to recover the original data. Such noising methods
    include, but are not limited to, one or more of the following:


    (1) Adding appropriate random noise or performing zero-masking on the feature
    matrix `X` of the original graph data;


    (2) Deleting an appropriate proportion of edges from the adjacency matrix `A`
    of the original graph data, or modifying the weight values on the edges.


    Additionally, design ideas from other autoencoders can be borrowed. Next, let''s
    look at the more important **Variational Graph Autoencoder (VGAE)**[^(\[6\])](../Text/chapter104.xhtml#ii-6).
    The basic framework of `VGAE` is the same as that of the Variational Autoencoder
    (`VAE`), except that `GNN` is used to encode and learn the graph data. Below,
    we introduce its basic framework in three aspects: the inference model (encoder),
    the generative model (decoder), and the loss function.


    #### 1. Inference Model


    ![](img/184-i.jpg)


    Unlike `VAE`, here we use two `GNN`s to fit `μ` and `σ`:


    ![](img/184-2-i.jpg)


    #### 2. Generative Model


    ![](img/184-3-i.jpg)


    Here, the inner product of two node representation vectors is also simply used
    to fit the adjacency relationship.


    #### 3. Loss Function


    ![](img/184-4-i.jpg)


    Similarly, the prior distribution of the latent variable `z` is chosen as the
    standard normal distribution:


    ![](img/184-5-i.jpg)


    The combination of `VAE` and `GNN` can not only be used to learn graph data representations;
    its more unique role is providing a framework for graph generative models, which
    can be applied in related graph generation tasks, such as references [\[7\]](../Text/chapter104.xhtml#ii-7)[\[8\]](../Text/chapter104.xhtml#ii-8),
    where it is used to guide the design of chemical molecules.


    ### 9.2.2　GNN Based on Contrastive Loss


    Contrastive loss is another very common loss function in unsupervised representation
    learning. Typically, contrastive loss sets up a scoring function `D(.)` that increases
    the scores of "true" (or positive) samples (pairs) and decreases the scores of
    "false" (or negative) samples (pairs).


    Drawing an analogy to word vectors, we place the focus of contrastive loss on
    words and contexts. The word is the subject of representation learning, naturally
    representing nodes in graph data; the context represents objects corresponding
    to the nodes. Usually, contexts in a graph range from small to large: a node''s
    neighbors, the subgraph where the node resides, and the whole graph. As an inherent
    relationship existing between nodes and contexts, we hope the scoring function
    increases the score of node-context pairs while decreasing the score of node-non-context
    pairs. This can be expressed as Equation (9.11):


    ![](img/185-i.jpg)


    Where `c` denotes the context representation vector, and `c_neg` denotes the non-context
    representation vector. Below, we examine the specific forms of this loss function
    under different contexts.


    #### 1. Neighbors as Context


    If neighbors are treated as context, the above contrastive loss models the co-occurrence
    relationship between nodes and neighbor nodes. The `GraphSAGE` paper describes
    such an unsupervised learning method. Like `DeepWalk`, we can regard nodes `v[j]`
    that appear within a fixed-length window alongside the center node `v[i]` during
    random walks as neighbors, while using **negative sampling** to treat nodes not
    conforming to this relationship as negative samples. The difference from `DeepWalk`
    is that the node representation learning model still uses `GNN`:


    ![](img/185-2-i.jpg)


    Here, `p[n]` is a negative sampling distribution based on node occurrence probability.
    The scoring function uses vector inner product plus a `sigmoid` function to constrain
    scores within `[0, 1]`. This method is essentially equivalent to the graph autoencoder
    in optimization objective, but this contrastive optimization in the form of negative
    sampling does not need to explicitly decode the adjacency matrix `Â` like the
    graph autoencoder. Since `Â` destroys the sparsity of the original adjacency matrix,
    this method does not bear the `O(N²)` space complexity.


    #### 2. Subgraph as Context


    When using neighbors as context, the emphasis is on the co-occurrence relationship
    between nodes, which reflects the distance between nodes in the graph but lacks
    the capture of node structural similarity. Usually, local structural similarity
    of nodes is a key factor in node classification tasks[^(\[9\])](../Text/chapter104.xhtml#ii-9).
    For example, if two distant nodes in a graph have identical subgraph structures,
    modeling methods based on co-occurrence relationships struggle to effectively
    capture this structural equivalence. Therefore, the paper[^(\[10\])](../Text/chapter104.xhtml#ii-10)
    proposes directly using the subgraph as a context for contrastive learning. The
    specific definition of the subgraph is shown in Figure 9-3:


    ![](img/9a3.jpg)


    Figure 9-3　Prediction with Subgraph as Context^([\[1\]](#chapter102.xhtml#ch1_back))


    For a center node (the red node in Figure 9-3), we use a `GNN` to extract its
    representation vector on its `K`-hop subgraph. Simultaneously, we define nodes
    located between `r[1]–hop` and `r[2]–hop` from the center node as **context anchor
    points** for that center node, as shown in Figure 9-3. Setting `K=2`, `r[1]=1`,
    `r[2]=4`, we use another `GNN` to extract the representation vector of each node
    when acting as a context anchor point. To obtain a total, fixed-length context
    representation vector, we use a **readout mechanism** to aggregate the representation
    vectors of the context anchor points. Formulated as follows:


    ![](img/186-2-i.jpg)


    #### 3. Whole Graph as Context


    Reference^([\[2\]](#chapter102.xhtml#ch2_back)) proposes the **Deep Graph Infomax
    (DGI)**[^(\[11\])](../Text/chapter104.xhtml#ii-11) method for unsupervised representation
    learning on graph data. This method implements a learning mechanism for contrastive
    loss between nodes and the whole graph. The specific procedure is as follows:


    ![](img/187-i.jpg)


    First, to obtain negative samples, the graph data needs to be perturbed to get
    (`X_corrupt`, `A_corrupt`); specific noising methods have been summarized above.
    Then, these two sets of graph data are fed into the same `GNN` model for learning.
    To obtain a global graph representation, we use a **readout mechanism** to aggregate
    local node information. In the final loss function, the authors fix the whole
    graph representation and perform contrastive learning with negative sampling on
    the nodes. This is done to facilitate subsequent node classification tasks. From
    the perspective of **Mutual Information**[^(\[12\])](../Text/chapter104.xhtml#ii-12)[^(\[13\])](../Text/chapter104.xhtml#ii-13),
    maximizing the mutual information between the whole graph and nodes through a
    unified global representation establishes a more direct connection among all node
    representations. For instance, the problem of learning structural similarity between
    distant nodes mentioned above can be efficiently guaranteed by this design. Figure
    9-4 is a schematic diagram of the above process:


    ![](img/9a4.jpg)


    Figure 9-4　Node-Graph Contrastive Loss Learning Mechanism^([\[3\]](#chapter102.xhtml#ch3_back))


    Meanwhile, in unsupervised learning at the whole graph level, the negative samples
    in the above loss function are exactly the opposite: representations of other
    graphs `G_neg` need to be sampled as substitutes:


    ![](img/187-4-i.jpg)


    At this point, since it is a whole-graph-level task, we hope to achieve mutual
    information maximization between the whole graph and all its local nodes through
    the above formula, thereby obtaining the most effective and representative features
    of the whole graph, which is highly beneficial for graph classification tasks.


    [\[1\]](#chapter102.xhtml#ch1) Weihua Hu, Bowen Liu, Joseph Gomes, Marinka Zitnik,
    Percy Liang, Vijay S. Pande and Jure Leskovec. Pre-training Graph Neural Networks.
    arXiv preprint arXiv:1905.12265, 2019.


    [\[2\]](#chapter102.xhtml#ch2) Veličković P, Fedus W, Hamilton W L, et al. Deep
    Graph Infomax[J]. arXiv preprint arXiv:1809.10341, 2018.


    [\[3\]](#chapter102.xhtml#ch3) Veličković P, Fedus W, Hamilton W L, et al. Deep
    Graph Infomax[J]. arXiv preprint arXiv:1809.10341, 2018.


    ## 9.3　Recommendation System Based on Graph Autoencoder


    Below we explain an example of a simple recommendation task[^(\[14\])](../Text/chapter104.xhtml#ii-14)
    implemented based on a graph autoencoder. A recommendation system aims to establish
    relationships between users and items. Here we take simplified user ratings of
    items as an example. As shown in Figure 9-5, assume the interaction behavior between
    users and items only exists as ratings, with scores ranging from 1 to 5. If user
    `u` rates item `v` with score `r`, it means there is an edge between user `u`
    and item `v`, with the edge type being `r`, where `r∈R`. Recommending items to
    users based on this interaction relationship is essentially predicting which items
    might have edges with the user; such a problem is called a **link prediction**
    (or edge prediction) problem. For this link prediction problem, we treat it as
    a **matrix completion** problem. The interaction behaviors between users and items
    form a **bipartite graph**, which can be represented by the user-item adjacency
    matrix `A`, where the matrix values are the ratings. Recommendation is then to
    predict the unrated positions in the matrix.


    ![](img/9a5.jpg)


    Figure 9-5　Recommendation Based on Graph Autoencoder^([\[1\]](#chapter103.xhtml#ch1_back))


    Figure 9-5 shows the architecture of the recommendation system based on the graph
    autoencoder. As shown, the user-item matrix is first transformed into a user-item
    bipartite graph, then the graph autoencoder models the bipartite graph. Here,
    `GCN` is used as the encoder, and the decoder reconstructs the edge information
    in the adjacency matrix, thereby completing the link prediction task. For the
    adjacency matrix `A`, decomposition by different ratings `r` yields an adjacency
    matrix `A[r]` corresponding to each rating `r`, where the value is 1 at positions
    with rating `r` and 0 otherwise. Note that here different ratings are treated
    as different **relations** rather than as edge attributes for prediction. Next,
    the `R-GCN` dual aggregation idea is used to learn node representations: first
    aggregate neighbors of the same relation, then aggregate all neighbors. Expressed
    formulaically as (9.21):


    ![](img/189-i.jpg)


    Where `W[r]` is the weight parameter corresponding to each rating category, and
    `c[ij]` is a normalization parameter, which can be `|N[i]|` or `√(|N[i]|·|N[j]|)`.
    The function for the second aggregation is `Agg`, which can be concatenation,
    summation, or more complex aggregation functions. Code Listing 9-1 is the encoder
    implementation based on concatenation, and Code Listing 9-2 is the encoder implementation
    based on summation.


    ### Code Listing 9-1　Encoder Based on Concatenation


