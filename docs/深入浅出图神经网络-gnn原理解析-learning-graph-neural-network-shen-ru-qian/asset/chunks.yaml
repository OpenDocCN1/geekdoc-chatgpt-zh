    \ `https://www.yelp.com/dataset`。\n\n### 10.2.3 视觉推理\n\n推理是人类具有的高阶能力，是人类智能中很重要的部分，如何让计算机拥有推理能力是人工智能领域的一项重要课题。\n\
    \n以视觉领域为例，尽管卷积神经网络等模型取得了极大的成功，但是仍不具备复杂推理的能力，比如图10-4中，需要判断蓝色方框的目标是什么，人类在看到这幅图像的时候，根据图中的棒球棒、人物的姿态，首先会得出这张图在描述打棒球的结论，然后以此为依据，对于蓝色的目标区域，根据这个人的姿势和手部姿态判断出他是处于接棒球的状态，因此可以推断出蓝色区域为棒球手套。而使用基于卷积网络的方法进行识别，除了在更大的感知野内获得的层次化特征之外，无法通过图像的语义信息来准确推理出蓝色区域的目标。\n\
    \n文献[[15]](../Text/chapter112.xhtml#jj-15)为了解决上述局限，提出了一个融合了空间信息和语义信息的迭代式视觉推理系统。整个系统有两个核心模块，一个是在卷积网络的基础上引入了记忆机制的局部推理模块；另一个是融合了空间和语义信息的全局推理模块。整体的推理框架如图10-5所示。\n\
    \n![](Images/10a4.jpg)\n\n图10-4　蓝色框内的目标是什么？^([\\[1\\]](#chapter110.xhtml#ch1_back))\n\
    \n![](Images/10a5.jpg)\n\n图10-5　推理框架结构图^([\\[2\\]](#chapter110.xhtml#ch2_back))\n\
    \n局部推理模块以记忆模块`S`作为输入进行预测，其中记忆模块`S`用来存储通过卷积网络提取的目标区域的位置特征和图像特征。\n\n全局推理模块主要基于空间特征和语义特征进行推理。空间指的是建立位置上不相邻区域的联系；语义指的是利用外部的知识库建立类别与类别之间的联系。为了综合利用这两个方面的信息，采用`GNN`作为推理模块。图的构成使用了两种类型的节点，一个是由所有的区域组成的区域节点；另一种是以所有区域对应的实体作为节点。节点与节点之间的边通过如下3种关系建立，第一种是区域与区域之间通过它们的距离关系进行关联，边的权重由像素距离的核函数归一化值决定；另外对于有重叠的区域，通过`IoU`值建立它们之间的关系。第二种是区域与实体之间的关系，根据对区域预测的概率分布（`softmax`输出），建立与实体之间的关系，边的权重为对应的概率值。第三种是实体与实体之间的关系，这个关系来自外部的知识图谱，可以将多种实体关系考虑进来，比如类别从属关系、部件从属关系（腿和椅子）、单复数关系、水平对称关系等。\n\
    \n以上面构建的图为基础，使用`GNN`来进行推理，区域节点的特征来自卷积网络，实体节点的特征来自预训练的词向量。`GNN`推理是为了融合空间信息和语义信息对区域进行推理，因此使用了两条推理路径。一条是区域—区域，它聚合多个区域的特征以得到空间特征；另一条是区域—实体—实体，它分为两步，先将区域的特征聚合到实体节点并与实体节点特征融合，然后对不同类型的实体关系进行聚合得到实体的特征，这对应着语义关系。为了得到区域的最终特征，通过实体—区域的关系，将实体携带的语义特征聚合到区域节点上，并与第一条推理路径中得到的空间特征进行融合。整个过程如图10-6所示。\n\
    \n![](Images/10a6.jpg)\n\n图10-6　全局推理模块示意图^([\\[3\\]](#chapter110.xhtml#ch3_back))\n\
    \n推理通常不是一步到位的，而是迭代式的。为了将前一轮的信息传递到后一轮，可以使用记忆模块，局部推理和全局推理使用不同的记忆模块`S`和`M`，每次迭代得到的输出用于更新记忆模块。另外，模型还引入了注意力机制，以便融合当前预测值与来自其他迭代过程产生的预测值。模型在不同的训练数据集上进行试验，将识别效果对比卷积神经网络提升了3.7%～8.4%。\n\
    \n[[1]](#chapter110.xhtml#ch1) 图片来源：`https://es.calcuworld.com/cuantos/cuanto-dura-un-partido-de-beisbol/`。\n\
    \n[[2]](#chapter110.xhtml#ch2) Chen X，Li L J，Fei-Fei L，et al.Iterative visual\
    \ reasoning beyond convolutions\\[C\\]//Proceedings of the IEEE Conference on\
    \ Computer Vision and Pattern Recognition.2018：7239-7248.\n\n[[3]](#chapter110.xhtml#ch3)\
    \ Chen X，Li L J，Fei-Fei L，et al.Iterative visual reasoning beyond convolutions\\\
    [C\\]//Proceedings of the IEEE Conference on Computer Vision and Pattern Recognition.2018：7239-7248.\n\
    \n## 10.3 GNN的未来展望\n\n作为一种新兴的神经网络技术，`GNN`的快速发展离不开近些年深度学习在各方面的重要积淀。而与`GNN`的结合，可以助力深度学习系统拓展其在更广领域、更多层面的场景任务中获得成功。我们非常确信在未来几年，`GNN`会在越来越多的场景下得到应用。\n\
    \n接下来，我们从3个方面总结对`GNN`的未来研究的展望。当然以下观点仅供参考，读者朋友也应有自己的思考。\n\n1.  **充分适应复杂多变的图数据**\n\
    \    一方面，图数据的类型极其繁杂，如关系经常发生变化的动态图、一条边连接两个以上节点的超图，这些图数据的结构更加复杂，需要`GNN`进行针对性的设计。另一方面，`GNN`针对异构图与属性图还需要进行更充分的研究与设计，以学习其中丰富多样的语义信息。\n\
    \n2.  **在更多推理任务上的应用与学习机制的研究改进**\n    推理任务已经成为当下深度学习系统面临的核心任务之一，虽然`GNN`已经展现出了在相关任务上的独特优势，但是内在的作用机理还有待充分研究。通过对其学习机制的不断完善与发展，来促使`GNN`在更多、更复杂的推理任务中获得更好的表现。\n\
    \n3.  **对超大规模图建模的支持**\n    现有的大多数图神经网络都无法扩展到规模巨大的图数据中去。`GNN`的训练是一种协同的学习方式，在一次迭代中，节点固有的上下文会导致其状态的更新需要涉及大量邻居节点的隐藏状态，复杂度极高，难以应用小批量训练方式提升计算效率。尽管已有研究提出基于抽样与分区的手段来解决这类问题，但这些手段仍不足以扩展到工业级超大规模属性图的学习中去。\n\
    \n## 10.4 参考文献\n\n[[1]](../Text/chapter106.xhtml#j1)　Zhou J，Cui G，Zhang Z，et al.Graph\
    \ neural networks：A review of methods and applications\\[J\\].arXiv preprint arXiv：1812.08434，2018.\n\
    \n[[2]](../Text/chapter106.xhtml#j2)　Fout A，Byrd J，Shariat B，et al.Protein interface\
    \ prediction using graph convolutional networks\\[C\\]//Advances in Neural Information\
    \ Processing Systems.2017：6530-6539.\n\n[[3]](../Text/chapter106.xhtml#j3)　Zhang\
    \ G，He H，Katabi D.Circuit-GNN：Graph Neural Networks for Distributed Circuit Design\\\
    [C\\]//International Conference on Machine Learning.2019：7364-7373.\n\n[[4]](../Text/chapter106.xhtml#j4)　Narasimhan\
    \ M，Lazebnik S，Schwing A.Out of the box：Reasoning with graph convolution nets\
    \ for factual visual question answering\\[C\\]//Advances in Neural Information\
    \ Processing Systems.2018：2654-2665.\n\n[[5]](../Text/chapter106.xhtml#j5)　Ding\
    \ M，Zhou C，Chen Q，et al.Cognitive Graph for Multi-Hop Reading Comprehension at\
    \ Scale\\[J\\].arXiv preprint arXiv：1905.05460，2019.\n"
  trans: "\n\n## 10.2 Typical Application Scenarios of GNN\n\n### 10.2.1 Point Cloud\
    \ Data Processing\n\nBefore `GNN` was applied to point cloud data processing,\
    \ one approach was to forcibly represent point clouds as `voxel`s, thereby obtaining\
    \ a three-dimensional regular structure similar to images, facilitating convolution\
    \ and pooling operations. However, this processing method causes a dramatic increase\
    \ in data volume and generates significant data redundancy, resulting in very\
    \ high computational overhead. Another approach is to convert point clouds into\
    \ `Multi-view Images`, i.e., a set of virtual 2D snapshots, generating RGB and\
    \ synthetic views containing geometric features, and then projecting the semantic\
    \ segmentation back to the original point cloud data after image processing[^([9])](../Text/chapter112.xhtml#jj-9).\
    \ This method cannot capture the intrinsic structure of 3D point clouds, thus\
    \ limiting recognition performance. In fact, both of these roundabout methods\
    \ result in information loss or data redundancy, and the conversion process has\
    \ high complexity, making them unsuitable for large-scale point cloud data processing\
    \ and understanding.\n\nThe development of graph convolution technology has greatly\
    \ advanced point cloud processing methods. Researchers have proposed many `GNN`-based\
    \ methods, demonstrating excellent performance in point cloud classification,\
    \ segmentation, and other problems. Here, taking typical `GNN` models proposed\
    \ in recent years as examples, we elaborate on the key steps of `GNN` technology\
    \ when applied to unstructured data like point clouds.\n\nPoints in point cloud\
    \ data exist discretely, and the distance `d` between points is the basis for\
    \ determining their mutual relationships. Euclidean distance based on point coordinates\
    \ (`x`, `y`, `z`) is a common choice; other non-Euclidean distance choices such\
    \ as `geodesic` distance and shape-aware distance can handle non-rigid features\
    \ well and are also used by many researchers, such as the `PointNet++` algorithm\
    \ proposed by `Charles R. Qi` et al. (2017)[^([10])](../Text/chapter112.xhtml#jj-10).\n\
    \nWith distance, the adjacency relationship between points can be determined.\
    \ How to convert distance into adjacency relationships becomes a key point in\
    \ applying `GNN` technology. Usually, we need to define a neighborhood; each point\
    \ connects to points within its neighborhood range and has no adjacency relationship\
    \ with points outside. The neighborhood range can be determined by `KNN` (K-Nearest\
    \ Neighbors) or by `ball query` (all points within a spherical region of a certain\
    \ radius). Notably, the adjacency relationships between points are not fixed in\
    \ the graph of each layer. The `PointNet++` algorithm adopts a strategy of using\
    \ fixed neighborhood points for convolution in each layer, while in the `Edge-Conv`\
    \ algorithm[^([11])](../Text/chapter112.xhtml#jj-11), the graph in each layer\
    \ can dynamically adjust the adjacency relationships between nodes; points within\
    \ the `K` neighborhood change as the network updates, enabling adaptive capture\
    \ and update of local geometric features of point clouds, achieving good results\
    \ in point cloud classification and segmentation.\n\nAnother key step after determining\
    \ adjacency relationships is how to implement convolution based on adjacency edges.\
    \ As shown in Figure 10-2, define `e[ij]=hΘ` as the edge between point `v[i]`\
    \ and point `v[j]`, where `h[Θ]` is a nonlinear function with learnable parameters\
    \ `Θ`.\n\n![](img/10a2.jpg)\n\nFigure 10-2 Schematic diagram of edge convolution\n\
    \nThe convolution calculation centered on node `v[i]` is shown in Equation (10.1):\n\
    \n![](img/202-2-i.jpg)\n\n`PointNet++` and the `PCNN` method proposed by `Atzmon`\
    \ et al. (2018)[^([12])](../Text/chapter112.xhtml#jj-12) adopt the approach `hΘ=hΘ`,\
    \ i.e., the convolution value is obtained by aggregating neighbors. If `Θ=(θ[1],…,θ[m])`\
    \ represents the weights of the convolution filter matrix, taking the `PCNN` algorithm\
    \ as an example, the convolution calculation is shown in Equation (10.2):\n\n\
    ![](img/202-3-i.jpg)\n\nWhere `g` represents the Gaussian kernel function, `d(x[i],x[j])`\
    \ represents the distance between point `v[i]` and `v[j]`, which is related to\
    \ node features. In the `Edge-Conv` algorithm, the asymmetric equation ![](img/202-4-i.jpg)\
    \ is used.\n\nIt can be seen that the convolution definition in point cloud data\
    \ is exactly the same as `GNN`. Usually, the model input is the 3D coordinate\
    \ values (`x`, `y`, `z`) of the point cloud data, so the input matrix is `N×3`,\
    \ where `N` represents the number of point clouds (users can add other attribute\
    \ information as needed). For point cloud classification, the focus is on identifying\
    \ the category of the entire dataset, so the output value is the label regarding\
    \ the category, which is a graph-level output. Assuming the dataset has `K` categories,\
    \ the output is a `K`-dimensional score vector. For point cloud segmentation,\
    \ it is necessary to know which part each point cloud belongs to. Assuming `P`\
    \ is the number of object sub-parts, the model output is an `N×P`-dimensional\
    \ score matrix, which is a node-level output. Point cloud classification focuses\
    \ on learning global features of the dataset, while point cloud segmentation needs\
    \ to combine local geometric features in addition to learning global features.\
    \ Therefore, in segmentation, the definition of local relationships (adjacency\
    \ relationships) in the point cloud network is more important. We can see that\
    \ through different convolution strategies and model architectures, graph-based\
    \ deep learning methods provide efficient solutions for processing and analyzing\
    \ point clouds, a data format more complex than images.\n\n### 10.2.2 Recommendation\
    \ Systems Based on Social Networks\n\nLogging into online communities, such as\
    \ Weibo, WeChat, Douban, Dianping, and other websites, has become an important\
    \ part of modern people's daily lives. On these network platforms, users can view\
    \ or post information, follow friends, comment on articles of interest, etc. Recommending\
    \ content of interest to users can, on the one hand, increase the activity of\
    \ the website, and on the other hand, help users discover potential information\
    \ of interest and enhance user stickiness. Of course, advertising recommendations\
    \ based on user characteristics are also one of the important profit models for\
    \ websites. Therefore, establishing an effective recommendation model is very\
    \ important for the operation and development of social websites.\n\nUnlike recommendation\
    \ applications in other scenarios, online communities have explicit user social\
    \ network information. How to encode this information into the recommendation\
    \ system is a critical issue. In general, there are the following difficulties\
    \ in modeling recommendation systems for online communities: First, user interests\
    \ are divided into long-term and short-term interests. Short-term interests are\
    \ inherently dynamic; a user may be obsessed with celebrity gossip news for a\
    \ period, then become interested in literature or movies later. Second, users\
    \ are influenced by friends in their online social circles (for simplicity, people\
    \ with whom users have established social relationships, such as following, in\
    \ the social network are collectively referred to as \"friends\"). If user A's\
    \ friends are sports fans who often post information about sports events and stars,\
    \ user A is likely to also check out sports-related news. Third, the influence\
    \ of the social network on user interests is not fixed or constant, but changes\
    \ dynamically according to the user's `context`. For example, a user is more easily\
    \ influenced by friends who usually love music when listening to music, and more\
    \ easily influenced by audiophile friends when buying electronic products.\n\n\
    Below, taking the `DGR[EC]` model proposed in literature[[13]](../Text/chapter112.xhtml#jj-13)\
    \ as an example, we explain how it integrates social network information to build\
    \ a recommendation system. As shown in Figure 10-3, this method consists of 4\
    \ parts:\n\n![](img/10a3.jpg)\n\nFigure 10-3 `DGR[EC]` Model^([\\[1\\]](#chapter109.xhtml#ch1_back))\n\
    \n(1) A Recurrent Neural Network `RNN` — used to model users' dynamic interest\
    \ preferences. Dynamic interest preferences can be obtained from the sequence\
    \ of items consumed by the user in the current `session`. For example, when a\
    \ user consecutively purchases boots, coats, and other items in a session, it\
    \ is obvious that the user's current shopping preference is for clothing, and\
    \ this dynamic interest preference will greatly influence the user's next consumption\
    \ behavior.\n\n(2) Users' friends' interest preferences consist of their long-term\
    \ and short-term interest preferences. Long-term interests reflect a user's stable\
    \ interests and can be represented by user embedding; short-term interests reflect\
    \ a user's interest drift in the recent period (in one or more sessions) and can\
    \ be represented by modeling the sequence of recently consumed items using `RNN`.\n\
    \n(3) A Graph Attention Network `GAT` — used to model the interaction pattern\
    \ between users' dynamic interest preferences and friends' interest preferences.\
    \ This is the most critical part of this method, which adaptively learns the representation\
    \ vector of the social network's influence on user consumption behavior. As mentioned\
    \ above, a user's actual consumption behavior is not only influenced by friends\
    \ but also influenced by different friends with different weights depending on\
    \ the user's context. Therefore, using a `GAT` model based on the attention mechanism\
    \ can well capture the above two layers of influencing factors, achieving an adaptive\
    \ characterization of social network information.\n\n(4) The user's next consumption\
    \ behavior is jointly determined by the user's dynamic interest preferences and\
    \ social network influence. By combining the outputs of parts (1) and (3), the\
    \ user's representation is obtained, and then, like other recommendation methods,\
    \ the `DGR[EC]` model is trained end-to-end using user-item pair information.\
    \ In the experimental section of this paper, the author conducts experiments on\
    \ datasets from network platforms such as Douban^([\\[2\\]](#chapter109.xhtml#ch2_back)),\
    \ `Delicious`^([\\[3\\]](#chapter109.xhtml#ch3_back)), `Yelp`^([\\[4\\]](#chapter109.xhtml#ch4_back)),\
    \ all achieving state-of-the-art results. Meanwhile, the author also designed\
    \ experiments to prove the necessity of `GAT` for performance improvement.\n\n\
    It is worth mentioning that some researchers have pointed out that not only do\
    \ relationships between users play a significant role in recommendation effectiveness,\
    \ but relationships between recommended items also have an impact. For example,\
    \ the relationship between coats and shoes is stronger than that between coats\
    \ and flower pots. This intrinsic relationship between items also works for recommending\
    \ user consumption behavior. Based on this, literature[[14]](../Text/chapter112.xhtml#jj-14)\
    \ proposes using a dual graph attention network model to simultaneously model\
    \ the dual network effects between users and between items, thereby capturing\
    \ more comprehensive relationship information to improve the recommendation system's\
    \ effectiveness.\n\n[[1]](#chapter109.xhtml#ch1) Song W，Xiao Z，Wang Y，et al.Session-based\
    \ social recommendation via dynamic graph attention networks\\[C\\]//Proceedings\
    \ of the Twelfth ACM International Conference on Web Search and Data Mining.ACM，2019：555-563.\n\
    \n[[2]](#chapter109.xhtml#ch2) `https://www.douban.com/`。\n\n[[3]](#chapter109.xhtml#ch3)\
    \ `https://grouplens.org/datasets/hetrec-2011/`。\n\n[[4]](#chapter109.xhtml#ch4)\
    \ `https://www.yelp.com/dataset`。\n\n### 10.2.3 Visual Reasoning\n\nReasoning\
    \ is a high-level ability possessed by humans and is a very important part of\
    \ human intelligence. How to enable computers to have reasoning capabilities is\
    \ an important topic in the field of artificial intelligence.\n\nTaking the visual\
    \ domain as an example, although models such as Convolutional Neural Networks\
    \ have achieved great success, they still lack complex reasoning capabilities.\
    \ For instance, in Figure 10-4, it is necessary to determine what the object in\
    \ the blue box is. When humans see this image, based on the baseball bat and the\
    \ character's posture, they first conclude that the image describes playing baseball.\
    \ Then, based on this, for the blue target region, judging from the person's posture\
    \ and hand posture that they are in a state of catching a baseball, it can be\
    \ inferred that the blue region is a baseball glove. Methods based on convolutional\
    \ networks for recognition, apart from obtaining hierarchical features within\
    \ a larger receptive field, cannot accurately reason out the target in the blue\
    \ region through the semantic information of the image.\n\nTo solve the above\
    \ limitations, literature[[15]](../Text/chapter112.xhtml#jj-15) proposes an iterative\
    \ visual reasoning system that integrates spatial and semantic information. The\
    \ entire system has two core modules: one is a local reasoning module that introduces\
    \ a memory mechanism on the basis of a convolutional network; the other is a global\
    \ reasoning module that integrates spatial and semantic information. The overall\
    \ reasoning framework is shown in Figure 10-5.\n\n![](img/10a4.jpg)\n\nFigure\
    \ 10-4 What is the target in the blue box?^([\\[1\\]](#chapter110.xhtml#ch1_back))\n\
    \n![](img/10a5.jpg)\n\nFigure 10-5 Reasoning framework structure diagram^([\\\
    [2\\]](#chapter110.xhtml#ch2_back))\n\nThe local reasoning module makes predictions\
    \ with the memory module `S` as input, where the memory module `S` stores the\
    \ location features and image features of the target region extracted through\
    \ the convolutional network.\n\nThe global reasoning module mainly performs reasoning\
    \ based on spatial features and semantic features. Spatial refers to establishing\
    \ connections between spatially non-adjacent regions; semantic refers to establishing\
    \ connections between categories using external knowledge bases. To comprehensively\
    \ utilize these two aspects of information, `GNN` is used as the reasoning module.\
    \ The graph construction uses two types of nodes: one is region nodes composed\
    \ of all regions; the other is entity nodes with all entities corresponding to\
    \ regions as nodes. Edges between nodes are established through the following\
    \ 3 relationships: The first is the association between regions through their\
    \ distance relationships, with edge weights determined by the normalized value\
    \ of the pixel distance kernel function; additionally, for overlapping regions,\
    \ their relationship is established through `IoU` values. The second is the relationship\
    \ between regions and entities, establishing relationships with entities based\
    \ on the predicted probability distribution of regions (`softmax` output), with\
    \ edge weights being the corresponding probability values. The third is the relationship\
    \ between entities, which comes from external knowledge graphs, allowing multiple\
    \ entity relationships to be considered, such as category affiliation, part-whole\
    \ relationships (legs and chairs), singular-plural relationships, horizontal symmetry\
    \ relationships, etc.\n\nBased on the graph constructed above, `GNN` is used for\
    \ reasoning. Region node features come from the convolutional network, and entity\
    \ node features come from pre-trained word vectors. `GNN` reasoning aims to integrate\
    \ spatial and semantic information to reason about regions, so two reasoning paths\
    \ are used. One is region-region, which aggregates features of multiple regions\
    \ to obtain spatial features; the other is region-entity-entity, which is divided\
    \ into two steps: first aggregating region features to entity nodes and fusing\
    \ them with entity node features, then aggregating different types of entity relationships\
    \ to obtain entity features, corresponding to semantic relationships. To obtain\
    \ the final features of regions, through the entity-region relationship, the semantic\
    \ features carried by entities are aggregated to region nodes and fused with the\
    \ spatial features obtained in the first reasoning path. The entire process is\
    \ shown in Figure 10-6.\n\n![](img/10a6.jpg)\n\nFigure 10-6 Schematic diagram\
    \ of global reasoning module^([\\[3\\]](#chapter110.xhtml#ch3_back))\n\nReasoning\
    \ is usually not achieved in one step but is iterative. To pass information from\
    \ the previous round to the next, memory modules can be used. Local reasoning\
    \ and global reasoning use different memory modules `S` and `M`, and the output\
    \ obtained from each iteration is used to update the memory modules. In addition,\
    \ the model introduces an attention mechanism to facilitate the fusion of the\
    \ current predicted value with predicted values generated from other iterative\
    \ processes. The model was tested on different training datasets, and the recognition\
    \ effect improved by 3.7% to 8.4% compared to Convolutional Neural Networks.\n\
    \n[[1]](#chapter110.xhtml#ch1) Image source: `https://es.calcuworld.com/cuantos/cuanto-dura-un-partido-de-beisbol/`。\n\
    \n[[2]](#chapter110.xhtml#ch2) Chen X，Li L J，Fei-Fei L，et al.Iterative visual\
    \ reasoning beyond convolutions\\[C\\]//Proceedings of the IEEE Conference on\
    \ Computer Vision and Pattern Recognition.2018：7239-7248.\n\n[[3]](#chapter110.xhtml#ch3)\
    \ Chen X，Li L J，Fei-Fei L，et al.Iterative visual reasoning beyond convolutions\\\
    [C\\]//Proceedings of the IEEE Conference on Computer Vision and Pattern Recognition.2018：7239-7248.\n\
    \n## 10.3 Future Prospects of GNN\n\nAs an emerging neural network technology,\
    \ the rapid development of `GNN` is inseparable from the important accumulation\
    \ of deep learning in various aspects in recent years. Combined with `GNN`, deep\
    \ learning systems can be empowered to succeed in broader fields and more levels\
    \ of scenario tasks. We are very confident that in the next few years, `GNN` will\
    \ be applied in more and more scenarios.\n\nNext, we summarize the prospects for\
    \ future research on `GNN` from three aspects. Of course, the following views\
    \ are for reference only; readers should also have their own thoughts.\n\n1. \
    \ **Fully Adapt to Complex and Changing Graph Data**\n    On the one hand, the\
    \ types of graph data are extremely diverse, such as dynamic graphs where relationships\
    \ change frequently, hypergraphs where an edge connects more than two nodes; these\
    \ graph data have more complex structures, requiring targeted design by `GNN`.\
    \ On the other hand, `GNN` needs more thorough research and design for heterogeneous\
    \ graphs and attributed graphs to learn the rich and diverse semantic information\
    \ therein.\n\n2.  **Application in More Reasoning Tasks and Research Improvement\
    \ of Learning Mechanisms**\n    Reasoning tasks have become one of the core tasks\
    \ facing current deep learning systems. Although `GNN` has shown unique advantages\
    \ in related tasks, the internal mechanism of action still needs thorough research.\
    \ By continuously improving and developing its learning mechanism, `GNN` can be\
    \ promoted to achieve better performance in more and more complex reasoning tasks.\n\
    \n3.  **Support for Modeling Ultra-Large-Scale Graphs**\n    Most existing Graph\
    \ Neural Networks cannot scale to graph data of huge scale. `GNN` training is\
    \ a collaborative learning method; in one iteration, a node's inherent context\
    \ causes its state update to involve the hidden states of a large number of neighbor\
    \ nodes, with extremely high complexity, making it difficult to apply mini-batch\
    \ training methods to improve computational efficiency. Although some research\
    \ has proposed sampling and partitioning methods to solve such problems, these\
    \ methods are still insufficient to extend to the learning of industrial-grade\
    \ ultra-large-scale attributed graphs.\n\n## 10.4 References\n\n[[1]](../Text/chapter106.xhtml#j1)　Zhou\
    \ J，Cui G，Zhang Z，et al.Graph neural networks：A review of methods and applications\\\
    [J\\].arXiv preprint arXiv：1812.08434，2018.\n\n[[2]](../Text/chapter106.xhtml#j2)　Fout\
    \ A，Byrd J，Shariat B，et al.Protein interface prediction using graph convolutional\
    \ networks\\[C\\]//Advances in Neural Information Processing Systems.2017：6530-6539.\n\
    \n[[3]](../Text/chapter106.xhtml#j3)　Zhang G，He H，Katabi D.Circuit-GNN：Graph Neural\
    \ Networks for Distributed Circuit Design\\[C\\]//International Conference on\
    \ Machine Learning.2019：7364-7373.\n\n[[4]](../Text/chapter106.xhtml#j4)　Narasimhan\
    \ M，Lazebnik S，Schwing A.Out of the box：Reasoning with graph convolution nets\
    \ for factual visual question answering\\[C\\]//Advances in Neural Information\
