    \ the reader's understanding of GCN through a centralized interpretation of some\
    \ of its properties. In Section 6.1, we introduce the connection between GCN and\
    \ CNN, both being convolutional models, from which we can see they have very high\
    \ transferability; in Section 6.2, we focus on elaborating the mechanism of GCN\
    \ for end-to-end learning on graph data; in Section 6.3, from the perspective\
    \ of low-pass filters, the effectiveness of GCN's graph data learning capability\
    \ is explained, and it can be seen that this frequency-domain interpretation has\
    \ significant theoretical significance for guiding the specific design of GCN\
    \ models; in Section 6.4, we introduce a typical problem faced by GCN models—over-smoothing—which\
    \ points out a clear direction for the diagnosis and optimization of GCN models.\n\
    \n## 6.1 Connection between GCN and CNN\n\nIn Chapter 5, we introduced the graph\
    \ convolution operation from the spatial domain perspective; under this perspective,\
    \ the GCN model and the CNN model have a very close common connection. Essentially,\
    \ both are operations that aggregate neighborhood information, merely acting on\
    \ different data objects. Below, we will summarize in more detail several points\
    \ of difference and connection between the two (see Figure 6-1).\n\n![](img/6a1.jpg)\n\
    \n**Figure 6-1** Differences and Connections between CNN and GCN\n\n1. **Images\
    \ are a Special Type of Graph Data**\n\n   The biggest difference between convolution\
    \ computation in CNN and that in GCN is that the adjacency matrix is not explicitly\
    \ expressed in CNN; however, during actual computation, we still need to consider\
    \ the structural relationships between data. If we regard each pixel in an image\
    \ as a node, then under the action of a common 3×3 convolution kernel, the pixels\
    \ within the 3×3 grid around the central node can be equated to its neighbors.\
    \ From this perspective, we treat pixels as nodes and the lines connecting their\
    \ spatial coordinates as edges between them; thus, image data becomes a type of\
    \ graph data with a very regular structure, and the convolution computation in\
    \ CNN is used to process this type of graph data with a fixed 2D grid structure.\
    \ In contrast, generally speaking, graph data often has vastly different neighborhood\
    \ structures around individual nodes, and the relationships between data are more\
    \ complex and diverse; the convolution computation in GCN is used to process more\
    \ general unstructured graph data.\n\n2. **From the Perspective of Network Connectivity,\
    \ Both are Locally Connected**\n\n   From the computation process of a single\
    \ node, GCN's computation is: `H^(l+1) = σ(D^-0.5 * A * D^-0.5 * H^(l) * W^(l))`,\
    \ acting on its first-order subgraph; CNN's computation is: `Y = σ(W * X + b)`,\
    \ acting on the 3×3 grid around the central pixel. This way, where the feature\
    \ computation of the next layer of a node depends only on its own neighborhood,\
    \ manifests as a locally connected structure in network connectivity. Compared\
    \ to fully connected structures, local connectivity greatly reduces the computational\
    \ complexity of a single network layer. However, there is a certain difference\
    \ in weight setting: due to the fixed grid structure in image data, CNN's convolution\
    \ kernel designs 9 sets of weight parameters, whereas to adapt to different graph\
    \ data structures, GCN's convolution kernel weight parameters degrade to a single\
    \ set; this difference can be intuitively seen in Figure 6-1. In terms of fitting\
    \ capability, CNN has the advantage.\n\n3. **The Weights of Both Convolution Kernels\
    \ are Shared Across All Locations**\n\n   Like CNN, the convolution kernel in\
    \ GCN also acts on all nodes of the entire graph, and the weight parameters are\
    \ shared in the computation at each node; this treatment greatly reduces the parameter\
    \ count of a single network layer and can effectively avoid the occurrence of\
    \ overfitting.\n\n4. **From the Model Perspective, the Receptive Field Expands\
    \ as Convolutional Layers Increase**\n\n   With each additional layer of convolution\
    \ computation, the central node can integrate information from one more outer\
    \ \"ring\". As shown in Figure 6-2, in CNN, the center's receptive field expands\
    \ continuously from 3×3 in the first layer to 5×5 in the second layer. In GCN,\
    \ the information the central node can integrate expands from first-order neighbors\
    \ to second-order neighbors; the receptive fields of both expand as convolutional\
    \ layers increase. At the same time, we can see that in both types of models,\
    \ the update of the node's own features is strongly coupled with the convolution\
    \ operation; the addition of each new convolutional layer enables the node to\
    \ obtain more abstract feature representations.\n\n   ![](img/6a2.jpg)\n\n   **Figure\
    \ 6-2** Receptive Fields of CNN and GCN\n\nAdditionally, from the perspective\
    \ of learning tasks, CNN and GCN also have very strong analogy. Figures 6-3a and\
    \ 6-3b show two mainstream tasks in computer vision: image classification and\
    \ image segmentation. Image classification is a task that requires learning global\
    \ information of data, which corresponds to the graph classification task at the\
    \ whole-graph level; as shown in Figure 6-3c, researchers construct graphs using\
    \ brain signals to classify brain signal graphs of healthy individuals, Alzheimer's\
    \ patients, and patients with mild cognitive impairment.\n\n![](img/6a3.jpg)\n\
    \n**Figure 6-3** Task Comparison between CNN and GCN[[1]](#chapter67.xhtml#ch1_back)[[2]](#chapter67.xhtml#ch2_back)\n\
    \nImage segmentation, as shown in Figure 6-3b, is a task requiring integrated\
    \ learning of pixels and their local information; the model finally needs to classify\
    \ each pixel, which corresponds to the node classification task at the node level\
    \ in graph data; Figure 6-3d shows how GCN classifies each node (representing\
    \ a paper) in the graph into subject categories based on the citation dataset.\
    \ As an important graph data learning model, the tasks of GCN and its derived\
    \ models mainly include graph classification and node classification.\n\nThis\
    \ strong correlation between GCN and CNN gives them high analogy in many aspects,\
    \ which points the direction for the design and development of GCN; in Chapter\
    \ 8 of this book when we discuss graph classification models, we will once again\
    \ see the effect of this borrowing.\n\n[1] Image source: https://ccvl.jhu.edu/datasets/.\n\
    \n[2] Image source: https://www.frontiersin.org/articles/10.3389/fncom.2018.00031/full.\n\
    \n## 6.2 GCN Enables End-to-End Learning on Graph Data\n\nIn recent years, with\
    \ the development of deep learning, end-to-end learning has become increasingly\
    \ important; it is widely believed that the success of deep learning is inseparable\
    \ from the mechanism of end-to-end learning. End-to-end learning implements a\
    \ mechanism for automated efficient learning from data. However, the achievement\
    \ of this highly automated characteristic of end-to-end learning often relies\
    \ on a large amount of adaptation work behind the scenes for learning tasks on\
    \ specific types of data; this adaptation is reflected in the design of various\
    \ popular network layers or block structures (blocks), such as the well-known\
    \ `Conv2D` layer for learning image data, `LSTM` layer for learning sequential\
    \ data, `Global Pooling` layer for extracting global information, etc. The computation\
    \ process of these layers must adapt to the intrinsic regular patterns of data\
    \ in the way we expect as much as possible. A large amount of practical experience\
    \ tells us that deep learning's ability to achieve extremely excellent results\
    \ in a certain scenario task is largely due to the customized design of such network\
    \ layers or network blocks built from them.\n\nTherefore, if we want to achieve\
    \ end-to-end learning on graph data, the learning system must be able to adapt\
    \ to the intrinsic patterns of graph data.\n\nIn Chapter 1, we introduced that\
    \ attributed graphs are a most widely used form of graph data representation.\
    \ In an attributed graph, each node has its own attributes. As shown in Figure\
    \ 6-4a, in a social network scenario, user nodes have attributes such as gender\
    \ and age; these attributes are very important for characterizing user identity.\
    \ At the same time, we can see two nodes with very high in-degree in the graph;\
    \ to a large extent, these nodes represent the \"Big V\" users (influencers) in\
    \ the social network. Figure 6-4b shows the molecular formulas and structures\
    \ of ethanol and dimethyl ether; although both have the molecular formula C₂H₆O,\
    \ they have different physicochemical properties due to different molecular structures.\n\
    \nSummarizing the above two examples, we can find that graph data simultaneously\
    \ contains two parts of information: attribute information and structural information.\
    \ Attribute information describes the inherent properties of objects in the graph;\
    \ structural information describes the relational properties between objects.\
    \ This structure arising from associations not only greatly helps characterize\
    \ nodes in graph data but also plays a key role in characterizing the whole graph.\
    \ An excellent learning system for graph data must be able to perform end-to-end\
    \ learning on both attribute information and structural information.\n\n![](img/6a4.jpg)\n\
    \n**Figure 6-4** Graph Data Examples\n\nNext, let's look at how GCN's design adapts\
    \ to the intrinsic patterns of graph data. To more vividly illustrate GCN's end-to-end\
    \ learning capability on graph data, we compare the two very typical graph data\
    \ learning methods mentioned earlier—hand-crafted feature-based methods and random\
    \ walk-based methods. Generally, the processing of attribute information in graph\
    \ data is relatively simple: design corresponding encoding according to attribute\
    \ types, then concatenate them into a feature vector representing node attributes;\
    \ however, structural information is embedded in the relationships between nodes\
    \ and is relatively difficult to process. The core of the two methods we compare\
    \ lies in how to process the graph's structural information, as shown in Figures\
    \ 6-5 and 6-6.\n\n![](img/6a5.jpg)\n\n**Figure 6-5** Hand-crafted Feature-based\
    \ Method\n"
