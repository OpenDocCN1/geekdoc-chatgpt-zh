    \    Returns:\n            [torch.Tensor]: 未归一化的分类输出，shape=(num_edges, num_classes)\n\
    \        \"\"\"\n        user_inputs = user_inputs[user_indices]\n        item_inputs\
    \ = item_inputs[item_indices]\n        outputs = []\n        for weight in self.weights:\n\
    \            tmp = torch.matmul(user_inputs, weight)\n            out = tmp *\
