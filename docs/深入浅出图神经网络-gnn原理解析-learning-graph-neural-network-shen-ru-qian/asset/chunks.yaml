    \   super(SelfAttentionPooling, self).__init__()\n        self.input_dim = input_dim\n\
    \        self.keep_ratio = keep_ratio\n        self.activation = activation\n\
    \        self.attn_gcn = GraphConvolution(input_dim, 1)\n    \n    def forward(self,\
