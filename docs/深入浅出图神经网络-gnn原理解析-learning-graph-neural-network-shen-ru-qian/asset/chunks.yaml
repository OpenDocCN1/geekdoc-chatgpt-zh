    \        item_outputs = self.activation(item_hidden)\n        \n        if self.use_bias:\n\
    \            user_outputs += self.bias\n            item_outputs += self.bias_item\
    \  # 注意：此处代码原文为 `self.bias_item`，可能为笔误，应为 `self.bias`\n        \n        return\
    \ user_outputs, item_outputs\n```\n\n## 代码清单 9-2：SumGCNEncoder（基于求和的编码器）\n\n```python\n\
    class SumGCNEncoder(nn.Module):\n    def __init__(self, input_dim, output_dim,\
    \ num_support, \n                 use_bias=False, activation=F.relu):\n      \
    \  \"\"\"对得到的每类评分使用求和的方式进行聚合\n        \n        Args:\n            input_dim (int):\
    \ 输入的特征维度\n            output_dim (int): 输出的特征维度，需要 `output_dim % num_support\
    \ == 0`\n            num_support (int): 评分的类别数，比如 1~5 分，值为 5\n            use_bias\
    \ (bool, optional): 是否使用偏置. Defaults to False.\n            activation (optional):\
    \ 激活函数. Defaults to `F.relu`.\n        \"\"\"\n        super(SumGCNEncoder, self).__init__()\n\
    \        self.input_dim = input_dim\n        self.output_dim = output_dim\n  \
    \      self.num_support = num_support\n        self.use_bias = use_bias\n    \
    \    self.activation = activation\n        self.weight = nn.Parameter(torch.Tensor(input_dim,\
    \ output_dim * num_support))\n        if self.use_bias:\n            self.bias\
    \ = nn.Parameter(torch.Tensor(output_dim, ))\n        self.reset_parameters()\n\
    \        self.weight = self.weight.view(input_dim, output_dim, 5)\n\n    def reset_parameters(self):\n\
    \        init.kaiming_uniform_(self.weight)\n        if self.use_bias:\n     \
    \       init.zeros_(self.bias)\n\n    def forward(self, user_supports, item_supports,\
    \ user_inputs, item_inputs):\n        \"\"\"SumGCNEncoder 计算逻辑\n        \n   \
    \     Args:\n            user_supports (list of `torch.sparse.FloatTensor`): \n\
    \                归一化后每个评分等级对应的用户与商品邻接矩阵\n            item_supports (list of `torch.sparse.FloatTensor`):\n\
    \                归一化后每个评分等级对应的商品与用户邻接矩阵\n            user_inputs (`torch.Tensor`):\
    \ 用户特征的输入\n            item_inputs (`torch.Tensor`): 商品特征的输入\n        \n     \
    \   Returns:\n            [`torch.Tensor`]: 用户的隐藏层特征\n            [`torch.Tensor`]:\
    \ 商品的隐藏层特征\n        \"\"\"\n        assert len(user_supports) == len(item_supports)\
    \ == self.num_support\n        user_hidden = 0\n        item_hidden = 0\n    \
    \    for i in range(self.num_support):\n            tmp_u = torch.matmul(self.weight[...,\
    \ i], user_inputs)\n            tmp_v = torch.matmul(self.weight[..., i], item_inputs)\n\
    \            tmp_user_hidden = torch.sparse.mm(user_supports[i], tmp_v)\n    \
    \        tmp_item_hidden = torch.sparse.mm(item_supports[i], tmp_u)\n        \
    \    user_hidden += tmp_user_hidden\n            item_hidden += tmp_item_hidden\n\
    \        \n        user_outputs = self.activation(user_hidden)\n        item_outputs\
    \ = self.activation(item_hidden)\n        \n        if self.use_bias:\n      \
    \      user_outputs += self.bias\n            item_outputs += self.bias_item \
    \ # 注意：此处代码原文为 `self.bias_item`，可能为笔误，应为 `self.bias`\n        \n        return\
    \ user_outputs, item_outputs\n```\n\n## 非线性变换层\n\n上面得到的 GCN 编码特征需要再经过一个非线性变换以得到最终的特征，如式（9.22）所示。用户与商品可以共享相同的参数\
    \ `W`，也可以使用不同的变换参数，具体实现见代码清单 9-3。\n\n![](img/192-i.jpg)\n\n### 代码清单 9-3：FullyConnected（非线性变换）\n\
    \n```python\nclass FullyConnected(nn.Module):\n    def __init__(self, input_dim,\
    \ output_dim,\n                 use_bias=False, activation=F.relu,\n         \
    \        share_weights=False):\n        \"\"\"非线性变换层\n        \n        Args:\n\
    \            input_dim (int): 输入的特征维度\n            output_dim (int): 输出的特征维度\n\
    \            use_bias (bool, optional): 是否使用偏置. Defaults to False.\n         \
    \   activation (optional): 激活函数. Defaults to `F.relu`.\n            share_weights\
    \ (bool, optional): 用户和商品是否共享变换权值. Defaults to False.\n        \n        \"\"\"\
    \n        super(FullyConnected, self).__init__()\n        self.input_dim = input_dim\n\
    \        self.output_dim = output_dim\n        self.use_bias = use_bias\n    \
    \    self.activation = activation\n        self.share_weights = share_weights\n\
    \        self.linear_user = nn.Linear(input_dim, output_dim, bias=use_bias)\n\
    \        if self.share_weights:\n            self.linear_item = self.linear_user\n\
    \        else:\n            self.linear_item = nn.Linear(input_dim, output_dim,\
    \ bias=use_bias)\n\n    def forward(self, user_inputs, item_inputs):\n       \
    \ \"\"\"前向传播\n        \n        Args:\n            user_inputs (`torch.Tensor`):\
    \ 输入的用户特征\n            item_inputs (`torch.Tensor`): 输入的商品特征\n        \n     \
    \   Returns:\n            [`torch.Tensor`]: 输出的用户特征\n            [`torch.Tensor`]:\
    \ 输出的商品特征\n        \"\"\"\n        user_outputs = self.linear_user(user_inputs)\n\
    \        item_outputs = self.linear_item(item_inputs)\n        if self.activation:\n\
    \            user_outputs = self.activation(user_outputs)\n            item_outputs\
    \ = self.activation(item_outputs)\n\n        return user_outputs, item_outputs\n\
    ```\n\n## 解码器实现\n\n这样就得到了用户和商品的表达。下面我们根据用户与商品的表达，通过解码器重构邻接矩阵。由于有多种评分等级，需要对每种评分等级进行重构，这里将这个重构转换为一个分类问题来实现。具体来说，就是根据用户和商品的特征得到条件概率\
    \ $P(r|u,v)$，这个值通过 Softmax 归一化得到，如式（9.23）所示，其中 $Q[r] \\in \\mathbb{R}^{d \\times\
    \ d}$，其中 $d$ 为编码特征维度：\n\n![](img/193-1.jpg)\n![](img/193-i.jpg)\n\n损失函数选择交叉熵，每类评分的损失通过求和得到，如式（9.24）所示：\n\
    \n![](img/193-2-i.jpg)\n\n下面根据式（9.23）来实现解码器。为了便于实现，将用户与商品之间的邻接矩阵转换为 `(id(u[i]),\
    \ id(v[j]), r)` 的 RDF 形式，其中的 `user_indices` 就是所有 RDF 的起点，如代码清单 9-4 所示。\n\n###\
    \ 代码清单 9-4：解码器\n\n*(注：原文在此处截断，代码清单 9-4 的具体代码未提供)*\n\n"
