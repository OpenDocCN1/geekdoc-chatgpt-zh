  fmt: "\n## 10.2 GNN的典型应用场景\n\n### 10.2.1 点云数据处理\n\n在`GNN`被应用到点云数据处理之前，一种解决思路是将点云强制表示为`voxel`，这样就得到与图像类似的一种三维规则结构，以便进行卷积和池化操作。但这种处理方式会使得数据量剧增，并且会产生很大的数据冗余，计算开销非常大。另一种解决思路是将点云转换为`Multi-view\
    \ Images`，即一组虚拟的二维快照，生成RGB和包含几何特征的合成视图，然后在图像处理完毕后再将其语义分段投影回原始的点云数据[^([9])](../Text/chapter112.xhtml#jj-9)。这种方法并不能捕捉3D点云的内在结构，因而识别性能有限。实际上，这两种曲线救国的方法都会造成信息的丢失或者数据的冗余，且转换过程复杂度高，对于大规模的点云数据处理和点云理解都无法适应。\n\
    \n图卷积技术的发展极大地推动了点云的处理方法的进步，人们提出了很多基于`GNN`的方法，在点云分类、分割等问题上展现了优异的性能。这里以近年来提出的典型`GNN`模型为例，阐述`GNN`技术在应用于点云这种非结构化数据时的关键步骤。\n\
    \n点云数据中的点是离散存在的，点与点间的距离`d`是确定点彼此之间关系的基础。基于点坐标（`x`，`y`，`z`）的欧式空间距离是一种常见的选择；其他非欧式空间的距离选择如测地（`geodesic`）距离、形状感知距离等，可以很好地处理非刚性特征，也被很多研究者应用，如`Charles\
    \ R.Qi`等人（2017）提出的`PointNet++`算法[^([10])](../Text/chapter112.xhtml#jj-10)。\n\n\
    有了距离即可确定点与点之间的邻接关系。如何将距离转化成邻接关系，成为运用`GNN`技术的一个关键点。通常我们需要定义邻域，每个点都与其邻域范围内的点相连，而与邻域以外的点无邻接关系。邻域范围可以根据`KNN`（`K`最近邻法）确定，也可以根据`球查询`（落某半径范围的球状区域内的所有点）确定。值得注意的是，点之间的邻接关系在每一层的图中并不是固定不变的。`PointNet++`算法中采用了每一层固定邻域点进行卷积操作的策略，而在`Edge-Conv`的算法[^([11])](../Text/chapter112.xhtml#jj-11)中，每一层中的图都可以动态地调整图中节点之间的邻接关系，`K`邻域内的点随着网络的更新发生变化，这样就能自适应地捕捉和更新点云的局部几何特征，在点云分类和分割中取得很好的效果。\n\
    \n邻接关系确定后的另一个关键步骤是基于邻接边的卷积该如何实现。如图10-2所示，定义`e[ij]=h[Θ](x[i],x[j])`为点`v[i]`和点`v[j]`间的边，其中`h[Θ]`为含有可学习参数`Θ`的非线性函数。\n\
    \n![](Images/10a2.jpg)\n\n图10-2　边卷积示意图\n\n以节点`v[i]`为中心的卷积计算如式（10.1）所示：\n\n![](Images/202-2-i.jpg)\n\
    \n`PointNet++`和`Atzmon`等（2018）提出的`PCNN`方法[^([12])](../Text/chapter112.xhtml#jj-12)采用`h[Θ](x[i],x[j])=h[Θ](x[j])`的方式，即卷积值通过对邻居进行聚合得到。若以`Θ=(θ[1],…,θ[m])`表示卷积滤波矩阵的权重，以`PCNN`算法为例，卷积的计算如式（10.2）所示：\n\
    \n![](Images/202-3-i.jpg)\n\n其中，`g`表示高斯核函数，`d(x[i],x[j])`表示点`v[i]`和`v[j]`之间的距离，与节点的特征相关。而`Edge-Conv`算法中采用的则是非对称方程![](Images/202-4-i.jpg)。\n\
    \n可以看到点云数据中的卷积定义与`GNN`如出一辙。通常来说，模型的输入是点云数据的三维坐标值（`x`，`y`，`z`），因此输入矩阵是`N×3`，`N`表示点云的个数（用户可以根据需要增加其他属性信息）。对于点云分类而言，重点是识别整个数据集属于什么类别，因此输出值是关于类别的标签，属于图层面的输出。假设判定集有`K`个类别，那么输出为`K`维的打分向量。对于点云分割而言，需要知道每个点云属于哪一部分，假设`P`物体子部位的数目，因此模型输出为`N×P`维的打分矩阵，属于节点层面的输出。点云分类侧重于学习数据集的全局特征，而点云分割除了学习全局特征以外，还需要结合局部几何特征共同得到。因此在分割中，点云网络中局部关系（邻接关系）的定义显得更为重要。我们可以看到，通过不同的卷积策略和模型架构，基于图的深度学习方法为点云这样一种比图像更复杂的数据格式的处理和分析提供了高效的解决方案。\n\
    \n### 10.2.2 基于社交网络的推荐系统\n\n登录在线社区，如微博、微信、豆瓣、大众点评等网站，已经成为现代人日常生活中重要的一部分。在这些网络平台上用户可以查看或发布资讯、关注好友、评论感兴趣的文章等。为用户推荐其感兴趣的内容，一方面可以增加网站的活跃度，另一方面也可以帮助用户发现其潜在关注信息、增强用户黏度，当然基于用户特征进行广告推荐也是网站重要的盈利方式之一。因此，建立有效的推荐模型对于社交网站的运营和发展十分重要。\n\
    \n有别于其他场景下的推荐应用，在线社区由于存在显式的用户社交网络信息，如何将这部分信息编码进推荐系统是一个十分关键的问题。总的来说，在线社区的推荐系统建模有以下几个难点：其一，用户兴趣有长期兴趣和短期兴趣之分。短期兴趣本身是动态变化的，用户可能前一段时间沉迷于明星的八卦新闻，过一段时间之后可能又对文学或是电影兴趣盎然。其二，用户会受到其在线社交圈中的朋友的影响（为简化表达，这里把用户在社交网络中建立了社交关系（如关注）的人通称为“朋友”）。如果用户A的朋友是体育迷，经常发布关于体育赛事、体育明星等的信息，用户A很可能也会去了解相关体育主题的资讯。其三，社交网络对用户兴趣的影响并非固定或恒定的，而是根据用户处境（`context`）动态变化的。举例来说，用户在听音乐时更容易受平时爱好音乐的朋友的影响，在购买电子产品时更容易受电子发烧友朋友的影响。\n\
    \n下面以文献[[13]](../Text/chapter112.xhtml#jj-13)提出的`DGR[EC]`模型为例，阐述其如何融合社交网络信息从而搭建推荐系统。如图10-3所示，该方法由4个部分构成：\n\
    \n![](Images/10a3.jpg)\n\n图10-3　`DGR[EC]`模型^([\\[1\\]](#chapter109.xhtml#ch1_back))\n\
    \n（1）一个循环神经网络`RNN`——用来建模用户的动态兴趣偏好。动态兴趣偏好可以从用户在当前会话（`session`）中已消费的项目（`item`）序列中获取。比如，当用户在一次会话中接连购买了靴子、外套等商品，那么明显用户此时的购物偏好为衣物类型，这种动态的兴趣偏好会极大地影响用户下一次的消费行为。\n\
    \n（2）用户朋友的兴趣偏好通过其长期兴趣偏好与短期兴趣偏好组合而成。长期兴趣爱好反映了一个用户稳定的兴趣所在，可以通过对用户进行嵌入方式来表示；短期兴趣爱好则反映了一个用户在近期（一个或多个会话中）的兴趣漂移，可以使用`RNN`建模近期消费的项目序列来表示。\n\
    \n（3）一个图注意力网络`GAT`——用来建模用户的动态兴趣偏好与朋友的兴趣偏好的交互模式，这是该方法最为关键的一个部分，自适应地学习出了社交网络对用户消费行为的影响的表示向量。上面提到过，用户实际的消费行为不仅受到朋友的影响，还依据用户处境受到不同朋友不同权重的影响。因此，使用一个基于注意力机制的`GAT`模型，可以很好地捕捉上述两层影响因素，对社交网络信息做到一种自适应的刻画。\n\
    \n（4）用户下一步的消费行为由用户动态兴趣偏好与社交网络影响两部分信息综合决定。通过对（1）、（3）两个部分的输出进行组合从而得到用户的表示，然后和其他的推荐方法一样，由用户–项目对的信息进行`DGR[EC]`模型的端对端训练。在本文的实验部分，作者将`DGR[EC]`模型在豆瓣^([\\\
    [2\\]](#chapter109.xhtml#ch2_back))、`Delicious`^([\\[3\\]](#chapter109.xhtml#ch3_back))、`Yelp`^([\\\
    [4\\]](#chapter109.xhtml#ch4_back))等网络平台的数据集上进行实验，均取得了当下最好效果。同时作者也设计实验证明了`GAT`对于效果提升的必要性。\n\
    \n值得一提的是，有研究者指出，不仅用户之间的关系在推荐效果中起着较大作用，被推荐项目之间的关系同样有影响。例如，外套和鞋子之间的关系就比外套和花盆之间的关系更强，这种项目之间的内在关系也对用户消费行为的推荐起作用。基于此，文献[[14]](../Text/chapter112.xhtml#jj-14)提出用双图注意力网络模型来同时建模用户与用户、项目与项目之间的双重网络效应，以此捕捉更加全面的关系信息从而提升推荐系统的效果。\n\
