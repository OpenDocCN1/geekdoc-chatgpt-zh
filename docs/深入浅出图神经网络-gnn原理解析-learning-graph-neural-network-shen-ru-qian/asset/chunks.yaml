    # Chapter 8 Graph Classification


    Graph classification is an important graph-level learning task. Unlike node-level
    tasks, graph classification requires attention to the global information of graph
    data, encompassing both the structural information of the graph and the attribute
    information of individual nodes. Given a set of graphs and their corresponding
    labels, the graph classification task aims to learn a graph classification model
    mapping graphs to their respective labels; the core of the model lies in how to
    learn an excellent whole-graph representation vector through learning.


    The graph classification task is similar to classification tasks in visual images;
    both require the fusion and learning of global information. In `CNN` models, the
    common approach is to gradually extract global information through a **Hierarchical
    Pooling** mechanism. Thanks to the regular grid structure in image data, fixed-size
    and fixed-stride sliding windows enable simple operations like max pooling or
    average pooling to efficiently extract high-order information. However, for irregularly
    structured graph data, the direct transfer of such pooling operations becomes
    infeasible. Implementing a hierarchical pooling mechanism in graph classification
    tasks is a fundamental problem that `GNN`s need to solve.


    This chapter consists of three parts: graph classification based on one-shot global
    pooling, graph classification based on hierarchical pooling, and a practical implementation
    of a graph classification model based on `SAGPool`.


    ## 8.1 Graph Classification Based on Global Pooling


    In the `MPNN` introduced in Chapter 7, besides proposing a general framework for
    node representation learning in graphs, the authors also designed a **readout**
    mechanism to perform a one-shot aggregation of all nodes after `K` rounds of iteration,
    thereby outputting a global graph representation:


    ![](img/156-i.jpg)


    The readout mechanism is exactly analogous to the **Global Pooling** operation
    commonly used in `CNN` models, which typically follows the last convolutional
    layer. Both obtain a global expression through a one-shot aggregation of all inputs.
    Similar to common pooling types, the readout mechanism can also adopt functions
    of types such as `Sum`, `Mean`, `Max`, etc.


    A method very similar to the readout mechanism is introduced in Reference [\[1\]](../Text/chapter97.xhtml#hh-1),
    which introduces a virtual node connected to all nodes, equating the representation
    of the whole graph to the representation of this virtual node. This idea is also
    reflected in the update process of the global representation `u` in `GN`.


    Obviously, the readout mechanism''s processing loses the rich structural information
    within the graph data. Essentially, it treats the input data as a flat, regular
    structured dataset where all nodes are treated equally, which contradicts the
    nature of graph data itself. From this perspective, the readout mechanism is more
    suited for learning on small graph data: on one hand, because structural information
    in small graphs is relatively simple; on the other hand, after `K` rounds of message
    passing iteration, the representations of nodes in the graph become closer to
    the global representation, at which point the readout mechanism can also extract
    global information relatively well. Additionally, from a practical engineering
    perspective, the readout mechanism is easy to implement and serves well as a baseline
    model for graph classification.


    ## 8.2 Graph Classification Based on Hierarchical Pooling


    This section introduces three different approaches for implementing hierarchical
    pooling on graph data.


    (1) **Pooling Mechanism based on Graph Coarsening**: Graph coarsening partitions
    the graph into different subgraphs, then treats subgraphs as supernodes to form
    a coarsened graph. These methods precisely utilize this approach to achieve hierarchical
    learning of global graph information.


    (2) **Pooling Mechanism based on TopK**: A score is learned for each node in the
    graph, and low-scoring nodes are discarded based on the ranking of these scores.
    This type of method borrows the idea of the max pooling operation in `CNN`s: filtering
    out more important information. The difference lies in the difficulty of implementing
    local sliding window operations on graph data; therefore, global selection based
    on scores is required.


    (3) **Pooling Mechanism based on Edge Contraction**: Edge contraction refers to
    removing edges in the graph in parallel and merging the two nodes of the removed
    edge, while preserving the connectivity of the removed nodes. This approach is
    a method for gradually learning global graph information through merging operations.


    ### 8.2.1 Pooling Mechanism Based on Graph Coarsening


    #### 1. Graph Coarsening


    Assume for graph `G`, a partitioning strategy yields `K` subgraphs `G^(k)`. `N[k]`
    denotes the number of nodes in subgraph `G^(k)`, and `Г^(k)` denotes the node
    list in subgraph `G^(k)`.


    ![](img/8a1.jpg)


    Figure 8-1 Graph Coarsening Example


    Below we present two important matrices in graph coarsening:


    The first is the **cluster assignment matrix** `S∈R^(N×K)`, defined as follows:
    `S[ij]=1` if and only if `v[i]∈Г^(j)`.


    For example, in the graph coarsening example shown in Figure 8-1, we partition
    graph `G` into two clusters. These two clusters correspond to the two supernodes
    after coarsening, where `Г¹={v[1],v[2],v[3]}`, `Г²={v[4],v[5],v[6]}`. Therefore:


    ![](img/157-3-i.jpg)


    Next, let us examine the significance of `S^TAS`: since the `i`-th row of `S^T`
    represents all nodes belonging to the `i`-th cluster, according to matrix multiplication,
    `(S^TA)[ij]` represents the sum of connection strengths of all nodes in the `i`-th
    cluster associated with node `v[j]` (the `j`-th node in the whole graph). Similarly,
    `((S^TA)S)[ij]` reflects the connection strength between the `i`-th cluster and
    the `j`-th cluster. As in the example in Figure 8-1:


    ![](img/158-i.jpg)


    If we define:


    ![](img/158-2-i.jpg)


    `A[coar]` describes the connection strengths between supernodes after graph coarsening,
    including the internal connection strengths within supernodes. If only inter-supernode
    connection strengths are considered, we can set `A[coar][i,i]=0`.


    The second is the **sampling operator** `C∈R^(N×Nk)`, defined as: `C[ij]=1` if
    and only if `v[i]=Г^(k)[j]`.


    Here, `Г^(k)[j]` denotes the `j`-th element in the list `Г^(k)`. `C` is an indicator
    matrix for the sequential relationship of nodes in the original graph and subgraphs.
    For instance, the `C` in the above example.


    Assuming a 1D graph signal defined on `G` is `x∈R^N`, the following two equations
    perform downsampling and upsampling operations on the graph signal, respectively:


    ![](img/159-i.jpg)


    The left equation above performs the sampling (slicing) function of the graph
    signal on subgraph `G^(k)`; the right equation performs the upsampling function
    of the subgraph signal `x^(k)` on the whole graph, keeping the signal values of
    nodes in the subgraph unchanged while setting the values of other nodes not belonging
    to the subgraph to `0`. Obviously, this sampling operator also applies to multi-dimensional
    signal matrices `X∈R^(N×d)`.


    With the definition of the sampling operator, the adjacency matrix `A^(k)` of
    subgraph `G^(k)` can be obtained by the following formula (in fact, `A^(k)` can
    also be obtained by performing a bidirectional matrix slicing operation on `A`):


    ![](img/159-3-i.jpg)


    According to Equation (8.4), the adjacency matrix within the first cluster in
    the above example can be obtained:


    ![](img/159-4-i.jpg)


    Through the above two matrices, the adjacency relationships within clusters and
    between clusters can be determined. Furthermore, if the fusion method for intra-cluster
    signals can be determined and the result represented as signals on supernodes,
    then by iteratively repeating the above process, increasingly global graph signals
    can be obtained. Figure 8-2 shows the process of combining graph coarsening with
    `GNN`: the figure illustrates a `GNN` model that undergoes 3 pooling layers and
    finally coarsens into a single supernode, followed by a graph classification task.
    Nodes of the same color in the figure are partitioned into one cluster, forming
    a supernode in the next layer. After obtaining the feature vector of the final
    supernode, a three-layer `MLP` network is immediately used for the graph classification
    learning task.


    ![](img/8a2.jpg)


    Figure 8-2 Process of Combining Graph Coarsening with GNN[^(\[2\])](../Text/chapter97.xhtml#hh-2)


    #### 2. DIFFPOOL


    `DIFFPOOL`^([\[1\]](#chapter93.xhtml#ch1_back)) is the first algorithm to combine
    the graph coarsening process with `GNN` for graph-level task learning. `DIFFPOOL`
    proposes a **learnable cluster assignment matrix**. Specifically, a `GNN` first
    performs feature learning for each node, and then another `GNN` learns the probability
    distribution of each node belonging to each cluster:


    ![](img/160-2-i.jpg)


    Here `S^(l)∈R^(n^(l)×n^(l+1))`, `n^(l)` denotes the number of nodes in layer `l`,
    and `n^(l+1)` denotes the number of nodes (clusters) in layer `l+1`. Unlike the
    hard assignment of the `S` matrix in the example above, the learned `S` matrix
    here is a **soft assignor**; its values represent the probability of a node being
    assigned to any cluster. Since probability values are non-zero, this forms a fully
    connected structure between lower-layer supernodes and all upper-layer nodes.
    `GNN[l,embed]` and `GNN[l,pool]` are two independent `GNN` layers; they share
    the same input but have different parameters and learning objectives. It is worth
    emphasizing that for the cluster assignment matrix of the last layer, we need
    to fix this matrix directly as an all-"1" matrix. This is because at this point
    the graph needs to be coarsened into a single supernode to obtain the global representation
    of the graph.


    With the output results of the above two equations, we can coarsen the graph:


    ![](img/160-4-i.jpg)

    ![](img/161-i.jpg)


    This paper refers to the above two formulas as the `DIFFPOOL` layer (`(A^(l),Z^(l))→(A^(l+1),H^(l+1))`).
    Equation (8.7) performs a fusion operation on intra-cluster information; according
    to the row-vector calculation method of matrix multiplication, it is clear that
    `H^(l+1)[i]` represents the sum of feature vectors of all nodes within the cluster.
    Equation (8.8) is the calculation of the inter-cluster adjacency matrix.


    `DIFFPOOL` possesses **permutation invariance**: Assume `P∈{0,1}^(n×n)` is an
    arbitrary permutation matrix; as long as the `GNN` layers used previously are
    permutation invariant, the `DIFFPOOL` layer possesses permutation invariance,
    i.e.:


    ![](img/161-3-i.jpg)


    The function of a permutation matrix is to reorder nodes in the graph. For example,
    for a graph with only two connected nodes, if we need to swap the indices of the
    two nodes, the corresponding permutation matrix is `P=[[0,1],[1,0]]`. A permutation
    matrix is orthogonal, i.e., `P^TP=I`. We can obtain the reordered feature matrix
    and adjacency matrix through `PX` and `PAP^T`, respectively.


    Proof: Assume the `GNN` model used is the `GCN` model, which satisfies permutation
    invariance. Let the `GCN` output be `Z=GCN(A,X)`. Now use `P` to reorder the input:


    ![](img/161-6-i.jpg)


    Here the property `P^TP=I` is used. Thus, reordering the input nodes of `GCN`
    results in a corresponding reordering of output nodes, but the output representation
    vectors of the nodes do not change. Therefore, `GCN` possesses permutation invariance
    (also referred to as permutation equivariance by some, due to the permutation
    invariance of the aggregation operation used by `GCN`; see Section 7.1 for details).


    Substituting the `GCN` outputs at this point into Equations (8.7) and (8.8) of
    `DIFFPOOL` yields:


    ![](img/162-i.jpg)


    From the results obtained, it can be seen that this reordering operation does
    not change the two output results of `DIFFPOOL`. Thus, Equation (8.9) is proven.


    In summary, if we view `GCN` and `DIFFPOOL` together as a layer, arbitrary renumbering
    of the input graph data will not change the feature matrix and adjacency matrix
    output to the next layer. This property is highly intuitive: node reordering should
    not affect the result of node aggregation into clusters.


    With the definition of the `DIFFPOOL` layer above, we can mimic the structural
    design of `CNN` classification models, continuously combining and stacking `GNN`
    layers and `DIFFPOOL` layers to implement a differentiable, hierarchical pooling
    learning mechanism, gradually obtaining global graph representations. A possible
    graph classification model structure has been given in Figure 8-2 and will not
    be repeated here.


    [\[1\]](#chapter93.xhtml#ch1) Ying Z, You J, Morris C, et al. Hierarchical graph
    representation learning with differentiable pooling[C]//Advances in Neural Information
    Processing Systems. 2018: 4800-4810.


    #### 3. EigenPooling


    `EigenPooling`[^(\[3\])](../Text/chapter97.xhtml#hh-3) is also a pooling mechanism
    based on graph coarsening, but unlike other methods introduced in this chapter,
    `EigenPooling` does not introduce any learnable parameters into the graph classification
    model. This non-parametric pooling mechanism bears a high analogy to various pooling
    layers in vision models, as shown in Table 8-1:


    Table 8-1 Comparison of EigenPooling with Pooling in Vision Models


    ![](img/8b1.jpg)


    From Table 8-1, we can once again see that `GNN` models and `CNN` models are essentially
    different paths leading to the same goal. Returning to the specific process of
    `EigenPooling`, its core steps lie in the selection of the receptive field and
    the pooling operation. The receptive field is obtained by partitioning the graph
    into subgraphs, which is equivalent to the graph coarsening process. Through this
    step, the adjacency matrix between new supernodes can be obtained. The pooling
    operation needs to consider the fusion of information within the receptive field,
    through which the feature matrix of the new supernodes can be obtained. Notably,
    in vision models, the receptive fields of pooling operations are regular grid
    structures, e.g., a `2×2` sliding window, with no structural differences between
    windows. However, on the subgraphs of graph coarsening, the information within
    the receptive field contains both structural and attribute information, particularly
    structural information, which differs significantly between different subgraphs.
    Therefore, the extraction of structural information is also a key issue. `EigenPooling`
    simultaneously considers and fuses both types of information. The two steps above
    are explained in detail below.


    (1) Graph Coarsening


    Unlike `DIFFPOOL`, which learns a cluster assignment matrix for subgraph partitioning,
    the graph coarsening in `EigenPooling` does not introduce any learnable parameters
    into the graph classification model. Its approach is to borrow graph partitioning
    algorithms to achieve graph partitioning, such as using the **Spectral Clustering**
    algorithm[^(\[4\])](../Text/chapter97.xhtml#hh-4). Spectral clustering is a class
    of typical clustering algorithms; its basic idea is to first transform data into
    a feature space to highlight better separability, then perform a clustering operation
    (e.g., using the `Kmeans` algorithm for clustering). The algorithm inputs are
    the adjacency matrix and the number of clusters `K`; the output is the cluster
    assignment of each node. Notably, if the `Kmeans` algorithm is used for clustering,
    the cluster assignment is a **hard assignment**, where each node belongs to only
    one cluster. This hard assignment mechanism maintains the sparsity of connections
    between supernodes after graph coarsening. In contrast, `DIFFPOOL` uses a **soft
    assignment** mechanism, where nodes are assigned to every cluster probabilistically,
    causing supernodes to be fully connected to each other, greatly increasing the
    model''s spatial and time complexity.


    After partitioning the graph, we can call Equation (8.2) to obtain the adjacency
    relationships between supernodes. Of course, `EigenPooling` does not consider
    the intra-cluster connection strength of supernodes in this step.


    (2) Pooling Operation


    After determining the subgraph partitioning and the corresponding adjacency matrix,
    we need to integrate and extract information within each subgraph. In `DIFFPOOL`,
    node features are summed, a processing method that loses the structural information
    of the subgraph itself. `EigenPooling`, however, uses the Graph Fourier Transform
    of the signal on the subgraph to represent the integrated output of structural
    and attribute information. From the study in Chapter 5, we know that the spectrum
    of a graph signal shows the strength of the signal on various frequency components;
    it is a kind of identification information about the graph signal obtained by
    uniformly considering the graph''s structural information and the signal''s own
    information. Therefore, `EigenPooling` selects spectral information to represent
    the unified integration of subgraph information. The specific calculation process
    is given below:


    Assume the Laplacian matrix of subgraph `G^(k)` is `L^(k)`, and the corresponding
    eigenvectors are `U^(k)`. Then, the upsampling operator `C^(k)` is used to upsample
    the eigenvectors (Fourier basis on the subgraph) to the whole graph:


    ![](img/164-2-i.jpg)


    To convert the above operation into matrix form to obtain the pooling operator
    `Θ[l]∈R^(N×K)`, we organize the `l`-th eigenvectors of all subgraphs row-wise
    to form the matrix `Θ[l]`, i.e.:


    ![](img/164-3-i.jpg)


    Note that the number of nodes in subgraphs differs, so the number of eigenvectors
    also differs. Let `N[max]` denote the maximum number of nodes in a subgraph. Then,
    if the number of nodes in subgraph `G^(k)` is less than `N[max]`, `U^(k)[l]` can
    be set to `0`. With the matrix form of the pooling operator, the pooling process
    can be described as follows:


    ![](img/164-7-i.jpg)


    `X[l]∈R^(K×d)` is the pooling result. The `k`-th row of `X[l]` represents the
    representation vector of the `k`-th supernode under the action of `Θ[l]`. Following
    this mechanism, we need to design `N[max]` pooling operators in total. To combine
    the information collected by different pooling operators, we can use column-wise
    concatenation to connect the results:


    ![](img/164-8-i.jpg)


    Where `X_EigenPooling` is the final pooling result of `EigenPooling`. As argued
    in Section 6.3, the author also argues in this paper the effectiveness of low-frequency
    information in real-world graph data. Therefore, to improve computational efficiency,
    we can choose to use the pooling results corresponding to the first `H` eigenvectors,
    generally `H《N[max]`:


    ![](img/164-10-i.jpg)


    The above calculations are performed at the matrix level. If we revert the calculation
    to the vector form, we can more clearly see how `EigenPooling` uses the Graph
    Fourier Transform to integrate subgraph information. Without loss of generality,
    let the signal on the whole graph be `x`; then Equation (8.15) can be described
    as:


    ![](img/165-i.jpg)


    Its output represents the Fourier coefficient of the signal on the subgraph corresponding
    to the `l`-th eigenvector on the subgraph. The operation process of Equation (8.16)
    is shown in Figure 8-3:


    ![](img/8a3.jpg)


    Figure 8-3 Graph Fourier Transform on Subgraph in EigenPooling


    In Figure 8-3, the original graph is partitioned into blue and red subgraphs.
    Since `N[max]=4`, the output matrix is `R^(2×4)`, where each row represents the
    first 4 Graph Fourier coefficients on the signal of that subgraph.


    Same as `DIFFPOOL`, if the preceding `GNN` layer of `EigenPooling` uses `GCN`,
    `EigenPooling` as a whole will also possess permutation invariance. The specific
    proof can start from the three processes of `GCN`, graph coarsening, and pooling
    operation; the proof process is similar to that of `DIFFPOOL` and will not be
    repeated here.


    In summary, as a pooling mechanism without any learnable parameters, `EigenPooling`
    can be very conveniently integrated into general `GNN` models to achieve hierarchical
    extraction and learning of graph information. Compared with `DIFFPOOL`, its main
    advantages lie in maintaining the sparsity of connections between supernodes,
    improving computational efficiency, and simultaneously considering both structural
    and attribute information within subgraphs during the pooling operation, which
    is obviously more reasonable.


    ### 8.2.2 Pooling Mechanism Based on TopK


