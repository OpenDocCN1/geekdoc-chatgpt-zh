    \ If the exponent term of the natural logarithm e is changed to a fully connected\
    \ form, it becomes the approach in `GAT`.\n\n### 7.4.3 GN\n\n`Graph Network`[^(\\\
    [11\\])](../Text/chapter89.xhtml#gg-11) provides a more general summary of `GNN`\
    \ compared to `MPNN` and `NLNN`. Its basic computational unit contains three elements:\
    \ node state `h[i]`, edge state `e[ij]`, and graph state `u`. Around these three\
