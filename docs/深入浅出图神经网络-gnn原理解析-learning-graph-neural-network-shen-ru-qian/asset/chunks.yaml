    ## 3.2　卷积神经网络


    卷积神经网络是通过将卷积层与池化层进行堆叠得到的。本节将以一个具体的结构为例讲解卷积神经网络，然后介绍卷积神经网络的特点，以及如何理解卷积神经网络。


    ### 3.2.1　卷积神经网络的结构


    我们以AlexNet[^(\[2\])](../Text/chapter45.xhtml#cc-2)为例介绍卷积神经网络的结构。AlexNet是由深度学习的奠基者Hinton和他的学生Alex
