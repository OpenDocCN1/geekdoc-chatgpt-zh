    \ using the function `normalization` as input for the next graph convolution layer.\
    \ As shown in Code Listing 8-2:\n\n### Code Listing 8-2 Graph Structure Update\n\
    \n```\ndef normalization(adjacency):\n    \"\"\"计算 L=D^-0.5 * (A+I) * D^-0.5,\
