    \ update nodes, nodes aggregate and edges aggregate to update the graph. Of course,\
    \ each element also needs to consider its own state from the previous round when\
    \ updating. It should be noted that the above update steps are not fixed; they\
    \ can also proceed from the global level to each node, then to each edge. Additionally,\
    \ the initial value of the global graph state `u` can be regarded as an encoding\
    \ vector of some inherent property or prior knowledge of the graph. If the maintenance\
    \ of this global graph state value is removed, `GN` degrades into an `MPNN` that\
    \ maintains edge states.\n\n![](img/7a9.jpg)\n\nFigure 7-9　GN Computation Process^([\\\
    [1\\]](#chapter87.xhtml#ch1_back))\n\n`GN` maintains corresponding states for\
    \ nodes, edges, and the whole graph. These three can correspond to node-level\
    \ tasks, edge-level tasks, and graph-level tasks respectively. Of course, in actual\
    \ scenarios, `GN` can be simplified accordingly based on the actual situation\
    \ of the graph data and related tasks.\n\n[\\[1\\]](#chapter87.xhtml#ch1) Battaglia\
    \ P W, Hamrick J B, Bapst V, et al. Relational inductive biases, deep learning,\
    \ and graph networks[J]. arXiv preprint arXiv:1806.01261, 2018.\n\n## 7.5 GraphSAGE\
    \ in Practice\n\n"
