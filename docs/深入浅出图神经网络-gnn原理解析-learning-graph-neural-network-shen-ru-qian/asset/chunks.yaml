    \ matrix completion\\[J\\].arXiv preprint arXiv：1706.02263，2017.\n\n# 第10章　GNN的应用简介\n\
    \n由于图数据具有极其广泛的使用场景，GNN这项技术的相关应用近年来也得到了长足发展。作为全书的结尾，本章就以GNN的应用来阐述其研究现状与未来趋势。\n\n\
    10.1节对GNN的应用作出了一个概括性的简述；10.2节以3个具体的应用案例来说明GNN的相关优势；10.3节我们对GNN研究的未来展望进行讨论。\n\n\
    ## 10.1　GNN的应用简述\n\nGNN的适用范围非常广泛，既可以处理具有显式关联结构的数据，如药物分子、电路网络等，也可以处理具有隐式关联结构的数据，如图像、文本等。近年来，GNN被用于解决各行各业的问题，如生物化学领域中的分子指纹识别、药物分子设计、疾病分类等，交通领域中对交通需求的预测、对道路速度的预测，计算机图像处理领域中的目标检测、视觉推理等，自然语言处理领域中的实体关系抽取、关系推理等。在引文[\\\
    [1\\]](../Text/chapter112.xhtml#jj-1)中分成6个方向：自然语言处理、计算机视觉、自然科学研究、知识图谱、组合优化、图生成，对GNN的应用做出了较为全面且细致的归纳总结。\n\
    \n纵观GNN的各类应用，GNN表现出了如下3个优势：\n\n（1）GNN具有强大的图数据拟合能力。作为一种建立在图上的端对端学习框架，GNN展示出了强大的图数据拟合能力。图数据是科学与工程学领域中一种十分常见的数据研究对象，因此，GNN也被应用到了很多相关场景下，并且都取得了不错的效果。通常这些应用均会利用GNN去拟合研究对象的一些理化性质，从而指导或加速相应的科研与开发工作。比如引文[\\\
    [2\\]](../Text/chapter112.xhtml#jj-2)利用GNN去拟合两图中节点对的组合性质，从而提升蛋白质相互作用点预测的精度，而蛋白质相互作用点预测是药物分子发现与设计工作的重要构成部分；引文[\\\
    [3\\]](../Text/chapter112.xhtml#jj-3)将高频电路抽象成图数据，利用GNN去拟合其电磁学性质，相较于严格的电磁学仿真计算，该方法能极大地加速高频电路（比如5G芯片）的设计工作。\n\
    \n（2）GNN具有强大的推理能力。计算机要完成推理任务，离不开对语义实体的识别以及实体之间关系的抽取，GNN理所当然地被应用到了很多推理任务的场景中去。相较于之前大多基于关系三元组的建模方式，GNN能够对表征语义关系的网络进行整体性的建模，习得更加复杂与丰富的语义信息，这对提升推理任务的效果大有裨益。深度学习经过近几年的发展，在许多识别相关的任务上都取得了前所未有的成果，基于此，需要更深程度地理解数据的推理任务被提出，比如计算机视觉中的视觉问答（Visual\
    \ Question Answering）、视觉推理（Visual Reasoning），自然语言处理中的多跳推理（Multi-hop Reasoning）等。随着GNN的流行，很多工作也尝试将GNN以一种端对端的形式嵌入到学习系统中去，以提升相关任务的效果。我们举两个例子来说明：一是在基于事实的视觉问答（Fact-based\
    \ Visual Question Answering）中，问题中不再直接包含答案内容，需要学习系统经过推理将问题中的事实关系正确映射到答案中的实体上。在引文[\\\
    [4\\]](../Text/chapter112.xhtml#jj-4)中通过引入GCN同时建模多条事实来提高对答案推理的正确性，这一方法在相关数据集上取得了极大的效果提升。二是多跳推理，相比于之前的阅读理解任务，多跳推理需要跨越多个段落甚至多个文档来寻找实体之间的多跳关系，这是一个更加开放、更加复杂的推理任务。在引文[\\\
    [5\\]](../Text/chapter112.xhtml#jj-5)中通过嵌入GNN，构造了一个抽取加推理的双线学习框架，使得学习系统在可解释性提升的同时也在相关数据集上获得了极大的效果提升。\n\
    \n（3）GNN与知识图谱结合，可以将先验知识以端对端的形式高效地嵌入到学习系统中去。人类在学习后习得的知识，会被大脑神经系统进行系统的加工并存储起来，作为之后相关活动发生时的一种先验知识高效地提升人类的应对表现，并且往往知识之间会产生各种关联，形成“知识地图”。这种机制对应着数据科学领域中一些技术如知识图谱的广泛应用。从数据建模的层面来看，这些知识（或者规则、经验、常识、事实等）为模型提供了额外的相关信息，可以有效提升学习系统的效果。作为一种端对端的图数据学习模型，GNN结合知识图谱，可以将先验知识高效地嵌入到任意一种学习系统中去，从而提升任务效果。比如引文[\\\
    [6\\]](../Text/chapter112.xhtml#jj-6)在零样本学习任务中利用GCN对词汇网络（WordNet）进行建模，实现了类别之间的语义关系到其视觉表示上的迁移，从而大大提升视觉模型在一些完全不提供训练样本的类别上的分类准确率。引文[\\\
    [7\\]](../Text/chapter112.xhtml#jj-7)通过补充额外的知识图谱信息，将知识图谱与用户–商品二部图构成一种合成的图结构，然后利用GNN进行推荐任务建模，同时增强了推荐系统的准确率、多样性与可解释性。\n\
    \n总的来说，正是由于GNN强大而灵活的特性，使得其不管是在图数据本身的学习任务上，还是被以端对端的形式融合到其他的学习任务中，都能表现出自己独特的优势。当然，上面一以概之的优势需要与实际场景进行深度耦合，在具体的应用中寻找精确的定位，只有这样才能在相关场景中获得最优的效果。\n\
    \n## 10.2　GNN的应用案例\n\n本节将从3D视觉、基于社交网络的推荐系统、视觉推理3个方面介绍GNN的应用案例，希望借由这3个应用场景能够为大家深入而具体地展示GNN的技术特点及优势。\n\
    \n### 10.2.1　3D视觉\n\n继卷积神经网络在2D视觉上获得前所未有的成功之后，近几年，如何让计算机理解3D世界，特别是如何延续深度学习技术在3D视觉问题上的表现受到了越来越多的研究人员的关注。3D视觉数据的表示方式有多种，如点云（Point\
    \ Cloud）、网格（Mesh）等。每种类型的数据都有其自身的结构特性，这些结构特性给深度模型的架构设计带来了挑战。本节我们来介绍其中最具代表性的点云数据的学习。点云数据是一种有效的三维物体的表示方法，它随着深度感知技术，比如微软的Kinect以及激光探测与测量技术的发展而流行起来。点云数据由一组点组成，每个点都记录有三维坐标（x，y，z），除此之外，还可以记录采集点的颜色、强度等其他丰富的信息，因此，高精度的点云数据可以很好地还原现实世界，被广泛应用于无人驾驶、体感游戏、文化数字遗产保护、医疗、城市规划、农林业等各个领域。\n\
    \n对点云数据的理解包含几个关键步骤，即点云分类、点云语义分割、点云场景分析。点云分类很好理解，即给定一组点云，计算机需要识别这组点云到底描绘的是什么物体，是台灯、桌子还是椅子？点云语义分割就要求理得解更细致，比如桌子由哪些部分构成，如何分割出桌面、桌腿等，如图10-1所示。点云场景分析需要更进一步的学习和分析，给定一个场景，比如某个房间内的点云数据，如何自动识别或匹配出墙面、灯、桌子、椅子、窗户等不同物体，甚至进一步通过这些物体摆放的空间位置，推断出这个房间到底是办公室还是教室。\n\
    \n![](Images/10a1.jpg)\n\n图10-1　点云分割示意图[^(\\[8\\])](../Text/chapter112.xhtml#jj-8)\n\
    \n点云数据同图数据一样，是一种非规则结构的数据，点与点之间的排列也没有顺序，这导致在视觉领域取得巨大成功的卷积网络无法直接复制到点云数据的处理中来，不过与图数据的相似性也启发了GNN模型在其中的应用。"
