  trans: "\n# 8.2.2 TopK-based Pooling Mechanism\n\nThe graph collapse-based pooling\
    \ mechanism introduced in Section 8.2.1 is a process where nodes continuously\
    \ aggregate into clusters, while the TopK-based pooling mechanism introduced in\
    \ this section is a process of continuously discarding nodes, which captures information\
    \ at different scales of the graph. Unlike the pooling operation based on local\
    \ sliding windows in CNNs, TopK pooling applies its scope to all nodes in the\
    \ graph. Specifically, first set a hyperparameter `k` representing the pooling\
    \ ratio, `k∈(0,1)`, then learn a value `z` representing node importance and sort\
    \ it in descending order, then downsample the `N` nodes in the whole graph to\
    \ `kN` nodes. The formula is as follows:\n\n![](img/166-i.jpg`)\n\n`X[i, :]` denotes\
    \ row slicing of the feature matrix according to the values of vector `i`, `A[i,\
    \ i]` denotes simultaneous row and column slicing of the adjacency matrix according\
    \ to the values of vector `i`. Unlike `DIFFPOOL`, if `N` nodes are assigned to\
    \ `kN` clusters, the model would require `kN²` space complexity to assign cluster\
    \ information, whereas the TopK-based pooling mechanism only needs to discard\
    \ `(1–k)N` nodes from the original graph each time.\n\nRegarding how to learn\
    \ node importance, references `[5]` and `[6]` provide different methods respectively.\
    \ In reference `[1]`, the authors set a global basis vector `p` for the graph\
    \ classification model, using the projection of the node feature vector on this\
    \ basis vector as importance:\n\n![](img/166-2-i.jpg`)\n\nSuch a projection mechanism\
    \ has the following dual roles:\n\n1.  The magnitude of the projection can determine\
    \ the TopK ranking;\n2.  The projection magnitude also acts as a gradient gate:\
    \ nodes with smaller projections receive only smaller gradient updates, while\
    \ nodes with larger projections receive more sufficient gradient information.\n\
    \nAll details are expressed in the formula below:\n\n![](img/166-3-i.jpg`)\n\n\
    In the feature matrix update, a `tanh(z)` is multiplied pointwise, which is equivalent\
    \ to using node importance to perform a shrinkage transformation on node features,\
    \ further enhancing gradient learning for nodes with high importance. The paper\
    \ refers to the above process as the `gpool` layer.\n\nCompared to the process\
    \ of continuous fusion learning of all nodes in the graph by the graph collapse-based\
    \ pooling mechanism, the `gpool` layer adopts a layer-by-layer node discarding\
    \ approach to improve the fusion efficiency of distant nodes, but this approach\
    \ lacks effective means of information fusion for all nodes. Therefore, to achieve\
    \ the above purpose, the authors choose to follow each `gpool` layer with a readout\
    \ layer to achieve a one-time aggregation of global graph information at that\
