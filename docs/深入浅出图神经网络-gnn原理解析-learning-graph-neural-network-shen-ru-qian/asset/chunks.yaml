    ## Preface


    ### Why Write This Book


    In recent years, as an emerging graph data learning technology, Graph Neural Networks
    (`GNN`) have received extensive attention. At the end of 2018, a very interesting
    event occurred: three survey papers in this field were published simultaneously.
    This "coincidence" reflects the academic community''s recognition of this technology.
    In fact, at major top-tier academic conferences in 2019, papers related to graph
    neural networks also accounted for a considerable proportion. It is believed that
    in the coming years, this popular trend will only increase.


    The emergence of graph neural network technology has its inevitability and importance.
    In the first few years of the rise of deep neural network technology, data in
    forms such as images, speech, and text could all be well applied in deep learning,
    achieving very good results. This has driven a large number of related applications
    into the practical stage, such as face recognition, voice assistants, machine
    translation, etc. Despite this, deep learning has long been unable to effectively
    adapt to another form of data—graph data (also known as network data). As a general
    data representation method mainly used to describe relationships, graph data has
    broader application scenarios in the industry. In scenarios such as social networks,
    e-commerce, the Internet of Things, and biopharmaceuticals, the presence of graph
    data can be found. Transferring the successful experience of deep learning technology
    to the learning of graph data is a very natural and necessary demand.


    Against this background, the emergence of graph neural networks effectively filled
    the aforementioned technical gap, achieving an effective combination of graph
    data and deep learning technology, allowing deep learning to continue to make
    inroads in graph data-related application scenarios. In fact, looking back over
    these three years, the related applications and research of graph neural network
    technology have expanded into extremely wide fields. From visual reasoning to
    open reading comprehension problems, from drug molecule development to 5G chip
    design, from traffic flow prediction to 3D point cloud data learning, this technology
    has demonstrated extremely important and highly permeable application capabilities.
    This capability will inevitably bring extremely high application value to the
    industry.


    The author''s company, Geetest, has long been on the front lines of network offense
    and defense in business risk control scenarios. In this context, whether actively
    or passively, it has driven us to continuously strive to improve our data analysis
    and modeling capabilities. We have always hoped for an end-to-end model to efficiently
    learn the relationships or structural information in the data. Geetest encountered
    graph neural network technology in mid-2017, which provided just such an opportunity.
    After repeated demonstrations of this technology and its deployment in Geetest''s
    actual business, results exceeding expectations were achieved, which greatly enhanced
    our enthusiasm for this technology. At the same time, to better discuss and learn
    this new technology, we organized a corresponding learning community, and everyone
    showed high enthusiasm. This enthusiasm motivated the author to invest more energy
    into this technology, and thus the idea of writing a book about graph neural networks
    was born. It is hoped that through this book, readers will have a clearer and
    more comprehensive understanding of the ins and outs of this technology. If it
    can produce greater knowledge-sharing results, the value of this book will be
    even higher, which will be the best reward for us.


    ### Target Audience


    - Readers who want to learn and initially practice graph neural network technology

    - Readers who want to systematically and deeply understand graph neural network
    technology


    ### Main Content of This Book


    This book is divided into three main parts:


    **Part I: Fundamentals**, including Chapters 1–4. Chapter 1 is written by the
    author (Liu Zhongyu), and Chapters 2–4 are written by Li Yanlin. It mainly introduces
    the basic knowledge required to learn graph neural networks, including basic concepts
    of graphs, convolutional neural networks, and representation learning, helping
    beginners more clearly recognize that graph neural network technology and deep
    learning technology share the same lineage.


    **Part II: Advanced**, including Chapters 5–9. This part is the focus of this
    book. It mainly explains the theoretical foundations and properties of graph convolutional
    neural networks, various variants and framework paradigms of graph neural networks,
    graph classification, and graph representation learning based on `GNN`. Each chapter
    in this part has relevant practical cases, planning a complete learning path from
    theory to practice for readers, helping them systematically and comprehensively
    learn graph neural networks. This part has two authors: the theoretical part is
    written by the author (Liu Zhongyu), and the code for practical cases is provided
    by Li Yanlin.


    **Part III: Applications**, i.e., Chapter 10. It mainly introduces some current
    applications of graph neural networks. The applications of graph neural networks
    are very extensive, and there are many real-world application scenarios. However,
    given the planning of this book, only a brief introduction is provided here, aiming
    to throw a brick to attract jade, allowing readers to have a certain understanding
    of application scenarios. This part is written by Zhou Yang.


    Finally, each chapter is accompanied by relevant references.


    ### Features of This Book


    This book has the following features:


    1.  It details the origin of the graph convolution model, as well as what spectral-domain
    graph convolution and spatial-domain graph convolution are. This is the first
    "stumbling block" for many beginners learning this technology.

    2.  It centrally elaborates on the properties of the graph convolution model.
    The interpretation of these properties plays an important role in readers'' deep
    understanding of graph neural network technology.

    3.  It provides code for key parts, hoping to assist readers in clearly understanding
    the specific meaning of variables in some formulas in the book.

    4.  To help readers understand the relevant concepts and technologies of graph
    neural networks, this book provides many schematic diagrams.


    ### Errata and Support


    Due to the limited level of the authors and the rushed writing schedule, there
