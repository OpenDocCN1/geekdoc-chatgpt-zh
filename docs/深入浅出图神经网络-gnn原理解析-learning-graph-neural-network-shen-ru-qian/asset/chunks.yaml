    \ magazine，2013，30（3）：83-98.\n\n[\\[8\\]](../Text/chapter9.xhtml#a8)　Zhou J，Cui\
    \ G，Zhang Z，et al.Graph neural networks：A review of methods and applications\\\
    [J\\].arXiv preprint arXiv：1812.08434，2018.\n\n[\\[9\\]](../Text/chapter9.xhtml#a9)　Zhang\
    \ Z，Cui P，Zhu W.Deep learning on graphs：A survey\\[J\\].arXiv preprint arXiv：1812.04202，2018.\n\
    \n[\\[10\\]](../Text/chapter9.xhtml#a10)　Wu Z，Pan S，Chen F，et al.A comprehensive\
    \ survey on graph neural networks\\[J\\].arXiv preprint arXiv：1901.00596，2019.\n\
    \n[\\[11\\]](../Text/chapter9.xhtml#a11)　Gori M，Monfardini G，Scarselli F.A new\
    \ model for learning in graph domains\\[C\\]//Proceedings.2005 IEEE International\
    \ Joint Conference on Neural Networks，2005.IEEE，2005，2：729-734.\n\n[\\[12\\]](../Text/chapter9.xhtml#a12)　Micheli\
    \ A.Neural network for graphs：A contextual constructive approach\\[J\\].IEEE Transactions\
    \ on Neural Networks，2009，20（3）：498-511.\n\n[\\[13\\]](../Text/chapter9.xhtml#a13)　Scarselli\
    \ F，Gori M，Tsoi A C，et al.The graph neural network model\\[J\\].IEEE Transactions\
    \ on Neural Networks，2008，20（1）：61-80.\n\n[\\[14\\]](../Text/chapter9.xhtml#a14)　Bruna\
    \ J，Zaremba W，Szlam A，et al.Spectral networks and locally connected networks on\
    \ graphs\\[J\\].arXiv preprint arXiv：1312.6203，2013.\n\n[\\[15\\]](../Text/chapter9.xhtml#a15)　Kipf\
    \ T N，Welling M.Semi-supervised classification with graph convolutional networks\\\
    [J\\].arXiv preprint arXiv：1609.02907，2016.\n\n[\\[16\\]](../Text/chapter9.xhtml#a16)　Hamilton\
    \ W，Ying Z，Leskovec J.Inductive representation learning on large graphs\\[C\\\
    ]//Advances in Neural Information Processing Systems.2017：1024-1034.\n\n[\\[17\\\
    ]](../Text/chapter9.xhtml#a17)　VeličkovićP，Cucurull G，Casanova A，et al.Graph attention\
    \ networks\\[J\\].arXiv preprint arXiv：1710.10903，2017.\n\n[\\[18\\]](../Text/chapter9.xhtml#a18)　Gilmer\
    \ J，Schoenholz S S，Riley P F，et al.Neural message passing for quantum chemistry\\\
    [C\\]//Proceedings of the 34th International Conference on Machine Learning-Volume\
    \ 70.JMLR.org，2017：1263-1272.\n\n[\\[19\\]](../Text/chapter8.xhtml#a19)　Johnson\
    \ J，Gupta A，Fei-Fei L.Image generation from scene graphs\\[C\\]//Proceedings of\
    \ the IEEE Conference on Computer Vision and Pattern Recognition.2018：1219-1228.\n\
    \n# 第2章　神经网络基础\n\n近几年，随着算法的改进、数据量的爆发、算力的提升，机器学习和深度学习得到了快速发展。本章将从机器学习的基本概念出发，介绍什么是机器学习以及如何得到机器学习的模型。然后介绍深度学习模型的基本组成单元—神经元模型和以它为基础构建的多层感知器模型。我们还将以多层感知器为例，介绍深度学习中的反向传播算法和优化方法。\n\
    \n## 2.1　机器学习基本概念\n\n### 2.1.1　机器学习分类  \n\n机器学习是一门多领域交叉学科，涉及概率论、统计学、逼近论、凸分析、计算复杂性理论等多门学科。机器学习理论主要是设计和分析一些让计算机可以自动“学习”的算法。通俗地说，机器学习是让计算机从数据中去挖掘有价值的信息。\n\
    \n从不同的维度来分，机器学习可以有不同的分类。下面简要介绍几种常见的分类方法。\n\n根据训练数据是否有标签，机器学习可以分为监督学习、半监督学习和无监督学习。\n\
    \n监督学习：指的是训练数据中每个样本都有标签，通过标签可以指导模型进行训练，学到具有判别性的特征，从而能够对未知样本进行预测。比如图像分类比赛ImageNet，通过利用每张图像已有的标签训练模型，使得模型可以对未知的图像进行预测，得到相应的分类结果。\n\
    \n无监督学习：指的是训练数据完全没有标签，通过算法从数据中发现一些数据之间的约束关系，比如数据之间的关联、距离关系等。典型的无监督算法如聚类，根据一定的度量指标，将“距离”相近的样本聚集在一起。\n\
    \n半监督学习：指的是介于监督学习和无监督学习之间的一种学习方式。它的训练数据既包含有标签数据，也包含无标签数据。假设如果标签数据和无标签数据都是从同一个分布采样而来，那无标签数据中含有一些数据分布相关的信息，可以作为标签数据之外的补充。这种情况在现实中是非常常见的。比如在互联网行业，每天会产生大量的数据，这些数据部分可能携带标签，但更多的数据是不带标签的，如果靠人工去标记这些无标签数据，代价是相当大的，而半监督学习可以提供一些解决思路。\n\
    \n从算法输出的形式上来分，可以分为分类问题和回归问题，这两类问题都属于监督学习的范畴。"
