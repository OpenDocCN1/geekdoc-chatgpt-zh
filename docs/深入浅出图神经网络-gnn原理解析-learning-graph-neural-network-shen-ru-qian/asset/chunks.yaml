    \ preprint arXiv：1609.02907，2016.\n\n# 第6章　GCN的性质\n\n本章通过对GCN的一些性质的集中解读来加深读者对于GCN的理解。在6.1节中，我们介绍了同为卷积模型的GCN与CNN的联系，从中可以看到二者具有非常高的迁移性；在6.2节中，我们重点阐述了GCN对图数据进行端对端学习的机制；在6.3节中，从低通滤波器的视角，解释了GCN对于图数据学习能力的有效性，同时可以看到这种频域视角的解读，对于指导GCN模型的特定设计工作具有十分重要的理论意义；在6.4节中，我们介绍了GCN模型所面临的一个典型问题—过平滑，该问题给GCN模型的诊断与优化工作指出了明确的方向。\n\
    \n## 6.1　GCN与CNN的联系\n\n在第5章中我们介绍了空域视角下的图卷积操作，在这种视角下的GCN模型与CNN模型有着十分紧密的共性联系。从本质上看，二者都是聚合邻域信息的运算，只是作用的数据对象不同。下面我们将更加细致地总结出二者间的几点区别与联系（见图6-1）。\n\
    \n![](Images/6a1.jpg)\n\n图6-1　CNN与GCN间的区别与联系\n\n1.图像是一种特殊的图数据\n\nCNN中的卷积计算相较于GCN中的卷积计算，最大的区别是没有显式地表达出邻接矩阵，但是进行实际计算的时候，我们依然需要考虑数据之间的结构关系。如果我们将图像中的每个像素视作一个节点，那么在常见的比如3×3大小的卷积核的作用下，可以将中心节点附近3×3的栅格内的像素等价为自己的邻居。从这个角度来看，我们将像素视作节点，将像素之间空间坐标的连线作为彼此之间的边，如此图像数据就变成了一种结构非常规则的图数据，CNN中的卷积计算则是用来处理这类固定2D栅格结构的图数据。相较之下，一般提到图数据，往往单个节点附近的邻域结构是千差万别的，数据之间的关系也较为复杂多样，GCN中的卷积计算则是用来处理更普遍的非结构化的图数据的。\n\
    \n2.从网络连接方式来看，二者都是局部连接\n\n从单个节点的运算过程来看，GCN的计算为：![](Images/112-2-i.jpg)，计算作用在其一阶子\n\
    \n图上；CNN的计算为：![](Images/112-3-i.jpg)，计算作用在中心像素附近3×3的栅格内，这种\n\n节点下一层的特征计算只依赖于自身邻域的方式，在网络连接上表现为一种局部连接的结构。相较于全连接结构，局部连接大大减少了单层网络的计算复杂度。不过在权重设置上二者有一定的区别，由于图像数据中固定的栅格结构，CNN的卷积核设计了9组权重参数，而为了适应不同的图数据结构，GCN的卷积核权重参数退化为一组，从图6-1中可以直观地看出这一差别。从拟合能力上来讲，CNN是更有优势的。\n\
    \n3.二者卷积核的权重是处处共享的\n\n与CNN一样，GCN中的卷积核也作用于全图所有的节点，在每个节点处的计算中权重参数都是共享的，这样的处理方式大大减少了单层网络的参数量，可以有效避免过拟合现象的出现。\n\
    \n4.从模型的层面来看，感受域随着卷积层的增加而变大\n\n每多一层卷积计算，中心节点就能多融合进更外一“圈”的信息。如图6-2所示，在CNN中，中心的感受域从第一层的3×3，到第二层的5×5，在不断地扩大。在GCN中，中心节点可以融合的信息从一阶邻居拓展到二阶邻居，二者的感受域都随着卷积层的增加而变大。同时，我们可以看到，在这两类模型中，节点自身特征的更新是与卷积运算强耦合在一起的，每一个新卷积层的加入，都可以使节点获得更加抽象化的特征表示。\n\
    \n![](Images/6a2.jpg)\n\n图6-2　CNN与GCN的感受域\n\n另外，从学习任务上来看，CNN与GCN也有着非常强的可类比性。图6-3中的a图和b图展示了计算机视觉中的两大主流任务：图像分类与图像分割。图像分类是一种需要对数据全局信息进行学习的任务，这对应于全图层面的图分类任务，如图6-3的c图所示，研究人员利用脑信号构图，实现对正常人、阿尔兹海默症患者以及轻度认知障碍患者的脑信号图进行分类。\n\
    \n![](Images/6a3.jpg)\n\n图6-3　CNN与GCN任务对比^([\\[1\\]](#chapter67.xhtml#ch1_back)[\\\
    [2\\]](#chapter67.xhtml#ch2_back))\n\n如图6-3中的b图所示的图像分割是一种需要对像素及其局部信息进行整合学习的任务，模型最后需要对每个像素进行分类判定，这与图数据中节点层面的节点分类任务对应；图6-3中的d图展示了GCN如何基于论文应用数据集对图中的每个节点（代表论文）进行学科类别分类。作为一种重要的图数据学习模型，GCN及其衍生模型的任务主要包括图分类以及节点分类。\n\
    \nGCN与CNN的这种强关联特性，使得二者在多个方面都有很高的可类比性，这给GCN的设计和发展工作指明了方向，在本书第8章讲图分类模型的时候，我们会再一次看到这种借鉴所产生的作用。\n\
    \n[\\[1\\]](#chapter67.xhtml#ch1) 图片来源：https://ccvl.jhu.edu/datasets/。\n\n[\\\
    [2\\]](#chapter67.xhtml#ch2) 图片来源：https://www.frontiersin.org/articles/10.3389/fncom.2018.00031/full。\n\
    \n## 6.2　GCN能够对图数据进行端对端学习\n\n近几年，随着深度学习的发展，端对端学习变得越来越重要，人们普遍认为，深度学习的成功离不开端对端学习的作用机制。端对端学习实现了一种自动化地从数据中进行高效学习的机制。然而，端对端学习的这种高度自动化的特性的达成，往往离不开背后大量的针对特定类型数据的学习任务的适配工作，这种适配体现在当下十分流行的各种网络层或层块结构（block）的设计上，比如我们熟知的Conv2D层对于图像数据的学习、LSTM层对于序列数据的学习、Global\
    \ Pooling层对于全局信息的提取等。这些层的计算过程必须最大限度地按照我们期望的方式去适配数据的内在规律模式。大量的实践经验告诉我们，深度学习能够在某个场景任务中取得极其优秀的效果，很大程度上得益于这类网络层或者由该网络层所构建的网络层块的定制化设计。\n\
    \n因此，如果我们要实现对于图数据的端对端学习，学习系统必须能够适配图数据的内在模式。\n\n在第1章中，我们介绍了属性图是一种最广泛的图数据表现形式。在属性图里面，每个节点都有自己的属性。如图6-4中的a图所示，在某个社交网络的场景中，用户节点存在性别和年龄等属性，这些属性对用户身份的刻画是十分重要的。同时，我们可以看到图中有两个入度很高的节点，在很大程度上，这类节点表示的是社交网络里面的大V用户。图6-4中的b图所示为乙醇和甲醚的分子式和分子结构，虽然二者的分子式均为C[2]H[6]O，但是由于分子结构不同，二者具有不同的理化性质。\n\
    \n总结上面两个例子，我们可以发现，图数据中同时包含着两部分信息：属性信息与结构信息。属性信息描述了图中对象的固有性质；结构信息描述了对象之间的关联性质，这种由关联所产生的结构不仅对图数据中节点的刻画具有很大的帮助作用，而且对该全图的刻画也起着关键作用。一个优秀的针对图数据的学习系统，必须能够做到对属性信息和结构信息进行端对端的学习。\n\
    \n![](Images/6a4.jpg)\n\n图6-4　图数据示例\n\n下面我们来看看GCN的设计是怎么去适配图数据的内在规律的。为了更形象地阐述GCN对于图数据的端对端学习能力，我们将之前提到的两类非常典型的图数据学习方式—基于手工特征与基于随机游走的方法进行对比。一般来说，图数据中属性信息的处理是比较简单的，按照属性的类型进行相应的编码设计，然后将其拼接成一个表示节点属性的特征向量就可以了，但是结构信息蕴含在节点之间的关系中，是比较难处理的。我们所对比的两个方法的核心都是在如何处理图的结构信息上，如图6-5、图6-6所示。\n\
    \n![](Images/6a5.jpg)\n\n图6-5　基于手工特征的方法"
