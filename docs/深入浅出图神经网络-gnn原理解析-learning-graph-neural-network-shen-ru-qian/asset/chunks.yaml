- raw: "```\ndef normalization(adjacency):\n    \"\"\"计算 L=D^-0.5 * (A+I) * D^-0.5\"\
    \"\"\n    adjacency += sp.eye(adjacency.shape[0])    # 增加自连接\n    degree = np.array(adjacency.sum(1))\n\
    \    d_hat = sp.diags(np.power(degree, -0.5).flatten())\n    return d_hat.dot(adjacency).dot(d_hat).tocoo()\n\
    \n# 超参数定义\nlearning_rate = 0.1\nweight_decay = 5e-4\nepochs = 200\n# 模型定义，包括模型实例化、损失函数与优化器定义\n\
    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\nmodel = GcnNet().to(device)\n\
    # 损失函数使用交叉熵\ncriterion = nn.CrossEntropyLoss().to(device)\n# 优化器使用Adam\noptimizer\
    \ = optim.Adam(model.parameters(), lr=learning_rate, weight_decay=weight_decay)\n\
    \n# 加载数据，并转换为torch.Tensor\ndataset = CoraData().data\nx = dataset.x / dataset.x.sum(1,\
    \ keepdims=True)  # 归一化数据，使得每一行和为1\ntensor_x = torch.from_numpy(x).to(device)\n\
    tensor_y = torch.from_numpy(dataset.y).to(device)\ntensor_train_mask = torch.from_numpy(dataset.train_mask).to(device)\n\
    tensor_val_mask = torch.from_numpy(dataset.val_mask).to(device)\ntensor_test_mask\
    \ = torch.from_numpy(dataset.test_mask).to(device)\nnormalize_adjacency =  normalization(dataset.adjacency)\
    \   # 规范化邻接矩阵\nindices = torch.from_numpy(np.asarray([normalize_adjacency.row,\
    \ \n                                       normalize_adjacency.col])).long()\n\
    values = torch.from_numpy(normalize_adjacency.data.astype(np.float32))\ntensor_adjacency\
    \ = torch.sparse.FloatTensor(indices, values, \n                             \
    \               (2708, 2708)).to(device)\n```\n\n* * *\n\n所有准备工作都做好后，就可以根据神经网络运行流程进行模型训练了，如代码清单5-6所示，通过不断迭代优化，我们将记录训练过程中损失值的变化和验证集上的准确率，训练完成后在测试集上测试模型的效果。\n\
    \n代码清单5-6　模型训练与测试\n\n* * *\n\n```\ndef train():\n    loss_history = []\n    val_acc_history\
    \ = []\n    model.train()\n    train_y = tensor_y[tensor_train_mask]\n    for\
    \ epoch in range(epochs):\n        logits = model(tensor_adjacency, tensor_x)\
    \  # 前向传播\n        train_mask_logits = logits[tensor_train_mask]   # 只选择训练节点进行监督\n\
    \        loss = criterion(train_mask_logits, train_y)    # 计算损失值\n        optimizer.zero_grad()\n\
    \        loss.backward()     # 反向传播计算参数的梯度\n        optimizer.step()    # 使用优化方法进行梯度更新\n\
    \        train_acc = test(tensor_train_mask)     # 计算当前模型在训练集上的准确率\n        val_acc\
    \ = test(tensor_val_mask)     # 计算当前模型在验证集上的准确率\n        # 记录训练过程中损失值和准确率的变化，用于画图\n\
    \        loss_history.append(loss.item())\n        val_acc_history.append(val_acc.item())\n\
    \        print(\"Epoch {:03d}: Loss {:.4f}, TrainAcc {:.4}, ValAcc {:.4f}\".format(\n\
    \            epoch, loss.item(), train_acc.item(), val_acc.item()))\n    \n  \
    \  return loss_history, val_acc_history\n\ndef test(mask):\n    model.eval()\n\
    \    with torch.no_grad():\n        logits = model(tensor_adjacency, tensor_x)\n\
    \        test_mask_logits = logits[mask]\n        predict_y = test_mask_logits.max(1)[1]\n\
    \        accuarcy = torch.eq(predict_y, tensor_y[mask]).float().mean()\n    return\
    \ accuracy\n```\n\n* * *\n\n使用上述代码进行模型训练，我们可以看到如代码清单5-7所示的日志输出：\n\n代码清单5-7　日志输出\n\
