    ## 9.3　基于图自编码器的推荐系统


    下面讲解一个基于图自编码器实现简单的推荐任务[^(\[14\])](../Text/chapter104.xhtml#ii-14)的例子。推荐系统要建立的是用户与商品之间的关系，这里我们以简化后的用户对商品的评分为例进行介绍，如图9-5假设用户与商品之间的交互行为只存在评分，分值从1分到5分。如果用户u对商品v进行评分，评分为r，就是说用户u与商品v之间存在一条边，边的类型为r，其中r∈R。基于这种交互关系对用户进行商品推荐实际上就是要预测哪些商品与用户之间可能存在边，这样的问题称为边预测问题。对于这种边预测问题，我们将其看作矩阵补全问题，用户与商品之间的交互行为构成了一个二部图，可以通过用户与商品的邻接矩阵表示为A，矩阵中的值就是评分，推荐就是要对矩阵没有评分的位置进行预测。


    ![](Images/9a5.jpg)


    图9-5　基于图自编码器的推荐^([\[1\]](#chapter103.xhtml#ch1_back))


    图9-5为基于图自编码器的推荐系统的架构图。如图所示，首先将用户–商品矩阵转化成用户–商品二部图，然后使用图自编码器对二部图进行建模，这里使用GCN作为编码器，然后通过解码器对邻接矩阵中的边信息进行重构，由此完成边预测的任务。对于邻接矩阵A按照不同的评分r进行分解，可以得到每个评r分对应的一个邻接矩阵A[r]，它在评分为V的位置上值为1，否则为0。请注意，在这里将不同的评分当作不同的关系进行处理，而不是当作边上的属性进行预测。接下来，使用R-GCN双重聚合的思路对节点的表示进行学习：先对同一关系的邻居进行聚合，再对所有的邻居进行聚合。用式子表示如（9.21）所示：


    ![](Images/189-i.jpg)


    其中W[r]是每类评分对应的权重参数，c[ij]是一个归一化参数，可以选择|N[i]|或者![](Images/189-2-i.jpg)。第二重聚合时的函数为Agg，可以选择拼接、求和或者更复杂的聚合函数，代码清单9-1是基于拼接的编码器实现，代码清单9-2是基于求和的编码器实现。


    代码清单9-1　基于拼接的编码器


    * * *'
  fmt: '

    同表示学习一样，图表示学习的核心也是研究数据的表示。不同的是，图表示学习的研究对象是图数据。我们知道图数据中蕴含着丰富的结构信息，这本质上对应着图数据因内在关联而产生的一种非线性结构。这种非线性结构在补充刻画数据的同时，也给数据的学习带来了极大的挑战。因此在这样的背景下，图表示学习就显得格外重要，它具有以下两个重要作用：


    （1）将图数据表示成线性空间中的向量。从工程上而言，这种向量化的表示为擅长处理线性结构数据的计算机体系提供了极大的便利。


    （2）为之后的学习任务奠定基础。图数据的学习任务种类繁多，有节点层面的、边层面的，还有全图层面的，一个好的图表示学习方法可以统一高效地辅助这些任务的相关设计与学习。


    图表示学习从方法上来说，可以分为基于分解的方法、基于随机游走的方法，以及基于深度学习的方法，而基于深度学习的方法的典型代表就是`GNN`相关的方法。下面我们回顾一下前两类方法。


    在早期，图节点的嵌入学习一般是基于分解的方法，这类方法通过对描述图数据结构信息的矩阵进行矩阵分解，将节点转化到低维向量空间中去，同时保留结构上的相似性。这种描述结构信息的矩阵有邻接矩阵[^(\[1\])](../Text/chapter104.xhtml#ii-1)、拉普拉斯矩阵[^(\[2\])](../Text/chapter104.xhtml#ii-2)、节点相似度矩阵[^(\[3\])](../Text/chapter104.xhtml#ii-3)。一般来说，这类方法均有解析解，但是由于某结果依赖于相关矩阵的分解计算，因此，这类方法具有很高的时间和空间复杂度。


    近几年，词向量方法在语言表示上取得了很大的成功，受该方法启发，一些方法开始将在图中随机游走产生的序列看作句子，将节点看作词，以此类比词向量方法从而学习出节点的表示。典型的方法有`DeepWalk`[^(\[4\])](../Text/chapter104.xhtml#ii-4)、`Node2Vec`[^(\[5\])](../Text/chapter104.xhtml#ii-5)等。图9-2为`DeepWalk`算法的示意图：


    ![](Images/9a2.jpg)


    图9-2　DeepWalk算法示意图


    `DeepWalk`通过随机游走将图转化成节点序列，设置中心节点左右距离为`w`的节点为上下文（`context`），如图9-2中的b图所示。同词向量方法一样，`DeepWalk`本质上建模了中心节点与上下文节点之间的共现关系，这种关系的学习也采用了负采样的优化手段，如图9-2中的d图所示。`DeepWalk`与词向量方法具有十分一致的算法细节，具体公式可以参见第4章中词向量的相关部分。


    相比基于分解的方法，基于随机游走的方法最大的优点是通过将图转化为序列的方式实现了大规模图的表示学习。但是这类方法有两个缺点：一是将图转化成序列集合，图本身的结构信息没有被充分利用；二是该学习框架很难自然地融合图中的属性信息进行表示学习。


    关于`GNN`方法的建模细节，本书作为重要内容在前面的章节中进行了阐述，这里不再赘述。通过之前的学习，我们可以知道基于`GNN`的图表示学习具有以下几点优势：


    （1）非常自然地融合了图的属性信息进行学习，而之前的方法大多把图里面的结构信息与属性信息单独进行处理。


    （2）`GNN`本身作为一个可导的模块，能够嵌入到任意一个支持端对端学习的系统中去，这种特性使得其能够与各个层面的有监督学习任务进行有机结合（或者以微调学习的形式进行结合），学习出更加适应该任务的数据表示。


    （3）`GNN`的很多模型如`GraphSAGE`、`MPNN`等都是支持归纳学习的，多数情况下对于新数据的表示学习可以直接进行预测，而不必像之前的多数方法那样重新训练一次。


    （4）相较于分解类的方法只能适应小图的学习，`GNN`保证了算法在工程上的可行性，也能适应大规模图的学习任务。


    综上所述，基于`GNN`的相关方法具有强大的学习能力与广泛的适应性，是图表示学习重要的代表性方法。


    ## 9.2　基于GNN的图表示学习


