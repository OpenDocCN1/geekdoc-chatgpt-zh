    # 图滤波器与图卷积神经网络


    ## 5.4 图滤波器


    相较于拉普拉斯矩阵，`H` 仅仅改动了对角矩阵上的值，因此，`H` 具有以下形式：`H[i][j] = 0`，如果 `i ≠ j` 或者 `e[i][j]
    ∉ E`。也就是说，`H` 矩阵只在对角与边坐标上时才有可能取非零值。从算子的角度来看，`Hx` 描述了一种作用在每个节点一阶子图上的变换操作。一般来说，我们称满足上述性质的矩阵为
    `G` 的图位移算子，拉普拉斯矩阵与邻接矩阵都是典型的图位移算子。事实上，本章讲解的所有图信号处理的相关理论，都可以被拓展到图位移算子上，并不局限在拉普拉斯矩阵上。


    图滤波器具有以下性质：


    1. **线性**：`H(x + y) = Hx + Hy`；

    2. **滤波操作是顺序无关的**：`H₁(H₂x) = H₂(H₁x)`；

    3. 如果 `h(λ) ≠ 0`，则该滤波操作是可逆的。


    我们称 `Λ[h]` 为图滤波器 `H` 的频率响应矩阵，对应的函数 `h(λ)` 为 `H` 的频率响应函数，不同的频率响应函数可以实现不同的滤波效果。在信号处理中，常见的滤波器有
    3 类：低通滤波器、高通滤波器、带通滤波器（见图 5-6）。


    ![图5-6 3类滤波器的频率响应函数](Images/5a6.jpg)


    图 5-6 所示为 3 类滤波器的频率响应函数：从 a 图中可以看出，低通滤波器只保留信号中的低频成分，更加关注信号中平滑的部分；从 b 图中可以看出，高通滤波器只保留信号中的高频成分，更加关注信号中快速变化的部分；从
    c 图中可以看出，带通滤波器只保留信号特定频段的成分。


    理论上，我们希望实现任意性质的图滤波器，也就是实现任意类型函数曲线的频率响应函数。通过逼近理论，我们可以用泰勒展开—多项式逼近函数去近似任意函数。下面，我们将目光聚焦在拉普拉斯矩阵多项式拓展形式的图滤波器上：


    ```

    H = Σ(k=0 to K) h_k L^k

    ```


    其中 `K` 是图滤波器 `H` 的阶数。和图信号一样，对于图滤波器，我们也可以同时从空域视角和频域视角来理解。


    ### 5.4.1 空域角度


    对于 `H = Σ(k=0 to K) h_k L^k`，如果我们设定：


    ```

    x^(k) = L x^(k-1)

    ```


    则：


    ```

    y = Σ(k=0 to K) h_k x^(k)

    ```


    通过上式，将输出图信号变成了 `(K+1)` 组图信号的线性加权。对于式（5.21），由于 `L` 是一个图位移算子，因此，`x^(k-1)` 到 `x^(k)`
    的变换只需要所有节点的一阶邻居参与计算。总的来看，`x^(k)` 的计算只需要所有节点的 `k` 阶邻居参与，我们称这种性质为图滤波器的局部性。


    从空域角度来看，滤波操作具有以下性质：


    1. 具有局部性，每个节点的输出信号值只需要考虑其 `K` 阶子图；

    2. 可通过 `K` 步迭代式的矩阵向量乘法来完成滤波操作。


    我们以图 5-7 为例来看图信号滤波操作在空域的计算过程：


    ![图5-7 空域视角滤波计算示意图](Images/5a7.jpg)


    根据图 5-3 中的 a 图，将图 `G` 的邻接矩阵作为图滤波器：


    ```

    H = A

    ```


    给定图信号 `x = [1 0 0 -1 -1]^T`，系数向量 `h = [1 0.5 0.5]^T`，根据公式（5.22），我们可以得到滤波输出的图信号为：


    ```

    y = h_0 x^(0) + h_1 x^(1) + h_2 x^(2)

    ```


    其中 `x^(0) = x = [1 0 0 -1 -1]^T`，`x^(1) = Hx = [0 0 0 -1 -1]^T`，`x^(2) = Hx^(1)
    = [0 -1 -1 -1 -1]^T`。代入数据，得到 `y`：


    ```

    y = 1×[1 0 0 -1 -1]^T + 0.5×[0 0 0 -1 -1]^T + 0.5×[0 -1 -1 -1 -1]^T

    ```


    `x^(1)`、`x^(2)` 的计算在图 5-7 中已给出，由于空域滤波操作的局部性，`H` 等价于一个聚合邻居的操作算子，如 a 图、b 图中的箭头所示，从
    a 图、b 图、c 图中可以清楚地看出，`x^(0) → x^(1) → x^(2)` 的计算是一个迭代式的过程。


    ### 5.4.2 频域角度


    由于 `L = VΛV^T`，则：


    ```

    H = V (Σ(k=0 to K) h_k Λ^k) V^T

    ```


    通过式（5.23），我们可以清楚地看出 `H` 的频率响应函数为 `λ` 的 `K` 次代数多项式，如果 `K` 足够大，我们可以用这种形式去逼近任意一个关于
    `λ` 的函数。


    如果我们用该滤波器进行滤波，则：


    ```

    y = Hx = V (Σ(k=0 to K) h_k Λ^k) V^T x

    ```


    式（5.24）即为频域视角下的滤波操作，其变换过程由以下 3 步组成：


    1. 通过图傅里叶变换，即 `x̂ = V^T x` 将图信号变换到频域空间；

    2. 通过 `ĥ = Σ(k=0 to K) h_k Λ^k` 对频率分量的强度进行调节，得到 `ŷ = ĥ ⊙ x̂`；

    3. 通过逆图傅里叶变换，即 `y = V ŷ` 将 `ŷ` 反解成图信号 `y`。


    我们假设所有的多项式系数 `h` 构成向量 `h`，则 `H` 的频率响应矩阵为：


    ```

    Λ[h] = V^T H V = Σ(k=0 to K) h_k Λ^k

    ```


    其中 `V_K` 为范德蒙矩阵，我们可以反解得到多项式系数：


    ```

    h = V_K^(-1) diag(Λ[h])

    ```


    其中 `diag^(-1)` 表示将对角矩阵变成列向量。式（5.26）说明给定我们想要的频率响应矩阵，可以通过上式反解得到多项式系数。显然，这个式子对于特定性质的图滤波器的设计具有十分重要的意义。


    图 5-8 是对图信号进行低通滤波的操作示意图。从中可以看到，相较于原始图信号，对其进行低通滤波后，图信号变得更加平滑了。


    ![图5-8 频域滤波过程示意图](Images/5a8.jpg)


    从频域角度来看，我们可以对图滤波操作出以下性质总结：


    1. 从频域视角能够更加清晰地完成对图信号的特定滤波操作；

    2. 图滤波器如何设计具有显式的公式指导；

    3. 对矩阵进行特征分解是一个非常耗时的操作，具有 `O(N³)` 的时间复杂度，相比空域视角中的矩阵向量乘法而言，有工程上的局限性。


    ## 5.5 图卷积神经网络


    在学习了图滤波器定义的基础之上，本节我们来看看图信号处理中的卷积操作是如何定义的。给定两组 `G` 上的图信号 `x₁`、`x₂`，其图卷积运算定义如下：


    ```

    x₁ * x₂ = V ((V^T x₁) ⊙ (V^T x₂))

    ```


    其中 `⊙` 表示哈达玛积。这里的定义与我们在离散时间信号处理中的卷积的定义是一样的—时域中的卷积运算等价于频域中的乘法运算。


    我们对式（5.27）继续进行推导：


    ```

    x₁ * x₂ = V (diag(V^T x₁) V^T x₂) = H x₂

    ```


    令 `H = V diag(V^T x₁) V^T`，显然 `H` 是一个图位移算子，其频率响应矩阵为 `x₁` 的频谱，于是可得：


    ```

    x₁ * x₂ = H x₂

    ```


    从式（5.29）可知，两组图信号的图卷积运算总能转化为对应形式的图滤波运算，从这个层面上来看，图卷积等价于图滤波。后文中提到的图卷积运算都是特指式（5.29）右边的滤波形式，至于相对应的卷积信号，一般并不需要显式地表达出来。


    需要特别说明的是，前面所有的图信号处理的相关概念里的图信号都能被拓展到矩阵形式。设矩阵 `X ∈ R^(N×d)`，我们可以将 `X` 视为 `d` 组定义在图
    `G` 上的图信号，于是我们称 `X` 为图信号矩阵，`d` 为图信号的总通道数，`X[:, j]` 表示第 `j` 个通道上的图信号。例如，对 `Y =
    HX`，我们可以理解成用图滤波器 `H` 对信号矩阵 `X` 每个通道的信号分别进行滤波操作，`X[:, j]` 对应的输出为图信号矩阵 `Y` 第 `j`
    个通道上的图信号 `Y[:, j]`。


    借鉴卷积神经网络在计算机视觉中的成功，将上述定义的图卷积运算推广到图数据的学习中去就成了一种自然而然的想法。接下来，我们将介绍这其中具有代表性的一些工作。


    ### 1. 对频率响应矩阵进行参数化


    既然图卷积操作等价于图滤波操作，而图滤波算子的核心在于频率响应矩阵，那么我们自然想到对频率响应矩阵进行参数化，这样我们就可以定义如下神经网络层：


    ```

    X'' = σ(V diag(θ) V^T X)

    ```


    其中 `σ(·)` 是激活函数，`θ = [θ₁, θ₂, …, θ_N]` 是需要学习的参数，`Θ` 是对应的需要学习的图滤波器，`X` 是输入的图信号矩阵，`X''`
    是输出的图信号矩阵。基本上这个思路可以按照图滤波操作的空域视角与频域视角去理解：


    1. 从空域视角来看，该层引入了一个自适应的图位移算子，通过学习的手段指导该算子的学习，从而完成对输入图信号的针对性变换操作。

    2. 从频域角度看，该层在 `X` 与 `X''` 之间训练了一个可自适应的图滤波器，图滤波器的频率响应函数是怎样的，可以通过任务与数据之间的对应关系来进行监督学习。


    上述思路虽然简单易懂，但是也存在一个较大的问题：引入的学习参数过多，需要学习的参数量与图中的节点数一致，这在大规模图数据，比如上亿节点数规模的图中，极易发生过拟合问题。


    另外，在真实的图数据中，数据的有效信息通常都蕴含在低频段中（参考第 6 章第 3 节的相关内容），因此为图滤波器设置 `N` 个维度的自由度，且对每个频率都进行学习是没必要的。


    ### 2. 对多项式系数进行参数化


    同样，为了拟合任意的频率响应函数，我们也可以将拉普拉斯矩阵的多项式形式转化为一种可学习的形式，该思路在引文 [6] 中被提出，具体如下：


    ```

    H = Σ(k=0 to K) θ_k L^k

    ```


    其中 `θ = [θ₁, θ₂, …, θ_K]` 是多项式系数向量，也是该网络层真正需要学习的参数，与前述方法不同的是，这个方法的参数量 `K` 可以自由控制。`K`
    越大，可拟合的频率响应函数的次数就越高，可以对应输入图信号矩阵与输出图信号矩阵之间复杂的滤波关系；`K` 越小，可拟合的频率响应函数的次数就越低，可以对应输入图信号矩阵与输出图信号矩阵之间简单的滤波关系。总的来说，一般设
    `K << N`，这将大大降低模型过拟合的风险。


    ### 3. 设计固定的图滤波器


    前述方法虽然大大降低了参数量，但却由于对矩阵特征分解比较依赖而给计算带来了极高的复杂度。为了解决这个问题，在引文 [7] 中，作者对上式进行了限制，设 `K
    = 1`，则：


    ```

    H = θ₀ I + θ₁ L

    ```


    令 `θ₀ = θ₁ = θ`，则：


    ```

    H = θ(I + L)

    ```


    需要注意的是，这里的 `θ` 是一个标量，相当于对 `I + L` 的频率响应函数做了一个尺度变换，通常这种尺度变换在神经网络模型中会被归一化操作替代，因此，这个参数是不必要引入的，我们设
    `θ = 1`，然后就得到了一个固定的图滤波器 `I + L`。


    为了加强网络学习时的数值稳定性，作者仿照正则拉普拉斯矩阵，对 `I + L` 也做了归一化处理。令 `L̃ = D^(-1/2) (I + L) D^(-1/2)`，我们称
    `L̃` 为重归一化形式的拉普拉斯矩阵。`L̃` 的特征值范围为 `(-1, 1]`，可以有效防止多层网络优化时出现的梯度消失或爆炸的现象（参考第 6 章第
    3 节的内容）。


    为了加强网络的拟合能力，作者设计了一个参数化的权重矩阵 `W` 对输入的图信号矩阵进行仿射变换，于是得到：


    ```

    X'' = σ(L̃ X W)

    ```


    如果没有其他说明，我们特称式（5.34）为图卷积层，以此为主体堆叠多层的神经网络模型称为图卷积模型。


    图卷积层是对频率响应函数拟合形式上的极大简化，最后相应的图滤波器退化成了 `L̃`，图卷积操作变成了 `L̃ X W`。如果将 `X` 由信号矩阵的角色切换到特征矩阵上，由于
    `L̃` 是一个图位移算子，依据矩阵乘法的行向量视角，`L̃ X` 的计算等价于对邻居节点的特征向量进行聚合操作，于是图卷积层在节点层面的计算公式如下：


    ```

    x''_i = σ(Σ(j∈N(i)∪{i}) (1/√(d_i d_j)) x_j W)

    ```


    图 5-7 即为这种聚合邻居节点操作的示意图。实际在工程上，`L̃` 可以用稀疏矩阵来表示，这可以进一步降低图卷积层的计算复杂度。相较于频域图卷积中矩阵分解时
    `O(N³)` 的时间复杂度，这种空域图卷积计算的时间复杂度可以降至 `O(|E|d)`。


    至于在实际任务中设计固定图滤波器的做法是否有效，我们从以下两点进行说明：


    1. `L̃` 本身所具有的滤波特性是比较符合真实数据的特有性质的（参考第 6 章第 3 节的相关内容），能对数据实现高效的滤波操作；

    2. 虽然 GCN 层是由对频率响应函数的线性近似推导得出来的，但是和深度学习中深度网络给模型带来的强大拟合能力一样，堆叠多层 GCN 层，在某种程度上，可以达到高阶多项式形式的频率响应函数的滤波能力。这种简化单层网络的学习能力，通过增加深度来提升模型表达能力的做法，在之前介绍的
    CNN 模型中表现出了极强的工程优越性。事实证明，这种设计所带来的优越性也在 GCN 后续的多项相关论文中得到了充分展示，以 GCN 为代表的模型俨然成为各类图数据学习任务的首选。


    总的来说，正是由于有了图信号处理中对图卷积操作的定义与理解，神经网络模型中的图卷积层才能得到非常直观的设计。一般来说，对于只能从频域出发进行矩阵特征分解从而执行图卷积计算的模型，我们称之为频域图卷积模型。相应地，对于图卷积计算不需要进行矩阵特征分解，能在空域视角执行矩阵乘法计算的模型，我们称之为空域图卷积模型。需要特别说明的是，虽然空域图卷积模型具有工程上的优越性，但是这类模型也都可以从频域视角进行理解，从本书后续的相关章节中，我们也可以看到频域视角对于图卷积模型的设计也是十分重要的。


