    \n## 8.2.3 Edge Contraction-based Pooling Mechanism\n\nIn this section, we introduce\
    \ the edge contraction-based pooling mechanism—`EdgePool`. This method combines\
    \ the important graph transformation operation of edge contraction with an end-to-end\
    \ learning mechanism to achieve hierarchical pooling of graph data. In summary,\
    \ this method iteratively merges pairs of nodes on each edge to form a new node,\
    \ while preserving the connection relationships of the two nodes before merging\
    \ onto the new node. There is a problem here: each node has multiple edges, but\
    \ each node can only belong to one edge for edge contraction. How then to select\
    \ the edge to which each node belongs? For this, `EdgePool` designs a score for\
    \ each edge, and performs non-repetitive selection and merging based on this score.\
    \ The specific operations are as follows:\n\nFor each edge, calculate the raw\
    \ score `r`:\n\n![](img/168-i.jpg`)\n\nSince the choice of which edge a node selects\
    \ needs to be considered from its local neighbors, we normalize the raw scores\
    \ along neighbor nodes:\n\n![](img/168-2-i.jpg`)\n\nAfter obtaining the above\
    \ scores, next sort all `s[ij]`, and sequentially select the two nodes with the\
    \ highest score that have not been selected for contraction. Details are shown\
    \ in Figure 8-5:\n\n![](img/8a5.jpg`)\n\nFigure 8-5  `EdgePool` Process\n\nIn\
    \ Figure 8-5, figure (a) calculates the raw score `r` for each edge in the graph.\
    \ For this undirected graph, we duplicate the direction bidirectionally; for directed\
    \ graphs, only subsequent operations along the direction are needed. Figure (b)\
    \ calculates `e^r`. Figure (c) performs normalization along the incoming edge\
    \ direction for each node. The bolded edges in the figure represent the selected\
    \ edges for contraction. Note that when determining the `<v[2], v[1]>` edge, although\
    \ the `<v[2], v[3]>` edge has a higher score of 0.8, node `v[3]` has already been\
    \ selected to merge with node `v[4]`, so the edge with the second highest score\
    \ `<v[2], v[1]>` is selected for contraction. Figure (d) shows the result after\
    \ merging.\n\nThe merged node features can be represented using summation:\n\n\
    ![](img/169-i.jpg`)\n\nWhere `h[ij]` denotes the feature vector of the new node\
    \ merged from nodes `v[i]` and `v[j]`. In calculating this value, similar to the\
    \ many previous methods, the score `s` is also used to perform shrinkage processing\
    \ on node features. If edge features need to be processed, the calculation of\
    \ `s[ij]` and `h[ij]` can be established on `RDF` triples; readers can think about\
    \ the specific form themselves.\n\n`EdgePool`, like `DIFFPOOL`, continuously performs\
    \ fusion learning on all nodes in the graph. The difference is that `DIFFPOOL`\
    \ requires manually setting the number of cluster centroids, while `EdgePool`\
    \ strictly controls the node merging ratio at 0.5 using edge contraction. Moreover,\
    \ precisely because it utilizes the principle of edge contraction, `EdgePool`\
    \ only merges neighboring nodes that are close. This approach has the following\
    \ advantages: node fusion starts from edges, which conforms to graph structural\
    \ information and is more reasonable; simultaneously, this operation preserves\
    \ the sparsity of connections in the fused graph, resulting in lower space complexity.\
    \ As an end-to-end pooling mechanism, `EdgePool` can also be widely integrated\
    \ into various `GNN` models to complete graph classification task learning.\n\n\
    [1] Diehl F. Edge Contraction Pooling for Graph Neural Networks[J]. arXiv preprint\
    \ arXiv:1905.10990, 2019.\n\n## 8.3 Graph Classification Practice\n\nIn this section,\
    \ we implement the self-attention-based pooling mechanism (`Self-Attention Pooling`)\
