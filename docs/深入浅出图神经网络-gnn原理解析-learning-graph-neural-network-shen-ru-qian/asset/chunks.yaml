    ### 7.4.3 GN


    `Graph Network`[^(\[11\])](../Text/chapter89.xhtml#gg-11)相较于`MPNN`和`NLNN`，对`GNN`做出了更一般的总结。其基本计算单元包含3个要素：节点的状态`h[i]`、边的状态`e[ij]`、图的状态`u`。围绕着这3个元素，`Graph
    Network`设计了3个更新函数`φ`、3个聚合函数`ρ`，具体如下：


    ![](Images/147-5-i.jpg)


    `GN`的计算过程如图7-9所示，蓝色表示正在被更新的元素，黑色表示正在参与更新计算的元素。`GN`的更新思路是非常自然的，由点更新边，边聚合更新点，点聚合与边聚合更新图，当然每个元素在更新的时候还需要考虑自身上一轮的状态。需要注意的是，上述的更新步骤并不是一成不变的，也可以从全局出发到每个节点，再到每条边。另外，全图状态`u`的初始值，可以看成是图的某种固有属性或者先验知识的编码向量。如果除去这个全图状态值的维护，`GN`就退化成了一个维护边状态的`MPNN`。


    ![](Images/7a9.jpg)


    图7-9　GN的计算过程^([\[1\]](#chapter87.xhtml#ch1_back))


    `GN`对图里面的节点、边、全图都维护了相应的状态，这三者可以分别对应上节点层面的任务、边层面的任务、全图层面的任务。当然在实际场景中，可以依据图数据以及相关任务的实际情况，对`GN`进行相应的简化处理。


    [\[1\]](#chapter87.xhtml#ch1) Battaglia P W，Hamrick J B，Bapst V，et al.Relational
    inductive biases，deep learning，and graph networks\[J\].arXiv preprint arXiv：1806.01261，2018.


