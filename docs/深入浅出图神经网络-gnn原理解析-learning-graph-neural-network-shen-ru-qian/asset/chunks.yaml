    \ = attention_score.new_zeros((graph_node_num,),\n                           \
    \                     dtype=torch.bool)\n        keep_graph_node_num = int(keep_ratio\
    \ * graph_node_num)\n        _, sorted_index = graph_attn_score.sort(descending=True)\n\
    \        graph_mask[sorted_index[:keep_graph_node_num]] = True\n        mask =\
    \ torch.cat((mask, graph_mask))\n    return mask\n```\n\n函数`top_rank`接收3个参数，一是使用`GCN`得到的节点重要度分数`attention_score`；二是指示每个节点属于哪个图的参数`graph_indicator`，这里我们将多个需要分类的图放在一起进行批处理，以提高运算速度，`graph_indicator`里面包含的数据为`[0，0，...，0，1，1，...，1，2，2，...，2...]`。需要注意的是，`graph_indicator`的标识值需要进行升序排列，同时属于同一个图的节点需要连续排列在一起；三是超参数`keep_ratio`，表示每次池化需要保留的节点比例，这是针对单个图而言的，不是整个批处理中所有的数据。实现逻辑上根据`graph_indicator`依次遍历每个图，取出该图对应的注意力分数，并进行排序得到要保留的节点索引，将这些位置的索引设置为`True`，得到每个子图节点的掩码向量。将所有图的掩码拼接在一起得到批处理中所有节点的掩码，作为函数的返回值。\n\
    \n接下来，根据得到的节点掩码对图结构和特征进行更新。图结构的更新是根据掩码向量对邻接矩阵进行索引，得到保留节点之间的邻接矩阵，再进行归一化，作为后续`GCN`层的输入。因此我们定义两个功能函数`normalization(adjacency)`和`filter_adjacency(adjacency,\
    \ mask)`。其中`normalization(adjacency)`接收一个`scipy.sparse.csr_matrix`，对它进行规范化并转换为`torch.sparse.FloatTensor`。另一个函数`filter_adjacency(adjacency,\
    \ mask)`接收两个参数，一个是池化之前的邻接矩阵`adjacency`，它的类型为`torch.sparse.FloatTensor`，另一个是函数`top_rank`输出的节点的掩码`mask`。为了利用`scipy.sparse`提供的切片索引，这里将池化之前的`adjacency`转换为`scipy.sparse.csr_matrix`，然后通过掩码`mask`进行切片，得到池化后的节点之间的邻接关系，随后再使用函数`normalization`进行规范化，作为下一层图卷积的输入。如代码清单8-2所示：\n\
