    ## 第1章　图的概述


    图（`Graph`）是一个具有广泛含义的对象。在数学中，图是图论的主要研究对象；在计算机工程领域，图是一种常见的数据结构；在数据科学中，图被用来广泛描述各类关系型数据。许多图学习的理论都专注于图数据相关的任务上。


    通常，图被用来表示物体与物体之间的关系。这在生活中有着非常多的现实系统与之对应，比如化学分子、通信网络、社交网络等。事实上，任何一个包含二元关系的系统都可以用图来描述。因此，研究并应用图相关的理论，具有重大的现实意义。


    本章，我们主要对图相关的概念做一些基础介绍，包括图的基本定义、图在计算机中的存储表示方法与遍历方法、图数据及其常见的应用场景、图数据深度学习的浅述。


    ### 1.1　图的基本定义


    在数学中，图由顶点（`Vertex`）以及连接顶点的边（`Edge`）构成。顶点表示研究的对象，边表示两个对象之间特定的关系。


    图可以表示为顶点和边的集合，记为`G=(V,E)`，其中`V`是顶点集合，`E`是边集合。同时，我们设图`G`的顶点数为`N`，边数为`M`（如无特殊说明，本书中的图均如此表示）。一条连接顶点`v[i]`，`v[j]∈V`的边记为`(v[i],v[j])`或者`e[ij]`。如图1-1所示，`V={v[1],v[2],v[3],v[4],v[5]}`，`E={(v[1],v[2]),(v[1],v[3]),(v[2],v[4]),(v[2],v[3]),(v[3],v[4]),(v[4],v[5])}`。


    ![](Images/1a1.jpg)


    图1-1　图`G`的定义


    #### 1.1.1　图的基本类型


    **1. 有向图和无向图**


    如果图中的边存在方向性，则称这样的边为有向边`e[ij]=<v[i],v[j]>`，其中`v[i]`是这条有向边的起点，`v[j]`是这条有向边的终点，包含有向边的图称为有向图，如图1-2所示。与有向图相对应的是无向图，无向图中的边都是无向边，我们可以认为无向边是对称的，同时包含两个方向：`e[ij]=<v[i],v[j]>=<v[j],v[i]>=e[ji]`。


    ![](Images/1a2.jpg)


    图1-2　有向图


    **2. 非加权图与加权图**


    如果图里的每条边都有一个实数与之对应，我们称这样的图为加权图，如图1-3所示，该实数称为对应边上的权重。在实际场景中，权重可以代表两地之间的路程或运输成本。一般情况下，我们习惯把权重抽象成两个顶点之间的连接强度。与之相反的是非加权图，我们可以认为非加权图各边上的权重是一样的。


    ![](Images/1a3.jpg)


    图1-3　加权图


    **3. 连通图与非连通图**


    如果图中存在孤立的顶点，没有任何边与之相连，这样的图被称为非连通图，如图1-4所示。相反，不存在孤立顶点的图称为连通图。


    **4. 二部图**


    二部图是一类特殊的图。我们将`G`中的顶点集合`V`拆分成两个子集`A`和`B`，如果对于图中的任意一条边`e[ij]`均有`v[i]∈A`，`v[j]∈B`或者`v[i]∈B`，`v[j]∈A`，则称图`G`为二部图，如图1-5所示。二部图是一种十分常见的图数据对象，描述了两类对象之间的交互关系，比如：用户与商品、作者与论文。


    ![](Images/1a4.jpg)


    图1-4　非连通图


    ![](Images/1a5.jpg)


    图1-5　二部图


    #### 1.1.2　邻居和度


    如果存在一条边连接顶点`v[i]`和`v[j]`，则称`v[j]`是`v[i]`的邻居，反之亦然。我们记`v[i]`的所有邻居为集合`N(v[i])`，即：


    ![](Images/004-i.jpg)


    以`v[i]`为端点的边的数目称为`v[i]`的度（`Degree`），记为`deg(v[i])`：


    ![](Images/004-2-i.jpg)


    在图中，所有节点的度之和与边数存在如下关系：


    ![](Images/004-3-i.jpg)


    在有向图中，我们同时定义出度（`Outdegree`）和入度（`Indegree`），顶点的度数等于该顶点的出度与入度之和。其中，顶点`v[i]`的出度是以`v[i]`为起点的有向边的数目，顶点`v[i]`的入度是以`v[i]`为终点的有向边的数目。


    #### 1.1.3　子图与路径


    若图`G''=(V'',E'')`的顶点集和边集分别是另一个图`G=(V,E)`的顶点集的子集和边集的子集，即`V''⊆V`，且`E''⊆E`，则称图`G''`是图`G`的子图（`Subgraph`）。


    在图`G=(V,E)`中，若从顶点`v[i]`出发，沿着一些边经过一些顶点`v[k1],v[k2],...,v[kn]`，到达顶点`v[j]`，则称边序列`e[i,k1],e[k1,k2],...,e[kn,j]`为从顶点`v[i]`到顶点`v[j]`的一条路径（`Path`，也可称为通路），其中`e[...]`为图`G`中的边。


    路径的长度：路径中边的数目通常称为路径的长度`L(P[ij])=|P[ij]|`。


    顶点的距离：若存在至少一条路径由顶点`v[i]`到达顶点`v[j]`，则定义`v[i]`到`v[j]`的距离为：


    ![](Images/004-7-i.jpg)


    也即两个顶点之间的距离由它们的最短路径的长度决定。我们设`d(v[i],v[j])=0`，节点到自身的距离为0。


    k阶邻居：若`d(v[i],v[j])=k`，我们称`v[j]`为`v[i]`的k阶邻居。


    k阶子图（`k-subgraph`）：我们称一个顶点`v[i]`的k阶子图为：


    ![](Images/005-i.jpg)


    有时，我们也称k阶子图为`k-hop`。图1-6中的阴影部分就是顶点`V[1]`的2阶子图。


    ![](Images/1a6.jpg)


    图1-6　图`G`的2阶子图


    ### 1.2　图的存储与遍历


    #### 1.2.1　邻接矩阵与关联矩阵


    作为一种常见的数据结构，在计算机里图的存储表示方法有很多种，本节只着重介绍邻接矩阵（`Adjacency matrix`）和关联矩阵（`Incidence
    matrix`）这两种方式。


    设图`G=(V,E)`，在这里我们对边重新进行了编号`e[1],e[2],...,e[M]`，如图1-7所示。我们用邻接矩阵`A`描述图中顶点之间的关联，`A∈R^(N×N)`，其定义为：


    ![](Images/005-2-i.jpg)


    ![](Images/1a7.jpg)


    图1-7　图`G`示例


    用邻接矩阵存储图的时候，我们需要一个一维数组表示顶点集合，需要一个二维数组表示邻接矩阵。需要特别说明的是，由于在实际的图数据中，邻接矩阵往往会出现大量的0值，因此可以用稀疏矩阵的格式来存储邻接矩阵，这样可以将邻接矩阵的空间复杂度控制在`O(M)`的范围内。图1-8中a图给出了图`G`的邻接矩阵存储表示，通过该图可以看出，无向图的邻接矩阵是沿主对角线对称的，即`A[ij]=A[ji]`。


    ![](Images/1a8.jpg)


    图1-8　图`G`的邻接矩阵和关联矩阵


    除了邻接矩阵外，我们有时也用关联矩阵`B∈R^(N×M)`来描述节点与边之间的关联，定义如下：


    ![](Images/006-3-i.jpg)


    用关联矩阵存储图的时候，我们需要两个一维数组分别表示顶点集合和边集合，需要一个二维数组表示关联矩阵。同样，关联矩阵也可以用稀疏矩阵来存储，这是因为`B`的任意一列仅有两个非0值。图1-8中b图展示了用关联矩阵来存储图的示例。


    #### 1.2.2　图的遍历


    图的遍历是指从图中的某一顶点出发，按照某种搜索算法沿着图中的边对图中的所有顶点访问一次且仅访问一次。图的遍历主要有两种算法：深度优先搜索（`DFS`，`Depth-First-Search`）和广度优先搜索（`BFS`，`Breadth-First-Search`）。图的遍历是一种重要的图检索手段，深度优先搜索与广度优先搜索给出了相应的算法基础。


    深度优先搜索是一个递归算法，有回退过程。其算法思想是：从图中某一顶点`v[i]`开始，由`v[i]`出发，访问它的任意一个邻居`w[1]`；再从`w[1]`出发，访问`w[1]`的所有邻居中未被访问过的顶点`w[2]`；然后再从`w[2]`出发，依次访问，直到出现某顶点不再有邻居未被访问过。接着，回退一步，回退到前一次刚访问过的顶点，看是否还有其他未被访问过的邻居，如果有，则访问该邻居，之后再从该邻居出发，进行与前面类似的访问；如果没有，就再回退一步进行类似访问。重复上述过程，直到该图中所有顶点都被访问过为止。以图1-7为例，我们可以得到如下深度优先搜索序列：`v[1]→v[2]→v[4]→v[5]→v[3]`。


    广度优先搜索是一个分层的搜索过程，没有回退过程，其算法思想是：从图中某一顶点`v[i]`开始，由`v[i]`出发，依次访问`v[i]`的所有未被访问过的邻居`w[1],w[2],...,w[n]`；然后再顺序访问`w[1],w[2],...,w[n]`的所有还未被访问过的邻居，如此一层层执行下去，直到图中所有顶点都被访问到为止。以图1-7为例，我们可以得到如下广度优先搜索序列：`v[1]→v[2]→v[3]→v[4]→v[5]`。


    ### 1.3　图数据的应用场景


    我们提到图，更多的是带有一种数学上的理论色彩，在实际的数据场景中，我们通常将图称为网络（`Network`），与之对应的，图的两个要素（顶点和边）也被称为节点（`Node`）和关系（`Link`），比如我们熟知的社交网络、物流网络等概念名词。为了达成统一并与神经网络（`Neural
    Networks`）中的“网络”概念区分开来（尽管神经网络也是一种网络），本书将网络数据称为图数据。


    图数据是一类比较复杂的数据类型，存在非常多的类别。这里我们介绍其中最重要的4类：同构图（`Homogeneous Graph`）、异构图（`Heterogeneous
    Graph`）、属性图（`Property Graph`）和非显式图（`Graph Constructed from Non-relational Data`）。


    1. **同构图**：同构图是指图中的节点类型和关系类型都仅有一种。同构图是实际图数据的一种最简化的情况，如由超链接关系所构成的万维网，这类图数据的信息全部包含在邻接矩阵里。

    2. **异构图**：与同构图相反，异构图是指图中的节点类型或关系类型多于一种。在现实场景中，我们通常研究的图数据对象是多类型的，对象之间的交互关系也是多样化的。因此，异构图能够更好地贴近现实。

    3. **属性图**：相较于异构图，属性图给图数据增加了额外的属性信息，如图1-9所示。对于一个属性图而言，节点和关系都有标签（`Label`）和属性（`Property`），这里的标签是指节点或关系的类型，如某节点的类型为“用户”，属性是节点或关系的附加描述信息，如“用户”节点可以有“姓名”“注册时间”“注册地址”等属性。属性图是一种最常见的工业级图数据的表示方式，能够广泛适用于多种业务场景下的数据表达。


    ![](Images/1a9.jpg)


    图1-9　属性图


    4. **非显式图**：非显式图是指数据之间没有显式地定义出关系，需要依据某种规则或计算方式将数据的关系表达出来，进而将数据当成一种图数据进行研究。比如计算机3D视觉中的点云数据，如果我们将节点之间的空间距离转化成关系的话，点云数据就成了图数据。


    在我们研究多元化对象系统的时候，图是一种非常重要的视角。在现实世界中，图数据有着十分广泛的应用场景。下面我们举几个例子进行说明，如图1-10所示。


    ![](Images/1a10.jpg)


    图1-10　图数据应用示例[^1][^19]


    **社交网络**：社交网络是十分常见的一类图数据，代表着各种个人或组织之间的社会关系。如图1-10的a图展示了在线社交网络中的用户关注网络：以用户为节点，用户之间的关注关系作为边。这是一个典型的同构图，一般用来研究用户的重要性排名以及相关的用户推荐等问题。随着移动互联网技术的不断深入，更多元化的媒体对象被补充进社交网络中，比如短文本、视频等，如此构成的异构图可以完成更加多样化的任务。


    **电子购物**：电子购物是互联网中的一类核心业务，在这类场景中，业务数据通常可以用一个用户–商品的二部图来描述，在如图1-10的b图所展示的例子中，节点分为两类：用户和商品，存在的关系有浏览、收藏、购买等。用户与商品之间可以存在多重关系，如既存在收藏关系也存在购买关系。这类复杂的数据场景可以用属性图轻松描述。电子购物催生了一项大家熟知的技术应用—推荐系统。用户与商品之间的交互关系，反映了用户的购物偏好。例如，经典的啤酒与尿布的故事：爱买啤酒的人通常也更爱买尿布。


    **化学分子**：以原子为节点，原子之间的化学键作为边，我们可以将分子视为一种图数据进行研究，分子的基本构成以及内在联系决定了分子的各项理化性质，通常我们用其指导新材料、新药物的研究任务，如图1-10的c图所示。


    **交通网络**：交通网络具有多种形式，比如地铁网络中将各个站点作为节点，站点之间的连通性作为边构成一张图，如图1-10的d图所示。通常在交通网络中我们比较关注的是路径规划相关的问题：比如最短路径问题，再如我们将车流量作为网络中节点的属性，去预测未来交通流量的变化情况。

