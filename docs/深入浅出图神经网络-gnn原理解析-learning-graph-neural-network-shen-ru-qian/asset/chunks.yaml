- raw: '在GNN被应用到点云数据处理之前，一种解决思路是将点云强制表示为体元（voxel），这样就得到与图像类似的一种三维规则结构，以便进行卷积和池化操作。但这种处理方式会使得数据量剧增，并且会产生很大的数据冗余，计算开销非常大。另一种解决思路是将点云转换为多视觉图（Multi-view
    Images），即一组虚拟的二维快照，生成RGB和包含几何特征的合成视图，然后在图像处理完毕后再将其语义分段投影回原始的点云数据[^(\[9\])](../Text/chapter112.xhtml#jj-9)。这种方法并不能捕捉3D点云的内在结构，因而识别性能有限。实际上，这两种曲线救国的方法都会造成信息的丢失或者数据的冗余，且转换过程复杂度高，对于大规模的点云数据处理和点云理解都无法适应。


    图卷积技术的发展极大地推动了点云的处理方法的进步，人们提出了很多基于GNN的方法，在点云分类、分割等问题上展现了优异的性能。这里以近年来提出的典型GNN模型为例，阐述GNN技术在应用于点云这种非结构化数据时的关键步骤。


    点云数据中的点是离散存在的，点与点间的距离d是确定点彼此之间关系的基础。基于点坐标（x，y，z）的欧式空间距离是一种常见的选择；其他非欧式空间的距离选择如测地（geodesic）距离、形状感知距离等，可以很好地处理非刚性特征，也被很多研究者应用，如Charles
    R.Qi等人（2017）提出的PointNet++算法[^(\[10\])](../Text/chapter112.xhtml#jj-10)。


    有了距离即可确定点与点之间的邻接关系。如何将距离转化成邻接关系，成为运用GNN技术的一个关键点。通常我们需要定义邻域，每个点都与其邻域范围内的点相连，而与邻域以外的点无邻接关系。邻域范围可以根据K最近邻法（K
    nearest neighbor）确定，也可以根据球查询（落某半径范围的球状区域内的所有点）确定。值得注意的是，点之间的邻接关系在每一层的图中并不是固定不变的。PointNet++算法中采用了每一层固定邻域点进行卷积操作的策略，而在Edge-Conv的算法[^(\[11\])](../Text/chapter112.xhtml#jj-11)中，每一层中的图都可以动态地调整图中节点之间的邻接关系，K邻域内的点随着网络的更新发生变化，这样就能自适应地捕捉和更新点云的局部几何特征，在点云分类和分割中取得很好的效果。


    邻接关系确定后的另一个关键步骤是基于邻接边的卷积该如何实现。如图10-2所示，定义e[ij]\=h[Θ]（x[i]，x[j]）为点v[i]和点v[j]间的边，其中h[Θ]为含有可学习参数Θ的非线性函数。


    ![](Images/10a2.jpg)


    图10-2　边卷积示意图


    以节点v[i]为中心的卷积计算如式（10.1）所示：


    ![](Images/202-2-i.jpg)


    PointNet++和Atzmon等（2018）提出的PCNN方法[^(\[12\])](../Text/chapter112.xhtml#jj-12)采用h[Θ]（x[i]，x[j]）=h[Θ]（x[j]）的方式，即卷积值通过对邻居进行聚合得到。若以Θ=（θ[1]，…，θ[m]）表示卷积滤波矩阵的权重，以PCNN算法为例，卷积的计算如式（10.2）所示：


    ![](Images/202-3-i.jpg)


    其中，g表示高斯核函数，d（x[i]，x[j]）表示点v[i]和v[j]之间的距离，与节点的特征相关。而Edge-Conv算法中采用的则是非对称方程![](Images/202-4-i.jpg)。


    可以看到点云数据中的卷积定义与GNN如出一辙。通常来说，模型的输入是点云数据的三维坐标值（x，y，z），因此输入矩阵是N×3，N表示点云的个数（用户可以根据需要增加其他属性信息）。对于点云分类而言，重点是识别整个数据集属于什么类别，因此输出值是关于类别的标签，属于图层面的输出。假设判定集有K个类别，那么输出为K维的打分向量。对于点云分割而言，需要知道每个点云属于哪一部分，假设P物体子部位的数目，因此模型输出为N×P维的打分矩阵，属于节点层面的输出。点云分类侧重于学习数据集的全局特征，而点云分割除了学习全局特征以外，还需要结合局部几何特征共同得到。因此在分割中，点云网络中局部关系（邻接关系）的定义显得更为重要。我们可以看到，通过不同的卷积策略和模型架构，基于图的深度学习方法为点云这样一种比图像更复杂的数据格式的处理和分析提供了高效的解决方案。


    ### 10.2.2　基于社交网络的推荐系统


    登录在线社区，如微博、微信、豆瓣、大众点评等网站，已经成为现代人日常生活中重要的一部分。在这些网络平台上用户可以查看或发布资讯、关注好友、评论感兴趣的文章等。为用户推荐其感兴趣的内容，一方面可以增加网站的活跃度，另一方面也可以帮助用户发现其潜在关注信息、增强用户黏度，当然基于用户特征进行广告推荐也是网站重要的盈利方式之一。因此，建立有效的推荐模型对于社交网站的运营和发展十分重要。


    有别于其他场景下的推荐应用，在线社区由于存在显式的用户社交网络信息，如何将这部分信息编码进推荐系统是一个十分关键的问题。总的来说，在线社区的推荐系统建模有以下几个难点：其一，用户兴趣有长期兴趣和短期兴趣之分。短期兴趣本身是动态变化的，用户可能前一段时间沉迷于明星的八卦新闻，过一段时间之后可能又对文学或是电影兴趣盎然。其二，用户会受到其在线社交圈中的朋友的影响（为简化表达，这里把用户在社交网络中建立了社交关系（如关注）的人通称为“朋友”）。如果用户A的朋友是体育迷，经常发布关于体育赛事、体育明星等的信息，用户A很可能也会去了解相关体育主题的资讯。其三，社交网络对用户兴趣的影响并非固定或恒定的，而是根据用户处境（context）动态变化的。举例来说，用户在听音乐时更容易受平时爱好音乐的朋友的影响，在购买电子产品时更容易受电子发烧友朋友的影响。


    下面以文献[\[13\]](../Text/chapter112.xhtml#jj-13)提出的DGR[EC]模型为例，阐述其如何融合社交网络信息从而搭建推荐系统。如图10-3所示，该方法由4个部分构成：


    ![](Images/10a3.jpg)


    图10-3　DGR[EC]模型^([\[1\]](#chapter109.xhtml#ch1_back))


    （1）一个循环神经网络RNN—用来建模用户的动态兴趣偏好。动态兴趣偏好可以从用户在当前会话（session）中已消费的项目（item）序列中获取。比如，当用户在一次会话中接连购买了靴子、外套等商品，那么明显用户此时的购物偏好为衣物类型，这种动态的兴趣偏好会极大地影响用户下一次的消费行为。


    （2）用户朋友的兴趣偏好通过其长期兴趣偏好与短期兴趣偏好组合而成。长期兴趣爱好反映了一个用户稳定的兴趣所在，可以通过对用户进行嵌入方式来表示；短期兴趣爱好则反映了一个用户在近期（一个或多个会话中）的兴趣漂移，可以使用RNN建模近期消费的项目序列来表示。


    （3）一个图注意力网络GAT—用来建模用户的动态兴趣偏好与朋友的兴趣偏好的交互模式，这是该方法最为关键的一个部分，自适应地学习出了社交网络对用户消费行为的影响的表示向量。上面提到过，用户实际的消费行为不仅受到朋友的影响，还依据用户处境受到不同朋友不同权重的影响。因此，使用一个基于注意力机制的GAT模型，可以很好地捕捉上述两层影响因素，对社交网络信息做到一种自适应的刻画。


    （4）用户下一步的消费行为由用户动态兴趣偏好与社交网络影响两部分信息综合决定。通过对（1）、（3）两个部分的输出进行组合从而得到用户的表示，然后和其他的推荐方法一样，由用户–项目对的信息进行DGR[EC]模型的端对端训练。在本文的实验部分，作者将DGR[EC]模型在豆瓣^([\[2\]](#chapter109.xhtml#ch2_back))、Delicious^([\[3\]](#chapter109.xhtml#ch3_back))、Yelp^([\[4\]](#chapter109.xhtml#ch4_back))等网络平台的数据集上进行实验，均取得了当下最好效果。同时作者也设计实验证明了GAT对于效果提升的必要性。


    值得一提的是，有研究者指出，不仅用户之间的关系在推荐效果中起着较大作用，被推荐项目之间的关系同样有影响。例如，外套和鞋子之间的关系就比外套和花盆之间的关系更强，这种项目之间的内在关系也对用户消费行为的推荐起作用。基于此，文献[\[14\]](../Text/chapter112.xhtml#jj-14)提出用双图注意力网络模型来同时建模用户与用户、项目与项目之间的双重网络效应，以此捕捉更加全面的关系信息从而提升推荐系统的效果。


    [\[1\]](#chapter109.xhtml#ch1) Song W，Xiao Z，Wang Y，et al.Session-based social
    recommendation via dynamic graph attention networks\[C\]//Proceedings of the Twelfth
    ACM International Conference on Web Search and Data Mining.ACM，2019：555-563.


    [\[2\]](#chapter109.xhtml#ch2) https://www.douban.com/。


    [\[3\]](#chapter109.xhtml#ch3) https://grouplens.org/datasets/hetrec-2011/。


    [\[4\]](#chapter109.xhtml#ch4) https://www.yelp.com/dataset。


    ### 10.2.3　视觉推理


    推理是人类具有的高阶能力，是人类智能中很重要的部分，如何让计算机拥有推理能力是人工智能领域的一项重要课题。


    以视觉领域为例，尽管卷积神经网络等模型取得了极大的成功，但是仍不具备复杂推理的能力，比如图10-4中，需要判断蓝色方框的目标是什么，人类在看到这幅图像的时候，根据图中的棒球棒、人物的姿态，首先会得出这张图在描述打棒球的结论，然后以此为依据，对于蓝色的目标区域，根据这个人的姿势和手部姿态判断出他是处于接棒球的状态，因此可以推断出蓝色区域为棒球手套。而使用基于卷积网络的方法进行识别，除了在更大的感知野内获得的层次化特征之外，无法通过图像的语义信息来准确推理出蓝色区域的目标。


    文献[\[15\]](../Text/chapter112.xhtml#jj-15)为了解决上述局限，提出了一个融合了空间信息和语义信息的迭代式视觉推理系统。整个系统有两个核心模块，一个是在卷积网络的基础上引入了记忆机制的局部推理模块；另一个是融合了空间和语义信息的全局推理模块。整体的推理框架如图10-5所示。


    ![](Images/10a4.jpg)


    图10-4　蓝色框内的目标是什么？^([\[1\]](#chapter110.xhtml#ch1_back))


    ![](Images/10a5.jpg)


    图10-5　推理框架结构图^([\[2\]](#chapter110.xhtml#ch2_back))


    局部推理模块以记忆模块S作为输入进行预测，其中记忆模块S用来存储通过卷积网络提取的目标区域的位置特征和图像特征。


    全局推理模块主要基于空间特征和语义特征进行推理。空间指的是建立位置上不相邻区域的联系；语义指的是利用外部的知识库建立类别与类别之间的联系。为了综合利用这两个方面的信息，采用GNN作为推理模块。图的构成使用了两种类型的节点，一个是由所有的区域组成的区域节点；另一种是以所有区域对应的实体作为节点。节点与节点之间的边通过如下3种关系建立，第一种是区域与区域之间通过它们的距离关系进行关联，边的权重由像素距离的核函数归一化值决定；另外对于有重叠的区域，通过IoU值建立它们之间的关系。第二种是区域与实体之间的关系，根据对区域预测的概率分布（softmax输出），建立与实体之间的关系，边的权重为对应的概率值。第三种是实体与实体之间的关系，这个关系来自外部的知识图谱，可以将多种实体关系考虑进来，比如类别从属关系、部件从属关系（腿和椅子）、单复数关系、水平对称关系等。


    以上面构建的图为基础，使用GNN来进行推理，区域节点的特征来自卷积网络，实体节点的特征来自预训练的词向量。GNN推理是为了融合空间信息和语义信息对区域进行推理，因此使用了两条推理路径。一条是区域—区域，它聚合多个区域的特征以得到空间特征；另一条是区域—实体—实体，它分为两步，先将区域的特征聚合到实体节点并与实体节点特征融合，然后对不同类型的实体关系进行聚合得到实体的特征，这对应着语义关系。为了得到区域的最终特征，通过实体—区域的关系，将实体携带的语义特征聚合到区域节点上，并与第一条推理路径中得到的空间特征进行融合。整个过程如图10-6所示。


    ![](Images/10a6.jpg)


    图10-6　全局推理模块示意图^([\[3\]](#chapter110.xhtml#ch3_back))


    推理通常不是一步到位的，而是迭代式的。为了将前一轮的信息传递到后一轮，可以使用记忆模块，局部推理和全局推理使用不同的记忆模块S和M，每次迭代得到的输出用于更新记忆模块。另外，模型还引入了注意力机制，以便融合当前预测值与来自其他迭代过程产生的预测值。模型在不同的训练数据集上进行试验，将识别效果对比卷积神经网络提升了3.7%～8.4%。


    [\[1\]](#chapter110.xhtml#ch1) 图片来源：https://es.calcuworld.com/cuantos/cuanto-dura-un-partido-de-beisbol/。


    [\[2\]](#chapter110.xhtml#ch2) Chen X，Li L J，Fei-Fei L，et al.Iterative visual
    reasoning beyond convolutions\[C\]//Proceedings of the IEEE Conference on Computer
    Vision and Pattern Recognition.2018：7239-7248.


    [\[3\]](#chapter110.xhtml#ch3) Chen X，Li L J，Fei-Fei L，et al.Iterative visual
    reasoning beyond convolutions\[C\]//Proceedings of the IEEE Conference on Computer
    Vision and Pattern Recognition.2018：7239-7248.


    ## 10.3　GNN的未来展望


    作为一种新兴的神经网络技术，GNN的快速发展离不开近些年深度学习在各方面的重要积淀。而与GNN的结合，可以助力深度学习系统拓展其在更广领域、更多层面的场景任务中获得成功。我们非常确信在未来几年，GNN会在越来越多的场景下得到应用。


    接下来，我们从3个方面总结对GNN的未来研究的展望。当然以下观点仅供参考，读者朋友也应有自己的思考。


    1.充分适应复杂多变的图数据


    一方面，图数据的类型极其繁杂，如关系经常发生变化的动态图、一条边连接两个以上节点的超图，这些图数据的结构更加复杂，需要GNN进行针对性的设计。另一方面，GNN针对异构图与属性图还需要进行更充分的研究与设计，以学习其中丰富多样的语义信息。


    2.在更多推理任务上的应用与学习机制的研究改进


    推理任务已经成为当下深度学习系统面临的核心任务之一，虽然GNN已经展现出了在相关任务上的独特优势，但是内在的作用机理还有待充分研究。通过对其学习机制的不断完善与发展，来促使GNN在更多、更复杂的推理任务中获得更好的表现。


    3.对超大规模图建模的支持


    现有的大多数图神经网络都无法扩展到规模巨大的图数据中去。GNN的训练是一种协同的学习方式，在一次迭代中，节点固有的上下文会导致其状态的更新需要涉及大量邻居节点的隐藏状态，复杂度极高，难以应用小批量训练方式提升计算效率。尽管已有研究提出基于抽样与分区的手段来解决这类问题，但这些手段仍不足以扩展到工业级超大规模属性图的学习中去。


