    # Chapter 2 Neural Network Fundamentals


    In recent years, with the improvement of algorithms, the explosion of data volume,
    and the enhancement of computing power, machine learning and deep learning have
    developed rapidly. This chapter starts from the basic concepts of machine learning,
    introducing what machine learning is and how to obtain machine learning models.
    Then it introduces the basic building units of deep learning models—the neuron
    model and the Multi-Layer Perceptron (MLP) model built upon it. We will also take
    the Multi-Layer Perceptron as an example to introduce the backpropagation algorithm
    and optimization methods in deep learning.


    ## 2.1 Basic Concepts of Machine Learning


    ### 2.1.1 Classification of Machine Learning


    Machine learning is an interdisciplinary field involving probability theory, statistics,
    approximation theory, convex analysis, computational complexity theory, and many
    other disciplines. Machine learning theory mainly focuses on designing and analyzing
    algorithms that allow computers to automatically "learn". In layman''s terms,
    machine learning enables computers to mine valuable information from data.


    From different dimensions, machine learning can have different classifications.
    Below we briefly introduce several common classification methods.


    Based on whether training data has labels, machine learning can be divided into
    **Supervised Learning**, **Semi-Supervised Learning**, and **Unsupervised Learning**.


    **Supervised Learning**: Refers to the scenario where every sample in the training
    data has a label. Labels guide the model training to learn discriminative features,
    thereby enabling prediction on unknown samples. For example, in the ImageNet image
    classification competition, a model is trained using existing labels for each
    image, allowing the model to predict unknown images and obtain corresponding classification
    results.


    **Unsupervised Learning**: Refers to the scenario where training data has no labels
    at all. Algorithms discover constraint relationships between data, such as associations,
    distance relationships, etc. A typical unsupervised algorithm is clustering, which
    groups samples with similar "distances" together based on certain metrics.


    **Semi-Supervised Learning**: Refers to a learning method between supervised and
    unsupervised learning. Its training data contains both labeled and unlabeled data.
    Assuming labeled and unlabeled data are sampled from the same distribution, the
    unlabeled data contains some information related to the data distribution, which
    can serve as a supplement to labeled data. This situation is very common in reality.
    For example, in the internet industry, massive amounts of data are generated daily.
    Some of this data may carry labels, but more data is unlabeled. If manual labeling
    is relied upon for these unlabeled data, the cost is considerable, while semi-supervised
    learning can provide some solutions.


    From the perspective of algorithm output form, it can be divided into classification
    problems and regression problems, both of which belong to the category of supervised
    learning.

