    \ Neural Networks\\[J\\].arXiv preprint arXiv：1905.10990，2019.\n\n# 第9章　基于GNN的图表示学习\n\
    \n图数据有着复杂的结构、多样化的属性类型，以及多层面的学习任务，要想充分利用图数据的优势，就需要一种高效的图数据表示方法。与表示学习在数据学习中的重要位置一样，图表示学习也成了图学习领域中十分热门的研究课题。\n\
    \n作为近几年深度学习的新兴领域，GNN在多个图数据的相关任务上都取得了不俗的成绩，这也显示出了其强大的表示学习能力。毫无疑问，GNN的出现给图表示学习带来了新的建模方法。表示学习本身具有十分丰富的内涵和外延，在建模方法、学习方式、学习目标、学习任务等方面都有所涵盖。这些内容在前面章节中均有阐述，所以本章我们主要就基于GNN的无监督图表示学习进行讲解。这也是出于另一方面的考虑，在实际的应用场景里面，大量的数据标签往往具有很高的获取门槛，研究如何对图数据进行高效的无监督表示学习具有十分重要的价值。\n\
    \n本章内容分3节，9.1节主要从3种建模方法上对图表示学习进行对比阐述。9.2节分别从两类无监督学习目标—重构损失与对比损失，对基于GNN的无监督表示学习进行阐述。9.3节为应用实战，介绍了图数据表示学习的一个典型应用场景—推荐系统。\n\
    \n## 9.1　图表示学习\n\n在前面我们通常用邻接矩阵A∈R^(N×N)表示图的结构信息，一般来说，A是一个高维且稀疏的矩阵，如果我们直接用A去表示图数据，那么构筑于A之上的机器学习模型将难以适应，相关的任务学习难以高效。因此，我们需要实现一种对图数据更加高效的表示方法。而图表示学习的主要目标正是将图数据转化成低维稠密的向量化表示，同时确保图数据的某些性质在向量空间中也能够得到对应。这里图数据的表示可以是节点层面的，也可以是全图层面的，但是作为图数据的基本构成元素，节点的表示学习一直是图表示学习的主要对象。一种图数据的表示如果能够包含丰富的语义信息，那么下游的相关任务，如点分类、边预测、图分类等，就都能得到相当优秀的输入特征，通常在这种情况下，我们直接选用线性分类器对任务进行学习。图9-1所示为图表示学习的过程：\n\
    \n![](Images/9a1.jpg)\n\n图9-1　图表示学习的过程"
