    ## 6.4　GCN的问题—过平滑


    引文[7][8]都指出了GCN模型无法像视觉任务中的CNN模型一样堆叠很深，一旦使用多层GCN进行学习，相关的任务效果就会急剧下降。这使得在某些场景中，GCN的学习能力将非常有限。


    在引文[1]中，作者在`Cora`数据集上做了一个实验，直观地展示了多层GCN所遇到的这个问题，如图6-11所示。


    ![](Images/6a11.jpg)


    图6-11是`Cora`数据集分别经过一个1至5层的GCN后节点的表示向量的散点图，数据的原始输入是16维，最后模型的输出层是2维。观察该图，我们可以发现，在一层GCN模型下，两类节点并不能很好地区分，在二层GCN模型下，两类节点已经能够很好地区分，如果继续加深模型的层数，两类节点会逐渐混合在一起，区分度将大大降低。


    通过上面这个例子，我们可以发现，在使用多层GCN之后，节点的区分性变得越来越差，节点的表示向量趋于一致，这使得相应的学习任务变得更加困难。我们将这个现象称为多层GCN的过平滑（`Over-Smooth`）问题。


    在6.3节中我们论证过，GCN相当于对输入信号做了一个低通滤波的操作，这会使信号变得更加平滑，这也是GCN模型的一个内在优势。但是，过犹不及，多次执行这类对信号不断平滑的操作之后，信号会越来越趋同，也就丧失了节点特征的多样性。下面我们分别从频域和空域视角去理解过平滑问题。


    ### 1. 频域视角


    事实上，我们可以从GCN的频率响应函数`![](Images/124-i.jpg)`中更清楚地看到这一点。


    `![](Images/124-2-i.jpg)`


    由于`![](Images/124-3-i.jpg)`，且当且仅当`i=1`时，`![](Images/124-4-i.jpg)`，由于其他的特征值都大于0（这里假设图是全连通图，仅存在一个特征值为0），因此取极限之后的结果为：


    `![](Images/124-5-i.jpg)`


    如果设图信号为`x`，则有：


    `![](Images/124-6-i.jpg)`


    其中`v[1]`是`![](Images/124-7-i.jpg)`的最小频率`![](Images/124-8-i.jpg)`对应的特征向量，`![](Images/124-9-i.jpg)`表示信号`x`在对应频率`![](Images/124-10-i.jpg)`的傅里叶系数。


    由于`![](Images/125-i.jpg)`，即`![](Images/125-2-i.jpg)`（这里使用到了一个性质—拉普拉斯矩阵`L`存在值全为1的特征向量，其对应特征值为0）。


    因此，`![](Images/125-3-i.jpg)`是`![](Images/125-4-i.jpg)`在`![](Images/125-5-i.jpg)`处的特征向量，该向量是一个处处相等的向量。所以，如果对一个图信号不断地执行平滑操作，图信号最后就会变得处处相等，也就完全没有可区分性了。


    ### 2. 空域视角


    在引文[2]中，作者从空域角度解释了为什么多层GCN会出现效果不好的现象。从空域来看，GCN的本质是在聚合邻居信息，对于图中的任意节点而言，节点的特征每更新一次，就多聚合了更高一阶邻居节点的信息。如果我们把最高邻居节点的阶数称为该节点的聚合半径，我们可以发现，随着GCN层数的增加，节点的聚合半径也在增长，一旦到达某个阈值，该节点可覆盖的节点几乎与全图节点一致。同时，如果层数足够多，每个节点能覆盖到的节点都会收敛到全图节点，这与哪个节点是无关的。这种情况的出现，会大大降低每个节点的局部网络结构的多样性，对于节点自身特征的学习十分不利。


    图6-12所示为对方块节点的邻居信息进行聚合的结果，不同的是a图中的方块节点处于图的中心，而b图中的方块节点处于图的边缘。在4层GCN之后，a、b两图的方块节点的聚合半径虽然一致，但是覆盖的节点却是非常不一样的，如图中的蓝色节点所示。如果继续增加一层GCN，b图中的节点可覆盖的节点会迅速扩大，从而覆盖图中中心区域的节点，如c图中的蓝色节点所示。这种突变现象导致两个方块节点聚合的节点网络趋于一致，模型对于a图、b图中两个节点的区分将会变得十分困难。


    ![](Images/6a12.jpg)


    关于如何应对过平滑，上文基于聚合半径与模型层数的关系，提出了自适应性聚合半径的学习机制，其实现的方式十分直观，就是通过增加跳跃连接来聚合模型的每层节点的输出，聚合后的节点特征拥有混合性的聚合半径，上层任务可对其进行选择性的监督学习，这样对于任意一个节点而言，既不会因为聚合半径过大而出现过平滑的问题，也不会因为聚合半径过小，使得节点的结构信息不能充分学习（见图6-13）。


    ![](Images/6a13.jpg)


    图6-13说明了这种层级聚合的学习机制，在图6-13中，4层图模型的输出都会通过跳跃连接与最终的聚合层相连，聚合操作可以取如拼接、平均池化、最大池化等，聚合层的输出会作为整个模型的输出送到相应的监督任务中进行学习。


    另一种方法是回到频率视角去调节图滤波器的值，在引文[9]中，使用了重新分配权重的方式来增加`![](Images/127-i.jpg)`中节点自连接的权重：


    `![](Images/127-2-i.jpg)`


    如公式（6.7）所示，可以通过调节`p`的值对节点自身的权重进行重新分配。当`p`接近1时，模型趋向于不使用自身的信息，从频域来看，这加速了模型低通滤波的效应；当`p`接近0时，模型趋向于不聚合邻居的信息，从频域来看，这减缓了模型低通滤波的效应。


    ### 参考文献


    [1] Li Q, Han Z, Wu X M. Deeper insights into graph convolutional networks for
    semi-supervised learning[C]//Thirty-Second AAAI Conference on Artificial Intelligence.
    2018.

