    ### 3.4.3 ResNet


    The proposal of the Residual Network (`ResNet`) [¹³] was another major leap for
    deep learning. It achieved excellent results on ILSVRC 2015 and COCO 2015, and
    once again rewrote the history of ImageNet. It was the first to increase the depth
    of deep networks to hundreds of layers and train them successfully; many subsequent
    network structures were inspired by it. `ResNet` can be considered one of the
    most popular network architectures currently.


    Network depth is crucial for model performance. As the number of network layers
    increases, the model can extract more complex feature patterns, so intuitively
    we might think the deeper the model, the better the effect. However, experiments
    show that as the network deepens, the training accuracy actually decreases, as
    shown in Figure 3-19. On both the training set and test set, the 56-layer network
    performs worse than the 20-layer network. This is not because the model is overfitting;
    this problem is called the **degradation problem**, and it is caused by optimization
    difficulty.


    ![](img/3a19.jpg)


    Figure 3-19 Error rates of 20-layer and 56-layer networks on CIFAR-10 [¹]


    The Residual Network improves the network structure to solve the above problem.
    It introduces a direct path between the input and output of a block, which is
    called a **skip connection**. A typical residual block is shown in Figure 3-20.


    The input is `H[i-1]`, the output is `H[i]`. Assuming the transformations such
    as convolutions are represented by `F`, the relationship between input and output
    is shown in Equation (3.13):


    ![](img/060-2-i.jpg)

    ![](img/3a20.jpg)


    Figure 3-20 `ResNet` network model


    The introduction of skip connections makes information flow more smoothly, manifested
    in two aspects: first, during forward propagation, the input and output information
    are fused, enabling more effective utilization of features; second, during backpropagation,
    a portion of the gradient always backpropagates to the input through the skip
    connection, which alleviates the **vanishing gradient problem**.


    Furthermore, research [¹⁴] shows that deep residual network structures can be
    viewed as ensembles of relatively shallow structures. Research [¹⁵] indicates
    that networks with skip connections have smoother loss function surfaces, making
    training optimization easier and resulting in models with better generalization
    performance, as shown in Figure 3-21.


    ![](img/3a21.jpg)


    Figure 3-21 Loss landscape with skip connection structure [²]


    Based on the idea of residual networks, many improved models have emerged, such
    as `DenseNet` [¹⁶] which takes skip connections to the extreme, and `Inception-ResNet`
    [¹⁷] which fuses residual structures.


    [¹³]: He K, Zhang X, Ren S, et al. Deep residual learning for image recognition
    [C] // Proceedings of the IEEE conference on computer vision and pattern recognition.
    2016: 770-778.

    [¹⁴]: Veit A, Wilber M J, Belongie S. Residual networks behave like ensembles
