    # 第5章　图信号处理与图卷积神经网络


    图信号处理（Graph Signal Processing，GSP）[^(\[1\])](../Text/chapter65.xhtml#ee-1)是离散信号处理（Discrete
    Signal Processing，DSP）理论在图信号领域的应用，其通过对傅里叶变换、滤波等信号处理基本概念的迁移，来研究对图信号的压缩、变换、重构等信号处理的基础任务。


    图信号处理与图卷积模型密不可分：一方面，理解图信号处理对于了解图卷积模型的定义和演变有十分重要的帮助；一方面，图信号处理也为图卷积模型的理论研究提供了十分实用的工具。


    本章的脉络十分自然，我们将看到图信号处理的基本理论是如何延伸到图卷积神经网络中去的。首先，我们给出了图信号的基本定义，紧接着介绍图傅里叶变换，并由此引出图信号频率的定义。然后，我们介绍图信号上的滤波操作，紧接着介绍卷积滤波与图卷积模型的关系。其中还穿插了比较重要的两部分内容：一是对图信号的频域与空域的理解；二是对图信号处理的频域与空域的理解。另外，由于本章的定义和公式较多，为了帮助读者更好地理解这些内容，在本章的第一节和最后一节分别准备了矩阵计算的前置知识和图卷积神经网络的实战内容。


