    ## Chapter 1　Overview of Graphs


    A **Graph** is an object with extensive connotations. In mathematics, graphs are
    the primary object of study in graph theory; in computer engineering, a graph
    is a common data structure; in data science, graphs are widely used to describe
    various types of relational data. Many graph learning theories focus on tasks
    related to graph data.


    Typically, graphs are used to represent relationships between objects. This corresponds
    to many real-world systems in life, such as chemical molecules, communication
    networks, social networks, etc. In fact, any system containing binary relations
    can be described using a graph. Therefore, researching and applying graph-related
    theories has significant practical significance.


    In this chapter, we mainly provide a basic introduction to graph-related concepts,
    including the basic definition of graphs, storage representation methods and traversal
    methods of graphs in computers, graph data and its common application scenarios,
    and a brief description of deep learning on graph data.


    ### 1.1　Basic Definition of Graphs


    In mathematics, a graph consists of **Vertices** (or **Nodes**) and **Edges**
    connecting the vertices. Vertices represent the objects of study, and edges represent
    specific relationships between two objects.


    A graph can be represented as a set of vertices and edges, denoted as `G=(V,E)`,
    where `V` is the vertex set and `E` is the edge set. Simultaneously, we denote
    the number of vertices of graph `G` as `N` and the number of edges as `M` (unless
    otherwise specified, graphs in this book are represented in this way). An edge
    connecting vertices `v[i]` and `v[j] ∈ V` is denoted as `(v[i],v[j])` or `e[ij]`.
    As shown in Figure 1-1, `V={v[1],v[2],v[3],v[4],v[5]}`, `E={(v[1],v[2]),(v[1],v[3]),(v[2],v[4]),(v[2],v[3]),(v[3],v[4]),(v[4],v[5])}`.


    ![](img/1a1.jpg)


    Figure 1-1　Definition of Graph `G`


    #### 1.1.1　Basic Types of Graphs


    **1. Directed and Undirected Graphs**


    If the edges in a graph have directionality, such edges are called **directed
    edges** `e[ij]=<v[i],v[j]>`, where `v[i]` is the start point (tail) of this directed
    edge, and `v[j]` is the end point (head). A graph containing directed edges is
    called a **directed graph**, as shown in Figure 1-2. Corresponding to the directed
    graph is the **undirected graph**. Edges in an undirected graph are all undirected.
    We can consider an undirected edge to be symmetric, containing both directions
    simultaneously: `e[ij]=<v[i],v[j]>=<v[j],v[i]>=e[ji]`.


    ![](img/1a2.jpg)


    Figure 1-2　Directed Graph


    **2. Unweighted and Weighted Graphs**


    If each edge in a graph has a corresponding real number, we call such a graph
    a **weighted graph**, as shown in Figure 1-3. This real number is called the **weight**
    on the corresponding edge. In practical scenarios, weights can represent the distance
    or transportation cost between two places. Generally, we are accustomed to abstracting
    weights as the connection strength between two vertices. The opposite is an **unweighted
    graph**; we can consider the weights on all edges of an unweighted graph to be
    the same.


    ![](img/1a3.jpg)


    Figure 1-3　Weighted Graph


    **3. Connected and Disconnected Graphs**


    If there are isolated vertices in a graph that have no edges connected to them,
    such a graph is called a **disconnected graph**, as shown in Figure 1-4. Conversely,
    a graph without isolated vertices is called a **connected graph**.


    **4. Bipartite Graphs**


    A **bipartite graph** is a special class of graphs. We split the vertex set `V`
    in `G` into two subsets `A` and `B`. If for any edge `e[ij]` in the graph, `v[i]∈A`,
    `v[j]∈B` or `v[i]∈B`, `v[j]∈A` holds, then graph `G` is called a bipartite graph,
    as shown in Figure 1-5. A bipartite graph is a very common graph data object that
    describes the interaction relationships between two types of objects, such as
    users and items, authors and papers.


    ![](img/1a4.jpg)


    Figure 1-4　Disconnected Graph


    ![](img/1a5.jpg)


    Figure 1-5　Bipartite Graph


    #### 1.1.2　Neighbors and Degree


    If there exists an edge connecting vertices `v[i]` and `v[j]`, then `v[j]` is
    called a **neighbor** of `v[i]`, and vice versa. We denote the set of all neighbors
    of `v[i]` as `N(v[i])`, i.e.:


    ![](img/004-i.jpg)


    The number of edges having `v[i]` as an endpoint is called the **Degree** of `v[i]`,
    denoted as `deg(v[i])`:


    ![](img/004-2-i.jpg)


    In a graph, the sum of the degrees of all nodes has the following relationship
    with the number of edges:


    ![](img/004-3-i.jpg)


    In a directed graph, we simultaneously define **Outdegree** and **Indegree**.
    The degree of a vertex equals the sum of its outdegree and indegree. Among them,
    the outdegree of vertex `v[i]` is the number of directed edges starting from `v[i]`,
    and the indegree of vertex `v[i]` is the number of directed edges ending at `v[i]`.


    #### 1.1.3　Subgraphs and Paths


    If the vertex set and edge set of graph `G''=(V'',E'')` are subsets of the vertex
    set and edge set of another graph `G=(V,E)` respectively, i.e., `V''⊆V` and `E''⊆E`,
    then graph `G''` is called a **subgraph** of graph `G`.


    In graph `G=(V,E)`, if starting from vertex `v[i]`, along some edges passing through
    some vertices `v[k1],v[k2],...,v[kn]`, reaching vertex `v[j]`, then the edge sequence
    `e[i,k1],e[k1,k2],...,e[kn,j]` is called a **path** (also called a walk) from
    vertex `v[i]` to vertex `v[j]`, where `e[...]` are edges in graph `G`.


    **Path Length**: The number of edges in a path is usually called the length of
    the path `L(P[ij])=|P[ij]|`.


    **Vertex Distance**: If there exists at least one path from vertex `v[i]` to vertex
    `v[j]`, the distance from `v[i]` to `v[j]` is defined as:


    ![](img/004-7-i.jpg)


    That is, the distance between two vertices is determined by the length of their
    shortest path. We set `d(v[i],v[j])=0`, meaning the distance from a node to itself
    is 0.


    **k-hop Neighbors**: If `d(v[i],v[j])=k`, we call `v[j]` a **k-hop neighbor**
    of `v[i]`.


    **k-hop Subgraph (`k-subgraph`)**: We call the **k-hop subgraph** of a vertex
    `v[i]`:


    ![](img/005-i.jpg)


    Sometimes, a k-hop subgraph is also called `k-hop`. The shaded part in Figure
    1-6 is the 2-hop subgraph of vertex `V[1]`.


    ![](img/1a6.jpg)


    Figure 1-6　2-hop Subgraph of Graph `G`


    ### 1.2　Graph Storage and Traversal


    #### 1.2.1　Adjacency Matrix and Incidence Matrix


    As a common data structure, there are many storage representation methods for
    graphs in computers. This section focuses on two methods: the **Adjacency Matrix**
    and the **Incidence Matrix**.


    Let graph `G=(V,E)`. Here we have renumbered the edges as `e[1],e[2],...,e[M]`,
    as shown in Figure 1-7. We use the adjacency matrix `A` to describe the association
    between vertices in the graph, `A∈R^(N×N)`, defined as:


    ![](img/005-2-i.jpg)


    ![](img/1a7.jpg)


    Figure 1-7　Example of Graph `G`


    When storing a graph using an adjacency matrix, we need a one-dimensional array
    to represent the vertex set and a two-dimensional array to represent the adjacency
    matrix. It is particularly noteworthy that in actual graph data, the adjacency
    matrix often contains a large number of zero values. Therefore, the sparse matrix
    format can be used to store the adjacency matrix, which can control the space
    complexity of the adjacency matrix within `O(M)`. Figure 1-8(a) shows the adjacency
    matrix storage representation of graph `G`. From this figure, it can be seen that
    the adjacency matrix of an undirected graph is symmetric along the main diagonal,
    i.e., `A[ij]=A[ji]`.


    ![](img/1a8.jpg)


    Figure 1-8　Adjacency Matrix and Incidence Matrix of Graph `G`


    Besides the adjacency matrix, we sometimes use the incidence matrix `B∈R^(N×M)`
    to describe the association between nodes and edges, defined as follows:


    ![](img/006-3-i.jpg)


    When storing a graph using an incidence matrix, we need two one-dimensional arrays
    to represent the vertex set and edge set respectively, and a two-dimensional array
    to represent the incidence matrix. Similarly, the incidence matrix can also be
    stored using a sparse matrix, because any column of `B` has only two non-zero
    values. Figure 1-8(b) shows an example of storing a graph using an incidence matrix.


    #### 1.2.2　Graph Traversal


    **Graph traversal** refers to starting from a certain vertex in the graph, visiting
    all vertices in the graph once and only once along the edges of the graph according
    to a certain search algorithm. There are two main algorithms for graph traversal:
    **Depth-First Search (DFS)** and **Breadth-First Search (BFS)**. Graph traversal
    is an important graph retrieval method, and depth-first search and breadth-first
    search provide the corresponding algorithmic foundations.


    **Depth-First Search** is a recursive algorithm with a backtracking process. Its
    algorithmic idea is: start from a certain vertex `v[i]` in the graph, depart from
    `v[i]`, and visit an arbitrary neighbor `w[1]` of it; then depart from `w[1]`,
    and visit an unvisited vertex `w[2]` among all neighbors of `w[1]`; then depart
    from `w[2]`, and visit sequentially until a vertex appears that no longer has
    unvisited neighbors. Next, backtrack one step, backtrack to the vertex just visited
    last time, and see if there are other unvisited neighbors. If so, visit that neighbor,
    and then depart from that neighbor to perform a visit similar to the previous
    one; if not, backtrack one more step for a similar visit. Repeat the above process
    until all vertices in the graph have been visited. Taking Figure 1-7 as an example,
    we can obtain the following depth-first search sequence: `v[1]→v[2]→v[4]→v[5]→v[3]`.


    **Breadth-First Search** is a hierarchical search process with no backtracking.
    Its algorithmic idea is: start from a certain vertex `v[i]` in the graph, depart
    from `v[i]`, and sequentially visit all unvisited neighbors `w[1],w[2],...,w[n]`
    of `v[i]`; then sequentially visit all still unvisited neighbors of `w[1],w[2],...,w[n]`,
    and so on, layer by layer, until all vertices in the graph have been visited.
    Taking Figure 1-7 as an example, we can obtain the following breadth-first search
    sequence: `v[1]→v[2]→v[3]→v[4]→v[5]`.


    ### 1.3　Application Scenarios of Graph Data


    We mention graphs, which often carry a theoretical color of mathematics. In actual
    data scenarios, we usually refer to graphs as **Networks**. Correspondingly, the
    two elements of a graph (vertices and edges) are also called **Nodes** and **Links**
    (or Edges), such as the familiar concepts of social networks, logistics networks,
    etc. To achieve unification and distinguish from the "network" concept in **Neural
    Networks** (although neural networks are also a kind of network), this book refers
    to network data as **graph data**.


    Graph data is a relatively complex data type with many categories. Here we introduce
    the four most important categories: **Homogeneous Graphs**, **Heterogeneous Graphs**,
    **Property Graphs**, and **Non-explicit Graphs (Graphs Constructed from Non-relational
    Data)**.


    1.  **Homogeneous Graph**: A homogeneous graph refers to a graph where there is
    only one type of node and one type of relationship (edge). A homogeneous graph
    is the most simplified case of actual graph data, such as the World Wide Web constituted
    by hyperlink relationships. The information of this type of graph data is entirely
    contained in the adjacency matrix.

    2.  **Heterogeneous Graph**: Opposite to homogeneous graphs, a heterogeneous graph
    refers to a graph where there is more than one type of node or relationship. In
    real-world scenarios, the graph data objects we usually study are multi-typed,
    and the interaction relationships between objects are also diversified. Therefore,
    heterogeneous graphs can better fit reality.

    3.  **Property Graph**: Compared to heterogeneous graphs, a property graph adds
    additional attribute information to the graph data, as shown in Figure 1-9. For
    a property graph, both nodes and relationships have **Labels** and **Properties**.
    Here, labels refer to the types of nodes or relationships, e.g., a node type is
    "User". Properties are additional descriptive information of nodes or relationships,
    e.g., a "User" node can have properties like "Name", "Registration Time", "Registration
    Address", etc. A property graph is the most common representation of industrial-grade
    graph data and can be widely applied to data expression in various business scenarios.


    ![](img/1a9.jpg)


    Figure 1-9　Property Graph


    4.  **Non-explicit Graph**: A non-explicit graph refers to data where relationships
    are not explicitly defined. It requires expressing the relationships between data
    based on certain rules or calculation methods, and then treating the data as a
    kind of graph data for study. For example, point cloud data in 3D computer vision:
    if we convert the spatial distances between nodes into relationships, the point
    cloud data becomes graph data.


    When studying diversified object systems, a graph is a very important perspective.
    In the real world, graph data has extremely wide application scenarios. Below
    we give a few examples for illustration, as shown in Figure 1-10.


    ![](img/1a10.jpg)


    Figure 1-10　Examples of Graph Data Applications[¹][¹⁹]


    **Social Networks**: Social networks are a very common type of graph data, representing
    various social relationships between individuals or organizations. Figure 1-10(a)
    shows a user follow network in an online social network: nodes are users, and
    edges are follow relationships between users. This is a typical homogeneous graph,
    generally used to study user importance ranking and related user recommendation
    problems. With the continuous deepening of mobile internet technology, more diversified
    media objects have been added to social networks, such as short texts, videos,
    etc. The heterogeneous graphs thus formed can accomplish more diversified tasks.


    **E-commerce**: E-commerce is a core business on the internet. In such scenarios,
    business data can usually be described by a user–item bipartite graph. In the
    example shown in Figure 1-10(b), nodes are divided into two categories: users
    and items. Existing relationships include browsing, collecting, purchasing, etc.
    There can be multiple relationships between a user and an item, such as both a
    collecting relationship and a purchasing relationship. Such complex data scenarios
    can be easily described by a property graph. E-commerce has spawned a well-known
    technical application—**recommender systems**. The interaction relationships between
    users and items reflect users'' shopping preferences. For example, the classic
    "beer and diapers" story: people who buy beer usually also tend to buy diapers.


    **Chemical Molecules**: Taking atoms as nodes and chemical bonds between atoms
    as edges, we can regard molecules as a type of graph data for study. The basic
    composition and internal connections of molecules determine their various physicochemical
    properties. Usually, we use them to guide research tasks for new materials and
    new drugs, as shown in Figure 1-10(c).


    **Transportation Networks**: Transportation networks have various forms. For example,
    in a subway network, each station is a node, and the connectivity between stations
    forms a graph, as shown in Figure 1-10(d). Usually, in transportation networks,
    we are more concerned with path planning related problems: such as the shortest
    path problem. Another example is taking traffic flow as an attribute of nodes
    in the network to predict future changes in traffic flow.


