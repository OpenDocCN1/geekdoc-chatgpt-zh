    从模板中我们可以直观地看到，拉普拉斯算子描述了中心像素与局部上、下、左、右四邻居像素的差异，这种性质通常被用来当作图像上的边缘检测算子。


    同理，在图信号中，拉普拉斯算子也被用来描述中心节点与邻居节点之间的信号的差异，这从式（5.7）中可以看出：


    ![](Images/085-i.jpg)


    由此可知，拉普拉斯矩阵是一个反映图信号局部平滑度的算子。更进一步来说，拉普拉斯矩阵可以让我们定义一个非常重要的二次型：


