    对于![](Images/032-4-i.jpg)，所需要的参数量为D[l]，因此相较于LeakyReLU，PReLU引入了更多的参数。另外对于维度更高的输入，比如卷积神经网络的中间层输出x∈R^(H×W×C)，不必为其中的每个元素均设置一个可训练的参数，可以在维度H和W上进行共享，这样需要的参数总量为C。


