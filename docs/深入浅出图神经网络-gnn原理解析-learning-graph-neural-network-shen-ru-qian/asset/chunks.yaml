    ## 5.4 图滤波器


    有了 5.3 节中图信号的频率定义之后，接下来我们就可以对图滤波器（Graph Filter）进行定义了。类比于离散信号处理，在图信号处理中，我们将图滤波器定义为对给定图信号的频谱中各个频率分量的强度进行增强或衰减的操作。假设图滤波器为`H∈R^(N×N)`，则`H:
