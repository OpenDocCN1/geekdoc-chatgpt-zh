  trans: "\n\n### 7.5 GraphSAGE Code Implementation\n\nIn this section, we introduce\
    \ `GraphSAGE` through code to deepen the reader's understanding of the relevant\
    \ knowledge. As introduced in Section 7.1, `GraphSAGE` includes two aspects: one\
    \ is neighbor sampling; the other is the neighbor aggregation operation.\n\n####\
    \ Neighbor Sampling Method\n\nFirst, let's look at the neighbor sampling method.\
    \ To achieve more efficient sampling, the nodes and their neighbors can be stored\
    \ together, i.e., maintaining a table mapping nodes to their corresponding neighbors.\
    \ We can implement the specific sampling operations through two functions: `sampling()`\
    \ and `multihop_sampling()`. Among them, `sampling()` performs first-order sampling,\
    \ sampling a specified number of neighbor nodes based on source nodes; `multihop_sampling()`\
    \ utilizes `sampling()` to implement multi-hop sampling functionality. As shown\
    \ in Code Listing 7-1:\n\n#### Code Listing 7-1 Multi-hop Sampling of Neighbor\
    \ Nodes\n\n```python\ndef sampling(src_nodes, sample_num, neighbor_table):\n \
    \   \"\"\"Sample a specified number of neighbor nodes based on source nodes, note\
    \ that sampling is with replacement;\n    When a node's neighbor count is less\
    \ than the sample number, duplicate nodes appear in the sampling result\n    \n\
    \    Arguments:\n        src_nodes {list, ndarray} -- List of source nodes\n \
    \       sample_num {int} -- Number of nodes to sample\n        neighbor_table\
    \ {dict} -- Mapping table from node to its neighbor nodes\n    \n    Returns:\n\
    \        ndarray -- List composed of sampling results\n    \"\"\"\n    results\
    \ = []\n    for sid in src_nodes:\n        # Sample with replacement from the\
    \ node's neighbors\n        res = np.random.choice(neighbor_table[sid], size=(sample_num,\
    \ ))\n        results.append(res)\n    return np.asarray(results).flatten()\n\n\
    \ndef multihop_sampling(src_nodes, sample_nums, neighbor_table):\n    \"\"\"Perform\
    \ multi-hop sampling based on source nodes\n    \n    Arguments:\n        src_nodes\
    \ {list, np.ndarray} -- Source node IDs\n        sample_nums {list of int} --\
    \ Number of nodes to sample at each hop\n        neighbor_table {dict} -- Mapping\
    \ from node to its neighbors\n    \n    Returns:\n        [list of ndarray] --\
    \ Sampling results for each hop\n    \"\"\"\n    sampling_result = [src_nodes]\n\
    \    for k, hopk_num in enumerate(sample_nums):\n        hopk_result = sampling(sampling_result[k],\
    \ hopk_num, neighbor_table)\n        sampling_result.append(hopk_result)\n   \
    \ return sampling_result\n```\n\nThe sampling results obtained this way are only\
    \ node IDs; it is still necessary to query the features of each node based on\
    \ the node IDs to perform aggregation operations to update features.\n\n#### Neighbor\
    \ Aggregation Operation\n\nBelow, we implement the neighbor aggregation operation\
    \ according to Equations (7.1)–(7.2). The computation process is defined in the\
    \ `forward()` function. The input `neighbor_feature` represents the features of\
    \ neighbor nodes to be aggregated, with dimensions `N[src]`×`N[neighbor]`×`D[in]`,\
    \ where `N[src]` denotes the number of source nodes, `N[neighbor]` denotes the\
    \ number of neighbor nodes, and `D[in]` denotes the input feature dimension. These\
    \ neighbor node features undergo a linear transformation to obtain hidden features,\
    \ allowing aggregation operations along the first dimension (dimension 1), including\
    \ sum, mean, and max, yielding an output of dimension `N[src]`×`D[in]`. As shown\
    \ in Code Listing 7-2:\n\n#### Code Listing 7-2 Neighbor Aggregation\n\n```python\n\
    class NeighborAggregator(nn.Module):\n    def __init__(self, input_dim, output_dim,\
    \ \n                 use_bias=False, aggr_method=\"mean\"):\n        \"\"\"Implementation\
    \ of neighbor aggregation method\n        \n        Arguments:\n        ----------\n\
    \            input_dim {int} -- Dimension of input features\n            output_dim\
    \ {int} -- Dimension of output features\n        \n        Keyword Arguments:\n\
    \        -----------------\n            use_bias {bool} -- Whether to use bias\
    \ (default: {False})\n            aggr_method {string} -- Aggregation method (default:\
    \ {mean})\n        \"\"\"\n        super(NeighborAggregator, self).__init__()\n\
    \        self.input_dim = input_dim\n        self.output_dim = output_dim\n  \
    \      self.use_bias = use_bias\n        self.aggr_method = aggr_method\n    \
    \    self.weight = nn.Parameter(torch.Tensor(input_dim, output_dim))\n       \
    \ if self.use_bias:\n            self.bias = nn.Parameter(torch.Tensor(self.output_dim))\n\
    \        self.reset_parameters()\n    \n    def reset_parameters(self):\n    \
    \    init.kaiming_uniform_(self.weight)\n        if self.use_bias:\n         \
    \   init.zeros_(self.bias)\n\n    def forward(self, neighbor_feature):\n     \
    \   if self.aggr_method == \"mean\":\n            aggr_neighbor = neighbor_feature.mean(dim=1)\n\
    \        elif self.aggr_method == \"sum\":\n            aggr_neighbor = neighbor_feature.sum(dim=1)\n\
    \        elif self.aggr_method == \"max\":\n            aggr_neighbor = neighbor_feature.max(dim=1)\n\
    \        else:\n            raise ValueError(\"Unknown aggr type, expected sum,\
    \ max, or mean, but got {}\"\n                             .format(self.aggr_method))\n\
    \        \n        neighbor_hidden = torch.matmul(aggr_neighbor, self.weight)\n\
    \        if self.use_bias:\n            neighbor_hidden += self.bias\n\n     \
    \   return neighbor_hidden\n```\n\n#### Node Feature Update\n\nBased on the neighbor\
    \ aggregation results, the features of the central node are updated. The update\
    \ method sums or concatenates the aggregated neighbor node features with the linearly\
    \ transformed central node features, then passes them through an activation function\
    \ to obtain the updated features. As shown in Code Listing 7-3:\n\n#### Code Listing\
    \ 7-3 SageGCN Definition\n\n```python\nclass SageGCN(nn.Module):\n    def __init__(self,\
    \ input_dim, hidden_dim, \n                 activation=F.relu,\n             \
    \    aggr_neighbor_method=\"mean\", \n                 aggr_hidden_method=\"sum\"\
    ):\n        super(SageGCN, self).__init__()\n        assert aggr_neighbor_method\
    \ in [\"mean\", \"sum\", \"max\"]\n        assert aggr_hidden_method in [\"sum\"\
    , \"concat\"]\n        self.aggr_neighbor = aggr_neighbor_method\n        self.aggr_hidden\
    \ = aggr_hidden_method\n        self.activation = activation\n        self.aggregator\
    \ = NeighborAggregator(input_dim, hidden_dim,\n                              \
    \              aggr_method=aggr_neighbor_method)\n        self.weight = nn.Parameter(torch.Tensor(input_dim,\
    \ hidden_dim))\n    \n    def reset_parameters(self):\n        init.kaiming_uniform_(self.weight)\n\
    \n    def forward(self, src_node_features, neighbor_node_features):\n        neighbor_hidden\
    \ = self.aggregator(neighbor_node_features)\n        self_hidden = torch.matmul(src_node_features,\
    \ self.weight)\n        \n        if self.aggr_hidden == \"sum\":\n          \
    \  hidden = self_hidden + neighbor_hidden\n        elif self.aggr_hidden == \"\
    concat\":\n            hidden = torch.cat([self_hidden, neighbor_hidden], dim=1)\n\
    \        else:\n            raise ValueError(\"Expected sum or concat, got {}\"\
    \n                             .format(self.aggr_hidden))\n        if self.activation:\n\
    \            return self.activation(hidden)\n        else:\n            return\
    \ hidden\n```\n\n#### GraphSage Model Example\n\nBased on the previously defined\
    \ sampling and node feature update methods, the method for computing node embeddings\
    \ introduced in Section 7.1.3 can be implemented. Below, a two-layer model is\
    \ defined with 64 hidden layer nodes. Assuming the number of sampled nodes per\
    \ hop is 10, the computation of the central node's output can be implemented with\
    \ the following code. The parameter `node_features_list` passed during forward\
    \ propagation is a list where the 0th element represents the source node features,\
    \ and subsequent elements represent the node features obtained from each hop of\
    \ sampling. As shown in Code Listing 7-4:\n\n#### Code Listing 7-4 GraphSage Model\
    \ Example\n\n```python\nclass GraphSage(nn.Module):\n    def __init__(self, input_dim,\
    \ hidden_dim=[64, 64], \n                 num_neighbors_list=[10, 10]):\n    \
    \    super(GraphSage, self).__init__()\n        self.input_dim = input_dim\n \
    \       self.num_neighbors_list = num_neighbors_list\n        self.num_layers\
    \ = len(num_neighbors_list)\n        self.gcn = []\n        self.gcn.append(SageGCN(input_dim,\
    \ hidden_dim[0]))\n        self.gcn.append(SageGCN(hidden_dim[0], hidden_dim[1],\
    \ activation=None))\n    \n    def forward(self, node_features_list):\n      \
    \  hidden = node_features_list\n        for l in range(self.num_layers):\n   \
    \         next_hidden = []\n            gcn = self.gcn[l]\n            for hop\
    \ in range(self.num_layers - l):\n                src_node_features = hidden[hop]\n\
    \                src_node_num = len(src_node_features)\n                neighbor_node_features\
    \ = hidden[hop + 1] \\\n                    .view(src_node_num, self.num_neighbors_list[hop],\
    \ -1)\n                h = gcn(src_node_features, neighbor_node_features)\n  \
    \              next_hidden.append(h)\n            hidden = next_hidden\n     \
    \   return hidden[0]\n```\n\n## 7.6 References\n\n[[1]](../Text/chapter73.xhtml#g1)　Hamilton\
    \ W，Ying Z，Leskovec J.Inductive representation learning on large graphs[C]//Advances\
