    # 第3章　卷积神经网络


    卷积神经网络（Convolutional Neural Network，CNN或ConvNet）是一种具有局部连接、权值共享等特点的深层前馈神经网络，在图像和视频分析领域，比如图像分类、目标检测、图像分割等各种视觉任务上取得了显著的效果，是目前应用最广泛的模型之一。


    ## 3.1　卷积与池化


    卷积与池化是卷积神经网络中的两个核心操作，大多数的神经网络结构都是将它们进行组合而得到的。本节将详细阐述卷积的来源和原理，以及池化的基本概念。


    ### 3.1.1　信号处理中的卷积


    卷积一词源于信号处理领域，它是一项广泛应用于信号处理、图像处理以及其他工程科学领域的技术。卷积的一个典型应用是：针对某个线性时不变的系统，给定输入信号f（τ）和系统响应g（τ），求系统的输出。


    卷积的数学定义如式（3.1）所示：


    ![](Images/040-i.jpg)


    如果根据图3-1来直观地理解这个计算过程，就是函数g（τ）经过翻转和平移t后，得到g（t–τ），再求与函数f（τ）乘积的积分。


    ![](Images/3a1.jpg)


    图3-1　卷积的过程


    1.图像中的卷积


    我们以图像为例来直观地理解卷积。计算机中的图像通常都是按照像素点以离散的形式存储的，可以用一个二维或者三维的矩阵来表示。假设对于一个二维的图像X∈R^(H×W)，卷积核为G∈R^(k×k)，通常k为奇数，二维离散卷积的计算方式如式（3.2）所示：


    ![](Images/040-3-i.jpg)


    直观理解上述卷积过程，就是先将卷积核旋转180°，然后在输入中的对应位置取出一个大小为k×k的区域，与旋转后的卷积核求内积，得到对应位置的输出。


    在传统的图像处理中，卷积核通常是人为设定的，不同的卷积核可以提取输入中的某种特征，得到不同的输出。图3-2展示了两种不同的卷积核Sobel和Laplacian，它们都可以用于提取图像的边缘，但Laplacian是一个二阶的算子，而Sobel是一个一阶的算子，因此应用它们得到的边缘检测效果有明显的差异。也就是说，不同的卷积核可以提取到不一样的特征。


    ![](Images/3a2.jpg)


    图3-2　使用卷积进行图像边缘检测


    2.卷积的意义


    在信号处理中，卷积有一个很重要的定理—卷积定理。这个定理应用非常广泛，在信号处理中有着举足轻重的地位。它的意义在于可以将时域中复杂的卷积运算转换为频域中简单的相乘运算，即


    ![](Images/041-2-i.jpg)


    要理解卷积定理，还需要先知道傅里叶变换。傅里叶变换是将时域中的数据转换到频域中的一种方法，它将函数分解为一系列不同频率的三角函数的叠加，可以将它理解为从另一个维度去观察数据。曾有人这样比喻傅里叶变换：如果把图像比作一道做好的菜，那么傅里叶变换可以找出这道菜的具体配料及各种配料的用量，不管这道菜的具体制作过程如何，它都可以清晰地分辨出来。


    将图像和卷积核都变换到频域中，变换后，卷积核作为一个滤波器，对变换后的频域图像进行处理，当卷积核对应的滤波器是一个低通滤波器时，进行图像处理时会过滤掉一些较高的频率，如果将经过滤波器后的频域图像变换回像素空间，我们就会看到一些细节丢失了，这是因为高频对应着剧烈变化的区域，也就是图像的边缘、细节等。


    ### 3.1.2　深度学习中的卷积操作


    深度学习中的卷积操作与信号处理中的卷积概念稍有不同，本节将用单通道卷积为例介绍卷积的计算过程，然后将其扩展到多通道卷积，它是卷积网络的基础。


    1.单通道卷积


    先以单通道的输入为例介绍深度学习中使用的卷积，与式（3.2）的定义稍有不同，在深度学习中，卷积核不需要进行显式翻转，如式（3.4）所示，这个定义在信号处理中称为互相关，但是由于卷积网络中的卷积核是通过自动学习得到的，因此这样的定义并不会给输出带来影响，本书后面的内容都是使用这种定义。


    ![](Images/042-i.jpg)


    下面以一个具体的例子来介绍该过程。如图3-3所示，假设输入X是一个5×5大小的矩阵，与一个大小为3×3的卷积核进行卷积计算，得到输出结果。以X的第1行第1列的元素为中心，计算出它对应的结果，如式（3.5）所示：


    ![](Images/042-2-i.jpg)


    图像处理中使用的卷积核是人工确定的，深度学习中的卷积核参数是可训练的，通过使用第2章中介绍的反向传播和优化算法，可以动态地调节卷积核参数，3.2节中将详细讨论这个问题。


    如3.1节中所介绍的，每个卷积核提取输入的某种特征，为了增加特征的丰富程度，我们常常会使用多个卷积核，即![](Images/042-3-i.jpg)，将输入与每个卷积核得到的多个结果拼接起来。对于以X[m，n]为中心的局部区域，卷积得到的是向量H[m，n]\=\[H[m，n，0]，H[m，n，1]，…，H[m，n，C''–1]\]，其中的每一个元素都是与对应的卷积核计算得到的结果。将结果拼接起来，卷积核可以用一个三维的张量表示，即G∈R^(k×k×C'')，输出结果为H∈R^(H''×W''×C'')，我们称卷积得到的输出为特征图（feature
    map）。


    ![](Images/3a3.jpg)


    图3-3　单通道卷积示意图


    在图3-3所示的例子中，输入维度在卷积之后减小了，这个问题是由输入的边界导致的，卷积的起始位置无法取到输入的每一个位置。这会带来以下两个问题：


    ·当进行多次卷积运算后，输出的尺寸会越来越小；


    ·越是边缘的像素点，对于输出的影响越小，因为卷积运算在移动到边缘的时候就结束了。中间的像素点会参与多次计算，但是边缘的像素点可能只会参与一次运算，这就导致了边缘信息的丢失。


    为了解决上述问题，通常对边缘使用0值进行填充（padding），使得边缘处的像素值也能进行计算，从而使得输入维度与输出维度保持一致。填充值的大小指的是进行填充的数量，如padding=1，表示在输入的外层填充一圈0，如图3-4中的a图所示。这样输入的维度实际上变成了（W+2，s+2）。一般来说，当padding=p时，输入的维度实际上变成了（W+2P，H+2P）。


    为了让卷积之后的特征图与输入的长和宽保持一致，需要填充多少0值呢？0值的多少实际上与卷积核的形状相关，对于长和宽都为k的卷积核，需要取P=k/2」，方能使得输入的形状与输出的长宽一致。


    输出的特征图的大小不仅仅与padding有关，还与卷积的方式有关。上面讨论的都是标准的卷积操作，也就是输入中的每个位置都参与计算，有时不必对每个位置进行计算，可以每隔几个位置计算一次，这个间隔称为步长（stride），比如图3-4中的b图就是一个步长为2的卷积示意图。


    ![](Images/3a4.jpg)


    图3-4　Padding和stride示意图


    2.多通道卷积


