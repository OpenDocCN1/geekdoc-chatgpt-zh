    第三层：卷积层，卷积核大小为5×5，输出256个特征图，因此卷积核的维度为R^(5×5×96×256)，滑动步长stride=1，填充padding=2，输出的特征图为H^(（3）)∈R^(27×27×96)。同样，卷积之后使用ReLU激活函数。


    第四层：最大值池化，窗口大小为3×3，步长为2，输出为H^(（4）)∈R^(13×13×256)。


    第五到第七层：都是卷积层，其中卷积核大小为3×3，输出的特征图分别为384、384、256，滑动步长stride=1，填充padding=1，因此第七层输出H^(（7）)∈R^(13×13×256)。同之前的结构，卷积之后都使用ReLU激活函数。


    第八层：池化层，窗口大小为3×3，步长为2，输出为H^(（8）)∈R^(6×6×256)。


    最后三层：全连接层，将卷积的输出H^(（8）)∈R^(6×6×256)展平，得到全连接层的输入维度为R^(9216)，三层全连接的神经元个数为4096、4096、1000。最终得到1000维的输出用于图像分类。


    ![](Images/3a7.jpg)


    图3-7　AlexNet结构图^([\[1\]](#chapter33.xhtml#ch1_back))


    对于AlexNet来说，除了设计了这样的结构之外，还提出了两个重要的改进：第一，用ReLU作为激活函数，以解决梯度消失的问题，这在第2章中已经介绍过；第二，使用Dropout机制来防止过拟合。Dropout是通过在训练时随机地将特征图的部分位置置0，相当于丢弃部分信息，强迫模型基于剩下的特征进行正确的推断，以学习到更加鲁棒和具有判别性的特征。


    卷积神经网络的结构一般可以分为两个部分：一部分是由卷积层和池化层交替堆叠构成的骨干网络，它主要用于从输入中提取丰富的特征；另一部分是全连接层，它将卷积得到的特征图展平，也就是说丢弃了特征图的空间信息，它的主要作用是聚合全局信息并将其映射到输出空间，比如AlexNet就是用于分类。一般的卷积结构也是由这两部分构成的。3.4节中将介绍更多的改进结构。


    [\[1\]](#chapter33.xhtml#ch1) 图片是通过https://github.com/HarisIqbal88/PlotNeuralNet生成的。


    ### 3.2.2　卷积神经网络的特点


    卷积神经网络具有以下3个特点：局部连接、权值共享、层次化表达。


    （1）局部连接


    由于图像通常具有局部相关性，因此卷积计算每次只在与卷积核大小对应的区域进行，也就是说输入和输出是局部连接的。如果使用多层感知器来处理图像，一种简单的思路是将多维度的输入图像变换为一个向量并作为多层感知器的输入，对于大小为224×224×3的图像，拉平为一个向量作为输入将会需要150528个神经元。如果第一个隐藏层神经元数量为32，那么将会引入480万参数，这么大的参数量会带来两个问题：第一，计算复杂度高；第二，有过拟合的风险。如果使用3×3的卷积核，输出的通道数为32，引入的参数量在1000以下，远远小于多层感知器需要的参数。


    卷积操作与生物学上的一些概念很类似，在神经系统中，神经元通常只响应一部分的刺激信号，比如视网膜受到光的刺激，向视觉皮层传递信号，通常只有一部分视觉皮层神经元会响应这个信号，这种机制称为局部感知。对于卷积来说也是一样的，连续使用两层3×3卷积的，它的输出仅与5×5大小的输入区域有关，如图3-8所示。这个区域称为感知野，它指的是特征图上一个输出与多大区域的输入有关，在深度卷积神经网络中，有效的感知野通常比这个区域更小。


    ![](Images/3a8.jpg)


    图3-8　感知野示意图


    （2）权值共享


    卷积的第二个特征是权值共享。在图像中，不同的区域使用相同的卷积核参数，这一方面减少了参数量，另一方面带来了平移不变性。平移不变性指的是不管输入如何平移，总能够得到相同的输出。比如，对于左右两只完全相同的眼睛，使用相同的卷积核，在眼睛对应的区域进行卷积，都能够输出相同的结果，这是由权值共享机制带来的。另外，池化也带来了一些平移不变性，比如最大值池化，因为它是对感知野的信息使用最大值进行聚合，当输入在感知野内变化时，池化层的输出也不会改变。


    （3）层次化表达


    卷积网络的第三个特征是可以学到层次化的表达。卷积网络通过卷积层堆叠得到，每一层都是对前一层进行变换，提取的特征从低层次到高层次，逐渐变得抽象。如图3-9所示，低层次的卷积一般是提取一些简单的特征，比如颜色、边缘、角等，它的感知野相对较小，对应的都是局部性特征；中间层次的卷积得到的特征开始变得抽象，比如纹理结构等；高层次的卷积得到的特征更加抽象，与图像的语义、具体包含的目标相关，由于它的感知野更大，因此它是更加全局性的特征。高层次的特征是在低层级特征的基础上得到的，通常来说，低层次的特征更加通用，高层次的特征与具体的任务关联性更强。


    ![](Images/3a9.jpg)


    图3-9　层次化表达示意图[^(\[3\])](../Text/chapter45.xhtml#cc-3)


    ## 3.3　特殊的卷积形式


    除了3.1节中介绍的标准的卷积方式，还有一些特殊的卷积在各种任务中被提出，本节介绍几种常用的其他卷积形式。


    ### 3.1.1　1×1卷积


    1×1卷积，顾名思义，该卷积核的大小为1。它是在论文[^(\[4\])](../Text/chapter45.xhtml#cc-4)中被提出来的，并被后来的一些模型采用。1×1卷积的过程如图3-10所示，与前面介绍的卷积操作没有本质区别。


    读者或许会好奇，1×1卷积有用吗？通常1×1卷积有以下功能：一是用于信息聚合，同时增加非线性，1×1卷积可以看作是对所有通道的信息进行线性加权，即信息聚合，同时，在卷积之后可以使用非线性激活，可以一定程度地增加模型的表达能力；二是用于通道数的变换，可以增加或者减少输出特征图的通道数。


    ![](Images/3a10.jpg)


    图3-10　1×1卷积示意图


    ### 3.3.2　转置卷积


    转置卷积（Transposed Convolution）[^(\[5\])](../Text/chapter45.xhtml#cc-5)，它是语义分割任务中必不可少的模块。语义分割指的是对图像在像素级别上进行分类，属于同一类别的像素通常对应着某个目标，如图3-11所示，其中属于人的像素需要分类为同一类别，属于小鹿部分的像素需要分类为同一类别。


    ![](Images/3a11.jpg)


    图3-11　语义分割^([\[1\]](#chapter37.xhtml#ch1_back))


    基于CNN的语义分割模型通常都由两部分组成，一部分是编码器，用于将原始的输入图像映射到某个低维的特征空间中，它既需要编码目标的特征信息，也要编码位置信息，以正确地预测每个像素位置的类别。另一部分是解码器，它将编码的低维特征映射回像素空间，以对每个像素的具体类别进行判断。其中的解码器部分我们无法使用前面介绍的标准卷积，因为前面的卷积操作不会使得特征图的长宽维度增加，而转置卷积则相反，它可以完成长宽维度的增加，将编码的低维特征逐步映射回像素空间。


    如图3-12中的a图所示，假设输入是2×2，卷积核大小为3×3，转置卷积相当于在输入外补充了两圈0元素，然后再进行标准卷积，得到了4×4的输出。与卷积类似，转置卷积也可以设置填充padding和步长stride，但与卷积中的意义不太相同。对于步长为s，卷积核大小为k的转置卷积，在进行计算时将默认在输入四周填充k–1圈0，而设置的padding，将会影响最后填充的大小，具体的填充值由k–1–p给出。对于步长s，它是在卷积元素之间插入s–1个0，如图3-12中的b图所示。输入为2×2，p=0，步长s=2，卷积之后得到输出为5×5。


    ![](Images/3a12.jpg)


    图3-12　转置卷积示例


    对于转置卷积中输入维度、卷积核大小、填充以及步长与输出维度的关系，可以通过式（3.10）来确定：


    ![](Images/054-i.jpg)


    [\[1\]](#chapter37.xhtml#ch1) 图片来源https://ccvl.jhu.edu/datasets/。


    ### 3.3.3　空洞卷积


    空洞卷积（Dilated Convolution）[^(\[6\])](../Text/chapter45.xhtml#cc-6)通过在卷积核元素之间插入空格来“扩张”卷积核，其中有个超参数用于控制扩张的程度，称为空洞率r（dilation
    rate），指的是在卷积核中间插入r–1个0，因此对于原先大小为k的卷积核，在使用空洞卷积之后实际的卷积核大小变为k+（k–1）（r–1）。由于卷积核扩大，感知野也会扩大。因此空洞卷积是一种不增加参数量而可以快速扩大感知野的有效方式。


    ![](Images/3a13.jpg)


    图3-13　空洞卷积核


    对于k=3的卷积核，当空洞率r值分别为2，3时，实际的卷积核大小分别为5和7，如图3-13所示。对于大小为3×3的输出区域，上述三种卷积核对应的感知野大小分别为：


    当r=1时，感受野是3；


    当r=2时，感受野是7；


    当r=3时，感受野是11。


    当堆叠多层空洞卷积组成的层时，感知野会迅速扩大，以获得更多的局部信息。


    ### 3.3.4　分组卷积


    分组卷积最早是在AlexNet中出现的，当时训练AlexNet时卷积操作不能全部放在同一个GPU中进行处理，因此作者把特征图分给了多个GPU来处理，最后再把多个GPU的处理结果融合，这实际上就是分组卷积。下面我们通过举例来说明。


    如图3-14所示，将输入沿着深度方向划分为g组，每一组由C[1]/g个通道构成，同样，对于输出通道也进行类似的拆分，得到g组，每一组有C[2]/g个输出通道，将输入的分组与输出的分组对应起来，分别使用卷积进行计算。这样，对每一组卷积来说，需要的卷积核维度为![](Images/055-i.jpg)，即每组中卷积核的深度由原来的C[1]变成了C[1]/g，卷积核的个数也变成了C[2]/g个，而不是原来的C[2]个了。用每组的卷积核同它对应组的输入卷积，得到输出以后，再拼接起来，最终输出的通道仍旧是C[2]个。也就是说，我们可以并行计算g个相同的卷积过程。使用的参数量将变为![](Images/055-2-i.jpg)，即参数量相比标准卷积将减少g倍。


    ![](Images/3a14.jpg)


    图3-14　分组卷积的处理过程


    ### 3.3.5　深度可分离卷积


    深度可分离卷积由两部分组成[^(\[7\])](../Text/chapter45.xhtml#cc-7)，一部分是沿着深度的逐层卷积；另一部分是1×1卷积。沿着深度的逐层卷积是分组卷积的一种特殊情况，当g=C[1]\=C[2]时，它相当于为每一个输入通道设定了一个卷积核分别进行卷积。由于这种卷积只利用了单个输入通道的信息，即只使用了空间位置上的信息，而没有使用通道间的信息，因此，其后通常使用1×1卷积来增加通道间的信息。


    深度可分离卷积相比较于标准卷积，不仅减少了参数量，而且可以降低计算量、提高运算效率，因此这类卷积通常用于对速度有要求的卷积结构设计中，在MobileNet[^(\[8\])](../Text/chapter45.xhtml#cc-8)、ShuffleNet[^(\[9\])](../Text/chapter45.xhtml#cc-9)等模型上都有应用。


    ## 3.4　卷积网络在图像分类中的应用


    短短几年间，深度学习在计算机视觉领域取得了令人瞩目的成绩。各种图像分类模型相继被提出，从AlexNet到VGG，从GoogleNet v1到v4，再到后来的ResNet、DenseNet等，不断地变化，不断地刷新成绩。这一节，我们介绍其中几种典型的图像分类框架。


    ### 3.4.1　VGG


    VGG[^(\[10\])](../Text/chapter45.xhtml#cc-10)是牛津大学视觉组（Visual Geometry Group）在2014年提出来的，并取得了ImageNet
    2014比赛分类组的第二名和定位任务的第一名。


    VGG基于AlexNet进行了一些改进，主要体现在采用了3×3的小尺寸卷积核，并且卷积的步长为1，这样得到的两层卷积感知野为5，与直接使用一层5×5的卷积相比，参数量更少。另外，它去掉了LRN层，作者在实验中发现其实LRN的作用并不是很大。VGG还有一个结构特点是重复使用简单的卷积块（Convolution
    Block）来堆叠得到模型，它的基础卷积块为两层或多层卷积加上一层池化层。


    VGG有两个常用的模型VGG16和VGG19，其中VGG16的结构如图3-15所示。VGG16与VGG19的差别在于某些基础块中的卷积层数不一样。VGG由于其结构简洁、效果较好，直到现在也常常被用作其他任务的骨干网络。


    ![](Images/3a15.jpg)


    图3-15　VGG16的网络结构


    ### 3.4.2　Inception系列


    取得ImageNet 2014分类任务的最好成绩的是谷歌提出的GoogleNet，该网络的核心结构是Inception块，与VGG构建的基础块不同，Inception块使用了多分支及不同尺度的卷积核。Inception结构也经过了多次优化，得到了几个不同的版本。


    1.Inception V1


    Inception V1[^(\[11\])](../Text/chapter45.xhtml#cc-11)首次使用了并行的结构。如图3-16所示，每个Inception块使用多个大小不同的卷积核，这与传统的堆叠式网络每层只用一个尺寸的卷积核的结构完全不同。Inception块的多个不同的卷积核可以提取到不同类型的特征，同时，每个卷积核的感知野也不一样，因此可以获得多尺度的特征，最后再将这些特征拼接起来。


    如果单纯地引入多个尺寸的卷积核会引入大量的参数，耗费大量的计算资源，为了降低计算成本，可以采用的改进方式是在3×3卷积和5×5卷积之前引入1×1卷积，以降低输入的通道数，另外在池化层之后也使用1×1卷积进行降维，改进后的Inception块如图3-17所示。我们来对比一下改进前与改进后的参数量变化，忽略掉偏置项，输入输出的通道数如图3-17所示，改进前需要的参数量如式（3.11）所示，改进后需要的参数量如式（3.12）所示，可以看出改进前的参数量是改进后的2.3倍，并且改进前池化层的输出通道数与输入通道数相同，与其他卷积结果拼接后，输出的通道数将会急剧增大。


    ![](Images/058-i.jpg)![](Images/3a16.jpg)


    图3-16　最初的Inception模块


    GoogleNet用Inception块构成堆叠，另外为了缓解梯度消失问题，在网络的中间部分加入了辅助分类器。


    2.Inception V2


    Inception V2[^(\[12\])](../Text/chapter45.xhtml#cc-12)主要针对Inception V1的卷积核设计进行改进，将大尺寸的卷积进行分解，以减少参数量，降低计算复杂度。


    ![](Images/3a17.jpg)


    图3-17　改进后的Inception V1模块'
