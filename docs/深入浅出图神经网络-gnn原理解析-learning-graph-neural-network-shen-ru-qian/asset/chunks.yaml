    ## 7.3　R-GCN


    在之前介绍的所有GNN的变体模型中，都没有显式地考虑节点之间关系的不同，相较于同构图，现实生活中的图数据往往是异构的，即图里面存在不止一种类型的关系。本节要介绍的R-GCN就是将图卷积神经网络拓展到这种场景的图数据中去。


    ### 7.3.1　知识图谱


    一种最典型的包含多种关系的图数据就是知识图谱（Knowledge Graph）。知识图谱是一种规模非常庞大的语义网络，其主要作用是描述通用或专用场景下实体间的关联关系，主要应用场景为搜索引擎、语音助手、智能问答等。


    举一个简单的例子，当我们在Google上搜索“欧拉”时，结果返回页的右边栏会出现一个卡片。如图7-6所示，里面除了有对数学家欧拉的成就介绍外，还分门别类地列出了一些基本情况：生卒年、家庭、教育等信息。搜索引擎能够以这么简单明了的形式列出人物的相关知识，背后离不开知识图谱技术的支持。图7-6的右图将卡片中的一些信息以知识图谱的形式展现了出来。


    ![](Images/7a6.jpg)


    图7-6　Google搜索“欧拉”返回的结果^([\[1\]](#chapter82.xhtml#ch1_back))


    知识图谱的构建所依赖的核心技术是信息抽取与知识构建，该项技术旨在从大规模非结构化的自然语言文本中抽取出结构化信息，该技术决定了知识图谱可持续扩增的能力。而对于一个已有的知识图谱，有的时候还需要基于现存的实体间的关系，通过推理学习得到实体间新的关系并将其补充进知识图谱里面去。作为图数据的一种通用学习手段，将GNN应用到该任务上的最大的问题在于如何考量实体间的各种不同关系，而且往往这些关系会有上千种之多，发生过拟合的风险非常高。


    [\[1\]](#chapter82.xhtml#ch1) 图片来源：https://zh.wikipedia.org/wiki/莱昂哈德·欧拉。


    ### 7.3.2　R-GCN


    R-GCN[^(\[7\])](../Text/chapter89.xhtml#gg-7)基于GCN的聚合邻居的操作，又增加了一个聚合关系的维度，使得节点的聚合操作变成一个双重聚合的过程，其核心公式如下：


    ![](Images/141-i.jpg)


    R表示图里所有的关系集合，![](Images/141-2-i.jpg)表示与节点v[i]具有r关系的邻居集合。c[i，r]用来做归一化，比如取![](Images/141-3-i.jpg)。W[r]是具有r关系的邻居对应的权重参数，W[o]是节点自身对应的权重参数。


    由于GCN考虑的是同构图建模，节点之间只存在一种关系，因此GCN只需要一组权重参数来对节点的特征进行变换。R-GCN考虑的是异构图建模，在处理邻居的时候，考量关系的因素对邻居进行分类操作：对于每一种关系的邻居引入不同的权重参数，分别对属于同一关系类型的邻居聚合之后，再进行一次总的聚合，如图7-7所示。


    图7-7所示为R-GCN聚合邻居操作的示意图，我们可以清晰地看到这是一个两层的聚合操作：先对同种关系的邻居进行单独聚合，这里对于每一种关系，也同时考虑了关系的正反方向，同时对于自身加入了自连接的关系，在将上述所有不同关系的邻居进行聚合之后，再进行一次总的聚合。


    ![](Images/7a7.jpg)


    图7-7　R-GCN聚合邻居操作^([\[1\]](#chapter83.xhtml#ch1_back))


    之前我们提到，一个典型的多关系图数据–知识图谱往往包含着大量的关系。如果我们为每一种关系都设计一组权重，那么单层R-GCN需要学习的参数量将十分庞大，同时，由于不同关系的节点数量是不一样的，对于一些不常见的关系而言，其权重参数对应的学习数据非常少，这大大增加了过拟合的风险。为了避免上述情况发生，R-GCN提出了对W[r]进行基分解（basic
    decomposition）的方案，即：


    ![](Images/142-i.jpg)


    我们称![](Images/142-2-i.jpg)为基，a[rb]是W[r]在V[b]上的分解系数，B是超参数，控制着V[b]的个数，V[b]、a[rb]是取代W[r]需要学习的参数。通过上式的基分解，我们将W[r]变成了一组基的线性加和，且对于|R|组W[r]，可以反复利用|B|组基进行线性加和表示。这样做的好处在于，首先，将需要学习的参数减至原来的![](Images/142-3-i.jpg)，在实际训练的时候，我们可以设置一个较小的B值，使得B<<min（|R|，d^(（l+1）)×d^(（l）)）；其次，基V[b]的优化是所有的常见或者不常见关系所共享的，这种共享的优化参数可以有效防止非常见关系数据上过拟合现象的出现。基分解是一种非常常见的数据变换的表示方式（图信号的傅里叶变换中也体现了这种思想），在机器学习中，其作为一种重要的数据处理技巧得到了广泛的应用。


    [\[1\]](#chapter83.xhtml#ch1) Schlichtkrull M，Kipf T N，Bloem P，et al.Modeling
    relational data with graph convolutional networks\[C\]//European Semantic Web
    Conference.Springer，Cham，2018：593-607.


    ## 7.4　GNN的通用框架


    在介绍完GNN的几种变体后，本节我们来看看GNN的通用框架。所谓通用框架，是对多种变体GNN网络结构的一般化总结，也是GNN编程的通用范式，研究它能够帮助我们更加清晰地横向对比各类GNN模型，同时也为GNN模型的灵活拓展提供了方向。


    下面我们介绍3类通用框架：消息传播神经网络（Message Passing Neural Network，MPNN）、非局部神经网络（Non-Local Neural
    Network，NLNN）、图网络（Graph Network，GN）。MPNN从聚合与更新的角度归纳总结了GNN模型的几种变体，NLNN是对基于注意力机制的GNN模型的一般化总结，在这两种框架之上，GN做到了对GNN模型更全面化的总结。


    ### 7.4.1　MPNN


    在引文[\[8\]](../Text/chapter89.xhtml#gg-8)中提出了MPNN，通过消息传播机制对多种GNN模型做出了一般化总结。其基本思路为：节点的表示向量都是通过消息函数M（Message）和更新函数U（update）进行K轮消息传播机制的迭代后得到的，消息传播的过程如下：


    ![](Images/143-i.jpg)


    其中e[ij]表示边<v[i]，v[j]\>上的特征向量，k表示第k次消息传播，在实际编程中，一般和模型中层的概念等价。


    消息函数的输入由边本身以及两侧节点构成，为了方便描述，我们借用RDF（Resource Description Framework）三元组来表示这样的输入：


    ![](Images/144-i.jpg)


    Soure表示源节点，Object表示目标节点，Predict表示源节点到目标节点的关系。这种描述框架非常自然地对应了汉语中的主谓宾三元组短句，如“GNN属于Deep
    Learning”，就描述了“GNN”到“Deep Learning”之间的关系，用RDF表示如下：


    ![](Images/144-2-i.jpg)


    在消息函数的作用下，图里面所有的RDF都会向外广播消息，之后这些消息都会沿着边的方向传播到RDF的两侧节点处进行聚合，聚合后的消息会在之后的更新函数的作用下对节点特征进行更新。图7-8所示为MPNN计算的示意图：


    ![](Images/7a8.jpg)


    图7-8　MPNN计算示意图


    需要特别说明的是，上面的MPNN并没有对边的表示向量进行迭代更新，该文作者指出，如果有必要的话，比如在某些场景下的图数据中边具有显式的重要意义，可以与节点一样，对边的表示向量始终维护一个状态变量，具体做法可以参考下面GN的做法。


    MPNN的核心在于消息函数和更新函数，原则上可以把它们设计成任意一种DNN模型。接下来我们看看在消息传播的视角下，该如何确定GCN、R-GCN、GraphSAGE、Interaction
    Network[^(\[9\])](../Text/chapter89.xhtml#gg-9)等GNN模型中的消息函数与更新函数，如表7-1所示：


    表7-1　模型中的消息函数与更新函数


    ![](Images/7b1.jpg)


    由于MPNN的消息函数是作用在RDF三元组上的，因此其对各种类型的图数据都具有一定的适应性。下面给出对于常见的同构图、异构图、属性图等类型的图数据用MPNN框架进行处理的方法，处理的方式不限于此，读者可自行考虑：


    （1）同构图：同构图本身是非常容易处理的，唯一特殊的是有向加权图。对于这类图数据，可以将边的正反方向看成两种关系，借用R-GCN的思路进行处理，同时对边上的权重可以考虑进邻接矩阵中当作归一化项一并处理。


    （2）异构图：可以考虑R-GCN方式，另外如果关系不多，可以将关系编码成one-hot向量当作边上的特征进行处理。


    （3）属性图：之前我们介绍了属性图是很一种应用很广泛的图数据的表达形式。在属性图中，我们需要考虑的因素有节点的异构以及边属性。对于前者，如果我们追求工程上的简化处理，可以在调用MPNN之前，对不同类型的节点分别送进变换函数（这些函数可以是任意的NN模型）里面，将异构的节点变换到同一维度的同一特征空间里，之后当作节点同构的图处理。对于后者，可以参考关系图的处理方式，这里如果边上具有一些属性信息的话，按照消息函数的机制，需要对其进行特征编码（比如类别型属性特征进行one-hot编码或者embedding编码）。


    ### 7.4.2　NLNN


    非局部神经网络（NLNN）[^(\[10\])](../Text/chapter89.xhtml#gg-10)是对注意力机制的一般化总结，上文介绍的GAT就可以看作是它的一个特例。NLNN通过non-local操作将任意位置的输出响应计算为所有位置特征的加权和。位置可以是图像中的空间坐标，也可以是序列数据中的时间坐标，在图数据中，位置可以直接以节点代替。


    通用的non-local操作的定义如下：


    ![](Images/146-i.jpg)


