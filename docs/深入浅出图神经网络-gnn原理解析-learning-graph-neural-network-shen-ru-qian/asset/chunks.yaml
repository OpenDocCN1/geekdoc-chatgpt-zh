    \ sid in src_nodes:\n        # 从节点的邻居中进行有放回的采样\n        res = np.random.choice(neighbor_table[sid],\
    \ size=(sample_num, ))\n        results.append(res)\n    return np.asarray(results).flatten()\n\
    \n\ndef multihop_sampling(src_nodes, sample_nums, neighbor_table):\n    \"\"\"\
    根据源节点进行多阶采样\n    \n    Arguments:\n        src_nodes {list, np.ndarray} -- 源节点id\n\
    \        sample_nums {list of int} -- 每一阶需要采样的个数\n        neighbor_table {dict}\
