    在GCN模型中，我们知道节点在第`k+1`层的特征只与其邻居在`k`层的特征有关，这种局部性质使得节点在第`k`层的特征只与自己的`k`阶子图有关。对于图7-1中的中心节点（橙色节点），假设GCN模型的层数为2，若要想得到其第2层特征，图中所有的节点都需要参与计算。


    ![](`Images/7a1.jpg`)


    图7-1 采样邻居^([\[1\]](#chapter74.xhtml#ch1_back))


