- raw: '分类问题：指的是模型的输出值为离散值。比如在风控场景中，模型通常输出的是正常/异常两类结果；在图像分类任务中，模型输出为图像所属的具体类别。


    回归问题：指的是模型的输出值为连续值。比如在电商广告推荐中，模型常常输出用户点击某个商品的概率，概率越高表示模型认为用户越倾向于点击该商品。


    ### 2.1.2　机器学习流程概述


    一个完整的机器学习流程通常涉及多个环节，各个环节之间相互依赖，下面以一个具体的实例来直观地说明整个流程，然后以数学的语言阐述整个过程。


    1.示例


    在电商领域，我们需要对商品进行分类，为了简化问题，假设只有一批商品的图片数据，分为羽绒服、毛呢大衣、连衣裙、卫衣等品类。我们需要建立一个模型，使用这批商品的图片数据训练模型，得到一个可以对未知的图片进行分类的预测模型。比如对于新样式的羽绒服可以正确预测它的类别是羽绒服。要完成上述功能，在机器学习中通常需要如下几个步骤。


    （1）提取商品图片的特征：在计算机中图像都是以像素的方式离散存储的，单个像素携带的信息，很难让模型直接去学习。为了让计算机能够准确地识别分类，需要提取一些有区分性的特征，比如衣服的颜色、风格等。这些特征可以是人为定义的，这个过程称为特征工程，也可以使用算法自动提取前者是传统机器学习的必需步骤，并且具有举足轻重的地位，后者典型的方法是深度学习，读者在第3章可以了解到如何使用深度学习方法解决这个问题。


    （2）建立模型：在定义好特征后，需要选择一个合适的模型来建模。传统的机器学习模型有逻辑回归、随机森林等；基于深度学习的方法，有多层感知器、卷积网络等。模型可以看成是一个复杂的函数y=f（X；W），其目的是建立输入到标签y之间的映射，其中X是前面定义的特征，W是定义模型的参数。


    （3）确定损失函数和进行优化求解：选择模型只是确定了一个模型形式，比如使用逻辑回归，它还包含权值，在这些权值没有确定之前，是无法用它来进行正确预测的。那么如何调整模型使得它可以完成有意义的预测呢？首先需要一个数值来量化模型预测的对错，损失函数就是来衡量模型输出与标签之间的差异程度的，当预测结果与标签差异偏大时，损失函数值增大，反之则减小。基于损失函数给出的值，可以通过优化方法调整模型以不断减小损失值。


    2.数学模型


    以上述例子代表的分类模型为例，给出分类的数学模型。假设有一批包含N条样本的训练集，用集合X={（x[i]，y[i]）|i=1，2，...，N}表示。每一个样本x[i]都有对应的标签y[i]，其中x[i]∈R^d表示每个样本是一个d维的向量，标签y[i]是一系列离散值y[i]∈Y={0，1，2，...，K}，表示样本x[i]所属的类别，K为类别的种类数。我们的目的是建立一个能完成分类功能的模型，即需要这样一个模型：f：R^d→R^K，输入是d维的向量，经过f映射，输出在每个类别上的概率分布P（Y|x[i]）=f（x[i]；θ），这样就可以取概率最大的类别作为结果，即![](Images/020-i.jpg)。


    那么现在的问题是，如何评价分类模型的好坏呢？比较直接的方法是，我们关注模型在训练数据上的结果，通过比较![](Images/020-2-i.jpg)与样本真实标签y[i]是否相同来评价模型的好坏。如果模型能对训练集中的大部分样本进行正确预测，那这个模型可能是一个不错的模型，否则可能是一个糟糕的模型，这种定性的说明并不直观，我们需要一种可以量化这个差异的方法，该方法就是损失函数。


    损失函数（loss function）用来估量模型的预测值y^(\*)与真实值y的差异程度，是一个非负实值函数，通常用L（y，f（x；θ））来表示。在机器学习中，通过在训练集X上最小化损失函数来训练模型，调整f的参数θ，使得损失函数值降低，当损失函数取最小值时，也就找到了一个不错的模型。这个过程称为优化求解。整个过程可以用式（2.1）表示：


    ![](Images/020-3-i.jpg)


    其中，前面的均值函数表示的是经验风险函数，L代表的是损失函数，后面的Φ是正则化项（regularizer）或者叫惩罚项（penalty term），可以是L[1]也可以是L[2]，或者其他正则函数。上述公式表示的是找到使目标函数最小的θ值。损失函数旨在表示模型输出f（x）和真实值Y的差异程度，不同的损失函数有不同的表示意义，也就是在最小化损失函数的过程中，f（x）逼近Y的方式不同，得到的结果可能也不同。


    在实际优化时，常常无法一步到位直接找到合适的参数，因此在机器学习中，通常使用迭代式的方法逐步逼近最优值。整个过程如图2-1所示：对训练集X使用模型f（X；θ[0]）进行预测，其中θ[0]表示初始参数，然后对预测的结果与样本真实标签利用损失函数计算损失值，优化方法会根据当前损失值对参数进行调整，得到θ[1]，然后重复上述过程，持续迭代，直到该算法发现损失可能是最低的模型参数。通常，可以不断迭代，直到总体损失不再变化或变化极其缓慢为止，这时候，我们可以说该模型已收敛。


    ![](Images/2a1.jpg)


    图2-1　机器学习算法迭代过程


    需要注意的是，我们训练模型的目的不是让模型在训练集上取得不错的效果，而是希望模型从训练集中学会去面对未知的样本，能够对新样本进行预测。一个极端的情况是我们得到了一个模型，它能完美地拟合训练数据，能完全正确地预测所有的训练样本，即它的损失值为0，但是在新样本预测的表现上却糟糕，这种现象在机器学习中被称为过拟合。另一种情况是模型“竭尽全力”也无法在训练样本上取得令人满意的结果，这种现象被称为欠拟合。


    损失函数和优化算法是机器学习的两个重要组成部分。接下来我们首先介绍几种常用的损失函数，然后介绍一类使用较多的优化方法—梯度下降。


    ### 2.1.3　常见的损失函数


    损失函数是指导模型进行有效学习的基础，基于不同的任务可以选择或者设计不同的损失函数，使得模型可以从数据中挖掘出有价值的信息。下面我们介绍几种常见的损失函数。


    1.平方损失函数


    平方损失的定义如式（2.2）所示：


    ![](Images/022-i.jpg)


    其中N是样本数量，它衡量的是模型预测的结果与标签之间的平方差，常用于回归类问题。


    2.交叉熵损失


    交叉熵（cross entropy）损失常用于分类问题中，分类模型通常输出类别的概率分布，交叉熵衡量的是数据标签的真实分布与分类模型预测的概率分布之间的差异程度，损失值越小，它们之间的差异就越小，模型就越能准确地进行预测。其离散形式如下：


    ![](Images/022-2-i.jpg)


    其中p，q分别表示数据标签的真实分布和模型预测给出的分布，p（y[i]|x[i]）表示样本x[i]标签的真实分布。一般来说，样本x[i]只属于某个类别c[k]，因此p（y[i]\=c[k]|x[i]）=1，在其他类别上概率为0。![](Images/022-3-i.jpg)表示给定样本x[i]模型预测在各个类别上的概率分布。如果样本x[i]的标签为c[k]，那么式（2.3）可以简化为式（2.4）：


    ![](Images/022-4-i.jpg)


    可以看出在这种情况下，最小化交叉熵损失的就是最大化样本标签的似然概率。


    对于二分类来说y[i]∈{0，1}，使用逻辑回归可以得到样本x[i]属于类别1的概率q（y[i]\=1|x[i]），那么样本属于类别0的概率为1–q（y[i]\=1|x[i]），使用式（2.4），可以得到逻辑回归的损失函数，如式（2.5）所示，它也被称为二元交叉熵损失。


    ![](Images/023-i.jpg)


    ### 2.1.4　梯度下降算法


    1.梯度下降算法的原理


    机器学习中很多问题的求解本质上都是求解优化相关的问题，找到合适的参数以期最小化损失函数值。求解类似的优化问题，有很多成熟的方法可以参考，梯度下降就是一种经典的方法。它利用梯度信息，通过不断迭代调整参数来寻找合适的解。


    对于一个多元函数f（x），梯度定义为对其中每个自变量的偏导数构成的向量，用f''（x）表示，如式（2.6）所示：


    ![](Images/023-2-i.jpg)


    考查f（x+Δx）在x处的泰勒展开，如式（2.7）所示：


    ![](Images/023-3-i.jpg)


    要想使得f（x+Δx）<f（x），忽略高阶项，就需要f''（x）^TΔx<0，也就是说，满足这个条件就可以使得函数值减小，进一步地，f''（x）^TΔx=||f''（x）^T||·||Δx||·cosθ，取Δx=–αf''（x），可保证更新后的x可以使得函数值减小，这里α是一个超参数，用于调整每次更新的步长，称为学习率。


    机器学习中优化的目标是最小化损失函数，通过梯度下降的方法进行求解的过程分为以下几步，算法过程如代码清单2-1所示。首先，通过随机初始化为需要求解的参数赋初值，作为优化的起点；接下来，使用模型对所有样本进行预测，计算总体的损失值；然后利用损失值对模型参数进行求导，得到相应的梯度；最后基于梯度调整参数，得到迭代之后的参数。重复上述过程，直到达到停止条件。


    作一个形象的比喻，梯度下降算法就像是一个人下山，他在山顶，想要达到山脚，但是山上的浓雾很大，他分不清下山的路，必须利用自己周围的信息去找到下山的路径，这时候就可以使用梯度下降算法。具体来说就是，以他当前所处的位置为基准，找到这个位置最陡峭的方向，然后朝着这个方向往山下走，每走一段路就重复上述步骤，最后就能成功到达山脚了。


    梯度下降算法


    ![](Images/024-i.jpg)


    2.随机梯度下降算法


    前面介绍的梯度下降算法需要首先计算所有数据上的损失值，然后再进行梯度下降，这种方式在数据规模比较大时是比较低效的。主要体现在3个方面，一是数据规模大时，模型计算所有样本的时间增加；二是随着数据维度的增加，梯度计算的复杂度也会增加；三是虽然可以基于所有样本得到准确的梯度值，但是仅需进行一次参数更新，我们称这样的梯度下降算法为批梯度下降（Batch
    Gradient Descent）。


    如果不使用全量的样本来计算梯度，而使用单一样本来近似估计梯度，就能极大地减少计算量，提高计算效率，但是这种方法是否能保证一定收敛呢？可以证明，这种算法的收敛性是可以保证的，这种方法称为随机梯度下降（Stochastic
    Gradient Descent，SGD）。


    具体来说就是，每次从训练集中随机选择一个样本，计算其对应的损失和梯度，进行参数更新，反复迭代。这种方式在数据规模比较大时可以减小计算复杂度，从概率意义上来说单个样本的梯度是对整个数据梯度的无偏估计，但是它存在着一定的不确定性，因此收敛速率相比批梯度下降得更慢。


    改进的方法是每次使用多个样本来估计梯度，这样可以减小不确定性，提高收敛速率。这种方法称为小批量随机梯度下降（mini-batch SGD），其中每次迭代选取的样本数量称为批大小（batch
    size），算法步骤如下所示。


    小批量随机梯度下降


    ![](Images/025-i.jpg)


    ## 2.2　神经网络


    随着神经科学、认知科学的发展，我们已经知道人类的智能行为都和大脑活动有关。人类的大脑是一个可以产生意识、思想和情感的器官。受到人脑神经系统的启发，早期的神经科学家构造了一种模仿人脑神经系统的数学模型，称为人工神经网络，简称神经网络。在机器学习领域，神经网络是指由很多人工神经元构成的网络结构模型，这些人工神经元之间的连接强度是可学习的参数。


    ### 2.2.1　神经元


    神经元是神经网络进行信息处理的基本单元，其主要是模拟生物神经元的结构和特性，接收输入信号并产出输出。


    生物学家在20世纪初就发现了生物神经元的结构，如图2-2所示。一个生物神经元通常具有多个树突和一条轴突。树突用来接收信息，轴突用来发送信息。当神经元所获得的输入信号积累超过某个阈值时，它就会处于兴奋状态，产生电脉冲。轴突尾端有许多末梢可以与其他神经元的树突产生连接（突触），并将电脉冲信号传递给其他神经元。


    ![](Images/2a2.jpg)


    图2-2　典型神经元结构^([\[1\]](#chapter17.xhtml#ch1_back))


    1943年，心理学家McCulloch和数学家Pitts根据生物神经元的结构，提出了一种非常简单的神经元模型—MP神经元[^(\[1\])](../Text/chapter26.xhtml#bb-1)。


    一个基本的神经元包括3个基本组成部分：输入信号、线性组合和非线性激活函数。我们可以用式（2.8）和式（2.9）来描述图2-3中的神经元的计算。


    ![](Images/2a3.jpg)


    图2-3　神经元示意图


    ![](Images/027-i.jpg)


    其中x[0]，x[1]，…，x[m]是输入信号，w[i0]，w[i1]，…，w[im]是神经元的权值，z[i]是输入信号的线性组合，b是偏置，激活函数为σ（.），a[i]是神经元输出信号。


    [\[1\]](#chapter17.xhtml#ch1) 图片来源：https://commons.wikimedia.org/wiki/File:Neuron\_Hand-tuned.svg。


    ### 2.2.2　多层感知器


    1.单隐层感知器


    单个隐藏层的感知器的典型结构如图2-4所示，它通过将神经元进行堆叠得到，我们可以把它看作一个映射：![](Images/027-2-i.jpg)，其中D[in]表示输入层的神经元个数，也就是输入向量的维度，D[out]表示输出层的神经元个数，也就是输出向量的维度，计算过程可以用式（2.10）表示：


    ![](Images/027-3-i.jpg)![](Images/2a4.jpg)


    图2-4　单个隐藏层的感知器


    其中b^(（1）)、b^(（2）)表示偏置，W^(（1）)、W^(（2）)表示权值向量，f[1]、f[2]表示激活函数。h（x）=![](Images/028-i.jpg)就是隐藏层的输出，可以看到，隐藏层的输出就是对输入进行线性变换和非线性变换。![](Images/028-2-i.jpg)是将输入向量变换为隐藏层向量的变换矩阵，W^(（1）)的每一列表示从输入连接到隐藏层一个神经元的权值向量。f[1]表示激活函数，它对隐藏层的每个神经元进行变换，得到对应的输出，这种计算方式称为逐元素操作（Elementwise
    Operator），2.3节将会介绍一些典型的激活函数。


    2.感知器的信息传递


    多层感知器（Multi-Layer Perceptron，MLP），也称前馈神经网络。典型的多层感知器如图2-5所示，前面介绍的单层感知器是它的一种特殊形式。它有如下几个特点。


    ![](Images/2a5.jpg)


    图2-5　多层感知器模型


    多层感知器可以分为3个部分：输入层、隐藏层、输出层，其中隐藏层可以包括一层或者多层；每一层都由若干神经元组成，每个神经元承担的计算功能包括线性加权和非线性变换；层与层之间通过权值建立联系，后一层的每个神经元与前一层的每个神经元都产生连接。


    输入信号通过不断地进行线性变换（线性加权）和非线性变换（激活函数），逐渐将输入信号向后一层传递，直到输出层。其中输入层和输出层的神经元个数往往是通过先验的知识确定的，而隐藏层中每层的神经元个数以及使用的层数都是超参数。


    更一般化地，我们用式（2.11）和式（2.12）的形式来表示多层感知器的信息传播过程：


    ![](Images/029-i.jpg)


    其中![](Images/029-2-i.jpg)是第（l–1）到第l层的变换参数，D[l–1]表示第（l–1）层的神经元个数，D[l]表示第l层的神经元个数；![](Images/029-3-i.jpg)表示偏置项；{W^(（l）)，b^(（l）)}是一层网络中可训练的参数。σ[l]是第l层的激活函数。![](Images/029-4-i.jpg)分别表示线性变换的输出和激活函数的输出。


    多层感知器逐层传递信息，得到输出y，整个网络可以看作一个复杂的复合函数φ（X；W，b），其中W、b表示参数的集合{W^(（l）)，b^(（l）)|l=1，2，3，…}。


    ## 2.3　激活函数


    激活函数是神经网络中一个十分重要的概念，它的非线性使得神经网络几乎可以任意逼近任何非线性函数。如果不使用激活函数，无论神经网络有多少层，其每一层的输出都是上一层输入的线性组合，这样构成的神经网络仍然是一个线性模型，表达能力有限。


    激活函数的选择可以多种多样，一个基本的要求是它们是连续可导的，可以允许在少数点上不可导。常用的激活函数包括S型激活函数和ReLU及其变种等。


    ### 2.3.1　S型激活函数


    S型激活函数中比较典型的是Sigmoid和Tanh，这种激活函数的特点是有界，即![](Images/030-i.jpg)，并且输入的绝对值越大，对应的梯度就越小，越趋近于0。


    Sigmoid函数的定义为式（2.13）：


    ![](Images/030-2-i.jpg)


    Sigmoid函数将任意大小的输入都压缩到0到1之间，输入的值越大，压缩后越趋近于1；输入值越小，压缩后越趋近于0。当x∈\[–1，1\]时，可以近似看作线性函数，并且当x=0时，函数值为0.5。


    它在神经网络中常常用作二分类器最后一层的激活函数，可将任意实数值转换为概率；另一个应用场景是由于它的值域为（0，1），故可以作为一个类似于开关的调节器，用于对其他信息进行调节。


    另一个函数是Tanh，其定义为式（2.14）：


    ![](Images/030-3-i.jpg)


    相比较于Sigmoid，Tanh的值域范围更大一些，为（–1，1）。Sigmoid和Tanh的函数图像如图2-6所示。Tanh也可以作为“开关”调节输入信息。


    ### 2.3.2　ReLU及其变种


    1.ReLU


    线性整流函数（Rectified Linear Unit，ReLU）[^(\[2\])](../Text/chapter26.xhtml#bb-2)是目前深度学习模型中经常使用的激活函数。它的定义为当x≥0时，保持x不变进行输出，保持不变；当x<0时，输出为0，如式（2.15）所示：


    ![](Images/031-i.jpg)![](Images/2a6.jpg)


    图2-6　Sigmoid函数和Tanh函数


    可以看出，ReLU对正负值的处理方式完全不同，当输入为负时，全部置零，而输入为正时则保持不变，这个特性称为单侧抑制。在隐藏层中，这个特征会为隐藏层的输出带来一定的稀疏性。同时由于它在输入为正时，输出保持不变，梯度为1，可以缓解梯度消失的问题。它的梯度如式（2.16）所示，计算非常简单，计算效率很高。


    ![](Images/031-3-i.jpg)


    另外，单侧抑制在某些情况下可能会导致某个神经元“死亡”，原因是如果某个神经元输出始终为负，那么在进行反向传播时，其相应的梯度始终为0，导致无法进行有效的更新。


    在实际使用中，为了避免上述情况，有几种ReLU的变种也被广泛使用。


    2.LeakyReLU'
