- raw: '图6-5所示的方法是基于手工特征的方法，该方法对于图数据的处理方式非常依赖人工干预，具体来说，就是将图中节点的结构信息以一些图的统计特征进行替代，常见的如节点的度、节点的中心度、节点的PageRank值等，然后将这个代表节点结构信息的特征向量与代表节点属性信息的特征向量拼接在一起，送到下游进行任务的学习。这种方法的最大问题在于，表示结构信息的特征向量需要人为定义，因此很难确定这些统计特征是否对学习后面的任务有效。


    ![](Images/6a6.jpg)


    图6-6　基于随机游走的方法


    图6-6所示的方法是基于随机游走的方法，随机游走[^(\[1\])](../Text/chapter71.xhtml#ff-1)是网络表示学习中最具代表性的方法之一，其基本思想是将图中节点所满足的关系与结构的性质映射到一个新的向量空间去，比如在图上距离更近的两个节点，在新的向量空间上的距离也更近。通过这样的优化目标将图里面的数据，转化成向量空间里面的数据，这样处理起来就会更加方便。接下来，该方法和基于手工特征的方法的思路一样，将代表节点结构信息的特征向量与代表节点属性信息的特征向量进行拼接，然后进行下游的任务学习。所不同的是，其节点的结构信息是通过随机游走类方法进行学习的，并不依赖人为定义，因此相比之下会更加高效。


    图6-7是基于GCN的方法，从图中可以看到，GCN对于图数据的学习方式比较符合端对端的要求：一端是数据，另一端是任务。


    ![](Images/6a7.jpg)


    图6-7　基于GCN的方法


    GCN对于属性信息和结构信息的学习体现在其核心计算公式上：![](Images/118-i.jpg)，这一计算过程可以被分拆成两步：


    第1步：XW是对属性信息的仿射变换，学习了属性特征之间的交互模式；


    第2步：![](Images/118-2-i.jpg)从空域来看是聚合邻居节点的过程，代表了对节点局部结构信息的编码。


    为了更进一步说明GCN对于图中的结构信息的学习能力，我们来看一个经典的图论问题—图的同构问题（graph isomorphism problem），即给定两个图，判断这两个图是否完全等价。


    ![](Images/6a8.jpg)


    图6-8　图同构^([\[1\]](#chapter68.xhtml#ch1_back))


    从图6-8中我们可以发现，即使看上去并不相似的两个图，也有可能是完全等价的。从同构图的定义中我们可以看到，要想解决这个问题，需要考量的是算法对图结构信息的分辨能力。一个经典的解法就是Weisfeiler-Lehman算法[^(\[2\])](../Text/chapter71.xhtml#ff-2)，Weisfeiler-Lehman算法是一个迭代式的算法，其算法流程如下所示：


    对于图上任意一个节点v[i]：


    1.获取邻居节点v[i]∈N（v[i]）的标签h[j]；


    2.更新v[i]的标签![](Images/119-i.jpg)，其中hash（.）是一个单射函数（一对一映射）。


    我们可以看到，上述过程与节点层面的GCN计算过程基本一致：迭代式地聚合邻居节点的特征，从而更新当前节点的特征。从这个角度来看，GCN近似于一种带参的、支持自动微分的Weisfeiler-Lehman算法。在引文[\[3\]](../Text/chapter71.xhtml#ff-3)中介绍了一种GCN的衍生模型—Graph
    Isomorphism Network（GIN），实验证明，其在判断图同构的问题上，能力近乎等价于Weisfeiler-Lehman算法。


    在GCN模型中，通过堆叠图卷积层，上述属性信息的编码学习与结构信息的编码学习被不断地交替进行，如是完成对图数据中更加复杂的模式学习。GCN相较于上面述的种方法，有如下两点优势：


    （1）GCN对表示学习和任务学习一起进行端对端的优化，在前述两种方法中，节点的特征向量一旦被拼接起来就会被固化下来，下游任务学习中产生的监督信号并不能有效指导图数据的表示学习，这可能会使节点的特征表示对于下游的任务不是最高效的。相反，GCN对于图数据的建模并没有切分成两步来完成，对于节点的表示学习与下游的任务学习被放到一个模型里面进行端对端学习，整个模型的监督信号同时指导着任务层（如分类层）和GCN层的参数更新，节点的特征表示与下游任务之间具有更好的适应性。


    （2）GCN对结构信息与属性信息的学习是同时进行的，并没有进行分拆和解构。通常来说，属性信息与结构信息具有很好的互补关系，对于一些结构稀疏的图来说，属性信息的补充可以很好地提高模型对节点表示学习的质量，另外，结构信息蕴含着属性信息中所没有的知识，对节点的刻画具有十分重要的作用。GCN将结构信息与属性信息放进一个网络层里面同时进行学习，使二者能够协同式地去影响最终节点的表示。


    总的来说，GCN模型将学习过程直接构架于图数据之上，为图数据的学习提供了一套端对端的框架，对相关的任务学习具有更好的适应性。


    [\[1\]](#chapter68.xhtml#ch1) 图片来源：https://zh.wikipedia.org/wiki/。


    ## 6.3　GCN是一个低通滤波器


    在图的半监督学习任务中，通常会在相应的损失函数里面增加一个正则项，该正则项需要保证相邻节点之间的类别信息趋于一致，一般情况下，我们选用拉普拉斯矩阵的二次型作为正则约束：


    ![](Images/120-i.jpg)


    其中L表示模型的总损失，L[0]表示监督损失，L[reg]表示正则项，从学习的目标来看，这样的正则项使得相邻节点的分类标签尽量一致，这种物以类聚的先验知识，可以指导我们更加高效地对未标记的数据进行学习。从图信号的角度来看，我们知道该正则项也表示图信号的总变差，减小该项表示我们期望经过模型之后的图信号更加平滑，根据前面第5章中所学的知识，从频域上来看，相当于对图信号做了低通滤波的处理。


    在GCN的损失函数中，我们通常并不会设计这样的正则项。但是有研究表明，引文[\[4\]](../Text/chapter71.xhtml#ff-4)中将GCN视为一种低通滤波器，下面阐述具体的过程：


    回到GCN的核心计算式![](Images/120-2-i.jpg)上，体现图滤波的地方就在于左乘了一个重归一化形式的拉普拉斯矩阵![](Images/120-3-i.jpg)，根据第5章的相关内容可知，要确定是否为低通滤波，我们就必须去研究![](Images/120-4-i.jpg)对应的频率响应函数p（λ）的性质。


    ![](Images/120-5-i.jpg)


    由于![](Images/120-6-i.jpg)可以被正交对角化，我们设![](Images/120-7-i.jpg)的特征值，可以证明![](Images/120-8-i.jpg)[^(\[5\])](../Text/chapter71.xhtml#ff-5)。


    因此式（6.2）变为：


    ![](Images/120-9-i.jpg)


    显然，其频率响应函数为![](Images/120-10-i.jpg)，该函数是一个线性收缩的函数，因此能起到对图信号进行低通滤波的作用。


    如果将信号矩阵X不断左乘K次![](Images/121-i.jpg)，则对应频率响应函数为![](Images/121-2-i.jpg)，图6-9所示为该函数的图像：


    ![](Images/6a9.jpg)


    图6-9　响应函数图像


    从图中可以看到，随着K的增大，频率响应函数在低频段上有着更强的缩放效果，因此是一种更强效应的低通滤波器。这种堆叠式的滤波操作，在一定程度上解释了多层GCN模型对于信号的平滑能力。事实上，为了更好地突出这种能力、减少模型的参数量，在引文^([\[1\]](#chapter69.xhtml#ch1_back)[\[2\]](#chapter69.xhtml#ch2_back))[\[6\]](../Text/chapter71.xhtml#ff-6)中直接将多层GCN退化成![](Images/121-4-i.jpg)。


    为什么要突出对数据的低通滤波呢？或者说，多层GCN的这种滤波效果对于图数据的任务学习会更加高效吗？在引文^([\[3\]](#chapter69.xhtml#ch3_back))中，作者论证了一个关于图数据的假设—输入数据的特征信号包括低频信号与高频信号，低频信号包含着对任务学习更加有效的信息。


    为此，作者在Cora、Citeseer、Pubmed数据集上做了实验，这3个数据集都是论文引用网络，节点是论文，边是论文之间的引用关系。作者设计了一个实验，通过低通滤波截掉数据中的高频信息，然后使用剩下的低频信息进行分类学习，具体过程如下：


    （1）对数据集的![](Images/121-5-i.jpg)进行正交对角化，得到傅里叶基V。


    （2）对输入的信号矩阵增加高斯噪声X←X+N（0，σ²），其中σ=（0，0.01，0.05）。


    （3）计算输入的信号矩阵在前k个最小频率上的傅里叶变换系数![](Images/122-i.jpg)。


    （4）利用逆傅里叶变换重构信号![](Images/122-2-i.jpg)。


    （5）将重构后的信号送到一个两层的MLP网络进行分类学习，并记录准确率。


    图6-10所示为重构信号用的频率分量的比例（前k个最小频率占总频率数的比例）与分类准确率之间的关系图。作为对比实验，使用完整的原始信号矩阵在gfNN模型（引文^([\[4\]](#chapter69.xhtml#ch4_back))中的一种GCN的变体模型）与双层MLP上的分类准确率（3组图中的上部gfNN与中部MLP水平虚线）来进行对比。从该图中可以看出，在3个数据集上，最高的分类准确率集中在仅用最小的前20%的频段恢复信号的实验中，增加高频信息参与信号重构，模型的分类效果会下降。同时，增加高斯噪声会造成分类准确率下降，这种效应随着重构所用的频率分量的比例的增加而增强，这说明了使用低通滤波对数据进行去噪的有效性。作为对比实验，我们可以看到，即使在原始的输入数据上，gfNN也能取得所有实验中的最好效果，这说明gfNN本身就具有低通滤波的作用。


    ![](Images/6a10.jpg)


    图6-10　实验结果^([\[5\]](#chapter69.xhtml#ch5_back))


    从本节的介绍中可以看到，从频域去理解图数据以及GCN都具有十分重要的价值。对数据有效频率成分的分析可以指导我们发现数据的内在规律，从而更好地设计符合特定需求的滤波器，让GCN对于任务的高效学习做到有的放矢。


    [\[1\]](#chapter69.xhtml#ch1) Maehara T.Revisiting Graph Neural Networks：All We
    Have is Low-Pass Filters\[J\].arXiv preprint arXiv：1905.09550，2019.


    [\[2\]](#chapter69.xhtml#ch2) Wu F，Zhang T，Souza Jr A H，et al.Simplifying graph
    convolutional networks\[J\].arXiv preprint arXiv：1902.07153，2019.


    [\[3\]](#chapter69.xhtml#ch3) Maehara T.Revisiting Graph Neural Networks：All We
    Have is Low-Pass Filters\[J\].arXiv preprint arXiv：1905.09550，2019.


    [\[4\]](#chapter69.xhtml#ch4) Maehara T.Revisiting Graph Neural Networks：All We
    Have is Low-Pass Filters\[J\].arXiv preprint arXiv：1905.09550，2019.


    [\[5\]](#chapter69.xhtml#ch5) Maehara T.Revisiting Graph Neural Networks：All We
    Have is Low-Pass Filters\[J\].arXiv preprint arXiv：1905.09550，2019.


    ## 6.4　GCN的问题—过平滑


    引文[\[7\]](../Text/chapter71.xhtml#ff-7)[\[8\]](../Text/chapter71.xhtml#ff-8)都指出了GCN模型无法像视觉任务中的CNN模型一样堆叠很深，一旦使用多层GCN进行学习，相关的任务效果就会急剧下降。这使得在某些场景中，GCN的学习能力将非常有限。


    在引文^([\[1\]](#chapter70.xhtml#ch1_back))中，作者在Core数据集上做了一个实验，直观地展示了多层GCN所遇到的这个问题，如图6-11所示。


    ![](Images/6a11.jpg)


    图6-11　GCN效果随层数增加而发生的变化


    图6-11是Cora数据集分别经过一个1至5层的GCN后节点的表示向量的散点图，数据的原始输入是16维，最后模型的输出层是2维。观察该图，我们可以发现，在一层GCN模型下，两类节点并不能很好地区分，在二层GCN模型下，两类节点已经能秀好地区分，如果继续加深模型的层数，两类节点会逐渐混合在一起，区分度将大大降低。


    通过上面这个例子，我们可以发现，在使用多层GCN之后，节点的区分性变得越来越差，节点的表示向量趋于一致，这使得相应的学习任务变得更加困难。我们将这个现象称为多层GCN的过平滑（Over-Smooth）问题。


    在6.3节中我们论证过，GCN相当于对输入信号做了一个低通滤波的操作，这会使信号变得更加平滑，这也是GCN模型的一个内在优势。但是，过犹不及，多次执行这类对信号不断平滑的操作之后，信号会越来越趋同，也就丧失了节点特征的多样性。下面我们分别从频域和空域视角去理解过平滑问题。


    1.频域视角


    事实上，我们可以从GCN的频率响应函数![](Images/124-i.jpg)中更清楚地看到这一点。


    ![](Images/124-2-i.jpg)


    由于![](Images/124-3-i.jpg)，且当且仅当i=1时，![](Images/124-4-i.jpg)，由于其他的特征值都大于0（这里假设图是全连通图，仅存在一个特征值为0），因此取极限之后的结果为：


    ![](Images/124-5-i.jpg)


    如果设图信号为x，则有：


    ![](Images/124-6-i.jpg)


    其中v[1]是![](Images/124-7-i.jpg)的最小频率![](Images/124-8-i.jpg)对应的特征向量，![](Images/124-9-i.jpg)表示信号x在对应频率![](Images/124-10-i.jpg)的傅里叶系数。


    由于![](Images/125-i.jpg)，即![](Images/125-2-i.jpg)（这里使用到了一个性质—拉普拉斯矩阵L存在值全为1的特征向量，其对应特征值为0）。


    因此，![](Images/125-3-i.jpg)是![](Images/125-4-i.jpg)在![](Images/125-5-i.jpg)处的特征向量，该向量是一个处处相等的向量。所以，如果对一个图信号不断地执行平滑操作，图信号最后就会变得处处相等，也就完全没有可区分性了。


    2.空域视角


    在引文^([\[2\]](#chapter70.xhtml#ch2_back))中，作者从空域角度解释了为什么多层GCN会出现效果不好的现象。从空域来看，GCN的本质是在聚合邻居信息，对于图中的任意节点而言，节点的特征每更新一次，就多聚合了更高一阶邻居节点的信息。如果我们把最高邻居节点的阶数称为该节点的聚合半径，我们可以发现，随着GCN层数的增加，节点的聚合半径也在增长，一旦到达某个阈值，该节点可覆盖的节点几乎与全图节点一致。同时，如果层数足够多，每个节点能覆盖到的节点都会收敛到全图节点，这与哪个节点是无关的。这种情况的出现，会大大降低每个节点的局部网络结构的多样性，对于节点自身特征的学习十分不利。


    图6-12所示为对方块节点的邻居信息进行聚合的结果，不同的是a图中的方块节点处于图的中心，而b图中的方块节点处于图的边缘。在4层GCN之后，a、b两图的方块节点的聚合半径虽然一致，但是覆盖的节点却是非常不一样的，如图中的蓝色节点所示。如果继续增加一层GCN，b图中的节点可覆盖的节点会迅速扩大，从而覆盖图中中心区域的节点，如c图中的蓝色节点所示。这种突变现象导致两个方块节点聚合的节点网络趋于一致，模型对于a图、b图中两个节点的区分将会变得十分困难。


    关于如何应对过平滑，上文基于聚合半径与模型层数的关系，提出了自适应性聚合半径的学习机制，其实现的方式十分直观，就是通过增加跳跃连接来聚合模型的每层节点的输出，聚合后的节点特征拥有混合性的聚合半径，上层任务可对其进行选择性的监督学习，这样对于任意一个节点而言，既不会因为聚合半径过大而出现过平滑的问题，也不会因为聚合半径过小，使得节点的结构信息不能充分学习（见图6-13）。


    ![](Images/6a12.jpg)


    图6-12　对不同节点的聚合结果^([\[3\]](#chapter70.xhtml#ch3_back))


    ![](Images/6a13.jpg)


    图6-13　聚合过程^([\[4\]](#chapter70.xhtml#ch4_back))


    图6-13说明了这种层级聚合的学习机制，在图6-13中，4层图模型的输出都会通过跳跃连接与最终的聚合层相连，聚合操作可以取如拼接、平均池化、最大池化等，聚合层的输出会作为整个模型的输出送到相应的监督任务中进行学习。


    另一种方法是回到频率视角去调节图滤波器的值，在引文[\[9\]](../Text/chapter71.xhtml#ff-9)中，使用了重新分配权重的方式来增加![](Images/127-i.jpg)中节点自连接的权重：


    ![](Images/127-2-i.jpg)


    如公式（6.7）所示，可以通过调节p的值对节点自身的权重进行重新分配。当p接近1时，模型趋向于不使用自身的信息，从频域来看，这加速了模型低通滤波的效应；当p接近0时，模型趋向于不聚合邻居的信息，从频域来看，这减缓了模型低通滤波的效应。


    [\[1\]](#chapter70.xhtml#ch1) Li Q，Han Z，Wu X M.Deeper insights into graph convolutional
    networks for semi-supervised learning\[C\]//Thirty-Second AAAI Conference on Artificial
    Intelligence.2018.'
