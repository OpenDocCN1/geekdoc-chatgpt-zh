    ## 9.3　基于图自编码器的推荐系统


    下面讲解一个基于图自编码器实现简单的推荐任务[^(\[14\])](../Text/chapter104.xhtml#ii-14)的例子。推荐系统要建立的是用户与商品之间的关系，这里我们以简化后的用户对商品的评分为例进行介绍，如图9-5假设用户与商品之间的交互行为只存在评分，分值从1分到5分。如果用户`u`对商品`v`进行评分，评分为`r`，就是说用户`u`与商品`v`之间存在一条边，边的类型为`r`，其中`r∈R`。基于这种交互关系对用户进行商品推荐实际上就是要预测哪些商品与用户之间可能存在边，这样的问题称为边预测问题。对于这种边预测问题，我们将其看作矩阵补全问题，用户与商品之间的交互行为构成了一个二部图，可以通过用户与商品的邻接矩阵表示为`A`，矩阵中的值就是评分，推荐就是要对矩阵没有评分的位置进行预测。


    ![](Images/9a5.jpg)


    图9-5　基于图自编码器的推荐^([\[1\]](#chapter103.xhtml#ch1_back))


    图9-5为基于图自编码器的推荐系统的架构图。如图所示，首先将用户–商品矩阵转化成用户–商品二部图，然后使用图自编码器对二部图进行建模，这里使用`GCN`作为编码器，然后通过解码器对邻接矩阵中的边信息进行重构，由此完成边预测的任务。对于邻接矩阵`A`按照不同的评分`r`进行分解，可以得到每个评`r`分对应的一个邻接矩阵`A[r]`，它在评分为`V`的位置上值为1，否则为0。请注意，在这里将不同的评分当作不同的关系进行处理，而不是当作边上的属性进行预测。接下来，使用`R-GCN`双重聚合的思路对节点的表示进行学习：先对同一关系的邻居进行聚合，再对所有的邻居进行聚合。用式子表示如（9.21）所示：


    ![](Images/189-i.jpg)


    其中`W[r]`是每类评分对应的权重参数，`c[ij]`是一个归一化参数，可以选择`|N[i]|`或者`√(|N[i]|·|N[j]|)`。第二重聚合时的函数为`Agg`，可以选择拼接、求和或者更复杂的聚合函数，代码清单9-1是基于拼接的编码器实现，代码清单9-2是基于求和的编码器实现。


