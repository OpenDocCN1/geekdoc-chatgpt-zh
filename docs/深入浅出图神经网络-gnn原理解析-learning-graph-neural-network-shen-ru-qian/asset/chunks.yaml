- raw: "8.2.1节中介绍的基于图坍缩的池化机制，是一个节点不断聚合成簇的过程，而本节要介绍的基于TopK的池化机制，是一个不断丢弃节点的过程，其抓住的是图不同尺度的信息。和CNN中基于局部滑窗的池化操作不同的是，TopK池化将作用域放到全图节点上。具体来说，首先设置一个表示池化率的超参数k，k∈（0，1），接着学习出一个表示节点重要度的值z并对其进行降排序，然后将全图中N个节点下采样至kN个节点。用公式表示如下：\n\
    \n![](Images/166-i.jpg)\n\nX[i，：]表示按照向量i的值对特征矩阵进行行切片，A[i，i]表示按照向量i的值对邻接矩阵同时进行行切片与列切片。不同于DIFFPOOL，若将N个节点分配给kN个簇，会使得模型需要kN²的空间复杂度来分配簇信息，而基于Topk的池化机制，每次只需要从原图中丢弃（1–k）N的节点即可。\n\
    \n关于如何学习节点的重要度，引文[\\[5\\]](../Text/chapter97.xhtml#hh-5)和引文[\\[6\\]](../Text/chapter97.xhtml#hh-6)分别给出了不同的方法。在引文^([\\\
    [1\\]](#chapter94.xhtml#ch1_back))中，作者为图分类模型设置了一个全局的基向量p，将节点特征向量在该基向量上的投影当作重要度：\n\
    \n![](Images/166-2-i.jpg)\n\n这样的一个投影机制，具有以下双重作用：\n\n（1）可以以投影的大小来确定TopK的排序；\n\n\
    （2）投影大小还起到了一个梯度门限的作用，投影较小的节点仅有较小的梯度更新幅度，相对地，投影较大的节点会获得更加充分的梯度信息。\n\n全部细节用公式表示如下：\n\
    \n![](Images/166-3-i.jpg)\n\n在特征矩阵的更新中点乘了一个tanh（z），这相当于利用节点的重要度对节点特征做了一次收缩变换，进一步强化了对重要度高的节点的梯度学习。该文将上述过程称为gpool层。\n\
    \n相较于基于图坍缩的池化机制对图中所有节点不断融合学习的过程，gpool层采取了层层丢弃节点的做法来提高远距离节点的融合效率，但是这种做法会使得其缺乏对所有节点进行有效信息融合的手段。因此，为了实现上述目的，作者选择在每一个gpool层之后跟随一个读出层，实现对该尺度下的图的全局信息的一次性聚合。读出层的具体实现方式是将全局平均池化与全局最大池化拼接起来：\n\
    \n![](Images/167-i.jpg)\n\n最终，为了得到全图的表示，将各层的s相加：\n\n![](Images/167-2-i.jpg)\n\n\
    图8-4给出了一种可能的模型结构：\n\n![](Images/8a4.jpg)\n\n图8-4　基于TopK池化的图分类模型结构\n\n图8-4中的模型使用了两层gpool层，相应地也设置了两层读出层，之后对两层读出层的输出进行相加得到全图的向量表示，然后送到一个MLP里面进行图分类的任务学习。\n\
    \n关于丢弃节点的池化机制，引文^([\\[2\\]](#chapter94.xhtml#ch2_back))给出了一种新的方式：自注意力图池化（SAGPool），该方法使用了一个GNN对节点的重要度进行学习，相较于gpool全局基向量的设计，这种基于GNN的方式更好地利用图的结构信息对节点的重要度进行学习。在该文中，作者也基于SAGPool层与读出层设计了两套高效的图分类模型，这一部分的细节，我们放到相应的实战中去讲解，这里不再赘述。\n\
    \n[\\[1\\]](#chapter94.xhtml#ch1) Cangea C，VeličkovićP，JovanovićN，et al.Towards\
    \ sparse hierarchical graph classifiers\\[J\\].arXiv preprint arXiv：1811.01287，2018.\n\
    \n[\\[2\\]](#chapter94.xhtml#ch2) Lee J，Lee I，Kang J.Self-Attention Graph Pooling\\\
    [J\\].arXiv preprint arXiv：1904.08082，2019.\n\n### 8.2.3　基于边收缩的池化机制\n\n本节我们来介绍基于边收缩的池化机制—EdgePool[^(\\\
    [7\\])](../Text/chapter97.xhtml#hh-7)，该方法将边收缩这一图论领域重要的变换操作与端对端的学习机制结合起来，实现了对图数据的层次化池化操作。概括地说，该方法迭代式地对每条边上的节点进行两两归并形成一个新的节点，同时保留合并前两个节点的连接关系到新节点上。这里存在一个问题：每个节点有多条边，但是每个节点只能从属于一条边进行边收缩，那么该如何选择每个节点所从属的边呢？为此，EdgePool对每条边设计了一个分数，依据该分数进行非重复式的挑选与合并。具体操作如下：\n\
    \n对每条边，计算原始分数r：\n\n![](Images/168-i.jpg)\n\n由于每个节点选择哪条边，需要从其局部邻居出发进行考虑，所以，我们对原始分数沿邻居节点进行归一化：\n\
    \n![](Images/168-2-i.jpg)\n\n得到上述分数之后，接下来对所有的s[ij]进行排序，依次选择该分数最高的且未被选中的两个节点进行收缩操作。细节如图8-5所示：\n\
    \n![](Images/8a5.jpg)\n\n图8-5　EdgePool过程^([\\[1\\]](#chapter95.xhtml#ch1_back))\n\
    \n在图8-5中，a图计算了图中每条边的原始分数r，对于该无向图，我们将方向进行了双向复制，对于有向图则仅需按方向进行后续操作，b图计算了e^r，c图沿着入边方向对每个节点进行归一化操作，图中加黑的边表示被选中的进行收缩的边。需要注意的是，在确定<v[2]，v[1]\\\
    >边的时候，尽管<v[2]，v[3]\\>边上具有更高的分数0.8，但是v[3]节点已经被选择与v[4]节点进行合并，因此选择分数次高的<v[2]，v[1]\\\
    >边进行收缩，d图展示了合并之后的结果。\n\n合并之后的节点特征，可以使用求和的方式表示：\n\n![](Images/169-i.jpg)\n\n其中h[ij]表示v[i]与v[j]节点合并后的新节点的特征向量，在计算该值的时候，与前面诸多方法一样，同样使用了分数s对节点特征进行了收缩处理。如果边上有特征需要处理的话，s[ij]与h[ij]的计算可以建立在RDF三元组之上，具体形式读者可自行思考。\n\
    \nEdgePool与DIFFPOOL一样，都是不断对图中所有节点进行融合学习，不同的是DIFFPOOL需要自行设置聚类簇数，而EdgePool利用边收缩将节点归并比率严格控制在0.5，另外，正是因为利用了边收缩的原理，EdgePool仅将相近的邻居节点进行归并，这种做法具有如下优点：节点的融合都是从边进行的，这契合了图的结构信息，更加合理；同时该操作也保留了融合之后图中连接的稀疏性，空间复杂度更低。作为一种端对端的池化机制，EdgePool也可以被广泛地整合到各个GNN模型中，以完成对图分类任务的学习。\n\
    \n[\\[1\\]](#chapter95.xhtml#ch1) Diehl F.Edge Contraction Pooling for Graph Neural\
    \ Networks\\[J\\].arXiv preprint arXiv：1905.10990，2019.\n\n## 8.3　图分类实战\n\n本节我们通过代码来实现基于自注意力的池化机制（Self-Attention\
    \ Pooling）。这种方法的思路是通过图卷积从图中自适应地学习到节点的重要性。具体来说，使用第5章中定义的图卷积方式，可以为每个节点赋予一个重要性分数，如式（8.31）所示。\n\
    \n![](Images/169-2-i.jpg)\n\n其中σ表示激活函数，![](Images/170-i.jpg)表示增加了自连接的邻接矩阵，X表示节点的特征，Θ[att]∈R^(N×1)是权重参数，这也是自注意力池化层中唯一引入的参数。关于上述图卷积的实现，参考5.4节具体的代码实现，这里不再赘述。\n\
    \n根据节点重要度分数和拓扑结构可以进行池化操作，如式（8.19）所示，舍弃掉部分不太重要的节点，对邻接矩阵和节点特征进行更新，得到池化结果。首先来看如何根据式（8.19）实现节点的选择。代码片段如代码清单8-1所示：\n\
    \n代码清单8-1　根据节点重要度分数进行池化操作\n\n* * *\n\n```\nimport os\nimport urllib\nimport torch\n\
    import torch.nn as nn\nimport torch.nn.init as init\nimport torch.nn.functional\
    \ as F\nimport torch.utils.data as data\nimport numpy as np\nimport scipy.sparse\
    \ as sp\nfrom zipfile import ZipFile\nfrom sklearn.model_selection import train_test_split\n\
    import pickle\n\ndef top_rank(attention_score, graph_indicator, keep_ratio):\n\
    \    \"\"\"基于给定的attention_score, 对每个图进行pooling操作\n    为了直观地体现pooling过程，我们将每个图单独进行池化，最后再将它们级联起来进行下一步计算\n\
    \    \n    Arguments:\n    ----------\n        attention_score：torch.Tensor\n\
    \            使用GCN计算出的注意力分数，Z = GCN(A, X)\n        graph_indicator：torch.Tensor\n\
    \            指示每个节点属于哪个图\n        keep_ratio: float\n            要保留的节点比例，保留的节点数量为int(N\
    \ * keep_ratio)\n    \"\"\"\n    graph_id_list = list(set(graph_indicator.cpu().numpy()))\n\
    \    mask = attention_score.new_empty((0,), dtype=torch.bool)\n    for graph_id\
    \ in graph_id_list:\n        graph_attn_score = attention_score[graph_indicator\
    \ == graph_id]\n        graph_node_num = len(graph_attn_score)\n        graph_mask\
    \ = attention_score.new_zeros((graph_node_num,),\n                           \
    \                     dtype=torch.bool)\n        keep_graph_node_num = int(keep_ratio\
    \ * graph_node_num)\n        _, sorted_index = graph_attn_score.sort(descending=True)\n\
    \        graph_mask[sorted_index[:keep_graph_node_num]] = True\n        mask =\
    \ torch.cat((mask, graph_mask))\n    return mask\n```\n\n* * *\n\n函数top\\_rank接收3个参数，一是使用GCN得到的节点重要度分数attention\\\
    _score；二是指示每个节点属于哪个图的参数graph\\_indicator，这里我们将多个需要分类的图放在一起进行批处理，以提高运算速度，graph\\\
    _indicator里面包含的数据为\\[0，0，...，0，1，1，...，1，2，2，...，2...\\]。需要注意的是，graph\\_indicator的标识值需要进行升序排列，同时属于同一个图的节点需要连续排列在一起；三是超参数keep\\\
    _ratio，表示每次池化需要保留的节点比例，这是针对单个图而言的，不是整个批处理中所有的数据。实现逻辑上根据graph\\_indicator依次遍历每个图，取出该图对应的注意力分数，并进行排序得到要保留的节点索引，将这些位置的索引设置为True，得到每个子图节点的掩码向量。将所有图的掩码拼接在一起得到批处理中所有节点的掩码，作为函数的返回值。\n\
    \n接下来，根据得到的节点掩码对图结构和特征进行更新。图结构的更新是根据掩码向量对邻接矩阵进行索引，得到保留节点之间的邻接矩阵，再进行归一化，作为后续GCN层的输入。因此我们定义两个功能函数normalization（adjacency）和filter\\\
    _adjacency（adjacency，mask）。其中normalization（adjacency）接收一个scipy.sparse.csr\\_matrix，对它进行规范化并转换为torch.sparse.FloatTensor。另一个函数filter\\\
    _adjacency（adjacency，mask）接收两个参数，一个是池化之前的邻接矩阵adjacency，它的类型为torch.sparse.FloatTensor，另一个是函数top\\\
    _rank输出的节点的掩码mask。为了利用sicpy.sparse提供的切片索引，这里将池化之前的adjacency转换为scipy.sparse.csr\\\
    _matrix，然后通过掩码mask进行切片，得到池化后的节点之间的邻接关系，随后再使用函数normalization进行规范化，作为下一层图卷积的输入。如代码清单8-2所示：\n\
    \n代码清单8-2　图结构更新\n\n* * *\n\n```\ndef normalization(adjacency):\n    \"\"\"计算 L=D^-0.5\
    \ * (A+I) * D^-0.5, \n    输入为scipy.sparse, 输出为torch.sparse.FloatTensor\"\"\"\n\
    \    adjacency += sp.eye(adjacency.shape[0])    # 增加自连接\n    degree = np.array(adjacency.sum(1))\n\
    \    d_hat = sp.diags(np.power(degree, -0.5).flatten())\n    L = d_hat.dot(adjacency).dot(d_hat).tocoo()\n\
    \    # 转换为 torch.sparse.FloatTensor\n    indices = torch.from_numpy(np.asarray([L.row,\
    \ L.col])).long()\n    values = torch.from_numpy(L.data.astype(np.float32))\n\
    \    tensor_adjacency = torch.sparse.FloatTensor(indices, values, L.shape)\n \
    \   return tensor_adjacency\n\ndef filter_adjacency(adjacency, mask):\n    device\
    \ = adjacency.device\n    mask = mask.cpu().numpy()\n    indices = adjacency.coalesce().indices().cpu().numpy()\n\
    \    num_nodes = adjacency.size(0)\n    row, col = indices\n    maskout_self_loop\
    \ = row != col\n    row = row[maskout_self_loop]\n    col = col[maskout_self_loop]\n\
    \    sparse_adjacency = sp.csr_matrix((np.ones(len(row)), (row, col)),\n     \
    \                                shape=(num_nodes, num_nodes), dtype=np.float32)\n\
    \    filtered_adjacency = sparse_adjacency[mask, :][:, mask]\n    return normalization(filtered_adjacency).to(device)\n\
    ```\n\n* * *\n\n利用上面介绍的这些功能函数，就可以实现自注意力池化层，该层的输出为池化之后的特征、节点属于哪个子图的标识以及规范化的邻接矩阵。如代码清单8-3所示：\n\
    \n代码清单8-3　基于自注意力机制的池化层\n\n* * *"
