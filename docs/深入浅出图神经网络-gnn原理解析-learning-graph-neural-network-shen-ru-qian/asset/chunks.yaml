    ### 3.4.3 ResNet


    残差网络（Residual Network，`ResNet`）[^13]的提出对深度学习来说又是一大飞跃。它在 ILSVRC 2015 和 COCO 2015
    上取得了非常好的成绩，并再一次刷新了 ImageNet 的历史。它首次将深度网络的深度增加到了上百层并成功地进行了训练，后来的很多网络结构都受到了它的启发。`ResNet`
    可以说是目前最流行的网络结构之一。


    网络的深度对模型的性能来说很重要，随着网络层数的增加，模型可以进行更加复杂的特征模式提取，所以直观上我们会觉得模型越深，效果会越好。但是通过实验发现，随着网络的加深，训练集的准确率反而下降了，如图
    3-19 所示。在训练集和测试集上，56 层的网络比 20 层网络的效果更差，这不是因为模型过拟合了，这个问题称为模型退化问题（degradation problem），它是由于优化困难导致的。


