    1. `XW`是对属性信息的仿射变换，学习了属性特征之间的交互模式；

    2. `![](img/118-2-i.jpg)`从空域来看是聚合邻居节点的过程，代表了对节点局部结构信息的编码。


    为了更进一步说明 GCN 对于图中的结构信息的学习能力，我们来看一个经典的图论问题—图的同构问题（`graph isomorphism problem`），即给定两个图，判断这两个图是否完全等价。


    ![](img/6a8.jpg)


    从图 6-8 中我们可以发现，即使看上去并不相似的两个图，也有可能是完全等价的。从同构图的定义中我们可以看到，要想解决这个问题，需要考量的是算法对图结构信息的分辨能力。一个经典的解法就是`Weisfeiler-Lehman
    算法`[²]，`Weisfeiler-Lehman 算法`是一个迭代式的算法，其算法流程如下所示：


    对于图上任意一个节点`v[i]`：


    1. 获取邻居节点`v[i] ∈ N(v[i])`的标签`h[j]`；

    2. 更新`v[i]`的标签`![](img/119-i.jpg)`，其中`hash(.)`是一个单射函数（一对一映射）。


    我们可以看到，上述过程与节点层面的 GCN 计算过程基本一致：迭代式地聚合邻居节点的特征，从而更新当前节点的特征。从这个角度来看，GCN 近似于一种带参的、支持自动微分的`Weisfeiler-Lehman
    算法`。在引文[3]中介绍了一种 GCN 的衍生模型—`Graph Isomorphism Network（GIN）`，实验证明，其在判断图同构的问题上，能力近乎等价于`Weisfeiler-Lehman
    算法`。


    在 GCN 模型中，通过堆叠图卷积层，上述属性信息的编码学习与结构信息的编码学习被不断地交替进行，从而完成对图数据中更加复杂的模式学习。GCN 相较于上述两种方法，有如下两点优势：


    1. GCN 对表示学习和任务学习一起进行端对端的优化。在前述两种方法中，节点的特征向量一旦被拼接起来就会被固化下来，下游任务学习中产生的监督信号并不能有效指导图数据的表示学习，这可能会使节点的特征表示对于下游的任务不是最高效的。相反，GCN
    对于图数据的建模并没有切分成两步来完成，对于节点的表示学习与下游的任务学习被放到一个模型里面进行端对端学习，整个模型的监督信号同时指导着任务层（如分类层）和
    GCN 层的参数更新，节点的特征表示与下游任务之间具有更好的适应性。

    2. GCN 对结构信息与属性信息的学习是同时进行的，并没有进行分拆和解构。通常来说，属性信息与结构信息具有很好的互补关系，对于一些结构稀疏的图来说，属性信息的补充可以很好地提高模型对节点表示学习的质量，另外，结构信息蕴含着属性信息中所没有的知识，对节点的刻画具有十分重要的作用。GCN
    将结构信息与属性信息放进一个网络层里面同时进行学习，使二者能够协同式地去影响最终节点的表示。


    总的来说，GCN 模型将学习过程直接构架于图数据之上，为图数据的学习提供了一套端对端的框架，对相关的任务学习具有更好的适应性。


    [¹]: 图片来源：https://zh.wikipedia.org/wiki/。


    ## 6.3　GCN 是一个低通滤波器


    在图的半监督学习任务中，通常会在相应的损失函数里面增加一个正则项，该正则项需要保证相邻节点之间的类别信息趋于一致，一般情况下，我们选用拉普拉斯矩阵的二次型作为正则约束：


    `![](img/120-i.jpg)`


    其中`L`表示模型的总损失，`L[0]`表示监督损失，`L[reg]`表示正则项。从学习的目标来看，这样的正则项使得相邻节点的分类标签尽量一致，这种物以类聚的先验知识，可以指导我们更加高效地对未标记的数据进行学习。从图信号的角度来看，我们知道该正则项也表示图信号的总变差，减小该项表示我们期望经过模型之后的图信号更加平滑，根据前面第
    5 章中所学的知识，从频域上来看，相当于对图信号做了低通滤波的处理。


    在 GCN 的损失函数中，我们通常并不会设计这样的正则项。但是有研究表明，引文[4]中将 GCN 视为一种低通滤波器，下面阐述具体的过程：


    回到 GCN 的核心计算式`![](img/120-2-i.jpg)`上，体现图滤波的地方就在于左乘了一个重归一化形式的拉普拉斯矩阵`![](img/120-3-i.jpg)`，根据第
    5 章的相关内容可知，要确定是否为低通滤波，我们就必须去研究`![](img/120-4-i.jpg)`对应的频率响应函数`p(λ)`的性质。


    `![](img/120-5-i.jpg)`


    由于`![](img/120-6-i.jpg)`可以被正交对角化，我们设`![](img/120-7-i.jpg)`的特征值，可以证明`![](img/120-8-i.jpg)`[⁵]。


    因此式（6.2）变为：


    `![](img/120-9-i.jpg)`


    显然，其频率响应函数为`![](img/120-10-i.jpg)`，该函数是一个线性收缩的函数，因此能起到对图信号进行低通滤波的作用。


    如果将信号矩阵`X`不断左乘`K`次`![](img/121-i.jpg)`，则对应频率响应函数为`![](img/121-2-i.jpg)`，图 6-9
    所示为该函数的图像：


    ![](img/6a9.jpg)


    从图中可以看到，随着`K`的增大，频率响应函数在低频段上有着更强的缩放效果，因此是一种更强效应的低通滤波器。这种堆叠式的滤波操作，在一定程度上解释了多层 GCN
    模型对于信号的平滑能力。事实上，为了更好地突出这种能力、减少模型的参数量，在引文[6]中直接将多层 GCN 退化成`![](img/121-4-i.jpg)`。


    为什么要突出对数据的低通滤波呢？或者说，多层 GCN 的这种滤波效果对于图数据的任务学习会更加高效吗？在引文[3]中，作者论证了一个关于图数据的假设—输入数据的特征信号包括低频信号与高频信号，低频信号包含着对任务学习更加有效的信息。


    为此，作者在`Cora`、`Citeseer`、`Pubmed`数据集上做了实验，这 3 个数据集都是论文引用网络，节点是论文，边是论文之间的引用关系。作者设计了一个实验，通过低通滤波截掉数据中的高频信息，然后使用剩下的低频信息进行分类学习，具体过程如下：


    1. 对数据集的`![](img/121-5-i.jpg)`进行正交对角化，得到傅里叶基`V`。

    2. 对输入的信号矩阵增加高斯噪声`X ← X + N(0, σ²)`，其中`σ = (0, 0.01, 0.05)`。

    3. 计算输入的信号矩阵在前`k`个最小频率上的傅里叶变换系数`![](img/122-i.jpg)`。

    4. 利用逆傅里叶变换重构信号`![](img/122-2-i.jpg)`。

    5. 将重构后的信号送到一个两层的`MLP`网络进行分类学习，并记录准确率。


    图 6-10 所示为重构信号用的频率分量的比例（前`k`个最小频率占总频率数的比例）与分类准确率之间的关系图。作为对比实验，使用完整的原始信号矩阵在`gfNN`模型（引文[4]中的一种
    GCN 的变体模型）与双层`MLP`上的分类准确率（3 组图中的上部`gfNN`与中部`MLP`水平虚线）来进行对比。从该图中可以看出，在 3 个数据集上，最高的分类准确率集中在仅用最小的前
    20%的频段恢复信号的实验中，增加高频信息参与信号重构，模型的分类效果会下降。同时，增加高斯噪声会造成分类准确率下降，这种效应随着重构所用的频率分量的比例的增加而增强，这说明了使用低通滤波对数据进行去噪的有效性。作为对比实验，我们可以看到，即使在原始的输入数据上，`gfNN`也能取得所有实验中的最好效果，这说明`gfNN`本身就具有低通滤波的作用。


    ![](img/6a10.jpg)


    从本节的介绍中可以看到，从频域去理解图数据以及 GCN 都具有十分重要的价值。对数据有效频率成分的分析可以指导我们发现数据的内在规律，从而更好地设计符合特定需求的滤波器，让
    GCN 对于任务的高效学习做到有的放矢。


