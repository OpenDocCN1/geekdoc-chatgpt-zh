    3.PReLU


    PReLU（Parametric ReLU）[^(\[4\])](../Text/chapter26.xhtml#bb-4)在LeakyReLU的基础上更进一步，它将LeakyReLU中的超参数λ改进为可以训练的参数，并且每个神经元可以使用不同的参数。对于单个神经元，PReLU的定义如式（2.19）所示：


