    # Classification Problems and Regression Problems


    **Classification Problem**: Refers to the model output being discrete values.
    For example, in risk control scenarios, the model usually outputs two categories:
    normal/anomalous; in image classification tasks, the model outputs the specific
    category to which the image belongs.


    **Regression Problem**: Refers to the model output being continuous values. For
    example, in e-commerce ad recommendation, the model often outputs the probability
    of a user clicking on a certain product; the higher the probability, the more
    the model believes the user is inclined to click on that product.


    # 2.1.2 Overview of Machine Learning Workflow


    A complete machine learning workflow usually involves multiple stages, which are
    interdependent. Below, a concrete example is used to intuitively illustrate the
    entire workflow, followed by a mathematical description of the whole process.


    ## 1. Example


    In the e-commerce domain, we need to classify products. To simplify the problem,
    assume there is only a batch of product image data, categorized into down jackets,
    wool coats, dresses, hoodies, etc. We need to build a model, use this batch of
    product image data to train the model, and obtain a predictive model that can
    classify unknown images. For example, correctly predicting the category of a new
    style down jacket as "down jacket". To achieve the above functions, the following
    steps are typically required in machine learning.


    ### (1) Extract Product Image Features


    In computers, images are stored discretely as pixels. The information carried
    by a single pixel makes it difficult for the model to learn directly. To enable
    the computer to accurately recognize and classify, some discriminative features
    need to be extracted, such as the color and style of the clothes. These features
    can be manually defined, a process called **Feature Engineering**, or automatically
    extracted using algorithms. The former is a necessary step in traditional machine
    learning and holds a pivotal position; a typical method of the latter is **Deep
    Learning**, and readers can learn how to use deep learning methods to solve this
    problem in Chapter 3.


    ### (2) Build Model


    After defining features, a suitable model needs to be selected for modeling. Traditional
    machine learning models include `Logistic Regression`, `Random Forest`, etc.;
    deep learning-based methods include `Multi-Layer Perceptron`, `Convolutional Network`,
    etc. The model can be viewed as a complex function `y = f(X; W)`, whose purpose
    is to establish a mapping from input to label `y`, where `X` is the features defined
    earlier, and `W` are the parameters defining the model.


    ### (3) Determine Loss Function and Perform Optimization Solving


    Selecting a model only determines a model form, e.g., using `Logistic Regression`,
    which still contains weights. Before these weights are determined, it cannot be
    used for correct prediction. So how to adjust the model so it can make meaningful
    predictions? First, a numerical value is needed to quantify the correctness of
    the model''s prediction. The **Loss Function** measures the degree of difference
    between the model output and the label. When the prediction result differs greatly
    from the label, the loss function value increases; conversely, it decreases. Based
    on the value given by the loss function, optimization methods can be used to adjust
    the model to continuously reduce the loss value.


    ## 2. Mathematical Model


    Taking the classification model represented by the above example as an example,
    the mathematical model for classification is given. Assume there is a training
    set containing `N` samples, represented by the set `X = {(x[i], y[i]) | i = 1,
    2, ..., N}`. Each sample `x[i]` has a corresponding label `y[i]`, where `x[i]
    ∈ R^d` indicates each sample is a `d`-dimensional vector, and the label `y[i]`
    is a series of discrete values `y[i] ∈ Y = {0, 1, 2, ..., K}`, representing the
    category to which sample `x[i]` belongs, and `K` is the number of categories.
    Our goal is to build a model capable of performing classification, i.e., we need
    a model: `f: R^d → R^K`, where the input is a `d`-dimensional vector, mapped through
    `f`, outputting the probability distribution `P(Y|x[i]) = f(x[i]; θ)` on each
    category, so that the category with the maximum probability can be taken as the
    result, i.e., `argmax_k P(Y = c[k] | x[i])`.


    Then the question is, how to evaluate the quality of a classification model? A
    relatively direct method is to focus on the model''s results on the training data,
    evaluating the model''s quality by comparing whether `argmax_k P(Y = c[k] | x[i])`
    is the same as the sample''s true label `y[i]`. If the model can correctly predict
    most samples in the training set, it might be a good model; otherwise, it might
    be a poor model. Such qualitative description is not intuitive; we need a method
    to quantify this difference, and that method is the **Loss Function**.


    **Loss Function** (loss function) is used to measure the degree of difference
    between the model''s predicted value `ŷ` and the true value `y`. It is a non-negative
    real-valued function, usually denoted as `L(y, f(x; θ))`. In machine learning,
    the model is trained by minimizing the loss function on the training set `X`,
    adjusting the parameters `θ` of `f` to reduce the loss function value. When the
    loss function reaches its minimum value, a good model is found. This process is
    called **Optimization Solving**. The entire process can be represented by Equation
    (2.1):


    ```

    θ* = argmin_θ (1/N Σ_{i=1}^N L(y[i], f(x[i]; θ)) + λΦ(θ))

    ```


    Here, the preceding mean function represents the **Empirical Risk Function**,
    `L` represents the **Loss Function**, and the following `Φ` is the **Regularization
    Term** (regularizer) or **Penalty Term** (penalty term), which can be `L1`, `L2`,
    or other regularization functions. The above formula represents finding the `θ`
    value that minimizes the objective function. The loss function aims to represent
    the degree of difference between the model output `f(x)` and the true value `Y`.
    Different loss functions have different representational meanings, meaning that
    in the process of minimizing the loss function, the way `f(x)` approaches `Y`
    differs, and the results obtained may also differ.


    In actual optimization, it is often impossible to find suitable parameters in
    one step. Therefore, in machine learning, iterative methods are usually used to
    gradually approach the optimal value. The entire process is shown in Figure 2-1:
    use model `f(X; θ[0])` to predict on training set `X`, where `θ[0]` represents
    initial parameters; then calculate the loss value using the loss function on the
    predicted results and the sample''s true labels; the optimization method adjusts
    parameters based on the current loss value to obtain `θ[1]`; then repeat the above
    process, continuously iterating, until the algorithm finds the model parameters
    where the loss might be the lowest. Usually, iteration continues until the overall
    loss no longer changes or changes extremely slowly. At this point, we can say
    the model has converged.


    ![Figure 2-1 Machine Learning Algorithm Iteration Process](img/2a1.jpg)


    It should be noted that the purpose of training a model is not to achieve good
    results on the training set, but to hope the model learns from the training set
    to face unknown samples and make predictions on new samples. An extreme case is
    obtaining a model that perfectly fits the training data, correctly predicting
    all training samples, i.e., its loss value is 0, but performs poorly on new sample
    prediction. This phenomenon in machine learning is called **Overfitting**. Another
    situation is where the model "tries its best" but cannot achieve satisfactory
    results on the training samples. This phenomenon is called **Underfitting**.


    The loss function and optimization algorithm are two important components of machine
    learning. Next, we will first introduce several commonly used loss functions,
    then introduce a class of widely used optimization methods—Gradient Descent.


    # 2.1.3 Common Loss Functions


    The loss function is the foundation for guiding the model to learn effectively.
    Based on different tasks, different loss functions can be selected or designed
    so that the model can mine valuable information from data. Below we introduce
    several common loss functions.


    ## 1. Squared Loss Function


    The definition of squared loss is shown in Equation (2.2):


    ```

    L = 1/N Σ_{i=1}^N (y[i] - f(x[i]; θ))²

    ```


    Where `N` is the number of samples. It measures the squared difference between
    the model''s predicted results and the labels, commonly used for regression problems.


    ## 2. Cross-Entropy Loss


    **Cross-Entropy** loss is commonly used in classification problems. Classification
    models usually output a probability distribution of categories. Cross-entropy
    measures the degree of difference between the true distribution of data labels
    and the probability distribution predicted by the classification model. The smaller
    the loss value, the smaller the difference between them, and the more accurately
    the model can predict. Its discrete form is as follows:


    ```

    H(p, q) = - Σ_i p(y[i]|x[i]) log q(y[i]|x[i])

    ```


    Where `p` and `q` represent the true distribution of data labels and the distribution
    given by the model prediction, respectively. `p(y[i]|x[i])` represents the true
    distribution of the label of sample `x[i]`. Generally, sample `x[i]` belongs to
    only one category `c[k]`, so `p(y[i] = c[k]|x[i]) = 1`, and the probability on
    other categories is 0. `q(y[i]|x[i])` represents the probability distribution
    predicted by the model on each category given sample `x[i]`. If the label of sample
    `x[i]` is `c[k]`, then Equation (2.3) can be simplified to Equation (2.4):


    ```

    L = - log q(y[i] = c[k]|x[i])

    ```


    It can be seen that in this case, minimizing the cross-entropy loss is equivalent
    to maximizing the likelihood probability of the sample label.


    For binary classification `y[i] ∈ {0, 1}`, using `Logistic Regression` can obtain
    the probability `q(y[i] = 1|x[i])` of sample `x[i]` belonging to category 1. Then
    the probability of the sample belonging to category 0 is `1 - q(y[i] = 1|x[i])`.
    Using Equation (2.4), the loss function of `Logistic Regression` can be obtained,
    as shown in Equation (2.5), which is also called **Binary Cross-Entropy Loss**.


    ```

    L = - [y[i] log q(y[i] = 1|x[i]) + (1 - y[i]) log (1 - q(y[i] = 1|x[i]))]

    ```


    # 2.1.4 Gradient Descent Algorithm


    ## 1. Principle of Gradient Descent Algorithm


    Many problems in machine learning are essentially optimization problems—finding
    suitable parameters to minimize the loss function value. There are many mature
    methods for solving such optimization problems. **Gradient Descent** is a classic
    method. It uses gradient information to iteratively adjust parameters to find
    a suitable solution.


    For a multivariate function `f(x)`, the gradient is defined as the vector composed
    of partial derivatives with respect to each independent variable, denoted as `f''(x)`,
    as shown in Equation (2.6):


    ```

    f''(x) = [∂f/∂x_1, ∂f/∂x_2, ..., ∂f/∂x_n]^T

    ```


    Examine the Taylor expansion of `f(x + Δx)` at `x`, as shown in Equation (2.7):


    ```

    f(x + Δx) ≈ f(x) + f''(x)^T Δx

    ```


    To make `f(x + Δx) < f(x)`, ignoring higher-order terms, we need `f''(x)^T Δx
    < 0`. That is, satisfying this condition can reduce the function value. Further,
    `f''(x)^T Δx = ||f''(x)^T|| · ||Δx|| · cosθ`. Taking `Δx = -α f''(x)` ensures
    that the updated `x` reduces the function value. Here `α` is a hyperparameter
    used to adjust the step size of each update, called the **Learning Rate**.


    The optimization goal in machine learning is to minimize the loss function. The
    process of solving using the gradient descent method is divided into the following
    steps, as shown in Code Listing 2-1. First, randomly initialize the parameters
    to be solved as initial values, serving as the starting point of optimization;
    next, use the model to predict on all samples and calculate the overall loss value;
    then, differentiate the loss value with respect to the model parameters to obtain
    the corresponding gradient; finally, adjust parameters based on the gradient to
    obtain the parameters after iteration. Repeat the above process until the stopping
    condition is met.


    An analogy: The gradient descent algorithm is like a person going down a mountain.
    He is at the top and wants to reach the foot, but the fog on the mountain is thick,
    and he cannot distinguish the path down. He must use the information around him
    to find the path down. This is where the gradient descent algorithm can be used.
    Specifically, based on his current position, find the steepest direction at this
    position, then walk down the mountain in this direction. After walking a segment,
    repeat the above steps, and eventually he will successfully reach the foot of
    the mountain.


    ![Gradient Descent Algorithm](img/024-i.jpg)


    ## 2. Stochastic Gradient Descent Algorithm


    The gradient descent algorithm introduced earlier needs to first calculate the
    loss value on all data, then perform gradient descent. This method is relatively
    inefficient when the data scale is large. This is mainly reflected in three aspects:
    first, when the data scale is large, the time for the model to compute all samples
    increases; second, as the data dimension increases, the complexity of gradient
    calculation also increases; third, although an accurate gradient value can be
    obtained based on all samples, only one parameter update is performed. We call
    such a gradient descent algorithm **Batch Gradient Descent** (Batch Gradient Descent).


    If the gradient is not calculated using the full set of samples, but a single
    sample is used to approximate the gradient estimation, the computation amount
    can be greatly reduced, and computational efficiency improved. But can this method
    guarantee convergence? It can be proven that the convergence of this algorithm
    is guaranteed. This method is called **Stochastic Gradient Descent** (Stochastic
    Gradient Descent, SGD).


    Specifically, each time a sample is randomly selected from the training set, its
    corresponding loss and gradient are calculated, and parameters are updated. This
    process is repeated iteratively. This method can reduce computational complexity
    when the data scale is large. From a probabilistic perspective, the gradient of
    a single sample is an unbiased estimate of the gradient of the entire data, but
    it has certain uncertainty. Therefore, its convergence rate is slower compared
    to Batch Gradient Descent.


    An improved method is to use multiple samples to estimate the gradient each time.
    This can reduce uncertainty and improve the convergence rate. This method is called
    **Mini-batch Stochastic Gradient Descent** (mini-batch SGD), where the number
    of samples selected in each iteration is called the **Batch Size** (batch size).
    The algorithm steps are shown below.


    ![Mini-batch Stochastic Gradient Descent](img/025-i.jpg)


    # 2.2 Neural Networks


    With the development of neuroscience and cognitive science, we know that human
    intelligent behaviors are related to brain activity. The human brain is an organ
    capable of producing consciousness, thought, and emotion. Inspired by the human
    brain''s nervous system, early neuroscientists constructed a mathematical model
    mimicking the human brain''s nervous system, called the **Artificial Neural Network**,
    or **Neural Network** for short. In the field of machine learning, a neural network
    refers to a network structure model composed of many artificial neurons. The connection
    strengths between these artificial neurons are learnable parameters.


    ## 2.2.1 Neuron


    The **Neuron** is the basic unit of information processing in a neural network.
    It mainly simulates the structure and characteristics of biological neurons, receiving
    input signals and producing outputs.


    Biologists discovered the structure of biological neurons in the early 20th century,
    as shown in Figure 2-2. A typical biological neuron usually has multiple dendrites
    and one axon. Dendrites receive information, and the axon sends information. When
    the input signals accumulated by the neuron exceed a certain threshold, it enters
    an excited state and generates electrical pulses. The end of the axon has many
    terminals that can connect with the dendrites of other neurons (synapses) and
    transmit electrical pulse signals to other neurons.


    ![Figure 2-2 Typical Neuron Structure](img/2a2.jpg)


    In 1943, psychologist McCulloch and mathematician Pitts proposed a very simple
    neuron model based on the structure of biological neurons—the **MP Neuron**[¹].


    A basic neuron includes three basic components: input signals, linear combination,
    and non-linear activation function. We can use Equations (2.8) and (2.9) to describe
    the computation of the neuron in Figure 2-3.


    ![Figure 2-3 Neuron Schematic](img/2a3.jpg)


    ```

    z[i] = Σ_{j=0}^m w[ij] x[j] + b

    a[i] = σ(z[i])

    ```


    Where `x[0], x[1], ..., x[m]` are input signals, `w[i0], w[i1], ..., w[im]` are
    the neuron''s weights, `z[i]` is the linear combination of input signals, `b`
    is the bias, the activation function is `σ(·)`, and `a[i]` is the neuron''s output
    signal.


    [¹]: Image source: https://commons.wikimedia.org/wiki/File:Neuron_Hand-tuned.svg.


    ## 2.2.2 Multi-Layer Perceptron


    ### 1. Single Hidden Layer Perceptron


    The typical structure of a single hidden layer perceptron is shown in Figure 2-4.
    It is obtained by stacking neurons. We can view it as a mapping: `f: R^{D_in}
    → R^{D_out}`, where `D_in` represents the number of neurons in the input layer,
    i.e., the dimension of the input vector; `D_out` represents the number of neurons
    in the output layer, i.e., the dimension of the output vector. The computation
    process can be represented by Equation (2.10):


    ![Figure 2-4 Single Hidden Layer Perceptron](img/2a4.jpg)


    ```

    h(x) = f_1(W¹ x + b¹)

    y = f_2(W² h(x) + b²)

    ```


    Where `b¹`, `b²` represent biases, `W¹`, `W²` represent weight vectors, `f_1`,
    `f_2` represent activation functions. `h(x) = f_1(W¹ x + b¹)` is the output of
    the hidden layer. It can be seen that the hidden layer''s output is a linear transformation
    and non-linear transformation of the input. `W¹` is the transformation matrix
    that transforms the input vector into the hidden layer vector. Each column of
    `W¹` represents the weight vector connecting the input to a neuron in the hidden
    layer. `f_1` represents the activation function, which transforms each neuron
    in the hidden layer to obtain the corresponding output. This computation method
    is called **Element-wise Operation** (Elementwise Operator). Section 2.3 will
    introduce some typical activation functions.


    ### 2. Information Propagation in Perceptron


    **Multi-Layer Perceptron** (Multi-Layer Perceptron, MLP), also known as **Feedforward
    Neural Network**. A typical multi-layer perceptron is shown in Figure 2-5. The
    single-layer perceptron introduced earlier is a special form of it. It has the
    following characteristics.


    ![Figure 2-5 Multi-Layer Perceptron Model](img/2a5.jpg)


    A multi-layer perceptron can be divided into three parts: input layer, hidden
    layer(s), and output layer, where the hidden layer can include one or more layers.
    Each layer consists of several neurons. Each neuron undertakes computational functions
    including linear weighting and non-linear transformation. Layers are connected
    through weights. Each neuron in the subsequent layer is connected to every neuron
    in the previous layer.


    Input signals are gradually passed to the next layer through continuous linear
    transformations (linear weighting) and non-linear transformations (activation
    functions) until the output layer. The number of neurons in the input and output
    layers is often determined by prior knowledge, while the number of neurons in
    each hidden layer and the number of layers used are hyperparameters.


    More generally, we use the form of Equations (2.11) and (2.12) to represent the
    information propagation process of the multi-layer perceptron:


    ```

    z^(l) = W^(l) a^(l-1) + b^(l)

    a^(l) = σ_l(z^(l))

    ```


    Where `W^(l) ∈ R^{D_l × D_{l-1}}` is the transformation parameter from layer (l-1)
    to layer l. `D_{l-1}` represents the number of neurons in layer (l-1), `D_l` represents
    the number of neurons in layer l. `b^(l) ∈ R^{D_l}` represents the bias term.
    `{W^(l), b^(l)}` are the trainable parameters in a layer of the network. `σ_l`
    is the activation function of layer l. `z^(l)` and `a^(l)` represent the output
    of the linear transformation and the output of the activation function, respectively.


    The multi-layer perceptron passes information layer by layer to obtain the output
    `y`. The entire network can be viewed as a complex composite function `φ(X; W,
    b)`, where `W`, `b` represent the collection of parameters `{W^(l), b^(l) | l
    = 1, 2, 3, ...}`.


    # 2.3 Activation Functions


    The **Activation Function** is a very important concept in neural networks. Its
    non-linearity enables neural networks to approximate almost any non-linear function.
    If activation functions are not used, no matter how many layers the neural network
    has, the output of each layer is a linear combination of the previous layer''s
    input. Such a neural network is still a linear model with limited expressive power.


    The choice of activation functions can be diverse. A basic requirement is that
    they are continuously differentiable, allowing non-differentiability at a few
    points. Common activation functions include **Sigmoid-shaped Activation Functions**
    and **ReLU and its Variants**.


    ## 2.3.1 Sigmoid-shaped Activation Functions


    Typical sigmoid-shaped activation functions are **Sigmoid** and **Tanh**. The
    characteristic of this type of activation function is that it is bounded, i.e.,
    `σ(x) ∈ [a, b]`, and the larger the absolute value of the input, the smaller the
    corresponding gradient, approaching 0.


    The definition of the **Sigmoid Function** is Equation (2.13):


    ```

    σ(x) = 1 / (1 + e^{-x})

    ```


    The Sigmoid function compresses inputs of any magnitude into the range between
    0 and 1. The larger the input value, the closer the compressed value is to 1;
    the smaller the input value, the closer the compressed value is to 0. When `x
    ∈ [-1, 1]`, it can be approximately regarded as a linear function, and when `x
    = 0`, the function value is 0.5.


    It is often used in neural networks as the activation function for the last layer
    of a binary classifier, converting arbitrary real values into probabilities. Another
    application scenario is that because its value range is `(0, 1)`, it can act as
    a switch-like regulator to modulate other information.


    Another function is **Tanh**, defined as Equation (2.14):


    ```

    tanh(x) = (e^x - e^{-x}) / (e^x + e^{-x})

    ```


    Compared to Sigmoid, Tanh has a slightly larger value range, `(-1, 1)`. The function
    graphs of Sigmoid and Tanh are shown in Figure 2-6. Tanh can also be used as a
    "switch" to regulate input information.


    ## 2.3.2 ReLU and its Variants


    ### 1. ReLU


    The **Rectified Linear Unit** (ReLU)[²] is an activation function frequently used
    in deep learning models currently. Its definition is: when `x ≥ 0`, output `x`
    unchanged; when `x < 0`, output 0, as shown in Equation (2.15):


    ```

    ReLU(x) = max(0, x)

    ```


    ![Figure 2-6 Sigmoid Function and Tanh Function](img/2a6.jpg)


    It can be seen that ReLU handles positive and negative values completely differently.
    When the input is negative, it is all set to zero; when the input is positive,
    it remains unchanged. This characteristic is called **Unilateral Inhibition**
    (or One-sided Inhibition). In the hidden layer, this feature brings a certain
    degree of sparsity to the hidden layer''s output. At the same time, because the
    output remains unchanged when the input is positive, the gradient is 1, which
    can alleviate the vanishing gradient problem. Its gradient is shown in Equation
    (2.16), which is very simple to compute and has high computational efficiency.


    ```

    ReLU''(x) = 1, if x > 0; 0, if x < 0

    ```


    Additionally, unilateral inhibition may cause a neuron to "die" in certain cases.
    The reason is that if a neuron''s output is always negative, then during backpropagation,
    its corresponding gradient is always 0, leading to an inability to update effectively.


    In actual use, to avoid the above situation, several variants of ReLU are also
    widely used.


    ### 2. LeakyReLU


    [²]: See Appendix for references.

