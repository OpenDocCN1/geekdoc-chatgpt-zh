    ### 7.2.3 多头图注意力层


    为了更进一步提升注意力层的表达能力，可以加入多头注意力机制（`multi-head attention`），也即对上式调用`K`组相互独立的注意力机制，然后将输出结果拼接在一起：


    ![](Images/139-i.jpg)


    其中`||`表示拼接操作，![](Images/139-2-i.jpg)是第`k`组注意力机制计算出的权重系数，`W^(k)`是对应的学习参数。当然为了减少输出的特征向量的维度，也可以将拼接操作替换成平均操作。


    增加多组相互独立的注意力机制，使得多头注意力机制能够将注意力的分配放到中心节点与邻居节点之间多处相关的特征上，可使得系统的学习能力更加强大。多头注意力机制的计算流程如图7-5所示，其中不同的颜色表示不同注意力计算过程，图中`K=3`，计算完后，将上述结果进行拼接或者平均操作。


    ![](Images/7a5.jpg)


    图7-5　多头注意力机制示意图^([\[1\]](#chapter80.xhtml#ch1_back))


    图注意力层比`GCN`里面的图卷积层多了一个自适应的边权重系数的维度。回到`GCN`的核心过程![](Images/139-4-i.jpg)，我们可以将![](Images/139-5-i.jpg)分拆成两个部分，引入一个权重矩阵`M∈R^(N×N)`，然后核心过程就变成了![](Images/139-6-i.jpg)。由此可以看到，图注意力模型相较于`GCN`多了一个可以学习的新的维度—边上的权重系数。在之前的模型中，这个权重系数矩阵是图的拉普拉斯矩阵，而图注意力模型可以对其进行自适应的学习，并且通过运用注意力机制，避免引入过多的学习参数。这使得图注意力模型具有非常高效的表达能力。这种机制从图信号处理的角度来看，相当于学习出一个自适应的图位移算子，对应一种自适应的滤波效应。当然，和`GraphSAGE`模型一样，图注意力模型的计算也保留了非常完整的局部性，一样能进行归纳学习。


