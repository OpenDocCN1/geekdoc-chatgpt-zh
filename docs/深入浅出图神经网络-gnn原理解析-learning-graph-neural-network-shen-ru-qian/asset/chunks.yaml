    不同于LeakyReLU和PreLU在输入为负时，进行线性压缩，指数线性单元（Exponential Linear Unit，ELU）[^(\[5\])](../Text/chapter26.xhtml#bb-5)在输入为负时，进行非线性变换，如式（2.20）所示，它的函数曲线如图2-7所示。


    ![](Images/033-i.jpg)


    其中α>0，α是一个超参数，控制着输入为负时的饱和区。它具有调节激活值的均值为0的功能，可以加速神经网络的收敛。


    上述几种激活函数的图像如图2-7所示：


    ![](Images/2a7.jpg)


    图2-7　ReLU、LeakyReLU、ELU函数的图像


    ## 2.4　训练神经网络


    如何让神经网络高效地进行训练，这是神经网络研究早期遇到的难题之一。反向传播方法[^(\[6\])](../Text/chapter26.xhtml#bb-6)的提出解决了这个难题，它基于链式法则快速地计算参数的梯度，然后使用梯度下降算法进行参数更新。本节我们将介绍神经网络模型的运行过程，随后将详细介绍反向传播算法，最后介绍在含有大规模参数的情况下神经网络优化面临的挑战。


    ### 2.4.1　神经网络的运行过程


    神经网络的运行过程分为三步：前向传播、反向传播、参数更新，通过不断迭代进行模型参数的更新，以从数据中挖掘出有价值的信息，如图2-8所示。


    1）前向传播：给定输入和参数，逐层向前进行计算，最后输出预测结果；


    2）反向传播：基于前向传播得到的预测结果，使用损失函数得到损失值，然后计算相关参数的梯度，该计算方法称为反向传播（back-propagation），具体的细节后面将详细介绍；


    3）参数更新：使用梯度下降算法对参数进行更新，重复上述过程，逐步迭代，直到模型收敛。


    ![](Images/2a8.jpg)


    图2-8　神经网络的运行过程


    ### 2.4.2　反向传播


    我们以多层感知器为例来介绍反向传播算法。给定样本![](Images/034-2-i.jpg)，使用多层感知器的消息传递公式可以进行前向传播，这个过程可以用图2-9来表示。


    ![](Images/2a9.jpg)


    图2-9　多层感知器计算示意图


    给定样本（x，y），前向传播得到输出![](Images/035-2-i.jpg)，对应的损失值为![](Images/035-3-i.jpg)，接下来求参数矩阵W^(（l）)的梯度![](Images/035-4-i.jpg)，使用链式法则可以得到式（2.21）。


    ![](Images/035-5-i.jpg)


    我们定义![](Images/035-6-i.jpg)为误差项，它衡量的是z^(（l）)对损失值的影响，进一步使用链式法则，我们可以得到式（2.22）。


    ![](Images/035-7-i.jpg)


    基于公式z^(（l+1）)\=W^(（l+1）)a^(（l）)+b^(（l）)且a^(（l）)\=σ（z^(（l）)）进行变换可以得到式（2.23）。


    ![](Images/035-8-i.jpg)


    其中σ''（z^(（l）)）是激活函数的导数，⊙表示哈达玛积，它是一种对应元素相乘的二元运算符。从式（2.23）中可以看出，第一层的误差与第l+1层的误差有关，这就是反向传播的来源。


    那么对于![](Images/035-9-i.jpg)，可以得到式（2.24）：


    ![](Images/035-10-i.jpg)


    偏置项b^(（l）)的导数如式（2.25）所示：


    ![](Images/036-i.jpg)


    ### 2.4.3　优化困境


    对于深度神经网络来说，虽然反向传播能够高效地计算梯度，但是随着堆叠层数和模型参数规模的增加，也给模型优化带来一些严峻的问题。


    1.梯度消失


    从式（2.23）中可以看出，第l层的误差是通过第（l+1）层的误差与两层之间权重的加权，再乘以激活函数的导数得到的，如果激活函数使用Sigmoid，它的导数为σ''（x）=σ（x）（1–σ（x）），由于σ（x）∈（0，1），它的导数的最大值为σ''（x）=0.25，当层数增加时，最后一层的误差将在前面的层中快速衰减，这会导致靠近输入层的梯度值非常小，参数几乎无法进行有效的更新，在下一次前向传播时，由于前面层的参数无法有效地从数据中获得有价值的信息供后面的层使用，模型就难以进行有效的训练。这种现象称为梯度消失。


    导致梯度消失的原因在于激活函数的饱和性，比如Sigmoid、Tanh等都会带来这种问题，它们在函数值趋近于上下边界时，梯度通常比较小，再与误差项相乘将变得更小，多次的反向传播将会使得梯度值不断减小，图2-10所示为一个5层的多层感知器训练过程中每一层权值W的2范数，可以看出越靠近输入的层，它的值越小，这就是梯度消失的表现。因此现在的神经网络通常使用ReLU激活函数。


    2.局部最优与鞍点


    由于神经网络的复杂非线性关系和参数维度较高，因此尽管损失函数通常都是凸的，但损失函数与参数之间的关系却是非凸的，如图2-11中的a图所示。深度神经模型具有非常多的局部最优，当陷入局部最优时，模型优化就会变得非常困难，不过，深度神经网络模型通常存在非常多的局部最优点，往往这些局部最优解都能保证模型的效果[^(\[7\])](../Text/chapter26.xhtml#bb-7)。


    ![](Images/2a10.jpg)


    图2-10　梯度消失示意图


    另一个问题是，由于维度过高，深度神经网络模型也常常存在很多鞍点，鞍点指的是在该处梯度为0（如图2-11中的b图所示），但是它并不是最小值或者最大值，通常鞍点带来的挑战比局部最优要大得多。当处于鞍点区域并且误差较大时，由于这部分区域相对“平坦”，梯度值较小，模型收敛速度将受到极大影响，给人造成一种陷入局部最优的假象。


    ![](Images/2a11.jpg)


    图2-11　损失函数可视化结果[^(\[8\])](../Text/chapter26.xhtml#bb-8)


