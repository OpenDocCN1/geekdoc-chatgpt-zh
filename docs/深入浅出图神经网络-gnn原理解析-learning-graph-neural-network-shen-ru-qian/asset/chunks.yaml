    ![](Images/072-4-i.jpg)


    其中λ是调节重构项和稀疏正则项的权重。


    ### 4.2.3　变分自编码器


    变分自编码器[^(\[3\])](../Text/chapter55.xhtml#dd-3)可以用于生成新的样本数据，它与传统的自编码器有很大的不同，本节我们将介绍变分自编码器的原理，并将它与传统自编码器进行对比。


    1.变分自编码器的原理


    变分自编码器的本质是生成模型，它假设我们得到的样本都是服从某个复杂分布P（x）即x~P（X），生成模型的目的就是要建模P（X），这样我们就可以从分布中进行采样，得到新的样本数据。比如对图像来说，可以将每个像素点看作一个随机变量，这些像素点可能相互依赖，生成模型的目标就是要建模这些依赖关系以生成样本。


    一般来说，每个样本都可能受到一些因素的控制，比如对于手写数字，需要决定写什么数字、数字的大小、笔画的粗细等，这些因素称为隐变量。假设有多个隐变量，用向量z表示，概率密度函数为p（z），同时，有这样一个函数f（z；θ），它可以把p（z）中采样的数据z映射为与X比较相似的样本数据，即p（X|z）的概率更高。引入隐变量后通过式（4.8）求解p（X）的分布，这里有两个问题需要考虑，一是如何选定隐变量z；另一个是如何计算积分。


    ![](Images/073-i.jpg)


    对于隐变量z的选择，变分编码器假设z的每个维度都没有明确的含义，而仅仅要求z方便采样，因此假设z服从标准正态分布z~N（0，I）。而p（x|z）的选择常常也是正态分布，它的均值为f（z；θ），方差为σ²I，其中σ是一个超参数。


    ![](Images/073-2-i.jpg)


    为什么上述假设就是合理的呢？实际上任意一个d维的复杂分布都可以通过对d维正态分布使用一个复杂的变换得到，因此，给定一个表达能力足够强的函数，可以将服从正态分布的隐变量z映射为模型需要的隐变量，再将这些隐变量映射为x。


    但是对于大部分的z，都不能生成与x相似的样本，即p（x|z）通常都接近于0，这对于估计p（X）没有任何意义，我们需要得到那种能够大概率生成比较像x的z。这些z怎么得到呢？如果知道z的后验分布p（z|x），就可以通过x推断得到。变分自编码器引入了另一个分布q（z|x）来近似后验分布p（z|x）。现在的问题是E[z~q（z|x）]\[p（x|z）\]与p（x）的关系是怎么样的呢？下面我们来计算q（z|x）和p（z|x）的KL距离，如式（4.10）所示：


    ![](Images/073-3-i.jpg)


    然后使用贝叶斯公式展开，可以得到式（4.11），稍加整理就可以得到式（4.12）。


    ![](Images/073-4-i.jpg)


    式（4.12）是整个变分自编码器的核心，左边包含了我们要优化的目标p（x），当我们选择的q（z|x）表达能力足够强时，是可以近似表达p（z|x）的，也就是说，D[KL]\[q（z|x）||p（z|x）\]是一个趋近于0的数。右边第一项实际上就是一个解码器，将基于输入x得到的最有可能生成相似样本的隐变量采样出来，通过解码器得到生成的样本，右边第二项是一个正则项。


    前面假设p（x|z）是正态分布，那么对于式（4.13）右边第一项，计算得到损失函数的第一部分重构损失，注意这里取负号是由于使用梯度下降的方法进行优化，因此目标变为最小化–p（x）。f（z；θ）可以使用神经网络来实现。


    ![](Images/074-i.jpg)


    对于q（z|x）的选择，我们也假设服从正态分布，它的各分量相互独立，如式（4.15）所示，那么可以得到损失函数的第二部分正则项。


    ![](Images/074-2-i.jpg)


    根据上述原理，可以得出变分自编码器的结构，如图4-4所示。


    ![](Images/4a4.jpg)


    图4-4　变分自编码器结构示意图


    现在还有个问题是隐变量z是通过采样得到的，而采样这个操作是不可导的，无法进行反向传播，我们使用一个称为重参数化的技巧解决这个问题，具体来说就是，先从正态分布N（0，I）中采样得到ε，隐变量z通过计算得到：z=εμ（x）+σ（x），这样就解决了反向传播的问题。


    2.与自编码器对比


    从变分自编码器的结构和损失函数来看，它与传统自编码器比较类似，但是本质上它们是不同的，前文介绍的自编码器是一种无监督的表示学习方法，而变分自编码器本质上是生成模型。虽然传统的自编码器有解码器部分，但是我们无法任意给定一个隐藏层特征就通过解码器得到有意义的输出，导致这个问题的原因在于传统自编码器的隐空间不是连续的，它是由一个个样本点的编码构成，对于没有样本编码的地方，由于解码器没有见过这种隐藏层特征，因此当任意给定隐藏层向量时，解码器无法给出有意义的输出。变分自编码器则不同，它的出发点就是要建模样本的分布p（x），因此当训练完成后，只使用解码器就可以生成样本。


    ## 4.3　基于对比损失的方法—Word2vec


    在自然语言处理中，如何表示一个词是非常重要的。在Word2vec出现之前，常用的方法，比如独热向量编码、词袋模型、基于词的上下文构建的共现矩阵等，都不可避免地有维度过高、稀疏性等问题。Word2vec模型将词嵌入到一个向量空间中，用一个低维的向量来表达每个词，语义相关的词距离更近，解决了传统方法存在的高维度和数据稀疏等问题。本节将介绍词向量的动机，并从对比损失的视角来推导Skip-gram模型。


    词向量模型—Skip-gram


    Word2vec[^(\[4\])](../Text/chapter55.xhtml#dd-4)是2013年由Tomas Mikolov提出的，其核心思想是用一个词的上下文去刻画这个词。从这个思想出发，我们可以得到两种不同的模型。一个是给定某个中心词的上下文去预测该中心词，这个模型称为CBow；另一个是给定一个中心词，去预测它的上下文词，这个模型称为Skip-gram。下面我们以Skip-gram为例，介绍如何进行建模以得到我们需要的词向量。


    给定一个语料库，它可以由多篇文档组成，为了简化，假设该语料库可以表示为一个序列C={w[1]，w[2]，…，w[N]}，语料库的长度为N，单词的词表为V，w[i]∈V。Skip-gram模型是使用中心词去预测其上下文词，这里定义上下文词为以中心词为中心的某个窗口内的词，假设窗口大小为2m+1。给定中心词，要能够正确地预测上下文词，即我们希望在给定某个中心词的条件下，输出词为上下文的概率最大。


    以如图4-5所示的一句话为例，选择m=2，考查中心词“网络”，它的上下文为{“图”，“神经”，“有”，“非常”}，我们可以构造这样的单词对\[（“图”，“网络”），（“神经”，“网络”），（“有”，“网络”），（“非常”，“网络”）\]，我们称这种由中心词及其上下文词构成的单词对为正样本，记为D，由中心词与其非上下文词构成的单词对为负样本，记为D，比如（“网络”，“应用”）。


    ![](Images/4a5.jpg)


    图4-5　正负样本示意图


    要想正确地根据中心词预测上下文词，那么我们可以最大化正样本中的单词对作为上下文出现的概率，同时最小化负样本中单词对作为上下文出现的概率，以此构造目标函数。具体来说，对正负样本定义标签，如式（4.16）所示，其中w[c]表示中心词。


    ![](Images/076-2-i.jpg)


    我们的目的就是找到使得条件概率p（y=1|（w[c]，w））和p（y=0|（w[c]，w））最大化的参数θ，如式（4.17）所示。


    ![](Images/077-i.jpg)


    这个问题就转化为一个二分类问题，给定任意两个词，判断它们是否是上下文词，因此，可以使用逻辑回归来建模这个问题。引入两个矩阵U∈R^(|D|×d)，V∈R^(|D|×d)它们中的每一行都代表着一个词，在模型训练完成后，它们就是包含语义表达的词向量。U、V分别对应一个词作为中心词和上下文词两种角色下的不同表达。对于一个词w，定义U[w]表示它对应的词向量。那么可以将式（4.17）中的概率表达为式（4.18），其中σ（x）表示Sigmoid函数：


    ![](Images/077-2-i.jpg)


    联合式（4.17）与（4.18），取对数，可以得到式（4.19），这就是Skip-gram的目标函数：


    ![](Images/077-3-i.jpg)


    这个式子一方面增大正样本的概率，另一方面减小负样本的概率，我们注意到增大正样本的概率实际上是在增大![](Images/077-4-i.jpg)，即中心词与上下文词的内积，也就是它们之间的相似度。也就是说，最小化式（4.19）实际上会使得中心词与上下文词之间的距离更小，而与非上下文词之间的距离更大，通过这种方式作为监督信号指导模型学习，收敛之后，参数矩阵U、V就是我们需要的词向量，通常我们使用U作为最终的词向量。


    这种构建正负样本，并最大化正样本之间的相似度、最小化负样本之间的相似度的方式是表示学习中构建损失函数的一种常用思路，这类损失我们统称为对比损失（contrastive
    loss）[^(\[5\])](../Text/chapter55.xhtml#dd-5)，它将数据及其邻居在输入空间中的邻居关系在特征空间中仍然保留下来。上述的Skip-gram模型的邻居定义为某个词的上下文词，在其他任务中可能会有不同的定义，比如在人脸识别中，正样本可以定义为同一个体在不同条件下的人脸图像，负样本定义为不同个体的人脸图像，通过对比损失进行优化以学习到具有判别性的特征用于人脸识别。


    负采样


    通常来说负样本的数量远比正样本的数量要多得多，比如对于中心词而言，在词表中只有少数的单词能与它构成正样本，因此在计算式（4.19）时，当词表规模达到百万级时，后面一项对负样本的计算将成为瓶颈。负采样[^(\[6\])](../Text/chapter55.xhtml#dd-6)[^(\[7\])](../Text/chapter55.xhtml#dd-7)[^(\[8\])](../Text/chapter55.xhtml#dd-8)技术就是利用采样的方式来降低计算量，它在我们无法计算所有的负样本或者计算代价过高时，提供了一种降低计算复杂度的方法。使用负采样技术后，对于中心词w[c]来说，损失函数变为式（4.20）：


    ![](Images/078-i.jpg)


    其中NEF（w[c]）表示采样得到的与w[c]构成负样本的词集合，通过负采样将负样本的计算从O（|V|）降至O（n），其中n<<|V|。在采样时不是使用均匀采样，而是采用以词频为权重的带权采样，可以证明，这种采样方式优化的不仅是词向量的内积，更是词向量的互信息[^(\[9\])](../Text/chapter55.xhtml#dd-9)[^(\[10\])](../Text/chapter55.xhtml#dd-10)，因此通常以这种方式得到的词向量效果更好。


    词向量可视化


    我们将学习到的词向量降维到二维空间进行可视化，可以看到语义相关或相近的词之间的距离更近，而语义差别较大的词相距更远，如图4-6中的a图所示。另外，我们发现一个有意思的现象，某些词向量之间存在着一定的平移不变性，如图4-6中的b图所示。它们可以进行近似的运算，比如男人–女人>>国王–王后，这些现象都说明了词向量捕捉到了这个词的语义信息。


    ![](Images/4a6.jpg)


    图4-6　词向量可视化


