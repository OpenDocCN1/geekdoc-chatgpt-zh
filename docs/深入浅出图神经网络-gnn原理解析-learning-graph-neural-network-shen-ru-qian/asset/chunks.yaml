    ![](Images/044-2-i.jpg)


    其中![](Images/044-3-i.jpg)。


    多通道卷积的过程如图3-5所示，可以把这个过程看作一个3D的卷积核滑过输入层。需要特别注意的是，输入层和卷积核有相同的深度，这样卷积核只需要在高和宽两个方向上移动，这也是该种操作被称为2D卷积的原因，尽管它使用的是三维滤波器。在每一个滑动位置，通过张量点积运算得到一个特征图上对应位置的值，最后得到一个单通道输出。


    ![](Images/3a5.jpg)


    图3-5　多通道卷积过程


    像单通道卷积一样，多通道卷积使用多个卷积核来提取更丰富的特征，这样卷积核G的维度为R^(k×k×C×C'')，C''表示卷积核的个数，将输入与每个卷积核的结果拼接在一起，得到多通道卷积的输出H∈R^(H''×W''×C'')。'
