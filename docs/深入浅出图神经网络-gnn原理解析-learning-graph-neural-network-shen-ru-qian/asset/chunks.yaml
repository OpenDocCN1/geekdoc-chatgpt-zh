    2.生成模型


    ![](Images/184-3-i.jpg)


    这里也简单使用了两个节点表示向量的内积来拟合邻接关系。


    3.损失函数


    ![](Images/184-4-i.jpg)


    同样地，隐变量z的先验分布选用标准正态分布：


