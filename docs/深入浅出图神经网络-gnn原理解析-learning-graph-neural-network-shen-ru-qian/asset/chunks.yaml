    - 越是边缘的像素点，对于输出的影响越小，因为卷积运算在移动到边缘的时候就结束了。中间的像素点会参与多次计算，但是边缘的像素点可能只会参与一次运算，这就导致了边缘信息的丢失。


    为了解决上述问题，通常对边缘使用0值进行填充（`padding`），使得边缘处的像素值也能进行计算，从而使得输入维度与输出维度保持一致。填充值的大小指的是进行填充的数量，如`padding=1`，表示在输入的外层填充一圈0，如图3-4中的a图所示。这样输入的维度实际上变成了`(W+2,
    H+2)`。一般来说，当`padding=p`时，输入的维度实际上变成了`(W+2P, H+2P)`。


    为了让卷积之后的特征图与输入的长和宽保持一致，需要填充多少0值呢？0值的多少实际上与卷积核的形状相关，对于长和宽都为`k`的卷积核，需要取`P = k/2`，方能使得输入的形状与输出的长宽一致。


    输出的特征图的大小不仅仅与`padding`有关，还与卷积的方式有关。上面讨论的都是标准的卷积操作，也就是输入中的每个位置都参与计算，有时不必对每个位置进行计算，可以每隔几个位置计算一次，这个间隔称为步长（`stride`），比如图3-4中的b图就是一个步长为2的卷积示意图。


    ![](Images/3a4.jpg)


    图3-4 `Padding`和`stride`示意图


    #### 2. 多通道卷积


    前面介绍了单通道卷积，将其进行扩展就可以得到多通道卷积。假设输入`X ∈ R^(H×W×C)`，`C`表示通道（`channels`）数，卷积核的长宽都为`k`。由于输入有多个通道，因此我们赋予每个通道一个`k×k`的卷积核，这些卷积核构成`G^(c'')
    ∈ R^(k×k×C)`，这样多通道卷积可以定义为式（3.6）：


    ![](Images/044-2-i.jpg)


    其中`G^(c'')[:, :, c]`表示第`c''`个卷积核在第`c`个通道上的权重。


    多通道卷积的过程如图3-5所示，可以把这个过程看作一个3D的卷积核滑过输入层。需要特别注意的是，输入层和卷积核有相同的深度，这样卷积核只需要在高和宽两个方向上移动，这也是该种操作被称为2D卷积的原因，尽管它使用的是三维滤波器。在每一个滑动位置，通过张量点积运算得到一个特征图上对应位置的值，最后得到一个单通道输出。


    ![](Images/3a5.jpg)


    图3-5 多通道卷积过程


    像单通道卷积一样，多通道卷积使用多个卷积核来提取更丰富的特征，这样卷积核`G`的维度为`R^(k×k×C×C'')`，`C''`表示卷积核的个数，将输入与每个卷积核的结果拼接在一起，得到多通道卷积的输出`H
    ∈ R^(H''×W''×C'')`。

