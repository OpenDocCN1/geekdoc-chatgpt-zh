    同`MPNN`一样，`NLNN`的核心也在两个函数上：`f`和`g`。为了简便，我们可以使用线性变换作为函数`g`：`g(h[j]) = W[g]h[j]`，这里`W[g]`是需要学习的权重参数。下面我们重点列出函数`f`的一些选择：


