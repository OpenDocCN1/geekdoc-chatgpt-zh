    # Chapter 3 Convolutional Neural Networks


    Convolutional Neural Networks (`Convolutional Neural Network`, `CNN` or `ConvNet`)
    are a type of deep feedforward neural network with characteristics such as local
    connectivity and weight sharing. They have achieved significant results in the
    fields of image and video analysis, such as image classification, object detection,
    image segmentation, and other visual tasks, and are currently one of the most
    widely used models.


    ## 3.1 Convolution and Pooling


    Convolution and pooling are two core operations in convolutional neural networks.
    Most neural network structures are obtained by combining them. This section will
    elaborate on the origin and principle of convolution, as well as the basic concepts
    of pooling.


    ### 3.1.1 Convolution in Signal Processing


    The term "convolution" originates from the field of signal processing. It is a
    technology widely used in signal processing, image processing, and other engineering
    science fields. A typical application of convolution is: for a certain linear
    time-invariant system, given the input signal `f(τ)` and system response `g(τ)`,
    find the system output.


    The mathematical definition of convolution is shown in Equation (3.1):


    ![](img/040-i.jpg)


    If we intuitively understand this calculation process according to Figure 3-1,
    it is that the function `g(τ)` is flipped and shifted by `t` to obtain `g(t-τ)`,
    and then the integral of the product with function `f(τ)` is sought.


    ![](img/3a1.jpg)


    Figure 3-1 The Process of Convolution


    #### 1. Convolution in Images


    We take images as an example to intuitively understand convolution. Images in
    computers are usually stored in discrete form according to pixels, and can be
    represented by a two-dimensional or three-dimensional matrix. Assuming a two-dimensional
    image `X ∈ R^(H×W)`, the convolution kernel is `G ∈ R^(k×k)`, usually `k` is an
    odd number. The calculation method of two-dimensional discrete convolution is
    shown in Equation (3.2):


    ![](img/040-3-i.jpg)


    Intuitively understanding the above convolution process: first rotate the convolution
    kernel by 180°, then extract a `k×k` region at the corresponding position in the
    input, compute the inner product with the rotated convolution kernel, and obtain
    the output at the corresponding position.


    In traditional image processing, convolution kernels are usually manually set.
    Different convolution kernels can extract certain features from the input, yielding
    different outputs. Figure 3-2 shows two different convolution kernels `Sobel`
    and `Laplacian`. Both can be used to extract image edges, but `Laplacian` is a
    second-order operator, while `Sobel` is a first-order operator. Therefore, the
    edge detection effects obtained by applying them have obvious differences. That
    is, different convolution kernels can extract different features.


    ![](img/3a2.jpg)


    Figure 3-2 Using Convolution for Image Edge Detection


    #### 2. The Significance of Convolution


    In signal processing, convolution has an important theorem—the Convolution Theorem.
    This theorem is widely used and holds a pivotal position in signal processing.
    Its significance lies in converting complex convolution operations in the time
    domain into simple multiplication operations in the frequency domain, i.e.,


    ![](img/041-2-i.jpg)


    To understand the Convolution Theorem, one must first know the Fourier Transform.
    The Fourier Transform is a method to convert data from the time domain to the
    frequency domain. It decomposes a function into a superposition of a series of
    trigonometric functions of different frequencies. It can be understood as observing
    data from another dimension. Someone once analogized the Fourier Transform: if
    an image is compared to a cooked dish, the Fourier Transform can find the specific
    ingredients and their quantities, regardless of the specific cooking process,
    it can clearly distinguish them.


    Transforming both the image and the convolution kernel into the frequency domain,
    the transformed convolution kernel acts as a filter to process the transformed
    frequency domain image. When the filter corresponding to the convolution kernel
    is a low-pass filter, during image processing it will filter out some higher frequencies.
    If the filtered frequency domain image is transformed back to the pixel space,
    we will see that some details are lost. This is because high frequencies correspond
    to drastically changing regions, i.e., image edges, details, etc.


    ### 3.1.2 Convolution Operations in Deep Learning


    The convolution operation in deep learning differs slightly from the convolution
    concept in signal processing. This section will introduce the convolution calculation
    process using single-channel convolution as an example, then extend it to multi-channel
    convolution, which is the foundation of convolutional networks.


    #### 1. Single-Channel Convolution


    First, take single-channel input as an example to introduce the convolution used
    in deep learning. Slightly different from the definition in Equation (3.2), in
    deep learning, the convolution kernel does not need to be explicitly flipped,
    as shown in Equation (3.4). This definition is called cross-correlation in signal
    processing, but since the convolution kernels in convolutional networks are obtained
    through automatic learning, such a definition does not affect the output. The
    following content of this book uses this definition.


    ![](img/042-i.jpg)


    Below, a concrete example illustrates this process. As shown in Figure 3-3, assume
    the input `X` is a `5×5` matrix, and convolution is performed with a `3×3` convolution
    kernel to obtain the output result. Taking the element at row 1, column 1 of `X`
    as the center, the corresponding result is calculated, as shown in Equation (3.5):


    ![](img/042-2-i.jpg)


    The convolution kernels used in image processing are manually determined. The
    convolution kernel parameters in deep learning are trainable. By using the backpropagation
    and optimization algorithms introduced in Chapter 2, the convolution kernel parameters
    can be dynamically adjusted. This issue will be discussed in detail in Section
    3.2.


    As introduced in Section 3.1, each convolution kernel extracts a certain feature
    of the input. To increase the richness of features, we often use multiple convolution
    kernels, i.e., `G^(c'')`, concatenating the multiple results obtained from the
    input with each convolution kernel. For the local region centered at `X[m, n]`,
    the convolution yields the vector `H[m, n] = [H[m, n, 0], H[m, n, 1], …, H[m,
    n, C''-1]]`, where each element is the result computed with the corresponding
    convolution kernel. Concatenating the results, the convolution kernel can be represented
    by a three-dimensional tensor, i.e., `G ∈ R^(k×k×C'')`, and the output result
    is `H ∈ R^(H''×W''×C'')`. We call the output obtained by convolution the feature
    map (`feature map`).


    ![](img/3a3.jpg)


    Figure 3-3 Schematic Diagram of Single-Channel Convolution


    In the example shown in Figure 3-3, the input dimension decreases after convolution.
    This problem is caused by the input boundary. The starting position of the convolution
    cannot reach every position of the input. This brings the following two problems:


    - After multiple convolution operations, the output size becomes smaller and smaller;

    - The closer to the edge the pixel is, the smaller its influence on the output,
    because the convolution operation ends when it moves to the edge. Central pixels
    participate in multiple calculations, but edge pixels may only participate in
    one operation, leading to the loss of edge information.


    To solve the above problems, the edges are usually padded with 0 values (`padding`),
    so that pixel values at the edges can also be calculated, thereby keeping the
    input dimension consistent with the output dimension. The padding size refers
    to the amount of padding. For example, `padding=1` means padding a circle of 0s
    on the outer layer of the input, as shown in Figure 3-4a. Thus the input dimension
    actually becomes `(W+2, H+2)`. Generally, when `padding=p`, the input dimension
    actually becomes `(W+2P, H+2P)`.


    How many 0 values need to be padded to keep the feature map after convolution
    consistent with the input''s height and width? The amount of 0 values is actually
    related to the shape of the convolution kernel. For a convolution kernel with
    both height and width as `k`, `P = k/2` is needed to make the input shape consistent
    with the output height and width.


    The size of the output feature map is related not only to `padding` but also to
    the convolution method. The above discussion covers standard convolution operations,
    where every position in the input participates in the calculation. Sometimes it
    is not necessary to calculate every position; one can calculate every few positions.
    This interval is called stride (`stride`). For example, Figure 3-4b is a schematic
    diagram of a convolution with a stride of 2.


    ![](img/3a4.jpg)


    Figure 3-4 `Padding` and `stride` Schematic Diagram


    #### 2. Multi-Channel Convolution


    The previous section introduced single-channel convolution. Extending it yields
    multi-channel convolution. Assume the input `X ∈ R^(H×W×C)`, where `C` represents
    the number of channels. The convolution kernel has height and width `k`. Since
    the input has multiple channels, we assign a `k×k` convolution kernel to each
    channel. These convolution kernels constitute `G^(c'') ∈ R^(k×k×C)`. Thus, multi-channel
    convolution can be defined as Equation (3.6):


    ![](img/044-2-i.jpg)


    Where `G^(c'')[:, :, c]` represents the weight of the `c''`-th convolution kernel
    on the `c`-th channel.


    The process of multi-channel convolution is shown in Figure 3-5. This process
    can be viewed as a 3D convolution kernel sliding over the input layer. It is particularly
    important to note that the input layer and the convolution kernel have the same
    depth. Thus, the convolution kernel only needs to move in the height and width
    directions. This is why this operation is called 2D convolution, despite using
    a 3D filter. At each sliding position, a value at the corresponding position on
    the feature map is obtained through tensor dot product operation, finally yielding
    a single-channel output.


    ![](img/3a5.jpg)


    Figure 3-5 Multi-Channel Convolution Process


    Like single-channel convolution, multi-channel convolution uses multiple convolution
    kernels to extract richer features. Thus, the dimension of the convolution kernel
    `G` is `R^(k×k×C×C'')`, where `C''` represents the number of convolution kernels.
    Concatenating the results of the input with each convolution kernel yields the
    multi-channel convolution output `H ∈ R^(H''×W''×C'')`.


