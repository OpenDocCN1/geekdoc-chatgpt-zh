    \n![](img/8a4.jpg`)\n\nFigure 8-4  Graph Classification Model Architecture Based\
    \ on TopK Pooling\n\nThe model in Figure 8-4 uses two `gpool` layers, and correspondingly\
    \ sets two readout layers, then sums the outputs of the two readout layers to\
    \ obtain the vector representation of the whole graph, and then feeds it into\
    \ an `MLP` for graph classification task learning.\n\nRegarding the node-discarding\
    \ pooling mechanism, reference `[2]` proposes a new method: Self-Attention Graph\
