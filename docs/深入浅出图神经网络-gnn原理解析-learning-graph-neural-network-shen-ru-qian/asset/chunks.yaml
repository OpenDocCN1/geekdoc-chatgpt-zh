    ![](Images/157-3-i.jpg)


    下来我们考察一下`S^TAS`的意义：由于`S^T`的第`i`行表示的是所有属于第`i`个簇的节点，依据矩阵乘法可知，`(S^TA)[ij]`表示的是第`i`个簇内所有与节点`v[j]`（全图中的第`j`个节点）有关联的连接强度之和。同理可推，`((S^TA)S)[ij]`反映了第`i`个簇与第`j`个簇的连接强度。如图8-1中的例子：


