    通过上述两个矩阵可以确定簇内的邻接关系以及簇间的邻接关系。进一步来讲，如果能够确定簇内信号的融合方法，将结果表示为超级节点上的信号，那么我们迭代式地重复上述过程，就能获得越来越全局的图信号了。图8-2所示为图坍缩与`GNN`结合的过程：该图展示了一个经过3个池化层最后坍缩成一个超级节点，然后进行图分类任务的`GNN`模型。图中相同颜色的节点被划分到一个簇上，形成下层的一个超级节点，在得到最后一个超级节点的特征向量之后，紧接着使用了一个三层的`MLP`网络进行图分类任务的学习。


    ![](Images/8a2.jpg)


    图8-2 图坍缩与GNN结合的过程[^(\[2\])](../Text/chapter97.xhtml#hh-2)


    #### 2. DIFFPOOL


    `DIFFPOOL`^([\[1\]](#chapter93.xhtml#ch1_back))是首个将图坍缩过程与`GNN`结合起来进行图层面任务学习的算法。`DIFFPOOL`提出了一个可学习的簇分配矩阵。具体来说就是，首先通过一个`GNN`对每个节点进行特征学习，然后通过另一个`GNN`为每个节点学习出所属各个簇的概率分布：


    ![](Images/160-2-i.jpg)


    其中`S^(l)∈R^(n^(l)×n^(l+1))`，`n^(l)`表示第`l`层的节点数，`n^(l+1)`表示第`l+1`层的节点（簇）数，相较于上面例子中`S`矩阵的硬分配，这里面学习出来的`S`矩阵是一个软分配器，其值表示节点被分配到任意一个簇的概率，由于概率值不为`0`，因此这是一个下层超级节点到上层所有节点之间的全连接结构。`GNN[l,embed]`、`GNN[l,pool]`是两个独立的`GNN`层，二者的输入相同，但是参数不同，学习的目的不同。需要强调一点的是，对于最后一层的簇分配矩阵，我们需要直接将该矩阵固定成一个全“1”的矩阵，这是因为，此时需要将图坍缩成一个超级节点，由此获得图的全局表示。


    有了上述两个式子的输出结果，我们可以对图进行坍缩：


    ![](Images/160-4-i.jpg)

    ![](Images/161-i.jpg)


