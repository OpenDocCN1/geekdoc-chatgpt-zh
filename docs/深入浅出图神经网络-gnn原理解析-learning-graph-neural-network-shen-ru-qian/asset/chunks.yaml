    同MPNN一样，NLNN的核心也在两个函数上：f和g。为了简便，我们可以使用线性变换作为函数g：g（h[j]）=W[g]h[j]，这里W[g]是需要学习的权重参数。下面我们重点列出函数f的一些选择：


    1.内积


    函数f的最简单的一种形式就是内积：


    ![](Images/146-3-i.jpg)


    这里θ（h[i]）=W[θ]h[i]，φ（h[j]）=W[φ]h[j]，分别表示对输入的一种线性变换，C（h）=|h[j]|。


    2.全连接


    使用输出为一维标量的全连接层定义f：


    ![](Images/146-4-i.jpg)


    这里w[f]是将向量投影到标量的权重参数，C（h）=|h[j]|。


    3.高斯函数


    使用扩展形式的高斯函数：


    ![](Images/147-i.jpg)


    其中![](Images/147-2-i.jpg)，对于给定i，![](Images/147-3-i.jpg)表示沿维度j进行归一化之后的值，此时![](Images/147-4-i.jpg)。如果将自然对数e的幂指数项改成全连接的形式，就成了GAT中的做法。


    ### 7.4.3　GN


    Graph Network[^(\[11\])](../Text/chapter89.xhtml#gg-11)相较于MPNN和NLNN，对GNN做出了更一般的总结。其基本计算单元包含3个要素：节点的状态h[i]、边的状态e[ij]、图的状态u。围绕着这3个元素，Graph
    Network设计了3个更新函数φ、3个聚合函数ρ，具体如下：


    ![](Images/147-5-i.jpg)


    GN的计算过程如图7-9所示，蓝色表示正在被更新的元素，黑色表示正在参与更新计算的元素。GN的更新思路是非常自然的，由点更新边，边聚合更新点，点聚合与边聚合更新图，当然每个元素在更新的时候还需要考虑自身上一轮的状态。需要注意的是，上述的更新步骤并不是一成不变的，也可以从全局出发到每个节点，再到每条边。另外，全图状态u的初始值，可以看成是图的某种固有属性或者先验知识的编码向量。如果除去这个全图状态值的维护，GN就退化成了一个维护边状态的MPNN。


    ![](Images/7a9.jpg)


    图7-9　GN的计算过程^([\[1\]](#chapter87.xhtml#ch1_back))


    GN对图里面的节点、边、全图都维护了相应的状态，这三者可以分别对应上节点层面的任务、边层面的任务、全图层面的任务。当然在实际场景中，可以依据图数据以及相关任务的实际情况，对GN进行相应的简化处理。


    [\[1\]](#chapter87.xhtml#ch1) Battaglia P W，Hamrick J B，Bapst V，et al.Relational
    inductive biases，deep learning，and graph networks\[J\].arXiv preprint arXiv：1806.01261，2018.


