    总变差是一个标量，它将各条边上信号的差值进行加和，刻画了图信号整体的平滑度。


    ## 5.3　图傅里叶变换


    傅里叶变换是数字信号处理的基石，傅里叶变换将信号从时域空间转换到频域空间，而频域视角给信号的处理带来了极大的便利。围绕傅里叶变换，信号的滤波、卷积等操作都有了完备的理论定义，这为一些实际的工程应用，如信号的去噪、压缩、重构等任务提供了理论指导。


    类比傅里叶变换，我们给出图信号傅里叶变换的定义，即将图信号由空域（spatial domain）视角转化到频域（frequency domain）视角，便于图信号处理理论体系的建立。


    假设图G的拉普拉斯矩阵为L∈R^(N×N)，由于L是一个实对称矩阵，根据实对称矩阵都可以被正交对角化[^(\[2\])](../Text/chapter65.xhtml#ee-2)，可得：


    ![](Images/085-4-i.jpg)


    V∈R^(N×N)是一个正交矩阵，即VV^T\=I。V=\[v[1]，v[2]，…，v[N]\]表示L的N个特征向量，由于V是一个正交矩阵，这些特征向量都是彼此之间线性无关的单位向量。λ[k]表示第k个特征向量对应的特征值，我们对特征值进行升序排列，即λ[1]≤λ[2]…≤λ[N]。


    对于任意给定的向量x，拉普拉斯矩阵的二次型：![](Images/086-i.jpg)，因此拉普拉斯矩阵是一个半正定型矩阵，其所有的特征值均大于等于0。进一步，由式（5.7）可知：LI=0，因此拉普拉斯矩阵具有最小的特征值0，即λ[1]\=0。另外可以证明[^(\[3\])](../Text/chapter65.xhtml#ee-3)，对于L[sym]，其特征值存在一个上限：λ[N]≤2。


    图傅里叶变换（Graph Fourier Transform，GFT）：对于任意一个在图G上的信号x，其图傅立叶变换为：![](Images/086-2-i.jpg)。


    我们称特征向量为傅里叶基，![](Images/086-3-i.jpg)是x在第k个傅里叶基上的傅里叶系数。从定义式上可以看到，傅里叶系数本质上是图信号在傅里叶基上的投影，衡量了图信号与傅里叶基之间的相似度。用矩阵形式可计算出所有的傅里叶系数：


    ![](Images/086-4-i.jpg)


    由于V是一个正交矩阵，对上式左乘V，则：![](Images/086-5-i.jpg)，即：


    ![](Images/086-6-i.jpg)


    于是我们可以将逆图傅立叶变换（Inverse Graph Fourier Transform，IGFT）定义为：


    ![](Images/086-7-i.jpg)


    式（5.11）是一种矩阵形式的逆图傅里叶变换，如果将其展开成向量形式，则：


    ![](Images/086-8-i.jpg)


    由此可知，从线性代数的角度来看，v[1]，v[2]，…，v[N]组成了N维特征空间中的一组完备的基向量，图G上的任意一个图信号都可以被表征成这些基向量的线性加权。具体来说，权重就是图信号在对应傅里叶基上的傅里叶系数，这种对图信号的分解表示方法，给了我们一种全新的看待图信号的视角。这样的分解思路与离散信号处理中所定义的傅里叶变换如出一辙，如图5-2所示：


    ![](Images/5a2.jpg)


    图5-2　傅里叶变换


    其中a图为图信号被分解到两个傅里叶基上的示意图，b图为时域信号被分解成两个正弦信号的加和示意图。


    图傅里叶变换与图信号的频率有什么关系呢？要理解这个问题，我们必须回到总变差的定义式上，有了图傅里叶变换的定义之后，我们可以对总变差进行改写：


    ![](Images/087-2-i.jpg)


    从式（5.14）中可以看出，图信号的总变差与图的特征值之间有着非常直接的线性对应关系，总变差是图的所有特征值的一个线性组合，权重是图信号相对应的傅里叶系数的平方。那么，我们需要思考以下问题：在一个给定的图上，什么样的图信号具有最小的总变差？


    我们将图信号限定在单位向量上来考虑。由于图的各个特征向量是彼此正交的单位向量，且特征值λ[1]，λ[2]，…，λ[N]是从小到大依次排列的，因此总变差取最小值的条件是图信号与最小的特征值λ[1]所对应的特征向量v[1]完全重合，此时仅有x[1]≠0，其他项的傅里叶系数为0，总变差TV（v[1]）=λ[1]。事实上，若x=v[k]，则TV（v[k]）=λ[k]，可以进一步详细证明^([\[1\]](#chapter59.xhtml#ch1_back))，如果要选择一组彼此正交的图信号，使得各自的总变差依次取得最小值，那么这组图信号就是v[1]，v[2]，…，v[N]，如式（5.15）所示：


    ![](Images/088-i.jpg)


    结合总变差代表着图信号整体平滑度的实际意义，我们可以发现，特征值依次排列在一起，对图信号的平滑度作出一种梯度刻画，因此可以将特征值等价成频率。特征值越低，频率越低，对应的傅里叶基就变化得越缓慢，相近节点上的信号值趋于一致；特征值越高，频率越高，对应的傅里叶基就变化得越剧烈，相近节点上的信号值则非常不一致。


    下面我们来看一个具体的计算示例（见图5-3）：


    ![](Images/5a3.jpg)


    图5-3　图G和拉普拉斯矩阵


    如图5-3中的b图所示，根据公式（5.9），计算得到该图的拉普拉斯矩阵的特征矩阵与特征值：


    ![](Images/088-3-i.jpg)


    diag（）表示将向量对角化成矩阵形式。图5-4为将v[1]，v[2]，v[5]作为图信号时的示意图：


    ![](Images/5a4.jpg)


    图5-4　将特征向量作为图信号的示意图


    通过图5-4我们可以直观地看到，3组信号中v[1]变化得最缓慢，事实上v[1]的信号值处处相等，v[5]变化得最剧烈，而v[2]的效果居中。


    同时，我们也可以定义图信号的能量：


    ![](Images/089-2-i.jpg)


    即图信号的能量可以同时从空域和频域进行等价定义。单位向量的图信号能量为1。


    有了频率的定义，傅里叶系数就可以等价成图信号在对应频率分量上的幅值，反映了图信号在该频率分量上的强度。图信号在低频分量上的强度越大，该信号的平滑度就越高；相反，图信号在高频分量上的强度越大，该信号平滑度就越低。


    定义好图傅里叶变换之后，我们就可以从频域视角去研究图信号了。我们把图信号所有的傅里叶系数合在一起称为该信号的频谱（spectrum）。在一个给定的图中，图信号的频谱等价于一种身份ID，给定了频谱，我们就可以运用逆图傅里叶变换，完整地推导出空域中的图信号。同时，频谱完整地描述了图信号的频域特性，为接下来的图信号的采样、滤波、重构等信号处理工作创造了条件。


    当然，需要特别注意的是，频域视角是一种全局视角，图信号频谱上的任意一个傅里叶系数，都是对图信号的某种低频或高频特征的定量描述，这种描述既考虑了图信号本身值的大小，也考虑了图的结构信息。图5-5给出了从空域和频域视角看到的图信号的示意图：


    ![](Images/5a5.jpg)


    图5-5　空域与频域中的图信号^([\[2\]](#chapter59.xhtml#ch2_back))


    在图5-5中，第一排画出了在空域中的图信号，3组图信号的能量是一样的，但是由于G[1]、G[2]、G[3]的图结构不同，使得信号在视觉上给人不同的平滑度感受。具体来讲，G[1]上图信号在相近的节点上的信号值很相似；G[3]上的图信号在相近的节点上的信号值差异比较大；G[2]上图信号的情况介于二者之间。


    第二排画出了对应图信号的频谱图，从图5-5中可以看到，G[1]上图信号的傅里叶系数在小于0.5的低频上取得最大值，且非常集中；G[2]上图信号的傅里叶系数在等于1的频率上取得最大值；G[3]上图信号的傅里叶系数在大于1的频率上取得最大值，且在中高频分量上有着更高的强度。上下两排图分别从空域和频域描述了3组信号的平滑度，当然这种比较也可以从总变差的计算中得出：x^TL[1]x=0.14，x^TL[2]x=1.31，x^TL[3]x=1.81。


