    # 第8章　图分类


    图分类问题是一个重要的图层面的学习任务。与节点层面的任务不同，图分类需要关注图数据的全局信息，既包含图的结构信息，也包含各个节点的属性信息。给定多张图，以及每张图对应的标签，图分类任务需要通过学习得出一个由图到相应标签的图分类模型，模型的重点在于如何通过学习得出一个优秀的全图表示向量。


    图分类任务与视觉图像中的分类任务一样，二者都需要对全局的信息进行融合学习。在CNN模型中，通常采用的做法是通过层次化池化（Hierarchical Pooling）机制来逐渐提取全局信息。得益于图数据中规则的栅格结构，固定大小与步长的滑窗使得最大化池化或者平均池化等简单操作都能够比较高效地抽取出高阶信息。然而，对于非规则结构的图数据，这类池化操作的直接迁移变得不可行。在图分类任务中实现层次化池化的机制，是GNN需要解决的基础问题。


    本章的内容包括3个部分：基于一次性全局池化的图分类、基于层次化池化的图分类，以及基于SAGPool的图分类模型实战。


    ## 8.1　基于全局池化的图分类


    在第7章中介绍的MPNN，除了为图中节点的表示学习提出了一般框架外，作者也设计了一个读出（readout）机制对经过K轮迭代的所有节点进行一次性聚合操作，从而输出图的全局表示：


    ![](Images/156-i.jpg)


    读出机制与CNN模型中常用的紧跟最后一个卷积层的全局池化（Global Pooling）操作如出一辙。二者都是通过对所有输入的一次性聚合得到全局表达，且与池化的常见类型一样，读出机制也可以取Sum、Mean、Max等类型的函数。


    与读出机制十分相似的一种做法是，引文[\[1\]](../Text/chapter97.xhtml#hh-1)通过引入一个与所有节点都相连的虚拟节点，将全图的表示等价于这个虚拟节点的表示。这种思路同时也在GN中全局表示u的更新过程中得到了体现。


    显而易见，读出机制的处理方式丢失了图数据里面丰富的结构信息。其本质上是将输入数据看作一种平整且规则的结构数据，所有的节点都被同等看待，这与图数据本身是相违背的。从这个角度来看，读出机制更能适应的是对小图数据的学习，一方面是因为小图数据中的结构信息相对单一；另一方面是因为经过K轮消息传播机制的迭代之后，图中各个节点的表达会更加接近全局表达，此时读出机制也能比较好地提取全局信息。另外，从实际工程层面来看，读出机制易于实现，非常适合作为图分类的基准模型。


    ## 8.2　基于层次化池化的图分类


    本节以3种不同的思路介绍能够实现图数据层次化池化的方案。


    （1）基于图坍缩（Graph Coarsening）的池化机制：图坍缩是将图划分成不同的子图，然后将子图视为超级节点，从而形成一个坍缩的图。这类方法正是借用这种方式实现了对图全局信息的层次化学习。


    （2）基于TopK的池化机制：对图中每个节点学习出一个分数，基于这个分数的排序丢弃一些低分数的节点，这类方法借鉴了CNN中最大池化操作的思路：将更重要的信息筛选出来。所不同的是，图数据中难以实现局部滑窗操作，因此需要依据分数进行全局筛选。


    （3）基于边收缩（Edge Contraction）的池化机制：边收缩是指并行地将图中的边移除，并将被移除边的两个节点合并，同时保持被移除节点的连接关系，该思路是一种通过归并操作来逐步学习图的全局信息的方法。


    ### 8.2.1　基于图坍缩的池化机制


    1.图坍缩


    假设对于图G，通过某种划分策略得到K个子图![](Images/157-i.jpg)，N[k]表示子图G^(（k）)中的节点数，Г^(（k）)表示子图G^(（k）)中的节点列表。


    ![](Images/8a1.jpg)


    图8-1　图坍缩示例


    下面我们给出图坍缩中的两个比较重要的矩阵：


    第一个是簇分配矩阵S∈R^(N×K)，其定义如下：S[ij]\=1当且仅当v[i]∈Г^(（j）)。


    例如，在图8-1所示的图坍缩示例中，我们将图G划分成两个簇，这两个簇对应了图坍缩之后的两个超级节点，其中Г^(（1）)\={v[1]，v[2]，v[3]}，Г^(（2）)\={v[4]，v[5]，v[6]}。因此：


    ![](Images/157-3-i.jpg)


    下来我们考察一下S^TAS的意义：由于S^T的第i行表示的是所有属于第i个簇的节点，依据矩阵乘法可知，（S^TA）[ij]表示的是第i个簇内所有与节点v[j]（全图中的第j个节点）有关联的连接强度之和。同理可推，（（S^TA）S）[ij]反映了第i个簇与第j个簇的连接强度。如图8-1中的例子：


    ![](Images/158-i.jpg)


    如果我们令：


    ![](Images/158-2-i.jpg)


    A[coar]描述了图坍缩之后的超级节点之间的连接强度，其中包含了超级节点自身内部的连接强度，如果只考虑超级节点之间的连接强度，我们可以设置A[coar]\[i，i\]=0。


    第二个是采样算子C∈R^(N×Nk)，其定义为：![](Images/158-3-i.jpg)，当且仅当![](Images/158-4-i.jpg)。


    其中，![](Images/158-5-i.jpg)表示列表Г^(（k）)中的第j个元素。C是节点在原图和子图中顺序关系的一个指示矩阵。比如上例中的![](Images/158-6-i.jpg)。


    假设定义在G上的一维图信号为x∈R^N，下列两式分别完成了对图信号的下采样与上采样操作：


    ![](Images/159-i.jpg)


    上述左式完成了对图信号在子图G^(（k）)上的采样（切片）功能；右式完成了子图信号x^(（k）)在全图的上采样功能，该操作保持子图中节点的信号值不变，同时将不属于该子图的其他节点的值设置为0。显然，该采样算子也适用于多维信号矩阵X∈R^(N×d)。


    有了采样算子的定义，对于子图G^(（k）)的邻接矩阵![](Images/159-2-i.jpg)，可以通过下式获得（事实上，A^(（k）)也可以通过对A进行矩阵的双向切片操作获得）：


    ![](Images/159-3-i.jpg)


    根据式（8.4）可以得到上面例子中第一个簇内的邻接矩阵：


    ![](Images/159-4-i.jpg)


    通过上述两个矩阵可以确定簇内的邻接关系以及簇间的邻接关系。进一步来讲，如果能够确定簇内信号的融合方法，将结果表示为超级节点上的信号，那么我们迭代式地重复上述过程，就能获得越来越全局的图信号了。图8-2所示为图坍缩与GNN结合的过程：该图展示了一个经过3个池化层最后坍缩成一个超级节点，然后进行图分类任务的GNN模型。图中相同颜色的节点被划分到一个簇上，形成下层的一个超级节点，在得到最后一个超级节点的特征向量之后，紧接着使用了一个三层的MLP网络进行图分类任务的学习。


    ![](Images/8a2.jpg)


    图8-2　图坍缩与GNN结合的过程[^(\[2\])](../Text/chapter97.xhtml#hh-2)


    2.DIFFPOOL


    DIFFPOOL^([\[1\]](#chapter93.xhtml#ch1_back))是首个将图坍缩过程与GNN结合起来进行图层面任务学习的算法。DIFFPOOL提出了一个可学习的簇分配矩阵。具体来说就是，首先通过一个GNN对每个节点进行特征学习，然后通过另一个GNN为每个节点学习出所属各个簇的概率分布：


    ![](Images/160-2-i.jpg)


    其中![](Images/160-3-i.jpg)，n^(（l）)表示第l层的节点数，n^(（l+1）)表示第（l+1）层的节点（簇）数，相较于上面例子中S矩阵的硬分配，这里面学习出来的S矩阵是一个软分配器，其值表示节点被分配到任意一个簇的概率，由于概率值不为0，因此这是一个下层超级节点到上层所有节点之间的全连接结构。GNN[l，]embed、GNN[l，]pool是两个独立的GNN层，二者的输入相同，但是参数不同，学习的目的不同。需要强调一点的是，对于最后一层的簇分配矩阵，我们需要直接将该矩阵固定成一个全“1”的矩阵，这是因为，此时需要将图坍缩成一个超级节点，由此获得图的全局表示。


    有了上述两个式子的输出结果，我们可以对图进行坍缩：


    ![](Images/160-4-i.jpg)![](Images/161-i.jpg)


    本文将上述两个公式称为DIFFPOOL层（（A^(（l）)，Z^(（l）)）→（A^(（l+1）)，H^(（l+1）)））。式（8.7）是对簇内的信息执行融合操作，依据矩阵乘法的行向量计算方式，可以清楚地知道![](Images/161-2-i.jpg)表示的是对簇内所有节点的特征向量进行加和处理。式（8.8）即为簇间的邻接矩阵的计算。


    DIFFPOOL具有排列不变性：假设P∈{0，1}^(n×n)是一个任意的排列矩阵，只需要保证前面用到的GNN层是排列不变的，DIFFPOOL层就具有排列不变性，即：


    ![](Images/161-3-i.jpg)


    排列矩阵的作用是对图中节点进行重排序，比如一个仅有两个节点相连的图，如果我们需要将两个节点的编号进行对调，则对应的排列矩阵![](Images/161-4-i.jpg)，排列矩阵是正交的，即P^TP=I。我们可以通过PX、PAP^T来分别获得重排序之后的特征矩阵与邻接矩阵。


    证明：假设我们用到的GNN模型是GCN模型，GCN模型是满足排列不变的。设GCN的输出![](Images/161-5-i.jpg)，现在使用P对输入进行重排序，则：


    ![](Images/161-6-i.jpg)


    这里用到了P^TP=I的性质。由此可知，对GCN输入节点的顺序进行重排列，输出节点的顺序也会对应排列，但节点输出的表达向量并不会改变。因此，GCN是具有排列不变性的（也有称这种性质为排列等变性的，这是由于GCN所使用的聚合操作是排列不变的，可参考7.1节的相关内容）。


    接着将此时GCN的各个输出值代入DIFFPOOL的式（8.7）、式（8.8）中，得到：


    ![](Images/162-i.jpg)


    从所得结果可以看出来，这种重排列操作并没有改变DIFFPOOL的两个输出结果。于是式（8.9）得证。


    总的来说，如果我们将GCN与DIFFPOOL合在一起看成一个层，对输入的图数据进行任意的重新编号，输出到下一层的特征矩阵与邻接矩阵并不会改变，这种性质是非常符合直觉的：节点是否重新排序并不应该影响节点聚合成簇的结果。


    有了上述DIFFPOOL层的定义，我们就可以模仿CNN分类模型的结构设计，不断组合堆叠GNN层与DIFFPOOL层，实现一种可导的、层次化池化的学习机制，并逐渐获得图的全局表示。可能的图分类模型的结构在图8-2中已经给出，这里不再赘述。


    3.EigenPooling


    EigenPooling[^(\[3\])](../Text/chapter97.xhtml#hh-3)也是一种基于图坍缩的池化机制，但是不同于本章介绍的其他方法，EigenPooling没有对图分类模型引入任何需要学习的参数，这种非参的池化机制与视觉模型中的各类池化层具有很高的类比性，如表8-1所示：


    表8-1　EigenPooling与视觉模型中的池化比较


    ![](Images/8b1.jpg)


    从表8-1中我们可以再一次看到，GNN模型与CNN模型其实是殊途同归的。回到EigenPooling的具体过程中，其核心步骤在于作用域的选取以及池化操作，作用域是通过划分子图的方式对图进行分区得到的，这等价于图坍缩的过程，通过这一步可以得到新的超级节点之间的邻接矩阵，池化操作需要考虑的是对作用域内的信息进行融合，通过这一步可以得到关于新的超级节点的特征矩阵。值得注意的是，在视觉模型中的池化操作的作用域都是规则的栅格结构，比如2×2大小的滑窗，滑窗之间没有结构性的区别，而在图坍缩的子图上，作用域内的信息包含了结构信息与属性信息，特别是结构信息，不同的子图间有比较大的区别，因此结构信息的提取也是一个需要重点考虑的问题，EigenPooling就同时考虑了这两种信息并进行了融合。下面对上述两个步骤进行详细讲解。


    （1）图坍缩


    与DIFFPOOL通过学习出一个簇分配矩阵来进行子图划分不同的是，EigenPooling中的图坍缩并没有给图分类模型引进任何需要学习的参数，其思路是借用一些图分区的算法来实现图的划分，比如选用谱聚类算法[^(\[4\])](../Text/chapter97.xhtml#hh-4)。谱聚类是一类比较典型的聚类算法，其基本思路是先将数据变换到特征空间以凸显更好的区分度，然后执行聚类操作（比如选用Kmeans算法进行聚类），算法的输入是邻接矩阵以及簇数K，输出的是每个节点所属的簇。值得注意的是，这里如果选用Kmeans算法进行聚类，那么簇的分配就是一种硬分配，每个节点仅能从属于一个簇，这种硬分配机制保持了图坍缩之后的超级节点之间连接的稀疏性，与之相对的是DIFFPOOL中的软分配机制，节点以概率的形式分配到每一个簇中，导致超级节点之间以全连接的形式彼此相连，大大增加了模型的空间复杂度与时间复杂度。


    将图进行划分之后，我们调用式（8.2）就可以得到超级节点间的邻接关系，当然，EigenPooling在这一步并没有考虑超级节点簇内的连接强度。


    （2）池化操作


    在确定了子图划分以及相应的邻接矩阵之后，我们需要对每个子图内的信息进行整合抽取。在DIFFPOOL中选择了对节点特征进行加和，这种处理方式损失了子图本身的结构信息。而EigenPooling用子图上的信号在该子图上的图傅里叶变换来代表结构信息与属性信息的整合输出。从第5章的学习中我们知道，图信号的频谱展示了图信号在各个频率分量上的强度，它是将图的结构信息与信号本身的信息统一考虑进去，而得到的一种关于图信号的标识信息。因此，EigenPooling选用了频谱信息来表示子图信息的统一整合。下面给出其具体计算过程：


    假设子图G^(（k）)的拉普拉斯矩阵为L^(（k）)，对应的特征向量为![](Images/164-i.jpg)，然后，使用上采样算子C^(（k）)将该特征向量（子图上的傅里叶基）上采样到整个图：


    ![](Images/164-2-i.jpg)


    为了将上述操作转换成矩阵形式，以得到池化算子Θ[l]∈R^(N×K)，我们将所有子图的第l个特征向量按行方向组织起来形成矩阵Θ[l]，即：


    ![](Images/164-3-i.jpg)


    需要注意的是，子图的节点数量是不同的，所以特征向量的数量也不同。用![](Images/164-4-i.jpg)表示子图中的最大节点数。然后，若子图G^(（k）)的节点数小于N[max]，可以将![](Images/164-5-i.jpg)设置为![](Images/164-6-i.jpg)。有了池化算子的矩阵形式，池化过程可描述如下：


    ![](Images/164-7-i.jpg)


    X[l]∈R^(K×d)是池化的结果。X[l]的第k行表示的是第k个超级节点在Θ[l]作用下的表示向量。按照该机制，我们共需要设计N[max]个池化算子。为了结合不同池化算子收集到的信息，我们可以采用按列方向拼接的方式，将各个结果连接起来：


    ![](Images/164-8-i.jpg)


    其中![](Images/164-9-i.jpg)是EigenPooling最终的池化结果。同第6.3节中论述的一样，作者在该文中也论证了现实场景下的图数据中低频信息的有效性。因此，为了提高计算效率，我们可以选择使用前H个特征向量对应的池化结果，一般为H《N[max]：


    ![](Images/164-10-i.jpg)


    上述计算都在矩阵层面进行，如果将计算回到向量形式上，我们可以更加清楚地看出EigenPooling是怎么利用图傅里叶变换对子图信息进行整合的。不失一般性，设全图上的信号为x，则式（8.15）可描述为：


    ![](Images/165-i.jpg)


    其输出表示子图上的信号在子图上对应的第l个特征向量上的傅里叶系数。式（8.16）的操作过程如图8-3所示：


    ![](Images/8a3.jpg)


    图8-3　EigenPooling中子图上的图傅里叶变换


    图8-3中原图被划分成蓝、红两个子图，由于N[max]\=4，所以输出矩阵为R^(2×4)，每行表示的是在该子图信号上的前4个图傅里叶系数。


    同DIFFPOOL一样，如果EigenPooling的前置GNN层选用GCN的话，EigenPooling整体也将具有排列不变性，具体证明可以从GCN、图坍缩、池化操作3个过程着手，其证明过程与DIFFPOOL的证明类似，这里不再赘述。


    总的来说，EigenPooling作为一种不带任何学习参数的池化机制，可以非常方便地整合到一般的GNN模型中，实现对图信息的层次化抽取学习。与DIFFPOOL相比，其主要优势在于保持了超级节点之间连接的稀疏性，提高了计算效率，同时在进行池化操作时，兼顾了子图内的结构信息与属性信息，这种做法显然更加合理。


