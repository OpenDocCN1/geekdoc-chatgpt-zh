    如果把邻居作为上下文，那么上述对比损失就在建模节点与邻居节点的共现关系。在`GraphSAGE`的论文中就描述了这样一种无监督学习方式，与`DeepWalk`一样，我们可以将在随机游走时与中心节点`v[i]`一起出现在固定长度窗口内的节点`v[j]`视为邻居，同时通过负采样的手段，将不符合该关系的节点作为负样本。与`DeepWalk`不同是，节点的表示学习模型仍使用`GNN`，即：


    ![](Images/185-2-i.jpg)


    这里的`p[n]`是一个关于节点出现概率的负采样分布，得分函数使用向量内积加`sigmoid`函数，将分数限制在`[0, 1]`内。这个方法在优化目标上与图自编码器基本等同，但是这种负采样形式的对比优化并不需要与图自编码器一样显式地解码出邻接矩阵`Â`，由于`Â`破坏了原始邻接矩阵的稀疏性，因此该方法不需要承担`O(N²)`的空间复杂度。


    #### 2. 将子图作为上下文


    将邻居作为上下文时，强调的是节点之间的共现关系，这种共现关系更多反映了图中节点间的距离远近，缺乏对节点结构相似性的捕捉。而通常节点局部结构上的相似性是节点分类任务中一个比较关键的因素[^(\[9\])](../Text/chapter104.xhtml#ii-9)。比如图上两个相距很远的节点如果具有一样的子图结构，基于共现关系的建模方法就难以有效刻画这种结构上的对等性。因此，论文[^(\[10\])](../Text/chapter104.xhtml#ii-10)就提出直接将子图作为一种上下文进行对比学习。具体子图的定义如图9-3所示：


    ![](Images/9a3.jpg)


    图9-3　将子图作为上下文进行预测^([\[1\]](#chapter102.xhtml#ch1_back))


    对于一个中心节点，如图9-3中的红色节点所示，我们用一个`GNN`在其`K`阶子图上提取其表示向量，同时我们将处于中心节点`r[1]–hop`与`r[2]–hop`之间的节点定义为该中心节点的上下文锚点，如图9-3所示。设`K=2`，`r[1]=1`，`r[2]=4`，我们用另一个`GNN`来提取每个节点作为上下文锚点时的表示向量，同时为了得到一个总的、固定长度的上下文表示向量，我们使用读出机制来聚合上下文锚点的表示向量。用公式表示如下：


    ![](Images/186-2-i.jpg)


    #### 3. 全图作为上下文


    在引文^([\[2\]](#chapter102.xhtml#ch2_back))中提出了`Deep Graph Infomax`（`DGI`）[^(\[11\])](../Text/chapter104.xhtml#ii-11)的方法对图数据进行无监督表示学习。该方法实现了一种节点与全图之间的对比损失的学习机制。其具体做法如下：


    ![](Images/187-i.jpg)


    首先为了得到负采样样本，需要对图数据进行相关扰动，得到（`X_corrupt`、`A_corrupt`）具体的加噪方法上文中已有概括。然后将这两组图数据送到同一个`GNN`模型中进行学习。为了得到图的全局表示，我们使用读出机制对局部节点的信息进行聚合。在最后的损失函数中，作者固定了全图表示，对节点进行了负采样的对比学习。这样处理是为了方便后续的节点分类任务。从互信息[^(\[12\])](../Text/chapter104.xhtml#ii-12)[^(\[13\])](../Text/chapter104.xhtml#ii-13)的角度来看，通过一个统一的全局表示最大化全图与节点之间的互信息，这样可以在所有节点的表示之间建立起一层更直接的联系。比如上面提到的相距较远的节点之间的结构相似性的学习问题，这种设计可以保障该性质的高效学习。图9-4为上述过程的示意图：


    ![](Images/9a4.jpg)


    图9-4　节点与全图对比损失学习机制^([\[3\]](#chapter102.xhtml#ch3_back))


    同时在全图层面的无监督学习上，上述损失函数的负样本刚好相反，需要抽取其他图的表示`G_neg`来代替，即：


    ![](Images/187-4-i.jpg)


    此时，由于是全图层面的任务，所以我们希望通过上式让全图与其所有局部节点之间实现互信息最大化，也即获得全图最有效、最具代表性的特征，这对图的分类任务十分有益。


    [\[1\]](#chapter102.xhtml#ch1) Weihua Hu，Bowen Liu，Joseph Gomes，Marinka Zitnik，Percy
    Liang，Vijay S.Pande and Jure Leskovec.Pre-training Graph Neural Networks.arXiv
    preprint arXiv：1905.12265，2019.


    [\[2\]](#chapter102.xhtml#ch2) VeličkovićP，Fedus W，Hamilton W L，et al.Deep graph
