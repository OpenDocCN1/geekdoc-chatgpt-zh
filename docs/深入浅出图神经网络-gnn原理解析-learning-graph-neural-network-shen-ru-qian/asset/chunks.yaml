    feature），而高层次的特征则与具体的任务相关。可以基于深度学习的这个特性进行迁移学习。迁移学习指的是将已经学习过的知识迁移到新的问题中去，深度学习在该方面的一个典型应用是微调，即以在其他数据集上训练好的模型为基础，在新的数据集上再进行调整。比如很多视觉相关的任务都是采用在ImageNet上预训练的模型，固定住一些卷积层，不对它们进行梯度更新，因为它们提取的都是通用的特征，只对高层的结构进行一些修改，比如改变输出层的维度以适应不同类别数的分类问题，然后使用新的数据调整模型。


    表示学习的任务通常是学习这样一个映射：f：X→R^d，即将输入映射到一个稠密的低维向量空间中。在接下来的两节我们将介绍两种典型的表示学习方法，一种是基于重构损失的方法；一种是基于对比损失的方法。


    ## 4.2　基于重构损失的方法—自编码器


    深度学习的优势在于自动学习特征，卷积神经网络利用图像标签进行监督，可以学习到有判别性的特征以对图像进行分类，它将表示学习与任务学习结合起来，是一种有监督学习。自编码器也是一种表示学习模型，但它不是利用标签信息进行监督，而是以输入数据为参考，是一种无监督的学习模型，它可以用于数据降维和特征提取。


    ### 4.2.1　自编码器


    自编码器是基于深度学习模型进行表示学习的典型方法，它的思路非常简单，就是将输入映射到某个特征空间，再从这个特征空间映射回输入空间进行重构。从结构上看，它由编码器和解码器组成，编码器用于从输入数据中提取特征，解码器用于基于提取的特征重构出输入数据。在训练完成后，使用编码器进行特征提取。这种编码–解码的思想在很多深度学习模型中都有体现。


    最简单的自编码器由3层组成：1个输入层、1个隐藏层、1个输出层，如图4-3所示，其中从输入层到隐藏层的输出部分称为编码器，从隐藏层输出到输出层称为解码器。给定输入x∈R^n，假设从输入层到隐藏层的变换矩阵为Wenc∈R^(d×n)，d为隐藏层的神经元数目，编码器如式（4.1）所示，编码后的特征为h∈R^d。解码器将编码特征h映射回输入空间，得到重构的输入![](Images/070-i.jpg)，假设从隐藏层到输出层的编码矩阵为W[enc]∈R^(n×d)，如式（4.2）所示：


    ![](Images/070-2-i.jpg)


    自编码器不需要额外的标签信息进行监督学习，它是通过不断最小化输入和输出之间的重构误差进行训练的，基于损失函数（4.3），通过反向传播计算梯度，利用梯度下降算法不断优化参数W[enc]、W[dec]、b[enc]、b[dec]。


    ![](Images/070-3-i.jpg)


    自编码器的结构不局限于只有一个隐藏层的全连接网络，一般来说，编码器和解码器可以是更复杂的模型，分别用f和g表示，损失函数可以表示为式（4.4），其中N为样本数量。


    ![](Images/070-4-i.jpg)![](Images/4a3.jpg)


    图4-3　自编码器结构示意


    我们希望通过训练编码器得到数据中的一些有用特征，最常用的一种方法是通过限定h的维度比x的维度小，即d<n，符合这种条件的编码器称为欠完备自编码器。这种自编码器在一定的条件下可以得到类似于主成分分析（PCA）的效果。使用非线性的编码器和解码器可以得到更强大的效果。


    ### 4.2.2　正则自编码器


    如果我们放宽上述对于编码器维度的限制，允许编码器的维度大于或者等于输入的维度，即d≥n，这种编码器称为过完备自编码器。如果对于过完备自编码器不加任何限制，那么有可能不会学习到数据的任何有用信息，而仅仅是将输入复制到输出，导致这个问题的本质原因不是维度约束的变化，而是当我们赋予编码器和解码器过于强大的“能力”时，自编码器会倾向于直接将输入拷贝到输出，而不会从数据中提取到有价值的特征。因此，我们常常会对模型进行一些正则化的约束，下面介绍几种常见的正则化自编码器。


    1.去噪自编码器


    不同于上面介绍的原始自编码器，去噪自编码器[^(\[2\])](../Text/chapter55.xhtml#dd-2)的改进在于在原始输入的基础上加入了一些噪声作为编码器的输入，解码器需要重构出不加噪声的原始输入x，通过施加这个约束，迫使编码器不能简单地学习一个恒等变换，而必须从加噪的数据中提取出有用信息用于恢复原始数据。


    具体的做法是随机将输入x的一部分值置0，这样就得到了加了噪声的输入x[δ]作为编码器的输入，解码器需要重构出不带噪声的数据x，因此损失函数为：


    ![](Images/071-i.jpg)


    2.稀疏自编码器


    除了给输入加噪，还可以通过在损失函数上加入正则项使得模型学习到有用的特征。假设隐藏层使用Sigmoid激活函数，我们认为当神经元的输出接近于1时，它是比较“活跃”的，当输出接近于0时，它是不“活跃”的。稀疏编码器就是以限制神经元的活跃度来约束模型的，尽可能使大多数的神经元都处于不活跃的状态。


