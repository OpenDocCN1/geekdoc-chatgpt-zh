    \n新浪微博 @华章数媒\n\n微信公众号 华章电子书（微信号：hzebook）\n\n# 前言\n\n为何写作本书\n\n近年来，作为一项新兴的图数据学习技术，图神经网络（GNN）受到了非常广泛的关注。2018年年末，发生了一件十分有趣的事情，该领域同时发表了三篇综述类型论文，这种“不约而同”体现了学术界对该项技术的认可。事实上，在2019年的各大顶级学术会议上，与图神经网络有关的论文也占据了相当可观的份额。相信在未来几年，这种流行的趋势会只增不减。\n\
    \n图神经网络技术的出现有其必然性和重要性。在深度神经网络技术兴起的前几年，图像、语音、文本等形式的数据都能都能在深度学习中被很好地应用，并获得了十分好的效果。这促使大量的相关应用进入了实用阶段，如人脸识别、语音助手、机器翻译等。尽管如此，深度学习一直无法很好地对另一类形式的数据—图数据（或称网络数据）进行有效地适配。作为一类主要用来描述关系的通用数据表示方法，图数据在产业界有着更加广阔的应用场景，在诸如社交网络、电子购物、物联网、生物制药等场景中，都可以找到图数据的影子。将深度学习技术的成功经验迁移到图数据的学习中来，是一种十分自然且必要的需求。\n\
    \n在这样的背景下，图神经网络的出现很好的填补了上述技术空白，实现了图数据与深度学习技术的有效结合，使得深度学习能够在图数据的相关应用场景中继续攻城略地。事实上，纵观这三年，图神经网络技术的相关应用和研究已经拓展到了极其广泛的领域，从视觉推理到开放的阅读理解问题，从药物分子的研发到5G芯片的设计，从交通流量预测到3D点云数据的学习，该项技术都展示出了极其重要且极具渗透性的应用能力，这种能力必将给产业界带来极高的应用价值。\n\
    \n笔者所在公司极验在业务风控的应用场景中，长期奋战在网络攻防对抗的前线，在这样的背景下，不管是主动还是被动，都促使我们不断努力提升数据分析与数据建模的能力，一直以来，我们都期望有一套端对端的模型来高效学习数据中的关系或结构化信息。极验在2017年年中与图神经网络技术结缘，正好提供了这样的契机，在对该项技术进行多番论证并上线到极验的实际业务中后，取得了超出预期的效果，这极大提升了我们对该项技术的热情。同时，为了更好地对这项新技术进行讨论和学习，我们组织了相应的学习社群，大家都表现出了高昂的热情，这份热情激励笔者将更多精力投入到该项技术上，也正因如此，写一本关于图神经网络的书籍的想法应运而生。期望通过本书，让读者朋友对该项技术的来龙去脉有更清晰、全面的认识。如果能产生更大的知识分享成果，那么本书的价值就更高了，这将是对我们的最好回报。\n\
    \n本书读者对象\n\n·想学习并初步实践图神经网络技术的读者\n\n·想较系统且深入理解图神经网络技术的读者\n\n本书主要内容\n\n本书分为三大部分：\n\
    \n第一部分为基础篇，包括第1～4章，其中第1章中笔者撰写，第2～4章由李彦霖撰写。主要介绍学习图神经网络所需的基础知识，包括图的基本概念、卷积神经网络以及表示学习，帮助初学者更加清晰地认识到图神经网络技术与深度学习技术是一脉相承的。\n\
    \n第二部分为高级篇，包括第5～9章。这部分是本书的重点，主要讲解图卷积神经网络的理论基础和性质、图神经网络的各种变体和框架范式、图分类以及基于GNN的图表示学习。该部分的各章节都有相关的实践案例，为读者规划了完整的从理论到实践的学习路线，帮助读者系统全面地学习图神经网络。这部分有两位作者，理论部分由笔者撰写，实践案例的代码由李彦霖提供。\n\
    \n第三部分为应用篇，即第10章，主要介绍了图神经网络目前的一些应用。图神经网络的应用非常广泛，现实应用场景非常多，但鉴于本书的规划，这里只是略着笔墨，旨在抛砖引玉，让读者对应用场景有一定的认知。这部分由周洋撰写。\n\
    \n最后，每个章节都附有相关的参考文献。\n\n本书特色\n\n本书有如下特色：\n\n（1）详细阐述了图卷积模型的由来，以及什么是频域图卷积和空域图卷积，这是很多初学者学习该技术的第一只“拦路虎”；\n\
    \n（2）集中阐述了图卷积模型的性质，这些性质的解读对读者深入地理解图神经网络技术有着重要的作用；\n\n（3）给出了关键部分的代码，希望能辅助读者清晰理解书中的一些公式里的变量的具体含义。\n\
    \n（4）本书为了帮助读者理解图神经网络的相关概念和技术，提供了很多示意图。\n\n勘误和支持\n\n由于作者的水平有限，编写时间仓促，书中难免会出现一些错误或者不准确的地方，恳请读者批评指正。如果你遇到任何问题，可以访问我们专门为本书创建的技术主页[https://github.com/FighterLYL/GraphNeuralNetwork](https://github.com/FighterLYL/GraphNeuralNetwork)，我们将尽量为读者提供满意的解答。如果你有更多宝贵的意见，也欢迎发送邮件至邮箱yfc@hzbook.com，期待能够得到你们的真挚反馈。\n\
    \n致谢\n\n首先要感谢这个开放的时代，深度学习技术的爆发离不开产、学、研的紧密结合，在信息开放、知识分享的大背景下，我们每一个人都是其中的受益者。\n\n\
    感谢笔者所在公司极验科技，对本书的写作提供了大力支持，特别是同事谢永芬，完成了书稿所有章节的初排工作，为其中大量的公式和插图付出了许多精力。\n\n感谢机械工业出版社华章公司的编辑杨福川和张锡鹏，在这段时间始终支持我们的写作，他们的耐心和专业引导我们顺利完成了撰写工作。\n\
    \n最后，感谢我的妻子，她理解并支持我这段时间的挑灯写作，家人的关怀是我前进的动力！\n\n刘忠雨\n\n# 第1章　图的概述\n\n图（Graph）是一个具有广泛含义的对象。在数学中，图是图论的主要研究对象；在计算机工程领域，图是一种常见的数据结构；在数据科学中，图被用来广泛描述各类关系型数据。许多图学习的理论都专注于图数据相关的任务上。\n\
    \n通常，图被用来表示物体与物体之间的关系。这在生活中有着非常多的现实系统与之对应，比如化学分子、通信网络、社交网络等。事实上，任何一个包含二元关系的系统都可以用图来描述。因此，研究并应用图相关的理论，具有重大的现实意义。\n\
    \n本章，我们主要对图相关的概念做一些基础介绍，包括图的基本定义、图在计算机中的存储表示方法与遍历方法、图数据及其常见的应用场景、图数据深度学习的浅述。\n\
    \n## 1.1　图的基本定义\n\n在数学中，图由顶点（Vertex）以及连接顶点的边（Edge）构成。顶点表示研究的对象，边表示两个对象之间特定的关系。\n\
    \n图可以表示为顶点和边的集合，记为G=（V，E），其中V是顶点集合，E是边集合。同时，我们设图G的顶点数为N，边数为M（如无特殊说明，本书中的图均如此表示）。一条连接顶点v[i]，v[j]∈V的边记为（v[i]，v[j]）或者e[ij]。如图1-1所示，V={v[1]，v[2]，v[3]，v[4]，v[5]}，E={（v[1]，v[2]），（v[1]，v[3]），（v[2]，v[4]），（v[2]，v[3]），（v[3]，v[4]），（v[4]，v[5]）}。\n\
    \n![](Images/1a1.jpg)\n\n图1-1　图G的定义\n\n### 1.1.1　图的基本类型\n\n1.有向图和无向图\n\n如果图中的边存在方向性，则称这样的边为有向边e[ij]\\\
    =<v[i]，v[j]\\>，其中v[i]是这条有向边的起点，v[j]是这条有向边的终点，包含有向边的图称为有向图，如图1-2所示。与有向图相对应的是无向图，无向图中的边都是无向边，我们可以认为无向边是对称的，同时包含两个方向：e[ij]\\\
    =<v[i]，v[j]\\>=<v[j]，v[i]\\>=e[ji]。\n\n![](Images/1a2.jpg)\n\n图1-2　有向图\n\n2.非加权图与加权图\n\
    \n如果图里的每条边都有一个实数与之对应，我们称这样的图为加权图，如图1-3所示，该实数称为对应边上的权重。在实际场景中，权重可以代表两地之间的路程或运输成本。一般情况下，我们习惯把权重抽象成两个顶点之间的连接强度。与之相反的是非加权图，我们可以认为非加权图各边上的权重是一样的。\n\
    \n![](Images/1a3.jpg)\n\n图1-3　加权图\n\n3.连通图与非连通图\n\n如果图中存在孤立的顶点，没有任何边与之相连，这样的图被称为非连通图，如图1-4所示。相反，不存在孤立顶点的图称为连通图。\n\
    \n4.二部图\n\n二部图是一类特殊的图。我们将G中的顶点集合V拆分成两个子集A和B，如果对于图中的任意一条边e[ij]均有v[i]∈A，v[j]∈B或者v[i]∈B，v[j]∈A，则称图G为二部图，如图1-5所示。二部图是一种十分常见的图数据对象，描述了两类对象之间的交互关系，比如：用户与商品、作者与论文。\n\
    \n![](Images/1a4.jpg)\n\n图1-4　非连通图\n\n![](Images/1a5.jpg)\n\n图1-5　二部图\n\n### 1.1.2　邻居和度\n\
    \n如果存在一条边连接顶点v[i]和v[j]，则称v[j]是v[i]的邻居，反之亦然。我们记v[i]的所有邻居为集合N（v[i]），即：\n\n![](Images/004-i.jpg)\n\
    \n以v[i]为端点的边的数目称为v[i]的度（Degree），记为deg（v[i]）：\n\n![](Images/004-2-i.jpg)\n\n在图中，所有节点的度之和与边数存在如下关系：\n\
    \n![](Images/004-3-i.jpg)\n\n在有向图中，我们同时定义出度（Outdegree）和入度（Indegree），顶点的度数等于该顶点的出度与入度之和。其中，顶点v[i]的出度是以v[i]为起点的有向边的数目，顶点v[i]的入度是以v[i]为终点的有向边的数目。\n\
    \n### 1.1.3　子图与路径\n\n若图G'=（V'，E'）的顶点集和边集分别是另一个图G=（V，E）的顶点集的子集和边集的子集，即V'⊆V，且E'⊆E，则称图G'是图G的子图（Subgraph）。\n\
    \n在图G=（V，E）中，若从顶点v[i]出发，沿着一些边经过一些顶点![](Images/004-4-i.jpg)，到达顶点v[j]，则称边序列![](Images/004-5-i.jpg)为从顶点v[i]到顶点v[j]的一条路径（Path，也可称为通路），其中![](Images/004-6-i.jpg)为图G中的边。\n\
    \n路径的长度：路径中边的数目通常称为路径的长度L（P[ij]）=|P[ij]|。\n\n顶点的距离：若存在至少一条路径由顶点v[i]到达顶点v[j]，则定义v[i]到v[j]的距离为：\n\
    \n![](Images/004-7-i.jpg)\n\n也即两个顶点之间的距离由它们的最短路径的长度决定。我们设d（v[i]，v[j]）=0，节点到自身的距离为0。\n\
    \nk阶邻居：若d（v[i]，v[j]）=k，我们称v[j]为v[i]的k阶邻居。\n\nk阶子图（k-subgraph）：我们称一个顶点v[i]的k阶子图为：\n\
    \n![](Images/005-i.jpg)\n\n有时，我们也称k阶子图为k-hop。图1-6中的阴影部分就是顶点V[1]的2阶子图。\n\n![](Images/1a6.jpg)\n\
    \n图1-6　图G的2阶子图\n\n## 1.2　图的存储与遍历\n\n### 1.2.1　邻接矩阵与关联矩阵  \n\n作为一种常见的数据结构，在计算机里图的存储表示方法有很多种，本节只着重介绍邻接矩阵（Adjacency\
    \ matrix）和关联矩阵（Incidence matrix）这两种方式。\n\n设图G=（V，E），在这里我们对边重新进行了编号e[1]，e[2]，…，e[M]，如图1-7所示。我们用邻接矩阵A描述图中顶点之间的关联，A∈R^(N×N)，其定义为：\n\
    \n![](Images/005-2-i.jpg)![](Images/1a7.jpg)\n\n图1-7　图G示例\n\n用邻接矩阵存储图的时候，我们需要一个一维数组表示顶点集合，需要一个二维数组表示邻接矩阵。需要特别说明的是，由于在实际的图数据中，邻接矩阵往往会出现大量的0值，因此可以用稀疏矩阵的格式来存储邻接矩阵，这样可以将邻接矩阵的空间复杂度控制在O（M）的范围内。图1-8中a图给出了图G的邻接矩阵存储表示，通过该图可以看出，无向图的邻接矩阵是沿主对角线对称的，即A[ij]\\\
    =A[ji]。\n\n![](Images/1a8.jpg)\n\n图1-8　图G的邻接矩阵和关联矩阵\n\n除了邻接矩阵外，我们有时也用关联矩阵B∈R^(N×M)来描述节点与边之间的关联，定义如下：\n\
    \n![](Images/006-3-i.jpg)\n\n用关联矩阵存储图的时候，我们需要两个一维数组分别表示顶点集合和边集合，需要一个二维数组表示关联矩阵。同样，关联矩阵也可以用稀疏矩阵来存储，这是因为B的任意一列仅有两个非0值。图1-8中b图展示了用关联矩阵来存储图的示例。\n\
    \n### 1.2.2　图的遍历\n\n图的遍历是指从图中的某一顶点出发，按照某种搜索算法沿着图中的边对图中的所有顶点访问一次且仅访问一次。图的遍历主要有两种算法：深度优先搜索（DFS，Depth-First-Search）和广度优先搜索（BFS，Breadth-First-Search）。图的遍历是一种重要的图检索手段，深度优先搜索与广度优先搜索给出了相应的算法基础。\n\
    \n深度优先搜索是一个递归算法，有回退过程。其算法思想是：从图中某一顶点v[i]开始，由v[i]出发，访问它的任意一个邻居w[1]；再从w[1]出发，访问w[1]的所有邻居中未被访问过的顶点w[2]；然后再从w[2]出发，依次访问，直到出现某顶点不再有邻居未被访问过。接着，回退一步，回退到前一次刚访问过的顶点，看是否还有其他未被访问过的邻居，如果有，则访问该邻居，之后再从该邻居出发，进行与前面类似的访问；如果没有，就再回退一步进行类似访问。重复上述过程，直到该图中所有顶点都被访问过为止。以图1-7为例，我们可以得到如下深度优先搜索序列：v[1]→v[2]→v[4]→v[5]→v[3]。\n\
    \n广度优先搜索是一个分层的搜索过程，没有回退过程，其算法思想是：从图中某一顶点v[i]开始，由v[i]出发，依次访问v[i]的所有未被访问过的邻居w[1]，w[2]，…，w[n]；然后再顺序访问w[1]，w[2]，…，w[n]的所有还未被访问过的邻居，如此一层层执行下去，直到图中所有顶点都被访问到为止。以图1-7为例，我们可以得到如下广度优先搜索序列：v[1]→v[2]→v[3]→v[4]→v[5]。\n\
    \n## 1.3　图数据的应用场景\n\n我们提到图，更多的是带有一种数学上的理论色彩，在实际的数据场景中，我们通常将图称为网络（Network），与之对应的，图的两个要素（顶点和边）也被称为节点（Node）和关系（Link），比如我们熟知的社交网络、物流网络等概念名词。为了达成统一并与神经网络（Neural\
    \ Networks）中的“网络”概念区分开来（尽管神经网络也是一种网络），本书将网络数据称为图数据。\n\n图数据是一类比较复杂的数据类型，存在非常多的类别。这里我们介绍其中最重要的4类：同构图（Homogeneous\
    \ Graph）、异构图（Heterogeneous Graph）、属性图（Property Graph）和非显式图（Graph Constructed from\
    \ Non-relational Data）。\n\n（1）同构图：同构图是指图中的节点类型和关系类型都仅有一种。同构图是实际图数据的一种最简化的情况，如由超链接关系所构成的万维网，这类图数据的信息全部包含在邻接矩阵里。\n\
    \n（2）异构图：与同构图相反，异构图是指图中的节点类型或关系类型多于一种。在现实场景中，我们通常研究的图数据对象是多类型的，对象之间的交互关系也是多样化的。因此，异构图能够更好地贴近现实。\n\
    \n（3）属性图：相较于异构图，属性图给图数据增加了额外的属性信息，如图1-9所示。对于一个属性图而言，节点和关系都有标签（Label）和属性（Property），这里的标签是指节点或关系的类型，如某节点的类型为“用户”，属性是节点或关系的附加描述信息，如“用户”节点可以有“姓名”“注册时间”“注册地址”等属性。属性图是一种最常见的工业级图数据的表示方式，能够广泛适用于多种业务场景下的数据表达。\n\
    \n![](Images/1a9.jpg)\n\n图1-9　属性图\n\n（4）非显式图：非显式图是指数据之间没有显式地定义出关系，需要依据某种规则或计算方式将数据的关系表达出来，进而将数据当成一种图数据进行研究。比如计算机3D视觉中的点云数据，如果我们将节点之间的空间距离转化成关系的话，点云数据就成了图数据。\n\
    \n在我们研究多元化对象系统的时候，图是一种非常重要的视角。在现实世界中，图数据有着十分广泛的应用场景。下面我们举几个例子进行说明，如图1-10所示。\n\n\
    ![](Images/1a10.jpg)\n\n图1-10　图数据应用示例[^(\\[1\\])](../Text/chapter10.xhtml#aa-1)[^(\\\
    [19\\])](../Text/chapter10.xhtml#aa-19)\n\n社交网络：社交网络是十分常见的一类图数据，代表着各种个人或组织之间的社会关系。如图1-10的a图展示了在线社交网络中的用户关注网络：以用户为节点，用户之间的关注关系作为边。这是一个典型的同构图，一般用来研究用户的重要性排名以及相关的用户推荐等问题。随着移动互联网技术的不断深入，更多元化的媒体对象被补充进社交网络中，比如短文本、视频等，如此构成的异构图可以完成更加多样化的任务。\n\
    \n电子购物：电子购物是互联网中的一类核心业务，在这类场景中，业务数据通常可以用一个用户–商品的二部图来描述，在如图1-10的b图所展示的例子中，节点分为两类：用户和商品，存在的关系有浏览、收藏、购买等。用户与商品之间可以存在多重关系，如既存在收藏关系也存在购买关系。这类复杂的数据场景可以用属性图轻松描述。电子购物催生了一项大家熟知的技术应用—推荐系统。用户与商品之间的交互关系，反映了用户的购物偏好。例如，经典的啤酒与尿布的故事：爱买啤酒的人通常也更爱买尿布。\n\
    \n化学分子：以原子为节点，原子之间的化学键作为边，我们可以将分子视为一种图数据进行研究，分子的基本构成以及内在联系决定了分子的各项理化性质，通常我们用其指导新材料、新药物的研究任务，如图1-10的c图所示。\n\
    \n交通网络：交通网络具有多种形式，比如地铁网络中将各个站点作为节点，站点之间的连通性作为边构成一张图，如图1-10的d图所示。通常在交通网络中我们比较关注的是路径规划相关的问题：比如最短路径问题，再如我们将车流量作为网络中节点的属性，去预测未来交通流量的变化情况。"
