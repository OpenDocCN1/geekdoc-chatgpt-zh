    （1）子图的节点数存在呈指数级增长的问题。假设图中节点度的均值为`d`，执行`k`层GCN，则`k`阶子图平均出现`d^k`个节点，如果`d=10`，`k=4`，那么就有11111个节点要参与计算，这会导致很高的计算复杂度。


    （2）真实世界中图数据节点的度往往呈现幂律分布，一些节点的度会非常大，我们称这样的节点为超级节点，在很多图计算的问题中，超级节点都是比较难处理的对象。在这里，由于超级节点本身邻居的数目就很大，再加上子图节点数呈指数级增长的问题，这种类型节点高层特征计算的代价会变得更加高昂。


    对于上述两种情况的出现，遍历子图的时间代价、模型训练的计算代价与存储代价都会变得十分不可控。为此，GraphSAGE使用了非常自然的采样邻居的操作来控制子图发散时的增长率。具体做法如下：设每个节点在第`k`层的邻居采样倍率为`S[k]`（该参数为GraphSAGE算法的超参数，由用户自行设计与调节），即每个节点采样的一阶邻居总数不超过`S[k]`，那么对于任意一个中心节点的表达计算，所涉及的总节点数将在`∏_{i=1}^k
    S[i]`这个级别。对于一个两层的模型来说，如果设`S[1]=3`，`S[2]=2`，则总的节点数不会超过`1+3+3×2=10`个。这里对节点采样，GraphSAGE选择了均匀分布，事实上根据工程效率或者数据的业务背景，我们可以采用其他形式的分布来替代均匀分布[^(\[2\])](../Text/chapter89.xhtml#gg-2)[^(\[3\])](../Text/chapter89.xhtml#gg-3)[^(\[4\])](../Text/chapter89.xhtml#gg-4)。


    GraphSAGE通过采样邻居的策略，使得子图节点的规模始终维持在阶乘级别以下，同时也从工程上给模型层数的增加节省出了相应空间。


    [\[1\]](#chapter74.xhtml#ch1) Hamilton W，Ying Z，Leskovec J. Inductive representation
    learning on large graphs\[C\]//Advances in Neural Information Processing Systems.
    2017：1024-1034.


    ### 7.1.2 聚合邻居


    GraphSAGE研究了聚合邻居操作所需的性质，并且提出了几种新的聚合操作（aggregator），需满足如下条件：


    （1）聚合操作必须要对聚合节点的数量做到自适应。不管节点的邻居数量怎么变化，进行聚合操作后输出的维度必须是一致的，一般是一个统一长度的向量。


    （2）聚合操作对聚合节点具有排列不变性。对于我们熟知的2D图像数据与1D序列数据，前者包含着空间顺序，后者则包含着时序顺序，但图数据本身是一种无序的数据结构，对于聚合操作而言，这就要求不管邻居节点的排列顺序如何，输出的结果总是一样的。比如`Agg(v[1],
    v[2]) = Agg(v[2], v[1])`。


    当然，从模型优化的层面来看，该种聚合操作还必须是可导的。有了上述性质的保证，聚合操作就能对任意输入的节点集合做到自适应。比较简单的符合这些性质的操作算子有：


    （1）平均/加和（`mean/sum`）聚合算子。逐元素的求和与取均值是最直接的一种聚合算子，这类操作是GCN中图卷积操作的线性近似，下面给出了求和的聚合公式，`W`和`b`是聚合操作的学习参数：


    ![](`Images/132-i.jpg`)


    （2）池化（`pooling`）聚合算子。该算子借鉴了CNN里的池化操作来做聚合，常见的如最大池化操作，即逐元素取最大值：


    ![](`Images/132-2-i.jpg`)


    原则上我们可以套用任意一种DNN模型对邻居进行最大池化操作之前的特征变换，在上面的例子中，选用了最简单的单层全连接网络对节点的特征进行加工学习。


    ### 7.1.3 GraphSAGE算法过程


    在了解了上述两个机制之后，我们来看看GraphSAGE实现小批量训练形式的具体过程。


    输入：图`G=(V, E)`；输入特征`{x[v], ∀v∈B}`；层数`K`；权重矩阵`W^(k)`，`∀k∈{1, …, K}`；非线性函数`σ`；聚合操作`Agg^(k)`，`∀k∈{1,
    …, K}`；邻居采样函数`N^(k): v→2^v`，`∀k∈{1, …, K}`。


    输出：所有节点的向量表示`z[v]`，`v∈B`。


    ![](`Images/133-i.jpg`)


    ```

    代码清单7-1所示算法的基本思路是先将小批集合B内的中心节点聚合操作所要涉及的k阶子图一次性全部遍历出来，然后在这些节点上进行K次聚合操作的迭代式计算。算法的第1～7行就是描述遍历操作的。我们可以这样来理解这个过程：要想得到某个中心节点第k层的特征，就需要采样其在第（k–1）层的邻居，然后对第（k–1）层的每个节点采样其第（k–2）层的邻居，依此类推，直到采样完第1层的所有邻居为止。需要注意的是，每层的采样函数可以单独设置，具体可以参考本节采样邻居部分的内容。


    代码清单7-1的第9～15行是第二步—聚合操作，其核心体现在第11～13行的3个公式上面。第11行的式子是调用聚合操作完成对每个节点邻居特征的整合输出，第12行是将聚合后的邻居特征与中心节点上一层的特征进行拼接，然后送到一个单层网络里面得到中心节点新的特征向量，第13行对节点的特征向量进行归一化处理，将所有节点的向量都统一到单位尺度上。对这3行操作迭代K次就完成了对B内所有中心节点特征向量的提取。

    ```


    值得一提的是，GraphSAGE算法的计算过程完全没有拉普拉斯矩阵的参与，每个节点的特征学习过程仅仅只与其`k`阶邻居相关，而不需要考虑全图的结构信息，这样的方法适合做归纳学习（Inductive
    Learning）。归纳学习是指可以对在训练阶段见不到的数据（在图数据中，可以指新的节点，也可以指新的图）直接进行预测而不需要重新训练的学习方法，与之相对的是转导学习（Transductive
    Learning），指所有的数据在训练阶段都可以拿到，学习过程是作用在这个固定的数据上的，一旦数据发生改变，需要重新进行学习训练，典型的比如图上的随机游走算法，一旦图数据发生变动，所有节点的表示学习都需要重新进行。对于GraphSAGE算法而言，对于新出现的节点数据，只需要遍历得到`k`阶子图，就可以代入模型进行相关预测。这种特性使得该算法具有十分巨大的应用价值。


    总结一下，GraphSAGE对空域视角下的GCN作了一次解构，提出了几种邻居的聚合操作算子，同时通过采样邻居，大大提升了算法的工程价值。在引文[\[5\]](../Text/chapter89.xhtml#gg-5)中，通过该方法完成了对工业级大规模推荐系统的应用，且效果十分显著。


    ## 7.2 GAT


    本节要介绍的是图注意力网络（Graph Attention Network，GAT）[^(\[6\])](../Text/chapter89.xhtml#gg-6)，它通过注意力机制（Attention
    Mechanism）来对邻居节点做聚合操作，实现了对不同邻居权重的自适应分配，从而大大提高了图神经网络模型的表达能力。


    ### 7.2.1 注意力机制


    DNN中的注意力机制是受到认知科学中人类对信息处理机制的启发而产生的。由于信息处理能力的局限，人类会选择性地关注完整信息中的某一部分，同时忽略其他信息。例如，我们在看一幅画时，通常会把视觉关注焦点放到语义信息更丰富的前景物体上，而减少对背景信息的关注，这种机制大大提高了人类对信息的处理效率。


    如图7-2所示，我们的视觉会更加关注画面上的猫，这种对视觉信息集中处理的机制在视觉问答场景中被发挥得淋漓尽致。比如，如果要确定上图中的猫在做什么，人类会把视觉信息快速集中在猫的前爪以及面部上，而忽略对其他视觉信息的辨识，从而准确得出图中的猫在睡觉的答案。


    ![](`Images/7a2.jpg`)


    图7-2 注意力机制的处理过程


    可见，注意力机制的核心在于对给定信息进行权重分配，权重高的信息意味着需要系统进行重点加工。下面来进一步阐述神经网络中注意力机制的数学表达形式（见图7-3）：


    ![](`Images/7a3.jpg`)


    图7-3 注意力机制的数学表达形式


    如图7-3所示，`Source`是需要系统处理的信息源，`Query`代表某种条件或者先验信息，`Attention Value`是给定`Query`信息的条件下，通过注意力机制从`Source`中提取得到的信息。一般`Source`里面包含有多种信息，我们将每种信息通过`Key-Value`对的形式表示出来，注意力机制定义如下：


    ![](`Images/136-i.jpg`)


    公式（7.3）中的`Query`、`Key`、`Value`、`Attention Value`在实际计算时均可以是向量形式。`similarity(Query,
    Key[i])`表示`Query`向量和`Key`向量的相关度，最直接的方法是可以取两向量的内积`<Query, Key[i]>`（用内积去表示两个向量的相关度是DNN里面经常用到的方法，对于两个单位向量，如果内积接近1，代表两向量接近重合，相似度就高）。式（7.3）清晰地表明，注意力机制就是对所有的`Value`信息进行加权求和，权重是`Query`与对应`Key`的相关度。


    我们可以继续通过上述视觉问答的例子来说明注意力机制是怎样运用的。


    首先，显然`Query`应该是代表问题句子“小猫在做什么？”的语义向量表达，一般我们用LSTM模型进行提取。`Source`表示整张图像在经过CNN模型后得到的特征图张量`H∈R^(H''×W''×C'')`，`H''`、`W''`、`C''`分别代表特征图的高度、宽度和通道数。通过前面所学的知识我们知道，人类的视觉系统分配给图里不同位置的信息的注意力是不同的。所以很自然地，我们将特征图`H`转化成`H∈R^(L×C'')`，`L=H''×W''`表示空间位置的长度，`h_l`表示特征图上某个空间位置的向量表达。在这个例子中，由于没有明显的`Key`、`Value`之别，所以我们令`Key_l
    = Value_l = h_l`，则在给定`Query`问题的条件下，注意力机制下的输出为：


    ![](`Images/136-4-i.jpg`)


    通过上述例子，我们可以很清晰地看到DNN是如何利用注意力机制在视觉问答的任务中从图里更加有效地抽取出内容信息的。事实上，在DNN中，注意力机制已经被看作一种更具表达力的信息融合手段，其在计算机视觉与自然语言处理中得到了广泛的应用，如在视觉问答、视觉推理、语言模型、机器翻译、机器问答等场景中，注意力机制得到了长足的应用与发展。


