    # 第8章 图分类


    图分类问题是一个重要的图层面的学习任务。与节点层面的任务不同，图分类需要关注图数据的全局信息，既包含图的结构信息，也包含各个节点的属性信息。给定多张图，以及每张图对应的标签，图分类任务需要通过学习得出一个由图到相应标签的图分类模型，模型的重点在于如何通过学习得出一个优秀的全图表示向量。


    图分类任务与视觉图像中的分类任务一样，二者都需要对全局的信息进行融合学习。在`CNN`模型中，通常采用的做法是通过层次化池化（`Hierarchical Pooling`）机制来逐渐提取全局信息。得益于图数据中规则的栅格结构，固定大小与步长的滑窗使得最大化池化或者平均池化等简单操作都能够比较高效地抽取出高阶信息。然而，对于非规则结构的图数据，这类池化操作的直接迁移变得不可行。在图分类任务中实现层次化池化的机制，是`GNN`需要解决的基础问题。


    本章的内容包括3个部分：基于一次性全局池化的图分类、基于层次化池化的图分类，以及基于`SAGPool`的图分类模型实战。


    ## 8.1 基于全局池化的图分类


    在第7章中介绍的`MPNN`，除了为图中节点的表示学习提出了一般框架外，作者也设计了一个读出（`readout`）机制对经过`K`轮迭代的所有节点进行一次性聚合操作，从而输出图的全局表示：


    ![](Images/156-i.jpg)


    读出机制与`CNN`模型中常用的紧跟最后一个卷积层的全局池化（`Global Pooling`）操作如出一辙。二者都是通过对所有输入的一次性聚合得到全局表达，且与池化的常见类型一样，读出机制也可以取`Sum`、`Mean`、`Max`等类型的函数。


    与读出机制十分相似的一种做法是，引文[\[1\]](../Text/chapter97.xhtml#hh-1)通过引入一个与所有节点都相连的虚拟节点，将全图的表示等价于这个虚拟节点的表示。这种思路同时也在`GN`中全局表示`u`的更新过程中得到了体现。


    显而易见，读出机制的处理方式丢失了图数据里面丰富的结构信息。其本质上是将输入数据看作一种平整且规则的结构数据，所有的节点都被同等看待，这与图数据本身是相违背的。从这个角度来看，读出机制更能适应的是对小图数据的学习，一方面是因为小图数据中的结构信息相对单一；另一方面是因为经过`K`轮消息传播机制的迭代之后，图中各个节点的表达会更加接近全局表达，此时读出机制也能比较好地提取全局信息。另外，从实际工程层面来看，读出机制易于实现，非常适合作为图分类的基准模型。


    ## 8.2 基于层次化池化的图分类


    本节以3种不同的思路介绍能够实现图数据层次化池化的方案。


    （1）基于图坍缩（`Graph Coarsening`）的池化机制：图坍缩是将图划分成不同的子图，然后将子图视为超级节点，从而形成一个坍缩的图。这类方法正是借用这种方式实现了对图全局信息的层次化学习。


    （2）基于`TopK`的池化机制：对图中每个节点学习出一个分数，基于这个分数的排序丢弃一些低分数的节点，这类方法借鉴了`CNN`中最大池化操作的思路：将更重要的信息筛选出来。所不同的是，图数据中难以实现局部滑窗操作，因此需要依据分数进行全局筛选。


    （3）基于边收缩（`Edge Contraction`）的池化机制：边收缩是指并行地将图中的边移除，并将被移除边的两个节点合并，同时保持被移除节点的连接关系，该思路是一种通过归并操作来逐步学习图的全局信息的方法。


    ### 8.2.1 基于图坍缩的池化机制


    #### 1. 图坍缩


    假设对于图`G`，通过某种划分策略得到`K`个子图`G^(k)`，`N[k]`表示子图`G^(k)`中的节点数，`Г^(k)`表示子图`G^(k)`中的节点列表。


    ![](Images/8a1.jpg)


