    ## 5.2　图信号与图的拉普拉斯矩阵


    给定图G=（V，E），V表示图中的节点集合，假设其长度为N，图信号是一种描述V→R的映射，表示成向量的形式：x=\[x[1]，x[2]，…，x[N]\]^T，其中x[i]表示的是节点v[i]上的信号强度，如图5-1所示，其中竖线长度表示节点上信号值的大小：


    ![](Images/5a1.jpg)


    图5-1　图信号示例


    与离散时间信号不同，图信号是定义在节点上的信号，而节点之间有自己固有的关联结构。在研究图信号性质的时候，除了要考虑图信号的强度之外，还需要考虑图的拓扑结构，不同图上同一强度的信号，具有截然不同的性质。


    拉普拉斯矩阵（Laplacian Matrix）是研究图的结构性质的一个非常核心的研究对象，拉普拉斯矩阵的定义如下：L=D–A，D是一个对角矩阵，![](Images/083-3-i.jpg)表示的是节点v[i]的度。拉普拉斯矩阵的元素级别定义如下：


    ![](Images/084-2-i.jpg)


    拉普拉斯矩阵还有一种正则化的形式（symmetric normalized laplacian）L[sym]\=D^(–1/2)LD^(–1/2)，元素级别定义如下：


    ![](Images/084-3-i.jpg)


    拉普拉斯矩阵的定义来源于拉普拉斯算子，拉普拉斯算子是n维欧式空间中的一个二阶微分算子：![](Images/084-4-i.jpg)。如果将该算子的作用域退化到离散的二维图像空间，就成了我们非常熟悉的边缘检测算子，其作用原理如下：


    ![](Images/084-5-i.jpg)


    在处理图像的时候，式（5.6）中的算子会被表示成模板的形式：


