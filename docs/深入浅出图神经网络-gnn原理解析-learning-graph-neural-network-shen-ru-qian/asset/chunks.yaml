    # 第3章 卷积神经网络


    卷积神经网络（`Convolutional Neural Network`，`CNN`或`ConvNet`）是一种具有局部连接、权值共享等特点的深层前馈神经网络，在图像和视频分析领域，比如图像分类、目标检测、图像分割等各种视觉任务上取得了显著的效果，是目前应用最广泛的模型之一。


    ## 3.1 卷积与池化


    卷积与池化是卷积神经网络中的两个核心操作，大多数的神经网络结构都是将它们进行组合而得到的。本节将详细阐述卷积的来源和原理，以及池化的基本概念。


    ### 3.1.1 信号处理中的卷积


    卷积一词源于信号处理领域，它是一项广泛应用于信号处理、图像处理以及其他工程科学领域的技术。卷积的一个典型应用是：针对某个线性时不变的系统，给定输入信号`f(τ)`和系统响应`g(τ)`，求系统的输出。


    卷积的数学定义如式（3.1）所示：


    ![](Images/040-i.jpg)


    如果根据图3-1来直观地理解这个计算过程，就是函数`g(τ)`经过翻转和平移`t`后，得到`g(t-τ)`，再求与函数`f(τ)`乘积的积分。


