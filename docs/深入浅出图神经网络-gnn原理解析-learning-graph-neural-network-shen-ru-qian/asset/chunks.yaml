    （2）行向量视角：将`B`视作一个行向量矩阵，将`A`视作系数矩阵，则：


    ![](Images/082-2-i.jpg)


    （3）列向量视角：将`A`视作一个列向量矩阵，将`B`视作系数矩阵，则：


    ![](Images/082-3-i.jpg)


    举例来说，设`C`的计算过程（原文公式见图），运用我们熟知的内积视角，可得结果（原文公式见图）。


    如果用行视角进行计算，我们以`C`的第一行计算过程为例：


    ![](Images/082-6-i.jpg)


    如果用列视角进行计算，我们以`C`的第一列计算过程为例：


