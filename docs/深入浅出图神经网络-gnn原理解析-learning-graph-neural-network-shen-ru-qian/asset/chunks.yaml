    ## 8.2.3 基于边收缩的池化机制\n\n本节我们来介绍基于边收缩的池化机制—`EdgePool`，该方法将边收缩这一图论领域重要的变换操作与端对端的学习机制结合起来，实现了对图数据的层次化池化操作。概括地说，该方法迭代式地对每条边上的节点进行两两归并形成一个新的节点，同时保留合并前两个节点的连接关系到新节点上。这里存在一个问题：每个节点有多条边，但是每个节点只能从属于一条边进行边收缩，那么该如何选择每个节点所从属的边呢？为此，`EdgePool`对每条边设计了一个分数，依据该分数进行非重复式的挑选与合并。具体操作如下：\n\
    \n对每条边，计算原始分数`r`：\n\n![](`Images/168-i.jpg`)\n\n由于每个节点选择哪条边，需要从其局部邻居出发进行考虑，所以，我们对原始分数沿邻居节点进行归一化：\n\
    \n![](`Images/168-2-i.jpg`)\n\n得到上述分数之后，接下来对所有的`s[ij]`进行排序，依次选择该分数最高的且未被选中的两个节点进行收缩操作。细节如图8-5所示：\n\
    \n![](`Images/8a5.jpg`)\n\n图8-5　`EdgePool`过程\n\n在图8-5中，a图计算了图中每条边的原始分数`r`，对于该无向图，我们将方向进行了双向复制，对于有向图则仅需按方向进行后续操作，b图计算了`e^r`，c图沿着入边方向对每个节点进行归一化操作，图中加黑的边表示被选中的进行收缩的边。需要注意的是，在确定`<v[2]，v[1]>`边的时候，尽管`<v[2]，v[3]>`边上具有更高的分数0.8，但是`v[3]`节点已经被选择与`v[4]`节点进行合并，因此选择分数次高的`<v[2]，v[1]>`边进行收缩，d图展示了合并之后的结果。\n\
    \n合并之后的节点特征，可以使用求和的方式表示：\n\n![](`Images/169-i.jpg`)\n\n其中`h[ij]`表示`v[i]`与`v[j]`节点合并后的新节点的特征向量，在计算该值的时候，与前面诸多方法一样，同样使用了分数`s`对节点特征进行了收缩处理。如果边上有特征需要处理的话，`s[ij]`与`h[ij]`的计算可以建立在`RDF`三元组之上，具体形式读者可自行思考。\n\
    \n`EdgePool`与`DIFFPOOL`一样，都是不断对图中所有节点进行融合学习，不同的是`DIFFPOOL`需要自行设置聚类簇数，而`EdgePool`利用边收缩将节点归并比率严格控制在0.5，另外，正是因为利用了边收缩的原理，`EdgePool`仅将相近的邻居节点进行归并，这种做法具有如下优点：节点的融合都是从边进行的，这契合了图的结构信息，更加合理；同时该操作也保留了融合之后图中连接的稀疏性，空间复杂度更低。作为一种端对端的池化机制，`EdgePool`也可以被广泛地整合到各个`GNN`模型中，以完成对图分类任务的学习。\n\
    \n[1] Diehl F.Edge Contraction Pooling for Graph Neural Networks[J].arXiv preprint\
    \ arXiv：1905.10990，2019.\n\n## 8.3 图分类实战\n\n本节我们通过代码来实现基于自注意力的池化机制（`Self-Attention\
    \ Pooling`）。这种方法的思路是通过图卷积从图中自适应地学习到节点的重要性。具体来说，使用第5章中定义的图卷积方式，可以为每个节点赋予一个重要性分数，如式（8.31）所示。\n\
    \n![](`Images/169-2-i.jpg`)\n\n其中`σ`表示激活函数，`A+I`表示增加了自连接的邻接矩阵，`X`表示节点的特征，`Θ[att]∈R^(N×1)`是权重参数，这也是自注意力池化层中唯一引入的参数。关于上述图卷积的实现，参考5.4节具体的代码实现，这里不再赘述。\n\
    \n根据节点重要度分数和拓扑结构可以进行池化操作，如式（8.19）所示，舍弃掉部分不太重要的节点，对邻接矩阵和节点特征进行更新，得到池化结果。首先来看如何根据式（8.19）实现节点的选择。代码片段如代码清单8-1所示：\n\
    \n### 代码清单8-1 根据节点重要度分数进行池化操作\n\n```\nimport os\nimport urllib\nimport torch\n\
