    \    adjacency += sp.eye(adjacency.shape[0])    # 增加自连接\n    degree = np.array(adjacency.sum(1))\n\
    \    d_hat = sp.diags(np.power(degree, -0.5).flatten())\n    L = d_hat.dot(adjacency).dot(d_hat).tocoo()\n\
