    我们对式（5.27）继续进行推导：


    ![](Images/097-i.jpg)


    令![](Images/097-2-i.jpg)，显然![](Images/097-3-i.jpg)是一个图位移算子，其频率响应矩阵为x[1]的频谱，于是可得：


    ![](Images/097-4-i.jpg)


    从式（5.29）可知，两组图信号的图卷积运算总能转化为对应形式的图滤波运算，从这个层面上来看，图卷积等价于图滤波。后文中提到的图卷积运算都是特指式（5.29）右边的滤波形式，至于相对应的卷积信号，一般并不需要显式地表达出来。


    需要特别说明的是，前面所有的图信号处理的相关概念里的图信号都能被拓展到矩阵形式。设矩阵X∈R^(N×d)，我们可以将X视为d组定义在图G上的图信号，于是我们称X为图信号矩阵，d为图信号的总通道数，X[：，j]表示第j个通道上的图信号。例如，对Y=HX，我们可以理解成用图滤波器H对信号矩阵X每个通道的信号分别进行滤波操作，X[：，j]对应的输出为图信号矩阵Y在第j个通道上的图信号Y[：，j]。


    借鉴卷积神经网络在计算机视觉中的成功，将上述定义的图卷积运算推广到图数据的学习中去就成了一种自然而然的想法。接下来，我们将介绍这其中具有代表性的一些工作。


    1.对频率响应矩阵进行参数化


    既然图卷积操作等价于图滤波操作，而图滤波算子的核心在于频率响应矩阵，那么我们自然想到对频率响应矩阵进行参数化[^(\[5\])](../Text/chapter65.xhtml#ee-5)，这样我们就可以定义如下神经网络层：


    ![](Images/098-i.jpg)


    其中σ（·）是激活函数，θ=\[θ[1]，θ[2]，…，θ[N]\]是需要学习的参数，Θ是对应的需要学习的图滤波器，X是输入的图信号矩阵，X''是输出的图信号矩阵。基本上这个思路可以按照图滤波操作的空域视角与频域视角去理解：


    （1）从空域视角来看，该层引入了一个自适应的图位移算子，通过学习的手段指导该算子的学习，从而完成对输入图信号的针对性变换操作。


    （2）从频域角度看，该层在X与X''之间训练了一个可自适应的图滤波器，图滤波器的频率响应函数是怎样的，可以通过任务与数据之间的对应关系来进行监督学习。


    上述思路虽然简单易懂，但是也存在一个较大的问题：引入的学习参数过多，需要学习的参数量与图中的节点数一致，这在大规模图数据，比如上亿节点数规模的图中，极易发生过拟合问题。


    另外，在真实的图数据中，数据的有效信息通常都蕴含在低频段中（参考第6章第3节的相关内容），因此为图滤波器设置N个维度的自由度，且对每个频率都进行学习是没必要的。


    2.对多项式系数进行参数化


    同样，为了拟合任意的频率响应函数，我们也可以将拉普拉斯矩阵的多项式形式转化为一种可学习的形式，该思路在引文[\[6\]](../Text/chapter65.xhtml#ee-6)中被提出，具体如下：


    ![](Images/098-2-i.jpg)


    其中θ=\[θ[1]，θ[2]，…，θ[K]\]是多项式系数向量，也是该网络层真正需要学习的参数，与前述方法不同的是，这个方法的参数量K可以自由控制。K越大，可拟合的频率响应函数的次数就越高，可以对应输入图信号矩阵与输出图信号矩阵之间复杂的滤波关系；K越小，可拟合的频率响应函数的次数就越低，可以对应输入图信号矩阵与输出图信号矩阵之间简单的滤波关系。总的来说，一般设K<<N，这将大大降低模型过拟合的风险。


    3.设计固定的图滤波器


    前述方法虽然大大降低了参数量，但却由于对矩阵特征分解比较依赖而给计算带来了极高的复杂度。为了解决这个问题，在引文[\[7\]](../Text/chapter65.xhtml#ee-7)中，作者对上式进行了限制，设K=1，则：


    ![](Images/099-i.jpg)


    令θ[0]\=θ[1]\=θ，则：


    ![](Images/099-2-i.jpg)


    需要注意的是，这里的θ是一个标量，相当于对![](Images/099-3-i.jpg)的频率响应函数做了一个尺度变换，通常这种尺度变换在神经网络模型中会被归一化操作替代，因此，这个参数是不必要引入的，我们设θ=1，然后就得到了一个固定的图滤波器![](Images/099-3-i.jpg)。


    为了加强网络学习时的数值稳定性，作者仿照正则拉普拉斯矩阵，对![](Images/099-3-i.jpg)也做了归一化处理。令![](Images/099-4-i.jpg)，我们称![](Images/099-5-i.jpg)为重归一化形式的拉普拉斯矩阵。![](Images/099-6-i.jpg)的特征值范围为（–1，1\]，可以有效防止多层网络优化时出现的梯度消失或爆炸的现象（参考第6章第3节的内容）。


    为了加强网络的拟合能力，作者设计了一个参数化的权重矩阵W对输入的图信号矩阵进行仿射变换，于是得到：


    ![](Images/099-7-i.jpg)


    如果没有其他说明，我们特称式（5.34）为图卷积层（GCN layer），以此为主体堆叠多层的神经网络模型称为图卷积模型（GCN）。


    图卷积层是对频率响应函数拟合形式上的极大简化，最后相应的图滤波器退化成了![](Images/100-i.jpg)，图卷积操作变成了![](Images/100-2-i.jpg)。如果将X由信号矩阵的角色切换到特征矩阵上，由于![](Images/100-3-i.jpg)是一个图位移算子，依据矩阵乘法的行向量视角，![](Images/100-4-i.jpg)的计算等价于对邻居节点的特征向量进行聚合操作，于是图卷积层在节点层面的计算公式如下：


    ![](Images/100-5-i.jpg)


    图5-7即为这种聚合邻居节点操作的示意图。实际在工程上，![](Images/100-6-i.jpg)可以用稀疏矩阵来表示，这可以进一步降低图卷积层的计算复杂度。相较于频域图卷积中矩阵分解时O（N³）的时间复杂度，这种空域图卷积计算的时间复杂度可以降至O（|E|d）。


    至于在实际任务中设计固定图滤波器的做法是否有效，我们从以下两点进行说明：


    （1）![](Images/100-7-i.jpg)本身所具有的滤波特性是比较符合真实数据的特有性质的（参考第6章第3节的相关内容），能对数据实现高效的滤波操作；


    （2）虽然GCN层是由对频率响应函数的线性近似推导得出来的，但是和深度学习中深度网络给模型带来的强大拟合能力一样，堆叠多层GCN层，在某种程度上，可以达到高阶多项式形式的频率响应函数的滤波能力。这种简化单层网络的学习能力，通过增加深度来提升模型表达能力的做法，在之前介绍的CNN模型中表现出了极强的工程优越性。事实证明，这种设计所带来的优越性也在GCN后续的多项相关论文中得到了充分展示，以GCN为代表的模型俨然成为各类图数据学习任务的首选。


    总的来说，正是由于有了图信号处理中对图卷积操作的定义与理解，神经网络模型中的图卷积层才能得到非常直观的设计。一般来说，对于只能从频域出发进行矩阵特征分解从而执行图卷积计算的模型，我们称之为频域图卷积模型。相应地，对于图卷积计算不需要进行矩阵特征分解，能在空域视角执行矩阵乘法计算的模型，我们称之为空域图卷积模型。需要特别说明的是，虽然空域图卷积模型具有工程上的优越性，但是这类模型也都可以从频域视角进行理解，从本书后续的相关章节中，我们也可以看到频域视角对于图卷积模型的设计也是十分重要的。


