    卷积完成后，通常会为每个特征图加一个偏置，如式（3.7）所示：


    ![](Images/045-2-i.jpg)


    这就是深度学习中卷积的完整过程。总结一下，对于输入 `H∈R^(H×W×C)`，与卷积核 `R^(k×k×C×C'')` 进行卷积运算，再加上偏置，将会得到输出
    `H∈R^(H''×W''×C'')`，该过程中引入的参数为卷积核与偏置，参数总量为：`k²×C×C''+C''`。


    在单通道卷积中我们讲过，卷积核大小、填充和步长都会影响卷积输出的维度。假设输入维度为 `H×W×C`，卷积核的大小为 `k`，填充值为 `p`，步长为 `s`，输出的特征图为
    `H''×W''×C''`，那么它们之间的关系可以通过式（3.8）给定，`W''` 的计算方式也相同：


    ![](Images/046-i.jpg)


    ## 3.1.3 池化


    池化操作的主要目的是降维，以降低计算量，并在训练初期提供一些平移不变性[^1]。常用的两种池化操作是平均池化和最大值池化。


    池化操作就是使用一个固定大小的滑窗在输入上滑动，每次将滑窗内的元素聚合为一个值作为输出。根据聚合方式的不同，可以分为平均池化和最大值池化，如图3-6所示。


    滑窗的大小 `k`（假设滑窗的长和宽相等）和滑动的步长 `s` 都会影响最终的输出。通常取 `k=2×2`，步长与滑窗大小相等，`s=2`。对于多通道的输入，池化是逐通道进行的，因此不会改变输入的通道数。对于输入
    `X∈R^(H×W×C)`，经过上述池化操作后，输出为 `R^(H/2×W/2×C)`，它的长宽将减半。一般来说，对于任意大小的滑动窗口和步长，可以使用式（3.8）进行计算。


    ![](Images/3a6.jpg)


    **图3-6** 平均池化与最大池化过程示意图


    ## 3.2 卷积神经网络


    卷积神经网络是通过将卷积层与池化层进行堆叠得到的。本节将以一个具体的结构为例讲解卷积神经网络，然后介绍卷积神经网络的特点，以及如何理解卷积神经网络。


    ### 3.2.1 卷积神经网络的结构


    我们以 AlexNet[^2] 为例介绍卷积神经网络的结构。AlexNet 是由深度学习的奠基者 Hinton 和他的学生 Alex Krizhevsky
    设计的，于 2012 年获得了 ImageNet 竞赛的冠军，比第二名的错误率降低了 10% 以上，轰动一时，也由此开启了深度学习的爆发阶段。AlexNet
    可以说是深度卷积神经网络的鼻祖，相比之前的一些卷积神经网络，它最显著的特点是层次更深、参数规模更大。


    AlexNet 由 5 个卷积层、2 个池化层、3 个全连接层组成。受限于当时的硬件条件，单个 GPU 上无法运行这种规模的模型，因此作者将模型进行了拆分并分别放在两个
    GPU 上运行，为了方便介绍，我们将结构进行了融合，如图3-7所示，下面我们来看每一层的具体情况。


    - **输入层**：是 `224×224×3` 大小的图像。

    - **第一层**：卷积层，卷积核大小为 `11×11`，输出为 96 个特征图，输入为 3 个通道，卷积核的维度为 `R^(11×11×3×96)`，同时滑动步长
    `stride=4`，填充 `padding=2`，那么输出的特征图大小可以通过式（3.8）计算得到，如式（3.9）所示，因此输出的特征图为 `H^(1)∈R^(55×55×96)`。卷积之后使用
    ReLU 激活函数。


    ![](Images/047-i.jpg)


    - **第二层**：池化层，使用的是最大值池化，其中池化窗口大小为 `3×3`，步长为 2，使用与卷积类似的方式，可以计算得到输出大小为 `(55–3)/2+1=27`，因此池化层输出为
    `H^(2)∈R^(27×27×96)`。

    - **第三层**：卷积层，卷积核大小为 `5×5`，输出 256 个特征图，因此卷积核的维度为 `R^(5×5×96×256)`，滑动步长 `stride=1`，填充
    `padding=2`，输出的特征图为 `H^(3)∈R^(27×27×96)`。同样，卷积之后使用 ReLU 激活函数。

    - **第四层**：最大值池化，窗口大小为 `3×3`，步长为 2，输出为 `H^(4)∈R^(13×13×256)`。

    - **第五到第七层**：都是卷积层，其中卷积核大小为 `3×3`，输出的特征图分别为 384、384、256，滑动步长 `stride=1`，填充 `padding=1`，因此第七层输出
    `H^(7)∈R^(13×13×256)`。同之前的结构，卷积之后都使用 ReLU 激活函数。

    - **第八层**：池化层，窗口大小为 `3×3`，步长为 2，输出为 `H^(8)∈R^(6×6×256)`。

    - **最后三层**：全连接层，将卷积的输出 `H^(8)∈R^(6×6×256)` 展平，得到全连接层的输入维度为 `R^(9216)`，三层全连接的神经元个数为
    4096、4096、1000。最终得到 1000 维的输出用于图像分类。


    ![](Images/3a7.jpg)


    **图3-7** AlexNet 结构图[^3]


    对于 AlexNet 来说，除了设计了这样的结构之外，还提出了两个重要的改进：第一，用 ReLU 作为激活函数，以解决梯度消失的问题，这在第 2 章中已经介绍过；第二，使用
    Dropout 机制来防止过拟合。Dropout 是通过在训练时随机地将特征图的部分位置置 0，相当于丢弃部分信息，强迫模型基于剩下的特征进行正确的推断，以学习到更加鲁棒和具有判别性的特征。


    卷积神经网络的结构一般可以分为两个部分：一部分是由卷积层和池化层交替堆叠构成的骨干网络，它主要用于从输入中提取丰富的特征；另一部分是全连接层，它将卷积得到的特征图展平，也就是说丢弃了特征图的空间信息，它的主要作用是聚合全局信息并将其映射到输出空间，比如
    AlexNet 就是用于分类。一般的卷积结构也是由这两部分构成的。3.4 节中将介绍更多的改进结构。


    [^3]: 图片是通过 https://github.com/HarisIqbal88/PlotNeuralNet 生成的。


    ### 3.2.2 卷积神经网络的特点


    卷积神经网络具有以下 3 个特点：局部连接、权值共享、层次化表达。


    #### （1）局部连接


    由于图像通常具有局部相关性，因此卷积计算每次只在与卷积核大小对应的区域进行，也就是说输入和输出是局部连接的。如果使用多层感知器来处理图像，一种简单的思路是将多维度的输入图像变换为一个向量并作为多层感知器的输入，对于大小为
    `224×224×3` 的图像，拉平为一个向量作为输入将会需要 150528 个神经元。如果第一个隐藏层神经元数量为 32，那么将会引入 480 万参数，这么大的参数量会带来两个问题：第一，计算复杂度高；第二，有过拟合的风险。如果使用
    `3×3` 的卷积核，输出的通道数为 32，引入的参数量在 1000 以下，远远小于多层感知器需要的参数。


    卷积操作与生物学上的一些概念很类似，在神经系统中，神经元通常只响应一部分的刺激信号，比如视网膜受到光的刺激，向视觉皮层传递信号，通常只有一部分视觉皮层神经元会响应这个信号，这种机制称为局部感知。对于卷积来说也是一样的，连续使用两层
    `3×3` 卷积的，它的输出仅与 `5×5` 大小的输入区域有关，如图3-8所示。这个区域称为感受野，它指的是特征图上一个输出与多大区域的输入有关，在深度卷积神经网络中，有效的感受野通常比这个区域更小。


    ![](Images/3a8.jpg)


    **图3-8** 感受野示意图


    #### （2）权值共享


    卷积的第二个特征是权值共享。在图像中，不同的区域使用相同的卷积核参数，这一方面减少了参数量，另一方面带来了平移不变性。平移不变性指的是不管输入如何平移，总能够得到相同的输出。比如，对于左右两只完全相同的眼睛，使用相同的卷积核，在眼睛对应的区域进行卷积，都能够输出相同的结果，这是由权值共享机制带来的。另外，池化也带来了一些平移不变性，比如最大值池化，因为它是对感受野的信息使用最大值进行聚合，当输入在感受野内变化时，池化层的输出也不会改变。


    #### （3）层次化表达


    卷积网络的第三个特征是可以学到层次化的表达。卷积网络通过卷积层堆叠得到，每一层都是对前一层进行变换，提取的特征从低层次到高层次，逐渐变得抽象。如图3-9所示，低层次的卷积一般是提取一些简单的特征，比如颜色、边缘、角等，它的感受野相对较小，对应的都是局部性特征；中间层次的卷积得到的特征开始变得抽象，比如纹理结构等；高层次的卷积得到的特征更加抽象，与图像的语义、具体包含的目标相关，由于它的感受野更大，因此它是更加全局性的特征。高层次的特征是在低层级特征的基础上得到的，通常来说，低层次的特征更加通用，高层次的特征与具体的任务关联性更强。


    ![](Images/3a9.jpg)


    **图3-9** 层次化表达示意图[^4]


    ## 3.3 特殊的卷积形式


    除了 3.1 节中介绍的标准的卷积方式，还有一些特殊的卷积在各种任务中被提出，本节介绍几种常用的其他卷积形式。


    ### 3.3.1 1×1 卷积


    1×1 卷积，顾名思义，该卷积核的大小为 1。它是在论文[^5]中被提出来的，并被后来的一些模型采用。1×1 卷积的过程如图3-10所示，与前面介绍的卷积操作没有本质区别。


    读者或许会好奇，1×1 卷积有用吗？通常 1×1 卷积有以下功能：一是用于信息聚合，同时增加非线性，1×1 卷积可以看作是对所有通道的信息进行线性加权，即信息聚合，同时，在卷积之后可以使用非线性激活，可以一定程度地增加模型的表达能力；二是用于通道数的变换，可以增加或者减少输出特征图的通道数。


    ![](Images/3a10.jpg)


    **图3-10** 1×1 卷积示意图


    ### 3.3.2 转置卷积


    转置卷积[^6]，它是语义分割任务中必不可少的模块。语义分割指的是对图像在像素级别上进行分类，属于同一类别的像素通常对应着某个目标，如图3-11所示，其中属于人的像素需要分类为同一类别，属于小鹿部分的像素需要分类为同一类别。


    ![](Images/3a11.jpg)


    **图3-11** 语义分割[^7]


    基于 CNN 的语义分割模型通常都由两部分组成，一部分是编码器，用于将原始的输入图像映射到某个低维的特征空间中，它既需要编码目标的特征信息，也要编码位置信息，以正确地预测每个像素位置的类别。另一部分是解码器，它将编码的低维特征映射回像素空间，以对每个像素的具体类别进行判断。其中的解码器部分我们无法使用前面介绍的标准卷积，因为前面的卷积操作不会使得特征图的长宽维度增加，而转置卷积则相反，它可以完成长宽维度的增加，将编码的低维特征逐步映射回像素空间。


    如图3-12中的 a 图所示，假设输入是 `2×2`，卷积核大小为 `3×3`，转置卷积相当于在输入外补充了两圈 0 元素，然后再进行标准卷积，得到了 `4×4`
    的输出。与卷积类似，转置卷积也可以设置填充 `padding` 和步长 `stride`，但与卷积中的意义不太相同。对于步长为 `s`，卷积核大小为 `k`
    的转置卷积，在进行计算时将默认在输入四周填充 `k–1` 圈 0，而设置的 `padding`，将会影响最后填充的大小，具体的填充值由 `k–1–p` 给出。对于步长
    `s`，它是在卷积元素之间插入 `s–1` 个 0，如图3-12中的 b 图所示。输入为 `2×2`，`p=0`，步长 `s=2`，卷积之后得到输出为 `5×5`。


    ![](Images/3a12.jpg)


    **图3-12** 转置卷积示例


    对于转置卷积中输入维度、卷积核大小、填充以及步长与输出维度的关系，可以通过式（3.10）来确定：


    ![](Images/054-i.jpg)


    [^7]: 图片来源 https://ccvl.jhu.edu/datasets/。


    ### 3.3.3 空洞卷积


    空洞卷积[^8] 通过在卷积核元素之间插入空格来“扩张”卷积核，其中有个超参数用于控制扩张的程度，称为空洞率 `r`（dilation rate），指的是在卷积核中间插入
    `r–1` 个 0，因此对于原先大小为 `k` 的卷积核，在使用空洞卷积之后实际的卷积核大小变为 `k+(k–1)(r–1)`。由于卷积核扩大，感受野也会扩大。因此空洞卷积是一种不增加参数量而可以快速扩大感受野的有效方式。


    ![](Images/3a13.jpg)


    **图3-13** 空洞卷积核


    对于 `k=3` 的卷积核，当空洞率 `r` 值分别为 2，3 时，实际的卷积核大小分别为 5 和 7，如图3-13所示。对于大小为 `3×3` 的输出区域，上述三种卷积核对应的感受野大小分别为：


    - 当 `r=1` 时，感受野是 3；

    - 当 `r=2` 时，感受野是 7；

    - 当 `r=3` 时，感受野是 11。


    当堆叠多层空洞卷积组成的层时，感受野会迅速扩大，以获得更多的局部信息。


    ### 3.3.4 分组卷积


    分组卷积最早是在 AlexNet 中出现的，当时训练 AlexNet 时卷积操作不能全部放在同一个 GPU 中进行处理，因此作者把特征图分给了多个 GPU
    来处理，最后再把多个 GPU 的处理结果融合，这实际上就是分组卷积。下面我们通过举例来说明。


    如图3-14所示，将输入沿着深度方向划分为 `g` 组，每一组由 `C₁/g` 个通道构成，同样，对于输出通道也进行类似的拆分，得到 `g` 组，每一组有
    `C₂/g` 个输出通道，将输入的分组与输出的分组对应起来，分别使用卷积进行计算。这样，对每一组卷积来说，需要的卷积核维度为 `R^(k×k×C₁/g×C₂/g)`，即每组中卷积核的深度由原来的
    `C₁` 变成了 `C₁/g`，卷积核的个数也变成了 `C₂/g` 个，而不是原来的 `C₂` 个了。用每组的卷积核同它对应组的输入卷积，得到输出以后，再拼接起来，最终输出的通道仍旧是
    `C₂` 个。也就是说，我们可以并行计算 `g` 个相同的卷积过程。使用的参数量将变为 `k²×C₁×C₂/g`，即参数量相比标准卷积将减少 `g` 倍。


    ![](Images/3a14.jpg)


    **图3-14** 分组卷积的处理过程


    ### 3.3.5 深度可分离卷积


    深度可分离卷积由两部分组成[^9]，一部分是沿着深度的逐层卷积；另一部分是 1×1 卷积。沿着深度的逐层卷积是分组卷积的一种特殊情况，当 `g=C₁=C₂`
    时，它相当于为每一个输入通道设定了一个卷积核分别进行卷积。由于这种卷积只利用了单个输入通道的信息，即只使用了空间位置上的信息，而没有使用通道间的信息，因此，其后通常使用
    1×1 卷积来增加通道间的信息。


    深度可分离卷积相比较于标准卷积，不仅减少了参数量，而且可以降低计算量、提高运算效率，因此这类卷积通常用于对速度有要求的卷积结构设计中，在 MobileNet[^10]、ShuffleNet[^11]
    等模型上都有应用。


    ## 3.4 卷积网络在图像分类中的应用


    短短几年间，深度学习在计算机视觉领域取得了令人瞩目的成绩。各种图像分类模型相继被提出，从 AlexNet 到 VGG，从 GoogleNet v1 到 v4，再到后来的
    ResNet、DenseNet 等，不断地变化，不断地刷新成绩。这一节，我们介绍其中几种典型的图像分类框架。


    ### 3.4.1 VGG


    VGG[^12] 是牛津大学视觉组（Visual Geometry Group）在 2014 年提出来的，并取得了 ImageNet 2014 比赛分类组的第二名和定位任务的第一名。


    VGG 基于 AlexNet 进行了一些改进，主要体现在采用了 `3×3` 的小尺寸卷积核，并且卷积的步长为 1，这样得到的两层卷积感受野为 5，与直接使用一层
    `5×5` 的卷积相比，参数量更少。另外，它去掉了 LRN 层，作者在实验中发现其实 LRN 的作用并不是很大。VGG 还有一个结构特点是重复使用简单的卷积块来堆叠得到模型，它的基础卷积块为两层或多层卷积加上一层池化层。


    VGG 有两个常用的模型 VGG16 和 VGG19，其中 VGG16 的结构如图3-15所示。VGG16 与 VGG19 的差别在于某些基础块中的卷积层数不一样。VGG
    由于其结构简洁、效果较好，直到现在也常常被用作其他任务的骨干网络。


    ![](Images/3a15.jpg)


    **图3-15** VGG16 的网络结构


    ### 3.4.2 Inception 系列


    取得 ImageNet 2014 分类任务的最好成绩的是谷歌提出的 GoogleNet，该网络的核心结构是 Inception 块，与 VGG 构建的基础块不同，Inception
    块使用了多分支及不同尺度的卷积核。Inception 结构也经过了多次优化，得到了几个不同的版本。


    #### 1. Inception V1


    Inception V1[^13] 首次使用了并行的结构。如图3-16所示，每个 Inception 块使用多个大小不同的卷积核，这与传统的堆叠式网络每层只用一个尺寸的卷积核的结构完全不同。Inception
    块的多个不同的卷积核可以提取到不同类型的特征，同时，每个卷积核的感受野也不一样，因此可以获得多尺度的特征，最后再将这些特征拼接起来。


    如果单纯地引入多个尺寸的卷积核会引入大量的参数，耗费大量的计算资源，为了降低计算成本，可以采用的改进方式是在 `3×3` 卷积和 `5×5` 卷积之前引入
    `1×1` 卷积，以降低输入的通道数，另外在池化层之后也使用 `1×1` 卷积进行降维，改进后的 Inception 块如图3-17所示。我们来对比一下改进前与改进后的参数量变化，忽略掉偏置项，输入输出的通道数如图3-17所示，改进前需要的参数量如式（3.11）所示，改进后需要的参数量如式（3.12）所示，可以看出改进前的参数量是改进后的
    2.3 倍，并且改进前池化层的输出通道数与输入通道数相同，与其他卷积结果拼接后，输出的通道数将会急剧增大。


    ![](Images/058-i.jpg)

    ![](Images/3a16.jpg)


    **图3-16** 最初的 Inception 模块


    GoogleNet 用 Inception 块构成堆叠，另外为了缓解梯度消失问题，在网络的中间部分加入了辅助分类器。


    #### 2. Inception V2


    Inception V2[^14] 主要针对 Inception V1 的卷积核设计进行改进，将大尺寸的卷积进行分解，以减少参数量，降低计算复杂度。


    ![](Images/3a17.jpg)


    **图3-17** 改进后的 Inception V1 模块


