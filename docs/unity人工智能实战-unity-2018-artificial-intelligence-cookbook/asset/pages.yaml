  md: "```\nprivate Steering GetPrioritySteering ()\n{\n    Steering steering = new\
    \ Steering();\n    float sqrThreshold = priorityThreshold * priorityThreshold;\n\
    \    foreach (List<Steering> group in groups.Values)\n    {\n        steering\
    \ = new Steering();\n        foreach (Steering singleSteering in group)\n    \
    \    {\n            steering.linear += singleSteering.linear;\n            steering.angular\
    \ += singleSteering.angular;\n        }\n        if (steering.linear.sqrMagnitude\
    \ > sqrThreshold ||\n            Mathf.Abs(steering.angular) > priorityThreshold)\n\
    \        {\n            return steering;\n        }\n    }\n    return steering;\n\
    }\n```\n\n# 运行原理\n\n通过创建优先级组，把优先级相同的行为混合起来，选中 steering 值超过阈值的第一个组，否则选中优先级最低的组中的\
    \ steering 值。\n\n# 延伸阅读\n\n我们可以把这个基于优先级的方法与权重混合搭配在一起进行扩展，这样就可以拥有更健壮的架构，这种方式下，在每个优先级中对\
