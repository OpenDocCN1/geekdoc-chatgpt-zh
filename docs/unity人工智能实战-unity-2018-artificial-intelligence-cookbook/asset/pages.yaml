  md: "# 3. 实现把一组行动转换成字符串键值的静态函数：\n\n```\npublic static string ArrToStrKey(ref T[]\
    \ actions)\n{\n    StringBuilder builder = new StringBuilder();\n    foreach (T\
    \ a in actions)\n    {\n        builder.Append(a.ToString());\n    }\n    return\
    \ builder.ToString();\n}\n```\n\n# 4. 定义用于记录一个序列的集合的函数：\n\n```\npublic void RegisterSequence(T[]\
    \ actions)\n{\n    string key = ArrToStrKey(ref actions);\n    T val = actions[nValue\
    \ - 1];\n    if (!data.ContainsKey(key))\n    {\n        data[key] = new KeyDataRecord<T>();\n\
    \    }\n    KeyDataRecord<T> kdr = data[key];\n    if (kdr.counts.ContainsKey(val))\n\
    \    {\n        kdr.counts[val] = 0;\n    }\n    kdr.counts[val]++;\n    kdr.total++;\n\
    }\n```\n\n# 5. 实现用于计算预测要采取的最佳行动的函数：\n\n```\npublic T GetMostLikely(T[] actions)\n\
    {\n    string key = ArrToStrKey(ref actions);\n    KeyDataRecord<T> kdr = data[key];\n\
    \    int highestVal = 0;\n    T bestAction = default(T);\n    foreach (KeyValuePair<T,int>\
    \ kvp in kdr.counts)\n    {\n        if (kvp.Value > highestVal)\n        {\n\
    \            bestAction = kvp.Key;\n            highestVal = kvp.Value;\n    \
    \    }\n    }\n    return bestAction;\n}\n```\n\n# 运行原理\n\n预测器根据搜索窗口的大小记录了一组行动（记录这些行动是为了做预测）并给它们分配一个结果值。例如，有一个大小是\
    \ 3 的搜索窗口，前 3 个就会作为一个键值保存，以预测接下来的第 4 个行动。\n\n根据之前的行动，预测函数计算出某个行动有多大可能会是接下来的行动。记录的行动越多，则预测会越准确（有一些限制）。"
