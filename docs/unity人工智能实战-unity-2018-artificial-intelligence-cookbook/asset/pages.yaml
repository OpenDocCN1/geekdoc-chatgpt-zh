  md: '引人入胜的交互式游戏中都有智能敌人，其智能行为是由各种技术组合产生的，这些技术统称为人工智能。在创建游戏世界和游戏中的角色时，探索Unity的API或内置功能，可以给游戏带来无限可能。本书涵盖了一些通用和特定的技术，可帮助你在AI开发之路上攀登新的高峰。


    首先，你将快速浏览在游戏环境中使用agent、编程移动以及导航的基本构建模块。接下来，你将通过实例学习如何使用简单的自定义技术改进agent的决策制定和协调机制。然后，你将学习如何模拟agent的视觉和听觉，用于自然和拟人的AI行为，再用图结构改进agent。本书还涵盖了新的导航网格技术，这项技术在Unity
    2018中引入，改良了AI和路径查找工具。你还可以用决策制定技术加强AI，运用于简单的井字棋和跳棋等棋类游戏，以及安排agent之间的协作，使它们像整体一样工作。


