  md: "# # 1.9 避开 agent\n\n在群体仿真（crowd-simulation）游戏中，agent 的行为非常像粒子在基于物理的系统中的表现，看上去不太自然。本节的目标是创建一个\
    \ agent，能够模拟避开人群那样的移动方式。\n\n# ## 准备工作\n\n创建一个 Agent 标签，然后把标签指定到那些我们想要避开的游戏对象上，另外还需要为它们附加\
    \ Agent 脚本组件。如图 1-4 所示。\n\n+   注意：\n+   * 标签：Agent（我们创建的）\n+   * 附加 Agent 组件（我们创建的）\n\
    \n![](img/71cedc28e32e083292208e378461ea21_28_0.png)\n\n图 1-4 在 Inspector 窗口中配置一个假\
    \ agent 的示例\n\n# ## 操作步骤\n\n只需要创建一个新的 agent 行为：\n\n+   1. 创建 AvoidAgent 行为，包括一个避障半径和一组要避开的\
    \ agent：\n\n```\n```csharp\nusing UnityEngine;\nusing System.Collections;\nusing\
    \ System.Collections.Generic;\n\npublic class AvoidAgent : AgentBehaviour\n{\n\
    \    public float collisionRadius = 0.4f;\n    GameObject[] targets;\n}\n```\n\
    ```\n\n+   2. 实现 Start 函数，根据我们之前创建的标签设置 agent 列表的值：\n\n```\n```csharp\nvoid Start\
    \ ()\n{\n    targets = GameObject.FindGameObjectsWithTag(\"Agent\");\n}\n```\n\
    ```\n\n+   3. 定义 GetSteering 函数：\n\n```\n```csharp\npublic override Steering GetSteering()\n\
    {\n    // 函数体\n}\n```\n```\n\n+   4. 添加下面的变量，以计算快要靠近的 agent 的距离和速度：\n\n```\n```csharp\n\
    Steering steering = new Steering();\nfloat shortestTime = Mathf.Infinity;\nGameObject\
    \ firstTarget = null;\n```\n```"
