    # 延伸阅读


    除了创建可插入的配置外，ScriptableObject 类还能节省内存空间。假设我们有一个游戏，该游戏带有几个基础类型（int、float、string）的成员变量，要申请
    5MB 的内存。为了说明这个例子，我们定义一个二维数组存储一个大地图，然后我们需要让场景中的每个敌人都可以访问这个地图。


    如果有 10 个 agent，我们就要申请 50MB 的内存。然而，如果使用 ScriptableObject 文件实例的引用，我们可以先申请 5 MB 内存用于地图，然后再为
    agent 申请一点内存用于持有这些相同对象的引用。


