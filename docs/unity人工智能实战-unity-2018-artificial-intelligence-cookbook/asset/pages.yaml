  md: "```\npublic class AgentBehaviour : MonoBehaviour\n{\n    public int priority\
    \ = 1;\n    // ... 其他还是一样的\n    public virtual void Update ()\n    {\n       \
    \ agent.SetSteering(GetSteering(), priority);\n    }\n}\n```\n\n# 操作步骤\n\n现在我们需要对\
    \ Agent 类做一些修改：\n\n+   1. 从库中添加一个新的命名空间：\n\n```\nusing System.Collections.Generic;\n\
    ```\n\n+   2. 添加一个成员变量，用于表示最小的 steering 值，因为有多个行为：\n\n```\npublic float priorityThreshold\
    \ = 0.2f;\n```\n\n+   3. 添加一个成员变量，用于存储这些行为的结果值：\n\n```\nprivate Dictionary<int,\
    \ List<Steering>> groups;\n```\n\n+   4. 在 Start 函数中初始化变量：\n\n```\ngroups = new\
    \ Dictionary<int, List<Steering>>();\n```\n\n+   5. 修改 LateUpdate 函数，通过调用 GetPrioritySteering\
    \ 设置 steering 变量的值：\n\n```\npublic virtual void LateUpdate ()\n{\n    // 通过优先级获取steering\n\
    \    steering = GetPrioritySteering();\n    groups.Clear();\n    // ... 其余计算保持原样\n\
    \    steering = new Steering();\n}\n```\n\n+   6. 修改 SetSteering 函数的签名和定义，以便在相应的优先级组别中存储\
    \ steering 值：\n\n```\npublic void SetSteering (Steering steering, int priority)\n\
    {\n    if (!groups.ContainsKey(priority))\n    {\n        groups.Add(priority,\
    \ new List<Steering>());\n    }\n    groups[priority].Add(steering);\n}\n```\n\
    \n+   7. 实现 GetPrioritySteering 函数，以便过滤 steering 的分组："
