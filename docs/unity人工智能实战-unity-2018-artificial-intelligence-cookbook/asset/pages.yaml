    # 1.12 通过优先级混合多个行为\n\n有时候权重混合并不够，因为权重很高的行为会削弱权重很低的行为，而低权重的行为也需要存在感。这时候基于优先级的混合就登场了，从高优先级行为到低优先级行为应用级联效果。\n\
    \n# 准备工作\n\n这种基于优先级的混合方式与前一节中的非常相似。我们需要添加一个新的成员变量到 AgentBehaviour 类中，还要重构 Update\
    \ 函数，把 priority 作为参数放进 Agent 类的 SetSteering 函数中。新的 AgentBehaviour 类应该类似下面这样："
