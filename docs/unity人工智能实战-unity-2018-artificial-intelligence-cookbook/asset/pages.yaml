    \ 的自定义数据类型：\n\n```\nusing UnityEngine;\nusing System.Collections;\n\npublic class\
    \ PathSegment\n{\n    public Vector3 a;\n    public Vector3 b;\n\n    public PathSegment\
    \ () : this (Vector3.zero, Vector3.zero) {}\n    public PathSegment (Vector3 a,\
    \ Vector3 b)\n    {\n        this.a = a;\n        this.b = b;\n    }\n}\n```\n\
    \n# 操作步骤\n\n该方法有两大步骤。首先，构建 Path 类，它从特定的空间表达式中提取路径中的点位；然后构建 PathFollower 行为，利用提取的点位得到实际要跟踪的空间点位：\n\
    \n+   1. 创建 Path 类，包含节点和线段，但只有节点是公共的，并且需要手动赋值：\n\n```\nusing UnityEngine;\nusing\
    \ System.Collections;\nusing System.Collections.Generic;\n\npublic class Path\
    \ : MonoBehaviour\n{\n    public List<GameObject> nodes;\n    List<PathSegment>\
    \ segments;\n}\n```"
