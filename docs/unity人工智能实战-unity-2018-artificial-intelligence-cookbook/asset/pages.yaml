    图 6-1 展示了两步视觉系统的工作原理。


    ![](img/71cedc28e32e083292208e378461ea21_140_0.png)


    碰撞器组件在每一帧中检测是否碰撞到场景中的任何游戏对象。我们利用对 Unity 的场景图片和引擎的优化，可以专注于如何处理有效的碰撞。


    检测之后，如果有目标对象在碰撞器的视觉范围内，我们就发射一条射线去检测是否真的可见，或者在 agent 与目标之间是否有一堵墙。


