    在过渡之间可能需要一些特殊的动作，比如动画。假设在架子和地面之间有一个单向的连接，我们要知道什么时候去单击这个连接，然后开始播放动画。


    一种实现方式是在 NavMeshAgent 组件中取消 Auto Traverse Off-Mesh Links 的活动状态，播放动画，执行物理操作，然后按照计划继续逻辑。


    # 4.7 创建动态的带有障碍物的 NavMesh


    很多时候，我们的关卡会有动态的障碍，我们需要让 agent 避开那些障碍。假设是一个 MMOROG 或者 MOBA 游戏，英雄带的小兵也需要避开障碍才能到达目的地。我们可以实现一个复杂的算法，整合避障导航技术，或者可以利用动态
    NavMesh 的强大功能达到相同的目的，而几乎不用改变代码。


    本节中，我们将学习如何让一个 NavMesh 变成动态的，并且能够响应移动的障碍，这样 agent 就可以避开障碍，成功到达目的地。


    # 准备工作


    需要理解 NavMesh 的基本原理，以及如何构建 NavMesh。


    # 操作步骤


    +   1. 准备好关卡。


    +   2. 创建一个游戏对象，命名为 NavMesh。


    +   3. 将 NavMeshSurface 组件添加到 NavMesh 对象上。


    +   4. 单击 Bake。


    +   5. 选择所有障碍。


    +   6. 将 Nav Mesh Obstacle 组件添加到障碍上。


    +   7. 检查组件中的 Carve 选项。'
