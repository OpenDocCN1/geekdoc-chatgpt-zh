  md: '+   8. 选择动态障碍。


    +   9. 取消 Carve Only Stationary 选项。


    +   10. 使用组件中的其他选项配置需要的障碍。


    # ## 运行原理


    构建最初的导航网格后，整个系统会考虑场景中所有的障碍，然后切开障碍周围的区域，以便微调并优化可见的导航区域。另外，导航系统会持续跟踪动态障碍的变化（取消 Carve
    Only Stationary 选项），以便在有需要时重新计算导航区域。


    # ## 延伸阅读


    前面的流程在性能方面绝对不算好，主要用于我们不确定拓扑结构的情况，比如程序化生成关卡。虽然我们在例子中用的是已知的关卡，但是仍然可以依赖预置件和代码来重复前面大部分的步骤，将其应用到程序化生成的关卡中。


    另一方面，如果我们能够确定关卡的布局并且想要改进性能，可以在 Nav Mesh Obstacle 组件中取消 Carve 选项，然后使用避障参数（在 Nav
    Mesh Aget 组件中），直到取得满足需求的结果。


    最后，我们可以用一种混合的方式找到性能与体验之间的平衡点，实时地用“足够好”的参数挑选要避开的关键障碍和其他影响导航网格的障碍。


