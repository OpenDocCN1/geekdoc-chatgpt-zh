    人们观赏文学艺术，有的浮光掠影、走马观花，有的驻足再三、一唱三叹。若熟悉或记得，则更可能产生共鸣甚至身临其境，假如自身有体验、实践，则审美感受与认识会大异其趣，或游刃有余或入木三分，多数人没有时间或兴致实践，则只能多看几遍方有收获。比如读文学名篇，情绪感化、思想激荡的移情作用多在品味、再三阅读之后，散文如先秦庄子《逍遥游》的汪洋恣肆、苏轼《赤壁赋》的怡然潇洒、北宋范仲淹《岳阳楼记》的博大旷远、南宋文天祥《正气歌》的千古英怀、民国梁启超《少年中国说》的酣畅奔放，诗词如东汉曹操《观沧海》和《龟虽寿》壮阔豪迈、唐白居易《忆江南三首》浩荡唯美、北宋范仲淹《渔家傲·秋思》萧瑟苍凉、南宋辛弃疾《永遇乐·京口北固亭怀古》义重情切、民国李叔同《送别》绻缱悠远，不一而足。


    雨里孤村雪里山，看时容易画时难。


    早知不入时人眼，多买朱砂画牡丹。


    ——李唐《题画》


    ## 4.7 装裱纸墨


    有次笔者重新送裱一数十年前裱过的书法作品，店主建议拍照留样。取回后由前后照片对照发现落款一字连接处有明显异样，不同友人看后说了可能的不同原因，莫衷一是，于是笔者将此与同一作者的其他作品作比对，包括印章本身特征如色泽感、均匀性、厚薄度，文字墨色深浅，同年代其他作品纸的细节，以及作品本身的表达、与“高仿品”直观的不同等，均没发现破绽。一件意外而有趣的事情，是增加经验的过程。除非曾拍下大量原裱细节，否则只能到此为止。


    此前一次装裱的工作量不大但要求有点特殊，一位裱工介绍笔者找他的师傅。过去后知是 80 岁的老人，身体不错，说曾修复过董其昌的作品。笔者窃喜找到一位经验丰富者。本想先试一幅，考虑到来来回回颇费时间，三件都放那儿了。可惜拿到的成品没有一件没问题。一件先要揭开原托，所嵌的色条边头明显不齐，老师傅说，哦，眼睛不好、有办法，实际上没弄好；第二件是托后装框，需要拼接，但连接处没有对准，并且有一厘米多的范围很毛糙，这似乎是基本功问题（即便他请学徒做也不该交出这样的活），他说要齐的话也能做到的；第三件也是托后拟装框的，但左右边宽度一看就不等，差了不少。面对这样的情况，估计基本水准大概就是如此，再说是老人家了，不必多言，按他说的价格付款示谢后便离去，老师傅则客气地说下次再去，说“看你人好”，其实笔者一共没说几句话。不是越老越佳，老而经验佳者才真好。


    有次笔者拟将已装裱书法作品上后加字去掉，通常可由“揭裱”等过程实现，问了两位师傅，一位建议自己通过湿化相应部分用手指逐步“卷”掉，并说那与他们搞一样的，另一位认为只有揭裱才成。由于揭裱难免有损作品，于是笔者试着按照前一位的建议办，在名家作品上“动手”，以前想都不敢想。实践以后有两点体会，一是无论如何都会影响原来作品的视觉感受和背后品相（因为是去掉了一部分，而且没法平整化），二是自己动手实是好老师，它让人理解事情本质。


    装裱和书写都要用毛笔，依蔡邕“惟笔软则奇怪生矣”，临创时羊毫笔为首选，墨与砚台的功用多数情况下都由墨汁替代。墨汁本可淡点以便直接书写，实际上多数较浓。后来听说用墨汁要镶水，于是就这么用，其实水占多少比例没个准。再后来知干笔用前先要浸一下水，似有道理，也许蘸水可使每次书写持续久些，从而减少频繁中断。


    纸在创作中的地位十分重要，可见不少所谓的评价标准，虽然文字明了然而难以把握，笔者问过若干书家皆语焉不详，唯有体验才能逐步认识，直接书写是最佳途径，书写以外，只得靠触觉、视觉、听觉等的综合。手摸可辨正反面，此外是厚薄度、粗糙感、柔绵性等，眼观可知是否过白、纹理如何、云絮影多少，晃动纸后所出声音则有是否清脆、刺耳（笔者觉得很难分辨）。细节也算是一种隐性知识了。


    以前根本不会想到宣纸会有假，后来商品秩序逐步失控，假冒伪劣品泛滥，于是出现了新名词“书画纸”以区别于宣纸，这种做法本身说明业界有人想“拨乱反正”，是不得已之举，只是诸多消费者不明底里。现在，不少地方堂而皇之将书画纸混标为“宣纸”，新造的“书画纸”概念大概也可靠边站了。


    书当快意读易尽，客有可人期不来。


    世事相违每如此，好怀百岁几回开。


    ——陈师道《绝句》


    ## 4.8 理论精化


    回想起 20 世纪 70 年代末 80 年代初笔者往时，书法资料稀少，书法理论方面笔者出于兴趣主要是走马观花似地翻阅《书法》《书法研究》杂志，知晓了一些基本知识，后来在旧书店一眼看到这些杂志的封面或封底，哪怕是部分亦会即刻联想起中学时代的记忆。《历代书法论文选》（上、下册）在上海书画出版社出版后笔者即购得，先后翻阅两遍，没有深入理解也缺乏体会，后来还有《续编》，有的篇章读过多回。它们和祝嘉的《书学论集》及各出版社重印的其
    1949 年前出的著作是笔者学习书法理论的主要资料。再后来购河北美术出版社出版的《书学集成》（上、中、下三册），内容与《历代书法论文选》类似，先是看了以前未见的，后来又整个翻阅一回。在有些认识与观念的前提下觉得，尤其若针对创作这一目标，这类资料少看、不看也罢；另一方面，更多内容需要有一定程度的实践和反思后才能较为有效地理解，在逐步体会前人的“显性知识”后自己可或多或少地有些“隐性知识”。


    比如，有的讲字体变化或书法源流，前后相互重复多，可参阅祝嘉的《书学史》，尽管现在看来，该著史料不足，这本受特定时代限制，而其体例是便于了解脉络的；有的讲执笔与运笔，莫衷一是，比如“永字八法”，概括不可谓不精，然而有些内容难免烦琐，后人学书不知有多少是依其“法”而行的；有的介绍历代碑帖，尽其所详，很多现代不见也非一流水准，比如不少丛帖，内容交替，失真又多。不少内容讲得玄虚，表达感想以至锻炼描写未尝不可，其中华丽篇章则不能不提孙过庭《书谱》及姜夔《继书谱》；在包世臣《艺舟双楫》基础上康有为的《广艺舟双楫》，尽管只是“广”书法，与刘熙载《艺概》反其道而行之，然而作者所见广博、思维激昂、眼界超凡、意念卓越，言前人之未述，启后学之既惑，成中国古代书学之殿军。


    由于时代久远，那些文字所承载的学术意义与研究价值不能以如今的标准衡量，而那些作者也无现代人的浮躁与异化，所谓论文的创新意义与历史价值到底会是如何情状由此可见一斑，能流传的有限，于后人长久有启发意义者更是少数。如孙过庭《书谱》云：“或重述旧章，了不殊于既往；或苟兴新说，竟无益于将来。”后人不能苛求前人，然而应当主动承担起对更后人的责任。杨钧在《草堂之灵》的“慎题”中指出，山水画见之皆知其为何，不必题诗。“故画工而诗书未工者，以不污画为得计也。”此之谓乎！


    除了书法执笔、运笔、临摹之外，这些古代文献中尚有不少其他新颖观念，比如康有为在其《广艺舟双楫·原书第一》甚至认为：“综而论之，书学与治法，势变略同。”书法之“法”与他“法”有相通之处，不限于书法本身。梁巘说《金刚经》的空洞等（《承晋斋积闻录·杂论》）。其中辩证思维颇具启发意义，那是一对对对立统一体，既是难明的思维感受，更立重要的提升目标，若能处理好这些关系，书法当能更上层楼。


