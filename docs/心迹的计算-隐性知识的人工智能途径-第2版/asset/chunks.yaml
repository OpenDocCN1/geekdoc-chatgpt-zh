    \n【注释】  \n\n[\\[1\\]](#txt008.html#footnote_quote_txt008_1)有次笔者请教一位教授纠缠态在量子计算机中是怎么回事，他回答说，比如用Word（文字处理软件），不必知道CPU（计算机中央处理单元）是如何工作的，笔者说知道，自己是学计算机的。他一怔，表示这个问题答错了。笔者则觉得问错了，这件小事也从一个侧面反映出智能的复杂与发散。那以前没几天笔者在外地参会，一位与会者说起他们单位（即该教授所在单位）负责人召集会议讨论人工智能，会后笔者说，那位领导不是人工智能领域的也谈人工智能。回答说是组织资源和人搞。那体现的是协同与合作，其实人工智能与非人工智能的界限并不清晰，有益的工作离不开领域专家的参与、指点。\n\
