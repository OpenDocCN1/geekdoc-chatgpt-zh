    20世纪90年代，《哥德尔 艾舍尔 巴赫——集异璧之大成》中译本^([\[2\]](#txt007.html#footnote_content_txt007_2))出版，该书以数学家哥德尔、艺术家埃舍尔和音乐家巴赫为题，对他们的作品所反映出的不同领域人类思维之间的共性进行生动而深刻的比较和归纳。埃舍尔的作品多数形象地表达不可能的结构、悖论等，兼具艺术性与科学性。比如，图6-5所示的《互绘的手》［26］，一只手被另一只手所绘，同时又描绘另一只手，手腕以上部分还在画板里，手腕以下部分就成为“真实”的获得生命的手，它有阴影，甚至还跑到了画板以外。在二维平面上绘出三维形状是绘画的“悖论”，其实是一种视觉错觉，这缘于创作者运用了透视、光影等处理手段，还有观众的自我暗示心里。究竟是左手画右手，还是右手画左手？难以辨清，在这里，形象与真实、可能与不可能交织一体，先后、始终在哪里？画面充满了辩证思维，是怪圈、是悖论，但又是真实的画面！


    ![](images/txt007_6.jpg "pagenumber_ebook=157,pagenumber_book=149")


    图6-5　埃舍尔绘画：《互绘的手》


    不过，通过元模式转换，可跳出悖论怪圈。这两只手不过是画家所画的，不是什么悖论怪圈［27］。有人说，埃舍尔的视觉是与脑子有关的，大概这是一个属于非视觉艺术的范畴［28］。视觉怎会与脑无关？这是科普问题，而没有视觉如何能理解其画作的隐喻？文艺工作者与科学工作者可能在此有区别，不少会想当然。齐白石有次要艾青替他写传，艾青说不是已有胡适、邓广铭、黎锦熙合写的商务印书馆出的《齐白石年谱》？齐白石不作声。后来艾青知道，那书把齐白石的“瞒天过海法”写了进去。1937年他75岁时，算命者说他流年不利，所以他增加了两岁。此事则具迷信味道了。然“画贵在不似与似之间，太似则媚世，不似则欺世”。出自齐白石之口，通俗而大雅。有关书画的辩证思维表达时有所见。


    戴冠卿云：“画不可无骨气，不可有骨气。无骨气便是粉本，纯骨气便是北宗。


    “画不可无颠气，不可有颠气。无颠气便少纵横自如之态，纯是颠气便少轻重浓淡之态。画不可无作家气，不可有作家气。无作家气便嫩，纯作家气便俗。


    “画不可无英雄气，不可有英雄气。无英雄气便似妇女描秀，纯英雄气便是酒店账簿。”［29］


    袁玄石云：“画山水不可太熟，熟则少文。不可太生，生则多戾。”


    八大山人曾落发为僧，又入观为道，悲愤的内心世界和曲折的生活道路使得他的创作迥异于人而格调高逸。“从八大山人的生命历程中，从八大山人的画作中，我们读到了一个经历坎坷、忍辱生存的八大，一个癫狂孤寂的八大，一个笔如金刚杵、神化奇变、不可仿佛的八大，一个精神独绝、不谐与俗的八大，一个天才卓犖、在艺术的天地里为所欲为的八大，一个笔精墨妙、华滋清远的八大，一个平和冲融、返璞归真的八大，一个至真至纯、敏感朴实的八大，一个淡泊平易、生机无限的八大，一个内心寂寥虚豁而物莫之逆的八大，一个寂然凝虑、无我以观物的八大，一个诗意盎然、一派禅机的八大，一个涉笔成趣、简静清淡的八大，一个笃志力行、明理诚意的八大，一个技近乎道、一笔不易的八大，一个铸刀为笔、炉火纯青的八大，一个匠心独运、得意忘形的八大，一个虚和空灵、笔简意周的八大，一个擒纵自如、奇宕潇洒的八大，一个奇崛古奥、精谨练达的八大，一个荒寒简静的八大，一个笔墨相悦、遒丽晶莹的八大，一个静默、单纯、典雅、高华的八大。”［30］那里，丰富的艺术特点和复杂的个人命运交织在一起，有思辨也有常识，全面而综合。八大山人在《为西老年翁书行书扇面》中写道：“士大夫多讥笑东坡用笔不合古法，盖不知古法从何处出耳。”［31］也是绝妙的辩证思维。


    关于书法，程瑶田《书势》云：“是故书成于笔，笔运于指，指运于腕，腕运于肘，肘运于肩。肩也、肘也、腕也、指也，皆运于其右体者也，而右体则运于其左体。左右体者，体之运于上者也，而上体则运于其下体。下体者，两足也。两足着地，拇踵下钩，如屐之有齿以刻于地者，然此之谓下体之实也。下体实矣，而后能运上体之虚。然上体亦有其实焉者，实其左体也。左体凝然据几，与下体贰相属焉。由是以三体之实，而运其右一体之虚，于是右一体者，乃其至虚而至实者也。夫然后以肩运肘，由肘而腕，而指，皆各以其至实而运其至虚。虚者其形也，实者其精也。其精也者，三体之实之所融结于至虚之中者也。乃至指之虚者又实焉，古老传授所谓搦破管也。搦破管矣，指实矣，虚者惟在于笔矣。虽然，笔也，而顾独丽于虚乎？惟其实也，故力透乎纸之背。惟其虚也，故精浮乎纸之上。其妙也，如行地者之绝迹，其神也，如冯虚御风，无行地而已矣。”［32］心手相应、手足协调，于是我们看到了表面上一手、一笔的书法创作背后的生理活动和系统过程，人体各部分的配合与相辅相成是书法艺术的物理支撑，既是唯物的，又是辩证的。


    刘熙载在《艺概·书概》中说：“北书以骨胜，南书以韵胜。然北自有北之韵，南自有南之骨也。”［33］概括会有遗漏或不足，有时候“一言以蔽之”确实精炼了、清晰了，但也会不完整、不全面，抽象出来的内容与思维过程难免有距离。


    潘天寿说：“艺术以真率为本色，不可以为伪，入伪即非艺术。”［34］即使是写实画，也讲究技法、意境，从这个角度出发，绘画创作可不要“真率”。超越这个范畴，艺术创作在激情和创新之余，需要扎实的功底、踏实的作风、诚实的情感、朴实的心态，还是要“老实”。而艺术所描述的，比如自然之美，人性之纯，本质上也是一个“真”字。马克思认为，真是美的基础［35］。科学居“真、善、美”之首。


    朱光潜说：“依心理学的分析，人类心思的运用大约取两种方式：一是推证的，分析的，循逻辑的方式，由事实归纳成原理，或是由原理演绎成个别结论，如剥茧抽丝，如堆砖架屋，层次线索，井井有条；一是直悟的，综合的，对人生世相涵泳已深，不劳推理而一旦豁然有所彻悟，如灵光一现，如伏泉暴涌，虽不必有逻辑的层次线索，而厘然有当于人心，使人不能否认其为真理。这分别相当于印度因明家所说的比量与现量，也相当于科学和艺术。”［36］李泽厚指出：“科学家不仅在自己的科学实验、理论分析中感受到审美愉快与美感享受，还会由于美的形式感而觉察科学规律。直觉、类比是一种审美感受，甚至比逻辑规则与辩证智慧更高。艺术通过形式感的自由开拓可以引导、启发发现宇宙中的秘密，即‘以美启真’”［37］。爱因斯坦在信中表示过：“我设想，适用于笑话的东西，也适用于绘画和戏剧。我认为它们不应该有逻辑系统的味道，而是有生活片段的美味，按照欣赏者的观点闪烁着各种各样的色彩。”［38］“真、善、美”首先是真，真也是“善”与“美”的主要内容。


    高中学生分文、理科班早已是常态，现在的改革方向是取消这种区分，实际上与理科、工科并列的共有十余个大类，远非理科与工科两者可以概括。常听非“理工科”者讲“文科”和“理工科”两词，就像“理工科”者不区分“人文”和“社会科学”那样^([\[3\]](#txt007.html#footnote_content_txt007_3))，其实，理科和工科差别显然。若仅仅按照理科与工科这样的说法区分不同的受教育者，比如理工科生细致、严谨，文科生散漫、自由，甚至学艺术的似乎一定是长发披肩、举止前卫，则太过于粗放、笼统，缺乏针对性，而企图按照那样的思路归纳出一些特点，实际上是难以划分范围的。学理工科的马虎、不负责任的不在少数。有书法教授在读大学期间学工科，后来从诸如字列的中轴线的倾斜、平行角度分析、归纳创作特征和共性，这种“新”的视野被认为源于其工科背景，可能意即以数字、计算说话。从书法创作过程和艺术本质看，并不存在内在的、可计算的由这样的“参数”表现的“规律”，这也是形象思维难以把握和刻画的重要原因之一，这类分析缺乏指导意义。


    科学与艺术的关联，从思维科学的角度看，实际上也就是抽象思维与形象思维的互补与协同，它们是根本的而非表面化的。数学定理的简洁，物理定律的概括，化学组成的精细，天空繁星的神奇，生命结构的和谐，它们的节奏、旋律、周期……美不胜收、不可言状。科学之美，在于其本质的扼要而深邃；科学之难，在于其对象的复杂与变化。艺术之真，在于其情感的诚挚而浓烈；艺术之难，在于其对象的微妙而难言。“科学家完全可以像文学家、画家们那样，把自己的特点、自己的个性带入自己的工作领域。”［39］不少公司利用已有科学与艺术结合的成果开发了应用软件，比如由普林斯顿大学、谷歌和鳄头笔（Adobe）公司合作的“真实画笔”［40］，前述书法创作模拟方法同时也被绘画模拟工作参考，绘画和书法有共同的笔画元素。无疑，生硬联系科学和艺术并不合适，而应努力捕获、挖掘它们的内在联系与表现方式，据此加深对客观世界的认识，以利于各学科的共同进步。无论认识怎样变化、方法多么丰富，解决问题是核心。


    ## 6.6 本章概要


    音乐、绘画等都是典型的形象思维过程，其中蕴含大量隐性知识。拙著各章与科学与文艺的关系如图6-6所示。


    ![](images/txt007_7.jpg "pagenumber_ebook=160,pagenumber_book=152")


    图6-6　各章内容与科学、技术、艺术的关系


    ●科学与艺术是关联、互补和渗透的，有良好文艺素养与认识的科学大家的思想和经历是一种佐证；

    ●逻辑有悖论，艺术创作也可直观呈现出悖论，辩证思维是分析问题的基本依托和有效手段；

    ●科学求真，是探索真理、创造世界；艺术率真，是感情流露、思绪表达，以真情实绪为最终原则，因而本质上并非悖论。


    霁天欲晓未明间，满目奇峰总可观。

    却有一峰忽然长，方知不动是真山。

    ——杨万里《晓行望云山》


