    拙著的核心涉及隐性知识的建模，也就是隐性知识的人工智能途径。计算的原意是根据已知数通过数学方法求未知数的智力活动。随着计算机的普及及其大规模应用，计算逐步变得几乎无处不在，计算的对象和内容也日益丰富，远不限于数字计算本身，尽管计算机内部还是用二进制的数字表示。无论针对“心”的心脏之意及其生理活动，还是内心写照抑或心灵激荡，均为拙著中的“心迹”一词的外延，无非一种是物质的，一种是意识的。


    黄庭坚有《欸乃歌二章戏王穉川》诗：


    从师学道鱼千里，盖世成功黍一炊。


    日日倚门人不见，看尽林乌反哺儿。


    但愿“心”“心”相映，不知得之与否？


