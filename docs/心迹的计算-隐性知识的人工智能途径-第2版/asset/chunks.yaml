    笔者中学时代有次家中来木工做活儿时曾企图用刨刀刨平久用后中间已凹陷的砧板，第一“推”就不利索，那以后要么推不过去，要么刨子直滑向前，真是母亲常说的“看人挑担不嫌累”，师傅拿过刨子三下两下就完事了，端正方向、平衡用力、把控深度，缺一不可，否则就会“寸步难行”，这不是问一下师傅就能掌握的，木工的其他活大都如此。有次在美国徐冬溶教授家住了几天，一个晚上他用割草机平整屋周的草地，范围蛮大，笔者帮着弄，地有点坡度，似乎很费劲，压根没想的那么轻松、“好玩”，当然这类事不难掌握，可是一开始还是“眼高手低”。


    纸上无“战场”——木工那样的一般经验通常不见诸书面（可能雕刻除外）——无法书面表述。学徒学艺，师傅诚然重要，师傅本身手艺的好坏有很大影响，但主要是“领进门”，“修行”以至要“出师”，更大程度上是练习、摸索、反思、比较和总结。功夫少不得，参悟很重要。俗话说“三百六十行，行行出状元”，不仅指各业平等、无贵贱之分；另一层意思是，在任何行业中要做好、做到出类拔萃，都难。民间对绝活有所谓“传子不传婿”之说，这是从“教学”的“教”字出发而言的，就“学”而言，并非说了就管用——能说出者可能言不及义。这也是有绝活者“自重”的原因——要多少功夫和时日才有那样的“境界”啊！


    鲁迅说：“读书人家的子弟熟悉笔墨，木匠的孩子会玩斧凿，兵家儿早识刀枪，没有这样的环境和遗产，是中国的文学青年的先天不足。”［14］美国 NBA 明星奥尼尔在其自传中说道，他的一个教练总带着一块写了上百条注意事项的白板进入休息室……而且他的所有依据都来自这项数据或者那项数据……他们输了，教练下课是迟早的事。当然，教练下课有各种可能原因，但打赢篮球一定不仅依靠“注意事项”或“数据”［15］。


    鲁迅还说：“孩子们经常给我好教训，其一是学话。他们学话的时候，没有教师，没有语法教科书，没有字典，只是不断的听取，记忆，分析，比较，终于懂得每个词的意义，到得两三岁，普通的简单的话大概能够懂，而且能够说了，也不大有错误。”［16］每人都有学说话、学语言的经验。毛文涛博士有一次又问起是否翻译人工智能方面有特色的著作。笔者虽然学习英语数十年了，20
    多年前就与前辈一起翻译过计算机高级语言书籍，但要翻译好绝不是一件容易的事，译质差别极大。同天晚上与郁振华教授^([\[4\]](#txt004.html#footnote_content_txt004_4))交流，他说起刚结束的学期给上海纽约大学学生开了介绍中国哲学发展的英文课程，花了很多时间，是那学期的主要事情。他查阅了大量过去的材料，觉得由中文翻译的内容均较为表面，没有能将深刻、细微的内涵表达出来、传递出去。


    王小平在《我的兄弟王小波》中写道：“我们后来学起英文来，虽然也仗着对英文语法的理解阅读无碍，只能算是支着拐杖入了门，离登堂入室还差得远，论语感和中文绝对没得比。”［17］真是“语言这东西非下苦功不可。”包括训练、体会、比较等。


    中英文俱佳的历史学家黄仁宇说，“三十八年后，我仍然在和英文搏斗。如果你是长期东学一点、西学一点，而不是系统地学习一种语言，你就永远搞不清楚字句的排列组合”。“虽然我在美国居住的时间比在中国长，但有时还是找不到最直接的表达方式，或是最合乎语言惯例的用语，以便将想法呈现在白纸上。”［18］笔者还学过日语、德语，其中德语是自己学的，现在看来是白搭。


    认识论中的默会知识论被认为是波兰尼（M.Polanyi）对哲学最具原创性的贡献［19］。而维特根斯坦（L.Wittgenstein）区分了强的默会知识和弱的默会知识概念，前者指原则上不能充分地用语言加以表达的知识，后者指事实上未用语言表达、但并非原则上不能用语言表达的知识。“换言之，默会知识论所关注的，并非可以表达的东西和绝对不可表达的东西之间的界限，强的默会知识论关注原则上可以充分言说的知识和不能充分言说的知识之间的界限，而弱的默会知识论则是在原则上可以充分言说的领域之内，关注事实上被言说的知识和未被言说的知识之间的界限。”［20，21］或者说，我们并非总是说出了我们的意图［22］。《老子·七十章》有言：“吾言甚易知，甚易言；而天下莫之能知，莫之能行。”这有哲理本身深奥的一面，也有言之不尽的另一面。


    ## 3.4 隐性知识


    智能以感知与经验为起点，以知识和行为为中心，以推理和学习为手段，以进化和发展为特色，以搜索和求解为目标，以改造和创新为能事。人工智能之模拟人的思维过程，强烈依赖于领域知识和常识，它们以语言为基本载体，然而并非皆由语言可达。隐性知识是指在特定领域经过长时间体验和积累，具有针对性及相应效果、难以表达甚至是潜意识的那些经验知识。与默会知识是不同视角的表述，或言拙著特指那些尚未表述然而人（或机器）经过努力可以学得的经验知识，其作用在于识别各种特征或把握总体趋势，明确相互关系和具体方式，关联已有模式并寻找有效方案。大数据中也有大量隐性知识，机器学习是一个途径，它关乎三个方面：数据规模（一定数量）、数据品质（比如就疾病分类而言多数是正常数据就不够）、标注结论（两位以上专家取得一致意见）。


    《墨子·非儒下》有“隐知”之说，本言隐藏其知，也可为隐性知识的一种形式。钱学森举过“言传身教”的例子，其中的“身教”就是难以言说的知识。如孙过庭《书谱》云：“夫心之所达，不易尽于名言；言之所通，尚难形于纸墨。”所及均是。


    经验经过归纳、演绎成为知识，知识包含显性知识与隐性知识，常识是独特的知识。此处的经验有两方面的含义：一是宏观而言，人类知识源自个体经验以及在具备一定的认识和思考基础上的归纳、演绎；二是具体而言，每个人的经验都既包括他（她）学到的显性知识，又包括他（她）积累的隐性知识。图
    3-1 所示是以医疗诊断为例的隐性知识显式化以及整体思维过程。


    ![](img/txt004_2.jpg "pagenumber_ebook=77,pagenumber_book=69")


    图 3-1　从知识到分类器设计：上半部分是重视隐性知识的规则精化过程，是领域专家（医生）和知识工程师的交互，该过程还会对特征识别（下半部分）产生影响，比如哪些特征有待加入、哪些特征并无必要。下半部分是从信号预处理到特征识别和分类的基本环节，特别之处在于：在特征识别阶段，要关注形态特征及整合数值特征和形态特征的整体特征；在分类阶段，需融合针对不同特征的分类器，特征识别过程可使人们对规则精化有更为深刻的洞察（上下部分间的双向箭头）。


    关于实践、经验，每个人都有体会，包括日常生活、问题思考、临时应对等，因时间而异，因空间而变，是综合的、潜在的和迭代的演进。20 世纪 80 年代，很多年轻人热衷于学弹吉他，笔者从未接触过，以为每人都抱那乐器，看一样的乐谱，弹出的曲子也一样，其实那是外行之见，撰写拙稿时忽然想到，那是显性知识描述不会那么“细”、需要隐性知识的例子，没有人能做到熟读琴谱后便可熟练演奏之。


    这些年很热的“注意力机制”背后其实也与隐性知识有关，需要领域专家反思后才能明确恰当的关注点，有的研究还提“二次注意力”。


    钱学森指出思维模拟的瓶颈在于形象思维模拟，潘云鹤院士就此提出综合推理方法，笔者所提“隐性知识”源自就此的学习过程中对形象思维模拟的兴趣。21 世纪初获知心理学中内隐（隐性）记忆概念^([\[5\]](#txt004.html#footnote_content_txt004_5))，接着获悉波兰尼阐述的默会知识观念［23］，其间计算机辅助心电图诊断的错误结果分析以及形态描述困难、脉象的可视化及其与心电图的比照、书法学习中自己的体会与执笔方法反思等是该思想逐步积累的实践支撑。若干基本观念关系如图
    3-2 所示，其中实线表示深化或递进过程，虚线表示对应关系或可能的影响。


    ![](img/txt004_3.jpg "pagenumber_ebook=78,pagenumber_book=70")


    图 3-2　思维模拟：从思想到方法各部分关系


    隐性知识学习是一个有趣而缺乏现成途径的话题，比如脱把骑车是在骑车过程中可学得的一种技术，没法教。犬子小时候，笔者在他面前吹口哨、打响指，他觉得很有趣，然而试不成，除了演示以外笔者无能为力。这些动作隐含难以言表的经验，唯有通过自己的体验才可能掌握。笔者给过他关于游泳、篮球方面的书籍，他从小喜欢篮球，游泳则是在游泳馆与笔者一起游时学会，并非由书习得。这接近于增强学习，强调和环境的交互、摸索，如果我们试图看书后下水就会游泳，上说无误，但若将任何实践理解为理论学习以后的行动，则上述表达并不恰当，因为阅读、了解基础知识是实践的前提，学习基础知识是掌握技能的第一步。不管事先是否看过游泳书籍，若养成的是错误姿势，以后会更难学，速度也跟不上^([\[6\]](#txt004.html#footnote_content_txt004_6))。


    王蒙先生说：“书是教人学问、教人聪敏、教人高尚的，为什么书会使某些人愚蠢呢？因为书与实践、与现实、与生活之间并非没有距离。人一辈子许多知识是从书本上学的，还有许多知识和本领是无法或基本无法从书本上学到手的，例如：游泳，打球，太极拳，诊病把脉，开刀动手术，锄地……”［24］


    锄头用来锄地，效果在地上体现，如果仅仅是制作锄头，比如用造坦克的钢、用花梨木，虽然是自由探索，很“漂亮”“过硬”甚至被不断神化，然而并不见得益于顺手地锄地，那样的锄头可挂在墙上当艺术品欣赏。更有甚者是没琢磨过锄头就说其地如何因锄头而高产。有次评议人工智能指南，有考核指标“实现量子力学精度”，不仅意图欠明，即便达到很高精度，拟解决的问题是什么？学科交叉当下已是一个普遍话题，还是需要“深度优先”，即共同解决某个或某类问题（这是大多数科技工作者的主要任务），所谓“伤其十指不如断其一指”，有的伤也算不上，无非只是动了皮毛。比如攻克了具体困难，提高了教育质量，在需要时达到了另一学科专业人员的相当水准甚至成了另一领域的行家，才是社会、科研的福音。


    创造是否必须掌握某种“隐性知识”难以一概而论，通常认为那是反复思索、综合经验、推陈出新的结果，但也有“一张白纸画最美图画”，小朋友突发奇想便是如此，而隐性知识如何显性化是拙著的根本主题，笔者与同行有如下交流。


    诸葛^([\[7\]](#txt004.html#footnote_content_txt004_7))：是否所有隐性知识都可以转为显性知识？


    笔者：转化是初衷，但能否都转依赖于领域专家的理解及其努力。


    诸葛：能否说清楚，能否通过学习学到是两个问题。游泳是技能，也可以写出来，但因素太多可能写不全（全程立体录像就可以了）。


    笔者：我学游泳不是看书学来的，后来我买过书，回过头来又翻过书，还是认为光看书是学不会的。录像能否解决问题不清楚，但一定有细节有待自己体会然后才可能掌握。对于中医把脉模拟，我这样的外行做这事只能希望中医尽量说清楚，或者启发他说清楚，然后才能建模（让机器学到），也就是两个问题是相续的。


    诸葛：初步感觉是凡知识都应该可说清楚，但反过来，学以致用就与个人实践过程有关了；主要是写出来的东西如何判别的问题，如果没法判别，这类属于技能，不是知识。


    笔者：第一，我自己会，但说不出来（给我时间也做不到）；第二，如果说是技能，中医把脉是否也只能算技能，因目前没法判别（我就遇到过两个教授先后给我把脉，结果南辕北辙）。


    诸葛：（吹口哨）可以写出来的，比如口、舌、气如何控制，但学是另一个过程。


    各人有不同的认识和能力。虽然那与我的考虑不一，不过是一个良好的例子，即理论上看会认为事情都可做。事实上，那不意味着具体可行，所谓具体可行即指将诸如吹口哨的要领清晰地陈述出来，而且能让读者看后明白如何达到目标^([\[8\]](#txt004.html#footnote_content_txt004_8))。


    这不意味着有理由忽视努力言表知识，相反，言表对于知识的传授十分重要。比如胡适后来说过老师讲解的重要性［25］：“我才明白我是一个受特别待遇的人，因为别人每年出两块钱，我去年却送十块钱。我一生最得力的是讲书：父亲母亲为我讲方字，两位先生为我讲书。念古文而不讲解，等于念‘揭谛揭谛，波罗揭谛’全无用处。”


    也有的事文字表达言简意赅但体会不明，比如“上瘾”，尽管笔者喜欢吃辣，曾经一顿吃 10 个细红尖椒，也没法理解吸毒上瘾的感受与后果，因自己长时间不吃辣也过得去，不是非吃不可。


    隐性知识学习首先指向领域专家学习，以及比照互参，或谓机器帮助下的学习。有时解决问题的办法就是去提出恰当的问题，假如说隐性知识概念属此，则如何习得隐性知识是直接的问题，表
    3-1 是一些笔者有所体会的例子。


    表 3-1　隐性知识学习方法示例


    ![](img/txt004_4.jpg "pagenumber_ebook=81,pagenumber_book=73")


    ●结果反馈：


    就后述体征分类算法言，在学习基础知识的基础上，针对通常的书本知识可设计初步方法，获得结果后，通过与专家交流、探讨，并将分错的情况反馈给医生，启发医生重新审视并修改、优化原有诊断规则和参数。


    ●内涵置换，可分为两种：


    ✧效果引导：如书法执笔方法，那只是手段，目的是获得高质量的书写线条，很多学习者能明白但达不到目的或找不到线条为何欠佳的原因，如果提示要设法将力传到笔端，学习者的感受与理解就会直接些。


    ✧名称改变：如日常中所说“僵尸”，多数人能知其意，由于具迷信色彩，有学者以“无魂人”替代。实际上是视角不同，给人以不同想象空间，前者着眼于物质是否具有生命，后者则意味着灵魂的有无，即“没有意识，其他音容举止一如我们的生物”。［26］


    ●比对互参：


    ✧同步感知：例如脉象分类，由于缺乏如心电图那样明确、具体的诊断规则，首先通过同步医生指下感知和脉象，让医生将所见信息与感知到的信息对应起来，概括脉象的特征及其含义，然后才会有如心电图那样的以症状特征为基础的推理规则，进而建模。


    ✧多模迭代，如第 4 章将介绍的“升学”分类器。


    脑电图观测和相关数据挖掘有可能更精准地提取一致的诊断结论，而不限于医生的主观经验，即通过不同医生在诊断过程中的脑电数据分析，构建刻画症状的特征参数、诊断规则并形成客观标注依据。


    有观点认为，有了数据和深层神经网络，隐性知识问题可迎刃而解，其实不然。首先，隐性知识不自然而然地呈现在数据上，标注过的数据“携带”了经验，但还有相当部分隐性知识未能显现；其次，即便机器学习，也不保证能全学到关键知识，神经人工网络会随着认识的深化和应用的拓展不断健全与有效，但逻辑机制依然不可或缺，因为那本来就是思维的一种形式，是智能的特征之一，逻辑关系或显式或隐含在学习模型中，推理与学习崭新的融合形式正是我们所期待的。推理含推理方式与推理内容两方面，前者如不确定性推理、模糊推理等，后者包括规则优化和知识精化，都与隐性知识学习有关。学习在当下主要与人工神经网络相关，除了基础性的认知神经科学基础上的建模外，涉及网络结构优化与训练方式探索。比如“卷积”操作就是一种了不起的对于人工神经网络结构的创新，而针对某个具体问题可以有多样的形式和参数配置，由于无规律，需要大量试验，使得实际上的结果往往并不能够体现最佳情形。至于训练，梯度下降是核心思想，比如有研究表明，频繁的权重矩阵改变过程中，只有一小部分奇异向量空间实际有变化，如若确然，据此的优化训练对于提高效率，减少资源耗费将非常有帮助。


    《荀子·儒效》所言“故闻之而不见，虽博必谬；见之而不知，虽识必妄；知之而不行，虽敦必困”可用以反观隐性知识的学习。


    ## 3.5 直觉模式


    人的认识的形成，因人而异，从内因、外因的区分看，前者涉及先天气质与后天实践；后者关乎学习输入与环境影响，比如父母的言传身教、书籍的潜移默化，书籍中或有榜样，或可印证既有想法，或是自己与他人的理念互动。客观知识以外，人的反省可以加强对知识的体会，诸如主动的纠正与深化，遇到特定情况的比较选择等，那是个逐步精化的过程，而其本身又是被认识的对象。人们的总结，历史地看往往不够，然而是迭代的基础。再比如小朋友智力发展有快慢、早晚之别，但都有限，不能指望他（她）能回答更复杂的问题。积极教育的一方面要使之健康成长而非拔苗助长，另一方面是引导、辅助、训练，此外还要接触社会、了解生活。


    西蒙等对人类在诸如下棋、解物理问题和医疗诊断等领域的专门知识的研究表明［27］：在获得高级技能的过程中，一流的专家在其专门领域内至少学会 5 万个模式；他们能一眼就看出这些模式并从长时记忆中抽取与这些模式相关的信息。在任何一个领域中，专家知识的数量是
    5 万～20 万个组块（例如，专家在看对阵棋盘上的棋子时，并不将它们看成是各自孤立的，而是根据棋子之间的关系看成若干个组块）。对某些人而言，在极为重要的一些领域，获得这些知识所需要的时间不少于
    10 年。例如，一个高级的诊断医师面对病人叙述或表现出来的症状，能迅速地辨别出熟悉的模式，并回忆起一个或多个导致此症状的疾病的假设，进而指出为了确诊应该做什么样的附加检查，以及确诊后应进行怎样的治疗，所有这些都是在几秒钟之内完成的。专家可以察觉到新手见不到的东西。华罗庚曾对其学生说过，学生看到的是数字，他自己看到的是矩阵，也就是说，别人可能很快能进行数字运算，而华罗庚能像做简单的算术计算一样做矩阵计算，他把握的元素比一般人复杂，而同样是对元素进行计算，即使速度相仿，结果差别也会很大。钱学森在学生问他为何在黑板上算积分题如此快时说，就是多练习，说不出道理，那就是经验因素［28］。这如同诺贝尔奖得主纳什（J.Nash）“可以在自己的头脑中将一个数学问题看作一幅图画”。数学家无论做什么，必须有一个严谨的证明加以支持，然而这不是答案出现在他面前的方式。反过来，一堆直觉的细碎线索，有待他缝合一处［29］。


    记得中学时从报上得知，苏步青曾说过，要掌握基本的数学原理和方法，至少要做 2 万道题目。笔者在做学生时，一般练习和复习都比较快，有时候不太明白其他同学为何不一样。实际上，笔者忽视了足够量的练习对于掌握原理、理解知识、获得应用的作用，总以为知晓了基本的定义、定理、定律，就能“以不变应万变”。其实错了，所谓“举一反三”“触类旁通”是指具备丰富信息、掌握大量经验前提下的反应，书本上的结论和方法是抽象的陈述，没法涵盖各种实际问题的具体情况和意外可能，理解定理的内容和反复练习两者是相辅相成、互为前提的，它们之间的距离要靠平时的锻炼和日常的积累来弥合。不过对数学例外，比如学《高等数学》时，笔者买了数学系用的《数学分析》看，借《吉维多米奇习题集》做，这主要是兴趣使然。学习就是获得知识和积累经验的过程^([\[9\]](#txt004.html#footnote_content_txt004_9))。数学学习的基本目的通常有二：锻炼思维，解决问题，两者不能割裂，没有一定量的解题经验，很难锻炼思维；没有良好的思维方式，则不利于寻找解决问题的途径。


