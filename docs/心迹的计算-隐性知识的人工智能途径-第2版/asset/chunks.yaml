- raw: "人们观赏文学艺术，有的浮光掠影、走马观花，有的驻足再三、一唱三叹。若熟悉或记得，则更可能产生共鸣甚至身临其境，假如自身有体验、实践，则审美感受与认识会大异其趣，或游刃有余或入木三分，多数人没有时间或兴致实践，则只能多看几遍方有收获。比如读文学名篇，情绪感化、思想激荡的移情作用多在品味、再三阅读之后，散文如先秦庄子《逍遥游》的汪洋恣肆、苏轼《赤壁赋》的怡然潇洒、北宋范仲淹《岳阳楼记》的博大旷远、南宋文天祥《正气歌》的千古英怀、民国梁启超《少年中国说》的酣畅奔放，诗词如东汉曹操《观沧海》和《龟虽寿》壮阔豪迈、唐白居易《忆江南三首》浩荡唯美、北宋范仲淹《渔家傲·秋思》萧瑟苍凉、南宋辛弃疾《永遇乐·京口北固亭怀古》义重情切、民国李叔同《送别》绻缱悠远，不一而足。\n\
    \n雨里孤村雪里山，看时容易画时难。\n\n早知不入时人眼，多买朱砂画牡丹。\n\n——李唐《题画》\n\n4.7　装裱纸墨\n\n有次笔者重新送裱一数十年前裱过的书法作品，店主建议拍照留样。取回后由前后照片对照发现落款一字连接处有明显异样，不同友人看后说了可能的不同原因，莫衷一是，于是笔者将此与同一作者的其他作品作比对，包括印章本身特征如色泽感、均匀性、厚薄度，文字墨色深浅，同年代其他作品纸的细节，以及作品本身的表达、与“高仿品”直观的不同等，均没发现破绽。一件意外而有趣的事情，是增加经验的过程。除非曾拍下大量原裱细节，否则只能到此为止。\n\
    \n此前一次装裱的工作量不大但要求有点特殊，一位裱工介绍笔者找他的师傅。过去后知是80岁的老人，身体不错，说曾修复过董其昌的作品。笔者窃喜找到一位经验丰富者。本想先试一幅，考虑到来来回回颇费时间，三件都放那儿了。可惜拿到的成品没有一件没问题。一件先要揭开原托，所嵌的色条边头明显不齐，老师傅说，哦，眼睛不好、有办法，实际上没弄好；第二件是托后装框，需要拼接，但连接处没有对准，并且有一厘米多的范围很毛糙，这似乎是基本功问题（即便他请学徒做也不该交出这样的活），他说要齐的话也能做到的；第三件也是托后拟装框的，但左右边宽度一看就不等，差了不少。面对这样的情况，估计基本水准大概就是如此，再说是老人家了，不必多言，按他说的价格付款示谢后便离去，老师傅则客气地说下次再去，说“看你人好”，其实笔者一共没说几句话。不是越老越佳，老而经验佳者才真好。\n\
    \n有次笔者拟将已装裱书法作品上后加字去掉，通常可由“揭裱”等过程实现，问了两位师傅，一位建议自己通过湿化相应部分用手指逐步“卷”掉，并说那与他们搞一样的，另一位认为只有揭裱才成。由于揭裱难免有损作品，于是笔者试着按照前一位的建议办，在名家作品上“动手”，以前想都不敢想。实践以后有两点体会，一是无论如何都会影响原来作品的视觉感受和背后品相（因为是去掉了一部分，而且没法平整化），二是自己动手实是好老师，它让人理解事情本质。\n\
    \n装裱和书写都要用毛笔，依蔡邕“惟笔软则奇怪生矣”，临创时羊毫笔为首选，墨与砚台的功用多数情况下都由墨汁替代。墨汁本可淡点以便直接书写，实际上多数较浓。后来听说用墨汁要镶水，于是就这么用，其实水占多少比例没个准。再后来知干笔用前先要浸一下水，似有道理，也许蘸水可使每次书写持续久些，从而减少频繁中断。\n\
    \n纸在创作中的地位十分重要，可见不少所谓的评价标准，虽然文字明了然而难以把握，笔者问过若干书家皆语焉不详，唯有体验才能逐步认识，直接书写是最佳途径，书写以外，只得靠触觉、视觉、听觉等的综合。手摸可辨正反面，此外是厚薄度、粗糙感、柔绵性等，眼观可知是否过白、纹理如何、云絮影多少，晃动纸后所出声音则有是否清脆、刺耳（笔者觉得很难分辨）。细节也算是一种隐性知识了。\n\
    \n以前根本不会想到宣纸会有假，后来商品秩序逐步失控，假冒伪劣品泛滥，于是出现了新名词“书画纸”以区别于宣纸，这种做法本身说明业界有人想“拨乱反正”，是不得已之举，只是诸多消费者不明底里。现在，不少地方堂而皇之将书画纸混标为“宣纸”，新造的“书画纸”概念大概也可靠边站了。\n\
    \n书当快意读易尽，客有可人期不来。\n\n世事相违每如此，好怀百岁几回开。\n\n——陈师道《绝句》\n\n4.8　理论精化\n\n回想起20世纪70年代末80年代初笔者往时，书法资料稀少，书法理论方面笔者出于兴趣主要是走马观花似地翻阅《书法》《书法研究》杂志，知晓了一些基本知识，后来在旧书店一眼看到这些杂志的封面或封底，哪怕是部分亦会即刻联想起中学时代的记忆。《历代书法论文选》（上、下册）在上海书画出版社出版后笔者即购得，先后翻阅两遍，没有深入理解也缺乏体会，后来还有《续编》，有的篇章读过多回。它们和祝嘉的《书学论集》及各出版社重印的其1949年前出的著作是笔者学习书法理论的主要资料。再后来购河北美术出版社出版的《书学集成》（上、中、下三册），内容与《历代书法论文选》类似，先是看了以前未见的，后来又整个翻阅一回。在有些认识与观念的前提下觉得，尤其若针对创作这一目标，这类资料少看、不看也罢；另一方面，更多内容需要有一定程度的实践和反思后才能较为有效地理解，在逐步体会前人的“显性知识”后自己可或多或少地有些“隐性知识”。\n\
    \n比如，有的讲字体变化或书法源流，前后相互重复多，可参阅祝嘉的《书学史》，尽管现在看来，该著史料不足，这本受特定时代限制，而其体例是便于了解脉络的；有的讲执笔与运笔，莫衷一是，比如“永字八法”，概括不可谓不精，然而有些内容难免烦琐，后人学书不知有多少是依其“法”而行的；有的介绍历代碑帖，尽其所详，很多现代不见也非一流水准，比如不少丛帖，内容交替，失真又多。不少内容讲得玄虚，表达感想以至锻炼描写未尝不可，其中华丽篇章则不能不提孙过庭《书谱》及姜夔《继书谱》；在包世臣《艺舟双楫》基础上康有为的《广艺舟双楫》，尽管只是“广”书法，与刘熙载《艺概》反其道而行之，然而作者所见广博、思维激昂、眼界超凡、意念卓越，言前人之未述，启后学之既惑，成中国古代书学之殿军。\n\
    \n由于时代久远，那些文字所承载的学术意义与研究价值不能以如今的标准衡量，而那些作者也无现代人的浮躁与异化，所谓论文的创新意义与历史价值到底会是如何情状由此可见一斑，能流传的有限，于后人长久有启发意义者更是少数。如孙过庭《书谱》云：“或重述旧章，了不殊于既往；或苟兴新说，竟无益于将来。”后人不能苛求前人，然而应当主动承担起对更后人的责任。杨钧在《草堂之灵》的“慎题”中指出，山水画见之皆知其为何，不必题诗。“故画工而诗书未工者，以不污画为得计也。”此之谓乎！\n\
    \n除了书法执笔、运笔、临摹之外，这些古代文献中尚有不少其他新颖观念，比如康有为在其《广艺舟双楫·原书第一》甚至认为：“综而论之，书学与治法，势变略同。”书法之“法”与他“法”有相通之处，不限于书法本身。梁巘说《金刚经》的空洞等（《承晋斋积闻录·杂论》）。其中辩证思维颇具启发意义，那是一对对对立统一体，既是难明的思维感受，更立重要的提升目标，若能处理好这些关系，书法当能更上层楼。\n\
    \n《祝嘉书论选集》内容框架^([\\[8\\]](#att001.html#footnote_content_att001_8))。\n\n第一 临书丛谈\n\
    \n说明：在“小引”相关说明文字后加注：在第4篇“临书丛谈”所谈章草部分插入后来写的“谈章草”以完善相关论述；第5篇“悬臂轮”用“全身力到论”取代，原因见“小引”。\n\
    \n●楷法初步\n\n●谈行书\n\n●论字的结构\n\n●临书丛谈\n\n●全身力到论，还要谈全身力到\n\n第二 历代书学\n\n说明：在出版《书学史》后，作者曾考虑断代分述，并有《汉代书学及汉碑》《六朝的书学》。汉代已出现书法各体，并具承先启后之机，此处选：\n\
    \n●《汉代书学及汉碑》中的“汉代书法”（同时可以作为《临书丛谈》中相关内容的补充）；\n\n●《六朝的书学》中的“结论”。\n\n第三 古论疏证\n\n\
    说明：为了便于年轻人阅读和理解，作者对古代书论逐篇疏证，并留下大量按语，有的是注释，有的说明具体史实，有的则是批评意见，是其书学理论的补充或观点强调，精要之论时现。\n\
    \n●朱和羹《临池心解》按语尤其丰富，依原篇全录；\n\n●其余部分以与本选集其他诸篇内容互补为摘录原则^([\\[9\\]](#att001.html#footnote_content_att001_9))。\n\
    \n第四 宁拙毋巧\n\n说明：作者被誉为20世纪最重要的碑学大家，然而他于碑、帖并无偏颇，论碑良多，眼界则超越碑本身，尊碑而不薄任何其他有价值内容，比如临习《兰亭序》千遍，特别欣赏其章法及其气韵贯通、一气呵成。一个切实下硬功夫者形象在世人面前栩栩如生，书如其人而人书俱老。随着了解的深入，读者当能感受到一个生动丰满、高瞻远瞩的奋斗者和教育家形象。\n\
    \n●怎样学《兰亭序》\n\n●论书法中的“疾涩”\n\n●谈四宁四勿\n\n●碑学与帖学\n\n●论书十二绝句\n\n第五 书里字外\n\n说明：在作者的文字中，时现发自内心的唯物史观和辩证思维，思想与言论、理论与实践、知识与行动在那里和谐地统一于其身，尤为难能可贵。\n\
    \n●书法是劳动人民创造的\n\n●学书自述\n\n●我在书法上的实践\n\n●学书的次序\n\n●谈书外功夫\n\n●书法上的推陈出新问题\n\n后记\n\
    \n祝嘉先生著述多半束之高阁，直到老人逝去20多年后，《祝嘉书学论著全集》在国家出版基金资助下问世，那是一位理论权威、实践勇士不断修正和完善的思想轨迹与生命历程。在惶惶八卷面前，想来很多读者一下子不便领会主旨、抓住要领。祝嘉先生则言，前著有的结论后来看来并不正确，有的是文言文或文、白相间，有的则有了更深入的看法，因此有不少主题重叠的后著。本编选择原则如下：\n\
    \n第一，概要呈现祝嘉先生独特书学理论；\n\n第二，若有多次谈及的话题取后来或完整的内容；\n\n第三，与书法学习的基本方法并非直接相关者不在此列。\n\n\
    祝嘉先生在其《〈书概〉疏证·小引》中谦逊而坚定地说：“我是一个碌碌无所长的人，而只有好书法的癖，也可以说是我短中的寸长，即无所长，以贡献于祖国、于人民，想竭其绵薄，也只有书法这一点点了。”那是何等的谦虚、又是如此的自信！祝嘉先生眼界开阔、思维开放，指出后来总比以前有发展、更丰富，同时观念辩证、胸怀远大：“所以临书，取和自己的书体，离得远的更好。凡事要它进步快，就要大大改革，没有大改革，就没有大进步，苟且因循，虽然努力也做不出什么来。”（《书法三要》）\n\
    \n结合自己的肤浅认识、学习古代书论并读《祝嘉书学论著全集》，笔者梳理出此提纲，要旨是取精用宏、有效方法、全面训练、字外功夫和眼界熏陶。其中方法是首要的，为何同样方法在不同学习者那里会导致不同表现？除了方法本身的掌握需要一定的认识和实践过程外，自我的定力、外部的影响施以颇大影响。就如当今社会，选择多元，改行者众，未必按原来方法做不好，而是“另辟蹊径”了。\n\
    \n本选编的初衷是让读者尽可能方便地了解祝嘉先生的思想精髓，同时也希望在尽可能大的范围里延续其言行。\n\n少耽八法慕前贤，到老无成负此身。\n\n徒托空言谈著述，不如一笔能通神。\n\
    \n——祝嘉《九十初度书怀·其四》\n\n附录5　第一版后记\n\n曾经有一个名为“基于经验的认知”的“香山科学会议”的预告，“夏商周断代工程”首席科学家、当时已到清华大学工作的李学勤先生是发起人之一。后来笔者打电话请益，李先生告知当年读的是清华大学哲学系，学逻辑，金岳霖先生是其老师^([\\\
    [10\\]](#att001.html#footnote_content_att001_10))，这样的背景对认知科学有兴趣是自然的。那个会议后来没见召开。其实笔者在生活中常常由于忽略经验而面临不便，譬如不愿多带一块电池板或携带一个充电器，因移动电话没电而耽误事情或浪费时间。日常生活经验当然不同于专业领域经验，对待经验的态度则可能有共同之处。就笔者的程序设计背景而言，从汇编语言到高级语言，从用户界面到核心算法，曾经夜以继日甚至通宵达旦，但终究没有像医生专家那样拥有足够的专业领域经验而渐行渐远。\n\
    \n如今，笔者踏上工作岗位已近30个年头，从事的研发工作，有的仅是实验室的演示，有的纵然在企业中实施也未能走上产业化之路。10余年来我们课题组的心血管系统体征感知与症状分析工作可能差强人意，其中与诊断准确性有关的因素包括医生诊断思维过程的建模和大量实际数据的获取及其特征标注，前者与演算过程、诊断规则有关，我们的诊断机制应该符合医学专家的思维特点；后者和问题分析、临床需求相连，没有丰富的实际数据用于训练和测试，就没法发现差错所在并寻根溯源。计算机书法创作建模与自身的经验和体会直接有关，但停留在了演示阶段，在学习、实践的同时花费了资源而没有更多“输出”，不免内疚、惭愧。不过，我们的研究，关注形象思维与抽象思维模拟相结合、人机结合，核心是隐性知识挖掘和整体思维模拟，本身算是一点经验，就与一些同道的交流言，于读者会有不同程度的启发。\n\
    \n也许是工作经历的缘故，使得笔者相对容易接受王阳明的知行合一阐述，马克思主义经典作家的抓主要矛盾、重视矛盾的主要方面的理论，这些思想给予了笔者信心和勇气。拙著所述“心迹”的计算是联系人工智能技术和现实应用的载体，其中思维过程模拟是主要矛盾，而隐性知识的形式化和整体思维过程的刻画则是矛盾的主要方面，笔者作如是观。此前的小册子《人工智能哲学》出版约半年后，据出版社库存统计那时已销3\
    \ 000册中的大概60%，这个比例令笔者有点惊讶。后来，科学出版社的信息、数理、技术等分社分别有编辑约稿。笔者曾考虑将拙著内容加入后出版《人工智能哲学》第二版，那将是改进不足、完善认识的机会。不过在差不多同时的2012年4月底，笔者收到时任中山大学哲学系朱菁教授的邮件，其拟在报纸上推荐拙著《人工智能哲学》的理由如下：\n\
    \n作者思维活跃、涉猎广泛，虽缺少严格的哲学思维训练，对当代专业哲学的术语和论证方式显得有些生疏，甚至在讨论中不时落入简单套用“辩证法”和“辩证思维”的窠臼，但也因此少了许多思想上的羁绊与俗套，多了几分天马行空和不拘一格的灵动，文笔清新流畅、亲切自然。\n\
    \n笔者颇意外，即回复朱老师。其过奖让笔者汗颜，其指正令笔者反思。朱老师本科毕业于中国科学技术大学计算机系，后为哲学领域的教育部“长江学者奖励计划”之特聘教授，平时话语不多，关于人工智能哲学，无论视野还是基础均颇有话语权。\n\
    \n两年多以后，2014年江苏书展期间，笔者在书店偶然发现复旦大学徐英瑾教授的著作《心智、语言和机器——维特根斯坦哲学和人工智能科学的对话》，这是一个正宗的哲学研究者的哲学思考和探索，不幸的是在书架上该著被归在计算机的“语言”类中，就像此前不久笔者见一本“认知神经科学”著作与医学的神经外科等书籍为伴类似。拙作《人工智能哲学》又被一位专业哲学研究者评及，惭愧有加，当然同样十分感谢。徐教授年轻而有学者风范，思维活跃，与朱教授一样，我们相识于一年一度的“心灵与机器”研讨会上。徐教授所指类似问题是：“董著所引的哲学思想资源，则更多地带有辩证唯物主义的遗迹。”“带有”是客气之说，辩证唯物主义作为与分析哲学等一样的一个学科方向，至少也是一家之言，有机会当重读经典、系统学习。2016年，在王飞跃教授牵头的人工智能主题的“听道”讲坛，组织者购买了一些讲者的书籍送给听众，王老师说《人工智能哲学》中国味太浓，笔者即说是的，按照李泽厚先生的说法，哲学是西方的，中国有的只是思想，与哲学本来的含义并不一致。王老师说是的。那时笔者才想到，谈哲学，得纳入经典的哲学话语体系，中国文化的思想及其给人工智能带来的影响，未必适合在冠以哲学的主题下讨论。\n\
    \n拙著成稿后，笔者翻阅《钱学森思维科学思想》（卢明森编）。其中有钱学森先生谈到的一件事，说收到过名为《人工智能与认识论问题》的书后，他回复说：是本人工智能的入门书，挺好的，但提到认识论，那根本说不上。想到自己在十余年前也执笔过类似题目的文章，越到后来越觉得所谈太粗浅。钱先生所言极是。\n\
    \n因此，尽管顾准说“方法论就是哲学”^([\\[11\\]](#att001.html#footnote_content_att001_11))，“人工智能哲学”话题过大，再以此题为名“胡言乱语”将更多地贻笑大方，于是有了如今题目，遗憾的是在这同时修改《人工智能哲学》的计划落空了。不过，拙著可以作为《人工智能哲学》的姊妹篇：那关于思想方法（尽管粗陋），这关乎技术理念。\n\
    \n拙著背后是笔者课题组在心电图分析和书法创作模拟方向上的研究生的实践与经验积累的过程。毕业于中国科技大学计算机系的朱洪海选择到华东师范大学攻读硕士学位研究生，后到中国科学院苏州纳米技术与纳米仿生研究所攻读博士学位，他在研发上的成果几乎与我们的心电图工作同步。硕士生詹聪明在其实习阶段的心电图主波识别工作是我们该方向研究的开始。硕士生徐淼最早针对形态特征识别做了尝试，他的隶书笔画变形模型则是我们书法创作模拟工作的开端，是后来博士生张显俊及硕士生杨志军、赵琪、薛环振工作的基础。徐淼毕业后去美国攻读并获得博士学位，他所在学校的王松教授在给笔者的邮件中提到，徐淼是他在美国碰到的最优秀的学生之一。此言不为过，徐淼当年从华东师范大学数学系转到当时新成立的软件学院，此后又以名列前茅的成绩被保送攻读硕士学位研究生，无论专业基础还是科研作风都稳实。博士生王丽苹、张嘉伟、胡晓娟、周飞燕与硕士生童佳斐、朱侃杰、沈蜜、朱江超、李慧慧等分别从不同角度进行了有意义的尝试、实验、交流和分析。中国科学院苏州纳米技术与纳米仿生研究所的博士生金林鹏在朱洪海及硕士生张高登工作基础上的研究使得我们的分析算法能步入实际应用，这是一个里程碑。参加过心电图终端开发的有硕士生于志斌、何逸珉、吴杰、李皓等。这些研究生毕业后几乎都在工业界工作，诚挚感谢他们以及中国科学院“百人计划”等人才项目的支持，这些资助使得笔者能在宽松、自由的氛围中考虑一些具体而深入的问题。特别地，上海瑞金医院心脏科刘霞主任医师长期以来给予了专业指点与热情鼓励。诚然，对大家最有分量的感谢当来自可能受惠于本研究成果的社会与百姓。\n\
    \n大慧普觉禅师有言：心术是本，文章学问是末。本小册子既是工作内容小结，亦是“余事”一桩。冯·诺依曼在其《计算机与人脑》“引言”中说：逻辑学与统计学应当主要地（虽然并不排除其他方面）被看作是“信息理论”的基本工具。拙著思想恰好是其在人工智能应用中一具体表现形式，即规则推理与统计学习（机器学习）的结合。\n\
    \n钱学森先生说，从思维学角度看，对联的过程是：出联的上联是给出一个结构，请应联者据此去找零件填入这个结构，思维就在于搜索思想库找材料。他的体会是，形象思维是与上述答对联相反的：有材料，但无结构。思维的任务是拢形象，即结构。相反也相成。拙著各部分之首，是笔者集古代书法名碑帖字而成的对联，于各章内容似有关联而未必切题。既然对联是思维的一种形式，就不揣简陋敷列其中供方家一笑。但愿有更多像朱教授、徐教授那样的批评指正。\n\
    \n2016年11月30日\n\n于中国科学院苏州纳米技术与纳米仿生研究所\n\n【注释】  \n\n[\\[1\\]](#att001.html#footnote_quote_att001_1)笔者总觉人工智能研究之方法论十分重要，以至于曾出版拙著《人工智能哲学》（2011年科学出版社出版）。有友人提出再版事宜，笔者婉拒了，因后来看标题就不合适，内容更不合意。既成往事，无法改变。"
