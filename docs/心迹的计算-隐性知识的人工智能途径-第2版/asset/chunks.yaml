    从“分而治之”的角度出发，可通过组合相对简单的函数实现分类，如高斯核支持向量机的决策函数由多个高斯函数方式拟合而成，神经网络的决策函数由多个激励函数以组合方式拟合而成等，从而更复杂的非线性函数就可通过组合与复合多个非线性分类器构造而成。


    4.6　方法融合


    卷积神经网络可直接输入整条心电图记录，但在给定网络结构下，其非线性拟合能力有限，因而考虑在此基础上实现分类器的集成与融合。融合本身是指相似功能或作用的元素或实体的关联、重组、互补与优化，从而聚集、统一为一个功能更强、作用更大的实体，有自然的过程，如地貌的变化、河川的汇合；有含一定主动性的行为，如民族的聚集、种群的分布；有内外因导致的结果，如机构的合并、方法的集成。抽象思维和形象思维的综合，既是大脑的特性，也是当今众多智能模拟方法互相取长补短的必然要求，因为有的算法长于计算或推理，如规则推理；有的则长于分析、综合，如人工神经网络。不仅如此，前者和后者都有待细分。


    就心电图而言，有的是识别QRS波群的，如能量谱方法；有的是针对P波的，如机器学习方法；有的是面向ST段的，如模板方法。更进一步，比如同样是P波，有的情况下可选择支持向量机，有的时候还得借助小波变换。融合应是多角度、多层次和多方面的。好的分类器融合策略，既需要对数据的深入剖析，尤其是就出错数据查找原因，又要对不同分类器性能和特点有清晰把握，前者琐碎、量大、枯燥、耗时，后者依赖于前者，又非小数据集上浅尝可止，需要洞察并调整内部结构，测试各类数据。只有这样，才可能让分类器与数据特点匹配，使得它们分工有序而作用协调，进而提升整体性能。因此，面对实际数据，随便选择某种分类器解决不了问题，而缺乏足够量的原始数据，有效的分类器不但不会“飘然而至”，甚至分类器的基本性能都难以发挥。多种分类方式［30～32］的有效融合可使效果得以提升。


