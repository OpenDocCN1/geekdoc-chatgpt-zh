    图5-10　书法创作：既是临摹过程的归宿，也是机器模拟的参照。上部是基本的书法学习过程，中部是机器实现环节，下部便是所谓的“字外功夫”。这里，临摹是基本环节，开始是日复一日的重复练习，而有了一定创作经验后的临摹会更注意细节及整体效果


    “临碑之时，必须将字之结构仔细考虑，凡字多由左右两边或上下两截而成，如何配合，举一即可反三。先就其相似者仿而效之，再取其绝不相类者比而造之，时时揣摩，虽不中不远。故临碑务求娴熟，一碑到手，至少百通，熟能生巧，其言是也。世有以模拟见长者，其实乃不能变化之人也。”［18］变化即创作。


    笔画融合、字形改变和整体创作是逐步深入的过程，结果又可以作为临摹对象。当然，临摹书法作品时，原来记忆的内容也会起作用。书法创作模拟若以某种结构层次为模板，是较为理想的途径，但目前没有相关结论。下面介绍的内容涉及碑刻笔画的轮廓平滑，以及笔画的变形模拟。


    基本过程是，先对所学的字的图像进行预处理［19］，包括图像平滑（中值滤波）、二值化、小孔填充（腐蚀和膨胀）、轮廓提取（八领域搜索）、轮廓恢复（傅立叶变换），各步骤如图5-11所示。


    ![](images/txt006_12.jpg "pagenumber_ebook=136,pagenumber_book=128")


    图5-11　创作模拟前的预处理步骤及其结果


    在获得一组书法字的笔画图像（如不同碑帖的横画）后，对于每一个图像（横画）定位一些关键点来勾勒出它的结构，成为一个样本`X`，进而得到相应的一组样本。


    用主成分分析法分析这些样本构成的矩阵以获得反映样本的主要特征`b`（如“长”“短”、“方”“圆”、“肥”“瘦”。从书法审美本质看，本应讨论“厚”“薄”，这对矛盾与“肥”“瘦”无关，但我们的模拟目前仅涉及二维特征，暂时以“肥”“瘦”或者“粗”“细”论之）［20］，由它们组成一个特征矩阵`Φ`。


    于是，可以得到统计学习模型如下：


    ![](images/txt006_13.jpg "pagenumber_ebook=136,pagenumber_book=128")


    其中，`X`是样本排序后的平均值，`b`多维列向量，代表了一个样本空间中样本的主要特征。当调整`b`的不同分量时，就会得到不同的`X`，即由这个模型可以得到与样本相似的新图像。若能够找到`b`的变化与`X`的变化趋势之间的关系，则可以通过调整参数`b`实现“创作”输出。


    隶书“蚕头燕尾”的横画最为典型，图5-12演示了部分变形结果。


    ![](images/txt006_14.jpg "pagenumber_ebook=137,pagenumber_book=129")


    图5-12　来自不同样本的隶书“横画”的不同变形结果


    该模型是进行后续书法创作模拟的基本前提。接着考虑笔画的相互位置的选择和确定。以简单的“十”字为例，不同的“横”画与“竖”画的交点对视觉效果有不同的影响。这同样是一种统计学习。图5-13表示从原始图像开始，经过预处理和编码，再进行适当变化创作出“十”字的过程。原始碑帖书法文字被提取出书法字的骨架后，再作轮廓跟踪并抽取出组成该字的各个笔画，进而依据所抽取出的笔画，从库中挑选出与之对应的笔画若干，进行变形，最后将变形得到的笔画依照之前得到的骨架进行组合而生成新的字。


