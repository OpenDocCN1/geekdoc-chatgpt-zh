    日常，每天主要的心电图数据是正常的（72%以上）。由表可知，在融合“RR间期正异常分类器”后，特异性提高到了67%，0.67×0.72≈48%，即可减轻近半的医生工作量，这是一个具体的、为临床医生所接受的结果。


