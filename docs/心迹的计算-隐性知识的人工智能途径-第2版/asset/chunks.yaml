- raw: "有言道，“真理越辩越明。”被辩明的真理可以为其证。然而生活中多数争辩无果而终有伤了和气，于是有人会指责对方“好辩”，意为有不争的事实而毋庸置疑，然而争辩总是双（或多）方，指责别人者在别人眼里十有八九也是“好辩”的角儿，或许最后错的恰是此方——总以为对方糊涂自己洞若观火的态度本身不对。可惜“双标”说话行事者不少。笔者以为这正是辩证思维的用武之地，以使不易辨别之事有个基本结论。“辨”“辩”在此关联了。\n\
    \n曾听到过从一流大学哲学系教授到普通受教育者对辩证思维或辩证法的批评，不无原委，由于内涵的多义和外延的难限，使得某些概念和理论初衷或本意会有“泛化”倾向，那可能是发展，也可能是滥用，原因往往在于忽视内在原则，就如改革开放后百姓生活普遍得到改善，物品丰富、饮食多样，但这不意味着可以铺张浪费，有说“能吃是福气，节约是美德”，不仅如此，节约还是底层“逻辑”。有的纯粹数学家不认为应用数学家在搞数学，有的应用数学家于工程技术不屑一顾。其实，实际应用中，统计方法很派用场，控制系统中大量应用传统控制器，简单的、初始的并不意味着就是无效的、落后的，而是经典的、务实的。科学本来鼓励自由探索、天马行空，那既是本质使然也是客观规律，但不可反过来以此为托词而扭曲是非、混淆视听，行挥霍浪费之举和不负责任之事。就如一个小孩，应鼓励其发挥天性、自由成长，但若他唯我独尊、肆无忌惮，还可熟视无睹、听之任之？\n\
    \n辩证思维与逻辑思维认为事物一般是“非此即彼”“非真即假”不同，在其语境中事物可以在同一时间里“亦此亦彼”“亦真亦假”。辩证思维是一种世界观，是唯物辩证法在思维中的运用，联系、发展的观点是辩证思维的基本观点，范畴、规律诸概念也适用于辩证思维，对立统一规律、质量互变规律和否定之否定规律一样是辩证思维的基本规律。笔者以为，辩证思维最基本的特点是将对象作为一个整体，从其内在矛盾运动、外部的普遍关联以及各个方面的互相作用着眼，以变化与发展、联系与作用、系统与全面、历史与客观的视角认识和看待问题，以图从本质上完整地认识客观事物。\n\
    \n蕅益智旭谈到《论语》中“智者不惑，仁者不忧，勇者不惧”时指出，“三个‘者’字，只是一个人，不是三个人也”。［16］而字面上看是各归各的。\n\n诺贝尔物理学奖获得者汤川秀树说［17］，“总之，古中国通过各种方式而在我心中占有地位。尽管这显然和我是一个科学家这一事实相矛盾，但是，这反而足以给作为一个科学家的我以某种个性……我所最感亲切的却是古中国的那些古老的、成熟的想法。与此同时，那些想法在我今天看来也是异常现代化的”。“换句话说，这里更重要的与其说是消除矛盾倒不如说是在整体中发现和谐。……而辩证法被认为可以使矛盾的综合成为可能。我并不特别反对按照这种宽广的方式来诠释逻辑学，但事实却仍是，要想综合矛盾，就必须首先直觉地考察整体。”另一位诺贝尔物理学奖获得者益川敏英建议放松的时候读一读《资本论》和《自然辩证法》，认为挺有意思，前者指出不仅自然界存在法则，社会发展也有规律。后者是学习辩证法的合适读物，它不是首先给出定义，而是给出思考辩证法的适用案例。学习那样的案例对于自己分析自然现象或社会问题是很有帮助的。在他的理解中，辩证法就是在我们的视角产生巨大变化时，讨论期间出现的事物、现象的规律性的学问［18］。\n\
    \n黑格尔与歌德谈话涉及辩证法时说：“归根到底，它不过是一种原本人人都有的矛盾意识，辩证法只是使其规律化并变成为方法论罢了；它的巨大作用在于分辨真伪。”［19］马克思、恩格斯的有关著作远比一般市井文学耐读，也比其他经院哲学生动，原因就在于它们面对现实、分析透彻，在于它们高屋建瓴、吞纳古今，深奥的哲理联系了世人的生活，宏博的思想启发了现实的人生。不可否认，马克思主义的宣传在中国、在我们这几代人身上有着特殊的影响，这在一定程度上可能会有先入为主的作用，况且，目前看得到的马恩著作，都是组织专门人力翻译得很好的经典，但这不是“逆反”的理由，也许正是这样的情景需要更多的辩证思维。\n\
    \n恩格斯说：“每一个时代的理论思维，从而我们时代的理论思维，都是一种历史的产物，它在不同的时代具有非常不同的形式，并因而具有非常不同的内容。因此，关于思维的科学，也和其他任何科学一样，是一种历史的科学，关于人的思维的历史发展的科学。而这对于思维的实际应用于经验领域也是非常重要的……然而恰好辩证法对今天的自然科学来说是最重要的思维形式，因为只有它才能为自然界中所发生的发展过程，为自然界中的普遍联系，为从一个研究领域到另一个研究领域过渡提供类比，并从而提供说明方法。”［20］\n\
    \n克罗齐（B.Croce）有名言“一切历史都是当代史”。按照该命题本身，若“当代史”就是“历史”，显然混了两个内涵大小有别的概念。有说历史割不断、史事会以新形式再现，此言没错，然而“延续”本身意味着有不同阶段，后阶段可以超越前阶段而替代不了前阶段已有情状。这与人类看到星空光辉不同，那都是穿越时空而来并被肉眼看见，尽管遥远且隔不同时间，然其本质、形态没变，因此可言我们所见一切太阳光都是八分多钟（天文学计算结果）以前太阳发出的光。历史既可以被发现新佐证，又可以由梳理而出新结论，颠覆既有结论也可能，但断定“一切”历史都是当代史则有违历史逻辑。有人会说彼言不可那样理解，如果需要“理解”，是否本身就意味着不能以“生硬”逻辑约束而只得“辩证”观之。歪曲、窜改、捏造历史不在此处讨论范围内。\n\
    \n钱学森指出，看来恩格斯早就提出“辩证思维”的概念，而且明确了这是人特有的。他还指出，有吴文俊的基于中国传统数学思想的数学机械化工作，抽象思维（逻辑思维）的任务看来可以交给机器去干［21］^([\\\
    [6\\]](#txt003.html#footnote_content_txt003_6))。思维科学的基础科学思维学包括抽象思维、形象思维、创造思维。辩证思维是三种思维的综合。\n\
    \n在吴文俊看来，数学发展的主流并不像以往有些西方数学史家所描述的那样只有公理化思想，还有与之平行的中国式数学，即构造性、机械化思想。数学的公理化方法，是在一个数学理论系统中，从尽可能少的基本概念和一组不证自明的基本公理出发，通过纯逻辑推理法则，建成一个演绎系统的方法。中国古代数学的成果经常以算法（术）的方式表述，与之相应的是一些由其理论依据总结出的原理。通常证明几何定理的演绎法的应用范围有限，数学机械化开辟了初等几何获得应用的广阔空间，那是一种思维模式［22］，并在方程组求解、一阶逻辑公式的证明、微分几何、理论物理、力学等领域探索应用。“……吴文俊的数学机械化，理论上是可靠的，方法是可行的，这恰巧是人工智能方面最为重要的。”［23］那是中国学者对于数学机械化、人工智能做出的原创的、卓越的贡献，该工作本身也得益于辩证思维。\n\
    \n力戒片面、绝对、孤立、静态、局部地想问题、看世界，这是辩证思维的基本要求。做软件开发的人，希望自己开发的软件能卖出去而不是免费使用，但用别人软件时往往忽略此意，把自己特殊化了^([\\\
    [7\\]](#txt003.html#footnote_content_txt003_7))。\n\n顾炎武《与人书》言：“《宋史》言，刘忠肃每戒子弟曰：‘士当以器识为先，一命为文人，无足观矣。’”其中的“识”很大程度上依赖于思维方式与经验。辩证思维把握之灵动、眼界之宏阔，使之在计算环境中更难刻画。至于《明儒学案》中如下的“段子”［24］，则是社会现实所致的绝对化但不是辩证思维。\n\
    \n娄江（王锡爵）谓先生（顾宪成）：“近有怪事知之否？”先生曰：“何也？”曰：“内阁所是，外论必以为非；内阁所非，外论必以为是。”先生曰：“外间亦有怪事。”娄江曰：“何也？”曰：“外论所是，内阁必以为非；外论所非，内阁必以为是。”这是简单化、绝对化。\n\
    \n《近思录》的《卷十一·教学之道》言［25］：“濂溪先生曰：刚善为义，为直，为断，为严毅，为干固。恶为猛，为隘，为强梁。柔善为慈，为顺，为巽。恶为懦弱，为无断，为邪佞。惟中也者，和也，中节也，天下之达道也，圣人之事也。故圣人立教，俾人自易其恶，自至其中而止矣。”（周敦颐《通书·师》）此为儒家的中庸之道，是被诟病的中国传统思想之一，实际上不走极端、兼顾各方没错，因此可说笼统批中庸之道本身也有可商榷之处。问题在于国人容易理解上简单化，行动上甚至首鼠两端。如果作具体分析，结论可清晰化。比如常言宣纸越老越好（这里的“好”指书写效果），听者因而也如此相传。为什么“老”就好？具体原因据说纸经过一定时间的氧化“纸性”平和了，如果这样，不需要多长时间就可达“稳态”，后续时间长短无关紧要，因此“越长越好”就不着边际了。不过这与所谓“千年寿纸”（其实宣纸才数百年历史）不是一回事，此说指作品保存期。与“乾隆”纸之说亦不可同日而语，那已参入文物价值，且那时候的做工尤其皇室专用品更得另当别论。佛家的“不二法门”相对更深刻些。\n\
    \n王浩说：“按某种含混而宽泛的意义来说，尽可认为逻辑是一种由世界找到秩序或者将事实理出秩序的理论和实践。正是在这种意义上，逻辑可以包括‘辩证逻辑’，特别是黑格尔的大逻辑……由此看来，数理逻辑就不免落后于逻辑了，因为我们总是在凭直观把握一些尚未获得‘准确和完备的表述’的逻辑观念。”［5］王浩认为，“他（指哥德尔）的不完全性定理是他应用直观的算术真理概念与准确的形式可证性概念之间的辩证关系的一个宏伟结果。这种辩证关系在他的发现过程中尤为明显。他先是看出算术真理在算术中不可定义，随后又注意到形式系统中的可证性是可定义的，这才造出一个在系统中可表达但不可证的真命题。”“辩证关系概念要处理的正是客观世界和人类活动中什么适当这个变动不居的侧面。”\n\
    \n若能既全面分析，又重点突出，当是佳境，这与逻辑并不对立。\n\n第一，辩证思维首先要有清晰的概念。抽象思维背后是逻辑思维，不能说逻辑思维以外的思维是不合理的，即不能囿于逻辑，艺术创作、医生诊病甚至教育也不仅是逻辑思维。辩证思维强调时空多维状态及其关联，前者指历史观，后者指系统分析。在《歌德谈话录》中歌德曾对黑格尔说，但愿灵巧的辩证技艺没有常被人误用来把真说成伪、把伪说成真。\n\
    \n第二，历史地看指注意不同时期和不同阶段的背景与脉络、动态过程与相序阶段；系统强调不同角度、不同层面，各个因素及其相互作用，成熟的理论是合逻辑、自洽的，理论与实际比可能是“孤芳自赏”，所以才强调“实践是检验真理的唯一标准”，“摸着石头过河”便是例子，那没法由逻辑推得：过河没错，但“摸”岂不是意味着盲目？可别无他途，只得如此。\n\
    \n第三，从发展过程看，辩证思维是在抽象思维和形象思维基础上形成的思维观念，进一步面向了丰富多彩的思维现象和社会生活。比如某人犯罪，按照法律条文推理该死，但考虑到此人曾有过贡献或做过善事，可以一定程度上将功补过，实判无期徒刑。看一个人的贡献也类似，如果孤立按照岗位看是一种结果，如果考虑到前任的基础和帮助、同事的配合与支持，结论自有不同。\n\
    \n上述简单分析表明思维本身的丰富多彩、引人入胜，以及随之而来的思维模拟的艰难困苦与任重道远。恩格斯说，“在涉及概念的地方，辩证法的思维至少可以和数学计算一样得到有效的结果”。［20］针对抽象思维、形象思维、辩证思维的不同特点和作用，以致顿悟（大珠慧海禅师《顿悟入道要门论》：顿者，顿除妄念；悟者，悟无所得）、直觉［26］等概念，整体思维，即以辩证思维为机制，以形象思维为核心，以经验知识为基础，注重对象整体把握的思维方式和思维过程，既是我们研究的基本理念，也是我们的研究对象。\n\
    \n身在其中，难免一叶障目，登高远望，可能风光无限。思维自身扑朔迷离，辩证思维有助于“拨云见日”，它离不开宏阔的眼光和视野，也需要日常的认识和习惯。“由于我们易犯错的特性，任何定义都可能是歪曲的或不完整的，更何况人们可能就该词的意义争论不休。”［27］大脑的功能区已被逐步划分，细胞层面结构也越来越清晰，但这样的物质形态及它们间的电活动如何支撑智能呈现和思维过程依然是复杂性巨大的问题，人们只能摸索前进。也许未来某天回过头来看，目前的做法被认为粗疏和简陋，然而现在还有更好的方法吗？\n\
    \n值得指出的是，井底之见、强词夺理，含糊其词、偷换概念，新官己意、朝令夕改，自以为是、指鹿为马等陋习怪论无论思想上还是行动上均非辩证思维之旨。\n\n2.7　本章概要\n\
    \n思维的全面模拟是人工智能的内在要求，其若干方面的关系如图2-1所示。\n\n![](images/txt003_2.jpg \"pagenumber_ebook=63,pagenumber_book=55\"\
    )\n\n图2-1　不同思维方式间的关联\n\n●逻辑是人们生活和计算机都应遵循的原则^([\\[8\\]](#txt003.html#footnote_content_txt003_8))，而思维过程不限于此，超越逻辑于人类、于机器都需要一种“转身”；\n\
    \n●人工智能研究的思路与方法没有现成答案，本身是一个有待探索的话题，它将伴随人工智能的发展历程；\n\n●辩证思维是智能的又一高度的体现，但在人们的日常生活中普遍缺失或不以为然，机器缺之则人工智能不会完整。\n\
    \n横看成岭侧成峰，远近高低各不同。\n\n不识庐山真面目，只缘身在此山中。\n\n——苏轼《题西林壁》\n\n参考文献\n\n［1］林可同.弘一书法墨迹.杭州：中国美术学院出版社，1997：48.\n\
