    # 1　人工智能万水千山


    ![](img/txt002_1.jpg "pagenumber_ebook=15,pagenumber_book=7")


    桃李领春色，黄花点秋容。


    万物各有时，而况真英雄。


    叔伯先生正 于右任［1］


    计算机问世后，人们就有可能开发出这样的系统，其复杂性层次是过去想都不敢想的；由于计算机能够解释和执行其内存的程序，又启动了人工智能的研究［2］。


    ——司马贺


    假作真时真亦假，无为有处有还无。


    智能发生及其本质，和宇宙起源与终结、生命诞生与进化、物质结构与范围一起被认为是人类面对的基本问题，其相应观念和纷繁呈现离生活更近、与人类关系更直接，然而关于其活动、过程和机制充满了迷茫、困惑和期待，迄今为止于人们还如“雾里探花”，除了大脑神经元数量规模的估算、宏观功能的大致定位、有些生理或病理特征的可视化之外，认知神经科学对大脑的微观运作机理和神经元活动的剖析、认识与理解，依然还如“盲人摸象”。


    ## 1.1　神妙智慧


    仰望浩瀚苍穹，或晴空万里，或银汉灿烂，或雷电交加，或晚霞绚烂，疑问随之而来：更遥远的“天外”是什么？它们有边界吗？那里有类人的生命吗？宇宙又是如何起源的？现在的说法是宇宙源于大爆炸，将终结于黑洞，大爆炸前是什么？理论假设是一个奇点，此外还有量子震荡、中微子等推测。


