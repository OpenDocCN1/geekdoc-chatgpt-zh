    negative）表示正确拒绝的阴性样本。`TP`＋`FN`就是阳性样本数，`TN`＋`FP`就是阴性样本数。


    总的正确率（`GCR`）＝（`TP`＋`FN`）／（`TP`＋`FN`＋`TN`＋`FP`）


    就一条心电图记录而言，起始位置不同，而同样时长的心电图意味着数据空间中的不同点，为了增加可信性，可选择不同起始点的若干数据进行实验（比如选第1，26，51，76，101，126，151，176，193点起始的不同数据），于是有9个不同的分类结果，取回归输出值的平均作为最后的输出，记为`CNNR2`（只取一个起始点的数据记为`CNNR1`）。表4-2是两者的比较［29］，数据及其意义在后节一起讨论。

