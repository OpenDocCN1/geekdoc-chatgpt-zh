- raw: '无论如何，实际工作不能满足于实验室里小规模数据的实验、分析。以我们做的计算机辅助心电图诊断为例，几十年来太多方法在标准数据库上都“好”，只要了解“大数据”之独特，就不能也不会满足于原来的小数据库上的工作。在恰当时间、针对具体病人、采取合适措施是精准医学的目标，然而现有深度学习技术在多数情况下并没有如宣传那样得到符合临床要求的结果，宏观而言是模型泛化能力不足［38］，根本在于忽视数据采集的场景、可靠性、精度、代表性、规模。工欲善其事，“必先足其数”。


    4.9　推陈出新


    我们的研究工作源于实际需求，面向实际问题^([\[6\]](#txt005.html#footnote_content_txt005_6))，又需要技术创新，经过了从理念到产品的过程。图4-12是围绕用户需求，从市场调研到切实提供服务的若干关键环节及其关系的示意。


    ![](images/txt005_32.jpg "pagenumber_ebook=115,pagenumber_book=107")


    图4-12　从需求到产品主要环节


    常听得此问：准确率如何？这是个问题，但非工程上完整的问题。笔者告知后会补充说，医生也有误诊，我们的初衷是面向基层作筛查，疑难问题自然需要医生介入。医生的误诊原因何在？经验差异以外则是医学中大量存在的不确定性。比如，一位车祸病人心跳极不规律，据病人说曾患过甲状腺功能亢进症，由于通常认为甲亢会引起心律不齐，医生从而“对症下药”，然而有经验的医生知道，那不是心律不齐的常因，后来发现病人肺部已面目全非，在肺“修复”过程中其心跳恢复正常，接着甲亢指标也正常［39］。本来诸如“80%的可能”结论由统计而得，若被当作绝对依据，问题随之而来。所以，看似合理的诊断或解释需要格外小心。


    统计学源自现实生活并有成熟的理论，然而所谓的“统计意义”在讨论具体案例时难免“误导”。笔者学习时对其中的“P值”存疑，0.05、0.01有怎样的依据？有反过来对置信度选择的“优化”的过程吗？无疑，批评未必意味着被批评者一定“理亏”，经典方法的结论本身是概率意义下的可能性，不过如有些学者建议的用“兼容区间”表达或许更恰当或更不易被“一刀切”。生活中，能尽量作统计分析已是良好习惯，然而在结果选择上还需要考虑问题特点与背景、数据质量和规模等因素，当努力克服矛盾而非顾此失彼。扬弃是重要的也是相对简单的，包容、统一更需要智慧和策略。


    有云“心电图（自动分析）做了那么多年了……”此言可能含义有二：这件事不好做、难做好；该话题老了，该玩点新名堂。对于前者，自然不敢否定；对于后者，是个悖论，不敢恭维，不管新老与否，我们的任务不是“喜新厌旧”而是“破旧立新”地解决问题，如果对心电图这类体征都置之不理，那么，就更复杂的医学图像分析和理解，对于更宽泛的模式识别，对于更本质的智能模拟而言，都无从谈起。


    具体问题涉及：信号质量方面，是噪声和基线漂移大，变形重，甚至导联脱落等；特征识别方面，是幅度小，形态各异，样本不够；症状分类方面，是泛化能力弱、针对性不强、内部过程不明等。采取的措施包括：加强信号预处理，设计专门滤波器；扩大和改善训练样本，重视有些特征的专门识别，构造特定分类器；对分类器本身做深入分析和优化设计。


    归纳而言，分类探索涉及两种做法，每种又都有两条途径。


    ●经典的从特征出发的分类。


    ✧传统的专家系统方法，比如决策树方法、引入可信度因子的推理机。


    ✧经特征选择后，针对这些特征的统计学习分类方法，如支持向量机，以及独立成分分析与支持向量机的结合等。


    ●机器学习的方法，特征提取过程显现或隐含其中。


    ✧深度学习方法，以及用深度学习方法学习特征后进行规则推理再结合深度学习本身的方法。


    ✧规则推理和深度学习相融合的方法，这是目前最有效的思路，前者利用可有效识别的特征，后者利用神经网络把握特征。


    后续工作将包括：


    第一，跟踪、分析错误结果，细化出错原因并归类，这项工作琐碎而繁杂，但缺少这一步，则无从针对性地改善算法性能。


    第二，深层神经网络的优化，包括不同网络模型的比较、多层异构神经网络的设计、无监督和有监督学习的互补、参数的选择等。


    第三，隐性知识的进一步挖掘，不同形态特征的识别，构建针对特定形态特征的专门分类器，推理机的构造。


    第四，不同导联权重可以不同，设计更多适应不同症状的分类器，发挥不同分类器各自优势，针对不同疾病进行分类。


    第五，各种方法的集成［34，40～43］，学习不同于以往的其他方法，并融合诸如脉搏波［44］等体征，利用深层神经网络进行综合分析［45］。


    希望为“心”的健康贡献绵薄之力。


    4.10　心脉互参


    人工智能与医学的结合研究经过数十年的积累显现出广阔前景［46］。前述终端进入市场后，同类产品如雨后春笋，表明市场广阔，然而多为简单重复，符合临床需求的分析算法以及与其他体征的融合判读始终是大多数产品面临的问题。在前期计算机辅助心血管疾病诊断工作基础上，笔者认为仅仅进行心脏监护不够，于是考虑结合中医^([\[7\]](#txt005.html#footnote_content_txt005_7))把脉模拟设备以便把握血管情况。其时所见“脉诊仪”只能采集单点时间序列信号，并非医生把脉时的完整感知信息，于是调研并获悉美国PPS公司的阵列式传感器，在脉象感知领域首先使用该传感器并发现其问题，从而提出阵列式柔性传感器需求。此后有不少机构或团队实施研发，尚未见符合临床需求并与相关疾病建立联系的工作［47］。进而研制更有效、更便捷的如图4-13所示可佩带“单复”^([\[8\]](#txt005.html#footnote_content_txt005_8))感知终端。同时是对中医把脉隐性知识通过标准明确的心电图结论显性化的一种努力。


    ![](images/txt005_33.jpg "pagenumber_ebook=118,pagenumber_book=110")


    图4-13　可佩带终端形式及其体征分类方法的演进示意


    脉象感知技术可增加获取一个体征信息，所谓“多多益善”于此可见其优势，然而就使用言，尤其是基层应用，设备要既可信又方便：“可信”首先要无异议，中医有不少争议；“方便”既要求使用简单又要小巧，心电图至少要两个电极安在不同部位才能得到一个导联信号，比如腕表，若戴在左手，需要右手主动接触另一电极才行，不仅没法取得连续信号，还带来噪声等干扰。既然脉象有不同形态表征，就意味着背后是不同的身体状态，它们可能就是不同病症，若限于心血管系统，则可能是心血管系统疾病的除心电图以外的另一种表象，故而若能得到这些脉象对应的心血管系统病症（比如心电图的结论），就可满足前述要求，因为心电图无争议，而单个电极比两个电极方便，从而问题变为，如何将脉象对应的结论映像到心电图相应的病症诸如心肌缺血、房颤等。这是人工智能可辅助的，只要能同步采集到这两个体征的足够数量的数据。背后是血流动力学范围的研究工作，该问题研究已久，从生物医学工程角度说明是一回事，得到模型是另外一回事，宜切换视角。如人工智能，不是等到搞清脑机制后再模拟之，中医在这里与人工智能似乎“相通”，人们可求有效性，再探究机理。直接的方法是让数据说话，这是一个非线性问题，可以从数据拟合和关系学习角度设法得到输入输出关系，深层神经网络结合推理机制可以发挥作用，这符合大数据智能的基本思想。数据采集需要合适的终端，终端的核心问题是传感器与算法。


    为了不至于将同步感知的脉象体征机械地映像到比如房颤之类的心电图症状上，需要把脉医生与心电图判读医生一起观察、讨论，确定统一的表述，避免盲目性和过于宏观。


    学习算法所需的标注数据不足是普遍情况，由两位以上有经验的医生标注并确认过的数据更是阙如，因此，需要小样本训练模型，并且充分利用推理机制。推理方法可以分为归纳法和演绎法，机器学习是统计归纳，如深度学习，推理机遵循的是演绎法。笔者为此提出“升学”分类器：如学生升学而不断学习新知识的升级，同时也是指机器学习能力的提升。


    设有两个原始脉象数据集合：直接标注d di和非直接标注d nj两部分，后者的属性（症状名称）标注值由与同步心电图体征数据dek对应的属性（Clai，参见4.6节）映射决定，它们分别构成直接和非直接标注数据集合：


    ![](images/txt005_34.jpg "pagenumber_ebook=119,pagenumber_book=111")


    另有一合乎心电图症状Pk的属性结合：


    ![](images/txt005_35.jpg "pagenumber_ebook=119,pagenumber_book=111")，且各脉象数据相应的症状类属：


    ![](images/txt005_36.jpg "pagenumber_ebook=119,pagenumber_book=111")


    先利用有限的标注数据训练初始脉象分类器Pdnn，然后按照图4-14所示过程获得未标注的新数据的分类结果（属性），若与心电图分析Ednn输出的数据属性一致，则得到本次输入数据的确定属性（相对于初步属性而言），并将数据加入训练集中，即


    ![](images/txt005_37.jpg "pagenumber_ebook=119,pagenumber_book=111")


    若灵敏度等指标不稳定则继续训练，稳定则意味着得到目标模型。其过程如图4-14所示。


    它具有三方面意义：


    第一，解决普遍存在的标注数据不足的现实问题；


    第二，利用我们既有的心血管疾病其他体征如心电图的分析成果；


    第三，是融合规则推理与深度学习的一种具体形式。


    ![](images/txt005_38.jpg "pagenumber_ebook=120,pagenumber_book=112")


    图4-14　机器学习与规则推理融合的“升学”分类器交叉训练过程


    由上可知，以脉象数据为基础的该分类器依赖于心电图数据及其诊断结果，当心电图数据集足够大而不再依赖于中医把脉结论时，它就成为目标与心电图分析结果对应而数据源自脉象的分类器。于是形成新一代的监护终端（比如腕表或贴片）：感知的是脉象，得出的是心血管系统疾病分类结果。


    各科医生在各自领域积累经验，跨越两科的工作就需要协同，比如既是心电图又是脉象判读专家就难见，而如果没有多种体征融合分析的诊断经验，融合规则问题就十分突出地显现出来了，在此情况下让机器处理所谓的“多模态”体征就只是良好的愿望了。


    钱学森指出［48］，“发展中医只有这一条道路，要用强大的现代科学体系来使中医从古代的自然哲学式的、思辨式的论述解脱出来。”心脉互参是这个思想的一种实践。“中医不是科学”有两类指称：一是其不可以科学思想衡量，不能以科学名义约束之；另一则意其落后含糊，缺乏服人的依据和普适的手段。科学是发展的知识体系和开放的认识工具，不是科学未尝不可是一种暂态，但总要符合一般的思维模式与语言规范，即便暂时不作严格的推理也要以理服人，至少要“自洽”，不可自以为是，避实就虚，或者以一概十，以个代众；如果不能“另立”体系，则只能在科学范畴内讨论。吴文俊利用中国古代数学思想做数学机械化研究，我们希望借鉴中国传统医学脉象思想：


    以知识和技术创造价值；


    借产品及服务惠利民生；


    用思想与行动回馈社会。


    同时也希望对中医理论本身做出一些验证。实际系统中，诸如数据处理、模式分类与平台部署等会有不同问题，针对深度学习，现在有各种开源软件可供选择，除了了解其基本功能和操作要求外，宜知晓深层神经网络的发展脉络、核心思想和优化技术，并明确问题场景、数据规范和比照方法。


