    分别对其求关于![](img/att001_50.jpg "pagenumber_ebook=197,pagenumber_book=189")和![](img/att001_51.jpg
    "pagenumber_ebook=197,pagenumber_book=189")的一阶偏导数，则有：


    ![](img/att001_52.jpg "pagenumber_ebook=197,pagenumber_book=189")


    从输出层开始，先计算求得![](img/att001_53.jpg "pagenumber_ebook=197,pagenumber_book=189")，然后依次迭代计算得每个![](img/att001_54.jpg
    "pagenumber_ebook=197,pagenumber_book=189")，于是网络权值更新如下：


    ![](img/att001_55.jpg "pagenumber_ebook=197,pagenumber_book=189")


    这里的`η`可以周期变化，也可以保持不变。


    ### 1.4.5 导联卷积神经网络

    导联卷积神经网络（lead convolutional neural net work，`LCNN`）如附图 1-4 所示。


    ![](img/att001_56.jpg "pagenumber_ebook=197,pagenumber_book=189")


    附图 1-4　导联卷积神经网络结构，`1D-Cov`表示 1 维卷积计算，`LR`表示 Logistic 回归


    卷积单元`CU`包括多个卷积层和取样层，每个导联均有 3 个卷积单元`A i`、`B i`、`C i`（1≤i≤8），且不同导联间的卷积单元互不相干。8 个导联，有
    24 个卷积单元。每个卷积单元包括多个卷积层和取样层，还有一个全连接层和一个分类层。3 个卷积核分别为 1×21、1×13 和 1×9，3 个取样核分别为
    1×7、1×6 和 1×6，3 个特征面数分别为 6、7 和 5，全连接层 50 个神经元，分类层采用 Logistic 回归（1 个神经元）。每个导联的心电图数据依次通过最适合自己的
    3 个卷积单元，之后汇总所有导联的信息做最后的分类。数据处理如下：


    第一，500 Hz 原始心电图数据下采样到 200 Hz，跳过开始 25 个点，取中间连续 1 900 个点的数据作为输入数据，且仅保留 8 个基本导联的心电数据，即Ⅱ、Ⅲ、Ⅴ1、Ⅴ2、Ⅴ3、Ⅴ4、Ⅴ5、Ⅴ6
    导联。


    第二，对 8×1 900 个心电数据选取起始点位置，取值区间为［1，200］。在训练阶段，随机选取起始点，但保证每个导联的起始点相同；而在测试阶段，起始点均为
    1，选取连续 1 700 个点作为输入数据。


    第三，训练时，对 8×1 700 个心电数据叠加随机噪声，在测试时，则跳过这个处理。叠加的噪声包含幅度为 0～0.1 mV 的 0～0.2 Hz 的低频噪声，幅度为
    0～0.15 mV 的 45～90 Hz 的高频噪声以及幅度为 0～0.1 mV 的白噪声。


    此时的心电数据交由导联卷积神经网络进行识别与分类。


    设输入样本为`x=[x1,x2,…,x8]`，其中`x i`（1≤i≤8）为第 i 通道的数据，`f cov`为卷积函数，`f sub`为取样函数，则有：


    ![](img/att001_57.jpg "pagenumber_ebook=198,pagenumber_book=190")


    其中`g D`是全连接层计算函数，`g E`是 Logistic 回归函数，`W`和`b`是相应层的连接权值和偏置值，`φ(·)`是激励函数。`g Ai`、`g
    Bi`、`g Ci`为卷积单元计算函数，表达式均为`f sub(f cov(x))`，唯一区别是计算权值不同，两函数的具体计算公式如下：这里设第 i 层的卷积核和取样核分别为
    1×`P i`和 1×`Q i`，![](img/att001_58.jpg "pagenumber_ebook=199,pagenumber_book=191")表示“第
    i 层第 j 个特征面”位置是 x（从 1 开始编号）的神经元输出值，![](img/att001_59.jpg "pagenumber_ebook=199,pagenumber_book=191")表示“第
    i 层第 j 个特征面”和“第 i－1 层第 m 个特征面”的连接权值，`b ij`表示第 i 层第 j 个特征面的偏置值。


    ![](img/att001_60.jpg "pagenumber_ebook=198,pagenumber_book=190")


