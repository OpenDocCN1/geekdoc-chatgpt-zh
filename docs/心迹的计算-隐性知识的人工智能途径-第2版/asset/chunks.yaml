    \n\uFEFF\n\n7　人机结合峰回路转\n\n![](images/txt008_1.jpg \"pagenumber_ebook=163,pagenumber_book=155\"\
    )\n\n旦（陶刻符）［1］\n\n“……许多研究者都想撇开语言学家的工作，独出心裁，另搞一套。因此，也没有被语言学家接受：你走你的阳关道，我走我的独木桥。真正的问题是：语言学界真正关心的东西恰在河对岸——阳关道到不了的地方。”［2］\n\
    \n——马希文\n\n夕阳西下寻常见，紫气东来已忘言。\n\n20世纪70年代末我国社会一派百废待兴、朝气蓬勃景象。徐迟的报告文学《哥德巴赫猜想》发表后，有不少感兴趣者想将“哥德巴赫猜想”研究推向更高目标，且不时耳闻“喜讯”。针对盲目性和不必要的浪费，有前辈指出那事几十年内无望：尚没有合适的工具，好比现在砍伐大树靠电锯，拿切菜刀不成，刀口很快就会钝了。人工智能领域不断出现新的思想和新的突破，尚乏理论体系；理论与实践可以齐头并进，而实践往往走在了前面。\n\
    \n7.1　艺术山峰\n\n爱因斯坦强调经验在科学发现中的独特价值，钱学森指出形象思维与抽象思维的本质不同，李政道讲科学和艺术是一个硬币的两面，基本意义是经验积累、思维模式和知识汇通。人工智能原来分属计算机和自动化领域，实际上涉及面更广，但它有自身的核心知识体系与研究内容。就如办公室人员都在用计算机，有的非专业人员甚至写程序代码，但不是计算机专业人员，更非研究计算机技术者。再如智能制造，从机械化到自动化是一大跨越，可是自动化非智能化，就如脚踏车比手推车进步，被冠以“自行车”，其实那离“自动”以致自动驾驶很遥远，只是机械化的一个方面，而机械工程学科发展出了机电一体化、计算机辅助设计、智能制造等方向。那样的景象呈现出了在实践、规划过程中分解、综合的交叉势态，从而多了互补机会。\n\
    \n艺术与科学在真理普遍性互不可分的同时，有着人工智能不易模拟的特点。除了分别偏重于形象思维和抽象思维外，科学与艺术极为显著的差异在于，科学是不断拓展、不断深入、不断精化、不断超越的，或言不断有新高、不断有突破，而艺术在其漫长的历程中，有一座座难以超越的山峰，例如原始艺术中的岩画、彩陶、甲骨文、青铜器，线条凝练而各显特色，或粗犷，或爽健，或挺劲，或浑厚，观之生叹，思之神往。\n\
    \n为何后人要读经典？是因为那里闪耀着思想的光芒、蕴含着丰富的智慧；为何大家对传世艺术品欣赏不绝从而获得精神的愉悦？是因为那里有一道道取之不尽的源泉。比如唐诗宋词、宋元山水，过后再无可与之匹敌者，在高峰之间，便是谷地，似乎是辉煌之后归于平静。以更长远的历史眼光看，文艺作为一个整体不是一直进步，而是此起彼伏的。科学可以引用，技术可以集成，工程可以组合，而如书法虽然可以借鉴、吸收，可是每个人的学习，在掌握基本的方法后都得从一笔一画的基点开始，并非在前人的理论或实验基础上迈向新的高度；不是“百尺竿头更进步”，却如“独树成林”。\n\
    \n艺术创作不是大语言模型可轻易超越的一个“壁垒”，就如少儿歌曲《让我们荡起双桨》在成年人心中依旧清新动听、回味无穷，那是因为歌声依旧动人抑或同类中无出其右。\n\
    \n某日笔者到古玩市场，难得去总希望勿空手而归。转了一圈，看到一正在收摊处有一书的内容全是手写字，书法不错，便拿起来翻看，然后向摊主老先生询价，于是有如下对话：\n\
    \n老先生：你看得懂吗？\n\n笔者：看不懂，不是对内容感兴趣（头一次遇到此等反问，可能他根据穿着以为来了个盲流）。\n\n老先生：看不懂就不谈了。\n\n\
    笔者：这不是原迹吧（那样多页数的书，原迹可能性很小，但一时难分），我对书法感兴趣。\n\n老先生：当然是（原迹）。"
