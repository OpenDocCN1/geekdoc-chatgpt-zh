    ![](img/txt005_27.jpg "pagenumber_ebook=109,pagenumber_book=101")


    接着正异常分类，各种症状的分类是进一步的具体工作，比如房颤等检测灵敏度、特异性和准确率均近 99%。由于很多其他团队的工作仅限于`MIT-BIH`等数据库上的测试，没法在`CCDD`上两两直接比较。就对心电图本身的认识、不同分类方法特点比较、临床需求满足而言，与迄今为止公开发表的结果比我们具有整体上的优势，但临床应用方面有待更大范围的检验。就个体而言，算法的错误结果风险比单个医患交互要高，但有效算法在诸如提高效率、降低成本、普惠大众方面的回报是显然的。一个在评价指标上表现出色的算法如果没有临床上的实际价值便没有多大意义。


    还可先对信号质量进行初筛，比如对较复杂的信号采用统计学习方法，再进行信号质量评估，为后续分类算法提供先验估计。


    一般地，心电图的分类也就是要确定一个函数，使得不同疾病类型数据的函数值落入不同的区间。针对常见心血管疾病的不同症状，融合深度学习（深层神经网络）和知识工程（规则推理）的分类器为：


    ![](img/txt005_28.jpg "pagenumber_ebook=110,pagenumber_book=102")


    ![](img/txt005_29.jpg "pagenumber_ebook=110,pagenumber_book=102")


    这里，`RR`和`QRS`波群分别表示`RR`间期和`QRS`幅度，有 5 个依赖于它们的分类器`f i＝1，…，5`，这些分类器和神经网络分类器`f cnn`分别针对不同疾病进行分类。其结果由后面`S＋1`个规则推理分类器`g
    i`作二次分类确认，特征识别函数分别为`h l`，`h k`，它们各自依赖于对`L`个普通数字特征和`M`个形态特征的识别，其中`M`个形态特征的识别可利用阈值、模板匹配、支持向量机和深层神经网络等方法完成。设心电图数据集`X＝｛x∈R
    d｝`，每条心电图记录经分类器最后都会归入某一类：


    ![](img/txt005_30.jpg "pagenumber_ebook=110,pagenumber_book=102")


    共有`S`类疾病，再包括正常情况，分类结果有`S＋1`种，其中`Cla0`表示正常类，`Cla i∈｛1，…，S｝`表示异常类。


    我们的研究思路就如康德描述的：“……一个简单的知觉表象就已经包含了杂多感觉的会集和统一……这也就是说，从人们感觉一开始，就有一种统一性于其中，把杂多的感觉表象联结起来，否则这些杂多就只能永远是孤立的、零碎的、乱七八糟的感觉。这种联合综合杂多的统一性，并不是被动接受的感觉本身所能具有，而必须有心灵的主动综合作用才行。这就是所谓‘直观中把握的综合’”［35］。


    ## 4.7　训练样本


    在人工智能的算法研究中，“训练”或“学习”与“测试”或“预测”是两个关联的计算环节，前者指给依赖数据结构的算法以一定数量的数据输入，通过改变其中的参数使之获得某种约束下的“最优”输出性能，而后者是用另外一些数据来检验输出性能的可靠性和适用性。数据规模不同，即意味着需要识别的模式的具体情形的可能不同，数据越多，情形也多，情况也就更为复杂，有些甚至是前所未有的。也就是说，数据规模的扩大增加了可能的未知对象，就如生活在原始部落的人面对现代社会会束手无策、不知所措那样，而身经百战的将军才有可能把握战争的主动权。人的成长就是个逐步学习的过程，尤其是专门领域的能力非一下子的“训练”可获得。另一方面，所用的“训练”数据的量的多少可大异其趣。人因“见多”而“识广”，“训练”数据若不足或者过少，期望模拟人的思维过程的算法面对更多实际数据时同样有效，则有点像是想“一口吃成胖子”，这里难以“四两拨千斤”。


    为克服常用标准数据库诸如`MIT-BIH-AR`、`AHA`、`ESC`、`NST`、`CU`等在代表性方面的不足和限制，满足可实时追加新数据用于训练的要求，我们专门构建了中国心血管疾病数据库`CCDD`［36］（`http://www.ecgdb.com`），并开发了相应的如图
    4-11 所示的标注工具，协助专家手工标注，目前已有代表性强的近 20 万条心电图记录公开可用。尽管在数据库和算法两方面都增加了工作量，而“工欲善其事，必先利其器”。该工具同时可以引导专家发现数据中的问题或进行诊断规则优化，以免对后续工作造成误导。也就是说，据此也可以发现隐性知识。


    在以往的研究中，比如图像处理，由于数据量大，往往通过抽样以获得所谓的“样本”，又会用“插值”的方法拟合以恢复原貌。由于视觉感知在精确性方面的差异和容错的特性，即使有所偏差也能接受，或者说不至于会导致不一样的结果，比如摄影。然而，很多其他问题，比如预测、诊断，只有有了较为完整或更具代表性的数据集，才可以从全面的角度和不同的层面观察数据、分析数据、借鉴数据和利用数据。“混沌”效应可导致“差之毫厘，失之千里”，而经验的不足必然导致结论的肤浅、偏差。这里需要量与代表性之间的平衡，太多就有冗余，是不必要的。在能够保障结果可靠的情况下，数据尽量少就可以减少投入代价，难处在于不易找到“折衷”。如同有不少书籍资料，“大全”“全集”等对于已有单行本者显然有重复之处，它们既占空间又不便查询，但单行本本身缺乏全面性和完整性。按需选择是一种可选途径，不然，为了可靠、便利只能将“全集”备上。


    ![](img/txt005_31.jpg "pagenumber_ebook=112,pagenumber_book=104")


    图 4-11　标注工具软件界面


    ## 4.8　数据规模


    这些年来家喻户晓的“大数据”［37］一词原本用于经典的天文学，也源于基因组学，“大”“小”界限似乎尚不分明。“大数据”提出的原因，应该是信息化时代存在大量数据，生活面临丰富数据，现实世界被数据“包围了”，人们认为其中潜伏着、蕴含着多方面的、复杂的有益信息和相关关系。而我们已有的技术，对大数据以前的数据不见得都已很好“适应”。“大数据”依然将用概率说话，但不青睐用随机分析方法而采用所有数据，可能要牺牲精确性，所以依然未必能“确凿无疑”地下结论。


    “大数据”应有如下特点。第一，规模。至少与此前所能处理的数据不在一个量级而是要大得多，以致需要新的思路和方法，平行处理、“超算”在理论上在此可用，即便如此，要真正解决问题，需要有针对性的算法和数据组织。第二，分布。数据来自不同之源，这并非说同一地方绝不可能产生如此多的数据，而是指事实上的社会现实如此。第三，类别。异构被认为是“大数据”的一个特征，不过，非异构但规模大的数据同样棘手。比如中国的心血管系统疾病病人数已达
    3.3 亿，仅这一类数据就蕴含十分丰富的病症信息，目前没有统一的数据库存放这些数据。如果某天采集到了足够丰富的数据，可以先按照区域、年龄、性别、正常与否、设备来源等作不同的预分类，一方面是借助人的经验降低复杂性，另一方面也可缩小数据规模——单从计算的角度看，这两者越简单则越容易处理，其结果也越可靠。当然，适当忽略微观层面上的精确度会让我们在宏观层面上拥有更好的洞察力。


    科学技术本身的进步、发展过程一定程度上有助于我们对大数据这类说法的把握，那无外乎逐步渐进、曲折迂回和突飞跨越几种形式，无论哪种形式，都是对过去的超越和向未来的拥抱。这种过程，可以序数而记，比如
    18 世纪后半叶，以蒸汽机为代表的第一次工业革命，19 世纪 70 年代后以进入电气时代为标志的第二次工业革命，20 世纪四五十年代以电子计算机、原子能等的应用为标志的第三次科技革命，以及“工业
    4.0”等。另一方面，人们往往会自然而然地用一些形容词来表述崭新的阶段。有次在途中翻看所带的十多年前浏览过的《世纪老人的话：王大珩卷》。关于“863”计划的新阶段，宋健院士曾考虑冠以超“863
    计划”，20 世纪 90 年代曾听当时已调任中国科学院院长的浙大前校长路甬祥院士作报告时讲起：若用“超级”字眼，以后阶段不好办，因此用“第二阶段”之说。宋健先生是经验丰富的科技和管理前辈，也有“短视”之处。事情回头看总是更清晰，具备历史眼光则难一些。这几年，省部级奖冒出诸多“特等”，后来，学科评估结果有不少是“优异”，再下去不知用什么词。刚设“最高奖”时，笔者想，以后若又嫌不够，用什么说法为好。


    “大数据”与人工神经网络的新阶段“深度学习”均有类似的嫌疑。“深度学习”实际上指深层人工神经网络，是机器学习的一种方式，而“深层”本来只是相对以前的浅层网络而言的一种方法。机器学习还包括统计学习等，更不可与人工智能画等号。


    虽然如此，“大数据”“深度学习”与诸如“物联网”“云计算”等的状况是不同的。“物联网”可能是“新瓶装旧酒”，至多是具体化了互联网的应用含义，“云计算”则“言词生动”而实质已有其形在先。“大数据”则意味着量变会导致质变——如果没有质变，则没有必要区分大小。至于“深度学习”是由视觉系统的神经机制而来的对传统神经网络的超越——虽然人工神经网络从没有说过不能有多层，只是“深层”的建模很困难。人工智能宏观上指功能，微观上便是结构。


    大数据至今已“热”十多年，由此的新机构、新任务、新判断层出不穷，然而有几个当年不会想到的问题，第一，具有大数据的行业，比如医疗，数据基本还是“孤岛”；第二，本来就是大数据的场合，比如互联网数据的利用和分析技术的进步，并非有了大数据概念所致，而电网的数据确实大，但其规律性较为明确，可控性尚好，“大数据”尚乏特别用武之地；非常多的所谓“大数据”应用，其实数据规模颇有限。由此令人反思：是否需要那么多新说法吗？长期看，它们的引领或整合作用怎样、一哄而上导致的无用功甚至浪费有多大？


    《红楼梦》有诸多“公案”，最普遍的是，主题是什么？鲁迅曾说：因读者的不同的眼光，《红楼梦》于经学家看见《易》，道学家看见淫，才子看见缠绵，革命家看见排满，流言家看见宫闱秘事……20
    世纪就有人利用计算机研究《红楼梦》，比如对一些名词作统计，是否有一些根本性的突破不得而知。人物众多、结构复杂，其中的“数据”量颇大，“大数据”提出前《红楼梦》早已就是“显学”，该如何处理？没有人设计的策略，没有人的协同，恐怕寸步难行。人该怎样参与、如何协同？机器是否能得出这样的结论？“大数据”是否可有超越？据说《四库全书》有约
    8 亿字，数量“大”，不过对其检索、分析在“大数据”出现前就能做到。


    再比如探索宇宙分为航空、航天、航宇等阶段，航天是围着地球转，航空是脱离地球引力到地球以外的太阳系“遨游”，航宇则是到太阳系以外寻找“文明世界”。地球生命诞生前，宇宙早就存在，可人类得先弄清楚太阳系是怎么一回事。宇宙有数不清的类似“银河系”一样的恒星系统，我们的探索未必现在就一定要涉足“银河系”以外，除了人类的能力有限外，我们对置身其中的“银河系”有太多未知，它与其他星系也许有许多共性，我们先把“银河系”研究透了才推而广之并琢磨新问题是否为时不晚？


    研究“大数据”的目的，是寻找背后特点、其中规律和相互关联，人具有透过现象看本质、宏观把握和分析关系的能力，当超过一定的复杂程度后，我们希望机器提供帮助。所谓数据挖掘、机器学习便被赋予如此重任。我们知道，仅能“计算”不够——现在的计算机的计算能力已够强，不足的是直觉、整体把握。无论出现什么样的新名词或新说法，宜谨慎地寄予厚望，耐心地等待结论。


