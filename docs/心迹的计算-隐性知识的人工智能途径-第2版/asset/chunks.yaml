- raw: "[\\[2\\]](#att001.html#footnote_quote_att001_2)学数学出身又有20年宝钢一线研发经验的郭朝晖首席研究员的著作《知行：工业基因的数字化演进》（2023年机械工业出版社出版）于工程思想、工程方法、工程观念有切实、深入和独到的分析、交流与总结。\n\
    \n[\\[3\\]](#att001.html#footnote_quote_att001_3)在本书第一版的附录中，列有“过程性知识和描述性知识”一节（侯世达.哥德尔\
    \ 艾舍尔 巴赫——集异璧之大成.郭维德，等译.北京：商务印书馆，1996：474～476）。\n\n[\\[4\\]](#att001.html#footnote_quote_att001_4)董军.学历史\
    \ 思教育——教育的反思与历史的回响.杭州：浙江大学出版社，2010.\n\n[\\[5\\]](#att001.html#footnote_quote_att001_5)董军.计算机书法引论.北京：科学出版社，2007.\n\
    \n[\\[6\\]](#att001.html#footnote_quote_att001_6)拙著交稿那天上班途中，笔者想到祝嘉章草条幅“路漫漫其修远兮，吾将上下而求索”，字佳且形式也特别，是单行，于是将其作为上联凑下联，并发给两位亲友。下午尹兄问集联具体怎么做、如何摘取字句、对仗如何讲究。此处三点乃晚上回家途中笔者的回复，但觉得他不会满意，有些本来即明，有些或许如隔靴搔痒。若有一定实践，可言说和没能言说的或许都能逐步理解，此亦隐性知识。\n\
    \n[\\[7\\]](#att001.html#footnote_quote_att001_7)据许广平的《鲁迅回忆录》，鲁迅曾有计划写《中国字体变迁史》。\n\
    \n[\\[8\\]](#att001.html#footnote_quote_att001_8)《祝嘉书学论著全集》一书有些遗憾：第一，编校：除标点、文字之误外，有的文字与相应图不在同页，又缺说明文字（如见图几），书作、文字有重复；“嘉按”形式未统一，诸如《石门》《石门颂》之类并存。第二，审读：比如《兰亭序》“之”有时二十有时二十一个，不一致；《十七帖》《书谱》为狂草、鲁迅书法为草书之说不妥，而“武汉碑林”宜为“黄鹤楼碑林”、《古柏行》非颜作。第三，内容：不少篇幅是前人文字，诗词、书信等与书法无关内容似宜入附录；对所有著作有个脉络梳理和结构分类为好，指出哪些有重叠、什么是重点、何处不可缺（代表性）。或许有一本《选集》更好。\n\
    \n[\\[9\\]](#att001.html#footnote_quote_att001_9)比如，写字贵在气贯，气满则茂密，气与笔力惊绝相关，同时还需要生龙活虎，不出于法度之外而千变万化，最后弃其形而存其神，臻于天然；要努力无笔不断，方笔字圆写，圆笔字方写，即便瘦也要有血、瘦而不薄；艺术可以表现性格、修养，没有俗气自然有清超气；写楷书若不知草法字不会生动，反之不能沉着，草书要飞舞、灵活而最忌直滑；学要博，上不知源、下不逐流则写不好字，成熟之后可以创造但不能太好奇、失于怪。\n\
    \n[\\[10\\]](#att001.html#footnote_quote_att001_10)笔者曾买过金岳霖的《知识论》，因专家系统也谈知识。《知识论》所谈的知识与作为工程技术的“知识工程”不在同一层面，笔者未能下决心阅读，后来将其给了一位哲学专业的研究生。有一次听金先生的另一弟子冯契先生的一位再传弟子、哲学教授云，其导师有一两万册书（具体是几万没记得），笔者说那是藏书，读的书没那么多吧。即使将参考、临时有用才翻阅的书包含在读的书中算上，估计还有不少是于其没有用或长期未读的。人的经验也类似，许多其实没用，笔者感兴趣的是在专业领域派上用场的经验。\n\
    \n[\\[11\\]](#att001.html#footnote_quote_att001_11)顾准.顾准文集.上海：华东师范大学出版社，2014：163.\n\
    \n\uFEFF\n\n后记\n\n![](images/att002_1.jpg \"pagenumber_ebook=240,pagenumber_book=232\"\
    )\n\n智弗出童子，能有入庶民\n\n集《毛公鼎》字\n\n笔者自觉人工智能乃发自内心之专业兴趣，隐性知识学习则是其中有所感悟与体验者，近些年里略有新思，尽管于人工智能成果带来的宽广应用可能言，微不足道，无非是读书50余年，学习人工智能30多年，从事其与传统文化和医疗健康的交叉工作超过20年，旁及工程思维、书法模拟、中医证验和教学理念的些许认识与反思，似可另出一小册子。\n\
    \n2023年晚秋，笔者到病房看望家父后，等公交车时一位不相识的同行赐读拙著后联系、交流，联想到同样突然看到的不相识的阅读者、母校学友、拟报考学生等的感受反馈，颇觉鼓励与鞭策，即询问包惠芳编辑是否出第二版。记得第一版因勒口可有可无一字曾与包编辑言及，她客气地表示等再版改过，笔者当时没想“有再”，这么多年更未念及，问前也无记当年情形。不久包编辑回复并发来“书稿列选单”，感谢她的鼓励与支持，同时感谢中国科学院苏州纳米技术与纳米仿生研究所的自由学术氛围与交叉研究环境。\n\
    \n拙著第一版承蒙上海科学技术出版社原社长毛文涛博士抬爱，学物理出生并任上海世纪出版集团副总裁多年的他于大语言模型给出版业带来的机会与挑战所见不凡。中国大量机构此间纷纷部署大语言模型研发与应用工作，多类似于在既有基础软件系统上的“二次”开发，其中不乏重复，由以往情状大致可知。\n\
    \n其实笔者也有相仿误识。原以为将新内容插入一版各处并注意衔接即可。复览旧文，不如意者众，扩充、增加的同时是删除与改写，“剪除”业已出版内容不易，只是“生命力”已过，于读者、于己不得已如此。同时，不乏新产生的段落，既丰富了表达，又强化了观念。以文字计，除去所删，本版新增约占所保留内容的35%。著作以文字、思想、成就论，笔者只能力求表达规范，呈现自己的想法，于成就则颇惭愧。一版中讹漏处对读者可能的影响令笔者深感不安。\n\
    \n有言“人贵饱学，文贵简练”。笔者无学富五车之识，又非思如泉涌之器，腹下空空，脑中贫贫，何言“删繁就简三秋树，领异标新二月花”。曾有拙著编辑建议增加篇幅，笔者意必要引用之外毋庸敷述。杨振宁先生曾言在60岁时感到生命是有限的，笔者乃布衣，具此念比杨先生早而更会珍惜与同仁交流的机会，尽管是出版物中沧海一粟，恳望同仁批评、苔岑切磋、方家指谬。\n\
    \n一版出版后有前辈通话勉励并提及，没（请人）写序？笔者那会没想过再出此类书籍。回答则是写序的前提是读完拙稿，因此那事首先意味着让别人看其本来未必愿意看的内容，若假设其没时间而提供草稿，序作者然后根据自己观点修改未尝不可，可是失了序的本意。此为陋见，笔者读他人著作，序是习惯首先浏览的内容之一，彼处时见精辟评论和生动介绍，乃阅读之果也是书作者之幸。笔者也曾写过几次出版物推荐语，前提是完整习览。至于史学大家顾颉刚的《走在历史的路上——顾颉刚自述》原本是其著作之“序”而独立成书则另当别论。\n\
    \n拙著第一版出版后的一个午间，笔者揣先收到的样书（扉页上有“献给年届米寿的双亲”字样）从办公室到父母所住病房，老人已休息，于是给坐着准备外出的姐姐（我们就姐弟俩），未料当年暑期，姐姐因诸病并发（其实当时就有不适感）、不治离世，四年多后，不时念叨姐姐、卧床两年多不能活动的母亲驾鹤西去，那是笔者一生中最大的心灵震撼和情感撞击，尽管没有因此在任何人面前流过泪。忆起母亲的宽善朴厚和诚挚爱执、与姐姐相处的难忘岁月，笔者常悔己话语不多又耐心不够，无奈之至，只能怀着永久的感念与忏愧走向终点，还能再会与诉说不？辛弃疾有偶题《七绝》诗：“人生忧患始于名，旦喜无闻过此生。却得少年耽酒力，读书学剑两无成。”岁月蹉跎、逝者如斯，去日苦多、无可告慰，谨以拙著献给母亲和姐姐在天之灵。\n\
    \n2024年1月9日\n\n于中国科学院苏州纳米技术与纳米仿生研究所"
