    相邻的卷积层和取样层统称为卷积单元。卷积层和取样层中的局部窗宽分别称为卷积核和取样核，而卷积层中的局部间隔在实际应用中一般设为 1。


    ### （3）全连接层

    全连接层一般在 2～3 个卷积单元之后，该层就是传统意义上的多层感知器。若有 5 个输入神经元，2 个输出神经元，则 5 个输入神经元分别与 2 个输出神经元全连接。


    若设`w i,j`为“第 i 个输入神经元”和“第 j 个输出神经元”的连接权值，`b j`为“第 j 个输出神经元”的偏置值，![](img/att001_38.jpg
    "pagenumber_ebook=194,pagenumber_book=186")为“第 i 个输入神经元”的值，![](img/att001_39.jpg
    "pagenumber_ebook=194,pagenumber_book=186")为“第 j 个输出神经元”的值，`f(·)`为激励函数，则有：


    ![](img/att001_40.jpg "pagenumber_ebook=194,pagenumber_book=186")


    ### （4）分类层

    分类层本质上也是全连接层，但除了通常意义上的计算外，还要计算神经网络输出和期望输出之间的误差。目前，主要有“概率输出”和“均方误差”两种，前者的一种具体形式（`Softmax`回归）如下。


    这种方法首先计算某个样本属于每个类别的概率，然后取概率最大值所对应的类别。设![](img/att001_41.jpg "pagenumber_ebook=194,pagenumber_book=186")为连接“5
    个输入神经元”和“2 个输出类别神经元”的权值和偏置，`P(y=j|x)`表示样本 x 属于类别 j 的概率，`y_pred`表示预测类别，则有：


    ![](img/att001_42.jpg "pagenumber_ebook=194,pagenumber_book=186")


    多类别的概率计算可作类似处理，仅需将 2 换成指定的类别数即可。


    此时的神经网络损失函数`E`可用经典的最大似然函数定义，由于网络训练以最小化损失函数为目标，所以可采用负的最大似然函数值，定义如下：


    ![](img/att001_43.jpg "pagenumber_ebook=195,pagenumber_book=187")


    卷积神经网络的最大特点是输入数据先通过多个卷积单元后再交由传统的多层感知器进行分类，而卷积单元的结构特点是每一个特征提取层（卷积层）都紧跟着一个二次提取的计算层（取样层），这种特有的两次特征提取结构使得分类模型具有较高的畸变容忍能力：一方面，通过卷积核（可看作是滤波器）在输入信号上游走，在对应位置上做卷积运算，不仅增强了原信号特征，还降低了噪声；另一方面，通过取样核对不同位置的特征进行聚合统计（可看作是一个模糊滤波器），不仅减少了特征的维数，还对位置信息而言增加了鲁棒性。


    此外，神经网络的训练本质上是一个函数优化问题，如前所述反向传播算法基于梯度下降法而设计，是典型的局部搜索算法。显然，在相同的条件下，待优化的权值数越多就越容易陷入局部极值，使得要拟合出真实的决策函数更为困难，这也是深层神经网络此前一直未予深入探索的一个原因。而对于网络结构较为简单的模型，由于待优化的权值数相对要少，其陷入局部极值的可能性也就小些，但不够复杂的网络结构的非线性函数拟合能力有限，在复杂的模式识别领域不能拟合出真实的决策函数。卷积神经网络通过权值共享和取样巧妙地在两者之间做平衡，通过多个卷积单元可使网络结构变得足够复杂而拟合不同的非线性函数，同时待优化的权值数并不会剧烈增长，有利于拟合真实的决策函数。


    ### 1.4.3 二维结构

    通常意义上的卷积神经网络指二维结构，与一维结构的区别在于卷积单元的组织方式不同，而全连接层和分类层则完全一样。多维卷积单元的每维实际上也是按照一维卷积单元组织。


    设二维输入数据为 3×5，第 1 行为（1，1）……（1，5），第二行为（2，1）……（2，5），第 3 行为（3，1）……（3，5）。卷积层的行局部窗宽尺寸`RWindow=2`，列局部窗宽尺寸`CWindow=3`，行局部间隔尺寸`RInterval=1`，列局部间隔尺寸`CInterval=1`，则经过卷积操作后，每个新特征面为
    2×3，其中`2=(3-2)/1+1`，`3=(5-3)/1+1`，每个新特征面对应待调整权值数为`7=3×2+1`（`RWindow×CWindow+1`）。若输入／输出特征面都不止
    1 个，则该卷积层待优化的权值个数为：`（i Map×RWindow×CWindow+1）×o Map`。


    二维结构的卷积层以“局部矩形区域”为最小单元进行权值连接。以`（i,j）`表示第 i 行第 j 列所对应的数据点。输入数据点（1，1）、（1，2）、（1，3）、（2，1）、（2，2）、（2，3）均连接到特征面
    1 上的数据点（1，1），输入数据点（1，2）、（1，3）、（1，4）、（2，2）、（2，3）、（2，4）均连接到特征面 1 上的数据点（1，2），输入数据点（2，1）、（2，2）、（2，3）、（3，1）、（3，2）、（3，3）均连接到特征面
    1 上的数据点（2，1）；其余类似。


    二维结构的取样层同样以“局部矩形区域”进行权值连接，但不交叉，每个特征面对应一个取样层。若取样层的行局部窗宽尺寸`RWindow=2`，列局部窗宽尺寸`CWindow=2`，则特征面
    1 上的数据点（1，1）、（1，2）、（2，1）、（2，2）均连接到取样层 1 上的数据点（1，1），特征面 1 上的数据点（1，3）、（2，3）则均连接到取样层
    1 数据点（1，2）；其余类似。


    二维结构的卷积层和取样层的实现，同样是基于线性排序的神经元，只不过其连接方式和一维结构是不同的。


    ### 1.4.4 网络训练

    卷积神经网络一般也采用反向传播算法，基于梯度下降法调整各层的权值，使损失函数达到最小，其过程如下。


    设![](img/att001_44.jpg "pagenumber_ebook=196,pagenumber_book=188")表示第 n 层第 i 个神经元的输出值（输入层和输出层分别用![](img/att001_45.jpg
    "pagenumber_ebook=196,pagenumber_book=188")和![](img/att001_46.jpg "pagenumber_ebook=196,pagenumber_book=188")表示），![](img/att001_47.jpg
    "pagenumber_ebook=196,pagenumber_book=188")表示连接第 n 层第 i 个神经元与第 n－1 层第 j 个神经元的权值，`T
    i`表示输出层第 i 个神经元的期望输出，`f(·)`表示激励函数，`E`表示损失函数，则给定一个训练样本，根据当前网络权值，从输入层开始，依次迭代下式可求得每层每个神经元的输出值。


    ![](img/att001_48.jpg "pagenumber_ebook=196,pagenumber_book=188")


    以均方误差为例，网络损失函数为：


