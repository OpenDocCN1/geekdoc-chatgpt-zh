    ## 4 心脉图谱见微知著


    ![](images/txt005_1.jpg "pagenumber_ebook=88,pagenumber_book=80")


    来（甲骨文）［1］


    医生在诊断一个病例时所涉及的乃是个别的事情，依靠的是所备有的关于生理学等方面的一般原理。如果没有这些，他是不能进行工作的。不过他并不企图把这个病例归结成为某一些生理学和病理学法则的确切例证。他是在利用这些一般性的陈述，帮助指导他去观察这个特殊的事例［2］。


    ——杜威（J.Dewey）


    浅学曾念知行易，静思方明模拟艰。


    书本上的医疗诊断规则有的概略，有的笼统，因而可设问如此诊断是否恰当表征了人类的认识：那是宏观把握与细节观察的交替，也是基本而又典型的抽象思维与形象思维结合过程，技术上仅靠推理或学习都不够，需要它们的互补机制；不但要重视数值特征，还需分析形态参数，然而其刻画颇为不易，有赖于借助不同的间接手段；只有充分把握医生经验，得到不同的隐性知识向显性知识转化方法，才能恰当地映像诊断思维。


    ### 4.1 临床需求


    简略而言，心电（心脏电生理活动信号）的可视化就是心电图，心电图是心律失常等常见心脏疾病的基本检查指标，其上的每个微小变化都可能表征了某种疾病，快速、便捷地为百姓提供相应的监护或诊断服务是技术工作者的任务。快速是指尽量实时地获得检查结果并给予建议，有的心血管疾病发病急骤，允许的抢救时间有限；便捷是指检查方便，最好在基层甚至家中就能进行。这两者在传统意义下有一定的矛盾，而信息化、网络化、便携化、移动化、智能化技术可望解决问题，面向基层常见心血管疾病监护与诊断的服务系统如图4-1所示：体征信号（如心电图、脉象）通过网络传输到“云端”，接着获得诊断结果，从而把好医生“移”到身边，让好服务“沉”向基层，实现无论何时何地可监护甚至会诊服务。


    ![](images/txt005_2.jpg "pagenumber_ebook=90,pagenumber_book=82")


    图4-1　心血管疾病监护云平台ABC-DE


    ①体征采集^([\[1\]](#txt005.html#footnote_content_txt005_1))，②机器分析，③专家交互，④数据存储


    其中，计算机辅助诊断方法有着迫切的现实需求和广泛的应用前景。诊断作为与健康分析、疾病治疗密切相关的判断病情、确定症状的关键环节，与预防、康复、体检、监护平行不悖地发生作用，并已日益渗透到百姓的生活当中。从家庭日常的量血压、测血糖，到体检中的心电图采集、胸片拍摄，以至于医院里磁共振、计算机断层扫描成像，都是筛查疾病的基本手段，这种情景自然而然地呈现了广义的计算机辅助诊断的作用，因其不同程度、或多或少地依赖了计算过程和计算机技术：有的是较为简单的微处理器，有的则是性能良好的专用计算机。计算机辅助医疗诊断是医生利用计算机提供的信息或处理结果进行疾病诊断而不仅仅是信息采集。这里有两个层面的基本内涵。


    第一，这是医生的诊断过程，但不是诸如中医那样仅靠“望、闻、问、切”就能辩证识症、开方出药，而是要借助甚至依赖专门的计算设备获得初步信息才得以进行。众所周知，现代中医往往也离不开基本的医疗检测设备。


    第二，这是借助专用设备对某些生命体征或生理图像进行了特定处理以后的诊断过程，通常不是全部交由计算机作分析，这不仅指检测设备的安放、启动要由人来做，而且基本结论（至少疑难杂症）还得由医生下^([\[2\]](#txt005.html#footnote_content_txt005_2))。


    就如关于计算机，乔布斯表示［3］：“其创意目的并不是赞美计算机可以做什么，而是赞美富有创造力的人们在计算机辅助下可以做什么。”人的作用始终不可或缺。


    计算机辅助心电图分析工作通常包括数据预处理，特征选择、识别与提取，症状分类三个环节。第一个环节要滤除或降低噪声（无用信号），加强或突出有效信号的特征；第三个环节是根据特征（第二个环节）得到分类结果，有赖于前两个环节，尤其是第二个环节。有时候第二、第三个环节因互相耦合而不予区分，有时候直接将心电图记录作为输入，其输出就是最后结果。图4-2是心电图波形及其特征示意，有两个心动周期（或心搏），包括特征幅度、间期、斜率、形态以及平均趋势等，它们本身及其特征的组合就构成了一种种疾病的判断依据，正常心电图自然也由一组特征组合表示。医生在诊断过程中关注特征、特征间的关系及综合结果。每个心搏的QRS波群或主波即R波识别是心电图分析的基础。临床上完整的心电图包含12个导联的信息，为此，要从宏观到微观分层对待整体特征而不仅是单个导联或某个心搏的特征。


    ![](images/txt005_3.jpg "pagenumber_ebook=91,pagenumber_book=83")


    图4-2　心电图特征示意［4］


    数十年来，利用从逻辑推理到知识工程、从决策树到模板匹配、从支持向量机到深层神经网络等，包括傅立叶变换、高斯模型、隐马尔科夫模型、主成分分析、独立成分分析、小波分析、线性判别分析等特征提取方法，计算机辅助心电图分析工作有丰富的阶段性成果［5，6］。其准确性都超过了90%，有的甚至高达99%以上。然而，面对实际的临床数据，性能急剧下降。基本原因如下。


    第一，测试数据规模很有限，比如标准数据库MIT-BIH-AR（MITBIH Arrhyth mia）［7］。该数据集虽然能够提取出10万多个心搏，但仅来自47个病人的48条记录，每条心电图记录均由2个导联的数据组成，时长约30分钟，且并非所有导联都相同，仅有40条记录均有Ⅱ导联和Ⅵ导联数据。此等数据库上的测试降低了问题的复杂度。


    第二，它们是病人内的数据分类，其特点是训练集和测试集包含同一个病人的不同时刻的心搏，而病人间数据分类用的训练集和测试集的心搏所属个体没有交集。基于AAMI标准［8］和MIT-BIH-AR构造由来自不同记录的心搏所组成的训练集和测试集的工作［9］，一定程度上考虑了个体间的差异，此时算法性能下降明显。


    第三，忽视临床要求。有研究［10］针对心电图的两个导联的数据分别构建分类器，然后通过贝叶斯方法进行融合、选择而增强可信性，在MIT-BIHAR上效果同样很好。但这样的做法有两个显然的问题，一是不同导联的不同特征有不同的疾病表征意义而不能互相替代；二是临床诊断依赖于全导联，而不仅仅是两导联信息。


    《IEEE生物医学工程汇刊》过去一个月下载次数最多的论文中一度不止一次是心电图R波检测方法［11，12］。该刊新近发表的研究工作中的心电图分类方法［13］在MIT-BIH-AR数据库上的准确率为99.81%，而我们提出的方法［14］取得了当时最高准确率99.86%。然而，这种提高在临床上意义不大。


    我们的根本任务是实现模拟领域专家思维过程的计算机（网络）环境，完成原来完全依靠有经验医生的诊断工作，而非仅仅在标准数据库有限数据集上得到好的结果。有人觉得这不必强调，事实上，对于复杂的思维过程，教科书上可参考的规则与例子往往不见诸多细节和微妙之处。因此应当特别关注专家思维过程中尚未表述或难以表达的内容，即隐性知识，这可导致算法性能的差异。


    我们在过去20多年的计算机辅助心电图分析的研究与应用过程中，在逐步满足实际需求的同时，形成了包括医学经验中隐性知识学习、形态特征识别、在训练集和测试集中区分病人个体数据和病人间数据、构建开放数据集以及设计针对不同特征的分类器的方法，进而达到模拟领域专家思维过程的目的。

