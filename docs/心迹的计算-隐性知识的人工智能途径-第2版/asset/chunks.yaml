    # 6 科技艺术若即若离


    ![](img/txt007_1.jpg "pagenumber_ebook=146,pagenumber_book=138")


    ### 念䇹


    竹神萧萧问秋风，君影茫茫去何处。


    政 九六年十一月廿九日清晨［1］


    艺术家若对何为美缺乏完整认识，作品多乏味。艺术家若对何为善缺乏完整认识，作品多粗俗。


    在科学领域（还有文科和社会科学），不信仰追求真理的理想，学者的成就也多不实。


    乏味，粗俗、浅陋或不实的科学艺术成果是短暂的。


    ——默里（C.Maree）［2］


    脑海波澜指下韵，心潮气象眼中形。


    科学技术^([\[1\]](#txt007.html#footnote_content_txt007_1))、文学艺术是思维结晶和知识殿堂，反映了人们的认识与追求，透射出人类的思想光芒与精神境界，推动着世界发展和文明进步。当今社会在经济迅速发展的同时对科技进步的依赖日益加重，而科技不时被扭曲，甚至也变得“艺术化”了；艺术则在依托科技带来的便利和支撑的同时，始终有其本身的道路与轨迹，科技与艺术各走“阳关道”大显神通，又如孪生姐妹互相依存，可谓若即若离而互相欣赏，一起引领了生龙活虎、色彩斑斓的现实生活和未来走向。


    ## 6.1 真谛美感


    随着经济的发展、观念的改变，越来越多的人会在室内放置一些艺术品，墙上挂一些字画，有的是出于装饰居处、点缀环境的目的，有的则借以抒发情怀、衬托气氛，这往往以真为佳、以名人字画为上。不过，真的不一定比复制品质量高，要看是怎样水准的真迹，何况现在的复制技术已可“乱真”，而很多摄影作品非常精彩，然而它们皆为复制品；所谓名人之作也良莠不齐，即便是大家之作，品质差别也很大，精品不会多。自然，在赝品泛滥的社会里，真假无疑是人们首要关心的，谁也不能否认一流精品原作的震撼力。但就学习或欣赏而言，名作印刷品比普通的原作更有价值。


    笔者心目中，很多年来不断浮现、心驰神往的是茫茫宇宙中浩瀚星空的广袤和宁静，使人思接千载、想象无边的画面，可谓“精骛八极、心游万仞”，尽管有的只是星星点点。书店未见尺幅合意的印刷品。为何仅仅是印刷品会如此长久地萦绕脑海？这大概就是科学与艺术本身的魅力和其间的张力。首先，这是远大又真实的图景；其次，这里有多学科的汇聚：天文学是历史悠久的科学，宇宙望远镜是非凡的技术，屈原的《天问》表达了人类共同的好奇心与不懈思索，与星球自然的位置、变化的色彩、无边的纵深感交织在一起构成了生动美丽的画面，恰是科学与艺术的和谐之处，为善，也为美，画面就是真、善、美的统一。从思维出发看有如下情形。


    第一，人类的本质追求和共同价值取向，是探索未知、发现真理、弘扬理性、抒发感情、欣赏美感、追求幸福，此时，科学和艺术分别是依托手段与载体，它们承载的是自然的规律与历史、人类的智慧和生活，两者本一体，互相脱不了、离不开。思维是基本机制，艺术不全是形象思维，而科学同样需要有形象思维，它们是一体两面，互相影响。


    第二，从所体现的特征和反映的本质看，科学和艺术不是互相对立、互相排斥，而是互相补充、互相支撑的。比如，物理定律往往给人以简洁、抽象之美，利用人造的显微镜等设备获得的图案常常是那样神奇、美妙；而绘画作品可以将深奥的理论生动、直观地展现在人们眼前，它们有时候借助对方可以更好地阐述自身。


    第三，作为数学的一个分支的分形几何以不规则几何形态为研究对象，自然界诸多物理现象，比如海岸线，从局部到整体有其自相似性，从而带给人们独特的美感和联想，如图
    6-1。分形现象将科学与艺术的研究对象和效果“合二为一”了，而发现这个美好现象、这个天然的艺术杰作的，是科学的思维方式与探索精神。


    科学大家中具备良好的人文素养者不在少数，表面上看可能是出于兴趣与自然而然的熏陶，实质上应该有科学与艺术相通的内在机因。爱因斯坦终生的科学活动与音乐为伴，感悟历久弥新。钱学森从小于文艺耳濡目染，科研成就受艺术启发良多。李政道先生则以其杰出成就，敏锐地捕捉着艺术与科学的关系。音乐、文艺、绘画本质上也都是一种“心迹”。


    ![](img/txt007_2.jpg "pagenumber_ebook=149,pagenumber_book=141")


    图 6-1　海岸线分形图［3］


    ## 6.2 坦言音乐


    爱因斯坦说：“当这个世界不再能满足我们的愿望，当我们以自由人的身份对这个世界进行探索和观察的时候，我们就进入了艺术和科学的领域。如果用逻辑的语言来描述所见所闻的身心感受，那么我们所从事的就是科学。如果传达给我们的印象所假借的方式不能为理智所接受，而只能为直觉所领悟，那么我们所从事的便是艺术。这两者有一个共同之处，那就是对于超越个人利害关系和意志的事物的热爱和献身精神。”［4］


    爱因斯坦童年时，在母亲的指点下，先学小提琴，再练钢琴，这要早于其物理学之路，两个看似无关的领域被爱因斯坦“合于一体”，说明它们不仅不矛盾，而是可以长久共处的。世界从爱因斯坦的视角，感性地看，是由音符组成的，理性地看，是由公式表达的，两者都不可或缺，宇宙和音乐是相通的。本来自然界就存在着一种“天体音乐”，带有浑然天成的和谐和令人叫绝的对称，比如“相对论”等自然法则，它们一直存在于宇宙当中［5］。爱因斯坦对音乐有独到的理解，而音乐助其在科研中获得灵感，甚至使其由此感知了世界的本质音符。至于爱因斯坦的演奏是专业级别还是业余水平的并不重要，也许有人会感叹其演奏技艺，并问为何他不去当音乐家，这或许天真，或许狭隘了。人在专业以外另有兴趣爱好可使人生更为丰富多彩。达尔文在自传里懊恼他一生专在科学上做功夫，没有把他年轻时对于诗、画和音乐的兴趣保持住，到老来想用诗和音乐来调剂生活的枯燥，就抓不住年轻时的兴趣，觉得索然无味［6］。


    爱因斯坦喜欢巴赫、莫扎特、舒伯特、亨德尔的音乐。巴赫的深邃令他忘我陶醉，他说对巴赫的音乐只要爱她、听她、欣赏她，而不要去说她！莫扎特的明快使他轻松愉悦；舒伯特表达感情的能力极强，其隽永置他于大自然之中；亨德尔的几近完美的同时让他觉得有点肤浅。他认为贝多芬的音乐戏剧性过浓、个性过强。可以推知，爱因斯坦那样理解音乐是一种宁静、自然的心理过程。据说爱因斯坦还当别人音乐启蒙的义务教师，他不讲枯燥的乐理，只是由浅入深地一遍遍放唱片，让其凭直觉去领悟音乐的真谛。好比说，要向别人解释如何用口哨吹出某首曲调，那么老师必须亲自吹给对方听。没有人能做到熟读小提琴自学手册之后，便可以抄起小提琴娴熟地演奏诸如门德尔松的小提琴协奏曲。在某种意义上，某人对乐曲的掌握与其实际演奏能力是不可分的。音乐的体会、理解需要欣赏的过程和经验的累积，其困难源于难以言明的感情和演奏时细微的差异。“我得说实话，我最难面对的就是音乐杂志：音乐杂志没有‘音乐’，我读着，耳朵无所事事。有些交响乐室内乐曲目，听不知多少回，十几二十年后，啊呀，忽然‘懂了’，听进去了，以前像是白听。”［7］不光是音乐，“纸上谈兵”皆类似。


    直觉一般被认为是艺术工作者的特长，实际上爱因斯坦在科研中同样强调直觉，直觉包括对普遍性原则的求索，这取决于领悟能力。不过这并不意味着那些令人惊叹的发现是突兀而至的，在这背后是运用其深远见识去洞察一般人因无法超越技术上的困难而深入地查看的那些问题和差别。艺术上的创造力可以像科学上的创造力一样探索，因为艺术家和科学家在发现表现自然的新方式中采用了许多相同的策略。就像科学家一样，艺术家也是在解决问题［8］。大师的习惯和思想往往有与众不同之处。杨振宁先生说，波耳兹曼曾经说过：“一位音乐家在听到几个音节后，即能辨认出莫扎特、贝多芬或舒伯特的音乐。同样，一位数学家或物理学家也能在读了数页文字后辨认出柯西、高斯、雅可比、亥姆霍兹或克尔期豪夫的工作。”［9］不知爱因斯坦作何感。


    爱因斯坦是人类历史上的科学巨星，也是卓越的思想家和杰出的社会活动家，对人类命运和百姓生活时时关心，这与其宏阔的眼界、深邃的见识直接联系着，也与其非凡的音乐品位和真切的人文情怀相关。


    ## 6.3 森罗文艺


    在谈到形象思维模拟尚未能解决本质问题时，钱学森在其致潘云鹤院士的信中指出：“这本来也是自然的，因为要用计算机，而计算机只会‘计算’，可以说笨透了，一点聪敏都没有。”［10］另外，在其致戴汝为院士的信中说：“聪敏来自艺术与科学的结合。”［11］


    钱学森从小所受的教育，不到 36 岁就成长为麻省理工学院正教授的经历，给予现代中国航天事业的影响，晚年的思想体系的形成，都是后人进行反思和获得启示的良好借鉴与参照。钱学森完全可以像他人一样，居高位而享晚年，但他思考不息，探索不止。作为思想家，他可以天马行空，但他始终面向科学发展和文明进步的现实需求。高庆狮院士说过：“钱学森自学的数学功底，深度广度几乎涵盖了我们所学的数学的所有课程，而且运用自如，我们作为北大数学系的学生感到十分钦佩，同时也使我们具体了解了数学如何应用到实际物理世界中。”［12］钱学森的出色非三言两语可尽。


    钱学森非常赞赏哲学家熊十力将智慧分为“性智”与“量智”的观点，“性智者，即是真的自己的觉悟”。“量智，是思量和推度，或明辨事物之理则，及于所行所历，简择得失等等的作用故。”［13］即“文化、艺术方面的智慧叫‘性智’，科学方面的智慧叫量智”。［14］或言文化体系属“性智”，科技体系属“量智”。“恃思辨者，以逻辑谨严性，而不知穷理入深处，须休止思辨而默然体认，直至心与理为一，则非逻辑所能也。”［15］“性智”与“量智”中均有隐性知识。


    钱学森自己对文化艺术有浓厚兴趣，文艺理论、音乐、诗歌、绘画、书法、建筑、园林、工艺美术等，他都深深地热爱着、用心体味着，并具有独到的见解。他不仅熟悉大量对联、诗词、散文、小品等文学作品，还会拉小提琴、吹中音喇叭、唱歌、画水彩画等［16］。对于西方的音乐，也有良好的修养，作为理工科学生，在
    1935 年他还写过《音乐和音乐的内容》那样的音乐专文。归纳起来说，艺术的思维是先科学后艺术，科学的思维是先艺术后科学［14］。


    钱学森说：“我父亲钱均夫很懂得现代教育，他一方面让我学理工，走技术强国的路；另一方面送我去学音乐、绘画这些艺术课，一个有科学创新能力的人不但要有科学知识，还要有文化艺术修养。没有这些是不行的。小时候，我父亲就是这样对我进行教育和培养的，他让我学理科，同时又送我去学绘画和音乐。我从小不仅对科学有兴趣，也对艺术有兴趣……这些艺术上的修养不仅加深了我对艺术作品中那些诗情画意和人生哲理的深刻理解，也学会了艺术上大跨度的宏观形象思维。”［17］1999
    年 7 月 10 日，中央音乐学院举行其夫人蒋英教授执教 40 周年教学研讨会，钱学森在其书面发言中说蒋英教授在声乐表演及教学领域耕耘，“但我在这里特别要向同志们说明：蒋英对我的工作有很大的帮助和启示，这实际上是文艺对科学思维的启示和开拓！在我对一件工作遇到困难而百思不得其解的时候，往往是蒋英的歌声使我豁然开朗，得到启示。这就是艺术对科学的促进作用”。［17］所以钱学森强调：“学工科的、学理科的，也要学一点文学艺术，很多灵感就是在文学艺术的修养中产生的。”［18］


    钱学森认为，文艺与科学一样，来源于现实生活，反映客观世界，积极影响人们的思维与认识，又反作用于改造客观世界的实践活动。作为认识世界与改造世界的学问，它们的目标是统一的，是从不同视角、不同侧面，以不同手法去探索世界的奥秘，揭示事物的真理。钱学森具有深厚的中国传统文化的基础，这为他倡导建立思维科学、重视形象思维与灵感、高屋建瓴地指出应将形象思维作为突破口，提供了坚实、丰厚的底蕴。他说，谈思维科学，必然会涉及脑科学，虽然已有很大发展，但许多问题还说明不了，没有必要等。所以，还是要从总结经验入手［19］。无论大家还是技工，经验都是极其重要的知识之源，区别在于，前者是方法论层面的，后者是工艺相关的。


    他在英国对留学生发表讲话时背诵过孙髯撰的昆明大观楼长联［20］。即使是此类“余事”，也令我等凡夫俗子自叹弗如。此联中的“茫茫空阔”既是他早年空气动力学的研究对象，又有“高处不胜寒”的意境，而“滚滚英雄”与他的功绩是相称的。


    ## 6.4 道说绘画


    从表现方式看“科学与艺术”话题的形式有这样几种：


    第一，计算机美术图案的生成，用计算机模拟艺术创作；


    第二，借助计算机画出相似的自然图案，如分形的海岸线；


    第三，利用数学原理，生成图形、动画，这已较为普遍；


    第四，构图视角独特，自然引入物理或逻辑问题，如埃舍尔的画；


    第五，用绘画手段描绘物理本质，如将介绍的李可染的画，等等。


    李政道先生认为［21］，艺术和科学的共同基础是人类的创造力，它们追求的目标都是真理的普遍性。艺术，例如诗歌、绘画、音乐等，用创新的手法唤起每个人意识或潜意识中深藏着的情感，即使时代完全不同，情感共鸣依旧。情感越珍贵，反响越普遍，社会的范围越广泛，艺术也就越优秀。而科学定律越简单，应用越广泛，科学就越深刻。尽管自然现象不依赖于科学家而存在，但对自然现象的抽象和总结属于人类智慧的结晶，这跟艺术家的创造是一样的。科学的真理性根植于科学家以外的外部世界，艺术家追求的普遍真理性也是外在的，没有时空的限制。科学和艺术的普遍性并不完全相同，但有很强的关联。科学和艺术的关系是同智慧和情感的二元性密切关联的。艺术是古老的，比如有
    3 万年前的岩画，相比之下科学是年轻的，虽然科学企图弄明白宇宙的起源这样的时间最遥远的问题。艺术又是超前的，不少问题是科学来不及赶得上的，鉴别艺术品真伪就是其一。对艺术的鉴赏和对科学观念的理解都需要智慧，随后的感受升华和情感又是分不开的。科学与艺术是不可分割的，就像一枚硬币的两面。物理学中的超炫理论认为，四维世界中的所有现象只是十维空间中的一根弦的表现。李政道先生向大画家李可染解释，“想象用一根三维的线来绣一幅二维的图，可以绣出人、马、马车和许许多多其他东西。再想象这根线可以按任意方向运动，一根三维空间的线的运动就产生了人、马等二维图像的运动”。李可染据此创作了抽象水墨彩色画“超弦生万象”，见图
    6-2。充满动感的点、线画面，线条厚辣，意境神妙，“游于无穷”“寓意无穷”，富有诗意地描绘出万种粒子及其激发态是如何由一根超弦的振动产生的，创造出与超弦理论有联系的独特艺术意境。李可染在其生命的最后一年，为科学所动、所感，改画风而作，绝非仅为追求一种用绘画手段描述特定科学领域的表面形式，而是探索在一个更深奥的意境中进行科学和艺术间对话的方式。李政道先生同画家一起的探索，以及艺术所表达的科学美，为艺术家提供了新的思维角度与手段，使得绘画可以直观地表达、生动地显现科学理论，而科学可以深刻地探究、规范地陈述艺术创作的脑内过程等。那是一片言之不尽的境地……


    ![](img/txt007_3.jpg "pagenumber_ebook=154,pagenumber_book=146")


    图 6-2　李可染画：超弦生万象


    李政道先生还指出，自然界没有宏观上的绝对对称。物理学中蕴含着美学原则，绘画中蕴含着自然原则［21，22］。他以弘仁的一幅画（图 6-3）为例说明对称关系，假如把它从中间切一刀再翻过去，让它绝对对称，很难想象有人敢走进自然界里这样的一座山。因为它太不像自然的了。对称与背景和语境有关，比如，就阿拉伯数字和字母言，“6
    A6”“66A66”是对称的，但就图形而言，就不是了；再比如“65 A65”，若以“65”为一个单位，那是对称的，否则就不是。关于对称的判断也以整体视觉和整体思维为基础。


    ![](img/txt007_4.jpg "pagenumber_ebook=155,pagenumber_book=147")


    图 6-3　弘仁山水画比较：完全对称与否的不同


    ![](img/txt007_5.jpg "pagenumber_ebook=155,pagenumber_book=147")


    图 6-4　甲骨文，记录了世界上第一次发现新星的观测


    在甲骨文中，有世界上第一次发现新星的观测记录，如图 6-4 所示，该甲骨现存于我国台湾的“中央研究院”。图 6-4 中（b）是（a）的释文。大意是，黄昏时有一颗新星出现在大火（即心宿二）附近。它记载着一次新星爆发，（a）中加框三字即“新大星”，“新”字包含一个箭头，指向一个很奇怪的方向。李政道先生指出：“这个古老生动、具有艺术形象的象形文字强调了科学发现的创新性，显示了科学发现和艺术表达的一致性。”［23］至于屈原在《天问》中对天、地形状的推理，则更多是一种以“辞”对“宇宙”进行想象和描述的文学作品内容，如同弥尔顿在诗中说“太极到中心的三倍那么远”［24］一样，笔者认为尚不属于这里谈的科学与艺术的结合范畴。达·芬奇在他的时代既是科学家又是画家，他的艺术是科学家的艺术，他的科学是艺术家的科学［25］。他能画出惟妙惟肖的人像，得益于其因解剖尸体而获取的人体结构知识，他与同道共创艺术上的自然主义，不过那是在潜意识或无意识中形成的，无疑，其创作还缺乏与意境的瓜葛。


    ## 6.5 似是而非


