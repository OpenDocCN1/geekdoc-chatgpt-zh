    # 引言　心迹何处


    ![](img/txt001_1.jpg "pagenumber_ebook=9,pagenumber_book=1")


    万家墨面没蒿莱，敢有歌呤动地哀。


    心事浩茫连广宇，于无声处听惊雷。


    戌年初夏偶作以应新居先生雅教 鲁迅［1］


    智巧兼优，心手双畅［2］。


    ——唐·孙过庭《书谱·序》


    甲子出新童子是，心灵依旧物灵非。


    古人将脑作用归之于心，是知识的误区，但将人的思考机能与当时所理解的最重要器官关联，反映了古人的阶段性认识。检查心脏健康与否的基本手段是心电图，那是仪器记录的心脏每一心动周期收缩和舒张所产生的电生理活动的时间序列，是物理、生理意义上的“心迹”。相对于此，展现文化内涵和精神寄托的书法艺术则可透露人的喜怒哀乐、情感心绪，是精神、心理层面的“心迹”，拙著所及可谓“心有旁骛”“一心二意”。


    马克思在其中学毕业前夕所写的《青年在选择职业时的考虑》一文中写道：“在选择职业时，我们应当遵循的主要指针是人类的幸福和我们自身的完美。不应认为，这两种利益是敌对的，互相冲突的，一种利益必须消灭另一种的。人类的天性本来就是这样的：人们只有为同时代的人的完美，为他们的幸福而工作，才能使自己也达到完美。”［3］


    “人类的幸福”内涵宽广、理解有别，根本而言，健康当是幸福的基础，缘此才有蓬勃生命的延续、丰富生活的体会、充实人生的追求。“自身的完美”涉及身、心两者，若缺失健康则完美无从谈起。心，除了指中央位置以外，有两类含义，一是心脏，二指意识功能，或言生理和心理两者。前者的经典之作如《心脏运动论》［4］。后者又包括两个方面，一是心灵，即精神表现，通俗之作是《心的简史》［5］；二是心智，有时是智能的另一种表述，也是拙著的主题词。当今社会，心脑血管疾病已是威胁人类健康的头号杀手，最佳的应对措施首先是“治未病”，其次则是及时诊治，计算机、信息化可以提高效率、提升速度，而智能信息处理可提供更实时和更具针对性的服务。


    唐代书法家孙过庭在其书法理论经典之作《书谱·序》中说：“智巧兼优，心手双畅”。［2］“智巧”谓人的智能与书写技巧，而“心手”当指大脑与手。如《孟子·告子上》十五云：“耳目之官不思，而蔽于物。物交物，则引之而已矣。心之官则思，思则得之，不思则不得也。”［6］其中“心”为脏腑之心，实际上思考的器官是脑，即“心智”之心［7，8］，如平常所说的“心旷神怡”“心猿意马”“称心如意”“心有灵犀一点通”中的“心”。


    孙过庭还说：“……神怡务闲，一合也……心遗体留，一乖也……”“……睹迹明心者焉”“贵使文约理赡，迹显心通……”“写《乐毅》则情多佛郁；书《画赞》则意涉瑰奇；《黄庭经》则怡怿虚无；《太史箴》又纵横争折；暨乎《兰亭》兴集，思逸神超，私门诫誓，情拘志惨。”“非其心闲手敏，难以兼通者焉。”都是说书法创作与心情、情绪有关。唐代另一书法理论家张怀瓘在《书断·序》中说：“……技由心付……心不能授之于手，手不能受之于心。虽自己而可求，终杳茫而无获，又可怪矣。”［9］同是唐代书法理论家的韩方明在《授笔要说》中指出：“然意在笔先，笔居心后……”［10］，都是指心与手的呼应。


    在我们的生活中、语境里，心电图和书法是大众关心或熟悉的话题，拙著介绍以它们为背景与对象的人工智能研发的阶段性成果，但愿同时也是为人类而工作的一丁点具体努力。其中，计算机辅助心电图诊断面向社会的实际需求，机器书法创作模拟则缘于研究兴趣，本意只是探索形象思维的机器模拟的可能性，就审美本身而言，笔者不认为其结果可与优秀之作媲美。


    据此出发，本章以后的各章将涉及三个方面：人工智能背景、思维科学基础与经验知识阐述，即第 1 章至第 3 章；计算机辅助心电图诊断和书法创作模拟工作介绍，分别是第
    4 章和第 5 章；由前述讨论引出的科学与艺术话题以及人工智能未来的若干方面，分别是第 7 章和第 8 章。以下是主要章节引述。


    第 1 章：人工智能山重水复。各学科得以形成，当有其源头、轨迹和脉络，而不会是孤立的过程，它们既是人类知识的积淀，也是学科本身的“前车之鉴”，历史的回顾有助于我们洞察过去、立足当今从而把握未来。本章扼要梳理人工智能发展历程并与当代探索与规划衔接，分析对人工智能一开始的乐观预言，介绍其核心思想、关键人物和若干里程碑工作。


    第 2 章：形象思维扑朔迷离。思维模拟是人工智能的核心，而形象思维本是原始思维、艺术思维、儿童思维等领域的话题，与科学的基础，即抽象思维或逻辑思维似乎“道不同”。但作为思维的一种形式，既最早体现又难以言明，若要进行完整的思维模拟，就不能“不相为谋”。本章涉及逻辑悖论、日常思维、钱学森倡导的思维科学体系以及辩证思维等方面。


    第 3 章：经验知识举足轻重。经验是知识的重要来源，表面上看经验与严谨的科学技术不相干，实际上人工智能技术如西蒙言可谓经验科学，知识的获取过程、表达方式及其推理机制与经验整理密不可分，逻辑推理与经验既不同又关联。本章阐述显性知识与隐性知识、领域经验与知识学习等的基本观念，生活中学习能力与常识积累互相关联，机器学习也一样。


    第 4 章：心电图谱见微知著。计算机辅助心电图诊断中，诸如现有的算法特点与医生脑中的诊断思维过程是否一致、分析时所关注的特征集是否是疾病分类的充要条件等制约着不同方法的可用性。心电图分析是笔者关于隐性知识问题的起始点。本章强调医生思维过程模拟、经验知识学习，以及计算中规则推理与深度学习融合等的内涵及其意义。


    第 5 章：机器书法浮光掠影。用计算机模拟文字书写过程并非新鲜之举，国内外有大量工作，诸如毛笔物理特性甚至草书“飞白”的随机效果的呈现等，多数并非出自思维模拟（至少并非显式地考虑此事）的目的。毛笔书法创作是形象思维的典型形式。本章从书法创作的关键过程和实践体验出发，介绍其模拟尝试的特点、思路、方法、结果及其教学应用设想。


    第 6 章：科学艺术若即若离。科学崇尚真理，艺术追求唯美，它们是人类文明发展历程的两条独立而互望的道路，从本质、手段到表现均有独特的方式，并非两条平行线，而是既有交叉又有相互的影响。由书法艺术创作模拟的探索，拓展到科学、技术与艺术关系问题。本章叙述若干科技大家关于具体艺术的思想与论述、艺术中似是而非的视点与观点，以期获得启迪。


    第 7 章：人机结合峰回路转。人工智能尚无系统理论指导，面对的又是如此复杂的人脑，是在摸索中不断进步的，其间有乐观预测、停滞徘徊、突飞猛进、泛在应用，那里始终是探索的天地、想象的空间、激荡的海洋、智慧的沃土。本章以人机结合这一人工智能系统的基本形态为前提，讨论人工智能更多方面，包括意识、境界等话题，隐性知识依然是其中避不开的内容。


    前两部分有若干篇附录。后一部分未分主、附录各篇，或是笔者理念，或是细节材料，或是延伸补充，与主题有关而程度有异，亦可谓“外篇”。其中的核心是经验中的隐性知识。各章主要观念及其相互关系见图
    0- 1。


