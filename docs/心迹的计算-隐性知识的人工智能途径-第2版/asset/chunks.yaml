    图5-15　书法创作模拟用机械臂及其输出创作结果


    学习书法，是一个临、读、写不断反馈的过程，计算机模拟，也应基本遵循这样的过程［22～24］。而烦琐的参数设计，对于懂书画的人而言依然不便，更何况对于不懂书画的人。书法创作与动画、漫画等比有很大不同，细微的差异会导致很大的审美差异，这里的核心非一般的图形变换。由于人们对形象思维过程知之甚少，其探索将是伴随人工智能成长的一个任务。未来工作可分层次、分阶段展开，分层次指根据难度和目标划分，分阶段指关键技术、系统和应用的区分。研究主线还应是思维模拟，经验是前提，线条是基础，变形和结构是根本。


    概略而言，计算机书法创作（CG）也就是确定函数，对原始样本进行统计学习，然后变形（相似但不同于原始样本）：


    ![](images/txt006_18.jpg "pagenumber_ebook=139,pagenumber_book=131")


    `i`区分不同笔画，`n`指不同字。


    ## 5.3 教育可辅


    书法创作模拟，初衷是形象思维模拟，中间过程漫长，后来目标是辅助教育平台，评估是其核心内容。我国传统的小学甚至中学都安排书法课，其教学多采取教师巡视，逐个教授的方法，缺点是讲解慢、效率低，并且课后学生无法得到老师进一步具体、有效的指导。犬子在小学四年级上学期的某个周末做书法描红练习，特地走过来，将本子放在桌上开始尝试，笔者看后说那不是反复涂而要努力一笔写。大概两周后又回苏州，他妈妈说，他的书法描红作业成绩得了不及格，笔者一怔而笑。这里有他敷衍的原因，然而一笔写对于第一次练习的孩子而言其效果可想而知。估计不少小朋友是反复描的。于是可考虑将有关的机器书法创作结果应用于中小学电子白板系统的书法临摹教学环节中，它能接收输入设备的学生手写书法字信息，并给出基本的分析、评价和建议，如图5-16所示。


    ![](images/txt006_19.jpg "pagenumber_ebook=139,pagenumber_book=131")


    图5-16　电子白板书法教学示意


    笔者所言书法创作的计算机模拟，不是目前计算机上的“写字板”“画笔”那样一种工具，而现在的计算机上的一些辅助工具，有被滥用之嫌，比如我们看到一些书法碑帖出版物，有的机械地提取了一个个字的轮廓，丢弃背景信息问题还不大，轮廓失真是主要不足，那会损害微妙的美感甚至以丑为美；有的将黑底白字拓片图案反转，尽管使字本身以墨色出现，符合人们习惯，可惜古朴意境荡然而失；还有的将拓本墨色加浓、加黑，本意是增强效果，其实弄巧成拙。


    曾听到人问，是否可以让计算机辨别某位书画家作品的真伪？至少当下不能，创作与鉴赏不是一回事，且我们的创作模拟只是初步的。辨别真伪过于复杂，很多学习书法数十年的人，也未必有经验作辨。启功说［25］：“搞鉴定千万不要从书入手。有人讲我学写字有什么书好看，主要看帖、看碑，书法理论众说纷纭，根本不明确，讲是讲不清楚的。鉴定书画也别看书，有经验的、有道理的要看，但别看那些神乎其神的书，如神品、妙品、逸品之类的。”人说不清的，机器没有参照、做不来；人愿意说的，不见得就是有用的经验，不少是隔靴搔痒。最好有人去粗取精以便大家取精用宏，实际上不少研究者梳理、阐释、发挥，到头来书越来越多，可是问题依旧，书法理论家若能利用自己的隐性知识挖掘前人的隐性知识形成中国书法精炼的、核心的、清晰的理论，则功莫大焉。


    熊秉明认为某人所写的“我”字的时候，会流露出一种潜意识，可据此推测出其性格特征、情感类型乃至大致经历等，几乎接近真实。是他收集数千个样本后的总结［26］。但这种由“写”而出的“特征”关系是否可作如此归纳是存疑的，在技术上，计算机可以用一定数量样本进行学习，然而未必能得到直接结论。


    文同论草书有言［27］：“余学草书凡十年，终未得古人用笔相传之法。后因见道上斗蛇，遂得其妙，乃知颠素各有所悟，然后至此。”文字记录的有的不及其意、有的深奥难会，后人没法理解、不得要领。文同理解了，但别人依然不易理解他理解了什么。感觉和印象只是认识的第一阶段，运用概念以作判断和推理则是认识的第二阶段，经过感觉而达到思维，从而了解客观事物的规律性，了解这一过程和那一过程的内部联系。


    创作和鉴赏是关联而又互不能替代的审美活动，作品水准高者通常具有一定的鉴赏力，鉴赏大家的书画作品多数似乎难当其名，也有人眼光不错但既不临习、创作，也不会鉴别。若仅从其要求出发看，鉴别比创作更难，因为前者要有明确的归类结果，而创作有一定的自由度，是在个人偏好基础上的经验性再现和思维的深化；但在艺术层面本身，高境界的创作更为难得，它是开放的，其新意可以是无限的。相比之下，鉴赏活动需要看得更多，而再多也是有限的。


    一个学生要是辍学，不是家境贫困或突发事故，便是兴趣转移或思想障碍。但计算机辅助书法创作模拟仅有上述探索性的结果［28］，并非因其耗资巨大，也不是初衷有变，而是脑内机理不明、微妙细节难究。以下问题有待落实、完善。


    首先，我们描述的过程还十分宏观，对应的是书法创作的基本环节，要总结出如图5-10所示的过程本身需要经验和反思，目前的计算机模拟实践还只是演示性结果，进一步内容有待建模方法的创新。也许，在相当长的一段时间内，并没有合适的数学工具可供选择，至少，目前机器的“刻画”并没有能够对应脑内过程。


    其次，我们所用的方法，在多大程度上能推广到更多的样本、更佳的结果尚无足够的示例，有限的例子难以任意外推到其他诸体。我们的笔画统计模型的参数的各分量如何与“肥”“瘦”等特征在细节上一致，还没有确定的结论，很可能要调整或改变目前的统计学习模型，或者需要更大量的样本和实验，大语言模型亦无能为力。


    第三，我们在以串行处理为特征的冯氏结构计算机上用经典“计算”的方法进行尝试，是将形象思维问题“抽象”化了，这个模拟过程实质上并非就对应着形象思维，我们企图“殊途同归”，实际上，尚未“归”为一处。由于大脑处理抽象思维和形象思维的区域分属左右脑，因此，也许需要不同机制机器或不同算法才可能真正进行模拟。


    第四，提到书法，人们立刻会联想到龙飞凤舞、汪洋恣肆的草书。无疑，草书是书法创作和心迹表达的高级境界，历史上杰出的书法家不少都以草书闻名，甚至有人认为从事书法创作而未涉及草书意味着没有真正意义上步入书法殿堂。草书本身创作的困难导致其机器模拟极为复杂，不是通过分笔画而可“整合”的。


    最后，艺术审美的评价难免各执己见，目前一些结果也许可以通过“图灵测试”，这依赖于我们如何规定要求，不过这是人机结合的结果，与经典图灵测试是不同的。我们值得骄傲的，就如普利高津所说：“中国文明具有了不起的技术实践，中国文明对人类、社会与自然之间的关系有着深刻的理解。”［29］书法无疑是其一。


    ## 5.4 指下琴韵


    钱学森提出的现代科学技术体系中的人体科学包括西医，以及中医、气功和特异功能。若以书法执笔书写过程是一种气功状态言，书法与气功可同属于人体科学门类（同时属于文艺理论与文艺创作门类）。事实上，书法在艺术创作、文化修养的同时历来被当作与健康相关的活动或一种锻炼。


    祝嘉在综合前人合理之说提出五指气力（用力）、四指力齐（一样用力）的执笔方法的基础上，强调“全身力到论”，具体涉及指的位置、用力大小、笔管方向，因而可用阵列式脉象感知柔性传感器技术研制执笔感知器“嘉执”，涉及执笔方法检测、生理评估原则和比对指标定义：

    ●一个笔套（或整个笔杆），有五指位置提示，相应处有柔性传感器测力，指力不够则有声音提示，笔套上同时嵌入一个陀螺，笔的角度超出范围时给出提示，具体数值则根据实际情况拟合；

    ●针对历代执笔有不同方法、各执一词的现状，通过测手臂肌肉（筋）的扭转、神经系统的刺激反馈情况，从生理机能本身的合理性出发作出评判，给出建议；

    ●所谓执笔正确不仅要符合上述基本方法并适合人体生理机制，还要符合笔锋运动所致的视觉表现的各种审美约束，比如线条厚劲、大小变化、章法活泼等，需要定义指标。


    还有语音模块，若其分量过重则分列设计，两个模块相互间可无线通信，或笔套与手机直接联系。语音模块在一开始可放一段语音提示。


    另有书写板，上有感知墨迹的传感器阵列，感知结果传输到显示屏供观察、分析并获得改进建议，该功能借助书法笔画变形等面向形象思维模拟的探索，利用轨迹跟踪技术获得学生习字留下的墨迹，以辅助教学，功能有三：

    ![](images/txt006_20.png "pagenumber_ebook=142,pagenumber_book=134")先根据笔画长度归一化，作长短比较；

    ![](images/txt006_21.png "pagenumber_ebook=142,pagenumber_book=134")起笔方圆曲率比较，收笔锐利程度比较，计算不重合部分的面积；

    ![](images/txt006_22.png "pagenumber_ebook=142,pagenumber_book=134")定义偏离指数，简单的是百分比。


    ## 5.5 本章概要


    同一汉字不同时期、不同形态的变化如图5-17［30］所示，书法创作是形象思维模拟的有趣切入点。


    ![](images/txt006_23.jpg "pagenumber_ebook=143,pagenumber_book=135")


    图5-17　马字的不同书体：象马匹立起瞠目，鬃鬣飞扬之形


    ●中国书法的篆、隶、楷、草等各种字体，都是既有字形一定程度上的形变的结果，形变是书法字体演化和创作的基本内涵；

    ●无论个人还是机器创作模拟都依赖于良好的方法，忽视之，不仅将导致事倍功半，甚至会止步不前；

    ●以笔画变形为核心的机器书法创作模拟的结果是初步的，以更少的参数和谐地影响更多的笔画是本方法未来的目标。


    后面两章将进一步阐述科学与艺术交融的几个方面，以及人工智能面临的若干问题。


