    在计算机所创作结果的基础上，用如图5-15所示的末端执笔的机械臂将其输出于纸上（图5-15左中）^([\[2\]](#txt006.html#footnote_content_txt006_2))。前两个字与后两个字笔画粗细差别明显，主要是蘸墨不同所致。另外，“春回”笔画瘦弱，“回”笔画出现抖动，不如“大地”厚实，尤其“大”不错，不足的是其首横略有失衡之感。这里，将计算机书法创作输入机械臂，无疑也可直接取拓片字的图像输入机械臂。


