    “学习”是个人成长的必然要求，也是人工智能的经典话题。“学习”不只是积累，不仅仅是从环境得到信息，更重要的是“去粗取精、去伪存真、由此及彼、由表及里”［31］的过程和能力。理论上讲，这个能力要么是伴随成长而来的，要么是被告知的。如果是“告知”，什么内容可被告知？人自身说不明白从小到大的学习是怎样的神经机制和脑内过程。概略而言，“实现人工智能的长远目标的捷径将可能包含人的设计与进化两者”［31］。


    西蒙指出，几秒钟内完成的诊断表现为一种直觉的过程，一个人只有对非常熟悉的东西才会有直觉。比如，丘奇—图灵论题说，对于任何可计算某一函数的有效步骤，都存在一个能够运行计算这个函数步骤的图灵机。其中，“有效步骤”是直觉概念，而不是形式概念［32］。爱因斯坦认为，“日常思维的基本概念与感觉经验的复合之间的联系，只能被直觉地了解，它不能适应科学的逻辑规定。全部这些联系——没有一个这种联系是能够用概念的词句来表达的——是把科学这座大厦同概念的逻辑空架子区别开来的唯一的东西”［33］。他在悼念居里夫人时说：“居里夫人一生最伟大的成就的取得，不仅是靠着大胆的直觉……”［33］他还在纪念哥白尼逝世
    410 周年时说：“要令人信服地详细说明太阳中心概念的优越性，必须具有罕见的思考的独立性和直觉……”［33］文艺中也类似，“如果创造性直觉缺少，一部作品可能完全地形成，但他什么也不是；艺术家什么也没有说。如果创造性直觉呈现出来，并在某种程度上进入作品之中，那么这部作品存在着而且向我们述说……”［34］而在日常生活中，天朗气清、太阳高悬时，下雨几乎是不可思议的事情，但生活中有这样的情景，时间久了，只要听到淅沥的雨声和滴答的水声，哪怕没有乌云，没有雷声，甚至晴日依旧，我们也能作出下雨的判断。


    ## 3.6 本章概要


    隐性知识的积累是从专业学习开始到不断应用的反馈、迭代过程，如图 3-3 所示。


    ![](img/txt004_5.jpg "pagenumber_ebook=85,pagenumber_book=77")


    图 3-3　隐性知识积累。通常，书本学习是知识获取的主要来源和基本手段，在此基础上可进行领域实践或实际应用，经过一段时间的实践、对照、反思、总结，能力得以提高，并逐步形成自己的经验，从而专业素质日益完善，它们将更新原有知识或成为新的知识


    - 经验是个人智慧的重要部分，独特的领域经验是一个专家之所以成为专家的前提；

    - 隐性知识是具体领域当中长期实践的结晶，其表达和推理是人工智能的一项核心任务；

    - 计算机辅助诊断可以是专家系统的一个更恰当的表述，尽管内容经典，但其中有大量需要探索和实现的具体工作。


    后面两章在本章基础上介绍隐性知识学习的两个具体例子。


    古人学问无遗力，少壮工夫老始成。


    纸上得来终觉浅，绝知此事要躬行。


    ——陆游《冬夜读书示子聿》


