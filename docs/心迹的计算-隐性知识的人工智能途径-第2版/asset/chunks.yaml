    \n［16］蕅益大师.灵峰宗论／／曹越.明清四大高僧文集.北京：北京图书馆出版社，2005：721.\n\n［17］汤川秀树.创造力与直觉——一个物理学家对于东西方的考察.周林东，戈革，译.石家庄：河北科学技术出版社，2000：104，53.\n\
    \n［18］益川敏英.浴缸里的灵感——益川敏英的诺贝尔奖人生.那日苏，译.北京：科学出版社，2010：38，121.\n\n［19］艾克曼.歌德谈话录.杨武能，译.北京：中国书店，2007：170.［20］恩格斯.自然辩证法.北京：人民出版社，1971：27～28，70.\n\
