  trans: '


    大家对人工智能一开始表现出无比的信心和极度的乐观^([\[9\]](#txt002.html#footnote_content_txt002_9))，其研究遇到的困难是，满足演示一两个简单问题的方法在面对更广泛和更复杂的问题时就失效了，有关程序通常包含太少知识，缺乏常识（`common-sense
    knowledge`）是首要问题，这使得人工智能离西蒙预言的实现颇为遥远［20］。此状况实际上隐含着人类“强迫”机器朝人的发展的动机。


    在计算机国际象棋手中，“深青年”（`Deep Junior`）是佼佼者，然其缺乏人类那样的形态把握能力。人工智能的突破在于超越人类的成长过程^([\[10\]](#txt002.html#footnote_content_txt002_10))。中国最早的九段围棋手之一陈祖德曾将医学和围棋作过比喻：“医生诊断病情和棋手解答死活题相似，水平低的棋手面对一个较深奥的死活题，花再多时间思考也往往白搭，而一位高手只需稍加思考就能答出正解。遗憾的是医务界这样的高手还太少，多少人的病就这样被耽误了，多少人的生的希望就是这样丧失了。”［21］下棋、行医都难，从业者众多，大量的棋谱、医书并不意味着拜读以后就可以成为“高手”，同样的学习，多数人到不了那境界，但机器有人类无法比拟的计算速度和存储知识的空间从而获得能力上的互补。


    曾国藩说：“以围棋论，生而得国手者，上智也；屡学而不知局道，不辨死活者，下愚也。此外皆相近之质，视乎教育如何。教者高，则习之而高矣；教者低，则习之而底矣。”［22］这里的教育，确切而言，是指在正确方法指导下的经验积累过程。围棋比赛有复盘的传统，以弄清取胜关键和失败原委。大而言之，即历史的回顾。


    概略而言，当年预见未能变现，以致直到如今依然棘手的原因大致有三。


    第一，估计不足。之所以不足，一是未曾经历而难知“深浅”，二是期待急切而过于乐观。


    第二，方法阙如。人的大脑是如此的复杂，人们不得不承认那是最难攻克的“堡垒”。


    第三，工具缺乏。脑内过程和机器实现间、宏观表现到微观机制间的“桥梁”似乎还是一座空中楼阁。


    到 20 世纪 80 年代，曾有人认为，“最迟到 1990 年，电脑就可以充当你的医生。”［23］现在看来，除了预言的破灭，这个说法本身需要调整，我们不能期望机器代替人成为独立的医生，而是让机器辅助人进行诊断。在又过了数十年的今天，计算机即使在一个具体的医疗诊断领域往往也难以独立胜任。预期一次次“失灵”的背后是科技本身进步的艰难，艰难的根源是关于思维的迷茫，其错综复杂的程度当今人类尚不可以具体明白。


    放眼观史，乐观预估不少，由于各领域自身的迅猛发展及其不断交叉，给人以日新月异、琳琅满目、色彩纷呈、繁花似锦的感觉，科学研究要“既异想天开，又实事求是”亦是不易平衡的。


    ### 1.4 知识工程


    1965 年，费根鲍姆（E.Feigenbau m）和 1958 年诺贝尔生理学或医学奖获得者莱德伯格（J.Lederberg）开始做后来被叫作`DENDRAL`［24］的启发式专家系统，即一个用于有机化合物分析的程序，也是此后很多专家系统的模型，是在其建立的斯坦福大学的知识系统实验室中完成的。对于像生物化学那样的领域，不但有通用原则，还有许多在实际判断中需要考虑的特例。`DENDRAL`可谓是世界上第一个真正的专家系统，被用在工业上和科研院校里。他们研究`DENDRAL`的动机有二：一是研究科学问题如何被解决和发现，尤其是科学家在从经验事实中就假设和理论进行推理时使用或将用的过程；二是希望他们的研究将来能为其他科学家所用，提供对于重要的和困难的问题的智能辅助。他们的工作体现了学术和商业的独特结合。1970
    年他们又推出了更为先进的`METADENDRAL`，它不仅能用已知规则来推测化合物的结构，而且还能将已知的结构与数据库中的规则进行比较，从而得到全新的规则。


    诊断血液感染和脑膜炎感染并推荐药物的专家系统`MYCIN`［24］的研究开始于 1972 年。如果`MYCIN`被告知一个病人已经被检测出出血和痉挛，专家系统将试图诊断是否是细菌引起了病人的症状。它引入了依赖于专家经验的可信度因子和不确定性推理。`MYCIN`把医药世界当作是由连接症状与疾病的经验联系所构成的［25］，同时，搜索过程中还有一个规则获取过程。它有一个附属的知识获取的软件`TEIRESIAS`。多数鉴定者认为其结果与他们自己给出的相符合。


    1977 年第五届国际人工智能联合会议上，费根鲍姆阐述了专家系统的思想并提出“知识工程”［24］的概念，至此人工智能研究又有了新转折，知识作为智能的基础开始受到重视，并促使人工智能从实验室研究走向实际应用。他指出，严肃的应用问题与以应用为名的儿戏问题是不同的，必须务实而不是教条主义。专家系统指具备专家能力的系统，或可以像专家那样思维的系统，与知识密切相关。知识工程的基本思想是，用人工智能的原理，对需要专家知识才能解决的应用问题提供手段。它应该包含三方面的基本含义：


    ●应用，即明确的任务或目标；

    ●专家知识，任何智能系统都需要各类知识；

    ●工程，利用工程化的规范方式。


    本质上，知识工程代表了人工智能的首次广泛的工业化。其间，人工智能的领域开始转变，基础研究和应用开发两者均有大量投资。同时，技术的缺陷也很快被发现，不过还是有不少有用的系统被发布。1959
    年，费根鲍姆在其由西蒙指导的博士论文中开发了该领域最初几个之一的人如何学习的模型。诸如初级知觉和存储器（elementary perceiver and memorizer）可以模拟人通过辨别新单词与旧单词的异同之处来进行单词记忆的过程。费根鲍姆曾是三家应用人工智能公司的共同创立者。他的一个主要兴趣是解决复杂的计算问题时使用启发式方法。费根鲍姆与瑞迪一起，因其“设计与构建大规模人工智能系统的先驱性的贡献，展现了人工智能技术的实际的重要性和潜在商业影响”而获
    1994 年度图灵奖。


    1984 年雷纳特开始研制`CYC`［26］工程，目标是建立一个常识知识库为未来一代的专家系统提供基础，然后用类比推理解决问题，最后使计算机自己发现知识。知识录入者仔细查看报纸和杂志上的文章、百科全书条目、广告等的同时询问他们自己：什么知识是作者假设读者已经知道的；然后他们用手工编写数百万的断言，目的是捕捉任何（人或者机器）读者为了去理解百科全书所必须有的信息。这些断言按领域和上下文关系分为若干组，一个领域可以有多个组，因为同一个领域可以从不同的角度去观察。1991
    年雷纳特和费根鲍姆预言`CYC`将成为一个有人类水平的宽度和深度知识的系统。`CYC`包括的知识有：关于日常生活中对象和事件推理的事实，经验规则（`rules
    of thu mb`）及启发式规则。`CYC`包含数以千计的“微理论”，每一个本质上是一组共享一组公共假设的断言。一度，`CYC`包含 50 万个术语，其中有
    1.5 万个关系类型，与术语相关的 500 万个事实（断言）。新的断言不断通过自动和人工的方式加入。另外，术语表示功能可以自动生成数以百万计的非原子术语。`CYC`自己增加大量作为推理过程的产物的断言。雷纳特认为：就人工智能这样的领域而言，做一个经验主义的科学家是有非常大的价值的，那就是观察数据、进行试验、通过计算机验证研究假设的真伪［27］。关于`CYC`是否实现了他的早先预期这个问题还有不少疑问，其中隐含诸多隐性知识无疑，想来后来的“数据挖掘”不无获取之意，只是未明言而已。


    专家系统是人工智能的经典代表，尽管典型领域为数不多。人工智能已有的研究与应用涉及谓词演算和搜索、知识表达、推理和问题求解，定理证明、自动程序设计，模式识别、数据挖掘与机器学习，博弈、机器人，自然语言理解，计算智能等。它们基本上要么本身被包含在专家系统研究中，如搜索；要么是一种特定的专家系统，如定理证明；要么是专家思维功能的一部分，如模式识别。计算智能没有直接地模拟专家解决问题的能力或能力的一部分，然而在实际的专家系统研究中，不少工作利用了人工神经网络等，它们之间也没有能决然分开。在医学领域，有经验的医生甚至能运用从资料到假设的思维过程，而从假设到数据的思维过程就难免出错。


    ### 1.5 风云人物


    除了图灵、冯·诺依曼等这些百年一遇的伟人以及前述其他学者以外，数十年间众多艰辛的开拓者和卓越的领路人谱写了人工智能的不同乐章。前文介绍的“知识工程”创立者费根鲍姆位列
    2011 年 IEEE Intelligent Systems 发表的“人工智能名人堂”^([\[11\]](#txt002.html#footnote_content_txt002_11))之首［29］。


    除了组织 1956 年的达特茅斯会议，定义了人工智能的发展目标，麦卡锡还开发了一系列关键的工具和方法，1963 年创立了斯坦福大学人工智能实验室，是证明计算程序正确性的数学逻辑的先驱。他指出了常识问题，关于常识推理的逻辑基础导致了非单调推理和逻辑程序的各种方法。在符号表达和符号赋值基础上他提出了强而简洁的`Lisp`语言，那不仅成为当时主要的人工智能程序设计语言，还是大量关于计算的数学基础的论文的始点。他在
    1969 年与海因斯（P.Hayes）一起撰写的“人工智能视角的一些哲学问题”的论文中，首次详细定义了情景演算问题。他还探索了挑战机器人技术和知识表达的机器人意识和内省话题。


    1959 年，明斯基和麦卡锡一起创立了麻省理工学院计算机和人工智能实验室。明斯基在其《情感机器》和《心灵社会》两书中均表述了关于人类智能结构和功能的概念。他是人工神经网络的先驱，与派珀特（S.Papert）一起是感知器的奠基者，后来又对人工神经网络提出了严厉的批评。他认为情感比智能反映要简单。他的另一项伟大的成就是框架理论，无论实践还是理论方面都是知识表达的基础。他对于面向对象程序设计范式的出现也有积极的贡献。


    伯纳斯-李（T.Berners-Lee）1989 年提出的万维网和语义网是他众多对人工智能的贡献中的两个。他不仅是理念的提出者，还是推动者、开发者和护卫者。他说，在
    1990 年代早期，他开始在人工智能领域工作时，瓶颈之一是从专家或有限的文档中取得^([\[12\]](#txt002.html#footnote_content_txt002_12))知识。万维网技术开发的初衷是使全球高校与科研机构的物理学家能更好地分享信息。


    恩格尔巴特（D.Engelbart）是鼠标等的发明者，是因特网先驱之一。他企图用计算机工具匹配人的能力，交点即是图形用户界面和自然语言命令，即交互式计算，那还是在
    1962 年。数十年间他一直努力为人机交互提出更好的方法。越来越多的实践表明，人机交互体现了人机结合的思想，是实现人工智能的恰当途径。他还提出了包括计算机支持协同工作在内的众多方向。他是
    1997 年图灵奖得主。


    札德（L.Zadeh）1965 年提出了作为常规（布尔）逻辑的超集的模糊逻辑，这是一个对任何事物而言（包括“真”在内）都有其“程度”的模型。它挑战了绝对真或假的经典逻辑信念。由于对亚里士多德逻辑的“放宽”的重要性，模糊逻辑开启了理性方法于多数没有两个分支的真值的实际情景的应用。尽管一开始遭到蔑视，如今模糊逻辑被广泛接受，从消费电子、工业系统到医疗、物理学等领域。宽泛而言，那也是对形象思维刻画的一种努力。


    乔姆斯基（N.Chomsky）是著名的语言学家、哲学家、认知科学家和社会活动家。他关于形式语言（用于数学和逻辑）和获取与处理语言的工作极大地影响了人工智能探究。1950
    年代他为自然语言开发的语法规则为该领域研究奠定了基础，并导致大量自然语言处理和随后计算语言学的有趣的研究。他还提出了按照不同的表达能力将形式语言分类的`Chomsky
    hierarchy`。


    瑞迪（R.Reddy）的人工智能研究集中在诸如说话、语言、视觉和机器人等的智能的感知和运动神经（motor）方面。他和同伴一起开发了大词汇量的连续语音识别系统。他的将技术用于社会和人类的极有远见的工作使之区别于其他出色的技术专家。他是探索“技术在社会服务”中的角色的真正的先驱者，创立了第一个通用的数字图书馆，扩展了人工智能的实际影响。


    珀尔（J.Pearl）是计算机科学家和哲学家，是最初在经验科学中创建数学化因果关系（causal）模型的学者之一，其工作涉及在不确定情况下利用概率图模型的机器学习、推理和决策方法。1980
    年代中期，他和同事用清晰而重要的证明过程指出在贝叶斯网络中概率独立性的表达和操作。他还开发了在这些图形表达中执行概率推理的有用算法，这些推理包括诊断推理，其中某些变量（比如病人症状的观察）是指定的，而一些不可观察或隐含的变量（诸如潜在的疾病折磨着病人的假设）的概率改变则是希望看到的。


    尼尔森（N.Nilsson）与同事哈特（P.Hart）和拉斐尔（B.Raphael）一起提出了`A*`启发式搜索算法和`Stripe`自动规划系统，多数人工智能教科书一开始就会提及，其解总能找到（如果存在）。当给出一个可接受的启发式函数（不过高估计从当前状态到目标状态的代价），则`A*`是优化的和有效的。`Stripe`自动规则系统为一些将定理证明技术应用到问题解决中的新方法奠定了基础。尼尔森还以机器学习、模式识别和计算智能闻名。


    魏泽堡（J.Weizenbau m）曾发明一种人机对话程序，使得有时能让人们误以为是在与人类而不是计算机交流。他后来成为人工智能的批评者，关注“应该研究些什么”而非“能够研究些什么”。他认为将人工智能应用在导弹机器防御系统等军事领域都属于一种不适当的推广。这也是社会责任感的一种表现。对人工智能更为尖锐的批评来自德雷弗斯（H.Dreyfus），他最著名的论点就是“计算机不能做什么？”如果计算机完成了某个任务，那不是真正智能的表现。有了这样的反面意见，我们才有更多机会、更深思考来面对人工智能的本质、意义和作用问题。


    库兹韦尔（R.Kurzweil）则对人工智能充满信心。他 16 岁时就编写了一套音乐程序，能对著名作曲家的风格做分析，然后创作出类似风格的音乐作品预测。后来，他引入隐马尔科夫模型进行语音识别［10］。他的风靡于世的观点便是
    2005 年提出的所谓人工智能发展的“技术奇点”，那时候，机器将拥有与人类一样的智能，包括意识、情绪等，这是对人工智能能否超越人类这一经典问题的一种明确回答。引来的自然是新一轮的探索与争论。盖茨（B.Gates）称库兹韦尔是他所知道的在预测人工智能上最厉害的人［30］。技术的发展支撑了他的乐观。


    1981 年诺贝尔生理学或医学奖得主中的休伯尔（D.H.Hubel）和威塞尔（T.N.Wiesel）在 20 世纪 60 年代关于猫的视觉系统中局部感知、面向选择的神经元的发现，以及超过三层的网络结构有效地进行学习的结论给人工神经网络的建模研究以良好启发和借鉴。2006
    年辛顿（G.E.Hinton）等提出深度学习概念和深度置信网络结构，本希奥（Y.Bengi）等提出非监督“贪心”逐层训练算法，而勒昆（Y.LeCun）等更早实现的卷积神经网络效果明显、先声夺人。深度学习使得人工智能取得突破。他们三位因深度学习方面的贡献获
    2018 年度图灵奖，他们是这些年人工智能又一次高潮的“始作俑者”，其理论工作是如今人工智能“遍地开花”的根基。


    乔丹（M.Jordan）被授予“2022 年度世界顶尖科学家协会奖”之“数学与智能科学奖”，以“表彰他对机器学习的理论基础及其应用作出了根本性贡献”。他指出人工智能应是集体，这与人机结合思想一致。他是美国国家工程学院院士、科学院院士和美国艺术和科学学院院士。布雷曼（L.Brei
    man）则是被誉为对机器学习贡献最大的统计学家，而苏茨克维（I.Sutskever）等是在企业推动人工智能技术大踏步融入人们生活的代表人物。


    有观点认为，科学革命绝非仅仅凭借一批史无前例的天才在彼时彼刻的横空出世就可以骤然发生，而与其他人全然无涉。它是某些可以辨认的力量和世代积累的产物，在寻找这一历史关键线索时我们首先必须从神话中排除所有伟大人物［31］。且不讨论此说是否全然为真，在天才人物之外，有着更多的优秀人物，他们或者交流其中，或者辅助其成，或者实现其事，难以敷列，但他们的贡献是切实的。以上只是尽量选择了有划时代思想、开创性理论或里程碑技术的代表人物。


    ### 1.6 典型系统


    2016 年 1 月 28 日，英国《自然》杂志以封面文章形式报道［32］：谷歌旗下人工智能公司深灵（`Deep Mind`）开发的`AlphaGo`以 5
    比 0 的成绩战胜了卫冕欧洲冠军樊麾。`Alpha Go`程序组合了深层神经网络和树搜索，深层神经网络用卷积层构造位置的表达，有效地减少了树的搜索深度和广度。程序用“价值网络”估算局面，用“策略网络”选择下子。训练深层神经网络的，是对人类专业棋局的监督学习以及对自弈（`self-play`）的再励学习的组合，后者提升了前者的性能。这次是计算机程序首次能在完整的和不让子的情况下击败专业选手——原以为
    10 年后人工智能才能做到的事情。这同时表明，人工智能依赖于针对大脑的深入建模。当时笔者初得一联：


    浅智漫行至地主，深灵速步成天惊^([\[13\]](#txt002.html#footnote_content_txt002_13))。


    谷歌的自动驾驶研究比特斯拉早，它与下围棋程序哪个更难？机器目前尚无与人可对应的经验过程，机器学习所“学”的经验在过程和发挥作用方面与人在成长过程中积累的经验并不一样，它们对“计算”能力的依赖程度不同，但不是“简单”与否的问题。若将安全问题暂时放一边，几岁的小孩学开车从而到熟练驾驶，比学围棋而越过业余阶段要容易很多，那是个“技术活”。即便从小学围棋，到头来“入”段的颇少。70
    年前电子计算机诞生，随后计算能力飞速提高，国际象棋程序到 20 世纪末才“称冠”，而围棋程序到人工智能 60 周年一举“成名”。有趣的是，几乎所有这些突破都始于一些学术中心，并且都借助于工业界的资源使其成为现实。


    与自动驾驶相比，哪个更难本身不是一个可“一言以蔽之”的问题，开车不存在“九段”，熟练、不违规就行，但它们有共性，即模式识别，自动驾驶一定程度的突破要早于下围棋程序。若将算法比喻为“鱼”，计算能力的提高是一个条件，但非决定性的，“大数据”则是“水”，由此，人工智能才能“如鱼得水”。自动驾驶要到达高级水平很难，但从模式识别角度仔细分析，那不是识别不了的，只是程序设计事先未考虑到那个情景。可由此体会所谓的“难”与“易”，连人都避免不了或难以做到的事情，或者说人的智能都不好应付的情景，不在人工智能的初衷范畴中。


    比如问，华罗庚和他的学生陈景润哪位强？华罗庚的社会贡献、整体水平是中国第一，但陈景润的“`1＋2`”的难度是中国学者所及最大的。怎么比呢？比如，王选的创新与产业是一旗帜，但就研究和学问言，吴文俊大。他们都是国家最高科技奖得主。他们是否可分别对应着自动驾驶与围棋程序？不过我们不能忽视如下情形。


    ●与机器比，棋手在明里。棋手面对的是一个从未遇到过的“新手”，而且是不同于对面而坐的人一样的“新手”；

    ●机器无感情，没有人因体力疲劳、心理波动而导致的情绪起伏、思维障碍，有经验的棋手面临如此情景，至少一开始是难以很好适从的；

    ●但计算的力量（即所谓“算力”）还是显而易见的，因为下围棋除了直觉、经验还依靠计算，这是机器的优势，“云计算”使机器有“群殴”之能。


    '
