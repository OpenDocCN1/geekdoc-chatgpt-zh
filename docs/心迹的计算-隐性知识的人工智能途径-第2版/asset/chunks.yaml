    接着正异常分类，各种症状的分类是进一步的具体工作，比如房颤等检测灵敏度、特异性和准确率均近99%。由于很多其他团队的工作仅限于MIT-BIH等数据库上的测试，没法在CCDD上两两直接比较。就对心电图本身的认识、不同分类方法特点比较、临床需求满足而言，与迄今为止公开发表的结果比我们具有整体上的优势，但临床应用方面有待更大范围的检验。就个体而言，算法的错误结果风险比单个医患交互要高，但有效算法在诸如提高效率、降低成本、普惠大众方面的回报是显然的。一个在评价指标上表现出色的算法如果没有临床上的实际价值便没有多大意义。


