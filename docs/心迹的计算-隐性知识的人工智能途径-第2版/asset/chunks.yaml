- raw: "治学三境也可谓成长三境。在众多的预言、到处的研发、不断的讨论中，大语言模型不仅已在“灯火阑珊处”且试问“天下英雄谁敌手”了。境界未必都高尚、难能，日常、平凡亦现，比如公共场合随手关灯、节约用电等，两辆电梯同时到达、电动门不断升降、白天路灯照亮的情形的减少等，都是小事但全社会累计则十分可观。发电技术给人类生活带来了划时代的改变，人们逐步适应并漠然，背后是能源的消耗。人工智能会带来更为惊人的变化，想必也会有随之的浪费。\n\
    \n笔者当年在软件学院的工程人才培养实践中，形成“贯通知识、强化能力、重视素质”的教学理念［10］，后进一步细化三个概念如下。\n\n知识包括：\n\n常规：生活经验，待人接物，基本判断；\n\
    \n专业：领域内容，普及概念，实践训练；\n\n经验：摸索积累，反思精化，隐性知识等。\n\n它们有“专常隐显”特点，“专”指专业知识，“常”指常识，“显”指显式知识，“隐”指隐性知识。不同课程、课本与实践、常识与专业知识之间都有融会贯通问题。\n\
    \n能力涉及：\n\n技能：主动了解问题，积极面对问题，努力解决问题；\n\n交流：沟通，分工，协作；\n\n执行：分析，规划，部署等。\n\n这需要实践锻炼，远非“动口不动手”能了事，可概括为“分解组合”：“分”指分析问题、凝练需求，“解”指解释情况、解决困难，“组”指组织、协调资源，“合”指合作、互助。\n\
    \n素质关乎：\n\n品质：个人素养，健康人格，社会责任；\n\n精神：科学思想，逻辑思路，辩证思维；\n\n涵养：人文情怀，审美眼光，自律利他等。\n\n\
    主要内涵或基本要求大致是“行善思美”，“行”指行动、奉献意识，“善”指完善、感恩心态，“思”指反省、设身处地考虑，“美”指品位、鉴赏情趣。\n\n窗口服务员不熟悉业务，轨交工作人员对附近机构、道路茫然无知，都是基本素质不够的表现。随着技术进步和时代发展，三者的比重逐步变化，由前往后倾斜，知识日益可由机器辅助，素质则越发重要，那由良好的环境、生态自然而然孕育而成。\n\
    \n教育与其结果即受教育者的关系会或被认为是鸡生蛋还是蛋出鸡问题，笔者以为蛋出鸡相对可言：可能是别的禽蛋在孵化过程中产生突变，产出“鸡蛋”，然后可以进一步孵化，从此有了新物种“鸡”，反之没法说^([\\\
    [8\\]](#txt008.html#footnote_content_txt008_8))。类似地，受教育者如果是可塑之“蛋”，就可能导致其日后规划的教育过程踏上正规，因而寄希望于先尽量将受教育者的普遍水准提高一些，使得社会整体状况逐步改观。先改变既有状况（制度）道理上也通，但事实上不成，因有可能去改变的人理念不到位，于是也就不会有行动，谁会、谁能去动那“奶酪”呢？如钱学森指出［11］：“人的行动决定于人的认识，不只是德育，更大范围的是教育。”所有人都受教育，每个人的行为都是教育之果。\n\
    \n教育目标一方面应务实、合理、可达，另一方面则要开放、普适、自然。若普遍达不到要求从而滋养纸上谈兵习气、虚伪高调作风，或者事不关己态度、唯我独尊心态，不如以多数公民合格为要。就如关于高等教育多有精英教育或普及教育的讨论，与其大学毕业但不合格、找不到合适工作，不如重视基本素养熏陶、加强通识教育，拥抱与人工智能的互补与合作未来，从而让大家都以积极心态融入工作、愉快生活、服务社会。\n\
    \n“文心一言”的回答是“以自我为中心”的一种反映，但以自我为中心不一定等于自我、自私，比如追求自我完善、自我修炼、自我约束不错，惜乎当下普遍现象是只顾个人而将责任推诿于人，这是很多社会问题的根源所在。从事物发展受内因、外因两方面影响看，如果人人强调外因，认为问题在别人，则问题解决就没有由头了。\n\
    \n博弈论为不同人的意图及其构成的群体行为刻画提供了分析框架，是人工智能研究的理论之一。当某个系统本身不断受参与者认知的影响，情况就会变得更为复杂，比如股市，尽管笔者没炒股的经历，然而容易明白任何时刻的股指随时受到股民情绪的影响，这使得其预测比通常的时间序列困难得多。预测优化方法包括分析错误结果的导致原因，既有模型结果的比照与优化，以及迭代分析等，即用有效数据构建初步模型，然后获取实时数据进一步修正之，如传统特征的取舍和新特征的确定，同时与有经验者的分析结果作平行比对，进而形成综合决策机制。既有模型和个体经验各有优劣，没有哪个可以保障无误，预测结果也只能是一种参考。\n\
    \n这思想可用以分析投票这个于人是外因、于己是内因的本质，那是社会成员表达意愿、达成共识的一个环节，同时也是参与社会工作、履行个人职责的要求，不能仅限于形式公平，甚至流于滥竽充数。\n\
    \n以最基层的“业主委员会”为例，居民可能于其有各种看法，然而委员是被选出来的，所以居民不可一味责怪“委员”，而应反思是否认真推选了对象、他们是否符合基本要求。有时候“委员会”难产，影响了居民日常生活，但那状况未必不如轻率弄出个不负责任的委员会。依次类推，各级机构、部门，代表、委员认真行使自己的推荐、选举权力乃常规要求，切忌人云亦云或应付了事，到头来被推举者没做好抑或胡作非为，投票人却觉得与己无关，那没法自圆其说。就如一个“神童”，天资非努力而得来，别人讲故事、后来翻篇了，议论往往针对神童，其实应着眼“造神”事本身。\n\
    \n无疑，即便大家推出了合适人选，不见得事情就会圆满，然而问题总要有个切入点。这些代表也是被选出来的，那就恰好表明最终在于每个个人如何对待其选举或推荐。\n\
    \n据报道有位连续十几届的人大代表没投过反对票从而被当作失责典型。在相当长一段时间里，举手同意是普遍的现象，即便当今，想来还是投赞成票者占多数，由此可推测，多数人也是常投赞成票的。不可忽视的是，投反对票者未必就是客观者。\n\
    \n有些事无投票过程，有些事投票本身没错、过后出了问题。对于前者，为何可以不投票？其实还是一批有投票资格（或资源分配决定权）的人导致的；对于后者，出了问题若继续投“赞成票”，问题依然在投票人。大家投票表决的各项法规是社会约束、是“笼子”。认识到各自的角色与责任便是一种境界，那也是教育的基本任务，前进中难免阻力和困难，空言、空想、空望、空等到头来无非“四大皆空”。\n\
    \n关于人工智能的安全、可信等表现及其是否需要监管本身是一个较为具体的可以通过投票以法律形式给出规范的命题（2023年11月1日英国主办了“人工智能安全峰会”，参会各方签署了关于人工智能国际治理的《布莱切利宣言》），这里有不同的视点、不同的价值观、不同的认识模式，是一种思维方式的博弈，其结果将引领深刻而全面地影响人类社会的人工智能的技术走向。\n\
    \n相传梁武帝将围棋诏定为九品，每品是一种境界。九品可分为两种层次，以五品为界，以下为技术境界，以上才进入艺术（或精神）境界［12］。前者是基本功，后者与经验、悟性、诸多不可言传之“妙”密切相关，并非“如数学一样的抽象系统”。“技进乎道”既是成长的过程，也是成熟的标志，只是在此过程中，不能偏离人工智能的原始意义与目标，不可轻视人工智能本身的未知与困难，不该抛弃衡量人工智能成就的前提与原则。\n\
    \n7.5　实践为尚\n\n人工智能的物质基础即人脑及其功能是在不同的时间尺度上演化的，它们的跨度非常大，例如：\n\n第一，在种系进化中脑和认知的演化。人类的脑和认知演化的时间尺度是数十万年到数百万年以上。\n\
    \n第二，在个体一生发育和生长中脑和认知的演化。人一生中脑和认知演化的时间尺度是数十年到百年以上。\n\n第三，在个体生命的一定阶段中脑和认知的进化。例如人在一定阶段的学习过程中脑和认知演化的时间尺度是数天或数年。\n\
    \n第四，在个体当前的认知过程中脑和认知的演化。例如人进行某一种短暂的认知活动中，脑和认知演化的时间尺度可能是几百毫秒、几十毫秒、几秒、几十秒或几百秒。［13］\n\
    \n恩格斯说：“……以至我们在某种意义上不得不说，劳动创造了人本身。”［14］劳动是人类的本质活动，工具、社会关系、思维和语言等都是在劳动中完善的，人类本身是在其中进化的。马克思说，只是由于劳动展开的丰富性，“主体的、人的感性的丰富性，如有音乐感的耳朵、能感受形式美的眼睛，总之，那些能成为人的享受的感觉，即确证自己是人的本质力量的感觉，才一部分发展起来，一部分产生出来。”［15］\n\
    \n如果说人类以前制造的工具是其双手的延伸，那么计算机作为代替人脑进行信息处理的工具，是大脑的延伸，而传感器则是感知器官的延伸。即使有了更为符合人脑思维特征的新型计算结构问世，没有感知能力，智能模拟在某种程度上就是一个伪命题：有假设，在具备已知条件前提下可以解题，若假设不成立，所谓解题就只是“务虚”了。理论是华丽的，有时也是局促的。\n\
    \n已有的大量计算方法，既对应不了脑内过程又难以解决面临的问题，且没有缩短与目标间的距离，从效果看则多是相似程度的重复。就像本来要向北走，免不了遇到恶劣天气，气温也较低，就朝东方海边过去了，那里阳光明媚、景色宜人，但距目的地越发遥远。\n\
    \n爱因斯坦说过：“有些科学家拿着一块木板，寻找它最薄的部分，然后在这些钻孔容易的地方钻了大量的孔，我对这些人是没什么忍耐性的。”［16］诺贝尔奖得主德迪韦（C.de\
    \ Duve.）说：“我们中的大多数人缺乏洞悉宇宙奥秘的超凡才智，而只能做些为既有科学大厦添砖加瓦的工作。”［17］无论钻厚板还是添砖加瓦，一要真实，“伪科学”不在其中；二要切实，是社会需要或者符合科学规律的；三要如实，即使失败也可以有借鉴意义，可怕的是没有效果。\n\
    \n实践大致有三个方面，第一是人们改造世界的活动，比如我们国家的改革开放，我们社会的信息化、工业化；第二，特定的探索，比如航空、航天、航宇；第三指相对于理论的应用，比如现在几乎各行业言必称人工智能，是指人工智能技术的应用。人类社会中，实践比理论的历史久远，其间，只有少数科学家做出或有现实意义或有历史影响的成果，大部分是当时的一朵浪花。至于工程技术人员，更应面向应用需求开展工作。所谓原创，针对基础研究较恰当，其他的则宜强调解决问题。\n\
    \n学以致用即指理论用于实践、理论指导实践，比如物理定律解释天气现象、数学计算帮助分析药物性能，这些都是理论的价值。实践与理论的关系可概括为“上、下、左、右”原则。“上”指实践比书本知识更为根本，应用是知识学习的目的；“下”意味着应当下沉到基层、一线才能发现问题，明确需求；“左”取“佐”意，使其辅佐理论知识使之完整，从而互相结合成为有机整体；“右”则有地位更高（如“无出其右”）之义，即所谓实践的观点是辩证唯物主义认识论首要的和基本的观点。\n\
    \n人工智能众多定义中的一个是：用机器模拟人类智能，反过来加深对智能本质的理解，不限于生物学上可解释的情状。第一点是本来内涵，第二点基本未果，第三点一直如此。关于量子物理的关键困难，“物理学正急切等待答案到来。但是，这些困难在何时解决，在何处解决，都无法预见”。［18］人工智能在预见上亦相似，只能在实践中不断寻找可能的方法，获得崭新的启发。《往生论注·上》有句“智断具足，能利世间”。人工智能亦如此。\n\
    \n7.6　本章概要\n\n面向计算机辅助诊断与创作具体问题，以隐性知识学习为核心的人工智能途径如图7-2所示。\n\n![](images/txt008_3.jpg\
    \ \"pagenumber_ebook=180,pagenumber_book=172\")\n\n图7-2　拙著所及的人工智能环节及其相互关系。箭头框表示发展过程，实线箭头表示由下而上的支撑，双向虚线表示互相间或明或暗的影响。\n\
    \n●大语言模型是当今时代的“风口”，但只是阶梯，各类数据是它的基础，而信号感知更非其所能；\n\n●深层神经网络的惊人成就会让人倾向于“唯此独爱”，其实推理与学习两者融合更合智能本质；\n\
    \n●隐性知识学习或隐或现地存在于人工智能问题中，特征充要性分析则是优化各类求解方法不可忽视的环节。\n\n飞来峰上千寻塔，闻说鸡鸣见日升。\n\n不畏浮云遮望眼，只缘身在最高层。\n\
