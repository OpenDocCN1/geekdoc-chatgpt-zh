    1.3　递归结构


    有反馈的动力系统与无反馈的前向系统相比有其优点，对于某些问题，一个很小的反馈系统可能等价于一个很大的甚至无限的前向系统。对于网络而言，可通过增加“递归联结”来实现这一想法，从而顺序行为可保留前一响应。可将其称作“上下文单元”，它同样是“隐层单元”。递归神经网络就是具有反馈的神经网络［3］，其结构如附图1-1所示［4］。


    ![](images/att001_25.jpg "pagenumber_ebook=189,pagenumber_book=181")


    附图1-1　递归神经网络结构


    设在时间t，输入单元接收第一次输入，上下文单元初始值为0.5。输入单元和上下文单元激励隐层单元，隐层单元前馈激励输出单元，还反馈激励上下文单元。这构成了向前激励。递归联结固定为1。在时间t＋1，上下文单元包含恰好为隐层单元时间t时的值。这使递归网络具有动态记忆能力。


    在前馈网络中，隐层单元实现输入模式的内部表达。在递归网络中，上下文单元记录前一内部状态。从而，隐层单元映象外部状态和某一期望输出的前一内部状态。因为在隐层单元上的模式为上下文单元所保存，隐层单元要完成这一映象并同时表达顺序输入的时间特征。因此，内部表达敏感于时间内容，时间的影响隐含于这些内部状态中。


    设网络的外部输入为u（k－1）∈R m，输出为y（k）∈R，隐层输出为x（k）∈R n。又设W 1、W 2、W 3分别为输入层到隐层、隐层到输出层和上下文单元到隐层的联结权矩阵。


    网络在k时刻的输入不仅包括目前的输入值，还包括隐层单元前一时刻的输出值x c（k），即x（k－1）。这时网络仅是一个前馈网络，可由上述输入通过前向传播产生输出，用反向传播算法进行联结权的修正。在训练结束后，k时刻隐层的输出值将通过递归联结部分，反传回上下文单元，并保留到下一训练时刻（k＋1）。


    设f（·）和g（·）分别为隐层单元和输出单元的激发函数所组成的非线性向量函数，α为上下文单元的自反馈固定增益，则有


    ![](images/att001_26.jpg "pagenumber_ebook=190,pagenumber_book=182")


    f（·）和g（·）可分别取为：


    ![](images/att001_27.jpg "pagenumber_ebook=190,pagenumber_book=182")


    ![](images/att001_28.jpg "pagenumber_ebook=190,pagenumber_book=182")


