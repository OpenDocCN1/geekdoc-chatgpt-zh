    ### 后记


    祝嘉先生著述多半束之高阁，直到老人逝去 20 多年后，《祝嘉书学论著全集》在国家出版基金资助下问世，那是一位理论权威、实践勇士不断修正和完善的思想轨迹与生命历程。在惶惶八卷面前，想来很多读者一下子不便领会主旨、抓住要领。祝嘉先生则言，前著有的结论后来看来并不正确，有的是文言文或文、白相间，有的则有了更深入的看法，因此有不少主题重叠的后著。本编选择原则如下：


    第一，概要呈现祝嘉先生独特书学理论；

    第二，若有多次谈及的话题取后来或完整的内容；

    第三，与书法学习的基本方法并非直接相关者不在此列。


    祝嘉先生在其《〈书概〉疏证·小引》中谦逊而坚定地说：“我是一个碌碌无所长的人，而只有好书法的癖，也可以说是我短中的寸长，即无所长，以贡献于祖国、于人民，想竭其绵薄，也只有书法这一点点了。”那是何等的谦虚、又是如此的自信！祝嘉先生眼界开阔、思维开放，指出后来总比以前有发展、更丰富，同时观念辩证、胸怀远大：“所以临书，取和自己的书体，离得远的更好。凡事要它进步快，就要大大改革，没有大改革，就没有大进步，苟且因循，虽然努力也做不出什么来。”（《书法三要》）


    结合自己的肤浅认识、学习古代书论并读《祝嘉书学论著全集》，笔者梳理出此提纲，要旨是取精用宏、有效方法、全面训练、字外功夫和眼界熏陶。其中方法是首要的，为何同样方法在不同学习者那里会导致不同表现？除了方法本身的掌握需要一定的认识和实践过程外，自我的定力、外部的影响施以颇大影响。就如当今社会，选择多元，改行者众，未必按原来方法做不好，而是“另辟蹊径”了。


    本选编的初衷是让读者尽可能方便地了解祝嘉先生的思想精髓，同时也希望在尽可能大的范围里延续其言行。


    少耽八法慕前贤，到老无成负此身。


    徒托空言谈著述，不如一笔能通神。


    ——祝嘉《九十初度书怀·其四》


    ## 附录 5 第一版后记


    曾经有一个名为“基于经验的认知”的“香山科学会议”的预告，“夏商周断代工程”首席科学家、当时已到清华大学工作的李学勤先生是发起人之一。后来笔者打电话请益，李先生告知当年读的是清华大学哲学系，学逻辑，金岳霖先生是其老师^([\[10\]](#att001.html#footnote_content_att001_10))，这样的背景对认知科学有兴趣是自然的。那个会议后来没见召开。其实笔者在生活中常常由于忽略经验而面临不便，譬如不愿多带一块电池板或携带一个充电器，因移动电话没电而耽误事情或浪费时间。日常生活经验当然不同于专业领域经验，对待经验的态度则可能有共同之处。就笔者的程序设计背景而言，从汇编语言到高级语言，从用户界面到核心算法，曾经夜以继日甚至通宵达旦，但终究没有像医生专家那样拥有足够的专业领域经验而渐行渐远。


    如今，笔者踏上工作岗位已近 30 个年头，从事的研发工作，有的仅是实验室的演示，有的纵然在企业中实施也未能走上产业化之路。10 余年来我们课题组的心血管系统体征感知与症状分析工作可能差强人意，其中与诊断准确性有关的因素包括医生诊断思维过程的建模和大量实际数据的获取及其特征标注，前者与演算过程、诊断规则有关，我们的诊断机制应该符合医学专家的思维特点；后者和问题分析、临床需求相连，没有丰富的实际数据用于训练和测试，就没法发现差错所在并寻根溯源。计算机书法创作建模与自身的经验和体会直接有关，但停留在了演示阶段，在学习、实践的同时花费了资源而没有更多“输出”，不免内疚、惭愧。不过，我们的研究，关注形象思维与抽象思维模拟相结合、人机结合，核心是隐性知识挖掘和整体思维模拟，本身算是一点经验，就与一些同道的交流言，于读者会有不同程度的启发。


    也许是工作经历的缘故，使得笔者相对容易接受王阳明的知行合一阐述，马克思主义经典作家的抓主要矛盾、重视矛盾的主要方面的理论，这些思想给予了笔者信心和勇气。拙著所述“心迹”的计算是联系人工智能技术和现实应用的载体，其中思维过程模拟是主要矛盾，而隐性知识的形式化和整体思维过程的刻画则是矛盾的主要方面，笔者作如是观。此前的小册子《人工智能哲学》出版约半年后，据出版社库存统计那时已销
    3 000 册中的大概 60%，这个比例令笔者有点惊讶。后来，科学出版社的信息、数理、技术等分社分别有编辑约稿。笔者曾考虑将拙著内容加入后出版《人工智能哲学》第二版，那将是改进不足、完善认识的机会。不过在差不多同时的
    2012 年 4 月底，笔者收到时任中山大学哲学系朱菁教授的邮件，其拟在报纸上推荐拙著《人工智能哲学》的理由如下：


    作者思维活跃、涉猎广泛，虽缺少严格的哲学思维训练，对当代专业哲学的术语和论证方式显得有些生疏，甚至在讨论中不时落入简单套用“辩证法”和“辩证思维”的窠臼，但也因此少了许多思想上的羁绊与俗套，多了几分天马行空和不拘一格的灵动，文笔清新流畅、亲切自然。


    笔者颇意外，即回复朱老师。其过奖让笔者汗颜，其指正令笔者反思。朱老师本科毕业于中国科学技术大学计算机系，后为哲学领域的教育部“长江学者奖励计划”之特聘教授，平时话语不多，关于人工智能哲学，无论视野还是基础均颇有话语权。


    两年多以后，2014 年江苏书展期间，笔者在书店偶然发现复旦大学徐英瑾教授的著作《心智、语言和机器——维特根斯坦哲学和人工智能科学的对话》，这是一个正宗的哲学研究者的哲学思考和探索，不幸的是在书架上该著被归在计算机的“语言”类中，就像此前不久笔者见一本“认知神经科学”著作与医学的神经外科等书籍为伴类似。拙作《人工智能哲学》又被一位专业哲学研究者评及，惭愧有加，当然同样十分感谢。徐教授年轻而有学者风范，思维活跃，与朱教授一样，我们相识于一年一度的“心灵与机器”研讨会上。徐教授所指类似问题是：“董著所引的哲学思想资源，则更多地带有辩证唯物主义的遗迹。”“带有”是客气之说，辩证唯物主义作为与分析哲学等一样的一个学科方向，至少也是一家之言，有机会当重读经典、系统学习。2016
    年，在王飞跃教授牵头的人工智能主题的“听道”讲坛，组织者购买了一些讲者的书籍送给听众，王老师说《人工智能哲学》中国味太浓，笔者即说是的，按照李泽厚先生的说法，哲学是西方的，中国有的只是思想，与哲学本来的含义并不一致。王老师说是的。那时笔者才想到，谈哲学，得纳入经典的哲学话语体系，中国文化的思想及其给人工智能带来的影响，未必适合在冠以哲学的主题下讨论。


    拙著成稿后，笔者翻阅《钱学森思维科学思想》（卢明森编）。其中有钱学森先生谈到的一件事，说收到过名为《人工智能与认识论问题》的书后，他回复说：是本人工智能的入门书，挺好的，但提到认识论，那根本说不上。想到自己在十余年前也执笔过类似题目的文章，越到后来越觉得所谈太粗浅。钱先生所言极是。


    因此，尽管顾准说“方法论就是哲学”^([\[11\]](#att001.html#footnote_content_att001_11))，“人工智能哲学”话题过大，再以此题为名“胡言乱语”将更多地贻笑大方，于是有了如今题目，遗憾的是在这同时修改《人工智能哲学》的计划落空了。不过，拙著可以作为《人工智能哲学》的姊妹篇：那关于思想方法（尽管粗陋），这关乎技术理念。


    拙著背后是笔者课题组在心电图分析和书法创作模拟方向上的研究生的实践与经验积累的过程。毕业于中国科技大学计算机系的朱洪海选择到华东师范大学攻读硕士学位研究生，后到中国科学院苏州纳米技术与纳米仿生研究所攻读博士学位，他在研发上的成果几乎与我们的心电图工作同步。硕士生詹聪明在其实习阶段的心电图主波识别工作是我们该方向研究的开始。硕士生徐淼最早针对形态特征识别做了尝试，他的隶书笔画变形模型则是我们书法创作模拟工作的开端，是后来博士生张显俊及硕士生杨志军、赵琪、薛环振工作的基础。徐淼毕业后去美国攻读并获得博士学位，他所在学校的王松教授在给笔者的邮件中提到，徐淼是他在美国碰到的最优秀的学生之一。此言不为过，徐淼当年从华东师范大学数学系转到当时新成立的软件学院，此后又以名列前茅的成绩被保送攻读硕士学位研究生，无论专业基础还是科研作风都稳实。博士生王丽苹、张嘉伟、胡晓娟、周飞燕与硕士生童佳斐、朱侃杰、沈蜜、朱江超、李慧慧等分别从不同角度进行了有意义的尝试、实验、交流和分析。中国科学院苏州纳米技术与纳米仿生研究所的博士生金林鹏在朱洪海及硕士生张高登工作基础上的研究使得我们的分析算法能步入实际应用，这是一个里程碑。参加过心电图终端开发的有硕士生于志斌、何逸珉、吴杰、李皓等。这些研究生毕业后几乎都在工业界工作，诚挚感谢他们以及中国科学院“百人计划”等人才项目的支持，这些资助使得笔者能在宽松、自由的氛围中考虑一些具体而深入的问题。特别地，上海瑞金医院心脏科刘霞主任医师长期以来给予了专业指点与热情鼓励。诚然，对大家最有分量的感谢当来自可能受惠于本研究成果的社会与百姓。


    大慧普觉禅师有言：心术是本，文章学问是末。本小册子既是工作内容小结，亦是“余事”一桩。冯·诺依曼在其《计算机与人脑》“引言”中说：逻辑学与统计学应当主要地（虽然并不排除其他方面）被看作是“信息理论”的基本工具。拙著思想恰好是其在人工智能应用中一具体表现形式，即规则推理与统计学习（机器学习）的结合。


    钱学森先生说，从思维学角度看，对联的过程是：出联的上联是给出一个结构，请应联者据此去找零件填入这个结构，思维就在于搜索思想库找材料。他的体会是，形象思维是与上述答对联相反的：有材料，但无结构。思维的任务是拢形象，即结构。相反也相成。拙著各部分之首，是笔者集古代书法名碑帖字而成的对联，于各章内容似有关联而未必切题。既然对联是思维的一种形式，就不揣简陋敷列其中供方家一笑。但愿有更多像朱教授、徐教授那样的批评指正。


    2016 年 11 月 30 日


    于中国科学院苏州纳米技术与纳米仿生研究所


    【注释】


    [\[1\]](#att001.html#footnote_quote_att001_1)笔者总觉人工智能研究之方法论十分重要，以至于曾出版拙著《人工智能哲学》（2011
    年科学出版社出版）。有友人提出再版事宜，笔者婉拒了，因后来看标题就不合适，内容更不合意。既成往事，无法改变。


