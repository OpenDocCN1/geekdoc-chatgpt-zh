- raw: '这里强调“辅助”，即不是要让计算机完全替代人，而是给人以帮助，相应的算法可以在网络医院的服务器上运行，帮助医生进行正常、异常信号的分类或常见心律失常疾病的诊断，提高工作效率；也可以简化后在终端上工作，为最终用户提供实时的参考，使之及时得知自身状况。


    2007年关于GE心电图机的诊断结果有个统计，共有1 858例心电图，总准确率为88.0%，其中窦性心律的心电图判读准确率为95%，非窦性心律的判读准确率仅为53.5%［15］。2012年的类似工作统计了576例心电图，发现Philips
    Medical的准确率是80%，Draeger Medical Systems为75%，而3名普通医生的心电图判读准确率平均为85%［16］。随着这些年技术的进步，算法“水平”逐步提高，然而医学涉及的不单单是演绎推理、统计思维，而是复杂的因果网，有经验的医生不但具备丰富的领域知识，而且在实践过程中对知识系统进行了良好的整理，尽量消除了各种冗余，使之具有良好的层次结构，因而，计算机辅助诊断领域依然有很多工作要做。


    4.2　整体判读


    就疾病分类而言，区分正常与否是一种分类；区分心律失常、高血压是一种分类；区分早搏、动脉粥样硬化同样是一种分类，它们的出发点和粒度都不同。图4-3是MIT-BIH-AR标准数据库中标记为“正常”的心电图记录，实际上据医生告知是间歇性预激，主要特征为主波QRS波群宽大畸形、起始段有预激波（δ波），伴ST段和T波改变，PQ间期缩短，正常心电图与间歇性预激交替出现。


    ![](images/txt005_4.jpg "pagenumber_ebook=93,pagenumber_book=85")


    图4-3　在MIT-BIH-AR中被标为正常的异常心电图


    MIB-BIH误标记的原因是其所用的判断规则中遗漏了医生实际使用的一些经验，比如观察动态变化以把握全面情况。图4-4是正常心电图，2～4 s箭头处是突发噪声导致的信号下移，导致提取ST段、P波形态、PR间期等特征时出错，由于不易排除该噪声，现有的分析算法常常将其误判为异常。


    ![](images/txt005_5.jpg "pagenumber_ebook=94,pagenumber_book=86")


    图4-4　正常心电图


    图4-5中，医生通过RR间期这一直观参数，能够很容易找到RR间期突变的心搏（8～10 s处），根据脑海中模板，辨别出它是房性早搏，是实际可能出现的突变心搏，该心搏将作为一个重要结论出现在诊断结果中。而对于在2～4
    s处的T波异常的突变心搏，理论上不会突然发生，是噪声所致，医生将忽略之。


    ![](images/txt005_6.jpg "pagenumber_ebook=94,pagenumber_book=86")


    图4-5　窦性心动过缓，肢体导联低电压偶发房性早搏T波低平


    归纳而言，临床诊断中，有经验的医生面对心电图作如下处理。


    第一，整体把握：先看是否有大的异常噪声（比如大于主波），突变信号通常不会是心电信号，此类信号可直接放一边；同时关注节拍、形态等是否大致一致；有时单个心搏似乎接近于正常类型，若结合前后数个心搏，则可以发现比较明显的病变性质；反之，单个导联可能有部分特征不正常，结合病史及其他导联的情况则没有问题。


    第二，心搏分类：寻找心电图中的“平均心搏”和“突变心搏”，出现较多的一类可划归为“平均心搏”，该类代表了总体情状，包括平均间期、大致幅度、相似程度、对比关系、变化趋势等。短时间内，疾病导致的突变可能性较小，此时当略过不合理的“突变心搏”，寻找代表性心搏。


    第三，交叉处理：提取心搏之间局部特征和对比关系，有的心搏可能同时表现了某两种疾病的部分特征，有时候两种疾病特征在连续心搏间交替存在，大多数特征都处于临界位置。一条心电图记录只允许出现某些种类的突变心搏，对于不会出现的突变心搏，可直接判断为噪声或无效心搏。


    计算机辅助分析则还要考虑系统的性能、指标的范围、运算的效率等。相应地，以往的分类器设计工作中则存在一些共性问题。


    第一，忽视医生的介入，缺乏对医生识别诊断过程的理解，特别是忽视了医生经验的作用，有“自言自语”之嫌。


    第二，部分数据的测试会使结果“太好”，需要更大规模的数据库；而盲目应用某种数学工具的结果往往难陈其详。


    第三，医生把握症状是由宏观到微观的过程，形态特征十分重要。图4-6、图4-7、图4-8是QRS波群及P波与T波的一些形态特征例子［17］。


    ![](images/txt005_7.jpg "pagenumber_ebook=95,pagenumber_book=87")


    图4-6　P波与T波的形态


    ![](images/txt005_8.jpg "pagenumber_ebook=96,pagenumber_book=88")


    图4-7　QRS波群中的粗钝与切迹


    ![](images/txt005_9.jpg "pagenumber_ebook=96,pagenumber_book=88")


    图4-8　P波与T波的形态


    QRS波群中不同正向与负向波（子波）的组合与命名方式是：第一个向下的子波称为Q波；第一个向上的子波称为R波；R波之后的第一个向下的子波称为S波；R波之后的第一个向上的子波称为R′波；S波之后第一个向下的子波称为S′波。通过不同的Q、R、S、R′和S′的组合，能够产生诸多不同的QRS波群形态。例如，完全正向的QRS波称为R型；完全向下的QRS波群称为QS型；其他还有QR、q
    Rs、RSR′、r Sr′等。这里大写的子波字母用于表示振幅较大的子波，小写的字母标示振幅较小的子波。目前临床上尚未能给出统一的振幅大与小的边界值，而幅值的比例是可以参考的又一种参数。


    医生判读的结果或计算机辅助心电图诊断的目标如图4-9所示。


    ![](images/txt005_10.jpg "pagenumber_ebook=97,pagenumber_book=89")


    图4-9　分类层次结构


    4.3　启发内省


    在科研活动中，逻辑思维是必不可少的，它往往意味着概括、缩略、精简、归纳等，这同时也可能导致信息的不全或丢失。比如中国科学院苏州纳米技术与纳米仿生研究所，简称中科院苏州纳米所或干脆叫作纳米所，别人一听，就以为都是从事纳米科研的，实际上人工智能与“仿生”有关，由于简略的缘故，产生了误解或歧义。当然，人工智能离不开信号感知载体即传感器技术，这是与纳米技术有关的工作，这需要进一步解释才能被理解。


    很多知识的理解与应用有类似情况。教科书里现成的被整理好的规则是归纳出来的规范的知识，有代表性但往往是示例性的。心血管系统专家王士雯院士说过：“一个有经验的大夫和一个刚毕业的医生的重要区别是，刚毕业的医生主要是凭书本上的知识，于是容易犯简单化的毛病。”［18］


    知识不仅依赖于自然获得的、关于世界在发生什么的经验，而且依赖于人为地、有目的地设计的实验，这些实验被用以产生在正常的自然过程中不能观察到或至少是难以观察到的现象［19］。从“知觉”和“注意”着手，设计认知心理学实验以图寻找医生诊断过程中视觉跟踪的机制和注意点，获得新的特征及其集合是一个途径。例如，利用眼动仪，分别记录普通人及专家读心电图时眼睛的运动、注意过程和聚焦点，甚至结合功能性磁共振成像技术同步记录大脑的活动情况，寻找心电图中被特别关注的特征集合。


    这个过程依靠医生自我的反思、追索和比照。构造主义心理学是冯特（W.Wundt）和他的学生铁钦纳（E.B.Titchener）创立的第一个心理学学派，认为心理学的研究对象是意识经验或直接经验，而对主观经验进行观察的内省过程是其主要的实验途径。由内省而逐步了解细节，对人而言是明确的，同时又是困难的任务，很多事情“妙不可言”，无法用语言描述或表达。《论语·颜渊》云：“内省不疚，夫何忧何惧？”提倡“见贤思齐焉，见不贤而内自省也”，其内省的出发点是为人处事的道德层面的完善或修正，反省的对象是每天的个人经历和内心世界，它们的内容可能是纷杂、零散的。而诊断等专业领域的隐性知识有具体的针对性，对其内省有助于将其转化成显性知识。


    也有“内省”而不得结果的情景，比如对“畸形”之类的概念如何刻画就十分困难，原因是目前没有良好的数学描述手段。而医生给出的判断规则并不能完全表达出医生的完整思维过程。我们只能以医生已经表达出的知识为基础，利用不同的方式去“学习”医生没有能表达出来的知识。若能保持诊断规则核心思想不变，设计间接规则进行判别也有效。比如早搏，对前后相连心搏做相似性比较（间接规则），判定相对容易。不同数据集上的不同方法的测试结果的不同，让人逐步体会和认识到了差异背后的原因，并导致诊断规则的精化。


    一般来说医生给出的诊断规则未必包含全部的特征细节，或包含了一定的冗余特征。严格按照医生规则来设计分类算法，将难以处理不可避免的结果不一致问题，以书本中关于窦性心搏的判断规则为例：


    （1）P波形态正常；


    （2）PR间期＞0.12 s；


    （3）规则的PP间距突然出现窦性P波脱落，形成较长PP间距，且长PP间距与正常PP间期无倍数关系；


    （4）过长PP间距之间可见逸搏或逸搏心律。


    上述诊断规则中的“突然”“较长”“过长”等词语的含义均不具体，也难以由计算机处理。修改后的规则如下：


    （1）P波出现在每个QRS波群前，规则的PP间期中出现长PP间期（长PP间期：PP间期＞1.5 s）；


    （2）长PP间期不是正常PP间期的倍数；


    （3）PR间期：0.12～0.20 s；


    （4）QRS波群：＜0.11 s。


    此时就可以用程序实现了。我们根据书本整理了近30条常见心律失常的判读规则，请有经验的医生提出修改意见^([\[3\]](#txt005.html#footnote_content_txt005_3))，然后据此在仿真环境得到初步结果，它们与医生的诊断有差距。我们以医生关注的特征为线索和依据，以现有资料为参考，与医生进行互动。所以进行验证是必不可少的，这是一个实验运算——结果分析——矛盾发现——规则精化——再次实验的不断完善的过程。我们的实践、医生的经验和对隐性知识的挖掘，使我们获得了一套符合实际情况的诊断规则。由于医生的整体思维过程是难以完全由规则本身表征的，我们还将利用机器学习方法捕获难以被“和盘托出”的隐性知识。


    4.4　特征选择


    计算机辅助诊断中的特征选择、特征识别、特征提取［20～22］十分关键，然而不分青红皂白对原始数据提取数理特征的做法并不可取，简单的线性变换或积分变换不足以刻画本质，而将原始高维数据降为低维数据的过程难免丢失信息。另外，在某个数据集没有贡献的特征，在另一个数据集可能有贡献。自然地，应该回到对原始数据提取临床诊断特征上，笔者由此想到的问题是，目前所识别的特征是否是分类的充要条件，一方面，目前所识别的特征是否均有同等程度的重要性；另一方面，是否还有未被重视的特征。特征指代表性指征，一方面希望就此能洞若观火，另一方面恰如其分即可，就如演员拍戏前准备需要清晰的镜子，如果练功矫正动作，或许电视机的大屏幕即够。


    再以心率分类为例：临床上心率小于60次／分钟为心率过缓，大于100次／分钟为心率过速，处于60～100次／分钟为正常心率，因此，只需要检测R波，通过简单计算就可准确获取心率，可据心率范围将心电图分类问题划分为3个部分，在此基础上，以RR间期均匀与否为准则进一步划分出2个子过程。由于R波检测算法也会出现错检，对于给定时长的心电图数据，若R波个数明显过少或过多，则需要额外处理。具体的判定准则有赖于就大量的临床数据做全面分析，也就是说，可以根据已有特征综合出新的特征。


    经过心率快慢和RR间期是否均匀分析，就建立了一定程度的先验估计。RR间期不均匀很可能是房性早搏、室性早搏或者心律不齐等，否则可能是传导阻滞或正常情况。综合信号质量和疾病类型的先验估计，以及已检测的R波位置，从不同的增强角度进行数学变换，再根据先验估计、多导联互参可较好地定位各特征点。


    于是，有了包括RR间期是否均匀在内的一些间接特征。比如，相似度特征：由于同一个人同类型的心搏具有相似性（不同人之间相同类型的心搏则未必，有时相差较大），不同类型的心搏则表现出某种差异。因此，在同一条心电图记录内对前后相连的若干个心搏作相似性评估，比如对早搏可有效判定。突变心搏特征：在同一心电图记录内利用相似度对心搏聚类，把元素较多一类划分为“平均心搏”（整体情况），其余则是突变心搏，代表疾病或者噪声导致的无效心搏。突变心搏并不能直接据以判病，但可以给后续分析提供一定程度的先验估计。结合这类特征对分类分层次划分，可形成不同的分类器。


    深层神经网络技术普及后，多数工作直接将原始数据输入给神经网络，这与信号处理、特征识别、模式分类分阶段对待有异。脑内过程到底如何总有其普遍机制，而智能模拟以效果为要，说明一方面不必都如脑内过程，另一方面完全映射之困难。也许分阶段是认识不足时的权宜之计。


    筛选特征、组合特征、加权特征等与科学哲学中知识“证伪”相合。波普尔（K.Popper）指出“证实”一说不能明确区分科学和形而上学，那里有看上去规范的论证。“证伪”说用在科学上容易让人生疑，它针对知识为真并非“放之四海而皆准”，同时蕴含了科学知识的开放性，若非如此即知识不能为伪，那就如同宗教了。新知识的获得、新认识的呈现多出现在理论已不适用并与实践不一致时，时代呼唤尚不“显式”的知识或者新理论面对之。


    隐性知识逐步显式化可说是显性知识被证伪（原来的书本知识不完整或不确切）的过程。知识体系之所以可为真，是因为至少其内部各个真命题之间能相互支持，且与实际状况不发生矛盾，然而人类知识具有不完备性、不确定性和不一致性和逐步显现等特点，其中不完备部分所缺失的可能是未知的知识和没有被显式表示的知识，因此知识需要不断被更新或完善。当某个命题被“证伪”了，可修正该命题，比如心电图诊断规则的精化，这与软件不断通过调试完善类似。


    若言知识只能“证伪”^([\[4\]](#txt005.html#footnote_content_txt005_4))，则绝对化而且例子太少，比如相对论超越了牛顿力学，若把超越相对论作为目标则几乎不可为，至少目前物理学家不会那么干。这也反映翻译用词、知识共享的一个侧面，尽管各种语言对等从而可以互译，然而微妙内涵、语义差异难以到位，其实即便本国语言的理解也有类似问题。所以“证伪”一词本身也可“证伪”，以使其更符合中文语境，知识的精化、理论的完善、认识的上升等可能更容易理解，也更符合其意。广义而言，亦可谓是隐性知识。


    4.5　分类设计


    设特征提取函数为g（x），分类函数为h（x），则心电图决策函数f（x）即为复合函数h（g（x））。机器学习方法在此作用显然，然而并非“一手遮天”起了主导作用，主要的机器学习方法借助于核方法和人工神经网络。1995年，凡普尼克（V.N.Vapnik）以其统计学习理论为基础，在感知器基础上提出了支持向量机，基本思想是利用核函数把低维空间的非线性问题映射为高维空间的线性问题［23］，优点是网络结构可自适应调整，由于是凸问题使得对参数优化变得容易；缺点是训练样本不能过大，其最终确定的决策函数又完全由训练样本决定，这是一个矛盾。因而，交给支持向量机的特征数最好少而又具有足够的可分性，它需要好的特征识别方法来支持。人工神经网络的优点是其最终的决策函数可由用户通过指定神经元及其层数确定，并且在大规模样本训练时有优势，这些是支持向量机不具备的。但这导致其网络结构设计方面的问题，而更大的缺点在于参数的调整。改进方案是融入一些机制，帮助神经网络更有效地调整参数，如结合领域知识设计相关步骤等。


    深层神经网络得以提出和推广后［24，25］，在计算机视觉、语音处理、自然语言处理等人工智能的经典领域取得了显著的应用效果［26］，其中首要涉及的是卷积神经网络（convolutional
    neural net works，CNN），它先在手写字符识别这一二维图像理解任务中获得出色成果［27］。多导联心电图的数据形式类似于二维图像，是一个矩阵，可直接采用二维结构的卷积神经网络进行训练和分类。这种卷积神经网络一般对行方向和列方向数据均进行卷积计算，对图像而言是合情合理的（行方向和列方向数据均是相关的），但对多导联心电图并不合理，因为导联内数据是相关的，而导联间数据是独立的。不同导联都具有各自内在的属性，应有各自最佳的卷积核。在针对非线性函数拟合能力分析现有的数理特征提取算法（主成分分析、小波变换、高阶统计量、功率谱等）和分类算法（高斯混合模型、支持向量机、高斯过程、传统神经网络等）的基础上可以发现它们在拟合复杂非线性函数上的不足，由此设计并逐步完善了基于多导联心电图这种特殊的二维结构设计的卷积神经网络［28］。


    由于导联内数据是与时间相关的，采用卷积计算是合情合理的；但导联间数据是独立的，若要进行卷积计算，则不同导联所有不同组合情况都应这么做。然而就现有方法而言，无论怎样设计卷积核，都只能实现部分导联的卷积融合计算。既然卷积计算有这样的问题，就将不同导联间的卷积计算去掉，使得每个导联均有3个卷积单元，不同导联间的卷积单元互不相干。针对互相正交的8个心电图导联数据，共有24个卷积单元，而根据传统的卷积神经网络设计只有3个卷积单元。每个导联的心电图依次通过最适其自身的3个卷积单元，之后汇总各导联信息做最后的分类^([\[5\]](#txt005.html#footnote_content_txt005_5))。


    针对正异常分类，原始数据被平均分为44组，如表4-1所示。其中，“0”组的正异常数据是平衡的，该组用于验证中间训练过程的效果。如果直接用测试组验证，测试组的特性可能会被“学过去”，影响算法的泛化能力。


    表4-1　数据组织


    ![](images/txt005_11.jpg "pagenumber_ebook=103,pagenumber_book=95")


    对心电图分类方法的效果评估通常采用灵敏度（sensitivity，Se）和特异度（specificity，Sp）等来衡量，其定义分别为：


    ![](images/txt005_12.jpg "pagenumber_ebook=103,pagenumber_book=95")


    其中，TP（true positive）表示检测出的阳性样本，FP（false positive）表示错误检测出的阳性样本，FN（False Negative）表示漏检的阳性样本，TN（true
    negative）表示正确拒绝的阴性样本。TP＋FN就是阳性样本数，TN＋FP就是阴性样本数。


    总的正确率（GCR）＝（TP＋FN）／（TP＋FN＋TN＋FP）


    就一条心电图记录而言，起始位置不同，而同样时长的心电图意味着数据空间中的不同点，为了增加可信性，可选择不同起始点的若干数据进行实验（比如选第1，26，51，76，101，126，151，176，193点起始的不同数据），于是有9个不同的分类结果，取回归输出值的平均作为最后的输出，记为CNNR2（只取一个起始点的数据记为CNNR1）。表4-2是两者的比较［29］，数据及其意义在后节一起讨论。'
