    说明：作者被誉为20世纪最重要的碑学大家，然而他于碑、帖并无偏颇，论碑良多，眼界则超越碑本身，尊碑而不薄任何其他有价值内容，比如临习《兰亭序》千遍，特别欣赏其章法及其气韵贯通、一气呵成。一个切实下硬功夫者形象在世人面前栩栩如生，书如其人而人书俱老。随着了解的深入，读者当能感受到一个生动丰满、高瞻远瞩的奋斗者和教育家形象。


