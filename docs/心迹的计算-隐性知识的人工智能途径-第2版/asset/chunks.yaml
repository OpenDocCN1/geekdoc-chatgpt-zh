    \n\uFEFF\n\n5　机器书法长亭短亭\n\n![](images/txt006_1.jpg \"pagenumber_ebook=126,pagenumber_book=118\"\
    )\n\n训虎图（岩画）［1］\n\n……一个人要看得很多，而且要看而又看，才有资格就某一艺术部门的细节发表意见。就我自己来说，我看到的东西也不少，但是如果要把题材讨论得很详尽，我看到的就还不够［2］。\n\
    \n——黑格尔\n\n一色有余观笔墨，五声非但伴华章。\n\n书法创作与中医开方可作对照。新字体犹如医生针对未见过的病症所开处方，同一字体的变化则似对于患同一疾病的不同对象调整经方。中医把脉用指定位，书法使指运笔，差别在于前者用指感知，后者由指创作，背后都是体验过程、神经机制和思维活动。书法创作可谓雕虫小技，亦可谓奥妙无尽，多少人临池不辍而没法超越前人，与智能的机器模拟在如何“逼近”的目标上类似。机器书法创作若既要服从审美约束又自成面目，难度与书法爱好者中的极少数能成为书法家相仿。\n\
    \n5.1　不离其变\n\n无论言及文化、文字，还是艺术、意境，中国书法都是精神的体现、视觉的奇葩，可谓自古至今一道独特的人文风景，背后则是审美体验与美感积淀。就思维机制言，中华民族以整体思维、形象思维为特点，从而在象形文字的基础上形成书法并不断赋予其以新的表现形式，超越实用而进入唯美之境；从精神层面看，表达情感、宣泄内心需要一定的载体，于是，书写过程自然而然出落为艺术的一种形式。\n\
    \n有人赞中国书法为最高艺术，则非“合乎逻辑”的推论，缺乏严格分析。书法的出现，除了缘于象形文字就还因软笔工具的应用，然而象形文字别国也有，毛笔也可按需发明，就内禀特征与表达方式而言后者也许更具根本意义，如宗白华说中国人的笔“开始于一画，界破了虚空，留下了笔迹，既流出人性之美，也流出万象之美”。［3］它是思维的硕果、心灵的轨迹，亦可彰显峥嵘。\n\
    \n康有为在中国古代书法理论的殿军之作《广艺舟双楫》中有两节（“流变”与“分变”）谈及字体演变，他针对所谓的“八分”指出：现在所写的得旧体的八分，所以用‘八分’做名称，因为汉朝人口头上相传，如秦代变《石鼓文》为小篆，得《石鼓》的八分；西汉又变秦篆的长体为扁体，也得小篆的八分；东汉又变西汉的八分而加波磔，且极扁，又得西汉的八分；楷书又变东汉隶体而为圆笔方形字体，又得东汉的八分。八分以分量讲，本来是活动的名称，是可以伸缩的［4］。历代书法被总结为所谓的“商周尚象，秦汉尚势，晋代尚韵，南北朝尚神，唐代尚法，宋代尚意，元明尚态，清代尚质”八个逐步变化的时代特征［5］，姑且就将其说为“八变”。\n\
    \n书至汉代，体有七种：科斗书、籀文、小篆、秦隶、八分、汉隶、识（诸侯本国之文），［6］或隶中见蒃、蒃里有隶。为了交流、书写之便，趋于应用的需求，约简、规范是大势所趋，篆书逐渐去圆就方、变纵而横为隶书，同时以抽象、省略、连带、变形为手段，逐步形成有波磔而连动的草隶、章草，也可以说那是篆书演进到成熟隶书阶段派生出来的。孙吴的楷书《谷郎碑》距曹丕篡汉也就半个世纪前后，肥润宽拙，带有隶意。由此可上推汉代已有楷书［7］，从而蒃、草、隶、楷各体汉时均已出现，那是一个独步古今、继往开来的时代，隶书则是代表，笔意凝练，线条爽健，气象雄浑，仪态万千。\n\
    \n书体演变之外，书法创作也只有通过变化才能呈现个人的审美情趣并进入更为和谐的境界，其核心恰如沃兴华教授所云［8］：“就是将时代精神灌注到对传统的分解与重组之中，分解很重要，重组也很重要，而最最重要的分解与重组过程中的变形处理，没有变形决不会和谐，没有变形也无法体现个人的审美情趣和时代的人文精神，变形能力是衡量书法家创作水平的标尺。”祝嘉说：“专从诗上学诗，就学不好诗，专从书上学书，也学不好书，总是在一个‘变’字上，都要时时刻刻在变，因时而变，因地而变，因诗文的内容而变，因一时的思想感情而变。总之，不受束缚，千变万化，运用无穷，以成自己的字就好了。”［9］吴冠中说：“毕加索解体客观形象，根据新的意图和理想将其重新组合。”［10］邱振中教授进一步指出：“有人致力于把各种字体糅合在一起，有人想方设法改变结构的外观——这些作品往往看似新奇，但不能给人带来确有新意的审美感受。作品的空间性质不曾改变时，作品无法触动人们固有的空间感。”［11］沃兴华教授在谈体会时还说：“波兰尼认为，人类知识都是来自对被知事物的能动领会，具有‘无所不在的个人参与’。传统知识观以主客观相分离为基础，在知识中排除热情的、个人的、人性的成分，那是错误的。波兰尼还认为，求知行为遵从某些启发性前兆，并与某种隐藏的现实建立起联系，这种联系将决定对认识对象的选择与阐释。波兰尼相信，知识是一种信念，一种寄托，人们说话时隐含的情态，核实科学‘证据’时的判断，都表达了当时人们的信念，都是他们的寄托，知识在一定程度上是受求知者‘塑造’的，信念是知识的唯一源泉。”［12］让计算机能像人一样使得字的笔画、结构甚至章法朝人自己的意图方向发生变化是书法创作模拟的根本目标。他又表示，理论和实践应当是统一的。但他更偏重实践，因为作品是硬道理。书法艺术最终是给人看的，而不是对人讲的［13］。笔者认可沃兴华教授的创作及其认识，更大程度上是因为他的这种理念和思想。\n\
    \n从体会思维活动的神奇、理解传统文化的内涵角度观之，书法艺术不失为极好的研究“创作”和“计算”这两个乍看风马牛不相及的活动的关系及其新的呈现方式的载体和桥梁，因为书法创作结果是思维的综合体现。已见大量关于数字书法［14］的研究工作，多及计算机图形学、字体生成、字库等方面，不及形变等从形象思维出发的模拟。\n\
    \n徐颂华等的基于综合推理的方法，探索了计算机艺术中创造性思维的建模及其机器智能模拟问题［15，16］。他们通过对汉字书法作品的图像采用分层次的结构化知识表示方法，赋予计算机在书法创作这类形象思维领域“想象力”和“创造力”，使得计算机在学习了有限的输入字帖后，能够实时地在一个可能性空间里创作出风格不同的书法作品。这里的综合推理，简言之，指在包括图形在内的各种元素构成的空间里进行推理的一种机制。其书法创作结果如图5-1所示。\n\
    \n该方法用到了各个形象源（各个字）信息，但随机选择导致审美约束难以自然体现和发生作用，线条及其细节与微妙之处无法涉及。这个方法在运行过程中，每一层都需要对样本选择不同的权值，影响了效率。如果能够在选取权值之前，首先判定笔画的主要特征，以主要特征作为变形的依据，就有可能在某种程度上改进字体变形的整体效果和效率。两种方法所针对的对象“粒度”不同，建模方式也不一样。\n\
    \n![](images/txt006_2.jpg \"pagenumber_ebook=130,pagenumber_book=122\")\n\n图5-1　书法创作的综合推理。左：输入；右：输出\n\
    \n5.2　自一而始\n\n中国书法讲究笔法的核心，即基本的“一画”，一波三折，由一而二，以致无穷，寓意深刻。石涛讲“自一以至万”，“自万以治一”［17］。在隶书中，横画（“一”）是最基础、最核心，也是最有特色的笔画。在模拟横画的基础上，模拟其他笔画的创作就相对较容易，从而就可以构字成篇。\n\
    \n以典型东汉隶书《石门颂》《西狭颂》和《黼阁颂》为例。其写法和楷书无大异，其画像篆，最大的不同是有波磔一笔［9］。《石门颂》巧多于拙，多用圆笔；《西狭颂》巧拙各半，是方笔字，比《石门颂》肥、短，比《黼阁颂》瘦、长；《黼阁颂》则纯用拙，也是方笔。\n\
    \n图5-2左部是何绍基临摹《石门颂》之作，轮廓已平滑；图5-3是林散之临《西狭颂》之作，形准而灵动；图5-4为沃兴华教授意临《黼阁颂》之作，记忆中的内容是这类图像。\n\
    \n![](images/txt006_3.jpg \"pagenumber_ebook=131,pagenumber_book=123\")\n\n图5-2　原始碑刻和临摹对照：何绍基临《石门颂》\n\
    \n![](images/txt006_4.jpg \"pagenumber_ebook=131,pagenumber_book=123\")\n\n图5-3　林散之临《西狭颂》\n\
    \n![](images/txt006_5.jpg \"pagenumber_ebook=132,pagenumber_book=124\")\n\n图5-4　沃兴华意临《黼阁颂》\n\
    \n图5-5、图5-6、图5-7为简单但不同的隶书“之”字，图5-8、图5-9为更为基本的字体即正书不同的“之”字。机器要输出符合审美约束又有变化的不同“之”字并非易事。\n\
    \n![](images/txt006_6.jpg \"pagenumber_ebook=133,pagenumber_book=125\")\n\n图5-5　东汉《石门颂》“之”字\n\
    \n![](images/txt006_7.jpg \"pagenumber_ebook=133,pagenumber_book=125\")\n\n图5-6　东汉《西狭颂》“之”字\n\
    \n![](images/txt006_8.jpg \"pagenumber_ebook=133,pagenumber_book=125\")\n\n图5-7　东汉《黼阁颂》“之”字\n\
    \n![](images/txt006_9.jpg \"pagenumber_ebook=134,pagenumber_book=126\")\n\n图5-8　北魏《嵩高灵庙碑》“之”字\n\
    \n![](images/txt006_10.jpg \"pagenumber_ebook=134,pagenumber_book=126\")\n\n图5-9　南朝宋《爨龙颜碑》“之”字\n\
    \n实际的书法学习过程中，若临了同一种字体的多种碑帖后要写一段文字，选择余地大了，但同时有笔画融合问题，即如何在一幅作品中使不同风格的字得以统一。更为复杂的是：若临了篆、隶、真、草、行各种字体，进行个性鲜明的创作，会涉及“笔气”“墨韵”等。\n\
    \n针对书法临摹与创作过程，根据笔者自身的“隐性知识”，刻画书法创作如图5-10所示各阶段^([\\[1\\]](#txt006.html#footnote_content_txt006_1))。"
