    ## 附录2　工程认识

    我国社会，从高校、研究机构到大企业的研发中心，有益产出与实际投入不对称属普遍现象，不少学者没解决实际问题往往会委责于外部条件不具备、不配套或不周全，环境自然有相关性，而本质上还是在于做什么、谁来做、怎么做。工程的观点，也就是需求分析的观点、系统设计的观点、领域实践的观点、大量测试的观点、社会服务的观点，这是解决实际问题的必要理念，否则科研工作会“上不着天、下不落地”，岂不悲哉^([\[2\]](#att001.html#footnote_content_att001_2))。


    ### 2.1　科学技术

    让计算机处理的问题首先要可“形式化”描述，即将用户需求转化成计算机可接受的内容，它比平常语言严格，要规范地予以表述。接下来，要“可计算”，即符合计算机系统的算法要求，这需要借助各种计算机语言。比如人们每天的生活涉及衣食住行，住在家中，早上起来穿衣、洗漱、吃早餐等，然后出门，走路要符合交通规则或选择交通工具。计算方法涉及处理对象、调度流程、存储空间、运行速度等，否则无法一个一个步骤地推进。此外，“复杂性”也是具体问题，有一个在象棋盘64个格子上按照先后次序从一开始以等比级数递增摆放米粒的故事，乍听似乎是件简单的事情，实际没人能完成，因为它所需的时间是个天文数字，远远超出人的寿命，遥遥无期的计算，也无实际意义。


    至此，还只是理论计算，解决具体问题才是目的。这些年来，“需求牵引”“以企业为主体”被不断强调，这本身也交织着反复和争论。强调基础研究之重要，自然不能不及其余；而重视工程应用，也不意味着可以“怠慢”基础理论，没有核心方法的突破，就没有本质竞争力。不过，理论并不与科学画等号。科学以探索自然为使命，甚至由“好奇心驱动”。不少项目要讲“科学问题”，不仅混淆了概念，还使得目标含糊，甚至结果不知所云。


    由于任何根本问题的解决都需要良好的、持续的积累，这使得基础研究、应用研究与最终实现目标相互之间会有很大的距离和空间，往往难以在一开始理清路线和全面把握。于是，如何评判某项工作是否属于朝向既定方向的征途中的一步，抑或是偏离的一段，甚至“指东言西”，就成了现实的尴尬；而眉毛胡子一把抓，滥竽充数、鱼目混珠，以致浑水摸鱼、尔虞我诈，似乎也难以区分。那些不在正常探索轨道上的“推进”是一种浪费，但“曲折前进”“螺旋式上升”是客观规律，并无“仙人”可轻易指点迷津。这里出现了现实的“悖论”。舆论中不同意见者各执一词，似乎难分伯仲。


    人工智能是技术，认知科学在目标上可谓人工智能的理论。钱学森没提智能科学，相应内容应在思维科学的“思维学”中。


    ### 2.2　常规约束

    比如就人工智能与医疗健康交叉目标言，要解决实际问题至少涉及如下三个方面。


    第一，针对临床。


    工程化工作是利用科学理论、技术方法展开的面向用户需要或实际环境的解决应用问题的活动，就医学系统而言，一是指问题来自临床，不管研制仪器设备，还是开发服务软件，抑或设计分析算法，应当面对由临床医生或医疗机构提出的各种需要；二是所有结果是否有效、其优劣程度如何均由临床测试和用户反馈得出结论，评价的原则来自临床环境。


    第二，统计计算。


    针对临床的信息系统的效果，需要数量足够、表征全面、分布合理的实际数据予以支撑。比如，现在普遍应用的机器学习算法要将训练数据与测试数据集分开以期有针对性，否则结果会“看上去”不错；还要区分对象内和对象间数据，用同一个对象的数据而非不同对象不同时刻的数据会降低数据的代表性，削弱算法的泛化能力。


    第三，科学基础。


    应用研发所依托的思想、理论、方法都不能违背科学结论，不可超越既有限制，需要符合物理机理和客观规律。只有根植于有效基础研究成果的技术，才能保障其有效性、可靠性和普适性。需要努力避免的是与临床目标和需求无关联的所谓研究，一味为了“科研”而进行的数据分析，到头来经不起实践验证。


    有次联合申请项目，有家高校一直很感兴趣，准备参与，当谈到要符合临床需要时，立刻退缩了。笔者的膝盖关节问题已历数十年，当时看过不少医生，没特别办法。近年，右腿小腿以上直至髋关节持续不适，若弯腰向右前方有时不如左前方顺畅，后来，在办公室坐久后觉得臀部略痛，起身则腿部有滞胀感。看了多位主任医师，还服过药，无效。在服药前，笔者偶然遇到一位研制离子治疗设备的前辈，他建议尝试其法，并举了若干试过几次就见效的例子。过后还专门发来信息，表示随时欢迎过去尝试。笔者首先想到的是，一方面，该设备尚未通过测试、获得注册证，而且机理不明，不能随意使用；另一方面，在没有其他办法的情况下，不妨实验一下，因为即便有证的设备，也未必管用。于是前去“冒险”，这位前辈明确说无副作用，还说被称为“江湖郎中”。但第一次不但无效，个别部位不如此前。治疗需要持续多次，一次不足以说明问题，准备约第二次，得到的回复是：如果认为有效，欢迎再去，于是没再过去。推广其技术，希望有更多试用者本身可理解，笔者同意过去，后果当然自己承担。这类事本来挺难：没有许可，则难以上规模；而没有足够病例，谁会认可？笔者病久乱投医，当了回当天一位朋友戏言的“小白鼠”。


    有次笔者参加高级职称晋升答辩会，有位申请者说到一种传感器的指标比别人好，笔者问具体是什么指标，回答是灵敏度，笔者说临床上仅看灵敏度是不够的。他又说做了一种可穿戴设备，可面向老龄化等社会需求，笔者说这是一个老问题，并非传感器解决了就行，实际上，那个指标的传感器本身已不存在问题，临床需要的是信号分析的灵敏度、特异性、准确性等的综合性能。当然，按照规定的升级指标（无对实际应用的要求），笔者觉得这位申请者做得挺好，自然是同意的，只是想借机会提醒大家真正的问题所在。

    '
