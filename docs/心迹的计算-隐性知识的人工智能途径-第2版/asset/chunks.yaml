  trans: '


    笔者曾与若干书法家和书法教师交流书法学习的执笔“规矩”。小朋友一开始学习时需要被教授基本的要求，就如老师们要求小学生端坐，大了以后他们未必保持习惯，但那于小朋友的正常发育有益是毋庸置疑的。有人举齐白石、黄宾虹用笔如何随意之例，其实那恰是经验的高级境界，普通人只能“心向往之”，而不宜“以此类推”。对于其他方面的认识也类似。


    就学习而言，总要给出一种方法或提出一种要求，就如同面对初始接触电子计算机的学生，应该告知其双手放在键盘上的基本姿势和位置，并逐步能够“盲打”，尽管包括笔者在内的多数人没有努力为之——大家都能工作但效率不同。正确的方法和切实的引导不求事半功倍，也可减少弯路。执笔方法各式各样，甚至还有关于书法执笔的“专著”，有言“执笔无定法”，其实有一些基本要求，比如指实掌虚、悬臂运肘、左右协调等。赵孟頫则有言“结字因时相传，用笔千古不易”。


    从现代科学出发，执笔应有与人体生理特点相应的方式，有人从手部神经系统角度探讨应该是“三指执笔”还是“五指齐力”，不失为关于执笔方式在生理上是否合理的一种探索，与运动员训练讲究科学方法类似。就如看书，坐着、靠着、躺着大有人在，但坐着是恰当的。古人执笔各不相同，并不意味着那就是“无法”的依据；如同前人读书，精神可嘉，但不意味着读的都有用，多数不读也罢。书法名家中，比如苏轼、黄庭坚读书多，张旭、怀素不知如何，总之能理论联系实际的少。


    读书是学习的必然途径，哪个学科都一样，那不是形式而是手段，其作用当围绕具体工作或方向，片面强调读书但流于表面，则可能无济于事甚至适得其反，最终看的是创作效果。不仅读书与创作如此，不同艺术门类之间也相仿，有的人涉及面广，但不能互相借鉴，更不要说融会贯通。能够有机结合，汇成一个“山峰”方为佳境。


    “用笔”主要是“运锋”，“中锋”即努力使笔锋中正勿欹，从而使线条饱满劲健、变化自如，线条平滑而过不好，顿挫造作则可能过犹不及，勿在轮廓上有太大起伏为妥。即便看似简单的竖笔，要长而润、疾又挺并非易事。佳作中亦可见侧锋，那可以是点缀，就如人走路向前，偶然侧视尚可，不时东张西望则失之于歪路或滑稽了。与中锋相伴的是努力涩进，即笔与纸保持“逆向”作用，使得墨色苍润而不显枯弱，从而点点到位、积点成线，以避免笔迹轻滑笔意漂浮、“平铺直叙”，后者本指视觉形象，不是一味的运笔速度，所谓“疾涩”是在“涩”的前提下的“疾”（墨太干笔画会枯，墨太润则难现线条品质，墨适当而姿态丰富就靠运笔）。沃兴华教授说，要让笔锋时刻“咬”着纸面运动。林散之说，笔不可轻轻拖过，墨痕轻重恒等为佳，所谓力透纸背。那是通过互相作用、刚柔相济完成的。


    中锋用笔当注意用“锋”而非笔肚，否则即便“中”依然乏力，难有变化和趣味。中锋还要重视使转，让中锋之势得以继续并维持中锋本身，既是为了书写的活泼，也是为了运笔的灵活——两者一定程度上是一对矛盾。


    通常先学正书包括篆隶，然后行草，没听说过哪个草书大家一开始就写草书。不过那不意味着前者一定要达到与后者相当的高度，尽管有些草书大家的楷书也很出色。好比一位大学数学老师若教中学数学不一定比中学老师强，基础或支撑作用，不等于最终表现和面貌。


    碑帖以汉代前后最为多姿多彩而各体兼备，东汉刻石，以及西汉简牍中的隶书汗牛充栋；汉代篆书包括汉印朴茂多姿，与此前的三代金文和更早的甲骨文交相辉映，秦代篆书似嫌刻板，然而于线条训练、结构认识有益。稍后三国正书、小楷，与再后六朝宏丰的碑志前后相续。“取法乎上”是被普遍接受的观念，不过也要区分学习者的用意，比如不少人随录音学唱歌，后来也能唱，自娱自乐、随便哼哼，未尝不可；专业工作者则不是这样学。书法也有其实用性，比如老百姓会认为其可使日常写的字好看、潇洒些，或用以调节生活内容、养生等。在我国，教育部门会时不时强调中小学开设书法学习课程的重要性，且不说这种反复于个人成长的内在要求和教育规律是否吻合，其实毛笔书法与硬笔字优劣无必然关联，尽管它们都是书写，如同开炮和打枪，“神枪手”未必会开炮，因操作技巧不同，不过审美角度有一定共性是无疑的。绝大多数学生大概既不会认真对待从而也不至于在以后的生活中能享受到书法艺术带来的乐趣，迫于老师或家长的要求，他们多应付了事而不去体会美感。“写字”与“学书”以至“审美”并非一回事，古代都用毛笔，可是流传至今、经得起检验的名作就那些。把书法当作一种兴趣是合适的，即它并非直接地施作用于日常书写，而是可用于训练人的审美品位，从而可能对硬笔字有潜移默化的影响。


    书法专业授予博士学位已久，有人认为书法不宜设此，因为创作和理论不是一回事，其实那是各学科的普遍问题。理论本身可以研究、值得研究，尤其书法尚有不少交叉领域还是处女地，理论家未必是实践家。理论涉及技法、审美、考据等，后者与创作无必然关联，而具体创作技法与工程技术有类似之处，即其实践性。如果书法博士学术上无突破同时创作平平，那就难免引起争议了。


    全身精力到毫端，定气先将两足安。


    悟入鹅群行水势，方知五指力齐难。


    ——包世臣《题执笔图》


    ## 4.2 临摹为基


    临摹可以更为主动的方式实践之，包括手到、眼到、心到，也就是要书写、记忆、体会同步，而不仅是一笔一笔的机械模仿，就如同读书时凝神定思、心无旁骛与三心二意、心猿意马之间有显著的效果差异那样。临摹中，光记得字的结构还不够，在不断反复的过程中，还要重视细节，体会微妙之处，能举一反三更好，这里也是精与多的统一之辩证关系。曾见《白砥临古书法精粹》一套，白砥教授的书法创作在其同龄人当中属上乘，他指不转、墨色匀，不过有些线条较薄弱，结构欠自然。


    还有观点认为对临不如背临，背临当然可以强化效果，发现问题，但没有足够临摹前提下的背临，就如同没有足够的训练而企图熟能生巧。祝嘉说临书时要完整要一行一行临，实在不行要一个字一个字临，而不是看一笔、写一笔，即重视主要结构、呼应。“临”往往求似而少主动的发挥、积极的变化、系统的把控，真正临熟了，便可以以行为“单位”，那时的体验与认识不同以往，“临”是为了“不临”。


    如读书、求知、做学问、搞研究，仅读教科书或几篇论文是大为不足的，扬雄说“能观千剑，而后能剑；能读千赋，而后能赋”。临摹少量碑帖远不够，不过一味追求数量、忽视练习效果则可能事倍功半都不如，笔者学生时代有“认真”临习而只计数量、未顾进步的历程，因而深有体会，应付的百通也许不及十遍的作用，此说原因有三，一是即便百通，没有哪本经典碑帖是笔者烂熟于心的；二是有的碑帖临了一遍或几遍，与临了数十遍的效果似乎无别，难以看出“功夫”导致的差异；三是笔者对不同碑帖间或大或小的不同并没有形成细节上的比较印象，比如隶书的蚕头燕尾横画，每部汉碑均不同，碑中各字也不同。


    因此，临习数量有时是一种与进步不成比例的表面文章。不过日积月累应多少能干成点事，所谓水滴石穿既充实也不太困难，可惜大家在短暂的生命旅途中有时候显得实在太慷慨，不知不觉中年华付水流，等闲白了头。


    曾见某位学过四五百种碑帖的介绍，不知每种临习多少回，仅就数量言是非常多了，观其作品，则乏善可陈。专精是更为基本的，据专门临摹古书画者云，他们有机会每天看到原作，见什么临摹什么，于是不记了，有人难得见古代真迹、强记，等下次有机会再看，反而印象深刻。


    原作、印刷品，一流的、有特色的作品要看，有的不合个人情趣也可浏览，有的需要通过临摹不断品位和体会，也有的并不值得关注。厚积薄发然后可能化蛹成蝶。在广泛学习的前提下，可选择尤感兴趣、与己观念吻合者多加揣摩，自然而然可获得更深认识，只是应避免囿于一家。剪裱本已无原来章法可见，而不少碑刻整篇章法未必特殊。


    临摹之外读帖同样重要而非可有可无，多读相对容易，多写受精力限制，需要折中。首先，读和临都可加深对学习对象的认识与感知记忆，是认知的一个方面，当然，临的体会及其效果更透；其次，读时除了字本身的形态，会更为关注字与字的关系以致章法，这是临习时容易丢失或忽略的；同时，有时读不仅关注一个字而是让相关字同步进入视野，可能会联想到临的时候所遇问题，甚至会发现临的时候出现的问题的主要方面，是一个带有反馈的过程。


    此外，独特的结构以致笔画及用笔细节也可由读而愈加清晰，那有助于在临摹时对形的把握与笔锋的控制。读是相对宏观、整体的思维状态，与临互补且可相互渗透：读是临的拓展和深化，临是读、记后的实践与体验。在这个过程中，学习者会自然地将碑刻笔画轮廓上的“噪声”滤除，实现笔画轮廓的平滑和拟合，这是思维的基本功能。


    把握所临碑帖的笔画优点或审美特色是临摹的一种境界，记住经典是自如创作的基础，有时练习百遍而印象笼统。有的一时有记、稍后即忘。笔者中学时曾能用小篆在黑板上写出柳宗元《江雪》诗，只是老早忘了。


    中国书画都讲究“骨法”，其实“骨法”就是书画线条形式美的内在灵魂。书法的线条是书家走向成熟、确定风格的重要标志。笔者对董其昌的书法长时间里不以为然，其实如其“试笔帖”中锋流畅、意境大气，原来的观念并不恰当。书法线条应是圆厚的，如实木，应求硬木之质，避免白木之松。一次由博物馆陈列的岩画、彩陶，想起另外的代表性原始艺术甲骨文和青铜器，忽而联想到书法线条的一种境界当是，岩画之犷（面目简练）、彩陶之爽（线条灵动）、甲骨之挺（形象圆劲）、青铜之厚（气息稳健）。潜移默化很重要，但无论“移”或者“化”都有度。就如读书需要整洁、安静的环境，那不意味着需要过大的空间、“万籁俱静”的环境。


    从节省纸墨出发，可在墨纸或如现在的书写纸上练习，但水痕不如墨痕清晰。若创作后反过来再临，记忆会更深刻，有的前人一天隔一天临摹与创作交替，看似古板甚至缺乏必要性，其实是切实的体验之果，可以及时发现不足并启发创作，即便熟悉的经典也会有以前忽视或值得回味之处。


    学习（临摹）到底多少遍恰当难有定论（就认知神经科学而言，这不易实验），有的碑帖各有特色但有共性，如何优化临摹过程亦难，集字是一种选择，那是介于临摹与创作间的实践，或言是向创作的过渡：既能关注细节又可以新的布局出现，逐步脱离了从头到尾的临习过程，若有一定基础，集字甚至可跳过对某一碑帖的逐字临摹阶段（碑帖中并非字字俱佳）。以集联为例，大致经如下过程^([\[6\]](#att001.html#footnote_content_att001_6))。


    第一，经过反复读碑帖选出出色字或特色字，范围缩小，然而“素材”更少，在其中先选可成对的主词，接着找修饰词或谓词等，该过程难以细表，由具体情况定；不成还得回到原碑帖中找其他字，具体哪个字（词）对哪个皆以对联基本要求为约束。


    第二，若已有半对，则在脑海中搜索可对之词，似乎这种情况稍易，其实不然，有字（词）对上是基本的要求，意思、意境相合方可；比如针对屈原句得“柳依依莫往迟矣，燕送雨雪载渴思”未必佳，此时只能等而下之，有的过段时间不满意，只能舍弃。


    第三，此句源自起始时间比《离骚》稍早的《诗经》两则：“昔我往矣，杨柳依依；今我来思，雨雪霏霏。行道迟迟，载渴载饥；我心伤悲，莫知我哀。”“燕燕于飞，下上其音。之子于归，远送于南。瞻望弗及，实劳我心。”有多处叠词（与“慢慢”对），反复试得。


    书法学习主要靠印刷品、照片，见到真迹的机会少，由于复制品与原作间在逼真、清晰方面有不同程度的差距，而其身临其境的观摩感受大不相同，因而参观作品展览不仅不是可有可无，而且还是观察细节、参考用笔甚至体验创作的良机。现代作品展，大幅和多字作多，给观众以独特的视觉气息，然而不可因此主次倒置、漏了主旨。


    眼处心生句自神，暗中摸索总非真。


    画图临出秦川景，亲到长安有几人？


    ——元好问《论诗·其一》


    ## 4.3 创作乃旨


    书法中，一笔一画是基础，但不是写好了一笔一画就能写好字，能写好某个字不意味着就能写好一行字、一幅字，这些差异实际上也是一道道需要跨越的门槛。从量变质变过程看，量的积聚可能看似不少，加上内心的急切期待，会觉得可以有所“飞跃”了，实际上离质变还欠火候，此时进行创作不会如意。然而临摹和创作的“同步”也是重要的，如果因创作不如意而一味回归单一的临摹，这一步就跨不过去。“眼高手低”在所难免，训练足够了，创作当可如鱼得水、渐入佳境。这里几乎就是一个伪命题：临摹不等于创作，临摹好本来就不一定意味着创作好；也非人人都可创作，就像不能要求人人有创新成果一样。


    书法中的点是特殊线条，是浓缩的线条。线条首先要横平竖直，这是不言而喻的，重要的是线条厚劲而不呆滞、寓点于线而富于变化；线条应是字的和谐成分而非“各自为政”。但从线条出发，会导致迥异的效果，像群山中的森林，山川秀美离不开树木丰茂，而树木本身也是景致所在，比如迎客松之于黄山那样。


    线条的组合便是结构，笔画与笔画的关系是由汉字的书写顺序决定的。写字不是拍照，应该将对线条的记忆、理解加载到基本结构上，这时已逐步带有创作的成分。


    所谓书法创作就是一件作品的诞生过程，那里有往日的临摹基础，预先文字内容的选择，大致的位置安排，接着是心手相畅的表达、即兴的发挥，有的如拳击、武术，全是临时的轨迹而不是规划的实现，那是一个不断摸索、反思和比照的过程，能吃透若干种碑帖为好，由个别碑帖形成个人风格不是易事，真正走通此路的，其实所临不会不广；新意只是一个方面，最主要的是深度、高度和厚度。


    日常学习做练习，基本都属于“临摹”范畴，能解决实际（工程）问题，才是到了意临然后创作阶段。历史上有的艺术作品，水准极高，但作者似乎谈不上眼界高低、知识多少，从统计角度看，这种情况是个案，大多数人，知得不多，总有局限性。


    将结构的范围拓展，就是章法。广义的结构不仅针对字本身，也包括字与字、行与行之间的关系，前人作品的章法有很多可学习的地方，但其创作结果往往是随机所得，《宋史·岳飞传》云：“运用之妙，存乎一心。”指布阵、打仗，实时的选择、决策非常重要而难以预先设计、规划，即欧阳询所谓“意在笔先，文向思后”。那有不同层面、粒度的区分，宏观上是“成竹在胸”，中观上“用笔千古不易”，微观上运笔过程中有诸多调整，是临时的、转瞬即变的。“妙”在当时综合各种因素后的呈现，只是不可太随意，否则败笔必多。


    有后人专门去分析前人的章法，但那是否本意呢？避让、黑白等的对立统一都可在章法中体现，只是解释余地挺大。章法要求从点画服务字、以字为中心转变到以字为“元素”并整篇着眼。就如“腹有诗书气自华”，章法更多应是自然而然的认识。结构可以差别很大，线条内涵丰富则是根本的，如于右任、徐生翁都从碑出，面目各异。徐字奇拙，线条（尤其横画）独一无二，看似无提按、一波三折然而稳又健，可能就是功力到家后的高人之处。反之，结构合理但线条糜弱、乏味，则难言上乘。有的作品无法面面俱到而某一方面有长处，如祝允明的草书，有的线条侧弱但韵致良佳。


    什么是意境呢？那是一种宏观感觉，是由深刻体验而呈现的，比如气势博大、奔放，内涵深邃、厚实，是所见与所思的综合印象。能说的一望可知，比如丰满、活泼意味着热烈、灵动，疏朗、涩润意味着苍凉、辽阔；不好表达的再说也可能只是茫然。犹如“翩若惊鸿，婉若游龙”还好，“龙跳天门，虎卧凤阙”就难以明白（米芾曾作此叹）。


    线条的相切、相交、相离，以及长短、肥瘦、方圆，字的避让呼应，结构的向背、正欹、宽紧，章法的疏密、通断、借补，墨色的浓淡、枯润、匀变，意境的形神、动静、雅俗，以及笔锋的长短，运笔的轻重，都影响创作效果。这里，除了真正有启迪、有指导意义的理论或著作，没有像其他学科那样丰富的资料可以作为基础或“肩膀”踏而前行，每个在书法上有所成就的人都得从基础练习开始。而有意义的理论可以是经验的总结、知识的精化，也可以是感悟的整理、思想的梳理，最终目的应该针对学习，能够指导实践而不是孤芳自赏。比如写大字不是机械放大，由于笔力的差异，放大未必简单，还可能影响线条和结构；写小字也不一样，由于笔画短，有的笔意被浓缩但还是要清晰可观，小字放大后若依然笔画饱满、结构美观，则为上乘。大笔写小字，笔锋可控范围大，变化余地多；反之，小笔写大字，笔锋基本用足，至少线条肥瘦变化就难了。


    篆书圆劲，隶书舒展，行书流畅，草书灵动，正书寓变，于创作皆为特色。有的如高山大海，奔腾激越，汹涌澎湃；有的如鸟语花香，婉转清新，温碧和祥。不少名碑互补且可融合，正书中的《嵩高灵庙碑》点画凝重，把隶法融入楷书中，行笔沉着，结体错落，气息质朴，风格超然；云峰石刻（不限于《郑文公碑》）有一部分规整又开张；《瘗鹤铭》结构率动。隶书中的线条如《黼阁颂》之浑厚朴茂，《开通褒斜道刻石》之圆畅舒阔；篆书中，《秦诏版》错落生动，《天发神谶》意奇趣异，提供了丰富的可吸收的审美元素。


    齐白石说，作画太似为媚俗，不似为欺世。黄宾虹表示，惟绝似又绝不似于物象者为真画。书法亦然。这里的似与不似至少有三重含义，第一，纯粹的相像并非艺术，就连摄影都讲究渲染与处理；第二，全然不像，则不是反映生活而是“胡思乱想”了；第三，艺术正是要在现实基础上的创造，两者不可或缺。创作当追求点画之率意，线条之厚劲，结构之自然，章法之新颖，留给审视者生动韵致、个人面目、和谐美感和反思空间。


    这里无固定模式，各人当有不同体会，试图概括具体途径，必然难陈其详，以致“曲高和寡”、应者寥寥。比如斜、正，三角形、直线，中轴线、角度等概念，要么是艺术家个人眼中的“尺码”，要么是与鲜活的美学原则冲突的生硬“标准”，于是不免似是而非，无法推而广之。沃兴华教授临池功底深厚，创作意识强烈、个人面目独特、技法总结具体。无论是线条的沉厚、结构的自由，还是布局的用意、形式的多样，均令人耳目一新甚至为之激动，他出版了书法创作主题的系列著作。言其作“丑”甚至走火入魔，那是理解不够所致甚至是偏见，他说那没有道理，他不予理会。不过，虽然矫枉有时要过正，但也常会过犹不及。“做”“摆”太甚，离自然会远，去本真就多。字的结构变了，但是否一定就生动了呢？有意“留空”了，是否就一定“黑”“白”呼应了呢？随意的几个点，就一定构成三角形了？三角形表征一种稳定性，未必直接与美瓜葛得上。


    笔者想到过用书法笔法勾勒岩画图案（着色岩画除外），因它们基本的构成成分都是线，岩画线条粗犷而构图简略，一来画面不繁，二来特别需要线来表达，同时参以八大山人、齐白石等的山石笔意，而这正是很多画家不足之处。很快此念沉入脑底。书法创新需要：

    - 合理的方法、足够的训练，但不能盲目，应该取法乎上；

    - 去粗取精地理解前人书法理论并融合自身的实践；

    - 广泛的熏陶、阅历，但要有主动性，不仅是“观赏”；

    - 良好的审美眼光和不断的比较、反思；

    - 内在的精神追求，向确有其成者学习。


    简言之则是方法、训练与眼界。艺术创作与科技界倡导的创新有着同样的动机和期待，只是目的与要求有异。科技工作之理论脱离实际的情形比比皆是，这里有跨越前人的内在困难，也有指标体系的误导。对于多数人、多数事而言，没有创新也是常态。这也从一个侧面可知为何科技创新困难、科技真正转化为生产力之任务艰巨、真具个人面目又符合审美约束的作品少见的原因。


    '
