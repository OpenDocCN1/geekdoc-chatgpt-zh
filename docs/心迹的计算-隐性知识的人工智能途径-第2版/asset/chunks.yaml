    1.4　卷积神经网络计算


    人类分层地组织概念，首先学习简单的内容，然后用它们去表示更抽象的概念，人的视觉神经系统就是深层结构的组织。深度学习的一般做法是：首先用无监督学习对深层神经网络从低层到高层依次进行训练，在优化求得某一层的初始权值后，以该层的输出作为后面一层的输入，同样采用无监督学习对该层参数进行优化，如此反复直到最高层；逐层无监督预训练后，再用监督学习对整个深层神经网络进行微调，以获得更好的分类性能。以下是深层神经网络的一种——卷积神经网络的基本内容与方法，它使用4个关键的想法来利用自然信号的属性：局部连接、权值共享、池化以及多网络层的使用［5］。我们实现的融合规则推理和深层神经网络的方法［6，7］即基于此。


    1.4.1 基本结构


    卷积神经网络包括两个基本结构层和最后的分类层，第一个基本结构层为卷积层，每个神经元的输入与前一层的固定局部区域（接受域）相连，输出完全由该接受域决定，其中所有神经元的权值、偏移值和计算函数都一样，与视觉形成过程比，它类似于在该局部区域提取某一特征；第二个基本结构层是取样层，每个神经元的输入也与前一层的固定局部接受域相连（不同神经元接受域不重叠），并对接受域作变换得到一个值（一般是取最大值）；最后的分类层则通常直接使用多层感知器进行分类。一种神经元只能提取一种特征，同种神经元提取的特征组成的集合被认为是一个特征面，而一般一个卷积层为了提取不同种类特征会有许多特征面。如附图1-2所示，输入层是8×1
    900的多导联心电图；卷积层A共有8个特征面，每个特征面使用一个3×18卷积核（表示一个输入元素个数固定，与时间和初值等都无关的单值函数），该层输出8个6×1
    883（其中6＝8－3＋1，1 883＝1 900－18＋1）大小的特征面；取样层A采取1×7取样核，产生8个6×269（其中6＝6／1，269＝1 883／7）的特征面；卷积层B采用3×12的核，产生14个4×258（其中4＝6－3＋1，258＝269－12＋1）的特征面；取样层B采用1×6的核，产生14个4×43（其中4＝4／1，43＝258／6）的特征面；卷积层C采用3×8的卷积核，产生20个2×36（其中2＝4－3＋1，36＝43－8＋1）的特征面；取样层C同样采用1×6的核，产生20个2×6（其中2＝2／1，6＝36／6）的特征面，实际上是240个神经元；最后两层是使用多层感知器进行分类输出。


    ![](images/att001_29.jpg "pagenumber_ebook=191,pagenumber_book=183")


    附图1-2　卷积神经网络结构示意图


    每个输入特征面通过各自不同的卷积核映射成多个输出特征面，而组成同一个输出特征面的每个神经元与每个输入特征面的相同局部区域相连，且权值共享，但不同输出特征面的神经元权值不共享；然后每个输出特征面通过缩放操作减少神经元数量。显然，若输出特征面过少，则不利于网络学习，因为其他有利于学习的特征可能被忽略了；但输出特征面过多，待调整参数以及网络前向计算时间均成倍增加，不利用参数优化。因此，选择合适的特征面数就显得非常重要。在实际应用中，一般可先尝试较少个数的特征面，然后逐步增加个数，并观察所得分类模型的性能，直到得到一个前向计算时间和分类性能都较为恰当的模型。


