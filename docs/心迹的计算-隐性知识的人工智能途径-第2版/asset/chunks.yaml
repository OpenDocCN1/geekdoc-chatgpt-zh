    \ Minsky教授.科学网，2016.3.14：http：／／blog.sciencenet.cn／blog-2374-962496.ht ml.\n\n\
    [\\[7\\]](#txt002.html#footnote_quote_txt002_7)笔者曾对有人批评将计算机称为“电脑”表示赞赏，因为计算机与“人脑”差距太大，称其为“脑”大有言过其实之嫌，甚至是极尽夸张之能事，但对“机器人”一说从未置疑。其实它们与实际的“脑”和“人”差距同样都大，笔者的批评如同“五十步笑一百步”。\n\
    \n[\\[8\\]](#txt002.html#footnote_quote_txt002_8)图灵在1952年写过国际象棋程序，与人合作开发过跳起程序。\n\
    \n[\\[9\\]](#txt002.html#footnote_quote_txt002_9)据云IBM缔造者沃森（T.Watson）曾预言全球市场大概只需要5台计算机。当然他指的是大型机，不是后来的台式计算机、膝上计算机、掌上计算机以至可穿戴计算机。与人工智能当初的“乐观”预言相比，这个预言现在看来甚至“悲观”也说不上。\n\
    \n[\\[10\\]](#txt002.html#footnote_quote_txt002_10)犬子吟茫从小到大买过不少种棋，如飞行棋、跳棋、五子棋、中国象棋、围棋、国际象棋等，有时候他要笔者陪着下，但笔者不会下国际象棋，于是鼓励他“你学会了教我”，不过他对下棋并无兴趣，不愿花时间去了解和学习国际象棋的规则。他母亲在他上学前给他报过围棋兴趣班，他去了没几次就放弃了。笔者中学时对围棋也有过热情，买了围棋和《学围棋》之类的书，找班上围棋下得好的同学到家里来“对弈”，但只是一时兴致，后来长时间未再碰过，直到如今。小朋友缺乏积极性或轻易放弃一件事当然是不鼓励的，但教育不宜强迫，每个人最好都能发现其自身的兴趣，智力的发展是一个自然的、渐进的过程。成人看小孩会有这样或那样的问题，其实他自己是一样的，只是生活阶段不同而已；我们看人工智能，也有同感，不同的是，人工智能的成长遵循的并非那样的规律。\n\
    \n[\\[11\\]](#txt002.html#footnote_quote_txt002_11)钱学森在空气动力学、控制论方面的学术贡献可列该领域的名人堂，而其思维科学理念在西方并非广为人知，但西蒙颇为推崇，认为其与认知科学非常近似，并致信钱学森表达见面交流愿望，惜乎未果［28］。\n\
    \n[\\[12\\]](#txt002.html#footnote_quote_txt002_12)由于拼音输入时选择错误，初稿中此处是“去的”两字，重看时发觉有误但一时未明，后即想到应为“取得”两字。计算机也许可从词性等方面（此处应为动词）纠错，但要具备前述的反应过程亦是难事。\n\
    \n[\\[13\\]](#txt002.html#footnote_quote_txt002_13)从至少4万年前开始出现的“智人”所具有的肤浅“智力”开始，经过不断演化，人类在漫长岁月中逐步成为大地之主，并企图模拟、复制自我；与人类进化相比，人类制造的机器快速地取得了石破天惊的成就。如果人工智能达到预期，其研究成果所跨越的是数十万年智人进化的进程。\n\
    \n[\\[14\\]](#txt002.html#footnote_quote_txt002_14)Chat GPT往往被与通用人工智能混谈，其实距离还远。\n\
    \n[\\[15\\]](#txt002.html#footnote_quote_txt002_15)某日见一篇关于“机器化学家”的文章，文中介绍如果依赖传统研究范式，这一过程可能需要1\
    \ 400年，而“机器化学家”发挥数据驱动和智能优化的优势等，仅需要5周时间。且不说“范式”之类用词是否适当，时间差距如此悬殊，意味着若没有机器，人在这方面工作根本没法做，或者说这方向以前只能放一边。我即请教化学教授：时间差距是否被夸大，或两者不是指同样目标？回答是肯定的。认为只要有数据什么问题都可解决的想法则过于简单化了。\n\
    \n[\\[16\\]](#txt002.html#footnote_quote_txt002_16)一学长的孩子，从小在美国长大，对历史颇感兴趣，高中期间的一个暑期到中国探亲，专门到我们实验室待了两周，后来大学读了美国名校的计算机系，研究生则还是选了历史专业。他的兴趣与受教育经历，会使他今后的历史研究更有后劲。这个例子，丝毫没有减弱大学读文科的意义，而在于如何读。阅读本是文科的基本要求，暂且不议学生们是否做到，有人认为人工智能时代，本来需要记忆的知识在互联网上都信手可得，因此阅读的意义弱化了，那是误解或臆想。这位博士生的学位论文，当非Chat\
    \ GPT可为，他专门到档案馆搜集然后梳理的资料就非网络搜索可得。\n\n[\\[17\\]](#txt002.html#footnote_quote_txt002_17)徐冬溶教授告知，某晚他做了个很奇怪的梦，梦见Chat\
    \ GPT学习了浩瀚的知识之后就自然进化出意识来了，于是觉得物质和意识可能没有根本区别，半夜醒来吃了一惊。他小时候练气功时，师傅教大家一招一式比画，然后心中念想，当时觉得那怎能练成，因缺乏合理解释，后来他想法有所改变，认为也许那是可能的，因为即使到目前为止，意识产生的机理还是个谜。因此类推Chat\
    \ GPT也可能会“产生”意识。\n\n\uFEFF\n\n2　思维过程扑朔迷离\n\n![](images/txt003_1.jpg \"pagenumber_ebook=43,pagenumber_book=35\"\
    )\n\n大方广佛《华严经》句\n\n入于真实境，照以智慧光。\n\n岁次鹑火春仲 晚晴老人［1］\n\n比如一个学生与一位大科学家在一起讨论问题，学生觉得这个问题没有线索，不清楚。但是科学家说很清楚。然后，学生去仔细分析一下，做一做实验，证明科学家是对的。为什么学生看不出所以然来，而老师一下子看到了？如果我是学生，就要问老师怎么回事。老师的回答是说不清楚，你好好学，将来有经验了，知识丰富了，你也可以做到这一点。这就是说，它不是科学，而是经验的积累，这是形象思维的一部分，或者是形象思维在科学里面的直感，也是我们常常说的，这个人看到了问题的核心［2］。\n\
    \n——钱学森\n\n一阵风雷天地宽，九州雨雪心灵远^([\\[1\\]](#txt003.html#footnote_content_txt003_1))。\n\
    \n人工智能的核心是思维模拟，思维指人脑对于客观世界的能动的、积极的反映，具有概括性和间接性特点，前者针对事物本质、对象共性及其普遍性，比如自然之巧、苍天之阔、智慧之奥；后者指通过一定的媒介或环节而发生作用或得到反馈，比如人们试图借助计算机及其算法模拟生命起源的各种条件与过程，分析宇宙射线和星际物质。不同对象和背景，不同视角和方式，会导致不同结果和结论。思维过程反映了人们看问题的习惯、对待事物的态度以及关于世界的立场，不同的思维特征增加了模拟的困难。\n\
    \n2.1　事实逻辑\n\n探索过程中的悲观情绪不利于梳理方法、解决问题，盲目乐观则导致轻视困难而非加速进程。可喜的是人工智能在不到“古稀”之年一次次超出预期，时过境迁，则如一年年除夕的欢聚过后依旧的冬去春来、云卷云舒。或许未来某日全然开朗，抑或其境长时期可望而不可即。逻辑在给人清晰思路的同时也会令人束手无策。\n\
    \n罗素提出过一个“理发师悖论”：有一位理发师说他将为居住地所有不给自己刮脸的人刮脸，也只给这些人刮脸。来找他刮脸的人络绎不绝。有一天，这位理发师在镜中看到自己的胡子长了，他能否给自己刮脸呢？如果他不给自己刮脸，他就属于“不给自己刮脸的人”，按前所述，他就要给自己刮脸；如果他给自己刮脸，他又属于“给自己刮脸的人”，他就不该给自己刮脸。理发师左右为难、无从着手。\n\
    \n我国古代有个故事：东方朔偷喝汉武帝派人弄来的君山不老酒，于是令武帝大怒而欲斩之。东方朔说：“陛下杀臣，臣亦不死；臣死，酒亦不验。”^([\\[2\\]](#txt003.html#footnote_content_txt003_2))类似理发师悖论而不及其严谨，“不死”指不会自然而然死去还是不能被杀死？其实生活中例子不少。\n\
    \n比如关于其传记，金庸表示：“人家写的传记不对，全部是假的，我可以肯定地讲一句，完全没有一个人来跟我谈过。我自己不写自传。写自己的事情，有好的，有坏的，坏的事情自己不大会写的，一本书全部讲我自己好的，那本书就是假的。”［3］尽管“假”是金庸针对他自己的传记而言的，也可以推及其他：\n\
    \n如果作者没有与传主谈过，按照第一句话，那传记是“假的”，或许是二三手资料外加臆测、渲染，结果可想而知；\n\n如果作者与传主交流过，也就是说采用过传主的说法，而传主不讲自己不好的，按照第三句话，也是“假的”；\n\
    \n于此只有一种例外，那就是传主说了自己不好的，但我们在传记中难见传主之坏。因此，只有有“坏”的传记才可能不是“假的”；\n\n于是又有了“悖论”：就笔者看到的传记而言，讲传主之“坏”的传记作者不会与传主谈过（比如写袁世凯），这又回到了第一句话。\n\
    \n有的传记拼凑或草草而成，有的一味正面陈词，有的素材真实性存疑，还有的是重复的。顾颉刚说幼年时看书虽常生怀疑，但总以为是经过前代学者认定的，不致有大错，其实近代的史籍、近人的传记莫不和古史古书一样糊涂，比如，夏代的年数就有六个之多。［4］可知相当比例的传记不看也罢。\n\
    \n人们自然而然会觉得“身在其中”，比如亲历过某事、亲见过某人，就能知道得更真切、更翔实；世人看风景，再美、再多的风光照片与身临其境的体验不可同日而语。即便互联网时代，渠道畅通了，就像水管粗了，但水不一定更清。\n\
    \n笔者从20世纪90年代初开始阅读人工智能书籍，直接印象那是推理，即属于逻辑范畴的思维过程的计算机程序实现，几年后看人工神经网络著作，并知道不同以往理解的机器学习概念，后来见博弈论论文，逐步明晰人工智能是对脑内机制的机器模拟的企图，但如造飞机依赖于空气动力学，应有方法指导或理论支撑。假设具备前提，要超过同样成长的人类，就如人没法通过抓自己的头发将自己“拎”离地面，逻辑上难以自洽，而事实上人类自身也在成长。直到第二次阅读王浩的《哥德尔》，注意到他的推测：“我觉得，根据人们今天的信念，正如在不久以前的地质年代出现了人，预料在相当遥远的未来将要出现更高的智能才是比较合乎理性的。”［5］且不言“相当遥远”的尺度，这里“更高的智能”的载体是人还是机器？人工智能若仅靠人类设计后“哺育”其成长，则至多等完全搞清脑结构及其机理后造出与人脑一样的“人脑”（人工脑），超越不了人类。若它能够自我“发育”“进化”，理论上情况会有根本变化。以牛顿第二定律为参照，设F\
    \ 1＝m1a 1，F 2＝m2a 2，m1和m2分别对应人脑和根据脑神经结构设计的人工神经网络，a 1和a 2分别是人脑和人工神经网络的进化加速度，若m1不弱于或强于m2（目前实际状况），但a\
    \ 2大于a 1，则将来某时F 2就可能大于F 1。不过若求质变，既有基础、生存环境和时间积累缺一不可。这里的“基础”指类脑的结构，未必以对大脑机制的完整理解为前提，然复杂性相当，因而非短期可达。\n\
    \n于此进化论可做参考，“适者生存”是达尔文思索、考察的总结，人类进化事先并无指导原则。当下，实践走在前面。人工智能是技术或工具，本身不是科学（当然可以为科学服务），就人类而言其意义更大程度上在于辅助日常工作或解决棘手问题，当下离“成人”还远，一个人只会做题显然不合培养目标，融入生活才是根本。尽管成熟还是成长（初级）阶段划分可能各有所见，以下几点可以明确：\n\
    \n第一，人工智能在仿生基础、理论方法和系统呈现方面依然有众多未知与缺陷（假设前述a 2目前还不够大），这至少是本世纪中叶人工智能百年前的境况。\n\n第二，大语言模型针对的是语言及其思维功能，是人类智能的一个方面，比如有一语言天赋极佳的小孩，即便她可以演“脱口秀”，但能否独立解决需要专门知识的问题或具备系统设计能力是另外回事，理解力、概括力、执行力都重要，那以丰富的知识与数据为前提。\n\
    \n第三，如中医脉象体征感知与分类，没有脉象数据难以为继，即便有了足够规模的数据，大语言模型也没法立即出结果，因那是建立在具体分类方法基础上的，没有学习方法或清晰的诊断规则集，计算机束手无策。人工智能在书法创作模拟方面也类似，创作的输出控制还缺乏细节依据。\n\
    \n人工智能未来应能自主面对各类任务（环境适应），进而定义任务（需求凝练），并评估任务（价值判断）。无疑近年人工智能进展飞速，但智能模拟的当下轨迹是“渐近线”还是又一次“抛物线”，目前尚不明朗，尽管有不少权威有大胆或谨慎的预言。\n\
    \n2.2　决策优化\n\n有一次，笔者与以前的同事一起从外地回上海——原定如此，因此临行前想到过是否预购从上海到苏州的火车票，因为飞机场、火车站均在虹桥交通枢纽中心——若不是这样，按照个人习惯不会考虑事先购票。实际上飞机晚点似乎是“常态”，最后笔者还是没提前购票、以备不测。果然，由于台风可能经过的原因，飞机延误一个多小时，没法赶上到苏州的最后一班高铁列车，于是那晚住在上海。这是经验导致的选择。尽管这个选择只有两种情形，但生活中不乏类似可能的被动。\n\
    \n另一次，笔者在南京办完事根据距离选择经天津去秦皇岛，这看起来比到北京后再过去要近些，于是在车站买了去天津的高铁车票，到天津西站——比其早约一个小时的高铁列车是到离目的地相对较近的天津南站但没票了。进站后提前上了到天津南站的车找了个空位置坐下，列车员走过时与其说明了原委，他说没座位，笔者意来了人让，其实坐了近3个小时那个座位才上客。该次列车正点到天津南站是9点。笔者想10点从天津站出发的火车应该能赶上。不料高铁列车照样晚点，延了约一刻钟。据出租司机说从天津南站到天津站有四十多公里路程，而天津西站到天津站的距离才几公里。司机尽快赶到天津站后，因来不及取票就径直进去，火车晚点尚未检票。到检票口，笔者想凭身份证进，检票员说非高铁动车不可（当时规定），这与一般理解和印象不一，于是问取票还来得及吗？回答说来不及了，最后他们还是让进，说要另外买票。到了补票席说明情况，列车员查身份证，反复看订票短信，说查不到完整信息，等了好久，列车员还记下了若干行内容，说可以证明订过票、到站时要陪着下车与站台交接。没明白此事为何如此复杂，列车员的认真也非以前所见。\n\
    \n这么一段几个小时内发生的情况告诉我们，不能忽视必要的分析与综合。比如，从北京走要远一些，但可选择的车要多不少；天津的几个火车站间的距离应预先了解，不能想当然；“凭身份证直接上车”不能含糊其事。否则，会招致不少麻烦而非自己预期的那样——得善于主动总结经验，否则便会增加不便。\n\
    \n又如，在过去相当长的一段时间里，杭州和苏州两个与天堂媲美的城市间的交通工具主要是轮船，笔者第一次去杭州是在高一暑假，坐了一夜轮船，那时有火车、汽车，但通常首选是京杭大运河上的船，尽管那时河水黑而臭；后来，公路逐步提高了质量，坐长途汽车的旅客多了起来，乘火车要绕道上海。笔者在杭州学习期间，多数情况下是坐汽车在苏州和杭州间来回。随着火车的提速，铁路也方便了起来，后来有了高铁，选择火车就是普遍情况了。这是三选一的生活经验，是生活中不难的事。\n\
    \n更早先，笔者小时候有次在无锡江阴大舅舅家，下雪了，因知道各地情况会不同，就问苏州是否下雪？他想了会说：不下。后来，笔者回苏州见到母亲，问那时是否下雪，母亲说下的。问那个问题，是因为知道了一点常识，舅舅那样回答，是凭经验两地天气不尽相同并非必然，据此的决策或想法会有误。经验有待积累、归纳、分析、精化，使其合乎逻辑。\n\
    \n有次参会，会议室桌上有矿泉水和茶水，由于笔者喝茶会影响晚上休息，按以往的经验多数情况下要延迟两小时左右才能入眠，而水是必需的，所以总是选择喝水。但一瓶水喝完了，会议到了午间，因有点口渴还是顺手喝了茶，此前服务员多次过来要加茶笔者都示意不必，因为那会一口没喝。人的决策和选择往往有多个目标约束，笔者“明知故犯”了，难以道清其中的原委。\n\
    \n某日上班到站台，平时乘的公交车似乎刚过，下一班还有不少站，又是下雪天，于是犹豫中笔者上了另一路公交车拟接续而去办公室，不料因想问题未及时下车，询问司机后在一个站下，已是反向三站了，后面转了三辆车才到。尽管由于天气及频繁的堵车情况，我乘日常那路车估计也会晚些时间，笔者还是觉得这类日常小事的决策并不简单明了，那是一个日常习惯、临时选择及交通路况综合作用的结果。"
