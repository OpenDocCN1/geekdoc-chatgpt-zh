- raw: '最初的人工智能是想利用计算机模拟人类的演绎能力，比如通过一系列的选择使得解题过程比依靠记忆来得简捷，而不仅仅想证实计算机如何能解决困难问题。然而，人工智能的困境让人不得不反思归纳的重要性及其不可替代性。


    2.3　预测归纳


    一次笔者应邀到甲骨文发源地安阳参会报告书法创作模拟方面的工作，有位甲骨文研究者在介绍相关知识时，说到占卜。笔者问，《周易》也源于安阳［文王拘（于羑里）而演《周易》］，甲骨文和周易占卜有何关系和不同？回答说那是很专业的一个问题，但未直面说明。历史上，甲骨文和《周易》都关联着同一个地方，即古都安阳，也都涉及一件事情，即占卜或算卦。这类行为所表现的思维过程是可以探究的，抑或通过现代科技手段可以证伪之。比如，“八字算卦”除了利用其时间段，还依赖其他什么信息？其“推演”过程是怎样一步步递进的？经验知识是如何被利用的？这些也都是人工智能面对的话题，对于我们很好地理解形象思维机制定有一定程度的帮助或启迪。其结果纵是偶然“有准”，但在多数情况下莫衷一是，因而没有说服力^([\[3\]](#txt003.html#footnote_content_txt003_3))。这件事与中医似乎有一些共同之处：


    第一，是中国传统文化发展过程中的一种与生命相关的现象；


    第二，与迄今为止的科学不合；


    第三，思维机理或内部过程不明；


    第四，缺乏统计意义下的实验与分析；


    第五，容易被归为“伪科学”。


    中医有其效果和手段，而算卦似乎无从谈起。然而，放开眼界、更换视点，是否可以像“中医现代化”一样探究一下与预测相联系的算卦本身？就如原始思维幼稚、粗疏，但它不仅是研究的对象，还创造了甲骨文本身。


    甲骨占卜的过程还未有一致的表述，易经算卦尽管过程看起来复杂，实际上其结果也就是8种、64种或324种等有限种类。可能甲骨占卜是源头，易经算卦是符号化和系统化的工作，而八字预测是后来的一种具体形式。这类事若有一定的合理性，则应该是建立在大量统计数据基础之上的。由随处可见的模棱两可，反过来可知目前所谓的算卦的不可细究之根基了。


    笔者曾电话请教一位据云是工科背景的计算机算卦研发者。


    问：同一时辰出生者是否结论一样？


    答：那是大的趋势和表现，朱元璋手下的刘伯温曾寻找与朱元璋同一时辰的出生者，是一养蜜蜂的，从统治和管理角度看是类似的。他们目前有10万个案例。


    问：从统计学出发，有对某一情形的足够的样本不？


    答：干那事要见多识广，要结合具体的历史和社会环境。


    问：当下和一个60年前出生的人在他们看来有何区别？


    答：那时刚“解放”，生活条件较差等。


    问：那是在中国，欧美呢？


    答：所以要有广博的知识。


    问：你们基本的依据是什么？


    答：都是前人留下的，但没有哪本书完整给出具体过程，计算机程序也只是一个基本内核，其余的靠当场诉说，比如结合人的长相等。


    问：盲人看不到吧？


    答：盲人的其他感官更灵，很容易知晓。只要理解了16个字就好：太极八卦，阴阳五行，天干地支，河图洛书。比如计算机的“0”和“1”的表示，“阴”和“阳”的内涵比之要丰富得多。


    那确实是中国传统文化的精深内容，但有的众说纷纭，有的不知所云，谈对它们的全面理会同样似是而非，什么都能装的瓶，适用面是广了，掺杂和附会的空间也随之不断扩大。再者，“八字”里不含地域信息，而很多有成就者出生在贫困地区，他们的人生比出生在城市或富裕地区者出彩。


    上述的软件系统据说能分出100万种情形，从人的大类来看，也可说是一种归纳结果，但被归为一类的人确实一样吗？他说他们也努力找，但要找到同类的做分析很难。实际上，信息技术发展到如今，根据户籍资料等进行统计分析已经可能。他不时会显出一种企图说服人的口气，而笔者的初衷并非是与其明确是非，只是对其推演过程所表现出的思维特征有兴趣，主要想知道他们是如何利用自己的经验和阅历的，但他没有给出具体解释。看来，他们说不清，这个过程可使得我们进一步清楚地知晓其“漏洞”，基本结论是：


    第一，那是一种长期以来形成的思维内容，无论过程还是方式是否有某种程度的可靠依据不得而知；


    第二，形成现有的一套所谓的经验知识颇为不易，听起来不比现在的科学实验和科技论文的造假简单；


    第三，由于需要经验和不断地归纳出一些“结论”，得有一定的形象思维和推理能力；


    第四，不会全是糟粕而一无是处，就如同“风水”与地理、气候状况有关而不是全无道理一样，或可得到一点启发；


    第五，只要有一定数量的包括详细信息的案例，则可以进行更大范围的统计分析。


    在各种“场景”面前，需要以辩证的思维方式对待之，首先要有基本的观念和“定力”，否则就会“信之则灵”了。


    理性思维与经验思维，作为人类思维发生作用及其进步的两个方面，在从柏拉图到笛卡尔、斯宾诺莎、莱布尼茨等至今两千多年的发展中，呈现出自成体系又相互交叉的脉络。由宏观而言的东方文化和西方文化两者的特点和历史可见，理性主义在与经验主义作用交替的道路上，逐步成为占据当今科技、文化主导地位的思维形态，并切实影响和支撑了生机蓬勃的现代文明，而同样有逻辑（形式逻辑）苗头的中国传统文化孕育了时而被忽视的东方思维的主要形态，由于其与理性思维的“分道扬镳”，又导致中国整体上科技的落后，以致有了“李约瑟难题”，即直到中世纪中国还比欧洲先进，而近代科学和科学革命却发生在欧洲这一历史现象。这是众多仁人志士关心、热议的话题，包括这个话题本身，一直有人“各抒己见”。既然中国传统思维有其自身的方式、机制和现实效应，当然没有理由漠然视之。诚然，如有些文化名人所言，21世纪将是东方文化的时代、东方思维将大放异彩等。这些预言似乎更大程度上是一种富有感情色彩的期待，至少难以获得这样的逻辑推论。中国传统文化，儒教、道家、禅宗，或儒道释交融，均未引导出现代科技的领先之步，而别的民族也在不断进步和发展。还有艺术工作者说，越是传统的，就越（会）是现代的，这未免太有“艺术家”色彩，这么绝对的结论显然与西方的理性思维所要求的实证、推演格格不入，这也是东方文化弱点的一种体现。


    预测首先依赖于大量的历史数据，那不仅是数据也是经验，如果没有足够的数据供学习，预测将可能是空想或者胡言。实际预测前，需要取所获得的数据的一部分训练模型，而剩下的数据用于测试。但它们间的比例多少合适，既依赖于经验，还需要通过测试调整。因此，整个过程也离不开经验^([\[4\]](#txt003.html#footnote_content_txt003_4))。


    预测作为思维的一种形式，有不同的可研究侧面，比如网络路由资源的分配。假定用户间存在对网络资源的竞争，通常假定用户和资源供应者独立优化各自的效用函数，从而使资源分配达到某一均衡解。由于业务需求到来的随机性和处理的延时，使决策的做出在采样间隔内落后于采样时刻，导致它们均是准实时的，从而影响准确性和灵敏度；同时，被接受的业务将在“未来”的一段时间内保持并占有资源。所以，良好的决策应考虑：资源的使用（或业务）将受到的以及将产生的影响。也就是说，决策依据的网络情况应超前于采样时刻，即应进行预测。笔者因而给出“预测—决策”网络路由资源智能分配策略［6］：将网络映象成一个多智能体系统，每个结点含一个智能体。通过对网络负荷的时间序列分析进行预测，把握网络的负荷趋势。若同一时刻的请求多于现有资源，则作进一步决策。在实际电信网数据上进行了分析与比较。


    那以后笔者才开始用移动电话，比较晚（没用过寻呼机），原来总觉得移动电话有辐射，于身体有害，可用了以后就觉得离不开它了。假如能开车，就像有移动电话一样，会方便得多，这是类比和演绎。道路上新车很多，不管是私家车，还是公务车，只要是新的，坐上就能闻到异味，由此可归纳，目前我国出售的普通车，车内环保方面的指标估计有问题。公交车上，时常有乘客向驾驶员询问是否能到某地、如何转车到达目的地，驾驶员通常都能给出有益建议，由此可推测，驾驶员上岗前对相关交通信息要有所了解，在这个过程中，他们自己也不断熟悉各种情况，这结论又是演绎了。日常生活中靠归纳的机会也不多，演绎能力极为独特，稍不留神就会以偏概全。笔记小说《北梦琐言》中有一个故事，说有一条三丈长的白蛇盘在树枝上，垂头而歇，有一褐土色蛤蟆状的如盘之物四足而跳，至蛇下仰视，蛇垂头而死。此前有动物为蛇所吞，如蛤蟆，坠而致死。于是感叹，“凡毒物必有能制者，殆天意也。”［7］云云。这样的大跨度推理缺乏足够的样本而过于粗陋，于逻辑相去远了。


    2.4　记忆搜索


    疫情期间某个周末笔者用完早餐照例去医院看父母，走到离所住小区次近（但是是医院近方向）的公交站，见指示牌还有三站，笔者依习惯再走往下一站，到站时车辆将进站，忽然发觉口罩不在口袋里，附近路旁没店，迟疑数秒只得回家取。从家里出来后还是一样，多走了一站。通常说脑子好不好使指逻辑推理、空间想象等能力，其实记忆力也是天赋之一，那不仅有助于专业知识积累与精化，还是减少日常生活重复并使之高效的前提。笔者只得以被动多了一点走路的锻炼“驱散”记性不好的无奈。“不如意事常八九”，能有走路锻炼的“补偿”已是难得。


    某日笔者准备取隔日晚上拿出的几件此前所购书画作品送装裱，书桌上没见，觉得意外，于是在可能的地方寻找，反复两次均未果，只能作罢，只怪自己记性益弱。出门前忽想到可能在同样是隔日晚理出的几个画框间，果然在其中一个的夹板和玻璃间，是当时收拾时没留意取出所致。这事看似是“顿悟”之果，无疑受了记忆中类似情况启发，比如同样是找不见某物，后来在某处“得来全不费工夫”。记忆又难免受各种干扰，有一次在南京出租车上司机说起金陵饭店：


    我：那是20世纪70年代末的事情了。


    司机：80年代。


    我：似乎不到80年代。


    司机：上中学那会，记得的。


    想着他是南京人，又有明确的参考“点”，就认可其说。回后有一天忽然想起，查了一下，是70年代末开工，落成则是几年后的80年代初了，估计司机所指即是，已过去超过40年。笔者印象很深的是打桩的情景，因为是高楼，桩打得深、声音巨响，那时候是特别所见。


    有次去一处与友人见面，地点在两路相交处，位置不确定，与司机说了目的地，到附近司机说不清楚具体方向，便电话问对方说也在找，司机说往左拐，那儿饭店多些。拨“114”电话询问，又转到交通台，还没等话务员说完，笔者忽然想起，那家饭店很多年前曾去过，司机所选方向正好相反。这固然与记性有关，似乎又不仅仅是记性的问题，记性只是记得牢否的问题，智能还包括搜索、联想等能力，这与依据经验“临场”应用有关^([\[5\]](#txt003.html#footnote_content_txt003_5))。


    犬子小时候会走路后，有次到他爷爷奶奶处用完午餐，笔者带他走到小区边一座小桥旁，是两条干道的交会处，他看见一辆辆车经过，一一指手画脚大声说着汽车的品牌，那份开怀前所未见。知道他对汽车感兴趣，如此激动则令人惊讶。在他刚上高中后的那个月，又过去，等车时见一辆极少见的车的底盘几乎贴着地，他说太酷了。笔者与他说起前述那件往事，他说不记得了，什么原因使他那样兴奋、他怎么会知道那么多车？他说是书上看来的。过后笔者有点恍然大悟，记忆中的书本知识与实际场景对上了，也是一种快感。


    记忆的过程往往就是记特征，这样才能“抓大放小”“透过现象看本质”，而且是记重要的、突出的特征，有的特征不明显或区别意义不大，记不记得无所谓。关于有效的特征集的清晰记忆对于决策有决定性意义。模式识别工作通常就是通过特征识别而进行分类的。卡尔·雅斯贝斯的《时代的精神状况》中有这么一段：“如果回忆仅仅是关于过去的知识，那么它就无非是无限数量的考古材料的堆积而已。如果回忆仅仅是富于理智的沉思，那么它只不过是作为一种无动于衷的观照而描述了过去的图景而已。只有当回忆采取了汲取的形式时，才会形成在对历史的尊崇中的当代人个体自我的实现；而后，这个回忆才会作为一种标准来衡量当代人自身的感情与活动；最后，这个回忆才会成为当代人对他自身的永恒存在的参与。”［8］客观言事绝非易事，带主观性会影响记忆准确性。


    冯·诺依曼当年也期待模拟人脑结构，而不仅是制造他提出的那种串行结构的计算机。就功能而言，两者有交集，内容记忆是其一。比如关于他的回忆中，最后一则逸事是他弟弟在医院为他诵读歌德的德文原版《浮士德》在翻页停顿时，冯·诺依曼急促地背诵出后面几句［9］。如此神奇之事，于计算机而言轻而易举。


    2.5　形象思维


    钱学森晚年，从历史过程、现实需求和未来趋势出发，系统思考和阐述更为深邃而宽广的现代科学技术体系，指导学科研究方向，试图将人类知识系统纳入科学技术范畴，尽可能用科学方法进行研究或阐述，表现出卓越的眼光和非凡的胆识，无论其勇气还是成就都独领风骚，令人钦佩。


    其现代科学技术体系从横向上看有11大科学技术部门，即自然科学、社会科学、数学科学、系统科学、思维科学、行为科学、人体科学、军事科学、地理科学、建筑科学、文艺理论与文艺创作［10］。其中例外的是文艺，它只有理论层次，实践层次上的文艺创作，就不是科学问题，而属于艺术范畴。在11大部门之外，还有未形成科学体系的实践经验的知识库，以及广泛的大量成文或不成文的实际感受，如局部经验、专家的判断、行家的手艺等也都是人类对世界认识的珍宝，待逐步加入。随着科学技术的进一步发展，还会产生出新的科学技术部门。这个体系从上往下分为三层，最高层是马克思主义哲学、辩证唯物主义。最下面一层即上述11大部门，中间都有一座桥梁，比如思维科学对应的是认识论，文艺理论与文艺创作对应的是审美观。在每一部门中，又分为基础科学、技术科学和应用技术，对应于文艺的则是美学、文艺理论和具体方法（如绘画技巧）。不同部门间有联系，比如美学要从思维科学吸取营养。钱学森指出，发展思维科学的一个效果，就是人工智能的目的可能实现了。另一个效果是使我们懂得如何更充分地发挥人脑的能力。他设想的逐步递进的方法、技术、系统、工程和学说如下：


    ●开放的复杂巨系统方法；


    ●从定性到定量的综合集成技术；


    ●综合集成研讨厅体系；


    ●大成智慧工程；


    ●大成智慧学。


    钱学森的思考既有宏阔的视野和思想，又有针对具体的技术和背景，将古今中外知识集大成而利用之的思想，与大语言模型学习海量知识本质上一致，只是当时隐含的技术路线更多一些的是推理机制，而大语言模型实际上具备了一定的形象思维功能，那是钱学森倡导研究的关键内容之一。


    人脑在生理上的形象思维功能早有定论。20世纪60年代，斯佩利（R.W.Sperry）及其学生加扎尼加（M.S.Gazzaniga）、莱文（J.Levy）做裂脑实验时发现，人脑的各一半，都有其自身独立的意识思维序列，以及其自身的记忆［11］。左半脑主要负责逻辑、分析、理解、推理、语言、判断、排列、分类，思维方式具有连续性、延续性和分析性。右半脑主要负责空间形象记忆、直觉、身体协调、视知觉、音乐节奏、想象、灵感、顿悟等，思维方式具有无序性、跳跃性、直觉性等。斯佩利因提出“大脑两半球分工差异”而获得1981年度诺贝尔生理学或医学奖。通俗而言，左脑负责抽象思维，右脑负责形象思维。形象思维是结合主观经验和情感，对感受、储存的客观形象进行识别、描述和创造的一种思维形式，与抽象思维相对应，具有非逻辑性、概略性和想象性等特点。


    形象思维与审美相关。马克思在《1844年经济学哲学手稿》中提出“自然的人化”，李泽厚认为它是其基本艺术理论与美学思想，包含两个方面，“一方面是外在自然的人化，即山河大地、日月星辰的人化。人类在外在自然的人化中创造了物质文明。另一方面是内在自然的人化，即人的感官、感知、情感和欲望的人化。”［12］外在自然的人化，主要靠社会的劳动生产实践；内在自然的人化，主要靠教育、文化、修养和艺术。美学告诉我们如何理解、讨论艺术，理解比直接的欣赏更进了一步，属于理论范畴。这里要追求的不是科学上或逻辑上的定义的明确性，而是理解的透彻性。理解包括分析和综合两个方面［13］。


    文学艺术、禅宗、中医等都是钱学森思考的对象和载体。表面看，这些领域与科学技术、思维科学无关，然其背后都联系着一种引人入胜的思维机制。他指出，抽象思维是一步步推下去的，是线型的，或者又分叉，是交叉型的。而形象思维常常连一点来龙去脉都搞不清楚，所以它似乎不是面形的、二维的，而是空间的综合的“杂交”过程，有时是跳跃的、发散的。古今中外历史上，不少政治、军事、商业、贸易的合理决策，并不是逻辑推理的结果。总工程师和战争中的指挥员，最后下了决心大家就这么干。一干对了，究竟怎样对的？为什么要这样干？谁也不知道是怎么回事。人认字的本事大得很，写得很潦草的字，龙飞凤舞，也难不住人。人听话的本事也是很大的，即便话里毛病多，可能文法也不对，还有些语气词夹在里头，可都听得懂。熟练的打字员，为什么打得那么快？人在醒觉时得不到对问题的答案，可以在梦里得到，在梦里怎么得到答案的？而所描述的梦里的情况都跟形象有关系。一块不平的铜片，钳工师傅用锤子敲几下就平了，但说不出来，别人又干不了。他还说过，据王守觉院士观察，速算者脑子里记住了一些具体的数值计算结果，有个很大的储存库。出了题目以后，他就用那个储存库里已有的东西凑凑就解决了。凑不上，再稍微改一下，这样计算，工作量就小多了［2］。


    钱学森在谈到智能机时指出：“这里的新因素就是想办法把人的经验纳入这个系统中去，这就联系到形象思维，因为形象思维能把还没有形成科学的前科学知识都利用起来。”［14］这些也是与隐性知识有关的知识。“这个世界上应该有两种人，假定他们一起来到一个地方，平生第一次看到一个电话系统，第一种人首先想到的事情是记熟所有的电话号码，第二种人想到的则是弄清楚隐含在这些装置运作中的潜在精神。第一种人喜欢并能理解的是一个目录索引的层面，第二种人的思想则常常脱离目录的层面，沉溺入一种无法拿到桌面上看清楚，隐伏在意识深处，甚至意识的盲点中穿梭运作的胸中感觉。从拓展真正的智慧而非貌似智慧的花式的角度来看，第二种人显得好一点，但令人遗憾的是，我们的传统文化造就了大量的第一种人。”［15］智能模拟的困难在于第二种人呈现出的特点，只是“胸中”二字文学味浓。


    形象思维涉及三个层面。微观上，指思维过程的基本单元，是一些图形、图像和图式；中观上，指智能中特定于形象思维的思维形式，那不是可完善刻画的模式；宏观上，指原始思维、艺术思维、儿童思维等形象思维方式本身，以前更多地只是在文学艺术领域讨论。文艺工作者创作时普遍体现出形象思维特质，但不是说只有形象思维，没有抽象思维。也就是说，它们不是割裂的，也不是完全并行的。形象思维可以暂时、局部范围内以其独特的方式进行，但就某件事的完整思维过程而言，它脱离不开逻辑思维。以往人工智能的工作多限于抽象（逻辑）思维领域，基本原因在于，机器上的“计算”与逻辑思维特征相近，而形象思维过程不易形式化。


    2.6　辩证思维


    俗话说，“要想人不知，除非己莫为”。这是人所共知、容易明白的忠告。但从基本语法出发作分析，此言逻辑上说不通。“除非”后面是条件，即具备“己莫为”这个条件，才有“人不知”这个结果；但没有做什么事，就谈不上别人知道与否；所谓“人不知”与否，是针对已存在的某件事的。此非抽象思维或形象思维可达，需要综合，需要辩证思维。'
  fmt: '

    最初的人工智能是想利用计算机模拟人类的演绎能力，比如通过一系列的选择使得解题过程比依靠记忆来得简捷，而不仅仅想证实计算机如何能解决困难问题。然而，人工智能的困境让人不得不反思归纳的重要性及其不可替代性。


    ## 2.3 预测归纳


    一次笔者应邀到甲骨文发源地安阳参会报告书法创作模拟方面的工作，有位甲骨文研究者在介绍相关知识时，说到占卜。笔者问，《周易》也源于安阳［文王拘（于羑里）而演《周易》］，甲骨文和周易占卜有何关系和不同？回答说那是很专业的一个问题，但未直面说明。历史上，甲骨文和《周易》都关联着同一个地方，即古都安阳，也都涉及一件事情，即占卜或算卦。这类行为所表现的思维过程是可以探究的，抑或通过现代科技手段可以证伪之。比如，“八字算卦”除了利用其时间段，还依赖其他什么信息？其“推演”过程是怎样一步步递进的？经验知识是如何被利用的？这些也都是人工智能面对的话题，对于我们很好地理解形象思维机制定有一定程度的帮助或启迪。其结果纵是偶然“有准”，但在多数情况下莫衷一是，因而没有说服力^([\[3\]](#txt003.html#footnote_content_txt003_3))。这件事与中医似乎有一些共同之处：


    第一，是中国传统文化发展过程中的一种与生命相关的现象；

    第二，与迄今为止的科学不合；

    第三，思维机理或内部过程不明；

    第四，缺乏统计意义下的实验与分析；

    第五，容易被归为“伪科学”。


    中医有其效果和手段，而算卦似乎无从谈起。然而，放开眼界、更换视点，是否可以像“中医现代化”一样探究一下与预测相联系的算卦本身？就如原始思维幼稚、粗疏，但它不仅是研究的对象，还创造了甲骨文本身。


    甲骨占卜的过程还未有一致的表述，易经算卦尽管过程看起来复杂，实际上其结果也就是8种、64种或324种等有限种类。可能甲骨占卜是源头，易经算卦是符号化和系统化的工作，而八字预测是后来的一种具体形式。这类事若有一定的合理性，则应该是建立在大量统计数据基础之上的。由随处可见的模棱两可，反过来可知目前所谓的算卦的不可细究之根基了。


    笔者曾电话请教一位据云是工科背景的计算机算卦研发者。


    问：同一时辰出生者是否结论一样？

    答：那是大的趋势和表现，朱元璋手下的刘伯温曾寻找与朱元璋同一时辰的出生者，是一养蜜蜂的，从统治和管理角度看是类似的。他们目前有10万个案例。


    问：从统计学出发，有对某一情形的足够的样本不？

    答：干那事要见多识广，要结合具体的历史和社会环境。


    问：当下和一个60年前出生的人在他们看来有何区别？

    答：那时刚“解放”，生活条件较差等。


    问：那是在中国，欧美呢？

    答：所以要有广博的知识。


    问：你们基本的依据是什么？

    答：都是前人留下的，但没有哪本书完整给出具体过程，计算机程序也只是一个基本内核，其余的靠当场诉说，比如结合人的长相等。


    问：盲人看不到吧？

    答：盲人的其他感官更灵，很容易知晓。只要理解了16个字就好：太极八卦，阴阳五行，天干地支，河图洛书。比如计算机的“0”和“1”的表示，“阴”和“阳”的内涵比之要丰富得多。


    那确实是中国传统文化的精深内容，但有的众说纷纭，有的不知所云，谈对它们的全面理会同样似是而非，什么都能装的瓶，适用面是广了，掺杂和附会的空间也随之不断扩大。再者，“八字”里不含地域信息，而很多有成就者出生在贫困地区，他们的人生比出生在城市或富裕地区者出彩。


    上述的软件系统据说能分出100万种情形，从人的大类来看，也可说是一种归纳结果，但被归为一类的人确实一样吗？他说他们也努力找，但要找到同类的做分析很难。实际上，信息技术发展到如今，根据户籍资料等进行统计分析已经可能。他不时会显出一种企图说服人的口气，而笔者的初衷并非是与其明确是非，只是对其推演过程所表现出的思维特征有兴趣，主要想知道他们是如何利用自己的经验和阅历的，但他没有给出具体解释。看来，他们说不清，这个过程可使得我们进一步清楚地知晓其“漏洞”，基本结论是：


    第一，那是一种长期以来形成的思维内容，无论过程还是方式是否有某种程度的可靠依据不得而知；

    第二，形成现有的一套所谓的经验知识颇为不易，听起来不比现在的科学实验和科技论文的造假简单；

    第三，由于需要经验和不断地归纳出一些“结论”，得有一定的形象思维和推理能力；

    第四，不会全是糟粕而一无是处，就如同“风水”与地理、气候状况有关而不是全无道理一样，或可得到一点启发；

    第五，只要有一定数量的包括详细信息的案例，则可以进行更大范围的统计分析。


    在各种“场景”面前，需要以辩证的思维方式对待之，首先要有基本的观念和“定力”，否则就会“信之则灵”了。


    理性思维与经验思维，作为人类思维发生作用及其进步的两个方面，在从柏拉图到笛卡尔、斯宾诺莎、莱布尼茨等至今两千多年的发展中，呈现出自成体系又相互交叉的脉络。由宏观而言的东方文化和西方文化两者的特点和历史可见，理性主义在与经验主义作用交替的道路上，逐步成为占据当今科技、文化主导地位的思维形态，并切实影响和支撑了生机蓬勃的现代文明，而同样有逻辑（形式逻辑）苗头的中国传统文化孕育了时而被忽视的东方思维的主要形态，由于其与理性思维的“分道扬镳”，又导致中国整体上科技的落后，以致有了“李约瑟难题”，即直到中世纪中国还比欧洲先进，而近代科学和科学革命却发生在欧洲这一历史现象。这是众多仁人志士关心、热议的话题，包括这个话题本身，一直有人“各抒己见”。既然中国传统思维有其自身的方式、机制和现实效应，当然没有理由漠然视之。诚然，如有些文化名人所言，21世纪将是东方文化的时代、东方思维将大放异彩等。这些预言似乎更大程度上是一种富有感情色彩的期待，至少难以获得这样的逻辑推论。中国传统文化，儒教、道家、禅宗，或儒道释交融，均未引导出现代科技的领先之步，而别的民族也在不断进步和发展。还有艺术工作者说，越是传统的，就越（会）是现代的，这未免太有“艺术家”色彩，这么绝对的结论显然与西方的理性思维所要求的实证、推演格格不入，这也是东方文化弱点的一种体现。


    预测首先依赖于大量的历史数据，那不仅是数据也是经验，如果没有足够的数据供学习，预测将可能是空想或者胡言。实际预测前，需要取所获得的数据的一部分训练模型，而剩下的数据用于测试。但它们间的比例多少合适，既依赖于经验，还需要通过测试调整。因此，整个过程也离不开经验^([\[4\]](#txt003.html#footnote_content_txt003_4))。


    预测作为思维的一种形式，有不同的可研究侧面，比如网络路由资源的分配。假定用户间存在对网络资源的竞争，通常假定用户和资源供应者独立优化各自的效用函数，从而使资源分配达到某一均衡解。由于业务需求到来的随机性和处理的延时，使决策的做出在采样间隔内落后于采样时刻，导致它们均是准实时的，从而影响准确性和灵敏度；同时，被接受的业务将在“未来”的一段时间内保持并占有资源。所以，良好的决策应考虑：资源的使用（或业务）将受到的以及将产生的影响。也就是说，决策依据的网络情况应超前于采样时刻，即应进行预测。笔者因而给出“预测—决策”网络路由资源智能分配策略［6］：将网络映象成一个多智能体系统，每个结点含一个智能体。通过对网络负荷的时间序列分析进行预测，把握网络的负荷趋势。若同一时刻的请求多于现有资源，则作进一步决策。在实际电信网数据上进行了分析与比较。


    那以后笔者才开始用移动电话，比较晚（没用过寻呼机），原来总觉得移动电话有辐射，于身体有害，可用了以后就觉得离不开它了。假如能开车，就像有移动电话一样，会方便得多，这是类比和演绎。道路上新车很多，不管是私家车，还是公务车，只要是新的，坐上就能闻到异味，由此可归纳，目前我国出售的普通车，车内环保方面的指标估计有问题。公交车上，时常有乘客向驾驶员询问是否能到某地、如何转车到达目的地，驾驶员通常都能给出有益建议，由此可推测，驾驶员上岗前对相关交通信息要有所了解，在这个过程中，他们自己也不断熟悉各种情况，这结论又是演绎了。日常生活中靠归纳的机会也不多，演绎能力极为独特，稍不留神就会以偏概全。笔记小说《北梦琐言》中有一个故事，说有一条三丈长的白蛇盘在树枝上，垂头而歇，有一褐土色蛤蟆状的如盘之物四足而跳，至蛇下仰视，蛇垂头而死。此前有动物为蛇所吞，如蛤蟆，坠而致死。于是感叹，“凡毒物必有能制者，殆天意也。”［7］云云。这样的大跨度推理缺乏足够的样本而过于粗陋，于逻辑相去远了。


    ## 2.4 记忆搜索


    疫情期间某个周末笔者用完早餐照例去医院看父母，走到离所住小区次近（但是是医院近方向）的公交站，见指示牌还有三站，笔者依习惯再走往下一站，到站时车辆将进站，忽然发觉口罩不在口袋里，附近路旁没店，迟疑数秒只得回家取。从家里出来后还是一样，多走了一站。通常说脑子好不好使指逻辑推理、空间想象等能力，其实记忆力也是天赋之一，那不仅有助于专业知识积累与精化，还是减少日常生活重复并使之高效的前提。笔者只得以被动多了一点走路的锻炼“驱散”记性不好的无奈。“不如意事常八九”，能有走路锻炼的“补偿”已是难得。


    某日笔者准备取隔日晚上拿出的几件此前所购书画作品送装裱，书桌上没见，觉得意外，于是在可能的地方寻找，反复两次均未果，只能作罢，只怪自己记性益弱。出门前忽想到可能在同样是隔日晚理出的几个画框间，果然在其中一个的夹板和玻璃间，是当时收拾时没留意取出所致。这事看似是“顿悟”之果，无疑受了记忆中类似情况启发，比如同样是找不见某物，后来在某处“得来全不费工夫”。记忆又难免受各种干扰，有一次在南京出租车上司机说起金陵饭店：


    我：那是20世纪70年代末的事情了。

    司机：80年代。

    我：似乎不到80年代。

    司机：上中学那会，记得的。


    想着他是南京人，又有明确的参考“点”，就认可其说。回后有一天忽然想起，查了一下，是70年代末开工，落成则是几年后的80年代初了，估计司机所指即是，已过去超过40年。笔者印象很深的是打桩的情景，因为是高楼，桩打得深、声音巨响，那时候是特别所见。


    有次去一处与友人见面，地点在两路相交处，位置不确定，与司机说了目的地，到附近司机说不清楚具体方向，便电话问对方说也在找，司机说往左拐，那儿饭店多些。拨“114”电话询问，又转到交通台，还没等话务员说完，笔者忽然想起，那家饭店很多年前曾去过，司机所选方向正好相反。这固然与记性有关，似乎又不仅仅是记性的问题，记性只是记得牢否的问题，智能还包括搜索、联想等能力，这与依据经验“临场”应用有关^([\[5\]](#txt003.html#footnote_content_txt003_5))。


    犬子小时候会走路后，有次到他爷爷奶奶处用完午餐，笔者带他走到小区边一座小桥旁，是两条干道的交会处，他看见一辆辆车经过，一一指手画脚大声说着汽车的品牌，那份开怀前所未见。知道他对汽车感兴趣，如此激动则令人惊讶。在他刚上高中后的那个月，又过去，等车时见一辆极少见的车的底盘几乎贴着地，他说太酷了。笔者与他说起前述那件往事，他说不记得了，什么原因使他那样兴奋、他怎么会知道那么多车？他说是书上看来的。过后笔者有点恍然大悟，记忆中的书本知识与实际场景对上了，也是一种快感。


    记忆的过程往往就是记特征，这样才能“抓大放小”“透过现象看本质”，而且是记重要的、突出的特征，有的特征不明显或区别意义不大，记不记得无所谓。关于有效的特征集的清晰记忆对于决策有决定性意义。模式识别工作通常就是通过特征识别而进行分类的。卡尔·雅斯贝斯的《时代的精神状况》中有这么一段：“如果回忆仅仅是关于过去的知识，那么它就无非是无限数量的考古材料的堆积而已。如果回忆仅仅是富于理智的沉思，那么它只不过是作为一种无动于衷的观照而描述了过去的图景而已。只有当回忆采取了汲取的形式时，才会形成在对历史的尊崇中的当代人个体自我的实现；而后，这个回忆才会作为一种标准来衡量当代人自身的感情与活动；最后，这个回忆才会成为当代人对他自身的永恒存在的参与。”［8］客观言事绝非易事，带主观性会影响记忆准确性。


    冯·诺依曼当年也期待模拟人脑结构，而不仅是制造他提出的那种串行结构的计算机。就功能而言，两者有交集，内容记忆是其一。比如关于他的回忆中，最后一则逸事是他弟弟在医院为他诵读歌德的德文原版《浮士德》在翻页停顿时，冯·诺依曼急促地背诵出后面几句［9］。如此神奇之事，于计算机而言轻而易举。


    ## 2.5 形象思维


    钱学森晚年，从历史过程、现实需求和未来趋势出发，系统思考和阐述更为深邃而宽广的现代科学技术体系，指导学科研究方向，试图将人类知识系统纳入科学技术范畴，尽可能用科学方法进行研究或阐述，表现出卓越的眼光和非凡的胆识，无论其勇气还是成就都独领风骚，令人钦佩。


    其现代科学技术体系从横向上看有11大科学技术部门，即自然科学、社会科学、数学科学、系统科学、思维科学、行为科学、人体科学、军事科学、地理科学、建筑科学、文艺理论与文艺创作［10］。其中例外的是文艺，它只有理论层次，实践层次上的文艺创作，就不是科学问题，而属于艺术范畴。在11大部门之外，还有未形成科学体系的实践经验的知识库，以及广泛的大量成文或不成文的实际感受，如局部经验、专家的判断、行家的手艺等也都是人类对世界认识的珍宝，待逐步加入。随着科学技术的进一步发展，还会产生出新的科学技术部门。这个体系从上往下分为三层，最高层是马克思主义哲学、辩证唯物主义。最下面一层即上述11大部门，中间都有一座桥梁，比如思维科学对应的是认识论，文艺理论与文艺创作对应的是审美观。在每一部门中，又分为基础科学、技术科学和应用技术，对应于文艺的则是美学、文艺理论和具体方法（如绘画技巧）。不同部门间有联系，比如美学要从思维科学吸取营养。钱学森指出，发展思维科学的一个效果，就是人工智能的目的可能实现了。另一个效果是使我们懂得如何更充分地发挥人脑的能力。他设想的逐步递进的方法、技术、系统、工程和学说如下：


    ●开放的复杂巨系统方法；

    ●从定性到定量的综合集成技术；

    ●综合集成研讨厅体系；

    ●大成智慧工程；

    ●大成智慧学。


    钱学森的思考既有宏阔的视野和思想，又有针对具体的技术和背景，将古今中外知识集大成而利用之的思想，与大语言模型学习海量知识本质上一致，只是当时隐含的技术路线更多一些的是推理机制，而大语言模型实际上具备了一定的形象思维功能，那是钱学森倡导研究的关键内容之一。


    人脑在生理上的形象思维功能早有定论。20世纪60年代，斯佩利（R.W.Sperry）及其学生加扎尼加（M.S.Gazzaniga）、莱文（J.Levy）做裂脑实验时发现，人脑的各一半，都有其自身独立的意识思维序列，以及其自身的记忆［11］。左半脑主要负责逻辑、分析、理解、推理、语言、判断、排列、分类，思维方式具有连续性、延续性和分析性。右半脑主要负责空间形象记忆、直觉、身体协调、视知觉、音乐节奏、想象、灵感、顿悟等，思维方式具有无序性、跳跃性、直觉性等。斯佩利因提出“大脑两半球分工差异”而获得1981年度诺贝尔生理学或医学奖。通俗而言，左脑负责抽象思维，右脑负责形象思维。形象思维是结合主观经验和情感，对感受、储存的客观形象进行识别、描述和创造的一种思维形式，与抽象思维相对应，具有非逻辑性、概略性和想象性等特点。


    形象思维与审美相关。马克思在《1844年经济学哲学手稿》中提出“自然的人化”，李泽厚认为它是其基本艺术理论与美学思想，包含两个方面，“一方面是外在自然的人化，即山河大地、日月星辰的人化。人类在外在自然的人化中创造了物质文明。另一方面是内在自然的人化，即人的感官、感知、情感和欲望的人化。”［12］外在自然的人化，主要靠社会的劳动生产实践；内在自然的人化，主要靠教育、文化、修养和艺术。美学告诉我们如何理解、讨论艺术，理解比直接的欣赏更进了一步，属于理论范畴。这里要追求的不是科学上或逻辑上的定义的明确性，而是理解的透彻性。理解包括分析和综合两个方面［13］。


    文学艺术、禅宗、中医等都是钱学森思考的对象和载体。表面看，这些领域与科学技术、思维科学无关，然其背后都联系着一种引人入胜的思维机制。他指出，抽象思维是一步步推下去的，是线型的，或者又分叉，是交叉型的。而形象思维常常连一点来龙去脉都搞不清楚，所以它似乎不是面形的、二维的，而是空间的综合的“杂交”过程，有时是跳跃的、发散的。古今中外历史上，不少政治、军事、商业、贸易的合理决策，并不是逻辑推理的结果。总工程师和战争中的指挥员，最后下了决心大家就这么干。一干对了，究竟怎样对的？为什么要这样干？谁也不知道是怎么回事。人认字的本事大得很，写得很潦草的字，龙飞凤舞，也难不住人。人听话的本事也是很大的，即便话里毛病多，可能文法也不对，还有些语气词夹在里头，可都听得懂。熟练的打字员，为什么打得那么快？人在醒觉时得不到对问题的答案，可以在梦里得到，在梦里怎么得到答案的？而所描述的梦里的情况都跟形象有关系。一块不平的铜片，钳工师傅用锤子敲几下就平了，但说不出来，别人又干不了。他还说过，据王守觉院士观察，速算者脑子里记住了一些具体的数值计算结果，有个很大的储存库。出了题目以后，他就用那个储存库里已有的东西凑凑就解决了。凑不上，再稍微改一下，这样计算，工作量就小多了［2］。


    钱学森在谈到智能机时指出：“这里的新因素就是想办法把人的经验纳入这个系统中去，这就联系到形象思维，因为形象思维能把还没有形成科学的前科学知识都利用起来。”［14］这些也是与隐性知识有关的知识。“这个世界上应该有两种人，假定他们一起来到一个地方，平生第一次看到一个电话系统，第一种人首先想到的事情是记熟所有的电话号码，第二种人想到的则是弄清楚隐含在这些装置运作中的潜在精神。第一种人喜欢并能理解的是一个目录索引的层面，第二种人的思想则常常脱离目录的层面，沉溺入一种无法拿到桌面上看清楚，隐伏在意识深处，甚至意识的盲点中穿梭运作的胸中感觉。从拓展真正的智慧而非貌似智慧的花式的角度来看，第二种人显得好一点，但令人遗憾的是，我们的传统文化造就了大量的第一种人。”［15］智能模拟的困难在于第二种人呈现出的特点，只是“胸中”二字文学味浓。


    形象思维涉及三个层面。微观上，指思维过程的基本单元，是一些图形、图像和图式；中观上，指智能中特定于形象思维的思维形式，那不是可完善刻画的模式；宏观上，指原始思维、艺术思维、儿童思维等形象思维方式本身，以前更多地只是在文学艺术领域讨论。文艺工作者创作时普遍体现出形象思维特质，但不是说只有形象思维，没有抽象思维。也就是说，它们不是割裂的，也不是完全并行的。形象思维可以暂时、局部范围内以其独特的方式进行，但就某件事的完整思维过程而言，它脱离不开逻辑思维。以往人工智能的工作多限于抽象（逻辑）思维领域，基本原因在于，机器上的“计算”与逻辑思维特征相近，而形象思维过程不易形式化。


    ## 2.6 辩证思维


    俗话说，“要想人不知，除非己莫为”。这是人所共知、容易明白的忠告。但从基本语法出发作分析，此言逻辑上说不通。“除非”后面是条件，即具备“己莫为”这个条件，才有“人不知”这个结果；但没有做什么事，就谈不上别人知道与否；所谓“人不知”与否，是针对已存在的某件事的。此非抽象思维或形象思维可达，需要综合，需要辩证思维。

    '
  trans: '

    最初的人工智能是想利用计算机模拟人类的演绎能力，比如通过一系列的选择使得解题过程比依靠记忆来得简捷，而不仅仅想证实计算机如何能解决困难问题。然而，人工智能的困境让人不得不反思归纳的重要性及其不可替代性。


    ## 2.3 预测归纳


    一次笔者应邀到甲骨文发源地安阳参会报告书法创作模拟方面的工作，有位甲骨文研究者在介绍相关知识时，说到占卜。笔者问，《周易》也源于安阳［文王拘（于羑里）而演《周易》］，甲骨文和周易占卜有何关系和不同？回答说那是很专业的一个问题，但未直面说明。历史上，甲骨文和《周易》都关联着同一个地方，即古都安阳，也都涉及一件事情，即占卜或算卦。这类行为所表现的思维过程是可以探究的，抑或通过现代科技手段可以证伪之。比如，“八字算卦”除了利用其时间段，还依赖其他什么信息？其“推演”过程是怎样一步步递进的？经验知识是如何被利用的？这些也都是人工智能面对的话题，对于我们很好地理解形象思维机制定有一定程度的帮助或启迪。其结果纵是偶然“有准”，但在多数情况下莫衷一是，因而没有说服力^([\[3\]](#txt003.html#footnote_content_txt003_3))。这件事与中医似乎有一些共同之处：


    第一，是中国传统文化发展过程中的一种与生命相关的现象；

    第二，与迄今为止的科学不合；

    第三，思维机理或内部过程不明；

    第四，缺乏统计意义下的实验与分析；

    第五，容易被归为“伪科学”。


    中医有其效果和手段，而算卦似乎无从谈起。然而，放开眼界、更换视点，是否可以像“中医现代化”一样探究一下与预测相联系的算卦本身？就如原始思维幼稚、粗疏，但它不仅是研究的对象，还创造了甲骨文本身。


    甲骨占卜的过程还未有一致的表述，易经算卦尽管过程看起来复杂，实际上其结果也就是 8 种、64 种或 324 种等有限种类。可能甲骨占卜是源头，易经算卦是符号化和系统化的工作，而八字预测是后来的一种具体形式。这类事若有一定的合理性，则应该是建立在大量统计数据基础之上的。由随处可见的模棱两可，反过来可知目前所谓的算卦的不可细究之根基了。


    笔者曾电话请教一位据云是工科背景的计算机算卦研发者。


    问：同一时辰出生者是否结论一样？

    答：那是大的趋势和表现，朱元璋手下的刘伯温曾寻找与朱元璋同一时辰的出生者，是一养蜜蜂的，从统治和管理角度看是类似的。他们目前有 10 万个案例。


    问：从统计学出发，有对某一情形的足够的样本不？

    答：干那事要见多识广，要结合具体的历史和社会环境。


    问：当下和一个 60 年前出生的人在他们看来有何区别？

    答：那时刚“解放”，生活条件较差等。


    问：那是在中国，欧美呢？

    答：所以要有广博的知识。


    问：你们基本的依据是什么？

    答：都是前人留下的，但没有哪本书完整给出具体过程，计算机程序也只是一个基本内核，其余的靠当场诉说，比如结合人的长相等。


    问：盲人看不到吧？

    答：盲人的其他感官更灵，很容易知晓。只要理解了 16 个字就好：太极八卦，阴阳五行，天干地支，河图洛书。比如计算机的“0”和“1”的表示，“阴”和“阳”的内涵比之要丰富得多。


    那确实是中国传统文化的精深内容，但有的众说纷纭，有的不知所云，谈对它们的全面理会同样似是而非，什么都能装的瓶，适用面是广了，掺杂和附会的空间也随之不断扩大。再者，“八字”里不含地域信息，而很多有成就者出生在贫困地区，他们的人生比出生在城市或富裕地区者出彩。


    上述的软件系统据说能分出 100 万种情形，从人的大类来看，也可说是一种归纳结果，但被归为一类的人确实一样吗？他说他们也努力找，但要找到同类的做分析很难。实际上，信息技术发展到如今，根据户籍资料等进行统计分析已经可能。他不时会显出一种企图说服人的口气，而笔者的初衷并非是与其明确是非，只是对其推演过程所表现出的思维特征有兴趣，主要想知道他们是如何利用自己的经验和阅历的，但他没有给出具体解释。看来，他们说不清，这个过程可使得我们进一步清楚地知晓其“漏洞”，基本结论是：


    第一，那是一种长期以来形成的思维内容，无论过程还是方式是否有某种程度的可靠依据不得而知；

    第二，形成现有的一套所谓的经验知识颇为不易，听起来不比现在的科学实验和科技论文的造假简单；

    第三，由于需要经验和不断地归纳出一些“结论”，得有一定的形象思维和推理能力；

    第四，不会全是糟粕而一无是处，就如同“风水”与地理、气候状况有关而不是全无道理一样，或可得到一点启发；

    第五，只要有一定数量的包括详细信息的案例，则可以进行更大范围的统计分析。


    在各种“场景”面前，需要以辩证的思维方式对待之，首先要有基本的观念和“定力”，否则就会“信之则灵”了。


    理性思维与经验思维，作为人类思维发生作用及其进步的两个方面，在从柏拉图到笛卡尔、斯宾诺莎、莱布尼茨等至今两千多年的发展中，呈现出自成体系又相互交叉的脉络。由宏观而言的东方文化和西方文化两者的特点和历史可见，理性主义在与经验主义作用交替的道路上，逐步成为占据当今科技、文化主导地位的思维形态，并切实影响和支撑了生机蓬勃的现代文明，而同样有逻辑（形式逻辑）苗头的中国传统文化孕育了时而被忽视的东方思维的主要形态，由于其与理性思维的“分道扬镳”，又导致中国整体上科技的落后，以致有了“李约瑟难题”，即直到中世纪中国还比欧洲先进，而近代科学和科学革命却发生在欧洲这一历史现象。这是众多仁人志士关心、热议的话题，包括这个话题本身，一直有人“各抒己见”。既然中国传统思维有其自身的方式、机制和现实效应，当然没有理由漠然视之。诚然，如有些文化名人所言，21
    世纪将是东方文化的时代、东方思维将大放异彩等。这些预言似乎更大程度上是一种富有感情色彩的期待，至少难以获得这样的逻辑推论。中国传统文化，儒教、道家、禅宗，或儒道释交融，均未引导出现代科技的领先之步，而别的民族也在不断进步和发展。还有艺术工作者说，越是传统的，就越（会）是现代的，这未免太有“艺术家”色彩，这么绝对的结论显然与西方的理性思维所要求的实证、推演格格不入，这也是东方文化弱点的一种体现。


    预测首先依赖于大量的历史数据，那不仅是数据也是经验，如果没有足够的数据供学习，预测将可能是空想或者胡言。实际预测前，需要取所获得的数据的一部分训练模型，而剩下的数据用于测试。但它们间的比例多少合适，既依赖于经验，还需要通过测试调整。因此，整个过程也离不开经验^([\[4\]](#txt003.html#footnote_content_txt003_4))。


    预测作为思维的一种形式，有不同的可研究侧面，比如网络路由资源的分配。假定用户间存在对网络资源的竞争，通常假定用户和资源供应者独立优化各自的效用函数，从而使资源分配达到某一均衡解。由于业务需求到来的随机性和处理的延时，使决策的做出在采样间隔内落后于采样时刻，导致它们均是准实时的，从而影响准确性和灵敏度；同时，被接受的业务将在“未来”的一段时间内保持并占有资源。所以，良好的决策应考虑：资源的使用（或业务）将受到的以及将产生的影响。也就是说，决策依据的网络情况应超前于采样时刻，即应进行预测。笔者因而给出“预测—决策”网络路由资源智能分配策略［6］：将网络映象成一个多智能体系统，每个结点含一个智能体。通过对网络负荷的时间序列分析进行预测，把握网络的负荷趋势。若同一时刻的请求多于现有资源，则作进一步决策。在实际电信网数据上进行了分析与比较。


    那以后笔者才开始用移动电话，比较晚（没用过寻呼机），原来总觉得移动电话有辐射，于身体有害，可用了以后就觉得离不开它了。假如能开车，就像有移动电话一样，会方便得多，这是类比和演绎。道路上新车很多，不管是私家车，还是公务车，只要是新的，坐上就能闻到异味，由此可归纳，目前我国出售的普通车，车内环保方面的指标估计有问题。公交车上，时常有乘客向驾驶员询问是否能到某地、如何转车到达目的地，驾驶员通常都能给出有益建议，由此可推测，驾驶员上岗前对相关交通信息要有所了解，在这个过程中，他们自己也不断熟悉各种情况，这结论又是演绎了。日常生活中靠归纳的机会也不多，演绎能力极为独特，稍不留神就会以偏概全。笔记小说《北梦琐言》中有一个故事，说有一条三丈长的白蛇盘在树枝上，垂头而歇，有一褐土色蛤蟆状的如盘之物四足而跳，至蛇下仰视，蛇垂头而死。此前有动物为蛇所吞，如蛤蟆，坠而致死。于是感叹，“凡毒物必有能制者，殆天意也。”［7］云云。这样的大跨度推理缺乏足够的样本而过于粗陋，于逻辑相去远了。


    ## 2.4 记忆搜索


    疫情期间某个周末笔者用完早餐照例去医院看父母，走到离所住小区次近（但是是医院近方向）的公交站，见指示牌还有三站，笔者依习惯再走往下一站，到站时车辆将进站，忽然发觉口罩不在口袋里，附近路旁没店，迟疑数秒只得回家取。从家里出来后还是一样，多走了一站。通常说脑子好不好使指逻辑推理、空间想象等能力，其实记忆力也是天赋之一，那不仅有助于专业知识积累与精化，还是减少日常生活重复并使之高效的前提。笔者只得以被动多了一点走路的锻炼“驱散”记性不好的无奈。“不如意事常八九”，能有走路锻炼的“补偿”已是难得。


    某日笔者准备取隔日晚上拿出的几件此前所购书画作品送装裱，书桌上没见，觉得意外，于是在可能的地方寻找，反复两次均未果，只能作罢，只怪自己记性益弱。出门前忽想到可能在同样是隔日晚理出的几个画框间，果然在其中一个的夹板和玻璃间，是当时收拾时没留意取出所致。这事看似是“顿悟”之果，无疑受了记忆中类似情况启发，比如同样是找不见某物，后来在某处“得来全不费工夫”。记忆又难免受各种干扰，有一次在南京出租车上司机说起金陵饭店：


    我：那是 20 世纪 70 年代末的事情了。

    司机：80 年代。

    我：似乎不到 80 年代。

    司机：上中学那会，记得的。


    想着他是南京人，又有明确的参考“点”，就认可其说。回后有一天忽然想起，查了一下，是 70 年代末开工，落成则是几年后的 80 年代初了，估计司机所指即是，已过去超过
    40 年。笔者印象很深的是打桩的情景，因为是高楼，桩打得深、声音巨响，那时候是特别所见。


    有次去一处与友人见面，地点在两路相交处，位置不确定，与司机说了目的地，到附近司机说不清楚具体方向，便电话问对方说也在找，司机说往左拐，那儿饭店多些。拨“114”电话询问，又转到交通台，还没等话务员说完，笔者忽然想起，那家饭店很多年前曾去过，司机所选方向正好相反。这固然与记性有关，似乎又不仅仅是记性的问题，记性只是记得牢否的问题，智能还包括搜索、联想等能力，这与依据经验“临场”应用有关^([\[5\]](#txt003.html#footnote_content_txt003_5))。


    犬子小时候会走路后，有次到他爷爷奶奶处用完午餐，笔者带他走到小区边一座小桥旁，是两条干道的交会处，他看见一辆辆车经过，一一指手画脚大声说着汽车的品牌，那份开怀前所未见。知道他对汽车感兴趣，如此激动则令人惊讶。在他刚上高中后的那个月，又过去，等车时见一辆极少见的车的底盘几乎贴着地，他说太酷了。笔者与他说起前述那件往事，他说不记得了，什么原因使他那样兴奋、他怎么会知道那么多车？他说是书上看来的。过后笔者有点恍然大悟，记忆中的书本知识与实际场景对上了，也是一种快感。


    记忆的过程往往就是记特征，这样才能“抓大放小”“透过现象看本质”，而且是记重要的、突出的特征，有的特征不明显或区别意义不大，记不记得无所谓。关于有效的特征集的清晰记忆对于决策有决定性意义。模式识别工作通常就是通过特征识别而进行分类的。卡尔·雅斯贝斯的《时代的精神状况》中有这么一段：“如果回忆仅仅是关于过去的知识，那么它就无非是无限数量的考古材料的堆积而已。如果回忆仅仅是富于理智的沉思，那么它只不过是作为一种无动于衷的观照而描述了过去的图景而已。只有当回忆采取了汲取的形式时，才会形成在对历史的尊崇中的当代人个体自我的实现；而后，这个回忆才会作为一种标准来衡量当代人自身的感情与活动；最后，这个回忆才会成为当代人对他自身的永恒存在的参与。”［8］客观言事绝非易事，带主观性会影响记忆准确性。


    冯·诺依曼当年也期待模拟人脑结构，而不仅是制造他提出的那种串行结构的计算机。就功能而言，两者有交集，内容记忆是其一。比如关于他的回忆中，最后一则逸事是他弟弟在医院为他诵读歌德的德文原版《浮士德》在翻页停顿时，冯·诺依曼急促地背诵出后面几句［9］。如此神奇之事，于计算机而言轻而易举。


    ## 2.5 形象思维


    钱学森晚年，从历史过程、现实需求和未来趋势出发，系统思考和阐述更为深邃而宽广的现代科学技术体系，指导学科研究方向，试图将人类知识系统纳入科学技术范畴，尽可能用科学方法进行研究或阐述，表现出卓越的眼光和非凡的胆识，无论其勇气还是成就都独领风骚，令人钦佩。


    其现代科学技术体系从横向上看有 11 大科学技术部门，即自然科学、社会科学、数学科学、系统科学、思维科学、行为科学、人体科学、军事科学、地理科学、建筑科学、文艺理论与文艺创作［10］。其中例外的是文艺，它只有理论层次，实践层次上的文艺创作，就不是科学问题，而属于艺术范畴。在
    11 大部门之外，还有未形成科学体系的实践经验的知识库，以及广泛的大量成文或不成文的实际感受，如局部经验、专家的判断、行家的手艺等也都是人类对世界认识的珍宝，待逐步加入。随着科学技术的进一步发展，还会产生出新的科学技术部门。这个体系从上往下分为三层，最高层是马克思主义哲学、辩证唯物主义。最下面一层即上述
    11 大部门，中间都有一座桥梁，比如思维科学对应的是认识论，文艺理论与文艺创作对应的是审美观。在每一部门中，又分为基础科学、技术科学和应用技术，对应于文艺的则是美学、文艺理论和具体方法（如绘画技巧）。不同部门间有联系，比如美学要从思维科学吸取营养。钱学森指出，发展思维科学的一个效果，就是人工智能的目的可能实现了。另一个效果是使我们懂得如何更充分地发挥人脑的能力。他设想的逐步递进的方法、技术、系统、工程和学说如下：


    ●开放的复杂巨系统方法；

    ●从定性到定量的综合集成技术；

    ●综合集成研讨厅体系；

    ●大成智慧工程；

    ●大成智慧学。


    钱学森的思考既有宏阔的视野和思想，又有针对具体的技术和背景，将古今中外知识集大成而利用之的思想，与大语言模型学习海量知识本质上一致，只是当时隐含的技术路线更多一些的是推理机制，而大语言模型实际上具备了一定的形象思维功能，那是钱学森倡导研究的关键内容之一。


    人脑在生理上的形象思维功能早有定论。20 世纪 60 年代，斯佩利（R.W.Sperry）及其学生加扎尼加（M.S.Gazzaniga）、莱文（J.Levy）做裂脑实验时发现，人脑的各一半，都有其自身独立的意识思维序列，以及其自身的记忆［11］。左半脑主要负责逻辑、分析、理解、推理、语言、判断、排列、分类，思维方式具有连续性、延续性和分析性。右半脑主要负责空间形象记忆、直觉、身体协调、视知觉、音乐节奏、想象、灵感、顿悟等，思维方式具有无序性、跳跃性、直觉性等。斯佩利因提出“大脑两半球分工差异”而获得
    1981 年度诺贝尔生理学或医学奖。通俗而言，左脑负责抽象思维，右脑负责形象思维。形象思维是结合主观经验和情感，对感受、储存的客观形象进行识别、描述和创造的一种思维形式，与抽象思维相对应，具有非逻辑性、概略性和想象性等特点。


    形象思维与审美相关。马克思在《1844 年经济学哲学手稿》中提出“自然的人化”，李泽厚认为它是其基本艺术理论与美学思想，包含两个方面，“一方面是外在自然的人化，即山河大地、日月星辰的人化。人类在外在自然的人化中创造了物质文明。另一方面是内在自然的人化，即人的感官、感知、情感和欲望的人化。”［12］外在自然的人化，主要靠社会的劳动生产实践；内在自然的人化，主要靠教育、文化、修养和艺术。美学告诉我们如何理解、讨论艺术，理解比直接的欣赏更进了一步，属于理论范畴。这里要追求的不是科学上或逻辑上的定义的明确性，而是理解的透彻性。理解包括分析和综合两个方面［13］。


    文学艺术、禅宗、中医等都是钱学森思考的对象和载体。表面看，这些领域与科学技术、思维科学无关，然其背后都联系着一种引人入胜的思维机制。他指出，抽象思维是一步步推下去的，是线型的，或者又分叉，是交叉型的。而形象思维常常连一点来龙去脉都搞不清楚，所以它似乎不是面形的、二维的，而是空间的综合的“杂交”过程，有时是跳跃的、发散的。古今中外历史上，不少政治、军事、商业、贸易的合理决策，并不是逻辑推理的结果。总工程师和战争中的指挥员，最后下了决心大家就这么干。一干对了，究竟怎样对的？为什么要这样干？谁也不知道是怎么回事。人认字的本事大得很，写得很潦草的字，龙飞凤舞，也难不住人。人听话的本事也是很大的，即便话里毛病多，可能文法也不对，还有些语气词夹在里头，可都听得懂。熟练的打字员，为什么打得那么快？人在醒觉时得不到对问题的答案，可以在梦里得到，在梦里怎么得到答案的？而所描述的梦里的情况都跟形象有关系。一块不平的铜片，钳工师傅用锤子敲几下就平了，但说不出来，别人又干不了。他还说过，据王守觉院士观察，速算者脑子里记住了一些具体的数值计算结果，有个很大的储存库。出了题目以后，他就用那个储存库里已有的东西凑凑就解决了。凑不上，再稍微改一下，这样计算，工作量就小多了［2］。


    钱学森在谈到智能机时指出：“这里的新因素就是想办法把人的经验纳入这个系统中去，这就联系到形象思维，因为形象思维能把还没有形成科学的前科学知识都利用起来。”［14］这些也是与隐性知识有关的知识。“这个世界上应该有两种人，假定他们一起来到一个地方，平生第一次看到一个电话系统，第一种人首先想到的事情是记熟所有的电话号码，第二种人想到的则是弄清楚隐含在这些装置运作中的潜在精神。第一种人喜欢并能理解的是一个目录索引的层面，第二种人的思想则常常脱离目录的层面，沉溺入一种无法拿到桌面上看清楚，隐伏在意识深处，甚至意识的盲点中穿梭运作的胸中感觉。从拓展真正的智慧而非貌似智慧的花式的角度来看，第二种人显得好一点，但令人遗憾的是，我们的传统文化造就了大量的第一种人。”［15］智能模拟的困难在于第二种人呈现出的特点，只是“胸中”二字文学味浓。


    形象思维涉及三个层面。微观上，指思维过程的基本单元，是一些图形、图像和图式；中观上，指智能中特定于形象思维的思维形式，那不是可完善刻画的模式；宏观上，指原始思维、艺术思维、儿童思维等形象思维方式本身，以前更多地只是在文学艺术领域讨论。文艺工作者创作时普遍体现出形象思维特质，但不是说只有形象思维，没有抽象思维。也就是说，它们不是割裂的，也不是完全并行的。形象思维可以暂时、局部范围内以其独特的方式进行，但就某件事的完整思维过程而言，它脱离不开逻辑思维。以往人工智能的工作多限于抽象（逻辑）思维领域，基本原因在于，机器上的“计算”与逻辑思维特征相近，而形象思维过程不易形式化。


    ## 2.6 辩证思维


    俗话说，“要想人不知，除非己莫为”。这是人所共知、容易明白的忠告。但从基本语法出发作分析，此言逻辑上说不通。“除非”后面是条件，即具备“己莫为”这个条件，才有“人不知”这个结果；但没有做什么事，就谈不上别人知道与否；所谓“人不知”与否，是针对已存在的某件事的。此非抽象思维或形象思维可达，需要综合，需要辩证思维。

