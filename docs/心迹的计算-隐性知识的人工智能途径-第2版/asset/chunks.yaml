- raw: '母亲住院时有一天晚上笔者去病房探望，父亲说母亲指甲需要剪一下并问是否看得见，以前都是白天修。保姆说眼睛不好、不敢弄，那就笔者来修剪。由于母亲的手臂内弯、手掌紧握，指甲钳很难处于恰当的位置，光线也没法照到，突然听到母亲“哦哟”一声、手一缩，一看确是有点血痕。笔者很内疚，请护士处理，护士去后一开始没发现，后来说已结痂（没想到如此快），涂了药水。因而，在有了做事的愿望以后，还需要考虑对象内因（手掌状态自然）、外部条件（光线充足），以及适当的工具与方法。那个指甲钳是笔者去日本参会时带回的，有放大镜，适合老人用，母亲在自己能动手时用起来很顺手：大而料好，但也正因为如此，不小心可能“殃及”指甲以外的皮肉。


    2.3　应用牵引


    社会生活中有太多待解决的问题或任务，对此，首要的是有的放矢。有可能的话，宜专门花点时间琢磨，与随时的感想相结合，从用户需求开始一步步推进。被很多人看到、关注到的做成的事情是少数，有的有其前期的长时间的积累和反复，有的有别人不可复制的地方。有意义的事情不必都要是那种少有的示例，若能最终解决某个问题，则都有价值。反之，不是浪费就是空耗。当然，技术只是其中一个部分而已，政策导向、资金投入、团队合作、市场开拓等缺一不可。


    然而，由于人的素质的差异、一定程度上法制的虚设和不同角色利益的捆绑，使得科研过程及其评价以一种非直接的，甚至无关联的形式呈现。举例而言，我国房地产市场，从大片空房可知泡沫的存在，这与政府的视野、开发商的利益、百姓的心理密切有关，但它对就业、经济增长率有积极意义。再看得具体一点，比如建房需要大量的合格的建材，有人在知道钢筋、水泥是现成可用的情况下，可能提出要研制“强度”更高的建材，未雨绸缪当然不坏。不过不失普遍性的是，建材不是强度越高越好，而是要性价比高。结果是，符合性价比要求的“强度”更高的材料没有出现，或者只在实验室有演示品。此时别人的房子已造好，但隔热材料效果不好，可是别无选择，只能退而求其次沿用原来的——需要关心的“隔热”问题明摆着但没人理睬，而这个问题如能解决对于舒适度、环保低碳、节能减耗等都有直接影响。


    再如，建造高原高速公路，目的是用公路连接两个高原地区，技术问题涉及气温环境、岩石冻土等，基本要求是克服这些因素带来的困难，不能忽略这些基本问题而本末倒置地考虑设计上的美观、优雅，因为功能的实现及其可靠性是首要的，即使局部建模及其优化做得很好，但总体不协调、没有实用价值，或实施代价太高，纵然是不同于以前的创新工作也只能是“样板”。


    又如软件工程方法是在软件开发常常进度拖延、预算超额、需求多变的背景下提出并形成的工程化方法，包括逐步细分的需求分析、系统设计、代码编写、功能测试、应用维护等环节，但实践中往往我行我素从而问题依旧。这些环节中，需求分析是首要的和尤为关键的。分析过程中，有的一言即明，有的需要反复沟通，有的刻画清晰，是描述性知识，有的是过程性知识^([\[3\]](#att001.html#footnote_content_att001_3))，无论如何，当努力明确为要，有待与领域专家一起梳理现状、凝练主题，然后提出解决方案。既不能以为现有方法可以一用就灵，也不能各自为政，以为事情都是对方（用户、研发方）的，而要在具体需求规范的基础上作合理的设计，“磨刀不误砍柴工”，若忽视前置环节，则不是将问题积累到后续阶段便是出功能残缺不全的半成品。宜力戒实验室小数据试验习惯，关注各方面功能或工作的协调，认真反思出现的错误并克服其产生根源，那不仅是研发问题，还在于观念、态度和服务意识。


    现实生活中，有的科研工作对社会的贡献可能不如一位环卫师傅、建筑工人，估计许多人于此说不以为然，可从投入产出角度看一下。没有有用的成果自不必论，有成果如何？当然可以引以为豪，但若与投入相比，有的成果价值只是投入的几分之一或一零头，有的甚至浪费惊人。简单计算一下正负，结果清晰。以建桥为例：


    首先要架通，不能说这里有好的模型，但实际上还要靠渡船；接着须可靠，不能建不久就如“豆腐渣”；还有成本应合理，计算上冗余很大自然“可靠”，但浪费；然后是美观，桥梁是建筑，但不可本末倒置；最后看效果，利用率越高越有价值。


    2.4　经历反思


    笔者学计算机软件，然而第一个实际任务是面向维修需求的网络适配器逻辑分析（类似于软件的“反汇编”）。因为是硬件问题，开始觉得与所学专业有距离，然而做过以后，原来不重视的数、模电路分析、计算机组成原理等的逻辑图看起来觉得自如，那是第一次由实践得来的关于书本知识与实际间距离的认识。


    其后第一个工作单位是企业，笔者刚去时企业正在研制新一代不间断电源产品，有日本样机和当时航天部研究所作为技术支撑，但近千元一个的日本进口大功率晶体管一个接一个“烧”掉，尽管每次都有分析，然而蛮长时间不见改观，估计除了试验本身难以预料以外，工程师的领域经验以及理论计算不足是重要原因。稳定以后设计部门要开发数倍功率的产品，原以为“依葫芦画瓢”地放大不难，其实需要重新计算和实验，各参数并非线性扩展。后来那里又启动计算机控制的电源系统研制，除了数字化要求的不同，模拟信号处理、干扰消除等都是具体问题。这与笔者后来研究生阶段做的一个机床控制系统遇到的问题类似，本以为软件控制步进电机没那么麻烦。那都是没做过实际系统时“想当然”而已。真能学以致用实非易事^([\[4\]](#att001.html#footnote_content_att001_4))。


    之后笔者做过短期网络维护工作，起先以为就是计算机网络课程内容，此为误区。读博士学位期间参与一个日本合作项目，用到窗口环境的通信接口，按其说明怎么也调不通，日本专家帮助也未果。后来绕开而行。系统本身不断在打“补丁”是一个方面，但经验不足始终是重要原因。博士后期间做了一个仿真效果不错的智能路由选择算法，笔者很想将其应用到实际电信网上，但制造商和运营商都不敢试，当时颇为费解，后来很理解，真正应用还需要大量试验，而那些工作涉及面非常广，没人愿意轻易决定。出站不久，想开发具备全球定位功能的移动位置信息终端即导游终端，因没有资源而未能细化功能，接着还想到列车补票用移动设备等，后来相关功能产品如雨后春笋。


    笔者还学习过一段时间与软件工程相关的软件能力度模型，理论化文档无疑有教条之嫌，但没有基本规范就增加了软件开发过程出错的可能性。后来的科研活动，是找自己感兴趣的题目，要进入实际应用均颇为不易。比如心电图算法，原以为文献一大堆、参考一下即可，其实那些工作与临床要求间有鸿沟，有的准确性接近百分之百的算法在用实际数据测试时性能“腰斩”，同时诊断规则也有需要完善之处；而测试数据代表性不够是突出问题，不仅要满足一定量的要求还要有结论标注。做成一个有生命力的产品，理念、认识、资源、模式、方法是技术以外不可忽视的方面。


    很多企业，已经有可运行的产品，可还是无法站稳，便是例子。有道是：“科学不等于技术，技术不等于产品，产品不等于市场，市场不等于效益”，笔者深以为然。


    计算机科学强调软件开发过程中没法保证软件没有错误，只能通过调试不断纠错的思想，当时似觉说得绝对，只能“囫囵吞枣”地理解。后来听到软件形式化方法，以为那可保证软件不出错。就如与友人交流，不能光说自家有客厅、新茶，交通便捷，每次都到这里见面，而是要设身处地考虑，对方需要你去他家里感受其“品位”以便互相了解现状，也需要到自然环境共享生活意趣，否则，客厅就如实验室，跨不出去。不同环节的开发者不能“互不干预”“各自为政”，这里的“井水不犯河水”思想要不得。


    2.5　普遍倾向


    有次参会，遇到两位工程领域专家，他们都在推动成果产业化。一位说日本有本书介绍其作者通过中医手段治好自身疾病，笔者说那即便确实，或许是孤案。所说的治疗，要求病人所做甚多，治不好是否都是病人的责任？又说起脉诊仪，那位说他们的有效，笔者即说传感器没有做好，如何模拟把脉？没有下文。另一位在给一旁人介绍其使人年轻的保健品，是灵芝提取物，说他们有特殊的提取技术。且不谈此，后来那位又说遇到非同一般的治病“高手”，他自己的病被治好了，而且还能见“灵魂”，绘声绘色。笔者说从古至今该有多少啊，都能见吗？回答说不是，他的“老师”能，但也没那么多，需要特别能力。


    还曾听一位研究员说，他与一老中医聊了半天，老中医说他通过血流分析检测得到的正是中医把脉想要的。笔者说，中医通过把脉感知体征信息，那里的要素是直接的指下感知经验而非体内活动状态，后者难以对应把脉经验，老中医也没可能对其作评价。他们即便努力想厘清把脉过程，也如同测海浪速度但讨论海洋内部的湍流活动——两者当然有关，但间接。对方以为笔者未明其说，实际上其言简单，他不知道笔者不信其言。科技界，臆想者颇多，于是有了吹牛的、骗人的、自以为是的、骑虎难下的。据说那位老中医对媒体宣传的有些中医成果不以为然，这结论大致无误，但不意味着持此类看法者自身的观点就是对的。


    另有一次，一位原来从事光学研究的国家“千人计划”入选者介绍通过人脸多参数获取来提供医疗、健康、美容分析诊断依据的实践，思想上可行，可是哪些特征表征某种症状，这些特征如何感知、模式关系如何，均不清楚。他还提到中医望（面）诊，笔者问与中医仔细交流过没，回答说没有！即便与中医沟通，也难以明对应关系。这样的研究真是无本之木。一条可行之路，是与现有的“四诊仪”的效果作对比，使其面诊能力达到某种基本水平。


    更有著名计算机教授企图让人通过分析脸上血色的变化（也是一种“望”）来测量血压，说者觉得新颖，笔者即说那哪能做好、没用啊！这两者间的关系过于复杂，至少复杂到我们目前不知道到底如何，粗略的估计或许可以尝试。“脸测”是“艺高人胆大”之果？可惜用类似思路做“科研”者绝非少数，而且往往有“佳绩”。一位资深人士说中医的效果没法衡量，这是似是而非之语，“是”的是，目前为止还没有很好地去做；“非”的是，不研究衡量方法，如何才能“衡量”？假如学理工科的都这么认为，那就没法要求不熟悉理工科基本知识的中医者自己去实践。先要认识到中医效果应该可以衡量，才能做试验，从而证明或证伪。


    有次一位教授说起对联书法内容是否可有个小应用解决其识读问题，因有的字并不认得。笔者表示那是一个有趣的问题，一种处理方式是提取骨架然后利用手写体识别技术，并与另外一位相关研究方向的教授交流了想法，他说以前那样做，当下用深度学习即可，他们已做过一些工作。笔者意要两者（指推理与学习）结合，一个没见过的字，学不到，如何识别？这位立刻表示是受数据集限制。这事显现出更为普遍的问题在于，不少科研工作者习惯于实验室“小试”，对实际问题的条件及其复杂性缺乏应有的重视，有时候将不同领域、不同背景、不同层面的问题混为一谈。就如常听上了年龄者说现在记性很差，又说以前的事反而记得。其实，两者并不可同日而语。以前能“记得”的，是重要的或感兴趣的内容，后来是在记忆基础上的“回忆”；现在的“不记得”，是可能压根没进入“记忆”，如果是那样，能“回忆”出什么来？这也从一个侧面表明，不是啥都可以通过“深度学习”而来，尽管学习是必须的。


    坊间有大量科技著作，其中不少理论功底深厚、形式推演丰富，若属纯粹“科学”范畴很正常，若面向技术需求或工程问题，则以解决问题为要。能应用到具体实践中最好，能指导或启发应用也不错，就具体需求而言只及一点、不及其余不算毫无意义，若“声东击西”或“两张皮”就乏善可陈了。


    成果转化是产出的重要标志，有人一个劲地说投入不足、政策不对路或还需时间，即强调外因。有人认识到一些问题，认为要进行角色转换，似乎那样的话事情就顺利了，其实还是想当然。产业化本质上包含若干步骤，每一步都要踏实、到位，且各步要前后相续、有机关联。不管科技人员与管理、市场人员分工，还是独自包揽各项事务，必须保障各环节符合要求才有希望把整个事情做好。如果所做一直是实验室工作甚至一开始就偏离目标，结果可想而知。即便走出实验室过后还要有小试、中试等。


    曾与一位在模糊控制领域有好成果的教授谈起中医诊断系统，他说数十年前他就注意到有这类专家系统，现在有大数据，应该不难吧。笔者告知以把脉模拟为例，当时缺乏的是有效的传感器，采集不到有效数据，后面的工作无从谈起，所见很多所谓“脉诊仪”就是面临这样的问题，因而实质上与医生的指下感觉相去甚远。这位教授还是认为脉象数据的表征应该不难，将这些数据拿来就可解决问题，笔者指出非常复杂、医生自己都难以说清楚，远非幅度和频率可概括，即便是此类不合要求的数据，目前规模也不够。


    理论研究做模型当然无可厚非，但“丰满”与“骨感”到底不是一回事。解决实际问题不限于狭义的“应用”，宏观而言一个数学家解决了物理学问题，具体到人工智能实现了蛋白质结构预测等，都是其例，只不过评判者是物理学家、化学家而非数学家、人工智能技术工作者。


    附录3　中医循证


    关于中医的争议，本质上是针对其理论基础与临床效果的，若希望中医发挥更多作用，则面对误解、贬低甚至否定宜以理服人，一时半会说不透也能理解，但不可自言自语；若批判中医，需要客观、冷静的分析使之言之有理，并注意合乎常识，漏洞时现、矛盾不断反过来表明自身乏理。中医的自证非常重要，就如病人要想康复，自己首先要积极面对，配合治疗，被动等着医生开药、做手术不够，有时适得其反。若有足够说服力，质疑自然可去。


    大家到饭店用餐，若没就卫生情况提出问题则皆大欢喜，假如因某菜欠新鲜、有异味或出现苍蝇而向店家指出，店家应接受现实，如果一个劲地强调卫生没问题，甚至说就是这样、爱吃就吃，则不仅服不了众反而会让声誉受损，承认道歉、下不为例才是。再比如不能见了树阴就说那树茁壮成长，因其可能营养不良、有虫害，仅凭所带来的凉意没法下结论。


    批评中医者其实有类似误区。比如将中国历代皇帝平均寿命低、皇帝又往往得到名中医的服务作为中医无效的依据。人均寿命不断增高是不争的事实，然而于此需要更为基本的统计对照，没有机会获得中医服务的人群情况如何？中医治疗有效的记载并不少见，而皇帝的生活有其特殊性，因此难有代表性，比如他们可能营养过于丰盛（过犹不及）、生活不健康（缺乏必要运动或劳作）、精神压力大（处理宫廷争斗），甚至沉迷于炼丹术等适得其反的活动等，所谓御医不一定是最高水平者，那里杜绝不了“滥竽充数”现象。这些因素不见得都“减”寿，但忽略它们的互相影响就缺乏说服力甚至站不住脚了。


    中医自身将“数千年实践”，以及不断积累的病例作为依据，可是尚不充分。某日友人送我一本名医“讲记”，中医世家有当今声望与他们的治疗作用相关无疑，然而不严密的陈述时现。


    第一，强调扶阳，主用姜等治疗各种疾病，宏观上是否因此排斥了中医的其他手段与方剂：如果其他方法欠佳，则中医似乎限于某家；如果其他方法同样有效，则该法“优势”难以成立。由此而来的问题是，中医门派颇多、莫衷一是，有的互相抵触。


    第二，书中不断提到另外一书，该书不少地方有类似问题，比如指出用西医软化血管之类的措施不解决高血压根本问题。该结论本身不错，但没见到中医就此的解决途径；没有其他办法就只能退而求其次，高血压病人不服药如何是好。


    第三，作者说，他会建议在他那里看三次无果的病人检查肿瘤情况，基本都可确认（肿瘤），言外之意是非肿瘤病他那里都可看好；还说看病非常多人次，没有遇到失败的案例。且不说标准如何，缺乏严格统计就出现了中医普遍的问题，诊病有误诊本身是常识。


    第四，说《黄帝内经》等是宏观思想没错，同时将具体病例对应到《黄帝内经》某句话也可以，只是综合起来会让人觉得依靠《黄帝内经》就可治病，于是问题显然：为何现在有那么多病没法治疗、实际上又有多少经方可对应到《黄帝内经》上？


    第五，整本书的体例是交流式的，举了不少例子，送笔者书的友人过去咨询并服药后觉得有效是实在情况，更重要的是归纳、分析、对比、统计和总结从而面对和解决大家的疑惑，即前面提及的“自证”，否则中医总体上依旧而说不上发展。


    “中学为体，西学为用”是19世纪60年代晚清洋务派对待中西文化的基本思想，主张以中国传统名教为原本、西方科学技术为应用，以改变清王朝时状。20世纪80年代李泽厚反之提出“西学为体，中学为用”，我国医疗领域现状和医生观念是否基本也如此，日常生活中，多数国人的认识是：西医直接、有效，而中医适合调理身体，意即可起辅助作用，可以说那也是“体”“用”之别。


    笔者问过若干西医主任医师，为何没有心脏癌症，有说好像也有例子，有的无言，有说心脏一直在动所以没有（癌症）、只能这么想了。这最后一说可以是一种思考结果，然非依据或结论，因为“肌体一直活动就不会癌变”的断言本身需要证明（癌细胞也是活动的，血液是流动的然而有白血病）。西医与中医一样有许多待阐明或研究的问题。此篇非笔者原本感兴趣的内容，只是希望通过简单的分析引出中医现代化、中医智能化的可能焦点，人工智能技术工作者可助以一臂之力。


    附录4　书法管见


    隐性知识与领域经验直接关联，笔者于医疗诊断无任何体验，因而人工智能与医疗健康的交叉工作依赖于医疗领域专家的指点、启发和帮助，唯于书法学习与欣赏数十年里略有实践和反思。无论其深入或全面与否，是实感具识，是关于隐性知识本身的直接经验，勉强算是一点个人经验，或可言关于隐性知识的“隐性知识”，于此模拟者“甲方”与模拟对象“乙方”可因此合而为一，有助于思维过程建模^([\[5\]](#att001.html#footnote_content_att001_5))。故不揣谫陋，敷述于此。


    4.1　池水初涉


    书法本指书写法则及汉字视觉呈现，似乎难有一句话的定义，而用一堆句子从不同角度作限制性表述，既缺乏概括和凝练特征，又易挂一漏万，不过基本要素还是清晰的：


    ●涉及纸、墨、笔、砚即所谓“文房四宝”（硬笔书法不在其列，尽管如毛泽东的铅笔字同样一流）；


    ●以汉字为表现对象（阿拉伯字暂且不谈），毛笔是首要的和基本的工具；


    ●线条质量，如“肥瘦”“枯润”“厚薄”等对立统一关系是核心内容（或“矛盾”）；


    ●关乎单字结构、字句章法、整篇意境等（审美约束），前人有的言之有物，有的脱离实践甚至玄虚；


    ●讲究关系的对比（空间）与韵律的变化（时间），以及更为微妙的、不易衡量的视觉差异。


    所谓书法学习，首先是了解基本执笔、运笔方法，然后通过笔墨轨迹，留下线条，组合成字，体现章法，呈现形象；同时产生意境、焕发神韵，前者是综合的、整体的精神境界，后者是自然的、独特的审美感受。广义而言，后面几点皆是笔法的外延。


    书法学习在笔法以外，需要广泛临摹，精勤摸索，以及阅历丰富，思维开阔，审美高远诸多因素的支撑。第一、第二点指临摹、阅读（碑帖、书籍）、表达等，既是必需的，也是恒久的；第三点不止诸如参观展览、寻访古碑，与第四、第五点一样都是字外功夫、书外天地；前面三点，通过思维拓展与深化，升华审美境界，从而尽量使目的与结果统一。与百姓喜闻乐见的唱歌做比较，其要求大概就如讲普通话，音色及字正腔圆好比线条在书法学习中的基础角色，一个字、一个字地吐字衔接如同对结构的要求，唱完一首歌也就构成了某种“章法”，这与歌曲创作背景、时代气息、歌唱家感情投入等一起创造出一种意境。'
