- raw: "[\\[5\\]](#txt003.html#footnote_quote_txt003_5)2012年深秋，笔者陪父亲到外地拜访他最近一次见面已是20多年前的一家熟人，联系方式都变了。父亲已80多岁，为了了却父亲的心愿，笔者设法帮助寻找。通过与同在该地的父亲不认识的老同志家联系，得知老人多年前已故，尚无其他信息。我于是请熟人查询到了住址信息。与地段派出所联系，希望确认，未果。最后，通过114查询得知唯一能公开查到的一个相关机构，得知地址没错，并被告知如何过去，说是在该相关机构旁。打电话过去，接电话者回答说不知道要找的人家。那个相关机构接电话者提醒过，就找这个机构，按照住址走会绕路。出租车经过那里时司机说不好开了后，我们就下车。可笔者还是希望按照门牌号寻找，拐了两条路，问了不止三次路，其实车是可开的。到了一个大院门口，经几次一问一答，确定了地方，穿过去到了楼前，就在那个相关机构旁，由其门进入确实非常便当。这情况缘何出现？\
    \  \n\n第一，与生活习惯有关，总觉得门牌号是最直接的线索；  \n\n第二，与思维方式有关，别人提醒的话儿有时候被忽视了；  \n\n第三，与经验有关，有时候按照某周边特征寻找不是最便捷的。\
    \  \n\n如果在记忆中所提醒的机构名被强化了，情况可能就不同了。再就是搜索方式，如果灵活地以先见到的标志为依据，也不一样。可能它们分别对应着深度搜索和广度搜索。同时，附加信息不可轻视。\n\
    \n[\\[6\\]](#txt003.html#footnote_quote_txt003_6)这是理论分析结果。抽象思维的许多具体工作，如数学、物理证明，当今并非都可由计算机完成。\n\
    \n[\\[7\\]](#txt003.html#footnote_quote_txt003_7)有次参会后一位在职博士生送我们去车站，在谈及目前的考核体制时，感叹说，又要做家务，又要负责教学，还有杂事，另外搞科研，压力大、太不易了。笔者表示，即使这样，他们还是选择在高校工作、没有到他处。回答说，这倒也是。高校还是有吸引博士生们的地方。有意无意限于从自己视野出发说事，是普遍的思维定式。\n\
    \n[\\[8\\]](#txt003.html#footnote_quote_txt003_8)有次笔者与图灵奖得主霍尔（T.Hoare）聊及形象思维相对于抽象（逻辑）思维模拟的困难，他反问，你认为逻辑问题都解决了？自然不是，逻辑始终是前提及基础，比如衣食住行一直是人类的基本生活要素，随着观念改变和经济发展，有人旅游探险甚至期望“飞天”，可有的地方吃饱穿暖还保障不了。即便某日世界“大同”了，那些需求依然。\n\
    \n\uFEFF\n\n3　经验知识举足轻重\n\n![](images/txt004_1.jpg \"pagenumber_ebook=66,pagenumber_book=58\"\
    )\n\n胜义超过一切寻思境界，寻思但行言说境界，然而胜义不可言说，胜义绝诸表示而寻思但行表示境界，胜义超过一切寻思。\n\n右录《解深密经》文句 梁漱溟［1］\n\
    \n当科学的改革者主张转向自然并要求实验事实的时候，面向实际的手工业者、工程师和画家确实在获得扎实的经验事实。运用一般人天然的直观的处理方法，寻找的不是最终的真意而仅仅是他们在工作中遇到的现象的有效解释，这些技工们得到的知识嘲弄了那些博学的学究乃至人文主义者所提出的繁复辩解，在语汇学上的长篇推敲，纠缠不清的逻辑推理，以及对罗马和希腊权威的浮夸引证。［2］\n\
    \n——克莱因（M.Kline）\n\n逻辑经验从来念，推理学习深度融。\n\n“经验”与“经验主义”内涵并不相同，后者强调在实验研究基础上的理论推演而非单纯的事实依据或推理，古希腊医生的经验是“经验主义”一词的一个来源^([\\\
    [1\\]](#txt004.html#footnote_content_txt004_1))。此处讨论的经验，既非缺乏理性思考、一味参照过去事情行事、决策者，也非科学研究中与理性主义相对者，而是人们在特定领域，经过长时间体验、训练和摸索后所具备的认识、分析、决策等敏锐的、动态的、综合的能力，是那些通过实践方能了解、掌握和运用的知识。\n\
    \n3.1　不薄常识\n\n用碳-14测定年代是科普常识，笔者曾以为据此啥都可判，实际上误差不小，后来知没法测无机物，因此应用于青铜器之类就不合适，这都是理解有误所致。在武夷山时听说木头制成的悬棺是3\
    \ 000多年前的，便纳闷：由于树可能被砍伐很久后才用以制棺，两者不可同日而语。不过由于碳-14测定误差不小，或许该因素可被忽略。\n\n第1章提及的“常识”，是人工智能系统所需。众所周知，描述飞机时“蓝天上雄鹰展翅”是常见的句子，这需要常识才能理解，“雄鹰”并非指那种动物。“祖国母亲”也一样，而母亲比儿女年纪大也是常识。常识形成于人的生活和实践当中，经历着相对漫长的过程，与专业知识不可分割但并不相同，再加其往往“若隐若现”，所以在很多人工智能系统构建时“靠边站”了，这与具体问题的数学模型被设置不同边界条件，忽视具体要求相仿。\n\
    \n有次，笔者坐在一个朋友的车里，车子飞快行驶在高速公路上，问朋友车与车之间前后那样的车距是否不够，回答说是的，那点距离不符合要求，就靠驾驶员的判断和反应了。所以，驾驶员需要全神贯注。确实，多数情况下能防止意外，但不全有把握。既知如此，可是依然如故^([\\\
    [2\\]](#txt004.html#footnote_content_txt004_2))，经验关联着代价和可能的失误。笔者不会开车，常常有如此对话：\n\
    \n问：为何不开车？\n\n答：我是色盲，不能开车。\n\n问：看不清红绿灯？\n\n答：能区分。\n\n问：那为何不能开？\n\n答：区分红绿灯可借助于亮度、上下位置等，但反应较慢，然而体检不同于此，要求高。\n\
    \n这些提问者有驾驶证，因此经历过色觉检查——不是直接检查辨识红绿灯的能力，而是看色盲检查本，其上图案笔者不是分辨不清便是张冠李戴。为何诸如此类普通的知识即常识（对于会开车者而言）会被直接忽略？或许这对他们而言过于简单以至于被“跳过”而不在日常记忆当中。笔者有次在公交车上看到前面座位的靠背扶手上有一比一般蚊子还小的虫忽然轻盈飞走，其肢体很细长，非叶状，且未见扑动，这两者与常识颇不合。常识的掌握也许真是“看似寻常最奇崛”^([\\\
    [3\\]](#txt004.html#footnote_content_txt004_3))。\n\n某日笔者在上海公交车上听得一段老人对话：\n\n甲：上海要打（拨）区号的。\n\
    \n乙：上海么，021。\n\n甲：不是，0512。\n\n乙：哦，苏州的，打到苏州。\n\n他们当时在说拨固话号码。“上海要打（拨）区号的”中的“上海”口语中也可被理解为“往上海（拨）”，实际上话者意思是“（在）上海（拨往苏州）”。\n\
    \n平时在单位午餐笔者惯于去得较晚，那时人少，在高峰时段，透过窗户可见去食堂的路上人来人往。新冠疫情过后开工不久，所里一食堂正常供餐，但窗下那条路上不见人，笔者很纳闷，与开工后第一个过来的所外友人去用餐前说起此事：以前都到另一食堂（由于疫情那会没开），就去一食堂，但怎么见不到去的人？后某天去用午餐时路上忽想到，因疫情由办公楼去一食堂的门不开，那路上自然不见人。\n\
    \n有次友人说鲁迅诗句“愿乞画家新意匠，只研朱墨作春山”是对联，笔者意可以，但严格言“新”与“作”欠合，一直觉得鲁迅是希望画家“成为”新意匠，即略了那处动词，对方意此处“新”是动词，笔者表示“新”无疑可以是动词。不过七绝本身并不要求最后两句成对，古代七绝基本如此，不像七律的颔联、颈联。可能是巧合，也许鲁迅本意如此，但不成对不影响鲁迅作诗水准。有些从小就有的印象未必准确。俗话说“读书百遍，其义自见”，没有多读、多思，有时“其义被误”。能写出来的经验是一回事，阅读写出来的内容并理解是另一回事，抓住要领更为不同。\n\
    \n一次，几位友人在一起时说起不久前的一次震惊全国的火灾事故中不少幸存者由于烧伤面积大、深度重，实际上是无望的。顺便，笔者问及监控可回溯多长时间？回答是根据需要定，比如30天，有说（没有了也）可恢复的，那是指一定时间、一定范围、一定容量的信息，任何要恢复的信息都需要物理载体保存“蛛丝马迹”。不能超出记录媒体本身容量，比如水杯倒满后就溢出了。有时候“神奇”的技术将常识覆盖了。\n\
    \n常识属“常”，不过不意味着自然而然可具备。对常识的忽视，或者一再强调常识，意味着事情可能离本。新冠疫情暴发后，大家被要求在公共场合戴口罩，笔者第一次用的是“N95”型的，但不知有一柔性条状材料是用于贴合鼻梁的。后来有一次用一次性口罩，那种材料看起来单薄，笔者未注意那个功能，后发现上下戴倒了。\n\
    \n别人的常识，可能是另人的经验；别人的经验，可能是另人的常识。另人的经验，可能就归于常识；另人的常识，可能来自经验。比如现在的中医药大学的毕业生中，有一部分多年后会成为专家，甚至名医，但他们在大学期间学习把脉估计是靠自己摸索前行的，使之改观可能还是依靠师徒传授这样一种传统的模式或可视化设备。这里有如何传授、是否有效的差异。有效的反面是无效，是对已采取措施的否定，如果不加区分，就医学而言不仅无法达到治病求人的目的，还有可能误及百姓。\n\
    \n机器有常识，方能模拟人。“换句话说，常识将世界表象为一个熟稔的世界、一个任何人都可以而且都应该清楚认识的世界，在其中，每个人都可以或者应该可以凭借自己的智力来判断真理。”“但是总体来说，常识的观念一向是相当常识性的：任何一个有常识的人都知道”。［3］这话读起来有些拗口，其义在于：要具备常识本身也是常识，有常识者方能体会此认识。此语似乎又是悖论，回到逻辑范畴了。某位名作家书高等身、知识广博，但他在一篇介绍一位音乐名人的文章中，写道：“药物芯片正在申报诺贝尔医学奖。”诺奖包括生理学或医学奖，但无论哪种都无自身申报途径而是由他人提名的。这是科技界常识，不知何故或哪个环节的问题导致此误。\n\
    \n人工智能强调常识是因为缺乏常识或常识不够，而一个正常成长的人所具备的常识会逐步增多，这使其健康、协调、丰满，不过不意味着可忽视逻辑，人工智能首先是以逻辑为基础的，而逻辑是思维的基础。比如一个人，若思路清晰、思考严密，缺点常识照样生活和工作，甚至更专心而成大事；反之，即便“上知天文、下知地理”，但前言不搭后语或语无伦次，则不敢恭维。比如，现代医学在众多疾病面前依然无能为力，治不好的病颇多，这是基本认识或可谓常识，但若因此认为中医能克服西医面临的问题，或说中医已延续两千多年，这个就是其合理性的佐证，则是蔑视逻辑之举，因为不存在那样的因果关系，除非能证明之。因此，逻辑更基本，不讲逻辑会颠倒是非。\n\
    \n近些年人工智能热后，不少教育界人士随之提出中小学阶段应增加相关课程，教育部也有相应规划和要求。出版社与笔者联系并派人过来咨询、交流，后来他们分小学、初中、高中出了教材。笔者关心教育本身：此举是否必要，是否与原来的知识体系融洽并符合教育的基本规律。必要性看来无疑问。实际上，有理由但未必充分。尽管邓公当年登高一呼“计算机要从娃娃抓起”，计算机程序设计、信息技术课程便逐步走进中小学课堂，但从人的全面发展要求出发，其他有益于“全面”的日新月异的现代科学技术知识也需要及时传授，而中小学已经接触计算机的学生学得的知识或所受的训练在后来的专业（无论计算机技术及其相关专业或非计算机专业）学习与实践中有怎样的独特意义？“独特”指那些知识不可替代但又非重复。这就涉及了第二个问题。笔者提醒考虑好与大学人工智能课程或专业知识的衔接，内容应该有助于后续学习，否则，既多花了学生与老师的时间和精力，又反过来影响对中小学人工智能教育必要性的认可。如果此举是作为常识学习的安排，则具备了充分性。\n\
    \n3.2　领域经验\n\n鲁迅曾写道：“……在上海的弄堂里，租一间小房子住着的人，就时时可以体验到，他和周围的住户，是不一定见过面的，但只隔一层薄板壁，所以有些人家的眷属和客人的谈话，尤其是高声的谈话，都大略可以听到，久而久之，就知道那里有那些人，而且仿佛觉得那些人是怎样的人了。”［4］没有长时间潜移默化不会如此。\n\
    \n笔者年轻时选西瓜，由于知道有一种甜的瓜有点“沙”，就用大拇指按西瓜然后听声音，有“沙沙”声音便行，几次不差，于是就将其当作经验。后来姐姐提醒，那会对瓜有所损伤，卖者不乐意。而没有那种声音的瓜也有好的，只是需要其他经验判断，比如敲瓜听音是常用手段。笔者此后就不“用”那经验了，经验并非被动积累的代名词。\n\
    \n爱因斯坦说：“纯粹的逻辑思维不能给我们任何关于经验世界的知识；一切关于实在的知识，都是从经验开始，又终结于经验”。［5］但他又强调，“只有大胆的思辨而不是经验的堆积，才能使我们进步。不可理解的经验材料，我们已经掌握得太多了”。［6］康德说：“人必须读书，必须取得经验。一切知识都从感觉开始。”［7］丘成桐先生说，“我们在寻求真理时，往往只能凭已有的经验，因循研究的大方向，凭我们对大自然的感觉而向前迈进，这种感觉是相当主观的，因个人的文化修养而定”。［8］\n\
    \n人类知识源自经验以及在具备一定的认识和思考基础上的归纳、演绎，关乎认识的拓展、认知的积累两方面，前者是广度，后者是深度。有的自身体会会形成经验，那是最通常的知识当中的一类，很普通也很丰富，人们对它有时穆然有时兴奋。就多数人而言，经验主要来自经历或阅历，可理解为阅读与体验，阅读不仅指读书，还包括阅事、阅世，而体验不止于体会过程本身，由此磨炼的眼光、素养、感悟皆在其中，或可言为动态的经验。\n\
    \n经验因人而异、因时而深、因位而变，具潜移默化、水到渠成的特点，其积累是一个发散又综合的过程，首先是对本领域及其过程的熟悉和理解；接着是熟能生巧，如庖丁解牛，似神来之笔；然后游刃有余甚至超越自身领域，“人类的历史，就是一个不断地从必然王国向自由王国发展的历史。……因此，人类总得不断地总结经验，有所发现，有所发明，有所创造，有所前进”。［9］经验并非只是一成不变的模式，它是深刻认知的基础。\n\
    \n梁漱溟云：“从来空想空谈不成学问；真学问总是产生在那些为了解决实际问题而有的实践中，而又来指导其实践的。在东方古书中被看作是哲学的那些说话，正是古人们从其反躬向内的一种实践活动而来，要皆有其所指说的事实在，不是空话，不是捏造。你只对着古书望文生义去讲，并不能确知其所说究竟是些什么。”［10］一位书画家说书法是“遗憾的艺术”，估计其意为创作结果总有不满意处，与预想都有距离，因此遗憾频生。有遗憾，才会不断总结、反思，从而提升、进步。苏州博物馆新馆是贝聿铭的最后作品，在建造过程中建筑师多有修改、调整，比如他曾决定将原来的绿地改为水面，要敲掉40立方米的高标号混凝土，七八个工人弄了二十多天［11］。袁隆平说：“真正的权威永远来自实践。”［12］相比之下，书法“重新来过”的代价要小，只是有可能新作中又有别的不满之处。经验再厚，也难保无失。\n\
    \n周恩来在延安因骑马跌伤右臂，一位年轻医生认为是骨折，另一知名专家认为是软组织损伤，结果因听后者意见而致残疾。后去苏联诊疗，证明是骨折，若照此治疗需要较复杂的手术，周恩来未予施行［13］。因此，“熟”未必“生巧”，学习在一定程度上会“饱和”。\n\
    \n有次偶知有肺肿瘤病人先在国内手术，后又到美国手术。对此有人认为，中国人口多、基数大，因而那种手术是常规之举了，国内做不会比在发达国家差。那是一个容易被接受的直观结论，医生也不乏如此认识。其实经历多只能说明训练多进而熟练程度强，但与医术高明、精细，以及病处切得是否恰到好处、后续措施是否具有针对性等，并无必然关系。若不善于及时总结、主动反思，也许原地踏步或者不进则退。病人心态各异，估计有些专家的名声就那样被“放大”了。计算机技术工作者通常都有如此感受，越“老”越“外行”，与医生相反。\n\
    \n有的名人，八九十岁还在第一线，还站手术台，因病人相信他们。其实有对老医生盲目崇拜之嫌。在逐步丰富经验的同时，谁都难免会形成思维定式，而思维定式一经形成或具有其趋势，若没有偏离“正确方向”，则可能导致满足于现状、停滞不前，甚至生搬硬套、削足适履；若与正确方向偏离，后果可能不堪设想，这两种情况都远离有益经验的积累。\n\
    \n笔者母亲看过的一位原来在地段医院工作的老中医，大概90多岁，看上去远未到那个年龄，每天上午在家中看病人，病人有小区邻居，也有远道慕名而至的，有时候络绎不绝。老中医看病时常会翻阅几个本子，虽然这在医生中少见，然而情有可原，或许老人年纪大、记忆力弱了，或许要与以往处方作些对照。对于日常疾病，他已总结出不同医案，不过那可能是几十年前的结果，也就是说后面数十年并未长多少经验。而对于效果，并无别的医生对照。因此，我们可以称赞老中医为民服务老而不辍，而没法说他掌握比别人更有价值的经验。\n\
    \n有次乘船摆渡，笔者问艄公，要划好船不容易吧？他说是不容易。再问初步学会要多久？回答说那只要两个小时。从两个小时以后到看似轻松、摇动自如的岁月就是摸索、实践和积累经验过程。对“掌舵”者而言，在通常的水路要能不费力地把持好平衡，遇到险情时要善于选择、调整。在坐船者眼里看似简单的动作背后是日积月累的功夫。\n\
    \n经验未必合逻辑，但不忽视逻辑，而是与逻辑互补，比如没有一定时期的软硬件设计经历，对计算机技术难有透彻理解，没有关于计算的体会与实践，也没法理解人工智能的初衷、本质及其意义。强调经验并不是说感性经验是一切技能的唯一来源，经验既是一种借鉴，又是重要的积累，并非都是理性的，但违背经验则可能事与愿违。谈论经验，本身就是经验知识，也出于经验之谈，某种意义上是一种约束，没有这个过程，就没有相应的认识和智能。\n\
    \n人类克服未知主要通过书本学习、自身积累和反思总结。经验与所学知识相辅相成进而可致举一反三、触类旁通境界，那些可称为启发式知识，是区别于非专家的标志所在，据此可在必要时作出猜测，辨别有希望的解决途径并有效处理错误或不完全的数据，有些可能是“顿悟”这种独特的与形象思维有关的脑内过程。拙著所述经验，是科学实践性的，而非哲学思辨性的，尽管两者不是互相孤立的。\n\
    \n3.3　语言表述\n\n《老子·一章》云：“道可道，非常道；名可名，非常名。”《庄子·知北游》云：“道不可闻，闻而非也；道不可见，见而非也；道不可言，言而非也。知形形之不形乎！道不当名。”“道”需要体验，可以领会，然而能言说的，并非其永恒的内涵；知晓的东西未必能说出，说的人不一定真知道；表面上，言语易被理解，实际上未必。从古至今，解释《老子》（《道德经》）的书籍汗牛充栋、不计其数，它们都认为别人的解释不透彻、有失偏颇甚至误读了。这也在一个角度表明《道德经》本身难“道”。\n\
    \n《庄子·天道》中轮扁斫轮故事说，齐桓公在堂上读书，轮扁在堂下砍削木材制作车轮，他问齐桓公：您所读的是什么书呀？桓公说：是记载圣人之言书。轮扁又问：圣人还在吗？桓公说：已经死去了。轮扁说：那么您所读的书不过是圣人留下的糟粕罢了。桓公说：我读书，做轮子的匠人怎么能议论？说出道理才可以放过，没有道理可说就要处死。轮扁说：我是从我做的事情出发来看的。砍削木材制作轮子，榫头做得过于宽缓，就会松动而不牢固，做得太紧了，又会滞涩而难以进入。我做得不宽不紧，得心应手，嘴巴里说不出来，但自有度数分寸。我不能明白地告诉我的儿子，我儿子也不能从我这里得到经验，所以我已70岁了，还独自在做车轮。古代人和他们所不能言传的东西都一起死去了，所以您读的书不过就是古人留下的糟粕罢了！"
  fmt: '

    [\[5\]](#txt003.html#footnote_quote_txt003_5)2012年深秋，笔者陪父亲到外地拜访他最近一次见面已是20多年前的一家熟人，联系方式都变了。父亲已80多岁，为了了却父亲的心愿，笔者设法帮助寻找。通过与同在该地的父亲不认识的老同志家联系，得知老人多年前已故，尚无其他信息。我于是请熟人查询到了住址信息。与地段派出所联系，希望确认，未果。最后，通过114查询得知唯一能公开查到的一个相关机构，得知地址没错，并被告知如何过去，说是在该相关机构旁。打电话过去，接电话者回答说不知道要找的人家。那个相关机构接电话者提醒过，就找这个机构，按照住址走会绕路。出租车经过那里时司机说不好开了后，我们就下车。可笔者还是希望按照门牌号寻找，拐了两条路，问了不止三次路，其实车是可开的。到了一个大院门口，经几次一问一答，确定了地方，穿过去到了楼前，就在那个相关机构旁，由其门进入确实非常便当。这情况缘何出现？


    第一，与生活习惯有关，总觉得门牌号是最直接的线索；

    第二，与思维方式有关，别人提醒的话儿有时候被忽视了；

    第三，与经验有关，有时候按照某周边特征寻找不是最便捷的。


    如果在记忆中所提醒的机构名被强化了，情况可能就不同了。再就是搜索方式，如果灵活地以先见到的标志为依据，也不一样。可能它们分别对应着深度搜索和广度搜索。同时，附加信息不可轻视。


    [\[6\]](#txt003.html#footnote_quote_txt003_6)这是理论分析结果。抽象思维的许多具体工作，如数学、物理证明，当今并非都可由计算机完成。


    [\[7\]](#txt003.html#footnote_quote_txt003_7)有次参会后一位在职博士生送我们去车站，在谈及目前的考核体制时，感叹说，又要做家务，又要负责教学，还有杂事，另外搞科研，压力大、太不易了。笔者表示，即使这样，他们还是选择在高校工作、没有到他处。回答说，这倒也是。高校还是有吸引博士生们的地方。有意无意限于从自己视野出发说事，是普遍的思维定式。


    [\[8\]](#txt003.html#footnote_quote_txt003_8)有次笔者与图灵奖得主霍尔（T.Hoare）聊及形象思维相对于抽象（逻辑）思维模拟的困难，他反问，你认为逻辑问题都解决了？自然不是，逻辑始终是前提及基础，比如衣食住行一直是人类的基本生活要素，随着观念改变和经济发展，有人旅游探险甚至期望“飞天”，可有的地方吃饱穿暖还保障不了。即便某日世界“大同”了，那些需求依然。


    # 3 经验知识举足轻重


    ![](images/txt004_1.jpg "pagenumber_ebook=66,pagenumber_book=58")


    胜义超过一切寻思境界，寻思但行言说境界，然而胜义不可言说，胜义绝诸表示而寻思但行表示境界，胜义超过一切寻思。


    右录《解深密经》文句 梁漱溟［1］


    当科学的改革者主张转向自然并要求实验事实的时候，面向实际的手工业者、工程师和画家确实在获得扎实的经验事实。运用一般人天然的直观的处理方法，寻找的不是最终的真意而仅仅是他们在工作中遇到的现象的有效解释，这些技工们得到的知识嘲弄了那些博学的学究乃至人文主义者所提出的繁复辩解，在语汇学上的长篇推敲，纠缠不清的逻辑推理，以及对罗马和希腊权威的浮夸引证。［2］


    ——克莱因（M.Kline）


    逻辑经验从来念，推理学习深度融。


    “经验”与“经验主义”内涵并不相同，后者强调在实验研究基础上的理论推演而非单纯的事实依据或推理，古希腊医生的经验是“经验主义”一词的一个来源^([\[1\]](#txt004.html#footnote_content_txt004_1))。此处讨论的经验，既非缺乏理性思考、一味参照过去事情行事、决策者，也非科学研究中与理性主义相对者，而是人们在特定领域，经过长时间体验、训练和摸索后所具备的认识、分析、决策等敏锐的、动态的、综合的能力，是那些通过实践方能了解、掌握和运用的知识。


    ## 3.1 不薄常识


    用碳-14测定年代是科普常识，笔者曾以为据此啥都可判，实际上误差不小，后来知没法测无机物，因此应用于青铜器之类就不合适，这都是理解有误所致。在武夷山时听说木头制成的悬棺是3
    000多年前的，便纳闷：由于树可能被砍伐很久后才用以制棺，两者不可同日而语。不过由于碳-14测定误差不小，或许该因素可被忽略。


    第1章提及的“常识”，是人工智能系统所需。众所周知，描述飞机时“蓝天上雄鹰展翅”是常见的句子，这需要常识才能理解，“雄鹰”并非指那种动物。“祖国母亲”也一样，而母亲比儿女年纪大也是常识。常识形成于人的生活和实践当中，经历着相对漫长的过程，与专业知识不可分割但并不相同，再加其往往“若隐若现”，所以在很多人工智能系统构建时“靠边站”了，这与具体问题的数学模型被设置不同边界条件，忽视具体要求相仿。


    有次，笔者坐在一个朋友的车里，车子飞快行驶在高速公路上，问朋友车与车之间前后那样的车距是否不够，回答说是的，那点距离不符合要求，就靠驾驶员的判断和反应了。所以，驾驶员需要全神贯注。确实，多数情况下能防止意外，但不全有把握。既知如此，可是依然如故^([\[2\]](#txt004.html#footnote_content_txt004_2))，经验关联着代价和可能的失误。笔者不会开车，常常有如此对话：


    问：为何不开车？

    答：我是色盲，不能开车。

    问：看不清红绿灯？

    答：能区分。

    问：那为何不能开？

    答：区分红绿灯可借助于亮度、上下位置等，但反应较慢，然而体检不同于此，要求高。


    这些提问者有驾驶证，因此经历过色觉检查——不是直接检查辨识红绿灯的能力，而是看色盲检查本，其上图案笔者不是分辨不清便是张冠李戴。为何诸如此类普通的知识即常识（对于会开车者而言）会被直接忽略？或许这对他们而言过于简单以至于被“跳过”而不在日常记忆当中。笔者有次在公交车上看到前面座位的靠背扶手上有一比一般蚊子还小的虫忽然轻盈飞走，其肢体很细长，非叶状，且未见扑动，这两者与常识颇不合。常识的掌握也许真是“看似寻常最奇崛”^([\[3\]](#txt004.html#footnote_content_txt004_3))。


    某日笔者在上海公交车上听得一段老人对话：

    甲：上海要打（拨）区号的。

    乙：上海么，021。

    甲：不是，0512。

    乙：哦，苏州的，打到苏州。


    他们当时在说拨固话号码。“上海要打（拨）区号的”中的“上海”口语中也可被理解为“往上海（拨）”，实际上话者意思是“（在）上海（拨往苏州）”。


    平时在单位午餐笔者惯于去得较晚，那时人少，在高峰时段，透过窗户可见去食堂的路上人来人往。新冠疫情过后开工不久，所里一食堂正常供餐，但窗下那条路上不见人，笔者很纳闷，与开工后第一个过来的所外友人去用餐前说起此事：以前都到另一食堂（由于疫情那会没开），就去一食堂，但怎么见不到去的人？后某天去用午餐时路上忽想到，因疫情由办公楼去一食堂的门不开，那路上自然不见人。


    有次友人说鲁迅诗句“愿乞画家新意匠，只研朱墨作春山”是对联，笔者意可以，但严格言“新”与“作”欠合，一直觉得鲁迅是希望画家“成为”新意匠，即略了那处动词，对方意此处“新”是动词，笔者表示“新”无疑可以是动词。不过七绝本身并不要求最后两句成对，古代七绝基本如此，不像七律的颔联、颈联。可能是巧合，也许鲁迅本意如此，但不成对不影响鲁迅作诗水准。有些从小就有的印象未必准确。俗话说“读书百遍，其义自见”，没有多读、多思，有时“其义被误”。能写出来的经验是一回事，阅读写出来的内容并理解是另一回事，抓住要领更为不同。


    一次，几位友人在一起时说起不久前的一次震惊全国的火灾事故中不少幸存者由于烧伤面积大、深度重，实际上是无望的。顺便，笔者问及监控可回溯多长时间？回答是根据需要定，比如30天，有说（没有了也）可恢复的，那是指一定时间、一定范围、一定容量的信息，任何要恢复的信息都需要物理载体保存“蛛丝马迹”。不能超出记录媒体本身容量，比如水杯倒满后就溢出了。有时候“神奇”的技术将常识覆盖了。


    常识属“常”，不过不意味着自然而然可具备。对常识的忽视，或者一再强调常识，意味着事情可能离本。新冠疫情暴发后，大家被要求在公共场合戴口罩，笔者第一次用的是“N95”型的，但不知有一柔性条状材料是用于贴合鼻梁的。后来有一次用一次性口罩，那种材料看起来单薄，笔者未注意那个功能，后发现上下戴倒了。


    别人的常识，可能是另人的经验；别人的经验，可能是另人的常识。另人的经验，可能就归于常识；另人的常识，可能来自经验。比如现在的中医药大学的毕业生中，有一部分多年后会成为专家，甚至名医，但他们在大学期间学习把脉估计是靠自己摸索前行的，使之改观可能还是依靠师徒传授这样一种传统的模式或可视化设备。这里有如何传授、是否有效的差异。有效的反面是无效，是对已采取措施的否定，如果不加区分，就医学而言不仅无法达到治病求人的目的，还有可能误及百姓。


    机器有常识，方能模拟人。“换句话说，常识将世界表象为一个熟稔的世界、一个任何人都可以而且都应该清楚认识的世界，在其中，每个人都可以或者应该可以凭借自己的智力来判断真理。”“但是总体来说，常识的观念一向是相当常识性的：任何一个有常识的人都知道”。［3］这话读起来有些拗口，其义在于：要具备常识本身也是常识，有常识者方能体会此认识。此语似乎又是悖论，回到逻辑范畴了。某位名作家书高等身、知识广博，但他在一篇介绍一位音乐名人的文章中，写道：“药物芯片正在申报诺贝尔医学奖。”诺奖包括生理学或医学奖，但无论哪种都无自身申报途径而是由他人提名的。这是科技界常识，不知何故或哪个环节的问题导致此误。


    人工智能强调常识是因为缺乏常识或常识不够，而一个正常成长的人所具备的常识会逐步增多，这使其健康、协调、丰满，不过不意味着可忽视逻辑，人工智能首先是以逻辑为基础的，而逻辑是思维的基础。比如一个人，若思路清晰、思考严密，缺点常识照样生活和工作，甚至更专心而成大事；反之，即便“上知天文、下知地理”，但前言不搭后语或语无伦次，则不敢恭维。比如，现代医学在众多疾病面前依然无能为力，治不好的病颇多，这是基本认识或可谓常识，但若因此认为中医能克服西医面临的问题，或说中医已延续两千多年，这个就是其合理性的佐证，则是蔑视逻辑之举，因为不存在那样的因果关系，除非能证明之。因此，逻辑更基本，不讲逻辑会颠倒是非。


    近些年人工智能热后，不少教育界人士随之提出中小学阶段应增加相关课程，教育部也有相应规划和要求。出版社与笔者联系并派人过来咨询、交流，后来他们分小学、初中、高中出了教材。笔者关心教育本身：此举是否必要，是否与原来的知识体系融洽并符合教育的基本规律。必要性看来无疑问。实际上，有理由但未必充分。尽管邓公当年登高一呼“计算机要从娃娃抓起”，计算机程序设计、信息技术课程便逐步走进中小学课堂，但从人的全面发展要求出发，其他有益于“全面”的日新月异的现代科学技术知识也需要及时传授，而中小学已经接触计算机的学生学得的知识或所受的训练在后来的专业（无论计算机技术及其相关专业或非计算机专业）学习与实践中有怎样的独特意义？“独特”指那些知识不可替代但又非重复。这就涉及了第二个问题。笔者提醒考虑好与大学人工智能课程或专业知识的衔接，内容应该有助于后续学习，否则，既多花了学生与老师的时间和精力，又反过来影响对中小学人工智能教育必要性的认可。如果此举是作为常识学习的安排，则具备了充分性。


    ## 3.2 领域经验


    鲁迅曾写道：“……在上海的弄堂里，租一间小房子住着的人，就时时可以体验到，他和周围的住户，是不一定见过面的，但只隔一层薄板壁，所以有些人家的眷属和客人的谈话，尤其是高声的谈话，都大略可以听到，久而久之，就知道那里有那些人，而且仿佛觉得那些人是怎样的人了。”［4］没有长时间潜移默化不会如此。


    笔者年轻时选西瓜，由于知道有一种甜的瓜有点“沙”，就用大拇指按西瓜然后听声音，有“沙沙”声音便行，几次不差，于是就将其当作经验。后来姐姐提醒，那会对瓜有所损伤，卖者不乐意。而没有那种声音的瓜也有好的，只是需要其他经验判断，比如敲瓜听音是常用手段。笔者此后就不“用”那经验了，经验并非被动积累的代名词。


    爱因斯坦说：“纯粹的逻辑思维不能给我们任何关于经验世界的知识；一切关于实在的知识，都是从经验开始，又终结于经验”。［5］但他又强调，“只有大胆的思辨而不是经验的堆积，才能使我们进步。不可理解的经验材料，我们已经掌握得太多了”。［6］康德说：“人必须读书，必须取得经验。一切知识都从感觉开始。”［7］丘成桐先生说，“我们在寻求真理时，往往只能凭已有的经验，因循研究的大方向，凭我们对大自然的感觉而向前迈进，这种感觉是相当主观的，因个人的文化修养而定”。［8］


    人类知识源自经验以及在具备一定的认识和思考基础上的归纳、演绎，关乎认识的拓展、认知的积累两方面，前者是广度，后者是深度。有的自身体会会形成经验，那是最通常的知识当中的一类，很普通也很丰富，人们对它有时穆然有时兴奋。就多数人而言，经验主要来自经历或阅历，可理解为阅读与体验，阅读不仅指读书，还包括阅事、阅世，而体验不止于体会过程本身，由此磨炼的眼光、素养、感悟皆在其中，或可言为动态的经验。


    经验因人而异、因时而深、因位而变，具潜移默化、水到渠成的特点，其积累是一个发散又综合的过程，首先是对本领域及其过程的熟悉和理解；接着是熟能生巧，如庖丁解牛，似神来之笔；然后游刃有余甚至超越自身领域，“人类的历史，就是一个不断地从必然王国向自由王国发展的历史。……因此，人类总得不断地总结经验，有所发现，有所发明，有所创造，有所前进”。［9］经验并非只是一成不变的模式，它是深刻认知的基础。


    梁漱溟云：“从来空想空谈不成学问；真学问总是产生在那些为了解决实际问题而有的实践中，而又来指导其实践的。在东方古书中被看作是哲学的那些说话，正是古人们从其反躬向内的一种实践活动而来，要皆有其所指说的事实在，不是空话，不是捏造。你只对着古书望文生义去讲，并不能确知其所说究竟是些什么。”［10］一位书画家说书法是“遗憾的艺术”，估计其意为创作结果总有不满意处，与预想都有距离，因此遗憾频生。有遗憾，才会不断总结、反思，从而提升、进步。苏州博物馆新馆是贝聿铭的最后作品，在建造过程中建筑师多有修改、调整，比如他曾决定将原来的绿地改为水面，要敲掉40立方米的高标号混凝土，七八个工人弄了二十多天［11］。袁隆平说：“真正的权威永远来自实践。”［12］相比之下，书法“重新来过”的代价要小，只是有可能新作中又有别的不满之处。经验再厚，也难保无失。


    周恩来在延安因骑马跌伤右臂，一位年轻医生认为是骨折，另一知名专家认为是软组织损伤，结果因听后者意见而致残疾。后去苏联诊疗，证明是骨折，若照此治疗需要较复杂的手术，周恩来未予施行［13］。因此，“熟”未必“生巧”，学习在一定程度上会“饱和”。


    有次偶知有肺肿瘤病人先在国内手术，后又到美国手术。对此有人认为，中国人口多、基数大，因而那种手术是常规之举了，国内做不会比在发达国家差。那是一个容易被接受的直观结论，医生也不乏如此认识。其实经历多只能说明训练多进而熟练程度强，但与医术高明、精细，以及病处切得是否恰到好处、后续措施是否具有针对性等，并无必然关系。若不善于及时总结、主动反思，也许原地踏步或者不进则退。病人心态各异，估计有些专家的名声就那样被“放大”了。计算机技术工作者通常都有如此感受，越“老”越“外行”，与医生相反。


    有的名人，八九十岁还在第一线，还站手术台，因病人相信他们。其实有对老医生盲目崇拜之嫌。在逐步丰富经验的同时，谁都难免会形成思维定式，而思维定式一经形成或具有其趋势，若没有偏离“正确方向”，则可能导致满足于现状、停滞不前，甚至生搬硬套、削足适履；若与正确方向偏离，后果可能不堪设想，这两种情况都远离有益经验的积累。


    笔者母亲看过的一位原来在地段医院工作的老中医，大概90多岁，看上去远未到那个年龄，每天上午在家中看病人，病人有小区邻居，也有远道慕名而至的，有时候络绎不绝。老中医看病时常会翻阅几个本子，虽然这在医生中少见，然而情有可原，或许老人年纪大、记忆力弱了，或许要与以往处方作些对照。对于日常疾病，他已总结出不同医案，不过那可能是几十年前的结果，也就是说后面数十年并未长多少经验。而对于效果，并无别的医生对照。因此，我们可以称赞老中医为民服务老而不辍，而没法说他掌握比别人更有价值的经验。


    有次乘船摆渡，笔者问艄公，要划好船不容易吧？他说是不容易。再问初步学会要多久？回答说那只要两个小时。从两个小时以后到看似轻松、摇动自如的岁月就是摸索、实践和积累经验过程。对“掌舵”者而言，在通常的水路要能不费力地把持好平衡，遇到险情时要善于选择、调整。在坐船者眼里看似简单的动作背后是日积月累的功夫。


    经验未必合逻辑，但不忽视逻辑，而是与逻辑互补，比如没有一定时期的软硬件设计经历，对计算机技术难有透彻理解，没有关于计算的体会与实践，也没法理解人工智能的初衷、本质及其意义。强调经验并不是说感性经验是一切技能的唯一来源，经验既是一种借鉴，又是重要的积累，并非都是理性的，但违背经验则可能事与愿违。谈论经验，本身就是经验知识，也出于经验之谈，某种意义上是一种约束，没有这个过程，就没有相应的认识和智能。


    人类克服未知主要通过书本学习、自身积累和反思总结。经验与所学知识相辅相成进而可致举一反三、触类旁通境界，那些可称为启发式知识，是区别于非专家的标志所在，据此可在必要时作出猜测，辨别有希望的解决途径并有效处理错误或不完全的数据，有些可能是“顿悟”这种独特的与形象思维有关的脑内过程。拙著所述经验，是科学实践性的，而非哲学思辨性的，尽管两者不是互相孤立的。


    ## 3.3 语言表述


    《老子·一章》云：“道可道，非常道；名可名，非常名。”《庄子·知北游》云：“道不可闻，闻而非也；道不可见，见而非也；道不可言，言而非也。知形形之不形乎！道不当名。”“道”需要体验，可以领会，然而能言说的，并非其永恒的内涵；知晓的东西未必能说出，说的人不一定真知道；表面上，言语易被理解，实际上未必。从古至今，解释《老子》（《道德经》）的书籍汗牛充栋、不计其数，它们都认为别人的解释不透彻、有失偏颇甚至误读了。这也在一个角度表明《道德经》本身难“道”。


    《庄子·天道》中轮扁斫轮故事说，齐桓公在堂上读书，轮扁在堂下砍削木材制作车轮，他问齐桓公：您所读的是什么书呀？桓公说：是记载圣人之言书。轮扁又问：圣人还在吗？桓公说：已经死去了。轮扁说：那么您所读的书不过是圣人留下的糟粕罢了。桓公说：我读书，做轮子的匠人怎么能议论？说出道理才可以放过，没有道理可说就要处死。轮扁说：我是从我做的事情出发来看的。砍削木材制作轮子，榫头做得过于宽缓，就会松动而不牢固，做得太紧了，又会滞涩而难以进入。我做得不宽不紧，得心应手，嘴巴里说不出来，但自有度数分寸。我不能明白地告诉我的儿子，我儿子也不能从我这里得到经验，所以我已70岁了，还独自在做车轮。古代人和他们所不能言传的东西都一起死去了，所以您读的书不过就是古人留下的糟粕罢了！

    '
  trans: '


    [\[5\]](#txt003.html#footnote_quote_txt003_5)2012 年深秋，笔者陪父亲到外地拜访他最近一次见面已是 20 多年前的一家熟人，联系方式都变了。父亲已
    80 多岁，为了了却父亲的心愿，笔者设法帮助寻找。通过与同在该地的父亲不认识的老同志家联系，得知老人多年前已故，尚无其他信息。我于是请熟人查询到了住址信息。与地段派出所联系，希望确认，未果。最后，通过
    114 查询得知唯一能公开查到的一个相关机构，得知地址没错，并被告知如何过去，说是在该相关机构旁。打电话过去，接电话者回答说不知道要找的人家。那个相关机构接电话者提醒过，就找这个机构，按照住址走会绕路。出租车经过那里时司机说不好开了后，我们就下车。可笔者还是希望按照门牌号寻找，拐了两条路，问了不止三次路，其实车是可开的。到了一个大院门口，经几次一问一答，确定了地方，穿过去到了楼前，就在那个相关机构旁，由其门进入确实非常便当。这情况缘何出现？


    第一，与生活习惯有关，总觉得门牌号是最直接的线索；

    第二，与思维方式有关，别人提醒的话儿有时候被忽视了；

    第三，与经验有关，有时候按照某周边特征寻找不是最便捷的。


    如果在记忆中所提醒的机构名被强化了，情况可能就不同了。再就是搜索方式，如果灵活地以先见到的标志为依据，也不一样。可能它们分别对应着深度搜索和广度搜索。同时，附加信息不可轻视。


    [\[6\]](#txt003.html#footnote_quote_txt003_6)这是理论分析结果。抽象思维的许多具体工作，如数学、物理证明，当今并非都可由计算机完成。


    [\[7\]](#txt003.html#footnote_quote_txt003_7)有次参会后一位在职博士生送我们去车站，在谈及目前的考核体制时，感叹说，又要做家务，又要负责教学，还有杂事，另外搞科研，压力大、太不易了。笔者表示，即使这样，他们还是选择在高校工作、没有到他处。回答说，这倒也是。高校还是有吸引博士生们的地方。有意无意限于从自己视野出发说事，是普遍的思维定式。


    [\[8\]](#txt003.html#footnote_quote_txt003_8)有次笔者与图灵奖得主霍尔（T.Hoare）聊及形象思维相对于抽象（逻辑）思维模拟的困难，他反问，你认为逻辑问题都解决了？自然不是，逻辑始终是前提及基础，比如衣食住行一直是人类的基本生活要素，随着观念改变和经济发展，有人旅游探险甚至期望“飞天”，可有的地方吃饱穿暖还保障不了。即便某日世界“大同”了，那些需求依然。


    # 3 经验知识举足轻重


    ![](img/txt004_1.jpg "pagenumber_ebook=66,pagenumber_book=58")


    胜义超过一切寻思境界，寻思但行言说境界，然而胜义不可言说，胜义绝诸表示而寻思但行表示境界，胜义超过一切寻思。


    右录《解深密经》文句 梁漱溟［1］


    当科学的改革者主张转向自然并要求实验事实的时候，面向实际的手工业者、工程师和画家确实在获得扎实的经验事实。运用一般人天然的直观的处理方法，寻找的不是最终的真意而仅仅是他们在工作中遇到的现象的有效解释，这些技工们得到的知识嘲弄了那些博学的学究乃至人文主义者所提出的繁复辩解，在语汇学上的长篇推敲，纠缠不清的逻辑推理，以及对罗马和希腊权威的浮夸引证。［2］


    ——克莱因（M.Kline）


    逻辑经验从来念，推理学习深度融。


    “经验”与“经验主义”内涵并不相同，后者强调在实验研究基础上的理论推演而非单纯的事实依据或推理，古希腊医生的经验是“经验主义”一词的一个来源^([\[1\]](#txt004.html#footnote_content_txt004_1))。此处讨论的经验，既非缺乏理性思考、一味参照过去事情行事、决策者，也非科学研究中与理性主义相对者，而是人们在特定领域，经过长时间体验、训练和摸索后所具备的认识、分析、决策等敏锐的、动态的、综合的能力，是那些通过实践方能了解、掌握和运用的知识。


    ## 3.1 不薄常识


    用碳-14 测定年代是科普常识，笔者曾以为据此啥都可判，实际上误差不小，后来知没法测无机物，因此应用于青铜器之类就不合适，这都是理解有误所致。在武夷山时听说木头制成的悬棺是
    3 000 多年前的，便纳闷：由于树可能被砍伐很久后才用以制棺，两者不可同日而语。不过由于碳-14 测定误差不小，或许该因素可被忽略。


    第 1 章提及的“常识”，是人工智能系统所需。众所周知，描述飞机时“蓝天上雄鹰展翅”是常见的句子，这需要常识才能理解，“雄鹰”并非指那种动物。“祖国母亲”也一样，而母亲比儿女年纪大也是常识。常识形成于人的生活和实践当中，经历着相对漫长的过程，与专业知识不可分割但并不相同，再加其往往“若隐若现”，所以在很多人工智能系统构建时“靠边站”了，这与具体问题的数学模型被设置不同边界条件，忽视具体要求相仿。


    有次，笔者坐在一个朋友的车里，车子飞快行驶在高速公路上，问朋友车与车之间前后那样的车距是否不够，回答说是的，那点距离不符合要求，就靠驾驶员的判断和反应了。所以，驾驶员需要全神贯注。确实，多数情况下能防止意外，但不全有把握。既知如此，可是依然如故^([\[2\]](#txt004.html#footnote_content_txt004_2))，经验关联着代价和可能的失误。笔者不会开车，常常有如此对话：


    问：为何不开车？

    答：我是色盲，不能开车。

    问：看不清红绿灯？

    答：能区分。

    问：那为何不能开？

    答：区分红绿灯可借助于亮度、上下位置等，但反应较慢，然而体检不同于此，要求高。


    这些提问者有驾驶证，因此经历过色觉检查——不是直接检查辨识红绿灯的能力，而是看色盲检查本，其上图案笔者不是分辨不清便是张冠李戴。为何诸如此类普通的知识即常识（对于会开车者而言）会被直接忽略？或许这对他们而言过于简单以至于被“跳过”而不在日常记忆当中。笔者有次在公交车上看到前面座位的靠背扶手上有一比一般蚊子还小的虫忽然轻盈飞走，其肢体很细长，非叶状，且未见扑动，这两者与常识颇不合。常识的掌握也许真是“看似寻常最奇崛”^([\[3\]](#txt004.html#footnote_content_txt004_3))。


    某日笔者在上海公交车上听得一段老人对话：

    甲：上海要打（拨）区号的。

    乙：上海么，021。

    甲：不是，0512。

    乙：哦，苏州的，打到苏州。


    他们当时在说拨固话号码。“上海要打（拨）区号的”中的“上海”口语中也可被理解为“往上海（拨）”，实际上话者意思是“（在）上海（拨往苏州）”。


    平时在单位午餐笔者惯于去得较晚，那时人少，在高峰时段，透过窗户可见去食堂的路上人来人往。新冠疫情过后开工不久，所里一食堂正常供餐，但窗下那条路上不见人，笔者很纳闷，与开工后第一个过来的所外友人去用餐前说起此事：以前都到另一食堂（由于疫情那会没开），就去一食堂，但怎么见不到去的人？后某天去用午餐时路上忽想到，因疫情由办公楼去一食堂的门不开，那路上自然不见人。


    有次友人说鲁迅诗句“愿乞画家新意匠，只研朱墨作春山”是对联，笔者意可以，但严格言“新”与“作”欠合，一直觉得鲁迅是希望画家“成为”新意匠，即略了那处动词，对方意此处“新”是动词，笔者表示“新”无疑可以是动词。不过七绝本身并不要求最后两句成对，古代七绝基本如此，不像七律的颔联、颈联。可能是巧合，也许鲁迅本意如此，但不成对不影响鲁迅作诗水准。有些从小就有的印象未必准确。俗话说“读书百遍，其义自见”，没有多读、多思，有时“其义被误”。能写出来的经验是一回事，阅读写出来的内容并理解是另一回事，抓住要领更为不同。


    一次，几位友人在一起时说起不久前的一次震惊全国的火灾事故中不少幸存者由于烧伤面积大、深度重，实际上是无望的。顺便，笔者问及监控可回溯多长时间？回答是根据需要定，比如
    30 天，有说（没有了也）可恢复的，那是指一定时间、一定范围、一定容量的信息，任何要恢复的信息都需要物理载体保存“蛛丝马迹”。不能超出记录媒体本身容量，比如水杯倒满后就溢出了。有时候“神奇”的技术将常识覆盖了。


    常识属“常”，不过不意味着自然而然可具备。对常识的忽视，或者一再强调常识，意味着事情可能离本。新冠疫情暴发后，大家被要求在公共场合戴口罩，笔者第一次用的是“N95”型的，但不知有一柔性条状材料是用于贴合鼻梁的。后来有一次用一次性口罩，那种材料看起来单薄，笔者未注意那个功能，后发现上下戴倒了。


    别人的常识，可能是另人的经验；别人的经验，可能是另人的常识。另人的经验，可能就归于常识；另人的常识，可能来自经验。比如现在的中医药大学的毕业生中，有一部分多年后会成为专家，甚至名医，但他们在大学期间学习把脉估计是靠自己摸索前行的，使之改观可能还是依靠师徒传授这样一种传统的模式或可视化设备。这里有如何传授、是否有效的差异。有效的反面是无效，是对已采取措施的否定，如果不加区分，就医学而言不仅无法达到治病求人的目的，还有可能误及百姓。


    机器有常识，方能模拟人。“换句话说，常识将世界表象为一个熟稔的世界、一个任何人都可以而且都应该清楚认识的世界，在其中，每个人都可以或者应该可以凭借自己的智力来判断真理。”“但是总体来说，常识的观念一向是相当常识性的：任何一个有常识的人都知道”。［3］这话读起来有些拗口，其义在于：要具备常识本身也是常识，有常识者方能体会此认识。此语似乎又是悖论，回到逻辑范畴了。某位名作家书高等身、知识广博，但他在一篇介绍一位音乐名人的文章中，写道：“药物芯片正在申报诺贝尔医学奖。”诺奖包括生理学或医学奖，但无论哪种都无自身申报途径而是由他人提名的。这是科技界常识，不知何故或哪个环节的问题导致此误。


    人工智能强调常识是因为缺乏常识或常识不够，而一个正常成长的人所具备的常识会逐步增多，这使其健康、协调、丰满，不过不意味着可忽视逻辑，人工智能首先是以逻辑为基础的，而逻辑是思维的基础。比如一个人，若思路清晰、思考严密，缺点常识照样生活和工作，甚至更专心而成大事；反之，即便“上知天文、下知地理”，但前言不搭后语或语无伦次，则不敢恭维。比如，现代医学在众多疾病面前依然无能为力，治不好的病颇多，这是基本认识或可谓常识，但若因此认为中医能克服西医面临的问题，或说中医已延续两千多年，这个就是其合理性的佐证，则是蔑视逻辑之举，因为不存在那样的因果关系，除非能证明之。因此，逻辑更基本，不讲逻辑会颠倒是非。


    近些年人工智能热后，不少教育界人士随之提出中小学阶段应增加相关课程，教育部也有相应规划和要求。出版社与笔者联系并派人过来咨询、交流，后来他们分小学、初中、高中出了教材。笔者关心教育本身：此举是否必要，是否与原来的知识体系融洽并符合教育的基本规律。必要性看来无疑问。实际上，有理由但未必充分。尽管邓公当年登高一呼“计算机要从娃娃抓起”，计算机程序设计、信息技术课程便逐步走进中小学课堂，但从人的全面发展要求出发，其他有益于“全面”的日新月异的现代科学技术知识也需要及时传授，而中小学已经接触计算机的学生学得的知识或所受的训练在后来的专业（无论计算机技术及其相关专业或非计算机专业）学习与实践中有怎样的独特意义？“独特”指那些知识不可替代但又非重复。这就涉及了第二个问题。笔者提醒考虑好与大学人工智能课程或专业知识的衔接，内容应该有助于后续学习，否则，既多花了学生与老师的时间和精力，又反过来影响对中小学人工智能教育必要性的认可。如果此举是作为常识学习的安排，则具备了充分性。


    ## 3.2 领域经验


    鲁迅曾写道：“……在上海的弄堂里，租一间小房子住着的人，就时时可以体验到，他和周围的住户，是不一定见过面的，但只隔一层薄板壁，所以有些人家的眷属和客人的谈话，尤其是高声的谈话，都大略可以听到，久而久之，就知道那里有那些人，而且仿佛觉得那些人是怎样的人了。”［4］没有长时间潜移默化不会如此。


    笔者年轻时选西瓜，由于知道有一种甜的瓜有点“沙”，就用大拇指按西瓜然后听声音，有“沙沙”声音便行，几次不差，于是就将其当作经验。后来姐姐提醒，那会对瓜有所损伤，卖者不乐意。而没有那种声音的瓜也有好的，只是需要其他经验判断，比如敲瓜听音是常用手段。笔者此后就不“用”那经验了，经验并非被动积累的代名词。


    爱因斯坦说：“纯粹的逻辑思维不能给我们任何关于经验世界的知识；一切关于实在的知识，都是从经验开始，又终结于经验”。［5］但他又强调，“只有大胆的思辨而不是经验的堆积，才能使我们进步。不可理解的经验材料，我们已经掌握得太多了”。［6］康德说：“人必须读书，必须取得经验。一切知识都从感觉开始。”［7］丘成桐先生说，“我们在寻求真理时，往往只能凭已有的经验，因循研究的大方向，凭我们对大自然的感觉而向前迈进，这种感觉是相当主观的，因个人的文化修养而定”。［8］


    人类知识源自经验以及在具备一定的认识和思考基础上的归纳、演绎，关乎认识的拓展、认知的积累两方面，前者是广度，后者是深度。有的自身体会会形成经验，那是最通常的知识当中的一类，很普通也很丰富，人们对它有时穆然有时兴奋。就多数人而言，经验主要来自经历或阅历，可理解为阅读与体验，阅读不仅指读书，还包括阅事、阅世，而体验不止于体会过程本身，由此磨炼的眼光、素养、感悟皆在其中，或可言为动态的经验。


    经验因人而异、因时而深、因位而变，具潜移默化、水到渠成的特点，其积累是一个发散又综合的过程，首先是对本领域及其过程的熟悉和理解；接着是熟能生巧，如庖丁解牛，似神来之笔；然后游刃有余甚至超越自身领域，“人类的历史，就是一个不断地从必然王国向自由王国发展的历史。……因此，人类总得不断地总结经验，有所发现，有所发明，有所创造，有所前进”。［9］经验并非只是一成不变的模式，它是深刻认知的基础。


    梁漱溟云：“从来空想空谈不成学问；真学问总是产生在那些为了解决实际问题而有的实践中，而又来指导其实践的。在东方古书中被看作是哲学的那些说话，正是古人们从其反躬向内的一种实践活动而来，要皆有其所指说的事实在，不是空话，不是捏造。你只对着古书望文生义去讲，并不能确知其所说究竟是些什么。”［10］一位书画家说书法是“遗憾的艺术”，估计其意为创作结果总有不满意处，与预想都有距离，因此遗憾频生。有遗憾，才会不断总结、反思，从而提升、进步。苏州博物馆新馆是贝聿铭的最后作品，在建造过程中建筑师多有修改、调整，比如他曾决定将原来的绿地改为水面，要敲掉
    40 立方米的高标号混凝土，七八个工人弄了二十多天［11］。袁隆平说：“真正的权威永远来自实践。”［12］相比之下，书法“重新来过”的代价要小，只是有可能新作中又有别的不满之处。经验再厚，也难保无失。


    周恩来在延安因骑马跌伤右臂，一位年轻医生认为是骨折，另一知名专家认为是软组织损伤，结果因听后者意见而致残疾。后去苏联诊疗，证明是骨折，若照此治疗需要较复杂的手术，周恩来未予施行［13］。因此，“熟”未必“生巧”，学习在一定程度上会“饱和”。


    有次偶知有肺肿瘤病人先在国内手术，后又到美国手术。对此有人认为，中国人口多、基数大，因而那种手术是常规之举了，国内做不会比在发达国家差。那是一个容易被接受的直观结论，医生也不乏如此认识。其实经历多只能说明训练多进而熟练程度强，但与医术高明、精细，以及病处切得是否恰到好处、后续措施是否具有针对性等，并无必然关系。若不善于及时总结、主动反思，也许原地踏步或者不进则退。病人心态各异，估计有些专家的名声就那样被“放大”了。计算机技术工作者通常都有如此感受，越“老”越“外行”，与医生相反。


    有的名人，八九十岁还在第一线，还站手术台，因病人相信他们。其实有对老医生盲目崇拜之嫌。在逐步丰富经验的同时，谁都难免会形成思维定式，而思维定式一经形成或具有其趋势，若没有偏离“正确方向”，则可能导致满足于现状、停滞不前，甚至生搬硬套、削足适履；若与正确方向偏离，后果可能不堪设想，这两种情况都远离有益经验的积累。


    笔者母亲看过的一位原来在地段医院工作的老中医，大概 90 多岁，看上去远未到那个年龄，每天上午在家中看病人，病人有小区邻居，也有远道慕名而至的，有时候络绎不绝。老中医看病时常会翻阅几个本子，虽然这在医生中少见，然而情有可原，或许老人年纪大、记忆力弱了，或许要与以往处方作些对照。对于日常疾病，他已总结出不同医案，不过那可能是几十年前的结果，也就是说后面数十年并未长多少经验。而对于效果，并无别的医生对照。因此，我们可以称赞老中医为民服务老而不辍，而没法说他掌握比别人更有价值的经验。


    有次乘船摆渡，笔者问艄公，要划好船不容易吧？他说是不容易。再问初步学会要多久？回答说那只要两个小时。从两个小时以后到看似轻松、摇动自如的岁月就是摸索、实践和积累经验过程。对“掌舵”者而言，在通常的水路要能不费力地把持好平衡，遇到险情时要善于选择、调整。在坐船者眼里看似简单的动作背后是日积月累的功夫。


    经验未必合逻辑，但不忽视逻辑，而是与逻辑互补，比如没有一定时期的软硬件设计经历，对计算机技术难有透彻理解，没有关于计算的体会与实践，也没法理解人工智能的初衷、本质及其意义。强调经验并不是说感性经验是一切技能的唯一来源，经验既是一种借鉴，又是重要的积累，并非都是理性的，但违背经验则可能事与愿违。谈论经验，本身就是经验知识，也出于经验之谈，某种意义上是一种约束，没有这个过程，就没有相应的认识和智能。


    人类克服未知主要通过书本学习、自身积累和反思总结。经验与所学知识相辅相成进而可致举一反三、触类旁通境界，那些可称为启发式知识，是区别于非专家的标志所在，据此可在必要时作出猜测，辨别有希望的解决途径并有效处理错误或不完全的数据，有些可能是“顿悟”这种独特的与形象思维有关的脑内过程。拙著所述经验，是科学实践性的，而非哲学思辨性的，尽管两者不是互相孤立的。


    ## 3.3 语言表述


    《老子·一章》云：“道可道，非常道；名可名，非常名。”《庄子·知北游》云：“道不可闻，闻而非也；道不可见，见而非也；道不可言，言而非也。知形形之不形乎！道不当名。”“道”需要体验，可以领会，然而能言说的，并非其永恒的内涵；知晓的东西未必能说出，说的人不一定真知道；表面上，言语易被理解，实际上未必。从古至今，解释《老子》（《道德经》）的书籍汗牛充栋、不计其数，它们都认为别人的解释不透彻、有失偏颇甚至误读了。这也在一个角度表明《道德经》本身难“道”。


    《庄子·天道》中轮扁斫轮故事说，齐桓公在堂上读书，轮扁在堂下砍削木材制作车轮，他问齐桓公：您所读的是什么书呀？桓公说：是记载圣人之言书。轮扁又问：圣人还在吗？桓公说：已经死去了。轮扁说：那么您所读的书不过是圣人留下的糟粕罢了。桓公说：我读书，做轮子的匠人怎么能议论？说出道理才可以放过，没有道理可说就要处死。轮扁说：我是从我做的事情出发来看的。砍削木材制作轮子，榫头做得过于宽缓，就会松动而不牢固，做得太紧了，又会滞涩而难以进入。我做得不宽不紧，得心应手，嘴巴里说不出来，但自有度数分寸。我不能明白地告诉我的儿子，我儿子也不能从我这里得到经验，所以我已
    70 岁了，还独自在做车轮。古代人和他们所不能言传的东西都一起死去了，所以您读的书不过就是古人留下的糟粕罢了！


    '
