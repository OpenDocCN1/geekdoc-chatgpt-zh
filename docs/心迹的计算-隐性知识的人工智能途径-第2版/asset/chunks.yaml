  trans: '


    创新地解决具体问题、创新地看待整体问题，一定不是抛开原来基础或割裂相互间关系的“与众不同”或“孤芳自赏”那样的标新立异，比如鸿篇巨制、如椽大笔，那是特色但非创新。书法宏观而言只有正与非正之别，细之是篆、隶、楷、草或者加上行书，然而不同时代有不同特征，不同个人有不同风格，即使同样的正书也是因人而异。一流的创作任何时代都是凤毛麟角，而都应符合基本结构约束，因为这种结构即使不是符合黄金分割也是接近一种约定俗成的美感，没有变化当然也就没有生动和丰富可言，但“过犹不及”。


    历史上有很多关于书法家由生活情景、自然现象获得启发的故事。王羲之有感于鹅掌拨水，摄取其神态悠然自得、力量蓄而不发的特征；张旭见担夫争道，闻鼓吹而得笔法意、观赏公孙舞剑而得其神；怀素观夏云奇峰、壁坼痕折；黄庭坚有感于船夫荡桨；徐渭讲那些都是指运笔；日本杰出的僧人书法家良宽讲，他最不喜欢书法家的字、厨师的菜与诗人的诗。其实自然界的启发不一而足，比如奔流的波涛中有起伏的节律、动态的连续、饱满的张力、圆润的过渡，寓动于静，离而不散。真能从必然王国到自由王国者寡。


    有次去外地参加一个学术委员会会议，笔者不揣谫陋带了些以前休息日所书习作供大家一笑，其中一位说怎么没盖印章，笔者意不满意，都不盖，好玩而已，会后路上那位老师又提及，笔者意盖了章（可能）会被拿去装裱，浪费了。由此可联想到书画作品上印章的作用。本来，印章只是确认身份，逐步才有了闲章。现代机器高仿的印章已难辨端倪，因而其原本作用已难以胜任，有的干脆说（真伪）不看印章了。至于章可提高画面丰富性亦非必然，比如中国画有色彩斑斓的泼墨山水，也有单一的水墨画而不失意境，即色彩并非不可或缺。章可丰富画面，本身还是艺术品，但盖不盖不影响基本面。


    世人尽学兰亭面，欲换凡骨无金丹。


    谁知洛阳杨疯子，下笔便到乌丝栏。


    ——黄庭坚赞杨凝式《韭花帖》


    ## 4.4 面目何出


    书法更偏重实践、表现、美感。变形是书法创作的基本要求。祝嘉说，总是在一个“变”字上。黄宾虹强调播磨的平、留、圆、重、变，前面四个字是手段，是为最后一个字服务的。


    特别具有参考意义的当是探索大家递阶与成长细节，比如面目形成的具体脉络、各阶段的取舍、教训与反思等。书法创作由形变而具有个人面目，大概可分为三种情况。一是如吕凤子，糅合各种书体、各体痕迹可见然而自有特色；二是多数大家的途径，尤其如于右任，浸淫正书北碑而成其行书，进而是草书并融化为一了；三是如洛阳龙门可见的北宋陈抟的联语，由《石门铭》来，所取单一但气魄宏大、后人难及，康有为亦写此联，笔势流畅然不及其神气，其学生萧娴字笔画单调，他们都有构型局促之嫌。


    很多墨迹都有浓郁的文人气息，看起来舒服，想象上温馨，但不可过熟，“熟”了就要当心“俗”。有人认为帖学是正宗，有一定道理，秀美至少是基本美感的一种。篆、隶、正、草各体内都可“出新”，既可以是关于差别很大的各体的面目，也可以是对各体内不同发展阶段作品的认识，比如祝嘉的“用写大篆的方法写小篆”，西汉汉简与东汉碑刻隶书的结构互参，北碑与唐碑的正书线条的融合，章草与草隶的一体等。


    最高境界是草书，主动的揣摩、脱俗的立意于结果有必然的影响。从张芝的超旷，王羲之的雅逸，孙过庭的规畅，张旭的奔放，怀素的狂肆，杨凝式的温婉，黄庭坚的恣劲，八大的奇峻，沈寐叟的厚拙，于右任的清润，灿烂夺目，显出其与人类精神追求与审美境界相谐的表现内涵与视觉特质。那都是书法素养的综合体现，如孙过庭早《书谱》中指出：“伯英不真，而点画狼藉；元常不草，使转纵横。自兹己降，不能兼善者，有所不逮，非专精也。虽篆隶草章，工用多变，济成厥美，各有攸宜。”


    书法源自象形文字，即“师造化”，又表达内心感受，所谓“散诸怀抱”。有一天笔者在书房望着窗外想着一副对联，忽见一毛毯类物飘落，很少有那样注视窗外的情景，更无如此观感：该物快速而轻柔地落在树枝上，伴随晃动的树冠驻留在空间背景中，映像到书法线条是没有犹豫的自然之“势”，如果在下落过程中被枪击或被绳线拽离其本来轨迹，当生别扭之感；其止则受外部阻力作用，移到书法则是由内心而至笔端的控制或者表达；晃动则是鲜活效果及由此而来的想象空间。书法线条，当求自然的直，未必要“笔直”，如林散之对联“笔从曲处还求直，意入圆时更觉方”。那是自然呈现与情感表达的统一，是动静等对立关系的协调。


    数月后笔者上班等公交车时，一白鹅（是否此称呼笔者无把握）映入眼帘，只见其贴近水面快速而轻松前行，然后稳落水岸，悠闲张望，突然振翅高飞，直到消失在视线中。书法的运笔也应那样自在、从容，与水面基本平行但不生硬，落笔干净利索，不拖泥带水，起笔则迅猛、果断、势不可挡。


    清刘熙载在其《艺概》中云书法创作当合“清厚”两字，极为概炼。然而，只“清”，也许会失之于面目单一或气息靡弱，要用“润”来生动、丰富之，就如同一个人“眉清目秀”之外最好还要“气色红润”那样的自然美感。仅求“厚”，既可能“滞”也可能“木”，“浑”则天然、淳朴，如同一个人高大魁梧之外最好还自然挺拔，所以“清润浑厚”更为贵，就像运动员有肌肉且四肢皆壮，还要生龙活虎，然后才可能有灵动的身影、矫健的身姿。这是审美视角。就创作言，当努力用笔疾而勿滑，涩而勿滞；线条厚而勿臃，清而勿浮，浑而勿粗，润而勿嫩；结构宽而勿松，应而勿促；由此变而勿怪、承而有新。


    以人为例，通常是所谓的漂亮，如五官端正、比例协调、样貌生动，那是基本的，并不全面也非最重要，气色（肤色）、条贯（身材）同样重要，它们都是直接的视觉印象。比如肤色要自然、有活力而非一味白，而匀称以外的高挑、丰满与否，映衬着气度、风神，尽管小家碧玉亦是美，然而最具感染力和表现力的草书当不会归于此。进一步，则是修养、气质等内涵。由此孕育出独特的味道、格调和境界。


    书法比其他艺术容易上手，业余或退休后的学习者多，由此可言容易，仅就努力入门而言，此说合乎实际情况，然而历史上留名至今的书法家，没听说有后来“半路出家”的，或者说，没有年轻时打下基础并持续摸索，年纪大后忽然成就书法事业者尚未曾听说，这与书法艺术需要长期经验积累的特点密切相关，而于其他学科，从一处转到另外一个差距显著的领域依然成就斐然者时有所闻——因两者间往往有某些共同基础。


    有人认为唐代最大的草书家张旭作为技巧成熟的书法家，其终极目的还是写字，而禅僧已超越了这个阶段，比如有人所写不合草法，是他们不在乎小节。此言恰当不？还以唐代“颠张狂素”的另一位，即怀素为例，其《自叙帖》被认为是中国历代草书及僧人书法的高峰，虽欠规范但笔法精良，而他自己食肉近俗，已不合禅僧之格了。


    有的前辈一生局于一处，照样有特色，但就更宏观的视野观之，局限性显然。个人面目的形成也许可以归纳一些必要条件，充分性难有定论。


    书圣王羲之的《兰亭序》中的二十个“之”字各不相同，是创作本质的体现，也是自然的面目。而这种创作同样应当避免仅仅为了追求有所变化而忽略审美要求或失去美学意义。有人强调王羲之过后写不出那样水准了——其实本来如此，一流作品估计皆然。


    创新的最终目的是时代特色和个人气息的融合，那都是在前人成就基础上的发挥或变化。为创新而“创新”背离审美活动作为社会实践的一部分的延续性、社会性。这等道理不是可通过推理，而是由人们的经验、社会认知可得出的结论。


    婴儿经过一定训练，会走路了，可是路径曲曲歪歪，对他而言是变化和进步；而对于成人，那足迹本身并无意义，既不值得效仿，也无里程碑性质。有生命力的作品不是再现传统而是成为后人参考的“传统”，从而在社会进步、历史演化和生活嬗变中展现其艺术功用、美学意义和文化价值。书法创作当“形神合一”。“形”指线条、结构，是基础也是第一印象；“神”指精神、意境，是直观面目和生命律动；“合”指融汇各家、有机组合而不囿于一篇数人；“一”指面目独特、风格独立从而地位独步。


    只眼须凭自主张，纷纷艺苑漫雌黄。


    矮人看戏何曾见，都是随人说短长。


    ——赵翼《论诗·其二》


    ## 4.5 章草启后


    隶书是汉代最具代表性的字体，故有“汉隶”之说，或用笔纵逸，结构开张，或方正劲健、内敛厚重，丰富多姿，难尽其貌。《郙阁颂》作为著名的“汉三颂”之一，浑朴稚拙、天趣盎然，是东汉众多隶书名碑中的佼佼者。其横画“蚕头燕尾”更多的是形蕴于意，这与章草的笔法颇为吻合，此间关联长时期未被重视。


    章草与隶书是两种书体，但两者的发展史交替而互参。常见“隶草”“草隶”之说，多不加分辨，其实是不同的概念，尽管意有所近。“隶草”，指隶书的草写，是从章草之所由产生的角度言之，但不及章草规范，也更为宽泛些。章草的“隶意”，不限于“燕尾”，点、横、收笔、转折甚至起笔均可有表现。“草隶”可指草写的隶书，也可指篆书的草写（或者说古隶），即隶书之初的形态，一是“草率”，一是“初步”，为与章草本身有所别，以“初步”为宜。


    章草也成于汉代，汉代前后诸书当为章草之良好参照，其起始与汉简在时间上几乎重合，简牍时代的章草当是章草的源头。汉简可细分为隶书、行书和草书，其中的草书可大致类同于章草，有些字“草率”的程度也相当，不过只是汉简中的一部分，然而可谓是章草学习的一片广阔天地，比如草隶《神乌傅》处在由隶书向草书变化的源头，用笔精熟，点画生动，墨法秀润，宽博流畅，《仓颉篇》则介乎篆、隶，颇为难得，秦简亦然。经典的《出师颂》为隋代一佚名贤达以章草书写的东汉史孝山的颂文，显现出章草在向今草过渡期间的形态，结体谨严，书风规整，劲健飞动，飘逸典雅。此外《月仪帖》《急就章》，以及《平复帖》《秋凉平善帖》等为章草代表性作品。章草还现见于传统的帖及砖文。


    章草线条厚畅，笔画率意，结构舒展，古雅生动，字字独立，近行书，是草书中的“正书”，是成熟的草书（今草）前的一种字体。比如《十七帖》是王羲之的代表作，也是今草的经典，同时，它与规范的章草在结构上几乎一致，因而，它可以是章草与今草的桥梁，也可以是章草的一种表达方式。而章草变为今草，减少横笔的波势，加强直笔的垂势，把转折、竖、挑、撇、捺变为环转，书写时上下牵连，或借上字之终而为下字之始，脱离了隶书的痕迹，是书法各体的综合呈现和非凡境界。


    章草之名的起源莫衷一是，有的说是当时用于奏章，有的说是出自西汉史游的《急就章》，也有的说是东汉章帝所爱。这些人只是集成者，社会的需要、更多人的参与是基本推动力量。由“章”字来看，有章法、法度之意。


    汉代章草流行于医方、军事文书等中，还有一部分源自篆隶，笔画简直，并不成熟，数量也不多，如“平复帖”“济白帖”和简牍中的一些字，线条迟涩，结字灵动。章草的范围似乎不一而足，后来的赵孟頫、宋克等多以此为宗，用笔趋于成熟而结字追求精美，有时候看起来似乎与行楷无异。


    章草在成熟过程中与时隔不久的三国、两晋书法相辅相成，章草可以说是这些书体的汇聚，这些书体也或多或少，或明或暗地体现或辉映着章草。比如《爨宝子碑》立于西晋年间，正书而带有明显的隶书笔意，尤其是特征突出、张力感强的横画，与章草似乎有着不解之缘。至东晋，行书、正书、草书全面成熟，隶书及章草逐渐被取代。


    章草后不多见，可谓一朵奇葩然习者少。沈曾植的拙，直抒胸臆；王世镗的厚，笔有波澜；祝嘉的辣，意味深长；王蘧常的劲，圆浑曲折。似乎那是未被足够重视的天地，后人当于此获得更多启示与借鉴。


    霁天欲晓未明间，满目奇峰总可观。


    却有一峰忽然长，方知不动是真山。


    ——杨万里《晓行望云山》


    ## 4.6 欣赏之余


    常有诗、书、画、印“四绝”之说，怎样才“绝”？就如俗话说上知天文、下知地理，“知”到什么程度？比如我们从小都读一些古诗词，有的较为熟悉，但那都是古人筛选过的，若我们自己选就难以着手，原因在于既缺少实践、体会，又没有很好地阅读、理解诗词文论。只有长期熏陶才有可能进入“自由王国”。再如作诗，有一定量的尝试和体验后方有可能出名篇，通常“抒怀”只能算是兴趣爱好，达到何等程度才能算数？未必要如于右任、柳亚子，当在专业范畴（比如入“诗人”之列）比较。


    某日在旧书店见一笔者以前并非在意的已故名家书王维五律《山居秋暝》诗印刷品，因尺幅较大、日常难得一见，便要了，卷着放书房一角，也许很快遗忘。不少天后找书顺手打开，读着熟悉的诗句，王维诗中有画、情景交融之意跃然眼前，忍不住默读再三。生动的风光，安逸的情致，和谐的构思，闲活的意境，感受尤切。数十年阅读，多为浮光掠影、浅尝辄止，没养成良好的品位、赏析习惯。另一方面，阅读理解需要经历的积累、思绪的碰撞、体悟的提升。疫情期间不便外出，多次念及自然景致的引人以及身临其境的感受。所得那纸，也算是一点意外收获，当时带回没想到会有如此作用。


    此事可引出另一话题，即近人作品是否可学可参。很多名家强调勿学其作而应上追古人，因为古代经典丰富，他们也由古代经典而来。此意清晰无误，但若无睹他们的作品岂不意味着他们一无是处？显然矛盾。应当避免的是企图走捷径而本末倒置，就如忽视主食而专用零食；他们最多是百家中的一家，而且不能忽视这一家是由那百家来的；尤其重要的是，不能陷入其中依葫芦画瓢，即便一模一样也失去了艺术丰富性、独特性，况且还没见过只学一家而超过那家的。同样功夫转益多师当是别样境况、何乐不为！


    与创作对应的审美活动是欣赏，在此过程中，逐步会觉得原来不感兴趣的作品，随着认识的积累也可接受甚至认可了，这一方面是个人修养的进步，从而可以更宽容的视野对待琳琅满目的作品；另一方面则是体会到创作者有时超越不了困难或高峰，只能退而求其次、不得已而为之——不是作者不知道，而是并非所有要素都可掌控。不少书家的作品并非越老越佳也是一证。


    书画于普通百姓更平常的作用是欣赏之外的“补壁”，此举就如书画作品的空白处往往会盖印，理念上无可厚非，而实际上有部分情况显然近乎杯水车薪，那与中医之宏观、整体所反映出的笼统甚至含糊性类似。印章到底能多大程度“补”空，其位置恰当否，其含义对应否，皆难以细究。


    一般以为，写生是绘画基本功和创作素材获取途径，有次笔者问一位画家是否还常外出写生，他意那非必需，可能这位画家想以此说明其某种做法。还听说有些画家到景点拍些照片、回去参考，初听新奇，细想不同：面对实景，可有灵感甚至思维万千，照片可借以联想，感触则隔了一层，且平面与立体视觉感受是不同的。


    绘画中，一般而言复杂的难驾驭，能画简洁风格者未必能画复杂风格作品，反之亦然（即便画艺精，不见得寥寥几笔即可传神）。有人说李可染的“红色”题材作品与当时的政治意识形态有关但没那么密切。其实，深入生活也好，所谓“笔墨当随时代”也罢，反映时代既是艺术家的使命也是创作源泉，根本的是技法、构思和表现，他的《万山红遍》一直受到追捧。


    有人说书法创作要写自作诗词，从强调创意出发无可厚非，但从书法本身看就难明其意了。书法首先着眼书写，所谓与内容统一更好，什么是恰当的内容？自然是最能达意者，因此，取舍原则并非自己与他人的不同，而是内容的高低。就如学习书法取古人数不清的作品中的佳作学习一样。反之，写自己的文字也行，然而哪个更合不同对象与场景是需要考虑的。曾听人说有人的画即便内容是马桶也一样高，又对有的书作内容因是某人的诗词就感觉不舒服，尽管前后矛盾，但关注作品本身不错。


    曾见一段文字：作者问一个书法家对鲁迅的书法如何看，那位反问鲁迅懂书法吗？该作者觉得哑口无言，他感叹竟然无知到了如此地步。鲁迅是公认的一流书法家^([\[7\]](#att001.html#footnote_content_att001_7))。有人希望对“中国文化的核心是书法”做些解释或说明，接着有人认为，先别管其他，说说这话本身对不？笔者由此想到，这问题的“核心”首先是弄清“核心”的含义：


    第一，得是历史上长时间存在的文化现象；


    第二，应是精神生活的主要方面并普遍影响现实状态；


    第三，要发挥了更大或起了纲举目张作用的思想积淀。


    于是，书法难以“跻身”其列。这里不是讨论该话题的答案，而是指凡事先要弄清其基本含义及其各方面影响。康有为将书法视为雕虫小技，大家的理解估计深浅不一，只有有了逐步的、切实的体会，才能从人的立意是有高远低近之别的背景出发，回过头来逐渐明白。曾见《进入狂草》一书，那是作者的长期体会与具体分析，颇具启发意义。多数书法人“进”不了，能成为书法其他某体的专家也不易，他们都可以交流最有心得的感悟，但若试图“四面出击”，难免出“洋相”。


    曾见书上一风云人物表示，当下创作内容多是雷同的古诗词，因此，比如他的作品数百年后别人完全可能无法区分其与明代书法的区别。若不理解明代书法的特色，则与其“学术”地位颇不相称；否则，似乎是自大了。再比如其言对院士级科学家谈初等数学规定是“无知或愚蠢的”，殊不知假如某大家确实犯了初等错误，依然是贻笑大方的。其作品估计就在书法史里了，无论影响、比重多大，更多人只见前人的记载而不清楚本质是非。


    书画的意境都是审美范畴的，而创作者的境界则可超越此意。比如郑板桥的“六分半书”颇有新意，但书法本身价值并非一流，可是他有《潍县署中画竹》题画诗：


    衙斋卧听萧萧竹，疑是民间疾苦声。


    些小吾曹州县吏，一枝一叶总关情。


    田家英是清代学者书法收藏大家，几无人能过，他有诗：


    十年京兆一书生，爱书爱字不爱名；


    一饭膏粱颇不薄，惭愧万家百姓心。


    那是很多名家、大师不及的。有次笔者在一家久未去过的书店见有一沈曾植书法专集，翻了一下，内容和印刷均粗糙，但不少内容没见过，就买下了。第二天晚上浏览了一遍，总的感觉是面目缺乏沈氏独有的爽劲、气势，用笔生硬草率，结构牵强，尤其转折处多露破绽，失望之余想到即使大家的创作水平也是参差不齐，精品毕竟是不多的，就放到一边。隔天早餐后、上班前又特意翻了几分钟，自然光下确认那是一本掺杂了不少伪作的集子，联想到拍卖行拍品真假不保甚至有人专门印刷真假混杂的作品集。但那书编者是否有意不得而知，也许眼力不够随便找了一些图片，为了盈利而不顾误人子弟的后果了。那书是从古至今著名书法家的系列作品集中的一种，一般读者难明其实。


    笔者曾在古玩市场见一老者处若干篆书作品，觉得尚可，也没有漏字。临走购了两件，回后发现其中一件多了一个字。回想当时情景，两件同样内容的作品字数差一，笔者想当然以为字多者就是此前看过的，因为通常是漏字、字少者当缺字。其实错了，那是多写了一个字又标识为衍字的。还曾购得网上无意间看到日本书作、禅宗临济宗创始人义玄法师句“无事是贵人”，据云此处“无事”乃自然、本分，《心经》所谓无挂碍，而非不做事、无所事事之意，与道家“无为”有相通处。禅宗强调不立文字，然非用语言说明难以理解，此“无事”亦非解释不可。同时所得是孟浩然诗句“平生一片心”，卖家似以对联外售，其实除了字数一样，其他均不合对联要求。


    有一位书法专业研究生在读期间举办展览，临碑功底显然，也有一定个人面目。隔十多年后又见其作品，线条益干，结构有夸张之嫌，总体上与那次展览作品比不说退步也似无深入。另一位年长者年轻时面目非同一般，后来由于工作等原因“搁笔”良久，休息后重拾，其起点、眼界无疑高出众人，然而看起来似乎未超越年轻时作。为何如此现状难陈其故，也许有理念的差异、认识的改变等原因，可以是认知科学的一个研究话题。反观多少没有中断过的“书法家”作品之未必佳，似乎情况多少可以理解了。


