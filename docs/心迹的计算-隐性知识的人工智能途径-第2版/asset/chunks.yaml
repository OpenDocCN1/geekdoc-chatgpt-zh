- raw: '面对芸芸众生，旁观各色种群，包括人类这个万物之灵长在内的生命是如何出现和进化的？进化论是一种合理的解释，也有观点认为进化论中有的地方证据不足，有的甚至举出“反例”，然而至少它是一种理论，另外还有“人择原理”，没有别的系统理论，更不要说服人的其他学说……


    万物生长，形态各异，它们有基本的结构吗？有共同的基础成分吗？不同的粒子不断被发现，这是物理学的进步，而基本粒子过段时间往往不再“基本”，物质基本结构不断被突破，现在叫“夸克”，随着科技的进步，认识得以深入，基本粒子的神秘面纱被一层层揭去，还会有一次次惊喜……


    这些问题还没有最终答案，离出发点的距离，也就是人们开始探索至今的历程已经不算短暂，离最后结果的获得还有多少路程虽然不得而知，借用“行百里者半九十”之喻当不会误。


    一部关于两次荣获诺贝尔奖的居里夫人的传记中有如下文学色彩浓郁而又科学范十足的文字［3］：


    “怎么会有人觉得科学枯燥无味呢？还有什么东西比支配宇宙的不变定律更醉人？还有什么东西比发现这些定律的人类智慧更神妙？这些非凡的现象，以和谐的原则彼此联系；这种次序，表面上无次序而实际上有次序；与它们相比，小说显得多么空虚，神话显得多么缺乏想象力啊！”^([\[1\]](#txt002.html#footnote_content_txt002_1))


    智慧是机体进化、环境交互、“身”“心”互动的产物，由此而生的又一个问题是：人类智慧能够认识无比神妙的呈现智慧的自身大脑吗？这有赖于科技自身，也离不开浸淫科学的人文精神；有待开拓未来，还要借鉴历史。人类对自然和社会的思索和理解，既是与环境抗争、改造社会的现实需要，也是科学昌盛和文明进步的必然结果。世人内心探求未知的渴望无法被遏制，世界各民族古代的神话、寓言通过推测、想象企图对自然现象及其可能情状做出解释或赋予期待，是原始思维的体现，也是形象思维的表征，南北朝的刘勰在其《文心雕龙》中最早提出了形象思维。希腊神话中的火神和工匠之神赫菲斯托斯（Hephaestus）创造出了潘多拉（Pandora）。而中国“嫦娥奔月”“龙宫探宝”经过数千年的历程已变成“可上九天揽月，可下五洋捉鳖”的现实。当然，那只是行为结果，并非对内在生命机制的把握。


    回望未曾中断的中华文明，博大精深、辉煌灿烂，从楚辞到乐府，从传统医学到琴棋书画，文献浩如烟海，典籍汗牛充栋。春秋战国时期，制度变革推动了文化的繁荣，并促成了思想的空前活跃和观念的兼容并蓄。“百家争鸣”蔚然成风，“诸子百家”应运而生。儒家、道家、墨家、法家以及医家不一而足。其中，以《老子》《庄子》《列子》等为代表的道家偏向自然、逻辑等领域。《老子》的辩证宏约、探天索地，《庄子》的汪洋恣肆、诙谐磅礴为一代又一代后人津津乐道，并被捧为金科玉律；《列子》则哲理隽永、慧光闪烁。让我们后人领略了灿烂的思想光芒、瑰丽的文化传统。


    钱学森在编《关于思维科学》一书时，把李泽厚的一篇《漫述庄禅》放进去，笔者后来多次阅读钱学森著作以后，方理解他是出于对中国传统思维的特别关注和期待才那样选择的。李泽厚说他写了那篇文章以后，钱学森专门去他宿舍跟他交流，他说钱学森非常严谨，他想从中国思想当中寻找人类思想未被关注的一方面。这不仅体现钱学森广博的知识面、深邃的眼光，也体现他考虑问题的全面和深刻。一般人通常不会把现代科学放到中国传统文化背景当中去，但是他却视之甚重，可能他希望通过这点指出中国传统文化与现代科学之间是有内在关系的［4］。这是一个著名哲学家、思想家对一个杰出科学家、思想家的深深认同与钦佩。


    中国传统文化与现代科学思想在某种程度上“貌离神合”，有着天生的渊源。《列子·汤问》（十三）讲了“机械人”的故事［5］，说在周穆王西狩归来的路上，有一个叫偃师的能工巧匠觐见了周穆王，并向周穆王引见了一个他所造的“歌舞者”。该“人”动作流畅、仪态万千，几乎想到什么就能做到什么。周穆王信以为真，待偃师当场剖开这个假人，周穆王一看，其实内部都是皮革、木料、生漆等物，体内的肝、胆、心、肺、脾、肾、肠、胃，体外的筋骨、枝节、皮毛、牙齿、毛发，都是假的。偃师把这些东西组合在一起，它又复活如初。周穆王试着取出其心脏，“他”就无法说话了；去掉肝脏，“他”就丧失了视觉；去掉肾脏，“他”就不能行走了。所谓班输的云梯、墨翟的飞鸢，都自称是最高的技能了，当听说了偃师的技巧，他们终身不敢谈论自己的技艺。


    阅读之余我们不能不惊叹其精致的制造力和丰富的想象力。明代江东伟《芙蓉楼寓言》言其为“此幻术鼻祖”［6］。一千多年后的诸葛亮的“木牛流马”则是又一个经典故事，只是《三国演义》作为小说可以具有更多“神来之笔”。“机械人”故事给我们的启示是多方面的。


    首先，无论出于娱乐之意还是好奇之心，人工制造“类人”之物是古已有之的人类理想，诸多愿望的实现需要漫长的时间，远非个人生命可比；


    其次，人们关注的往往是“机械人”的表现，是一种行为模拟，这样的行为是否有与人类自身一样的生理机理则可另当别论；


    再者，这样的机械，并不需要都是由类人之物构成，内外有别，主次有分，是“生”和“物”的结合。


    往事越千年，生命无所息，历史在时空隧道中前行。1939年，为制造一台能解含有29个未知数的线性方程组的机器，诞生了以制造者名字命名的一台完整的样机ABC（Atanasoff-Berry
    computer）。这是电子与电器结合的机器，电路系统中装有300个电子真空管执行数字计算与逻辑运算，用电容器来进行数值存储，数据输入采用打孔读卡方法，还采用了二进位制。1946年，莫奇利（J.W.Mauchly）和埃克特（J.P.Eckert）设计制造了电子计算机ENIAC［7］。他们用掉18
    800只晶体管、70 000只电阻、1 500个继电器、6 000多个开关。该机耗电150千瓦，占地167平方米，总重30吨，每秒运算5 000次［8］。由于申请了专利，该机长时间里被宣传为首台电子计算机。有“计算机之父”之称的约翰·冯·诺依曼（J.von
    Neu mann）参与其研制，他为现代计算机提供了基础结构，使我们今天所熟知的计算机原则概念化和清晰化。现代计算机理论先驱则是巴贝奇（C.Babbage）。具有讽刺意义的是，计算机的进化与人类智能的成熟方向相反［9］。


    1.2　杰出思想


    人工智能的研究方法通常被概括为符号主义、联结主义和行为主义几种。符号主义又称逻辑学派、心理学派或计算学派，也是最初和最经典的方法。它以纽厄尔（A.Newell）和西蒙（H.A.Si
    mon）提出的物理符号系统假设为基础，从逻辑的角度看，它是符合人的一般思维过程的，由此可言，这是脑内过程的一种映像方式。从家用电器如电冰箱、空调器到飞机、列车的控制，都有根据预先确定的原则实时调节或逐步执行的过程，它以规则推理为基础，然而针对不同领域的问题，规则的来源、验证和刻画都有其难以克服的问题，比如人的有些经验往往言说不清，有些具有不确定性，要让机器了解这样的内容会令其不知所云，此时的推理，难免有不可靠或束手无策之窘。


    联结主义则从人的大脑神经系统结构出发，研究分层的、互相联结的简单神经元的集群信息处理模型、能力及表现。1943年麦克卡洛奇（W.S.Mc Culloch）和匹茨（W.H.Pitts）宣布，大脑中每个神经元都是一个简单的数字信息处理器，而大脑作为一个整体是一种形式的计算机器，它们被称为人工神经网络、神经计算仿真学派或生理学派。以前的人工神经网络通常是三层模型，21世纪以来，相对于经典结构而言的深层神经网络得到广泛研究与应用。


    行为主义又称进化主义或控制器学派^([\[2\]](#txt002.html#footnote_content_txt002_2))，其原理为控制器及感知——动作型控制系统，从行为心理学出发，研究其在与环境的交互作用中表现出来的智能，更加类似于生物系统。例如，布鲁克斯（R.Brooks）研制的机器人Herbert（以西蒙的名字命名）以麻省理工学院人工智能实验室的办公室和工作空间作为自己的环境，在桌子上搜寻空的软饮料罐子，把它们捡起来并带走。机器人要越过某些障碍，可以通过普通的红外线感知，日益普及的家用机器人吸尘器就借助于此；也可利用全球定位系统分析，如军事机器人。但一方面行为与智能不在一个层面，行为作为智能的表现可以部分地对应或映像智能；另一方面，行为与环境密切关联，对环境的感知和建模是随之而来的问题。


    取各种方法的优势使之融合、互补是可取的路径，而要统一不同的路径和方法使之“一体化”，无论从实践探索的积累，还是理论基础的沉淀角度看，都为时尚早。纵然“没有理论的行动，是盲目的行动”，就人工智能发展现状而言，更重要的是“没有行动的理论，是空洞的理论”。17世纪莱布尼茨（G.W.Leibniz）提出最初设想，19世纪布尔（G.Boole）奠基、弗雷格（G.Frege）完善，20世纪初被怀特海（A.N.Whitehead）、罗素（B.Russell）和哥德尔（K.Gödel）集大成的数理逻辑，是经典人工智能的理论基础。


    1955年纽厄尔、西蒙在肖（J.C.Shaw）的协助下开发了“逻辑理论家”。这个程序能够证明罗素、怀特海于1913年出版的巨著《数学原理》中前52个定理中的38个，其中某些证明比原著更加新颖和精巧。王浩在数学定理机械化证明方面做出了重要贡献，他设计了一个程序，用计算机证明了《数学原理》中几百条有关命题逻辑的定理，提出了“数学机械化”。吴文俊后来在该领域做出了一流工作^([\[3\]](#txt002.html#footnote_content_txt002_3))。人工智能被提出20年后，雷纳特（D.Lenat）的博士论文讨论了如何发现初等数学中有趣的待证明的定理而不是定理证明程序的问题［10］。2009年4月，美国《科学》杂志发布了施密德（M.Sch
    midt）和利普荪（H.Lipson）开发的能从实验数据中发现物理定理的程序的消息，即对其分析形式施加最小约束而发现存在的自然关系［11］。具体地，只要事先加载一组简单的基础数学函数和要求其分析的数据，该程序就能够在输入的数据集中辨别相关因素，从各种可能的解释中精选出有希望的少数几种，然后生成描述它们之间关系的方程。例如，由实验得到位置和速度数据，通过搜索可收敛于能量守恒定理，而不需要预先知道物理学知识。尽管这样的工作能以数学形式表达与物理定理相应的方程，但依然面临证明和解释的挑战，也没有回答是否发现了新定理。新定理的发现，建立在敏锐的眼光、全面的把握和有素的训练基础上。训练支撑把握，把握锻炼眼光，它们也都有赖于经验。


    冯·诺依曼与图灵（A.M.Turing）是20世纪两颗科技巨星，他们深刻地支撑、推动了计算机及其基础上人工智能技术的发展与进化。古人强调人之立德、立功、立言“三不朽”，大致对应影响（包括人品）、事功（包括组织）、思想（包括理论）三者。


    影响上，美国计算机协会所设世界计算机领域最高奖以图灵命名，图灵还是英国广播公司（BBC）评出的“二十世纪最伟大的科学家”（候选人是爱因斯坦、居里夫人、屠呦呦和图灵）；有多项诺贝尔经济奖则与冯·诺依曼的“博弈论”有关。


    事功上，冯·诺依曼的计算机体系结构设计^([\[4\]](#txt002.html#footnote_content_txt002_4))受到图灵提出的关于计算的原则的论文的影响，沿用至今。图灵对计算机的实际发展做出过重要贡献，他了不起的实际工作是“二战”时期破译“纳粹”德国的军事密码，使得“二战”提前结束。


    思想上，“图灵测试”（见本节稍后）更大意义上是具有哲学色彩的讨论话题，现在看来其于人工智能技术发展尚未见实际指导意义（即未必以其作为人工智能系统能力的衡量原则），人工智能一直在努力模拟人脑机能，不会因为达到某个阶段而止步。


    图灵也受冯·诺依曼的影响，冯·诺依曼1935年讲授后来在“图灵机”中得以体现的存储程序概念，他是20世纪最杰出的数学家之一，也是伟大的思想家，兴趣甚广，影响超出计算机、人工智能范畴。关于人工智能，他也有基础性的论述，未完成稿在他去世后以《计算机与人脑》为名出版，第二版序言认为他是心智领域的牛顿［12］。


    据王浩写的《哥德尔》，在普林斯顿，爱因斯坦之外哥德尔周边还有冯·诺依曼、图灵等。香农（C.Shannon）在一次访谈中曾说在普林斯顿遇到过爱因斯坦、哥德尔、冯·诺依曼，但他们未必记得遇到过他。冯·诺依曼引用哥德尔定理并称赞其超越他人的工作。哥德尔一方面曾“反驳图灵把人心与机器等同看待的论点”［13］；另一方面，强调他的不完全性结果“丝毫没有给人类理性的力量设立界限，而只是给数学中纯形式体系的潜能设立了界限”。这话不点名地批评了图灵。但“他认为1936年图灵的工作是自己有关形式化局限性工作的一大补充与完成”。［13］


    人工智能最早的奠基工作是由图灵开展的，他认为，无论对于机器还是人脑，外在行为就是标准，而语言的唯一作用就是实施这种标准。如果机器能够完全模仿大脑的外在表现，那就没有必要关心它的内部是怎么做的，机器就是在做算术、下棋、学习和思考［13］。1950年图灵在论文《计算机器与智能》［15］中描述了人工智能的前景。这篇论文后被改名为《机器能思维吗？》。换句话问，就是计算是思维的一种形式吗？进而的问题是，机器能否通过表征智能行为的测试，这就是后来被人们津津乐道的“图灵测试”。


    那是一个模仿游戏，参与者有：一个询问者（C），一个男人（A），一个女人（B）。C与A、B通过隔离的房间进行交流（例如用键盘打字使其在屏幕上显示）；除此之外，3个参与者没有其他接触方式。询问者在游戏中的任务是，通过提问来确定A和B之中哪个是男性。A在游戏中的目标是使C做出错误的判断。而对于B，则是要帮助询问者。对她来说，最好的策略可能就是如实回答。


    如果在这个游戏中用一台机器来代替A，会出现什么情况？在这个游戏中一台计算机模仿一个人（男或女）。C的任务相应改变为判断A和B之中哪个是计算机。为了完成这个任务，询问者可以问任何问题。而计算机尽一切手段使询问者判断失败。在这种情况下（计算机模仿人）做游戏时，C做出错误判断的次数，和他同一个男人和一个女人做这个游戏时一样多吗？


    一旦计算机在模仿游戏中的表现和人在游戏中一样好，那么测试就通过了。“图灵测试”是一种特定的智能测试，即言语智能的测试，这要求计算机具备常识。后将谈及的大语言模型在诸多方面自然而然地可以通过“图灵测试”。


    此后，图灵指出“机器能够思维吗？”这个问题是无须讨论的。1952年，“图灵测试”进一步修改为，询问者每次询问一个参与对象，有时候是人，有时候是计算机。这就是说询问者并不能事先知道计算机和人的比例。这个方案被于1991年开始的一年一度“图灵测试”竞赛采用，该竞赛也被称为侃大山程序比赛，它承诺授予第一个通过本版本的图灵测试的程序10万美元的奖励［16］。


    此后，不断有系统“通过”“图灵测试”，实际上，“图灵测试”的场景、对象应该有客观、标准的界定，而测试者也应是深刻理解“图灵测试”^([\[5\]](#txt002.html#footnote_content_txt002_5))的本意者；通过一定规模的“测试”是一回事，真正具备人的智能是另外一回事，前者只是后者的一个子集。


    1.3　乐观预言


    这样的计算机的问世，标志着人类用机器模仿自身思维和智慧的新开端，使人工智能研究有了强大的支持。从此以后，人们怀抱着与日俱增的热情和兴趣研究和使用计算机，并在认识自然和改造社会的活动中得到了丰硕回报。在这样的行为背后隐含着如下动机：人们期待着计算机能像人类那样处理问题和认识事物。然而在相当长的一段时间里，计算机给人们带来的恩惠主要在于替代人们进行大量而复杂的数值计算和数据处理。电子计算机本身以超越预期的速度发展了10余年后的1956年，“人工智能”诞生了［17］。那年6月，在美国达特茅斯（Dart
    mouth）学院由麦卡锡（J.Mc Carthy，1971年度图灵奖获得者，人工智能语言LISP的发明人）、明斯基（M.L.Minsky，1969年度图灵奖获得者，框架理论创立者）、罗切思特（N.Rochester）和香农（信息论的提出者）组织召开了人工智能暑期专题讨论会^([\[6\]](#txt002.html#footnote_content_txt002_6))。参加者还包括塞尔弗里奇（O.Selfridge）、所罗门诺夫（R.Solomonoff）、莫尔（T.More）、格伦特（H.Gelernter）、纽厄尔和西蒙（中文名：司马贺）（后两位共同获得1975年度图灵奖）。


    西蒙认为：“在发现符合经验数据的规律之前，必须拥有适当的数据，这些数据看起来好像是由一个平滑的数学函数所生成的”。［17］这是有赖于机器的智能活动，人工智能的目标便是试图用机器模拟人类智能，上述电子计算机或者具有计算能力的设备（一般叫作专用计算机）正是这样一类机器。通过这样的探索和实践，人们可以反过来加深对智能本质的理解和认识，这同样也是人工智能的目标。本质指的是核心功能、神经机制和处理过程，迄今为止人类对智能本身了解颇为有限，对复杂的脑内过程建模为时尚早。因而，这里所说的模拟着眼于结果和效用，即外部表现，可以“殊途同归”。比如飞机是人类受飞鸟的启发而发明的，它们都能在蓝天翱翔，但飞机内部装置与鸟的体内构造并不一样。现代飞机中有大量的专用计算机在工作，它们构成一个网络环境，也具备一定的智能，比如它们可代替驾驶员驾驶。这既是从实际出发的选择，也是现实的无奈。换言之，这里只要求“弱等价”：给两个算法相同的输入会得到相同的输出，而强等价要求它们的处理过程也是一样的，或者说它们所有的中间步骤是一样的，这是更复杂的要求。


    有了计算机这样的智能模拟的载体或者智慧的物化能力，情况完全不同了。“虽然电脑^([\[7\]](#txt002.html#footnote_content_txt002_7))与人脑大相径庭，但电脑会让我们学到人脑的知识，这些知识是我们光研究人脑永远也不会发现的”［18］。这给世界的震撼是无可比拟的，现在看来，一开始关于人工智能的预言在彼时也是情有可原的。


    1957年，西蒙认为世界上已有可思考、学习和创造的机器。进一步，它们做这些事情的能力会快速增长，直到一个可预见的将来，它们能处理问题的范围将与人的心智所及的范围同样广阔［19］。


    1958年，西蒙和纽厄尔预言10年以后，数字计算机可以成为国际象棋^([\[8\]](#txt002.html#footnote_content_txt002_8))世界冠军，并证明新的重要数学定理；


    1965年，西蒙预言，20年内，机器将能做人能做的任何工作；


    1968年，毫无悔意的西蒙再次预言：“只要男人能干的工作，电脑都能干”［19］，他的预言与图灵曾经的预测比起来显得过于乐观。


    1967年，明斯基预言，一代人内，根本上解决产生“人工智能”的问题；


    1970年，明斯基预言，3到8年内，将出现具备普通人平均智能的机器。'
  fmt: '

    面对芸芸众生，旁观各色种群，包括人类这个万物之灵长在内的生命是如何出现和进化的？进化论是一种合理的解释，也有观点认为进化论中有的地方证据不足，有的甚至举出“反例”，然而至少它是一种理论，另外还有“人择原理”，没有别的系统理论，更不要说服人的其他学说……


    万物生长，形态各异，它们有基本的结构吗？有共同的基础成分吗？不同的粒子不断被发现，这是物理学的进步，而基本粒子过段时间往往不再“基本”，物质基本结构不断被突破，现在叫“夸克”，随着科技的进步，认识得以深入，基本粒子的神秘面纱被一层层揭去，还会有一次次惊喜……


    这些问题还没有最终答案，离出发点的距离，也就是人们开始探索至今的历程已经不算短暂，离最后结果的获得还有多少路程虽然不得而知，借用“行百里者半九十”之喻当不会误。


    一部关于两次荣获诺贝尔奖的居里夫人的传记中有如下文学色彩浓郁而又科学范十足的文字［3］：

    “怎么会有人觉得科学枯燥无味呢？还有什么东西比支配宇宙的不变定律更醉人？还有什么东西比发现这些定律的人类智慧更神妙？这些非凡的现象，以和谐的原则彼此联系；这种次序，表面上无次序而实际上有次序；与它们相比，小说显得多么空虚，神话显得多么缺乏想象力啊！”^([\[1\]](#txt002.html#footnote_content_txt002_1))


    智慧是机体进化、环境交互、“身”“心”互动的产物，由此而生的又一个问题是：人类智慧能够认识无比神妙的呈现智慧的自身大脑吗？这有赖于科技自身，也离不开浸淫科学的人文精神；有待开拓未来，还要借鉴历史。人类对自然和社会的思索和理解，既是与环境抗争、改造社会的现实需要，也是科学昌盛和文明进步的必然结果。世人内心探求未知的渴望无法被遏制，世界各民族古代的神话、寓言通过推测、想象企图对自然现象及其可能情状做出解释或赋予期待，是原始思维的体现，也是形象思维的表征，南北朝的刘勰在其《文心雕龙》中最早提出了形象思维。希腊神话中的火神和工匠之神赫菲斯托斯（Hephaestus）创造出了潘多拉（Pandora）。而中国“嫦娥奔月”“龙宫探宝”经过数千年的历程已变成“可上九天揽月，可下五洋捉鳖”的现实。当然，那只是行为结果，并非对内在生命机制的把握。


    回望未曾中断的中华文明，博大精深、辉煌灿烂，从楚辞到乐府，从传统医学到琴棋书画，文献浩如烟海，典籍汗牛充栋。春秋战国时期，制度变革推动了文化的繁荣，并促成了思想的空前活跃和观念的兼容并蓄。“百家争鸣”蔚然成风，“诸子百家”应运而生。儒家、道家、墨家、法家以及医家不一而足。其中，以《老子》《庄子》《列子》等为代表的道家偏向自然、逻辑等领域。《老子》的辩证宏约、探天索地，《庄子》的汪洋恣肆、诙谐磅礴为一代又一代后人津津乐道，并被捧为金科玉律；《列子》则哲理隽永、慧光闪烁。让我们后人领略了灿烂的思想光芒、瑰丽的文化传统。


    钱学森在编《关于思维科学》一书时，把李泽厚的一篇《漫述庄禅》放进去，笔者后来多次阅读钱学森著作以后，方理解他是出于对中国传统思维的特别关注和期待才那样选择的。李泽厚说他写了那篇文章以后，钱学森专门去他宿舍跟他交流，他说钱学森非常严谨，他想从中国思想当中寻找人类思想未被关注的一方面。这不仅体现钱学森广博的知识面、深邃的眼光，也体现他考虑问题的全面和深刻。一般人通常不会把现代科学放到中国传统文化背景当中去，但是他却视之甚重，可能他希望通过这点指出中国传统文化与现代科学之间是有内在关系的［4］。这是一个著名哲学家、思想家对一个杰出科学家、思想家的深深认同与钦佩。


    中国传统文化与现代科学思想在某种程度上“貌离神合”，有着天生的渊源。《列子·汤问》（十三）讲了“机械人”的故事［5］，说在周穆王西狩归来的路上，有一个叫偃师的能工巧匠觐见了周穆王，并向周穆王引见了一个他所造的“歌舞者”。该“人”动作流畅、仪态万千，几乎想到什么就能做到什么。周穆王信以为真，待偃师当场剖开这个假人，周穆王一看，其实内部都是皮革、木料、生漆等物，体内的肝、胆、心、肺、脾、肾、肠、胃，体外的筋骨、枝节、皮毛、牙齿、毛发，都是假的。偃师把这些东西组合在一起，它又复活如初。周穆王试着取出其心脏，“他”就无法说话了；去掉肝脏，“他”就丧失了视觉；去掉肾脏，“他”就不能行走了。所谓班输的云梯、墨翟的飞鸢，都自称是最高的技能了，当听说了偃师的技巧，他们终身不敢谈论自己的技艺。


    阅读之余我们不能不惊叹其精致的制造力和丰富的想象力。明代江东伟《芙蓉楼寓言》言其为“此幻术鼻祖”［6］。一千多年后的诸葛亮的“木牛流马”则是又一个经典故事，只是《三国演义》作为小说可以具有更多“神来之笔”。“机械人”故事给我们的启示是多方面的。


    首先，无论出于娱乐之意还是好奇之心，人工制造“类人”之物是古已有之的人类理想，诸多愿望的实现需要漫长的时间，远非个人生命可比；

    其次，人们关注的往往是“机械人”的表现，是一种行为模拟，这样的行为是否有与人类自身一样的生理机理则可另当别论；

    再者，这样的机械，并不需要都是由类人之物构成，内外有别，主次有分，是“生”和“物”的结合。


    往事越千年，生命无所息，历史在时空隧道中前行。1939年，为制造一台能解含有29个未知数的线性方程组的机器，诞生了以制造者名字命名的一台完整的样机ABC（Atanasoff-Berry
    computer）。这是电子与电器结合的机器，电路系统中装有300个电子真空管执行数字计算与逻辑运算，用电容器来进行数值存储，数据输入采用打孔读卡方法，还采用了二进位制。1946年，莫奇利（J.W.Mauchly）和埃克特（J.P.Eckert）设计制造了电子计算机ENIAC［7］。他们用掉18
    800只晶体管、70 000只电阻、1 500个继电器、6 000多个开关。该机耗电150千瓦，占地167平方米，总重30吨，每秒运算5 000次［8］。由于申请了专利，该机长时间里被宣传为首台电子计算机。有“计算机之父”之称的约翰·冯·诺依曼（J.von
    Neu mann）参与其研制，他为现代计算机提供了基础结构，使我们今天所熟知的计算机原则概念化和清晰化。现代计算机理论先驱则是巴贝奇（C.Babbage）。具有讽刺意义的是，计算机的进化与人类智能的成熟方向相反［9］。


    ## 1.2 杰出思想


    人工智能的研究方法通常被概括为符号主义、联结主义和行为主义几种。符号主义又称逻辑学派、心理学派或计算学派，也是最初和最经典的方法。它以纽厄尔（A.Newell）和西蒙（H.A.Si
    mon）提出的物理符号系统假设为基础，从逻辑的角度看，它是符合人的一般思维过程的，由此可言，这是脑内过程的一种映像方式。从家用电器如电冰箱、空调器到飞机、列车的控制，都有根据预先确定的原则实时调节或逐步执行的过程，它以规则推理为基础，然而针对不同领域的问题，规则的来源、验证和刻画都有其难以克服的问题，比如人的有些经验往往言说不清，有些具有不确定性，要让机器了解这样的内容会令其不知所云，此时的推理，难免有不可靠或束手无策之窘。


    联结主义则从人的大脑神经系统结构出发，研究分层的、互相联结的简单神经元的集群信息处理模型、能力及表现。1943年麦克卡洛奇（W.S.Mc Culloch）和匹茨（W.H.Pitts）宣布，大脑中每个神经元都是一个简单的数字信息处理器，而大脑作为一个整体是一种形式的计算机器，它们被称为人工神经网络、神经计算仿真学派或生理学派。以前的人工神经网络通常是三层模型，21世纪以来，相对于经典结构而言的深层神经网络得到广泛研究与应用。


    行为主义又称进化主义或控制器学派^([\[2\]](#txt002.html#footnote_content_txt002_2))，其原理为控制器及感知——动作型控制系统，从行为心理学出发，研究其在与环境的交互作用中表现出来的智能，更加类似于生物系统。例如，布鲁克斯（R.Brooks）研制的机器人Herbert（以西蒙的名字命名）以麻省理工学院人工智能实验室的办公室和工作空间作为自己的环境，在桌子上搜寻空的软饮料罐子，把它们捡起来并带走。机器人要越过某些障碍，可以通过普通的红外线感知，日益普及的家用机器人吸尘器就借助于此；也可利用全球定位系统分析，如军事机器人。但一方面行为与智能不在一个层面，行为作为智能的表现可以部分地对应或映像智能；另一方面，行为与环境密切关联，对环境的感知和建模是随之而来的问题。


    取各种方法的优势使之融合、互补是可取的路径，而要统一不同的路径和方法使之“一体化”，无论从实践探索的积累，还是理论基础的沉淀角度看，都为时尚早。纵然“没有理论的行动，是盲目的行动”，就人工智能发展现状而言，更重要的是“没有行动的理论，是空洞的理论”。17世纪莱布尼茨（G.W.Leibniz）提出最初设想，19世纪布尔（G.Boole）奠基、弗雷格（G.Frege）完善，20世纪初被怀特海（A.N.Whitehead）、罗素（B.Russell）和哥德尔（K.Gödel）集大成的数理逻辑，是经典人工智能的理论基础。


    1955年纽厄尔、西蒙在肖（J.C.Shaw）的协助下开发了“逻辑理论家”。这个程序能够证明罗素、怀特海于1913年出版的巨著《数学原理》中前52个定理中的38个，其中某些证明比原著更加新颖和精巧。王浩在数学定理机械化证明方面做出了重要贡献，他设计了一个程序，用计算机证明了《数学原理》中几百条有关命题逻辑的定理，提出了“数学机械化”。吴文俊后来在该领域做出了一流工作^([\[3\]](#txt002.html#footnote_content_txt002_3))。人工智能被提出20年后，雷纳特（D.Lenat）的博士论文讨论了如何发现初等数学中有趣的待证明的定理而不是定理证明程序的问题［10］。2009年4月，美国《科学》杂志发布了施密德（M.Sch
    midt）和利普荪（H.Lipson）开发的能从实验数据中发现物理定理的程序的消息，即对其分析形式施加最小约束而发现存在的自然关系［11］。具体地，只要事先加载一组简单的基础数学函数和要求其分析的数据，该程序就能够在输入的数据集中辨别相关因素，从各种可能的解释中精选出有希望的少数几种，然后生成描述它们之间关系的方程。例如，由实验得到位置和速度数据，通过搜索可收敛于能量守恒定理，而不需要预先知道物理学知识。尽管这样的工作能以数学形式表达与物理定理相应的方程，但依然面临证明和解释的挑战，也没有回答是否发现了新定理。新定理的发现，建立在敏锐的眼光、全面的把握和有素的训练基础上。训练支撑把握，把握锻炼眼光，它们也都有赖于经验。


    冯·诺依曼与图灵（A.M.Turing）是20世纪两颗科技巨星，他们深刻地支撑、推动了计算机及其基础上人工智能技术的发展与进化。古人强调人之立德、立功、立言“三不朽”，大致对应影响（包括人品）、事功（包括组织）、思想（包括理论）三者。


    影响上，美国计算机协会所设世界计算机领域最高奖以图灵命名，图灵还是英国广播公司（BBC）评出的“二十世纪最伟大的科学家”（候选人是爱因斯坦、居里夫人、屠呦呦和图灵）；有多项诺贝尔经济奖则与冯·诺依曼的“博弈论”有关。


    事功上，冯·诺依曼的计算机体系结构设计^([\[4\]](#txt002.html#footnote_content_txt002_4))受到图灵提出的关于计算的原则的论文的影响，沿用至今。图灵对计算机的实际发展做出过重要贡献，他了不起的实际工作是“二战”时期破译“纳粹”德国的军事密码，使得“二战”提前结束。


    思想上，“图灵测试”（见本节稍后）更大意义上是具有哲学色彩的讨论话题，现在看来其于人工智能技术发展尚未见实际指导意义（即未必以其作为人工智能系统能力的衡量原则），人工智能一直在努力模拟人脑机能，不会因为达到某个阶段而止步。


    图灵也受冯·诺依曼的影响，冯·诺依曼1935年讲授后来在“图灵机”中得以体现的存储程序概念，他是20世纪最杰出的数学家之一，也是伟大的思想家，兴趣甚广，影响超出计算机、人工智能范畴。关于人工智能，他也有基础性的论述，未完成稿在他去世后以《计算机与人脑》为名出版，第二版序言认为他是心智领域的牛顿［12］。


    据王浩写的《哥德尔》，在普林斯顿，爱因斯坦之外哥德尔周边还有冯·诺依曼、图灵等。香农（C.Shannon）在一次访谈中曾说在普林斯顿遇到过爱因斯坦、哥德尔、冯·诺依曼，但他们未必记得遇到过他。冯·诺依曼引用哥德尔定理并称赞其超越他人的工作。哥德尔一方面曾“反驳图灵把人心与机器等同看待的论点”［13］；另一方面，强调他的不完全性结果“丝毫没有给人类理性的力量设立界限，而只是给数学中纯形式体系的潜能设立了界限”。这话不点名地批评了图灵。但“他认为1936年图灵的工作是自己有关形式化局限性工作的一大补充与完成”。［13］


    人工智能最早的奠基工作是由图灵开展的，他认为，无论对于机器还是人脑，外在行为就是标准，而语言的唯一作用就是实施这种标准。如果机器能够完全模仿大脑的外在表现，那就没有必要关心它的内部是怎么做的，机器就是在做算术、下棋、学习和思考［13］。1950年图灵在论文《计算机器与智能》［15］中描述了人工智能的前景。这篇论文后被改名为《机器能思维吗？》。换句话问，就是计算是思维的一种形式吗？进而的问题是，机器能否通过表征智能行为的测试，这就是后来被人们津津乐道的“图灵测试”。


    那是一个模仿游戏，参与者有：一个询问者（C），一个男人（A），一个女人（B）。C与A、B通过隔离的房间进行交流（例如用键盘打字使其在屏幕上显示）；除此之外，3个参与者没有其他接触方式。询问者在游戏中的任务是，通过提问来确定A和B之中哪个是男性。A在游戏中的目标是使C做出错误的判断。而对于B，则是要帮助询问者。对她来说，最好的策略可能就是如实回答。


    如果在这个游戏中用一台机器来代替A，会出现什么情况？在这个游戏中一台计算机模仿一个人（男或女）。C的任务相应改变为判断A和B之中哪个是计算机。为了完成这个任务，询问者可以问任何问题。而计算机尽一切手段使询问者判断失败。在这种情况下（计算机模仿人）做游戏时，C做出错误判断的次数，和他同一个男人和一个女人做这个游戏时一样多吗？


    一旦计算机在模仿游戏中的表现和人在游戏中一样好，那么测试就通过了。“图灵测试”是一种特定的智能测试，即言语智能的测试，这要求计算机具备常识。后将谈及的大语言模型在诸多方面自然而然地可以通过“图灵测试”。


    此后，图灵指出“机器能够思维吗？”这个问题是无须讨论的。1952年，“图灵测试”进一步修改为，询问者每次询问一个参与对象，有时候是人，有时候是计算机。这就是说询问者并不能事先知道计算机和人的比例。这个方案被于1991年开始的一年一度“图灵测试”竞赛采用，该竞赛也被称为侃大山程序比赛，它承诺授予第一个通过本版本的图灵测试的程序10万美元的奖励［16］。


    此后，不断有系统“通过”“图灵测试”，实际上，“图灵测试”的场景、对象应该有客观、标准的界定，而测试者也应是深刻理解“图灵测试”^([\[5\]](#txt002.html#footnote_content_txt002_5))的本意者；通过一定规模的“测试”是一回事，真正具备人的智能是另外一回事，前者只是后者的一个子集。


    ## 1.3 乐观预言


    这样的计算机的问世，标志着人类用机器模仿自身思维和智慧的新开端，使人工智能研究有了强大的支持。从此以后，人们怀抱着与日俱增的热情和兴趣研究和使用计算机，并在认识自然和改造社会的活动中得到了丰硕回报。在这样的行为背后隐含着如下动机：人们期待着计算机能像人类那样处理问题和认识事物。然而在相当长的一段时间里，计算机给人们带来的恩惠主要在于替代人们进行大量而复杂的数值计算和数据处理。电子计算机本身以超越预期的速度发展了10余年后的1956年，“人工智能”诞生了［17］。那年6月，在美国达特茅斯（Dart
    mouth）学院由麦卡锡（J.Mc Carthy，1971年度图灵奖获得者，人工智能语言LISP的发明人）、明斯基（M.L.Minsky，1969年度图灵奖获得者，框架理论创立者）、罗切思特（N.Rochester）和香农（信息论的提出者）组织召开了人工智能暑期专题讨论会^([\[6\]](#txt002.html#footnote_content_txt002_6))。参加者还包括塞尔弗里奇（O.Selfridge）、所罗门诺夫（R.Solomonoff）、莫尔（T.More）、格伦特（H.Gelernter）、纽厄尔和西蒙（中文名：司马贺）（后两位共同获得1975年度图灵奖）。


    西蒙认为：“在发现符合经验数据的规律之前，必须拥有适当的数据，这些数据看起来好像是由一个平滑的数学函数所生成的”。［17］这是有赖于机器的智能活动，人工智能的目标便是试图用机器模拟人类智能，上述电子计算机或者具有计算能力的设备（一般叫作专用计算机）正是这样一类机器。通过这样的探索和实践，人们可以反过来加深对智能本质的理解和认识，这同样也是人工智能的目标。本质指的是核心功能、神经机制和处理过程，迄今为止人类对智能本身了解颇为有限，对复杂的脑内过程建模为时尚早。因而，这里所说的模拟着眼于结果和效用，即外部表现，可以“殊途同归”。比如飞机是人类受飞鸟的启发而发明的，它们都能在蓝天翱翔，但飞机内部装置与鸟的体内构造并不一样。现代飞机中有大量的专用计算机在工作，它们构成一个网络环境，也具备一定的智能，比如它们可代替驾驶员驾驶。这既是从实际出发的选择，也是现实的无奈。换言之，这里只要求“弱等价”：给两个算法相同的输入会得到相同的输出，而强等价要求它们的处理过程也是一样的，或者说它们所有的中间步骤是一样的，这是更复杂的要求。


    有了计算机这样的智能模拟的载体或者智慧的物化能力，情况完全不同了。“虽然电脑^([\[7\]](#txt002.html#footnote_content_txt002_7))与人脑大相径庭，但电脑会让我们学到人脑的知识，这些知识是我们光研究人脑永远也不会发现的”［18］。这给世界的震撼是无可比拟的，现在看来，一开始关于人工智能的预言在彼时也是情有可原的。


    1957年，西蒙认为世界上已有可思考、学习和创造的机器。进一步，它们做这些事情的能力会快速增长，直到一个可预见的将来，它们能处理问题的范围将与人的心智所及的范围同样广阔［19］。


    1958年，西蒙和纽厄尔预言10年以后，数字计算机可以成为国际象棋^([\[8\]](#txt002.html#footnote_content_txt002_8))世界冠军，并证明新的重要数学定理；


    1965年，西蒙预言，20年内，机器将能做人能做的任何工作；


    1968年，毫无悔意的西蒙再次预言：“只要男人能干的工作，电脑都能干”［19］，他的预言与图灵曾经的预测比起来显得过于乐观。


    1967年，明斯基预言，一代人内，根本上解决产生“人工智能”的问题；


    1970年，明斯基预言，3到8年内，将出现具备普通人平均智能的机器。

