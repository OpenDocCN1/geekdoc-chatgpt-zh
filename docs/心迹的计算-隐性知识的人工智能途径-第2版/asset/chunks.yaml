    \n[\\[1\\]](#txt004.html#footnote_quote_txt004_1)“经验主义者”往往被指为超越理性主义、唯经验是从，历史上，无论社会实践还是科学研究，因其吃“亏”甚至吃“败仗”的事例颇多。但更多成功或行得通的道路都在不同程度上依赖于或借鉴了经验，实际上还是在于如何把握度，过犹不及。历史的经验当然值得借鉴，如何参考因人而异。个人领域经验与此（社会活动经验）不同，它们与个人经历、实践同样有关，但对象是社会，如有经验的农民、工人、指挥员等。顾准认为，社会实践中，纯粹的理性主义的判断会似是而非，经验的结论有时则更“靠谱”。\n\
    \n[\\[2\\]](#txt004.html#footnote_quote_txt004_2)笔者小时候似乎在大人眼里是个好动手“瞎弄”的孩子，比如外婆裹“小脚”粽子，笔者在旁学着弄，还蛮像，煮后也没“散架”；又一次曾在外婆种葱的大砂锅（自然是已有“纹”，坏了的）里随便放入了玉米籽，没特别指望什么。然而不多久就长出了苗，后来长到数十厘米高并结了一棵玉米穗，有惊喜感。若事先询问有经验者要注意些什么，在真正的田地里也许就能种出可吃的玉米，假如暂不考虑单位面积产量以及品质。这里绝无轻视这类农活的意思——玉米的成长更多是个自然周期，施影响于其上的，除了种法，还有环境里的各种因素。玉米种植是较为容易学习的活儿，弄好也需要经验。经验很普遍，始终引以为戒则不易，比如我们从小吃小笼包，但稍不留神依然会肉馅“飞溅”或被烫着。\n\
    \n[\\[3\\]](#txt004.html#footnote_quote_txt004_3)笔者小时候有次玩细铁丝，拿着中间、两头往下沉，于是与外婆闹，说它怎么“不直”，实际上是不懂常识：铁质物由于自重不都能如粗钢条那样笔挺。\n\
    \n[\\[4\\]](#txt004.html#footnote_quote_txt004_4)与郁教授相知于当年华东师范大学准备开展多学科交叉的认知科学研究的筹备过程中，其后有几次谈天说地、神聊闲谈，希望有深入交流的可能，未料我们的研究有其研究的“默会知识”这条具体而明确的纽带。2012年深秋“知识与行动”研讨会准备期间他抬爱邀请。笔者一直想从哲学工作者那里得到人工智能研究的方法论启发，但多年过去，已渐“麻木”。后来郁教授要笔者在会上做个报告，由于能讲的很技术化，唯恐不登哲学雅堂，郁教授又诚恳再提。2023年春，又一次应郁教授之邀前去交流，交叉学科交流效果多非同一般。\n\
    \n[\\[5\\]](#txt004.html#footnote_quote_txt004_5)向杨治良教授请益时获告。\n\n[\\[6\\]](#txt004.html#footnote_quote_txt004_6)有同学说高二没解出的题到高三忽然就做出了，那是否是隐性知识的作用？对照关于隐性知识的内涵，回答是否定的，高二、高三学的是不同知识而不是一直面对同样题目，时间也不长，况且做题这事，这时不成、那时成了的情况蛮多，可能是受到了某种启发。\n\
    \n[\\[7\\]](#txt004.html#footnote_quote_txt004_7)诸葛海教授与笔者的一次微信讨论。\n\n[\\[8\\]](#txt004.html#footnote_quote_txt004_8)徐冬溶教授觉得可能定性和定量之间有个匹配问题。一般人看书学不会还需要亲身体验，应该就是一个校准（calibration）过程。书上即使能描述清楚，也只是个相对偏定性的概念，比如说用力30牛顿，各人还是不知道到底到多少，应该怎样算是30牛顿。但是有些内容好像是无法描述的。\n\
    \n[\\[9\\]](#txt004.html#footnote_quote_txt004_9)有次笔者给一位博士生谈一个移动终端应用的模式分类问题，笔者让他用正在学习的神经网络做试验，他说样本少，不能学习，只能用一一比对方法。笔者说，如果一万种模式，每次都一一比对，速度很慢，现实吗（先不谈如何正确地比对的问题）？他说，神经网络一样慢。笔者说，这是忽略学习的作用导致的结论：学习就是训练和记住模式而不是临时一一计算（先不谈如何很好学习的问题），这是效率的保障，是“智能”的主要来源，理论上的优势不用赘言，实际如何当然需要尝试。由此可知，有时要让大家理解学习这个基本概念也非易事。笔者有时为了省时间、提高效率，将问题凝练后给大家，但大家往往抓不住本质问题而对枝节追根问底，到头来只是兜了个圈子。人从经验中学习也不习惯，何况计算机。\n\
