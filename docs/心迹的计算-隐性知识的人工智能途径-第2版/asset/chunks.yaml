    点起始的不同数据），于是有 9 个不同的分类结果，取回归输出值的平均作为最后的输出，记为`CNNR2`（只取一个起始点的数据记为`CNNR1`）。表 4-2
    是两者的比较［29］，数据及其意义在后节一起讨论。


