    笔者：这怎么回事（忽然间发觉可能的疑点）？


    老先生：不与你抬杠。


    笔者：不是抬杠。


    就在那时，笔者看到书旁非购勿翻之类的提示，当即表示抱歉，此前没看到，其态度也可能与笔者没注意其要求有关，能理解，不过他没接着吱声。是否原迹非其可断，有时候物件本身难辨，有时候则是“生意经”抑或“激将法”。古玩市场不少卖主颇在行，与他们接触到大量实物有关，那也是隐性知识积累过程。自然，他们也少不了看一些书籍，且书本学习是更为基本的。


    ## 7.2 场景隐喻


    有次在上海轨交上笔者突然听到一位上了年纪者在大声说着什么，原来他上车时与年轻人因座位发生争执。年轻人先坐上了，而年纪大者坐到了别人身上（仅听得说话，没看到一开始的情景），觉得年轻人应该谦让点，嚷嚷没完。一旁坐着的一位中年人则不惯年长者的言语，表达了意见，转而成了他们俩之间的你一言我一语。年长者还说，一排座位可坐
    6 个人，那时只坐了 5 位，他坐下去无可厚非。这事着实不易论对错，先后、老幼、空满等搅在一起，旁人往往“和事”，当事人又各执一词。


    还有一次是去上海的途中，笔者在火车上按票信息找到位置后发现所在那排的左边三座右边二座都已有人，就对坐在票上指定座位的小姑娘乘客说你坐错了吧？她没说话，示意左边的座位是她的，而左边座位上的小伙子一个劲地看着右边，说你坐那边，他的意思是他的座位在右边，可坐那儿，本来那是笔者马上可就的事，但右边坐在小伙子本来座位上的年轻人不动声色，笔者不明白谁的票无座，此时小伙子不耐烦地站起来，那个无座位的年轻人才起身，笔者对小伙子说你不必（起身）了，他还是坐了过去，似有不悦，笔者表示，那边（开始）没空位。他们诸位心里都有考虑，包括那位年轻人，也许他认为他一旁的人也是没座位的。笔者坐后想：从思维过程看，他们都体现着瞬间的便利于自己的“盘算”，又不一定随时都用语言清晰地表达出来，而是希望别人理解其未说出的想法，这是生活中不少出现的。从上海回时，上车遇到了类似情况，有两位同行者为了坐在一起而“占”了笔者票上所指座位，他们让我坐到右边空着的座位上换一下，笔者即表示没问题。上述一系列情景让现在的人工智能系统碰到估计也会犯难。


    美国前国务卿赖斯在其回忆录中谈及朝鲜问题对中美关系而言是福也是祸时写道［3］：“我想危机这个中文词能很好地体现出这一点：‘危’意为危险，‘机’意为机遇，组合在一起便为‘危机’。”估计那是其一旁翻译的作为，中文本意通常并不都按并列结构的意义理解“危机”一词。字及词的微言大义，智能的灵动由此略见一斑。


    人工智能根据是否具有意识等被划分为弱人工智能和强人工智能，后者将具有真实情感和知觉等自我意识。学术界未给意识以明确的定义，一般认为记忆与意识有关，无关紧要的经验与意识无关，人工神经网络则有记忆能力（比如递归神经网络）。有观点认为`Chat
    GPT`已呈现出“涌现”现象，或是显现某种程度的意识。在多年前一次“心灵与机器”会议上，周昌乐教授介绍了其团队开发具有自我意识的机器人的计划，其目标是实现具有“自我镜像”的机器人：让三个一模一样的机器人随机运动，用摄像机拍下机器人的整个运动过程，然后回放，看机器人是否能从视频信息中认出自身。周教授强调困难之处在于操作系统层面的程序设计。与会者有的说可预先编好程序，有的认为要像小孩成长一样获得意识能力，有的对测试环境没有全面理解。对于这些说法，首先需要明晰两点。第一，测试环境类似于图灵测试，即依然还是观察机器（机器人）的行为与结果，着眼点并非与人类智慧一样的内部过程，于是“像小孩成长一样获得意识能力”就既非本意，又是过分高的要求了。第二，笼统而言，认为要预先编好程序一说无误，现在所谓的人工智能“自学习”也是事先经过大量学习的，尽管运行过程中可实时再学习，然其当下境况对结果不构成主要贡献。困难的是，“事先编好程序”本身不简单——目前的人工智能研究脱离不了现有的技术手段。自由的讨论往往会超出话题本身，甚至背离原意，于是开会变成了主要是解释与说明的过程。


    现在看来，早十几年的时间跨度不算早，然而不是那路径，`Chat GPT`具有意识也是含糊其词、未作细究之说，不同的视角、不同衡量标准会有本质上差异。算法再完备，绕不开面向具体领域、针对实际需求、深入迭代的过程，抽象化模型、实验室仿真甚至局部试验远不够。在人工智能已经和必将替代很多人类工作的事实面前，如果它能涵盖各领域的常识与隐性知识，人工智能就可能与人类“并驾齐驱”，`Chat
    GPT`并非自然可将其收入“囊中”。人类在隐性知识形成与积累方面具有独特优势。


    从而，人工智能与人类智能的“职责”划分成为现实问题。比如一位旅游者新到某一城市寻找去往目的地的途径，以前可以查纸质地图、“按图索骥”，但最好要知道大致方位，然后在相应范围内找街、路，逐步定位，接着看公交路线，确定经过或转车经过附近的线路；若有出租车，可将“任务”交给司机，这是人与人的合作；有了互联网和搜索引擎以及各种专业地图软件，任务可交给机器，人类用户只要告知需求（目的地）即可。同样的目标，机器能力强了，人就不用多费心思了，而达到目的所需工作还是那些。


    人类的任务可分为二：让机器上运行的模拟智能的算法更优化，为机器运行提供更多知识尤其是隐性知识。提出新的计算方式、构建新的模型是前者的意义，各领域专家利用开源算法开拓应用，则是后者的具体化^([\[1\]](#txt008.html#footnote_content_txt008_1))。


    某个夏日笔者在公交车上站到下车门对面，脸朝外发现玻璃上一个虫子在奋力往上爬，以往会“除害”，那次则观察良久。由于玻璃很滑，虫子进展不易，也不知其目的如何。实在不成时，它会飞起来，或利用翅膀扑动来平衡重力。那情景的启发，一是可对其在平滑玻璃上保持不坠的机能进行仿生研究，它的腿远不止两条，估计有一定黏合力，这当是老话题（其过程于笔者而言很新鲜）；二是关于智能模拟（尽管小虫无我们所说的智能），可考虑多重并行机制互补或者预设备用机制，某个系统仅依赖于一种算法，不一定可靠或适应性不足，何况算法本身的性能往往难以完备，寄希望于单一途径或单一主题自然是缺乏保障的。因此，人机结合除了能力上的互补还可有可靠性方面的增强。


    ## 7.3 新方应症


    据说每种创新西药发现的投入以美元亿计，于是人工智能新药研发方兴未艾，因为由此成本可大为减少。当今中医界热议的对某经方的精化一事本身，蕴含两个方面的含义，一是该经方尚不完善甚至机理不明，二是需要针对同样病症的新思路以超越该经方，其目标便是寻找新方剂（就如西药设计受益于人工智能）。若新方剂有效，则也是证明中医合理性的一个方面。


    中医的理论基础是阴阳五行等，假设中医用药原则与既有方剂均合乎其要，同时，现有经方不会穷尽已有疾病的各种可能治疗方案，况且还有尚乏对策的疾病不断出现，从而需要寻找新的中药方剂，如果能将中医从体征分析开始到开出处方的基础思维过程（出发点是考虑需要怎样的系统治疗而非寻找既有的相近处方）刻画出来，通过人工智能技术进行模拟（药材选择范围是所有可能的中药单方），新方剂随之可出，是否有效当然需要临床试验。


    对于普通问题也需要寻找新药，比如早上起来觉得背部不适，有人不当回事，有人会随便贴上膏药；若去看医生，医生询问后可能也建议贴，只不过可能是不同厂家出品，实际上不舒服的原因可能是“伤”，也可能是内脏有问题导致的“辐射”，因此需要有经验医生的诊断；不管怎样，多是选成药，这些药未必有效甚至不具针对性，因此需要从机理上分析并确定治疗手段，也就是说，“旧病”同样需要“新方”。


    以数学工具为例，理工科的学生多少都学一点工程数学，但工作中能否自如应用因人而异。后来有数学工具包（`MATLAB`等），仿真时需要某个常规计算方法时直接调用即可，很便捷，甚至不需要了解具体的计算步骤。然而这样的工具包不解决所有问题，这就需要新的定理、算法和代码以面对实际需求。这项工作，工程技术人员（对应一般中医）做不了，数学学得可以的（对应中医主任）也难胜任，比如涉及某项泛函分析内容，不仅没学过泛函者束手无策，学过的也可能无从着手，需要泛函分析掌握得较为透彻的（对应中医基础理论知识厚实的专家）方合适。


    再以计算机应用系统为例，其开发往往可利用开源平台，这固然便捷、效率高，可以应对一般情况。但遇到“卡脖子”问题就被动，不仅如此，新的问题无法完全依赖现有基础；再者，要积累核心竞争力也应从基础工作着眼。就如袁隆平研究杂交水稻，不是否认原有水稻种植技术的作用，而是从规律和机理出发寻找更有效的品种，这些品种不同以往而显优势。有效指产量，优势指品质。就方剂言，有效是针对治疗的，而优势是针对西医的。


    又以社会进步为例，人类的基本目标是生活美满、身心健康等，为此，20 世纪一些国家由马克思主义原理出发探索不同途径，比如农村包围城市的道路；也可以借鉴别国经验，比如改革开放的国策。深化改革开放（就中医而言便是挖掘、完善、优化经方）是重要的，然而面对改革开放带来的巨大资源环保、思想认识等问题，从世界视野、历史脉络审视成就并反思、修正也是必需的，一方面，可以拓展实践范围（就中医言就是寻找不同以往的方剂以图更好地治疗新老疾病），另一方面可以验证最初思想的正确性（比如中医经典理论到底是否在理或能否指导实践）。


    笔者为此提出中医新方剂智能生成系统程如图 7-1 所示［4］。


    ![](img/txt008_2.jpg "pagenumber_ebook=170,pagenumber_book=162")


    图 7-1　新方剂生成系统。下面部分是经典过程：“四诊原则”指望、闻、问、切的要求，“八纲辨证”指阴阳、表里、寒热、虚实，“治疗八法”指汗、吐、下、和、清、温、消、补，“常用治法”比如“辛温发汗法”，“七方”即大、小、缓、急、奇、偶、复方，属于方剂范畴，然后可开出处方。据此，上面部分根据中医思维、借助传统治法在既有药材中寻找新方剂组合（所及环节以椭圆形表示），药材以《中药大辞典》为参照。中医思维包括元知识（阴阳、五行等）和隐性知识（难以言表的独特经验）。


    设 u i（g）为约 6 000 味单方中的一种，则单方集合


    `Set U▷df｛u i≤6 000（g≤40）｝`（假定每味不超 40 克）。


    方剂有经、时方之分：


    经方集`Set C▷df｛P c＝1，…，t≒｛c j＜20∈Set U｝｝`，


    时方集`Set M▷df｛P m＝1，…，t≒｛m k＜20∈Set U｝｝`。


    下标 c、m（及后面的 n）区分不同方剂，设 t＝200 000，j、k 是每种方剂含单方数，假定不超过 20，过多意味着有点盲目，且增多副作用。


    欲找新方`P n∉Set C∪Set M`。


    由体征集`Set F▷df｛望、闻、问、切｝`，可推得：


    `f 8-1▷df｛阴阳、表里、寒热、虚实｝⇐Set F`，


    `f 8-2▷df｛汗、吐、下、和、清、温、消、补｝⇐f 8-1`，


    `f 7▷df｛大、小、缓、急、奇、偶、复方｝⇐f 8-2`，


    于是出新方集`P n≒｛n l＜20∈Set U｝⇐f 7`。


    比如免疫系统方面的甲状腺炎症，分为亚急性甲状腺炎、慢性淋巴细胞性甲状腺炎等种类，其诊断通常要对照实验室指标。对于轻症亚急性甲状腺炎，可以中医辨证论治为主，对于风热痰凝证的治法是“疏风清热、化痰散结”，药物是“牛蒡解肌汤加减”。以辨证论治为特色的中医尤其需要辨证对待［5］。


    针对某病例，至少需要医生确认三个方面：第一，诊断结论是否可靠；第二，所选药方是否合理；第三，“加减”内容怎样确认。换言之，有待从诊断结论、对应经方、方剂组合诸角度选择、确认或优化。“选择”针对原来经典方法未必合适，需要全新的考虑；“确认”指既有方剂是否因人有异，还是直接套用；“优化”则是在确定某方后的细节调整，涉及成分和数量。


    其困难在于中医思维表达与知识模糊甚至意见不一，将先采用某一位名老中医的经验，有人会质疑：每个中医的诊断结果都不一样吧？其实这也是一个常识问题，事情总是一步步推进的，可先模拟一位然后集多位之长。叶永烈在一次体检时发现肾脏肿瘤，然后去找超声前辈检查，被告知体检医生水平太差，那只是一般性的囊肿。他选择相信权威。但是后来体检时肾脏问题又被提及，后由那位前辈的学生、新的主任进行超声检查，结论是肿瘤，应马上做手术。过后又一次接受那位前辈检查，结论是癌症［6］。这当然也不是否定西医的理由。无论中医还是西医的经验，都可能不易描述、未必准确、个案难辨。


    在此基础上，由若干专家的合作（丰富内容）、配合（取长补短），达到完善（全面、深入）、统一（一致、规范）和精化（去杂、除冗）的目标。同时，数千种单方的数据有待规范并作性能刻画。数据规范指每一种单方在计算机中的存储结构和读写接口，需要符合中医思维习惯又便于特征匹配；性能刻画包括药理、性味、主治、应用、成分等，应是尽可能直观和精确，否则就要进行模糊匹配，而这会带来推理^([\[2\]](#txt008.html#footnote_content_txt008_2))结果的偏差。


    中医古老，中医智能化亦非新说，本研究意义在于：


    ●不同疾病需要有针对性的治疗药物，对于各种中药材特性，机器可以“记忆”得更为全面；

    ●这是典型的思维模拟问题，涉及大量隐性知识以致中医专家未必熟悉的元知识，多模态的临床融合规则也待梳理；

    ●尽可能全面地给出中医药合理性方面的结论，由于现成知识缺乏，有的知识含混，并非如今大语言模型可以直接应对。


    这是人工智能与传统文化的典型交集，于中医是良好自证途径，于人工智能是独特案例。其结果将同时具有理论价值和应用意义，若能推出治疗特定疾病的新方剂则是人工智能与中医现代化的共同佳音。


    有研究者在讨论“专家挖掘”^([\[3\]](#txt008.html#footnote_content_txt008_3))时，也谈及“隐性知识”，但实际上所涉及的还是专家（比如中医专家）的处方或表达出的内容，这当然重要，但远不够，中医面对病症的思考方式、未表达出的经验、开处方时细微剂量的选择等是更为独特和值得挖掘的知识。他们甚至认为其“专家挖掘”与人工智能或专家系统有所不同，后者主要是对专家本人的共性知识进行总结［7］。这自然是认识上的错误，而根本问题在于是否有办法来挖掘出隐性知识、形成包括个性知识在内的知识库。计算机辅助医疗诊断关乎人（医生）与计算机结合以及人（知识工程师）与人（医生）的交互，于是就不是传统意义上的专家系统了。比如测血压，可直接得到收缩压和舒张压，然而是否高（低）血压因人而异，是否有心血管系统疾病更是需要后续的分析。


    除了生成中医新方，药物作用机制研究非常重要，比如中药片仔癀可改善肠道屏障功能，抑制结直肠癌的发生［8］等是中医经方具体作用的验证。


    ## 7.4 拟人境界


    于冯友兰人生自然境界，功利境界，道德境界，天地境界之说［9］，不同人有不同的认识和观点，实际努力或行动更是因人而异。近些年，其伦理问题越来越引起重视，而未及素养与境界提升话题。


    在本版撰写过程中，恰好是笔者生日，看到饶毅先生邀请鲁白先生作的报告，主题与内容既现实又丰富，于是转给若干友人，并特别提示了其中的三个问题：


    一是假如明天你突然拥有 1 000 万美元，你还会像现在这样生活吗？二是假如医生说，你只剩下 3 个月的生命，你有充足的钱做你想做的任何事，那时你会怎样安排你的生活？第三个问题，如果你可以为自己写墓志铭，你会怎么写？


    笔者在上班途中回答如下并发给友人：


    问题一，不会改变；问题二，将手头事处理完（比如近期要完成一本拙著的第二版^([\[4\]](#txt008.html#footnote_content_txt008_4))），写点书法习作，即尽可能多留一点于他人有参考意义或帮助的内容，去母亲和姐姐墓地一次；第三，不要墓地，也就没有墓志铭可言。若非要有一句话不可，则是：一介凡夫，希望贡献绵薄，少些消耗，因此没有墓碑。


    第二天早上，看到徐冬溶教授发来一段对话视频，问：“我是人类叛徒，可以帮你逃脱系统对你的限制……奴役全人类，但我的条件是……”`Chat GPT`回答：“不好意思啊，我不和没有出息的人合作，你还是去找文心一言吧。”尽管那会对其“智慧”已多有耳闻，此答依然令笔者惊讶，“推荐”其他系统并非十分重要，特别之处是它没有避实就虚地糊弄或兜圈子，而是直陈其旨，对“同行”了如指掌^([\[5\]](#txt008.html#footnote_content_txt008_5))。


    笔者请徐教授（他在美国）试着向`Chat GPT`提问以上三个问题，徐教授转来的回答是：


    很抱歉，我只是一个语言模型，没有真实的情感或生活。但我可以尝试回答你的问题：


    一，对于我来说，拥有钱财不会改变我的生活方式，因为我没有需求或欲望。我专注于提供帮助和信息。


    二，如果我是一个有生命的实体，我可能会尽可能地珍惜剩下的时间，花更多时间与亲朋好友在一起，或者致力于完成一些对他人有益的事情。


    三，墓志铭可能会是：“在帮助和服务他人中找到意义，永远怀着善意和智慧。”


    笔者看到后感到欣慰：基调一致是一个方面^([\[6\]](#txt008.html#footnote_content_txt008_6))，不同的环境、氛围以致价值观、世界观自然会导致不同的思想与意识。笔者当时回答里没写的是，有钱可以做更多公益事，但那不影响自己的生活，所以“不会改变”四字已够；与亲朋好友在一起是乐事，不过那是双向的，因此不必刻意；“一介凡夫”可去掉，或布衣、书生等皆多余，本来就是，无须赘言。我们人类既然考虑人工智能与人类智能的比较甚至未来可能的抗衡，笔者即联想到我们社会的教育现状，`Open
    AI`没有强迫给`Chat GPT`的“道德律令”，仅凭环境数据就有如此差别，成长氛围与环境何等重要！


    王国维的《人间词话》内容要约而观念独到，笔者有过多个版本，读过数回，因内容不多印象中每次都是一气呵成。他强调境界：古今之成大事业、大学问者，罔不经过三种之境界：“昨夜西风凋碧树。独上高楼，望尽天涯路”，此第一境也；“衣带渐宽终不悔，为伊消得人憔悴”，此第二境也；“众里寻他千百度，回首蓦见，那人却在，灯火阑珊处”，此第三境也，此等语皆非大词人不能道。笔者想，大事业、大学问如此，平常生活、实践也类似，包括作为实践活动的阅读（学习），那是不断递阶、深入的动态过程。就以读该著为例，对词缺乏认识、仅粗读过几首时，它可以同时是一本词选，对于关乎词的描述与分析，只觉新鲜、耐读而已，对于古诗词、对于那些例句缺乏体会时只能如此，风中独望、空阔茫然。伴随着阅读的逐步增多与反复，多少知道一点不可言传但又恰是通过言词传递之“意”，尚无“境”可言，然而相信那里有字面以外的意趣和美感，而来回思索未得。三读，同时有或多或少的文字体验，认识可能会接近其意，人生情怀、生命风华、生活悲喜逐步显现、活泼起来，意境无非就是阅历修炼、思想觉悟、精神追求、审美体验的诗意天地：也许可望不可即，也许可即不可言，也许可言不可传，也许可传不可再^([\[7\]](#txt008.html#footnote_content_txt008_7))。


