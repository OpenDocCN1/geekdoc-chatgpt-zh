    ## 1.3 递归结构


    有反馈的动力系统与无反馈的前向系统相比有其优点，对于某些问题，一个很小的反馈系统可能等价于一个很大的甚至无限的前向系统。对于网络而言，可通过增加“递归联结”来实现这一想法，从而顺序行为可保留前一响应。可将其称作“上下文单元”，它同样是“隐层单元”。递归神经网络就是具有反馈的神经网络［3］，其结构如附图
    1-1 所示［4］。


    ![](img/att001_25.jpg "pagenumber_ebook=189,pagenumber_book=181")


    附图 1-1　递归神经网络结构


    设在时间`t`，输入单元接收第一次输入，上下文单元初始值为 0.5。输入单元和上下文单元激励隐层单元，隐层单元前馈激励输出单元，还反馈激励上下文单元。这构成了向前激励。递归联结固定为
    1。在时间`t＋1`，上下文单元包含恰好为隐层单元时间`t`时的值。这使递归网络具有动态记忆能力。


    在前馈网络中，隐层单元实现输入模式的内部表达。在递归网络中，上下文单元记录前一内部状态。从而，隐层单元映象外部状态和某一期望输出的前一内部状态。因为在隐层单元上的模式为上下文单元所保存，隐层单元要完成这一映象并同时表达顺序输入的时间特征。因此，内部表达敏感于时间内容，时间的影响隐含于这些内部状态中。


    设网络的外部输入为`u（k－1）∈R m`，输出为`y（k）∈R`，隐层输出为`x（k）∈R n`。又设`W 1`、`W 2`、`W 3`分别为输入层到隐层、隐层到输出层和上下文单元到隐层的联结权矩阵。


    网络在`k`时刻的输入不仅包括目前的输入值，还包括隐层单元前一时刻的输出值`x c（k）`，即`x（k－1）`。这时网络仅是一个前馈网络，可由上述输入通过前向传播产生输出，用反向传播算法进行联结权的修正。在训练结束后，`k`时刻隐层的输出值将通过递归联结部分，反传回上下文单元，并保留到下一训练时刻（`k＋1`）。


    设`f（·）`和`g（·）`分别为隐层单元和输出单元的激发函数所组成的非线性向量函数，`α`为上下文单元的自反馈固定增益，则有


    ![](img/att001_26.jpg "pagenumber_ebook=190,pagenumber_book=182")


    `f（·）`和`g（·）`可分别取为：


    ![](img/att001_27.jpg "pagenumber_ebook=190,pagenumber_book=182")


    ![](img/att001_28.jpg "pagenumber_ebook=190,pagenumber_book=182")


    递归神经网络可以说是一种较早出现的可以具有较多结构的人工神经网络。


    ## 1.4 卷积神经网络计算


    人类分层地组织概念，首先学习简单的内容，然后用它们去表示更抽象的概念，人的视觉神经系统就是深层结构的组织。深度学习的一般做法是：首先用无监督学习对深层神经网络从低层到高层依次进行训练，在优化求得某一层的初始权值后，以该层的输出作为后面一层的输入，同样采用无监督学习对该层参数进行优化，如此反复直到最高层；逐层无监督预训练后，再用监督学习对整个深层神经网络进行微调，以获得更好的分类性能。以下是深层神经网络的一种——卷积神经网络的基本内容与方法，它使用
    4 个关键的想法来利用自然信号的属性：局部连接、权值共享、池化以及多网络层的使用［5］。我们实现的融合规则推理和深层神经网络的方法［6，7］即基于此。


    ### 1.4.1 基本结构


    卷积神经网络包括两个基本结构层和最后的分类层，第一个基本结构层为卷积层，每个神经元的输入与前一层的固定局部区域（接受域）相连，输出完全由该接受域决定，其中所有神经元的权值、偏移值和计算函数都一样，与视觉形成过程比，它类似于在该局部区域提取某一特征；第二个基本结构层是取样层，每个神经元的输入也与前一层的固定局部接受域相连（不同神经元接受域不重叠），并对接受域作变换得到一个值（一般是取最大值）；最后的分类层则通常直接使用多层感知器进行分类。一种神经元只能提取一种特征，同种神经元提取的特征组成的集合被认为是一个特征面，而一般一个卷积层为了提取不同种类特征会有许多特征面。如附图
    1-2 所示，输入层是 8×1 900 的多导联心电图；卷积层 A 共有 8 个特征面，每个特征面使用一个 3×18 卷积核（表示一个输入元素个数固定，与时间和初值等都无关的单值函数），该层输出
    8 个 6×1 883（其中 6＝8－3＋1，1 883＝1 900－18＋1）大小的特征面；取样层 A 采取 1×7 取样核，产生 8 个 6×269（其中
    6＝6／1，269＝1 883／7）的特征面；卷积层 B 采用 3×12 的核，产生 14 个 4×258（其中 4＝6－3＋1，258＝269－12＋1）的特征面；取样层
    B 采用 1×6 的核，产生 14 个 4×43（其中 4＝4／1，43＝258／6）的特征面；卷积层 C 采用 3×8 的卷积核，产生 20 个 2×36（其中
    2＝4－3＋1，36＝43－8＋1）的特征面；取样层 C 同样采用 1×6 的核，产生 20 个 2×6（其中 2＝2／1，6＝36／6）的特征面，实际上是
    240 个神经元；最后两层是使用多层感知器进行分类输出。


    ![](img/att001_29.jpg "pagenumber_ebook=191,pagenumber_book=183")


    附图 1-2　卷积神经网络结构示意图


    每个输入特征面通过各自不同的卷积核映射成多个输出特征面，而组成同一个输出特征面的每个神经元与每个输入特征面的相同局部区域相连，且权值共享，但不同输出特征面的神经元权值不共享；然后每个输出特征面通过缩放操作减少神经元数量。显然，若输出特征面过少，则不利于网络学习，因为其他有利于学习的特征可能被忽略了；但输出特征面过多，待调整参数以及网络前向计算时间均成倍增加，不利用参数优化。因此，选择合适的特征面数就显得非常重要。在实际应用中，一般可先尝试较少个数的特征面，然后逐步增加个数，并观察所得分类模型的性能，直到得到一个前向计算时间和分类性能都较为恰当的模型。


    ### 1.4.2 网络层次


    先从一维结构来说明原理，然后再扩展为二维结构，分别对应于单导联心电图和多导联心电图数据的处理。


    #### (1) 卷积层


    定义如下参数：


    输入特征面个数：`i Map`；每个输入特征面神经元个数：`i Map Neuron`；

    输出特征面个数：`o Map`；每个输出特征面神经元个数：`o Map Neuron`；

    局部窗宽尺寸：`Window`；局部间隔尺寸：`Interval`。


    一般情况下，每个卷积层有`i Map`个输入特征面和`o Map`个输出特征面，不过与输入层相连的卷积层，其输入特征面个数为 1，也即输入层本身。


    附图 1-3 展示一般情况下卷积层的权值连接方式，输入特征面个数为 2，每个输入特征面神经元个数为 3，局部窗宽尺寸为 2，局部间隔尺寸为 1，输出特征面个数为`m`，每个输出特征面神经元个数为
    2。事实上，每个输出特征面神经元个数`o Map Neuron`为：（`i Map Meuron－Window`）／`Interval`＋1。一般要保证其能够被整除，否则网络结构就需要额外处理。


    下面针对附图 1-3 来说明卷积层权值共享情况。设`w n（i），m（j）`表示连接“输入特征面 n 第 i 个神经元”和“输出特征面 m 第 j 个神经元”的连接权值，则有：


    ![](img/att001_30.jpg "pagenumber_ebook=192,pagenumber_book=184")


    ![](img/att001_31.jpg "pagenumber_ebook=193,pagenumber_book=185")


    附图 1-3　一维结构的卷积层和取样层关系示意图


    这是对应于“输出特征面 1”的连接权值，再加上偏置`b1`，共有（8＋1）个权值；通过共享机制，实际只有（4＋1）个权值（每个输出特征面不仅连接权值共享，偏置也共享，连接权值和偏置统称为权值）。当然不同的输出特征面有不同的权值，但均只有
    4＋1 个，因此每个卷积层待调整的权值个数为：（`i Map×Window＋1`）×`o Map`。


    卷积层的计算过程同传统全连接层，区别是在同一个输出特征面中，连接权`w`和偏置`b`值均共享。设`x n（i）`表示“输入特征面 n 第 i 个神经元”的输入值，`y
    m（j）`表示“输出特征面 m 第 j 个神经元”的输出值，`b m`是对应的偏置，则有：


    ![](img/att001_34.jpg "pagenumber_ebook=193,pagenumber_book=185")


    其中`f（·）`为激励函数，例如`tanh（x）`函数等。


    #### (2) 取样层


    取样层紧接在卷积层之后，可看作是一个类似于图像缩放的过程，经典做法是等间隔取最大值或平均值。在附图 1-3 中，每个输出特征面上均有 2 个神经元，可取其输出值的最大值或平均值，这样每个输出特征面就变成了只有
    1 个神经元。以取最大值为例，其具体计算过程为：其中`x m（j）`表示“输入特征面 m 第 j 个神经元”的输入值，`y m（j）`表示“输出特征面 m
    第 j 个神经元”的输出值。取样层最大的作用是有效减少神经元个数，从而在构造下一个卷积层时，减少权值个数。


    ![](img/att001_37.jpg "pagenumber_ebook=194,pagenumber_book=186")


