  trans: '


    在人工智能的发展历程中，不少名词是对应脑功能的，比如推理、学习、思维、认知等，也出现一些新的说法，比如类脑智能。讨论问题，厘清概念是首要的，前提是这些概念出于同样体系、居于同一范畴。假如出发点不同、对象有异，同时内涵不清、外延笼统，就没有比较的基础或缺乏共同的参照。人工智能与类脑智能，是同一目标的不同阶段，还是同一对象的不同侧面？类脑无疑是智能模拟的一种途径，所以前者不通；而这两者的交汇，表明它们并非不同视角所致。人工智能的初衷就是模拟大脑，让机器能像人脑那样工作。如果不区分其提出依据及与此前其他概念的相互关系，则在知识层面可能缺乏积极意义，而在应用环节则会引起不必要的争议。


    人工智能有赖于对脑内思维机制的了解，是唯物主义，在不清楚大脑机理的前提下尝试，则是辩证法。认识论给我们从感觉、知觉到表象（心像）的基本概念，但我们需要这条线上更新的内插或外推的概念，从而可能从思辨、宏观逐步到达具体、微观的境地。而目前有关人脑的成果，或者如大脑皮层的功能定位过于宏观，难以形式化描述；或者如许多神经生理学的研究结果过于微观，时间和空间分辨率都不够，无法将微观结构与宏观结构过程之间的纽带了解清楚。


    人工智能迄今为止的工作，只能针对大脑的各高级功能分别模拟，那是系统论、还原论和局部逆向工程的结合，即区分大脑的高级功能，然后分而治之，而每个模块都可借助于以神经元功能为基础的人工神经网络，尽管这种网络的规模或复杂性也许只相当于脊椎级、视觉皮层或低等动物等。


    20 世纪 90 年代，笔者读到的一篇文章指出“人工智能需要韧性”，那会儿不明其背景和具体含义，大致理解是需要耐得住低落状况、准备长期探索，那期间人工神经网络“退热”。又十来年后，深层神经网络如前所述热起。那样的时间间隔和程度是否可反过来表征“韧性”不得而知，长期的努力则是使得其中部分问题被明确、困难得以被克服的前提。没有被清醒认识或达成共识的问题，尽管可能被冷落，也许有内在期待，而真正的持之以恒何其不易，资财、人力、导向缺一不可。


    有趣的是，仿佛有这样一条人工智能的“定理”：一旦某种思维的功能形成算法，人们就不再认为它是实际思维的基本组成部分了，而人工智能的核心任务总是指那些还未能形式化描述或编制成程序的部分。明斯基有人工智能途径“自顶向下”和“自底向上”之分，前者试图实现宏观上与人脑表现基本一致，但细节难以对应的模拟，如物理符号系统假设；后者构建一定量类似于人脑的细胞节点（神经元）及其相互联系的神经结构，如人工神经元网络。围棋软件重视强化学习，即着力模仿人类行为，从环境得到反馈，然而它还是以深层神经网络为基础，大语言模型跟随其后，或许可谓这递进的三个方面是新一代的行为主义、连接主义和符号主义。


    ## 1.7 规划五向


    悠久岁月，星移斗转，日落月明，天长地久，人们按部就班生活，循规蹈矩工作，又推陈出新研究，异想天开思考。公元纪年步入 21 世纪，人类破解心智奥秘的愿望日益迫切。2013
    年初，欧盟和美国分别宣布投入巨资启动“人脑工程”和“推进创新神经技术脑研究计划”，欧盟的工程旨在用巨型计算机模拟整个人脑，而美国的计划着眼于探索所有神经元、神经回路与大脑功能间的关系，这一计划也有助于加深对帕金森病等疾病的理解，并希望为探索心智奥秘的人工智能的进展铺砌道路。这只是人类的理想之一。2014
    年，日本也启动了大型脑研究计划。10 年后欧盟计划结束，远远未达预期。


    2017 年，国务院印发《新一代人工智能发展规划》（以下简称《规划》）。该规划牵头者潘云鹤院士指出：“人工智能经历了 60 多年的积淀，几经沉浮，特别是 2010
    年以后，随着移动互联网、传感网、大数据、超级计算等新技术的发展，人工智能技术呈现出新变化：一是从人工知识表达到大数据驱动的知识学习与推理技术；二是从分类型处理多媒体数据迈向跨媒体认知、学习和推理的新水平；三是从追求‘智能机器’到高水平的人机和脑机交互协同融合；四是从聚焦研究‘个体智能’到基于互联网的群体智能；五是从拟人化的机器转向更加广阔智能的自主系统。这些重大变化使得人工智能发展进入新阶段。”［33］其中跨媒体智能，是潘云鹤院士在其综合推理思想基础上面向新时期媒体检索与分析提出的又一概念。


    《规划》阐述的五个方向中，大数据智能自然依赖于异构、有冗余或未必一致和规模巨大的数据。社会上数据确然海量，然而依旧是一个个“孤岛”，比如医疗数据，各家医院独自拥有而没能尽其用，静“躺”在那里占了存储空间，据说即便在一个医院内部也是如此。政府似乎有规定，甚至有专门项目，但实际效果有限。另一方面，人类早已步入信息社会，信息量与日俱增，所谓“信息爆炸”已是旧词陈酿。


    大数据智能是社会现实和技术必然，不过并非智能本质，智能不一定依赖大数据，比如生活中的熟视无睹、习以为常；而人的学习、成长不都靠大数据，比如推理、演绎。


    假如人看到的信息多了，并能去粗取精、拨云见日，信息就是力量，但若不善于透过现象作分析，就可能落得人云亦云、莫衷一是以致前后矛盾地步。从生活中的医患矛盾，到国际时局的风云变幻，始终有那么多“及时”而片面的新闻，人们易于简单下结论并有了思维定式，其实不少情况下凭生活经验和基本规律就不至于被随便左右。一件事的来龙去脉、左源右序、前因后果往往不简单，要做到洞若观火、明察秋毫谈何容易，仅凭数据则难免谁“声音”大就听谁的，不是“大音希声”，而合乎逻辑的“声音”才是依据，才有价值。就如应试教育中所谓的“题海战术”，一点不做题当然不行，但终究不是上策，若能灵活应用进而纲举目张则是更高境界。


    人利用机器，机器辅助人，如钱学森致马希文的信中强调的“所谓智能机也只是人的助手而已”［34］。混合增强智能似与“人机结合”理念异曲同工，而可穿戴设备大大加强了原来仅指通用计算机的能力与范围，不同之处可能在于前者的目的是“增强”，后者则是针对具体问题，它们都依赖于数据。自主智能是基础与核心。


    社会性是智能产生与发挥作用的一个特点，在群体环境中，智能得以进化。群体智能于是成为必然的研究对象，其提出有其自然的脉络。博弈论是群体智能可参考的理论之一。生活中，比如有经验的司机脑中往往先反映出到达目的区域的一两条线路，获得结果的速度非常快，然后逐步细化目的区域的具体路线，这与机器通常的搜索并不相同。


    陈霖院士指出：“人类视觉系统却具有轻而易举地在视觉过程的初期抽提大范围拓扑性质的功能，人类视觉系统对外界图像的知觉更像是首先从大范围性质出发的，先有图形的大范围性质，比如图形和背景的关系的知觉，然后才有图形局部性质的进一步的识别。”［35］计算的难度与人的视觉系统识别的难度是相反的，或者说是矛盾的。换言之，思维不是普通的计算，而是一种高阶的计算。“视觉判断的层次是从整体性开始，越整体的越在前；先拓扑，然后投影几何，而后仿生几何，最后才是欧几里得几何。但人的逻辑思维，以及数学发展却与此相反，拓扑是几何的最新发展。”［36］陈霖院士提出的关于视觉计算与拓扑结构和功能层次模型、认知和智力较之认知的计算理论可能存在基本区别的结论极富启发意义。我们当不能指望超越历史发展阶段和技术进步水平的“指导思想”。但如古代伟大的都江堰工程，李冰父子以火烧山，极大地提高了工效，这是智慧的体现，而没有要求特殊的技术手段。


    我国学者还有许多有特色的探索。王守觉院士以半导体领域专家在晚年跨界提出高维仿生信息学理论，在院士中亦为难能可贵；周昌乐教授以理工科背景而其国学功底非普通专业学者可比，因此他也具备了研究非逻辑的禅宗辩证思维模拟等问题的独特优势；王飞跃教授的平行理论可谓人机结合思想的拓展和现实形式；周志华教授在机器学习领域的深度森林方法探索，超越了大多数机器学习的应用研究。


    ## 1.8 语言模型


    2023 年岁末《自然》杂志年度十大人物揭晓的同时还有一位非人类上榜者，即美国人工智能公司 Open AI 公司推出的“聊天”机器人软件 Chat GPT（Chat
    Generative Pretrained Transfor mer）。这个大语言模型在问世后独领风骚^([\[14\]](#txt002.html#footnote_content_txt002_14))。不少人工智能专家在自叹弗如之余指出其不足，比如仅靠数据或算力，每次训练费用巨大，回答出错，距人工智能目标还远，等等。这些评论有理而限于空泛或避实就虚。大语言模型本是一种探索，结果的出色不意味着它已跨越各个成长阶段。


    有的讨论本身是伪命题，比如说先列出“Chat GPT 无所不知、无所不能”的话题或“靶子”，然后批评之。问题在于，其开发者或推出者并没如此表示。


    这样的模型是否意味着常识问题可迎刃而解，或被包含在其演化过程中了？Chat GPT 本是学习后的结果，它能回答各类问题，如专家那样拥有丰富的经验知识，而那些知识是否涵盖各类常识，答案可以来自直接测试或基本分析，后者的结论依赖于其自身是否有积累经验的能力，就学习素材言，它学到的都是现成内容。是否有形成隐性知识的学习机制则是一个有待进一步观察的问题。


    比如中医，既有信息驳杂。人工智能所需数据应是标注过的，那才便于学习；或者是不需要标注但是自身可被学习，如一篇合乎文法的文章中句子间的逻辑关系和先后次序，而中医知识要么如其经典《黄帝内经》等主要是思想性的，要么是各流派的观念互相不一、矛盾不少，所以，数据的丰富和知识的精化是首要任务，而医学尤其是中医学习本身仅靠书本知识远远不够^([\[15\]](#txt002.html#footnote_content_txt002_15))。


    有人指出不可解释性方面的缺陷，其实这是迄今为止人工神经网络共性特点。神经网络一直是“黑匣子”，原来简单的神经网络也一样，现在层次多了，更是如此。那不妨碍人工智能的应用，就如中医的物理机理不明，但没有理由就此否定其一定方面的效果。


    另还有观点认为既然现在能够模拟海量神经元间的网络互联，于是就可以尝试解释其表征的神经活动内部过程。规模本身并不自然地意味着无数“水滴”间的微观相互作用、局部变换趋势的显式理解，就如一个万人会议上，每个人的位置、总人数是明确的，而他们间的互相影响是不确定的，他们也许静坐聆听，也许一起鼓掌，在万有引力以外，他们的表情与动作如何互为因果，他们的心灵如何“感应”，均无法把握。客观的解释尚待未来研究成果，就如临床上已普及的磁共振成像检查，背后是获诺贝尔奖的理论支撑。即便是映像逻辑思维过程的推理规则，也不见得完全对应人类的决策过程（物理符号系统假设中的“假设”隐含此意），因为那些规则可能是粗略的，也可能是概略的，前者指欠精确，后者指不够具体。人工智能的可解释性探索不限于连接主义之人工神经网络。


    对于 Chat GPT 生成的以第一人称写的标题为“我为什么写《哥德尔、埃舍尔、巴赫：一条永恒的金带》”，该书作者霍夫斯塔特指出，这篇散文与其写作风格几乎没有任何共同之处，而且它所说的内容与这本书起源的实际故事完全不符。尽管不熟悉作者写作的人可能会认为这种浮夸与谦逊的甜蜜混合体是真实的，但他认为，它与其真实声音、与书中的真实故事相距甚远，以至于它是可笑的^([\[16\]](#txt002.html#footnote_content_txt002_16))。要输出融文史知识、个人阅历、视觉感受、审美偏好和思维灵感于一体的文字依然不易。不过，总体而言，该书中给出的智能特征，Chat
    GPT 已有相当程度的呈现［37］：


    ●对于情景有很灵活的反应；

    ●充分利用机遇；

    ●弄懂含糊不清或彼此矛盾的信息；

    ●认识到一个情景中什么是重要的因素，什么是次要的；

    ●在存在差异的情景之间能发现它们的相似处；

    ●从那些由相似之处联系在一起的事物中找出差别；

    ●用旧的概念综合出新的概念，把它们用新的方法组合起来，提出全新的概念。

    ……


    大语言模型带给我们的启示良多，比如无论算力、数据还是人工神经网络结构，均可谓量变引起质变；不管乐观与否，达到人工智能目前程度的途径并非人们预设；物质与意识的关系，依然难以具体刻画，但也许意识并非如我们想象的纯粹的“精神”活动^([\[17\]](#txt002.html#footnote_content_txt002_17))。


    人工智能迄今为止的历程粗略概括如上，以登山为例，此举大致原因有三。第一，中途累了，离登顶尚遥远，暂时歇一会儿，难免回头望望已走过的路在哪里，走了多长，有多少弯路；第二，目前的位置，是否适于作为下一步登途的起点，可以直接再往上攀，抑或需要琢磨一下从何处起步更合适；第三，既然已经走了一段，我们的选择就不同于在山脚下时那样不知深浅、意气风发。这些无非就是“以史为鉴”。


    ## 1.9 本章概要


    人工智能各个学派、不同思想指导下实际系统的若干里程碑如图 1-1 示意。


    ●人工智能的发展由杰出思想奠基、乐观预期开篇和曲折发展贯穿，成果非凡，也许当下依旧“乐观”；

    ●三大学派是对以往工作的认识与总结，系统论、还原论以至逆向工程是较为笼统之说，期待良好的方法论；

    ●预先规划是人类经验总结，也是很多事业正确前行的保障，然而人工智能的发展似乎难以循此突破。


    ![](img/txt002_2.jpg "pagenumber_ebook=40,pagenumber_book=32")


    图 1-1　人工智能里程碑：一方面，先是定理证明（不需与环境交互），接着是搜索引擎面对的知识（信息）量陡然猛增，尽管交互内容很简单，只是一个词或一句话，再到自动驾驶（开放环境），然后是围棋程序（依赖于对两者交互后的棋局的判断），以致蛋白质结构预测、大量新材料结构的发现。另一方面，迅猛迭代的大语言模型，既有广泛的知识，又处于动态的开放环境当中，对话流畅、能力出众，进而是能够根据提示词模拟真实世界的
    Sora（文生视频），其进一步的呈现与发展为世人所热切期待。


    后续两章在人工智能背景下讨论思维科学与知识学习话题。


    路当平处能持重，势到穷时妙转移。

    只惜功多人不见，艰难惟有后人知。

    ——俞樾《舟中三君子诗·舵》


