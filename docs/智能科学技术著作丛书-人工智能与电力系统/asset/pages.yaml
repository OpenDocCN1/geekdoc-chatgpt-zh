- pgno: 197
  md: '束条件进行描述。


    # 1) 设备运行约束


    能源转换设备的输出功率约束如下。


    # (1) CHP 运行约束：


    $\underline{P}_i^{\text{CHP}} \cdot I_{i,t}^{\text{CHP}} \leqslant P_{i,t}^{\text{CHP}}
    \leqslant \overline{P}_i^{\text{CHP}} \cdot I_{i,t}^{\text{CHP}}$  (6.51)


    式中，$I_{i,t}^{\text{CHP}}$为第$i$个CHP机组在$t$时段的安装状态，是一个0-1变量，0表示该装置未源于枢纽中，1表示该装置参与枢纽运行；$\underline{P}_i^{\text{CHP}}$、$\overline{P}_i^{\text{CHP}}$分别为CHP机组额定功率的下限和上限。


    # (2) 燃气锅炉运行约束：


    $\underline{Q}_j^{\text{GB}} \cdot I_{j,t}^{\text{GB}} \leqslant Q_{j,t}^{\text{GB}}
    \leqslant \overline{Q}_j^{\text{GB}} \cdot I_{j,t}^{\text{GB}}$  (6.52)


    式中，$\overline{Q}_j^{\text{GB}}$、$\underline{Q}_j^{\text{GB}}$分别为燃气锅炉输出热功率的上限和下限。


    # 2) 储能约束


    电、热储能装置中当前时刻储存的能量等于前一时刻的剩余储能量与此时段流入、流出能量之和：


    $E_{k,t}=E_{k,t-1}+\left(E_{k,t}^{\text{ch}}\cdot\eta_k^{\text{ch}}\right)-\left(E_{k,t}^{\text{dis}}/\eta_k^{\text{dis}}\right)$  (6.53)

    $E_t \leqslant \overline{E}$  (6.54)

    $\zeta_t^{\text{ch}}\cdot\underline{E}^{\text{ch}}\cdot I_t^E \leqslant E_t^{\text{ch}}
    \leqslant \zeta_t^{\text{ch}}\cdot\overline{E}^{\text{ch}}\cdot I_t^E$  (6.55)

    $\zeta_t^{\text{dis}}\cdot\underline{E}^{\text{dis}}\cdot I_t^E \leqslant E_t^{\text{dis}}
    \leqslant \zeta_t^{\text{dis}}\cdot\overline{E}^{\text{dis}}\cdot I_t^E$  (6.56)

    $\zeta_t^{\text{ch}}+\zeta_t^{\text{dis}}\leqslant1$  (6.57)


    式中，$E_{k,t}$为第$k$个储能装置$t$时刻的储能容量；$\eta_k^{\text{ch}}$、$\eta_k^{\text{dis}}$分别为第$k$个储能装置储能充能、放能效率；$E_{k,t}^{\text{ch}}$、$E_{k,t}^{\text{dis}}$分别为第$k$个储能装置的充能、放能功率；$\zeta_t^{\text{ch}}$、$\zeta_t^{\text{dis}}$分别为储能装置充、放能状态的二元变量，两种状态仅一种可用。


    # 3) 功率平衡约束


    电、热平衡具体可分别表示为


    $P_t^p+\sum_{w\in NW}P_{w,t}^W+\sum_{i\in NC}P_{i,t}^{\text{CHP}}+\sum_{k\in NE}E_{k,e,t}^{\text{dis}}-\sum_{k\in
    NE}E_{k,e,t}^{\text{ch}}=L_{e,t}+P_t^s-\text{LS}_t^e$  (6.58)

    $\sum_{i\in NC}Q_{i,t}^{\text{CHP}}+\sum_{j\in NB}Q_{j,t}^{\text{GB}}+\sum_{l\in
    NT}E_{l,h,t}^{\text{dis}}-\sum_{l\in NT}E_{l,h,t}^{\text{ch}}=L_{h,t}-\text{LS}_t^h$  (6.59)


    式中，$L_{e,t}$、$L_{h,t}$分别为$t$时刻的电、热负荷；$\text{LS}_t^e$、$\text{LS}_t^h$分别为$t$时刻的电、热失负荷量。'
