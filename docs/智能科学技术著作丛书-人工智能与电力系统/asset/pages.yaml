- pgno: 4
  md: '# 《智能科学技术著作丛书》序


    “智能”是“信息”的精彩结晶，“智能科学技术”是“信息科学技术”的辉煌篇章，“智能化”是“信息化”发展的新动向、新阶段。


    “智能科学技术”(intelligence science & technology, IST)是关于“广义智能”的理论算法和应用技术的综合性科学技术领域，其研究对象包括：


    +   - “自然智能”(natural intelligence, NI)，包括“人的智能”(human intelligence, HI)及其他“生物智能”(biological
    intelligence, BI)。

    +   - “人工智能”(artificial intelligence, AI)，包括“机器智能”(machine intelligence, MI)与“智能机器”(intelligent
    machine, IM)。

    +   - “集成智能”(integrated intelligence, II)，即“人的智能”与“机器智能”人机互补的集成智能。

    +   - “协同智能”(cooperative intelligence, CI)，指“个体智能”相互协调共生的群体协同智能。

    +   - “分布式智能”(distributed intelligence, DI)，如广域信息网、分散大系统的分布式智能。


    “人工智能”学科自1956年诞生以来，在起伏、曲折的科学征途上不断前进、发展，从狭义人工智能走向广义人工智能，从个体人工智能到群体人工智能，从集中式人工智能到分布式人工智能，在理论算法研究和应用技术开发方面都取得了重大进展。如果说当年“人工智能”学科的诞生是生物科学技术与信息科学技术、系统科学技术的一次成功的结合，那么可以认为，现在“智能科学技术”领域的兴起是在信息化、网络化时代又一次新的多学科交融。


    1981年，中国人工智能学会(Chinese Association for Artificial Intelligence, CAAI)正式成立，25年来，从艰苦创业到成长壮大，从学习跟踪到自主研发，团结我国广大学者，在“人工智能”的研究开发及应用方面取得了显著的进展，促进了“智能科学技术”的发展。在华夏文化与东方哲学影响下，我国智能科学技术的研发、开发及应用，在学术思想与科学算法上，具有综合性、整体性、协调性的特色，在理论算法研究与应用技术开发方面，取得了具有创新性、开拓性的成果。“智能化”已成为当前新技术、新产品的发展方向和显著标志。


    为了适时总结、交流、宣传我国学者在“智能科学技术”领域的研究开发及应用成果，中国人工智能学会与科学出版社合作编辑出版《智能科学技术著作丛书》。'
