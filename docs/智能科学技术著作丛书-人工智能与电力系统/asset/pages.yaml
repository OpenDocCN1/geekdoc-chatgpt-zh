- pgno: 20
  md: '# 1. 遗传算法的生物学原理


    遗传算法是一种基于“适者生存”的高度并行、随机和自适应的优化算法，通过复制、交叉、变异将问题解编码表示的“染色体”群一代代地不断进化，最终收敛到最适应的群体，从而求得问题的最优解或满意解。达尔文的自然选择学说提出了“适者生存”，认为生物的变异、遗传和自然选择作用能导致生物的适应性改变。自然选择是生物进化的动力。生物都有繁殖过剩的倾向，而生存空间和食物是有限的，生物必须“为生存而斗争”。在同一种群中的个体存在着变异，那些具有能适应环境的有利变异的个体将存活下来，并繁殖后代，不具有有利变异的个体就被淘汰。若自然条件的变化是有方向的，则在历史过程中，经过长期的自然选择，微小的变异就得到积累而成为显著的变异。由此可能导致新种和新种的形成。遗传是指父母性状通过无性繁殖或有性繁殖传递给后代，从而使后代获得其父母遗传信息的现象。变异在生物体上泛指生物物种与个体之间的各种差异，包括形态、生理、生化以及行为、习性等各方面的不同，变异是生物进化和人类育种的根源，包括可遗传的和不可遗传的变异，由于环境影响和基因型之间相互作用，表现为种群的个体表型变异、环境变异、遗传变异，这是生物进化的一个主要因素[5]。


    根据现代细胞学和遗传学的研究，遗传物质的主要载体是染色体，基因是有遗传效应的片段，它存储着遗传信息，可以复制也可以发生突变。生物体通过基因重组、基因变异以及染色体的结构和数目上的变异，使得遗传性状得到选择和控制，由于生物在繁殖中可能发生基因的交叉和变异，将会引起生物性状的连续改变，外界环境的定向选择也提供了物质条件和基础，使得生物的进化成为可能。人们通过对环境的选择，基因的交叉和变异，这一生物演化的迭代模仿，提出了用于求解最优化问题的遗传算法。


    # 2. 遗传算法基本模型


    遗传算法直接对结构对象进行操作，采用概率化的寻优方法，能自动获取和指导优化的搜索空间，自适应地调整搜索方向，不需要确定的规则。


    对于一个求函数最大值的优化问题(求函数最小值也类似)，一般可以描述为如下规划模型：


    ```

    {

    max f(x)

    x ∈ R

    R ⊂ U

    }(2.1)

    ```


    式中，x为决策变量；max f(x)为目标函数，x∈R、R⊂U为约束条件；U为基'
  merge: -1
  img_proc: true
- pgno: 21
  md: '本空间，R 是 U 的子集；满足约束条件的解 x 称为可行解，集合 R 表示所有满足约束条件的解所组成的集合，称为可行解集合。


    遗传算法的求解流程如图 2.1 所示，求解步骤如下。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_21_0.png)


    图 2.1 遗传算法求解流程图


    +   (1) 初始化：设置进化代数计数器 t=0，设置最大进化代数 T，随机生成 M 个个体作为初始群体 P(0)。

    +   (2) 个体评价：计算群体 P(t) 中各个个体的适应度。

    +   (3) 选择运算：将选择算子作用于群体。选择的目的 是把优化的个体直接遗传到下一代或通过配对交叉产生新的个体再遗传到下一代。选择操作是建立在群体中个体的适应度评估基础上的。

    +   (4) 交叉运算：将交叉算子作用于群体，遗传算法中起核心作用的就是交叉算子。

    +   (5) 变异运算：将变异算子作用于群体，即对群体中的个体串的某些基因座上的基因值做变动。群体 P(t) 经过选择、交叉、变异运算之后得到下一代群体
    P(t+1)。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '(6)终止条件判断。若 t=T，则以进化过程中所得到的具有最大适应度的个体作为最优解输出，终止计算。


    遗传算法中初始群体中的个体是随机产生的，一般来说，初始群体的设定可采取如下策略：①根据问题固有知识，设法把握最优解所占空间在整个问题空间中的分布范围；②在此分布范围内设定初始群体；③随机生成一定数目的个体，再从中挑出最好的个体加到初始群体中。这种过程不断迭代，直到初始群体中个体数达到预先确定的规模。


    由于遗传算法不能直接处理问题空间的参数，必须把它们转换成遗传空间中由基因按一定结构组成的染色体或个体，这一转换操作就称为编码，也可以称为问题的表示。其中，步骤(4)提到的交叉运算中的交叉算子是根据交叉率将种群中的两个个体随机地交换某些基因，能够产生新的基因组合，并且期望将有益基因组合在一起。一般来说，变异算子的基本步骤如下：①群体中所有个体以事先设定的变异概率判断是否进行变异；②对进行变异的个体随机选择变异位进行变异。


    根据编码方式的不同，算子交叉方法也有所不同，如表2.1所示。


    # 表 2.1 不同编码方式下的算子交叉方法


    | 编码方式 | 算子交叉方法 |

    |---|---|

    | 实值重组 | 二进制交叉 |

    | 离散重组 | 单点交叉 |

    | 中间重组 | 多点交叉 |

    | 线性重组 | 均匀交叉 |

    | 扩展线性重组 | 洗牌交叉 |

    | — | 缩小代理交叉 |


    最常用的算子交叉方法为单点交叉 (one-point crossover)，其具体操作是：在个体串中随机设定一个交叉点，在进行交叉时，该点前或后的两个个体的部分结构进行互换，并生成两个新个体。


    评估编码策略常采用三个规范：完备性、健全性、非冗余性。


    目前几种常用的编码技术有二进制编码、浮点数编码、字符编码等。而二进制编码是目前遗传算法中最常用的编码方法，即由二进制字符集{0,1}产生的 0、1 字符串来表示问题空间的候选解。它具有简易易行、符合最小字符集编码原则、便于用模式定理进行分析等优势。


    步骤(6)中的适应度表示某一个体对环境的适应能力，也表示个体繁育后代的能力。遗传算法的适应度函数又称评价函数，是用来判断群体中个体的优劣程度'
  merge: -1
  img_proc: true
- pgno: 23
  md: '的指标，它根据所求问题的目标函数来进行评估。


    遗传算法在搜索进化过程中一般不需要其他外部信息，仅用评估函数来评估个体或解的优劣，并作为以后遗传操作的依据。因为在遗传算法中，适应度函数要比较排序并在此基础上计算选择概率，所以适应度函数的值要取正值。由此可见，在不少场合，将目标函数映射成求最大值形式且函数值非负的适应度函数是必要的。适应度函数的设计主要满足以下条件：①单值、连续、非负、最大化；②合理、一致；③计算量小；④通用性强。


    在具体应用中，适应度函数的设计要结合求解问题本身的要求而定，因为适应度函数的设计直接影响到遗传算法的性能。


    # 2.1.2 遗传算法的特点及应用场景


    遗传算法是解决搜索问题的一种通用算法，对于各种通用问题都可以使用。


    搜索算法的共同特征为：①组成一组候选解，依据某些适应性条件测算这些候选解的适应度；②根据适应度保留某些候选解，放弃其他候选解；③对保留的候选解进行某些操作，生成新的候选解。


    在遗传算法中，上述几个特征以一种特殊的方式组合在一起：基于染色体群的并行搜索，带有猜测性质的选择操作、交换操作和突变操作。这种特殊的组合方式将遗传算法与其他搜索算法区别开来。


    遗传算法还具有以下几方面的特点：


    +   1. 遗传算法是从问题解的串集开始搜索的，而不是从单个解开始搜索的，这是遗传算法与传统优化算法的最大区别。传统优化算法是从单个初始值迭代求最优解的，容易陷入局部最优解，遗传算法从串集开始搜索，覆盖面大，利于全局择优。\n2.
    遗传算法同时处理群体中的多个个体，即对搜索空间中的多个解进行评估，减少了陷入局部最优解的风险，同时算法本身易于实现并行化。\n3. 遗传算法基本上不用搜索空间的知识或其他辅助信息，而仅用适应度函数值来评估个体，在此基础上进行遗传操作。适应度函数不仅不受连续可微的约束，而且其定义域可以任意设定，这一特点使得遗传算法的应用范围大大扩展。\n4.
    遗传算法不是采用确定性规则，而是采用概率的变迁规则来指导搜索方向。\n5. 遗传算法具有自组织、自适应和自学习性。遗传算法利用进化过程获得的信息自行组织搜索时，适应度大的个体具有较高的生存概率，并获得更适应环境的基础结构。\n6.
    遗传算法本身也可以采用动态自适应技术，在进化过程中自动调整算法控制参数和编码精度，如使用模糊自适应法。


    由于遗传算法的整体搜索策略和优化搜索方法在计算时不依赖于梯度信息或'
