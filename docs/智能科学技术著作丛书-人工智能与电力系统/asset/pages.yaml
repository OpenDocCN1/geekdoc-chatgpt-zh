- pgno: 25
  md: "疫算法是全局收敛的。\n\n# 1. 免疫算法的生物学原理\n\n免疫系统 (immune system) 是机体执行免疫应答及免疫功能的重要系统，由免疫器官、免疫细胞和免疫分子组成。免疫系统具有识别和排除抗原性异物、与机体其他系统相互协调、共同维持机体内环境稳定和生理平衡的功能，是防卫病原体入侵最有效的武器，它能发现并清除异物、外来病原微生物等引起内环境波动的因素，但其功能的元进也会对自身器官或组织产生伤害。免疫系统具有以下特点：\n\
    \n+   (1) 识别和清除外来入侵的抗原，如病原微生物等。这种防止外界病原体入侵和清除已入侵病原体及其他有害物质的功能称为免疫防御，其使人体免于病毒、细菌、污染物质及疾病的攻击。\n\
    +   \n+   (2) 识别和清除体内发生突变的肿瘤细胞、衰老细胞、死亡细胞或其他有害的成分。这种随时发现和清除体内出现的“非己”成分的功能称为免疫监视。新陈代谢后的废物以及免疫细胞与病毒发生生物反应产生的物质，都必须由免疫细胞加以清除。\n\
    +   \n+   (3) 通过自身免疫耐受和免疫调节使免疫系统内环境保持稳定。修补免疫细胞能修补受损的器官和组织，使其恢复原来的功能。\n\n生物免疫系统的抽象模型如图\
    \ 2.2 所示。在免疫反应过程中，大量抗体的产生降低了抗原对免疫细胞的刺激，从而抑制抗体的分化和增殖，同时产生的抗体之间也存在着相互刺激和抑制的关系，这种抗原与抗体、抗体与抗体之间的相互制约关系使抗体免疫反应维持一定的强度，保证机体的免疫平衡。其中，抗原在生命科学中是指能够刺激和诱导机体的免疫系统使其产生免疫应答，并能与相应的免疫应答产物在体内或体外发生特异性反应的物质，而在免疫算法中，抗原是\n\
    \n![](img/2160aa82ffab89ad09fb1b4e167a298b_25_0.png)\n\n图 2.2 生物免疫系统的抽象模型"
  merge: -1
