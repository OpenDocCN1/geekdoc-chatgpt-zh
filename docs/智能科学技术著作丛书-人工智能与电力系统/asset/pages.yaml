    图 3.1 学习系统基本组成部分的关系


    在图 3.1 中，箭头表示信息的流向。环境指外部信息的来源，它将为系统的学习提供有关信息。学习指系统的学习机构，它通过对环境的搜索取得外部信息，然后经过分析、综合、类比、归纳等思维过程获得知识，并将这些知识存入知识库中。知识库用于存储学习得到的知识，在存储时要进行适当的组织，使它既便于应用又便于维护。执行与评价由执行和评价两个环节组成，执行环节用于处理系统面临的现实问题，即应用学习到的知识求解问题，如定理证明、智能控制、自然语言处理、机器人行动规划等；评价环节用于验证、评价执行环节的效果，如结论的正确性等。另外，从执行到学习必须有反馈信息，根据反馈信息决定是否要从环境中进一步索取信息进行学习，以修改、完善知识库中的知识，这是学习系统的一个重要特征[9-11]。


    # 3.1.2 机器学习算法的发展历程及分类


    按照时间追溯，从 1940 年机器学习算法兴起，在电力系统中应用广泛的机器学习算法有贝叶斯算法、决策树算法和支持向量机，其发展历程如图 3.2 所示。


