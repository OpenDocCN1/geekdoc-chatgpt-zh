    # 6.4.3 多能源系统并网模式下优化控制算法


    粒子群优化算法和禁忌搜索算法相结合的程序流程如图 6.25 所示。


    该问题将这种方法应用于多目标函数优化中，由于粒子群优化算法前期具有较强的爬坡能力，故在粒子群优化算法后期加入禁忌搜索操作。在粒子群优化算法中融入禁忌搜索算法，通过构造优化过程的禁忌列表，阻止搜索过程中出现循环并且避免陷入局部最优，达到全局搜索的目的，进而得到全局最优解，提高算法的收敛速度和收敛精度[48]。


