  md: '![](img/2160aa82ffab89ad09fb1b4e167a298b_199_0.png)


    图 6.16 基于双层优化的能量枢纽优化设计模型求解流程


    第 1 层能量枢纽系统容量优化配置结果可作为第 2 层能量枢纽系统能量分配的数据基础，第 2 层能量枢纽系统能量分配结果可为第 1 层能量枢纽系统容量优化配置进行反馈验证，通过上下层间的优化迭代最终求得全局最优解。上层采用精英保留策略遗传算法，使用自适应交叉率、突变率对遗传算法进行改进。由于下层优化变量为非线性且维数高，采用具有参数设定少、求解速度快等特性的粒子群优化算法进行下层运行优化的能量分配问题求解。算法流程如图
    6.17 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_199_1.png)


    图 6.17 双层优化算法流程图


    算法的求解步骤如下：


    +   (1) 输入系统参数及负荷数据，初始化粒子群参数。

    +   (2) 对决策变量进行染色体编码。

    +   (3) 上层规划优化，产生上层规划遗传算法初始种群，即随机产生 N 个 D 维设备容量变量组成的初始种群，令迭代次数 t=1。

    +   (4) 在下层规划优化中，对于每一个上层规划的初始种群，产生下层规划初始种群。

    +   (5) 根据下层优化模型，使用粒子群优化算法进行机组优化运行计算，获得最优目标函数值。'
