    $V(t)$ 为 $t$ 时刻燃烧天然气的体积。


    # 3. 约束条件建立


    多能源系统和大电网并网运行时，在优化运行的过程中受到机组本身或者其他条件约束，具体约束条件如下。


    # 1) 功率平衡约束条件


    多能源系统中包括电负荷、热负荷，因此系统的功率平衡约束包括电平衡约束和热平衡约束。


    # (1) 电平衡平衡：


    $e_g(t)+e_v(t)+e_w(t)+e_c(t)-e_b(t)=e_{load}(t)$  (6.85)


    式中，$e_g(t)$ 为 $t$ 时刻电网提供的电量； $e_v(t)$ 为 $t$ 时刻光伏输出的电量； $e_w(t)$ 为 $t$ 时刻风机输出的电量；
    $e_c(t)$ 为 $t$ 时刻 CHP 提供的电量； $e_b(t)$ 为 $t$ 时刻储能电池充放电量； $e_{load}(t)$ 为 $t$ 时刻系统电负荷量。


    $\begin{cases} e_g(t)=p_g(t)\cdot\tau \\ e_v(t)=p_v(t)\cdot\tau \\ e_w(t)=p_w(t)\cdot\tau
    \\ e_c(t)=p_c(t)\cdot\tau \\ e_b(t)=p_b(t)\cdot\tau \end{cases}$  (6.86)


    式中，$p_g(t)$ 为 $t$ 时刻电网购电功率； $p_v(t)$ 为 $t$ 时刻光伏发电功率； $p_w(t)$ 为 $t$ 时刻风机发电功率；
    $p_c(t)$ 为 $t$ 时刻 CHP 发电功率； $p_b(t)$ 为 $t$ 时刻电池充放电功率。


    # (2) 热平衡约束：


    $q_c(t)+q_b(t)=q_{load}(t)$  (6.87)


    # 2) 储能电池 SOC 约束条件


    SOC 为储能电池系统的荷电状态，代表储能电池当前电量。储能电池的充放电有一定容量限制，过度的充电或放电都会使储能电池寿命缩短。


    # (1) 输入输出功率能量约束：


    $p_b(t)=\begin{cases} 0 \\ -p_{omax}\le p_b(t)\le -p_{omin} \\ p_{imin}\le p_b(t)\le
    p_{imax} \end{cases}$  (6.88)'
