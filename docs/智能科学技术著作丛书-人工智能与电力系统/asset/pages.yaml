  md: '# 第 5 章 基于人工智能技术的电力

    系统监测辨识与故障诊断


    本章主要介绍人工智能技术在电力系统监测辨识与故障诊断中的应用，包括基于卷积神经网络的非侵入式负荷监测、基于马尔可夫模型的负荷辨识、基于模拟退火算法的高压输电线路故障定位、基于卷积神经网络的多端直流输电线路故障诊断、基于深度学习的电力变压器故障诊断与定位，分别在
    5.1 节～5.5 节中介绍。


    # 5.1 基于卷积神经网络的非侵入式负荷监测


    如今，对智能电网利用和需求侧管理的需要不断增长，加速了非侵入式负荷监测 (no-intrusive load monitoring, NILM) 的发展。因此，本节提出一种基于卷积神经网络的非侵入式负荷监测方法，用以描述居民的消费行为，该方法侧重于现有非侵入式负荷监测技术的有限适用性和低识别精度。深层卷积神经网络结构提高了负荷监测程序的性能，并根据各种特征将其应用范围扩展到监测过程。同时，执行事件驱动程序以准确找到设备的启停时间和状态变化，包括过零检测、电流相似性检测、阈值评估和事件电流获取、执行电流到图像的转换，表示作为卷积神经网络输入的住宅设备的特性，并提出了卷积神经网络结构，用以识别功耗和工作条件。


    # 5.1.1 基于卷积神经网络的非侵入式负荷监测方法


    +   1. 非侵入式负荷监测系统


    当前，随着智能电网利用和需求侧管理的发展，以及人们节能意识的不断提高，负荷监测方法已成为降低电网损耗的有效途径。从家庭消费者的角度来看，了解日常用电的详细信息可以引导他们养成合理的消费习惯；从供电公司的角度来看，了解消费者的行为模式有助于他们根据消费者的需求调整电能的生产、传输和存储，进而为住宅消费者提供更高质量、更高成本效益和个性化的服务。负荷监测和识别可以以侵入式和非侵入式地进行，侵入式负荷监测技术依赖于安装在单独设备上的多个专用传感器来获取其用电量信息，尽管直接测量的识别率高，但是在实践中建立传感器分布式测量网络仍然是一个挑战。与侵入式负荷监测技'
  merge: -1
  img_proc: true
- pgno: 128
  md: '术不同，非侵入式负荷监测技术仅需要在主电源服务入口处进行测量即可有效地进行功率负荷监测和识别，这种方式的安装和维护成本更低，并且对负载的接受程度更高，同时保护了消费者的隐私和便利性。现有非侵入式负荷监测系统的框架是通过数据预处理、特征提取和负荷识别构建的，从大量且复杂的电信号中提取出代表性的特征，然后将其用于模式识别算法或训练机器学习模型中。但是，现有的发达的智能非侵入式负荷监测系统仍然存在如下缺点[21]：


    +   (1) 传统非侵入式负荷监测技术的“分而治之”思想缺乏普遍性和全局最优性，可能无法从最佳特征提取器和最佳分类器中得出最高准确率的识别结果。

    +   (2) 其识别精度很大程度上取决于适当的人工制作特征。一方面，根据对先验知识的全面理解，以经验方式设计人工制作的特征是一项艰巨的任务；另一方面，在特征选择过程中降维会损失很多时域信息。

    +   (3) 在实际应用中，采集的电数据由多个负荷运行的各种状态变化组成，对于传统的非侵入式负荷监测方法，解决在扰动情况下具有混合负荷特性的非平稳信号混杂问题极具挑战性。


    随着图形处理单元的飞速发展，深度学习已被证明是一种基础的集成框架，可以解决上述问题。受深度学习端到端方式的启发，本节提出一种基于原始电流信号的事件驱动卷积神经网络架构，用于非侵入式负荷监测。


    # 2. 非侵入式负荷监测的检测方法


    非侵入式负荷监测的检测方法分为四个部分，即过零检测、电流相似度检测、阈值评估和当前事件采集，具体描述如下。


    # 1) 过零检测


    考虑到有功和无功的检测方向和计算的复杂性，电流波形作为描述家用电器运行变化的最直接电气参数，被选为这项研究的特征参数。通常，由于电力电子设备的存在，居民用电并不是纯电阻负载，并且不同设备之间的相位滞后角也不相同。因此，过零检测需要电流波形的单个周期，以便收集电流变化并估计事件的发生。


    # 2) 电流相似度检测


    一旦获得了单周期电流波形，电流相似度检测就可以利用动态时间规整 (dynamic time warping, DTW) 算法来区分每个周期内的序列变化。DTW
    算法是一种强大的相似性测量工具，可以找到两个当前序列之间的最短弯曲路径，并通过弯曲时间轴进行匹配。与传统的欧几里得距离相比，DTW 距离减少了匹配时间，并克服了需要定长电流序列的局限性，这在实际的非侵入式负荷监测数据中几乎是不可能的。


    通常假设在一个周期内 $I_p = \{i_{p1}, i_{p2}, \cdots, i_{pm}\}$ 和 $I_q = \{i_{q1}, i_{q2},
    \cdots, i_{qn}\}$ 为两个长度'
