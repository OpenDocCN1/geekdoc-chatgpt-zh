- pgno: 226
  md: "电联合调度系统，其中含 NG 台火电机组、NH 台水电机组、NB 个节点、NL 条线路、NT 个调度时段。\n\n# 1. 目标函数建立\n\n设 $C_i(P_{gi}^t)=a_i(P_{gi}^t)^2+b_iP_{gi}^t+c_i$\
    \ 为水火电机组 $i$ 的能量成本，$a_i$、$b_i$、$c_i$ 为相应参数。含梯级水电站的水火电联合调度机组组合目标函数如下：\n\n$$F(U_{gi}^t,P_{gi}^t)=\\\
    min\\left\\{\\sum_{i=1}^{NG}\\sum_{t=1}^{NT}\\left[C_i(P_{gi}^t)+S_i^tU_{gi}^t(1-U_{gi}^{t-1})\\\
    right]\\right\\}\\tag{6.97}$$\n\n式中，$P_{gi}^t$、$U_{gi}^t$ 为 $t$ 时段火电、水电机组 $i$\
    \ 的出力状态，$U_{gi}^t$ 为 0-1 变量；$S_i^t$ 为火电机组 $i$ 的开机费用。\n\n# 2. 约束条件建立\n\n系统约束为\n\
    \n$$\\begin{cases}\\sum_{i=1}^{NG}P_{gi}^t+\\sum_{j=1}^{NH}P_{hj}^t=D^t\\\\\\\
    sum_{i=1}^{NG}(\\bar P_{gi}^t-P_{gi}^t)\\ge R^t\\\\-\\bar f_l\\le\\sum_{n=1}^{NB}T_{n,l}(P_{gn}^t+P_{hn}^t-P_{dn}^t)\\\
    le\\bar f_l\\end{cases}\\tag{6.98}$$\n\n式中，$P_{hj}^t$ 为水火电机组启停状态，依次分别为负荷平衡约束、备用约束和线路安全约束；$D^t$、$R^t$\
    \ 分别为 $t$ 时段的负荷和备用；$P_{gn}^t$、$P_{hn}^t$、$P_{dn}^t$ 分别为 $t$ 时段对应节点 $n$ 的火电、水电机组出力和负荷；$T_{n,l}$\
    \ 为功率传输系数；$\bar f_l$ 为线路 $l$ 的功率上限，$l=1,2,\\cdots,NL$。\n\n机组约束为\n\n$$T_i^{off}\\\
    ge T_i^{down},\\quad T_i^{on}\\ge T_i^{up}\\tag{6.99}$$\n\n$$U_i^t\\underline\
    \ P_i\\le P_i^t\\le U_i^t\\bar P_i\\tag{6.100}$$\n\n$$U_{gi}^tRd_i\\le P_{gt}^t-P_{gi}^{t-1}\\\
    le U_{gi}^tRu_i\\tag{6.101}$$\n\n$$V_i(t)=V_i(t-1)+J_i(t-1)-Q_i(t-1)-Y_i(t-1)+Q_{i-1}(t-\\\
    tau_{i-1}-1)+Y_{i-1}(t-\\tau_{i-1}-1)\\tag{6.102}$$"
