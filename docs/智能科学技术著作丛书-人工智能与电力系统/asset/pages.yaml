    # 4.1 基于长短期记忆网络的风电预测


    新能源电力的大量上网，给电网的安全稳定运行及经济化管理都带来了不小的冲击，风电功率如何实现高精度预测及有效利用是目前研究的一大热点。结合风电功率的单点值预测和概率区间预测，可以为风电爬坡事件、电网的潮流优化和经济调度等问题提供更多的辅助信息。电网的高速发展，对风电功率波动信息的需要将更全面，然而单点值预测只能给出具体时刻的单点功率值，无法提供更多的辅助信息，为此风电功率的概率区间预测应运而生。风电功率的概率区间预测虽然可以为功率预测值提供更广的取值范围，但存在模型的假设不合理、通用性弱以及因预测方法不同而出现风电功率预测误差数据来源不一致等问题。针对上述情况，本节建立长短期记忆网络进行风电功率的单点值预测，提出一种基于长短期记忆网络的风电功率误差数据库的生成方法来保证误差数据与预测方法之间的合理匹配，并建立具有窗宽优化的非参数核密度估计
    (nonparametric kernel density estimation，NKDE) 模型来降低预测误差[18]。


    # 4.1.1 基于长短期记忆网络的单点值预测


    循环神经网络(RNN)存在梯度的弥散和爆炸问题，长短期记忆网络作为循环神经网络的一种变种，很好地解决了该类问题。长短期记忆网络具有输入门、输出门与遗忘门等三个特殊的门控结构，详细的单元内部结构如图
    4.1 所示。


    由图 4.1 可以看出，不同于循环神经网络，长短期记忆网络针对遗忘门通过设置门控阈值，可以对信息流进行合理的分配，即实现遗忘和保留等功能，遗忘门的输出 f_t
    和当前时刻输入 x_t 存在如下关系：


    f_t = σ(W_f [h_{t-1}, x_t] + b_f)    (4.1)'
