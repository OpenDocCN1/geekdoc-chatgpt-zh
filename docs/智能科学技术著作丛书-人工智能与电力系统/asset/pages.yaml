    # 2) 数据预处理


    通常利用数据预处理方法使原始数据的特征显现得更为明显，更适合卷积神经网络识别，数据预处理分为数据灰度图转换和归一化两个步骤。这里采用如图 5.15 所示的数据灰度图转换方法，将数据表转变为二维图像。


    如图 5.15 所示，数据灰度图转换后得到尺寸为 m×m (m=32)。令 L(i) 表示数据灰度图转换生成的片段信号值，其中 i=1,2,…,m²；P(j,k)(j=1,2,…,m；k=1,2,…,m)
    表示图像像素强度，具体计算方法如下：


    P(j,k) = round{ [ L(j-1)×m + k - min(L) ] / [ max(L) - min(L) ] × 255 }  (5.31)


    式中，round 函数为循环函数；max(L) 为第一个灰度图中的最大元素；min(L) 为第一个灰度图中的最小元素。循环函数使所有的像素值标准化到 0～255。数据灰度图转换后得到的灰度图如图
    5.16 所示。


    # 3) 实验结果


    将数据预处理后的灰度图输入到卷积神经网络进行训练，损失函数值可表示网络训练质量，因此绘制如图 5.17 所示的迭代误差收敛曲线，其中横轴为迭代次数，纵轴为损失函数误差值，可见网络在迭代至第
    5～10 次时误差值逐渐趋于平稳，且速度较快。多次迭代后故障诊断精度可达到 99%以上，如表 5.12 所示，充分说明卷积神经网络能够有效地识别变压器故障，完成变压器的智能故障诊断。


    为了更直观地体现诊断结果的准确性，本节采用混淆矩阵将结果进行可视化处理，如图 5.18 所示。其中，矩阵的每一行代表数据的真实归属类别，每一列代表预测归属类别，如第
