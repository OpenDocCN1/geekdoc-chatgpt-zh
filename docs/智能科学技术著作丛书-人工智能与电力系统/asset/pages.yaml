    由图 5.30 可以看出，FDL-CNN 在第 5 次完全迭代后即可达到收敛，相比于 LeNet-5 在第 10 次完全迭代后收敛，在训练速度上具有很大优势，且收敛时
    FDL-CNN 的误差较小。'
