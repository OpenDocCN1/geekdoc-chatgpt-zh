    # 6.4 基于粒子群优化算法的多能源系统优化运行


    近年来，能源问题和环境问题突出，电网大停电事故频繁发生，传统的以提高经济效益为唯一目标的有功优化控制已经不再适用于当前电网优化运行的要求。多能源系统作为未来能源供应模式成为研究热点，在多能源系统优化控制问题上建立的指标模型主要有运行费用指标、环境污染治理费用指标等。现存方法有考虑机组运行维护费用最低、环境污染最小的多目标优化模型；以有功损耗最低、污染气体排放量最少、系统电压稳定性等指标作为优化目标建立优化模型。由于上述模型中考虑多个指标函数，故多能源系统优化问题是一个多目标问题，随之产生了多目标函数的求解问题。多目标函数之间存在冲突，很难一致达到最优，会造成某个目标函数的优化结果不理想，有些学者提出了多目标转化的解决办法以及解决优化问题的方法。例如，综合考虑了一次能源消耗费用、污染物气体排放多个目标，采用最大满意度法将多目标问题转化为单目标问题，最后采用遗传算法求解该单目标问题；在
    Pareto 非支配解的基础上进行改进，首先通过改变权重系数获得不同权重下的最优解，接着通过在确定目标范围内搜索获得满足要求的权重系数，将多目标转化为单目标，然后通过小生境进化的多目标免疫算法求解该单目标问题。研究表明，针对多能源系统经济运行问题，一方面很多研究都是将多能源系统的优化问题转化为单目标的优化问题，很少有对多目标、单目标下的优化结果进行对比分析的研究，而且优化过程中储能电池是按照事先制定好的策略运行的，没有考虑到储能电池的实时性对多能源系统能量优化的影响；另一方面，针对优化模型的求解，上述提到的方法存在运行时间长、不易跳出局部最优解的缺点，导致不能及时提供优化控制策略，影响优化结果。因此，本节提出一种基于禁忌粒子群的优化算法，该方法既可避免陷入局部最优解，又可实时优化控制，将全天按电网用电时段分为峰、谷、平三个时段，实时判定储能电池荷电状态，针对储能电池处于不同的荷电状态采用不同的控制方案，在不同的运行时段对直热电锅炉和
    CHP 单元的运行状态进行及时的调整[45-47]。


