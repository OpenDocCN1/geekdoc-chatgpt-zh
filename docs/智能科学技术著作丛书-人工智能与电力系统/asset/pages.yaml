    # 6.6.2 基于改进蚁群算法的风电集群输电系统拓扑优化方法


    式(6.111)～式(6.113)构成了带约束的边权生成树问题，在图论中属于NP-难问题，几乎不可能获得全局最优解，本案例采用改进蚁群算法以获得某个局部最优解。


    蚁群算法整体流程如图6.53所示，图中带底纹的部分为本节相对传统蚁群算法的改进部分。具体过程如下：


    +   (1) 输入风电场的接入信息，令蚂蚁编号 k=1。

    +   (2) 输入蚂蚁 k 的接入出力信息和历经节点的信息，起始节点的编号为 1。

    +   (3) 若 W_{(k)}(t)=∅，则输电海缆布线完成，可以直接进行(5)。若 k>M，则代表输电，海缆布线失败，可以直接进行(6)。若 W_{(k)}(t)≠∅，且
    P_k(t) 小于所有海缆选型的最大功率承载量，则进行(4)；否则，令 k=k+1，返回(2)。

    +   (4) 令 t=t+1，进行操作(5)。

    +   (5) 记录拓扑矩阵，进行下一次输电海缆的布线。

    +   (6) 不记录拓扑矩阵，进行下一次输电海缆的布线。


