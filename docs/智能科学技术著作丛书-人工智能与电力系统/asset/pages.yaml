- pgno: 146
  md: '基于模块化多电平换流器的高压直流 (modular multilevel converter-high voltage direct current,
    MMC-HVDC) 输电系统较传统 HVDC 系统具有功率可双向流动的特性，适合构成多端直流 (multi terminal direct current,
    MTDC) 输电系统。由 MMC-HVDC 构成的 MTDC 系统具有故障电流上升速度快、换流站电力电子器件对过电流敏感、直流故障电流不易切断等诸多区别于交流系统的特点，为了保障系统安全，MTDC
    线路故障一般要求在短时间内完成切除 MTDC 系统，故障切除时，要求故障区域定位准确，尽量避免影响其他输电线路，所以故障定位，即确定故障点是否在监测点所在线路上的准确性尤为重要。


    目前，不论是基于机理模型还是基于信号分析的故障诊断方法都存在故障阈值不容易确定的问题，基于传统人工智能方法的故障诊断方法均没有考虑快速性的要求，因此本节提出基于并联卷积神经网络的
    MTDC 线路故障诊断方法。


    # 5.4.1 MTDC 线路故障特征提取


    为分析 MTDC 线路故障状态特性和获取故障状态数据，构建如图 5.8 所示的四端直流输电系统拓扑。模型中 B2 和 F1 端是送电端，B3 和 E1 是受电端，直流输电母线电压
