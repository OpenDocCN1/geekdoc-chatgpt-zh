    # 3.4 强化学习


    强化学习又称再励学习、评价学习或增强学习，是机器学习领域的研究热点，目前强化学习应用较多的领域有对弈、决策和控制等，主要用来实现决策优化。3.4.1 节介绍强化学习的基本概念及主要研究方向，3.4.2
    节和 3.4.3 节分别介绍马尔可夫算法和 Q 学习算法，并讨论各算法的实现方法。


    # 3.4.1 强化学习的基本概念及主要研究方向


    # 1. 强化学习的基本概念


    强化学习从动物学习、参数扰动自适应控制等理论发展而来，是智能体以“试错”的方式进行学习，通过与环境进行交互获得的奖赏指导行为。强化学习的目标是动态地调整参数，以得到最大的强化信号。学习从环境状态到行为的映射，'
