    MDP)。


    # 1. 马尔可夫算法的理论基础


    马尔可夫性是指系统的下一个状态 S_{t+1} 仅与当前状态 S_t 有关，而与以前状态无关，状态 S_t 是马尔可夫的，当且仅当 p(S_{t+1} |
    S_t) = p(S_{t+1} | S_1, ..., S_t)，其中蕴含了所有相关的历史信息，一旦当前状态可知，历史信息将被抛弃。马尔可夫性描'
