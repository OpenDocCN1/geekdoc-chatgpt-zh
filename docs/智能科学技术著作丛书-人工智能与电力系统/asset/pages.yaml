  img_proc: true
- pgno: 129
  md: '不同的当前序列，其中 $i_{pm}$ 表示电流波形第 $p$ 周期中的第 $m$ 个点， $i_{qn}$ 表示电流波形第 $q$ 周期中的第 $n$
    个点。通过观察满足条件 $u(k) < 0$ 和 $u(k+1) > 0$ 的正负交叉项 $u(k)$ 和 $u(k+1)$，可以通过式 (5.1) 递归计算
    DTW 距离，$k$ 是采样点的序号。然后，获得了与该电压过零时间序列相对应的复合电流波形的单个周期。


    $$D(i_{pm}, i_{qn}) = d(i_{pm}, i_{qn}) + \min \begin{cases} D(I_p, \gamma(i_{qn}))
    \\ D(\gamma(i_{pm}), I_q) \\ D(\gamma(i_{pm}), \gamma(i_{qn})) \end{cases} \tag{5.1}$$


    式中，$d(i_{pm}, i_{qn})$ 为由 $d(i_{pm}, i_{qn}) = (i_{pm} - i_{qn})^2$ 定义的两个序列之间每个点的距离；
    $\gamma$ 为除指定采样点以外的剩余采样点。以第一个采样点为例，可建立如下方程：


    $$\gamma(i_{p1}) = \{i_{p2}, \cdots, i_{pm}\}, \quad \gamma(i_{q1}) = \{i_{q2},
    \cdots, i_{qn}\} \tag{5.2}$$


    # 3) 阈值评估


    通常翘曲路径越短，两个当前序列之间的相似性就越高。因此，需要通过适当的 DTW 距离阈值来确定电流波形是否发生突变，再确定负载的起停或状态变化，这意味着事件发生。经过大量实验，利用
    DTW 距离比值定义阈值，其值为


    $$\lambda_D(p) = \frac{D(I_p, I_{p-1})}{D(I_{p-1}, I_{p-2})} \tag{5.3}$$


    # 4) 当前事件采集


    当前事件采集的目的是确认所需数据并为电流到图像的转换做准备。


    在事件驱动程序之后，执行电流到图像的转换，以图像的形式表示当前特性，作为卷积神经网络的输入。在转换过程中，将提取长度为 $L^2$ 的当前序列，以获得 $L
    \times L$ 尺寸的灰度图像。但是，在非侵入式负荷监测的情况下，考虑到由于随机窗口位置和不适当的窗口长度而导致的特征损失的情况，可能会生成混乱的灰度图像，并且无法显示这些特征。针对这个问题，详细的转换方法是结合滑动窗口算法和目标电流波形的预处理进行的。假设目标电流
    $i = \{(i(1), i(2), \cdots, i(m))\}$， $1 \le m \le L \times L$，从这些窗口之一提取。假定第一个电流过零点
    $i(k)$ 是通过利用过零检测来确定的，并且满足 $i(k-1) < 0$ 以及 $i(k) > 0$。然后将目标电流转换为序列 $i''(n)$，定义如下：


    $$i''(n) = \begin{cases} i(n + k - 1), & 1 \le n \le L \times L - k + 1 \\ 0,
    & L \times L - k + 1 < n \le L \times L \end{cases} \tag{5.4}$$


    以此方式，可以以二维像素强度的形式有序地呈现器具运行的特性。如图 5.1'
