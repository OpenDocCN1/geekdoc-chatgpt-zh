    $\displaystyle\sum_{i,j=1}^{n} a_i y_j = 0$  (3.21)


    其中，$a=(a_1,a_2,\cdots,a_n)^\mathrm{T}$，$b=(1,1,\cdots,1)^\mathrm{T}$，令 $y=(y_1,y_2,\cdots,y_n)^\mathrm{T}$，$A_{ij}=y_i
    y_j (X_i X_j)$。


    由此可得到最优分类函数为


    $f(x)=\operatorname{sgn}\left\{\displaystyle\sum_{i=1}^{n} a_i^* y_i (X_i X)+b^*\right\}$  (3.22)


    因为对于非支持向量满足 $a_i=0$，所以求解最优函数只需求解支持向量，而 $b^*$ 可根据任意一个支持向量的约束条件求出。


    # 2) 核函数


    Mercer 定理将核函数解释为特征空间的内积，核函数的思想是将原本在高维特征空间中的计算通过核函数在输入空间中完成，而无须知道高维变换的显式公式。为了避免计算量过大，许多学习算法都是通过“降维”的方式，将高维原始空间变换到较低维的特征空间，但这样容易损失一些有用的特征，导致学习性能的下降；而基于核函数的方法却恰好相反，它将低维向量向高维映射，而不需要过多地考虑维数对学习机器性能的影响。核函数是支持向量机的重要组成部分，根据希尔伯特-施密特定理，只要变换
    $\phi$ 并满足 Mercer 条件，就可用于构建核函数。


    Mercer 条件如下：给定对称函数 $k(x,y)$ 和任意函数 $\varphi(x)\ne0$，满足约束


    $\begin{cases}\displaystyle\int_{-\infty}^{+\infty}\varphi^2(x)\mathrm{d}x<0\\[6pt]\displaystyle\iint_{-\infty}^{+\infty}k(x,y)\varphi(x)\varphi(y)\mathrm{d}x\mathrm{d}y>0\end{cases}$  (3.23)


    目前常用的核函数主要有线性核函数、二次核函数、多项式核函数、径向基核函数、多层感知器等。


    假设有非线性映射 $\phi:\mathbf{R}^n\to H$ 将输入空间的样本映射到高维（可能是无穷维）的特征空间 $H$ 中。当在特征空间 $H$
    中构造最优超平面时，训练算法仅使用空间中的点积，即 $\langle\phi(X_i),\phi(X_j)\rangle$，而没有单独的 $\phi(X_i)$
    出现。因此如果能够找到一个函数 $k$，使得 $k(X_i,X_j)=\langle\phi(X_i),\phi(X_j)\rangle$，这样，在高维特征空间中实际上只需要进行内积运算，而这种内积运算可以用输入空间中的某种特征函数来实现，甚至无须知道映射
    $\phi$ 的具体形式。'
