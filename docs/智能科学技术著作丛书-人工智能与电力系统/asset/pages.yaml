- pgno: 6
  md: '# 前 言


    人工智能是新一轮科技革命和产业变革的重要驱动力量，正在对经济发展、社会进步、国际政治经济格局等方面产生重大而深远的影响。当今世界正经历百年未有之大变局，我国发展的外部环境日趋复杂。加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题，是我国赢得全球科技竞争主动权的重要战略抓手，是推动我国科技跨越发展、产业优化升级、生产力整体跃升的重要战略资源。电力工业的快速发展使得国家对电力系统自动化的需求不断增加。同时，电力系统自动化和智能化也是电力系统的发展要求。随着人工智能技术的不断发展，将人工智能技术与电力系统相结合的应用也越来越多，并在应用中取得了良好的效果。目前电能已经成为人类生活不可或缺的一部分，伴随着电力系统的飞速发展，产生了海量的电力系统数据。面对这些海量的数据，人力管理复杂程度呈指数上涨。在这些背景下，人工智能技术以其高度自动化和智能化脱颖而出，因此人工智能技术在电力系统中的应用前景十分广阔。将人工智能技术和电力系统相结合不但加强了智能科学在电网中的科研和应用，而且能更加确保电网系统持续、稳定、安全和经济运行。


    全书共 6 章，第 1 章为绪论，主要介绍人工智能的含义、发展历程及主要的算法和应用领域，后续章节将分别展开介绍人工智能技术在电力系统中应用较多的算法的原理、模型、特点及应用。第
    2、3 章为基础部分，主要阐述智能算法和机器学习的理论方法。第 2 章主要介绍基于自然界生物进化及种群特点启发的几类典型智能算法，包括遗传算法、免疫算法、蚁群算法、粒子群优化算法、模拟退火算法等；详细介绍每种算法的基本概念及模型，为后续的案例介绍提供理论支撑。第
    3 章主要介绍机器学习相关的基本概念、发展历程以及机器学习算法的理论基础和应用场景，详细介绍贝叶斯算法、决策树算法和支持向量机三种具有代表性的传统机器学习算法的理论基础及应用场景，深度学习的卷积神经网络和循环神经网络的理论基础和应用场景，强化学习的马尔可夫算法和
    Q 学习算法的理论基础和应用场景，为后续的案例介绍提供理论支撑。第 4～6 章为应用部分，重点介绍人工智能技术在电力系统中的实际应用。第 4 章主要介绍人工智能技术在电力系统负荷与发电预测中的应用。第
    5 章主要介绍人工智能技术在电力系统监测辨识与故障诊断中的应用。第 6 章主要介绍人工智能技术在微电网及多能源系统优化中的应用。本书主要由东北大学杨东升'
