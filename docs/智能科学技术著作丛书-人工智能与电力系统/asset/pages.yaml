- pgno: 97
  md: '响估计模型的分布情况; 窗宽选择过大，将导致所得的概率密度函数过于平滑，不能满足实际预测误差的概率密度分布。由此可知，窗宽的选择是否合适，对预测误差的概率密度函数有着至关重要的影响。


    目前，求取窗宽主要基于均方误差 (mean square error, MSE) 准则、平方误差积分 (integral of square error,
    ISE) 准则和均方误差积分 (mean integral of square error, MISE) 准则，前两者容易受到单点和样本性质的影响，而 MISE
    比前两者更具有全局性的衡量。 因此，为避免因窗宽的选择不合适而造成预测效果差，一般在选取窗宽时可以采用 MISE 准则来衡量窗宽的合适度：


    $$\begin{aligned}\text{MISE}(h) &= E \int (\hat{f}(x)-f(x))^2 dx \\ &= \int (E\hat{f}(x)-f(x))^2
    dx + \int \text{var}\,\hat{f}(x)dx\end{aligned}\tag{4.10}$$


    式中，右边分解为两项，第一项为对期望值与实际值之差的平方的积分，第二项为对估计值方差的积分。


    核密度的估计优劣可由偏差和方差构成，经过泰勒级数展开后可以得到 MISE(h) 为


    $$\text{MISE}(h)=\frac{1}{nh}R(K)+\frac{1}{4}h^4l^2(K)R(f'''') + o\left(h^4+\frac{1}{nh}\right)\tag{4.11}$$


    式中，$R(K)$ 为核函数 $K$ 的平方积分； $l^2(K)$ 为核函数 $K$ 的二阶矩。


    其中，$R(K)$ 和 $l(K)$ 满足如下关系：


    $$R(K)=\int K^2(u)du\tag{4.12}$$


    $$l(K)=\int x^2 K(x)dx\tag{4.13}$$


    舍弃无穷小量后，可得到渐近积分均方误差 (asymptotic mean integral of squarare error, AMISE)，以此来选择窗宽，具体如下所示：


    $$A(h)=\frac{1}{nh}R(K)+\frac{1}{4}h^4l^2(K)R(f'''')\tag{4.14}$$


    对式 (4.14) 中的 $A(h)$ 求偏导，当 $\partial A(h)/\partial h=0$ 时，$A(h)$ 收敛且存在最佳的窗宽为


    $$h_{\text{AMISE}}=\left(\frac{R(K)}{nl^2(K)R(f'''')}\right)^{\frac{1}{5}}\tag{4.15}$$'
