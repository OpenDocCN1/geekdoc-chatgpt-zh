  md: '应的安装总成本、运行总成本与计及可靠性的失负荷惩罚成本之和的最小化，即


    min TC = IC + OC + PC  (6.35)


    式中，TC为能量枢纽总成本；IC为保证负荷供应的安装总成本；OC为运行总成本；PC为计及可靠性的失负荷惩罚成本。


    保证负荷供应的安装总成本 IC 包括 CHP 机组、燃气锅炉、蓄电池、蓄热槽和风机的安装成本，可表示为


    IC = CRF ( Σ_{i∈NC} IC_i^{CHP} + Σ_{j∈NB} IC_j^{GB} + Σ_{k∈NE} IC_k^{ES} + Σ_{l∈NT}
    IC_l^{TS} + Σ_{w∈NW} IC_w^{W} )  (6.36)


    CRF = ir(1+ir)^y / ((1+ir)^y -1)  (6.37)


    式中，IC_i^{CHP}、IC_j^{GB}、IC_k^{ES}、IC_l^{TS}、IC_w^{W}分别为 CHP 机组、燃气锅炉、蓄电池、蓄热槽和风机的安装成本；i、j、k、l、w分别为
    CHP 机组、燃气锅炉、蓄电池、蓄热槽、风机的个数；NC、NB、NE、NT、NW分别为 CHP 机组、燃气锅炉、蓄电池、蓄热槽、风机的备选设备集合；CRF为资金回收系数；ir为实际利率值；y为规划期年限。


    IC_i^{CHP} = CC_i^{CHP} · P_i^{CHP} · I_i  (6.38)

    IC_j^{GB} = CC_j^{GB} · P_j^{GB} · I_j  (6.39)

    IC_k^{ES} = CC_k^{ES} · P_k^{ES} · I_k  (6.40)

    IC_l^{TS} = CC_l^{TS} · P_l^{TS} · I_l  (6.41)

    IC_w^{W} = CC_w^{W} · P_w^{W} · I_w  (6.42)


    式中，CC_i^{CHP}、CC_j^{GB}、CC_k^{ES}、CC_l^{TS}、CC_w^{W}分别为 CHP 机组、燃气锅炉、蓄电池、蓄热槽、风机的单位容量安装成本；P_i^{CHP}、P_j^{GB}、P_k^{ES}、P_l^{TS}分别为
    CHP 机组、燃气锅炉、蓄电池和蓄热槽的额定功率；P_w^{W}为风机的安装容量；I_i、I_j、I_k、I_l、I_w分别为 CHP 机组、燃气锅炉、蓄电池、蓄热槽、风机的安装状态，为{0,1}。


    系统运行总成本包括 CHP 机组、燃气锅炉等能源转换装置及电网从上游网络购买的电能或天然气的运行成本，蓄电池、蓄热槽的运行成本忽略不计，可表示如下：


    OC = Σ_{t=1}^{NT} ( Σ_{i∈NC} OC_{i,t}^{CHP} + Σ_{j∈NB} OC_{j,t}^{GB} + OC_t^{Grid}
    )  (6.43)


    式中，OC_{i,t}^{CHP}为 CHP 机组运行成本；OC_{j,t}^{GB}为燃气锅炉运行成本；OC_t^{Grid}为与电'
