    算法预测数据的相对误差百分比在−0.05%~0.05%。同时，PSO-LSSVM 算法的计算时间为 2.0298s，传统最小二乘支持向量机算法计算时间为 1.8905s。相比较而言，传统最小二乘支持向量机算法的时间略短，但相比于数据采样周期，计算性能优势不大。由于预测样本数量少，虽然经过粒子群优化算法优化后的算法速度略慢，但预测精度明显提高，每个点的预测误差都较低，因此时间误差可以忽略不计。在较低的用水需求和较高的用水需求下，数据预测结果的相对误差大于其他用水需求下的相对误差，故可以得出相对误差受用水需求量的影响，用水需求的波动，特别是较高的用水需求的波动可能会对海水淡化负荷预测精度产生一定的影响。然而，大部分数据点的相对误差百分比较小，这表明实际数据与相应预测数据之间能更好地吻合。


