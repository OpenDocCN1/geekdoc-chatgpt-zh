    # 3) 多能源系统和大电网交易费用


    当多能源系统中发电机组输出功率大于系统需求时，判断储能电池系统的荷电状态，对储能电池进行充电，使其始终工作在最佳状态，剩余电量售给大电网，以减少系统运行费用；当多能源系统中输出功率不满足负荷需求时，大电网向多能源系统售电，为多能源系统提供了充足的能量，提高了多能源系统供能的可靠性。这两种工作方式都会在系统和大电网之间产生电量交易费用。


    $C_s(t)=\begin{cases}c_p^d(t)\cdot p_g(t)\cdot\tau, & p_g(t)\ge0\\c_p^u(t)\cdot
    p_g(t)\cdot\tau, & p_g(t)<0\end{cases}\tag{6.83}$


    式中，$c_p^d(t)$为$t$时刻系统向大电网的购电价格；$c_p^u(t)$为$t$时刻系统向大电网售电的价格；$p_g(t)$为$t$时刻大电网的电功率。


    # 2. 多能源系统环境污染治理优化模型


    因多能源系统中风机、光伏发电机组利用清洁可再生能源，故不释放污染气体；而系统中的 CHP 单元消耗燃料能量，产生电能、热能，在能量转化过程中释放出污染气体会降低环境质量。本节研究的多能源系统中释放污染气体的只有
    CHP 单元和大电网。因此，主要从污染物的治理费用和污染物的环境价值两方面考虑大电网和一次能源机组的环境污染治理费用，其中污染气体主要考虑$SO_2$、$NO_x$、$CO_2$和$CO$，建立污染治理费用的数学模型如下：


    $C_e(t)=\sum_{t=1}^{T}[S_t^p(s_{SO_2}^p(t),s_{NO_x}^p(t),s_{CO_x}^p(t),p_g(t),\tau)

    + S_t^n(s_{SO_2}^n(t),s_{NO_x}^n(t),s_{CO_x}^n(t),V(t),\tau)]\tag{6.84}$


    式中，$S_t^p$为$t$时刻大电网用电产生的污染治理费用；$S_t^n$为$t$时刻由 CHP 产生的污染治理费用；$s_{SO_2}^p(t)$为治理$t$时刻产生$SO_2$的费用；$s_{NO_x}^p(t)$为治理$t$时刻产生$NO_x$的费用；'
