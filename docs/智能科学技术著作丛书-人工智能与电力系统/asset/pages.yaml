- pgno: 52
  md: '(4)进行适应度排序和选择。通过误差将 F(x_i) 和 F(x_i′)(i=1,2,⋯,p) 进行排序，选择并决定矢量保留与否。具有最小误差的 p
    个矢量成为下一代的新亲本。


    (5)重复步骤(3)和(4)直到达到收敛。


    # 3. 进化策略算法的基本技术


    1) 交叉重组


    与遗传算法相似，交换两个个体的基因，主要有三种方式：


    +   (1) 离散重组。先随机选择两个父代个体，然后将其分量进行随机交换，构成子代新个体的各个分量，从而得出新个体。


    +   (2) 中值重组。这种重组方式也是先随机选择两个父代个体，然后将父代个体各分量的平均值作为子代新个体的分量，构成新个体。


    +   (3) 混杂重组。这种重组方式的特点在于父代个体的选择。混杂重组时先随机选择一个固定的父代个体，然后针对子代个体每个分量再从父代群体中随机选择第二个父代个体，也就是说，第二个父代个体是经常变化的。而父代两个个体的组合方式，既可以采用离散重组，也可以采用中值重组，还可以把中值重组中的
    1/2 改为[0,1]的任一权重。


    2) 变异过程


    在每个分量加上零均值、某一方差的高斯分布的变化产生新的个体。这个方差就是变异程度，变异程度并不是一直不变的，而是在算法开始时变异程度比较大，当接近收敛后变异程度开始减小。


    3) 选择过程


    进化策略的选择有两种：①(λ,μ)ES(进化学习)，即用 μ 个父个体产生 λ 个个体，从新个体中选择 μ 个个体作为子代；②(λ+μ)ES，即用 μ 个父个体产生
    λ 个个体，从父个体与新个体中选择 μ 个个体作为子代。(λ,μ)ES 的每个个体只存活一代，随即被新个体顶替；(λ+μ)ES 可以保证最优个体存活，使群体的进化过程呈单调上升趋势，但(λ+μ)ES
    选择保留旧个体，有时是局部最优解，会带来一些问题。


