    # 3. 非侵入式负荷监测的卷积神经网络架构


    在这项研究中，以 VGG-16 为基础的卷积神经网络架构旨在解决非侵入式负荷监测和识别问题。提出的体系结构由 13 个卷积层、5 个池化层、3 个全连接层和
    1 个 softmax 层组成，具有小卷积核和出色生成性能的特征。卷积神经网络体系结构的主要结构用于 320×320 灰度图像


    卷积层被设计用于通过具有一定大小的卷积滤波器来提取家用电器的特征，因此卷积层是卷积神经网络的基本运算符号。新的卷积层特征图可以在上一层卷积内核之后获得，基于激励函数的处理如下：


    $$Y_j^l = f\left(\sum_{s \in M_{j(l-1)}} \sum_{(u,v) \in K^{(l)}} w_{js}^l(u,v)
    x_s^{(l-1)}(c+u, r+u) + b_j^{(l)}\right) \tag{5.5}$$


    式中， $K^{(l)} = \{(u,v) \in N^2 | 0 < u < K_w, 0 < v < K_h \}$， $K_w$ 和 $K_h$ 分别为卷积核的宽度和高度；
    $l$ 为当前层数； $b_j^{(l)}$ 为卷积层第 $j$ 个特征图的神经元偏置； $s \in M_{j(l-1)}$ 为先前特征图的集合。


    在卷积层之后，使用池化层进行下采样，抗过度拟合并保持特征不变。在本节中，最大池运行用于池化层，详细过程如下：


    $$Y_j^l = \text{down}(Y_j^{l-1}) \tag{5.6}$$'
