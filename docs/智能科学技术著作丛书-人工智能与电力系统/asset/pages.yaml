  md: '# 1.1.2 人工智能的主要算法


    人工智能的核心是算法，不同算法解决不同的问题。人工智能的算法多种多样，主要可以分为进化算法与群智能优化算法、机器学习算法两大类[2]，如图1.2所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_14_0.png)


    # 1. 智能启发算法


    进化算法与群智能优化算法可称为“软计算”，是学者受自然(生物界)规律的启迪，根据其原理模仿求解问题的算法。智能启发算法在工程应用中越来越受欢迎，因为它们具有依赖于相对简单的概念并且易于实现、不需要梯度信息、可绕过局部最优、可用于涵盖不同学科的广泛问题等优势，只通过输入和输出来考虑和解决优化问题。以遗传算法、免疫算法、蚁群算法及粒子群优化算法为代表，都是由生物的进化或群体行为特性启发而来的智能算法。其中，遗传算法又衍生出进化策略和进化规划两种算法用于寻找最优解。模拟退火算法是由自然界物理现象启发而来的智能算法，能有效地解决局部最优解问题。禁忌搜索算法是由人类有记忆的智力过程启发得来的搜索算法。这些智能算法均可归为启发式智能算法，能够应用于函数全局优化等问题，在电力系统与综合能源系统的规划与运行优化、电力系统的故障诊断、可再生能源发电预测和负荷预测中广泛应用。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 2. 机器学习算法


    机器学习是研究计算机怎样模拟或实现人类的学习行为，以获取新的知识或技能，重新组织已有的知识结构，不断完善自身的性能，或者达到操作者的特定要求。机器学习的算法多种、功能多样，其中贝叶斯算法、决策树算法、支持向量机在电力系统的应用较为广泛。贝叶斯算法利用概率统计知识，进行大型数据的分类，具有方法简单、分类准确率高、速度快的特点；决策树算法是通过一系列规则对数据进行分类，能够在相对短的时间内对大型数据源做出可行且效果良好的分类结果；支持向量机可以解决高维问题，能够处理非线性特征的相互作用以及提高泛化能力。机器学习算法有基于线性回归、逻辑回归等解决回归问题的算法，也有基于K均值聚类、层次聚类、密度聚类、图论聚类等解决聚类问题的算法。除此之外，机器学习还有深度学习和强化学习两大分支，深度学习是基于现有的数据进行学习操作，是一种建立、模拟人脑进行分析学习的神经网络，它通过模仿人脑的机制来解释数据，主要有人工神经网络、卷积神经网络、循环神经网络三种方法；强化学习用于描述和解决智能体在与环境的交互过程中通过学习策略以达成回报最大化或实现特定目标的问题，主要有马尔可夫算法、Q学习算法、多智能体等方法，其中马尔可夫算法和Q学习算法在电力系统中的应用较多。


    # 1.2 电力系统中应用人工智能的典型场景


    目前，我国工业、商业、居民业等行业对电力能源的需求越来越大，但供电的质量和可靠性均未达到相应的指标，这促使传统电网必须向更加可靠和安全的发展方向发展。在电网容量日益增大与电压等级不断提高的发展趋势中，自动保护、电力调度、检测维护、系统预测等也急需调整、改善和提高。人工智能技术为电力系统的智能化运行提供了重要的技术支撑，利用人工智能的智能化、快速化和准确化，将人工智能技术与电网的故障诊断、电力自动化调度以及电力预测等相结合，既可以保证电网运行的安全性和可靠性，又可以实时评估和分析电网中重要设备的运行参数等[3,4]。


    # 1.2.1 基于人工智能技术的电力系统负荷与发电预测


    # 1. 负荷预测


    电力系统负荷预测在电网调度运行中具有十分重要的作用。负荷与日期、政策、天气等多种影响因素相关，由于电力系统本身的非线性特征，电力系统负荷在一定程度上呈现随机的特点，很难建立精确的数学模型来对其进行描述。过去，对于电力系统负荷预测主要是利用传统的预测方法，如趋势外推法、'
  merge: -1
  img_proc: true
- pgno: 16
  md: '回归分析法和时间序列法等，但是这些方法具有运行时间长、预测精度低、预测性能不足等缺点。随着电网的快速发展，这些方法不足以解决电网的诸多问题，出现了许多弊端。


    新一代人工智能技术中的深度学习类算法作为强感知型算法，因其卓越的特征挖掘与映射能力，能充分解决大规模负荷数据中存在的非线性问题。卷积神经网络、深度信念网络、长短期记忆网络、深度递归神经网络及支持向量机等算法都在负荷预测领域中应用广泛。其中，长短期记忆网络具有特殊的记忆结构，能较好地学习时序数据中含有的相关性特征，从而更好地理解负荷变化的不确定性。卷积神经网络则因其池化、卷积等操作可有效地降低网络复杂度，以减少训练参数的数目。深度递归神经网络的输出与网络的历史状态强相关，将其应用于负荷预测时能很好地关联历史数据。上述算法都可在一定程度上提高负荷预测的准确率。


    # 2. 可再生能源发电预测


    当前电力系统的典型特征之一是高比例新能源的接入，这一特征的存在使得电力系统不确定性与波动性增强，影响了电网的调度运行和安全稳定。开展不同的能源预测研究可以在一定程度上减小不确定性，从而更好地支撑电力系统的规划与运行。而提高间歇性可再生能源发电功率预测精度的关键是构建具有强大数据处理能力和特征提取能力的预测模型。


    深度学习的引入改进了传统浅层预测模型处理数据的能力。可再生能源发电预测问题与负荷预测问题本质上存在共性，长短期记忆网络的记忆能力、深度信念网络与卷积神经网络的特征提取能力、堆叠自编码器的强鲁棒性对提高新能源预测的准确性均表现出良好的效果。此外，迁移学习的引入也为不同风场预测模型的训练节约了大量时间。


    # 1.2.2 基于人工智能技术的电力系统监测辨识与故障诊断


    电力系统的故障分析是对电力线路和电力设备的故障进行识别、测距和定位。准确可靠的故障分析及定位对提升继电保护性能、保障电力系统安全稳定运行至关重要。随着智能电网的逐步推进，电力系统发展呈现出新的态势，如电网规模增大且结构更加复杂、高比例接入的分布式电源与集中式电源相结合、电力系统电力电子化趋势明显、感知技术的进步和信息整合带来数据规模爆发式增长等。数据规模庞大、故障机理复杂、算法模型多样化是电力系统新态势下故障分析面临的主要问题。


    以深度学习为代表的新一代人工智能技术在基于大数据驱动的特征自学习、强非线性拟合、端到端建模等方面具有极强的优势，如利用并联卷积神经网络对'
