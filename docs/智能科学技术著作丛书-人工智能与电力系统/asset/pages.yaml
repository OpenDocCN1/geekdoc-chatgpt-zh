    # 6.6.1 风电集群输电系统的数学模型


    一个典型的海上风电集群输电系统示意图如图 6.51 所示，其中，场站内部的 4 个黑色小圆圈为海上风电场的升压站，大圆圈为陆上登陆点，每个多边形表示一个海上风电场。考虑到高压输电线布线的限制，高压输电系统需要避开海上风电场内部的中低压海缆布线，各个多边形之间的区域为海上风电集群高压输电系统的海缆可行通道，为图中带圆圈编号的虚线。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_234_0.png)


    图 6.51 海上风电集群输电系统示意图


    如果将海缆抽象成边，则输电系统拓扑优化的目标便从海缆总成本最低转化成求解以输电海缆成本为权重的加权边长最小和的生成树问题。生成树的根节点为登陆点，叶节点为各风电场升压站，中间节点为输电海缆的接入点(图
    6.51 中场站外顶点处灰色小圆圈)，可行边集合为海缆通道集合，边权为分段海缆成本，并随海缆截面和长度变化。


    节点是海缆通道的连接点或首末端，用 i 编号，坐标为 (x_{c,i}, y_{c,i})。海上风电场升压站用 j 编号，坐标为 (x_{t,i}, y_{t,i})。风电场接入点是场内海缆与场外海缆的连接点，坐标为
    (x_{k,j}, y_{k,j})。'
