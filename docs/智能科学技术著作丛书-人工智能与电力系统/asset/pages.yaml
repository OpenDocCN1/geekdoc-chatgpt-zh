    需要对负荷特征进行提取，用电负荷功率序列特征主要包括功率序列统计特征和功率序列奇异值特征，主要采用滑动时间窗口算法来提取各负荷功率序列，分别对负荷功率序列进行统计特征提取和奇异值提取，对节能灯、台式电脑和微波炉随机抽取
    5 组样本，并提取不同采样样本的奇异值。


    # 2. 多特征融合


    对于负荷特征的融合，首先将负荷功率序列统计特征和功率序列奇异值特征作为特征向量输入 PNN 中，以进行特征信度赋值，然后通过 D-S 证据理论将两者的特征信度赋值矩阵进行融合。


    PNN 是一种基于径向基神经网络与经典概率密度的前馈型神经网络，通过 PNN 可以对负荷功率序列统计特征和功率序列奇异值特征进行特征信度赋值，具体步骤如下。


    假设负荷功率序列的统计特征为 φ_k ，奇异值特征向量 ψ 的维数为 n_i (i=1, 2,⋯)；初辨识后判断每个可能存在的负荷组合，每组提取 k 个训练样本、
    m 个分类层， m 为初辨识得到的可能存在的负荷组合数。


    本节以负荷功率序列统计特征向量 φ_k 和奇异值特征向量 ψ 分别作为 PNN 的输入层，输入层将各个特征向量进行归一化后输入隐含层，同时根据分析可知隐含神经元的数目为
    n×k 个，最后通过响应函数 (5.10) 得到输出层，即为信度赋值矩阵 M，输出层神经元的数目与最终辨识负荷组合数目相关，即输出层的神经元数目为 m 个：


    $$Y_{m,j}(X)=\exp\left(\frac{x^{\mathrm{T}}x_{m,j}-1}{\sigma^{2}}\right)\tag{5.10}$$


    式中， x_{m,j} 包含统计特征向量 φ_k 和奇异值特征向量 ψ ，为第 m 种负荷组合的第 j 个训练样本向量， j=1,2,⋯,w ， w 为训练样本总数；
    σ 为平滑参数。


    D-S 证据理论在多特征融合中得到广泛应用。根据 D-S 证据理论，针对多特征序列融合，基本的处理步骤为，假设 m1(a) 和 m2(b) 分别为一组可能存在负荷的基础负荷功率序列统计特征和功率序列奇异值特征的基本信度赋值，分别为
    a1,a2,⋯,ai 和 b1,b2,⋯,bj ，组合结果 m(c) 为'
