- pgno: 17
  md: '多端直流输电线路进行故障诊断。新一代人工智能技术网络结构灵活，具有足够的网络深度，在应对大数据方面，具有很强的数据降维和处理能力。分布式能源大规模接入、电力电子装置的广泛应用，使得电力系统故障的随机性、非线性大大增强。新一代人工智能技术具有强非线性拟合能力和特征表达能力，能从复杂多变且多影响因素耦合作用下的故障数据中提炼出有利于准确诊断的判别信息。新态势下的电力系统建模分析困难，新一代人工智能技术具备端到端的学习模式，避免了中间环节的误差累积，有利于提升故障诊断的精度和准确率[5]。


    # 1.2.3 基于人工智能技术的电力系统优化


    电力系统是一个庞大的系统，其不仅参数数量非常多，而且非线性参数与线性参数混合，使优化问题变得十分复杂。对于这种大规模的混合优化问题，传统的线性规划法、非线性规划法、混合整数法以及动态规划法较为成熟。其中线性规划法通过将非线性的函数和约束条件进行局部线性化处理，再用线性规划方法解决优化问题，具有计算速度快、收敛性较为可靠以及易于处理线性约束问题等优势，目前比较常用的是灵敏度分析法和内点法。但线性规划法计算精度较低且不利于处理大规模的非线性问题。而非线性规划法以梯度寻优为基础，在处理非线性规划问题上的表现较好。不过非线性规划法在求解过程中的计算量比较大且收敛性一般，很多情况下在陷入局部极值后难以收敛，处理高维优化问题时表现不佳。而且在大规模的电力系统转化为数学模型的过程中，该方法对许多连续变量做了离散处理，忽略了实际运行状况中的因素，使得计算结果的误差较大。


    由于人工智能算法具有计算速度快和计算精度高的特点，引入人工智能算法可解决这些问题。遗传算法、模拟退火算法、禁忌搜索算法以及群智能优化算法在电力系统优化运行中已被广泛应用，如将蚁群算法与内点法相结合求解无功优化问题、应用遗传算法确定风电场并网点处无功补偿电容器的分组和控制问题、采用粒子群优化算法与遗传算法结合的方式解决机组的启停状态问题、应用遗传算法结合粒子群优化算法的启发式特性共同解决分配问题。


