    将利用工业用户形态聚类算法和特征过程处理后的各类工业用户负荷数据利用其对应的 LightGBM 模型进行训练和预测，然后通过模型融合得到最终预测结果。模型融合的计算公式如下：


    Pre = Σ_{i=1}^{n} pre_i  (4.46)


    式中，Pre 为最终预测结果；n 为单一模型的数目；pre_i 为第 i 个模型的预测结果。


    # 4.3.4 仿真与验证


    本算例通过预测精度和计算效率两方面评价指标来评估预测结果的有效性。预测精度采用三种评价指标，分别是平均绝对百分比误差 (mean absolute percentage
    error, MAPE)、平均绝对误差 (mean absolute error, MAE) 和均方根误差 (root mean square error,
    RMSE)。模型计算效率采用预测过程的计算时间来评价，预测精度所采用的三种评价指标公式为


    MAPE = (1/n) Σ_{i=1}^{n} |y_i - ŷ_i| / |y_i| × 100%  (4.47)


    MAE = (1/n) Σ_{i=1}^{n} |y_i - ŷ_i|  (4.48)


    RMSE = sqrt( (1/n) Σ_{i=1}^{n} (y_i - ŷ_i)^2 )  (4.49)


    式中，n 为预测点个数；y_i 为第 i 个预测点的真实值；ŷ_i 为第 i 个预测点的预测值。


    本实验采用欧洲某地区 2012 年 1 月 1 日至 2014 年 12 月 31 日的负荷数据，数据时间尺度为 15min，其中以 2012～2013 年负荷数据为训练集，2014
    年负荷数据为验证集进行日前预测。运行本实验的计算机环境为四核 Intel i7-6700 处理器，'
