    FDL-CNN 的输入层，如图 5.24 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_164_1.png)


    图 5.24 FDL-CNN 的输入层示意图


    本节采用宽和高不相等的矩形矩阵作为输入层，在特征提取阶段，通过调整卷积核的尺寸使第一次卷积操作得到的特征图为正方形二维矩阵，然后执行传统卷积的操作步骤。通常在利用卷积神经网络提取振动信号特征时，一方面为了提取到输入信号的低频特征，卷积核不能太小；另一方面，为了保留输入信号的原始特征，卷积核不能太大。而变压器故障振动信号频率往往高于正常振动信号频'
