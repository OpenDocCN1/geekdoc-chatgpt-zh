    (3.40)


    式中，σ为 sigmoid 函数；W_f为遗忘门的权重矩阵；[h_{t-1}, x_t]为两个向量的连接；b_f为遗忘门偏置；h_{t-1}为前一时刻的输出值；x_t为当前时刻的输入值。


    遗忘门的位置及结构如图 3.18 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_79_0.png)


    图 3.18 遗忘门的位置及结构


    # (2)输入门。


    输入门的作用是把即时状态输入为长期状态，它包括两个部分，分别为更新单元状态和生成新的单元状态。


    更新单元状态是决定将什么样的新信息放入单元状态中，这一 部分由一个 sigmoid 层和一个 tanh 层构成。首先 sigmoid 层决定什么值需要更新，然后
    tanh 层会创建一个新的候选值向量 C_t。在极端状态下 sigmoid 输出为零，单元状态不更新。


    更新单元状态的公式为

    $i_t = \sigma(W_i \cdot [h_{t-1}, x_t] + b_i)$

    (3.41)


    式中，W_i为输入门的权重矩阵；b_i为输入门的偏置。


    生成新的单元状态的公式为

    $C''_t = \tanh(W_C \cdot [h_{t-1}, x_t] + b_C)$

    (3.42)


    生成新的单元状态是将旧单元状态 C_{t-1} 更新为新的单元状态 C''_t，其过程是将 C_{t-1} 与 f_t 相乘，丢弃掉需要丢弃的那部分信息，然后加上需要更新的部分
    i_t C''_t。这就是新的单元状态值，根据需要决定每个状态的更新程度。


    更新单元状态的公式为

    $C_t = f_t C_{t-1} + i_t C''_t$

    (3.43)'
