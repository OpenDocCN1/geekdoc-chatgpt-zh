  md: '剪枝就是当α确定时，选择损失函数最小的模型，也就是选择损失函数最小的子树。当α值确定时，子树越大，与样本数据的拟合越好，但是模型的复杂度越高；子树越小，模型的复杂度就越低，但是与样本数据的拟合不好。损失函数正好表示了对两者的平衡。


    决策树中特殊值的处理如下。


    +   1) 连续值处理


    在选择属性时，仅讨论了属性值为离散值的情况，当数据集中样本为连续值时可以采用二分的思想，将连续值化为离散值。由于数据集是有限的，即使是连续值，属性 a 在数据集中也只出现了有限的确定的值，记为
    (a₁, a₂, …, aₙ)，且 a₁ < a₂ < … < aₙ。


    取 n 个值的中点，令


    $t_1 = \frac{a_1 + a_2}{2},\ t_2 = \frac{a_2 + a_3}{2},\ \dots,\ t_{n-1} = \frac{a_{n-1}
    + a_n}{2}$


    便得到了 n−1 个中点 (t₁, t₂, …, tₙ₋₁)，任取一个值 tᵢ (i=1,2,…,n−1) 可以将数据集 D 一分为二，D⁺ 表示 D 中大于
    tᵢ 的数据，D⁻ 表示 D 中小于 tᵢ 的数据，选择最大信息增益的划分点作为最优划分点，则有


    $\text{Gain}(D,a)=\max_t \text{Gain}(D,a,t)$

    $=\max_t \text{Ent}(D)-\sum_{\lambda\in\{+,-\}}\frac{|D^\lambda|}{|D|}\text{Ent}(D^\lambda)\quad(3.12)$


    +   2) 缺失值处理


    在某些属性值缺失时，若采取简单的剔除处理，会造成大量的信息浪费，因此在属性值缺失的情况下，选择划分属性或给定属性将样本划分至具体的分支至关重要。


    假定给样本集中的每一个样本都赋予一个权重，根节点中的权重初始化为1，则有如下定义：


    $\rho = \frac{\sum_{x\in D} w_x}{\sum_{x\in D} w_x}\quad(3.13)$


    $\tilde{\rho}=\frac{\sum_{x\in D_k} w_x}{\sum_{x\in D} w_x},\ 1\le k\le |V|\quad(3.14)$'
