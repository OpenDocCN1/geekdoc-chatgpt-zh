    本部分利用并联卷积神经网络 (P-CNN) 在图像识别领域的优势，将直流系统故障幅值特征和频率特征形成灰度图，再用 P-CNN 进行识别。


    在 10kHz 采样器下，取得 5 个电气量的 20 个信息点组成的待诊断波形，采集信息时间为 2ms。同时提取录波器中从当前时刻的前 1s 时刻开始的 20
    个信息点组成正常状态波形，把两段信号首尾相连接到一起，并用式 (5.28) 进行幅值特征提取，结果如图 5.9 所示，其中，区域①为 5×20 的正常状态波形；区域②为
    5×20 的待诊断状态波形。


    把两段信号的每一个电气量波形做 3 层小波包分析，把正常信号的所有小波包分析结果都放至区域③，把故障信号的所有小波包分析结果都放至区域④，其中，区域③为 5×8×20
