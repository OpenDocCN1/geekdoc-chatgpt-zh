    图 3.27 深度强化学习算法 Q 值网络


    深度强化学习算法使用神经网络作为 Q 值的逼近函数，拟合的权重和偏置用 θ 来表示，则有损失函数：


    $$L(S,a|\theta_i)\approx\left[r+\gamma\max_{a''}Q(S'',a''|\theta_i)-Q(S,a|\theta_i)\right]^2\tag{3.58}$$


    $$\theta_{i+1}=\theta_i+\alpha\nabla\theta L(\theta_i)\tag{3.59}$$


    在深度强化学习算法中，深度学习要求样本之间不具有相关性，而且若使用同一个网络来生成 Q 值表，则会导致振荡甚至发散，因此通过经验重现、目标网络来解决这个问题。经验重现是指在智能体与环境状态交互的过程中，经验会以
    $(S_t,a_t,r_t,S_{t+1})$ 的形式存在在经验池 $D$ 中，每次随机地从经验池中抽样出一批数据来进行训练，这样就可以在一定程度上消除样本之间的相关性；目标网络是指深度强化学习中同时使用两个网络，一个是与环境交互并不断更新的当前网络；另一个是不与环境状态交互，隔一定时间更新一次的目标网络，其每次更新都是把当前网络参数直接赋值给它。则损失函数可定义为


    $$L_i(\theta_i)=E_{(S,a,r,S'')\sim D}\left[(y_i-Q(S,a|\theta_i))^2\right]\tag{3.60}$$


    式中


    $$y_i=r+\gamma\max_{a''}Q(S'',a''|\theta^-)\tag{3.61}$$


    深度强化学习算法的流程如下：


    用 $Q(S,a|\theta_i)$ 表示当前网络的输出，来评估当前状态动作的函数；用 $Q(S'',a''|\theta^-)$ 表示目标网络的输出，当智能体对环境状态采取动作
    $a$ 时就可以计算出 $Q$ 并根据损失函数更新当前网络的参数，经过一定次数的迭代，当前网络将其参数复制给目标网络，完成一次学习过程，其过程如图 3.28
    所示。


