    # 5.3 基于模拟退火算法的高压输电线路故障定位


    高压输电线路发生故障，会造成重大的经济损失并严重影响工业生产及居民生活。因此，需要帮助抢修人员及时确定故障位置，减少输电线路故障造成的停电损失与影响。最初的线路故障定位方法是由美国学者
    Allen 和 Gross 于 20 世纪初提出的，随着技术的不断改进，利用故障行波判断故障点的技术被提出。目前应用最广泛的是基于行波法的双端不同时测距技术。该方法的实质是通过搭建故障模型建立测距方程组，其核心是对方程组的求解。传统牛顿法存在求解速度慢且对初始值选取要求高的缺点，因此在人工智能算法充分发展的今天，利用模拟退火法求取初步解作为牛顿法的初始值，再利用牛顿法获得最终解，在提高运算准确率的同时能有效降低智能算法较大的计算量问题[24]。


    # 5.3.1 输电线路故障定位原理


    高压输电线路在发生故障时的简化模型如图 5.6 所示，f 为故障发生点，M 和 N 为输电线路上相距 l 的两测量端点，假设故障点与 M 点之间的距离为 k
    l，0≤k≤l。根据双端测距法可得测距方程为


    $$\begin{cases}U_{Mf(\lambda)}=U_{M(\lambda)}k l \cosh \gamma_{(\lambda)}-I_{M(\lambda)}Z_{c(\lambda)}k
    l \sinh \gamma_{(\lambda)}\\U_{Nf(\lambda)}=U_{N(\lambda)}(1-k)l \cosh \gamma_{(\lambda)}-I_{N(\lambda)}Z_{c(\lambda)}(1-k)l
    \sinh \gamma_{(\lambda)}\end{cases}\tag{5.20}$$


    式中，λ 为 0、1、2，分别对应线路电参数的零序分量、正序分量和负序分量；U_{Mf(λ)}、U_{Nf(λ)} 分别为 M 和 N 端点数据计算得到的故障点电压；U_{M(λ)}、U_{N(λ)}、'
