    # 2) 高斯朴素贝叶斯算法


    高斯朴素贝叶斯算法是指当特征属性为连续值，并且分布服从高斯分布时，在计算 P(x|y) 时可以直接使用高斯分布的概率公式，即


    $$g(\pi,\eta,\sigma)=\frac{1}{\sqrt{2\pi}\sigma}e^{\frac{-(x-\eta)^2}{2\sigma^2}}\tag{3.2}$$
    $$P(x_i|y_k)=g(x_i,\eta_{i,y_k},\sigma_{i,y_k})\tag{3.3}$$


    # 3) 伯努利朴素贝叶斯算法


    伯努利朴素贝叶斯算法是指当特征属性为连续值，并且分布服从伯努利分布时，在计算 P(x|y) 时可以直接使用伯努利分布的概率公式，即


    $$P(x|p)=\begin{cases}p^x q^{1-x}, & x=0,1\\0, & \text{其他}\end{cases}\tag{3.4}$$
    $$E(x)=p\tag{3.5}$$ $$D(x)=p(1-p)\tag{3.6}$$ $$P(x_k|y)=P(1|y)x_k+(1-P(1|y))+(1-x_k)\tag{3.7}$$'
