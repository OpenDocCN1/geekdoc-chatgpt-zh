    ight]\\tag{6.76}$$\n\n式中，$C_q(t)$为 $t$ 时刻系统运行费用；$C_f(t)$为 $t$ 时刻系统的燃料费用；$C_{R,cost}(t)$为\
    \ $t$ 时刻系统中风机、光伏发电机组的维护费用；$C_s(t)$为 $t$ 时刻系统与大电网并网时电量交易费用。\n\n# 1) 系统燃料费用\n\n\
    多能源系统中提供能量的机组有风机、光伏发电机组、CHP 单元、大电网，其中风机、光伏发电机组可将可再生的风能、太阳能转化为电能，在能量转换过程中不消耗燃料；CHP\
    \ 单元将不可再生的天然气转化为电能和热能，在能量转换的过程中消耗化石燃料；大电网在多能源系统输出功率不足时向多能源系统提供电能，在这个过程中不考虑大电网产生电能的过程，故此过程不消耗燃料。本节系统中机组燃料费用只考虑\
    \ CHP 单元提供能量所需燃料费用：\n\n$$C_f(t)=\\int_{0}^{\tau}C_n(t)\\cdot V(t)dt\\tag{6.77}$$\n\
    \n式中，$C_n(t)$为 $t$ 时刻天然气的价格；$V(t)$为 $t$ 时刻 CHP 单元所消耗的天然气的体积；$\tau=1,2,\\cdots,24$。\n\
    \n通过曲线拟合，得到 CHP 单元效率与净输电功率的关系为\n\n$$\\eta_{MT}=0.0753\\left(\\frac{P_{CHP}}{65}\\\
    right)^3-0.3095\\left(\\frac{P_{CHP}}{65}\\right)^2+0.4174\\left(\\frac{P_{CHP}}{65}\\\
    right)+0.1068\\tag{6.78}$$\n\n式中，$\\eta_{MT}$为 CHP 单元的净发电效率；$P_{CHP}$为 CHP 单元净输电功率。\n\
    \n$$Q_{MT}=\\frac{P_{CHP}\\left(1-\\eta_{MT}-\\eta_L\\right)}{\\eta_{MT}}\\tag{6.79}$$\n\
    \n式中，$Q_{MT}$为 CHP 单元的输出热功率；$\\eta_L$为 CHP 单元的散热损失系数。\n\n# 2) 机组维护费用\n\n多能源系统中清洁能源发电包括风力发电、光伏发电，虽然清洁能源发电机组不考虑燃料费用，但是其安装费用和维护费用较高，故在优化控制的过程中需考虑清洁能源的维护费用：\n\
    \n$$C_{R,cost}(t)=\\sum_{i=1}^{n}\\left(R_W\\cdot g_W(t)\\cdot f_W+R_P\\cdot g_P(t)\\\
    cdot f_P\\right)\\tag{6.80}$$"
