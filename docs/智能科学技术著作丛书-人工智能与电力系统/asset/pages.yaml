    DE 在较低负载情况下出力时，其供能的效率比较低，将导致燃料消耗大，使得其运行不够经济，因此应制定 DE 出力的下限约束，使其在系统负载电能需求大于其出力下限约束时才投入运行。若
    DE 在小于其出力上限约束的情况下运行，则能够为负载提供足够的电能，比较 DE 出力支出费用的大小和其出力进行并网时的电价，若出力支出费用较同时段内向电网销售电能的价格低，则允许
