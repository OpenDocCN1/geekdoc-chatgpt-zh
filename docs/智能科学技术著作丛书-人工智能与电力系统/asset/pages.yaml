- pgno: 148
  md: '# 2) 频率特征提取


    当 MTDC 系统发生短路故障时，线路电流、电压会产生高频分量，通过检测这些信息可以实现故障分类和定位。相比于小波分析，小波包分析将频带进行多层次划分，对多分辨分析没有细分的高频部分进一步分解，并能够根据分析信号的特征，自适应地选择相应的频带，使其与信号频谱相匹配，从而提高时频分辨率。本节采用小波包分析的方法，对直流端两极电压、正极电流、负极电流、正极电压和负极电压
    5 种电气量进行 3 层小波包重构，提取各频段频率特征，实现频率特征提取。式 (5.29) 为小波包分解算法和小波包重构算法：


    ```

    ⎧ d_{j,l,2n} = √2 Σ_k h_{0,k-2l} d_{j+1,k,n}

    ⎨ d_{j,l,2n+1} = √2 Σ_k h_{1,k-2l} d_{j+1,k,n}

    ⎩ d_{j+1,l,n} = Σ_k h_{0,k-2l} d_{j,k,2n} + h_{1,k-2l} d_{j,l,2n+1}

    (5.29)

    ```


    式中，d_{j+1,k,n} 为上一层小波包分解的结果；d_{j,k,2n}、d_{j,l,2n+1} 为下一级的小波包分解结果；j 为尺度指标；n 为频率指标；l
    为位置指标；k 为变量；h_{0,k-2l}、h_{1,k-2l} 为分解采用的第 k-2l 个多分辨率滤波器系数。


    # 5.4.2 P-CNN 构建


