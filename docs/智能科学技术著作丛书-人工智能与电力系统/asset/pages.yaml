- pgno: 161
  md: '# 5.5.2 基于改进卷积神经网络的变压器故障在线定位技术


    工程中现有的变压器故障定位通常局限于检修人员的离线开箱检查以确定故障具体位置，这类定位方式具有很大的盲目性和时滞性，存在较大的人力与财力资源浪费。且由前文分析可知，变压器的振动可由绕组、铁芯等零部件的故障引起，绕组和铁芯还分别细化为
    A 相、B 相、C 相，此外在振动方向上还可分为轴向振动和辐向振动，这些都为振动信号特征的提取、分析及振源位置的确定带来了很大困难。振动信号采样频率要明显高于气体信号的采样频率，因此用于气体的卷积神经网络结构并不适用在振动信号中。


    本节针对以上两个问题首先设计变压器振动信号的在线监测系统，确定振动信号传感器的种类与采集位置；然后提出针对变压器机械故障和多传感器振动信号输入的故障检测与定位卷积神经网络（fault
    detection and location-CNN, FDL-CNN），既能实时在线定位发生故障的零部件，又能确定故障发生的方位。


    # 1. 变压器振动信号在线监测方法研究


    振动分析法利用置于变压器箱体外壁的传感器来采集振动信号，与电力系统没有电气连接，对系统没有干扰，是一种安全可靠的在线监测手段，也是实现变压器故障在线定位的基础。


    本节的变压器振动信号在线监测需要获取变压器油箱壁多点振动信号，因此该方法要利用若干振动信号传感器和信号装置，如图 5.19 所示。多路传感器采集到的振动信号经信号放大装置调理后由采集装置采集、存储并传输给下一级故障定位终端装置。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_161_0.png)


    # 2. 振动信号传感器


    在选择振动传感器时需要考虑的性能指标主要有灵敏度、漂移度、测量范围、输出范围等，而在实际应用中，确定性、可靠性和适应性同样是需要考虑的重要因素。确定性可保证一定的准确性、灵敏性和稳定性；可靠性可保证在适当成本'
  merge: -1
  img_proc: true
- pgno: 162
  md: '的前提下具有较长的使用寿命；适应性可保证较快较好地适应工作时的外界环境温度，且受环境影响较小。


    目前用于测量振动信号的传感器主要有三类，分别为位移传感器、速度传感器、加速度传感器，三者的性能比较如表 5.13 所示。


    # 表 5.13 振动信号传感器的性能比较


    | 项目 | 位移传感器 | 速度传感器 | 加速度传感器 |

    |---|---|---|---|

    | 频率/kHz | 0~0.01 | 0.01~1 | 0.3~10 |

    | 温度范围/℃ | -40~180 | -40~120 | -50~120 |

    | 性能比较 | 灵敏度高，结构简单，可进行非接触测量，不受油污等其他介质的影响 | 灵敏度高，输出信号大，但不够坚固 | 体积小，工作频率范围宽，可在强磁场、大电流、潮湿环境中进行测量
    |


    在低频范围内使用位移传感器最有效，当被测物体表面与传感器探头之间发生相对位移时，探头上的高频电源所产生的电磁场能量发生变化，相对位移可由此测出。位移传感器通常用来测量重型机座的偏心度和振动。


    速度传感器的原理主要是将永磁铁置于线圈内，再将线圈贴于传感器的外壳上，最后将传感器探头安装在被测物体的表面；当被测物体振动时，永磁铁和线圈之间发生相对位移，线圈上产生感应电动势，根据其测量值来判定振动速度。速度传感器的优点是其输出信号较大，但不够坚固；通常利用速度传感器测量电机的振动均方值。


    压电式加速度传感器是应用较为广泛的加速度传感器，具有灵敏度高、测量效果好等优点。加速度是位移的二阶导数，因此在三种传感器中它的灵敏度最高。本节选择压电式加速度传感器，如图
    5.20 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_162_0.png)'
