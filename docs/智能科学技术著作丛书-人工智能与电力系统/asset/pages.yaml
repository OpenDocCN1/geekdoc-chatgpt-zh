    # 6.5.2 含梯级水电站的水火电联合优化调度方法


    # 1. 基于集合方法求解含梯级水电站水火电联合优化调度


    目前提出的免疫算法有很多种，本节采用以抗体片段表示机组启停状态的免疫算法。假设每个抗体有 $N$ 个片段，并对应 $N$ 台机组；每个抗体片段有 NT 个位，对应
    NT 个时段。每台机组的抗体片段记忆库中有 $M$ 个片段，用于保存具有优势特征的抗体片段。从每台机组中各抽取一个片段构成一个抗体。抗体经过克隆变异筛选之后，优秀的抗体被记忆保存，并将抗体片段分解更新到抗体片段记忆库中。


    梯级水电站之间存在水力和电力联系，表现为各水电机组的启停和出力并不是独立的，其会受到相邻水电站机组运行状况的制约。若上游水库的排水一直保持在较大流量，则下游的机组在一定的延迟后必然要保持较高的出力运行，以保证水库的水位在安全范围之内，因此梯级水电站的水电机组组合并非随意无序的自由组合，而是一个紧密联系的整体组合，在工程中梯级水电站必须考虑水电站之间的水电联系，来进行统一调度。


    根据梯级水电站的上述特点和免疫算法的记忆机制，本节引入“集合”的思想，将同一流域的梯级水电站作为一个集合整体进行编码。利用免疫算法的记忆机制，对梯级水电站的机组统一处理，将每次迭代后记忆最优的水电机组组成抗'
  merge: -1
  img_proc: true
