  md: "这些特殊的函数称为核函数，在支持向量机的理论基础中介绍过。只要核函数 $k(X_i, X_j)$ 满足 Mercer 条件，它就对应某一变换空间中的内积。\n\
    \n此时，目标函数变为\n\n$$\\max H(a)=\\sum_{i=1}^{n} a_i - \\frac{1}{2}\\sum_{i=1}^{n}\\\
    sum_{j=1}^{n} y_i y_j a_i a_j k(X_i,X_j)$$  \ns.t. $\\sum_{i=1}^{n} y_i a_i =0,\\\
    \ a_i \\ge 0,\\ i=1,2,\\cdots,n$  (3.24)\n\n相应的判别函数变为\n\n$$f(x)=\\sum_{i=1}^{n}\
    \ y_i a_i^* k(X_i,X)+b^*$$  (3.25)\n\n支持向量机用输入空间的核函数取代了高维特征空间中的内积运算，解决了算法可能导致“高维灾难”问题。在构造判别函数时，不是先对输入空间的样本做非线性变换，然后在特征空间中求解；而是先在输入空间比较向量(内积或是某种距离)，对结果再做线性变换。这样，大部分工作量将在输入空间中完成而不在高维特征空间中完成。\n\
    \n支持向量机判别函数形式上类似于一个神经网络，输出是 $M$ 个中间节点的线性组合，每个中间节点对应一个支持向量，其网络结构如图 3.6 所示。\n\n\
