  md: '# 4) 分配系数约束


    分配系数约束如下：


    0 < ν_γ < 1  (6.60)


    ∑_γ ν_γ = 1  (6.61)


    式中， ν_γ 为某种形式能源分配到不同能源转换装置的分配系数； γ 为能源转换装置个数。


    # 5) 负荷旋转备用约束


    为应对系统突发状况，含高渗透率可再生能源的多能源系统在优化配置中需要为系统预留部分旋转备用，并在能量枢纽中起到修正可靠性指标的作用。


    ∑_k ∑_i I_{ik,t} × \bar{P}_i ≥ L_t + R_t  (6.62)


    式中， \bar{P}_i 为系统全部供能单元功率上限； R_t 为第 t 时段的系统总备用。


    R_t = ∑_γ R_{γ,t}  (6.63)


    式中， R_{γ,t} 为第 t 时段的组件 γ 的备用容量。


    # 6) 可靠性约束


    (1) 能量未供应期望约束：


    EENS ≤ EENS_max  (6.64)


    式中， EENS_max 为能量未供应期望指标值上限。


    (2) 失负荷期望：


    LOLE ≤ LOLE_max  (6.65)


    式中， LOLE_max 为失负荷期望指标值上限。


    # 6.2.3 基于双层优化的能量枢纽最优求解方法


    将能量枢纽优化设计问题分解为能量枢纽设计容量配置问题和系统能量分配问题进行求解。传统能量枢纽容量配置和能量分配单独求解的模型及方法容易使优化结果陷入局部最优解[38]。双层规划可以同时考虑能量枢纽配置和运行调度，构建基于双层优化的能量枢纽优化设计模型求解流程如图
    6.16 所示。'
