- pgno: 78
  md: '系能力，为了克服传统循环神经网络的这一缺陷，经过长时间的研究，引入了长短期记忆网络。当不再需要时间较为久远的信息时，长短期记忆单元可以让网络忘记旧的单元状态，然后将新的数据流入下一单元进行状态更新，通过调节权重使时间序列上的部分时间节点对当前的时间节点产生影响。这样可以提高循环神经网络对较长时间延迟的灵敏度，进而可以捕获任意时间状态之间的相关信息[13]。


    长短期记忆网络的神经元内部结构如图 3.17 所示。由图中可以看出，长短期记忆网络的输入有三个，分别为当前网络的输入值 x_t、上一时刻的输出值 h_{t-1}
    和上一时刻的单元状态 C_{t-1}。而长短期记忆网络的输出有两个，即当前时刻的输出值 h_t 和当前时刻的状态 C_t。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_78_0.png)


    图 3.17 长短期记忆网络的神经元内部结构


    长短期记忆网络引入了三个门结构对单元状态进行控制，分别是遗忘门、输入门和输出门。门的作用就是让信息有选择性地通过，来删除或者增加信息到单元状态，下面对长短期记忆网络的结构进行详细的介绍。


    长短期记忆网络的门结构可以表示如下：


    g(x)=σ(Wx+b)  (3.39)


    式中，W 为门的权重矩阵；b 为偏置；σ 为 sigmoid 函数，其输出为 0～1 的一个概率值，用来描述有多少信息可以通过，输出为 0 表示信息无法通过，输出为
    1 表示信息可以全部通过。


    +   (1) 遗忘门。


    遗忘门用来判断是否将继续保持上一时刻细胞状态，这就意味着在传输的过程中需要决定在细胞状态中丢弃什么信息。把 h_{t-1} 和 x_t 拼接起来传给一个 sigmoid
    函数将得到一个在 0～1 的值，这个值为遗忘因子，再将细胞状态值 C_{t-1} 与遗忘因子相乘，这一过程为遗忘门的数学原理。


    遗忘门的公式为'
