  md: '决策树算法的基本流程如图 3.5 所示。决策树通过建树和剪枝过程实现，在剪枝过程中，通过确定决策树的整体损失函数的极小值，来确定从已经生成的树上裁掉哪些子树或叶节点，并将其根节点或父节点作为新的叶节点，从而简化决策树。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_61_0.png)


    图 3.5 决策树算法的基本流程图


    定义决策树的损失函数 Cα(T) 如下：


    Cα(T)=∑_{t=1}^{|T|} N_t H_t(T)+α(T)=C(T)+α(T)  (3.11)


    式中，T 为这棵子树的叶节点；H_t(T) 为第 t 个叶节点的熵；N_t 为该叶节点所包含的样本数量；C(T) 为模型对样本数据的预测误差，C(T)=∑_{t=1}^{|T|}
    N_t H_t(T)，即树模型与样本数据的拟合程度；α 为惩罚系数，当 α 较小时选择较复杂的树，而当 α 较大时选择较简单的树，α=0 意味着只考虑树与样本数据的拟合程度，不考虑树的复杂度。'
