    # 2) 人工神经网络的结构


    多层神经网络由三部分组成，即输入层、隐含层和输出层。


    每一层都是由单元组成的，其中，输入层是由训练集中实例特征向量传入，根据连接点之间的权重传递到下一层，这样一层一层向前传递。输入层和输出层都只有一层，隐含层的个数可以是任意的。神经网络的层数计算不包括输入层，例如，一个神经网络中有
    2 个隐含层，则称这是一个 3 层的神经网络。作为多层前向神经网络，理论上，有足够多的隐含层和训练集，就可以模拟出任何方程。


    神经网络可以用来解决分类问题，也可以解决回归问题。


    (1) 单层神经网络：两个或多个神经元并联构成单层神经网络，它还有个别名——感知器。如图 3.9 所示，其中有 2 个输入 x1、x2，连接线的权重分别为
    w1,1、w1,2、w1,3、w2,1、w2,2、w2,3。将输入与权重进行相乘然后求和，作为 y 单元的输入，设定 y 单元是函数 f。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_71_0.png)


    (2) 多层神经网络：多层神经网络与单层神经网络的区别是多层神经网络含有一个或者多个隐含层，其中计算节点称为隐含层神经元或隐含单元，如图 3.10 所示。在多层神经网络中，只不过是将输出作为下一层的输入，一样是输入乘以权重然后求和。


