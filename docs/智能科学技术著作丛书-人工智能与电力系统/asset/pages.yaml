    # 3.3.2 卷积神经网络


    卷积神经网络是一类包含卷积计算且具有深度结构的前馈神经网络，是深度学习的代表算法之一。卷积神经网络具有表征学习的能力，能够按其阶层结构对输入信息进行平移不变分类。


    +   1. 卷积神经网络的理论基础


    卷积神经网络由三个部分组成，分别是卷积层、池化层和全连接层，原始图像从输入端输入后经过卷积层和池化层处理后到达全连接层最后得以输出，下面是对这一过程的分步介绍。


    +   1) 卷积层


    卷积层的目的是从输入图像中提取重要的特征，卷积核是卷积层中的重要部分，在数据处理的过程中起到了扫描仪的作用，输入的数据通过卷积核的多次扫描后图像中的重要特征就被提取出来了。


    假设有一幅像素为 32×32×3 的图像，这里的 32×32 表示图像的长度和宽度都为 32，而 3 表示该图像具有 3 个色彩通道，通常情况下为红色(R)、绿色(G)、蓝色(B)。将卷积核定义为一个像素为
    3×3×3 的区域，与之前所述类似，前面的两个 3 表示该区域的长度和宽度都为 3，最后一个 3 表示具有 3 个色彩通道，'
  merge: -1
  img_proc: true
- pgno: 73
  md: '分别为 R、G、B。在这里将卷积过程简化，用一个像素为 5×5×1 的单通道的图像进行卷积操作，其过程如图 3.12 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_73_0.png)


    图 3.12 卷积过程


    一般会用一个正方形的卷积核扫描图像上的每一个像素点，图像区域内相对应的每一个像素值乘以卷积核内相对应点的权重求和再加上像素值。卷积层的计算公式为


    $X_j^l = f\left(\sum_{i\in M_j} X_i^{l-1} * K_{ij}^l + b_j^l\right)\quad(3.32)$


    式中，$X_j^l$ 为第 $l$ 层的第 $j$ 个值；$K_{ij}^l$ 为卷积核函数；$*$ 为一维卷积运算；$b_j^l$ 为偏置参数；$M_j$
    为选择输入特征值集合，可以从这个集合中选取某个组合作为输出特征图；$f(\cdot)$ 为激励函数。


    卷积核每滑动一次会计算得到输出图像中的一个值，从输入图像的左上角开始滑动到输入图像的右下角结束，输出图像边长的计算公式为


    输出图像边长 = $\frac{\text{输入图像边长} - \text{卷积核边长} + 1}{\text{步长}}$\quad(3.33)


    为了保证输出图像的尺寸与输入图像的尺寸一致，通常会将输入图像的外围进行全零填充 (padding)，这样做是为了使卷积核能够扫描到输入图像的全部像素，其过程如图
    3.13 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_73_1.png)


