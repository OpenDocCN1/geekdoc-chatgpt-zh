    # 4.2 基于 PSO-LSVM 的海水淡化系统负荷预测


    随着全球人口的增长以及气候的不断变化，全球淡水资源严重短缺，这已成为制约经济社会发展的瓶颈之一。作为解决淡水资源紧缺的可选方法，海水淡化在解决全球缺水问题上发挥着越来越重要的作用，尤其是沿海缺水地区和海岛对海水淡化的需求十分迫切。早在“十二五”期间，我国就将海水淡化作为战略性新兴产业进行重点培育发展。当前海水淡化系统整个过程耗电量巨大且设备成本'
  merge: -1
  img_proc: true
- pgno: 104
  md: '较高，因此市场化利用率较低。但是，海水淡化负荷具有可调控性，如果将其与分布式可再生能源或电网结合，通过零边际成本的可再生能源提供电能，可有效降低海水淡化的成本[20]。


    本节针对海水淡化典型负荷特性提出一种基于最小二乘支持向量机 (least squares support vector machine, LSSVM) 的海水淡化负荷预测方法，借鉴了基于历史负荷数据及其影响因素的电力系统日负荷预测算法，其是一种计及多维海水淡化负荷特性、环境特性和用水需求特征量的海水淡化负荷预测方法。基于粒子群优化算法优化最小二乘支持向量机模型预测模型的
    γ 和 σ² 参数，可提高模型在小样本条件下的预测精度，确定影响海水淡化负荷的若干特征量因素，通过灰色关联分析 (grey relational analysis,
    GRA) 选取典型负荷相似日，从而建立最小二乘支持向量机模型的小样本输入数据集；并且提出基于粒子群优化算法改进的最小二乘支持向量机 (PSO-LSSVM)
    模型海水淡化负荷预测算法。


