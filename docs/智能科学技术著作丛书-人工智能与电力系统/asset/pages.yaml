    # 1) 应用马尔可夫算法的电力系统负荷辨识


    由于电力需求侧负荷形态各异，特性多变，种类繁多，采用传统方法进行负荷辨识时存在识别率不高、模型建立困难、难以推广应用等问题，为此有学者提出了一种基于多参量隐马尔可夫模型的负荷辨识方法，该方法采用
