  md: '# 3.4.3 Q学习算法


    Q 学习算法是一种典型的与模型无关的算法，智能体在不知道整体的环境，而只知道当前状态的情况下，通过构建表示从状态 S_t 到下一个状态 S_{t+1} 的动作奖励值的即时奖励矩阵
    R 来选取动作，并且由即时奖励矩阵 R 计算得到行动的 Q 矩阵。算法 Q 值的更新不同于选取动作时所遵循的策略，也就是说 Q 矩阵在更新的时候计算了下一个状态的最大值，但选取最大值时所对应的行动不依赖于当前策略。Q
    学习算法的目标是达到目标状态同时获取最高的收益，并且在达到目标状态后，最终收益将保持不变。


    Q 学习算法始终是选择最优价值的行动，在实际项目中，Q 学习算法充满了冒险性，倾向于大胆尝试，是强化学习发展的里程碑。


