    # 6.2 基于遗传算法的多能源系统能量枢纽优化配置


    含可再生能源的电-气-热互联多能源系统可实现多能源网络互联与多能源优化利用，从而有效解决资源匮乏与能源浪费等问题。能量枢纽是多能源耦合的关键，但现有的能量枢纽优化配置问题未考虑系统运行可靠性的影响。因此，本节重点研究多能源系统中计及可靠性的能量枢纽优化配置问题[36]。


    # 6.2.1 能量枢纽模型


    能量枢纽能够提高多能源系统的运行灵活性，进而增加多能源系统的供给可靠性。本案例针对包含风机、热电联产 (combined heat and power, CHP)
    机组、燃气锅炉、电储 (蓄电池)、热储 (蓄热槽) 的能量枢纽，构建计及可靠性的能量枢纽优化设计模型。


    +   1. 能量枢纽能源转换模型


    能量枢纽是对相互协调的多能源系统的建模，代表能源生产、消耗和传输设备之间的交互。从数学角度看，能量枢纽可以视为一个两端口网络。能量枢纽包含三个基本组件：①能量传输设备，将输入的能量直接传输到输出侧，不将其转换成为另一种形式，如电缆、架空线、管道；②能量转换设备，将不同能源形式进行相互转换，如燃气轮机、内燃机、电动机构、燃料电池等；③储能装置，如蓄电池、燃料电池、蓄热装置等。本节设计的能量枢纽模型包括风机、变压器、CHP
    机组、燃气锅炉、电/热储能等设备，典型能量枢纽实例如图 6.15 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_193_0.png)


    图 6.15 典型能量枢纽实例'
