    代表了集成学习算法的发展高峰，即通过将一些简单的弱分类器集成起来使用，从而达到较高的精度。


    贝叶斯网络诞生于 1985 年，是概率推理的强大工具，其发明者是概率图模型中的重量级人物 Judea Pearl，后来获得了图灵奖；条件随机场是概率图模型中相对年轻的成员，已成功地用于中文分词等自然语言处理以及其他领域，同样也是序列标注问题的有力建模工具。


    # 3. 机器学习算法现期


    近年来深度学习及强化学习在电力系统中的应用也十分广泛，神经网络在非侵入式负荷监控、风电概率预测及故障诊断方面具有突出贡献；马尔可夫算法在负荷辨识方面有重要应用，会在
