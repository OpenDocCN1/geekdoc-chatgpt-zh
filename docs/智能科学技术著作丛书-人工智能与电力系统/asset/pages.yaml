    # 5.4 基于卷积神经网络的多端直流输电线路故障诊断


    随着经济的快速发展和能源紧张的问题，中国东部沿海地区亟须大量电能的支持，而光伏、风电等新能源集中分布在中国西部地区，与大型城市群距离较远，所以大容量远距离输电工程应运而生。高压直流
    (high voltage direct current, HVDC) 输电作为远距离输电方式，相比较交流输电具有故障少、绝缘要求低、不要求同步等优点，倍受关注。'
