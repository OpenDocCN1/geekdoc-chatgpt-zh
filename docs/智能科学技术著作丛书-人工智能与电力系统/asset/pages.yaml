    图 5.11 P-CNN 训练过程


    将预训练的模型参数迁移到新的神经网络模型中。重新训练分类器的方法实际上属于迁移学习。迁移学习包括基于实例的迁移学习、基于特征的迁移学习、基于模型的迁移学习和基于关系的迁移学习[27]。本节应用的是基于模型的迁移学习思想，利用预训练模型的方法可减少
    P-CNN 的训练时间，同时充分利用了模型之间存在的相似性。


    迁移学习是实现 P-CNN 训练过程的一个重要环节。运用迁移学习实现了将两个单独训练的特有功能的神经网络的参数迁移到一个具有并联结构的神经网络上，从而实现
    P-CNN 每个支路具有特定作用的特殊结构。


