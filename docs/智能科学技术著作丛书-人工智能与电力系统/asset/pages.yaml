- pgno: 143
  md: '# 5.3.2 基于模拟退火-改进牛顿迭代法的模型求解


    1. 算法的基本原理


    1) 模拟退火算法


    模拟退火算法是借鉴退火过程发展而来的，主要包括升温、等温和冷却三个过程。模拟退火算法服从 Metropolis 准则，即


    $P(\Delta E, T)=\begin{cases}1, & \Delta E \leqslant 0 \\ e^{-\Delta E / T}, &
    \Delta E > 0\end{cases}$ (5.25)


    式中，$P$ 为模拟退火算法求得当前解被接受的概率；$\Delta E$ 为当前解与前一解的差；$T$ 为退火温度。


    模拟退火算法的实现共有四个步骤：


    +   (1) 初始化。设定算法的初始温度 $T_0$、迭代次数 $l$、衰减次数 $\alpha(0<\alpha<1)$ 以及算法的初始解 $s$。

    +   (2) 开始模拟算法，得到算法的当前解，记作 $s''$。

    +   (3) 计算当前解与上一时刻解的差值 $\Delta E$，并对 $\Delta E$ 的正负进行判断。若该值小于 0，则将新解作为最优解，否则以概率
    $e^{-\Delta E / T}$ 更新当前最优解。

    +   (4) 判断当前最优解是否满足条件，若达到精度要求或达到最大迭代次数则输出当前最优解；若不满足结束条件，则更新模拟退火温度值并返回 (2) 进行下一轮的迭代计算。


    2) 牛顿迭代法及其改进


    由于具有较好的二阶收敛特性，牛顿迭代常用于非线性方程组的求解。对于一个非线性方程 $f(x)=0$，记方程的待求根为 $x^*$，该方程的一个近似解记作 $x_0$。则可利用泰勒公式将其展开，并令展开式为零，便可得到初步的近似解
    $x_1$，再对 $x_1$ 利用泰勒级数展开，如此往复便可得到满足精度要求的方程解 $x_{n+1}$。因此，牛顿迭代法的本质是不动点迭代。牛顿迭代法的二阶收敛性对初始解的选取具有较高的要求，且收敛速度慢，不适宜较复杂的电力系统计算，为此对牛顿迭代法进行改进，使其具有三阶收敛性。牛顿迭代法的三阶收敛方程$^{[25]}$为


    $\begin{cases}z_n = x_n - \dfrac{f(x_n)}{f''(x_n)} \\ x_{n+1}= x_n - \dfrac{f(x_n)}{6}\left(\dfrac{1}{f''(x_n)}+\dfrac{4}{f''\left(\dfrac{x_n+z_n}{2}\right)}+\dfrac{1}{f''(z_n)}\right),\quad
    n=0,1,2,\cdots\end{cases}$ (5.26)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '式(5.26)虽然能够提高收敛性，但是需要求三次导数值，从而加大了计算量，


    为了减小计算复杂度，将式(5.26)中的 $f''(z_n)$ 以及 $f''\left(\frac{x_n+z_n}{2}\right)$ 在 $x_n$
    处利用泰勒级数展开并代入式(5.26)中，得到


    $x_{n+1}=x_n-\frac{f(x_n)}{6}\left(\frac{1}{f''(x_n)}+\frac{f''(x_n)}{f^2(x_n)-f(x_n)f''''(x_n)}+\frac{4f''(x_n)}{f^2(x_n)-\frac{f(x_n)f''''(x_n)}{2}}\right),\quad
    n=0,1,2,\dots$ (5.27)


    经改进后，由式(5.27)所示的表达式对导数值的求取降低为两次，有效减少了计算量，节约了计算时间。


    # 2. 模拟退火-改进牛顿迭代法求解步骤


    模拟退火-改进牛顿迭代法解方程步骤如图 5.7 所示。模拟退火-改进牛顿迭代法是将两种方法进行结合，将模拟退火算法初求取低精度的解作为改进牛顿迭代法的初始解，避免因初始解选取不当导致牛顿迭代法不收敛。算法的准备工作依然是设置模拟退火算法的初始温度
    $T_0$、迭代次数 $l$、衰减系数 $\alpha$ 等基本算法


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_144_0.png)


    图 5.7 模拟退火-改进牛顿迭代法解方程步骤'
