    图 3.16 标准循环神经网络


    根据图 3.16 的标准循环神经网络可得如下公式：


    $h_t = f(W_{xh}x_t + h_{t-1})$  (3.35)


    $y_t = g(W_{hy}h_t)$  (3.36)


    式中，$x_t$ 为 $t$ 时刻的输入向量；$y_t$ 为 $t$ 时刻的输出向量；$h_{t-1}$ 为 $t-1$ 时刻的状态向量；$W_{xh}$
    为输入层到隐含层的权重矩阵；$W_{hy}$ 为隐含层到输出层的权重矩阵；$f(\cdot)$ 为隐含层的激励函数；$g(\cdot)$ 为输出层的激励函数。


    对于神经网络，不同的激励函数会影响模型的性能。隐含层常用的激励函数有 sigmoid、tanh 和修正线性单元。输出层常用的输出函数主要为 linear 和
    softmax，公式如下：


    linear$(x) = a x$, $a \neq 0$  (3.37)


    softmax$(x_i) = \frac{e^{x_i}}{\sum_{k=1}^{K} e^{x_k}}$  (3.38)


    式中，$x_i$ 为 $x$ 的第 $i$ 个分量，$i$ 与 $k$ 的取值范围是 $\{1,2,\cdots,K\}$，$K$ 为输出神经元的个数。


    # 2) 长短期记忆网络


    长短期记忆网络于 1997 年由 Hochreate 和 Schmidhuber 提出，是循环神经网络的一种，但长短期记忆网络的隐含层比循环神经网络的更加复杂。由于传统的循环神经网络的每个隐含单元内只是一个简单的
    tanh 或 ReLU 的操作，在对参数的学习过程中容易出现梯度消失或梯度爆炸的问题，会影响其长期时间序列的关系'
