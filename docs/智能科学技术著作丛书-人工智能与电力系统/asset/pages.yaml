  md: '# 第1章 绪论


    # 1.1 人工智能发展综述


    # 1.1.1 人工智能概述


    人工智能 (artificial intelligence, AI)，一般认为起源于美国 1956 年夏季的达特茅斯会议，在这次会议上，John McCarthy
    第一次提出了 “artificial intelligence” 这个词。人工智能是在科学技术迅速发展及新思想、新理论、新技术不断涌现形势下产生的学科，也是涉及数学、计算机科学、哲学、心理学、信息论以及控制论等学科的交叉和边缘学科。它是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的新技术科学，企图了解智能的实质，并产出一种新的、能以人类智能相似的方式做出反应的智能机器。该领域的研究包括机器人、语言识别、图像识别、自然语言处理和专家系统等，人工智能是对人的意识、思维过程的模拟，不是人的智能，但能像人那样思考，也可能超过人的智能。


    20 世纪 40~50 年代，人工智能处于萌芽阶段。由于计算机的出现，人类开始探索用计算机代替或扩展人类的部分脑力劳动。1949 年，Donald Hebb
    首次提出基于神经心理学的人工神经网络；1950 年，Alan Turing 创造了图灵测试来判定计算机是否智能；同年，Samuel Arthur 开发了一只跳棋程序。


    20 世纪 50~60 年代，人工智能处于形成阶段。1956 年，在美国达特茅斯会议上，人工智能的概念开始出现。当时，一批数学家、信息学家、心理学家、神经生理学家及计算机科学家聚在一起，探讨用机器来模仿人类智能并提出了人工智能的概念。此后，人工智能的研究集中在数学和自然语言领域。1957
    年，Frank Rosenblatt 设计出计算机神经网络感知机数学模型；1959 年，Oliver Selridge 推出字符识别程序；1965 年，Roberts
    编制出可以分辨积木三维构造的程序；1969 年第一届国际人工智能联合会议的召开，标志着人工智能得到了国际上的认可。


    20 世纪 70~90 年代，人工智能进入发展阶段。70 年代，人工智能从理论走向应用，知识工程和专家系统成为主流。1974 年，Paul Werbos 首次提出反向传播
    (back propagation, BP) 算法；1975 年，斯坦福大学推出基于知识的科学推理程序 Meta-DENDRAL；1977 年，Edward
    Albert Feigenbaum 提出知识工程的概念。80 年代，机器学习成为人工智能领域的研究热点。1980 年，美国召开的第一届机器'
  merge: -1
  img_proc: true
- pgno: 13
  md: '学习国际研讨会，标志着机器学习的兴起。自此，机器学习理论蓬勃发展。1981年，Kohenl 提出了自组织映射神经网络；同年，Werbos 提出多层感知器；1982年，John
    Hopfield提出了模拟人脑的 Hopfield 循环神经网络；1985 年，Hinton 等提出了玻尔兹曼机；1986 年，Hinton 等提出用于深度神经网络的反向传播算法；同年，Ross
    Quinlan 提出了决策树算法，Rumelhart 等提出了多层感知机与反向传播训练相结合的方法。1995 年，Vladmir Vapnik 等提出了支持向量机；1997
    年，Freund 等提出了 Adaboost 算法。


    20 世纪 90 年代末期至今，人工智能进入成熟阶段。90 年代末，深度学习研究兴起。1998 年，Y. LeCun 等提出的卷积神经网络是深度学习的代表算法之一。21
    世纪，人工智能的发展日益成熟，机器学习和深度学习成为人工智能的研究主流，并在各行业得到了广泛的应用。2001 年，William Cleveland 提出了数据挖掘的概念；2006
    年，Hinton 等提出了深度学习的概念；2015 年 Nature 发表了 Y. LeCun 等关于深度学习的综述，标志着深度学习被学术界真正接受；2016
