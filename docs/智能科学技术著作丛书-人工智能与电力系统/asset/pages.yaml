    # 5.2 基于马尔可夫模型的负荷辨识


    针对低频采样下负荷辨识准确率低和辨识精度低的问题，本节提出基于多特征融合的家用负荷辨识算法：首先建立整数规划模型求解负荷存在的可能性，以降低负荷辨识的计算维度；然后基于滑动时间窗口算法获得组合功率序列和原始功率序列，提取两者功率序列的统计特征值和奇异值，以弥补描述负荷特征信息不足的情况，并利用概率神经网络
    (probabilistic neural network, PNN) 与 D-S 证据理论进行多特征融合，并将融合结果作为隐马尔可夫模型 (hidden
    Markov model, HMM) 的观察值序列，最后基于 HMM 的序列信息融合完成家用负荷的再辨识，并获得各个负荷耗电量的估计值。HMM 的建立主要考虑到各个负荷在运行过程中不仅与该时刻的功率值有关，还受上一时刻功率状态的间接影响，仅基于负荷'
