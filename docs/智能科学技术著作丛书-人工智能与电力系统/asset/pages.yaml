- pgno: 82
  md: '使得智能体选择的行为能够获得环境最大的奖励，外部环境对学习系统在某种意义下的评价(或整个系统的运行性能)为最佳，其基本原理框图如图 3.20 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_82_0.png)


    图 3.20 强化学习基本原理框图


    由强化学习基本原理图可知，强化学习把学习看作试探评价过程，智能体选择一个动作用于环境，环境接受该动作后状态发生变化，同时产生一个强化信号(奖或惩)反馈给智能体，智能体根据强化信号和环境当前状态再选择下一个动作，选择的原则是使受到正强化(奖)的概率增大。选择的动作不仅影响立即强化值，而且影响环境下一时刻的状态及最终的强化值。


    强化学习不同于连接主义学习中的监督学习，其主要表现在强化信号上，强化学习中由环境提供的强化信号是对产生动作好坏的一种评价(通常为标量信号)，而不是告诉强化学习系统如何产生正确的动作。由于外部环境提供的信息很少，强化学习系统必须靠自身的经历进行学习。通过这种方式，强化学习系统在行动-评价的环境中获得知识，改进行动方案以适应环境。


    # 2. 强化学习的主要研究方向


    +   1) 深度强化学习


    传统强化学习在模型较为简单的场景下取得了较好的效果，但现实中的问题往往都比较复杂，状态空间和动作空间的维数很高，此时传统的表格型强化学习不再适用。近年来，随着深度学习的兴起，深度学习与强化学习的结合研究也受到了很多关注。DeepMind
    团队创新地将具有强大感知能力及表征能力的深度学习与具有决策能力的强化学习相结合，形成了人工智能领域新的研究热点。深度强化学习的原理框架如图 3.21 所示。


    由图 3.21 可知，其学习过程可以描述为：在每个时刻智能体与环境交互得到一个高维度的观察，并利用深度学习方法来感知观察，以得到具体的状态特征表示。基于预期回报来评价各动作的价值函数，并通过强化学习决策将当前状态映射为相应的动作。环境对此动作做出反应，并得到下一个观察，如此反复，得到实现目标的最优策略。


    深度强化学习中最具代表性的算法是深度 Q 网络，使用深度神经网络来代替'
