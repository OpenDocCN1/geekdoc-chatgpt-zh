    # 3. 功率序列信息融合


    通过大量实验计算，基于 PNN 与 D-S 证据理论基本可以解决负荷辨识问题，但对于多负荷多状态存在准确率较低的问题，本节考虑负荷运行功率序列之间存在的联系以增加负荷辨识的准确率。各个负荷运行功率序列之间的联系体现在各个功率负荷在运行过程中，由于负荷使用者和负荷本身的特性，将导致负荷在不同时刻具有不同的运行状态，但是各负荷工作状态存在一定的联系。对于在连续时间内启停时序不同的负荷用电功率率状态，利用功率序列信息和负荷辨识结果相结合的方法，可以很好地提高负荷的辨识准确率和辨识的鲁棒性。本节利用
    HMM 对各个负荷功率序列的状态信息进行融合。


    在负荷识别过程中，准确判断各个负荷的启停及工作状态是负荷辨识成功的关键点，对负荷存在的可能集合建立一个 HMM，考虑到当负荷种类过多时，维度也相应增加，本节利用整数规划对负荷进行初辨识以降低维度。


    根据负荷存在的组合建立 HMM，具体建模方法如下。


    # 1) 负荷状态建模


    将用电负荷分为单状态、多变化和多状态三大类，把负荷运行过程中存在的状态作为 HMM 的状态。单状态负荷是指当负荷开启时，负荷运行功率与额定功率范围基本相同，且基本保持不变；多变化负荷是指由于用户使用情况的不同导致负荷运行功率不断变化的负荷；多状态负荷是指负荷由于本身的使用特点而导致多个工作状态，如冰箱属于间歇性工作，有制冷、正常工作和停止工作三种状态。


    # 2) 负荷观察值建模


    本节采用的构建方法与上述负荷状态的构建方法相似，把每个负荷的每个状态作为观察值。观察值通过多特征融合的结果获得，即对于长度为 2N 的功率序列，首先提取负荷功率序列统计特征和功率序列异常值特征，运用
    PNN 对其进行概率值向量的输出，获得特征信度赋值矩阵。然后利用 D-S 证据理论对两个特征向量进行特征融合，获得 HMM 的观察值序列。最后通过计算观察值序列和各个负荷组合之间的相似概率值，取最大值对应的类别作为最终负荷辨识结果[23]。'
