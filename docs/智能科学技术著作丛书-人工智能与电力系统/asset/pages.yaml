  img_proc: true
- pgno: 194
  md: '输入能量枢纽的如电能、天然气等多种形式的能量经过转换装置、存储设备后得到系统的输出（如电、热、冷）。输入输出之间可用函数关系表示为 $L = C \cdot
    P$，其矩阵形式表示如下：


    $$\begin{bmatrix} L_1 \\ L_2 \\ \vdots \\ L_n \end{bmatrix}_{L} = \begin{bmatrix}
    c_{11} & c_{12} & \cdots & c_{1m} \\ c_{21} & c_{22} & \cdots & c_{2m} \\ \vdots
    & \vdots & & \vdots \\ c_{n1} & c_{n2} & \cdots & c_{nm} \end{bmatrix}_{C} \cdot
    \begin{bmatrix} P_1 \\ P_2 \\ \vdots \\ P_m \end{bmatrix}_{P}\tag{6.33}$$


    式中，$P$为能量枢纽的输入载体矩阵；$L$为能量枢纽的输出载体矩阵；$c_{ij}$为耦合因子，对应的耦合矩阵$C$包含效率因子与分配因子。输入能源分别分配到不同的能源传输或转换装置的比例用分配因子表示，定义分配系数为
    $v_{\alpha\beta}$。


    # 2. 计及储能的能量枢纽模型


    储能单元可对系统能量进行跨时段转移并完成网内“源-荷”间不平衡量的协调，实现系统削峰填谷并对可再生能源波动进行抑制，促进供能系统经济高效运行。通过各种形式的能源存储可以确保能源转化过程的进行，除了水泵、电池、飞轮等形式的能源存储，热储也是一种重要的储能形式。


    对于式 (6.33) 所示的数学模型，当输入为电、气两种能源形式，输出为电需求、热需求时，矩阵形式表示为


    $$\begin{bmatrix} L_e \\ L_h \end{bmatrix} = \begin{bmatrix} \eta_T & \nu\eta_e^{CHP}
    \\ 0 & \nu\eta_h^{CHP} + (1-\nu)\eta^{GB} \end{bmatrix} \begin{bmatrix} P_e \\
    P_g \end{bmatrix} + \begin{bmatrix} \eta_{ES} & 0 \\ 0 & \eta_{TS} \end{bmatrix}
    \begin{bmatrix} E^e \\ E^h \end{bmatrix}\tag{6.34}$$


    式中，$\eta_T$为变压器效率；$\eta_e^{CHP}$为CHP机组发电效率；$\eta_h^{CHP}$为CHP机组供热效率；$\eta^{GB}$为燃气锅炉供热效率；$\nu$为天然气分配系数；$\eta_{ES}$为电储能效率；$\eta_{TS}$为热储能效率；$E^e$、$E^h$分别为电、热储能量。


    # 6.2.2 计及可靠性的能量枢纽优化配置模型


    能量枢纽是多能源耦合的关键，其配置结果对优化运行结果有较大影响，但现有的能量枢纽优化配置问题大多未考虑系统运行可靠性的影响。本节将各微源的装机容量作为优化变量，将系统的经济性与可靠性作为优化目标，具体的优化配置模型如下[37]。


    # 1. 目标函数建立'
