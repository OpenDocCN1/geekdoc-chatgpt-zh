    # 3. 实际应用


    为了使所提出的方法能够付诸实践，使用非侵入式负荷监测设备。所提出的设备包括用于控制和计算的主板、通用无线分组业务 (general packet radio
    service, GPRS) 通信模块、用于高速采样和模拟的数据采集-数字转换模块以及用于深度计算的英特尔 Movidius 神经计算棒。英特尔 Movidius
