    人工神经网络基于 McCulloch 和 Pitts 于 1943 年提出的一种称为“似脑机器”的思想，这种机器可基于生物神经元特性的互联模型来构造，这就是神经网络的初步模型。他们构造了一个表示大脑基本组成的神经元模型，该模型对于逻辑性操作表现出通用性。20
    世纪 60 年代 Widrow 提出了自适应线元，Steinback 等提出学习矩阵。70 年代，Grossberg 提出了几种具有新颖特性的线性动态系统结构，Kohonen
    基于神经元组织自调整各种模式的思想开展了组织映射等方面的研究工作。1982 年，美国加利福尼亚理工学院物理学家 Hopfield 提出了 Hopfield
    神经网络模型，引入了“计算能量”的概念，给出了网络稳定性判据。


    # 1) 人工神经元


    人工神经元是人工神经网络操作的基本信息处理单位，是人工神经网络的设计基础。人工神经元模型如图 3.8 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_69_0.png)


    图 3.8 人工神经元模型


    1943 年由美国心理学家 McCulloch 和数学家 Pitts 提出的形式神经元的数学模型，简称 MP 模型，该神经元由多个输入 x 和一个输出 y
    组成。中间状态由权重和表示，而输出为


    y_j(t) = f(\sum_{i=1}^{n} w_{ij} x_i - \theta_j)  (3.26)


    式中，θ_j 为神经元单元的阈值；w_ij 为连接权重系数；n 为输入信号数目；f(·) 为激励函数。


    激励函数 f(·) 是表示神经元输入与输出之间关系的函数，根据激励函数的不同，可以得到不同的神经元模型。常用的神经元模型有以下几种。


    +   (1) 阶跃函数：这种模型的神经元没有内部状态，激励函数 f(·) 是一个阶跃函数，它表示激活值和其输出之间的关系。'
