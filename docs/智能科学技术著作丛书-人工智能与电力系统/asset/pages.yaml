  md: '# 2.4 粒子群优化算法


    1995 年美国电气工程师 Eberhart 和社会心理学家 Kenndy 基于鸟群觅食行为提出了粒子群优化 (particle swarm optimization,
    PSO) 算法。1998 年 Russell Eberhart 发表了学术论文，首次对基本粒子群优化算法引入惯性权重修正了速度更新公式，修正后的公式已经被多数研究者所使用。2001
    年，第一部关于粒子群优化算法的专著 Swarm Intelligence 在美国旧金山出版。2003 年，第一届群智能研讨会在美国的印第安纳波利斯召开，此后每年召开一次。粒子群优化算法作为一种新兴的智能仿生算法，目前还没有完备的数学理论基础，但已在诸多领域得到广泛应用。


    由于其在动态多目标寻优问题中的简单快速、全局寻优能力和收敛性好的明显优势以及在函数优化等领域的广阔应用前景，此算法一经提出就引起了研究人员的浓厚兴趣，之后的诸多学者对于基本粒子群优化算法又进行了进一步的研究，提出了许多改进算法并且应用于工程领域当中。本书主要介绍粒子群优化算法的基本概念、模型、特点及应用场景[6]。


    # 2.4.1 粒子群优化算法的基本概念及模型


    # 1. 粒子群优化算法的生物学原理


    粒子群优化算法是模拟鸟类随机搜索食物捕食行为的算法。假设一个鸟群在一定空间范围内搜索一块食物，在找到这块食物之前所有的 小鸟都不知道食物的具体位置，但是小鸟之间可以相互交流信息。在寻找食物的过程中，每只小鸟都能感受到当前位置与食物之间的距离，搜索目前离食物最近的鸟的周围区域是找到食物最简单有效的方法，通过小鸟之间的集体协作最终找到食物。在飞行的过程中每只小鸟都遵守三条规则：①避免与其他小鸟发生碰撞；②尽量与其他小鸟的速度保持一致；③尽量向自己认为正确的群体靠近。


    粒子群优化算法通过鸟类随机搜索食物的模型得到启发。在粒子群优化算法中每一个优化问题潜在的解都可以看作空间中的一只鸟，称为“粒子”，所有的粒子都有一个由被优化函数决定的适应度值
    (fitness value)，它们的速度决定每个粒子飞行的方向和距离。粒子通过追随当前的最优粒子在解空间中进行搜索。


    在每一次的迭代过程中，粒子通过两个“极值”来进行位置的变化，一个是个体极值，即粒子个体本身所找到的历史最优解，通常表示为 pbest；另一个是全局极值，即群体所有粒子目前所找到的历史最优解，通常表示为
    gbest。粒子通过自己和同伴的经验决定下一步的运动轨迹。


