    # 6.3 基于遗传算法的沿海水电系统优化运行


    我国沿海地区存在淡水及电能不能满足需求的问题，同时沿海地区风、光等可再生资源丰富，通过对沿海水电系统进行运行优化，有利于消纳沿海地区风、光等冗余可再生资源，同时解决淡水及电能不能自给的问题。


    本节提出考虑海水淡化的沿海水电系统的优化运行方案，以总周期费用最小和联络线功率波动最小为目标，根据系统配置建立约束条件和多目标水电系统优化问题。解决电力系统多目标问题常采用加权方法把多目标问题转化为单目标问题进行求解，这种方法虽然降低了解题难度，但存在的误差较大，本节采用第三代约束非支配排序遗传算法
    (non-dominated sorting genetic algorithms III, NSGA-III) 求解问题，具有较好的收敛性，能够确定系统的最优运行方案[39]。


