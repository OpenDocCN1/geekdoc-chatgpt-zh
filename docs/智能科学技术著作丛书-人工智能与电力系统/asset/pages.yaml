    根据上述原理，可得到 GOSS 算法的渐近逼近比为


    $$\gamma=O\left(\frac{1}{n_l^{j}(d)}+\frac{1}{n_r^{j}(d)}+\frac{1}{\sqrt{n}}\right)\tag{4.45}$$


    随机抽样是 GOSS 算法中 a = 0 的一个特例，在条件 C_{0,β} > C_{a,β-a} 下，GOSS 算法比随机抽样获得的结果更好。


    GOSS 算法的小梯度集虽然通过随机采样得到，但 GOSS 算法通过系数 (1-a)/b 实现了样本数据分布与原始数据集相同。因此，GOSS 算法的泛化误差将接近使用完整数据实例计算的泛化误差；并且
    GOSS 算法能增加学习器的多样性，有助于提高泛化性能。


    针对高维数据通常为稀疏数据的特性，LightGBM 设计了一种既可以对稀疏数据降维又不损失结果精度的方法，即互斥特征捆绑 (exclusive feature
    bunding, EFB) 算法。高维数据通常非常稀疏，这种特征空间的稀疏性为学习算法提供了一种可以近乎无损地减少特征数量的可能性。具体来说，在稀疏特征空间中，许多特征是相互排斥的，即互斥特征不会同时取非零值，因此可以实现，在不破坏原始信息的前提下将互斥特征捆绑成单个特征
    (即互斥特征捆绑)。


    通过互斥特征捆绑算法的内部特征进行扫描处理，可以从合并后的特征捆中得到合并前各个互斥特征中所对应的相同特征直方图。LightGBM 模型通过该算法将直方图构建的复杂性从
    O(样本数×特征数) 变为 O(样本数×特征捆数)，因为捆绑处理后特征捆的数目远小于原始特征的数目，所以互斥特征捆绑算法可在不影响训练精度的前提下，显著提高算法的训练速度。


    在降低训练复杂度的同时，为了确保可以从特征捆中识别原始特征的值，互斥特征捆绑算法采用了在特征值中加入一个偏置量的方法。例如，将两个互斥的特征 A 和 B 捆绑为单一特征，其中特征
    A 的原始取值为[0,10)，特征 B 的原始取值为[0,20)，则将特征 B 的值加一个偏置常量 10，使其取值范围变为[10,30)，从而使捆绑后特征[0,30)可以同时保留特征
    A 和特征 B 的信息。


    互斥特征捆绑将许多稀疏特征(包括单一热编码特征和独立独占特征)合并到更少的特征中。虽然基本的稀疏特征优化已包含在捆绑过程中，但是互斥特征捆绑不需要为树学习过程中的每个特征维护非零数据表。更重要的是，由于许多以前隔离的特征被捆绑在一起，它可以增加空间局部性并显著提高缓存命中'
