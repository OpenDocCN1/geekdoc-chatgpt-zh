  md: '# 第 2 章 进化算法与群智能


    20 世纪 50 年代中期创立了仿生学，许多科学家从生物中寻求新的用于人造系统的灵感，一些科学家分别独立地从生物进化的机理中发展出适合于解决现实世界复杂问题的模拟进化的优化算法，也有一些科学家受自然界物理现象的启发，发展出解决复杂问题的优化算法，这些方法均可称为智能优化算法。本章主要介绍电力系统中常用的进化算法与群智能算法的原理及模型。


    # 2.1 遗传算法


    20 世纪 60 年代初，Holland 在设计人工自适应系统时提出借鉴遗传学基本原理模拟生物自然进化的方法。1975 年，Holland 出版了第一部系统阐述遗传算法基本理论和方法的专著，其中提出了遗传算法
    (genetic algorithm, GA) 理论研究和发展中最重要的模式理论，因此一般认为 1975 年是遗传算法的诞生年。本节主要介绍遗传算法的基本概念及模型、特点及应用场景。


    # 2.1.1 遗传算法的基本概念及模型


    遗传算法是模拟达尔文生物进化论的自然选择和遗传学机理的生物进化过程的计算模型，是一种通过模拟自然进化过程搜索最优解的方法。


    遗传算法是从代表问题可能潜在的解集的一个种群开始的，而一个种群则由经过基因编码的一定数目的个体组成。每个个体实际上是染色体带有特征的实体。染色体作为遗传物质的主要载体，即多个基因的集合，其内部表现
    (即基因型) 是某种基因组合，它决定了个体形状的外部表现，如黑头发的特征是由染色体中控制这一特征的某种基因组合决定的。因此，在一开始需要实现从表现型到基因型的映射，即编码工作，由于仿照基因编码的工作很复杂，对此往往进行简化，如二进制编码，初代种群产生之后，按照适者生存和优胜劣汰的原理，迭代演化产生出越来越好的近似解，在每一代，根据问题域中个体的适应度大小选择个体，并借助于自然遗传学的遗传因子进行组合交叉和变异产生出代表新的解集的种群，这个过程将导致像自然进化一样的后生代种群比前生代种群更加适应环境，末代种群中的最优个体经过解码，可以作为求解问题的近似最优解。'
