    # 2.3.1 蚁群算法的基本概念及模型


    +   1. 蚁群算法的生物学原理


    在蚂蚁觅食的过程中，虽然单只蚂蚁的路径比较简单，但是整个蚁群的觅食行为可以体现为一种智能行为，为了寻找获得食物的最短路径，蚁群会随着环境的变化适应性地搜索新的路径产生新的选择。一开始蚂蚁的分布是均匀的，无论距离长短，蚂蚁总是按照同等概率随机选择一条路径。


    在蚂蚁寻找食物的过程中，其走过的路径会留下一种特殊的分泌物——信息素。但是随时间的推移信息素也会逐渐挥发，一条路径上经过的蚂蚁越多该路径上的信息素浓度越高，后来的蚂蚁会选择信息素浓度较高的路径，进而增加该路径上的蚂蚁来吸引后续更多的蚂蚁，从而形成了反馈机制，寻找出从蚁巢到食物的最短路径。


    蚁群算法解决优化问题的基本思路为：①用蚂蚁的行走路径表示待优化问题的可行解，整个蚂蚁群体的所有路径构成待优化问题的解空间；②路径较短的蚂蚁释放的信息素量较多，随着时间的推进，较短的路径上累积的信息素浓度逐渐增加，选择该路径的蚂蚁数量越来越多；③整个蚂蚁群体会在正反馈的作用下集中到最佳的路径上，此时对应的便是待优化问题的最优解。蚁群运动原理如图
    2.4 所示，A、F 分别为蚁巢和食物所在之处，蚂蚁在觅食的过程中存在两条路径，分别为 ABDEF 和 ABCEF，BC 和 CE 的距离为 10，BD 和
    DE 的距离为 17。开始时各类路径中均没有任何的信息素，假设有 100 只蚂蚁从 A 点沿不同的路径出发随机选择路径，一段时间后 BCE 和 BDE 中各有
    50 只蚂蚁，但是由于 BCE 路径与 BDE 路径相比较短，所以选择 BCE 路径的蚂蚁留下的信息素要多于选择 BDE 路径蚂蚁留下的信息素，随着时间的推移，留在路径
    BDE 上的信息素会逐渐挥发掉，最终蚁群所选择的路径为 BCE。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_29_0.png)'
