- pgno: 165
  md: '率，高频振动时会产生较大的噪声，因此与 LeNet-5 不同的是，FDL-CNN 的第一层卷积核采用宽卷积核，后续卷积核采用相对较窄的卷积核，以排除噪声对故障振动信号的干扰。具体操作方法如图
    5.25 所示。


    ![](img/2160aa82ffab89ad09fb1b4e167a298b_165_0.png)


    在图 5.25 中，K 和 J 分别表示输入层的高度和宽度，代表 J 个振动信号传感器变量在时间间隔 K 上的监测值，FDL-CNN 的输入层为包含 K×J
    个点的矩阵；k 和 j 分别表示卷积核的高和宽。执行卷积操作后的激活值如下：


    y_{tt}=σ(∑_{r=1}^{k}∑_{c=1}^{j} w_{rc} x_{(r+i×S)(c+t×S)} + b)

    0≤i≤(K−k)/S， 0≤t≤(J−j)/S

    (5.32)


    经过式 (5.32) 的卷积操作后，输出特征图尺寸缩小至 ( (K−k)/S +1 ) × ( (J−j)/S +1 )。


    在本节的 FDL-CNN 中，J=10，代表 10 个传感器的振动信号采样值，选择的步长 S=1。由上文分析可知，输出特征图尺寸满足如下约束条件：


    (K−k)/S +1 = (J−j)/S +1

    (5.33)


    可以得到 K=15，因此本节输入图像高度为 15，宽度为 10；即本节并行输入 10 个振动传感器采集到的 10 个振动信号波形的 15 个采样点。与标准二维卷积神经网络结构不同，本节
    FDL-CNN 的首层卷积核尺寸为 6×1。随着卷积层数和池化层数的增加，卷积层提取的变量内部的非线性关系越来越明显；特征越明显，对网络正确有效的分类越有利[30]。


    2) 电力变压器故障定位方法


    电力变压器故障定位过程分为如下 8 个步骤，诊断流程如图 5.26 所示。


    +   (1) 变压器故障振动信号采集。'
