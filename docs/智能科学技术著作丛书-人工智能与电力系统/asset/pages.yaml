    +   (2) 判断是否满足算法终止条件，若满足则结束算法并输出优化结果，否则继续以下步骤。

    +   (3) 利用当前解 x 的邻域函数产生若干邻域解，并从中确定若干候选解。

    +   (4) 判断候选解是否满足特赦准则，若满足，则用满足特赦准则的最佳候选解 x′ 替代 x 成为新的当前解，即 x = x′，用 x′ 对应的禁忌对象替换最早进入禁忌列表的禁忌对象，同时用
    x′ 替换 “当前最优” 状态，转到步骤 (2)，否则继续以下步骤。

    +   (5) 判断候选解对应的各对象的禁忌属性，选择候选解集中非禁忌对象对应的最佳状态为新的当前解，同时用与之对应的禁忌对象替换最早进入禁忌列表的禁忌对象元素，转到步骤
    (2)。


