    # 6.7 本章小结


    本章主要介绍了人工智能技术在微电网及多能源系统优化中的应用。6.1 节采用粒子群优化算法，主要讨论了在微电网容量优化配置的基础上，如何对微电网中含有的繁多能源、负载进行优化调度，以确保微电网的良好运行；6.2
    节采用遗传算法，针对含可再生能源的电-气-热互联多能源系统的多能源网络互联与多能源优化利用问题，在重点研究能量枢纽优化配置问题的同时考虑了系统运行的可靠性；6.3
    节采用第三代约束非支配排序遗传算法，以总周期费用最小和联络线功率波动最小为目标，求解沿海水电系统的最优运行方案；6.4 节采用粒子群优化算法，主要研究了多能源系统和大电网并网的优化控制策略，为了发挥储能电池给系统带来的经济效益以及减少环境污染，通过实时监测储能电池的荷电状态，在不同的状态下制定了不同的优化控制策略；6.5
    节提出了一种以集合形式处理梯级水电站的机组组合免疫算法，该方法利用了免疫算法的记忆、调节机制和便于处理离散变量的优势，将存在水能联系的梯级水电站机组看作一个集合进行统一编码，精简了含梯级水电站的水火电联合调度机组组合的有效寻优空间，提高了求解效率；6.6
    节建立了一个考虑风电场边界约束的海上风电集群输电系统拓扑优化模型，考虑到优化问题具有较为明显的非线性、结构性特征，选择了具有收敛速度快、寻优效率高的蚁群算法计算优化结果。上述应用对于人工智能技术在微电网及多能源系统中的应用具有重要的理论参考意义和工程应用价值。'
