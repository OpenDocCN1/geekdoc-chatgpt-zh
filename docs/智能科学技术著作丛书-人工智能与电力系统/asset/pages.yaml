  md: '述的是每个状态的性质，但真正有用的是如何描述一个状态序列。数学中称用来描述随机变量序列的过程为随机过程，随机过程就是指随机变量序列。若随机变量序列中的每个状态都是马尔可夫的，则称此随机过程为马尔可夫过程。


    马尔可夫过程是一个二元组(S,p)，且满足 S 是有限状态集合，p 是状态转移概率，状态转移概率矩阵为


    P = \begin{bmatrix} p_{11} & \cdots & p_{1n} \\ \vdots & & \vdots \\ p_{n1} &
    \cdots & p_{nn} \end{bmatrix}


    强化学习的基本过程是一个马尔可夫决策过程，马尔可夫决策过程是当前强化学习理论推导的基础石，可以对强化学习问题进行建模。


    马尔可夫决策过程如图 3.22 所示，马尔可夫决策过程可以用由状态、行动、状态转移概率、状态转移奖励或回报构成的四元组{S,a,p,r}表示，其中：


    +   1. S 为所有环境状态的集合，S_t ∈ S 表示智能体在 t 时刻所处的状态。\n2. a 为智能体可执行动作的集合，a_t ∈ a 表示智能体在
    t 时刻所采取的动作。\n3. p 为状态转移概率，S×a×S→[0,1] 为状态转移概率密度函数，S_{t+1} ~ p(S_t, a_t) 表示智能体在此时刻执行的动作转移到下一时刻状态的概率。\n4.
    r 为奖励函数，r_t 表示智能体在状态 S_t 执行动作 a_t 获得的立即奖励值。


