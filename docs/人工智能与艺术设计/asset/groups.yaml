    )

    ```


    有时候，为了使得伪码可读性更高，在嵌套的语句中，每一层语句的结束都用明显的标识来醒目地加以标记，使用诸如 endwhile、endif 等保留词。比如：


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )endwhile

    )endif

    ```


    使得伪码的嵌套层次更加一目了然。


    当然，这种做法并非是强制性的，依赖于个人偏好。作为中国人，有时也可以用汉语保留词来替换英语保留词。只要不影响算法思想的表达，可以采用你自己认同的习惯方式来规定你的伪码表达习惯，前提是要让别人能够理解可读。


    对于用流程图表达一个算法的过程，常常需要标记一个算法的开始和结束，其流程图标识如图 3-1“起/止点”所示。有了表示算法的伪码原语和流程图，现在我们可以来介绍如何编写解决具体问题的算法了，即所谓的算法构造。


    - 6. 其他语句


    在算法描述中，还可能要用到其他一些语句，因为它们都是用最简明的形式给出的，故很容易知道它们的含义。例如，EXIT 语句、RETURN 语句、READ（或 INPUT）语句和
    OUTPUT（或 PRINT、或 WRITE）语句等。


    ## 3.2 算法结构


    算法是计算步骤的有序集合，自然构成算法的内容是按照一定顺序排列的语句集合。但是在顺序排列的基础上，算法往往也包含着非常复杂的组织结构，以便有效完成算法预定的各种复杂任务。为了有效地构造算法，我们必须学习并了解一般算法过程中常见的一些构造结构，特别是选择结构、迭代结构、递归结构。因此，在讨论算法运用时，我们专门对算法的结构进行详细的分析。


    通常可以采用程序流程图直接表示不同的算法结构，但为了简洁起见，更为了有效地表示算法结构，我们将采用一种由美国学者纳希（I. Nassi）和希内德曼（B. Shneidemann）提出的
    N-S 盒图表示法来辅助分析算法的复杂结构。与流程图相比，这种盒图表示法既保留了流程图方式直观、形象和易于理解的优点，又去掉了流程图功能域不甚明确、控制流可能任意跳转的缺点，使得其更容易确定局部和全局数据的作用域。


    ![](img/f188b68deb37acb6105ba97c814d9af2_67_0.png)


    毫无疑问，算法结构的基础是顺序结构，如图 3-6 所示，顺序结构反映的就是算法步骤按照先后给定的顺序依次执行的事实。算法的顺序结构是一目了然的，也是非常简单的，就计算复杂性而言，并不起关键作用。在算法的语句集合中，反映算法的复杂性主要体现在构成算法的具体语句结构之中。具体语句结构主要包括选择结构、迭代结构和递归结构，也是分析计算复杂性的重点所在。因此，下面我们来分析算法中的这三种具体结构。


    ### 3.2.1 选择结构


    首先是选择结构，在算法实现中需要考虑多种可能情况的不同处理策略时，就会采用算法的选择结构，具体表示一般采用条件语句。选择结构对应的典型结构流程图及其盒图分析如图
    3-7 所示。举例如下，对于给定的一个数据和一张数据表，要确定该数据是否在这张表中，就需要构造一个算法来解决这个问题，这样的算法称为数据查找算法。比如查找某个人的姓名是否出现在给定的名单中，就属于这样一种数据查找问题。一般实现这一过程的伪码可以表示如下：


    ```

    Proceduresearch(list, TargetValue)

    if(list 为空)

    then(返回失败)

    else(

    TestEntry←在 list 中选择第一个表项；

    while(TargetValue≠TestEntry 且 TestEntry 不是最后一个表项)

    do(TestEntry←在 list 中选择下一个表项)；

    if(TargetValue=TestEntry)

    then(返回成功)

    else(返回失败)

    )endif

    ```


    在上述算法中就多次用到了选择结构的 if 语句，当然实现选择结构的语句不仅仅只有 if 语句，有时也会采用情况语句，一般定义如下(流程图如图 3-8 所示)。


    ```

    switch(变量)

    case" 取值 1"(活动 1)

    case" 取值 2"(活动 2)

    ......

    case" 取值 n"(活动 n)

    ```


    其中 switch、case 均为保留词。


    鉴于情况语句可以化解为若干条件语句的组合，因此无须给出专门的盒图表示。不管是条件语句还是情况语句，选择结构本身不会增加计算复杂性。但是选择结构却是算法实现中非常重要的表达方式，可以有效地解决人们思维中的选择机制问题。因此，在算法的构造中通常少不了选择结构的运用。


    ![](img/f188b68deb37acb6105ba97c814d9af2_69_0.png)


    图 3-8 情况语句的程序流程图


    ### 3.2.2 迭代结构


    在算法构造中第二种实现结构就是迭代结构。


    迭代结构亦称循环结构，是最重要的控制结构，也是软件设计人员需要掌握的基本技能。当条件成立的时候，执行循环体内的代码，当条件不成立的时候，跳出循环，执行循环结构后面的代码。


    迭代结构可以减少源程序重复书写的工作量，用来描述重复执行某段算法的问题，这是程序设计中最能发挥计算机特长的程序结构。


    在算法的迭代结构中，一组指令以循环方式重复执行。为了更好地理解这种循环结构，我们再以上述数据查找算法为例，来详细分析循环结构算法的特点。在上述 Search
    算法中，为了解决姓名查找问题，我们是从名单首列开始依次逐一将待查姓名与名单中出现的姓名进行比较，找到了就查找成功；如果名单结束也没有找到，则查找失败。现在，如果名单是按照字母顺序排列的，那么只须按照字母顺序查找即可，不必比较所有的表项。这样，实现这一过程的伪码可以表示如下：


    ```

    Proceduresearch(list, TargetValue)

    if(list 为空)

    then(返回失败)

    else(

    TestEntry←在 list 中选择第一个表项；

    while(TargetValue>TestEntry 且 TestEntry 不是最后一个表项)

    do(TestEntry←在 list 中选择下一个表项)；

    if(TargetValue=TestEntry)

    then(返回成功)

    else(返回失败)

    )endif

    ```


    上述新的 Search 算法是按照字母排列顺序来查找的，因此称其为顺序查找算法。简单分析可知，该算法的计算代价主要体现在 while 语句，如果表的长度为
    n 的话，那么平均需要计算 n/2 计算步，因此算法的计算复杂性为 O(n)。


    实际上，该算法中 while 语句就是一个迭代结构，而其中的指令“TestEntry <- 在 list 中选择下一个表项”以重复的方式被执行。


    通常，一条或一组指令的重复使用方式称为循环的迭代代码。这样的结构一般由两个部分组成：循环体和循环控制条件。在上述顺序查找算法中，是通过 while 语句来实现这样的迭代结构，其循环控制过程是检查条件、执行循环体、检查条件、执行循环体……直到条件为假。


    一般，循环控制由状态初始化、条件检查和状态修改三个环节部分组成，其中每个环节都决定着循环的成败与否。其中状态初始化设置一个初始状态，并且这一状态是可以被修改的，直到满足终止条件；条件检查是将当前状态与终止条件比较，如果符合就终止循环；状态修改就是对当前状态进行有规律地改变、使其朝着终止条件发展。比如在顺序查找算法中，实现状态初始化的语句就是


    ```

    TestEntry <- 在 list 中选择第一个表项

    ```


    条件检查部分是


    ```

    TargetValue > TestEntry 且 TestEntry 不是最后一个表项

    ```


    而状态修改部分则是


    ```

    TestEntry <- 在 list 中选择下一个表项

    ```


    这样，三个部分的联合就构成了一个循环迭代代码。图 3-9 给出了 while 循环迭代代码结构及其对应的 N-S 盒图表示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_70_0.png)


    图 3-9 while 循环迭代代码结构及其对应的 N-S 盒图表示


    当然，除了 while 语句外，也可以采用 repeat 语句来实现循环控制过程，其使用规定如下：


    ```

    repeat(活动)until(条件)

    ```


    其中 repeat、until 都是保留词。repeat 语句的含义如图 3-10 所示，跟 while 语句不同之处是先执行循环体，然后进行条件检查。


    ![](img/f188b68deb37acb6105ba97c814d9af2_71_0.png)


    图 3-10 repeat 语句的程序流程图


    由于 while 语句先检查条件，因此有可能循环体一次也不被执行就终止了循环；而 repeat 语句则起码要执行一次循环体，然后才有可能终止循环。我们称 while
    语句是预查循环，而 repeat 语句是后查循环。图 3-11 所示为 repeat 循环迭代结构及其对应的 N-S 盒图表示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_71_1.png)


    图 3-11 repeat 循环迭代结构及其对应的 N-S 盒图表示


    图 3-12 给出了一个完整程序流程图转为盒图表示的实例。其中（a）为求最大公约数的程序流程图，（b）为对应的 N-S 盒图表示形式。从图 3-12 不难看出，用盒图表示算法结构具有十分简洁、直观和明确的特点。特别是对于循环迭代结构，可以一目了然地得到清晰的表达。


    ![](img/f188b68deb37acb6105ba97c814d9af2_72_0.png)


    (a) 求最大公约数流程图 (b) 对应N-S盒图表示


    图 3-12 完整程序流程图转为盒图表示的实例


    ### 3.2.3 递归结构


    任何一个可以用计算机求解的问题所需的计算时间都与其规模有关。问题规模越小，解题所需的计算时间往往也越少，计算也越容易。要解决一个较大的问题，有时是相当困难的。分治策略是应用最多的一种有效方法，它的基本思想是将问题分解成若干个子问题，子问题较原问题无疑是会容易些，然后求解子问题，并由此得出原问题的解，就是所谓的“分而治之”的意思。分治策略还可以递归，即子问题仍然可以用分治策略来处理，最后的问题非常基本而且简单。


    分治的基本思想是将一个规模为 n 的问题分解为 k 个规模较小的子问题，这些子问题互相独立且与原问题相同。找出各部分的解，然后把各部分的解组合成整个问题的解。实现算法的同时，需要估计算法所需时间。分治算法在每一层递归上分为三个步骤，首先是分，即将原问题分解成一系列子问题。其次是治，即递归地解各子问题，若子问题足够小，则直接解之。最后是合，即将子问题的结果合并成原问题的解。


    分治算法的时间由解决各个子问题所需的时间（由子问题的个数、解决每个子问题的时间决定）确定。


    在 C 语言中，重复性操作可以通过循环结构或者递归结构完成。递归结构清晰，可读性强，而且容易用数学归纳法来证明算法的正确性，因此它为设计算法、调试程序带来很大方便。


    从递归算法的结构来分析，设计递归算法时，无非要解决两个问题：递归出口和递归体。即要确定何时到达递归出口，何时执行递归体，执行什么样的递归体。递归算法设计的关键是保存每一层的局部变量并运用这些局部变量。由此，递归算法的设计步骤可从以下三步来进行：第一步，分析问题，分解出小问题；第二步，找出小问题与大问题之间的关系，确定递归出口；第三步，写出算法。


    最后我们来分析递归结构。所谓递归，就是重复进行自身调用。


    图 3-13 给出了有关“花哨名词”递归迁移网(RTN)，它可以产生任意复杂的名词短语，其中用到的一个重要机制就是递归结构。


    ![](img/f188b68deb37acb6105ba97c814d9af2_73_0.png)


    图 3-13 “花哨名词”递归迁移网(RTN)


    在算法结构中也一样，存在着比循环还要复杂的递归结构，同样可以实现重复计算任务。如果说循环是通过重复执行同样一组指令的方式来进行的，那么递归则是通过将一组指令当作自身的一个子程序进行调用来进行的。


    为了直观起见，下面通过一个名叫折半查找的算法来说明算法中的递归结构。


    对于同样的名字查找问题的递归分析，具体构造的算法如下：


    ```

    ProcedureSearch(List, TargetValue)

    if(list)

    then

    （返回失败）

    else(

    TestEntry←选择 List 的 "中间"值；

    switch(TargetValue)(

    case(TargetValue= TestEntry)(

    返回成功

    )

    case(TargetValue>TestEntry)(

    AList←位于 TestEntry 前半部分 List

    返回 ProcedureSearch(BList, TargetValue) 的返回值

    )

    )

    )endif

    ```


    上述算法中，出现了过程自身调用的情况，这便是递归结构。递归过程的控制主要是通过过程调用参数的变化来进行的。在上述算法中这样的参数就是列表本身。如果追踪某个递归过程，那么就会发现，其计算过程是一层一层递进的，然后再一层一层返回。


    对于递归结构而言，在动态执行过程中，递进的最大层数就称为该递归结构的递归深度。对上述折半算法分析可知，递归算法的计算复杂性与递归深度密切关联，如果表的长度为
    n 的话，那么平均需要计算的递归深度为 log 2n，因此此算法的计算复杂性为 O(log 2n)。显然，折半查找算法的效率要高于顺序查找算法的效率。


    另一个需要运用递归结构来设计求解算法的就是如图 3-14 所示的汉诺塔问题。相传印度教的天神梵天在创造地球这一世界时，建了一座神庙，神庙里竖有三根宝石柱子，柱子由一个铜座支撑。梵天将
    64 个直径大小不一的金盘子，按照从大到小的顺序依次套放在第一根柱子上，形成一座金塔，即所谓的汉诺塔(又称 Hanoi 塔)。天神让庙里的僧侣们将第一根柱子上的
    64 个盘子借助第二根柱子全部移到第三根柱子上，即将整个塔迁移，同时定下三条规则：


    - 1. 每次只能移动一个盘子；

    - 2. 盘子只能在三根柱子上来回移动，不能放在他处；

    - 3. 在移动过程中，三根柱子上的盘子必须始终保持大盘在下，小盘在上。


    天神说：“当这 64 个盘子全部移到第三根柱子上后，世界末日就要到了”。这就是著名的汉诺塔问题。


    用计算机求解一个实际问题，首先要从这个实际问题中抽象出一个数学模型，然后设计一个解此数学模型的算法，最后根据算法编写程序，调试、编译、连接和运行，从而求解该问题。图
    3-15 给出了求解 n 个圆盘难题的总体求解过程。其汉诺塔问题的算法为：


    ![](img/f188b68deb37acb6105ba97c814d9af2_74_0.png)


    递归调用 n-1 个圆盘的汉诺塔问题算法，把上面的 n-1 个圆盘从 A 柱移到 B 柱；

    把最下面的一个圆盘从 A 柱直接移到 C 柱；

    递归调用 n-1 个圆盘的汉诺塔问题算法，把 B 柱上临时存放的 n-1 个圆盘移到 C 柱。

    下面利用 C 语言给出该问题的求解算法的描述。


    ```

    hanoi(int n, char left, char middle, char right)

    {if(n==1) move(1, one, _, three);

    else

    {hanoi(n-1, left, right, middle);

    move(1, left, _, right);

    hanoi(n-1, middle, left, right);

    }

    }

    ```


    以上代码中，n 表示 n 个盘子的汉诺塔问题，left 表示第一个柱子，middle 表示第二个柱子，right 表示第三个柱子。函数 hanoi(n-1,
    left, right, middle) 表示 n-1 阶汉诺塔从第一个柱子借助第三个柱子先移到第二个柱子上，函数 move(1, left, _, right)
    表示将第一个柱子上最后一个盘子直接放到第三个柱子上，函数 hanoi(n-1, middle, left, right) 表示 n-1 个盘子借助第一个柱子移到第三个柱子上。在以上
    C 语言描述的算法基础上，进行适当扩充就可以形成一个完整的程序，经过编译和连接后，计算机就可以执行这个程序，按照递归的方法将问题求解出来（图 3-16）。


    ![](img/f188b68deb37acb6105ba97c814d9af2_75_0.png)


    图 3-16 汉诺塔问题分解示意图


    其中“左向递归”是借助 C，将 A 柱上方的 n-1 个盘子移到 B 柱；“右向递归”则是借助 A，将 B 柱上 n-1 个盘子移到 C 柱。图 3-17
    给出的就是当 n=3 时，上述算法的实际递归执行过程。


    对于递归结构的程序算法，保证递归过程终止的条件也是需要考虑的问题。比如上述折半查找算法中表列为空或者找到目标，可以保证递归过程的终止；而汉诺塔问题只须保证塔高层次
    n 是有限值即可。与循环终止条件的显式表示不同，递归终止条件往往是隐含表示的，因此在设计递归算法时需要格外注意。因为，有时不恰当的递归也会产生悖论，使计算无法终止。


    最后，我们强调指出，从理论上讲，所有算法的结构都可以看作并化解为递归结构，关键在于递归的深度。其中作为计算理论之一的递归函数论，就是以递归的思想建立起完整的计算理论模型的。这就是我们在算法构造的原语介绍中，一开始就将各种算法步骤的描述

    '
  mdcn: '

    比如下面就定义了一个称为 greetings 的过程：


    ```

    procedure greetings(y)

    x<-y;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    ```


    ![](img/f188b68deb37acb6105ba97c814d9af2_66_0.png)


    图 3-5 过程语句流程图


    此时，其他需要完成这一过程功能的地方，只需要直接调用这一过程名即可，比如：


    ```

    if(x<=10)then(procedure greetings(3))

    ```


    就等价于


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )

    ```


    有时候，为了使得伪码可读性更高，在嵌套的语句中，每一层语句的结束都用明显的标识来醒目地加以标记，使用诸如 endwhile、endif 等保留词。比如：


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )endwhile

    )endif

    ```


    使得伪码的嵌套层次更加一目了然。


    当然，这种做法并非是强制性的，依赖于个人偏好。作为中国人，有时也可以用汉语保留词来替换英语保留词。只要不影响算法思想的表达，可以采用你自己认同的习惯方式来规定你的伪码表达习惯，前提是要让别人能够理解可读。


    对于用流程图表达一个算法的过程，常常需要标记一个算法的开始和结束，其流程图标识如图 3-1“起/止点”所示。有了表示算法的伪码原语和流程图，现在我们可以来介绍如何编写解决具体问题的算法了，即所谓的算法构造。


    - 6. 其他语句


    在算法描述中，还可能要用到其他一些语句，因为它们都是用最简明的形式给出的，故很容易知道它们的含义。例如，EXIT 语句、RETURN 语句、READ（或 INPUT）语句和
    OUTPUT（或 PRINT、或 WRITE）语句等。


    ## 3.2 算法结构


    算法是计算步骤的有序集合，自然构成算法的内容是按照一定顺序排列的语句集合。但是在顺序排列的基础上，算法往往也包含着非常复杂的组织结构，以便有效完成算法预定的各种复杂任务。为了有效地构造算法，我们必须学习并了解一般算法过程中常见的一些构造结构，特别是选择结构、迭代结构、递归结构。因此，在讨论算法运用时，我们专门对算法的结构进行详细的分析。


    通常可以采用程序流程图直接表示不同的算法结构，但为了简洁起见，更为了有效地表示算法结构，我们将采用一种由美国学者纳希（I. Nassi）和希内德曼（B. Shneidemann）提出的
    N-S 盒图表示法来辅助分析算法的复杂结构。与流程图相比，这种盒图表示法既保留了流程图方式直观、形象和易于理解的优点，又去掉了流程图功能域不甚明确、控制流可能任意跳转的缺点，使得其更容易确定局部和全局数据的作用域。


    ![](img/f188b68deb37acb6105ba97c814d9af2_67_0.png)


    毫无疑问，算法结构的基础是顺序结构，如图 3-6 所示，顺序结构反映的就是算法步骤按照先后给定的顺序依次执行的事实。算法的顺序结构是一目了然的，也是非常简单的，就计算复杂性而言，并不起关键作用。在算法的语句集合中，反映算法的复杂性主要体现在构成算法的具体语句结构之中。具体语句结构主要包括选择结构、迭代结构和递归结构，也是分析计算复杂性的重点所在。因此，下面我们来分析算法中的这三种具体结构。


    ### 3.2.1 选择结构


    首先是选择结构，在算法实现中需要考虑多种可能情况的不同处理策略时，就会采用算法的选择结构，具体表示一般采用条件语句。选择结构对应的典型结构流程图及其盒图分析如图
    3-7 所示。举例如下，对于给定的一个数据和一张数据表，要确定该数据是否在这张表中，就需要构造一个算法来解决这个问题，这样的算法称为数据查找算法。比如查找某个人的姓名是否出现在给定的名单中，就属于这样一种数据查找问题。一般实现这一过程的伪码可以表示如下：


    ```

    Proceduresearch(list, TargetValue)

    if(list 为空)

    then(返回失败)

    else(

    TestEntry←在 list 中选择第一个表项；

    while(TargetValue≠TestEntry 且 TestEntry 不是最后一个表项)

    do(TestEntry←在 list 中选择下一个表项)；

    if(TargetValue=TestEntry)

    then(返回成功)

    else(返回失败)

    )endif

    ```


    在上述算法中就多次用到了选择结构的 if 语句，当然实现选择结构的语句不仅仅只有 if 语句，有时也会采用情况语句，一般定义如下(流程图如图 3-8 所示)。


    ```

    switch(变量)

    case" 取值 1"(活动 1)

    case" 取值 2"(活动 2)

    ......

    case" 取值 n"(活动 n)

    ```


    其中 switch、case 均为保留词。


    鉴于情况语句可以化解为若干条件语句的组合，因此无须给出专门的盒图表示。不管是条件语句还是情况语句，选择结构本身不会增加计算复杂性。但是选择结构却是算法实现中非常重要的表达方式，可以有效地解决人们思维中的选择机制问题。因此，在算法的构造中通常少不了选择结构的运用。


    ![](img/f188b68deb37acb6105ba97c814d9af2_69_0.png)


    图 3-8 情况语句的程序流程图


    ### 3.2.2 迭代结构


    在算法构造中第二种实现结构就是迭代结构。


    迭代结构亦称循环结构，是最重要的控制结构，也是软件设计人员需要掌握的基本技能。当条件成立的时候，执行循环体内的代码，当条件不成立的时候，跳出循环，执行循环结构后面的代码。


    迭代结构可以减少源程序重复书写的工作量，用来描述重复执行某段算法的问题，这是程序设计中最能发挥计算机特长的程序结构。


    在算法的迭代结构中，一组指令以循环方式重复执行。为了更好地理解这种循环结构，我们再以上述数据查找算法为例，来详细分析循环结构算法的特点。在上述 Search
    算法中，为了解决姓名查找问题，我们是从名单首列开始依次逐一将待查姓名与名单中出现的姓名进行比较，找到了就查找成功；如果名单结束也没有找到，则查找失败。现在，如果名单是按照字母顺序排列的，那么只须按照字母顺序查找即可，不必比较所有的表项。这样，实现这一过程的伪码可以表示如下：


    ```

    Proceduresearch(list, TargetValue)

    if(list 为空)

    then(返回失败)

    else(

    TestEntry←在 list 中选择第一个表项；

    while(TargetValue>TestEntry 且 TestEntry 不是最后一个表项)

    do(TestEntry←在 list 中选择下一个表项)；

    if(TargetValue=TestEntry)

    then(返回成功)

    else(返回失败)

    )endif

    ```


    上述新的 Search 算法是按照字母排列顺序来查找的，因此称其为顺序查找算法。简单分析可知，该算法的计算代价主要体现在 while 语句，如果表的长度为
    n 的话，那么平均需要计算 n/2 计算步，因此算法的计算复杂性为 O(n)。


    实际上，该算法中 while 语句就是一个迭代结构，而其中的指令“TestEntry <- 在 list 中选择下一个表项”以重复的方式被执行。


    通常，一条或一组指令的重复使用方式称为循环的迭代代码。这样的结构一般由两个部分组成：循环体和循环控制条件。在上述顺序查找算法中，是通过 while 语句来实现这样的迭代结构，其循环控制过程是检查条件、执行循环体、检查条件、执行循环体……直到条件为假。


    一般，循环控制由状态初始化、条件检查和状态修改三个环节部分组成，其中每个环节都决定着循环的成败与否。其中状态初始化设置一个初始状态，并且这一状态是可以被修改的，直到满足终止条件；条件检查是将当前状态与终止条件比较，如果符合就终止循环；状态修改就是对当前状态进行有规律地改变、使其朝着终止条件发展。比如在顺序查找算法中，实现状态初始化的语句就是


    ```

    TestEntry <- 在 list 中选择第一个表项

    ```


    条件检查部分是


    ```

    TargetValue > TestEntry 且 TestEntry 不是最后一个表项

    ```


    而状态修改部分则是


    ```

    TestEntry <- 在 list 中选择下一个表项

    ```


    这样，三个部分的联合就构成了一个循环迭代代码。图 3-9 给出了 while 循环迭代代码结构及其对应的 N-S 盒图表示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_70_0.png)


    图 3-9 while 循环迭代代码结构及其对应的 N-S 盒图表示


    当然，除了 while 语句外，也可以采用 repeat 语句来实现循环控制过程，其使用规定如下：


    ```

    repeat(活动)until(条件)

    ```


    其中 repeat、until 都是保留词。repeat 语句的含义如图 3-10 所示，跟 while 语句不同之处是先执行循环体，然后进行条件检查。


    ![](img/f188b68deb37acb6105ba97c814d9af2_71_0.png)


    图 3-10 repeat 语句的程序流程图


    由于 while 语句先检查条件，因此有可能循环体一次也不被执行就终止了循环；而 repeat 语句则起码要执行一次循环体，然后才有可能终止循环。我们称 while
    语句是预查循环，而 repeat 语句是后查循环。图 3-11 所示为 repeat 循环迭代结构及其对应的 N-S 盒图表示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_71_1.png)


    图 3-11 repeat 循环迭代结构及其对应的 N-S 盒图表示


    图 3-12 给出了一个完整程序流程图转为盒图表示的实例。其中（a）为求最大公约数的程序流程图，（b）为对应的 N-S 盒图表示形式。从图 3-12 不难看出，用盒图表示算法结构具有十分简洁、直观和明确的特点。特别是对于循环迭代结构，可以一目了然地得到清晰的表达。


    ![](img/f188b68deb37acb6105ba97c814d9af2_72_0.png)


    (a) 求最大公约数流程图 (b) 对应N-S盒图表示


    图 3-12 完整程序流程图转为盒图表示的实例


    ### 3.2.3 递归结构


    任何一个可以用计算机求解的问题所需的计算时间都与其规模有关。问题规模越小，解题所需的计算时间往往也越少，计算也越容易。要解决一个较大的问题，有时是相当困难的。分治策略是应用最多的一种有效方法，它的基本思想是将问题分解成若干个子问题，子问题较原问题无疑是会容易些，然后求解子问题，并由此得出原问题的解，就是所谓的“分而治之”的意思。分治策略还可以递归，即子问题仍然可以用分治策略来处理，最后的问题非常基本而且简单。


    分治的基本思想是将一个规模为 n 的问题分解为 k 个规模较小的子问题，这些子问题互相独立且与原问题相同。找出各部分的解，然后把各部分的解组合成整个问题的解。实现算法的同时，需要估计算法所需时间。分治算法在每一层递归上分为三个步骤，首先是分，即将原问题分解成一系列子问题。其次是治，即递归地解各子问题，若子问题足够小，则直接解之。最后是合，即将子问题的结果合并成原问题的解。


    分治算法的时间由解决各个子问题所需的时间（由子问题的个数、解决每个子问题的时间决定）确定。


    在 C 语言中，重复性操作可以通过循环结构或者递归结构完成。递归结构清晰，可读性强，而且容易用数学归纳法来证明算法的正确性，因此它为设计算法、调试程序带来很大方便。


    从递归算法的结构来分析，设计递归算法时，无非要解决两个问题：递归出口和递归体。即要确定何时到达递归出口，何时执行递归体，执行什么样的递归体。递归算法设计的关键是保存每一层的局部变量并运用这些局部变量。由此，递归算法的设计步骤可从以下三步来进行：第一步，分析问题，分解出小问题；第二步，找出小问题与大问题之间的关系，确定递归出口；第三步，写出算法。


    最后我们来分析递归结构。所谓递归，就是重复进行自身调用。


    图 3-13 给出了有关“花哨名词”递归迁移网(RTN)，它可以产生任意复杂的名词短语，其中用到的一个重要机制就是递归结构。


    ![](img/f188b68deb37acb6105ba97c814d9af2_73_0.png)


    图 3-13 “花哨名词”递归迁移网(RTN)


    在算法结构中也一样，存在着比循环还要复杂的递归结构，同样可以实现重复计算任务。如果说循环是通过重复执行同样一组指令的方式来进行的，那么递归则是通过将一组指令当作自身的一个子程序进行调用来进行的。


    为了直观起见，下面通过一个名叫折半查找的算法来说明算法中的递归结构。


    对于同样的名字查找问题的递归分析，具体构造的算法如下：


    ```

    ProcedureSearch(List, TargetValue)

    if(list)

    then

    （返回失败）

    else(

    TestEntry←选择 List 的 "中间"值；

    switch(TargetValue)(

    case(TargetValue= TestEntry)(

    返回成功

    )

    case(TargetValue>TestEntry)(

    AList←位于 TestEntry 前半部分 List

    返回 ProcedureSearch(BList, TargetValue) 的返回值

    )

    )

    )endif

    ```


    上述算法中，出现了过程自身调用的情况，这便是递归结构。递归过程的控制主要是通过过程调用参数的变化来进行的。在上述算法中这样的参数就是列表本身。如果追踪某个递归过程，那么就会发现，其计算过程是一层一层递进的，然后再一层一层返回。


    对于递归结构而言，在动态执行过程中，递进的最大层数就称为该递归结构的递归深度。对上述折半算法分析可知，递归算法的计算复杂性与递归深度密切关联，如果表的长度为
    n 的话，那么平均需要计算的递归深度为 log 2n，因此此算法的计算复杂性为 O(log 2n)。显然，折半查找算法的效率要高于顺序查找算法的效率。


    另一个需要运用递归结构来设计求解算法的就是如图 3-14 所示的汉诺塔问题。相传印度教的天神梵天在创造地球这一世界时，建了一座神庙，神庙里竖有三根宝石柱子，柱子由一个铜座支撑。梵天将
    64 个直径大小不一的金盘子，按照从大到小的顺序依次套放在第一根柱子上，形成一座金塔，即所谓的汉诺塔(又称 Hanoi 塔)。天神让庙里的僧侣们将第一根柱子上的
    64 个盘子借助第二根柱子全部移到第三根柱子上，即将整个塔迁移，同时定下三条规则：


    - 1. 每次只能移动一个盘子；

    - 2. 盘子只能在三根柱子上来回移动，不能放在他处；

    - 3. 在移动过程中，三根柱子上的盘子必须始终保持大盘在下，小盘在上。


    天神说：“当这 64 个盘子全部移到第三根柱子上后，世界末日就要到了”。这就是著名的汉诺塔问题。


    用计算机求解一个实际问题，首先要从这个实际问题中抽象出一个数学模型，然后设计一个解此数学模型的算法，最后根据算法编写程序，调试、编译、连接和运行，从而求解该问题。图
    3-15 给出了求解 n 个圆盘难题的总体求解过程。其汉诺塔问题的算法为：


    ![](img/f188b68deb37acb6105ba97c814d9af2_74_0.png)


    递归调用 n-1 个圆盘的汉诺塔问题算法，把上面的 n-1 个圆盘从 A 柱移到 B 柱；

    把最下面的一个圆盘从 A 柱直接移到 C 柱；

    递归调用 n-1 个圆盘的汉诺塔问题算法，把 B 柱上临时存放的 n-1 个圆盘移到 C 柱。

    下面利用 C 语言给出该问题的求解算法的描述。


    ```

    hanoi(int n, char left, char middle, char right)

    {if(n==1) move(1, one, _, three);

    else

    {hanoi(n-1, left, right, middle);

    move(1, left, _, right);

    hanoi(n-1, middle, left, right);

    }

    }

    ```


    以上代码中，n 表示 n 个盘子的汉诺塔问题，left 表示第一个柱子，middle 表示第二个柱子，right 表示第三个柱子。函数 hanoi(n-1,
    left, right, middle) 表示 n-1 阶汉诺塔从第一个柱子借助第三个柱子先移到第二个柱子上，函数 move(1, left, _, right)
    表示将第一个柱子上最后一个盘子直接放到第三个柱子上，函数 hanoi(n-1, middle, left, right) 表示 n-1 个盘子借助第一个柱子移到第三个柱子上。在以上
    C 语言描述的算法基础上，进行适当扩充就可以形成一个完整的程序，经过编译和连接后，计算机就可以执行这个程序，按照递归的方法将问题求解出来（图 3-16）。


    ![](img/f188b68deb37acb6105ba97c814d9af2_75_0.png)


    图 3-16 汉诺塔问题分解示意图


    其中“左向递归”是借助 C，将 A 柱上方的 n-1 个盘子移到 B 柱；“右向递归”则是借助 A，将 B 柱上 n-1 个盘子移到 C 柱。图 3-17
    给出的就是当 n=3 时，上述算法的实际递归执行过程。


    对于递归结构的程序算法，保证递归过程终止的条件也是需要考虑的问题。比如上述折半查找算法中表列为空或者找到目标，可以保证递归过程的终止；而汉诺塔问题只须保证塔高层次
    n 是有限值即可。与循环终止条件的显式表示不同，递归终止条件往往是隐含表示的，因此在设计递归算法时需要格外注意。因为，有时不恰当的递归也会产生悖论，使计算无法终止。


    最后，我们强调指出，从理论上讲，所有算法的结构都可以看作并化解为递归结构，关键在于递归的深度。其中作为计算理论之一的递归函数论，就是以递归的思想建立起完整的计算理论模型的。这就是我们在算法构造的原语介绍中，一开始就将各种算法步骤的描述

