    反射过程是按如下方式进行的：一定的刺激被一定的感受器所感受，感受器发生了兴奋(若受损机体，机体既无感觉又无效应)；兴奋以神经冲动的方式传入神经，传向中枢；通过中枢的分析与综合活动，中枢产生兴奋；中枢的兴奋又经一定的传出神经到达效应器，使根据神经中枢传来的兴奋对外界刺激做出相应的规律性活动；兴奋又由神经中枢传至效应器。


