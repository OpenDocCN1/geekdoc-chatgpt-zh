    ## 5.3 应用案例——深度学习技术及其在医疗领域中的应用


    目前，深度学习技术已在图像识别、语音识别、自然语言处理等方面有了十分成功的应用，但在医疗领域与深度学习结合的研究较少，商业化应用的项目更是屈指可数。许多科技公司正在尝试通过深度学习技术，进行医学影像分析、疾病诊断等工作，从而降低医生的工作强度，提高工作效率，弥补医疗资源不足。


