    \n## 3 人工智能的基础算法理论\n\n算法是计算机科学领域最重要的基石之一，许多学生认为学计算机就是学各种编程语言，或者认为，学习最新的语言、技术、标准就是最好的铺路方法。编程语言虽然该学，但是学习计算机算法和理论更重要，因为计算机语言和开发平台日新月异，但万变不离其宗的是那些算法和理论，例如数据结构、算法、编译原理、计算机体系结构、关系型数据库原理等。算法构成了人工智能的最为核心的内容。比如，你希望机器具备与人打桥牌这样一个智力游戏的能力，那么你就需要为机器编制完成这样任务的算法。\n\
    \n通过编制算法人类才可以将智慧“植入”机器系统中，从而构建能够表现智能行为的机器。因此，编制的算法越有智慧，那么所构建的机器也就越能够具有更加智慧的行为表现。从某种意义上讲，机器智能的限度就是能否找到相应智能算法的限度。能够找到算法的智能任务范围，也就是智能机器的可达能力范围。\n\
    \n人工智能研究的一个重要目的就是要找出尽可能多的智能算法，使我们的机器拥有尽可能多的心智能力。由此可见，算法在智能科学与技术领域中的重要地位，掌握算法运用的方法也就成为学习这一专业的最基本技能。\n\
    \n### 3.1 人工智能的算法构成\n\n算法(Algorithm)就是实现目标任务的程序步骤，以解决逻辑或数学上的问题。计算机运用的每一个程序都是一个算法，其中的每个函数也都是一个算法。因此，实现目标任务时，首先是发现一个可以解决问题的算法，下一个重要的步骤就是考虑决定该算法所耗的资源，包括空间时间。接着是优化问题，优化问题是以数学思想为基础，用来求解问题的最优方案。\n\
    \n优化思维弥漫在我们生活的各个角落，例如，复杂的城市智能交通系统如何高效地调整区域交通控制信号才能更好地降低车辆延误的平均时间？在互联网时代，智能物流配送如何为我们的生活提供了便利？在满足多样化用户需求的前提下，如何更有效地运用现有资源，获得最大的经济效益？优化问题在饮食、服装、机械、金融、汽车、互联网、船舶、电子、建筑业等方面得到迅速的推广与应用。\n\
    \n针对这些问题，学者提出了智能优化算法。智能优化算法以数学和生物学为基础，算法新颖独特。但这类算法往往不能确保解的最优性，众多情况下是在一个可以接受的解集中找到一个全局最优解。智能算法在处理非确定性信息方面发挥着独特优势，对计算中数据\n\
    \n"
