    # (2) 牵张反射


    牵张反射是指当骨骼肌受到外力牵拉时，能通过反射性活动，使受牵拉的肌肉收缩，这种反射称为牵张反射。膝跳反射就是一种牵张反射。


    肌梭：肌梭是牵张反射的感受器，它位于肌肉纤维之间，与肌肉纤维平行排列（图 6 - 4）。肌梭的结构比较特殊。它由一束特别的肌肉纤维、神经末梢及胞囊组成。肌梭内的特别肌肉纤维称为梭内肌，而肌梭外普通肌纤维称为梭外肌。梭内肌根据其形态又可分为核袋纤维和核链纤维。梭内肌的中央部不含肌原纤维，不能收缩，但有很好的弹性。


    ![](img/f188b68deb37acb6105ba97c814d9af2_136_0.png)


    传入纤维分布在梭内肌的中央，它的直径较粗（12 ~ 20 μm)，传导速度也较快（90 m/s）。当肌肉被牵拉时，不仅拉长了梭外肌，也拉长了梭内肌，特别是梭内肌的中央部分。牵拉是对肌梭的有效刺激。


    这一刺激在肌梭内被转变为冲动，通过传入纤维将冲动传到中枢。因此肌梭实际上是一种牵张受体。肌梭内的梭内肌也受由脊髓 γ 运动神经元发出的传出神经支配，它可引起梭内肌收缩。由于梭内肌的肌原纤维分布在两端，因此两端收缩则拉长了梭内肌的中央部，对感受器是一种刺激或提高肌梭对牵张刺激的感受性，从而增加其向中枢发放的冲动。由肌梭传入的冲动，在脊髓可使支配骨骼肌的
    α 神经元兴奋，这就是梭内肌中传出和传入神经的作用。


    支配梭外肌的神经纤维来自脊髓中的 α 神经元，它使梭外肌收缩。如果梭外肌的收缩缩短了整块肌肉的长度，由于肌梭与梭外肌呈平行排列，因此梭内肌的长度也缩短，对肌梭的牵张作用减少或消失，向中枢发放的冲动减少，也就不再引起脊髓中
    α 神经元兴奋，肌肉停止收缩。由此可见，α 神经元兴奋使梭外肌收缩，肌肉缩短，可降低对肌梭的刺激作用。而 γ 神经元兴奋，使梭内肌收缩，增加对肌梭的刺激。因此，对肌梭的传入神经冲动，α
