    ### 6.2.3 高仿机器人


    仿真人机器人就像真人，具有丰富的表情，这是仿人机器人研究一直追求的目标。目前，高仿真度仿真人机器人取得了一些突出成果，可以说话、变换表情，人机交流效果好，引起人们的关注。


    日本科学家今年推出一款以一名年轻女性为原型的仿真机器人。“她”能够模仿人类多种表情和动作，几乎以假乱真。这款机器人配备动作捕捉系统和 12 个气压传动装置，能够同步模仿人类行走、说话等动作。面部由橡胶制成，能够做出微笑、咧嘴笑和皱眉等表情。这款机器人(现阶段)在
    5～10 秒的时间让人难辨真伪，科学家们正在把这段时间延长至 10 分钟。


