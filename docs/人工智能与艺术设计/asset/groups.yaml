    # 3.2.2 迭代结构


    在算法构造中第二种实现结构就是迭代结构。


    迭代结构亦称循环结构，是最重要的控制结构，也是软件设计人员需要掌握的基本技能。当条件成立的时候，执行循环体内的代码，当条件不成立的时候，跳出循环，执行循环结构后面的代码。


    迭代结构可以减少源程序重复书写的工作量，用来描述重复执行某段算法的问题，这是程序设计中最能发挥计算机特长的程序结构。


    在算法的迭代结构中，一组指令以循环方式重复执行。为了更好地理解这种循环结构，我们再以上述数据查找算法为例，来详细分析循环结构算法的特点。在上述 Search
    算法中，为了解决姓名查找问题，我们是从名单首列开始依次逐一将待查姓名与名单中出现的姓名进行比较，找到了就查找成功；如果名单结束也没有找到，则查找失败。现在，如果名单是按照字母顺序排列的，那么只须按照字母顺序查找即可，不必比较所有的表项。这样，实现这一过程的伪码可以表示如下：


