    以及看电影、看演唱会、看表演、在大自然的漫游等。“玩”对动物生物的学习进化具有积极推动的意义，在动物进化生长过程中动物靠玩乐来锻炼、学习与显示自己，动物在玩乐中不断地试验、发现并进而发掘、发展自己的潜能，辅助实现着动物的成长进化乃至最后的分化。就如猫科动物之所以会分化为猫、狮子、老虎、豹子等，不仅是自然选择的结果，也是各种猫科动物通过自然选择与玩乐感觉到自己能力的成长与局限性，并将这种经验遗传下来的结果。


    # 2. 行为的社会学定义与基本要素


    # (1) 行为的社会学定义


    在社会学意义上，行为是人类或动物在生活中表现出来的生活态度及具体的生活方式，它是在一定的条件下，不同的个人、动物或群体表现出来的基本特征或对内外环境因素刺激所做出的能力反应。


    人类行为是人类在生活中表现出来的生活态度及具体的生活方式，它是在一定的物质条件下，不同的个人或群体在社会文化制度、个人价值观念的影响下，在生活中表现出来的基本特征或对内外环境因素刺激所做出的能力反应。人的行为可分为外显行为和内在行为：外显行为是可以被他人直接观察到的行为，如言谈举止；而内在行为则是不能被他人直接观察到的行为，如意识、思维活动等，即通常所说的心理活动。一般情况下，可以通过观察人的外显行为，进一步推测其内在行为。


    # (2) 行为的基本要素


    一般来说，人的行为由 5 个基本要素构成，即行为主体、行为客体、行为环境、行为手段和行为结果。


    +   - 行为主体：人，具体而言是指具有认知、思维能力，并有情感、意志等心理活动的人；

    +   - 行为客体：人的行为目标指向物；

    +   - 行为环境：行为主体与客体发生联系的客观环境；

    +   - 行为手段：行为主体作用于客体时所应用的工具和使用的方法等；

    +   - 行为结果：行为主体预想的行为与实际完成行为之间相符的程度。


    人类行为的发生过程是以内外环境的刺激为基础的，人类行为产生的最重要的刺激源是与人的客观需求相联系的因素。


