    50% 的工作。设计教育的改革和转型，需要更新教育的观念、内容和模式方法。人工智能在辅助设计和艺术设计教育中的创新型应用究竟能有多少？学习艺术的人不知道，学习技术的人更加说不清楚，只有通过渐进式的使用创新，才能在一定程度上带来适合艺术设计创新的设计教育资源以及艺术设计创新思维。


    人工智能在全球数字化进程迅速发展背景下，两者的融合正在迅速地重构艺术设计的领域、设计手段和艺术表现形式，人们将这种数字媒体设计的又一次升级简称为“数智艺术”。美国高德纳咨询公司（Gartner
    Group）发布的《2017 新兴技术成熟度曲线报告》指出：人工智能技术在 33 项新技术中占据了 50% 以上的比例，已经到达了曲线的顶峰，这也预示着在未来
    2 至 5 年内，人工智能技术将得到广泛的应用。人工智能技术是兼具环境感知、记忆、推理、学习能力的智能系统，在设计领域中，计算机辅助设计（CAD）正在向人工智能辅助设计（AI
    Design）的方向发展。例如，“双 11”期间阿里巴巴公司的人工智能产品“鲁班”，设计了 4 亿张广告横幅，惊艳了众人。可是在人工智能取代基础美工进行设计的同时，《第一哲学沉思集》中提到：人们也发现机器对于美的理解和判断，并不是单纯靠计算机语言来实现的。设计师成为“训练师”来培养计算机的美感，从而使计算机能够在设计和学习的过程中逐渐产生一种类人类的智慧，能够对于设计美学产生理解和思考，进而反映在设计作品中。在数字化进程中，智性设计、智能设计满足了新一代消费主力的新型消费观念，对量化、规模化生产所带来的“消费观”，从过去的实用主义观念上升到了个人主义和享乐主义的消费观。从现象层面上看，美学的思考提倡的高度个性化、定制化的消费观，人们正在回归“审美泛化”的文化潮流。从美学的角度去审视智慧生活中艺术和生活的界限，可以促使艺术与科技、艺术与生活更好地结合，让美自然存在于数字化都市的生活中，也是一种设计的智慧。


    发展人工智能的目的是更好地服务于人自身，艺术和设计正是从人的情感的体验角度出发。艺术强调人的主观概念的表达，人工智能应用的未来，更多地要思考人的需求以及在不同的生活环境中需求的改变。从目前人工智能的应用场景来看，应用人工智能去解决确定边界的事情，人一定会输给机器；但是需要依靠感性决策做判断时，应用人工智能以大数据为基础进行的逻辑推理往往是靠不住的。就目前可见的未来而言，人工智能只能提供技术，优秀作品的出现，一定是当时的时代有新的技术或者手段出现。达·芬奇的作品为什么这么成功？因为当时他运用了新的颜料、新的绘画技法、新的工具。人工智能可以帮助我们进行创作吗？对于艺术来说，强调的是人的主观概念的表达。齐白石曾经说过“似则俗，不似则非”，艺术是没有界限的，所以这部分，人工智能技术永远没有办法取代人类来完成。数智艺术设计的关键还是在于应用人工智能技术来引入新的手段和媒介，以此丰富人们的艺术设计方法，数字艺术与人工智能结合的核心还是取决于人的价值观。'
