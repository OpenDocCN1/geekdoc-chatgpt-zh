    情味。


    知识获取是专家系统知识库是否优越的关键，也是专家系统设计的“瓶颈”问题，通过知识获取，可以扩充和修改知识库中的内容，也可以实现自动学习功能。


    专家系统的结构是指专家系统各组成部分的构造方法和组织形式。系统结构选择的恰当与否，是关系到专家系统有用性和有效性的关键问题。作为某一个具体系统的设计人员可以从以下几个方面考虑来做出正确的选择，以达到设计出合适的应用系统的目的。


    首先，一个具体的专家系统选择什么样的结构最为恰当，要根据系统的应用环境和要完成的任务特点而定。例如，MYCIN 系统的任务是疾病诊断和解释，其任务的环境和特点是较小的可能解空间，可靠的数据和较可靠的知识，这就决定了它可以采用穷尽检索空间，单链推理等较简单的控制方法和系统结构。与此相对应，HEARSAY
    – II 系统的任务是进行口语理解，这一任务需要检索巨大的可能解空间，独立简单的数据和知识不是很可靠，需要利用多知识源的知识，缺少解决问题的较固定路线，经常需要猜测才能继续进行推理等。所有这些特点决定了
    HEARSAY – II 系统必须采用比 MYCIN 系统更为复杂的结构。


    专家系统的任务特点有很多，但一般来说，下面三个因素会增加问题求解的困难程度，即数据和知识的不确定性、数据的时变性及需要检索大型可能解空间。第一个因素，不确定性，目前处理不确定数据和知识主要有工程方法、控制方法和并行确定推理三类方法。第二个因素，时变性，一些专家系统处理的数据是动态变化的，这就要求推理机必须有较快的推理速度，并将某些决策建立在对未来的期望上，在当前数据否定了以前做出的错误假定时，能够修改决策。具体方法有情况计算法和周期处理法等方法。情况计算法是在处理任务中其他目标变化的同时，也对环境的变化进行处理。周期处理法周期地接收一组新数据，每次都重新执行整个推理过程。第三个因素，大空间，专家系统所处理的复杂问题大多需要考虑众多的可能性。检索巨大的可能解空间，往往不能使用穷尽检索法来进行检索，因而需要使用一些限制方法来缩小检索的范围。当问题的解由一些能独立生成的分子解组合而成，并且组合后满足一定的限制时，就可以利用一些修剪规则把不能满足限制的部分解剪掉；也可以通过着重强调某些关键问题的重要性来缩小需要检索的空间；或把检索空间分层，自顶向下逐步求精。在自顶向下逐步求精过程中，需要考虑子问题之间的相互作用，利用问题求解过程中得到的反馈信息对检索空间进行限制。为了增加系统的推理能力，也可以使用多路推理，使用不同的抽象模型和使用多知识源知识，也可以使用机缘调度方法来控制检索宽度，为了提高效率，还可以采用专用数据结构及知识编译程序。


    其次，黑板结构是一种常用的专家系统结构。在这种结构中，系统以黑板这个全局数据库作为通信控制手段，利用多知识源的知识，进行多路推理，并共享数据和结果。许多复杂的问题常常需要运用多知识源知识才能解决，即需要多个专家提供的多种知识。例如，HEARSAY
    – II 在进行语言理解时，就需要用到语义学、信号数字化等多种知识。黑板作为系统的公共数据区，记录着有关问题的数据、推理的现时状态、推理的中间结果及一些系统需要的控制信息。这样，黑板也就成了各知识源进行间接通信的媒介。黑板中的数据项，也称为假设，通常按照某种方式分层（例如可按系统对数据的处理顺序分层），每层对应于一个知识源，也就是说，每个知识源及黑板中的相应数据构成一个子专家系统。对应于每个知识源，都有一个前提模块和一个动作模块。前提模块的功能是为动作模块收集有用的数据，这些数据可以是对应数据层的数据，也可以是其他层的数据。前提模块中还拥有一个基本条件，通常定义为未处理过的新数据的数量限制。只有当这个基本条件满足时，前提模块才开始工作，也称该知识源被激活。动作模块的功能是当前提模块数据收集完毕时，利用知识源的知识，对相应结果进行处理，其结果是增加或更新黑板中的数据，而这又为激活其他知识源创造了条件。采用黑板结构可以大大减少重复查询和推理，同时知识的模块化也使得知识的更新和扩充过程更加简便，提高了知识表示的能力，增强了推理的功能。这种结构特别适合于建造大型或分布式专家系统。


    然后，多层系统结构也是一个比较好的专家系统结构的选择。在工程分析和多信号解释等许多问题领域中，往往需要把专家解决问题时所用到的定量（数学）技术同使用这些技术的经验知识结合起来，才能很好地解决问题。多层系统就是适应这一要求的一种系统结构。多层系统是表层系统与深层系统结合而成的。表层系统通常利用一些定性的经验知识，直接把输入状态同动作联系起来，比较适合分类问题。系统所使用的知识一般都不难表示成易于处理的产生式规则的形式，知识的编码比较简单。表层系统比较普遍，如
    MYCIN、RI 等都属于表层系统。另一方面，深层系统通常利用数学模型、模拟过程及一些较定性的因果关系等基本理论和方法，对问题进行定量分析。系统所使用的知识大多采用过程式表示方法表示。这些过程与领域问题密切相关，具有很强的问题求解能力，但程序编码比较复杂。深层系统比较适合于处理较复杂的问题。如
    DENDRAL、HEARSAY – II 都属于这类系统。多层系统使用深层定量模型分析问题中的基本性质，得出基本结果，再使用表层模型解释这些结果，进行全局推理。就这样，深层与表层模型协作，共享数据和结果，完成系统的问题求解任务。


    最后，专家系统结构中的知识结构也是很重要的。元知识结构是一种很有前途的系统结构，它可以使系统根据不同的情况，灵活选用恰当的问题求解方法，因而可以大大提高推理的效率。专家系统中所使用的知识有两类，一类是领域知识，一类是元知识。元知识是关于领域知识的内容、结构和使用的知识，是问题求解期间使用的推理、演绎和论证方法的知识。元知识大致可分为如下七种：


    - (1) 有关规则选择的知识。例如“尽可能选用那些使用便宜材料的规则”就是这种知识。在专家系统运行的某一时刻，可能有多个规则的前提条件被满足，非元知识系统通常按照固定算法选用一个规则，而元知识系统可以利用元知识恰当地选用规则。

    - (2) 关于事实的知识。若要使用上面列举的那条元知识，就需要有描述材料价格的知识，即关于事实的知识。

    - (3) 论证规则的知识。例如，若有规则“如果溢出液是硫酸，则用石灰”，则论证规则的元知识为“石灰能中和酸且所形成的化合物能够沉淀出来”。

    - (4) 关于检查规则中语法或语义错误的知识。

    - (5) 论证程序结构的知识。

    - (6) 有助于系统适应运行环境的知识。

    - (7) 说明程序功能的知识。以上这些元知识，主要应用于系统的推理、控制、解释、知识获取和学习过程中。元知识结构就是利用上面介绍的元知识，对问题求解过程进行控制，根据具体情况选择合适的问题求解方法，使系统具有高效的性能。


    专家系统自 20 世纪中期起就作为一种研究对象被逐渐深入研究，作为人工智能的一个重要组成部分，其是一款模拟人类专家的决策过程来解决需要人类专家处理的复杂专业性问题的智能软件。与此同时，专家系统技术的发展也促进了专家系统工具的发展，CLIPS
    就是一款典型的专家系统工具。由于 CLIPS 专家系统工具具有固定模式的知识表示方式，推理机也是完全独立的功能模块，这使得数据和作用在数据上的知识明确分离，并且可以忽略程序的执行顺序。因此
    CLIPS 使得开发一个专家系统变得容易，从而减少了开发时间。同时其是一个通用的专家系统工具，有很强的兼容性，可安装在任何 C 编译器上。最初的 CLIPS
    仅支持基于规则的编程，目前已经从微型机被移植到了大型机中的多平台上，CLIPS 平台的基本结构如图 7-4 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_154_0.png)


    基于规则的 CLIPS 由事实、知识库、推理机三部分构成。CLIPS 的知识主要体现在以下三个方面：


    - (1) 规则，主要用于体现以经验为基础的启发性知识；(2) 通用函数和自定义函数，用于体现过程性知识；(3) 面向对象编程，同样适用于体现过程性知识。


    支持面向对象编程的 5 个普遍特点：类、消息处理、抽象、封装、继承和多态。


    CLIPS 在原理上是将知识库分成一个个独立的组成单元，然后每个单元包括属于该模块的规则、模板和事实，且模块之间共享模板和事实。


    ## 7.1.2 专家系统的类型


    专家系统根据不同的划分标准可以有多种类型划分，例如，按知识表示的技术划分可以划分为基于逻辑的专家系统、基于规则的专家系统、基于语义网络的专家系统和基于框架的专家系统。如果按任务类型划分，可以划分为以下九种。


    - (1) 诊断型专家系统：根据对症状的观察分析，推导出产生症状的原因以及排除故障方法的一类系统，如医疗、机械、经济等。

    - (2) 解释型专家系统：根据表层信息解释深层结构或内部情况的一类系统，如地质结构分析、物质化学结构分析等。

    - (3) 预测型专家系统：根据现状预测未来情况的一类系统，如气象预报、人口预测、水文预报、经济形势预测等。

    - (4) 设计型专家系统：根据给定的产品要求设计产品的一类系统，如建筑设计、机械产品设计等。

    - (5) 决策型专家系统：对可行方案进行综合评判并优选的一类专家系统。

    - (6) 规划型专家系统：用于制订行动规划的一类专家系统，如自动程序设计、军事计划的制订等。

    - (7) 教学型专家系统：能够辅助教学的一类专家系统。

    - (8) 数学专家系统：用于自动求解某些数学问题的一类专家系统。

    - (9) 监视型专家系统：对某类行为进行监测并在必要时候进行干预的一类专家系统，如机场监视、森林监视等。


    目前已研究的专家系统模型有很多种。其中较为流行的有基于规则的专家系统、基于案例的专家系统、基于框架的专家系统、基于模糊逻辑的专家系统、基于 D - S 证据理论的专家系统、基于人工神经网络的专家系统和基于遗传算法的专家系统等。


    - (1) 基于规则推理(Rule Based Reasoning，RBR)的方法是根据以往专家诊断的经验，将其归纳成规则，通过启发式经验知识进行推理。它具有明确的前提，得到确定的结果。RBR
    是构建专家系统最常用的方法，这主要归功于大量的成功实例和工具的出现。早期的专家系统大多数是用规则推理的方法，如 DENDRAL 专家系统、MYCIN 专家系统、PROSPECTOR
    专家系统等。在转换为机器语言时，用产生式的“IF … AND (OR) … THEN…”表示，因此这种系统又称为产生式专家系统。


    基于规则的方法容易使知识工程师与人类专家合作，易于被人类专家理解。规则库中的规则具有相同的结构，即 IF…THEN…结构，这种统一的格式便于管理，同时便于推理机的设计。但它也有诸多缺点，如规则间的相互关系不明显，知识的整体形象难以把握、处理效率低、推理缺乏灵活性；对于复杂系统难以用结构化数据来表达，如果全部用规则的形式来表达，不仅提炼规则相当困难，而且规则库将十分庞大和复杂，容易产生组合爆炸；在实时处理方面的应用也已被证明比较困难。速度是实时性能最根本的要求，而产生式系统在处理实时任务时，其搜索、匹配时间要占全部计算时间的
    90%。基于规则的专家系统的特点决定了其适合的领域为：① 系统结构简单，有明确的前提和结论，问题仅仅用有限的规则即可全部包含；② 问题领域不存在简洁统一的理论，知识是经验的；③
    问题的求解可视为一系列相对独立的操作，或从一个状态向另一个状态的转换；一个操作或转换可以被有效地表示为一条或多条产生式语句。


    - (2) 基于案例推理(Case Based Reasoning，CBR)的方法就是通过搜索曾经成功解决过的类似问题，比较新、旧问题之间的特征及发生背景等差异，重新使用或参考以前的知识和信息，最终解决新问题的方法。它起源于
    1982 年美国学者 Roger Schank(关于人类学习和回忆的动态存储模型的研究工作)。第一个真正意义上的基于案例的专家系统是 1983 年由耶鲁大学
    Janet Kolodner 教授领导开发的 CYRUS 系统。它以 Schank 的动态存储模型和问题求解的 MOP 理论为基础，做与旅行相关的咨询工作。这种类比推理比较符合人类的认知心理。基于案例的专家系统具有诸多优点：无须显示领域知识；无须规则提取，降低了知识获取难度；开放体系、增量式学习，案例库的覆盖度随系统的不断使用而逐渐增加。基于案例的推理方法适用于定理难以表示成规则形式，而容易表示成案例形式并且已积累丰富案例的领域(如医学诊断系统)。它的难点还在于案例特征的选择、权重分配以及处理实例修订时的一致性检验(特征变量间的约束关系)等问题。传统的基于案例的方法难以表示案例间的联系，对于大型案例库案例检索十分费时，并且难以决定应选择哪些特征数据及特征数据所占的权重。


    - (3) 基于框架(Frame)的专家系统也是一种不错的选择，框架是将某类对象的所有知识组织在一起的一种通用数据结构，而相互关联的框架连接组成框架系统。1975
    年，美国麻省理工学院著名的人工智能学者明斯基提出了框架理论，并把它作为理解视觉、自然语言对话及其他复杂行为的基础。在框架理论中，框架被视为表示知识的一个基本单位。它把要描述的事务各方面的知识放在一起，通过槽值关联起来。框架的顶层是代表某个对象的框架名，其下为代表该框架某一方面属性的若干个槽，槽由槽名和槽值组成。槽下还可分为若干个侧面（由侧面名和侧面值组成）。一个框架系统常被表示成一种树型结构，树的每一个节点是一个框架结构，子节点与父节点之间用槽连接。当子节点的某些槽值或侧面值没有被直接记录时，可以从其父节点继承这些值。框架系统中可以推理出未被观察到的事实，它将通过以下三种途径实现。①
    框架包含它所描述的情况或物体的多方面信息。这些信息可以被引用，就像已经直接观察到这些信息一样。② 框架包含物体必须具有的属性。在填充框架的各个槽时，要用到这些属性。建立对某一情况描述要求先建立对此情况的各个方面的描述。与描述这个情况的框架中各个槽有关的信息可用来指导如何建立这些方面的描述。③
    框架描述它们所代表的概念的典型事例。如果某一情况在很多方面与一个框架相匹配，只有少部分相互之间存在不同之处，这些不同之处很可能对应于当前情况的重要方面，也许应该对这些不同之处作出解答。框架表示法最突出的特点是善于表达结构性的知识，且具有良好的继承性和自然性。因此，基于框架的专家系统适合于具有固定格式的事物、动作或事件。


    - (4) 基于模糊逻辑的专家系统。模糊理论的概念由美国加利福尼亚大学教授扎德在其 Fuzzy Sets 和 Fuzzy Algorithm 等论著中首先提出。模糊性是指客观事物在状态及其属性方面的不分明性，其根源是在类似事物间存在一系列过渡状态，它们互相渗透、互相贯通，使得彼此之间没有明显的分界线。模糊性是客观世界中某些事物本身所具有的一种不确定性，它与随机性有着本质的区别。有明确定义但不一定出现的事件中包含的不确定性称为随机性，它不因人的主观意识变化，由事物本身的因果规律决定。而已经出现但难以给出精确定义的事件中包含的不确定性称为模糊性，是由事物的概念界限模糊和人的主观推理判断产生的。模糊逻辑理论则是对模糊事物相互关系的研究。基于模糊逻辑的专家系统的优点在于：①
    具有专家水平的专门知识，能表现专家技能，有足够的鲁棒性；② 能进行有效的推理，具有启发性，能够运用人类专家的经验和知识进行启发性的搜索、试探性的推理；③ 具有灵活性和透明性。但是，模糊推理知识获取困难，尤其是征兆的模糊关系较难确定，且系统的推理能力依赖模糊知识库，学习能力差，容易发生错误。由于模糊语言变量是用隶属函数表示的，实现语言变量与隶属函数之间的转换是一个难点。


    - (5) 基于人工神经网络系统。人工神经网络(Artificial Neural Network, ANN)仿效生物体信息处理系统获得柔性信息处理能力。它从
    20 世纪 80 年代后期开始兴起（由理论研究阶段发展到应用阶段）。它是从微观上模拟人脑功能，是一种分布式的微观数值模型，神经元网络通过大量经验样本学习知识。更重要的是，神经网络有极强的自学能力，对于新的模式和样本可以通过权值的改变进行学习、记忆和存储，进而在以后的运行中能够判断这些新的模式。神经网络模型从知识表示、推理机制到控制方式，都与目前专家系统中的基于逻辑的心理模型有本质的区别。知识从显示变为隐式表示。这种知识不是通过人的加工转换成规则，而是通过学习算法自动获取的。推理机制从检索和验证过程变为网络上隐含模式对输入的竞争。这种竞争是并行的针对特定特征的，并把特定领域输入模式中各个抽象概念转换为神经网络的输入数据。神经网络很好地解决了专家系统中知识获取的瓶颈问题，能使专家系统具有自学习能力。神经网络技术的出现为专家系统提供了一种新的解决途径。特别是对于实际中难以建立数学模型的复杂系统，神经网络更显示出其独特的功效。然而，神经网络专家系统也存在固有的弱点：①
    系统性能受到所选择的训练样本集的限制，训练样本集选择不当，特别是在训练样本集很少的情形下，很难指望它具有较好的归纳推理能力；② 神经网络没有能力解释自己的推理过程和推理依据及其存储知识的意义；③
    神经网络利用知识和表达知识的方式单一，通常的神经网络只能采用数值化的知识；④ 神经网络只能模拟人类感觉层次上的智能活动，在模拟人类复杂层次的思维方面还有不足之处。目前较为常用的神经网络有误差反传网络（BP）、小脑网络（CMAC）、自组织特征映射网络（SOM）、自适应共振理论（ART）和径向基网络（REF）等。基于神经网络的专家系统的具体应用形式可以根据实际情况选择不同的神经网络模型，能够实现不同的用途。因此，基于神经网络的专家系统是目前最流行的专家系统。


    ![](img/f188b68deb37acb6105ba97c814d9af2_157_0.png)


    ## 图 7-5 工业生产过程中的专家系统结构


    不同的系统类型可以应用于不同的实际需求当中，当然它们也可以相互结合起到更加积极有效的作用。如现实为满足市场需求，要设计一种智能检测系统平台应用到某一工业生产过程，该平台的专家系统可以采用模块化设计，将基于神经网络的推理机和基于规则的推理机结合设计一种基于神经网络的专家系统。如图
    7-5，图 7-6 所示，专家系统主要包括知识库、推理机、解释机、知识获取模块、检测参数输入模块、人机接口和产品检测对象数据库，其中知识库存放有关该产品的专业知识，包括征兆、检测知识、经验知识、对策知识和翻译词典，这些知识由知识工程师和领域专家合作获取，并通过知识获取模块按一定的知识表示形式存入到规则知识库，是专家系统的核心。推理机用于控制整个系统的运行，负责利用诊断知识库中的知识，并根据检测到的参数按一定的模式求解策略，进行推理决策，最后给出决策结果。其中系统学习模块采用的神经网络训练使得系统具有自学习能力。将决策设计为多种检测模式，每一模式又分别对应于某一特定的过程状态，通过人工神经网络识别判断出检测参数的变化模式，然后利用模式识别的结果，根据一定的规则对模式成员函数进行调节和修改，进而达到改善和提高在线模式识别可靠性的目的。另外针对发酵生产过程中温度、pH
    等检测参数与产品产出率和质量等参数检测联动模型，综合评价各参数生产过程中的变化对发酵后的结果造成的影响，通过专家系统学习，完成模式状态细分，保证检测平台的可靠性和精度要求。


    ![](img/f188b68deb37acb6105ba97c814d9af2_158_0.png)


    ## 7.1.3 专家系统的功能


    根据定义，专家系统应具备以下几个功能：(1) 存储问题求解所需的知识；(2) 存储具体问题求解的初始数据和推理过程中涉及的各种信息，如中间结果、目标、字母表以及假设等；(3)
    根据当前输入的数据，利用已有的知识，按照一定的推理策略，去解决当前问题，并能控制和协调整个系统；(4) 能够对推理过程、结论或系统自身的行为做出必要的解释，如解题步骤、处理策略、选择处理方法的理由、系统求解某种问题的能力、系统如何组织和管理其自身知识等。这样既便于用户的理解和接收，同时也便于系统的维护；(5)
    提供知识获取、机器学习以及知识库的修改、扩充和完善等维护手段。只有这样才能更有效地提高系统的问题求解能力及准确性；(6) 提供一种用户接口，既便于用户使用，又便于分析和理解用户的各种要求和请求。


    在此需要特别强调，存放知识与运用知识进行问题求解是专家系统的两个最基本，也是最重要的功能。


    专家系统之所以得到广泛的关注和发展，与其自身的优点是分不开的。下面介绍专家系统的一些功能特点。


    - (1) 适应性强。专家知识在任何计算机上都是可用的，是专家知识的集成体。

    - (2) 成本低。提供给用户的专家知识成本非常低。

    - (3) 危险性低。专家系统可用于那些可能对人有害的环境。

    - (4) 持久性。专家知识是持久的，会无限地持续，不像专家那样会退休或者死亡。

    - (5) 复合专家知识。复合专家知识可以做到在任何时候同时和持续地解决某一个问题。由几个专家复合起来的知识，其水平可能会超过一个单独的专家。

    - (6) 可靠性强。专家系统可增强正确决策的信心，这是通过向专家提供一个辅助观点而得到的。此外，专家系统还可协调多个专家的不同意见，如果专家很累或有压力就可能会犯错误。

    - (7) 解释、说明。专家系统能明确、详细地解释推论的推理过程。一个人可能会太厌

    '
  mdcn: '

    情味。


    知识获取是专家系统知识库是否优越的关键，也是专家系统设计的“瓶颈”问题，通过知识获取，可以扩充和修改知识库中的内容，也可以实现自动学习功能。


    专家系统的结构是指专家系统各组成部分的构造方法和组织形式。系统结构选择的恰当与否，是关系到专家系统有用性和有效性的关键问题。作为某一个具体系统的设计人员可以从以下几个方面考虑来做出正确的选择，以达到设计出合适的应用系统的目的。


    首先，一个具体的专家系统选择什么样的结构最为恰当，要根据系统的应用环境和要完成的任务特点而定。例如，MYCIN 系统的任务是疾病诊断和解释，其任务的环境和特点是较小的可能解空间，可靠的数据和较可靠的知识，这就决定了它可以采用穷尽检索空间，单链推理等较简单的控制方法和系统结构。与此相对应，HEARSAY
    – II 系统的任务是进行口语理解，这一任务需要检索巨大的可能解空间，独立简单的数据和知识不是很可靠，需要利用多知识源的知识，缺少解决问题的较固定路线，经常需要猜测才能继续进行推理等。所有这些特点决定了
    HEARSAY – II 系统必须采用比 MYCIN 系统更为复杂的结构。


    专家系统的任务特点有很多，但一般来说，下面三个因素会增加问题求解的困难程度，即数据和知识的不确定性、数据的时变性及需要检索大型可能解空间。第一个因素，不确定性，目前处理不确定数据和知识主要有工程方法、控制方法和并行确定推理三类方法。第二个因素，时变性，一些专家系统处理的数据是动态变化的，这就要求推理机必须有较快的推理速度，并将某些决策建立在对未来的期望上，在当前数据否定了以前做出的错误假定时，能够修改决策。具体方法有情况计算法和周期处理法等方法。情况计算法是在处理任务中其他目标变化的同时，也对环境的变化进行处理。周期处理法周期地接收一组新数据，每次都重新执行整个推理过程。第三个因素，大空间，专家系统所处理的复杂问题大多需要考虑众多的可能性。检索巨大的可能解空间，往往不能使用穷尽检索法来进行检索，因而需要使用一些限制方法来缩小检索的范围。当问题的解由一些能独立生成的分子解组合而成，并且组合后满足一定的限制时，就可以利用一些修剪规则把不能满足限制的部分解剪掉；也可以通过着重强调某些关键问题的重要性来缩小需要检索的空间；或把检索空间分层，自顶向下逐步求精。在自顶向下逐步求精过程中，需要考虑子问题之间的相互作用，利用问题求解过程中得到的反馈信息对检索空间进行限制。为了增加系统的推理能力，也可以使用多路推理，使用不同的抽象模型和使用多知识源知识，也可以使用机缘调度方法来控制检索宽度，为了提高效率，还可以采用专用数据结构及知识编译程序。


    其次，黑板结构是一种常用的专家系统结构。在这种结构中，系统以黑板这个全局数据库作为通信控制手段，利用多知识源的知识，进行多路推理，并共享数据和结果。许多复杂的问题常常需要运用多知识源知识才能解决，即需要多个专家提供的多种知识。例如，HEARSAY
    – II 在进行语言理解时，就需要用到语义学、信号数字化等多种知识。黑板作为系统的公共数据区，记录着有关问题的数据、推理的现时状态、推理的中间结果及一些系统需要的控制信息。这样，黑板也就成了各知识源进行间接通信的媒介。黑板中的数据项，也称为假设，通常按照某种方式分层（例如可按系统对数据的处理顺序分层），每层对应于一个知识源，也就是说，每个知识源及黑板中的相应数据构成一个子专家系统。对应于每个知识源，都有一个前提模块和一个动作模块。前提模块的功能是为动作模块收集有用的数据，这些数据可以是对应数据层的数据，也可以是其他层的数据。前提模块中还拥有一个基本条件，通常定义为未处理过的新数据的数量限制。只有当这个基本条件满足时，前提模块才开始工作，也称该知识源被激活。动作模块的功能是当前提模块数据收集完毕时，利用知识源的知识，对相应结果进行处理，其结果是增加或更新黑板中的数据，而这又为激活其他知识源创造了条件。采用黑板结构可以大大减少重复查询和推理，同时知识的模块化也使得知识的更新和扩充过程更加简便，提高了知识表示的能力，增强了推理的功能。这种结构特别适合于建造大型或分布式专家系统。


    然后，多层系统结构也是一个比较好的专家系统结构的选择。在工程分析和多信号解释等许多问题领域中，往往需要把专家解决问题时所用到的定量（数学）技术同使用这些技术的经验知识结合起来，才能很好地解决问题。多层系统就是适应这一要求的一种系统结构。多层系统是表层系统与深层系统结合而成的。表层系统通常利用一些定性的经验知识，直接把输入状态同动作联系起来，比较适合分类问题。系统所使用的知识一般都不难表示成易于处理的产生式规则的形式，知识的编码比较简单。表层系统比较普遍，如
    MYCIN、RI 等都属于表层系统。另一方面，深层系统通常利用数学模型、模拟过程及一些较定性的因果关系等基本理论和方法，对问题进行定量分析。系统所使用的知识大多采用过程式表示方法表示。这些过程与领域问题密切相关，具有很强的问题求解能力，但程序编码比较复杂。深层系统比较适合于处理较复杂的问题。如
    DENDRAL、HEARSAY – II 都属于这类系统。多层系统使用深层定量模型分析问题中的基本性质，得出基本结果，再使用表层模型解释这些结果，进行全局推理。就这样，深层与表层模型协作，共享数据和结果，完成系统的问题求解任务。


    最后，专家系统结构中的知识结构也是很重要的。元知识结构是一种很有前途的系统结构，它可以使系统根据不同的情况，灵活选用恰当的问题求解方法，因而可以大大提高推理的效率。专家系统中所使用的知识有两类，一类是领域知识，一类是元知识。元知识是关于领域知识的内容、结构和使用的知识，是问题求解期间使用的推理、演绎和论证方法的知识。元知识大致可分为如下七种：


    - (1) 有关规则选择的知识。例如“尽可能选用那些使用便宜材料的规则”就是这种知识。在专家系统运行的某一时刻，可能有多个规则的前提条件被满足，非元知识系统通常按照固定算法选用一个规则，而元知识系统可以利用元知识恰当地选用规则。

    - (2) 关于事实的知识。若要使用上面列举的那条元知识，就需要有描述材料价格的知识，即关于事实的知识。

    - (3) 论证规则的知识。例如，若有规则“如果溢出液是硫酸，则用石灰”，则论证规则的元知识为“石灰能中和酸且所形成的化合物能够沉淀出来”。

    - (4) 关于检查规则中语法或语义错误的知识。

    - (5) 论证程序结构的知识。

    - (6) 有助于系统适应运行环境的知识。

    - (7) 说明程序功能的知识。以上这些元知识，主要应用于系统的推理、控制、解释、知识获取和学习过程中。元知识结构就是利用上面介绍的元知识，对问题求解过程进行控制，根据具体情况选择合适的问题求解方法，使系统具有高效的性能。


    专家系统自 20 世纪中期起就作为一种研究对象被逐渐深入研究，作为人工智能的一个重要组成部分，其是一款模拟人类专家的决策过程来解决需要人类专家处理的复杂专业性问题的智能软件。与此同时，专家系统技术的发展也促进了专家系统工具的发展，CLIPS
    就是一款典型的专家系统工具。由于 CLIPS 专家系统工具具有固定模式的知识表示方式，推理机也是完全独立的功能模块，这使得数据和作用在数据上的知识明确分离，并且可以忽略程序的执行顺序。因此
    CLIPS 使得开发一个专家系统变得容易，从而减少了开发时间。同时其是一个通用的专家系统工具，有很强的兼容性，可安装在任何 C 编译器上。最初的 CLIPS
    仅支持基于规则的编程，目前已经从微型机被移植到了大型机中的多平台上，CLIPS 平台的基本结构如图 7-4 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_154_0.png)


    基于规则的 CLIPS 由事实、知识库、推理机三部分构成。CLIPS 的知识主要体现在以下三个方面：


    - (1) 规则，主要用于体现以经验为基础的启发性知识；(2) 通用函数和自定义函数，用于体现过程性知识；(3) 面向对象编程，同样适用于体现过程性知识。


    支持面向对象编程的 5 个普遍特点：类、消息处理、抽象、封装、继承和多态。


    CLIPS 在原理上是将知识库分成一个个独立的组成单元，然后每个单元包括属于该模块的规则、模板和事实，且模块之间共享模板和事实。


    ## 7.1.2 专家系统的类型


    专家系统根据不同的划分标准可以有多种类型划分，例如，按知识表示的技术划分可以划分为基于逻辑的专家系统、基于规则的专家系统、基于语义网络的专家系统和基于框架的专家系统。如果按任务类型划分，可以划分为以下九种。


    - (1) 诊断型专家系统：根据对症状的观察分析，推导出产生症状的原因以及排除故障方法的一类系统，如医疗、机械、经济等。

    - (2) 解释型专家系统：根据表层信息解释深层结构或内部情况的一类系统，如地质结构分析、物质化学结构分析等。

    - (3) 预测型专家系统：根据现状预测未来情况的一类系统，如气象预报、人口预测、水文预报、经济形势预测等。

    - (4) 设计型专家系统：根据给定的产品要求设计产品的一类系统，如建筑设计、机械产品设计等。

    - (5) 决策型专家系统：对可行方案进行综合评判并优选的一类专家系统。

    - (6) 规划型专家系统：用于制订行动规划的一类专家系统，如自动程序设计、军事计划的制订等。

    - (7) 教学型专家系统：能够辅助教学的一类专家系统。

    - (8) 数学专家系统：用于自动求解某些数学问题的一类专家系统。

    - (9) 监视型专家系统：对某类行为进行监测并在必要时候进行干预的一类专家系统，如机场监视、森林监视等。


    目前已研究的专家系统模型有很多种。其中较为流行的有基于规则的专家系统、基于案例的专家系统、基于框架的专家系统、基于模糊逻辑的专家系统、基于 D - S 证据理论的专家系统、基于人工神经网络的专家系统和基于遗传算法的专家系统等。


    - (1) 基于规则推理(Rule Based Reasoning，RBR)的方法是根据以往专家诊断的经验，将其归纳成规则，通过启发式经验知识进行推理。它具有明确的前提，得到确定的结果。RBR
    是构建专家系统最常用的方法，这主要归功于大量的成功实例和工具的出现。早期的专家系统大多数是用规则推理的方法，如 DENDRAL 专家系统、MYCIN 专家系统、PROSPECTOR
    专家系统等。在转换为机器语言时，用产生式的“IF … AND (OR) … THEN…”表示，因此这种系统又称为产生式专家系统。


    基于规则的方法容易使知识工程师与人类专家合作，易于被人类专家理解。规则库中的规则具有相同的结构，即 IF…THEN…结构，这种统一的格式便于管理，同时便于推理机的设计。但它也有诸多缺点，如规则间的相互关系不明显，知识的整体形象难以把握、处理效率低、推理缺乏灵活性；对于复杂系统难以用结构化数据来表达，如果全部用规则的形式来表达，不仅提炼规则相当困难，而且规则库将十分庞大和复杂，容易产生组合爆炸；在实时处理方面的应用也已被证明比较困难。速度是实时性能最根本的要求，而产生式系统在处理实时任务时，其搜索、匹配时间要占全部计算时间的
    90%。基于规则的专家系统的特点决定了其适合的领域为：① 系统结构简单，有明确的前提和结论，问题仅仅用有限的规则即可全部包含；② 问题领域不存在简洁统一的理论，知识是经验的；③
    问题的求解可视为一系列相对独立的操作，或从一个状态向另一个状态的转换；一个操作或转换可以被有效地表示为一条或多条产生式语句。


    - (2) 基于案例推理(Case Based Reasoning，CBR)的方法就是通过搜索曾经成功解决过的类似问题，比较新、旧问题之间的特征及发生背景等差异，重新使用或参考以前的知识和信息，最终解决新问题的方法。它起源于
    1982 年美国学者 Roger Schank(关于人类学习和回忆的动态存储模型的研究工作)。第一个真正意义上的基于案例的专家系统是 1983 年由耶鲁大学
    Janet Kolodner 教授领导开发的 CYRUS 系统。它以 Schank 的动态存储模型和问题求解的 MOP 理论为基础，做与旅行相关的咨询工作。这种类比推理比较符合人类的认知心理。基于案例的专家系统具有诸多优点：无须显示领域知识；无须规则提取，降低了知识获取难度；开放体系、增量式学习，案例库的覆盖度随系统的不断使用而逐渐增加。基于案例的推理方法适用于定理难以表示成规则形式，而容易表示成案例形式并且已积累丰富案例的领域(如医学诊断系统)。它的难点还在于案例特征的选择、权重分配以及处理实例修订时的一致性检验(特征变量间的约束关系)等问题。传统的基于案例的方法难以表示案例间的联系，对于大型案例库案例检索十分费时，并且难以决定应选择哪些特征数据及特征数据所占的权重。


    - (3) 基于框架(Frame)的专家系统也是一种不错的选择，框架是将某类对象的所有知识组织在一起的一种通用数据结构，而相互关联的框架连接组成框架系统。1975
    年，美国麻省理工学院著名的人工智能学者明斯基提出了框架理论，并把它作为理解视觉、自然语言对话及其他复杂行为的基础。在框架理论中，框架被视为表示知识的一个基本单位。它把要描述的事务各方面的知识放在一起，通过槽值关联起来。框架的顶层是代表某个对象的框架名，其下为代表该框架某一方面属性的若干个槽，槽由槽名和槽值组成。槽下还可分为若干个侧面（由侧面名和侧面值组成）。一个框架系统常被表示成一种树型结构，树的每一个节点是一个框架结构，子节点与父节点之间用槽连接。当子节点的某些槽值或侧面值没有被直接记录时，可以从其父节点继承这些值。框架系统中可以推理出未被观察到的事实，它将通过以下三种途径实现。①
    框架包含它所描述的情况或物体的多方面信息。这些信息可以被引用，就像已经直接观察到这些信息一样。② 框架包含物体必须具有的属性。在填充框架的各个槽时，要用到这些属性。建立对某一情况描述要求先建立对此情况的各个方面的描述。与描述这个情况的框架中各个槽有关的信息可用来指导如何建立这些方面的描述。③
    框架描述它们所代表的概念的典型事例。如果某一情况在很多方面与一个框架相匹配，只有少部分相互之间存在不同之处，这些不同之处很可能对应于当前情况的重要方面，也许应该对这些不同之处作出解答。框架表示法最突出的特点是善于表达结构性的知识，且具有良好的继承性和自然性。因此，基于框架的专家系统适合于具有固定格式的事物、动作或事件。


    - (4) 基于模糊逻辑的专家系统。模糊理论的概念由美国加利福尼亚大学教授扎德在其 Fuzzy Sets 和 Fuzzy Algorithm 等论著中首先提出。模糊性是指客观事物在状态及其属性方面的不分明性，其根源是在类似事物间存在一系列过渡状态，它们互相渗透、互相贯通，使得彼此之间没有明显的分界线。模糊性是客观世界中某些事物本身所具有的一种不确定性，它与随机性有着本质的区别。有明确定义但不一定出现的事件中包含的不确定性称为随机性，它不因人的主观意识变化，由事物本身的因果规律决定。而已经出现但难以给出精确定义的事件中包含的不确定性称为模糊性，是由事物的概念界限模糊和人的主观推理判断产生的。模糊逻辑理论则是对模糊事物相互关系的研究。基于模糊逻辑的专家系统的优点在于：①
    具有专家水平的专门知识，能表现专家技能，有足够的鲁棒性；② 能进行有效的推理，具有启发性，能够运用人类专家的经验和知识进行启发性的搜索、试探性的推理；③ 具有灵活性和透明性。但是，模糊推理知识获取困难，尤其是征兆的模糊关系较难确定，且系统的推理能力依赖模糊知识库，学习能力差，容易发生错误。由于模糊语言变量是用隶属函数表示的，实现语言变量与隶属函数之间的转换是一个难点。


    - (5) 基于人工神经网络系统。人工神经网络(Artificial Neural Network, ANN)仿效生物体信息处理系统获得柔性信息处理能力。它从
    20 世纪 80 年代后期开始兴起（由理论研究阶段发展到应用阶段）。它是从微观上模拟人脑功能，是一种分布式的微观数值模型，神经元网络通过大量经验样本学习知识。更重要的是，神经网络有极强的自学能力，对于新的模式和样本可以通过权值的改变进行学习、记忆和存储，进而在以后的运行中能够判断这些新的模式。神经网络模型从知识表示、推理机制到控制方式，都与目前专家系统中的基于逻辑的心理模型有本质的区别。知识从显示变为隐式表示。这种知识不是通过人的加工转换成规则，而是通过学习算法自动获取的。推理机制从检索和验证过程变为网络上隐含模式对输入的竞争。这种竞争是并行的针对特定特征的，并把特定领域输入模式中各个抽象概念转换为神经网络的输入数据。神经网络很好地解决了专家系统中知识获取的瓶颈问题，能使专家系统具有自学习能力。神经网络技术的出现为专家系统提供了一种新的解决途径。特别是对于实际中难以建立数学模型的复杂系统，神经网络更显示出其独特的功效。然而，神经网络专家系统也存在固有的弱点：①
    系统性能受到所选择的训练样本集的限制，训练样本集选择不当，特别是在训练样本集很少的情形下，很难指望它具有较好的归纳推理能力；② 神经网络没有能力解释自己的推理过程和推理依据及其存储知识的意义；③
    神经网络利用知识和表达知识的方式单一，通常的神经网络只能采用数值化的知识；④ 神经网络只能模拟人类感觉层次上的智能活动，在模拟人类复杂层次的思维方面还有不足之处。目前较为常用的神经网络有误差反传网络（BP）、小脑网络（CMAC）、自组织特征映射网络（SOM）、自适应共振理论（ART）和径向基网络（REF）等。基于神经网络的专家系统的具体应用形式可以根据实际情况选择不同的神经网络模型，能够实现不同的用途。因此，基于神经网络的专家系统是目前最流行的专家系统。


    ![](img/f188b68deb37acb6105ba97c814d9af2_157_0.png)


    ## 图 7-5 工业生产过程中的专家系统结构


    不同的系统类型可以应用于不同的实际需求当中，当然它们也可以相互结合起到更加积极有效的作用。如现实为满足市场需求，要设计一种智能检测系统平台应用到某一工业生产过程，该平台的专家系统可以采用模块化设计，将基于神经网络的推理机和基于规则的推理机结合设计一种基于神经网络的专家系统。如图
    7-5，图 7-6 所示，专家系统主要包括知识库、推理机、解释机、知识获取模块、检测参数输入模块、人机接口和产品检测对象数据库，其中知识库存放有关该产品的专业知识，包括征兆、检测知识、经验知识、对策知识和翻译词典，这些知识由知识工程师和领域专家合作获取，并通过知识获取模块按一定的知识表示形式存入到规则知识库，是专家系统的核心。推理机用于控制整个系统的运行，负责利用诊断知识库中的知识，并根据检测到的参数按一定的模式求解策略，进行推理决策，最后给出决策结果。其中系统学习模块采用的神经网络训练使得系统具有自学习能力。将决策设计为多种检测模式，每一模式又分别对应于某一特定的过程状态，通过人工神经网络识别判断出检测参数的变化模式，然后利用模式识别的结果，根据一定的规则对模式成员函数进行调节和修改，进而达到改善和提高在线模式识别可靠性的目的。另外针对发酵生产过程中温度、pH
    等检测参数与产品产出率和质量等参数检测联动模型，综合评价各参数生产过程中的变化对发酵后的结果造成的影响，通过专家系统学习，完成模式状态细分，保证检测平台的可靠性和精度要求。


    ![](img/f188b68deb37acb6105ba97c814d9af2_158_0.png)


    ## 7.1.3 专家系统的功能


    根据定义，专家系统应具备以下几个功能：(1) 存储问题求解所需的知识；(2) 存储具体问题求解的初始数据和推理过程中涉及的各种信息，如中间结果、目标、字母表以及假设等；(3)
    根据当前输入的数据，利用已有的知识，按照一定的推理策略，去解决当前问题，并能控制和协调整个系统；(4) 能够对推理过程、结论或系统自身的行为做出必要的解释，如解题步骤、处理策略、选择处理方法的理由、系统求解某种问题的能力、系统如何组织和管理其自身知识等。这样既便于用户的理解和接收，同时也便于系统的维护；(5)
    提供知识获取、机器学习以及知识库的修改、扩充和完善等维护手段。只有这样才能更有效地提高系统的问题求解能力及准确性；(6) 提供一种用户接口，既便于用户使用，又便于分析和理解用户的各种要求和请求。


    在此需要特别强调，存放知识与运用知识进行问题求解是专家系统的两个最基本，也是最重要的功能。


    专家系统之所以得到广泛的关注和发展，与其自身的优点是分不开的。下面介绍专家系统的一些功能特点。


    - (1) 适应性强。专家知识在任何计算机上都是可用的，是专家知识的集成体。

    - (2) 成本低。提供给用户的专家知识成本非常低。

    - (3) 危险性低。专家系统可用于那些可能对人有害的环境。

