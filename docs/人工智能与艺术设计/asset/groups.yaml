    ## 1.3.3 人工智能的伦理与哲学问题


    人工智能的迅速发展给人的生活带来了一些困扰与不安，尤其是在奇点理论提出后，很多人质疑机器的迅速发展会给人类带来极大的危险，随之而来的很多机器事故与机器武器的产生更加印证了人们的这种印象。机器伦理、机器道德的问题成为热点。


    - 1. 伦理的概念


    伦理一词，英文称为“ethics”，这一词源自希腊文的“ethos”，其意义与拉丁文“mores”差不多，表示风俗、习惯的意思。西方的伦理学发展流派纷呈，比较经典的有叔本华的唯意志主义伦理流派、詹姆斯的实用主义伦理学流派、斯宾塞的进化论伦理学流派、还有海德格尔的存在主义伦理学流派。其中，存在主义是西方影响最广泛的伦理学流派，始终把自由作为其伦理学的核心，认为“自由是价值的唯一源泉”。


    在我国，伦理的概念要追溯到公元前6世纪，《周易》《尚书》已出现单用的伦、理。前者即指人们的关系，“三纲五伦”“伦理纲常”中的伦即人伦。而理则指条理和道理，指人们应遵循的行为准则。与西方相似，不同学派的伦理观差别很大，儒家强调“仁、孝、悌、忠、信”与道德修养，墨家信奉“兼相爱，交相利”，而法家则重视法治高于教化，人性本恶，要靠法来相制约。


    总的来说，伦理是哲学的分支，是研究社会道德现象及其规律的科学，其研究是很有必要的。因为伦理不但可以建立起一种人与人之间的关系，并且可以通过一种潜在的价值观来对人的行为产生制约与影响。很难想象，没有伦理的概念，我们的社会会有什么人伦与秩序可言。


    - 2. 人工智能伦理


    其实在人工智能伦理一词诞生以前，很多学者就对机器与人的关系进行过研究，并发表了自己的意见。早在1950年，维纳在《人有人的用途：控制论与社会》一书中就曾经担心自动化技术将会造成“人脑的贬值”。20世纪70年代，德雷福斯曾经连续发表文章《炼金术与人工智能》《计算机不能做什么》，从生物、心理学的层次得出了人工智能必将失败的结论。而有关机器伦理（与人工智能伦理相似）的概念则源自《走向机器伦理》一文。文中明确提出：机器伦理关注机器对人类使用者和其他机器带来的行为结果。文章的作者之一安德森表示，随着机器越来越智能化，它们也应当承担一些社会责任，并具有伦理观念。这样可以帮助人类以及自身更好地进行智能决策。无独有偶，2008年英国计算机专家诺埃尔·夏基教授曾经呼吁人类应该尽快制定机器（人）相关方面的道德伦理准则。目前国外对于人工智能伦理的研究相对较多，如2005年欧洲机器人研究网络（EURON）的《机器人伦理学路线图》、韩国工商能源部颁布的《机器人伦理宪章》、美国航空航天局（NASA）对“机器人伦理学”进行的资助等。而且国外相关的文献也相对丰富，主要集中在机器人法律、安全与社会伦理问题方面。国内方面相关研究起步较晚，研究不如国外系统全面。但是近些年来，相关学者也将重点放在人工智能的伦理方面。相关文献有《机器人技术的伦理边界》《人权：机器人能够获得吗?》《我们要给机器人以“人权”吗?》《给机器人做规矩了，要赶紧了?》《人工智能与法律问题初探》，等等。值得一提的是，从以上文献可以看出，我国学者已经从单纯的技术伦理问题转向人机交互关系中的伦理研究，这无疑是很大的进步。


    ## 3. AI 哲学


    20世纪西方科学哲学的发展，经历了向“语言研究”和“认知研究”的两大转向，认识论的研究在不断去形而上学化的同时，正在走向与科学研究协同发展的道路。作为当代人工智能科学的基础性研究，认知研究的目的是为了清楚地了解人脑意识活动的结构与过程，对人类意识的智、情、意三者的结合作出符合逻辑的说明，以使人工智能专家们便于对这些意识的过程进行形式的表达。人工智能要模拟人的意识，首先就必须研究意识的结构与活动。意识究竟是如何实现可能的呢？塞尔说道：“说明某物是如何可能的最好方式，就是去揭示它如何实际地存在。”这就使认知科学获得了推进人工智能发展的关键性意义，这就是认知转向为什么会发生的最重要原因。


    由于哲学与认知心理学、认知神经科学、脑科学、人工智能等学科之间的协同关系，无论计算机科学与技术如何发展，从物理符号系统、专家系统、知识工程，到生物计算机与量子计算机的发展，都离不开哲学对人类意识活动的整个过程及其各种因素的认识与理解。人工智能的发展一刻也离不开哲学对人类心灵的探讨。


    人工智能的哲学问题已不是人工智能的本质是什么，而是要解决一些较为具体的智能模拟方面的问题。这些问题包括如下几个方面。


    ### 1.3.3.1 关于意向性问题


    人脑的最大特点是具有意向性与主观性，并且人的心理活动能够引起物理活动，心身是相互作用的。大脑的活动通过生理过程引起身体的运动，心理状态是脑的特征。确实存在着心理状态，其中一部分是有意识的，大部分是具有意向性的，全部心理状态都是具有主观性的，大部分心理状态在决定世界中的物理事件时起着因果作用。


    - (1) 究竟什么叫作意向性？机器人按照指令从事特定的行为是不是意向性？


    - (2) 人类在行动之先就已经知道自己究竟是在做什么，具有自我意识，知道其行动将会产生什么样的结果，这是人类意识的重要特征。那么我们应该如何理解机器人按照指令从事某种行为呢？


    - (3) 意向性能否被程序化？塞尔认为，“脑功能产生的方式不可能是一种单纯操作计算机程序的方式。”


    ### 1.3.3.2 人工智能中的概念框架问题


    任何科学都是建立在它所已知的知识之上的，甚至科学观察的能力也无不与已知的东西相关，我们只能依赖于已知的知识，才能理解未知的对象。知与未知永远都是一对矛盾体，两者总是相互并存又相互依赖。离开了已知，就无法认识未知；离开了未知，我们就不能使科学认识有所发展和进化。“科学就是学习如何观察自然，而且它的观察能力随着知识的增长而增长。”


    概念框架问题是人工智能研究过程中最为棘手的核心问题，它所带来或引发的相关问题的研究是十分困难的。在这个问题上，基础性的研究是哲学的任务，即概念框架应当包含哪些因素，日常知识如何表达为确定的语句，人类智能中动机、情感的影响状况是如何的，如何解决某些心理因素对智能的不确定性影响。而人工智能的设计者们则要研究这些已知知识应当如何表达，机器人如何根据概念框架完成模式识别，概念框架与智能机行为之间如何联系，概念框架如何生成、补充、完善，以及在运用这个概念框架某部分知识的语境问题，等等。而至于知、情、意的形式表达方面，则是人工智能研究者的任务。


    ### 1.3.3.3 机器人行为中的语境问题


    人工智能要能够学习和运用知识，必须具备识别语言句子的语义的能力，在固定的系统中，语义是确定的。正因为如此，物理符号系统可以形式化。但是，在语言的运用中则不然，语言的意义是随语境的不同而有差别的。


    实际上，AI 也就是首先要找到我们思想中的这些命题或者其他因素的本质关系、逻辑关系，以及由此而映射出构成世界的本原关系、客体与客体之间的关系。最初的物理符号系统便是以此为基础的。但是，由于人们的思想受到了来自各方面的因素的影响，甚至语言命题的意义也不是绝对确定的，单个句子或原子命题的意义更是如此。因此，最初，简单的一些文字处理与符号演算完全可以采取这种方式，但若进一步发展，例如机器与人之间的对话、感知外界事物、学习机等，就必须在设计时考虑语句所使用的场合及各种可能的意义。我们再回到维特根施泰因思想的发展。维特根施泰因的早期思想在哲学研究中遭到了来自各个方面的批评，主要的问题是语言的日常用法，是不可能按照维特根施泰因规定的那样来使用的。在日常的使用中，语言的实际用法即语境决定了语言命题的意义。“哲学不可用任何方式干涉语言的实际用法，因而它最终只能描述语言的用法。”人工智能在设计语言编码时，就不得不考虑整个思想以及语言的各种情境条件对于句子意义的制约作用。然而，困难在于找出那些与语言情境有关联的主观成分，而对于后者，则几乎是不可能的。因为外部情境是一个极不确定的因素，每一个场景都是不相同的，这只能根据社会文化的类型大致确定几种不同情境类型，社会化的认识论则将在这方面提出它们自己的见解。


    ### 1.3.3.4 日常化认识问题


    人工智能模拟不仅要解决身心关系，即人脑的生理与心理的关系问题，而且还必须解决人脑的心理意识与思维的各个层次间的关系，以及人的认识随环境的变化而变化、随语境的变化而变化的问题。根据智能系统的层次性分析，我们可以逐步做到对各个层次的模拟，但是，智能层次性分析也只是一种抽象化的分析或理想化的分析而已。实际的智能是多个层次之间不可分割的相互关联着的整体，各层次间究竟是如何发生关联的？在什么情况下发生什么样的关联？这便涉及日常化的认识问题。


    ## 1.3.4 人工智能的前沿问题


    科技商业预言家凯文·凯利在《人工智能与智能经济》的主旨报告中，观察了人类还未曾涉及的边界领域，犀利地提出了十条关于人工智能的前沿问题，预测出智能经济的发展方向。


    ### 1.3.4.1 前沿——创造新的思维方式


    有的人不理解人工智能，主要是因为它是不同的思维方式。实际上，我们的智能对自身的认识还很愚钝。我们并不知道什么才是真正的智能，有时候很难进行一个所谓的多样化的总结。在我们的智能下，基本上我们把人工智能解释为
    IQ，它是一个单维度的事情，可能有更高的信号。从最小的，比如老鼠的人工智能，越来越大，一直到天才的一个智能，再到人工智能，这是完全错误的，以我们认为的大小来判断智能是错误的。


    实际上，智能会有更为聪明的一面。我们有不同类型的智能，比方说你的计算器在你口袋里，从单个维度上讲，它在计算上比你更聪明；你手机中的 GPS 或者车辆中的 GPS
    在空间的导向上比你功能更强；还有搜索引擎，百度在总的记忆方面比你强，因为它记住了 60万亿的网页当中的每一个词。所以，我们自己这样的智能，其实就是这样的层面，像一个交响乐，是不同部位思维的结果，非常个性化，一个人的智能和另外一个人的智能不一样。动物也有智能，而且是包括了不同类型、不同模式的思维。某些情况里面，像这样智力的维度，动物的智能也可以在人身上体现，比如一个松鼠可以记住具体的位置，能够记住成千松果所埋的地方。


    我们制造这些机器，也是制造了各种不同类型的智能机器，把各种各样的类型组合在一起。一开始这些机器都非常小，就像小的交响乐、小的层面，非常小、小而美，但是有时候，这些机器在维度上比人类伟大。我们现在有人工智能，它们有可以长期保持的记忆力，在这方面已经超越了人类。非常重要的一点，这是不同类型的一些智能，并不是类似于人的智能。


    所以我们可以思考一下，像人工智能这样的项目，我们其实就是要发明不同的思维，尽可能找到更多，也许是 100 个或是 1000 个不同的思维。那么，要有千差万别的心智，因为有千差万别，所以会有很多的好处。这种不同，对我们来说是最佳的回报，也是为了解决科学或者商务工作中人很难解决的一些问题。我们需要发明另外一种思考、思维，帮助我们解决这些问题。


    我们发明另外一种思维，一种比人类更加擅长帮助我们解决问题的思维。这种所思迥异，即不同的思维方式，就是我们新的经济引擎。机器能够帮助我们有差异化的思维，这是真正价值所在。


    走在人工智能的前沿，就是要有这种发明自然中不存在的思维方式。作为人类，我们发明了人工的飞行。我们一开始就是发明能够扑动的翅膀，这种翅膀开始不能飞行，只是机械地模仿自然。最后我们的机器却能够在空中飞行，是固定翼的飞行器，然后推进器，这种飞行的方式不是自然存在的，这是人工的飞行，是完全崭新的飞行方法，是人发明的。在人工智能方面我们所做的，就是开创一种新的思维方式。这种新的思维方式在自然当中是不存在的，将会成为最有利的思维方式。


    ### 1.3.4.2 前沿二——用感知来整合机器人


    我们思考一下我们的前沿，是把所有不同的思维模式集成在一起。前面说到，其实有各种不同的思维方式（长期、短暂、语言的思维）构成我们的大脑。现在有人工智能，我们实现了一种这样的思维：感知。


    感知，是对一种类型的判断。比如说视觉的感知，我们能够看出东西，然后能够听到这个东西，能够理解声音的图案，然后进行这种模仿，来模仿各种各样的感知。现在很多的工作，其实就是利用这样的感知。


    机器，我们所制造的机器、人工智能，就是利用这样的感知。我们还要把其他各种各样的机器整合进去，整合了之后，更加的高级，更加的复杂，这是行业的前沿。我们要领先一步来合成这种希望的思维方式，只有这样我们才能有更加复杂的集成的智能，我们还没有到达这一步，这是我们的科学前沿。


    ### 1.3.4.3 前沿三——让人工智能成为公用工程


    还有另外一个前沿，把我们的智力搬到云上去。在这个环节当中，所有的一切成为可能，是因为我们在150年前，发现了人工动力。工业革命之前，我们所做的很多东西，必须要用自然的肌肉力，比如人的肌肉力或者动物的肌肉力。比如说公路是我们用人力建造的，房屋也是人力建造的，一把椅子，也都是人力建造的。


    工业化之后，人们开始使用人工动力。比如煤炭、石油或者水力，利用这些动力或者是人工的动力进行发电，通过电网输送人工的电能，可以分派这样的电能到任何地方。每一个人可以购买这种人工动力，然后制造其他的东西，把他们的家庭变成自动化，工厂变成自动化，农场也变成自动化。所以这个动力成为商品，是公用的商品，非常的便宜，无处不在，每个人都可以购买。如果你是一个企业家，可能也在思考，如果这是一个手摇泵，如何通过人力泵送这些水。现在他们想出来一个点子，即人工智能方案：通过购买人工动力，制造一个电动泵。建立一个人工电动泵系统，解决水的输运问题。


    将这样的方程式，放大一百倍，就是工业革命，过去是人力完成的，现在我们是有人工的动力了，突然间把房子建造成功了，或者是摩天大楼、铁路、公路都可以建造成功了，成百的椅子都可以通过这样的人工动力完成。整个城市，我们的生命都在充分地利用这种人工动力，所以人工动力成为一种商品，大宗商品。


    工业革命，给我们的社会带来了非常大的转变。现在的人工智能，也会给我们的社会带来非常大的转变。我们可以把它放在电网上，我们把这个电网称作云，所以人工智能可以像电力一样流动，流到每个人手中，你可以购买所有你想要的人工智能，非常便宜。有了云电网，你便可以购买这样的人工智能。


    未来如果有10000个创业公司，他们的成功方程式就是把传统的东西拿过来，然后再加上人工智能，就可以创业了。把传统的东西拿过来再加上人工智能就是新的领域，这就是一般创业者的方向。而前沿是让人工智能成为一个公用工程或者大宗商品，使每个人都能够获得，这将是对人类非常有利的变化。


    ### 1.3.4.4 前沿四——人工智能的情感


    第四个前沿是情感。我们在思考这种看上去非常复杂的情感，只有人是有情感的，因为人有智商，但是我们后面发现情感并不是太难的一件事。基本的情感，我们都可以进行追踪，现在有软件，而软件可以识别人的26种不同情感，并且非常的精准。


    机器可以识别出他是不是分心了，他是不是害怕了，他愤怒了或者惊讶了等。它也可以识别你是不是假装出这样的表情，识别这个到底是你真正的表情还是假的表情。机器能够识别、理解我们的情感了，它们也可以进行响应，机器也有很强的情感。


    事实上我们和机器人以及人工智能有情感的纽带了，它们会传达给我们它们的情感。有些宠物，比如猫狗，它们其实也会给到我们一个反馈，我们爱狗和猫，它们也会爱我们。这样的情感也进入我们和机器人的关系。


    ### 1.3.4.5 前沿五——可解释的人工智能


    还有另外一个人工智能的领域，像道德问题，让机器人也能够为我们做出决定。他们为我们做出决定，我们希望他们考虑到我们的价值观。人工智能的问题就是他们也做决定，但我们无法理解或者是我们不知道他们是怎么做出决定的。行业前沿之一，就是使得人工智能可以被解释，能自圆其说，或者引导我们了解他到底是怎样做出决定，做出符合道德的决定。


    这是神经网络，信息进入了各种不同的层面，最后有一个答案出来了。这是一个简单化的版本。也许会有100万个这样的节点，有11层，它可以自己在中间做出一些决定。它可以告诉你，这里有很多的动物，那里有一只猫，但是它无法告诉你为什么它看到这个东西之后判断它是猫。可解释的人工智能就是找到一种方式使得人工智能对我们来说更加的透明化，这样我们就能够理解了。或者是我们能够训练他们做出更好的决定，就是说这个决定是我们允许的。


    另外有一种人工智能是进行检验工作，他检查他的神经网络内部的点来确保我们能够理解这个人工智能做决定的过程。比如这是一只猫，它就给我们答案，我们就只知道这个答案，但是今后会有一个可解释的人工智能，会给出理由，比如它有猫的特点，还有它的耳朵竖起来了，种种理由告诉你它是一只猫。我们有另外一种人工智能透视人工智能的内心，这是另外一种人工智能。


    这是帮助人工智能做出决定，这个决定是我们社会能够批准的，并不是说我们进行编程，然后把我们价值观编程进去，这非常困难，有时候我们也不知道我们想要什么。我们想要这个机器形成什么习惯，其实有时候，我们的观点也是不一致的或者肤浅的。这个像思维的过程，可以让我们变成更好的人类，我们要自己改善自己。这样一个让人工智能自己解释自己的过程，其实也能够帮助人类在道德层面做得更好。


    ### 1.3.4.6 前沿六——“小数据”


    另外一个领域对人工智能来说是“小数据”。那些大公司，他们处于领先的地位，像百度、谷歌、微软这些公司拥有大量的数据。人工智能的一个课题就是神经网络课程，其实需要很多的培训，需要很多的数据点，很多的例子，甚至数十亿的数据。神经网络的存在有60年了，直到我们能够大规模利用它们的时候，利用这些数十亿样品培训人工智能，这些神经网络才会变成有用的。


    今天，你要做人工智能的话，你需要很多的样品和很多的数据。如果你想让人工智能学习，比如说让它能识别猫、狗的差别，其实你需要做的就是给它数百万像猫、狗这样的例子，数百万的猫、狗的照片。成千上万之后，它就能够开始识别了。它看到猫就能够识别出它是一只猫，所以你要有很多的数据让它学习。


    但是非常有意思的是，如果是一个刚刚学走路的小孩，也许他只知道十二个这样的例子，他能够马上知道猫、狗之间的差异。他只知道十二个例子就能够进行判断了。前沿是什么呢？就是我们让人工智能只需要少量数据就能够学习。这确实是一个颠覆性的事件，能够让我们现在的技术发生颠覆型的转变。大公司没有优势了，创业公司用“小数据”就可以实现人工感知，这是另外一个前沿。十二个例子，如果人工智能能够模仿人类的话，将是一个非常有利的变化。


    ### 1.3.4.7 前沿七——人工智能的创造力


    人工智能的另外一个领域就是创造力，我们认为创造力是只有人能拥有的，大家从故事当中可以看到，不仅仅是人具备创造力，有很多的能力，机器人以及人工智能通过学习也能够做到。谷歌有
    AlphaGo，AlphaGo 是一个人工智能，它希望能够打败其他游戏玩家，因此它还会有一些深入的算法。


    以 AlphaGo 为例，大家可能也会记得在第3场第37步棋时候，AlphaGo 会说这样一个棋会打败他，它打败了李世石。这对于人工智能也是有创造性的，对于这着棋，大家一致认为可能没有哪个人会下出来，它有创意，但是是以不同的方式，跟人类在创意上是有差异的。


    ### 1.3.4.8 前沿八——跟人工智能沟通


    还有一个就是界面，我们如何跟人工智能沟通，它们怎么跟我们沟通。


    中英文同声传译的现场，你能听到我说英文，你说中文。十年之后这将会是另外一种人工智能界面。我们认为，这些最终的终极界面会是虚拟现实。实际上能够用我们的一些体态进一步进入我们电脑的内部，创造出虚拟现实。这里要补充一点，人们会奇怪当汽车正在进行无人驾驶的时候，我们自己在做什么，实际上我们可以在汽车内部进行虚拟现实。所以苹果公司的汽车发展还是有限，当你驾驶苹果汽车时，你可能需要一个界面，这个界面能够和你的电脑相连，那时我们车上宽带的频率范围可能比你家里的还大，才可以实现我们和设备的沟通。不仅仅是语言沟通，还有体态，包括身体语言的沟通，这是一个前沿。


    ### 1.3.4.9 前沿九——充分利用机器人


    还有一个就是大家非常关注的利用，我们如何把人工智能和机器人利用充分，让它们来做一些家庭的工作甚至国家的事业。


    我最喜欢的一个新机器人就是种生菜机器人，这个机器人做的是精准农业。精准农业，能够替代很多的农场劳动力，但是我们的想法，是能够把个体的职务跟单个植物管理对应，我们逐个关注农场当中的植物，记住每个植物生产的位置，这样的情况可以实现定制，并且降低化学农药以及水、化肥和其他材料使用量，没有哪个农户可以达到关注植物的个体层面，可以想象这会带来颠覆式革命。我们还可以意识到，机器人也会承担其他任务，那个时候，这些任务效率是第一的。在很多的一线岗位效率是非常重要的，这些岗位很有可能会被

