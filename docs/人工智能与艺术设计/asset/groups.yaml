    人工智能应该归属于什么样的价值体系？ 它该具有何种法律和伦理地位？


    (3) Science-Policy Link: There should be constructive and healthy exchange between
    AI researchers and policy-makers.

    科学与政策的联系：在人工智能研究者和政策制定者之间应该进行有建设性的、有益的交流。


