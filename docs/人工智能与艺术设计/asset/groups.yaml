    ## 7.1.4 专家系统的应用——土木工程专家系统的应用


    土木工程的特点是工程不确定因素多、影响因素复杂，每项工程既有类似工程的共性，又有其个性，在特殊环节和情况下专家作用显著。近 20 年来，在土木工程领域，专家系统的开发和应用取得了不少的成果，主要应用在项目评估、诊断、决策和预测、建筑设计及优化、项目管理、施工技术以及一些特殊领域（图
    7-7）。


    ![](img/f188b68deb37acb6105ba97c814d9af2_160_0.png)


    ### 7.1.4.1 评估、诊断、决策和预测


    在建筑物的诊断及项目的评估、决策和预测方面，需要考虑如规范、技术、经济等诸多因素。在这些方面，专家系统的应用较多。


    杨玉成等建立了多层砌体房屋震害预测专家系统 PDSMSB1，该系统具有评估现有房屋地震危害程度和进行决策分析的功能。采用扩张的确定性系数法使不确定性问题趋于确定的推理过程中。震例检验和实际应用表明，该系统使用方便，可信度高，预测结果可达到专家级水准。朱长春等从振动测量的角度识别建筑物的模态参数，利用模态参数结构抗震规范对现存建筑物抗震安全性进行评估，在此基础上开发了建筑物抗震安全性评估专家系统。张继庆等建立了钢筋混凝土结构破坏的检测专家系统，该系统从沉降、倾斜、损坏级别、结构损坏率
    4 个因素对结构进行安全评估。但这 4 个因素的考虑比较笼统，判断标准等均有主观的因素。吴宇红采用产生式规则的知识表达方式，正向推理策略设计了对已有砖混结构诊断加固专家系统，该系统可以对建筑物加固改造提供优选方案。黄全义研究了人工神经网络在专家系统开发的应用，开发了大坝变形预报神经网络专家系统。王磊综合运用不确定推理方法、知识工程和模糊数学知识，发展了一种决策方法对钢筋混凝土构件的可靠性进行评估，并在此基础上建立了专家系统评估钢筋混凝土构件的可靠性。孙成双提出了建设项目风险动态分析和评价方法，并且对建设项目风险评价指标体系进行了一系列研究，给出了建设项目风险分析专家系统（CPRAES）的总框架。潘毅等结合近年来各国钢筋锈蚀耐久性研究方面的成果，将定量计算和定性分析相结合，进行了锈蚀混凝土构件耐久性评定方法的研究，并编制了一种基于构件耐久性综合评定方法的现役钢筋混凝土结构耐久性评估专家系统。


    此外，刘晓燕运用 GADVISOR 工具开发了住宅建筑设计方案评价专家系统、住宅房屋安全鉴定专家系统、抗震结构最优设防水平决策专家系统。裘实研究了砖混住宅质量评估及作价专家系统。赵典铎研究开发了现役结构可靠性诊断专家系统。陈帆等研究了基于应力波反射法和机械阻抗法的
    BP 网络模型，建立了基桩质量诊断专家系统 PDES。他们都对专家系统在建筑物诊断及项目的评估、决策和预测方面的应用做了有益的探索和实践。


    ### 7.1.4.2 建筑设计和优化


    建筑设计和优化是一项创造性的工作，需要考虑技术水平、经济效益、用户需求等因素，这些因素千头万绪，因此，经验对于设计人员来说是十分重要的，这一领域也吸引了许多研究人员对其进行专家系统的开发。


    宋应文研制开发的 IDSGI 地基处理智能辅助设计系统，可辅助岩土工程进行地基识别、选择和设计地基处理方案。李楚舒等开发了高层建筑结构初步设计专家系统（HIPRED），它是一个综合集成系统：通过人工神经网络（ANN）技术存储专家的设计经验来确定高层建筑的结构体系；利用能连续化地反映高层建筑结构参数分布的基于悬臂梁的结构简化模型，并结合常微分方程求解器（COL-SYS）很好地从速度和精度两方面的匹配来进行力学反应分析；通过人机交互和知识库的引入，系统能够对设计的结构反应参数（位移、周期和地震力）做出评价并对结构做出相应的修改。HIPRED
    能够帮助设计者在一个较高的层次上进行高层建筑结构的初步设计。此外还开发了基于神经网络的高层建筑结构体系选择的专家系统，基于案例推理的高层建筑结构初步设计专家系统。冯俊强等针对基础方案选型知识的特点，开发出高层建筑基础方案选型专家系统，对高层建筑基础方案的选型进行咨询，辅助工程设计人员进行决策。李校兵等进行了基坑支挡结构设计专家系统的研究，开发研制了基坑支挡结构的计算机绘图子模块。彭观良以按耐久性设计混凝土为中心思想，研究了把各子系统集成为一个整体的混凝土安全性专家系统。马华建立了挡土墙设计专家系统，引入约束非线性离散变量优化与连续变量优化方法，建立了适用于重力式挡土墙设计的优化方法，并且开发了挡土墙优化设计软件。晏致涛研制开发出一个能够辅助工程设计人员进行基础选型及设计的智能决策支持系统——高层建筑基础设计智能决策支持系统（TBFIDSS），并通过工程实例验证了该程序的实用性、有效性和可靠性。


    此外，冯夏庭等开发了采矿巷道围岩支护设计专家系统。欧进萍等建立了高层钢筋混凝土结构抗震选型的模糊专家系统。王曙光等研究了在基坑工程设计中引入专家系统的可行性。许晋平研究了采用专家系统解决轻型门式刚架的设计及优化问题。杨石飞建立了基于范例推理的上海地区岩土工程优化设计（桩基）专家系统。潘昊等研究了钢管混凝土专家系统中的轴心受压构件的强度计算模块的功能及设计与实现问题。


    ### 7.1.4.3 专家系统在其他领域的应用


    除了传统的领域外，专家系统在一些比较特殊的领域也取得了不少研究成果。


    吴景坤等在地质灾害诊治领域建立了滑坡识别与分类专家系统，该系统可以完成对滑坡的识别和分类工作。常春等开发了露天矿边坡稳定性分析集成智能系统，对边坡稳定性进行综合分析与判断，提高了边坡稳定性分析的合理性与可靠性。


    高岗等开发了拆除爆破设计的智能系统。叶海旺等开发了拆除爆破专家系统，该系统由四大模块组成：板（块）体拆除爆破、楼房框架拆除爆破、高耸建筑物拆除爆破、薄壁容器类构筑物拆除爆破。舒思齐等开发了高耸建筑物控制爆破拆除的可视化设计系统。周建中从广义混合控制入手，基于模糊神经元的抗震结构智能混合控制，建立了抗震结构智能混合控制方案选择模糊专家系统的基本理论。


    ## 7.2 智能社会


    ### 7.2.1 智能家居


    智能家居是以住宅为平台，将线路综合布控技术、计算机信息技术、自动控制系统相结合，实现家庭设备、设施的统一家庭自动化管理。大多数人对智能家居这个概念的认识始于比尔·盖茨，他在《未来之路》中说“自己的房子是由软件和硅片组成”。突飞猛进的大数据时代使我们普通人也可以拥有比尔·盖茨那样的全智能家居系统。手机
    APP 控制家庭电器，语音调节场景模式，这为我们的生活带来了极大的便捷。家装行业早已认识到了家居智能化的重要性，各种智能产品如雨后春笋般出现在市场上，但在这个过程中，大多数设计者、制造商都把重点放在了“信息智能化”的技术提升上，却忽略了科技带来的负面作用，如安全问题、隐私问题。因此，在改进物联网相关技术的同时，应即刻将安全隐患和隐私泄露问题的对策提上日程。


    ### 7.2.1.1 智能家居的发展现状和发展趋势


    世界上第一个智能家居起源于国外的一幢智能建筑，通过计算机对整栋大楼的电视、空调、照明、电梯进行统一控制，使其具有远程控制的功能。在这之后，美国、加拿大、日本等国家相继开始了自己的智能产品的研究开发。如日本提出了家庭总控系统的概念，再如新加坡借鉴比尔·盖茨的家居系统，模拟“未来之家”，推出了新加坡模式的家庭智能化系统。


    智能家居在我国从起步到现在的发展经历了十多年的时间，从 1998 年智能家居概念进入中国到现在，我国的智能产品也由最初单一的、单独控制的设备转向了多功能化，设备之间可以互动的智能设备系统。海尔是我国智能家居的知名品牌，推出了物联网时代的智能居住计划。除此之外还有广州力扑智能家居、阿里巴巴的一站式智能化信息控制系统、美的家居的
    APP 控制家居设备一体化，还有小米、华为、京东等，也都拥有自己的智能家居生产链，我国的智能家居品牌已经逐渐占据中国智能市场。


    ### 7.2.1.2 智能家居的设计分析


    - 1. 智能家居的系统架构


    传统家居的各个系统是分别独立的，每个系统都有自己单独的控制器。而家居智能系统将子系统都连接起来，通过智能网络对其进行统一的控制和管理，实现了生活的“一键控制”。智能家居的运行原理，包括数据收集、数据分析、数据执行三个步骤。系统主机通过分析处理前端设备所收集的数据之后将会产生执行的命令，执行元件根据主机发出的命令来进行相关的操作。智能家居系统的子系统包括综合弱电布线系统、空间照明系统、电器控制系统、安全防控系统、音响影音系统。各子系统通过智能终端设备有机联系在一起，既能独立工作，又能相互交流，实现信息交互、协同运行。不仅内部之间能进行信息互换，内部网络也能与外部网络如小区物业等实现信息互通。


    - 2. 方案场景效果


    我们可以将子系统相互结合起来，根据自己的生活需要，设置具有不同参数的场景模式，通过一键控制就可以达到想要的场景效果。


    ### (1) 起床场景


    通过提前设置，离起床时间还有十分钟时，窗帘缓缓拉开，在自然光的状态下自然醒来（冬天可以通过光源设置达到渐亮的效果）。到了起床时间，轻柔的音乐响起，烧水壶开始烧水，早餐机开始工作。换衣洗漱结束后，早餐已做好，在享用早餐的同时，音乐关闭，音响中开始播放新闻。一切准备就绪后，正好到了上班时间，临出门时，按下玄关的离家模式，除了冰箱外所有电器自动关闭，安防系统开始工作，通过手机随时都能查看家中的情况。电动窗户也通过定时设置在空气最好的时间自动打开透气。


    ### (2) 回家场景


    下班回家的路上，通过手机 APP 远程操控，打开电饭煲开始煮饭，窗户关闭，空调开始按预设的温度运行，同时加湿器也开始工作。到家时，玄关的灯感应到开门动作而亮起，家中客厅的灯光也按照预设的亮度打开，背景音乐开始播放，视频监视系统关闭。


    ### (3) 休闲场景


    可设置分区式休闲场景，不同房间设定不同模式，人们可以看电影、玩游戏、聊天。看电影时，窗帘自动关闭，幕布徐徐落下，背景灯打开，其他灯光逐渐变暗到关闭。有电话来时，电影自动停止播放，通话结束后，所有状态恢复。


    ### (4) 睡眠场景


    一天结束了，到了睡觉时间，你可以通过手动或语音的方式控制操作床头触控板，以进入睡眠模式。窗帘逐渐合上，卧室灯光缓缓变暗至关闭，音乐关闭，加湿器开始工作，空调调至适宜睡眠的温度，除冰箱、空调外的电器全部断电，房门进入反锁模式，起夜感应灯开始工作，安防设备启动。


    ### 7.2.1.3 智能家居的运行逻辑


    智能家居区别于传统家居形态的核心特征体现在多式感知、自主学习和双向交互三个方面。图 7-8 给出了传统家居产品与典型智能家居系统的运行逻辑对比。


    ![](img/f188b68deb37acb6105ba97c814d9af2_163_0.png)


    图 7-8 传统 (a)、智能 (b) 家居系统运行逻辑对比


    多式感知是实现家居智能化的前提，包括对住宅内部、周边及更大范围环境的感知，以及智能家居设备之间运转状态、动作、位置等的感知，还包括对人员这一系统服务对象位置、状态，行为乃至意图的感知。感知过程包括两个层次：第一层是借助一系列传感设备实现对信号的采集、处理与汇总，实现物理家居环境向虚拟数字空间的映射；第二层基于采集到的数字信息，实现特征识别与推理，获得具有实际含义、场景相关且能够触发决策行为的信息。图
    7-8(b)中存在 3 条智能家居系统的感知通路，分别是：


    - (1) 用户—(偏好设置)—智能家居软件系统；


    - (2) 用户—(操控)—智能家居硬件设备—(信息传递)—智能家居软件系统；


    - (3) 用户—(操控)—智能家居硬件设备—(改变)—家居环境—(感知)—智能家居硬件设备—(信息传递)—智能家居软件系统。


    自主学习是处理所感知新类型信息的能力，是实现“智能”的核心。计算载体可以为集中式的家庭中枢系统，也可以是分布于不同家居产品中相互协作的计算单元，还可以借助外部云计算服务实现。通过对收集到的数据信号的处理、建模与运算，人工智能技术得以实现模式识别、自我学习以及自主决策。用户对智能家居软件系统的偏好设置旨在解决系统冷启动问题，在软件系统不断的自我学习的过程中，用户的实际生活习惯与行为特征模型被逐步修正，使得人们对于家居产品的状态决策行为为逐步外化，最终可被人工智能系统替代。双向交互是对“智能”决策结果的执行，包括设备与人之间的交互以及设备与设备之间的交互两个方面。人机交互是双向的，由人到设备的交互接口形态既可以是传统的物理操控、红外遥控，也可以是智能手机、个人电脑等集成化远程遥控，还可以是体感控制、语音控制甚至是眼动控制、神经控制等新型控制形态；由设备到人的交互接口除借助家居产品本身状态改变来传递信息以外，还可借助虚拟—增强现实、智能语音等新型视觉、听觉交互技术来实现。设备之间的交互是在无人参与的情况下，在具备感知与控制能力的设备之间实现的状态联动与动作协同，又可依据设备间的决策与执行关系划分为随动式、主从式和协同式三类。


    ## 7.2.2 智能交通


    交通是人类社会生产、生活以及经济发展的必要环节。随着时代的发展和科技的进步，人们在对交通产生强烈依赖的同时也对交通提出了更多的需求。然而社会经济的发展、城市化进程的不断深入、快速增长的人口对交通需求的加强，直接导致机动车数量呈爆炸式增长，无论是在诸如欧美等发达国家和地区，还是在诸如中国等发展中国家和地区，各国政府道路的建设速度永远赶不上机动车增长的速度，因此，交通堵塞、环境污染、交通事故频发等问题随之而来。实质上，现存的交通问题可以看作是人、车与路之间的矛盾，解决这一矛盾的办法有控制交通需求、增加道路基础设施、加强交通管理、实施智能交通系统。


    智能交通系统（Intelligent Transportation System, ITS），指的是在较完善的基础设施（包括道路、港口、机场和通信）之上将先进的信息技术、数据通信传输技术、电子传感技术、电子控制技术以及计算机处理技术等有效地集成运用于整个交通运输管理体系，从而建立起一种在大范围、全方位发挥作用的实时、准确、高效的综合运输和管理系统。ITS
    使得交通系统中三大主体“人、车、路”之间的相互作用关系以新的方式呈现。ITS 的提出和大力发展能够提高道路使用效率，大幅降低汽车能耗，使交通堵塞减少、短途运输效率提高，现有道路的通行能力提高。经过十几年的推广、试行和发展，ITS
    目前已在经济发达国家和经济较为发达国家的一些都市及高速公路系统中实施。实践证明，ITS 是解决目前经济发展所带来的交通问题的理想方案。ITS 起源于 20
    世纪 60 年代，于 1990 年由美国智能交通学会正式提出，并在世界各国大力推广。20 世纪 80 年代中期以来，ITS 得到了突破性进展，经过十几年的研究与应用，目前国际
    ITS 领域已经形成以美国的智能车辆—公路系统、欧洲的“尤里卡”联合研究开发计划和日本的先进的动态交通信息系统为代表的三足鼎立的局面。其他一些如韩国、澳大利亚等国家的
    ITS 研究和发展也已初具规模。


    智能交通系统的规划、建设，归根到底是服务于城市交通发展的总体目标，提高设施系统的使用效率和服务水平。图 7-9 所示为城市交通的主要影响因素及智能交通系统在城市交通供求关系中扮演的角色和作用。由图
    7-9 可知，无论是实施交通需求管理，还是制定交通规划及提高已有交通基础设施的使用效率，ITS 都扮演着一个不可或缺的重要角色。也就是说，ITS 的建设，可以提高现有交通基础设施的运行效率和交通供给能力。通过交通信息服务、交通拥堵收费等系统，可以在交通供给方面，通过智能公交系统、智能改善交通需求的时空分布特性，“削峰填谷”，使交通管理系统、智能车辆运行管理系统、交通需求与交通供给的矛盾得到缓解。


