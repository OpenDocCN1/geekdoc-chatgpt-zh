    ## 5 人工神经网络与深度学习


    ### 5.1 人工神经网络与深度学习概念


    ### 5.1.1 人工神经网络的概念及发展


    人工神经网络，简称神经网络(Neural Networks，NN)。神经网络最早是人工智能领域的一种算法或者模型，目前神经网络已经发展成为一类多学科交叉的学科领域，特别是随着
    Hinton 在深度学习上取得的进展，神经网络再次受到人们的关注。


    提到人工神经网络，很容易让我们联想到人脑，人脑的神经系统是由众多密集且相互联系的神经元或基本信息处理单元组成的。与人脑的神经系统类似，人工神经网络由众多相连的人工神经元组成，通过人工神经元之间的并行协作实现对人类智能的模拟。也就是说人工神经网络是对人脑或自然神经网络若干基本特性的抽象和模拟，是一种基于连接学说构造的智能仿生模型，是由大量神经元组成的非线性动力系统。国际著名神经网络研究专家
    Hecht-Nielsen 曾说，人工神经网络是由人工建立的、以有向图为拓扑结构的动态系统，它通过对连续或断续的输入做状态响应而进行信息处理。我们综合来源、特点和各种解释，神经网络可简单地表述为人工神经网络是一种旨在模仿人脑结构及其功能的信息处理系统。


    人工神经网络开始于 20世纪40年代初期，对人工神经网络的研究也并不是十分顺利的，主要可以分为以下三个阶段。


    第一阶段：1943 年至 20世纪60年代初。1943 年，生理学家 McCulloch 和数学家 Pitts 发表文章，提出了第一个神经元模型(M-P 模型)，他们的努力奠定了网络模型和以后神经网络开发的基础，开启了人们对人工神经网络的研究。1951
    年，心理学家 Donald O. Hebb 提出了连接权值强化的 Hebb 法则——在神经网络中，信息存储在连接权中，神经元之间突触的联系强度是可变的，这种变化建立起神经元之间的连接。Hebb
    法则为构造有学习功能的神经网络模型奠定了基础。1954 年，生物学家 Eccles 提出了真实突触的分流模型，这一模型通过突触的电生理实验得到证实，因而为神经网络模拟突触的功能提供了原型和生理学的证据。1956
    年，Uttley 发明了一种由处理单元组成的推理机，用于模拟行为及条件反射。20世纪70年代中期，他把该推理机用于自适应模式识别，并认为该模型能反映实际神经系统的工作原理。1960
    年，Widrow 和 Hoff 提出了自适应线性元件 Adaline 网络模型，这是一种连续取值的自适应线性神经元网络模型，他们对分段线性网络的训练有一定作用，此方法速度较快且具有较高的精度。


    第二阶段：20世纪60年代初至 20世纪70年代末。在第一次神经网络研究热潮中，人们忽视了其本身的局限性。1969 年，Minsky 和 Papert 经过多年的研究，提出了对当前成果的质疑，指出当前的网络只能应用于简单的线性问题，却不能有效地应用于多层网络，由此开始了神经网络的低谷期。1972
    年，芬兰的 Kohonen 教授，提出了自组织映射(SOM)理论；同时，美国的神经生理学家和心理学家 Anderson 提出了一个与之类似的神经网络，称为“交互存储器”。现在的神经网络主要是根据
    Kohonen 的工作来实现的。1980 年福岛邦彦发表的“新认知机”(Neocognitron)是视觉模式识别机制模型，它与生物视觉理论结合，综合出一种神经网络模型，使它像人类一样具有一定模式识别能力。在低谷时期，许多重要研究成果都为日后神经网络理论研究打下了坚实的基础。


    第三阶段：20世纪80年代初至今。1982 年，美国物理学家 Hopfield 博士提出了 Hopfield 模型理论，他证明了在一定条件下，网络可以达到稳定的状态。在他的影响下，大量学者又重新开始了对神经网络的研究。1986
    年，由美国的 Rumelhart 和 McClelland 提出了 PDP(Parallel Distributed Processing)网络思想，再一次推动了神经网络的发展。20世纪90年代中后期，神经网络研究步入了一个新的时期，在已有理论不断深化的同时，新的理论和方法也不断涌现。1995
    年，Jenkins 等人开始研究光学神经网络(PNN)，建立了光学二维并行互联与电子学混合的光学神经网络系统。经过多年的发展，目前已有上百种的神经网络模型被提出并得到应用。


    ### 5.1.2 人工神经网络的特点


    前面提到，神经网络是一种基于连接学说构造的智能仿生模型，是由大量神经元组成的非线性动力系统，那么神经网络除了具有非线性系统的特点之外，还具有自身的其他一些特点。不同人在研究神经网络时对其特点做了不同的分类。我们可以将神经网络的特点分为以下几点。


    ### 5.1.2.1 信息处理的并行性、信息存储的分布性


    人工神经网络是由大量简单神经元相互连接构成的高度并行的非线性系统，具有大规模并行性处理特性。虽然每个神经元的处理功能十分有限，但是大量神经元的并行活动使网络呈现出丰富的功能并具有较快的速度。结构上的并行性使网络的信息存储必然采用分布方式，即信息不是存储在网络的某个局部，而是分布在网络所有的连接权中。一个神经网络可存储多种信息，其中每个神经元的连接权中存储的只是多种信息的一部分。当需要获得已存储的知识时，神经网络在输入信息激励下采用“联想”的方法进行回忆，因而具有联想记忆功能。神经网络内在的并行性与分布性表现在其信息的存储与处理上。


    ### 5.1.2.2 高度的非线性、良好的容错性和计算的非精确性


    神经元在网络中处于激活或抑制两种不同的状态，这种行为在数学上表现为一种非线性关系，神经元的广泛互联与并行工作也必然使整个网络呈现出高度的非线性特点。而信息分布存储的结构特点会使神经网络在两个方面表现出良好的容错性：一方面，由于信息的分布式存储，当网络中部分神经元损坏时不会对系统的整体性能造成影响；另一方面，当输入模糊、残缺或变形的信息时，神经网络能通过联想恢复记忆，从而实现对不完整输入信息的正确识别。神经网络能够处理连续的模拟信号以及不精确的、不完全的模糊信息，因此神经网络给出的是最优解而非精确解。


    ### 5.1.2.3 自学习、自组织与自适应性


    自适应性是指一个系统能够改变自身的性能以适应环境变化的能力，它是神经网络的一个重要特性。自适应性包括自学习与自组织两层含义。神经网络的自学习是指当外界环境发生变化时，经过一段时间的训练或感知，神经网络能够通过自动调整网络结构参数，使得对给定输入产生期望的输出。训练是神经网络学习的途径，因此人们经常将学习与训练这两个词混用。神经系统能在外部环境的刺激下按一定规则调整神经元之间的突触连接强度，逐渐构建神经网络，这一构建过程称为网络的自组织（或称重构）。神经网络的自组织能力与自适应性相关，自适应性是通过自组织实现的。


    除了由以上介绍的并行性、分布性、容错性以及自适应性外，还有一点模式识别能力。我们也可以认为模式识别是 ANN 最重要的特征之一。它不但能识别静态信息，对实时处理复杂的动态信息（随时间和空间变化的）也具有巨大潜力。


    ### 5.1.3 深度学习的概念


    深度学习并不是一个全新的概念，深度学习是神经网络发展历程中的产物，所以我们可以说深度学习本质上是包含多个隐含层的人工神经网络。深度学习也叫无监督特征学习，即可以无须人为设计特征提取，特征从数据中学习而来。深度学习实质上是多层表示学习（Representation
    Learning）方法的非线性组合。表示学习是指从数据中学习表示（或特征），以便在分类和预测时提取数据中的有用信息。因此在很多场合下深度学习又被称为表示学习。如果我们更为直接一点地理解深度学习，深度学习指的就是深度神经网络模型，一般指网络层数在三层或者三层以上的神经网络结构。理论上而言，参数越多的模型复杂度越高，“容量”也就越大，也就意味着它能完成更复杂的学习任务。


    在继续了解深度学习之前，我们需要了解什么是机器学习。机器学习是人工智能的一个分支，简单理解机器学习就是通过算法，使得机器能从大量历史数据中学习规律，从而对新的样本做智能识别或对未来做预测。机器学习的发展经过了两个阶段，第一个阶段是浅层学习，第二个阶段就是我们现在所说的深度学习。第一阶段的浅层学习我们在这里不做介绍。第二阶段的深度学习一般认为开始于加拿大多伦多大学机器学习领域的泰斗
    Hinton 教授和他的学生 Salakhutdinov 在顶尖学术刊物《科学》上发表的一篇文章。这篇文章向外界传递出了两个讯息：（1）很多隐层的人工神经网络具有优异的特征学习能力，学习得到的特征对数据有更本质的刻画，从而有利于可视化或分类；（2）深度神经网络在训练上的难度，可以通过“逐层初始化”来有效克服。在这篇文章中，逐层初始化是通过无监督学习实现的。自此之后，人们对于深度学习的研究便一直持续到今天。而这一段时间正对应着人工神经网络的复兴阶段，所以说深度学习的提出带动了人工神经网络的复兴。


    在了解了深度学习的基本概念后，我们再来介绍一下深度学习框架。深度学习框架是专为深度学习领域开发的具有一套独立的体系结构、统一的风格模板、可以复用的解决方案。它一般具有高内聚、严规范、可扩展、可维护、高通用的特点，且拥有统一的代码风格、模板化的结构，能减少大量重复代码的编写。随着深度学习的日益火热，越来越多的深度学习框架被开发出来。目前主流的深度学习框架主要有以下
    6 种，如表 5-1 所列。


