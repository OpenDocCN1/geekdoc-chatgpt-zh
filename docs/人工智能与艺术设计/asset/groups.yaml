    音定位功能，从而实现在交互过程中对交互者进行准确的位置判断；此外，Nexi 具备眨眼、张嘴、皱眉等形式的面部表达能力，以此完成常见情感状态的输出。


    同年，英国西英格兰大学和布里斯托尔大学联合研制出类人机器人 Jule，它的面部采用软性橡胶作为皮肤，内置 34 个马达，以此实现如高兴、悲伤、忧虑等 10
    种人类面部表情的模仿。此外，Jule 还可以依据语音的变换自主调节嘴唇动作，从而实时地实现情绪、语音到表情的映射与表现。


    2009 年，美国汉森机器人公司研发的机器人 Albert HUBO 正式亮相。面部采用类似肉体皮肤材料，使机器人完成表情动作的过程中可产生类人的皮肤纹理变化，内置
    31 个自由度，可实现颈部 3 个自由度及表情 28 个自由度的联合控制，以此实现多种面部表情的模拟与交互。此外，该机器人还具备年龄、性别等推断与情绪互动决策的智能功能，可针对不同年龄群的交互者做出个性化的表情回应。


