    # 8.4 人工智能的艺术创作的案例介绍


    中国工程院院士、中国人工智能学会理事长李德毅认为，如果说 2016 年是人工智能的元年，未来 15 年到 20 年，将是人工智能时代。人工智能给人类带来的影响，可能将远远超过计算机和互联网在过去几十年中对世界造成的影响。近几年发生的人工智能事件就足以让人类咋舌：阿尔法狗战胜了围棋顶尖高手，人工智能机器人“撰写”的小说获得大奖，第一本人工智能诗集已经出版，人工智能机器人已经会书写对联。


    “早春江上雨初晴，杨柳丝丝夹岸莺。画舸烟波双桨急，小桥风浪一帆轻。”谁能想到，这是人工智能以“早春”为关键词创作的一首诗。作者“九歌”，由清华大学计算机科学与技术系孙茂松教授带领学生团队历时三年研发而成。


    在综艺节目“机智过人”中，微软的聊天机器人小冰以一曲中国风歌曲《桃花梦》险胜人类对手。当小冰唱出“茫茫夜雨中，往事如风，耳边桃花笑春风，梦里你我相逢”这般古风浓郁的句子，很多观众以为这是人类的作品。


    写诗、作曲、绘画，人工智能创作的春天已悄然到来。


    # 8.4.1 人工智能的书法创作


    阿尔法狗打败顶尖棋手李世石之后，人类关于人工智能的讨论又多起来。关于标题所提问题，相信大部分人，特别是书法学习者，被问到这个问题时，会不假思索、信心满怀地回'
  md: '

    起进行考虑，将这一过程中的不合理因素进行消除，使其能够不断地改进和优化。在设计图案的过程中，写生的变化也是初步准备中的一项，还没有升级到抽象的范围内，只有不断地进行分析，才能对客观事物进行不断的总结，将艺术审美中的组成要点、元素等筛选出来，使自然形态逐渐向抽象形态进行转变。


    - 第三，我们经常在侦探小说中看到推理这个名词，这一名词在创意设计中也同样可以使用。通过一个斑点可以将豹推断出来，就是一个明显的推理过程。古人在打仗的时候，身上穿的盔甲就包括一定的数学逻辑，艺术工作人员对其进行体现时，是不会将所有的尺寸比例提前进行计算出来的，通常都是结合它的局部特点，对其进行大致的预测，将整体的感觉表达出来。同样的，无论哪个设计人员都不会对老虎、长颈鹿上的花纹仔细地数一数，都是通过推测的方式对其进行描绘，运用合理的推断可以帮助设计人员对事物的规律尽快地查找出来。


    - 第四，判断也就是取舍和选择。在设计人员的脑海中，我们所生活的环境中形象是处处存在的，形象虽然很多，但不是所有的形象都可以被描绘的，只有在其审美要求的基础上才能进行分析。例如运用在图案的构成上，大多数都是以格律体来进行的，很多都是以九宫格、圆等形式来对图案进行创作的。还有一种其他的方式就是，绘画中的形象不完全是按照格律体的框架来进行的，然而画面的边缘必须与选定的形状相符合。怎样进行绘画，则要求设计人员要与装饰的需求、制作的要点等结合在一起进行考虑，从而做出合理的推断，使创作出的作品是最佳的。总而言之，将逻辑思维运用在创意设计中的好处是非常多的。


    在思维领域中，逻辑思维就是由逻辑因素所发挥的一个主要影响。这种思维的特点是推理，它与想象和联想是完全不一样的，与音乐和美术所展示的形象表达也是完全不一样的，虽然音乐和美术内部也存在着一定的逻辑因素，然而它们是以形象因素为主要内容的。推理一方面可以使人们获得知识，这些知识通常不是由经验直接总结出的，另一方面还能使人获得其他的知识，这些知识是人不能直接用感觉和知觉得到的，所以，它属于理性的思维方式，必然的结果就是由确定的前提而来，虽然它的形式有很多种，然而其“必然地得出”只有这一种。逻辑思维运用在创意设计中时，主要体现在推理，它不同于联想、想象，也不同于形象的表达。在实施艺术设计前，必然会由于一些目标、需求的约束，去分析和理解一些相关的因素，在分析的过程中必然会利用逻辑思维方法，使得在造物产品和过程中，将这些需求、目标充分地表现出来。在这时，创意设计的第一步就是要将明确的前提获得到，其实设计就是一个过程，有过设计经历的人都会懂得这个过程。从最初不经意间的灵感涌现，接着在实施过程中遇到各种各样的问题，然后耐心去一步一步解决，把环境中的不利条件通过设计的手段变成有利条件。而实际上，因为在传统逻辑中，它没有将逻辑和心理学的研究对象区分开来，使得逻辑是对推理进行研究的，而且逻辑是研究推理的一种主要方法，这一说法看起来更加的科学。逻辑自身有其内在的本质特点，也就是“必然地得出”。亚里士多德在其著作中曾说过，“推理就是对事物进行证明，一部分会被认定为条件，其他的部分就会自然而然地产生”。在现代逻辑理念中，对传统的逻辑理念进行了彻底的转变，使得逻辑有了两个特点，一是其语言是构造形式的，二是将演算系统建立起来。所以，逻辑这种科学方法是有规律可言的，同时也是非常严谨的。其次，思维的重点则属于心理范围，思维也是心理过程，将感觉、思想等内在因素体现出来。思维的种类很多，从表述的层面上来看，可以分为三种，就是形象、技术和逻辑思维；从认识层面上来看，分为四种，就是抽象、形象、知觉和灵感思维；从哲学层面上来看，分为两种，就是具体和抽象思维；除了这些，还有其他一些思维，比如单一和系统思维等。


    对于创意设计来说，逻辑思维的运用是很关键的。进行逻辑思维时，是利用推理，来使“必然地得出”总结出来的。也就像上述分析的结果一样，创意设计的目的性是很强的，它最终的目标就是让“必然地得出”在生产、消费等各环节中进行应用，使需求得以满足，使复合价值充分体现出来。设计师在进行创意设计时会将其丰富的想象力充分发挥出来，这个过程与逻辑思维的引导是分不开的。设计是有一定前提条件的，它有一定的目的性。所以，逻辑思维自身的单一性，使得其在思维过程中成为不可或缺的设计主题。设计就是要给受众传递一些信息，逻辑思维指向就是确定这些信息，设计的过程和内容都必须以这些信息为基础，使想象力和创造力充分发挥出来。所以，在设计领域引入逻辑思维，它就会变成一种实用的方法，能够有效地对艺术设计进行指导，利用这一方式能够使设计作品与环境与人之间建立起一种和谐的关系。


    创意思维是认识物质世界和改造世界的原动力，在艺术设计中通过创意思维改变视觉艺术的存在和呈现形式，以达到人类自身在生理上和心理上的需求。艺术创意的表达方式是多样的，不仅依靠创意者自身知识和实践经验的积累，还要掌握不同的创意方法。就艺术思维呈现的方式来看，艺术作品的创新需要理性的逻辑思维，也需要感性的形象思维以及灵感。艺术作品的呈现不仅表现在作品的呈现形式上，还表现在作品的呈现过程中。有些作品的创作并不是依靠理性的思维才能创造出来，人类思维的变化具有天然的偶然性和未可知性，这就为人类提供了更大更有可能性的创造新事物的空间。视觉造型中的方法也会随着科学技术的发展而产生新的方法，特别是现代软件编程、数据库计算的产生，可以让我们随心所欲地制造我们想要的造型形象，或者让我们的创意超越我们的想象，如我们可以用视觉形象表示音乐、语言、心脏的跳动、股票的动向等。在图形图像的软件运用中，往往是采用固定的或者是产生变量的程序算法来实现形象创意的设计。这种造型可以是矢量的图形，也可以是动态的图像，有的是逼真的模型，有的是虚拟的现实。创意本身就是对传统的反叛，随着社会的发展，视觉形象设计的创意将会有更多的切入点，视觉形态设计的创意必将有新的发展。


    ## 8.3 人工智能完成艺术设计的创作


    逻辑思维又被叫作抽象思维，是一种最高级别的思维方式。它的特点主要以抽象概念、推断为主，它的基本过程主要有分析、判断和概括等，能够对事物的本质特征和规律性进行反映。抽象思维与动作思维之间是完全不同的，与形象思维之间也有着很大的差异，它不再依赖感性材料。一般来说，抽象思维有两种形式，一是经验型，二是理论型。第一种类型是以实践为前提的，以实际经验为基础而进行推理和预测，例如在生产过程中工人解决问题的经验，就是这种类型的思维。第二种方式是以理论为前提的，进行推理和预测时将概念、原理等应用其中。科学家和学者的思维大多数都属于这种方式。经验型的思维因为会受到经验的约束，使得抽象水平不高。逻辑思维与形象思维的关系提到理性和感性两个词时，大多数人就会不自觉地将“感性认识”和“理性认识”联系在一起，前者是认识的最初时期，后者是认识的升级。前者是后者的基础，后者是前者的必然发展。前者必须逐渐地向后者进行转变等这一系列的讨论。确实，从认识事物的过程层面来讲，认识需要进行很多的重复才能发展到最终阶段。对艺术设计的认识过程也必须要有这一过程。即便当前它所包括的内容和形式已经相对成熟。科学的思维方法与纯艺术思维方法都可以在人工智能方面继续学习。


    ### 8.3.1 人工智能对艺术设计行为的深度学习


    在数字化革命时代，智慧设计可以分为三个部分：智性设计、智能设计、美学思考。“智性”等于“理智”“悟性”和“知性”吗？德国哲学家伊曼努尔·康德在《纯粹理性批判》中给出了答案：“先验感性论”强调了纯粹数学成立的必要条件是时间和空间，时空是一种先天直观的对于主体的认识形式。直观是人类的一种感性的接受能力，而不是一种概念。因为人类接受一切的可被感知的对象时，必然都是在空间和时间的形式下。康德的理论与传统唯理论提出的概念不同的地方在于，他对于智性的解释不再仅限于“天赋观念”和相对应的逻辑推理，他强调了智性同时是一种具备了主观能动性的能力。人工智能的深度学习是“智性”+“直观”，将两者联系在一起作为知识的组成部分。智慧设计是人工智能的发展，自然而发的对于精神需求、物质需求的改变，是人工智能的能动性的思考。这三个部分的内容分别从设计思维、设计方法、设计反思的角度对智慧设计进行了划分，三者相互作用、相互影响，推动了人工智能的“智能设计”（Intelligent
    Design）。将人工智能融入智慧设计，是一种理智加直观的活动。智性设计是一种有意识去把握并思考具体的理念，智性设计可以说是艺术设计在直观感受和思考人类生活需求，从而将理性与感性联系在一起，作为人工智能的智慧设计的深度学习内容。


    现代设计人员的重要辅助工具是现代信息技术，采用计算机模拟人类的思维模式，提高计算机智能水平，使计算机能够更多、更好地承担设计过程中的各种任务。智慧生活方式中的人工智能设计，简单说就是设计一个可以观察周遭环境并做出行动以达到目标的人工系统，以满足人类在个人生活和社会生活中的生活、学习、交流、感知等各项需求。依据智能设计中设计能力的不同，可以将其分为三个层次：


    - (1) 常规设计：依据人的需求、设计的属性、设计流程和策略对人类当下的生活行为进行规划，用数字化的交互手段定义设计需求，通过设计解决生活中的常规需求。

    - (2) 联想设计：通过分析目前生活中已经有的设计案例，采集这些设计的信息和数据，再通过比对大量优质的设计案例，对大多数案例中存在的共性问题，利用大数据的处理方式，从中获得关于设计的隐性数据信息，以此指导设计。这是一种通过借鉴案例和设计数据，实现对常规设计突破的方式。

    - (3) 进化设计：进化设计是通过利用、借鉴和模拟生物界的自然选择规律和自然进化机制，实现高度并行、随机、自适应的搜索算法。智能设计的进一步发展正是依靠了进化设计的方法。而“设计中的人工智能”是针对大规模复杂产品设计的系统。


    在大力发展当代计算机科学的背景下，设计者可以借助大量的设计软件将自己的灵感视觉化。相对于传统的艺术创作所耗费长达几个月甚至几年的时间，计算机科学可以帮助设计师快速、高效地完成创作，并且通过模具进行量产。例如，艺术家可以通过计算机建模，利用
    3D 打印技术制造出人们所需要的产品；可以利用计算机中大量的色彩素材更加随心所欲地创作作品；也可以通过计算网络中海量的艺术设计资源，激发灵感，扩展艺术思维，把自己的思想与计算机科学有机地结合在一起实现设计创作。在作品呈现方面，随着虚拟现实技术的日渐成熟，通过虚拟环境的体验与交流，有效地传达设计作品所表达的设计理念，艺术家可以利用此项技术更加真实地将作品展现出来，使人们可以身临其境，更加直观地观赏艺术的细节。


    ### 8.3.2 人工智能对艺术设计的高仿


    最近出现了一种新型“艺术滤镜”，能够将著名油画比如凡·高的《星空》或蒙克的《呐喊》的艺术风格“迁移”到照片中。据 Google 的研究科学家介绍，这种最新的深度卷积风格迁移网络在学习了多种风格之后可以实现多种艺术风格间实时平滑迁移，且可应用于静态图像和视频。


    莫奈和毕加索两名画家分别用印象派和抽象派的画作颠覆了整个艺术世界，创造出新的美学风格。那么，下一场艺术方面的革新会由谁引领呢？也许会是一台机器。这可不是异想天开，科学家们发明出了会作画的人工智能，其绘画风格自成一体，十分独特，由这个人工智能创作的许多作品，大家看了都不禁竖起大拇指。


    人工智能画师，由来自美国罗格斯大学、查尔斯特顿学院和加州脸书人工智能研究实验室的科研人员合作研发出这一人工智能系统。这一人工智能画师可以通过观察人类的艺术作品，学习不同的艺术风格，生成更有创造力的作品。


    研究团队进行了一次网络问卷调查，评估人工智能生成作品的创造性。他们选取了 1945 年至 2007 年之间抽象派艺术家的画作以及 2016 年巴塞尔艺术展上展出的作品，将其与人工智能的画作混在一起，此外还添加了
    4 幅旧的生成式对抗网络创作的作品。这些画作交由大众评审进行评判，不标注哪些是由人工智能绘制的。参与调查的对象还需要回答相关的问题，评价每幅作品的复杂性和创意度，并说明是否给他们一些启发，或者提升了他们的情绪。


    调查结果表明，人工智能的作品不仅以假乱真，更是以更高的评分胜过了由人类创作的绘画作品。人工智能的学习过程非常依赖“生成式对抗网络”。在这一网络中存在“生成器”和“判别器”两个神经子网络。基于给定的训练集，生成器会创作一个图像，判别器能够区分训练集图像和生成器制作出的仿造图像，对其进行评判。通过两个子网络的算法组合，人工智能可以一次比一次做得更好，得到的结果不断被优化，人工智能的造诣也就在这样的训练中不断精进。


    艺术人工智能设计团队对这一“生成式对抗网络”进行了一些修改，克服了历史版本的局限性，创造性地生产出更独特且具有较高审美价值的艺术品，将原有创作算法升级为“创造式对抗网络”。这样，人工智能不仅会“临摹”，更可以在真正意义上利用所学到的东西进行独一无二的创作。


    在新的艺术人工智能中，一个生成网络就完成了之前两个子网络的工作，同时，这个生成网络还能够自主创作图像，剩余的工作由判别器网络完成。科学家们选取了 8.15
    万幅 15 世纪至 20 世纪著名的绘画作品，供判别器学习。吸收了这些包罗万象的艺术数据后，判别器网络能够分辨出哪些图像具有艺术性，哪些图像没有什么艺术价值，并可以判定图像是否属于已知艺术风格。人工智能可以扭转图片来模仿莫奈等著名绘画大师的风格。而且，还有一些专用程序来完成这项工作。


    这样，一步一步，人工智能学到的不是怎样画得像人的作品，而是怎样丢掉模仿的影子，创作更有大师潜质、更新奇美妙的独特画作。生成器可以创作出一幅又一幅的图画，既符合判别器的“审美标准”，又与所有现存的艺术风格都大不一样。所以说，人工智能的作品既具有创意，让人眼前一亮，同时也不会太让人难以接受，十分符合大众的艺术审美。


    现在，已经开始有人运用人工智能为画廊创作绘画作品，也有人开始尝试用人工智能学习其他绘画风格，创作 12 分钟的动画电影框架。目前，像这样的创作还十分依赖人类的指导，但是，随着技术的不断进步，人与机器的边界会越来越模糊。


    当人工智能可以像人类一样自如创作时，艺术一定会发生翻天覆地的变化，大家都能从中受益。比如，未来人们或许可以通过人工智能为自制的小视频创作配乐，并适当进行剪辑，人人都能当小导演。人工智能将取代一些作家，选取最引人入胜的主题创作小说，赚取你的眼泪和欢笑。或许，人工智能还能承包你的漫画书，由它为你量身定做属于你的漫画剧情。


    过去那些需要十年磨一剑的事情，借助人工智能将可以迅速地完成，极大地简化人类的工作。在人工智能的协助下，也许我们能够腾出更多的精力去创造更多艺术形式和艺术风格，等我们有了新的发现，再来教给人工智能。智能设计可以通过理性、精确的方式控制和解决现阶段的复杂问题。每次工业生产制造技术升级换代都对设计产生了震动，智能设计也不会例外。从微观层面来看，智能制造对产品设计的设计流程技术实现都将产生影响。它对于工业产品设计的前期调研有更加科学和充分的依据，让设计实现的过程更加理性和精确。智能制造将对设计方法产生重要的影响，这种影响尤其反映在大数据的云计算所带来的设计方案创新和优化方面。宏观地看待设计与智能制造的关系，智能制造对设计的本质和意义有关联。从本质上看，设计与智能制造都是使用有限的资源满足人们越来越多和越来越高的目标。此外，设计所遵循的伦理性和文化身份认同也有重要的价值意义，设计在智能制造的帮助下能够体现文明的适应性。


    ### 8.3.3 人工智能的艺术设计的创作


    对于人类未来的改变，没有任何一种技术或观念如“人工智能”这样受到全球的关注和讨论。几乎所有的学科领域都在谋划如何与人工智能“牵手”以开辟新的疆域。发轫于 19
    世纪中叶的现代艺术设计，一路紧随工业文明和信息文明的步伐，已经习惯于将最新的科技成果转化为设计能量，一次次催生出新的设计内涵和形式。在人工智能的浪潮中，以往设计的范式将面临消解，新的设计范式在悄然建立，在这个过程中，以数字经济为特征的社会环境给设计产业带来的机遇和挑战，势必也将作用于设计教育。


    对于“人工智能”的讨论，最多的是机器将直接取代人工劳动，进而对行业发展趋势产生巨大影响。如果设计界以创造性劳动自居，认为人工智能对设计创造的影响甚微，难免过于乐观。阿里巴巴在
    UCAN 大会上开宗明义地提出“新设计×新商业”的主张，其推出的“鲁班”智能设计平台，已经在去年“双 11”前夕取代了设计师的劳动，成功完成数以万计的电商网页的版式设计。人工智能完成设计作品的技术路径，与其他劳动或服务一样，都是通过深度学习、大数据、云平台、计算能力来完成的指定工作。当机器学会主题的理解、元素的搜集和处理、形式美法则等设计思维活动，并推演为数字化组合时，机器进行自主设计就成为可能。更何况，人与机器在素材库面前是平等的，而对于比例、数据、组合等信息而言，机器的能力强于普通设计师，人工智能可以高效地调用既有的元素、字体、色彩，按照深度学习形成的数据模型，形成多种可供选择的作品。显而易见，大数据支撑下的海量模型、素材、案例，以及
    Adobe 旗下各种设计软件的智能化趋势，将促使人工智能轻松地完成各种类型的设计，如家居设计、标志设计、包装设计等，并达到一定的设计水准。


    如果设计活动可以交由人工智能完成，当人工智能也能交付一件成熟的作品并满足基本的市场需求，设计行业在人工智能的影响下，将参与更高级别的艺术创造。


    未来，世界上大部分国家将告别物质匮乏与贫穷饥饿，进入以生物技术支撑的优质生命、精致体验的幸福经济时代。事实上，以工业化和城市化为主要建设内容的时代也渐行渐远，在未来中国经济建设新常态中，城乡统筹、全域旅游、健康中国、养老产业等新兴主题将逐渐成为发展命题的核心。当幸福产业、幸福经济的发展与建设智能社会、智能经济不期而遇时，人工智能不再是被束之高阁的实验室状态，而是以更快的速度融入社会生产与大众生活中，以智慧家居、智慧教育、智慧旅游、智慧交通等模式，影响社会运行和大众消费的方方面面。其中，设计将以全新的姿态进入人产业的核心领域，活跃于技术研究与市场应用、理性科技与人文情感、功能与体验、商业与美学等范畴之间，体现于个性化的产品、信息的传递、空间体验、系统整合设计等方向中。


    与人工智能同行的未来设计，在带给人类文明惊喜的同时，同样也参与到全人类共同问题的解决，形成升级版的社会创新设计。意大利社会创新设计专家埃佐·曼奇尼（Ezio
    Manzini）曾经说：“过去十年中，互联网、移动电话及社交媒体的普及与社会创新浪潮逐渐交汇融合，催生了新一代服务，这些服务不仅能够为难题提供前所未有的解决方案，还挑战着我们对幸福的理解，以及看待公民与国家间关系的观念。”埃佐·曼奇尼就互联网技术对社会创新设计重要性的理解，在我国是以“互联网+”的战略提出，而“智能+”对“互联网+”的升级悄然而至，在很多领域已形成了成熟的商业模式。世界范围内不同国家的设计院校，不约而同地关注到人类健康医疗问题，以此形成社会创新设计、服务设计的命题，其中对人工智能与用户体验的深度融合，是各个团队探索的主要领域。英国
    Falmouth 大学与康沃尔郡的 Truro 医院展开的“心理健康”设计，吸引了包括中国的江南大学、安徽大学及新加坡、埃塞俄比亚等国家的院校团队的加入，项目发起人布莱恩(Clark
    Bryan)明确提出，以科技领域最新的大数据、云计算的成果，结合心理健康的用户群体及相关者，形成创新性的解决方案。可以预见的是，智慧医疗在未来的广泛运用，一定是生命科学、大数据、云计算等科学技术与设计相通的成果，毕竟，在生命的任何状态下，形态、色彩、肌理、触觉等要素，不可避免地以各种形式真实地呈现在产品、环境和体验之中。


    设计作为创造性的活动，大多在解决问题或给人类带来惊喜两方面提出方案。在人工智能的世界里，任何事物几乎都是一组数据，都可找到算法的推演。如果说，交互设计、界面设计、数字媒体设计等新近形成的设计方向，是人工智能时代到来前的热身准备，那么，人工智能技术催生的新的设计领域将加速建立。以往在形式与功能之间展开的设计讨论，会变得越来越不重要，现有设计学科形成的以工业设计、视觉传达设计、环境设计等专业分类，将难以适应产业转型的需求。在已经形成的服务设计、系统整合创新设计、社会创新设计等内容中，人工智能的渗透使设计与相关学科的协同能力、解决问题的能力变得更为强大。


    ## 8.4 人工智能的艺术创作的案例介绍


    中国工程院院士、中国人工智能学会理事长李德毅认为，如果说 2016 年是人工智能的元年，未来 15 年到 20 年，将是人工智能时代。人工智能给人类带来的影响，可能将远远超过计算机和互联网在过去几十年中对世界造成的影响。近几年发生的人工智能事件就足以让人类咋舌：阿尔法狗战胜了围棋顶尖高手，人工智能机器人“撰写”的小说获得大奖，第一本人工智能诗集已经出版，人工智能机器人已经会书写对联。


    “早春江上雨初晴，杨柳丝丝夹岸莺。画舸烟波双桨急，小桥风浪一帆轻。”谁能想到，这是人工智能以“早春”为关键词创作的一首诗。作者“九歌”，由清华大学计算机科学与技术系孙茂松教授带领学生团队历时三年研发而成。


    在综艺节目“机智过人”中，微软的聊天机器人小冰以一曲中国风歌曲《桃花梦》险胜人类对手。当小冰唱出“茫茫夜雨中，往事如风，耳边桃花笑春风，梦里你我相逢”这般古风浓郁的句子，很多观众以为这是人类的作品。


    写诗、作曲、绘画，人工智能创作的春天已悄然到来。


    ### 8.4.1 人工智能的书法创作


    阿尔法狗打败顶尖棋手李世石之后，人类关于人工智能的讨论又多起来。关于标题所提问题，相信大部分人，特别是书法学习者，被问到这个问题时，会不假思索、信心满怀地回

    '
  mdcn: '

    起进行考虑，将这一过程中的不合理因素进行消除，使其能够不断地改进和优化。在设计图案的过程中，写生的变化也是初步准备中的一项，还没有升级到抽象的范围内，只有不断地进行分析，才能对客观事物进行不断的总结，将艺术审美中的组成要点、元素等筛选出来，使自然形态逐渐向抽象形态进行转变。


    - 第三，我们经常在侦探小说中看到推理这个名词，这一名词在创意设计中也同样可以使用。通过一个斑点可以将豹推断出来，就是一个明显的推理过程。古人在打仗的时候，身上穿的盔甲就包括一定的数学逻辑，艺术工作人员对其进行体现时，是不会将所有的尺寸比例提前进行计算出来的，通常都是结合它的局部特点，对其进行大致的预测，将整体的感觉表达出来。同样的，无论哪个设计人员都不会对老虎、长颈鹿上的花纹仔细地数一数，都是通过推测的方式对其进行描绘，运用合理的推断可以帮助设计人员对事物的规律尽快地查找出来。


    - 第四，判断也就是取舍和选择。在设计人员的脑海中，我们所生活的环境中形象是处处存在的，形象虽然很多，但不是所有的形象都可以被描绘的，只有在其审美要求的基础上才能进行分析。例如运用在图案的构成上，大多数都是以格律体来进行的，很多都是以九宫格、圆等形式来对图案进行创作的。还有一种其他的方式就是，绘画中的形象不完全是按照格律体的框架来进行的，然而画面的边缘必须与选定的形状相符合。怎样进行绘画，则要求设计人员要与装饰的需求、制作的要点等结合在一起进行考虑，从而做出合理的推断，使创作出的作品是最佳的。总而言之，将逻辑思维运用在创意设计中的好处是非常多的。


    在思维领域中，逻辑思维就是由逻辑因素所发挥的一个主要影响。这种思维的特点是推理，它与想象和联想是完全不一样的，与音乐和美术所展示的形象表达也是完全不一样的，虽然音乐和美术内部也存在着一定的逻辑因素，然而它们是以形象因素为主要内容的。推理一方面可以使人们获得知识，这些知识通常不是由经验直接总结出的，另一方面还能使人获得其他的知识，这些知识是人不能直接用感觉和知觉得到的，所以，它属于理性的思维方式，必然的结果就是由确定的前提而来，虽然它的形式有很多种，然而其“必然地得出”只有这一种。逻辑思维运用在创意设计中时，主要体现在推理，它不同于联想、想象，也不同于形象的表达。在实施艺术设计前，必然会由于一些目标、需求的约束，去分析和理解一些相关的因素，在分析的过程中必然会利用逻辑思维方法，使得在造物产品和过程中，将这些需求、目标充分地表现出来。在这时，创意设计的第一步就是要将明确的前提获得到，其实设计就是一个过程，有过设计经历的人都会懂得这个过程。从最初不经意间的灵感涌现，接着在实施过程中遇到各种各样的问题，然后耐心去一步一步解决，把环境中的不利条件通过设计的手段变成有利条件。而实际上，因为在传统逻辑中，它没有将逻辑和心理学的研究对象区分开来，使得逻辑是对推理进行研究的，而且逻辑是研究推理的一种主要方法，这一说法看起来更加的科学。逻辑自身有其内在的本质特点，也就是“必然地得出”。亚里士多德在其著作中曾说过，“推理就是对事物进行证明，一部分会被认定为条件，其他的部分就会自然而然地产生”。在现代逻辑理念中，对传统的逻辑理念进行了彻底的转变，使得逻辑有了两个特点，一是其语言是构造形式的，二是将演算系统建立起来。所以，逻辑这种科学方法是有规律可言的，同时也是非常严谨的。其次，思维的重点则属于心理范围，思维也是心理过程，将感觉、思想等内在因素体现出来。思维的种类很多，从表述的层面上来看，可以分为三种，就是形象、技术和逻辑思维；从认识层面上来看，分为四种，就是抽象、形象、知觉和灵感思维；从哲学层面上来看，分为两种，就是具体和抽象思维；除了这些，还有其他一些思维，比如单一和系统思维等。


    对于创意设计来说，逻辑思维的运用是很关键的。进行逻辑思维时，是利用推理，来使“必然地得出”总结出来的。也就像上述分析的结果一样，创意设计的目的性是很强的，它最终的目标就是让“必然地得出”在生产、消费等各环节中进行应用，使需求得以满足，使复合价值充分体现出来。设计师在进行创意设计时会将其丰富的想象力充分发挥出来，这个过程与逻辑思维的引导是分不开的。设计是有一定前提条件的，它有一定的目的性。所以，逻辑思维自身的单一性，使得其在思维过程中成为不可或缺的设计主题。设计就是要给受众传递一些信息，逻辑思维指向就是确定这些信息，设计的过程和内容都必须以这些信息为基础，使想象力和创造力充分发挥出来。所以，在设计领域引入逻辑思维，它就会变成一种实用的方法，能够有效地对艺术设计进行指导，利用这一方式能够使设计作品与环境与人之间建立起一种和谐的关系。


    创意思维是认识物质世界和改造世界的原动力，在艺术设计中通过创意思维改变视觉艺术的存在和呈现形式，以达到人类自身在生理上和心理上的需求。艺术创意的表达方式是多样的，不仅依靠创意者自身知识和实践经验的积累，还要掌握不同的创意方法。就艺术思维呈现的方式来看，艺术作品的创新需要理性的逻辑思维，也需要感性的形象思维以及灵感。艺术作品的呈现不仅表现在作品的呈现形式上，还表现在作品的呈现过程中。有些作品的创作并不是依靠理性的思维才能创造出来，人类思维的变化具有天然的偶然性和未可知性，这就为人类提供了更大更有可能性的创造新事物的空间。视觉造型中的方法也会随着科学技术的发展而产生新的方法，特别是现代软件编程、数据库计算的产生，可以让我们随心所欲地制造我们想要的造型形象，或者让我们的创意超越我们的想象，如我们可以用视觉形象表示音乐、语言、心脏的跳动、股票的动向等。在图形图像的软件运用中，往往是采用固定的或者是产生变量的程序算法来实现形象创意的设计。这种造型可以是矢量的图形，也可以是动态的图像，有的是逼真的模型，有的是虚拟的现实。创意本身就是对传统的反叛，随着社会的发展，视觉形象设计的创意将会有更多的切入点，视觉形态设计的创意必将有新的发展。


    ## 8.3 人工智能完成艺术设计的创作


    逻辑思维又被叫作抽象思维，是一种最高级别的思维方式。它的特点主要以抽象概念、推断为主，它的基本过程主要有分析、判断和概括等，能够对事物的本质特征和规律性进行反映。抽象思维与动作思维之间是完全不同的，与形象思维之间也有着很大的差异，它不再依赖感性材料。一般来说，抽象思维有两种形式，一是经验型，二是理论型。第一种类型是以实践为前提的，以实际经验为基础而进行推理和预测，例如在生产过程中工人解决问题的经验，就是这种类型的思维。第二种方式是以理论为前提的，进行推理和预测时将概念、原理等应用其中。科学家和学者的思维大多数都属于这种方式。经验型的思维因为会受到经验的约束，使得抽象水平不高。逻辑思维与形象思维的关系提到理性和感性两个词时，大多数人就会不自觉地将“感性认识”和“理性认识”联系在一起，前者是认识的最初时期，后者是认识的升级。前者是后者的基础，后者是前者的必然发展。前者必须逐渐地向后者进行转变等这一系列的讨论。确实，从认识事物的过程层面来讲，认识需要进行很多的重复才能发展到最终阶段。对艺术设计的认识过程也必须要有这一过程。即便当前它所包括的内容和形式已经相对成熟。科学的思维方法与纯艺术思维方法都可以在人工智能方面继续学习。


    ### 8.3.1 人工智能对艺术设计行为的深度学习


    在数字化革命时代，智慧设计可以分为三个部分：智性设计、智能设计、美学思考。“智性”等于“理智”“悟性”和“知性”吗？德国哲学家伊曼努尔·康德在《纯粹理性批判》中给出了答案：“先验感性论”强调了纯粹数学成立的必要条件是时间和空间，时空是一种先天直观的对于主体的认识形式。直观是人类的一种感性的接受能力，而不是一种概念。因为人类接受一切的可被感知的对象时，必然都是在空间和时间的形式下。康德的理论与传统唯理论提出的概念不同的地方在于，他对于智性的解释不再仅限于“天赋观念”和相对应的逻辑推理，他强调了智性同时是一种具备了主观能动性的能力。人工智能的深度学习是“智性”+“直观”，将两者联系在一起作为知识的组成部分。智慧设计是人工智能的发展，自然而发的对于精神需求、物质需求的改变，是人工智能的能动性的思考。这三个部分的内容分别从设计思维、设计方法、设计反思的角度对智慧设计进行了划分，三者相互作用、相互影响，推动了人工智能的“智能设计”（Intelligent
    Design）。将人工智能融入智慧设计，是一种理智加直观的活动。智性设计是一种有意识去把握并思考具体的理念，智性设计可以说是艺术设计在直观感受和思考人类生活需求，从而将理性与感性联系在一起，作为人工智能的智慧设计的深度学习内容。


    现代设计人员的重要辅助工具是现代信息技术，采用计算机模拟人类的思维模式，提高计算机智能水平，使计算机能够更多、更好地承担设计过程中的各种任务。智慧生活方式中的人工智能设计，简单说就是设计一个可以观察周遭环境并做出行动以达到目标的人工系统，以满足人类在个人生活和社会生活中的生活、学习、交流、感知等各项需求。依据智能设计中设计能力的不同，可以将其分为三个层次：


    - (1) 常规设计：依据人的需求、设计的属性、设计流程和策略对人类当下的生活行为进行规划，用数字化的交互手段定义设计需求，通过设计解决生活中的常规需求。

    - (2) 联想设计：通过分析目前生活中已经有的设计案例，采集这些设计的信息和数据，再通过比对大量优质的设计案例，对大多数案例中存在的共性问题，利用大数据的处理方式，从中获得关于设计的隐性数据信息，以此指导设计。这是一种通过借鉴案例和设计数据，实现对常规设计突破的方式。

    - (3) 进化设计：进化设计是通过利用、借鉴和模拟生物界的自然选择规律和自然进化机制，实现高度并行、随机、自适应的搜索算法。智能设计的进一步发展正是依靠了进化设计的方法。而“设计中的人工智能”是针对大规模复杂产品设计的系统。


    在大力发展当代计算机科学的背景下，设计者可以借助大量的设计软件将自己的灵感视觉化。相对于传统的艺术创作所耗费长达几个月甚至几年的时间，计算机科学可以帮助设计师快速、高效地完成创作，并且通过模具进行量产。例如，艺术家可以通过计算机建模，利用
    3D 打印技术制造出人们所需要的产品；可以利用计算机中大量的色彩素材更加随心所欲地创作作品；也可以通过计算网络中海量的艺术设计资源，激发灵感，扩展艺术思维，把自己的思想与计算机科学有机地结合在一起实现设计创作。在作品呈现方面，随着虚拟现实技术的日渐成熟，通过虚拟环境的体验与交流，有效地传达设计作品所表达的设计理念，艺术家可以利用此项技术更加真实地将作品展现出来，使人们可以身临其境，更加直观地观赏艺术的细节。


    ### 8.3.2 人工智能对艺术设计的高仿


    最近出现了一种新型“艺术滤镜”，能够将著名油画比如凡·高的《星空》或蒙克的《呐喊》的艺术风格“迁移”到照片中。据 Google 的研究科学家介绍，这种最新的深度卷积风格迁移网络在学习了多种风格之后可以实现多种艺术风格间实时平滑迁移，且可应用于静态图像和视频。


    莫奈和毕加索两名画家分别用印象派和抽象派的画作颠覆了整个艺术世界，创造出新的美学风格。那么，下一场艺术方面的革新会由谁引领呢？也许会是一台机器。这可不是异想天开，科学家们发明出了会作画的人工智能，其绘画风格自成一体，十分独特，由这个人工智能创作的许多作品，大家看了都不禁竖起大拇指。


    人工智能画师，由来自美国罗格斯大学、查尔斯特顿学院和加州脸书人工智能研究实验室的科研人员合作研发出这一人工智能系统。这一人工智能画师可以通过观察人类的艺术作品，学习不同的艺术风格，生成更有创造力的作品。


    研究团队进行了一次网络问卷调查，评估人工智能生成作品的创造性。他们选取了 1945 年至 2007 年之间抽象派艺术家的画作以及 2016 年巴塞尔艺术展上展出的作品，将其与人工智能的画作混在一起，此外还添加了
    4 幅旧的生成式对抗网络创作的作品。这些画作交由大众评审进行评判，不标注哪些是由人工智能绘制的。参与调查的对象还需要回答相关的问题，评价每幅作品的复杂性和创意度，并说明是否给他们一些启发，或者提升了他们的情绪。


    调查结果表明，人工智能的作品不仅以假乱真，更是以更高的评分胜过了由人类创作的绘画作品。人工智能的学习过程非常依赖“生成式对抗网络”。在这一网络中存在“生成器”和“判别器”两个神经子网络。基于给定的训练集，生成器会创作一个图像，判别器能够区分训练集图像和生成器制作出的仿造图像，对其进行评判。通过两个子网络的算法组合，人工智能可以一次比一次做得更好，得到的结果不断被优化，人工智能的造诣也就在这样的训练中不断精进。


    艺术人工智能设计团队对这一“生成式对抗网络”进行了一些修改，克服了历史版本的局限性，创造性地生产出更独特且具有较高审美价值的艺术品，将原有创作算法升级为“创造式对抗网络”。这样，人工智能不仅会“临摹”，更可以在真正意义上利用所学到的东西进行独一无二的创作。


    在新的艺术人工智能中，一个生成网络就完成了之前两个子网络的工作，同时，这个生成网络还能够自主创作图像，剩余的工作由判别器网络完成。科学家们选取了 8.15
    万幅 15 世纪至 20 世纪著名的绘画作品，供判别器学习。吸收了这些包罗万象的艺术数据后，判别器网络能够分辨出哪些图像具有艺术性，哪些图像没有什么艺术价值，并可以判定图像是否属于已知艺术风格。人工智能可以扭转图片来模仿莫奈等著名绘画大师的风格。而且，还有一些专用程序来完成这项工作。


    这样，一步一步，人工智能学到的不是怎样画得像人的作品，而是怎样丢掉模仿的影子，创作更有大师潜质、更新奇美妙的独特画作。生成器可以创作出一幅又一幅的图画，既符合判别器的“审美标准”，又与所有现存的艺术风格都大不一样。所以说，人工智能的作品既具有创意，让人眼前一亮，同时也不会太让人难以接受，十分符合大众的艺术审美。


    现在，已经开始有人运用人工智能为画廊创作绘画作品，也有人开始尝试用人工智能学习其他绘画风格，创作 12 分钟的动画电影框架。目前，像这样的创作还十分依赖人类的指导，但是，随着技术的不断进步，人与机器的边界会越来越模糊。


    当人工智能可以像人类一样自如创作时，艺术一定会发生翻天覆地的变化，大家都能从中受益。比如，未来人们或许可以通过人工智能为自制的小视频创作配乐，并适当进行剪辑，人人都能当小导演。人工智能将取代一些作家，选取最引人入胜的主题创作小说，赚取你的眼泪和欢笑。或许，人工智能还能承包你的漫画书，由它为你量身定做属于你的漫画剧情。


    过去那些需要十年磨一剑的事情，借助人工智能将可以迅速地完成，极大地简化人类的工作。在人工智能的协助下，也许我们能够腾出更多的精力去创造更多艺术形式和艺术风格，等我们有了新的发现，再来教给人工智能。智能设计可以通过理性、精确的方式控制和解决现阶段的复杂问题。每次工业生产制造技术升级换代都对设计产生了震动，智能设计也不会例外。从微观层面来看，智能制造对产品设计的设计流程技术实现都将产生影响。它对于工业产品设计的前期调研有更加科学和充分的依据，让设计实现的过程更加理性和精确。智能制造将对设计方法产生重要的影响，这种影响尤其反映在大数据的云计算所带来的设计方案创新和优化方面。宏观地看待设计与智能制造的关系，智能制造对设计的本质和意义有关联。从本质上看，设计与智能制造都是使用有限的资源满足人们越来越多和越来越高的目标。此外，设计所遵循的伦理性和文化身份认同也有重要的价值意义，设计在智能制造的帮助下能够体现文明的适应性。


    ### 8.3.3 人工智能的艺术设计的创作


    对于人类未来的改变，没有任何一种技术或观念如“人工智能”这样受到全球的关注和讨论。几乎所有的学科领域都在谋划如何与人工智能“牵手”以开辟新的疆域。发轫于 19
    世纪中叶的现代艺术设计，一路紧随工业文明和信息文明的步伐，已经习惯于将最新的科技成果转化为设计能量，一次次催生出新的设计内涵和形式。在人工智能的浪潮中，以往设计的范式将面临消解，新的设计范式在悄然建立，在这个过程中，以数字经济为特征的社会环境给设计产业带来的机遇和挑战，势必也将作用于设计教育。


    对于“人工智能”的讨论，最多的是机器将直接取代人工劳动，进而对行业发展趋势产生巨大影响。如果设计界以创造性劳动自居，认为人工智能对设计创造的影响甚微，难免过于乐观。阿里巴巴在
    UCAN 大会上开宗明义地提出“新设计×新商业”的主张，其推出的“鲁班”智能设计平台，已经在去年“双 11”前夕取代了设计师的劳动，成功完成数以万计的电商网页的版式设计。人工智能完成设计作品的技术路径，与其他劳动或服务一样，都是通过深度学习、大数据、云平台、计算能力来完成的指定工作。当机器学会主题的理解、元素的搜集和处理、形式美法则等设计思维活动，并推演为数字化组合时，机器进行自主设计就成为可能。更何况，人与机器在素材库面前是平等的，而对于比例、数据、组合等信息而言，机器的能力强于普通设计师，人工智能可以高效地调用既有的元素、字体、色彩，按照深度学习形成的数据模型，形成多种可供选择的作品。显而易见，大数据支撑下的海量模型、素材、案例，以及
    Adobe 旗下各种设计软件的智能化趋势，将促使人工智能轻松地完成各种类型的设计，如家居设计、标志设计、包装设计等，并达到一定的设计水准。


    如果设计活动可以交由人工智能完成，当人工智能也能交付一件成熟的作品并满足基本的市场需求，设计行业在人工智能的影响下，将参与更高级别的艺术创造。


    未来，世界上大部分国家将告别物质匮乏与贫穷饥饿，进入以生物技术支撑的优质生命、精致体验的幸福经济时代。事实上，以工业化和城市化为主要建设内容的时代也渐行渐远，在未来中国经济建设新常态中，城乡统筹、全域旅游、健康中国、养老产业等新兴主题将逐渐成为发展命题的核心。当幸福产业、幸福经济的发展与建设智能社会、智能经济不期而遇时，人工智能不再是被束之高阁的实验室状态，而是以更快的速度融入社会生产与大众生活中，以智慧家居、智慧教育、智慧旅游、智慧交通等模式，影响社会运行和大众消费的方方面面。其中，设计将以全新的姿态进入人产业的核心领域，活跃于技术研究与市场应用、理性科技与人文情感、功能与体验、商业与美学等范畴之间，体现于个性化的产品、信息的传递、空间体验、系统整合设计等方向中。


    与人工智能同行的未来设计，在带给人类文明惊喜的同时，同样也参与到全人类共同问题的解决，形成升级版的社会创新设计。意大利社会创新设计专家埃佐·曼奇尼（Ezio
    Manzini）曾经说：“过去十年中，互联网、移动电话及社交媒体的普及与社会创新浪潮逐渐交汇融合，催生了新一代服务，这些服务不仅能够为难题提供前所未有的解决方案，还挑战着我们对幸福的理解，以及看待公民与国家间关系的观念。”埃佐·曼奇尼就互联网技术对社会创新设计重要性的理解，在我国是以“互联网+”的战略提出，而“智能+”对“互联网+”的升级悄然而至，在很多领域已形成了成熟的商业模式。世界范围内不同国家的设计院校，不约而同地关注到人类健康医疗问题，以此形成社会创新设计、服务设计的命题，其中对人工智能与用户体验的深度融合，是各个团队探索的主要领域。英国
    Falmouth 大学与康沃尔郡的 Truro 医院展开的“心理健康”设计，吸引了包括中国的江南大学、安徽大学及新加坡、埃塞俄比亚等国家的院校团队的加入，项目发起人布莱恩(Clark
    Bryan)明确提出，以科技领域最新的大数据、云计算的成果，结合心理健康的用户群体及相关者，形成创新性的解决方案。可以预见的是，智慧医疗在未来的广泛运用，一定是生命科学、大数据、云计算等科学技术与设计相通的成果，毕竟，在生命的任何状态下，形态、色彩、肌理、触觉等要素，不可避免地以各种形式真实地呈现在产品、环境和体验之中。


    设计作为创造性的活动，大多在解决问题或给人类带来惊喜两方面提出方案。在人工智能的世界里，任何事物几乎都是一组数据，都可找到算法的推演。如果说，交互设计、界面设计、数字媒体设计等新近形成的设计方向，是人工智能时代到来前的热身准备，那么，人工智能技术催生的新的设计领域将加速建立。以往在形式与功能之间展开的设计讨论，会变得越来越不重要，现有设计学科形成的以工业设计、视觉传达设计、环境设计等专业分类，将难以适应产业转型的需求。在已经形成的服务设计、系统整合创新设计、社会创新设计等内容中，人工智能的渗透使设计与相关学科的协同能力、解决问题的能力变得更为强大。


    ## 8.4 人工智能的艺术创作的案例介绍


    中国工程院院士、中国人工智能学会理事长李德毅认为，如果说 2016 年是人工智能的元年，未来 15 年到 20 年，将是人工智能时代。人工智能给人类带来的影响，可能将远远超过计算机和互联网在过去几十年中对世界造成的影响。近几年发生的人工智能事件就足以让人类咋舌：阿尔法狗战胜了围棋顶尖高手，人工智能机器人“撰写”的小说获得大奖，第一本人工智能诗集已经出版，人工智能机器人已经会书写对联。


    “早春江上雨初晴，杨柳丝丝夹岸莺。画舸烟波双桨急，小桥风浪一帆轻。”谁能想到，这是人工智能以“早春”为关键词创作的一首诗。作者“九歌”，由清华大学计算机科学与技术系孙茂松教授带领学生团队历时三年研发而成。


    在综艺节目“机智过人”中，微软的聊天机器人小冰以一曲中国风歌曲《桃花梦》险胜人类对手。当小冰唱出“茫茫夜雨中，往事如风，耳边桃花笑春风，梦里你我相逢”这般古风浓郁的句子，很多观众以为这是人类的作品。


    写诗、作曲、绘画，人工智能创作的春天已悄然到来。


    ### 8.4.1 人工智能的书法创作


    阿尔法狗打败顶尖棋手李世石之后，人类关于人工智能的讨论又多起来。关于标题所提问题，相信大部分人，特别是书法学习者，被问到这个问题时，会不假思索、信心满怀地回

    '
