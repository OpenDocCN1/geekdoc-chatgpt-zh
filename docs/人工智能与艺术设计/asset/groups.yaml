    ## 8 人工智能与艺术设计


    ### 8.1 艺术设计


    ### 8.1.1 艺术设计的概念


    艺术设计是一门综合性极强的学科，它涉及社会、文化、经济、市场、科技等诸多方面的因素，其审美标准也随着诸多因素的变化而改变。艺术设计，实际上是设计者自身综合素质（如表现能力、感知力、想象能力）的体现。


    艺术来源于生活，反过来又作用于生活。艺术设计不但具有审美功能，还具有实用功能。换句话说，艺术设计首先是为人服务的（大到空间环境，小到衣食住行），是人类社会发展过程中物质功能与精神功能的完整结合，是现代化社会发展进程中的必然产物。


    艺术设计具备独立性和综合性。各个专业虽然对设计知识的着重面不尽相同，但对于“大设计”概念的关于美、节律、均衡、韵律等的要求是一样的。不论是平面的还是立体的设计，首先要面对的是对所设计对象的理解——对设计对象相关的背景文化、地理、历史、人文知识的理解。


    艺术设计还具备思想性和行动性。艺术设计是艺术家把自己的灵感、经验和感觉通过艺术作品的媒介表达出来并且与大众交流的一个过程。艺术创作有三个动机要素，包括对事物的认识、目标意图和欲望冲动。


    ### 8.1.2 艺术设计的相关要素


    艺术设计最大的特点就是服务性。艺术设计的第一动机不是表达，而是对生活方式的一种创造性的改造，是为了给人类提供一种新的生活的可能，不论是在商业活动中的信息传达中的应用，还是日常生活的行为方式中的应用，艺术设计就是让人类获得各种更有价值、更有品质的生存形式，让生活更加简单、舒适、自然、有效率，这是艺术设计的终极目的。艺术设计最终的体现是优秀的产品，这个体现我们从乔布斯和苹果的产品中可以完全感受得到。苹果的设计改变了现代人的行为方式，乔布斯的设计梦想就是改变世界，他以服务消费者为目的，用颠覆性、开拓性的设计活动来实现这一目标。好的艺术设计产品能改变世界，好的艺术品能触动世界，两者是不同的。


    其次，艺术设计的特点就是科学性和合理性。艺术设计的实现手段是理性的，这和艺术品的实现是有区别的，你可以光凭艺术灵感的爆发创作出震撼的艺术品，但你绝不可能光凭借灵感去造出一个好的产品。一个好的产品不是设计者的纯自我的表达，是有严谨的科学精神在里面的，是一个合理统筹的有目的的活动，要把自己的观点和观念通过科学的调查、合理的流程规划一步步地完善出来。中间会经过各种科学的实验，会有各种数据的考量，会有设计师在艺术追求与实际生活需求的各种妥协，艺术设计产品没有绝对的艺术理想的纯粹性，它最终要以人为本，用体验去征服人们。


    艺术设计还是一个综合性的设计活动。任何艺术设计都不是一个或两个学科能够完成的，其实现阶段是一个工业化的过程。纸上的创意只是一个概念的产生过程，一旦要去制作，那就需要各种其他学科理论和技术的支持，靠一个人来完成几乎是不可能的，但是艺术品的创作往往是一个人的事情，人多了反而会阻碍艺术观点的表达。各种材料的研究、电脑技术的应用、数据的整理、工业化的生产以及产品的销售等，都是艺术设计不能绕开的问题，这是个庞大的工程，不是一个人光凭激情就能做到的事，艺术设计师不但要有艺术设计的才能，更要有合作的精神，还有合理统筹整个流程的能力。


    艺术设计的特点就决定艺术设计者不但是个艺术家还是个思想家，更要是个行动家。

    优秀的艺术启发人，优秀的设计激励人；

    优秀的艺术需要诠释，优秀的设计需要领会；

    优秀的艺术是一种品味，优秀的设计是一种观点；

    优秀的艺术是一种天赋，优秀的设计是一种能力；

    优秀的艺术向众人传递着不同的信息，优秀的设计向众人传递着相同的信息。


    ### 8.1.2.1 好的艺术来源于灵感，而好的设计来源于动机


    或许两者最大的差别就在于其创作的目的。原则上来说，艺术创作的流程是从无到有，从一张空白的画布上开始，艺术家将自己的观点或感受表达在作品创作上。他们希望通过与他人分享感受，令观赏者获得共鸣和启示。


    ### 8.1.2.2 好的艺术在于诠释，好的设计在于理解


    虽然艺术家的理念是将一个观点或情感予以表露，但并不仅限于此。艺术通过各种方式和人们联系在一起，因为艺术创作的诠释方式与众不同。商业设计，则完全不同。作为商业化的设计原则，是准确地向受众传递信息，并促使受众采取相应行动。你的网站设计传达给用户的信息和你设想的不一致，那么这和设计的最初需求是不相符的。设计师的作品不仅仅在于视觉享受，更需要让作品中所传达的信息准确地被受众理解和接受。


    ### 8.1.2.3 好的艺术是一种天赋，好的设计是一种技巧


    一个艺术家通常都是需要天赋的。当然，从最开始的时候，艺术家都要学习绘画、不断创作来发展自己的艺术特长。但是，艺术家最本质的价值在于其与生俱来的天赋。可以这么说，好的艺术家一定具有设计技巧，但拥有好的设计技巧却不一定能够成为艺术家。


