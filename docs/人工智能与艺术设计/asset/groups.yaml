    对于递归结构而言，在动态执行过程中，递进的最大层数就称为该递归结构的递归深度。对上述折半算法分析可知，递归算法的计算复杂性与递归深度密切关联，如果表的长度为
    n 的话，那么平均需要计算的递归深度为 log 2n，因此此算法的计算复杂性为 0(log 2n)。显然，折半查找算法的效率要高于顺序查找算法的效率。


