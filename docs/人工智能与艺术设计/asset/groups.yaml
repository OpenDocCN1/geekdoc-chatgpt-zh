    此时,其他需要完成这一过程功能的地方,只需要直接调用这一过程名即可,比如：


    ```

    if(x<=10)then(proceduregreetings(3))

    ```


    就等价于


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )

    ```


    有时候,为了使得伪码可读性更高,在嵌套的语句中,每一层语句的结束都用明显的标识来醒目地加以标记,使用诸如 endwhile、endif 等保留词。比如：


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )

    ```


    写成


    ```

    if(x<=10)then(

    x<-3;

    while(x<=6)do

    (print("hello"));

    x<-x+1)

    )endwhile

    )endif

    ```


    使得伪码的嵌套层次更加一目了然。


