    如图 4 - 18 所示，语音识别是通过识别或理解过程把语音信号转换为相应的文本文件或命令的高技术。作为一个专门的研究领域，语音识别是一门涉及范围很广的交叉学科，与计算机学科、信号处理学科、数理统计学、声学、语音学、语言学、神经生理学等有密切的关系。


    ![](img/f188b68deb37acb6105ba97c814d9af2_108_0.png)


    # 图 4 - 18 语音识别系统基本流程图


    语音识别起始于 20 世纪 50 年代，20 世纪 60 年代末和 70 年代末是语音识别的发展阶段。这一阶段是语音识别最重要的发展阶段：一是当时苏联的 Vintsyuk
    首次提出用动态规划(DP)方法解决语音信号不等长问题，并在此基础上发展而来的基于动态规划(DP)的动态时间规整算法(DTW)；二是语音信号的线性预测编码(LPC)，有效地解决了语音信号的特征提取。该阶段研究的特点是以孤立字语音识别为主，通常把孤立字作为整体建立模板。20
    世纪 90 年代以后，语音识别在细化模型的设计、参数提取和优化、系统的自适应方面取得了一些关键进展，语音识别技术进入高速发展时期，并且在某些领域已经成熟并产品化。语音识别技术成熟的同时也开始与其他领域相关技术进行结合，如与自然语言处理技术结合产生了基于口语识别和理解的人机对话系统等。NIST
    评测也逐步从朗读语音到广播语音、自然对话语音、电话语音，发展到目前的真实场景的会议语音，这对语音识别技术的发展起到了推动作用。


    我国语音识别研究工作起步较晚，但是发展非常迅速，同时研究水平也从实验室逐步走向实用。目前来说，在汉语的非特定人、大词汇量连续语音识别方面，国内科研机构与国际先进水平差距不大；在语音技术产品化和商业化方面，已经有语音识别相关产品问世。非特定人、大词汇量连续语音识别系统基本包括前端处理、声学比对、语言解码等，如图
    4 - 18 所示。


    其中，前端处理完成的基本任务就是特征提取和归一化，在广播语音或电话语音等大段语音处理中，还需要做相应的前端预处理工作，切分成语音片段输入人。声学比对和语言解码也就是搜索和解码，是整个识别系统的主要算法所在，主要采用
    Viterbi 等动态规划方法，搜'
