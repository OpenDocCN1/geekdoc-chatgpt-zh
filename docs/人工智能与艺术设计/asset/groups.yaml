    # 2.2.5 其他感觉结构与功能


    感官是感受外界事物刺激的器官，包括眼、耳、鼻、舌、身等。大脑是一切感官的中枢。眼睛是视觉，耳朵是听觉，鼻子是嗅觉，舌头是味觉，身体各个部位是触觉。人体的五大感官为人的生活提供了很多便利，除了熟知的五大感官外，还有另外的感觉系统在发挥着作用，比如保持身体的平衡，饥饿的感觉等，有约
    20 多种感觉系统。


    +   1. 平衡感

    +   站立或行走时不会摔倒，这要归功于平衡感。平衡感是由内耳的淋巴液控制，同视觉相互配合，使人能安全地四处走动。不停地转圈，就会使这一系统无法正常工作，导致眩晕并失去平衡。


    +   2. 本体感受

    +   当我们闭上眼睛抬起手，不用去看我们也知道手在什么位置。这就是本体感受在起作用，它让我们无须去看就知道身体各部位所在。这听起来似乎没多大用处，但是如果没有这一感官，人们需要不停地低头看脚才能行走。查酒驾时，警察也会测试本体感受。


    +   3. 热觉感受

    +   坐在篝火旁，人们可以感觉到热。从冰箱里拿出一块冰，人们能感受到冷。皮肤上的热感受器能感知温度变化。以前，探知冷热的能力被归类到触觉之下。不过，人们无须接触某物去感受它的热度（如坐在篝火旁，无须接触，我们就会感觉到热），因此热觉感受单独是一种感官。大脑内的热感系统能探知并控制核心体温。


    +   4. 疼痛感

    +   这一感官可以感知疼痛。约翰・霍普金斯大学感官生物学中心副主任保罗・福克斯表示，伤害感受同热觉感受常被混在一起，因为某种程度上，这两种感觉都利用到相同的皮肤神经元。伤害性感受器不仅分布在皮肤上，在骨头、关节和内脏等处都有分布。


    +   5. 内部感受

