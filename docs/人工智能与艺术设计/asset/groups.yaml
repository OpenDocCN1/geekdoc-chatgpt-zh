- raw:
  - '[PAGE 50]


    人艺术家自身对人生的理解，对社会事物的态度和理性认识的外化和彰显。鲁迅先生就曾说过：“画家所画的，雕塑家所雕塑的，表面上是一幅画、一座雕像，其实是他的思想和人格的表现。”另外，艺术家从事创作活动中的理性思维，在把握时代氛围，遴选素材和题材，构思主题和情节，选择表现形式等方面均具有举足轻重的作用。艺术活动是形象把握与理性把握的有机统一。


    # 2. 情感体验与逻辑认知的统一


    艺术中的情感即审美的情感，是一种无功利的具有人类普遍性的情感。情感在艺术活动的生成、创造与接受过程中均是重要的因素之一。同时，情感又是艺术创作的基本元素。艺术活动总是伴随着情感，这是欲望、兴趣、个性的具体的心理表现，也是对对象能否满足自身欲望的价值评判。俄国作家列夫·托尔斯泰就曾在他的《论艺术》中指出：文艺创作是艺术家“在自己的心里唤起曾一度体验过的感情并且在唤起这种感情之后，用动作、线条、色彩、声音及言词所表达的形象来传达出这种感情，使别人也能体验到同样的感情——这就是艺术活动”。情感主宰着艺术活动的整个过程，贯穿在艺术创作的整个心理过程之中。艺术活动中的“感觉”，受到“享受”的欲望的支配，总是被对象能引起自己愉悦的色彩、声音所吸引；艺术活动中的“知觉”往往按照情感的需要去选择并加工对象，按照情感方式去选择与“判断”对象；艺术活动中的“想象”，按照主体的情感要求的走向去创造合乎自己情感和目的的形象。艺术活动中的“理解”往往是一种个性化的体认与感悟，通过体悟获得对生命与人生意义的深切理解，这无疑是一种饱含着情感的活动。


    艺术家的情感往往通过艺术形象得到充分的展现，艺术家反映生活，描绘艺术形象，绝不是冷漠的、无动于衷的，而是凝聚着他的思想情感、爱憎褒贬，渗透着他的审美情趣、审美理想。1937年4月，德国法西斯的40多架飞机对西班牙巴斯克文化名城格尔尼卡进行狂轰滥炸，激起了绘画大师毕加索的强烈义愤，他在短短的一个月时间内就完成了那幅名垂画史、伸张正义与控诉罪行的力作《格尔尼卡》。在审美以及艺术创造和艺术欣赏活动中，情感不仅与形象联系在一起，也同认知联系在一起，是随着审美认知而产生的一种特殊的心理现象，其基础是审美认知。经过审美认知及其复杂的思想活动，生活中的美才能被发现、被感悟。


    一个思想空虚，缺乏对社会与人生深刻认识的人是难以产生丰富、强烈的审美情感的，因而也就不会成为优秀的艺术家和出色的欣赏者。在艺术活动中，情感与思想认知是交融在一起的。没有情感的说教不是艺术，没有思想的情感也不能产生艺术，真正的艺术活动是情感体验与逻辑认知的统一。


    # 3. 审美活动与意识形态的统一


    艺术的审美特性是区别于其他社会实践活动的根本标志。所谓审美特性，是指艺术作品所具有的美学品质和审美价值。艺术作品是艺术家审美理想的结晶，是美的创造的结果。它不仅以情动人，更以美感人，使人得到一种精神上的愉悦享受。艺术作品中的形象由于集中、浓缩了生活中的形象美，因此比生活中实际存在的事物的形象更具有形而上的审美特性。中国传统绘画中的梅花形象，往往老干虬枝，横斜逸出，凌寒傲霜，迎春怒放，体现了一'
  - '[PAGE 51]


    种老树新花，青春勃发的审美内涵，使人产生比观赏生活中的梅花更丰富的美感。艺术作品表现生活中美的形象，使之更加突出顺畅，表现生活中的丑，同样可以化生活丑为艺术美。艺术家在作品中，通过对生活丑的嘲讽和鞭答，充分暴露出其丑恶的本质，引起人们对丑的厌恶与鄙视，从而去消灭丑、根除丑，并激发起人们对美好事物的憧憬与向往，此时的生活丑也就具有了一定的美学意义与价值。譬如，以反腐倡廉为题材的艺术作品，通过对腐败现象的暴露和批判，充分揭示了社会腐朽现象对社会主义建设的危害性，并给世人以警示，达到了化腐朽为神奇的震撼力，使欣赏者获得了一种特殊的美感。


    艺术不仅是一种审美的活动，具有审美特性，而且属于上层建筑中的意识形态，具有意识形态性质。归根结底，艺术是人对世界的一种精神把握的方式，人们通过艺术达到对世界的认识，也包含着人对自己的认识。而且，艺术中的审美性是其最根本的本质属性，其意识形态特征则是隐藏在审美特性之中的，它使艺术的审美世界具有了更为广阔和深邃的内涵。因此，我们说艺术活动是审美活动与意识形态的统一。


    # 2.3.3.2 哲学


    哲学是对基本和普遍问题的研究，按其原语词源有“爱智慧”之意。哲学是有严密逻辑系统的宇宙观，它研究宇宙的性质、宇宙内万事万物演化的总规律、人在宇宙中的位置等一些很基本的问题。


    哲学就是元知识、元理学，即所谓大道至简。哲学的任务就是对现实世界进行元理层面的把握，把多综合为一或把一区分为多，一和多都是元理。元理也要清晰表达、系统构造，这样的元理系统才适用于阐释世界或指导实践。哲学是元理，科学是原理、方法、事实，元理与原理划分并非绝对，实用依据可以是：元理是需要时刻记着即时可用的元初理论，原理是可以查工具书利用的基础理论。


    # 1. 哲学的基本问题


    哲学根本问题又称哲学的基本问题、哲学的最高问题，它是指思维和存在、意识和物质的关系问题。恩格斯在 1886 年写的《路德维希·费尔巴哈和德国古典哲学的终结》一书中第一次对此做出了明确表述。它提出区分唯物主义和唯心主义两种对立的哲学体系、哲学派别并对它们的客观评价提供了正确的标准。


    +   （1）思维和存在、意识和物质何者为本源的问题。对这一方面的问题历来有两种根本不同的回答，由此在哲学上形成了唯心主义和唯物主义两大阵营、两个基本派别、两条对立的路线。凡是认为意识是第一性的，物质是第二性的，即意识先于物质哲学派别属于唯心主义；凡是认为物质是第一性的，意识是第二性的，即物质先于意识哲学派别属于唯物主义。除了这两种根本对立的回答外，还有一种回答，认为物质和意识是两个独立的、互不依赖的本原，持这种观点的哲学流派属于二元论。


    +   （2）思维和存在的同一性问题。对这一方面的问题，绝大多数哲学家，包括唯物主义哲学家和一些唯心主义哲学家都做了肯定的回答。唯物主义和唯心主义对这个问题的解决在原则上是不同的。唯物主义承认物质世界及其规律的客观存在，承认思维是存在于反映的基础上，承认世界是可以认识的；唯心主义则把客观世界看作思维、精神的产物，认为认识世'
  - '[PAGE 52]


    界就是精神的自我认识。也有一些哲学家如 D.休谟和 I.康德，否认认识世界的可能性，或者否认彻底认识世界的可能性，为哲学史上的不可知论者。


    # 2. 哲学的延伸


    (1) 唯物主义：将世界的本源归结为物质，主张物质第一性，意识第二性，认为意识是物质的产物，具体又分为古代朴素唯物主义、近代形而上学唯物主义与辩证唯物主义。该流派哲学一直强调感官认知与理性推理及客观证据，由于自然科学发展的局限，该流派在关于世界起源的问题上仍不完善，有待进一步发展。


    (2) 唯心主义：将世界的本源归结为精神，主张意识、理念（法则）等第一性，物质第二性，物质是意识的产物。唯心主义十分复杂，大体可以分为主观唯心主义和客观唯心主义两类，主观唯心主义主张个体意识第一性，客观唯心主义主张客体意识第一性。


    (3) 可知论：认为世界是可以被认知的，认为人可以凭借感觉器官及其延伸（科学仪器）完全认知世界，而至今尚未被认知的部分只是由于技术的不发达，人完全认识世界是必然。


    (4) 不可知论：认为世界是不能被认知的或不能被完全认知，此处的不能被完全认知并非“尚未被认知”，而是指世界的某些部分或某些层面，人类是永远无法知道其真相的。“概念世界”是研究不可知论时不可不提的概念。


    (5) 二元论：认为世界的本源是意识和物质两个实体，试图调和唯物主义和唯心主义的哲学观点。二元论主张世界有精神和物质两个独立本源的哲学学说，它和一元论相对立。


    (6) 知识论：除了包含唯物、唯心、二元等思想的本体论外还有知识论，知识论分为经验主义和理性主义两个对立学说。


    # 2.3.4 情感与行为的表现


    # 2.3.4.1 情感的表现


    +   1. 情感的定义


    情感是态度这一整体中的一部分，它与态度中的内向感受、意向具有协调一致性，是态度在生理上一种较复杂而又稳定的生理评价和体验。情感包括道德感和价值感两个方面，具体表现为爱情、幸福、仇恨、厌恶、美感等。


    “情感是人对客观事物是否满足自己的需要而产生的态度体验”。同时一般的普通心理学课程中还认为：“情绪和情感都是人对客观事物所持的态度体验，只是情绪更倾向于个体基本需求欲望上的态度体验，而情感则更倾向于社会需求欲望上的态度体验。”但实际上，这一结论一方面将大家公认的幸福、美感、喜爱等较具有个人化而缺少社会性的感受排斥在情感之外，另一方面又显然忽视了情绪感受上的喜、怒、忧、思、悲、恐、惊和社会性情感感受上的爱情、友谊、爱国主义情感在行为过程中具有的交叉现象，例如一个人在追求爱情这一社会性的情感过程中随着行为过程的变化同样也会有各种各样的情绪感受，而爱情感受的稳定性和情绪感受的不稳定性又显然表明了爱情和相关情绪是有区别的。基于这两点，将情感和情绪与基本需要、社会需求相区别，或者是将情感和情绪这两者混为一谈显然都是不合'
  - '[PAGE 53]


    适的。


    # 2. 情感的需求


    从需求层次角度来讲情感也是人的一种需求，这种需求也分三个阶段：


    第一个阶段，温饱需求。在这个阶段人的情感需求是一种渴望交流和认可的一种状态；人在无助的时候和在接触新环境的时候这种情感最强烈。


    第二个阶段，社会需求。一个人在社会中作为一个个体来讲，他有他的社交圈，他和外界沟通的同时就是一种情感的释放，当外界对这种释放给予肯定时情感就为正，心情就好，反之就不好。


    第三个阶段，自我需求。在这个阶段，人基本是控制情感的。因为他们对情感有了更深的认识，在这个认识的基础上去帮助其他人平衡因情感引发的一些问题。比如：心理专家等。


    情感从需求来讲可以分为三个阶段，但这三个阶段是随着外界的条件和你自身的修养等这些必要的因素而随时转换的，换句话说也就是一个人在不同的时间和空间内可能处在情感需求的一个或多个阶段。不管身份地位如何，贫穷或富有，需求不同，每个人的情感也不会相同。


    # 3. 情感的表达模式


    根据价值目标指向的不同，人的情感表达模式可分为对物情感、对人情感、对己情感以及对特殊事物的情感四大类。


    +   (1) 对物情感


    一般事物对于人的价值(严格地讲应该是价值率)是一个变量，它有两种变化方式：一是价值增加(包括正价值增大或负价值减小)；二是价值减少(包括正价值减小或负价值增大)。根据事物价值的不同变化方式和变化时态，对物情感的形式也有所不同。


    +   (2) 对人情感


    对他人的情感不仅与他人价值的变化方式和变化时态有关，而且还与他人的利益相关性有关。根据他人价值的不同变化方式、变化时态和利益相关性，对人情感的形式也不同。


    +   (3) 对己情感


    人对自己的情感取决于自身价值的变化方式和变化时态。根据自身价值的不同变化方式、变化时态，对己情感的形式也不同。


    +   (4) 对事物情感


    有些事物具有某种特殊的价值意义，从而引发人的某种特殊情感。


    # 2.3.4.2 行为的表现


    +   1. 行为的心理学定义与特征


    +   (1) 行为的心理学定义


    在心理学层面上，行为是有机体在各种内外部刺激影响下产生的活动。不同心理学分支学科研究的角度有所不同。生理心理学主要从激素和神经的角度研究有机体行为的生理机制；认知心理学主要从信息加工的角度研究有机体行为的心理机制；社会心理学则从人际'
  - '[PAGE 54]


    交互的角度研究有机体行为和群体行为的心理机制。心理学研究的不同时期，对行为有不同的理解。20 世纪上半叶，行为主义心理学派指人与动物对刺激所做的是一切可以观察和测量到的反应，并试图用“刺激－反应”公式加以描述。人的内部心理活动也被视为一种特殊的语言行为。20
    世纪 60 年代后，大多数心理学家将内部心理活动与外显行为区别开来，试图从信息加工的角度描述心理活动的状态和过程，以此解释各种外显行为发生和发展的规律。认知心理学已能解释人的大部分以后天习得为主的智能行为，这些行为涉及问题解决、学习、决策以及直觉等许多方面；那些以先天遗传为主的本能行为，则在生理心理学中得到较为合理的解释。


    # (2) 行为的社会分类


    根据产生的原因，行为可分为个体行为和群体行为；根据行为的功能，分为摄食行为、躲避行为、性行为和探究行为。而行为就目标与动机在意识中的明确性与能动性程度，又可分为意志行为、潜意识行为和娱乐消遣行为三种。


    # ① 意志行为


    意志行为是指人们有明确动机目标的行为。按照个人行为动机与整体长远目标是否统一，又可分为有积极主动动机的士气性行为和无积极主动动机的非士气性行为。所谓积极主动性就产生过程来讲是指个体动机与行为的整体长远目标的统一程度，它包括个体目标与群体目标的统一程度、战术目标与战略目标的统一程度、短期目标与长远目标的统一程度等。


    # ② 潜意识行为


    潜意识行为是指人们具有明确目标但无明确动机的行为，即人们老想做但又不知道为什么要这样做的那些行为。潜意识是指人们平常被压抑的或者当时知觉不到的本能欲望和经验。潜意识中的内容由于不被人们的道德价值意识和理智所接受，所以只有通过各种各样伪装的形式表现出来，像梦境就是个人在清醒时不能由意识表达的压抑的欲望和冲动的表现，但做梦不是行为，只是大脑这个身体机体的动作。潜意识行为在行为中表现为两个方面：一是口语流露与不经意的笔误等行动；二是神经性症状，即过分强烈的潜意识形成的变异行为，它包括压抑、反应形式、投射、文饰作用、升华等。


    # ③ 娱乐消遣行为


    娱乐消遣行为是指人们有明确动机但却无明确目标的行为，即是指那些总是想去做但却不在乎甚至不知道怎么做以及会做到什么程度的行为。比如一个人具有娱乐休闲动机时，如果他自己觉得看电影、看电视、跳舞等目标都能满足这个动机，那么他对娱乐消遣目标的选择只有随意性，而没有必须性。娱乐消遣行为按照其不同的娱乐消遣性质，可分为寻求美感的欣赏行为和寻求刺激的消遣行为两种。娱乐消遣心态表现为情趣、情调和爱好三个方面统一协调性，例如集邮就是人们对邮票知识内容的情趣，观赏邮票的情调以及对精美邮票的爱好相互统一后组成的。


    娱乐消遣行为简单地说也就是所谓“玩”的过程，是一种对自身乃至外界各种事物发展变化进行研习与欣赏的过程。它包括各种非职业性的主动参与的体育竞赛活动、绘画、唱歌'
