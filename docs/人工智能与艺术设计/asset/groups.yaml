    如果中枢发生抑制，则中枢原有的传出冲动减弱或停止。在实验条件下，人工刺激直接作用于传入神经也可引起反射活动，但在自然条件下，反射活动一般都需经过完整的反射弧来完成，如果反射弧中任何一个环节中断，反射即不能发生。


