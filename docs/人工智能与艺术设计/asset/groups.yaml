    中国版本图书馆 CIP 数据核字(2019)第 193913 号


    # 内容简介


    人工智能是研究开发用于模拟、延伸和扩展智能的理论、方法、技术及应用系统的一门新的技术科学。人工智能与艺术相结合可以改变艺术的形态，艺术的制作方式、艺术的感受力；同时也会影响人们的生活方式。全书从人工智能的概念、发展历程、学科展望开始，介绍人的智能行为产生的生理基础，人工智能的基础算法理论，以及模式识别、深度学习的理论，最后讲述人工智能的应用——智能社会、智能艺术。希望能为大学生及广大爱好者提供参考。


