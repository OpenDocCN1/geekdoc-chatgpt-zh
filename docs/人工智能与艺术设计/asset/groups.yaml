    # 图 4-2 语音识别原理框图


    可以看出语音识别系统实质上是一种模式识别系统，与常规模式识别系统一样包括有特征提取、模式匹配、参考模式库等三个基本单元，它的基本结构如图 4-3 所示。语音识别的步骤分为三步。第一步是根据识别系统的类型选择一种识别方法，采用语音分析方法分


