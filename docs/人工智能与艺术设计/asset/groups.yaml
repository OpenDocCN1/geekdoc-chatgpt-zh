  - '[PAGE 138]


    内啡肽，是一种内成性（脑下垂体分泌）的类吗啡生物化学合成物激素。它是由脑下垂体和脊椎动物的丘脑下部所分泌的氨基化合物（肽）。它能止痛和使人产生欣快感。容易在体育运动中分泌，它可以改变一个人所有的负面情绪，让你充满活力、改变对自我的认知、变得积极向上，甚至可以改变你的外表、影响周围的人和环境。


    跑步者的愉悦感是指当运动量超过某一阶段时，体内便会分泌内啡肽。长时间、连续性的、中量至重量级的运动，深呼吸也是分泌脑内啡肽的条件。这也是跑步能够改变人的精神状态的原因，使人感到“更加幸福”。


    跑步能够提高人的毅力又是怎么回事呢？


    多巴胺系统功能包括奖赏、动机。多巴胺系统使人产生欲望进而产生行动，所以多巴胺是人大多数行为的内在原因。而这，也包括我们大多数的“欲望”行为。比如：很多人对美食的忍耐力很低，为什么？因为美食的多巴胺水平是
    150%，比一般行为的多巴胺水平高出了 50%，所以很多人难以忍受美食的诱惑。同样，对于尼古丁的多巴胺刺激水平则是 170%，所以很多人对香烟上瘾、难以戒除。


    为什么运动能提高人的毅力？既然已经知道欲望的产生来源于多巴胺，那么怎么才能解决呢？


    其实能够诱导多巴胺产生的行为不仅仅只有美食、香烟等，还包括运动。在对小鼠的实验中发现：“不同运动强度时，大鼠伏状核多巴胺会发生变化，步行和跑步时伏隔核细胞外液中二羟苯乙酸（DOPAC）和高香草酸（HVA）含量均显著增高，提示运动时伏隔核的多巴胺释放增加，并且跑步组的
    DOPAC 含量较步行组显著增加，多巴胺也表现为增高趋势，说明运动时伏隔核的多巴胺释放程度与运动强度有关”。还有，“运动训练可以导致脑中多巴胺含量的变化，这可能与运动的强度有一定关联。”


    在长期的运动中，人体的多巴胺水平会不断提高，而内啡肽则用于满足多巴胺的“欲望”。所以不断的运动造成的多巴胺水平的提高，也可能会提高人体对于多巴胺的耐受水平。


    情绪对内分泌系统有何影响？


    当人在激动、愤怒时，在大脑皮层调控下便产生交感兴奋效应，同时肾上腺髓质在交感神经系统支配下，大量释放儿茶酚胺类激素，以上概括称“交感—肾上腺髓质”系统。该系统活动的结果，加强了循环呼吸活动，增加骨骼肌的血液供给，同时抑制消化运动和分泌。


    下丘脑神经元分泌神经激素“促肾上腺皮质激素释放激素（CRH）”，经垂体门脉达腺垂体，促进腺垂体分泌“促肾上腺皮质激素（ACTH）”。该激素经血运达肾上腺皮质，促进其分泌皮质激素，皮质激素促进糖、蛋白及脂肪的动员，同时加强了机体对有害刺激的抵抗力。


    交感兴奋可直接促进甲状腺分泌和抑制胰岛的分泌，因而血糖升高，全身代谢活动加强。甲状腺素增多反过来又进一步增强了脑的兴奋，属反馈效应。


    # 6.2 人体行为的仿真


    随着工业社会的发展，越来越多的人从事着机械性的工作，枯燥的工作使得人们渴望从'
