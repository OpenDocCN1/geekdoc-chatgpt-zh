    随着人工智能技术的迅速发展，停留在传统设计领域的设计师岗位将会逐渐被机器所替代。但是，艺术设计也并不是所有的工作都被机器所取代，那些注重创意的内容将仍然是机器无法做到的。艺术家与设计师需要更多地思考艺术与设计中无形的东西，创意和创造力将会成为设计师的最核心的竞争力。人工智能背后强大的计算能力，可以帮助设计师更好地利用历史数据研究人的需求，通过设计帮助人解决问题，使用数据去辅助设计思考。


    随着数字时代的来临，人们生活在一个复杂的环境中，有越来越多的物质需求和精神需求。社会带来很多的资讯，这些信息将人们推到了一个被动的角度去接受新的技术、新的产品、新的数字生活。思考数字设计中的美学和智慧，需要重新站在自己的角度去看待这个时代，感受这个时代的生活。人工智能可以为人类带来什么？不仅是设计越来越多的产品让城市生活更加高速和快捷，更是让人类可以用创新思维和情感思维去重新理解自己对于生活的终极需求，从而设计出更符合人类需求的艺术品或者产品。


    # 8.2.3 艺术设计的理性与非理性行为


    正确的逻辑思维是一切设计的起点，思维和逻辑是人们在专业领域披荆斩棘的法宝，在创意里也是一样。当我们在学习设计的基础知识时，也可以说是培养设计的思维，其中的逻辑思维是指人们从感性认识上升到理性认识的变化，它是以概念、推理、逻辑分析等方式为基础的，是对客观现实的认识变化进行能力的体现。将人的认知能力、推导能力充分地发挥出来，使创意得以产生，使思维变得更加严谨、有序，并且富有一定的逻辑性。一般在创意设计中，思维具有感性和理性的特征，逻辑思维是实现设计师创意的有效途径。


    大多数没能成功的设计基本上都是由于在主要问题点上没有进行很好的处理，这也正是由于设计者的逻辑思维不合理，对事看得不透彻，使重点没有突出出来，使得设计效果不理想。在创意设计中，逻辑思维能力是非常关键的。创意设计的主要工作就是为了使人们的某种物质需求得以满足，而且在满足需求的过程中使人们在情感和审美上的需求得到满足。艺术设计的动力主要来自创意这一思维形式，只有科学的、合理的思维方式才能使创意性思维得以有效地进行。在设计思维过程中，也时常有一些问题比如传统思想、观念等，会对设计创新产生一定的影响。这时，我们可以采取逻辑思维的方法，对问题进行分析、推理，最终使结论形成。


    第一，设计的前提就是对问题进行分析。例如图案中的写生，倘若不能将对象的特点和典型动态掌握，就进行分析和总结，是没有办法将事物的本质特点和突出特点抓住的，不是毫无章法，就是单一枯燥。在一个设计作品中，整体与局部之间，局部与局部之间都是不断变化的，而且是有一定的规律的。形象、线条以及空间等，在视觉上都要有一定的比例，既不可以靠得太近，也不可以太过分离，即使不像数学学科那么严谨，也要在视觉和心理上达到一定的要求。所以，在视觉上对于图形、色彩的分析，必须利用大脑对其进行选择，才能将艺术设计的核心内容掌握。


    第二，逻辑思维方法的第二个阶段就是对问题进行研究。设计想法不会只进行一次就能将构思实现，它必须在经过详细分析之后，还必须进行研究和探索，将各类知识综合在一'
