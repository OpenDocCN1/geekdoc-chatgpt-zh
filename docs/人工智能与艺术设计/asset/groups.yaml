    \ 登录注册后，即可拥有一键生成、智能创作、智能排版、设计拓展四种智能设计能力。\n\n根据阿里巴巴官方预测，这将大大降低商家和企业的设计成本，预计每张设计图的价格是人工设计的\
    \ 10%。\n\n如果将“鲁班”利用 AI 设计的原理拆分来看，它的工作流程有点类似于排列组合。浅显地说，设计师制作海报的过程本身是一个元素叠加的手艺，拿常见的促销海报来说，大多是商品商标与实物、字体(如：满200减20)以及部分修饰花纹的组合，又因为不同的设计师风格不同，加之结合不同的促销场景、商品类型，海报自然有千变万化的展现方式。\n\
    \n因此，“鲁班”的智能 AI 系统就将设计流程拆分为三个核心模块，分别是：规划网络、行动器以及评估网络。\n\n其中，规划网络来源于设计师的创意设计模板和基本元素素材；行动器则是“鲁班”收到的设计需求；评估网络的工作原理是输入大量的设计图片和评分数据后，训练“鲁班”学会判断设计的好坏。\n\
    \n也就是说，“鲁班”在过往两年处理 10亿张海报后，已经“学习”了千万设计师的作品，最终转化为 AI 审美能力，从而输出给商家或者企业。\n\n这并不容易。传统意义上的内容推荐算法是根据点击等行为判断喜好，但到了广告海报设计，人类通过视觉达成的审美系统更为主观，也更难被\
    \ AI 与机器代替。\n\n为了完善 AI 机器人在设计领域中有关色彩、审美、认知学等知识图谱，“鲁班”项目在平面设计美学量化评估方面联合了清华大学，在设计知识图谱方面与浙江大学正在展开合作。\n\
    \n在清华大学计算机系人机交互研究所所长史元春看来，“鲁班”之所以具备审美能力，一方面是基于阿里巴巴已有的消费者行为为数据，为算法提供了可被验证的参考标准；另一方面，清华大学也在基于主观审美的算法构建中，引入了多种心理认知的量化试验手法，将人的个性变成机器算法。\n\
    \n在收费模式上，作为 SaaS 系统的“鲁班”并没有使用常见的年费模式，而是按照生成图片的数量计费，具体价格方面，阿里巴巴批量合作的供应商设计一张促销海报的价格大概是\
    \ 120元，而 AI 设计师“鲁班”设计的海报的价格则为十几元。\n\n“预计‘鲁班’可以达到阿里巴巴 P6 设计师的水平。”在阿里巴巴，P6 相当于市面上的高级设计师，是可以担纲中等设计项目的主创人员。设计圈培养一名人类高级设计师通常耗时十年，而“鲁班”从\
    \ 0 到 P6，只用两年左右的时间。\n\n同时，“鲁班”项目将开放训练机器的创作端，推出“驯鹿”计划，邀请行业内优秀设计师来训练机器，驯养属于自己的“鲁班”。未来，“鲁班”将在设计师的指导下学会各种设计风格，甚至能帮设计师接活赚钱。比如某位设计师擅长激光风格的海报设计，就可以将这些风格内容输入进系统，最终由机器将一张激光风格的海报生成近似的\
    \ 10张、100张，然后在平台建立分佣机制，让商家来对接需要的设计师。\n\n而在单纯的海报图片展示以外，阿里巴巴还与浙江大学合作，推出一款可以将图文内容自动生成短视频的\
    \ AI 机器人：Aliwood。这也是阿里巴巴在基于阿里云的商用落地场景上的另一种尝试，目前淘宝有数以十亿计的商品，已经实现视频化的还远远不足 1%，而通过视频对商品进行动态展示使用户在线上购物场景的页面分享率提升\
    \ 40%，加购转化率上升 18%。\n\n## 参考文献\n\n- [1] 周飞.人工智能数字绘画的艺术性思辨.湖北经济学院学报(人文社会科学版),2017,14(7)：14-18.\n\
    - [2] 惟恐.设计让未来更近一点——智能制造：设计的未来之门.艺术与设计,2016(9)：24-29.\n- [3] 鹿丹.人工智能拿下艺术创作.百科新说,2018(3).\n\
    - [4] 王蕴红.人工智能技术与艺术的整赏创作.中国人工智能大会(CCAD).2017.\n- [5] 付志勇,周煜瑶.人工智能时代的设计变革.中国艺术.2017(10)：56-61.\n\
    - [6] 蒋丽娜.理性与感性——论设计表现与艺术表现的教学对比.艺苑(艺术教育研究),2015(1)：106-108.\n- [7] 杨晓芳.非理性思维在设计创新中的作用.赤峰学院学报(自然科学版).2015.31(5)：158-159.\n\
    \n## 附录：阿西洛马人工智能原则\n(Asilomar AI Principles)\n\n以 2017 年 1 月初举行的“Beneficial AI”会议为基础，建立起来的“阿西洛马人工智能原则”，名称来自此次会议的地点——美国加州的阿西洛马市(Asilomar)，旨在确保\
    \ AI 为人类利益服务。本次会议参加者是业界最负盛名的领袖，如 DeepMind 首席执行官 Demis Hassabis 和 Facebook AI 负责人\
    \ Yann LeCun 等。全球 2000 多人，包括 844 名人工智能和机器人领域的专家已联合签署该原则，呼吁全世界的人工智能领域在发展 AI 的同时严格遵守这些原则，共同保障人类未来的利益和安全。\n\
    \n这一系列原则目前共 23 项，分为三大类，分别为：科研问题（Research Issues）、伦理和价值（Ethics and Values）、更长期的问题（Longer-term\
    \ Issues）。具体如下：\n\n### Research Issues 科研问题\n\n- (1) Research Goal: The goal of\
    \ AI research should be to create not undirected intelligence, but beneficial\
    \ intelligence.\n  研究目的：人工智能研究的目标，应该是创造有益（于人类）而不是不受（人类）控制的智能。\n\n- (2) Research\
    \ Funding: Investments in AI should be accompanied by funding for research on\
    \ ensuring its beneficial use, including thorny questions in computer science,\
    \ economics, law, ethics, and social studies, such as:\n  研究经费：投资人工智能应该有部分经费用于研究如何确保有益地使用人工智能，包括计算机科学、经济学、法律、伦理以及社会研究中的棘手问题，比如：\n\
    \  \n  How can we make future AI systems highly robust, so that they do what we\
    \ want without malfunctioning or getting hacked?\n  \n  如何使未来的人工智能系统高度健全(“鲁棒性”)，让系统按我们的要求运行，而不会发生故障或遭黑客入侵？\n\
    \  \n  How can we grow our prosperity through automation while maintaining people’s\
    \ resources and purpose?\n  \n  如何通过自动化提升我们的繁荣程度，同时维持人类的资源和意志？\n  \n  How can\
    \ we update our legal systems to be more fair and efficient, to keep pace with\
    \ AI, and to manage the risks associated with AI?\n  \n  如何改进法制体系使其更公平和高效，能够跟得上人工智能的发展速度，并且能够控制人工智能带来的风险？\n\
    \  What set of values should AI be aligned with, and what legal and ethical status\
    \ should it have?\n  人工智能应该归属于什么样的价值体系？它该具有何种法律和伦理地位？\n\n- (3) Science-Policy\
    \ Link: There should be constructive and healthy exchange between AI researchers\
    \ and policy-makers.\n  科学与政策的联系：在人工智能研究者和政策制定者之间应该进行有建设性的、有益的交流。\n\n- (4) Research\
    \ Culture: A culture of cooperation, trust, and transparency should be fostered\
    \ among researchers and developers of AI.\n  科研文化：在人工智能研究者和开发者中应该培养一种合作、信任与透明的人文文化。\n\
    \n- (5) Race Avoidance: Teams developing AI systems should actively cooperate\
    \ to avoid corner-cutting on safety standards.\n  避免竞争：人工智能系统开发团队之间应该积极合作，以避免安全标准上的漏洞。\n\
    \n### Ethics and Values 伦理和价值\n\n- (6) Safety: AI systems should be safe and secure\
    \ throughout their operational lifetime, and verifiably so where applicable and\
    \ feasible.\n  安全性：人工智能系统在它们整个运行过程中应该是安全和可靠的，而且其可应用性和可行性应当接受验证。\n\n- (7) Failure\
    \ Transparency: If an AI system causes harm, it should be possible to ascertain\
    \ why.\n  故障透明性：如果一个人工智能系统造成了损害，那么造成损害的原因要能被确定。\n\n- (8) Judicial Transparency:\
    \ Any involvement by an autonomous system in judicial decision-making should provide\
    \ a satisfactory explanation auditable by a competent human authority.\n  司法透明性：任何自动系统参与的司法判决都应提供令人满意的司法解释以被相关领域的专家接受。\n\
    \n- (9) Responsibility: Designers and builders of advanced AI systems are stakeholders\
    \ in the moral implications of their use, misuse, and actions, with a responsibility\
    \ and opportunity to shape those implications.\n  责任：高级人工智能系统的设计者和建造者，是人工智能使用、误用和行为所产生的道德影响的参与者，有责任和机会去塑造那些道德影响。\n\
    \n- (10) Value Alignment: Highly autonomous AI systems should be designed so that\
    \ their goals and behaviors can be assured to align with human values throughout\
    \ their operation.\n  价值归属：高度自主的人工智能系统的设计，应该确保它们的目标和行为在整个运行中与人类的价值观相一致。\n\n- (11)\
    \ Human Values: AI systems should be designed and operated so as to be compatible\
    \ with ideals of human dignity, rights, freedoms, and cultural diversity.\n  人类价值观：人工智能系统应该被设计和操作，以使其和人类尊严、权力、自由和文化多样性的理想相一致。\n\
    \n- (12) Personal Privacy: People should have the right to access, manage and\
    \ control the data they generate, given AI systems' power to analyze and utilize\
    \ that data.\n  个人隐私：在给予人工智能系统以分析和使用数据的能力时，人们应该拥有权力去访问、管理和控制他们产生的数据。\n\n- (13)\
    \ Liberty and Privacy: The application of AI to personal data must not unreasonably\
    \ curtail people's real or perceived liberty.\n  自由和隐私：人工智能在个人数据上的应用不能允许无理由地剥夺人们真实的或人们能感受到的自由。\n\
    \n- (14) Shared Benefit: AI technologies should benefit and empower as many people\
    \ as possible.\n  分享利益：人工智能科技应该惠及和服务尽可能多的人。\n\n- (15) Shared Prosperity: The economic\
    \ prosperity created by AI should be shared broadly, to benefit all of humanity.\n\
    \  共同繁荣：由人工智能创造的经济繁荣应该被广泛地分享，惠及全人类。\n\n- (16) Human Control: Humans should choose\
    \ how and whether to delegate decisions to AI systems, to accomplish human-chosen\
    \ objectives.\n  人类控制：人类应该来选择如何和决定是否让人工智能系统去完成人类选择的目标。\n\n- (17) Non-subversion:\
    \ The power conferred by control of highly advanced AI systems should respect\
    \ and improve, rather than subvert, the social and civic processes on which the\
    \ health of society depends.\n  非颠覆：高级人工智能被授予的权力应该尊重和改进健康的社会所依赖的社会和公民秩序，而不是颠覆。\n\
    \n- (18) AI Arms Race: An arms race in lethal autonomous weapons should be avoided.\n\
    \  人工智能军备竞赛：致命的自动化武器的装备竞赛应该被避免。\n\n### Longer-term Issues 更长期的问题\n\n- (19) Capability\
    \ Caution: There being no consensus, we should avoid strong assumptions regarding\
    \ upper limits on future AI capabilities.\n  能力警惕：我们应该避免关于未来人工智能能力上限的过高假设，但这一点还没有达成共识。\n\
    \n- (20) Importance: Advanced AI could represent a profound change in the history\
    \ of life on Earth, and should be planned for and managed with commensurate care\
    \ and resources.\n  重要性：高级人工智能能够代表地球生命历史的一个深刻变化，人类应该有相应的关切和资源来进行计划和管理。\n\n- (21)\
    \ Risks: Risks posed by AI systems, especially catastrophic or existential risks,\
    \ must be subject to planning and mitigation efforts commensurate with their expected\
    \ impact.\n  风险：人工智能系统造成的风险,特别是灾难性的或有关人类存亡的风险,必须有针对性地计划和努力减轻可预见的冲击。\n\n- (22)\
    \ Recursive Self-Improvement: AI systems designed to recursively self-improve\
    \ or self-replicate in a manner that could lead to rapidly increasing quality\
    \ or quantity must be subject to strict safety and control measures.\n  递归的自我提升：被设计成可以迅速提升质量和数量的方式进行递归自我升级或自我复制人工智能系统,必须受制于严格的安全和控制标准。\n\
    \n- (23) Common Good: Superintelligence should only be developed in the service\
    \ of widely shared ethical ideals, and for the benefit of all humanity rather\
    \ than one state or organization.\n  公共利益：超级智能的开发是为了服务广泛认可的伦理观念,并且是为了全人类的利益而不是一个国家和组织的利益。\n"
