    识时，它也要求更高一层的元知识去解释它。”因此我们需要多分辨率（多层次）表示方法。这里有两点值得我们重视：其一，要建立智能控制这一新领域，我们需要一个新的体系，这个体系不是简单地把其几个领域叠加起来，而是多种表示的综合集成；其二，人工智能在智能控制形成中应占主导地位。


    # 1.3.3 人工智能的伦理与哲学问题


    人工智能的迅速发展给人的生活带来了一些困扰与不安，尤其是在奇点理论提出后，很多人质疑机器的迅速发展会给人类带来极大的危险，随之而来的很多机器事故与机器武器的产生更加印证了人们的这种印象。机器伦理、机器道德的问题成为热点。


    +   1. 伦理的概念


    伦理一词，英文称为“ethics”，这一词源自希腊文的“ethos”，其意义与拉丁文“mores”差不多，表示风俗、习惯的意思。西方的伦理学发展流派纷呈，比较经典的有叔本华的唯意志主义伦理流派、詹姆斯的实用主义伦理学流派、斯宾塞的进化论伦理学流派还有海德格尔的存在主义伦理学流派。其中，存在主义是西方影响最广泛的伦理学流派，始终把自由作为其伦理学的核心，认为“自由是价值的唯一源泉”。


    在我国，伦理的概念要追溯到公元前 6 世纪，《周易》尚书》已出现单用的伦、理。前者即指人们的关系，“三纲五伦”“伦理纲常”中的伦即人伦。而理则指条理和道理，指人们应遵循的行为准则。与西方相似，不同学派的伦理观差别很大，儒家强调“仁、孝、悌、忠、信”与道德修养，墨家信奉“兼相爱，交相利”，而法家则重视法治高于教化，人性本恶，要靠法来相制约。


    总的来说，伦理是哲学的分支，是研究社会道德现象及其规律的科学，其研究是很有必要的。因为伦理不但可以建立起一种人与人之间的关系，并且可以通过一种潜在的价值观来对人的行为产生制约与影响。很难想象，没有伦理的概念，我们的社会会有什么人伦与秩序可言。


    +   2. 人工智能伦理


    其实在人工智能伦理一词诞生以前，很多学者就对机器与人的关系进行过研究，并发表了自己的意见。早在 1950 年，维纳在《人有人的用途：控制论与社会》一书中就曾经担心自动化技术将会造成“人脑的贬值”。20
    世纪 70 年代，德雷福斯曾经连续发表文章《炼金术与人工智能》《计算机不能做什么》，从生物、心理学的层次得出了人工智能必将失败的结论。而有关机器伦理（与人工智能伦理相似）的概念则源自《走向机器伦理》一文。文中明确提出：机器伦理关注机器对人类使用者和其他机器带来的行为结果。文章的作者之一安德森表示，随着机器越来越智能化，它们也应当承担一些社会责任，并具有伦理观念。这样可以帮助人类以及自身更好地进行智能决策。无独有偶，2008
    年英国计算机专家诺埃尔·夏基教授曾经呼吁人类应该尽快制定机器（人）相关方面的道德伦理准则。目前国外对于人工智能伦理的研究相对较多，如 2005 年欧洲机器人研究网络（EURON）的《机器人伦理学路线图》、韩国工商能源部颁布的《机器人伦理宪章》、美国航空航天局（NASA）对“机器人伦理学”进行的资助等。而且国外相关的文献也相对丰富，主要集中在机器人法律、安全与社会伦理问题方面。国内方面相关研究起步较晚，研究不如国外系统全面。但是近些年来，'
