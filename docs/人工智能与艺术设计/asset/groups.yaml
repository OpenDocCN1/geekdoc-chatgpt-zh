    传递。图 5-6 右半部分为左图循环结构按照时间顺序的展开形式式，这种链式属性体现了 RNN 与(时间)序列有密切关联，是分析处理此类数据最自然的网络结构。


    ![](img/f188b68deb37acb6105ba97c814d9af2_121_0.png)


    5-6 递归神经网络 RNN 及其展开式示意图


    基于 RNN 的展开式网络结构，可以利用前向传播算法(FP)依次按照时间顺序计算输入输出，然后利用反向传播算法(BP)将累积误差从最后一个时间步骤传递回前面的步骤。这样的方法在处理“长期依赖关系”时，后面的时间节点对前面时间节点的感知能力会下降，出现“梯度消失”的问题。


    长短期记忆网络(LSTM)是一种特殊的 RNN，由 Hochreiter 和 Schmidhuber 在 1997 年提出，之后很多研究者进行了诸多改进。LSTM
    引入了新机制，对“记忆模块”进行改进，使其能够有效学习长期依赖关系。图 5-6 是递归神经网络 RNN 及其展开式示意图。图 5-7 是 LSTM 的循环模块构成图。在传统的
    RNN 中，循环模块 A 一般由一个简单的激活层构成，这里以 tanh() 函数为例；LSTM 同样具有 RNN 的链式结构，区别在于循环模块的构成，它包含
    4 个神经网络层以特定的方式相互作用。


    LSTM 的核心思想在于单元模块的状态，即图 5-7 中的 c_t。从 c_{t-1} 到 c_t 的水平线表示每个时间步骤下的单元状态沿整个链式结构传递下去，中间过程只包含部分线性操作，因此容易以较小的损失保持信息。此外，LSTM
    可以通过“门限(Gates)”结构向单元状态中添加或从中移除信息。该操作可由一个 sigmoid 神经网络层和点乘运算实现，输出 0~1 之间的数值，用于描述信息通过的程度，0
    表示全部拒绝，1 表示全部接受。具体地，LSTM 利用 3 种门限——遗忘门限(Forget Gate)、输入门限(Input Gate)和输出门限(Output
    Gate)来实现保护和控制单元状态。对于某时刻下的单元模块，第一步需要确定哪些上文信息将从单元状态中移除，该决策由“遗忘门限”的 sigmoid 层决定(对应图
    5-7 中最左侧的方框)；第二步需要确定在单元状态中存储哪些新信息：首先，由“输入门限”的 sigmoid 层(对应图 5-7 中左二的方框)对上文信息进行更新，之后由
    tanh() 激活层(对应图 5-7 中左三的方框)创建新的候选状态：这需要结合上文信息与新信息共同确定新的单元状态，其中“遗忘门限”和“输入门限”分别决定了旧信息和新信息的权重(即接受程度)；第三步需要确定单元的输出，该输出取决于更新后的单元状态。这需要由“输出门限”(对应图
    5-7 中左四的蓝色方框)结合输入信息确定一个接受权重。在此基础上，更新后的单元状态经过激活层(对应图 5-7 中最右侧的蓝色方框)，乘该权重即可得到输出。经此
    3 个步骤，利用这 3 种门限有效地控制了增加和移除信息的频率与程度，从而实现长时或短时的信息记忆。'
