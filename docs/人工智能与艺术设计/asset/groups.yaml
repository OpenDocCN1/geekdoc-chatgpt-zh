    # 4.3.4 情感识别系统


    # 4.3.4.1 情感识别的定义


    计算机对从传感器采集来的信号进行分析和处理，从而得出对方（人）正处在的情感状态，这种行为叫作情感识别。情感识别系统可以使人与计算机进行人性化、智能化的交流，计算机可以像人一样感知周边环境和世界的变化。人类可以通过视觉、味觉、听觉、嗅觉和触觉五个器官来认识世界，获知他人的情感，而计算机主要是通过人脸的情感识别、语言声调的情感识别和语言文字的情感识别来获取对方的情感。本节将对这三种情感识别方式分别做简要介绍。


    # 4.3.4.2 人脸情感识别


    在日常生活中，如图 4-12 所示，人脸表情是人际交往中的一种方式，是一种非肢体、非语言交流方式。心理学家 Mehrabian 指出，感情表达 = 7% 的言语
    + 38% 的声音 + 55% 的人脸表情。在日常生活与交流中，人们可以通过面部表情间接地表达自己的感情和想法，让对方感受到自己直观的态度。同时，人们也可以通过对方的面部表情，辨别出对方的情绪和真正的意图，可见，面部表情在日常人际交流中十分重要。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_0.png)


