    ![](img/f188b68deb37acb6105ba97c814d9af2_132_0.png)


    # 图 6-2 反射弧


    如果中枢发生抑制，则中枢原有的传出冲动减弱或停止。在实验条件下，人工刺激直接作用于传入神经也可引起反射活动，但在自然条件下，反射活动一般都需经过完整的反射弧来完成，如果反射弧中任何一个环节中断，反射即不能发生。


    根据神经纤维传递方向向周围传出神经冲动，产生运动，称为运动神经，又称传出神经。运动神经指支配躯体肌肉中的传出神经纤维，其功能是产生和控制身体的运动和紧张。这是相对于感觉神经而言的。在脊椎动物中除了属于脑、脊髓神经系统并支配随意运动的运动神经外，植物神经与周围神经也有很多运动神经（如血管运动神经）。有时也将属于植物神经系统的分泌神经合在一起称为广义的运动神经，因为纯运动性、纯感觉性神经于实际上是罕见的，多数为混合性，所以要正确地使用运动（神经）纤维、运动神经元等术语。


    # 6.1.2 人体运动的控制


    广义的运动系统由中枢神经系统、周围神经和神经—肌接头部分、骨骼肌肉、心肺和代谢支持系统组成。


    狭义的运动系统由骨、关节和骨骼肌三种器官组成。骨与不同形式（不活动、半活动或活动）的骨连接在一起，构成骨骼，形成了人体体形的基础，并为肌肉提供了广阔的附着点。肌肉是运动系统的主动动力装置，在神经支配下，肌肉收缩、牵拉其所附着的骨，以可动的骨连接为枢纽，产生杠杆运动。


    # 1. 运动的功能


    运动系统，顾名思义，其首要的功能是运动。人的运动是很复杂的，包括简单的移位和高级的活动如语言、书写等，都是以在神经系统支配下的肌肉收缩而实现的。即使一个简单的运动往往也有多数肌肉参与，如一些肌肉收缩，承担完成运动预期目的的角色，而另一些肌肉则予以协同配合，甚或有些处于对抗地位的肌肉此时则适度放松并保持一定的紧张度，以使动作平滑、准确，起着相辅相成的作用。


    运动系统的第二个功能是支持，包括构成人体体形、支撑体重和内部器官以及维持人体姿势。人体姿势的维持除了骨和骨连接的支架作用外，主要靠肌肉的紧张度来维持。骨骼'
  - '[PAGE 133]


    肌经常处于不随意的紧张状态中，即通过神经系统反射性地维持一定的紧张度。静止姿态是需要互相对抗的肌群各自保持一定的紧张度所取得的动态平衡的结果。


    运动系统的第三个功能是保护。众所周知，人的躯干形成了几个体腔，颅腔保护和支持着脑髓和感觉器官；胸腔保护和支持着心、大血管、肺等重要脏器；腹腔和盆腔保护和支持着消化系统、泌尿系统、生殖系统的众多脏器。这些体腔由骨和骨连接构成完整的壁或大部分骨性壁；肌肉也构成某些体腔壁的一部分，如腹前、外侧壁、胸廓的肋间隙等，或围在骨性体腔壁的周围，形成颇具弹性和韧度的保护层，当受外力冲击时，肌肉反射性地收缩，起着缓冲打击和震荡的重要作用。


    # 2. 运动机制


    远步是指肢端自地面提起时，运用以肘关节为支点、力臂小于重臂的速度杠杆。肢端着地后躯体前进，是运用以肢端着地点为支点，力臂大于重臂的省力杠杆。如前肢的远步，先是随着肩关节、肘关节、腕关节和指节间关节的屈肌收缩，这些关节屈曲，肢端自地而提起；接着，随着伸肌收缩，这些关节伸展；同时由于躯体向前推进，前肢迈前一步，肢端着地。之后，这些关节的伸肌（包括腕关节和指节间关节的屈肌）收缩，有关的关节伸展，推动躯体前进。后肢的远步基本上由后肢的有关关节，如髋关节、膝关节、跗关节和趾节间关节及其肌肉进行着类似的伸屈活动，推动躯体前进。在四肢交替运动推动躯体前进的过程中，当后肢着地支撑身体时，躯体后部升起，重心前移；前肢着地支撑躯体时，躯体前部升起，重心后移。从而，躯体呈现不断的起伏波动。


    # 6.1.2.1 大脑控制运动的机理


    生命在于运动，运动是我们维持生命、完成任务、改造客观世界的基础。各种生命运动、行为活动时时刻刻都在进行，一刻都没有停止过，但我们的大脑并没有时时刻刻都在关注、指挥所有运动，而是在运动进行的同时，主要从事各种学习、思维活动，并将正在进行的运动置于脑后。大脑不是具体控制运动的器官，控制、指挥运动的器官主要是纹状体。


    丘脑、大脑额叶、纹状体、小脑都与运动有关，各自分工合作，共同完成运动的意向、计划、指挥、控制和执行。丘脑主要合成、发放直觉，产生各种运动意识；大脑根据视听等传入信息分析产出样本，这个样本是关于我们应该进行什么样的运动，是完成任务、达到目的的运动意向；纹状体、小脑分析产出的样本是控制运动的程序，指令，纹状体、小脑是运动的具体控制、指挥者。运动的执行是由肢体（如头、手、脚）或效应器来完成的。


    丘脑是合成发挥直觉的器官，是“我”的本体器官，大脑联络区是直觉的活动场所，意识在大脑联络区得以实现。大脑、纹状体、小脑分析产出的运动样本激活丘脑，丘脑根据运动样本合成“觉”，并发放到大脑联络区，使大脑产生对运动的觉知，也就产生了运动意向。运动意向是意识的一种，运动意识分为三类：一类是来自大脑的运动意向；一类是来自纹状体、小脑的运动前感觉；一类是来自感觉神经元的运动后感觉。


    大脑的主要功能就是分析产出样本，大脑额叶是最为高级和重要的器官，包括联络区、运动前区和运动区，大脑额叶、顶枕颞联络区是意识活动的主要区域，可以根据外界环境的需要产生运动意向，明确运动的方向或行为方式。大脑不是运动的具体控制、指挥者，不对运动的'
  - '[PAGE 134]


    程序、指令进行分析,而是交给纹状体、小脑完成,使我们能够集中精力进行各种思维活动。大脑额叶运动区掌管着运动指令、程序的最后发放,运动区将运动程序、指令发放出去即产生运动,运动区服从于联络区,服从于意识,意识可以随时中止运动程序、指令的发放,从而停止运动。


    纹状体是运动控制、指挥的主要器官,是运动的具体控制、指挥者。纹状体分析产出的运动样本是控制、指挥运动的程序、指令,运动样本的分析产出服从于运动意向,当大脑联络区产生运动意向后,纹状体、小脑根据运动意向分析产出运动样本。小脑的功能是多方面的,可能参与了意识、感受、运动等多方面的活动,在运动过程中分析产出运动需要的参数,控制运动的细节,对于运动的准确度、精确度起作用。


    当我们与外界事物接触时,需要采取合适的行为活动去正确应对,大脑分析产出合乎实际需要的样本,产生运动意向和调动纹状体,经小脑控制去指挥运动。大脑根据传人的视听信息分析产出样本,这个样本有两个传出路径,第一条路径是通过联络纤维激活丘脑背内侧核、丘脑枕、丘脑背内侧核、丘脑或枕合成发放运动正觉进入意识,这也是进行运动的意向;另一条路径是通过投射纤维激活纹状体、小脑,纹状体、小脑根据运动意向分析产出运动样本。


    纹状体、小脑的主要功能是分析产出运动样本,这个运动样本的传出路径有三个步骤,通过三个步骤的接力,完成运动的控制、指挥和执行。第一步,纹状体、小脑有传出纤维到丘脑腹前核、腹外侧核,纹状体、小脑分析产出的运动样本通过传出纤维激活丘脑腹前核、腹外侧核的丘觉,再经过丘脑间的纤维联系进入丘脑背内侧核,通过丘脑背内侧核发放到大脑额叶联络区进入意识,大脑联络区是各种意识汇集的场所,这些运动样本在进入意识前还没有执行,只是告诉大脑即将进行的运动,在运动开始前使大脑知道即将进行的运动,大脑可以在运动开始之前随时中止运动,也可以根据形势发展、环境变化随时调整运动意向,使纹状体、小脑分析产出新的运动样本,从而达到调整运动的目的;第二步,丘脑腹前核、腹外侧核的传出纤维到大脑运动区、运动前区,丘脑腹前核、腹外侧核通过传出纤维将运动样本传递到大脑运动区、运动前区;第三步,大脑运动区通过锥体束联系低级运动神经元,运动样本通过锥体束发放到运动神经元,控制、指挥运动的进行,运动前区、运动区受额叶联络区的支配,运动样本的最后发放服从于额叶联络区的意识。


    当运动产生后,通过感觉神经元,将运动产生的感觉传入大脑,大脑对运动的执行、完成情况做进一步的分析,形成一个完整的环路。我们可以根据运动的执行、完成情况进行运动的继续或调整。


    大脑分析产出的样本与纹状体、小脑分析产出的运动样本是不同的。大脑分析产出的样本主要是激活丘觉、产生运动意向,是大脑额叶、顶颞枕叶根据外界环境的变化、行为目的、需要完成的任务分析产出的,不能控制、指挥运动。控制、指挥运动的运动样本是纹状体、小脑分析产出的,一方面要激活丘脑腹前核、腹外侧核进入意识,另一方面又要控制、指挥运动的程序、指令。大脑中与运动有关的意识有三个,即运动意向、运动前感觉、运动后感觉。运动意向是需要进行的运动意识,是大脑根据外界环境分析产出的;运动前感觉是即将进行的运动意识,是纹状体、小脑分析产出的运动样本激活丘觉产生的;运动后感觉是运动的效果感觉,是感觉神经元激活丘脑产生的。'
  - '[PAGE 135]


    纹状体根据运动模型分析产出运动样本，运动模型是通过多次的运动学习、练习形成的。人出生后，没有任何运动技能，在与各种客观事物的不断接触中，在各种动作的不断试探、练习过程中，逐步形成固定的运动模式，建立运动模型，运动模型在本质上仍然是运动样本，只不过这个运动样本存储在纹状体中。在运动的学习、动作的练习过程中，纹状体一边不断地分析产出运动样本，控制、指挥运动，一边不断地将运动样本存储起来，经过多次反复形成运动模型，是下一次分析运动样本的参照依据。当纹状体中建立了运动模型，运动可以按照已有的模型自动进行，不需要大脑具体参与，能够脱离意识自动完成，我们常说的习惯以及各种操作技能都是如此。


    # ### 6.1.2.2 脊髓对运动的调节


    # #### 1. α 和 γ 运动神经元


    脊髓的前角存在大量的运动神经元，分为 α 和 γ 两类。它们的轴突直接支配肌肉，其中 α 运动神经元的轴突直接支配肌纤维，引起肌肉收缩，产生运动。每一个 α
    运动神经元的轴突末梢分成分支，支配数目不等的肌纤维。一个 α 运动神经元连同其支配的全部肌纤维称为一个运动单位（Unit）。不同部位的运动单位所包含的肌纤维数目不等，如一个眼外肌的
    α 运动神经元支配 6~12 根肌肉纤维，而支配四肢肌肉的一个 α 运动神经元可支配上千根肌肉纤维，如图 6-3。


    ![](img/f188b68deb37acb6105ba97c814d9af2_135_0.png)


    图 6-3 α 运动神经元和 γ 运动神经元


    γ 运动神经元支配核内肌纤维，调节肌梭的敏感性。α 和 γ 运动神经元的纤维末梢均以乙酰胆碱为神经递质。


    α 运动神经元接受来自自动皮层的指令，引起随意运动；它也接收来自皮肤、肌肉、关节等外周传入的冲动，引起脊髓反射。实际上，α 运动神经元是骨骼肌运动的最后通路。


    # #### 2. 脊髓反射


    外界刺激可引起反射性的肌肉运动，这些运动的中枢在脊髓，故称为脊髓反射。脊髓反射可分为浅反射和深反射。


    # ##### (1) 屈肌反射属于浅反射


    当皮肤受到伤害性刺激时，信息传入脊髓，通过突触连接，引起支配相关区域骨骼肌的 α 运动神经元兴奋，α 运动神经沿其轴突传出冲动，到达所支配的肌肉群，使相关肌群产生协调动作，如关节屈肌收缩，伸肌舒张。因此，受到刺激的肢体迅速避开刺激，可见，这是一种保护性反射。还有其他一些浅刺激也可以引起相应的浅反射。但正常情况下，高位中枢对这些反射有调控作用，一般对这些非伤害性刺激引起的浅反射有抑制作用。因此，当脊髓失去高位中枢控制时，如麻醉状态下，或大脑皮层下行运动通路障碍时，这些反射才表现出来，这为临床诊断提供了线索。如人锥体束或大脑皮层运动区功能障碍时，以钝物划足跖外侧时，出现大趾背屈，其他四趾向外展开的反射，称为
    Babinski 阳性，其实质属于屈肌反射。'
