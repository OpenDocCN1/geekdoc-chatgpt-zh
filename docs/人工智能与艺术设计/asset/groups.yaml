    # 6.1.3 人的情绪、内分泌物质对运动的影响


    人的情绪、内分泌物质、运动三者是相互影响的。


    众所周知，运动具有各种各样的好处。运动能减肥，运动能提高人的毅力，运动能改变一个人的情绪状态，运动能够使人更加活泼开朗，运动能使人生更加幸福。那么，为什么运动能提高人的毅力？为什么运动能够改变人的精神状态（使人幸福）？


    在回答问题之前，首先引入两个重要概念——多巴胺和内啡肽。这是大脑在神经活动中分泌的两种重要的物质。


    多巴胺由脑内分泌，可影响一个人的情绪。它正式的化学名称为 4-（2-氨基乙基）-1，2－苯二酚[4-（2- aminoethyl)benzene－1，2 -
    diol]。Arvid Carlsson 确定多巴胺为脑内信息传递者的角色的发现使他赢得了 2000 年的诺贝尔医学奖。多巴胺是一种神经传导物质，用来帮助细胞传送脉冲。这种脑内分泌物主要负责大脑的情欲，感觉上兴奋及开心的信息传递，也与上瘾有关。多巴胺系统的功能主要包括奖赏、动机、运动控制和唤醒等。多巴胺，令人体验在接受挑战、冒险和新鲜事物的刺激时的愉悦感。'
