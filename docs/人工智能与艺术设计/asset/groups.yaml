    \n## 3.1.2 人工智能的算法描述\n\n### 3.1.2.1 描述算法的方法有多种\n\n常用的有自然语言、结构化流程图、伪代码和 PAD 图等，其中最普遍的是流程图。各种描述语言在对问题的描述能力方面存在一定的差异；日常生活中我们一般采用自然语言来表达我们的思想，也常常采用某些图式来表达其相互关系。\n\
    \n流程图：特定的表示算法的图形符号(图 3 - 1)；\n\n![](img/f188b68deb37acb6105ba97c814d9af2_61_0.png)\n\
    \n图 3-1 流程图的基本符号\n\n伪语言：包括程序设计语言的三大基本结构及自然语言的一种语言；\n\n类语言：类似高级语言的语言，例如，类 PASCAL、类\
    \ C 语言。\n\n算法的描述方式主要有自然语言、流程图、伪代码等，它们的优势和不足可以简单地归纳如下：\n\n- 1. 自然语言\n  - 优势：自然语言描述的算法通俗易懂，不用专门的训练。\n\
    \  - 不足：（1）由于自然语言的歧义性，容易导致算法执行的不确定性；（2）自然语言的句子一般较长，导致描述的算法太长；（3）当一个算法中循环和分歧较多时就很难清晰地表示出来；（4）自然语言表示的算法不便翻译成计算机程序设计语言。\n\
    - 2. 流程图\n  - 优势：流程图描述的算法清晰简洁，容易表达选择结构，它不依赖于任何具体的计算机和计算机程序设计语言，从而有利于不同环境的程序设计。\n\
    \  - 不足：不易书写，修改起来比较费事，须借助于专用的流程图制作软件来提升绘制和修改。\n- 3. 伪代码\n  - 优势：伪代码回避了程序设计语言的严格、烦琐的书写格式，书写方便，同时具备格式紧凑、易于理解、便于向计算机程序设计语言过渡的优点。\n\
    \  - 不足：由于伪代码的种类繁多，语句不容易规范，有时会产生误读。\n\n目前，许多“数据结构”教材采用类 PASCAL 语言、类 C++ 或类 C 语言作为算法描述语言。\n\
    \n### 3.1.2.2 算法描述的功能\n\n- 1. 输入和输出语句\n  - (1) 输入：cin>>x;\n\n    其功能是读入从键盘输入的一个数，并赋予相同类型的变量\
    \ x。其中变量 x 的类型可以是整型、浮点型、字符型等不同类型。\n\n    该语句可用下面的形式同时输入多个不同类型的变量。\n\n    ```\n\
    \    cin>>x1>>x2>>x3>>x4>>x5;\n    ```\n\n  - (2) 输出：cout<<exp;\n\n    其功能是将表达式\
    \ exp 的值输出到屏幕上。其中表达式 exp 的类型可以是整型、浮点型、字符型等不同类型。\n\n    该语句可用下面的形式同时输出多个不同类型的表达式的值。\n\
    \n    ```\n    cout<<exp1<<exp2<<exp3<<exp4<<exp5;\n    ```\n\n- 2. 最小值和最大值函数\
    \ min 和 max\n  - (1) 最小值函数：datatype min(datatype exp1, datatype exp2, ⋯, datatype\
    \ expn);\n\n    返回表达式 expi(i=1,2,⋯,n)中的最小的值。其中元素类型 datatype 可以是各种类型。\n\n  - (2)\
    \ 最大值函数：datatype max(datatype exp1, datatype exp2, ⋯, datatype expn);\n\n    返回表达式\
    \ expi(i=1,2,⋯,n)中的最大的值。\n\n- 3. 交换变量的值\n\n  x1 <=> x2; 交换变量 x1 和 x2 的值。\n\n-\
    \ 4. 注释\n\n  在双斜线“//”后面的内容就是注释的内容。例如，下面语句的右面就是一个注释。\n\n  A[i]=i * i;//此处为注释内容\n\
    \n- 5. 程序错误输出提示\n\n  ```\n  error(\"exp\");\n  ```\n\n### 3.1.2.3 语句形式\n\n- 1.\
    \ 语法形式\n\n  算法描述语言的语法不是十分严格，它主要由符号与表达式、赋值语句、控制转移语句、循环语句、其他语句构成。符号命名、数学及逻辑表达式一般与程序书写一致。赋值用箭头表示。语句可有标识，标识可以是数字，也可以是具有实际意义的单词。例如，循环累加可表示为：\n\
    \n  ```\n  loop: n=n+1;\n  ```\n\n- 2. 赋值语句\n\n  将确定的数值赋给变量的语句叫作赋值语句(图 3 - 2)。各程序设计语言有自己的赋值语句，赋值语句也有不同的类型。所赋“值”可以是数字，也可以是字符串和表达式。\n\
    \n  ![](img/f188b68deb37acb6105ba97c814d9af2_63_0.png)\n\n  # 图 3 - 2 赋值语句流程图\n\
    \n  注意很多语言都使用“等号”(即“=”)来作为赋值号，所以可能和平时的理解不同，在使用的时候应予以注意。\n\n  - (1) VB 语言中的赋值格式\n\
    \n    例如，给变量 a 赋值一个数为 12，则格式为: a = 12[注意：变量(即 a)只能是一个字母，而赋予的值可以是一个式子，当它是式子时，a\
    \ 的值就是这个式子的结果]。\n\n  - (2) C 语言中的赋值语句\n\n    如：int a; /* “整数” 类型 A */\n\n    a\
    \ = 12; /* A 为 12 */\n\n    C 语言规定，变量要先定义才能使用，也可以将定义和赋值在同一个语句中进行：\n\n    int a\
    \ = 12; /* “整数” 类型 A 为 12 */\n\n### 3. 条件语句\n\n用来判断给定的条件是否满足(表达式值是否为 0)，并根据判断的结果(真或假)决定执行的语句(图\
    \ 3 - 3)，选择结构就是用条件语句来实现的。\n\n![](img/f188b68deb37acb6105ba97c814d9af2_63_1.png)\n\
    \n# 图 3 - 3 条件语句流程图\n\n条件语句可以给定一个判断条件，并在程序执行过程中判断该条件是否成立，根据判断结果执行不同的操作，从而改变代码的执行顺序，实现更多的功能。VB\
    \ 语言中的条件语句主要有 If 语句和 Select Case 语句两种。写程序时，常常需要指明两条或更多的执行路径，而在程序执行时，允许选择其中一条路径，或者说当给定条件成立时，则执行其中某语句。在高级语言中，一般都要有条件语句。\n\
    \n条件语句是一种根据条件执行不同代码的语句，如果条件满足则执行一段代码，否则执行其他代码。可将条件语句认为是有点像起因和结果。一种更好的类比方式可能是，使用一些父母辈可能会说的话，如下面的内容：\n\
    \n> “如果你的房间是干净的，你会得到甜点。否则，你就得早点去睡觉。”\n\n第一个起因是干净的房间，结果是可以得到甜点。第二个起因是不干净的房间，结果是必须早点上床休息。\n\
    \n在脚本上，可能需要创建类似的语句。可能如下面的内容一样：\n\n> “如果变量 mymoney 的值大于 1 000，那么发送警告告知我的金融状况没问题。否则，发出警告，告知我需要更多钱！”\n\
    \n以下通过实例来讲述条件语句的应用。\n\n### [实例 3] 输入年份，判断是否为闰年\n\n其程序如下：\n\n```\n/*\n程序名称：ex3-21\n\
    建立日期：2015-8-20\n程序功能：判断闰年\n#include <stdio.h>\n#include <stdlib.h>\nint main()\n\
    {\nint year;\nscanf(\"%d\", &year);\nif(year<=0)\n{\nprintf(\"数据输入错误！\\n\");\n\
    exit(0);\n}\nif(year%4==0&&year%100!=0||year%400==0)\nprintf(\"%d 是闰年！\\n\", year);\n\
    else\nprintf(\"%d 不是闰年！\\n\", year)\nreturn 0;\n}\n```\n\n程序运行结果：\n\n- 输入 2013\
    \ 按 Enter 键\n  2013 不是闰年！\n- 输入 2012 按 Enter 键\n  2012 是闰年！\n- 输入 100 按 Enter\
    \ 键\n  数据输入错误！\n\n### 4. 控制转移语句\n\n无条件转移语句用“GOTO 语句标识”表示。条件转移语句用“IF C THEN S1\
    \ ELSE S2”表示，其中 C、S1 和 S2 可以是一个逻辑表达式，也可以是用“{ 与 }”括起来的语句组。如果 C 为“真”，则 S1 被执行；如果\
    \ C 为“假”，则执行 S2。\n\n### 5. 循环语句\n\n用来表示只要某个条件式保持为真就继续规定的计算活动，表示这样的算法步骤的语义结构就称为循环语义结构。一般采用如下的描述形式：\n\
    \n```\nwhile(条件)do(活动)\n```\n\n其中 while 和 do 也是保留词。循环语义结构的流程图如图 3-4 所示。\n\n循环语义结构的含义是“检查（条件）是否满足，如果其为真就执行（活动），并返回再次检查（条件）。只有当某次检查（条件）不满足时，才结束算法步骤”。比如\
    \ x 初始值假定为 0，那么\n\n![](img/f188b68deb37acb6105ba97c814d9af2_65_0.png)\n\n图 3-4\
    \ while 语句流程图\n\n```\nwhile(x≦6)do(x←x+1)\n```\n\n就意味着一直执行 6 次(x←x+1)计算，结果 x 的值变成了\
    \ 6，循环就此结束。\n\n有了上述三种基本的语义结构描述形式，就可以用来表示完整的算法思想了。通常一个算法中的每一个相对独立的步骤，称为一个语句。算法中的语句，均可以用上面三种语义结构之一来描述，称为具体应用。在算法中，由这些语义结构组成的语句有序集合，就称为算法的伪码表示。为了使得这样的伪码表示更加具有可读性，一般规定语句之间用分号隔开。如果一个语句内部嵌有另一个语句，则采用缩进格式。比如语句：\n\
    \n```\nif(x≦6)then(y←x+2)else(if(x≦6)then(y←x+2)else(y←x+6))\n```\n\n写成缩进格式就是\n\
    \n```\nif(x≦6)\nthen(y←x+2)\nelse(if(x≦6)\nthen(y←x+2)\nelse(y←x+6)\n)\n```\n\n\
    进一步，对于重复出现的伪码段或者相对独立的一段伪码，可以用固定名称加以命名定义，称为过程。一旦一个过程定义了固定名称，那么在需要出现该过程伪码段的地方，就可以直接用该名称替代这段伪码。一般过程的定义方式为\n\
    \n```\nprocedurename(参量)\n```\n\n引用之处直接用语句“procedurename”来代替所定义的这段“伪码段”。过程语句的流程图如图\
    \ 3-5 所示。\n"
  mdcn: "\n的不确定性有很强的适应能力。传统的智能算法主要包括，以生物进化规律为指导的进化算法(Evolutionary Algorithms, EAs)；模拟鸟群觅食过程信息共享的粒子群算法(Particle\
    \ Swarm Optimization, PSO)；以生物遗传和不断进化为指导的遗传算法(Genetic Algorithm, GA)；模仿鱼群觅食、聚群、追尾等行为的人工鱼群算法(Artificial\
    \ Fish-Swarm Algorithm, AFSA)；模拟生物免疫细胞分化、记忆、自我调节的人工免疫算法(Artificial Immune Algorithm,\
    \ AIA)等。\n\n因此，学习和认知算法是人工智能的基础。本章包括人工智能的算法的性质，描述算法的方法，算法结构，问题求解的案例。\n\n## 3.1.1\
    \ 人工智能的算法性质\n\n所谓的算法，用实物来说就是做事的步骤。在日常生活中，我们完成某项任务，一般要遵循一定的算法步骤。例如：开车，首先要打开车门，驾驶员坐好，插上车钥匙，发动汽车。\n\
    \n如果强调精确执行性，那么计算“1+2+3+4+5”问题就是一个机器可以真正精确执行的例子，其算法可表示为如下步骤：(1) 先计算 1+2，得到 3；(2)\
    \ 将步骤(1)得到的结果加上 3，得到 6；(3) 将步骤(2)得到的结果加上 4，得到 10；(4) 将步骤(3)得到的结果加上 5，得到 15。显然，该算法最后得到的计算结果为\
    \ 15。\n\n通过上述算法例子，我们不难了解算法的一些特点。当然，算法作为机器系统能够严格精确执行的操作步骤集合，我们必须对其下一个严格的定义，即算法是一组明确的、可以直接执行其步骤的有限有序集合。一个算法应该具有以下五个重要的特征。\n\
    \n- (1) 有穷性(Finiteness)：算法的有穷性是指算法必须能在执行有限个步骤之后终止。\n- (2) 确切性(Definiteness)：算法的每一步骤必须有确切的定义。\n\
    - (3) 输入项(Input)：一个算法有 0 个或多个输入，以刻画运算对象的初始情况，所谓 0 个输入是指算法本身定出了初始条件。\n- (4) 输出项(Output)：一个算法有一个或多个输出，以反映对输入数据加工后的结果。没有输出的算法是毫无意义的。\n\
    - (5) 可行性(Effectiveness)：算法中执行的任何计算步骤都可以被分解为基本的可执行的操作步骤，即每个计算步都可以在有限时间内完成(也称之为有效性)。\n\
    \n另外，算法还具备两个要素：\n\n(1) 数据对象的运算和操作：计算机可以执行的基本操作是以指令的形式描述的。一个计算机系统能执行的所有指令的集合，成为该计算机系统的指令系统。一个计算机的基本运算和操作有如下四类：①\
    \ 算术运算，加、减、乘、除等运算；② 逻辑运算，或、且、非等运算；③ 关系运算，大于、小于、等于、不等于等运算；④ 数据传输，输入、输出、赋值等运算。\n\
    \n(2) 算法的控制结构：一个算法的功能结构不仅取决于所选用的操作，而且还与各操作之间的执行顺序有关。\n\n另外关于算法的理解就是解决问题的方法，通过不同的算法，有不同的解决问题的简便方式，从各个方面优化解决问题的方式。而一个算法的质量优劣将影响到算法乃至程序的效率。算法分析的目的在于选择合适算法和改进算法。一个算法的评价主要从时间复杂度和空间复杂度来考虑。\n\
    \n(1) 时间复杂度：算法的时间复杂度是指执行算法所需要的计算工作量。一般来说，计算机算法是问题规模 n 的函数 f(n)，算法的时间复杂度也因此记作：\n\
    \n```\nT(n) = O[f(n)]\n```\n\n因此，问题的规模 n 越大，算法执行的时间的增长率与 f(n) 的增长率正相关，称作渐进时间复杂度。\n\
    \n(2) 空间复杂度：算法的空间复杂度是指算法需要消耗的内存空间。其计算和表示方法与时间复杂度类似，一般都用复杂度的渐近性来表示。与时间复杂度相比，空间复杂度的分析要简单得多。\n\
    \n- (3) 正确性：算法的正确性是评价一个算法优劣的最重要的标准。\n- (4) 可读性：算法的可读性是指一个算法可供人们阅读的容易程度。\n- (5)\
    \ 健壮性：健壮性是指一个算法对不合理数据输入时的反应能力和处理能力，也称为容错性。\n\n### [实例 1] 狼、羊和卷心菜的过河游戏\n\n在一河岸有狼、羊和卷心菜，农夫要将它们渡过河去，但由于他的船太小，每次只能载一样东西。并且，当农夫不在时，狼会把羊吃掉，而羊又会把卷心菜吃掉。问农夫如何将它们安全渡过河去？（游戏规则：没有农夫看管的时候，狼会吃羊，而羊会吃卷心菜。）\n\
