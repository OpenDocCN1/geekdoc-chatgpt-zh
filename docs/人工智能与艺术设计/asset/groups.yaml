    ## 7 智能系统与智能社会


    ### 7.1 专家系统


    专家系统是早期人工智能的一个重要分支,它可以被看作是一类具有专门知识和经验的计算机智能程序系统,一般采用人工智能中的知识表示和知识推理技术来模拟通常由领域专家才能解决的复杂问题。专家系统可以定义为使用人类专家推理的计算机模型来处理现实世界中需要专家做出解释的复杂问题,并得出与专家相同的结论。简单来说,专家系统=知识库+推理机,知识库是专家的知识在计算机中的映射,推理机是利用知识进行推理的能力在计算机中的映射,构造专家系统的难点也是这两个方面,如图
    7-1 所示,因此专家系统也被称为基于知识的系统。它是一个具有大量的专门知识与经验的程序系统,应用于人工智能技术和计算机技术。近三十年来人工智能获得了迅速的发展,在很多学科领域都得到了广泛应用,并取得了丰硕成果。专家系统是人工智能一个重要的分支,是在


    ![](img/f188b68deb37acb6105ba97c814d9af2_150_0.png)


    20 世纪 60 年代初期产生并发展起来的一门新兴的应用科学,而且正随着计算机技术的不断发展而日臻完善和成熟。1982 年,美国斯坦福大学教授费根鲍姆给出了专家系统的又一定义:“专家系统是一种智能的计算机程序。这种程序使用知识与推理过程,求解那些需要杰出人物的专门知识才能求解的复杂问题。”一般认为,专家系统就是应用于某一专门领域,由知识工程师通过知识获取手段,将领域专家解决特定领域问题的知识,采用某种知识表示方法编辑或自动生成某种特定表示形式存放在知识库中;然后用户通过人机接口输入信息、数据或命令,运用推理机构控制知识库及整个系统,能像专家一样解决困难的和复杂的实际问题的计算机(软件)系统。


    从 20 世纪 60 年代开始,专家系统的应用产生了巨大的经济效益和社会效益,已成为人工智能领域中最活跃、最受重视的领域。我们可以从其结构、类型、功能等几个方面来了解和认识专家系统。


    ### 7.1.1 专家系统的结构


    专家系统通常由知识库、推理机、人机交互界面、解释器、综合数据库、知识获取等 6 个部分构成。专家系统的基本结构大部分为知识库和推理机。其中知识库中存放着求解问题所需的知识，推理机负责使用知识库中的知识去解决实际问题。知识库的建造需要知识工程师和领域专家相互合作把领域专家头脑中的知识整理出来，并用系统的知识方法存放在知识库中。当解决问题时，用户为系统提供一些已知数据，并可从系统处获得专家水平的结论，如图
    7-2 和图 7-3 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_151_0.png)


    ![](img/f188b68deb37acb6105ba97c814d9af2_151_1.png)


    ### 图 7-2 专家系统结构图


    ### 图 7-3 基于 Web 的专家系统结构


    知识库是用来存放专家提供的知识的。专家系统的问题求解过程是通过知识库中的知识来模拟专家的思维方式，因此，知识库是专家系统质量是否优越的关键所在，即知识库中知识的质量和数量决定着专家系统的质量水平。一般来说，专家系统中的知识库与专家系统程序是相互独立的，用户可以通过改变、完善知识库中的知识内容来提高专家系统的性能。人工智能中的知识表示形式有产生式、框架、语义网络等，而在专家系统中运用得较为普遍的知识是产生式规则。产生式规则以
    IF···THEN···的形式出现，就像 BASIC 等编程语言里的条件语句一样，IF 后面跟的是条件，THEN 后面跟的是结论，条件与结论均可以通过逻辑运算
    AND、OR、NOT 进行复合。在这里，产生式规则的理解非常简单——如果前提条件得到满足，就产生相应的动作或结论。


    推理机针对当前问题的条件或已知信息，反复匹配知识库中的规则，获得新的结论，以得到问题求解结果。在这里，推理方式可以有正向和反向推理两种。正向推理是从条件匹配到结论，反向推理则先假设一个结论成立，看它的条件有没有得到满足。由此可见，推理机就如同专家解决问题的思维方式，知识库就是通过推理机来实现其价值的。


    人机界面是系统与用户进行交流时的界面。通过该界面，用户输入基本信息、回答系统提出的相关问题，并输出推理结果及相关的解释等。


    综合数据库专门用于存储推理过程中所需的原始数据、中间结果和最终结论，往往是作为暂时的存储区。


    解释器能够根据用户的提问，对结论、求解过程做出说明，因而使专家系统更具有人

