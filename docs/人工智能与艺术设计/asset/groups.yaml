    人可以直观地感知如他人的感情，而计算机需要通过相机，首先进行人脸检测，再提取表情特征，最后和数据库中数据进行比对，从而识别表情，如图 4-13 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_1.png)


    图 4-13 人脸表情识别原理


