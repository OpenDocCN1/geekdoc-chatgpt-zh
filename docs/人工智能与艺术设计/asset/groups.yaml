    Luo Head,其头部具有 36 个自由度,可实现眉毛、嘴巴和眼睛的动作控制,其外形及表情模仿能力优异。2011 年,西安超人高仿真机器人科技有限公司研制出具有高仿真智能表演能力的机器人“李咏
