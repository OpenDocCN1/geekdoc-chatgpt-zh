    ### 1.3.4.6 前沿六——“小数据”


    另外一个领域对人工智能来说是“小数据”。那些大公司，他们处于领先的地位，像百度、谷歌、微软这些公司拥有大量的数据。人工智能的一个课题就是神经网络课程，其实需要很多的培训，需要很多的数据点，很多的例子，甚至数十亿的数据。神经网络的存在有60年了，直到我们能够大规模利用它们的时候，利用这些数十亿样品培训人工智能，这些神经网络才会变成有用的。


    今天，你要做人工智能的话，你需要很多的样品和很多的数据。如果你想让人工智能学习，比如说让它能识别猫、狗的差别，其实你需要做的就是给它数百万像猫、狗这样的例子，数百万的猫、狗的照片。成千上万之后，它就能够开始识别了。它看到猫就能够识别出它是一只猫，所以你要有很多的数据让它学习。


