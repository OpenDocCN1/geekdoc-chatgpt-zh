    ## 1 概述


    人工智能(Artificial Intelligence)的英文缩写为 AI。它是研究开发用于模拟、延伸和拓展人的智能的理论、方法、技术及应用系统的一门新的技术科学。近年来，“人工智能”逐渐成为热点话题。人工智能是一门极富挑战性的科学，研究人工智能首先必须要懂得计算机科学、心理学和哲学。人工智能是一门十分广泛的科学，涉及不同的领域，如机器学习、计算机视觉等。总的来说，人工智能研究的一个主要目标是使机器能够胜任一些通常需要人类智能才能完成的复杂工作。不同的时代、不同的人对这种“复杂工作”的理解是不同的。


    ### 1.1 人工智能的学科内涵


    #### 1.1.1 学科概念


    人工智能的定义可以分为两部分，即“人工”和“智能”。“人工”比较好理解，争议性也不大。有时我们会考虑什么是人能够制造的，或者人自身的智能程度有没有高到可以创造人工智能的地步等。但总的来说，“人工系统”就是通常意义下的人工系统。


    关于什么是“智能”，问题就多了。这涉及其他诸如意识、自我、思维（包括无意识的思维）等问题。人唯一了解的智能是人本身的智能，这是大家普遍认同的观点。


    “智能”概念最早可追溯到 17 世纪莱布尼茨有关智能的设想。首先是对“Intelligence”的一种重要区分，即强调计算机与信息科学、数学和生物学（泛指应用科学、技术、工程）等语境下的“智能”，如机器智能、类人类（水平）智能，并非仅仅是心理学范畴下的“智力”或自然智能。


    《计算机与通信词典》(Computer Science and Communications)对“Intelligence”一词做出了科学规范的概念解释：（1）源于各种资源汇集而成的信息；（2）有用的、确证的、经处理过的以及在时效基础上可实现的信息。这一解释将“Intelligence”指向信息本体，技术背景下的“智能”在本体论上是信息处理的一种特殊形式。


    从自然意义上而言，自然智能即指人类通过自身智力，收集和处理不确定信息并输出新信息以改变基本生存需求，是人类在本体（或近体环境）上实现自身智力的信息处理过程，是人对人本身的信息反馈。


    从技术意义上而言，智能虽然同样需要人类通过自身智力对信息源进行处理，但是其输入、输出对象不再是人类本体，而是无生命的机器或者类生命体。这要求人们对自身智力有全面的认识，能够将这种全面的认识赋予机器或者类生命体，创造出智能机或者智能体，实现人机或机机交互的智能表现。就目前的科学技术发展和人类对认知能力的挖掘，技术智能实现正走向类人或无限接近人类水平的智能体。


    美国斯坦福大学著名的人工智能研究中心尼尔逊（Nilsson）教授对人工智能下了这样一个定义：“人工智能是关于知识的学科——怎样表现知识以及怎样获得知识并科学地使用知识。”而另一名著名美国麻省理工学院的
    Winston 教授认为：“人工智能就是研究如何使计算机去做过去只有人才能做的智能的工作。”这些说法反映了人工智能学科的基本思想和基本内容。即人工智能是研究人类智能活动的规律，构造具有一定智能的人工系统，是研究如何让计算机去完成以往需要人的智力才能胜任的工作，也就是研究如何应用计算机的软硬件来模拟人类某些智能行为的基本理论、方法和技术。


    ### 1.1.2 学科定位


    人工智能作为研究机器智能和智能机器的一门综合性高技术学科，产生于 20 世纪 50 年代，它是一门涉及心理学、认知科学、思维科学、信息科学、系统科学和生物科学等多学科的综合型技术学科，目前已在知识处理、模式识别、自然语言处理、博弈、自动定理证明、自动程序设计、专家系统、知识库、智能机器人等多个领域取得举世瞩目的成果，并形成了多元化的发展方向。


    ### 1.1.3 学科功能及相关性


    人工智能是计算机学科的一个分支，20 世纪 70 年代以来被称为世界三大尖端技术（空间技术、能源技术、人工智能）之一，也被认为是 21 世纪三大尖端技术（基因工程、纳米科学、人工智能）之一。人工智能在很多学科领域都得到了广泛应用，并取得了丰硕的成果，已逐步成为一个独立的分支，在理论和实践上都已自成一个系统。


    人工智能是研究用计算机来模拟人的某些思维过程和智能行为（如学习、推理、思考、规划等）的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机、使计算机能实现更高层次的应用。人工智能涉及计算机科学、心理学、哲学和语言学等学科，可以说几乎包括自然科学和社会科学的所有学科，其范围已远远超出了计算机科学的范畴，人工智能与思维科学的关系是实践和理论的关系，人工智能处于思维科学的技术应用层次，是它的一个应用分支。从思维观点看，人工智能不仅限于逻辑思维，要考虑形象思维、灵感思维才能促进人工智能突破性的发展。数学常被认为是多种学科的基础学科，不仅在标准逻辑、模糊数学等范围发挥作用，数学也进入人语言、思维领域，同样，数学也进入了人工智能学科，人工智能学科也必须借用数学工具，它们将互相促进从而更快地发展。


    当我们讨论智能的意义是什么，或者说涉及智能的特点和标准在哪里的时候，但凡有科学技术背景的研究者都会不约而同地提起“艾伦·图灵”这个名字，其在智能科学技术领域的地位已无须多言。一般来说，人们对图灵机的创造以及图灵检验有较为统一的认识，即智能的标准。在现代智能概念形成的初期，图灵在其最重要的文章中写道：“我建议来考虑这个问题：机器能思考吗？”图灵的真正目的是找到一个可操作（关于智能存在）的标准（当然这个标准至今依然被认为是唯一的可行标准）：如果一台机器“表现得”和一个能思考的人类一样，那么我们就几乎可将之认定为是在“思考”的。如此，智能概念的意义从人的智能延伸到了机器表征，使其通过信息处理和计算分析与人的智能相互联系。


    “机器学习”的数学基础是统计学、信息论和控制论，还包括其他非数学学科。这类“机器学习”对“经验”的依赖性很强。计算机需要不断从解决一类问题的经验中获取知识，学习策略，在遇到类似的问题时，运用经验知识解决问题并积累新的经验，就像普通人一样。我们可以将这样的学习方式称为“连续型学习”。但人类除了会从经验中学习之外，还会创造，即“跳跃型学习”，这在某些情形下被称为“灵感”或“顿悟”。一直以来，计算机最难学会的就是“顿悟”。或者再严格一些来说，计算机在学习和“实践”方面难以学会“不依赖于量变的质变”，很难从一种“质”直接到另一种“质”，或者从一个“概念”直接到另一个“概念”。正因为如此，这里的“实践”并非同人类一样的实践。人类的实践过程同时包括经验和创造，这是智能化研究者梦寐以求的东西。


    人工智能在计算机领域得到了愈加广泛的重视，并在机器人、经济政治决策、控制系统、仿真系统中得到应用。


    ## 1.2 人工智能的学科发展历史


    自古以来，人类就力图根据自己的认识水平和当时的技术条件，试图用机器来代替人进行部分脑力劳动，以提高人类自身征服自然的能力。公元 850 年，古希腊就有制造机器人帮助人们劳动的传说。在我国，公元前
    900 多年，也有歌舞机器人传说的记载，这说明古代人类就有人工智能的幻想。随着历史的发展，12 世纪末至 13 世纪初，西班牙的神学家和逻辑学家 Romen
    Luee 试图制造能解决各种问题的通用逻辑机。17 世纪法国物理学家和数学家 B. Pascal 制成了世界第一台会演算的机械加法器并投入实际应用。随后德国数学家和哲学家莱布尼茨在这台加法器的基础上发展并制成了进行全部四则运算的计算器。他还提出了逻辑机的设计思想，即通过符号体系，对对象的特征进行推理，这种“万能符号”和“推理计算”的思想是现代化“思考”机器的萌芽，因而他被后人誉为数理逻辑的第一个奠基人。接着，英国数学家和逻辑学家
    Boole 初步实现了莱布尼茨关于思维符号化和数学化的思想，提出了一种崭新的代数系统，这就是后来在计算机上广泛应用的布尔代数。19 世纪末，英国数学家和力学家
    C. Babbage 致力于差分机和分析机的研究，虽因条件限制未能完全实现，但其设计思想为当年人工智能的最高成就。


    ### 1.2.1 人工智能的萌芽


    进入 20 世纪后，人工智能相继出现若干开创性的工作。1936 年，年仅 24 岁的英国数学家（A.M. Turing）在他的一篇《理想计算机》的论文中，就提出了著名的图灵机模型，1945
    年他进一步论述了电子数字计算机的设计思想，1950 年他又在《计算机能思维吗？》一文中提出了机器能够思维的论述，可以说这些都是图灵为人工智能所做的杰出贡献。1946
    年，美国科学家 J.W. Mauchly 等人制成了世界上第一台电子数字计算机 ENIAC，随后又有不少人为计算机的实用化不懈奋斗，其中贡献卓著的应当是冯·诺依曼(von
    Neumann)。目前世界上占统治地位的计算机依然是冯·诺依曼计算机。电子计算机的研制成功是许多代人坚持不懈努力的结果，这项划时代的成果为人工智能研究奠定了坚实的物质基础。同一时期，美国数学家
    N. Wiener 创立了控制论，美国数学家 C.E. Shannon 创立了信息论，英国生物学家 W.R. Ashby 设计的脑模型等，这一切都为人工智能学科的诞生做出了理论和实验工具上的巨大贡献。


    ### 1.2.2 人工智能的积累


    1956 年夏季，在美国达特茅斯学院(Dartmouth College)，由青年数学助教 J. McCarthy 和他的三位朋友 M. Minsky、N.
    Rochester 和 C. Shannon 共同发起，邀请 IBM 公司的 T. Moore 和 A. Samuel、MIT 的 O. Selfridge
    和 R. Solomonoff，以及 RAND 公司和卡内基·梅隆大学的 A. Newell 和 H.A. Simon 等人参加夏季学术讨论班，历时两个月。这十位学者都是在数学、神经生理学、心理学、信息论和计算机科学等领域从事教学和研究工作的学者，在会上他们第一次正式使用了
    AI 这一术语，从而开创了人工智能的研究方向。这次历史性的聚会被认为是人工智能学科正式诞生的标志，从此在美国形成了以人工智能为研究目标的几个研究组，如 Newell
    和 Simon 的 Carnegie-RAND 协作组，Samuel 和 Gelernter 的 IBM 公司工程课题研究组，Minsky 和 McCarthy
    的 MIT 研究组等。


    这一时期人工智能的主要研究工作有以下几个方面。1957 年，A. Newell、J. Shaw 和 H. Simon 等人的心理学小组编制出一个称为逻辑理论机(The
    Logic Theory Machine, LT)的数学定理证明程序，当时该程序证明了 B.A.W. Russell 和 A.N. Whitehead 和《数学原理》一书第二章中的
    38 个定理。后来他们又揭示了人在解题时的思维过程大致可归结为三个阶段：(1) 先想出大致的解题计划；(2) 根据记忆中的公理、定理和推理规则组织解题过程；(3)
    进行方法和目的的分析，修正解题计划。


    不仅解数学题时的思维过程如此，解决其他问题时的思维过程也大致如此。基于这一思想，他们于 1960 年又编制了能解十种不同课题类型的通用问题求解程序 GPS(General
    Problem Solving)，另外他们还发明了编程的表处理技术和纽厄尔—肖—西蒙(NSS)国际象棋机。和这些工作有联系的 Newell 关于自适应象棋机的论文和
    Simon 关于问题求解和决策过程中合理选择和环境影响的行为理论的论文，也是当时信息处理研究方面的巨大成就。


    1956 年，Samuel 研究的具有自学习、自组织、自适应能力的西洋跳棋程序是 IBM 小组进行的颇具影响力的一项工作，这个程序可以像一个优秀棋手那样，向前看几步来下棋。它还能学习棋谱，在分析大约
    175000 盘不同棋局后，可猜测出书上所有推荐的走法，准确率达 48%，这是机器模拟人类学习过程卓有成就的探索。在 1959 年这个程序曾战胜设计者本人，在
    1962 年还击败了美国一个州的跳棋大师。1959 年，MIT 小组 McCarthy 发明的表(符号)处理 LISP(LISt Processing)语言，成为人工智能程序设计的主要语言，至今仍被广泛采用。1958
    年 McCarthy 建立的行动计划咨询系统以及 1960 年 Minsky 的论文《走向人工智能的步骤》，对人工智能的发展都起了积极的作用。此外，1956
    年 N. Chomsky 的文法体系，1958 年 Selfridge 等人的模式识别系统程序等，都对人工智能的研究产生了有益的影响。这些早期成果，充分表明人工智能作为一门新兴学科正在茁壮成长。


    20 世纪 60 年代以来，人工智能的研究活动越来越受到重视。为了揭示智能的有关原理，研究者们相继对问题求解、博弈、定理证明、程序设计、机器视觉、自然语言理解等领域的课题进行了深入的研究。四十多年来，不但对课题的研究有所扩展和深入，而且还逐渐搞清了这些课题共同的基本核心问题以及它们和其他学科间的相互关系。


    1974 年，N.J. Nilsson 对人工智能发展时期的一些工作写过一篇综述论文，他把人工智能的研究归纳为四个核心课题和八个应用课题。这四个具有一般意义的核心课题是：(1)
    知识的模型化和表示方法；(2) 启发式搜索理论；(3) 各种推理方法(演绎推理、规划、常识性推理、归纳推理等)；(4) 人工智能系统结构和语言。而八个应用课题是：(1)
    自然语言理解(Natural Language Understanding)；(2) 数据库的智能检索(Intelligent Retrieval from
    Database)；(3) 专家咨询系统(Expert Consulting Systems)；(4) 定理证明(Theorem Proving)；(5)
    博弈(Game Playing)；(6) 机器人学(Robotics)；(7) 自动程序设计(Automatic Programming)；(8) 组合调度问题(Combinatorial
    and Scheduling Problems)。


    这些课题的新成果极大地推动了人工智能应用课题的研究。这一时期学术交流的发展对人工智能的研究有很大的推动作用。


    1969 年，国际人工智能联合会成立(International Joint Conference on Artificial Intelligence)，并举行了第一次学术会议——IJCAI-69。随着人工智能研究的发展，1974
    年又成立了欧洲人工智能学会 ECAI(European Conference on Artificial Intelligence)，并召开第一次会议。此外，许多国家也都有本国的人工智能学术团体。在人工智能刊物方面，Elsevier
    Science 发行了《国际性期刊》(Artificial Intelligence)，爱丁堡大学还不定期出版杂志 Machine Intelligence，还有
    IJCAI 会议文集，ECAI 会议文集等。另外许多国际知名刊物也刊载了有关人工智能的文章。


    ### 1.2.3 人工智能的成熟


    20 世纪 90 年代以来，人工智能研究出现了新的高潮。这一方面是因为人工智能在理论方面有了新的进步，另一方面是因为计算机硬件突飞猛进的发展。随着计算机速度的不断提高，存储容量的不断扩大，价格的不断降低，以及网络技术的不断发展，许多原来无法完成的工作现在已经能够实现。因此，人工智能研究也就进入繁荣期。目前人工智能研究的三个热点是智能接口、数据挖掘、主体及多主体系统，其中某些技术已经得到实用。技术的发展总是超乎人们的想象，从目前的一些前瞻性研究可以看出来未来人工智能可能会朝以下几个方面发展：模糊处理、并行化、神经网络和机器情感。人工智能一直处于计算机技术的前沿，人工智能研究的理论和发现在很大程度上将决定计算机技术的发展方向。今天，已经有很多人工智能研究的成果进入人们的日常生活。将来，人工智能技术的发展将会给人们的生活、工作和教育等带来更大的影响。


    ## 1.3 人工智能的学科展望


    2016 年 10 月，美国白宫科技政策办公室（the White House Office of Science and Technology Policy,
    OSTP）相继发布了两份关于人工智能领域的美国国家战略报告——《国家人工智能发展与研究战略计划》（The National Artificial Intelligence
    Research and Development Strategic Plan）及《为人工智能的未来做好准备》（Preparing for the Future
    of the Artificial Intelligence），标志着作为世界上最有影响力、最发达国家的美国，开始了面向人工智能时代的努力。人类发展的历史表明，任何一种划时代的技术都会对文明的演化产生深刻乃至决定性的影响。


    ### 1.3.1 人工智能与其他学科的关系


    AI 涉及计算机科学、控制论、信息论、神经心理学、哲学及语言学等多个学科，是一门新理论和新技术不断出现的综合性边缘学科。AI 与思维科学是实践和理论的关系，属于思维科学的技术应用层次，延伸人脑的功能，实现脑力劳动的自动化。


    作为一门多学科交叉的人工智能，AI 在机器学习、模式识别、机器视觉、机器人学、航空航天、自然语言理解、Web 知识发现等领域取得了突破性进展。人工智能的研究方法、学术流派、理论知识非常丰富，应用领域十分广泛。


    AI 的知识体系（见表 1-1，表 1-2）从思维观点上看，AI 不仅仅限于逻辑思维，同时需要形象思维和灵感思维。AI 是一个庞大的家族，包括众多的基础理论、重要的成果及算法、学科分支和应用领域等。如果将
    AI 家族作为一棵树来描述，智能机器应作为树的最终节点。可将 AI 划分为问题求解、知识与推理、学习与发现、感知与理解、系统与建造等五个知识单元，该划分总结了
    AI 家族的知识体系及其相关的学科、理论基础、代表性成果及方法。


