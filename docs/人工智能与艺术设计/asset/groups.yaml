    ## 1.3.4.10 前沿十——从人工智能到人工智能


    从这个边界角度来讲，我们需要构建人工智能的网络，尤其是有相似功能的人工智能。像脸谱网有 20 亿人的链接，这种合作达到一定的层级，它的分享也是全球层面进行的合作和共享。


    这是一个前沿，我们从来没有到那里去过。可以看到日常生活当中，我们能够使用技术工具，互相合作，更大规模地实施动态协作，这是 20 年前不可能想象的。


    人工智能也是一个不断改善的过程，将会有更多人愿意用人工智能，然后它是一个良性循环，我们也希望用人工智能编程另外一个人工智能，这是一个加速化的过程。我们总是认为人工智能尚未开始，在
