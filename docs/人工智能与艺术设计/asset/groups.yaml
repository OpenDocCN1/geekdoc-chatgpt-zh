    n 的话，那么平均需要计算 n/2 计算步，因此算法的计算复杂性为 0(n)。


    实际上，该算法中 while 语句就是一个迭代结构，而其中的指令“TestEntry <- 在 list 中选择下一个表项”以重复的方式被执行。


    通常，一条或一组指令的重复使用方式称为循环的迭代代码。这样的结构一般由两个部分组成：循环体和循环控制条件。在上述顺序查找算法中，是通过 while 语句来实现这样的迭代结构，其循环控制过程是检查条件、执行循环体、检查条件、执行循环体……直到条件为假。


    一般，循环控制由状态初始化、条件检查和状态修改三个环节部分组成，其中每个环节都决定着循环的成败与否。其中状态初始化设置一个初始状态，并且这一状态是可以被修改的，直到满足终止条件；条件检查是将当前状态与终止条件比较，如果符合就终止循环；状态修改就是对当前状态进行有规律地改变、使其朝着终止条件发展。比如在顺序查找算法中，实现状态初始化的语句就是


    ```

    TestEntry <- 在 list 中选择第一个表项

    ```


    条件检查部分是


    ```

    TargetValue > TestEntry 且 TestEntry 不是最后一个表项

    ```


    而状态修改部分则是


    ```

    TestEntry <- 在 list 中选择下一个表项

    ```


    这样，三个部分的联合就构成了一个循环迭代代码。图 3-9 给出了 while 循环迭代代码结构及其对应的 N - S 盒图表示。


