    式、被动式的等待阅读方式，设计师要更加主动地将信息分享给受众。例如，一个产品希望得到更好的宣传和推广，从品牌标志、产品外观、宣传海报到展示网站、微信版式等都需要艺术设计来展现。


    艺术设计是 IT 技术、生产工艺和艺术创意相结合的综合体现，设计作品的创意形象、色彩搭配、版式排列，甚至使用的不同材质，都可以通过视觉对观看者的心理产生触动。一个优秀的商业广告设计可以通过创意突出产品特性，反映产品内在的质量和品质；一个具有创意的公益海报可以传达良好的生活理念或政治思想；同样，一个好的互动设计可以增强受众的直观感受，提高参与度，使其对作者要表达的内容有更深入的了解，引导其做出消费或者行为选择。人们购买一种产品或者认同一种理念，是对诸多影像、文字的一系列认知与感受的结果。例如，人们要选择一种商品或者服务，往往希望物美价廉，而“物美”是通过商品或者服务的品质、外观设计展现出来的。消费者通过艺术设计的载体认知、了解产品，从而产生信任，最终支配购买行为。所以说艺术设计是为商业社会服务的，整个过程也是艺术设计的商业价值所在。在创作手段和表现形式上，艺术设计不断与新技术融合。互动式设计、动态式海报、翻阅式文本等手机移动终端上的新媒体应用已经很好地结合到艺术设计中；静态的纸质海报被电子屏广告牌、车载电视、平板电脑、手机屏幕等载体所取代；地铁、公交车上随时可见的传播载体已成为乘客路途中的消遣；商场外平面的巨型喷绘在移动电视里不断重复播出，或是在手机屏幕上反复出现。当人们通过不同的手机
