    # 7.1.4.2 建筑设计和优化


    建筑设计和优化是一项创造性的工作，需要考虑技术水平、经济效益、用户需求等因素，这些因素千头万绪，因此，经验对于设计人员来说是十分重要的，这一领域也吸引了许多研究人员对其进行专家系统的开发。


    宋应文研制开发的 IDSGI 地基处理智能辅助设计系统，可辅助岩土工程进行地基识别、选择和设计地基处理方案。李楚舒等开发了高层建筑结构初步设计专家系统（HIPRED），它是一个综合集成系统：通过人工神经网络（ANN）技术存贮专家的设计经验来确定高层建筑的结构体系；利用能连续化地反映高层建筑结构参数分布的基于悬臂梁的结构简化模型，并结合常微分方程求解器（COL
    - SYS）很好地从速度和精度两方面的匹配来进行力学反应分析；通过人机交互和知识库的引入，系统能够对设计的结构反应参数（位移、周期和地震力）做出评价并对结构做出相应的修改。HIPRED
    能够帮助设计者在一个较高的层次上进行高层建筑结构的初步设计。此外还开发了基于神经网络的高层建筑结构体系选择的专家系统，基于案例推理的高层建筑结构初步设计专家系统。冯俊强等针对基础方案选型知识的特点，开发出高层建筑基础方案选型专家系统，对高层建筑基础方案的选型进行咨询，辅助工程设计人员进行决策。李校兵等进行了基坑支挡结构设计专家系统的研究，开发研制了基坑支挡结构的计算机绘图子模块。彭观良以按耐久性设计混凝土为中心思想，研究了把各子系统集成为一个整体的混凝土安全性专家系统。马华建立了挡土墙设计专家系统，引入约束非线性离散变量优化与连续变量优化方法，建立了适用于重力式挡土墙设计的优化方法，并且开发了挡土墙优化设计软件。晏致涛研制开发出一个能够辅助工程设计人员进行基础选型及设计的智能决策支持系统——高层建筑基础设计智能决策支持系统（TBFIDSS），并通过工程实例验证了该程序的实用性、有效性和可靠性。


    此外，冯夏庭等开发了采矿巷道围岩支护设计专家系统。欧进萍等建立了高层钢筋混凝土结构抗震选型的模糊专家系统。王曙光等研究了在基坑工程设计中引入专家系统的可行性。许晋平研究了采用专家系统解决轻型门式刚架的设计及优化问题。杨石飞建立了基于范例推理的上海地区岩土工程优化设计（桩基）专家系统。潘昊等研究了钢管混凝土专家系统中的轴心受压构件的强度计算模块的功能及设计与实现问题。


    # 7.1.4.3 专家系统在其他领域的应用


    除了传统的领域外，专家系统在一些比较特殊的领域也取得了不少研究成果。


    吴景坤等在地质灾害诊治领域建立了滑坡识别与分类专家系统，该系统可以完成对滑坡的识别和分类工作。常春等开发了露天矿边坡稳定性分析集成智能系统，对边坡稳定性进行综合分析与判断，提高了边坡稳定性分析的合理性与可靠性。


    高岗等开发了拆除爆破设计的智能系统。叶海旺等开发了拆除爆破专家系统，该系统由四大模块组成：板（块）体拆除爆破、楼房框架拆除爆破、高耸建筑物拆除爆破、薄壁容器类构筑物拆除爆破。舒思齐等开发了高耸建筑物控制爆破拆除的可视化设计系统。周建中从广义混合控制入手，基于模糊神经元的抗震结构智能混合控制，建立了抗震结构智能混合控制方案选择模糊专家系统的基本理论。'
