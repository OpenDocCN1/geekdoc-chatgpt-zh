    条件语句可以给定一个判断条件,并在程序执行过程中判断该条件是否成立,根据判断结果执行不同的操作,从而改变代码的执行顺序,实现更多的功能。 VB 语言中的条件语句主要有
    If 语句和 SelectCase 语句两种。写程序时,常常需要指明两条或更多的执行路径,而在程序执行时,允许选择其中一条路径,或者说当给定条件成立时,则执行其中某语句。在高级语言中,一般都要有条件语句。


