    如今在智能交通领域中最炙手可热的莫过于无人驾驶技术了，无人驾驶汽车开发的关键技术主要有两个方面：车辆定位和车辆控制技术。这两方面相辅相成，共同构成无人驾驶汽车的基础。车辆定位技术是无人驾驶汽车行驶的基础，目前常用的技术包括磁导航和视觉导航等。其中，磁导航是目前最成熟可靠的方案，现大多数均采用这种导航技术。例如，荷兰阿姆斯特丹国际机场和鹿特丹的
    Park Shuttle 系统，上海交通大学的 Cyber C3 系统等。磁导航最大的优点是不受天气等自然条件的影响，即使风沙或大雪掩没路面，磁导航也一样有效。另外，通过变换磁极朝向进行编码，可以向车辆传输道路特性信息，诸如位置、方向、曲率半径、下一个道路出口位置等信息。但是，磁导航方法往往需要在道路上埋设一定的导航设备（如磁钉或电线），系统实施过程比较烦琐，且不易维护，变更运营线路需重新埋设导航设备。视觉导航就不存在这个问题。视觉导航的优点是车载计算机可以在试验样车偏离目标车道前，事先知道并预防其发生，同时当在高速公路使用视觉导航时，不需要对现有的道路结构改变，并且在混合交通中，也可使用；其缺点为，当风沙、大雾等自然因素致使能见度过低或路面上的白色标线不清晰时，导航系统会失效。视觉导航对基础设施的要求很低，被公认为是最有前景的定位方法。


    车辆控制技术是无人驾驶汽车的核心，主要包括速度控制和方向控制等几个部分。无人驾驶其实就是用电子技术控制汽车行进的仿人驾驶。通过对驾驶员的驾驶行为进行分析可知，车辆的控制是一个典型的预瞄控制行为，驾驶员找到当前道路环境下的预瞄点，根据预瞄点控制车辆的行为。目前最常用的方法是经典的智能
    PID 算法，例如模糊 PID、神经网络 PID 等。


    除以上两个方面，无人驾驶汽车作为智能交通系统的一部分，还需要一些其他相关技术的支持，如车辆调度系统、通信系统和人机交互系统等，最终得以实现整个交通系统的高效、安全。


    ### 7.2.3 智慧城市


    智慧城市就是运用信息和通信技术手段感测、分析、整合城市运行核心系统的各项关键信息，从而对包括民生、环保、公共安全、城市服务、工商业活动在内的各种需求做出智能响应。其实质是利用先进的信息技术，实现城市的智慧式管理和运行，进而为城市中的人创造更美好的生活，促进城市的和谐，可持续成长。


    随着人类社会的不断发展，未来城市将承载越来越多的人口。目前，中国正处于城镇化加速发展的时期，部分地区“城市病”问题日益严峻。为解决城市发展难题，实现城市可持续发展，建设智慧城市已成为当今世界城市发展不可逆转的历史潮流。


    智慧城市的建设在国内外许多地区已经展开，并取得了一系列成果，国内的如智慧上海、智慧双流；国外如新加坡的“智慧国计划”、韩国的“U-City 计划”等。


    智慧城市虽然涉及广泛，但它的一些核心内容，使其区别于其他城市发展理论和思路。这些核心内容，通常也是评价一个城市是否是智慧城市以及其“智慧”程度的主要指标。智慧城市至少包含以下六个核心方面：


    - (1) 智慧技术：指信息和通信技术以及大数据挖掘在城市基础设施和管理中的广泛应用。

    - (2) 智慧设施：包括但不限于通常的电信、通信、网络、市政、能源和交通等基础设施；镶嵌于各类城市基础设施以及交通工具上的智能设备以及与之相配套的智能卡；接收、处理、分析来自各类智能设施产生的实时数据的计算机和数据分析中心；大数据分享平台；与家用电器相配套的智能设备与遥控装置。

    - (3) 智慧人民：指在发展智慧城市的过程中增强城市个体的创造性、多样性以及持续学习的条件和能力。比如通过增加电脑拥有率和宽带的使用，让更多的市民方便地接触更多的信息和学习的机会。

    - (4) 智慧制度：指智慧技术和设施在政府管理和决策过程中的应用，比如电子政务、以城市大数据分析为基础的决策分析、以网络为基础的政务公开和公民参与决策等。

    - (5) 智慧经济：在智慧技术、设施、人民和制度的基础上发展知识和创新经济，提高生产效率，增加就业机会和灵活性，增强经济活力。

    - (6) 智慧环境：既包括可持续发展的绿色物质环境，也包括开放、包容以及有利于创新和学习的社会环境。


    智慧城市的这几个方面相互紧密联系，其中智慧技术和设施分别是技术和物质基础，智慧制度是提高城市管治效率的制度基础，而智慧经济和智慧环境是发展目标，智慧人民则是智慧城市的根本，通过其他几方面的建设提高人们的生活质量、人们的创造性以及持续学习的条件和能力，继而为其他几方面的建设和创新创造条件。


    智慧城市主要由数字城市和物联网、云计算三大类支撑技术组成。而将数字城市与物联网以及云计算技术结合起来所形成的智慧城市将具备以下特征：


    - (1) 智慧城市建立在数字城市的基础框架上。数字城市将城市中各类信息按照地理分布的方式统一建立索引和模型，为数字化的传感和控制提供了基础框架。智慧城市需要依托数字城市建立起来的地理坐标和城市中的各种信息（自然、人文、社会等）之间的内在有机联系和相互关系，增加传感、控制以及分析处理的功能。


    - (2) 智慧城市包含物联网和云计算。在有了基础框架后，智慧城市还需要进行实时的信息采集、处理分析与控制，如同人除了躯干外，还需要触觉、视觉等用于采集信息，需要大脑处理复杂的信息，需要四肢来执行大脑的控制命令。物联网和云计算就是实现这些功能的关键。物联网和云计算的核心和基础是互联网，其用户端延伸和扩展到了任何物品与物品之间，使他们相互进行信息交换和通信，弹性地处理和分析。


    智慧城市中的物联网和云计算应该包括以下四个方面：


    - ① 智能传感网。利用 RFID 和二维码等物联设施随时随地获取物体的信息和状态；

    - ② 智能安全网。通过在互联网、广播网、通信网、数字集群网等各类型网络中建立各类安全措施，将物体的信息和状态实时、安全地进行传递；

    - ③ 云计算智能处理。在云端采用各种算法和模型，对海量的数据和信息进行实时地分析和处理，为实时控制和决策提供依据；

    - ④ 智能控制网。采集的信息经过云端智能处理后，根据实际情况实时地对物体实施自动化、智能化的控制，更好地为城市提供相关服务。


    - （3）智慧城市面向应用和服务。智慧城市中的物联网包含传感器和数据网络，与以往的计算机网络相比，它更多的是以传感器及其数据为中心。与传统网络建立的基础网络适用于广泛的应用程序不同，由微型传感器节点构成的传感器网络一般则是为了某个特定的应用而设计的。通过无线或有线网络节点，相互协作地实时监测和采集分布区域内的各种环境或对象信息，并将数据交由云计算进行实时分析和处理，从而获得详尽而准确的数据和决策信息，并将其实时推送给需要这些信息的用户。


    - （4）智慧城市与物理城市融为一体。在智慧城市中，各节点内置有不同形式的传感器和控制器，可用以测量包括温度、湿度、噪声、位置、距离、光强度、压力、土壤成分、移动物体的大小和速度及方向等城市中的环境和对象数据，还可通过控制器对节点进行远程控制。随着传感器和控制器种类和数量的不断增加，智慧城市将城市与电子世界的纽带直接融入现实城市的基础设施中，自动控制相应城市基础设施，自动监控城市空气质量、交通状况等，与现实城市融为一体。


    - （5）智慧城市能实现自主组网和自维护。智慧城市中的物联网需要具有自组织和自动重新配置的能力。单个节点或者局部节点由于环境改变等原因出现故障时，网络拓扑应能根据有效节点的变化而自适应地重组，同时自动提示失效节点的位置及相关信息。因此，网络还应具备维护动态路由的功能，保证不会因为某些节点出现故障而导致整个网络瘫痪。


    ### 7.2.4 智能战争


    科幻电影《终结者》中，原本作为军方作战网络的“天网”在人工智能推动下逐渐具备了自我意识，因而演变成未来世界机器人的领袖，带领着掌握“开火权”的机器人肆意残害人类。场景虽然科幻，但也表现出人们对于智能化战争时代，对拥有高度智能的无人作战系统的深切担忧。


    人与武器的关系是军事领域亘古不变的重要话题。随着被誉为“人类智慧最后堡垒”的围棋领域被人工智能攻破，有理由相信人工智能技术及无人自主作战平台将成为新型颠覆性作战样式，以战斗机器人为代表的人工智能无人武器系统或将主宰未来战场。美国早在其《21世纪战略技术》中就直言：“20
    世纪的核心武器是坦克，21 世纪的核心武器是无人系统。”然而，如果赋予智能无人作战系统“生杀大权”，甚至实施完全是机器人士兵的“机器代理人战争”，拥有高度智能的无人作战系统或将把《终结者》等电影中的场景变为现实。除禁止使用“攻击性自主武器”外，避免无人作战系统拥有“开火权”，或将成为智能战争时代人类可行的“救赎”方式。


    在智能化感知与信息处理领域，人工智能可为指挥员理解战场态势提供信息和数据支撑。现代战争，战场态势高度复杂，瞬息万变，完全依赖人的认知去理解战场态势变得越来越困难。人工智能所具备的自我学习、认知和创造能力应用于智能化感知与信息处理，可以辅助指挥员透视复杂战场，敏捷高效地应对复杂战场局势。目前，美军、俄军、法军、德军等均装备了具有智能化信息感知与处理能力的数字化士兵系统，如美军的“奈特勇士”、俄军的“战士”等。数字化士兵系统主要指的是士兵的全套装备，一般由武器、综合头盔、计算机、通信、软件和防护、携行装备等组成，可大幅提高士兵的态势感知、战场协调、指挥控制、通信、进攻、防护能力。在其他应用上，2016
    年年初，美国国防部高级研究计划局通过自适应雷达对抗项目，研制出世界首款认知雷达电子战系统原型机。该系统可基于敌方无线电信号对抗敌方自适应雷达，感知周围环境并自动调整实施干扰。


    在智能化指挥控制辅助决策领域，各国军队通过开发各种军事信息系统，以构建功能强大的栅格化网络信息体系，协助指挥和决策。指挥员可以利用各种辅助决策系统迅速从海量信息中提取关键信息，获得指挥决策上的敏捷性优势。美空军参谋长表示，让机器人代替人对作战信息进行分析，把数据快速转化成决策级质量的信息是解决当前信息系统无法提供足够快速态势认知能力的关键。美空军为此开展了从数据到决策的实验项目。在具体应用上，2016
    年 6 月，美国辛辛那提大学开发的阿尔法超视距空战系统在空战模拟环境下，指挥仿真战斗机编队与经验丰富的人类飞行员进行模拟空战，获得全胜。该系统的核心是在超视距模拟空战数据分析方面，引入控制和遗传模糊算法，使得系统能够在与人类飞行员的无数次对抗中学习人类指挥决策经验，提取并生成决策机制。此外，美军建立网络司令部，研发了针对网络入侵的智能诊断信息系统，能够自动诊断网络入侵来源、已方网络受损程度和数据恢复能力。美陆军研制的陆军全球军事指挥控制系统，目前已经装备陆军航空部队运输直升机，可使直升机驾驶员与前线士兵保持联络，并指挥地面部队。


    在无人化军用平台领域，无人作战飞机、无人潜航器、战场机器人等基于人工智能的无人机器能够自动搜索和跟踪目标，自主识别地形并选择前进道路，独立完成侦察、补给、攻击等任务。目前，世界上已有
    70 多个国家的军队在发展无人化军用系统平台。其中，美军已经拥有 8000 多个空中无人系统，地面无人系统更是超过 1.2 万个，这些系统已经成为美军行动不可或缺的重要组成部分。除了耳熟能详的“全球鹰”“死神”等无人机，“肯包”“嗅弹”“利剑”等地面机器人也已投入到阿富汗和伊拉克战场实战当中。堪称第六代飞机的美军
    X-47 无人作战飞机已至少建造了两架原型机，并成功完成了夜航、航母起降和空中加油等试验。俄军无人战车技术发展迅猛，从瓦夏侦察机器人到最新型的打击地面无人战车，均已具备快速机动、远程侦察、情报处理、排雷破障和火力打击等支援与作战能力。


