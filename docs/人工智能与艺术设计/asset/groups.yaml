    图 3-17 汉诺塔问题算法的运行图解(设 n=3)


    方式称为递归语义结构的原因所在。


    在算法中,递归的思想非常重要,如果说对于计算能力而言,比的就是算法,那么对于算法而言,比的就是递归。从更为广泛的视野讲,递归也是大自然的一种普遍现象,从自然界的分形,到语言、音乐、绘画中的嵌套结构,无不体现着递归的本性。正是从这个意义上讲,通过递归计算,算法的方法可以被应用到自然与人文的各个方面,特别是被应用到智能问题的求解之中。


    ## 3.3 问题求解


    从人工智能初期的智力难题、棋类游戏、简单数学定理证明等问题的研究中开始形成和发展起来的一大类解题技术,简称解题,已形成一门独立的分支学科。解题技术主要包括问题表示、搜索和行动计划等内容。也有人对问题求解做更广泛的理解,即指为了实现给定目标而展开的动作序列的执行过程。这样,一切人工智能系统便都可归结为问题求解系统。


    问题求解系统一般由全局数据库、算子集和控制程序三部分组成。


    - (1) 全局数据库: 用来反映当前问题、状态及预期目标。所采用的数据结构因问题而异,可以是逻辑公式、语义网络、特性表,也可以是数组、矩阵等一切具有陈述性的断言结构。


    - (2) 算子集: 用来对数据库进行操作运算,算子集实际上就是规则集。


    - (3) 控制程序: 用来决定下一步选用什么算子并在何处应用。


    解题过程可以运用正向推理,即从问题的初始状态开始,运用适当的算子序列经过一系列状态变换直到问题的目标状态。这是一种自底向上的综合方法。也可以运用逆向推理,即从问题的目标出发,选用另外的算子序列将总目标转换为若干子目标,也就是将原来的问题归约为若干较易实现的子问题,直到最终得到的子问题完全可解。这是一种自顶向下的分析方法。A.纽厄尔和赫伯特·A.西蒙在通用解题程序
    GPS 中提出的手段——目的分析,则是将正向推理和逆向推理结合起来的一种解题技术。采用这种技术时,不是根据当前问题状态而是根据当前状态和目标状态间的差异,选用最合适算子去缩小这种差异(正向推理)。如果当前没有一个算子适用,那么就将现时目标归约为若干子目标(逆向推理),以便选出适用算子,依此进行,直到问题解决为止。人工智能许多技术和基本思想在早期的问题求解系统中便孕育形成,后来又有所发展。例如现代产生式系统的体系结构大体上仍可分为三部分。只是全局数据库采用了更复杂的结构(例如黑板结构),用知识库取代了算子集,控制功能更加完善,推理技术也有所发展。


    ### 3.3.1 空间搜索


    首先让我们来看一个具体的八数码难题的智力问题。如图 3-18 所示,在 3 x 3 个方格画置入 1 到 8 这八个数码,问题要求对于任意事先设定的两种格局,你是否能单靠一步一步挪动数码(利用空格进行)来建立起从一种设定的格局转变为另一种设定格局的完整步骤。


    ![](img/f188b68deb37acb6105ba97c814d9af2_77_0.png)


    图 3-19 给出的就是图 3-18 的一种解题步骤,可以让机器自动去完成。这种解法的思想就是,我们对所有可能走出的格局全部依次列出,然后寻找一条能够在两种设定格局之间连接起来的途径,那么这条路径所经过的格局,依次就构成了沟通两种设定格局转变的完整步骤。就图
    3-18 所给出的问题来说,图 3-19 中按自上而下、自左向右次序排列的 S0 -> 3 -> 8 -> 16 -> Sg 构成的路径便是要求解的路径。


    在求解过程中使用规则来解题的办法是,从初始格局开始,运用所有可以运用的规则(当前的格局同规则左部的格局相同,则该规则就可以运用),去产生其全都可以产生的新格局(所运用规则右部的格局并未见于已有格局中),然后再对这些新格局的每一个,再重复同样的过程,直到不再有新的格局出现为止。这样就形成了所有从初始格局开始,运用规则所能产生的全体格局及其递推关系,我们称其为问题的状态空间。如果状态空间中出现了终结格局,那么从初始格局到终结格局的路径就构成了具体问题的一个解。当然如果状态空间中有多条通向终结格局的路径,那么就说明该问题有多种解。


    很显然,只要给出的具体格局之间有解的路径存在,那么采用上述策略,机器照样可以胜任工作,顶多花费多一点时间而已。但如果让人来进行足够大的数码问题的求解,不管你有多么快的思考速度,要按照这里的思路去解题,恐怕你会力不从心了。这其实就是人与机器在求解问题中的一个显著差别,当然也是机器所固有的一个最大优势:
    具有十分强大的计算和搜索能力。


    ![](img/f188b68deb37acb6105ba97c814d9af2_78_0.png)


    图 3-19 八数码问题的解题步骤


    利用状态空间搜索方法,原则上我们可以让机器解决一大类智力游戏问题。只要为机器找到反映问题本身状态(格局)及其变化规则,然后利用机器无比惊人的搜索能力去寻找解路径。例如一个稍微复杂的问题是寻找所谓“独立钻石棋”解的问题。如图
    3-20 所示,这是一个人独自下棋的游戏,在 33 个方格的棋盘上共有 32 个棋子,棋子的移动规则为: 一个棋子以竖直或水平方向跳过与其相邻的棋子且正好落于空位,那么就可以去掉那个被跳过的棋子(这一步骤称为吃子)。如果你通过不断运用这唯一的规则能将棋盘上的棋子吃剩一个并且刚好位于棋盘中央,那么你就获胜。用我们状态空间搜索的术语来讲,也就是说,问题的初始状态[图
    3-20(a)]是棋盘上除了中央位置外全都置满棋子;而终结状态刚刚好与初始状态相反,除了中央位置外,全都为没有棋子的空位。而要完成的任务就是运用唯一的一条规则,设法找出从初始状态走到终结状态的完整步骤。


    很明显,如果你真正理解了刚才数码问题的解题策略的话,那么你就可以如法炮制,通过找出所有可能到达终结状态的棋局状态的搜索来解决“独立钻石棋”的求解问题。


    图 3-21 给出了这一问题求解状态空间的一个片段。


    ![](img/f188b68deb37acb6105ba97c814d9af2_79_0.png)


    (a) 棋盘初始


    ![](img/f188b68deb37acb6105ba97c814d9af2_79_1.png)


    (b) 棋位编码


    图 3-20 独立钻石棋


    ![](img/f188b68deb37acb6105ba97c814d9af2_79_2.png)


    图 3-21 独立钻石棋局部状态空间搜索


    聪明的读者也许早已觉察到这种方法太机械蠢笨,许多绝对不可能获胜的状态棋局就根本没有必要去搜索和产生。确实如此,机器在解决问题时,同人类解决问题时所采用的那种审时度势和灵活应变的原则是大相径庭的。我的一位学生第一次下这种独立钻石棋时就是靠直觉判断和有方向的选择完成了问题的解。试想这位学生采用这种机械的搜索方法去搜索,那么恐怕劳其一生也未必能够找到通向成功的路径。


    当然,尽管机器有强大的搜索能力,但机器的计算速度总是有限的,特别是求解搜索空间特别庞大的问题。如何避免不必要的计算搜索也是机器要更好地解决实际问题所面临的课题。经过科学家们的研究,作为一种改进,原则上机器也可以变得稍许“聪明”一点,虽然仍难逃机械搜索的窠臼,但确实可以避免许多不必要的搜索;特别是那些会落入死胡同的路径,根本就不去搜索。


    为了做到这一点,在实际的机器算法实现中,对于任意一种棋局状态都先将其与终结状态进行比较,计算其间的差距,然后每次在向前生成新棋局状态时,只对最有希望(差距最小)的做进一步搜索发展,并依此类推,直到遇到终结状态为止。只有在最佳棋局搜索发展失败时,才去发展次佳棋局。如果为了保证不丢失正确的路径或多种解的可能,则要求能够判断出每个棋局状态是否为无效棋局,而搜索只在有效棋局间展开。这样一来就可以避免大量不必要状态的试探。


    用这种方法,就需要有对所解问题本身的了解并在大量经验或知识的基础上设计出能巧妙估算出当前棋局好坏标准的策略和估算方法。只有有了这样的保证,才能够更加有效地实现问题求解,最终获得成功的解。


    对于独立钻石棋,你当然可以采用这种新思想进行问题求解。鉴于涉及的技术过于专门化,我们就略去具体的算法而只给出用这种方法所得出的一个解为 5D,12L,3D,1R,18U,3D,30U,27L,13D,24R,27L,10R,12D,26L,23R,18D,31U,33U,22R,25L,32U,24L,21R,8R,10D,24L,7D,21R,23U,4D,15R。其中数码表示棋所在位置,字母
    D、U、R、L 分别表示棋子跳跃方向为向下、向上、向右和向左。感兴趣的读者不妨画一个棋单,用围棋子代替棋子试一试。


    ### 3.3.2 归结策略


    也许有的读者会问,如果实际问题比独立钻石棋问题还要复杂,那么机器又如何进行求解呢?当求解的问题非常复杂,如果依然能用机器去解,此时往往需要将问题分解为一些相互联系又相对独立的子问题,然后对这些子问题逐步进行求解,最后求得总问题的解决,这种策略就称为问题求解的归结策略。其思想是分阶段对相关联的子问题各个击破,最后得出问题的求解结果。


    用例子来说明这种归结方法的求解思路,如图 3-22 给出的是人工智能中很著名的“猴子与香蕉”问题。在一间房子里有一只猴子、一个箱子和一串香蕉,随意分布在各个位置上,问题是要让猴子在任何情况下都能吃到香蕉,猴子该怎么实现这个目标?


    现在假设猴子是一台机器,要让你编制一个程序,使得这台机器能通过搬动箱子和走动取到香蕉。这是一个较为复杂的问题,需要你深入熟悉的课划。由于没有明显直接地照搬状态空间搜索方法来解题的可能,因此必须首先将问题进行分解。很明显,只要做一些深入分析,你就可以发现,这个问题可以归结为如下
    4 个子问题:(1) 猴子从位置 a 走到位置 b;(2) 猴子把箱子从位置 b 推到位置 c;(3) 猴子爬上箱顶;(4) 猴子摘取香蕉。


    也就是说只要你将这 4 个子目标相继解决了,你就可以获得整个问题的解,这就是归结策略的思想。如果我们能够得到这 4 个子问题的一组解答,那么我们也就求得了原问题的解答。


    首先,可以用四元组来表示猴子—香蕉问题某时刻的状态:


    ```

    (W,x,Y,z)

    ```


    其中 W 表示猴子的水平位子(取值为 a,b,c),x 表示猴子是否位于箱子之上(取值 1 表示是,0 表示否),Y 表示箱子的水平位子(取值为 a,b,c),z
    表示猴子是否取到香蕉(取值 1 表示是,0 表示否)。


    然后给出求解猴子—香蕉问题的 4 种基本变换操作。相应的算符分别是 goto(U)、pushbox(V)、climbbox 和 grasp,定义如下:


    - (1) 移步[goto(U)]: (W,0,Y,z)→(U,0,Y,z);

    - (2) 推箱[pushbox(V)]: (W,0,W,z)→(V,0,V,z);

    - (3) 爬箱(climbbox): (W,0,W,z)→(W,1,W,z);

    - (4) 摘蕉(grasp): (c,1,c,0)→(c,1,c,1)。


    最后,在上述给出的基本状态描述和变换操作的定义之下,就可以采用归结方法求解猴子—香蕉问题,描述如下:


    - (1) 初始问题表示为


    ```

    ({a,0,b,0},F,G)

    ```


    其中 F=(f1.f2.f3.f4), f1 = goto(U), f2 = pushbox(V), f3 = climbbox, f4 = grasp;
    G 为结果求解步骤。


    - (2) 满足解的关键条件是末位状态变量的值为 1, 现初始状态显然不满足, 于是产生差别。解决的关键算符是 f4=grasp, 于是可用 f4 来归约初始问题,
    得到如下子问题:


    ```

    ({(a,0,b,0)},Gf,4)

    ({f4(s1)},G)

    ```


    其中 Gf,4 是适合于 f4 处理的状态集, 而 s1 为 Gf,4 中通过求解第一个子问题可以得到的状态。


    - (3) 进一步分析 s 与 Gf,4 之间的差别, 依次可以找到关键算符 f3,f2,f1, 最终可以归结为原子问题, 结果给出解序列为 {goto(b),
    pushbox(c), climbbox, grasp}。


    能够靠归结方法解决问题, 这就使得机器的解题能力大大提高, 解题范围扩大。即使是一个实际生活中的复杂问题, 你只要能够将其分解或归结为某些机器能够解决的子问题,
    那么原则上机器就可以解决这样的实际问题。


    ### 3.3.3 机器博弈


    博弈, 词语解释是局戎, 围棋, 赌博。现代数学中有博弈论, 亦名“对策论”“赛局理论”, 属应用数学的一个分支, 表示在多决策主体之间的行为具有相互作用时,
    各主体根据所掌握信息及对自身能力的认知, 做出有利于自己的决策的一种行为理论。目前在生物学、经济学、国际关系、计算机科学、政治学、军事战略和其他很多学科都有广泛的应用。博弈论主要研究公式化了的激励结构间的相互作用,
    是研究具有斗争或竞争性质现象的数学理论和方法, 也是运筹学的一个重要学科。


    什么是博弈论? 古语有云, 世事如棋。生活中每个人如同棋手, 其每一个行为如同在一张看不见的棋盘上布一个子, 精明慎重的棋手们相互揣摩, 相互牵制, 人人争赢,
    下出诸多精彩纷呈, 变化多端的棋局。博弈论是研究棋手们“出棋”招数中理性化、逻辑化的部分, 并将其系统化为一门科学。事实上, 博弈论正是衍生于古老的游戏或目博弈如象棋、扑克等。数学家们将具体的问题抽象化,
    通过建立自完备的逻辑框架、体系, 研究其规律及变化。这可不是件容易的事情, 以最简单的两人对弈为例, 稍想一下便知此中大有玄妙: 若假设双方都精确地记得自己和对手的每一步棋且都是最“理性”的棋手,
    甲出子的时候, 为了赢棋, 得仔细考虑乙的想法, 而乙出子时也得考虑甲的想法, 所以甲还得想到乙在想他的想法, 乙当然也知道甲想到了他在想甲的想法……面对如许重重迷雾,
    博弈论怎样着手分析解呢?


    人机博弈的典型案例: 塞穆尔的跳棋程序; 格林布莱特设计的国际象棋程序; IBM 公司研制的超级计算机“深蓝”; 谷歌人工智能围棋“AlphaGo”。


    几十年来, 古老的围棋游戏一直是计算机难以涉足的领域, 它的细微精妙使得人工智能在这方面远远落后于顶级的人类棋手。上一次, 当全世界的注意力聚焦在一块小小的棋盘上,
    是 1997 年。当年 5 月, IBM 的计算机“深蓝”打败了国际象棋世界冠军, 很多人因此失落,甚至产生了恐慌的情绪。但是,要知道,围棋相对于象棋来说,其变数又是另一个数量级,围棋棋盘横竖各有
    19 条线,共有 361 个落子点,双方交替落子,这意味着围棋总共可能有 10^171 种可能性。而宇宙中的原子总数是 10^80,即便穷尽整个宇宙的物质也不能存下围棋的所有可能性。这个来自中国的古老游戏,被很多人视为“智力巅峰”——其势万变,计算机不可挑战。


    2017 年,AlphaGo 登上 Nature 封面,其关注程度就已经引爆。我们来分析一下人类智慧代表李世石失败的原因,这可能要从阿尔法狗的运算原理入手:
    余凯认为,AlphaGo 的优势可能在于其应用了蒙特卡罗算法,这是应用于某些决策过程的搜索算法。“这种算法的特点是只要时间足够,它能穷尽所有对局的方案,让机器人充分学习。它突破了人类极限,让电脑不断进行自我对决并提升。”围棋的棋局中变数虽然大,但是最终还是有限的,而不是无穷大。


    另外,李世石接受采访时说:“如果对手是人,我倒不会这么费神地做准备,可是对手是机器,我必须设想我一个人孤单坐在那里的情景。和机器下棋心理战行不通,到头来我只能调节自己的心理。”对于人机博弈来说,本质上的差异也是不能忽略的:机器相对于人类,它不会有意识,“心理”不会波动,不会产生紧张的情绪;“身体”不会产生疲倦,可以对有限算法进行无限次地训练和计算。因此,对于“征服围棋”这个带有哲学色彩的命题来说,缺乏思想、道德感和哲学理念的
    AlphaGo 是难以真正实现的。


    对于人机大战中人类智慧连连失利的事实,人类朋友们紧张和恐惧的情绪再度升级。有网友发出感叹:“一场围棋人机大战,人类被逼到了墙角。”“人机大战,留给人类的时间还多吗?”种种说法,不禁让科幻迷们联想到科幻小说《三体》中外星人入侵地球前的“漫漫长夜”。但是我认为,AlphaGo
    虽然具有类似人类的判断力,在“千古无同局”,极端烧脑的围棋比赛中碾压了人类智慧,但是这种恐惧思想似乎有些过了头。


    一般我们认为促使人生爆发出能量的本源动力有三项: 欲望、理智与激情。这三项东西正好可以从人类的进化链条中提炼出来。基于理智衍生出来的东西可以是推理和计算,基于欲望和激情衍生出来的东西则是想象力、理想等。那么什么是人工智能呢?
    抽掉人的欲望和激情,再抽掉人的肉体限制并把剩下的理智力量无限放大,人工智能主要发展智能理智这一维度,并主要通过深度学习驱动,依赖于计算能力和大量数据。因此,基于数据和深度学习的人工智能更像是已知领域的专家,但并没能力像马克思那样去凭空创造出一个体系。归根结底,人工智能现在还只是一个机器,处于弱人工智能的阶段。人工智能现在还不能完成自我的进化,现在深度学习的方法只是对已知的数据去重复,泛化它,其实解决的还是已经有的问题。人工智能,即便在下棋方面赢了人类,但只是取代重复性的脑力劳动,能够解决的问题还是非常有限的。


    而 DeepMind(AlphaGo 的研究公司)创始人也表示: AlphaGo 距离人脑水平仍然相当遥远,可能还需要几十年。在赛前发布会上,谷歌董事长施密特表示,正是人类的努力才让人工智能有了现在的突破,输赢都是人类的胜利。“AlphaGo”作为来自人工智能领域的使者,它更像一个火种照亮了未来科技的发展方向。面对脑海中勾勒出的科幻景象,我们没有理由选择拒绝。当有朝一日动画片中的机器人暖男“大白”真实地走入每个人的生活时,那会是多么有趣的一件事。


