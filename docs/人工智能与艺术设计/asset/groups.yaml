    ## 4 模式识别与识别系统


    ### 4.1 模式识别概述


    #### 4.1.1 定义


    什么是模式？从广义上讲，模式是对存在于时空中的某种客观事物的描述。例如“水”是一种无色无味且透明的液体，“玻璃”是一种能透光且易碎的固体。这种对事物特征的描述是人在认识客观世界的过程中，对同类事物的多次感知经验中形成的，人将事物的这种描述存储记忆在大脑中。并以此为依据，对当下感知的事物进行判断，这实际就是一个模式识别的过程。


    我们可以这样给(人的)模式识别下一个定义：模式识别是对感知信息进行分析，并对感兴趣的对象进行判别的过程。人在日常生活、工作学习和社会活动中几乎无时无处不在进行着模式识别，我们阅读是在进行文字模式识别，听收音机是在进行语音模式识别，看电影是同时在进行视觉模式识别和语言模式识别。医生工作时要根据自己掌握的有关疾病的专业知识和经验，结合病人的实际情况和症状，判断病人所患的是何种疾病，并采取相应的治疗措施，整个过程就是对疾病的模式识别过程。


    作为高级智慧生物，人具有非凡的模式识别能力。我们能在多人说话的声音中准确地分辨熟人的声音；面对复杂的视觉场景，我们能在不经意的一瞥之中准确判断“这里是一辆汽车”“那里有一个行人”。可是，这些在我们看来如此容易的模式识别工作要让机器或计算机来完成，却会变得非常困难。如何让机器具有或部分具有人的识别能力？机器能在多大程度上实现人的识别能力？这些问题关乎“智能”的本质，也是模式识别和人工智能探讨的主要问题。


    在模式识别中，通常并不研究“人是如何进行模式识别的”，尽管这方面的知识可以帮助和启发我们设计有效的机器模式识别方法，但在一般模式识别研究中我们关心的主要是“机器该如何去识别”。为了让机器进行识别，首先必须将表征模式的信息输入机器(或计算机)。在模式识别中，模式的表征通常用反映其特征的一组数组成的向量来表示，称为特征向量。表征模式信息的特征向量输入机器(或计算机)后，(机器)模式识别要完成的工作就是要判断输入的模式是什么，即输入的模式属于哪类模式，这种判断模式类别属性的问题本质上是一个分类问题，因此机器模式识别就是根据一定的规则(或算法)，对模式特征向量进行合理的分类。其中的规则可以是人事先赋予的(如各种专家系统)，也可以是机器通过对大量样本数据学习后获得的。


    总而言之，模式识别就是通过计算机用数学技术的方法来研究模式的自动处理和判读。我们把环境与客体统称为“模式”。随着计算机技术的发展，人类有可能研究复杂的信息处理过程。信息处理过程的一个重要形式是生命体对环境及客体的识别。


    人们在观察事物或现象的时候，常常要寻找它与其他事物或现象的不同之处，并根据一定的目的把各个相似的但又不完全相同的事物或现象组成一类。字符识别就是一个典型的例子。例如数字“4”可以有各种写法，但都属于同一类别。更为重要的是，即使对于某种写法的“4”，以前虽未见过，也能把它分到“4”所属的这一类别。人脑的这种思维能力就构成了“模式”的概念。在上述例子中，模式和集合的概念是未分开的，只要认识这个集合中的有限数量的事物或现象，就可以识别属于这个集合的任意多的事物或现象。为了强调从一些个别的事物或现象推断出事物或现象的总体，我们把这样一些个别的事物或现象叫作各个模式。也有的学者认为应该把整个的类别叫作模式，这样的“模式”是一种抽象化的概念，如“房屋”等都是“模式”，而把具体的对象，如人民大会堂，叫作“房屋”这类模式中的一个样本。这种名词上的不同含义是容易从上下文中弄清楚的。


    综上所述，模式识别是指对表征事物或现象的各种形式的（数值的、文字的和逻辑关系的）信息进行处理和分析，以对事物或现象进行描述、辨认、分类和解释的过程，是信息科学和人工智能的重要组成部分。


    #### 4.1.2 问题分类


    模式识别又常称作模式分类，从处理问题的性质和解决问题的方法等角度，模式识别分为有监督的分类和无监督的分类两种。两者的主要差别在于，各实验样本所属的类别是否预先已知。一般说来，有监督的分类往往需要提供大量已知类别的样本，但在实际问题中，这是存在一定困难的，因此研究无监督的分类就变得十分有必要了。


    模式还可分成抽象的和具体的两种形式。前者如意识、思想、议论等，属于概念识别研究的范畴，是人工智能的另一研究分支。我们所指的模式识别主要是对语音波形、地震波、心电图、脑电图、图片、照片、文字、符号、生物传感器等对象的具体模式进行辨识和分类。


    #### 4.1.3 简史


    早期的模式识别研究着重在数学方法上。20世纪50年代末，F.罗森布拉特提出了一种简化的模拟人脑进行识别的数学模型——感知器，初步实现了通过给定类别的各个样本的识别系统进行训练，使系统在学习完毕后具有对其他未知类别的模式进行正确分类的能力。1957年，周绍庚提出用统计决策理论方法来解决模式识别问题，促进了从20世纪50年代末开始的模式识别研究工作的迅速发展。1962年，R.纳拉西曼提出了一种基于基元关系的句法识别方法。付子东在串的理论及应用两方面进行了系统的卓有成效的研究，并于1974年出版了一本专著《句法模式识别及其应用》。1982年和1984年，J.霍普菲尔德发表了两篇重要论文，深刻揭示出人工神经元网络所具有的联想存储和计算能力，进一步推动了模式识别的研究工作，短短几年在很多应用方面就取得了显著成果，从而形成了模式识别的人工神经元网络方法的新的学科方向。


    #### 4.1.4 进展


    模式识别研究主要集中在两方面，一是研究生物体(包括人)是如何感知对象的，属于认识科学的范畴；二是在给定的任务下，如何用计算机实现模式识别的理论和方法。前者是生理学家、心理学家、生物学家和神经生理学家的研究内容，后者通过数学家、信息学专家和计算机科学工作者近几十年来的努力，已经取得了系统的研究成果。


    应用计算机对一组事件或过程进行辨识和分类，所识别的事件或过程可以是文字、声音、图像等具体对象，也可以是状态、程度等抽象对象。这些对象与数字形式的信息相区别，称为模式信息。


    模式识别所分类的类别数目由特定的识别问题决定。有时，开始时无法得知实际的类别数，需要识别系统反复观测被识别对象以后确定。


    模式识别与统计学、心理学、语言学、计算机科学、生物学、控制论等都有关系。它与人工智能、图像处理的研究有交叉关系。例如自适应或自组织的模式识别系统包含了人工智能的学习机制；人工智能研究的场景理解、自然语言理解也包含模式识别问题。又如模式识别中的预处理和特征抽取环节应用图像处理的技术；图像处理中的图像分析也应用模式识别的技术。


    ### 4.2 模式识别的理论方法与分类


    #### 4.2.1 模式识别系统


    一个完整的模式识别系统由数据获取、数据处理、特征提取和选择、分类器设计和分类决策四部分组成。如图 4-1 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_87_0.png)


    图 4-1 模式识别系统


    数据获取是指利用各种传感器把被研究对象的各种信息转化为计算机可以接受的数值或者符号串集合。习惯上将这种数值或字符串称为模式空间。这一步的关键是传感器的选取。为了从这些字符串或数字中抽取有效的信息，必须进行数据处理。


    数据预处理是为了消除输入数据或信息中的噪声，排除不相干的信号，只留下与被研究对象的性质和采用的识别方法密切相关的特征。


    特征提取是指从滤波数据中衍生出有用的信息，从许多特征中提取出最有效的特征，以降低后续处理过程中的难度。我们对滤波提取后的这些特征进行必要的计算后，通过特征选择和提取形成模式的特征空间。一般情况下，候选特征种类越多，得到的结果应该越好。但是由此可能会引发维数灾难，计算机难以求解。因此数据处理阶段的关键是滤波算法和特征提取方法以及提取出来的不同特征。


    #### 4.2.2 模式识别方法与分类


    ##### 4.2.2.1 统计模式识别


    统计模式识别方法是受决策理论启发而产生的一种识别方法。统计模式识别首先根据待识别对象所包含的原始数据信息，从中提取出若干能够反映该类对象某方面性质的相应特征参数，并根据识别的实际需要从中选择一些参数的组合作为一个特征向量，根据某种相似性测度，设计一个能够对该向量组表示的模式进行区分的分类器，就可把特征向量相似的对象分为一类。统计模式识别过程主要由
    4 个部分组成，分别是信息获取、预处理、特征提取和选择及构造分类器。构造分类器即对特征向量进行区分的分类器设计，用设计好的分类器进行最终的分类决策。统计模式识别适用于用较少特征就能描述观察对象的场合，该方法能够通过一定的统计方法从个数有限的样本集中找出某种类别的特有规律或模式，这种规律描述为数学形式往往为有限个特征参数组成的向量，用该特征向量去构造分类器并用这些样本的特征向量值对分类器进行训练，进而去对更多更广泛的客观对象进行分析，也可以对未知数据或无法观测的数据进行分类识别或预测，现实世界中存在大量尚无法确认但可以进行观测的事物，运用统计模式识别方法就可对许多观测值进行分析处理。统计模式识别在现代科学、技术、社会、经济等各领域中都有着很广泛的应用。


    ##### 4.2.2.2 结构模式识别


    结构模式识别是对统计模式识别的补充。


    当需要对待识别对象的各部分之间的联系进行精确识别时，就需要使用结构模式识别方法。结构模式识别是根据识别对象的结构特征，将复杂的模式结构先通过分解，划分为多个相对更简单的且更容易区分的子模式，若得到的子模式仍有识别难度，则继续对其进行分解，直到最终得到的子模式具有容易表示且容易被识别的结构为止。通过这些子模式就可以复原原先比较复杂的模式结构，这些最终的子模式通常被称为模式基元。模式基元的选择原则：基元应该是基本的模式元素，能够通过一定的结构关系（如连接关系）紧凑、方便地对数据加以描述；基元应该容易用现有的非句法方法加以抽取或识别，因为基元被认为是简单的和紧凑的模式。模式基元中常用的有信号基元和图像基元，通常随时间变化的信号可以认为是一维数据，时间信号随时间的变化可以使用分段折线来近似表示，这种分段的折线就是信号基元。因此，将时间信号转换为由分段直线来表示则完成了信号基元的分解。图像基元较为复杂，一般二值图像的轮廓可以考虑为邻接方式集合与图像基元的符号集合。


    其中邻接方式集合可以考虑为以当前点为起点至下一点邻接的 8 个方向，图像基元集合则可以考虑为像素黑白位置的 10 个基元。结构模式识别方法主要是通过模式的结构特征来描述一个模式对象，而不是从统计学的观点来描述模式对象。另外从分类方法上也有所不同，传统的模式识别方法是通过各种距离准则的计算来实现模式对象的分类，而结构模式识别是基于模式结构的相似度来实现模式对象的分类。结构模式识别的优点是它类似于形式语言逻辑，由于形式语言逻辑在有限规则集合的约束下具有相当的自由性，因此在模式识别方法的研究中，该方法与众不同，能够对被识别对象的结构特征进行很好的描述和识别，以其独到之处在模式识别方法中占有独到的地位。结构模式识别方法的不足之处在于，由于它对于模式对象的描述难以实现统一，就某种研究获得的结果难以扩展到其他的应用中，因此使得结构模式识别不易获得推广应用。


    ##### 4.2.2.3 模糊模式识别


    模糊模式识别的理论基础是模糊数学。


    模糊集理论认为模糊集合中的一个元素，可以不是百分之百确定的属于该集合，而是可以以一定的比例属于该集合，不像传统集合理论中某元素要么属于要么就不属于该集合的定义方式，更符合现实当中许多模糊的实际问题，描述起来更加简单合理。在用机器模拟人类智能时模糊数学就可以更好地描述现实当中具有模糊性的问题，进而更好地进行处理。模糊模式识别就以模糊集理论为基础，根据一定的判定要求建立合适的隶属度函数来对识别对象进行分类。正是因为模糊模式识别能够很好地解决现实当中许多具有模糊性的概念，使其成为一种重要的模式识别方法。在进行模糊识别时，也需要建立一个类似于统计模式识别的识别系统，需要对实际的识别对象的特征参数按照一定的比例进行分类，这些比例往往是根据人为的经验作为参考值，只要符合认可的经验认识就行。之后建立相应能够处理模糊性问题的分类器对不同类别的特征向量进行判别。模糊模式识别方法处理的对象一般是带有模糊性的模式识别问题，即模糊模式识别问题。在进行模式识别的过程中，模式的模糊性主要来自两个方面：待识别对象自身具有的模糊性和识别要求上的模糊性。比如在遥感图像中的一个像元，它表示
    0.45 公顷的土地上各种地物的光谱综合，要指明某个地区所代表的事物，回答的结果肯定是模糊的概念，比如“以松树为主的林地”“以山地为主的山区”等，因此对于遥感图像的识别是具有模糊性的，又如要对人群中的脸型进行区分，有的是“瓜子脸”型，有的是“鸭蛋脸”型，有的是“国字脸”型，这也是一个关于模糊模式识别的问题，虽然每个待识别的人都是具体的，但是识别的结果是模糊的。因此，模糊模式识别便应用于当模式识别的识别对象与识别要求(结果)有一方是模糊时的情况。但模糊模式识别问题有时并不一定用模糊数学的方法来处理，也可以用统计方法来处理。因此，模糊模式识别“模糊”的含义，主要反映在实现模式识别的方法上，即采用的识别器是模糊的，也就是依据模糊数学的原理与方法来设计和工作的分类器。


    ##### 4.2.2.4 人工神经网络


    人工神经网络起源于对生物神经系统的研究。


    它从信息处理角度对人脑神经元网络进行抽象，建立简单模型，按照不同的研究方式组成不同的网络。人工神经网络作为模式识别技术当中最重要的方法之一，相对于传统的模式识别方法，人工神经网络属于自适应能力很强的方法。对于任意给定的函数，人工神经网络都能够无限逼近，这是因为在分类的整个过程中，人工神经网络通过调整权值不断地明确分类所依据的精确关系。人工神经网络属于非线性模型，这使得它能够灵活地模拟现实世界中的数据之间的复杂关系。人工神经网络是由大量神经元经过一定的连接形成的网络系统。它的组成与人脑中神经细胞的形成的网络结构很相似，就是为了像人脑那样功能强大，不管是学习新知识还是识别旧事物都具有很强的判断能力和适应能力。根据网络神经元之间的连接方式的不同，人工神经网络的种类也不同，连接越复杂，往往功能也越强大。它是一种模拟了人类的大脑功能的数学工具，在模式识别、智能控制等领域有着广泛而吸引人的应用和前景。模式识别主要是利用计算机的计算能力来实现人的各种不同的辨识能力，与计算机不同，人通过各种感官来感知外在世界，并由大脑对感知到的信息进行处理。因此，依据人脑的生理结构形成的人工神经网络是具有用来进行模式识别所依据的理论以及结构基础的。实际上，模式识别就是人工神经网络最成功的一个应用领域。用人工神经网络进行模式识别时，利用神经网络中神经元的记忆能力进行特征信息的存储，通过外接激励修改神经元之间的权值进行特定模式学习，就会形成一个功能强大的神经网络。首先通常用一定量的训练样本对分类器进行训练，之后则利用该分类器对新的识别对象进行识别分类。


    ### 4.3 识别系统


    模式识别技术在科学研究和社会生活中扮演着不可或缺的角色，特别是对社会生活有着重大的现实意义，模式识别技术已经在社会生活的各个方面得到了广泛长足的发展。如今的模式识别系统主要有语音识别系统、视觉识别系统、行为识别系统、情感识别系统等。


    语音识别系统：与机器进行语音交流，让机器明白你说什么，这是人们长期以来梦寐以求的事情。语音识别系统就是让机器通过识别和理解过程把语音信号转变为相应的文本或命令的系统。语音识别技术主要包括特征提取技术、模式匹配准则及模型训练技术三个方面。语音识别技术在车联网领域也得到了充分的利用，例如在翼卡车联网中，只需按一键接通客服系统，口述即可设置目的地直接导航，安全、便捷。


    视觉识别系统：计算机视觉是一门研究如何使机器“看”的科学，更进一步地说，就是指用摄影机和电脑代替人眼对目标进行识别、跟踪和测量等，并进一步做图形处理，使电脑将其处理成为更适合人眼观察或传送给仪器检测的图像。作为一个科学学科，计算机视觉研究相关的理论和技术，试图建立能够从图像或者多维数据中获取“信息”的人工智能系统。这里所指的信息指
    Shannon 定义的，可以用来帮助做一个“决定”的信息。因为感知可以看作是从感官信号中提取信息，所以计算机视觉也可以看作是研究如何使人工系统从图像或多维数据中“感知”的科学。


    行为识别系统：行为是指人们受思想支配而表现出来的外表活动，人的行为可分为外显和内在行为。外显行为是可以被他人直接观察到的行为，它是由一系列简单动作构成的，是在日常生活中所表现出来的一切动作的统称。而内在行为则是不能被他人直接观察到的行为，如意识、思维活动等，即通常所说的心理活动。一般情况下，可以通过观察人的外显行为，进一步推测其内在行为。行为识别的目标是通过传感器设备获取与人行为相关的信息，通过技术手段从行为信息反推出行为的名称，并能通过连续的行为序列预测用户进一步的行为。


    情感识别系统：人类可以通过视觉、味觉、听觉、嗅觉和触觉五个器官来认识世界，而对于他人情感的识别主要是通过视觉和听觉来完成的，即主要是通过人脸的情感识别、语言声调的情感识别和语言文字的情感识别来完成的。一般的人脸识别可以依靠单个感官来完成，也可以用多个感官相配合完成，它是一个整体识别和特征识别共同作用的结果。一般来说，不同语言声调表情的语言信号在其时间构造、振幅构造、基频构造和共振峰构造等特征方面也有着不同的构造特点和分布规律。由此，只要把各种具体模式的语言声调表情在时间构造、振幅构造、基频构造和共振峰构造等特征方面的构造特点和分布规律进行测算和分析，并以此为基础或模板，就可以识别出所有语言声调中所隐含的情感内容。语言和文字属于第二信号系统，由于它们脱离了现实事物对于人的条件反射活动的直接参与，从而可以更为广泛地、普遍地、直接地、快速地、灵活地、多样地、深入地对各种事物进行认识，从而可以使人类能够对更为抽象、本质、遥远、间接、广泛、更为模糊、更为变幻莫测的事物的价值关系进行认识和反应。


    #### 4.3.1 语音识别系统


    语音是语言的声学表现，是人类交流信息最自然、最有效、最方便的手段，也是人类思维的依托。与机器进行语音交流，让机器明白你说什么，这是人们长期以来梦寐以求的事情。语音识别技术就是让机器通过识别和理解过程把语音信号转变为相应的文本或命令的高技术。语音识别有两种含意，第一种是将口述语言逐字逐句地转换为相应的书面语言即文字，第二种则是对口述语言所包含的要求或询问做出正确的响应，而不拘泥于将所有词正确地转换为书面文字。作为专门的研究领域，语音识别又是一门交叉学科，它与声学、语音学、语言学、数字信号处理理论、信息论、计算机科学等众多学科紧密相连。


    语音识别最基本的定义是“电脑能听懂人类说话的语句或命令，而做出相应的工作”。也就是说，如果电脑配置有“语音识别”的程序组，那么当你的声音通过一个转换装置输入电脑内部，并以数位方式存储后，语音识别程序便开始以你的声音样本与事先存储好的声音样本进行对比工作。声音对比工作完成后，电脑就会输出一个它认为最“像”的声音样本序号，由此可以知道你刚才念的声音是什么意义，进而执行此命令。语音识别系统根据不同的要求可进行不同的分类。


    语音识别系统可以根据对输入人语音的限制加以分类。如果从说话者与识别系统的相关性考虑，可以将识别系统分为三类：（1）特定人语音识别系统，仅考虑对于专人的话音进行识别；（2）非特定人语音系统，识别的语音与人无关，通常要用大量不同人的语音数据库使

