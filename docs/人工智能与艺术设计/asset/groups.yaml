    式,并强调研究其他思维形式及其模拟的重要性。近年来,由于现场 AI 的提出及盛行,国际上已普遍开始重视人类其他思维形式的研究。H.A. ismo 在他的获奖特邀报告中,以“解释说不清现象——AI
    关于直觉、顿悟和灵感问题”为题,专门谈及这些智能中“说不清”的现象及其模拟问题。根据他的意见,目前计算机程序已经有可能模拟这个现象。当然,他只是就这些行为的计算机程序模拟而言,如果考虑到智能体与环境的交互,问题恐怕要复杂得多。


    从方法上讲,传统人工智能方法也有其局限性。传统方法根据人类的先验知识,采取构造的方法,构造一个启发式搜索的问题求解模型,这是一个无反馈的孤立系统,对推理和学习都适用。传统
    AI 方法的核心是使用先验知识和搜索技术,因此当先验知识丰富且易于表达时,问题求解(搜索)就十分容易;反之,我们就会面临计算(搜索)量大的困难。从本质上讲,传统方法成功与否,取决于我们掌握知识(知道)的多少及精确的程度,从这一点来看,传统方法在处理不确定性、知识不完全性以及学习等问题时必将遇到许多实质性困难,这就不难理解几十年来机器学习进展缓慢的原因。其实,机器学习与推理一样也是一种搜索,即搜索待学习的概念和知识,不同的只是在学习中先验知识更少一些。机器学习需要更多的搜索,因此势必带来计算量(搜索量)指数爆炸的困难。传统
    AI 需要先验知识,即使对于学习也是一样,这就造成一种困难: 机器要借助“已知”进行学习,而“已知”又需要通过学习来得到,那么最初的“已知”只能由教师(人)给予机器,这就不难理解,传统方法难以实现机器自我学习的原因,要使
    AI 技术向前发展,需要考虑同其他领域和技术的结合,现场 AI 为此提供了可能性。


    现场 AI 也促使传统符号处理机制与连接机制的集成,目前这种集成也正在发生中。大家知道,当传统的 AI 方法出现困难的时候,以神经网络为代表的连接机制正在崛起。因为知识在神经网络中是以准符号方式表示的,所以接受感知信息比较容易,从而容易与环境交互,人们开始对它寄予很大希望,以为在许多方面可以取代传统的方法。不过,经过十年多的实践,人们发现神经网络固然有许多特点,但在解决复杂问题时,也同样存在扩大规模的基本问题。当神经网络规模扩大时,学习复杂性也出现指数爆炸现象,所以唯一的出路,是寻找结合的途径。目前来讲,两个方向的渗透都在进行之中,一个是把神经网络机制引入传统
    AI,特别是把它的自学习机制和大规模并行计算引入 AI 的传统方法;另一方面是将符号表示和处理引入神经网络,即把先验知识和构造性方法引入神经网络的设计和学习过程,通过相互渗透使两种机制结合起来。


    现场 AI,不能只把它简单地看成是对传统 AI 的否定,或者把它与传统 AI 对立起来,简单地评判谁是谁非,而应该把它看成是传统 AI 的发展和补充,它使传统
    AI 无论在研究的内容以及研究的方法上都有了新的扩展。同时,把 AI 研究推向现场,使 AI 研究更加实用化,这些都是 AI 研究的进步。


    # 1.3.2.2 智能系统的构成


    怎样构造复杂的智能系统,以达到 AI 研究扩大规模的目的呢? 换句话说,复杂智能系统是由怎样的部件组成,而这些部件又如何组成智能系统的? 为解决上述问题,近年来
    AI'
