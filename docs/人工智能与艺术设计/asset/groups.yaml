    # 前言


    人工智能（Artificial Intelligence，AI是指机器像人一样拥有智能能力，是一门融合计算机科学、统计学、脑神经学和社会科学的前沿综合学科，可以代替人类实现识别、认知、分析和决策等多种功能。人工智能涉及心理学、认知科学、思维科学、信息科学、系统科学和生物科学等多门学科，目前已在多个领域取得举世瞩目的成果，并形成了多元化的发展方向。90
    年代，国际象棋冠军卡斯帕罗夫与“深蓝”计算机决战，“深蓝”获胜，这是人工智能发展的一个重要里程碑。2016 年，韩国围棋国手李在石与围棋程序 AlphaGo
    对弈中首战失利，再一次将人工智能拉入了公众的视野，人工智能成为话题度最高的科技和最流行的媒体语言。中国政府将人工智能列为重点发展战略，2019 年，教育部批准
    35 所高校增设人工智能本科专业。人工智能教育建设已经掀起热潮。


    近些年来人工智能迅速发展，人工智能产品已经开始改变人们的生活方式，如扫地机器人、智能保姆等进入家庭生活，智能社会、智能城市已在发达城市成为现实，5G 技术的应用、无人驾驶等高科技正在改变人们的生活。虽然它们还没有《终结者》中描述得那么先进，但以前遥不可及的人工智能概念正在一步步变为现实却是不争的事实，政府和学界正密切关注人工智能的现状。


    《人工智能与艺术设计》全书介绍了人工智能的学科内涵、学科历史及发展，人类智能的生理基础；阐述了人工智能的基础算法理论，以及模式识别系统，人工神经网络与深度学习；重点讲述它的应用，包括人体行为与智能机器人、智能系统与智能社会，人工智能与艺术设计的知识内容和发展。本着顺应时代，努力为教育建设添砖加瓦的思想，解密人工智能在艺术领域的应用，为艺术类大学生、艺术爱好者提供帮助。'
