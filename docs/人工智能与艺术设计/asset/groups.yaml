    ## 6.3 机器舞蹈


    ### 6.3.1 机器舞蹈概念


    西周时期，我国的能工巧匠师就研制出了能歌善舞的伶人，这是我国最早记载的机器人。


    《北京日报》报道，一种新型智能机器人已在京研制成功，它不但能翩翩起舞，还能和人进行语音对话聊天。头部能够自由运动的关节有 18 个多，这保证了它能模仿人类做出多种表情。除喜、怒、惊、悲、恐等常规表情外，机器人还能做一些常人难以做出来的怪异表情，如对眼、斜歪嘴等。


    娱乐机器人是智能服务机器人的一个分支，具有极强的观赏和趣味性，是一个系统化的工程设计，涉及运动机器人的设计、制作、自动控制和通信。是传感和感知的融合，是精密机械等众多学科的前沿研究与综合的集成。拟人机器人是近来娱乐机器人发展的热点，索尼是这类机器人的明星。


    世界上最早的两足步行机器人是由被誉为“世界人形机器人之父”的日本早稻田大学加藤一郎教授领导的团队于 1973 年研制的，1996 年他们又研制出 WABIAN-3
    仿人机器人，该仿人机器人能够在人的引导下完成简单的舞蹈动作。


    2005 年中央电视台“春节联欢晚会”上，香港明星刘德华理所当然地成为观众的焦点，可是当时在舞台上竟然还有比刘德华更加引人注目的人物，它们就是随着刘德华的欢快的新歌《恭喜发财》的旋律而翩翩起舞的两个高科技智能机器人——索尼
    QRIO 梦幻组合。


    舞蹈机器人既是娱乐机器人的一种，又是集成了多学科前沿技术的运动机器人的一种。


    机器人舞蹈，既具有极强的观赏和趣味性，更是一个系统化的工程设计。


    ### 6.3.2 歌舞动漫仿真


    日本动漫中的机器人形象：机器人动漫，在日本形成了一条独特的发展道路。阿童木与铁人 28 号可谓日本早期动漫机器人的代表。1963 年播出的日本首部国产电视动漫《铁臂阿童木》讲述了拥有超能力的少年机器人阿童木跟地球上的居民为了保卫和平同坏人做斗争的经历，塑造了一个善良、勇敢、百折不挠的艺术形象。阿童木于
    2003 年被选为东京新宿区的“未来特使”，2010 年 4 月还为 7 岁的阿童木举行了小学入学仪式，其人气指数可见一斑。阿童木以其个性鲜明、生动形象的造型，以及超强的能力吸引了观众们的视线，这个体型与人类大小相当，有着探照灯般的大眼睛、留着黑色尖发、脚蹬红色长靴的机器人，也是中国
    20 世纪 80 年代家喻户晓的动画形象。同时代的还有名为铁人 28 号的遥控操纵巨型动漫机器人，讲的是少年侦探金田正太郎凭借铁人 28 号的力量，将黑恶势力打败、维护和平的故事。铁人
    28 号身着中世纪的铠甲，肌肉浑厚，身体强健。这种超级巨大的早期机器人，形体拟人化的同时，还必须通过遥控器、无线电波等进行操控，因为人类要借助机器人坚硬的外壳在意识层面实现人类自我不能实现的理想。


    哆啦 A 梦与奥特曼是 20 世纪 60 年代末期的动漫机器人形象。哆啦 A 梦是 1969 年漫画家藤子不二雄创作的极具影响力的蓝色猫型动漫机器人，中文曾有机器猫、小叮当、阿蒙等多种译名。哆啦
    A 梦帮助小主人公大雄从未来的 22 世纪来到 20 世纪，哆啦 A 梦的腹部有个神奇的口袋，从中可以随时取出 22 世纪的工具帮助大雄。作品虚拟了一个充满童趣想象力的科幻世界，现如今依然有着极高的人气。动漫电影《哆啦
    A 梦：大雄与新铁人兵团》（2011 年）和《哆啦 A 梦：大雄与奇迹之岛》（2012 年）分别以 25 亿日元和 36.2 亿日元获得了极高的票房纪录。奥特曼是同时代巨型机器人的代表，它是来自
    M78 星云的宇宙人，银色的形体配以红色的条纹，分别象征了“最先进的科学技术宇宙火箭”和“人类血液”的颜色，是“高端科技与人类血液”的混合体，眼睛不再是跟人类相同的黑眼球，而是想象中的宇宙生物闪烁的状态，以强调其不同于地球人的特征，必杀技也不再是传统的拳术或日本刀，而是合成光束，动漫形象发生了很大变化。20
    世纪 80 年代以来的机器人动漫可推《机动战士高达》《新世纪福音战士》及《攻壳机动队》。《机动战士高达》被认为是日本现实主义动漫的开端，讲述了地球联邦与宇宙殖民国家之间的战争。“高达”是一种可变形组合的，任何人都可以操纵的高科技人形武器。该动漫自
    1979 年播放以来，三十余年里播出了多部，至今热度不减。以《新世纪福音战士》为代表的 20 世纪 90 年代中期的动漫机器人追求个性、时尚、高科技和多元化，出现了仿生、软体等新变化，更多运用了心理学和精神分析的概念，将西方的创世神话引用到作品中。进入
    21 世纪，出现了机器人与人类从外形上难分彼此的动漫作品，例如《攻壳机动队》中的仿真机器人、人机合体的机器人等，体现了人类对人工智能等未来科技力量的向往。不难看出，“高达”以后的机器人动漫，大都设置了庞大的战争、犯罪题材做背景，剧情更加复杂多元化，在战争的残酷和血腥中承载了创作者对于社会、科技、战争等问题的深层次的思考。


    ### 6.3.3 机器舞蹈创作


    舞蹈是世界的经验智慧，是对大自然和感官的反应。人是由分层元素组成，包括但不限于智力、情感、身体、社会、美学、创意和精神。一切都在互通，一切都存在于关系之中。


    随着创新和学科融合技术的发展，人们探索了一种科学化的舞蹈创造，其系统由三个模块组成：音乐分析、人的控制和机器人舞蹈控制，它们通过多线程架构并行处理，在基于反应行为的方法中诱导机器人舞蹈表演。所产生的舞蹈通过运动连接器来连接系统，该运动可以被事先动态地定义，然后由机器人对这些节奏事件发生的反应方式进行感知。


    最近几代机器人的形状和发音能力越来越像人类，这种进步促使相关工作人员设计出可以模仿人类舞蹈的复杂性舞蹈机器人，甚至与人合作表演。然而，这些公共机器人应用缺乏感知，主要表现为预编程的聋哑机器人的人为自适应行为很少。音乐一般是由一连串的声音和节奏组织在一起，表演者的注意力集中在每个连续的音符。在舞蹈中，身体运动成为对音乐节奏事件的自然反应。文中叙述的感知机器人是基于自动音乐信号分析的机器人应用，以此设计出一个灵活的舞蹈框架。为了获得这些预期的事件，我们将分析集中在检测音乐起始时间（每个音符的开始时间），通过起始检测功能（其峰值意图与音符开始时间相符），代表能量变化随着时间的推移，由数字和弦音乐信号组成音乐数据。使用这种节奏感知模型，我们和机器人以时间同步的方式反应性地执行适当的舞蹈运动，机器人会单独自发地模拟人类的动态运动行为。机器人的身体运动行为由三个节奏事件组合而成，即低、中等或强力和由检测到的颜色定义的两个感觉事件组成：蓝色，黄色，绿色，红色；靠近障碍物：OK，TooClose(太接近)。基于这些输入的交换，用户可以适当地通过界面动态地定义每个预期的舞蹈动作。


    舞蹈是一种创造性的艺术形式。在创造性环境中培养的思维方式可以富有深意，涉及心灵与身体之间的共生关系。在学术方面，舞蹈研究人员则迫追寻求找完美的舞蹈互动解决方案，以实现可与人类相互作用的感知机器人舞蹈。日本专家中冈三益(S.Nakaoka)提出了一种使双足动物机器人
    HRP-2 通过使用运动捕捉系统模仿日本传统民间舞蹈的复杂运动的空间轨迹的方法。为了做到这一点，他们开发了学习观察(LFO)训练方法，使机器人能够从观察人类的舞蹈中获取知识以及做出模仿。相关研究人员开发了一个类人机器人，海丽——音乐家(打击乐手)，同步打击乐器。他们的机器人听着这个打击乐，实时分析音乐线，并用其结果以节奏多样的方式进行表演。为了执行它们，使用两个
    Max/MSP 对象，一个用于检测音乐节拍，另一个用于从中收集音调和音色信息，授予舞蹈同步节奏。


    索尼公司(SONY)创造的舞蹈机器人，依赖于重复同步机器人与人之间的动态的夹带合奏模型而开发。为了保持同步，他们使用了一个特殊的视觉系统，通过该系统，舞蹈机器人可以模拟检测到人体运动轨迹。机器人电动机指令通过转换来自处理与音乐节奏相对应的脉冲序列的神经网络输出来实时生成舞蹈动作。


    机器人舞蹈感知系统架构由一个机器人组成，它由 Lego Mindstorms NXT 套件构成，是一个融合了多色层的舞蹈环境，以诱导依赖于阶梯式颜色，以及限定跳舞空间的覆盖墙和三个软件模块。即音乐分析，机器人舞蹈控制和人的控制。每个人负责控制特定事件。所有这些模块都以多线程范例进行处理，以保持与机器人舞蹈同步的音乐节奏行为的并行性。基于这种科学性技术，感知系统使用两个
    NXT 模块构建了类人形机器人，这两个模块控制六个伺服电机(每个腿和每个臂各一个，一个用于旋转臀部，一个用于头部)和两个传感器，这个机器人设计允许 16 个单独的舞蹈运动。音乐分析模块是使用基于
    Marsyas 起始检测功能的节奏感知算法来检测节奏事件。这些事件通过 TCP/IP 插座实时发送到通过蓝牙远程控制机器人的机器人控制模块。在前两者的控制中，人的控制模块由用户图形界面
    (GUI) 组成，用户可以通过用户界面来进行交互系统，通过定义主要控制参数和合成舞蹈的组成。人体控制模块分为两个部分：机器人控制面板和舞蹈创作菜单。机器人控制面板是用户可定义的控制面板，可以根据设计设置一个或两个
    NXT 模块的蓝牙连接；要分析音频文件的定义及其通信参数(可能保存在正确的 txt 文件中)。舞蹈创作菜单，允许用户根据给定的节奏和颜色动态定义每个单独的舞蹈运动；将合成的舞蹈保存在适当位置的
    xml 文件中。该模块的高级位置(人)控制整个过程，然后，用户通过动态选择的单独舞蹈动作来定义机器人的编排。这样机器人就可以创造出一个智能机器人舞者的重要第一步，它可以根据音乐作品的节奏产生丰富而合适的舞蹈动作，并通过动态舞蹈定义来支持人机交互。


    设计一种在短期同步和长期自主行为之间呈现动态的娱乐系统是保持人与人造物之间交互关系的关键。机器人舞蹈感知表演基本上是基于现实观察，与现实世界舞蹈环境中的人类行为的有意义的数据相比较，然后分析同步、动力和现实主义因素。


    - (1) 同步。由于算法的复杂性，处理和蓝牙限制，这主要是由于在单个处理器上使用多线程。由于竞争条件(依赖某一特定的线程处理顺序来完成某个功能)，引起了一些同步的缺陷(复杂的高度时间消耗)舞蹈运动决定任务和机器人蓝牙通信溢出(因为它只能以大约
    50~100 ms 的时间间隔通过 BT 接收/发送数据，并且需要大约 30 ms 从接收模式转换到电机—传输模式—传感器)。


    - (2) 动力。机器人的舞蹈感知是由各种可能的舞蹈风格定义，由不同的个人舞蹈运动(加无声)分布于不同的事件(节奏事件，颜色事件)中(可以重复两个或多个相同的运动)，并由机器人感知舞蹈环境进行练习。因此，这种动态行为被转变为人类决策的多功能性，其具有通过灵活传导使机器人性能适应自身的能力。


    - (3) 机器人系统通过在反应性行为的舞蹈表现中的感知和行动来保持与现实世界的联系(机器人试图复制人的行为)。机器人通过感知人的舞蹈动作直接体验世界(舞蹈环境)，这个世界通过感知位置(颜色和超声波感知)直接影响其行为。所产生的舞蹈以自主的方式交替，在与音乐节奏相结合的多种运动风格之间交替，并且与舞蹈环境上的色彩一致。在机器人舞蹈感知系统中，多机器人舞蹈是可以在跳舞时允许创建同步和动态的编排舞蹈集群，并通过添加其他感官事件(如加速度和方向)来提高机器人的灵敏度。在不同的实验条件下，通过促进机器人的舞蹈表演增强机器人之间的交互感知。


