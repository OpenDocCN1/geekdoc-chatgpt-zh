    # 3.2.3 递归结构


    任何一个可以用计算机求解的问题所需的计算时间都与其规模有关。问题规模越小，解题所需的计算时间往往也越少，计算也越容易。要解决一个较大的问题，有时是相当困难的。分治策略是应用最多的一种有效方法，它的基本思想是将问题分解成若干个子问题，子问题较原问题无疑是会容易些，然后求解子问题，并由此得出原问题的解，就是所谓的“分而治之”的意思。分治策略还可以递归，即子问题仍然可以用分治策略来处理，最后的问题非常基本而且简单。


    分治的基本思想是将一个规模为 n 的问题分解为 k 个规模较小的子问题，这些子问题互相独立且与原问题相同。找出各部分的解，然后把各部分的解组合成整个问题的解。实现算法的同时，需要估计算法所需时间。分治算法在每一层递归上分为三个步骤，首先是分，即将原问题分解成一系列子问题。其次是治，即递归地解各子问题，若子问题足够小，则直接解之。最后是合，即将子问题的结果合并成原问题的解。


    分治算法的时间由解决各个子问题所需的时间（由子问题的个数、解决每个子问题的时间决定）确定。


    在 C 语言中，重复性操作可以通过循环结构或者递归结构完成。递归结构清晰，可读性强，而且容易用数学归纳法来证明算法的正确性，因此它为设计算法、调试程序带来很大方便。


    从递归算法的结构来分析，设计递归算法时，无非要解决两个问题：递归出口和递归体。即要确定何时到达递归出口，何时执行递归体，执行什么样的递归体。递归算法设计的关键是保存每一层的局部变量并运用这些局部变量。由此，递归算法的设计步骤可从以下'
