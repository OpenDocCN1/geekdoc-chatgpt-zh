    这意味着 CAN 比人类艺术家更了解我们对抽象艺术的喜恶和预期，也更具“创造力”。

    并且，更意味着面对人工智能艺术，我们已不能区分谁是作者。如果进一步推理，则可预见

    在不久的将来，至少在抽象艺术领域，人工智能可以代替人类艺术家的创作。而我们的艺术

    家，或许要靠临摹人工智能艺术混饭吃了，因为目前人工智能还不能真正地画画，只能生成

    图像。


    长期以来，人们一直认为，人类的丰富创造力和想象力是人工智能无法超越的。配置了

    人工智能系统的“神奇机器”既没有经历过人类世界的多样性，也没有自己的情绪和记忆，要

    让它们成为画家真是勉为其难。然而，随着人工智能相关技术的不断演进，尤其是算法的持

