    机器人取代。


    将来会有机器人所擅长的效率高的岗位。对于人能做的一些岗位，比如科学创新，实际上是不利于机器发挥它的效率的，机器人不会处理它的关系，因此效率相对比较低一点。将完成效率比较高的任务交给机器人，其他的任务交给人解决，人类的岗位更多的是能够创造一些新的东西。开始的时候我们将会尝试不断地开发，成熟之后再交给机器人。与此同时，我们让人做创新的事情，其他效率的事情交给机器人做。


    所以在这个方面，它的力量就是从军方角度来讲会有这样的士兵，这些士兵能够实现人机混合组队，这种情况将会是我们未来发展的一个重要的方向，是部署工作重要的发展方向。我们与机器携手，而不是与机器对抗。


    # 1.3.4.10 前沿十——从人工智能到人工智能


    从这个边界角度来讲，我们需要构建人工智能的网络，尤其是有相似功能的人工智能。像脸谱网有 20 亿人的链接，这种合作达到一定的层级，它的分享也是全球层面进行的合作和共享。


    这是一个前沿，我们从来没有到那里去过。可以看到日常生活当中，我们能够使用技术工具，互相合作，更大规模地实施动态协作，这是 20 年前不可能想象的。


    人工智能也是一个不断改善的过程，将会有更多人愿意用人工智能，然后它是一个良性循环，我们也希望用人工智能编程另外一个人工智能，这是一个加速化的过程。我们总是认为人工智能尚未开始，在
    50 年前，我们可能都会说还从来没有开始人工智能，50 年后可能也不会说人工智能开始了，但人工智能正在悄然发生，发展速度会非常之快。


    展望一下未来，我们正好身处人工智能的起步阶段。在这个阶段来讲，可能还没有多少人工智能能够真正有意义地形成，我们在路上，还没有真正开始。30 年后的今天，人们会说：“天啊，我希望我有能力参与其中。”1958
    年网络刚刚兴起的时候，想象一下当时非常的神奇，它是悄然出现的。现在，相对 30 年之后，可能没有人工智能的专家。在 1990 年的时候也没有人是网络方面的专家，因为它也只是刚刚起步。我们正好身处人工智能起步阶段，有很多发展的机会，可能就摆在我们面前。


