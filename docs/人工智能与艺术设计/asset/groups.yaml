    # 4 模式识别与识别系统


    # 4.1 模式识别概述


    # 4.1.1 定义


    什么是模式？从广义上讲，模式是对存在于时空中的某种客观事物的描述。例如“水”是一种无色无味且透明的液体，“玻璃”是一种能透光且易碎的固体。这种对事物特征的描述是人在认识客观世界的过程中，对同类事物的多次感知经验中形成的，人将事物的这种描述存储记忆在大脑中。并以此为依据，对当下感知的事物进行判断，这实际就是一个模式识别的过程。


    我们可以这样给(人的)模式识别下一个定义：模式识别是对感知信息进行分析，并对感兴趣的对象进行判别的过程。人在日常生活、工作学习和社会活动中几乎无时、无处不在进行着模式识别，我们阅读是在进行文字模式识别，听收音机是在进行语音模式识别，看电影是同时在进行视觉模式识别和语言模式识别。医生工作时要根据自己掌握的有关疾病的专业知识和经验，结合病人的实际情况和症状，判断病人所患的是何种疾病，并采取相应的治疗措施，整个过程就是对疾病的模式识别过程。


    作为高级智慧生物，人具有非凡的模式识别能力。我们能在多人说话的声音中准确地分辨熟人的声音；面对复杂的视觉场景，我们能在不经意的一瞥之中准确判断“这里是一辆汽车”“那里有一个行人”。可是，这些在我们看来如此容易的模式识别工作要让机器或计算机来完成，却会变得非常困难。如何让机器具有或部分具有人的识别能力？机器能在多大程度上实现人的识别能力？这些问题关乎“智能”的本质，也是模式识别和人工智能探讨的主要问题。


    在模式识别中，通常并不研究“人是如何进行模式识别的”，尽管这方面的知识可以帮助和启发我们设计有效的机器模式识别方法，但在一般模式识别研究中我们关心的主要是“机器该如何去识别”。为了让机器进行识别，首先必须将表征模式的信息输入机器(或计算机)。在模式识别中，模式的表征通常用反映其特征的一组数组成的向量来表示，称为特征向量。表征模式信息的特征向量输入机器(或计算机)后，(机器)模式识别要完成的工作就是要判断输入的模式是什么，即输入的模式属于哪类模式，这种判断模式类别属性的问题本质上是一个分类问题，因此机器模式识别就是根据一定的规则(或算法)，对模式特征向量进行合理的分类。其中的规则可以是人事先赋予的(如各种专家系统)，也可以是机器通过对'
