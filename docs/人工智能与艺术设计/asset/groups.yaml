    日常生活中，由于人脸是非刚性的，会存在表情、姿态等变化，同时受外界环境影响，人脸也会受到遮挡、光照变化等影响，这些因素给人脸检测带来了诸多困难。在理论和实验的基础上，发现人脸检测的问题其实就是判定人脸和非人脸二分类问题。因此，人脸检测的目'
  - '[PAGE 102]


    的就是选取一幅图像中人脸区域，并对其进行预处理。目前，人脸检测的常用方法有基于肤色模型的方法和基于统计理论的方法。


    在通常情况下，利用肤色特征进行人脸检测是一种有效的方法，原因在于人脸区域的肤色都明显区别于其他背景区域。研究发现，不同种族人的肤色在颜色空间聚集在一个很小的范围之内，有着较强的聚类特性。
    HsuRL 等采用改进的光照补偿方法与非线性颜色变换，定位出图像中全部肤色区域，然后通过面部器官的轮廓特征精确定位出人脸区域；Kherchaoui 等将肤色与模板相结合，首先利用肤色模型分割出人脸候选区域，然后运用模板匹配精确定位到人脸区域。


    基于肤色模型的人脸检测方法检测速度相对较快，在头部姿态变化和部分遮挡情况下仍具有较高的检测准确率，但在背景环境颜色与肤色相近的情况下，检测准确率相对较差。


    基于图像统计特征的方法结合机器学习和统计学两者的优势，通过对大量的人脸样本与非人脸样本进行训练学习，从而获得两类样本的最佳分类界面，以此作为区分实现人脸检测。


    基于图像统计特征的方法主要有支持向量机（Support Vector Machine，SVM）和 AdaBoost 方法等。


    其中，AdaBoost 方法是目前人脸检测效果最好的算法之一，具有快速的检测速度，同时还具有较高的检测精度。


    # 2. 表情特征提取


    在检测到人脸区域后，对人脸表情特征信息进行有效的分析，针对不同的表情选取合适的特征提取方法。下面将分别从几何特征提取和纹理特征提取两个方面进行详细的描述。


    如图 4 - 14 所示，几何特征提取方法主要通过提取人脸的特征点，然后分析不同区域特征点之间的几何关系，比如眼睛区域和嘴巴区域等，实现对表情的分类识别，该类特征提取方法主要适用于面部疲劳表情的识别。


    ![](img/f188b68deb37acb6105ba97c814d9af2_102_0.png)


    图 4 - 14 人脸特征点分布


    1995 年，Coots 等提出了主动形状模型，该方法是一种基于统计模型的特征提取方法，主要用于提取面部器官轮廓和人脸轮廓的特征点，该模型首先通过大量的训练得到初始人脸形状，然后对其操作得到较为准确的人脸轮廓特征。


    最终结果的准确性会受到人脸初始定位、光照等因素的影响。Peng 等提出一种基于局部纹理模型的改进 ASM 算法，在表情识别中具有很好的应用。


    侯婕基于经典 ASM 算法提出了针对人脸左左右眉毛、左右眼睛、鼻子和嘴巴部分提取出 118 个特征点，形成各部分的轮廓形状数据信息，以此为基础实现了对 6
    种基本表情的识别。


    纹理特征反映了人脸表情图像的底层信息，突出体现了局部表情的变化。纹理特征提取典型的方法有局部二值模式。'
  - '[PAGE 103]


    LBP 通过图像的局部灰度信息变化来表达局部纹理特征，通过 LBP 特征值用来描述图像局部纹理特征。LBP 算子对图像尺度变换、旋转和光照变化具有很好的鲁棒性，能够有效地描述图像的纹理信息。Guo
    等又先后提出了 FCL - LBP 算法和 disCLBP 算法，其通过选取最大内间距与最小类内间距选取出的纹理特征具有更好的鲁棒性。周宇旋等通过改进 disCLBP
    得到更有辨别性的表情特征，更有利于表情识别。


    # 3. 表情识别


    表情识别是整个人脸表情识别流程的最后一步，也是最终目标，选取合适的分类器对表情识别十分重要。常用的表情分类方法有支持向量机和深度学习的方法。


    支持向量机是在统计学习理论基础上发展起来的一种新的模式识别方法。如图 4 - 15 所示为二维两类分类情况，H 为分类线，H1、H2 分别为对两类样本中离分类线最近的点且平行于
    H 的直线，H1、H2 之间的距离叫作两类的分类间隔。SVM 方法基本思想是要寻找一个满足分类要求的最优分类面，使得训练集中的样本点距离分类面尽可能地远，即令分类间隔最大。H1、H2
    上的训练样本称为支持向量。


    ![](img/f188b68deb37acb6105ba97c814d9af2_103_0.png)


    图 4 - 15 最优分类面


    研究发现,人的视觉系统对信息的处理是分级的。所有物体都是由像素点构成，像素点组成特征边缘，特征边缘组成目标物体的部分区域,最后目标物体的部分区域组成整个目标物体。深度学习模仿人类对物体的认知过程,在分类识别物体时直接把需要识别的对象进行训练,然后进行分类识别。与传统手工标定进行特征提取的方法相比，其最大的特点就是可以对识别对象进行自学习,学习到最能表达物体的特征,最终进行分类识别。


    # 4.3.4.3 语音情感识别


    人类的语音中不仅包含了文字符号信息,而且还包含了人们的情感和情绪等信息。例如,同样一句话,往往由于说话人的情感不同,其意思和给听者的印象就会不同。当人们通过电话交谈的时候,能通过对方的声音感知到对方的情感。从这一点上看,本文认为通过分析语音来判断人的情感是可能的。语音情感识别技术的用途是很广泛的,可以用来设计人性化的语音人机界面;可以用在互动电影;可用于辅助语音识别;可以用于情感翻译;该技术还可以用在测谎、电子游戏和辅助心理治疗等方面。'
  - '[PAGE 104]


    语音信号处理作为一个重要的研究领域，已经有很长的研究历史，它始终与信息科学中最活跃的前沿学科保持着密切的联系。从语音信号提取情感特征，判断说话人的喜怒哀乐，是一个新兴的研究领域。本部分主要从情感语音的特征和识别方法两方面阐述近几年国内外在这个领域的研究状况。


    # 1. 情感语音的特征


    研究发现，基音频率是语音情感识别中最重要的特征，其次是语音的能量，然后才是发音持续时间、发音速率等其他声学参数。


    # (1) 基音频率


    浊声音带振动的基本频率称为基音频率。基音频率的最大值、最小值、平均值、基频范围等，经常被用作情感识别的特征参数。赵力等提取情感信号基频轨迹曲线的最大值、整个曲线的基频平均值以及平均变化率等特征，将这些特征和平静语音信号的相应特征相比发现，这些参数存在明显的变化。欢快、愤怒和惊奇的平均基频、动态范围、平均变化率比较大，而悲伤语音信号则较小。对比较大的欢快、愤怒、惊奇来讲，欢快语音信号的特征量最大，其次是惊奇和愤怒。另外惊奇情感信号的基频轨迹曲线在句尾的地方往往有上翘的特征，这个重要特征有助于区分惊奇和其他情感信号。Lin
    对相邻两帧的基音频率进行简单比较，通过设定一定阈值，就能准确地区分一句话是否包含情感。这说明了基音频率在语音情感识别中的重要性。


    # (2) 共振峰


    共振峰是反映声道特性的一个重要参数。声道可以看成是一根具有非均匀截面的声管，在发音时起共鸣器作用。当元音激励进入声道时会引起共振特性，产生一组共振频率，这就是共振峰，它一般包括共振峰频率的位置和频带宽度。如图
    4 - 16 所示，语音信号的前 4 个共振峰经常用作情感识别的特征参数。


    ![](img/f188b68deb37acb6105ba97c814d9af2_104_0.png)


    钱向民对语音信号的第 1 共振峰进行研究，对几种包含不同情感的语音信号的第 1 共振峰进行比较后发现：相对于平静发音，欢快和愤怒的第 1 共振峰频率略微地提高了，而悲伤的第
    1 共振峰频率明显地降低；欢快、愤怒、惊奇、悲伤 4 种情感的第 1 共振峰的动态范围均比平静时要大，其中惊奇最大；而 4 种情感的第 1 共振峰频率的变化率均比平时要小，其中悲伤最小。


    Petrushin 进一步研究了语音信号的前 3 个共振峰及其带宽，计算其均值、方差、最大最小值和范围作为识别用特征参数。Li 研究发现，对同一句话，用不同情感朗读，信号的第
    1 和第 2 共振峰基本不变，变化主要在第 3 和第 4 共振峰。对共振峰等短时特征的分析，有助于区分喜悦和惊奇，还有忧伤和恐惧。


    # (3) 能量


    能量是用于识别语音中情感的重要特征之一。对于能量方面的分析，常用的特征参数'
  - '[PAGE 105]


    有振幅平均能量、动态范围和相应的平静语句的振幅平均能量、动态范围的差值等。欢快、愤怒、惊奇 3 种情感发音信号和平静发音信号相比，振幅将变大；相反地，悲伤和平静相比，振幅将减小。而且情感信号具有这样的倾向，即欢快、愤怒、惊奇的平均振幅越大，悲伤的平均振幅越小，其情感效应表现越明显。Zhou
    提出了 TEO(Teager Energy Operator)能量算子的概念。其研究表明，用于语音情感识别，基于 TEO 能量算子的特征比基音频率更有效，识别准确率提高了
    5%。


    # (4) 发音持续时间


    语句发音持续时间指每一句句从开始到结束的持续时间。Nicholson 确定一句话的开始和结束的位置采用的方法是把语音能量和预先设定的能量阈值做比较。当语音能量超过这个阈值，并且在接下来的连续几帧都高于这个阈值，标志着一句话的开始；当语音能量连续几帧低于这个阈值时，表示一句话的结束。这种处理可以比较有效地去除噪声的干扰。


    有学者把情感语句的持续时间和相应的平静语句持续时间的比值作为识别用特征参数。比如赵力等对说话的持续时间有如下结论：欢快、愤怒、惊奇的发音长度和平静发音相比压缩了，而悲伤的发音长度却稍稍伸长了。在被压缩的欢快、愤怒、惊奇中，愤怒的发音长度最短，其次是惊奇，然后是欢快。从发话速率和情感的关系来看，欢快、愤怒、惊奇和平静发音相比变快了，而悲伤却变慢了。


    # 2. 识别方法


    在选定特征并提取出特征以后，接下来的工作就是分类。分类方法种类繁多，比如 K 最近邻方法、支持向量机、人工神经网络、高斯混合模型、隐马尔可夫模型等。许多学者针对这些情感语音的特征，比较了不同的分类方法能够达到的不同效果，在这些分类方法中，高斯混合模型、隐马尔可夫模型性能比较出色。


    # (1) 隐马尔可夫模型(HMM)


    采用 HMM 对语音进行情感识别，不是孤立地利用语音的时序特征，而是把这些特征和一个状态转移模型联系起来。它的合理性在于把情感的变化看作语音时序特征动态变化，不同的情感可以由不同的
    HMM 模型来表现。基于 HMM 的语音情感识别扩展性好，增加新样本不需要对所有的样本进行训练，只须训练新样本；缺点是模型参数的选择仍与待处理的语音数据有关，须由实验确定，并且训练时的计算量较大(图
    4 - 17)。


    ![](img/f188b68deb37acb6105ba97c814d9af2_105_0.png)


    图 4 - 17 HMM 语音识别结构'
  - '[PAGE 106]


    设 HMM 的 \( N \) 个状态为 \(\{S_0, S_1, \cdots, S_{N-1}\}\)，初始状态概率分布为


    \( c = [c_0, c_1, \cdots, c_{N-1}] \)


    状态转移概率分布为 \( A = (a_{ij})\)，其中 \( c_i \) 为起始时刻取第 \( i \) 状态的概率，\( a_{ij} \) 为由第
    \( i \) 状态转移到第 \( j \) 状态的概率，在 \( S_i \) 状态下输出特征矢量 \( o \) 的概率服从正态分布，对 \( M \)
    个待识别的语音，每一个都建立一个 HMM 模型参数 \( \lambda(i) (i = 0, 1, 2, \cdots, M-1) \)。


    # (2) 高斯混合模型


    高斯混合模型(Gaussian Mixture Model，GMM)本质上是一种多维概率密度函数。由于采用了短时平均幅度差来计算后验概率，因此，GMM 属于短时相关分析的一种。


    应用在语音识别的过程中，就是对一个观测序列 \( X \)，也即样本语音 \( s \)，找到使之有最大后验概率的模型所对应的说话人 \( M \)，这里采用了直角窗函数取样，窗长在程序开始的说明部分通过定义一个宏
    \( N \) 来实现，改变 \( N \) 的值即可改变窗长。\( N \) 值暂定为 1。对于语音模板的后验概率可以表达为


    \( S = \max_{1 \leqslant k \leqslant s} P_m(m_k | X) = \max_{1 \leqslant k \leqslant
    s} \frac{\rho(X | m_k) \cdot P_m(m_k)}{P(X)} \)


    其中，\( X \) 为样本序列；\( m \) 为模板匹配序列；\( k \) 为模板数。


    公式说明如下：


    +   ① \( P_m(m_k | X) \)：表示已知样本序列 \( X \) 的前提下，与 \( X \) 相匹配的模板 \( m_k \) 的概率。作为
    GMM 的结果，本算法就是使用这个概率作为最终的判决依据。


    +   ② \( P(X | m_k) \)：表示已知模板序列 \( m_k \) 的前提下，与之相匹配的样本 \( X \) 的概率。因此，首先将样本 \(
    X \) 与 4 个模板对应的采样值相减以得到每个采样点的平均能量差，之后对这 4 组平均能量差，也就是方差分别求和，样本 \( X \) 所对应的那个模板的平均能量差值作为计算
    \( P(X | m_k) \) 的分子，分母则是 4 个模板的平均能量差总和。


    +   ③ \( P_m(m_k) \)：表示模板 \( k \) 在所有模板中出现的平均概率，很显然，在语音识别的过程中，每个模板被识别的概率都是相等的
    \( 1/k \)，本识别算法在测试过程中设定模板数为 4 个，即 \( k = 4 \)，所以，\( P_m(m_k) = 0.25 \)。


    +   ④ \( P(X) \)：表示样本 \( X \) 出现的概率。由于样本语音一定与模板语音的某一个属于同一个所产生，因此，\( P(X) \) 可以改用模板出现的概率来代替。具体的做法是根据每个模板的短时平均能量的总和在所有模板的平均能量总和中所占的比例分配。当对系统添加或删除识别成员时，由于每次建立模板有变化，因此模板库中的
    \( P(X) \) 需要重新计算，得到以上 3 组概率后，就可代入公式计算这个样本序列所对应的后验概率，根据“最大似然准则”，识别结果取最大的后验概率所对应的模板号码为识别结果，并作为模板匹配的最后一个依据。


    # 4.3.4.4 文本情感识别


    文本情感识别又称为意见挖掘。简而言之，是对带有情感色彩的主观性文本进行分析、处理、归纳和推理的过程。情感分析涉及多项有难度但非常有挑战性的研究任务，本文综合已有的研究成果，将情感分析归纳为两项研究任务，即信息抽取及情感倾向性分析。'
  - '[PAGE 107]


    # 1. 信息抽取


    信息的抽取应该从多个维度对文本的信息进行抽取，以获得更加全面的信息，为后面的情感倾向性分析提供足够的数据。首先,对文本主题进行抽取,来识别主题术语和领域相关的本体概念。主题主要分为显式主题和隐式主题,相对应的主题抽取自然可以分为显式主题抽取和隐式主题抽取。其次,对评价词语的抽取及极性判断。评价词语又称为极性词,是指带有情感倾向性的词语。评价词语在情感文本中的地位举足轻重,基于前人大量的研究工作,评价词语的抽取和判别往往是一个一体化的工作,主要分为基于语料库和基于词典两种方法。最后,是对观点持有者的抽取。观点持有者抽取的目的主要在于辨别情感文本的意见主体。观点持有者一般是由命名实体(如人名或机构名)组成,因此可以借助于命名实体识别技术来获取观点持有者。类似于词典分析法,此方法较为依赖自然语言处理的基础技术。


    有较低的语言覆盖现象和较差的领域适应性。也有人将观点持有者的抽取定义为分类任务,这种方法的关键在于分类器和特征的选取。


    # 2. 情感倾向性分析


    情感倾向性分析主要是分析主观性文本、句子或者短语的褒义或贬义,即判别它们的极性。下面将从三个层面介绍目前的研究状况。


    +   (1) 词汇、短语层。词汇、短语层的研究主要集中在单个词语或者短语的语义倾向性。


    有研究人员采用情感倾向定义权重优先的计算方法获得短语中各词的语义倾向度,然后分析短语中各词组合方式的特点,提出中心词概念来对各词的倾向性进行计算,以识别短语的倾向性和倾向强度。


    +   (2) 句子层。在基于单层模型的句子褒贬度分类方法中针对标记冗余引起的分类精度不高的问题,有关学者提出了基于层叠 CRFs 模型的句子褒贬度分析方法。他们利用多个
    CRFs 模型从粗到细分步地判断句子的褒贬类别以及褒贬强度,该方法在识别句子褒贬度的同时,也提高了句子褒贬度判别的准确性。


    +   (3) 文本层。文本层面的观点倾向性分析基于两个条件假设: 每个文本只有一个主题; 各个文本的主题都是已知的。常用的方法有机器学习方法和基于人工标注特征的方法。


    # 4.3.5 其他识别系统


    人工智能领域识别系统应用广泛,种类也很繁多,不止上文提及的视觉识别系统、行为识别系统和情感识别系统,还有很多其他的识别系统。本节就生活中常见的语音识别系统和嗅觉识别系统做简单介绍。


    # 4.3.5.1 语音识别系统


    直到今天,语音是人与人之间最自然、最重要的交流方式。随着科学技术的发展以及无线通信网络的创新普及,传统的桌上电脑不再是人们唯一的信息存取平台,有可能取而代之的是各种各样的手提式设备(如
    PDA、MobilePhone 等)以及人们生活中的智能设备。人们迫切需要一种便捷的方式实现人与机器的自然交互,语音识别技术因此应运而生。从语音'
  md: '

    为重要的系统工具已陆续推出了一系列的实体设备及功能设计。在移动健康看护与随身运动监测领域，有与手机相连的电子血压计、B超仪等对家用医疗市场的指定匹配以及智能眼镜、智能手环等；在公共安全领域，异常行为识别在抓捕罪犯和各大超市、银行的行为监控中正在提供不可小觑的判别增强辨识作用；在体感游戏领域，行为分析在虚拟现实中可运用许多真实人体运动数据来实现动漫中的虚拟人物运动，如微软
    Kinect 体感游戏；在竞技运动领域，踢足球机器人也是此类研究的典型代表。


    ## 4.3.4 情感识别系统


    ### 4.3.4.1 情感识别的定义


    计算机对从传感器采集来的信号进行分析和处理，从而得出对方（人）正处在的情感状态，这种行为叫作情感识别。情感识别系统可以使人与计算机进行人性化、智能化的交流，计算机可以像人一样感知周边环境和世界的变化。人类可以通过视觉、味觉、听觉、嗅觉和触觉五个器官来认识世界，获知他人的情感，而计算机主要是通过人脸的情感识别、语言声调的情感识别和语言文字的情感识别来获取对方的情感。本节将对这三种情感识别方式分别做简要介绍。


    ### 4.3.4.2 人脸情感识别


    在日常生活中，如图 4-12 所示，人脸表情是人际交往中的一种方式，是一种非肢体、非语言交流方式。心理学家 Mehrabian 指出，感情表达 = 7% 的言语
    + 38% 的声音 + 55% 的人脸表情。在日常生活与交流中，人们可以通过面部表情间接地表达自己的感情和想法，让对方感受到自己直观的态度。同时，人们也可以通过对方的面部表情，辨别出对方的情绪和真正的意图，可见，面部表情在日常人际交流中十分重要。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_0.png)


    图 4-12 人脸表情


    人可以直观地感知如他人的感情，而计算机需要通过相机，首先进行人脸检测，再提取表情特征，最后和数据库中数据进行比对，从而识别表情，如图 4-13 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_1.png)


    图 4-13 人脸表情识别原理


    - 1. 人脸检测


    日常生活中，由于人脸是非刚性的，会存在表情、姿态等变化，同时受外界环境影响，人脸也会受到遮挡、光照变化等影响，这些因素给人脸检测带来了诸多困难。在理论和实验的基础上，发现人脸检测的问题其实就是判定人脸和非人脸二分类问题。因此，人脸检测的目的是选取一幅图像中人脸区域，并对其进行预处理。目前，人脸检测的常用方法有基于肤色模型的方法和基于统计理论的方法。


    在通常情况下，利用肤色特征进行人脸检测是一种有效的方法，原因在于人脸区域的肤色都明显区别于其他背景区域。研究发现，不同种族人的肤色在颜色空间聚集在一个很小的范围之内，有着较强的聚类特性。
    HsuRL 等采用改进的光照补偿方法与非线性颜色变换，定位出图像中全部肤色区域，然后通过面部器官的轮廓特征精确定位出人脸区域；Kherchaoui 等将肤色与模板相结合，首先利用肤色模型分割出人脸候选区域，然后运用模板匹配精确定位到人脸区域。


    基于肤色模型的人脸检测方法检测速度相对较快，在头部姿态变化和部分遮挡情况下仍具有较高的检测准确率，但在背景环境颜色与肤色相近的情况下，检测准确率相对较差。


    基于图像统计特征的方法结合机器学习和统计学两者的优势，通过对大量的人脸样本与非人脸样本进行训练学习，从而获得两类样本的最佳分类界面，以此作为区分实现人脸检测。


    基于图像统计特征的方法主要有支持向量机（Support Vector Machine，SVM）和 AdaBoost 方法等。


    其中，AdaBoost 方法是目前人脸检测效果最好的算法之一，具有快速的检测速度，同时还具有较高的检测精度。


    - 2. 表情特征提取


    在检测到人脸区域后，对人脸表情特征信息进行有效的分析，针对不同的表情选取合适的特征提取方法。下面将分别从几何特征提取和纹理特征提取两个方面进行详细的描述。


    如图 4-14 所示，几何特征提取方法主要通过提取人脸的特征点，然后分析不同区域特征点之间的几何关系，比如眼睛区域和嘴巴区域等，实现对表情的分类识别，该类特征提取方法主要适用于面部疲劳表情的识别。


    ![](img/f188b68deb37acb6105ba97c814d9af2_102_0.png)


    图 4-14 人脸特征点分布


    1995 年，Cootes 等提出了主动形状模型，该方法是一种基于统计模型的特征提取方法，主要用于提取面部器官轮廓和人脸轮廓的特征点，该模型首先通过大量的训练得到初始人脸形状，然后对其操作得到较为准确的人脸轮廓特征。


    最终结果的准确性会受到人脸初始定位、光照等因素的影响。Peng 等提出一种基于局部纹理模型的改进 ASM 算法，在表情识别中具有很好的应用。


    侯婕基于经典 ASM 算法提出了针对人脸左左右眉毛、左右眼睛、鼻子和嘴巴部分提取出 118 个特征点，形成各部分的轮廓形状数据信息，以此为基础实现了对 6
    种基本表情的识别。


    纹理特征反映了人脸表情图像的底层信息，突出体现了局部表情的变化。纹理特征提取典型的方法有局部二值模式。LBP 通过图像的局部灰度信息变化来表达局部纹理特征，通过
    LBP 特征值用来描述图像局部纹理特征。LBP 算子对图像尺度变换、旋转和光照变化具有很好的鲁棒性，能够有效地描述图像的纹理信息。Guo 等又先后提出了 FCL-LBP
    算法和 disCLBP 算法，其通过选取最大内间距与最小类内间距选取出的纹理特征具有更好的鲁棒性。周宇旋等通过改进 disCLBP 得到更有辨别性的表情特征，更有利于表情识别。


    - 3. 表情识别


    表情识别是整个人脸表情识别流程的最后一步，也是最终目标，选取合适的分类器对表情识别十分重要。常用的表情分类方法有支持向量机和深度学习的方法。


    支持向量机是在统计学习理论基础上发展起来的一种新的模式识别方法。如图 4-15 所示为二维两类分类情况，H 为分类线，H1、H2 分别为对两类样本中离分类线最近的点且平行于
    H 的直线，H1、H2 之间的距离叫作两类的分类间隔。SVM 方法基本思想是要寻找一个满足分类要求的最优分类面，使得训练集中的样本点距离分类面尽可能地远，即令分类间隔最大。H1、H2
    上的训练样本称为支持向量。


    ![](img/f188b68deb37acb6105ba97c814d9af2_103_0.png)


    图 4-15 最优分类面


    研究发现,人的视觉系统对信息的处理是分级的。所有物体都是由像素点构成，像素点组成特征边缘，特征边缘组成目标物体的部分区域,最后目标物体的部分区域组成整个目标物体。深度学习模仿人类对物体的认知过程,在分类识别物体时直接把需要识别的对象进行训练,然后进行分类识别。与传统手工标定进行特征提取的方法相比，其最大的特点就是可以对识别对象进行自学习,学习到最能表达物体的特征,最终进行分类识别。


    ### 4.3.4.3 语音情感识别


    人类的语音中不仅包含了文字符号信息,而且还包含了人们的情感和情绪等信息。例如,同样一句话,往往由于说话人的情感不同,其意思和给听者的印象就会不同。当人们通过电话交谈的时候,能通过对方的声音感知到对方的情感。从这一点上看,本文认为通过分析语音来判断人的情感是可能的。语音情感识别技术的用途是很广泛的,可以用来设计人性化的语音人机界面;可以用在互动电影;可用于辅助语音识别;可以用于情感翻译;该技术还可以用在测谎、电子游戏和辅助心理治疗等方面。


    语音信号处理作为一个重要的研究领域，已经有很长的研究历史，它始终与信息科学中最活跃的前沿学科保持着密切的联系。从语音信号提取情感特征，判断说话人的喜怒哀乐，是一个新兴的研究领域。本部分主要从情感语音的特征和识别方法两方面阐述近几年国内外在这个领域的研究状况。


    - 1. 情感语音的特征


    研究发现，基音频率是语音情感识别中最重要的特征，其次是语音的能量，然后才是发音持续时间、发音速率等其他声学参数。


    - (1) 基音频率


    浊声音带振动的基本频率称为基音频率。基音频率的最大值、最小值、平均值、基频范围等，经常被用作情感识别的特征参数。赵力等提取情感信号基频轨迹曲线的最大值、整个曲线的基频平均值以及平均变化率等特征，将这些特征和平静语音信号的相应特征相比发现，这些参数存在明显的变化。欢快、愤怒和惊奇的平均基频、动态范围、平均变化率比较大，而悲伤语音信号则较小。对比较大的欢快、愤怒、惊奇来讲，欢快语音信号的特征量最大，其次是惊奇和愤怒。另外惊奇情感信号的基频轨迹曲线在句尾的地方往往有上翘的特征，这个重要特征有助于区分惊奇和其他情感信号。Lin
    对相邻两帧的基音频率进行简单比较，通过设定一定阈值，就能准确地区分一句话是否包含情感。这说明了基音频率在语音情感识别中的重要性。


    - (2) 共振峰


    共振峰是反映声道特性的一个重要参数。声道可以看成是一根具有非均匀截面的声管，在发音时起共鸣器作用。当元音激励进入声道时会引起共振特性，产生一组共振频率，这就是共振峰，它一般包括共振峰频率的位置和频带宽度。如图
    4-16 所示，语音信号的前 4 个共振峰经常用作情感识别的特征参数。


    ![](img/f188b68deb37acb6105ba97c814d9af2_104_0.png)


    钱向民对语音信号的第 1 共振峰进行研究，对几种包含不同情感的语音信号的第 1 共振峰进行比较后发现：相对于平静发音，欢快和愤怒的第 1 共振峰频率略微地提高了，而悲伤的第
    1 共振峰频率明显地降低；欢快、愤怒、惊奇、悲伤 4 种情感的第 1 共振峰的动态范围均比平静时要大，其中惊奇最大；而 4 种情感的第 1 共振峰频率的变化率均比平时要小，其中悲伤最小。


    Petrushin 进一步研究了语音信号的前 3 个共振峰及其带宽，计算其均值、方差、最大最小值和范围作为识别用特征参数。Li 研究发现，对同一句话，用不同情感朗读，信号的第
    1 和第 2 共振峰基本不变，变化主要在第 3 和第 4 共振峰。对共振峰等短时特征的分析，有助于区分喜悦和惊奇，还有忧伤和恐惧。


    - (3) 能量


    能量是用于识别语音中情感的重要特征之一。对于能量方面的分析，常用的特征参数有振幅平均能量、动态范围和相应的平静语句的振幅平均能量、动态范围的差值等。欢快、愤怒、惊奇
    3 种情感发音信号和平静发音信号相比，振幅将变大；相反地，悲伤和平静相比，振幅将减小。而且情感信号具有这样的倾向，即欢快、愤怒、惊奇的平均振幅越大，悲伤的平均振幅越小，其情感效应表现越明显。Zhou
    提出了 TEO(Teager Energy Operator)能量算子的概念。其研究表明，用于语音情感识别，基于 TEO 能量算子的特征比基音频率更有效，识别准确率提高了
    5%。


    - (4) 发音持续时间


    语句发音持续时间指每一句句从开始到结束的持续时间。Nicholson 确定一句话的开始和结束的位置采用的方法是把语音能量和预先设定的能量阈值做比较。当语音能量超过这个阈值，并且在接下来的连续几帧都高于这个阈值，标志着一句话的开始；当语音能量连续几帧低于这个阈值时，表示一句话的结束。这种处理可以比较有效地去除噪声的干扰。


    有学者把情感语句的持续时间和相应的平静语句持续时间的比值作为识别用特征参数。比如赵力等对说话的持续时间有如下结论：欢快、愤怒、惊奇的发音长度和平静发音相比压缩了，而悲伤的发音长度却稍稍伸长了。在被压缩的欢快、愤怒、惊奇中，愤怒的发音长度最短，其次是惊奇，然后是欢快。从发话速率和情感的关系来看，欢快、愤怒、惊奇和平静发音相比变快了，而悲伤却变慢了。


    - 2. 识别方法


    在选定特征并提取出特征以后，接下来的工作就是分类。分类方法种类繁多，比如 K 最近邻方法、支持向量机、人工神经网络、高斯混合模型、隐马尔可夫模型等。许多学者针对这些情感语音的特征，比较了不同的分类方法能够达到的不同效果，在这些分类方法中，高斯混合模型、隐马尔可夫模型性能比较出色。


    - (1) 隐马尔可夫模型(HMM)


    采用 HMM 对语音进行情感识别，不是孤立地利用语音的时序特征，而是把这些特征和一个状态转移模型联系起来。它的合理性在于把情感的变化看作语音时序特征动态变化，不同的情感可以由不同的
    HMM 模型来表现。基于 HMM 的语音情感识别扩展性好，增加新样本不需要对所有的样本进行训练，只须训练新样本；缺点是模型参数的选择仍与待处理的语音数据有关，须由实验确定，并且训练时的计算量较大(图
    4-17)。


    ![](img/f188b68deb37acb6105ba97c814d9af2_105_0.png)


    图 4-17 HMM 语音识别结构


    设 HMM 的 \( N \) 个状态为 \(\{S_0, S_1, \cdots, S_{N-1}\}\)，初始状态概率分布为


    \( c = [c_0, c_1, \cdots, c_{N-1}] \)


    状态转移概率分布为 \( A = (a_{ij})\)，其中 \( c_i \) 为起始时刻取第 \( i \) 状态的概率，\( a_{ij} \) 为由第
    \( i \) 状态转移到第 \( j \) 状态的概率，在 \( S_i \) 状态下输出特征矢量 \( o \) 的概率服从正态分布，对 \( M \)
    个待识别的语音，每一个都建立一个 HMM 模型参数 \( \lambda(i) (i = 0, 1, 2, \cdots, M-1) \)。


    - (2) 高斯混合模型


    高斯混合模型(Gaussian Mixture Model，GMM)本质上是一种多维概率密度函数。由于采用了短时平均幅度差来计算后验概率，因此，GMM 属于短时相关分析的一种。


    应用在语音识别的过程中，就是对一个观测序列 \( X \)，也即样本语音 \( s \)，找到使之有最大后验概率的模型所对应的说话人 \( M \)，这里采用了直角窗函数取样，窗长在程序开始的说明部分通过定义一个宏
    \( N \) 来实现，改变 \( N \) 的值即可改变窗长。\( N \) 值暂定为 1。对于语音模板的后验概率可以表达为


    \( S = \max_{1 \leqslant k \leqslant s} P_m(m_k | X) = \max_{1 \leqslant k \leqslant
    s} \frac{P(X | m_k) \cdot P_m(m_k)}{P(X)} \)


    其中，\( X \) 为样本序列；\( m \) 为模板匹配序列；\( k \) 为模板数。


    公式说明如下：


    - ① \( P_m(m_k | X) \)：表示已知样本序列 \( X \) 的前提下，与 \( X \) 相匹配的模板 \( m_k \) 的概率。作为
    GMM 的结果，本算法就是使用这个概率作为最终的判决依据。


    - ② \( P(X | m_k) \)：表示已知模板序列 \( m_k \) 的前提下，与之相匹配的样本 \( X \) 的概率。因此，首先将样本 \(
    X \) 与 4 个模板对应的采样值相减以得到每个采样点的平均能量差，之后对这 4 组平均能量差，也就是方差分别求和，样本 \( X \) 所对应的那个模板的平均能量差值作为计算
    \( P(X | m_k) \) 的分子，分母则是 4 个模板的平均能量差总和。


    - ③ \( P_m(m_k) \)：表示模板 \( k \) 在所有模板中出现的平均概率，很显然，在语音识别的过程中，每个模板被识别的概率都是相等的 \(
    1/k \)，本识别算法在测试过程中设定模板数为 4 个，即 \( k = 4 \)，所以，\( P_m(m_k) = 0.25 \)。


    - ④ \( P(X) \)：表示样本 \( X \) 出现的概率。由于样本语音一定与模板语音的某一个属于同一个所产生，因此，\( P(X) \) 可以改用模板出现的概率来代替。具体的做法是根据每个模板的短时平均能量的总和在所有模板的平均能量总和中所占的比例分配。当对系统添加或删除识别成员时，由于每次建立模板有变化，因此模板库中的
    \( P(X) \) 需要重新计算，得到以上 3 组概率后，就可代入公式计算这个样本序列所对应的后验概率，根据“最大似然准则”，识别结果取最大的后验概率所对应的模板号码为识别结果，并作为模板匹配的最后一个依据。


    ### 4.3.4.4 文本情感识别


    文本情感识别又称为意见挖掘。简而言之，是对带有情感色彩的主观性文本进行分析、处理、归纳和推理的过程。情感分析涉及多项有难度但非常有挑战性的研究任务，本文综合已有的研究成果，将情感分析归纳为两项研究任务，即信息抽取及情感倾向性分析。


    - 1. 信息抽取


    信息的抽取应该从多个维度对文本的信息进行抽取，以获得更加全面的信息，为后面的情感倾向性分析提供足够的数据。首先,对文本主题进行抽取,来识别主题术语和领域相关的本体概念。主题主要分为显式主题和隐式主题,相对应的主题抽取自然可以分为显式主题抽取和隐式主题抽取。其次,对评价词语的抽取及极性判断。评价词语又称为极性词,是指带有情感倾向性的词语。评价词语在情感文本中的地位举足轻重,基于前人大量的研究工作,评价词语的抽取和判别往往是一个一体化的工作,主要分为基于语料库和基于词典两种方法。最后,是对观点持有者的抽取。观点持有者抽取的目的主要在于辨别情感文本的意见主体。观点持有者一般是由命名实体(如人名或机构名)组成,因此可以借助于命名实体识别技术来获取观点持有者。类似于词典分析法,此方法较为依赖自然语言处理的基础技术。


    有较低的语言覆盖现象和较差的领域适应性。也有人将观点持有者的抽取定义为分类任务,这种方法的关键在于分类器和特征的选取。


    - 2. 情感倾向性分析


    情感倾向性分析主要是分析主观性文本、句子或者短语的褒义或贬义,即判别它们的极性。下面将从三个层面介绍目前的研究状况。


    - (1) 词汇、短语层。词汇、短语层的研究主要集中在单个词语或者短语的语义倾向性。


    有研究人员采用情感倾向定义权重优先的计算方法获得短语中各词的语义倾向度,然后分析短语中各词组合方式的特点,提出中心词概念来对各词的倾向性进行计算,以识别短语的倾向性和倾向强度。


    - (2) 句子层。在基于单层模型的句子褒贬度分类方法中针对标记冗余引起的分类精度不高的问题,有关学者提出了基于层叠 CRFs 模型的句子褒贬度分析方法。他们利用多个
    CRFs 模型从粗到细分步地判断句子的褒贬类别以及褒贬强度,该方法在识别句子褒贬度的同时,也提高了句子褒贬度判别的准确性。


    - (3) 文本层。文本层面的观点倾向性分析基于两个条件假设: 每个文本只有一个主题; 各个文本的主题都是已知的。常用的方法有机器学习方法和基于人工标注特征的方法。


    ## 4.3.5 其他识别系统


    人工智能领域识别系统应用广泛,种类也很繁多,不止上文提及的视觉识别系统、行为识别系统和情感识别系统,还有很多其他的识别系统。本节就生活中常见的语音识别系统和嗅觉识别系统做简单介绍。


    ### 4.3.5.1 语音识别系统


    直到今天,语音是人与人之间最自然、最重要的交流方式。随着科学技术的发展以及无线通信网络的创新普及,传统的桌上电脑不再是人们唯一的信息存取平台,有可能取而代之的是各种各样的手提式设备(如
    PDA、MobilePhone 等)以及人们生活中的智能设备。人们迫切需要一种便捷的方式实现人与机器的自然交互,语音识别技术因此应运而生。从语音

    '
  mdcn: '

    为重要的系统工具已陆续推出了一系列的实体设备及功能设计。在移动健康看护与随身运动监测领域，有与手机相连的电子血压计、B超仪等对家用医疗市场的指定匹配以及智能眼镜、智能手环等；在公共安全领域，异常行为识别在抓捕罪犯和各大超市、银行的行为监控中正在提供不可小觑的判别增强辨识作用；在体感游戏领域，行为分析在虚拟现实中可运用许多真实人体运动数据来实现动漫中的虚拟人物运动，如微软
    Kinect 体感游戏；在竞技运动领域，踢足球机器人也是此类研究的典型代表。


    ## 4.3.4 情感识别系统


    ### 4.3.4.1 情感识别的定义


    计算机对从传感器采集来的信号进行分析和处理，从而得出对方（人）正处在的情感状态，这种行为叫作情感识别。情感识别系统可以使人与计算机进行人性化、智能化的交流，计算机可以像人一样感知周边环境和世界的变化。人类可以通过视觉、味觉、听觉、嗅觉和触觉五个器官来认识世界，获知他人的情感，而计算机主要是通过人脸的情感识别、语言声调的情感识别和语言文字的情感识别来获取对方的情感。本节将对这三种情感识别方式分别做简要介绍。


    ### 4.3.4.2 人脸情感识别


    在日常生活中，如图 4-12 所示，人脸表情是人际交往中的一种方式，是一种非肢体、非语言交流方式。心理学家 Mehrabian 指出，感情表达 = 7% 的言语
    + 38% 的声音 + 55% 的人脸表情。在日常生活与交流中，人们可以通过面部表情间接地表达自己的感情和想法，让对方感受到自己直观的态度。同时，人们也可以通过对方的面部表情，辨别出对方的情绪和真正的意图，可见，面部表情在日常人际交流中十分重要。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_0.png)


    图 4-12 人脸表情


    人可以直观地感知如他人的感情，而计算机需要通过相机，首先进行人脸检测，再提取表情特征，最后和数据库中数据进行比对，从而识别表情，如图 4-13 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_101_1.png)


    图 4-13 人脸表情识别原理


    - 1. 人脸检测


    日常生活中，由于人脸是非刚性的，会存在表情、姿态等变化，同时受外界环境影响，人脸也会受到遮挡、光照变化等影响，这些因素给人脸检测带来了诸多困难。在理论和实验的基础上，发现人脸检测的问题其实就是判定人脸和非人脸二分类问题。因此，人脸检测的目的是选取一幅图像中人脸区域，并对其进行预处理。目前，人脸检测的常用方法有基于肤色模型的方法和基于统计理论的方法。


    在通常情况下，利用肤色特征进行人脸检测是一种有效的方法，原因在于人脸区域的肤色都明显区别于其他背景区域。研究发现，不同种族人的肤色在颜色空间聚集在一个很小的范围之内，有着较强的聚类特性。
    HsuRL 等采用改进的光照补偿方法与非线性颜色变换，定位出图像中全部肤色区域，然后通过面部器官的轮廓特征精确定位出人脸区域；Kherchaoui 等将肤色与模板相结合，首先利用肤色模型分割出人脸候选区域，然后运用模板匹配精确定位到人脸区域。


    基于肤色模型的人脸检测方法检测速度相对较快，在头部姿态变化和部分遮挡情况下仍具有较高的检测准确率，但在背景环境颜色与肤色相近的情况下，检测准确率相对较差。


    基于图像统计特征的方法结合机器学习和统计学两者的优势，通过对大量的人脸样本与非人脸样本进行训练学习，从而获得两类样本的最佳分类界面，以此作为区分实现人脸检测。


    基于图像统计特征的方法主要有支持向量机（Support Vector Machine，SVM）和 AdaBoost 方法等。


    其中，AdaBoost 方法是目前人脸检测效果最好的算法之一，具有快速的检测速度，同时还具有较高的检测精度。


    - 2. 表情特征提取


    在检测到人脸区域后，对人脸表情特征信息进行有效的分析，针对不同的表情选取合适的特征提取方法。下面将分别从几何特征提取和纹理特征提取两个方面进行详细的描述。


    如图 4-14 所示，几何特征提取方法主要通过提取人脸的特征点，然后分析不同区域特征点之间的几何关系，比如眼睛区域和嘴巴区域等，实现对表情的分类识别，该类特征提取方法主要适用于面部疲劳表情的识别。


    ![](img/f188b68deb37acb6105ba97c814d9af2_102_0.png)


    图 4-14 人脸特征点分布


    1995 年，Cootes 等提出了主动形状模型，该方法是一种基于统计模型的特征提取方法，主要用于提取面部器官轮廓和人脸轮廓的特征点，该模型首先通过大量的训练得到初始人脸形状，然后对其操作得到较为准确的人脸轮廓特征。


    最终结果的准确性会受到人脸初始定位、光照等因素的影响。Peng 等提出一种基于局部纹理模型的改进 ASM 算法，在表情识别中具有很好的应用。


    侯婕基于经典 ASM 算法提出了针对人脸左左右眉毛、左右眼睛、鼻子和嘴巴部分提取出 118 个特征点，形成各部分的轮廓形状数据信息，以此为基础实现了对 6
    种基本表情的识别。


    纹理特征反映了人脸表情图像的底层信息，突出体现了局部表情的变化。纹理特征提取典型的方法有局部二值模式。LBP 通过图像的局部灰度信息变化来表达局部纹理特征，通过
    LBP 特征值用来描述图像局部纹理特征。LBP 算子对图像尺度变换、旋转和光照变化具有很好的鲁棒性，能够有效地描述图像的纹理信息。Guo 等又先后提出了 FCL-LBP
    算法和 disCLBP 算法，其通过选取最大内间距与最小类内间距选取出的纹理特征具有更好的鲁棒性。周宇旋等通过改进 disCLBP 得到更有辨别性的表情特征，更有利于表情识别。


    - 3. 表情识别


    表情识别是整个人脸表情识别流程的最后一步，也是最终目标，选取合适的分类器对表情识别十分重要。常用的表情分类方法有支持向量机和深度学习的方法。


    支持向量机是在统计学习理论基础上发展起来的一种新的模式识别方法。如图 4-15 所示为二维两类分类情况，H 为分类线，H1、H2 分别为对两类样本中离分类线最近的点且平行于
    H 的直线，H1、H2 之间的距离叫作两类的分类间隔。SVM 方法基本思想是要寻找一个满足分类要求的最优分类面，使得训练集中的样本点距离分类面尽可能地远，即令分类间隔最大。H1、H2
    上的训练样本称为支持向量。


    ![](img/f188b68deb37acb6105ba97c814d9af2_103_0.png)


    图 4-15 最优分类面


    研究发现,人的视觉系统对信息的处理是分级的。所有物体都是由像素点构成，像素点组成特征边缘，特征边缘组成目标物体的部分区域,最后目标物体的部分区域组成整个目标物体。深度学习模仿人类对物体的认知过程,在分类识别物体时直接把需要识别的对象进行训练,然后进行分类识别。与传统手工标定进行特征提取的方法相比，其最大的特点就是可以对识别对象进行自学习,学习到最能表达物体的特征,最终进行分类识别。


    ### 4.3.4.3 语音情感识别


    人类的语音中不仅包含了文字符号信息,而且还包含了人们的情感和情绪等信息。例如,同样一句话,往往由于说话人的情感不同,其意思和给听者的印象就会不同。当人们通过电话交谈的时候,能通过对方的声音感知到对方的情感。从这一点上看,本文认为通过分析语音来判断人的情感是可能的。语音情感识别技术的用途是很广泛的,可以用来设计人性化的语音人机界面;可以用在互动电影;可用于辅助语音识别;可以用于情感翻译;该技术还可以用在测谎、电子游戏和辅助心理治疗等方面。


    语音信号处理作为一个重要的研究领域，已经有很长的研究历史，它始终与信息科学中最活跃的前沿学科保持着密切的联系。从语音信号提取情感特征，判断说话人的喜怒哀乐，是一个新兴的研究领域。本部分主要从情感语音的特征和识别方法两方面阐述近几年国内外在这个领域的研究状况。


    - 1. 情感语音的特征


    研究发现，基音频率是语音情感识别中最重要的特征，其次是语音的能量，然后才是发音持续时间、发音速率等其他声学参数。


    - (1) 基音频率


    浊声音带振动的基本频率称为基音频率。基音频率的最大值、最小值、平均值、基频范围等，经常被用作情感识别的特征参数。赵力等提取情感信号基频轨迹曲线的最大值、整个曲线的基频平均值以及平均变化率等特征，将这些特征和平静语音信号的相应特征相比发现，这些参数存在明显的变化。欢快、愤怒和惊奇的平均基频、动态范围、平均变化率比较大，而悲伤语音信号则较小。对比较大的欢快、愤怒、惊奇来讲，欢快语音信号的特征量最大，其次是惊奇和愤怒。另外惊奇情感信号的基频轨迹曲线在句尾的地方往往有上翘的特征，这个重要特征有助于区分惊奇和其他情感信号。Lin
    对相邻两帧的基音频率进行简单比较，通过设定一定阈值，就能准确地区分一句话是否包含情感。这说明了基音频率在语音情感识别中的重要性。


    - (2) 共振峰


    共振峰是反映声道特性的一个重要参数。声道可以看成是一根具有非均匀截面的声管，在发音时起共鸣器作用。当元音激励进入声道时会引起共振特性，产生一组共振频率，这就是共振峰，它一般包括共振峰频率的位置和频带宽度。如图
    4-16 所示，语音信号的前 4 个共振峰经常用作情感识别的特征参数。


    ![](img/f188b68deb37acb6105ba97c814d9af2_104_0.png)


    钱向民对语音信号的第 1 共振峰进行研究，对几种包含不同情感的语音信号的第 1 共振峰进行比较后发现：相对于平静发音，欢快和愤怒的第 1 共振峰频率略微地提高了，而悲伤的第
    1 共振峰频率明显地降低；欢快、愤怒、惊奇、悲伤 4 种情感的第 1 共振峰的动态范围均比平静时要大，其中惊奇最大；而 4 种情感的第 1 共振峰频率的变化率均比平时要小，其中悲伤最小。


    Petrushin 进一步研究了语音信号的前 3 个共振峰及其带宽，计算其均值、方差、最大最小值和范围作为识别用特征参数。Li 研究发现，对同一句话，用不同情感朗读，信号的第
    1 和第 2 共振峰基本不变，变化主要在第 3 和第 4 共振峰。对共振峰等短时特征的分析，有助于区分喜悦和惊奇，还有忧伤和恐惧。


    - (3) 能量


    能量是用于识别语音中情感的重要特征之一。对于能量方面的分析，常用的特征参数有振幅平均能量、动态范围和相应的平静语句的振幅平均能量、动态范围的差值等。欢快、愤怒、惊奇
    3 种情感发音信号和平静发音信号相比，振幅将变大；相反地，悲伤和平静相比，振幅将减小。而且情感信号具有这样的倾向，即欢快、愤怒、惊奇的平均振幅越大，悲伤的平均振幅越小，其情感效应表现越明显。Zhou
    提出了 TEO(Teager Energy Operator)能量算子的概念。其研究表明，用于语音情感识别，基于 TEO 能量算子的特征比基音频率更有效，识别准确率提高了
    5%。


    - (4) 发音持续时间


    语句发音持续时间指每一句句从开始到结束的持续时间。Nicholson 确定一句话的开始和结束的位置采用的方法是把语音能量和预先设定的能量阈值做比较。当语音能量超过这个阈值，并且在接下来的连续几帧都高于这个阈值，标志着一句话的开始；当语音能量连续几帧低于这个阈值时，表示一句话的结束。这种处理可以比较有效地去除噪声的干扰。


    有学者把情感语句的持续时间和相应的平静语句持续时间的比值作为识别用特征参数。比如赵力等对说话的持续时间有如下结论：欢快、愤怒、惊奇的发音长度和平静发音相比压缩了，而悲伤的发音长度却稍稍伸长了。在被压缩的欢快、愤怒、惊奇中，愤怒的发音长度最短，其次是惊奇，然后是欢快。从发话速率和情感的关系来看，欢快、愤怒、惊奇和平静发音相比变快了，而悲伤却变慢了。


    - 2. 识别方法


    在选定特征并提取出特征以后，接下来的工作就是分类。分类方法种类繁多，比如 K 最近邻方法、支持向量机、人工神经网络、高斯混合模型、隐马尔可夫模型等。许多学者针对这些情感语音的特征，比较了不同的分类方法能够达到的不同效果，在这些分类方法中，高斯混合模型、隐马尔可夫模型性能比较出色。


    - (1) 隐马尔可夫模型(HMM)


    采用 HMM 对语音进行情感识别，不是孤立地利用语音的时序特征，而是把这些特征和一个状态转移模型联系起来。它的合理性在于把情感的变化看作语音时序特征动态变化，不同的情感可以由不同的
    HMM 模型来表现。基于 HMM 的语音情感识别扩展性好，增加新样本不需要对所有的样本进行训练，只须训练新样本；缺点是模型参数的选择仍与待处理的语音数据有关，须由实验确定，并且训练时的计算量较大(图
    4-17)。


    ![](img/f188b68deb37acb6105ba97c814d9af2_105_0.png)


    图 4-17 HMM 语音识别结构


    设 HMM 的 \( N \) 个状态为 \(\{S_0, S_1, \cdots, S_{N-1}\}\)，初始状态概率分布为


    \( c = [c_0, c_1, \cdots, c_{N-1}] \)


    状态转移概率分布为 \( A = (a_{ij})\)，其中 \( c_i \) 为起始时刻取第 \( i \) 状态的概率，\( a_{ij} \) 为由第
    \( i \) 状态转移到第 \( j \) 状态的概率，在 \( S_i \) 状态下输出特征矢量 \( o \) 的概率服从正态分布，对 \( M \)
    个待识别的语音，每一个都建立一个 HMM 模型参数 \( \lambda(i) (i = 0, 1, 2, \cdots, M-1) \)。


    - (2) 高斯混合模型


    高斯混合模型(Gaussian Mixture Model，GMM)本质上是一种多维概率密度函数。由于采用了短时平均幅度差来计算后验概率，因此，GMM 属于短时相关分析的一种。


    应用在语音识别的过程中，就是对一个观测序列 \( X \)，也即样本语音 \( s \)，找到使之有最大后验概率的模型所对应的说话人 \( M \)，这里采用了直角窗函数取样，窗长在程序开始的说明部分通过定义一个宏
    \( N \) 来实现，改变 \( N \) 的值即可改变窗长。\( N \) 值暂定为 1。对于语音模板的后验概率可以表达为


    \( S = \max_{1 \leqslant k \leqslant s} P_m(m_k | X) = \max_{1 \leqslant k \leqslant
    s} \frac{P(X | m_k) \cdot P_m(m_k)}{P(X)} \)


    其中，\( X \) 为样本序列；\( m \) 为模板匹配序列；\( k \) 为模板数。


    公式说明如下：


    - ① \( P_m(m_k | X) \)：表示已知样本序列 \( X \) 的前提下，与 \( X \) 相匹配的模板 \( m_k \) 的概率。作为
    GMM 的结果，本算法就是使用这个概率作为最终的判决依据。


    - ② \( P(X | m_k) \)：表示已知模板序列 \( m_k \) 的前提下，与之相匹配的样本 \( X \) 的概率。因此，首先将样本 \(
    X \) 与 4 个模板对应的采样值相减以得到每个采样点的平均能量差，之后对这 4 组平均能量差，也就是方差分别求和，样本 \( X \) 所对应的那个模板的平均能量差值作为计算
    \( P(X | m_k) \) 的分子，分母则是 4 个模板的平均能量差总和。


    - ③ \( P_m(m_k) \)：表示模板 \( k \) 在所有模板中出现的平均概率，很显然，在语音识别的过程中，每个模板被识别的概率都是相等的 \(
    1/k \)，本识别算法在测试过程中设定模板数为 4 个，即 \( k = 4 \)，所以，\( P_m(m_k) = 0.25 \)。


    - ④ \( P(X) \)：表示样本 \( X \) 出现的概率。由于样本语音一定与模板语音的某一个属于同一个所产生，因此，\( P(X) \) 可以改用模板出现的概率来代替。具体的做法是根据每个模板的短时平均能量的总和在所有模板的平均能量总和中所占的比例分配。当对系统添加或删除识别成员时，由于每次建立模板有变化，因此模板库中的
    \( P(X) \) 需要重新计算，得到以上 3 组概率后，就可代入公式计算这个样本序列所对应的后验概率，根据“最大似然准则”，识别结果取最大的后验概率所对应的模板号码为识别结果，并作为模板匹配的最后一个依据。


    ### 4.3.4.4 文本情感识别


    文本情感识别又称为意见挖掘。简而言之，是对带有情感色彩的主观性文本进行分析、处理、归纳和推理的过程。情感分析涉及多项有难度但非常有挑战性的研究任务，本文综合已有的研究成果，将情感分析归纳为两项研究任务，即信息抽取及情感倾向性分析。


    - 1. 信息抽取


    信息的抽取应该从多个维度对文本的信息进行抽取，以获得更加全面的信息，为后面的情感倾向性分析提供足够的数据。首先,对文本主题进行抽取,来识别主题术语和领域相关的本体概念。主题主要分为显式主题和隐式主题,相对应的主题抽取自然可以分为显式主题抽取和隐式主题抽取。其次,对评价词语的抽取及极性判断。评价词语又称为极性词,是指带有情感倾向性的词语。评价词语在情感文本中的地位举足轻重,基于前人大量的研究工作,评价词语的抽取和判别往往是一个一体化的工作,主要分为基于语料库和基于词典两种方法。最后,是对观点持有者的抽取。观点持有者抽取的目的主要在于辨别情感文本的意见主体。观点持有者一般是由命名实体(如人名或机构名)组成,因此可以借助于命名实体识别技术来获取观点持有者。类似于词典分析法,此方法较为依赖自然语言处理的基础技术。


    有较低的语言覆盖现象和较差的领域适应性。也有人将观点持有者的抽取定义为分类任务,这种方法的关键在于分类器和特征的选取。


    - 2. 情感倾向性分析


    情感倾向性分析主要是分析主观性文本、句子或者短语的褒义或贬义,即判别它们的极性。下面将从三个层面介绍目前的研究状况。


    - (1) 词汇、短语层。词汇、短语层的研究主要集中在单个词语或者短语的语义倾向性。


    有研究人员采用情感倾向定义权重优先的计算方法获得短语中各词的语义倾向度,然后分析短语中各词组合方式的特点,提出中心词概念来对各词的倾向性进行计算,以识别短语的倾向性和倾向强度。


    - (2) 句子层。在基于单层模型的句子褒贬度分类方法中针对标记冗余引起的分类精度不高的问题,有关学者提出了基于层叠 CRFs 模型的句子褒贬度分析方法。他们利用多个
    CRFs 模型从粗到细分步地判断句子的褒贬类别以及褒贬强度,该方法在识别句子褒贬度的同时,也提高了句子褒贬度判别的准确性。


    - (3) 文本层。文本层面的观点倾向性分析基于两个条件假设: 每个文本只有一个主题; 各个文本的主题都是已知的。常用的方法有机器学习方法和基于人工标注特征的方法。


    ## 4.3.5 其他识别系统


    人工智能领域识别系统应用广泛,种类也很繁多,不止上文提及的视觉识别系统、行为识别系统和情感识别系统,还有很多其他的识别系统。本节就生活中常见的语音识别系统和嗅觉识别系统做简单介绍。


    ### 4.3.5.1 语音识别系统


    直到今天,语音是人与人之间最自然、最重要的交流方式。随着科学技术的发展以及无线通信网络的创新普及,传统的桌上电脑不再是人们唯一的信息存取平台,有可能取而代之的是各种各样的手提式设备(如
    PDA、MobilePhone 等)以及人们生活中的智能设备。人们迫切需要一种便捷的方式实现人与机器的自然交互,语音识别技术因此应运而生。从语音

