    答：当然不会！并且，我们可以说出很多“不会”的理由，其中最能站住脚的，莫过于书法是一种艺术，其中蕴含着深厚的文化底蕴和充沛的个人情感，这些都不是人工智能所能替代的。如果在过去，我也会肯定地支持这一立场，但现在面对科学不断的进步，我觉得这个问题不好回答了。随着科技的进步，机器人在灵活性上会比人更强，通过输入特定程序，特别是实力派书法家介入程序开发过程中，那么人工智能的行笔精准度、流畅度比人更高。无论是复杂的提按、停顿，还是简单的蘸墨、刮笔，都比人类有过之而无不及。


    书法向来被认为是慢生活的典范，平心静气，修身养性。本来可以与这一波人工智能新浪潮并行而驰，互不关联。但仔细琢磨我们的处境，却又冷漠不起来。就汉字文化而言，几千年的文明悠久持续，当然不可能轻易衰颓。可以说，把毛笔字转换成钢笔字、文言文转换成白话文、繁体字转换成简体字、汉字转换成拼音，是汉字（书法）所遇到的第一次全面的文化挑战。书法在其中濒临危境，采取何种应对方式，已是一个令人大伤脑筋的课题。互联网时代又一次改变了我们的传统文化的传承脉络与方式，这是我们遇到的不可回避的重大文化挑战。


    人工智能告诉我们，今后的语言文字交流方式，是“形体（如人脸）识别系统”和“语音识别系统”的天下，别说写字要动手，连打字动手也一概可免，只须用嘴巴讲，话音刚落，即可成文。写字无须，打字也不必。汉字在语文老师心目中，原有的“识、读、写”的教学内容，现在只要“识”“读”即可，“写”的功能马上就会被形体识别和语音识别系统所取代。写字尚且不存在，书法何为哉？有如过去我们亦有一问：民国初年开始有钢笔字流行起来，毛笔字在实用上已无必要存在，它后面的书法又如何？


    在今天的互联网时代直到今后的人工智能时代，“形体识别系统”和“语音识别系统”挟智能化之势而掀起浪潮，使得我们的后代子孙不再有必要提笔写字（包括写毛笔字、写钢笔字、打键盘、拼音拼写），而靠自动化互联网人工智能就搞定一切，没有“写字”仍然可以正常生活。


    人工智能会轻松夺取绝大部分书法创作奖，只要有章法可寻的书法体，必将会被机器所学习。从目前机器手臂书写中我们可以看出，唯一阻碍机器不能像人一样流利书写的瓶颈就是笔，字形和提按机器学起来很轻松，只有笔在书写过程中笔毛形状的变化和笔的干湿是机器的短板，随着科技和工业制造水平的不断提高，笔的问题肯定不会成为问题，那时候书法行业可能就要重新洗牌了。


    人工智能书法首先要淘汰一大批小书法家，以前在各地书画艺术市场里租一间工作室，写一手漂亮毛笔字也能养家糊口的小书法家，会被无情地淘汰。依靠书法出名越来越难，几乎会被人工智能消灭在萌芽状态。假设你学楷书，无论哪位名家可能也没有机器学得像，你不学名家，别人还不认，因为学书法讲究出处，看不起无名之辈。


    中国文艺评论家协会副主席兼秘书长庞友君认为，机器会不会取代我们今天艺术家的所有艺术创作，断然地回答是或否都为时尚早。其潜在意思是，人工智能艺术取代人类的艺术也不是完全不可能。如到那样一种境遇，机器人可能就变成了机器人群、机器人类，与人类同存共处。这就不单单是艺术的问题，而是整个人类与机器人类如何和谐相处的问题了。


    有书法家认为，人工智能书法艺术发达后，意味着书法的春天即将来临。这个观点让人耳目一新。从书法的本质特性的视角来思考这个问题，他认为书法要重视书写性，现时代的书法过于强调展览的视觉性、功利性，与表现人在生活中的自然情感、性情、意趣以及精神创造的书法本质渐行渐远。


    而人工智能书法艺术发达后，一般书法家的书法已经难以与人工智能书法分出高低上下，那时，书法竞争的功利性已经逐渐失去意义，而人工智能对人类造成的冲击，将使人们对自身的生命价值产生新的焦虑与追问，从而迫使人们静下心来审视书法以及其他艺术的本质意义，那时自然的书写、精神的交流与创造成为人们的内在迫切需求。人们迫切需要以审美的力量解答心灵归属问题，对心灵的渴望予以真正的满足，给焦躁孤独和漂泊的灵魂以意义和价值的安顿，对人类困境给出审美的精神层面的回应和引导。


    ### 8.4.2 人工智能的绘画创作


    世界上第一幅由计算机算法创造的绘画在佳士得纽约拍卖会上拍卖，这是人工智能创造领域的又一次突破。这幅名为《爱德蒙·贝拉米肖像》的绘画作品，是由巴黎3名25岁的青年创作的贝拉米家族（虚构）肖像中的一幅，他们利用计算机对以往创造的15000幅肖像画进行了识别和训练后，就开始了人工智能绘画的首次创造，预计这幅绘画将在拍卖会上以7万元（人民币）以上的价格成交。


    一台采用创造性对抗网络的人工智能系统通过了图灵测试，并且以0.53的高分，击败了人类艺术家的0.41分。这意味着机器创作的艺术品比市面上的人类艺术品，更符合大众对艺术的预期。


    希腊艺术家Tsagari说，人工智能艺术“令人着迷”，他认为这种算法与人类更多的是同伴关系而不是破坏性威胁。


    Tsagari说，“机器作画和人类创作看起来是一回事，把人工智能带到一个可以创造概念的层次，一系列的情感将会建立在它创造的画作基础上，这是一个全新的层次。”


    罗格斯大学的艺术与人工智能实验室在原有的GAN（生成性对抗网络）的基础上重新设计，制作出一套名为CAN（创造性对抗网络）的人工智能。在运行了一段时间后，这套系统开始生成极富创造力的抽象艺术品。实验室主任艾哈迈德·艾尔加迈尔（Ahmed
    Elgammal）震惊不已，因为这些作品无异于艺术市场上流行的那种抽象画。于是，在两周后，他组织了一场图灵实验，邀请大众辨别这些作品到底是人类艺术家的作品，还是人工智能的创作。


    受试者在不知情的状态下被要求观看四类作品，分别是CAN和GAN生成的图像、2017年巴塞尔艺术博览会上的人类艺术家作品和抽象表现主义大师的作品。并对作品的喜恶程度、精致度、创新性和复杂度进行评分，结果出人意料。


    53%的人工智能艺术被认为是人类作品，首次超过半数。而在对照组，即巴塞尔艺术博会的作品中，只有41%的作品被认为出自人类之手。不仅如此，人工智能艺术的各项评分都超过巴塞尔艺术博会的参展作品，并且在创新性和复杂度上远超后者。


    这意味着CAN比人类艺术家更了解我们对抽象艺术的喜恶和预期，也更具“创造力”。并且，更意味着面对人工智能艺术，我们已不能区分谁是作者。如果进一步推理，则可预见在不久的将来，至少在抽象艺术领域，人工智能可以代替人类艺术家的创作。而我们的艺术家，或许要靠临摹人工智能艺术混饭吃了，因为目前人工智能还不能真正地画画，只能生成图像。


    长期以来，人们一直认为，人类的丰富创造力和想象力是人工智能无法超越的。配置了人工智能系统的“神奇机器”既没有经历过人类世界的多样性，也没有自己的情绪和记忆，要让它们成为画家真是勉为其难。然而，随着人工智能相关技术的不断演进，尤其是算法的持续改进，那些“神器”不仅已拥有“智慧”，也开始拥有“艺术细胞”。人工智能“绘画”已完全不同于传统的“机器打印”，而是像人类画家那样“主观”地绘画。现在，人工智能系统不仅会素描，还会用颜料进行绘画。


    谷歌已推出“深度梦境”这一能创作画作的人工智能系统。它建立在人工神经网络算法的基础上，具备多层的数据网络，为艺术赋予了量化和数学属性，可以识别图像后作画。使用者输入一张照片，经过10至30层的人工神经元解读后，它会选取照片的重点特征进行加强或者重塑。


    德国科学家也尝试用深度学习算法，让人工智能系统学习凡·高、莫奈等世界著名画家的画风，创作出全新的“人工智能世界名画”。基于深层神经网络的人工智能系统具备高感知质量的绘画模仿能力，用神经表征分离与重组的内容和图像风格，提供神经网络创造艺术形象的算法。同时，通过相似性生物视觉对比，让人工智能可以理解人类创建的艺术形象并进行模仿。


    人工智能系统也能进行“模仿式”的绘画创作。在“下一个伦勃朗”项目中，人工智能系统对荷兰著名画家伦勃朗的所有作品进行了数据分析，最大限度地模仿其画风，然后应用3D打印技术创作出具有油画质感的肖像作品。


    如今，人工智能的突破性发展大大推动了科技和艺术的交融。“机器绘画”已成为现代艺术家的新“神器”。在色彩应用方面，人的想象力其实是有限的，而人工智能系统在色彩应用方面却极具创造力。它一旦学会配色，就能进行无限的图片创作，而且能在色调、饱和度等方面做出平衡。人类画家与人工智能系统强强联手，更能创造出完美作品。人工智能系统可以把图像分解为不同风格和内容的组件，把神经网络用作通用图像分析器，采用风格转换算法创造出融合某种图像风格和另一种图像内容的新作品。通过这种“混搭”，可轻松创作出各种略显诡异、怪诞的画作。而业余画家也可以利用人工智能绘图软件，根据搜索到的图像绘制角色。想画什么角色，只须输入角色名，人工智能软件会自动在网上找图并提取特征，绘制出这名角色的新图。


    当然，机器的理性思维与艺术相关的感性思维有明显差异。所以，用人工智能“绘画”还是非常有难度的。为了更好地“绘画创作”，人工智能系统必须学会自我感知，以更好地理解与人类画家创造作品时相关的情绪、心理和生理等诸多因素，以达到人类能感知的艺术境界，引起欣赏者的共鸣。


    未来人工智能绘画系统将会在情感和记忆方面进行进一步延展，通过自主学习和自主绘画回忆让整个系统能够找到更多的自我意识，从而通过样本的不断累积，创作出更多的精彩作品。到2035年，人类的思维不可能，也不应该可以继续跟上人工智能机器的步伐了。


    ### 8.4.3 人工智能的音乐创作


    一首由AI协助创作的歌曲“NOT EASY”登上了iTunes热门歌曲榜单第四，这首歌曲的创作，首先是由AI统计了近5年美国热门歌曲的共同点，以及歌曲在文化、传播等方面的数据，建立起一个“情感”，再根据这些情感，产生不同的音乐元素、片段，再由作者Alex进行筛选或者加工后呈现出来。在音乐人工智能创作中，Sony的Flow
    Machine系统通过大数据分析来创作leadsheet。所谓的leadsheet也被翻译为领谱，主要用来定义前几小节的旋律和全曲的和弦走势；Margareta
    Ackerman的ALYSIA系统可以处理英文短句，并把文字与音符关联在一起。ALYSIA可以用这种方式写完一整首歌，或者为每一小节提供各种各样的选择，像是艺术家的一个共同创作者。一个名为Amper的人工智能系统作曲并监制了歌手Taryn
    Southern的新专辑IAMAI中的“Breaking Free”，被媒体称为第一张人工智能作曲和制作的专辑。


    用人工智能为音乐创作降维的盒声音乐成立了，创业思路来自创始人个人经历与普遍的行业痛点。创始人施佳阳早年通过作曲软件DAW（Digital Audio Workstation）接触到音乐创作，并由此进入了音乐行业，这让他意识到技术对于音乐者爱好者的帮助，但这些音乐制作软件存在诸多问题，比如操作性差，产品更新慢，反馈不够精确。


    音乐创造者普遍的问题在于寻找灵感的方式有限。他们需要花时间营造适合创造的音乐氛围，这个过程会给自身很大的压力。而做完一段音乐后，创作者往往没办法利用以前的经验来获得灵感。


    “盒声音乐做的是一个降维的工作，也就是降低肌肉记忆的最低标准。”艺术需要肌肉记忆，比如音乐家需要手指的肌肉记忆，通过钢琴完成伴奏，从而完成唱歌的过程，这一个寻找灵感的过程有时候显得过长。


    盒声音乐可以缩减这个过程，创作者可以通过输入标签，输入歌词，上传图片等方式生成音乐小样，获得音乐反馈帮助自己获得灵感完成创作。盒声音乐系统还可以解析音乐，对创造者的风格做一个猜想，通过机器学习已完成的作品方法来帮助创作者形成个人风格。


    盒声音乐目前十分钟能创作一首短音乐，对比而言音乐人平均一两天才能创作一首，施佳阳未来计划缩短到两分钟创作一首短音乐，“音乐本身时间越长，人工智能的优势越大”。


    盒声音乐对应着两个方面的目标：降低音乐爱好者进行创作的门槛，帮助音乐人更好地获得灵感并形成风格。


    盒声音乐的创作团队是音乐产业内科技爱好者与IT产业内音乐爱好者的集合，这个团队很早就在做音乐科技的探索，并最终将突破口放在人工智能上。


    盒声音乐的算法分两块，一种是谷歌的开源算法，对数据进行无监督的机器学习。此外盒声还有一套自主研发的智能作曲系统“YAME”，这套系统与国外普遍的“暴力算法”相区别，会有专家系统对人工智能进行审美的引导，进行音乐语汇的计算，合成和渲染。“盒声音乐产出的音乐平均质量应该在行业平均水准之上。”


    对电影制作方、商业地产等配乐需求方，盒声音乐直接为其提供精准的定制化音乐，并附带他们能理解的个性化标签，针对不同需求方提供不同输入方式，在时长、风格等方面进行定制化创造。


    对于音乐人团队，盒声音乐团队为其提供前端数据，开放更多自定义空间，比如速度、风格、节奏这样的选项来帮助其创作，后者也会提供一些模板来丰富盒声音乐系统。


    目前，盒声音乐已经与简单快乐达成合作，为其旗下艺人创作专辑，此外，公司还在开展的业务有为院线电影配乐，为旅游小镇提供环境音乐，为商场提供罐头音乐等。


    AIVA Technologies是人工智能音乐创作领域的领先创业公司之一。2016年2月，皮埃尔·巴罗（Pierre Barreau）、丹尼斯·什特凡（Denis
    Shtefan）、阿诺·德克尔（Arnaud Decker）和文森特·巴罗（Vincent Barreau）四名创始人在卢森堡和伦敦创立了这家AI音乐制作公司。AIVA
    Technologies团队由科研人员、企业家、工程师和音乐人组成，专门从事古典和交响乐音乐创作。


    9月9日，AIVA发布了名为《艾姆》的中国音乐专辑，专辑的主题源自中国神话故事“女娲补天”。专辑中包括8首单曲：The Creation of Planet
    Earth（《创始之初》）；Black Dragon（《黑龙》）；The Creation of Mankind（《人类始源》）；Patching up the
    Sky（《补天》）；Human Society（《人类社会》）；Five Colored Stones（《五彩神石》）；The Four Pillars of
    Heaven（《四极天柱》）；Heaven and Earth（《天地》）。所有的命名都是为了致敬这一神话故事。整张专辑的最后则以交响乐结尾，这是AIVA对其所偏爱的音乐风格的致敬。


    此外，AIVA还发布了一个9分多钟的视频《AIVA Music Engine——使用预设算法创作中国音乐》，视频大致展示了AIVA是如何使用网站技术制作这样一个中国风音乐。《艾姆》可以在Spotify、苹果音乐和YouTube上收听，同时在优酷上也有完整专辑。


    AIVA是一种人工智能产品，能够为电影、视频游戏、商业广告和任何类型的娱乐内容创作配乐。AIVA通过阅读大量伟大的作曲家比如：莫扎特、贝多芬、巴赫创作的音乐来学习音乐创作艺术，以此建立一个数学模型来学习“什么是音乐”。这个模型被AIVA用来创作独特的音乐。AIVA能够仅仅通过现有的音乐作品，捕捉到音乐理论的概念。


    制作团队表示“艾姆”这个名字具有特定的含义。“艾”寓意“长者”，同时也代表AIVA是向历史上最伟大的作曲家学习；“姆”来自“女姆”，女姆创造了人类而AIVA（艾姆）则创造音乐。


    AIVA背后的技术是基于使用强化学习技术的深度学习运算法则。深度学习是机器学习的一种特殊类型，通过对多层“神经网络”进行编程，使其可以在不同的输入点和输出点之间处理信息。这使得人工智能能够理解和建模数据中的复杂的抽象性，比如旋律中的模式或一个人脸上的特征。


    在听了大量的音乐并学习了自己的音乐理论模型之后，AIVA创作了自己的乐谱。然后，专业艺术家在录音棚里用真正的乐器演奏这些编程函数（Partitions）的结果，以达到最好的音质。


    当被问及为何选择专注于古典音乐时，AIVA Technologies的创始人解释道：“首先，它是电影、游戏、商业广告和预告片配乐中使用的主流风格。其次，供AIVA学习的所有编程函数的音乐版权都是已经失效的。虽然AIVA所听和学习的音乐确实是没有版权的，但它自己的作品并不在公共领域，因为它们是在法国作曲家协会（SACEM）注册的。”


    除了最开始对古典音乐的探索，该团队也在教授人工智能系统学习任何风格的音乐。现代音乐所提出的挑战不是作曲本身，而是乐器仪器和声音设计。例如，很多的乐队都有其独特的音色，使得他们如此与众不同。因此要创造出独特的声音，使创作的音乐在人工智能中脱颖而出并达到人的水平，将是需要解决的问题。


    根据研究小组的说法，他们已经进行了几次图灵实验，让专业人员去听AIVA的作品。到目前为止，他们中没有一个人能说出这些作品是人工智能创作的。


    AIVA得到了法国作曲家协会（SACEM）的资格认证，成为人工智能领域首个获得国际认证的虚拟作曲家。


    ### 8.4.4 人工智能的平面设计创作


    2016年4月，网络被“设计师的末日——谷歌研发出平面设计人工智能AlphaGd”的新闻所占据头条，相信无论是正在平面设计这条道路求知的学生还是已经是资深平面设计师的大咖们，都反复仔细地看了这篇报道。谷歌位于伦敦的人工智能开发小组Deep
    Mind已研发出应用于平面设计领域的新型人工智能程序AlphaGd（Alpha Graphic design，又被称为Google的人工智能设计师），人工智能设计师的出现无疑对平面设计师是一个极大的威胁。在大数据时代的今天，信息化的进步带来的不仅仅是我们生活的便捷，同时也促进着设计行业的变革。人工智能平面设计师能够存贮全球近500万个设计项目案例资料，并能根据海量数据库将客户的需求分析推导成具备普遍性市场共识与美学认知的对应设计形式，在网格、字体及色彩上都能做到合理的使用，可以在5分钟之内编排完一本300页的画册。新时代的今年，经过数据的整合研发出人工智能平面设计师，使平面设计中的版式设计产生了新的突破，极大地提高了版式排版的速度，同时节省了人力。


    智能网站会对你的文案、图像素材进行分析整合，然后交给你一个最终成品，整个过程你无须动一根手指，并且绝对不是用于篇一律的网站模板内容，每一次快速生成的网站都能让你耳目一新，总有一款令你满意，这样的全自动工具将会首先应用在网站，今后还将逐渐改变整个平面设计行业。


    AI最强的地方在于懂得不断学习进步，目前提供网站设计的AI公司Grid承诺，只要你把网站交给他们的AI，将发现它物超所值，因为它永远不要求涨工资，也不会拖延工作，就算只给它5个色调来创作，它也能回报你超过20万种独特的设计成果，而这款AI程序的售价大约只需要100美元。


