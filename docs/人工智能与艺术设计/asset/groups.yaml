    相关学者也将重点放在人工智能的伦理方面。相关文献有《机器人技术的伦理边界》《人权：机器人能够获得吗?》《我们要给机器人以“人权”吗?》《给机器人做规矩了,要赶紧了?》《人工智能与法律问题初探》,等等。值得一提的是,从以上文献可以看出,我国学者已经从单纯的技术伦理问题转向人机交互关系中的伦理研究,这无疑是很大的进步。


    # 3. AI 哲学


    20 世纪西方科学哲学的发展,经历了向“语言研究”和“认知研究”的两大转向,认识论的研究在不断去形而上学化的同时,正在走向与科学研究协同发展的道路。作为当代人工智能科学的基础性研究,认知研究的目的是为了清楚地了解人脑意识活动的结构与过程,对人类意识的智、情、意三者的结合作出符合逻辑的说明,以使人工智能专家们便于对这些意识的过程进行形式的表达。人工智能要模拟人的意识,首先就必须研究意识的结构与活动。意识究竟是如何实现可能的呢?
    塞尔说道:“说明某物是如何可能的最好方式,就是去揭示它如何实际地存在。”这就使认知科学获得了推进人工智能发展的关键性意义,这就是认知转向为什么会发生的最重要原因。


    由于哲学与认知心理学,认知神经科学、脑科学、人工智能等学科之间的协同关系,无论计算机科学与技术如何发展,从物理符号系统、专家系统、知识工程,到生物计算机与量子计算机的发展,都离不开哲学对人类意识活动的整个过程及其各种因素的认识与理解。人工智能的发展一刻也离不开哲学对人类心灵的探讨。


    人工智能的哲学问题已不是人工智能的本质是什么,而是要解决一些较为具体的智能模拟方面的问题。这些问题包括如下几个方面。


    # 1.3.3.1 关于意向性问题


    人脑的最大特点是具有意向性与主观性,并且人的心理活动能够引起物理活动,心身是相互作用的。大脑的活动通过生理过程引起身体的运动,心理状态是脑的特征。确实存在着心理状态,其中一部分是有意识的,大部分是具有意向性的,全部心理状态都是具有主观性的,大部分心理状态在决定世界中的物理事件时起着因果作用。


    +   (1) 究竟什么叫作意向性? 机器人按照指令从事特定的行为是不是意向性?


    +   (2) 人类在行动之先就已经知道自己究竟是在做什么,具有自我意识,知道其行动将会产生什么样的结果,这是人类意识的重要特征。那么我们应该如何理解机器人按照指令从事某种行为呢?


    +   (3) 意向性能否被程序化? 塞尔认为,“脑功能产生的方式不可能是一种单纯操作计算机程序的方式。”


    # 1.3.3.2 人工智能中的概念框架问题


    任何科学都是建立在它所已知的知识之上的,甚至科学观察的能力也无不与已知的东西相关,我们只能依赖于已知的知识,才能理解未知的对象。知与未知永远都是一对矛盾体,两者总是相互并存又相互依赖。离开了已知,就无法认识未知;离开了未知,我们就不能使科学认识有所发展和进化。“科学就是学习如何观察自然,而且它的观察能力随着知识的增长而增长。”'
