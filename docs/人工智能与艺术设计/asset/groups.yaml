    今天这种“增强现实”技术已被纳入最前沿、最时髦、最具开发前景的人类新技术领域。所谓该技术的前沿时髦性，是指“增强现实”技术既是“虚拟现实”（VR）技术的继承，又是“虚拟现实”技术的发展和超越。也就是说，如果虚拟现实技术旨在以虚代实的话，那么增强现实技术则通过增强在场感、沉浸感、行动感（或一言以蔽之，触觉感）的方式，旨在虚中有实、亦虚亦实。例如，一种新兴的触觉交互技术，通过触觉界面，使用户不仅能看到屏幕上的物体，还能触摸和操控它们。


    而增强现实技术具有广泛的开发前景，是指其不仅可被应用于人类娱乐游戏领域，还可被应用于人类军事领域（如美国著名的 SIMNET 系统在 20 世纪 90 年代融入增强现实技术，以使战斗人员能够把握其他作战单位的增强信息），应用于人类医学领域（如该技术可帮助医生进行手术方案的制定、手术时的辅助指引、模拟的手术训练），以及应用于工业设计和装配维修领域（该技术无论在工业设计的创意阶段，还是在产品设计和产品评估阶段都大有用武之地，另外，该技术在机械仪器的组装维修上，可将装配流程按工作进度准确显示给用户，指导用户顺利完成任务）。


    # 2.2.2 视觉结构与功能


    # 2.2.2.1 视觉的定义


    视觉是一个生理学词汇。光作用于视觉器官，使其感受细胞兴奋，其信息经视觉神经系统加工后便产生视觉。通过视觉，人和动物感知外界物体的大小、明暗、颜色、动静，获得对机体生存具有重要意义的各种信息，至少有
    80% 以上的外界信息经视觉获得，视觉是人和动物最重要的感觉。视觉是通过视觉系统的外周感觉器官（眼）接受外界环境中一定波长范围内的电磁波刺激，经中枢有关部分进行编码加工和分析后获得的主观感觉。


    人的眼可分为感光细胞（视杆细胞和视锥细胞）的视网膜和折光（角膜、房水、晶状体和玻璃体）系统两部分。其适宜刺激是波长为 370～740 nm 的电磁波，即可见光部分，约
    150 种颜色。该部分的光通过折光系统在视网膜上成像，经视神经传入到大脑视觉中枢，就可以分辨所看到的物体的色泽并能分辨其亮度。因而可以看清视觉范围内的发光或反光物体的轮廓、形状、大小、颜色、远近和表面细节等情况。


    # 2.2.2.2 视觉器官的结构与功能


    视觉器官是人和动物利用光的作用感知外界事物的感受器官。光作用于视觉器官，使其感受细胞兴奋，其信息经视觉神经系统加工后便产生视觉。通过视觉，人和动物感知外界物体的大小、明暗、颜色、动静，获得对机体生存具有重要意义的各种信息。至少有
    80% 以上的外界信息经视觉获得，视觉是人和动物最重要的感觉。脊椎动物的视觉系统'
