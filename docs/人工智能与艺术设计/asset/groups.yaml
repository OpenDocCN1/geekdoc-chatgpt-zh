    ## 5.2.3 深度学习的理论方法与分类


    在这里主要简单介绍一些常用的深度学习方法模型,深度学习发展至今,主要有以下几类学习方法模型。


    ### 5.2.3.1 卷积神经网络


    卷积神经网络(Convolutional Neural Networks, CNN)是在模式识别、图像处理领域的一种高效且稳定的方法,它通过局部感知、共享权值、空间或时间上的池采样来充分利用数据本身包含的局部特性,以优化网络结构,保证一定程度上的位移和变形的不变性。一个完整的卷积神经网络基本上由输入层,卷积层,池化层,全连接层和
    Soft Max 层这 5 种结构组成。图 5-3 是一般卷积神经网络的结构示意图。输入层是整个卷积神经网络的输入,一般


    ![](img/f188b68deb37acb6105ba97c814d9af2_119_0.png)


    代表一张图片的像素矩阵；卷积层是整个神经网络的核心，一般将前一层神经网络上的子节点矩阵卷积转化为下一层神经网络上的节点矩阵，并增加节点矩阵的深度，以达到更深层次抽象特征表达的目的；池化层的实质是数理统计矩阵块不重叠区域的聚合特征，一般有平均池采样和最大池采样两种方法，池采样层不会改变特征矩阵的深度，但可以缩小矩阵的大小，简化神经网络的结构；全连接层一般位于多次卷积池化处理后，用以给出最后的分类结果。Soft
    Max 层类似图 5 - 3 中的分类器，主要用以分类，能得到结果的概率分布情况。


    ### 5.2.3.2 受限玻耳兹曼机


    受限玻耳兹曼机（Classification Restricted Boltzmann Machine，RBM）是由 Smolensky 在玻耳兹曼机基础上提出的，由显性单元（显性变量）和隐性单元（隐性变量）构成。在受限玻耳兹曼机模型中，显性单元和隐性单元之间才会存在映射关系，显性单元内部及隐性单元内部均不会存在连接。受限玻耳兹曼机的训练方式主要是基于对比度的快速学习算法。图
    5 - 4 是受限玻耳兹曼机的结构示意图。


    ![](img/f188b68deb37acb6105ba97c814d9af2_120_0.png)


    ### 5.2.3.3 自动编码器


    自动编码器（Auto Encoder，AE）是由 Rumelhart 于 1986 年提出的一种典型的无监督式机器学习方法。自动编码器主要由编码器和解译器两部分组成。编码器的作用是将输入的信号压缩表示传递给下一层网络，而解译器的作用则是解译编码器压缩重建的数据信号，传递输出信号。编码器和解译器在本质上都是对输入的信号进行某种变换，从而复原输入信号。图
    5 - 5 是自动编码器的结构示意图。


    ![](img/f188b68deb37acb6105ba97c814d9af2_120_1.png)


    ### 5.2.3.4 递归神经网络 RNN 与长短期记忆网络 LSTM


    人类对世界的理解很大程度上基于脑海中已有的信息与认知，以阅读文章或观看电影为例，上下文对内容的理解非常关键。受此启发，研究者们对传统神经网络进行了结构改进，添加了循环递归模块用于信息的保持与传递，这就是递归神经网络（Recurrent
    Neural Network，RNN）。如图 5 - 6 左半部分所示，神经网络单元 A 接收输入 x_t、输出 h_t，这里的下标 t 表示时间。这里，模块
    A 的循环结构实现了网络中信息从 t 到 (t + 1) 时刻的保持与


    ![](img/f188b68deb37acb6105ba97c814d9af2_121_0.png)


    5-6 递归神经网络 RNN 及其展开式示意图


    基于 RNN 的展开式网络结构，可以利用前向传播算法(FP)依次按照时间顺序计算输入输出，然后利用反向传播算法(BP)将累积误差从最后一个时间步骤传递回前面的步骤。这样的方法在处理“长期依赖关系”时，后面的时间节点对前面时间节点的感知能力会下降，出现“梯度消失”的问题。


    长短期记忆网络(LSTM)是一种特殊的 RNN，由 Hochreiter 和 Schmidhuber 在 1997 年提出，之后很多研究者进行了诸多改进。LSTM
    引入了新机制，对“记忆模块”进行改进，使其能够有效学习长期依赖关系。图 5-6 是递归神经网络 RNN 及其展开式示意图。图 5-7 是 LSTM 的循环模块构成图。在传统的
    RNN 中，循环模块 A 一般由一个简单的激活层构成，这里以 tanh() 函数为例；LSTM 同样具有 RNN 的链式结构，区别在于循环模块的构成，它包含
    4 个神经网络层以特定的方式相互作用。


    LSTM 的核心思想在于单元模块的状态，即图 5-7 中的 c_t。从 c_{t-1} 到 c_t 的水平线表示每个时间步骤下的单元状态沿整个链式结构传递下去，中间过程只包含部分线性操作，因此容易以较小的损失保持信息。此外，LSTM
    可以通过“门限(Gates)”结构向单元状态中添加或从中移除信息。该操作可由一个 sigmoid 神经网络层和点乘运算实现，输出 0~1 之间的数值，用于描述信息通过的程度，0
    表示全部拒绝，1 表示全部接受。具体地，LSTM 利用 3 种门限——遗忘门限(Forget Gate)、输入门限(Input Gate)和输出门限(Output
    Gate)来实现保护和控制单元状态。对于某时刻下的单元模块，第一步需要确定哪些上文信息将从单元状态中移除，该决策由“遗忘门限”的 sigmoid 层决定(对应图
    5-7 中最左侧的方框)；第二步需要确定在单元状态中存储哪些新信息：首先，由“输入门限”的 sigmoid 层(对应图 5-7 中左二的方框)对上文信息进行更新，之后由
    tanh() 激活层(对应图 5-7 中左三的方框)创建新的候选状态：这需要结合上文信息与新信息共同确定新的单元状态，其中“遗忘门限”和“输入门限”分别决定了旧信息和新信息的权重(即接受程度)；第三步需要确定单元的输出，该输出取决于更新后的单元状态。这需要由“输出门限”(对应图
    5-7 中左四的蓝色方框)结合输入信息确定一个接受权重。在此基础上，更新后的单元状态经过激活层(对应图 5-7 中最右侧的蓝色方框)，乘该权重即可得到输出。经此
    3 个步骤，利用这 3 种门限有效地控制了增加和移除信息的频率与程度，从而实现长时或短时的信息记忆。


    ![](img/f188b68deb37acb6105ba97c814d9af2_122_0.png)


    ### 图 5-7 LSTM 的循环模块构成图


