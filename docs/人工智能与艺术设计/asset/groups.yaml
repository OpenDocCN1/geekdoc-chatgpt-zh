    析出这种识别方法所要求的语音特征参数，这些参数作为标准模式由机器存储起来，形成参考模式库。第二步是语音识别的核心，采用选择的语音识别方法进行模式匹配。语音识别核心部分又分别表现为模型的建立、训练和识别三个部分。第三步，语音识别可以进行后处理，后处理通常是一个音字转换过程，还有可能包括更高层次的词法、句法和文法处理，另外也有可能为某个具体的任务语法的输入。


    目前具有代表性的语音识别方法主要有动态时间规整算法、隐马尔可夫模型、矢量量化、人工神经网络、支持向量机等方法。


    动态时间规整算法(Dynamic Time Warping，DTW)是在非特定人语音识别中一种简单有效的方法，该算法基于动态规划的思想，解决了发音长短不一的模板匹配问题，是语音识别技术中出现较早、较常用的一种算法。在应用
    DTW 算法进行语音识别时，就是将已经预处理和分帧过的语音测试信号和参考语音模板进行比较以获取他们之间的相似度，按照某种距离测度得出两模板间的相似程度并选择最佳路径。


    隐马尔可夫模型(Hidden Markov Model，HMM)是语音信号处理中的一种统计模型，是由 Markov 链演变来的，所以它是基于参数模型的统计识别方法。由于其模式库是通过反复训练形成的与训练输出信号吻合概率最大的最佳模型参数，而不是预先储存好的模式样本，且其识别过程中运用待识别语音序列与
    HMM 参数之间的似然概率达到最大值所对应的最佳状态序列作为识别输出，因此是较理想的语音识别模型。


    矢量量化(Vector Quantization，VQ)是一种重要的信号压缩方法。与 HMM 相比，矢量量化主要适用于小词汇量、孤立词的语音识别中。其过程是将若干个语音信号波形或特征参数的标量数据组成一个矢量在多维空间进行整体量化。把矢量空间分成若干个小区域，每个小区域寻找一个代表矢量，量化时落入小区域的矢量就用这个代表矢量代替。矢量量化器的设计就是从大量信号样本中训练出好的码书，从实际效果出发寻找到好的失真测度定义公式，设计出最佳的矢量量化系统，用最少的搜索和计算失真的运算量实现最大可能的平均信噪比。


    人工神经网络(Artificial Neural Network，ANN)是 20 世纪 80 年代末期提出的一种新的语音识别方法。其本质上是一个自适应非线性动力学系统，模拟了人类神经活动的原理，具有自适应性、并行性、鲁棒性、容错性和学习特性，其强大的分类能力和输入—输出映射能力在语音识别中都很有吸引力。其方法是模拟人脑思维机制的工程模型，它与
    HMM 正好相反，其分类决策能力和对不确定信息的描述能力得到举世公认，但它对动态时间信号的描述能力尚不尽如人意，通常 MLP 分类器只能解决静态模式分类问题，并不涉及时间序列的处理。尽管学者们提出了许多含反馈的结构，但它们仍不足以刻画诸如语音信号这种时间序列的动态特性。由于
    ANN 不能很好地描述语音信号的时间动态特性，所以常把 ANN 与传统识别方法结合，分别利用各自优点来进行语音识别而克服 HMM 和 ANN 各自的缺点。近年来结合神经网络和隐马尔可夫模型的识别算法研究取得了显著进展，其识别率已经接近隐马尔可夫模型的识别系统，进一步提高了语音识别的鲁棒性和准确率。神经网络主要包括三个部分：结构、激励函数、学习规则。图
