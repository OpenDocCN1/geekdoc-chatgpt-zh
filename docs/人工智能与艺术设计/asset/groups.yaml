    AIVA 背后的技术是基于使用强化学习技术的深度学习运算法则。深度学习是机器学习的一种特殊类型，通过对多层“神经网络”进行编程，使其可以在不同的输入点和输出点之间处理信息。这使得人工智能能够理解和建模数据中的复杂的抽象性，比如旋律中的模式或一个人脸上的特征。


    在听了大量的音乐并学习了自己的音乐理论模型之后，AIVA 创作了自己的乐谱。然后，专业艺术家在录音棚里用真正的乐器演奏这些编程函数(Partitions)的结果，以达到最好的音质。'
