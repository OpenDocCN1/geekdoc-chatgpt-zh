    ### 8.1.3 艺术设计涉及的内容、方法


    设计是一种态度，它决定了作为设计师的创造力、学习能力。一个优秀的设计师，他们的设计不论是从整体和细节上都有自己的权衡。甚至是一个点，他都会去找尽可能多的位置来供自己挑选。而在这不断挑选的过程中也积累了自己的设计经验，虽然看着简单，可在以后的设计过程中，这些细节上的积累可以让他节省时间。


    设计是一种思维到具象的表达方式，它只是为了实现思维的具象而存在的手段，简单的几个字可以体现你的思想，或者一堆图片加上几个色块也同样可以表达出你的思想。而设计能力的提高只是让我们多了几种表达方式，然后再找出自己习惯的表达方式而已。进而开始完善自己习惯的方式。


    设计就是创新。设计就是追求新的可能，设计的东西有让人耳目一新的感觉，能让人产生共鸣。


    设计与市场是紧密联系的。广告设计的任务在于传递商品信息，达到说服消费者、促销商品的目的。而广告创意的内涵与艺术创意的传神是绝对不相同的，广告创意不是客观对象的艺术再现，不是作者主观情感的视觉化，而是对事物理解后的表现，创造一个求新、求奇、求异、能真实准确传播的信息，传达商品内容的图形视觉语言的图像艺术。塑造的目标是消费者个性，心理活动的意境，创造一个鲜见、奇特、极有意趣的图形，引起购买者的兴趣，使商品在消费者心中留下深刻的印象，建立一种消费观念。


    设计本意就是用聪明的方法，创造出新的理念。在决定专案前，会先思考它将会是什么样子。确定专案后，为了传达这些理念，我们需要把它转为一种刺激又先进的视觉语言——影像发人深省，声音震撼且超脱尘俗，而程式则令人赞赏不已。


    设计的首要目标是立即引起使用者的兴趣，达到视觉上的刺激并引爆重要的行销资讯。这一种资讯设计成为我们的第二本能。


    艺术无界限，因为艺术门类之间存在着很多共性的东西。触类旁通也是学习设计艺术的重要方法之一。音乐、书法、文学等艺术门类的介入，对设计创意很有帮助，其最显著的影响是增强了人的感觉力，扩大了人的感觉范围。原来可能只是对设计本身的专业感知，但如今却像多装了几根弦，使我们能在更宽广的艺术思维领域对设计产生共鸣。设计需要有创意，有想象力。作为一个设计者，了解的知识范围要广，不要只了解设计的历史，对其他方面的知识也应有所学习。多看书，多积累，对自己的创作会有帮助，同时可以激发自己的设计灵感。


    艺术设计风格的形成，是不同的时代思潮和地区特点，通过创作构思和表现，逐渐发展成为具有代表性的艺术设计形式。一种典型风格的形式，通常是和当地的人文因素和自然条件密切相关，同时又需有创作中的构思和造型的特点。风格虽然表现于形式，但风格具有艺术、文化、社会发展等深刻的内涵；从这一深层含义来说，风格又不等同于形式。


    艺术设计的风格主要可分为传统风格、现代风格、混合型风格。


    - (1) 传统风格


    传统风格是指具有历史文化特色的风格。一般相对现代风格而言，强调历史文化的传承，人文特色的延续。传统风格即一般常说的中式风格、欧式风格、伊斯兰风格、地中海风格等。同一种传统风格在不同的时期、不同的地区其特点也不完全相同。如欧式风格也分为哥特风格、巴洛克风格、古典主义风格、法国巴洛克、英国巴洛克等。


    - (2) 现代风格


    现代风格即现代主义风格。现代风格起源于 1919 年成立的包豪斯(Bauhaus)学派，强调突破旧传统，创造新建筑，重视功能和空间组织，注意发挥结构构成本身的形式美，造型简洁，反对多余装饰，崇尚合理的构成工艺，尊重材料的性能，讲究材料自身的质地和色彩的配置效果，发展了非传统的以功能布局为依据的不对称的构图手法。重视实际的工艺制作操作，强调设计与工业生产的联系。


    - (3) 混合型风格


    艺术设计是融合了技术、艺术、经济、文化等多种学科的综合学科。随着我国社会发展，经济文化水平提高，物质生活条件改善，人们对产品和环境的审美需求也逐步提高，产品(环境)除提供实用功能之外，还应美观大方，适合人的生理和心理特点，并具有强烈的时代感和一定的文化品位。这既是人们的普遍需要，也成为企业提高市场竞争力的迫切要求。混合型风格是将科学、艺术、技术交叉融合的风格，既趋于现代实用，又吸取传统的特征，在设计中不拘一格，呈现多元化、兼容并蓄、匠心独具。


    ### 8.1.4 艺术设计的行为理解


    设计是一种跳跃性或者是逻辑性思维的某种冲动，是大脑对思维的一种具象化，而这就是我们通常所说的创意。因为这种思维的方式，通过具体的表达成为创意，构造出具象的事物，从而达到同化观赏者的思维或者说唤醒观赏者的共鸣的目的。


    一幅成功有创意的广告，新奇的构思、浓缩的个性表现是设计师必先考虑的问题。除了有新奇的构思，浓缩的个性化表现之外还要根据消费者心理需求和接受的程度，以及消费者的层次来决定图形的表现手法。手法有写实的、对比的、悬念的、连续的、寓意的、夸张的，等等。不论什么手法，图形必须要新奇、典型、易懂、易读、易记。设计作为造物的艺术，功能和形式必然是合二为一的。没有功能的形式设计是累赘的装饰品，而没有形式的功能设计是见不得人的粗陋物件。


    设计不同于艺术，必须要体现出它的实用性，在使用中体现设计的价值。使用过程中令使用者感受到设计的精巧而产生愉悦感，同时将这种愉悦感升华为一种审美意象，伴随着对形式美，附加价值的欣赏，从而达到全方位的愉悦。这种全方位的令人愉悦，才真正体现出设计为人的思想。设计中的审美观应当是把物质与精神，实用与审美综合在一起的，在它们的矛盾中去把握，调整和规范它们之间的关系。所谓创意就是前所未闻和未见的，能充分反映并满足人们某种物质的或情感的需要的意念或构想。最基本的要求是求新、求奇、求异、真实，有思想、有计划，以创意的图形加速传播信息，传达商品内容。设计是把某种计划、规划、设想和解决问题的方法，通过视觉语言传达出来的过程。


    可以看出，设计的核心是一种创造行为，一种解决问题的过程，其区别于兄弟艺术门类的主要特征之一便是独创性，因此我们可以这样认为：设计之美的第一要义就是“新”。设计要求新、求异、求变、求不同，否则设计将不能被称为设计。而这个“新”有着不同的层次，它可以是改良性的，也可以是创造性的。但无论如何，只有新颖的设计才会在大浪淘沙中闪烁出与众不同的光芒，迈出走向成功的第一步。


    设计之美的第二要义是“合理”。一个设计之所以被称为“设计”，是因为它解决了问题。设计不可能独立于社会和市场而存在，符合价值规律是设计存在的直接原因。如果设计师不能为企业带来更多的剩余价值，相信世界上便不会有设计这个行业了。


    而设计之美的第三要义是“人性”。归根结底，设计是为人而设计的，服务于人们的生活需要是设计的最终目的。自然，设计之美也遵循人类基本的审美意趣。对称、韵律、均衡、节奏、形体、色彩、材质、工艺……凡是我们能够想到的审美法则，似乎都能够在设计中找到相应的应用。


    ## 8.2 艺术设计与人工智能的融合


    人工智能一词在 1955 年达特茅斯学院举办的一次会议上，由计算机专家约翰·麦卡锡第一次提出，至今已经有长达 60 年的历史。期间经历过两起两落，并且在 2016
    年达到第三次高潮。1957 年，第一款神经网络 Perceptron 的发明，使得业界对于人工智能的关注度骤升，人工智能达到第一次高潮。在此之后长达十余年的时间里，计算机被广泛应用于数学和自然语言领域，用来解决代数、几何和英语问题。这让很多研究学者看到了机器向人工智能发展的信心。1970
    年，人工智能面临技术瓶颈，计算机没能使机器完成大规模数据训练和复杂任务，AI 进入第一个低谷。第二次高潮是 BP 算法的提出，这种算法的出现使得大规模神经网络的训练成为可能。因为现实任务中所使用的神经网络，只有在使用
    BP 算法下才能进行训练。BP 算法由 BP 神经网络中的输入层、输出层和若干个隐层构成。输入信号经输入层输入，通过隐层计算由输出层输出，输出值与标记值比较，若有误差，将误差反向由输出层向输入层传播，在这个过程中，利用梯度下降算法对神经元权值进行调整。自从
    2016 年 AlphaGo 赢了人类世界的围棋冠军，社会上对人工智能技术的关注热度日渐提升。在人类理性工作领域，人工智能正在颠覆性地改变着许多行业，很多机械化的工作已经被人工智能取代。另一方面，人工智能也正在进入人类的感性艺术领域，努力将艺术公式化（规范化），人工智能产品通过深度学习艺术家的笔触，依据一定的逻辑算法创造艺术作品，再次让经典艺术家“复活”，以此陶冶人类的情操。未来，机器可以代替人类完成很多事情，很多可以被公式化的人类职业都可以被人工智能取代，人类从脑力以及体力方面都可以最大化地被解放出来。通过探讨人工智能在数字化时代中的应用，可进一步分析探讨人工智能与艺术设计之间的关系。


    ### 8.2.1 艺术设计的理念的改变


    随着移动终端的普及、移动互联网技术的增强，以及虚拟现实、大数据、云计算、人工智能的不断发展，数字移动媒体的视觉媒介正在向即时的、互动的、超文本衔接的传播形态发展。信息从发布到接收再到反馈，都呈现出交互式、全球化的新传播特征，新媒体应运而生。在新媒体影响下的艺术设计已发生了颠覆性的变化，以纸媒为主的海报、包装设计扩展到以网络、移动通信、LED
    等多维平台为载体的网页设计、UI 设计等。新媒体融合了数字技术、信息技术与设计艺术，为艺术设计的创新注入了更多的灵感与活力，使艺术设计的视觉语言更加丰富，手段更加多元化，表现形式也从二维向三维、四维交互装置设计方向发展。“读图时代”“视频时代”已经真正到来，这为艺术设计带来了更多的机遇和挑战，新媒体也广泛应用于艺术设计领域。


    艺术设计是通过作品传递视觉信号，达到传递信息目的的一种艺术表现形式。从工业化社会到信息化社会，现代艺术设计的形态、范围与空间不断拓展，每一次技术与媒体的变革都赋予其新的活力与内涵，是人类走向文明的标志之一。最早的艺术设计从文字书写与排版开始，19
    世纪印刷技术变革引发欧洲工艺美术运动，现代设计由此诞生。20 世纪初，摄影技术发展为设计提供了更多的表现手段，电视和计算机的出现极大地扩展了视觉艺术领域，为艺术设计带来了更多的平台和展示空间。


    20 世纪后期，计算机图形图像技术突飞猛进，设计类软件日趋成熟，Photoshop、Corel Draw 等软件普遍应用于设计行业，设计师不再受时间、空间、材质的限制，利用计算机即可快速进行设计和修改。韩国知名设计师安尚秀提出，要将传统的艺术设计和现代设计整合，从艺术设计本质出发，把艺术设计称为“视觉传达设计”。视觉传达是通过可视形式传播特定事物的主动行为，大部分或者部分依赖视觉，并以标识、排版、绘画、艺术设计、插画、色彩及电子设备等进行二度空间的影像表现。在经济与广告业繁荣发展的
    21 世纪前后，我国的视觉传达设计大多以二维设计为主。随着数字新媒介的产生和快速蔓延，新媒体艺术更加注重设计的内涵和立体、交互式的互动体验。无论是专业设计人员还是终端受众，在视觉传达设计的过程中都存在一个现象，即传播、教育、说服观众的影像伴随文字具有更大的影响力。进入
    21 世纪后，IT 产业迅猛发展，计算机硬件、软件不断更新换代，为艺术设计软件的开发与升级提供了更多可能性，容易操作的设计软件开始被普通人使用。如今，几乎每个人的手机中都安装美图秀秀、天天
    P 图、易企秀等图形图像处理 APP，可以随时随地对图形图像进行编辑和设计。艺术设计不再是设计师的事，它几乎成为人们生活中不可或缺的内容。由此可见，社会、科技发展的每一次变革都改变着传统艺术设计的形态和表现形式。


    即时通信技术的发展，让微信、微博等工具类媒体出现，相应的排版、图文制作、摄影、摄像等 APP 不断涌现，艺术设计制作变得更加简单、易操作。视频 3D 技术的成熟，VR、AR
    等虚拟现实技术的不断发展，让原本平面的视觉语言通过一定的方式转变为全景立体的画面，观看体验更加震撼。可以说，艺术设计从平面化向全视觉发展，跨入了一个崭新的阶段。


    艺术设计是以某种目的为先导，运用符号、文字、图案、色彩、排版等专业技巧将其巧妙融合，将作者的思想以图片或图像等可视的艺术形式表现，传达一些特定的信息给被传达对象，并以对被传达对象产生影响为目的。在新媒体时代，飞速的网络传播打破了原有静止式、被动式的等待阅读方式，设计师要更加主动地将信息分享给受众。例如，一个产品希望得到更好的宣传和推广，从品牌标志、产品外观、宣传海报到展示网站、微信版式等都需要艺术设计来展现。


    艺术设计是 IT 技术、生产工艺和艺术创意相结合的综合体现，设计作品的创意形象、色彩搭配、版式排列，甚至使用的不同材质，都可以通过视觉对观看者的心理产生触动。一个优秀的商业广告设计可以通过创意突出产品特性，反映产品内在的质量和品质；一个具有创意的公益海报可以传达良好的生活理念或政治思想；同样，一个好的互动设计可以增强受众的直观感受，提高参与度，使其对作者要表达的内容有更深入的了解，引导其做出消费或者行为选择。人们购买一种产品或者认同一种理念，是对诸多影像、文字的一系列认知与感受的结果。例如，人们要选择一种商品或者服务，往往希望物美价廉，而“物美”是通过商品或者服务的品质、外观设计展现出来的。消费者通过艺术设计的载体认知、了解产品，从而产生信任，最终支配购买行为。所以说艺术设计是为商业社会服务的，整个过程也是艺术设计的商业价值所在。在创作手段和表现形式上，艺术设计不断与新技术融合。互动式设计、动态式海报、翻阅式文本等手机移动终端上的新媒体应用已经很好地结合到艺术设计中；静态的纸质海报被电子屏广告牌、车载电视、平板电脑、手机屏幕等载体所取代；地铁、公交车上随时可见的传播载体已成为乘客路途中的消遣；商场外平面的巨型喷绘在移动电视里不断重复播出，或是在手机屏幕上反复出现。当人们通过不同的手机
    APP 第一时间获取资讯，随时随地接收图片、视频等信息时，远比传统的报纸、杂志更加方便、快捷。在其他领域的宣传展示空间里，很多学者、专家、教师以及企业高管在讲座、授课、业界宣传时应用大量新媒体形式的
    APP 软件（直播助手、ShowMotion、问卷星、Enlight、钉钉等），在资料收集处理、人员管理、PPT 制作过程中，由多种软件生成的信息量巨大的界面令人眼花缭乱、目不暇接，慕课、微课、翻转课堂的兴起无不显示出新媒体在众多领域的广泛应用。设计师不仅要考量文字、图形、色彩等基本元素，还要设计视频、音频以及触碰
    UI 等互动元素。另外，设计师还要针对用户浏览习惯，考虑第一屏和第二屏的递进关系。例如，目前以 UI 界面设计为主要运行形式的平板电脑、在线商务、游戏产品以及其他触屏移动技术产品，主要由用户需求调研、交互设计、界面设计三个部分组成，通过处理成千上万、色彩纷呈的各种信息，完成一个复杂的、由不同学科参与的工程，其间还需要将认知心理学、设计美学、设计手段相融合，最终实现软件产品视觉效果的艺术化。在数字化时代，探索城市智慧生活方式的设计，不能离开对人工智能与设计创新之间关系的研究。近年来，人工智能逐渐深入人们的生活，从语音识别、翻译机器人，到无人驾驶汽车、无人机，人工智能技术正在广泛地被应用到生活中。在设计领域，设计师们越来越关注人工智能对整个行业带来的机遇和挑战，人工智能是否会彻底抢走设计师的工作？世界经济论坛宣称“数十亿人被移动设备连接着。我们有着前所未有的处理速度、储存空间和知识共享能力，这些数据有无限可能”。美国特斯拉公司
    CEO 埃隆·马斯克提出警告：“毁灭开关”无力阻止决意攻占世界的人工智能。从智性设计、智能设计、美学角度思考艺术设计的不断发展，同时提出在加强对人类社会生活需求进行深入研究的基础上，进行设计创新。


    ### 8.2.2 艺术设计的人工智能技术的融合


    人工智能已经无处不在，根据预测，到 2020 年，人工智能市场规模将超过 1530 亿美元。美国莱斯大学计算机科学教授摩西·瓦迪断言：未来 30 年，人工智能将取代目前世界上
    50% 的工作。设计教育的改革和转型，需要更新教育的观念、内容和模式方法。人工智能在辅助设计和艺术设计教育中的创新型应用究竟能有多少？学习艺术的人不知道，学习技术的人更加说不清楚，只有通过渐进式的使用创新，才能在一定程度上带来适合艺术设计创新的设计教育资源以及艺术设计创新思维。


    人工智能在全球数字化进程迅速发展背景下，两者的融合正在迅速地重构艺术设计的领域、设计手段和艺术表现形式，人们将这种数字媒体设计的又一次升级简称为“数智艺术”。美国高德纳咨询公司（Gartner
    Group）发布的《2017 新兴技术成熟度曲线报告》指出：人工智能技术在 33 项新技术中占据了 50% 以上的比例，已经到达了曲线的顶峰，这也预示着在未来
    2 至 5 年内，人工智能技术将得到广泛的应用。人工智能技术是兼具环境感知、记忆、推理、学习能力的智能系统，在设计领域中，计算机辅助设计（CAD）正在向人工智能辅助设计（AI
    Design）的方向发展。例如，“双 11”期间阿里巴巴公司的人工智能产品“鲁班”，设计了 4 亿张广告横幅，惊艳了众人。可是在人工智能取代基础美工进行设计的同时，《第一哲学沉思集》中提到：人们也发现机器对于美的理解和判断，并不是单纯靠计算机语言来实现的。设计师成为“训练师”来培养计算机的美感，从而使计算机能够在设计和学习的过程中逐渐产生一种类人类的智慧，能够对于设计美学产生理解和思考，进而反映在设计作品中。在数字化进程中，智性设计、智能设计满足了新一代消费主力的新型消费观念，对量化、规模化生产所带来的“消费观”，从过去的实用主义观念上升到了个人主义和享乐主义的消费观。从现象层面上看，美学的思考提倡的高度个性化、定制化的消费观，人们正在回归“审美泛化”的文化潮流。从美学的角度去审视智慧生活中艺术和生活的界限，可以促使艺术与科技、艺术与生活更好地结合，让美自然存在于数字化都市的生活中，也是一种设计的智慧。


    发展人工智能的目的是更好地服务于人自身，艺术和设计正是从人的情感的体验角度出发。艺术强调人的主观概念的表达，人工智能应用的未来，更多地要思考人的需求以及在不同的生活环境中需求的改变。从目前人工智能的应用场景来看，应用人工智能去解决确定边界的事情，人一定会输给机器；但是需要依靠感性决策做判断时，应用人工智能以大数据为基础进行的逻辑推理往往是靠不住的。就目前可见的未来而言，人工智能只能提供技术，优秀作品的出现，一定是当时的时代有新的技术或者手段出现。达·芬奇的作品为什么这么成功？因为当时他运用了新的颜料、新的绘画技法、新的工具。人工智能可以帮助我们进行创作吗？对于艺术来说，强调的是人的主观概念的表达。齐白石曾经说过“似则俗，不似则非”，艺术是没有界限的，所以这部分，人工智能技术永远没有办法取代人类来完成。数智艺术设计的关键还是在于应用人工智能技术来引入新的手段和媒介，以此丰富人们的艺术设计方法，数字艺术与人工智能结合的核心还是取决于人的价值观。


    随着人工智能技术的迅速发展，停留在传统设计领域的设计师岗位将会逐渐被机器所替代。但是，艺术设计也并不是所有的工作都被机器所取代，那些注重创意的内容将仍然是机器无法做到的。艺术家与设计师需要更多地思考艺术与设计中无形的东西，创意和创造力将会成为设计师的最核心的竞争力。人工智能背后强大的计算能力，可以帮助设计师更好地利用历史数据研究人的需求，通过设计帮助人解决问题，使用数据去辅助设计思考。


    随着数字时代的来临，人们生活在一个复杂的环境中，有越来越多的物质需求和精神需求。社会带来很多的资讯，这些信息将人们推到了一个被动的角度去接受新的技术、新的产品、新的数字生活。思考数字设计中的美学和智慧，需要重新站在自己的角度去看待这个时代，感受这个时代的生活。人工智能可以为人类带来什么？不仅是设计越来越多的产品让城市生活更加高速和快捷，更是让人类可以用创新思维和情感思维去重新理解自己对于生活的终极需求，从而设计出更符合人类需求的艺术品或者产品。


    ### 8.2.3 艺术设计的理性与非理性行为


    正确的逻辑思维是一切设计的起点，思维和逻辑是人们在专业领域披荆斩棘的法宝，在创意里也是一样。当我们在学习设计的基础知识时，也可以说是培养设计的思维，其中的逻辑思维是指人们从感性认识上升到理性认识的变化，它是以概念、推理、逻辑分析等方式为基础的，是对客观现实的认识变化进行能力的体现。将人的认知能力、推导能力充分地发挥出来，使创意得以产生，使思维变得更加严谨、有序，并且富有一定的逻辑性。一般在创意设计中，思维具有感性和理性的特征，逻辑思维是实现设计师创意的有效途径。


    大多数没能成功的设计基本上都是由于在主要问题点上没有进行很好的处理，这也正是由于设计者的逻辑思维不合理，对事看得不透彻，使重点没有突出出来，使得设计效果不理想。在创意设计中，逻辑思维能力是非常关键的。创意设计的主要工作就是为了使人们的某种物质需求得以满足，而且在满足需求的过程中使人们在情感和审美上的需求得到满足。艺术设计的动力主要来自创意这一思维形式，只有科学的、合理的思维方式才能使创意性思维得以有效地进行。在设计思维过程中，也时常有一些问题比如传统思想、观念等，会对设计创新产生一定的影响。这时，我们可以采取逻辑思维的方法，对问题进行分析、推理，最终使结论形成。


    - 第一，设计的前提就是对问题进行分析。例如图案中的写生，倘若不能将对象的特点和典型动态掌握，就进行分析和总结，是没有办法将事物的本质特点和突出特点抓住的，不是毫无章法，就是单一枯燥。在一个设计作品中，整体与局部之间，局部与局部之间都是不断变化的，而且是有一定的规律的。形象、线条以及空间等，在视觉上都要有一定的比例，既不可以靠得太近，也不可以太过分离，即使不像数学学科那么严谨，也要在视觉和心理上达到一定的要求。所以，在视觉上对于图形、色彩的分析，必须利用大脑对其进行选择，才能将艺术设计的核心内容掌握。


    - 第二，逻辑思维方法的第二个阶段就是对问题进行研究。设计想法不会只进行一次就能将构思实现，它必须在经过详细分析之后，还必须进行研究和探索，将各类知识综合在一

