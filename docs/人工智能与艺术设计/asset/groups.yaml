    # 7.2.2 智能交通


    交通是人类社会生产、生活以及经济发展的必要环节。随着时代的发展和科技的进步，人们在对交通产生强烈依赖的同时也对交通提出了更多的需求。然而社会经济的发展、城市化进程的不断深入、快速增长的人口对交通需求的加强，直接导致机动车数量呈爆炸式增长，无论是在诸如欧美等发达国家和地区，还是在诸如中国等发展中国家和地区，各国政府道路的建设速度永远赶不上机动车增长的速度，因此，交通堵塞、环境污染、交通事故频发等问题随之而来。实质上，现存的交通问题可以看作是人、车与路之间的矛盾，解决这一矛盾的办法有控制交通需求、增加道路基础设施、加强交通管理、实施智能交通系统。


    智能交通系统(Intelligent Transportation System, ITS)，指的是在较完善的基础设施（包括道路、港口、机场和通信）之上将先进的信息技术、数据通信传输技术、电子传感技术、电子控制技术以及计算机处理技术等有效地集成运用于整个交通运输管理体系，从而建立'
  - '[PAGE 165]


    起一种在大范围、全方位发挥作用的实时、准确、高效的综合运输和管理系统。ITS 使得交通系统中三大主体“人、车、路”之间的相互作用关系以新的方式呈现。ITS
    的提出和大力发展能够提高道路使用效率，大幅降低汽车能耗，使交通堵塞减少、短途运输效率提高，现有道路的通行能力提高。经过十几年的推广、试行和发展，ITS 目前已在经济发达国家和经济较为发达国家的一些都市及高速公路系统中实施。实践证明，ITS
    是解决目前经济发展所带来的交通问题的理想方案。ITS 起源于 20 世纪 60 年代，于 1990 年由美国智能交通学会正式提出，并在世界各国大力推广。20
    世纪 80 年代中期以来，ITS 得到了突破性进展，经过十几年的研究与应用，目前国际 ITS 领域已经形成以美国的智能车辆—公路系统、欧洲的“尤里卡”联合研究开发计划和日本的先进的动态交通信息系统为代表的三足鼎立的局面。其他一些如韩国、澳大利亚等国家的
    ITS 研究和发展也已初具规模。


    智能交通系统的规划、建设，归根到底是服务于城市交通发展的总体目标，提高设施系统的使用效率和服务水平。图 7-9 所示为城市交通的主要影响因素及智能交通系统在城市交通供求关系中扮演的角色和作用。由图
