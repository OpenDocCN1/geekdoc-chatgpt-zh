    ## 6 人体行为与智能机器人


    智能机器人之所以叫智能机器人，这是因为它有相当发达的“大脑”。在脑中起作用的是中央处理器，这种计算机跟操作它的人有直接的联系，最主要的是，这样的计算机可以完成按目的安排的动作。


    大多数专家认为智能机器人至少要具备以下三个要素：一是感觉要素，用来认识周围环境状态；二是运动要素，对外界做出反应性动作；三是思考要素，根据感觉要素所得到的信息，思考出采用什么样的动作。感觉要素包括能感知视觉、接近、距离等的非接触型传感器和能感知力、压觉、触觉等的接触型传感器。这些要素实质上就相当于人的眼、鼻、耳等五官，它们的功能可以利用诸如摄像机、图像传感器、超声波传感器、激光器、导电橡胶、压电元件、气动元件、行程开关等机电元器件来实现。对运动要素来说，智能机器人需要有一个无轨道型的移动机构，以适应诸如平地、台阶、墙壁、楼梯、坡道等不同的地理环境。它们的功能可以借助轮子、履带、支脚、吸盘、气垫等移动机构来完成。


    在运动过程中要对移动机构进行实时控制，这种控制不仅要包括位置控制，还要有力度控制、位置与力度混合控制、伸缩率控制等。智能机器人的思考要素是三个要素中的关键，也是人们要赋予机器人必备的要素。思考要素包括判断、逻辑分析、理解等方面的智力活动。这些智力活动实质上是一个信息处理过程，而计算机则是完成这个处理过程的主要手段。智能机器人根据其智能程度的不同，又可分为三种。


    - 1. 传感型。又称外部受控机器人。机器人的本体没有智能单元，只有执行机构和感应机构，它具有利用传感信息（包括视觉、听觉、触觉、接近觉、力觉和红外、超声及激光等）进行传感信息处理、实现控制与操作的能力。它受控于外部计算机，在外部计算机上具有智能处理单元，处理由受控机器人采集的各种信息以及机器人本身的各种姿态和轨迹等信息，然后发出控制指令指挥机器人的动作。目前机器人世界杯的小型组比赛使用的机器人就属于这样的类型。


    - 2. 交互型。机器人通过计算机系统与操作员或程序员进行人—机对话，实现对机器人的控制与操作。虽然具有了部分处理和决策功能，能够独立地实现一些诸如轨迹规划、简单的避障等功能，但是还是要受到外部的控制。


    - 3. 自主型。在设计制作之后，机器人无须人的干预，能够在各种环境下自动完成各项拟人任务。自主型机器人的本体具有感知、处理、决策、执行等模块，可以像一个自主的人一样独立地活动和处理问题。机器人世界杯的中型组比赛中使用的机器人就属于这一类型。全自主移动机器人的最重要的特点在于它的自主性和适应性，自主性是指它可以在一定的环境中，不依赖任何外部控制，完全自主地执行一定的任务。适应性是指它可以实时识别和测量周围的物体，根据环境的变化，调节自身的参数，调整动作策略以及处理紧急情况。交互性也是自主机器人的一个重要特点，机器人可以与人、外部环境以及其他机器人之间进行信息的交流。由于全自主移动机器人涉及诸如驱动器控制、传感器数据融合、图像处理、模式识别、神经网络等许多方面的研究，所以能够综合反映一个国家在制造业和人工智能等方面的水平。因此，许多国家都非常重视全自主移动机器人的研究。


    智能机器人的研究从 20 世纪 60 年代初开始，经过几十年的发展，目前，基于感觉控制的智能机器人（又称第二代机器人）已达到实际应用阶段，基于知识控制的智能机器人（又称自主机器人或下一代机器人）也取得较大进展，已研制出多种样机。


    ## 6.1 人体行为


    行为，是有机体在各种内外部刺激影响下产生的活动。不同心理学分支学科研究的角度有所不同。生理心理学主要从激素和神经的角度研究有机体行为的生理机制；认知心理学主要从信息加工的角度研究有机体行为的心理机制；社会心理学则从人际交互的角度研究有机体行为和群体行为的心理机制。


    要确定行为的概念范畴，首先要确定行动的概念范畴，以便将行为与简单的生理运动动作过程区别开来。行动概念可分为广义的和狭义的两种，若将行动作为行为的一种，则这只是指由行为的一系列随意运动与自动化所组成指向一定目的的行为，这一概念我们可以将之称为行动的狭义性概念。另一方面，如果将行动这个词分为“行”和“动”两部分的话，那么我们就可以得到一个广义的行动概念，这个广义的行动概念可见图
    6-1。


    ![](img/f188b68deb37acb6105ba97c814d9af2_128_0.png)


    图 6-1 行动概念


    根据产生的原因，行为可分为个体行为和群体行为；根据行为的功能，分为摄食行为、躲避行为、性行为和探究行为。而行为就目标与动机在意识中的明确性与能动性程度，又可分为意志行为、潜意识行为和娱乐消遣行为三种。


    意志行为是指人们有明确动机目标的行为，按照个人行为动机与整体长远目标是否统一，又可分为有积极主动机的士气性行为和无积极主动机的非士气性行为。所谓积极主动性就产生过程来讲是指个体动机与行为的整体长远目标的统一程度，它包括个体目标与群体目标的统一程度、战术目标与战略目标的统一程度、短期目标与长远目标的统一程度等。举例如下：父亲是一个冷酷无情的人，嗜酒如命且毒瘾很重，有一次就因为在酒吧里看不顺眼一位酒保而犯下杀人罪，被判终身监禁。他有两个儿子，年龄才相差一岁，其中一个跟他老爸一样有很重的毒瘾，靠偷窃和勒索为生，也因犯了杀人罪而进监狱。另外一个儿子可不一样了，他担任一家大企业的分公司经理，有美满的婚姻，养了三个可爱的孩子，既不喝酒更未吸毒。为什么同出于一个父亲，在完全相同的环境下长大，两个人却会有不同的命运？在一次个别的私下访问中，问起造成他们现况的原因，二人竟然是相同的答案：“有这样的爸爸，我还能有什么办法。”


    在以上例子中的两兄弟同样的环境下有不同的人生结局，显然是因为一个兄弟能把自己的求生欲望与自己远大的人生目标联系起来，而另一个则是得过且过，甚至是自暴自弃。我们有时可能会将一些具有不愉快、消沉性质的情绪认识等心理活动，都归为相应的这些人都具有消极被动的动机，比如战场上士兵因为恐惧丧命而逃跑，生活中因为丧痛失去亲人而茶饭不思等。但实际上，这里所说的动机的积极主动性或消极被动性，不在于人们的认识和情绪等心理活动是否愉快或消沉，而是在于人们的认识和情绪等是否能与整体长远的行动目标相符合。很多看起来消极被动性的心理活动，只要与积极主动的目标联系起来，往往就会有积极主动的性质。例如“保存生命”这在战争中看似只具有消极被动性动机的恐惧情绪，虽然与“逃跑”这种消极被动目标联系起来往往确实对军事行动具有消极被动的作用，但若与“消灭敌人，从而保存自己”这一积极主动的目标联系起来时，则使这一恐惧情绪转而对军事行动具有了积极主动的性质。西汉开国大将韩信的“背水一战”就是利用这一恐惧情绪，从而使汉军“置之死地而后生”的。


    潜意识行为是指人们具有明确目标但无明确动机的行为，即人们老想做但又不知道为什么要这样做的那些行为。潜意识是指人们平常被压抑的或者当时知觉不到的本能欲望和经验。潜意识中的内容由于不被人们的道德价值意识和理智所接受，所以只有通过各种各样伪装的形式表现出来，像梦境就是个人在清醒时不能由意识表达的压抑的欲望和冲动的表现，但做梦不是行为，只是大脑这个身体机体的动作。


    潜意识行为在行为中表现为两个方面：一是口语流露与不经心的笔误等行动；二是神经性症状，即过分强烈的潜意识形成的变异行为，它包括压抑、投射、升华等。


    娱乐消遣行为是指人们有明确动机但却无明确目标的行为，即是指那些总是想去做但却不在乎甚至不知道怎么做以及会做到什么程度的行为。比如一个人具有娱乐休闲动机时，如果他自己觉得看电影、看电视、跳舞等目标都能满足这个动机，那么他对娱乐消遣目标的选择只有随意性，而没有必须性。娱乐消遣行为按照其不同的娱乐消遣性质，可分为寻求美感的欣赏行为和寻求刺激的消遣行为两种。娱乐消遣心态表现为情趣、情调和爱好三个方面统一协调性，例如集邮就是人们对邮票知识内容的情趣，观赏邮票的情调以及对精美邮票的爱好相互统一组成的。


    娱乐消遣行为简单地说也就是所谓“玩”的过程，是一种对自身乃至外界各种事物发展变化进行研习与欣赏的过程。它包括各种非职业性的主动参与的体育竞赛活动、绘画、唱歌以及看电影、看演唱会、看表演、在大自然的漫游等。“玩”对动物生物的学习进化具有积极推动的意义，在动物进化生长过程中动物靠玩乐来锻炼、学习与显示自己，动物在玩乐中不断地试验、发现并进而发掘、发展自己的潜能，辅助实现着动物的成长进化乃至最后的分化。就如猫科动物之所以会分化为猫、狮子、老虎、豹子等，不仅是自然选择的结果，也是各种猫科动物通过自然选择与玩乐感觉到自己能力的成长与局限性，并将这种经验遗传下来的结果。


    所以说，娱乐消遣行为又可以说是人们的一种本能的学习与试验行为。“玩”本身也是消耗精力体力的，但各种动物的娱乐消遣行为就个体感觉上来说反倒具有松弛神经、娱乐休养精神体力的作用，这也就使娱乐消遣反倒又成为动机的来源所在。“玩”由于是生物学习进化需要，所以求奇、求新、求变是其主要的特点。现代人类的学习和体育锻炼，是自古生物进化过程中由人类从娱乐消遣行为中分化出来的特有的东西。自古以来动物通过玩乐达到熟而生巧，这些玩乐就会转化为技能（即所谓大的运动）、甚至是身体机能（即所谓小的运动）的遗传转变。所以，娱乐消遣行为为由远古传下，对动物可说是一种生物性的锻炼和学习的过程，这种锻炼和学习是自然的过程而具有反强迫性的特点。事实证明现代人类无论是对锻炼、学习采取强制加以灌输，或者是对游戏沉溺者采取强制改变措施都是不成功的，原因就在于强制性不符合包括学习在内的“游戏”自主随意规则，除非是给予非强制性的诱导或教育。


    ## 1. 行为类别间的联系


    意志行为、潜意识行为和娱乐消遣行为有时能够相互统一，比如员工乃至学生往往也能将本职工作和学习当作有趣的事情来做。但大多数状况下，意志行为、潜意识行为和娱乐消遣行为互相具有制约牵制的作用，所以个体的意志行为又往往是一个克服潜意识和娱乐消遣意识的过程。例如个体在工作中，如果明确的工作意识是搞好工作，就不得不压抑着受领导批评后想找出气筒的盲目投射潜意识心理和急于去看球赛的娱乐消遣心理。士气性行为的任务就在于除了要抑制非士气性的外在诱惑及其相关欲望动机的产生与影响以外，还要着力于对潜意识心理和娱乐消遣心理的克服。


