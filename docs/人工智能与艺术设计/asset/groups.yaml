    (6) Safety: AI systems should be safe and secure throughout their operational
    lifetime, and verifiably so where applicable and feasible.

    安全性：人工智能系统在它们整个运行过程中应该是安全和可靠的，而且其可应用性和可行性应当接受验证。


    (7) Failure Transparency: If an AI system causes harm, it should be possible to
    a scertain why.

    故障透明性：如果一个人工智能系统造成了损害，那么造成损害的原因要能被确定。


    (8) Judicial Transparency: Any involvement by an autonomous system in judicial
    decision-making should provide a satisfactory explanation auditable by a competent
    human authority.

    司法透明性：任何自动系统参与的司法判决都应提供令人满意的司法解释以被相关领域的专家接受。


    (9) Responsibility: Designers and builders of advanced AI systems are stake holders
    in the moral implications of their use, misuse, and actions, with a responsibility
    and opportunity to shape those implications.

    责任：高级人工智能系统的设计者和建造者，是人工智能使用、误用和行为所产生的道德影响的参与者，有责任和机会去塑造那些道德影响。


    (10) Value Alignment; Highly autonomous AI systems should be designed so that
    their goals and behaviors can be assured to align with human values throughout
    their operation.

    价值归属：高度自主的人工智能系统的设计，应该确保它们的目标和行为在整个运行'
  - '[PAGE 197]


    中与人类的价值观相一致。


    +   (11) Human Values: AI systems should be designed and operated so as to be
    compatible with ideals of human dignity, rights, freedoms, and cultural diversity.

    +   人类价值观：人工智能系统应该被设计和操作，以使其和人类尊严、权力、自由和文化多样性的理想相一致。


    +   (12) Personal Privacy: People should have the right to access, manage and
    control the data they generate, given AI systems'' power to analyze and utilize
    that data.

    +   个人隐私：在给予人工智能系统以分析和使用数据的能力时，人们应该拥有权力去访问、管理和控制他们产生的数据。


    +   (13) Liberty and Privacy: The application of AI to personal data must not
    unreasonably curtail people''s real or perceived liberty.

    +   自由和隐私：人工智能在个人数据上的应用不能允许无理由地剥夺人们真实的或人们能感受到的自由。


    +   (14) Shared Benefit: AI technologies should benefit and empower as many people
    as possible.

    +   分享利益：人工智能科技应该惠及和服务尽可能多的人。


    +   (15) Shared Prosperity: The economic prosperity created by AI should be shared
    broadly, to benefit all of humanity.

    +   共同繁荣：由人工智能创造的经济繁荣应该被广泛地分享，惠及全人类。


    +   (16) Human Control: Humans should choose how and whether to delegate decisions
    to AI systems, to accomplish human-chosen objectives.

    +   人类控制：人类应该来选择如何和决定是否让人工智能系统去完成人类选择的目标。


    +   (17) Non-subversion: The power conferred by control of highly advanced AI
    systems should respect and improve, rather than subvert, the social and civic
    processes on which the health of society depends.

    +   非颠覆：高级人工智能被授予的权力应该尊重和改进健康的社会所依赖的社会和公民秩序，而不是颠覆。


    +   (18) AI Arms Race: An arms race in lethal autonomous weapons should be avoided.

    +   人工智能军备竞赛：致命的自动化武器的装备竞赛应该被避免。


    Longer-term Issues 更长期的问题。


    +   (19) Capability Caution: There being no consensus, we should avoid strong
    assumptions regarding upper limits on future AI capabilities.

    +   能力警惕：我们应该避免关于未来人工智能能力上限的过高假设，但这一点还没有达成共识。


    +   (20) Importance: Advanced AI could represent a profound change in the history
    of life on Earth, and should be planned for and managed with commensurate care
