    # 7.2 智能社会


    # 7.2.1 智能家居


    智能家居是以住宅为平台，将线路综合布控技术、计算机信息技术、自动控制系统相结合，实现家庭设备、设施的统一家庭自动化管理。大多数人对智能家居这个概念的认识始于比尔·盖茨，他在《未来之路》中说“自己的房子是由软件和硅体组成”。突飞猛进的大数据时代使我们普通人也可以拥有比尔·盖茨那样的全智能家居系统。手机
    APP 控制家庭电器，语音调节场景模式，这为我们的生活带来了极大的便捷。家装行业早已认识到了家居智能化的重要性，各种智能产品如雨后春笋般出现在市场上，但在这个过程中，大多数设计者、制造商都把重点放在了“信息智能化”的技术提升上，却忽略了科技带来的负面作用，如安全问题、隐私问题。因此，在改进物联网相关技术的同时，应即刻将安全隐患和隐私泄露问题的对策提上日程。


    # 7.2.1.1 智能家居的发展现状和发展趋势


    世界上第一个智能家居起源于国外的一幢智能建筑，通过计算机对整栋大楼的电视、空调、照明、电梯进行统一控制，使其具有远程控制的功能。在这之后，美国、加拿大、日本等国家相继开始了自己的智能产品的研究开发。如日本提出了家庭总控系统的概念，再如新加坡借鉴比尔·盖茨的家居系统，模拟“未来之家”，推出了新加坡模式的家庭智能化系统。


    智能家居在我国从起步到现在的发展经历了十多年的时间，从 1998 年智能家居概念进入中国到现在，我国的智能产品也由最初单一的、单独控制的设备转向了多功能化，设备之间可以互动的智能设备系统。海尔是我国智能家居的知名品牌，推出了物联网时代的智能居住计划。除此之外还有广州力扑智能家居、阿里巴巴的一站式智能化信息控制系统、美的家居的
    APP 控制家居设备一体化，还有小米、华为、京东等，也都拥有自己的智能家居生产链，我国的智能家居品牌已经逐渐占据中国智能市场。


    # 7.2.1.2 智能家居的设计分析


    +   1. 智能家居的系统架构


    传统家居的各个系统是分别独立的，每个系统都有自己单独的控制器。而家居智能系统将子系统都连接起来，通过智能网络对其进行统一的控制和管理，实现了生活的“一键控制”。智能家居的运行原理，包括数据收集、数据分析、数据执行三个步骤。系统主机通过分析处理前端设备所收集的数据之后将会产生执行的命令，执行元件根据主机发出的命令来进行相关的操作。智能家居系统的子系统包括综合弱电布线系统、空间照明系统、电器控制系统、安全防控系统、音响影音系统。各子系统通过智能终端设备有机联系在一起，既能独立工作，又能相互交流，实现信息交互、协同运行。不仅内部之间能进行信息互换，内部网络也能与外部网络如小区物业等实现信息互通。


    +   2. 方案场景效果


    我们可以将子系统相互结合起来，根据自己的生活需要，设置具有不同参数的场景模式，通过一键控制就可以达到想要的场景效果。'
