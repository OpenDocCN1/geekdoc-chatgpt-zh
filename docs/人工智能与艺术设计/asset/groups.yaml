    - ROM 和计算机软件。许多厂商提供单独的 ERMS 供图书馆用户选择,或做成图书馆管理集成系统中的一个模块。ERM 的一个重要组成部分涉及跟踪每个订阅产品内容的知识库。一个全面的电子期刊馆藏数据库可以提高效率。考虑到主要订阅包中内容的可变性,拥有一个仔细跟踪它们的数据库可以作为一种宝贵的资源,帮助图书馆通过其累积的订阅来准确了解它可以访问哪些标题。创建和维护这样的知识库是一项重大的任务。新一代图书馆管理集成系统比如
