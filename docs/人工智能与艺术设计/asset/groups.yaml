    McCulloch）和数理逻辑学家皮茨（Walter Pitts）在 1943 年提出的神经元模型，简称 M-P 模型。该模型从逻辑功能器件的角度来描述神经元，为神经网络的理论研究开辟了道路。M-P
    模型是对生物神经元信息处理模式的数学简化，后续的神经网络研究工作都是以它为基础的。如图 5-1 是 M-P 神经元模型结构图。从图 5-1 可以看出，神经元的输出：


