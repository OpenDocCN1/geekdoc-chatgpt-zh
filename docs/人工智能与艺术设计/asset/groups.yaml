    引起视觉的外周感受器官是眼，视觉器官由含有感光细胞的视网膜和作为附属结构的折光系统等部分组成。人眼的适宜刺激是波长为 380～780 nm 的电磁波；在这个可见光谱的范围内，人脑通过接受来自视网膜的传入信息，可以分辨出视网膜像的不同亮度和色泽，因而可以看清视野内发光物体与反光物质的轮廓、形状、颜色、大小、远近和表面细节等情况。自然界形形色色的物体以及文字、图形等形象，通过视觉系统在人脑中得到反映。在人脑获得的全部信息中，大约有
    95% 以上来自视觉系统，因而眼无疑是人体最重要的感觉器官之一。


    除了控制眼球运动的眼外肌和起保持、营养作用的巩膜、脉络膜等结构外，眼内与视觉传入信息的产生直接有关的功能结构，是位于眼球正中线上的折光系统和位于眼球后部的视网膜。由角膜经房水、晶状体、玻璃体直至视网膜的前表面，都是一些透明而无血管分布的组织，它们构成了眼内的折光系统，使来自眼外的光线发生折射，最后成像在视网膜上，视网膜具有同神经组织类似的复杂结构，其中包含有对光刺激高度敏感的视杆和视锥细胞，能将外界光刺激所包含的视觉信息转变成为电信号，并在视网膜内进行初步处理，最后以视神经纤维的动作电位的形式传向大脑。因此，形容眼的功能首先要研究眼内折光系统的特性，搞清楚它们怎样能把不同远近的物体成像在视网膜上以及形成清晰物像的限度；其次要阐明视网膜是怎样对视网膜成像进行换能和编码的。


    ### 2.2.2.3 视觉器官的感光系统


    来自外界物体的光线，通过眼内的折光系统在视网膜上形成物像，是视网膜内的感光细胞被刺激的前提条件。视网膜像还有一个物理范畴内的内像，用几何光学的原理可以较容易地对它加以说明，和外界物体通过照相机中的透镜组在底片上形成的物像并无原则上的区别；但视觉系统最后在主观意义上形成的“像”，则是属于意识或心理范畴的主观印象，它由来自视网膜的神经信息最终在大脑皮层等中枢结构内形成。作为生理感受器，重点是视网膜怎样把物理像转换成视神经纤维上的神经信号，以及在这些信号的序列和组合中怎样包括了视网膜像，亦即外界物体所提供的信息内容。应该指出，视觉研究的进展虽然较快，但仍处在初步阶段。


    ## 2.2.3 听觉结构与功能


    ### 2.2.3.1 听觉的定义


    近一个世纪以来，科技迅猛发展，极大地影响了人们的生活。听觉系统是听力感觉的知觉系统。它主要由植物神经和交感神经支配。


    语音和音频信号处理是声信号处理的一个重要分支，其最终结果要用人耳去听。因此，基于听觉的声学现象和原理被深入研究并广泛应用于日常生活中，其中最值得一提的是人耳掩蔽效应。人们现在能够以极低廉的价格进行全球通信，也能以极小的体积和成本享受随身携带的高品质音乐，除了信号处理理论和技术的发展外，还精确地测量了人耳的掩蔽特性，将数字量化噪声尽可能被语音或音乐信号所掩蔽，使语音或音频信号的数码率压缩
    40 倍甚至更多，而人们感觉不出语音或音乐信号有什么畸变。可见人类听觉器官是多么的精细和奇妙，它的听觉生理原理和心理现象完全可以为我们所用并造福人类。


    听觉的生理和心理现象内容较广，包括人耳对语音感知和理解的一些有用的特点，如“掩蔽效应”“声强度和听觉主观响度关系”“双耳效应”“听觉心理学”等。语音信号处理和音频信号处理是两个专门的学科分支，内容很多；人耳和人体的其他器官一样，是一个十分复杂而又精妙的器官，且有别于其他器官，因为人耳的听觉感知还涉及大脑对耳部接收信号的分析、理解等更为深层次的机理；这些研究工作因为需要人体实验，目前报道的研究结果很少。以下仅介绍听觉的声学现象和原理，由此得到的重要成果将作为例子叙述，即着重介绍听觉声学的物理概念和现象，舍去信号处理数学公式等十分复杂的理论和方法。


    ### 2.2.3.2 听觉的结构


    人耳结构及其声学特性声信号从外耳经中耳传入，在内耳基底膜上进行频率分析；图 2-3 是人耳的纵剖面图。


    ### 1. 外耳


    外耳由耳廓和声道(外耳道)组成，耳廓是一个喇叭形的声音收集器，其功能随人类进化而逐步退化，人类的该功能较一些动物而言相对较弱。外耳道终端为鼓膜封闭，形成一个一端开口一端封闭的共鸣器，长约
    1 英寸①；它使 3 000~4 000 Hz 的信号因共鸣而放大 2~4 倍，传入的语音信号的能量在此频段已下降许多，在此因共鸣而得到提升，提高了语音的清晰度。


    ### 2. 中耳


    中耳的功能是放大声信号。在鼓膜和内耳前庭窗(也称卵形窗)之间有锤骨、砧骨和镫骨，三块骨头形成杠杆，将鼓膜上的位移放大 1.5 倍，即将声信号放大了 1.5
    倍；此外鼓膜面积是前庭窗的 25 倍，根据声传输理论，声信号聚焦在前庭窗上，放大了 25 倍；这两个放大作用结合起来，使声压放大 35 倍，声能量放大到 1
    000 倍以上。因此人耳可在安静环境下，捕捉到极为微弱的声信号，有研究认为人耳可以感觉出鼓膜上分子级大小的位移信号，因此人耳能听到一根纤细烛针掉到地上的声音就不足为奇了。中耳的肌肉和骨头联合起来，在有强声信号时，和


    ① 1 英寸=2.54 厘米。


    ![](img/f188b68deb37acb6105ba97c814d9af2_39_0.png)


    图 2-3 听觉器官结构示意图


    镫骨相联的肌肉使镫骨离开卵圆窗，同时改变镫骨的振动方向，将纵向振动改变为横向振动，降低声音传输效率，使传到内耳的声强减弱，起到保护内耳的作用；但对突如其来的强声信号，耳部来不及做好保护准备，就会使耳部受损伤。正常听力的人在最敏感的频段(1
    000～6 000 Hz)从能感知的最小声音信号到不使耳疼痛的最大声音信号能量比达到 10¹²(120 dB)。


    ### 3. 内耳


    内耳是颅骨内一个小而复杂的结构，其主要部分是一个盘成蜗牛壳状的腔体，称为耳蜗。耳蜗的生理机理较为复杂，其主要功能是对接收到的声信号进行频谱分析，在神经纤维上产生电脉冲，传入大脑产生听觉。内耳简化后，可以看作一个卷起的膜片，称为基底膜。基底膜长约
    1.5 cm，靠近前庭窗处最宽，约 0.5 mm，薄而绷紧，其最远端最窄，约 0.04 mm，肥厚而松弛。基底膜上布满了神经纤维，称为毛细胞，一排内毛细胞，约有
    3 500 条，三排外毛细胞，共有约 20 000 条；当不同频率的声音经卵圆窗以行波形式传到基底膜上时，在基底膜的不同位置产生振动，最高频率(约 20 000
    Hz)在基底膜轻薄的顶端产生振动；最低频率(200 Hz)在基底膜肥厚的远端产生振动；振动引起神经纤维(毛细胞)生成电脉冲，传入大脑而使人类感知声音。实验证明，只有振动幅度达到一定程度才有电脉冲产生。


    ### 2.2.3.3 听觉的功能与客观信号之间的关系


    听觉器官是感受声波的装置，借助听觉器官，动物能够获得远距离的信息，借以交往、寻偶、躲避敌害、捕捉猎物，因而对生命活动具有重要意义。耳是人和动物利用声波的作用感知外界事物的感受器官。声波作用于听觉器官，使其感受细胞兴奋并引起听神经的冲动传入信息，经各级听觉中枢分析后便产生听觉。高等脊椎动物的听觉分析极其精细，它能准确地反映声音参数的各种变化。


    - 1. 外耳廓和外耳道的集音作用和共鸣腔作用


    外耳由耳廓和外耳道组成。人耳耳廓的运动能力已经退化，但前方和侧方来的声音可直接进入外耳道，且耳廓的形状有利于声波能量的聚集，引起较强的鼓膜振动；同样的声音如来自耳廓后方，则可被耳廓遮挡，音感较弱。因此，稍稍转动头的位置，根据这时两耳声音强弱的轻微变化，可以判断音源的位置。外耳首先是声波传导的通路，一端开口，一端终止于鼓膜。根据物理学原理，充气的管道可与波长
    4 倍于管长的声波产生最大的共振作用；外耳道长约 2.5 cm，据此计算，它作为一个共鸣腔的最佳共振频率约在 3 500 Hz 附近；这样的声音由外耳道传到鼓膜时，其强度可以增强
    10 倍。


    - 2. 鼓膜和中耳听骨链增压效应


    中耳包括鼓膜、鼓室、听骨链、中耳小肌和咽鼓管等主要结构，利用鼓膜、听骨链和内耳卵圆窗之间的关系，构成声音由外耳传向耳蜗的最有效通路。声波在到达鼓膜处，由空气为振动介质；声波由鼓膜经听骨链到达卵圆窗膜时，振动介质变为固相的生物组织。由于不同介质的声阻挡不同，理论上当振动在这些介质之间传递时，能量衰减极大，估计可达
    99% 或更多。但由于鼓膜到卵圆窗膜之间的传递系统的特殊力学特性，振动经中耳传递时发生了增压效应，补偿了由声阻挡不同造成的能量耗损。


    鼓膜呈椭圆形，面积约 50~90 mm²，厚度约 0.1 mm。它不是一个平面膜，而是呈顶点朝向中耳的漏斗形。其内侧连锤骨柄，后者位于鼓膜的纤维层和黏膜层之间，自前上方向下，终止于鼓膜中心处。鼓膜很像电话机受话器中的振膜，是一个压力承受装置，具有较好的频率响应和较小的失真度，而且它的形状有利于把振动传递给位于漏斗尖顶处的锤骨柄。据观察，当频率在
    2 400 Hz 以下的声波作用于鼓膜时，鼓膜都可以复制外加振动的频率，而且鼓膜的振动与声波振动同始同终，很少残余振动。


    听骨链由锤骨、砧骨及镫骨依次连接而成。锤骨柄附着于鼓膜，镫骨脚板和卵圆窗膜相接，砧骨居中，将锤骨和镫骨连接起来，使三块听小骨形成一个两壁之间呈固定角度的杠杆。锤骨柄为长臂，砧骨长突为短臂。该杠杆系统的特点是支点刚好在整个听骨链的重心上，因而在能量传递过程中惯性最小，效率最高。鼓膜振动时，如锤骨柄内移，则砧骨的长突和镫骨亦和锤骨柄作同方向的内移。中耳增压效应主要有以下两个成因：一是由于鼓膜面积和卵圆窗膜的面积大小有差别，鼓膜振动时，实际发生振动的面积约
    55 mm²，而卵圆窗膜的面积只有 3.2 mm²，如果听骨链传递时总压力不变，作用于卵圆窗膜上的压强将增大 55 ÷ 3.2 = 17 倍；二是听骨链中杠杆长臂和短臂之比约为
    1.3 : 1，即锤骨柄较长，于是短臂一侧的压力将增大为原来的 1.3 倍。这样算来，整个中耳传递过程的增压效应为 17×1.3 = 22 倍。


    与中耳传声功能有关的，还有中耳内的两条小肌肉，其中鼓膜张肌收缩时，可使锤骨柄和鼓膜内向牵引，增加鼓膜紧张度；镫骨肌收缩时，使镫骨脚板向外后方移动。强烈的声响气流经过外耳道，以及角膜和鼻黏膜受到机械刺激时，都可以反射性地引起这两块小肌肉的收缩，其结果是使鼓膜紧张，使各听小骨之间的边界更为紧张，导致听骨链传递振动的幅度减小；阻力加大，总的效果是使中耳的传音效能有所减弱。据认为，这一反应可以阻止较强的振动传到耳蜗，对感音装置起到某种保护作用；但由于声音引起中耳肌的反射性收缩需经过十几个毫秒的潜伏期，故它们对突然发生的短暂爆炸声的保护作用不大。


    ### 3. 咽鼓管的功能


    咽鼓管亦称耳咽管，它连通鼓室和鼻咽部，这就使鼓室内空气和大气相通，因而通过咽鼓管，可以平衡鼓室内空气和大气压之间有可能出现的压力差，这对于维持鼓膜的正常位置、形状和振动性能有重要意义。咽鼓管阻塞时，鼓室气体将被吸收，使鼓室内压力下降，引起鼓膜内陷。暂时的鼓膜内外压力差，常发生的是外耳道内压力首先发生改变而鼓室内压力仍处于原初的状态，如飞机的突然升降、潜水等，此时如果不能通过咽鼓管使鼓室内压力、外耳道压力(或大气压)取得平衡，就会在鼓膜两侧出现巨大的压力差。据观察，这个压力差如达到
    9.33 ~ 10.76 kPa (70 ~ 81 mmHg)，将会引起鼓膜强烈疼痛；压力差超过 24 kPa (180 mmHg)时，可能造成鼓膜破裂。咽鼓管在正常情况下其鼻咽部开口常处于闭合状态，在吞咽、打呵欠或喷嚏时由于腭帆张肌等肌肉的收缩，可使管口暂时开放，有利于气压平衡。


    正常时听觉是由声波经外耳道引起鼓膜的振动，再经听骨链和卵圆窗膜进入耳蜗，这一条声音传递的途径，称为气传导。此外，声波还可以直接引起颅骨的振动，再引起位于颞骨骨质中的耳蜗内淋巴的振动，这称为骨传导。骨传导正常时较气传导不敏感得多，几乎不能感到它的存在；能察知骨传导存在的一种方面是把一个振动音叉的柄直接和颅骨接触，这时人会感到一个稍有异样的声音；当这个声音减弱到听不到以后，再把音叉迅速移到耳廓前方，这时又能听到声音的存在。这个简单实验说明骨传导的存在，也说明正常时气传导较骨传导更为灵敏。可以认为，骨传导在正常听觉的引起中的作用微乎其微。不过临床上常通过检查患者气传导和骨传导受损的情况，判断听觉异常的产生部位和原因。


    人耳感知声强和声频率范围的灵敏度是十分惊人的，人耳感知声音的频率范围是 20 ~ 20 000 Hz。20 Hz 以下为次声波，人耳听不到，次声波对研究地震信号和大气声信号的传播、接收有很大用处；20
    000 Hz 以上为超声，人耳也听不到。在可听的 20 ~ 20 000 Hz 的频率范围内，语音信号所要求的频宽不大，通常 300 ~ 3 400 Hz
    就够了；但语音信号的第四和第五共振峰达 4 000 ~ 5 000 Hz，保留这些共振峰对提高语音的清晰度有好处，也使语音听起来更整齐。听音乐对频宽的要求很高，高保真的
    HiFi 系统要求达到 20 000 Hz，有些音乐发烧友，甚至能感知 20 000 Hz 以上的频率成分。


    音高和频率音高和频率也有类似响度和声强的关系，通常频率高的声音听起来音高要高些，反之音高会低些。然而音高是心理感知的主观量，它和频率的关系是很复杂的。纯音的音高和强度还有关系，特别在低频时，例如，打击一个
    150 Hz 的音叉，并将其逐步靠近耳部，越接近耳部音高越低。复合音强度对音高的影响很微小。


    ## 2.2.4 味觉、嗅觉结构与功能


    ### 2.2.4.1 味觉与嗅觉的定义


    味觉是指食物在人的口腔内对味觉器官化学感受系统的刺激并产生的一种感觉。最基本的味觉有甜、酸、苦、咸四种，我们平常尝到的各种味道，都是这四种味觉混合的结果。舌面的不同部位对这四种基本味觉刺激的感受性是不同的，舌尖对甜、舌边前部对咸、舌边后部对酸、舌根对苦最敏感。


    嗅觉是一种感觉。它由两感觉系统参与，即嗅神经系统和鼻三叉神经系统。嗅觉和味觉会整合和互相作用，嗅觉是外激素通信实现的前提。嗅觉是一种远感，意思是说，它是通过长距离感受化学刺激的感觉。相比之下，味觉是一种近感。


    ### 2.2.4.2 味觉与嗅觉的生理机制


    - 1. 味觉的生理机能


    味觉产生的过程是呈味物质刺激口腔内的味觉感受体，然后通过一个收集和传递信息的神经感觉系统传导到大脑的味觉中枢，最后通过大脑的综合神经中枢系统的分析产生味觉。不同的味觉产生有不同的味觉感受体，味觉感受体与呈味物质之间的作用力也不相同。


    口腔内感受味觉的主要是味蕾，其次是自由神经末梢，婴儿有 10 000 个味蕾，成人几千个，味蕾数量随年龄的增大而减少，对呈味物质的敏感性也降低。味蕾大部分分布在舌头表面的乳状突起中，尤其是舌黏膜皱褶处的乳状突起中最密集。味蕾一般有
    40～150 个味觉细胞构成，大约 10～14 天更换一次。味觉细胞表面有许多味觉感受分子，不同物质能与不同的味觉感受分子结合而呈现不同的味道。人的味觉从呈味物质刺激到感受到滋味仅需
    1.5～4.0 ms，比视觉 13～45 ms、听觉 1.27～21.5 ms、触觉 2.4～8.9 ms 都快。


    舌前 2/3 味觉感受器所接受的刺激，经面神经之鼓索传递；舌后 1/3 的味觉由舌咽神经传递；舌后 1/3 的中部和软腭、咽和会厌味觉感受器所接受的刺激由迷走神经传递。味觉经面神经、舌神经和迷走神经的轴突进入脑干后终到孤束核，更换神经元，再经丘脑到达岛盖部的味觉区。


    - 2. 嗅觉的生理机能


    嗅觉感受器位于鼻腔顶部，叫作嗅黏膜，这里的嗅细胞受到某些挥发性物质的刺激就会产生神经冲动，冲动沿嗅神经传入大脑皮层而引起嗅觉。它们所处的位置不是呼吸气体流通的通路，而是被鼻甲的隆起掩护着。带有气味的空气只能以回旋式的气流接触到嗅感受器，所以慢性鼻炎引起的鼻甲肥厚常会影响气流接触嗅感受器，造成嗅觉功能障碍。


    嗅觉是由物体发散于空气中的物质微粒作用于鼻腔上的感受细胞而引起的。在鼻腔上鼻道内有嗅上皮，嗅上皮中的嗅细胞，是嗅觉器官的外周感受器。嗅细胞的黏膜表面带有纤毛，可以同有气味的物质相接触。每种嗅细胞的内端延续成为神经纤维，嗅分析器皮层部分位于额叶区。嗅觉的刺激物必须是气体物质，只有挥发性有味物质的分子，才能成为嗅觉细胞的刺激物。人类嗅觉的敏感度是很大的，通常用嗅觉阈来测定。所谓嗅觉阈就是能够引起嗅觉的有气味物质的最小浓度。用人造麝香的气味测定人的嗅觉阈时，在
    1 L 空气中含有 5×10⁻¹⁰ mg 的麝香便可以嗅到；采用硫醇时，1 L 空气中含 4×10⁻¹⁰ mg 这样的微量，人们就可以嗅到。


    ### 2.2.4.3 味觉与嗅觉的生理功能


    - 1. 味觉的生理功能


    味觉系统是一个神经丰富的味觉交叉网，味蕾所感受到的味觉可分为甜、酸、苦、咸四

