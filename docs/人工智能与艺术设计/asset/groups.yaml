    识别系统进行学习；(3) 多人的识别系统，通常能识别一组人的语音，或者成为特定组语音识别系统，该系统仅要求对要识别的那组人的语音进行训练。


    如果从说话的方式考虑，也可以将识别系统分为三类：（1）孤立词语音识别系统，孤立词识别系统要求输入人每个词后要停顿；（2）连接词语音识别系统，连接词输入系统要求对每个词都清楚发音，一些连音现象开始出现；（3）连续语音识别系统，连续语音输入人是自然流利的连续语音输入，大量连音和变音会出现。


    如果从识别系统的词汇量大小考虑，也可以将识别系统分为三类：（1）小词汇量语音识别系统，通常包括几十个词的语音识别系统；（2）中等词汇量的语音识别系统，通常包括几百到上千个词的识别系统；（3）大词汇量语音识别系统，通常包括几千到几万个词的语音识别系统。


    随着计算机与数字信号处理器运算能力以及识别系统精度的提高，识别系统根据词汇量大小进行的分类也在不断变化。目前是中等词汇量的识别系统，将来可能就是小词汇量的语音识别系统。这些不同的限制也确定了语音识别系统的困难度。语音识别原理见图
