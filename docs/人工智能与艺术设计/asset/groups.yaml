    展望一下未来，我们正好身处人工智能的起步阶段。在这个阶段来讲，可能还没有多少人工智能能够真正有意义地形成，我们在路上，还没有真正开始。30 年后的今天，人们会说：“天啊，我希望我有能力参与其中。”1958
