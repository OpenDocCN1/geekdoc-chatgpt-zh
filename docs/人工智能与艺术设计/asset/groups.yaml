    界提出了两个重要的思想和主张：(1) 综合集成；(2) 智能体。


    综合集成这个概念先后在不同的技术领域出现并使用过，但含义不尽相同。今天人工智能所提出的综合集成概念，则有更深、更广的意义。戴汝为教授等对综合集成已进行了很全面的论述，具体地把综合集成的研究方法分为三类：（1）研究能集成不同学科的方法；（2）人机集成方法；（3）创造新的表达、推理和学习方法；这很有指导意义。近年来，对于前两种集成，国际上的讨论已经多起来，虽然各自的主张和理解不完全相同，但大家的共识是，综合集成是一个很关键的问题。中国学者对于人机集成这方面的讨论更多也更深入，并具体划分了几个不同的层次，如机帮人、人帮机、人机协作等。事实上，在国外，20
    世纪 80 年代初，人们一度热心于全自主机器的研制，如美国卡内基梅隆大学（CMU）的 ALV 计划，其目标是要实现一个越野的自主车。不过，之后人们发现这是一项极难的研究任务，短期内很难完成。近年来，CMU
    推出一项极为成功的实验，这就是一辆他们研制的视觉导引小汽车，实现了从美国匹兹堡（校园所在地）到洛杉矶高速公路上的“自动”驾驶实验。它成功地横穿全美国，日夜兼程，风雨无阻，行程
    2 849 英里①。这项实验得到了大汽车公司的赞助，并在美国报纸上详细报道，广为宣传，说明大家对此十分感兴趣。这里，我们需要分析该实验是在什么条件下完成的。首先，高速公路是一个半结构化的环境，条件要比越野简单，易于实现；更重要的一点是它并不是完全自动驾驶，车上仍有人监视，紧急情况下，可给予干预。实验的结果是，自动驾驶占里程的
    98.2%，人工干预只占里程的 1.8%，这当然很成功。不过，这个 1.8% 很重要，说明关键时刻，还需要人的帮助，这是典型的“人帮机”模式。说明目前高速公路上的自动驾驶“人帮机”模式可以在实验条件下实现。如果实际应用，据说只能采取“机帮人”的模式，即主要靠人驾驶，机器只作为人的帮手，在驾驶员疲劳或注意力不集中时，提出警告，帮人一把。汽车公司感兴趣的正是这种模式，即提供一种汽车自动报警系统实现“机帮人”。如何创造一种新的表示和推理方法，实现不精确处理与精确处理的综合集成，是人工智能的关键问题之一。首先，分析一下人类为什么善于把精确处理与不精确处理结合起来，从而能方便地解决复杂的困难问题；相反，求解同一问题，对机器来讲，却往往十分困难。原因之一是，人类善于从不同层次（不同分辨率）上观察同一问题，并能在不同分辨率的空间上进行推理、分析，并自如地往返于不同表示空间之间。相反，机器通常只能在单一分辨率（粒度）空间上求解问题，因此计算复杂性高、困难大。比如，一座城市，我们可以从很高的分辨率（细粒度）上去观察它，于是我们看到许多细节，如道路、建筑物、车辆等。于是可以说，我们对该城市有了精确的定量知识，如哪一条道路有多长、多宽等。如果观察手段有限，信息不完全，我们只能从很低的分辨率（粗粒度）上去观察它，得到一些不精确的定性知识，比如只知道从甲地到乙地有道路相通，但并不知道道路具体有多长、有多宽、在哪里拐弯等。如果我们的任务是选择一条道路从甲地旅行到乙地，当我们同时具备精确（定量）与不精确（定性）知识时，我们可以采取从定性到定量的综合处理办法，即先从定性不精确知识中，粗略看一下，甲地到乙地究竟有没有道路，有几条，道路的大体走向如何等，并从中选择出一条


    ① 1 英里≈1,609 千米。'
  - '[PAGE 19]


    来。然后再根据精确的定量知识，最后确定如何从甲地旅行到乙地。然而，机器处理问题的办法完全不同，它只能在精确的城市地图上一步步地搜索，考虑所有的细节。如果发现哪一条道路走不通，则需要另选一条重新开始，这就是机器解决问题效率不高的原因，因为它只能在单一精确的（细粒度）层次上解决问题。为使机器具备从定性到定量的综合处理能力，需要找出一种能做不同分辨率表示的方法。近十年来，我们研究了一种问题分层求解的商空间理论，它通过代数中的商空间理论，来表示不同层次的知识，并使不同分辨率表示之间的转换十分简单。理论分析表明，运用这种方法后，机器求解问题的效率会大大地提高。以上述的路径规划为例，城市的精确表示可以采用一般的几何方法（地图），对于不精确的定性表示，可采用拓扑的方法（如特征网），它只要表示哪些地区是连通的，即是否有路可通。于是我们的规划可分为两层：先是在拓扑空间中进行定性的规划，找出一条大致的通路。然后是几何空间中的定量规划，具体地找出一条几何通路。显然，采取这种多分辨率的求解方法，搜索工作量要降低很多。当然，其关键是要找到这两种表示的联系，正如我们所知，拓扑学中的同伦等价变换，可以把定性的拓扑空间与定量的几何空间联系起来。有了这种办法，精确与不精确处理的综合集成就有了可能。


    1977 年，在人工智能研究中，当 MIT 的 delKeer 提出定性建模与定性分析的概念时，许多人对此表示出极大的兴趣，人们希望机器具有这种能力。delKeer
    采用的例子是实数空间，他把该空间做了最粗略的划分，分为（-，0，+）三个区域，他又把算术运算（加、减、乘、除）引到这三个量的运算中，得到一个最简单的定性处理模型。他利用这种模型去分析电子电路中的电压、电流变化，得出一些有意义的定性结果，引起人们对定性处理的广泛兴趣。由于定性知识信息量很少，单纯依靠定性处理，推理过程中会产生大量信息衰减现象，一般很难获得有意义的结果。1988
    年，S. S. Murt 做出了补充，提出了多分辨率定性推理的概念，使单纯定性推理摆脱了困境。他的基本思路是，所谓定性、定量对实数轴来讲只是代表了不同分辨率的划分，把实轴粗划分为三个区（-，0，+），我们得到的是定性描述，划分得细一点，就是定量。通过这种关系，我们可以把定性和定量分析结合起来。当信息不完全，知识有限时，我们只做定性处理，有了进一步的信息，则进入更细的空间做处理，相互补充，定性与定量结合，就可获得更好的结果。因此多分辨率表示和处理方法，是解决综合集成的一个重要方法。


    关于认知、模型与计算等之间的综合集成，我们称之为纵向学科集成。而人工智能、计算机与自动化等学科之间的集成，我们称为横向学科（信息科学内部）集成，两者统称为多学科（Multi-Discipline）集成。怎样才能实现学科之间的综合集成？各个学科有自己的研究重点，有自己的理论、概念和方法。如上所述，传统人工智能注重的是搜索，自动控制论侧重的是反馈，如何实现搜索与反馈技术之间的综合集成？这里关键的一步是，先要实现学科之间的交叉与渗透，反馈理论渗透到人工智能中去，引起传统
    AI 的变化，AI 的基本理论：搜索、规划、推理和学习等发生了变化。它们再也不能只是在完全信息假设下进行研究和发展了，而要考虑不完全信息，考虑资源限制，考虑具有信息反馈的动态环境。于是传统
    AI 被改造了。同样，AI 方法也向控制理论渗透，符号处理被引入传统控制理论，“反馈”受到规划和搜'
  - '[PAGE 20]


    索的引导，因此传统控制理论发展成为新的智能控制理论。在这种条件下,我们就有可能创立一种新的综合集成的方法。


    # 1.3.2.3 复杂智能系统


    复杂智能系统应由什么样的部件组成？我们知道，一般的智能系统，如专家系统，是由各个功能模块组成的，如推理模块、知识库模块和解释模块等。复杂智能系统是不是具有相同的结构，由各功能模块组成，还是只要数量更多、功能更复杂就行了？近年来，人工智能研究表明，要解决智能系统的规模扩大问题，单元模块的概念必须彻底更新，要从模块推广延伸为智能体，模块是被动的构造单元，它的功能是不变的，设计人员在设计过程中，系统或用户在运行过程中，可以根据需要随时调用所需的模块，达到复用的目的。模块化的概念在系统设计和运行中起到重要作用，它简化了系统的设计，提高了系统的性能。发展到复杂智能系统，被动的功能模块已经不够用了。比如，计算机互联网到
    1994 年 5 月为止，已经联结 31 000 个子网，200 万台计算机，超过 2 000 万人在上面工作。此外，每 10 分钟有一个新网联进来，信息每时每刻都在变化，为了有效地使用这种网络，通过用户或系统调用有关模块的工作方式已经不适用了，人们正在把智能体的概念引进来，使每个信息模块成为智能体，各自具有自主性、适应性和智能水平，能够根据用户的要求，主动提供优质的服务。整个网络成为一个多智能体的智能分布系统。最近智能体的概念备受重视，被各个领域反复使用，于是出现了像软件智能体（Software
    Agent）、自治智能体（Autonomous Agent），以及 Softbot(Software Robot) 等。因此我们不难理解为什么把社群（Society）和研讨会（Workshop）等作为智能系统可供选择的体系结构。


    # 1.3.2.4 人工智能与控制论


    人工智能在它的发展初期和控制论有密切的关系，人们在提起 AI 的发展史时，通常并没有忘记控制论的贡献。可是到 20 世纪七八十年代，当符号推理机制在 AI
    中占主导地位后，启发式编程变成人工智能的同义语，计算机专家成为 AI 研究的主力，人们几乎把控制论忘了。近年来，人工智能走向了现场，又一次向控制论靠拢，于是控制界掀起一股智能化的热潮。建立智能控制这一新学科的任务在世界范围内酝酿着，但是应该怎样建立这样一个新学科？对控制界来讲，多数人并没有仔细考虑过，目前人们只是急于把各个新领域，如人工智能、神经网络、模糊逻辑中的新工具移植过来，以解决传统控制所遇到的困难。但人们开始认识到这种做法已经不够了，最近美、俄两国的控制论专家坐在一起共同探讨如何建立智能控制问题。他们回顾了人类科学史上三次科学思想方法的大转变：（1）最早的科学思想方法是亚里士多德建立的，他们崇尚知识，而科学的建立和发展需要依靠知识的扩充；（2）工业革命后，牛顿法古统治地位，人们追求简单的数学定律，也就是人们通常所谓的还原主义；（3）进入信息时代，概率统计起了主导作用。今天，当人们进入复杂的信息处理时代时，必须实现第四次科学思想方法上的转变。那么智能控制应采用什么方法呢？他们认为那将是一个多分辨率的知识表示时代，这个时代应该以符号学为特征。这种主张有一定道理，K.
    Godel 说过：“没有一个在特定分辨率层次上形成的知识系统，能够完全解释那个层次，必须具有一个高层元知识才能完全解释它。然而，当我们着手去构造这个更一般的元知'
