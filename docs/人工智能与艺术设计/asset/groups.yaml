    # 2.3 人类对高级智慧的理解


    # 2.3.1 语言的定义与形成


    就定义而言，语言是生物同类之间由于沟通需要而制定的具有统一编码和解码的标准的声音（图像）指令。实质定义语言是以声音/符号为物质外壳，以含义为内涵，由词汇和语法构成并能表达人类思想的指令系统。语音、手势、表情是语言在人类肢体上的体现，文字符号是语言的显像符号。


    语言就广义而言，是采用一套具有共同处理规则来进行表达的沟通指令，指令会以视觉、声音或者触觉的方式来传递。严格来说，语言是指人类沟通所使用的指令。所有人都是通过学习获得语言能力，语言的目的是交流观念、意见、思想等。语言学就是从人类研究语言分类与规则而发展出来的，研究语言的专家被称为语言学家。当人类发现与某些动物能够以某种方式沟通，就诞生了动物语言的概念。到了电脑的诞生，人类需要给予电脑指令。这种“单向沟通”就成了电脑语言。语言的表达方式是指人们使用语言的形式，人们使用语言的方式主要有两种，人的肢体行为和符号。人的肢体行为是人们使用语言的主要形式，口述声音、手势及表情就是人的肢体行为体现。口语是人类使用行为为进行语言交流的最主要方式。符号的应用主要表现为文字，文字是现代人类语言最大的应用类。


    语言起源理论可以划分为两种假说：连续性和非连续性假说。所谓连续性假说的基本思想认为，语言不可能在突然之间形成，而是有一个过程，一定是由人类的灵长类的祖先早期的前语言系统演变而来的。非连续性的假说则认为，语言有一些独一无二的特征是在人类演化过程的某个时间段中突然出现的，跟人类基因的演化和突变也是有关的。过去对连续演化研究得比较多，也有很多的假设。现在还在继续研究的人当中，有的认为人类祖先由姿势产生了跟语言有关的符号系统，有声的语言也随着人类的进化慢慢产生出来。也有人认为，语言是模仿自然界的声音，或者是一种感叹。“几十年前我还小的时候，受的教育是说，人是劳动创造的”——这是恩格斯的话，人是能够制造工具的动物，语言也是由劳动创造的。比如，我们的祖先在协同劳动时需要交流，由比画产生了有声的语言。但因为直接的证据很少，对语言的起源要做实证研究是比较困难的。近十年以来，随着科学的进步，就可以'
  - '[PAGE 46]


    用新的方法进行研究了。比如，可以由化石来看人类的解剖学特征，观察人类是如何演进的，也可以用计算机来模拟这个过程。也有的学者比较强调语言的社会性、人的社会文化认知对语言起源的影响。


    认为语言产生是非连续性的代表人物之一就是乔姆斯基。大家知道，乔姆斯基是一个很有影响力的语言学家，他也很关心政治，是著名的左翼政论家。可以说，对当代的语言学以及相关领域来说，乔姆斯基的影响力是最大的。当然，也有不少人不同意他的意见，但不能不承认他的影响。笔者并不完全赞同他的观点，但他的观点有一些还是有道理的，应该重视。比如，他强调只有人类才有语言，其他任何动物都不可能具有语言能力，语言能力是人独有的。20
    世纪 60～70 年代国外有些人做过很多实验，比方说，他们试图教猿猴说话，但猿猴没办法发出人的声音，不止一个中心尝试过教猿猴辨认代表某个概念的词语，但都没有取得成功。这也说明动物不可能拥有人类这样的语言能力。


    自 20 世纪 90 年代，越来越多的语言学家、考古学家、心理学家、生物学家、人类学家等都开始尝试应用各种新方法来探究语言演化这一世界最难的学术问题。遗憾的是，由于人类语言历史悠久，语言本身具有复杂性以及缺少有力的科学证据支持，近
    20 年来，人们对语言演化方面的探究进展不大，至今还没有令人信服的解说。


    中国知名学者周海中曾经指出，解决语言演化问题的难度不亚于破解物种演化之谜的难度。语言演化既是一种社会现象，又是一种自然现象，还是人类心智发展和历史文化演变的结果。由于语言的起源与变化有其内在的原因和外界的影响，从而增加了语言演化问题的复杂性。


    # 2.3.2 思维的形式与逻辑


    # 2.3.2.1 思维的形式


    思维形式，思维达成实现的形式。概念、判断、推理、证明是不同的思维形式。具有不同结构的判断形式、推理形式、证明形式也是不同的思维形式。在具体思维中，思维形式和思维内容总是结合在一起的，既不存在没有思维形式的思维内容，也不存在没有思维内容的思维形式。但是思维形式相对于思维内容具有独立性，所以逻辑学可以单独把思维形式作为研究对象。


    形象思维、逻辑思维、灵感思维是三种普遍的思维形式。具体人的思维，不可能限于哪一种形式。解决一个问题，做一项工作或某个思维过程，至少是两种思维形式并用。两种思维形式一般指抽象思维和形象思维。


    思维的逻辑就是思维的规律和规则。狭义上逻辑既指思维的规律，也指研究思维规律的学科（逻辑学）。广义上逻辑泛指规律，包括思维规律和客观规律。逻辑包括形式逻辑与辩证逻辑，形式逻辑包括归纳逻辑与演绎逻辑，辩证逻辑包括矛盾逻辑与对称逻辑。对称逻辑是人的整体思维（包括抽象思维与具象思维）的逻辑。


    # 2.3.2.2 形象思维与逻辑


    所谓的形象思维，主要是指人们在认识世界的过程中，对事物表象进行取舍时形成的，'
  - '[PAGE 47]


    只用直观形象的表象解决问题的思维方法。形象思维是在对形象信息传递的客观形象体系进行感受、储存的基础上，结合主观的认识和情感进行识别（包括审美判断和科学判断等），并用一定的形式、手段和工具（包括文学语言、绘画线条色彩、音响节奏旋律及操作工具等），创造和描述形象（包括艺术形象和科学形象）的一种基本的思维形式。


    从文学艺术创作角度分析，所谓形象思维，也就是艺术家在创作过程中始终伴随着形象、情感以及联想和想象，通过事物的个别特征去把握一般规律从而创作出艺术美的思维方式。形象思维能力的大小往往决定一个人的审美水平。形象思维始终伴随着形象，是通过“象”来构成思维流程的，就是所谓的神与物游。形象思维始终伴随着情感，形象思维离不开想象和联想。文学艺术创作过程中主要的思维方式，借助于形象反映生活，运用典型化和想象的方法，塑造艺术形象，表达作者的思想感情，也叫艺术思维。


    形象思维是反映和认识世界的重要思维形式，是培养人、教育人的有力工具。在科学研究中，科学家除了使用抽象思维以外，也经常使用形象思维。在企业经营中，高度发达的形象思维，是企业家在激烈而又复杂的市场竞争中取胜不可缺少的重要条件。高层管理者离开了形象信息，离开了形象思维，他所得到的信息就可能只是间接的、过时的甚至不确切的，因此也就难以做出正确的决策。形象思维与逻辑思维（理论思维）是两种基本的思维形态，理论思维指以科学的原理、概念为基础来解决问题的思维活动。例如，用“水是生命之源”的理论来解释干旱对世界万物的影响。过去人们曾把它们划归为不同的类别，认为“科学家用概念来思考，而艺术家则用形象来思考。”这其实是一种误解，形象思维并不仅仅局属于艺术家，它也是科学家进行科学发现和创造的一种重要的思维形式。例如，物理学中所有的形象模型，像电力线、磁力线、原子结构的汤姆森模型或卢瑟福小太阳系模型，都是物理学家抽象思维和形象思维结合的产物。


    爱因斯坦是一个具有极其深刻的逻辑思维能力的大师，但他却反对把逻辑方法视为唯一的科学方法，他十分善于发挥形象思维的自由创造力，他所构思的种种理想化实验就是运用形象思维的典型范例。这些理想化实验并不是对具体的事例运用抽象化的方法，舍弃现象，抽取本质，而是运用形象思维的方法，将表现一般、本质的现象加以保留，并使之得到集中和强化。爱因斯坦著名的广义相对论的创立实际上就是起源于一个自由的想象。


    # 2.3.2.3 抽象思维与逻辑


    抽象思维凭借科学的抽象概念对事物的本质和客观世界发展的深远过程进行反映，使人们通过认识活动获得远远超出靠感觉器官直接感知的知识。科学的抽象是在概念中反映自然界或社会物质过程的内在本质的思想，它是在对事物的本质属性进行分析、综合、比较的基础上，抽取出事物的本质属性，撇开其非本质属性，使认识从感性的具体深入抽象的规定，形成概念。空洞的、臆造的、不可捉摸的抽象是不科学的抽象。科学的、合乎逻辑的抽象思维是在社会实践的基础上形成的。抽象思维作为一种重要的思维形式，具有概括性、间接性、超然性的特点，是在分析事物时抽取事物最本质的特性而形成概念，并运用概念进行推理、判断的思维活动。


    抽象思维深刻地反映着外部世界，使人能在认识客观规律的基础上科学地预见事物和'
  - '[PAGE 48]


    现象的发展趋势。预言“生动的直观”没有直接提供出来的，但存在于意识之外的自然现象及其特征。这对科学研究具有重要意义。


    抽象思维方法本身随着人类文明的进化也在不断演化。从大类看，抽象思维方法分为抽象思维的形而上学方法和抽象思维的辩证方法。抽象思维的这两种具体形式不像有些人认为的那样，是对立的和没有共同基础的。实际上，抽象思维的辩证方法是建立在抽象思维的形而上学方法之上的，在运用分析、综合、归纳、演绎方法来形成概念并确定概念与概念之间演绎的关系、概念外延的数量属性关系这些内容上，抽象思维的辩证方法和抽象思维的形而上学方法完全一样，只是面对发展和变化着的世界，为了提高思维的精确度从而减少思维对现实的偏差，抽象思维的辩证方法才增加了对概念内涵的数量属性关系的考察。可以说，抽象思维的辩证方法是对抽象思维的形而上学方法的补充和提高。


    抽象思维方法在形而上学的初期阶段只知道用概念代表现实事物，用不同的概念去代表不同的现实事物以及用概念和概念之间的演绎关系去代表现实事物之间的实际联系。至于这种方法偏离现实世界的实际状况的程度则未见研究。概念所概括的那些事物，从静态看，其本身就不完全相同而是存在着差异的；从动态看，这些事物都在发生着变化，有些变化大一些有些变化小一些。抽象思维方法在形而上学的阶段只有当事物之间的差别足够大时，或者事物的变化足够大时，才会用“不同的概念代表不同的事物，新的概念代表新的事物”这一唯一的方法去解决这个难题。至于事物之间还没有足够大的差异和事物之间还没有足够大的变化时，抽象思维方法在形而上学的阶段完全无能为力，只能一概忽略不计。当抽象思维方法到了辩证法的阶段时，面对事物间的差异性和事物的变化性，不仅会在差异巨大时或变化巨大时用不同的概念去代表不同的事物（像抽象思维方法在形而上学的阶段所做的那样），而且会在事物间的差异或事物的变化还没有足够大时，用概念内涵的数量属性去描述这些差异和变化，并用概念内涵的数量属性作为对概念本身的补充和修正，从而在一定程度上减少抽象思维方法用概念代表现实事物和用概念间的关系代表现实事物之间的实际联系所引起的误差和偏离。


    # 2.3.2.4 灵感思维与逻辑


    灵感思维是指人们在科学研究、科学创造、产品开发或问题解决过程中突然涌现、瞬息即逝，使问题得到解决的思维过程。灵感思维有偶然性、突发性、创造性等特点。灵感是新东西，即过去从未有过的新思想、新念头、新主意、新答案。灵感思维是三维的，它产生于大脑对接收到的信息的再加工，储存在大脑中沉睡的潜意识被激发时产生，即凭直觉领悟事物的本质。


    灵感思维也称作顿悟。它是人们借助直觉启示猝然进发的一种领悟或理解的思维形式。诗人、文学家的“神来之笔”，军事指挥家的“出奇制胜”，思想战略家的“豁然开朗”，科学家和发明家的“茅塞顿开”等，都说明了灵感的这一特点。它是在长时间的思索，问题仍没有得到解决的情况下，突然受到某一事物的启发，使问题一下子解决的思维方法。“十月怀胎，一朝分娩”，就是这种方法的形象化的描写。灵感来自信息的诱导、经验的积累、联想的升华、事业心的催化。'
  - '[PAGE 49]


    灵感思维是人们在文艺创作、科学研究中因创造力突然达到超水平发挥的一种特定心理状态。钱学森说：“如果把非逻辑思维视为形象思维，那么灵感思维就是顿悟，实际上是形象思维的特例。灵感的出现常常带给人们渴求已久的智慧之光。”例如，德国化学家凯库勒长期从事苯分子结构的研究，一天由于梦见蛇咬住了自己的尾巴形成环形而突发灵感，得出苯的六角形结构式。因此，灵感不是唯心的、神秘的东西，它是客观存在的，是思维的特殊形式，是一种使问题一下子澄清的顿悟。科学史上许多重大难题往往就是靠这种灵感的顿悟，奇迹般得到解决的。所谓“众里寻他千百度，蓦然回首，那人却在灯火阑珊处”就是这样一种意境。


    # 2.3.3 艺术、哲学等意识的理解


    # 2.3.3.1 艺术


    艺术可以是宏观概念也可以是个体现象，是通过捕捉与挖掘、感受与分析、整合与运用（形体的组合过程、生物的生命过程、故事的发展过程）通过感受（看、听、嗅、触碰）得到的形式展示出来的阶段性结果。表达形式有语言、声音、文字、绘画、眼神、呼吸、肢体等。艺术的基本特征有以下几点。


    +   1. 形象把握与理性把握的统一


    形象，即审美形象。在广义上包含审美的情境和意境，主要是指艺术活动中能引起人的思想或情感活动的生动、具体、可感的人物和事物形象。形象是艺术活动特有的存在方式，艺术作品作为人的精神生产的产品，依存于一定的物质载体，它必须是直观的、具体的，能为人的感官直接感知的感性存在。形象是构成艺术作品的基本要素，所以每个艺术形象都必须以个别具体的感性形式出现，把生活中的人、事、景、物的外部形态和内在特征真实地表现出来，有血有肉、有声有色，使人产生一种活灵活现的真实感。艺术形象又是艺术家认识体验生活的结果，是艺术家审美意识的结晶，因此艺术形象又具有艺术家审视、体验生活时把握到的鲜活性和具体性，通过人的视觉、听觉等感官能够感受、把握到艺术形象的色彩、线条、声音、动作，给人以闻其声、见其人、临其境的审美感受。


    艺术形象贯穿于艺术活动的全过程。艺术家在创造的过程中始终离不开具体的形象。正如郑板桥画竹子，他观察、体验竹子的形象始于“园中之竹”“眼中之竹”，艺术构思孕育了“胸中之竹”，而磨砺展纸完成了“手中之竹”，可见竹子的形象自始至终伴随了竹画的全过程。艺术家不仅在创作过程中从不脱离生动具体的形象，其创造的成果艺术品，更须展现具体可感的艺术形象，并以其强烈的艺术感染力去打动每一个欣赏者。因此，艺术欣赏的过程也要通过对艺术形象的感情来引发对作品中情境、意境的体味。这足以说明形象贯穿了艺术活动的每个环节，形象性成为艺术区别于其他社会意识形态的最基本的特征，也是艺术反映社会生活的特殊形式，是创作主体对于客体对象瞬间顿悟式的审美创造。它是感性的，不是推理的，是体验的，而不是分析的。


    同时，艺术形象的创造又不能离开理性，艺术中的形象是有意味的形象，是渗透了艺术家深刻理性思考的形象。它不是客观生活图景的随意照搬，而是艺术家经过选择、加工并融'
  md: "\n种。在中枢神经内，把感觉综合起来，特别是有嗅觉参与，就能产生多种多样的复合感觉，如涩、辣等都是由这四种味觉融合而成的。人吃东西时，通过咀嚼和舌、唾液的搅拌，味蕾受到不同味道物质的刺激，将信息由味神经传送到大脑味觉中枢，便产生味觉，品尝出饭菜的滋味，使我们得以体验到中外名菜的千百种味道。不同的味觉对人的生命活动起着信号的作用：甜味是需要补充热量的信号；酸味是新陈代谢加速和食物变质的信号；咸味是帮助保持体液平衡的信号；苦味是保护人体不受有害物质危害的信号；而鲜味则是蛋白质来源的信号。\n\
    \n## 2. 嗅觉的生理功能\n\n嗅觉是一种感觉。它由两个感觉系统参与，即嗅神经系统和鼻三叉神经系统。嗅觉和味觉会整合和互相作用。嗅觉是外激素通信实现的前提。嗅觉是一种远感，即是说它是通过长距离感受化学刺激的感觉。相比之下，味觉是一种近感觉。\n\
    \n最近一系列的研究发现，人类也有异常灵敏的嗅觉，并且在不知不觉中对我们的生活产生很大的影响。细微的气味能在不为我们察觉的情况下影响心情、行为以及决定。自己身上散发出的气味则能表现自己恐惧或悲伤等的情绪。问题是为何我们对嗅觉的作用毫无察觉呢？相比于看起来似乎更加重要的视觉和听觉，嗅觉从来就不是人类感觉研究的首选对象，直到最近，嗅觉才获得足够的重视。纽约州立大学石溪分校从事神经生物学研究的帕罗迪(Lilianne\
    \ Mujica-Parodi)表示，长久以来，人们有个很大的误区，即认为相比于其他哺乳类动物，嗅觉对人类的影响并不显著。这个误区始于19世纪一位重要的解剖学家布罗卡(Pierre\
    \ Paul Broca)。他通过比较不同动物大脑中控制嗅觉的部分占整个大脑的比例，将哺乳类动物分为两类：一类是嗅觉发达型，例如狗，它们能通过灵敏的嗅觉感知外部世界；第二类是嗅觉不发达型，例如人类、其他灵长类动物及海生哺乳动物，这些动物的嗅觉组织在大小和功能上都相形见绌。最近的遗传学研究似乎也证实了布罗卡的观点，研究发现，大多数哺乳类动物的基因中存在能产生1000多种不同气味感受器的编码。其中大多数编码在人类的基因中并不存在。人类的基因只能编码产生400多种气味感受器。\n\
    \n但更多的研究发现人们之前可能存在误解。最近科学家们通过大脑扫描发现，人类大脑中感知嗅觉的部分实际上多于布罗卡在100多年前通过解剖得出的区域。耶鲁大学的格里尔(Charles\
    \ Greer)表示，尽管人类的气味感受器数量上比其他的哺乳类要少，但人的鼻子和大脑之间的联系却异常活跃。和其他哺乳类动物相比，人类的每组气味感受器连接的神经更多，就是说，我们的气味处理能力更加强大。\n\
    \n随着更多研究的深入，科学家们发现人类的鼻子远比我们想象中的灵敏。一项实验表明，某些化学试剂即使在水中被稀释了10亿倍，依然可以被人类的鼻子侦测出来。这相当于将几滴乙硫醇之类有浓烈气味的化学试剂滴入水立方的泳池中，而我们依然能闻到它的气味。人类还拥有超强的分辨气味的能力，即使是某些镜像对称的手性分子，我们也能分辨。另外，大脑中的嗅觉中心与大脑边缘系统有着极为密切的联系。由于大脑边缘系统控制情感、恐惧和记忆，因此可以推测，气味能影响我们的思考。气味影响思维，房地产商早已熟知如何用气味来吸引客户，例如在房间里烤面包或是煮咖啡让客户感受到家的气味，从而帮助房子的销售。还有研究发现气味能影响人的认知能力。北卡罗来纳大学威尔明顿分校的奥弗曼(William\
    \ Overman)和他的同事进行了一项研究，在参与者进行一项决策能力测试时，在空气中加入一种新的气味。结果发现，不管是好闻的还是难闻的气味，参与者的测试成绩都会大幅下降。研究人员推断这是因为气味会刺激大脑的情感区，使人变得更加感性而非理性。气味还可能影响视觉，或是巩固我们的记忆。\n\
    \n### 2.2.5 其他感觉结构与功能\n\n感官是感受外界事物刺激的器官，包括眼、耳、鼻、舌、身等。大脑是一切感官的中枢。眼睛是视觉，耳朵是听觉，鼻子是嗅觉，舌头是味觉，身体各个部位是触觉。人体的五大感官为人的生活提供了很多便利，除了熟知的五大感官外，还有另外的感觉系统在发挥着作用，比如保持身体的平衡，饥饿的感觉等，有约20多种感觉系统。\n\
    \n- 1. 平衡感\n  站立或行走时不会摔倒，这要归功于平衡感。平衡感是由内耳的淋巴液控制，同视觉相互配合，使人能安全地四处走动。不停地转圈，就会使这一系统无法正常工作，导致眩晕并失去平衡。\n\
    \n- 2. 本体感受\n  当我们闭上眼睛抬起手，不用去看我们也知道手在什么位置。这就是本体感受在起作用，它让我们无须去看就知道身体各部位所在。这听起来似乎没多大用处，但是如果没有这一感官，人们需要不停地低头看脚才能行走。查酒驾时，警察也会测试本体感受。\n\
    \n- 3. 热觉感受\n  坐在篝火旁，人们可以感觉到热。从冰箱里拿出一块冰，人们能感受到冷。皮肤上的热感受器能感知温度变化。以前，探知冷热的能力被归类到触觉之下。不过，人们无须接触某物去感受它的热度（如坐在篝火旁，无须接触，我们就会感觉到热），因此热觉感受单独是一种感官。大脑内的热感系统能探知并控制核心体温。\n\
    \n- 4. 疼痛感\n  这一感官可以感知疼痛。约翰・霍普金斯大学感官生物学中心副主任保罗・福克斯表示，伤害感受同热觉感受常被混在一起，因为某种程度上，这两种感觉都利用到相同的皮肤神经元。伤害性感受器不仅分布在皮肤上，在骨头、关节和内脏等处都有分布。\n\
    \n- 5. 内部感受\n  这是对控制体内器官的内部感觉的统称。福克斯表示，人体内分布着各种感受器来引发潜意识和做出条件反射，这对身体健康有重大意义。人体大部分无意识行为都是由这类感受器控制管理，如引发咳嗽，控制呼吸频率，饥饿或口渴时发出提醒等。\n\
    \  随着科学的发展，人体的奥秘被不断地解开，我们对感官有了新的认识，也对人体自身有了更多的了解。\n\n- 6. 空间感\n  闭着眼睛，人们仍然能够感受到前面是一堵墙。\n\
    \n- 7. 情感\n  包括压力、喜、怒、忧、悲、恐、惊等。\n\n- 8. 身体状况\n  过量的运动、休息不足、营养不良，人们能够感受到的明显的疲倦和各种来自身体的感觉。\n\
    \n- 9. 时间感\n  被关闭在密闭空间，没有声音，人们会感到恐慌。\n\n- 10. 辣味感\n  辛辣，并不是一种味道，是一种细胞感到不适时的抗议。\n\
    \n## 2.3 人类对高级智慧的理解\n\n### 2.3.1 语言的定义与形成\n\n就定义而言，语言是生物同类之间由于沟通需要而制定的具有统一编码和解码的标准的声音（图像）指令。实质定义语言是以声音/符号为物质外壳，以含义为内涵，由词汇和语法构成并能表达人类思想的指令系统。语音、手势、表情是语言在人类肢体上的体现，文字符号是语言的显像符号。\n\
    \n语言就广义而言，是采用一套具有共同处理规则来进行表达的沟通指令，指令会以视觉、声音或者触觉的方式来传递。严格来说，语言是指人类沟通所使用的指令。所有人都是通过学习获得语言能力，语言的目的是交流观念、意见、思想等。语言学就是从人类研究语言分类与规则而发展出来的，研究语言的专家被称为语言学家。当人类发现与某些动物能够以某种方式沟通，就诞生了动物语言的概念。到了电脑的诞生，人类需要给予电脑指令。这种“单向沟通”就成了电脑语言。语言的表达方式是指人们使用语言的形式，人们使用语言的方式主要有两种，人的肢体行为和符号。人的肢体行为是人们使用语言的主要形式，口述声音、手势及表情就是人的肢体行为体现。口语是人类使用行为为进行语言交流的最主要方式。符号的应用主要表现为文字，文字是现代人类语言最大的应用类。\n\
    \n语言起源理论可以划分为两种假说：连续性和非连续性假说。所谓连续性假说的基本思想认为，语言不可能在突然之间形成，而是有一个过程，一定是由人类的灵长类的祖先早期的前语言系统演变而来的。非连续性的假说则认为，语言有一些独一无二的特征是在人类演化过程的某个时间段中突然出现的，跟人类基因的演化和突变也是有关的。过去对连续演化研究得比较多，也有很多的假设。现在还在继续研究的人当中，有的认为人类祖先由姿势产生了跟语言有关的符号系统，有声的语言也随着人类的进化慢慢产生出来。也有人认为，语言是模仿自然界的声音，或者是一种感叹。“几十年前我还小的时候，受的教育是说，人是劳动创造的”——这是恩格斯的话，人是能够制造工具的动物，语言也是由劳动创造的。比如，我们的祖先在协同劳动时需要交流，由比画产生了有声的语言。但因为直接的证据很少，对语言的起源要做实证研究是比较困难的。近十年来，随着科学的进步，就可以用新的方法进行研究了。比如，可以由化石来看人类的解剖学特征，观察人类是如何演进的，也可以用计算机来模拟这个过程。也有的学者比较强调语言的社会性、人的社会文化认知对语言起源的影响。\n\
    \n认为语言产生是非连续性的代表人物之一就是乔姆斯基。大家知道，乔姆斯基是一个很有影响力的语言学家，他也很关心政治，是著名的左翼政论家。可以说，对当代的语言学以及相关领域来说，乔姆斯基的影响力是最大的。当然，也有不少人不同意他的意见，但不能不承认他的影响。笔者并不完全赞同他的观点，但他的观点有一些还是有道理的，应该重视。比如，他强调只有人类才有语言，其他任何动物都不可能具有语言能力，语言能力是人独有的。20世纪60～70年代国外有些人做过很多实验，比方说，他们试图教猿猴说话，但猿猴没办法发出人的声音，不止一个中心尝试过教猿猴辨认代表某个概念的词语，但都没有取得成功。这也说明动物不可能拥有人类这样的语言能力。\n\
    \n自20世纪90年代，越来越多的语言学家、考古学家、心理学家、生物学家、人类学家等都开始尝试应用各种新方法来探究语言演化这一世界最难的学术问题。遗憾的是，由于人类语言历史悠久，语言本身具有复杂性以及缺少有力的科学证据支持，近20年来，人们对语言演化方面的探究进展不大，至今还没有令人信服的解说。\n\
    \n中国知名学者周海中曾经指出，解决语言演化问题的难度不亚于破解物种演化之谜的难度。语言演化既是一种社会现象，又是一种自然现象，还是人类心智发展和历史文化演变的结果。由于语言的起源与变化有其内在的原因和外界的影响，从而增加了语言演化问题的复杂性。\n\
    \n### 2.3.2 思维的形式与逻辑\n\n### 2.3.2.1 思维的形式\n\n思维形式，思维达成实现的形式。概念、判断、推理、证明是不同的思维形式。具有不同结构的判断形式、推理形式、证明形式也是不同的思维形式。在具体思维中，思维形式和思维内容总是结合在一起的，既不存在没有思维形式的思维内容，也不存在没有思维内容的思维形式。但是思维形式相对于思维内容具有独立性，所以逻辑学可以单独把思维形式作为研究对象。\n\
    \n形象思维、逻辑思维、灵感思维是三种普遍的思维形式。具体人的思维，不可能限于哪一种形式。解决一个问题，做一项工作或某个思维过程，至少是两种思维形式并用。两种思维形式一般指抽象思维和形象思维。\n\
    \n思维的逻辑就是思维的规律和规则。狭义上逻辑既指思维的规律，也指研究思维规律的学科（逻辑学）。广义上逻辑泛指规律，包括思维规律和客观规律。逻辑包括形式逻辑与辩证逻辑，形式逻辑包括归纳逻辑与演绎逻辑，辩证逻辑包括矛盾逻辑与对称逻辑。对称逻辑是人的整体思维（包括抽象思维与具象思维）的逻辑。\n\
    \n### 2.3.2.2 形象思维与逻辑\n\n所谓的形象思维，主要是指人们在认识世界的过程中，对事物表象进行取舍时形成的，只用直观形象的表象解决问题的思维方法。形象思维是在对形象信息传递的客观形象体系进行感受、储存的基础上，结合主观的认识和情感进行识别（包括审美判断和科学判断等），并用一定的形式、手段和工具（包括文学语言、绘画线条色彩、音响节奏旋律及操作工具等），创造和描述形象（包括艺术形象和科学形象）的一种基本的思维形式。\n\
    \n从文学艺术创作角度分析，所谓形象思维，也就是艺术家在创作过程中始终伴随着形象、情感以及联想和想象，通过事物的个别特征去把握一般规律从而创作出艺术美的思维方式。形象思维能力的大小往往决定一个人的审美水平。形象思维始终伴随着形象，是通过“象”来构成思维流程的，就是所谓的神与物游。形象思维始终伴随着情感，形象思维离不开想象和联想。文学艺术创作过程中主要的思维方式，借助于形象反映生活，运用典型化和想象的方法，塑造艺术形象，表达作者的思想感情，也叫艺术思维。\n\
    \n形象思维是反映和认识世界的重要思维形式，是培养人、教育人的有力工具。在科学研究中，科学家除了使用抽象思维以外，也经常使用形象思维。在企业经营中，高度发达的形象思维，是企业家在激烈而又复杂的市场竞争中取胜不可缺少的重要条件。高层管理者离开了形象信息，离开了形象思维，他所得到的信息就可能只是间接的、过时的甚至不确切的，因此也就难以做出正确的决策。形象思维与逻辑思维（理论思维）是两种基本的思维形态，理论思维指以科学的原理、概念为基础来解决问题的思维活动。例如，用“水是生命之源”的理论来解释干旱对世界万物的影响。过去人们曾把它们划归为不同的类别，认为“科学家用概念来思考，而艺术家则用形象来思考。”这其实是一种误解，形象思维并不仅仅局属于艺术家，它也是科学家进行科学发现和创造的一种重要的思维形式。例如，物理学中所有的形象模型，像电力线、磁力线、原子结构的汤姆森模型或卢瑟福小太阳系模型，都是物理学家抽象思维和形象思维结合的产物。\n\
    \n爱因斯坦是一个具有极其深刻的逻辑思维能力的大师，但他却反对把逻辑方法视为唯一的科学方法，他十分善于发挥形象思维的自由创造力，他所构思的种种理想化实验就是运用形象思维的典型范例。这些理想化实验并不是对具体的事例运用抽象化的方法，舍弃现象，抽取本质，而是运用形象思维的方法，将表现一般、本质的现象加以保留，并使之得到集中和强化。爱因斯坦著名的广义相对论的创立实际上就是起源于一个自由的想象。\n\
    \n### 2.3.2.3 抽象思维与逻辑\n\n抽象思维凭借科学的抽象概念对事物的本质和客观世界发展的深远过程进行反映，使人们通过认识活动获得远远超出靠感觉器官直接感知的知识。科学的抽象是在概念中反映自然界或社会物质过程的内在本质的思想，它是在对事物的本质属性进行分析、综合、比较的基础上，抽取出事物的本质属性，撇开其非本质属性，使认识从感性的具体深入抽象的规定，形成概念。空洞的、臆造的、不可捉摸的抽象是不科学的抽象。科学的、合乎逻辑的抽象思维是在社会实践的基础上形成的。抽象思维作为一种重要的思维形式，具有概括性、间接性、超然性的特点，是在分析事物时抽取事物最本质的特性而形成概念，并运用概念进行推理、判断的思维活动。\n\
    \n抽象思维深刻地反映着外部世界，使人能在认识客观规律的基础上科学地预见事物和现象的发展趋势。预言“生动的直观”没有直接提供出来的，但存在于意识之外的自然现象及其特征。这对科学研究具有重要意义。\n\
    \n抽象思维方法本身随着人类文明的进化也在不断演化。从大类看，抽象思维方法分为抽象思维的形而上学方法和抽象思维的辩证方法。抽象思维的这两种具体形式不像有些人认为的那样，是对立的和没有共同基础的。实际上，抽象思维的辩证方法是建立在抽象思维的形而上学方法之上的，在运用分析、综合、归纳、演绎方法来形成概念并确定概念与概念之间演绎的关系、概念外延的数量属性关系这些内容上，抽象思维的辩证方法和抽象思维的形而上学方法完全一样，只是面对发展和变化着的世界，为了提高思维的精确度从而减少思维对现实的偏差，抽象思维的辩证方法才增加了对概念内涵的数量属性关系的考察。可以说，抽象思维的辩证方法是对抽象思维的形而上学方法的补充和提高。\n\
    \n抽象思维方法在形而上学的初期阶段只知道用概念代表现实事物，用不同的概念去代表不同的现实事物以及用概念和概念之间的演绎关系去代表现实事物之间的实际联系。至于这种方法偏离现实世界的实际状况的程度则未见研究。概念所概括的那些事物，从静态看，其本身就不完全相同而是存在着差异的；从动态看，这些事物都在发生着变化，有些变化大一些有些变化小一些。抽象思维方法在形而上学的阶段只有当事物之间的差别足够大时，或者事物的变化足够大时，才会用“不同的概念代表不同的事物，新的概念代表新的事物”这一唯一的方法去解决这个难题。至于事物之间还没有足够大的差异和事物之间还没有足够大的变化时，抽象思维方法在形而上学的阶段完全无能为力，只能一概忽略不计。当抽象思维方法到了辩证法的阶段时，面对事物间的差异性和事物的变化性，不仅会在差异巨大时或变化巨大时用不同的概念去代表不同的事物（像抽象思维方法在形而上学的阶段所做的那样），而且会在事物间的差异或事物的变化还没有足够大时，用概念内涵的数量属性去描述这些差异和变化，并用概念内涵的数量属性作为对概念本身的补充和修正，从而在一定程度上减少抽象思维方法用概念代表现实事物和用概念间的关系代表现实事物之间的实际联系所引起的误差和偏离。\n\
    \n### 2.3.2.4 灵感思维与逻辑\n\n灵感思维是指人们在科学研究、科学创造、产品开发或问题解决过程中突然涌现、瞬息即逝，使问题得到解决的思维过程。灵感思维有偶然性、突发性、创造性等特点。灵感是新东西，即过去从未有过的新思想、新念头、新主意、新答案。灵感思维是三维的，它产生于大脑对接收到的信息的再加工，储存在大脑中沉睡的潜意识被激发时产生，即凭直觉领悟事物的本质。\n\
    \n灵感思维也称作顿悟。它是人们借助直觉启示猝然进发的一种领悟或理解的思维形式。诗人、文学家的“神来之笔”，军事指挥家的“出奇制胜”，思想战略家的“豁然开朗”，科学家和发明家的“茅塞顿开”等，都说明了灵感的这一特点。它是在长时间的思索，问题仍没有得到解决的情况下，突然受到某一事物的启发，使问题一下子解决的思维方法。“十月怀胎，一朝分娩”，就是这种方法的形象化的描写。灵感来自信息的诱导、经验的积累、联想的升华、事业心的催化。\n\
    \n灵感思维是人们在文艺创作、科学研究中因创造力突然达到超水平发挥的一种特定心理状态。钱学森说：“如果把非逻辑思维视为形象思维，那么灵感思维就是顿悟，实际上是形象思维的特例。灵感的出现常常带给人们渴求已久的智慧之光。”例如，德国化学家凯库勒长期从事苯分子结构的研究，一天由于梦见蛇咬住了自己的尾巴形成环形而突发灵感，得出苯的六角形结构式。因此，灵感不是唯心的、神秘的东西，它是客观存在的，是思维的特殊形式，是一种使问题一下子澄清的顿悟。科学史上许多重大难题往往就是靠这种灵感的顿悟，奇迹般得到解决的。所谓“众里寻他千百度，蓦然回首，那人却在灯火阑珊处”就是这样一种意境。\n\
    \n### 2.3.3 艺术、哲学等意识的理解\n\n### 2.3.3.1 艺术\n\n艺术可以是宏观概念也可以是个体现象，是通过捕捉与挖掘、感受与分析、整合与运用（形体的组合过程、生物的生命过程、故事的发展过程）通过感受（看、听、嗅、触碰）得到的形式展示出来的阶段性结果。表达形式有语言、声音、文字、绘画、眼神、呼吸、肢体等。艺术的基本特征有以下几点。\n\
    \n- 1. 形象把握与理性把握的统一\n\n  形象，即审美形象。在广义上包含审美的情境和意境，主要是指艺术活动中能引起人的思想或情感活动的生动、具体、可感的人物和事物形象。形象是艺术活动特有的存在方式，艺术作品作为人的精神生产的产品，依存于一定的物质载体，它必须是直观的、具体的，能为人的感官直接感知的感性存在。形象是构成艺术作品的基本要素，所以每个艺术形象都必须以个别具体的感性形式出现，把生活中的人、事、景、物的外部形态和内在特征真实地表现出来，有血有肉、有声有色，使人产生一种活灵活现的真实感。艺术形象又是艺术家认识体验生活的结果，是艺术家审美意识的结晶，因此艺术形象又具有艺术家审视、体验生活时把握到的鲜活性和具体性，通过人的视觉、听觉等感官能够感受、把握到艺术形象的色彩、线条、声音、动作，给人以闻其声、见其人、临其境的审美感受。\n\
    \n  艺术形象贯穿于艺术活动的全过程。艺术家在创造的过程中始终离不开具体的形象。正如郑板桥画竹子，他观察、体验竹子的形象始于“园中之竹”“眼中之竹”，艺术构思孕育了“胸中之竹”，而磨砺展纸完成了“手中之竹”，可见竹子的形象自始至终伴随了竹画的全过程。艺术家不仅在创作过程中从不脱离生动具体的形象，其创造的成果艺术品，更须展现具体可感的艺术形象，并以其强烈的艺术感染力去打动每一个欣赏者。因此，艺术欣赏的过程也要通过对艺术形象的感情来引发对作品中情境、意境的体味。这足以说明形象贯穿了艺术活动的每个环节，形象性成为艺术区别于其他社会意识形态的最基本的特征，也是艺术反映社会生活的特殊形式，是创作主体对于客体对象瞬间顿悟式的审美创造。它是感性的，不是推理的，是体验的，而不是分析的。\n\
    \n  同时，艺术形象的创造又不能离开理性，艺术中的形象是有意味的形象，是渗透了艺术家深刻理性思考的形象。它不是客观生活图景的随意照搬，而是艺术家经过选择、加工并融\n"
  mdcn: "\n种。在中枢神经内，把感觉综合起来，特别是有嗅觉参与，就能产生多种多样的复合感觉，如涩、辣等都是由这四种味觉融合而成的。人吃东西时，通过咀嚼和舌、唾液的搅拌，味蕾受到不同味道物质的刺激，将信息由味神经传送到大脑味觉中枢，便产生味觉，品尝出饭菜的滋味，使我们得以体验到中外名菜的千百种味道。不同的味觉对人的生命活动起着信号的作用：甜味是需要补充热量的信号；酸味是新陈代谢加速和食物变质的信号；咸味是帮助保持体液平衡的信号；苦味是保护人体不受有害物质危害的信号；而鲜味则是蛋白质来源的信号。\n\
    \n## 2. 嗅觉的生理功能\n\n嗅觉是一种感觉。它由两个感觉系统参与，即嗅神经系统和鼻三叉神经系统。嗅觉和味觉会整合和互相作用。嗅觉是外激素通信实现的前提。嗅觉是一种远感，即是说它是通过长距离感受化学刺激的感觉。相比之下，味觉是一种近感觉。\n\
    \n最近一系列的研究发现，人类也有异常灵敏的嗅觉，并且在不知不觉中对我们的生活产生很大的影响。细微的气味能在不为我们察觉的情况下影响心情、行为以及决定。自己身上散发出的气味则能表现自己恐惧或悲伤等的情绪。问题是为何我们对嗅觉的作用毫无察觉呢？相比于看起来似乎更加重要的视觉和听觉，嗅觉从来就不是人类感觉研究的首选对象，直到最近，嗅觉才获得足够的重视。纽约州立大学石溪分校从事神经生物学研究的帕罗迪(Lilianne\
    \ Mujica-Parodi)表示，长久以来，人们有个很大的误区，即认为相比于其他哺乳类动物，嗅觉对人类的影响并不显著。这个误区始于19世纪一位重要的解剖学家布罗卡(Pierre\
    \ Paul Broca)。他通过比较不同动物大脑中控制嗅觉的部分占整个大脑的比例，将哺乳类动物分为两类：一类是嗅觉发达型，例如狗，它们能通过灵敏的嗅觉感知外部世界；第二类是嗅觉不发达型，例如人类、其他灵长类动物及海生哺乳动物，这些动物的嗅觉组织在大小和功能上都相形见绌。最近的遗传学研究似乎也证实了布罗卡的观点，研究发现，大多数哺乳类动物的基因中存在能产生1000多种不同气味感受器的编码。其中大多数编码在人类的基因中并不存在。人类的基因只能编码产生400多种气味感受器。\n\
    \n但更多的研究发现人们之前可能存在误解。最近科学家们通过大脑扫描发现，人类大脑中感知嗅觉的部分实际上多于布罗卡在100多年前通过解剖得出的区域。耶鲁大学的格里尔(Charles\
    \ Greer)表示，尽管人类的气味感受器数量上比其他的哺乳类要少，但人的鼻子和大脑之间的联系却异常活跃。和其他哺乳类动物相比，人类的每组气味感受器连接的神经更多，就是说，我们的气味处理能力更加强大。\n\
    \n随着更多研究的深入，科学家们发现人类的鼻子远比我们想象中的灵敏。一项实验表明，某些化学试剂即使在水中被稀释了10亿倍，依然可以被人类的鼻子侦测出来。这相当于将几滴乙硫醇之类有浓烈气味的化学试剂滴入水立方的泳池中，而我们依然能闻到它的气味。人类还拥有超强的分辨气味的能力，即使是某些镜像对称的手性分子，我们也能分辨。另外，大脑中的嗅觉中心与大脑边缘系统有着极为密切的联系。由于大脑边缘系统控制情感、恐惧和记忆，因此可以推测，气味能影响我们的思考。气味影响思维，房地产商早已熟知如何用气味来吸引客户，例如在房间里烤面包或是煮咖啡让客户感受到家的气味，从而帮助房子的销售。还有研究发现气味能影响人的认知能力。北卡罗来纳大学威尔明顿分校的奥弗曼(William\
    \ Overman)和他的同事进行了一项研究，在参与者进行一项决策能力测试时，在空气中加入一种新的气味。结果发现，不管是好闻的还是难闻的气味，参与者的测试成绩都会大幅下降。研究人员推断这是因为气味会刺激大脑的情感区，使人变得更加感性而非理性。气味还可能影响视觉，或是巩固我们的记忆。\n\
    \n### 2.2.5 其他感觉结构与功能\n\n感官是感受外界事物刺激的器官，包括眼、耳、鼻、舌、身等。大脑是一切感官的中枢。眼睛是视觉，耳朵是听觉，鼻子是嗅觉，舌头是味觉，身体各个部位是触觉。人体的五大感官为人的生活提供了很多便利，除了熟知的五大感官外，还有另外的感觉系统在发挥着作用，比如保持身体的平衡，饥饿的感觉等，有约20多种感觉系统。\n\
    \n- 1. 平衡感\n  站立或行走时不会摔倒，这要归功于平衡感。平衡感是由内耳的淋巴液控制，同视觉相互配合，使人能安全地四处走动。不停地转圈，就会使这一系统无法正常工作，导致眩晕并失去平衡。\n\
    \n- 2. 本体感受\n  当我们闭上眼睛抬起手，不用去看我们也知道手在什么位置。这就是本体感受在起作用，它让我们无须去看就知道身体各部位所在。这听起来似乎没多大用处，但是如果没有这一感官，人们需要不停地低头看脚才能行走。查酒驾时，警察也会测试本体感受。\n\
    \n- 3. 热觉感受\n  坐在篝火旁，人们可以感觉到热。从冰箱里拿出一块冰，人们能感受到冷。皮肤上的热感受器能感知温度变化。以前，探知冷热的能力被归类到触觉之下。不过，人们无须接触某物去感受它的热度（如坐在篝火旁，无须接触，我们就会感觉到热），因此热觉感受单独是一种感官。大脑内的热感系统能探知并控制核心体温。\n\
    \n- 4. 疼痛感\n  这一感官可以感知疼痛。约翰・霍普金斯大学感官生物学中心副主任保罗・福克斯表示，伤害感受同热觉感受常被混在一起，因为某种程度上，这两种感觉都利用到相同的皮肤神经元。伤害性感受器不仅分布在皮肤上，在骨头、关节和内脏等处都有分布。\n\
    \n- 5. 内部感受\n  这是对控制体内器官的内部感觉的统称。福克斯表示，人体内分布着各种感受器来引发潜意识和做出条件反射，这对身体健康有重大意义。人体大部分无意识行为都是由这类感受器控制管理，如引发咳嗽，控制呼吸频率，饥饿或口渴时发出提醒等。\n\
    \  随着科学的发展，人体的奥秘被不断地解开，我们对感官有了新的认识，也对人体自身有了更多的了解。\n\n- 6. 空间感\n  闭着眼睛，人们仍然能够感受到前面是一堵墙。\n\
    \n- 7. 情感\n  包括压力、喜、怒、忧、悲、恐、惊等。\n\n- 8. 身体状况\n  过量的运动、休息不足、营养不良，人们能够感受到的明显的疲倦和各种来自身体的感觉。\n\
    \n- 9. 时间感\n  被关闭在密闭空间，没有声音，人们会感到恐慌。\n\n- 10. 辣味感\n  辛辣，并不是一种味道，是一种细胞感到不适时的抗议。\n\
    \n## 2.3 人类对高级智慧的理解\n\n### 2.3.1 语言的定义与形成\n\n就定义而言，语言是生物同类之间由于沟通需要而制定的具有统一编码和解码的标准的声音（图像）指令。实质定义语言是以声音/符号为物质外壳，以含义为内涵，由词汇和语法构成并能表达人类思想的指令系统。语音、手势、表情是语言在人类肢体上的体现，文字符号是语言的显像符号。\n\
    \n语言就广义而言，是采用一套具有共同处理规则来进行表达的沟通指令，指令会以视觉、声音或者触觉的方式来传递。严格来说，语言是指人类沟通所使用的指令。所有人都是通过学习获得语言能力，语言的目的是交流观念、意见、思想等。语言学就是从人类研究语言分类与规则而发展出来的，研究语言的专家被称为语言学家。当人类发现与某些动物能够以某种方式沟通，就诞生了动物语言的概念。到了电脑的诞生，人类需要给予电脑指令。这种“单向沟通”就成了电脑语言。语言的表达方式是指人们使用语言的形式，人们使用语言的方式主要有两种，人的肢体行为和符号。人的肢体行为是人们使用语言的主要形式，口述声音、手势及表情就是人的肢体行为体现。口语是人类使用行为为进行语言交流的最主要方式。符号的应用主要表现为文字，文字是现代人类语言最大的应用类。\n\
    \n语言起源理论可以划分为两种假说：连续性和非连续性假说。所谓连续性假说的基本思想认为，语言不可能在突然之间形成，而是有一个过程，一定是由人类的灵长类的祖先早期的前语言系统演变而来的。非连续性的假说则认为，语言有一些独一无二的特征是在人类演化过程的某个时间段中突然出现的，跟人类基因的演化和突变也是有关的。过去对连续演化研究得比较多，也有很多的假设。现在还在继续研究的人当中，有的认为人类祖先由姿势产生了跟语言有关的符号系统，有声的语言也随着人类的进化慢慢产生出来。也有人认为，语言是模仿自然界的声音，或者是一种感叹。“几十年前我还小的时候，受的教育是说，人是劳动创造的”——这是恩格斯的话，人是能够制造工具的动物，语言也是由劳动创造的。比如，我们的祖先在协同劳动时需要交流，由比画产生了有声的语言。但因为直接的证据很少，对语言的起源要做实证研究是比较困难的。近十年来，随着科学的进步，就可以用新的方法进行研究了。比如，可以由化石来看人类的解剖学特征，观察人类是如何演进的，也可以用计算机来模拟这个过程。也有的学者比较强调语言的社会性、人的社会文化认知对语言起源的影响。\n\
    \n认为语言产生是非连续性的代表人物之一就是乔姆斯基。大家知道，乔姆斯基是一个很有影响力的语言学家，他也很关心政治，是著名的左翼政论家。可以说，对当代的语言学以及相关领域来说，乔姆斯基的影响力是最大的。当然，也有不少人不同意他的意见，但不能不承认他的影响。笔者并不完全赞同他的观点，但他的观点有一些还是有道理的，应该重视。比如，他强调只有人类才有语言，其他任何动物都不可能具有语言能力，语言能力是人独有的。20世纪60～70年代国外有些人做过很多实验，比方说，他们试图教猿猴说话，但猿猴没办法发出人的声音，不止一个中心尝试过教猿猴辨认代表某个概念的词语，但都没有取得成功。这也说明动物不可能拥有人类这样的语言能力。\n\
    \n自20世纪90年代，越来越多的语言学家、考古学家、心理学家、生物学家、人类学家等都开始尝试应用各种新方法来探究语言演化这一世界最难的学术问题。遗憾的是，由于人类语言历史悠久，语言本身具有复杂性以及缺少有力的科学证据支持，近20年来，人们对语言演化方面的探究进展不大，至今还没有令人信服的解说。\n\
    \n中国知名学者周海中曾经指出，解决语言演化问题的难度不亚于破解物种演化之谜的难度。语言演化既是一种社会现象，又是一种自然现象，还是人类心智发展和历史文化演变的结果。由于语言的起源与变化有其内在的原因和外界的影响，从而增加了语言演化问题的复杂性。\n\
    \n### 2.3.2 思维的形式与逻辑\n\n### 2.3.2.1 思维的形式\n\n思维形式，思维达成实现的形式。概念、判断、推理、证明是不同的思维形式。具有不同结构的判断形式、推理形式、证明形式也是不同的思维形式。在具体思维中，思维形式和思维内容总是结合在一起的，既不存在没有思维形式的思维内容，也不存在没有思维内容的思维形式。但是思维形式相对于思维内容具有独立性，所以逻辑学可以单独把思维形式作为研究对象。\n\
    \n形象思维、逻辑思维、灵感思维是三种普遍的思维形式。具体人的思维，不可能限于哪一种形式。解决一个问题，做一项工作或某个思维过程，至少是两种思维形式并用。两种思维形式一般指抽象思维和形象思维。\n\
    \n思维的逻辑就是思维的规律和规则。狭义上逻辑既指思维的规律，也指研究思维规律的学科（逻辑学）。广义上逻辑泛指规律，包括思维规律和客观规律。逻辑包括形式逻辑与辩证逻辑，形式逻辑包括归纳逻辑与演绎逻辑，辩证逻辑包括矛盾逻辑与对称逻辑。对称逻辑是人的整体思维（包括抽象思维与具象思维）的逻辑。\n\
    \n### 2.3.2.2 形象思维与逻辑\n\n所谓的形象思维，主要是指人们在认识世界的过程中，对事物表象进行取舍时形成的，只用直观形象的表象解决问题的思维方法。形象思维是在对形象信息传递的客观形象体系进行感受、储存的基础上，结合主观的认识和情感进行识别（包括审美判断和科学判断等），并用一定的形式、手段和工具（包括文学语言、绘画线条色彩、音响节奏旋律及操作工具等），创造和描述形象（包括艺术形象和科学形象）的一种基本的思维形式。\n\
    \n从文学艺术创作角度分析，所谓形象思维，也就是艺术家在创作过程中始终伴随着形象、情感以及联想和想象，通过事物的个别特征去把握一般规律从而创作出艺术美的思维方式。形象思维能力的大小往往决定一个人的审美水平。形象思维始终伴随着形象，是通过“象”来构成思维流程的，就是所谓的神与物游。形象思维始终伴随着情感，形象思维离不开想象和联想。文学艺术创作过程中主要的思维方式，借助于形象反映生活，运用典型化和想象的方法，塑造艺术形象，表达作者的思想感情，也叫艺术思维。\n\
    \n形象思维是反映和认识世界的重要思维形式，是培养人、教育人的有力工具。在科学研究中，科学家除了使用抽象思维以外，也经常使用形象思维。在企业经营中，高度发达的形象思维，是企业家在激烈而又复杂的市场竞争中取胜不可缺少的重要条件。高层管理者离开了形象信息，离开了形象思维，他所得到的信息就可能只是间接的、过时的甚至不确切的，因此也就难以做出正确的决策。形象思维与逻辑思维（理论思维）是两种基本的思维形态，理论思维指以科学的原理、概念为基础来解决问题的思维活动。例如，用“水是生命之源”的理论来解释干旱对世界万物的影响。过去人们曾把它们划归为不同的类别，认为“科学家用概念来思考，而艺术家则用形象来思考。”这其实是一种误解，形象思维并不仅仅局属于艺术家，它也是科学家进行科学发现和创造的一种重要的思维形式。例如，物理学中所有的形象模型，像电力线、磁力线、原子结构的汤姆森模型或卢瑟福小太阳系模型，都是物理学家抽象思维和形象思维结合的产物。\n\
    \n爱因斯坦是一个具有极其深刻的逻辑思维能力的大师，但他却反对把逻辑方法视为唯一的科学方法，他十分善于发挥形象思维的自由创造力，他所构思的种种理想化实验就是运用形象思维的典型范例。这些理想化实验并不是对具体的事例运用抽象化的方法，舍弃现象，抽取本质，而是运用形象思维的方法，将表现一般、本质的现象加以保留，并使之得到集中和强化。爱因斯坦著名的广义相对论的创立实际上就是起源于一个自由的想象。\n\
    \n### 2.3.2.3 抽象思维与逻辑\n\n抽象思维凭借科学的抽象概念对事物的本质和客观世界发展的深远过程进行反映，使人们通过认识活动获得远远超出靠感觉器官直接感知的知识。科学的抽象是在概念中反映自然界或社会物质过程的内在本质的思想，它是在对事物的本质属性进行分析、综合、比较的基础上，抽取出事物的本质属性，撇开其非本质属性，使认识从感性的具体深入抽象的规定，形成概念。空洞的、臆造的、不可捉摸的抽象是不科学的抽象。科学的、合乎逻辑的抽象思维是在社会实践的基础上形成的。抽象思维作为一种重要的思维形式，具有概括性、间接性、超然性的特点，是在分析事物时抽取事物最本质的特性而形成概念，并运用概念进行推理、判断的思维活动。\n\
    \n抽象思维深刻地反映着外部世界，使人能在认识客观规律的基础上科学地预见事物和现象的发展趋势。预言“生动的直观”没有直接提供出来的，但存在于意识之外的自然现象及其特征。这对科学研究具有重要意义。\n\
    \n抽象思维方法本身随着人类文明的进化也在不断演化。从大类看，抽象思维方法分为抽象思维的形而上学方法和抽象思维的辩证方法。抽象思维的这两种具体形式不像有些人认为的那样，是对立的和没有共同基础的。实际上，抽象思维的辩证方法是建立在抽象思维的形而上学方法之上的，在运用分析、综合、归纳、演绎方法来形成概念并确定概念与概念之间演绎的关系、概念外延的数量属性关系这些内容上，抽象思维的辩证方法和抽象思维的形而上学方法完全一样，只是面对发展和变化着的世界，为了提高思维的精确度从而减少思维对现实的偏差，抽象思维的辩证方法才增加了对概念内涵的数量属性关系的考察。可以说，抽象思维的辩证方法是对抽象思维的形而上学方法的补充和提高。\n\
    \n抽象思维方法在形而上学的初期阶段只知道用概念代表现实事物，用不同的概念去代表不同的现实事物以及用概念和概念之间的演绎关系去代表现实事物之间的实际联系。至于这种方法偏离现实世界的实际状况的程度则未见研究。概念所概括的那些事物，从静态看，其本身就不完全相同而是存在着差异的；从动态看，这些事物都在发生着变化，有些变化大一些有些变化小一些。抽象思维方法在形而上学的阶段只有当事物之间的差别足够大时，或者事物的变化足够大时，才会用“不同的概念代表不同的事物，新的概念代表新的事物”这一唯一的方法去解决这个难题。至于事物之间还没有足够大的差异和事物之间还没有足够大的变化时，抽象思维方法在形而上学的阶段完全无能为力，只能一概忽略不计。当抽象思维方法到了辩证法的阶段时，面对事物间的差异性和事物的变化性，不仅会在差异巨大时或变化巨大时用不同的概念去代表不同的事物（像抽象思维方法在形而上学的阶段所做的那样），而且会在事物间的差异或事物的变化还没有足够大时，用概念内涵的数量属性去描述这些差异和变化，并用概念内涵的数量属性作为对概念本身的补充和修正，从而在一定程度上减少抽象思维方法用概念代表现实事物和用概念间的关系代表现实事物之间的实际联系所引起的误差和偏离。\n\
    \n### 2.3.2.4 灵感思维与逻辑\n\n灵感思维是指人们在科学研究、科学创造、产品开发或问题解决过程中突然涌现、瞬息即逝，使问题得到解决的思维过程。灵感思维有偶然性、突发性、创造性等特点。灵感是新东西，即过去从未有过的新思想、新念头、新主意、新答案。灵感思维是三维的，它产生于大脑对接收到的信息的再加工，储存在大脑中沉睡的潜意识被激发时产生，即凭直觉领悟事物的本质。\n\
    \n灵感思维也称作顿悟。它是人们借助直觉启示猝然进发的一种领悟或理解的思维形式。诗人、文学家的“神来之笔”，军事指挥家的“出奇制胜”，思想战略家的“豁然开朗”，科学家和发明家的“茅塞顿开”等，都说明了灵感的这一特点。它是在长时间的思索，问题仍没有得到解决的情况下，突然受到某一事物的启发，使问题一下子解决的思维方法。“十月怀胎，一朝分娩”，就是这种方法的形象化的描写。灵感来自信息的诱导、经验的积累、联想的升华、事业心的催化。\n\
    \n灵感思维是人们在文艺创作、科学研究中因创造力突然达到超水平发挥的一种特定心理状态。钱学森说：“如果把非逻辑思维视为形象思维，那么灵感思维就是顿悟，实际上是形象思维的特例。灵感的出现常常带给人们渴求已久的智慧之光。”例如，德国化学家凯库勒长期从事苯分子结构的研究，一天由于梦见蛇咬住了自己的尾巴形成环形而突发灵感，得出苯的六角形结构式。因此，灵感不是唯心的、神秘的东西，它是客观存在的，是思维的特殊形式，是一种使问题一下子澄清的顿悟。科学史上许多重大难题往往就是靠这种灵感的顿悟，奇迹般得到解决的。所谓“众里寻他千百度，蓦然回首，那人却在灯火阑珊处”就是这样一种意境。\n\
    \n### 2.3.3 艺术、哲学等意识的理解\n\n### 2.3.3.1 艺术\n\n艺术可以是宏观概念也可以是个体现象，是通过捕捉与挖掘、感受与分析、整合与运用（形体的组合过程、生物的生命过程、故事的发展过程）通过感受（看、听、嗅、触碰）得到的形式展示出来的阶段性结果。表达形式有语言、声音、文字、绘画、眼神、呼吸、肢体等。艺术的基本特征有以下几点。\n\
    \n- 1. 形象把握与理性把握的统一\n\n  形象，即审美形象。在广义上包含审美的情境和意境，主要是指艺术活动中能引起人的思想或情感活动的生动、具体、可感的人物和事物形象。形象是艺术活动特有的存在方式，艺术作品作为人的精神生产的产品，依存于一定的物质载体，它必须是直观的、具体的，能为人的感官直接感知的感性存在。形象是构成艺术作品的基本要素，所以每个艺术形象都必须以个别具体的感性形式出现，把生活中的人、事、景、物的外部形态和内在特征真实地表现出来，有血有肉、有声有色，使人产生一种活灵活现的真实感。艺术形象又是艺术家认识体验生活的结果，是艺术家审美意识的结晶，因此艺术形象又具有艺术家审视、体验生活时把握到的鲜活性和具体性，通过人的视觉、听觉等感官能够感受、把握到艺术形象的色彩、线条、声音、动作，给人以闻其声、见其人、临其境的审美感受。\n\
    \n  艺术形象贯穿于艺术活动的全过程。艺术家在创造的过程中始终离不开具体的形象。正如郑板桥画竹子，他观察、体验竹子的形象始于“园中之竹”“眼中之竹”，艺术构思孕育了“胸中之竹”，而磨砺展纸完成了“手中之竹”，可见竹子的形象自始至终伴随了竹画的全过程。艺术家不仅在创作过程中从不脱离生动具体的形象，其创造的成果艺术品，更须展现具体可感的艺术形象，并以其强烈的艺术感染力去打动每一个欣赏者。因此，艺术欣赏的过程也要通过对艺术形象的感情来引发对作品中情境、意境的体味。这足以说明形象贯穿了艺术活动的每个环节，形象性成为艺术区别于其他社会意识形态的最基本的特征，也是艺术反映社会生活的特殊形式，是创作主体对于客体对象瞬间顿悟式的审美创造。它是感性的，不是推理的，是体验的，而不是分析的。\n\
    \n  同时，艺术形象的创造又不能离开理性，艺术中的形象是有意味的形象，是渗透了艺术家深刻理性思考的形象。它不是客观生活图景的随意照搬，而是艺术家经过选择、加工并融\n"
