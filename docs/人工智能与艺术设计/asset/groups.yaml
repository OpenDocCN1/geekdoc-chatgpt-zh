    ## 1.3.2 人工智能的发展瓶颈问题


    20 世纪 60 年代末、70 年代初，人工智能取得进展，进入它的辉煌时期。这种辉煌主要表现在两个方面：一方面人们利用符号表示逻辑推理的方法，通过计算机的启发式编程（Heuristic
    Programming），成功地建立了一种人类深思熟虑行为（Deliberative Behaviors）的智能模型，表明计算机程序的确可以准确地模拟人类的一类智能行为，这是一个突破；与此同时，人们运用同样的模型，成功地在计算机上建造了一系列实用的人造智能系统（专家系统），其性能可以与人类的同类智能相匹敌，表明通过计算机编程的确能够建造人工智能系统，这是另一个突破。这两项突破表明，以逻辑为基础的符号计算（处理）方法，无论在智能模拟上，还是在智能系统建造上都同样能成功。这样人工智能进入了它的兴盛时期，我们暂且称它为传统人工智能时代。在这段时期，人们对人工智能的发展前途充满信心，各种各样的专家系统在工程、医疗卫生和服务等行业得到实际应用。人工智能研究经费充足，以经营人工智能产品为业的公司纷纷成立，AI
    研究人员猛增，比如出席第 10 届国际人工智能会议（IJCAI87，米兰）的人数为 5 000～6 000 人，人工智能界一派乐观情绪。在这种情绪支配下，20
    世纪 80 年代初，美国、欧洲和日本都先后制订了一批针对 AI 的大型项目，其目的是为了实现人工智能的进一步突破。其中大家熟知的有，日本的“五代机”计划和美国的
    ALV（Autonomous Land Vehicle）计划等。


    可惜，这些计划的多数执行到 20 世纪 80 年代中期时，就面临重重的困难，已经看出不能达到预期的目标。进一步分析便发现，这些困难不只是个别项目的制订问题，而是涉及人工智能研究的根本性问题。总的来说，是两个根本性问题，第一，交互（Interaction）问题，即传统方法只能模拟人类深思熟虑的行为，而不包括人与环境的交互行为。因此根据这种模型建造的人工智能系统，也基本上不具备这种能力。显然，这类系统很难在动态的和不确定的环境中使用。美国的
    ALV 计划就是试图建造一种能在越野环境下自主行驶的车辆，这种车辆必须具备与环境的交互能力，以适应环境的不确定性和动态变化。可是，依据传统人工智能的方法，难以建立这样的系统，这也是
    ALV 计划遇到困难的根本原因。第二，扩展（Scaling up）问题，即传统人工智能方法只适合于建造领域狭窄的专家系统，不能把这种方法简单地推广到规模更大、领域更宽的复杂系统中去。日本“五代机”计划的不成功，其原因也在于此。正是由于这两个基本问题以及其他的技术困难，使
    AI 研究进入了低谷。


    AI 研究出现曲折，迫使人们进行反思。人们从对传统人工智能时代的反思中发现，过去 30 年里，以逻辑为基础，以启发式编程为特征的传统人工智能虽然取得了很大的成就（特别是建造出一批实用的专家系统），使
    AI 在工业、商业及军事等各应用领域表现出它的价值，引起广泛的重视。但是如果从人工智能的理论基础和技术方法上看，它的成就则是非常有限的，因此 AI 要进一步发展，必须突破这一局限性。


    ### 1.3.2.1 AI 方法论


    20 世纪 80 年代，以 MIT 的 Brooks 等人为代表，对传统的 AI 研究提出了挑战。他们研制了一批小型的移动机器人，这批机器人与 CMU 研制的移动机器人形成强烈的反差，CMU
    使用的是大卡车，上面装备的是高速计算机、激光雷达、彩色摄像机和全球卫星定位系统（GPS）等大型设备。MIT 用的是玩具车（铁屁虫），上面装的是单板机、红外传感器和接触开关等小器件。于是，一场关于谁是“真正”机器人的争论在他们之间展开了。CMU
    批评 MIT 的机器人说，“那只是一只小玩具，供表演罢了”。MIT 也不示弱，针锋相对地说，“CMU 的机器人固然很大，但离实用更远，因此不过是大玩具而已”。MIT
    认为自己能够用比 CMU 简单得多的设备做出智能相当的移动机器人，这一点比 CMU 高明。当然，争论的最后结果只能是平局，因为他们各自代表了两种不同的智能观和研究路线。CMU
    代表的是传统的 AI 观，他们建造的移动机器人系统，采用的是“环境建模—规划—控制”的纵向体系结构，其机器人的智能表现在对环境的深刻理解以及在此基础上深思熟虑的推理和决策，因此它需要强有力的传感和计算设备来支持复杂的环境建模和寻找正确的决策方案。Brooks
    则遵循另外的路线，即感知—动作（控制）的横向体系结构，他认为机器人的智能应表现在对环境刺激的及时反应上，表现在对环境的适应，以及复杂环境下的生存能力，因此
    Brooks 称自己的思想为“没有推理”的智能。Brooks 的探索性工作代表了人工智能一个新的研究方向——现场 AI 的诞生。传统 AI 强调的是人类深思熟虑的行为，它的智能行为来源于启发式搜索。现场
    AI 强调智能体应该工作在它的环境中，它的智能行为来源于环境信息的反馈，通过与环境的交互表现增长它的智能。这是两个完全不同的研究路线与方法，我们这里将着重讨论现场
    AI 给 AI 研究带来的影响。传统 AI 研究和模拟的只是人类深思熟虑的行为，从内容上讲，有很大的局限性。现场 AI 强调智能体与环境的交互，为了实现这种交互，智能体一方面要从环境获取信息（感知），另一方面要通过自己的动作对环境施加影响。显然，这些行为的大部分不是深思熟虑的，而是一种反射行为（Reactive
    Behaviors），即智能体在接受外界信息刺激后，如何迅速采取行动的问题，或者当预定的行为失败之后，如何立即改变行为的问题。这里，人类行为的模式与传统 AI
    所研究的模式不完全一样。现场 AI 的提出，扩展了人类思维研究和模拟的范围。其实，早在数年前，钱学森和戴汝为教授在论述思维的形式中，已经提到人类除了逻辑思维之外，还存在形象思维及顿悟等思维形式，并强调研究其他思维形式及其模拟的重要性。近年来，由于现场
    AI 的提出及盛行，国际上已普遍开始重视人类其他思维形式的研究。H.A. Simon 在他的获奖特邀报告中，以“解释说不清现象——AI 关于直觉、顿悟和灵感问题”为题，专门谈及这些智能中“说不清”的现象及其模拟问题。根据他的意见，目前计算机程序已经有可能模拟这个现象。当然，他只是就这些行为的计算机程序模拟而言，如果考虑到智能体与环境的交互，问题恐怕要复杂得多。


    从方法上讲，传统人工智能方法也有其局限性。传统方法根据人类的先验知识，采取构造的方法，构造一个启发式搜索的问题求解模型，这是一个无反馈的孤立系统，对推理和学习都适用。传统
    AI 方法的核心是使用先验知识和搜索技术，因此当先验知识丰富且易于表达时，问题求解（搜索）就十分容易；反之，我们就会面临计算（搜索）量大的困难。从本质上讲，传统方法成功与否，取决于我们掌握知识（知道）的多少及精确的程度，从这一点来看，传统方法在处理不确定性、知识不完全性以及学习等问题时必将遇到许多实质性困难，这就不难理解几十年来机器学习进展缓慢的原因。其实，机器学习与推理一样也是一种搜索，即搜索待学习的概念和知识，不同的只是在学习中先验知识更少一些。机器学习需要更多的搜索，因此势必带来计算量（搜索量）指数爆炸的困难。传统
    AI 需要先验知识，即使对于学习也是一样，这就造成一种困难：机器要借助“已知”进行学习，而“已知”又需要通过学习来得到，那么最初的“已知”只能由教师（人）给予机器，这就不难理解，传统方法难以实现机器自我学习的原因，要使
    AI 技术向前发展，需要考虑同其他领域和技术的结合，现场 AI 为此提供了可能性。


    现场 AI 也促使传统符号处理机制与连接机制的集成，目前这种集成也正在发生中。大家知道，当传统的 AI 方法出现困难的时候，以神经网络为代表的连接机制正在崛起。因为知识在神经网络中是以准符号方式表示的，所以接受感知信息比较容易，从而容易与环境交互，人们开始对它寄予很大希望，以为在许多方面可以取代传统的方法。不过，经过十年多的实践，人们发现神经网络固然有许多特点，但在解决复杂问题时，也同样存在扩大规模的基本问题。当神经网络规模扩大时，学习复杂性也出现指数爆炸现象，所以唯一的出路，是寻找结合的途径。目前来讲，两个方向的渗透都在进行之中，一个是把神经网络机制引入传统
    AI，特别是把它的自学习机制和大规模并行计算引入 AI 的传统方法；另一方面是将符号表示和处理引入神经网络，即把先验知识和构造性方法引入神经网络的设计和学习过程，通过相互渗透使两种机制结合起来。


    现场 AI，不能只把它简单地看成是对传统 AI 的否定，或者把它与传统 AI 对立起来，简单地评判谁是谁非，而应该把它看成是传统 AI 的发展和补充，它使传统
    AI 无论在研究的内容以及研究的方法上都有了新的扩展。同时，把 AI 研究推向现场，使 AI 研究更加实用化，这些都是 AI 研究的进步。


    ### 1.3.2.2 智能系统的构成


    怎样构造复杂的智能系统，以达到 AI 研究扩大规模的目的呢？换句话说，复杂智能系统是由怎样的部件组成，而这些部件又如何组成智能系统的？为解决上述问题，近年来
    AI界提出了两个重要的思想和主张：（1）综合集成；（2）智能体。


    综合集成这个概念先后在不同的技术领域出现并使用过，但含义不尽相同。今天人工智能所提出的综合集成概念，则有更深、更广的意义。戴汝为教授等对综合集成已进行了很全面的论述，具体地把综合集成的研究方法分为三类：（1）研究能集成不同学科的方法；（2）人机集成方法；（3）创造新的表达、推理和学习方法；这很有指导意义。近年来，对于前两种集成，国际上的讨论已经多起来，虽然各自的主张和理解不完全相同，但大家的共识是，综合集成是一个很关键的问题。中国学者对于人机集成这方面的讨论更多也更深入，并具体划分了几个不同的层次，如机帮人、人帮机、人机协作等。事实上，在国外，20
    世纪 80 年代初，人们一度热心于全自主机器的研制，如美国卡内基梅隆大学（CMU）的 ALV 计划，其目标是要实现一个越野的自主车。不过，之后人们发现这是一项极难的研究任务，短期内很难完成。近年来，CMU
    推出一项极为成功的实验，这就是一辆他们研制的视觉导引小汽车，实现了从美国匹兹堡（校园所在地）到洛杉矶高速公路上的“自动”驾驶实验。它成功地横穿全美国，日夜兼程，风雨无阻，行程
    2 849 英里①。这项实验得到了大汽车公司的赞助，并在美国报纸上详细报道，广为宣传，说明大家对此十分感兴趣。这里，我们需要分析该实验是在什么条件下完成的。首先，高速公路是一个半结构化的环境，条件要比越野简单，易于实现；更重要的一点是它并不是完全自动驾驶，车上仍有人监视，紧急情况下，可给予干预。实验的结果是，自动驾驶占里程的
    98.2%，人工干预只占里程的 1.8%，这当然很成功。不过，这个 1.8% 很重要，说明关键时刻，还需要人的帮助，这是典型的“人帮机”模式。说明目前高速公路上的自动驾驶“人帮机”模式可以在实验条件下实现。如果实际应用，据说只能采取“机帮人”的模式，即主要靠人驾驶，机器只作为人的帮手，在驾驶员疲劳或注意力不集中时，提出警告，帮人一把。汽车公司感兴趣的正是这种模式，即提供一种汽车自动报警系统实现“机帮人”。


    ① 1 英里≈1,609 千米。


    如何创造一种新的表示和推理方法，实现不精确处理与精确处理的综合集成，是人工智能的关键问题之一。首先，分析一下人类为什么善于把精确处理与不精确处理结合起来，从而能方便地解决复杂的困难问题；相反，求解同一问题，对机器来讲，却往往十分困难。原因之一是，人类善于从不同层次（不同分辨率）上观察同一问题，并能在不同分辨率的空间上进行推理、分析，并自如地往返于不同表示空间之间。相反，机器通常只能在单一分辨率（粒度）空间上求解问题，因此计算复杂性高、困难大。比如，一座城市，我们可以从很高的分辨率（细粒度）上去观察它，于是我们看到许多细节，如道路、建筑物、车辆等。于是可以说，我们对该城市有了精确的定量知识，如哪一条道路有多长、多宽等。如果观察手段有限，信息不完全，我们只能从很低的分辨率（粗粒度）上去观察它，得到一些不精确的定性知识，比如只知道从甲地到乙地有道路相通，但并不知道道路具体有多长、有多宽、在哪里拐弯等。如果我们的任务是选择一条道路从甲地旅行到乙地，当我们同时具备精确（定量）与不精确（定性）知识时，我们可以采取从定性到定量的综合处理办法，即先从定性不精确知识中，粗略看一下，甲地到乙地究竟有没有道路，有几条，道路的大体走向如何等，并从中选择出一条来。然后再根据精确的定量知识，最后确定如何从甲地旅行到乙地。然而，机器处理问题的办法完全不同，它只能在精确的城市地图上一步步地搜索，考虑所有的细节。如果发现哪一条道路走不通，则需要另选一条重新开始，这就是机器解决问题效率不高的原因，因为它只能在单一精确的（细粒度）层次上解决问题。为使机器具备从定性到定量的综合处理能力，需要找出一种能做不同分辨率表示的方法。近十年来，我们研究了一种问题分层求解的商空间理论，它通过代数中的商空间理论，来表示不同层次的知识，并使不同分辨率表示之间的转换十分简单。理论分析表明，运用这种方法后，机器求解问题的效率会大大地提高。以上述的路径规划为例，城市的精确表示可以采用一般的几何方法（地图），对于不精确的定性表示，可采用拓扑的方法（如特征网），它只要表示哪些地区是连通的，即是否有路可通。于是我们的规划可分为两层：先是在拓扑空间中进行定性的规划，找出一条大致的通路。然后是几何空间中的定量规划，具体地找出一条几何通路。显然，采取这种多分辨率的求解方法，搜索工作量要降低很多。当然，其关键是要找到这两种表示的联系，正如我们所知，拓扑学中的同伦等价变换，可以把定性的拓扑空间与定量的几何空间联系起来。有了这种办法，精确与不精确处理的综合集成就有了可能。


    1977 年，在人工智能研究中，当 MIT 的 de Kleer 提出定性建模与定性分析的概念时，许多人对此表示出极大的兴趣，人们希望机器具有这种能力。de
    Kleer 采用的例子是实数空间，他把该空间做了最粗略的划分，分为（-，0，+）三个区域，他又把算术运算（加、减、乘、除）引到这三个量的运算中，得到一个最简单的定性处理模型。他利用这种模型去分析电子电路中的电压、电流变化，得出一些有意义的定性结果，引起人们对定性处理的广泛兴趣。由于定性知识信息量很少，单纯依靠定性处理，推理过程中会产生大量信息衰减现象，一般很难获得有意义的结果。1988
    年，S. S. Murt 做出了补充，提出了多分辨率定性推理的概念，使单纯定性推理摆脱了困境。他的基本思路是，所谓定性、定量对实数轴来讲只是代表了不同分辨率的划分，把实轴粗划分为三个区（-，0，+），我们得到的是定性描述，划分得细一点，就是定量。通过这种关系，我们可以把定性和定量分析结合起来。当信息不完全，知识有限时，我们只做定性处理，有了进一步的信息，则进入更细的空间做处理，相互补充，定性与定量结合，就可获得更好的结果。因此多分辨率表示和处理方法，是解决综合集成的一个重要方法。


    关于认知、模型与计算等之间的综合集成，我们称之为纵向学科集成。而人工智能、计算机与自动化等学科之间的集成，我们称为横向学科（信息科学内部）集成，两者统称为多学科（Multi-Discipline）集成。怎样才能实现学科之间的综合集成？各个学科有自己的研究重点，有自己的理论、概念和方法。如上所述，传统人工智能注重的是搜索，自动控制论侧重的是反馈，如何实现搜索与反馈技术之间的综合集成？这里关键的一步是，先要实现学科之间的交叉与渗透，反馈理论渗透到人工智能中去，引起传统
    AI 的变化，AI 的基本理论：搜索、规划、推理和学习等发生了变化。它们再也不能只是在完全信息假设下进行研究和发展了，而要考虑不完全信息，考虑资源限制，考虑具有信息反馈的动态环境。于是传统
    AI 被改造了。同样，AI 方法也向控制理论渗透，符号处理被引入传统控制理论，“反馈”受到规划和搜索的引导，因此传统控制理论发展成为新的智能控制理论。在这种条件下，我们就有可能创立一种新的综合集成的方法。


    ### 1.3.2.3 复杂智能系统


    复杂智能系统应由什么样的部件组成？我们知道，一般的智能系统，如专家系统，是由各个功能模块组成的，如推理模块、知识库模块和解释模块等。复杂智能系统是不是具有相同的结构，由各功能模块组成，还是只要数量更多、功能更复杂就行了？近年来，人工智能研究表明，要解决智能系统的规模扩大问题，单元模块的概念必须彻底更新，要从模块推广延伸为智能体，模块是被动的构造单元，它的功能是不变的，设计人员在设计过程中，系统或用户在运行过程中，可以根据需要随时调用所需的模块，达到复用的目的。模块化的概念在系统设计和运行中起到重要作用，它简化了系统的设计，提高了系统的性能。发展到复杂智能系统，被动的功能模块已经不够用了。比如，计算机互联网到
    1994 年 5 月为止，已经联结 31 000 个子网，200 万台计算机，超过 2 000 万人在上面工作。此外，每 10 分钟有一个新网联进来，信息每时每刻都在变化，为了有效地使用这种网络，通过用户或系统调用有关模块的工作方式已经不适用了，人们正在把智能体的概念引进来，使每个信息模块成为智能体，各自具有自主性、适应性和智能水平，能够根据用户的要求，主动提供优质的服务。整个网络成为一个多智能体的智能分布系统。最近智能体的概念备受重视，被各个领域反复使用，于是出现了像软件智能体（Software
    Agent）、自治智能体（Autonomous Agent），以及 Softbot (Software Robot) 等。因此我们不难理解为什么把社群（Society）和研讨会（Workshop）等作为智能系统可供选择的体系结构。


    ### 1.3.2.4 人工智能与控制论


    人工智能在它的发展初期和控制论有密切的关系，人们在提起 AI 的发展史时，通常并没有忘记控制论的贡献。可是到 20 世纪七八十年代，当符号推理机制在 AI
    中占主导地位后，启发式编程变成人工智能的同义语，计算机专家成为 AI 研究的主力，人们几乎把控制论忘了。近年来，人工智能走向了现场，又一次向控制论靠拢，于是控制界掀起一股智能化的热潮。建立智能控制这一新学科的任务在世界范围内酝酿着，但是应该怎样建立这样一个新学科？对控制界来讲，多数人并没有仔细考虑过，目前人们只是急于把各个新领域，如人工智能、神经网络、模糊逻辑中的新工具移植过来，以解决传统控制所遇到的困难。但人们开始认识到这种做法已经不够了，最近美、俄两国的控制论专家坐在一起共同探讨如何建立智能控制问题。他们回顾了人类科学史上三次科学思想方法的大转变：（1）最早的科学思想方法是亚里士多德建立的，他们崇尚知识，而科学的建立和发展需要依靠知识的扩充；（2）工业革命后，牛顿法则统治地位，人们追求简单的数学定律，也就是人们通常所谓的还原主义；（3）进入信息时代，概率统计起了主导作用。今天，当人们进入复杂的信息处理时代时，必须实现第四次科学思想方法上的转变。那么智能控制应采用什么方法呢？他们认为那将是一个多分辨率的知识表示时代，这个时代应该以符号学为特征。这种主张有一定道理，K.
    Godel 说过：“没有一个在特定分辨率层次上形成的知识系统，能够完全解释那个层次，必须具有一个高层元知识才能完全解释它。然而，当我们着手去构造这个更一般的元知

