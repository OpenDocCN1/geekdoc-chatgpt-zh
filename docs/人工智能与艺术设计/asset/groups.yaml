    听骨链由锤骨、砧骨及镫骨依次连接而成。锤骨柄附着于鼓膜，镫骨脚板和卵圆窗膜相接，砧骨居中，将锤骨和镫骨连接起来，使三块听小骨形成一个两壁之间呈固定角度的杠杆。锤骨柄为长臂，砧骨长突为短臂。该杠杆系统的特点是支点刚好在整个听骨链的重心上，因而在能量传递过程中惰性最小，效率最高。鼓膜振动时，如锤骨柄内移，则砧骨的长突和镫骨亦和锤骨柄作同方向的内移。中耳增压效应主要有以下两个成因：一是由于鼓膜面积和卵圆窗膜的面积大小有差别，鼓膜振动时，实际发生振动的面积约
