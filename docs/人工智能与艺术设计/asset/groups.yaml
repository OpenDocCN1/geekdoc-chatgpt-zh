    ### 6.1.1 运动神经系统


    神经系统是机体内起主导作用的系统。内、外环境的各种信息，由感受器接受后，通过周围神经传递到脑和脊髓的各级中枢进行整合，再经周围神经控制和调节机体各系统器官的活动，以维持机体与内、外界环境的相对平衡。


    神经系统由脑、脊髓以及附于脑脊髓的周围神经组织组成。神经系统是人体结构和功能最复杂的系统，由神经细胞组成，在体内起主导作用。


    神经系统分为中枢神经系统和周围神经系统。中枢神经系统包括脑和脊髓，周围神经系统包括脑神经、脊神经和内脏神经。神经系统控制和调节其他系统的活动，维持机体与外界环境的统一。


    中枢神经系统由脑和脊髓(脑和脊髓是各种反射弧的中枢部分)组成，是人体神经系统的最主体部分。中枢神经系统接受全身各处的传入信息，经它整合加工后成为协调的运动性传出，或者储存在中枢神经系统内成为学习、记忆的神经基础。人类的思维活动也是中枢神经系统的功能。


    神经系统在调节机体的活动中，对内、外环境的刺激所做出的适当反应，叫作反射。反射是神经系统的基本活动方式。


    反射弧是指执行反射活动的特定神经结构。从外周感受器接收信息，经传入神经，将信息传到神经中枢，再由传出神经将反应的信息返回到外周效应器。实质上是神经元之间的特殊联络结构。典型的模式一般由感受器、传入神经、神经中枢、传出神经和效应器五个部分组成，如图
