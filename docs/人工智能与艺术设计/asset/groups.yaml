    使得人可以像训练动物一样训练索尼的机器狗 AIBO,使之学会特定的行为序列。为了使机器人具备应付日常生活的能力,Dillmann 在一个厨房里布置了大量的传感器用于捕捉人开关冰箱、拿放碟子的信息,机器人则在获得这些信息后从中识别出人类示范者的动作和动作序列,从而学会类似的动作。这种示教式学习方法的关键技术就是如何有效地识别出示范者的动作或动作序列,为此
    Khadhouri 等人引入生物学上“视觉关注”的概念,对机器人如何分配有限的视觉传感器资源以获取完整的示范者的动作序列进行了研究。


    # 6.2.3 高仿机器人


    仿真人机器人就像真人,具有丰富的表情,这是仿人机器人研究一直追求的目标。目前,高仿真度仿真人机器人取得了一些突出成果,可以说话、变换表情,人机交流效果好,引起人们的关注。


    日本科学家今年推出一款以一名年轻女性为原型的仿真机器人。“她”能够模仿人类多种表情和动作,几乎以假乱真。这款机器人配备动作捕捉系统和 12 个气压传动装置,能够同步模仿人类行走、说话等动作。面部由橡胶制成,能够做出微笑、咧嘴笑和皱眉等表情。这款机器人(现阶段)在
    5～10 秒的时间让人难辨真伪,科学家们正在把这段时间延长至 10 分钟。


    日本产业技术综合研究所(AIST)今年还研制出一个会说话,可行走又具有丰富表情的新型“HRP-4C”机器人,“她”身穿一套银白和黑色相间的太空服。身高和体重同日本普通女性基本接近。“HRP-4C”全身共有
    30 个马达来控制肢体移动,可以做出喜、怒、哀、乐和惊讶的表情。此外,它还能够缓慢行走,眨眼睛和用女性嗓音说话。


    韩国科研人员今年已经将新研制的“机器人教师”投放到教学实践岗位。操控人员可以通过传声器和摄像机来遥控“机器人教师”,而机器人则通过语音识别系统来和学生们交流。这些“机器人教师”从来不会生气,也不会对学生大发脾气,学生们对他们“机器人教师”的工作普遍持拥护的态度。科研人员表示,实践证明,“机器人英语教师”有助于提高学生学习英语的兴趣并增强他们的自信。


    国内江苏大学计算机科学与通信工程学院在仿真人机器人方面进行了研究与探索,并取得初步成果,江大的机器人教师。其特点如下：


    +   (1) 与现有技术相比,江大机器人教师具有突出的技术特点和显著进步。内部结构完全按真人的骨架结构与尺寸和比例来设计;外表形状按真人外形设计;并在表情建立、行走控制理论等方面取得进展。


    +   (2) 控制方法:遥控仿真教学机器人应用了无线网络视频传输的技术特点,江大机器人教师能够将应用环境(课堂或监控等)的图像传输到任何具备网络条件的控制端,由后台控制(遥控)教学机器人的教学内容并回答学生的提问,所以适用范围广。


    +   (3) 遥控仿真教学机器人具有多功能(多用途)特点,可以广泛用于各种需要仿真人、机器人的场合,有明显的市场和经济效益。


    +   (4) 遥控仿真机器人还努力争取在机器人动力(电源)供给技术方面有所突破,正在试'
