    2035 年，人类的思维不可能，也不应该可以继续跟上人工智能机器的步伐了。


    # 8.4.3 人工智能的音乐创作


    一首由 AI 协助创作的歌曲“NOT EASY”登上了 iTunes 热门歌曲榜单第四，这首歌曲的创作，首先是由 AI 统计了近 5 年美国热门歌曲的共同点，以及歌曲在文化、传播等方面的数据，建立起一个“情感”，再根据这些情感，产生不同的音乐元素、片段，再由作者
    Alex 进行筛选或者加工后呈现出来。在音乐人工智能创作中，Sony 的 Flow Machine 系统通过大数据分析来创作 leadsheet。所谓的 leadsheet
    也被翻译为领谱，主要用来定义前几小节的旋律和全曲的和弦走势；Margareta Ackerman 的 ALYSIA 系统可以处理英文短句，并把文字与音符关联在一起。ALYSIA
    可以用这种方式写完一整首歌，或者为每一小节提供各种各样的选择，像是艺术家的一个共同创作者。一个名为 Amper 的人工智能系统作曲并监制了歌手 Taryn
    Southern 的新专辑 IAMAI 中的“Breaking Free”，被媒体称为第一张人工智能作曲和制作的专辑。


    用人工智能为音乐创作降维的盒声音乐成立了，创业思路来自创始人个人经历与普遍的行业痛点。创始人施佳阳早年通过作曲软件 DGW(Digital Audio Workstation)接触到音乐创作，并由此进入了音乐行业，这让他意识到技术对于音乐者爱好者的帮助，但这些音乐制作软件存在诸多问题，比如操作性差，产品更新慢，反馈不够精确。


    音乐创造者普遍的问题在于寻找灵感的方式有限。他们需要花时间营造适合创造的音乐氛围，这个过程会给自身很大的压力。而做完一段音乐后，创作者往往没办法利用以前的经验来获得灵感。


    “盒声音乐做的是一个降维的工作，也就是降低肌肉记忆的最低标准。”艺术需要肌肉记忆，比如音乐家需要手指的肌肉记忆，通过钢琴完成伴奏，从而完成唱歌的过程，这一个寻找灵感的过程有时候显得过长。


    盒声音乐可以缩减这个过程，创作者可以通过输入标签，输入歌词，上传图片等方式生成音乐小样，获得音乐反馈帮助自己获得灵感完成创作。盒声音乐系统还可以解析音乐，对创造者的风格做一个猜想，通过机器学习已完成的作品方法来帮助创作者形成个人风格。


    盒声音乐目前十分钟能创作一首短音乐，对比而言音乐人平均一两天才能创作一首，施佳阳未来计划缩短到两分钟创作一首短音乐，“音乐本身时间越长，人工智能的优势越大”。


    盒声音乐对应着两个方面的目标：降低音乐爱好者进行创作的门槛，帮助音乐人更好地获得灵感并形成风格。


    盒声音乐的创作团队是音乐产业内科技爱好者与 IT 产业内音乐爱好者的集合，这个团队很早就在做音乐科技的探索，并最终将突破口放在人工智能上。


    盒声音乐的算法分两块，一种是谷歌的开源算法，对数据进行无监督的机器学习。此外盒声还有一套自主研发的智能作曲系统“YAME”，这套系统与国外普遍的“暴力算法”相区'
