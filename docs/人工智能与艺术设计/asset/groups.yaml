    型机器鱼。仿生机器人的研究正朝着特种化、微型化、多形态化的方向不断发展，但由于仿生学科本身还没有对这些动物的特异功能的产生机理精确仿生，所以将这些特异功能应用于机器人还需要相当长的一段时间，相信在不远的将来，在人体医学、生物学和仿生学发展到一定的程度以后，真正伤人的机器人，而且还有许多人类所不具备功能的伤人机器人将会出现。


    # 6.2.2 行为的深度学习


    尽管对除人之外的生物是否具有智能、意识、情感、想象力等命题有着广泛而激烈的争议，但一个显而易见的事实是，要研制出更高智能，甚至媲美人类智能的机器人，就需要不断从生物学中汲取有用的思想、理论、方法。目前受生物启发的行为选择方法主要有人工情感、注意、认知等。


    随着技术的发展，人们希望机器人具有类似于人的情感，而不是冷冰冰的一堆机器，因此人工情感也就成为当前机器人研究的一个热门课题，受到了越来越多研究者的关注。将人工情感应用于机器人，提出了一种名为情感化行为选择的机制，并应用于工作在办公室环境下的机器人中。机器人有三种行为：寻找、探索和玩，以及七种情感状态：厌烦、坚持、挫败感、不安、好奇、好玩和兴趣。七种情感对每种行为起着或激励或抑制的作用，激励值最大的行为将被机器人执行。除此之外，将情感模型用于虚拟人的行为选择，也取得了不错的效果。


    人能够在嘈杂的环境中相互交谈，即只关心来自谈话对象的声音，而不会受到周围噪声的干扰，这就是注意的选择性机制。这一机制受到神经生理学家长期的关注，建立了不少相应的模型，近年来在机器人中也得到了不少成功的应用。Garforth
    对人的执行注意进行了建模，用于控制反应方式和有意识行为的选择，并成功应用于仿真机器人。 Dalgagarrondo 利用生物视觉上注意管理器的概念设计了对应的控制体系结构，并用于装备有摄像机的机器人，在该结构中，注意管理器除了负责感知进程的时间和运算资源的分配外，还负责根据环境的动态变化，评估机器人面临的危险或机遇，从而决定是否要改变当前行为。


    认知机器人是当前机器人研究前沿的一个重要方向，认知理论在机器人行为选择研究中也有着成功的应用。张惠娣结合认知模型和情感模型，设计了移动机器人导航控制系统，该系统通过基于认知和情感的学习与决策系统对行为进行评估，增加合适行为的权重，降低不合适行为的权重，从而形成一种有效的行为选择机制。


    行为序列尚没有严格的定义，机器人只要在空间内运动一段时间，其一举一动被记录下来似乎都可称为行为序列。机器人可以通过学习，使得学习后按照一定的次序执行预先设计的行为以形成一连串有意义的连续动作。


    人机交互是机器人学习行为序列的一个重要途径。Gorostiza 设计了一种人机交互系统，基于序列功能图的序列表示语言，人能通过语音对机器人的行为序列进行编辑、执行和调试，通过不断地在行为序列中加入基本的动作，使得机器人能学习比较复杂的动作或技巧。Kaplan
    等人应用 skinner 操作条件反射理论，设计了一种教会机器人复杂动作的模型，'
  md: '

    内啡肽，是一种内生性（脑下垂体分泌）的类吗啡生物化学合成物激素。它是由脑下垂体和脊椎动物的下丘脑所分泌的氨基化合物（肽）。它能止痛和使人产生欣快感。容易在体育运动中分泌，它可以改变一个人所有的负面情绪，让你充满活力、改变对自我的认知、变得积极向上，甚至可以改变你的外表、影响周围的人和环境。


    跑步者的愉悦感是指当运动量超过某一阶段时，体内便会分泌内啡肽。长时间、连续性的、中量至重量级的运动，深呼吸也是分泌脑内啡肽的条件。这也是跑步能够改变人的精神状态的原因，使人感到“更加幸福”。


    跑步能够提高人的毅力又是怎么回事呢？


    多巴胺系统功能包括奖赏、动机。多巴胺系统使人产生欲望进而产生行动，所以多巴胺是人大多数行为的内在原因。而这，也包括我们大多数的“欲望”行为。比如：很多人对美食的忍耐力很低，为什么？因为美食的多巴胺水平是
    150%，比一般行为的多巴胺水平高出了 50%，所以很多人难以忍受美食的诱惑。同样，对于尼古丁的多巴胺刺激水平则是 170%，所以很多人对香烟上瘾、难以戒除。


    为什么运动能提高人的毅力？既然已经知道欲望的产生来源于多巴胺，那么怎么才能解决呢？


    其实能够诱导多巴胺产生的行为不仅仅只有美食、香烟等，还包括运动。在对小鼠的实验中发现：“不同运动强度时，大鼠伏隔核多巴胺会发生变化，步行和跑步时伏隔核细胞外液中二羟苯乙酸（DOPAC）和高香草酸（HVA）含量均显著增高，提示运动时伏隔核的多巴胺释放增加，并且跑步组的
    DOPAC 含量较步行组显著增加，多巴胺也表现为增高趋势，说明运动时伏隔核的多巴胺释放程度与运动强度有关”。还有，“运动训练可以导致脑中多巴胺含量的变化，这可能与运动的强度有一定关联。”


    在长期的运动中，人体的多巴胺水平会不断提高，而内啡肽则用于满足多巴胺的“欲望”。所以不断的运动造成的多巴胺水平的提高，也可能会提高人体对于多巴胺的耐受水平。


    情绪对内分泌系统有何影响？


    当人在激动、愤怒时，在大脑皮层调控下便产生交感兴奋效应，同时肾上腺髓质在交感神经系统支配下，大量释放儿茶酚胺类激素，以上概括称“交感—肾上腺髓质”系统。该系统活动的结果，加强了循环呼吸活动，增加骨骼肌的血液供给，同时抑制消化运动和分泌。


    下丘脑神经元分泌神经激素“促肾上腺皮质激素释放激素（CRH）”，经垂体门脉达腺垂体，促进腺垂体分泌“促肾上腺皮质激素（ACTH）”。该激素经血运达肾上腺皮质，促进其分泌皮质激素，皮质激素促进糖、蛋白及脂肪的动员，同时加强了机体对有害刺激的抵抗力。


    交感兴奋可直接促进甲状腺分泌和抑制胰岛的分泌，因而血糖升高，全身代谢活动加强。甲状腺素增多反过来又进一步增强了脑的兴奋，属反馈效应。


    ## 6.2 人体行为的仿真


    随着工业社会的发展，越来越多的人从事着机械性的工作，枯燥的工作使得人们渴望从机械性的劳动中解脱出来。1959 年，美国英格伯格和德沃尔制造出世界上第一个工业机器人，机器人开始替代人们进行单调的机械工作，至此机器人的历史才真正开始。


    机器人已经被应用到军工、医疗、服务等行业。机器人已经深入人们生活的方方面面，越来越多的学者开始热衷于机器人控制的研究，模拟人成为机器人发展的一个必不可少的重要环节。目前机器人大多用在工业领域，其控制方法多为预先设定机械的各类规定动作。机械的运动轨迹基本采用轨迹插补法进行规划，然而这些方法用到的数据量过于庞大，且编程较为复杂，工作效率比较低。以上这些方法已经无法满足人们对当代机械的控制需要。


    随着工作环境越来越复杂，人们对机械臂动作的多样性和行为的灵活性提出了更高的要求。


    模仿学习的出现使得机械的抓取行为满足了人们的需求。模仿是人类以及其他动物获得动作技巧的有效学习方法，机械可以通过模仿学习到示教者的动作技巧，此便能更好地解决机械臂动作单一、死板的问题。模仿学习的基本步骤有
    3 步：行为获取、行为表征和行为再现。


    ### 6.2.1 仿真机器人的研制


    仿真机器人是研究人类智能的高级平台，仿真机器人是具有感知、思维和行动功能的机器，是机构学、自动控制、计算机、人工智能、光电技术、传感技术、通信技术、仿真技术等多种学科和技术的综合应用。仿真机器人作为新一代生产和服务工具，在制造领域和非制造领域占有更广泛、更重要的位置，这对人类开辟新的产业，提高生产与生活水平具有十分现实的意义，代表着一个国家的高科技发展水平，是目前科技发展最活跃的领域之一。


    仿人机器人需要具备模仿人类的某些行为及技能的能力，双脚直立行走观察外界事物、自主判断与决策、情感交互控制等，从简单的非条件反射到高级智能行为均属于其研究范畴。仿人机器人的研制始于
    20 世纪 70 年代末，在短短三十多年的发展历史中，仿人机器人的研究工作进展迅速。美国卡内基梅隆大学计算机科学学院的人机交互研究、日本早稻田大学的仿人机器人研究、美国麻省理工学院的社交机器人研究先后针对仿人机器人的人机与合作技术展开研究。为了给人工心理和人工情感领域的专家学者在该领域提供更好的交流平台，从近年开始，情感计算会议、机器人人机交互会议、欧盟第七框架计划等逐步展开。此外，众多国际高端学术会议也为人机交互与合作开设了专题，如：International
    Conference on Human-Computer Interaction, International Conference on Autonomous
    Agents, International Conference on Affective Human Factors, International Conference
    on Artifical Intlligence 等。在此推动下，国内外涌现出大量有价值的研究成果。


    1992 年，日本早稻田大学理工部的高西淳夫研究室开始研究仿人头形机器人，1996 年开发出第一代系列 WE 仿人头部机器人 WE-1，通过不断改进，如今研制出
    4 个版本的 WE 系列仿人头部机器人。该仿人机器人以多种传感器作为感觉器官。眼部通过安装彩色 CCD 摄像头采集视觉轮廓与色彩信息；耳部装有微型麦克风用于接收声音信息；机器人的面颊、前额和头部两侧分别安装了
    FSRs 作为触觉器官，从而实现推、打、抚摸等不同的触觉行为的识别；机器人预制了热敏电阻传感器来实现温度信息的采集，从而达到感受环境温度的目的；此外，机器人采用
    4 个半导体气体传感器作为嗅觉器官，可识别酒精、氨水和香烟的气味。如此之多的传感器设置使得仿人机器人 WE-4 成为目前感觉器官最为齐全的机器人。


    1999 年，美国麻省理工学院人工智能实验室的计算机专家 Cynthia Breazeal 从人类婴儿与看护者之间的交流方式中得到启发，开发出的婴儿机器人
    Kismet 由机器人头部与计算机构成，面部机构共有 6 个自由度，分布在眉毛、耳朵、眼球、眼睑、嘴唇等部位，眼睛由焦距 5.6 mm 的彩色 CCD 摄像机组成，耳朵上装有微型麦克，从而使机器人具有视觉和听觉。Kismet
    可以模仿父母与孩子之间的情感互动，表达婴儿的需求与愿望并可通过机器学习的方式进行智能发育，具有与人类婴儿相似的行为方式和能力。


    2002 年，东京理科大学小林研究室研制出仿人机器人 SAYA，它能够扫描注视者的表情，从而完成对眼、口、鼻、眉距离的测量，并与记忆库中自然表情的面孔进行对照，以此识别出该表情所表达的情绪状态，然后通过对人工肌肉的控制实现
    18 个面部关键点的运动调节，逼真地展示出 SAYA“内心”中相应的喜悦、生气、惊讶等情绪状态。此研究不仅可以识别出交互者的表情，还可以通过机器学习不断改善机器人的情绪表达能力，从而自适应地改善人与机器人的交互关系。


    2005 年，意大利比萨大学研制出表情机器人 FACE，并将其应用于自闭症辅助治疗等领域。FACE 以真人为雏形，类人相似度极高，能够实现恐惧、惊讶、厌恶等多种面部表情。该研究小组历时
    30 多年，研发出能够让机器人模拟人类的表情的软件 HEFES，该软件不仅自主直接控制电机完成基本表情输出，还可以在一定程度上混合不同表情，实现人类复杂表情的输出，如喜忧参半等情绪状态也可表现得淋漓尽致。


    2006 年，德国帕德博恩大学 (University of Paderborn) 计算机科学系机器人实验室开发出仿人机器头 ROMAN。ROMAN 的表情通过
    10 个伺服电机拉动线缆来实现，因此其五官设计紧凑且重量很轻，只能在有限的空间内运动。该机器头充分考虑到人类颈部的几何、运动学和动态特性，其颈部具有 4 个自由度，使其可以实现绕垂直轴旋转、绕水平轴向一侧面倾斜、向前后倾斜、沿头部间距轴旋转的动作。此外该机器头系统集成了摄像头、麦克风、红外传感器和惯性系统等感知设备，以此实现特定环境下的人机交互与合作。


    2008 年，麻省理工学院的个人机器人小组和斯坦温斯顿工作室联合发明了集艺术、科学和发明于一体的社交智能机器人莱昂纳多·达芬奇。该机器人的特点在于内置有情感移情系统，从而使得机器人具备检测交互者目标和意向的能力。此外，该机器人具有完整的评估和模仿可察觉面部表情的功能。在与人交流的过程中，莱昂纳多·达芬奇可以学习特定的面部表情并通过特定传感器评估人类声音性质，并将其与相关的反应联系在一起，从而实现对交互者表情及声音的情感联系判断与情感反馈。


    同年 4 月，美国麻省理工学院的科学家们向人们展示了他们开发的情感机器人 Nexi。Nexi 在 uBot5 的基础上发展而来，是一款可移动的灵巧型仿人社交机器人。机器人双眼均装有
    CCD 摄像机，可实现双目视觉系统感知；前额装有主动式 3D 红外摄像头，在移动中通过实时图像信息采集可生成环境的三维立体地图；机器人身体搭载有四个麦克组以支持声学定位功能，从而实现在交互过程中对交互者进行准确的位置判断；此外，Nexi
    具备眨眼、张嘴、皱眉等形式的面部表达能力，以此完成常见情感状态的输出。


    同年，英国西英格兰大学和布里斯托尔大学联合研制出类人机器人 Jule，它的面部采用软性橡胶作为皮肤，内置 34 个马达，以此实现如高兴、悲伤、忧虑等 10
    种人类面部表情的模仿。此外，Jule 还可以依据语音的变换自主调节嘴唇动作，从而实时地实现情绪、语音到表情的映射与表现。


    2009 年，美国汉森机器人公司研发的机器人 Albert HUBO 正式亮相。面部采用类似肉体皮肤材料，使机器人完成表情动作的过程中可产生类人的皮肤纹理变化，内置
    31 个自由度，可实现颈部 3 个自由度及表情 28 个自由度的联合控制，以此实现多种面部表情的模拟与交互。此外，该机器人还具备年龄、性别等推断与情绪互动决策的智能功能，可针对不同年龄群的交互者做出个性化的表情回应。


    2010 年，日本大阪大学石黑浩教授和 Kokoro 公司工程师研制出仿真机器人 Geminoid F，该机器人以一名年轻的日俄混血女性为模本，皮肤材料采用柔软质地的硅树脂，运动部分由
    15 个电机和传感器组成，其机构特点在于内置储气罐和电磁阀，外置空气压缩机，可通过远程遥控实现微笑、皱眉、眨眼、悲伤、叹息等 60 多种不同的面部表情。丰富逼真的面部表情使其能够与演员同台表演话剧，具有良好的娱乐性，但是遗憾的是
    Geminoid F 的表情须由研发人员远程遥控操作，并不具备自身情感能力及自主控制能力。


    2011 年，日本大阪大学研制出一款仿人儿童机器人 Affetto。Affetto 的设计着眼于拓展认知发展机器人技术，其研究目的在于帮助科学家研究人类婴儿时期的社交意识形成与发育过程，因此，该机器人可模拟
    1～3 岁的儿童的面部表情，可以通过自主学习与发育实现智力发育，并通过与人类的表情交互得以体现，弥补了 Kismet 缺乏人类儿童外观及表情的缺憾。


    由此可见，近年来，随着技术的不断进步，仿人机器人交互与合作的研究逐渐升温。国外表情机器人的研究已不只局限于皮肤材料的制作、机械结构的设计以及多传感器的信息融合，而是向着具有表情表达、心理模型、发育机制、学习及认知能力的智能人机交互方向努力发展。其中，美国媒体实验室的研究多关注机器人的社会交互性，日本早稻田大学的研究则关注交互的拟人性、情绪性，从系统结构、传感器、机械结构及主要特征四个方面，针对其中具有代表性的七种表情机器人进行了总结与对比分析。


    我国的机器人研究开始相对较晚。先后经历了 20 世纪 70 年代的萌芽期，80 年代的开发期和 90 年代的适用化期。经过多年的发展，我国的机器人研究在一些方面已经达到了世界先进水平，但还存在着一些问题。一方面，在产业化上与国际水平有着一定的差距；另一方面，我国机器人研究多是借鉴国外先进技术，进行二次开发，自身技术创新较少。哈尔滨工业大学致力于服务机器人的研究工作，先后完成高楼壁面清洗爬壁机器人和玻璃幕墙壁面清洗爬壁机器人的研制。哈尔滨工业大学还与香港中文大学联合开发一种全方位移动清扫机器人。目前我国机器人主要朝着仿人仿生方向发展，已经取得了一定的成绩，但创新不足仍是主要问题。


    我国对仿人机器人领域的研究始于 20 世纪 90 年代，大部分研究工作是针对人工情感理论与技术来实现的。在大力发展仿人机器人研究的大趋势下，国内积极举办相关会议以更好地促进学科的交流与发展。由北京科技大学，中国人工智能学会主办的中日感性工学与人工生命学术会议，专门对感性工学及人工生命等问题进行两国双边研讨。中国科学院自动化研究所中国自动化学会、中国计算机学会、中国图像图形学学会、中国中文信息学会、国家自然科学基金委员会和国家“863”计划计算机软硬件技术主题专家组作为主办单位决定在北京举办首届国际情感计算及智能交互学术会议。


    1996 年，我国工程院院士蔡鹤泉教授成功研制出具有演讲技能的仿人演讲机器人，该机器人可实现眼球运动、讲话带动面部肌肉运动等功能。2004 年，哈尔滨工业大学机器人研究室研制出具有平静、严肃、高兴、微笑、悲伤、吃惊、恐惧、生气
    8 种基本面部表情的仿人机器人 H&FROBOT-I，该机器人头部具有 8 个自由度，可实现头部及五官的基本运动控制。同年，中国科学院自动化研究所研制出机器人“童童”，该机器人具有卡通外形，内置十多部微型伺服电机，五官可完成多种不同程度、不同速率的变化动作；颈部安装两部伺服电机可带动头部运动，以辅助和加强情绪的表现力，此外，针对特定情景，“童童”可实现诸如微笑、大笑、生气、愤怒、惊讶、思考、遗憾、得意扬扬、无精打采等百余种不同的表情变化，还可以语音识别、肢体运动等功能。2005
    年，哈尔滨工业大学研制出首台带有类人面部表情的“百智星”幼教机器人，该机器人集系统控制技术、机器人结构学研究、智能仿生技术、网络通信及扩展技术、语音合成技术于一身，能够根据其所讲述的内容配以相应的面部表情、口型及肢体动作。2007
    年，北京科技大学设计出情感机器人头，其具备 14 个自由度，可实现眼睛、眼睑、嘴巴、眉毛、颈部等多部位运动，以辅助情绪模型实现表情行为的输出。2008 年，上海大学研制出具有恐惧、高兴、愤怒、惊喜、厌恶、悲伤
    6 种基本面部表情的机器人 SHFR-I 样机，并在此基础上进行改进，实现了具有视觉和面部表情识别与合成及表情再现功能的机器人系统。2010 年，台湾大学研制出拟真脸部模拟机器人
    Luo Head，其头部具有 36 个自由度，可实现眉毛、嘴巴和眼睛的动作控制，其外形及表情模仿能力优异。2011 年，西安超人高仿真机器人科技有限公司研制出具有高仿真智能表演能力的机器人“李咏
    2”，该机器人共有 19 个自由度，可实现多达 255 种情绪表情的输出。


    由于人体医学和生物学发展速度的限制，目前医学界和生物学界对人体和其他一些动物的工作机理了解得还不是十分透彻，如精确的人体运动学和动力学，人体大脑的工作机理，神经系统的相互作用机制，情绪与脑的关系等。从广义上来看，仿人机器人不仅用在对于人类的模仿上，还可以拓展到对其他生物行为的模仿中去，如针对蝙蝠的听觉、狗的嗅觉、苍蝇的接近觉和蜻蜓的视觉等生物机能的模仿。美国凯斯西储大学与美国海军研究院联合设计出一款多地形自适应性螳螂两栖机器人
    Whegs IV，其腿部采用简化的柔性结构设计，陆地运动灵活，可自动越过障碍，具有良好的系统稳定性，而水中运动依靠传统螺旋状设计，可上浮下潜；麦吉尔大学等在
    RHex 系列陆地机器人的基础上研制出两栖机器人 AQUA，美国加州大学伯克利分校研制出单眼可飞行的仿苍蝇机器人，用于研究获得苍蝇杰出的飞行能力；我国哈尔滨工业大学及北京航空航天大学先后研制出两栖仿生蟹和
    SPC-II 型机器鱼。仿生机器人的研究正朝着特种化、微型化、多形态化的方向不断发展，但由于仿生学科本身还没有对这些动物的特异功能的产生机理精确仿生，所以将这些特异功能应用于机器人还需要相当长的一段时间，相信在不远的将来，在人体医学、生物学和仿生学发展到一定的程度以后，真正伤人的机器人，而且还有许多人类所不具备功能的伤人机器人将会出现。


    ### 6.2.2 行为的深度学习


    尽管对除人之外的生物是否具有智能、意识、情感、想象力等命题有着广泛而激烈的争议，但一个显而易见的事实是，要研制出更高智能，甚至媲美人类智能的机器人，就需要不断从生物学中汲取有用的思想、理论、方法。目前受生物启发的行为选择方法主要有人工情感、注意、认知等。


    随着技术的发展，人们希望机器人具有类似于人的情感，而不是冷冰冰的一堆机器，因此人工情感也就成为当前机器人研究的一个热门课题，受到了越来越多研究者的关注。将人工情感应用于机器人，提出了一种名为情感化行为选择的机制，并应用于工作在办公室环境下的机器人中。机器人有三种行为：寻找、探索和玩，以及七种情感状态：厌烦、坚持、挫败感、不安、好奇、好玩和兴趣。七种情感对每种行为起着或激励或抑制的作用，激励值最大的行为将被机器人执行。除此之外，将情感模型用于虚拟人的行为选择，也取得了不错的效果。


    人能够在嘈杂的环境中相互交谈，即只关心来自谈话对象的声音，而不会受到周围噪声的干扰，这就是注意的选择性机制。这一机制受到神经生理学家长期的关注，建立了不少相应的模型，近年来在机器人中也得到了不少成功的应用。Garforth
    对人的执行注意进行了建模，用于控制反应方式和有意识行为的选择，并成功应用于仿真机器人。Dalgagarrondo 利用生物视觉上注意管理器的概念设计了对应的控制体系结构，并用于装备有摄像机的机器人，在该结构中，注意管理器除了负责感知进程的时间和运算资源的分配外，还负责根据环境的动态变化，评估机器人面临的危险或机遇，从而决定是否要改变当前行为。


    认知机器人是当前机器人研究前沿的一个重要方向，认知理论在机器人行为选择研究中也有着成功的应用。张惠娣结合认知模型和情感模型，设计了移动机器人导航控制系统，该系统通过基于认知和情感的学习与决策系统对行为进行评估，增加合适行为的权重，降低不合适行为的权重，从而形成一种有效的行为选择机制。


    行为序列尚没有严格的定义，机器人只要在空间内运动一段时间，其一举一动被记录下来似乎都可称为行为序列。机器人可以通过学习，使得学习后按照一定的次序执行预先设计的行为以形成一连串有意义的连续动作。


