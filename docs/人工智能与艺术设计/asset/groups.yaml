    似，人工神经元之间通过有权重的连接，将信号从一个神经元传递到另一个神经元。神经元接收来自输入连接的信号，计算激活水平并将其作为输出信号通过输出连接进行传送。输入信号可以是原始数据或其他神经元的输出。输出信号可以是问题的最终解决方案，也可以是其他神经元的输入信号。人工神经元就是对生物神经元的抽象与模拟。如果我们想要构造一个人工神经网络，首要问题就是构造人工神经元。现如今经常使用的神经元模型是心理学家麦卡洛克（Warren
    McCulloch）和数理逻辑学家皮茨（Walter Pitts）在 1943 年提出的神经元模型，简称 M-P 模型。该模型从逻辑功能器件的角度来描述神经元，为神经网络的理论研究开辟了道路。M-P
    模型是对生物神经元信息处理模式的数学简化，后续的神经网络研究工作都是以它为基础的。如图 5-1 是 M-P 神经元模型结构图。从图 5-1 可以看出，神经元的输出：


    ```

    y = f(\sum_{i=1}^n \omega_i x_i - \theta)

    ```


    式中，\(\theta\) 为神经元的激活阈值；函数 \(f(\bullet)\) 也被称为激活函数；\(\omega\) 是权值。


    如图 5-1 所示。函数 \(f(\bullet)\) 可以用一个阶跃方程表示，大于阈值激活，否则就抑制。但是阶跃函数不光滑、不连续、不可导，因此我们更常用的方法是用
    sigmoid 函数来表示函数 \(f(\bullet)\)。 sigmoid 函数的表达式为 \(f(x) = \frac{1}{1+e^{-x}}\)，其分布图如图
    5-2 所示。


    ![](img/f188b68deb37acb6105ba97c814d9af2_116_0.png)


    前面提到，人工神经网络有自适应、自学习的特点，在我们确定了神经元后只是确定了神经网络的结构，接下来就需要进行学习（也称训练）。神经网络不是通过改变处理单元的本身来完成训练和学习过程的，而是依靠改变网络中各神经元节点的连接权重来完成的。因此若处理单元要学会正确的处理所给定的问题，唯一用以改变处理单元性能的元素就是连接权重。


    人工神经网络的学习方法由学习方式和学习规则确定。学习方式主要分为有监督和无监督两种。神经网络的主要学习规则有误差纠正学习、Hebb 学习和竞争学习。在这里主要详细介绍
    Hebb 学习规则。


    1949 年，在《行为的组织》一书中，心理学家 Hebb 对神经元之间连接强度的变化规则进行了分析，并基于此提出了著名的 Hebb 学习规则。受启发于巴甫洛夫的条件反射实验，Hebb
    认为如果两个神经元在同一时刻被激发，则它们之间的联系应该被强化，基于此定义的 Hebb 学习规则如下式所示：


    ```

    \omega_{ij} (t + 1) = \omega_{ij} (t) + \alpha y_j (t) y_i (t)

    ```


    其中，\(\omega_{ij}(t+1)\) 和 \(\omega_{ij}(t)\) 分别表示在 \(t+1\) 和 \(t\) 时刻时，神经元 \(j\)
    到神经元 \(i\) 之间的连接强度，而 \(y_i\) 和 \(y_j\) 则为神经元 \(i\) 和 \(j\) 的输出。Hebb 规则隶属于无监督学习算法的范畴，其主要思想是根据两个神经元的激发状态来调整其连接关系，以实现对简单神经活动的模拟。


    ## 5.2.2 人工神经网络的分类


    神经网络按照不同的结构、功能以及学习算法对网络进行分类，可以分为以下两种。（1）感知器神经网络：最简单的神经网络类型，只有单层的神经网络结构，采用硬限值作为网络传递函数，主要适用于简单的线性二类划分问题，处理此类问题的效率较高。（2）线性神经网络：单层结构的神经网络，采用线性函数作为网络的传递，主要也是用于解决线性逼近问题。


    - 感知器神经网络：最简单的神经网络类型，只有单层的神经网络结构，采用硬限值作为网络传递函数，主要适用于简单的线性二类划分问题，处理此类问题的效率较高。

    - 线性神经网络：单层结构的神经网络，采用线性函数作为网络的传递，主要也是用于解决线性逼近问题。


    前面提到神经元是神经网络中最基本的处理单元，要想建立一个神经网络首先要确定用到多少神经元以及如何连接神经元。网络模型是神经网络研究的一个重要方法，针对不同的问题会有不同的网络模型。我们根据网络的结构可以将网络分为以下几类。


    ### 5.2.2.1 前馈网络


    前馈神经网络具有阶梯分层结构，属于典型的层次型人工神经网络。前馈网络从输入层至输出层的信号通过单向连接流通；神经元从一层连接至下一层，不存在同层神经元间的连接。前馈网络只有前后相邻两层之间神经元相互单向连接，且各神经元间没有反馈。每一个神经元可以从前一层接收多个输入，但只有一个输出送到下一层的各神经元。


    ### 5.2.2.2 反馈网络


    在反馈网络中，多个神经元互联以组织一个互联神经网络。反馈网络中有些神经元的输出被反馈至同层或前层神经元，即每一个神经元同时接收外部输入和反馈输入，其中包括神经元本身的自环反馈。因此，反馈网络的信号能够从正向和反向流通。反馈网络又称为递归网络。


    ### 5.2.2.3 网状网络


    网状网络的特点是，构成网络的神经元都可能双向连接，所有的神经元既可以作为输入也可以作为输出。在这种网络中，若在其外部施加一个输入，各神经元一边相互作用，一边进行信息处理，直到使所有神经元的活性度或输出值收敛于某个平均值为止，作为信息处理的结束。


    ### 5.2.2.4 混合型网络


    混合型网络的结构是介于前向网络和网状网络这两种网络之间的一种连接方式。它在前向网络的基础上，将同一层的神经元进行互联。其目的是为了限制同层内神经元同时兴奋或抑制的神经元数目，以完成特定的功能。


    人工神经网络发展至今，已经产生出很多种神经网络模型，表 5-2 列出了在人工神经网络发展史上一些有重要影响的网络。


