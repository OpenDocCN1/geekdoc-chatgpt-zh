    # 2. 嗅觉的生理功能


    嗅觉是一种感觉。它由两个感觉系统参与，即嗅神经系统和鼻三叉神经系统。嗅觉和味觉会整合和互相作用。嗅觉是外激素通信实现的前提。嗅觉是一种远感，即是说它是通过长距离感受化学刺激的感觉。相比之下，味觉是一种近感觉。


    最近一系列的研究发现，人类也有异常灵敏的嗅觉，并且在不知不觉中对我们的生活产生很大的影响。细微的气味能在不为我们察觉的情况下影响心情、行为以及决定。自己身上散发出的气味则能表现自己恐惧或悲伤等的情绪。问题是为何我们对嗅觉的作用毫无察觉呢？相比于看起来似乎更加重要的视觉和听觉，嗅觉从来就不是人类感觉研究的首选对象，直到最近，嗅觉才获得足够的重视。纽约州立大学石溪分校从事神经生物学研究的帕罗迪(Lilianne
