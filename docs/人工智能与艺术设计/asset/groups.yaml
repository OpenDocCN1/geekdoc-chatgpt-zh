    Paul Broca)。他通过比较不同动物大脑中控制嗅觉的部分占整个大脑的比例，将哺乳类动物分为两类：一类是嗅觉发达型，例如狗，它们能通过灵敏的嗅觉感知外部世界；第二类是嗅觉不发达型，例如人类、其他灵长类动物及海生哺乳动物，这些动物的嗅觉组织在大小和功能上都相形见绌。最近的遗传学研究似乎也证实了布罗卡的观点，研究发现，大多数哺乳类动物的基因中存在能产生
    1 000 多种不同气味感受器的编码。其中大多数编码在人类的基因中并不存在。人类的基因只能编码产生 400 多种气味感受器。


    但更多的研究发现人们之前可能存在误解。最近科学家们通过大脑扫描发现，人类大脑中感知嗅觉的部分实际上多于布罗卡在 100 多年前通过解剖得出的区域。耶鲁大学的格里尔(Charles
