    伪语言：包括程序设计语言的三大基本结构及自然语言的一种语言；


    类语言：类似高级语言的语言，例如，类 PASCAL、类 C 语言。


    算法的描述方式主要有自然语言，流程图，伪代码等，它们的优势和不足可以简单地归

    纳如下：


    +   1. 自然语言

    +   优势：自然语言描述的算法通俗易懂，不用专门的训练。

    +   不足：（1）由于自然语言的歧义性，容易导致算法执行的不确定性；（2）自然语言的语

    +   句一般较长，导致描述的算法太长；（3）当一个算法中循环和分歧较多时就很难清晰地表示

    +   出来；（4）自然语言表示的算法不便翻译成计算机程序设计语言。


    +   2. 流程图

    +   优势：流程图描述的算法清晰简洁，容易表达选择结构，它不依赖于任何具体的计算机

    +   和计算机程序设计语言，从而有利于不同环境的程序设计。

    +   不足：不易书写，修改起来比较费事，须借助于专用的流程图制作软件来提升绘制和修改。


    +   3. 伪代码

    +   优势：伪代码回避了程序设计语言的严格、烦琐的书写格式，书写方便，同时具备格式

    +   紧凑、易于理解、便于向计算机程序设计语言过渡的优点。

    +   不足：由于伪代码的种类繁多，语句不容易规范，有时会产生误读。

    +   目前，许多“数据结构”教材采用类 PASCAL 语言、类 C++ 或类 C 语言作为算法描述

    +   语言。'
