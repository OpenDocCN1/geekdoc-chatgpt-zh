    # Excel VBA编辑器基本操作与ChatGPT辅助编程


    在Excel中，VBA编辑器可用于创建自定义函数、自动化数据输入、生成报告以及执行Excel内置的函数和功能难以实现的复杂数据分析任务。本节主要介绍在Excel中VBA编辑器的基本操作方法。


    ## 5.1 VBA编辑器的基本操作方法


    ### 063 添加“开发工具”选项卡


    ![](OEBPS/Images/image_445.jpg)


    扫码观看教学视频


    在Excel工作表中，“开发工具”选项卡在初始启动Excel软件时，通常情况下处于隐藏状态，用户要想在Excel中使用VBA编辑器，首先需要将“开发工具”选项卡添加到菜单栏中。下面介绍操作方法。


    **步骤 01** 在Excel功能区的空白位置单击鼠标右键，在弹出的快捷菜单中选择“自定义功能区”命令，如图5-1所示。


    **步骤 02** 弹出“Excel选项”对话框，在“主选项卡”选项区中，![](OEBPS/Images/image_446.jpg)选中“开发工具”复选框；![](OEBPS/Images/image_447.jpg)单击“确定”按钮，如图5-2所示，即可将“开发工具”选项卡添加到菜单栏中。


    ![](OEBPS/Images/image_448.jpg)


    ▲图5-1


    ![](OEBPS/Images/image_449.jpg)


    图5-2


    ### 064 展开VBA编辑器中的窗口


    ![](OEBPS/Images/image_450.jpg)


    扫码观看教学视频


    在Excel工作表中，打开VBA编辑器，可以通过单击“开发工具”功能区中的`Visual Basic`按钮，如图5-3所示，或按`Alt+F11`快捷键打开Microsoft
    Visual Basic for Applications（VBA）编辑器。打开编辑器后，可能既没有显示窗口，也没有显示可以编辑代码的模块，不了解VBA或没用过VBA的新手这个时候可能不知道该如何操作。下面介绍将窗口、面板一一展开的操作方法。


    ![](OEBPS/Images/image_451.jpg)


    图5-3


    首先，在编辑器中选择“视图”|“工程资源管理器”选项，如图5-4所示，即可展开相应窗口。在“工程”资源管理器中可以管理文件、文件夹、数据库等。然后，在“视图”菜单列表中选择“属性窗口”选项，即可展开属性窗口，执行对象的所有属性都可以通过属性窗口获得。


    ![](OEBPS/Images/image_452.jpg)


    图5-4


    其次，单击“插入”菜单，如图5-5所示。在弹出的菜单列表中选择“模块”选项，即可打开代码窗口，在其中输入代码后运行即可。


    ### 065 移除插入的模块


    ![](OEBPS/Images/image_453.jpg)


    扫码观看教学视频


    在VBA编辑器中，模块可以理解为宏代码的载体，用户需要插入模块才能编写宏代码，如果添加的模块有误，还可以将模块移除。下面介绍具体的操作方法。


    ![](OEBPS/Images/image_454.jpg)


    图5-5


    **步骤 01** 在Excel中，打开VBA编辑器，在“工程”资源管理器中的空白位置单击鼠标右键，在弹出的快捷菜单中选择“插入”|“模块”命令，如图5-6所示。


    **步骤 02** 执行操作后，即可插入一个新的模块，如图5-7所示。在“工程”资源管理器中会显示插入的模块文件夹和模块名称。


    ![](OEBPS/Images/image_455.jpg)


    ▲图5-6


    ![](OEBPS/Images/image_456.jpg)


    图5-7


    **步骤 03** 在“工程”资源管理器中选择插入的模块，单击鼠标右键，在弹出的快捷菜单中选择“移除模块1”命令，如图5-8所示。


    **步骤 04** 弹出信息提示对话框，提示用户移除模块之前是否将模块和模块中的代码导出保存。由于本案例中没有编写代码，所以此处单击“否”按钮，如图5-9所示。执行操作后，即可移除插入的模块。


    ![](OEBPS/Images/image_457.jpg)


    ▲图5-8


    ![](OEBPS/Images/image_458.jpg)


    图5-9


    ### 066 了解宏代码的编写框架


    ![](OEBPS/Images/image_459.jpg)


    扫码观看教学视频


    VBA代码编写框架其实和写信、写邮件类似，要有开头、名称、正文和结尾。下面介绍编写宏代码的基本操作方法。


    **步骤 01** 在Excel中，打开VBA编辑器，插入一个模块，在模块中输入开头代码：`Sub`，如图5-10所示。


    **步骤 02** 输入一个空格+自定义子过程的名称+英文括号：`变量值计算()`，如图5-11所示。


    ![](OEBPS/Images/image_460.jpg)


    ▲图5-10


    ![](OEBPS/Images/image_461.jpg)


    图5-11


    **步骤 03** 名称输入完成后，按`Enter`键另起一行，此时空行下方会自动编写结尾代码：`End Sub`，如图5-12所示。


    **步骤 04** 在空行处输入正文代码：


    ```

    n=5

    [A1]=n*11

    [A2]=n*22

    [A3]=n*33

    ```


    该段代码是指变量值以`n`表示，`n`值为5，`A1`单元格需返回`n`与11相乘的值，`A2`单元格需返回`n`与22相乘的值，`A3`单元格需返回`n`与33相乘的值，如图5-13所示。


    ![](OEBPS/Images/image_462.jpg)


    ▲图5-12


    ![](OEBPS/Images/image_463.jpg)


    图5-13


    **步骤 05** 执行操作后，单击“运行子过程／用户窗体”按钮 ![](OEBPS/Images/image_464.jpg)，或按`F5`键运行宏代码，如图5-14所示。


    **步骤 06** 返回Excel工作表，即可查看变量值计算结果，如图5-15所示。可以看到单元格中的值是直接返回的，编辑栏中也没有使用计算公式。


