    ### **081**


    ### **用ChatGPT编写合并工作表的代码**


    ![](OEBPS/Images/image_580.jpg)


    扫码观看教学视频


    合并工作表是指将多个工作表合并为一个工作簿，用户可以用ChatGPT编写合并工作表的代码，让Excel自行合并工作表。下面介绍具体的操作方法。


    **步骤 01** 打开一个文件夹，其中保存了多个工作表，需要将多个工作表整合到一个工作簿中，如图6-5所示。


    ![](OEBPS/Images/image_581.jpg)


    图6-5


    **步骤 02** 打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel中，需要将当前工作簿所在文件夹中的多个Excel文件合并到一个工作簿中，该如何编写宏代码？”。按Enter键发送，ChatGPT即可根据提问编写合并工作表的代码，并向用户提供详细的操作步骤，如图6-6所示。


    ![](OEBPS/Images/image_582.jpg)


    图6-6


    **专家指点**


    当ChatGPT的代码框中没有显示完整的代码内容时，用户可以通过拖曳代码框底部滑块的方式查看没有显示的代码内容。


    **步骤 03** 复制编写的宏代码，打开文件夹中任意一个Excel工作表，打开VBA编辑器，插入一个新的模块，在其中粘贴复制的代码，如图6-7所示。


