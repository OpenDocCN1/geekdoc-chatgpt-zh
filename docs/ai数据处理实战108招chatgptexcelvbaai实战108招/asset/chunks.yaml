    ### 3. Mixed References


    During operation, pay attention to the reference switching function of the `F4`
    key, which only applies to the selected formula segment or referenced cells.


    ![](img/image_097.jpg)


    ▲Figure 2-5


    ![](img/image_098.jpg)


    ▲Figure 2-6


    ![](img/image_099.jpg)


    Figure 2-7


    In Excel, a mixed reference is equivalent to recombining absolute and relative
    references, allowing you to relatively reference rows and absolutely reference
    columns, or absolutely reference rows and relatively reference columns simultaneously.


    **Step 01** Enter `=B1` in cell `B2`. Pressing `F4` the 1st time creates an absolute
    reference; pressing `F4` the 2nd time changes the formula to `=B$1`, indicating
    a relative column reference and absolute row reference, as shown in Figure 2-8.


    **Step 02** After dragging the cell down, the formula remains unchanged as `=B$1`,
    meaning the row is fixed, as shown in Figure 2-9.


    **Expert Tip**


    During operation, note that pressing the `F4` key for the 4th time reverts the
    formula to its initially entered state.


    ![](img/image_100.jpg)


    ▲Figure 2-8


    ![](img/image_101.jpg)


    Figure 2-9


    **Step 03** After dragging the cell to the right, the formula changes to `=C$1`,
    meaning the column changes but the row remains constant, as shown in Figure 2-10.


    **Step 04** Pressing `F4` a 3rd time in cell `B2` changes the formula to `=$B1`,
    indicating an absolute column reference and relative row reference, as shown in
    Figure 2-11.


    ![](img/image_102.jpg)


    ▲Figure 2-10


    ![](img/image_103.jpg)


    Figure 2-11


    **Step 05** After dragging the cell to the right, the formula remains unchanged
    as `=$B1`, meaning the column is fixed, as shown in Figure 2-12.


    **Step 06** After dragging the cell down, the formula changes to `=$B2`, meaning
    the row changes but the column remains constant, as shown in Figure 2-13.


    ![](img/image_104.jpg)


    ▲Figure 2-12


    ![](img/image_105.jpg)


    Figure 2-13


    ### 022 Quickly Create Calculation Formulas


    ![](img/image_106.jpg)


    Scan to watch tutorial video


    Statistical calculations in Excel do not require users to manually calculate and
    then enter results into cells. You only need to establish the correct formula
    in a cell and let Excel calculate automatically to quickly obtain results. There
    are two main ways to create formulas in Excel: one is like a mathematical formula,
    using arithmetic operators (+, -, *, /) to reference cells for calculation; the
    other is using functions, writing formulas that conform to function syntax through
    arguments and conditions to perform specific calculations.


    Below we will introduce the methods for quickly creating formulas in Excel.


    **Step 01** Open a worksheet, as shown in Figure 2-14. We need to calculate the
    total sales for various products in the worksheet.


    **Step 02** Before creating the formula, first clarify the data in the worksheet:
    which cells contain data for calculation and which contain data to be ignored.
    For example, in this case, total sales only require multiplying unit price by
    sales quantity; any extra data in the table can be ignored.


    **Step 03** Select cell `B4` in the worksheet and enter the "`=`" symbol, as shown
    in Figure 2-15.


    ![](img/image_107.jpg)


    ▲Figure 2-14


    ![](img/image_108.jpg)


    Figure 2-15


    **Step 04** Next, select cell `B2` to reference the unit price, as shown in Figure
    2-16.


    **Step 05** Continue by entering the multiplication operator; press the `*` (asterisk)
    key on the keyboard, as shown in Figure 2-17.


    ![](img/image_109.jpg)


    ▲Figure 2-16


    ![](img/image_110.jpg)


    Figure 2-17


    **Step 06** After the operation, select cell `B3` to reference the sales quantity,
    as shown in Figure 2-18.


    **Step 07** A complete formula is now established: `=B2*B3`. Press `Enter` to
    confirm and calculate the total sales for Product A, as shown in Figure 2-19.


    ![](img/image_111.jpg)


    ▲Figure 2-18


    ![](img/image_112.jpg)


    Figure 2-19


    **Step 08** Drag the fill handle (bottom-right corner) of cell `B4` to cell `D4`
    to fill the formula, calculating the total sales for Product B and Product C,
    as shown in Figure 2-20.


    ![](img/image_113.jpg)


    Figure 2-20


