    在ChatGPT的输入框中输入内容时，可以对其分段、分行，具体操作方法如下。


    **步骤 01** 打开ChatGPT的聊天窗口，在输入框中输入第1行信息内容“以Excel表格的形式，对以下内容进行分类：”，如图1-9所示。


