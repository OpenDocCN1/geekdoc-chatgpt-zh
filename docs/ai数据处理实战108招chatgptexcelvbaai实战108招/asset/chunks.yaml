    ## **1.1**


    ## **掌握ChatGPT的基本操作**


    ChatGPT是一款基于AI技术的聊天机器人，它可以模仿人类的语言行为，实现人机之间的自然语言交互。ChatGPT不仅可以互动问答，还可以通过自动化和优化流程来提高办公效率，帮助用户解决Excel数据处理中的各种难题，如编写Excel函数公式、创建表格、检查纠错以及分析项目数据等。


    本节将详细介绍ChatGPT的主要功能、聊天窗口、换行操作和改写命令操作，帮助大家尽快熟悉ChatGPT并掌握其基本操作。


    ### **001**


    ### **掌握ChatGPT的主要功能**


    ![](OEBPS/Images/image_001.jpg)


    扫码观看教学视频


    ChatGPT的主要功能是进行自然语言处理和生成，包括文本自动摘要、文本分类、对话生成、文本翻译、语音识别以及语音合成等。ChatGPT可以接收文本、语音等形式的输入，然后对其进行语言理解、分析和处理，最终生成相应的输出结果。


    ChatGPT基于深度学习和自然语言处理等技术，它采用类似于神经网络的模型进行训练和推理，模拟人类的语言处理和生成能力，可以处理大规模的自然语言数据，生成质量高、连贯性强的语言模型，具有广泛的应用前景。


    要使用ChatGPT，首先要注册一个OpenAI账号。登录ChatGPT后，将会打开一个聊天窗口，在此用户可以输入任何问题或话题，ChatGPT将尝试回答并提供与主题有关的信息。


    下面介绍在ChatGPT中初步生成内容的操作方法。


    **步骤 01** 打开ChatGPT的聊天窗口，单击底部的输入框，如图1-1所示。


    ![](OEBPS/Images/image_002.jpg)


    图1-1


    **步骤 02** 在输入框中输入相应的关键词或指令，例如“与Excel结合使用，你可以做些什么？”，如图1-2所示。


    ![](OEBPS/Images/image_003.jpg)


    图1-2


    **步骤 03** 单击输入框右侧的发送按钮 ![](OEBPS/Images/image_004.jpg)或按Enter键，即可与ChatGPT开始对话。ChatGPT会根据要求进行回复，向用户反馈它可以提供的功能和帮助，如图1-3所示。


    ![](OEBPS/Images/image_005.jpg)


    图1-3


    ### **002**


    ### **管理ChatGPT的聊天窗口**


    ![](OEBPS/Images/image_006.jpg)


    扫码观看教学视频


    在ChatGPT中，建立的聊天窗口会自动保存在左侧的聊天窗口列表中，用户可以对聊天窗口进行新建、重命名以及删除等管理操作，具体操作方法如下。


    **步骤 01** 打开ChatGPT并进入一个使用过的聊天窗口，在左上角单击New chat（新的聊天窗口）按钮，如图1-4所示。执行操作后，即可新建一个聊天窗口。


    ![](OEBPS/Images/image_007.jpg)


    图1-4


    **步骤 02** 选择聊天窗口，单击 ![](OEBPS/Images/image_008.jpg)按钮，如图1-5所示。


    ![](OEBPS/Images/image_009.jpg)


    图1-5


    **步骤 03** 执行操作后，即可呈现编辑文本框，在文本框中可以修改名称，如图1-6所示。


    **步骤 04** 单击 ![](OEBPS/Images/image_010.jpg)按钮，即可完成聊天窗口的重命名操作。接下来，单击 ![](OEBPS/Images/image_011.jpg)按钮，如图1-7所示。


    **步骤 05** 执行操作后，弹出Delete chat？（删除聊天吗？）对话框，询问用户是否删除创建的聊天窗口， ![](OEBPS/Images/image_012.jpg)如果确认删除聊天窗口，则单击Delete（删除）按钮；
    ![](OEBPS/Images/image_013.jpg)如果不想删除聊天窗口，则单击Cancel（取消）按钮，如图1-8所示。


    ![](OEBPS/Images/image_014.jpg)


    ▲图1-6


    ![](OEBPS/Images/image_015.jpg)


    ▲图1-7


    ![](OEBPS/Images/image_016.jpg)


    图1-8


    **专家指点**


    当用户对ChatGPT生成的回复不满意时，可以单击Regenerate response（重新生成）按钮，重新生成回复内容。


    当用户对ChatGPT当前回复的内容存疑时，可以单击Stop generating（停止生成）按钮，停止生成回复内容。


