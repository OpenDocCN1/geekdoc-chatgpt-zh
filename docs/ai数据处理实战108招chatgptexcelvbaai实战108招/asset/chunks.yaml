    在Excel中，当需要批量提取的内容格式和位置一致时，可以让ChatGPT用函数公式来进行提取。例如，表格中的标题文本格式为“XXXX：XXXXXX”，前缀名为5个字符，需要提取前缀名后面的内容，则可以指定提取第6个字符开始的剩余部分内容。下面介绍用ChatGPT提取指定位置的标题的操作方法。


    #### 步骤 01

