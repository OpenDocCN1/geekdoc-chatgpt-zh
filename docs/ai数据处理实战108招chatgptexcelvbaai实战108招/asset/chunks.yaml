    ### 052 Finding Customers by Specified City with ChatGPT


    ![](img/image_356.jpg)


    Scan to watch tutorial video


    In Excel, some functions can look up data from a data range based on specified
    conditions. For example, in a customer list containing names and cities, to find
    the customer list based on a specified city, when the user is unsure which function
    to use, they can let ChatGPT write the function formula. The specific operation
    method is introduced below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-54. Column `B` contains customer
    names, and column `C` contains customer cities. The goal is to find the customer
    list for Beijing.


    ![](img/image_357.jpg)


    Figure 3-54


    **Step 02** Open the ChatGPT chat window, enter the instruction "In an Excel worksheet,
    column B is customer name, column C is customer city. I need to find the customer
    list for Beijing and return the results to column E cells. Which function formula
    can be used?" in the input box. Press `Enter` to send, and ChatGPT will provide
    the formula for finding the customer list, as shown in Figure 3-55.


    ![](img/image_358.jpg)


    Figure 3-55


    **Step 03** Copy the calculation formula provided by ChatGPT. In the Excel worksheet,
    select the cell range `E2:E11`; paste the copied formula into the formula bar:


    ```excel

    =IF(C2="Beijing",B2,"")

    ```


    As shown in Figure 3-56.


    ![](img/image_359.jpg)


    Figure 3-56


    **Step 04** Press the `Ctrl+Enter` shortcut to confirm, and the customer list
    for Beijing can be found, with results as shown in Figure 3-57.


    ![](img/image_360.jpg)


    Figure 3-57


    **Step 05** Next, the blank cells in `E2:E11` need to be deleted. Open the ChatGPT
    chat window and send the instruction "How to delete blank cells in E2:E11 without
    affecting other table contents?". After a moment, ChatGPT will provide the method
    for deleting blanks in a single column, as shown in Figure 3-58.


    ![](img/image_361.jpg)


    Figure 3-58


    ![](img/image_362.jpg)


    Figure 3-58 (Continued)


    **Step 06** Referring to the method provided by ChatGPT, return to the Excel worksheet,
    select cell `E1`. In the "Editing" panel of the "Home" tab, expand the "Sort &
    Filter" list and select "Filter", as shown in Figure 3-59.


    **Step 07** After execution, a filter dropdown button is added to cell `E1`. Click
    this button; in the expanded list, check only the "(Blanks)" checkbox, as shown
    in Figure 3-60.


    ![](img/image_365.jpg)


    Figure 3-59


    ![](img/image_366.jpg)


    Figure 3-60


    > **Expert Tip**

    >

    > Note that the reason for filtering first here, instead of directly performing
    the "Go To Special" operation for blanks as suggested by ChatGPT, is that although
    the blank cells appear empty, they contain formulas. Therefore, you need to filter
    out the blank cells first, clear their contents, and *then* perform the "Go To
    Special" operation for blanks.


    **Step 08** Click "OK" to filter out the blank cells. Select the blank cells,
    right-click; in the shortcut menu, select "Clear Contents", as shown in Figure
    3-61.


    ![](img/image_369.jpg)


    Figure 3-61


    **Step 09** After execution, the formulas in the blank cells are cleared, and
    the hidden content from filtering is restored. Select the cell range `E2:E11`.
    In the "Editing" panel of the "Home" tab, expand the "Find & Select" list and
    select "Go To Special", as shown in Figure 3-62.


    **Step 10** The "Go To Special" dialog box appears. Select the "Blanks" radio
    button, as shown in Figure 3-63.


    ![](img/image_370.jpg)


    Figure 3-62


    ![](img/image_371.jpg)


    Figure 3-63


    **Step 11** Click "OK" to locate the blank cells. Right-click, and in the shortcut
    menu, select "Delete", as shown in Figure 3-64.


    **Step 12** After execution, the "Delete" dialog box appears. Select the "Shift
    cells up" radio button, as shown in Figure 3-65.


    ![](img/image_372.jpg)


    Figure 3-64


    ![](img/image_373.jpg)


    Figure 3-65


    **Step 13** Click "OK" to delete the blank cells in column `E` without affecting
    other table contents. The result is shown in Figure 3-66.


    ![](img/image_374.jpg)


    Figure 3-66


    ### 053 Finding Keywords in a Specified Range with ChatGPT


    ![](img/image_375.jpg)


    Scan to watch tutorial video


    Suppose a user has a product description table and needs to check if a certain
    column contains "discount". At this time, "discount" can be used as the keyword
    to search for. Through the function formula written by ChatGPT, the search result
    of whether there is a discount can be returned. The specific operation method
    is introduced below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-67. Column `D` contains product
    promotion information. It is necessary to search column `D` for the keyword "discount"
    and return the search results to column `E` cells.


    **Step 02** Open the ChatGPT chat window, enter the instruction "In an Excel worksheet,
    column D contains product promotion information. I need to search column D for
    the keyword ''discount''. If found, return ''Has Discount'' in column E cells;
    if not found, return blank. Which function formula can be used?" in the input
    box. Press `Enter` to send, and ChatGPT will provide the formula for finding the
    keyword, as shown in Figure 3-68.


    ![](img/image_376.jpg)


    Figure 3-67


    ![](img/image_377.jpg)


    Figure 3-68


    > **Expert Tip**

    >

    > In the formula provided by ChatGPT, the `IF` function is a logical function,
    introduced in Example 038 of this book. Here we introduce the roles of the `ISNUMBER`
    and `SEARCH` functions used in this example.

    >

    > The `ISNUMBER` function is an information function used to check whether a given
    cell or value is numeric (i.e., a number). It returns a logical value (`TRUE`
    or `FALSE`) indicating whether the checked value is a number.

    >

    > The `SEARCH` function is a text function used to search for a specific substring
    within a text string and returns the starting position of the substring in the
    text. This function is case-insensitive.


    **Step 03** Copy the calculation formula provided by ChatGPT. In the Excel worksheet,
    select the cell range `E2:E9`; paste the copied formula into the formula bar:


    ```excel

    =IF(ISNUMBER(SEARCH("discount",D2)),"Has Discount","")

    ```


    As shown in Figure 3-69.


    ![](img/image_380.jpg)


    Figure 3-69


    **Step 04** Press the `Ctrl+Enter` shortcut to confirm, and the search results
    are returned. As shown in Figure 3-70, cells where "discount" is found return
    "Has Discount", while those not found return blank.


    ![](img/image_381.jpg)


    Figure 3-70


    **Step 05** To make products with discounts stand out more, users can highlight
    the entire rows of products with discounts in the table. Add filter dropdown buttons
    in the header cells via the "Filter" function, and filter for "Has Discount" cells,
    as shown in Figure 3-71.


