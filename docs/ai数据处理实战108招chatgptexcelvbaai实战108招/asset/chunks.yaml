    # 创建员工工资查询表


    首先需要新建一个空白工作簿，将相关的表头内容输入表格中，包括工号、部门、姓名、职位、加班时长、基本工资、福利补贴、绩效奖金、全勤奖金、加班费、社保代扣以及实发工资等，然后输入对应的员工工资明细数据。下面介绍具体的操作方法。


    ## 步骤 01


    新建一个空白工作簿，在底部工作表的名称上单击鼠标右键，在弹出的快捷菜单中选择“重命名”命令，将工作表的名称改为“员工工资查询表”，如图7-1所示。


    ## 步骤 02


    在工作表中输入相关的表头内容，结果如图7-2所示。


    ![](OEBPS/Images/image_692.jpg)


    ▲图7-1


    ![](OEBPS/Images/image_693.jpg)


    图7-2


    ## 步骤 03


    在表头下方输入员工工资明细数据，并调整行高与列宽，结果如图7-3所示。


    ![](OEBPS/Images/image_694.jpg)


    图7-3


    # 设置表格格式


    ![](OEBPS/Images/image_695.jpg)


    扫码观看教学视频


    工作表创建完成后，需要对表格格式进行设置，包括字体、表格边框和对齐方式等。下面介绍具体的操作方法。


    ## 步骤 01


    接例101继续操作，![](OEBPS/Images/image_696.jpg)在工作表的左上角单击鼠标左键，全选整个工作表；在“开始”功能区的“字体”面板中，![](OEBPS/Images/image_697.jpg)单击“加粗”按钮
    ![](OEBPS/Images/image_698.jpg)，将文本内容加粗，如图7-4所示。


    ## 步骤 02


    在“对齐方式”面板中单击“居中”按钮 ![](OEBPS/Images/image_699.jpg)，居中对齐文本，如图7-5所示。


    ![](OEBPS/Images/image_700.jpg)


    ▲图7-4


    ![](OEBPS/Images/image_701.jpg)


    图7-5


    ## 步骤 03


    ![](OEBPS/Images/image_702.jpg)选择第2行表头内容；在“对齐方式”面板中，![](OEBPS/Images/image_703.jpg)单击“顶端对齐”按钮
    ![](OEBPS/Images/image_704.jpg)，使表头沿单元格顶端对齐，如图7-6所示。


    ## 步骤 04


    ![](OEBPS/Images/image_705.jpg)选择`A2:L12`单元格，在“字体”面板中，展开“边框”列表框；![](OEBPS/Images/image_706.jpg)选择“所有框线”选项，为表格添加边框线，如图7-7所示。


    ![](OEBPS/Images/image_707.jpg)


    ▲图7-6


    ![](OEBPS/Images/image_708.jpg)


    图7-7


    # 添加数据单位


    ![](OEBPS/Images/image_709.jpg)


    扫码观看教学视频


    接下来，需要为加班时长数据和工资奖金等数据添加单位，同时不能影响数据计算。下面介绍具体的操作方法。


    ## 步骤 01


    接例102继续操作，![](OEBPS/Images/image_710.jpg)选择`E3:E12`单元格，单击鼠标右键，![](OEBPS/Images/image_711.jpg)在弹出的快捷菜单中选择“设置单元格格式”命令，如图7-8所示。


    ## 步骤 02


    弹出“设置单元格格式”对话框，在“自定义”选项区的“类型”文本框中默认输入了“G/通用格式”文本，在文本后方输入单位“小时”，如图7-9所示。


    ![](OEBPS/Images/image_712.jpg)


    ▲图7-8


    ![](OEBPS/Images/image_713.jpg)


    图7-9


    ## 步骤 03


    单击“确定”按钮，![](OEBPS/Images/image_714.jpg)即可为“加班时长”数据添加单位；![](OEBPS/Images/image_715.jpg)用同样的方法为`F3:L12`单元格区域的数据添加单位“元”，结果如图7-10所示。


    ![](OEBPS/Images/image_716.jpg)


    图7-10


    # 7.2 用ChatGPT计算员工工资


    在创建的员工工资查询表中，可以结合ChatGPT编写计算公式，计算员工的加班费和实发工资。


    ## 用ChatGPT计算加班费


    ![](OEBPS/Images/image_717.jpg)


    扫码观看教学视频


    在员工工资查询表中，假设加班1个小时的费用是100元，此时用户可以向ChatGPT准确描述计算条件，从而获取计算公式，计算员工的加班费。下面介绍具体的操作方法。


    ### 步骤 01


    接例103继续操作，打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，`E3:E12`单元格为加班时长数据，需要编写一个计算公式，按100元／小时计算加班费”。按Enter键发送，即可获取ChatGPT编写的加班费计算公式，如图7-11所示。


    ![](OEBPS/Images/image_718.jpg)


    图7-11


    ### 步骤 02


    复制ChatGPT编写的计算公式，返回Excel工作表，选择`J3:J12`单元格区域，![](OEBPS/Images/image_719.jpg)在编辑栏中粘贴公式：`=E3*100`；![](OEBPS/Images/image_720.jpg)按`Ctrl+Enter`快捷键即可计算各个员工的加班费，如图7-12所示。


    ![](OEBPS/Images/image_721.jpg)


    图7-12


    ## 用ChatGPT计算实发工资


    ![](OEBPS/Images/image_722.jpg)


    扫码观看教学视频


    在员工工资查询表中统计员工工资时，需要汇总基本工资、福利补贴、绩效奖金、全勤奖金以及加班费，还需要扣除公司代缴的社保费用。用户可以通过ChatGPT获取计算公式，计算员工的实发工资。下面介绍具体的操作方法。


    ### 步骤 01


    接例104继续操作。打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，`F3:J12`单元格为基本工资、福利补贴、绩效奖金、全勤奖金以及加班费等数据，`K3:K12`单元格为社保代扣数据，需要编写一个计算公式，将基本工资、福利补贴、绩效奖金、全勤奖金以及加班费进行汇总，并且减去社保代扣费用，计算出各个员工的实发工资”。按Enter键发送，即可获取ChatGPT编写的实发工资计算公式，如图7-13所示。


    ![](OEBPS/Images/image_723.jpg)


    图7-13


    ### 步骤 02


    复制ChatGPT编写的计算公式，返回Excel工作表，选择`L3:L12`单元格，![](OEBPS/Images/image_724.jpg)在编辑栏中粘贴公式：`=F3+G3+H3+I3+J3-K3`；![](OEBPS/Images/image_725.jpg)按`Ctrl+Enter`快捷键即可计算各个员工的实发工资，如图7-14所示。


    ![](OEBPS/Images/image_726.jpg)


    图7-14


    # 7.3 用VBA代码查询员工工资


    在工作表中，用户可以利用VBA代码和文本框控件实现自动筛选查询数据，即在文本框中输入员工姓名，工作表即可自动筛选出该员工的工资单。


    ## 创建查询文本框控件


    ![](OEBPS/Images/image_727.jpg)


    扫码观看教学视频


    在Excel中，用户可以绘制文本框控件，通过控件执行宏任务。下面介绍具体的操作方法。


    ### 步骤 01


    接例105继续操作，选择`A2:L2`单元格，在“数据”功能区的“排序和筛选”面板中，单击“筛选”按钮，在表头单元格中添加筛选按钮，如图7-15所示。


    ### 步骤 02


    在“开发工具”功能区的“控件”面板中，![](OEBPS/Images/image_728.jpg)单击“插入”下拉按钮；![](OEBPS/Images/image_729.jpg)在弹出的列表框中单击“文本框（ActiveX控件）”图标
    ![](OEBPS/Images/image_730.jpg)，如图7-16所示。


    ### 步骤 03


    在`A1`单元格中的文字后面绘制一个文本框控件，如图7-17所示。


    ![](OEBPS/Images/image_731.jpg)


    ▲图7-15


    ![](OEBPS/Images/image_732.jpg)


    ▲图7-16


    ![](OEBPS/Images/image_733.jpg)


    图7-17


    ## 录制宏并生成VBA代码


    ![](OEBPS/Images/image_734.jpg)


    扫码观看教学视频


    在Excel工作表中，用户可以通过“录制宏”功能录制执行的命令，然后生成VBA代码。下面介绍具体的操作方法。


    ### 步骤 01


    接例106继续操作，在“开发工具”功能区的“代码”面板中，单击“录制宏”按钮，如图7-18所示。弹出“录制宏”对话框，单击“确定”按钮即可开始录制执行的命令。


    ![](OEBPS/Images/image_735.jpg)


    图7-18


    ### 步骤 02


    ![](OEBPS/Images/image_736.jpg)单击`C2`单元格中的下拉按钮，弹出列表框，在搜索文本框中，![](OEBPS/Images/image_737.jpg)输入员工姓名，这里输入“赵简”，按Enter键确认，如图7-19所示。


    ### 步骤 03


    在功能区单击“停止录制”按钮，停止录制，打开VBA编辑器，在模块1中可以查看生成的VBA代码，如图7-20所示。


    ![](OEBPS/Images/image_738.jpg)


    ▲图7-19


    ![](OEBPS/Images/image_739.jpg)


    图7-20


    ## 运行宏并查询员工工资


    ![](OEBPS/Images/image_740.jpg)


    扫码观看教学视频


    在例107中生成的VBA代码还不能直接运行，需要将代码复制到Sheet1（员工工资查询表）的模块中，并对代码中的搜索内容进行修改，使其运行时不受限制。下面介绍具体的操作方法。


    ### 步骤 01


    接例107继续操作，复制模块1中的代码，在“工程”资源管理器中双击“Sheet1（员工工资查询表）”选项，![](OEBPS/Images/image_741.jpg)在弹出的模块中单击“通用”下拉按钮，在弹出的下拉列表框中，![](OEBPS/Images/image_742.jpg)选择`TextBox1`选项，如图7-21所示。


    ![](OEBPS/Images/image_743.jpg)


    图7-21


    ### 步骤 02


    执行操作后，即可自动生成开头代码和结尾代码。在空白行粘贴代码，删除多余的代码并修改搜索内容：`"*" & TextBox1 & "*"`，结果如图7-22所示。


    ![](OEBPS/Images/image_744.jpg)


    图7-22


    ### 步骤 03


    运行宏并退出VBA编辑器，![](OEBPS/Images/image_745.jpg)在文本框控件中输入员工姓名，这里输入“何墨”；![](OEBPS/Images/image_746.jpg)即可快速查询该员工的工资明细，如图7-23所示。至此，即可完成员工工资查询表的制作。


    ![](OEBPS/Images/image_747.jpg)


    图7-23


