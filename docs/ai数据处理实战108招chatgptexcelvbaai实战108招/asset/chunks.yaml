    In an Excel worksheet, when users need to find duplicate data, they can use ChatGPT
    to write function formulas to check if a column contains duplicate content. The
    specific operation method is introduced below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-50. Column `B` contains order
    numbers. The goal is to find out if there are duplicate order numbers and return
    the results to column `D` cells.


