    In Excel, the `INDEX` function returns the value of a cell or a part of a range
    from a specified range, while the `MATCH` function searches for a specified value
    in a specified range and returns the index or relative position of that value.
    Combining these two functions allows for data location, data lookup, and validation
    of input values. The following example demonstrates how to use ChatGPT to write
    `INDEX` and `MATCH` function formulas for locating and finding employee information.


