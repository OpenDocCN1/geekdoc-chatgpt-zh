    > **专家指点**

    >

    > ChatGPT提供的公式中，`IF`函数为逻辑函数，在本书038实例中已做介绍，这里介绍一下本例中的`ISNUMBER`函数和`SEARCH`函数的作用。

    >

    > `ISNUMBER`函数属于信息函数，用于检查一个给定的单元格或数值是否为数值型（即是否为数字）。它返回一个逻辑值（`TRUE`或`FALSE`），表示所检查的值是否为数字。

    >

    > `SEARCH`函数属于文本函数，用于在一个文本字符串中搜索指定的子字符串，并返回子字符串在文本中的起始位置，该函数不区分大小写。


    **步骤 03** 复制ChatGPT提供的计算公式，在Excel工作表中，选择`E2:E9`单元格区域；在编辑栏中粘贴复制的公式：


    ```excel

    =IF(ISNUMBER(SEARCH("折扣",D2)),"有折扣","")

    ```


