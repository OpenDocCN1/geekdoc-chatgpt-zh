    假如用户有一个产品描述表，需要在某一列中查找产品是否有折扣，此时可以将“折扣”作为需要查找的关键词，通过ChatGPT编写的函数公式，返回查找结果是否有折扣。下面通过实例介绍具体的操作方法。


    **步骤 01** 打开一个工作表，如图3-67所示。`D`列为产品优惠信息，需要在`D`列查找表格内容是否有“折扣”，并将查找结果返回`E`列单元格中。


    **步骤 02** 打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，D列为产品优惠信息，需要在D列查找表格内容是否有‘折扣’，如果查找结果为有，便在E列单元格中返回结果为‘有折扣’，如果查找结果为无，则返回结果为空，可以用哪个函数公式？”。按`Enter`键发送，ChatGPT即可提供查找关键词的公式，如图3-68所示。


