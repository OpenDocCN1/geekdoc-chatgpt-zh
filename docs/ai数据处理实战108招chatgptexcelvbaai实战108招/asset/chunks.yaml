    ## 2.1 Basic Operations for Creating Formulas


    Before analyzing data in Excel, you must first understand the concept and usage
    of references, how to construct formulas, methods for entering functions and references,
    and how to use the function library to select functions—these are the basic operations
    for creating formulas. Only by laying a solid foundation can you apply knowledge
    flexibly and master data analysis techniques.


    ### 021 Understanding Relative, Absolute, and Mixed References


    ![](img/image_092.jpg)


    *Scan to watch tutorial video*


    In Excel, referencing a cell means using the address of another cell in a formula
    within a specific cell, and utilizing the value in that other cell without manually
    entering the value. This provides users with a faster and more convenient calculation
    method.


    Cells in Excel are typically identified by a "letter + number" format, such as
    `A1`, `B2`, etc. These cells can contain various data types, such as numbers,
    text, dates, etc. Users can use these cell addresses in formulas to calculate
    and manipulate the data in those cells. For example, to add the values in cells
    `A1` and `A2` and display the result in cell `A3`, you can enter the formula `=A1+A2`
    in cell `A3`. Here, the `+` symbol is the addition operator in Excel, while `A1`
    and `A2` are cell references pointing to the values in cells `A1` and `A2` respectively.


    Cell referencing is a very flexible and powerful feature that helps users quickly
    perform various complex calculations and operations, making Excel a very powerful
    and comprehensive data processing tool. In Excel, references are divided into
    relative references, absolute references, and mixed references, detailed below.


    #### 1. Relative Reference


    Relative references in Excel are mainly used to reference data at relative cell
    positions for function calculations.


    #### Step 01

    Open a worksheet and enter directly in cell `B2`: `=B1`, as shown in Figure 2-1.


    #### Step 02

    Press `Enter` to confirm. This references the data in cell `B1`, returning a value
    of 1 in cell `B2`, as shown in Figure 2-2.


    #### Step 03

    Drag the fill handle at the bottom-right corner of cell `B2` to the right. The
    referenced cell changes with the position movement, and the formula in the cell
    automatically adjusts from `=B1` to `=C1`, as shown in Figure 2-3.


    #### Step 04

    Similarly, dragging down causes the formula in the cell to automatically adjust
    from `=B1` to `=B2`, as shown in Figure 2-4. Thus, it can be concluded that when
    dragging to the right, the column letter in the relative reference formula changes;
    when dragging down, the row number changes.


    ![](img/image_093.jpg)


    Figure 2-1


    ![](img/image_094.jpg)


    Figure 2-2


    ![](img/image_095.jpg)


    Figure 2-3


    ![](img/image_096.jpg)


    Figure 2-4


    #### 2. Absolute Reference


    In an Excel worksheet, an absolute reference always references the value in a
    specified cell location. Users can add the `$` symbol by pressing the `F4` key
    while in the cell reference to switch the reference mode.


    #### Step 01

    Continuing from above, enter `=B1` in cell `B2`, as shown in Figure 2-5.


    #### Step 02

    After the operation, press the `F4` key. Two `$` symbols are added to the formula,
    indicating an absolute cell reference, as shown in Figure 2-6.


    #### Step 03

    Unlike relative references, no matter which direction the cell is dragged, the
    formulas in all cells remain the same as in cell `B2` and do not change at all,
    as shown in Figure 2-7.


