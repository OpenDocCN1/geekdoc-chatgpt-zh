    **Step 02** Enter the following instruction in the ChatGPT chat window input box:


    ```

    In an Excel worksheet, need to write a VBA code to uniformly set the date format
    in cells A2:B6 to: yyyy 年 mm 月 dd 日

    ```


    Press Enter to send, and ChatGPT will write the code for setting date formats,
    as shown in Figure 6-71.


    ![](img/image_672.jpg)


    Figure 6-71


    **Step 03** Copy the code written by ChatGPT, return to the Excel worksheet, open
    the VBA editor, insert a new module, and paste the copied code into it, as shown
    in Figure 6-72.


    **Step 04** Run the macro code, close the VBA editor, and the date format will
    be uniformly set in the worksheet, with results as shown in Figure 6-73.


    ![](img/image_673.jpg)


    ▲Figure 6-72


    ![](img/image_674.jpg)


    Figure 6-73


    ### 098 Using ChatGPT to Write Code for Creating Visualization Charts


    ![](img/image_675.jpg)


    Scan to watch tutorial video


    Using ChatGPT to write code for creating visualization charts can help users create
    a visual work report, presenting data through charts and graphs, making data analysis
    more intuitive and easier to understand. The code creates charts such as column
    charts, line charts, etc., based on specified data ranges, thereby visualizing
    data trends and relationships. The specific operation methods are introduced below.


    **Step 01** Open a worksheet, as shown in Figure 6-74. You need to create a column
    chart via VBA code.


    ![](img/image_676.jpg)


    Figure 6-74


    **Step 02** Enter the following instruction in the ChatGPT chat window input box:


    ```

    In Excel''s Sheet1 worksheet, Column A is Region, Column B is Sales. Need to write
    a VBA code to automatically create a column chart on the right side of the data
    table based on data in cells A1:B7, and display data labels in the chart

    ```


    Press Enter to send, and ChatGPT will write the code for creating visualization
    charts, as shown in Figure 6-75.


    ![](img/image_677.jpg)


    Figure 6-75


    **Step 03** Copy the code written by ChatGPT, return to the Excel worksheet, open
    the VBA editor, insert a new module, and paste the copied code into it, as shown
    in Figure 6-76.


    ![](img/image_678.jpg)


    Figure 6-76


    **Step 04** Run the macro code, close the VBA editor, and a column chart will
    be created in the worksheet, with results as shown in Figure 6-77.


    ![](img/image_679.jpg)


    Figure 6-77


    ### 099 Using ChatGPT to Write Code for Hiding Numbers


    ![](img/image_680.jpg)


    Scan to watch tutorial video


    Using ChatGPT to write code for hiding numbers can help users hide numbers in
    a data range to prevent sensitive information leakage. The specific operation
    methods are introduced below.


    **Step 01** Open a worksheet, as shown in Figure 6-78. You need to use VBA code
    to hide numbers in order numbers with the `*` symbol.


    ![](img/image_681.jpg)


    Figure 6-78


    **Step 02** Enter the following instruction in the ChatGPT chat window input box:


    ```

    In Excel''s Sheet1 worksheet, Column A consists of numeric order numbers. Need
    to write a VBA code to hide the middle 6 digits with * symbols in Column A cells

    ```


    Press Enter to send, and ChatGPT will write the code for hiding numbers, as shown
    in Figure 6-79.


    ![](img/image_682.jpg)


    Figure 6-79


    **Step 03** Copy the code written by ChatGPT, return to the Excel worksheet, open
    the VBA editor, insert a new module, paste the copied code, and modify `If Len(orderNumber)
    >= 10 Then` to `If Len(orderNumber) >= 12 Then` (indicating 12 total characters),
    modify `Left(orderNumber, 2)` to `Left(orderNumber, 3)` (indicating starting from
    the 3rd character from the left), and modify `Right(orderNumber, 2)` to `Right(orderNumber,
    3)` (indicating ending at the 3rd character from the right), as shown in Figure
    6-80.


    ![](img/image_683.jpg)


    Figure 6-80


    **Step 04** Run the macro code, close the VBA editor, and numbers in order numbers
    will be hidden in the worksheet, with results as shown in Figure 6-81.


    ![](img/image_684.jpg)


    Figure 6-81


    ### 100 Using ChatGPT to Write Code for Highlighting Data in Red


    ![](img/image_685.jpg)


    Scan to watch tutorial video


    Using ChatGPT to write code for highlighting data in red can help users quickly
    identify specifically highlighted data for data analysis and attention. The code
    automatically marks data meeting specified conditions in red, making it more prominent
    in the table. The specific operation methods are introduced below.


    **Step 01** Open a worksheet, as shown in Figure 6-82. You need to use VBA code
    to highlight cells with sales volume exceeding 1000 in red.


    ![](img/image_686.jpg)


    Figure 6-82


    **Step 02** Enter the following instruction in the ChatGPT chat window input box:


    ```

    In Excel''s Sheet1 worksheet, Column C is Sales Volume. Need to write a VBA code
    to highlight cells with sales volume exceeding 1000 in red

    ```


    Press Enter to send, and ChatGPT will write the code for highlighting data in
    red, as shown in Figure 6-83.


    ![](img/image_687.jpg)


    Figure 6-83


    **Step 03** Copy the code written by ChatGPT, return to the Excel worksheet, open
    the VBA editor, insert a new module, and paste the copied code into it, as shown
    in Figure 6-84.


    **Step 04** Run the macro code, close the VBA editor, and data with sales volume
    exceeding 1000 will be highlighted in red in the worksheet, with results as shown
    in Figure 6-85.


    ![](img/image_688.jpg)


    ▲Figure 6-84


    ![](img/image_689.jpg)


    Figure 6-85

