    to find the row where the name provided in column `F` cells is located in the
    lookup range, find the column where the column `I` header is located in the lookup
    range, and finally return the found result to the cells in column `I`. How do
    I write a complete lookup formula using the `INDEX` and `MATCH` functions?" Press
    the `Enter` key to send. ChatGPT will write the combined formula of `INDEX` and
