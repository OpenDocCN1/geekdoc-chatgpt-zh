    ### 步骤 02

    打开ChatGPT的聊天窗口，在输入框中输入指令“在工作表中，B列至F列是科目分数，需要用`IF`函数和`AND`函数编写一个多条件判断公式：各科分数平均分为80以上，且没有一科分数低于70分的为优秀；平均分80分以上，如果有一科以上分数低于70分的为优良；平均分60到79分之间，且没有一科低于60分的为合格，有一科低于60分的为挂科”。按Enter键发送，ChatGPT即可根据提问编写多条件判断公式，如图2-104所示。


