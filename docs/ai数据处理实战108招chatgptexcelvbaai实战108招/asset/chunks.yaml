    ## **2.1**


    ## **创建公式的基本操作**


    在Excel中统计数据前，首先要了解引用的概念和使用方法、如何建立公式、输入函数与引用的方法以及利用函数清单选择函数等创建公式的基本操作。稳固好基础才能举一反三，掌握统计数据的技巧。


    ### **021**


    ### **认识相对引用、绝对引用和混合引用**


    ![](OEBPS/Images/image_092.jpg)


    扫码观看教学视频


    在Excel中，引用单元格指的是在某个单元格公式中引用其他单元格的地址，并使用其他单元格中的值，而不必手动输入这些值。这为用户提供了更加快捷方便的计算方式。


    Excel中的单元格通常用“字母+数字”的方式进行标识，如A1、B2等。这些单元格可以包含各种数据类型，如数字、文本、日期等。用户可以在公式中使用这些单元格的地址来计算、操作这些单元格中的数据。例如，要将A1和A2单元格中的值相加，并将结果显示在A3单元格中，可以在A3单元格中输入公式：=A1+A2。其中“+”符号是Excel中的求和运算符，而A1和A2是引用单元格，它们分别指向A1和A2单元格中的值。


    引用单元格是一项非常灵活和强大的功能，它可以帮助用户快速进行各种复杂的计算和操作，使Excel成为一个非常强大和全面的数据处理工具。在Excel中，引用分为相对引用、绝对引用以及混合引用，具体介绍如下。


    **1．相对引用**


    相对引用在Excel中主要用于引用单元格相对位置的数据进行函数运算。


    **步骤 01** 打开一个工作表，在B2单元格中直接输入：=B1，如图2-1所示。


    **步骤 02** 按Enter键确认，即可引用B1单元格中的数据，返回B2单元格的值为1，如图2-2所示。


    **步骤 03** 按住B2单元格右下角向右拖曳，引用单元格会随着位置的移动发生变化，单元格中的公式也会随之由=B1自动调整为=C1，如图2-3所示。


    **步骤 04** 同理，向下拖曳后，单元格中的公式会由=B1自动调整为=B2，如图2-4所示。由此可以得出结论，当向右拖曳单元格时，相对引用公式中的列号会发生改变；当向下拖曳时，行号会发生改变。


    ![](OEBPS/Images/image_093.jpg)


    ▲图2-1


    ![](OEBPS/Images/image_094.jpg)


    ▲图2-2


    ![](OEBPS/Images/image_095.jpg)


    ▲图2-3


    ![](OEBPS/Images/image_096.jpg)


    图2-4


    **2．绝对引用**


    在Excel工作表中，绝对引用总是在指定位置引用单元格中的值，用户可以在引用单元格通过按F4键时添加符号$，以此来切换引用模式。


    **步骤 01** 接上面继续操作，在B2单元格中输入：=B1，如图2-5所示。


    **步骤 02** 执行操作后，按F4键，公式中会添加两个$符号，表示绝对引用单元格，如图2-6所示。


    **步骤 03** 与相对引用不同的是，无论单元格向哪个方向拖曳，所有单元格中的公式都与B2单元格中一样，不会发生任何变化，如图2-7所示。


