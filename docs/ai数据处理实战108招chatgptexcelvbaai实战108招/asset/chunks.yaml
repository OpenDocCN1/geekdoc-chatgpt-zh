    ### 050 Many-to-One Lookup of Department Heads with ChatGPT


    ![](img/image_342.jpg)


    Scan to watch tutorial video


    In an Excel worksheet, a many-to-one lookup refers to querying a single corresponding
    result from multiple lookup values. Users can use ChatGPT to write a combination
    formula of the `INDEX` and `MATCH` functions for many-to-one lookups. The `MATCH`
    function locates the position of the lookup value in another column, and then
    the `INDEX` function returns the corresponding value based on that position. The
    specific operation method is introduced below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-46. The left table is the source
    data query area, and the right table is the query result area. It is necessary
    to find the corresponding person in charge in column `C` based on the department
    names in column `E` cells and return the results to column `F`.


    ![](img/image_343.jpg)


    Figure 3-46


    **Step 02** Open the ChatGPT chat window, enter the instruction "In an Excel worksheet,
    columns A:C are source data, where column B is the department and column C is
    the person in charge. I need to find the corresponding person in charge based
    on the department names provided in column E cells and return the results to column
    F. Write a combination formula using the INDEX and MATCH functions." in the input
    box. Press `Enter` to send, and ChatGPT will provide the formula for querying
    the department head, as shown in Figure 3-47.


    ![](img/image_344.jpg)


    Figure 3-47


    **Step 03** Copy the calculation formula provided by ChatGPT. In the Excel worksheet,
    select the cell range `F2:F3`; paste the copied formula into the formula bar:


    ```excel

    =INDEX(C2:C10,MATCH(E2,B2:B10,0))

    ```


    As shown in Figure 3-48.


    ![](img/image_347.jpg)


    Figure 3-48


    **Step 04** Press the `Ctrl+Enter` shortcut to confirm, and the many-to-one lookup
    of department heads is completed, as shown in Figure 3-49.


    ![](img/image_348.jpg)


    Figure 3-49


    ### 051 Finding Duplicate Order Numbers with ChatGPT


