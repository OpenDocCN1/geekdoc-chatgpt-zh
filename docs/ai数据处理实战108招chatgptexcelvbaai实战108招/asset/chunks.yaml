    ### **056**


    ### **输入ChatGPT插件密钥**


    ![](OEBPS/Images/image_405.jpg)


    扫码观看教学视频


    在OpenAI官网中获取API密钥后，即可返回Excel工作表，展开ChatGPT for Excel插件面板， ![](OEBPS/Images/image_406.jpg)在面板下方的Your OpenAI API Key文本框中输入获取的密钥；
    ![](OEBPS/Images/image_407.jpg)单击SAVE（保存）按钮，如图4-14所示。


    执行操作后，即可通过申请，成功应用API密钥，并提示用户可以在工作表中使用对应的AI函数，如图4-15所示。


    ![](OEBPS/Images/image_408.jpg)


