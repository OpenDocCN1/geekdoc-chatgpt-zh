    use VBA code to group and sum Sales Amount by Product, and return the results
    to `Column F` and `Column G` of the `Sheet1` worksheet." Press `Enter` to send.
    ChatGPT will reply with the group sum calculation code, as shown in Figure 5-44.


    ![](img/image_508.jpg)


    ▲Figure 5-44


    ![](img/image_509.jpg)


    Figure 5-44 (Continued)


    **Step 03** Copy the code written by ChatGPT. Return to the Excel worksheet, open
    the VBA Editor, insert a module, and paste the copied code into the module, as
    shown in Figure 5-45.


    ![](img/image_510.jpg)


    Figure 5-45


    **Step 04** After the operation, click the "Run Sub/UserForm" button ![](img/image_511.jpg)
    to run the macro code, as shown in Figure 5-46.


    ![](img/image_512.jpg)


    Figure 5-46


    **Step 05** Close the VBA Editor. In the worksheet, the product sales amounts
    are now grouped and summed, as shown in Figure 5-47.


    ![](img/image_513.jpg)


    Figure 5-47


    **Step 06** Enter headers in `Column F` and `Column G`, add borders, set fill
    colors, etc. The final effect is shown in Figure 5-48.


    ![](img/image_514.jpg)


    Figure 5-48


