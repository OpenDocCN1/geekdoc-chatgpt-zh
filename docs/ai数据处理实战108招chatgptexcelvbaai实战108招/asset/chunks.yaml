    **步骤 02** 在ChatGPT聊天窗口的输入框中输入指令“在Excel的Sheet1工作表中，需要编写一段VBA代码，对A:E列中有填充颜色的单元格数据进行整行筛选，并保留表头和筛选结果，将不满足条件的数据行隐藏起来”。按Enter键发送，ChatGPT即可编写单元格颜色筛选的代码，如图6-31所示。


    ![](OEBPS/Images/image_617.jpg)


    图6-31


    **步骤 03** 复制ChatGPT编写的代码，返回Excel工作表，打开VBA编辑器，插入一个新的模块，在其中粘贴复制的代码，如图6-32所示。


    **步骤 04** 运行宏代码，关闭VBA编辑器，即可筛选有颜色的单元格数据，结果如图6-33所示。


