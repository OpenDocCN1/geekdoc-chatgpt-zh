    ## 3.2 用ChatGPT提取数据

    提取数据是指从表格文本中抽取出特定的信息或数据，以便进一步分析和处理。用户可以结合ChatGPT提供的方法和计算公式等，在Excel中提取数据。


    ### 044 用ChatGPT提取姓名后面的职称


    ![](OEBPS/Images/image_292.jpg)


    扫码观看教学视频


    在Excel表格中，当员工姓名和职称在同一个单元格中时，用户可以向ChatGPT询问单独提取职称的方法。下面介绍具体操作。


    #### 步骤 01

    打开一个工作表，如图3-18所示。在B列单元格中有一个空格分隔姓名和职称，需要在D列将B列中的职称单独提取出来。


    ![](OEBPS/Images/image_293.jpg)


    图3-18


    #### 步骤 02

    打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，B列为员工姓名和职称，且姓名和职称之间有一个空格，例如‘周熙 经理’，其中‘周熙’为姓名，‘经理’为职称，需要在D列将B列中的职称提取出来，有什么方法可以解决？”。按Enter键发送，ChatGPT即可提供提取职称的公式，如图3-19所示。


    ![](OEBPS/Images/image_294.jpg)


    图3-19


    #### 步骤 03

    复制ChatGPT提供的提取公式，在Excel工作表中，![](OEBPS/Images/image_295.jpg)选择`D2:D9`单元格区域；![](OEBPS/Images/image_296.jpg)在编辑栏中粘贴复制的公式：`=RIGHT(B2,LEN(B2)-FIND("",B2))`，如图3-20所示。


    ![](OEBPS/Images/image_297.jpg)


    图3-20


    #### 步骤 04

    按`Ctrl+Enter`快捷键确认，即可批量提取员工姓名后面的职称，结果如图3-21所示。


    ![](OEBPS/Images/image_298.jpg)


