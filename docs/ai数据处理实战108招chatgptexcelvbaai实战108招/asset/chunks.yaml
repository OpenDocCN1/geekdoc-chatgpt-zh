    ## 1.2 Correctly Asking ChatGPT Questions


    After learning the content of Section 1.1, I believe everyone has mastered the
    basic operation methods of using `ChatGPT`. `ChatGPT` is a language model. As
    long as the user sends their needs and thoughts, `ChatGPT` will reply according
    to the sent questions. If the user wants `ChatGPT`''s reply content to be more
    accurate and more in line with their needs, they need to pay more attention to
    the correct way of asking questions, so as to better use `ChatGPT`.


    ### 005 Accurately Describing Data Processing Needs


    ![](img/image_028.jpg)


    Scan to Watch Tutorial Video


    When asking `ChatGPT` questions, accurately and clearly describe the specific
    tasks or needs to be completed in `Excel`. Specific and clear questions help `ChatGPT`
    understand the user''s intent and give accurate answers.


    For example, when a user needs to create a line chart in an `Excel` worksheet
    that can display sales data and trends, if they directly ask `ChatGPT` "How to
    create a line chart in `Excel`?", `ChatGPT` will give a relatively general reply,
    and the operation steps in the reply are not entirely correct, as shown in Figure
    1-15.


    If using clear language to specify what type of operation or analysis is needed,
    and accurately describe to `ChatGPT` "How to create a line chart in `Excel` to
    display sales data and sales trends?", `ChatGPT` will give a more precise answer,
    and the operation description will be more detailed, as shown in Figure 1-16.


