    ## 3.3 Finding Data with ChatGPT


    Similar to data extraction, ChatGPT can also provide assistance when users need
    to find data in Excel spreadsheets, allowing users to easily locate required data
    in tables through various functions and tools. Whether it is a simple lookup requirement
    or advanced data retrieval based on conditions, combining ChatGPT and Excel can
    provide users with multiple methods to meet different lookup needs.


    ### 047 Calculating Age from ID Number with ChatGPT


    ![](img/image_317.jpg)


    Scan to watch tutorial video


    Besides extracting the date of birth from an ID number, users can also combine
    ChatGPT in Excel to calculate age based on the ID number. The specific operation
    method is introduced below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-32. Column `A` cells contain
    virtual ID numbers, and the age needs to be calculated in column `B` cells based
    on the ID numbers.


    ![](img/image_318.jpg)


    Figure 3-32


    **Step 02** Open the ChatGPT chat window, enter the instruction "In an Excel worksheet,
    column A cells are ID numbers. I need to calculate age based on the ID numbers.
    What function formula can be used to solve this?" in the input box. Press `Enter`
    to send, and ChatGPT will provide the formula for calculating age based on ID
    numbers, as shown in Figure 3-33.


    ![](img/image_319.jpg)


    Figure 3-33


    **Step 03** Copy the formula provided by ChatGPT. In the Excel worksheet, select
    the cell range `B2:B6`; paste the copied formula into the formula bar:


    ```excel

    =INT((TODAY()-DATEVALUE(MID(A2,7,4)&"-"&MID(A2,11,2)&"-"&MID(A2,13,2)))/365)

    ```


    As shown in Figure 3-34.


    ![](img/image_322.jpg)


    Figure 3-34


    **Step 04** Press the `Ctrl+Enter` shortcut to confirm, and the age can be calculated
    in batches based on ID numbers, as shown in Figure 3-35.


    ![](img/image_323.jpg)


    Figure 3-35


    ### 048 Determining Gender from ID Number with ChatGPT


    ![](img/image_324.jpg)


    Scan to watch tutorial video


    Usually, in an ID number, if the second-to-last digit is odd, it indicates male;
    if even, it indicates female. Therefore, users can use ChatGPT to write a calculation
    formula to determine gender in Excel. The specific operation method is introduced
    below through an example.


    **Step 01** Open a worksheet, as shown in Figure 3-36. Column `A` cells contain
    virtual ID numbers, and the gender needs to be determined in column `B` cells
    based on the ID numbers.


    ![](img/image_325.jpg)


    Figure 3-36


    **Step 02** Open the ChatGPT chat window, enter the instruction "In an Excel worksheet,
    column A cells are ID numbers. I need to determine gender based on the ID numbers.
    What function formula can be used to solve this?" in the input box. Press `Enter`
    to send, and ChatGPT will provide the formula for determining gender based on
    ID numbers, as shown in Figure 3-37.


    ![](img/image_326.jpg)


    Figure 3-37


    **Step 03** Copy the calculation formula provided by ChatGPT. In the Excel worksheet,
    select the cell range `B2:B6`; paste the copied formula into the formula bar,
    and change `A1` to `A2`:


    ```excel

    =IF(MID(A2,LEN(A2)-1,1)*1=1,"Male","Female")

    ```


    As shown in Figure 3-38.


    ![](img/image_329.jpg)


    Figure 3-38


    **Step 04** Press the `Ctrl+Enter` shortcut to confirm, and the gender can be
    determined based on ID numbers, as shown in Figure 3-39.


    ![](img/image_330.jpg)


    Figure 3-39


