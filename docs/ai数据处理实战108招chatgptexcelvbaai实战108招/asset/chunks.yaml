    图1-5


    **步骤 03** 执行操作后，即可呈现编辑文本框，在文本框中可以修改名称，如图1-6所示。


    **步骤 04** 单击 ![](OEBPS/Images/image_010.jpg)按钮，即可完成聊天窗口的重命名操作。接下来，单击 ![](OEBPS/Images/image_011.jpg)按钮，如图1-7所示。


    **步骤 05** 执行操作后，弹出`Delete chat?`（删除聊天吗？）对话框，询问用户是否删除创建的聊天窗口。![](OEBPS/Images/image_012.jpg)
    如果确认删除聊天窗口，则单击`Delete`（删除）按钮；![](OEBPS/Images/image_013.jpg) 如果不想删除聊天窗口，则单击`Cancel`（取消）按钮，如图1-8所示。


