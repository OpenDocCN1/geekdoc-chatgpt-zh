    #### Expert Tip


    In Excel, when the entered formula is an array formula, you need to use the `Ctrl+Shift+Enter`
    key combination to confirm the formula as an array formula.


    In Excel, an array formula is a special formula used to perform calculations on
    multiple cell ranges and return multiple results. These formulas typically involve
    array operations, such as calculating, summarizing, or filtering each cell in
    a range. After confirming an array formula, Excel automatically adds curly braces
    `{}` around the formula to indicate that the result is an array; you do not need
    to enter the curly braces manually.


