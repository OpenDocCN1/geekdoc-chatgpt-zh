    # 第1章 AI助手：正确使用ChatGPT


    ## 学习提示


    `AI`助手是指基于人工智能技术，能够人机交互、为用户提供各种服务和帮助的虚拟助手。`ChatGPT`便是这样一款能够实现人机交互的`AI`工具。`ChatGPT`具体有什么作用？该如何使用它呢？本章就来带领大家认识一下它。


    ## 本章重点导航


    ![图标](OEBPS/Images/image_000.png) 掌握`ChatGPT`的基本操作

    ![图标](OEBPS/Images/image_000.png) 正确向`ChatGPT`提问

    ![图标](OEBPS/Images/image_000.png) 用`ChatGPT`学习`Excel`中的常用操作


    ## 1.1 掌握ChatGPT的基本操作


    `ChatGPT`是一款基于`AI`技术的聊天机器人，它可以模仿人类的语言行为，实现人机之间的自然语言交互。`ChatGPT`不仅可以互动问答，还可以通过自动化和优化流程来提高办公效率，帮助用户解决`Excel`数据处理中的各种难题，如编写`Excel`函数公式、创建表格、检查纠错以及分析项目数据等。


    本节将详细介绍`ChatGPT`的主要功能、聊天窗口、换行操作和改写命令操作，帮助大家尽快熟悉`ChatGPT`并掌握其基本操作。


    ### 001 掌握ChatGPT的主要功能


    ![](OEBPS/Images/image_001.jpg)


    扫码观看教学视频


    `ChatGPT`的主要功能是进行自然语言处理和生成，包括文本自动摘要、文本分类、对话生成、文本翻译、语音识别以及语音合成等。`ChatGPT`可以接收文本、语音等形式的输入，然后对其进行语言理解、分析和处理，最终生成相应的输出结果。


    `ChatGPT`基于深度学习和自然语言处理等技术，它采用类似于神经网络的模型进行训练和推理，模拟人类的语言处理和生成能力，可以处理大规模的自然语言数据，生成质量高、连贯性强的语言模型，具有广泛的应用前景。


    要使用`ChatGPT`，首先要注册一个`OpenAI`账号。登录`ChatGPT`后，将会打开一个聊天窗口，在此用户可以输入任何问题或话题，`ChatGPT`将尝试回答并提供与主题有关的信息。


    下面介绍在`ChatGPT`中初步生成内容的操作方法。


    **步骤 01** 打开`ChatGPT`的聊天窗口，单击底部的输入框，如图1-1所示。


    ![](OEBPS/Images/image_002.jpg)


    图1-1


    **步骤 02** 在输入框中输入相应的关键词或指令，例如“与`Excel`结合使用，你可以做些什么？”，如图1-2所示。


    ![](OEBPS/Images/image_003.jpg)


    图1-2


    **步骤 03** 单击输入框右侧的发送按钮 ![](OEBPS/Images/image_004.jpg)或按`Enter`键，即可与`ChatGPT`开始对话。`ChatGPT`会根据要求进行回复，向用户反馈它可以提供的功能和帮助，如图1-3所示。


    ![](OEBPS/Images/image_005.jpg)


    图1-3


