    ## 039 Determine Student Grade Levels with Multiple Conditions Using ChatGPT


    ![](img/image_248.jpg)


    Scan to watch tutorial video


    Example 038 introduced the method of using ChatGPT to write `IF` function formulas
    for calculations based on a single condition. Besides a single condition, the
    `IF` function can also be combined with the `AND` function to make judgments and
    calculations based on multiple conditions. The following takes determining student
    grade levels with multiple conditions as an example to introduce the method of
    using ChatGPT to write `IF` and `AND` function formulas.


    ### Step 01

    Open a worksheet, as shown in Figure 2-103. It is required to evaluate the grade
    levels of each student''s scores in column G: An average score of all subjects
    above 80, and no single subject score below 70 is "Excellent"; Average score above
    80, but with one or more subject scores below 70 is "Good"; Average score between
    60 and 79, and no single subject score below 60 is "Pass"; Having one subject
    score below 60 is "Fail".


    ![](img/image_249.jpg)


    Figure 2-103


    ### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In the worksheet,
    columns B to F are subject scores. Need to write a multi-condition judgment formula
    using `IF` and `AND` functions: Average score of all subjects above 80, and no
    single subject score below 70 is ''Excellent''; Average score above 80, if one
    or more subject scores below 70 is ''Good''; Average score between 60 and 79,
    and no single subject score below 60 is ''Pass'', one subject score below 60 is
    ''Fail''." Press Enter to send. ChatGPT will write the multi-condition judgment
    formula based on the question, as shown in Figure 2-104.


    ![](img/image_250.jpg)


    Figure 2-104


    ### Step 03

    Copy the function formula, return to the Excel worksheet, ![](img/image_251.jpg)
    paste the formula into cell `G2`: `=IF(AND(AVERAGE(B2:F2)>=80,MIN(B2:F2)>=70),"Excellent",IF(AND(AVERAGE(B2:F2)>=80,COUNTIF(B2:F2,"<70")>0),"Good",IF(AND(AVERAGE(B2:F2)>=60,MIN(B2:F2)>=60),"Pass","Fail")))`;
    ![](img/image_252.jpg) fill the formula down to cell `G7` to batch determine student
    grade levels. The result is shown in Figure 2-105.


    ![](img/image_253.jpg)


    Figure 2-105


    ## 040 Extract Start Time and End Time with ChatGPT


    ![](img/image_254.jpg)


    Scan to watch tutorial video


    In Excel, the `LEFT` function is used to extract a specified number of characters
    from the left side of a text string, and the `RIGHT` function is used to extract
    a specified number of characters from the right side of a text string. These two
    functions are commonly used for string truncation operations, facilitating the
    extraction of required information. The following takes extracting start time
    and end time as an example to introduce the operation method of using ChatGPT
    to write `LEFT` and `RIGHT` function formulas.


    ### Step 01

    Open a worksheet, as shown in Figure 2-106. The time in column A contains a total
    of 5 characters including numbers and symbols. It is required to extract the start
    time and end time of the activity process from column A respectively in the table.


    ![](img/image_255.jpg)


    Figure 2-106


    ### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In an Excel
    worksheet, the time is 5 characters long. How to write a formula each using `LEFT`
    and `RIGHT` functions to extract the start time and end time from column A?" Press
    Enter to send. ChatGPT will write the function formulas based on the question,
    as shown in Figure 2-107.


    ![](img/image_256.jpg)


    Figure 2-107


    ### Step 03

    Copy the `LEFT` function formula, return to the Excel worksheet, select the cell
    range `C2:C8`, ![](img/image_257.jpg) paste the formula into the formula bar and
    change the referenced `A1` to `A2`: `=LEFT(A2,5)`; ![](img/image_258.jpg) press
    the `Ctrl+Enter` shortcut key to batch extract start times, as shown in Figure
    2-108.


    ![](img/image_259.jpg)


    Figure 2-108


    ### Step 04

    Copy the `RIGHT` function formula, in the Excel worksheet, select the cell range
    `D2:D8`, ![](img/image_260.jpg) paste the formula into the formula bar and change
    the referenced `A1` to `A2`: `=RIGHT(A2,5)`; ![](img/image_261.jpg) press the
    `Ctrl+Enter` shortcut key to batch extract end times, as shown in Figure 2-109.


    ![](img/image_262.jpg)


    Figure 2-109


    # Chapter 3 Efficient Office Work: Processing Data with ChatGPT


    ## Learning Tips

    Efficient office work is an indispensable core competitiveness for modern enterprises
    and individuals. By leveraging the powerful functions of ChatGPT, especially its
    application in data screening, users can process data more efficiently, free up
    more time, and focus on more important work tasks.


    ## Chapter Highlights Navigation

    ![](img/image_263.png) Filter, Check, and Sort Data with ChatGPT

    ![](img/image_263.png) Extract Data with ChatGPT

    ![](img/image_263.png) Look Up Data with ChatGPT


    ## 3.1 Filter, Check, and Sort Data with ChatGPT

    In Excel, when the data content in a worksheet is large and dense, users can use
    ChatGPT to assist in filtering data, checking data, and sorting data. When using
    ChatGPT, users need to ensure they provide clear and explicit instructions so
    that it can better understand the user''s needs and provide accurate assistance.


    ### 041 Filter Useless Data with ChatGPT


    ![](img/image_264.jpg)


    Scan to watch tutorial video


    In Excel spreadsheet data processing, when the table data content is large, filtering
    out useless data is often a time-consuming and laborious task. However, with the
    help of ChatGPT''s intelligence and powerful data processing capabilities, this
    task can be significantly simplified. The following introduces the specific operations
    of filtering useless data using methods provided by ChatGPT through practical
    examples.


    #### Step 01

    Open a worksheet, as shown in Figure 3-1. It is required to filter out data with
    empty purchase records and delete them.


    ![](img/image_265.jpg)


    Figure 3-1


    #### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In an Excel
    worksheet, Column A is Customer Name, Column B is Member ID, Column C is Purchase
    Record. What method can be used to filter out customer data with empty purchase
    records and delete them?" Press Enter to send. ChatGPT will provide methods for
    filtering and deleting useless data, as shown in Figure 3-2.


    ![](img/image_266.jpg)


    Figure 3-2


    #### Step 03

    Referring to the method provided by ChatGPT, in the Excel worksheet, ![](img/image_267.jpg)
    select the cell range `A1:C1`; ![](img/image_268.jpg) click the "Filter" button
    in the "Sort & Filter" panel on the "Data" tab, as shown in Figure 3-3.


    #### Step 04

    After execution, filter dropdown buttons are added. ![](img/image_269.jpg) Click
    the filter dropdown button in cell `C1`; ![](img/image_270.jpg) in the expanded
    list box, uncheck the "(Select All)" checkbox and check the "(Blanks)" checkbox,
    as shown in Figure 3-4.


    ![](img/image_271.jpg)


    ▲Figure 3-3


    ![](img/image_272.jpg)


    Figure 3-4


    #### Step 05

    Click the "OK" button or press Enter to filter out rows with empty purchase records.
    ![](img/image_273.jpg) Hold down the `Ctrl` key and select the filtered data rows,
    right-click; ![](img/image_274.jpg) select the "Delete Row" command from the pop-up
    shortcut menu, as shown in Figure 3-5.


    #### Step 06

    After deleting the data rows, expand the filter list box, check the "(Select All)"
    checkbox, click the "OK" button to display all data. The result is shown in Figure
    3-6. At this point, data with empty purchase records has been deleted.


    ![](img/image_275.jpg)


