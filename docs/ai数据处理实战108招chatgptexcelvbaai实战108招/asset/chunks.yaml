    038例介绍了用ChatGPT编写`IF`函数公式按单个条件计算的操作方法，除了单个条件，`IF`函数还可以结合`AND`函数根据多个条件进行判断和计算。下面以多条件判断学生成绩等次为例，介绍用ChatGPT编写`IF`函数和`AND`函数公式的方法。


    ### 步骤 01

    打开一个工作表，如图2-103所示。需要在G列对各个学生的成绩进行等次评定：各科分数平均分为80以上，且没有一科分数低于70分的为优秀；平均分80分以上，如果有一科以上分数低于70分的为优良；平均分60到79分之间，且没有一科低于60分的为合格，有一科低于60分的为挂科。


