    **Step 03** Copy the calculation formula provided by ChatGPT. In the Excel worksheet,
    select the cell range `D2:D9`; paste the copied formula into the formula bar:


    ```excel

    =IF(COUNTIF($B$2:$B$100,B2)>1,"Duplicate","")

