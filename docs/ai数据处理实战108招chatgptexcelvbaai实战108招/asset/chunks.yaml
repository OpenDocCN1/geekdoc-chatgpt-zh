    #### 步骤 02

    打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，A列为文章标题，需要在B列将A列单元格中第6个字符开始的内容提取出来，可以用什么函数公式解决？”。按Enter键发送，ChatGPT即可提供提取标题的公式，如图3-23所示。


