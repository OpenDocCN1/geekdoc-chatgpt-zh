    ### 006 提供足够的数据源信息


    ![](OEBPS/Images/image_032.jpg)


    扫码观看教学视频


    在向`ChatGPT`提问时，如果用户的需求涉及处理特定的数据源或数据表，务必提供相关的数据源信息，以便`ChatGPT`更好地理解用户的问题。下面通过实例操作，向大家举例说明。


    **步骤 01** 打开一个`Excel`工作表，如图1-17所示。其中，`A2:A11`单元格区域为销售日期，`B2:B11`单元格区域为销售产品，`C2:C11`单元格区域为销售额，需要在`F`列根据销售产品统计销售总额。


    ![](OEBPS/Images/image_033.jpg)


    图1-17


    **步骤 02** 如果直接向`ChatGPT`提问“在`Excel`中如何根据销售产品计算销售总额？”，`ChatGPT`会回复一个可以套用的计算公式并进行公式解说，如图1-18所示。


    **步骤 03** 如果向`ChatGPT`提问时提供足够的数据源信息“我有一个包含销售数据的`Excel`工作表，其中`A2:A11`单元格区域为销售日期，`B2:B11`单元格区域为销售产品，`C2:C11`单元格区域为销售额。现在我想在`F2`、`F3`、`F4`单元格中根据`E2`、`E3`、`E4`单元格中的销售产品计算这些销售数据的总和，有什么公式可以帮助我实现？”，`ChatGPT`则会直接给出公式，如图1-19所示。


    ![](OEBPS/Images/image_034.jpg)


    ▲图1-18


    ![](OEBPS/Images/image_035.jpg)


    ▲图1-19


    ![](OEBPS/Images/image_036.jpg)


    图1-19（续）


    **步骤 04** 在第1个公式右上方单击`Copy code`（复制代码）按钮，如图1-20所示。


    ![](OEBPS/Images/image_037.jpg)


    图1-20


    **步骤 05** 返回`Excel`工作表，在`F2`单元格中按`Ctrl+V`快捷键粘贴，即可直接计算出产品A的销售总额，如图1-21所示。


    ![](OEBPS/Images/image_038.jpg)


    图1-21


    **步骤 06** 用同样的方法，复制公式并粘贴在`F3`、`F4`单元格中，计算产品B和产品C的销售总额，如图1-22所示。


