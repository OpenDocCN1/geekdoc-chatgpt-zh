    当向ChatGPT发送的指令或关键词有误或者不够精准时，可以对已发送的信息进行改写，具体操作如下。


    **步骤 01** 以例003为例，在聊天窗口中，单击已发送信息右侧的 ![](OEBPS/Images/image_022.jpg)按钮，如图1-12所示。


