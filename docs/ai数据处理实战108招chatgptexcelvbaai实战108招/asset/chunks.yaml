    扫码观看教学视频


    Excel中的公式无法直接根据单元格颜色进行数据筛选，但是可以使用ChatGPT编写VBA代码来遍历单元格并根据颜色进行数据筛选。下面介绍具体的操作方法。


    **步骤 01** 打开一个工作表，如图6-30所示。需要筛选有颜色的单元格数据。


