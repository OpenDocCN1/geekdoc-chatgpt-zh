    ## 1.2 正确向ChatGPT提问


    学完1.1节的内容，相信大家已经掌握了使用`ChatGPT`的基本操作方法。`ChatGPT`是一个语言模型，只要用户发送自己的所需所想，`ChatGPT`就会根据发送的问题进行回复。如果用户想要`ChatGPT`的回复内容更加精准、更加符合自己的需求，便需要多加注意正确的提问方式，以便可以更好地使用`ChatGPT`。


    ### 005 准确描述数据处理需求


    ![](OEBPS/Images/image_028.jpg)


    扫码观看教学视频


    在向`ChatGPT`提问时，要准确、清晰地描述在`Excel`中需要完成的具体任务或需求。具体、明确的提问有助于`ChatGPT`理解用户的意图，并给出准确的答案。


    例如，当用户需要在`Excel`工作表中创建一个可以显示销售数据和趋势的折线图时，如果直接向`ChatGPT`提问“在`Excel`中如何创建折线图？”，`ChatGPT`会给出一个比较笼统的回复，且回复的操作步骤并不完全正确，如图1-15所示。


    如果使用清晰的语言，指明需要什么类型的操作或分析，准确地向`ChatGPT`描述“如何在`Excel`中创建一个折线图以显示销售数据和销售趋势？”，`ChatGPT`则会给出更加精准的答复，操作描述也更加详细，如图1-16所示。


    ![](OEBPS/Images/image_029.jpg)


    ▲图1-15


    ![](OEBPS/Images/image_030.jpg)


    ▲图1-16


    ![](OEBPS/Images/image_031.jpg)


