    ### **086**


    ### **用ChatGPT编写模糊筛选的代码**


    ![](OEBPS/Images/image_609.jpg)


    扫码观看教学视频


    模糊筛选数据是指根据特定条件精确筛选或相似筛选数据，并将符合条件的数据提取到另一个地方。用ChatGPT编写VBA代码，可以在表格中将符合条件的数据筛选出来，帮助用户在大量数据中筛选出需要的部分内容。下面介绍具体的操作方法。


