    ## **6.2**


    ## **用ChatGPT编写查找、筛选、排序代码**


    除了用VBA代码对工作表和工作表中的数据进行拆分、合并，还可以用ChatGPT编写查找、筛选和排序代码，与Excel进行深度集成。


    ### **084**


    ### **用ChatGPT编写跨表查找值的代码**


    ![](OEBPS/Images/image_598.jpg)


    扫码观看教学视频


    用ChatGPT编写跨表查找值的代码的目的是能够在多个表格中快速查找特定的数据。代码会自动扫描给定范围，找到第一个匹配的数据，并将其位置进行反馈。这样，用户不必手动逐个搜索表格，而是通过代码来完成。下面介绍具体的操作方法。


    **步骤 01** 打开一个工作簿，其中Sheet1工作表为水果购买清单，Sheet2工作表为水果单价表，如图6-18所示。需要在Sheet2工作表中找到Sheet1工作表中水果对应的单价。


