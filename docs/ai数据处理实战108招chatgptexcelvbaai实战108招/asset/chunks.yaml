    **专家指点**


    在Excel中，当输入的公式为数组公式时，需要用Ctrl+Shift+Enter组合键将公式确认为数组公式。


    在Excel中数组公式是一种特殊的公式，用于在多个单元格范围内进行计算，并返回多个结果。这些公式通常涉及数组操作，如对范围内的每个单元格进行计算、汇总或筛选。在确认数组公式后，Excel会自动在公式周围添加大括号{}以表示结果是一个数组，无须手动输入大括号。


