    # **第4章**


    # **ChatGPT + Excel：智能加载AI助手**


    **学习提示**


    在Excel中，用户可以通过加载插件的方式，将AI助手ChatGPT直接接入Excel中进行使用。这种插件将为用户提供一个便捷的方式，将ChatGPT的强大语言处理能力整合到Excel的工作流程中。


    **本章重点导航** ![](OEBPS/Images/image_385.png)


    ##  加载ChatGPT插件 ![](OEBPS/Images/image_385.png)


    ##  使用ChatGPT AI函数


    ## **4.1**


    ## **加载ChatGPT插件**


    在Excel中加载ChatGPT插件，用户便可以在工作表中与ChatGPT进行对话，并利用其智能的自然语言理解和生成能力来执行各种任务。这种结合将大大提高用户在Excel中的工作效率，无须切换到其他应用程序或浏览器，用户可以直接在Excel中获取ChatGPT的帮助。本节主要介绍加载ChatGPT插件的操作方法。


    ### **054**


    ### **加载ChatGPT插件**


    ![](OEBPS/Images/image_386.jpg)


    扫码观看教学视频


    在Excel中，用户可以通过“插入”功能区中的“获取加载项”功能接入ChatGPT插件。下面介绍具体的操作方法。


    **步骤 01** 打开一个空白工作表，在“插入”功能区的“加载项”面板中单击“获取加载项”按钮，如图4-1所示。


    **步骤 02** 执行操作后，弹出“Office加载项”对话框，如图4-2所示。其中显示了多款热门插件，有免费的插件，也有需要花钱购买的插件。


    ![](OEBPS/Images/image_387.jpg)


    ▲图4-1


    ![](OEBPS/Images/image_388.jpg)


    图4-2


    **步骤 03** 在搜索框中输入ChatGPT，如图4-3所示。


    **步骤 04** 单击“搜索”按钮 ![](OEBPS/Images/image_389.jpg)，即可搜索到与ChatGPT相关的插件。在ChatGPT for Excel插件右侧单击“添加”按钮，如图4-4所示。


    **步骤 05** 弹出“请稍等”对话框，单击“继续”按钮，如图4-5所示。


    **步骤 06** 稍等片刻，即可加载ChatGPT插件。将其接入Excel中，在“开始”功能区的最后面，即可显示ChatGPT for Excel插件图标，如图4-6所示。


    ![](OEBPS/Images/image_390.jpg)


    ▲图4-3


    ![](OEBPS/Images/image_391.jpg)


    ▲图4-4


    ![](OEBPS/Images/image_392.jpg)


    图4-5


    **步骤 07** 单击ChatGPT for Excel插件图标，即可展开ChatGPT for Excel插件面板。用户需要在面板下方的Your OpenAI API Key（您的OpenAI API密钥）文本框中输入密钥才可以使用ChatGPT for Excel插件，如图4-7所示。


