    图6-18


    **步骤 02** 打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel的Sheet1工作表中，A列为各类水果、B列为水果单价，在Sheet2工作表中，B列为各类水果、C列为水果单价，需要编写一段VBA代码，从Sheet2工作表中查找并返回Sheet1工作表中各类水果所对应的单价”。按Enter键发送，ChatGPT即可编写跨表查找值的代码，如图6-19所示。


    ![](OEBPS/Images/image_600.jpg)


    ▲图6-19


    ![](OEBPS/Images/image_601.jpg)


    图6-19（续）


    **步骤 03** 复制ChatGPT编写的代码，返回Excel工作表，打开VBA编辑器，插入一个新的模块，在其中粘贴复制的代码，如图6-20所示。


    **步骤 04** 运行宏代码，关闭VBA编辑器，即可在Sheet1工作表中匹配水果单价，结果如图6-21所示。


    ![](OEBPS/Images/image_602.jpg)


    ▲图6-20


