    # **第1章**


    # **AI助手：正确使用ChatGPT**


    **学习提示**


    AI助手是指基于人工智能技术，能够人机交互、为用户提供各种服务和帮助的虚拟助手。ChatGPT便是这样一款能够实现人机交互的AI工具。ChatGPT具体有什么作用？该如何使用它呢？本章就来带领大家认识一下它。


