    ## **1.2**


    ## **正确向ChatGPT提问**


    学完1.1节的内容，相信大家已经掌握了使用ChatGPT的基本操作方法。ChatGPT是一个语言模型，只要用户发送自己的所需所想，ChatGPT就会根据发送的问题进行回复。如果用户想要ChatGPT的回复内容更加精准、更加符合自己的需求，便需要多加注意正确的提问方式，以便可以更好地使用ChatGPT。


    ### **005**


    ### **准确描述数据处理需求**


    ![](OEBPS/Images/image_028.jpg)


    扫码观看教学视频


    在向ChatGPT提问时，要准确、清晰地描述在Excel中需要完成的具体任务或需求。具体、明确的提问有助于ChatGPT理解用户的意图，并给出准确的答案。


    例如，当用户需要在Excel工作表中创建一个可以显示销售数据和趋势的折线图时，如果直接向ChatGPT提问“在Excel中如何创建折线图？”，ChatGPT会给出一个比较笼统的回复，且回复的操作步骤并不完全正确，如图1-15所示。


    如果使用清晰的语言，指明需要什么类型的操作或分析，准确地向ChatGPT描述“如何在Excel中创建一个折线图以显示销售数据和销售趋势？”，ChatGPT则会给出更加精准的答复，操作描述也更加详细，如图1-16所示。


    ![](OEBPS/Images/image_029.jpg)


    ▲图1-15


    ![](OEBPS/Images/image_030.jpg)


    ▲图1-16


    ![](OEBPS/Images/image_031.jpg)


    图1-16（续）


    ### **006**


    ### **提供足够的数据源信息**


    ![](OEBPS/Images/image_032.jpg)


    扫码观看教学视频


    在向ChatGPT提问时，如果用户的需求涉及处理特定的数据源或数据表，务必提供相关的数据源信息，以便ChatGPT更好地理解用户的问题。下面通过实例操作，向大家举例说明。


    **步骤 01** 打开一个Excel工作表，如图1-17所示。其中，A2:A11单元格区域为销售日期，B2:B11单元格区域为销售产品，C2:C11单元格区域为销售额，需要在F列根据销售产品统计销售总额。


    ![](OEBPS/Images/image_033.jpg)


    图1-17


    **步骤 02** 如果直接向ChatGPT提问“在Excel中如何根据销售产品计算销售总额？”，ChatGPT会回复一个可以套用的计算公式并进行公式解说，如图1-18所示。


    **步骤 03** 如果向ChatGPT提问时提供足够的数据源信息“我有一个包含销售数据的Excel工作表，其中A2:A11单元格区域为销售日期，B2:B11单元格区域为销售产品，C2:C11单元格区域为销售额。现在我想在F2、F3、F4单元格中根据E2、E3、E4单元格中的销售产品计算这些销售数据的总和，有什么公式可以帮助我实现？”，ChatGPT则会直接给出公式，如图1-19所示。


    ![](OEBPS/Images/image_034.jpg)


    ▲图1-18


    ![](OEBPS/Images/image_035.jpg)


    ▲图1-19


    ![](OEBPS/Images/image_036.jpg)


    图1-19 （续）


    **步骤 04** 在第1个公式右上方单击Copy code（复制代码）按钮，如图1-20所示。


    ![](OEBPS/Images/image_037.jpg)


    图1-20


    **步骤 05** 返回Excel工作表，在F2单元格中按Ctrl+V快捷键粘贴，即可直接计算出产品A的销售总额，如图1-21所示。


    ![](OEBPS/Images/image_038.jpg)


    图1-21


    **步骤 06** 用同样的方法，复制公式并粘贴在F3、F4单元格中，计算产品B和产品C的销售总额，如图1-22所示。


    ![](OEBPS/Images/image_039.jpg)


    图1-22


    ### **007**


    ### **通过模拟案例获取操作指引**


    ![](OEBPS/Images/image_040.jpg)


    扫码观看教学视频


    当用户不方便提供数据源时，为了让ChatGPT更好地理解问题，可以提供一个具体的模拟案例，并描述所需要的结果，以此获取ChatGPT的答复。下面介绍具体的操作方法。


    **步骤 01** 打开一个ChatGPT的聊天窗口，在输入框中输入指令“假设我有一个包含学生考试成绩的Excel表格，现在我想计算每个学生的平均成绩。例如，表格中的数据如下（尽量将行列对齐）：


    ![](OEBPS/Images/image_041.jpg)


    请问，有什么公式可以帮我计算每个学生的平均成绩？”，如图1-23所示。'
