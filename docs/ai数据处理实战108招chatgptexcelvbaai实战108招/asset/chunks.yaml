    ### 042 Assist in Checking Data with ChatGPT


    ![](img/image_277.jpg)


    Scan to watch tutorial video


    Using ChatGPT to assist in checking data in an Excel worksheet can efficiently
    discover errors and problems, ensure data quality, and allow users to work more
    accurately and reliably. The following introduces the operation method of using
    ChatGPT to assist in checking data.


    #### Step 01

    Open a worksheet, as shown in Figure 3-7. It is required to check whether there
    are blank cells in the worksheet, i.e., whether any information has not been filled
    in.


    ![](img/image_278.jpg)


    Figure 3-7


    #### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In Excel, use
    a function formula to check if cells `A2:E9` all have input data. If there are
    blank cells, prompt ''Data not filled'' in cells `F2:F9`." Press Enter to send.
    ChatGPT will write a checking formula, as shown in Figure 3-8.


    ![](img/image_279.jpg)


    Figure 3-8


    #### Step 03

    Copy the formula written by ChatGPT, return to the Excel worksheet, select the
    cell range `F2:F9`, ![](img/image_280.jpg) paste in the formula bar: `=IF(COUNTBLANK(A2:E2)>0,"Data
    not filled","")`; ![](img/image_281.jpg) press the `Ctrl+Enter` shortcut key to
    batch check for unfilled data. The result is shown in Figure 3-9.


    ![](img/image_282.jpg)


