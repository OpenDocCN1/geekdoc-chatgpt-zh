    复制函数公式，返回Excel工作表，![](OEBPS/Images/image_251.jpg)将公式粘贴在`G2`单元格中：`=IF(AND(AVERAGE(B2:F2)>=80,MIN(B2:F2)>=70),"优秀",IF(AND(AVERAGE(B2:F2)>=80,COUNTIF(B2:F2,"<70")>0),"优良",IF(AND(AVERAGE(B2:F2)>=60,MIN(B2:F2)>=60),"合格","挂科")))`；![](OEBPS/Images/image_252.jpg)将公式填充至`G7`单元格，批量判断学生成绩等次，结果如图2-105所示。


