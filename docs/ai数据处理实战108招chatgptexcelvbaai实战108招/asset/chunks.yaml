    ## 3.2 Extract Data with ChatGPT

    Data extraction refers to extracting specific information or data from table text
    for further analysis and processing. Users can combine methods and calculation
    formulas provided by ChatGPT to extract data in Excel.


    ### 044 Extract Title After Name with ChatGPT


    ![](img/image_292.jpg)


    Scan to watch tutorial video


    In an Excel spreadsheet, when employee names and titles are in the same cell,
    users can ask ChatGPT for methods to extract titles separately. The following
    introduces the specific operations.


    #### Step 01

    Open a worksheet, as shown in Figure 3-18. In column B cells, a space separates
    the name and title. It is required to extract the title from column B separately
    into column D.


    ![](img/image_293.jpg)


    Figure 3-18


    #### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In an Excel
    worksheet, Column B contains employee name and title, separated by a space, e.g.,
    ''Zhou Xi Manager'', where ''Zhou Xi'' is the name and ''Manager'' is the title.
    Need to extract the title from Column B into Column D. What method can solve this?"
    Press Enter to send. ChatGPT will provide a formula for extracting the title,
    as shown in Figure 3-19.


    ![](img/image_294.jpg)


    Figure 3-19


    #### Step 03

    Copy the extraction formula provided by ChatGPT. In the Excel worksheet, ![](img/image_295.jpg)
    select the cell range `D2:D9`; ![](img/image_296.jpg) paste the copied formula
    into the formula bar: `=RIGHT(B2,LEN(B2)-FIND("",B2))`, as shown in Figure 3-20.


    ![](img/image_297.jpg)


    Figure 3-20


    #### Step 04

    Press the `Ctrl+Enter` shortcut key to confirm. The titles after employee names
    can be batch extracted. The result is shown in Figure 3-21.


    ![](img/image_298.jpg)


    Figure 3-21


    ### 045 Extract Title at Specified Position with ChatGPT


    ![](img/image_299.jpg)


    Scan to watch tutorial video


    In Excel, when the format and position of the content to be batch extracted are
    consistent, you can let ChatGPT use function formulas to perform the extraction.
    For example, the title text format in the table is "XXXX：XXXXXX", the prefix name
    is 5 characters long, and you need to extract the content after the prefix name.
    Then you can specify extracting the remaining content starting from the 6th character.
    The following introduces the operation method of using ChatGPT to extract titles
    at specified positions.


    #### Step 01

    Open a worksheet, as shown in Figure 3-22. In column A cells, article titles all
    have 4 Chinese characters as a prefix name, plus a colon, making the prefix name
    5 characters in total. It is required to extract the title content starting from
    the 6th character into column B cells.


    ![](img/image_300.jpg)


    Figure 3-22


    #### Step 02

    Open the ChatGPT chat window, enter the prompt in the input box: "In an Excel
    worksheet, Column A contains article titles. Need to extract content starting
    from the 6th character of Column A cells into Column B. What function formula
    can solve this?" Press Enter to send. ChatGPT will provide a formula for extracting
    the title, as shown in Figure 3-23.


    ![](img/image_301.jpg)


    Figure 3-23


    #### Step 03

    Copy the extraction formula provided by ChatGPT. In the Excel worksheet, ![](img/image_302.jpg)
    select the cell range `B2:B6`; ![](img/image_303.jpg) paste the copied formula
    into the formula bar and change `A1` to `A2`: `=MID(A2,6,LEN(A2)-5)`, as shown
    in Figure 3-24.


    #### Step 04

    Press the `Ctrl+Enter` shortcut key to confirm. The title content at the specified
    position can be batch extracted. The result is shown in Figure 3-25.


    ![](img/image_304.jpg)


    ▲Figure 3-24


    ![](img/image_305.jpg)


    Figure 3-25


