    ### **055**


    ### **获取OpenAI API Key（密钥）**


    ![](OEBPS/Images/image_395.jpg)


    扫码观看教学视频


    OpenAI是一个人工智能研究实验室和技术公司，而ChatGPT是OpenAI开发的一种基于自然语言处理的语言模型。在Excel中接入ChatGPT，需要使用到OpenAI API Key（密钥）。下面介绍获取密钥的操作方法。


    **步骤 01** 首先需要用户访问ChatGPT的网站并登录账号，然后进入OpenAI官网，在网页右上角单击Log in（登录）按钮，如图4-8所示。


    ![](OEBPS/Images/image_396.jpg)


    图4-8


    **步骤 02** 执行操作后，进入OpenAI页面，选择进入API模块，如图4-9所示。


    ![](OEBPS/Images/image_397.jpg)


    图4-9


    **步骤 03** 因前面已经访问并登录了ChatGPT，所以此处会自动登录OpenAI账号，如果跳过登录ChatGPT直接进入OpenAI网页，此处则需要先登录OpenAI账号。
    ![](OEBPS/Images/image_398.jpg)在右上角单击账号头像； ![](OEBPS/Images/image_399.jpg)在弹出的列表框中选择View API keys（查看API密钥）选项，如图4-10所示。


    **步骤 04** 进入API keys页面，在表格中显示了之前获取过的密钥记录，此处单击Create new secret key（创建新密钥）按钮，如图4-11所示。


