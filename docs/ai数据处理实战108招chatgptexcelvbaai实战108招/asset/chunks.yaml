    # Chapter 1 AI Assistant: Correctly Using ChatGPT


    ## Learning Tips


    An `AI` assistant refers to a virtual assistant based on artificial intelligence
    technology, capable of human-computer interaction and providing various services
    and assistance to users. `ChatGPT` is such an `AI` tool that can realize human-computer
    interaction. What specific functions does `ChatGPT` have? How to use it? This
    chapter will lead everyone to get to know it.


    ## Chapter Key Navigation


    ![Icon](img/image_000.png) Master `ChatGPT` Basic Operations

    ![Icon](img/image_000.png) Correctly Ask `ChatGPT` Questions

    ![Icon](img/image_000.png) Learn Common `Excel` Operations with `ChatGPT`


    ## 1.1 Mastering ChatGPT Basic Operations


    `ChatGPT` is a chatbot based on `AI` technology. It can imitate human language
    behavior and realize natural language interaction between humans and computers.
    `ChatGPT` can not only interact via Q&A but also improve office efficiency through
    automation and process optimization, helping users solve various problems in `Excel`
    data processing, such as writing `Excel` function formulas, creating tables, checking
    and correcting errors, and analyzing project data.


    This section will detail the main functions, chat window, line break operations,
    and rewrite command operations of `ChatGPT`, helping everyone quickly familiarize
    themselves with `ChatGPT` and master its basic operations.


    ### 001 Mastering ChatGPT Main Functions


    ![](img/image_001.jpg)


    Scan to Watch Tutorial Video


    The main functions of `ChatGPT` are natural language processing and generation,
    including automatic text summarization, text classification, dialogue generation,
    text translation, speech recognition, and speech synthesis, etc. `ChatGPT` can
    receive inputs in forms such as text and speech, then perform language understanding,
    analysis, and processing, and finally generate corresponding output results.


    `ChatGPT` is based on deep learning and natural language processing technologies.
    It uses a model similar to a neural network for training and reasoning, simulating
    human language processing and generation capabilities. It can handle large-scale
    natural language data and generate high-quality, coherent language models, with
    broad application prospects.


    To use `ChatGPT`, you first need to register an `OpenAI` account. After logging
    into `ChatGPT`, a chat window will open where users can input any questions or
    topics, and `ChatGPT` will attempt to answer and provide information related to
    the topic.


    Below introduces the operation method for initially generating content in `ChatGPT`.


    **Step 01** Open the `ChatGPT` chat window, click the input box at the bottom,
    as shown in Figure 1-1.


    ![](img/image_002.jpg)


    Figure 1-1


    **Step 02** Enter corresponding keywords or commands in the input box, for example
    "What can you do when combined with `Excel`?", as shown in Figure 1-2.


    ![](img/image_003.jpg)


    Figure 1-2


    **Step 03** Click the send button ![](img/image_004.jpg) on the right side of
    the input box or press the `Enter` key to start a conversation with `ChatGPT`.
    `ChatGPT` will reply according to the requirements, feeding back the functions
    and help it can provide to the user, as shown in Figure 1-3.


    ![](img/image_005.jpg)


    Figure 1-3


