    在ChatGPT插件面板中，所提示的各个AI函数作用如下。


    ◎ =AI.ASK：可以获取问题的答案。


    ◎ =AI.LIST：可以将行数据合并生成列表输出。


    ◎ =AI.FILL：可以填充不完整的范围，自动生成或填充连续的序列。


    ◎ =AI.EXTRACT：可以提取特定类型的数据。


    ◎ =AI.FORMAT：可以将数值和日期格式转换为指定的格式。


    ◎ =AI.TRANSLATE：可以将文本从一种语言翻译成另一种语言。


    ## **4.2**


    ## **使用ChatGPT AI函数**


    ChatGPT插件提供了6个AI函数，用户可以在Excel工作表中使用这些AI函数，从而获取AI生成的答案。本节将向大家介绍在Excel工作表中使用ChatGPT AI函数的操作方法。


    ### **057**


    ### **用AI.ASK函数获取数据分析结果**


    ![](OEBPS/Images/image_410.jpg)


    扫码观看教学视频


    在Excel中，用户可以通过AI.ASK函数在任意一个单元格中向ChatGPT进行提问并获取对应的答案。下面介绍用AI.ASK函数编写公式向ChatGPT询问产品销售分析结果的具体操作方法。


    **步骤 01** 打开一个工作表，如图4-16所示。其中，B1单元格中已列出了需要向ChatGPT提出的问题。


    ![](OEBPS/Images/image_411.jpg)


    图4-16


    **步骤 02** 在B2单元格中输入AI函数公式：=AI.ASK(B1)，如图4-17所示。


    ![](OEBPS/Images/image_412.jpg)


    图4-17


    **步骤 03** 按Enter键确认，若单元格中显示＃BUSY！，则表示正在加载回复中，如图4-18所示。


    ![](OEBPS/Images/image_413.jpg)


    图4-18


    **步骤 04** 稍等片刻，即可在B2单元格中获取ChatGPT的数据分析结果，如图4-19所示。


    ![](OEBPS/Images/image_414.jpg)


    图4-19


    **专家指点**


    如果用户不知道该如何使用ChatGPT AI函数，可以在ChatGPT for Excel插件面板中选择Examples Spreadsheet（示例电子表格）选项，在跳转的网页中，查看并学习AI函数示例，参考示例的公式使用即可。


    ### **058**


    ### **用AI.EXTRACT函数提取指定内容**


    ![](OEBPS/Images/image_415.jpg)


    扫码观看教学视频


    在Excel中，用户可以通过AI.EXTRACT函数从文本中提取指定类型的信息。该函数可以帮助用户自动识别和提取文本中的关键词、日期以及地址等重要信息，以便进一步分析和处理。下面介绍使用AI.EXTRACT函数提取指定内容的具体操作方法。


    **步骤 01** 打开一个工作表，如图4-20所示。需要在A列单元格的文本中提取B列单元格中指定要提取的内容。


    ![](OEBPS/Images/image_416.jpg)


    图4-20


    **步骤 02** 在C2单元格中输入AI函数公式：=AI.EXTRACT(A2,B2)，如图4-21所示。


    ![](OEBPS/Images/image_417.jpg)


    图4-21


    **步骤 03** 按Enter键确认，即可提取A2单元格文本中的城市，如图4-22所示。


    ![](OEBPS/Images/image_418.jpg)


    图4-22


    **步骤 04** 执行操作后，拖曳C2单元格的右下角，填充公式至C7单元格，批量提取指定内容，如图4-23所示。


    ![](OEBPS/Images/image_419.jpg)


    图4-23


    **专家指点**


    如果返回结果显示API error（code 429）-Too Many Requests ［API错误（代码429）-请求太多］，可以稍等一会儿再选择相应的单元格，在编辑栏中单击，然后多按几次Enter键，返回提取内容。


    ### **059**


    ### **用AI.FILL函数自动生成连续序列**


    ![](OEBPS/Images/image_420.jpg)


    扫码观看教学视频


    在Excel中，AI函数AI.FILL的作用是自动生成连续序列或填充单元格中的重复模式。该函数可以帮助用户快速生成数字序列、日期序列、自定义文本序列或重复模式，并填充到指定的单元格范围中。下面介绍使用AI.FILL函数自动生成连续序列的具体操作方法。


    **步骤 01** 打开一个工作表，如图4-24所示。需要在A列单元格中生成连续的序号。


    **步骤 02** 在A2单元格中输入起始值为1，如图4-25所示。


    ![](OEBPS/Images/image_421.jpg)


    ▲图4-24


    ![](OEBPS/Images/image_422.jpg)


    图4-25


    **步骤 03** 在A3单元格中输入AI函数公式：=AI.FILL(A2,10)，如图4-26所示，表示起始值为A2单元格中的值，向后填充10个单元格。


    **步骤 04** 按Enter键确认，即可生成连续的序号，如图4-27所示。


    ![](OEBPS/Images/image_423.jpg)


    ▲图4-26


    ![](OEBPS/Images/image_424.jpg)


    图4-27


    ### **060**


    ### **用AI.FORMAT函数转换数据格式**


    ![](OEBPS/Images/image_425.jpg)


    扫码观看教学视频


    在Excel中，AI函数AI.FORMAT主要用于将数值或日期格式转换为指定的格式。该函数可以帮助用户根据需求自定义数值或日期的显示方式，包括小数位数、千位分隔符、货币符号和日期格式等。下面介绍使用AI.FORMAT函数转换数据格式的具体操作方法。


    **步骤 01** 打开一个工作表，如图4-28所示。需要将A列单元格中的数据格式转换为B列单元格中指定的格式。


    **步骤 02** 选择C2单元格，在编辑栏中输入AI函数公式：=AI.FORMAT (A2,B2)，如图4-29所示。


    ![](OEBPS/Images/image_426.jpg)


    ▲图4-28


    ![](OEBPS/Images/image_427.jpg)


    图4-29


    **步骤 03** 按Enter键确认，即可转换A2单元格中的数据格式为B2单元格中指定的格式，如图4-30所示。


    **步骤 04** 执行上述操作后，拖曳C2单元格的右下角，填充公式至C6单元格中，即可批量转换数据格式，如图4-31所示。


    ![](OEBPS/Images/image_428.jpg)


    ▲图4-30


    ![](OEBPS/Images/image_429.jpg)


    图4-31


    **专家指点**


    编写AI.FORMAT函数公式时，第1个参数为值，第2个参数为格式。如果表格中没有提供指定的格式，可以将格式编写进公式中。例如，在C2单元格中输入公式：=AI.FORMAT(A2,"0000年00月00日")，按Enter键确认，即可转换格式。


    ### **061**


    ### **用AI.LIST函数合并每行文本内容**


    ![](OEBPS/Images/image_430.jpg)


    扫码观看教学视频


    在Excel中，AI函数AI.LIST的作用是将一系列数值或文本合并成一个字符串，方便进行后续处理或显示。下面介绍使用AI.LIST函数合并每行文本内容的具体操作方法。


    **步骤 01** 打开一个工作表，如图4-32所示。需要将A列单元格中的文本内容合并到B列单元格中并用顿号间隔每行文本。


    **步骤 02** 在B2单元格中输入AI函数公式：=AI.LIST("合并文本",A2:A6)，如图4-33所示。


    **步骤 03** 按Enter键确认，即可将A2:A6单元格区域的文本合并到一起，并用顿号进行间隔区分，如图4-34所示。


    ![](OEBPS/Images/image_431.jpg)


    ▲图4-32


    ![](OEBPS/Images/image_432.jpg)


    ▲图4-33


    ![](OEBPS/Images/image_433.jpg)


    图4-34


    ### **062**


    ### **用AI.TRANSLATE函数翻译文本**


    ![](OEBPS/Images/image_434.jpg)


    扫码观看教学视频


    在Excel中，AI函数AI.TRANSLATE的作用是将指定的文本根据提供的翻译词典进行翻译，可以帮助用户在Excel中实现文本翻译的功能。下面介绍使用AI.TRANSLATE函数翻译文本的操作方法。


    **步骤 01** 打开一个工作表，如图4-35所示。工作表中提供了中文和英文词汇，需要将中文翻译成英文，将英文翻译成中文。


    ![](OEBPS/Images/image_435.jpg)


