    ## **3.1**


    ## **用ChatGPT筛选、检查、排序数据**


    在Excel中，当工作表中的数据内容较多、较密时，用户可以用ChatGPT协助筛选数据、检查数据以及对数据进行排序等操作。在使用ChatGPT时，用户需要确保提供清晰明确的指令，以便它能够更好地理解用户的所需所求，提供准确的帮助。


    ### **041**


    ### **用ChatGPT筛选无用数据**


    ![](OEBPS/Images/image_264.jpg)


    扫码观看教学视频


    在Excel表格数据处理中，当表格数据内容较多时，筛选出无用数据常常是一个费时费力的任务。然而，借助ChatGPT的智能和强大的数据处理能力，这一任务可以得到显著简化。下面通过实例向大家介绍用ChatGPT提供的方法筛选无用数据的具体操作。


    **步骤 01** 打开一个工作表，如图3-1所示。需要将购买记录为空的数据筛选出来并删除。


    ![](OEBPS/Images/image_265.jpg)


    图3-1


    **步骤 02** 打开ChatGPT的聊天窗口，在输入框中输入指令“在Excel工作表中，A列为客户姓名、B列为会员ID、C列为购买记录，可以用什么方法筛选出购买记录为空的客户数据并删除？”。按Enter键发送，ChatGPT即可提供筛选并删除无用数据的方法，如图3-2所示。


    ![](OEBPS/Images/image_266.jpg)


    图3-2


    **步骤 03** 参考ChatGPT提供的方法，在Excel工作表中， ![](OEBPS/Images/image_267.jpg)选择A1:C1单元格区域；
    ![](OEBPS/Images/image_268.jpg)在“数据”功能区的“排序和筛选”面板中单击“筛选”按钮，如图3-3所示。


    **步骤 04** 执行操作后，即可添加筛选下拉按钮， ![](OEBPS/Images/image_269.jpg)单击C1单元格中的筛选下拉按钮； ![](OEBPS/Images/image_270.jpg)在展开的列表框中取消选中“（全选）”复选框并选中“（空白）”复选框，如图3-4所示。


    ![](OEBPS/Images/image_271.jpg)


    ▲图3-3


    ![](OEBPS/Images/image_272.jpg)


    图3-4


