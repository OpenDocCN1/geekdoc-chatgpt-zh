    ### **022**


    ### **快速建立运算公式**


    ![](OEBPS/Images/image_106.jpg)


    扫码观看教学视频


    在Excel中统计数据不需要用户手动计算再输入单元格中，只需要在单元格中建立正确的公式，然后交给Excel自动计算即可快速获得结果。在Excel中建立公式主要有两种方式：一种是跟数学公式一样，利用加减乘除运算符号，引用单元格进行计算；一种是利用函数，通过参数条件编写符合函数语法的公式，执行特定的计算。


    下面将向大家介绍在Excel中快速建立公式的操作方法。


    **步骤 01** 打开一个工作表，如图2-14所示。需要在工作表中统计各种商品的总销售额。


    **步骤 02** 在建立公式前，首先需要在工作表中理清楚数据，哪些单元格中的数据是用来计算的，哪些单元格中的数据是需要忽略的。例如，在本例中，总销售额只需要使用单价与销售数量相乘，如果表格中有多余的数据，忽略即可。


    **步骤 03** 在工作表中选择B4单元格，在其中输入“=”符号，如图2-15所示。


