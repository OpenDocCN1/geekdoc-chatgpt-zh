    ◎ `=AI.ASK`: Get answers to questions.

    ◎ `=AI.LIST`: Merge row data to generate list output.

    ◎ `=AI.FILL`: Fill incomplete ranges, automatically generate or fill continuous
    sequences.

    ◎ `=AI.EXTRACT`: Extract specific types of data.

    ◎ `=AI.FORMAT`: Convert numbers and date formats to specified formats.

    ◎ `=AI.TRANSLATE`: Translate text from one language to another.


    ### 4.2 Using ChatGPT AI Functions


    The ChatGPT add-in provides 6 AI functions. Users can use these AI functions in
    Excel worksheets to obtain AI-generated answers. This section will introduce the
    operation methods for using ChatGPT AI functions in Excel worksheets.


    #### 057 Use AI.ASK Function to Get Data Analysis Results


    ![](img/image_410.jpg)


    Scan to watch tutorial video


    In Excel, users can ask ChatGPT questions in any cell and get corresponding answers
    through the `AI.ASK` function. The specific operation method for writing a formula
    with the `AI.ASK` function to ask ChatGPT for product sales analysis results is
    described below.


    **Step 01** Open a worksheet, as shown in Figure 4-16. Cell B1 lists the question
    to be asked to ChatGPT.


    ![](img/image_411.jpg)


    Figure 4-16


    **Step 02** Enter the AI function formula in cell B2: `=AI.ASK(B1)`, as shown
    in Figure 4-17.


    ![](img/image_412.jpg)


    Figure 4-17


    **Step 03** Press the `Enter` key to confirm. If `#BUSY!` appears in the cell,
    it indicates that the reply is loading, as shown in Figure 4-18.


    ![](img/image_413.jpg)


    Figure 4-18


    **Step 04** Wait a moment to get ChatGPT''s data analysis results in cell B2,
    as shown in Figure 4-19.


    ![](img/image_414.jpg)


    Figure 4-19


    **Expert Tips**


    If users don''t know how to use ChatGPT AI functions, they can select the `Examples
    Spreadsheet` option in the `ChatGPT for Excel` add-in pane, and view and learn
    AI function examples on the redirected webpage, referencing the example formulas
    for use.


    #### 058 Use AI.EXTRACT Function to Extract Specified Content


    ![](img/image_415.jpg)


    Scan to watch tutorial video


    In Excel, users can extract specified types of information from text through the
    `AI.EXTRACT` function. This function helps users automatically identify and extract
    keywords, dates, addresses, and other important information from text for further
    analysis and processing. The specific operation method for using the `AI.EXTRACT`
    function to extract specified content is described below.


    **Step 01** Open a worksheet, as shown in Figure 4-20. Need to extract the content
    specified in column B cells from the text in column A cells.


    ![](img/image_416.jpg)


    Figure 4-20


    **Step 02** Enter the AI function formula in cell C2: `=AI.EXTRACT(A2,B2)`, as
    shown in Figure 4-21.


    ![](img/image_417.jpg)


    Figure 4-21


    **Step 03** Press the `Enter` key to confirm to extract the city from the text
    in cell A2, as shown in Figure 4-22.


    ![](img/image_418.jpg)


    Figure 4-22


    **Step 04** After performing the operation, drag the fill handle at the lower
    right corner of cell C2 to fill the formula down to cell C7 to batch extract specified
    content, as shown in Figure 4-23.


    ![](img/image_419.jpg)


    Figure 4-23


    **Expert Tips**


    If the returned result shows `API error (code 429) - Too Many Requests`, you can
    wait a moment, then select the corresponding cell, click in the formula bar, and
    press the `Enter` key several times to return the extracted content.


    #### 059 Use AI.FILL Function to Automatically Generate Continuous Sequences


    ![](img/image_420.jpg)


    Scan to watch tutorial video


    In Excel, the AI function `AI.FILL` is used to automatically generate continuous
    sequences or fill repeating patterns in cells. This function helps users quickly
    generate number sequences, date sequences, custom text sequences, or repeating
    patterns and fill them into specified cell ranges. The specific operation method
    for using the `AI.FILL` function to automatically generate continuous sequences
    is described below.


    **Step 01** Open a worksheet, as shown in Figure 4-24. Need to generate continuous
    serial numbers in column A cells.


    **Step 02** Enter the starting value 1 in cell A2, as shown in Figure 4-25.


    ![](img/image_421.jpg)


    ▲Figure 4-24


    ![](img/image_422.jpg)


    Figure 4-25


    **Step 03** Enter the AI function formula in cell A3: `=AI.FILL(A2,10)`, as shown
    in Figure 4-26, indicating the starting value is the value in cell A2, filling
    10 cells backward.


    **Step 04** Press the `Enter` key to confirm to generate continuous serial numbers,
    as shown in Figure 4-27.


    ![](img/image_423.jpg)


    ▲Figure 4-26


    ![](img/image_424.jpg)


    Figure 4-27


    #### 060 Use AI.FORMAT Function to Convert Data Formats


    ![](img/image_425.jpg)


    Scan to watch tutorial video


    In Excel, the AI function `AI.FORMAT` is mainly used to convert numbers or date
    formats to specified formats. This function helps users customize the display
    of numbers or dates according to needs, including decimal places, thousands separators,
    currency symbols, and date formats, etc. The specific operation method for using
    the `AI.FORMAT` function to convert data formats is described below.


    **Step 01** Open a worksheet, as shown in Figure 4-28. Need to convert the data
    format in column A cells to the format specified in column B cells.


    **Step 02** Select cell C2, enter the AI function formula in the formula bar:
    `=AI.FORMAT(A2,B2)`, as shown in Figure 4-29.


    ![](img/image_426.jpg)


    ▲Figure 4-28


    ![](img/image_427.jpg)


    Figure 4-29


    **Step 03** Press the `Enter` key to confirm to convert the data format in cell
    A2 to the format specified in cell B2, as shown in Figure 4-30.


    **Step 04** After performing the above operation, drag the fill handle at the
    lower right corner of cell C2 to fill the formula down to cell C6 to batch convert
    data formats, as shown in Figure 4-31.


    ![](img/image_428.jpg)


    ▲Figure 4-30


    ![](img/image_429.jpg)


    Figure 4-31


    **Expert Tips**


    When writing the `AI.FORMAT` function formula, the 1st argument is the value,
    and the 2nd argument is the format. If the table does not provide a specified
    format, you can write the format directly into the formula. For example, enter
    the formula in cell C2: `=AI.FORMAT(A2,"0000 年 00 月 00 日")`, press `Enter` to
    confirm to convert the format.


    #### 061 Use AI.LIST Function to Merge Text Content of Each Row


    ![](img/image_430.jpg)


    Scan to watch tutorial video


    In Excel, the AI function `AI.LIST` merges a series of values or text into a single
    string, facilitating subsequent processing or display. The specific operation
    method for using the `AI.LIST` function to merge text content of each row is described
    below.


    **Step 01** Open a worksheet, as shown in Figure 4-32. Need to merge the text
    content in column A cells into column B cells and separate each row of text with
    a 顿号 (、).


    **Step 02** Enter the AI function formula in cell B2: `=AI.LIST("合并文本",A2:A6)`,
    as shown in Figure 4-33.


    **Step 03** Press the `Enter` key to confirm to merge the text in the cell range
    A2:A6 together, separated by 顿号 (、), as shown in Figure 4-34.


    ![](img/image_431.jpg)


    ▲Figure 4-32


    ![](img/image_432.jpg)


    ▲Figure 4-33


    ![](img/image_433.jpg)


    Figure 4-34


    #### 062 Use AI.TRANSLATE Function to Translate Text


    ![](img/image_434.jpg)


    Scan to watch tutorial video


    In Excel, the AI function `AI.TRANSLATE` translates specified text according to
    the provided translation dictionary, helping users achieve text translation functionality
    in Excel. The operation method for using the `AI.TRANSLATE` function to translate
    text is described below.


    **Step 01** Open a worksheet, as shown in Figure 4-35. The worksheet provides
    Chinese and English vocabulary; need to translate Chinese to English and English
    to Chinese.


    ![](img/image_435.jpg)


    Figure 4-35


    **Step 02** ![](img/image_436.jpg) Select cell range B2:B3; ![](img/image_437.jpg)
    enter the AI function formula in the formula bar: `=AI.TRANSLATE(A2,"中文简体")`,
    as shown in Figure 4-36.


    **Step 03** After performing the operation, press the `Ctrl+Enter` shortcut to
    confirm to translate English into Simplified Chinese, as shown in Figure 4-37.


    ![](img/image_438.jpg)


    ▲Figure 4-36


    ![](img/image_439.jpg)


    Figure 4-37


    **Step 04** ![](img/image_440.jpg) Select cell range B4:B6; ![](img/image_441.jpg)
    enter the AI function formula in the formula bar: `=AI.TRANSLATE(A4,"英文")`, as
    shown in Figure 4-38.


    **Step 05** Press the `Ctrl+Enter` shortcut to confirm to translate Chinese into
    English, as shown in Figure 4-39.


    ![](img/image_442.jpg)


    ▲Figure 4-38


    ![](img/image_443.jpg)


    Figure 4-39


