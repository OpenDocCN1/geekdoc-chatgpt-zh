    # 作者简介


    **曾公子**


    - `Office`办公效率专家。世界500强企业`Office`效率提升训练导师

    - 精通微软`Office`和金山`WPS Office`，拥有超过20年`Office`职场实战经验，特别是`Office`软件在企业办公、行政文秘、市场销售、人力资源、财务会计等方面的应用

    - `AI`技术爱好者与实践者，精通`ChatGPT`、`MindShow`、`闪击PPT`以及`MotionGO`等`AI`智能软件

    - 擅长将先进的`AI`技术与`Office`软件相结合，提升工作的智能化与高效化

    - 曾指导、参与编写的`Office`系列图书有《完美演绎——PPT高手速成》《神技妙算——Excel高手速成》


    # 内容简介


    本书通过7个专题内容、108个实用技巧，讲解了如何运用`ChatGPT`结合办公软件`Excel`和`VBA`代码实现`AI`办公智能化、高效化。随书附赠了108集同步教学视频、170多个素材效果、80多个关键词和33个`VBA`代码等。具体内容由以下两条线展开。


    一是技能线：详细讲解了`ChatGPT`的基本操作、问答方式和指令用法，包括用`ChatGPT`结合`Excel`和`VBA`功能编写公式、代码，以及筛选、检查、提取、分列、排序、整理和分析等用`AI`技术处理表格数据的实用技巧。


    二是案例线：具体安排了用`AI`编码实现分组求和、统计销量、统计销售额、统计重复项、计算工资补贴、计算时间差、计算年龄、计算奖金、判断性别、提取职称、多表排序、隐藏数字、转置数据、批量插入图片、隔行插入空行、创建可视化图表、一对多查询和多对一查询等实例，帮助大家更加高效地处理表格数据。


    本书适合想深入学习`Excel`的工作人员，特别是`AI`结合`VBA`应用的人员，也可作为相关专业的教材或教辅用书。


    # 前言


    本书是一本关于利用人工智能（`artificial intelligence`，`AI`）技术进行数据处理的实用指南。虽然市面上已经有多种关于智能办公方面的书籍，但真正针对与`AI`技术结合使用案例的图书少之又少。秉承着主动识变、应变求变和科技兴邦等精神，我们编写了《AI数据处理实战108招：ChatGPT+Excel+VBA》一书，致力于为读者提供一种全新的学习和工作方式，使大家能够更好地适应时代发展的需要。


    本书通过使用`ChatGPT`、`Excel`和`Excel`中的`VBA`功能介绍了108个实用技巧，涵盖了用`AI`技术进行数据处理的方方面面，这些技巧包括数据处理、数据分析、数据运算、数据可视化和`VBA`代码自动编写等，旨在帮助读者提高数据处理的效率和准确率，从而更好地应用`AI`技术解决实际问题。


    综合来看，本书有以下5个亮点。


    **（1）强强结合。**本书利用`ChatGPT`结合`Excel`和`VBA`功能，总结实际工作中的经验，内容丰富，讲解详细，为读者提供了一系列实用的技巧和方法。这种强强结合的组合使得读者能够充分利用`AI`技术，提高工作效率和质量。


    **（2）实战干货。**本书提供了108个实用的技巧和实例，涵盖了从正确使用`ChatGPT`、用`ChatGPT`编写`Excel`函数公式、用`ChatGPT`处理表格数据到用`ChatGPT`编写`VBA`计算代码和`VBA`处理数据代码等各个方面的内容。这些实战干货可以帮助读者快速掌握`AI`智能办公的核心技能，并将其应用到实际工作场景中。


    **（3）视频教学。**本书操作性强，每一个案例都录制了同步的高清教学视频，共108集。大家可以用手机扫码，边看边学，边学边用。


    **（4）物超所值。**本书针对每个技巧提供了详细的操作步骤，并辅以510多张彩插图解实例操作过程，还附赠了与案例同步的170多个素材效果、80多个指令关键词和33个`VBA`代码，方便读者实战操作练习，提高办公效率。


    **（5）适应性强。**本书适用于各个层次的数据处理人员，无论是初学者还是有经验的专业人士，都可以从中受益。


    本书内容高度凝练，由浅入深，以实战为核心，希望本书能够给予读者一定的帮助。


    特别提示：本书在编写时，所选插图是基于办公软件`Microsoft Office 365`版的`Excel`界面和`ChatGPT 3.5`的界面截取的实际操作图片。但图书从编辑到出版需要一段时间，在此期间，这些软件的功能和界面可能会有变动。请在阅读时，根据书中的思路，举一反三，进行学习。还需要注意的是，即使是相同的关键词，`ChatGPT`每次的回复也会有差别，因此在扫码观看教程视频时，读者应把更多的精力放在`ChatGPT`指令关键词的编写和实操步骤上。


    特别提醒：尽管`ChatGPT`具备强大的模拟人类对话的能力，但由于其是基于机器学习的模型，因此在生成的文案中仍然会存在一些语法错误，读者需根据自身需求对文案进行适当修改或再加工后方可使用。


