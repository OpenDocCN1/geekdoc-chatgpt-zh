    ISNUMBER函数属于信息函数，用于检查一个给定的单元格或数值是否为数值型（即是否为数字）。它返回一个逻辑值（TRUE或FALSE），表示所检查的值是否为数字。


    SEARCH函数属于文本函数，用于在一个文本字符串中搜索指定的子字符串，并返回子字符串在文本中的起始位置，该函数不区分大小写。


