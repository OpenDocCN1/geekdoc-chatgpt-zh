    # Create Employee Salary Inquiry Table


    First, create a blank workbook and enter the relevant header content into the
    table, including Employee ID, Department, Name, Position, Overtime Hours, Base
    Salary, Welfare Subsidy, Performance Bonus, Full Attendance Bonus, Overtime Pay,
    Social Security Deduction, and Net Salary, etc. Then enter the corresponding employee
    salary detail data. The specific operation methods are introduced below.


    ## Step 01


    Create a blank workbook, right-click on the sheet name at the bottom, select the
    "Rename" command from the pop-up shortcut menu, and change the worksheet name
    to "Employee Salary Inquiry Table", as shown in Figure 7-1.


    ## Step 02


    Enter the relevant header content in the worksheet, with the result shown in Figure
    7-2.


    ![](img/image_692.jpg)


    ▲Figure 7-1


    ![](img/image_693.jpg)


    Figure 7-2


    ## Step 03


    Enter employee salary detail data below the headers, and adjust row height and
    column width, with the result shown in Figure 7-3.


    ![](img/image_694.jpg)


    Figure 7-3


    # Set Table Format


    ![](img/image_695.jpg)


    Scan QR code to watch tutorial video


    After the worksheet is created, the table format needs to be set, including font,
    table borders, and alignment, etc. The specific operation methods are introduced
    below.


    ## Step 01


    Continuing from Example 101, ![](img/image_696.jpg) click the top-left corner
    of the worksheet (Select All button) to select the entire worksheet; in the "Font"
    group on the "Home" tab, ![](img/image_697.jpg) click the "Bold" button ![](img/image_698.jpg)
    to bold the text content, as shown in Figure 7-4.


    ## Step 02


    In the "Alignment" group, click the "Center" button ![](img/image_699.jpg) to
    center-align the text, as shown in Figure 7-5.


    ![](img/image_700.jpg)


    ▲Figure 7-4


    ![](img/image_701.jpg)


    Figure 7-5


    ## Step 03


    ![](img/image_702.jpg) Select the header content in Row 2; in the "Alignment"
    group, ![](img/image_703.jpg) click the "Top Align" button ![](img/image_704.jpg)
    to align the headers to the top of the cells, as shown in Figure 7-6.


    ## Step 04


    ![](img/image_705.jpg) Select cells `A2:L12`, in the "Font" group, expand the
    "Borders" drop-down list; ![](img/image_706.jpg) select the "All Borders" option
    to add border lines to the table, as shown in Figure 7-7.


    ![](img/image_707.jpg)


    ▲Figure 7-6


    ![](img/image_708.jpg)


    Figure 7-7


    # Add Data Units


    ![](img/image_709.jpg)


    Scan QR code to watch tutorial video


    Next, units need to be added to the overtime hours data and salary/bonus data
    without affecting data calculations. The specific operation methods are introduced
    below.


    ## Step 01


    Continuing from Example 102, ![](img/image_710.jpg) select cells `E3:E12`, right-click,
    ![](img/image_711.jpg) select the "Format Cells" command from the pop-up shortcut
    menu, as shown in Figure 7-8.


    ## Step 02


    The "Format Cells" dialog box appears. In the "Type" text box in the "Custom"
    category, "General" is displayed by default. Enter the unit "hours" after the
    text, as shown in Figure 7-9.


    ![](img/image_712.jpg)


    ▲Figure 7-8


    ![](img/image_713.jpg)


    Figure 7-9


    ## Step 03


    Click the "OK" button, ![](img/image_714.jpg) the unit is added to the "Overtime
    Hours" data; ![](img/image_715.jpg) use the same method to add the unit "Yuan"
    (CNY) to the data in the cell range `F3:L12`, with the result shown in Figure
    7-10.


    ![](img/image_716.jpg)


    Figure 7-10


    # 7.2 Calculate Employee Salary with ChatGPT


    In the created Employee Salary Inquiry Table, calculation formulas can be written
    in conjunction with ChatGPT to calculate employees'' overtime pay and net salary.


    ## Calculate Overtime Pay with ChatGPT


    ![](img/image_717.jpg)


    Scan QR code to watch tutorial video


    In the Employee Salary Inquiry Table, assuming the cost of 1 hour of overtime
    is 100 Yuan, the user can accurately describe the calculation conditions to ChatGPT
    to obtain the calculation formula and calculate the employees'' overtime pay.
    The specific operation methods are introduced below.


    ### Step 01


    Continuing from Example 103, open the ChatGPT chat window, enter the prompt "In
    an Excel worksheet, cells `E3:E12` contain overtime hours data. Need to write
    a calculation formula to calculate overtime pay at a rate of 100 Yuan/hour" in
    the input box. Press Enter to send, and the overtime pay calculation formula written
    by ChatGPT will be obtained, as shown in Figure 7-11.


    ![](img/image_718.jpg)


    Figure 7-11


    ### Step 02


    Copy the calculation formula written by ChatGPT, return to the Excel worksheet,
    select the cell range `J3:J12`, ![](img/image_719.jpg) paste the formula `=E3*100`
    in the formula bar; ![](img/image_720.jpg) press the `Ctrl+Enter` shortcut key
    to calculate the overtime pay for each employee, as shown in Figure 7-12.


    ![](img/image_721.jpg)


    Figure 7-12


    ## Calculate Net Salary with ChatGPT


    ![](img/image_722.jpg)


    Scan QR code to watch tutorial video


    When tallying employee salaries in the Employee Salary Inquiry Table, it is necessary
    to sum up Base Salary, Welfare Subsidy, Performance Bonus, Full Attendance Bonus,
    and Overtime Pay, and also deduct the Social Security fees paid by the company.
    The user can obtain the calculation formula through ChatGPT to calculate the employees''
    net salary. The specific operation methods are introduced below.


    ### Step 01


    Continuing from Example 104. Open the ChatGPT chat window, enter the prompt "In
    an Excel worksheet, cells `F3:J12` contain data for Base Salary, Welfare Subsidy,
    Performance Bonus, Full Attendance Bonus, and Overtime Pay, etc. Cells `K3:K12`
    contain Social Security Deduction data. Need to write a calculation formula to
    sum up Base Salary, Welfare Subsidy, Performance Bonus, Full Attendance Bonus,
    and Overtime Pay, and subtract Social Security Deduction fees to calculate the
    net salary for each employee" in the input box. Press Enter to send, and the net
    salary calculation formula written by ChatGPT will be obtained, as shown in Figure
    7-13.


    ![](img/image_723.jpg)


    Figure 7-13


    ### Step 02


    Copy the calculation formula written by ChatGPT, return to the Excel worksheet,
    select cells `L3:L12`, ![](img/image_724.jpg) paste the formula `=F3+G3+H3+I3+J3-K3`
    in the formula bar; ![](img/image_725.jpg) press the `Ctrl+Enter` shortcut key
    to calculate the net salary for each employee, as shown in Figure 7-14.


    ![](img/image_726.jpg)


    Figure 7-14


    # 7.3 Query Employee Salary with VBA Code


    In the worksheet, users can utilize VBA code and Text Box controls to implement
    automatic filtering and data querying. That is, by entering an employee name in
    the text box, the worksheet can automatically filter out that employee''s pay
    slip.


    ## Create Query Text Box Control


    ![](img/image_727.jpg)


    Scan QR code to watch tutorial video


    In Excel, users can draw a Text Box control (ActiveX) to execute macro tasks via
    the control. The specific operation methods are introduced below.


    ### Step 01


    Continuing from Example 105, select cells `A2:L2`, in the "Sort & Filter" group
    on the "Data" tab, click the "Filter" button to add filter buttons to the header
    cells, as shown in Figure 7-15.


    ### Step 02


    In the "Controls" group on the "Developer" tab, ![](img/image_728.jpg) click the
    "Insert" drop-down button; ![](img/image_729.jpg) click the "Text Box (ActiveX
    Control)" icon ![](img/image_730.jpg) in the pop-up list, as shown in Figure 7-16.


    ### Step 03


    Draw a Text Box control after the text in cell `A1`, as shown in Figure 7-17.


    ![](img/image_731.jpg)


    ▲Figure 7-15


    ![](img/image_732.jpg)


    ▲Figure 7-16


    ![](img/image_733.jpg)


    Figure 7-17


    ## Record Macro and Generate VBA Code


    ![](img/image_734.jpg)


    Scan QR code to watch tutorial video


    In the Excel worksheet, users can record executed commands through the "Record
    Macro" feature and then generate VBA code. The specific operation methods are
    introduced below.


    ### Step 01


    Continuing from Example 106, in the "Code" group on the "Developer" tab, click
    the "Record Macro" button, as shown in Figure 7-18. The "Record Macro" dialog
    box appears; click "OK" to start recording executed commands.


    ![](img/image_735.jpg)


    Figure 7-18


    ### Step 02


    ![](img/image_736.jpg) Click the drop-down button in cell `C2`, a list box pops
    up. In the search box, ![](img/image_737.jpg) enter the employee name, here enter
    "Zhao Jian", press Enter to confirm, as shown in Figure 7-19.


    ### Step 03


    Click the "Stop Recording" button on the Ribbon to stop recording. Open the VBA
    Editor; the generated VBA code can be viewed in Module 1, as shown in Figure 7-20.


    ![](img/image_738.jpg)


    ▲Figure 7-19


    ![](img/image_739.jpg)


    Figure 7-20


    ## Run Macro and Query Employee Salary


    ![](img/image_740.jpg)


    Scan QR code to watch tutorial video


    The VBA code generated in Example 107 cannot be run directly. The code needs to
    be copied into the Sheet1 (Employee Salary Inquiry Table) module, and the search
    content in the code needs to be modified so that it runs without restrictions.
    The specific operation methods are introduced below.


    ### Step 01


    Continuing from Example 107, copy the code in Module 1. In the "Project" Explorer,
    double-click the "Sheet1 (Employee Salary Inquiry Table)" option. ![](img/image_741.jpg)
    In the popped-up module, click the "General" drop-down button. In the pop-up drop-down
    list, ![](img/image_742.jpg) select the `TextBox1` option, as shown in Figure
    7-21.


    ![](img/image_743.jpg)


    Figure 7-21


    ### Step 02


    After the operation, the starting and ending code stubs are automatically generated.
    Paste the code in the blank line, delete redundant code, and modify the search
    content to: `"*" & TextBox1 & "*"`, with the result shown in Figure 7-22.


    ![](img/image_744.jpg)


    Figure 7-22


    ### Step 03


    Run the macro and exit the VBA Editor. ![](img/image_745.jpg) Enter the employee
    name in the Text Box control, here enter "He Mo"; ![](img/image_746.jpg) the salary
    details of that employee can be quickly queried, as shown in Figure 7-23. Thus,
    the creation of the Employee Salary Inquiry Table is complete.


    ![](img/image_747.jpg)


    Figure 7-23


