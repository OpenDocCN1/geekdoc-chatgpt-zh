    在潘多拉星球上，人类的殖民者们，掌握着高度发达的技术，也给人以贪婪、残暴的印象。为了攫取矿产，人类不惜摧毁了纳威人的家园。而阿凡达们则一直信仰每个物种都是通灵的。事实上也的确如此，潘多拉星球上的动物都有一根长长的辫子，大树有着银白色的长须，就像神经元的神经末梢一样。当这些末梢连接在一起，他们可以不用语言交流而实现直接的沟通。潘多拉星球生物的特点，给万物普遍联系的哲学认知做了形象化、可视化的注脚。因此，他们更注重生命与环境的和谐，强调团结、合作、分享、体验，而非博弈和过度索取。


    这一点和元宇宙居民的价值观是相同的。当摆脱了生理需求诱惑，在精神世界翱翔的时候，阿凡达或许就是以创造为荣，以分享为乐，体验重于结果。分享取代自私，利他取代利我，成为元宇宙共同的价值选择。


    ## 重新思考几个规律


    在数字世界中消费数字世界原生的数字产品，是传统经济学家们没有遇到的新现象。在物理世界中，已经建立的基本经济概念和认识会在数字世界中面临颠覆。


    ### 认同决定价值

    在马克思的思想体系中，认为商品的价值是一种凝结在商品中的无差别的人类劳动。以劳动创造价值为基础，进一步推导出剩余价值理论，揭示出资本方总是倾向于追求剩余价值，压榨工人的劳动。


    劳动决定价值理论是传统经济学的支柱。无论商品价格怎么变化，商品中无差别的一般性的人类劳动，就是价格变化的核心点。


    数字世界中的数字商品，与劳动没有正比例线性关系。其实数字商品和奢侈品有点类似。就储物功能而言，LV的包和其他品牌的包，并无本质差别，尤其是高仿LV，两个包的差别可能只是Logo有细微的不同，但是正品LV包的价格比高仿的包贵十倍，甚至百倍。


    支持人们消费奢侈品的，正是“认同的力量”。LV成为特定阶层、某种品位的象征。LV品牌代表着一种生活，这种生活状态，可能不是其他品牌可以达到的。这已经远远超出了LV包本身的储物功能，而是带给消费者精神层面的满足。


    满足精神层面的产品，往往不会遵循劳动决定价值的理论。在物理世界中，这样的例子比比皆是。比如绘画，尽管普通人难以分辨张大千的真迹，但不妨碍大家高价收藏张大千的真迹。如果是临摹的作品，其价格就会一落千丈。原作和临摹所花费的劳动时间是相差无几的，并且在成本上也不相上下，但是在价格上，却天差地别。其中的差别，就是人们认同张大千。即便临摹的作品在细节上甚至有胜出的地方，也不会比原作更值钱。


    从总体情况来看，物理世界中，像艺术品这样违反劳动创造价值理论的商品，仅仅占社会总商品极小的一部分，劳动创造价值总体上是成立的。在元宇宙中，所有的商品都具有艺术品特征。


    在游戏Roblox中，就艺术性而言，创作难以有质的差别。创作的原料都是分辨率比较低的“像素”，因此所有的物品看起来都是方头方脑的。物理世界圆滚滚的脑袋，在Roblox、《我的世界》等游戏中，都变成了有棱有角的方块。用这些“原料”制造的商品，依然有人追捧。这些商品，在人们看来一文不值，但玩家们却趋之若鹜。


    偶像与粉丝之间的关系，也颠覆了劳动创造价值。在网络上，不同明星的粉丝之间经常出现互相攻击的现象，引起了广泛的关注。在粉丝的心目中，明星的价值不能用钱来衡量。这不仅是粉丝对于明星本人的认同，在某种意义上，粉丝在追星的过程中，也形成了社会性的自我认同。这种认同，转化成了商品的价值。在跟明星相关的商品中，至少其代言的商品，几乎没有凝结他们的无差别劳动，但是凝结了粉丝的自我认同。


    在数字世界中还有一类商品不得不提，就是人工智能创作的商品。人工智能的工作效率是人类的成千上万倍。如果按照劳动决定价值理论，这些商品应该以极低价格出售，然而这并不妨碍某些人出高价收购。


    ### 边际效益递增

    在物理世界中，商品的边际效益往往是递减的。同类的一些商品，随着数量增加，单位商品对人们的效益就会越来越低，而在元宇宙中，这条法则也被打破了。在游戏中，玩家越多越有趣，游戏时间越长，获得的激励和快感越多。每天登录，还有奖励。换句话说，这就是“沉迷”——长时间迷恋同一个东西。如果满足边际效益递减的法则，就不会有沉迷这回事儿。


    元宇宙构成要素之一，是社交网络系统。在社交网络中，存在明显的网络效应，用的人越多，网络效应越显著。比如大家都使用微信，在微信上交流、沟通。现在，想要脱离微信几乎是不可能的。大家就像一个篓子里装的螃蟹，任何一个想离开篓子的螃蟹，都会被其他螃蟹拽回来。如果我们想和朋友们自由地交流，那就会被朋友“拽”进微信。


    ### 边际成本递减

    在物理世界中。生产成本包括原材料成本、生产线成本、工人成本、仓储成本等。商品的成本曲线呈“U”形——生产时，随着产量的提升，边际成本越来越低；但当生产线饱和，再去增加产量，就会面临生产成本大幅上升的局面。


    2009年，美国关闭了F22战机的生产线，这条生产线共生产了187架战机。这是当时最先进的第5代战机。关闭生产线的一个重要原因，就是其他大国短期内很难生产出类似的产品。当生产线关闭后，如果再想生产F22战机，生产成本就会增加，包括培训工人、重新采购原材料的费用等。


    在数字世界中，根本没有这些令人头疼的问题。没有原材料的采购，所有“产品”的原材料都是二进制的“0”“1”代码。没有生产线，没有工人，没有仓储，没有物流，随时可以暂停生产，也随时可以重新投产。产品一旦被创造出来，永远有效、不会磨损、不需折旧，再生产的成本几乎为零。边际成本递增的法则在元宇宙中也被打破了。


    ### 关注市场创立成本

    市场是经济学的核心。商品用于交换才能产生价格。有了价格，人们才能获得组织生产的信号。市场的规模越大，分工会越细，技术得以飞速进步，社会总财富积累越多，市场的规模越大。这一条法则无论在传统的经济学还是元宇宙中都是成立的。


    在物理世界中，创建一个市场的成本是非常高的。而且市场创建的成本，往往被经济学家忽略。几乎所有的经济学家谈论的都是市场创建以后的事情，对如何建立市场则讳莫如深。就极端自由主义者而言，他们信奉小政府、大市场的理论，但是市场创建本身巨大的成本，给了政府介入的理由。在物理世界中，创建市场首先需要良好的社会秩序，确保违反市场规则的行为会受到处罚。创建市场还需要修建四通八达的“道路”，“道路"的终点就是市场的边界。因此，大统一的市场需要大规模的基础设施。这些都需要巨额的资金。


    那些致力于在市场规模建设、削减交易成本、丰富市场种类等方面不断开拓的国家，才是代表未来的国家。


    在数字世界中，市场也是如此，不同的是，在数字世界创建市场，要比在物理世界创建市场容易得多，成本低得多。像淘宝、京东类的电子商务市场，交易的是物理世界的商品。苹果、华为、小米手机上的应用程序商店，交易的是创造数字内容的工具。《王者荣耀》、Roblox中的玩家商城，交易的是纯粹的数字产品——皮肤、道具、玩家自己创造的小游戏，等等。这些市场的规则，都是人们通过软件代码制定的。违反市场规则的交易，要么不可能通过，要么就被市场清退。


    在数字世界中建立市场的成本远远低于物理世界。理论上，数字世界中将会产生丰富多彩的新型市场，从而起到繁荣经济的作用。


    加密数字资产市场，就是数字世界市场典型的例子，其代表是比特币、以太坊。这些市场与电商、应用商店和游戏玩家市场的区别体现在市场规则的制定权和修改权上。在以区块链技术为基础的加密数字资产市场中，规则一旦发布，任何人、任何组织都没有权利修改，除非“自治社区”绝大部分的人都同意修改，这就实现了“去中心化”的治理模式。而非区块链技术支持的数字市场，市场规则是追求商业化利益的公司决定的，它们可以随时修改规则，从而成为市场的支配力量。


    以区块链为基础的数字市场是元宇宙经济的基石。在后续章节中，还会出现相关话题。在本部分中，大家只要了解市场建立需要成本，维持运营同样需要成本。对此，物理世界和数字世界分别给出了不同的方案。而在数字世界中，建立市场和维持运营的成本都大大降低了。


    ### 交易成本趋零

    交易成本区别于市场的运营成本。市场运营成本是为了维护市场的有序、有效运作，必须支付人工、租金、监管、治理等刚性支出。交易成本是买卖双方在达成交易的过程中所支付的费用。在淘宝中购物，交易成本不是商品的价格，而是在购买商品的过程中必须支付的费用。快递费可以归入交易成本的范畴，还有上网流量费等费用。


    关于交易成本的一个基础观点是，交易成本越低，市场就会越繁荣，市场的边界就越大。很明显，如果快递费比商品的价格还高，恐怕没有人会在网上买东西。


    在物理世界中，交易成本有很多种类，有些种类并不是靠代码规定的交易规则就能涵盖的。其突出表现是在企业（2B）市场中签合同所需的费用，很可能占合同金额的10%—20%，甚至更高。而在数字世界的数字市场中，几乎没有交易费用。在《王者荣耀》买一款新皮肤，不需要物流费，甚至没有流量费。


    在以太坊中，大家进行的任何交易都会支付一笔GAS（燃料费），就算交易最终失败，也必须承担GAS费用。严格地说，GAS不是交易的成本，而是以太坊这个数字市场的整体运营费用在每笔交易中的折现。


    认同决定价值，而非无差别劳动；数字世界的生产边际效益递增，而非物理世界的生产边际效益递减；数字世界的生产边际成本递减，而非物理世界的生产边际成本递增；数字世界还包括大幅度降低的市场建设成本和几乎为零的交易成本。上述几点，都撼动了传统经济学的理论支柱。


    黄江南、朱嘉明大力倡导观念经济学，并对传统经济学发出了振聋发聩的批判。黄江南在2014年的网易经济学家年会夏季论坛上，就大声疾呼：“观念经济学在观念生产领域把以往的传统经济学所有的基石性的理论都推翻了。传统经济学，我们现在所学的经济学，只能适应早期的工业化，连现代的工业化都不能适应，因此我们要建立新的观念体系、概念体系……”元宇宙经济学和观念经济学有许多相同之处，甚至可以说元宇宙经济是更纯粹意义上的观念经济。


    ## 元宇宙经济的四个要素


    人们在元宇宙中，摆脱了物理世界的一些“俗务”，不用吃饭应酬，不会生病，也不会永久地死去（除非永远离开元宇宙）；主要的活动就是体验、创造、交流和交换。在新冠肺炎疫情期间，“阿凡达”们尤其如此。


    在某个游戏中，阿凡达们在早晨七八点相继醒来，陆陆续续地来到元宇宙，随处逛逛，扎堆儿聊天，话题几乎无所不包。尽管在元宇宙中不能烹饪，但并不妨碍阿凡达们聊聊美食，甚至聚拢到元宇宙的餐厅打卡。奇怪的是，他们虽然没有办法在餐厅吃饭，但就是要去打个卡，这是仍摆脱不了物理世界生活习惯的体现。在游戏Roblox中有一个景点，爬上高塔，可以看到美丽的日落。很多阿凡达喜欢爬上来静静地坐着，看日落，自拍。这就是体验。当然，在元宇宙中也会发生交易行为。有些阿凡达心灵手巧，制作出美丽的衣服，其他阿凡达喜欢的话就可以购买。一天就这样过去了，直到半夜还有许多阿凡达在元宇宙中四处游荡。


    Epic公司的CEO蒂姆·斯威尼（Tim Sweeney）在接受关于元宇宙经济的访谈时说：“我们不仅要建立一个3D平台，建立技术标准，还要建立一个公平的经济体系，所有创作者都能参与这个经济体系，赚到钱，获得回报。这个体系必须制定规则，确保消费者得到公平对待，避免出现大规模的作弊、欺诈或诈骗，也要确保公司能够在这个平台上自由发布内容并从中获利。”


    从蒂姆·斯威尼的发言来看，要支持阿凡达在元宇宙的生活，必须要有几个基本要素。第一个是数字创造，创造出阿凡达需要的产品。第二个是数字资产。阿凡达创造的产品如果进行销售，必须解决产权归属的问题，必须要能标记是谁创造的，而且还得避免数字产品可以被无限复制的难题。第三个是数字市场，它代表着数字世界交易的场所和大家必须遵循的规则。第四个是数字货币。买东西总要付费。交易虚拟的数字产品，用法币来支付有很多困难，因此元宇宙需要数字货币。数字创造、数字资产、数字市场、数字货币，支撑了整个元宇宙的经济体系，由此满足了“阿凡达”们的数字消费。


    ### 数字创造

    元宇宙经济同样存在供需两端。需求端需要满足阿凡达的体验和精神层面的需求，精神需求是多层次、多维度的，是丰富多彩的。这就需要供应端提供多种多样的数字产品，张开梦想的翅膀、突破想象的极限，才能满足“阿凡达”们的无止境的精神需求。数字创造者和数字消费者足够多，元宇宙才能运转和繁荣。


    数字创造是元宇宙经济的开端，没有创造，就没有可供交易的商品。在物理世界，人们“创造”的都是实物或者服务。我们会用“产品”对其进行描述，当其进入市场进行流通时，就会被称为“商品”。而在元宇宙中，人们进行的是“数字创造”，创造的是“数字产品”。物质都是数字化的，是一些数据的集合。我们在游戏里可以建造楼房、创造城市，我们在短视频App中、在各种平台上可以发布拍摄和制作的短视频，通过微信公众号可以发布各式各样的图文。这些其实都是我们的数字化产品。这种数字创造的过程是客观存在的，是元宇宙经济的第一个要素。


    元宇宙是否繁荣，第一个重要的指标就是数字创造者的数量和活跃度。元宇宙的缔造者们，需要提供越来越简便的创作工具，降低用户的创作门槛。


    抖音短视频平台成为4G时代的霸主之一，其中一个很重要的原因就是它降低了短视频创作的门槛。在微信发图文，至少不能是文盲，但是发一个短视频，没有受过任何教育的小孩子都能做到。抖音的用户基数理论上比微信的还要多。


    Roblox更进一步大幅度地降低了用户创作游戏的门槛。Roblox的游戏开发引擎，把3D游戏的开发简化到只需要通过鼠标拖拽就能完成。


    对于元宇宙的缔造者而言，提供简单易用的创造工具是一门必修课，而且是必须修好的课。谁在这个领域做到顶级水平，谁就有可能成为一个新的元宇宙的缔造者。


    ### 数字资产

    资产隐含产权属性，并且是交易的前提。《王者荣耀》中的“皮肤”，大家都知道其产权属于腾讯，如果喜欢想得到，就得付钱。玩家购买的“皮肤”属于玩家的私人装备，不可以转让，但是拥有这个皮肤的游戏账号可以转让，可以出售获利。这样一来，“皮肤”就具备了资产属性。在淘宝、闲鱼等电子商务平台上，用户可以轻松搜索到出售游戏账号的玩家。


    显然，“皮肤”是在游戏中创造的，也只能在游戏中进行购买。这些虚拟商品不能脱离游戏平台存在，换句话说，就是不同平台的虚拟产品没有通用性，不能构成严格意义上的数字资产。这也就限制了跨平台、跨游戏的数字资产的流通。


    在Roblox提供了游戏开发平台后，玩家可以自己开发游戏，在游戏中创造出各式各样的数字产品。这些数字产品，只要在Roblox的平台上，就可以跨游戏使用。这是一个相当大的突破。Roblox公司上市不久，市值就突破了400亿美元，足见资本市场对于Roblox数字资产跨平台流通模式的追捧。


    如果想把Roblox平台上玩家购买的数字产品（虚拟物品）拿到其他游戏中使用，目前是做不到的。其他游戏的平台和Roblox平台没有打通。这就限制了数字资产的流通。


    无论是其他游戏中的皮肤，还是Roblox中用户创造的建筑，都还不是严格意义上的数字资产。数字资产的形成，还需要一个低层的平台，在资产层面提供严格的版权保护和跨平台的流通机制。这样一来，真正的元宇宙经济才会形成。


    会不会出现一个更低层的平台，来提供不同游戏之间虚拟物品的交换和使用呢？这个问题，我们将在第六章“抢占超大陆”中继续探讨。毫无疑问，基于区块链技术的平台，提供了可选的方案。区块链提供了数据拷贝受限的解决方案，综合利用加密算法、签名算法、共识机制等，确保数据每一次拷贝都被登记在册，确保数据不被非法篡改、拷贝，从而奠定了数据成为资产的技术基础。


    #### 数字资产的生产方式和确权

    我们进一步讨论数字产品的生产方式，其可以分为PGC（Professionally Generated Content，即专业原创内容）、UGC（User GeneratedContent，即用户原创内容），随着AI技术的成熟，还将出现AIGC（AI
    Generated Content，即人工智能原创内容）。这里重点讨论PGC和UGC。


    对于PGC，我们依然可以用游戏中的“皮肤”举例：在游戏中，开发者人为设定商业规则，使得玩家对“皮肤”的使用受到特定的限制。“皮肤”只能在游戏中针对玩家某个账号下的特定角色进行使用，在其他场合则无法使用。这是游戏平台为了获取利润而设计的一种中心化的机制。平台对这里的数字产品具有决定权，买家无法通过拥有更多数量的产品而打乱游戏开发者建立起的市场，因为在游戏中，“皮肤”被人为设置了购买数量和机制，而这一切都依赖于腾讯的编码程序。也就是说，PGC作为数字资产，往往是通过人为设置稀缺性来保证其价值的稳定性的。


    UGC是用户创造的资产，这种形式的数字资产在元宇宙中也很常见。例如，用户在游戏中为自己创造的、非购买自官方的家园、新武器等。理论上，这些资产也可以进入市场进行交易流通。这时，我们之前提出的问题就会产生——一旦这些资产被其他用户无限复制，那么它的价值就会陷入不稳定的波动。在这种情况下，就需要创建一个针对UGC的确权机制，把人们在数字世界里面创造的产品变成一个受保护的资产。在现实世界中，人们确权的方式往往是通过登记，如房主可以对房屋进行登记。如果产生交易行为，也需要对这个行为进行登记，明确房屋的所有权原本属于哪方，转移给了哪方，如此完成资产的交易。换句话说，在现实世界中的很多情况下，“证件”就是确权的标志。


    值得注意的是，这样的证件往往具有一种权威性，只有由人们普遍信任的、不会质疑其公正与权威性的机构进行确权，才能避免确权发生混乱局面。很多情况下，这类机构都隶属一个国家的中央政府。而在元宇宙的数字世界中，没有中央政府的概念。元宇宙是一个开放的、公平的、完全自治的世界，在这样的世界中，人们对数字资产的确权和区块链提供的一套价值体系、区块链的加密体系是密不可分的。通过加密，可以把数据资产化，人们可以通过共识机制对交易进行验证和确认，为交易行为留下不可被篡改的记录。这一套完整的机制，能够帮助元宇宙的参与者完成对数字产品的确权，建立数字资产。数字创造和数字资产，是数字市场交易的前提，数字资产是数字市场进行交换的内容，如果资产不存在，市场也就不存在了。


    ### 数字市场

    数字市场是整个数字经济的核心，也是元宇宙得以繁荣的基础设施。建立数字市场的最终目的，是繁荣整个元宇宙。有了数字市场，元宇宙的阿凡达，就有了盈利的可能。让利于阿凡达，让阿凡达在体验之余还能获得经济上的收入，是元宇宙成长的奥秘。


    数字经济蓬勃发展，带来了几种类型的市场扩张：第一种是进行实物交换的电商市场，如阿里巴巴、京东这一类，它们是最为我们所熟知的。第二种市场，交换的是创造内容的工具，如手机上的应用商店。在这个市场中，没有数字内容的交换，只有具备特殊性的、能够创造数字内容的虚拟数字商品，也就是各种App的交换。而第三种市场中发生的交换，就纯粹是数字内容的交换了。例如，给某段视频或图文材料进行“打赏”，在游戏中“购入”一栋大楼、一个城镇、一辆汽车或一套“皮肤”等。

