- raw: "正如在本章开头所指出的，元宇宙经济是数字经济的特例，是其子集，但也是一种最活跃、最彻底的数字经济。元宇宙经济的特征，在一定程度上反映了数字经济的特征和趋势，从而对于数字经济的发展具有借鉴意义。\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0027.xhtml#commentRef_12146)文一.伟大的中国工业革命——发展政治经济学一般原理批判纲要［M］.北京：清华大学出版社，第176页。\n\
    \n## 实现DC/EP在元宇宙经济中的法币地位\n\nDC/EP（Digital Currency/Electronic Payment，数字货币/电子支付）不但是元宇宙金融体系的基础，更是整个数字经济的核心。元宇宙提供了典型的、大规模的消费级应用场景，这个场景是超越国界的、不分种族的。因此，DC/EP在元宇宙中的应用，是有助于构建元宇宙经济体系的，同时元宇宙也是DC/EP完成数字经济发展使命的根据地。元宇宙发展迅猛，如果DC/EP不去占领元宇宙，自然会有其他的阉割型代币（如Q币）或者加密货币（如以太坊）去占领。\n\
    \n### 各种数字货币已经在割据市场\n\n传统上，货币具有价值尺度、流通手段、贮藏手段、支付手段等基本功能。价值尺度功能体现在衡量和标记商品的价格；流通手段等同于交换媒介；贮藏手段是时间维度的概念，货币长时间存储起来，依然拥有原来的购买力。法币兼具这三个功能，不可分割，但是数字货币的应用程度不同，甚至在有些场景中取代了法币的部分功能。\n\
    \n譬如盒马鲜生，这是马云倡导的新零售的代表。去盒马鲜生购物，只能用盒马鲜生的App支付，唯一的支付渠道是支付宝，默认的付款方式为“蚂蚁花呗”。事实上，支付宝中的“余额”就是数字货币，在盒马鲜生等新零售场景中，余额取代了人民币流通手段的功能。花呗和余额宝都是“余额”这个数字货币的衍生金融产品，分别用于分期付款场景和理财场景，本质上是借贷业务和投资业务。\n\
    \n数字货币高度依赖支付场景。DC/EP试点应用，大多是和大型电商合作，限定期限内使用DC/EP购物。对消费者而言，是不是DC/EP，并无明显的差别。但是在元宇宙中则截然不同。\n\
    \n### 元宇宙是承载DC/EP的最佳场景\n\n游戏是元宇宙的雏形，在游戏中得到应用，就可以自然而然地推广到其他元宇宙应用中。游戏中经济体量巨大，而且处在高速发展阶段。根据中国音教协游戏工委的数据显示，2020年，中国游戏市场实际销售收入2\
    \ 786.87亿元，比2019年增加了478.1亿元，同比增长20.71%。\n\n在游戏中，存在大量的充值余额，对于消费者而言是巨大的损失。很多情况下，在游戏中充值的金额并不会被完全消费。如果游戏充值形成的货币，在不同的游戏中都能使用，对于刺激消费者的消费欲望无疑有巨大的影响。\n\
    \n我们已经谈过，现有的账户支付体系，满足不了游戏日新月异的交易需求。Roblox发行了自己的Robux币解决了Roblox元宇宙居民的消费需求。Robux只能在Roblox的平台上才能使用。《王者荣耀》的玩家，显然就不能使用Robux币。\n\
    \n最有可能跨平台承载元宇宙底层货币功能的候选者，以太坊无疑算一个，但是以太坊的性能一直饱受诟病，尤其是对于游戏这种对效率要求极高的场景而言。基于以太坊，人们开发了许多加密货币游戏，但是这些游戏创造的商业价值，无法和成熟的游戏相提并论。\n\
    \n站在游戏开发商的立场来讲，建立自己的虚拟货币体系，是有利的事情。从构建未来的元宇宙生态来讲，必须有独立于单一游戏的货币体系，才能真正促进元宇宙的发展和元宇宙经济的繁荣。\n\
    \n中国的元宇宙必须基于DC/EP来构建，这是毋庸置疑的，也是势在必行的。\n\n### 自然而然的出海通道\n\nDC/EP出海，是人民币国际化的重要途径。游戏，是跨国家、跨民族，甚至是超越文明的面向M世代年轻消费者的应用。在游戏中，采用DC/EP，甚至可以达到不动声色之间，轻舟已过万重山的境地。\n\
    \n阿凡达在元宇宙中辛辛苦苦赚到的DC/EP，为什么不可以让他们换成本国的法币呢？在中国，DC/EP不存在和法币兑换的问题，DC/EP本身就是法币。在其他国家，DC/EP和法币兑换，自然而然就是完成了DC/EP出海的使命。\n\
    \n在物理世界，大国间的博弈日趋激烈，美国正在各个领域与中国进行博弈，不但要把中国排除在科技发展进程之外，而且要把中国排除在金融体系之外、国际社会之外。且不论美国的意图能否达成，中国目标非常明确，就是加强国际间的联系，形成更广阔的统一的大市场。\n\
    \n当我们在物理世界中构建统一市场障碍重重的时候，在数字世界的元宇宙中，构建统一的数字市场，几乎没有任何阻力。因为年轻的游戏玩家是不分国界的。\n\n游戏不仅是文化传播的载体，更是构筑全球统一数字市场的先锋官。DC/EP需要在游戏中进行深入应用，促进游戏的繁荣，促进游戏“出海”，形成真正的元宇宙经济，进而拓展到数字经济。\n\
    \n从游戏到元宇宙，从元宇宙到数字经济，从数字经济再到传统经济，既能促进元宇宙成熟，又能引领数字发展，是一条推进DC/EP深入应用的清晰的路径。\n\n我们必须从元宇宙的语境、国际话语权的争夺、文化输出的背景、数字经济的先锋、DC/EP构建数字金融体系的角度，重新审视游戏的引领性和带动性的战略价值。游戏不过是元宇宙的雏形，元宇宙的构建需要从其构成要素方面多加思考、多方协同、共同推进才能形成繁荣的局面。在数字创造领域，可否提供简单易用的创造工具来支持用户原创的内容？可否内置社交网络来形成社会化网络效应？可否建立高效率低成本的交易市场来让内容创作者获利？可否建立超越元宇宙的数字货币体系？前三个问题的解决可以依赖元宇宙的创业团队，第四个问题则有关元宇宙基础设施的建设，必须上升到国家层面，才能系统性地解决问题。\n\
    \n# 05  \n\n自治的乌托邦\n\n但是，请你一定要记住！能导致这世界灭亡的并不是他，而是人类，是人类自己！\n\n——游戏《恶魔城：月下夜想曲》\n\
    \n以程序正义为名的“不作为”，和以“不作恶”为口号的互联网公司，实际上都阻碍了社会发展的步伐。当挟“数据”以令诸侯的事件成为常态后，社会已经深刻认识到，数字霸权，正成为影响社会治理的一个重要问题。\n\
    \n去中心化的尝试是对数字霸权的反抗。智能合约正在构建新型的治理方式，在某种意义上，它同时制约了不良的个人和不良的程序带来的负面影响，在世界范围内，形成普遍的合作机制。\n\
    \n应对大面积的灾难事件、处理法制之上有悖道德的不良行为，不是去中心化治理模式擅长应对的领域。不过，去中心化治理模式刚刚诞生不过十年之久，且在快速地发展变化，或许，解决方案就在未来的不断演化之中。\n\
    \n建立“桃花源”“乌托邦”那样的理想社会，一直是人类孜孜以求的目标。每个民族在各自的历史上都曾饱经战乱、灾难、疾病之苦。好的社会治理，除了能维持社会基本运转、经济平稳增长之外，还能挽狂澜于既倒，扶大厦于将倾。救民于水火之中的应急处理能力，更是衡量社会治理能力高低的重要评判标准。\n\
    \n元宇宙中没有战乱、灾难、疾病，即便有，也不过是“创世者”制造的新奇体验而已。元宇宙不是孤立的存在，只要人还有“肉身”，元宇宙就注定无法完全摆脱物理的约束。因此，元宇宙的治理，同样也需要考虑事关全局的重大公共利益、公共安全以及危机发生时有没有应对之策？元宇宙经济学中，是否还有“看得见的手”发挥作用的空间呢？\n\
    \n当我们把视野从元宇宙经济的角度，切换到元宇宙社会治理的角度，首先需要清醒地认识到，正是在经济领域行之有效的规则，成了制造社会问题的温床。\n\n## 美国政府“不作为”vs平台公司“不作恶”\n\
    \n当地时间2021年6月24日，美国佛罗里达州迈阿密-戴德县瑟夫赛德镇发生一起公寓楼局部坍塌事故。事故楼房中共有136套住房，其中55套在坍塌中损毁。\n\
    \n2021年6月29日，美国佛罗里达州迈阿密公寓楼倒塌事故的遇难人数升至12人，仍有149人失踪。\n\n6月30日下午，美国佛罗里达州迈阿密-戴德县官员在新闻发布会上表示，该州近日发生的公寓楼局部坍塌事故，已致18人死亡，仍有147人下落不明。\n\
    \n这样一起严重的事故，折射出许多社会治理方面的问题。不同的理念、不同的技术基础，可以给出不同的解决方案。关于这场事故的成因，网上众说纷纭，扑朔迷离，要等到当地政府公布调查结果估计是旷日持久。\n\
    \n迈阿密公寓楼倒塌事件，有没有好的治理方案？\n\n商业保险不是一个好的答案。商业保险是以个人或者家庭为单位的投保。有的公寓楼居民难以承担保费。保险公司最多只是赔付给买了某个险种的住户，没有责任和义务去善后。\n\
    \n公寓内的每个房屋，产权隶属不同的个人。所有基于产权的保险、救助机制，都无法解决迈阿密公寓整体问题。没有人或者机构为迈阿密公寓整体事件承担责任。迈阿密公寓毫无疑问会面临年久失修的问题，这是危害所有公寓居民公共利益的问题。当这个问题出现时，大家只好去找“业主委员会”。但是业主委员会又有什么能力和资金处理这个公共事件呢？\n\
    \n迈阿密公寓悖论体现了居民的产权和公寓公共安全之间的矛盾。\n\n### 房屋维修基金方案\n\n房屋维修基金包括两个部分，分别是房屋公用设施专用基金和房屋本体维修基金。房屋公用设施专用基金设立的目的，是为物业共用部位、公共设施及设备的更新、改造等项目提供资金。本项专用基金的使用遵循“钱随房走”的原则，账户里的余额在房屋转让时会转移给新的产权所有人。\n\
    \n中国的房屋维修基金制度始于1998年，2004年开始，它成了房屋办理产权证时必须缴纳的费用。2008年，其缴纳标准由最初的“按购房款2%—3%的比例缴交”变为“按住宅建筑安装工程每平方米造价的5%—8%缴交”。\n\
    \n房屋维修基金在一定程度上可以解决迈阿密公寓悖论。大家在购买公寓的时候，要为可能出现的公寓公用设施提前支付一笔费用，用于公共维修的支出。如果房屋维修基金被挪用，问题就大了。在中国，有配套的监管措施，保证这笔钱专款专用、钱随房走。在元宇宙中，就需要利用区块链去中心化的机制，设定智能合约，确保每个公寓的业主都缴纳维修基金，且不能挪作他用。\n\
    \n当然，现实物理世界中“麻烦”很多。法律多如牛毛，智能合约在技术上可以做到图灵完备，但是在现实中，是否可以实现法律完备，的确值得商榷。\n\n2021年4月10日，国家市场监督管理总局公布处罚决定书，责令阿里巴巴集团停止滥用市场支配地位的行为，并对其处以2019年中国境内销售额4557.12亿元4%的罚款，共计182.28亿元。同时向该集团发出行政指导书，要求其全面整改，并连续3年向国家市场监督管理总局提交自查合规报告。182.28亿元，是中国《反垄断法》实施以来开出的最大罚单。\n\
    \n这张最大罚单的出现，代表着中国对于平台型公司的治理就此拉开帷幕。\n\n### 谷歌公司“不作恶”的理念\n\n谷歌“永不作恶”的企业宗旨形成于1999年。谷歌创始人之一阿米特·帕特尔（Amit\
    \ Patel）和一些早期员工担心，当商业人士加盟技术驱动的谷歌之后，他们未来可能出于客户的要求不得不更改搜索结果排名，或者在一些他们不愿意开发的产品上付出精力。谷歌创始人的一封信（后来被称为“不作恶的宣言”）中有这样一句话：“不要作恶。我们坚信，作为一个为世界做好事的公司，从长远来看，我们会得到更好的回馈——即使我们放弃一些短期收益。”\n\
    \n最早看到谷歌公司“不作恶”的理念时，人们感到很奇怪。这不应该是所有公司的底线吗？怎么成了最高目标和必须坚持的原则？不作恶很难吗？但随着对于平台型公司的研究，对于社会学结构洞理论的学习，人们发现“作恶”是所有平台型公司的宿命。\n\
    \n2015年，谷歌似乎也意识到了什么，悄悄地将其著名的格言从“不作恶（Don't be evil）”改成了“做正确的事（Do the right thing）”，从此在赚钱的道路上狂奔，不再理会善恶的说教。是啊，既然做不到，为什么还要说呢？\n\
    \n在网上随便一搜，谷歌可谓劣迹斑斑。\n\n面对利润，谷歌的广告部门主动帮助卖假药者规避合规审查，导致假药、走私处方药、非法药物（如类固醇）的广告网页在搜索结果中大量出现。本案由FBI调查，于几年前和解，谷歌被罚款5亿美元。\n\
    \n“阿拉伯之春”是在阿拉伯国家发生的一次颜色革命浪潮。2010年突尼斯的自焚事件被视为整个“阿拉伯之春”运动的导火线。埃及总统塞西表示，阿拉伯发生的“革命”导致100多万人死亡，并给基础设施造成近1万亿美元的损失。根据一些国际评估结果，在叙利亚、伊拉克、利比亚和也门等国发生的事件同样造成巨大损失，其中仅基础设施损失就达到9000亿美元。这些事件还造成超过140万人失去生命，1500多万人沦为难民。此前被认为是“阿拉伯之春”成功典范的突尼斯，年轻人的失业率约为35%。从经济上看，该国GDP增长自2010年以来一直停滞不前，人均GDP甚至从每年4000美元下降到3600美元。\n\
    \n在这场席卷而来的阿拉伯的颜色革命浪潮中，谷歌、Facebook等公司，扮演了很不光彩的角色。这些大型互联网公司，利用其手中的垄断信息、垄断数据，从“屠龙少年”，最终变成了“恶龙”本身。\n\
    \n### 中心化节点+趋利商业追求，最终走向作恶的深渊\n\n旅客通过一些旅游类App购买机票，App通常会搭售保险。延误险是一个常见的险种，保费低廉，赔付金额也不算高，属于大多数人都可以承担的险种。尤其是在夏季，旅客会遇到因天气不良造成的各种延误，因此这一险种的购买率比较高。\n\
    \n在这个例子中，有消费者、旅游App、保险公司三方。其中消费者和保险公司之间的联系完全通过旅游App建立，旅游App是这三方的中心节点。正常的流程，是消费者下单、购买机票、购买延误险。旅游App记录消费者的购买信息，把机票数据传送给航空公司，保费传送给保险公司。保险公司收到保费后，消费者投保成功。\n\
    \n保险公司和消费者之间并没有直接的联系，如果旅游App截留了消费者投保数据，保险公司对此也一无所知。在理想的情况中，消费者下单购买机票、保费的同时，航空公司、保险公司会收到消费者的购买记录。由于这一切必须通过旅游App来完成，就存在旅游App作恶的风险。飞机延误并不是每次都会发生，消费者也不是每次消费都会购买延误险。双方都是“或有”的情况下，旅游App就有了作恶的空间。它完全可以把部分消费者投保的钱款据为己有。消费者不知情，保险公司也无可奈何。\n\
    \n相信现在很多乘客在打车时有类似的经历：身边明明一辆辆空驶的出租车呼啸而过，网约车App却给你叫来一辆远处的车。这辆远处的车，很可能还是价格比较贵的高端车型。\n\
    \n乘客和司机互不知道对方的需求，只能通过网约车App建立联系。网约车App就是乘客和司机之间的中间节点。凡是作为中间节点的商业组织，都会有利用数据霸权来获取最大商业利益的动机。\n\
    \n商业组织获利是天经地义的，但是如果因为获利的需求，而开始干预本该自由、透明流动的数据，作恶的潘多拉魔盒就被打开了。\n\n谷歌在成立之初提出“不作恶”的口号，就是因为担心商业利益导向会影响搜索结果的排名。但是现在，谷歌可以以各种理由为借口，有时候是“人权”，有时候是“正义”，来肆意干涉搜索结果。澳大利亚的媒体曾被谷歌屏蔽，这相当于澳大利亚这个国家在谷歌上消失了。Facebook也不遑多让，澳大利亚政府要Facebook为澳大利亚媒体原创的内容付费，这一要求导致的结果，就是Facebook直接屏蔽澳大利亚的所有媒体。\n\
    \n这类事件的顶峰，就是美国主流互联网平台联手封杀特朗普，使其在互联网世界中消失了。\n\n### SWIFT——华尔街作恶的工具\n\n银行间的结算系统是环球银行金融电信协会（SWIFT），也叫作环球同业银行金融电信协会。SWIFT的总部设在比利时的布鲁塞尔，它是一个国际银行间非营利性的国际合作组织。SWIFT设立之初，为各国银行提供了快捷、准确、优良的服务。但是其逐渐沦为金融霸权的工具。事实上，如果不能接入SWIFT网络，就很难开展国际贸易。\n\
    \n假如一个中国企业要采购巴西的大豆，由于国际间贸易结算需要使用美元，中国企业就需要把人民币兑换成美元支付给巴西的企业。跨国的货币兑换需要各国银行的配合完成，交易过程中，中国的银行对巴西的银行进行大额支付业务时，就必须通过SWIFT系统。华尔街的金融大鳄因此嗅到了商机：中国的银行机构需要买入美元用于跨国支付。针对中国大额交易的金融套利活动就悄悄展开：华尔街大鳄动用大笔资本购入美元，制造美元供不应求的局面，等中国需要使用美元支付时，发现美元汇率已经上涨了，中国不得不花费额外的成本去购入美元。换句话说，使用SWIFT系统，就把各国所有的重要跨国贸易，统统暴露在华尔街大鳄的面前。美元作为国际贸易的中介，成为他们从中渔利的工具。\n\
    \n美国对伊朗、俄罗斯的经济领域施加的最严厉的制裁，莫过于禁止其接入SWIFT系统。\n\n蒂姆·伯纳斯-李发明了网页浏览器，人类从此进入互联网时代，他被尊称为“互联网之父”。开放、平等是互联网发展的初心，而大型的互联网平台公司犹如数据黑洞，吞噬一切数据，形成垄断霸权，从而利用中心节点的信息优势，开始剥夺人们自由、平等获取数据的权利。蒂姆·伯纳斯-李忧心忡忡地认为，当下互联网的发展已经背离了互联网的初衷。\n\
    \n最终，互联网巨头们，都活成了他们自己讨厌的模样——作为巨无霸型“中介”，形成了事实上的垄断。\n\n## 去中心化的尝试，理想照进现实\n\n中心化商业组织的天然垄断倾向，是根植于其商业基因中的。毫无疑问，这些大型的组织，在推动人类进步方面依然功不可没。但是时代车轮毕竟滚滚向前，人们总是在探索破解之法，建设一个新世界。\n\
    \n最早、最成功的实验，就是比特币。尽管我国目前正在严厉整治“挖矿”（比特币发行机制）行业，但比特币带来的去中心化思想，天然就是对抗互联网巨头、银行等中介机构的武器，也是人类在商业化治理中的探索。\n\
    \n### 比特币，去银行中介\n\n在比特币交易中，是不需要银行的。也就是说，无论是跨国交易还是个人交易，都不需要经过银行这个中介，自然也就不再需要SWIFT系统，华尔街大鳄想要兴风作浪，也不再有任何的信息优势。\n\
    \n比特币是一个完全使用点对点支付改进版电子现金，支持一方直接发送给另外一方的在线支付方式，无须通过金融机构。\n\n在以黄金、白银、铜板这些贵重金属作为货币的年代，是没有银行这个概念的。大家的支付，就是最自然、最原始的点对点支付。所谓点对点，就是买方直接把“钱”交给卖方，不经过任何中间环节。这样的支付方式，从实物货币诞生以来，就是最主流的支付方式，也是所有经济活动的基础。\n\
    \n比特币在数字世界恢复了人类历史上最古老的支付方式——一手交钱一手交货，没有中间商赚差价。\n\n### “智能合约”去第三方的自治商业\n\n在现实商业环境中，事情总有先后发生的次序。就一手交钱、一手交货这个最简单的情况，如果涉及大额资金，也可能陷入“你先给钱”与“你先给货”的矛盾中。买方担心自己付了钱，拿不到货；卖方担心自己给了货，拿不到钱。\n\
    \n中介组织——银行给出的解决方案，就是开立共管账户。资金打入共管账户中，共管双方都同意，才能动用共管的资金。商业流程就变成：第一步，找银行开立共管账户；第二步，买方把资金汇入共管账户中；第三步，卖方发货；第四步，买方确认收货；第五步，共管账户资金汇入卖方账户；第六步，注销共管账户。\n\
    \n银行事实上承担了在商业行为中终极信任者的角色，大家都信任银行。但是如此一来，银行的中心地位又回来了。比特币建立去中心化银行的理想，岂不是又落空了？"
