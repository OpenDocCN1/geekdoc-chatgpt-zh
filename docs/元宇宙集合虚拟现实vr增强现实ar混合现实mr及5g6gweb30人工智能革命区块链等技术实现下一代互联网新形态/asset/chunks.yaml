    # 突破想象的极限，创造无尽的世界


    在物理世界中，创造是需要较长时间的练习的。古代制作家具、铁器、瓷器都是手艺，需要拜师学艺和匠心精神，但是在元宇宙中，创造只是一件和想象力有关的事情，其余所有的一切，软件都能帮你搞定。只要你能想得到，点点鼠标，敲敲键盘，就能轻而易举地设计并实现。无论你是计划建造一座摩天大厦，还是亲手设计一款芯片。元宇宙所有的物理法则、规则，都是人为设计的。人们不光是可以设计物体，甚至可以设计元宇宙本身，创造出形形色色的元宇宙。


    自我实现和创造与欣赏紧密相关。自由自在的创造，如果没有人可以分享，创造也就失去了社会意义。给用户提供创作工具，并提供分享平台，是元宇宙的基本组成部分。


    进一步延伸，就是数字创造产生的商业价值。NFT 已经给出了证明，在虚拟世界中，创作的数字作品，是可以交易产生实实在在的收益的。Roblox 中，玩家可以制作各类物品、皮肤，并在数字市场中，“卖”给那些需要的玩家。由创造进而分享，由分享进而交易，就是元宇宙居民自我实现的进阶之路。


    从 M 世代的成长经历来看，他们几乎和互联网同龄。互联网中光怪陆离的事情就是他们日常生活的一部分。他们被互联网所塑造，同时他们也塑造了互联网。他们从未缺乏物质享受，但是面临选择的障碍。选择障碍的背后，其实是自我的缺失，以及对于自我认同的分裂。


    M 世代对于精神世界的追求，超越所有世代的人。物质需求已经退居次席。当精神需求占据需求的主导位置，整个社会可能就会为之一变。为什么一双普通的耐克鞋，只因为是和某某明星的联名款，就可能被炒作到数万元？这背后是
    M 世代认同的力量。


    这种认同来自某些精神层次的深度共鸣，来自 M 世代自我实现的心理诉求。这是改变社会的力量。


    元宇宙注定是 M 世代的元宇宙，M 世代注定是元宇宙的创世居民。他们相互塑造、相互影响，走在人类文明的最前沿。


