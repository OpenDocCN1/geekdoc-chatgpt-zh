  trans: '


    为满足游戏社区玩家的整体需求，Roblox 的创建者也会对游戏进行快速的更新和调整。正是由于游戏库能不断搭建、变化和扩展，Roblox 才如此受欢迎。用 Roblox
    的官方表述来说，游戏不能被称作游戏，而叫作 Experience（体验）。截至 2020 年底，Roblox 用户已经创造了超过 2000 万种体验，其中
    1300 种体验已经被更广泛的社区造访探索。这些体验都由用户而非公司创造。


    ![](img/image00187.jpeg)


    图 1-7　Roblox 的发展历程（图片来源：Roblox 招股书，天风证券研究所《Roblox 深度报告：Metaverse 第一股，元宇宙引领者》）


    用户每天使用 Roblox 的时间为 2.6 小时，每个月约探索 20 种体验。2020 年第四季度，Roblox 的平均日活用户达到 3710 万。其中超过一半的用户年龄在
    12 岁以下。9 岁至 12 岁的小朋友占比最大，达 29%。而 25 岁以上的青年人仅占 15%。


    用户可以在手机、台式机、游戏主机和 VR 头盔上运行 Roblox。先注册创建一个免费的虚拟形象，然后就可以访问绝大多数的虚拟世界。用户可以通过游戏中的货币（Robux）来获取某一特定世界的最佳体验，或者买一些首饰和服装这类通用道具来凸显个性。2020
    年，Roblox 的付费用户为 49 万。


    Roblox 的经济系统是这样运行的：玩家购买 Robux，然后消费 Robux，开发者和创造者通过搭建游戏来获得 Robux，Robux 可以重新投入游戏中，也可以进行再投资，或者兑换现实世界的货币。在用户购买道具或者服装时，其支付的
    Robux 是给该道具的开发者的，Roblox 在其中收取一小部分佣金。2020 年，超过 120 万名开发者赚到了 Robux，其中超过 1250 名开发者收入高达
    1 万美元，超过 300 名开发者收入高达 10 万美元。不过开发者每年至少赚取 10 Robux 才有资格加入把 Robux 转换成美元的“开发者兑换”计划。


    公司把购买 Robux 的行为称为“booking”，用 Robux 购买道具、服饰、装备或游戏体验后才能确认收入。2020 年 1—9 月用户累计充值 12
    亿美元，其中消费 5.9 亿美元。公司预计 2021 年全年充值金额为 20 亿—21 亿美元，消费 15 亿美元。2020 年，Roblox 营收 9.24
    亿美元，同比增长 80.39%。


    Roblox 公司增长很迅速，但未实现盈利。2020 年 Roblox 公司亏损 2.6 亿美元。亏损是 Roblox 公司对于平台、社区的维护所致，即给予创造者和开发者的分成奖励。这一部分的支出已经超过基础设施和安全成本，在总成本中占比最高。


    成本结构也反映 Roblox 已经形成了飞轮效应。随着更多开发者创造出更好的内容，平台就会吸引来更多的用户。反过来，平台聚集的用户越多，就会鼓励越多的开发者通过
    Roblox 接触其不断增长的用户群。


    目前 Roblox 已经遍布 180 个国家，公司希望通过投资翻译辅助技术的方式渗透其他市场。此外，公司还正在通过与游戏和科技巨头腾讯成立合资公司，来探索中国市场的巨大潜力。[^(\[1\])](#part0009.xhtml#comment_3421)


    ## Roblox 在资本市场的表现


    2021 年 3 月 10 日，Roblox 通过 DPO 的方式在纽交所上市。上市前纽交所的参考价为每股 45 美元，对应市值为 295 亿美元。2021
    年 3 月 11 日收盘，Roblox 市值上涨至 400 亿美元。上市股价一飞冲天，峰值达到每股 103 美元，相较上市前的估值，涨幅接近 10 倍，成为美国资本市场炙手可热的明星股。


    2021 年 2 月，因重仓特斯拉而实现惊人业绩的投资公司 ARKInvestment Management（以下简称 ARK）在 2021 年度投资报告中提出了
    15 个宏大而前景广阔的投资主题。其中之一，便是由虚拟世界联结而成的元宇宙。“牛市女皇”Cathie Wood（ARK CEO）约 52 万股的加仓拉动了
    Roblox 的强劲表现。美国资产管理公司产品经理称，Roblox 上市首日的火爆，反映了过去 6 个月来其他游戏公司和更广泛科技公司上市的情况，也说明二级市场的需求量很大。


    Roblox 的市值还一度超过老牌游戏公司电子艺界 Electronic Arts（EA），且一直高于 Take-Two。上述两家公司营收明显更高，且持续盈利。而
    Roblox 已连续亏损多年，并且亏损幅度还在不断扩大。


    资本市场表现完美的背后是引以为傲的经营数据。过去这两年，Roblox 风靡北美，2020 年 Roblox 在双平台的下载量达到 1.6 亿次，移动平台收入超过了
    11 亿美元，并且成为 2020 年北美圣诞节期间收入最高的手游。


    ## Roblox 首提元宇宙


    科幻小说《雪崩》中描绘了一个被称为“元宇宙”的多人在线虚拟世界，用户以自定义的“化身”在其中进行活动。主角通过目镜设备看到元宇宙的景象，身处于电脑绘制的虚拟世界，其中灯火辉煌，数百万人在中央大街上穿行。元宇宙的主干道与世界规则由“计算机协会全球多媒体协议组织”制定，开发者需要购买土地的开发许可证，之后便可以在自己的街区布局大街小巷，建造楼宇、公园以及各种有悖现实物理法则的东西。主角的冒险故事便在这基于信息技术的虚拟世界中展开。


    元宇宙是指人们生活和工作的虚拟时空。Roblox 是首个将“元宇宙”写进招股说明书的公司。Roblox 提到，有些人把我们的范畴称为“元宇宙”，这个术语通常用来描述虚拟宇宙中持久的、共享的三维虚拟空间。随着越来越强大的计算设备、云计算和高带宽互联网链接的出现，“元宇宙”将逐步变为现实。Roblox
    已经构建出了元宇宙的雏形，其被称为“元宇宙”概念股。


    Roblox 还提出了通向“元宇宙”的八个关键特征，即 Identity（身份）、Friends（朋友）、Immersive（沉浸感）、Low Friction（低延迟）、Variety（多样性）、Anywhere（随地）、Economy（经济）、Civility（文明）。这也是第一家尝试概括描述“元宇宙”特征的商业公司。


    Identity（身份）：每个人登录这个游戏之后，都会获得一个身份。我们在真实世界有一个身份，同时在虚拟世界也需要一个虚拟身份，虚拟世界的身份跟我们是一一对应的。每个人都可以在元宇宙中有一个“化身”，在《雪崩》中，这个化身被称为
    Avatar（阿凡达），本书借用“阿凡达”指称每个人的虚拟身份。身份是构建起完整生态的第一步。


    Friends（朋友）：元宇宙内置了社交网络，每个阿凡达的活动、交流都在元宇宙中进行。


    Immersive（沉浸感）：沉浸感迄今为止是人机交互中被人忽视的一部分，虽然它经常在游戏环境中被提及，但是当你阅读一本特别引人入胜的书的时候，或是观看电影、电视节目的时候也可以有这样的体验。然而，沉浸于书中或者电影中的感受和沉迷于游戏中的感受是非常不同的。在大多数的媒体中，玩家会随着剧情的发展而非外界影响感知角色，因为这个角色的个性已经被作者或者是导演所决定。相反，在游戏中，玩家对游戏角色的控制以及这种代入感成为影响游戏环境的重要因素。


    Low Friction（低延迟）：游戏延迟就是数据从游戏客户端到服务器再返回的速度。网络状态越好，服务器响应越快；使用人数越少，延迟就会越低。在一些需要快速反应的游戏中，比如竞技类和
    RPG 类对战，延迟对于游戏的影响很大。Roblox 里的延迟就很低，因为都是较低像素级别，颗粒度很粗，这时候的计算量也就小一点，普通的电脑也能够承受，如果画面很精细，许多电脑的运转速度根本无法达到要求。


    Variety（多样性）：虚拟世界有超越现实的自由和多元性。


    Anywhere（随地）：不受地点的限制，可以利用终端随时随地出入游戏。


    Economy（经济）：Roblox 有自己的经济系统。当平台上有了足够的玩家与游戏开发者，在 2008 年，公司停止了自身的游戏开发，在平台上线了虚拟货币
    Robux，2013 年 Roblox 又为开发者提供了虚拟商品。之后，Roblox 不断优化这套类似现实世界的货币交易系统。对开发者来说，可以通过四种方式挣得
    Robux，即自己开发的付费游戏销售、在自己开发的免费游戏上获得玩家的时长分成、开发者间的内容和工具付费交易、平台上销售虚拟商品。如 21 岁的 Alex，从
    9 岁开始在 Roblox 上创作游戏，17 岁时，他制作的一款游戏《越狱》爆火，总计被玩过 40 亿次，靠着这款游戏里的皮肤、道具等售卖，Alex 每年能赚取上百万美元。


    Civility（文明）：Roblox 里面也有自己的文明体系。我们在里面可以有生活，几个人可能组成社区，社区就组成了大的城市，认识乡村、城市，甚至各种规则——大家做出共同的规则，然后在里边共同生活下去，演化成一个文明社会，所以它是一个不断演化的过程。


    * * *


    注释：


    [\[1\]](#part0009.xhtml#commentRef_3398) 本书中 Roblox 的简介参考了 VI 研究院的视频，特此感谢。


    # 元宇宙中逍遥游


    元宇宙是人们生活、工作的沉浸式虚拟时空。在元宇宙中，需要重新思考存在和虚无、肉体和精神、性善和性恶、自我和宇宙的哲学命题，需要不断探索有限和无限、秩序与自由、自治与法治、经济与治理、伦理和文明的边界，需要全面融合区块链、AR、5G、大数据、人工智能、3D
    引擎等新技术，形成数字创造、数字资产、数字市场、数字货币、数字消费的新模式。元宇宙是“心”的绽放，是“梦”的具象，是“我思故我在”的全息展现。内求于心，外形于物，物物相生，元宇宙成矣。


    在认知层，元宇宙突破了想象的极限，创造自由自在的世界（见表 1-1）。元宇宙的世界都是由人们所思所想直接幻化而成的，是人类精神的外在表现，是“我心即宇宙，宇宙即我心”的三维呈现。元宇宙秉持共创、共享、共治的价值观，在生产力、生产关系、上层建筑领域具有了共产主义色彩。元宇宙经济则由数字身份、数字资产、数字市场、数字货币、数字消费等关键要素形成的完整经济体系。基本特征体现为沉浸式体验、自由创造、社交网络、经济系统和文明形态。元宇宙综合了人类在各个领域的尖端技术，包括区块链、5G、人工智能、3D
    引擎、VR/AR/XR、脑机接口。这些基础构成了元宇宙的基础设施。


    表 1-1　元宇宙的基础设施


    ![](img/image00150.jpeg)


    ## 文学艺术中的“元宇宙”


    刘慈欣在一部科幻小说中，描写了先进的外星文明对地球的监视。从地球上的生物第一次凝望太空的时候，外星人就把地球列为技术可能爆炸式发展的危险之地，开始对人类展开技术封锁。生物探寻宇宙的历史，甚至超过了人类的历史。


    以“心”为原点，向外探寻物理世界、浩瀚的星空；向内建立丰富的精神世界。向外的思维高峰，无疑是《三体》的《地球往事》《黑暗森林》《死亡永生》三部曲，展现了宏阔的时空，寻找宇宙的边界，一不小心就和心爱的人错过了几十万年。向内求的高峰，首推《逍遥游》，无所持而游无穷，扶摇直上者九万里。摆脱所有世俗之物，超越时空的绝对精神自由。


    “心”外的无尽探求，已经到达了历史的巅峰。介子须弥，人类在纳米级别蚀刻，极尽精微之事。巡天万里，从太空数度往返，开启宏阔旅程。“心”内的精神世界，更多是宗教、文学、艺术领域的创造。伟大的艺术作品往往包括完整宇宙观的构建。中国作品如《红楼梦》《西游记》等，西方作品如《荷马史诗》《哈利·波特》等。


    《西游记》中对于“心”的描写，最为直观、典型。吴承恩处处留下暗示：孙悟空就是唐僧的“心”幻化而成的形象。孙悟空拜师学艺的地方，挂着一副对联：“灵台方寸山，斜月三星洞。”灵台和方寸在道教中都是指“心”，斜月三星更是一个“心”字。可以说《西游记》记录了唐僧取经的历程，是以唐僧的心为原点，构建了“元宇宙”。


    电影艺术中，最能给人带来直接观感和深刻启迪的，莫过于《黑客帝国》和《头号玩家》。这两部电影都在试图回答一个问题：何为真实？我们大脑感受的世界，是不是就是虚幻的世界？


    心外到极致广大，心内到极尽精微，反而可能就是一体。我心即宇宙，宇宙即我心。


    ## 何为真实？


    这是我 2018 年 12 月，去中国商用飞机有限责任公司（以下简称中国商飞）参观时拍的一张照片。我在 ARJ21 飞机的模拟舱中体验飞机驾驶的乐趣（见图
    1-8）。教练员观察了一下我的体格，只是启动了初级模拟程序，也就是巡航阶段的操控。当然我也有自知之明，如果开启模拟飞鸟撞击发动机的程序，我就得晕倒在模拟舱中了。


    ![](img/image00159.jpeg)


    图 1-8 作者赵国栋在 ARJ21 飞机的模拟机舱中


    飞行员都是在模拟舱中训练，甚至有了实际的飞行里程后，还需要定期到模拟舱复训。因为在模拟舱中可以模拟飞行员平时在飞行过程中很难经历的场景。譬如飞鸟撞击发动机，导致一侧发动机失火，从而失去动力，该如何处理？


    很多人都看过电影《中国机长》，刘长健机长驾驶四川航空 3U8633 航班执行航班任务时，在万米高空突遇驾驶舱风挡玻璃爆裂脱落、座舱释压的极端罕见险情。像这样的险情，极少发生。但是在模拟舱中，可以真实再现这种极端情况，从而考查飞行员的应急能力和驾驶水平。


    模拟舱和真实的 ARJ21 飞机一模一样，只是把机身、机翼换成了几个液压杆，模拟各种飞行姿态。一架模拟舱的造价并不便宜。中国商飞也只有两架模拟舱。对飞行员而言，执行飞行任务无疑是真实的。但在模拟舱中能体验真实飞行过程中几乎不会遇到的场景。虚拟世界中飞行的场景则更丰富。飞行员的学习和培训都是在模拟舱中完成的。


    何为真实？“真实”这个词有语言的模糊性。无论是模拟舱还是飞机，给人的驾驶体验都是一样的。但是模拟舱可以给飞行员极端情况下的体验，当然，我们祈祷飞机永远不要给驾驶员极端的驾驶体验。


    就体验的丰富性来讲，虚拟世界是远远超越物理世界的。对个人而言，无论是虚拟世界还是物理世界，体验都是真实的。


    体验真实，感受真实，超越了物理世界，物理世界和虚拟世界的界限将不再清晰。


    再看《黑客帝国》中的场景，都是电脑程序刺激大脑获得的信号。大脑的体验是真实的，所以尼奥无从分辨虚幻的世界，直到吃下墨菲斯手中的蓝色药丸（蓝色药丸代表物理世界，红色药丸代表虚拟世界，见图
    1-9）。


    ![](img/image00168.jpeg)


    图 1-9 电影《黑客帝国》剧照（图片来源：影片截图）


    元宇宙中一个重要特性就是体验真实，超越物理世界。


    元宇宙是精神世界的逍遥与物理世界的星空璀璨的奇妙融合。5G、3D、VR 等技术发展，把心即宇宙的心学认知，变成了超现实的虚幻存在。


    如果把元宇宙定义为工作和生活的虚拟时空，其实还有很多符合这个定义的系统，不只是游戏和电影。只是电影带来的视觉冲击力和游戏带来的沉浸感，让我们更容易体验到自由自在的创造，释放无拘无束的天性，去感受那些在真实世界永远不可能发生的事情。


    ## 共创、共享、共治的价值观


    在元宇宙中许多产品是“阿凡达”创造的，当然也存在一些阿凡达组成团队，推出一些制作精良的产品的情况。元宇宙中 UGC（用户创造内容）是主流的方向，很难像管理员工一样管理阿凡达，因为难以制定时间明确的任务、确立考核指标。


    但是成熟的游戏中，大都建立了“任务”机制，大家在游戏中完成任务，获得激励。激励可能是积分、游戏币，也可能是某些稀有的装备。换句话说，激励阿凡达创造，是不得不考虑的事情。因为这是元宇宙中“生产”的前提，同时也是满足玩家自我实现的精神需要。有了创造，才有可能形成产品。有了产品，就需要交换的场所。因此也就发展起数字市场。


    共创是一起做蛋糕，共享是一起分蛋糕，共治是一起制定做大蛋糕、分好蛋糕的游戏规则。“共创”“共享”“共治”分别关乎生产力（共创）、生产关系（共享）、上层建筑（共治）三个元宇宙社会结构的根本方面。共荣则是从元宇宙整体来讲，达到的最终目标——元宇宙的繁荣。


    共创和共享方面，一些企业都做得不错。譬如苹果给开发者分成；微软公司新推出的 Windows 11，号称开发者在其系统上创造的所有应用都免费，微软不会收取任何费用；抖音、哔哩哔哩等平台上，创作者也可以获得可观的报酬。


    但是在共治方面，这些中心化的公司体制，几乎没有给共治留下制度空间。许许多多以区块链为底层技术支撑的去中心化应用，走在了前面。


    用这三个价值观考察元宇宙第一股——Roblox，发现其“共治”价值观也没有得到很好的体现。共治，恰恰是区别新经济与旧经济、新理念与旧理念、新模式与旧模式的关键点。


    关于元宇宙治理的问题，我们在第五章详细讨论。


    ## 元宇宙的经济体系


    数字经济是以数据为主要生产要素的经济活动，既包含物质产品生产、流通、消费的内容，也包括数字产品的创造、交换、消费的内容。换句话说，无论是物质产品还是非物质产品，只要在生产、流通、消费的任何一个环节，利用数字技术或者数据，都是数字经济的范畴。而元宇宙经济严格限定数字产品的创造、交换、消费的所有环节，都必须在数字世界中完成。


    元宇宙经济是数字经济的特殊形式，体现出元宇宙经济的特殊性。元宇宙经济同时是数字经济的组成部分，必然体现出数字经济的一般性特征。特殊性主要体现为“经济人”假设崩溃、认同决定价值而非劳动决定价值、边际成本降低、边际效益提高、交易费用趋近于零等特性。一般性体现为符合经济的基本原理，市场规模越大，经济就会越繁荣。


    元宇宙经济要素包括数字创造、数字资产、数字市场、数字货币、数字消费。其特征明显区别于传统经济，表现为计划和市场的统一、生产和消费的统一、监管和自由的统一、行为和信用的统一。


    元宇宙经济的特征决定了它是深入研究数字经济的绝佳样本。我们在元宇宙经济中得到的一些结论，放在数字经济体系中详加考查的话，结论未必和元宇宙经济完全相同，但对于建立我国的数字经济体系有深刻的启示意义。


    元宇宙经济是很多平台型公司的必然选择。所有平台型公司或多或少都具备融入元宇宙经济的部分特征，尽管其表现形式略有差异。表 1-2 给出了不同类型元宇宙经济体系的对比。


    表 1-2　不同类型元宇宙经济体系的对比


    ![](img/image00176.jpeg)


    关于元宇宙经济，将在第四章中详加讨论。


    ## 元宇宙的基本特征


    关于元宇宙的特征，众说纷纭。Roblox 总结了八方面，去芜存菁，我认为有五方面可以囊括元宇宙的基础特征。


    第一，沉浸式的体验。


    抖音、微信、腾讯的游戏帝国也都是元宇宙。如果我们认为元宇宙是人们生活和工作的虚拟时空的话，为什么在微信、抖音如日中天的时候，我们没有提出元宇宙的概念，只是用“产业生态”这个词来形容微信、抖音构筑的商业帝国呢？


    当然，我们也有沉迷于刷抖音的时候，甚至一刷就是一两个小时。但是没有人觉得自己是在另外一个“时空”。虽然我们的眼睛紧盯着几寸大小的屏幕，但是依然可以感受到屏幕以外发生的事情。在手机屏幕的方寸之间，并没有身临其境的感觉。


    但是 VR 不同，当你戴上头盔的瞬间，就好像经过时空隧道穿越到另外一个时空，就像《头号玩家》里面的场景一样。


    沉浸式的体验，给我们带来超越现实的震撼，从此与物理世界“阴阳两隔”。就像两个平行的宇宙，需要借助“虫洞”连接。穿越虫洞，就是另外一个宇宙。


