    遇见，太难了。“遇”殊为不易，“见”更是难上加难。仓央嘉措曾说，最好不相见。错过的，都不值得留恋。有结果的，终会遇见。


    我们总是上下求索。“昨夜西风凋碧树，独上高楼，望尽天涯路。”也许从精神上来讲，每个人都是独特的，谁能完全了解谁呢？当到了“高处”，更是所和者寡，你的引吭高歌，换来的只是空谷回音。能做的只是“衣带渐宽终不悔，为伊消得人憔悴”。尽管如此，在别人眼中，疯子一样啊，无缘无故，怎么泪流满面、形容枯槁？辛弃疾也只是长叹，把吴钩看了，栏杆拍遍，也无人明白他登临之意。


    欲说而不可能，更是令人气结。岳飞半夜梦醒，听寒蛩凄切，慨叹：“欲将心事付瑶琴。知音少，弦断有谁听？”俞伯牙更绝望，听闻钟子期去世，就把琴砸了，说再没有人能听懂他琴中之意了。


    在路上，虽然山重水复，一直走，终会柳暗花明。只是蓦然回首时，灯火阑珊处的那个人，真的是那个人吗？


    也许一开始，我们就是错的。起心动念之间，就是一条不归路。也许一开始，我们就是茫然的，寻寻觅觅之间，迷茫如故。也许一开始，在内心深处最柔软的地方萌发的种子，还没有开出绚烂的花朵，就算遇到了，也会擦肩而过，“遇”而不“见”。


    秦观有感而发，“金风玉露一相逢，便胜却人间无数”。尤其是相遇在群峰耸峙的山巅，相遇在星汉璀璨的天边。更重要的是，就算卑微如尘埃，此时此刻，内心深处的种子，已经绚烂如花！


    遇见，就是最好的礼物！


