    \ 陈格雷. Z世代的亚文化圈层大搜罗\\[Z/OL\\]. https://t.qianzhan.com/daka/detail/210325-91d9232f.html,\
    \ 2021-03-25\\[2021-06-21\\].\n\n## 突破想象的极限，创造无尽的世界\n\n在物理世界中，创造是需要较长时间的练习的。古代制作家具、铁器、瓷器都是手艺，需要拜师学艺和匠心精神，但是在元宇宙中，创造只是一件和想象力有关的事情，其余所有的一切，软件都能帮你搞定。只要你能想得到，点点鼠标，敲敲键盘，就能轻而易举地设计并实现。无论你是计划建造一座摩天大厦，还是亲手设计一款芯片。元宇宙所有的物理法则、规则，都是人为设计的。人们不光是可以设计物体，甚至可以设计元宇宙本身，创造出形形色色的元宇宙。\n\
    \n自我实现和创造与欣赏紧密相关。自由自在的创造，如果没有人可以分享，创造也就失去了社会意义。给用户提供创作工具，并提供分享平台，是元宇宙的基本组成部分。\n\
    \n进一步延伸，就是数字创造产生的商业价值。NFT已经给出了证明，在虚拟世界中，创作的数字作品，是可以交易产生实实在在的收益的。Roblox中，玩家可以制作各类物品、皮肤，并在数字市场中，“卖”给那些需要的玩家。由创造进而分享，由分享进而交易，就是元宇宙居民自我实现的进阶之路。\n\
    \n从M世代的成长经历来看，他们几乎和互联网同龄。互联网中光怪陆离的事情就是他们日常生活的一部分。他们被互联网所塑造，同时他们也塑造了互联网。他们从未缺乏物质享受，但是面临选择的障碍。选择障碍的背后，其实是自我的缺失，以及对于自我认同的分裂。\n\
    \nM世代对于精神世界的追求，超越所有世代的人。物质需求已经退居次席。当精神需求占据需求的主导位置，整个社会可能就会为之一变。为什么一双普通的耐克鞋，只因为是和某某明星的联名款，就可能被炒作到数万元？这背后是M世代认同的力量。\n\
    \n这种认同来自某些精神层次的深度共鸣，来自M世代自我实现的心理诉求。这是改变社会的力量。\n\n元宇宙注定是M世代的元宇宙，M世代注定是元宇宙的创世居民。他们相互塑造、相互影响，走在人类文明的最前沿。\n\
    \n# 03  \n\n游戏，寒武纪大爆发\n\n你有过这种感觉没有，就是你吃不准自己是醒着还是在做梦。\n\n——电影《黑客帝国》\n\n游戏是人类文明的起点。席勒说：“只有当人在充分意义上是人的时候，他才游戏；只有当人游戏的时候，他才是完整的人。”同时，游戏也是大自然赐予的学习方式，只不过，商业游戏的异化，掩盖了游戏的学习、教育功能。\n\
    \n游戏是元宇宙的雏形，将会综合艺术、文化、技术形成探索元宇宙文明的大潮。游戏必将担负起先行者、引领者的角色，拉动上游产业、带动相关产业，逐次进入元宇宙时代。\n\
    \n传统产业的发展，有必要借鉴游戏的思想；传统产业的数字化转型，必须融入游戏的元素。这也是进入元宇宙的必由之路。\n\n大约5亿4200万年前到5亿3000万年前，地质学上将这段时间作为寒武纪的开始时间。在这段时间里，种类繁多的无脊椎动物化石突然出现。长期以来，在早期更为古老的地层中，人们并未发现其明显的祖先化石，这种现象被古生物学家称作“寒武纪生命大爆发”，简称“寒武爆发”。\n\
    \n当生物学家还在苦苦寻求证据的时候，哲学家似乎已经找到了答案。在复杂的系统中，突变是系统演化的常态。引起变化的因素经过长时间的积累首先表现为量的变化。直到某一时刻，由于受到一个微小扰动的影响，经年累月的量变就会迎来质变，系统也为之一新。演化便从此加速，进入新时代。\n\
    \n## 游戏，是文明的起源\n\n### 玩而时学之，动物们的玩耍[^(\\[1\\])](#part0019.xhtml#comment_7119)\n\
    \n玩耍对于动物的生存至关重要，玩耍不但可以帮助它们练习将来用得到的本领，而且还有助于提高它们的运动协调性，增强它们的体力。从哺乳动物到灵长类动物，它们的幼崽都是在玩耍中学习将来生存的本领。可见，玩耍并非阻碍健康成长的因素，反而是动物成长中不可缺少的行为，是为生存打下基础的关键环节。\n\
    \n### 游戏，大自然赐予的学习方式\n\n观察、模仿和游戏，似乎是孩子们学习的自然路径。从来没有人特意教孩子怎么用手机，尤其是智能手机、平板电脑之类。孩子们看着你用手指在屏幕上指指点点，他也就学着指指点点。每次“指点”手机有反应，孩子就会觉得有趣，跟着乱指、乱点、乱划。观察、模仿和游戏是必须经过的阶段。因为教父母使用智能手机，确实是要“教”的，而且还很难教会。最关键的是，父母从不乱指、乱点、乱划。然而，在看似乱来的过程中，一些新的操作手势可能就被孩子激活了，甚至成年人都不会用的操作，孩子很容易就掌握了。\n\
    \n在这样的学习中，规则被一点一点地建立。两个孩子玩耍中，就会发展出相处的规则。譬如，抢玩具是不行的。你抢他玩具，他也会抢你的玩具。如果还想继续玩儿，就得学会不能互相抢玩具。\n\
    \n规则的建立，其实就是游戏的社会意义。在游戏中，人们学会如何与他人相处、如何与世界相处。棋牌、麻将和桌游是在现实世界进行的传统游戏。它们的社交性更强，除了娱乐性以外，也承载了很多信息交换和社交的功能。\n\
    \n中国古代的“六艺”——礼、乐、射、御、书、数，其实也是游戏，只是需要划归高雅的游戏。\n\n古人有云：“尧造围棋，以教子丹朱。”孔子曰：“志于道，据于德，依于仁，游于艺。”“游于艺”在根本上是解放人心灵的手段，是使人走向完整的人的必要方式。席勒说：“只有当人在充分意义上是人的时候，他才游戏；只有当人游戏的时候，他才是完整的人。”\n\
    \n但是现代的教育，却把游戏和学习对立起来。尤其是风靡一时的游戏大作，仅仅以满足玩家的快感、体验为重点，忽略了潜移默化的教育过程。而学习则变成循规蹈矩的重复练习，忽略了玩耍的学习效用。在元宇宙的多维时空中，游戏是否可以回归其本质？\n\
    \n### 游戏，文明的起源\n\n荷兰语言学家和历史学家约翰·赫伊津哈（Johan Huizinga）著有《游戏人生》，其是第一部从文化学、文化史学视角切入，对游戏进行多层次研究的专著，阐述了游戏的定义、性质、观念、意义、功能及其与诸多社会文化现象的关系。\n\
    \n约翰·赫伊津哈明确指出：“文明是在游戏之中成长的，在游戏之中展开的，文明就是游戏。”“在文化的演变过程中，前进也好，倒退也好，游戏要素渐渐退居幕后，其绝大部分融入宗教领域，余下结晶为学识（民间传说、诗歌、哲学）或是形形色色的社会生活。但哪怕文明再发达，游戏也会‘本能’地全力重新强化自己，让个人和大众在声势浩大的游戏中如痴如醉。”\n\
    \n赫伊津哈认为，无论科学多么成功地将游戏的特征加以量化，在面对诸如游戏的“乐趣”这些概念的解释时，科学也束手无策。“大自然本可以轻而易举地以纯粹机械反应的方式将‘释放过剩的精力’‘劳碌之后的放松’‘生活技能的培训’‘补偿落空的期盼’等这些有用功能赠予她的孩子——可大自然并未这么做。她给了我们游戏，给了我们游戏的紧张、游戏的欢笑，还有游戏的乐趣。”因此，我们不必探究影响游戏的自然冲动和习性，而要研究游戏这种社会结构的各种具体形式，“尽可能按照游戏的本来面目看待游戏”。\n\
    \n赫伊津哈首先指出，游戏超出了人类生活领域，因此它的产生与任何特定阶段的文明和世界观无关。在文化本身存在以前，游戏就已经存在，它在初始阶段伴随着文化，渗透进文化，直至我们当前所处的文明阶段。接着，他指出，游戏无法被直接归入真、善、美的范畴。因为游戏无法为人类所独有，故不以理性为基础。游戏处于智愚、真假、善恶对立之外，不具备道德功能，不适用于善恶评价。尽管游戏与美之间联系丰富，但也不能说美是游戏本身固有的。那么，如何界定游戏呢？他说：“我们只能到此为止，因为游戏是一种生存功能，我们不能从逻辑学、生物学或美学上对其加以精确定义。游戏概念必定始终有别于其他用以表述精神生活和社会生活结构的思维形式。”\n\
    \n他认为，人类和动物在一般意义上的游戏特征是一致的。就一般意义上的游戏而言，人类文明并未添加任何不可或缺的特征。但是对这种一般意义上的游戏，他并未深入探讨，只写道：“游戏中，某种超越生命直接需求并赋予行动意义的东西‘在活动’（at\
    \ play），一切游戏都有某种意义。”赫伊津哈主要探究的是人类群体性游戏的特征。“既然我们的主题是游戏与文化的关系，那就不必探究所有可能的游戏形式，让我们研究其社会表现形式即可。我们也可以称之为高等形式的游戏。”由此，他归纳出游戏的三个特征：一、游戏是自由的，是真正自主的。游戏是儿童和动物的自主行为，因为他们喜欢游戏。如果要说这种自主不存在，是本能驱使了他们游戏，这种假设游戏实用的做法犯了窃取论点（petitio\
    \ principii）的谬误。二、游戏不是“平常”生活或“真实”生活。孩子们都心知肚明，“只是在假装”或“只是好玩而已”，但这并不会使游戏变得比“严肃”低级。然而，游戏可以升华至美和崇高的高度，从而把严肃远远甩在下面。”三、游戏受封闭和限制，需要在特定的时空范围内“做完”（playedout）。“游戏有时间限制，但它和文化现象一样具有固定形态，可以形成传统。”“游戏的进行受到空间限制。竞技场、牌桌、魔环、庙宇、舞台、银幕、网球场和法庭等在形式和功能上都是游戏场所，即隔开、围住奉若神明的禁地，并且特殊规则通行其间。它们都是平行世界里的临时世界，用于进行和外界隔绝的活动。”赫伊津哈还探讨了封闭的游戏场所内的秩序与规则，认为游戏创造了秩序，甚至游戏就是秩序。“它把暂时的，受约束的完美带进残缺的世界和混乱的生活。”无视规则，就会成为“搅局者”，而“搅局者”比“作弊者”威胁更大，因为其破坏了游戏世界本身。\n\
    \n在探讨完游戏的特征后，赫伊津哈开始论述这种高等形态游戏的功能。“高等形态的游戏功能主要来自两方面：一是为某样东西竞赛；二是对某样东西再现。而通过游戏以‘再现’竞赛，或游戏成为出色再现某样东西的竞赛，这两种功能就合二为一了。”这里，他重点探讨了宗教表演。我们也可借此窥见他是如何分析文化的游戏要素的。赫伊津哈认为宗教表演“以再现来实现（actualization\
    \ byrepresentation）”，并处处保留着游戏的特征。他引用了德国人类学家弗洛贝尼乌斯的观点：“远古人类以祭祀戏来表演万物运行的博大秩序，在祭祀戏中再现了游戏中再现的事件，并借此帮助维护宇宙秩序。”但赫伊津哈认为弗洛贝尼乌斯在谈游戏用于再现某种天象并以此令其发生时，“某种理性的成分混了进来”“似乎偷偷重新认可了他强烈反对过的，与游戏本质水火不容的目的论”“在他看来这一事实是次要的，至少从理论上看，激情可以用其他方式传达。而我们认为，恰恰相反，全部的要点就在于游戏”。赫伊津哈进而认为，这种宗教的仪式表演和儿童游戏、动物游戏在本质上没有不同。“游戏特有的所有要素（秩序、紧张、运动、变化、庄重、节奏、痴迷）在古代社会游戏中早已具备，只是在稍后的社会阶段，游戏才与‘在游戏中并通过游戏表达某样东西’的观念联系在一起，人类认为自己扎根于万物的神圣秩序中，借助了游戏的形式和功能，这种意识找到了最初的表达，也是最高级、最神圣的表达。而游戏自身则是无意义、非理性的独立实体。宗教活动的意义渐渐渗透进游戏，仪式本身嫁接其中，但根本之物还是游戏，也一直是游戏。”\n\
    \n我们似乎预估到了读者的反应，仪式的严肃是崇高而神圣的，那这还能算游戏吗？赫伊津哈在此借用了柏拉图的观点：“极度严肃唯有神配得上，而人是神造的玩偶，那就是人的最佳用途。因此，男男女女都要照此生活，玩最高尚的游戏，并达到有别于当前的另一种精神境界。”他极其赞赏柏拉图这种把游戏等同于神圣，并称神圣为游戏的观点，认为我们在游戏中“既可以在严肃的层面下活动，也可以在这之上活动——在美的领域和神圣的领域活动”。但是赫伊津哈也在提防我们过度延伸游戏的概念，认为所有的宗教仪式，如巫术、礼拜、圣餐和秘仪等活动全是游戏。“涉及抽象概念时，务必不要牵强附会，玩文字游戏。”赫伊津哈在论述仪式是游戏的观点时是极其小心的。他一步步地追问：“游戏与仪式的相似是否纯粹限于形式？”“以游戏形式进行的这种宗教活动，在多大程度上是以游戏的姿态和心态进行的？”“游戏的本质特征之一，即‘只是在假装’的意识，与虔诚举行的仪式活动在多大程度上兼容？”并且，他引用了人类学者们的关于节庆、古代宗教仪式、野蛮人仪式的大量研究，最后得出：仪式就是柏拉图所谓的游戏。“我们追随他，决不放弃圣洁的神秘体验，并坚持把这种体验视为逻辑思维认识不到的最崇高的情感。”\n\
    \n可以说，赫伊津哈是想用游戏为人类的文明寻找出路。在赫伊津哈的另一部著作《中世纪的衰落》中，他指出三条实现美好生活的道路：宗教的彼岸理想、现实世界的改进和梦境，也就是超现实的途径。而《游戏的人》正体现了他的第三条途径，也就是超现实的途径。他没有仅仅将游戏视为对现实的逃避。在他看来，游戏体现了人类超越现实的冲动。“如果认为世界完全受盲目力量支配的话，游戏就纯属多余了——只有精神的洪流冲垮了为所欲为的宇宙决定论，游戏才可能存在，我们才能想象游戏、理解游戏。正因为游戏的存在，人类社会超越逻辑推理的天性才被不断证实。”\n\
    \n历史学家罗伯特·贝拉（Robert Bella）认为：人是唯一不能100%生活在现实中的物种。我们总是要通过各种方式去脱离现实、超越平庸。游戏和做梦、旅游、艺术活动等一样，都是我们超越现实的手段，或许这才是游戏对于人类真正的意义。\n\
