    ## 两个超大陆——鸿蒙和以太坊

    鸿蒙系统代表了广泛的硬件和软件之间的统一平台，并不仅仅因为鸿蒙是国人主导的操作系统，更重要的是它是历史上首个跨硬件平台的操作系统。以太坊代表软件和数据之间的统一平台，真正铺就了通往纯粹的数字世界的道路。这个完全以数据为基础的世界，正在以难以置信的方式影响物理世界。


    元宇宙是构建在鸿蒙和以太坊筑牢的地基之上的。人类丰富的精神世界，正是借助“超大陆”的统一技术和标准，才能摆脱物理世界的限制，在元宇宙中自由绽放。


    ### 鸿蒙，软件万物生

    最早让操作系统在千家万户中普及的是美国微软公司，它从诞生到现在，一直牢牢占据PC机操作系统市场，市场份额高到一度令苹果公司绝望。微软为了免予垄断的指责，主动注资苹果公司，保持苹果系统在PC机市场可怜的存在。三十年河东三十年河西，现在苹果借助iOS操作系统，以一己之力几乎垄断了高端手机市场。在手机操作系统的竞争中，微软落败，取而代之的是苹果和谷歌公司两家争雄。


    苹果的iOS和谷歌的安卓系统，这两家公司的系统几乎占据了智能手机100%的市场份额。谁能打破这种令人窒息的局面呢？华为的鸿蒙系统横空出世，把iOS和安卓垄断的铁幕撕开一角。


    严格意义上来讲，鸿蒙并不是为了和安卓、iOS竞争而生的，而是为了解决越来越多的智能硬件如何高效率互联互通的问题。这些智能硬件，大到智能汽车，小到智能耳机、手环，当然也包括使用量最大的智能手机。


    这个目标是远远超越iOS和安卓系统的。iOS和安卓系统只能用在智能手机上。仅苹果一家就不得不维护两套操作系统，一个是iOS支持苹果的智能手机、平板，另一个是MacOS支持苹果的个人计算机。在华为的世界中，PC机、电视机、平板计算机、智能汽车、手表、VR眼镜、音响、耳机，甚至摄像头、扫地机、智能秤、微波炉、豆浆机、冰箱等都可以使用鸿蒙系统。一套系统支持所有硬件设备。


    这个愿景真是太诱人了，一下子就把程序员的创造力极大地激发出来。


    对开发者而言，再也不用担心不同的硬件需要不同的指令，甚至需要开发多套程序来适配。鸿蒙首先就是一个数字创造的工具。鸿蒙设计理念的领先性已经远远超过目前所有商用的操作系统。只有谷歌的Fuchsia系统可以与之媲美，但是Fuchsia远远未能投入使用。


    微软发布了Windows 11系统，在业界并没有引起广泛的关注，相反大家倒是津津乐道Windows 11可以支持安卓系统上的应用。微软也向着PC和手机融合的方向迈进了一大步。但遗憾的是，这仅仅是手机和PC的融合。显而易见，未来是多终端、多场景、多硬件的时代，单单把PC和手机融合已经满足不了产业发展的需要。Windows
    11在发布之初，就已经落后于鸿蒙了。


    当然，鸿蒙也是首个在消费领域大规模应用的“国产”操作系统，在中美博弈的关键时刻，鸿蒙也是很长民族志气的。


    无论元宇宙采用什么技术支持元宇宙的软件，必须运行在操作系统之上。作为世界上首个着眼于硬件互联的操作系统，鸿蒙一定是元宇宙的超大陆。


    ### 以太坊，数字万物生

    关于区块链和以太坊的图书，可谓汗牛充栋。但是其理念之新、哲学思考之深、技术实现之简，都令人叹为观止。如果说鸿蒙是集合众智集团冲锋的丰碑，以太坊就是V神个人才华充分挥洒的神迹。


    在数字世界中，无论我们做什么操作，最后总是反映在数据状态的改变上。数据状态，是数字万物的起点，也是数字万物的终点。改变了数字状态，也就改变了数字万物。无论是数字创造，还是数字市场，都是如此。以太坊实现了改变数据状态的去中心化可编程通用计算，关键词是去中心化。


    改变数据状态，在中心化的系统中非常容易。我们以上一章提到的电影产业为例。一部电影，总共卖了多少张票？票数就可以看作电影的一个状态。只要卖一张票，票数就加一，这个操作非常简单。但是如果票房作假怎么办？譬如电影院现场卖票，卖完票并没有修改票数的“状态”（没有执行加一操作），这就造成票数和收到的钱数不符的情况，因为有些卖出去的票没有记账，这就是偷票房。这种行为显然对影院有利，但是损害了电影制作方及发行方的利益。


    中心化的卖票系统，要有人监督才行。最终解决方案是成立电影票房的监管机构，履行监管的责任。


    成立监管部门的成本是非常高昂的，最终由全行业承担，增加了市场的交易成本。在数字世界中无法成立监管部门，因此如何杜绝记账节点做假账，随意修改数据状态，就是必须解决的一个问题。


    好在这个问题在区块链1.0时代就有了行之有效的解决方案。通过算力证明的共识机制，确保即使没有中心化的记账监管机构，也能确保记账工作被正确记录，并且不可篡改（见图6-1）。


    ![](Images/image00164.jpeg)


    图6-1　从区块链1.0到区块链2.0（图片来源：国盛证券研究所）


    以太坊更进一步。比特币的记账仅仅是记录交易信息，但是以太坊的记账可以记录任何想记的信息，并且可以通过编程来实现，而且继承和发扬了去中心化共识机制（见图6-2）。


    自从2009年比特币上线以来，区块链世界发展迅速，尤其是以太坊。搭建了去中心化的通用计算平台后，各种去中心化应用层出不穷，最具代表性的是DeFi和NFT。


    比特币证实了在数字世界实现点对点货币支付的可行性。以太坊进一步证实，点对点的任何数字世界的行为都是可行的，都可以无须借助第三方实现零信任背景下的可信交易。这就为数字世界建立了基础的交易规则、行为规则，从而衍生出各种各样的应用，形成了区块链的元宇宙。


    ![](Images/image00172.jpeg)


    图6-2 区块链的发展：从去中心化账本到去中心化元宇宙（图片来源：国盛证券研究所）


    ### DeFi

    中本聪设计比特币的初衷就是摆脱银行的中心化地位，实现点对点的支付。毫无疑问，比特币实现了这个目标。从以太坊衍生出的DeFi，所谓去中心化的金融，在点对点支付的基础上，衍生出各类金融业务。显而易见，在这类金融业务中，是没有传统金融机构的身影的。DeFi业务领域涉及稳定币、借贷、交易所、衍生品、基金管理、彩票、支付、保险等。这只是粗略的分类，这些业务又可以像积木块一样相互叠加，衍生出新的金融产品。


    这些金融业务在物理世界恐怕难以理解。大国和小国面对去中心化应用心态各异。我国正在全力收紧比特币挖矿行业，限制比特币的交易和炒作。与此同时，南美小国萨尔瓦多宣布将比特币作为它们国家的法定货币。


    于我国而言，不经过银行的跨国转账无疑是转移资产的便利手段。在中美竞争态势之下，不受节制的转移资产通道，是不能容忍的。相信很多人都没有听说过萨尔瓦多这个国家，该国面积2万多平方千米，人口600多万，与中国省会城市相比，估计也要排到中游靠后的位置。在美元的冲击之下，它几乎丧失了货币主权，宣布将比特币作为法定货币至少可以抵御美元通胀。


    元宇宙为DeFi提供了丰富的应用场景。譬如7月3日，链游The Sandbox上的一块24cm×24cm的虚拟地产拍卖成交价为364万美元，创历史新高。此前，The
    Sandbox上虚拟地产最高成交价为65万美元。


    传统的金融机构无法为游戏中的虚拟地产拍卖提供任何帮助，这就给了DeFi大显身手的舞台（见表6-3）。


    表6-3　传统金融VS去中心化金融（资料来源：国盛证券研究所）


