    在专业生产内容（PGC）方面，第一方游戏内容是建立元宇宙的基础场所，而目前3D游戏在场景和人物建模上都需要耗费大量的人力、物力和时间。为实现元宇宙与现实社会高度同步，算法、算力及AI建模技术的进步有望提升PGC的生产效率。在用户生产内容（UGC）方面，第三方自由创作的内容，以及闭环经济体的持续激励，是元宇宙延续并扩张的核心驱动力。目前游戏UGC创作领域编程门槛过高，创作的高定制化和易得性不可兼得，同时鲜有游戏具备闭环经济体。因此，为达到元宇宙所需的可延展性，需要区块链经济、AI、综合内容平台等产业的技术突破。


    ## 谁来补苍天？


    区块链与元宇宙，相互依存，不可分割。区块链提供了元宇宙基础的组织模式、治理模式、经济模式所必需的技术架构，更重要的是，区块链去中心化的价值观，与元宇宙“共创、共享、共治”的价值观完全一致，相互成就。


    在物理世界中，作为上层建筑的政府，其作用无可替代。元宇宙在某种意义上是物理世界在数字世界的投射。但是很少有人愿意在元宇宙中给政府留个位置。尽管元宇宙的创世者们，并不是无政府主义者。


    西方有些思想家，把政府比喻成看门人，守护着社会的秩序和规则。当然政府的作用远不止于此。但是我们不得不考虑，元宇宙的创世居民（以M世代为主）有不少喜欢把反抗家长的权威作为追求自由的象征，如何引导他们积极健康地面对生活成为一个关键的课题。


    既然是追求无拘无束的体验、驰骋天地的自由，为什么非要设计一个类似“家长”的机构呢？


    但是元宇宙中，必须有规则，而且这些规则的执行，最好不必依赖某个中心化的组织。因此，区块链就派上了用场。


    另外，构建真正统一的元宇宙，需要“跨宇宙”机制，保证在不同的宇宙中，都能以相同的身份活动，而不是成为一个个平行宇宙的分身。我们无法用游戏A的ID去登录游戏B；游戏B的装备也无法在游戏A中使用。在玩家看来，它们就是永无交集的平行宇宙。


    也许有些资产，譬如“皮肤”，很可能是在不同的游戏中使用的。这些“资产”也就可以“跨宇宙”传播。


    能提供这种跨宇宙传递数字资产的技术，目前只有区块链可以做到。NFT就提供了一个解决方案的模本。


    ### 元宇宙为NFT提供丰富的应用场景


    NFT（Non-Fungible Tokens）的英文直译是“非同质化代币”。但这个翻译本身表达不是十分清晰。它是区块链的一个条目，代表了某个独一无二的数字资产如博物馆里的世界名画，或者一块土地的所有权。它是数字世界中的一种资产，独一无二、不可复制，同时也可以进行买卖，可以用来代表现实世界中的一些商品，但它存在的方式是数字化，保存在以太坊的区块链中。


    许多人大力宣传，NFT是区块链最重要的应用场景，是推动元宇宙发展的重要力量。的确，NFT让我们看到物理世界的资产与数字世界资产联通的可能性，但是有个非常重要的问题，可能被NFT的拥趸们忽略——NFT的内在价值，缺少足够的共识。


    一双袜子拍出15万美元，推特上最早的5个英文单词拍出250万美元，一幅将5000天每天发布的数码绘画作品汇集在一起的作品拍出6900多万美元，这些价格是依据什么制定的？


    毫无疑问，单纯从上述NFT的基础物品（一双袜子、5个英文单词、一幅已发布数码作品的汇集作品）看，都不可能有这么高的价格！


    那么，这些物品加上NFT作为加密的权益证明，就可以使其价格几十倍、几百倍、几千倍地升值吗？显然，一双袜子，无论使用何种权益加密技术，也难以使其价格过分上涨；推特上最早的5个英文单词的推送人更是尽人皆知，实际上是否需要类似NFT的权益证明都值得怀疑；一幅将5000天每天发布的数码绘画作品汇集在一起的新作品加上NFT权益证明（不代表对其归集的5000幅作品都进行了权益证明保护），就使其价格大幅上涨，并不存在合理的基础。


    对这些高价格合理的解释只能是信仰的力量、炒作的结果。因此，有专家曾公开发文呼吁人们慎重对待NFT。很多人急于投资NFT，一个重要原因就是为了彰显自己在数字世界的领先地位并抢夺NFT升温后可能大幅升值的潜在收益，并会为此不遗余力地夸大NFT的价值，甚至进行相互炒作以抬高NFT的价格，竭力让更多的人相信并跟随投资，存在强烈的“传销”特性，投资风险是非常大的。


    在元宇宙中，每个数字产品，都有真实的游戏玩家支撑。每个NFT可能很难代表实际的价值，却是玩家体验的真实记录。从这个意义来讲，元宇宙赋予NFT意义。


    没有NFT，元宇宙同样得到发展，就像现在Roblox做的一样，然而元宇宙可以带动NFT成长，甚至规范其交易规则，并且渐渐趋于理性。


    ## 互联网进化的终极形态


    蒂姆·伯纳斯-李在1990年发明了第一个网页浏览器，自此互联网开始蓬勃发展。苹果2007年发布第一代iPhone手机，互联网进入移动互联时代。PC互联网独领风骚17年，移动互联网也已历经14年。上网的终端从以PC电脑、笔记本为主，过渡到以智能手机为主。现在即将迎来新的变革，上网终端很可能从智能手机，逐步过渡到VR/AR等设备。这个大周期估计也将持续10到15年。


    另外一条发展脉络就是前面提及的区块链。自从2009年比特币上线以来，区块链技术日益得到普及。从区块链衍生出来的治理模式、商业模式，叠加互联网的发展，构成一曲恢宏的乐章。


    以VR/AR设备、区块链、游戏叠加形成的新的互联网形态，正呼之欲出（见图1-12）。继PC互联网、移动互联网，即将过渡到元宇宙时代。


