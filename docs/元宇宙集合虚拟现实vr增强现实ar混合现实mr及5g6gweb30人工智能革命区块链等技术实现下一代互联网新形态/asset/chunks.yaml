- raw: "三位年轻人聚在一起，写了一本通俗读本，把刚刚火起来的新词“元宇宙”条分缕析，形成一门学问。对传统学者而言，以一个月的高谈阔论成书过于草率鲁莽。不过，对于站在数字世界边缘的新生代们，这已经是姗姗来迟了。我熟悉这三位年轻人，他们都是驰骋在移动互联网、大数据和区块链三个领域的资深玩家，是充满激情的布道者。“弄潮儿向涛头立，手把红旗旗不湿”。\n\
    \n翻阅全书，多有饶舌烧脑处，跌跌撞撞，却又藕断丝连，具有逻辑张力。从游戏引爆“元宇宙”开始，展开了一个以网络、数字和人工智能为基础的虚拟世界。从比特币到NFT，将混沌初开的幻象彼岸过滤成万千独一无二的可交易产品和场景。在书中，传统的价值体系被无情抛弃，习惯的经济学、社会学和政治学规则逐一失灵。归根结底一句话，新生代的共识才能创造“元宇宙”的价值。\n\
    \n庞杂的架构、突兀的词语、松散的逻辑、急促的分析，这本书看上去似乎不那么成熟，作者没有提供任何解决方案，但给了读者无限的解读空间和自由的想象空间。有趣的是，三位作者仍然站在传统的大陆上向未来的新世界努力投射智慧光芒，各种假设、各种预期、各种指标，甚至各种“基础设施”建议。不过，“元宇宙”已经使人类切断了基因脐带的全新结构，在无限的“0”与“1”的组合中衍生自己的命运了。\n\
    \n过去100年里，人类基本解决了衣食住行这些现实世界的种种困扰。\n\n过去30年里，人类创造了可以承载精神寄托的网络平台和数据工具。\n\n现实世界中我们无法企及的幻想和难以排解的焦虑，可以在平行的精神“元宇宙”中解放了，何其快哉也！\n\
    \n我们在“元宇宙”里肆意放纵的意志和天马行空的臆想终于得到释放，而且，还可以下凡到现实世界里小试锋芒，更是痛快淋漓！\n\n人类归根结底是精神生物，几千年的产业文明积累让我们享受物质化生存，而几十年的互联网和数字革命则让我们回归精神社会。\n\
    \n“元宇宙”——才是人类初心。\n\n7月15日，在北京瑞吉酒店的盖亚星球大会讲演上，我对约300名被称为Z世代人类的年轻大学生讲道，“元宇宙”不是一个，而是无数个。每个人都有自己的“元宇宙”，每个人还可以有许多个同时叠加的“元宇宙”。你们这一代远比我们这些还在现实世界中挣扎的传统一代更加快乐和有创造力。\n\
    \n“元宇宙”不同于哲学家的冥想空间，这是一个数据化、网络化、智能化的大千世界，我们可以设计、编辑、运行、体验和把握的超现实世界，而且可以关联、干预、创造和操控我们生存的现实世界。\n\
    \n理解了“元宇宙”，我们才能更好地理解和享受我们的现实世界。\n\n推荐大家读一读这套书，一起开启未来的智识历程。\n\n王巍  \n\n金融博物馆理事长\
    \  \n\n2021年7月19日\n\n# 前言  \n\n当经济学“遇见”元宇宙\n\n理论的突破，很难从大而全的概括中产生。世界纷繁复杂、万物普遍联系。因此，研究理论、总结规律需要几个条件：其一，合理的取舍，从万物普遍联系中，分离出那些最具代表性、先进性，变化程度最高的典型案例。其二，研究这些案例，找到原子级别不可再分的构成要素；研究这些要素的特征和要素间的关系，甚至定义出原子级别的操作。其三，回归到整体，整体的问题还需要整体求解，看看得出的结论是否经得起时间和其他要素的检验。\n\
    \n元宇宙经济就是数字经济的最佳范例，从元宇宙入手，就可以得出和传统经济学，包括秉承新自由主义经济学和新制度经济学的所有经济学家，完全不同的结论。虽然我们还不能说完全推翻了这些传统经济学的种种教条，但是一个完整的、先进的经济学体系正在建立。元宇宙经济学的先进性，恰恰在于元宇宙实践的特殊性。\n\
    \n元宇宙是一个完整、自洽的经济体系，是纯粹的数字产品生产、消费的全链条。从商品的属性来看，元宇宙经济学和传统经济学相同，遵循相似的供需规律，但是从商品生产、消费的全链条来看，又完全不同。元宇宙中的商品，完全是在元宇宙中制造和消费的，层层剖析到最后，无非是“0”“1”的排列组合。从某种意义上来看，元宇宙的商品是脱离物理世界的单独存在，尽管它们之间可以发生千丝万缕的联系。\n\
    \n依据元宇宙的特性，我们可以把经济划分为两种类型：以实物商品为主要研究对象的传统经济和以数字商品为主要研究对象的元宇宙经济。数字经济是以数字要素作为关键生产资料的经济活动。传统经济升级的方向是数字经济，数字经济中最活跃、最彻底、变化最剧烈的部分，恰恰是元宇宙经济。因此，元宇宙经济中蕴含的经济规律就具备了普适性。长期以来，传统经济学的研究已经进入误区，走进了封闭、保守的圈子。传统经济学家对信息科技引起的变化不敏感，在社会变化最剧烈的领域几乎整体性失声，相反，未来学家大行其道。传统的西方经济学已经失去了解释世界变化的能力，更谈不上预测未来。经济学亟须在继承中创新，在创新中升华，形成新的经济理论体系。元宇宙经济的特殊性体现在数字商品的创造和消费中，数字商品不消耗任何的物理世界的“物质”，也不存在物理世界的仓储、物流等问题，在某种意义上呈现“量子”的特性。本质上数字商品，或者更严格地说，数字物体都是“离散”的、不遵循任何物理规律的，所有在元宇宙呈现的“规律”都是代码规定的人工规律，可以模拟任何物理规律，譬如量子纠缠、瞬间移动等。在元宇宙中，时间和光速都是可以任意修改的参数。\n\
    \n元宇宙也是五脏俱全的社会，阿凡达们在不同的元宇宙中可能代表人们真身的某个侧面。善良的愈加善良，邪恶的愈加邪恶。物理世界的任何政府，无论秉持什么样的意识形态，总是要惩恶扬善的，总是要以保护生命为主并将其作为基础的社会价值。但是就像神话中创世之后有天堂和地狱之分，元宇宙中也有地狱一样的存在。这些问题，第五章将详细探讨。\n\
    \n元宇宙天然是“原子性”的，所有物品、关系、规则，最终都体现在二进制代码“0”“1”的排列组合中。我们无法在元宇宙中再细分这两个最小的组成单位。物理世界则不同，一路“细分”下来，发现原子，原子组成要素有质子、中子、电子，再细分发现质子、中子由“夸克”组成，再研究夸克，发现其不过是一份份离散的能量。科学家开始用“弦”来描述“夸克”，那用什么来描述“弦”呢？按照弦论的观点，宇宙不过是几种“弦”不同振动方式构成的一首华丽的乐曲而已。宇宙和元宇宙到底哪个才是更真实的存在呢？\n\
    \n还好，至少元宇宙的原子性和离散性是确切无疑的。基于原子性的要素，人们可以定义基础的原子性的操作，周全而无遗漏。布尔代数完全穷尽了“0”和“1”的所有操作。元宇宙同物理世界的关系，可以通过采样定理[^(\\\
    [1\\])](#part0007.xhtml#comment_2494)决定，物理世界可以在元宇宙中被精确还原，譬如在元宇宙中可以构建宏观物体的量子态。反之则未必成立。\n\
    \n比特币定义了金融场景的原子操作，就是点对点的货币支付。所有金融行为，最终都可以归结为点对点货币支付。由点对点金融支付，可以衍生出所有的金融业务。以太坊定义了数据变换的原子操作，就是点对点的数据变换，可以通过编程的方式实现任何点对点的数据变换，并且确保这种变换是不可逆的、不可被篡改的。这就实现了元宇宙社会中，关于“信任”“信用”的原子性操作。\n\
    \n利用区块链技术，可以让任意的被加密的“一段数据”成为数字资产，给无差别的“数据”打上了独一无二的“身份”标签。从而数据变成了资产，具备有偿流通的可能性，进一步衍生出经济行为，发展为充满活力的商业世界。\n\
    \n满足人们生理需求的物理世界和满足人们精神需求的虚拟世界，在人的需求层次上是一个整体。尽管在物理世界中，也可以满足部分的精神需求。这两个世界并不是物理意义上的“平行宇宙”，而是紧密的、相互联系的，人是其中重要的纽带。无论是在物理世界还是虚拟世界，人类都可以获得知识，虚拟世界知识的丰富性甚至远超物理世界（如训练飞行员的模拟舱）。因此不能把物理世界和虚拟世界割裂地看待。从人的方面来看它们依然是统一的，是人的不同需求的不同满足方式。\n\
    \n随着物质财富的增多、改造物理世界技术的进步，人们在物理世界中工作的时间越来越少，而沉浸在虚拟世界的时间越来越多。人们不可逆转地向虚拟世界迁移。有统计数据显示，人们在物理世界的工作时间，全天在4小时左右。未来人们的思考和决策都是在虚拟世界中完成的，而执行是在物理世界中完成的。就像人们的思考依赖大脑，执行依赖四肢一样。\n\
    \n基于此，我们现在研究元宇宙就有了现实的意义。我们不是在空谈一个类似乌托邦的概念，而是通过对元宇宙的探讨，加速改变整个世界，建立起日益丰富的数字世界，改造出更加美好的物理世界。\n\
    \n全书从六个方面来研究元宇宙，共分为七章。\n\n第一章概述元宇宙种种特性、技术基础。部分读者从第一章中就可以获得全书的观点概要。\n\n第二章分析元宇宙的居民，并给他们取了一个名字——M世代。M即“Metaverse”的首字母。以“95后”“00后”为主体的M世代。他们的喜怒哀乐，决定了元宇宙的种种特性。他们才是元宇宙的原住民。\n\
    \n第三章重点讲游戏。游戏是元宇宙的第一个雏形，其能够以可视化的形式体现元宇宙的特征，游戏对于画面清晰度、流畅度、真实度方面的不断的追求，一直是通信、3D技术、算力发展的原动力。更重要的是，通过借鉴游戏的发展，其他各行各业都可以找到通往元宇宙之路。当然不同的行业难易程度不同，进阶必有先后，但是思维却须同步。\n\
    \n第四章探讨元宇宙经济学。本章指出元宇宙经济学是数字经济中最活跃、最具前瞻性的有机组成部分；提出了元宇宙经济不同于传统经济的一些显著特征，同时向传统经济学奉为金科玉律的观点提出了挑战。\n\
    \n第五章讨论元宇宙治理问题。我们很难在元宇宙中建立类似“政府”的机构。自治似乎是唯一的解决方案。面临“邪恶共识”的情况、面临大面积发生的“灾难”事件，目前似乎并无统一解决的良策。治理之路仍然在探索之中。技术进步很快，治理模式则在物理世界的摩擦中艰难前行。\n\
    \n第六章以“超大陆”之名，探讨元宇宙的基础设施。本章从物理层、软件层、数据层、规则层、应用层展开论述，并且提出了产业“超大陆”的领先实践——EOP（生态运营平台）的概念。\n\
    \n第七章讨论技术对产业和社会的影响。数字技术正在系统性地和人类大脑、躯干更紧密地融合。后人类社会和硅基生命在数字技术浪潮中，正一步一步变成现实。人类则借助VR/AR等终端设备，在不同的元宇宙之间自由穿越。\n\
    \n本书成书只有短短一个多月的时间，仓促之中，错漏实多，还望各位读者不吝指正。元宇宙讲究的是“进化”。本书作为与元宇宙的第一次“遇见”，希望在进化过程中逐步完善。\n\
    \n![](Images/image00174.jpeg)  \n\n2021年7月20日\n\n* * *\n\n注释：\n\n[\\[1\\]](#part0007.xhtml#commentRef_2483)\
    \ 采样过程所应遵循的规律，又称取样定理、抽样定理。采样定理说明采样频率与信号频谱之间的关系，是连续信号离散化的基本依据。在进行模拟/数字信号的转换过程中，当采样频率f[s.max]大于信号中最高频率f[max]的2倍时（f[s.max]＞2f[max]），采样之后的数字信号完整地保留了原始信号中的信息，一般实际应用中保证采样频率为信号最高频率的2.56—4倍。\n\
    \n# 01  \n\n元宇宙即将到来\n\n大家来到“绿洲”是因为可以做各种事，但是他们沉沦于此是为了不一样的人生。\n\n——电影《头号玩家》\n\n\
    元宇宙是人们娱乐、生活乃至工作的虚拟时空。Roblox这款游戏，展示了元宇宙的诸多特征。核心是数字创造、数字资产、数字交易、数字货币和数字消费，尤其是在用户体验方面，达到了真假难辨、虚实混同的境界。\n\
    \n元宇宙具备从虚拟物品生产到消费的宏观产业链条的闭环，从而形成以虚拟商品为主要交易对象的独立经济体系。元宇宙经济学呼之欲出，成为数字经济中最活跃、最具革命性的部分。\n\
    \n共创、共享、共治是元宇宙的基本价值观。在元宇宙中生活、工作正在成为M世代亚文化中的一部分，进而形成社会思潮，从而重塑元宇宙社会，并影响现实社会。在传统文化和元宇宙文化相互渗透融合中，人类文明或将被重新塑造。\n\
    \n大约再过15年，互联网就可能会发生一次重大的变革。正如从PC为主要上网终端过渡到手机，现在也将由手机过渡到VR/AR设备，开始互联网下一个15年的演变周期，人类将迎来互联网大变局的前夜。\n\
    \n“末影龙”“苦力怕”这些稀奇古怪的名字是什么？如果你不知道，虚心地向小孩子们请教，他们会兴高采烈地告诉你。我就是在吃早饭的时候，问刚刚上小学一年级的儿子：什么是“苦力怕”？他回答我说：“那是一种怪物，靠近你就会爆炸！”还边说边比画。\n\
    \n“末影龙”“苦力怕”都是游戏《我的世界》（Minecraft）[^(\\[1\\])](#part0008.xhtml#comment_2826)中的角色（见图1-1）。它们在其中生存，在你不小心的时候，忽然发起攻击。这款游戏中，所有的物体、生物都是由一个个小方块构成的，甚至连太阳都是方形的。比起画面精良的大作，这里面的每个物体都显得很粗糙。但是玩家沉溺其中乐此不疲，他们可以用这些小方块“创造”出各种各样的东西。有人在《我的世界》中建造了城市，有人甚至根据电路知识，从搭建与非门开始，制造出完整的计算机。更重要的是，玩家们可以被组织起来开展活动，譬如召开毕业典礼。\n\
    \n![](Images/image00182.jpeg)\n\n图1-1 游戏《我的世界》中的画面  \n\n（图片来源：网易游戏《我的世界》官网）\n\n\
    2021年6月16日，中国传媒大学动画与数字艺术学院的毕业生们在《我的世界》这个游戏中根据校园风景的实拍搭建了建筑，还原了校园内外的场景，上演了一出别开生面的“云毕业”（见图1-2）。除了还原了校园的基本风貌，花草树木和校猫也亮相其中。在“典礼”的进行过程中，校长还提醒同学们“不要在红毯飞来飞去”。这场“毕业典礼”在哔哩哔哩直播的时候，还有网友感慨地说像“霍格沃兹的毕业典礼”。\n\
    \n![](Images/image00191.jpeg)\n\n图1-2 中国传媒大学“云毕业”场景  \n\n（图片来源：哔哩哔哩视频《中国传媒大学创意“云毕业”打造游戏世界中的毕业典礼》截图）\n\
    \n中国传媒大学的“云毕业典礼”其实并非首例，美国加州大学伯克利分校的100多名在校生和校友也在游戏《我的世界》里复制了整个校园，在六周内再现了100多栋校园建筑物，包括大家熟悉的小商店，甚至一些条幅（见图1-3）。\n\
    \n![](Images/image00154.jpeg)\n\n图1-3 加州大学伯克利分校第11任校长Carol Crist在致辞  \n\n（图片来源：加州大学伯克利分校官网）\n\
    \n《堡垒之夜》（Fortnite）与美国饶舌歌手Travis Scott展开跨界合作，在游戏中举办“ASTRONOMICAL”虚拟演唱会，场次横跨美国和欧洲、亚洲、大洋洲等服务器（见图1-4）。根据Epic\
    \ Games的官方统计，目前已表演的场次吸引了超过1200万名玩家同时在线参与，创下惊人的纪录。下图中的动漫人物就是Travis Scott在《堡垒之夜》中的形象。\n\
    \n![](Images/image00162.jpeg)\n\n图1-4  Travis Scott在《堡垒之夜》中的形象  \n\n（图片来源：腾讯游戏《堡垒之夜》官网）\n\
    \n达美乐比萨，算是在虚拟世界中最知名的比萨了。因为它开发了一款应用，在应用中，人们可以戴上AR眼镜，在虚拟现实中买比萨。\n\n史蒂文·斯皮尔伯格执导的电影《头号玩家》，把故事的背景设定在了2045年，世界处于混乱和崩溃边缘，令人失望。人们将救赎的希望寄托于“绿洲”，一个由鬼才詹姆斯·哈利迪一手打造的虚拟游戏世界。人们只要戴上VR设备，就可以进入这个与现实形成强烈反差的虚拟世界（见图1-5）。在这个世界中，有繁华的都市，有形象各异、光彩照人的玩家，而不同次元的影视游戏中的经典角色也可以在这里齐聚。就算你在现实中是一个挣扎在社会边缘的失败者，在“绿洲”里依然可以成为超级英雄，再遥远的梦想都变得触手可及。哈利迪弥留之际，宣布将巨额财产和“绿洲”的所有权留给第一个闯过三道谜题、找出他在游戏中隐藏彩蛋的人，自此引发了一场全世界范围内的竞争。\n\
    \n![](Images/image00170.jpeg)\n\n图1-5 电影《头号玩家》宣传海报\n\n现实生活中无所寄托、沉迷游戏的少年韦德·沃兹，只是一个生活在贫民区的普通人——害羞、不合群、毫无存在感。但是在“绿洲”中，他化身帕西法尔，自信、勇敢、机智，成为人们心目中的超级英雄。凭着对虚拟游戏的深入剖析，他历经磨难，找到隐藏在关卡里的三把钥匙，完美通关，拥有了“绿洲”的所有权。\n\
    \n电影中展现的“绿洲”，已经被《我的世界》这一类型的游戏率先实现了，尽管画面像素感很强，尽管人们的虚拟形象很“方”，但是已经切切实实地展示了一个虚拟的世界。大家来到“绿洲”是因为可以做各种事情，他们沉浸于此，是为了体验不一样的人生。\n\
    \n著名的美国科幻小说家尼尔·斯蒂芬森（Neal Stephenson）在1992年撰写的《雪崩》（Snow Crash）一书中描述了一个平行于现实世界的网络世界——元宇宙（Metaverse）（见图1-6）。所有现实世界中的人在元宇宙中都有一个网络分身（Avatar）。斯蒂芬森笔下的元宇宙是实现虚拟现实后下一个阶段的互联网的新形态。\n\
    \n![](Images/image00178.jpeg)\n\n图1-6 科幻小说作家尼尔·斯蒂芬森早在1992年出版的《雪崩》中就提到了元宇宙的概念，图为《雪崩》封面\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0008.xhtml#commentRef_2788) 《我的世界》是一款3D第一人称沙盒游戏，玩家可以在三维空间中自由地创造和破坏不同种类的方块，用想象力建立并探索一个专属于玩家的世界。\n\
    \n## Roblox创世纪\n\n故事要从1989年的一个小砖块开始讲起。当时David Baszucki和Erik Cassel编写了一个叫作“交互式物理学”的2D模式物理实验室，为之后他们二人创建Roblox打下了深厚的基础。通过“交互式物理学”，来自全球各地的学生可以观察到两辆车是如何相撞的，也可以学习到如何搭建房屋。这些孩子的设计令人惊叹，激发了二人的雄心，如何让青少年的创造能力发挥更大的作用呢？于是，他们开始构建作为想象力平台的基础核心组件，于2004年正式成立了Roblox，致力于打造一个新一代的平台，为人们提供一个更加人性化、让大家可以自由表达的平台，突破想象的极限，尽情地抒发个性，通过游戏创作，分享人生体验。\n\
    \n### Roblox简要介绍\n\nRoblox成立17年后，于2021年3月10日在纽交所上市（见图1-7）。Roblox既提供游戏，又提供创作游戏的工具（创造者开发工具Roblox\
    \ Studio），同时它有很强的社交属性，玩家可以自行输出内容、实时参与，并且还有独立闭环的经济系统。作为一个兼具游戏、开发、教育属性的在线游戏创建者系统，Roblox中大部分内容是由业余游戏创建者创建的。如果我们有什么有意思的游戏构思，但无法获得商业资助，就可以通过Roblox\
    \ Studio，自主创作游戏，然后邀请其他玩家来参与。随着其他人的参与，游戏规则在玩的过程中逐渐形成与完善，也会随着小组成员约定的玩法而慢慢改变。"
  fmt: "\n三位年轻人聚在一起，写了一本通俗读本，把刚刚火起来的新词“元宇宙”条分缕析，形成一门学问。对传统学者而言，以一个月的高谈阔论成书过于草率鲁莽。不过，对于站在数字世界边缘的新生代们，这已经是姗姗来迟了。我熟悉这三位年轻人，他们都是驰骋在移动互联网、大数据和区块链三个领域的资深玩家，是充满激情的布道者。“弄潮儿向涛头立，手把红旗旗不湿”。\n\
    \n翻阅全书，多有饶舌烧脑处，跌跌撞撞，却又藕断丝连，具有逻辑张力。从游戏引爆“元宇宙”开始，展开了一个以网络、数字和人工智能为基础的虚拟世界。从比特币到NFT，将混沌初开的幻象彼岸过滤成万千独一无二的可交易产品和场景。在书中，传统的价值体系被无情抛弃，习惯的经济学、社会学和政治学规则逐一失灵。归根结底一句话，新生代的共识才能创造“元宇宙”的价值。\n\
    \n庞杂的架构、突兀的词语、松散的逻辑、急促的分析，这本书看上去似乎不那么成熟，作者没有提供任何解决方案，但给了读者无限的解读空间和自由的想象空间。有趣的是，三位作者仍然站在传统的大陆上向未来的新世界努力投射智慧光芒，各种假设、各种预期、各种指标，甚至各种“基础设施”建议。不过，“元宇宙”已经使人类切断了基因脐带的全新结构，在无限的“0”与“1”的组合中衍生自己的命运了。\n\
    \n过去100年里，人类基本解决了衣食住行这些现实世界的种种困扰。\n\n过去30年里，人类创造了可以承载精神寄托的网络平台和数据工具。\n\n现实世界中我们无法企及的幻想和难以排解的焦虑，可以在平行的精神“元宇宙”中解放了，何其快哉也！\n\
    \n我们在“元宇宙”里肆意放纵的意志和天马行空的臆想终于得到释放，而且，还可以下凡到现实世界里小试锋芒，更是痛快淋漓！\n\n人类归根结底是精神生物，几千年的产业文明积累让我们享受物质化生存，而几十年的互联网和数字革命则让我们回归精神社会。\n\
    \n“元宇宙”——才是人类初心。\n\n7月15日，在北京瑞吉酒店的盖亚星球大会讲演上，我对约300名被称为Z世代人类的年轻大学生讲道，“元宇宙”不是一个，而是无数个。每个人都有自己的“元宇宙”，每个人还可以有许多个同时叠加的“元宇宙”。你们这一代远比我们这些还在现实世界中挣扎的传统一代更加快乐和有创造力。\n\
    \n“元宇宙”不同于哲学家的冥想空间，这是一个数据化、网络化、智能化的大千世界，我们可以设计、编辑、运行、体验和把握的超现实世界，而且可以关联、干预、创造和操控我们生存的现实世界。\n\
    \n理解了“元宇宙”，我们才能更好地理解和享受我们的现实世界。\n\n推荐大家读一读这套书，一起开启未来的智识历程。\n\n王巍  \n金融博物馆理事长 \
    \ \n2021年7月19日\n\n# 前言\n## 当经济学“遇见”元宇宙\n\n理论的突破，很难从大而全的概括中产生。世界纷繁复杂、万物普遍联系。因此，研究理论、总结规律需要几个条件：其一，合理的取舍，从万物普遍联系中，分离出那些最具代表性、先进性，变化程度最高的典型案例。其二，研究这些案例，找到原子级别不可再分的构成要素；研究这些要素的特征和要素间的关系，甚至定义出原子级别的操作。其三，回归到整体，整体的问题还需要整体求解，看看得出的结论是否经得起时间和其他要素的检验。\n\
    \n元宇宙经济就是数字经济的最佳范例，从元宇宙入手，就可以得出和传统经济学，包括秉承新自由主义经济学和新制度经济学的所有经济学家，完全不同的结论。虽然我们还不能说完全推翻了这些传统经济学的种种教条，但是一个完整的、先进的经济学体系正在建立。元宇宙经济学的先进性，恰恰在于元宇宙实践的特殊性。\n\
    \n元宇宙是一个完整、自洽的经济体系，是纯粹的数字产品生产、消费的全链条。从商品的属性来看，元宇宙经济学和传统经济学相同，遵循相似的供需规律，但是从商品生产、消费的全链条来看，又完全不同。元宇宙中的商品，完全是在元宇宙中制造和消费的，层层剖析到最后，无非是“0”“1”的排列组合。从某种意义上来看，元宇宙的商品是脱离物理世界的单独存在，尽管它们之间可以发生千丝万缕的联系。\n\
    \n依据元宇宙的特性，我们可以把经济划分为两种类型：以实物商品为主要研究对象的传统经济和以数字商品为主要研究对象的元宇宙经济。数字经济是以数字要素作为关键生产资料的经济活动。传统经济升级的方向是数字经济，数字经济中最活跃、最彻底、变化最剧烈的部分，恰恰是元宇宙经济。因此，元宇宙经济中蕴含的经济规律就具备了普适性。长期以来，传统经济学的研究已经进入误区，走进了封闭、保守的圈子。传统经济学家对信息科技引起的变化不敏感，在社会变化最剧烈的领域几乎整体性失声，相反，未来学家大行其道。传统的西方经济学已经失去了解释世界变化的能力，更谈不上预测未来。经济学亟须在继承中创新，在创新中升华，形成新的经济理论体系。元宇宙经济的特殊性体现在数字商品的创造和消费中，数字商品不消耗任何的物理世界的“物质”，也不存在物理世界的仓储、物流等问题，在某种意义上呈现“量子”的特性。本质上数字商品，或者更严格地说，数字物体都是“离散”的、不遵循任何物理规律的，所有在元宇宙呈现的“规律”都是代码规定的人工规律，可以模拟任何物理规律，譬如量子纠缠、瞬间移动等。在元宇宙中，时间和光速都是可以任意修改的参数。\n\
    \n元宇宙也是五脏俱全的社会，阿凡达们在不同的元宇宙中可能代表人们真身的某个侧面。善良的愈加善良，邪恶的愈加邪恶。物理世界的任何政府，无论秉持什么样的意识形态，总是要惩恶扬善的，总是要以保护生命为主并将其作为基础的社会价值。但是就像神话中创世之后有天堂和地狱之分，元宇宙中也有地狱一样的存在。这些问题，第五章将详细探讨。\n\
    \n元宇宙天然是“原子性”的，所有物品、关系、规则，最终都体现在二进制代码“0”“1”的排列组合中。我们无法在元宇宙中再细分这两个最小的组成单位。物理世界则不同，一路“细分”下来，发现原子，原子组成要素有质子、中子、电子，再细分发现质子、中子由“夸克”组成，再研究夸克，发现其不过是一份份离散的能量。科学家开始用“弦”来描述“夸克”，那用什么来描述“弦”呢？按照弦论的观点，宇宙不过是几种“弦”不同振动方式构成的一首华丽的乐曲而已。宇宙和元宇宙到底哪个才是更真实的存在呢？\n\
    \n还好，至少元宇宙的原子性和离散性是确切无疑的。基于原子性的要素，人们可以定义基础的原子性的操作，周全而无遗漏。布尔代数完全穷尽了“0”和“1”的所有操作。元宇宙同物理世界的关系，可以通过采样定理[^(\\\
    [1\\])](#part0007.xhtml#comment_2494)决定，物理世界可以在元宇宙中被精确还原，譬如在元宇宙中可以构建宏观物体的量子态。反之则未必成立。\n\
    \n比特币定义了金融场景的原子操作，就是点对点的货币支付。所有金融行为，最终都可以归结为点对点货币支付。由点对点金融支付，可以衍生出所有的金融业务。以太坊定义了数据变换的原子操作，就是点对点的数据变换，可以通过编程的方式实现任何点对点的数据变换，并且确保这种变换是不可逆的、不可被篡改的。这就实现了元宇宙社会中，关于“信任”“信用”的原子性操作。\n\
    \n利用区块链技术，可以让任意的被加密的“一段数据”成为数字资产，给无差别的“数据”打上了独一无二的“身份”标签。从而数据变成了资产，具备有偿流通的可能性，进一步衍生出经济行为，发展为充满活力的商业世界。\n\
    \n满足人们生理需求的物理世界和满足人们精神需求的虚拟世界，在人的需求层次上是一个整体。尽管在物理世界中，也可以满足部分的精神需求。这两个世界并不是物理意义上的“平行宇宙”，而是紧密的、相互联系的，人是其中重要的纽带。无论是在物理世界还是虚拟世界，人类都可以获得知识，虚拟世界知识的丰富性甚至远超物理世界（如训练飞行员的模拟舱）。因此不能把物理世界和虚拟世界割裂地看待。从人的方面来看它们依然是统一的，是人的不同需求的不同满足方式。\n\
    \n随着物质财富的增多、改造物理世界技术的进步，人们在物理世界中工作的时间越来越少，而沉浸在虚拟世界的时间越来越多。人们不可逆转地向虚拟世界迁移。有统计数据显示，人们在物理世界的工作时间，全天在4小时左右。未来人们的思考和决策都是在虚拟世界中完成的，而执行是在物理世界中完成的。就像人们的思考依赖大脑，执行依赖四肢一样。\n\
    \n基于此，我们现在研究元宇宙就有了现实的意义。我们不是在空谈一个类似乌托邦的概念，而是通过对元宇宙的探讨，加速改变整个世界，建立起日益丰富的数字世界，改造出更加美好的物理世界。\n\
    \n全书从六个方面来研究元宇宙，共分为七章。\n\n第一章概述元宇宙种种特性、技术基础。部分读者从第一章中就可以获得全书的观点概要。\n\n第二章分析元宇宙的居民，并给他们取了一个名字——M世代。M即“Metaverse”的首字母。以“95后”“00后”为主体的M世代。他们的喜怒哀乐，决定了元宇宙的种种特性。他们才是元宇宙的原住民。\n\
    \n第三章重点讲游戏。游戏是元宇宙的第一个雏形，其能够以可视化的形式体现元宇宙的特征，游戏对于画面清晰度、流畅度、真实度方面的不断的追求，一直是通信、3D技术、算力发展的原动力。更重要的是，通过借鉴游戏的发展，其他各行各业都可以找到通往元宇宙之路。当然不同的行业难易程度不同，进阶必有先后，但是思维却须同步。\n\
    \n第四章探讨元宇宙经济学。本章指出元宇宙经济学是数字经济中最活跃、最具前瞻性的有机组成部分；提出了元宇宙经济不同于传统经济的一些显著特征，同时向传统经济学奉为金科玉律的观点提出了挑战。\n\
    \n第五章讨论元宇宙治理问题。我们很难在元宇宙中建立类似“政府”的机构。自治似乎是唯一的解决方案。面临“邪恶共识”的情况、面临大面积发生的“灾难”事件，目前似乎并无统一解决的良策。治理之路仍然在探索之中。技术进步很快，治理模式则在物理世界的摩擦中艰难前行。\n\
    \n第六章以“超大陆”之名，探讨元宇宙的基础设施。本章从物理层、软件层、数据层、规则层、应用层展开论述，并且提出了产业“超大陆”的领先实践——EOP（生态运营平台）的概念。\n\
    \n第七章讨论技术对产业和社会的影响。数字技术正在系统性地和人类大脑、躯干更紧密地融合。后人类社会和硅基生命在数字技术浪潮中，正一步一步变成现实。人类则借助VR/AR等终端设备，在不同的元宇宙之间自由穿越。\n\
    \n本书成书只有短短一个多月的时间，仓促之中，错漏实多，还望各位读者不吝指正。元宇宙讲究的是“进化”。本书作为与元宇宙的第一次“遇见”，希望在进化过程中逐步完善。\n\
    \n![](Images/image00174.jpeg)\n\n2021年7月20日\n\n* * *\n\n注释：\n\n[\\[1\\]](#part0007.xhtml#commentRef_2483)\
    \ 采样过程所应遵循的规律，又称取样定理、抽样定理。采样定理说明采样频率与信号频谱之间的关系，是连续信号离散化的基本依据。在进行模拟/数字信号的转换过程中，当采样频率`f[s.max]`大于信号中最高频率`f[max]`的2倍时（`f[s.max]＞2f[max]`），采样之后的数字信号完整地保留了原始信号中的信息，一般实际应用中保证采样频率为信号最高频率的2.56—4倍。\n\
    \n# 01 元宇宙即将到来\n\n大家来到“绿洲”是因为可以做各种事，但是他们沉沦于此是为了不一样的人生。\n\n——电影《头号玩家》\n\n元宇宙是人们娱乐、生活乃至工作的虚拟时空。Roblox这款游戏，展示了元宇宙的诸多特征。核心是数字创造、数字资产、数字交易、数字货币和数字消费，尤其是在用户体验方面，达到了真假难辨、虚实混同的境界。\n\
    \n元宇宙具备从虚拟物品生产到消费的宏观产业链条的闭环，从而形成以虚拟商品为主要交易对象的独立经济体系。元宇宙经济学呼之欲出，成为数字经济中最活跃、最具革命性的部分。\n\
    \n共创、共享、共治是元宇宙的基本价值观。在元宇宙中生活、工作正在成为M世代亚文化中的一部分，进而形成社会思潮，从而重塑元宇宙社会，并影响现实社会。在传统文化和元宇宙文化相互渗透融合中，人类文明或将被重新塑造。\n\
    \n大约再过15年，互联网就可能会发生一次重大的变革。正如从PC为主要上网终端过渡到手机，现在也将由手机过渡到VR/AR设备，开始互联网下一个15年的演变周期，人类将迎来互联网大变局的前夜。\n\
    \n“末影龙”“苦力怕”这些稀奇古怪的名字是什么？如果你不知道，虚心地向小孩子们请教，他们会兴高采烈地告诉你。我就是在吃早饭的时候，问刚刚上小学一年级的儿子：什么是“苦力怕”？他回答我说：“那是一种怪物，靠近你就会爆炸！”还边说边比画。\n\
    \n“末影龙”“苦力怕”都是游戏《我的世界》（Minecraft）[^(\\[1\\])](#part0008.xhtml#comment_2826)中的角色（见图1-1）。它们在其中生存，在你不小心的时候，忽然发起攻击。这款游戏中，所有的物体、生物都是由一个个小方块构成的，甚至连太阳都是方形的。比起画面精良的大作，这里面的每个物体都显得很粗糙。但是玩家沉溺其中乐此不疲，他们可以用这些小方块“创造”出各种各样的东西。有人在《我的世界》中建造了城市，有人甚至根据电路知识，从搭建与非门开始，制造出完整的计算机。更重要的是，玩家们可以被组织起来开展活动，譬如召开毕业典礼。\n\
    \n![](Images/image00182.jpeg)\n\n图1-1 游戏《我的世界》中的画面\n\n（图片来源：网易游戏《我的世界》官网）\n\n\
    2021年6月16日，中国传媒大学动画与数字艺术学院的毕业生们在《我的世界》这个游戏中根据校园风景的实拍搭建了建筑，还原了校园内外的场景，上演了一出别开生面的“云毕业”（见图1-2）。除了还原了校园的基本风貌，花草树木和校猫也亮相其中。在“典礼”的进行过程中，校长还提醒同学们“不要在红毯飞来飞去”。这场“毕业典礼”在哔哩哔哩直播的时候，还有网友感慨地说像“霍格沃兹的毕业典礼”。\n\
    \n![](Images/image00191.jpeg)\n\n图1-2 中国传媒大学“云毕业”场景\n\n（图片来源：哔哩哔哩视频《中国传媒大学创意“云毕业”打造游戏世界中的毕业典礼》截图）\n\
    \n中国传媒大学的“云毕业典礼”其实并非首例，美国加州大学伯克利分校的100多名在校生和校友也在游戏《我的世界》里复制了整个校园，在六周内再现了100多栋校园建筑物，包括大家熟悉的小商店，甚至一些条幅（见图1-3）。\n\
    \n![](Images/image00154.jpeg)\n\n图1-3 加州大学伯克利分校第11任校长Carol Crist在致辞\n\n（图片来源：加州大学伯克利分校官网）\n\
    \n《堡垒之夜》（Fortnite）与美国饶舌歌手Travis Scott展开跨界合作，在游戏中举办“ASTRONOMICAL”虚拟演唱会，场次横跨美国和欧洲、亚洲、大洋洲等服务器（见图1-4）。根据Epic\
    \ Games的官方统计，目前已表演的场次吸引了超过1200万名玩家同时在线参与，创下惊人的纪录。下图中的动漫人物就是Travis Scott在《堡垒之夜》中的形象。\n\
    \n![](Images/image00162.jpeg)\n\n图1-4  Travis Scott在《堡垒之夜》中的形象\n\n（图片来源：腾讯游戏《堡垒之夜》官网）\n\
    \n达美乐比萨，算是在虚拟世界中最知名的比萨了。因为它开发了一款应用，在应用中，人们可以戴上AR眼镜，在虚拟现实中买比萨。\n\n史蒂文·斯皮尔伯格执导的电影《头号玩家》，把故事的背景设定在了2045年，世界处于混乱和崩溃边缘，令人失望。人们将救赎的希望寄托于“绿洲”，一个由鬼才詹姆斯·哈利迪一手打造的虚拟游戏世界。人们只要戴上VR设备，就可以进入这个与现实形成强烈反差的虚拟世界（见图1-5）。在这个世界中，有繁华的都市，有形象各异、光彩照人的玩家，而不同次元的影视游戏中的经典角色也可以在这里齐聚。就算你在现实中是一个挣扎在社会边缘的失败者，在“绿洲”里依然可以成为超级英雄，再遥远的梦想都变得触手可及。哈利迪弥留之际，宣布将巨额财产和“绿洲”的所有权留给第一个闯过三道谜题、找出他在游戏中隐藏彩蛋的人，自此引发了一场全世界范围内的竞争。\n\
    \n![](Images/image00170.jpeg)\n\n图1-5 电影《头号玩家》宣传海报\n\n现实生活中无所寄托、沉迷游戏的少年韦德·沃兹，只是一个生活在贫民区的普通人——害羞、不合群、毫无存在感。但是在“绿洲”中，他化身帕西法尔，自信、勇敢、机智，成为人们心目中的超级英雄。凭着对虚拟游戏的深入剖析，他历经磨难，找到隐藏在关卡里的三把钥匙，完美通关，拥有了“绿洲”的所有权。\n\
    \n电影中展现的“绿洲”，已经被《我的世界》这一类型的游戏率先实现了，尽管画面像素感很强，尽管人们的虚拟形象很“方”，但是已经切切实实地展示了一个虚拟的世界。大家来到“绿洲”是因为可以做各种事情，他们沉浸于此，是为了体验不一样的人生。\n\
    \n著名的美国科幻小说家尼尔·斯蒂芬森（Neal Stephenson）在1992年撰写的《雪崩》（Snow Crash）一书中描述了一个平行于现实世界的网络世界——元宇宙（Metaverse）（见图1-6）。所有现实世界中的人在元宇宙中都有一个网络分身（Avatar）。斯蒂芬森笔下的元宇宙是实现虚拟现实后下一个阶段的互联网的新形态。\n\
    \n![](Images/image00178.jpeg)\n\n图1-6 科幻小说作家尼尔·斯蒂芬森早在1992年出版的《雪崩》中就提到了元宇宙的概念，图为《雪崩》封面\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0008.xhtml#commentRef_2788) 《我的世界》是一款3D第一人称沙盒游戏，玩家可以在三维空间中自由地创造和破坏不同种类的方块，用想象力建立并探索一个专属于玩家的世界。\n\
    \n## Roblox创世纪\n\n故事要从1989年的一个小砖块开始讲起。当时David Baszucki和Erik Cassel编写了一个叫作“交互式物理学”的2D模式物理实验室，为之后他们二人创建Roblox打下了深厚的基础。通过“交互式物理学”，来自全球各地的学生可以观察到两辆车是如何相撞的，也可以学习到如何搭建房屋。这些孩子的设计令人惊叹，激发了二人的雄心，如何让青少年的创造能力发挥更大的作用呢？于是，他们开始构建作为想象力平台的基础核心组件，于2004年正式成立了Roblox，致力于打造一个新一代的平台，为人们提供一个更加人性化、让大家可以自由表达的平台，突破想象的极限，尽情地抒发个性，通过游戏创作，分享人生体验。\n\
    \n### Roblox简要介绍\n\nRoblox成立17年后，于2021年3月10日在纽交所上市（见图1-7）。Roblox既提供游戏，又提供创作游戏的工具（创造者开发工具Roblox\
    \ Studio），同时它有很强的社交属性，玩家可以自行输出内容、实时参与，并且还有独立闭环的经济系统。作为一个兼具游戏、开发、教育属性的在线游戏创建者系统，Roblox中大部分内容是由业余游戏创建者创建的。如果我们有什么有意思的游戏构思，但无法获得商业资助，就可以通过Roblox\
    \ Studio，自主创作游戏，然后邀请其他玩家来参与。随着其他人的参与，游戏规则在玩的过程中逐渐形成与完善，也会随着小组成员约定的玩法而慢慢改变。\n"
  trans: "\n\n三位年轻人聚在一起，写了一本通俗读本，把刚刚火起来的新词“元宇宙”条分缕析，形成一门学问。对传统学者而言，以一个月的高谈阔论成书过于草率鲁莽。不过，对于站在数字世界边缘的新生代们，这已经是姗姗来迟了。我熟悉这三位年轻人，他们都是驰骋在移动互联网、大数据和区块链三个领域的资深玩家，是充满激情的布道者。“弄潮儿向涛头立，手把红旗旗不湿”。\n\
    \n翻阅全书，多有饶舌烧脑处，跌跌撞撞，却又藕断丝连，具有逻辑张力。从游戏引爆“元宇宙”开始，展开了一个以网络、数字和人工智能为基础的虚拟世界。从比特币到\
    \ NFT，将混沌初开的幻象彼岸过滤成万千独一无二的可交易产品和场景。在书中，传统的价值体系被无情抛弃，习惯的经济学、社会学和政治学规则逐一失灵。归根结底一句话，新生代的共识才能创造“元宇宙”的价值。\n\
    \n庞杂的架构、突兀的词语、松散的逻辑、急促的分析，这本书看上去似乎不那么成熟，作者没有提供任何解决方案，但给了读者无限的解读空间和自由的想象空间。有趣的是，三位作者仍然站在传统的大陆上向未来的新世界努力投射智慧光芒，各种假设、各种预期、各种指标，甚至各种“基础设施”建议。不过，“元宇宙”已经使人类切断了基因脐带的全新结构，在无限的“0”与“1”的组合中衍生自己的命运了。\n\
    \n过去 100 年里，人类基本解决了衣食住行这些现实世界的种种困扰。\n\n过去 30 年里，人类创造了可以承载精神寄托的网络平台和数据工具。\n\n现实世界中我们无法企及的幻想和难以排解的焦虑，可以在平行的精神“元宇宙”中解放了，何其快哉也！\n\
    \n我们在“元宇宙”里肆意放纵的意志和天马行空的臆想终于得到释放，而且，还可以下凡到现实世界里小试锋芒，更是痛快淋漓！\n\n人类归根结底是精神生物，几千年的产业文明积累让我们享受物质化生存，而几十年的互联网和数字革命则让我们回归精神社会。\n\
    \n“元宇宙”——才是人类初心。\n\n7 月 15 日，在北京瑞吉酒店的盖亚星球大会讲演上，我对约 300 名被称为 Z 世代人类的年轻大学生讲道，“元宇宙”不是一个，而是无数个。每个人都有自己的“元宇宙”，每个人还可以有许多个同时叠加的“元宇宙”。你们这一代远比我们这些还在现实世界中挣扎的传统一代更加快乐和有创造力。\n\
    \n“元宇宙”不同于哲学家的冥想空间，这是一个数据化、网络化、智能化的大千世界，我们可以设计、编辑、运行、体验和把握的超现实世界，而且可以关联、干预、创造和操控我们生存的现实世界。\n\
    \n理解了“元宇宙”，我们才能更好地理解和享受我们的现实世界。\n\n推荐大家读一读这套书，一起开启未来的智识历程。\n\n王巍  \n金融博物馆理事长 \
    \ \n2021 年 7 月 19 日\n\n# 前言\n## 当经济学“遇见”元宇宙\n\n理论的突破，很难从大而全的概括中产生。世界纷繁复杂、万物普遍联系。因此，研究理论、总结规律需要几个条件：其一，合理的取舍，从万物普遍联系中，分离出那些最具代表性、先进性，变化程度最高的典型案例。其二，研究这些案例，找到原子级别不可再分的构成要素；研究这些要素的特征和要素间的关系，甚至定义出原子级别的操作。其三，回归到整体，整体的问题还需要整体求解，看看得出的结论是否经得起时间和其他要素的检验。\n\
    \n元宇宙经济就是数字经济的最佳范例，从元宇宙入手，就可以得出和传统经济学，包括秉承新自由主义经济学和新制度经济学的所有经济学家，完全不同的结论。虽然我们还不能说完全推翻了这些传统经济学的种种教条，但是一个完整的、先进的经济学体系正在建立。元宇宙经济学的先进性，恰恰在于元宇宙实践的特殊性。\n\
    \n元宇宙是一个完整、自洽的经济体系，是纯粹的数字产品生产、消费的全链条。从商品的属性来看，元宇宙经济学和传统经济学相同，遵循相似的供需规律，但是从商品生产、消费的全链条来看，又完全不同。元宇宙中的商品，完全是在元宇宙中制造和消费的，层层剖析到最后，无非是“0”“1”的排列组合。从某种意义上来看，元宇宙的商品是脱离物理世界的单独存在，尽管它们之间可以发生千丝万缕的联系。\n\
    \n依据元宇宙的特性，我们可以把经济划分为两种类型：以实物商品为主要研究对象的传统经济和以数字商品为主要研究对象的元宇宙经济。数字经济是以数字要素作为关键生产资料的经济活动。传统经济升级的方向是数字经济，数字经济中最活跃、最彻底、变化最剧烈的部分，恰恰是元宇宙经济。因此，元宇宙经济中蕴含的经济规律就具备了普适性。长期以来，传统经济学的研究已经进入误区，走进了封闭、保守的圈子。传统经济学家对信息科技引起的变化不敏感，在社会变化最剧烈的领域几乎整体性失声，相反，未来学家大行其道。传统的西方经济学已经失去了解释世界变化的能力，更谈不上预测未来。经济学亟须在继承中创新，在创新中升华，形成新的经济理论体系。元宇宙经济的特殊性体现在数字商品的创造和消费中，数字商品不消耗任何的物理世界的“物质”，也不存在物理世界的仓储、物流等问题，在某种意义上呈现“量子”的特性。本质上数字商品，或者更严格地说，数字物体都是“离散”的、不遵循任何物理规律的，所有在元宇宙呈现的“规律”都是代码规定的人工规律，可以模拟任何物理规律，譬如量子纠缠、瞬间移动等。在元宇宙中，时间和光速都是可以任意修改的参数。\n\
    \n元宇宙也是五脏俱全的社会，阿凡达们在不同的元宇宙中可能代表人们真身的某个侧面。善良的愈加善良，邪恶的愈加邪恶。物理世界的任何政府，无论秉持什么样的意识形态，总是要惩恶扬善的，总是要以保护生命为主并将其作为基础的社会价值。但是就像神话中创世之后有天堂和地狱之分，元宇宙中也有地狱一样的存在。这些问题，第五章将详细探讨。\n\
    \n元宇宙天然是“原子性”的，所有物品、关系、规则，最终都体现在二进制代码“0”“1”的排列组合中。我们无法在元宇宙中再细分这两个最小的组成单位。物理世界则不同，一路“细分”下来，发现原子，原子组成要素有质子、中子、电子，再细分发现质子、中子由“夸克”组成，再研究夸克，发现其不过是一份份离散的能量。科学家开始用“弦”来描述“夸克”，那用什么来描述“弦”呢？按照弦论的观点，宇宙不过是几种“弦”不同振动方式构成的一首华丽的乐曲而已。宇宙和元宇宙到底哪个才是更真实的存在呢？\n\
    \n还好，至少元宇宙的原子性和离散性是确切无疑的。基于原子性的要素，人们可以定义基础的原子性的操作，周全而无遗漏。布尔代数完全穷尽了“0”和“1”的所有操作。元宇宙同物理世界的关系，可以通过采样定理[^(\\\
    [1\\])](#part0007.xhtml#comment_2494)决定，物理世界可以在元宇宙中被精确还原，譬如在元宇宙中可以构建宏观物体的量子态。反之则未必成立。\n\
    \n比特币定义了金融场景的原子操作，就是点对点的货币支付。所有金融行为，最终都可以归结为点对点货币支付。由点对点金融支付，可以衍生出所有的金融业务。以太坊定义了数据变换的原子操作，就是点对点的数据变换，可以通过编程的方式实现任何点对点的数据变换，并且确保这种变换是不可逆的、不可被篡改的。这就实现了元宇宙社会中，关于“信任”“信用”的原子性操作。\n\
    \n利用区块链技术，可以让任意的被加密的“一段数据”成为数字资产，给无差别的“数据”打上了独一无二的“身份”标签。从而数据变成了资产，具备有偿流通的可能性，进一步衍生出经济行为，发展为充满活力的商业世界。\n\
    \n满足人们生理需求的物理世界和满足人们精神需求的虚拟世界，在人的需求层次上是一个整体。尽管在物理世界中，也可以满足部分的精神需求。这两个世界并不是物理意义上的“平行宇宙”，而是紧密的、相互联系的，人是其中重要的纽带。无论是在物理世界还是虚拟世界，人类都可以获得知识，虚拟世界知识的丰富性甚至远超物理世界（如训练飞行员的模拟舱）。因此不能把物理世界和虚拟世界割裂地看待。从人的方面来看它们依然是统一的，是人的不同需求的不同满足方式。\n\
    \n随着物质财富的增多、改造物理世界技术的进步，人们在物理世界中工作的时间越来越少，而沉浸在虚拟世界的时间越来越多。人们不可逆转地向虚拟世界迁移。有统计数据显示，人们在物理世界的工作时间，全天在\
    \ 4 小时左右。未来人们的思考和决策都是在虚拟世界中完成的，而执行是在物理世界中完成的。就像人们的思考依赖大脑，执行依赖四肢一样。\n\n基于此，我们现在研究元宇宙就有了现实的意义。我们不是在空谈一个类似乌托邦的概念，而是通过对元宇宙的探讨，加速改变整个世界，建立起日益丰富的数字世界，改造出更加美好的物理世界。\n\
    \n全书从六个方面来研究元宇宙，共分为七章。\n\n第一章概述元宇宙种种特性、技术基础。部分读者从第一章中就可以获得全书的观点概要。\n\n第二章分析元宇宙的居民，并给他们取了一个名字——M\
    \ 世代。M 即“Metaverse”的首字母。以“95 后”“00 后”为主体的 M 世代。他们的喜怒哀乐，决定了元宇宙的种种特性。他们才是元宇宙的原住民。\n\
    \n第三章重点讲游戏。游戏是元宇宙的第一个雏形，其能够以可视化的形式体现元宇宙的特征，游戏对于画面清晰度、流畅度、真实度方面的不断的追求，一直是通信、3D\
    \ 技术、算力发展的原动力。更重要的是，通过借鉴游戏的发展，其他各行各业都可以找到通往元宇宙之路。当然不同的行业难易程度不同，进阶必有先后，但是思维却须同步。\n\
    \n第四章探讨元宇宙经济学。本章指出元宇宙经济学是数字经济中最活跃、最具前瞻性的有机组成部分；提出了元宇宙经济不同于传统经济的一些显著特征，同时向传统经济学奉为金科玉律的观点提出了挑战。\n\
    \n第五章讨论元宇宙治理问题。我们很难在元宇宙中建立类似“政府”的机构。自治似乎是唯一的解决方案。面临“邪恶共识”的情况、面临大面积发生的“灾难”事件，目前似乎并无统一解决的良策。治理之路仍然在探索之中。技术进步很快，治理模式则在物理世界的摩擦中艰难前行。\n\
    \n第六章以“超大陆”之名，探讨元宇宙的基础设施。本章从物理层、软件层、数据层、规则层、应用层展开论述，并且提出了产业“超大陆”的领先实践——EOP（生态运营平台）的概念。\n\
    \n第七章讨论技术对产业和社会的影响。数字技术正在系统性地和人类大脑、躯干更紧密地融合。后人类社会和硅基生命在数字技术浪潮中，正一步一步变成现实。人类则借助\
    \ VR/AR 等终端设备，在不同的元宇宙之间自由穿越。\n\n本书成书只有短短一个多月的时间，仓促之中，错漏实多，还望各位读者不吝指正。元宇宙讲究的是“进化”。本书作为与元宇宙的第一次“遇见”，希望在进化过程中逐步完善。\n\
    \n![](img/image00174.jpeg)\n\n2021 年 7 月 20 日\n\n* * *\n\n注释：\n\n[\\[1\\]](#part0007.xhtml#commentRef_2483)\
    \ 采样过程所应遵循的规律，又称取样定理、抽样定理。采样定理说明采样频率与信号频谱之间的关系，是连续信号离散化的基本依据。在进行模拟/数字信号的转换过程中，当采样频率`f[s.max]`大于信号中最高频率`f[max]`的\
    \ 2 倍时（`f[s.max]＞2f[max]`），采样之后的数字信号完整地保留了原始信号中的信息，一般实际应用中保证采样频率为信号最高频率的 2.56—4\
    \ 倍。\n\n# 01 元宇宙即将到来\n\n大家来到“绿洲”是因为可以做各种事，但是他们沉沦于此是为了不一样的人生。\n\n——电影《头号玩家》\n\n\
    元宇宙是人们娱乐、生活乃至工作的虚拟时空。Roblox 这款游戏，展示了元宇宙的诸多特征。核心是数字创造、数字资产、数字交易、数字货币和数字消费，尤其是在用户体验方面，达到了真假难辨、虚实混同的境界。\n\
    \n元宇宙具备从虚拟物品生产到消费的宏观产业链条的闭环，从而形成以虚拟商品为主要交易对象的独立经济体系。元宇宙经济学呼之欲出，成为数字经济中最活跃、最具革命性的部分。\n\
    \n共创、共享、共治是元宇宙的基本价值观。在元宇宙中生活、工作正在成为 M 世代亚文化中的一部分，进而形成社会思潮，从而重塑元宇宙社会，并影响现实社会。在传统文化和元宇宙文化相互渗透融合中，人类文明或将被重新塑造。\n\
    \n大约再过 15 年，互联网就可能会发生一次重大的变革。正如从 PC 为主要上网终端过渡到手机，现在也将由手机过渡到 VR/AR 设备，开始互联网下一个\
    \ 15 年的演变周期，人类将迎来互联网大变局的前夜。\n\n“末影龙”“苦力怕”这些稀奇古怪的名字是什么？如果你不知道，虚心地向小孩子们请教，他们会兴高采烈地告诉你。我就是在吃早饭的时候，问刚刚上小学一年级的儿子：什么是“苦力怕”？他回答我说：“那是一种怪物，靠近你就会爆炸！”还边说边比画。\n\
    \n“末影龙”“苦力怕”都是游戏《我的世界》（Minecraft）[^(\\[1\\])](#part0008.xhtml#comment_2826)中的角色（见图\
    \ 1-1）。它们在其中生存，在你不小心的时候，忽然发起攻击。这款游戏中，所有的物体、生物都是由一个个小方块构成的，甚至连太阳都是方形的。比起画面精良的大作，这里面的每个物体都显得很粗糙。但是玩家沉溺其中乐此不疲，他们可以用这些小方块“创造”出各种各样的东西。有人在《我的世界》中建造了城市，有人甚至根据电路知识，从搭建与非门开始，制造出完整的计算机。更重要的是，玩家们可以被组织起来开展活动，譬如召开毕业典礼。\n\
    \n![](img/image00182.jpeg)\n\n图 1-1 游戏《我的世界》中的画面\n\n（图片来源：网易游戏《我的世界》官网）\n\n2021\
    \ 年 6 月 16 日，中国传媒大学动画与数字艺术学院的毕业生们在《我的世界》这个游戏中根据校园风景的实拍搭建了建筑，还原了校园内外的场景，上演了一出别开生面的“云毕业”（见图\
    \ 1-2）。除了还原了校园的基本风貌，花草树木和校猫也亮相其中。在“典礼”的进行过程中，校长还提醒同学们“不要在红毯飞来飞去”。这场“毕业典礼”在哔哩哔哩直播的时候，还有网友感慨地说像“霍格沃兹的毕业典礼”。\n\
    \n![](img/image00191.jpeg)\n\n图 1-2 中国传媒大学“云毕业”场景\n\n（图片来源：哔哩哔哩视频《中国传媒大学创意“云毕业”打造游戏世界中的毕业典礼》截图）\n\
    \n中国传媒大学的“云毕业典礼”其实并非首例，美国加州大学伯克利分校的 100 多名在校生和校友也在游戏《我的世界》里复制了整个校园，在六周内再现了 100\
    \ 多栋校园建筑物，包括大家熟悉的小商店，甚至一些条幅（见图 1-3）。\n\n![](img/image00154.jpeg)\n\n图 1-3 加州大学伯克利分校第\
    \ 11 任校长 Carol Crist 在致辞\n\n（图片来源：加州大学伯克利分校官网）\n\n《堡垒之夜》（Fortnite）与美国饶舌歌手 Travis\
    \ Scott 展开跨界合作，在游戏中举办“ASTRONOMICAL”虚拟演唱会，场次横跨美国和欧洲、亚洲、大洋洲等服务器（见图 1-4）。根据 Epic\
    \ Games 的官方统计，目前已表演的场次吸引了超过 1200 万名玩家同时在线参与，创下惊人的纪录。下图中的动漫人物就是 Travis Scott 在《堡垒之夜》中的形象。\n\
    \n![](img/image00162.jpeg)\n\n图 1-4  Travis Scott 在《堡垒之夜》中的形象\n\n（图片来源：腾讯游戏《堡垒之夜》官网）\n\
    \n达美乐比萨，算是在虚拟世界中最知名的比萨了。因为它开发了一款应用，在应用中，人们可以戴上 AR 眼镜，在虚拟现实中买比萨。\n\n史蒂文·斯皮尔伯格执导的电影《头号玩家》，把故事的背景设定在了\
    \ 2045 年，世界处于混乱和崩溃边缘，令人失望。人们将救赎的希望寄托于“绿洲”，一个由鬼才詹姆斯·哈利迪一手打造的虚拟游戏世界。人们只要戴上 VR 设备，就可以进入这个与现实形成强烈反差的虚拟世界（见图\
    \ 1-5）。在这个世界中，有繁华的都市，有形象各异、光彩照人的玩家，而不同次元的影视游戏中的经典角色也可以在这里齐聚。就算你在现实中是一个挣扎在社会边缘的失败者，在“绿洲”里依然可以成为超级英雄，再遥远的梦想都变得触手可及。哈利迪弥留之际，宣布将巨额财产和“绿洲”的所有权留给第一个闯过三道谜题、找出他在游戏中隐藏彩蛋的人，自此引发了一场全世界范围内的竞争。\n\
    \n![](img/image00170.jpeg)\n\n图 1-5 电影《头号玩家》宣传海报\n\n现实生活中无所寄托、沉迷游戏的少年韦德·沃兹，只是一个生活在贫民区的普通人——害羞、不合群、毫无存在感。但是在“绿洲”中，他化身帕西法尔，自信、勇敢、机智，成为人们心目中的超级英雄。凭着对虚拟游戏的深入剖析，他历经磨难，找到隐藏在关卡里的三把钥匙，完美通关，拥有了“绿洲”的所有权。\n\
    \n电影中展现的“绿洲”，已经被《我的世界》这一类型的游戏率先实现了，尽管画面像素感很强，尽管人们的虚拟形象很“方”，但是已经切切实实地展示了一个虚拟的世界。大家来到“绿洲”是因为可以做各种事情，他们沉浸于此，是为了体验不一样的人生。\n\
    \n著名的美国科幻小说家尼尔·斯蒂芬森（Neal Stephenson）在 1992 年撰写的《雪崩》（Snow Crash）一书中描述了一个平行于现实世界的网络世界——元宇宙（Metaverse）（见图\
    \ 1-6）。所有现实世界中的人在元宇宙中都有一个网络分身（Avatar）。斯蒂芬森笔下的元宇宙是实现虚拟现实后下一个阶段的互联网的新形态。\n\n![](img/image00178.jpeg)\n\
    \n图 1-6 科幻小说作家尼尔·斯蒂芬森早在 1992 年出版的《雪崩》中就提到了元宇宙的概念，图为《雪崩》封面\n\n* * *\n\n注释：\n\n\
    [\\[1\\]](#part0008.xhtml#commentRef_2788) 《我的世界》是一款 3D 第一人称沙盒游戏，玩家可以在三维空间中自由地创造和破坏不同种类的方块，用想象力建立并探索一个专属于玩家的世界。\n\
    \n## Roblox 创世纪\n\n故事要从 1989 年的一个小砖块开始讲起。当时 David Baszucki 和 Erik Cassel 编写了一个叫作“交互式物理学”的\
    \ 2D 模式物理实验室，为之后他们二人创建 Roblox 打下了深厚的基础。通过“交互式物理学”，来自全球各地的学生可以观察到两辆车是如何相撞的，也可以学习到如何搭建房屋。这些孩子的设计令人惊叹，激发了二人的雄心，如何让青少年的创造能力发挥更大的作用呢？于是，他们开始构建作为想象力平台的基础核心组件，于\
    \ 2004 年正式成立了 Roblox，致力于打造一个新一代的平台，为人们提供一个更加人性化、让大家可以自由表达的平台，突破想象的极限，尽情地抒发个性，通过游戏创作，分享人生体验。\n\
    \n### Roblox 简要介绍\n\nRoblox 成立 17 年后，于 2021 年 3 月 10 日在纽交所上市（见图 1-7）。Roblox 既提供游戏，又提供创作游戏的工具（创造者开发工具\
    \ Roblox Studio），同时它有很强的社交属性，玩家可以自行输出内容、实时参与，并且还有独立闭环的经济系统。作为一个兼具游戏、开发、教育属性的在线游戏创建者系统，Roblox\
    \ 中大部分内容是由业余游戏创建者创建的。如果我们有什么有意思的游戏构思，但无法获得商业资助，就可以通过 Roblox Studio，自主创作游戏，然后邀请其他玩家来参与。随着其他人的参与，游戏规则在玩的过程中逐渐形成与完善，也会随着小组成员约定的玩法而慢慢改变。\n\
    \n"
