    \n# 04  \n元宇宙经济学\n\n阿凡达没有自私的基因。\n\n传统经济学以实物商品为核心，元宇宙经济学以虚拟商品为核心，数字经济则包含实物商品的数字化过程。从这个意义上来讲，元宇宙经济学是数字经济的有机组成部分，是最活跃、最具代表性的部分。\n\
    \n认同决定价值而非劳动，边际效益递增而非递减，边际成本递减而非递增，交易成本趋于零而非居高不下，甚至都需要抛开经济人假设。\n\n元宇宙经济学四大要素：数字创造、数字资产、数字市场、数字货币；四个统一：计划和市场统一、生产和消费统一、监管和自由统一、行为和信用统一。\n\
    \n元宇宙为DC/EP提供了丰富的使用场景；DC/EP可以构成元宇宙经济行为的基础。\n\n电影《阿凡达》构筑了一个奇幻美丽的潘多拉星球，星球孕育了高大的纳威族。人类贪婪无度，觊觎潘多拉星球上的矿藏，期待它能在地球上卖个好价钱，拯救濒临破产的公司。纳威人与潘多拉星球融为一体，住的房子是天然的大树，床是一片片树叶。渴了，喝花草上凝结的露珠；饿了，吃猎获的动物。按照人类发展的历史阶段来看，纳威人正处于原始社会时期。巨大的潘多拉星球物产丰富，纳威人靠着打猎或者采摘，就能过上“小康”生活。\n\
    \nRDA——在潘多拉星球上“掠夺”矿产的公司，全名为“资源开发管理总署（Resources Development Administration）”。它是世界上最大的企业团体合股的财团（Consortium），也是人类在宇宙中最大的单一非政府组织，主要经营采矿、运输、药品、武器和通信业务。它拥有数以百万计的股东，是历史最悠久、规模最大的类行政实体。建立它的目的是在太阳系里寻找并开发新的资源。最近25年来，其开发范围又扩展到离地球较近的星系。RDA获得了潘多拉星球上珍贵矿产——“Unobtanium”的独家采矿权。在遥远的潘多拉星球上，采矿的进展直接影响RDA公司在地球上的股价。\n\
    \n人类一方是高度发达的星际资本主义社会，其代表是RDA公司。纳威族一方是自给自足的原始采集社会。两者之间形成了强烈的反差。\n\n影片中的主人公杰克可以借助一套复杂的类似太空舱的设备，在人类社会和潘多拉星球之间“穿梭”，当他在人类社会清醒的时候，他的“阿凡达化身”则在潘多拉星球原生态丛林中昏睡。当他在人类社会进入梦乡时，“阿凡达化身”则开始活跃，在潘多拉星球上“游荡”。\n\
    \n在阿凡达身上，我们看到很多“珍贵”的品质，让人们油然而生向往、爱护之心。当然，这也是导演的刻意为之。当杰克需要斑溪兽（Banshee，潘多拉星球上的一种大型飞鸟）时，他们不是去“市场”上找其他部落购买，而是自己去“抓”。\n\
    \n没有哪个词汇比“阿凡达”更能说明“化身”这个概念了，因此，本书把人类在元宇宙中的“化身”称为“阿凡达”。这也是美国科幻小说家尼尔·斯蒂芬森在《雪崩》中首创的概念。“纳威人”则是指潘多拉星球上的原始居民。\n\
    \n从经济发展的角度来看，潘多拉星球是落后的，没有市场存在，自然也没有货币，但潘多拉星球丰富的动物、植物资源，让纳威人没有饥馑之忧。这样看来，市场有什么用途呢？\n\
    \n从需求端来讲，纳威人对潘多拉星球的索取极少，他们只需要住大树、睡树叶、喝露水。从供应端来讲，潘多拉星球上的资源相较于纳威人的需求而言，几乎是无限的。在元宇宙中，资源同样是无限的，阿凡达的生理需求几乎全部可以得到满足。在这种情况下，社会的经济体系有哪些特征呢？\n\
    \n## 元宇宙经济是数字经济中最活跃、最具革命性的部分\n\n### 元宇宙经济学的定义\n\n经济学分类本身就是一门学问，其历史渊源、观点脉络、风云人物极多。总体而言，主流的经济学，都是研究以物质为原料的产品，是以其生产、流通、消费为核心内容的经济学。物质产品能满足人们吃饭、穿衣、居住、交通等生活需求。围绕人们的生活需求和物质产品而建立起来的市场、货币、产权、法律等一系列的制度安排和经济秩序，本书把它们称为传统经济学。\n\
    \n随着数字技术的发展，出现了越来越多的以数字为载体的产品，如游戏、短视频、电影等。在游戏中，人们也可以制造仅仅在游戏中需要的“道具”“皮肤”等产品。以数字为载体的产品，称为数字产品。一般而言，数字产品分为三大类：第一类数字产品是信息和娱乐产品，如纸上信息产品、产品信息、图像图形、音频产品和视频产品等。第二类数字产品是象征、符号和概念，如航班、音乐会、体育场的订票过程、支票、电子货币、信用卡等财务工具等。第三类数字产品是过程和服务，如政府服务、信件和传真、电子消费、远程教育和交互式服务、交互式娱乐等。\n\
    \n尽管同为数字产品，但其生产和消费的场景也不同，如电影、游戏和游戏中的“皮肤”。电影是在物理世界中创造，在物理世界中消费。游戏是在物理世界中创造，在数字世界中消费。[^(\\\
    [1\\])](#part0024.xhtml#comment_10267)而游戏中的“皮肤”则是在数字世界中创造，在数字世界中消费。\n\n本书把数字产品的创造、交换、消费等所有在数字世界中进行的经济活动称为元宇宙经济。研究元宇宙经济规律的学问，就是元宇宙经济学。在一些大型的游戏中，可以看到元宇宙经济的雏形。\n\
    \n在美国非常受欢迎的一款游戏《第二人生》（Second life）中，玩家可以创造各类虚拟商品进行出售。利用游戏提供的道具、材料创造内容，然后在游戏中完成销售，这就是典型的在数字世界中发生的经济行为，是元宇宙经济学研究的对象。\n\
    \n### 元宇宙经济与数字经济的异同\n\n数字经济是以数据为主要生产要素的经济活动，既包含传统物质产品生产、流通、消费的内容，也包括数字产品的创造、交换、消费的内容。换句话说，无论是物质产品还是非物质产品，只要在生产、流通、消费的任何一个环节，利用了数字技术或者利用了数据，都属于数字经济的范畴。\n\
    \n2016年G20杭州峰会发布的《二十国集团数字经济发展与合作倡议》对数字经济作出了定义：以使用数字化的知识和信息作为关键生产要素、以现代信息网络作为重要载体、以信息通信技术的有效使用作为效率提升和经济结构优化的重要推动力的一系列经济活动。\n\
    \nG20关于数字经济的定义被广泛接受。传统经济转型升级的目标，就是数字经济。\n\n就研究对象和使用范围而言，元宇宙经济是数字经济的一个子集，是其最活跃、最具革命性的部分。其中蕴含的一些思想和创造的一些工具，都对数字经济的发展具有重要的启示。\n\
    \n所以，当我们谈论元宇宙经济学，事实上摆脱了传统经济学的一些天然限制条件，譬如有限的自然资源、复杂的保障秩序的制度、市场建立的巨大成本等。在纯粹的数字世界，分析“阿凡达”的行为，设定简单的规则，从零开始构建经济体系。从元宇宙经济学研究中得到的一些结论、观点，可供传统经济借鉴，从而对于建立现代化的经济体系有所助益。\n\
    \n### 元宇宙对于物理世界的影响\n\n一件T恤衫是物质产品，是典型的传统经济的代表。《王者荣耀》中的“皮肤”是数字产品，其在游戏中被创造，也在游戏中被消费，如在T恤衫印上跟游戏关联的文字或图案（图4-1），那么这件T恤衫有了什么新的内涵呢？\n\
    \n这是数字产品影响传统经济的一个案例。元宇宙经济学，不是我们头脑一热编出的一个新概念。元宇宙中的人、产品通过影响人们的思想形成特定观念，继而真切地影响物理世界，甚至改变物理世界中人们的行为。因此元宇宙经济学也就有了更宏大的社会意义。\n\
    \n![](Images/image00157.jpeg)\n\n图4-1 游戏《王者荣耀》主题T恤  \n（图片来源：王者荣耀周边商城）\n\n元宇宙影响物理世界一般有如下两个途径。\n\
    \n首先，元宇宙影响人的思想和观念。人类学习的过程，就是让大脑习得知识并灵活运用的过程。这些知识是来自物理世界还是虚拟世界，并没有区别。而且在某些场景中，人们只能在“模拟机”中学习。譬如登上“天宫二号”的中国航天员们，之前他们无法在真实的“天宫二号”中训练。登月亦是如此，地球上没有和月球上完全相同的环境，登月的“嫦娥”只能在模拟月球环境的模拟器中训练。同样，人们在游戏中学习的经验和技巧、获得的知识和感悟，也可以应用于物理世界。人们在数字世界中的喜好，也可以投射到物理世界的产品上。游戏、展览、旅游、设计等行业，都会受到元宇宙的影响，从而形成新的经营模式。\n\
    \n其次，元宇宙促进数字产品的有形化。手办、玩具是特别典型的一类商品。这些商品原型都是电影、电视或游戏中的一些人物，特别受M世代的欢迎。2019年，上海第一家《火影忍者》主题餐厅开业，《火影忍者》的影迷和游戏玩家纷纷捧场，现场人山人海。\n\
    \n毫无疑问，元宇宙作为人们生活的一部分，和物理世界有着千丝万缕的联系。物理世界影响元宇宙，元宇宙影响物理世界。正因为它们互相影响，元宇宙经济学才有了现实意义。\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0024.xhtml#commentRef_10219) Roblox游戏略有不同，Roblox允许用户在其平台中创造新游戏。\n\
    \n## 重新思考传统经济学的假设和“规律”\n\n物理资源的限制，是传统经济学面临的最主要的约束条件。人类的生存必须要有一定的物理资源，譬如土地、淡水等。“经济”这个词有“节省”的意思。物以节用，经世济民。在物理世界中，我们吃的饭、穿的衣，都是直接或者间接来自土地的恩赐。在农业时代，土地就是最基本的生产要素。没有土地，人们就无法生存，但是土地总是有限的，人们要利用有限的资源，满足自己的各种欲望，的确难为了先人。人们一方面利用各式各样的技术，提高土地的产量，提高利用的效率，另一方面形成社会习俗，倡导俭朴的美德。\n\
    \n人类在历史上一直处于资源短缺的状态。放眼世界，关于饥荒、战争、难民的新闻依然充斥荧屏。马尔萨斯正是认识到资源有限，尤其是土地有限的现实，提出了人口理论。\n\
    \n元宇宙经济关注在数字世界中生产的数字产品，这些产品本身不消耗除了“电”以外的任何物理资源。数字产品无非是一串“0”和“1”的排列组合。当没有物理资源限制时，人们的行为是否还符合传统经济学语境中的“经济人”假设呢？\n\
    \n### 传统经济学基本假设不再成立\n\n亚当·斯密在《国富论》的第一篇第二章中提道：“我们获取的食物并非来自屠夫、酿酒师和面包师的恩惠，而是出于他们的利己思想。我们不用向他们祈求怜悯和爱意，只需唤起他们的利己心理就行了。我们不必向他们说我们的需求，只需强调他们能够获得的利益。”\n\
    \n这段话蕴含经济学的几个基本的前提：资源具有稀缺性，经济个体都是利己的，经济个体都是理性的。\n\n### 阿凡达重视体验而非理性\n\n经济个体都是理性的。理性人假设也可以理解为，每一个从事经济活动的人所采取的经济行为，都是力图以自己最小的经济代价去获得最大的经济利益。西方经济学家认为，在任何经济活动中，只有这样的人才是“合乎理性的人”；否则，就是非理性的。放到极端情况下思考，“理性”莫过于趋利避害的生存本能。就像火苗烧到手时，我们会立刻缩手一样。生存理性，是经济理性的基础，但这一条，在元宇宙中，同样被打破了。\n\
    \n元宇宙中，时间同样是无限的。人们在元宇宙中的化身“阿凡达”，生命同样是无限的。生存或者死亡，无非是一局游戏的开始或结束。阿凡达在高山之巅的奋力一跃，最坏的结果不过是退出游戏，重来一次。\n\
    \n近来，在欧美年轻人中颇为流行的YOLO文化——You OnlyLiveOnce，寓意是人应该享受人生，即使需要承担风险；也就是鼓励人们不怕冒险，想做什么就做什么，享受人生，因为人只能活一次，所以不要顾虑太多，思考太多。阿凡达却是生命永恒，可以体验不同的、多段的人生。\n\
    \n挣脱理性的束缚是许许多多人内心的真实诉求。“老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈”，这是放纵田猎的快乐。“大鹏一日同风起，扶摇直上九万里”，这是摆脱俗务、逍遥九天的快乐。\n\
    \n在元宇宙中，你可以利用无限的资源、无尽的时间去创造和体验，最坏的情况不过就是从头再来。“心若在梦就在，天地之间还有真爱，看成败人生豪迈，只不过是从头再来”，就是元宇宙的真实写照。\n\
    \n### 阿凡达没有利己的基因\n\n阿凡达摆脱了生老病死的生理问题，是人们在精神世界的化身。M世代从来没有过粮食、物资“匮乏”的经历。在一些团队完成的任务中，游戏中每一个角色都需要尽心尽力，相互补位、相互救援、团结一心去战胜对手。\n\
    \n精神层次的需求，来自对胜利的渴望，来自队友的合作，来自快乐的分享。阿凡达天然是要追求马斯洛需求模型中的最顶端的需求，也就是自我实现甚至超越自我的需求。而自我实现的精神愉悦就来自创造和分享，来自超越束缚、抛掉理性。每一个阿凡达都代表了人们某一层面的精神需求。他们来到元宇宙并且沉浸于此，只是为了体验不一样的人生。\n"
  trans: "\n\n数字孪生最大的认知突破，就在于物理世界中的实体与数字世界中的孪生体相互映射、相互影响。简单来说，数字孪生体是一起工作的。物理世界中的实体的主要功能是采集数据，并传输给数字世界中的孪生体。数字孪生体汇集数据，做出关联分析，给出具体的动作指令。物理世界中的实体，接收指令，并执行相应的动作。在这个过程中，实体进一步采集数据，并将数据传输给孪生体。简单来说，数字世界中的孪生体的主要功能是分析和决策，而物理世界中的实体的主要功能是接收指令并执行。用文学一点的语言来说，数字孪生体是物理实体的“灵魂”。\n\
    \n数字孪生概念产业和应用的基础，就是数字技术的发展，让人们可以把物理世界中各个领域，越来越精确地数字化。部分领域的精确程度，甚至达到了电影《黑客帝国》描述的那样。\n\
    \n## 数字孪生组织是企业数字化转型的最终目标\n\n在数字化变革的过程中，人类终极的理想目标，就是在数字世界中，建立起和物理世界中的组织（可以是一个企业、行业，甚至一个城市）相对应的一组软件模型。并且，人类需要给这个模型输入组织的运营数据、组织服务的各类对象的数据。这可以实现组织的运营模型在数字世界中的映射，并能够实时更新状态，应对外界的变化，部署相应的资源，产生预期的客户价值。这组反映组织运作的软件模型和源源不断的各类数据构成的整体，就是数字孪生组织。\n\
    \n数字孪生组织建成之日，就是数字化转型成功之时。\n\n对于企业而言，他们需要将企业相关的各类角色和角色之间相互作用的过程全部数字化。这些角色分为五个类别，分别是客户、员工、合作伙伴、供应商和消费者。数字化后，企业可以形成其数字资产，综合利用各种数字技术，完成数据采集、挖掘和分析，形成业务决策，从而为客户创造价值。\n\
    \n从客户角度而言，人们应该获得全新的体验。任何一项服务的提供，必须满足五个标准：第一，Realtime（实时）。自动驾驶的服务，甚至要求响应的实时性达到毫秒的级别。第二，On-demand（按需）。这是个性化的基础。数字时代区别于工业时代的典型特征，不再是千人一面的工业品，而是千人千面的定制品。第三，All-online（全在线）。所有的交互都在线上完成。第四，DIY（服务自助）。用户自助服务，企业提供用户做任何想做的事的机会，甚至提供用户参与各种业务开发优化过程的机会，这可以帮助自身加速业务创新，也可以提升用户的参与感。第五，Social（社交化）。企业可以为用户群体提供分享经验、使用心得、吐槽的社交平台，从而形成固定粉丝群体，给用户归属感，增加用户黏度。\n\
    \n## 游戏是可视化的数字孪生组织\n\n这里的“游戏”是指具备元宇宙特征的游戏，不是类似 Windows 平台上附赠的“扫雷”型游戏。\n\n当提出 DTO\
    \ 概念的时候，苦于它过于抽象，我难以对其一言尽述，因为人们很难理解从未见过的东西。当然，在现实世界中，没有一家公司，完全符合 DTO 的特征。提出数字孪生组织，是为了解释传统企业。那么，数字化转型的最终目标是什么？或者说理想化的数字化企业最终形态是什么？这是解决传统企业数字化转型应该向哪里去的根本问题。\n\
    \n元宇宙给出了答案。元宇宙就是企业数字化转型的最终形态。相比 DTO，元宇宙有一个具象化、可视化的雏形，这个雏形，就是类似《我的世界》、Roblox 这样的游戏。\n\
    \n在 DTO 中总结的“Roads”特征——Realtime（实时）、Ondemand（按需）、All-online（全在线）、DIY（服务自助）、Social（社交化），在元宇宙中完全体现了出来。\n\
    \n## 借助元宇宙推进数字化转型\n\n游戏作为元宇宙的雏形，不但已经进入了元宇宙，在其过程中，还带动了通信技术、云计算、3D 建模、VR 设备、数字货币等技术的发展。当这些技术进一步得到应用并且使用成本进一步降低的时候，各行各业都会以此作为借鉴，依次进入元宇宙。\n\
    \n以 IP 为核心的数字消费是万亿级别的新兴产业，包括网络文学、视频制作（短视频、长视频）、3D 动画等。展览业和大型的展馆也将面临升级的挑战。现在需要在物理的场馆中，营造出超越现实的效果，把物理展馆迁徙的元宇宙和元宇宙的技术应用到物理展馆。博物馆同展览业有相似之处。设计行业，包括工业设计、建筑设计等所有依赖人类想象力的工作，都会迁徙到元宇宙中，与客户共同设计。在文化旅游方面，譬如建立黄果树瀑布的元宇宙，就比在黄果树大兴土木方便得多。关键是在环保的大背景下，我们不能做任何改变风景区物理环境的事情。在消费品领域，在元宇宙中出现某个品牌的消费品仅仅是开端，更重要的是形成消费的宇宙。而谈到工业制造，也许工人们都戴着\
    \ AR 眼镜上班的日子，很快就会到来。\n\n根据《国民经济行业分类》（GB/T 4754—2011）的产业划分标准，来预测元宇宙内产业的发展，其发展阶段主要分五个阶段：起始阶段、探索阶段、基础设施大发展阶段、内容大爆发阶段和虚实共生阶段（见图\
    \ 3-6）。在元宇宙内对每个阶段的产业发展做了一个预测，到第五阶段时，元宇宙将进入繁荣期，现实社会 90%以上的产业都会在元宇宙内发生，现实社会没有的产业，也会在元宇宙内欣欣向荣。到那时，虚拟空间与现实社会保持高度同步和互通，交互效果接近真实。同步和拟真的虚拟世界是元宇宙构成的基础条件，这意味着现实社会中发生的一切事件将同步发生于虚拟世界，同时用户在虚拟的元宇宙中进行交互时能得到接近真实的反馈信息，达到虚实共生！\n\
    \n![](img/image00186.jpeg)\n\n图 3-6　元宇宙内的产业发展阶段预测图（图片来源：中译出版社《元宇宙通证》）\n\n### 催生万亿产业集群\n\
    \n除元宇宙带动行业数字化转型外，元宇宙本身也将演化出新的产业集群。严格来说，这些都属于内容消费产业集群，满足人类无限的精神需求。这些产业集群的规模很可能超越现实世界，甚至是现实世界的数倍之大（见图\
    \ 3-7）。\n\n![](img/image00149.jpeg)\n\n图 3-7　元宇宙催生万亿产业集群（资料来源：中译出版社《元宇宙通证》）\n\n\
