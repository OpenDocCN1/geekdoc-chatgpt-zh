    # 元宇宙 推荐语


    ## 曾良 — 天使投资人、互联网创业家

    一个由游戏与虚拟空间组成的庞大新世界正在崛起，这就是“元宇宙”。元宇宙具有巨大的潜力，也承载着伟大的变革使命。这套书对于驱动元宇宙发展的技术基础，元宇宙平台的运作要素，为了建立起健康而充满活力的生态系统所需要构建的元宇宙经济体系，都进行了深入浅出的探讨。致敬创作本书的几位年轻布道者，引领大家一起去探索未来世界。


