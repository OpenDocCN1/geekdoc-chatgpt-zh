- raw: '在智能合约中，算法取代了银行的位置。利用智能合约，“一手交钱、一手交货”的商业流程变成：第一，开发智能合约，锁定买方的部分资金，确保有足够的资金用于支付货款；第二，卖方发货；第三，智能合约自动确认收货信息，收货一旦确认自动执行智能合约中约定的转账协议，自动向卖方账户转入提前锁定的资金。智能合约取代了银行和共管资金账户的功能。


    智能合约之所以成立，就是因为基础的交易环节都在区块链上完成，每个交易环节都被精确记录并且不能修改。


    ### 区块链，去中心化的账本


    记账是区块链的核心，确保账本不被任何人修改，是通过其一系列的技术和算法做到的。


    在上文中，我们用消费者、旅游App和保险公司三方参与的一个消费场景，说明了中心节点旅游App具有信息垄断的权利。旅游App到底垄断了什么？其实就是消费者的投保记录。消费者购买保险的“记录”，只有旅游App一家掌握。换句话说，只有旅游App记了账，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”。当旅游公司隐藏了这个账本，保险公司也就无从查证了，想去找旅游公司收钱都没有任何依据。


    但是区块链则不同，其实现了分布式账本的机制。如果在区块链上，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”这个信息，是区块链上所有节点都会同时记录的信息，而且是对所有节点开放的。旅游App是区块链上的一个节点，保险公司也是区块链上的节点，消费者购买延误险的同时，旅游App和保险公司都记了账，双方的账一模一样，且谁都不能单方面修改。这样，信息就在节点之间完全透明，节点都是平等的，没有任何一个节点可以藏匿信息。基于这个公开的账本，保险公司可以理直气壮地找旅游App结算，旅游App应该付保险公司多少钱，就得付多少钱。


    这就打破了中心节点垄断信息的霸权。


    ## 两种治理方式的比较


    中心化组织+监管机构是物理世界中最典型的治理模式，古今中外，概莫能外。数字世界中，区块链技术实现了去中心化组织+智能合约自治的模式。


    银行业有银监会监督，证券业有证监会监督，互联网平台现在被市场监管总局监督。这种治理模式至少在物理世界还是行之有效的。中心化组织利用数据霸权为所欲为的时候，不得不顾忌头上的达摩克利斯之剑。


    在区块链构成的去中心化世界中，正在构建新的治理模式。去中心的治理模式，到底去了什么中心？我们先从物理世界中电影产业的治理说起。


    ### 电影产业的治理


    电影这个行业，是在物理世界生产、在物理世界消费、在数字世界体验的特殊行业。其资产类型是典型的高价值数字资产。


    早期的电影采用胶片摄影机拍摄，电影就是一卷卷的胶片。现在几乎没有人再利用胶片技术来拍电影。偶尔有一两部，宣传的重点往往在于胶片电影特有的质感。取而代之的是数字技术，电影从存储在胶片上，变成存储在硬盘中，成了一个个数字文件。无论是胶片还是数字文件，对电影产业而言，盗版都是大敌。


    电影的制作方要防范盗版，大都采取加密数字文件的方式。只要不知道密钥，就算盗取了数字文件也无法播放。另一种方式是使用昂贵的电影播放设备。例如3D类型的电影，需要专用设备播放。控制专用设备也是保护电影文件的可选方法。


    电影产业有制作方（拍摄电影）、发行方（销售电影）、院线（播放电影的影院，为了简化讨论，其他播放渠道如网上点播等忽略不计）。这三方收益如何分配？在产业发展的不同阶段，三方之间的分配比例略有不同。中国发行方比较强势，就会占据较大的份额。海外更重视原创剧集，制作方就可能占更大的份额。具体比例是行业博弈的结果。


    但是有两个最重要的问题：不管三方份额如何，票房总收入谁说了算？院线和票务公司收到的资金，该如何归集？只有知道准确的总票房，电影产业的各个环节才知道分配的总盘子，知道自己按照比例可以分多少。票房收入的资金必须专款专用，及时地分配给各个参与方，才能皆大欢喜。


    我国专门成立了一个部门来解决这两个问题——国家电影事业发展专项资金管理委员会办公室（以下简称“专资办”），它是中宣部直属的事业单位，负责国家电影专项资金的征收、使用与管理；负责全国电影票务相关信息系统的建设、管理等工作；负责监督、协调省级电影专项资金管理委员会办公室相关工作；根据授权，利用信息技术手段实施电影票房市场监督管理，开展电影产业相关业务服务等。


    其中一项重要的工作，就是管理全国电影票务综合信息管理平台。按照专资办的规定，所有发售电影票的公司，必须在10分钟内上传电影票销售数据。这就及时地完成了全国总票房记录的任务。同时，根据电影票销售数据，监管票务公司的资金。


    既然专资办解决了电影产业的两大核心问题，它也会在每张电影票中分“一杯羹”。目前专资办提取5%的票面金额，作为服务费用。


    专资办给电影产业记了“账”，还监督不同环节的票房分配。这是专资办对于电影产业的基础性作用。可以说，如果没有专资办，就没有电影产业。


    专资办有一个重要的功能，在疫情防控期间表现得尤为突出。疫情防控期间，电影院门可罗雀。几乎长达一年时间，这个产业没有任何收入，一些制作方、院线陷入濒临破产的境地。这时，专资办历年累积的小金库发挥了作用。这相当于电影产业的“大家长”拿出点“私房钱”，救助苦苦挣扎的产业。不得不说，专资办的资金，还是支持电影产业渡过了寒冬。


    ### 区块链的治理模式


    用区块链技术实现电影产业的治理方式，与“专资办”模式有所不同。


    首先，区块链利用分布式账本技术，取代了“全国电影票务综合信息管理平台”。制作方、发行方、院线都是电影区块链上的节点。票务销售数据的“账目”全部上链保存。任何一方都不能修改票务销售数据的账目。这是用技术手段，取代了行政命令，但是能达到一样的效果。“账目”权威性，足以用来作为各方分配的依据。


    监管的手段，采用智能合约。专资办规定的各种细则，统统用代码的形式实现。如果触发（违反规则），则自动执行（处罚）。


    电影产业治理模式和区块链治理模式，毫无疑问都在各自的领域发挥着举足轻重的作用。


    相比之下，电影产业治理模式成本高昂，治理成本占电影产业的5%。2020年我国电影总票房204亿元，治理成本就高达10亿元。这种治理方式无法在一些小众的行业应用。我们也没有办法在去中心化的世界中成立一个中心化的组织，来完成治理工作。


    因此，区块链的治理模式是数字世界行之有效的模式。


    专资办可以在疫情防控期间救助电影产业，这是专资办治理模式的领先之处。在去中心化的模式中，谁能来扛起拯救行业整体性衰退的重担呢？答案是“没有人”。也许自治社区还没有遇到类似的问题，也许会在后续的发展中产生类似的机制。迈阿密公寓悖论，在区块链世界中依然无解。


    ### 延伸阅读：以太坊是如何进行治理工作的


    区块链的世界中，代码就是规则。修改代码意味着修改规则。有一套相应的流程，确保代码修改符合整体的利益。这里用以太坊为例，说明代码修改的治理过程。


    网络的各个方面理论上都可以改变。与我们在现实世界中所遵守的社会契约不同的是，在去中心化网络中，如果参与者对网络的最新变化不满意，他们每一个人都可以选择“愤怒退出”（rage
    quit），从而离开这个网络，继续使用他们自己的备用网络。然而，在现实世界中，这种选择是不存在的，因为我们无法单枪匹马地退出系统或改变它的规则。我们不能决定不纳税或做违法的事情。这些规则是由体制决定的，几乎不可能改变。


    谁来决定软件中的内容？


    实现软件更改的过程与现实世界中通过新法律的过程非常相似。在现实世界中存在着各种利益相关者。对以太坊来说，其主要的利益相关者是：


    用户：持有$ETH并使用以太坊应用程序的终端用户、加密货币交易所、在以太坊之上构建应用程序的开发人员。


    矿工：运行服务器场以验证交易并保护网络（从而获得以太币）的个人或企业实体。


    以太坊核心开发人员：为节点软件做出贡献并参加各种技术论坛的开发人员和研究人员。


    以太坊核心开发人员就像政客一样，通过衡量社交媒体、会议或文章上的情绪来聆听最终用户的需求。当许多用户要求某种功能或更改协议时，他们将考虑这些建议。


    EIP被提交后，它将经历一个技术审查、研究和讨论的周期：


    Draft——正确格式化后，EIP编辑器会将EIP合并到EIP存储库中。


    Review——EIP作者将EIP标记为已准备就绪并请求对等审查。


    Last Call——经过初始迭代的EIP，准备好接受广泛受众的审查。


    Accepted——一个核心的EIP已经在Last Call中出现了至少两周，并且开发人员已经处理了任何要求的技术更改。


    Final——核心开发人员已决定将其实施到各种客户端（Geth，Nethermind etc.）中并在未来的硬分叉（hard fork）中发布的EIP，或者已经在硬分叉中发布的EIP。


    以太坊治理就像其他治理系统一样，有其缺点和优点。治理去中心化的网络绝非易事，像Polkadot这样的其他区块链正在尝试“链上”治理，其中所有重要决策均由直接在Polkadot区块链上投票的用户做出。


    以太坊的治理是一种软治理，其中许多协调都在“链下”进行，并且在功能合并到客户端之前评估对提案的支持。但是，最终网络的参与者都会在链上做出接受或拒绝新软件的决定。


    以太坊的治理机制，是社区自治的典型，为整个以太坊提供算力的矿工、持有以太币的用户、开发者社区都有发言权。到目前为止，以太坊的治理工作非常出色，它拥有迄今为止所有最活跃的区块链开发人员和研究人员社区，并且在各方面都进行了创新。未来几年最大的挑战也许将是掌握从工作量证明到权益证明（也称“以太坊2.0”）的迁移——这将为更快、更便宜的交易和去中心化应用程序的新发展铺平道路。


    ## 游戏，并非逃离现实的桃花源


    元宇宙中的阿凡达不过是人们的化身，人们多重的人格，很可能在不同的元宇宙演绎不同性格的阿凡达。人性中善的一面可以被激发，恶的一面同样也可以被放大。有些问题，不是代码可以解决的。


    文中列举的例子，都是在游戏中真实发生的事件，有些事件甚至产生了难以挽回的伤害。


    ### 另类的欺凌


    《摩尔庄园》是由淘米网络科技有限公司开发的网页游戏，于2008年4月28日发布。这款游戏一上线，就以其可爱的卡通形象，轻快的音乐，以及游戏中构造出的美好、梦幻的世界而被广大消费者接受（见图5-1）。


    因为里面的内容偏低龄化，以健康、快乐、创造、分享为主题，这款游戏深受孩子们的喜欢和追捧。


    在2009年，《摩尔庄园》获得百度风云榜最佳网络游戏奖，成为获得该奖项的第一个儿童类游戏。


    ![](Images/image00166.jpeg)


    图5-1 游戏《摩尔庄园》宣传画（图片来源：雷霆游戏《摩尔庄园》官网）


    著名游戏网站多玩平台这样评论这款游戏：毫无疑问，《摩尔庄园》绝对是一款精心之作。游戏倡导“健康、快乐、创造、分享”的主题，游戏的画面与背景音乐也是研发商匠心独运的佳作，深深吻合着主题。污言秽语、谩骂谴责、暴力血腥、色情犯罪，在这个游戏中一点都找不到。人们所担忧的沉迷，在《摩尔庄园》里也被有效地防止。这里不仅是孩子们的，也是成年玩家们心灵的最后一片净土。作为一款以面向青少年儿童为主的网页游戏，游戏画面以儿童动漫卡通风格为主，给人一种和谐快乐、积极健康的感觉。


    2009年，武汉市小学《信息技术》教材将《摩尔庄园》收入了“网游课”中。


    可以说，《摩尔庄园》在某些意义上是符合桃花源、乌托邦的特性的，是个充斥着真善美的乐园，也是人们心中纯净的元宇宙的模样。


    但是，围绕着《摩尔庄园》的犯罪现象，是游戏开发者及消费者们所始料不及的。


    2021年，《摩尔庄园》新版本上线后，一位成年玩家“星无火”在微博上进行了自我揭露，他大肆炫耀着自己在网页游戏《摩尔庄园》中通过盗号、洗号、欺骗等方式，凌虐幼童的心灵，从而获取满足感的经历。


    他采用的方式非常简单，利用小朋友们单纯好骗的心理，通过接近他们，套取他们的游戏账号。当取得账号后，他会登录其账号将小朋友在游戏中的资产，例如漂亮的小房子、衣服、游戏币等彻底地毁掉。当小朋友询问甚至央求的时候，“星无火”则用辱骂的方式对待他们。


    此外，“星无火”还利用游戏漏洞，让小朋友免费为他打工。小朋友辛苦地进入他的庄园做完任务后，他会说一句“哦，滚吧”，并以此为乐。


    “星无火”无法从他的这些行为中获取任何实际上的经济利益，也无法取得现实成就。他只是利用这些小朋友单纯善良的内心来满足自己施虐的变态欲望，并且将自己所做出的这些事情发布到互联网上进行炫耀。


    在现实生活中，用语言暴力或者行为暴力虐童，需要隐蔽的地点与合适的目标。大多数儿童在现实生活中都被父母、监护人、老师保护得很好，并不会给这类人机会，但是在虚拟世界中，他们可以利用虚拟的伪装，肆无忌惮地伤害这些儿童。


    “星无火事件”并不是个案，像他这样在虚拟世界中以伤害别人为乐的人还有很多。他们潜伏在数字信号之下，利用结构漏洞带来的便利，满足自己的变态欲望，给那些幼小的心灵带来伤害，破坏游戏设计者原本的桃花源构想。


    ### 性犯罪的温床


    人性恶的成本在元宇宙中被无限降低。这和人们所说的“在网络上，你甚至不知道对面是人是狗”其实是一个道理。


    在元宇宙的世界中，你不知道对面是什么人，不知道对方的目的。你也不知道自己在对方眼里是什么样的角色。


    尤其是在创世者的放纵和不作为中，本身可能拥有美好梦幻设定的纯净世界，会被污染成新的犯罪温床。


    在淘米网络开发的网页游戏《小花仙》中（见图5-2），这种恶就被体现得淋漓尽致。


    ![](Images/image00175.jpeg)


    图5-2 游戏《小花仙》宣传图（图片来源：淘米游戏《小花仙》官网）


    这款偏低龄化的游戏，以微观世界为故事舞台，描写了不同身份的花仙交织出的奇幻冒险。玩家扮演的小花仙可以进行换装，精美华丽的服装、可爱漂亮的人物形象，都让这款游戏成为小女孩们的最爱。这款游戏的玩家小则六七岁，大则十四五岁，正处于天真烂漫的年龄。


    就是这么一款纯洁的游戏，却被那些别有用心的人所玷污，成为恋童癖的犯罪场所。在游戏里，花3—5张“米米卡”，也就是30—50元，可以购买到漂亮的衣服，于是有人打着送“米米卡”、发红包的旗号，在世界频道、留言板留下联系方式，然后通过利诱，向小女孩索要裸照，色情视频，甚至要求线下见面进行性侵。甚至还有人在游戏中明目张胆地要包养女孩。


    这些小女孩多缺乏性保护意识，很容易被引诱。她们被威胁，不敢告诉家长，甚至被多次威胁伤害。


    2017年，该事件登上微博热搜，引起了大众的注意和反感。淘米网络紧急下架了留言板和传音花等功能，而此时距离游戏运营已有7年，这7年中有多少受害者不得而知。


    这样的游戏会给多少人带来一生的痛苦伤痕，这些伤痕多久后才会得到弥补，不得而知。


    ### 数字资产的损毁


    《星战前夜》（英文名：EVE Online）是由冰岛CCP所开发的大型多人线上游戏（见图5-3）。游戏为玩家提供了壮阔而充满想象力的科幻太空场景，玩家可以驾驶自行改造的船舰在数千个行星系中穿梭、遨游。行星系中包含行星、卫星、太空站、小行星带等各种各样的物体。通过星门，各个行星系得以连接。


    ![](Images/image00183.jpeg)


    图5-3 游戏《星战前夜》宣传图（图片来源：网易游戏《星战前夜》官网）


    这款游戏以其庞大的科幻背景、复杂的硬核玩法而闻名，吸引了大量的国内外玩家。


    这款游戏可以说是科幻世界中的元宇宙，摒弃了传统的以计算机人工智能为基准建立的游戏设计理念，而把人与人之间的互动提升到了前所未有的高度。设计者以全新的角度设计了游戏架构，不再设计各种新奇的迷局来挑战游戏者，而是将力量集中在建立虚拟世界的运行规则上，同时不断给游戏者提供必要的工具，让他们能够掌握自己的命运。


    在这个游戏中，人与人之间的交互成为最重要的点。虽然前期非常难，但是上手后，玩家便能够体会到游戏的乐趣。这是一款需要投入大量时间和精力以及金钱的游戏，本意是想要让玩家在绝对的自由中体验科幻的世界，进入未来的元宇宙中。在游戏中，玩家可以自发组织成军团，军团的成员可以互相扶持、互相保护，拥有共同财产。


    2005年发生了一件被记入游戏史的大劫杀事件。在这个虚拟的科幻宇宙中，卧底、敌对双方上演了一场精彩的无间道，雇佣兵、雇主、卧底、目标，这些本应该只存在于现实中的角色在游戏中纷纷登场。


    故事的主人公是Ubiqua Seraph军团的CEO Mirial，她和往常一样，在最信赖的副手陪伴下进行着游戏，结果却遭遇了另一个军团GHSC的伏击。为了能够赢得这场伏击，GHSC花费了一年多的时间，在Ubiqua
    Seraph军团中安插埋伏了大量间谍，以获取Mirial的信任，并且筹划了这场大劫杀。


    最终，这场劫杀劫掠的Ubiqua Seraph军团财产折合约16500美元，也让Mirial自己的账号蒙受了巨大的损失。根据游戏规则，这是合法的，并没有人因此而受到惩罚。


    与此同时，在这个游戏中，互相进行劫杀已经成为司空见惯的事情。很多新手玩家高高兴兴地建设好自己的飞船后，被别的军团打得四分五裂，成为废铁。


    虽然这是发生在元宇宙的事情，但是造成的经济损失在现实生活中是真实存在的。


    当人性的恶与平台的无作为结合在一起的时候，普通原住民的安危和财产安全又该如何得到保证呢？


    ### 教唆犯罪


    臭名昭著的《蓝鲸》就是这样一款网络游戏。


    这款俄罗斯游戏的玩法，就像是游戏界面上的套索和血红色的字所展示的那样残酷，它被多个国家所禁止，因为它迫害的是玩家的生命。


    《蓝鲸》可以在多个社交媒体上进行。玩家会被配置给一名“主人”，这个“主人”每天会给玩家布置一个任务。这些任务包括使用小刀或剃刀在手臂上划出鲸的图案、全天观看恐怖电影，甚至凌晨4点就起床。当游戏进行到第50天，“主人”就会命令玩家自杀。


    很多青少年参与“蓝鲸”游戏后想退出，但遭受了管理员的威胁。他们担心管理员会通过IP地址锁定自己和家人，因此被迫带着恐惧继续玩下去。


    英国《每日镜报》称，没有证据显示有人在现实中因未将游戏继续下去而遭报复，但来自管理员的威胁仍使很多孩子硬着头皮走上了绝路。


    俄罗斯《新报》称，俄罗斯公共互联网技术中心追踪到，仅在一天之内，就有4000多名用户在Vkontakte上使用与“蓝鲸”游戏相关的标签建群，如“深海鲸群”“静谧的房间”以及“4点20叫醒我”，等等。每个群背后隐藏的玩家数量是难以估计的。


    这款游戏在国内也被禁止，但是类似的游戏还有很多，它们隐藏在不被发现的暗处，危害着缺乏判断能力的青少年及儿童。


    ## 治理模式，依然在求索的路上


    在元宇宙中，人们行为规则的社会化属性，比去中心化的应用中的社会化属性更为明显。目前以区块链为基础的去中心化应用，大多集中在金融、交易等领域。也有人在开发利用区块链技术的游戏，但是在画面、可玩性方面，尚无法和Roblox、《堡垒之夜》等大作媲美。


    不同元宇宙，不同的阿凡达，不同的人性体现。这些多样的人生，是在相同的游戏规则中演化的人生百态。创始者也并非完全是上帝的模样。游戏《蓝鲸》的开发者，或许就是撒旦在元宇宙中的代表。'
  fmt: '

    在智能合约中，算法取代了银行的位置。利用智能合约，“一手交钱、一手交货”的商业流程变成：第一，开发智能合约，锁定买方的部分资金，确保有足够的资金用于支付货款；第二，卖方发货；第三，智能合约自动确认收货信息，收货一旦确认自动执行智能合约中约定的转账协议，自动向卖方账户转入提前锁定的资金。智能合约取代了银行和共管资金账户的功能。


    智能合约之所以成立，就是因为基础的交易环节都在区块链上完成，每个交易环节都被精确记录并且不能修改。


    ## 区块链，去中心化的账本


    记账是区块链的核心，确保账本不被任何人修改，是通过其一系列的技术和算法做到的。


    在上文中，我们用消费者、旅游App和保险公司三方参与的一个消费场景，说明了中心节点旅游App具有信息垄断的权利。旅游App到底垄断了什么？其实就是消费者的投保记录。消费者购买保险的“记录”，只有旅游App一家掌握。换句话说，只有旅游App记了账，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”。当旅游公司隐藏了这个账本，保险公司也就无从查证了，想去找旅游公司收钱都没有任何依据。


    但是区块链则不同，其实现了分布式账本的机制。如果在区块链上，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”这个信息，是区块链上所有节点都会同时记录的信息，而且是对所有节点开放的。旅游App是区块链上的一个节点，保险公司也是区块链上的节点，消费者购买延误险的同时，旅游App和保险公司都记了账，双方的账一模一样，且谁都不能单方面修改。这样，信息就在节点之间完全透明，节点都是平等的，没有任何一个节点可以藏匿信息。基于这个公开的账本，保险公司可以理直气壮地找旅游App结算，旅游App应该付保险公司多少钱，就得付多少钱。


    这就打破了中心节点垄断信息的霸权。


    ## 两种治理方式的比较


    中心化组织+监管机构是物理世界中最典型的治理模式，古今中外，概莫能外。数字世界中，区块链技术实现了去中心化组织+智能合约自治的模式。


    银行业有银监会监督，证券业有证监会监督，互联网平台现在被市场监管总局监督。这种治理模式至少在物理世界还是行之有效的。中心化组织利用数据霸权为所欲为的时候，不得不顾忌头上的达摩克利斯之剑。


    在区块链构成的去中心化世界中，正在构建新的治理模式。去中心的治理模式，到底去了什么中心？我们先从物理世界中电影产业的治理说起。


    ### 电影产业的治理


    电影这个行业，是在物理世界生产、在物理世界消费、在数字世界体验的特殊行业。其资产类型是典型的高价值数字资产。


    早期的电影采用胶片摄影机拍摄，电影就是一卷卷的胶片。现在几乎没有人再利用胶片技术来拍电影。偶尔有一两部，宣传的重点往往在于胶片电影特有的质感。取而代之的是数字技术，电影从存储在胶片上，变成存储在硬盘中，成了一个个数字文件。无论是胶片还是数字文件，对电影产业而言，盗版都是大敌。


    电影的制作方要防范盗版，大都采取加密数字文件的方式。只要不知道密钥，就算盗取了数字文件也无法播放。另一种方式是使用昂贵的电影播放设备。例如3D类型的电影，需要专用设备播放。控制专用设备也是保护电影文件的可选方法。


    电影产业有制作方（拍摄电影）、发行方（销售电影）、院线（播放电影的影院，为了简化讨论，其他播放渠道如网上点播等忽略不计）。这三方收益如何分配？在产业发展的不同阶段，三方之间的分配比例略有不同。中国发行方比较强势，就会占据较大的份额。海外更重视原创剧集，制作方就可能占更大的份额。具体比例是行业博弈的结果。


    但是有两个最重要的问题：不管三方份额如何，票房总收入谁说了算？院线和票务公司收到的资金，该如何归集？只有知道准确的总票房，电影产业的各个环节才知道分配的总盘子，知道自己按照比例可以分多少。票房收入的资金必须专款专用，及时地分配给各个参与方，才能皆大欢喜。


    我国专门成立了一个部门来解决这两个问题——国家电影事业发展专项资金管理委员会办公室（以下简称“专资办”），它是中宣部直属的事业单位，负责国家电影专项资金的征收、使用与管理；负责全国电影票务相关信息系统的建设、管理等工作；负责监督、协调省级电影专项资金管理委员会办公室相关工作；根据授权，利用信息技术手段实施电影票房市场监督管理，开展电影产业相关业务服务等。


    其中一项重要的工作，就是管理全国电影票务综合信息管理平台。按照专资办的规定，所有发售电影票的公司，必须在10分钟内上传电影票销售数据。这就及时地完成了全国总票房记录的任务。同时，根据电影票销售数据，监管票务公司的资金。


    既然专资办解决了电影产业的两大核心问题，它也会在每张电影票中分“一杯羹”。目前专资办提取5%的票面金额，作为服务费用。


    专资办给电影产业记了“账”，还监督不同环节的票房分配。这是专资办对于电影产业的基础性作用。可以说，如果没有专资办，就没有电影产业。


    专资办有一个重要的功能，在疫情防控期间表现得尤为突出。疫情防控期间，电影院门可罗雀。几乎长达一年时间，这个产业没有任何收入，一些制作方、院线陷入濒临破产的境地。这时，专资办历年累积的小金库发挥了作用。这相当于电影产业的“大家长”拿出点“私房钱”，救助苦苦挣扎的产业。不得不说，专资办的资金，还是支持电影产业渡过了寒冬。


    ### 区块链的治理模式


    用区块链技术实现电影产业的治理方式，与“专资办”模式有所不同。


    首先，区块链利用分布式账本技术，取代了“全国电影票务综合信息管理平台”。制作方、发行方、院线都是电影区块链上的节点。票务销售数据的“账目”全部上链保存。任何一方都不能修改票务销售数据的账目。这是用技术手段，取代了行政命令，但是能达到一样的效果。“账目”权威性，足以用来作为各方分配的依据。


    监管的手段，采用智能合约。专资办规定的各种细则，统统用代码的形式实现。如果触发（违反规则），则自动执行（处罚）。


    电影产业治理模式和区块链治理模式，毫无疑问都在各自的领域发挥着举足轻重的作用。


    相比之下，电影产业治理模式成本高昂，治理成本占电影产业的5%。2020年我国电影总票房204亿元，治理成本就高达10亿元。这种治理方式无法在一些小众的行业应用。我们也没有办法在去中心化的世界中成立一个中心化的组织，来完成治理工作。


    因此，区块链的治理模式是数字世界行之有效的模式。


    专资办可以在疫情防控期间救助电影产业，这是专资办治理模式的领先之处。在去中心化的模式中，谁能来扛起拯救行业整体性衰退的重担呢？答案是“没有人”。也许自治社区还没有遇到类似的问题，也许会在后续的发展中产生类似的机制。迈阿密公寓悖论，在区块链世界中依然无解。


    ### 延伸阅读：以太坊是如何进行治理工作的


    区块链的世界中，代码就是规则。修改代码意味着修改规则。有一套相应的流程，确保代码修改符合整体的利益。这里用以太坊为例，说明代码修改的治理过程。


    网络的各个方面理论上都可以改变。与我们在现实世界中所遵守的社会契约不同的是，在去中心化网络中，如果参与者对网络的最新变化不满意，他们每一个人都可以选择“愤怒退出”（rage
    quit），从而离开这个网络，继续使用他们自己的备用网络。然而，在现实世界中，这种选择是不存在的，因为我们无法单枪匹马地退出系统或改变它的规则。我们不能决定不纳税或做违法的事情。这些规则是由体制决定的，几乎不可能改变。


    谁来决定软件中的内容？


    实现软件更改的过程与现实世界中通过新法律的过程非常相似。在现实世界中存在着各种利益相关者。对以太坊来说，其主要的利益相关者是：


    用户：持有$ETH并使用以太坊应用程序的终端用户、加密货币交易所、在以太坊之上构建应用程序的开发人员。


    矿工：运行服务器场以验证交易并保护网络（从而获得以太币）的个人或企业实体。


    以太坊核心开发人员：为节点软件做出贡献并参加各种技术论坛的开发人员和研究人员。


    以太坊核心开发人员就像政客一样，通过衡量社交媒体、会议或文章上的情绪来聆听最终用户的需求。当许多用户要求某种功能或更改协议时，他们将考虑这些建议。


    EIP被提交后，它将经历一个技术审查、研究和讨论的周期：


    Draft——正确格式化后，EIP编辑器会将EIP合并到EIP存储库中。


    Review——EIP作者将EIP标记为已准备就绪并请求对等审查。


    Last Call——经过初始迭代的EIP，准备好接受广泛受众的审查。


    Accepted——一个核心的EIP已经在Last Call中出现了至少两周，并且开发人员已经处理了任何要求的技术更改。


    Final——核心开发人员已决定将其实施到各种客户端（Geth，Nethermind etc.）中并在未来的硬分叉（hard fork）中发布的EIP，或者已经在硬分叉中发布的EIP。


    以太坊治理就像其他治理系统一样，有其缺点和优点。治理去中心化的网络绝非易事，像Polkadot这样的其他区块链正在尝试“链上”治理，其中所有重要决策均由直接在Polkadot区块链上投票的用户做出。


    以太坊的治理是一种软治理，其中许多协调都在“链下”进行，并且在功能合并到客户端之前评估对提案的支持。但是，最终网络的参与者都会在链上做出接受或拒绝新软件的决定。


    以太坊的治理机制，是社区自治的典型，为整个以太坊提供算力的矿工、持有以太币的用户、开发者社区都有发言权。到目前为止，以太坊的治理工作非常出色，它拥有迄今为止所有最活跃的区块链开发人员和研究人员社区，并且在各方面都进行了创新。未来几年最大的挑战也许将是掌握从工作量证明到权益证明（也称“以太坊2.0”）的迁移——这将为更快、更便宜的交易和去中心化应用程序的新发展铺平道路。


    ## 游戏，并非逃离现实的桃花源


    元宇宙中的阿凡达不过是人们的化身，人们多重的人格，很可能在不同的元宇宙演绎不同性格的阿凡达。人性中善的一面可以被激发，恶的一面同样也可以被放大。有些问题，不是代码可以解决的。


    文中列举的例子，都是在游戏中真实发生的事件，有些事件甚至产生了难以挽回的伤害。


    ### 另类的欺凌


    《摩尔庄园》是由淘米网络科技有限公司开发的网页游戏，于2008年4月28日发布。这款游戏一上线，就以其可爱的卡通形象，轻快的音乐，以及游戏中构造出的美好、梦幻的世界而被广大消费者接受（见图5-1）。


    因为里面的内容偏低龄化，以健康、快乐、创造、分享为主题，这款游戏深受孩子们的喜欢和追捧。


    在2009年，《摩尔庄园》获得百度风云榜最佳网络游戏奖，成为获得该奖项的第一个儿童类游戏。


    ![](Images/image00166.jpeg)


    图5-1 游戏《摩尔庄园》宣传画（图片来源：雷霆游戏《摩尔庄园》官网）


    著名游戏网站多玩平台这样评论这款游戏：毫无疑问，《摩尔庄园》绝对是一款精心之作。游戏倡导“健康、快乐、创造、分享”的主题，游戏的画面与背景音乐也是研发商匠心独运的佳作，深深吻合着主题。污言秽语、谩骂谴责、暴力血腥、色情犯罪，在这个游戏中一点都找不到。人们所担忧的沉迷，在《摩尔庄园》里也被有效地防止。这里不仅是孩子们的，也是成年玩家们心灵的最后一片净土。作为一款以面向青少年儿童为主的网页游戏，游戏画面以儿童动漫卡通风格为主，给人一种和谐快乐、积极健康的感觉。


    2009年，武汉市小学《信息技术》教材将《摩尔庄园》收入了“网游课”中。


    可以说，《摩尔庄园》在某些意义上是符合桃花源、乌托邦的特性的，是个充斥着真善美的乐园，也是人们心中纯净的元宇宙的模样。


    但是，围绕着《摩尔庄园》的犯罪现象，是游戏开发者及消费者们所始料不及的。


    2021年，《摩尔庄园》新版本上线后，一位成年玩家“星无火”在微博上进行了自我揭露，他大肆炫耀着自己在网页游戏《摩尔庄园》中通过盗号、洗号、欺骗等方式，凌虐幼童的心灵，从而获取满足感的经历。


    他采用的方式非常简单，利用小朋友们单纯好骗的心理，通过接近他们，套取他们的游戏账号。当取得账号后，他会登录其账号将小朋友在游戏中的资产，例如漂亮的小房子、衣服、游戏币等彻底地毁掉。当小朋友询问甚至央求的时候，“星无火”则用辱骂的方式对待他们。


    此外，“星无火”还利用游戏漏洞，让小朋友免费为他打工。小朋友辛苦地进入他的庄园做完任务后，他会说一句“哦，滚吧”，并以此为乐。


    “星无火”无法从他的这些行为中获取任何实际上的经济利益，也无法取得现实成就。他只是利用这些小朋友单纯善良的内心来满足自己施虐的变态欲望，并且将自己所做出的这些事情发布到互联网上进行炫耀。


    在现实生活中，用语言暴力或者行为暴力虐童，需要隐蔽的地点与合适的目标。大多数儿童在现实生活中都被父母、监护人、老师保护得很好，并不会给这类人机会，但是在虚拟世界中，他们可以利用虚拟的伪装，肆无忌惮地伤害这些儿童。


    “星无火事件”并不是个案，像他这样在虚拟世界中以伤害别人为乐的人还有很多。他们潜伏在数字信号之下，利用结构漏洞带来的便利，满足自己的变态欲望，给那些幼小的心灵带来伤害，破坏游戏设计者原本的桃花源构想。


    ### 性犯罪的温床


    人性恶的成本在元宇宙中被无限降低。这和人们所说的“在网络上，你甚至不知道对面是人是狗”其实是一个道理。


    在元宇宙的世界中，你不知道对面是什么人，不知道对方的目的。你也不知道自己在对方眼里是什么样的角色。


    尤其是在创世者的放纵和不作为中，本身可能拥有美好梦幻设定的纯净世界，会被污染成新的犯罪温床。


    在淘米网络开发的网页游戏《小花仙》中（见图5-2），这种恶就被体现得淋漓尽致。


    ![](Images/image00175.jpeg)


    图5-2 游戏《小花仙》宣传图（图片来源：淘米游戏《小花仙》官网）


    这款偏低龄化的游戏，以微观世界为故事舞台，描写了不同身份的花仙交织出的奇幻冒险。玩家扮演的小花仙可以进行换装，精美华丽的服装、可爱漂亮的人物形象，都让这款游戏成为小女孩们的最爱。这款游戏的玩家小则六七岁，大则十四五岁，正处于天真烂漫的年龄。


    就是这么一款纯洁的游戏，却被那些别有用心的人所玷污，成为恋童癖的犯罪场所。在游戏里，花3—5张“米米卡”，也就是30—50元，可以购买到漂亮的衣服，于是有人打着送“米米卡”、发红包的旗号，在世界频道、留言板留下联系方式，然后通过利诱，向小女孩索要裸照，色情视频，甚至要求线下见面进行性侵。甚至还有人在游戏中明目张胆地要包养女孩。


    这些小女孩多缺乏性保护意识，很容易被引诱。她们被威胁，不敢告诉家长，甚至被多次威胁伤害。


    2017年，该事件登上微博热搜，引起了大众的注意和反感。淘米网络紧急下架了留言板和传音花等功能，而此时距离游戏运营已有7年，这7年中有多少受害者不得而知。


    这样的游戏会给多少人带来一生的痛苦伤痕，这些伤痕多久后才会得到弥补，不得而知。


    ### 数字资产的损毁


    《星战前夜》（英文名：EVE Online）是由冰岛CCP所开发的大型多人线上游戏（见图5-3）。游戏为玩家提供了壮阔而充满想象力的科幻太空场景，玩家可以驾驶自行改造的船舰在数千个行星系中穿梭、遨游。行星系中包含行星、卫星、太空站、小行星带等各种各样的物体。通过星门，各个行星系得以连接。


    ![](Images/image00183.jpeg)


    图5-3 游戏《星战前夜》宣传图（图片来源：网易游戏《星战前夜》官网）


    这款游戏以其庞大的科幻背景、复杂的硬核玩法而闻名，吸引了大量的国内外玩家。


    这款游戏可以说是科幻世界中的元宇宙，摒弃了传统的以计算机人工智能为基准建立的游戏设计理念，而把人与人之间的互动提升到了前所未有的高度。设计者以全新的角度设计了游戏架构，不再设计各种新奇的迷局来挑战游戏者，而是将力量集中在建立虚拟世界的运行规则上，同时不断给游戏者提供必要的工具，让他们能够掌握自己的命运。


    在这个游戏中，人与人之间的交互成为最重要的点。虽然前期非常难，但是上手后，玩家便能够体会到游戏的乐趣。这是一款需要投入大量时间和精力以及金钱的游戏，本意是想要让玩家在绝对的自由中体验科幻的世界，进入未来的元宇宙中。在游戏中，玩家可以自发组织成军团，军团的成员可以互相扶持、互相保护，拥有共同财产。


    2005年发生了一件被记入游戏史的大劫杀事件。在这个虚拟的科幻宇宙中，卧底、敌对双方上演了一场精彩的无间道，雇佣兵、雇主、卧底、目标，这些本应该只存在于现实中的角色在游戏中纷纷登场。


    故事的主人公是Ubiqua Seraph军团的CEO Mirial，她和往常一样，在最信赖的副手陪伴下进行着游戏，结果却遭遇了另一个军团GHSC的伏击。为了能够赢得这场伏击，GHSC花费了一年多的时间，在Ubiqua
    Seraph军团中安插埋伏了大量间谍，以获取Mirial的信任，并且筹划了这场大劫杀。


    最终，这场劫杀劫掠的Ubiqua Seraph军团财产折合约16500美元，也让Mirial自己的账号蒙受了巨大的损失。根据游戏规则，这是合法的，并没有人因此而受到惩罚。


    与此同时，在这个游戏中，互相进行劫杀已经成为司空见惯的事情。很多新手玩家高高兴兴地建设好自己的飞船后，被别的军团打得四分五裂，成为废铁。


    虽然这是发生在元宇宙的事情，但是造成的经济损失在现实生活中是真实存在的。


    当人性的恶与平台的无作为结合在一起的时候，普通原住民的安危和财产安全又该如何得到保证呢？


    ### 教唆犯罪


    臭名昭著的《蓝鲸》就是这样一款网络游戏。


    这款俄罗斯游戏的玩法，就像是游戏界面上的套索和血红色的字所展示的那样残酷，它被多个国家所禁止，因为它迫害的是玩家的生命。


    《蓝鲸》可以在多个社交媒体上进行。玩家会被配置给一名“主人”，这个“主人”每天会给玩家布置一个任务。这些任务包括使用小刀或剃刀在手臂上划出鲸的图案、全天观看恐怖电影，甚至凌晨4点就起床。当游戏进行到第50天，“主人”就会命令玩家自杀。


    很多青少年参与“蓝鲸”游戏后想退出，但遭受了管理员的威胁。他们担心管理员会通过IP地址锁定自己和家人，因此被迫带着恐惧继续玩下去。


    英国《每日镜报》称，没有证据显示有人在现实中因未将游戏继续下去而遭报复，但来自管理员的威胁仍使很多孩子硬着头皮走上了绝路。


    俄罗斯《新报》称，俄罗斯公共互联网技术中心追踪到，仅在一天之内，就有4000多名用户在Vkontakte上使用与“蓝鲸”游戏相关的标签建群，如“深海鲸群”“静谧的房间”以及“4点20叫醒我”，等等。每个群背后隐藏的玩家数量是难以估计的。


    这款游戏在国内也被禁止，但是类似的游戏还有很多，它们隐藏在不被发现的暗处，危害着缺乏判断能力的青少年及儿童。


    ## 治理模式，依然在求索的路上


    在元宇宙中，人们行为规则的社会化属性，比去中心化的应用中的社会化属性更为明显。目前以区块链为基础的去中心化应用，大多集中在金融、交易等领域。也有人在开发利用区块链技术的游戏，但是在画面、可玩性方面，尚无法和Roblox、《堡垒之夜》等大作媲美。


    不同元宇宙，不同的阿凡达，不同的人性体现。这些多样的人生，是在相同的游戏规则中演化的人生百态。创始者也并非完全是上帝的模样。游戏《蓝鲸》的开发者，或许就是撒旦在元宇宙中的代表。

    '
  trans: '

    在智能合约中，算法取代了银行的位置。利用智能合约，“一手交钱、一手交货”的商业流程变成：第一，开发智能合约，锁定买方的部分资金，确保有足够的资金用于支付货款；第二，卖方发货；第三，智能合约自动确认收货信息，收货一旦确认自动执行智能合约中约定的转账协议，自动向卖方账户转入提前锁定的资金。智能合约取代了银行和共管资金账户的功能。


    智能合约之所以成立，就是因为基础的交易环节都在区块链上完成，每个交易环节都被精确记录并且不能修改。


    ## 区块链，去中心化的账本


    记账是区块链的核心，确保账本不被任何人修改，是通过其一系列的技术和算法做到的。


    在上文中，我们用消费者、旅游 App 和保险公司三方参与的一个消费场景，说明了中心节点旅游 App 具有信息垄断的权利。旅游 App 到底垄断了什么？其实就是消费者的投保记录。消费者购买保险的“记录”，只有旅游
    App 一家掌握。换句话说，只有旅游 App 记了账，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”。当旅游公司隐藏了这个账本，保险公司也就无从查证了，想去找旅游公司收钱都没有任何依据。


    但是区块链则不同，其实现了分布式账本的机制。如果在区块链上，“某年某月某日，张××从××保险公司，购买了延误险一份，支付金额×元”这个信息，是区块链上所有节点都会同时记录的信息，而且是对所有节点开放的。旅游
    App 是区块链上的一个节点，保险公司也是区块链上的节点，消费者购买延误险的同时，旅游 App 和保险公司都记了账，双方的账一模一样，且谁都不能单方面修改。这样，信息就在节点之间完全透明，节点都是平等的，没有任何一个节点可以藏匿信息。基于这个公开的账本，保险公司可以理直气壮地找旅游
    App 结算，旅游 App 应该付保险公司多少钱，就得付多少钱。


    这就打破了中心节点垄断信息的霸权。


    ## 两种治理方式的比较


    中心化组织+监管机构是物理世界中最典型的治理模式，古今中外，概莫能外。数字世界中，区块链技术实现了去中心化组织+智能合约自治的模式。


    银行业有银监会监督，证券业有证监会监督，互联网平台现在被市场监管总局监督。这种治理模式至少在物理世界还是行之有效的。中心化组织利用数据霸权为所欲为的时候，不得不顾忌头上的达摩克利斯之剑。


    在区块链构成的去中心化世界中，正在构建新的治理模式。去中心的治理模式，到底去了什么中心？我们先从物理世界中电影产业的治理说起。


    ### 电影产业的治理


    电影这个行业，是在物理世界生产、在物理世界消费、在数字世界体验的特殊行业。其资产类型是典型的高价值数字资产。


    早期的电影采用胶片摄影机拍摄，电影就是一卷卷的胶片。现在几乎没有人再利用胶片技术来拍电影。偶尔有一两部，宣传的重点往往在于胶片电影特有的质感。取而代之的是数字技术，电影从存储在胶片上，变成存储在硬盘中，成了一个个数字文件。无论是胶片还是数字文件，对电影产业而言，盗版都是大敌。


    电影的制作方要防范盗版，大都采取加密数字文件的方式。只要不知道密钥，就算盗取了数字文件也无法播放。另一种方式是使用昂贵的电影播放设备。例如 3D 类型的电影，需要专用设备播放。控制专用设备也是保护电影文件的可选方法。


    电影产业有制作方（拍摄电影）、发行方（销售电影）、院线（播放电影的影院，为了简化讨论，其他播放渠道如网上点播等忽略不计）。这三方收益如何分配？在产业发展的不同阶段，三方之间的分配比例略有不同。中国发行方比较强势，就会占据较大的份额。海外更重视原创剧集，制作方就可能占更大的份额。具体比例是行业博弈的结果。


    但是有两个最重要的问题：不管三方份额如何，票房总收入谁说了算？院线和票务公司收到的资金，该如何归集？只有知道准确的总票房，电影产业的各个环节才知道分配的总盘子，知道自己按照比例可以分多少。票房收入的资金必须专款专用，及时地分配给各个参与方，才能皆大欢喜。


    我国专门成立了一个部门来解决这两个问题——国家电影事业发展专项资金管理委员会办公室（以下简称“专资办”），它是中宣部直属的事业单位，负责国家电影专项资金的征收、使用与管理；负责全国电影票务相关信息系统的建设、管理等工作；负责监督、协调省级电影专项资金管理委员会办公室相关工作；根据授权，利用信息技术手段实施电影票房市场监督管理，开展电影产业相关业务服务等。


    其中一项重要的工作，就是管理全国电影票务综合信息管理平台。按照专资办的规定，所有发售电影票的公司，必须在 10 分钟内上传电影票销售数据。这就及时地完成了全国总票房记录的任务。同时，根据电影票销售数据，监管票务公司的资金。


    既然专资办解决了电影产业的两大核心问题，它也会在每张电影票中分“一杯羹”。目前专资办提取 5%的票面金额，作为服务费用。


    专资办给电影产业记了“账”，还监督不同环节的票房分配。这是专资办对于电影产业的基础性作用。可以说，如果没有专资办，就没有电影产业。


    专资办有一个重要的功能，在疫情防控期间表现得尤为突出。疫情防控期间，电影院门可罗雀。几乎长达一年时间，这个产业没有任何收入，一些制作方、院线陷入濒临破产的境地。这时，专资办历年累积的小金库发挥了作用。这相当于电影产业的“大家长”拿出点“私房钱”，救助苦苦挣扎的产业。不得不说，专资办的资金，还是支持电影产业渡过了寒冬。


    ### 区块链的治理模式


    用区块链技术实现电影产业的治理方式，与“专资办”模式有所不同。


    首先，区块链利用分布式账本技术，取代了“全国电影票务综合信息管理平台”。制作方、发行方、院线都是电影区块链上的节点。票务销售数据的“账目”全部上链保存。任何一方都不能修改票务销售数据的账目。这是用技术手段，取代了行政命令，但是能达到一样的效果。“账目”权威性，足以用来作为各方分配的依据。


    监管的手段，采用智能合约。专资办规定的各种细则，统统用代码的形式实现。如果触发（违反规则），则自动执行（处罚）。


    电影产业治理模式和区块链治理模式，毫无疑问都在各自的领域发挥着举足轻重的作用。


    相比之下，电影产业治理模式成本高昂，治理成本占电影产业的 5%。2020 年我国电影总票房 204 亿元，治理成本就高达 10 亿元。这种治理方式无法在一些小众的行业应用。我们也没有办法在去中心化的世界中成立一个中心化的组织，来完成治理工作。


    因此，区块链的治理模式是数字世界行之有效的模式。


    专资办可以在疫情防控期间救助电影产业，这是专资办治理模式的领先之处。在去中心化的模式中，谁能来扛起拯救行业整体性衰退的重担呢？答案是“没有人”。也许自治社区还没有遇到类似的问题，也许会在后续的发展中产生类似的机制。迈阿密公寓悖论，在区块链世界中依然无解。


    ### 延伸阅读：以太坊是如何进行治理工作的


    区块链的世界中，代码就是规则。修改代码意味着修改规则。有一套相应的流程，确保代码修改符合整体的利益。这里用以太坊为例，说明代码修改的治理过程。


    网络的各个方面理论上都可以改变。与我们在现实世界中所遵守的社会契约不同的是，在去中心化网络中，如果参与者对网络的最新变化不满意，他们每一个人都可以选择“愤怒退出”（rage
    quit），从而离开这个网络，继续使用他们自己的备用网络。然而，在现实世界中，这种选择是不存在的，因为我们无法单枪匹马地退出系统或改变它的规则。我们不能决定不纳税或做违法的事情。这些规则是由体制决定的，几乎不可能改变。


    谁来决定软件中的内容？


    实现软件更改的过程与现实世界中通过新法律的过程非常相似。在现实世界中存在着各种利益相关者。对以太坊来说，其主要的利益相关者是：


    用户：持有$ETH 并使用以太坊应用程序的终端用户、加密货币交易所、在以太坊之上构建应用程序的开发人员。


    矿工：运行服务器场以验证交易并保护网络（从而获得以太币）的个人或企业实体。


    以太坊核心开发人员：为节点软件做出贡献并参加各种技术论坛的开发人员和研究人员。


    以太坊核心开发人员就像政客一样，通过衡量社交媒体、会议或文章上的情绪来聆听最终用户的需求。当许多用户要求某种功能或更改协议时，他们将考虑这些建议。


    EIP 被提交后，它将经历一个技术审查、研究和讨论的周期：


    Draft——正确格式化后，EIP 编辑器会将 EIP 合并到 EIP 存储库中。


    Review——EIP 作者将 EIP 标记为已准备就绪并请求对等审查。


    Last Call——经过初始迭代的 EIP，准备好接受广泛受众的审查。


    Accepted——一个核心的 EIP 已经在 Last Call 中出现了至少两周，并且开发人员已经处理了任何要求的技术更改。


    Final——核心开发人员已决定将其实施到各种客户端（Geth，Nethermind etc.）中并在未来的硬分叉（hard fork）中发布的 EIP，或者已经在硬分叉中发布的
    EIP。


    以太坊治理就像其他治理系统一样，有其缺点和优点。治理去中心化的网络绝非易事，像 Polkadot 这样的其他区块链正在尝试“链上”治理，其中所有重要决策均由直接在
    Polkadot 区块链上投票的用户做出。


    以太坊的治理是一种软治理，其中许多协调都在“链下”进行，并且在功能合并到客户端之前评估对提案的支持。但是，最终网络的参与者都会在链上做出接受或拒绝新软件的决定。


    以太坊的治理机制，是社区自治的典型，为整个以太坊提供算力的矿工、持有以太币的用户、开发者社区都有发言权。到目前为止，以太坊的治理工作非常出色，它拥有迄今为止所有最活跃的区块链开发人员和研究人员社区，并且在各方面都进行了创新。未来几年最大的挑战也许将是掌握从工作量证明到权益证明（也称“以太坊
    2.0”）的迁移——这将为更快、更便宜的交易和去中心化应用程序的新发展铺平道路。


    ## 游戏，并非逃离现实的桃花源


    元宇宙中的阿凡达不过是人们的化身，人们多重的人格，很可能在不同的元宇宙演绎不同性格的阿凡达。人性中善的一面可以被激发，恶的一面同样也可以被放大。有些问题，不是代码可以解决的。


    文中列举的例子，都是在游戏中真实发生的事件，有些事件甚至产生了难以挽回的伤害。


    ### 另类的欺凌


    《摩尔庄园》是由淘米网络科技有限公司开发的网页游戏，于 2008 年 4 月 28 日发布。这款游戏一上线，就以其可爱的卡通形象，轻快的音乐，以及游戏中构造出的美好、梦幻的世界而被广大消费者接受（见图
    5-1）。


    因为里面的内容偏低龄化，以健康、快乐、创造、分享为主题，这款游戏深受孩子们的喜欢和追捧。


    在 2009 年，《摩尔庄园》获得百度风云榜最佳网络游戏奖，成为获得该奖项的第一个儿童类游戏。


    ![](img/image00166.jpeg)


    图 5-1 游戏《摩尔庄园》宣传画（图片来源：雷霆游戏《摩尔庄园》官网）


    著名游戏网站多玩平台这样评论这款游戏：毫无疑问，《摩尔庄园》绝对是一款精心之作。游戏倡导“健康、快乐、创造、分享”的主题，游戏的画面与背景音乐也是研发商匠心独运的佳作，深深吻合着主题。污言秽语、谩骂谴责、暴力血腥、色情犯罪，在这个游戏中一点都找不到。人们所担忧的沉迷，在《摩尔庄园》里也被有效地防止。这里不仅是孩子们的，也是成年玩家们心灵的最后一片净土。作为一款以面向青少年儿童为主的网页游戏，游戏画面以儿童动漫卡通风格为主，给人一种和谐快乐、积极健康的感觉。


    2009 年，武汉市小学《信息技术》教材将《摩尔庄园》收入了“网游课”中。


    可以说，《摩尔庄园》在某些意义上是符合桃花源、乌托邦的特性的，是个充斥着真善美的乐园，也是人们心中纯净的元宇宙的模样。


    但是，围绕着《摩尔庄园》的犯罪现象，是游戏开发者及消费者们所始料不及的。


    2021 年，《摩尔庄园》新版本上线后，一位成年玩家“星无火”在微博上进行了自我揭露，他大肆炫耀着自己在网页游戏《摩尔庄园》中通过盗号、洗号、欺骗等方式，凌虐幼童的心灵，从而获取满足感的经历。


    他采用的方式非常简单，利用小朋友们单纯好骗的心理，通过接近他们，套取他们的游戏账号。当取得账号后，他会登录其账号将小朋友在游戏中的资产，例如漂亮的小房子、衣服、游戏币等彻底地毁掉。当小朋友询问甚至央求的时候，“星无火”则用辱骂的方式对待他们。


    此外，“星无火”还利用游戏漏洞，让小朋友免费为他打工。小朋友辛苦地进入他的庄园做完任务后，他会说一句“哦，滚吧”，并以此为乐。


    “星无火”无法从他的这些行为中获取任何实际上的经济利益，也无法取得现实成就。他只是利用这些小朋友单纯善良的内心来满足自己施虐的变态欲望，并且将自己所做出的这些事情发布到互联网上进行炫耀。


    在现实生活中，用语言暴力或者行为暴力虐童，需要隐蔽的地点与合适的目标。大多数儿童在现实生活中都被父母、监护人、老师保护得很好，并不会给这类人机会，但是在虚拟世界中，他们可以利用虚拟的伪装，肆无忌惮地伤害这些儿童。


    “星无火事件”并不是个案，像他这样在虚拟世界中以伤害别人为乐的人还有很多。他们潜伏在数字信号之下，利用结构漏洞带来的便利，满足自己的变态欲望，给那些幼小的心灵带来伤害，破坏游戏设计者原本的桃花源构想。


    ### 性犯罪的温床


    人性恶的成本在元宇宙中被无限降低。这和人们所说的“在网络上，你甚至不知道对面是人是狗”其实是一个道理。


    在元宇宙的世界中，你不知道对面是什么人，不知道对方的目的。你也不知道自己在对方眼里是什么样的角色。


    尤其是在创世者的放纵和不作为中，本身可能拥有美好梦幻设定的纯净世界，会被污染成新的犯罪温床。


    在淘米网络开发的网页游戏《小花仙》中（见图 5-2），这种恶就被体现得淋漓尽致。


    ![](img/image00175.jpeg)


    图 5-2 游戏《小花仙》宣传图（图片来源：淘米游戏《小花仙》官网）


    这款偏低龄化的游戏，以微观世界为故事舞台，描写了不同身份的花仙交织出的奇幻冒险。玩家扮演的小花仙可以进行换装，精美华丽的服装、可爱漂亮的人物形象，都让这款游戏成为小女孩们的最爱。这款游戏的玩家小则六七岁，大则十四五岁，正处于天真烂漫的年龄。


    就是这么一款纯洁的游戏，却被那些别有用心的人所玷污，成为恋童癖的犯罪场所。在游戏里，花 3—5 张“米米卡”，也就是 30—50 元，可以购买到漂亮的衣服，于是有人打着送“米米卡”、发红包的旗号，在世界频道、留言板留下联系方式，然后通过利诱，向小女孩索要裸照，色情视频，甚至要求线下见面进行性侵。甚至还有人在游戏中明目张胆地要包养女孩。


    这些小女孩多缺乏性保护意识，很容易被引诱。她们被威胁，不敢告诉家长，甚至被多次威胁伤害。


    2017 年，该事件登上微博热搜，引起了大众的注意和反感。淘米网络紧急下架了留言板和传音花等功能，而此时距离游戏运营已有 7 年，这 7 年中有多少受害者不得而知。


    这样的游戏会给多少人带来一生的痛苦伤痕，这些伤痕多久后才会得到弥补，不得而知。


    ### 数字资产的损毁


    《星战前夜》（英文名：EVE Online）是由冰岛 CCP 所开发的大型多人线上游戏（见图 5-3）。游戏为玩家提供了壮阔而充满想象力的科幻太空场景，玩家可以驾驶自行改造的船舰在数千个行星系中穿梭、遨游。行星系中包含行星、卫星、太空站、小行星带等各种各样的物体。通过星门，各个行星系得以连接。


    ![](img/image00183.jpeg)


    图 5-3 游戏《星战前夜》宣传图（图片来源：网易游戏《星战前夜》官网）


    这款游戏以其庞大的科幻背景、复杂的硬核玩法而闻名，吸引了大量的国内外玩家。


    这款游戏可以说是科幻世界中的元宇宙，摒弃了传统的以计算机人工智能为基准建立的游戏设计理念，而把人与人之间的互动提升到了前所未有的高度。设计者以全新的角度设计了游戏架构，不再设计各种新奇的迷局来挑战游戏者，而是将力量集中在建立虚拟世界的运行规则上，同时不断给游戏者提供必要的工具，让他们能够掌握自己的命运。


    在这个游戏中，人与人之间的交互成为最重要的点。虽然前期非常难，但是上手后，玩家便能够体会到游戏的乐趣。这是一款需要投入大量时间和精力以及金钱的游戏，本意是想要让玩家在绝对的自由中体验科幻的世界，进入未来的元宇宙中。在游戏中，玩家可以自发组织成军团，军团的成员可以互相扶持、互相保护，拥有共同财产。


    2005 年发生了一件被记入游戏史的大劫杀事件。在这个虚拟的科幻宇宙中，卧底、敌对双方上演了一场精彩的无间道，雇佣兵、雇主、卧底、目标，这些本应该只存在于现实中的角色在游戏中纷纷登场。


    故事的主人公是 Ubiqua Seraph 军团的 CEO Mirial，她和往常一样，在最信赖的副手陪伴下进行着游戏，结果却遭遇了另一个军团 GHSC 的伏击。为了能够赢得这场伏击，GHSC
    花费了一年多的时间，在 Ubiqua Seraph 军团中安插埋伏了大量间谍，以获取 Mirial 的信任，并且筹划了这场大劫杀。


    最终，这场劫杀劫掠的 Ubiqua Seraph 军团财产折合约 16500 美元，也让 Mirial 自己的账号蒙受了巨大的损失。根据游戏规则，这是合法的，并没有人因此而受到惩罚。


    与此同时，在这个游戏中，互相进行劫杀已经成为司空见惯的事情。很多新手玩家高高兴兴地建设好自己的飞船后，被别的军团打得四分五裂，成为废铁。


    虽然这是发生在元宇宙的事情，但是造成的经济损失在现实生活中是真实存在的。


    当人性的恶与平台的无作为结合在一起的时候，普通原住民的安危和财产安全又该如何得到保证呢？


    ### 教唆犯罪


    臭名昭著的《蓝鲸》就是这样一款网络游戏。


    这款俄罗斯游戏的玩法，就像是游戏界面上的套索和血红色的字所展示的那样残酷，它被多个国家所禁止，因为它迫害的是玩家的生命。


    《蓝鲸》可以在多个社交媒体上进行。玩家会被配置给一名“主人”，这个“主人”每天会给玩家布置一个任务。这些任务包括使用小刀或剃刀在手臂上划出鲸的图案、全天观看恐怖电影，甚至凌晨
    4 点就起床。当游戏进行到第 50 天，“主人”就会命令玩家自杀。


    很多青少年参与“蓝鲸”游戏后想退出，但遭受了管理员的威胁。他们担心管理员会通过 IP 地址锁定自己和家人，因此被迫带着恐惧继续玩下去。


    英国《每日镜报》称，没有证据显示有人在现实中因未将游戏继续下去而遭报复，但来自管理员的威胁仍使很多孩子硬着头皮走上了绝路。


    俄罗斯《新报》称，俄罗斯公共互联网技术中心追踪到，仅在一天之内，就有 4000 多名用户在 Vkontakte 上使用与“蓝鲸”游戏相关的标签建群，如“深海鲸群”“静谧的房间”以及“4
    点 20 叫醒我”，等等。每个群背后隐藏的玩家数量是难以估计的。


    这款游戏在国内也被禁止，但是类似的游戏还有很多，它们隐藏在不被发现的暗处，危害着缺乏判断能力的青少年及儿童。


    ## 治理模式，依然在求索的路上


    在元宇宙中，人们行为规则的社会化属性，比去中心化的应用中的社会化属性更为明显。目前以区块链为基础的去中心化应用，大多集中在金融、交易等领域。也有人在开发利用区块链技术的游戏，但是在画面、可玩性方面，尚无法和
    Roblox、《堡垒之夜》等大作媲美。


    不同元宇宙，不同的阿凡达，不同的人性体现。这些多样的人生，是在相同的游戏规则中演化的人生百态。创始者也并非完全是上帝的模样。游戏《蓝鲸》的开发者，或许就是撒旦在元宇宙中的代表。

