- raw: "19世纪的英国有着广阔的地理空间，贸易量和商品配送需求大规模增长，自然而然带动了其他领域的工业革命，产生了煤炭、钢铁、蒸汽机、电报，以及公路、铁路、轮船等运输工具。\n\
    \n一旦劳动分工形成，需求和供给便相互分离且不断细分。需中有供、供中有需，俨如“阴阳”，相辅相成。一方面，市场需求和供给双方随即也会开展一场相互创造、相互追赶的竞赛，各自的发展螺旋式上升。机械化的每一步都提高了生产规模，并且更大的生产规模就需要更大的市场来消费。换句话说，生产能力的每次扩展，需要更多的需求来吸收，从而激发资本家进入新的大陆，创造新的市场。另一方面，市场的每一次扩展都会使得新一轮的机械化有利可图。同时，一个领域的机械化变革，会使相关产业产生类似的需求和激励。增长带来更多的增长，扩张导致更大的扩张。\n\
    \n第一次工业革命对于能源的需求，刺激了第二次工业革命的到来，我们至今仍在享受工业革命的成果。\n\n棉花纺织业作为工业革命的先导产业，拥有几个特征：第一，行业空间足够大。第二，行业需求无上限。第三，产业链条足够长，可以引起变革的连锁反应。第四，需要的技术多，可以促使技术成熟，产生外溢效应。\n\
    \n其实，早在英国第一次工业革命之前，荷兰造船业的分工就已经足够细致。但是，当时的造船业不足以开拓巨大的市场，先进的造船业只能培育出优秀的工匠。如果想要引发工业革命连锁反应的浪潮，造船业显然力不从心。尽管在17世纪，荷兰就已经雄踞世界，国力压过英国一头，但是担负第一次工业革命使命的国家，还是英国。历史注定选择棉纺织业作为第一次工业革命的先导产业，而不是渔业等产业。\n\
    \n### 游戏孕育了元宇宙\n\n任何大的时代变迁，都有现象级的行业发展，形成示范效应。棉纺织产业的特征几乎和现代游戏产业的特征一模一样。\n\n首先，产业空间大。2020年12月17日，中国游戏产业年会现场，中国音像与数字出版协会第一副理事长张毅君公布了《2020年中国游戏产业发展状况》。从几年的大数据来看，游戏行业依然保持着高速增长，2020年的总收入为2786.87亿元，比2019年增加了近500亿元，用户数量也在稳定增长。这说明，和所有人都有保暖避寒的需求一样，所有人也都有娱乐休闲的精神需求。\n\
    \n其次，消费弹性空间大。爱美的女士，可以一天换一件衣服。常有消费主义者鼓吹“美女的衣橱中永远少一件合适的衣服”这种说法。游戏也一样，人们总是喜欢尝鲜，体验不一样的东西。需求几乎是没有上限的。\n\
    \n再次，产业链条长。棉纺织业上游有着棉花种植、采摘、轧棉、纺纱、织布、印刷和印染等环节。游戏软件包括设计、开发、发行；硬件包括主机、芯片、操作系统。此外，还有通信，包括5G、光纤等。\n\
    \n最后，对相关产业的带动性非常强。棉纺织业带动了上游的农作物种植、机械制造、运输、化工等产业。游戏玩家都深有体会的是，游戏硬件总是跟不上游戏的需求，需要更好的3D引擎、CPU（中央处理器）、GPU（图形处理器）、显示屏、VR和AR等。\n\
    \n作为元宇宙的雏形，大型游戏一般都具备如下五个特征。\n\n（1）基础的经济系统：游戏中建立了和现实世界相似的经济系统，用户的虚拟权益得到保障，用户创造的虚拟资产可以在游戏中流通。\n\
    \n（2）虚拟身份认同强：游戏中的虚拟身份具备一致性、代入感强等特点，用户在游戏中可以以虚拟身份进行虚拟活动。游戏一般依靠定制化的虚拟形象和形象化的皮肤，以及形象独有的特点让用户产生独特感与代入感。\n\
    \n（3）强社交性：大型游戏都内置了社交网络，玩家可以及时交流，既可以用文字沟通，也可以语音，甚至可以视频。\n\n（4）开放自由创作：游戏世界包罗万象，这离不开大量用户的创新创作。如此庞大的内容工程，需要开放式的用户创作为主导。\n\
    \n（5）沉浸式体验：游戏作为交互性好、信息丰富、沉浸感强的内容展示方式，将作为元宇宙最主要的内容和内容载体。同时，游戏是VR虚拟现实设备等最好的应用场景之一。凭借VR技术，游戏能为用户带来感官上的沉浸体验。\n\
    \n国盛证券研究报告从开放自由创作、沉浸式体验、经济系统、虚拟身份及强社交性方面分析了Roblox、Decentraland、Soul、《我的世界》《魔兽世界》《堡垒之夜》《王者荣耀》这些项目与元宇宙概念的关系[^(\\\
    [2\\])](#part0020.xhtml#comment_7844)。报告显示，Roblox的玩家在创作游戏时具备极高的自由度，平台具备全面且与现实经济互通的经济系统。虚拟资产和虚拟身份可以在游戏内容间互通，创作者可以在自己游戏中设计商业模式。Roblox的模式已经可以看出元宇宙的雏形。《我的世界》在开放自由创作方面接近元宇宙，而在其他方面较有差距。《魔兽世界》在虚拟身份代入感、社交性和体验感方面都靠近元宇宙概念。《堡垒之夜》具有很高的人气。Decentraland在经济系统上更为接近元宇宙的形式。《王者荣耀》具备一定的虚拟社交属性，但与元宇宙的概念差别较大。Soul只在社交性和虚拟身份方面与元宇宙的概念有些许关联。\n\
    \n元宇宙的基本特征，在游戏世界中得到精彩的展现和诠释，但是并没有一款游戏能完全达到理想的元宇宙状态。从这点来讲，游戏不过是元宇宙的雏形，但是从游戏角度出发，我们可以充分理解元宇宙。\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0020.xhtml#commentRef_7558)文一.伟大的中国工业革命——发展政治经济学一般原理批判纲要［M］.北京:清华大学出版社，第98页。\n\
    \n[\\[2\\]](#part0020.xhtml#commentRef_7812)具体请参见国盛证券研究报告《元宇宙：互联网的下一站》。\n\n##\
    \ 游戏，拉动上游产业的发展\n\n与元宇宙游戏相关的产业链（或说价值链），可以划分为七个方面，自下而上分别是基础设施、人机交互、去中心化、空间计算、创造者经济、渠道和体验（见图3-1）。\n\
    \n![](Images/image00171.jpeg)\n\n图3-1　Metaverse的七层价值链（资料来源：Roblox招股书）\n\n基础设施包括5G通信、Wi-Fi\
    \ 6、云计算、芯片工艺、微机电系统、图形处理器等。人机交互包括手机、智能眼镜、可穿戴设备、触觉设备、手势感应装置、声控、脑机接口等。去中心化包括边缘计算、AI、微服务、区块链等。空间计算包括3D引擎、VR、AR、XR、多任务处理UI、空间地理制图等。创造者经济包括设计工具、资本市场、工作流程、商业系统。渠道包括广告网络、社交网络、策展、商店、代理商等。体验包括游戏、社交、电子竞技等。\n\
    \n虽然，游戏不过是元宇宙的雏形，但是游戏的发展，全面带动了元宇宙所必需的技术基础和经济系统。这些技术的外溢，甚至是游戏体现的生产关系的外溢，会引起相关产业一系列的变化。我们择其紧要者，略作分析。\n\
    \n### 游戏和5G\n\n视频之于4G，就像游戏之于5G。它们相辅相成，共同促进。事实上，如果缺少游戏对于大带宽、低时延、高并发的相关应用，5G铺设的速度就会越来越慢。毕竟大家只是看个视频，4G就够用了。业界曾认为，自动驾驶可能是5G的“杀手级”应用，可以刺激5G的增长。虽然电动汽车越来越多，但是自动驾驶的普及还尚需时日。工业、矿业中5G应用案例也已经比比皆是，但是仅仅依赖生产中的一些场景来带动5G的发展，无疑是非常吃力的。必须是消费级市场的普及型应用，才能拉动5G产业。\n\
    \n游戏，成了5G应用的重要选择。\n\n“真VR”需要5G。\n\n影响用户体验的主要是视频分辨率、帧率、头部MTP时延、操作响应时延和肢体MTP时延等，其中后三者的体验可以通过芯片算力提升、传感器优化、数字接口优化和操作系统优化等实现，而分辨率和帧率等因素主要影响用户临场感、逼真度和眩晕感，这些参数与图像渲染和视频质量有关。\n\
    \n只有当VR达到16K之后，肉眼才察觉不到纱窗效应，也就是接近肉眼的“完全沉浸感”。16K像素点约1.3亿，如果以24真彩色为标准，默认140 Hz FPS下，每秒的原生视频流量达到惊人的138\
    \ Gbps。因此，随着VR硬件的提升，如果我们要摆脱有线的束缚，必须探索大带宽低时延的无线网络及高效的视频压缩算法。\n\n根据华为报告测评，在水平视域110度，自由度6\
    \ DOF，视频基于H.264编码下，单眼1.5K、FPS 60为“入门级”水平，这时需要的带宽是25 Mbps。而单眼2K和帧率90，将作为未来的体验提升目标，这时需要的带宽是153\
    \ Mbps。而如果用户体验达到理想水平，需要达到单眼6K、帧率90的水平，此时需要带宽1.4 Gbps，因此5G、千兆宽带和Wi-Fi 6等下一代接入方式必不可少。\n\
    \n表3-1　不同单眼分辨率不同帧率对应的平均码率和视频体验得分  \n\n（资料来源：华安证券研究所《华为云VR临场感指数白皮书》）\n\n![](Images/image00179.jpeg)\n\
    \n在5G方面，根据爱立信移动报告，2021年全球5G用户渗透率大概能达到10%，至少到2025年，5G渗透率达到40%左右才有可能看到VR室外规模商用。宽带方面，根据网速测试工具Speedtest分析，2021年一季度全球前十大网速领先国家网速约为200\
    \ Mbps，目前仅能支持2K、90 FPS的VR体验，千兆宽带的普及具有很大价值。\n\n5G才能支持“云游戏”\n\n云游戏是一种以云计算和串流技术为基础的在线游戏技术，其游戏的逻辑和渲染运算都在云端完成。数据处理完成后，结果被编码成音频流、视频流，通过网络传输给终端，终端则将用户的操作信息传输给云端，进行实时交互。云游戏支持用户使用随身携带的移动设备随时随地享受3A级游戏大作的极致体验，打通大型游戏的终端壁垒。而其中延迟程度的高低将直接影响云游戏的用户体验，因此网络显得尤为重要。伴随着5G技术的成熟，云游戏最关键的网络问题迎刃而解。\n\
    \n一些大型的桌游对硬件的配置要求很高。普通的办公用笔记本根本无法满足大型游戏的需求。随着5G的发展，我们现在可以把大量的计算放在云端完成，电脑端只需要显示网络传输的画面即可，这就大大降低了对于电脑的配置要求。甚至在手机和平板电脑上，我们也可以玩大型游戏。\n\
    \n云游戏主要有五个核心技术：GPU服务器、虚拟化、音视频技术、实时网络传输和边缘计算。目前各核心技术均已趋于成熟。\n\n### 游戏和VR\n\n需要VR/AR设备在用户体验方面不断进步\n\
    \n2018年，美国一项针对专家的调研显示，在影响AR和VR普及的各类因素中，用户体验被视为最主要的因素。选择这两项的受访者占比分别达到39%和41%（见图3-2）。如果设备性能不过关，用户体验感就会大打折扣。作为未来进入元宇宙的第一入口，AR和VR目前仍须在软硬件上不断做出优化。\n\
    \n![](Images/image00188.jpeg)\n\n图3-2　用户体验是影响AR/VR普及的主要瓶颈  \n\n（资料来源：eMarketer、华安证券研究所）\n\
    \n以VR设备为例，目前主流产品类型包括VR手机盒子、VR头显和VR一体机。市面上VR设备的分辨率最高支持到4K。如上所述，若要达到人眼最自然的清晰度，则需要16K的水平。高刷新率可以提高画面的流畅度，减少延迟和重影，一定程度上减轻人们使用VR设备时产生的眩晕感。最理想的刷新率是180Hz，而目前大部分VR头显刷新率为70Hz至120Hz。\n\
    \n对于轻便性需求，刺激无线串流技术发展\n\n为了实现VR头显的轻便，并解决空间移动问题，无线串流是VR产品设计须着力解决的方向。目前主流的无线串流技术主要是Wi-Fi和私有协议，前者将PC（个人计算机）的GPU渲染并压缩过的数据通过Wi-Fi路由器传送至头显，通常需要千兆路由器才能有比较流畅的体验。由于技术的不成熟，目前存在额外延迟、画质损耗、高性能消耗及其他不稳定因素。后者是通过设备厂家自己研发的压缩算法和通信协议进行传输。例如，使用VIVE无线套件及WiGig配件，可以让我们实现电脑和VR头显延迟小于7ms，但需要架构额外的WiGig加速卡，增加了用户的成本。\n\
    \n表3-2　主要VR内容平台概况  \n\n（资料来源：映维网、VR陀螺、青亭网、搜狐网、华安证券研究所）\n\n![](Images/image00151.jpeg)\n\
    \n在游戏的带动下，VR/AR出货量持续攀升（见图3-3），全球VR硬件市场规模快速增长（见图3-4）。\n\n![](Images/image00160.jpeg)\n\
    \n图3-3　2020—2025年AR/VR头显出货量CAGR 53%  \n\n（资料来源：Trendforce、华安证券研究所）\n\n![](Images/image00169.jpeg)\n\
    \n图3-4　2020—2022全球VR硬件市场规模快速增长  \n\n（资料来源：Statista、华安证券研究所）\n\n### 游戏和数字货币\n\n\
    从经济视角来看，每一款游戏都是“体验+消费”，而符合元宇宙特征的游戏，还要增加“创造”一词。创造和消费也就促进了基础的价值循环。更进一步，现代所有的游戏，都是一个“虚拟的经济体”，在游戏营造出的虚拟世界中，都需要“消费”通行的“货币”。“氪金”作为网络的流行语，在游戏中，是指向游戏中“充值”的行为。\n\
    \n事实上，拥有“氪金”的游戏，就是一个独立的经济体。\n\n游戏的商业模式，也经历了几个变迁过程。最初，游戏和其他软件销售一样，销售游戏光盘，玩家一次付费，终身使用。游戏有着和其他物品类似的商品属性。卖游戏就像是卖书一样。\n\
    \n盛大代理《传奇》是一个里程碑，开始了游戏点卡充值的时代。人们不再像卖书一样卖游戏了，而是变成按时长收费，时间不够了要充值。这个阶段很短，很快过渡到卖道具的阶段。\n\
    \n也就是说，游戏不收费，不设时间限制，可以任意玩儿，但是如果你需要一件新的“宝贝”或者新的“衣服”（皮肤），就得花钱购买。充值，就成了玩家的常态，甚至引申出“氪金”这个颇具朋克色彩的网络流行语。现在，很少能找到没有“氪金”的游戏。\n\
    \n游戏的商业模式发展到这个阶段，其实还是用户方面的消费行为。只是从一次性付费，变成持续性付费。充值后，也没有“退款”选项。玩家和游戏厂商都默认玩家早晚会消费掉所有“氪金”。\n\
    \nRoblox做出了一个大胆的创新，就是用户充值后可以取现。这是一个石破天惊的举动，就算是在金融创新、金融衍生品令人眼花缭乱的美国，也是颇具争议的行为。这给金融监管带来一个很严肃的话题：如果涉嫌洗钱该如何处理？这个话题，我们将在第五章继续讨论。\n\
    \n在Roblox中充值可以取现的规则，就和我们出国换外币一样。去其他国家旅行，机场往往有一个货币兑换的柜台，可以把人民币换成其他国家的货币。如果去越南，就换成越南盾，去美国就换成美元。回国的时候，再把越南盾或者美元换成人民币。货币兑换是有手续费的，以此限制大家不能兑换太多。就算有人财大气粗，不在乎那点手续费，还有总额限制，并且单次也不能兑换过多。\n\
    \n每个国家都有自己的货币，无论国家大小，货币是一个国家主权的象征。如果一个国家没有自己独立的货币，则根本称不上是一个独立的国家，一定是某个大国的附庸，徒具国家之名而已。\n\
    \n有了统一的货币，就算不是一个国家，也会成为联系紧密的经济体。欧元就是现实的例子，但是，把千年以来就互相独立的国家统一成一个国家，难度太大。他们退而求其次，先把货币统一，这就有了欧元。\n\
    \nRoblox内部发行了Robux货币，为了行文方便，我们简称它为“萝卜币”。在游戏中购买道具，只能使用“萝卜币”。在游戏中制造道具，可以出售。这样玩家在游戏中可以赚“萝卜币”。退出游戏时，可以把“萝卜币”换成美元。\n\
    \n有了“萝卜币”，Roblox就像一个经济体一样运行。人们进入Roblox，不再是单纯的消费行为。有些人进入Roblox是为了谋生，这些人是Roblox中的创造者，他们可以设计出新的“皮肤”，卖给其他玩家，玩家用“萝卜币”支付，卖家也可以随时把“萝卜币”换成美元。如此一来，有买有卖的经济行为产生了，一个虚拟世界的经济体形成了。\n\
    \n“萝卜币”，展示了元宇宙经济的雏形。\n\n熟悉比特币、以太坊的读者，可能会问：“这不就是ETH吗？”的确，利用以太坊的技术，可以实现“萝卜币”。如果只是在Roblox中使用萝卜币，也可以采用其他技术来实现。\n\
    \n具备元宇宙特征的游戏，天然形成了数字货币的应用场景。这是传统的货币系统无法支持的领域。随着元宇宙爆炸式地增长，数字货币总交易量飞速上涨。\n\n以太坊是基础的数字货币，可以成为元宇宙的通行货币。元宇宙提供了以太坊货币的应用场景，以太坊货币可以进一步促进元宇宙的爆发。\n\
    \nDC/EP（央行数字货币）是基础的数字货币，或说DC/EP本身也可以成为元宇宙的通行货币。它们之间同样是相互促进的关系。\n\n## 传统产业数字化发展之路，需融入元宇宙要素\n\
    \n对于传统产业数字化转型这个宏大的话题，本书不作展开。本部分简要提示元宇宙对于数字化转型的启示。\n\n### 从信息化到数字化\n\n很多咨询公司的从业者，往往纠结于一个问题，就是信息化和数字化的区别。这也难怪，咨询顾问面对客户的时候，他们不得不回答这个问题。难道以前建设的信息系统不香了？现在，信息系统变成了“数字”系统，人们还得多花钱。到底数字化解决了哪些信息化没有解决的问题？\n\
    \n对于信息化和数字化的差别如图3-5所示。\n\n区分信息化、数字化的关键在于区分决策是在物理世界还是数字化世界完成的。如果决策是在数字化世界完成，那就是数字化，如果决策是在物理世界完成，那就是信息化。这里的决策，是指导物理世界中执行下一个“动作”的指令。\n\
    \n![](Images/image00177.jpeg)\n\n图3-5　从信息化到数字化[^(\\[1\\])](#part0022.xhtml#comment_9163)\n\
    \n### 从数字化到元宇宙\n\n元宇宙更彻底，它没有物理世界，全部是数字世界。就像《头号玩家》的玩家们戴上VR头盔的一瞬间，就会感觉如同穿越虫洞一样，进入另一个宇宙。所有的活动，包括生产活动，都是在数字世界中完成的。\n\
    \n物理世界中，人如同“躯壳”般的存在，只要满足“躯壳”必需的空气、水和营养，躯壳身在何方，处于什么境地，无关紧要。最极端的情况在《黑客帝国》中揭示得淋漓尽致。人成为“Matrix”的能量来源，所有人生活在密封的罐子里，而每个人的“化身”都在Matrix中工作、生活、恋爱、生子，直到被Neo发现了真相。\n\
    \n### 理解数字孪生\n\n2003年，迈克尔·格里夫斯（Michael Grieves）教授在密歇根大学的产品全生命周期管理课程上，首次提出了“与物理产品等价的虚拟数字化表达”的概念，并给出定义：一个或一组特定装置的数字复制品，能够抽象表达真实装置，并可以此为基础进行真实条件或模拟条件下的测试。教授希望可以将所有的数据放在一起进行更高层次的分析。\n\
    \n2011年，Michael Grieves教授在《几乎完美：通过产品全生命周期管理驱动创新和精益产品》中引用了其合作者约翰·维克斯（JohnVickers）描述概念模型的名词——数字孪生（Digital\
    \ Twin），并一直沿用至今。[^(\\[2\\])](#part0022.xhtml#comment_9298)"
  fmt: "\n19世纪的英国有着广阔的地理空间，贸易量和商品配送需求大规模增长，自然而然带动了其他领域的工业革命，产生了煤炭、钢铁、蒸汽机、电报，以及公路、铁路、轮船等运输工具。\n\
    \n一旦劳动分工形成，需求和供给便相互分离且不断细分。需中有供、供中有需，俨如“阴阳”，相辅相成。一方面，市场需求和供给双方随即也会开展一场相互创造、相互追赶的竞赛，各自的发展螺旋式上升。机械化的每一步都提高了生产规模，并且更大的生产规模就需要更大的市场来消费。换句话说，生产能力的每次扩展，需要更多的需求来吸收，从而激发资本家进入新的大陆，创造新的市场。另一方面，市场的每一次扩展都会使得新一轮的机械化有利可图。同时，一个领域的机械化变革，会使相关产业产生类似的需求和激励。增长带来更多的增长，扩张导致更大的扩张。\n\
    \n第一次工业革命对于能源的需求，刺激了第二次工业革命的到来，我们至今仍在享受工业革命的成果。\n\n棉花纺织业作为工业革命的先导产业，拥有几个特征：第一，行业空间足够大。第二，行业需求无上限。第三，产业链条足够长，可以引起变革的连锁反应。第四，需要的技术多，可以促使技术成熟，产生外溢效应。\n\
    \n其实，早在英国第一次工业革命之前，荷兰造船业的分工就已经足够细致。但是，当时的造船业不足以开拓巨大的市场，先进的造船业只能培育出优秀的工匠。如果想要引发工业革命连锁反应的浪潮，造船业显然力不从心。尽管在17世纪，荷兰就已经雄踞世界，国力压过英国一头，但是担负第一次工业革命使命的国家，还是英国。历史注定选择棉纺织业作为第一次工业革命的先导产业，而不是渔业等产业。\n\
    \n## 游戏孕育了元宇宙\n\n任何大的时代变迁，都有现象级的行业发展，形成示范效应。棉纺织产业的特征几乎和现代游戏产业的特征一模一样。\n\n首先，产业空间大。2020年12月17日，中国游戏产业年会现场，中国音像与数字出版协会第一副理事长张毅君公布了《2020年中国游戏产业发展状况》。从几年的大数据来看，游戏行业依然保持着高速增长，2020年的总收入为2786.87亿元，比2019年增加了近500亿元，用户数量也在稳定增长。这说明，和所有人都有保暖避寒的需求一样，所有人也都有娱乐休闲的精神需求。\n\
    \n其次，消费弹性空间大。爱美的女士，可以一天换一件衣服。常有消费主义者鼓吹“美女的衣橱中永远少一件合适的衣服”这种说法。游戏也一样，人们总是喜欢尝鲜，体验不一样的东西。需求几乎是没有上限的。\n\
    \n再次，产业链条长。棉纺织业上游有着棉花种植、采摘、轧棉、纺纱、织布、印刷和印染等环节。游戏软件包括设计、开发、发行；硬件包括主机、芯片、操作系统。此外，还有通信，包括5G、光纤等。\n\
    \n最后，对相关产业的带动性非常强。棉纺织业带动了上游的农作物种植、机械制造、运输、化工等产业。游戏玩家都深有体会的是，游戏硬件总是跟不上游戏的需求，需要更好的3D引擎、CPU（中央处理器）、GPU（图形处理器）、显示屏、VR和AR等。\n\
    \n作为元宇宙的雏形，大型游戏一般都具备如下五个特征。\n\n（1）基础的经济系统：游戏中建立了和现实世界相似的经济系统，用户的虚拟权益得到保障，用户创造的虚拟资产可以在游戏中流通。\n\
    \n（2）虚拟身份认同强：游戏中的虚拟身份具备一致性、代入感强等特点，用户在游戏中可以以虚拟身份进行虚拟活动。游戏一般依靠定制化的虚拟形象和形象化的皮肤，以及形象独有的特点让用户产生独特感与代入感。\n\
    \n（3）强社交性：大型游戏都内置了社交网络，玩家可以及时交流，既可以用文字沟通，也可以语音，甚至可以视频。\n\n（4）开放自由创作：游戏世界包罗万象，这离不开大量用户的创新创作。如此庞大的内容工程，需要开放式的用户创作为主导。\n\
    \n（5）沉浸式体验：游戏作为交互性好、信息丰富、沉浸感强的内容展示方式，将作为元宇宙最主要的内容和内容载体。同时，游戏是VR虚拟现实设备等最好的应用场景之一。凭借VR技术，游戏能为用户带来感官上的沉浸体验。\n\
    \n国盛证券研究报告从开放自由创作、沉浸式体验、经济系统、虚拟身份及强社交性方面分析了Roblox、Decentraland、Soul、《我的世界》《魔兽世界》《堡垒之夜》《王者荣耀》这些项目与元宇宙概念的关系[^(\\\
    [2\\])](#part0020.xhtml#comment_7844)。报告显示，Roblox的玩家在创作游戏时具备极高的自由度，平台具备全面且与现实经济互通的经济系统。虚拟资产和虚拟身份可以在游戏内容间互通，创作者可以在自己游戏中设计商业模式。Roblox的模式已经可以看出元宇宙的雏形。《我的世界》在开放自由创作方面接近元宇宙，而在其他方面较有差距。《魔兽世界》在虚拟身份代入感、社交性和体验感方面都靠近元宇宙概念。《堡垒之夜》具有很高的人气。Decentraland在经济系统上更为接近元宇宙的形式。《王者荣耀》具备一定的虚拟社交属性，但与元宇宙的概念差别较大。Soul只在社交性和虚拟身份方面与元宇宙的概念有些许关联。\n\
    \n元宇宙的基本特征，在游戏世界中得到精彩的展现和诠释，但是并没有一款游戏能完全达到理想的元宇宙状态。从这点来讲，游戏不过是元宇宙的雏形，但是从游戏角度出发，我们可以充分理解元宇宙。\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0020.xhtml#commentRef_7558)文一.伟大的中国工业革命——发展政治经济学一般原理批判纲要［M］.北京:清华大学出版社，第98页。\n\
    \n[\\[2\\]](#part0020.xhtml#commentRef_7812)具体请参见国盛证券研究报告《元宇宙：互联网的下一站》。\n\n##\
    \ 游戏，拉动上游产业的发展\n\n与元宇宙游戏相关的产业链（或说价值链），可以划分为七个方面，自下而上分别是基础设施、人机交互、去中心化、空间计算、创造者经济、渠道和体验（见图3-1）。\n\
    \n![](Images/image00171.jpeg)\n\n图3-1　Metaverse的七层价值链（资料来源：Roblox招股书）\n\n基础设施包括5G通信、Wi-Fi\
    \ 6、云计算、芯片工艺、微机电系统、图形处理器等。人机交互包括手机、智能眼镜、可穿戴设备、触觉设备、手势感应装置、声控、脑机接口等。去中心化包括边缘计算、AI、微服务、区块链等。空间计算包括3D引擎、VR、AR、XR、多任务处理UI、空间地理制图等。创造者经济包括设计工具、资本市场、工作流程、商业系统。渠道包括广告网络、社交网络、策展、商店、代理商等。体验包括游戏、社交、电子竞技等。\n\
    \n虽然，游戏不过是元宇宙的雏形，但是游戏的发展，全面带动了元宇宙所必需的技术基础和经济系统。这些技术的外溢，甚至是游戏体现的生产关系的外溢，会引起相关产业一系列的变化。我们择其紧要者，略作分析。\n\
    \n### 游戏和5G\n\n视频之于4G，就像游戏之于5G。它们相辅相成，共同促进。事实上，如果缺少游戏对于大带宽、低时延、高并发的相关应用，5G铺设的速度就会越来越慢。毕竟大家只是看个视频，4G就够用了。业界曾认为，自动驾驶可能是5G的“杀手级”应用，可以刺激5G的增长。虽然电动汽车越来越多，但是自动驾驶的普及还尚需时日。工业、矿业中5G应用案例也已经比比皆是，但是仅仅依赖生产中的一些场景来带动5G的发展，无疑是非常吃力的。必须是消费级市场的普及型应用，才能拉动5G产业。\n\
    \n游戏，成了5G应用的重要选择。\n\n“真VR”需要5G。\n\n影响用户体验的主要是视频分辨率、帧率、头部MTP时延、操作响应时延和肢体MTP时延等，其中后三者的体验可以通过芯片算力提升、传感器优化、数字接口优化和操作系统优化等实现，而分辨率和帧率等因素主要影响用户临场感、逼真度和眩晕感，这些参数与图像渲染和视频质量有关。\n\
    \n只有当VR达到16K之后，肉眼才察觉不到纱窗效应，也就是接近肉眼的“完全沉浸感”。16K像素点约1.3亿，如果以24真彩色为标准，默认140 Hz FPS下，每秒的原生视频流量达到惊人的138\
    \ Gbps。因此，随着VR硬件的提升，如果我们要摆脱有线的束缚，必须探索大带宽低时延的无线网络及高效的视频压缩算法。\n\n根据华为报告测评，在水平视域110度，自由度6\
    \ DOF，视频基于H.264编码下，单眼1.5K、FPS 60为“入门级”水平，这时需要的带宽是25 Mbps。而单眼2K和帧率90，将作为未来的体验提升目标，这时需要的带宽是153\
    \ Mbps。而如果用户体验达到理想水平，需要达到单眼6K、帧率90的水平，此时需要带宽1.4 Gbps，因此5G、千兆宽带和Wi-Fi 6等下一代接入方式必不可少。\n\
    \n表3-1　不同单眼分辨率不同帧率对应的平均码率和视频体验得分  \n\n（资料来源：华安证券研究所《华为云VR临场感指数白皮书》）\n\n![](Images/image00179.jpeg)\n\
    \n在5G方面，根据爱立信移动报告，2021年全球5G用户渗透率大概能达到10%，至少到2025年，5G渗透率达到40%左右才有可能看到VR室外规模商用。宽带方面，根据网速测试工具Speedtest分析，2021年一季度全球前十大网速领先国家网速约为200\
    \ Mbps，目前仅能支持2K、90 FPS的VR体验，千兆宽带的普及具有很大价值。\n\n5G才能支持“云游戏”\n\n云游戏是一种以云计算和串流技术为基础的在线游戏技术，其游戏的逻辑和渲染运算都在云端完成。数据处理完成后，结果被编码成音频流、视频流，通过网络传输给终端，终端则将用户的操作信息传输给云端，进行实时交互。云游戏支持用户使用随身携带的移动设备随时随地享受3A级游戏大作的极致体验，打通大型游戏的终端壁垒。而其中延迟程度的高低将直接影响云游戏的用户体验，因此网络显得尤为重要。伴随着5G技术的成熟，云游戏最关键的网络问题迎刃而解。\n\
    \n一些大型的桌游对硬件的配置要求很高。普通的办公用笔记本根本无法满足大型游戏的需求。随着5G的发展，我们现在可以把大量的计算放在云端完成，电脑端只需要显示网络传输的画面即可，这就大大降低了对于电脑的配置要求。甚至在手机和平板电脑上，我们也可以玩大型游戏。\n\
    \n云游戏主要有五个核心技术：GPU服务器、虚拟化、音视频技术、实时网络传输和边缘计算。目前各核心技术均已趋于成熟。\n\n### 游戏和VR\n\n需要VR/AR设备在用户体验方面不断进步\n\
    \n2018年，美国一项针对专家的调研显示，在影响AR和VR普及的各类因素中，用户体验被视为最主要的因素。选择这两项的受访者占比分别达到39%和41%（见图3-2）。如果设备性能不过关，用户体验感就会大打折扣。作为未来进入元宇宙的第一入口，AR和VR目前仍须在软硬件上不断做出优化。\n\
    \n![](Images/image00188.jpeg)\n\n图3-2　用户体验是影响AR/VR普及的主要瓶颈  \n\n（资料来源：eMarketer、华安证券研究所）\n\
    \n以VR设备为例，目前主流产品类型包括VR手机盒子、VR头显和VR一体机。市面上VR设备的分辨率最高支持到4K。如上所述，若要达到人眼最自然的清晰度，则需要16K的水平。高刷新率可以提高画面的流畅度，减少延迟和重影，一定程度上减轻人们使用VR设备时产生的眩晕感。最理想的刷新率是180Hz，而目前大部分VR头显刷新率为70Hz至120Hz。\n\
    \n对于轻便性需求，刺激无线串流技术发展\n\n为了实现VR头显的轻便，并解决空间移动问题，无线串流是VR产品设计须着力解决的方向。目前主流的无线串流技术主要是Wi-Fi和私有协议，前者将PC（个人计算机）的GPU渲染并压缩过的数据通过Wi-Fi路由器传送至头显，通常需要千兆路由器才能有比较流畅的体验。由于技术的不成熟，目前存在额外延迟、画质损耗、高性能消耗及其他不稳定因素。后者是通过设备厂家自己研发的压缩算法和通信协议进行传输。例如，使用VIVE无线套件及WiGig配件，可以让我们实现电脑和VR头显延迟小于7ms，但需要架构额外的WiGig加速卡，增加了用户的成本。\n\
    \n表3-2　主要VR内容平台概况  \n\n（资料来源：映维网、VR陀螺、青亭网、搜狐网、华安证券研究所）\n\n![](Images/image00151.jpeg)\n\
    \n在游戏的带动下，VR/AR出货量持续攀升（见图3-3），全球VR硬件市场规模快速增长（见图3-4）。\n\n![](Images/image00160.jpeg)\n\
    \n图3-3　2020—2025年AR/VR头显出货量CAGR 53%  \n\n（资料来源：Trendforce、华安证券研究所）\n\n![](Images/image00169.jpeg)\n\
    \n图3-4　2020—2022全球VR硬件市场规模快速增长  \n\n（资料来源：Statista、华安证券研究所）\n\n### 游戏和数字货币\n\n\
    从经济视角来看，每一款游戏都是“体验+消费”，而符合元宇宙特征的游戏，还要增加“创造”一词。创造和消费也就促进了基础的价值循环。更进一步，现代所有的游戏，都是一个“虚拟的经济体”，在游戏营造出的虚拟世界中，都需要“消费”通行的“货币”。“氪金”作为网络的流行语，在游戏中，是指向游戏中“充值”的行为。\n\
    \n事实上，拥有“氪金”的游戏，就是一个独立的经济体。\n\n游戏的商业模式，也经历了几个变迁过程。最初，游戏和其他软件销售一样，销售游戏光盘，玩家一次付费，终身使用。游戏有着和其他物品类似的商品属性。卖游戏就像是卖书一样。\n\
    \n盛大代理《传奇》是一个里程碑，开始了游戏点卡充值的时代。人们不再像卖书一样卖游戏了，而是变成按时长收费，时间不够了要充值。这个阶段很短，很快过渡到卖道具的阶段。\n\
    \n也就是说，游戏不收费，不设时间限制，可以任意玩儿，但是如果你需要一件新的“宝贝”或者新的“衣服”（皮肤），就得花钱购买。充值，就成了玩家的常态，甚至引申出“氪金”这个颇具朋克色彩的网络流行语。现在，很少能找到没有“氪金”的游戏。\n\
    \n游戏的商业模式发展到这个阶段，其实还是用户方面的消费行为。只是从一次性付费，变成持续性付费。充值后，也没有“退款”选项。玩家和游戏厂商都默认玩家早晚会消费掉所有“氪金”。\n\
    \nRoblox做出了一个大胆的创新，就是用户充值后可以取现。这是一个石破天惊的举动，就算是在金融创新、金融衍生品令人眼花缭乱的美国，也是颇具争议的行为。这给金融监管带来一个很严肃的话题：如果涉嫌洗钱该如何处理？这个话题，我们将在第五章继续讨论。\n\
    \n在Roblox中充值可以取现的规则，就和我们出国换外币一样。去其他国家旅行，机场往往有一个货币兑换的柜台，可以把人民币换成其他国家的货币。如果去越南，就换成越南盾，去美国就换成美元。回国的时候，再把越南盾或者美元换成人民币。货币兑换是有手续费的，以此限制大家不能兑换太多。就算有人财大气粗，不在乎那点手续费，还有总额限制，并且单次也不能兑换过多。\n\
    \n每个国家都有自己的货币，无论国家大小，货币是一个国家主权的象征。如果一个国家没有自己独立的货币，则根本称不上是一个独立的国家，一定是某个大国的附庸，徒具国家之名而已。\n\
    \n有了统一的货币，就算不是一个国家，也会成为联系紧密的经济体。欧元就是现实的例子，但是，把千年以来就互相独立的国家统一成一个国家，难度太大。他们退而求其次，先把货币统一，这就有了欧元。\n\
    \nRoblox内部发行了Robux货币，为了行文方便，我们简称它为“萝卜币”。在游戏中购买道具，只能使用“萝卜币”。在游戏中制造道具，可以出售。这样玩家在游戏中可以赚“萝卜币”。退出游戏时，可以把“萝卜币”换成美元。\n\
    \n有了“萝卜币”，Roblox就像一个经济体一样运行。人们进入Roblox，不再是单纯的消费行为。有些人进入Roblox是为了谋生，这些人是Roblox中的创造者，他们可以设计出新的“皮肤”，卖给其他玩家，玩家用“萝卜币”支付，卖家也可以随时把“萝卜币”换成美元。如此一来，有买有卖的经济行为产生了，一个虚拟世界的经济体形成了。\n\
    \n“萝卜币”，展示了元宇宙经济的雏形。\n\n熟悉比特币、以太坊的读者，可能会问：“这不就是ETH吗？”的确，利用以太坊的技术，可以实现“萝卜币”。如果只是在Roblox中使用萝卜币，也可以采用其他技术来实现。\n\
    \n具备元宇宙特征的游戏，天然形成了数字货币的应用场景。这是传统的货币系统无法支持的领域。随着元宇宙爆炸式地增长，数字货币总交易量飞速上涨。\n\n以太坊是基础的数字货币，可以成为元宇宙的通行货币。元宇宙提供了以太坊货币的应用场景，以太坊货币可以进一步促进元宇宙的爆发。\n\
    \nDC/EP（央行数字货币）是基础的数字货币，或说DC/EP本身也可以成为元宇宙的通行货币。它们之间同样是相互促进的关系。\n\n## 传统产业数字化发展之路，需融入元宇宙要素\n\
    \n对于传统产业数字化转型这个宏大的话题，本书不作展开。本部分简要提示元宇宙对于数字化转型的启示。\n\n### 从信息化到数字化\n\n很多咨询公司的从业者，往往纠结于一个问题，就是信息化和数字化的区别。这也难怪，咨询顾问面对客户的时候，他们不得不回答这个问题。难道以前建设的信息系统不香了？现在，信息系统变成了“数字”系统，人们还得多花钱。到底数字化解决了哪些信息化没有解决的问题？\n\
    \n对于信息化和数字化的差别如图3-5所示。\n\n区分信息化、数字化的关键在于区分决策是在物理世界还是数字化世界完成的。如果决策是在数字化世界完成，那就是数字化，如果决策是在物理世界完成，那就是信息化。这里的决策，是指导物理世界中执行下一个“动作”的指令。\n\
    \n![](Images/image00177.jpeg)\n\n图3-5　从信息化到数字化[^(\\[1\\])](#part0022.xhtml#comment_9163)\n\
    \n### 从数字化到元宇宙\n\n元宇宙更彻底，它没有物理世界，全部是数字世界。就像《头号玩家》的玩家们戴上VR头盔的一瞬间，就会感觉如同穿越虫洞一样，进入另一个宇宙。所有的活动，包括生产活动，都是在数字世界中完成的。\n\
    \n物理世界中，人如同“躯壳”般的存在，只要满足“躯壳”必需的空气、水和营养，躯壳身在何方，处于什么境地，无关紧要。最极端的情况在《黑客帝国》中揭示得淋漓尽致。人成为“Matrix”的能量来源，所有人生活在密封的罐子里，而每个人的“化身”都在Matrix中工作、生活、恋爱、生子，直到被Neo发现了真相。\n\
    \n### 理解数字孪生\n\n2003年，迈克尔·格里夫斯（Michael Grieves）教授在密歇根大学的产品全生命周期管理课程上，首次提出了“与物理产品等价的虚拟数字化表达”的概念，并给出定义：一个或一组特定装置的数字复制品，能够抽象表达真实装置，并可以此为基础进行真实条件或模拟条件下的测试。教授希望可以将所有的数据放在一起进行更高层次的分析。\n\
    \n2011年，Michael Grieves教授在《几乎完美：通过产品全生命周期管理驱动创新和精益产品》中引用了其合作者约翰·维克斯（JohnVickers）描述概念模型的名词——数字孪生（Digital\
    \ Twin），并一直沿用至今。[^(\\[2\\])](#part0022.xhtml#comment_9298)\n"
  trans: "\n\n19 世纪的英国有着广阔的地理空间，贸易量和商品配送需求大规模增长，自然而然带动了其他领域的工业革命，产生了煤炭、钢铁、蒸汽机、电报，以及公路、铁路、轮船等运输工具。\n\
    \n一旦劳动分工形成，需求和供给便相互分离且不断细分。需中有供、供中有需，俨如“阴阳”，相辅相成。一方面，市场需求和供给双方随即也会开展一场相互创造、相互追赶的竞赛，各自的发展螺旋式上升。机械化的每一步都提高了生产规模，并且更大的生产规模就需要更大的市场来消费。换句话说，生产能力的每次扩展，需要更多的需求来吸收，从而激发资本家进入新的大陆，创造新的市场。另一方面，市场的每一次扩展都会使得新一轮的机械化有利可图。同时，一个领域的机械化变革，会使相关产业产生类似的需求和激励。增长带来更多的增长，扩张导致更大的扩张。\n\
    \n第一次工业革命对于能源的需求，刺激了第二次工业革命的到来，我们至今仍在享受工业革命的成果。\n\n棉花纺织业作为工业革命的先导产业，拥有几个特征：第一，行业空间足够大。第二，行业需求无上限。第三，产业链条足够长，可以引起变革的连锁反应。第四，需要的技术多，可以促使技术成熟，产生外溢效应。\n\
    \n其实，早在英国第一次工业革命之前，荷兰造船业的分工就已经足够细致。但是，当时的造船业不足以开拓巨大的市场，先进的造船业只能培育出优秀的工匠。如果想要引发工业革命连锁反应的浪潮，造船业显然力不从心。尽管在\
    \ 17 世纪，荷兰就已经雄踞世界，国力压过英国一头，但是担负第一次工业革命使命的国家，还是英国。历史注定选择棉纺织业作为第一次工业革命的先导产业，而不是渔业等产业。\n\
    \n## 游戏孕育了元宇宙\n\n任何大的时代变迁，都有现象级的行业发展，形成示范效应。棉纺织产业的特征几乎和现代游戏产业的特征一模一样。\n\n首先，产业空间大。2020\
    \ 年 12 月 17 日，中国游戏产业年会现场，中国音像与数字出版协会第一副理事长张毅君公布了《2020 年中国游戏产业发展状况》。从几年的大数据来看，游戏行业依然保持着高速增长，2020\
    \ 年的总收入为 2786.87 亿元，比 2019 年增加了近 500 亿元，用户数量也在稳定增长。这说明，和所有人都有保暖避寒的需求一样，所有人也都有娱乐休闲的精神需求。\n\
    \n其次，消费弹性空间大。爱美的女士，可以一天换一件衣服。常有消费主义者鼓吹“美女的衣橱中永远少一件合适的衣服”这种说法。游戏也一样，人们总是喜欢尝鲜，体验不一样的东西。需求几乎是没有上限的。\n\
    \n再次，产业链条长。棉纺织业上游有着棉花种植、采摘、轧棉、纺纱、织布、印刷和印染等环节。游戏软件包括设计、开发、发行；硬件包括主机、芯片、操作系统。此外，还有通信，包括\
    \ 5G、光纤等。\n\n最后，对相关产业的带动性非常强。棉纺织业带动了上游的农作物种植、机械制造、运输、化工等产业。游戏玩家都深有体会的是，游戏硬件总是跟不上游戏的需求，需要更好的\
    \ 3D 引擎、CPU（中央处理器）、GPU（图形处理器）、显示屏、VR 和 AR 等。\n\n作为元宇宙的雏形，大型游戏一般都具备如下五个特征。\n\n\
    （1）基础的经济系统：游戏中建立了和现实世界相似的经济系统，用户的虚拟权益得到保障，用户创造的虚拟资产可以在游戏中流通。\n\n（2）虚拟身份认同强：游戏中的虚拟身份具备一致性、代入感强等特点，用户在游戏中可以以虚拟身份进行虚拟活动。游戏一般依靠定制化的虚拟形象和形象化的皮肤，以及形象独有的特点让用户产生独特感与代入感。\n\
    \n（3）强社交性：大型游戏都内置了社交网络，玩家可以及时交流，既可以用文字沟通，也可以语音，甚至可以视频。\n\n（4）开放自由创作：游戏世界包罗万象，这离不开大量用户的创新创作。如此庞大的内容工程，需要开放式的用户创作为主导。\n\
    \n（5）沉浸式体验：游戏作为交互性好、信息丰富、沉浸感强的内容展示方式，将作为元宇宙最主要的内容和内容载体。同时，游戏是 VR 虚拟现实设备等最好的应用场景之一。凭借\
    \ VR 技术，游戏能为用户带来感官上的沉浸体验。\n\n国盛证券研究报告从开放自由创作、沉浸式体验、经济系统、虚拟身份及强社交性方面分析了 Roblox、Decentraland、Soul、《我的世界》《魔兽世界》《堡垒之夜》《王者荣耀》这些项目与元宇宙概念的关系[^(\\\
    [2\\])](#part0020.xhtml#comment_7844)。报告显示，Roblox 的玩家在创作游戏时具备极高的自由度，平台具备全面且与现实经济互通的经济系统。虚拟资产和虚拟身份可以在游戏内容间互通，创作者可以在自己游戏中设计商业模式。Roblox\
    \ 的模式已经可以看出元宇宙的雏形。《我的世界》在开放自由创作方面接近元宇宙，而在其他方面较有差距。《魔兽世界》在虚拟身份代入感、社交性和体验感方面都靠近元宇宙概念。《堡垒之夜》具有很高的人气。Decentraland\
    \ 在经济系统上更为接近元宇宙的形式。《王者荣耀》具备一定的虚拟社交属性，但与元宇宙的概念差别较大。Soul 只在社交性和虚拟身份方面与元宇宙的概念有些许关联。\n\
    \n元宇宙的基本特征，在游戏世界中得到精彩的展现和诠释，但是并没有一款游戏能完全达到理想的元宇宙状态。从这点来讲，游戏不过是元宇宙的雏形，但是从游戏角度出发，我们可以充分理解元宇宙。\n\
    \n* * *\n\n注释：\n\n[\\[1\\]](#part0020.xhtml#commentRef_7558)文一.伟大的中国工业革命——发展政治经济学一般原理批判纲要［M］.北京:清华大学出版社，第\
    \ 98 页。\n\n[\\[2\\]](#part0020.xhtml#commentRef_7812)具体请参见国盛证券研究报告《元宇宙：互联网的下一站》。\n\
    \n## 游戏，拉动上游产业的发展\n\n与元宇宙游戏相关的产业链（或说价值链），可以划分为七个方面，自下而上分别是基础设施、人机交互、去中心化、空间计算、创造者经济、渠道和体验（见图\
    \ 3-1）。\n\n![](img/image00171.jpeg)\n\n图 3-1　Metaverse 的七层价值链（资料来源：Roblox 招股书）\n\
    \n基础设施包括 5G 通信、Wi-Fi 6、云计算、芯片工艺、微机电系统、图形处理器等。人机交互包括手机、智能眼镜、可穿戴设备、触觉设备、手势感应装置、声控、脑机接口等。去中心化包括边缘计算、AI、微服务、区块链等。空间计算包括\
    \ 3D 引擎、VR、AR、XR、多任务处理 UI、空间地理制图等。创造者经济包括设计工具、资本市场、工作流程、商业系统。渠道包括广告网络、社交网络、策展、商店、代理商等。体验包括游戏、社交、电子竞技等。\n\
    \n虽然，游戏不过是元宇宙的雏形，但是游戏的发展，全面带动了元宇宙所必需的技术基础和经济系统。这些技术的外溢，甚至是游戏体现的生产关系的外溢，会引起相关产业一系列的变化。我们择其紧要者，略作分析。\n\
    \n### 游戏和 5G\n\n视频之于 4G，就像游戏之于 5G。它们相辅相成，共同促进。事实上，如果缺少游戏对于大带宽、低时延、高并发的相关应用，5G\
    \ 铺设的速度就会越来越慢。毕竟大家只是看个视频，4G 就够用了。业界曾认为，自动驾驶可能是 5G 的“杀手级”应用，可以刺激 5G 的增长。虽然电动汽车越来越多，但是自动驾驶的普及还尚需时日。工业、矿业中\
    \ 5G 应用案例也已经比比皆是，但是仅仅依赖生产中的一些场景来带动 5G 的发展，无疑是非常吃力的。必须是消费级市场的普及型应用，才能拉动 5G 产业。\n\
    \n游戏，成了 5G 应用的重要选择。\n\n“真 VR”需要 5G。\n\n影响用户体验的主要是视频分辨率、帧率、头部 MTP 时延、操作响应时延和肢体\
    \ MTP 时延等，其中后三者的体验可以通过芯片算力提升、传感器优化、数字接口优化和操作系统优化等实现，而分辨率和帧率等因素主要影响用户临场感、逼真度和眩晕感，这些参数与图像渲染和视频质量有关。\n\
    \n只有当 VR 达到 16K 之后，肉眼才察觉不到纱窗效应，也就是接近肉眼的“完全沉浸感”。16K 像素点约 1.3 亿，如果以 24 真彩色为标准，默认\
    \ 140 Hz FPS 下，每秒的原生视频流量达到惊人的 138 Gbps。因此，随着 VR 硬件的提升，如果我们要摆脱有线的束缚，必须探索大带宽低时延的无线网络及高效的视频压缩算法。\n\
    \n根据华为报告测评，在水平视域 110 度，自由度 6 DOF，视频基于 H.264 编码下，单眼 1.5K、FPS 60 为“入门级”水平，这时需要的带宽是\
    \ 25 Mbps。而单眼 2K 和帧率 90，将作为未来的体验提升目标，这时需要的带宽是 153 Mbps。而如果用户体验达到理想水平，需要达到单眼 6K、帧率\
    \ 90 的水平，此时需要带宽 1.4 Gbps，因此 5G、千兆宽带和 Wi-Fi 6 等下一代接入方式必不可少。\n\n表 3-1　不同单眼分辨率不同帧率对应的平均码率和视频体验得分\
    \  \n\n（资料来源：华安证券研究所《华为云 VR 临场感指数白皮书》）\n\n![](img/image00179.jpeg)\n\n在 5G 方面，根据爱立信移动报告，2021\
    \ 年全球 5G 用户渗透率大概能达到 10%，至少到 2025 年，5G 渗透率达到 40%左右才有可能看到 VR 室外规模商用。宽带方面，根据网速测试工具\
    \ Speedtest 分析，2021 年一季度全球前十大网速领先国家网速约为 200 Mbps，目前仅能支持 2K、90 FPS 的 VR 体验，千兆宽带的普及具有很大价值。\n\
    \n5G 才能支持“云游戏”\n\n云游戏是一种以云计算和串流技术为基础的在线游戏技术，其游戏的逻辑和渲染运算都在云端完成。数据处理完成后，结果被编码成音频流、视频流，通过网络传输给终端，终端则将用户的操作信息传输给云端，进行实时交互。云游戏支持用户使用随身携带的移动设备随时随地享受\
    \ 3A 级游戏大作的极致体验，打通大型游戏的终端壁垒。而其中延迟程度的高低将直接影响云游戏的用户体验，因此网络显得尤为重要。伴随着 5G 技术的成熟，云游戏最关键的网络问题迎刃而解。\n\
    \n一些大型的桌游对硬件的配置要求很高。普通的办公用笔记本根本无法满足大型游戏的需求。随着 5G 的发展，我们现在可以把大量的计算放在云端完成，电脑端只需要显示网络传输的画面即可，这就大大降低了对于电脑的配置要求。甚至在手机和平板电脑上，我们也可以玩大型游戏。\n\
    \n云游戏主要有五个核心技术：GPU 服务器、虚拟化、音视频技术、实时网络传输和边缘计算。目前各核心技术均已趋于成熟。\n\n### 游戏和 VR\n\n\
    需要 VR/AR 设备在用户体验方面不断进步\n\n2018 年，美国一项针对专家的调研显示，在影响 AR 和 VR 普及的各类因素中，用户体验被视为最主要的因素。选择这两项的受访者占比分别达到\
    \ 39%和 41%（见图 3-2）。如果设备性能不过关，用户体验感就会大打折扣。作为未来进入元宇宙的第一入口，AR 和 VR 目前仍须在软硬件上不断做出优化。\n\
    \n![](img/image00188.jpeg)\n\n图 3-2　用户体验是影响 AR/VR 普及的主要瓶颈  \n\n（资料来源：eMarketer、华安证券研究所）\n\
    \n以 VR 设备为例，目前主流产品类型包括 VR 手机盒子、VR 头显和 VR 一体机。市面上 VR 设备的分辨率最高支持到 4K。如上所述，若要达到人眼最自然的清晰度，则需要\
    \ 16K 的水平。高刷新率可以提高画面的流畅度，减少延迟和重影，一定程度上减轻人们使用 VR 设备时产生的眩晕感。最理想的刷新率是 180Hz，而目前大部分\
    \ VR 头显刷新率为 70Hz 至 120Hz。\n\n对于轻便性需求，刺激无线串流技术发展\n\n为了实现 VR 头显的轻便，并解决空间移动问题，无线串流是\
    \ VR 产品设计须着力解决的方向。目前主流的无线串流技术主要是 Wi-Fi 和私有协议，前者将 PC（个人计算机）的 GPU 渲染并压缩过的数据通过 Wi-Fi\
    \ 路由器传送至头显，通常需要千兆路由器才能有比较流畅的体验。由于技术的不成熟，目前存在额外延迟、画质损耗、高性能消耗及其他不稳定因素。后者是通过设备厂家自己研发的压缩算法和通信协议进行传输。例如，使用\
    \ VIVE 无线套件及 WiGig 配件，可以让我们实现电脑和 VR 头显延迟小于 7ms，但需要架构额外的 WiGig 加速卡，增加了用户的成本。\n\n\
    表 3-2　主要 VR 内容平台概况  \n\n（资料来源：映维网、VR 陀螺、青亭网、搜狐网、华安证券研究所）\n\n![](img/image00151.jpeg)\n\
    \n在游戏的带动下，VR/AR 出货量持续攀升（见图 3-3），全球 VR 硬件市场规模快速增长（见图 3-4）。\n\n![](img/image00160.jpeg)\n\
    \n图 3-3　2020—2025 年 AR/VR 头显出货量 CAGR 53%  \n\n（资料来源：Trendforce、华安证券研究所）\n\n![](img/image00169.jpeg)\n\
    \n图 3-4　2020—2022 全球 VR 硬件市场规模快速增长  \n\n（资料来源：Statista、华安证券研究所）\n\n### 游戏和数字货币\n\
    \n从经济视角来看，每一款游戏都是“体验+消费”，而符合元宇宙特征的游戏，还要增加“创造”一词。创造和消费也就促进了基础的价值循环。更进一步，现代所有的游戏，都是一个“虚拟的经济体”，在游戏营造出的虚拟世界中，都需要“消费”通行的“货币”。“氪金”作为网络的流行语，在游戏中，是指向游戏中“充值”的行为。\n\
    \n事实上，拥有“氪金”的游戏，就是一个独立的经济体。\n\n游戏的商业模式，也经历了几个变迁过程。最初，游戏和其他软件销售一样，销售游戏光盘，玩家一次付费，终身使用。游戏有着和其他物品类似的商品属性。卖游戏就像是卖书一样。\n\
    \n盛大代理《传奇》是一个里程碑，开始了游戏点卡充值的时代。人们不再像卖书一样卖游戏了，而是变成按时长收费，时间不够了要充值。这个阶段很短，很快过渡到卖道具的阶段。\n\
    \n也就是说，游戏不收费，不设时间限制，可以任意玩儿，但是如果你需要一件新的“宝贝”或者新的“衣服”（皮肤），就得花钱购买。充值，就成了玩家的常态，甚至引申出“氪金”这个颇具朋克色彩的网络流行语。现在，很少能找到没有“氪金”的游戏。\n\
    \n游戏的商业模式发展到这个阶段，其实还是用户方面的消费行为。只是从一次性付费，变成持续性付费。充值后，也没有“退款”选项。玩家和游戏厂商都默认玩家早晚会消费掉所有“氪金”。\n\
    \nRoblox 做出了一个大胆的创新，就是用户充值后可以取现。这是一个石破天惊的举动，就算是在金融创新、金融衍生品令人眼花缭乱的美国，也是颇具争议的行为。这给金融监管带来一个很严肃的话题：如果涉嫌洗钱该如何处理？这个话题，我们将在第五章继续讨论。\n\
    \n在 Roblox 中充值可以取现的规则，就和我们出国换外币一样。去其他国家旅行，机场往往有一个货币兑换的柜台，可以把人民币换成其他国家的货币。如果去越南，就换成越南盾，去美国就换成美元。回国的时候，再把越南盾或者美元换成人民币。货币兑换是有手续费的，以此限制大家不能兑换太多。就算有人财大气粗，不在乎那点手续费，还有总额限制，并且单次也不能兑换过多。\n\
    \n每个国家都有自己的货币，无论国家大小，货币是一个国家主权的象征。如果一个国家没有自己独立的货币，则根本称不上是一个独立的国家，一定是某个大国的附庸，徒具国家之名而已。\n\
    \n有了统一的货币，就算不是一个国家，也会成为联系紧密的经济体。欧元就是现实的例子，但是，把千年以来就互相独立的国家统一成一个国家，难度太大。他们退而求其次，先把货币统一，这就有了欧元。\n\
    \nRoblox 内部发行了 Robux 货币，为了行文方便，我们简称它为“萝卜币”。在游戏中购买道具，只能使用“萝卜币”。在游戏中制造道具，可以出售。这样玩家在游戏中可以赚“萝卜币”。退出游戏时，可以把“萝卜币”换成美元。\n\
    \n有了“萝卜币”，Roblox 就像一个经济体一样运行。人们进入 Roblox，不再是单纯的消费行为。有些人进入 Roblox 是为了谋生，这些人是 Roblox\
    \ 中的创造者，他们可以设计出新的“皮肤”，卖给其他玩家，玩家用“萝卜币”支付，卖家也可以随时把“萝卜币”换成美元。如此一来，有买有卖的经济行为产生了，一个虚拟世界的经济体形成了。\n\
    \n“萝卜币”，展示了元宇宙经济的雏形。\n\n熟悉比特币、以太坊的读者，可能会问：“这不就是 ETH 吗？”的确，利用以太坊的技术，可以实现“萝卜币”。如果只是在\
    \ Roblox 中使用萝卜币，也可以采用其他技术来实现。\n\n具备元宇宙特征的游戏，天然形成了数字货币的应用场景。这是传统的货币系统无法支持的领域。随着元宇宙爆炸式地增长，数字货币总交易量飞速上涨。\n\
    \n以太坊是基础的数字货币，可以成为元宇宙的通行货币。元宇宙提供了以太坊货币的应用场景，以太坊货币可以进一步促进元宇宙的爆发。\n\nDC/EP（央行数字货币）是基础的数字货币，或说\
    \ DC/EP 本身也可以成为元宇宙的通行货币。它们之间同样是相互促进的关系。\n\n## 传统产业数字化发展之路，需融入元宇宙要素\n\n对于传统产业数字化转型这个宏大的话题，本书不作展开。本部分简要提示元宇宙对于数字化转型的启示。\n\
    \n### 从信息化到数字化\n\n很多咨询公司的从业者，往往纠结于一个问题，就是信息化和数字化的区别。这也难怪，咨询顾问面对客户的时候，他们不得不回答这个问题。难道以前建设的信息系统不香了？现在，信息系统变成了“数字”系统，人们还得多花钱。到底数字化解决了哪些信息化没有解决的问题？\n\
    \n对于信息化和数字化的差别如图 3-5 所示。\n\n区分信息化、数字化的关键在于区分决策是在物理世界还是数字化世界完成的。如果决策是在数字化世界完成，那就是数字化，如果决策是在物理世界完成，那就是信息化。这里的决策，是指导物理世界中执行下一个“动作”的指令。\n\
    \n![](img/image00177.jpeg)\n\n图 3-5　从信息化到数字化[^(\\[1\\])](#part0022.xhtml#comment_9163)\n\
    \n### 从数字化到元宇宙\n\n元宇宙更彻底，它没有物理世界，全部是数字世界。就像《头号玩家》的玩家们戴上 VR 头盔的一瞬间，就会感觉如同穿越虫洞一样，进入另一个宇宙。所有的活动，包括生产活动，都是在数字世界中完成的。\n\
    \n物理世界中，人如同“躯壳”般的存在，只要满足“躯壳”必需的空气、水和营养，躯壳身在何方，处于什么境地，无关紧要。最极端的情况在《黑客帝国》中揭示得淋漓尽致。人成为“Matrix”的能量来源，所有人生活在密封的罐子里，而每个人的“化身”都在\
    \ Matrix 中工作、生活、恋爱、生子，直到被 Neo 发现了真相。\n\n### 理解数字孪生\n\n2003 年，迈克尔·格里夫斯（Michael\
    \ Grieves）教授在密歇根大学的产品全生命周期管理课程上，首次提出了“与物理产品等价的虚拟数字化表达”的概念，并给出定义：一个或一组特定装置的数字复制品，能够抽象表达真实装置，并可以此为基础进行真实条件或模拟条件下的测试。教授希望可以将所有的数据放在一起进行更高层次的分析。\n\
    \n2011 年，Michael Grieves 教授在《几乎完美：通过产品全生命周期管理驱动创新和精益产品》中引用了其合作者约翰·维克斯（JohnVickers）描述概念模型的名词——数字孪生（Digital\
    \ Twin），并一直沿用至今。[^(\\[2\\])](#part0022.xhtml#comment_9298)\n\n"
