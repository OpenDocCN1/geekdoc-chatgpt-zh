- raw: "当然，我们没有办法在元宇宙中建立“政府”，扮演最终裁决者的角色。以区块链为基础的社区自治模式，提供了成本低廉的解决方案。但是这个模式不足以应对人性之恶和创世者之恶。对恶的容忍，就是对善的欺凌。从这个意义上来讲，元宇宙社区自治的模式，依然需要探索前行。在有可行方案之前，需要借鉴电影产业的治理模式。\n\
    \n另外，我们也观察到，类似迈阿密公寓悖论，在元宇宙中同样有发生的可能。既然是创世的宇宙，治理体系就同样在创世之中。\n\n# 06  \n\n抢占超大陆\n\
    \n只要我们能把希望的大陆牢牢地装在心中，风浪就一定会被我们战胜。\n\n——哥伦布\n\n超大陆注定是巨头的游戏，也是巨头之所以成为巨头的唯一标准。元宇宙中将孕育新的超大陆。最可能的两个选手，分别是鸿蒙和以太坊。一个软件万物生，一个数字万物生。\n\
    \n超大陆是元宇宙的基础设施，包括物理层、软件层、数据层、规则层和应用层。五个层次相互影响，相互促进，共同进化。\n\n当我们暂时离开元宇宙，审视传统产业升级和数字化转型，发现它们同样需要建立自己的超大陆，需要从产业层面去思考企业。它们的超大陆就是生态运营平台——EOP。\n\
    \n天无私覆、地无私载。大地是万物之母。创世总是伴随新大陆的发现。盘古开天辟地，轻而清者上升为天，重而浊者下沉为地，盘古与天地同生。近代哥伦布发现的新大陆，为欧洲的扩张奠定了空间基础。几个世纪以来世界格局变幻，肇始于大航海时代新大陆的发现。\n\
    \n超大陆是地理名词，指拥有多个大陆核的地质构造。亚欧大陆是超大陆，拥有亚洲陆核和欧洲陆核，在古老漫长的地质年代中，碰撞融合在一起，形成现代地球的陆洋格局。\n\
    \n在元宇宙中借用超大陆的概念，代指那些提供了元宇宙基本要素的平台，包括数字创造、数字资产、数字交易和数字消费。囊括这四个要素的平台，就是元宇宙的超大陆。超大陆绝非学术名词，并不严谨，但是指出了巨头争霸的方向。成为元宇宙霸主的，必定是超大陆的创立者。就像iOS之于苹果，安卓之于谷歌。在应用软件中，微信是图文时代的超大陆，抖音则是短视频时代的超大陆。元宇宙时代，又会诞生新的超大陆。在数字世界中，以太坊最具超大陆特征。游戏中，Roblox的平台，可以归入超大陆的行列。\n\
    \n## 超大陆的边缘就是数字市场的边界\n\n人们的创造力是无限的，只是缺少合适的舞台。人们的需求同样是没有止境的，只是缺少被满足的工具。\n\n###\
    \ 李家有女，人称子柒\n\n李子柒，一个普通的农家女孩，1990年出生。因为家庭关系，她十几岁便开始到城市中漂泊、打工。她露宿过公园的椅子，也曾连续吃了两个月的馒头。在做服务员的时候，一个月的工资只有300元人民币。后来她开始学习音乐，找到了一份在酒吧打碟的工作。为了照顾生病的奶奶，她不得不返回家乡。回到家乡的那一年，她才刚刚22岁。在城市漂泊的8年，她就像大多数M世代一样，对于网络有天生的痴迷。回到家乡之后，照顾奶奶之余，如何谋生成了摆在李子柒面前的头号问题，于是李子柒开起了淘宝店，勉强度日。\n\
    \n为了让淘宝小店的生意更好做，她从2015年开始拍摄一些短视频，风格以无厘头、搞笑为主。摸索了一段时间之后，转而拍摄自己真正拿手的东西，比如做饭。\n\n\
    转折发生在2016年，新浪微博推出了扶持内容原创者计划，李子柒成为受益者之一。为了拍摄短视频《兰州牛肉面》，李子柒特意前往兰州拜师学习了一个月的拉面手艺，该视频的全网播放量最终突破了5000万，点赞超过60万。\n\
    \n2018年1月，李子柒的原创短视频在海外运营3个月后获得了视频平台YouTube的白银创作者奖牌，粉丝数突破100万，她也被国外网友称为“来自东方的神秘力量”。其发布的《汉妆》《面包窑》《芋头饭》等作品在脸书也获得了数百万的播放量；7月，其创作的短视频《番茄牛腩汤》播出；8月17日，李子柒的天猫旗舰店正式开业，并推出了五款美食商品；10月，她的短视频作品在YouTube的订阅数达到100万，并获得了烁金创作者奖牌。\n\
    \n2020年4月29日，其在YouTube平台上的粉丝数量突破1000万，并成了首个粉丝破千万的中文创作者，李子柒因1140万的YouTube订阅量被列入《吉尼斯世界纪录大全2021》，成为“最多订阅量的YouTube中文频道”的纪录保持者。\n\
    \n短视频成就了李子柒，如果没有微博、YouTube等平台，李子柒可能到现在也只是一个普普通通的孝顺姑娘。\n\n### 李子柒背后的平台力量\n\n在电视机时代，我们无法想象李子柒的故事。电影幕布上也不会给一个农家姑娘做饭的视频留出播放时间。正是智能手机的普及、4G网络的建设、微博、YouTube、抖音这样的发布平台，给了普通人展示自己的舞台。\n\
    \n抖音日活数据峰值达到7亿，这是李子柒获得2.1亿次点赞的基础。\n\n开放的平台+用户的创造，迸发出了不可思议的力量。这个力量，正在改变世界。\n\n\
    抖音平台上像李子柒这样的创作者有2200万人，抖音公布的数据则更为具体。2021年3月8日，抖音发布《2021抖音女性数据报告》（以下简称“报告”）。报告显示，过去一年，抖音女性用户发布了2135万条恋爱视频，也有5306万条视频关于工作，直接从平台获得收入的女性达1320万人。例如，四川创作者“蜀中桃子姐”、宁夏非遗皮雕手艺人乔雪，都是通过抖音开启新事业的典型代表。\n\
    \n埃森哲调查数据显示，中国拥有近4亿年龄在20至60岁的女性消费者，其每年掌控着高达10万亿人民币的消费支出。\n\n像李子柒这样的女性创作者，在抖音上有1300多万人，如果把男性也计算在内，这个数字还需要翻倍。\n\
    \n### 再谈数字市场的边界和限制\n\n在现实的物理世界中，若想构筑规模宏大的统一市场，还存在很多制约因素，有硬约束，也有软约束。\n\n硬约束如道路、桥梁等。连道路都不通的地方，肯定不会产生市场。道路不通，人与人就不能见面，则不会产生商品交换，更遑论交易了。道路的尽头就是市场的边界。\n\
    \n软约束同样重要。幸好在两千多年以前，秦始皇就解决了很多软约束方面的问题，如统一的文字、统一的度量衡、统一的车轨宽度、统一的税收标准等。软约束其实就是不断消减达成交易的成本。\n\
    \n同样地，在数字世界中，光纤的尽头就是数字市场的边界。光纤带宽与车道有相似之处。不同的带宽，制约了不同类型的数字市场。在2G网络时代，以视频为载体的电商，无论如何都是不能发展的。\n\
    \n这就看出了基础设施的重要性。数字市场，需要大规模的数字化基础设施的投入。\n\n市场从来都是昂贵的，无论是其建设成本还是保持其正常运营的成本。人类需要进行物品交换，才能维持基本的生活，但是要想让交换物品变成集市，从集市变成交易中心，则需要付出大量的成本。从农产品到工业品，再到数字产品，需要的市场机制越来越复杂，需要的市场规模越来越大。\n\
    \n通常来看，在物理世界，跨越时空总是得付出交通的成本，这其实是交易成本的一部分。《元史》讲道：“百里之内，供二万人食，运粮者须三千六百人。”这句话的意思是，仅仅百里之内的运输距离，如果要供给2万人吃饭，光运粮者就需要3600人。元朝粮食运输还是停留在“畜力”阶段。以这样的历史条件建立大规模的市场，是难以想象的。\n\
    \n现代，经过了以蒸汽机、内燃机为动力的轮船、汽车等运输工具的革新，才具备建立国际性大市场的基础条件。\n\n数字世界超越了时空的限制，没有远距离运输之苦，却增加了技术限制。不同的技术标准、不同的操作系统、不同的运作平台，事实上造成了数字市场的割裂。数字市场的割裂程度，比现实世界的割裂程度有过之而无不及。\n\
    \n不同的电商平台，是自由竞争的结果，但是逼迫品牌商二选一，就是割裂市场的行为。苹果App Store和安卓应用市场，不但相互割裂，甚至程序不能互通。开发者必须为苹果和安卓开发不同的应用程序。玩家在游戏中千辛万苦获得装备，换成另外一个操作系统，所有的数字财产也就归零了。\n\
    \n造成数字市场割裂的最核心的制约因素，就是平台——提供数字创造、数字资产、数字市场、数字消费能力的基础设施。我们在多大能力上，建设统一的平台，就能创造多大规模的数字市场。\n\
    \n### 创新从何而来？\n\n混沌的边缘往往是创新开始的地方。按照系统论的观点，创新是“涌现”出来的。人类大脑的想法如潮头，起伏涨落，无一时之停歇，创新亦如是。涌现、共振、突变是产生创新的机制。\n\
    \n我们很难预测具体的创新，它带有非常大的偶然性，但是在宏观上，创新又是可以培育的，当系统中不同要素聚合成本足够低的时候，创新总是会大概率地涌现出来。从这个意义上来讲，创新就是必然的。\n\
    \n因此，培育创新，就是想方设法降低系统中要素聚合、分散的成本，提供统一的平台让大家用同一种技术语言交互，就是创新的基本要素，或者基础设施。\n\n一个典型模式就是平台+UGC，这是释放个人创造力的最佳模式。苹果就是借助这个模式在一夜之间会聚了成千上万名程序员，为苹果手机开发应用，迅速在手机功能多样性方面呈现对诺基亚的碾压之势。抖音平台上，所有的视频都是用户创造的，其丰富程度，远远超过电影公司花大价钱拍摄的电影。\n\
    \n或许，这就是数字时代的人民战争吧。\n\n创建大规模的数字市场，进入瑰丽奇幻的元宇宙世界，需要简单易用的创造工具，彻底释放人们的创造力、想象力。需要统一的“平台”，让人们一次创造，跨“宇宙”通用，把数字产品变成货真价实的数字资产，需要消除不同市场的技术壁垒，技术要统一、规则要统一。因此，元宇宙的繁荣，同样依赖基础设施建设，尤其是数字基础设施。\n\
    \n## 元宇宙的新基建[^(\\[1\\])](#part0037.xhtml#comment_14778)\n\n元宇宙是数字经济中最活跃、最具代表性的部分，也是数字化的基础设施发展到一定程度之后的必然产物。推动元宇宙发展，需要新型数字基础设施。基础设施的外部性，将会促进物理世界数字经济发展，加速向数字社会过渡。游戏展示了元宇宙的雏形，元宇宙展示了数字社会的形态。\n\
    \n元宇宙技术基础、经济要素、基本特征，逐层剖析五层级元宇宙基础设施模型，建立在以下三个假设之上。\n\n假设一：元宇宙基础设施具有层次性。基础设施也是不断迭代发展的，在不同的发展阶段，基础设施的重点也不尽相同，形成了不同的层级。在传统基础设施的地基上，某些热点领域往往会衍生出新型的具有公共品属性的服务，随着服务范围扩大、服务对象增多，这些新型服务成为基础设施的一部分。对于不同层级的划分和理解，有利于说明彼此间的关系。因此，划分基础设施的层级，对于发现基础设施的发展规律和政策制定而言至关重要。\n\
    \n假设二：元宇宙基础设施不仅仅是硬件范畴。例如，微信已经成为大家日常生活的一部分，不仅具备社交功能，而且已经成为商务应用和公共管理的工具（广东省市民服务的“粤省事”小程序）。海外版抖音成为新的创意和思想传播的载体。因此，必须紧紧抓住公共品、外部性两个基本特征，我们才能定义新型基础设施的全貌。\n\
    \n假设三：元宇宙基础设施代表技术融合应用的发展方向。基础设施往往是多种技术融合形成的创新应用。例如，网约车App已经成为人们出行的必备工具，它是在4G网络、电子地图、定位系统、智能手机都已经广泛普及的情况下产生的。网约车App，同样集成了LBS（Location\
    \ Based Service，基于位置的服务）、人工智能、大数据等多方面的技术，成为人们网络生活的一部分。而Roblox则需要3D引擎、VR设备、空间计算等技术的融合。\n\
    \n元宇宙五层级基础设施模型是探索元宇宙整体认知的基石之一，也是数字经济理论体系的核心组成部分。\n\n### 数字经济基础设施的五层级\n\n元宇宙的基础设施总共划分为五层，自下而上依次是物理层、软件层、数据层、规则层、应用层（见表6-1）。这五个层级，并不是机械、僵化地划分，而是基于认识的方法论。物理层侧重硬件，软件层侧重广泛应用的软件，数据层进一步抽象，是重要的资产和新型生产要素，规则层则强调数字经济内在运行秩序。这四个层级逐层抽象，相辅相成，成为元宇宙基础设施的重要组成部分。第五个层级是构建在这四个层级之上的各类应用。尤其需要强调的是，某些应用可以演化成为软件层、数据层或规则层的基础设施。\n\
    \n表6-1　数字经济基础设施框架\n\n![](Images/image00193.jpeg)\n\n### 物理层\n\n所谓物理层是所有元宇宙基础设施中的根基，是产生数据、储存数据、分析数据和应用数据的载体，即装备和设备。从数字经济基础设施的定义来看，它属于公共品服务，具备外部性、公共性的特点。物理层主要分为三大类：传统基础设施数字化、数字化基础设施和人机交互设备。在元宇宙，我们重点关注数字化基础设施和人机交互设备两个子层级。\n\
    \n所谓数字化基础设施指的是各类电子设备，比如5G、物联网、微机电系统、计算中心、边缘计算中心等。5G是数字化基础设施的重要组成部分，为元宇宙、工业互联网、人工智能、远程医疗等我国重点发展的新兴产业提供通信管道支撑，5G与传统产业深度融合，也将催生更多新产业、新业态和新模式。5G建设的内容包括但不限于以下四类：一、机房、供电、铁塔、管线等设施的升级、改造和储备。二、5G基站、核心网、传输等基础网络设备的研发与部署。三、5G新型云化业务应用平台的部署，与新业务以及各种垂直行业应用的协同。四、围绕5G的工业互联网新型先进制造网络环境，包括物联网云、网、端等新型基础设施，围绕车联网的车、路、网协同的基础设施等。根据赛迪智库电子信息研究所《“新基建”发展白皮书》，由5G带动的虚拟现实、云端办公、高清视频等行业应用市场规模将快速上升，预计2025年5G全产业链投资将超过5万亿元，为中国抢占全球新一代信息技术制高点奠定坚实的基础。\n\
    \n对于社会整体层面而言，物理层的建设形成了新型基础设施，是建立数字经济基础设施的第一步，同时也是最为基础的根基层建设。\n\n人机交互设备，是人类进入元宇宙的直接介质，包括智能手机、智能眼镜、VR、触觉设备、手势感应装置、脑机接口等，一些新的设备也都在紧锣密鼓地推进中。智能手机普及率已经达到高峰；VR等新型的设备进一步走向成熟，迎来爆发式的增长期；脑机接口是最具科幻色彩的人机交互界面，尚处在原型验证阶段。\n\
    \n### 软件层\n\n基于物理层之上的软件层则是加工、处理、分析数据的主体，包括两个子层级，一个是基础软件，另一个是应用软件。前者指凡是具备大规模应用，具备行业公共属性的软件系统，包含操作系统、数据库、云计算系统、泛在操作系统等，是在新一代信息技术支撑下围绕数字经济各领域、各节点构建的智慧服务平台或系统，具备全面感知、泛在互联、高效应变、灵活处理的特性。应用软件指个体或机构可以使用的各种程序设计语言编制的应用程序的集合，既包括即时通信软件（如微信）和具备行业壁垒的应用软件（如计算机辅助设计、计算机辅助工程、产品数据管理），也包括跨越地域、层级、组织、部门的社会协同平台（如工业运行自动控制系统、生态运营平台），比如EOP（Ecosystem\
    \ Operation Platform，生态运营平台）面向个人的微信、面向企业的ERP等都属于应用软件范畴。另一个比较典型的例子是目前中国特别短缺的辅助设计软件、设计芯片的软件、设计飞机的软件等，这与设计的模块数据紧密相关，不仅具有设计功能，还具有仿真运算能力，是很重要的生产力工具。应用软件如同“桥梁”，是连接数字经济基础设施物理层和现实应用场景的关键环节，通过布局应用软件提升数字化能力，将成为提升企业数字化管理能力、提升智能制造过程管控水平、提升政务系统协同治理效率的关键底层支撑。\n\
    \n科技型企业，尤其是制作通用的软件，如用友、金山、农信互联、阿里云等都是软件层的重要建设者，从应用型企业的角度来讲，越来越多的企业有搭建自己的应用平台的需求，将数据变成公司资产，充分发挥数据的作用，这是一个明显的趋势。从行业层面来讲，每个行业都会形成EOP，形成一个生态运营平台，能控制这个运营平台的企业基本上就能控制这个行业。从宏观社会层面来讲，正所谓“软件定义世界，软件定义一切”，软件无所不能、无所不在，数字化技术支持下的软件的应用对于社会各个领域都将具有重大改进。\n\
    \n### 数据层\n\n物理层和软件层都会产生数据要素，这里将数据层单独剥离出来，它脱离软件层独立存在。数字经济新型基础设施数据层包括“数字孪生”“数联网”以及各类大数据中心，重点解决数据互联互通的问题。\n\
    \n数字孪生是指依据实体对象的物理特性，创造出一个数字化的“克隆体”，其意义在于动态复现实体的历史状态、实时数据和外部环境，能够突破实体在空间和时间上的限制进行高度仿真的实验，未来将重点应用于大型工程的动态设计。例如，最早美国国家航空航天局使用数字孪生对空间飞行器进行仿真分析、检测和预测，辅助地面管控人员进行决策。Michael\
    \ Grieves教授和西门子公司主要使用数字孪生进行产品数据的全生命周期管理。利用数字孪生还可以对产品设计、产品功能、产品性能、加工工艺、维修维护等进行仿真分析。以欧特克公司为代表的工程建设类软件供应商将数字孪生技术应用于建筑、工厂、基础设施等建设领域，把建筑和基础设施看作产品进行全生命周期的管理。北京航空航天大学的陶飞等人从车间组成的角度先给出了车间数字孪生的定义，然后提出了车间数字孪生的组成，主要包括：物理车间、虚拟车间、车间服务系统、车间孪生数据。除此之外，数字孪生在智慧城市建设上也起到了至关重要的作用，利用道路全息扫描数据建立与现实交通相对应的数字交通孪生体，将助力城市的精细化管理。\n\
    \n数联网是国家大数据战略总体工程的基础性示范项目，通过数据标识、挖掘、深度学习等算法和技术，发现物理空间中潜在的联系，从而反作用于物理空间、改善物理空间，满足大数据在国家安全、社会治理、经济发展等方面的应用需求。在数联网里，由于彼此间传输的是标准数据，应用开发模式将发生很大变化，很多个性化大数据应用将出现，不仅为开发者带来利润，也为使用者带来极大的便利。互联网提供基础平台，数联网提供应用。互联网是基础平台，提供基本的通道功能，而数联网要提供加工好的各种数据，提供标准访问总线，实现传输，便于应用共享。数据将以数字孪生或数联网的形式投入现实应用场景，进一步促进云计算、物联网等相关产业的联动，预计2025年将带动市场规模超过3.5万亿元，成为产业边界拓展与融合的催化剂和推动现代服务业变革升级的助推器。\n\
    \n随着区块链技术逐渐发展成为数字经济的核心技术，依托区块链技术推行资产数字化改革势在必行。区块链凭借公信、公开、透明等优势，成为数字货币的底层技术，给支付行业带来深刻变革。数字资产交易如火如荼，而数字资产交易中心是实现数字资产交易的底层平台，将以虚拟电子形式存在的各类数据进行统筹管理，其本质上是大量数据信息的汇集与存储。数字资产交易中心可以利用区块链技术将股权变得“碎片化”，极大降低高科技企业的融资门槛，让大众参与分享高科技企业融资的成果。与此同时，各类大数据中心汇聚了科研领域、政商民生领域和产业领域的海量垂直数据，解决的是数据的储存问题。生物基因、科学实验等数据都是重要的生产要素。根据工信部《全国数据中心应用发展指引》，数据中心机架规模保持33.4%的增速，到2022年将新增220万个机架，预计新增直接投资1.5万亿元。除了政府层面之外，个人、企业等都有自己的数据中心，这些数据中心保证了数据的存储，并为数据的应用提供原始要素。"
