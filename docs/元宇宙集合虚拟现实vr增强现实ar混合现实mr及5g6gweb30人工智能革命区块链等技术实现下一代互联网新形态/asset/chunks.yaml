    [\[1\]](#part0041.xhtml#zhu1)请参见：黑匣.被遗忘的天才：他在 1957 年就制造出了第一台 VR 机器\[Z/OL\].https://www.leiphone.com/category/zhuanlan/aPQEC6l7exN5QScy.html,2016-04-11\[2021-06-21\].


    [\[2\]](#part0041.xhtml#commentRef_17471) Steam 是全球目前最大的游戏发行平台。


    [\[3\]](#part0041.xhtml#commentRef_17931) 这部分的内容，参考了华为子公司的 AR 洞察和应用报告白皮书。


    ## 终端的进步与产业的变革

    终端，对应的英文单词是“terminal”，是一条通信术语，原义是指远离计算主机的输入输出设备；现在泛指与最终用户交互的网络设备。譬如，手机就是典型的终端，而过去的胶片照相机不能算终端，因为没有联网功能。自动驾驶的汽车，也是一种类型的终端。


    终端是通信技术、网络技术、芯片、软件、传感器、制造工艺等各类技术的综合应用，代表了先进的技术和先进的商业模式。


    李书福曾经笑称：“汽车不就是四个轮子的沙发吗？”马斯克也曾经云淡风轻地说：“汽车不就是四个轮子的平板电脑吗？”此后，特斯拉横空出世。汽车自身也进化成为一种新型的终端，开始颠覆传统汽车产业格局。


    VR/AR 都属于一类新型的终端设备，就像特斯拉的出现颠覆汽车产业一样，VR/AR 终端的普及，同样会带来行业的大变革。我们回顾终端的发展历史，从中找出虚拟现实的发展路径。


    理解终端与产业变革，我们从 iPod 开始讲起。


    ### iPod 的丰碑

    `iPod`是便携音乐播放器发展史上的一座丰碑，至今仍无人超越。“苹果公司是先开发了`iPod`还是先开发了`iTunes`软件？”这个问题恐怕连最资深的苹果粉丝也难以回答。


    在 2000 年左右的美国，人们热衷于从`P2P`软件中下载音乐并刻录到 CD 上，但下载软件、刻录软件及刻录机的操作具有一定的门槛，只有发烧级的音乐爱好者才会钻研如何使用这些东西。乔布斯从中看到了巨大的商机，他收购了音乐管理程序`Rio`的创业团队，并用他一贯苛刻的要求使得该产品变得更简单易用，优化用户体验。这款产品就是后来的`iTunes`[^(\[1\])](#part0042.xhtml#comment_18463)。


    有了`iTunes`之后，乔布斯希望能有一个和`iTunes`配套的产品，让用户更轻松地收听音乐，这样`iPod`才被创造出来。事实上是先有`iTunes`，后有`iPod`，这和许多读者的认知恐怕有所不同。`iTunes`创立之初面临着“巧妇难为无米之炊”的困境，而当时的唱片公司日子也不好过，整天在一系列的盗版案件中挣扎。乔布斯凭借其在好莱坞的创业经验和天才的商业头脑，说服了五大唱片公司向其提供数字音乐的销售权。乔布斯计划把每首歌曲的价格定为让人心动的
    99 美分，唱片公司将从中抽取 70 美分。于是`iTunes`商店诞生了，“音乐公司能赢利，艺术家能赢利，苹果公司也能赢利，而用户也会有所收获”的“四赢”商业模式最终被确立起来。`iTunes`商店在推出后的
    6 天内就卖出了 100 万首歌曲，在第一年卖出了 7000 万首歌曲；2006 年 2 月，`iTunes`商店卖出了 10 亿首歌曲；2010 年 2
    月，`iTunes`商店卖出了 100 亿首歌曲。


    在“`iPod`+`iTunes`商店”模式中，人们发现硬件、软件、内容（音乐）首次完美地结合在一起，形成最佳的用户体验。苹果通过大量的`iPod`，控制了音乐发行的渠道，从而引发整个音乐产业的变革（见图
    7-3）。


    ![](img/image00167.jpeg)


    图 7-3　`iTunes`+`iPod`开创了泛互联网化模式的雏形


    在这个模式中，`iPod`作为一款独立的音乐播放设备，非常受人欢迎。同类的`MP3`播放器，跟`iPod`相比就像廉价的山寨货。`iPod`已成为人们收听音乐的首选，没有人在使用`iPod`的时候，还会使用其他播放器。`iPod`客观上具备了音乐门户的特征。


    `iTunes`商店则构建了和唱片公司合作的商业模式，分成比例接近 7:3，唱片公司占大头。在`iTunes`商店中，唱片公司没有盗版的困扰。苹果公司，进一步直接和有才华的音乐人签约，他们可以跳过唱片公司，直接在`iTunes`商店中，发行他们的最新作品。苹果公司取代了唱片公司部分职能，同时通过`iTunes`商店获利的第三方也大大增加，`iTunes`商店已成为一个广受欢迎的音乐发行平台。


    消费者自然众口难调，苹果打破了按照唱片发行的惯例，用户可以购买单独的曲目，不再把好听的歌曲和差的歌曲混在一起强迫消费者购买。把唱片碎片化成单独歌曲，从而最大限度地满足了用户个性化的需求。


    我们可以站在消费者的立场，从数据的角度再来总结“`iPod`+`iTunes`”模式。音乐可以同时保存在`iPod`和`iTunes`中，这两者之间通过“同步”的机制来保持一致性。另外，同步的数据中还包括“播放列表”数据。播放列表就是消费者的“偏好”，这极具个人色彩，每个用户的播放列表肯定是不一样的。在“`iPod`+`iTunes`”机制中，“播放列表”并不完全依赖`iPod`，这就保证当人们换一个新`iPod`时，依然能够非常容易地找到自己喜爱的歌曲。


    这种数据“同步”的机制，和纯粹的互联网应用是不同的。纯粹的互联网应用在用户的“终端”是没有数据的。换句话说，泛互联网化的终端是在离线状态下，依然可以发挥核心的功能。如果在联网的状态下，用户可以获得更多的数据。而纯粹的互联网应用在离线状态下是不可用的。这也是泛互联网化应用与互联网应用之间重要的差别。


    ### 唱片行业的挽歌

    所有的唱片公司老板当初答应乔布斯通过`iTunes`销售歌曲时，没想到自己将亲手埋葬这个行业。


    在`iPod`问世之前，歌手创作音乐，唱片公司制作唱片并向全国推广发行。大型的唱片公司占据行业的枢纽地位。歌手如果不和大型的唱片公司签约，再有才华也可能无人问津，但是有了`iPod`，局面有所改观，所有的音乐爱好者，都喜欢`iPod`代理的优美音质和随时随地的体验。更重要的是，通过`iTunes`可以购买自己喜欢的任何歌曲、音乐，并且立刻就可以在`iPod`中欣赏，人们再也不用跑到唱片店选购唱片，带回家欣赏。


    所有的唱片公司发行能力，都被`iTunes`取代了。歌手发现自己可以很容易地把自己创作的歌曲上传到`iTunes`，`iTunes`成为最大的歌曲发行商。借助`iPod`+`iTunes`组合，音乐爱好者和歌曲作者紧密地连接在一起，再也没有唱片公司的任何生存空间。


    唱片公司，作为一个行业，永远消失了。


    '
