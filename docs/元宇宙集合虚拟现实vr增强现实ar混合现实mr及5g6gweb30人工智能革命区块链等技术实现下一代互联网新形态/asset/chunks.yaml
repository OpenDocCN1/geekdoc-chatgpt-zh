    这种体验，非元宇宙而不可得。


    ### 第二，创造


    创造，本质上是精神生活。“两句三年得，一吟双泪流。”这是贾岛苦苦索句之后的内心独白。“满纸荒唐言，一把辛酸泪，都云作者痴，谁解其中味。”这是曹雪芹批阅十载、增删五次之后的感慨。


    创造是快乐的，但是再细致入微的描写，也难以穷尽真实的景物。绘画、雕塑、建筑都是艺术，艺术之美，非言语可以尽述。


    在元宇宙中，简单易用的创造工具，给了人们无尽的创造能力。创造只取决于人们的想象力。尤其是在元宇宙中，那种创世的感觉。


    创造也是元宇宙经济的基础。没有创造，就没有资产；没有资产，则没有交易；没有交易，也就没有所谓的经济系统。


    ### 第三，社交网络


    “嘤其鸣矣，求其友声。”小鸟都知道找朋友，何况人呢？孤独、不被理解是人们面临的最大的精神危机。古往今来，人类最悲凉的情绪，莫过于此。岳飞说：“欲将心事付瑶琴，知音少，弦断有谁听？”贾岛的“两句三年得，一吟双泪流”还有后两句：“知音如不赏，归卧故山秋。”寻求同好，知音共鸣，这是人类的基因决定的。


    社交网络是元宇宙的标配。国内以微信、国外以 Facebook 为代表的社交网络已经趋于成熟。抖音中内置了社交网络的功能。游戏中也同样如此。


    ### 第四，经济系统


    经济活动，是社会的基础。元宇宙作为虚拟的社会，同样离不开“虚拟”的经济。经济系统非常重要，重要到有单独的一章来讨论，这里不再赘述。


    ### 第五，文明形态


    所谓文明，是人类社会行为和自然行为的总和。每个人都是“多面”的，孩子在父母面前的行为，与他和朋友在一起的行为是有很大的区别的。在元宇宙中，人们以阿凡达化身的面貌出现在朋友面前，很可能也代表了我们内心深处一些不一样的渴望。因此，元宇宙中形成的文明形态，既和物理世界文明形态有相似之处，也有许多不同。


    因此，不同的元宇宙，很可能形成物理世界文明形态的不同投射。游戏《第二人生》和《堡垒之夜》的文明形态显然不同。


    也正是这些不同的文明形态，反映了物理世界中文明的复杂性、多样性。正因如此，我们才能体验到不同的人生。


    ## 元宇宙的技术基础


    元宇宙技术基础，可以用 BIGANT（大蚂蚁）来概括（见图 1-11）。B 指区块链技术（Blockchain），I 指交互技术（Interactivity），G
    指电子游戏技术（Game），A 指人工智能技术（AI），N 指网络及运算技术（Network），T 指物联网技术（Internet of Things）。“大蚂蚁”可以说集数字技术之大成。从图中可以看到元宇宙对于数字技术的拉动作用。


    ### 通过 AR、VR 等交互技术提升游戏的沉浸感


    回顾游戏的发展历程，沉浸感的提升一直是其技术突破的主要方向。从《愤怒的小鸟》到 CSGO，游戏建模方式从 2D 到 3D 的提升使游戏中的物体呈现立体感。玩家在游戏中可以自由切换视角，进而提升沉浸感。然而，3D
    游戏仍然只能通过垂直屏幕展示游戏画面，玩家的交互操作也受制于键盘、鼠标、手柄等硬件工具，与元宇宙“同步与拟真”的要求相去甚远。未来，随着以 VR、AR 为代表的人机交互技术的发展，由更加拟真、高频的人机交互方式承载的虚拟开放世界游戏，其沉浸感也有望得到大幅提升，从而缩小与元宇宙成熟形态之间的差距。


    ![](img/image00148.jpeg)


    图 1-11　元宇宙 BIGANT 六大技术全景图

    （图片来源：中译出版社《元宇宙通证》）


    ### 通过 5G、云计算技术支撑大规模用户同时在线，提升游戏的可进入性


    元宇宙是大规模的参与式媒介，交互用户数量将达到亿级。目前大型在线游戏均使用客户端软件，以游戏运营商服务器和用户计算机为处理终端运行。该模式下，对计算机终端的性能要求形成了用户使用门槛，进而限制了用户触达；同时，终端服务器承载能力有限，难以支撑大规模用户同时在线。而
    5G 和云计算等底层技术的进步和普及，是未来突破游戏可进入性限制的关键。


    ### 通过算法、算力提升驱动渲染模式升级，提升游戏的可触达性


    目前，3D 游戏采用传统的终端渲染模式，受限于个人计算机图形处理器（GPU）渲染能力，游戏的画面像素精细度与拟真效果仍有很大差距。为改进现有的渲染模式，提升游戏的可触达性，需要算法、算力的突破以及半导体等基础设施产业的持续进步。


    ### 通过区块链、AI 技术降低内容创作门槛，提升游戏的可延展性


    在专业生产内容（PGC）方面，第一方游戏内容是建立元宇宙的基础场所，而目前 3D 游戏在场景和人物建模上都需要耗费大量的人力、物力和时间。为实现元宇宙与现实社会高度同步，算法、算力及
    AI 建模技术的进步有望提升 PGC 的生产效率。在用户生产内容（UGC）方面，第三方自由创作的内容，以及闭环经济体的持续激励，是元宇宙延续并扩张的核心驱动力。目前游戏
    UGC 创作领域编程门槛过高，创作的高定制化和易得性不可兼得，同时鲜有游戏具备闭环经济体。因此，为达到元宇宙所需的可延展性，需要区块链经济、AI、综合内容平台等产业的技术突破。


    ## 谁来补苍天？


    区块链与元宇宙，相互依存，不可分割。区块链提供了元宇宙基础的组织模式、治理模式、经济模式所必需的技术架构，更重要的是，区块链去中心化的价值观，与元宇宙“共创、共享、共治”的价值观完全一致，相互成就。


    在物理世界中，作为上层建筑的政府，其作用无可替代。元宇宙在某种意义上是物理世界在数字世界的投射。但是很少有人愿意在元宇宙中给政府留个位置。尽管元宇宙的创世者们，并不是无政府主义者。


    西方有些思想家，把政府比喻成看门人，守护着社会的秩序和规则。当然政府的作用远不止于此。但是我们不得不考虑，元宇宙的创世居民（以 M 世代为主）有不少喜欢把反抗家长的权威作为追求自由的象征，如何引导他们积极健康地面对生活成为一个关键的课题。


    既然是追求无拘无束的体验、驰骋天地的自由，为什么非要设计一个类似“家长”的机构呢？


    但是元宇宙中，必须有规则，而且这些规则的执行，最好不必依赖某个中心化的组织。因此，区块链就派上了用场。


    另外，构建真正统一的元宇宙，需要“跨宇宙”机制，保证在不同的宇宙中，都能以相同的身份活动，而不是成为一个个平行宇宙的分身。我们无法用游戏 A 的 ID 去登录游戏
    B；游戏 B 的装备也无法在游戏 A 中使用。在玩家看来，它们就是永无交集的平行宇宙。


    也许有些资产，譬如“皮肤”，很可能是在不同的游戏中使用的。这些“资产”也就可以“跨宇宙”传播。


    能提供这种跨宇宙传递数字资产的技术，目前只有区块链可以做到。NFT 就提供了一个解决方案的模本。


    ### 元宇宙为 NFT 提供丰富的应用场景


    NFT（Non-Fungible Tokens）的英文直译是“非同质化代币”。但这个翻译本身表达不是十分清晰。它是区块链的一个条目，代表了某个独一无二的数字资产如博物馆里的世界名画，或者一块土地的所有权。它是数字世界中的一种资产，独一无二、不可复制，同时也可以进行买卖，可以用来代表现实世界中的一些商品，但它存在的方式是数字化，保存在以太坊的区块链中。


    许多人大力宣传，NFT 是区块链最重要的应用场景，是推动元宇宙发展的重要力量。的确，NFT 让我们看到物理世界的资产与数字世界资产联通的可能性，但是有个非常重要的问题，可能被
    NFT 的拥趸们忽略——NFT 的内在价值，缺少足够的共识。


    一双袜子拍出 15 万美元，推特上最早的 5 个英文单词拍出 250 万美元，一幅将 5000 天每天发布的数码绘画作品汇集在一起的作品拍出 6900 多万美元，这些价格是依据什么制定的？


    毫无疑问，单纯从上述 NFT 的基础物品（一双袜子、5 个英文单词、一幅已发布数码作品的汇集作品）看，都不可能有这么高的价格！


    那么，这些物品加上 NFT 作为加密的权益证明，就可以使其价格几十倍、几百倍、几千倍地升值吗？显然，一双袜子，无论使用何种权益加密技术，也难以使其价格过分上涨；推特上最早的
    5 个英文单词的推送人更是尽人皆知，实际上是否需要类似 NFT 的权益证明都值得怀疑；一幅将 5000 天每天发布的数码绘画作品汇集在一起的新作品加上 NFT
    权益证明（不代表对其归集的 5000 幅作品都进行了权益证明保护），就使其价格大幅上涨，并不存在合理的基础。


    对这些高价格合理的解释只能是信仰的力量、炒作的结果。因此，有专家曾公开发文呼吁人们慎重对待 NFT。很多人急于投资 NFT，一个重要原因就是为了彰显自己在数字世界的领先地位并抢夺
    NFT 升温后可能大幅升值的潜在收益，并会为此不遗余力地夸大 NFT 的价值，甚至进行相互炒作以抬高 NFT 的价格，竭力让更多的人相信并跟随投资，存在强烈的“传销”特性，投资风险是非常大的。


    在元宇宙中，每个数字产品，都有真实的游戏玩家支撑。每个 NFT 可能很难代表实际的价值，却是玩家体验的真实记录。从这个意义来讲，元宇宙赋予 NFT 意义。


    没有 NFT，元宇宙同样得到发展，就像现在 Roblox 做的一样，然而元宇宙可以带动 NFT 成长，甚至规范其交易规则，并且渐渐趋于理性。


    ## 互联网进化的终极形态


    蒂姆·伯纳斯-李在 1990 年发明了第一个网页浏览器，自此互联网开始蓬勃发展。苹果 2007 年发布第一代 iPhone 手机，互联网进入移动互联时代。PC
    互联网独领风骚 17 年，移动互联网也已历经 14 年。上网的终端从以 PC 电脑、笔记本为主，过渡到以智能手机为主。现在即将迎来新的变革，上网终端很可能从智能手机，逐步过渡到
    VR/AR 等设备。这个大周期估计也将持续 10 到 15 年。


    另外一条发展脉络就是前面提及的区块链。自从 2009 年比特币上线以来，区块链技术日益得到普及。从区块链衍生出来的治理模式、商业模式，叠加互联网的发展，构成一曲恢宏的乐章。


    以 VR/AR 设备、区块链、游戏叠加形成的新的互联网形态，正呼之欲出（见图 1-12）。继 PC 互联网、移动互联网，即将过渡到元宇宙时代。


    ![](img/image00173.jpeg)


    图 1-12　硬件设备内容形式对比

    （图片来源：天风证券研究所《Roblox 深度报告：Metaverse 第一股，元宇宙引领者》）


    # 02


    ## M 世代，元宇宙的创世居民


    You Only Live Once（只活一次，何不随心所欲？）

    ——网络流行语


    M 世代（Metaverse 世代）是指和互联网同步成长的一代人。他们第一部手机是智能手机，第一次打开的应用是游戏，他们是元宇宙的创世居民。他们不仅重塑着元宇宙社会，也在改变着物理社会。他们正在引领这个时代。


    “创造+分享”成为 M 世代自我实现的主要动力。在元宇宙中，创造仅受到想象力的限制，在元宇宙中生产无须担忧资源的枯竭，需要的就是想象极限的突破，得到的将是无尽的世界。


    M 世代是元宇宙经济主要参与者、推动者。M 世代在元宇宙中的行为和物理世界中的行为并不完全相同，更多的是合作、更多的是分享，阿凡达没有自私的基因。传统经济学必须重新思考“经济人”假设。


    科技繁荣、文化繁茂、城市繁华，现代文明的成果被层层打开，任由人们尽情享用。自由学习一门语言，学习一门手艺，欣赏一部电影，去遥远的地方旅行。很多人从小就在自由探索自己的兴趣，发展自己的爱好。很多人在童年就进入了不惑之年，不惑于自己喜欢什么，不喜欢什么。


    ……


    因为你们，这世上的小说、音乐、电影所表现的青春就不再是忧伤、迷茫，而是善良、勇敢、无私、无所畏惧，是心里有火，眼里有光，不用活成我们想象中的样子。


    我们这一代人的想象力不足以想象你们的未来，如果你们依然需要我们的祝福，那么，奔涌吧，后浪！我们在同一条奔涌的河流。


    2020 年五四青年节之际，哔哩哔哩发布了一个“献给新一代的演讲”——《后浪》。有评论说这个演讲“犹如给青年们的一封信，激荡起青春之声”。中国的年轻人正在以前所未有的势头在一种更多元、更丰富、更包容的新环境中猛烈成长着。


    每个时代有每个时代的特征，时代的特征就是主流人群的特征。他们在青春期遇到的历史重大事件，塑造出一代人的精神，同样这一代人也在推动着历史的进程。


    “60 后”，可能是最具西方精神的一代人，他们的青春时代，正是中国改革开放起始的年代。“70 后”，可能是最早的一代互联网人，中国第一封电子邮件发出的时候，这代人中最大的已经
    17 岁了。而到了“00 后”，他们拿起的第一部手机，一定是智能手机，功能机只存在于上一代人的记忆中。


    最年轻的这一代人，代表了世界的方向。尽管他们在上一代人眼中还很幼稚，但是他们的选择就是未来。


    我们将在第四章讨论元宇宙经济学，其中有一个很重要的假设：元宇宙的阿凡达们没有自私的基因。这个特征其实和这些年轻人的经历、追求、精神等息息相关。


    ## M 世代的互联网纪年


    日本社会学家岩原勉认为，群体是指“具有特定的共同目标和共同的归属感，存在着互动关系的复数个人的集合体”。我们总是习惯把一类具有相同特质的人归结为一个世代，比如说“80
    后”、“90 后”、千禧一代[^(\[1\])](#part0014.xhtml#comment_6184)、X 世代、Y 世代、Z 世代。我们将目光投向最具活力和可塑性的
    Z 世代，在本书中，我们为他们换一个名字——M 世代（Metaverse Generation），即生活在元宇宙的这代人，他们大约出生于 1995 年到 2010
    年之间。这代人伴随着互联网一起成长，受到互联网、即时通信、短信、MP3、智能手机和平板电脑等科技产物影响很大。他们通常不畏权威、追求社交认同、注重自我实现、愿意为知识及喜欢的一切付费。他们是元宇宙世界的居民，他们与智能手机一起成长，智能手机的发展史就是他们的成长史。


    根据 QuestMobile 2021 年发布的数据，截至 2020 年 11 月，“95 后”“00 后”活跃用户规模已经达到 3.2 亿，占全体移动网民的
    28.1%，其线上消费能力和意愿均远高于全网用户。这代人，生活优渥，具有更强的消费意识，同时也有更高的消费能力和消费意愿。他们，是技术迭代的早期消费者，是移动互联网中的重度用户，兴趣爱好极其广泛，是社交、娱乐、购物等方面的生力军。M
    世代的生活到底是怎么样的？我们将以 1995 年出生的 M 世代为例，将他们的生长轨迹和互联网发展中的一些大事件串联起来看，或许能看到一些端倪（见表 2-1）。


    表 2-1　M 世代的生长轨迹对应互联网发展中的大事件


    ![](img/image00181.jpeg)


    续表


    ![](img/image00192.jpeg)


    从表中可以看出，M 世代几乎和互联网的发展同步。他们拿起的第一部手机就是智能手机；他们打开的第一个应用很可能就是游戏；他们发布的第一个作品很可能就是短视频。M
    世代塑造了互联网，互联网也塑造了 M 世代。


    * * *


