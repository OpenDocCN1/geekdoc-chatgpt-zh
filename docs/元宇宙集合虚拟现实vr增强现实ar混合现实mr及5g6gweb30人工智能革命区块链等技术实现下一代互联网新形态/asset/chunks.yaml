- raw: '——刘志阳 上海财经大学教授


    5G、人工智能、区块链、云计算、大数据、物联网、机器人……新一代的技术把人类再一次推到了一个新的时代：可以预见，在数字经济时代，系列创新将以数字化的方式更快地扑面而来。这一次的变革将会更加深刻和巨大，人类可以通过这些技术直接将物理世界完整地镜像到计算机网络中，成就数字化的平行世界。《元宇宙》及《元宇宙通证》非常前沿地为我们打开了认知未来平行数字世界的大门。


    ——隆雨 京东集团前首席人力资源官、首席法务官


    碎片化的数字信息时代，时间的巨轮呼啸而过。互联网革命以来，AI、区块链、数字货币、星链、加密艺术、元宇宙等一系列新概念接踵撞击着我们本已经负重的大脑。当“个体存在演变为巨大计算机（互朕网）母体中的一段程序时，真实和虚拟的恍然无界”，继工业世界的铁血巨头之后，在数字互联网时代的IT超霸操控下，人们离在线虚拟系统越来越近，离梦想机器越来越远。人人不过是一粒渺小的游尘或一个像素，世界或许只是无数代码编造的精神荒原……本套书应该可以成为许多人了解元宇宙的一把入门钥匙，相信会让许多人爱上元宇宙。


    未来世界是一个由人和机器构成的超级混合体，但再先进的算法也比不了人类会思考的大脑，元宇宙可能也有边界，但人的想象力永远没有边界。


    ——罗强 著名互联网主义艺术家、全球首个线下NFT加密艺术个展举办者


    未来世界，一切皆有可能。当互联网的沉浸感逐步提升、虚拟与现实的距离逐渐缩小时，一个平行于现实世界运行的人造空间就诞生了。也许“元宇宙”对很多读者来说还是陌生的，相信在不远的将来，它或许会成为一个热词。


    ——绿叶 一位来自元宇宙的住民


    我们看到过去互联网、大数据、区块链、半导体等科技行业在中国的迅速崛起改变了人类的生活消费习惯，我们一直在问下一个科技爆发的点在哪里？我相信如果你有时间阅读此书，将会得到你想要的答案。这是一本通俗易懂，系统分析元宇宙和现代平行世界关系的书，相信读后定会让你大开眼界，如获新生。


    ——马天诣 安信通信首席分析师


    如果你还没有意识到，新兴数字技术正在以前所未有的速度重构人类生活，将你拉入虚拟时空，本书绝对可以帮到你。如何理解数字经济时代层出不穷的新现象和未来趋势？本书给出了深刻且有趣的解读、颠覆性判断和大胆预言，保证你在愉悦的阅读中脑洞大开！


    ——毛基业 人民大学商学院院长


    我们常说，区块链发现了数字经济的一片新大陆、一个平行宇宙。如果这种说法成立，元宇宙就是这个平行宇宙的终极实现，是数字资产的终极容器，也是数字商品的终极消费场景，代表了当前我们对于数字经济的最大胆也是最激动人心的构思。了解元宇宙，是把握数字经济财富机遇的必经之路。


    ——孟岩 Solv协议创始人、数字资产研究院副院长


    《元宇宙》不浮于表面，而是深入用户、基础设施、治理等问题进行探讨分析，同时也很好地做了普及概念的工作。元宇宙是未来如同“平行世界”一般但将真实存在的数字新世界。在这个世界中，所有人将获得新身份、新认同、新生活，在一个全新的生态中生活、交易、学习……在这样一个未来世界中，数字经济也将产生全新的业态，甚至影响和重构现实世界中人们的经济社会生活形态。了解如此重要的概念和趋势，这本《元宇宙》是非常好的入门读物。


    ——南春雨 和君资本副总经理


    当现实世界与数字世界之间被“元宇宙”打通，一方面，现实世界中的每一个人、每一台设备都将在元宇宙中拥有数字孪生的自己；另一方面，元宇宙中原本虚拟化的一切也将对现实时空产生巨大影响。智能交互硬件性能终将突破感知极限，让人真假难辨；物联网、大数据以及人工智能等技术终将突破范围边界，让元宇宙无边无际。庄生晓梦迷蝴蝶。最终，人们更愿意生活在现实宇宙，还是完全将精神寄托在元宇宙呢？读过本书，答案自在你心中。


    ——倪晓林 联想懂的通信副总经理


    记得1999年的夏天，看大片《黑客帝国》觉得超酷！它告诉我们世界是可以通过数字进行万物互联的！虽然它不过是通过电影抒发一下人们的想象而已，但22年过去了，世界的发展，早已超乎人们的想象！数字时代就在眼前，没有网络的世界已不可想象。今夏，读这本书，深感它的热度，它启发人们思考在技术推动下，社会新的形态、新的模式和发展趋势。超炫！


    ——潘庆中 清华大学苏世民学院常务副院长、中国公共关系学会副会长


    书中分享的关于“元宇宙”的思考系统独到、深刻，为我们打开了一扇通往“元宇宙”世界的大门，希望大家和我一样能享受到这场思想的饕餮盛宴。


    ——钱峰雷 浙江恒峰国际控股有限公司董事长


    无论我们如何感知，其实早已身处数字世界。数字经济、数字生活、数字娱乐、数字工作，庞大的数字时空正在迅猛崛起。这正是本书定义的“元宇宙”。元宇宙的量子特性和离散特性是如此玄妙：不受任何物理规律支配，又能模拟任何物理规律。极致到终极一问：元宇宙和宇宙究竟哪个是真实存在的？本书将2021年定义为元宇宙元年，其命题之深远、内容之宏大、认知之先锋，值得推荐阅读！


    ——钱晓钧 国联股份创始人、CEO


    万物元年，鸿蒙初始，创世纪一样新世界即将来临，我们将从物质世界的正面——“现实和肉体”，走向物质世界的背面——“虚拟和思想”，塑造另外一个自己，就是元宇宙。佛教中有三千世界，数字时代拥有三千元宇宙。


    ——乔伟豪 中国资本市场投资大师


    也许每个人都无数次地希望重活一次。元宇宙提供了现实之外另一种重新生活的方式。技术发展让这个“新世界”越来越生动，体验越来越真实。这套书的出版对于有意了解和投资元宇宙的有识之士具有重要的参考价值，值得细细评读。


    ——秦朔 人文财经观察家、秦朔朋友圈发起人


    人类是现实世界的认知奴隶，却正在成为元宇宙的上帝。


    ——沈阳 清华大学教授


    历史上有无数实践证明，曾经我们不敢相信的事情最后都变成了现实，元宇宙也可能是我们走向未来的必经之路。现实世界的身体，在元宇宙中能够拥有无限的能量和可能性，其既是我们创造出来的一个理想体系，但在和现实世界的交融之下，也不再虚幻。人类上下求索的文明世界，也会在未来以某种现在我们认为不可能的方式，继续散发其无限魅力。我相信本系列书将会是体会“阴阳”的敲门砖，推荐大家阅读。


    ——沈振鸿 钧源资本CEO


    元宇宙的概念最近特别火热，那么到底什么是元宇宙？“元宇宙”是互联网的接替者，它基于虚拟现实技术，充满着对现实世界的隐喻，也为泛滥的数字化娱乐、社交联系和企业发展业务提供机会。世界间的联系正以更快速度变得更加紧密，元宇宙离我们越来越近了。


    ——施涛 信也科技集团采购资深专家


    元宇宙是下一个集社交、娱乐、学习于一体的全新数字世界，并逐步承载人们的身份、数据和资产。“元宇宙”系列书站在传媒、IT、区块链的角度全面阐述了十年科技老兵对行业的观察，颇有共鸣。


    ——宋嘉吉 国盛证券区块链研究院院长


    元宇宙是什么？一个平行于现实世界并始终在线的沉浸式虚拟世界，其核心在于对虚拟世界中虚拟资产和虚拟身份的承载，用户可在其中进行文化、社交、娱乐活动，进行一系列虚拟活动，这个由游戏与虚拟空间组成的庞大新世界正在崛起，或将成为万物互联时代的终极赛道，我们不得不高度重视！


    ——宋宇海 京东天使投资人


    “元宇宙”系列书全面描绘了互联网发展可能的未来形态，给我们描绘了一个与传统物理世界平行的数字虚拟世界，同时也为我们社会的全面数字化转型提供参考路径。阅读本套书，可以指导我们更加深入地思考大数据、区块链等新技术与各行业的融合，以及数字经济、社会治理、数字基础设施等未来的发展方向，引领着我们去探索未来的数字世界。


