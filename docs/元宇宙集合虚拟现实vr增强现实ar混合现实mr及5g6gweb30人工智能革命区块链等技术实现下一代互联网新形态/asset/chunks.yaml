    # 专家推荐


    （排名不分先后，按姓氏拼音排序）


    站在自己的对立面，脱离未知的世界，冲破未知的世界，跨进元宇宙世界。用灵魂的一半去对应另一半，用精神的一半去对照另一半，用身体的一半去合元宇宙里的另一半，合为一个完整的自己。以灵魂指引自己的精神逃脱过往的面具，在元宇宙中重生自己。这是一条必经之路。当我读完本书的目录时，一束光正好划破夜空，它眷顾我，让我看见了那个澎湃而清新的宇宙。读这本书的意义在于看见自己是一个完美的人。


    ——艾欣 三通集团董事长、中国企业家俱乐部发起理事


    《雪崩》“创造”的元宇宙，“在黑太阳里，一切都是立体的，不透明的，写实的”。欢迎来到元宇宙时代，重新定义人和人生；它也会带来迥异的商业，请你保持兴奋和警醒。


    ——柏亮 零壹智库发起人、横琴数链研究院院长


    人类社会一直在发展，但需求本身一直没变。衣食住行，生老病死，七情六欲，以及对更美好生活的追求，这些需求一直没变；变的是形式，比如，满足衣食住行，生老病死，七情六欲，以及对更美好生活的追求，这些需求的形式一直在变。可以说，元宇宙是一个会对我们整个社会生活再次带来改变，甚至是重塑的新形式，也会是影响个人、集体乃至财富命运的新形式。远重兄的“元宇宙”系列，是我们通往未来的一张门票，意义重大，也必将影响深远。


    ——毕亚军 华商韬略创始人


    元宇宙是继大数据、区块链、5G 和云计算之后的未来新趋势吗？我的三个好友分别是大数据、金融科技和区块链专家，倾心创作国内介绍元宇宙第一套书，勾勒出未来元宇宙的轮廓。不管你是否认可元宇宙为互联网的未来，这本书都能给你很多的启发。


    ——蔡凯龙 后浪财经创始人、前德意志银行副总裁


    《易·乾卦》曰：“大哉乾元，万物资始”。自人类诞生以来，对宇宙本原的探索推动着文明不断前进。远至星辰大海，近至微观粒子，每一次探索都带来了文明的巨大飞跃。当前，虚拟世界已成为人类生活的一部分，大数据、人工智能、区块链、云技术等构成了这个世界无限多样的统一，它不仅改变了人类的生活方式，也拓展了空间、延伸了时间，给人类带来了全新的宇宙观。新的宇宙新的探索，本书为我们描绘了一座人类通往未来无限可能的传送门，或许，这就是虚拟世界的本原。


    ——曹阳 悦达国际科技金融研究院院长、独立投资人


    对未知的好奇从来就是人类文明进步的重要动力，爱因斯坦用相对论揭示了宏观世界的规律，普朗克和玻尔的电动力学展现了粒子世界的奥妙。致敬中观世界的好奇者，带着我们体验平行时空的人生，更奇妙的数字化人生！本书是对元宇宙重要的元年献礼。相信本书的出版，会推动我们更快抓住元宇宙生态发展的关键要素，迎接下一代数字化未来的到来。


    ——常扬 阿里巴巴副总裁、阿里巴巴文娱集团产业发展总经理


    在物理现实世界，约瑟投资持续为优秀创业者、优秀企业和 IP 创造价值，在元宇宙的广袤数字世界里，约瑟这个身份所创造的价值则远远超出了投资本身。这套新书是进入元宇宙世界的最佳引路人。


    ——陈九霖 约瑟投资创始人


    物理能量是支撑“信息唯一性”的根本基础。元宇宙创世前的互联网，是低强度能源支撑的、低维度的信息世界。信息可以自主交流，但不能自主交易；未来，基于高强度、高载能、净零碳新能源为底盘的元宇宙新世界，将通过人民群众的共识、聚沙成塔的物理能量，来确保新世界信息的“唯一性”。我们可以看到的，还是互联网。但是，底层逻辑已经改变，底座已经重构。未来已来……


    ——陈升 世纪互联董事长


    现在的时代是信息化、数字化的时代，但也许在未来，这个时代可以称为元宇宙时代。元宇宙带来的将会是一个完整、自洽的经济体系，纯粹的数字产品生产、消费的全新场景。在元宇宙形态下，商品从生产、消费、消耗等全链条来看，又会是完全区分现行市场的形态。简单理解，元宇宙中的商品，完全是在元宇宙中制造和消费的。另外，我们作为独立的个体、组织，也是构建元宇宙的一部分，“我心即宇宙，宇宙即我心”，5G、AR、VR、区块链、人工智能等科技的飞速发展，将使得我们能够创造出新世界——元宇宙，当然这个解释不足以让人们深入了解元宇宙，那么究竟什么是元宇宙，它能做什么，它能带给人类什么，书中将给出答案。


    ——陈伟 深圳太古计算机系统有限公司董事长、浙江大学 MBA 创业导师


    元宇宙是一个新概念，但并不是一个新事物；相反，人类在技术与资本的推动下，已经在迈向元宇宙的进程中前行了多年。这本书恰逢其时地从理论基础层面，系统地阐释了元宇宙这一概念的构成，能够帮助读者前瞻性感知我们将要去哪里，时代将会如何变革。


    ——陈玮 东方富海董事长


    2021 年是元宇宙元年。区块链、人工智能、虚拟现实技术的突破性发展，使得超空间传输协议、跨场域价值通证与拟感官认知界面三者第一次能够协同于同一应用场景，从而揭开地球的数字纪，真正进入人机共生的时代。


    ——陈序 元宇宙与未来资产研究智库 MetaZ 创始人、NFT China 首席顾问


    元宇宙作为一个全新的概念，让我们对未来虚拟世界的建立，有了全新的憧憬，未来潜力巨大。如果您想系统地了解元宇宙，那么，本书会给您带来新的视角。


    ——陈英 中国电子学会秘书长


    当虚拟世界和现实世界的界限被打通，人类将何去何从？《元宇宙》《元宇宙通证》未必能帮我们找到准确的答案，但会帮助人类变成更加智慧的生物。2021 年是元宇宙元年，元宇宙将带领我们摁下“重启键”，重新思考科技、文明、自然和人类的关系。


    ——程博 武汉市中小企业发展促进中心主任


    科技的进步、创新是社会发展的重要原动力。元宇宙所带来的新概念、新世界呼唤我们去探索、实践。连接现在与未来的数字世界充满机遇和挑战，现实与虚拟在同一维度运作的平行世界已然来临，我们需要怀着欢喜、期盼、敬畏、戒慎之心迎接每一个当下。


    ——池腾辉 一名横琴普通拓荒者

