    [\[1\]](#part0014.xhtml#commentRef_6108) 有一种说法称千禧一代（Millennial Generation）为“M
    世代”，或者“多任务世代”（Multitasking Generation）、“多媒体世代”（Multimedia Generation），这代人的特点被归纳为可以在同一时间使用不同类型的即时网络通信工具，喜欢将大部分时间花费在社交媒体和网络游戏上，从这个方面讲，这与“元宇宙世代”有异曲同工之处。


    ## 自我实现的世代呼唤


    我们借用马斯洛的需求层次理论来观察 M 世代的心理需求。马斯洛的需求层次结构是心理学中的激励理论，流传比较广的五级层次模型，现在已经扩展到八级。本书中采用七级模型，自下而上分别是：


    第一个层次的需求为生理的需要：食物、水分、空气、睡眠、性的需要等。它们在人的需要中最重要，最有力量。


    第二个层次的需求为安全需要：人们需要稳定、安全、受到保护、有秩序、能免除恐惧和焦虑等。


    第三个层次的需求为归属和爱的需要：一个人要求与其他人建立感情的联系或关系。例如人们积极进行社交活动，结交朋友，追求爱情。


    第四个层次的需求为自尊的需求：希望受到别人的尊重。自尊的需要使人相信自己的力量和价值，使得自己更有能力，更有创造力。例如努力读书来证明自己在社会的存在价值。缺乏自尊使人自卑，使人没有足够信心去处理问题。


    第五个层次的需求为认知需求：知识和理解、好奇心、探索、意义和可预测性需求。


    第六个层次的需求为审美需求：欣赏和寻找美，平衡，形式等。


    第七个层次的需求为自我实现需求：人们追求实现自己的能力或者潜能，并使之完善化。在人生道路上自我实现的形式是不一样的，每个人都有机会去完善自己的能力，满足自我实现的需要。例如运动员把自己的体能练到极致，让自己成为世界之最或是单纯为了超越自己；一位企业家认为，自己所经营的事业能为社会带来价值。


    M 世代，物质生活方面几乎从未经历匮乏，所经历的更多的是因为物质丰富而导致的选择困难。总体来看，M 世代普遍在第一、第二层级已得到充分的满足。


    M 世代的需求更多集中在精神层面，希望与他人建立情感联系，希望被认可，持续学习关注新鲜事物，追求美、艺术、快乐，发挥自身潜能，不断地完善自己。


    以 M 世代为主的社会中，物质非常丰富，虽然还没有达到理想的按需分配的状态，但在他们出生的那一天起，“短缺”根本就不存在。传统的经济学（相较元宇宙经济学而言）研究的对象是实物商品，制造有成本，容易受到原材料等资源的限制。M
    世代并不关心实物商品，而是关心实物商品上附加的“文化”属性，跟个人的感受、体验相关，和美、流行的趋势、朋友的选择相关。


    在元宇宙中，虚拟商品极大丰富，完全可以实现按需分配。当然在具体的商业实践中，生产商人为地制造稀缺性，来吸引 M 世代的目光。


    当面对极大丰富的虚拟商品的时候，M 世代还是利己为主要价值取向的经济人吗？


    尽管 M 世代进一步被圈层化，形成流行的亚文化，但是总体上 M 世代是秉持着共享、共美的价值观。毕竟比萨饼，我多吃一块儿，你就会少吃一块儿，但是快乐是每分享一次，就多一份快乐。分享，是
    M 世代鲜明的特征。


    互助同样表现得非常明显。在一些团队合作的游戏中，“一个都不能少”的确是取胜的不二法门。队友一旦受伤，必须倾力相救，才能保持更高胜率。共享、互助是元宇宙中 M
    世代的共同价值观。


    ## 圈层文化


