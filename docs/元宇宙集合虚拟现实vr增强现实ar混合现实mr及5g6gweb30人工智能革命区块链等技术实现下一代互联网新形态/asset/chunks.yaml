    ## 林江斌 重庆数孪科技创始人 AIoT 与数字化转型咨询顾问、投资人

    元宇宙是可观测、可预见的前沿技术底座：既集现有物联网、云计算、大数据、AI、AR/VR/MR/XR、区块链、数字孪生等技术于大成，又化作数字经济新基建之钥，开启了通往全新数字世界的大门。元宇宙是快速演化的、新型的数字经济体：通过
    UGC、PGC 到 AIGC，极大地调动、整合人与机器的数字参与度与数字创造力；通过数字创造、数字资产、数字交易和数字消费，进一步构建新型数字经济体，重塑区别于传统经济体的新型运作规律。元宇宙还是不断自生长、自演进的社会形态：在价值点、产业链、生态圈、共生体的点线面体的经济体演进中，不断升维，不断迭代演化出全新的元宇宙生态商业模式；同时，自信息技术诞生以来，从互联网、移动互联网、互联网+到物联网（IoT）、智联网（AIoT），再到万物互联、万象智联（联结物、事、人与时间），不断助推着社会形态的演进。


    我们的未来是《头号玩家》的“绿洲”，还是《黑客帝国》里的 Matrix，抑或庄周的梦境？答案就在书中。


    ## 林菁 佳讯飞鸿股份公司董事长

    我们现在从事的数字城市、数字政务、数字化产业，都是元宇宙的先导产业，是真实世界数字化的这部分；随着虚拟世界真实化的另一部分的不断发展，双方将交汇成虚实共生的元宇宙世界。这套书是指引你走向元宇宙未来世界的好向导。


