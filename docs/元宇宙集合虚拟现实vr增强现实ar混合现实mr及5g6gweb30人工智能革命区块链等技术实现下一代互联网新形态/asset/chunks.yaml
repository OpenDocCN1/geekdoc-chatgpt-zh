  trans: '


    加拿大哲学家查尔斯·泰勒指出，基于个人自主性的现代文化，源于社会的历史性转变：人获得空前膨胀的个人权利和自由，由此具有全新的自我理解。M 世代，就是这么一群标榜个性，崇尚自我理解、追求自我实现的人，他们有很多标签，有自己独有的圈层文化，如互联网原住民、敢赚敢花的“剁手党”、颜值主义、二次元、懒宅一族、朋克养生党等；他们善于表达，热爱分享，是潮流的引领者。他们用手机指挥商家上门服务，以外卖到家服务为主要表现形式；他们热爱亚文化，如动漫、网游等；他们一般每日外出时间少于
    3 小时，上网时间多于 8 小时。在游戏中社交，寻找朋友和伴侣的情况也会时常发生，《微微一笑很倾城》[^(\[1\])](#part0016.xhtml#comment_6798)里的故事并不是空穴来风（见图
    2-1）。


    ![](img/image00155.jpeg)


    图 2-1 电影《微微一笑很倾城》宣传海报


    M 世代在懒宅人群中占比很大。根据 iMedia Research（艾媒咨询）数据显示，2021 年，中国二次元用户规模将突破 4 亿人。最受懒宅用户群体喜爱的产品有：视频、直播、外卖送餐、生鲜零售、电子阅读、游戏类的产品。懒宅群体对每日优鲜、盒马鲜生、饿了么、美团的偏爱体现了懒宅用户对“懒”的追求。腾讯视频、哔哩哔哩、虎牙、斗鱼、掌阅的受欢迎程度也体现了懒宅用户多样化的休闲娱乐需要。


    消费者大数据分析师徐璐指出，青年消费理念已经超越了炫耀名牌、贪图虚荣和面子，反而更愿意取悦自己。[^(\[2\])](#part0016.xhtml#comment_6850)泡泡玛特的爆火就是一个典型的例子。泡泡玛特的
    CEO 王宁曾说，泡泡玛特做的是马斯洛需求理论上层的生意，用户买的不是刚需，而是文化（见图 2-2）。“年轻人就是要及时行乐——买喜欢的衣服，吃想吃的东西，见想见的人，开心就是王道。”这似乎才是
    M 世代的生活信条。


    ![](img/image00163.jpeg)


    图 2-2 在 M 世代中颇具人气的泡泡玛特盲盒（图片来源：泡泡玛特官网）


    M 世代崇尚颜值主义。他们动不动就把“颜值”挂在嘴边，毫不讳言自己的“颜值崇拜”，也是一种前所未有的景观。他们愿意为兴趣付费，腾讯 QQ 联合媒体推出的《95
    后兴趣报告》显示，“95 后”年轻人称，为兴趣付费无可厚非。


    有人为 M 世代梳理出 16 个亚文化圈层，分别是二次元、国风国潮、游戏电竞、潮玩酷物、硬核科技、御宅族、偶像圈、快文娱、cosplay、宠物、新舞音、新健康、新艺术、新教育、新竞技、街头野外。这些亚文化圈层有着极强的势能，只要持续关注它们，就能感知新时代、新文化、新消费的脉搏，发现各种新机遇，获得品牌的跨越式增长。[^(\[3\])](#part0016.xhtml#comment_6930)


