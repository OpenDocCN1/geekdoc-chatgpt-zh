- raw: '一个由游戏与虚拟空间组成的庞大新世界正在崛起，这就是“元宇宙”。元宇宙具有巨大的潜力，也承载着伟大的变革使命。这套书对于驱动元宇宙发展的技术基础，元宇宙平台的运作要素，为了建立起健康而充满活力的生态系统所需要构建的元宇宙经济体系，都进行了深入浅出的探讨。致敬创作本书的几位年轻布道者，引领大家一起去探索未来世界。


    ——曾良 天使投资人、互联网创业家


    元宇宙是一个全新的虚拟世界，可以是嵌套的多个位面，也可以是多个平行的位面。在每个位面里有各自的宇宙规则，在每个规则下都是经济和上层建筑的重塑，会产生全新的地产商、零售商、娱乐场所等，开创全新的虚拟人生。本书对这一未来的基础形态和构建技术进行了全面的介绍，相当于为读者们提供了丰富的建设物资，我们每位读者作为未来世界的架构师，唯一限制我们的就只有想象力了！


    ——张晨 浙江创邻科技有限公司创始人兼CEO、杭州市特聘专家


    随着科技进步和互联网的快速发展，数字技术不断改变着每个普通人的生活，人类社会已进入数字化的世界。《元宇宙》从数字世界的视角将现实世界中普通人的游戏、生活和数字世界的经济、社会、政治运行规则一一解读分析，为读者提供一整套的元宇宙理论。文中知识涉猎极广，从社会学、经济学再到哲学，从区块链技术到5G应用，该论著从当代普通人熟知的各项热点事件入手，探讨了元宇宙的运行规律，引发读者对于数字生活的深度思考。


    ——张功臣 齐鲁银行科技部总经理


    互联网是在一个相对混乱过程中“诞生”的产物，开放的（主要是学术的）互联网与封闭的（主要是面向消费者的）服务还处在并行发展阶段，元宇宙时代的到来一定会成为推动宇宙科技和人类文明快速发展的主要动力。今天，虽然我们对元宇宙如何为用户提供服务还尚不清楚，但是，我相信随着科学实践的发展，我们一定可以突破人类认识上的困难，本书会成为我们认知世界的好帮手。


    ——张进隆 英国中华总商会主席、商域国际集团董事长


    在全球数字化浪潮以及数字中国大趋势下，“元宇宙”强势来袭，这将是一次难得的历史机遇。如何抓住这个机遇，通过本套书，你将全面了解元宇宙的本质。


    ——张军 中信云网副总经理


    如同老子在《道德经》中所言：天下万物生于有，有生于无。天下万物生于有的现实，有的现实生于虚无的元宇宙世界，元宇宙未来虚拟世界的发展将决定现实世界万物的发展，想要知道未来的现实世界是什么样的，就得深刻去理解未来的元宇宙世界是什么样的。


    ——张瑞海 百悟科技董事长


    元宇宙是一种全新的建设起点，它涵盖了技术、金融、社会学、法学等多个领域。每一种文明都会发展到一个特定阶段，都会进入一种新的哲学范畴，即人可能会变成神。相较于古人而言，在当今信息量爆炸的网络时代，我们几乎做到了信息的穷尽。全知全能之后，人产生了基于神的使命感。在本书里，你可能会发现如同宇宙大爆炸一样震撼的视角，生命在哪里诞生，生态在何时繁荣，在无限的前提下，混沌和秩序是如何产生，碳基和硅基是如何交接。而最终，存在和意义的命题，可能会随着人们创造宇宙的能力而找到答案。


    ——张晏佳 工信部互联网+产业融合工作组秘书长、晏瓴资本董事长


    在元宇宙时代，事业的版图取决于我们能在多大范围把不同的要素整合在一起，元宇宙提供了无尽的时空，真是“海阔凭鱼跃，天高任鸟飞”。


    ——张宗真 全国政协委员、永同昌集团董事局主席


    现在“元宇宙”的概念越来越热，给了人们对未来的憧憬。由于基础建设，各种各样的软硬件技术的发展，再加上更年轻一代对多维世界追求的好奇心，在未来会出现一些人们能够沉浸其中的应用，甚至生活。它会把身份、社交关系、丛林法则，及在此基础上建立的一套经济系统整合起来，为大家创造新的生活方式。我小时候看的科幻电影，绝大多数都已经成为现实。现在我们看的科幻电影，如《头号玩家》，在将来也一定会变成现实。


    ——章苏阳 火山石资本创始合伙人兼董事长


    本系列书提出了“元宇宙”新概念，从技术角度、经济学角度和哲学角度对元宇宙进行了分析，提出了很多新观点。从物理世界到数字化的虚拟世界，再通过对虚拟世界的数字化改造，实现对现实世界的优化，这也是我们一直在实践的领域。元宇宙到底会不会成为数字化的下一个阶段？这个过程中我们可以做哪些努力？值得我们深入阅读和思考。


    ——赵越 联通智网科技股份有限公司董事长


    数字城市的本质是构建城市的数字孪生，其核心是通过数据的生产、采集、运营和赋能，打通数字空间和物理世界，形成数字孪生闭环。而数字城市的升级会不会将是城市化元宇宙？人们创造、生活、娱乐乃至工作的时间将越来越多地花在“元宇宙”中，相信这将带来一次全球范围内经济形态、文化范式等全方位的变革浪潮。正逢建党百年伟大的“觉醒时代”，“恰同学少年，风华正茂，书生意气，挥斥方遒”，相信你们正是“路漫漫其修远兮，吾将上下而求索”的一群浪漫的理想主义者！


    ——周鸿祎 360公司创始人、董事长兼CEO


    当前，数字技术已经广泛应用于社会生产、生活等场景，正在全方位、全角度、全链条为所有领域赋能、为所有个体赋智、为所有主体赋速。“元宇宙”剑指互联网的“终极形态”，是数字化未来的一个更具象化的综合体，是数字经济创新和产业链拓展的新疆域，随着AR、VR、5G、云计算等技术的成熟度提升和沉浸感、参与度、永续性的实现，“元宇宙”有望逐步从概念走向现实，在数字化的世界中去重构现实中的社交、生活乃至经济与社会系统。


    ——朱玉 中国信息协会副会长'
