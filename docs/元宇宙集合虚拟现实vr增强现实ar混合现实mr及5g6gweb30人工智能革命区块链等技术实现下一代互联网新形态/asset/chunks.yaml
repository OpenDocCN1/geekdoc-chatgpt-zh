    被虚拟互联网和人工智能深深改造了的宇宙，是一个无边界的混沌元宇宙。在这里，一切是非善恶好坏不停地反转，即生即灭，能量起伏呈现巨大的不确定性或无穷性。个人或组织，唯有一切从零出发，敬畏无穷性，不断打破边界，聚集宇宙能量不断创造精美绝活，以拓展人类和宇宙巨大无穷性的福祉。


    ### 王育琨 伟事达私董会教练与管理哲学家

    数字化转型的第一步是建立数字分身。《头号玩家》所想象的世界，是具象的数字分身所组成的虚拟空间，也是本书“元宇宙”概念的形象呈现。可以从三个层面前瞻充满想象力的元宇宙：在技术层面，它可能是将一系列的新科技和黑科技，比如
    5G、区块链、沉浸式 VR/AR、数字加密货币等，有机组织的场域；在社群与经济的层面，它促生年轻世代的虚拟社群，将体验经济和注意力经济推向极致；前瞻人与人工智能博弈，它又似乎能扮演衔接基因进化文明与数字知识文明的连接器。本书虽有一种杂糅玄学的味道，但作为对“人+机器”的未来的一种思考，的确脑洞大开。


    ### 吴晨 《经济学人·商论》执行总编辑

    几位作者洞察到了数字世界的最新发展方向，送给了我们一盏明灯，指引我们探索数字时代充满无限可能的全新未来。


    ### 吴刚 九鼎集团董事长

    我们一部分人花在虚拟世界的时间已经多过花在现实世界的时间。未来，我们绝大部分人花在虚拟世界的时间很可能会多过花在现实世界的时间！这种革命性的变化，即元宇宙新时代。强烈推荐中国首套系统描述未来元宇宙世界的系列丛书，让我们一起预测未来并创造未来。


    ### 吴家富 沐盟科技集团董事长、中国通信学会创新驱动委员会资本组组长

    随着区块链、人工智能、大数据、云计算、VR、5G 等技术的发展，我们正身处一个充满变化和挑战的时代，不断提高科技创新能力关乎个人发展和民族复兴。“元宇宙”的提出，为我们创造了无数崭新的可能性，揭示了未来社会的生态图景。在这个大背景下，《元宇宙》和《元宇宙通证》惊艳诞生。我们相信，元宇宙将带来一场巨大变革，对全球经济秩序产生巨大影响，年轻人任重而道远，正所谓“长江后浪推前浪”“江山代有才人出”！


    ### 吴晓青 民建中央副主席、中国产学研合作促进会常务副会长

    穿越时空，探索宇宙，梦中世界，入我心中。虚拟融合，浩瀚无穷，AI 世界，美丽呈现。请打开这本书，每个人都会拥有美好的人生！


    ### 小太阳 M 世代之光

    “宇”代表上下四方，“宙”代表古往今来，宇与宙合在一起，代表着无限的空间和时间，象征着无限种可能……“元宇宙”系列书告诉我们，宇宙还有另一种打开方式。元宇宙丰富了我们的想象空间，扩展了我们的认知模式，是人类技术与艺术、商业与社会的又一次大融合、大跨越。元宇宙时代已经到来，我们很难说清哪一个是虚拟的、哪一个是真实的世界……或许真实世界本来就是虚拟的，而虚拟世界却是真实的……


    ### 徐浩然 中国第一个首席品牌官、中国中小企业协会副会长

    元宇宙赋予了用户在网络赛博世界的虚拟身份，这是和现实世界相对应的身份。现实的物理世界让我们认识了自我，而在元宇宙我们重新定义了自我。在这个虚拟世界里每个人都可以成为自己的“超级英雄”。这里有自己的秩序，有自己的经济规则，这是人类未来的精神家园。穷则变，变则通，通则久，习近平总书记提到“科技领域是最需要不断改革的领域”，只有与时俱进才能保持活力，才能保证一切顺利地进行。


    ### 徐烜 策展人

    “元宇宙”将是未来虚拟世界中最具潜力的领域，技术成熟度的拐点似乎已经到来。数据、数字物品、数字化形态的内容以及 IP 都可以在元宇宙中通行。


    ### 宣鸿 中关村发展集团总经理、中关村大数据产业联盟理事长

    下一代的创意内容基础设施会是什么？我们一直在思考和探索。科技赋能想象力，元宇宙带来了新的可能。技术和创意会进一步交相辉映。而价值观和世界观带来的身份认同和圈层文化，会是人类发展的长期原动力。


    ### 杨振 特赞总裁

    元宇宙的发展建立在传统互联网成熟的技术基础之上，并以 5G 与 AIoT 为基石，充分利用区块链、大数据、人工智能等新一代信息技术赋予人身份与资产特征，保障人类资产权益和流转在虚拟世界的正常进行。“元宇宙”系列书构建了一个完善的虚拟社会生活、经济体系，使我们得以一叶知秋，发现未来虚拟世界的美妙之处。


    ### 叶大清 融 360CEO

    元宇宙源于尼尔·斯蒂芬森在 1992 年出版的科幻小说《雪崩》，在经历了从《黑客帝国》到《头号玩家》后，Metaverse 已经从文学作品搬上了好莱坞影视巨作的荧幕，成为时空架构的重要元素之一，不断冲击着人类的眼球。目前，元宇宙渐具实现的技术基础，元宇宙平行世界或已并不遥远，通过“元宇宙”系列书我们或许可得以窥之。


    ### 易鹏 盘古智库理事长

    无论在什么状况下，不管时空如何转变，加密艺术（即区块链艺术）、元宇宙等互联网文化形态都应连接现实和未来，拒绝固化和稳定，用超乎寻常的思想与方式，与星际空间密切沟通。可以预见，在未来的某一刻，数字世界的超能量会把现有的现实结构、观念一一撕裂，核变出前所未有的无限形态。这本书内容精彩，值得深入阅读。很好奇也很期待一个超越现实世界和物理形态的元宇宙所带来的未来……


    ### 尤莉娅 A.Yang 乌克兰 NFT 加密艺术家

    元宇宙将是我们在未来的主要社交、娱乐、工作、协同的“载体”或“基地”。元宇宙是“新物种”，更将是新物种的“母体”，有望在五年内改变人类的生活方式。在区块链和
    NFT 等技术与应用的助推下，未来我们都将在元宇宙这个全新的数字世界中，创造大量新型数字资产，进而重塑财富格局。从现在开始，每个人都应该关注和理解元宇宙，读一读“元宇宙”系列书，这对我们的未来将会至关重要。


    ### 于佳宁 中国通信工业协会区块链专委会轮值主席

    元宇宙代表着互联网和数字科技发展的下一阶段，为人类的想象力和创造力提供一个崭新的舞台；将有限游戏、零和游戏变为无限游戏、非零和游戏；突破现有成熟市场的内卷、延展新的价值空间、带来新的商业模式，必将成为新经济和财富创造的引擎。


    ### 余晨 易宝支付联合创始人

    易欢欢先生是我多年的朋友，他的《元宇宙》和《元宇宙通证》系统全面地阐述了元宇宙的概念、理论和应用场景。元宇宙能连接现实世界和虚拟世界，带来更好的体验，承载更多的信息，能极大提高人类接收和处理信息的带宽。同时，其可能会颠覆目前的社交、电商、短视频、广告、游戏等业态。


    ### 曾光 深圳互联网金融协会秘书长

    《元宇宙》及《元宇宙通证》兼具专业性与通识性，内容深入浅出、启人心智，是我们得以窥见未来虚拟世界的一个窗口。


    ### 曾俭华 华建函数基金董事长、原建行首席财务风险官

