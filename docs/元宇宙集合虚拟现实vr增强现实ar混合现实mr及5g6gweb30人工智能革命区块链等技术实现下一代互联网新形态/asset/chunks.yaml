- raw: '我有一个预感，元宇宙将打开人类认识自身存在的全新视角，就像几何学上有欧式几何，也有非欧几何，在元宇宙的平行时空里，我们肉身所在的物理世界也将不再代表唯一和正确的真理。人类无边际的想象力和区块链、人工智能等新科技的磅礴创造力相结合，将会反过来重新塑造出万千世界，这将是一场新的创世纪的开始，区别在于我们每个人都将参与其中。


    ——邓迪 太一集团董事长


    元宇宙来了！从创新到经济体系，再到政府，“虚拟世界”已经成为我们生活中越来越重要的一部分。大多数的服务都可以通过去中心化的虚拟方式得以实现，现实的机构在未来可发挥的作用越来越有限。“元宇宙”系列图书涉及新的未来，在这个未来中，人们将更加无拘无束。


    我期望“元宇宙”和这个去中心化的世界将为人类历史上最具创造力和生产力的一次飞跃和进步提供一个平台。


    ——蒂姆·德雷普 DFJ投资基金的创办合伙人


    “元宇宙”系列书极具前瞻性和洞察力，其所描述的虚拟世界与现实世界相辅相成，已然是物理世界中的实体与数字世界中的孪生体相互映射，未来必将成为人类社会数字化发展的终极形态。元宇宙将会赋能现实世界的所有行业领域，基于现有商业模式进行元宇宙化创新，助力数字孪生的社会创新发展从概念走向落地实践，数字化社会已经到来。


    ——刁志中 广联达科技股份有限公司董事长


    元宇宙，重新定义数字世界的未来。人们将来工作和生活的虚拟时空到底是什么样子，如何打造支持它有序运转的基础设施，如何治理这样的世界，核心的数字技术如何关联到我们的未来生活，《元宇宙》《元宇宙通证》带您深入探索。


    ——丁伟 江西裕民银行首席信息官


    互联网改变世界不断演进，元宇宙的盛大场景正呈现在我们面前，如果数字统治了这个世界，我们未来会怎样？对于任何一位面向未来的读者，这本书开卷有益。


    ——董晨 东北证券股份有限公司副总裁


    近年来VR/AR/XR、脑机接口、区块链、数字人、数字孪生等新技术和产品层出不穷，真实世界和虚拟世界的边界似乎正不可逆地变得模糊。元宇宙概念的提出，更是为人类终极的赛博世界提出了完整的构想，也可能为人类下一世代数字技术的发展指出了前进的方向。这套书从多个维度剖析了元宇宙的核心内涵和典型特质，畅想元宇宙未来在多个应用领域的发展前景，带领读者提前迈入元宇宙的奇幻世界，成为元宇宙的原住民。值得先睹为快！


    ——杜永波 华兴资本合伙人兼董事总经理


    进入元宇宙，拥抱美好新生活与幸福新世界。


    ——樊晓艳 幸福社发起人


    “元宇宙”系列书向我们描述了一个与现实世界相平行的虚拟世界，它的技术实现路径渐趋渐进。在这个永不离线的虚拟世界里，人们可以进行互动和交易，俨然是真实世界的镜像。本书高瞻远瞩，视野独到，极具先见之明，为我们打开了解未来虚拟世界的一道门。


    ——傅盛 猎豹移动CEO


    邵雍在北宋时就曾推算出地球人类文明是周而复始的，每一轮文明为10800年，而天地之规则为129600年。数字技术和人工智能的时代仍然是人类在主导和思考，技术促进脑机连接的努力仍将一往无前。“元宇宙”是一切意识的幻化和投影，在无限时空里，人类的自觉和异化正值大数据的切片和共谱。恰在其时，天文学研究，火星与月球上都有类似地球上金字塔人面狮身的构造物。假如证实为同一来源，我们人类的历史和来源都将被重新改写，回归到不生不灭的“元宇宙”。我阅读这本书时，想象我们的祖先夙愿未了，与我们在量子纠缠的时空中，得以在这部书中进行终极的著述。


    ——傅榆翔 国际跨界艺术家，独立策展人


    链上原生艺术的非同质化通证，其实是执行智能协议的一种标准、一种行业规范。它天然具备可收藏性、可流通性和可证明性。非同质化通证不但有价值，而且具备进入虚拟社交游戏元宇宙的优势品质，势必与多链元宇宙应用场景、与虚拟世界所映射的人类交往理性及其乌托邦理想产生梦幻联动。显然，链上原生的加密数字艺术史将与物理现实中薪火相传的传统艺术史平行输出，虚实并进，互为表里，长期并存。然而前者终将成为后者的一种确证方式，从而让人类汇聚最高人文智慧和精神价值的艺术文明获得一种数字永生。互联网的尽头也许就是元宇宙。《元宇宙》与《元宇宙通证》是了解元宇宙的奠定基础的好作品，希望了解和参与元宇宙的朋友们，一定要读一读。


    ——顾振清 著名策展人


    元宇宙的概念，作为一个平行于现实物理世界运行的虚拟空间尽管来源于科幻小说，但随着AR、VR、5G、云计算等技术的日趋成熟，元宇宙逐步从虚拟走入现实并不遥远。姑且不论元宇宙是否会成为互联网的“终极形态”，元宇宙经济未来对传统经济的渗透和冲击绝对不容小觑。我们目前尚无法准确预估未来数字商品和实物商品交易各自所占的比重，但传统经济升级到数字经济后，以数字商品为主要对象的元宇宙经济带来的创新、价值、新模式，从游戏中带来的经济能量和新生代生活方式改变可以窥见一斑。本书对元宇宙技术演进和经济特性的探索令人兴奋，作者无疑是元宇宙技术和经济前沿的探索者和先驱者。


    ——郭学涛 悉尼科技大学博士、郑州银行数据管理部技术总监


    创新和发展是我们这个世界的主题。当前我们正处在互联网红利逐渐消失殆尽的下半场，数字经济正在叩响新时代的大门，而元宇宙则是未来数字社会发展的必然产物，终将颠覆人类社会现有的生存和发展模式。


    ——韩颖 广州基金董事长


    元宇宙并非只是一个看似感性的概念，或对《我的世界》之类的旧瓶装新酒。它的意义，也不仅是游戏领域的新革命，也可能成为新一代人类的社交或电商工具。这是一个自己也不知道会发育成什么样子的宇宙生态。不会有一家公司能够垄断式地打造或运行它。就如同真实世界，将由许多个人、公司、组织共同实现，也会有非常多的工具、基础设施、协议来支持它的运行，几个关键影响因素包括：虚拟身份与资产、用户创造、经济体系、沉浸感、社交性。目前关于元宇宙的研究资料不多，也较为零散，《元宇宙》及《元宇宙通证》做了系统的观察与梳理，值得一读。


    ——何伊凡 知名财经作家、浅海融媒有限公司董事长


    由计算机、网络、算法构建的虚拟世界，如同城市一般，将汇聚新新人类，成就多元价值的创造、交换和消费。这个全新的虚拟世界被称为元宇宙。元宇宙正处于大爆炸的前夜，是因为感知技术正在突破临界点，弥合了碳基生物与硅基世界的鸿沟；而基于区块链技术的社区自治规则也已落地，规则成就秩序，秩序成就文明。先知者智，先行者慧。热诚推荐《元宇宙》和《元宇宙通证》，愿你成为元宇宙的先知先行者。


    ——胡捷 上海交通大学上海高级金融学院教授


    元宇宙时代物理、伦理、成本、生产力、生产关系、价值定义都发生了巨变。从尺度上，狭义元宇宙可指任意精神沉浸场景，如书、角色、电影、游戏、城市；广义元宇宙则是所有现实与虚拟世界及其中的物种、物质、信息、规律、时间等互联形成的超级文明体。人人皆可创建无数个狭义元宇宙，最终构成广义元宇宙统一体。从时间上，2030年前，Web
    2.5“虚实共生”，现实与数字世界的互通入口如AR世界地图至关重要；2050年前，Web 3.0“虚实莫辨”，海量子元宇宙如头号玩家实现体验互联；2070年前，Web
    4.0才是脑机与AI+系统互联的真·元宇宙时代。


