    # 序一 “元宇宙”和“后人类社会”

    ## 一

    1992 年，尼尔·斯蒂芬森（Neal Stephenson）的科幻小说《雪崩》（Snow Crash）出版，好评如潮。《雪崩》描述的是脱胎于现实世界的一代互联网人对两个平行世界的感知和认识。但是，不论是作者，还是书评者，都没有预见到在
    30 年之后，此书提出的“元宇宙”（Metaverse）概念形成了一场冲击波。[^(\[1\])](#part0003.xhtml#comment_570)


    其标志性事件就是 2021 年 3 月 10 日，沙盒游戏平台 Roblox 作为第一个将“元宇宙”概念写进招股书的公司，成功登陆纽交所，上市首日市值突破
    400 亿美元，引爆了科技和资本圈。这之后，关于“元宇宙”的概念与文章迅速充斥各类媒体，引发思想界、科技界、资本界、企业界和文化界，甚至政府部门的关注，形成了“元宇宙”现象。


    如何解读这样的现象，解释“元宇宙”的定义？关于“元宇宙”最有代表性的定义是：“元宇宙”是一个平行于现实世界，又独立于现实世界的虚拟空间，是映射现实世界的在线虚拟世界，是越来越真实的数字虚拟世界。比较而言，“维基百科”对“元宇宙”的描述更符合“元宇宙”的新特征：通过虚拟增强的物理现实，呈现收敛性和物理持久性特征的，基于未来互联网的，具有连接感知和共享特征的
    3D 虚拟空间。


    也就是说，2021 年语境下的“元宇宙”的内涵已经超越了 1992 年《雪崩》中所提到的“元宇宙”：吸纳了信息革命（5G/6G）、互联网革命（Web 3.0）、人工智能革命，以及
    VR、AR、MR，特别是游戏引擎在内的虚拟现实技术革命的成果，向人类展现出构建与传统物理世界平行的全息数字世界的可能性；引发了信息科学、量子科学、数学和生命科学的互动，改变了科学范式；推动了传统的哲学、社会学，甚至人文科学体系的突破；囊括了所有的数字技术，包括区块链技术成就；丰富了数字经济转型模式，融合
    De-Fi、IPFS、NFT 等数字金融成果。


    如今，“虚拟世界联结而成的元宇宙”，已经被投资界认为是宏大且前景广阔的投资主题，成了数字经济创新和产业链的新疆域。不仅如此，“元宇宙”为人类社会实现最终数字化转型提供了新的路径，并与“后人类社会”发生全方位的交集，展现了一个可以与大航海时代、工业革命时代、宇航时代具有同样历史意义的新时代。


    ## 二

    人类的文明史有多久，人类探讨“宇宙”的历史就有多久。公元前 450 年，古希腊哲人留基伯（Leucippus，约前 500 年—前 440 年），从米利都前往一个叫阿夫季拉的地方，撰写了一本著作《宇宙学》（The
    Great Cosmology）。之后，他的弟子德谟克利特（Democritus，约前 460 年—前 370 年）又写了《宇宙小系统》（Little Cosmology）一书。正是他们师生二人，构建了古典原子论和宇宙学的基础。


    当人类将自己的价值观念、人文思想、技术工具、经济模式和“宇宙”认知结合在一起的时候，被赋予特定理念的“宇宙”就成了“元宇宙”。在这样的意义上，“元宇宙”经历了三个基本历史阶段。


    第一阶段：以文学、艺术、宗教为载体的古典形态的“元宇宙”。在这个历史阶段，西方世界的《圣经》、但丁的《神曲》，甚至达·芬奇的《蒙娜丽莎》、巴赫的宗教音乐，都属于“元宇宙”。其中，但丁的《神曲》包含了对人类历经坎坷的“灵魂寓所”——一个闭环式的至善宇宙的想象。在中国，《易经》《河洛图》《西游记》则是具有东方特色的“元宇宙”代表。


    第二阶段：以科幻和电子游戏形态为载体的新古典“元宇宙”。其中，最经典的作品是 200 年前雪莱夫人的科幻小说《弗兰肯斯坦》（Frankenstein）和 J.
    K. 罗琳的《哈利·波特》（Harry Potter）。1996 年，通过虚拟现实建模语言（VRML）构建的 Cybertown，是新古典“元宇宙”重要的里程碑。最有代表性和震撼性的莫过于
    1999 年全球上映的影片《黑客帝国》（The Matrix），一个看似正常的现实世界可能被名为“矩阵”的计算机人工智能系统所控制。


    第三阶段：以“非中心化”游戏为载体的高度智能化形态的“元宇宙”。2003 年，美国互联网公司 Linden Lab 推出基于 Open3D 的“第二人生”（Second
    Life），是标志性事件。之后，2006 年 Roblox 公司发布同时兼容了虚拟世界、休闲游戏和用户自建内容的游戏 Roblox；2009 年瑞典 Mojang
    Studios 开发《我的世界》（Minecraft）这款游戏；2019 年 Facebook 公司宣布 Facebook Horizon 成为社交 VR
    世界；2020 年借以太坊为平台，支持用户拥有和运营虚拟资产的 Decentraland，都构成了“元宇宙”第三历史阶段的主要的历史节点。


    “元宇宙”源于游戏，超越游戏，正在进入第三阶段的中后期：一方面，游戏为主体的“元宇宙”的基础设施和框架趋于成熟；另一方面，游戏与现实边界开始走向消融，创建者仅仅是最早的玩家，而不是所有者，规则由社区群众自主决定。


    Roblox 的 CEO David Baszucki 提出了“元宇宙”的八个基本特征：身份（Identity）、朋友（Friends）、沉浸感（Immersive）、低延迟（Low
    Friction）、多元化（Variety）、随地（Anywhere）、经济系统（Economy）和文明（Civility）。基于 Baszucki 的标准，“元宇宙”=创造+娱乐+展示+社交+交易，人们在“元宇宙”中可以实现深度体验。


    “元宇宙”正在形成其特定的构造。Beamable 公司创始人 Jon Radoff 也提出“元宇宙”构造的七个层面：体验（Experience）、发现（Discovery）、创作者经济（Creator
    Economy）、空间计算（Spatial Computing）、去中心化（Decentralization）、人机互动（Human–computer Interaction）、基础设施（Infrastructure）。


    2020 年，在全球新冠肺炎疫情背景下，以下典型事件触发了人们对“元宇宙”的期待。其一，虚拟演唱会：美国著名流行歌手 Travis Scott 在游戏《堡垒之夜》（Fortnite）中举办了一场虚拟演唱会，全球
    1230 万游戏玩家成为虚拟演唱会观众。其二，虚拟教育：家长们在沙盘游戏《我的世界》和 Roblox 上为孩子们举办生日派对。其三，虚拟金融：CNBC 报道“元宇宙”的地产浪潮，投资“元宇宙”资产基金的设立，全方位虚拟化“元宇宙”资产和财富模式正在形成。其四，学术活动虚拟化：全球顶级
    AI 学术会议 ACAI 在《动物森友会》（Animal Crossing Society）上举行研讨会。其五，虚拟创作：Roblox 影响了整个游戏生态，吸引的月活跃玩家超
    1 亿人，创造了超过 1800 万个游戏体验。


    如此下去，人们很快可以随时随地切换身份，穿梭于真实和虚拟世界，任意进入一个虚拟空间和时间节点所构成的“元宇宙”，在其中学习、工作、交友、购物、旅游。对于这样的经济系统、社会系统和社会生态，人们目前的想象力显然是不够的。


    ## 三

    2021 年可以被称为“元宇宙”元年。“元宇宙”呈现着超出想象的爆发力，其背后是相关“元宇宙”要素的“群聚效应”（critical mass），近似 1995
    年互联网所经历的“群聚效应”。


    要真正理解“元宇宙”，必须引入技术视角。在技术视角下，技术意义的“元宇宙”包括内容系统、区块链系统、显示系统、操作系统，最终展现为超越屏幕限制的 3D 界面，所代表的是继
    PC 时代、移动时代之后的全息平台时代。


    支持“元宇宙”的技术集群包括五个板块：其一，网络和算力技术——包括空间定位算法、虚拟场景拟合、实时网络传输、GPU 服务器、边缘计算，降低成本和网络拥堵；其二，人工智能；其三，电子游戏技术——例如，支持游戏的程序代码和资源（图像、声音、动画）的游戏引擎；其四，显示技术——VR、AR、ER、MR，特别是
    XR，持续迭代升级，虚拟沉浸现实体验阶梯，不断深化的感知交互；其五，区块链技术——通过智能合约，去中心化的清结算平台和价值传递机制，保障价值归属与流转，实现经济系统运行的稳定、高效、透明和确定性。“元宇宙”是以“硬技术”为坚实基础的，包括计算机、网络设备、集成电路、通信组件、新型显示系统、混合现实设备、精密自由曲面光学系统、高像素高清晰摄像头。2021
    年，虚拟现实穿戴设备制造商 Oculus 的最新 VR 产品销量持续超预期，再次点燃了市场对于虚拟现实的想象。“元宇宙”形成的产业链将包括微纳加工，高端制造，高精度地图，光学制造（例如衍射波导镜片、微显示和芯片制造），以及相关的软件产业。最终，“元宇宙”的运行需要物理形态的能源。


    ## 四

    “元宇宙”是具象的，也是抽象的。具象的“元宇宙”是以抽象的“元宇宙”为基础的。


    抽象的“元宇宙”首先是数学意义的“元宇宙”。抽象代数很可能是研究“元宇宙”的数学工具。因为抽象代数基于“群、环、域”的概念，通过研究确定一个对象集合的性质以理解与解决另一个对象集合中的复杂关系问题，寻找可能存在于它们之间的某种集合元素对应变换的等价性，符合“第一群同构定理”，现实世界与虚拟世界之间存在对称和映射关系。如果`R`是现实世界的客体元素集合，`R′`是虚拟世界或“元宇宙”中的虚拟元素集合，进而`R′`是对现实世界`R`的缩小或压缩，即虚拟世界`R′`＜现实世界`R`。所谓的“元宇宙”则是现实世界`R`与虚拟世界`R′`之和。


    简言之，抽象代数所建立的同态映射与同构模型，有助于理解“元宇宙”。


    此外，还有一个被称为“自然转型”（natural transformation）的理论，属于“范畴理论”（category theory）分支，描述两个数学结构如何存在映射关系，也有助于从抽象数学层次理解“元宇宙”形成的深刻原理。


    量子力学也有助于对于“元宇宙”的抽象性理解。在可以观测的宇宙，其大部分的组成来自占 26.8%的暗物质和占 68.3%的暗能量。不仅如此，物质 99%的空间都是空的。唯有量子、粒子作为一个零维的点，可以穿过坚不可摧的墙，同时存在于两个地方。当环境发生变化时，量子可以改变自身的状态。可见，量子力学与全息宇宙的理论存在极大的重合性。


    整个宇宙可以被看作一个二维的结构，加上人类信息，构成三维世界模式。在新的模式中，所有存在的事物都可以编码成量化的意识。或者说，人们的记忆主要依靠的是不同的意识时刻编码形成的信息。


    美国维克森林大学医学院的罗伯特·兰扎（Robert Lanza）教授指出：人们的意识创造了宇宙，而不是宇宙创造了人们的意识，时空是“意识工具”。没有意识，所有的物质都会处在一个不确定的状态下。不仅如此，时间不是真的存在，空间也只是人们感知事物的一个概念。任何关于时间和连续性的看法实际上都是一种错觉。


    经过量子力学所诠释的“元宇宙”，就是那些可以完美描述我们所有经历的一个又一个意识的“信息块”。在这样的意义上，“元宇宙”是全息的。


    ## 五

    面对正在形成，甚至很快进入“大爆炸”阶段的“元宇宙”，不得不回答“元宇宙”的主体是什么，即“元宇宙”的原住民是谁。


    在“元宇宙”的早期，真实世界中的人们通过数字映射的方式获得虚拟身份，通过数字化，实现对传统人的生理存在、文化存在、心理和精神存在的虚拟化配置，进而成为“元宇宙”的第一代虚拟原住民。这些原住民具备现实人与虚拟人双重身份，拥有自我学习的能力，可以在“元宇宙”中互动和交流。若干年前上映的科幻电影《银翼杀手
    2049》展现了未来社会的“人类”构成：生物人、电子人、数字人、虚拟人、信息人，以及他们繁衍的拥有不同的性格、技能、知识、经验等天赋的后代。


    可以肯定，未来的“元宇宙”居民势必多元化，只会比《银翼杀手 2049》中的社会更为复杂，每个个体都不会只具有单一身份，而是具有复杂身份，生命也是从有限生命到无限生命。


    如果说“元宇宙”的本质是“信息块”，那么，“信息视角下的生命”是什么？作为信息人、数字人、虚拟人，完全可以想象一个由信息构成的网络。


    “元宇宙”的主体，生物人、电子人、数字人、虚拟人、信息人，最终都演变为有机体和无机体，人工智能和生物基因技术的结合，形成所谓的“后人类”。其实，在过去的三四十年间，“后人类”问题已经引发一些学者的关注和研究。


    美国后现代主义学者唐娜·哈拉维（Donna Haraway）发表《赛博格宣言：20 世纪 80 年代的科学、技术以及社会主义女性主义》（A Manifesto
    for Cyborgs: Science, Technology, and Socialist Feminism in the 1980s）一文，将后人类命名为“赛博格”，他们在未来世界将行走于生物体和机器之中，是虚拟和现实之间的新形态人类。


