    # 元宇宙中逍遥游


    元宇宙是人们生活、工作的沉浸式虚拟时空。在元宇宙中，需要重新思考存在和虚无、肉体和精神、性善和性恶、自我和宇宙的哲学命题，需要不断探索有限和无限、秩序与自由、自治与法治、经济与治理、伦理和文明的边界，需要全面融合区块链、AR、5G、大数据、人工智能、3D引擎等新技术，形成数字创造、数字资产、数字市场、数字货币、数字消费的新模式。元宇宙是“心”的绽放，是“梦”的具象，是“我思故我在”的全息展现。内求于心，外形于物，物物相生，元宇宙成矣。


    在认知层，元宇宙突破了想象的极限，创造自由自在的世界（见表1-1）。元宇宙的世界都是由人们所思所想直接幻化而成的，是人类精神的外在表现，是“我心即宇宙，宇宙即我心”的三维呈现。元宇宙秉持共创、共享、共治的价值观，在生产力、生产关系、上层建筑领域具有了共产主义色彩。元宇宙经济则由数字身份、数字资产、数字市场、数字货币、数字消费等关键要素形成的完整经济体系。基本特征体现为沉浸式体验、自由创造、社交网络、经济系统和文明形态。元宇宙综合了人类在各个领域的尖端技术，包括区块链、5G、人工智能、3D引擎、VR/AR/XR、脑机接口。这些基础构成了元宇宙的基础设施。


    表1-1　元宇宙的基础设施


    ![](Images/image00150.jpeg)


    ## 文学艺术中的“元宇宙”


    刘慈欣在一部科幻小说中，描写了先进的外星文明对地球的监视。从地球上的生物第一次凝望太空的时候，外星人就把地球列为技术可能爆炸式发展的危险之地，开始对人类展开技术封锁。生物探寻宇宙的历史，甚至超过了人类的历史。


    以“心”为原点，向外探寻物理世界、浩瀚的星空；向内建立丰富的精神世界。向外的思维高峰，无疑是《三体》的《地球往事》《黑暗森林》《死亡永生》三部曲，展现了宏阔的时空，寻找宇宙的边界，一不小心就和心爱的人错过了几十万年。向内求的高峰，首推《逍遥游》，无所持而游无穷，扶摇直上者九万里。摆脱所有世俗之物，超越时空的绝对精神自由。


    “心”外的无尽探求，已经到达了历史的巅峰。介子须弥，人类在纳米级别蚀刻，极尽精微之事。巡天万里，从太空数度往返，开启宏阔旅程。“心”内的精神世界，更多是宗教、文学、艺术领域的创造。伟大的艺术作品往往包括完整宇宙观的构建。中国作品如《红楼梦》《西游记》等，西方作品如《荷马史诗》《哈利·波特》等。


    《西游记》中对于“心”的描写，最为直观、典型。吴承恩处处留下暗示：孙悟空就是唐僧的“心”幻化而成的形象。孙悟空拜师学艺的地方，挂着一副对联：“灵台方寸山，斜月三星洞。”灵台和方寸在道教中都是指“心”，斜月三星更是一个“心”字。可以说《西游记》记录了唐僧取经的历程，是以唐僧的心为原点，构建了“元宇宙”。


    电影艺术中，最能给人带来直接观感和深刻启迪的，莫过于《黑客帝国》和《头号玩家》。这两部电影都在试图回答一个问题：何为真实？我们大脑感受的世界，是不是就是虚幻的世界？


    心外到极致广大，心内到极尽精微，反而可能就是一体。我心即宇宙，宇宙即我心。


    ## 何为真实？


    这是我2018年12月，去中国商用飞机有限责任公司（以下简称中国商飞）参观时拍的一张照片。我在ARJ21飞机的模拟舱中体验飞机驾驶的乐趣（见图1-8）。教练员观察了一下我的体格，只是启动了初级模拟程序，也就是巡航阶段的操控。当然我也有自知之明，如果开启模拟飞鸟撞击发动机的程序，我就得晕倒在模拟舱中了。


    ![](Images/image00159.jpeg)


    图1-8 作者赵国栋在ARJ21飞机的模拟机舱中


    飞行员都是在模拟舱中训练，甚至有了实际的飞行里程后，还需要定期到模拟舱复训。因为在模拟舱中可以模拟飞行员平时在飞行过程中很难经历的场景。譬如飞鸟撞击发动机，导致一侧发动机失火，从而失去动力，该如何处理？


    很多人都看过电影《中国机长》，刘长健机长驾驶四川航空3U8633航班执行航班任务时，在万米高空突遇驾驶舱风挡玻璃爆裂脱落、座舱释压的极端罕见险情。像这样的险情，极少发生。但是在模拟舱中，可以真实再现这种极端情况，从而考查飞行员的应急能力和驾驶水平。


    模拟舱和真实的ARJ21飞机一模一样，只是把机身、机翼换成了几个液压杆，模拟各种飞行姿态。一架模拟舱的造价并不便宜。中国商飞也只有两架模拟舱。对飞行员而言，执行飞行任务无疑是真实的。但在模拟舱中能体验真实飞行过程中几乎不会遇到的场景。虚拟世界中飞行的场景则更丰富。飞行员的学习和培训都是在模拟舱中完成的。


    何为真实？“真实”这个词有语言的模糊性。无论是模拟舱还是飞机，给人的驾驶体验都是一样的。但是模拟舱可以给飞行员极端情况下的体验，当然，我们祈祷飞机永远不要给驾驶员极端的驾驶体验。


    就体验的丰富性来讲，虚拟世界是远远超越物理世界的。对个人而言，无论是虚拟世界还是物理世界，体验都是真实的。


    体验真实，感受真实，超越了物理世界，物理世界和虚拟世界的界限将不再清晰。


    再看《黑客帝国》中的场景，都是电脑程序刺激大脑获得的信号。大脑的体验是真实的，所以尼奥无从分辨虚幻的世界，直到吃下墨菲斯手中的蓝色药丸（蓝色药丸代表物理世界，红色药丸代表虚拟世界，见图1-9）。


    ![](Images/image00168.jpeg)


    图1-9 电影《黑客帝国》剧照（图片来源：影片截图）


    元宇宙中一个重要特性就是体验真实，超越物理世界。


    元宇宙是精神世界的逍遥与物理世界的星空璀璨的奇妙融合。5G、3D、VR等技术发展，把心即宇宙的心学认知，变成了超现实的虚幻存在。


    如果把元宇宙定义为工作和生活的虚拟时空，其实还有很多符合这个定义的系统，不只是游戏和电影。只是电影带来的视觉冲击力和游戏带来的沉浸感，让我们更容易体验到自由自在的创造，释放无拘无束的天性，去感受那些在真实世界永远不可能发生的事情。


    ## 共创、共享、共治的价值观


    在元宇宙中许多产品是“阿凡达”创造的，当然也存在一些阿凡达组成团队，推出一些制作精良的产品的情况。元宇宙中UGC（用户创造内容）是主流的方向，很难像管理员工一样管理阿凡达，因为难以制定时间明确的任务、确立考核指标。


    但是成熟的游戏中，大都建立了“任务”机制，大家在游戏中完成任务，获得激励。激励可能是积分、游戏币，也可能是某些稀有的装备。换句话说，激励阿凡达创造，是不得不考虑的事情。因为这是元宇宙中“生产”的前提，同时也是满足玩家自我实现的精神需要。有了创造，才有可能形成产品。有了产品，就需要交换的场所。因此也就发展起数字市场。


    共创是一起做蛋糕，共享是一起分蛋糕，共治是一起制定做大蛋糕、分好蛋糕的游戏规则。“共创”“共享”“共治”分别关乎生产力（共创）、生产关系（共享）、上层建筑（共治）三个元宇宙社会结构的根本方面。共荣则是从元宇宙整体来讲，达到的最终目标——元宇宙的繁荣。


    共创和共享方面，一些企业都做得不错。譬如苹果给开发者分成；微软公司新推出的Windows 11，号称开发者在其系统上创造的所有应用都免费，微软不会收取任何费用；抖音、哔哩哔哩等平台上，创作者也可以获得可观的报酬。


    但是在共治方面，这些中心化的公司体制，几乎没有给共治留下制度空间。许许多多以区块链为底层技术支撑的去中心化应用，走在了前面。


    用这三个价值观考察元宇宙第一股——Roblox，发现其“共治”价值观也没有得到很好的体现。共治，恰恰是区别新经济与旧经济、新理念与旧理念、新模式与旧模式的关键点。


    关于元宇宙治理的问题，我们在第五章详细讨论。


    ## 元宇宙的经济体系


    数字经济是以数据为主要生产要素的经济活动，既包含物质产品生产、流通、消费的内容，也包括数字产品的创造、交换、消费的内容。换句话说，无论是物质产品还是非物质产品，只要在生产、流通、消费的任何一个环节，利用数字技术或者数据，都是数字经济的范畴。而元宇宙经济严格限定数字产品的创造、交换、消费的所有环节，都必须在数字世界中完成。


    元宇宙经济是数字经济的特殊形式，体现出元宇宙经济的特殊性。元宇宙经济同时是数字经济的组成部分，必然体现出数字经济的一般性特征。特殊性主要体现为“经济人”假设崩溃、认同决定价值而非劳动决定价值、边际成本降低、边际效益提高、交易费用趋近于零等特性。一般性体现为符合经济的基本原理，市场规模越大，经济就会越繁荣。


    元宇宙经济要素包括数字创造、数字资产、数字市场、数字货币、数字消费。其特征明显区别于传统经济，表现为计划和市场的统一、生产和消费的统一、监管和自由的统一、行为和信用的统一。


    元宇宙经济的特征决定了它是深入研究数字经济的绝佳样本。我们在元宇宙经济中得到的一些结论，放在数字经济体系中详加考查的话，结论未必和元宇宙经济完全相同，但对于建立我国的数字经济体系有深刻的启示意义。


    元宇宙经济是很多平台型公司的必然选择。所有平台型公司或多或少都具备融入元宇宙经济的部分特征，尽管其表现形式略有差异。表1-2给出了不同类型元宇宙经济体系的对比。


    表1-2　不同类型元宇宙经济体系的对比


    ![](Images/image00176.jpeg)


    关于元宇宙经济，将在第四章中详加讨论。


    ## 元宇宙的基本特征


    关于元宇宙的特征，众说纷纭。Roblox总结了八方面，去芜存菁，我认为有五方面可以囊括元宇宙的基础特征。


    第一，沉浸式的体验。


    抖音、微信、腾讯的游戏帝国也都是元宇宙。如果我们认为元宇宙是人们生活和工作的虚拟时空的话，为什么在微信、抖音如日中天的时候，我们没有提出元宇宙的概念，只是用“产业生态”这个词来形容微信、抖音构筑的商业帝国呢？


    当然，我们也有沉迷于刷抖音的时候，甚至一刷就是一两个小时。但是没有人觉得自己是在另外一个“时空”。虽然我们的眼睛紧盯着几寸大小的屏幕，但是依然可以感受到屏幕以外发生的事情。在手机屏幕的方寸之间，并没有身临其境的感觉。


    但是VR不同，当你戴上头盔的瞬间，就好像经过时空隧道穿越到另外一个时空，就像《头号玩家》里面的场景一样。


    沉浸式的体验，给我们带来超越现实的震撼，从此与物理世界“阴阳两隔”。就像两个平行的宇宙，需要借助“虫洞”连接。穿越虫洞，就是另外一个宇宙。

