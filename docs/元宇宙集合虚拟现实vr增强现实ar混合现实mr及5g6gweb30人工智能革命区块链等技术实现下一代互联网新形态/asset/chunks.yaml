- raw: "美国的未来学家雷蒙德·库茨魏尔（Ray Kurzweil）于1986年出版的《智能机器人的时代》（The Age of Intelligent Machines）一书中，将人类社会的进化概念分成了六个纪元：第一纪元，物理和化学；第二纪元，生物与DNA；第三纪元，大脑；第四纪元，技术；第五纪元，智慧和技术的结合；第六纪元，宇宙的觉醒。在这个阶段，传统人类成为非生物人类，也就是半个机器人，升级成人类3.0版本，宇宙面临奇点的最终命运。\n\
    \n美国社会学家弗朗西斯·福山（Francis Fukuyama）在他的著作《我们的后人类未来：生物技术革命的后果》（Our Posthuman Future:\
    \ Consequences of the Biotechnology Revolution）中指出：现代生物技术生产的最大危险在于它有可能修改乃至改变人类的本性，“人性终将被生物技术掏空，从而把我们引入后人类的历史时代”。\n\
    \n现在，现实人类和他们创造的虚拟人，正在形成新的社会关系与情感连接，成为开拓“元宇宙”边界的先驱者，并在虚拟新大陆上构建“后人类社会”。\n\n值得注意的是，1990年左右出生的“Y”世代人群，对即时通信、网游、云计算具有天然的接受能力，更在意生活体验，是同时生活在现实世界和虚拟世界的第一代，带动了“YOLO（You\
    \ OnlyLive Once）文化”的兴起。但是，2010年之后出生的新一代，则是人类历史上与生俱来与尖端科技互动，并将科学技术进步完全融入自己生活的第一代人，也将是“元宇宙”完全意义的“原住民”，已经开始参与“元宇宙”的构建，推动“元宇宙”向更高阶的维度发展。\n\
    \n也可以将“后人类社会”形成过程想象为生命形态从所谓的“碳基生命”向“硅基生命”过渡的过程。其间自始至终会存在两种演变：一种演变是生物学的、信息论的、技术的演变；另一种演变则是伦理、文化和社会层面的。这两种演变都同时充满期望和难以预期风险的前景。有一种说法：在未来，90%以上的人类活动，如科研、艺术、教学、开发、设计，都会在元宇宙中进行[^(\\\
    [2\\])](#part0003.xhtml#comment_1389)。所以，如何评估“元宇宙”模式的风险，需要尽早提上日程。\n\n六\n\n“元宇宙”时代的到来，不是未来时，而是现在进行时。因此，有一系列新的问题需要考量：\n\
    \n第一，如何确定“元宇宙”价值取向、制度选择和秩序。在现实世界，当下的人类具有完全不同的甚至对立的价值取向，还有不同信仰，特别是宗教信仰。所以，“元宇宙”需要面对这些富有挑战性的课题：如何避免简单复制现实世界的价值观？如何实现“元宇宙”的“制度”设计？在“制度”设计中要不要坚持自由、主权、正义、平等之类的原则？怎样确定“元宇宙”的秩序和运行规则？何以制定“元宇宙”宪章？简言之，如何确定支持“元宇宙”文明框架的体系？\n\
    \n第二，如何制定“元宇宙”内在的经济规则。在“元宇宙”中，不存在人类经历的农耕社会和工业社会，也不存在现实世界的传统产业结构。在“元宇宙”中，“观念经济”将是经济活动的基本形态，金融货币的天然形式不可能再是贵金属，而是虚拟的社会货币。现在，处于早期阶段的“元宇宙”经济体系，可以移植和试验所有数字经济创新成果，包括各类数字货币，试验合作经济、共享经济和普惠金融，消除在现实世界难以改变的“贫富差距”。\n\
    \n第三，怎样避免“元宇宙”内在垄断。“元宇宙”具有避免被少数力量垄断的基因。Roblox的联合创始人Neil Rimer提出：Metaverse的能量将来自用户，而不是公司。任何单独一家公司是不可能建立“元宇宙”的，而是要依靠来自各方的集合力量。Epic公司CEO蒂姆·斯威尼（Tim\
    \ Sweeney）也强调：“元宇宙”另一个关键要素在于，它并非出自哪一家行业巨头之手，而是数以百万计的人们共同创作的结晶。每个人都通过内容创作、编程和游戏设计为“元宇宙”做出自己的贡献，还可以通过其他方式为“元宇宙”增加价值。2020年，国内流行一种“全真互联网”的概念。这样的概念忽视了互联网与区块链结合的趋势，以及Web\
    \ 3.0的非中心化的特征。“全真互联网”让人们想到金庸小说《射雕英雄传》与《神雕侠侣》所描写的江湖世界中的那个“全真派”。\n\n第四，如何预防“元宇宙”的霸权主义和“元宇宙”之间的冲突。在未来，“元宇宙”并不是“一个”宇宙，新的“元宇宙”会不断涌现，形成多元化的“元宇宙”体系，如同“太阳系”和“银河系”。不仅如此，“元宇宙”是开放的，任何一个“元宇宙”的居民都可以同时生活在不同的“元宇宙”中。“元宇宙”也存在进化，在这样的场景下，需要建立“元宇宙”之间和谐共存的规则，消除人类曾经构想的“星球大战”的任何可能性。\n\
    \n第五，如何维系现实世界和“元宇宙”之间的正面互动关系。可以预见，因为“元宇宙”，人可以同时栖息在真实与虚拟世界中，导致人的神经感知延伸，意识扩展。“元宇宙”的形成与发展，需要与现实世界互动，实现两个世界从理念、技术到文化层面的互补和平衡，形成新的文明生态。在“元宇宙”早期阶段，两个世界的互动关系还是通过现实人类不断改变存在身份，以及虚拟机和预言机作为技术性媒介实现的。如果人类和他们的虚拟生命在“元宇宙”的社会活动和生活方式中获得更多的幸福，将这样的感受和体验带回到现实世界，有利于现实世界向善改变，有助于深刻认知“人类共同体”理念。\n\
    \n第六，如何协调资本、政府和民众参与创建“元宇宙”。创建“元宇宙”，政府、资本和民众都有各自的功能。在早期，政府的作用相当重要。2021年5月18日，韩国宣布建立一个由当地公司组成的“元宇宙联盟”，其目标是建立统一的国家级VR和AR的增强现实平台，理清虚拟环境的道德和法律规范，确保元宇宙“不是一个被单一大公司垄断的空间”，将虚拟服务作为一个新的公共品。韩国的“元宇宙联盟”构想值得我们关注和学习。\n\
    \n对上述问题的考量，其实都没有彻底摆脱和超越作为当下“人类”的思考模式。如果是“元宇宙”的全新思考范式，就应该相信，“元宇宙”一旦形成，就会有自己的生命力，以及自我调整和演变的内在动力。\n\
    \n七\n\n人类在关注和参与“元宇宙”的形成与发展过程中，传统的生命概念、时空概念、能量概念、族群概念、经济概念和价值观念都会被改变和颠覆，触及哲学，甚至伦理学。\n\
    \n因为“元宇宙”，导致人们重新思考基本的哲学概念：先验知识、存在和存在主义、经验主义、二元论、语言本质、超现实社会、单向度，进而影响对以下哲学家所提出的哲学思辨的认知。\n\
    \n第一，笛卡儿（René Descartes）的“二元论”。笛卡儿认为，心灵和身体是两个不同的领域，进而提出是否存在支配两者的普遍法则的问题。在“元宇宙”世界，心灵和身体发生重合，完全实现了“我思故我在”。只有在认识论（epistemology）的意义上，世界才是依赖主体的，或者说是主体建构了世界的性质。\n\
    \n第二，萨特（Jean-Paul Sartre）的“存在”与“虚无”的关系。萨特的代表作《存在与虚无》（L’Être et le Néant），通过“存在与虚无”的二元性代替了“物与人”的二元性，进而提出人被虚无所包围，虚无即是人的真实存在，人终究被非存在所制约。所以，人就是虚无，并且是一切虚无之源。而“元宇宙”的本质，实现了存在和虚无的真实“关联”和“统一”。\n\
    \n第三，福柯（Michel Foucault）的“我应该是什么”。根据福柯的《词与物》（Les Mots et les choses: un archeologie\
    \ des sciences humaines），在18世纪末以前，并不存在人。“人”是新近的产物，是现代认识型的产物。因此，在《词与物》一书的最后一页写道：“人将被抹去，如同大海边沙地上的一张脸。”于是，“人之死”（deathof\
    \ men）就不可避免。福柯的后现代理论对现代体制的质疑，为虚拟空间和“元宇宙”造就替代传统人类的“新人类”提供了合法性缘由。\n\n第四，海德格尔（Martin\
    \ Heidegger）和维特根斯坦（LudwigWittgenstein）的“语言就是世界”。海德格尔认为，语言并不是一个表达世界观的工具，语言本身就是世界。维特根斯坦的语言理念则是：语言就是游戏，也是一种生活形式。“元宇宙”的语言系统不同于传统人类自然语言，而是计算机程序语言，以及代码转化的文本、声音、图像、视频，以及其他符号形式，进而构成新的文明规则。所以，其中的活动与游戏，以及语言游戏之间并没有清晰的边界。如果海德格尔和维特根斯坦看到“元宇宙”的语言深层结构，他们会重新定义语言与人类社会活动的关系。\n\
    \n第五，博德里亚尔（Jean Baudrillard）的“大众化的虚无世界”。博德里亚尔在他的《在沉默的大多数的阴影下》（À l’ombre des majorités\
    \ silencieuses）中，表现出对当代社会的敏锐观察：旧的阶级结构瓦解，传统社会秩序的所有支点都不可避免地“中性化”，进入了所谓的大众化的虚无世界，或者虚无状态，现实与虚构之间的界限已经消失。不得不承认，“元宇宙”就是现代社会走向虚无趋势的一种具有积极意义的显现。\n\
    \n结束本文的时候，要对中国历史上的哲人充满崇敬之心。南宋哲学家陆九渊（1139—1193年）在延续自战国时代关于“宇宙”的诠释，即“四方上下曰宇，往古来今曰宙”的基础上，进而提出“宇宙便是吾心，吾心即是宇宙”，确认了“心学”的内核。之后的明朝哲学家王阳明（1472—1529年）将“心学”提到了前所未有的高度，指出“无心外之理，无心外之物”。当今，要认知“元宇宙”的真谛，需要参透陆九渊和王阳明深邃的思想。\n\
    \n朱嘉明  \n\n著名经济学家  \n\n珠海市横琴新区数链数字金融研究院学术与技术委员会主席  \n\n2021年6月12日\n\n* * *\n\n\
    注释：\n\n[\\[1\\]](#part0003.xhtml#commentRef_548) 《雪崩》相关译文：“名片背面是一堆杂乱的联络方式：电话号码、全球语音电话定位码、邮政信箱号码、六个电子通信网络上的网址，还有一个‘元宇宙’中的地址。”在《雪崩》的中文译本（郭泽译，四川科学技术出版社2009年版）中，“Metaverse”被翻译为“超元域”。\n\
    \n[\\[2\\]](#part0003.xhtml#commentRef_1372) 参见吴啸《“元宇宙”——21世纪的出埃及记》。\n\n# 序二 \
    \ \n\n“元宇宙”与“区块链”\n\n在得知中译出版社即将出版《元宇宙》和《元宇宙通证》两本书的消息时，我非常兴奋和激动。我一直十分关注“元宇宙”的概念，这个概念与区块链密不可分，却具有更加宏大的意义，两者相辅相成。可以说，正因为有了区块链，元宇宙才能从平平无奇的“虚拟世界”跃迁到开天辟地的“宇宙”。\n\
    \n区块链是一个全球性、安全、点对点的网络，但在全球范围内，它并不是第一个点对点网络，也不是第一个应用密码技术的网络，更不是第一个允许人们远距离交流的网络。全球P2P文件共享网络BitTorrent已经存在了15年，让世界各地的人共享网络资源；它也作为一个平台让相距很远的人仍然可以很容易地相互交流。区块链也并不是第一个做到这一点的技术。互联网在过去的几十年中已经取得了很大的进步。\n\
    \n密码学（让人们相互信任的技术）已经有近40年的历史，它允许我们进行远程交互而不需要信任参与这个过程的每个人。在使用因特网时，几乎所有计算机或电话与运行某些应用程序的服务器之间的通信都是加密的。\n\
    \n密码学非常有价值。密码学确保消息的内容只能被打算阅读它的人看到，保证消息的内容不会在此过程中更改，也确保消息的发送者是他们所说的自己。\n\n但有很多东西是密码学无法实现的。比如：密码学无法告诉你消息是何时创建或何时发布的，它不能证明某些信息在一段时间之前就存在了，也不能证明某人是否确认了该信息。密码学无法使参与者达成一致共识。在金融体系中，如果每个参与者对所有人资产的共同价值没有共识，金融体系就无法运转。密码学不能提供经济激励，因为它不能提供股权证明和支付渠道，然而许多技术在很大程度上依赖于经济激励。密码学不能证明来自真实世界的信息。你无法用数学方法证明香港的温度是100华氏度，也无法用数学方法证明美元对港元的汇率是1:7.18。现实世界的大部分事情是无法证明的。\n\
    \n虽然区块链不能解决所有问题，却解决了加密技术不能解决的许多问题。\n\n区块链技术不是简单的点对点网络和密码技术的线性组合，最重要的是它让全部的区块链网络参与者取得共识。区块链网络中的每个节点，都成了历史的见证者，从而避免了因缺乏信任而无法完成操作。\n\
    \n我们现在拥有的大多数应用程序都试图使用某种集中式数据库。因为某些应用程序在互联网上有相当大的数据库（如QQ、微信、支付宝等），所以近年来有许多垄断情况出现。\n\
    \n应用程序的用户越多，想要查看数据库的用户就越多，其他用户便有更多的机会可以快速、轻松地与已经存在的用户进行交互。这意味着，对于一个小公司而言，即使产品再好也难以与大公司竞争。\n\
    \n区块链的数据库和账本不依赖特定公司存在。两个不同的公司可以以分布式数据库和密码学保护用户隐私，获得网络效应带来的好处，躲避大公司的垄断，这样一来，大公司主导某个行业的情况就再难发生。\n\
    \n有很多网站已经有了明显的网络效应，但其数据不被特定公司控制，维基百科就是一个很好的例子。人们所做的不仅是分享信息，还可以分享共识，甚至余额、账户。\n\n\
    所以当你在一个建立在区块链上的、完全开放的平台时，其强大的网络效应会让你更容易地享受到应用程序带来的好处。这不仅局限于一个行业，它可以跨越不同的行业和国家。\n\
    \n区块链的应用领域非常广阔，囊括支付、预订、个人身份认证等。\n\n支付最先发挥作用。人们对代币、货币、各种金融工具都很感兴趣。举一个非常有趣的例子，在一些愿意提升透明度的领域中（如慈善组织），对于那些对公开预算使用情况有需求的国家，区块链支付在这些领域大有裨益。\n\
    \n虽然我们现在能用区块链订火车票、订旅馆、订机票，但在这些过程中，还有很多低效之处需要改进，而区块链最能发挥作用的领域就是协调多方参与场景。\n\n这些年有些人一直在推的“上链”进展并不明显。一个很重要的原因是，上链资产和实物很可能存在不一致的情况，而这无法通过区块链网络自身来得到保证。但是在元宇宙中，所有的资产都是数字化的，天然就存在于网络上。严格意义上来说，元宇宙的所有资产都可以基于区块链网络。上述种种好处，尤其能避免元宇宙中数字资产集中于大公司手中，导致创新的小企业举步维艰。区块链保障了元宇宙居民自身拥有数据的权利，把数据的权利归还给元宇宙的居民。\n\
    \n元宇宙对于区块链的发展同样至关重要。元宇宙的数字资产规模很可能在很短的时间内就会超越物理世界，在高速增长的环境中，区块链更能大展拳脚。\n\n现在全世界都在关注中国，关注中国元宇宙。我相信，元宇宙在中国的未来是光明的。我们要运用好区块链技术，完善区块链技术，推动元宇宙的发展。尽管元宇宙中的居民生活在不同的国家，但元宇宙是超越国界的。我也在关注中国的理念，譬如“人类命运共同体”。虽然这个理念和中国的历史一样古老，却和最潮的元宇宙的精神内核息息相通。在元宇宙中，我们借助区块链技术实现了同一个元宇宙的共同体；在每一个元宇宙中，他们都休戚与共。\n\
    \n祝福中国，祝福《元宇宙》！\n\n维塔利克·布特林  \n\n电脑工程师  \n\n以太坊共同创办人  \n\n2021年7月22日\n\n# 序三 \
    \ \n\n元宇宙：新一代无限网络\n\n什么是“元宇宙”？\n\n正所谓“一千个人眼里就有一千个哈姆雷特”。\n\n解释什么是元宇宙，也可以有多个角度、多个层次。\n\
    \n而我，更愿意从“人”的角度来解释什么是“元宇宙”。\n\n元宇宙是人类数字化生存的最高形态。互联网让人有了线上“化身”，于是，有人说，“在互联网上，没有人知道你是一条狗”；元宇宙让人有了数字世界的“分身”：一个虚拟数字人的你，既与现实世界的你是数字孪生的一对，又是原生于数字世界的另一个你，可能比现实世界的你要更丰富多彩、生动灵现、角色多元。元宇宙也是人的社会、人的世界。只不过，它是人的虚拟社会、人的数字世界。\n\
    \n因此，元宇宙本质上也会像过去几千年的现实社会一样，人类总是在致力于使其繁衍生息、绵绵不绝。越深入了解元宇宙，越觉得它像极了哲学家、宗教学者詹姆斯·卡斯描绘的“无限的游戏”。在无限的游戏里，没有时间、空间，没有结束、终局；只有贡献者，没有输者赢家；所有参与者都在设法让游戏能够无限持续下去。正如他在《有限与无限的游戏》一书中所说“无限游戏的参与者在所有故事中都不是严肃的演员，而是愉悦的诗人。这一故事永远在继续，没有尽头”。很难设想元宇宙会类似竞技运动或者博彩游戏。你的数字“化身”，生命周期可以是无限的，尤其是在AI的帮助下，甚至可以让你在身后活出更大的精彩。\n\
    \n复杂系统科学发源地圣塔菲研究所的前所长、物理学家杰弗里·韦斯特在其《规模：复杂世界的简单法则》一书中，探讨了生物、企业、城市的成长与消亡的周期问题。城市的兴衰跨越数百年，而企业的兴衰平均只有数十年。没有任何一家企业的寿命能够超越一座城市。其中一个最重要的原因就在于企业是一个自上而下的封闭系统，以市场竞争为手段，以追求利润最大化为目标，因此总是遵循边际成本递增、边际收益递减的规律。规模永远是企业不可逾越的“边界”；而城市则是一个开放、包容的系统，呈现出生态体系的特征。城市的人口数量每增加1倍，公共配套设施只需要增加0.85倍，而知识传播、工作岗位和创新能力，都会因为人群的集聚而成倍增长。城市遵循的是规模成本递减、规模收益递增的规律。\n\
    \n元宇宙就是这样一个规模成本递减、规模收益递增的生态系统，因此能生生不息、延绵不绝。\n\n这样一个“无限游戏”的元宇宙，它的治理结构是分布式、去中心、自组织的。加入元宇宙是无须许可的，沉浸在元宇宙中是自由自在的。元宇宙制定规则依靠的是共识，遵守规则依靠的是自治。\n\
    \n这样一个“无限游戏”的元宇宙，它的经济模式是“利益相关者制度”。价值共创者就是利益共享者，没有股东、高管、员工之分。所有参与者“共建、共创、共治、共享”。\n\
    \n这样一个“无限游戏”的元宇宙，它的商业模型是创作者驱动。互联网是消费者驱动，用户数是互联网估值的核心指标。区块链是技术开发者驱动，开发者社区的建立是区块链成功的标志。元宇宙是内容创作者驱动，丰富多彩、引人入胜的内容是元宇宙“无限游戏”的关键。\n\
    \n元宇宙不是下一代互联网，而是下一代网络。CT技术构成了通信网络；计算机互联网构成了信息网络；而人类社会迈入数字化时代，AI、云计算、区块链等构成了数字网络。元宇宙是新一代的网络：数字网络。\n\
    \n赵国栋、易欢欢、徐远重三位朋友，思维敏捷、唯实唯新！当他们告诉我，他们合作写了一本关于元宇宙的著作时，我着实惊讶于他们的手疾眼快！细读书稿，获益良多！于是本着写一个读书笔记的初衷，欣然应允为本书作序，祝《元宇宙》一纸风行，洛阳纸贵！\n\
    \n肖风  \n\n万向区块链公司董事长  \n\n2021年7月28日\n\n# 序四  \n\n元宇宙，人类的初心"
  fmt: "\n美国的未来学家雷蒙德·库茨魏尔（Ray Kurzweil）于1986年出版的《智能机器人的时代》（The Age of Intelligent\
    \ Machines）一书中，将人类社会的进化概念分成了六个纪元：第一纪元，物理和化学；第二纪元，生物与DNA；第三纪元，大脑；第四纪元，技术；第五纪元，智慧和技术的结合；第六纪元，宇宙的觉醒。在这个阶段，传统人类成为非生物人类，也就是半个机器人，升级成人类3.0版本，宇宙面临奇点的最终命运。\n\
    \n美国社会学家弗朗西斯·福山（Francis Fukuyama）在他的著作《我们的后人类未来：生物技术革命的后果》（Our Posthuman Future:\
    \ Consequences of the Biotechnology Revolution）中指出：现代生物技术生产的最大危险在于它有可能修改乃至改变人类的本性，“人性终将被生物技术掏空，从而把我们引入后人类的历史时代”。\n\
    \n现在，现实人类和他们创造的虚拟人，正在形成新的社会关系与情感连接，成为开拓“元宇宙”边界的先驱者，并在虚拟新大陆上构建“后人类社会”。\n\n值得注意的是，1990年左右出生的“Y”世代人群，对即时通信、网游、云计算具有天然的接受能力，更在意生活体验，是同时生活在现实世界和虚拟世界的第一代，带动了“YOLO（You\
    \ OnlyLive Once）文化”的兴起。但是，2010年之后出生的新一代，则是人类历史上与生俱来与尖端科技互动，并将科学技术进步完全融入自己生活的第一代人，也将是“元宇宙”完全意义的“原住民”，已经开始参与“元宇宙”的构建，推动“元宇宙”向更高阶的维度发展。\n\
    \n也可以将“后人类社会”形成过程想象为生命形态从所谓的“碳基生命”向“硅基生命”过渡的过程。其间自始至终会存在两种演变：一种演变是生物学的、信息论的、技术的演变；另一种演变则是伦理、文化和社会层面的。这两种演变都同时充满期望和难以预期风险的前景。有一种说法：在未来，90%以上的人类活动，如科研、艺术、教学、开发、设计，都会在元宇宙中进行[^(\\\
    [2\\])](#part0003.xhtml#comment_1389)。所以，如何评估“元宇宙”模式的风险，需要尽早提上日程。\n\n## 六\n\n\
    “元宇宙”时代的到来，不是未来时，而是现在进行时。因此，有一系列新的问题需要考量：\n\n第一，如何确定“元宇宙”价值取向、制度选择和秩序。在现实世界，当下的人类具有完全不同的甚至对立的价值取向，还有不同信仰，特别是宗教信仰。所以，“元宇宙”需要面对这些富有挑战性的课题：如何避免简单复制现实世界的价值观？如何实现“元宇宙”的“制度”设计？在“制度”设计中要不要坚持自由、主权、正义、平等之类的原则？怎样确定“元宇宙”的秩序和运行规则？何以制定“元宇宙”宪章？简言之，如何确定支持“元宇宙”文明框架的体系？\n\
    \n第二，如何制定“元宇宙”内在的经济规则。在“元宇宙”中，不存在人类经历的农耕社会和工业社会，也不存在现实世界的传统产业结构。在“元宇宙”中，“观念经济”将是经济活动的基本形态，金融货币的天然形式不可能再是贵金属，而是虚拟的社会货币。现在，处于早期阶段的“元宇宙”经济体系，可以移植和试验所有数字经济创新成果，包括各类数字货币，试验合作经济、共享经济和普惠金融，消除在现实世界难以改变的“贫富差距”。\n\
    \n第三，怎样避免“元宇宙”内在垄断。“元宇宙”具有避免被少数力量垄断的基因。Roblox的联合创始人Neil Rimer提出：Metaverse的能量将来自用户，而不是公司。任何单独一家公司是不可能建立“元宇宙”的，而是要依靠来自各方的集合力量。Epic公司CEO蒂姆·斯威尼（Tim\
    \ Sweeney）也强调：“元宇宙”另一个关键要素在于，它并非出自哪一家行业巨头之手，而是数以百万计的人们共同创作的结晶。每个人都通过内容创作、编程和游戏设计为“元宇宙”做出自己的贡献，还可以通过其他方式为“元宇宙”增加价值。2020年，国内流行一种“全真互联网”的概念。这样的概念忽视了互联网与区块链结合的趋势，以及Web\
    \ 3.0的非中心化的特征。“全真互联网”让人们想到金庸小说《射雕英雄传》与《神雕侠侣》所描写的江湖世界中的那个“全真派”。\n\n第四，如何预防“元宇宙”的霸权主义和“元宇宙”之间的冲突。在未来，“元宇宙”并不是“一个”宇宙，新的“元宇宙”会不断涌现，形成多元化的“元宇宙”体系，如同“太阳系”和“银河系”。不仅如此，“元宇宙”是开放的，任何一个“元宇宙”的居民都可以同时生活在不同的“元宇宙”中。“元宇宙”也存在进化，在这样的场景下，需要建立“元宇宙”之间和谐共存的规则，消除人类曾经构想的“星球大战”的任何可能性。\n\
    \n第五，如何维系现实世界和“元宇宙”之间的正面互动关系。可以预见，因为“元宇宙”，人可以同时栖息在真实与虚拟世界中，导致人的神经感知延伸，意识扩展。“元宇宙”的形成与发展，需要与现实世界互动，实现两个世界从理念、技术到文化层面的互补和平衡，形成新的文明生态。在“元宇宙”早期阶段，两个世界的互动关系还是通过现实人类不断改变存在身份，以及虚拟机和预言机作为技术性媒介实现的。如果人类和他们的虚拟生命在“元宇宙”的社会活动和生活方式中获得更多的幸福，将这样的感受和体验带回到现实世界，有利于现实世界向善改变，有助于深刻认知“人类共同体”理念。\n\
    \n第六，如何协调资本、政府和民众参与创建“元宇宙”。创建“元宇宙”，政府、资本和民众都有各自的功能。在早期，政府的作用相当重要。2021年5月18日，韩国宣布建立一个由当地公司组成的“元宇宙联盟”，其目标是建立统一的国家级VR和AR的增强现实平台，理清虚拟环境的道德和法律规范，确保元宇宙“不是一个被单一大公司垄断的空间”，将虚拟服务作为一个新的公共品。韩国的“元宇宙联盟”构想值得我们关注和学习。\n\
    \n对上述问题的考量，其实都没有彻底摆脱和超越作为当下“人类”的思考模式。如果是“元宇宙”的全新思考范式，就应该相信，“元宇宙”一旦形成，就会有自己的生命力，以及自我调整和演变的内在动力。\n\
    \n## 七\n\n人类在关注和参与“元宇宙”的形成与发展过程中，传统的生命概念、时空概念、能量概念、族群概念、经济概念和价值观念都会被改变和颠覆，触及哲学，甚至伦理学。\n\
    \n因为“元宇宙”，导致人们重新思考基本的哲学概念：先验知识、存在和存在主义、经验主义、二元论、语言本质、超现实社会、单向度，进而影响对以下哲学家所提出的哲学思辨的认知。\n\
    \n第一，笛卡儿（René Descartes）的“二元论”。笛卡儿认为，心灵和身体是两个不同的领域，进而提出是否存在支配两者的普遍法则的问题。在“元宇宙”世界，心灵和身体发生重合，完全实现了“我思故我在”。只有在认识论（epistemology）的意义上，世界才是依赖主体的，或者说是主体建构了世界的性质。\n\
    \n第二，萨特（Jean-Paul Sartre）的“存在”与“虚无”的关系。萨特的代表作《存在与虚无》（L’Être et le Néant），通过“存在与虚无”的二元性代替了“物与人”的二元性，进而提出人被虚无所包围，虚无即是人的真实存在，人终究被非存在所制约。所以，人就是虚无，并且是一切虚无之源。而“元宇宙”的本质，实现了存在和虚无的真实“关联”和“统一”。\n\
    \n第三，福柯（Michel Foucault）的“我应该是什么”。根据福柯的《词与物》（Les Mots et les choses: un archeologie\
    \ des sciences humaines），在18世纪末以前，并不存在人。“人”是新近的产物，是现代认识型的产物。因此，在《词与物》一书的最后一页写道：“人将被抹去，如同大海边沙地上的一张脸。”于是，“人之死”（deathof\
    \ men）就不可避免。福柯的后现代理论对现代体制的质疑，为虚拟空间和“元宇宙”造就替代传统人类的“新人类”提供了合法性缘由。\n\n第四，海德格尔（Martin\
    \ Heidegger）和维特根斯坦（LudwigWittgenstein）的“语言就是世界”。海德格尔认为，语言并不是一个表达世界观的工具，语言本身就是世界。维特根斯坦的语言理念则是：语言就是游戏，也是一种生活形式。“元宇宙”的语言系统不同于传统人类自然语言，而是计算机程序语言，以及代码转化的文本、声音、图像、视频，以及其他符号形式，进而构成新的文明规则。所以，其中的活动与游戏，以及语言游戏之间并没有清晰的边界。如果海德格尔和维特根斯坦看到“元宇宙”的语言深层结构，他们会重新定义语言与人类社会活动的关系。\n\
    \n第五，博德里亚尔（Jean Baudrillard）的“大众化的虚无世界”。博德里亚尔在他的《在沉默的大多数的阴影下》（À l’ombre des majorités\
    \ silencieuses）中，表现出对当代社会的敏锐观察：旧的阶级结构瓦解，传统社会秩序的所有支点都不可避免地“中性化”，进入了所谓的大众化的虚无世界，或者虚无状态，现实与虚构之间的界限已经消失。不得不承认，“元宇宙”就是现代社会走向虚无趋势的一种具有积极意义的显现。\n\
    \n结束本文的时候，要对中国历史上的哲人充满崇敬之心。南宋哲学家陆九渊（1139—1193年）在延续自战国时代关于“宇宙”的诠释，即“四方上下曰宇，往古来今曰宙”的基础上，进而提出“宇宙便是吾心，吾心即是宇宙”，确认了“心学”的内核。之后的明朝哲学家王阳明（1472—1529年）将“心学”提到了前所未有的高度，指出“无心外之理，无心外之物”。当今，要认知“元宇宙”的真谛，需要参透陆九渊和王阳明深邃的思想。\n\
    \n朱嘉明  \n著名经济学家  \n珠海市横琴新区数链数字金融研究院学术与技术委员会主席  \n2021年6月12日\n\n* * *\n\n### 注释\n\
    \n[\\[1\\]](#part0003.xhtml#commentRef_548) 《雪崩》相关译文：“名片背面是一堆杂乱的联络方式：电话号码、全球语音电话定位码、邮政信箱号码、六个电子通信网络上的网址，还有一个‘元宇宙’中的地址。”在《雪崩》的中文译本（郭泽译，四川科学技术出版社2009年版）中，“Metaverse”被翻译为“超元域”。\n\
    \n[\\[2\\]](#part0003.xhtml#commentRef_1372) 参见吴啸《“元宇宙”——21世纪的出埃及记》。\n\n# 序二\n\
    \n“元宇宙”与“区块链”\n\n在得知中译出版社即将出版《元宇宙》和《元宇宙通证》两本书的消息时，我非常兴奋和激动。我一直十分关注“元宇宙”的概念，这个概念与区块链密不可分，却具有更加宏大的意义，两者相辅相成。可以说，正因为有了区块链，元宇宙才能从平平无奇的“虚拟世界”跃迁到开天辟地的“宇宙”。\n\
    \n区块链是一个全球性、安全、点对点的网络，但在全球范围内，它并不是第一个点对点网络，也不是第一个应用密码技术的网络，更不是第一个允许人们远距离交流的网络。全球P2P文件共享网络BitTorrent已经存在了15年，让世界各地的人共享网络资源；它也作为一个平台让相距很远的人仍然可以很容易地相互交流。区块链也并不是第一个做到这一点的技术。互联网在过去的几十年中已经取得了很大的进步。\n\
    \n密码学（让人们相互信任的技术）已经有近40年的历史，它允许我们进行远程交互而不需要信任参与这个过程的每个人。在使用因特网时，几乎所有计算机或电话与运行某些应用程序的服务器之间的通信都是加密的。\n\
    \n密码学非常有价值。密码学确保消息的内容只能被打算阅读它的人看到，保证消息的内容不会在此过程中更改，也确保消息的发送者是他们所说的自己。\n\n但有很多东西是密码学无法实现的。比如：密码学无法告诉你消息是何时创建或何时发布的，它不能证明某些信息在一段时间之前就存在了，也不能证明某人是否确认了该信息。密码学无法使参与者达成一致共识。在金融体系中，如果每个参与者对所有人资产的共同价值没有共识，金融体系就无法运转。密码学不能提供经济激励，因为它不能提供股权证明和支付渠道，然而许多技术在很大程度上依赖于经济激励。密码学不能证明来自真实世界的信息。你无法用数学方法证明香港的温度是100华氏度，也无法用数学方法证明美元对港元的汇率是1:7.18。现实世界的大部分事情是无法证明的。\n\
    \n虽然区块链不能解决所有问题，却解决了加密技术不能解决的许多问题。\n\n区块链技术不是简单的点对点网络和密码技术的线性组合，最重要的是它让全部的区块链网络参与者取得共识。区块链网络中的每个节点，都成了历史的见证者，从而避免了因缺乏信任而无法完成操作。\n\
    \n我们现在拥有的大多数应用程序都试图使用某种集中式数据库。因为某些应用程序在互联网上有相当大的数据库（如QQ、微信、支付宝等），所以近年来有许多垄断情况出现。\n\
    \n应用程序的用户越多，想要查看数据库的用户就越多，其他用户便有更多的机会可以快速、轻松地与已经存在的用户进行交互。这意味着，对于一个小公司而言，即使产品再好也难以与大公司竞争。\n\
    \n区块链的数据库和账本不依赖特定公司存在。两个不同的公司可以以分布式数据库和密码学保护用户隐私，获得网络效应带来的好处，躲避大公司的垄断，这样一来，大公司主导某个行业的情况就再难发生。\n\
    \n有很多网站已经有了明显的网络效应，但其数据不被特定公司控制，维基百科就是一个很好的例子。人们所做的不仅是分享信息，还可以分享共识，甚至余额、账户。\n\n\
    所以当你在一个建立在区块链上的、完全开放的平台时，其强大的网络效应会让你更容易地享受到应用程序带来的好处。这不仅局限于一个行业，它可以跨越不同的行业和国家。\n\
    \n区块链的应用领域非常广阔，囊括支付、预订、个人身份认证等。\n\n支付最先发挥作用。人们对代币、货币、各种金融工具都很感兴趣。举一个非常有趣的例子，在一些愿意提升透明度的领域中（如慈善组织），对于那些对公开预算使用情况有需求的国家，区块链支付在这些领域大有裨益。\n\
    \n虽然我们现在能用区块链订火车票、订旅馆、订机票，但在这些过程中，还有很多低效之处需要改进，而区块链最能发挥作用的领域就是协调多方参与场景。\n\n这些年有些人一直在推的“上链”进展并不明显。一个很重要的原因是，上链资产和实物很可能存在不一致的情况，而这无法通过区块链网络自身来得到保证。但是在元宇宙中，所有的资产都是数字化的，天然就存在于网络上。严格意义上来说，元宇宙的所有资产都可以基于区块链网络。上述种种好处，尤其能避免元宇宙中数字资产集中于大公司手中，导致创新的小企业举步维艰。区块链保障了元宇宙居民自身拥有数据的权利，把数据的权利归还给元宇宙的居民。\n\
    \n元宇宙对于区块链的发展同样至关重要。元宇宙的数字资产规模很可能在很短的时间内就会超越物理世界，在高速增长的环境中，区块链更能大展拳脚。\n\n现在全世界都在关注中国，关注中国元宇宙。我相信，元宇宙在中国的未来是光明的。我们要运用好区块链技术，完善区块链技术，推动元宇宙的发展。尽管元宇宙中的居民生活在不同的国家，但元宇宙是超越国界的。我也在关注中国的理念，譬如“人类命运共同体”。虽然这个理念和中国的历史一样古老，却和最潮的元宇宙的精神内核息息相通。在元宇宙中，我们借助区块链技术实现了同一个元宇宙的共同体；在每一个元宇宙中，他们都休戚与共。\n\
    \n祝福中国，祝福《元宇宙》！\n\n维塔利克·布特林  \n电脑工程师  \n以太坊共同创办人  \n2021年7月22日\n\n# 序三\n\n元宇宙：新一代无限网络\n\
    \n什么是“元宇宙”？\n\n正所谓“一千个人眼里就有一千个哈姆雷特”。\n\n解释什么是元宇宙，也可以有多个角度、多个层次。\n\n而我，更愿意从“人”的角度来解释什么是“元宇宙”。\n\
    \n元宇宙是人类数字化生存的最高形态。互联网让人有了线上“化身”，于是，有人说，“在互联网上，没有人知道你是一条狗”；元宇宙让人有了数字世界的“分身”：一个虚拟数字人的你，既与现实世界的你是数字孪生的一对，又是原生于数字世界的另一个你，可能比现实世界的你要更丰富多彩、生动灵现、角色多元。元宇宙也是人的社会、人的世界。只不过，它是人的虚拟社会、人的数字世界。\n\
    \n因此，元宇宙本质上也会像过去几千年的现实社会一样，人类总是在致力于使其繁衍生息、绵绵不绝。越深入了解元宇宙，越觉得它像极了哲学家、宗教学者詹姆斯·卡斯描绘的“无限的游戏”。在无限的游戏里，没有时间、空间，没有结束、终局；只有贡献者，没有输者赢家；所有参与者都在设法让游戏能够无限持续下去。正如他在《有限与无限的游戏》一书中所说“无限游戏的参与者在所有故事中都不是严肃的演员，而是愉悦的诗人。这一故事永远在继续，没有尽头”。很难设想元宇宙会类似竞技运动或者博彩游戏。你的数字“化身”，生命周期可以是无限的，尤其是在AI的帮助下，甚至可以让你在身后活出更大的精彩。\n\
    \n复杂系统科学发源地圣塔菲研究所的前所长、物理学家杰弗里·韦斯特在其《规模：复杂世界的简单法则》一书中，探讨了生物、企业、城市的成长与消亡的周期问题。城市的兴衰跨越数百年，而企业的兴衰平均只有数十年。没有任何一家企业的寿命能够超越一座城市。其中一个最重要的原因就在于企业是一个自上而下的封闭系统，以市场竞争为手段，以追求利润最大化为目标，因此总是遵循边际成本递增、边际收益递减的规律。规模永远是企业不可逾越的“边界”；而城市则是一个开放、包容的系统，呈现出生态体系的特征。城市的人口数量每增加1倍，公共配套设施只需要增加0.85倍，而知识传播、工作岗位和创新能力，都会因为人群的集聚而成倍增长。城市遵循的是规模成本递减、规模收益递增的规律。\n\
    \n元宇宙就是这样一个规模成本递减、规模收益递增的生态系统，因此能生生不息、延绵不绝。\n\n这样一个“无限游戏”的元宇宙，它的治理结构是分布式、去中心、自组织的。加入元宇宙是无须许可的，沉浸在元宇宙中是自由自在的。元宇宙制定规则依靠的是共识，遵守规则依靠的是自治。\n\
    \n这样一个“无限游戏”的元宇宙，它的经济模式是“利益相关者制度”。价值共创者就是利益共享者，没有股东、高管、员工之分。所有参与者“共建、共创、共治、共享”。\n\
    \n这样一个“无限游戏”的元宇宙，它的商业模型是创作者驱动。互联网是消费者驱动，用户数是互联网估值的核心指标。区块链是技术开发者驱动，开发者社区的建立是区块链成功的标志。元宇宙是内容创作者驱动，丰富多彩、引人入胜的内容是元宇宙“无限游戏”的关键。\n\
    \n元宇宙不是下一代互联网，而是下一代网络。CT技术构成了通信网络；计算机互联网构成了信息网络；而人类社会迈入数字化时代，AI、云计算、区块链等构成了数字网络。元宇宙是新一代的网络：数字网络。\n\
    \n赵国栋、易欢欢、徐远重三位朋友，思维敏捷、唯实唯新！当他们告诉我，他们合作写了一本关于元宇宙的著作时，我着实惊讶于他们的手疾眼快！细读书稿，获益良多！于是本着写一个读书笔记的初衷，欣然应允为本书作序，祝《元宇宙》一纸风行，洛阳纸贵！\n\
    \n肖风  \n万向区块链公司董事长  \n2021年7月28日\n\n# 序四\n\n元宇宙，人类的初心\n"
  trans: "\n\n美国的未来学家雷蒙德·库茨魏尔（Ray Kurzweil）于 1986 年出版的《智能机器人的时代》（The Age of Intelligent\
    \ Machines）一书中，将人类社会的进化概念分成了六个纪元：第一纪元，物理和化学；第二纪元，生物与 DNA；第三纪元，大脑；第四纪元，技术；第五纪元，智慧和技术的结合；第六纪元，宇宙的觉醒。在这个阶段，传统人类成为非生物人类，也就是半个机器人，升级成人类\
    \ 3.0 版本，宇宙面临奇点的最终命运。\n\n美国社会学家弗朗西斯·福山（Francis Fukuyama）在他的著作《我们的后人类未来：生物技术革命的后果》（Our\
    \ Posthuman Future: Consequences of the Biotechnology Revolution）中指出：现代生物技术生产的最大危险在于它有可能修改乃至改变人类的本性，“人性终将被生物技术掏空，从而把我们引入后人类的历史时代”。\n\
    \n现在，现实人类和他们创造的虚拟人，正在形成新的社会关系与情感连接，成为开拓“元宇宙”边界的先驱者，并在虚拟新大陆上构建“后人类社会”。\n\n值得注意的是，1990\
    \ 年左右出生的“Y”世代人群，对即时通信、网游、云计算具有天然的接受能力，更在意生活体验，是同时生活在现实世界和虚拟世界的第一代，带动了“YOLO（You\
    \ OnlyLive Once）文化”的兴起。但是，2010 年之后出生的新一代，则是人类历史上与生俱来与尖端科技互动，并将科学技术进步完全融入自己生活的第一代人，也将是“元宇宙”完全意义的“原住民”，已经开始参与“元宇宙”的构建，推动“元宇宙”向更高阶的维度发展。\n\
    \n也可以将“后人类社会”形成过程想象为生命形态从所谓的“碳基生命”向“硅基生命”过渡的过程。其间自始至终会存在两种演变：一种演变是生物学的、信息论的、技术的演变；另一种演变则是伦理、文化和社会层面的。这两种演变都同时充满期望和难以预期风险的前景。有一种说法：在未来，90%以上的人类活动，如科研、艺术、教学、开发、设计，都会在元宇宙中进行[^(\\\
    [2\\])](#part0003.xhtml#comment_1389)。所以，如何评估“元宇宙”模式的风险，需要尽早提上日程。\n\n## 六\n\n\
    “元宇宙”时代的到来，不是未来时，而是现在进行时。因此，有一系列新的问题需要考量：\n\n第一，如何确定“元宇宙”价值取向、制度选择和秩序。在现实世界，当下的人类具有完全不同的甚至对立的价值取向，还有不同信仰，特别是宗教信仰。所以，“元宇宙”需要面对这些富有挑战性的课题：如何避免简单复制现实世界的价值观？如何实现“元宇宙”的“制度”设计？在“制度”设计中要不要坚持自由、主权、正义、平等之类的原则？怎样确定“元宇宙”的秩序和运行规则？何以制定“元宇宙”宪章？简言之，如何确定支持“元宇宙”文明框架的体系？\n\
    \n第二，如何制定“元宇宙”内在的经济规则。在“元宇宙”中，不存在人类经历的农耕社会和工业社会，也不存在现实世界的传统产业结构。在“元宇宙”中，“观念经济”将是经济活动的基本形态，金融货币的天然形式不可能再是贵金属，而是虚拟的社会货币。现在，处于早期阶段的“元宇宙”经济体系，可以移植和试验所有数字经济创新成果，包括各类数字货币，试验合作经济、共享经济和普惠金融，消除在现实世界难以改变的“贫富差距”。\n\
    \n第三，怎样避免“元宇宙”内在垄断。“元宇宙”具有避免被少数力量垄断的基因。Roblox 的联合创始人 Neil Rimer 提出：Metaverse 的能量将来自用户，而不是公司。任何单独一家公司是不可能建立“元宇宙”的，而是要依靠来自各方的集合力量。Epic\
    \ 公司 CEO 蒂姆·斯威尼（Tim Sweeney）也强调：“元宇宙”另一个关键要素在于，它并非出自哪一家行业巨头之手，而是数以百万计的人们共同创作的结晶。每个人都通过内容创作、编程和游戏设计为“元宇宙”做出自己的贡献，还可以通过其他方式为“元宇宙”增加价值。2020\
    \ 年，国内流行一种“全真互联网”的概念。这样的概念忽视了互联网与区块链结合的趋势，以及 Web 3.0 的非中心化的特征。“全真互联网”让人们想到金庸小说《射雕英雄传》与《神雕侠侣》所描写的江湖世界中的那个“全真派”。\n\
    \n第四，如何预防“元宇宙”的霸权主义和“元宇宙”之间的冲突。在未来，“元宇宙”并不是“一个”宇宙，新的“元宇宙”会不断涌现，形成多元化的“元宇宙”体系，如同“太阳系”和“银河系”。不仅如此，“元宇宙”是开放的，任何一个“元宇宙”的居民都可以同时生活在不同的“元宇宙”中。“元宇宙”也存在进化，在这样的场景下，需要建立“元宇宙”之间和谐共存的规则，消除人类曾经构想的“星球大战”的任何可能性。\n\
    \n第五，如何维系现实世界和“元宇宙”之间的正面互动关系。可以预见，因为“元宇宙”，人可以同时栖息在真实与虚拟世界中，导致人的神经感知延伸，意识扩展。“元宇宙”的形成与发展，需要与现实世界互动，实现两个世界从理念、技术到文化层面的互补和平衡，形成新的文明生态。在“元宇宙”早期阶段，两个世界的互动关系还是通过现实人类不断改变存在身份，以及虚拟机和预言机作为技术性媒介实现的。如果人类和他们的虚拟生命在“元宇宙”的社会活动和生活方式中获得更多的幸福，将这样的感受和体验带回到现实世界，有利于现实世界向善改变，有助于深刻认知“人类共同体”理念。\n\
    \n第六，如何协调资本、政府和民众参与创建“元宇宙”。创建“元宇宙”，政府、资本和民众都有各自的功能。在早期，政府的作用相当重要。2021 年 5 月 18\
    \ 日，韩国宣布建立一个由当地公司组成的“元宇宙联盟”，其目标是建立统一的国家级 VR 和 AR 的增强现实平台，理清虚拟环境的道德和法律规范，确保元宇宙“不是一个被单一大公司垄断的空间”，将虚拟服务作为一个新的公共品。韩国的“元宇宙联盟”构想值得我们关注和学习。\n\
    \n对上述问题的考量，其实都没有彻底摆脱和超越作为当下“人类”的思考模式。如果是“元宇宙”的全新思考范式，就应该相信，“元宇宙”一旦形成，就会有自己的生命力，以及自我调整和演变的内在动力。\n\
    \n## 七\n\n人类在关注和参与“元宇宙”的形成与发展过程中，传统的生命概念、时空概念、能量概念、族群概念、经济概念和价值观念都会被改变和颠覆，触及哲学，甚至伦理学。\n\
    \n因为“元宇宙”，导致人们重新思考基本的哲学概念：先验知识、存在和存在主义、经验主义、二元论、语言本质、超现实社会、单向度，进而影响对以下哲学家所提出的哲学思辨的认知。\n\
    \n第一，笛卡儿（René Descartes）的“二元论”。笛卡儿认为，心灵和身体是两个不同的领域，进而提出是否存在支配两者的普遍法则的问题。在“元宇宙”世界，心灵和身体发生重合，完全实现了“我思故我在”。只有在认识论（epistemology）的意义上，世界才是依赖主体的，或者说是主体建构了世界的性质。\n\
    \n第二，萨特（Jean-Paul Sartre）的“存在”与“虚无”的关系。萨特的代表作《存在与虚无》（L’Être et le Néant），通过“存在与虚无”的二元性代替了“物与人”的二元性，进而提出人被虚无所包围，虚无即是人的真实存在，人终究被非存在所制约。所以，人就是虚无，并且是一切虚无之源。而“元宇宙”的本质，实现了存在和虚无的真实“关联”和“统一”。\n\
    \n第三，福柯（Michel Foucault）的“我应该是什么”。根据福柯的《词与物》（Les Mots et les choses: un archeologie\
    \ des sciences humaines），在 18 世纪末以前，并不存在人。“人”是新近的产物，是现代认识型的产物。因此，在《词与物》一书的最后一页写道：“人将被抹去，如同大海边沙地上的一张脸。”于是，“人之死”（deathof\
    \ men）就不可避免。福柯的后现代理论对现代体制的质疑，为虚拟空间和“元宇宙”造就替代传统人类的“新人类”提供了合法性缘由。\n\n第四，海德格尔（Martin\
    \ Heidegger）和维特根斯坦（LudwigWittgenstein）的“语言就是世界”。海德格尔认为，语言并不是一个表达世界观的工具，语言本身就是世界。维特根斯坦的语言理念则是：语言就是游戏，也是一种生活形式。“元宇宙”的语言系统不同于传统人类自然语言，而是计算机程序语言，以及代码转化的文本、声音、图像、视频，以及其他符号形式，进而构成新的文明规则。所以，其中的活动与游戏，以及语言游戏之间并没有清晰的边界。如果海德格尔和维特根斯坦看到“元宇宙”的语言深层结构，他们会重新定义语言与人类社会活动的关系。\n\
    \n第五，博德里亚尔（Jean Baudrillard）的“大众化的虚无世界”。博德里亚尔在他的《在沉默的大多数的阴影下》（À l’ombre des majorités\
    \ silencieuses）中，表现出对当代社会的敏锐观察：旧的阶级结构瓦解，传统社会秩序的所有支点都不可避免地“中性化”，进入了所谓的大众化的虚无世界，或者虚无状态，现实与虚构之间的界限已经消失。不得不承认，“元宇宙”就是现代社会走向虚无趋势的一种具有积极意义的显现。\n\
    \n结束本文的时候，要对中国历史上的哲人充满崇敬之心。南宋哲学家陆九渊（1139—1193 年）在延续自战国时代关于“宇宙”的诠释，即“四方上下曰宇，往古来今曰宙”的基础上，进而提出“宇宙便是吾心，吾心即是宇宙”，确认了“心学”的内核。之后的明朝哲学家王阳明（1472—1529\
    \ 年）将“心学”提到了前所未有的高度，指出“无心外之理，无心外之物”。当今，要认知“元宇宙”的真谛，需要参透陆九渊和王阳明深邃的思想。\n\n朱嘉明  \n\
    著名经济学家  \n珠海市横琴新区数链数字金融研究院学术与技术委员会主席  \n2021 年 6 月 12 日\n\n* * *\n\n### 注释\n\n\
    [\\[1\\]](#part0003.xhtml#commentRef_548) 《雪崩》相关译文：“名片背面是一堆杂乱的联络方式：电话号码、全球语音电话定位码、邮政信箱号码、六个电子通信网络上的网址，还有一个‘元宇宙’中的地址。”在《雪崩》的中文译本（郭泽译，四川科学技术出版社\
    \ 2009 年版）中，“Metaverse”被翻译为“超元域”。\n\n[\\[2\\]](#part0003.xhtml#commentRef_1372)\
    \ 参见吴啸《“元宇宙”——21 世纪的出埃及记》。\n\n# 序二\n\n“元宇宙”与“区块链”\n\n在得知中译出版社即将出版《元宇宙》和《元宇宙通证》两本书的消息时，我非常兴奋和激动。我一直十分关注“元宇宙”的概念，这个概念与区块链密不可分，却具有更加宏大的意义，两者相辅相成。可以说，正因为有了区块链，元宇宙才能从平平无奇的“虚拟世界”跃迁到开天辟地的“宇宙”。\n\
    \n区块链是一个全球性、安全、点对点的网络，但在全球范围内，它并不是第一个点对点网络，也不是第一个应用密码技术的网络，更不是第一个允许人们远距离交流的网络。全球\
    \ P2P 文件共享网络 BitTorrent 已经存在了 15 年，让世界各地的人共享网络资源；它也作为一个平台让相距很远的人仍然可以很容易地相互交流。区块链也并不是第一个做到这一点的技术。互联网在过去的几十年中已经取得了很大的进步。\n\
    \n密码学（让人们相互信任的技术）已经有近 40 年的历史，它允许我们进行远程交互而不需要信任参与这个过程的每个人。在使用因特网时，几乎所有计算机或电话与运行某些应用程序的服务器之间的通信都是加密的。\n\
    \n密码学非常有价值。密码学确保消息的内容只能被打算阅读它的人看到，保证消息的内容不会在此过程中更改，也确保消息的发送者是他们所说的自己。\n\n但有很多东西是密码学无法实现的。比如：密码学无法告诉你消息是何时创建或何时发布的，它不能证明某些信息在一段时间之前就存在了，也不能证明某人是否确认了该信息。密码学无法使参与者达成一致共识。在金融体系中，如果每个参与者对所有人资产的共同价值没有共识，金融体系就无法运转。密码学不能提供经济激励，因为它不能提供股权证明和支付渠道，然而许多技术在很大程度上依赖于经济激励。密码学不能证明来自真实世界的信息。你无法用数学方法证明香港的温度是\
    \ 100 华氏度，也无法用数学方法证明美元对港元的汇率是 1:7.18。现实世界的大部分事情是无法证明的。\n\n虽然区块链不能解决所有问题，却解决了加密技术不能解决的许多问题。\n\
    \n区块链技术不是简单的点对点网络和密码技术的线性组合，最重要的是它让全部的区块链网络参与者取得共识。区块链网络中的每个节点，都成了历史的见证者，从而避免了因缺乏信任而无法完成操作。\n\
    \n我们现在拥有的大多数应用程序都试图使用某种集中式数据库。因为某些应用程序在互联网上有相当大的数据库（如 QQ、微信、支付宝等），所以近年来有许多垄断情况出现。\n\
    \n应用程序的用户越多，想要查看数据库的用户就越多，其他用户便有更多的机会可以快速、轻松地与已经存在的用户进行交互。这意味着，对于一个小公司而言，即使产品再好也难以与大公司竞争。\n\
    \n区块链的数据库和账本不依赖特定公司存在。两个不同的公司可以以分布式数据库和密码学保护用户隐私，获得网络效应带来的好处，躲避大公司的垄断，这样一来，大公司主导某个行业的情况就再难发生。\n\
    \n有很多网站已经有了明显的网络效应，但其数据不被特定公司控制，维基百科就是一个很好的例子。人们所做的不仅是分享信息，还可以分享共识，甚至余额、账户。\n\n\
    所以当你在一个建立在区块链上的、完全开放的平台时，其强大的网络效应会让你更容易地享受到应用程序带来的好处。这不仅局限于一个行业，它可以跨越不同的行业和国家。\n\
    \n区块链的应用领域非常广阔，囊括支付、预订、个人身份认证等。\n\n支付最先发挥作用。人们对代币、货币、各种金融工具都很感兴趣。举一个非常有趣的例子，在一些愿意提升透明度的领域中（如慈善组织），对于那些对公开预算使用情况有需求的国家，区块链支付在这些领域大有裨益。\n\
    \n虽然我们现在能用区块链订火车票、订旅馆、订机票，但在这些过程中，还有很多低效之处需要改进，而区块链最能发挥作用的领域就是协调多方参与场景。\n\n这些年有些人一直在推的“上链”进展并不明显。一个很重要的原因是，上链资产和实物很可能存在不一致的情况，而这无法通过区块链网络自身来得到保证。但是在元宇宙中，所有的资产都是数字化的，天然就存在于网络上。严格意义上来说，元宇宙的所有资产都可以基于区块链网络。上述种种好处，尤其能避免元宇宙中数字资产集中于大公司手中，导致创新的小企业举步维艰。区块链保障了元宇宙居民自身拥有数据的权利，把数据的权利归还给元宇宙的居民。\n\
    \n元宇宙对于区块链的发展同样至关重要。元宇宙的数字资产规模很可能在很短的时间内就会超越物理世界，在高速增长的环境中，区块链更能大展拳脚。\n\n现在全世界都在关注中国，关注中国元宇宙。我相信，元宇宙在中国的未来是光明的。我们要运用好区块链技术，完善区块链技术，推动元宇宙的发展。尽管元宇宙中的居民生活在不同的国家，但元宇宙是超越国界的。我也在关注中国的理念，譬如“人类命运共同体”。虽然这个理念和中国的历史一样古老，却和最潮的元宇宙的精神内核息息相通。在元宇宙中，我们借助区块链技术实现了同一个元宇宙的共同体；在每一个元宇宙中，他们都休戚与共。\n\
    \n祝福中国，祝福《元宇宙》！\n\n维塔利克·布特林  \n电脑工程师  \n以太坊共同创办人  \n2021 年 7 月 22 日\n\n# 序三\n\n\
    元宇宙：新一代无限网络\n\n什么是“元宇宙”？\n\n正所谓“一千个人眼里就有一千个哈姆雷特”。\n\n解释什么是元宇宙，也可以有多个角度、多个层次。\n\
    \n而我，更愿意从“人”的角度来解释什么是“元宇宙”。\n\n元宇宙是人类数字化生存的最高形态。互联网让人有了线上“化身”，于是，有人说，“在互联网上，没有人知道你是一条狗”；元宇宙让人有了数字世界的“分身”：一个虚拟数字人的你，既与现实世界的你是数字孪生的一对，又是原生于数字世界的另一个你，可能比现实世界的你要更丰富多彩、生动灵现、角色多元。元宇宙也是人的社会、人的世界。只不过，它是人的虚拟社会、人的数字世界。\n\
    \n因此，元宇宙本质上也会像过去几千年的现实社会一样，人类总是在致力于使其繁衍生息、绵绵不绝。越深入了解元宇宙，越觉得它像极了哲学家、宗教学者詹姆斯·卡斯描绘的“无限的游戏”。在无限的游戏里，没有时间、空间，没有结束、终局；只有贡献者，没有输者赢家；所有参与者都在设法让游戏能够无限持续下去。正如他在《有限与无限的游戏》一书中所说“无限游戏的参与者在所有故事中都不是严肃的演员，而是愉悦的诗人。这一故事永远在继续，没有尽头”。很难设想元宇宙会类似竞技运动或者博彩游戏。你的数字“化身”，生命周期可以是无限的，尤其是在\
    \ AI 的帮助下，甚至可以让你在身后活出更大的精彩。\n\n复杂系统科学发源地圣塔菲研究所的前所长、物理学家杰弗里·韦斯特在其《规模：复杂世界的简单法则》一书中，探讨了生物、企业、城市的成长与消亡的周期问题。城市的兴衰跨越数百年，而企业的兴衰平均只有数十年。没有任何一家企业的寿命能够超越一座城市。其中一个最重要的原因就在于企业是一个自上而下的封闭系统，以市场竞争为手段，以追求利润最大化为目标，因此总是遵循边际成本递增、边际收益递减的规律。规模永远是企业不可逾越的“边界”；而城市则是一个开放、包容的系统，呈现出生态体系的特征。城市的人口数量每增加\
    \ 1 倍，公共配套设施只需要增加 0.85 倍，而知识传播、工作岗位和创新能力，都会因为人群的集聚而成倍增长。城市遵循的是规模成本递减、规模收益递增的规律。\n\
    \n元宇宙就是这样一个规模成本递减、规模收益递增的生态系统，因此能生生不息、延绵不绝。\n\n这样一个“无限游戏”的元宇宙，它的治理结构是分布式、去中心、自组织的。加入元宇宙是无须许可的，沉浸在元宇宙中是自由自在的。元宇宙制定规则依靠的是共识，遵守规则依靠的是自治。\n\
    \n这样一个“无限游戏”的元宇宙，它的经济模式是“利益相关者制度”。价值共创者就是利益共享者，没有股东、高管、员工之分。所有参与者“共建、共创、共治、共享”。\n\
    \n这样一个“无限游戏”的元宇宙，它的商业模型是创作者驱动。互联网是消费者驱动，用户数是互联网估值的核心指标。区块链是技术开发者驱动，开发者社区的建立是区块链成功的标志。元宇宙是内容创作者驱动，丰富多彩、引人入胜的内容是元宇宙“无限游戏”的关键。\n\
    \n元宇宙不是下一代互联网，而是下一代网络。CT 技术构成了通信网络；计算机互联网构成了信息网络；而人类社会迈入数字化时代，AI、云计算、区块链等构成了数字网络。元宇宙是新一代的网络：数字网络。\n\
    \n赵国栋、易欢欢、徐远重三位朋友，思维敏捷、唯实唯新！当他们告诉我，他们合作写了一本关于元宇宙的著作时，我着实惊讶于他们的手疾眼快！细读书稿，获益良多！于是本着写一个读书笔记的初衷，欣然应允为本书作序，祝《元宇宙》一纸风行，洛阳纸贵！\n\
    \n肖风  \n万向区块链公司董事长  \n2021 年 7 月 28 日\n\n# 序四\n\n元宇宙，人类的初心\n\n"
