    ## 数据层

    数据层在社会层面需要关注数据治理和数据安全问题，原因主要有两点：一方面，很多互联网公司霸权，独享数据，导致小企业发展受限，如此一来大型互联网公司的权力将越来越大，这就形成了数据黑洞。怎么样去平衡，使各公司都获得均等使用数据的权利是一个值得讨论的话题。另一方面，数据集中之后，数据安全问题就很明显，数据不集中时，获取全部数据可能比较困难，只能收集到单一数据；但是数据一旦集中，只要攻破一个点，全部数据都将受到威胁，如何保证数据的安全性也是一个重要问题。


    ## 规则层

    要想让数据真正落地应用，必须建立一系列的规则，构建完善的监管体系。从数字市场角度来说，必须针对数字化的交易建立一套新的规则，保证市场有效运行。从系统论的角度来看，万物之间存在联系，而哪些联系需要加强、哪些联系需要削弱，则需要通过规则的建立来确定。数字经济基础设施的规则层大体可以分为约束环境与数字监管两大内容。所谓约束环境指由政府、行业协会、大型企业等制定的法律法规、行业规则、技术标准、规章等一系列从硬到软的制度，为数字经济有序、高效运行提供制度保障环境。其中一些规则可能会直接影响到某些行业的发展，如微信订阅号规则的变化，可能直接导致以微信为中心的生态的变化。数字监管则是保证规则充分落地的制度手段，同时也是保证数字市场自由的重要基础。没有充分的监管则没有自由市场，即使数字监管作为公共服务没有任何经济价值，它也是保障其他人按照规则获得合法、合规经济收益的手段，政府也应该并且必须大力发展数字监管，保证数字市场有序运行。


    数字经济时代的规则与以往规则存在明显不同。首先，实物资源是不可分割、无法共享的，确权相对容易，而数据资源可以无限共享，共享之后自己仍然拥有，边界确权与保护是需要重点考虑的问题。其次，规则建立的主题也有所不同，计划经济中的规则都是由政府制定的；传统市场中的规则是由行业协会或自治组织制定；而数字市场中很多规则由社区来制定，社区作为一个越来越重要的主体被提出来，也可以成为规则的制定者。最后，数字市场规则能够有效解决传统市场失灵问题。传统市场的失灵现象，一部分原因是一些市场主体具备了破坏规则的能力，规则被破坏后便无法保证公平，而在数字经济中很多规则可以通过程序实现，即“Code
    is Law”。例如，通过“智能合约”在程序中体现一些交易的具体玩法，这些规则是不可修改的，可以有效避免传统市场中不公平现象的发生。


    在数字市场中，规则的制定可能引发主导权之争。从微观层面来看，规则代表利益，各大参与主体争夺规则制定权，最大化自身利益的战争始终没有停歇。例如，手机硬件设施厂商与微信等软件公司的规则制定权争夺战，直接关系到利益的归属。从宏观层面来看，如何通过规则制定引导数字市场的发展方向，如何制定规则才能最大限度发挥数据价值，是国家政策应该考虑的问题。规则层的建立能够保证数字经济基础设施体系正常运行与运转，让数据在规则下真正产生价值，保证数字市场稳定、有序、高效运行，服务于社会经济发展和社会福祉提升，衍生出更大的经济效益，推动供给侧改革和中国经济转型升级。总体来说，在数字市场环境的规则制定中，应该考虑的问题是：由谁制定政策？制定怎样的政策？政策如何执行？


    从科技型企业的角度来看，规则层是大型公司、标准组织的领地，而规则层的重点在应用型企业，可以通过它们的数据制定行业新规则，这样就使得行业边界发生了变化，遵守这个规则的其他企业就会成为制定规则的行业的一部分。例如，比特币钱包，软件制作公司制定了规则，用户只要下载使用比特币钱包，就相当于遵守了它的规则，就会成为它生态的一部分，用户从中获得收益，也向它做了贡献。因此，规则将重新定义行业边界，成为新的生态。从宏观社会层面，应该考虑的是数据伦理问题，即数据规则到底以什么标准来制定？对于行业来讲，制定规则是为了促进产业发展，但是产业发展了以后，是否会对社会发展造成损害，是值得深入思考的一个问题。


    ## 应用层

    基于上述四个层级的基础铺垫，数字经济基础设施应用层呈现百花齐放的态势，各种移动端应用程序、去中心化应用等将在各个行业、各个领域乃至社会生活的各个角落深刻改变生产生活方式，对经济发展产生深远影响（见表
    6-2）。未来会聚集一批具备示范效应的应用加以推广。


    表 6-2　五层级模式在不同领域的侧重点


    ![](img/image00156.jpeg)


    更重要的是，一些基于四个基础层培育出的应用软件，成为新型基础设施的一部分。例如，央行正在试点的 DC/EP，从用户使用视角来看，无非在智能手机上安装了数字钱包，在数字钱包中存放
    DC/EP。但当数字钱包大范围推广开来的时候，其外部性和公共品服务的性质就凸显出来，从而成为新型基础设施的一部分。未来又会有很多其他应用，基于数字钱包开发出来。如此循环往复。数字经济的新型基础设施，就在不断循环往复中持续升级。


    应用层将以新一代信息技术如区块链、大数据、互联网为突破口，与实体产业深度融合，实现“区块链+”“大数据+”“互联网+”“AI+”的应用落地。例如，在“AI+金融”的模式下，凭借开放的技术平台、稳定的获客渠道、持续不断的创新活动，金融机构将自身的资源优势与互联网科技公司的技术优势相结合，创造了一种全新的价值链创造模式，不仅提高了客户使用效率与客户对服务的满意度，还颠覆了原有的商业逻辑，促使双方价值资源共享，逐渐形成了“互联网+金融”的行业生态与市场格局。在此基础上，各技术提供方以基础设施、流量变现、增值服务等环节为中心，形成了差异化的服务能力，构建了多元化的盈利模式，创造了一个新型的蓝海市场，利用长尾效应为行业创造了巨大的价值。再如，“AI+交通”的无人驾驶技术的未来，“大数据+营销”对于数字营销新格局的重塑等，都是在物理层、软件层、数据层、规则层基础设施上的应用层实例。


    在这一层级上，科技型企业将提供各类应用软件，应用型企业则面向业务，满足自身特有的需求，充分发挥数字经济基础设施的强大能量，解决企业的实际业务问题，让基础设施建设真正落地。从宏观角度上看，应用的种类千变万化，但万变不离其宗。


    ## 元宇宙基础设施五层级模型的关系、作用与实例

    ### 五层级的关系

    元宇宙基础设施是逐层建设的，随着层级的上升，从硬件到软件越来越抽象，底层为上层建设的基础，上层为底层建设的目标，这样层层搭建起来，最终形成应用层百花齐放的局面。元宇宙基础设施物理层的建设是基础设施体系形成的基石，是实现元宇宙基础设施建设目标的最底层架构；软件层的建设是在物理层基础上的系统搭建，软件脱离硬件单独存在，作为独立对象能够有效发挥软件的真正作用，无论是应用软件还是基础软件，都致力于最大限度地发挥物理层基础设施在现实应用场景中的作用；数据层的建设，是在物理层、软件层的基础上将数据单独剥离出来形成资产，保证数据互联互通，充分发挥价值；正所谓没有监督的自由不是真正意义上的自由，缺乏监管体系，数据必然乱象丛生，个人隐私、安全等问题将会层出不穷，数据必须制定一系列的监管规则才能使其真正发挥价值，数字经济基础设施规则层的建设目标就在于此。数字经济基础设施应用层的建设是基于前四个层级的具体应用场景数字化，是企业数字化转型在具体业务层面的展现，同时也是数字市场中不同行业应用的百花齐放。随着不断发展，一些在应用层的
    App 也可能形成公共属性，转变为基础设施，如微信、抖音、微博等。


    ### 元宇宙基础设施对于传统产业数字化转型的意义

    对应前面章节提到过的企业数字化转型及数字市场相关问题，元宇宙基础设施各层级所发挥的作用各有侧重。


    在企业数字化转型过程中，观念、认知的转换是首要问题。物理层的搭建对于企业数字化理念的形成、高管认知的转换起到了一定的作用，因为有了这些看得见摸得着的基础设施，企业数字化转型才具备了工具和抓手，也使高管认识到数字化转型不再是空谈，而是一个真正可以进行实践的重要战略。此外，数据作为一项数字经济时代关键的生产要素，对于企业而言至关重要，高层管理者认识到将数据打通，防止信息孤岛，建立数据资产的重要性，是企业数字化转型的成功关键。因此，数据层的建设也是改变认知非常关键的一环。


    数字化转型的另一个重要问题是如何实现组织变革。对于企业而言，基础软件的建设有利于提高数字化技术水平，应用软件的建设则进一步从应用维度上改变原有组织固有模式，克服组织惰性，实现组织变革，为数字化转型提供能量。与此同时，数据对于打破原有金字塔式、科层制组织架构，建立数字经济时代更为适合的扁平化、网络化组织，成为以客户为导向的组织，优化资源配置也具有关键作用。企业拥有数据，是数字经济时代形成竞争优势的强大动力，也是数字化转型的关键成功要素。


    在数字市场中，元宇宙基础设施建设有利于市场与计划的统一。数据层、规则层的建设有利于实现这一目标。传统市场中由于数据的缺乏导致市场经济与计划经济存在二元现象，计划与市场完全割裂，而数字市场中由于数据作为基础设施出现，将有助于实现资源合理配置，将基于要素市场总量的调控融入市场经济中，实现计划与市场的统一。规则层的建立使得政府在利用数据进行调控时数据的真实性有所保障，有效解决了传统市场监管缺位的问题，是实现市场与计划统一必不可少的一环。


    元宇宙基础设施的建设可以有效解决传统市场信息不对称的问题。数据资产的公共品外部属性使得数字市场中信息高度对称，有效解决了传统市场的道德风险问题、不透明造成的供需失衡问题以及认知不足导致的市场失灵问题。此外，规则层数字监管与约束环境的建立使得监管具备科学性、合理性、可行性，有效助力数字市场实现行为与信用的统一、监管与自由的统一。


    在数字市场中，物理层、软件层、数据层基础设施的建设有利于生产与消费的统一。要想实现生产与消费的统一，就需要获取消费者数据，了解消费情况。物理层智能终端等是获取消费者数据的重要手段，也是后续数据存储、分析，为生产提供决策依据的基础。如果说物理层建设的作用是获取数据，那么软件层的建设则可以有效存储海量数据，并实现快速调用。数据库对消费数据进行统一维护，为数据分析产生价值提供保障。数据也将支持消费和生产决策，通过分析消费数据，合理制定生产方案，有助于实现消费，引导生产，优化资源配置。


    最后，数字市场中的交易成本能够维持趋近于零的状态，有赖于物理层、软件层、数据层、规则层基础设施共同发挥作用。物理层中，5G 等基础设施的建设是信息高速、高效、不受空间限制传输的重要保障。软件层中，生态运营平台的建立也为数据提高透明度与流通度，实现信息对称提供了环境，从而降低数字市场交易成本。数据层中，数据流在数字市场中具备透明化特征，如数联网的建立使万物互联互通，数据完全打通，避免信息孤岛的产生，避免了产业隔阂，是使数字市场交易成本能够维持在较低水平的关键。除此之外，规则层也是数字市场降低交易成本的关键一环，公信、公开、透明、去中心化、点对点传输等新型交易手段的特征使信息高度透明、流通效率大大提高，同时也有效解决了信任风险问题，从多个维度上降低了数字市场交易成本。


