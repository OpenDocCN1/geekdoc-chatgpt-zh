- raw: "NFT对于构建元宇宙而言意义重大。有了NFT机制，玩家在游戏中购置的各类装备、创造的各类物品，都具备了资产的意义，可以用来交易，而且明码标价。在传统模式下，像游戏装备和游戏“皮肤”，其本质是一种服务而非资产，它们既不限量，生产成本也趋于零。运营者通常将游戏物品作为服务内容销售给用户而非资产，创作平台也是如此，用户使用他人的作品时需要支付指定的费用。NFT的存在改变了传统虚拟商品交易模式，用户创作者可以直接生产虚拟商品，交易虚拟商品，就如同在现实世界的生产一般。NFT可以脱离游戏平台，用户之间也可以自由交易相关NFT资产。\n\
    \n在元宇宙还处于混沌鸿蒙的阶段，很难通过在元宇宙中建立权威的中心化组织来规范元宇宙中的经济行为。Roblox算是开了一个先河。Roblox并没有采用去中心化机制实现交易行为，但是Roblox必须自己小心谨慎地维护Robux币与美元之间“汇率”的稳定。稳定的汇率有助于Roblox生态的繁荣。不同的Roblox之间如何才能交换数字资产呢？这是Roblox本身所不能解决的。\n\
    \n以太坊奠定元宇宙的经济机制，元宇宙提供以太坊丰富的应用场景。二者相得益彰，相互促进。\n\n## 传统产业的超大陆——EOP\n\n我们在谈论元宇宙，并不是仅仅为了炒作概念，而是清晰地展现了传统产业数字化转型后的最终形态，只是现阶段以可视化、游戏化的方式呈现而已。至少在元宇宙理念中，传统产业首先需要补上的一课就是建立全行业的统一平台。这个平台中应该包括数字创造内容、在线数字市场和必要的金融支付手段。传统的产业中，制造是非常核心的组成部分，相比之下，游戏中的创造的的确确就是游戏。因此，传统产业的统一平台，在制造环节的体现，往往是管理系统。\n\
    \n### 什么是EOP？\n\n产业生态是数字经济的基本单元，构成这个基本单元的是熙熙攘攘的各类交易，以及围绕这些交易衍生的各类“关系”，比如支付、借贷、物流、供应链管理，乃至生产单元的管理。到底是什么承载了这些交易，实现了这些“关系”，从而让产业生态呈现整体性特征？这就是EOP这个概念产生的背景。\n\
    \n产业生态各类生产、流通、金融、消费单元都应该运行在统一的信息系统之上，以生态契约为基础，以跨行业业务流程为导向，以促进产业生态整体效率提升和总体成本下降为目标。这个统一的综合性运用了互联网、大数据、人工智能等技术的“信息系统”就是EOP，它会成为数字经济的基础设施的组成部分。\n\
    \n这个E跟过去的E不一样，这个E是生态的E（Ecosystem），ERP的E是企业（Enterprise）的概念，这就把范围扩大了。EOP是互相有关联的企业联结在一起。过去是联结内部系统，现在是联结外部系统。O是运营（Operation）的意思，ERP的重点还是在于管理，其核心为企业管理系统，而运营则更多讲的是创造收益的过程，是怎么样把客户、资源、机会、市场的作用发挥得更好。过去ERP的P是计划（Plan）的意思，EOP的P是平台（Platform）的意思，其含义更广。EOP是通过运营的手段把产业资源、企业联结在一起，提供给大家的是开展业务的平台。\n\
    \nEOP和ERP的具体差异是什么呢？①关注的范围不一样。过去关注的是企业内部，现在关注的是行业生态链中的企业。②目标不一样。过去是提高管理效益，降低管理成本，现在是提供市场机会，扩大收入范围，更加Open（开放），“O”既有开放的意思，又有运营的意思，我们应该向外而强，而不是向内而生。③ERP以流程作为很重要的管理手段，过去经常讲BPR（业务流程再造），现在是生态整合。BPR只是企业内部的流程重组，而生态整合是不同行业之间的流程重组的问题，范围更广，难度更大。\n\
    \n商业模式的不同，可以说是颠覆性的变化。EOP作为整个产业生态的运营支持系统，与ERP作为整个企业的管理信息系统从软件属性上而言是一致的；但是ERP的商业模式，是把ERP软件“卖”给客户，ERP和客户之间是甲乙双方的供求关系。\n\
    \nEOP则不同，EOP用户不需要“购买”EOP软件，只是在业务需要的时候“租”用就好，而且在大多数情况下“租”金是“0”。EOP的提供者与EOP的使用者，不再是以前甲乙方之间的“供求”关系，而是形成了一起开拓业务的“共同体”。EOP与EOP用户形成的“业务拓展共同体”，是建立起稳固的产业生态大厦的基石。\n\
    \n从商业模式上看，ERP本身是商品，但EOP提供的“服务”是商品。从软件到服务是一个跨越式的巨大变化，是商业模式的质变。这是新模式与旧模式、新经济与旧经济的分水岭。ERP公司如果能够完成这个跨越，无疑将涅槃重生；如果不能，必将折戟沉沙。\n\
    \nERP与EOP之间更重要的差异，是两者承担的使命不同。EOP面向整个产业生态繁荣，ERP的目标则是企业管理有序。这就决定了两者在价值观、文化、理念、能力结构、知识结构等方面都有根本性的不同。从某种意义上说，EOP承担了发展数字经济的使命，同时也为数字经济重组产业提供了方法论和工具集。\n\
    \n从企业层面看，EOP把大量异质性企业联结在一起，形成互生、共生乃至再生的价值循环体系。从行业层面看，EOP把不同的行业，尤其是把第三产业和第一产业、第二产业融合在一起，是一种产业融合机制。从社会协同层面看，EOP也是不同的“经济主体”跨越地域、时间、行业的限制所形成的一个社会协同平台。\n\
    \n从这个意义上讲，EOP不再是简单的软件平台，而是和用户完全融合在一起的完整的经营思想的载体。EOP公司并非通过EOP本身盈利，而是在推动用户业务发展的过程中，通过获得各种服务的“佣金”和“租金”来实现收益。\n\
    \n### 以EOP为基础，利用数字重组产业\n\n数字重组产业是继行政力量重组产业、资本力量重组产业之后，又一个重组产业的力量。这是数字经济区别于农业经济、工业经济的鲜明特征。与行政重组和资本重组不同，数字重组产业具有以下几个特征。\n\
    \n第一，不是试图垄断主业，而是垄断主业的服务。\n\n无论是资本重组产业还是行政重组产业，其根本目标都是要把企业做大做强，最终是要形成垄断性的大型公司。行政重组的典型代表如我国各大央企的组建。资本重组在资本市场上年年发生，例子多得不胜枚举。\n\
    \n数字重组产业不同。数字重组产业的根本目标，是提高产业整体的效率、降低产业整体的成本。重组方的收入不是来自主业，而是来自围绕主业提供的服务。这种收入结构的差异决定了重组方一定要致力于提升整个行业的活力，而非仅仅做大产业规模。\n\
    \n以农信互联为例，其主要收入来自为生猪养殖业提供的各类服务。促进生猪交易，可以收取佣金；提供贷款，可以收取利息；提供物流，可以收取运费；提供信息平台，可以收取使用费。但是农信互联不会亲自养猪。\n\
    \n农信互联和养殖企业之间收入结构上的差异，决定了二者是水乳交融而非水火不容的关系。只有养殖场发展壮大，农信互联才能有更多的收入。因此，像农信互联这样的“数字重组产业”，才能真正带来产业的整体繁荣。\n\
    \n第二，不是控股参股，而是生态契约。\n\n资本重组产业的特征，就是企业股权的变化。被重组方往往失去企业大股东的地位，企业易主。资本重组的本质就是通过掌控企业所有权获得完整的运营权。\n\
    \n但是数字重组产业不同，企业之所以联合在一起，是靠一份份不同的业务合作协议完成的——生态契约。譬如温氏集团，每年都和养殖户签署合同，规定双方的义务和责任。温氏集团承担养殖户所有的销售，但同时养殖户必须遵守温氏的标准，并接受温氏的定期检查。第二年双方根据经营情况，可以续约，也可以不续约。\n\
    \n这种模式，更重视双方的联合经营。养殖户承担具体的养殖任务，温氏提供饲料、销售等服务。双方共同的目标是获得更高的收入。\n\n第三，不是单一行业，而是多个行业。\n\
    \n资本重组，往往聚焦在单一行业的做大做强上，迅速整合出一个大型的企业，试图形成行业垄断的局面。\n\n数字重组不同，其更注重不同行业的融合。凡是主业做大过程中需要的服务业，都在数字重组的视野范围内，包括但不限于银行、保险、基金、物流、交易市场、管理咨询等服务。\n\
    \n第四，不是简单做大，而是业务融合。\n\n数字重组产业收入来自围绕主业的各类服务业。因此，提供更多、更高效的服务，是数字重组的业务目标。在这个目标的驱动下，必然是不同行业之间，高度的业务融合。\n\
    \n而资本重组产业，往往是先把散落的土豆装到麻袋中，至于是做成土豆泥，还是土豆条，是重组以后的事情，但是数字重组，往往先开展业务融合，才继之以企业整合。\n\
    \n# 07  \n\n虫洞，在元宇宙间自由穿梭\n\n生存在宇宙中，本身就是一件很幸运的事情，但是不知道什么时候起，你们有了这样一种幻想，认为生存是唾手可得的，这就是你们失败的根本原因。\n\
    \n——刘慈欣《三体》\n\n我们生活在三维的世界，但是目前所有主流的显示设备都是二维的平面。VR/AR设备，正在加速走进我们的生活，有望终结手机的平面世界。我们在数字世界中体验真实，在物理世界中感受虚实融合。\n\
    \n终端形态的变化，引发行业格局的变迁，加速人类向数字世界迁徙的步伐。不同的人们聚在不同的元宇宙，人们可以在元宇宙间自由地穿梭。我们虽身形未动，却神游万方。\n\
    \n过去，人们因为器官受损而不得不使用人造设备，未来人们为了增强器官功能可以选择人造设备。智能设备在形体方面，与人体融合，在精神方面，让思想在元宇宙中尽情绽放。硅基生命将会以出人意料的方式进入我们的生活。或许，我们正在慢慢步入“后人类社会”。\n\
    \n人类是自然界中唯一不能完全生活在现实世界的生物。我们为什么会为航天员欢呼，为探险家喝彩？因为我们每个人的内心深处都在渴望摆脱世间俗物的束缚，突破物理的极限，探寻未知的世界。未知的或许就是完美的。毛主席在诗中写道：“可上九天揽月，可下五洋捉鳖。”与其说这展现了作者恢宏的格局，倒不如说是毛主席引发了大家心理上的共鸣。人类关于宇宙、世界、精神的思考，从来没有停止过。人们借助绘画、摄影和文学作品来丰富自己的精神世界，从而树立起人类思想史、艺术史、文学史上的一座座丰碑。\n\
    \n中国最伟大的小说之一《红楼梦》刻画了金陵十二钗的形象，满足了人们对于美的所有幻想，然而，剧中的美景佳人无不消失殆尽，化为一场空梦，最终“落了片白茫茫大地真干净”。《三体》这部中国最著名的科幻小说，描绘出人类在三维世界永远无法体验到的四维世界的宏阔。然而仅存的四维空间也被毁灭，甚至最后连太阳系也都被摧毁了。创世和毁灭是艺术永恒的主题。或许在现实世界，毁灭才是永恒的主题。然而，我们应该如何思考永生和超越，又该如何思考人类恒久生存的最终幻想？\n\
    \n超现实主义艺术家们，给出了自己的选择。他们致力于探索人类的潜意识心理，主张突破合乎逻辑与实际的现实观，彻底放弃以逻辑和有序经验记忆为基础的现实形象。他们将现实观念与本能、潜意识及梦的经验相融合，来展现人类深层心理中的形象世界。现实世界受理性的控制，人的许多本能和欲望受到压抑。然而，那个能够展示人的真实心理和本来面目的世界，是现实之外那个绝对而超然的彼岸世界，即超现实的世界，这就是人的深层心理或梦境。\n\
    \n《哪吒之魔童降世》中的《山河社稷图》是超现实主义的巅峰代表。哪吒被困于图中，不得不潜心学艺。奇幻的是还有一支“指点江山笔”，剧中角色想到哪里，这支笔就画到哪里，你能想到的一切场景都能在《山河社稷图》中绘画出来。最后哪吒就是借助“指点江山笔”，画了一扇传送门，跑了出来。\n\
    \n《山河社稷图》就是元宇宙世界的艺术想象，“指点江山笔”则是在元宇宙中创造的工具。当我们的技术进一步发展，超现实就会成为司空见惯的事情。在沙盒游戏《我的世界》中，超现实主义的怪物、建筑、物理法则比比皆是，甚至我们可以亲手去创造那些超现实的作品。而这些游戏不过是元宇宙的雏形。游戏中，我们可以亲手缔造超现实的世界。一切梦想、想象、美好、奇幻的事物，都可以完美、完全地呈现。\n\
    \n当然，我们也需要像太乙真人的宝贝《山河社稷图》那样的新工具。借助这种工具，我们就能自由地在不同的“宇宙”间穿梭。而这个工具，就是VR技术。\n\n##\
    \ 三维，超越手机的平面世界\n\n我们生活在三维空间，我们的视觉体验自然是三维的，但是从古至今，人们思想的载体，却以二维的形式存在。从甲骨文、竹简、纸张到现在的智能手机、电视、电影等，都是二维的存在。电影中视觉特效尤其是IMAX-3D技术已经能给观众带来强烈的震撼，但是离身临其境还有些距离。关键就在于观众“知道”自己是在看电影，即便戴上了“3D”眼镜，视场中依然有现实世界的若干物体，譬如遮挡幕布的前排“脑袋”时刻提醒观众，这是在看电影，不要当真。三维的视觉体验，甚至是四维时空的全体验，是人类孜孜以求的目标。随着技术的发展，超越手机平面显示的世界的脚步声越来越近，这将引起产业的巨大变革。智能手机确立的商业模式已经成熟，人们期待的是有可能取代智能手机的新型终端的爆发。\n\
    \n三维的视觉体验根据虚拟和现实的关系，可分为四种类型：VR、AR、MR和XR。VR（Virtual Reality，虚拟现实）技术让人们感受到现实世界之外的虚拟世界，就像电影《头号玩家》中的虚幻世界。AR（Augmented\
    \ Reality，增强现实），在现实环境中增加虚拟物体。车载HUD就是典型的AR应用，在风挡玻璃上投射出导航箭头，驾驶员可以在物理的道路上“看”到虚拟的道路标识。MR（MixedReality，混合现实）在虚拟环境中增加现实物体。MR和AR比较容易弄混，本文略做解释：AR的视觉环境是现实，以现实为基础来创造虚拟物品。MR则相反，视觉环境是虚拟的，以虚拟为背景来创造现实物体。在实际的应用中，两项技术正在快速融合。XR（ExtendedReality，扩展现实），可以理解为虚拟和现实的进一步融合，这已经达到“真作假时假亦真，无为有处有还无”的境界了。本书中，“虚拟现实”指VR/AR/MR/XR，本文不做区分。如果使用的是英文缩写“VR”，就是指狭义的“虚拟现实”。\n\
    \n### 虚拟现实发展历程\n\n早在1930年，在科幻小说《皮格马利翁的眼镜》中，作者就提到了一种特别的眼镜。当人们戴上它时，可以看到、听到、闻到里面的角色感受到的事物，有如真实地生活在其中一般。20世纪50年代中期，美国摄影师Morton\
    \ Heilig发明了第一台VR设备：Sensorama。这表明科幻眼镜走进了现实。这台设备拥有固定屏幕、3D立体声、3D显示、震动座椅、风扇（模拟风吹），以及气味生成器。毫无意外，这是一个庞然大物，它的成像效果惨不忍睹（见图7-1）。在20世纪，电视技术也才刚刚发展，但是这台设备却展示了虚拟现实的若干概念，模拟的感官包括视觉，还包括人们的触觉、嗅觉。从一开始，人们对于虚拟现实的认识，就是完全地取代人类的感觉器官。到目前为止，这个理想依然没有在消费级产品上完全实现。\n\
    \n![](Images/image00189.jpeg)\n\n图7-1 第一台VR设备Sensorama，由美国摄影师Morton Heilig发明[^(\\\
    [1\\])](#part0041.xhtml#f1)\n\n1968年，美国计算机科学家Ivan Sutherland发明了最接近现代VR设备概念的VR眼镜原型。这与Sensorama相比无疑是前进了一大步。但是这个头盔太重了，需要使用额外的设备吊在头顶，才能让人们感觉稍微舒适一点。\n\
    \n随着材料、通信、成像技术、计算技术的进步，VR设备越来越轻、处理能力越来越强。当脸书斥资20亿美元收购Oculus时，大家忽然发现原来VR技术已经取得了巨大的进步。巨头的入场，引发了2015年、2016年虚拟现实产业的热潮。Pokemon\
    \ Go游戏在全球忽然流行开来。这是一款增强现实游戏，人们可以通过智能手机，在我们日常的生活场景中找到一个“小精灵”，获得游戏的胜利。这款游戏，让资本家敏锐地捕捉到，虚拟现实技术可能成熟了。于是，他们不约而同地对其投入大量资金形成一次投资热潮。但是，不可克服的眩晕感、纱窗一样的3D画面、糟糕的带宽，都抑制了人们使用VR设备的热情。上一轮高潮留下的记忆，仅限于商场和游乐场中的儿童游戏设备。\n\
    \n当玩家进入Half-Life: Alyx后，对VR设备的担忧烟消云散了。精致的设计、清晰的细节、流畅的画面，无一不让人身临其境。这款游戏让大家看到VR技术的潜力，重新点燃了资本市场的热情。\n\
    \n大家纷纷开始称赞脸书收购Oculus这一行为。Oculus也不负众望，成功推出了Oculus Quest——VR一体机。Quest系列非常受欢迎，而且其中搭载的游戏也更加丰富。预计2020年Quest系列的出货量可以超过1000万台。预计到2025年，VR设备的出货量会达到9000万台。其增长速度可以和智能手机的增长速度相媲美。\n\
    \n### 游戏和设备进入相互促进正循环\n\n疫情让游戏开发商和设备厂商都嗅到了商机。“宅”经济不断发展，促进了娱乐、游戏和社交的需求。据统计，截至2020年底，Steam平台VR内容数量已经达到5554款，加上Oculus、VIVE和PICO等平台，目前主流游戏平台上VR内容已超过万款。VR已经进入“用户增加—设备开发商、内容开发者收入提高、设备体验感上升/内容持续丰富—用户持续增加”的正向循环（见图7-2）。\n\
    \n![](Images/image00158.jpeg)\n\n图7-2  VR/AR进入硬件+内容相互促进的双循环  \n\n（图片来源：公众号“邋遢道人”，兴业证券经济与金融研究院整理）\n\
    \n目前，Half-Life: Alyx这款游戏大火。根据Superdata数据显示，2020年发布的Half-Life: Alyx单款游戏收入超过了2019年所有VR游戏收入之和，2020年全球VR游戏收入同比增长25%，达到5.89亿美元。2020年Steam\
    \ VR的会话数量达到1.04亿次，新增用户达到170万人（初次使用Steam VR的用户数量），VR游戏时间比2019年增加了30%。\n\nSteam平台[^(\\\
    [2\\])](#part0041.xhtml#comment_17562)的月连接VR设备数量不断创新高，Oculus已占据半壁江山。Steam年度报告指出，2020年平台新增VR用户170万人，月活VR用户205万人，根据Roadto\
    \ VR的测算，目前Steam平台的月连接VR设备数量已经超过250万台，且不断创造新高。脸书已占据VR消费市场半壁以上江山。2021年3月Steam平台58%的月连接VR设备均为Oculus的产品。\n\
    \n### 超现实的体验已经广泛应用于航天、航空、军事等领域\n\nHUD（Head Up Display）是应用最广泛的一类车载AR技术。驾驶员不用低头，就可以在风挡玻璃上看到一些基本的驾驶信息，譬如车速、导航等，已成为提高驾驶员注意力的重要工具。因为成本的原因，该技术一般都用在高档车型。毕竟在日常驾驶中，驾驶员也不会一直盯着前方，瞥一眼仪表盘也无伤大雅。\n\
    \n但是对于飞机驾驶员而言，情况则不同。飞行员，尤其是战斗机飞行员，必须牢牢盯紧前方，任何让飞行员分心的行为，都是应该极力避免的。HUD最早也是为飞行员量身定制的系统。\n\
    \n训练飞行员需要的设备，远非一套“简陋”的HUD系统。电影《中国机长》真实还原了一次极限驾驶的场景，即飞机风挡玻璃突然破裂。机长在青藏高原上空艰难地控制飞机，以血肉之躯对抗时速数百公里的大风、严寒，最终安全降落在机场。这样挑战极限的驾驶体验，在物理世界中还是要尽量避免，一旦发生，极易机毁人亡。中国机长凭借其实力、勇气和运气等多重因素化险为夷。"
  fmt: "\nNFT对于构建元宇宙而言意义重大。有了NFT机制，玩家在游戏中购置的各类装备、创造的各类物品，都具备了资产的意义，可以用来交易，而且明码标价。在传统模式下，像游戏装备和游戏“皮肤”，其本质是一种服务而非资产，它们既不限量，生产成本也趋于零。运营者通常将游戏物品作为服务内容销售给用户而非资产，创作平台也是如此，用户使用他人的作品时需要支付指定的费用。NFT的存在改变了传统虚拟商品交易模式，用户创作者可以直接生产虚拟商品，交易虚拟商品，就如同在现实世界的生产一般。NFT可以脱离游戏平台，用户之间也可以自由交易相关NFT资产。\n\
    \n在元宇宙还处于混沌鸿蒙的阶段，很难通过在元宇宙中建立权威的中心化组织来规范元宇宙中的经济行为。Roblox算是开了一个先河。Roblox并没有采用去中心化机制实现交易行为，但是Roblox必须自己小心谨慎地维护Robux币与美元之间“汇率”的稳定。稳定的汇率有助于Roblox生态的繁荣。不同的Roblox之间如何才能交换数字资产呢？这是Roblox本身所不能解决的。\n\
    \n以太坊奠定元宇宙的经济机制，元宇宙提供以太坊丰富的应用场景。二者相得益彰，相互促进。\n\n# 传统产业的超大陆——EOP\n\n我们在谈论元宇宙，并不是仅仅为了炒作概念，而是清晰地展现了传统产业数字化转型后的最终形态，只是现阶段以可视化、游戏化的方式呈现而已。至少在元宇宙理念中，传统产业首先需要补上的一课就是建立全行业的统一平台。这个平台中应该包括数字创造内容、在线数字市场和必要的金融支付手段。传统的产业中，制造是非常核心的组成部分，相比之下，游戏中的创造的的确确就是游戏。因此，传统产业的统一平台，在制造环节的体现，往往是管理系统。\n\
    \n## 什么是EOP？\n\n产业生态是数字经济的基本单元，构成这个基本单元的是熙熙攘攘的各类交易，以及围绕这些交易衍生的各类“关系”，比如支付、借贷、物流、供应链管理，乃至生产单元的管理。到底是什么承载了这些交易，实现了这些“关系”，从而让产业生态呈现整体性特征？这就是EOP这个概念产生的背景。\n\
    \n产业生态各类生产、流通、金融、消费单元都应该运行在统一的信息系统之上，以生态契约为基础，以跨行业业务流程为导向，以促进产业生态整体效率提升和总体成本下降为目标。这个统一的综合性运用了互联网、大数据、人工智能等技术的“信息系统”就是EOP，它会成为数字经济的基础设施的组成部分。\n\
    \n这个E跟过去的E不一样，这个E是生态的E（Ecosystem），ERP的E是企业（Enterprise）的概念，这就把范围扩大了。EOP是互相有关联的企业联结在一起。过去是联结内部系统，现在是联结外部系统。O是运营（Operation）的意思，ERP的重点还是在于管理，其核心为企业管理系统，而运营则更多讲的是创造收益的过程，是怎么样把客户、资源、机会、市场的作用发挥得更好。过去ERP的P是计划（Plan）的意思，EOP的P是平台（Platform）的意思，其含义更广。EOP是通过运营的手段把产业资源、企业联结在一起，提供给大家的是开展业务的平台。\n\
    \nEOP和ERP的具体差异是什么呢？①关注的范围不一样。过去关注的是企业内部，现在关注的是行业生态链中的企业。②目标不一样。过去是提高管理效益，降低管理成本，现在是提供市场机会，扩大收入范围，更加Open（开放），“O”既有开放的意思，又有运营的意思，我们应该向外而强，而不是向内而生。③ERP以流程作为很重要的管理手段，过去经常讲BPR（业务流程再造），现在是生态整合。BPR只是企业内部的流程重组，而生态整合是不同行业之间的流程重组的问题，范围更广，难度更大。\n\
    \n商业模式的不同，可以说是颠覆性的变化。EOP作为整个产业生态的运营支持系统，与ERP作为整个企业的管理信息系统从软件属性上而言是一致的；但是ERP的商业模式，是把ERP软件“卖”给客户，ERP和客户之间是甲乙双方的供求关系。\n\
    \nEOP则不同，EOP用户不需要“购买”EOP软件，只是在业务需要的时候“租”用就好，而且在大多数情况下“租”金是“0”。EOP的提供者与EOP的使用者，不再是以前甲乙方之间的“供求”关系，而是形成了一起开拓业务的“共同体”。EOP与EOP用户形成的“业务拓展共同体”，是建立起稳固的产业生态大厦的基石。\n\
    \n从商业模式上看，ERP本身是商品，但EOP提供的“服务”是商品。从软件到服务是一个跨越式的巨大变化，是商业模式的质变。这是新模式与旧模式、新经济与旧经济的分水岭。ERP公司如果能够完成这个跨越，无疑将涅槃重生；如果不能，必将折戟沉沙。\n\
    \nERP与EOP之间更重要的差异，是两者承担的使命不同。EOP面向整个产业生态繁荣，ERP的目标则是企业管理有序。这就决定了两者在价值观、文化、理念、能力结构、知识结构等方面都有根本性的不同。从某种意义上说，EOP承担了发展数字经济的使命，同时也为数字经济重组产业提供了方法论和工具集。\n\
    \n从企业层面看，EOP把大量异质性企业联结在一起，形成互生、共生乃至再生的价值循环体系。从行业层面看，EOP把不同的行业，尤其是把第三产业和第一产业、第二产业融合在一起，是一种产业融合机制。从社会协同层面看，EOP也是不同的“经济主体”跨越地域、时间、行业的限制所形成的一个社会协同平台。\n\
    \n从这个意义上讲，EOP不再是简单的软件平台，而是和用户完全融合在一起的完整的经营思想的载体。EOP公司并非通过EOP本身盈利，而是在推动用户业务发展的过程中，通过获得各种服务的“佣金”和“租金”来实现收益。\n\
    \n## 以EOP为基础，利用数字重组产业\n\n数字重组产业是继行政力量重组产业、资本力量重组产业之后，又一个重组产业的力量。这是数字经济区别于农业经济、工业经济的鲜明特征。与行政重组和资本重组不同，数字重组产业具有以下几个特征。\n\
    \n第一，不是试图垄断主业，而是垄断主业的服务。\n\n无论是资本重组产业还是行政重组产业，其根本目标都是要把企业做大做强，最终是要形成垄断性的大型公司。行政重组的典型代表如我国各大央企的组建。资本重组在资本市场上年年发生，例子多得不胜枚举。\n\
    \n数字重组产业不同。数字重组产业的根本目标，是提高产业整体的效率、降低产业整体的成本。重组方的收入不是来自主业，而是来自围绕主业提供的服务。这种收入结构的差异决定了重组方一定要致力于提升整个行业的活力，而非仅仅做大产业规模。\n\
    \n以农信互联为例，其主要收入来自为生猪养殖业提供的各类服务。促进生猪交易，可以收取佣金；提供贷款，可以收取利息；提供物流，可以收取运费；提供信息平台，可以收取使用费。但是农信互联不会亲自养猪。\n\
    \n农信互联和养殖企业之间收入结构上的差异，决定了二者是水乳交融而非水火不容的关系。只有养殖场发展壮大，农信互联才能有更多的收入。因此，像农信互联这样的“数字重组产业”，才能真正带来产业的整体繁荣。\n\
    \n第二，不是控股参股，而是生态契约。\n\n资本重组产业的特征，就是企业股权的变化。被重组方往往失去企业大股东的地位，企业易主。资本重组的本质就是通过掌控企业所有权获得完整的运营权。\n\
    \n但是数字重组产业不同，企业之所以联合在一起，是靠一份份不同的业务合作协议完成的——生态契约。譬如温氏集团，每年都和养殖户签署合同，规定双方的义务和责任。温氏集团承担养殖户所有的销售，但同时养殖户必须遵守温氏的标准，并接受温氏的定期检查。第二年双方根据经营情况，可以续约，也可以不续约。\n\
    \n这种模式，更重视双方的联合经营。养殖户承担具体的养殖任务，温氏提供饲料、销售等服务。双方共同的目标是获得更高的收入。\n\n第三，不是单一行业，而是多个行业。\n\
    \n资本重组，往往聚焦在单一行业的做大做强上，迅速整合出一个大型的企业，试图形成行业垄断的局面。\n\n数字重组不同，其更注重不同行业的融合。凡是主业做大过程中需要的服务业，都在数字重组的视野范围内，包括但不限于银行、保险、基金、物流、交易市场、管理咨询等服务。\n\
    \n第四，不是简单做大，而是业务融合。\n\n数字重组产业收入来自围绕主业的各类服务业。因此，提供更多、更高效的服务，是数字重组的业务目标。在这个目标的驱动下，必然是不同行业之间，高度的业务融合。\n\
    \n而资本重组产业，往往是先把散落的土豆装到麻袋中，至于是做成土豆泥，还是土豆条，是重组以后的事情，但是数字重组，往往先开展业务融合，才继之以企业整合。\n\
    \n# 07 虫洞，在元宇宙间自由穿梭\n\n生存在宇宙中，本身就是一件很幸运的事情，但是不知道什么时候起，你们有了这样一种幻想，认为生存是唾手可得的，这就是你们失败的根本原因。\n\
    \n——刘慈欣《三体》\n\n我们生活在三维的世界，但是目前所有主流的显示设备都是二维的平面。VR/AR设备，正在加速走进我们的生活，有望终结手机的平面世界。我们在数字世界中体验真实，在物理世界中感受虚实融合。\n\
    \n终端形态的变化，引发行业格局的变迁，加速人类向数字世界迁徙的步伐。不同的人们聚在不同的元宇宙，人们可以在元宇宙间自由地穿梭。我们虽身形未动，却神游万方。\n\
    \n过去，人们因为器官受损而不得不使用人造设备，未来人们为了增强器官功能可以选择人造设备。智能设备在形体方面，与人体融合，在精神方面，让思想在元宇宙中尽情绽放。硅基生命将会以出人意料的方式进入我们的生活。或许，我们正在慢慢步入“后人类社会”。\n\
    \n人类是自然界中唯一不能完全生活在现实世界的生物。我们为什么会为航天员欢呼，为探险家喝彩？因为我们每个人的内心深处都在渴望摆脱世间俗物的束缚，突破物理的极限，探寻未知的世界。未知的或许就是完美的。毛主席在诗中写道：“可上九天揽月，可下五洋捉鳖。”与其说这展现了作者恢宏的格局，倒不如说是毛主席引发了大家心理上的共鸣。人类关于宇宙、世界、精神的思考，从来没有停止过。人们借助绘画、摄影和文学作品来丰富自己的精神世界，从而树立起人类思想史、艺术史、文学史上的一座座丰碑。\n\
    \n中国最伟大的小说之一《红楼梦》刻画了金陵十二钗的形象，满足了人们对于美的所有幻想，然而，剧中的美景佳人无不消失殆尽，化为一场空梦，最终“落了片白茫茫大地真干净”。《三体》这部中国最著名的科幻小说，描绘出人类在三维世界永远无法体验到的四维世界的宏阔。然而仅存的四维空间也被毁灭，甚至最后连太阳系也都被摧毁了。创世和毁灭是艺术永恒的主题。或许在现实世界，毁灭才是永恒的主题。然而，我们应该如何思考永生和超越，又该如何思考人类恒久生存的最终幻想？\n\
    \n超现实主义艺术家们，给出了自己的选择。他们致力于探索人类的潜意识心理，主张突破合乎逻辑与实际的现实观，彻底放弃以逻辑和有序经验记忆为基础的现实形象。他们将现实观念与本能、潜意识及梦的经验相融合，来展现人类深层心理中的形象世界。现实世界受理性的控制，人的许多本能和欲望受到压抑。然而，那个能够展示人的真实心理和本来面目的世界，是现实之外那个绝对而超然的彼岸世界，即超现实的世界，这就是人的深层心理或梦境。\n\
    \n《哪吒之魔童降世》中的《山河社稷图》是超现实主义的巅峰代表。哪吒被困于图中，不得不潜心学艺。奇幻的是还有一支“指点江山笔”，剧中角色想到哪里，这支笔就画到哪里，你能想到的一切场景都能在《山河社稷图》中绘画出来。最后哪吒就是借助“指点江山笔”，画了一扇传送门，跑了出来。\n\
    \n《山河社稷图》就是元宇宙世界的艺术想象，“指点江山笔”则是在元宇宙中创造的工具。当我们的技术进一步发展，超现实就会成为司空见惯的事情。在沙盒游戏《我的世界》中，超现实主义的怪物、建筑、物理法则比比皆是，甚至我们可以亲手去创造那些超现实的作品。而这些游戏不过是元宇宙的雏形。游戏中，我们可以亲手缔造超现实的世界。一切梦想、想象、美好、奇幻的事物，都可以完美、完全地呈现。\n\
    \n当然，我们也需要像太乙真人的宝贝《山河社稷图》那样的新工具。借助这种工具，我们就能自由地在不同的“宇宙”间穿梭。而这个工具，就是VR技术。\n\n##\
    \ 三维，超越手机的平面世界\n\n我们生活在三维空间，我们的视觉体验自然是三维的，但是从古至今，人们思想的载体，却以二维的形式存在。从甲骨文、竹简、纸张到现在的智能手机、电视、电影等，都是二维的存在。电影中视觉特效尤其是IMAX-3D技术已经能给观众带来强烈的震撼，但是离身临其境还有些距离。关键就在于观众“知道”自己是在看电影，即便戴上了“3D”眼镜，视场中依然有现实世界的若干物体，譬如遮挡幕布的前排“脑袋”时刻提醒观众，这是在看电影，不要当真。三维的视觉体验，甚至是四维时空的全体验，是人类孜孜以求的目标。随着技术的发展，超越手机平面显示的世界的脚步声越来越近，这将引起产业的巨大变革。智能手机确立的商业模式已经成熟，人们期待的是有可能取代智能手机的新型终端的爆发。\n\
    \n三维的视觉体验根据虚拟和现实的关系，可分为四种类型：VR、AR、MR和XR。VR（Virtual Reality，虚拟现实）技术让人们感受到现实世界之外的虚拟世界，就像电影《头号玩家》中的虚幻世界。AR（Augmented\
    \ Reality，增强现实），在现实环境中增加虚拟物体。车载HUD就是典型的AR应用，在风挡玻璃上投射出导航箭头，驾驶员可以在物理的道路上“看”到虚拟的道路标识。MR（MixedReality，混合现实）在虚拟环境中增加现实物体。MR和AR比较容易弄混，本文略做解释：AR的视觉环境是现实，以现实为基础来创造虚拟物品。MR则相反，视觉环境是虚拟的，以虚拟为背景来创造现实物体。在实际的应用中，两项技术正在快速融合。XR（ExtendedReality，扩展现实），可以理解为虚拟和现实的进一步融合，这已经达到“真作假时假亦真，无为有处有还无”的境界了。本书中，“虚拟现实”指VR/AR/MR/XR，本文不做区分。如果使用的是英文缩写“VR”，就是指狭义的“虚拟现实”。\n\
    \n### 虚拟现实发展历程\n\n早在1930年，在科幻小说《皮格马利翁的眼镜》中，作者就提到了一种特别的眼镜。当人们戴上它时，可以看到、听到、闻到里面的角色感受到的事物，有如真实地生活在其中一般。20世纪50年代中期，美国摄影师Morton\
    \ Heilig发明了第一台VR设备：Sensorama。这表明科幻眼镜走进了现实。这台设备拥有固定屏幕、3D立体声、3D显示、震动座椅、风扇（模拟风吹），以及气味生成器。毫无意外，这是一个庞然大物，它的成像效果惨不忍睹（见图7-1）。在20世纪，电视技术也才刚刚发展，但是这台设备却展示了虚拟现实的若干概念，模拟的感官包括视觉，还包括人们的触觉、嗅觉。从一开始，人们对于虚拟现实的认识，就是完全地取代人类的感觉器官。到目前为止，这个理想依然没有在消费级产品上完全实现。\n\
    \n![](Images/image00189.jpeg)\n\n图7-1 第一台VR设备Sensorama，由美国摄影师Morton Heilig发明[^(\\\
    [1\\])](#part0041.xhtml#f1)\n\n1968年，美国计算机科学家Ivan Sutherland发明了最接近现代VR设备概念的VR眼镜原型。这与Sensorama相比无疑是前进了一大步。但是这个头盔太重了，需要使用额外的设备吊在头顶，才能让人们感觉稍微舒适一点。\n\
    \n随着材料、通信、成像技术、计算技术的进步，VR设备越来越轻、处理能力越来越强。当脸书斥资20亿美元收购Oculus时，大家忽然发现原来VR技术已经取得了巨大的进步。巨头的入场，引发了2015年、2016年虚拟现实产业的热潮。Pokemon\
    \ Go游戏在全球忽然流行开来。这是一款增强现实游戏，人们可以通过智能手机，在我们日常的生活场景中找到一个“小精灵”，获得游戏的胜利。这款游戏，让资本家敏锐地捕捉到，虚拟现实技术可能成熟了。于是，他们不约而同地对其投入大量资金形成一次投资热潮。但是，不可克服的眩晕感、纱窗一样的3D画面、糟糕的带宽，都抑制了人们使用VR设备的热情。上一轮高潮留下的记忆，仅限于商场和游乐场中的儿童游戏设备。\n\
    \n当玩家进入Half-Life: Alyx后，对VR设备的担忧烟消云散了。精致的设计、清晰的细节、流畅的画面，无一不让人身临其境。这款游戏让大家看到VR技术的潜力，重新点燃了资本市场的热情。\n\
    \n大家纷纷开始称赞脸书收购Oculus这一行为。Oculus也不负众望，成功推出了Oculus Quest——VR一体机。Quest系列非常受欢迎，而且其中搭载的游戏也更加丰富。预计2020年Quest系列的出货量可以超过1000万台。预计到2025年，VR设备的出货量会达到9000万台。其增长速度可以和智能手机的增长速度相媲美。\n\
    \n### 游戏和设备进入相互促进正循环\n\n疫情让游戏开发商和设备厂商都嗅到了商机。“宅”经济不断发展，促进了娱乐、游戏和社交的需求。据统计，截至2020年底，Steam平台VR内容数量已经达到5554款，加上Oculus、VIVE和PICO等平台，目前主流游戏平台上VR内容已超过万款。VR已经进入“用户增加—设备开发商、内容开发者收入提高、设备体验感上升/内容持续丰富—用户持续增加”的正向循环（见图7-2）。\n\
    \n![](Images/image00158.jpeg)\n\n图7-2  VR/AR进入硬件+内容相互促进的双循环  \n\n（图片来源：公众号“邋遢道人”，兴业证券经济与金融研究院整理）\n\
    \n目前，Half-Life: Alyx这款游戏大火。根据Superdata数据显示，2020年发布的Half-Life: Alyx单款游戏收入超过了2019年所有VR游戏收入之和，2020年全球VR游戏收入同比增长25%，达到5.89亿美元。2020年Steam\
    \ VR的会话数量达到1.04亿次，新增用户达到170万人（初次使用Steam VR的用户数量），VR游戏时间比2019年增加了30%。\n\nSteam平台[^(\\\
    [2\\])](#part0041.xhtml#comment_17562)的月连接VR设备数量不断创新高，Oculus已占据半壁江山。Steam年度报告指出，2020年平台新增VR用户170万人，月活VR用户205万人，根据Roadto\
    \ VR的测算，目前Steam平台的月连接VR设备数量已经超过250万台，且不断创造新高。脸书已占据VR消费市场半壁以上江山。2021年3月Steam平台58%的月连接VR设备均为Oculus的产品。\n\
    \n### 超现实的体验已经广泛应用于航天、航空、军事等领域\n\nHUD（Head Up Display）是应用最广泛的一类车载AR技术。驾驶员不用低头，就可以在风挡玻璃上看到一些基本的驾驶信息，譬如车速、导航等，已成为提高驾驶员注意力的重要工具。因为成本的原因，该技术一般都用在高档车型。毕竟在日常驾驶中，驾驶员也不会一直盯着前方，瞥一眼仪表盘也无伤大雅。\n\
    \n但是对于飞机驾驶员而言，情况则不同。飞行员，尤其是战斗机飞行员，必须牢牢盯紧前方，任何让飞行员分心的行为，都是应该极力避免的。HUD最早也是为飞行员量身定制的系统。\n\
    \n训练飞行员需要的设备，远非一套“简陋”的HUD系统。电影《中国机长》真实还原了一次极限驾驶的场景，即飞机风挡玻璃突然破裂。机长在青藏高原上空艰难地控制飞机，以血肉之躯对抗时速数百公里的大风、严寒，最终安全降落在机场。这样挑战极限的驾驶体验，在物理世界中还是要尽量避免，一旦发生，极易机毁人亡。中国机长凭借其实力、勇气和运气等多重因素化险为夷。\n"
  trans: "\n\nNFT 对于构建元宇宙而言意义重大。有了 NFT 机制，玩家在游戏中购置的各类装备、创造的各类物品，都具备了资产的意义，可以用来交易，而且明码标价。在传统模式下，像游戏装备和游戏“皮肤”，其本质是一种服务而非资产，它们既不限量，生产成本也趋于零。运营者通常将游戏物品作为服务内容销售给用户而非资产，创作平台也是如此，用户使用他人的作品时需要支付指定的费用。NFT\
    \ 的存在改变了传统虚拟商品交易模式，用户创作者可以直接生产虚拟商品，交易虚拟商品，就如同在现实世界的生产一般。NFT 可以脱离游戏平台，用户之间也可以自由交易相关\
    \ NFT 资产。\n\n在元宇宙还处于混沌鸿蒙的阶段，很难通过在元宇宙中建立权威的中心化组织来规范元宇宙中的经济行为。Roblox 算是开了一个先河。Roblox\
    \ 并没有采用去中心化机制实现交易行为，但是 Roblox 必须自己小心谨慎地维护 Robux 币与美元之间“汇率”的稳定。稳定的汇率有助于 Roblox\
    \ 生态的繁荣。不同的 Roblox 之间如何才能交换数字资产呢？这是 Roblox 本身所不能解决的。\n\n以太坊奠定元宇宙的经济机制，元宇宙提供以太坊丰富的应用场景。二者相得益彰，相互促进。\n\
    \n# 传统产业的超大陆——EOP\n\n我们在谈论元宇宙，并不是仅仅为了炒作概念，而是清晰地展现了传统产业数字化转型后的最终形态，只是现阶段以可视化、游戏化的方式呈现而已。至少在元宇宙理念中，传统产业首先需要补上的一课就是建立全行业的统一平台。这个平台中应该包括数字创造内容、在线数字市场和必要的金融支付手段。传统的产业中，制造是非常核心的组成部分，相比之下，游戏中的创造的的确确就是游戏。因此，传统产业的统一平台，在制造环节的体现，往往是管理系统。\n\
    \n## 什么是 EOP？\n\n产业生态是数字经济的基本单元，构成这个基本单元的是熙熙攘攘的各类交易，以及围绕这些交易衍生的各类“关系”，比如支付、借贷、物流、供应链管理，乃至生产单元的管理。到底是什么承载了这些交易，实现了这些“关系”，从而让产业生态呈现整体性特征？这就是\
    \ EOP 这个概念产生的背景。\n\n产业生态各类生产、流通、金融、消费单元都应该运行在统一的信息系统之上，以生态契约为基础，以跨行业业务流程为导向，以促进产业生态整体效率提升和总体成本下降为目标。这个统一的综合性运用了互联网、大数据、人工智能等技术的“信息系统”就是\
    \ EOP，它会成为数字经济的基础设施的组成部分。\n\n这个 E 跟过去的 E 不一样，这个 E 是生态的 E（Ecosystem），ERP 的 E 是企业（Enterprise）的概念，这就把范围扩大了。EOP\
    \ 是互相有关联的企业联结在一起。过去是联结内部系统，现在是联结外部系统。O 是运营（Operation）的意思，ERP 的重点还是在于管理，其核心为企业管理系统，而运营则更多讲的是创造收益的过程，是怎么样把客户、资源、机会、市场的作用发挥得更好。过去\
    \ ERP 的 P 是计划（Plan）的意思，EOP 的 P 是平台（Platform）的意思，其含义更广。EOP 是通过运营的手段把产业资源、企业联结在一起，提供给大家的是开展业务的平台。\n\
    \nEOP 和 ERP 的具体差异是什么呢？①关注的范围不一样。过去关注的是企业内部，现在关注的是行业生态链中的企业。②目标不一样。过去是提高管理效益，降低管理成本，现在是提供市场机会，扩大收入范围，更加\
    \ Open（开放），“O”既有开放的意思，又有运营的意思，我们应该向外而强，而不是向内而生。③ERP 以流程作为很重要的管理手段，过去经常讲 BPR（业务流程再造），现在是生态整合。BPR\
    \ 只是企业内部的流程重组，而生态整合是不同行业之间的流程重组的问题，范围更广，难度更大。\n\n商业模式的不同，可以说是颠覆性的变化。EOP 作为整个产业生态的运营支持系统，与\
    \ ERP 作为整个企业的管理信息系统从软件属性上而言是一致的；但是 ERP 的商业模式，是把 ERP 软件“卖”给客户，ERP 和客户之间是甲乙双方的供求关系。\n\
    \nEOP 则不同，EOP 用户不需要“购买”EOP 软件，只是在业务需要的时候“租”用就好，而且在大多数情况下“租”金是“0”。EOP 的提供者与 EOP\
    \ 的使用者，不再是以前甲乙方之间的“供求”关系，而是形成了一起开拓业务的“共同体”。EOP 与 EOP 用户形成的“业务拓展共同体”，是建立起稳固的产业生态大厦的基石。\n\
    \n从商业模式上看，ERP 本身是商品，但 EOP 提供的“服务”是商品。从软件到服务是一个跨越式的巨大变化，是商业模式的质变。这是新模式与旧模式、新经济与旧经济的分水岭。ERP\
    \ 公司如果能够完成这个跨越，无疑将涅槃重生；如果不能，必将折戟沉沙。\n\nERP 与 EOP 之间更重要的差异，是两者承担的使命不同。EOP 面向整个产业生态繁荣，ERP\
    \ 的目标则是企业管理有序。这就决定了两者在价值观、文化、理念、能力结构、知识结构等方面都有根本性的不同。从某种意义上说，EOP 承担了发展数字经济的使命，同时也为数字经济重组产业提供了方法论和工具集。\n\
    \n从企业层面看，EOP 把大量异质性企业联结在一起，形成互生、共生乃至再生的价值循环体系。从行业层面看，EOP 把不同的行业，尤其是把第三产业和第一产业、第二产业融合在一起，是一种产业融合机制。从社会协同层面看，EOP\
    \ 也是不同的“经济主体”跨越地域、时间、行业的限制所形成的一个社会协同平台。\n\n从这个意义上讲，EOP 不再是简单的软件平台，而是和用户完全融合在一起的完整的经营思想的载体。EOP\
    \ 公司并非通过 EOP 本身盈利，而是在推动用户业务发展的过程中，通过获得各种服务的“佣金”和“租金”来实现收益。\n\n## 以 EOP 为基础，利用数字重组产业\n\
    \n数字重组产业是继行政力量重组产业、资本力量重组产业之后，又一个重组产业的力量。这是数字经济区别于农业经济、工业经济的鲜明特征。与行政重组和资本重组不同，数字重组产业具有以下几个特征。\n\
    \n第一，不是试图垄断主业，而是垄断主业的服务。\n\n无论是资本重组产业还是行政重组产业，其根本目标都是要把企业做大做强，最终是要形成垄断性的大型公司。行政重组的典型代表如我国各大央企的组建。资本重组在资本市场上年年发生，例子多得不胜枚举。\n\
    \n数字重组产业不同。数字重组产业的根本目标，是提高产业整体的效率、降低产业整体的成本。重组方的收入不是来自主业，而是来自围绕主业提供的服务。这种收入结构的差异决定了重组方一定要致力于提升整个行业的活力，而非仅仅做大产业规模。\n\
    \n以农信互联为例，其主要收入来自为生猪养殖业提供的各类服务。促进生猪交易，可以收取佣金；提供贷款，可以收取利息；提供物流，可以收取运费；提供信息平台，可以收取使用费。但是农信互联不会亲自养猪。\n\
    \n农信互联和养殖企业之间收入结构上的差异，决定了二者是水乳交融而非水火不容的关系。只有养殖场发展壮大，农信互联才能有更多的收入。因此，像农信互联这样的“数字重组产业”，才能真正带来产业的整体繁荣。\n\
    \n第二，不是控股参股，而是生态契约。\n\n资本重组产业的特征，就是企业股权的变化。被重组方往往失去企业大股东的地位，企业易主。资本重组的本质就是通过掌控企业所有权获得完整的运营权。\n\
    \n但是数字重组产业不同，企业之所以联合在一起，是靠一份份不同的业务合作协议完成的——生态契约。譬如温氏集团，每年都和养殖户签署合同，规定双方的义务和责任。温氏集团承担养殖户所有的销售，但同时养殖户必须遵守温氏的标准，并接受温氏的定期检查。第二年双方根据经营情况，可以续约，也可以不续约。\n\
    \n这种模式，更重视双方的联合经营。养殖户承担具体的养殖任务，温氏提供饲料、销售等服务。双方共同的目标是获得更高的收入。\n\n第三，不是单一行业，而是多个行业。\n\
    \n资本重组，往往聚焦在单一行业的做大做强上，迅速整合出一个大型的企业，试图形成行业垄断的局面。\n\n数字重组不同，其更注重不同行业的融合。凡是主业做大过程中需要的服务业，都在数字重组的视野范围内，包括但不限于银行、保险、基金、物流、交易市场、管理咨询等服务。\n\
    \n第四，不是简单做大，而是业务融合。\n\n数字重组产业收入来自围绕主业的各类服务业。因此，提供更多、更高效的服务，是数字重组的业务目标。在这个目标的驱动下，必然是不同行业之间，高度的业务融合。\n\
    \n而资本重组产业，往往是先把散落的土豆装到麻袋中，至于是做成土豆泥，还是土豆条，是重组以后的事情，但是数字重组，往往先开展业务融合，才继之以企业整合。\n\
    \n# 07 虫洞，在元宇宙间自由穿梭\n\n生存在宇宙中，本身就是一件很幸运的事情，但是不知道什么时候起，你们有了这样一种幻想，认为生存是唾手可得的，这就是你们失败的根本原因。\n\
    \n——刘慈欣《三体》\n\n我们生活在三维的世界，但是目前所有主流的显示设备都是二维的平面。VR/AR 设备，正在加速走进我们的生活，有望终结手机的平面世界。我们在数字世界中体验真实，在物理世界中感受虚实融合。\n\
    \n终端形态的变化，引发行业格局的变迁，加速人类向数字世界迁徙的步伐。不同的人们聚在不同的元宇宙，人们可以在元宇宙间自由地穿梭。我们虽身形未动，却神游万方。\n\
    \n过去，人们因为器官受损而不得不使用人造设备，未来人们为了增强器官功能可以选择人造设备。智能设备在形体方面，与人体融合，在精神方面，让思想在元宇宙中尽情绽放。硅基生命将会以出人意料的方式进入我们的生活。或许，我们正在慢慢步入“后人类社会”。\n\
    \n人类是自然界中唯一不能完全生活在现实世界的生物。我们为什么会为航天员欢呼，为探险家喝彩？因为我们每个人的内心深处都在渴望摆脱世间俗物的束缚，突破物理的极限，探寻未知的世界。未知的或许就是完美的。毛主席在诗中写道：“可上九天揽月，可下五洋捉鳖。”与其说这展现了作者恢宏的格局，倒不如说是毛主席引发了大家心理上的共鸣。人类关于宇宙、世界、精神的思考，从来没有停止过。人们借助绘画、摄影和文学作品来丰富自己的精神世界，从而树立起人类思想史、艺术史、文学史上的一座座丰碑。\n\
    \n中国最伟大的小说之一《红楼梦》刻画了金陵十二钗的形象，满足了人们对于美的所有幻想，然而，剧中的美景佳人无不消失殆尽，化为一场空梦，最终“落了片白茫茫大地真干净”。《三体》这部中国最著名的科幻小说，描绘出人类在三维世界永远无法体验到的四维世界的宏阔。然而仅存的四维空间也被毁灭，甚至最后连太阳系也都被摧毁了。创世和毁灭是艺术永恒的主题。或许在现实世界，毁灭才是永恒的主题。然而，我们应该如何思考永生和超越，又该如何思考人类恒久生存的最终幻想？\n\
    \n超现实主义艺术家们，给出了自己的选择。他们致力于探索人类的潜意识心理，主张突破合乎逻辑与实际的现实观，彻底放弃以逻辑和有序经验记忆为基础的现实形象。他们将现实观念与本能、潜意识及梦的经验相融合，来展现人类深层心理中的形象世界。现实世界受理性的控制，人的许多本能和欲望受到压抑。然而，那个能够展示人的真实心理和本来面目的世界，是现实之外那个绝对而超然的彼岸世界，即超现实的世界，这就是人的深层心理或梦境。\n\
    \n《哪吒之魔童降世》中的《山河社稷图》是超现实主义的巅峰代表。哪吒被困于图中，不得不潜心学艺。奇幻的是还有一支“指点江山笔”，剧中角色想到哪里，这支笔就画到哪里，你能想到的一切场景都能在《山河社稷图》中绘画出来。最后哪吒就是借助“指点江山笔”，画了一扇传送门，跑了出来。\n\
    \n《山河社稷图》就是元宇宙世界的艺术想象，“指点江山笔”则是在元宇宙中创造的工具。当我们的技术进一步发展，超现实就会成为司空见惯的事情。在沙盒游戏《我的世界》中，超现实主义的怪物、建筑、物理法则比比皆是，甚至我们可以亲手去创造那些超现实的作品。而这些游戏不过是元宇宙的雏形。游戏中，我们可以亲手缔造超现实的世界。一切梦想、想象、美好、奇幻的事物，都可以完美、完全地呈现。\n\
    \n当然，我们也需要像太乙真人的宝贝《山河社稷图》那样的新工具。借助这种工具，我们就能自由地在不同的“宇宙”间穿梭。而这个工具，就是 VR 技术。\n\n\
    ## 三维，超越手机的平面世界\n\n我们生活在三维空间，我们的视觉体验自然是三维的，但是从古至今，人们思想的载体，却以二维的形式存在。从甲骨文、竹简、纸张到现在的智能手机、电视、电影等，都是二维的存在。电影中视觉特效尤其是\
    \ IMAX-3D 技术已经能给观众带来强烈的震撼，但是离身临其境还有些距离。关键就在于观众“知道”自己是在看电影，即便戴上了“3D”眼镜，视场中依然有现实世界的若干物体，譬如遮挡幕布的前排“脑袋”时刻提醒观众，这是在看电影，不要当真。三维的视觉体验，甚至是四维时空的全体验，是人类孜孜以求的目标。随着技术的发展，超越手机平面显示的世界的脚步声越来越近，这将引起产业的巨大变革。智能手机确立的商业模式已经成熟，人们期待的是有可能取代智能手机的新型终端的爆发。\n\
    \n三维的视觉体验根据虚拟和现实的关系，可分为四种类型：VR、AR、MR 和 XR。VR（Virtual Reality，虚拟现实）技术让人们感受到现实世界之外的虚拟世界，就像电影《头号玩家》中的虚幻世界。AR（Augmented\
    \ Reality，增强现实），在现实环境中增加虚拟物体。车载 HUD 就是典型的 AR 应用，在风挡玻璃上投射出导航箭头，驾驶员可以在物理的道路上“看”到虚拟的道路标识。MR（MixedReality，混合现实）在虚拟环境中增加现实物体。MR\
    \ 和 AR 比较容易弄混，本文略做解释：AR 的视觉环境是现实，以现实为基础来创造虚拟物品。MR 则相反，视觉环境是虚拟的，以虚拟为背景来创造现实物体。在实际的应用中，两项技术正在快速融合。XR（ExtendedReality，扩展现实），可以理解为虚拟和现实的进一步融合，这已经达到“真作假时假亦真，无为有处有还无”的境界了。本书中，“虚拟现实”指\
    \ VR/AR/MR/XR，本文不做区分。如果使用的是英文缩写“VR”，就是指狭义的“虚拟现实”。\n\n### 虚拟现实发展历程\n\n早在 1930 年，在科幻小说《皮格马利翁的眼镜》中，作者就提到了一种特别的眼镜。当人们戴上它时，可以看到、听到、闻到里面的角色感受到的事物，有如真实地生活在其中一般。20\
    \ 世纪 50 年代中期，美国摄影师 Morton Heilig 发明了第一台 VR 设备：Sensorama。这表明科幻眼镜走进了现实。这台设备拥有固定屏幕、3D\
    \ 立体声、3D 显示、震动座椅、风扇（模拟风吹），以及气味生成器。毫无意外，这是一个庞然大物，它的成像效果惨不忍睹（见图 7-1）。在 20 世纪，电视技术也才刚刚发展，但是这台设备却展示了虚拟现实的若干概念，模拟的感官包括视觉，还包括人们的触觉、嗅觉。从一开始，人们对于虚拟现实的认识，就是完全地取代人类的感觉器官。到目前为止，这个理想依然没有在消费级产品上完全实现。\n\
    \n![](img/image00189.jpeg)\n\n图 7-1 第一台 VR 设备 Sensorama，由美国摄影师 Morton Heilig 发明[^(\\\
    [1\\])](#part0041.xhtml#f1)\n\n1968 年，美国计算机科学家 Ivan Sutherland 发明了最接近现代 VR 设备概念的\
    \ VR 眼镜原型。这与 Sensorama 相比无疑是前进了一大步。但是这个头盔太重了，需要使用额外的设备吊在头顶，才能让人们感觉稍微舒适一点。\n\n\
    随着材料、通信、成像技术、计算技术的进步，VR 设备越来越轻、处理能力越来越强。当脸书斥资 20 亿美元收购 Oculus 时，大家忽然发现原来 VR 技术已经取得了巨大的进步。巨头的入场，引发了\
    \ 2015 年、2016 年虚拟现实产业的热潮。Pokemon Go 游戏在全球忽然流行开来。这是一款增强现实游戏，人们可以通过智能手机，在我们日常的生活场景中找到一个“小精灵”，获得游戏的胜利。这款游戏，让资本家敏锐地捕捉到，虚拟现实技术可能成熟了。于是，他们不约而同地对其投入大量资金形成一次投资热潮。但是，不可克服的眩晕感、纱窗一样的\
    \ 3D 画面、糟糕的带宽，都抑制了人们使用 VR 设备的热情。上一轮高潮留下的记忆，仅限于商场和游乐场中的儿童游戏设备。\n\n当玩家进入 Half-Life:\
    \ Alyx 后，对 VR 设备的担忧烟消云散了。精致的设计、清晰的细节、流畅的画面，无一不让人身临其境。这款游戏让大家看到 VR 技术的潜力，重新点燃了资本市场的热情。\n\
    \n大家纷纷开始称赞脸书收购 Oculus 这一行为。Oculus 也不负众望，成功推出了 Oculus Quest——VR 一体机。Quest 系列非常受欢迎，而且其中搭载的游戏也更加丰富。预计\
    \ 2020 年 Quest 系列的出货量可以超过 1000 万台。预计到 2025 年，VR 设备的出货量会达到 9000 万台。其增长速度可以和智能手机的增长速度相媲美。\n\
    \n### 游戏和设备进入相互促进正循环\n\n疫情让游戏开发商和设备厂商都嗅到了商机。“宅”经济不断发展，促进了娱乐、游戏和社交的需求。据统计，截至 2020\
    \ 年底，Steam 平台 VR 内容数量已经达到 5554 款，加上 Oculus、VIVE 和 PICO 等平台，目前主流游戏平台上 VR 内容已超过万款。VR\
    \ 已经进入“用户增加—设备开发商、内容开发者收入提高、设备体验感上升/内容持续丰富—用户持续增加”的正向循环（见图 7-2）。\n\n![](img/image00158.jpeg)\n\
    \n图 7-2  VR/AR 进入硬件+内容相互促进的双循环  \n\n（图片来源：公众号“邋遢道人”，兴业证券经济与金融研究院整理）\n\n目前，Half-Life:\
    \ Alyx 这款游戏大火。根据 Superdata 数据显示，2020 年发布的 Half-Life: Alyx 单款游戏收入超过了 2019 年所有 VR\
    \ 游戏收入之和，2020 年全球 VR 游戏收入同比增长 25%，达到 5.89 亿美元。2020 年 Steam VR 的会话数量达到 1.04 亿次，新增用户达到\
    \ 170 万人（初次使用 Steam VR 的用户数量），VR 游戏时间比 2019 年增加了 30%。\n\nSteam 平台[^(\\[2\\])](#part0041.xhtml#comment_17562)的月连接\
    \ VR 设备数量不断创新高，Oculus 已占据半壁江山。Steam 年度报告指出，2020 年平台新增 VR 用户 170 万人，月活 VR 用户 205\
    \ 万人，根据 Roadto VR 的测算，目前 Steam 平台的月连接 VR 设备数量已经超过 250 万台，且不断创造新高。脸书已占据 VR 消费市场半壁以上江山。2021\
    \ 年 3 月 Steam 平台 58%的月连接 VR 设备均为 Oculus 的产品。\n\n### 超现实的体验已经广泛应用于航天、航空、军事等领域\n\
    \nHUD（Head Up Display）是应用最广泛的一类车载 AR 技术。驾驶员不用低头，就可以在风挡玻璃上看到一些基本的驾驶信息，譬如车速、导航等，已成为提高驾驶员注意力的重要工具。因为成本的原因，该技术一般都用在高档车型。毕竟在日常驾驶中，驾驶员也不会一直盯着前方，瞥一眼仪表盘也无伤大雅。\n\
    \n但是对于飞机驾驶员而言，情况则不同。飞行员，尤其是战斗机飞行员，必须牢牢盯紧前方，任何让飞行员分心的行为，都是应该极力避免的。HUD 最早也是为飞行员量身定制的系统。\n\
    \n训练飞行员需要的设备，远非一套“简陋”的 HUD 系统。电影《中国机长》真实还原了一次极限驾驶的场景，即飞机风挡玻璃突然破裂。机长在青藏高原上空艰难地控制飞机，以血肉之躯对抗时速数百公里的大风、严寒，最终安全降落在机场。\n\
    \n"
