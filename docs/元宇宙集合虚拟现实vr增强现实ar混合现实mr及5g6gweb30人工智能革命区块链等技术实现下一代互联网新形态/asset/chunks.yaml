  trans: '


    苹果公司在音乐行业是如此成功，成功到完美地消灭了一个行业。自此以后，苹果进军其他产业的路径，就格外艰难。最典型的就是苹果到目前为止，也没有搞定电视产业。其主要原因就是大型的制片公司，看到唱片公司的下场不寒而栗，他们集体抵制苹果，没有任何一家制片公司和苹果深入合作。


    ## 从 iPod+iTunes 到 iPhone+App Store


    iPod 非常成功，2005 年 iPod 设备的销售收入占据苹果公司收入的 45%。乔布斯不但没有志得意满，反倒深感担忧。他认为，能抢走 iPod 风头的，一定是手机。当每部手机中都内置了音乐播放软件时，iPod
    的路就走到了头。

    幸运的是，苹果公司开发出了风靡世界的智能手机——iPhone。的确如乔布斯所言，iPhone 内置了 iPod 音乐播放器，不仅如此，还继承了 iPod 时代行之有效的“音乐商店”的做法，把音乐商店，扩展成“应用商店”。消费者可以通过应用商店下载各种各样有趣的应用软件，如给照片装饰一个相框，或者记录自己每天跑步的里程等。

    2008 年 3 月 6 日，苹果对外发布了针对 iPhone 的应用开发包，供用户免费下载，以便第三方应用开发人员开发针对 iPhone 及 Touch
    的应用软件。3 月 12 日，仅用不到一周时间，苹果宣布已获得超过 100000 次的下载；三个月后，这一数字上升至 250000 次。众所周知，苹果公司一直以来在产品及技术上都具有一定的封闭性。在
    IBM 推出兼容个人计算机之后，微软等一系列软件公司围绕 PC 开发了很多办公、娱乐软件，通过增强用户对软件的粘性争夺了很大一部分个人计算机用户。而苹果的
    Mac 电脑由于其软件和硬件的兼容性问题一直未被苹果公司重视，因此只拥有 10%左右的“铁杆粉丝”。苹果这次推出 SDK 之举可以说是第一次向个人和企业开发者抛出了橄榄枝。另外，用户购买应用所支付的费用由苹果与应用开发商按照
    3:7 的比例分成，那些一战成名的暴富神话吸引了全球众多的企业开发者和个人开发者。在开发者众星捧月般地簇拥到 App Store 这个平台之后，一个商业生态系统悄悄地形成了。2008
    年 7 月 11 日苹果 AppStore 正式上线，可供下载的应用已达 800 个，下载量达到 1000 万次。2009 年 1 月 16 日，数字刷新为逾
    1.5 万个应用，超过 5 亿次下载。截至 2021 年，App Store 应用程序数量逾 200 万个。

    “应用商店”催生了内容创造产业，其影响力波及整个信息行业，大家不约而同地在思考相同的问题：我们应该成为苹果应用商店里一个碎片化应用，还是另起炉灶，创建自己的应用商店？

    iPhone 作为最流行的手机之一，扮演“大门户”的角色。无论是打电话、玩游戏、刷微博还是阅读电子杂志，人们越来越离不开 iPhone。应用商店扮演平台的角色，解决了与广大开发者之间的利益分配问题，并成为推广软件应用的主要渠道。应用商店里形形色色的各种碎片化应用，满足人们工作、娱乐、休闲、购物等多种需求。

    让我们再回到大数据的视角，来审视应用商店模式。用户只有在下载或者更新应用时，会使用应用商店：而用户使用应用程序而产生的“行为数据”和“内容数据”，并没有被收集和记录。换句话说，仅仅拥有消费者在应用商店中下载应用软件的数据，还不足以构成“大数据”，这些数据的活性不足。

    当 iPad 平板电脑推出后，数据问题就更加突出了。人们在 iPhone 中存有大量的照片、通讯录、音乐、文档等资料，但是如何方便地在 iPad 上看到呢？如果手机丢了，这些资料又如何找回呢？而后，iCloud
    应运而生了。


    ## iCloud 形成完整的商业版图


    2011 年 5 月 31 日，苹果公司官方发布 iCloud 产品，提供了邮件、日历和联系人的同步功能。除此之外，iCloud 还具有强大的存储功能，可以存储人们购买的音乐、应用、电子书，并将其推送到所有匹配设备。可以说，iCloud
    第一次使得包括 iPhone、iPod Touch、iPad，甚至是 Mac 电脑在内的所有苹果产品无缝连接。借助 iCloud，苹果产品也实现了从多个数据源收集数据并进行统一存储和索引的功能，为搭建大数据中心铺平了道路。

    iCloud 具有以下几大功能：照片流、文档和应用云服务、日历、通讯录、邮件、iBooks 备份和恢复。我们发现，每个功能都是苹果收集用户数据的来源（见图
    7-4）。


    ![](img/image00165.jpeg)


    图 7-4 推出 iCloud，标志苹果完成泛互联范式的最后一块拼图

    照片流功能实现用户以通过多个 iOS 设备终端实现实时共享照片的功能，终端包括 Mac 和 iPad。将照片从数码相机导入电脑之中，iCloud 会即刻通过
    WLAN 将它们发送到用户的 iPhone、iPad 和 iPodTouch 上。用户无须人为地去同步或是添加照片到电子邮件的附件中，也不必传输文件，照片就会出现在每一部苹果设备上。同时，用户可以选择指定的人群来共享照片。用户也可以让观众对照片发表评论，并可以回复他们的评论。照片流的功能使得用户影像数据得到统一保存，为影像数据的收集提供了方便。

    文档和应用云服务功能使得可以在 Mac、iPhone、iPad 和 iPodTouch 上创建文档和演示文稿。同样地，iCloud 可让该文件在所有 iOS
    设备上保持更新。iCloud 已内置于 Keynote、Pages 和 Numbers 等 App 中，此外还可与其他支持 iCloud 的 App 配合使用。同时，用户在某一设备上购买的应用也将自动同步到其他设备中。这一功能具有革命性的意义，开发者通过苹果提供的
    iCloud API，可以将自己开发的应用产生的数据保存到云端。用户在使用这个支持 iCloud 的应用时，无须人为地上传或同步数据，即可实现在多设备上同步编辑文档。苹果公司也通过这种方式获得了更具价值的应用数据，进而为应用大数据打下了基础。

    日历、通讯录和邮件让用户可以利用 iCloud 存放用户的私人数据，包括日历、通讯录和电子邮件，并让数据在所有设备上随时更新。一旦用户删除了一个电子邮件地址，添加了一个日历事件，或更新了通讯录，iCloud
    会在各处同时做出这些更改。同样地，用户的备忘录、提醒事项和书签也会进行同步。日历、通讯录和邮件这三个数据源提供了用户最为私密的也是价值最高的数据。苹果公司能够收集到用户的私人数据，这无疑会大大地提升个性化服务的水平。

    iBooks 是又一个具有竞争力的功能。由于移动阅读具有最为广泛的潜在客户群及更为广阔的市场空间，因此一直是各个终端厂商、服务提供商、应用开发商以及运营商争夺的领域。苹果公司凭借其统一、流畅的用户体验赢得了众多用户。iCloud
    的出现无疑进一步巩固了 iBooks 的市场地位。一旦用户从 iBooks 获得了电子书，iCloud 会自动将其推送到用户的所有其他设备中。对于其他操作，iCloud
    也会进行数据的同步。比如，用户在 iPad 上开始阅读，加亮某些文字，记录笔记，或添加书签，iCloud 就会自动更新用户的 iPhone 和 iPod Touch。

    备份和恢复同样值得一提。用户的 iPhone、iPad 和 iPod Touch 上存放着各种各样的重要信息。在接通电源的情况下，iCloud 每天都会通过
    WLAN 对信息进行自动备份，而用户无须进行任何操作。当用户设置一部全新的 iOS 设备，或在原有的设备上恢复信息时，iCloud 云备份都可以担此重任。只要用户将设备接入
    WLAN，再输入 AppleID 和密码就行了。备份和恢复不仅是方便客户的功能，对苹果也极具意义，它最大化地收集了用户的数据，可以衍生出其他服务，并指导其他应用的设计和开发。

    如果把时间切换到 60 年前，人们将发现 iCloud 的意义远远超过 iPhone 的成功。计算机自诞生以来，一直扮演“数据中心”的角色。人们所有的文件、资料都保存在个人计算机中。iCloud
    横空出世，将取代个人计算机的“数据中心”角色。iCloud 也不同于纯粹的互联网应用，其思想和 iPod 时代的音乐管理一脉相传，即泛互联网化。


    ## 数字经济商业模式确立


    从 iPod+iTunes 到 iPhone+App Store，再到 iPhone+App Store+iCloud，数字经济的商业模式基本形成，涵盖了数字创造、数字市场、数字消费、数字资产的各个环节。

    2011 年 iCloud 的推出标志数字经济商业模式确立。十年间，所有大厂的争夺都是围绕数字创造、数字市场、数字消费和数字资产展开。其中，小米的崛起最具代表性。

    小米完全复制了苹果的商业模式，可以看作低配版的苹果。小米公司 2010 年刚刚成立，十年之后，跻身世界 500 强行列。


    ## 智能手机，进步趋缓


    2007 年苹果发布的第一代 iPhone 宣告着智能手机时代来临。到目前为止，iPhone 已经诞生 14 年了。14 年来，硬件、软件都有飞速的发展。人们的生活、工作已经完全不能离开手机。

    如果从外观来看，第一代 iPhone 无疑是颠覆性的。从十几个物理按键，一下子变成只有一个物理按键。一看就是全新的物种，一定和过去的手机有根本的不同。因此，乔布斯用了一句宣传语“我们重新发明了手机”。但是，到现在为止，手机的外观变化很小，唯一的物理按键也没有了，手机正面就是一块玻璃屏幕。其只好围绕尺寸做文章，再大一点，就变成平板电脑了。

    或者，我们从维度的角度来看，手机尽管发生了很多变化，但是始终显示的是二维世界。二维世界，手机、平板电脑、电视这些不同尺寸的屏幕，已经发展到相当高的水平。

    突破可能会来自三维世界。就像 iPod 探索形成的商业模式，唤醒了 iPhone 手机的诞生。手机在二维世界的商业模式和经济模型已经完全成熟。之后再发展的就是终端的变化了。革命性的变化，才能带动全行业的发展。


    ## VR/AR 设备，爆发前夜


    经过近半个世纪的积累，我们终于迎来了有望取代智能手机地位的新终端——VR 一体机。从产业周期上看，现在正处在 VR/AR 爆发的前夜（见图 7-5）。


    ![](img/image00184.jpeg)


    图 7-5　VR/AR 产业趋势（资料来源：东方证券研究所）

    互联网巨头的一些动向，反映了产业的趋势。最具代表性的是脸书。扎克伯格致力于 VR/AR 与社交的有机结合构建社交元宇宙。2014 年，脸书以 30 亿美元收购了
    Oculus VR，正式进军 VR 领域。在 2016 年，脸书提出的十年规划版图中，3—5 年内，他们将着重构建社交生态系统，完成核心产品的功能优化。未来
    10 年，脸书将侧重于 VR、AR、AI、无人机网络等新技术。截至 2021 年初，脸书参与 VR/AR 技术研发的员工比例由 2017 年的 1:10 增长至
    1:5，并频频投资 VR/AR 领域的技术领先者。凭借技术赛道与社交领域的双重优势，脸书有望构建大型社交元宇宙平台。

    从脸书频繁的投资、收购动作中，可以观察到这家公司的野心。终端设备、游戏内容、分发渠道、社交网络几乎全部涵盖。虽然在智能手机市场，脸书已没有进入的机会，但是借助新终端设备的崛起，脸书有望复制苹果公司在智能手机市场的成功故事。

    脸书很可能成为元宇宙的引领者之一。


