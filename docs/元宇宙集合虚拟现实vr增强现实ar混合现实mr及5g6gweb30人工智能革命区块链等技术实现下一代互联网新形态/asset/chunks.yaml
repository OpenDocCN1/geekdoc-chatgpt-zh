    [\[1\]](#part0042.xhtml#commentRef_18437) iTunes 是一款媒体播放器的应用程序，2001 年 1 月 10 日由苹果公司在旧金山的
    Macworld Expo 推出，用来播放及管理数字音乐与视频文件，至今依然是管理苹果电脑最受欢迎的 iPod 的文件的主要工具。此外，iTunes 能连接到
    iTunes Store（在有网络连接且苹果公司在当地有开放该服务的情况下），以便用户下载购买数字音乐、音乐影片、电视节目、iPod 游戏、各种 Podcast
