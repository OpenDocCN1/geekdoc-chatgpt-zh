    加拿大哲学家查尔斯·泰勒指出，基于个人自主性的现代文化，源于社会的历史性转变：人获得空前膨胀的个人权利和自由，由此具有全新的自我理解。M世代，就是这么一群标榜个性，崇尚自我理解、追求自我实现的人，他们有很多标签，有自己独有的圈层文化，如互联网原住民、敢赚敢花的“剁手党”、颜值主义、二次元、懒宅一族、朋克养生党等；他们善于表达，热爱分享，是潮流的引领者。他们用手机指挥商家上门服务，以外卖到家服务为主要表现形式；他们热爱亚文化，如动漫、网游等；他们一般每日外出时间少于3小时，上网时间多于8小时。在游戏中社交，寻找朋友和伴侣的情况也会时常发生，《微微一笑很倾城》[^(\[1\])](#part0016.xhtml#comment_6798)里的故事并不是空穴来风（见图2-1）。


