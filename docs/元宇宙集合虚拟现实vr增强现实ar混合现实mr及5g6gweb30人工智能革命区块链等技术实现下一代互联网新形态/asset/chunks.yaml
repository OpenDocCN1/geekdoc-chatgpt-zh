    人的思维无限而充满想象力，而想象力建立于已知拓展于未知。


    数字化时代的当下，未来是不是像想象中一样？


    “元宇宙”在数字化探索的路上，从专业角度承上启下提出了新的篇章。


    ## 刘高畅 国盛证券首席分析师

    作者的前瞻性令人赞叹，本套书又一次展现了作者对于人类最具想象力科技领域的洞察。


    ## 刘金涛 北京沃丰科技大连公司总经理

    认同决定价值，而非无差别劳动，“元宇宙”系列书将数字世界展现得淋漓尽致，传统的工业化时代已经渐行渐远，数字化时代已经悄悄到来。世界本就是多元化的组成，宇宙又何尝不是多元化，小到一个细胞，大至一个银河系，这些微小的单位有序运转，再到后来的繁荣昌盛。数字化是时代的一个大变革，它将所有微小的单位有序串联起来，而又能有序运营释放。通过数字化发展，人类将获得最大解放；电子网络和个人电脑将分散权力或者说赋予个人最大的权力；信息技术使民族、国家界限模糊，人类将走向全球化；是以合作替代竞争，追求普遍和谐的时代。


    ## 刘兴亮 《亮三点》出品人、DCCI 互联网研究院院长

    关于热点元宇宙，我来亮三点。左一点：现实世界正在加速数字化，我们都在奔赴数字化旅途。右一点：数字虚拟世界也在加速真实化，AR、VR、MR 拐点将至。下一点：面对元宇宙这一新生事物，这套新书可以帮助你更好地了解。


    ## 刘玉超 一体化指挥调度技术国家工程实验室主任

    随着数智时代的到来，数字孪生、人机融合大势所趋！从物理世界到数字世界的映射正逐步构建，未来智能技术的发展将带来认知世界的深度变革！元宇宙不仅是物理世界的数字孪生，更应该是认知世界的数字孪生。尤其重要的是，人和机器作为未来世界认知交互的主体，需要我们从不同维度、不同视角去思考！


    “元宇宙”概念像是一阵飓风，席卷社会各界并引发热议。这是一部因时而生的著作，将为目前社会热点大讨论贡献有价值的观点。《元宇宙》从生态、治理、基础设施等诸多角度描述了元宇宙的全景，读者一定会惊异于三位作者能用如此生动而充满洞见的语言为我们展现如此令人兴奋的虚拟宇宙。元宇宙是当下真实的、正在发生的事，而且正在从根本上改变未来数十年的世界。可以确信的是，我们离元宇宙越来越近了。


