    [\[1\]](#part0042.xhtml#commentRef_18437) iTunes是一款媒体播放器的应用程序，2001年1月10日由苹果公司在旧金山的Macworld
    Expo推出，用来播放及管理数字音乐与视频文件，至今依然是管理苹果电脑最受欢迎的iPod的文件的主要工具。此外，iTunes能连接到iTunes Store（在有网络连接且苹果公司在当地有开放该服务的情况下），以便用户下载购买数字音乐、音乐影片、电视节目、iPod游戏、各种Podcast及标准唱片。


    ## 后人类社会和硅基生命


    ### 时间都去哪儿了？


    根据国家统计局第二次全国时间利用调查结果，居民在一天的活动中，个人生理必需活动平均用时11小时53分钟，占全天的49.5%；有酬劳动平均用时4小时24分钟，占18.3%；无酬劳动平均用时2小时42分钟，占11.3%；个人自由支配活动平均用时3小时56分钟，占16.4%；学习培训平均用时27分钟，占1.9%；交通活动平均用时38分钟，占2.7%。


    有意思的是，吃喝拉撒睡这些基本的生理需求，几乎占据了人们一天之中一半的时间。用于工作的时间也就4个小时。除了生产线上的工人在工作时间无法使用手机之外，工作、个人自由支配、交通、学习培训的时间都可以使用手机。况且许多岗位的工作，就是依赖手机完成的，譬如快递行业。推算下来，人们一天在智能手机上消耗的时间很可能长达5小时以上。


    根据2020年第45次中国互联网络发展状况统计报告，2019年12月，在手机网民经常使用的各类App中，即时通信类App的使用时间最长，占比为14.8%；网络视频（不含短视频）、短视频、网络音频、网络音乐和网络文学类应用的使用时长占比分列第二到六位，依次为13.9%、11.0%、9.0%、8.9%和7.2%。短视频应用使用时长占比同比增加2.8个百分点，增长明显。


    网民在手机观看各类视频上花费的时间，占了总时长的三分之一。就像本章开头所讲，人类是唯一不能完全生活在现实世界的生物。从统计上来看，如果我们把视频内容等同于虚拟空间的话，人们其实已经在元宇宙中沉浸，而不自知。按照这两次统计的结果来看，人们每天至少花费2小时在元宇宙中生活。


    当人们戴上VR头盔的时候，人们沉浸的时长可能不会有太大的变化。这对人类体验的影响，对人类思想的冲击都不容小觑，而这个过程才刚刚开始。


    ### 脑机接口和外骨骼


    脑机接口和外骨骼，都是直接增强个人能力的技术。脑机接口，可以让数字化技术直接理解大脑的指令；外骨骼则直接增强人的体力。


    脑机接口，有时也称作“大脑端口”（direct neural interface）或者“脑机融合感知”（brain-machine interface），是在人或动物脑（或者脑细胞的培养物）与外部设备间建立的直接连接通路。在单向脑机接口的情况下，计算机或者接收脑传来的命令，或者发送信号到脑（例如视频重建），但不能同时发送和接收信号，而双向脑机接口允许脑和外部设备间的双向信息交换。大脑的测量和分析已经达到可以解决一些实用问题的程度。很多科学家已经能够使用神经集群记录技术实时捕捉运动皮层中的复杂神经信号，并用来控制外部设备。人工耳蜗是迄今为止最成功、临床应用最普及的脑机接口。它帮助许许多多的聋哑人恢复了听力。


    外骨骼则在辅助人们的体力劳动方面作出了巨大贡献。


    在某种程度上，骑士的全金属盔甲，可称作一种外骨骼。因为它提供了一个硬壳或皮肤，可以在战斗中保护骑士。航天服和深海潜水的“JIMM”装也算是外骨骼，因为它们在极其恶劣的外部条件下帮助人体正常工作。


    ### Cyborg——半机械人


    半机械人（Cyborg，也称作半机器人）是一种“电子控制的有机体”。也就是说，这是一种一半是人，一半是机器的生物。人类和智能机械可以结合在一起，兼备两者的优点，成为半机械人（Cyborg），这已经是现代科技发展的目标之一。


    当我们把VR/AR设备、脑机接口、外骨骼技术，融合在一起的时候，科幻片中经常出现的超级英雄，就从屏幕走向了现实。《我，机器人》中，男主角左臂就是经过机械改造的（见图7-6）。“钢铁侠”也是一个非常经典的半机器人形象。


    ![](Images/image00190.jpeg)


    图7-6 电影《我，机器人》剧照（图片来源：影片截图）


    半机器人不是新概念，因为人类一直在通过工程性产品来改善自身，但是，目前这主要应用于因为某种生理缺陷、病痛、受伤才接受治疗性改善方案。例如，此类设备可以用于四肢受伤的人，或者由于心脏衰竭而装有起搏器的人。


    未来在元宇宙中，半机械人是否能成为元宇宙的主要居民呢？


    ### 硅基生命


    硅基生命是相对于碳基生命而言的。“硅基生命”这一概念于19世纪首次被提出。1891年，波茨坦大学的天体物理学家朱利叶斯·席纳（Julius Sheiner）在他的一篇文章中就探讨了以硅为基础的生命存在的可能性，他大概是提及硅基生命的第一人。这个概念被英国化学家詹姆斯·爱默生·雷诺兹（James
    Emerson Reynolds）所接受。1893年，詹姆斯·爱默生·雷诺兹在英国科学促进协会的一次演讲中指出，硅化合物的热稳定性使得以其为基础的生命可以在高温下生存。


    科学家对于硅基生命的探索，是从化学角度切入的。我们可以将其类比构成人类主要的元素——碳，将其延伸到与碳同族的硅元素。毫无疑问，硅的化学性质与碳相差甚远。硅的表现并不能合乎人们的期望。以有机化学为参考，能望有机化学项背的硅氢化学体系的尝试以失败告终。因为依靠合成硅烷、硅氧烷等物质的衍生物对有机物进行的复刻根本无法实现。


    以硅材料精雕细琢的“芯片”，却可能产生以AI为主要形态的新型生命。科学家眼中的硅基生命，以“硅芯片+AI+钢铁骨骼+橡胶皮肤”形式，呈现崭新的面貌。


    人工智能的发展的确不负众望。在语音识别、自动驾驶领域，人工智能已经切切实实地改变了人们的生活。


    现在大部分的智能电视，都有语音识别的功能，可以在嘈杂的环境中完成识别换台、调整音量等基本的操作。语音识别功能在驾驶过程中无疑更有价值。司机可以在牢牢握住方向盘的同时，通过语音选择导航的目的地，或者进行打开空调这样的操作。这只是人工智能非常简单的应用。


    在元宇宙中，大规模的制造、生产，未来都是以AI为主体进行。当元宇宙的世界迅速膨胀到物理世界十倍、百倍的规模，我们无法仅仅依赖人类的程序员来实现这一难以承担的任务。事实上，人类程序员扮演的是规则制定者的角色。他们就像“上帝”一样存在，指定元宇宙的几条创世规则。而后AI粉墨登场，依据这些规则创建瑰丽的世界。


    以蚂蚁为例，它们的行为非常简单，即通过触角简单地交换有限的信息。单独来看，一只爬行中的行军蚁非常简单，若把1只行军蚁放在一处平面上，它们会兜兜转转，永不消停，直至累死。若是把数百万只行军蚁放在一起，整体蚁群就成了难以预测的“超级生物体”，展现出高深，乃至骇人的“集体智力”，甚至可以抱成“蚂蚁球”渡过河流。尽管“球”外围的蚂蚁不断溺水而亡，但是作为一个整体，却可以逃出生天，重建种群。


    简单的规则，庞大的数量，就会创造出整体层次上的“智慧”。而这些，恰恰是AI擅长的。元宇宙是AI成长的天堂。


    ## 元宇宙的认识论，你在第几层？


    第六章、第七章分别介绍了平台和终端设备。市面上讲平台经济的图书汗牛充栋，专门讲VR/AR的图书同样洋洋大观。我们在这里将其放在元宇宙中介绍有何不同呢？


    世界到了融合发展的历史时刻，这体现在技术融合、行业融合上。换句话说，靠一款产品单打独斗的年代已经过去了。企业的发展要么加入一个产业生态，要么创造一个产业生态。生态中企业技术架构相似、业务交易相连、数据资源相通，我们应该遵循共创、共生、共赢的理念。


    企业家把不相关的要素看成一个整体的能力，就决定了一家企业的业务边界。'
  fmt: '

    苹果公司在音乐行业是如此成功，成功到完美地消灭了一个行业。自此以后，苹果进军其他产业的路径，就格外艰难。最典型的就是苹果到目前为止，也没有搞定电视产业。其主要原因就是大型的制片公司，看到唱片公司的下场不寒而栗，他们集体抵制苹果，没有任何一家制片公司和苹果深入合作。


    ## 从iPod+iTunes到iPhone+App Store


    iPod非常成功，2005年iPod设备的销售收入占据苹果公司收入的45%。乔布斯不但没有志得意满，反倒深感担忧。他认为，能抢走iPod风头的，一定是手机。当每部手机中都内置了音乐播放软件时，iPod的路就走到了头。

    幸运的是，苹果公司开发出了风靡世界的智能手机——iPhone。的确如乔布斯所言，iPhone内置了iPod音乐播放器，不仅如此，还继承了iPod时代行之有效的“音乐商店”的做法，把音乐商店，扩展成“应用商店”。消费者可以通过应用商店下载各种各样有趣的应用软件，如给照片装饰一个相框，或者记录自己每天跑步的里程等。

    2008年3月6日，苹果对外发布了针对iPhone的应用开发包，供用户免费下载，以便第三方应用开发人员开发针对iPhone及Touch的应用软件。3月12日，仅用不到一周时间，苹果宣布已获得超过100000次的下载；三个月后，这一数字上升至250000次。众所周知，苹果公司一直以来在产品及技术上都具有一定的封闭性。在IBM推出兼容个人计算机之后，微软等一系列软件公司围绕PC开发了很多办公、娱乐软件，通过增强用户对软件的粘性争夺了很大一部分个人计算机用户。而苹果的Mac电脑由于其软件和硬件的兼容性问题一直未被苹果公司重视，因此只拥有10%左右的“铁杆粉丝”。苹果这次推出SDK之举可以说是第一次向个人和企业开发者抛出了橄榄枝。另外，用户购买应用所支付的费用由苹果与应用开发商按照3:7的比例分成，那些一战成名的暴富神话吸引了全球众多的企业开发者和个人开发者。在开发者众星捧月般地簇拥到App
    Store这个平台之后，一个商业生态系统悄悄地形成了。2008年7月11日苹果AppStore正式上线，可供下载的应用已达800个，下载量达到1000万次。2009年1月16日，数字刷新为逾1.5万个应用，超过5亿次下载。截至2021年，App
    Store应用程序数量逾200万个。

    “应用商店”催生了内容创造产业，其影响力波及整个信息行业，大家不约而同地在思考相同的问题：我们应该成为苹果应用商店里一个碎片化应用，还是另起炉灶，创建自己的应用商店？

    iPhone作为最流行的手机之一，扮演“大门户”的角色。无论是打电话、玩游戏、刷微博还是阅读电子杂志，人们越来越离不开iPhone。应用商店扮演平台的角色，解决了与广大开发者之间的利益分配问题，并成为推广软件应用的主要渠道。应用商店里形形色色的各种碎片化应用，满足人们工作、娱乐、休闲、购物等多种需求。

    让我们再回到大数据的视角，来审视应用商店模式。用户只有在下载或者更新应用时，会使用应用商店：而用户使用应用程序而产生的“行为数据”和“内容数据”，并没有被收集和记录。换句话说，仅仅拥有消费者在应用商店中下载应用软件的数据，还不足以构成“大数据”，这些数据的活性不足。

    当iPad平板电脑推出后，数据问题就更加突出了。人们在iPhone中存有大量的照片、通讯录、音乐、文档等资料，但是如何方便地在iPad上看到呢？如果手机丢了，这些资料又如何找回呢？而后，iCloud应运而生了。


    ## iCloud形成完整的商业版图


    2011年5月31日，苹果公司官方发布iCloud产品，提供了邮件、日历和联系人的同步功能。除此之外，iCloud还具有强大的存储功能，可以存储人们购买的音乐、应用、电子书，并将其推送到所有匹配设备。可以说，iCloud第一次使得包括iPhone、iPod
    Touch、iPad，甚至是Mac电脑在内的所有苹果产品无缝连接。借助iCloud，苹果产品也实现了从多个数据源收集数据并进行统一存储和索引的功能，为搭建大数据中心铺平了道路。

    iCloud具有以下几大功能：照片流、文档和应用云服务、日历、通讯录、邮件、iBooks备份和恢复。我们发现，每个功能都是苹果收集用户数据的来源（见图7-4）。


    ![](Images/image00165.jpeg)


    图7-4 推出iCloud，标志苹果完成泛互联范式的最后一块拼图

    照片流功能实现用户以通过多个iOS设备终端实现实时共享照片的功能，终端包括Mac和iPad。将照片从数码相机导入电脑之中，iCloud会即刻通过WLAN将它们发送到用户的iPhone、iPad和iPodTouch上。用户无须人为地去同步或是添加照片到电子邮件的附件中，也不必传输文件，照片就会出现在每一部苹果设备上。同时，用户可以选择指定的人群来共享照片。用户也可以让观众对照片发表评论，并可以回复他们的评论。照片流的功能使得用户影像数据得到统一保存，为影像数据的收集提供了方便。

    文档和应用云服务功能使得可以在Mac、iPhone、iPad和iPodTouch上创建文档和演示文稿。同样地，iCloud可让该文件在所有iOS设备上保持更新。iCloud已内置于Keynote、Pages和Numbers等App中，此外还可与其他支持iCloud的App配合使用。同时，用户在某一设备上购买的应用也将自动同步到其他设备中。这一功能具有革命性的意义，开发者通过苹果提供的iCloud
    API，可以将自己开发的应用产生的数据保存到云端。用户在使用这个支持iCloud的应用时，无须人为地上传或同步数据，即可实现在多设备上同步编辑文档。苹果公司也通过这种方式获得了更具价值的应用数据，进而为应用大数据打下了基础。

    日历、通讯录和邮件让用户可以利用iCloud存放用户的私人数据，包括日历、通讯录和电子邮件，并让数据在所有设备上随时更新。一旦用户删除了一个电子邮件地址，添加了一个日历事件，或更新了通讯录，iCloud会在各处同时做出这些更改。同样地，用户的备忘录、提醒事项和书签也会进行同步。日历、通讯录和邮件这三个数据源提供了用户最为私密的也是价值最高的数据。苹果公司能够收集到用户的私人数据，这无疑会大大地提升个性化服务的水平。

    iBooks是又一个具有竞争力的功能。由于移动阅读具有最为广泛的潜在客户群及更为广阔的市场空间，因此一直是各个终端厂商、服务提供商、应用开发商以及运营商争夺的领域。苹果公司凭借其统一、流畅的用户体验赢得了众多用户。iCloud的出现无疑进一步巩固了iBooks的市场地位。一旦用户从iBooks获得了电子书，iCloud会自动将其推送到用户的所有其他设备中。对于其他操作，iCloud也会进行数据的同步。比如，用户在iPad上开始阅读，加亮某些文字，记录笔记，或添加书签，iCloud就会自动更新用户的iPhone和iPod
    Touch。

    备份和恢复同样值得一提。用户的iPhone、iPad和iPod Touch上存放着各种各样的重要信息。在接通电源的情况下，iCloud每天都会通过WLAN对信息进行自动备份，而用户无须进行任何操作。当用户设置一部全新的iOS设备，或在原有的设备上恢复信息时，iCloud云备份都可以担此重任。只要用户将设备接入WLAN，再输入AppleID和密码就行了。备份和恢复不仅是方便客户的功能，对苹果也极具意义，它最大化地收集了用户的数据，可以衍生出其他服务，并指导其他应用的设计和开发。

    如果把时间切换到60年前，人们将发现iCloud的意义远远超过iPhone的成功。计算机自诞生以来，一直扮演“数据中心”的角色。人们所有的文件、资料都保存在个人计算机中。iCloud横空出世，将取代个人计算机的“数据中心”角色。iCloud也不同于纯粹的互联网应用，其思想和iPod时代的音乐管理一脉相传，即泛互联网化。


    ## 数字经济商业模式确立


    从iPod+iTunes到iPhone+App Store，再到iPhone+App Store+iCloud，数字经济的商业模式基本形成，涵盖了数字创造、数字市场、数字消费、数字资产的各个环节。

    2011年iCloud的推出标志数字经济商业模式确立。十年间，所有大厂的争夺都是围绕数字创造、数字市场、数字消费和数字资产展开。其中，小米的崛起最具代表性。

    小米完全复制了苹果的商业模式，可以看作低配版的苹果。小米公司2010年刚刚成立，十年之后，跻身世界500强行列。


    ## 智能手机，进步趋缓


    2007年苹果发布的第一代iPhone宣告着智能手机时代来临。到目前为止，iPhone已经诞生14年了。14年来，硬件、软件都有飞速的发展。人们的生活、工作已经完全不能离开手机。

    如果从外观来看，第一代iPhone无疑是颠覆性的。从十几个物理按键，一下子变成只有一个物理按键。一看就是全新的物种，一定和过去的手机有根本的不同。因此，乔布斯用了一句宣传语“我们重新发明了手机”。但是，到现在为止，手机的外观变化很小，唯一的物理按键也没有了，手机正面就是一块玻璃屏幕。其只好围绕尺寸做文章，再大一点，就变成平板电脑了。

    或者，我们从维度的角度来看，手机尽管发生了很多变化，但是始终显示的是二维世界。二维世界，手机、平板电脑、电视这些不同尺寸的屏幕，已经发展到相当高的水平。

    突破可能会来自三维世界。就像iPod探索形成的商业模式，唤醒了iPhone手机的诞生。手机在二维世界的商业模式和经济模型已经完全成熟。之后再发展的就是终端的变化了。革命性的变化，才能带动全行业的发展。


    ## VR/AR设备，爆发前夜


    经过近半个世纪的积累，我们终于迎来了有望取代智能手机地位的新终端——VR一体机。从产业周期上看，现在正处在VR/AR爆发的前夜（见图7-5）。


    ![](Images/image00184.jpeg)


    图7-5　VR/AR产业趋势（资料来源：东方证券研究所）

    互联网巨头的一些动向，反映了产业的趋势。最具代表性的是脸书。扎克伯格致力于VR/AR与社交的有机结合构建社交元宇宙。2014年，脸书以30亿美元收购了Oculus
    VR，正式进军VR领域。在2016年，脸书提出的十年规划版图中，3—5年内，他们将着重构建社交生态系统，完成核心产品的功能优化。未来10年，脸书将侧重于VR、AR、AI、无人机网络等新技术。截至2021年初，脸书参与VR/AR技术研发的员工比例由2017年的1:10增长至1:5，并频频投资VR/AR领域的技术领先者。凭借技术赛道与社交领域的双重优势，脸书有望构建大型社交元宇宙平台。

    从脸书频繁的投资、收购动作中，可以观察到这家公司的野心。终端设备、游戏内容、分发渠道、社交网络几乎全部涵盖。虽然在智能手机市场，脸书已没有进入的机会，但是借助新终端设备的崛起，脸书有望复制苹果公司在智能手机市场的成功故事。

    脸书很可能成为元宇宙的引领者之一。


