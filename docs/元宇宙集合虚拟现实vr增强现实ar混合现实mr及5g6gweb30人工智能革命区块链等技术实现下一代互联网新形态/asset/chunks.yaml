    ## 后人类社会和硅基生命


    ### 时间都去哪儿了？


    根据国家统计局第二次全国时间利用调查结果，居民在一天的活动中，个人生理必需活动平均用时 11 小时 53 分钟，占全天的 49.5%；有酬劳动平均用时 4
    小时 24 分钟，占 18.3%；无酬劳动平均用时 2 小时 42 分钟，占 11.3%；个人自由支配活动平均用时 3 小时 56 分钟，占 16.4%；学习培训平均用时
    27 分钟，占 1.9%；交通活动平均用时 38 分钟，占 2.7%。

    有意思的是，吃喝拉撒睡这些基本的生理需求，几乎占据了人们一天之中一半的时间。用于工作的时间也就 4 个小时。除了生产线上的工人在工作时间无法使用手机之外，工作、个人自由支配、交通、学习培训的时间都可以使用手机。况且许多岗位的工作，就是依赖手机完成的，譬如快递行业。推算下来，人们一天在智能手机上消耗的时间很可能长达
    5 小时以上。

    根据 2020 年第 45 次中国互联网络发展状况统计报告，2019 年 12 月，在手机网民经常使用的各类 App 中，即时通信类 App 的使用时间最长，占比为
    14.8%；网络视频（不含短视频）、短视频、网络音频、网络音乐和网络文学类应用的使用时长占比分列第二到六位，依次为 13.9%、11.0%、9.0%、8.9%和
    7.2%。短视频应用使用时长占比同比增加 2.8 个百分点，增长明显。

    网民在手机观看各类视频上花费的时间，占了总时长的三分之一。就像本章开头所讲，人类是唯一不能完全生活在现实世界的生物。从统计上来看，如果我们把视频内容等同于虚拟空间的话，人们其实已经在元宇宙中沉浸，而不自知。按照这两次统计的结果来看，人们每天至少花费
    2 小时在元宇宙中生活。

    当人们戴上 VR 头盔的时候，人们沉浸的时长可能不会有太大的变化。这对人类体验的影响，对人类思想的冲击都不容小觑，而这个过程才刚刚开始。


    ### 脑机接口和外骨骼


    脑机接口和外骨骼，都是直接增强个人能力的技术。脑机接口，可以让数字化技术直接理解大脑的指令；外骨骼则直接增强人的体力。

    脑机接口，有时也称作“大脑端口”（direct neural interface）或者“脑机融合感知”（brain-machine interface），是在人或动物脑（或者脑细胞的培养物）与外部设备间建立的直接连接通路。在单向脑机接口的情况下，计算机或者接收脑传来的命令，或者发送信号到脑（例如视频重建），但不能同时发送和接收信号，而双向脑机接口允许脑和外部设备间的双向信息交换。大脑的测量和分析已经达到可以解决一些实用问题的程度。很多科学家已经能够使用神经集群记录技术实时捕捉运动皮层中的复杂神经信号，并用来控制外部设备。人工耳蜗是迄今为止最成功、临床应用最普及的脑机接口。它帮助许许多多的聋哑人恢复了听力。

    外骨骼则在辅助人们的体力劳动方面作出了巨大贡献。

    在某种程度上，骑士的全金属盔甲，可称作一种外骨骼。因为它提供了一个硬壳或皮肤，可以在战斗中保护骑士。航天服和深海潜水的“JIMM”装也算是外骨骼，因为它们在极其恶劣的外部条件下帮助人体正常工作。


    ### Cyborg——半机械人


    半机械人（Cyborg，也称作半机器人）是一种“电子控制的有机体”。也就是说，这是一种一半是人，一半是机器的生物。人类和智能机械可以结合在一起，兼备两者的优点，成为半机械人（Cyborg），这已经是现代科技发展的目标之一。

    当我们把 VR/AR 设备、脑机接口、外骨骼技术，融合在一起的时候，科幻片中经常出现的超级英雄，就从屏幕走向了现实。《我，机器人》中，男主角左臂就是经过机械改造的（见图
    7-6）。“钢铁侠”也是一个非常经典的半机器人形象。


    ![](img/image00190.jpeg)


    图 7-6 电影《我，机器人》剧照（图片来源：影片截图）

    半机器人不是新概念，因为人类一直在通过工程性产品来改善自身，但是，目前这主要应用于因为某种生理缺陷、病痛、受伤才接受治疗性改善方案。例如，此类设备可以用于四肢受伤的人，或者由于心脏衰竭而装有起搏器的人。

    未来在元宇宙中，半机械人是否能成为元宇宙的主要居民呢？


    ### 硅基生命


    硅基生命是相对于碳基生命而言的。“硅基生命”这一概念于 19 世纪首次被提出。1891 年，波茨坦大学的天体物理学家朱利叶斯·席纳（Julius Sheiner）在他的一篇文章中就探讨了以硅为基础的生命存在的可能性，他大概是提及硅基生命的第一人。这个概念被英国化学家詹姆斯·爱默生·雷诺兹（James
    Emerson Reynolds）所接受。1893 年，詹姆斯·爱默生·雷诺兹在英国科学促进协会的一次演讲中指出，硅化合物的热稳定性使得以其为基础的生命可以在高温下生存。

    科学家对于硅基生命的探索，是从化学角度切入的。我们可以将其类比构成人类主要的元素——碳，将其延伸到与碳同族的硅元素。毫无疑问，硅的化学性质与碳相差甚远。硅的表现并不能合乎人们的期望。以有机化学为参考，能望有机化学项背的硅氢化学体系的尝试以失败告终。因为依靠合成硅烷、硅氧烷等物质的衍生物对有机物进行的复刻根本无法实现。

    以硅材料精雕细琢的“芯片”，却可能产生以 AI 为主要形态的新型生命。科学家眼中的硅基生命，以“硅芯片+AI+钢铁骨骼+橡胶皮肤”形式，呈现崭新的面貌。

    人工智能的发展的确不负众望。在语音识别、自动驾驶领域，人工智能已经切切实实地改变了人们的生活。

    现在大部分的智能电视，都有语音识别的功能，可以在嘈杂的环境中完成识别换台、调整音量等基本的操作。语音识别功能在驾驶过程中无疑更有价值。司机可以在牢牢握住方向盘的同时，通过语音选择导航的目的地，或者进行打开空调这样的操作。这只是人工智能非常简单的应用。

    在元宇宙中，大规模的制造、生产，未来都是以 AI 为主体进行。当元宇宙的世界迅速膨胀到物理世界十倍、百倍的规模，我们无法仅仅依赖人类的程序员来实现这一难以承担的任务。事实上，人类程序员扮演的是规则制定者的角色。他们就像“上帝”一样存在，指定元宇宙的几条创世规则。而后
    AI 粉墨登场，依据这些规则创建瑰丽的世界。

    以蚂蚁为例，它们的行为非常简单，即通过触角简单地交换有限的信息。单独来看，一只爬行中的行军蚁非常简单，若把 1 只行军蚁放在一处平面上，它们会兜兜转转，永不消停，直至累死。若是把数百万只行军蚁放在一起，整体蚁群就成了难以预测的“超级生物体”，展现出高深，乃至骇人的“集体智力”，甚至可以抱成“蚂蚁球”渡过河流。尽管“球”外围的蚂蚁不断溺水而亡，但是作为一个整体，却可以逃出生天，重建种群。

    简单的规则，庞大的数量，就会创造出整体层次上的“智慧”。而这些，恰恰是 AI 擅长的。元宇宙是 AI 成长的天堂。


    ## 元宇宙的认识论，你在第几层？


    第六章、第七章分别介绍了平台和终端设备。市面上讲平台经济的图书汗牛充栋，专门讲 VR/AR 的图书同样洋洋大观。我们在这里将其放在元宇宙中介绍有何不同呢？

    世界到了融合发展的历史时刻，这体现在技术融合、行业融合上。换句话说，靠一款产品单打独斗的年代已经过去了。企业的发展要么加入一个产业生态，要么创造一个产业生态。生态中企业技术架构相似、业务交易相连、数据资源相通，我们应该遵循共创、共生、共赢的理念。

    企业家把不相关的要素看成一个整体的能力，就决定了一家企业的业务边界。


