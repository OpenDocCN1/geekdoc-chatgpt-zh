    ### 通过5G、云计算技术支撑大规模用户同时在线，提升游戏的可进入性


    元宇宙是大规模的参与式媒介，交互用户数量将达到亿级。目前大型在线游戏均使用客户端软件，以游戏运营商服务器和用户计算机为处理终端运行。该模式下，对计算机终端的性能要求形成了用户使用门槛，进而限制了用户触达；同时，终端服务器承载能力有限，难以支撑大规模用户同时在线。而5G和云计算等底层技术的进步和普及，是未来突破游戏可进入性限制的关键。


    ### 通过算法、算力提升驱动渲染模式升级，提升游戏的可触达性


    目前，3D游戏采用传统的终端渲染模式，受限于个人计算机图形处理器（GPU）渲染能力，游戏的画面像素精细度与拟真效果仍有很大差距。为改进现有的渲染模式，提升游戏的可触达性，需要算法、算力的突破以及半导体等基础设施产业的持续进步。


