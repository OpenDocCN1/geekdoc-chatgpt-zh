    \n## 游戏，是元宇宙的胚胎发育期\n\n元宇宙是互联网发展的下一个形态，各行各业都会受到影响。每一个时代，都会有一个先导产业爆发式增长，带动其他要素发展，其他要素进一步促进相关产业的发展，从而形成正反馈，社会便加速进步。我们首先回顾一下工业时代的先导产业，以及工业革命发生的顺序，这有助于我们预测元宇宙的发展。\n\
    \n### 棉花产业带动了工业革命\n\n如果要问什么产业代表工业力量，大家都很容易地想到空间站、火星车、飞机、巨轮、原子弹等。但是从哪个产业开始，才引发了伟大的工业革命呢？\n\
    \n早在18世纪，英国开启了第一次工业革命。在工业革命之前，农业和手工业占据英国经济的主体地位。所有的经济活动中，生产食物、衣服和住房是最基本的，而在所有天然衣服纤维中，棉纤维是最具柔韧性和最易由机器控制的。与生产粮食和建造房屋相比，纺织劳动更为轻便，更少依赖天气、季节、光照等自然条件，也更容易采用简单重复的动作来完成，比如纺纱、织布等。因此，此类活动也就更容易利用低成本的工具实现机械化。与其他轻工业消费产品（如珠宝、陶瓷、家居产品等）相比，纺织品的市场潜力最大，消费弹性最强。纺织品既可以做材料，也可以做成最终消费品。纺织品市场能随着人们收入的提高而快速增长，轻松支撑大规模生产，并因为其技术简单而能促进竞争下的创新。在工业革命开始前的14世纪，英国政府就已经帮助英国培育全球的纺织品市场将近百年。18世纪初，英国已经创建了最大的欧洲纺织品市场，并拥有数量最多的纺织品原始工业。[^(\\\
    [1\\])](#part0020.xhtml#comment_7594)\n\n英国的工业革命率先从棉纺行业开始，并且，只有具备高收入弹性需求的巨大市场，才能够刺激并维持机械化大规模生产。\n\
    \n工业革命一旦起步，连锁反应便开始了。卡尔·马克思曾在《资本论》中说过：“机械纺纱机造就了机械编织，并且二者在漂白、印刷、印染方面的化学革命势在必行。同样地，为了分离种子和棉纤维，棉纺革命催发了轧棉机的发明。只有通过这个发明，当时所需要的大规模棉花生产才成为可能。”"
