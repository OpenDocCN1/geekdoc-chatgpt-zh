    ## 终端的进步与产业的变革


    终端，对应的英文单词是“terminal”，是一条通信术语，原义是指远离计算主机的输入输出设备；现在泛指与最终用户交互的网络设备。譬如，手机就是典型的终端，而过去的胶片照相机不能算终端，因为没有联网功能。自动驾驶的汽车，也是一种类型的终端。


    终端是通信技术、网络技术、芯片、软件、传感器、制造工艺等各类技术的综合应用，代表了先进的技术和先进的商业模式。


    李书福曾经笑称：“汽车不就是四个轮子的沙发吗？”马斯克也曾经云淡风轻地说：“汽车不就是四个轮子的平板电脑吗？”此后，特斯拉横空出世。汽车自身也进化成为一种新型的终端，开始颠覆传统汽车产业格局。


    VR/AR都属于一类新型的终端设备，就像特斯拉的出现颠覆汽车产业一样，VR/AR终端的普及，同样会带来行业的大变革。我们回顾终端的发展历史，从中找出虚拟现实的发展路径。


    理解终端与产业变革，我们从iPod开始讲起。


    ### iPod的丰碑


    iPod是便携音乐播放器发展史上的一座丰碑，至今仍无人超越。“苹果公司是先开发了iPod还是先开发了iTunes软件？”这个问题恐怕连最资深的苹果粉丝也难以回答。


    在2000年左右的美国，人们热衷于从P2P软件中下载音乐并刻录到CD上，但下载软件、刻录软件及刻录机的操作具有一定的门槛，只有发烧级的音乐爱好者才会钻研如何使用这些东西。乔布斯从中看到了巨大的商机，他收购了音乐管理程序Rio的创业团队，并用他一贯苛刻的要求使得该产品变得更简单易用，优化用户体验。这款产品就是后来的iTunes[^(\[1\])](#part0042.xhtml#comment_18463)。


    有了iTunes之后，乔布斯希望能有一个和iTunes配套的产品，让用户更轻松地收听音乐，这样iPod才被创造出来。事实上是先有iTunes，后有iPod，这和许多读者的认知恐怕有所不同。iTunes创立之初面临着“巧妇难为无米之炊”的困境，而当时的唱片公司日子也不好过，整天在一系列的盗版案件中挣扎。乔布斯凭借其在好莱坞的创业经验和天才的商业头脑，说服了五大唱片公司向其提供数字音乐的销售权。乔布斯计划把每首歌曲的价格定为让人心动的99美分，唱片公司将从中抽取70美分。于是iTunes商店诞生了，“音乐公司能赢利，艺术家能赢利，苹果公司也能赢利，而用户也会有所收获”的“四赢”商业模式最终被确立起来。iTunes商店在推出后的6天内就卖出了100万首歌曲，在第一年卖出了7000万首歌曲；2006年2月，iTunes商店卖出了10亿首歌曲；2010年2月，iTunes商店卖出了100亿首歌曲。


    在“iPod+iTunes商店”模式中，人们发现硬件、软件、内容（音乐）首次完美地结合在一起，形成最佳的用户体验。苹果通过大量的iPod，控制了音乐发行的渠道，从而引发整个音乐产业的变革（见图7-3）。


    ![](Images/image00167.jpeg)


    图7-3　iTunes+iPod开创了泛互联网化模式的雏形


    在这个模式中，iPod作为一款独立的音乐播放设备，非常受人欢迎。同类的MP3播放器，跟iPod相比就像廉价的山寨货。iPod已成为人们收听音乐的首选，没有人在使用iPod的时候，还会使用其他播放器。iPod客观上具备了音乐门户的特征。


    iTunes商店则构建了和唱片公司合作的商业模式，分成比例接近7:3，唱片公司占大头。在iTunes商店中，唱片公司没有盗版的困扰。苹果公司，进一步直接和有才华的音乐人签约，他们可以跳过唱片公司，直接在iTunes商店中，发行他们的最新作品。苹果公司取代了唱片公司部分职能，同时通过iTunes商店获利的第三方也大大增加，iTunes商店已成为一个广受欢迎的音乐发行平台。


    消费者自然众口难调，苹果打破了按照唱片发行的惯例，用户可以购买单独的曲目，不再把好听的歌曲和差的歌曲混在一起强迫消费者购买。把唱片碎片化成单独歌曲，从而最大限度地满足了用户个性化的需求。


    我们可以站在消费者的立场，从数据的角度再来总结“iPod+iTunes”模式。音乐可以同时保存在iPod和iTunes中，这两者之间通过“同步”的机制来保持一致性。另外，同步的数据中还包括“播放列表”数据。播放列表就是消费者的“偏好”，这极具个人色彩，每个用户的播放列表肯定是不一样的。在“iPod+iTunes”机制中，“播放列表”并不完全依赖iPod，这就保证当人们换一个新iPod时，依然能够非常容易地找到自己喜爱的歌曲。


    这种数据“同步”的机制，和纯粹的互联网应用是不同的。纯粹的互联网应用在用户的“终端”是没有数据的。换句话说，泛互联网化的终端是在离线状态下，依然可以发挥核心的功能。如果在联网的状态下，用户可以获得更多的数据。而纯粹的互联网应用在离线状态下是不可用的。这也是泛互联网化应用与互联网应用之间重要的差别。


    ### 唱片行业的挽歌


    所有的唱片公司老板当初答应乔布斯通过iTunes销售歌曲时，没想到自己将亲手埋葬这个行业。


    在iPod问世之前，歌手创作音乐，唱片公司制作唱片并向全国推广发行。大型的唱片公司占据行业的枢纽地位。歌手如果不和大型的唱片公司签约，再有才华也可能无人问津，但是有了iPod，局面有所改观，所有的音乐爱好者，都喜欢iPod代理的优美音质和随时随地的体验。更重要的是，通过iTunes可以购买自己喜欢的任何歌曲、音乐，并且立刻就可以在iPod中欣赏，人们再也不用跑到唱片店选购唱片，带回家欣赏。


    所有的唱片公司发行能力，都被iTunes取代了。歌手发现自己可以很容易地把自己创作的歌曲上传到iTunes，iTunes成为最大的歌曲发行商。借助iPod+iTunes组合，音乐爱好者和歌曲作者紧密地连接在一起，再也没有唱片公司的任何生存空间。


    唱片公司，作为一个行业，永远消失了。'
