    科技的突破一直引领着现代社会飞速发展，从混沌到秩序的创新涌现让越来越多的想象变成现实。由虚拟世界联结而成的“元宇宙”将为我们展现数字经济与信息技术交相辉映的宏大前景，预示着人类新时代的来临。未来已来，我们拭目以待。


    ## 李新永 纪晓岚研究专家、书法家

    “元宇宙”系列书版梓于辛丑，恰逢党诞百年，艰辛历历唤指华夏民族崛起之光辉航向。宇宙无限，初始有元，元亨利贞。万象自然，大道前行，积识启智，时代所需。


    ## 李亚倩 华益控股董事长

    “上下四方曰宇，往古来今曰宙。”“元宇宙”这个我们并不太熟悉的事物如同我们的未来，既充满未知又令人心动不已。这套书将帮助我们探寻上下，思索古今，迎接虚实共生的人类新世界！


    ## 李熠 51WORLD 创始人兼 CEO

    每十年，新的技术范式都将代替以往的范式，带动全新的社会创新与进步。2000 年到 2010 年，我们历经了 PC 互联网的十年浪潮；而 2010 年到 2020
    年，移动互联网来势汹汹，快速席卷全社会；如今，到了 2021 年，我们又一次站在历史的分水岭。预计未来十年，元宇宙将作为与物理世界平行的数字世界，推动全行业实现终极数字化转型，因为它的能量远超移动互联网。如果你错过了
    PC 互联网、移动互联网，那么，不要错过互联网的下一站——元宇宙。


    ## 李玉彪 威海市商业银行信用卡中心经理

    读佛诵经，一沙一叶，空色不二，纷纷万物而有法度。学物理学，天体运转，量子纠缠，万千变化而有规律。读马克思，人来人往，社会变迁，终是各类社会关系的规律运转。天法道，道法自然，道生一，一生二，二生三，三生万物。《元宇宙》通过一个个生动的商业剖析，从一沙中见世界大千；带读者去数字世界中穿越与畅享，透过千姿百态而又返璞归真，最终回到一，找到商业的道，让我对数字经济有了新的视角和认知。经济逐利，但作为一个当代商业人，通过《元宇宙》《元宇宙通证》，我离经济的道、商业的善、自我的真更近了。


    ## 李志军 东方航空信息部副总经理、《旅行简史》作者

    “元宇宙”系列书是能给我们带来诸多启发的书。它带领我们到平行于现实世界、又与现实世界密切联系的在线虚拟世界进行了一趟旅行，让我们了解了“元宇宙”的构建原理、运行模式和商业价值。可以预见，不论是否使用化身，元宇宙必将是我们每一个人生活、工作和学习中的一个全新世界。实际上，我们每个人都早已或深或浅地踏入元宇宙里了。为了更好地迎接未来，推荐大家都认真读一读。


    ## 李志磊 希鸥网创始人

    元宇宙概念在全球资本市场风潮正起，多个项目已经斩获大额投资，这本关于元宇宙的书，值得勇于冒险的你认真读一读，你将走进一个新世界。


    ## 廖双辉 投投金融董事长、东方财富联合创始人

    元宇宙是独立于现实世界的第二虚拟数字世界，用户以数字身份在其中自由生活，其核心在于可信地承载人的资产权益和社交身份，能够寄托人的情感，让用户有心理上的归属感。虽然在技术层面，元宇宙的实现尚需一定的技术突破，但透过“元宇宙”系列书，我们可以清晰地看到元宇宙已经离我们越来越近了，我们应该积极拥抱这种趋势，把握历史的潮流。


