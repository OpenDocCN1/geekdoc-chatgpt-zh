    # 前言


    大家常用“看山是山，看水是水”来形容认知的第一个层次。如鸿蒙就是鸿蒙，以太坊就是以太坊，游戏就是游戏。因此，就好像元宇宙的书大家也不用细看，不过是另外一个噱头而已。如果看不到鸿蒙、以太坊、游戏、VR/AR的内在关联性，割裂地看待不同技术和领域，认知也就被固化在第一层。在这个层次，我们可以认识到事物的组成要素，了解要素的特征、价值等。但是，这个认知是割裂的、孤立的、缺乏联系的。在这个认知层次上，如果我们认识不到改变的必要性，就更体会不到改变的迫切性。


    “看山不是山，看水不是水”，进入了认知的第二个层次。我们往往看到了事物之间的联系，意识到了整体性的存在，但是又忽略了事物之间的独特性。游戏和VR/AR有关，VR/AR和网络有关，网络和5G、6G有关……用鲁迅先生的话来讲，一见到短袖子，立刻想到白胳膊，立刻想到全裸体，立刻想到生殖器，立刻想到性交，立刻想到杂交，立刻想到私生子。这种普遍联系忽略了事物之间的独立性和差异性。如果我们看不到事物发展的约束条件，对事物泛泛而谈，行动起来便会漫无头绪。这个认知层次上，言语有相当大的迷惑性。一些概念就因此被人诟病。


    “看山还是山，看水还是水”，进入认知的第三个层次。在这个层次上，人们既能综合事物的整体性，又能分析事物的独特性；既能看到事物之间普遍联系的本质，又能提纲挈领地抓住普遍联系的主要问题。一旦进入此境界，人们也就具备了改变现状的能力。元宇宙作为兼具综合性、概括性、具体性、实操性的概念，需要我们到达认知的第三个层次，才能对其深刻地理解。只有深刻地理解元宇宙概念，人类才能付诸行动。


    大家可以合上书本想想，对于关于元宇宙的概念，我们的认知到了第几层？


    # 后记


    这本书的创作过程，可以说是风云际会、一拍即合。一群走在时代前沿的人，感觉到了时代的大潮。迅速聚拢，立刻确定目标，调整自己的工作内容，整合各路资源，分工协作，才使得这本书在短短两个月的时间内面世。


    2021年6月8日，主创团队和编辑团队第一次碰面。乔社长虽刚履新不久，仍然秉持着对前沿趋势的关注和热情，早已开始筹划“元宇宙”书系的出版工作。当时，我正在和毛基业院长合作写作一本关于数字化转型的书。看到各行各业综合应用数字化技术，迅速形成新的组织模式和商业模式，甚至重新组合各类生产要素，汇聚成为新兴的数字生态。这些轰轰烈烈的数字化转型的实践，蕴含着新的产业规律和新的经济思想，所谓新理论就是在这些新的实践中产生的。


    但是，数字化转型的理想形态是什么？对于这个最终问题的思考一直困扰着我。只有找到这个理想的最终形态，各行各业才能以此为目标，并结合企业的现状，找到数字化发展的路径。大量传统产业数字化转型的案例都提出DTO概念，借用数字孪生的概念，指出未来的组织都是数字孪生组织。思考、决策在数字世界，执行在物理世界。但是这个概念有点抽象，读者不易接受。


    恰好，易欢欢眉飞色舞地跟我讨论“元宇宙”，并且把他的微信昵称都改成了“All in元宇宙 大未来”。我意识到元宇宙就是我一直在找的数字化转型的理想形态，而且它以一种非常具象化且深具传播力的概念表达出来。再看看同行写的各类分析报告，以Roblox为范本，综合分析5G、VR/AR、区块链、游戏，约略指出了发展方向。


    2017年，我在写作《数字生态论》时，开始涉足数字经济领域的研究。书中指出数字经济的最小单元是数字化的产业生态，数字经济其实就是新型经济体系的代名词。数字经济体系庞大，传统商品的生产、流通、消费各个环节，都和传统经济学思想有千丝万缕的联系，缺少纯粹的能够完全展示数字经济魅力、特征的场景。当然，以加密货币为基础的经济体系，已经是完整意义上的数字经济了，但是其对传统金融的冲击，尤其是背后绝对无政府主义的思想，很难被纳入我国主流语境。


    元宇宙恰恰提供了一个完整、自洽的经济体系，即纯粹的数字产品生产、消费的全链条，和物理商品的生产、销售宏观全链条相比，其已经具备了所有经济学意义上的特征。但不同的是，元宇宙中全部是数字产品，没有任何物理生产过程。这个特征恰恰是研究数字经济的最佳范本。无须像过去研究经济一样，做出各种不能成立的假设，把经济活动从社会活动中剥离出来，机械地、僵化地套用数学模型，得出似是而非的结论。这种研究方法，本身就是错误的，更不要说从中得出的结论。


    但是，现实世界纷繁复杂，社会学、经济学领域的研究总能找到反例来反驳任何创新的观点。要打破传统经济学对人们思想的桎梏，就需要找到那些颠覆性的案例，让传统经济学连研究方法都没有立足之地才行。更重要的是，根据新的数字经济理论，预测世界发展的方向，预判产业的目标，对实践起到实实在在的指导意义才行。


    元宇宙的经济学，就具备这些特征。在数字世界中生产数字商品，同时只在数字世界中消费。这个经济循环的链条，在过去是没有出现过的。传统经济学的研究重心是围绕物理商品展开的。无论是宏观经济学还是微观经济学，无论是新自由主义经济学还是新制度经济学，面对元宇宙中的经济现象，都是无能为力的。


    从这点来讲，元宇宙是诞生和验证数字经济理论的最佳演练场。理论来自实践，领先的理论来自领先的实践，伟大的理论来自伟大的实践。对于我们做产业研究的人来说，还有什么能比得上产业的彻底变革所带来的震撼和喜悦呢？


    不仅是经济，元宇宙还是一个“社会”，更是M世代组成的后现代社会。其中不仅有经济现象，还有文化现象、社会现象。在这个超越国家、民族、地域、时间界限的社会中，会孕育出什么样的文明？实在令人神往。


    元宇宙中，存在和虚无、自我和宇宙、肉体和精神的思辨和统一，淋漓尽致地展现在我们的面前。电影《黑客帝国》中其实一直在问，人类到底能不能一直生活在虚拟世界中？虽然尼奥率领大家最终摧毁了Matrix，但是日出之后的物理世界，是人们理想中的家园吗？至少有一点是我们都认同的，人类不能一直生活在物理世界中。这些问题，也在不断地吸引我们走进元宇宙，一起创世纪。


    《元宇宙》成书时间非常短，创作过程也非常“元宇宙”。基于过去研究数字经济的一些心得，结合科技领域最激动人心的变革，给出未来发展方向粗线条的梳理。错漏之处多到我自己都不甚满意。就如王巍理事长所说，相较于严谨的学术著作，实在是谬之千里。但是对于元宇宙的M世代，已经是姗姗来迟了。好在宇宙都是不完美的，在进化中才能生发出大千世界。因此，《元宇宙》仅仅是个开端，就像宇宙大爆炸一样，创世的奇点。乔社长要基于此，打造出系列书籍的元宇宙，易欢欢要搞出投资的元宇宙，徐远重要搞出区块链的元宇宙，邢杰要搞出通证的元宇宙。


