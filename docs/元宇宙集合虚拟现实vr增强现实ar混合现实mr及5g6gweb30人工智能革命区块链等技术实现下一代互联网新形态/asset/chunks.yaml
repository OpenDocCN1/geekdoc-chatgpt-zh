    ### NFT

    NFT 是一种非同质化资产，不可分割且独一无二。非同质化资产的特点在于不能进行分割，且并不是完全相同的，恰恰现实世界和虚拟世界中的大部分资产都是非同质化的。NFT
    能够映射虚拟物品，成为虚拟物品的交易实体，从而使虚拟物品资产化。人们可以把任意的数据内容通过链接进行链上映射，使 NFT 成为数据内容的资产性“实体”，从而实现数据内容的价值流转。映射数字资产之后，装备、装饰、土地产权都有了可交易的实体。


