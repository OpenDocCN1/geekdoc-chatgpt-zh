  md: '然而，要在这个节点上取得最佳效果，我们还必须以一种适应性强、具有前瞻性的视角来应对。在我看来，这意味着我们应如同拥抱Model T(21)和Apple
    II(22)那样拥抱AI。历史上，突破性技术一直在创造未来的职位，我想这一次也不例外。


    # # 职业生涯的蜕变


    回溯至2012年，我与本·卡斯诺查（Ben Casnocha）共同出版了《为什么精英都有超级人脉》这本关于现代职业管理的书。我们觉察到，社会上关于职业生涯的讨论，往往集中在变化如何使人们难以遵循加入一家公司、一步步往上爬，直至熬到领退休金的旧模式。人们依旧抱着那些不再适用的经验教训，为它们的消逝而悲伤。


    我们认为，更为明智的方式是通过习得新的、适用于职业流动性更大的世界的经验教训，以迎接未来的挑战。


    10年后，我们出版了《为什么精英都有超级人脉》（修订版），以反映一些新的重大变化，比如从临时工作的大幅增长到大规模流行病的影响，以及远程—现场办公混合和远程办公模式的兴起。


    未来我们可能需要再次修订，以涵盖AI的崛起。如果是这样，我们可能不会等到2032年再出版。谁知道呢？或许在第三版问世时，GPT-4已经能成为一名独立的合著者。'
