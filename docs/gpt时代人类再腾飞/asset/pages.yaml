  md: '哈耶克：这听上去很有趣。那么这将如何帮助解决集体行动中的问题？


    奥斯特罗姆：如你所知，集体行动中的问题是指个体有搭便车或背离对整个群体有利的合作安排的动机的情况，例如管理共有资源、提升公共利益或减损公共利益。这个问题产生的原因是个体理性与集体理性之间的分歧以及监控和执行协议中的难点。


    哈耶克：是的，我对这个问题非常了解。实际上，我曾主张依赖市场的自发秩序来解决这个问题，因为价格代表着资源的稀缺性和价值，而竞争则会激励创新和提升效率。我还警告过中央计划和干预的危险性，这会扭曲价格体系，压制特定地区或文化中所积累的经验和知识并产生不正当激励。


    奥斯特罗姆：我同意市场在协调人类行为方面是一种重要而强大的机制，而计划和干预往往会失败或适得其反。然而，我认为市场并不是唯一或最佳的解决方案，在许多情况下，集体行动中的问题需要通过其他治理方式来解决，如自组织、多中心性和参与式民主。


    哈耶克：能解释得更详细一些吗？


    奥斯特罗姆：首先，市场并不总是完美或完备的。在许多情况下，市场会失灵或根本不存在，例如外部性、公共产品、共有资源、信息不对称和交易成本。这时价格并未反映行为的'
