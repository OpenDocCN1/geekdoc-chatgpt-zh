    奥斯特罗姆：这正是AI可能发挥作用的地方。AI可以作为一种工具，基于参与者的输入数据与标准来生成、评估和选择制度选项。例如，一个AI系统可以根据资源、用户和环境特征等生成一组共有资源管理的可能规则，如针对渔业、森林或江河流域的管理条例。系统还可以为每条规则生成一组可能的结果及其影响，如合作水平、资源的可持续性以及收益与成本的分配。然后，系统可以将这些选项展示给行动者，他们可以从中选择最适合自身偏好和需求的选项，或者通过反馈和迭代加以修改和完善。'
