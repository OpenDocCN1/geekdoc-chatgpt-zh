    真是太棒了！现在，让我们更深入地探讨那些通常被认为面临AI威胁某些特定职业，它们在未来可能会如何发展。


    # 全新销售时代


    丹尼尔·平克（Daniel Pink）(24)曾撰写了一本《纽约时报》畅销书《全新销售》。将计算机视为销售人员令人难以想象，比如AI如何通过指出你和它上过同一所学校，或分享关于抚养孩子的有趣故事来建立融洽关系？


    然而，我可以轻松地想象GPT-4等工具将如何提升人类销售人员的能力。优秀的销售人员会投入时间深入了解潜在客户，并尽可能根据他们的特定需求定制展示方案，使客户更容易看到产品在满足其需求方面的优势。


