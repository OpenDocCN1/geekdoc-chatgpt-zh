    # 加速印刷吧


    如果你问一位新闻记者，决定其工作价值观的最重要因素是什么，他很可能会回答“准确性”，尤其是在接受正式采访时。但新闻业常被称为“历史的初稿”，原因就在于，速度至关重要，无论是在新闻业还是许多其他行业，情况都是如此。


    无论新闻记者报道的是战争、竞选、天气事件、市场形势还是一家极受欢迎的新餐厅，他们总是在与时间赛跑，力求尽快收集信息，将一定程度上的真相传达给大众。


    有时，速度压力决定了新闻记者所撰写的历史初稿可能确实非常粗略，背景信息缺失，故事的重要方面尚未完全呈现。


    因此，尽管我们大部分人可能将新闻视为一种产品，但它归根结底是一个过程——反复迭代且自我纠正的过程。在理想情况下，明天的报道会对今天的内容进行优化、澄清和拓展。准确性是一个持久的核心价值，但速度同样至关重要。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '这也是我相信GPT-4等AI工具能对新闻业产生巨大、积极影响的主要原因：它们将帮助新闻机构以前所未有的速度收集、制作和发布新闻。


    这包括自动从大量公共记录中筛选重要的故事；每天监控和分析超过8亿条的社交媒体帖子以达到同样的目的；在几秒钟内生成标题、转录采访并将基本信息以不同风格和格式进行打包和个性化呈现。


    “你在开玩笑吗？！”某位新闻记者现在可能会用英文首字母缩写AYFKM来呈现这句话，“尽管GPT-4确实存在胡编乱造这个令人头疼的问题，从而放大新闻业错误地将速度置于事实之上、捕风捉影的行事作风，你还是打算使用它吗？”


    请暂时不要发推文。我并不是那个意思。


    在未来，优质新闻的产生仍然离不开新闻工作者的艰辛付出，以及他们审慎且迅速的判断和评估能力。优质新闻仍然需要经过谨慎、深入、多阶段的编辑。这种情况在短期内不会有所改变。这个过程实际上并不快捷；在AI出现之前，这个过程也不是完全不会出错的。


    然而，正如我之前所提到的，速度一直是新闻传播过程中的关键要素。实际上，由于对速度的需求，想要做出优质新闻总是需要迅速采纳并有效利用尖端技术，如印刷机、相机、录音机、电视网络、互联网以及智能手机等，这些技术加快并扩大了新闻的生产和传播速度。'
  merge: -1
