- pgno: 61
  md: '令人惊讶的是，平板电脑会跟踪教师的手指滑动，以查看他们是否以及如何快速地滑动到课程的结尾。


    这种特定的标准化模式似乎帮助了学生。诺贝尔奖得主迈克尔·克雷默（Michael Kremer）进行了随机对照试验，将该模型与当地公立学校的教学成果进行比较，结果发现，桥梁国际学院的学生平均只用两年时间就掌握了超过公立学校教学三年所达到的学习成果。克雷默及其同事评论道：“本研究中的测试分数效果是国际教育文献中报告的最显著的效果之一。”


    即便在这种看似削弱教师自主权的技术面前，成功的关键仍然是教师的热情参与。通过这个现已更名为NewGlobe的系统，教师的积极性大幅提高，一个关键指标就是缺勤率大幅度下降至不到1%，相较之下，附近的肯尼亚公立学校缺勤率约为45%（如前所述）——尽管公立学校的工资要高得多。桥梁国际学院一位名叫赞博·戴维斯（Zeambo
    Davis）的教师告诉Quartz的记者，精确的教学脚本可以“让你少说话，更多地与学生互动”。


