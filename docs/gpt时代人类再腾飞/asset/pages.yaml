    哈耶克：我明白了。那么替代方案是什么呢？


    奥斯特罗姆：替代方案并不一定是自上而下的或一刀切的。它们通常是自下而上的，并与具体情境适配。它们包括受影响且了解问题的参与者的参与和对他们的赋权，以及对情境多样性与复杂性的认可和尊重。此外，它们还涉及制定和调整制度，即可以促进行动者合作、协调和沟通的游戏规则，以平衡集体行动中的激励与制裁、权利与责任以及成本与收益。


