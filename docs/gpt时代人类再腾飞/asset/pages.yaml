  md: '最后，我认为我们的文化和媒体带来了一种消极偏见。我们不断被糟糕的新闻和悲剧故事轰炸，这会让世界看起来充满了可怕的事物。这可能使我们过度关注负面现象，即使世界上还有很多美好的事物。


