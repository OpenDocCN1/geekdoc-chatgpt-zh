  md: '# 未来，属于终身学习者


    我们正在亲历前所未有的变革——互联网改变了信息传递的方式，指数级技术快速发展并颠覆商业世界，人工智能正在侵占越来越多的人类领地。


    面对这些变化，我们需要问自己：未来需要什么样的人才？


    答案是，成为终身学习者。终身学习意味着着具备全面的知识结构、强大的逻辑思考能力和敏锐的感知力。这是一套能够在不断变化中随时重建、更新认知体系的能力。阅读，无疑是帮助我们整合这些能力的最佳途径。


    在充满不确定性的时代，答案并不总是简单地出现在书本之中。“读万卷书”不仅要亲自阅读、广泛阅读，也需要我们深入探索好书的内部世界，让知识不再局限于书本之中。


    # 湛庐阅读 App: 与最聪明的人共同进化


    我们现在推出全新的湛庐阅读 App，它将成为您在书本之外，践行终身学习的场所。


    +   - 不用考虑“读什么”。这里汇集了湛庐所有纸质书、电子书、有声书和各种阅读服务。

    +   - 可以学习“怎么读”。我们提供包括课程、精读班和讲书在内的全方位阅读解决方案。

    +   - 谁来领读？您能最先了解到作者、译者、专家等大咖的前沿洞见，他们是高质量思想的源泉。

    +   - 与谁共读？您将加入优秀的读者和终身学习者的行列，他们对阅读和学习具有持久的热情和源源不断的动力。


    在湛庐阅读 App 首页，编辑为您精选了经典书目和优质音视频内容，每天早、中、晚更新，满足您不间断的阅读需求。


    【特别专题】【主题书单】【人物特写】等原创专栏，提供专业、深度的解读和选书参考，回应社会议题，是您了解湛庐近千位重要作者思想的独家渠道。


    在每本书图的详情页，您将通过深度导读栏目【专家视点】【深度访谈】和【书评】读懂、读透一本好书。


    通过这个不设限的学习平台，您在任何时间、任何地点都能获得有价值的思想，并通过阅读实现终身学习。我们邀您共建一个与最聪明的人共同进化的社区，使其成为先进思想交汇的聚集地，这正是我们的使命和价值所在。'
