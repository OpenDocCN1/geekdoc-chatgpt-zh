- pgno: 254
  md: '人类给AI设定目标，AI来驱动工具，霍夫曼通过他与GPT-4的对谈带领我们走向未来。在那里，AI不再是威胁，而是伙伴，一个可以帮助我们充分发挥人类潜力的伙伴。


    # GPT-4翻译，人类监制


    感谢湛庐邀请我来做这次新的翻译尝试，我们决定利用GPT-4来翻译一本介绍GPT-4的书。我想给大家分享一下我的翻译方法：先通过调用GPT-4的API，来实现英文原稿到中文的翻译，然后利用给出提示（Prompt）的方式让GPT-4用科技文风重写翻译，这样可以让译文不断接近出版水准。这需要人工在原始译稿阶段对翻译单词和句子的准确性进行校准，毕竟GPT-4模型的知识储备还停留在2021年底，很多英文内容的中文表述没有与时俱进。


    这本书由霍夫曼与GPT-4共同撰写，这不仅仅是一本书，更是一场对话，探讨了AI，尤其是像GPT-4这样的大型语言模型，如何在教育、商业和创意等关键领域提升人类的能力。最后，请允许我用霍夫曼的对话风格来结束这篇译者序。


    芦义：请解释一下Impromptu: Amplifying Our Humanity Through AI


    GPT-4: Impromptu是一个通过AI提升我们人类特质的概念或倡议。这个倡议旨在促进AI技术的发展，以使其更好地辅助我们的日常生活，同时强调并提升我们作为人类的优点和价值观。'
  merge: -1
  img_proc: true
- pgno: 255
  md: '一方面，AI是对我们自身的延伸，可以帮助我们扩展知识、设计新工具以及解决日益复杂的问题。我们所创造的AI旨在提高生产力、优化资源利用并满足不断变化的需求。


    另一方面，Impromptu还强调我们应当保持人类的核心特质，如创造力、同情心、直觉和道德判断。Impromptu的目标是利用AI来增强这些特质，而不是取而代之，从而使我们能够在这个数字化世界中充满信心地拓展人的潜力。


    总之，Impromptu: Amplifying Our Humanity Through AI 强调了AI技术的价值，认为它们应该被用作一种手段来完善我们的人性，并在我们日常生活中找到更好的方向。这也表明，我们应该关注AI技术所带来的机遇，同时关注如何更好地对待彼此，以及我们身边的社会和环境。


    作为一个AI乐观派，我希望人类研究AI是为了提高人类智能（Human Intelligence）、人类的潜能和人类的目标感—— Peace.'
