  md: '# 08 当AI编造事实


    确凿的真理及基本确凿的真理同样存在。


    There are lots of settled truths (and mostly settled truths)out there.


    2022年11月30日，OpenAI以“研究预览”（research preview）的方式向全球推出ChatGPT，他们在公司博客中提醒大家：“ChatGPT有时会给出看似合理实则错误或无意义的回答。”


