- pgno: 53
  md: '当然，关心学校是否会以及如何应用大语言模型的美国人群并不仅限于教师。


    # 教育的重要性与另一个韦斯·摩尔


    韦斯·摩尔（Wes Moore）在3岁那年失去了父亲。


    他的母亲带着他从巴尔的摩搬到纽约与他的祖父母共同居住。然而，韦斯的母亲发现，自离开布朗克斯以来，周围的犯罪和贫困问题愈演愈烈，她开始为这个失去父爱的年幼非裔男孩的未来感到担忧。因此，她竭尽全力让韦斯进入了私立的河谷乡村学校（Riverdale
    Country School）。遗憾的是，到了13岁，韦斯还是因为情节轻微的犯罪行为和学业不佳陷入了困境。


    出于对儿子的担忧，韦斯的母亲决定送他去费用更高的异地寄宿学校。正如韦斯后来所写的那样，为了支付学费，他的祖父母用自己的退休金与“几十年的积蓄和抵押贷款”为他支付在瓦莱弗格军事学院（Valley
    Forge Military Academy）就读的学费。


    瓦莱弗格军事学院改变了韦斯的命运。他先后入读约翰斯·霍普金斯大学和牛津大学，并荣获罗德奖学金。此后，他在战争中立下赫赫战功，并成为知名首席执行官。2022年，他当选为美国马里兰州州长（成为美国历史上第三位非裔州长），并被视为未来总统的潜在候选人。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '这个关于韦斯战胜困境的故事背后，还有一个悲惨的阴暗故事。


    在未来州长韦斯·摩尔赢得罗德奖学金的同一年，另一个名叫韦斯利·摩尔（Wesley J. Moore）的年轻人因谋杀罪被判终身监禁，并开始在杰瑟普惩教所（Jessup
    Correctional）服刑。


    他们两个人有很多共同之处。他们出生在相近的时间和地区，都是在20世纪70年代失去父亲的孩子。在十几岁时，他们都曾与警察和学校发生过纠纷。他们的母亲都尝试过转学——韦斯利从糟糕透顶的北方高中（Northern
    High School，已关闭）转到略好一些的佩里霍尔高中（Perry Hall High School，目前在马里兰州排名倒数第三）。


    2010年，身为州长的韦斯出版了一本书，在此之后两人开始通信并建立起互访。由他们的通信记录整理出版的《另一个韦斯·摩尔》（The Other Wes Moore）开篇就阐明了情况的严重性。


    我们两个中的其中一人自由自在，过上了童年时代从未敢奢望的生活。而另一个则将因一起持械抢劫致一名警察和一位有五个孩子的父亲死亡而在监狱度过余生。令人不寒而栗的事实是，他的故事本可能是我的人生；其中的悲剧性在于，我的故事本可能是他的人生。


    目前，他们两个人都还不到50岁。


