  img_proc: true
- pgno: 184
  md: '当必应聊天机器人的另一个身份Sydney浮现并以明显让人不悦的方式与部分用户互动时，微软因匆忙将必应聊天机器人推向市场而受到了严厉批评。短短几天内，微软采取了简单措施，将用户与必应聊天机器人的会话长度限制在6个问题以内。


    这显然解决了当时的问题，我认为这也凸显了在线软件分发的一个关键优点。这就是为什么我认为这个领域的监管可能与针对汽车或药品的监管有很大不同：当你需要在数字世界发布召回通知时，你可以迅速且彻底地执行。


    # 仅事实，以及超越“足够好的知识”


    大语言模型生成非事实性内容还具有另一个潜力。当有人提示GPT-4编写一个虚构的故事，或创建一个富有想象力的商业计划，或仅为一款新产品想出六条潜在的宣传语时，这些虚构的文本可以称得上是富有成效甚至具有创造力的。它们增强了人类在想象和概念思维方面的能力。


    这种思维在很大程度上定义了我们作为人类的特质。有时，我们似乎将创造能够超越时间、空间和物质的工具视为人类物种的使命，所有这些都是为了表现我们想象力的全部潜力。这就是为什么我们不断发明新技术（涉及绘画、写作、电影、电视、视频游戏和元宇宙）：为了帮助我们更生动地“产生幻觉”，并更容易地分享结果。


    这个问题似乎非常适合向GPT-4本身提出。我提出了一个假设，并为了好玩加入了一个转折。'
