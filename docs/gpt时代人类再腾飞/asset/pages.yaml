    根据美国国家教育统计中心的数据，2018年美国公立学校约有370万名教师，私立学校约有40万名教师，共同为大约5 660万名来自不同背景和需求的学生提供服务。


    教师会对学生的学术成就和个人成长产生重要影响。斯坦福大学经济学家埃里克·哈努谢克（Eric Hanushek）的研究表明，与一位非常高效的教师共度一年，可以使学生的终身收入增加5万美元；将水平最差的5%的教师替换为平均水平的教师，可能会在未来80年内使美国的GDP增加100万亿美元。'
