    采访者：所以，你们都承认互联网技术对公共领域产生了矛盾和复杂的影响，但对它们带来的变革程度和变革的性质存在分歧。你们如何解释这种差异，以及它们对你们的民主改革理论和民主改革建议的影响是什么？


