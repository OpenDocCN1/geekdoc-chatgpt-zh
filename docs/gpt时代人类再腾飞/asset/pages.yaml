  md: '那些无法在这些标准化活动之外创造价值的管理顾问将受到冲击。一家管理咨询公司不可能让年轻的分析师和助理动动手指操作AI工具，就向客户收取数倍于这些分析师和助理的工资的咨询费。但是，那些能够利用AI解放出的时间专注于提供更多非传统见解的管理顾问，可以将更多的精力投入这些高价值活动中，并在AI的协助下为客户提供更优质的服务。


