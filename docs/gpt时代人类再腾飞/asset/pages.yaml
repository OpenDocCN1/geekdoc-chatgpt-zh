- pgno: 43
  md: '坦率地说，明茨教授在大语言模型诞生之前就已经是一位卓越的教师。因此，ChatGPT在2022年底发布时，你可能认为他会对此表现出冷漠或抗拒。


    事实却是，这位70岁的学者在看到ChatGPT的强大能力时，与我产生了相同的想法：他渴望立刻应用它。


    # GPT教授，对人类思考与写作的助推


    正如我即使没有用过GPT-4写书也想要借助它来撰写这本书一样，明茨教授迅速将这一新工具融入他多年的教学方法中。在ChatGPT问世几个月后，明茨教授便开始要求他研讨课上的学生与这一新工具合作撰写论文。作为家庭作业，学生需将尝试过程中使用的提示以及ChatGPT的回应带入课堂进行探讨。学生在提交最终论文时还需附上对ChatGPT产出内容的修改记录。


    作为一位优秀教师，明茨教授选择将ChatGPT用作协助学生个体和群体学习的工具，而非作为解答和权威信息的来源，也不是代替他或学生完成任务的工具。这似乎体现了他的信念：人类可以运用我们所有的工具，包括这些最新的神奇计算成果，来提升我们独特的能力。


    在2023年早些时候的一篇专栏中，明茨教授将ChatGPT描述为近期出现的一系列改变教育的技术之一。


    就像谷歌降低了人们对坚不可摧的记忆力的依赖，电子计算器加速了复杂数字运算，维基百科取代了纸质百科全书，在线数据库降低了人们对庞大实体图书馆的依赖，ChatGPT等平台同样也将深刻改变人类最珍视的技能。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '这种将烦琐的任务留给机器，从而节省时间投身新的、艰巨的任务的过程，需要我们对人决定人之为人的特质充满信心。然而，正如明茨教授所写：


    > (如果ChatGPT) 能像人一样胜任某个工作，那么人类就不应该再去模仿、掌握完成这些工作所需的能力，而是要超越它们。因此，高等教育的下一个任务是培养毕业生，使他们能够充分利用这些新工具，摆脱局限性。这意味着强调主动和体验式学习的教学方法，引导学生运用这些新工具去做工具无法完成的事情。


    面对瞬息万变的未来，为了预见哪些技能将受到重视，明茨教授参考了托马斯·查莫洛-普雷穆日奇（Tomas Chamorro-Premuzic）的研究。托马斯是一位年轻、幽默、热情的组织心理学家，著有《为何众多无能男人都成了领导者？》（Why
    Do So Many Incompetent Men Become Leaders）。


    明茨教授赞同托马斯的观点，即人类可以通过以下三个方面与AI共同发展：（1）擅长提出最佳问题；（2）学习从深度学习网络所使用的“训练数据”中无法获得的洞察力或技能；（3）将洞察力转化为实际行动。


    霍夫曼：GPT-4，你是否认同即使你的能力在不断提高，这些仍将是人类独特的能力？


