- pgno: 117
  md: '# 05 重塑社交媒体，让人之所以成为人


    在一个AI工具可以令人信服地模拟人类表达的世界中，真正的人类会寻找方法来传达他们是有形存在的生物。


    As the logical consequence of living in a world where AI tools can convincingly
    simulate human expression, actual humans will seek ways to convey that they are
    corporeal beings.


    年仅24岁的吉米·唐纳森（Jimmy Donaldson），也就是YouTube账号“野兽先生”（MrBeast）的运营者，已创建了一整套优质的YouTube视频，累计达到2.21亿订阅者和超过350亿的总观看量。显然，他对扩大影响力颇具心得。


    我对野兽先生印象最为深刻的一点，是他和团队在为视频命名方面的高超水准，他们能以极具吸引力的方式精准传达视'
  merge: -1
  img_proc: true
- pgno: 118
  md: '频的核心内容。


    +   - “为了1万元，你敢坐在满是蛇的地方吗？”

    +   - “千名盲人首次领略视觉世界。”

    +   - “5万块磁铁能否抓住飞速行进的炮弹？”


    这些视频的主题一目了然，且毫无疑问地引人入胜。比如，你现在是不是在好奇5万块磁铁能否真的抓住飞速行进的炮弹呢？优质的标题便是最佳营销手段。


    因此，当我开始关注GPT-4对社交媒体的潜在影响时，我花了大约一小时，让GPT-4根据各种提示为可能的野兽先生的视频生成标题。尽管GPT-4的大部分回答相当普通，但它能即刻生成海量答案的特质意味着它的成功率不需要很高——仔细找找，我们总能从中发现令人满意的答案。以下是我认为它表现最佳的一些回答。


    霍夫曼：为野兽先生创作25个有趣的视频标题，以兰博基尼和其他东西为主题。


    GPT-4：兰博基尼与1万个气球的对决：气球能让兰博基尼飘起来吗？


    霍夫曼：为野兽先生创作25个诙谐且富有创意的视频标题，要和辣椒酱有关。'
  merge: -1
  img_proc: true
- pgno: 119
