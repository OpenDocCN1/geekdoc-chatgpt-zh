    # 机会@工作，让变革走向更有意义的阶段


    几乎所有经济学家都一致认为，获得学士学位是人们可以做出的最佳经济投资之一。然而，除重视大学学位之外，一个不幸的现象是，越来越多没有学士学位的人会被提前排除在众多岗位的考虑范围之外，即使他们具备胜任这些工作的技能。


    这对数百万求职者而言极不公平，同时也使得雇主错失了一些有才华的职员。这对我们的经济和社会发展都是不利的。上大学、筹集资金和完成学业的机会并不是均等的。地理位置、贫困、家庭责任、课程与工作时间冲突及许多其他因素阻碍了很多有抱负且有能力的人获得大学学位。受影响的群体往往是非裔美国人和西班牙裔、乡村居民以及有着不同种族背景和族群背景的退伍军人。'
