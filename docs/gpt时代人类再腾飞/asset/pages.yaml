  md: '我想强调，本章的讨论主要立足于美国。首先，这是我生活和工作的地方；其次，前文提到，美国的监禁率在全球名列前茅。


    此外，我必须承认，作为一名享有特权的美国白人男性，我的视角有很多局限。我还认识到，在刑事司法领域讨论AI可能的正面应用场景是颇具争议的，因为从历史上看，刑事司法领域正是AI存在问题的领域。但AI已经出现，它已经应用于该领域，并且不会退出。


    现在我们需要决定如何使用这些技术，并且要掌握在刑事司法背景下如何应用它们的发言权。如果不参与这场对话，那就会将开发乃至定义这些技术的权利拱手让给那些曾制定结构性不平等政策的机构。我们是否愿意承担这样做的风险？


    无论这场对话多么难以推进，但如果不探讨如何将AI用于改善不公正的局面而非导致更多不公正现象的出现，那就是不负责任的行为。我们无法做到完美——任何人类制度都会存在某种程度的偏见，但我们必须持续努力改进。


    # 潜在风险何在


    大量证据表明，AI在刑事司法领域的应用已导致一些问题，并且未来还会引发其他问题。这个概念极具反乌托邦潜力，激发了许多科幻电影和书籍的创作灵感。然而，我们无需借助虚构的作品就能看到AI在刑事司法领域应用的弊端。'
