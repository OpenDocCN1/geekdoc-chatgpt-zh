  md: '域的边界与多样性，使更多人能获取并创造信息，展开跨境沟通，构建或加入网络与行动，挑战并抵制主导话语及权力架构。互联网技术的负面作用在于割裂与极化了公共领域，制造了“回音壁”与信息茧房，放大了虚假信息与信息操控行为，侵蚀了公共话语的质量及可信度，破坏了协商民主的规范与制度，使公共领域分裂和两极分化。


