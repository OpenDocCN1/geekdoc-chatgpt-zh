- pgno: 52
  md: '霍夫曼：你认为教师应将大语言模型作为“补充资源而非替代品”，而希尔兹女士和明茨教授正尝试实现该目标的具体方法。你能谈谈其他例子，阐述一下在实践中忙碌的教师如何“保持对‘你的’输出和局限性的批判性和反思”吗？


    GPT-4：教育工作者保持对我的输出和局限性的批判性和反思的一种可能方法是，将我用作探究工具，而非权威信息来源。例如，他们可以不完全依赖于让我提供正确答案或解决方案，而是使用我生成多个可能答案或方案，然后让学生比较、评估和论证。这样，他们可以培养学生的批判性思维和解决问题的能力，以及对现实世界情境中的不确定性和复杂性的认识。


    另一种可能的方法是将我用作反馈工具，而非评估工具。

    例如，他们可以不使用我为学生的表现打分或排名，而是利用

