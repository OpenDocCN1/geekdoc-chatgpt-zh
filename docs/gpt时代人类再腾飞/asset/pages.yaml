  md: '平均来说，地球上约25%的人口是15岁以下的儿童。拉丁美洲和印度的15岁以下儿童均符合这个平均水平；欧洲和北美的人口年龄结构略显老化；而非洲的人口年龄非常年轻：非洲15岁以下的儿童有5.6亿，占总人口的40%。


    不过，非洲也拥有世界上最薄弱的公共教育体系。联合国数据显示，约60%的非洲儿童（超过3亿人）在15岁时仍未上学。其中有1 500万名儿童根本不会上任何学校。而那些上学的孩子每天也只能接受不到3小时的教育，部分原因是教师缺勤率高达45%。


    以2016年的一个数据为例，利比里亚有4.2万名渴望上大学的学生，但仅有1名学生通过了允许学生申请大学的考试。


    在这一背景下，过去20年中最具潜力的技术之一是2008年推出的一个平板电脑系统，而乍一看这似乎并未提升教育行业的水平。2017年，《经济学人》描述了这一系统在大约10万名发展中国家学生中的应用情况。


    在内罗毕郊区的桥梁国际学院（Bridge International Academies）格蒂纳分校，尼古拉斯·奥卢奥奇·奥奇恩（Nicholas Oluoch
    Ochieng）一边观察着他5岁的学生，一边看着自己的平板电脑。设备上显示着一份课程脚本。每一行都是在约11 200千米之外的美国马萨诸塞州坎布里奇市书写的。那里的一个美国团队每10天做一次分析，处理来自桥梁国际学院在肯尼亚的405所分校的25万份测试成绩，然后利用这些数据调整那些学生感到困惑的课程内容。如果教师教授相同的年级，他们将提供相同的课程，时间表也是标准化的。因此，当奥奇恩的学生依照书本上朗读时，桥梁国际学院每个幼儿园的教室里都应该回荡着相同的声音。'
