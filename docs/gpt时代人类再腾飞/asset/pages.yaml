  md: '从1635年马萨诸塞湾殖民地建立第一所公立学校开始，美国一直期待学校能拯救学生和社会。但是，教育真的能带来如此大的改变吗？家庭收入和邮编（出生地址）仍然在很大程度上决定了一个人的入生（收入水平、是否犯罪等），教育本身的影响有时甚至难以察觉。那么，我们能指望学校做到什么程度呢？如果韦斯·摩尔与韦斯利·摩尔互换学校，两人的生活会发生多大的改变？


    如果我们希望学校能够提升低收入家庭的孩子的能力，那么仅仅依赖技术是不够的。有很多教育科技公司进行了随机对照试验，却发现他们的产品并未产生实质性的影响与改变。


    我们也知道，仅靠资金同样无法解决问题。美国是在数十年间大幅增加公立学校投资但未见贫困家庭儿童状况有所改善的众多国家之一。据美国国家教育统计中心数据，2018—2019学年，美国公立中小学的总支出达到了8
    000亿美元：每个学生的支出大约是富裕国家平均水平的1/3，是1980年每个学生实际支出的2倍，是1950年每个学生实际支出的4倍。


    那么，有什么方法能真正实现大规模改善学校教育水平的目标呢？如果有，它又是什么样的？我询问了GPT-4，但当我提供足够的背景信息以便让它能够充分参与讨论时，它的计算引擎变得不堪重负，它的回答也开始变得混乱和不连贯（这也是早期一些以不同寻常的方式使用搜索引擎的人在使用GPT-4时遇到的情况）。'
