  md: '1. 八十七年前，我们的先辈们在这个大陆上创立了一个新的国家，它孕育于自由之中，奉行一切人生来平等的原则。


    2. 现如今，我们正卷入一场伟大的内战，以考验这个国家，或者任何一个孕育于自由和奉行上述原则的国家能否长久存在下去。


    3. 我们汇聚于这场战争的一处重要战场。


    4. 我们来到这里，是要在此为献出生命的人设立永恒安息之所，以确保国家得以延续。


    5. 我们这样做是完全应当且合适的。


    因此，根据这种划分方式，葛底斯堡演说的第五句是：我们这样做是完全应当且合适的。


    突然间，GPT-4似乎真正理解了计数原理，并能系统地运用其知识得出正确答案。它似乎知道如何计算林肯演说的句子数量。现在，它似乎成了葛底斯堡演说的专家。你知道布利斯本指的是葛底斯堡演说最具权威性的版本吗？我原先并不知道。


    当然，这里的关键词仍然是“似乎”。GPT-4与其前身一样，并无意识，它只是在预测方面表现得更出色。我想再次强调，GPT-4经常展示出的惊人的认知能力模拟仅仅是模拟。GPT-4并非具有意识、自我认知以及感知能力的AI实体，就像'
  merge: -1
  img_proc: true
- pgno: 35
  md: '《禁忌星球》（Forbidden Planet）中的机器人Robby或《星际迷航》（Star Trek）中的Data。


    然而，我也想再次强调，GPT-4能模拟如此具有语境意识的类人意识的能力也是相当重要的事情。


    我为什么这样认为？最近，屡获殊荣的科幻作家特德·姜（Ted Chiang）在《纽约客》杂志发表的一篇批判性文章帮助我阐述了这个观点。


    特德在文章中写道：“可以将ChatGPT视为包含整个网络上所有文本的模糊JPEG图像，它保留了网络上的大部分信息，就像JPEG保留了高分辨率图像的大部分信息一样，但如果要寻找特定的比特序列，你是找不到的，只能得到一个近似值。”


    在特德看来，构成ChatGPT（以及像GPT-4这样的类似大语言模型）的信息的不精确表示既创造了它们的合成能力，也导致了它们产生错觉和其他错误的可能。作为“包含整个网络上所有文本的模糊JPEG图像”，它们能够以新颖的方式综合信息，因为它们可以一次性访问所有这些信息。这使它们能够将自身关于某个事物的知识与关于其他事物的知识结合起来，然后将这些知识混合成一个新的事物。


    特德举了烘干机弄丢袜子的现象和美国宪法的例子。ChatGPT知道这两件事情，所以它可以利用这些知识创造一个新事物，用后者的风格描述前者：“在人类历史的进程中，当一'
  merge: -1
  img_proc: true
- pgno: 36
  md: '个人有必要将他的衣物与它们的配对者分开，以维持清洁和秩序时……”


    效果好像还不错。但特德表示，由于ChatGPT只是对网络文本的近似表示，它（除了在事实上具有挑战性之外）在创造力方面非常受限。它无法创造真正新颖的东西，只能“重新包装已有的信息”。


    尽管我觉得特德的文章很有启发性，但我认为他关于“网络上所有文本的模糊JPEG图像”的核心隐喻低估了大语言模型的合成能力。


    首先，我认为重新包装现有信息实际上描述了人类创新能力（无论是艺术还是其他方面）的很大一部分。


    其次，也更重要的是，大语言模型实际上具有并运用了全新的知识组织能力。


    虽然现在的网络包含了难以想象的海量信息，但其中大部分信息仍被封闭在数十亿个独立页面中。例如，请考虑以下这些问题：


    +   - 谁是赢得MVP奖的身高最高的职业橄榄球大联盟（NFL）跑卫？

    +   - 拥有超过100万居民的城市中，哪些曾有过女市长？

    +   - 谁是扮演詹姆斯·邦德的演员中最年长的？


    回答这些问题的数据无疑已经存在于网络上。有些网站确切地列出了每个NFL的MVP获得者，有些网站则准确地汇编了NFL'
