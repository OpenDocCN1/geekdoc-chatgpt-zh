- pgno: 131
  md: '随着GPT-4等AI工具的问世，我们将在行业发展、整体工作模式以及职业发展方面看到类似的变化。那些能够把这些新工具巧妙融合进工作流程的企业、职业及个人将获得最佳收益。反之，那些未能以战略性的方式适应AI潮流的企业将难以在瞬息万变的市场中保持占有率和竞争力。


    在我看来，忽视AI就如同在20世纪90年代末忽视博客，或者在2004年忽视社交媒体，抑或在2007年忽视移动互联网。不久，熟练运用这些工具将变得对所有专业人士越来越重要，它们也是催生新机会和新职业的主要动力。从现在开始发展相关技能和能力，将使你未来受益匪浅。


    当然，AI带来的变革将同时产生正负两面的影响。过去的技术革命淘汰了特定人群，比如因工厂的大规模生产而失业的手工艺者，以及近年因机械自动化程度提高而失去工作的工厂工人。


    如今，知识型劳动者同样面临这些挑战。尽管我坚信这些新型AI工具将创造新职位、新产业，带来巨大的经济效益和生活质量的提升，但同时也存在淘汰部分蓝领和白领职位的风险。


    鉴于此现实，政策制定者和商业领袖可以采取多种措施以帮助实现这种转型。这包括投资培训和再培训项目，以确保劳动者具备担任新职务所需的技能。这其实也是在为受自动化影响的劳动者提供一定程度的保障措施。'
