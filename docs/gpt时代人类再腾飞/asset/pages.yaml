  md: '在根斯巴克设想直升机汽车成为美国城市的普遍特色近50年后，像Joby Aviation这样的公司终于即将实现这一愿景。而关于根斯巴克对空中出租车的梦想，更引人关注的不是他在时间方面的野心，而是他追求梦想的勇气。


