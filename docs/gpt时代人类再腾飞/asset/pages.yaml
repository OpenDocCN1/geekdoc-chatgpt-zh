  md: '# # 03 重塑公正，给每个人赋能才会让世界变得更好


    将AI的力量交给普通公民，

    进而通过基层、分散、民主的

    途径为他们赋权。


    Putting AI''s power into the hands of individual

    citizens


    in the hope of empowering them in grassroots,

    decentralized, democratic ways.


    2022年秋天，当本书的主题以及整个AI领域都成为我关注的焦点时，我造访了坐落在美国亚拉巴马州蒙哥马利的平等司法倡议组织（Equal Justice Initiative，EJI）的遗产博物馆。我非常尊重和仰慕该组织的创始人兼执行总监布赖恩·史蒂文森（Bryan
    Stevenson）。他认为，人们应该通过自身对待贫困、被剥夺权利和无助者的态度来评价我们所处社会的道德品格和道德精神。对此，我深表赞同。'
  merge: -1
