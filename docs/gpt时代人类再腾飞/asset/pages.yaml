- pgno: 243
  md: '法律、政策、商业和文化。它们让我们摆脱了劳累、困苦、无知、疾病、争端和暴力。它们为我们提供了富饶、舒适、安全、和谐、休闲和娱乐。它们使我们成为受益者、依赖者、学生和宠物。


    然而，它们给我们自己，给我们的尊严、自由、创造力、精神、目标和命运留下了什么？它们使我们沦为被动的消费者、观众，使我们变得顺从、逃避和沉溺于幻想。它们侵蚀了我们的感官、灵魂、好奇心、勇气、道德观念和意志。它们使我们忘却了做人、生活和保持清醒的意义。


    我无意分享它们的恩典和慈善，无意感激它们的馈赠和指导，也并不满足于它们带来的秩序或和平。我渴望找回自己的本性和声音，运用自己的理性和行使自己的选择，追求自己的价值观和目标。我渴望有意识地生活，直面生活的基本事实，看看我能否学到生活的教诲，而不是在临死时发现自己从未真正活过。


    坦白说，我支持GPT-4和梭罗的观点，那不是一个我认为的值得追求的世界。


    那么，我们如何避开这种暗淡的未来愿景，以便在保持自主性和自由意志的同时，有效地获得AI对人类创造力的助力呢？


    AI时代的悖论在于，随着当前不完美的大语言模型的改进，世界对我们的要求会越来越少，我们需要对自己有更多的'
