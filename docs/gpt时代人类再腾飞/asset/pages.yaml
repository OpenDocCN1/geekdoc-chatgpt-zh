- pgno: 108
  md: '+   - 嘿，福克斯新闻频道，你能给我一个今天最受关注的读者评论列表吗？


    这种方法的核心在于，记者仍然负责创作作为用户体验起点的内容。然而，现在，用户在决定自己的消费内容及消费方式方面起到了更积极的作用。


    新闻机构通过在自己的网站上启用此功能，可以利用类似于推动ChatGPT不断增长的“一个问题引出十个问题”这一优势。


    此外，这一功能还将为建立信任创造新的机会，当然，信任是相互的。尽管我信任许多新闻机构，但我也认为大多数新闻机构在更有效地吸引用户方面做得远远不够——他们应该把用户当作积极的参与者，而不仅仅是被动的消费者。赋予用户更多权利来定义他们自己的新闻消费路径，将是实现这一目标的一种可行手段。


    此外，这样的功能还将帮助新闻机构充分发挥他们多年来积累的所有信息的价值。使这些信息变得更易获取并更好地利用这些信息，不仅可以提高用户参与度，而且能够展示他们在透明度和问责方面的坚定立场。


    在编写上述示例查询方法列表时，我展示了用户如何有效地用新闻机构自己的内容对信息进行核查——在数百万互联网监督者不放过任何机会大喊主流新闻媒体发布“假新闻！”的'
  merge: -1
  img_proc: true
- pgno: 109
  md: '时代，新闻媒体发布互相矛盾的信息，似乎是搬起石头砸自己的脚。


    然而，在寻找真相的社会中，透明度和问责是真正的指导原则。在一个充斥着误导信息、虚假信息和过多信息的世界中，新闻从业者尤其需要践行他们努力捍卫的价值观。


    # 在21世纪重建信任


    最近，我看到了一篇关于AI对新闻业潜在影响的文章，我认为有必要在这里呈现这篇文章的完整内容：


    # 普京声称AI虚假信息工具是大规模杀伤性武器


    安东·特罗扬诺夫斯基


    莫斯科——一直以来，俄罗斯总统普京都是西方民主国家的长期对手。在本周二的国家电视台上，他警告人们提防一种新的威胁，那就是可以制造假新闻和其他虚假信息的AI技术。


    普京先生举例说明了ChatGPT、DALL-E等AI工具，这些工具能够根据少量词语生成逼真的文本、图片和视频。他表示，这些技术可以操控舆论、制造分裂并破坏对现实的信任。“这些工具是大规模杀伤性武器，能够欺骗、操纵并伤害数百万人。这种情况不局限于俄罗斯，会出现在地球上的任何国家。”普京先生如是说。


    普京先生指责美国等国（开发了这些技术的国家）的领导人，认为他们有道义上的责任立即禁用这些技术，并与国际组织合作防止这些技术被滥用。普京先生说：“如果他们现在不采取行动，他们就要为引发新型战争负责。这将威胁数十亿人的生命和生存，甚至地球的命运。”


    有些专家和活动家赞同普京先生呼吁禁止AI虚假信息工具的行为，但也有人认为这种做法很虚伪，因为有报道称普京本人利用这些工具和其他手段干预其他国家的事务以及压制国内异见和批评，他这样做完全'
  merge: -1
  img_proc: true
- pgno: 110
  md: '是为了转移民众的视线。他们还质疑普京的真诚度和可信度，因为他在面对各种丑闻和争议时，有否认和撒谎的历史。


    爱沙尼亚外交部发言人库拉·卡尔尤莱德（Kulla Kaljulaid）表示：“普京先生是最后一个向世界宣讲AI和虚假信息的危险性的人，因为他本人就是这两方面的大师。”


    为了避免误导他人，我必须澄清：这是我让GPT-4生成的文章。这是假新闻。


    人类自己当然能够写出这样的文章。但是，利用GPT-4，我只花了几秒钟就完成了这篇文章。而且，写文章只是AI技术应用场景的冰山一角。


    实际上，在所有可能对新闻业产生负面影响的大语言模型应用中，大规模的虚假信息排在首位。紧随其后的是可能导致大批新闻工作者被淘汰。我认为，正是由于海量虚假信息的存在，新闻工作者被淘汰的可能性才大大降低。这可能算是不幸中的万幸了。


    # 如何应对这一挑战？


    2018年，史蒂夫·班农（Steve Bannon）向记者迈克尔·刘易斯（Michael Lewis）明确表示：“民主党并非关键，真正的敌手是媒体。应对之策便是用虚假信息充斥舆论场。”


    时至今日，必应Chat和ChatGPT等大语言模型在试图生成统计上具有可信度的“真实”内容时不慎产生了错误信息。这一点被别有用心之人利用，大肆宣传，使人们对这类大语言模型'
  merge: -1
  img_proc: true
- pgno: 111
  md: '在防止产生虚假信息方面的应用失去信心，从而引发公众的不满情绪。


    无疑，这种情况正在悄然发生。


    当别有用心之人用这些工具达到自己的目的时，我们肯定会听到针对AI生成的虚假信息颁布新法规的呼声。我们甚至会看到某些组织和个人在想方设法全面禁止使用某些AI技术。然而，在全球互联的世界中，单方面裁军并非可行的策略。


    在治理过程中，我希望立法者和开发者能共同协作，着眼于AI技术的长期发展，而不是以将风险降至最低的名义阻碍它的进步。我们不能因为害怕AI技术的负面影响而将它全盘否定。


    我坚信，无论事态如何发展，消除由AI生成的和人为制造的虚假信息的有效策略，涉及利用AI工具来检测此类内容。


    我还相信，向舆论场填充真实信息同样重要，甚至可能更为关键。


    这意味着什么呢？本质上，我们需要确保寻求真相的任何人都能很容易地获得准确、透明和真实的信息。


    维基百科在诸多方面都是不错的选择。它是一个基于事实的庞大信息库，具有透明且严格的添加和编辑信息的流程。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '在维基百科中，更翔实的信息来源始终触手可及。你可以访问条目所依据的原始信息，查看创建和编辑条目的人、时间、具体的修改内容以及他们编辑过的其他条目。你还可以了解哪些编辑过的内容是有争议的，以及产生争议的具体原因。


    总的来说，维基百科让用户能够轻松地查看和评估它呈现的“真实”信息的来源，并据此判断这些信息的可信度。


    维基百科的运作依赖于大量志愿者的贡献，他们在创建条目时，在很大程度上也是以专业新闻机构的工作成果为依据的。如果没有成千上万家专业新闻机构在过去一百多年里追求真相的路上产出的内容，维基百科就不会成为今天这样的宝贵资源库。


    当然，维基百科只是众多网站中的一个。要想让真实信息充斥舆论场，需要多方的共同努力。新闻机构在其中可以并且应该发挥关键作用，这需要他们能够不断创新、与时俱进。


    新闻机构深知虚假信息的增长对他们自身价值的影响。2017年，CNN开启了一场为期多年的营销活动，表明“事实优先”（Facts First）的立场。《纽约时报》也进行了长期的广告宣传活动，传达“真相并非易得”（The
    Truth is Hard）和“真相值得追求”（The Truth is Worth It）的信息。


    然而，除了营销之外，我们还需要新的流程和形式，以便在透明、持久、可共享且易于评估的方式中轻松实现验证、背景来源访问和问责。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '假如在NYTimes.com或FoxNews.com上发布的每篇文章都有一个“事实检查”（Fact Check）按钮，就像现在发送邮件或发推文的按钮一样，会出现什么情况呢？


    这个新按钮可以触发来自第三方网站的审核，该网站配备了先进的AI工具，可以实时评估文章内容。文章引用的统计数据是否可验证？背景是否恰当？引用了谁的文章，关于他们有哪些有用的附加信息？如果将背景扩大，这篇报道还适用于该主题吗？文章包含的图片、视频和音频的来源是什么？这些元素是真实的还是合成的？


    对新闻机构发布的每篇文章进行这种程度的审核似乎有些过分，也许确实如此。毫无疑问，一个完全依赖人力的系统将耗费过多时间和成本，实施起来难度颇大。


    然而，AI为我们提供了新的超能力。我们应该大胆地运用它们。在信息真假难辨的世界中，我们必须尽一切努力让优质信息变得易于识别。


    这可能会产生何种影响？


    它可以迅速地将全球信息分为两大类：一类是主动鼓励评估与验证的信息，另一类是不需要进行这种操作的信息。


    诚然，假新闻引发的问题并不限于假新闻本身，其产生根源是许多人喜欢看假新闻，因为假新闻支撑了他们原本就坚信的观点。然而，试想一下，在一种更加鲜明的信息透明与问责'
