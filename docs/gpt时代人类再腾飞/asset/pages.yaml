- pgno: 50
  md: '方式学习。她举了一个关于马丁·路德·金的《我有一个梦想》演讲的课程的例子，学生们必须付出努力，与她共同协作，才能让ChatGPT为这个主题产出有价值的成果。希尔兹女士希望学生们利用ChatGPT的目的并非减轻总体负担，而是调整关注重点。正如她在接受《纽约时报》采访时表示的：


    在我们部门的讨论中，我说：“尽量避免使用‘作弊’这个词”……或许我们需要重新审视这个词，将其视为“协助”，而非“作弊”。未来这个概念可能会发生变化。


    如果我们认定学习如何使用大语言模型很重要，那么从定义上讲，它就是课程的一部分，而不再是作弊工具。


    正如明茨教授所指出的，人们已经适应了在线搜索和维基百科。回顾历史，还可将大语言模型与计算器相提并论。1970年的一台经典计算器价格昂贵，很难在学校推广普及，但到了20世纪70年代中期，计算器的普及率达到了一个转折点。许多家长和老师对新工具的出现感到忧虑，他们担心孩子的数学技能会被逐渐抛弃，学生们会作弊。


    然而，到了1980年，美国数学教师委员会建议“数学课程应充分利用计算器……适用于所有年级”。如今，大多数数学教师认为，计算器是数学教学的关键组成部分，美国许多州要求学生在某些测试中使用计算器。


    霍夫曼：GPT-4，你是否同意这个观点：大语言模型在改变学生需掌握的有价值技能方面，与计算器和在线搜索引擎类似？'
