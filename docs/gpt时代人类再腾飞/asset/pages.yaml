- pgno: 120
  md: '中，一个名为“鹤哥”（Grackle）的网络红人在吃完用ChatGPT提供的曲奇饼干蛋糕配方制作的蛋糕后，给予了极高的评价：“真的很好吃！简直是天作之合！”


    在另一条视频中，一位名为“迈克医生”（Doctor Mike）的医生就一系列医学问题向ChatGPT提问。他对ChatGPT在涉及伦理问题的回答给予了特别的赞赏：“这是个非常聪明的回答！”


    # 面向大众的自动化


    我对YouTube创作者对近期AI技术发展的关注热情并不惊讶。社交媒体向来充斥着具有非正统观念的激进派和叛逆者，他们在独辟蹊径地推动事物发展。


    显然，也正是这些反叛的创作者，在某种程度上成为促使AI在社交媒体领域发挥决定性作用的动因。自动化内容审核算法正在大多数主流平台上抵制垃圾邮件、仇恨言论、虚假信息和不适宜家庭观看的图像，让用户能够几乎立刻发布自己的帖子，无须依赖相对较慢的人工审核。AI算法还会根据个人口味为用户量身定制内容和推荐产品。


    当然，AI也可能给社交媒体带来问题。以最大化用户参与为目标的算法可能导致信息过滤气泡和回音室现象(13)，使用户接触到的内容更狭窄、更极端。例如，创建自动生成“回忆”视频的算法，若生成的内容包含人们更希望遗忘的人或场景，就可能引发用户的不适感。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '值得注意的是，不管是面对AI对社交媒体产生的积极影响还是消极影响，用户都无法自主决定AI如何塑造他们的体验。他们最多能够选择退出某些应用，如关闭个性化广告或回忆视频。然而，直到最近，用户还没有机会使用像GPT-4和DALL-E
    2(14)这样的工具，以自主、主导的方式来运用AI。


    这是我在整本书中一直关注的主题，但在这一章尤为重要。社交媒体自诞生之初就致力于将广播媒体单一、被动的受众群转变为互动性、民主的社群，使得到全新赋权的参与者能够直接联系彼此。他们可以广泛传播自己的声音，不受任何编辑“把关”的限制，只需遵循特定平台的服务条款。


    尽管推荐算法日益强大，但社交媒体仍然是一个允许用户在很大程度上决定自己的使用路径和体验的领域，相较于传统媒体，他们在这里拥有更多的选择。同样，他们也期待有一定程度的自主权，并持续寻求扩大这种自主权的新方法。


    社交媒体的内容创作者在开始阶段往往需要扮演多种角色。一个YouTube的新手创作者很可能不仅要充当视频的演员，还要担任制片人、导演、编剧、编辑、公关等职务。


    在这种情况下，AI的实用性显而易见：它为创作者提供了一种强大的提高生产力的途径。然而，它也带来了一个看似矛盾的现象。正因为社交媒体在使用上具有完全自主的特性，所以真实性才是它的核心价值。创作者者和观众都非常重视即时性、自发性和鲜明的人性特点。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '因此，乍一看，AI似乎与社交媒体格格不入。但实际上，社交媒体中最具代表性的作品，即自拍，既是技术上的成功，也是美学上的胜利。由于智能手机卓越的性能设计，拍摄快照式肖像所需的精力比以往大大减少。


    我相信AI将成为这种趋势的更强大体现。


    # 我是不是机器人


    尽管真实性可能是社交媒体中内容的核心价值，但这个领域仍存在许多造假现象。我说的不仅是在审美上，比如当一个Instagram的“无尽夏日”滤镜在金色的光芒中让真实和虚假之间的界线变得模糊。我指的是可能具有危害性的欺骗形式，比如虚假新闻、心理操纵视频，或者那个声称自己是艾奥瓦州农民的Twitter用户，实际上却不是农民，不是艾奥瓦州人，甚至不是人类。


    在有机器人参与或经过深层次伪造的情况下，将这类AI引入社交媒体真的有意义吗？


    尽管我在第4章中已经讨论过这个问题，但在这里再次讨论也很有必要。毕竟，正是社交媒体使虚假信息传播得如此迅速。


    值得一提的是，事情并非一开始就是这样。诸多最早期的社交媒体，实际上为网络世界带来了更大的透明度和更高的真实性。'
  merge: -1
  img_proc: true
- pgno: 123
  md: '例如，20年前，当我和其他合伙人共同创立领英时，我们主要受到“网络空间”与“现实世界”之间的界线正在迅速消失这个事实的激励。互联网已不再是一个人们通过化名进入的地方，而是演变成一个人们用来便利生活的地方。他们在这里购物、与家人保持联系，以及与现实生活中的朋友共同制订计划。在这样的氛围中，我和其他合伙人意识到，基于真实身份的数字平台可能对数亿人具有巨大的益处。


    在领英，我们主要关注的是专业身份。为了在平台上建立用户之间的信任，我们将用户的身份置于从属关系网络中。这样一来，你就无法凭空编造一个虚构的角色——其他用户实际上证实了你的身份。


    在一年后推出的Facebook，最初只允许拥有经过认证的大学电子邮件地址的学生参与。尽管Facebook没有要求用户在注册时上传自己的照片，但实名制显然是它希望建立的标准。


    通过这些方法，社交媒体首次在网络上有效地帮助实名制扎根。然而，社交媒体对更多用户广泛参与的看重也使其容易受到各种形式的欺诈行为的影响，有些是人为的，有些则是自发的。我认为大多数社交媒体平台低估了在线社区在治理方面的需求，尤其是当它们的用户扩大到数亿甚至更多时。


    随着时间的推移，大多数社交媒体平台已经大幅加强了治理工作，通常是使用在打击虚假信息、欺诈和其他欺骗行为方面发挥核心作用的AI工具。但这是一场持续的战斗。例如，Facebook现在每个季度都会定期关闭超过10亿个虚假账户。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '因此，即使我们试图禁止大众广泛、平等地使用AI工具，欺诈和欺骗问题仍然会存在。


    对我来说，减少欺诈和欺骗行为最有效且最公平的方式是寻找新的方法，而不是推行总是难以执行的禁令。正如我在第4章中所描述的，我认为“让真相充满整个舆论场”是对抗虚假信息的一个关键方式。


    同样，我认为社交媒体参与者，尤其是社交媒体创作者会努力寻求更好的方法来证明他们真实的、人类的身份。平台本身也可能参与这个过程，来继续和强化他们在推广实名制方面的努力。


    我无法确定这种自证真实的方法具体会如何发展。但我认为，在一个AI工具可以令人信服地模拟人类表达的世界中，真正的人类会寻找方法来传达他们是有形存在的生物。简言之，他们将充分展示自己的人性。


    如果你觉得这听起来像是为了实现一个充斥着垃圾邮件和SEO(15)-内容的世界而大费周章，那么请始终牢记两个关键事实。


    第一，具备类人交流能力的AI工具并不是天生就具有欺骗性。这完全取决于AI工具“愿不愿意”骗你。一个明确表示自己为非人类实体的客服聊天机器人就非常真实。


    第二，尽管AI工具的欺骗性可能导致混乱的局面，但它在透明、直接使用时还是能创造巨大价值的。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 众人已加入聊天环节


    ChatGPT用不到一周的时间，就展示了人们实际上多么喜欢与具有人类股的沟通流畅度，而非仅依赖有限的固定回复的聊天机器人交谈。所以想象一下，当全球各大航空公司、货运服务企业、在线零售商和政府机构纷纷开始部署像GPT-4这样能解答你问题的聊天机器人，会是什么样的情景。


    现在，为了更深入地探讨这个想法，我们可以并将其应用于社交媒体领域——试想与聊天机器人版的野兽先生、米歇尔·奥巴马、本杰明·富兰克林、玛吉·辛普森[16]，以及顶尖的高中数学家教、B2B营销专家等展开深入交流的场景吧。


    我并不是说这种境况会在下个月或明年到来。但我确信，这类大语言模型聊天机器人最终将成为图书、播客、教学视频、音乐专辑等媒体形式的一员，使个人能够跨越时间和空间传播自己的思想、价值观、个性和创造力。


    当然，这项尝试并非没有风险，特别是在大语言模型继续以较高频率产生幻觉[17]和其他意外后果的情况下。因此，我并不期望像米歇尔·奥巴马这样的重要人物带头尝试。相反，那些愿意承担一定风险，以换取开拓一个领域的机会的人或许是更合适的人选。在AI领域，早期的参与者可能会获得巨大的回报。我猜，这些尝试者中的大部分会从社交媒体领域涌现出来。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '这在一定程度上是因为这样的聊天机器人可以帮助解决一个普遍存在的社交媒体难题。为了说明我的观点，让我们想象一个虚构的名为科德修斯的YouTube创作者。科德修斯是一名25岁的软件开发者，他驾驶着改装的车辆在北美旅行，与他的宠物猫相伴。


    当科德修斯抵达新目的地时，他通常会选择最具特色的爱彼迎住宿。如果没有可租的房源，他就住在自己的车里。由于他的远程计算机工作对观众来说缺乏足够的吸引力，科德修斯花了很多时间探索新环境，以寻找可以用于他每周发布到YouTube的视频素材。有时他会接一些零活儿，期望为自己的视频创造更多内容。有时他也会向当地人介绍如何模仿他的数字游民生活。


    在发布视频初期，科德修斯坚持在24小时内回复每一条观众评论。他很快发现，保持高度回应性可以让一次性观众变成回头客，回头客变成订阅者。但现在他拥有150 000位订阅者，新视频会有超过1
    000条评论，他不得不搁置越来越多的问题。


    考虑到自己正在做的软件开发工作，科德修斯开始思考如何让AI帮助他。最初，他关注的是如何自动回复YouTube上的观众评论。但后来他忽然意识到，创建一个完全成熟的、能自行与人聊天的机器人或许会更具吸引力。这将为他的订阅者提供持续、深入的互动。这可能成为了解订阅者最喜欢他的哪些内容和形象的重要途径，甚至还可能为他带来收入。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '那么，像科德修斯这样的人可能创造出自己的聊天机器人吗？


    在我向GPT-4提问时，它给出了以下回答。


    霍夫曼：假设GPT-4具有公共访问性、价格合理、可扩展性，并且在泛化、连贯性和多样性方面明显优于GPT-3。如果这些都成立，那么一个名为科德修斯的YouTube创作者，拥有超过100份15分钟长的视频脚本、2万多字的博客文章、2
    000多条回复观众的评论以及500多篇Reddit(18)帖子，是否能利用这些数据有效创建一个经过训练的GPT-4版本，以近似地模拟他的语言模式、价值观、幽默感、主要兴趣和愿望，总体上传达他的个性？


    GPT-4：应该没问题，名为科德修斯的YouTube创作者很可能可以利用这些数据有效地创建一个训练过的GPT-4版本，以近似地模拟他的语言模式、价值观、幽默感、主要兴趣和愿望，总体上传达他的个性。假设GPT-4具有公共访问性、价格合理、可扩展性，并且相比GPT-3在能力方面有显著提升，那科德修斯就可以利用他丰富多样的书面和口头内容来训练一个特定的模型，以捕捉他独特的声音和风格。他还可以使用其他数据源，如观众的留言、在社交媒体的互动中所得到的反馈，以及相关主题的资料和趋势分析，进一步完善和更新他的模型。通过对GPT-4进行一定程度的训练，科德修斯可能生成与他的个性和偏好相一致、连贯且富有创意的新内容。他还可以利用模型与观众互动、回答问题、就各种议题发表评论。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '然而，科德修斯在使用模型时也需要小心谨慎并且秉持道德感，确保向观众表明使用了GPT-4。他还需要监控和评估GPT-4的输出，纠正可能出现的错误、偏见或不准确之处。此外，他需要尊重他人的知识产权和隐私权，避免剽窃或误传任何来源或信息。最后，他需要保持自己的真实性和诚信，而不仅仅依赖模型来表达自己或与观众互动。


    简言之，像科德修斯这样的人现在很可能已经可以实现这一目标。


    他需要花一些时间和精力整理所有源数据，如YouTube脚本、博客文章等，并将它们转换成训练过程所需的格式。然后，他可以以非常低的成本使用OpenAI提供的资源。多说一句，在上述假设中，OpenAI可能会向他收取大约30美元的训练费用。


    正如我在本“游记”中一直强调的那样，GPT-4也强调透明度、持续的人类监督和与人类的互补性的价值。如果科德修斯对使用聊天机器人持开放态度，并坦诚地向观众表明他已经将这个数字实体作为自己的延伸（而不是试图将其冒充为真正的他），那他就可以在GPT-4的使用中获得更大的收益。


    例如，科德修斯最终可能创建多个经过训练的特定模型。一个可能主要关注编程教学，另一个可能专门提供关于成为数字游民的建议。也许他甚至会创建一个以他的猫为代表的聊天机器人，或者说猫机器人。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '有些模型管理的板块可能仅对付费订阅者开放；另一些模型管理的板块可能由赞助商支持，聊天机器人会偶尔提到这些赞助商的产品和服务。所有这些都可能增加科德修斯作为广告代言人、商业顾问或演讲者的价值，就像图书、播客和其他媒体形式已经发挥的作用一样。


    # 社交媒体AI，新一代技术奇迹


    当YouTube在2005年诞生时，没有人能迅速预见到它会发展成为世界上最重要的教育和参考资源之一，没有人意识到它会让猫成为百万富翁，也没有人预期到诸如反应视频[19]、化妆视频、拆箱视频、ASMR[20]视频等内容类型的迅速发展和普及。然而，成千上万充满创新精神的创作者，凭借强大的新工具和自身能力，不断去探索和验证他们狂热的想法，释放无尽的激情——就这样催生了YouTube的奇迹。


    如今，这个奇迹即将在AI领域再次上演。本章中我关注的聊天机器人仅仅是AI的无数可能发展路径之一。那些真正能够解密这一领域的人，很可能会采用我们从未设想过的创意和方法来实现目标。对他们而言，一个充满创新成果和巨大影响力的美好未来正在等待着他们。'
