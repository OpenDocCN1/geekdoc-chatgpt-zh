    # 受益，管理模式的改变


    在卡斯诺查和我出版《为什么精英都有超级人脉》（修订版）后不久，我们意识到，在为个人专业人士建立新的职业生涯框架的同时，也有必要创建另一个用来指导雇主和管理者如何与创业者合作的全新框架。


    因此，我们邀请我们的老朋友克里斯·叶（Chris Yeh）与我们共同在《联盟》一书中探讨了这些相关影响。


    《联盟》这本书指出，一些组织和管理者在思考雇佣关系时，往往都在采用过时的隐喻。许多CEO倾向于将员工视为家庭成员，然而家庭意味着一种永久且几乎无法解除的联系，这在现代工作场所中并不实际。另一些组织和管理者则走向了另一个极端，即把员工完全看作自由职业者，这让员工在对企业建立信任感、忠诚感和创造长期价值方面变得极具挑战。


    我们认为，更为合适的类比是把员工看作盟友——为了追求共同的重要使命而团结在一起的独立个体，并对什么是成功、如何让企业变得更强大、如何更好地发展员工的职业生涯达成明确的共识。


    接下来，我们一起来看看GPT-4对将AI引入管理领域有何看法。'
