    霍夫曼：为野兽先生创作20个奇特又有创新性的视频标题，以世界上最大的3D打印机打印出不寻常的物品为主题。


    GPT-4：我用3D打印机制作了一个巨大的冰激凌蛋筒，然后用叉车吃掉了它。


    霍夫曼：为野兽先生创作20个疯狂的视频标题，以商业太空旅行为主题。


    GPT-4：我聘请了埃隆·马斯克作为我的私人太空导游。


    我并非野兽先生的目标观众，所以我不是评估GPT-4这次表现的最佳人选。但你是否想看看1万个气球能否让兰博基尼飘起来呢？至少，GPT-4的表现足够引人注目。这也让我很好奇，如果野兽先生和他的团队也尝试用GPT-4生成提示，他们会问出什么问题来。


    如果野兽先生和他的团队真的这么做了，那他们将会有很多竞争对手。现在，YouTube上有数千条关于ChatGPT的视频。我最喜欢的是那些直接与ChatGPT互动的视频。在其中一条视频'
