  md: '（哇，GPT-4真的很擅长写十四行诗！）


    在我看来，大语言模型具备这种富有想象力/概念性的能力是一大优势。实际上，迄今为止，我与GPT-4的互动很大程度上就基于这一特点。它如此吸引人的部分原因在于，它既可以生成一部全新的《星际迷航：下一代》（Star
    Trek: The Next Generation）的剧本，也可以起草一份法律文件（相关内容，请参见第9章）。


