- pgno: 49
  md: '# 是课程的一部分，而非作弊工具


    在与GPT-4合作研究教师参与度的过程中，我关注到了资深高中英语教师谢丽·希尔兹（Cherie Shields）。ChatGPT带给她的专业的变革影响尤为明显。


    希尔兹女士的成长历程可谓是对公共教育的赞颂。她在公立学校接受教育，发掘了对英语的热爱，决心投身于英语教学事业。她是家里第一个完成高中和大学学业的成员，后来还获得了英语硕士学位。时至今日，她依然在一所公立高中教授英语。


    2023年1月，希尔兹女士在职业生涯中首次为《教育周刊》（Education Week）撰写专栏文章。在纽约市学校决定禁止使用ChatGPT的同一时期，她的文章得以发表。她认为，教师完全有能力运用这一新工具。


    教师不应拒绝和被禁止使用这项新技术，而应充分借助和发挥其在提升学生写作能力方面的惊人潜力。AI在论文写作过程中能为学生提供巨大帮助，包括激发思路、对写作风格给予反馈，乃至提供模板或大纲。


    大约在该观点发表一周后，《纽约时报》在课间通过电话采访了希尔兹女士。他们询问她开始使用ChatGPT时对难易程度的感受，她回答说：“我在上周五得知这个工具，周一就开始应用了。”


    《纽约时报》直接向希尔兹女士请教关于作弊的担忧。她回应称，ChatGPT并非替学生完成作业，而是要求他们以不同的'
