- pgno: 103
  md: '现在这种趋势再次出现。总体来说，AI工具将使新闻记者的工作更富有成效。


    关于GPT-4产生错误信息的问题（详见第8章），新闻从业者显然应予以特别关注，并相应地审查其输出结果。强大的工具总是需要人们具备更高水平的关注和专业知识，无论是汽车、链锯还是复杂算法，情况都是如此。这是我们在利用这些工具提高生产力时需要付出的代价。


