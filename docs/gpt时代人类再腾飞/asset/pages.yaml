  md: '霍夫曼：管理咨询行业采用AI工具可能会给现有管理顾问的职业前景带来哪些负面影响？请通过举例来说明这些变化对初级分析师和助理、中级职务的项目经理以及像麦肯锡合伙人这样的高层管理者的影响。


