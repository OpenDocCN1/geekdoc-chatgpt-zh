  md: '# 推荐序一 参与和探索AI新时代


    陆 奇

    奇绩创坛创始人


    我很高兴能为里德·霍夫曼和GPT-4合作的书写序。我写这篇序言不仅是因为这本书的重要性，也是为了向中国读者提供关于霍夫曼以及他与人工智能的重要背景信息，希望能帮助读者更好地理解这本书，甚至更好地参与这场重大的技术变革。


    首先，我想向中国读者介绍我眼中的里德。他是一位杰出的创新者和企业家，致力于推动全球范围内的技术驱动创新，并投入了自己毕生的时间、精力和财务资源。他每年都会花费大量时间和资源来实际推进技术的发展，并传播他对技术驱动人类社会进步的理念。里德坚信技术是善良的，只有当技术与人性的美好高度统一时，技术变革才能发挥其积极的价值，产生积极的社会影响。他坚信我们能够实现这一目标。


    里德本人也是一位出色的创业者，拥有丰富的实践经验。他与埃隆·马斯克（Elon Musk）、彼得·蒂尔（Peter Thiel）等人是PayPal的核心创始成员。2003年，他创办了领英，并将领英打造成了全球具有影响力的职业社交网络。他还担任硅谷知名风投公司格雷洛克（Greylock）的掌门人，参与'
  merge: -1
  img_proc: true
- pgno: 6
  md: '了许多前沿科技项目的投资。他深信创业和创新是推动社会进步的核心力量。为了帮助创业者和创新生态系统，里德撰写了多本书，其中包括大家熟知的《闪电式扩张》（Blitzscaling）、《为什么精英都有超级人脉》（The
    Start-up of You）和《联盟》（The Alliance）。此外，他还专门制作了系列播客《规模大师》（Masters of Scale）。他竭尽全力利用自己的资源和影响力来传播创业知识，帮助更多创业者更好地创新和创业。


    里德非常重视人工智能，并且对技术有着深刻的见解。两个月前，我与里德进行了视频会议，讨论了GPT-4的泛化能力。我提到了关于子概念和相应潜空间泛化研究的一些科研探索，本以为需要解释一番，但没想到里德在这方面早已有许多观察和思考。他本科就读于斯坦福大学著名的“符号系统学”（Symbolic
    Systems）专业，从那时起就对人工智能产生了浓厚的兴趣，尤其是对符号和概念等方面的探索。同时，里德对于人工智能应用开发也有广泛的了解，他通过格雷洛克公司投资了许多优秀的人工智能项目。里德对于通用人工智能（AGI）也有深入的见解，并且在这方面的实践探索也很早。例如，早在OpenAI未被广泛关注之前，他就有远见地发现了它的价值，并成为OpenAI的首批投资人，成为OpenAI的董事会员，对OpenAI的创新发展起到了重要的推动作用。


    他一直站在人工智能产品和技术创新的前沿。最近，他与DeepMind联合创始人穆斯塔法·苏莱曼（Mustafa Suleyman）共同创建了创业公司Inflection
    AI，旨在构建基于大型模型的'
  merge: -1
  img_proc: true
- pgno: 7
  md: '下一代聊天机器人。目前，里德将人工智能的发展视为自己的主要使命，专注于帮助社会大众更好地理解人工智能、接纳人工智能，并与人工智能协同探索，使人工智能更好地造福人类。对于中国的读者，我建议大家能充分了解这些背景信息。


    我和里德的相识可以追溯到2005年的硅谷，如今已经有将近18年的时间了。我们在交流学习和商业合作的机会中，逐渐成为好朋友。在领英的发展过程中，我很高兴能在几个重要环节为里德和领英提供帮助，其中包括协助里德将公司的管理交由可靠的CEO杰夫·韦纳（Jeff
    Weiner）负责。我也为领英进入中国市场和微软并购领英等重要事件提供帮助。与此同时，里德对我在奇绩创坛的工作和推动中国创新、创业的努力也给予了巨大支持。在疫情之前，里德每年都会花费很多时间来中国，了解中国并将真实情况带回美国，让美国投资者们更多地了解中国。我希望读者能够感受到里德对全球性技术驱动创新的热情。


    在大型模型以极强的力量和速度推动着产业和社会变革的今天，我相信每位读者，特别是那些身处技术创新前沿或深度关注技术发展的读者，都会有两种情绪：对技术变革所带来的巨大机遇感到兴奋和期待，同时也为人工智能可能对社会发展带来的前所未有的不确定性感到不安甚至焦虑。如何拥抱和参与这一变革，这将成为人类与人工智能共同进化的探索过程。里德撰写本书的主要初衷是将其作为一种“游记”，通过深入浅出的实际案例来帮助读者体验未来。我建议读者将这本书视'
  merge: -1
  img_proc: true
- pgno: 8
  md: '为帮助我们探索大型模型时代的机遇和风险的宝贵经验，以更深刻地理解其中的内涵。


    在这本书中，里德和GPT-4共同探索了人工智能对人类社会最关键的基础设施和纽带的影响，构成了书籍的核心架构。他通过与GPT-4的交互对话，直击主题，帮助读者深入理解其中的深层内涵，并通过具体的实例使读者能够更加身临其境地体验。


    书中的核心章节以当今美国社会为主要背景，里德精心选择了涵盖“教育”、“创造力”、“生产力”、“新闻和社交媒体”以及“社会公正”等主题。这些主题不仅代表了人类社会的共同基础，也在很大程度上反映了当前美国社会的敏感焦点。


    为了让读者快速概览文章的核心洞见，我在这里简单概述一下里德对教育和劳动方式的探讨，因为这两个章节尤其引发了我的共鸣。


    在教育方面，里德深信随着人工智能工具的不断增强，我们应该越来越重视人类作为人的核心能力，即提出最佳问题、获得深入洞察并将洞察转化为实际行动。强大的人工智能为人类解放了更多时间，恰恰可以让人类独特的创造力在重复性劳动之外得以彰显和放大。


    在与GPT-4讨论劳动方式重塑的话题时，里德敏锐地探讨了律师、销售等工种的未来变革方向，以及人工智能对管理方式'
  merge: -1
  img_proc: true
- pgno: 9
  md: '的深远影响。这样的思考与我在奇绩创坛和中国创业、创新生态中观察到的情况非常契合。我非常认同人工智能作为人类在职业领域（甚至更多领域）中的合作伙伴所具备的巨大潜力。事实上，本书中提到的许多设想在写作时还只是预言，但目前已经有许多科技驱动的创业、创新者们在不同程度上实践和探索着。


    奇绩创坛作为加速和投资前沿技术项目的机构，我们从申请表和创业营中看到了无数生动活泼的探索案例。例如，在教育领域的变革中，年轻的创业者正在尝试利用人工智能生成更便宜、更高效、更全面的大学教材；在公司管理层面，创业者们甚至设想未来的企业组织模式将是由各种人工智能工具赋能的独立超级中心相互连接；在美国，已经有实际投入使用的律师人工智能产品；销售的传统模式也即将被人工智能颠覆……甚至在制造业、生命科学和能源等看似与信息产业较远的行业中，人工智能的赋能和变革也是巨大的。


    正如里德在书中所提到的，新技术始终在创造未来的工作岗位，人们目前所感到的不安是因为过去的生产模式正在逐渐崩溃。在面对不确定性时，我们应该坚信技术是善良的，并让人工智能成为提升人类幸福的工具。这也是我最为感动的里德的人文关怀之处。


    就像这本书是人工智能新时代的产物一样，这篇序言也是中国这个时代的产物。它不仅包含了我的部分个人经历，还展示了奇绩创坛团队和奇绩创业者社区积极参与新时代的历程。它本身就是人工智能与人类共同协作进化的见证。现在，我想'
