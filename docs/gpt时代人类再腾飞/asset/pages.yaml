- pgno: 39
  md: '然而，许多技术专家和高科技组织，包括OpenAI，实际上的确致力于实现更高级的AI形式：能够完全自主运作的机器，具备与人类类似的常识推理能力和自我意识的机器。


    GPT-4目前还达不到这种程度。就现有表现而言，它既非无所不知，也非绝对可靠。


    相反，用它自己的话来说，它是一个需要人类“谨慎、好奇和负责任”地使用来发挥最大效用的“工具”。


    我认为这个观点非常正确。如果让GPT-4独立完成所有工作，没有人类的监督或参与，那么它还称不上一个强大的工具。当然，它仍然是一个非常人性化的工具，因为人类文本是其生成能力的基础。


    然而，当人类用户将GPT-4视为副驾驶员或合作伙伴时，它会变得很强大。你可以将GPT-4的计算生成性、效率、合成能力和扩展能力与人类的创造力、人类的判断和人类的指导相结合。


    这并不能消除误用的可能性。但是，将人类置于GPT-4所创造的新世界的中心，我们可以得到一个我认为最有可能产生整体上效果最佳的可靠方案。在这种方案中，GPT-4并没有取代人类劳动，也不会抹杀人类的能动性，而是可以增强人类的能力和促进人类的发展。


    当然，这种思维方式并不是顺理成章的。这是一个选择。'
