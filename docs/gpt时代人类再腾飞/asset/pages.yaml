    同时，考虑到GPT-4可能提高新闻机构的整体生产力，我认为，警惕GPT-4的现有缺陷，是一项明智的投资。实际上，新闻业长期以来的核实和纠错文化非常适合应对这一挑战。


    # 权威性提问


    在本章开始之前，我向GPT-4提出了一个问题：“请总结过去10年中，AI辅助报道在帮助新闻机构报道重大新闻方面的一些突出实例。”


    GPT针对这个问题迅速给出了一些详尽且深入的信息，但同样也包含了一些错误。了解到GPT-4有时会给出错误信息，我意识到信息核查非常重要。谷歌和维基百科在核查过程中发挥了重要作用。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '尽管如此，最终让我快速掌握相关知识的关键还是GPT-4。虽然它提供的信息部分是错误的，但大部分仍然是正确的。更重要的是，GPT-4能够极速地产出这些信息。


    当我用谷歌搜索同类信息时，它给出了许多链接，有些看起来有用，有些则毫不相干。维基百科的体验虽在细节上有所不同，但结果大致相同。


    然而，借助GPT-4瞬间从多种来源综合信息的能力，我在几秒钟之内便获得了一份理想中的清单。


    尽管这份清单存在错误，但问题不大。因为关键在于，我并不指望GPT-4给出完整的结果。我需要的是一个包含丰富信息的起点、一个粗略勾勒出我想要探索领域的地图，以便迅速了解我应该提出哪些问题。


    找到了这个起点后，我花了很多时间向GPT-4咨询美国联合通讯社（简称美联社）、路透社、《华盛顿邮报》、彭博新闻、《卫报》、《纽约时报》等如何将AI融入新闻采集、制作、分发和业务功能的问题。说实话，我花在这上面的时间超出了计划时间。


    这是因为与GPT-4互动并非传统的网络搜索，更像是Web 1.0时代流行的一个词：网上冲浪。对话展开，流程状态接管。你向GPT-4提问，它立即用高度相关的信息做出回应，而不是只给出一系列链接。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '因此，你会马上想到更多问题并继续提问。这样一来，用传统搜索方法进行探索的过程，通常会停滞不前、令人沮丧——“哦，原来那个链接跟AI和新闻业并没什么关系……”而与GPT-4的互动则更像是在稳步迈向更高层次的认识和理解。


    我认为，GPT-4的姊妹产品ChatGPT广受欢迎在很大程度上得益于此。这种体验本身响应迅速且具有自我驱动性，从而产生了一种智力升级的效果：提一个问题会让你想再提10个问题。


    我还意识到，这种现象在很大程度上是本章应重点讲述的内容。最初，我以为我会重点介绍自动化新闻，描述新闻机构如何利用数据库和基于模板的AI系统生成公司盈利报告、天气预报、体育赛事等方面的数千篇报道。然而，尽管自动化新闻确实为新闻机构提供了战略机遇，但与GPT-4的交流让我获得了一个全新的视角。


    我认为，对新闻业潜在影响最大且最引人入胜的故事是GPT-4如何提高消费者的参与度。当人们对新闻分发方式有更多的控制权时，他们会更喜欢新闻，因此，我猜测他们会对新闻有更多需求。


    # 好消息！一探究竟


    在过去的30多年里，为用户提供高度个性化的体验一直是互联网发展的动力。YouTube、Facebook和亚马逊等平台都会密切关注你所浏览的内容，并据此为你推荐更多你可能感兴趣的'
  merge: -1
  img_proc: true
- pgno: 106
  md: '内容。（比如那双你两年前看过的运动鞋，它一直在不同的网站上跟随着你，宛如一只迷路、孤独的小狗。）


    新闻媒体网站同样采用个性化功能。在我向GPT-4持续提问有关AI对新闻业潜在影响的问题时，“个性化”成了一个反复出现的主题。


    当我问GPT-4，这种个性化如何实现时，它做出了如下回答。


    霍夫曼：新闻媒体网站为了让内容更具个性化，会利用哪些数据来分析用户的行为和喜好？


    GPT-4：新闻媒体网站将利用用户的地理位置、所用设备类型、浏览历史以及曾阅读或互动过的文章等数据。它们还可以分析读者在社交媒体上分享的文章、在网站上的停留时长以及最常访问的版块。此外，新闻媒体网站可以根据读者的年龄、性别和兴趣来呈现个性化内容。这些数据可以通过cookies、调查问卷和用户账号等途径获取。通过分析这些数据，新闻媒体网站能够根据用户的喜好和兴趣定制内容，提供更为个性化的体验。


    换言之，这是一种传统方法，并无太多创新。


    然而，正如上文所说，GPT-4及其姊妹产品ChatGPT所采用的“对话式聊天”方法提供了一种强大且明显不同的个性化版本。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '与基于网络的传统个性化方法长时间监控用户的方式不同，GPT-4和ChatGPT只是实时地为你的查询和提示提供高度响应的信息。这既是关于这些大语言模型运作方式的一个明显的发现，也是一个尚未被充分认识的发现。


    事实上，它们之所以广受欢迎，并不只是因为在众多主题上表现出的类人流利度和专业知识。与那些致力于推广产品或宣传政治家的聊天机器人不同，GPT-4和ChatGPT非常愿意关注你想讨论的任何话题。这种简单的互动为用户带来了高度个性化的体验。随着互动的进行，你会不断根据自己的喜好来调整它。尽管这种高度个性化会影响你使用GPT-4的各种用途，但我认为它对新闻媒体行业具有特殊的重要性。


    想象一下，在未来，你访问一个新闻网站，用下面这些信息查询方法来定义你浏览这个网站的体验：


