  md: '负重前行的过程中如果有个朋友过来说帮助你背包，你会怎么说？它除了背包，还能根据你的建议整理包里的东西，让这个书包给你提供最优服务。这就是ChatGPT当前的状态。我会回答说：“非常乐意有你跟我一起前行。”这就是我读完《GPT时代人类再腾飞》后的感想。


