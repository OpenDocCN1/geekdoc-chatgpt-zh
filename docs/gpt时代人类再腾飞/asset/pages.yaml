- pgno: 130
  md: '# 06 重塑劳动方式，提升生产力、幸福感与满意度


    突破性技术一直在创造未来的职位，


    我的“个人智能”观点是，


    AI可以成为你职业生涯航船的副船长。


    Breakthrough technologies that have created the jobs of the future.


    My personal “human intelligence” take is that AI can serve as your co-captain
    as you steer the ship of your career.


    1990年我大学毕业时，尚未出现“网页设计师”、“SEO策略分析师”和“数据科学家”等职位。而在2003年我与合伙人共同创建领英时，我们的用户中也没有人从事“社交媒体经理”、“抖音网红”或“虚拟现实建筑师”等工作。'
