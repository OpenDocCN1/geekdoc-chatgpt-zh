- pgno: 87
  md: '因此，建立公平且有效的司法制度是提升社会道德标准的基本保障。我们不可能在抛弃其他群体的同时让社会的一部分变得更好，因此，我一直认为，我们对公正的基本理念的定义至关重要。我们不能简单地认为奴隶制已成为过去式，现在的社会并然有序。我们有必要像史蒂文森和EJI其他成员一样，通过不懈的努力让人们看到奴隶制罪恶的铁证，从而对抗奴隶制对人类社会产生的持续影响。


    遗产博物馆位于美国一个恶名昭彰的奴隶市场附近，生动地展示了这种制度的残忍、对沦为奴隶者的折磨和剥削，进而揭示奴隶制对人类历史产生的长期影响。


    我们能够看到，20世纪监禁现象的大规模出现就是奴隶制产生的最持久影响之一。米歇尔·亚历山大（Michelle Alexander）在其卓越的作品《新种族隔离主义》（The
    New Jim Crow）中揭示了这样一个骇人的事实：如今，美国监狱体制（carceral system）牵涉的非裔男性数量，包括被关押、假释中以及执行缓刑的非裔男性，比19世纪50年代的奴隶数量还要多。


    这是一个我们必须努力纠正的严重的不公正现象。坦率地说，如果我认为GPT-4无法提供实质性帮助，那么我对它的兴趣也不会如此浓厚。


