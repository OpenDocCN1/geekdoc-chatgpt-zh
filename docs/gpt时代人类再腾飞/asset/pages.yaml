    AI将通过为人类业务代表提供潜在客户的个性化信息来提高其工作效率，但由于买方资金有限，此举很可能会减少就业机会。尽管这一结果对整个社会来说更有利——因为糟糕的销售电话浪费了所有参与者的时间，但它确实会减少这个行业的整体就业人数。


