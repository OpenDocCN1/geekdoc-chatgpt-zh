- pgno: 153
  md: '因为它可以最大限度地减少开始使用新技术所需的时间和精力，但这实际上是一个误区：新技术很少能完全取代旧技术。


    早期的互联网，像雅虎这样的创新性应用就像是在线电话簿。目录是我们获取信息的方式，因此，看似合乎逻辑的第一步就是创建一个在线目录。然而，随着时间的推移，我们发现更好的方法是创建一个全新的工具：搜索引擎。


    目前，我们正处于利用大语言模型的在线电话簿阶段。虽然大语言模型不太可能在许多应用场景中直接取代搜索引擎，但它将为人们提供收集相关且有价值的信息的新方式。


    在尝试将GPT-4应用于工作中时，我发现了以下三个关键原则。


    原则1：将GPT-4视为本科生水平的研究助手，而非无所不知的预言家。


    如果你曾与本科生水平的研究助手共事（或者你在大学时就是一名研究助手），你会明白这样的助手既具有强大之处，也具有局限性。


    在某些方面，GPT-4远超任何人类研究助手：它具有极为广泛的知识体系，反应迅速，并且随时可用（而不像人类助手需要备考期中考试）。


    然而，它也具备许多其他人类研究助手的缺陷：它并非专家，对某些特定领域的了解相当肤浅，且容易出错。实际上，'
  merge: -1
  img_proc: true
- pgno: 154
  md: '当它出错时，它的表现比人类研究助手更糟糕，因为人类通常会在不确定信息质量时提出警告。


    尽管存在这些缺陷，但它赋予每个人的即时、高度匹配的研究帮助的能力确实令人瞩目，我们需要做的只是确保将结果与更深层次的资源和真正的人类专家进行交叉验证。


    # 原则2：把自己当作导演，而非木匠。


    在使用工具时，我们习惯于把它们当作自己的延伸。木匠挥动锤子，就离建成房子又近了一步。他或她知道每次挥动锤子会产生什么效果，并相应地进行操作。


    当谈到GPT-4等工具时，这个比喻便不再成立。不同于操控实体工具以产生可预测且有计划的成果，使用GPT-4更像是导演一部电影中的某个场景。


    作为导演，你需要与演员合作，以获得最好的表演效果。你不会对他们说：“把你的脖子弯曲15度，2.5秒后看向对面的人。”相反，你会要求他们传递特定的情感：“让我们相信你正在陷入爱河。”


