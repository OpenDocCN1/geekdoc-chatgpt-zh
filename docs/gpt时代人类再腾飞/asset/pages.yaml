  md: '# 07 GPT-4在我工作中的3种运用


    AI不仅可以放大个人的努力，

    还可以扩大整个网络的影响力，

    从而加速很多我所支持的组织的发展。


    AI can amplify individual human efforts,

    it can also amplify network impact,

    accelerating the progress of many of

    the organizations I support.


    就像我希望GPT-4和其他类似技术能改变工作世界一样，我也希望它们能改变我的工作方式。我有幸尝试使用了GPT-4几个月，虽然知道自己目前的学习曲线还很陡峭，但我相信自己已经积累了足够的经验来分享一些如何有效运用这些工具的建议。


    当革命性的技术问世时，大多数人倾向于将其当作现有技术或方法的替代品来应用。这种做法表面上看起来是明智的，'
  merge: -1
