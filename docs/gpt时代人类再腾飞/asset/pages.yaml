  md: '# # 引言 一个灯泡的启蒙时刻


    对于艾萨克·牛顿来说，一颗从树上落下的苹果使他灵光一现，促使他提出了万有引力定律。而本杰明·富兰克林则是在一场雷电交加的风暴中，通过被闪电击中的风筝上的钥匙，证实了电能传输和储存的可行性。而我对AI现状的首次“顿悟”源于一则笑话。那是2022年7月，我向GPT-4提问：“多少个餐厅巡查员才能换一个灯泡？”


    众所周知，GPT-4是一种先进的AI系统，或称自然语言处理器，被认为是大语言模型（LLM）。向其输入几个词或句子作为提示，它便能生成连贯且多样化的回应文本。如此一来，它便能回答问题、执行任务并与人类用户有效互动。


    GPT-4及其前身，包括广受欢迎的ChatGPT，均由OpenAI开发。OpenAI是一家成立于2015年的研究型组织，其使命是让数百万人直接体验强大的新型AI工具。


    作为OpenAI最初的投资者之一，我长期以来都在试用该公司的多个产品。因此，向GPT-4请教并非我首次向大语言模型寻求创作“灯泡笑话”（1）（我钟爱此类笑话）。尽管早期版本的GPT有时能理解这项任务，特别是当笑话公式的主要变量与经典的灯泡笑话相近时，如“律师”或“心理学家”，但它们的输'
