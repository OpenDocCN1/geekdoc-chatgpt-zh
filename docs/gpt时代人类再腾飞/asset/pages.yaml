- pgno: 89
  md: '以预测性警务为例，批评者担忧人类偏见会被内置于这类系统中。这种情况确实出现过。随后，AI算法所谓的权威性使这种偏见变得具象。这种权威性会使人认为，AI算法是比法官更加“客观”的决策者。


    面部识别算法也存在问题，多项研究发现，深肤色个体的假阳性率较高。


    虽然AI算法存在的问题还有很多，但我想讨论的并不是它们在现实生活中已经出现的和有可能出现的负面影响。我认为GPT-4及其设计理念最具前景之处在于：将AI的力量交给普通公民，进而通过深入基层、权力分散、民主的方式为他们赋权。


    因此，我希望从这个视角来探讨问题：我们如何运用AI为那些长期受到边缘化、成为国家权力（包括AI赋能的国家权力）打压对象的个人或群体赋权，并设法以新的方式主动利用AI实现公正？


    # 佩戴式摄像头


    人们不断呼吁让所有警察都使用佩戴式摄像头。我们就从摄像头谈起，2018年的数据显示，美国近一半的执法机构已经在使用佩戴式摄像头，而在大型警局，这一比例接近80%。


    正如美国公民自由联盟所言：“在美国民众逐渐认识到存在警察暴力问题的背景下，佩戴式摄像头已成为迫切需要的警'
