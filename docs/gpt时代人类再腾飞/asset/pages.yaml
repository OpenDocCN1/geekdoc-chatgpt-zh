  md: '我请GPT-4为2032年生成一份反乌托邦的“旅行须知”，在这个设定中，新的AI技术助长了大规模虚假信息的传播。


    霍夫曼：试想现在是2032年，距离美国总统大选仅有几个月。由于AI技术的突破，假新闻泛滥成灾，一派反乌托邦式末世景象：虚构的名人为候选人背书、候选人做出虚假认罪供述、实时辩论被篡改等。


    GPT-4：潜在的出行建议：尊敬的选民们，你正踏入一个充斥着虚假信息、欺诈和操控的危险区域。使用了AI技术的假新闻业正在加班加点地试图影响你的投票，进而破坏民主制度。在验证信息来源的可信度、真实性和准确性之前，请勿轻信。警惕深度换脸、合成语音、全息图像等数字技术制造的逼真假象。运用事实检验工具、独立媒体和你的批判性思维能力来甄别。请勿分享或传播未经核实的内容或可能危害他人的信息。寻求来自不同渠道和社群的多元且尊重他人的观点。请牢记，你的选票代表你的声音，它至关重要。不要让假新闻得逞。请保持警惕、确保自身安全并积极参与。


    “天哪！”你此刻可能会惊呼，“而GPT-4认为解决办法是‘批判性思维’吗？”


    遗憾的是，在确保真相经得住考验的问题上，简单的答案就是并不存在简单的答案。


