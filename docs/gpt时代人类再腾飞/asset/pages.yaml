  md: '# 04 重塑新闻业，准确、透明与真实


    # 在21世纪重建信任。


    # Rebuilding trust in the 21st century.


    在过去20年中，美国新闻业饱受困扰。由于互联网的崛起，来自非新闻领域的广告竞争者纷纷入场，瓦解了新闻业传统的商业模式。与此同时，终于能够表达反馈的公众逐步削弱了新闻业的权威地位。


    报纸出版商作为传统新闻业的中坚力量，肩负着传递时事信息和监督权力的责任，但他们遭受了最严重的冲击。皮尤研究中心数据显示，自2005年以来，美国已有超过2 200家地方报纸停刊，逾4万名新闻编辑部员工失业。


    然而，大众创造的信息量却在不断攀升，如下面这场对话反映的信息。


    霍夫曼：首先，请问你能否给出2022年全球每天产生的信息量？其次，你能否提供有关这一总体信息量增长速度的数据？最后，我想引用你的回答来证明大语言模型在新闻业中可以发挥显著的积极作用。因此，请确保你的回答出自可轻松核实的真实来源，而不是虚构内容。'
  merge: -1
