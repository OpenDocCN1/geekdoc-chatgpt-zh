- pgno: 66
  md: '拔萃的工作。然而，保持旺盛的求知欲是成为伟大艺术家的一部分，这也许就是他愿意花几分钟时间倾听我分享在我所处领域的动态，以及我认为可能对他的领域产生深远影响的事物的原因。


    “我将向你阐述一些关于AI如何改变你所从事的工作的见解，”我说，“在我讲述的前30秒，你可能会感到不安，但我希望在第二分钟时，你会变得充满好奇并心生喜悦。”我觉得这是一个相当吸引人的开场。


    “哦？”


    “那么，”我开始了，“现如今，我接入了一款非公开的软件，例如，它能在极短的时间内以约翰·列依的风格创作歌词、音乐等。尽管作品质量不高，绝非惊艳之作，但人们会觉得，‘嗯，没错。我能听出这是约翰·列依的风格’。”


    这位音乐家说：“好吧，我开始恐慌了。”


