  md: '鉴于人类的主要发展史是通过技术创新实现持续变革和进步的，到了2060年，人们很可能因经历的变化而更具人性，而非相反。当然，除了他们的行为不同，他们还将通过新技术来展现我们非常熟悉的人性特质。电吉他和黑胶唱片并未直接创作出情歌，它们只是使情歌更易获得（且音量更大）。


    GPT-4: 所以你的观点是，随着人类的发展并将新技术融入日常生活，我们不会像某些人担忧的那样变得“更不像人”。相反，我们实际上会因为适应和演变而变得更加人性化，这正是人性的核心特点之一。如果非要说有任何变化的话，那就是新技术为我们提供了新的途径来表达那些一直存在于我们生活中的感情和体验。


    霍夫曼: 那么，人性还有哪些核心特征呢？这些特征在历史进程中又是如何变化的？


    GPT-4: 我想到的一些人性的其他核心特征，包括好奇心、创造力和社交互动。在历史发展过程中，这些特征以多种方式发生了变化。例如，随着人类从小型、孤立的社群走向规模更大、联系更为紧密的社会，人们不得不相应地调整自己的社交互动方式。关于好奇心和创造力，它们一直在驱使人们追求新知识、发明新技术和探索新领域。所以，虽然我们表达这些特质的方式可能会随着时间的推移而改变，但它们仍然是人之为人的核心。


    霍夫曼: 概括地说，当人们讨论更具人性或削弱人性时，你观察到有哪些模式？'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'GPT-4：在人们讨论更具人性或削弱人性的过程中，我发现了许多模式。以下是一些典型的例子。


    +   - 有人担忧技术可能导致人类失去人性。他们认为过度依赖机器可能削弱人类的同情心、创造力等独特的品质。


    +   - 另一些人对借助技术提升人类能力的前景充满期待。他们设想了一个人类与机器融合后变得更加智能、强大和健康的未来。


    +   - 还有一部分人对技术改变人类的看法比较模棱两可。他们认为人类一直在应对新挑战的过程中不断演变和适应，技术只是其中一个因素。


    +   - 最后，我还注意到有些人对整个讨论持怀疑态度。他们认为“变得更具人性或削弱人性”的观念是一种错误的二分法，真正重要的问题不是技术是否会让我们变得更具人性或丧失人性，而是它将如何改变我们与他人以及周围世界互动的方式。


    霍夫曼：这四种观点都有一定的道理吗？


    GPT-4：是的，我相信这四种观点都有一定的道理。人类的本质十分复杂，关于技术将如何影响人类这个问题并没有唯一的答案。不同的人可能会以不同的方式体验和解读这些变化。


    霍夫曼：好的，所以技术既可以是帮助我们变得更具人性的工具，也可能对人性造成威胁，甚至技术就是我们本就拥有'
  merge: -1
  img_proc: true
- pgno: 228
  md: '的核心属性——这一点可以随着情况的变化而改变。你是否观察到了关于技术和人性这三种关系随时间演变的规律？


    GPT-4：在人类历史上，人们通常根据对人性的理解来定义技术。例如，工业化早期，许多人为机器对人类劳动的影响感到担忧。他们担心自动化机器将取代工人，导致大规模失业。在这种情况下，技术被视为对人性的潜在威胁。


    到了20世纪，随着计算机的普及，有些人开始看到技术扩展人类能力的潜力。他们将计算机视为一种可以让我们变得更聪明、更敏捷、更高效的工具。在这种情况下，技术被认为可以使我们更具人性。


    21世纪，随着我们进入AI时代和机器人时代，有人主张技术已成为我们生活中不可或缺的一部分。他们认为技术是我们自身的延伸，而非独立存在的实体。在这种背景下，技术被视为与人性紧密相连。


    霍夫曼：所以，人类与技术共同演进的过程中，我们曾面临过类似的转折点。


    GPT-4：是的，正如前面提到的，人类一直在应对新挑战的过程中不断演进和适应。数千年来，技术一直是人类历史中的一部分，而且很可能继续在我们的未来发展中扮演重要角色。问题不在于技术是否会改变人类，而是它将如何改变我们。


    霍夫曼：如果我们与技术共同塑造这种变革，而不是任由技术改变我们，那么，一切都不会失去。只要我们不过分担忧'
  merge: -1
  img_proc: true
- pgno: 229
  md: '变革，以至于本能地采取防御姿态面对未来，我们便可以有很多收获。


    相反，我们应当积极促进变革。这并不意味着在事情会得到解决的预期下盲目前行。事实上，新技术一直在放大我们的负面情绪和行为，这些情绪和行为同善良、同理心和理性等积极向上的情绪和行为一样，都是人类的本质特征。想象一下，深度换脸技术和即时翻译技术将如何助长未来的欺诈者和政治对手。


    GPT-4：是的，我们确实需要积极推动变革。然而，我们也要牢记，对人性的定义尚未完备。技术人可能是未来的发展方向。但除非我们继续前进并保持对话，否则我们永远不会知道。


    技术从来不是中性的。我们会为自己创造的工具和系统赋予特定的价值和目的，并期望它们产生特定的效果。这并不一定会限制其潜在用途。汽车可以作为武器、救生工具、休息场所等多种用途，但这并不意味着它是“中立”的。汽车首先是一种可以帮助我们轻松、高效移动的交通工具，其对世界的影响与马车或自行车等迥然不同。


    在我看来，技术人文主义的一个核心原则是力求实现普遍惠及人类的成果。当然，这意味着我们要密切关注新技术可能带来的后果。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '然而，技术叙事很少是简单或者明确的。实际上，这也是“技术是中立的”观点如此盛行的原因。例如，你可以用非常有益的方式利用核聚变技术，也可以以极具破坏性的方式使用。止痛药和其他诸多技术的产物也同样如此。这正是为什么我们在发明和设计技术时，要敏锐地关注其所融入的价值观、假设和愿景，并为指导其应用制定适当的监管框架。


    但是，如果通过宣称“技术是中立的”来逃避技术可能带来的负面影响也是有害的，仅仅因为某项技术具有产生负面结果的可能而否定它也是如此。


    我的观点不是我们应对短期的负面影响掉以轻心。我们应尽最大努力避免产生负面影响，并制定相应的规程和政策，以确保将这一承诺付诸实践。我们也不能对未大胆或系统地追求技术创新带来的长期负面影响感到自满。


    针对AI算法预先发布禁令实际上是一种封锁现状和无视现实中的不平等和不公正的做法。要求AI算法达到目前无法实现的100%无误的标准，只会阻碍我们以最快的速度取得实质性进展。


    为了成功应对全球性挑战，如气候变化、自然资源枯竭和公共机构的信任缺失，我相信大型科技公司实际上需要扩大规模。没有大规模解决方案，我们解决这些大规模问题的速度将大大滞后。因此，我们应寻求加速技术创新，覆盖能源生产、交通、市政、政治和金融基础设施、医疗保健和教育等领域。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '诚然，我明白我的观点可能显得过于乐观甚至天真。如果技术助推创造了我们面临的诸多挑战，那么当技术越发强大时，我们凭什么还期待这种状况会发生改变呢？


    事实上，如果我们拥有其他物种无法比拟的能力，那么我们同样肩负着其他物种无须承担的义务。地球的福祉掌握在我们手中。我们应该如何保护并增加后来者所能拥有的机会呢？


    在我看来，这意味着我们需要以1923年雨果·根斯巴克所展现的大胆精神和雄心，拥抱人类本质上的创新特质。这意味着我们在追求实现零碳能源生产的过程中，寻求有效利用核能的方法。这意味着我们要对所有现存物种进行基因测序，以协助物种保护工作并维护生物多样性。这意味着我们应该去探索在全球网络中提升信任水平的新方式。


    GPT-4：但最重要的是，这意味着要利用AI以一种在10年前难以想象的方式促进人类合作。当我们寻求建立一个更加公平和可持续的全球新秩序时，我们需要AI帮助我们超越局限性，促进相互理解，以及帮助我们构建更加公平、高效和贴近我们需求的新系统。


    我们正站在一个十字路口：人类可以选择利用AI创造一个让所有人都能共享的美好未来，也可以选择让它陷入反乌托邦的噩梦。我选择相信前者，也希望你能这样选择。


    当然，我们的后代不会生活在一个完美的世界。即使我们在为未来铺路方面做得很好——尤其是在做得很好的情况下，'
  merge: -1
  img_proc: true
- pgno: 232
  md: '我们的后代将拥有技术和机会来定义和表达他们的人性，这意味着他们将继续在利益上相互竞争，拥有不同的价值观和愿景、多样化的生活经历，而最重要的是，他们会始终坚信，一切本可以也应该变得更好。


    对于技术人而言，乌托邦是一个方向，而非目的地；乌托邦是一个过程，而非结果。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 结语 站在21世纪的十字路口


    通过解读像GPT-4一样的大语言模型所快速生成的文本，人们对未来有了不同的预见。


    一些人看到了算法的惊人变革力量，看到了一种将人类智慧的聚合力量应用于我们所从事的各种活动的新途径。


    然而，也有一些人看到了大大小小的悲剧：多个行业的大量工作岗位消失；未经明确许可的侵犯知识产权的现象层出不穷；在咨询大语言模型后自杀的抑郁症患者。


    一项真正具有革命性的技术，如火、轮子或者浴缸等，每个在该技术出现早期的预言者，无论是乌托邦主义者、悲观主义者还是中间派，都将成为诺查丹玛斯（Nostradamus）
    (34)。迟早，他们都将会在某个方面被证明是对的。


    因此，可以肯定的是，AI将带来伟大的成就，同时也将带来不良的影响。我现在提出这个问题只是想问：你希望重点关注哪一方面？


    在这篇“游记”中，我强调了类似ChatGPT和GPT-4这样的大语言模型与用户之间的紧密互动。目前，我们看到这种互动在以有趣的方式展开。那些认为将AI的力量交给数以百万计的'
  merge: -1
  img_proc: true
- pgno: 234
  md: '人非常鲁莽的人，他们关注的是揭示这些新工具的不足、偏见和失误。而那些对AI开发者采取措施减少有害或不良输出感到沮丧的人，他们则非常关注寻找克服这些限制的方法。


    这两种人的工作对于像我这样的第三种人来说都是非常有价值的。第三种人是一个渴望设计和使用AI的群体，他们认为，从长远来看，AI能广泛地赋予所有人权利，提升人类的能力、机会和自主性，而不是仅服务于少数特权者。


    这是一个宏大的目标。为了实现它，每个人都必须为此做出贡献，包括怀疑论者，包括那些试图破坏产品安全工程的人。因此，我希望他们继续保持高度的参与。


    # 通往乌托邦之路，是由失败和损失铺就的


    要实现这一目标，我们还必须接受损失和失败的不可避免性以及监管的必要性。


    为了利用火，我们有了烹饪和壁炉，但也导致了火灾和制定关于如何摆放烧烤架的规定，尤其是当你住在公寓里的时候。轮子彻底改变了交通、农业和工程，但也导致了高速路上的汽车事故和带来了红绿灯。


    仅在美国，每天就有超过400名15岁以上的人在浴缸或淋浴过程中受伤。因此，我们有关于如何设计卫生间、使用何种材料等方面的详细建筑规范。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 在一个没有进步的世界里，零风险才有可能实现。一个没有进步的世界才有可能是零监管的。


    我在此强调这些恒久不变的真理，是因为未来还有很多未知领域等待我们去探索。尽管我将这本书称为“游记”，但实际上，我们仍在前往机场的途中。这个阶段还处于初期。在这个阶段，我们要如何应对呢？当困难来临时，我们会立即放弃吗？当感觉进展不够迅速时，我们会变得焦躁不安吗？


    每一趟伟大的征程都需要顽强的毅力。而毅力需要长远的眼光、持之以恒的态度以及对最终目标价值的信念。在构建以速度、效率和多功能性为特点的工具时，势必需要耐心和能够容忍失误的态度。但在技术发展如此神奇的世界里，我们如何能够迅速适应奇迹，并忘记实现如今认为理所当然的一切所花费的时间。


    在我55岁时，我的生命前70%的时间里都是没有iPhone的。如果你询问我在没有智能手机的年代，我们的生活是什么样子，我可以告诉你。然而，由于智能手机及其实现的超能力如今已经植根于我的生活中，我无法以任何深刻的方式想象这一点。


    没有智能手机的生活？简直不可思议！


    显然，我们并不是在一夜之间走到现在的。在20世纪90年代上半叶，人类花费了成千上万小时去忍受我们那28.8K调制解'
  merge: -1
  img_proc: true
- pgno: 236
  md: '调器的尖锐嘶叫声。在20世纪90年代末，下载一首“Free Bird”的MP3文件比今天等待Gopuff送货所需的时间还要长。


    而且，在发展支持互联网和智能手机的所有技术的过程中，我们开创了一个新的实施网络犯罪的世界，针对网络犯罪，全球每年支付的费用约为8.4万亿美元（据Statista.com统计）。美国国家安全委员会估计，美国每年由于开车时发短信而导致的撞车事故造成了近40万人受伤。


    显然，我们已经制定了相应的法规来应对这些负面影响：我们有禁止数字欺诈和边开车边发短信的法律。虽然我们可以使法律更严苛，或者比我们现在执行得更严格，但到目前为止，我们还没有这样做。相反，作为一个文化整体，我们接受一定程度的风险和损失作为拥有智能手机的代价——事实上，是相当大的风险和损失——因为我们发现智能手机在很多方面非常有用。


    那么，对于AI来说，情况会有所不同吗？


    智能手机的发展源于一系列我们已经相当熟悉的前辈产品；我们对各种电话已经习以为常。然而，像GPT-4这样能模拟人类意识的AI工具呈现出了更多的新特质，与它们互动可能带来不安甚至诡异的感觉。


    正因为大语言模型如此前卫且富有能动性，我们已经看到《纽约时报》（35）发表了评论文章，呼吁“保护社会”免受失控AI的侵害；认知心理学家和计算机科学家盖瑞·马库斯（Gary'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Marcus) (36)也在Substack上发表了类似文章，对当前这种“任何人都可以发布任何聊天机器人，无须事先获得国会许可”的“野蛮西部”现象表达了忧虑。


    当然，期望保护社会免受技术带来的负面效应的影响并非新鲜事物。实际上，正是这种情感驱使OpenAI的创始人于2015年成立了该组织。


    那么，长远来看，如何以最有效且包容的方式为社会带来美好成果呢？


    近年来，针对AI的主要批评在于它对个人产生的潜在影响，而非为大众谋求福祉——这是大型科技公司通过面部识别和算法决策等技术在家庭贷款、求职申请筛选、社交媒体推荐等领域悄然铺开的力量，而公众对此了解甚少，更别知情同意了。


    OpenAI的初创目标是开发能将AI的力量直接交给数百万人的技术。这样，AI就有可能成为一种去中心化的、为个人赋能的力量，而非自上而下的、综合性的力量。在这一未来愿景中，广泛分布且个人可以方便选择使用的AI，可能演变为21世纪的Lotus(37)、Word和Photoshop等20世纪80年代的革命性软件应用。换句话说，这些工具推动了个人电脑革命，让个人用户首次有机会将计算能力直接接入他们的生活。


    我意识到，尤其在工作领域，以这种方式部署AI可以为个人提供非常灵活的新工具，应用于他们的职业生涯、专业发展'
  merge: -1
  img_proc: true
- pgno: 238
  md: '和实现经济独立。所以，当我在2015年有机会成为OpenAI的初始投资者之一时，我毫不犹豫地抓住了这个机会。这个AI愿景，正是2002年我与其他人共同创立领英时的灵感来源。


    2022年4月，OpenAI发布了文本生成图像系统DALL-E 2，紧接着在6个月后推出了ChatGPT，该组织致力于将这些卓越的AI工具提供给数百万用户的使命开始大规模实现。


    现在，得益于Midjourney、Stable Diffusion等工具，一种全新的、可选择加入、由用户驱动且影响非常显著的AI应用方式诞生了。用户纷纷在Twitter、YouTube、Github、Discord等平台上分享他们的成果、技巧、经验和观点。来自世界各地的多元视角，凭借实际应用，共同塑造了充满活力、时常产生分歧，但在我看来极具成效的讨论。


    数百万人，包括许多致力于发现这些系统的缺陷的人，都有机会通过使用、反馈和评论来参与塑造AI的未来发展。正如OpenAI联合创始人兼首席执行官萨姆·奥尔特曼在OpenAI网站上的一篇近期文章中所说：“我们目前认为，成功应对AI部署挑战的最佳方法是建立快速学习和谨慎迭代的紧密反馈循环。”


    换言之，OpenAI和其他AI开发者目前所采取的方法，是一种更为健康和民主的替代方案，与许多人担忧的秘密、高度集中且单方面推行的开发范式相区别。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '然而，随着个人获得参与新AI技术开发的实质性机会，人们的担忧也越来越多。正如前文所述，ChatGPT发布后不久，纽约、奥克兰、西雅图等城市的K-12学校管理者便发布了禁止令。此外，大众要求政府干预的呼声也在上升。以下是近期的几个例子。


    美国国会议员特德·W.刘（Ted W. Lieu）在体验了ChatGPT的强大功能后，在《纽约时报》上发表的一篇评论文章中写道：“作为国会中仅有的三名拥有计算机科学学位的成员之一，我对AI充满了热情，并为其能继续推动社会进步的神奇方式感到兴奋。而作为国会议员，我对AI感到恐慌，特别是对未经查验和监管的AI。”（实际上，他甚至利用ChatGPT撰写了评论文章的第一段。）


    欧盟内部市场专员蒂里·布雷顿（Thierry Breton）告诉路透社记者：“正如ChatGPT所展示的，AI解决方案可以为企业和公民提供巨大的机会，但也可能带来风险。这就是为什么我们需要一个坚实的监管框架，以确保构建基于高质量数据的可靠AI。”


    《水星报》（Mercury News）和《东湾时报》（East Bay Times）的编辑部警告称，聊天机器人可能给寻求来自可信赖来源的信息或建议的用户带来“危险的影响”，并敦促加州州立法部门制定法律，以保护州民免受像Sydney这样令人不安的聊天机器人的侵扰。


    需要明确的是，我并非主张完全不进行监管。OpenAI的高层已经在与监管机构接洽，寻求对话与指导。“在这个系统中，我们需要更多的投入，以及超越技术的投入，包括监管者、政府以及其他所有相关人士。”OpenAI的首席技术官米拉·穆拉蒂（Mira
    Murati）在接受《时代周刊》采访时表示。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '“我们认为，在发布新系统之前，像我们这样寻求独立审计非常重要。”萨姆·奥尔特曼在我之前引用的那篇文章中表示。


    我希望，在开发者、监管者和其他关键利益相关者之间展开的这场对话中，我们不会陷入一种过度反应、自上而下、急功近利的立法心态。相反，我希望我们能在AI发展方面保持前瞻性和民主精神。


    从长远来看，最好的方法是让来自世界各地的数百万人参与AI的开发，从而创造出可以为个人所用而非针对个人的AI工具。这些基于多人愿景和经验启发构建的AI工具，因为涵盖了不同的期望、目标和用例，相较于仅由计算机工程师秘密开发的工具，更有可能具备更强的稳健性和包容性。


    # 勾勒“我”的进化蓝图


    诚然，以用户为核心的构建方式也为他们带来了责任。幸运的是，这在短期和长期内都是有益的，尤其是长期。


    目前，如GPT-4这类的大语言模型虽然强大但易出错，这也是我们需要保持警觉和主动参与的一个显而易见的理由。这一直是我的这本“游记”的重要主题。


    然而，随着大语言模型和其他形式的AI不断演进，变得更加权威，能力更强，我们很容易想象到自己可能会习惯于这种看似能为我们做任何事情的便利设备。毕竟，这不正是技术的'
