  md: '霍夫曼：请写一首关于大语言模型的十四行诗，该模型只能在与知识库中的事实核查一致后，才与发起请求的用户共享生成内容。其中还要包括一些关于这究竟会使大语言模型变得更强还是更弱的探讨。


