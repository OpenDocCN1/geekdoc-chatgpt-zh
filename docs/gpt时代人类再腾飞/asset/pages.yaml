  md: '然而，当我们谈论艺术家利用GPT-4的同时，也要关注GPT-4如何利用艺术家。当大语言模型或者像DALL-E这样的图像生成器在未经艺术家明确许可的情况下将其在线知识产权纳入学习过程时，又将产生何种影响？正如《纽约时报》2023年2月的一篇报道所说：


    > “艺术家们对发布新作品感到担忧。”计算机科学教授赵奔（Ben Zhao，音）说。许多艺术家依靠在网上发布作品来展示自己的才华，他们现在惧怕这些作品会“养育出一个越来越像他们的怪兽”。正如赵教授所言，“这让他们的商业模式岌岌可危”。


    我觉得这种担忧是合理的，赵教授提出的解决方案——Glaze，一种让艺术家在数字层面“掩饰”图像的工具，似乎是一个明智且富有创意的应对之策。Glaze能在像素层面改变图像，人眼无法察觉，但“机器人”却能将其识别为一种截然不同的图像风格：


    > ……稳定扩散技术会将其与杰克逊·波洛克（Jackson Pollock）飞溅的颜料斑点联系起来。


    > ……当艺术家卡拉·奥尔蒂斯（Karla Ortiz）在网上发布她的Glaze作品时，一个接受过这些图像训练的图像生成器将无法复制她的作品。以她的名字作为提示，反而可能生成一种她的作品与波洛克风格融合的图像。“我们正在收回我们的同意权，”奥尔蒂斯女士表示。


    这个早期案例展示了创作者与AI之间必将产生的动态的且有时充满争议的关系。但实际上，创作者与技术创新之间的关系向来错综复杂。19世纪中叶摄影技术问世时，画家们也有过一些合理的忧虑。一些人的职业生涯无疑受到了影响——尽管如此，画家和摄影师却始终都在创作惊人的作品。'
