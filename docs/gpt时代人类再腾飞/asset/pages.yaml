- pgno: 19
  md: '出往往只能算是尚可。若给予它们一些不那么常规的设置，早期的GPT便会像业余演员在开放麦之夜上一样僵住。


    # 霍夫曼：多少个餐厅巡查员才能换一个灯泡？


    GPT-3：只需一个，前提是灯泡愿意改变。


    GPT-3还是继续做它以往就能做的日常工作吧。相较之下，当我向GPT-4提交相同的提示时，收到了如下回应。


    # 霍夫曼：多少个餐厅巡查员才能换一个灯泡？


    GPT-4：（经过删减）有几种可能的方式来回答这个问题，具体取决于回答的语气和目的。以下是一些不同类型的（从严肃到幽默）回应的例子。


    基于事实的回答是：通常情况下，只要遵循适当的程序并使用合适的工具和设备，一名巡查员便能安全、正确地更换灯泡。然而，某些情况下可能需要多名巡查员，如灯具位于难以触及或危险的区域、巡查员需要协助或监督，或者巡查员需要为了合规的目的记录或报告更换过程。


    基于笑话的回答是：需要四名餐厅巡查员才能更换一个灯泡。一个人扶着梯子，一个人旋下旧灯泡，一个人旋上新灯泡，还有一个人负责为使用错误瓦数的灯泡开罚单。


    通过这个例子，我们可以看到GPT-4在回答问题时所展现的智慧。虽然GPT-4猜测我可能是要求它讲一个笑话，但它仍然给'
