- pgno: 37
  md: '球员的身体数据。


    但是，除非有人已经不厌其烦地编译和发布了你想要的确切信息，否则查找可能会非常耗时。即使这些信息存在于同一个网站上，如维基百科或NFL.com，也可能会分布在不同的网页上。得到你想要的答案仍然会占用你很多时间。


    此外，当你的目标是对一些更广泛的兴趣或主题进行简要概述时，就像我在本章开头提到的那样（研究在COVID-19流行时期关于供应链管理的问题或者规划度假行程），情况只怕会更糟。


    在全面寻求权威信息的过程中，倘若没有GPT-4这样的辅助工具，你可能需要花费大量时间。借助GPT-4，你就可以从一个更靠近目标的起点出发。


    更为关键的是，GPT-4之所以具备这种能力，源于其以一种完全不同于维基百科或传统搜索引擎的方式获取并整合网络信息。基本上，GPT-4可以将庞杂、无序的人类知识和表达整合成一个紧密互联且可互操作的网络，从而提升人类在整合其思维和影响方面的能力。


    那么，如何以最佳方式利用这一虽不完美但极其强大的新工具呢？当我向GPT-4提出这个关键问题时，它给出了以下回答。


