  md: '一些人类专家，如经济合作与发展组织的安德烈亚斯·施莱克尔（Andreas Schleicher）和埃克塞特大学的迈克尔·巴伯爵士（Sir Michael
    Barber）曾与几十个国家的学校系统合作，研究哪些因素能显著提升贫困儿童的学业成绩。他们表示，提升最快的学校系统采取的做法是将技术与其他资源相结合，将优质教学方法传递给老师，再由老师传递给学生。


