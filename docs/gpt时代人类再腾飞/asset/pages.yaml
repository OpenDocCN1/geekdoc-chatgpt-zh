    这场战争仅仅是一个更为致命的事件的序幕。1918—1919年，西班牙流感通过归国士兵以及铁路和游船上的旅客传播开来。短短两年内，它夺去了2000万~5000万人的生命。


    对于20世纪20年代的人们而言，诅咒导致这些恐怖事件的技术，以及对创新采取保守的立场似乎是完全合理的选择。


