- pgno: 241
  md: '全部意义吗？从绘制洞穴壁画，到在暗室冲洗照片，再到宝丽来拍立得相机，然后到Instagram自动应用的滤镜，最后到DALL-E 2。


    技术的终极目标不是使我们不再为工作所累，而是为了更好地工作？技术旨在帮助我们做得更少，还是做得更多？直到现在，它所实现的一直是后者。我也希望它是后者，而不仅仅是为我们其中的一部分人服务。


    我想要强调的是，我在这里使用“工作”一词是具有广泛意义的。我指的是人类的努力、创造力和生产力的所有变化——有偿工作、志愿工作、家庭工作、艺术表达，指的是任何可以让一个人有目标、意义感和成就感以及获得感的东西。


    我不希望AI抹去这些，而是希望AI能够放大这些。但我们必须非常有目的性地实现这一目标。


    AI未来的某些版本可能会引导我们走向不那么有益的道路，而这些道路所带来的挑战可能并不显而易见。事实上，它们很可能看起来像是成功。


    我到底在说什么？


    想象一下，未来30年、50年或100年后由AI驱动的世界。大规模失业并没有发生。或是它真的发生了，它发生的原因是AI的生产力创造了丰富的物质，以至于贫困不复存在。社会范围内的各种安全网络使每个人都拥有住房、食物、衣物，都可以'
