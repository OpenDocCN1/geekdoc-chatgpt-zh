  md: '在踏上这段探索之旅前，我想先向你详细介绍一下我的伙伴——GPT-4。此前，当我谈论GPT-4时，我在诸如“意识”、“觉察”和“理解”等词语上加了引号，这表示我作为一个有意识的生物，深知GPT-4并非如此。GPT-4在本质上是一台高度精密的预测设备。


    尽管GPT-4（以及其他类似的大语言模型）并无意识，但它们在众多不同场景中产生合适内容的能力正在飞速提高，以至于它们展现出越来越强的类人智能。因此，我认为在描述大语言模型时，以一种非字面的方式使用“意识”和“理解”等词是可行且有益的，就如同理查德·道金斯（Richard
    Dawkins）

    \(^{(4)}\)在他1976年的著作《自私的基因》中所使用的那个词。


    基因并无意识、主体性或自我认知，这与“自私”一词所暗示的含义并不相符。但这个短语及其隐喻有助于我们从人类的角度去理解基因的功能。


    同样，GPT-4并没有类似人类思维的存在。但借助“视角”等词进行拟人化思考仍然具有启发性，因为这样的表述有助于传达GPT-4实际上是以一种非固定、非一致或非可预测的方式运作的。


    从这个意义上讲，它的确与人类类似。它会犯错、改变“想法”，甚至表现出相当程度的随意性。因为GPT-4展示出了这些特质，并且往往以让人觉得具有主体性的方式行事，所以我有时会使用在隐喻意义上暗示其具有主体性的词。从此刻起，我将不再使用引号。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '然而，我希望作为读者的你能始终牢记GPT-4并非有意识的生物。我认为，这种认识对于理解如何、何时以及在何处更有效、更负责任地使用GPT-4至关重要。


    本质上，GPT-4能预测语言的流动。通过大量互联网上的公开来源文本训练，大语言模型能识别单个意义单元（如部分或完整的词、短语和句子）之间最常见的关系，从而频繁地对用户的提示进行回复，这些回复在语境上是适合的，在语言上是流畅的，而且在事实上是准确的。


    有时候，大语言模型会生成包含事实错误、荒谬言辞或看似与上下文相关但并不真实的虚构段落。


    这一切表现都源于数学和编程。各种大语言模型至今尚未掌握能够进行常识推理或关于世界运作的新推导的事实或原则。当你向大语言模型提出问题时，它对你的沟通意图并无认知或洞见。在回应时，它并不是对生成文本进行事实评估或道德判断，而仅仅是基于提示中的词的序列进行算法猜测。


    另外，由于大语言模型训练所依赖的语料库（corpora）(5)通常来自可能含有偏见或不良内容的公共网络资源，因此大语言模型也可能生成带有种族主义、性别歧视、威胁和其他令人反感的内容的回应。


    为了使大语言模型更符合特定目标，开发者可以采取相应措施。例如，OpenAI已经选择有意限制GPT-4及其他大语言模型'
  merge: -1
  img_proc: true
- pgno: 31
  md: '的输出，以减少它们生成有害、不道德和不安全内容的可能性——哪怕用户想要看到这样的内容。


    为此，OpenAI采取了一系列措施，包括从部分数据集中删除仇恨言论、攻击性语言和其他令人反感的内容；开发“毒性分类器”（toxicity classifiers）以自动检测大语言模型可能生成的问题性语言；使用经过人工注释的文本进行校正，以指导期望输出。这样一来，大语言模型可能会学会不对记者离婚发表无趣的玩笑。


    虽然这些技术并不能完全消除问题输出，但可以将其出现的可能减至最低。即便有种种防护措施，大语言模型仍无法在涉及复杂道德困境的问题或更直接的问题上做出合理判断。


    以基于GPT-3.5的ChatGPT为例（这是距离GPT-4最近的前一版本），若问它葛底斯堡演说的第五句是什么，它可能会给出错误的回答。这是因为大语言模型实际上并未像人类那样理解葛底斯堡演说、句子，甚至计数的概念。因此，它们无法像人类那样运用这些知识（例如：“我要找到葛底斯堡演说的文稿，然后数到第五个句子。”）。相反，大语言模型一直在对给定文本字符串中的下一个词进行统计预测。


    ChatGPT在训练中已成功将“葛底斯堡演说”与其他词相互关联，特别是演说的具体内容。因此，当你向ChatGPT询问葛底斯堡演说的第五句时，它极有可能提供该演说的其中一句，但或许并非第五句。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '实际上，我敢断定它会给出第九句。


    我这样推测，是因为演说的第九句与第一句一样，经常在其他文本中被引用。这意味着在ChatGPT的训练数据中，第九句可能比演说中的其他句子出现得更频繁（除了非常著名的第一句）。正是这种普遍性导致ChatGPT在被要求给出第五句时选择它。（6）


    然而，值得称赞的是，假如你要求ChatGPT将葛底斯堡演说改编成Rush乐队的一首歌的歌词，然后告诉你如果Rush乐队演唱该歌曲，谁会担任主唱，它会表现得非常出色。


    试试看，你会明白我的意思。


    # 拥抱“AHA！”时刻


    随着GPT-4等AI工具的不断强大，人们对AI和机器人取代大量人类职位的担忧也日益加剧，这些职位涵盖从客户服务代表到律师等各种职业。


    若你关注近几个月的新闻，就会发现这些担忧并非毫无根据。2022年12月，ChatGPT通过了美国执业医师资格考试的三个板块。2023年1月，它通过了明尼苏达大学法学院四门课程的考试。


    GPT-4在智力水平上明显优于ChatGPT。例如，以下是它回答关于葛底斯堡演说问题的表现。'
