- pgno: 116
  md: '同时，一些简单的现实问题是GPT-4无法解决的。GPT-4无法亲临火灾现场提问。它不知道如何在州议会中找到潜在的消息来源，并逐渐赢得与会者的信任。它缺乏生活在这个世界上的人类所具备的道德推理和情境理解能力。


    因此，我有两方面的愿望。首先，我希望新闻从业者能积极地，甚至大刀阔斧地在工作中应用GPT-4这类工具，从而使工作富有成效。其次，我希望新闻从业者能在应用GPT-4这类工具发挥自己的判断力时履行监督职责，让这些工具最大限度地提高生产力。'
  merge: -1
