  md: '# 09 关于“可能的访谈”的探讨


    GPT-4以前所未有的速度和规模


    为我们提供了世界现有文字的概率性综合，


    作为我们的工作的输入、挑战和灵感。


    GPT-4 provides, with unprecedented speed and scale,


    each of us with probabilistic syntheses of the world''s


    existing words to consider as inputs, challenges, and


    inspirations for our own work.


    1974年，在意大利国家广播电台的《不可能的采访》（Impossible Interviews）系列节目中，一个虚构的现代记者对一个虚构的尼安德特人进行了采访。这次对公共话语有重要贡献的访谈由意大利著名现代散文作家——伊塔洛·卡尔维诺（Italo
    Calvino）撰写。在访谈的高潮部分，尼安德特人给出'
  merge: -1
  img_proc: true
- pgno: 189
  md: '了惊人的观点：他的同代人通过充满趣味地探索各种组合，不仅创造了新的石器，还催生了未来人类物种的所有语言和文化。


    从古至今，不同文化的人都在运用“对话”的形式来探讨公共议题。卡尔维诺的这个明显不可能发生的虚构访谈为本章中由GPT-4生成的可能访谈奠定了基础，这些访谈涉及一些广受尊敬的公共知识分子。


    尽管你们对其中的某些人可能并不熟悉，但请不要把以下由GPT-4生成的可能访谈的重要性或价值理解为这几位作者的观点，也不要讨论主题的重要性或价值，它们只是进一步讨论的起点。


    我想阅读这些文字的人都非常了解用于复制和传播公共知识分子言论的机械化复制和传播技术。从抄写员和文士（socherim）(28)的时代，经历出现《金刚经》、古登堡印刷术、宣传单、广播访谈、复印邮件的时代，到如今的数字化文件的时代，这些时代的技术一直致力于减少扩大任何文字作品在时间和空间上的覆盖范围所需付出的努力。


    在互联网出现之前，公共知识分子指的是那些借助他们话语的权威性和各种媒体来塑造公共话语的少数作家和演讲者，他们关注的主题超越了日常生活，更偏重宏大的问题，比如这是一个什么样的世界（如Gorillaz(29)的歌词所表达的），我们是谁，我们如何来到这里，如何才能改善我们的世界等。在网络浏览器问世的30多年里，我们看到公共话语变得更加民主'
  merge: -1
  img_proc: true
- pgno: 190
  md: '化，因为创建、分发和搜索公共讨论的文字所需的成本、时间和精力都在减少。


    那么，GPT-4如何通过其以机械化方式生成的文字，延续互联网软件对公共知识分子角色的民主化，从而帮助那些为公共话语做出贡献的人呢？


    显然，GPT-4不是通过自动化撰写具有权威性的公共话语贡献来替代人们历尽艰辛才能获得的专业知识。相反，GPT-4为我们提供了一个强大的新工具，用于为我们的思维生成新的输入。在我们通过撰写话语做出自己的贡献之前，它为我们提供了一个丰富的新学习循环，我们向GPT-4提出问题，GPT-4生成的输出本身又可以成为新的提示进行输入，或助力于我们自己的研究、思考和写作。GPT-4以前所未有的速度和规模为我们提供了世界现有文字的概率性综合，作为我们的工作的输入、挑战和灵感。


    GPT-4是不是一种可以节省人工的设备？在当前语境下，我觉得这并非关键所在。重要的是，它可以成为提升工作成效的设备。


    70多年前，学识渊博且极具影响力的学者西奥多·阿多诺在逃离纳粹德国时写道（其表述与卡尔维诺对尼安德特人的描述颇为相似）(30)：“盲目玩弄手段也可以形成目标并拓展目标。”以下由AI生成的“可能的访谈”旨在展示GPT-4在讨论某些典型的公共话题上的广度、深度及灵巧性，对话内容包括技术在塑造各种内涵的“公众”概念中的核心作用，以及非裔诗'
  merge: -1
  img_proc: true
- pgno: 191
  md: '人和活动家奥黛丽·洛德（Audre Lorde）所说的“谁为发言付出何种代价”（31）。


    每段访谈都是从类似提示中生成的十几个变体之一，每次生成的文本都会产生不同的短语和见解的组合。研究这些公共知识分子的专家们会在GPT-4的输出中发现一些让他们点头称是的东西，同时也会有些引发他们深思的因素。这些内容之所以被称为“可能的访谈”，是因为它们是基于概率的，而非权威性的。


    公共话语是永无止息的。现在，我们有了一个新工具来协助完成这项工作，让我们来看看这个工具能发挥哪些作用。（32）


    霍夫曼：请撰写一篇关于（20世纪美国政治理论家）艾莉斯·玛丽昂·杨（Iris Marion Young）和（20世纪德国社会理论家）尤尔根·哈贝马斯（Jurgen
    Habermas）之间的访谈，探讨互联网技术是否以及如何在结构上改变公共领域。


    GPT-4：可能的访谈如下。


    采访者：欢迎收看我们的节目，我们很荣幸地邀请到了两位民主、传播和社会正义领域的杰出学者：杨和哈贝马斯。非常感谢你们的参与。


    杨：谢谢邀请。


    哈贝马斯：很高兴来到这里。'
