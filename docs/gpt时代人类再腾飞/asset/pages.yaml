  img_proc: true
- pgno: 114
  md: '文化中，部分新闻文章的“成分”将变得如同罐头盒上的营养标签一样清晰易读，这样做有什么弊端呢？


    假设成千上万的新闻机构，包括那些具有鲜明意识形态立场的组织，开始以这种方式大力传播真实信息，我们或许能在打击虚假信息市场方面取得显著成果。


    # 在没有新闻工作者的情况下，新闻业无法存续


    在此次探讨过程中，我一直在强调，像GPT-4这样的AI工具的普及将为新闻业和新闻工作者创造空前的机会。


    然而，前文也提到，新闻工作者的困境在于新闻业的现状。当新闻工作者长时间陷入为生计而疲于奔命的境地时，他们就不太可能愿意承担职业发展之路上的风险。


    尽管如此，当有原则地寻找真相变得前所未有地紧迫时，机会显然是存在的。对那些能够找到创新方法充分利用新的AI工具的人来说，摆在他们面前的是巨大的机会。借助新技术的力量，是新闻业在过去得以发展壮大的主要原因之一，在未来，情况极有可能也是如此。


    对希望在行业中保持竞争力的新闻工作者来说，他们应该怎么做呢？


    首先，显然他们应尽一切努力熟悉像GPT-4这样的AI工具，并尝试用创新的方式发现和讲述故事。'
  merge: -1
