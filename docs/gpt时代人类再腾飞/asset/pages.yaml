  md: '# 推荐序二 GPT：为万千行业创造生产力跃升契机


    王永东


    微软全球资深副总裁


    微软亚太研发集团主席


    微软（亚洲）互联网工程院院长


    作为GPT-4内测期的率先体验者和《GPT时代人类再腾飞》一书的先睹为快者，我很高兴能为本书的中文版作推荐序。


    快速迭代、渐趋成熟的AI大语言模型将重塑万千行业，这是贯穿全书的主旨之一，而在本书成书和转译的过程中，也充分诠释了新的AI技术对传统的书籍创作模式的“重塑”：《GPT时代人类再腾飞》由领英创始人、风险投资家、慈善家里德·霍夫曼先生与AI大语言模型GPT-4“联合”撰写而成。同时，中文版翻译的工作方式亦有别于“传统”，用译者的话来说就是“利用GPT-4来翻译一本介绍GPT-4的书”——过程中人工智能承担了大量基础性、重复性的任务，而译者则负责“校准”、优化、定稿等较为高端的工作。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '可以说，这本书本身就承载并反映了“GPT时代”各个行业智能进化后日常工作流程的缩影。它是对今后若干年间人与AI协同、互补式的工作场景及由此实现的全社会生产力跃升的奇妙未来的描摹与预示。


    即使是那些此前对AI大语言模型相关的知识和信息不甚了解的读者，在阅读本书时也大抵不会觉得内容艰深、令人费解，因为就像作者在解释自己的“思考框架”时所指明的：
    “这不必是一本详尽无遗的‘书’，而更像是一篇‘游记’，事关一趟非正式的勘探与发现之旅，由我（和GPT-4）在诸多道路中做出选择。”被“勘探与发现”的景观，则是浮现于所有人眼前的可能性——为人类的大脑配备AI“副驾驶”(Copilot)及辅助创意引擎，从而重塑既定模式、开辟崭新未来。最关键的是，这样的未来，举步可及。


    书中，作者援引了大量来源真实的人机交流记录，还有来自不同行业的重要人物的小故事，及他们对突然迎来垂直增长的AI大语言模型的看法——有相当乐观的，也有相对保守的——总体上，本书客观地探讨了GPT技术在教育、创意与文化、法律、新闻、社交媒体等多元领域的现实助力与潜在影响。


    值得注意的是，作为对人与AI协作进化、开创未来持较乐观立场的“硅谷人脉之王”“Paypal黑帮”关键成员，里德·霍夫曼并未回避GPT技术所伴生的模型准确性、可靠性问题及伦理、隐私、安全问题，并基于自身多年来对信息技术的深刻理解，给出了对应的解决思路。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '我很认同作者在面对GPT技术时所表现出的积极而审慎、务实而客观的态度。但另一方面，历史上每一项足以颠覆过往、塑造未来的新技术，诞生之初，几乎都会在一定周期内被淹没在各方人士对其潜在风险的质疑和争议中。不过，正如作者所强调的：“在一个没有进步的世界里，零风险才有可能实现。”而我们这些技术工作者的职责，不正是在坚定地推动科技进步的同时，努力平衡风险、消弭科技的副作用吗？


    正是立足于推动科技进步的初衷，2023年以来，微软公司在持续加速对全线业务的“AI再造”与GPT能力的分发和扩展。刚刚结束的微软年度Build开发者大会上，我们将整合了GPT“副驾驶”的AI辅助动力从Microsoft
    365和GitHub延展至Windows、新必应搜索引擎和Azure智能云端——在此之前，数据显示，集成在开发工具中的“副驾驶”能够从整体上优化开发者的工作流程、提升生产力。而这还仅仅是个开端。


    Build大会上，50多项新产品、新功能、新服务的发布，不仅提供了对《GPT时代人类再腾飞》一书所描摹的精彩场景的现实例证，还展示了与AI相乘之后，基础级、平台级、核心级产品和服务所蕴含的无穷焕新潜能，以及微软对于为万千行业创造生产力跃升契机，进而再一次重构全球用户工作方式与生活方式的强大信心。


    未来不远，举目可见。而每一位想要在“GPT时代”有所作为的读者，都应该能够从这本有趣的“游记”中收获到一些启示。'
