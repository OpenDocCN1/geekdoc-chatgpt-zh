    +   • 嘿，CNN，请告诉我今天有关政策制定的气候变化新闻。


    +   • 嘿，《纽约时报》，你能否仅使用档案库中的新闻文章作为来源，提出一个观点来反驳保罗·克鲁格曼（Paul Krugman）今天的专栏文章？


    +   • 嘿，《今日美国》，请给我找出教育专业人士感兴趣的今天的报道内容。'
