  md: '1. 无意义的。这种可能是问题最小的，因为它们很容易辨别。


    2. 看似合理实则错误的。这些可能是问题最大的，因为它们辨别起来可能相当困难，尤其是像GPT-4这样的大语言模型非常擅长以令人信服的权威口吻呈现信息。


    3. 大语言模型似乎具备了它实际上并不拥有的能力，比如自主意识或情感，或者（如微软的Sydney所述）声称它可以监控用户、订购比萨或执行语言预测软件等操作，而实际上它们根本无法完成。


    4. 故意和具有破坏性的幻觉。例如，用户可能会引导大语言模型生成虚假信息，并打算利用这些信息来误导、混淆或产生其他负面影响。


    显然，在所有这些不同形式的内容中，幻觉一直是新型大语言模型（如ChatGPT和微软的必应/Sydney）引发争议的主要话题。如今，当大语言模型的幻觉现象令人陌生且时常令人不安时，它们自然会引起大量关注。


    我认为，这在一定程度上是因为幻觉现象与我们对于高级AI的既定期望相矛盾。我们原以为会得到一个无所不知、逻辑极度完备且永远沉着冷静的自动化装置，结果却得到了一个仿佛是我们在Reddit上辩论时会偶尔遇到的、聪明但有时也令人生疑的家伙的模仿者。'
  merge: -1
  img_proc: true
- pgno: 180
  md: '然而，我必须指出，这种“幻觉”确实带来了新的潜在风险。一个自信的聊天机器人告诉人们如何启动汽车，可能比一个陈旧且静止的网页提供的相同信息更能激发他们采取行动。


    因此，人们的担忧并非没有道理。但在我们全面评估大语言模型的利弊时，我想补充以下几点：


    +   - 在某些情况下，“足够好的知识”带来的力量可能非常强大。

    +   - 在因为GPT-4这样的大语言模型产生的错误太多而决定不再容忍之前，我们应该尝试了解它们会犯多少错误以及我们在其他来源处已经接受了多少错误。

    +   - 在特定情境下，大语言模型生成非事实性信息的能力可能非常有用。（在人类身上，我们称之为“想象力”，这是我们最为珍视的品质之一。）


    # “足够好的知识”的深刻威力


    我们每天都被海量信息包围。很多信息都是在没有上下文的情况下出现的，其中许多内容非常复杂，部分信息是为了向世界提供信息、澄清，以及为了解读世界而做出的真正努力。而另一些则意在让我们购买商品，或者让我们充满怀疑、故意误导我们，抑或仅仅是为了分散我们的注意力。


    然而，确凿的真理（及基本确凿的真理）也同样存在。我相信，让人们能够轻松获取这些信息具有极大的价值。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '以维基百科为例。现在，仅维基百科的英文版本每月就可以从超过8.5亿台独立设备上获得超过100亿次的页面浏览量。尽管其中存在一定程度的错误，但可以肯定的是，我们已经学会了与之共存，并且现在经常依赖维基百科来认识和理解世界。


    在维基百科发布早期，它被大多数人视为一种不可靠的幻觉制造器，那它为何如今能如此成功？这或许可以从其创始人吉米·威尔士（Jimmy Wales）对于维基百科的看法中找到答案：“这里有足够好的知识，知识的好坏取决于你追求的目标。”


    这与我在书籍和播客中倡导的核心原则相呼应，我几乎总是将这一原则应用于我的投资、政治和慈善决策：对于产品的成功而言，良好的分发渠道远比优质的服务或产品的初始质量更为重要。没有分发，很少有人会有机会尝试你开发的产品。


    作为免费在线资源，维基百科比以前的其他百科全书（包括早期的电子百科全书，如微软百科全书）更易于获取。网络分发使维基百科摆脱了印刷和运输成本，这意味着它可以涵盖众多主题，以至于很快就让纸质出版物，如《大英百科全书》等相形见绌，甚至显得简陋。数字分发意味着维基百科可以即时、多次地发布、编辑和更新，将不准确性转变为一个相对容易纠正的问题。


    当然，当一个广泛分发的产品在内容质量上出现问题时，用户会迅速发现。这就是为什么一个优秀的分发策略也是一个'
  merge: -1
  img_proc: true
- pgno: 182
  md: '优秀的产品开发策略。正如我所说，如果你对产品的第一个版本感到满意，那么说明这个产品发布得太晚了。你的目标应该是尽快获得用户反馈。


    在一开始，很多人显然觉得维基百科中通过众包生成的“足够好的知识”足够实用，因此才会继续使用。反过来，高使用率也带来了更高的实用性，因为更多的反馈提升了维基百科的信息的质量。


    如今，作为美国最受欢迎的十大网站之一，维基百科分发的准确的信息量可能超过了任何新闻机构、百科全书、研究机构或其他可能合法声称准确率更高的信息出版商。无论其中有什么错误，维基百科分发的有益信息都远远超过了这些错误。


    这就是“足够好的知识的力量”。


    # 限制、规则……以及耐心


    简而言之，我觉得GPT-4和相关技术之间也存在着类似上述内容的关系。事实上，正如我在本书序言中所提及的（以及在稍后关于GPT-4与新闻业的章节中所提及的），我相信大语言模型具备回答比维基百科或其他任何来源更广泛的问题的能力，而且它们可以更快地回答这些问题。我还相信它们可以通过直观的界面使信息检索对广大用户而言变得高度便捷。


    这一切叠加在一起意味着什么？'
  merge: -1
  img_proc: true
- pgno: 183
  md: '由于大语言模型在知识广度、效率和易用性方面具有如此优势，尽管存在一定的“幻觉”现象，但我仍然相信它们生成的内容称得上“足够好的知识”。


    更重要的是，我对未来的发展充满信心，认为事情将朝着更好的方向发展。


    因此，当我们听到有人紧急呼吁像监管其他行业一样监管大语言模型时，我们应该记住，如今针对汽车和药品的监管措施并非一开始就是健全的。它们是根据多年的实际使用情况以及在相关可衡量的问题和负面结果的基础上制定的。


    当然，我并不是说我们应该等到现实生活中发生了足够多的与聊天机器人相关的悲剧后，才去制定有意义的AI安全监管规则。我只是觉得，我们现在还没有足够的信息和背景来确定需要制定哪些方面的监管规定。


    同时，我们亟须对大语言模型可能带来的问题和挑战进行定量的和更为系统性的研究。


    迄今为止，掌握有关大语言模型错误率的最佳数据的开发者发布的信息相当有限。根据他们发布的一些数据，AI发展图景相当令人鼓舞。例如，2022年1月，OpenAI发表了一篇关于ChatGPT的“姊妹”模型InstructGPT的论文，指出人类参与反馈的微调显著降低了模型的不良输出和“幻觉”现象。(27)


    而当问题真正出现时，公司通常有足够的动力去解决它们。'
