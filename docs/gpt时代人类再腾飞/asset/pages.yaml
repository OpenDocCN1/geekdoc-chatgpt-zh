    # 在美国K-12公共教育体系中的应用


    在这个阶段，质疑者可能会注意到，明茨教授为得克萨斯大学奥斯汀分校使用ChatGPT提出了“辩护”理由。这所大学是一个为即将步入职业生涯的学生服务的精英机构。但高中呢？高中是否应该采取针对大语言模型的“保护”措施？学校是否应将这项技术视为“作弊”手段，甚至完全禁止它，如同纽约市的公立学校最近针对整个K-12体系所采取的措施？


    霍夫曼：GPT-4，请概述纽约市教育局禁止使用ChatGPT这一决定的利弊。


    GPT-4：纽约市的学校禁止使用ChatGPT的决定，优点和弊端兼具。禁令的潜在优点包括：


    +   * 可以防止有恶意或不负责任的行动者滥用或误用ChatGPT。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - 可以保护学生和老师的隐私和自主权。


    +   - 可以保留教育中的人文和社会因素，如人际关系、文化多样性和道德价值观，这些可能会因为ChatGPT缺乏同理心、敏感度或背景知识的而被破坏或扭曲。


    可能的弊端包括：


    +   - 限制学生和老师利用ChatGPT作为珍贵且富有创新性的学习和教育资源的途径和机遇。


    +   - 阻碍ChatGPT作为一种有益且负责任的教育技术的发展和完善，而这原本可以通过学生和老师的反馈、参与及合作来实现。


    +   - 使纽约市教育系统及其利益相关者在面临21世纪全球和数字趋势挑战时处于孤立和劣势地位。


    霍夫曼：感谢你如此全面的总结。那么，可以说你认为这个禁令的弊大于利吗？


