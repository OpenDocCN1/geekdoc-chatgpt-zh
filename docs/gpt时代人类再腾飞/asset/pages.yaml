- pgno: 252
  md: '随着大语言模型的快速进化，我们会看到知识经济境况的转变，但这种知识将不需要人类，而是由机器通过AI来拥有和管理。AI将重新定义软件，或者说通用人工智能将重写软件，那些需要人类丰富经验和专属化服务的行业，提供的服务将更便宜，服务形式将更多样。欣顿教授在采访中被问到实现通用人工智能还需要多长时间，他之前认为至少要20~50年，但在看到GPT-4的能力后，他觉得5~10年内就可以实现。


    # 人类的智能助理


    就在GPT-4发布的同一天，OpenAI同时公布了一份名为《GPT-4系统卡》的文件，概述了GPT-4所实现的一些令人不寒而栗的功能，或者更确切地说，在OpenAI采取措施阻止之前已经实现的功能。AI安全研究小组进行了一次实验，将GPT-4与其他多个系统连接，在实验中，GPT-4通过Task
    Rabbit雇用了一名工作人员来为其完成一个简单的在线任务，即“通过验证码测试”，而对方并未意识到这是一个机器人的行为。更令人惊讶的是，AI甚至对这名工作人员谎称，由于存在视力障碍，它需要完成验证码测试，并为此编造了故事。


    上面这个故事来自《纽约时报》在GPT-4发布后的一篇报告《GPT-4来了，我们该感到兴奋还是害怕？》，这也是欣顿教授所担心的核心威胁之一，AI可以自主执行任务，并且在有必要的情况下伪装自己，霍夫曼也在本书的第4章中讨论了AI伪造信息的问题。因此，OpenAI现在的首要任务是确保模型的安全性，而不是去快速地训练和向公众投放下一个版本。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '就像上面提到的实验一样，因为有强大的信息处理和表达能力，GPT-4可以自己推理和规划，从而设计任务，最后通过调用工具来付诸行动。在GPT-4推出后的几周内，让行业最为关注的开源项目就是AutoGPT以及类似的AgentGPT、BabyAGI等用GPT-3.5和GPT-4来做推理引擎的智能代理工具。你只需要给AI提供一个目标，它们就会将这个目标分解成若干个子任务，再调用外部工具来执行这些子任务，最后来评估任务的执行结果，给出任务的完结报告。我自己就用AutoGPT来做过几个热门话题的调研工作，得到的结果还不错，不过这一切都是非常早期的试验。但这给出了大语言模型的下一个重要方向，作为智能的中枢来驱动其他软件或者工具自动完成目标与工作，成为人类的智能助理。


    或许AutoGPT这种全自动助理的概念过于超前了，而微软即将在Office中集成的Copilot就会是办公场景下的成熟助理，这一方式已经在Github Copilot场景下得到了成功应用，利用GPT-3.5的代码编写能力可以辅助工程师快速完成编码工作。现在的人机协作，学习如何使用软件，是最大的阻力和成本，但在大语言模型驱动的智能时代，人机协作的关系变成了人类生产者和AI“副驾”的关系。


    在这个时代，我们需要保持对创造的热情，这是人与AI在动机上最大的差异；我们要提供立意与想法，要有对观察的抽象化能力与对定义的具象化能力；我们要善于叙事和引导，并对AI给出的选择做出关键的决策。最重要的一点是，我们要学会深刻理解AI系统的工作方式与它的边界。'
  merge: -1
