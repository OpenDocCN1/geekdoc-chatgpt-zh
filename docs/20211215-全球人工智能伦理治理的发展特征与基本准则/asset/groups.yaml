    # 全球人工智能伦理治理的发展特征与基本准则


    内容提要：人工智能正通过日渐强大的自动决策能力越来越多地取代人类决策，相应的，人们对其引发的伦理道德问题越发担心。全球人工智能伦理治理尚处于起步阶段，但已就一些基本准则达成共识。本研究通过梳理全球
    2015-2020 年间出台的 118 份关于人工智能伦理治理的政策文件，探索全球人工智能伦理治理的发展特征和发展趋势。'
  - '[PAGE 1]


    # 一、全球人工智能伦理治理尚处于起步阶段


    人工智能以数据为驱动，通过自动决策技术影响和代替人类决策，逐渐对人类的伦理准则形成挑战。各国政府自 2015 年起纷纷将人工智能伦理治理纳入国家人工智能发展战略。美国将人工智能伦理治理列为《国家人工智能研究和发展战略规划》八大战略之一；欧盟委员会在《欧洲人工智能》中强调人工智能伦理治理是人工智能生态体系的重要组成部分；英国在《人工智能发展的计划、能力与志向》中提到要制定国家层面的人工智能治理准则；日本提出要构建有效且安全的“AI-Ready
    社会”。但总体来看，国际社会的人工智能伦理治理工作尚处于起步阶段。


    在学术研究领域，斯坦福大学以人为本智能研究所开展的统计分析发现，2015 年以来，在提交给国际知名的人工智能会议的论文中，包含“伦理”相关关键词的论文标题数量显著增加，但总数仍然不多（见图
    1）。从 2020 年开始，伦理议题才被大家更频繁地讨论。如神经信息处理系统（NeurIPS）会议（世界上最大的人工智能研讨会之一）在 2020 年首次要求研究人员提交文章的同时，也要提交“广泛影响性”声明。'
