    11 月 1 日正式生效的《个人信息保护法》，对个人信息的收集和使用进行了严格的规定，要求收集个人信息要“告知-同意”，且符合最小必要原则，并列举了用户的权益清单。


    ### （四）负责任 (Accountability)


    人工智能基于数据和算法形成判断并做出选择，具有自动性但不具有自主性，具有行动能力但不具有行动意识、思维能力。人工智能本质上仍是人类为了达成某种目标而制造的工具，其是否具有主体地位仍存在争论。围绕人工智能的责任问题，实质仍是创造它的人的责任问题。当前大多数的治理准则中建议利益相关者制定并实施人工智能治理计划，加深对责任主体的研究。


    ### （五）以人为本 (Human-Centric)


    以人为本是人与人工智能关系的根本原则。要求人工智能的主要目的是为人类服务，支持人类的目标，促进人类社会繁荣，增加人类社会的福祉。


    - 第一，要确保人类决策的自主权。虽然人工智能可以代替人做决策，但是最终人工智能需要受到人类控制。

    - 第二，人工智能的定位是补充人类尚不完美的行动能力，任何只注重效率而侵犯人类权利的技术都是违反伦理的，不宜提倡和鼓励。

    - 第三，人工智能应该对人类社会有帮助，并对人类社会的重大问题做出积极贡献。

    - 第四，人工智能的使用必须要符合人类社会的基本准则，即合法。需要保证开发和使用的合法性，遵循当地法律规范。


    ### （六）可持续发展 (Sustainability)


    新冠疫情的爆发让社会更加关注人与自然的关系，人工智能的发展也要为此服务。可持续发展要求企业在人工智能的部署过程中考虑对全球生态变化以及生物多样性的影响；在人工智能的设计过程中以提高能源使用效率，减少生态足迹为目的。


    ## 三、我国人工智能伦理治理准则已与国际社会全面接轨


    近年来，我国人工智能伦理治理体系不断完善。2017 年，国务院发布《新一代人工智能发展规划》，明确提出人工智能治理“三步走”的战略目标：2020 年部分领域的人工智能伦理规范和政策法规初步建立；2025
    年初步建立人工智能法律法规、伦理规范和政策体系；2030 年建成更加完善的人工智能法律法规、伦理规范和政策体系。国家新一代人工智能治理专业委员会于 2019
    年 6 月发布《新一代人工智能治理原则——发展负责任的人工智能》，提出人工智能治理的框架和行动指南，强调发展负责可信的人工智能八项治理原则：和谐友好、公平公正、包容共享、尊重隐私、安全可控、共担责任、开放协作、敏捷治理；后又于
    2021 年 9 月发布《新一代人工智能伦理规范》，深化治理原则，明确提出人工智能各类活动应遵循增进人类福祉、促进公平公正、保护隐私安全、确保可控可信、强化责任担当、提升伦理素养等六项基本伦理规范。整体来看我国的人工智能伦理准则已与国际社会全面接轨。


    美团一直非常重视人工智能伦理治理工作。今后，美团一方面会持续加大在科技创新方面的投入，另一方面也将积极与政府部门、行业组织、科研机构等社会各界一道，共同探讨和推进人工智能伦理治理工作，让人工智能技术更好服务经济社会发展。


    美团研究院 刘婉莹 厉基巍 赫建营

