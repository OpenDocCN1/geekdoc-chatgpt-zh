    - 不暗中操纵

    - 积极创造更多就业


    ### 安全可靠


    - 保护隐私

    - 对机器学习过程进行跟踪

    - 不产生物理伤害


    ### 负责任


    - 对技术、产品部署、运营负责

    - 制定和实施人工智能治理计划


    ### 以人为本


    - 确保人类决策主动权

    - 增强人的能力

    - 对人类社会有帮助

    - 合法


    ### 可持续发展


    - 构建和谐的人与自然的关系


