    ### 1.3.2 智能语音


    我们先来看一段对话，一名顾客正在电话预约美发服务。


    > **店员** 您好，有什么能帮您的吗？

    >

    > **顾客** 你好，我想为客户预约一个女士美发。日期是5月3日。

    >

    > **店员** 好的，请稍等。

    >

    > **顾客** 嗯。

    >

    > **店员** 请问您想预订哪个时间段呢？

    >

    > **顾客** 中午12点吧。

    >

    > **店员** 我们12点已经约满了，最近的时间是下午1点15分。

    >

    > **顾客** 那10点到12点呢？

    >

    > **店员** 这要看顾客想要什么服务了。她需要哪种服务呢？

    >

    > **顾客** 只要女士理发就行。

    >

    > **店员** 好的，10点就可以。

    >

    > **顾客** 她的名字是丽莎。

    >

    > **店员** 好的，那就和丽莎在5月3日上午10点见。

    >

    > **顾客** 没错，很好，辛苦了。

    >

    > **店员** 好的，祝您愉快，再见。


    这组对话中有一个是机器人，你能猜出到底谁是机器人，是店员还是顾客呢？


    其实这名“顾客”是一个“机器人”。你猜对了吗？这段对话来自2018年谷歌I/O大会现场演示视频，这个人工智能的名字叫做谷歌Duplex。这段对话听起来太神了，人类和人工智能的界限愈发模糊，人类店员和人工智能顾客的声音几乎没有差异——后者的语音语调非常精准，完全不机械化，它甚至会在回答问题之前加点语气词（“嗯”），就像真正的人类那样。


    在人机语音对话中，智能语音技术是必不可少的。智能语音技术包含语音识别技术与语音合成技术，前者将语音转成文字，后者将文字转为语音。智能语音技术赋予机器能听会说的本领。在日常生活中，我们使用语音输入法进行文字输入，使用手机导航时听到语音播报，这些都离不开智能语音技术。


    除了智能语音技术外，为了能让机器更好地理解人类的语言，说话更符合人类的说话方式，自然语言处理技术在其中起到了积极作用。自然语言处理技术与智能语音技术双剑合璧，使得人类与机器进行语音对话更为顺畅。


