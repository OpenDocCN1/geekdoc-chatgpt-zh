  trans: "\n# 1.1.3 Turing Test\n\nAlan Turing, a British mathematician, logician,\
    \ and cryptographer, is honored as the \"Father of Computer Science\" and \"Father\
    \ of Artificial Intelligence.\" The highest award in the computer field, the Turing\
    \ Award, is named after him.\n\nIn 1950, Turing proposed the famous Turing Test\
    \ and \"Machine Intelligence\" in his book *Computing Machinery and Intelligence*.\n\
    \nTuring believed that machines can think, but this requires machines to have\
    \ fast computing speeds, logic units and memory capacities exceeding those of\
    \ the human brain, as well as the programming of a large number of intelligent\
    \ programs, and the provision of appropriate categories and sufficient quantities\
    \ of data.\n\nHow can we judge whether a machine possessess leave the tester,\
    \ person C, unable to distinguish whether they came from person B or machine A,\
    \ then it can be considered that machine A possesses intelligence.\n\n![](img/txt001_5.jpg\
    \ \"pagenumber_ebook=16,pagenumber_book=5\")\n\n**Figure 1-4 Turing Test**\n\n\
    > **Experience Perception**\n>\n> Open WeChat, add the public account \"Xiaomi\
    \ Xiaoai\", select \"Wonderful Recommendations\" -> \"Chat with Xiaoai\", and\
    \ try chatting with Xiaoai.\n\nAt the \"2014 Turing Test\" conference held in\
    \ June 2014, the AI software Eugene Goostman successfully passed the Turing Test,\
    \ which is considered a landmark event in the field of artificial intelligence\
    \ and computer history.\n\n# 1.1.4 The First Year of Artificial Intelligence\n\
    \nTuring's \"Machine Intelligence\" can be said to be the earliest term for artificial\
    \ intelligence. So when was the term \"Artificial Intelligence\" proposed?\n\n\
    In August 1956, at Dartmouth College in Hanover, USA (Figure 1-5), a group of\
    \ scientists gathered to discuss the topic of using machines to imitate human\
    \ learning and other aspects of intelligence. This is the famous Dartmouth Conference.\n\
    \nThe Dartmouth Conference proposal covered a wide range of topics, including\
    \ automatic computers, using computer languages to process human language, neural\
    \ networks, etc. During the two-month-long conference, no general consensus was\
    \ reached. However, the most extraordinary achievement in the Dartmouth Conference\
    \ proposal was the coining of the term \"Artificial Intelligence.\" An unintentional\
    \ act bears unexpected fruit; the influence of this term is no longer limited\
    \ to the academic circle where it originated. For this reason, 1956 is also considered\
    \ the first year of artificial intelligence.\n\n![](img/txt001_6.jpg \"pagenumber_ebook=17,pagenumber_book=6\"\
    )\n\n**Figure 1-5 Dartmouth College**\n\n> **Knowledge Expansion**\n>\n> **Wu\
    \ Wenjun: Pioneer of Artificial Intelligence Research in China**\n>\n> Wu Wenjun\
    \ is a famous Chinese mathematician, academician of the Chinese Academy of Sciences,\
    \ recipient of the Chen JiaGeng Science Award, and the 2000 State Supreme Science\
    \ and Technology Award. In September 2019, he was awarded the national honorary\
    \ title of \"People's Scientist.\"\n>\n> Wu Wenjun's research covers many fields\
    \ of mathematics, with outstanding achievements particularly in topology and mathematical\
    \ mechanization, and major breakthroughs in the field of machine proof of geometric\
    \ theorems. He is a pioneer and trailblazer in the field of artificial intelligence\
    \ research in China.\n\n# 1.2 Tracing the Origins of Artificial Intelligence\n\
    \n## 1.2.1 Development of Artificial Intelligence\n\nThe 1956 Dartmouth Conference\
    \ established the name \"Artificial Intelligence.\" Tracing the timeline of AI\
    \ development, the path has not always been smooth; rather, it has experienced\
    \ several ups and downs.\n\n### First Wave of Artificial Intelligence (1950s–1980s)\n\
    \nAfter the Dartmouth Conference, AI developed rapidly. During this phase, the\
    \ emergence of the Perceptron enabled breakthroughs in machines achieving logical\
    \ reasoning.\n\nThe Shakey mobile robot (Figure 1-6) solved problems of perception,\
    \ motion planning, and control, enabling it to find targets and move them to specified\
    \ positions, achieving simple autonomous navigation. The Shakey mobile robot verified\
    \ many scientific conclusions belonging to the category of artificial intelligence.\n\
    \nELIZA is an AI program capable of conversing with humans (Figure 1-7). It does\
    \ not rely on speech but uses text to converse, based on dialogue rules and pattern\
    \ matching, providing corresponding responses according to keywords in human statements.\n\
    \nAs task difficulty and complexity continued to increase, machines could not\
    \ cope, and AI development hit a bottleneck.\n\n![](img/txt001_7.jpg \"pagenumber_ebook=18,pagenumber_book=7\"\
    )\n\n**Figure 1-6 Shakey Mobile Robot**\n\n![](img/txt001_8.jpg \"pagenumber_ebook=18,pagenumber_book=7\"\
    )\n\n**Figure 1-7 ELIZA**\n\n### Second Wave of Artificial Intelligence (1980s–Late\
    \ 1990s)\n\nThe emergence of expert systems drove the second peak of artificial\
    \ intelligence. An expert system is a system focused on specific domains, deriving\
    \ rules from specialized knowledge, simulating the problem-solving process of\
    \ experts, and utilizing knowledge to obtain satisfactory answers. For example,\
    \ in medicine, diagnosing specific patients to see if they have specific diseases\
    \ (Figure 1-8). Expert systems are often not general-purpose; they are developed\
    \ to solve specific problems or achieve specific goals.\n\n![](img/txt001_9.jpg\
    \ \"pagenumber_ebook=19,pagenumber_book=8\")\n\n**Figure 1-8 Expert System**\n\
    \nExpert systems had defects in knowledge acquisition and reasoning capabilities,\
    \ unable to perform complex thinking; application scenarios were very limited,\
    \ and costs were high. Thus, AI entered another trough period.\n\n> **Knowledge\
    \ Expansion**\n>\n> **The \"Mount Hua Duel\" of the Three Major Schools of Artificial\
    \ Intelligence**\n>\n> Artificial intelligence has developed for over 60 years,\
    \ giving rise to three major schools.\n>\n> - **Symbolism**: Main achievement\
    \ is symbolic reasoning. Uses symbolic representation to describe human cognitive\
    \ processes; widely applied in early AI development.\n> - **Connectionism**: Main\
    \ achievements are neural networks and deep learning. This school believes AI\
    \ originates from biomimicry; e.g., neural networks imitate neurons in the human\
    \ brain for information processing.\n> - **Behaviorism**: Main achievement is\
    \ reinforcement learning. This school advocates control, adaptation to evolutionary\
    \ computation, perceiving the environment to take action.\n>\n> **The \"Three\
    \ Games\" of Artificial Intelligence**\n>\n> AI development has three \"threes\"\
    : three waves, three schools, and the famous \"three games\". There have been\
    \ three major human-machine battles in AI development, involving Checkers, Chess,\
    \ and Go, known as the \"Three Games of AI\".\n>\n> - 1962: Arthur Samuel defeats\
    \ human Checkers champion.\n> - 1997: Deep Blue defeats human Chess champion.\n\
    > - 2017: AlphaGo defeats human Go champion.\n\n### Third Wave of Artificial Intelligence\
    \ (Early 21st Century to Present)\n\nUnder the escort of big data, algorithms,\
    \ and computing power, machine learning technology has developed, ushering in\
    \ the third AI boom. Machine learning has enabled breakthrough developments in\
    \ many application fields of AI.\n\nChina has also elevated the development of\
    \ artificial intelligence to a national strategic height. On March 5, 2017, Premier\
    \ Li Keqiang of the State Council proposed in the \"Government Work Report\" to\
    \ accelerate the cultivation and expansion of emerging industries including artificial\
    \ intelligence, and fully implement the development plan for strategic emerging\
    \ industries. This was the first time \"Artificial Intelligence\" was included\
    \ in the \"Government Work Report.\" In July 2017, the State Council issued the\
    \ \"New Generation Artificial Intelligence Development Plan,\" explicitly stating\
    \ the need to gradually carry out national intelligent education projects, set\
    \ up AI-related courses in primary and secondary schools, and gradually promote\
    \ programming education.\n\nOn November 15, 2017, the Ministry of Science and\
    \ Technology convened a launch meeting for the New Generation Artificial Intelligence\
    \ Development Plan and major science and technology projects in Beijing, simultaneously\
    \ announcing the first batch of National New Generation Artificial Intelligence\
    \ Open Innovation Platforms, marking the comprehensive launch and implementation\
    \ of the plan and major projects.\n\nThe \"New Generation Artificial Intelligence\
    \ Development Plan\" proposes a \"three-step\" strategy for China's development\
    \ of new generation AI.\n\n- **Step One**: By 2020, overall AI technology and\
    \ applications synchronize with world advanced levels; AI industry becomes a new\
    \ important economic growth point; AI technology applications become a new way\
    \ to improve people's livelihoods; strongly supporting entry into innovative nations\
    \ and achieving the goal of a moderately prosperous society.\n- **Step Two**:\
    \ By 2025, major breakthroughs in AI basic theory; some technologies and applications\
    \ reach world-leading levels; AI becomes the main driving force for China's industrial\
    \ upgrading and economic transformation; intelligent society construction makes\
    \ positive progress.\n- **Step Three**: By 2030, AI theory, technology, and applications\
    \ overall reach world-leading levels; becoming a major global AI innovation center;\
    \ intelligent economy and intelligent society achieve significant results; laying\
    \ important foundation for joining the forefront of innovative nations and becoming\
    \ an economic superpower.\n\n## 1.2.2 Three Elements of Artificial Intelligence\n\
    \nToday's AI development is inseparable from data, algorithms, and computing power;\
    \ therefore, data, algorithms, and computing power are called the three elements\
    \ of AI.\n\n### 1. Data\n\nOur lives are filled with various data. Taking the\
    \ subway leaves entry/exit information; borrowing books from the library leaves\
    \ borrowing records; studying at school leaves electronic growth archives (including\
    \ height, weight, class schedules, etc.). All the above information is data.\n\
    \n#### (1) Intelligent Push Based on Data\n\nIf you recently searched for \"Artificial\
    \ Intelligence\" via a search engine online, and browsed interesting pages from\
    \ the results, you would find the internet pushing AI-related information, news\
    \ software pushing AI news. Even when you open an online bookstore to buy books\
    \ (Figure 1-9), without searching for AI keywords, the bookstore guesses you want\
    \ AI books. The online bookstore achieves personalized precise push before you\
    \ \"speak,\" and behind this is data.\n\n![](img/txt001_10.jpg \"pagenumber_ebook=20,pagenumber_book=9\"\
    )\n\n**Figure 1-9 Intelligent Push**\n\n#### (2) Intelligent Evaluation Based\
    \ on Data\n\nRecently, Xiao Neng's math exam scores improved rapidly; classmates\
    \ came asking for his secret. Turns out he used an online learning evaluation\
    \ system. Taking math as an example, the system records time spent per question,\
    \ wrong answers, etc., then presents a radar chart of math learning (Figure 1-10),\
    \ analyzing weak areas.\n\nBased on data, the online evaluation system targets\
    \ Xiao Neng's weak spots for repeated practice, avoiding repetitive review of\
    \ mastered knowledge. Doing fewer but more precise problems, Xiao Neng not only\
    \ improved grades but also gained more time for desired activities.\n\n![](img/txt001_11.jpg\
    \ \"pagenumber_ebook=21,pagenumber_book=10\")\n\n**Figure 1-10 Intelligent Evaluation**\n\
    \n#### (3) Intelligent Navigation Based on Data\n\nWhen searching routes via navigation,\
    \ we often see many routes offered, with an intelligent recommendation. This recommendation\
    \ is often based on real-time bus data analysis. Recommended routes offer options:\
    \ shortest time, fewest transfers, least walking, subway priority, no subway,\
    \ meeting personalized needs.\n\n> **Experience Perception**\n>\n> Open the navigation\
    \ app on your phone, search for routes from \"Shanghai Youth Activity Center\"\
    \ to \"Shanghai Library\" using \"Driving\" and \"Public Transit\" modes (Figure\
    \ 1-11).\n\n![](img/txt001_12.jpg \"pagenumber_ebook=21,pagenumber_book=10\")\n\
    \n**Figure 1-11 Intelligent Navigation**\n\nIf choosing no subway, navigation\
    \ tells which bus to take and how long until it arrives at the nearest station.\
    \ Drivers like navigation even more, allowing real-time traffic awareness, avoiding\
    \ congested roads.\n\nData-based applications don't stop here. In many aspects,\
    \ judgments can be made based on data.\n\nCurrently, data is growing explosively;\
    \ hence this era is also called the Big Data era.\n\nOn the internet, a \"story\"\
    \ about big data once circulated.\n\n> **Customer Service**　XX Wonton Shop. Hello,\
    \ how may I serve you?\n> **Customer**　Hello, I want...\n> **Customer Service**　Sir,\
    \ please tell me your membership card number first.\n> **Customer**　1982XXX.\n\
    > **Customer Service**　Mr. Chen, hello! You live at Room XX, Floor XX, XX Road,\
    \ XX. Your home phone is 6353XXXX, your mobile is 1390123XXXX. What can I help\
    \ you with?\n> **Customer**\tWhy do you know so much about me?\n> **Customer Service**\t\
    Mr. Chen, because we are connected to the XXX system.\n> **Customer**\tI want\
    \ three bowls of fresh meat large wontons...\n> **Customer Service**\tMr. Chen,\
    \ fresh meat large wontons are not suitable for you.\n> **Customer**\tWhy?\n>\
    \ **Customer Service**\tAccording to your medical records, your blood pressure\
    \ and cholesterol are both high.\n> **Customer**\tThen what do you recommend?\n\
    > **Customer Service**\tYou can try our low-fat healthy vegetarian wontons.\n\
    > **Customer**\tHow do you know I'd like that?\n> **Customer Service**\tLast Monday\
    \ you borrowed \"Low-Fat Healthy Recipes\" from the library.\n> **Customer**\t\
    Okay. Then three bowls of vegetarian wontons, how much total?\n> **Customer Service**\t\
    33 yuan total. But your mother should eat less; she had heart bypass surgery last\
    \ month, still in recovery.\n> **Customer**\tCan I pay by card?\n> **Customer\
    \ Service**\tMr. Chen, sorry. Please pay cash, your credit card is maxed out,\
    \ you owe the bank 2986 yuan, not including mortgage.\n> **Customer**\tThen I'll\
    \ go to the nearby ATM.\n> **Customer Service**\tMr. Chen, according to records,\
    \ you've exceeded today's withdrawal limit.\n> **Customer**\tForget it, deliver\
    \ to my home, cash there. How long?\n> **Customer Service**\tAbout 30 minutes.\
    \ If you don't want to wait, drive yourself.\n> **Customer**\tWhy?\n> **Customer\
    \ Service**\tAccording to our XXX system's vehicle tracking records. You have\
    \ a car registered \"Hu A XXXXX\", and you are currently driving it on XX Road.\
    \ Friendly reminder: don't hold phone while driving, suggest Bluetooth headset\
    \ or car phone system.\n> Customer stares in shock……\n\n> **Knowledge Expansion**\n\
    >\n> **Big Data**\n>\n> Big data is a collection of data whose scale is so large\
    \ that it greatly exceeds the capabilities of traditional database software tools\
    \ in acquisition, storage, management, and analysis. Big data has four characteristics:\
    \ massive data scale, fast data flow, diverse data types, low value density.\n\
    \n> **Think and Explore**\n>\n> Talk about what examples of personalized services\
    \ based on data exist around you.\n\n### 2. Algorithm\n\nAn algorithm is a method\
    \ for solving problems and achieving goals. It can be understood as: to solve\
    \ a problem, first think how to do it, what method to use, then take action to\
    \ solve it.\n\nGrandpa Deng Xiaoping once said: \"Regardless of black cat or white\
    \ cat, the cat that catches mice is a good cat.\" Solving the same problem, of\
    \ course, can use different algorithms.\n\nTeachers assigned Chinese, Math, English,\
    \ Science homework.\n\n- Xiao A chooses based on preference: Chinese first, then\
    \ Math, then Science, finally English.\n- Xiao B chooses based on difficulty:\
    \ Science first, then Chinese, then English, finally Math.\n\n![](img/txt001_13.jpg\
    \ \"pagenumber_ebook=23,pagenumber_book=12\")\n\n**Figure 1-12 Students Complete\
    \ Four Subjects in Different Orders**\n\n- Xiao C estimates time per subject,\
    \ decides to do shortest to longest: Science, English, Math, Chinese.\n- Xiao\
    \ D doesn't think much, grabs whatever from bag: Math, English, Chinese, Science.\n\
    \nAlthough their order differs, all four finished the teacher's homework (Figure\
    \ 1-12).\n\n> **Think and Explore**\n>\n> Solving the same problem can have many\
    \ different algorithms; then which one to choose?\n\n![](img/txt001_14.jpg \"\
    pagenumber_ebook=24,pagenumber_book=13\")\n\n**Figure 1-13 Random Selection Optimization\
    \ Problem**\n\n> **Knowledge Expansion**\n>\n> **The Cornfield Story**\n>\n> A\
    \ cornfield, need to pick the largest corn (Figure 1-13). But only one pick allowed,\
    \ and cannot turn back.\n>\n> - **Xiao A's method**: Enters field, sees many large\
    \ corns. Quickly picks first large corn seen, walks on, increasingly disappointed\
    \ to find many larger corns ahead.\n> - **Xiao B's method**: Enters field, sees\
    \ many large corns. Learns from A—there must be larger ahead. Walks on until almost\
    \ out of field, realizes none larger than previous, cannot turn back, picks largest\
    \ nearby.\n>\n> Xiao A's algorithm, due to incomplete observation, leads to \"\
    regret\"; Xiao B's algorithm, though observation thorough, leads to \"missing\
    \ out\". So what would you do?\n>\n> Mathematician Euler gives an important number:\
    \ 37%.\n>\n> For the problem of selecting the largest corn, scientists propose\
    \ this algorithm:\n>\n> Divide field into two phases, first 37% is phase one.\
    \ In this phase, only look, don't pick. Observe carefully the largest corn in\
    \ this phase, remember its size. After 37%, enter phase two. From here, once encountering\
    \ a corn larger than the largest in phase one, or similar, pick it without hesitation.\n\
    >\n> The \"two-phase\" strategy and \"37%\" number were derived by Euler. This\
    \ is actually a random selection optimization problem. This method is called \"\
    37% Rule\".\n>\n> This algorithm may not guarantee picking the absolute largest\
    \ corn. Corn sizes appear randomly. Under such randomness, it is an optimal algorithm\
    \ for picking sufficiently large corn. It reduces probability of \"regret\" and\
    \ \"missing out\".\n>\n> Although many algorithms solve a problem, usually the\
    \ best is chosen, i.e., optimal algorithm.\n>\n> Generally, algorithms have these\
    \ properties:\n>\n> - **Finiteness**: Algorithm must terminate after finite steps.\n\
    > - **Definiteness**: Each step must have exact meaning.\n> - **Effectiveness**:\
    \ Each step must be actually doable, within finite time.\n>\n> An algorithm has\
    \ zero or more inputs, representing initial conditions. Zero input means algorithm\
    \ defines initial conditions itself.\n>\n> An algorithm has one or more outputs,\
    \ reflecting results after processing input. Algorithm without output is meaningless.\n\
    >\n> Machine learning, face recognition, etc., are all based on algorithms. New\
    \ algorithms constantly proposed, giving AI more possibilities.\n\n### 3. Computing\
    \ Power\n\nComputing power usually represents a computer's computational capability.\
    \ Enhancing computing power is a systems engineering project, involving not only\
    \ all hardware components such as chips, memory, hard drives, but also optimizing\
    \ computing architecture, resource management and allocation according to the\
    \ actual environment of data type applications.\n\nImagine if you have this experience:\
    \ when a computer handles a complex task (e.g., video editing), it suddenly freezes\
    \ or crashes; this can be considered insufficient computing power. Of course,\
    \ not all crashes are due to insufficient computing power.\n\nThe first modern\
    \ electronic computer \"ENIAC\" could perform 5000 additions per second. Today,\
    \ the birth of supercomputers has greatly increased computing power.\n\nCurrently,\
    \ supercomputers are primarily measured in FLOPS (Floating Point Operations Per\
    \ Second). Worth mentioning is China's \"Sunway TaihuLight\" (Table 1-1), peak\
    \ performance 125.436 PFlops, ranked 4th worldwide; sustained performance 93.015\
    \ PFlops, ranked 1st; performance-per-watt 6051 MFlops/W, ranked 1st.\n\n**Table\
    \ 1-1 Top 5 Global Supercomputers Top500 Ranking June 2020**\n\n"
