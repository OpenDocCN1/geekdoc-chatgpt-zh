- raw: '进入21世纪，得益于互联网兴起和数码相机出现后带来的海量数据，加之机器学习方法的广泛应用，计算机视觉发展迅速。以往许多基于规则的处理方式，都被机器学习所替代。机器自动从海量数据中总结归纳物体的特征，然后进行识别和判断。这一阶段涌现出了非常多的应用，包括典型的相机人脸检测、安防人脸识别、车牌识别等。


    2010年以后，借助于深度学习的力量，计算机视觉技术得到了爆发式增长并形成产业化，出现了神经网络图像识别，这就是目前比较新的一种图像识别技术。深度学习技术在计算机视觉技术的发展上，特别是物体视觉领域，体现出非常大的优势。


    到今天，计算机视觉技术已经可以利用“看”到的信息完成多种任务。展望未来，计算机视觉技术有可能实现让计算机像人那样通过视觉来观察和理解世界。


    ![](images/txt003_7.jpg "pagenumber_ebook=68,pagenumber_book=57")


    图3-5　制造机器人


    3.1.3　计算机视觉技术更大范围的应用


    前面我们了解了计算机视觉技术的应用，以及计算机视觉技术的发展简史，接下来我们将了解计算机视觉技术在更大范围、更高级别的应用，如在工业制造、医疗、农业、军事、安防监控、自动驾驶等领域的应用。


    1.计算机视觉与工业制造


    2015年5月，国务院总理李克强签批《中国制造2025》。这是部署全面推进实施制造强国的战略文件，是中国实施制造强国战略第一个十年的行动纲领。在工业制造中，离不开工业机器人的使用。工业机器人系统中视觉感知技术是工业机器人感知的一个重要方面（图3-5）。视觉系统采集视觉信息，用于控制调整机器人的位置和姿态。视觉系统还在质量检测、识别工件、食品分拣、包装各个方面得到了广泛应用。


    2.计算机视觉与医疗


    我国腾讯公司旗下腾讯觅影是将人工智能技术运用在医学领域的产品。腾讯觅影汇集多个顶尖人工智能团队的力量，把图像识别、深度学习等技术与医学应用跨界融合。


    早期的各项医疗检查都是人工读片，费时费力，还容易误判。现在的智慧医疗基于计算机视觉技术的发展有了极大的进步（图3-6）。它的原理是这样的：提供海量的有癌细胞和正常细胞的两类图片，无需勾画所有癌细胞和正常细胞的边界，计算机视觉技术就能识别这两类图片的特征，通过机器学习的方式加以识别，极大地提高了读片的准确率。


    ![](images/txt003_8.jpg "pagenumber_ebook=69,pagenumber_book=58")


    图3-6　医学细胞检测


    据新闻报道，曾经有机构对某医院上传的30名患者近9 000张肺结节CT影像进行智能检测和识别，将第一轮筛查出的疑似结节标记出来，作为辅助诊断结果，提供给4名放射科医生进行审查。人机合作诊断肺结节的全过程仅用了30分钟，比传统途径所需的150～180分钟，效率有了很大提升。经现场4位三级甲等医院放射科医生采用双盲方法进行验证，智能诊断的综合准确率达到90%以上。


    3.计算机视觉与农业


    人们已经利用视觉识别技术对农作物和杂草进行智能识别，实现智能喷雾，还可以用太阳能电池板，摄像机，温度、湿度、光线传感器，以及大数据云来收集、记录、处理农业数据，进行农作物产量预测、农作物病害监测等（图3-7）。在我国黑龙江等地区已经开展基于北斗卫星的室外监测系统和智能手机终端等新技术用于农业监测、气象灾害预警等服务。


    4.计算机视觉与军事


    计算机视觉在军事上可以运用于导弹和无人机等项目（图3-8）。比如我国自主研发的“长剑-10”巡航导弹可以贴地或贴海平面飞行，它的飞行高度很低，能够躲避大多数雷达的监视，安全地到达它的作战区域。导弹在飞到目的地附近时，会做出一个眼镜蛇式的抬头动作，俯视它的目标在哪里，然后再低头直奔目标。


    ![](images/txt003_9.jpg "pagenumber_ebook=69,pagenumber_book=58")


    图3-7　智慧农业


    ![](images/txt003_10.jpg "pagenumber_ebook=69,pagenumber_book=58")


    图3-8　巡航导弹


    ![](images/txt003_11.jpg "pagenumber_ebook=70,pagenumber_book=59")


    图3-9　人脸扫描


    ![](images/txt003_12.jpg "pagenumber_ebook=70,pagenumber_book=59")


    图3-10　虹膜扫描


    ![](images/txt003_13.jpg "pagenumber_ebook=70,pagenumber_book=59")


    图3-11　指纹扫描


    5.计算机视觉与安防监控


    近年来，基于生物特征的鉴别技术得到了广泛重视，主要集中在对人脸（图3-9）、虹膜（图3-10）、指纹（图3-11）、声音等特征上，其中大部分都与视觉信息有关。


    以查找犯罪嫌疑人为例，传统的用人工方式从海量影像数据资料中筛选对象的方法有如大海捞针，工作量巨大，而且容易遗漏。智能安防技术则是通过计算机视觉和深度学习的方式，让计算机分析资料中的个人特征，然后根据犯罪嫌疑人的特征自动筛选，快速准确地识别出个体人物的各种重要特征，如性别、年龄、发型、衣着、体型、是否戴眼镜、是否骑车以及随身携带的物品等，从大量监控影像中自动识别出嫌疑人，不仅节省人力物力，同时也大大缩短了破案时间。


    6.计算机视觉与自动驾驶


    随着大数据、物联网、5G等技术在汽车领域的不断普及和推广，自动驾驶技术（图3-12）也开始为人们所熟知。


    ![](images/txt003_14.jpg "pagenumber_ebook=70,pagenumber_book=59")


    图3-12　自动驾驶


    自动驾驶汽车又称无人驾驶汽车，是一种通过计算机系统实现无人驾驶的智能汽车。自动驾驶汽车依靠计算机视觉等人工智能系统协同合作，让计算机可以在没有人主动操作的情况下，自动安全地操作机动车辆。2019年8月30日，由百度和一汽联手打造的中国首批量产L4级自动驾驶乘用车——红旗EV，获得5张北京市自动驾驶道路测试牌照。


    以上列举了计算机视觉技术的主要应用场景，那么计算机究竟是如何实现计算机视觉的，计算机视觉的原理又是什么呢？


    思考探索


    想一想下面哪些应用了计算机视觉技术（图3-13—图3-15）？


    ![](images/txt003_15.jpg "pagenumber_ebook=71,pagenumber_book=60")


    图3-13　人脸识别解锁手机


    ![](images/txt003_16.jpg "pagenumber_ebook=71,pagenumber_book=60")


    图3-14　用图像处理软件调整图片


    ![](images/txt003_17.jpg "pagenumber_ebook=71,pagenumber_book=60")


    图3-15　百度图片中的以图搜图


    体验感知


    1.请打开手机，试着用有美颜功能的App拍照，看一看用它拍摄的照片，在皮肤、脸型等方面有了什么样的变化。


    2.请打开手机，试着使用百度App的“识万物”功能（图3-16），看看它能识别出什么。


    ![](images/txt003_18.jpg "pagenumber_ebook=71,pagenumber_book=60")


    图3-16　百度App“识万物”


    3.2　图像识别


    图像识别是指利用计算机对图像进行处理、分析和理解，以识别各种不同模式的目标和对象的技术，是应用机器学习算法的一种实践应用。现阶段图像识别技术从识别对象上一般分为人脸识别与物品识别。人脸识别主要运用在安全检查、身份核验与移动支付等场景中；物品识别主要运用在物品流通等场景中，特别是无人货架、智能零售柜等。


    一般来说，图像识别的流程包括图像预处理、特征提取、图像分类三个步骤（图3-17），我们根据这个流程来了解计算机视觉技术是如何识别图像的。


    ![](images/txt003_19.jpg "pagenumber_ebook=72,pagenumber_book=61")


    图3-17　图像识别的流程


    3.2.1　图像预处理


    在第2章中我们知道，人能区分不同的动物是因为之前看见过，并记住了它们的不同特征；同样地，计算机能够正确区分狗和猫，也是因为之前看过并记住了它们的不同特征。


    在计算机进行图像识别时，图像质量的好坏直接影响识别算法的设计与识别效果的精度，但是在图像采集的过程中，成像角度、透视关系乃至镜头自身原因都会产生图像的误差，因此在图像识别的初始阶段，我们需要对图片进行预处理。


    图像预处理的主要目的是消除图像中的误差，恢复有用信息，从而改进特征提取、图像分类的可靠性，帮助计算机更准确地理解图片。一般的图像预处理有以下几种方法。


    1.灰度校正


    我们把图片上每一个不可分割的单位（或者说是最小的元素）称为像素。“灰度”一词原是黑白摄影的术语，是指根据景物各点颜色及亮度不同，摄制成的黑白照片（或黑白图像）上的各像素点呈现出的不同深度的灰色（图3-18，图3-19）。


    ![](images/txt003_20.jpg "pagenumber_ebook=73,pagenumber_book=62")


    图3-18　原图


    ![](images/txt003_21.jpg "pagenumber_ebook=73,pagenumber_book=62")


    图3-19　灰度校正后


    ![](images/txt003_22.jpg "pagenumber_ebook=73,pagenumber_book=62")


    图3-20　几何变换后


    2.几何变换


    图像几何变换又称为图像空间变换，是指通过平移、转置、镜像、旋转、缩放等方法对采集的图像进行处理（图3-19，图3-20）。


    采用以上这些方法，可以比较好地纠正图像采集中图像太暗、图像太亮、有噪声点、对比度不明显、成像角度等问题。


    体验感知


    请使用图像处理软件，尝试对图片的亮度、对比度等进行调整，旋转、翻转、裁剪图片，体验手动处理图像。


    3.2.2　特征提取


    特征，顾名思义是某一事物不同于其他事物的特点。人脑之所以能区分事物的不同，主要是因为能提炼出事物之间的异同点。比如鸭有脚蹼，鸡没有；鸭喙与鸡喙形状不同；鸭走路是左右摇摆的，鸡不是。人脑能够提取到以上这些特征。再比如，虽然狗和猫都覆盖着毛发，但人脑能够利用某些特征来正确区分狗和猫，比如犬类比猫类有更突出的吻部，同等体型猫类的嘴比犬类的嘴可以张开更大的角度等。


    计算机视觉技术是如何模仿人脑来提取事物的特征呢？我们以图3-21为例说明这个问题。


    计算机为了抓取狗的特征，首先将相应的图像转化为黑白渐进的灰度图，再把整张图片分割成小格，接下来统计每个方格图像内线条方向的分布规律，也就是沿垂直或者水平方向计算出像素变化的程度（梯度；图3-22）。然后使用一定的算法将垂直和水平方向的梯度归一成只保留必要信息的图像，最终将原始图像处理成如图3-23所示的样子。


    ![](images/txt003_23.jpg "pagenumber_ebook=74,pagenumber_book=63")


    图3-21　原图


    ![](images/txt003_24.jpg "pagenumber_ebook=74,pagenumber_book=63")


    图3-22　梯度变化示意图


    ![](images/txt003_25.jpg "pagenumber_ebook=74,pagenumber_book=63")


    图3-23　方向梯度直方图


    我们能很明显地看出这只狗的轮廓，并且保留了狗较长的吻部、较大且直立的耳朵等特征信息。这类特征也需要与图像的位置对齐，比如狗嘴和耳朵出现在图中适当的位置时，才可以对狗进行较为准确的识别，而当它处于非常少见的姿态时，比如把吻部埋在身体和两只前爪里，这样的特征可能就无效了，需要利用更复杂的特征或者更优化的算法才能进行更好的识别。


    以上的图像特征提取方法名叫作方向梯度直方图（Histogram of Oriented Gradient，HOG），是比较常见的一种基于图像处理技术的传统图像特征提取算法。图像特征提取的方法还有很多，比如基于颜色特征的特征识别方法、基于几何特征的特征识别方法等。


    知识拓展


    直方图


    直方图（Histogram）是一种统计报告图，由一系列高度不等的纵向条纹或线段表示数据分布的情况。一般用横轴表示数据类型，纵轴表示分布情况。


    直方图是表示数据变化情况的一种工具。用直方图可以解析出数据的规律，比较直观地看出对象所有数据的分布状态，对于数据分布状况一目了然，便于判断其总体数据的分布情况。


    比如对于图3-24，使用图像处理软件查看直方图（图3-25），能够很直观地看出图片在明度（亮度）、红、绿、蓝通道的图像数据分布情况。


    ![](images/txt003_26.jpg "pagenumber_ebook=75,pagenumber_book=64")


    图3-24　原图


    ![](images/txt003_27.jpg "pagenumber_ebook=75,pagenumber_book=64")


    图3-25　直方图


    3.2.3　图像分类


    俗话说，一张图片胜过千言万语。我们不断地攫取图片上的视觉内容，解释它的含义，并且把它们存储在大脑中以备后用。但对于计算机来说，要解释一张图片的内容其实是很难的，它对图像传递的思想、知识和意义一无所知。


    所以为了让计算机理解图像的内容，我们必须应用图像分类的技术，这是使用计算机视觉以及机器学习算法从图像中抽取意义的任务。这个操作可以简单地理解成为一张图像分配一个标签，如猫、狗或是大象，甚至可以解释图像的内容并且返回一个人类可读的句子。


    图像分类的依据是提取的图像特征，接下来我们使用图像分类的算法对图像进行识别。举个例子，我们准备了一大堆猫和狗的图片，然后用这些图片训练一个分类器模型。


    红色符号代表狗，蓝色符号代表猫，横坐标轴表示脸型接近圆形的程度，纵坐标轴表示毛发的长度。根据这个两维坐标，这堆猫和狗的图片被分布成如图3-26所示。


    很显然，如果我们要把代表狗的红色符号与代表猫的蓝色符号分开，只要在中间加条直线就可以了。就像图3-27这样，用一条直线把平面一切为二，两边分属不同的两类。这种分类器其实就是第2章中学习过的单层感知机。


    ![](images/txt003_28.jpg "pagenumber_ebook=76,pagenumber_book=65")


    图3-26　猫和狗的分布图1


    ![](images/txt003_29.jpg "pagenumber_ebook=76,pagenumber_book=65")


    图3-27　切分猫和狗的分布图1


    ![](images/txt003_30.jpg "pagenumber_ebook=76,pagenumber_book=65")


    图3-28　猫和狗的分布图2


    ![](images/txt003_31.jpg "pagenumber_ebook=76,pagenumber_book=65")


    图3-29　切分猫和狗的分布图2


    但是如果这堆猫和狗的图片分布是像图3-28这样的，又该怎么办呢？


    当样本的复杂程度增加的时候，单层感知机只能“切一刀”的缺点就会暴露无遗。这时可以使用多层感知机，也就是多层人工神经网络。其中底层神经元的输出是高层神经元的输入，也就形成了人工神经网络中间的隐藏层。回到图3-28中，我们可以先在上下之间横着切一刀（图3-29中的黄线），接着左右之间竖着切一刀（图3-29中的绿线），然后把左上和右下的部分合在一起，与右上和左下的部分区分开。


    其实刚才每“切一刀”，就是使用了一个人工神经网络中的神经元，在图3-29的这个例子中，单层神经网络无法根据这些特征区分这堆图片，但是多层神经网络就能正确地对其进行分类。只要能切合适的次数，再把切出的结果有机组合，那么无论遇到什么样的样本数据分布，人工神经网络都能够进行有效的区分。


    到这里，我们成功完成了这堆猫和狗的图片分类。


    知识拓展


    验证码背后的秘密


    只要上过互联网的人，都知道验证码是什么。这些年来，验证码的形式也越来越花哨。没有一些知识储备，可能连验证码都要看不懂了（图3-30）。有的验证码还要考验操作鼠标的熟练度，如果动作慢了还不行。


    验证码的用处可以用一句话来解释：区分想登录的是计算机还是真正的人。


    验证码英文全称CAPTCHA ，它是 Completely Automated Public Turing test to tell Computers and
    Humans Apart 这个超长词组的缩写，直接翻译过来的意思就是“全自动区分计算机和人类的图灵测试”。


    当互联网的浪潮刚刚在全世界掀起时，最让大伙苦恼的一件事就是垃圾邮件太多了，有人还特意写了程序，整天大量注册新邮箱账号用来发送垃圾推广邮件。用户邮箱中的重要邮件常常被大量垃圾邮件所淹没，还浪费了大量的资源。互联网公司和网民饱受其苦。这时有一位程序员就想到了一个好办法。人类可以轻松地看懂手写的文本，但计算机程序很难认清。所以，可以在注册账号的时候设一道门槛，必须输入给出的歪歪扭扭的文本才能完成注册，用来识别计算机和真人。从此，验证码就诞生了。


    ![](images/txt003_32.jpg "pagenumber_ebook=77,pagenumber_book=66")


    图3-30　知识问答式验证码


    ![](images/txt003_33.jpg "pagenumber_ebook=77,pagenumber_book=66")


    图3-31　街景类验证码


    或许有人会说：每次登录都要输入验证码，浪费了我们大量的时间！说起来你可能不信，实际上你每次输入验证码的时间并没有被浪费，反而每一次输入验证码都可能是为人工智能的发展做出了贡献。这又是为什么呢？因为我们输入的验证码，很有可能成为人工智能训练的数据集。大家肯定遇到过街景类验证码（图3-31）。在你费眼又费脑地区分验证码中的小轿车、路牌或自行车等内容时，你其实是在为人工智能免费打标签！其中的一部分图片是人工智能已经识别出来的，但是还夹杂了几张人工智能难以识别的街景。换句话说，这些数据最终将会用于训练图像识别的分类器。现在你明白为什么有时输入验证码有可能是为人工智能发展做贡献了吗？


