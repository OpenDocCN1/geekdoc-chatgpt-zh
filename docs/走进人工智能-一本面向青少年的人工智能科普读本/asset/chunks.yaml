    # Chapter 2: The Learning AI


    ## Introduction


    ![](img/txt002_1.jpg "pagenumber_ebook=34,pagenumber_book=23")


    Learning is an important way for humans to acquire knowledge. Machine learning
    means AI can learn like humans; it is an exciting technology in AI development.
    This chapter introduces the basics of machine learning, types of machine learning,
    the development of machine learning, and deep learning.


    ![](img/txt002_2.jpg "pagenumber_ebook=34,pagenumber_book=23")


    ## 2.1 Understanding Machine Learning


    ### 2.1.1 Machine Learning Around Us


    In 2016, a human-computer Go match saw AlphaGo defeat world Go champion Lee Sedol
    with a total score of 4:1. This caused a sensation; everyone asked: What is AlphaGo?
    How did it do it? Soon the answer came: the core technology of AlphaGo is machine
    learning (Figure 2-1).


    The idea of machine learning is actually not complex; it simulates the human learning
    process in life. Machine learning relies on data—data being various combinations
    of symbols carrying information. Data is not just numbers in the narrow sense;
    it can also be text, symbols, images, videos, audio, etc.


    Data is generated anytime, anywhere. For example, various information posted on
    social platforms, purchase records and reviews on shopping platforms—all are data.
    Once generated, this data is collected, processed, and refined, transforming into
    new data available for computation, analysis, and use.


    ![](img/txt002_3.jpg "pagenumber_ebook=35,pagenumber_book=24")

    Figure 2-1　What is Machine Learning


    > "Even a clever housewife cannot cook without rice." Machine learning requires
    a large amount of data as a foundation.


