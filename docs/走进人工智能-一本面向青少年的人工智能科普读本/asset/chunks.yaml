- raw: "2.请使用图形化编程软件，加载语音合成模块，编写相应的程序，看看能不能朗读出你所输入的信息。\n\n\uFEFF\n\n第5章　人工智能伦理\n\n\
    ![](images/txt005_1.jpg \"pagenumber_ebook=116,pagenumber_book=105\")\n\n导　言\n\
    \n人工智能时代，图像识别、语音识别、无人驾驶、智能机器人等技术已来到人们的生活中。在带来便利的同时，也产生了个人隐私泄露、价值判断模糊、责任义务缺失等问题。人工智能在数据、算法和应用层面存在着伦理风险，我们需要加强应对人工智能应用的风险研判和防范，综合运用技术创新、伦理规范、法律制度等手段方式，实现人机和谐共处。\n\
    \n![](images/txt005_2.jpg \"pagenumber_ebook=116,pagenumber_book=105\")\n\n5.1　数据与隐私\n\
    \n5.1.1　数据时代的便利与挑战\n\n人工智能越是“智能”，就越需要获取更多的个人数据信息。今天我们经常要使用手机，在淘宝上购物、发微信朋友圈照片、刷一下抖音小视频，同时也在无时无刻地生产数据，个人的通讯信息、位置信息、身体的各类生物信息被源源不断地收集，储存在网络空间上。\n\
    \n作为不同应用的用户，我们一切行为都是可被记录在案、可分析、可追溯的，这些个人信息应不应该被保存，该被保存在哪里，在数据处理传输的过程中是否安全，采集这些数据后如何去管理使用它，这是都是数字化社会面临的问题。例如发生了棱镜门、脸书用户数据泄露等事件。\n\
    \n我国《民法典》将个人信息分为“私密信息”和“非私密信息”。其中，私密信息既属于个人信息，也属于隐私信息。如个人的健康信息、身份证件号码、个人生物识别信息、银行账号等。但是，自然人的姓名、性别等，则不属于私密信息。如在公司招聘面试时就需要提供这些个人信息，姓名本来就是社会交往中使用的（图5-1）。\n\
    \n智能时代，数据已经成为新型生产要素。个人的非敏感信息需要被共享和合理利用，但对于个人隐私数据则应该需要严格保护与监管，不应该被某些商家或个人用来牟利。\n\
    \n![](images/txt005_3.jpg \"pagenumber_ebook=117,pagenumber_book=106\")\n\n图5-1　一般信息与敏感信息\n\
    \n5.1.2　隐私数据泄露与危害\n\n1.手机中的人工智能\n\n人工智能可以用于拍照加美颜、视频自动加字幕、OCR文字识别、语言翻译等各个方面，在带来便利的同时也可能正在窃取你的隐私（图5-2）。\n\
    \n在使用App前，大家都需要打开手机“隐私”功能进行通讯录权限、定位权限、麦克风权限等“同意”授权（图5-3）。这些软件的背后，多数都存在私自收集个人信息、过度索取权限甚至存在“将用户信息私自共享给第三方”的问题。\n\
    \n当我们在浏览某个商品时，购物网站立即会推荐给我们相关的产品。这个现象的背后是一套程序员精心设计的推荐算法，在获取用户的姓名、生日、住址、消费习惯、产品偏好，甚至父母的年薪等，再针对这些个人信息分析整理，根据个人数据给每个用户设立特有的标签，为用户精准“画像”，完成个性化的购物推荐（图5-4）。\n\
    \n![](images/txt005_4.jpg \"pagenumber_ebook=118,pagenumber_book=107\")\n\n图5-2　App窃取隐私\n\
    \n![](images/txt005_5.jpg \"pagenumber_ebook=118,pagenumber_book=107\")\n\n图5-3　手机“隐私”授权\n\
    \n![](images/txt005_6.jpg \"pagenumber_ebook=118,pagenumber_book=107\")\n\n图5-4　购物网站的用户信息\n\
    \n![](images/txt005_7.jpg \"pagenumber_ebook=119,pagenumber_book=108\")\n\n图5-5　用户标签\n\
    \n![](images/txt005_8.jpg \"pagenumber_ebook=119,pagenumber_book=108\")\n\n图5-6　信息泄露的危害\n\
    \n![](images/txt005_9.jpg \"pagenumber_ebook=119,pagenumber_book=108\")\n\n图5-7　人工智能变脸和变声\n\
    \n当用户浏览了许多关于美食和健康的页面时，就会被打上“吃货”“减肥”等标签（图5-5），并被推荐相关的广告内容。这些内容不仅在形式上满足用户“懂我”的需求，还能借机谋取利益。\n\
    \n个人隐私信息泄露会带来严重的后果。许多人会经常受到骚扰电话、垃圾短信、垃圾邮件等信息的轰炸。电话会被第三方“监听”、摄像头会被不法分子自动开启进行“偷窥”，用户甚至会面临着网络诈骗和犯罪的风险（图5-6）。\n\
    \n2.人工智能语音交互\n\n当下流行的智能音箱正在家中“监听”你的一举一动，自然人的隐私权有可能正在受到伤害。从工作原理上来看，智能音箱收集数据是不可避免的。智能音箱之所以“智能”，是因为其具有自主学习功能。在同用户对话交流和互动的过程中，通过学习海量的数据信息而变得“聪明”。\n\
    \n智能音箱在被唤醒的过程中，只要选择打开麦克风，就可能一直在“窃听”用户说话。它可以收集用户的语音、位置等个人信息，并且将对话的语音信息上传至商家提供的云端服务器上存储。\n\
    \n3.人工智能变脸和变声\n\n人工智能的天赋在于可识别、可模仿、可再造（图5-7）。人工智能换脸可以帮助影视演员，将年龄跨度很大的角色塑造得非常完美。\n\
    \n知识拓展\n\n人脸识别的信息安全\n\n人脸识别的信息安全包含两个层面。\n\n第一层面，要学会保护个人人脸信息。\n\n曾有媒体报道，有商家在网络商城上公开兜售“人脸数据”。这十几万条数据的背后是2\
    \ 000多张人脸，其中有明星、普通市民，还有部分未成年人，这些数据包括带人脸的位置信息，以及人脸的68处特征信息。被采访的当事人不仅对自己的“人脸数据”被出售毫不知情，甚至连自己的面部数据是什么时候被采集的都不清楚。这条新闻不禁使人惊出一身冷汗：如果我的人脸信息被“盗”了怎么办？密码被盗可以重置，可人脸没有办法更换啊！所以，对于我们来说，可以做好以下几条，防止包含生物信息在内的个人隐私泄露。\n\
    \n不随意下载不明用途的应用程序，应该到官方或规模较大的应用商店下　载。\n\n不随意授权应用程序的权限申请，同意必须使用的权限，拒绝不需要的权限申请。\n\
    \n不随意使用应用程序的人脸拍照功能，尤其是在需要人脸拍照并且要求上传证件信息时（比如身份证、护照、驾照等）。\n\n不随意使用各种换头、换脸、制作人脸表情包的功能。\n\
    \n不随意答应陌生人合影，照片可能泄露其中的人脸数据信息。\n\n不随意在社交网站上传自己的人脸照片和视频。\n\n第二层面，各大企业在使用人脸识别进行身份认证时，已经意识到人脸信息泄露带来的安全风险，开始在人脸识别中加入人脸活体检测这一关键步骤。\n\
    \n活体检测通常可以有以下几条措施：\n\n当场录制短视频，读出随机字符，确保视频并非事先录制，上传视频进行活体分析，提高抵抗能力。\n\n根据语音提示，完成眨眼、张嘴、摇头、左右转头、上下点头等数种预设动作，抓取多图进行活体判断。\n\
    \n基于结构光成像原理，通过人脸表面反射红外光斑构建深度图像，判断目标是否为活体，可有效防御图片、视频等的攻击。\n\n通过以上两个层面的双管齐下，再结合必要的立法层面来保障公民包括人脸数据在内的个人隐私，一定能更好地做到人脸数据不被盗用、滥用，维护好公民的相关权益。\n\
    \n人工智能变声技术可以用于影视配音工作，为不同年龄、身份的角色配音。人工智能只需几秒钟的音频样本，就可以模仿或者克隆出另一个人的声音。你的声音可以被改变，也就能够被伪造。\n\
    \n人工智能换脸和变声App最大的问题在于规模化收集个人的生物信息样本。生物信息样本一旦丢失或泄露，会造成更严重的后果。人脸、声纹等生物信息一般无法更改，一旦泄露而被不法分子获取，就会带来造假和欺诈。\n\
    \n5.1.3　数据伦理应遵循的规则\n\n1.数据分级健全法规制度\n\n人工智能发展应尊重和保护个人隐私，在国家法律法规层面要明确数据集的主体、使用范围等具体问题，将用户的知情权和选择权交还给用户本人。加强对于个人敏感数据的保护，对于可共享的私人信息实行分级保密处理，促进社会各类数据信息流通和共享，让公共数据有效地赋能各行各业。\n\
    \n2.有资质机构依法加强监管\n\n对于企业而言用户是弱者，个人数据的使用与监管应该由第三方有资质的机构来依法进行常态化监管，抽查企业在用户数据信息采集、处理、保存、流通、使用过程中的安全性及合规性问题。若其中涉及个人私密信息安全泄密问题，应提起公益诉讼。\n\
    \n思考探索\n\n1.人工智能时代我们需要什么样的“数据权”？\n\n2.如何来防护自己的“个人隐私数据”安全？\n\n5.2　算法与偏见\n\n5.2.1　机器学习让人工智能更聪明\n\
    \n机器学习是自动编程，是一种“学习算法”。计算机可以从过去人们的经验，也就是“数据”中进行学习。“学习算法”类似人类的“大脑”，经过训练学习，就可以让机器更“懂你”（图5-8）。\n\
    \n![](images/txt005_10.jpg \"pagenumber_ebook=122,pagenumber_book=111\")\n\n图5-8　机器学习\n\
    \n我们已经生活在算法的世界中，算法决策可以辅助人类进行推荐购物、金融投资、医疗诊断、人员招聘、抓捕逃犯、自动驾驶等工作，“算法”已经越来越多地主导人类社会事务。\n\
    \n机器学习需要采用大量的正确样本进行训练，而“算法”所依赖的“大数据集”又都是从社会中提取的，它们往往带有社会固有的不平等以及歧视性信息。工程师在制定“算法规则”时往往会不自觉地渗透自己个人的一些价值观，这样就会带来“算法偏见”的问题。\n\
    \n5.2.2　算法偏见带来的伦理问题\n\n1.计算数据带有偏见\n\n算法模型是“以数学方式或代码方式来表达的意见”。若计算输出的结果是带有偏见的，那一定有原因。数据集是产生“偏见”的土壤，如果用于机器学习的数据集本身有偏差或缺乏代表性，算法决策也会有失公允（图5-9）。\n\
    \n2.算法可能暗藏歧视\n\n“算法中立”是一种理想，算法的背后都存在着设计者的立场与决策。工程师是“算法规则”的制定者，选取什么特征（数据标签），采用哪种模型，嵌入什么样的价值判断，都决定着最终预测的结果。\n\
    \n“大数据杀熟”的戏码，在现代社会中已经是司空见惯了。网络平台会根据以往收集的个人用户身份数据、购物数据、行为数据等给用户“画像”。利用算法分析出“高消费”人员与“低消费”人员，实施“一人一价”的差异化定价策略，将相同的商品以不同的价格卖给不同的消费者（图5-10）。程序员所设计的推荐算法应该秉承传统商家的经商之道——“诚信为本，童叟无欺”的伦理规则，然而商家为了“商业利益”，改变了“算法规则”设计，侵害用户的利益。\n\
    \n![](images/txt005_11.jpg \"pagenumber_ebook=123,pagenumber_book=112\")\n\n图5-9　算法模型示意图\n\
    \n![](images/txt005_12.jpg \"pagenumber_ebook=123,pagenumber_book=112\")\n\n图5-10　大数据杀熟\n\
    \n3.算法决策两难\n\n有一个经典的哲学思想实验“司机的困境”（图5-11）。实验是这样的，有一辆汽车行驶在下山的坡道上，前方突然出现1个人，而车上有4个人。在这千钧一发之际，汽车该开向哪一边？\n\
    \n![](images/txt005_13.jpg \"pagenumber_ebook=124,pagenumber_book=113\")\n\n图5-11　算法决策两难\n\
    \n解决这个问题的“算法”，人类自己也没有想明白，机器又该如何抉择呢？将这一道无解的难题抛给“算法”，希望“算法”能给出一个最适合的答案，显然也是做不到的。人工智能算法决策是个“黑匣子”，我们无法了解决策的过程，只能接受决策的结果。在涉及生命“决策权”的问题上，我们是否已经准备好要将“决策权”拱手交给人工智能呢？\n\
    \n5.2.3　算法伦理应遵循的规则\n\n1.合理规制公正的数据集\n\n数据偏差是产生“算法偏见”的土壤。要解决这个问题，先要从数据上着手，例如将“大数据”和“小数据”结合，综合分析，确保算法在推导因果关系时的决策准确性。人和人工智能都会犯错，纠偏机制是必需的。可用自主测试数据集来识别其中自带的歧视和偏见，通过重新采样来消除人工智能系统中的数据偏见。\n\
    \n2.要提升算法的透明度\n\n企业每推出一个人工智能产品都应该经过人工智能道德伦理的审查与监督。程序员要将人类社会伦理、法律道德等嵌入人工智能系统。人工智能要尊重人类文化的多样性，不损害人类的尊严。其中的算法要具有公开性、透明性与可解释性。一旦发生事故，确保人工智能决策过程可追溯，所有决策数据可呈交给法院与专业的第三方评测机构，供评估审议。\n\
    \n思考探索\n\n算法也有偏见，那么我们还需要信任它们吗？\n\n5.3　安全与责任\n\n5.3.1　人工智能的发展趋势\n\n随着人工智能技术的发展，各种类型的机器人都出现了，例如巡逻机器人、扫地机器人、空中飞行机器人、水下潜航机器人、手术机器人、康复机器人、咨询服务机器人、外骨骼机器人、仿生机器人（图3-5，图5-12—图5-14）。机器设备逐渐掌握了会看、会听、会说、会想、会动的本领，越来越“智能化”了。我们将这些由人工智能程序控制的机器人，称为人工智能机器人。\n\
    \n![](images/txt005_14.jpg \"pagenumber_ebook=125,pagenumber_book=114\")\n\n图5-12　理发机器人\n\
    \n![](images/txt005_15.jpg \"pagenumber_ebook=125,pagenumber_book=114\")\n\n图5-13　人形机器人\n\
    \n![](images/txt005_16.jpg \"pagenumber_ebook=125,pagenumber_book=114\")\n\n图5-14　巡逻机器人\n\
    \n当前我们还处在弱人工智能发展阶段，人工智能机器人只能解决某一领域中的特定问题。例如，围棋机器人AlphaGo，它只能专做一件事，其他方面就不行了。据专家预测，到2040年左右“强人工智能阶段”将至，届时人工智能机器人将拥有“与人类级别一样的通用智能”；到2060年左右“超人工智能阶段”也将来临，我们可以理解为比最强“人类大脑”还要聪明千万倍的“超级智能大脑”将来到这世界上。这个“临界点”，可能会提早到来，可能永远也不会出现。\n\
    \n未来社会中人工智能机器人会不会取代人类？人工智能机器人算不算一个人？机器与人类之间又该如何相融共生呢？人工智能技术可以极大地提高工作效率，创造巨大经济利益，也给人类社会带来了严峻的挑战。\n\
    \n5.3.2　人工智能带来的社会问题\n\n1.失业问题\n\n人类智慧优势在于具有创造力，会发明创造和使用“工具”来提高社会生产效率，推动社会不断发展进步。“人工智能”就是人类创造的又一个“工具”，用“人工智能”来替代人类的“脑力劳动”。\n\
    \n纵观历史会发现，每一次技术的发展创新，会提升社会生产效率，带来巨大的经济效益；会创造许多新的工作岗位，同时也必然会造成部分人员失去原有的工作岗位。\n\n\
    未来社会无人超市、无人货柜、无人餐厅会越来越普及，越来越多的工作岗位会被“人工智能机器人”所替代。据调查统计，15年内最容易被人工智能替代的工作是电话销售、卡车司机、理财顾问、保安人员、翻译人员等重复性工作岗位。\n\
    \n目前，人工智能机器人还难以替代的则是复杂的具有创意性的职业，例如科学家、设计师、谈判专家、企业家、口腔外科医生、教师、飞机机械师等。\n\n人工智能的优势在于记忆和逻辑思维能力远远强于人类，在海量信息处理和分类上比人类要高效许多。例如，围棋机器人AlphaGo已具备了强大的自主学习能力。因此，人类需要不断地学习，才能让自已变得更强大，否则会因难以适应社会发展需要而遭到淘汰。\n\
    \n2.法规问题\n\n人工智能时代“算法”也有机会成为艺术家。人工智能可以通过对过去成功案例的数据学习，最终输出自己的作品（图5-15），例如写诗、画画、编曲等。但这也带来了一系列的问题，人工智能作品的版权归谁？作者是机器人还是程序员？这对目前实施的知识产权和著作权制度带来了新的问题和挑战。\n\
    \n![](images/txt005_17.jpg \"pagenumber_ebook=127,pagenumber_book=116\")\n\n图5-15　人工智能作品\n\
    \n3.安全问题\n\n科技进步的必然结果，就是用机器人替代人类的“体力劳动”，甚至是部分“脑力劳动”。人工智能时代人类和机器人如何安全共处的问题（图5-16），要引起我们足够的重视。据新闻报道，在德国、日本和我国，都发生过机器人“肇事”导致工人死亡的悲剧事件。\n\
    \n4.数字鸿沟\n\n老年人群面临的“数字鸿沟”问题表现在，他们往往对信息技术的应用能力和对网络信息真伪的辨析能力都相对较弱。在人工智能时代，诸如没有智能手机怎么实现人脸识别进而获取防疫绿码等问题引发关注，这需要社会和家庭给予更多的人文关怀和耐心帮助。\n\
    \n1940年，著名科幻作家伊萨克·阿西莫夫提出了“机器人三原则”。\n\n第一，机器人不得伤害人类；\n\n第二，必须服从人类指令，但不得与第一原则抵触；\n\
    \n第三，必须保存自身，但不得与前两条原则抵触。\n\n![](images/txt005_18.jpg \"pagenumber_ebook=128,pagenumber_book=117\"\
    )\n\n图5-16　人工智能与人类的相处\n\n5.3.3　人机融合发展的社会\n\n1.以安全至上服务人类为本\n\n机器人在使用过程中要确保对人类而言是安全可靠的，要始终坚持以“为人类服务”为本，给人类带来福祉和便利，绝不可以欺骗、伤害甚至毁灭人类。机器人要学会尊重人权，遵守人类伦理社会基本准则和价值。2050年全球将迈入老龄化，未来是人与机器协作融合发展的社会。届时一定会有大量的护理机器人投入养老机构，可以极大减轻人类护理人员的工作负荷。\n\
    \n2.对机器人决策事故要坚持采用追责制\n\n如果机器人代替人类决策后产生不良结果，到底是由机器来负责还是由人类来负责？例如，全自动驾驶汽车自主决策错误导致车祸，我们不能让机器或人工智能系统当人类的替罪羊。机器智能是人赋予的，人类必须对决策失误造成的结果负责。\n\
    \n思考探索\n\n1.你认为人工智能发明的产品专利到底应该属于谁？你支持所谓的人工智能人权吗？\n\n2.人工智能技术的发展会对人类产生威胁吗，为什么？\n\
    \n\uFEFF\n\n后记\n\n放眼当下，我们不难发现生活中已经越来越多地融入人工智能：医院里有医疗机器人，每天推送给我们的新闻可能是机器自动生成的，搭载无人驾驶技术的汽车已经上路了，即时语音翻译使得出国语言不通也不用担心，无人机、无人车让快递变得更快，手机可以人脸识别解锁，智能音箱带来了人机互动……\n\
    \n而在未来，随着人工智能与5G网络、物联网、大数据、云计算等深度融合，各种智能设备将使人与人、人与物、物与物之间互相联通，形成一个智能互联的生态圈。各种数据在这生态圈中实时互通流动，人工智能则依靠日益成熟的算法和不断提升的算力，成为这个生态系统的核心。"
