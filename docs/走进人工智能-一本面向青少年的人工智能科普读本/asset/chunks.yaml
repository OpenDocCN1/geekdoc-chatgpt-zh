    #### 3.2.2　Feature Extraction


    Features, as the name suggests, are the characteristics that distinguish one thing
    from another. The human brain can distinguish differences between things mainly
    because it can extract the similarities and differences between them. For example,
    ducks have webbed feet, chickens do not; duck beaks and chicken beaks have different
    shapes; ducks waddle when they walk, chickens do not. The human brain can extract
    these features. Another example: although both dogs and cats are covered in fur,
    the human brain can use certain features to correctly distinguish dogs and cats.
    For instance, canines have more prominent snouts than felines; cats of the same
    build can open their mouths wider than dogs.


    How does computer vision technology mimic the human brain to extract the features
    of things? We will illustrate this using Figure 3-21 as an example.


    To capture the features of a dog, the computer first converts the corresponding
    image into a grayscale image with black-and-white gradients, then divides the
    entire image into small grids. Next, it counts the distribution pattern of line
    directions within each grid image, that is, calculates the degree of pixel change
    (gradient; Figure 3-22) along vertical or horizontal directions. Then, it uses
    a certain algorithm to normalize the vertical and horizontal gradients into an
    image retaining only necessary information, finally processing the original image
    into the appearance shown in Figure 3-23.


    ![](img/txt003_23.jpg "pagenumber_ebook=74,pagenumber_book=63")


    Figure 3-21　Original Image


    ![](img/txt003_24.jpg "pagenumber_ebook=74,pagenumber_book=63")


    Figure 3-22　Gradient Change Schematic


    ![](img/txt003_25.jpg "pagenumber_ebook=74,pagenumber_book=63")


    Figure 3-23　Histogram of Oriented Gradients


    We can clearly see the outline of this dog, and features such as the dog''s longer
    snout and larger, erect ears are preserved. These features also need to be aligned
    with the image position. For example, the dog''s snout and ears appear at appropriate
    positions in the image for relatively accurate recognition of the dog. When it
    is in a very rare posture, such as burying its snout in its body and two front
    paws, such features may become ineffective, requiring more complex features or
    more optimized algorithms for better recognition.


    The above image feature extraction method is called the **Histogram of Oriented
    Gradients (`HOG`)**, a relatively common traditional image feature extraction
    algorithm based on image processing technology. There are many other methods for
    image feature extraction, such as feature recognition methods based on color features,
    feature recognition methods based on geometric features, etc.


