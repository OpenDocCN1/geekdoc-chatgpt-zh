    ## 2.3.4 Comparison of Supervised and Unsupervised Learning


    ### Comparison 1: With Classification Labels vs. Without Classification Labels


    - Supervised learning inputs data with classification labels.

    - Unsupervised learning inputs data without classification labels.


    ### Comparison 2: With Determined Output Results vs. Without Determined Output
    Results


    - The output result of supervised learning is the preset classification label,
    so the result is determined.

    - The output result of unsupervised learning is unknown beforehand. Under different
    algorithms and different similarity settings, the output category results are
    uncertain. For example, observing the clustering result, it might cluster by color,
    or it might cluster by shape.


    ### Comparison 3: Classification vs. Clustering


    - Classification is a method of supervised learning.

    - Clustering is a method of unsupervised learning.


    The biggest difference between classification and clustering lies in whether the
    category information of the sample data is known. When performing supervised learning,
    marking classification labels has actually determined how many categories there
    are. However, in unsupervised learning clustering, the category information of
    the sample data is not known beforehand. Depending on the similarity setting,
    it might be divided into four categories or two categories. During clustering,
    we don''t care what a certain category is; we only achieve grouping similar things
    together. Before the clustering results come out, we don''t know the characteristics
    of each category; rather, we need to induce and analyze what characteristics each
    clustered category might have based on the clustering results, through human experience.


    #### Knowledge Expansion


    **Semi-supervised Learning**


    Semi-supervised learning lies between supervised and unsupervised learning, combining
    the characteristics of both. In semi-supervised learning, the data consists of
    a small amount of labeled sample data and a large amount of unlabeled sample data,
    and learning and prediction are performed. Generally, semi-supervised learning
    is achieved by adding unlabeled sample data into supervised classification algorithms
    to realize semi-supervised classification, or by adding labeled sample data into
    unlabeled sample data to enhance the effect of unsupervised clustering.


    # 2.4 Reinforcement Learning


    In school, if we are late for class, we get criticized by the teacher, so we try
    to avoid "being late." Conversely, if we actively help classmates and get praised
    by the teacher, then to get more praise, we will do more "helping."


    Humans use thinking and improvement methods to enhance their mastery and cognition
    of knowledge. In AI machine learning, we call this process "Reinforcement Learning."


    ## 2.4.1 Thinking and Improvement in Life


    We gave examples of human thinking and improvement earlier. In fact, humans not
    only use thinking and improvement methods to learn but also use them to train
    animals, such as training guide dogs that can go on duty (Figure 2-21).


    The purpose of training a guide dog for duty: to enable the guide dog to lead
    a trainer acting as a blind person through various obstacles. If it succeeds,
    it gets praised and petted; if it fails, it gets criticized. To avoid criticism
    and gain more praise and petting, the guide dog gradually learns to lead the trainer
    through various obstacles (Figure 2-22).


    ![](img/txt002_25.jpg "pagenumber_ebook=51,pagenumber_book=40")

    **Figure 2-21　Training a Guide Dog**


    How does the guide dog do it? First, it observes the surrounding environment,
    including the position and number of obstacles, thinks about the route forward,
    and then tries to act. When it can safely lead the trainer through obstacles,
    it gets praised and petted, which makes it happy. But when it fails to safely
    lead the trainer through obstacles, it gets criticized by the trainer, which makes
    it disappointed. To avoid criticism and gain more praise and petting, it thinks
    about improving the route to avoid obstacles, consolidating successful routes
    and changing failed ones. As the number of training sessions increases, through
    continuous cycles, the guide dog can successfully go on duty and lead the trainer
    through various obstacles.


    The model for training a guide dog is shown in Figure 2-23.


    #### Thought Exploration


    What do the four concepts: Environment, Decision, Action, Reward/Punishment mean?


    ![](img/txt002_26.jpg "pagenumber_ebook=52,pagenumber_book=41")

    **Figure 2-22　Process of Training a Guide Dog**


    ![](img/txt002_27.jpg "pagenumber_ebook=52,pagenumber_book=41")

    **Figure 2-23　Model of Training a Guide Dog**


    In the process shown in Figure 2-23, four concepts need to be clarified.


    1. **Environment**. The guide dog needs to observe the environment. The position
    of obstacles, the number of obstacles, the physique of the trainer being led,
    its own physique, etc., are all environmental factors the guide dog needs to pay
    attention to.

    2. **Decision**. The guide dog thinks about the route to avoid obstacles based
    on the observed environment.

    3. **Action**. It acts based on the decision result, specifically manifested as
    leading the trainer through the chosen route.

    4. **Reward/Punishment**. After the action, the guide dog receives a reward or
    punishment. Based on the reward/punishment, the guide dog continues to think and
    adjust the chosen route, forming a cycle of continuous learning and trying.


    The most important part of this process is the decision—thinking how to act to
    gain more rewards.


    ## 2.4.2 General Process of Reinforcement Learning


    Reinforcement learning can be regarded as the process of machine thinking and
    improvement.


    Reinforcement learning is essentially a learning process of constant trial and
    error. In various environments, it needs to try all possible actions as much as
    possible, judge the quality of actions through feedback from the environment (i.e.,
    rewards/punishments), and finally obtain the mapping relationship between the
    environment and the optimal action (i.e., the decision).


    #### Experience Perception


    As shown in Figure 2-24, choose a route from start to end. Passing through each
    node on the route yields a certain number of gold coins (blue numbers indicate
    the gold coin count for each node route). Which route yields the most gold coins?


    ![](img/txt002_28.jpg "pagenumber_ebook=53,pagenumber_book=42")

    **Figure 2-24　Route Selection**


    There are four routes from start to end:


    - Route 1: Start→1→3→6→End, total 660 gold coins.

    - Route 2: Start→1→4→7→End, total 140 gold coins.

    - Route 3: Start→2→4→7→End, total 180 gold coins.

    - Route 4: Start→2→5→8→End, total 140 gold coins.


    By listing all routes, we know "Route 1" yields the most gold coins. Our decision
    plan is "Route 1".


