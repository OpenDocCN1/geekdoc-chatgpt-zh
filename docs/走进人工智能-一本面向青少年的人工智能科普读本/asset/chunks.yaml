    # 2.3 无监督学习


    除了在监督学习中说到的人类学习的方式，人还可以在无人监督的情况下，通过归纳推理的方式自主学习。


    ## 2.3.1 人的归纳推理式学习


    比如我们看到番茄、山楂、草莓时，可以根据它们的颜色进行归纳：它们共同的颜色是“红色”。又比如我们看到足球、橙子、西瓜时，可以根据形状进行归纳：它们共同的形状是“球体”。这种学习方式就是归纳推理式学习（图2-16）。人类自行发现相同点和不同点，根据这些特点分成不同的类别，并且给这些类别取名字，比如“红色”“球体”。


    当人类探索未知事物时，往往使用归纳推理的学习方式，比如生物学家根据动物的特点对动物进行分类，确定不同物种。


    俗话说“物以类聚”，像这样根据事物间的相似程度，将它们合并归纳成一个个类别的过程，称为“聚类”。


    ![](images/txt002_18.jpg "pagenumber_ebook=46,pagenumber_book=35")

    **图2-16　人的归纳推理式学习**


    ## 2.3.2 无监督学习的一般过程


    人类这样的归纳推理式学习，对应到机器学习领域，就是“无监督学习”。在这种学习过程中，没有人引导和监督，也就是输入没有标记的数据，它是一种机器自主学习的方式。正因为有了无监督学习，机器开始自己探索未知的世界。无监督学习常用的方法是“聚类”，机器自主地将数据分割为若干个小团体，这样的小团体也可以称为“集群”。需要注意，虽然聚类在无监督学习中发挥了积极的作用，但是并不意味着“无监督学习
    = 聚类”。


    让我们一起体验一下无监督学习的聚类过程。


    本实验中准备了以下六句话作为学习数据（聚类数据）。


    1. 今天去动物园看到老虎和熊猫。

    2. 老虎和熊猫的观众最多。

    3. 老虎是食肉动物。

    4. 午饭吃蛋炒饭和罗宋汤。

    5. 蛋炒饭里还有香肠呢。

    6. 明天还想吃蛋炒饭和罗宋汤。


    接下来进行聚类。首先把每一句话看作是一个独立的集群。这样最开始就有六个集群。


    接下来，把最相似的集群合并归纳成一个新的集群。但是怎么判断六个集群中谁和谁“最相似”呢？


    可以把语句中包含相同名词最多的定义为“最相似”。这里将“各句话中包含的相同名词数”看作“相似度”。


    一起尝试制作一张表格，记录 ①—⑥ 句话中包含的相同名词，看看你的结果是不是和表2-1一样。


    从表2-1中我们统计出各句话之间的相似度如表2-2所示。


    **表 2-1 标记各语句中的名词**


    ![](images/txt002_19.jpg "pagenumber_ebook=47,pagenumber_book=36")


    **表 2-2 各语句对应其他语句的相似度**


    ![](images/txt002_20.jpg "pagenumber_ebook=47,pagenumber_book=36")


    #### 思考探索


    通过表2-2我们发现，______与______相似度为2，______与______相似度也为2。


    我们发现句①与句②中都包含“老虎”和“熊猫”，即相似度为 2；还发现句④与句⑥中都包含“蛋炒饭”和“罗宋汤”，即相似度也为 2。


    把集群句①与集群句②合并归纳成一个新集群，集群句④与集群句⑥合并归纳成另一个新集群。此时集群数为 4，如图2-17所示。


    图2-17是统计“最相似”时获得的新集群图，我们发现此时相似度为 2。若将相似度为 1 的也计算在内，那么集群 1 与集群 3 又可以构建成一个新的集群，集群
    2 与集群 4 也可以构建成一个新的集群，如图2-18所示。


    若将相似度设置为 0，那么这六句话就是一个集群了。因此我们发现相似度的设置非常重要，若相似度设置得过低（比如设置为 0），那么这个无监督学习的聚类就变得没有意义了。


    ![](images/txt002_21.jpg "pagenumber_ebook=48,pagenumber_book=37")

    **图2-17　相似度为 2 时新获得的集群图**


    ![](images/txt002_22.jpg "pagenumber_ebook=48,pagenumber_book=37")

    **图2-18　相似度为 1 时新获得的集群图**


    在无监督学习中，机器通过算法根据给出的相似度设置，就会把数据进行聚类，通过机器自主学习将相似的数据分到一个类别中（图2-19）。


    ![](images/txt002_23.jpg "pagenumber_ebook=49,pagenumber_book=38")

    **图2-19　无监督学习中的聚类**


    ## 2.3.3 无监督学习在生活中的应用


    ### 1. 购物平台的商品自动推荐


    用户在使用购物平台时，系统会把他们的消费习惯、浏览偏好、所处地理位置等各种信息记录下来，然后根据这些信息，把购物平台的用户们聚合成不同的类型，比如“摄影爱好者”“音乐发烧友”等，然后再对不同类型的用户推送他们可能感兴趣的商品，从而增加商品被选购的几率（图2-20）。


