    Entering the 21st century, thanks to the massive data brought about by the rise
    of the Internet and the advent of digital cameras, coupled with the widespread
    application of machine learning methods, computer vision has developed rapidly.
    Many previous rule-based processing methods have been replaced by machine learning.
    Machines automatically summarize and induce the features of objects from massive
    data, and then perform recognition and judgment. This stage saw the emergence
    of a very large number of applications, including typical camera face detection,
    security face recognition, license plate recognition, etc.


    After 2010, with the power of deep learning, computer vision technology achieved
    explosive growth and formed industrialization. Neural network image recognition
    appeared, which is a relatively new image recognition technology currently. Deep
    learning technology has shown tremendous advantages in the development of computer
    vision technology, particularly in the field of object vision.


    To date, computer vision technology can already utilize "seen" information to
    accomplish various tasks. Looking to the future, computer vision technology may
    enable computers to observe and understand the world through vision just like
    humans.


    ![](img/txt003_7.jpg "pagenumber_ebook=68,pagenumber_book=57")


