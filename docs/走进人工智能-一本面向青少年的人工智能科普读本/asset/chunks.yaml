    # 2.2 Supervised Learning


    In life, we learn in many ways. When we were very young, our parents would hold
    an apple and tell us that something red, spherical, and smooth-skinned like this
    is an apple. Later, when we saw a green apple, our parents would tell us that
    apples aren''t all red; they can be green too. Gradually, we formed a model of
    an "apple" in our minds, and later we could distinguish apples. When we grew up
    and could read books ourselves, we could also self-study from books, find connections
    between things, and sometimes we learn through constant "trial and error."


    Machine learning also has its own learning methods, such as "Supervised Learning,"
    "Unsupervised Learning," "Reinforcement Learning," etc.


    ## 2.2.1 Human Learning


    Perhaps we have forgotten how our parents taught us to recognize apples when we
    were young. Let''s relive this learning process with student Xiao Neng (Figure
    2-10).


    ### 1. Look (Pictures of Axolotls)


    To help us accurately recognize axolotls, student Xiao Neng collected pictures
    of axolotls from different angles, in different shapes, and of different colors,
    and told us that these are all axolotls. Through the method of looking and observing
    with our eyes, we increase our brain''s cognition of axolotls (Figure 2-11).


    ![](img/txt002_12.jpg "pagenumber_ebook=40,pagenumber_book=29")

    **Figure 2-10　Review of Human Learning**


    ![](img/txt002_13.jpg "pagenumber_ebook=40,pagenumber_book=29")

    **Figure 2-11　Look (Pictures of Axolotls)**


    ### 2. Memory (Axolotls)


    To remember axolotls, we need to find their characteristics.


    Through observation, we can find that axolotls have the following characteristics:


    - Six horn-like gills;

    - Broad face;

    - Four legs that are relatively short and thin;

    - A fish-like tail;

    - Colors include white, yellow, black...;


    ### 3. Forming a Model in the Brain


    After remembering these characteristics, we form a model of the axolotl in our
    brains (i.e., an initial impression of the axolotl). Later, when we see an axolotl,
    we compare it with the model in our brain (Figure 2-12) and then recognize the
    axolotl.


    ![](img/txt002_14.jpg "pagenumber_ebook=41,pagenumber_book=30")

    **Figure 2-12　"Axolotl" Model Formed in the Brain**


    ### 4. Verifying the Model


    Whether we have truly learned to recognize axolotls requires practical verification,
    just like after we learn knowledge in school, we do exercises and quizzes to assess
    our mastery of the knowledge.


    The purpose of the test is to verify whether our cognition of axolotls is comprehensive
    and reliable. In other words, whether the model in our brain is sufficient to
    support us in recognizing axolotls. If we still cannot recognize axolotls, we
    need to improve the model of axolotls in our brain.


