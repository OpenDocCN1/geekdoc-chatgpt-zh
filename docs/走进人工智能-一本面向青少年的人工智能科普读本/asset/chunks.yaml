    ### 3.1.2 计算机视觉技术的发展历史


    计算机视觉是一门研究如何使机器“看”的科学，进一步来说，它研究如何从图像或多维数据中获取信息用于感知。


    1966年，人工智能科学家在给学生布置的作业中，要求学生编写一个程序，在计算机上运行之后，可以告诉我们它通过摄像头看到了什么，这也被认为是计算机视觉最早的任务描述。


    20世纪七八十年代，随着现代电子计算机的逐步普及，计算机视觉技术也初步萌芽。科学家开始尝试让计算机回答它究竟看到了什么东西，首先想到的是从人类看东西的方法中获得借鉴。


    一是当时人们通常认为，人类之所以能看到并理解事物，是因为人类通过双眼可以立体地观察事物。因此，要想让计算机理解它所看到的图像，必须先将景物从二维的图像恢复成三维结构，这就是所谓的“三维重构”的方法（图3-3）。


    ![](images/txt003_5.jpg "pagenumber_ebook=66,pagenumber_book=55")

    图3-3　人类的双眼观看三维物体的示意图


    二是当时人们认为，人类之所以能识别出一个苹果，是因为人类已经知道了苹果，比如苹果可能是红色的、黄色的、绿色的、圆的、表面光滑的。如果给计算机也建立一个类似的知识库，让计算机将看到的图像与知识库里的储备知识进行匹配，是否可以让计算机识别乃至理解它所看到的东西呢——这就是所谓的“先验知识库”的方法（图3-4）。


    ![](images/txt003_6.jpg "pagenumber_ebook=67,pagenumber_book=56")

    图3-4　先验知识库示意图


    这套方法只能够提取少数基本特征，实用性不高，只能用在某些光学字符识别、显微或航空图片识别等方面。


    20世纪70年代后期，随着计算机性能的提升，处理图像成为了可能，计算机视觉才得到了真正的关注和发展。1982年《视觉》一书问世，标志着计算机视觉成为一门独立的学科。


    20世纪90年代，计算机视觉技术取得了更大的发展，一方面是因为`CPU`（中央处理器）、`DSP`（数字信号处理）等图像处理硬件技术有了飞速进步；另一方面是因为科学家们发明了更先进的算法，包括统计方法和局部特征描述符的引入，计算机视觉技术开始广泛应用于工业领域。

