    ##### 知识拓展：生成式对抗网络


    `GAN`（生成式对抗网络）是深度学习的一种模型。可以通过一个例子来理解`GAN`的原理。比如犯罪分子制作假钞，一开始由于技术很差，一下子就被警察发现是假钞了。汲取了失败经验后，犯罪分子改进了技术，这次生成的假钞没这么容易被警察识破。于是警察发现犯罪分子制作假钞的技术在进步，为了防止假钞的流通，他们鉴定假钞的技术也有所提升。这个相互博弈的过程持续下去，犯罪分子制作的假钞越来越逼真，警察鉴定假钞的能力也越来越强，双方相互博弈，互相提高自身技术。这就是`GAN`的基本思想。


    `GAN`分为两个主要部分——生成器和判别器。生成器负责生成伪真的样本，判别器用于鉴定生成的样本。如果生成的样本不够真实，判别器能轻松识别生成的样本是伪造的。在这个模型中为了提高输出的质量，我们需要好的生成器和判别器，只有当两者都非常优秀时，最终生成的样本才够真实。`GAN`在图片修复、艺术创作等领域得到广泛应用。值得一提的是，由`GAN`创作的画作Edmond
    de Belamy（《爱德蒙·贝拉米的肖像》）在拍卖会上以约300万人民币的价格成交。


