    ### 2.5.3 Artificial Neural Networks and Deep Learning


    Deep Learning is considered an extension of Artificial Neural Network algorithms.
    Artificial Neural Networks start with neurons and the Perceptron.


    #### 1. Neurons


    The human brain possesses hundreds of billions of neurons. Neurons are the basic
    components of the brain (Figure 2-27). Human behaviors such as listening, speaking,
    seeing, and thinking stimulate neuron protrusions, which we call "dendrites."
    Neurons can be interconnected through "dendrites." All neurons in the brain and
    the dendrites connected to them form the brain''s "neural network."


    ![](img/txt002_31.jpg "pagenumber_ebook=57,pagenumber_book=46")


    Figure 2-27　Neuron


    #### 2. Perceptron


    The Perceptron is the foundation of neural networks and the origin of Deep Learning.
    A single-layer Perceptron can be regarded as the simplest neural network. The
    principle of the Perceptron is simple: the system receives multiple inputs and
    feeds back a single output.


    Take a school subject''s final comprehensive evaluation as an example to demonstrate
    a single-layer Perceptron. Generally, the final comprehensive evaluation consists
    of two parts: the student''s regular grades and final exam grades. Therefore,
    the inputs are two scores: "Regular Grade" and "Final Exam Grade." The output
    final evaluation is set as "Pass" or "Fail." The condition for the final evaluation
    output is: "If the obtained score is less than 60, output Fail; otherwise, output
    Pass." As shown in Figure 2-28, the process weights each input value, i.e., `Regular
    Grade × Weight + Final Exam Grade × Weight = Final Comprehensive Score`. The obtained
    final score is then judged: if less than 60, output "Fail"; otherwise, output
    "Pass."


    ![](img/txt002_32.jpg "pagenumber_ebook=57,pagenumber_book=46")


    Figure 2-28　Demonstration of Single-Layer Perceptron Using Final Evaluation


    ##### Think and Explore


    Weight represents the importance of a certain thing. If the school values students''
    regular performance more, the weight of the regular grade will be larger; if the
    school values exam scores more, the weight of the final exam grade will be larger.


    Why do weights need to be adjusted in Deep Learning? Because input data have different
    degrees of influence on the output results. To obtain the optimal result, the
    essence of Deep Learning can be understood as optimizing the values of all weights,
    selecting the most reasonable values to achieve the best result.


    ##### Experience Perception


    Try it yourself: in the following three scenarios, what are the final comprehensive
    evaluation outputs?


    **Scenario 1 (Figure 2-29)**


    ![](img/txt002_33.jpg "pagenumber_ebook=58,pagenumber_book=47")

    ![](img/txt002_34.jpg "pagenumber_ebook=58,pagenumber_book=47")

    ![](img/txt002_35.jpg "pagenumber_ebook=58,pagenumber_book=47")


    - Scenario 1　Calculation: `65×0.5+55×0.5=60`, Final Evaluation Output: Pass

    - Scenario 2　Calculation: `65×0.6+55×0.4=61`, Final Evaluation Output: Pass

    - Scenario 3　Calculation: `65×0.4+55×0.6=59`, Final Evaluation Output: Fail


    In these three scenarios, when inputting the same regular grade and final exam
    grade, the output results differ due to different weights.


    For a single-layer Perceptron, input data is certainly important, but weight is
    also an important influencing factor. To make the single-layer Perceptron more
    reasonable, it is often necessary to adjust and select the most reasonable weights.


    #### 3. Multi-Layer Perceptron


    The single-layer Perceptron is too simple and can handle limited problems; hence
    the Multi-Layer Perceptron (MLP) emerged. The MLP adds more layers between input
    and output, and the output layer is not just a single neuron but can have multiple
    neurons. The MLP is also one of the structures of Artificial Neural Networks.
    Since Deep Learning originates from ANN research, an MLP with multiple hidden
    layers is a Deep Learning structure.


    #### 4. Artificial Neural Networks


    We can regard Artificial Neural Networks as a highly simulated achievement of
    brain structure.


    From Figure 2-32, it can be seen that ANNs are divided into Input Layer, Hidden
    Layers, and Output Layer. The Input Layer is responsible for data input; the middle
    layers of neurons are not visible, hence called Hidden Layers; the Output Layer
    is responsible for data output.


    ![](img/txt002_36.jpg "pagenumber_ebook=59,pagenumber_book=48")


    Figure 2-32　Deep Learning Model


    #### 5. Deep Learning


    A typical Deep Learning model (Figure 2-32) is actually a Multi-Layer Neural Network.
    Like ANNs, Deep Learning models contain Input Layers, Hidden Layers, and Output
    Layers.


    For example, input an image and use Deep Learning to recognize objects in the
    image. The Deep Learning model is set as shown in Figure 2-33.


    ![](img/txt002_37.jpg "pagenumber_ebook=60,pagenumber_book=49")


    Figure 2-33　Using Deep Learning to Recognize Objects in an Image


    In this Deep Learning model, since every image is composed of pixels, we use pixels
    as input data for the Input Layer.


    Hidden Layers are responsible for extracting more abstract features from the image.


    Based on given pixels, the 1st Hidden Layer determines edges by comparing the
    brightness of adjacent pixels.


    With the edge descriptions from the 1st Hidden Layer, the 2nd Hidden Layer determines
    corners and contours by searching edges.


    With the descriptions of corners and contours in the 2nd Hidden Layer, the 3rd
    Hidden Layer can detect entire parts of specific objects by searching for corners
    and contours in the image.


    Finally, recognition is performed based on the objects described in the image,
    and the result is output through the Output Layer.


    Of course, depending on the Deep Learning model settings, the number of Hidden
    Layers and the number of neurons in each layer will differ, and the function of
    each Hidden Layer will also differ. For example, with a different model, the 1st
    Hidden Layer might not be determining edges.


    In Deep Learning, to enable Hidden Layers to extract abstract features more accurately,
    parameter adjustment is often required. "Parameter" is a broad term. Parameter
    adjustment includes not only numerical adjustments (e.g., the weights mentioned
    earlier in the Perceptron; weights are also important parameters in Deep Learning)
    but also network structure adjustments, such as increasing or decreasing the number
    of Hidden Layers and neurons.


    ##### Knowledge Expansion: Pixel


    A Pixel is the most basic unit element composing an image. If you zoom in on an
    image to the maximum, you will find it is composed of small squares; these squares
    are called "Pixels." Each has a definite position and an assigned color value.


    ##### Experience Perception


    Open WeChat on your phone, search for the Mini Program "Your AI", select different
