    ## 2.4.3 监督学习、无监督学习与强化学习的比较


    但是假设我们并不知道后面每个节点线路的金币数量，那么一开始面对的选择是走节点1还是节点2。我们会选择节点2，因为可以获得50枚金币。这样就错过了线路一。这里我们需要理解强化学习中的目标是奖励最大化，即获得累计收益最高。虽然一开始选择节点2是当前收益最高（50枚金币），但是从长远来看，并不是累计收益最高的（线路一可以获得660枚金币）。


    在强化学习中，“好”的算法非常有“野心”，并不会被眼前的蝇头小利所诱惑。不能只看到眼前的利益，而是要学会长远考虑。


    ### 思考探索


    在这个问题中，你能说出环境、决策、行动、奖惩分别是什么吗？


    - **环境**：从起点到终点中间有不同线路，每条线路的金币数不同。

    - **决策**：选择线路。

    - **行动**：根据决策选择的线路从起点走到终点。

    - **奖惩**：根据行动获得的金币数，计算本次线路是不是比之前的线路能获得更多的金币（因为目标是获得更多的金币）。思考还有没有不同的线路，形成一个循环，不断学习尝试。


    可以归纳得出强化学习的一般过程，如图2-25所示。


    ![](images/txt002_29.jpg "pagenumber_ebook=54,pagenumber_book=43")


    图2-25　强化学习的一般过程


    监督学习表示输入带有标记的样本数据，通过训练已有标签的数据样本获得模型，从而输出事先确定的某一个分类标签。


    无监督学习表示输入不带标记的数据，通过自主归纳推理，将数据分为一个个集群。由于是自主归纳，因此输出结果往往无法事先确定。


    强化学习不需要预先输入数据，它的关键在于决策，因此强化学习是一个不断试错、循环往复的过程。在当前环境下根据反馈的奖惩，不断思考与改进，做出不同的决策再付诸行动。


    ### 动手实践


    请使用图形化编程软件，加载人工智能相关模块，通过一个小游戏建立一个机器学习项目。


    不需要告诉机器具体的游戏规则，但是可以通过获胜的游戏案例来训练机器，在这个过程中了解机器是如何通过强化学习思考与改进，从而一点点变得聪明的。


    ## 2.5 机器学习的发展


    ### 2.5.1 机器学习发展历程


    在现阶段，研究人工智能的学者们认为机器学习经历了五个发展阶段。


    **第一阶段：萌芽时期（20世纪40年代）**


    这一时期研究学者们引入生物学中的神经元概念，在分析神经元基本特性的基础上，提出`M-P神经元模型`，为机器学习的发展奠定了基础。


    **第二阶段：热烈时期（20世纪50年代—60年代中期）**


    著名的“图灵测试”就是这段时期提出的，不仅如此，神经学家还提出了最简单的神经网络数学模型——感知机。在这一时期，最早的决策树算法和`SVM`（支持向量机）、贝叶斯分类器被提出。


    **第三阶段：冷静时期（20世纪60年代中期—70年代中期）**


    由于感知机结构单一，并且只能处理简单的线性问题，技术无法突破局限，在冷静时期，机器学习的发展停滞不前。即使这样，1967年`KNN`（K-Nearest Neighbor，K最近邻）分类算法被提出。


    **第四阶段：复兴时期（20世纪70年代中期—80年代末期）**


    20世纪70年代出现了自训练、直推学习、生成式模型等学习方法，可以说是半监督学习的起源。


    1980年机器学习研究在世界范围内兴起，1986年机器学习逐渐为世人瞩目并开始加速发展。《并行分布式处理：认知微结构的探索》一书提出了应用于多层神经网络的学习规则——`BP算法`（误逆差传播算法），推动了人工神经网络的发展。除了`BP算法`，多种神经网络也在该时期得到迅猛发展。1986年决策树算法中的`ID3算法`被提出。之后不久，`CNN`（卷积神经网络）问世。


    在复兴时期，机器学习领域的最大突破是人工神经网络种类的丰富，由此弥补了感知机单一结构的缺陷。


    **第五阶段：多元发展时期（20世纪90年代至今）**


    进入 90年代，统计学习大行其道，多种浅层机器学习模型相继问世，诸如`LR`（逻辑回归）、`SVM`等。


    2006年深度学习的概念被正式提出。


    ### 2.5.2 深度学习与机器学习


    随着人工智能的流行，“深度学习”一词经常听到，那么“深度学习”与我们之前说的机器学习中的“监督学习”“无监督学习”“强化学习”有什么关系呢？


    人工智能中的“智能”可以说主要归功于机器学习，目前在机器学习中经常使用的技术就是深度学习。简而言之，我们之前提到的“监督学习”“无监督学习”“强化学习”这三种学习方式都能使用“深度学习”技术。


    可以用图2-26来表示人工智能、机器学习与深度学习的关系。


    ![](images/txt002_30.jpg "pagenumber_ebook=56,pagenumber_book=45")


    图2-26　人工智能、机器学习与深度学习的关系


    ### 2.5.3 人工神经网络与深度学习


    深度学习被认为是人工神经网络算法的拓展。人工神经网络要从神经元和感知机说起。


    #### 1. 神经元


    人类的大脑中拥有数以千亿计的神经元，神经元是构成大脑的基本部件（图2-27）。人类的听、说、看、想等行为会刺激神经元突起，我们称之为“树突”。通过“树突”可以将神经元相互连接，大脑中所有的神经元和与之相连的树突就形成了大脑的“神经网络”。


    ![](images/txt002_31.jpg "pagenumber_ebook=57,pagenumber_book=46")


    图2-27　神经元


    #### 2. 感知机


    感知机是神经网络的基础，也是深度学习的起源。单层感知机就可以看作一个最简单的神经网络。感知机的原理很简单，即系统接收到多个输入，并反馈一个输出。


    以学校某学科的期末总评为例演示单层感知机。一般期末总评由学生的平时成绩与期末考试成绩两部分组成，因此输入就是“平时成绩”与“期末考试成绩”两个分数，输出的期末总评设定为“合格”或者“不合格”。期末总评输出的条件为“如果获得的分数小于
    60分就输出不合格，否则输出合格”。如图2-28所示，过程中会对各输入值进行加权处理，即`平时成绩×权重 + 期末考试成绩×权重 = 期末总评`，获得的期末总评分数再按分数小于
    60分就输出“不合格”，否则输出“合格”。


    ![](images/txt002_32.jpg "pagenumber_ebook=57,pagenumber_book=46")


    图2-28　以期末总评为例演示单层感知机


    ##### 思考探索


    权重就是某一个事物的重要程度。如果学校更重视学生平时的表现，那么平时成绩的权重就会比较大；如果学校更重视学生的考试成绩，那么期末考试成绩的权重就会比较大。


    为什么在深度学习中权重需要调整？由于输入的数据对输出结果的影响存在差异，为了得到最优的结果，深度学习的本质可以理解为优化所有权重的值，选择一个最为合理的数值从而得到最优结果。


    ##### 体验感知


    动手试试看，以下三种情况下，期末总评输出分别是什么？


    **情况一（图2-29）**


    ![](images/txt002_33.jpg "pagenumber_ebook=58,pagenumber_book=47")

    ![](images/txt002_34.jpg "pagenumber_ebook=58,pagenumber_book=47")

    ![](images/txt002_35.jpg "pagenumber_ebook=58,pagenumber_book=47")


    - 情况一　计算过程：`65×0.5+55×0.5=60`，期末总评输出结果：合格

    - 情况二　计算过程：`65×0.6+55×0.4=61`，期末总评输出结果：合格

    - 情况三　计算过程：`65×0.4+55×0.6=59`，期末总评输出结果：不合格


    这三种情况下，输入相同的平时成绩与期末考试成绩时，由于权重的不同，输出的结果也会不同。


    对单层感知机而言，输入的数据固然重要，但权重也是一个重要影响因素。为了使单层感知机更为合理，往往需要调整选取最为合理的权重。


    #### 3. 多层感知机


    单层感知机过于简单，能处理的问题有限，因此多层感知机应运而生。多层感知机就是在输入和输出中增加更多层，并且输出层也不仅仅是一个神经元，可以为多个神经元。多层感知机也是人工神经网络的结构之一，由于深度学习源于人工神经网络研究，因此，含多个隐藏层的多层感知机就是一种深度学习结构。


    #### 4. 人工神经网络


    我们可以将人工神经网络看作高度模拟大脑结构的成果。


    从图2-32中可以看出，人工神经网络分为输入层、隐藏层、输出层。输入层负责数据的输入；中间几层神经元数据由于无法看到，称为隐藏层；输出层负责数据的输出。


    ![](images/txt002_36.jpg "pagenumber_ebook=59,pagenumber_book=48")


    图2-32　深度学习模型


    #### 5. 深度学习


    典型的深度学习模型（图2-32）其实就是多层神经网络。深度学习模型就像人工神经网络一样包含输入层、隐藏层和输出层。


    例如输入一张图片，利用深度学习识别图中的对象，设置的深度学习模型如图2-33所示。


    ![](images/txt002_37.jpg "pagenumber_ebook=60,pagenumber_book=49")


    图2-33　利用深度学习识别图中的对象


    在这个深度学习模型中，由于每一张图片都是由一个个像素构成的，我们将像素作为输入层的输入数据。


    隐藏层负责从图像中提取更多的抽象特征。


    根据给定像素，第 1隐藏层通过比较相邻像素的亮度来判定边缘。


    有了第 1隐藏层的边缘描述，第 2隐藏层通过搜索边缘判定角和轮廓。


    有了第 2隐藏层中关于角和轮廓的描述，第 3隐藏层通过搜索图像中的角和轮廓可以检测特定对象的整个部分。


    最后，根据图像所描述的对象进行识别，从而通过输出层输出。


    当然，根据设置的深度学习模型不同，隐藏层的层数与每一层神经元的个数也会不同，每一个隐藏层的功能也会不同。比如换一个深度学习模型，其第1隐藏层可能并不是在判定边缘。


    在深度学习中，为了使隐藏层能更准确地提取抽象特征，往往需要进行参数的调整。参数其实是个比较广泛的称呼，参数调整不仅包含数字的调整（比如之前在感知机中提到的权重，权重也是深度学习中重要的参数之一），也包含了一些网络结构的调整，比如可以增加或者减少隐藏层的层数与神经元的个数。


    ##### 知识拓展：像素


    像素是组成图像的最基本单元要素。将一张图片缩放至最大后，可以发现图片是由一个个小方格组成的，这些小方格就称为“像素”。它们都有一个明确的位置和被分配的色彩数值。


    ##### 体验感知


    打开手机微信，搜索小程序“你的AI”，选择不同的数据集，体验深度学习的工作过程。


    ##### 知识拓展：卷积神经网络


    `CNN`（卷积神经网络）是深度学习技术中具有代表性的网络结构之一。`CNN`在解决某些类型的问题（如图像识别）上取得了巨大成功，现阶段`CNN`在视频分析、自然语言处理等领域也有重要应用。


    `CNN`一般包含卷积层与池化层。


    以图像处理为例，`CNN`中卷积操作里会有一个卷积核。假设我们现在有一个如图2-34所示的卷积核（卷积核通常是远小于输入图像尺寸的数据矩阵）。


    卷积核就像一个滑动窗口，沿着表示输入图像的矩阵逐格滑动，进行卷积核与相应输入位置的处理（相乘再相加的操作），最终根据滑动的位置生成相应的输出，这一过程如图2-35—图2-37所示。


    设置不同的卷积核，可以探究图像中各种各样不同的细节。通俗地说，卷积的作用就是能从各个不同的角度将图片的本质看得清清楚楚，也就是帮助我们找到图片的特征。


    池化层的直接效果是降维，降维可以理解为减少数据量。池化层可以理解为将设定的区域用一个值表示。目前池化的方法有最大值池化与平均值池化，较为常用的是最大值池化，也就是在设定的区域选出一个最大值作为区域代表，由此可以获得图片更全局的特征。最大值池化的过程如图2-38所示。


    卷积加上池化，就可以从纹理特征逐渐扩展到局部特征，再扩展到全局特征。


