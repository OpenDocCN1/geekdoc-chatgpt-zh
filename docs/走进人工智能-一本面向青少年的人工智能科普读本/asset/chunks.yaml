    使用手机照片中人物分类功能时，它能识别照片中的人物，并能找到有这个人的所有照片，这也是使用了基于机器学习的算法（图2-8）。


    除了上面分享的应用场景外，生活中还有很多用到机器学习的地方。基于机器学习的算法也在人工智能许多技术中得到应用，比如语音识别、人脸识别等。机器学习可以说已经融入人们生活中的方方面面。


