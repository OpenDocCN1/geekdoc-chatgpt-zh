    # AI Hardware Computing Power and Core Technologies


    The core of AI hardware computing power lies in computer chips. The main types
    of AI chips are as follows.


    - **GPU (Graphics Processing Unit)**: A microprocessor that performs graphics
    and image-related computing tasks.

    - **FPGA (Field-Programmable Gate Array)**: A semi-custom circuit in the field
    of application-specific integrated circuits; it is programmable, upgradable, and
    iterable.

    - **ASIC (Application-Specific Integrated Circuit)**: An integrated circuit designed
    and manufactured to meet the requirements of a specific user and a specific electronic
    system, such as dedicated audio and video processors.

    - **Neuromorphic Chips**: An architecture among AI chips. It is designed by simulating
    the human brain. Compared with traditional chips, it has greater advantages in
    power consumption and learning ability.


    In 2017, the Institute of Computing Technology, Chinese Academy of Sciences, released
    the world''s first "neural network" processor chip capable of "deep learning"—"Cambricon"
    (Figure 1-14).


    In 2019, the Center for Brain-Inspired Computing Research at Tsinghua University
    developed the world''s first heterogeneous fused brain-inspired computing chip—"Tianjic".
    This achievement graced the cover of the top academic journal *Nature* (Figure
    1-15).


    In 2020, the University of Science and Technology of China, in collaboration with
    the Shanghai Institute of Microsystem and Information Technology of the Chinese
    Academy of Sciences and the National Parallel Computer Engineering Technology
    Research Center, successfully built "Jiuzhang," a 76-photon quantum computing
    prototype. "Jiuzhang" takes only 200 seconds to solve Gaussian boson sampling
    with 50 million samples, which is approximately 10 billion times faster than the
    fastest supercomputer at that time. This breakthrough made China the second country
    in the world to achieve "quantum supremacy."


    Data, algorithms, and computing power are the indispensable driving forces of
    AI. With the continuous upgrading of these three key technologies, the future
    of AI is promising.


