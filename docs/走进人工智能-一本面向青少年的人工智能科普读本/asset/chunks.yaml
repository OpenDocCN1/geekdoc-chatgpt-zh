    ## 2.2.2 General Process of Supervised Learning


    Like humans, learning by observing pictures that have already been labeled (we
    already know these are pictures of axolotls through Xiao Neng) is called "Supervised
    Learning" in the field of machine learning. Supervised learning usually means
    the machine learning data is labeled. For example, when recognizing axolotls via
    supervised learning, one needs to provide the machine with pictures labeled as
    axolotls. In this learning process, the labels are the guidance given by humans
    to the machine.


    The advantage of supervised learning is high learning efficiency. However, it
    also has obvious disadvantages: over-reliance on humans. When human guidance goes
    wrong—for instance, when the machine performs supervised learning on axolotls,
    if some non-axolotl image data is mixed into the large amount of labeled sample
    data provided by humans—the machine may not accurately extract the features of
    axolotls. Because this machine learning method relies heavily on the scope of
    human knowledge, it limits the machine''s learning range to a certain extent.
    For example, if humans don''t recognize axolotls either, they cannot provide labeled
    sample data, and the machine cannot learn axolotls under supervised learning,
    and thus won''t recognize them.


    #### Experience Perception


    Please use graphical programming software, load AI-related modules, show the computer
    a few pictures of axolotls, and see if the computer can accurately recognize axolotls.


    The idea of machine learning is that machines simulate processes in human life.
    Therefore, the general process of supervised learning is very similar to the human
    learning process we just mentioned.


    Let''s take a look at how a machine learns to recognize axolotls via supervised
    learning.


    In supervised learning, the machine will always give a judgment result: it is
    an axolotl, or it is not an axolotl. Therefore, when building a classification,
    two categories need to be established: one is axolotl, the other is not axolotl.


    ### 1. Collect Labeled Sample Data


    The first step of human learning is "Look." Therefore, in supervised learning,
    we input some "axolotl" pictures and some "non-axolotl" pictures to the machine.


    The "axolotl" pictures and "non-axolotl" pictures mentioned here are labeled sample
    data, where "axolotl" and "non-axolotl" are the given labels. At the same time,
    "axolotl" and "non-axolotl" are also the final output classifications of these
    pictures, which can be called "Classification Labels" (Figure 2-14).


    "Classification Labels" are the basis for picture classification. In supervised
    learning, "Classification Labels" are marked by humans, which also reflects human
    supervision and guidance in supervised learning.


    ![](img/txt002_16.jpg "pagenumber_ebook=43,pagenumber_book=32")

    **Figure 2-14　Collecting Labeled Data Samples**


    #### Knowledge Expansion


    **Classification Label**


    Classification labels can also be called "Labels." They are an important feature
    of supervised learning. Classification labels are actually the classification
    results. Simply put, before we conduct supervised learning, we need to tell the
    machine in advance how many categories the results are divided into (at least
    two), and determine the name of each category.


    > Note: To avoid "insufficient sample data" and "overly homogeneous sample data,"
    when collecting sample data, try to diversify as much as possible and collect
    more labeled sample data.


    ### 2. Feature Extraction


    Humans remember the characteristics of axolotls in pictures through their brains,
    while machines, through specific algorithms, remember the features of axolotls
    during the training process: six horn-like gills; broad face; four legs that are
    relatively short and thin; a fish-like tail; colors include white, yellow, black.


    The machine converts these features into "feature" data it can understand. "Features"
    reflect the attributes or traits in different aspects that distinguish "axolotls"
    from "non-axolotls." "Features" are the basis of machine learning, and the machine
    needs to extract them through comparison and induction.


    ### 3. Forming a Model


    After mastering these features, the machine forms a data model of the axolotl.
    In supervised learning, the feature values extracted from sample data are directly
    reflected in the model. The quality of the "model" can be said to be the core
    of the AI performance quality in supervised learning.


    ### 4. Verifying the Model


    When we give the machine some pictures of axolotls and other animals different
    from those collected (pictures not learned before), the machine will use the model
    formed through training to distinguish which are axolotls.


    If the machine can accurately identify which are axolotls and which are not, the
    model is considered reliable; if the machine cannot accurately identify, new sample
    data needs to be added to retrain the model, i.e., re-extract features and form
    another new model. This process can be understood as refining and improving the
    model.


    The general process of supervised learning is shown in Figure 2-15.


    ![](img/txt002_17.jpg "pagenumber_ebook=45,pagenumber_book=34")

    **Figure 2-15　General Process of Supervised Learning**


    #### Knowledge Expansion


    **Confidence**


    During supervised learning, the machine has a parameter called "Confidence," usually
    expressed in "%". This "Confidence" indicates the degree of reliability. For example,
    in a math exam, a student has 90% confidence of scoring 85-90 points. Then "85-90
    points" is the confidence interval, and "90%" represents the confidence level.
    Supervised learning is similar. If the model outputs 95% for "axolotl," then "axolotl"
    can be understood as the confidence interval, and "95%" represents the confidence
    level. In supervised learning, the higher the confidence, the more certain the
    model is about the output result.


    #### Thought Exploration


    What factors is confidence related to? If you want to increase confidence, what
    can you do?


    Generally, confidence is related to the collected sample data. The higher the
    quality and the larger the quantity of collected sample image data, the higher
    the confidence, and the more certain the model is about the output result.


