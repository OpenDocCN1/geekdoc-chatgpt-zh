    ##### Knowledge Expansion: Convolutional Neural Network


    `CNN` (Convolutional Neural Network) is one of the representative network structures
    in Deep Learning technology. `CNN` has achieved tremendous success in solving
    certain types of problems (such as Image Recognition). Currently, `CNN` also has
    important applications in Video Analysis, Natural Language Processing, and other
    fields.


    `CNN` generally contains Convolutional Layers and Pooling Layers.


    Taking Image Processing as an example, there is a Convolution Kernel in the Convolution
    Operation of `CNN`. Suppose we have a Convolution Kernel as shown in Figure 2-34
    (Convolution Kernels are usually data matrices much smaller than the input image
    dimensions).


    The Convolution Kernel acts like a sliding window, sliding step by step along
    the matrix representing the input image, performing processing at corresponding
    input positions (multiply and accumulate operations), and finally generating corresponding
    outputs based on sliding positions. This process is shown in Figures 2-35 to 2-37.


    Setting different Convolution Kernels allows exploration of various different
    details in the image. Colloquially, the role of Convolution is to see the essence
    of the picture clearly from various angles, i.e., helping us find image features.


    The direct effect of the Pooling Layer is Dimensionality Reduction, which can
    be understood as reducing data volume. The Pooling Layer can be understood as
    representing a set region with a single value. Current pooling methods include
    Max Pooling and Average Pooling. Max Pooling is more commonly used, i.e., selecting
    the maximum value in a set region as the region''s representative, thereby obtaining
    more global features of the image. The process of Max Pooling is shown in Figure
    2-38.


    Convolution plus Pooling allows gradual expansion from texture features to local
    features, and then to global features.


