    知识拓展


    大数据


    大数据是一种规模大到在获取、存储、管理、分析方面大大超出传统数据库软件工具能力范围的数据集合。大数据具有四大特征：海量的数据规模、快速的数据流转、多样的数据类型、低价值密度。


    思考探索


    说说你身边有哪些基于数据能为你提供个性化服务的案例。


    2.算法


    算法是解决问题、实现目的的方法。可以理解为，为了解决某个问题，先思考怎么做，用什么方法，再采取行动，进而解决问题。


    邓小平爷爷说过一句话：“不管黑猫白猫，能捉老鼠的就是好猫。”解决同一个问题，当然可以用不同的算法。


    学校里老师布置了语文、数学、英语、科学的作业。


