    #### 知识拓展：音量、音调和音色


    - **音量**，又叫响度。音量大小一般和产生声音的物体的振动幅度有关，振动幅度越大，音量就越大；振动幅度越小，音量就越小。一般用`dB`（分贝）来记录音量的大小。

    - **音调**高低一般和产生声音的物体的振动快慢有关。振动越快，音调就越高；振动越慢，音调就越低。

    - **音色**，又叫音品。音色反映的是声音的品质和特色，不同物体（包括人的声带）产生的声音音色是不同的，因此我们可以辨别不同的人讲话的声音。


