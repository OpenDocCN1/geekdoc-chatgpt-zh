    # 3.4 人脸识别


    大家一定发现，在我们的日常生活中，可以“刷脸”的地方越来越多了。车站、机场、码头安全检查时，可以“刷脸”加快进站速度；在银行、医院办理业务或者挂号付款时，“刷脸”可以快速认证用户身份，还能节约人力资源；商场、超市购物结账时，“刷脸”可以免密支付，提升购物的便捷体验……


    “刷脸”这个看似简单的事情，实际上是由计算机视觉技术作为支撑的。计算机究竟如何完成人脸采集和预处理，进行人脸检测、人脸对齐与人脸特征提取，实现人脸识别与活体检测的呢？人脸识别又有哪些优势和应用场景呢？让我们带着这些问题一起来探讨。


    ## 3.4.1 认识人脸识别


    人脸识别是基于人的脸部特征信息进行身份识别的一种生物识别技术。具体说来，就是用摄像头采集含有人脸的图像或视频流，并自动在图像中检测和跟踪人脸，进而对检测到的人脸进行脸部识别的一系列相关技术，通常也叫作人像识别或面部识别。


    1964年科学家构建的半自动人脸识别系统是最早期的关于人脸识别的研究。这个系统是基于人脸特征的几何参数，包括面部各个器官的几何特性，比如双眼间距、头宽、鼻高、耳朵位置等面部关键特征点的相对几何关系。


    但是人脸特征点的精确定位本身就是一个比较困难的问题，很容易受到姿态和表情等变化的影响，所提取到的人脸几何特征又非常简单，丢失了其他大量的可供提取的特征信息。所以基于简单几何特征的算法总体识别准确率并不高。


    人脸识别技术的发展一直很缓慢，直到深度学习技术诞生，人脸识别技术获得了爆发式的发展。2014年中国科学家在深度学习结合人脸识别领域取得优异成绩，在人脸数据集`LFW`上识别准确率超过了99%，已经超越人类在该数据集上97.52%的识别准确率。据新闻报道，2018年在全球人脸识别算法测试大赛上，共有来自全球的39家企业和机构参与，排名前五的算法被中国包揽；2019年中国公司又一举夺冠，显示出了持续而强大的竞争力。


    > **思考探索**

    >

    > 除了以上的场景，还有哪些场景可以用到人脸识别技术？


    ## 3.4.2 人脸采集和图像预处理


    人脸识别过程中需要先采集人脸图像。根据采集人脸的场景不同，一般可以分为两类。


    第一类场景叫作**限制条件下的人脸拍摄**。比如要求坐姿标准，正对、平视镜头，不戴帽子、眼镜，甚至还有对光线明亮的要求，大家可以猜猜看，这样的场景在哪里呢？


    拍摄证件照时就是这一类场景。我们在升学、出境旅游、申请身份证时会拍摄这样的图像。计算机对识别这样的人脸图像是最有利的，目前国际上对这类人脸图像领先的识别准确率超过99%。


    第二类场景叫作**非限制条件下的人脸拍摄**。在日常生活中，自然条件下拍摄到的人脸存在着各种问题，比如侧对镜头、暗光、强光、背光、遮挡、模糊等，这样获取到的图像必然影响人脸算法的识别准确率。如果将第一类场景的算法照搬到这里，只能勉强达到60%～70%的识别准确率。所以为了提升算法的识别准确率，有必要从采集端着手，提升图像采集的质量，同时可以对采集的人脸图像进行预处理，提升图像质量。


    那么我们该怎么预处理呢？图像增强是一种经常采用的图像预处理方式。例如环境光线太弱会造成图像变黑（曝光不足），这时可以采用暗淡部分增强、去除暗背景下的噪点、提升图像的分辨率、去除运动时的图像模糊等方法进行图像增强。


    具体有以下两种方法。


    ### 1. 提升图像分辨率


    图像分辨率的提升，给人们最直观的感受就是图像变更精细了，在非限制条件下采集的人脸通常因为距离较远，都不会太大，识别人脸特征会比较困难。我们可以使用插值算法增加像素点，提升分辨率。插值的方法有很多，这里我们只讨论最基础的最邻近插值法（图3-47）。


    可以这样理解，一个`3×3`的像素图像（图3-47a）要放大到`4×4`大小（图3-47b），可以随机选择第二列中某一点，如图3-49b所示的绿色像素点即为要插入的像素点，但这个点在原始图像中并不存在，我们不知道它的灰度值，所以把`4×4`图像按照比例缩小到`3×3`大小，然后叠加到`3×3`原始图像上（图3-47c），这时会发现这个像素点大部分与`3×3`图像中间那个像素重合，所以就把增加的这个点的灰度值设定为`3×3`图像中间那个像素点一样的灰度值。按照这个办法，就可以把图像放大了。


    ![](images/txt003_49.jpg "pagenumber_ebook=88,pagenumber_book=77")


    图3-47　最邻近插值法


    ### 2. HDR技术


    大家可能注意到有些手机的拍照界面上有`HDR`字样（图3-48），那大家知道什么是`HDR`吗？它有什么作用呢？


    ![](images/txt003_50.jpg "pagenumber_ebook=88,pagenumber_book=77")


    图3-48　手机拍照界面


    使用相机拍照，在前景与背景的光线明暗不一致时，就会出现这样的情况：点击光线明亮的区域对焦时，光线较暗的区域会漆黑一片（曝光不足），因为大部分数码相机的对焦和测光同时进行，就像图3-49一样。


    同样的原因，如果点击光线较暗的区域对焦，光线明亮区域的画面细节就会丢失（曝光过度），如图3-50所示。


    这时候就需要`HDR`技术来帮忙了，它的中文名称是高动态范围成像（`High Dynamic Range Imaging`）。


    `HDR`技术的原理大致可以这样理解，计算机在很短的时间内拍摄同一视角范围内的多张图像，然后利用算法处理将这些图像合并在一起，让暗的部分变亮、亮的部分变暗，以达到同时保留高光细节与暗部细节的目的，其效果如图3-51所示。


    ![](images/txt003_51.jpg "pagenumber_ebook=89,pagenumber_book=78")


    图3-49　曝光不足


    ![](images/txt003_52.jpg "pagenumber_ebook=89,pagenumber_book=78")


    图3-50　曝光过度


    ![](images/txt003_53.jpg "pagenumber_ebook=89,pagenumber_book=78")


    图3-51　使用HDR技术拍摄的照片


