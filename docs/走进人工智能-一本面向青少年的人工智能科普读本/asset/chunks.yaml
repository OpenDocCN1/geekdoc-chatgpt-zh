    知识拓展


    “智”和“能”的定义


    《荀子·正名》中记载：“所以知之在人者谓之知，知有所合谓之智。所以能之在人者谓之能，能有所合谓之能。”这里认为进行认识活动的一些心理特点被称为“智”，进行实际活动的一些心理特点被称为“能”。


    1.1.3　图灵测试


    艾伦·图灵是被誉为“计算机科学之父”和“人工智能之父”的英国数学家、逻辑学家、密码学家。计算机领域的最高奖项图灵奖就是以其名字命名的。


    1950年，图灵在《计算机与智能》一书中提出了著名的图灵测试（The Turing Test）和“机器智能”（Machine Intelligence）。


    图灵认为机器是可以进行思考的，但这需要机器具有快速的运算速度，具备超出人脑的逻辑单元与记忆容量，同时编制大量的智能化程序，并提供恰当类别、足够数量的数据。


    如何判断机器是否具备思维能力呢？在图灵测试中，就提供了一种检测机器是否具备人类智能的方法（图1-4）。简单说来，就是将一台机器A和一个人B作为被测试者，再选一个人C作为测试者，这里需要将测试者和被测试者隔离，也就是将机器A和人B放在一个房间，人C放在另一个房间。通过一些装置（如键盘），人C向机器A和人B进行随意的提问，经过几轮提问和回答后，如果有30%的回答让作为测试者的人C无法区分是由人B还是机器A做出的，那么就可以认为这台机器A具有智能。


    ![](images/txt001_5.jpg "pagenumber_ebook=16,pagenumber_book=5")


    图1-4　图灵测试


