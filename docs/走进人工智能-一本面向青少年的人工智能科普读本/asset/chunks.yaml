    Figure 2-38　Max Pooling Process


    ##### Knowledge Expansion: Generative Adversarial Network


    `GAN` (Generative Adversarial Network) is a Deep Learning model. The principle
    of `GAN` can be understood through an example. For instance, a criminal makes
    counterfeit money. Initially, due to poor technique, the police immediately spot
    the fake. Learning from failure, the criminal improves the technique; this time
    the counterfeit money is not so easily identified. The police then realize the
    criminal''s technique is improving, so they enhance their detection skills to
    prevent circulation. This adversarial process continues: the criminal''s counterfeits
    become more realistic, and the police''s detection ability grows stronger. Both
    sides compete, mutually improving their techniques. This is the basic idea of
    `GAN`.


    `GAN` consists of two main parts—Generator and Discriminator. The Generator produces
    realistic fake samples; the Discriminator identifies generated samples. If generated
    samples are not realistic enough, the Discriminator easily identifies them as
    fake. To improve output quality in this model, we need a good Generator and Discriminator;
    only when both are excellent will the final generated samples be realistic enough.
    `GAN` is widely used in Image Inpainting, Artistic Creation, and other fields.
    Notably, the painting *Edmond de Belamy* created by `GAN` sold for approx. 3 million
    RMB at auction.


