    \uFEFF\n\n第1章　人工智能概述\n\n导　言\n\n![](images/txt001_1.jpg \"pagenumber_ebook=12,pagenumber_book=1\"\
    )\n\n本章从世界人工智能大会说起，简述人类智能的含义与人工智能的定义。以图灵测试、达特茅斯会议为起点介绍人工智能的发展历史，讲解人工智能的三要素——数据、算法、算力。以生活中的实例诠释计算机视觉、智能语音、计算机博弈、自然语言处理等人工智能相关技术的应用。\n\
    \n![](images/txt001_2.jpg \"pagenumber_ebook=12,pagenumber_book=1\")\n\n1.1　初识人工智能\n\
    \n1.1.1　从世界人工智能大会说起\n\n未来已来！人工智能（Artificial Intelligence，AI）正不知不觉走进我们的生活，属于人工智能的时代已经来临。\n\
    \n从2018年起，上海每年都召开“世界人工智能大会”（WAIC）。2020年“世界人工智能大会”上设置了青少年人工智能创新发展论坛（图1-1）。\n\n\
    少年智则国智，少年强则国强。人工智能从娃娃抓起，为青少年营造人工智能的学习环境，是青少年人工智能创新发展论坛中永远的主题。\n\n习近平总书记说：“人工智能是引领新一轮科技革命和产业变革的战略性技术。”作为新时代的青少年，我们应当用实际行动投入人工智能的探索。今天我们在这里学习，未来我们走向全球（图1-2）。\n\
    \n![](images/txt001_3.jpg \"pagenumber_ebook=13,pagenumber_book=2\")\n\n图1-2　人工智能青少年倡议\n\
    \n小伙伴们，我们人小鬼大，让我们用天真烂漫的童趣，为人工智能涂抹绚烂色彩。\n\n绿苗苗们，我们勤于思考，让我们用天马行空的创意，为人工智能增添无限遐想。\n\
    \n少先队员们，我们时刻准备，让我们用创新探索的智慧，为人工智能发展增智助力。\n\n共青团员们，我们敢为人先，让我们用力学笃行的实践，为人工智能凝聚青春活力。\n\
    \n青年朋友们，我们蓄势待发，让我们用“无畏一切”的担当，为人工智能飞跃聚势领航。\n\n——2019世界人工智能大会闭幕式上，上海市青少年人工智能创新大赛获奖选手代表发出的倡议\n\
    \n知识拓展\n\n世界人工智能大会\n\n世界人工智能大会是由国家发展和改革委员会、科学技术部、工业和信息化部、国家互联网信息办公室、中国科学院、中国工程院和上海市人民政府共同主办的大会，是世界顶尖的智能合作交流平台、具有国际水平和影响力的行业盛会。\n\
    \n2018年世界人工智能大会的主题是“人工智能赋能新时代”。\n\n2019年世界人工智能大会的主题是“智联世界　无限可能”。\n\n2020年世界人工智能大会云端峰会的主题是“智联世界　共同家园”。\n\
    \n全球人工智能领域最具影响力的观点与共识在此汇聚，展示前沿的新理念、新技术、新产品与新应用，具有“高端化、国际化、专业化、市场化、智能化”的特点。“世界智慧”在此交流沟通，开展高端对话，打造“中国方案”。\n\
    \n1.1.2　人类智能遇见人工智能\n\n“智能”是什么，迄今为止人类对于这个问题并没有广泛的共识。人类运用思维解决问题，这其中包含逻辑、推理等一系列动作，但事实上人类解决问题的方法往往并不唯一，甚至有时候，我们很难判定谁的方法更好。\n\
    \n智商测试仪器也许能测试一个人的智商，但是一定能说智商高的人拥有更多智能，对社会更有贡献吗？\n\n答案并非如此。首先，高智商不仅代表高智力，也代表着创新能力，善于思考，具有发现问题、解决问题的能力。其次，除了智商，我们还需要有一定的情商，而情商是认识自我、控制情绪、鼓励自己，以及处理人际关系、参与团队合作等相关的个人能力的总称。最后，我们还需要有正确的价值观，能分辨是非，具有甄别能力。综上所述，也许这才是人类社会更需要的智能。\n\
    \n人类智能的定义尚且没有达成共识，人工智能也一样。\n\n2019年，参加世界人工智能大会的科学家给出关于人工智能的五种定义：\n\n定义一：人工智能是让人觉得不可思议的计算机程序。\n\
    \n定义二：人工智能是与人类思考方式相似的计算机程序。\n\n定义三：人工智能是与人类行为相似的计算机程序。\n\n定义四：人工智能是会学习的计算机程序。\n\
    \n定义五：人工智能是根据对环境的感知做出合理的行动，并获得最大收益的计算机程序。\n\n对于人工智能的定义，目前较为普遍的认知是，人工智能是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。\n\
    \n在一本书中记载了科学家艾伦·图灵（Alan Turing）和警察的一段对话：\n\n警察　机器能思考吗？\n\n图灵　好吧，在我看来，你这个问题本身就很愚蠢。\n\
    \n警察　是吗？\n\n图灵　机器当然不能像人一样思考。一台机器跟一个人是不一样的。因为两者的思考方式不同。有趣的是，正是因为某些东西跟你的思维方式不同，就意味着它们不能思考吗？\n\
    \n我们允许人类的思想千差万别。你喜欢香蕉，我讨厌长跑；你喜欢悲伤的电影，我更喜欢喜剧。不同的口味，不同的兴趣，不同的偏好，到底意义在哪里？"
  fmt: "\n# 编委会\n\n**主　编**　吴　皓　徐　速\n\n**副主编**　张岱虹　单学英　金　璠　金海艳　宋立新　吴　斌\n\n**编　委**　白浩斌　贾德立　冯　英　徐嫣琼　甘仲巍　朱　敏　顾海灵　居晓波　鲍若凡　张元平　平云婕　李文静\n\
    \n**插　画**　陈　樑　仇宇辉　郑崇洲　林　琦　周　颖　李伟健\n\n# 序\n\n我国经济社会快速发展、信息基础设施不断完善，为信息化进一步发展打下了坚实基础，而人工智能时代的到来，将把信息化提升到新的高度。当下，人工智能这个词已经频繁在我们生活和工作中出现，畅想未来，人工智能在教育、医疗、交通、工业、商业等领域将会有更多可以预见或超越想象的应用。\n\
    \n世界人工智能大会在上海成功举办，为青少年近距离参与人工智能、分享人工智能提供了很好的机会。由共青团上海市委员会牵头指导的上海市青少年人工智能创新大赛让新时代的科技雏鹰在这一平台上起飞；青少年人工智能创新发展论坛则聚力青春、对话未来，激励广大青少年激荡人工智能的风浪，实现自身的发展。\n\
    \n为了让人工智能技术惠及更多青少年，上海市青少年活动中心编著了“人工智能从娃娃抓起”系列丛书之《走进人工智能》，这是一本面向青少年读者的有趣的人工智能科普读本。全书从人工智能概论出发，到人工智能的表现形式——会学习、会看、会听说，最后到人工智能伦理，渐渐揭开人工智能的面纱，较为系统地描绘了人工智能这门交叉学科。全书重在科普，巧在体验，在逐步感知中走进人工智能，在动手探索中感悟人工智能。通过一些有趣的类比，将原本“神秘”的人工智能深入浅出地进行讲解，为青少年感知和认知人工智能铺平道路，让青少年能更科学、更理性、更全面地了解人工智能。\n\
    \n教育兴则国兴，教育强则国强，我们要培养能够担当民族复兴大任的时代新人。只有做好了青少年的人工智能科普教育，才能使中国在世界人工智能领域处于领先地位成为可能。青少年人工智能科普读本的推出，也体现了习近平总书记强调的“少年强则国强”的理念。\n\
    \n未来人工智能时代的竞争是人才的竞争，人才的竞争离不开人才的培养，愿这本书在青少年的心中种下一颗人工智能的种子，静待花开，未来可期。\n\n> 中国科学院院士\
    \  \n> 上海交通大学副校长  \n> 上海少年科学院人工智能分院名誉院长\n\n# 前言\n\n亲爱的青少年朋友们，新一代人工智能的迅速发展正在深刻改变着我们身处的这个世界，影响着我们的学习、生活和工作。认识、理解、应用人工智能可以帮助我们更好地面向未来。\n\
    \n什么是人工智能？目前它擅长做什么，哪些事情还做不到？它的神奇之处究竟来源于哪里？它在给我们带来快捷、便利的同时，有什么潜在的风险？这些问题你可能曾经想过，也可能很快就会遇到，但想要回答却并不容易，因为人工智能涉及许多学科和领域的知识。希望我们编写的这本读本，能以深入浅出的方式带大家接近并找到想要的答案。\n\
    \n“人工智能”其实并不是一个新鲜的词汇。自1956年被提出以来，至今已有六十余年，在此期间经历了几个重要的发展时期。基于大数据的深度学习引发了人工智能发展的新浪潮，数据、算法、算力互相助力，成为人工智能发展的三要素。\n\
    \n现在的人工智能究竟和之前的有什么区别呢？一直以来，计算机在完成某个任务时都是依靠程序来驱动的，这些程序可以简单理解为人们事先设定好的众多规则，其中有些规则可能非常复杂。即便如此，在解决某些问题时的效果却并不好，而现在的人工智能在做的一件事，就是根据人们输入的数据信息，自行构建其中的一些规则，从而解决这些问题。这听上去是不是特别神奇？然而在了解了它的工作原理后，也许你会说“哦，原来是这样”。\n\
    \n本书是“人工智能从娃娃抓起”系列丛书的第一本，是上海市青少年活动中心、上海少年科学院为响应国家“发展新一代人工智能”的号召，整合多方资源打造的青少年人工智能科普读本。全书从人工智能概述、会学习的人工智能、会看的人工智能、会听说的人工智能、人工智能伦理五个方面展开，以“先见林，再见树”的理念，带领青少年朋友们纵览当前人工智能领域的各个方面。丛书后继书目还将具体学习探索与人工智能相关的算法和程序设计、开源硬件和科技创新项目等。\n\
    \n在2020世界人工智能大会云端峰会青少年人工智能创新发展论坛上成立的上海少年科学院人工智能分院，以这本读物为学习材料，打造了相匹配的青少年人工智能科普课程。基于青少年学习人工智能的实际问题，组织思考探索、体验感知，进行知识拓展、动手实践，旨在探索人工智能科学普及、科技创新的新方向、新路径，帮助广大青少年走进人工智能新世界，积极为人工智能领域储备青少年人才。\n\
    \n参与本书编写的有上海市青少年活动中心、上海少年科学院的指导老师，也有教研员及中小学的一线教师。本书编写期间得到了陈向东、方向忠、谢忠新、张汶、徐雄、费宗翔、李诚、刘啸宇等专家的指导与帮助，在此表示衷心的感谢！\n\
    \n希望我们的“人工智能从娃娃抓起”系列丛书能陪伴广大青少年朋友一起度过探索人工智能世界的快乐时光。\n\n# 目　录\n\n- [编委会](#编委会)\n\
