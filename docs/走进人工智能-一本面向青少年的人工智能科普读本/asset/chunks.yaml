    ## 1.3 走进人工智能


    在许多电影中，机器人都具备人工智能，但是我们需要知道，机器人仅仅是人工智能的一种载体，并不是说人工智能就等于机器人。


    人工智能包含许多技术，机器能像人一样会“看”是使用了计算机视觉技术；会“听”是使用了智能语音技术中的语音识别；会“说”是使用了智能语音技术中的语音合成；会“学习”是使用了机器学习技术。


    不仅如此，人工智能还包含自然语言技术、知识图谱、虚拟现实（VR）/增强现实（AR）、人机博弈等。


    ### 1.3.1 计算机视觉


    明星演唱会有时还附加了“抓捕逃犯”的功能！仅通过华语乐坛一位明星在2018年的巡回演唱会，前前后后共抓捕了 55名在逃犯人。这些抓捕行动得以圆满完成，背后有一个大“功臣”——天网工程。天网工程的核心技术之一就是计算机视觉的图像处理与识别技术。通过设置在现场的高清摄像头，清晰地捕捉到演唱会现场观众的面部特征，并且迅速和公安系统信息库中存储的信息进行对比。一经发现疑犯，立即采取行动抓捕，真正做到了“天网恢恢，疏而不漏”。


    计算机视觉技术除了可以帮助抓捕逃犯，在日常生活中也给我们带来了很多便利。例如，手机上的人脸识别功能我们经常用来解锁手机、完成支付等；人脸识别考勤系统在很多公司也得到了应用（图1-16）。


    ![](images/txt001_18.jpg "pagenumber_ebook=27,pagenumber_book=16")

    图1-16　人脸识别考勤系统


    计算机视觉技术在医疗领域也有广泛的应用。与医学影像结合，发展成为“智能医学影像”。原本一个放射科医生每天接诊近百名患者，那么他一天要分析的影像就达到近千张。“智能医学影像”能大大减少医生的压力，它的自动化分析速度比一般放射科医生要快
    62%～97%，每年可以节省大量人工费用。


    计算机视觉还拓展出了三维视觉、图像风格化等功能。比如人工智能还能使图片更加艺术化，使平凡的图片具有莫奈的《睡莲》这种印象派风格，使普通图片变成艺术作品。


