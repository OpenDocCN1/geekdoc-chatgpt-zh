    3.3.1　目标检测


    当计算机面对一张图片的时候，最基础的任务就是识别出这张图片上是什么。是风景还是人物，是建筑物还是食物，这其实是一种图像的分类，可以简单理解成为不同的图片打上对应的标签。当知道了图像的类别，例如我知道这个图像是关于狗和其他物体的，那么这只狗在图片中的什么位置，能不能使用方框把它标出来？或者当图片中包含一群狗的时候，虽然计算机能够识别出图像中包含狗，却并不知道图中出现了几只狗。


    这个时候就需要对图像做进一步的处理，即进行目标检测（图3-34）。


    ![](images/txt003_36.jpg "pagenumber_ebook=78,pagenumber_book=67")


    图3-34　目标检测


    图像识别与目标检测的区别：在图像识别中，整幅图像被分类为单一类别，给予单一标签；在目标检测中，计算机需要找出图像中目标的位置和个数并辨认出它们是什么（图3-35）。


    ![](images/txt003_37.jpg "pagenumber_ebook=79,pagenumber_book=68")


    图3-35　对狗和娃娃图的目标检测


    目标检测方法1：传统的目标检测


    传统的目标检测方法使用人工设计的特征算子提取图像特征用于目标检测。我们以一种单一尺度的目标检测方法为例，使用固定大小的检测框，在被检测图像上从左到右、从上到下移动检测，每在一个位置上检测时，都会把这个区域内的图像输入分类检测算法中。然后分类检测算法会判断这个区域内是否有物体，如果有的话就会对物体进行分类处理，一旦物体达到或超过某一分类标签的阈值，就将这个检测框标示出来，并贴上分好类的标签。因为计算机的处理速度非常快，所以对整张被检测图像的所有区域重复进行这样的操作很快就可以完成，也就得到了最终的检测结果。


    当然，在实际运用中，目标检测方法要复杂得多，这里为了方便大家理解做了一定的简化。不过，这种检测方法也有着明显的不足，比如到底设置多大的检测框才比较合适呢？检测框太大了无法对检测区域内的图像进行分类（图3-36a），太小了又无法检测到比较大的物体（图3-36b）。为了优化这种目标检测方法，人们又做了很多的尝试，这里就不一一展开了。


    ![](images/txt003_38.jpg "pagenumber_ebook=79,pagenumber_book=68")


    图3-36　检测框的设置


    ![](images/txt003_39.jpg "pagenumber_ebook=80,pagenumber_book=69")


    图3-37　基于神经网络的目标检测


    目标检测方法2：基于深度学习的目标检测


    基于深度学习的目标检测方法使用从神经网络中学到的图像特征来进行目标检测。


    简单地说，首先通过某些特征框的选择搜索算法，从待检测的图像中提取出成百上千个大大小小的目标候选框，然后把这些候选框内的图像分别送到神经网络中，最后针对提取到的图像特征，进行分类并得到类别信息，以及对应于原图像的位置坐标信息，从而实现目标检测并得到检测结果（图3-37）。


    由此可以发现，目标检测作为一种较为精细的目标，其达成的难度是远大于图像分类的。


    知识拓展


    平面直角坐标系


    在数学上有这样一个定义，在平面内画两条互相垂直，并且有公共原点的数轴。其中横轴为x轴，纵轴为y轴。这样就在平面上建立了平面直角坐标系，简称直角坐标系。


    用一组有序的数（x， y）可以表示平面上的一个点，换句话说，平面上的一个点可以用一组两个有顺序的数来表示，也就是坐标系上这个点的坐标。如果知道坐标系中两个点的坐标，就可以通过它们计算出两个点之间的线段长度。同样，如果知道坐标系中三个点的坐标，就可以计算出由这三个点构成的三角形的面积（图3-38）。


    ![](images/txt003_40.jpg "pagenumber_ebook=80,pagenumber_book=69")


    图3-38　平面直角坐标系


    3.3.2　目标跟踪


    到这里，我们已经了解了对图像的目标检测。不过刚才的图像都是静态的，在现实生活中有更多的应用场景需要在动态的视频中对目标进行跟踪。例如在视频的第一帧图像中标出待跟踪目标，并在后续图像中找到同一目标，对这一目标在下一帧中的位置进行预测，这就是目标跟踪。


    目标跟踪技术在智能监控系统、无人驾驶、视频检索、导弹制导、人机交互和工业机器人等领域具有重要的作用。


    如何实现目标追踪呢？其实方法有很多，我们讨论如下两种方法。


    方法1：逐帧检测的目标跟踪


    在视频的第一帧图像中，设定需要追踪的目标，然后在接下来的视频序列的每一帧图像中找到相似度与目标最大的区域。换句话说，提取第一帧中目标的特征进行学习，再对之后的每一帧图像进行检测，从而确定目标在每一帧的位置。


    方法2：基于帧间关系的目标跟踪


    因为目标跟踪的本质是根据第一帧的数据训练相关算法，所以必然导致训练的数据非常有限。针对这一问题，可以使用一个在图像分类数据集上预训练得到的通用的特征提取模型。在实际跟踪时，通过利用当前跟踪目标的有限样本信息对预训练模型进行微调。简单说来，就是在视频中寻找追踪目标的时候，第一次寻找需要在整个画面中找到目标的位置。但在下一帧图像中就不用在整个画面中寻找目标了，而是在上一帧目标出现位置的附近寻找就可以了。与逐帧检测的目标跟踪算法相比，这种方法不需要每次对全图作检测，只需要在上一次的检测框周围进行扫描即可，提高了检测的效率。


    目前，目标跟踪在比较复杂的条件下，要实现实时的、准确的跟踪，依旧面临很多困难，主要的挑战有以下这些：


    （1）形态变化：运动目标发生姿态变化时，它的几何特征以及外观模型可能会发生改变，因而导致跟踪失败。


    （2）尺寸变化：当跟踪目标缩小时，会将很多背景信息包含在内，导致目标模型的更新出错；当跟踪目标增大时，由于跟踪范围不能将目标完全包括在内，检测框内目标信息不全，也会导致目标模型的更新出错。


    ![](images/txt003_41.jpg "pagenumber_ebook=82,pagenumber_book=71")


    图3-39　目标被遮挡


    （3）图像模糊：分辨率降低、目标快速运动、光照强度变化、运动目标与背景相似等情况都会导致图像模糊。


    （4）目标被遮挡：目标跟踪除了要求在每一帧图像上检测出目标，还要求预测目标的位置，这是因为有时目标会被短暂遮挡或者短暂消失，否则由于找不到目标的对应模型，就会导致跟踪失败。所以，遇到这样的问题就需要目标跟踪算法能预测目标最有可能出现的位置（图3-39）。


    体验感知


    有些手机云台只要点击跟踪按钮，在屏幕上圈出需要跟踪的目标，云台就会自动调整方向，无论是目标移动，还是云台自身移动，都可以准确地跟踪被拍摄的目标（图3-40），有机会的话可以体验一下。


    ![](images/txt003_42.jpg "pagenumber_ebook=82,pagenumber_book=71")


    图3-40　目标跟踪示意图


    3.3.3　目标跟踪的应用


    目标跟踪作为计算机视觉技术的一个重要研究方向，在军事和民用方面都有着十分广泛的应用。军事方面包括无人飞行器、精确制导导弹、空中预警、战场监视等；民用方面包括无人驾驶、自动机器人、智能视频监控、人机交互、增强现实等。


    1.军事用途


    目标跟踪的军事用途如图3-8和图3-41所示。


    ![](images/txt003_43.jpg "pagenumber_ebook=83,pagenumber_book=72")


    图3-41　军用无人机


    2.民用方面


    （1）智能视频监控


    ①基于步态特征的身份识别（图3-42）。每个人走路的姿态都是不一样的，计算机能识别出人体各个大关节的弯曲、摆动、高度、周期等特征，从而区分每个人。即使有人戴上口罩、帽子故意遮挡面部，计算机仍然能够识别出此人。


    ![](images/txt003_44.jpg "pagenumber_ebook=83,pagenumber_book=72")


    图3-42　目标跟踪在步态特征身份识别中的应用


    ②基于人脸识别的目标跟踪。通过识别人脸特征，计算机能区分每一个人，具体原理我们将在之后详细讨论。


    ③车载计算机检测行驶途中遇到的物体，比如行人、障碍物、红绿灯、周围的车辆等，检测自己与周围物体的距离变化，从而防止车辆与行人或其他车辆发生碰撞，防止闯红灯等交通违法行为的发生。


    ④交通管理部门在公路边、道口等位置安装的摄像头，会采集来往车辆的车牌等信息，实时监控各种交通信息，包括车流密度、行驶速度、交通事故等（图3-43）。


    （2）人机交互


    传统人机交互是通过计算机键盘和鼠标进行的，计算机能识别和理解人的姿态、动作、手势，目标跟踪是其中比较关键的技术。


    比如手部追踪加手势识别，就能检测图像中所有的手，识别手势类型（图3-44），包括自拍、他人拍摄、各种角度等多样化场景。


    计算机不仅能识别人的姿态、动作、手势、表情，还能将人像叠加在虚拟3D环境中进行交互，可以给参与者更加丰富的交互体验，比如很多App都有美颜、换脸、实时跟踪表情等功能（图3-45）。


    ![](images/txt003_45.jpg "pagenumber_ebook=84,pagenumber_book=73")


    图3-43　目标跟踪在交通监视中的应用


    ![](images/txt003_46.jpg "pagenumber_ebook=85,pagenumber_book=74")


    图3-44　手势识别


    ![](images/txt003_47.jpg "pagenumber_ebook=85,pagenumber_book=74")


    图3-45　实时卡通人脸变换


    （3）医学诊断


    目标跟踪在超声波和核磁共振三维建模图像的自动分析中有着广泛应用。例如超声波图像中的噪声经常会遮盖单帧图像的有用信息，使静态分析有时变得十分困难，而通过跟踪技术利用序列图像中目标在几何上的相关性和时间上的连续性，可以获得更准确的分析结果（图3-46）。


    ![](images/txt003_48.jpg "pagenumber_ebook=85,pagenumber_book=74")


