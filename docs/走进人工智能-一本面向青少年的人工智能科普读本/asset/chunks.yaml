    ### 4.2.3 Characteristics of Sound


    After sound is converted into digital signals of 0s and 1s that computers can
    directly process, waveforms and spectrograms are mostly used to represent them,
    facilitating observation and editing of digital sound signals on computers.


    Different people saying the same words and producing the same sounds have different
    sound waveforms. This is because different people speaking produce sounds with
    different characteristics (Figure 4-18, Figure 4-19).


    - **Different volumes**: Some sounds are louder, some are softer.

    - **Different pitches**: Some sounds are higher, some are lower. The "soprano"
    and "bass" singers we often refer to indicate the height of the pitch.

    - **Different timbres**: As the saying goes, "hear the voice but not see the person,"
    meaning that although the person is not seen, hearing their voice reveals who
    it is. Identifying human voices here is mainly through the timbre of the sound.


    Note here that a waveform graph cannot represent timbre characteristics; a spectrogram
    is needed to achieve this (Figure 4-20, Figure 4-21).


    ![](img/txt004_21.jpg "pagenumber_ebook=105,pagenumber_book=94")

    Figure 4-18　Waveform of male voice reading "Artificial Intelligence"


    ![](img/txt004_22.jpg "pagenumber_ebook=105,pagenumber_book=94")

    Figure 4-19　Waveform of female voice reading "Artificial Intelligence"


    ![](img/txt004_23.jpg "pagenumber_ebook=105,pagenumber_book=94")

    Figure 4-20　Spectrogram of male voice reading "Artificial Intelligence"


    ![](img/txt004_24.jpg "pagenumber_ebook=105,pagenumber_book=94")

    Figure 4-21　Spectrogram of female voice reading "Artificial Intelligence"


    #### Knowledge Expansion: Binary


    We usually use the decimal system in mathematics, where the maximum digit in each
    position is 9, and a carry occurs every 10. What is binary? Simply put, in binary,
    the maximum digit in each position is 1, and a carry occurs every 2, so there
    are only two digits in binary: 0 and 1. Electronic circuits have only two states:
    "open" and "closed," which can be perfectly represented by 0 and 1 respectively,
    so binary is used in computers and many electronic devices.


    The modern binary numeral system was designed by the famous German philosopher
    and mathematician Gottfried Wilhelm Leibniz in 1679. In fact, systems related
    to binary also appeared in ancient Egyptian, Chinese, and ancient Indian cultures,
    especially China''s *I Ching* (Book of Changes), which gave Leibniz more inspiration.


