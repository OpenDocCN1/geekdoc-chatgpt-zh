    ### 4.3.5 语言模型的作用


    汉语博大精深，相同的读音会有很多不同的字和词，那么怎么知道究竟哪个字词是正确的呢？


    就拿`r e n g o ng`为例，经过声学模型和发声词典的匹配后，可能得到同音的词语有仁公、人工、任工。


    例如在“这是一种人工打标签的方法”的语音中，机器该选哪个词语呢？这些词语在我们看来，很容易挑出正确的答案，但对机器来说却没有什么差别，这时就需要语言模型的帮助。它的主要作用就是从这些同音字词中，根据人们的语言习惯，筛选出最符合语句原本意思的字词，再将字词组合成句子。


    #### 知识拓展：循环神经网络


    `RNN`（循环神经网络，Recurrent Neural Network）是神经网络的一种，与传统的神经网络相比，每层的神经元之间也会有连接，这样的结构对处理序列化的数据很有优势。对一个序列而言，当前的输出与前面的输出有关，而语音识别时讲话的语音就是有时间序列的数据，往往前面的话和后面的话是有关联的，也就是我们平时说的联系上下文，所以运用`RNN`对语音数据和文本数据进行学习训练，生成声学模型和语言模型，就可以对输入的语音进行很好的识别。


    #### 知识拓展：音素的划分


    如果我们根据语音的自然属性对一句语音进行划分，那么分出来的最小的语音单位，就是音素。从发音动作上来说，一般一个发音动作形成一个音素，比如 `mi` 包含了
    `m` 和 `i` 两个发音动作，所以是两个音素。另外，同一音素的发音动作相同，不同音素的发音动作不同，比如 `mi-ma`，当中的两个 `m` 是同一音素，发音动作相同，而
    `i` 和 `a` 是不同的音素，所以发音动作也不同。人们通常就是根据发音动作来对音素进行分析的。


