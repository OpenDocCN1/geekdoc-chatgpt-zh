    # 3.4 Face Recognition


    You must have noticed that in our daily life, there are more and more places where
    you can "scan your face" (facial recognition verification). At security checks
    in stations, airports, and docks, "face scanning" speeds up entry; when handling
    business or registering and paying at banks and hospitals, "face scanning" can
    quickly verify user identity and save human resources; when checking out at shopping
    malls and supermarkets, "face scanning" enables password-free payment, enhancing
    the convenience of shopping...


    This seemingly simple act of "face scanning" is actually supported by computer
    vision technology. How exactly does the computer complete face acquisition and
    preprocessing, perform face detection, face alignment, and face feature extraction,
    and achieve face recognition and liveness detection? What are the advantages and
    application scenarios of face recognition? Let''s explore these questions together.


    ## 3.4.1 Understanding Face Recognition


    Face recognition is a biometric identification technology based on human facial
    feature information. Specifically, it uses a camera to capture images or video
    streams containing faces, automatically detects and tracks faces in the images,
    and then performs a series of related technologies for face recognition on the
    detected faces. It is also commonly called portrait recognition or facial recognition.


    The semi-automatic face recognition system built by scientists in 1964 was the
    earliest research on face recognition. This system was based on geometric parameters
    of facial features, including the geometric characteristics of facial organs,
    such as the relative geometric relationships of key facial feature points like
    interocular distance, head width, nose height, and ear position.


    However, precise localization of facial feature points is itself a difficult problem,
    easily affected by changes in pose and expression. The extracted geometric facial
    features are also very simple, losing a large amount of other extractable feature
    information. Therefore, algorithms based on simple geometric features have relatively
    low overall recognition accuracy.


    The development of face recognition technology was very slow until the birth of
    deep learning technology, which brought explosive growth. In 2014, Chinese scientists
    achieved excellent results in combining deep learning with face recognition, achieving
    a recognition accuracy of over 99% on the `LFW` face dataset, surpassing the human
    recognition accuracy of 97.52% on the same dataset. According to news reports,
    in the 2018 Global Face Recognition Algorithm Test Competition, 39 enterprises
    and institutions from around the world participated, and the top five algorithms
    were all from China; in 2019, a Chinese company won the championship again, demonstrating
    sustained and strong competitiveness.


    > **Thinking & Exploration**

    >

    > Besides the above scenarios, in what other scenarios can face recognition technology
    be used?


    ## 3.4.2 Face Acquisition and Image Preprocessing


    Face recognition requires acquiring face images first. Depending on the acquisition
    scenario, it can generally be divided into two categories.


    The first scenario is called **Constrained Face Capture**. For example, requiring
    a standard sitting posture, facing the camera directly, no hats or glasses, and
    even requirements for bright lighting. Can you guess where such scenarios exist?


    Taking ID photos is this type of scenario. We take such images for school enrollment,
    overseas travel, or applying for ID cards. Computer recognition of such face images
    is most favorable. Currently, the international leading recognition accuracy for
    this type of face image exceeds 99%.


    The second scenario is called **Unconstrained Face Capture**. In daily life, naturally
    captured faces have various problems, such as side profiles, low light, strong
    light, backlight, occlusion, blur, etc. Images acquired this way inevitably affect
    the recognition accuracy of face algorithms. If the algorithms from the first
    scenario are directly applied here, they can only barely reach 60%–70% recognition
    accuracy. Therefore, to improve algorithm accuracy, it is necessary to start from
    the acquisition end to improve image acquisition quality, while also preprocessing
    the acquired face images to enhance image quality.


    So how do we preprocess? Image enhancement is a commonly used preprocessing method.
    For example, weak ambient light causes dark images (underexposure). At this time,
    methods such as enhancing dark areas, removing noise in dark backgrounds, improving
    image resolution, and removing motion blur can be used for image enhancement.


    There are two specific methods as follows.


    ### 1. Improving Image Resolution


    The most intuitive feeling of improved image resolution is that the image becomes
    finer. Faces captured in unconstrained conditions are usually far away and not
    very large, making facial feature recognition difficult. We can use interpolation
    algorithms to increase pixels and improve resolution. There are many interpolation
    methods; here we only discuss the most basic Nearest Neighbor Interpolation (Figure
    3-47).


    It can be understood like this: a `3×3` pixel image (Figure 3-47a) needs to be
    enlarged to `4×4` (Figure 3-47b). A point in the second column can be randomly
    selected, such as the green pixel point shown in Figure 3-47b, which is the pixel
    to be inserted. However, this point does not exist in the original image, so its
    grayscale value is unknown. So, the `4×4` image is scaled down proportionally
    to `3×3` and overlaid on the original `3×3` image (Figure 3-47c). At this point,
    it is found that this pixel point mostly overlaps with the middle pixel of the
    `3×3` image. Therefore, the grayscale value of this added point is set to be the
    same as that of the middle pixel of the `3×3` image. Following this method, the
    image can be enlarged.


    ![](img/txt003_49.jpg "pagenumber_ebook=88,pagenumber_book=77")


    Figure 3-47　Nearest Neighbor Interpolation


    ### 2. HDR Technology


    You may have noticed `HDR` on some mobile phone camera interfaces (Figure 3-48).
    Do you know what `HDR` is? What does it do?


    ![](img/txt003_50.jpg "pagenumber_ebook=88,pagenumber_book=77")


    Figure 3-48　Mobile Phone Camera Interface


    When taking a photo with a camera, if the lighting of the foreground and background
    is inconsistent, the following situation occurs: when focusing on the bright area
    (metering on the bright area), the darker area becomes pitch black (underexposure),
    because most digital cameras focus and meter simultaneously, just like Figure
    3-49.


    For the same reason, if focusing on the darker area, the details in the bright
    area will be lost (overexposure), as shown in Figure 3-50.


    This is where `HDR` technology comes in. Its Chinese name is High Dynamic Range
    Imaging.


    The principle of `HDR` technology can be roughly understood as follows: the computer
    captures multiple images of the same field of view in a very short time, then
    uses algorithms to process and merge these images, making the dark parts brighter
    and the bright parts darker, to achieve the purpose of retaining both highlight
    details and shadow details simultaneously. The effect is shown in Figure 3-51.


    ![](img/txt003_51.jpg "pagenumber_ebook=89,pagenumber_book=78")


    Figure 3-49　Underexposure


    ![](img/txt003_52.jpg "pagenumber_ebook=89,pagenumber_book=78")


    Figure 3-50　Overexposure


    ![](img/txt003_53.jpg "pagenumber_ebook=89,pagenumber_book=78")


    Figure 3-51　Photo taken using HDR technology


    > **Thinking & Exploration**

    >

    > Think about it: which Chinese idiom can describe the computer interpolation
    algorithm? Try searching for the disadvantages of the nearest neighbor interpolation
    method.

    >

    > **Experience & Perception**

    >

    > Try using the AI `bigjpg` mini-program to experience enlarging face images.


    ## 3.4.3 Face Detection


    Face detection is the accurate localization of the positions and sizes of all
    faces in an image, usually indicated by detection boxes. Remember the object detection
    we learned earlier? The "object" in object detection can actually include the
    target of a face.


    Face detection algorithms need to solve the following key problems:


    - Faces may appear at any position in the image;

    - Faces may be partially occluded;

    - Faces may have different sizes due to distance;

    - Faces in the image may have different views and poses.


    Remember how we performed object detection? Face detection can use similar methods.
    Faces in images are a very special class of detection targets, so the concept
    of an "Image Pyramid" needs to be introduced.


    The so-called **Image Pyramid** (Figure 3-52) places the highest resolution image
    at the bottom, with a series of images of gradually decreasing pixels above it.
    The appearance resembles a pyramid shape, constituting the image pyramid in computer
    vision.


    ![](img/txt003_54.jpg "pagenumber_ebook=90,pagenumber_book=79")


    Figure 3-52　Schematic diagram of image pyramid


    In the face detection process, the face image pyramid is particularly useful because
    faces in images have distance and size variations. The face detection algorithm
    specifies a minimum detection range, e.g., `12×12` pixels; faces smaller than
    this range are not detected. What about faces larger than this range? The detected
    image is gradually reduced in resolution until it reaches `12×12` pixels. During
    this process, if a face is detected, a detection box is marked. Obviously, this
    causes a large number of duplicate markings; the same face gets detection boxes
    of different sizes. So next, the computer merges and deduplicates the marked detection
    boxes, retaining the detection box with the most appropriate face size.


    When deep learning arrived, scientists also thought of combining deep learning
    with face detection. In 2016, scientists from the Shenzhen Institutes of Advanced
    Technology, Chinese Academy of Sciences, developed the `MTCNN` algorithm, which
    can be roughly divided into three network structures: `P-Net`, `R-Net`, and `O-Net`.


    A brief introduction to the principles of these three neural network layers:


    - **`P-Net` Network**: The main purpose is to generate candidate detection boxes.
    Using the `P-Net` neural network, face detection is performed once on every region
    of images at different resolutions on the image pyramid, and the position and
    confidence score of the face detection box are given.

    - **`R-Net` Neural Network**: Similar to the `P-Net` neural network, the detection
    boxes generated by the previous `P-Net` are input into the `R-Net` neural network
    for further optimization.


    '
