    )\n\n\uFEFF\n\n编委会\n\n主　编　吴　皓　徐　速\n\n副主编　张岱虹　单学英　金　璠　金海艳　宋立新　吴　斌\n\n编　委　白浩斌　贾德立　冯　英　徐嫣琼　甘仲巍　朱　敏\n\
    \n　　　　顾海灵　居晓波　鲍若凡　张元平　平云婕　李文静\n\n插　画　陈　樑　仇宇辉　郑崇洲　林　琦　周　颖　李伟健\n\n\uFEFF\n\n序\n\n\
    我国经济社会快速发展、信息基础设施不断完善，为信息化进一步发展打下了坚实基础，而人工智能时代的到来，将把信息化提升到新的高度。当下，人工智能这个词已经频繁在我们生活和工作中出现，畅想未来，人工智能在教育、医疗、交通、工业、商业等领域将会有更多可以预见或超越想象的应用。\n\
    \n世界人工智能大会在上海成功举办，为青少年近距离参与人工智能、分享人工智能提供了很好的机会。由共青团上海市委员会牵头指导的上海市青少年人工智能创新大赛让新时代的科技雏鹰在这一平台上起飞；青少年人工智能创新发展论坛则聚力青春、对话未来，激励广大青少年激荡人工智能的风浪，实现自身的发展。\n\
    \n为了让人工智能技术惠及更多青少年，上海市青少年活动中心编著了“人工智能从娃娃抓起”系列丛书之《走进人工智能》，这是一本面向青少年读者的有趣的人工智能科普读本。全书从人工智能概论出发，到人工智能的表现形式——会学习、会看、会听说，最后到人工智能伦理，渐渐揭开人工智能的面纱，较为系统地描绘了人工智能这门交叉学科。全书重在科普，巧在体验，在逐步感知中走进人工智能，在动手探索中感悟人工智能。通过一些有趣的类比，将原本“神秘”的人工智能深入浅出地进行讲解，为青少年感知和认知人工智能铺平道路，让青少年能更科学、更理性、更全面地了　解人工智能。\n\
    \n教育兴则国兴，教育强则国强，我们要培养能够担当民族复兴大任的时代新人。只有做好了青少年的人工智能科普教育，才能使中国在世界人工智能领域处于领先地位成为可能。青少年人工智能科普读本的推出，也体现了习近平总书记强调的“少年强则国强”的理念。\n\
    \n未来人工智能时代的竞争是人才的竞争，人才的竞争离不开人才的培养，愿这本书在青少年的心中种下一颗人工智能的种子，静待花开，未来可期。\n\n![](images/fow002_1.jpg\
    \ \"pagenumber_ebook=6,pagenumber_book=0\")\n\n中国科学院院士\n\n上海交通大学副校长\n\n上海少年科学院人工智能分院名誉院长\n\
    \n\uFEFF\n\n前言\n\n亲爱的青少年朋友们，新一代人工智能的迅速发展正在深刻改变着我们身处的这个世界，影响着我们的学习、生活和工作。认识、理解、应用人工智能可以帮助我们更好地面向未来。\n\
    \n什么是人工智能？目前它擅长做什么，哪些事情还做不到？它的神奇之处究竟来源于哪里？它在给我们带来快捷、便利的同时，有什么潜在的风险？这些问题你可能曾经想过，也可能很快就会遇到，但想要回答却并不容易，因为人工智能涉及许多学科和领域的知识。希望我们编写的这本读本，能以深入浅出的方式带大家接近并找到想要的答案。\n\
    \n“人工智能”其实并不是一个新鲜的词汇。自1956年被提出以来，至今已有六十余年，在此期间经历了几个重要的发展时期。基于大数据的深度学习引发了人工智能发展的新浪潮，数据、算法、算力互相助力，成为人工智能发展的三要素。\n\
    \n现在的人工智能究竟和之前的有什么区别呢？一直以来，计算机在完成某个任务时都是依靠程序来驱动的，这些程序可以简单理解为人们事先设定好的众多规则，其中有些规则可能非常复杂。即便如此，在解决某些问题时的效果却并不好，而现在的人工智能在做的一件事，就是根据人们输入的数据信息，自行构建其中的一些规则，从而解决这些问题。这听上去是不是特别神奇？然而在了解了它的工作原理后，也许你会说“哦，原来是这样”。\n\
    \n本书是“人工智能从娃娃抓起”系列丛书的第一本，是上海市青少年活动中心、上海少年科学院为响应国家“发展新一代人工智能”的号召，整合多方资源打造的青少年人工智能科普读本。全书从人工智能概述、会学习的人工智能、会看的人工智能、会听说的人工智能、人工智能伦理五个方面展开，以“先见林，再见树”的理念，带领青少年朋友们纵览当前人工智能领域的各个方面。丛书后继书目还将具体学习探索与人工智能相关的算法和程序设计、开源硬件和科技创新项目等。\n\
    \n在2020世界人工智能大会云端峰会青少年人工智能创新发展论坛上成立的上海少年科学院人工智能分院，以这本读物为学习材料，打造了相匹配的青少年人工智能科普课程。基于青少年学习人工智能的实际问题，组织思考探索、体验感知，进行知识拓展、动手实践，旨在探索人工智能科学普及、科技创新的新方向、新路径，帮助广大青少年走进人工智能新世界，积极为人工智能领域储备青少年人才。\n\
    \n参与本书编写的有上海市青少年活动中心、上海少年科学院的指导老师，也有教研员及中小学的一线教师。本书编写期间得到了陈向东、方向忠、谢忠新、张汶、徐雄、费宗翔、李诚、刘啸宇等专家的指导与帮助，在此表示衷心的感谢！\n\
    \n希望我们的“人工智能从娃娃抓起”系列丛书能陪伴广大青少年朋友一起度过探索人工智能世界的快乐时光。\n\n\uFEFF\n\n目　录\n\n[编委会](#fow001.html#fow001_1)\n\
