    # 1.2 探源人工智能


    ## 1.2.1 人工智能的发展


    1956年达特茅斯会议确定了人工智能的名称。追溯人工智能发展的时间脉络，人工智能的发展并不总是一帆风顺的，而是经历了几番潮起潮落。


    ### 人工智能的第一次浪潮（20世纪50—80年代）


    达特茅斯会议之后，人工智能得到了快速的发展，在这一阶段，感知机的出现使机器在实现逻辑推理中得到突破。


    Shakey移动机器人（图1-6）通过解决感知、运动规划与控制问题，能够寻找目标并把它移动到指定的方位，实现简单的自主导航。Shakey移动机器人印证了很多属于人工智能范畴的科学结论。


    Eliza是能与人对话的人工智能程序（图1-7），它并非依靠声音，而是利用文本与人进行对话，基于对话规则与模式匹配，根据人类语句中的关键词，给予相应的回答。


    随着任务的难度与复杂程度不断地增大，机器无法应对，人工智能发展一度遇到瓶颈。


    ![](images/txt001_7.jpg "pagenumber_ebook=18,pagenumber_book=7")


    **图1-6　Shakey移动机器人**


    ![](images/txt001_8.jpg "pagenumber_ebook=18,pagenumber_book=7")


    **图1-7　Eliza**


    ### 人工智能的第二次浪潮（20世纪80—90年代末期）


    专家系统的出现推动了人工智能的第二次高潮。专家系统就是专注于某一些特定领域的系统，从专门知识中推演出规则，模拟专家解决问题的流程，利用知识得到满意的解答。例如医疗上为特定患者进行诊断，看其是否患有特定的疾病（图1-8）。专家系统往往不是通用的，而是为解决某个问题，或者为实现某个具体目标而进行开发的。


    ![](images/txt001_9.jpg "pagenumber_ebook=19,pagenumber_book=8")


    **图1-8　专家系统**


    专家系统在知识获取、推理能力方面存在缺陷，无法进行复杂的思考，应用场景非常有限，成本又很高，于是人工智能又一次步入低潮期。


    > **知识拓展**

    >

    > **人工智能三大学派的“华山论剑”**

    >

    > 人工智能发展至今已有60多年，出现了三大学派。

    >

    > - **符号主义**：主要成果为符号推理。使用符号表达的方式来描述人类的认知过程，人工智能发展早期运用广泛。

    > - **连接主义**：主要成果为神经元网络与深度学习。该学派认为人工智能源于仿生，例如神经元网络就是模仿人大脑中的神经元进行信息处理。

    > - **行为主义**：主要成果为强化学习。该学派推崇控制、自适应于进化计算，基于环境进行感知从而付诸行动。

    >

    > **人工智能“三盘棋”**

    >

    > 人工智能的三个“三”，除了三次浪潮、三大学派，还有非常有名的“三盘棋”。人工智能发展中有三次人机大战，涉及跳棋、象棋和围棋，称为人工智能“三盘棋”。

    >

    > - 1962年，阿瑟·萨缪尔（Arthur Samuel）战胜人类跳棋冠军。

    > - 1997年，深蓝（Deep Blue）战胜人类象棋冠军。

    > - 2017年，阿尔法围棋（AlphaGo）战胜人类围棋冠军。


    ### 人工智能的第三次浪潮（21世纪初至今）


    在大数据、算法、算力的保驾护航下，机器学习技术得到发展，人工智能迎来第三次热潮。机器学习使得人工智能在很多应用领域取得突破性发展。


    我国也将发展人工智能上升到国家战略高度。2017年3月5日，国务院总理李克强在《政府工作报告》中提出要加快培育壮大包括人工智能在内的新兴产业，全面实施战略性新兴产业发展规划，这是“人工智能”首次被列入《政府工作报告》。2017年7月，国务院印发《新一代人工智能发展规划》，明确指出应逐步开展全民智能教育项目，在中小学阶段设置人工智能相关课程，逐步推广编程教育。


    2017年11月15日，科技部在北京召开新一代人工智能发展规划暨重大科技项目启动会，同时公布了首批国家新一代人工智能开放创新平台名单，标志着全面启动与实施新一代人工智能发展规划和重大科技项目。


    《新一代人工智能发展规划》提出我国发展新一代人工智能分“三步走”。


    - **第一步**，到2020年人工智能总体技术和应用与世界先进水平同步，人工智能产业成为新的重要经济增长点，人工智能技术应用成为改善民生的新途径，有力支撑进入创新型国家行列和实现全面建成小康社会的奋斗目标。

    - **第二步**，到2025年人工智能基础理论实现重大突破，部分技术与应用达到世界领先水平，人工智能成为带动我国产业升级和经济转型的主要动力，智能社会建设取得积极进展。

    - **第三步**，到2030年人工智能理论、技术与应用总体达到世界领先水平，成为世界主要人工智能创新中心，智能经济、智能社会取得明显成效，为跻身创新型国家前列和经济强国奠定重要基础。


    ## 1.2.2 人工智能的三要素


    当今人工智能的发展离不开数据、算法、算力，因此数据、算法、算力被称为人工智能的三要素。


    ### 1. 数据


    在我们的生活中充满着各种各样的数据，坐地铁会留下进出站的信息，去图书馆借书会留下借书的信息，在学校学习会留下电子成长档案（包括我们的身高、体重、课程表等信息），以上信息都是数据。


    #### （1）基于数据的智能推送


    如果你最近在网上通过搜索引擎检索“人工智能”，并通过检索结果选取感兴趣的网页进行浏览，会发现最近互联网推送给你的都是人工智能相关的信息，新闻软件也会推送关于人工智能的新闻。甚至当你打开网上书店想要买书时（图1-9），还没有搜索人工智能的关键词，网上书店就能猜到你想要购买人工智能的书。网上书店能做到在你“没开口”之前先个性化精准推送，这背后就是基于数据。


    ![](images/txt001_10.jpg "pagenumber_ebook=20,pagenumber_book=9")


    **图1-9　智能推送**


    #### （2）基于数据的智能评测


    最近小能同学的数学考试成绩提高得很快，同学们纷纷来向他讨教经验。原来他使用了一种在线学习评测类系统。以数学为例，系统会记录完成每一道题所花费的时间、做错的题目等数据，然后就会呈现一个关于数学学习情况的雷达图（图1-10），分析在他的哪些方面比较薄弱。


    根据数据，在线学习评测系统会有针对性地对小能同学的薄弱环节进行反复练习，对于已经掌握的知识不会进行重复性的复习。题目做少了，做精了，小能同学不仅成绩提高了，还有更多的时间做自己想做的事情。


    ![](images/txt001_11.jpg "pagenumber_ebook=21,pagenumber_book=10")


    **图1-10　智能评测**


    #### （3）基于数据的智能导航


    通过导航检索线路，我们往往可以看到导航会给出许多条线路，并且智能推荐其中一种。这种智能推荐往往是根据路上公交的实时数据进行分析的结果。推荐线路可以供我们进行选择，有时间短、少换乘、少步行、地铁优先、不坐地铁这样的选项，来满足每个人的个性化要求。


