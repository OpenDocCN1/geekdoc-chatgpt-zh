    ### 3.2　Image Recognition


    Image recognition refers to the technology of using computers to process, analyze,
    and understand images to identify targets and objects of various different patterns.
    It is a practical application of applying machine learning algorithms. Currently,
    image recognition technology is generally divided into face recognition and object
    recognition based on the recognition object. Face recognition is mainly used in
    scenarios such as security checks, identity verification, and mobile payment;
    object recognition is mainly used in scenarios such as goods circulation, particularly
    unmanned shelves, smart retail cabinets, etc.


    Generally, the process of image recognition includes three steps: image preprocessing,
    feature extraction, and image classification (Figure 3-17). We will understand
    how computer vision technology recognizes images based on this process.


    ![](img/txt003_19.jpg "pagenumber_ebook=72,pagenumber_book=61")


    Figure 3-17　Image Recognition Process


    #### 3.2.1　Image Preprocessing


    In Chapter 2, we learned that humans can distinguish different animals because
    they have seen them before and remembered their different features; similarly,
    computers can correctly distinguish dogs and cats because they have "seen" and
    remembered their different features before.


    When computers perform image recognition, the quality of the image directly affects
    the design of the recognition algorithm and the accuracy of the recognition results.
    However, during the image acquisition process, imaging angles, perspective relationships,
    and even the lens itself can cause image errors. Therefore, in the initial stage
    of image recognition, we need to preprocess the images.


    The main purpose of image preprocessing is to eliminate errors in the image, restore
    useful information, thereby improving the reliability of feature extraction and
    image classification, and helping the computer understand the image more accurately.
    General image preprocessing methods include the following.


    ##### 1. Grayscale Correction


    We call each indivisible unit on an image (or the smallest element) a pixel. The
    term "grayscale" originated from black-and-white photography, referring to the
    different depths of gray presented by each pixel on a black-and-white photo (or
    black-and-white image) produced according to the different colors and brightness
    of each point of the scene (Figure 3-18, Figure 3-19).


    ![](img/txt003_20.jpg "pagenumber_ebook=73,pagenumber_book=62")


    Figure 3-18　Original Image


    ![](img/txt003_21.jpg "pagenumber_ebook=73,pagenumber_book=62")


    Figure 3-19　After Grayscale Correction


    ![](img/txt003_22.jpg "pagenumber_ebook=73,pagenumber_book=62")


    Figure 3-20　After Geometric Transformation


    ##### 2. Geometric Transformation


    Image geometric transformation, also known as image spatial transformation, refers
    to processing acquired images through methods such as translation, transposition,
    mirroring, rotation, and scaling (Figure 3-19, Figure 3-20).


    Using the above methods can better correct issues in image acquisition such as
    images being too dark, too bright, having noise points, low contrast, and imaging
    angles.


