    ### 2. 算法


    算法是解决问题、实现目的的方法。可以理解为，为了解决某个问题，先思考怎么做，用什么方法，再采取行动，进而解决问题。


    邓小平爷爷说过一句话：“不管黑猫白猫，能捉老鼠的就是好猫。”解决同一个问题，当然可以用不同的算法。


    学校里老师布置了语文、数学、英语、科学的作业。


    - 小A按自己的喜好程度，选择先做语文，再做数学，接着做科学，最后做英语。

    - 小B决定按自己作业完成的难易程度，选择先做科学，再做语文，接着做英语，最后做数学。


