    ### 3.1.3　Wider Applications of Computer Vision Technology


    Previously, we learned about the applications of computer vision technology and
    its brief developmental history. Next, we will explore the wider, higher-level
    applications of computer vision technology, such as in industrial manufacturing,
    healthcare, agriculture, military, security monitoring, autonomous driving, and
    other fields.


    #### 1. Computer Vision and Industrial Manufacturing


    In May 2015, Premier Li Keqiang of the State Council approved "Made in China 2025".
    This is a strategic document deploying the comprehensive promotion of the manufacturing
    power strategy, and an action outline for the first decade of China''s implementation
    of the manufacturing power strategy. In industrial manufacturing, the use of industrial
    robots is indispensable. Visual perception technology in industrial robot systems
    is an important aspect of industrial robot perception (Figure 3-5). The vision
    system acquires visual information for controlling and adjusting the robot''s
    position and posture. The vision system has also been widely used in quality inspection,
    workpiece recognition, food sorting, packaging, and other aspects.


    #### 2. Computer Vision and Healthcare


    Tencent Miying, under China''s Tencent, is a product that applies artificial intelligence
    technology to the medical field. Tencent Miying gathers the strength of multiple
    top AI teams, cross-integrating technologies such as image recognition and deep
    learning with medical applications.


    Early medical examinations were all manually read by doctors, which was time-consuming,
    laborious, and prone to misjudgment. Now, smart healthcare has made tremendous
    progress based on the development of computer vision technology (Figure 3-6).
    Its principle is as follows: provide massive amounts of two categories of images—cancerous
    cells and normal cells—without needing to outline the boundaries of all cancerous
    and normal cells; computer vision technology can identify the features of these
    two categories of images and recognize them through machine learning methods,
    greatly improving the accuracy of film reading.


    ![](img/txt003_8.jpg "pagenumber_ebook=69,pagenumber_book=58")


    Figure 3-6　Medical Cell Detection


    According to news reports, an institution once performed intelligent detection
    and identification on nearly 9,000 lung nodule CT images from 30 patients uploaded
    by a certain hospital. It marked the suspected nodules screened out in the first
    round as auxiliary diagnosis results for review by 4 radiologists. The entire
    process of human-machine collaborative diagnosis of lung nodules took only 30
    minutes, a significant efficiency improvement compared to the 150–180 minutes
    required by traditional methods. Verified by 4 attending radiologists from Grade
    A tertiary hospitals using a double-blind method, the comprehensive accuracy of
    intelligent diagnosis reached over 90%.


    #### 3. Computer Vision and Agriculture


    People have used visual recognition technology to intelligently identify crops
    and weeds, enabling intelligent spraying. Solar panels, cameras, temperature,
    humidity, and light sensors, as well as big data clouds, can also be used to collect,
    record, and process agricultural data for crop yield prediction, crop disease
    monitoring, etc. (Figure 3-7). In regions such as Heilongjiang, China, new technologies
    like Beidou satellite-based outdoor monitoring systems and smart phone terminals
    have been deployed for agricultural monitoring, meteorological disaster early
    warning, and other services.


    #### 4. Computer Vision and Military


    Computer vision can be applied in military projects such as missiles and drones
    (Figure 3-8). For example, China''s independently developed "Changjian-10" (Long
    Sword-10) cruise missile can fly close to the ground or sea level. Its flight
    altitude is very low, allowing it to evade most radar surveillance and safely
    reach its combat zone. When the missile flies near the destination, it performs
    a "cobra" maneuver (pulling up), looking down at its target, and then dives straight
    toward the target.


