    ### 1.3.3 计算机博弈


    计算机博弈是人工智能重要的研究方向之一。计算机能根据既有的规则和临场局势，选择最佳策略做出决策。


    为了解决策，我们先来了解决策树。决策树的结构很像一棵树，有分叉的树干和树叶。枝杈的分叉处是关于某个特征的判断，枝杈是关于特征的判断结果，而树叶则是判断过后产生的结果。


