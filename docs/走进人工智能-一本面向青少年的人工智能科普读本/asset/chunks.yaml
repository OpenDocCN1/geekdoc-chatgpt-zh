    ## 3.3.3 Applications of Object Tracking


    As an important research direction in computer vision technology, object tracking
    has extremely wide applications in both military and civilian fields. Military
    applications include unmanned aerial vehicles (UAVs), precision-guided missiles,
    airborne early warning, battlefield surveillance, etc.; civilian applications
    include autonomous driving, automatic robots, intelligent video surveillance,
    human-computer interaction, augmented reality, etc.


    ### 1. Military Applications


    Military applications of object tracking are shown in Figure 3-8 and Figure 3-41.


    ![](img/txt003_43.jpg "pagenumber_ebook=83,pagenumber_book=72")


    Figure 3-41　Military UAV


    ### 2. Civilian Applications


    #### (1) Intelligent Video Surveillance


    ① **Identity Recognition Based on Gait Features** (Figure 3-42). Everyone walks
    with a different posture. The computer can identify features such as the bending,
    swinging, height, and period of major human body joints, thereby distinguishing
    individuals. Even if someone wears a mask or hat to deliberately cover their face,
    the computer can still recognize the person.


    ![](img/txt003_44.jpg "pagenumber_ebook=83,pagenumber_book=72")


    Figure 3-42　Application of object tracking in gait-based identity recognition


    ② **Object Tracking Based on Face Recognition**. By recognizing facial features,
    the computer can distinguish each person; the specific principles will be discussed
    in detail later.


    ③ **On-board Computer Detection of Objects Encountered During Driving**, such
    as pedestrians, obstacles, traffic lights, surrounding vehicles, etc. It detects
    distance changes between itself and surrounding objects to prevent collisions
    with pedestrians or other vehicles, and prevent traffic violations such as running
    red lights.


    ④ **Cameras installed by traffic management departments at roadsides, intersections,
    and other locations** collect license plate information of passing vehicles, monitoring
    various traffic information in real-time, including traffic density, driving speed,
    traffic accidents, etc. (Figure 3-43).


    #### (2) Human-Computer Interaction


    Traditional human-computer interaction is conducted via keyboard and mouse. The
    computer''s ability to recognize and understand human postures, actions, and gestures
    relies on object tracking as a key technology.


    For example, hand tracking combined with gesture recognition can detect all hands
    in an image and recognize gesture types (Figure 3-44), including diverse scenarios
    such as selfies, photos taken by others, and various angles.


    Computers can not only recognize human postures, actions, gestures, and expressions
    but also superimpose human figures into virtual 3D environments for interaction,
    providing participants with a richer interactive experience. For example, many
    Apps have functions like beautification, face swapping, and real-time expression
    tracking (Figure 3-45).


