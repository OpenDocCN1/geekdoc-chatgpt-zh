    ### 2.1.2 传统算法与基于机器学习的算法


    #### 1. 传统算法


    传统算法是编写具体识别规则的程序，程序的判定过程如图2-2所示。在传统算法编写的程序中，预存许多图片数据作为图库，这些图库也称为样本数据。从图2-2中可以看出，传统算法需要对比玩家所画图形是否与图库中的图形一致，若图形不在图库中就会导致猜不出来，因为程序在执行过程中是完全遵守所编写指令运行的。事实上每个人画画的水平不同，画风不同，要画得与图库一致是非常困难的。


    ![](images/txt002_4.jpg "pagenumber_ebook=36,pagenumber_book=25")

    图2-2　传统算法的判定过程


    #### 2. 基于机器学习的算法


    “猜画小歌”使用的是基于机器学习的算法。在这个过程中，它并不编写具体的规则，而是让机器从“猜画小歌”图库数据里自动学习其中的规律。这个过程可以理解为机器自动从样本数据中提取特征。再将具有相同特征的图形进行归类，然后对每一类（比如狗）建立模型，之后判定用户画的图更接近哪一类模型（图2-3）。比如，当我们画一只狗，“猜画小歌”通过比对特征点（这一过程在分类器中完成），最终将其分到“猜画小歌”的“狗”那一类，从而猜出所画的是一只狗。这一机器学习流程如图2-3所示。即使你是“灵魂”画手，只要能画出狗的特征，人工智能就能猜出来了。


    ![](images/txt002_5.jpg "pagenumber_ebook=36,pagenumber_book=25")

    图2-3　“猜画小歌”中基于机器学习的算法过程


    > **思考探索**

    >

    > 我们知道“猜画小歌”中预先存储了许多图片组成图库，作为机器学习的基础样本数据。在收集这些样本数据时，需要注意什么呢？比如样本数据数量要多一点，还是少一点？绘画风格要多样一些，还是单一一些？


    ### 2.1.3 样本数据的选择


    想要通过分类器学习并建立模型是需要一定数据量的。采集的样本数据量过少，达不到学习所需要的数据量，或者采集的样本数据量虽然很多，但是样本数据种类过于单一，都会导致分类器出现误差，因此我们在选择样本数据时应该避免这两种情况。


    #### 1. 样本数据过少


    以“猜画小歌”为例，机器在进行学习的时候，如果样本数据太少，会发生什么？设想一下，比如“猜画小歌”想要分辨玩家所画的是不是狗，如果图库中的样本数据只存储了几张长耳朵、长尾巴的狗，由于样本数据太少，当玩家画了“博美犬”这样短耳朵、短尾巴的狗时，“猜画小歌”就无法判断这是狗了。这就是机器在进行学习时，由于“样本数据过少”导致的问题（图2-4）。


    #### 2. 样本数据过于单一


    还是以“猜画小歌”为例。比如图库中的“狗”的样本数据虽然很多，但都是“博美犬”这样的卡通形象，“猜画小歌”会把“博美犬”的所有特征都记住。此时如果玩家画了一个“巴吉度猎犬”的卡通形象，那么“猜画小歌”有可能认为“巴吉度猎犬”和“博美犬”的区别太大，从而判定“巴吉度猎犬”不是一只狗。这是因为“猜画小歌”获得的样本数据不能概括为“狗”的全部特征，它只能分辨出一类狗——“博美犬”的特征。这就是机器在进行学习时，由于样本数据过于单一，不具备多样性而产生的问题（图2-5）。


    ![](images/txt002_6.jpg "pagenumber_ebook=37,pagenumber_book=26")

    图2-4　“样本数据过少”现象


    ![](images/txt002_7.jpg "pagenumber_ebook=37,pagenumber_book=26")

    图2-5　“样本数据过于单一”现象


    “样本数据过少”和“样本数据过于单一”都会造成机器的学习效果不理想，因此我们在收集样本数据时要尽可能多样化，多收集一些样本数据。


    ### 2.1.4 基于机器学习算法的更多应用


    现如今，在许多领域都能找到基于机器学习技术的身影，可能你正在以某种方式使用它而不自知。一起来看看生活中基于机器学习算法的应用还有哪些。


    #### 1. 搜索引擎中的机器学习


