    > **知识拓展**

    >

    > **玉米田的故事**

    >

    > 一片玉米地，需要从里面摘选一个最大的玉米（图1-13）。但只能摘一次，而且不能回头。

    >

    > - **小A的做法**：走进玉米地，发现很多很大的玉米，小A很快摘下了看到的第一个比较大的玉米，然后继续往前走，然而越走越失望，小A沮丧地发现前面还有很多比手里的玉米大得多的玉米。

    > - **小B的做法**：走进玉米地，同样也发现了很多很大的玉米，但是这一次小B吸取小A的教训——前面一定有更大的。于是小B一直向前走，直到自己差不多走出了玉米地才发现没有之前这么大的玉米了，按照规则不能回头，只能拿了附近可以拿到的一个最大的玉米。

    >

    > 小A的算法，因为观察得不全面，因此发生了“后悔”的情况；小B的算法，虽然观察全面到位，但是却“错过”了。那么如果是你，你会怎么做呢？

    >

    > 数学家欧拉给出一个重要的数字：37%。

    >

    > 对于在玉米地选择最大的玉米这样的问题，科学家给出了这样的算法：

    >

    > 把这片玉米地分两个阶段，前37%为第一阶段。在这个阶段，你只看不选，就是认真观察比较这个阶段最大的玉米，记住那个玉米的大小。等过了37%，进入第二阶段。从这个阶段开始，一旦遇到一个比第一阶段那个最大的玉米还要大的玉米，或者类似的玉米，就毫不犹豫地选择它。

    >

    > “分两个阶段”这个策略和“37%”这个数字，是数学家欧拉好不容易算出来的，这实际上是一个随机选择优化问题。这个办法就叫“37%规则”。

    >

    > 这个算法也许并不能保证你能选到最大的玉米。在这片玉米地里，玉米的大小是随机出现的。在这种随机出现的情况下，它是一个能够选到足够大玉米的最优算法。它能降低“后悔”与“错过”发生的概率。

    >

    > 虽然解决一个问题的算法有好多种，但是一般会选择最好的那种，即为最优算法。

    >

    > 一般来说，算法具备以下的特点：

    >

    > - **有穷性（Finiteness）**：算法必须能在执行有限个步骤之后终止。

    > - **确定性（Definiteness）**：算法的每一个步骤必须有确切的含义。

    > - **可行性（Effectiveness）**：算法中每一个步骤都是要能够实际做到的，而且是在有限的时间内完成。

    >

    > 一个算法有零个或多个输入，以表示运算对象的初始情况。所谓零个输入是指算法本身定出了初始条件。

    >

    > 一个算法有一个或多个输出，以反映对输入数据加工后的结果。没有输出的算法是毫无意义的。

    >

    > 我们说的机器学习、人脸识别等其实都是基于算法实现的。新的算法不断被提出，让人工智能拥有更多可能性。


    ### 3. 算力


    算力通常表示计算机的计算能力。算力的提升可以认为是个系统工程，不仅涉及诸如芯片、内存、硬盘等所有硬件组件，而且要根据数据类型的应用所处的实际环境对计算架构、对资源的管理和分配进行优化。


    想象一下你是否有这样的经历，当计算机在处理某个复杂任务（比如视频编辑）时，突然死机了，卡住了，就可以认为是计算机的算力还不够。当然，并不是所有死机都是因为算力不足。


    第一台现代电子计算机“埃尼阿克”（ENIAC）每秒可进行5000次加法运算。现如今超级计算机的诞生大大提高了算力。


    目前，超级计算机以每秒钟浮点运算速度（Flops）为主要衡量单位。值得一提的是中国超级计算机“神威·太湖之光”（表1-1），峰值性能为125.436 PFlops，排名世界第四；持续性能为93.015
    PFlops，排名世界第一；性能功耗比为6051 MFlops/W，排名世界第一。


    **表1-1　2020年6月全球超级计算机Top500榜单排名前五**

