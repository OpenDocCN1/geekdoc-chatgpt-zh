    #### 3.2.3　Image Classification


    As the saying goes, a picture is worth a thousand words. We constantly capture
    visual content from images, interpret its meaning, and store it in our brains
    for later use. But for a computer, interpreting the content of an image is actually
    very difficult; it knows nothing about the thoughts, knowledge, and meaning conveyed
    by the image.


    Therefore, to enable computers to understand the content of images, we must apply
    image classification technology. This is the task of extracting meaning from images
    using computer vision and machine learning algorithms. This operation can be simply
    understood as assigning a label to an image, such as cat, dog, or elephant, or
    even interpreting the content of the image and returning a human-readable sentence.


    The basis of image classification is the extracted image features. Next, we use
    image classification algorithms to recognize images. For example, we prepare a
    large pile of cat and dog images, then use these images to train a classifier
    model.


    Red symbols represent dogs, blue symbols represent cats. The horizontal axis represents
    the degree to which the face shape is close to a circle, and the vertical axis
    represents the length of the fur. According to this two-dimensional coordinate
    system, this pile of cat and dog images is distributed as shown in Figure 3-26.


    Obviously, if we want to separate the red symbols representing dogs from the blue
    symbols representing cats, we just need to add a straight line in the middle.
    Like Figure 3-27, using a straight line to divide the plane into two, each side
    belonging to a different category. This classifier is actually the `Single-Layer
    Perceptron` learned in Chapter 2.


    ![](img/txt003_28.jpg "pagenumber_ebook=76,pagenumber_book=65")


    Figure 3-26　Distribution Map 1 of Cats and Dogs


    ![](img/txt003_29.jpg "pagenumber_ebook=76,pagenumber_book=65")


    Figure 3-27　Cutting Distribution Map 1 of Cats and Dogs


    ![](img/txt003_30.jpg "pagenumber_ebook=76,pagenumber_book=65")


    Figure 3-28　Distribution Map 2 of Cats and Dogs


    ![](img/txt003_31.jpg "pagenumber_ebook=76,pagenumber_book=65")


    Figure 3-29　Cutting Distribution Map 2 of Cats and Dogs


    But what if this pile of cat and dog images is distributed like Figure 3-28?


    When the complexity of samples increases, the shortcoming of the `Single-Layer
    Perceptron` being able to only "make one cut" is fully exposed. At this time,
    a `Multi-Layer Perceptron`, also known as a `Multi-Layer Artificial Neural Network`,
    can be used. The output of the lower-layer neurons serves as the input for the
    higher-layer neurons, thus forming the hidden layers in the artificial neural
    network. Returning to Figure 3-28, we can first make a horizontal cut between
    top and bottom (the yellow line in Figure 3-29), then a vertical cut between left
    and right (the green line in Figure 3-29), and then combine the top-left and bottom-right
    parts together, separating them from the top-right and bottom-left parts.


    In fact, each "cut" just now used a neuron in the artificial neural network. In
    the example of Figure 3-29, the `Single-Layer Neural Network` cannot distinguish
    this pile of images based on these features, but the `Multi-Layer Neural Network`
    can correctly classify them. As long as the number of cuts is appropriate and
    the cut results are organically combined, no matter what kind of sample data distribution
    is encountered, the `Artificial Neural Network` can perform effective differentiation.


    Here, we have successfully completed the classification of this pile of cat and
    dog images.


    > **Knowledge Expansion**

    >

    > **The Secret Behind CAPTCHA**

    >

    > Anyone who has used the Internet knows what a CAPTCHA is. Over the years, the
    forms of CAPTCHA have become increasingly fancy. Without some knowledge reserves,
    one might not even be able to understand the CAPTCHA (Figure 3-30). Some CAPTCHAs
    even test mouse operation proficiency; if the action is too slow, it fails.

    >

    > The use of CAPTCHA can be explained in one sentence: distinguishing whether
    the entity trying to log in is a computer or a real human.

    >

    > The full English name of CAPTCHA is `CAPTCHA`, an acronym for the super-long
    phrase `Completely Automated Public Turing test to tell Computers and Humans Apart`,
    which directly translates to "Completely Automated Public Turing Test to Tell
    Computers and Humans Apart".

    >

    > When the wave of the Internet just started to sweep the world, the most troubling
    thing was too much spam email. Some people even wrote programs specifically to
    register a large number of new email accounts every day to send spam promotional
    emails. Important emails in users'' inboxes were often drowned out by a large
    amount of spam, wasting a lot of resources. Internet companies and netizens suffered
    greatly. At this time, a programmer thought of a good solution. Humans can easily
    read handwritten text, but computer programs find it difficult to recognize. So,
    a threshold can be set during account registration: the distorted text provided
    must be entered to complete registration, used to identify computers and real
    humans. Since then, CAPTCHA was born.

