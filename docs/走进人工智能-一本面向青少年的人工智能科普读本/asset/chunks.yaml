    #### Knowledge Expansion: Volume, Pitch, and Timbre


    - **Volume**, also known as loudness. The magnitude of volume is generally related
    to the amplitude of vibration of the sound-producing object; the larger the amplitude,
    the greater the volume; the smaller the amplitude, the smaller the volume. Volume
    magnitude is generally recorded in `dB` (decibels).

    - **Pitch** height is generally related to the speed of vibration of the sound-producing
    object. The faster the vibration, the higher the pitch; the slower the vibration,
    the lower the pitch.

    - **Timbre**, also known as tone quality. Timbre reflects the quality and characteristics
    of sound. Different objects (including human vocal cords) produce sounds with
    different timbres, so we can distinguish different people''s voices.


