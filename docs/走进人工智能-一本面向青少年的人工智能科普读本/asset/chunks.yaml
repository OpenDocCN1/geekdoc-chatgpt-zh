    这里的新数值是用十进制来表示的，正如我们之前所说的那样，计算机只能处理用二进制0和1表示的信息，所以需要把这些十进制数转化为二进制数来记录，就类似表 4-2一样。


    表4-1　采样点的新数值（十进制）


    ![](images/txt004_19.jpg "pagenumber_ebook=104,pagenumber_book=93")


    表4-2　采样点的新数值（二进制）


    ![](images/txt004_20.jpg "pagenumber_ebook=104,pagenumber_book=93")


    到这里，声音经过麦克风转化成的电信号，经历了采样、量化等数字化过程，就转变成计算机可以直接处理的数字信号了。当然实际的整个过程比上面说的要复杂得多，这里为了方便大家理解，做了一定程度的简化。


    4.2.3　声音的特征


    声音转变成计算机可以直接处理的0和1这样的数字信号后，为了方便人们在计算机上对声音数字信号进行观察和编辑，大多用波形和频谱的方式来表示。


    不同的人说同样的话，发同样的音，声音的波形是不一样的，这是因为不同的人说话，发出的声音有着不同的特征（图4-18，图4-19）。


    音量不同，有的声音响一些，有的声音轻一些。


    音调不同，有的声音高一些，有的声音低一些。我们常说的“女高音”“男低音”歌唱家，指的就是音调的高低。


    音色不同，俗话说“只闻其声不见其人”，讲的就是虽然没看到人，但听到他的声音就知道是谁了。这里辨识人声主要就是通过声音的音色。


    这里要注意的是波形图无法表示音色特征，需要频谱图才能实现（图4-20，图4-21）。


    ![](images/txt004_21.jpg "pagenumber_ebook=105,pagenumber_book=94")


    图4-18　男声读“人工智能”的波形图


    ![](images/txt004_22.jpg "pagenumber_ebook=105,pagenumber_book=94")


    图4-19　女声读“人工智能”的波形图


    ![](images/txt004_23.jpg "pagenumber_ebook=105,pagenumber_book=94")


    图4-20　男声读“人工智能”的频谱图


    ![](images/txt004_24.jpg "pagenumber_ebook=105,pagenumber_book=94")


    图4-21　女声读“人工智能”的频谱图


    知识拓展


    二进制


    我们平时在数学中使用的是十进制，每个数位上最大是9，逢10就要进1位。什么是二进制呢？简单来说，二进制中每个数位上最大是1，逢2就要进1位，所以在二进制中只有0和1两个数字。电子电路中只有“断开”和“闭合”这两种状态，正好可以分别用0和1来代表，所以计算机和许多电子设备里都用到了二进制。


    现代的二进制记数系统是由德国著名的哲学家、数学家戈特弗里德·莱布尼茨于1679年设计。其实与二进制相关的系统在古埃及、中国和古印度的文化中也有出现，尤其是中国的《易经》给了莱布尼茨更多的联想。


    思考探索


    有什么办法可以把一个十进制数转化成二进制数呢？


    知识拓展


    音量、音调和音色


    音量，又叫响度。音量大小一般和产生声音的物体的振动幅度有关，振动幅度越大，音量就越大；振动幅度越小，音量就越小。一般用分贝（dB）来记录音量的大小。


    音调高低一般和产生声音的物体的振动快慢有关。振动越快，音调就越高；振动越慢，音调就越低。


    音色，又叫音品。音色反映的是声音的品质和特色，不同物体（包括人的声带）产生的声音音色是不同的，因此我们可以辨别不同的人讲话的声音。


    体验感知


    使用音频编辑软件录制一段语音，观察波形并试着编辑波形，听听会有什么变化。


    4.3　语音识别


    4.3.1　语音识别的准备


    语音识别技术是一种让机器“听得见”的技术，可以把我们说的话转变成文字，这究竟是怎么实现的呢？其实方法有很多，其中经典的语音识别算法是由声学模型、语言模型和发声词典组成的。我们就以它为例，来看看说话的语音是怎么一步步变成文本文字的。


    在进行识别之前需要先做一些准备工作。


    首先用大量声音数据训练一个声学模型，以用来将声音转换为声学符号（图4-22）。


    接着用大量文本数据训练一个语言模型，为声学符号找到可能的文字表达（图4-23）。


    ![](images/txt004_25.jpg "pagenumber_ebook=107,pagenumber_book=96")


    图4-22　声学模型


    ![](images/txt004_26.jpg "pagenumber_ebook=107,pagenumber_book=96")


    图4-23　语言模型


    4.3.2　语音识别的一般过程


    比如把“人工智能”这四个字读音的波形图放大，如图4-24所示。由于太长，这里只截取显示了一部分。


    ![](images/txt004_27.jpg "pagenumber_ebook=107,pagenumber_book=96")


    图4-24　“人工智能”四个字读音的波形图片段


    在开始语音识别之前，需要将波形进行一些预处理。比如录音时的环境噪声、没说话时的空白静音等多余的信息，预处理就是要把这些信息剔除，方便接下来的特征提取等操作。得到预处理好的声音后，就可以开始声学特征提取了，如提取梅尔频率倒谱系数（MFCC）、感知线性预测（PLP）。


    不过在这之前我们先要知道，语言由单词组成、单词由音素组成。因此对音素的识别可以说是语音识别技术的关键。


    知识拓展


    音　素


    世界上人类的语言有很多种，发音也各不相同，但无论哪种语言，都可以根据语音的自然属性划分成一个个最小的语音单位——音素。以汉语为例，“人工智能”四个字可以划分成“r，e，n，g，o，ng，zh，i，n，e，ng”这些音素。


    了解了什么是音素，接着我们来看语音识别的一般过程。


    第一步：对声音进行分帧，也就是把声音切分成一小段、一小段……每小段称为一帧（图4-25）。分帧的操作并不是简单地切开，而是按照一定的时间间隔，切割成彼此重叠的帧。


    第二步：通过声学模型，将这些帧识别成对应的语音状态，也就是用帧组成状态。这里所说的状态，可以理解成比音素更细致的语音单位。到底多少帧对应一个语音状态呢，由于每个人的音量、音调、音色都不同，因此，把帧识别成状态是语音识别技术中的一个难点。这里我们介绍一个简单的方法，就是通过训练好的声学模型去判定，看哪些帧对应某个状态的概率最大，那么这些帧就属于某个状态。


    第三步：用状态组成音素。一般用三个状态组合成一个音素（图4-26）。


    ![](images/txt004_28.jpg "pagenumber_ebook=108,pagenumber_book=97")


    图4-25　分帧的过程


    ![](images/txt004_29.jpg "pagenumber_ebook=108,pagenumber_book=97")


    图4-26　把帧识别成状态，用状态组成音素


    第四步：把音素组合成单词。在这个过程中，声学模型仍然非常重要，它能找到音素最可能的声学符号表达（如汉语拼音），结合发声词典，将声学符号与语言模型中最有可能的文字表达相对应，就能将声音转换成文字（图4-27）。


    综上所述，语音识别的一般过程如图4-28所示。


    ![](images/txt004_30.jpg "pagenumber_ebook=109,pagenumber_book=98")


    图4-27　把音素组合成单词


    ![](images/txt004_31.jpg "pagenumber_ebook=109,pagenumber_book=98")


    图4-28　语音识别的一般过程


    4.3.3声学模型的作用


    声学模型的主要作用就是把语音分成的帧识别成对应的状态，把状态组成音素，将音素对应到最有可能的声学符号表达（这里需要用到发声词典）。


    声学模型是怎么做到这些的呢？这个过程很复杂，可以简单理解为通过大量的语音数据来训练声学模型，从而更好地完成这些任务。


    训练声学模型的方法也有很多，传统的方法主要是采用混合高斯模型的隐马尔科夫模型（GMM-HMM），现在的方法则是使用深度神经网络的隐马尔科夫模型（DNN-HMM）。


    4.3.4　发声词典的作用


    发声词典也叫发音字典，不同的语言有着不同的发声词典。例如汉语普通话的发声词典，里面写的是汉语拼音与汉字的对应情况，就像表4-3一样，而英语的发声词典里就是音标与单词的对应情况。还是以汉语普通话为例，发声词典的主要作用是根据声学模型识别出来的音素，找到对应的汉语拼音和相应的汉字（词），在声学模型和语言模型中间建立连接，把两者联系起来。


    表4-3　汉语普通话发声词典示例


    ![](images/txt004_32.jpg "pagenumber_ebook=110,pagenumber_book=99")


    知识拓展


    声音的频段


    人耳能接收到的声音频率在 20 ～ 20 000赫兹（Hz），人们说话产生的语音频率在 80 ～ 12 000赫兹 。所谓频段就是按声音的频率分成几个区段，不同频段的声音给人们的感受也是不一样的。


    （1）20 ～ 60赫兹。提升这一频段可以给人声音很响的感觉，让音乐强有力，但如果提升太多， 会造成声音浑浊不清的感觉。


    （2）60 ～ 250赫兹 。这一频段是音乐的低频结构，它和中高音的比例构成了音色结构的平衡性。提升这一频段可以让声音感觉更丰满，但提升太多，则会发出隆隆声。


    （3）250 ～ 4 000赫兹 。这一频段是大多数乐器的低频谐波，还影响着人的语音和乐器等声音的清晰度。人耳对这一频段比较敏感，所以一般不调节，否则容易产生失真等各种问题。


    （4）4 000 ～ 5 000赫兹。这一频段影响着声音的距离感，提升这一频段会让人感觉与声音的来源更近；反之，则会让人感觉更远。


    （5）6 000 ～ 16 000赫兹。这一频段影响着音色的洪亮度和清晰度，提升这一频段会让声音更加洪亮但不清晰；反之，则会让声音更加清晰但显得单薄。这一频段适合还原人的语音。


    知识拓展


    语音识别技术的三种分类


    按语音识别的连续与否进行分类，可以分为孤立字词的识别和连续语音的识别。前者就是识别单独的一个个字或词，单字词的发音相对独立不受影响。后者就是对连续的语音进行识别，形成语句，一般需要发声词典，用来反映声学符号（如汉语拼音）和词之间的对应关系，还需要语言模型，用来反映词和词之间的正确关系。


    按距离麦克风的远近进行分类，可以分为近场识别和远场识别。前者指的是说话的时候需要离麦克风比较近，这样才能被识别，手机、平板电脑中的智能语音助手都采用了近场语音识别。后者指的是说话的时候即使离麦克风很远，也一样能被识别，智能音箱使用的就是远场语音识别。


    按说话人的语音特征进行识别，也就是我们常说的声纹识别。我们每个人的说话语音其实都有着不同的特征，就和手指指纹、眼睛虹膜一样，都具有独特性，可以用它们来识别讲话的人，作为身份验证的一种方法。


    思考探索


    1.在生活中，还有哪些地方用到了语音合成技术呢？能不能举几个例子？


    2.语音合成技术在给我们的学习生活带来便利的同时，有没有需要注意的问题？


    4.3.5　语言模型的作用


    汉语博大精深，相同的读音会有很多不同的字和词，那么怎么知道究竟哪个字词是正确的呢？


    就拿“r e n g o ng”为例，经过声学模型和发声词典的匹配后，可能得到同音的词语有仁公、人工、任工。


    例如在“这是一种人工打标签的方法”的语音中，机器该选哪个词语呢？这些词语在我们看来，很容易挑出正确的答案，但对机器来说却没有什么差别，这时就需要语言模型的帮助。它的主要作用就是从这些同音字词中，根据人们的语言习惯，筛选出最符合语句原本意思的字词，再将字词组合成句子。


    知识拓展


    循环神经网络


    循环神经网络（Recurrent Neural Network，RNN）是神经网络的一种，与传统的神经网络相比，每层的神经元之间也会有连接，这样的结构对处理序列化的数据很有优势。对一个序列而言，当前的输出与前面的输出有关，而语音识别时讲话的语音就是有时间序列的数据，往往前面的话和后面的话是有关联的，也就是我们平时说的联系上下文，所以运用循环神经网络对语音数据和文本数据进行学习训练，生成声学模型和语言模型，就可以对输入的语音进行很好的识别。


    知识拓展


    音素的划分


    如果我们根据语音的自然属性对一句语音进行划分，那么分出来的最小的语音单位，就是音素。从发音动作上来说，一般一个发音动作形成一个音素，比如 mi包含了 m和
    i两个发音动作，所以是两个音素。另外，同一音素的发音动作相同，不同音素的发音动作不同，比如 mi-ma， 当中的两个 m是同一音素，发音动作相同，而 i和a是不同的音素，
    所以发音动作也不同。人们通常就是根据发音动作来对音素进行分析的。


    动手实践


    请使用图形化编程软件，加载语音识别模块，编写相应的程序，看看能不能识别出你讲的话，并试着用语音的方式控制对象的动作。


    4.4　语音合成


    4.4.1　语音合成的准备


    语音合成技术是一种让机器“说得出”的技术， 可以把文字转变成语音，听上去好像和语音识别正好相反， 那么语音合成是不是只要把语音识别的过程反过来就可以了呢？有那么点意思，但可能还是有些不一样（图4-29）。


    ![](images/txt004_33.jpg "pagenumber_ebook=112,pagenumber_book=101")


    图4-29　语音识别与语音合成


    在语音识别之前需要做一些准备工作，在语音合成之前同样需要做一些准备工作。例如录制一些语音作为语音库，为了能够覆盖语言中的各个音素与各种音调等，录制的内容一般需要经过专门设计，而根据合成声音的不同方法，语音库的大小也不相同，从数小时到数百小时不等。


    4.4.2　语音合成的一般过程


    语音合成的一般过程可以分为以下两步。


    第一步：预测文本的读音。我们人在朗读文本的时候，会对文本进行分析，比如声调是什么样的，怎么分词，重音在哪里，节奏怎么样等。机器在语音合成时，首先要做的也是分析文本，这样才可能让生成的语音更加自然，这里一般需要用到自然语言处理技术。在完成文本分析等工作后，再把需要合成语音的文本信息转换成音素序列（图4-30）。


    第二步：合成声音。完成这一步的方法有很多，这里简单介绍其中的两种。一种方法是波形拼接法（图4-31），顾名思义，这是一种把声音波形拼接在一起，形成所需语音的方法。具体说来，就是根据之前第一步形成的音素信息，到语音库中寻找与之匹配的声音，进行必要的调整后，把这些声音波形拼接起来，完成声音的合成。


    ![](images/txt004_34.jpg "pagenumber_ebook=113,pagenumber_book=102")


    图4-30　预测文本的读音


    ![](images/txt004_35.jpg "pagenumber_ebook=113,pagenumber_book=102")


    图4-31　波形拼接法


    另一种方法是统计参数合成法，它会根据之前第一步形成的音素信息，先将其转换成连续的语音参数，然后结合从语音库中提取到的声音特征，运用相关算法生成相应的语音。


    这两种方法各有优缺点，在实际使用时往往会将两者相结合，可以达到更好的合成效果。


    以上这些是传统的语音合成的一般过程，随着机器深度学习技术的发展，端到端的语音合成技术日趋成熟。所谓端到端，指的就是只要一端输入文本，另一端就可以直接输出语音，在中间过程中使用深度学习技术对声学模型进行训练和应用。现在这种端到端的语音合成技术在输出语音的自然度和表现力方面更加优秀，逐渐成为主流的语音合成方法（图4-32）。


    ![](images/txt004_36.jpg "pagenumber_ebook=114,pagenumber_book=103")


    图4-32　语音合成


    思考探索


    在一些地图App里，可以听到某些明星的语音导航。他们说的话都是事先录好的，还是语音合成的呢？


    其实都有。像“左转”“右转”“掉头”等这些较短的语句通常都是真人提前录好的，而像“在前方第二个出口驶出环岛，进入汉中路”这样的关键信息经常变化的长句则都是语音合成的（图4-33）。


    ![](images/txt004_37.jpg "pagenumber_ebook=114,pagenumber_book=103")


    图4-33　语音库


    4.4.3　文本分析的作用


    在语音合成过程中想要预测文本的读音，就必须要进行文本分析。“文本分析”到底分析些什么呢？ 简单来说，它的主要工作就是对文本进行分词和标注。


    什么是分词呢？以汉语为例，在日常交流中，一句话一般由若干个字和词语构成，我们在读的时候，会自然地根据词语在句子中的含义进行切分，比如“这是人民广场”，我们一般会切分成“这是
    / 人民广场”，而不会切分成“这是 / 人民 / 广场”。但是对机器来说，中文语句是由许多个单字或词语组成的，字词之间的分割并不是很明显， 就像刚才的“人民广场”，切分成“人民”和“广场”似乎也没有错，却是不合适的。


    ![](images/txt004_38.jpg "pagenumber_ebook=115,pagenumber_book=104")


    图4-34　分词


    中文分词是非常复杂的， 如果再考虑一些特别的语句，可能就会更难了。比如：“上海人真多”，如果切分成“上海/ 人真多”或“上海人/ 真多”， 表达的意思就完全不同了（图4-34）。


    标注指的是对分好的字词信息进行标示，比如声调是几声，重音在哪里，有没有停顿等。


    思考探索


    在语音识别的过程中，需要对声学模型进行训练。在语音合成的过程中，需要对声学模型进行训练吗？如果需要，训练的过程一样吗？


    知识拓展


    语音合成技术的其他方法


    常见的语音合成技术方法除参数合成法和波形拼接法以外，还有以下三种。


    （1）共振峰合成法。这是一种使用电路来模拟人的声道模型，由此产生语音的方法。这种方法结构复杂，产生的语音带有比较浓郁的机器感。


    （2）发音器官合成法。这是一种按照人的发声器官结构来建立模型，由此产生语音的方法。这种方法目前还在研制阶段，因为人在发声时，对发声器官运动的测评非常困难。


    （3）语音转换法。这种语音合成方法，是把讲话人甲的语音转换成具有讲话人乙的语音特征的语音。使用这种语音合成方法，可以让机器模仿他人讲话。


