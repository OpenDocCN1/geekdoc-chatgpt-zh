    ### 1.3.3 Computer Gaming


    Computer gaming is one of the important research directions of AI. Computers can
    select optimal strategies and make decisions based on existing rules and the current
    situation.


    To understand strategies, let''s first learn about **decision trees**. The structure
    of a decision tree resembles a tree, with branching trunks and leaves. The branching
    points represent judgments on certain features; the branches represent the results
    of those judgments; and the leaves represent the final outcomes after judgment.


    Figure 1-19 is a simple classification decision tree, deciding whether one can
    make an appointment at a certain library during the COVID-19 pandemic.


