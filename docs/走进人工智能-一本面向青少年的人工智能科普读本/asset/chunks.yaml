    ### 4.3.5 Role of the Language Model


    Chinese is vast and profound; the same pronunciation corresponds to many different
    characters and words. So how do we know which character or word is correct?


    Take `r e n g o ng` as an example. After matching by the Acoustic Model and Pronunciation
    Dictionary, possible homophones include "仁公" (Rengong), "人工" (Artificial/Manual),
    "任工" (Rengong).


    For instance, in the speech "这是一种人工打标签的方法" (This is a manual labeling method),
    which word should the machine choose? These words look very easy for us to pick
    the correct answer, but to the machine, there is no difference. This is where
    the Language Model is needed. Its main role is to filter out the characters and
    words that best match the original meaning of the sentence according to people''s
    language habits from these homophones, and then combine the characters and words
    into sentences.


    #### Knowledge Expansion: Recurrent Neural Network


    `RNN` (Recurrent Neural Network) is a type of neural network. Compared with traditional
    neural networks, neurons between layers also have connections. This structure
    has advantages in processing sequential data. For a sequence, the current output
    is related to previous outputs. Speech in speech recognition is time-series data;
    often previous words and subsequent words are related, which is what we usually
    call context association. Therefore, using `RNN` to learn and train on speech
    data and text data to generate Acoustic Models and Language Models allows for
    good recognition of input speech.


    #### Knowledge Expansion: Phoneme Division


    If we divide a sentence of speech according to the natural attributes of speech,
    the smallest speech unit divided is the phoneme. From the perspective of articulation
    movements, generally one articulation movement forms a phoneme. For example, `mi`
    contains `m` and `i` two articulation movements, so it is two phonemes. In addition,
    the same phoneme has the same articulation movement, while different phonemes
    have different articulation movements. For example, in `mi-ma`, the two `m`s are
    the same phoneme with the same articulation movement, while `i` and `a` are different
    phonemes, so their articulation movements are also different. People usually analyze
    phonemes based on articulation movements.


