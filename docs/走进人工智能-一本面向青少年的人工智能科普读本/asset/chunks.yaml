    ## 2.5 Development of Machine Learning


    ### 2.5.1 History of Machine Learning Development


    At present, scholars researching artificial intelligence believe that machine
    learning has gone through five stages of development.


    **Stage 1: Embryonic Period (1940s)**


    During this period, scholars introduced the concept of neurons from biology. Based
    on analyzing the basic characteristics of neurons, they proposed the `M-P Neuron
    Model`, laying the foundation for the development of machine learning.


    **Stage 2: Fervent Period (1950s — Mid-1960s)**


    The famous "Turing Test" was proposed during this period. Not only that, but neurologists
    also proposed the simplest mathematical model of a neural network—the Perceptron.
    During this period, the earliest Decision Tree algorithms, `SVM` (Support Vector
    Machine), and Bayesian Classifiers were proposed.


    **Stage 3: Quiet Period (Mid-1960s — Mid-1970s)**


    Due to the Perceptron''s simple structure and its ability to handle only simple
    linear problems, technology could not break through limitations. During the quiet
    period, machine learning development stagnated. Even so, the `KNN` (K-Nearest
    Neighbor) classification algorithm was proposed in 1967.


    **Stage 4: Revival Period (Mid-1970s — Late 1980s)**


    In the 1970s, learning methods such as self-training, transductive learning, and
    generative models appeared, which can be considered the origin of semi-supervised
    learning.


    In 1980, machine learning research flourished worldwide. In 1986, machine learning
    gradually attracted worldwide attention and began to accelerate development. The
    book *Parallel Distributed Processing: Explorations in the Microstructure of Cognition*
    proposed a learning rule applied to multi-layer neural networks—the `BP Algorithm`
    (Backpropagation Algorithm), promoting the development of artificial neural networks.
    Besides the `BP Algorithm`, various neural networks also developed rapidly during
    this period. In 1986, the `ID3 Algorithm` in decision tree algorithms was proposed.
    Shortly after, `CNN` (Convolutional Neural Networks) emerged.


    The biggest breakthrough in the machine learning field during the revival period
    was the enrichment of artificial neural network types, thereby making up for the
    defect of the Perceptron''s single structure.


    **Stage 5: Diversified Development Period (1990s — Present)**


    Entering the 1990s, statistical learning prevailed, and various shallow machine
    learning models emerged one after another, such as `LR` (Logistic Regression),
    `SVM`, etc.


    In 2006, the concept of Deep Learning was formally proposed.


    ### 2.5.2 Deep Learning and Machine Learning


