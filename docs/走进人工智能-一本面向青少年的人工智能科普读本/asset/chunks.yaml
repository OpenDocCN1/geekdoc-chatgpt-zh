- raw: "![](images/txt001_15.jpg \"pagenumber_ebook=25,pagenumber_book=14\")\n\n人工智能硬件算力的核心是计算机芯片，其中人工智能芯片的主要类型如下。\n\
    \nGPU（图形处理器）：进行图形、图像相关运算工作的微处理器。\n\nFPGA（现场可编程门阵列）：专用集成电路领域中的一种半定制电路，可编程、可升级、可迭代。\n\
    \nASIC（专用集成电路）：应特定用户要求和特定电子系统的需要而设计、制造的集成电路，比如专用的音频、视频处理器。\n\n类脑芯片：人工智能芯片中的一种架构。它是模拟人脑进行设计的，相比传统芯片，在功耗和学习能力上具有更大优势。\n\
    \n2017年，中国科学院计算技术研究所发布了全球首个可以进行“深度学习”的“神经网络”处理器芯片——“寒武纪”（图1-14）。\n\n2019年，清华大学类脑计算研究中心开发出了全球首款异构融合类脑计算芯片\
    \ ——“天机芯”。这一成果登上顶级学术期刊《自然》（Nature）的封面（图1-15）。\n\n2020年，中国科学技术大学与中国科学院上海微系统所、国家并行计算机工程技术研究中心合作，成功构建76个光子的量子计算原型机“九章”。“九章”求解5\
    \ 000万个样本的高斯玻色取样只需200秒，比当年最快的超级计算机快了约100亿倍。这一突破使我国成为全球第二个实现“量子优越性”的国家。\n\n数据、算法、算力是人工智能中必不可少的驱动力，随着三大关键技术的不断更新升级，人工智能未来可期。\n\
    \n![](images/txt001_16.jpg \"pagenumber_ebook=26,pagenumber_book=15\")\n\n图1-14　寒武纪芯片\n\
    \n![](images/txt001_17.jpg \"pagenumber_ebook=26,pagenumber_book=15\")\n\n图1-15　“天机芯”登上《自然》封面\n\
    \n1.3　走进人工智能\n\n在许多电影中，机器人都具备人工智能，但是我们需要知道，机器人仅仅是人工智能的一种载体，并不是说人工智能就等于机器人。\n\n\
    人工智能包含许多技术，机器能像人一样会“看”是使用了计算机视觉技术；会“听”是使用了智能语音技术中的语音识别；会“说”是使用了智能语音技术中的语音合成；会“学习”是使用了机器学习技术。\n\
    \n不仅如此，人工智能还包含自然语言技术、知识图谱、虚拟现实（VR）/增强现实（AR）、人机博弈等。\n\n1.3.1　计算机视觉\n\n明星演唱会有时还附加了“抓捕逃犯”的功能！仅通过华语乐坛一位明星在2018年的巡回演唱会，前前后后共抓捕了\
    \ 55名在逃犯人。这些抓捕行动得以圆满完成，背后有一个大“功臣”——天网工程。天网工程的核心技术之一就是计算机视觉的图像处理与识别技术。通过设置在现场的高清摄像头，清晰地捕捉到演唱会现场观众的面部特征，并且迅速和公安系统信息库中存储的信息进行对比。一经发现疑犯，立即采取行动抓捕，真正做到了“天网恢恢，疏而不漏”。\n\
    \n计算机视觉技术除了可以帮助抓捕逃犯，在日常生活中也给我们带来了很多便利。例如，手机上的人脸识别功能我们经常用来解锁手机、完成支付等；人脸识别考勤系统在很多公司也得到了应用（图1-16）。\n\
    \n![](images/txt001_18.jpg \"pagenumber_ebook=27,pagenumber_book=16\")\n\n图1-16　人脸识别考勤系统\n\
    \n计算机视觉技术在医疗领域也有广泛的应用。与医学影像结合，发展成为“智能医学影像”。原本一个放射科医生每天接诊近百名患者，那么他一天要分析的影像就达到近千张。“智能医学影像”能大大减少医生的压力，它的自动化分析速度比一般放射科医生要快\
    \ 62%～97%，每年可以节省大量人工费用。\n\n计算机视觉还拓展出了三维视觉、图像风格化等功能。比如人工智能还能使图片更加艺术化，使平凡的图片具有莫奈的《睡莲》这种印象派风格，使普通图片变成艺术作品。\n\
    \n体验感知\n\n打开Prisma照片编辑器。处理一张照片，将同一张照片使用不同的风格，这将给你怎样的视觉感受（图1-17）？\n\n![](images/txt001_19.jpg\
    \ \"pagenumber_ebook=28,pagenumber_book=17\")\n\n图1-17　上海图书馆照片效果对比图\n\n知识拓展\n\n\
    “风格化”滤镜\n\n“风格化”滤镜通过置换像素和查找并增加图像的对比度，在选区中生成绘画或印象派的效果。它是完全模拟真实艺术手法进行创作的。\n\n1.3.2　智能语音\n\
    \n我们先来看一段对话，一名顾客正在电话预约美发服务。\n\n店员　您好，有什么能帮您的吗？\n\n顾客　你好，我想为客户预约一个女士美发。日期是5月3日。\n\
    \n店员　好的，请稍等。\n\n顾客　嗯。\n\n店员　请问您想预订哪个时间段呢？\n\n顾客　中午12点吧。\n\n店员　我们12点已经约满了，最近的时间是下午1点15分。\n\
    \n顾客　那10点到12点呢？\n\n店员　这要看顾客想要什么服务了。她需要哪种服务呢？\n\n顾客　只要女士理发就行。\n\n店员　好的，10点就可以。\n\
    \n顾客　她的名字是丽莎。\n\n店员　好的，那就和丽莎在5月3日上午10点见。\n\n顾客　没错，很好，辛苦了。\n\n店员　好的，祝您愉快，再见。\n\n\
    这组对话中有一个是机器人，你能猜出到底谁是机器人，是店员还是顾客呢？\n\n其实这名“顾客”是一个“机器人”。你猜对了吗？这段对话来自2018年谷歌I/O大会现场演示视频，这个人工智能的名字叫做谷歌Du\
    \ plex。这段对话听起来太神了，人类和人工智能的界限愈发模糊，人类店员和人工智能顾客的声音几乎没有差异——后者的语音语调非常精准，完全不机械化，它甚至会在回答问题之前加点语气词（“嗯”），就像真正的人类那样。\n\
    \n在人机语音对话中，智能语音技术是必不可少的。智能语音技术包含语音识别技术与语音合成技术，前者将语音转成文字，后者将文字转为语音。智能语音技术赋予机器能听会说的本领。在日常生活中，我们使用语音输入法进行文字输入，使用手机导航时听到语音播报，这些都离不开智能语音技术。\n\
    \n除了智能语音技术外，为了能让机器更好地理解人类的语言，说话更符合人类的说话方式，自然语言处理技术在其中起到了积极作用。自然语言处理技术与智能语音技术双剑合璧，使得人类与机器进行语音对话更为顺畅。\n\
    \n体验感知\n\n打开语音助手，尝试着和它对话，并把你们的对话记录下来（图1-18）。\n\n![](images/txt001_20.jpg \"pagenumber_ebook=30,pagenumber_book=19\"\
    )\n\n图1-18　与语音助手的对话\n\n1.3.3　计算机博弈\n\n计算机博弈是人工智能重要的研究方向之一。计算机能根据既有的规则和临场局势，选择最佳策略做出决策。\n\
    \n为了解决策，我们先来了解决策树。决策树的结构很像一棵树，有分叉的树干和树叶。枝杈的分叉处是关于某个特征的判断，枝杈是关于特征的判断结果，而树叶则是判断过后产生的结果。\n\
    \n图1-19就是一个简单的分类决策树，决策出新冠肺炎疫情期间是否可以到某图书馆进行预约。\n\n![](images/txt001_21.jpg \"pagenumber_ebook=30,pagenumber_book=19\"\
    )\n\n图1-19　决策树\n\n![](images/txt001_22.jpg \"pagenumber_ebook=31,pagenumber_book=20\"\
    )\n\n图1-20　人机对弈\n\n我们发现通过对特定情况或事件的层层确认，可以最终做出判断，决定下一步方案。历史上人机对弈的“三盘棋”，就是典型的计算机博弈（图1-20）。\n\
    \n1.3.4自然语言处理\n\n语言是人类区别于其他动物的特征，人的许多智能都和语言有密不可分的联系。自然语言是人类日常使用的语言。\n\n我们先来看以下这些讯息：\n\
    \n某记者在四川九寨沟地震后25秒写出速报，信息完整，参数准确。\n\n某体育记者16天撰写出450多篇体育新闻，与直播同步发布。\n\n某财经编辑一天写出1\
    \ 900篇稿件，震惊业界。\n\n你能想到这个“某记者”“某编辑”压根就不是普通人吗？它们是机器人！这些机器人非常擅长写体育、财经、科技等领域稿件，既有速度又有质量，而且只要不断电，24小时随时工作。以腾讯Dreamwriter\
    \ 写稿机器人为例，半年写稿30万篇，600万字，2016年奥运期间产出了3 600余篇体育新闻，绝对的“业界劳模”。\n\n机器翻译属于自然语言处理其中的一种。世界上有那么多的种族，各种族大都有自己的语言体系。各国语言不通阻碍了大家的交流，是一个令人头疼的问题。作为一个普通人，想完成“世界那么大，我想去看看”的愿望，语言关必须要过。但是学好一门外语已经不容易了，更何况还有那么多语言，普通人根本无法全部掌握。随着翻译机的出现，现在这个问题已经得到很好的解决。\n\
    \n以我国强大先进的翻译机为例，它不仅覆盖了全球近200个国家和地区的语言，而且还能识别出加拿大、英国、澳大利亚、印度、新西兰五个国家的带口音的英语和我国的四种方言（粤语、四川话、东北话、河南话）。这个功能非常了不起并且非常实用。\n\
    \n思考探索\n\n上网查询Dreamwriter撰写奥运新闻的相关讯息，思考它是如何做到的。\n\n知识拓展\n\n人工智能分类\n\n弱人工智能：可以解决具体问题的人工智能。例如围棋机器人只会下围棋，即使让它完成幼儿园小朋友的拼图游戏，它都不会。目前大多数的人工智能为弱人工智　能。\n\
    \n强人工智能：像人类一样独立思维、学习感知的智能。\n\n超人工智能：在几乎所有领域都超过人类智慧的人工智能。\n\n在人机共存的新纪元，人工智能、大数据、5G等新兴技术全面融入各行各业，人工智能处在第四次科技革命的核心地位。人工智能在生活、学习和工作中的应用越来越广泛和深入，涉及的领域也不限于以上几个方面，在后续章节中我们将继续探讨。\n\
