    ## 4.4 Speech Synthesis


    ### 4.4.1 Preparation for Speech Synthesis


    Speech synthesis technology is a technology that enables machines to "speak,"
    converting text into speech. It sounds exactly the opposite of speech recognition.
    So, is speech synthesis just reversing the process of speech recognition? There
    is some truth to that, but there are still some differences (Figure 4-29).


    ![](img/txt004_33.jpg "pagenumber_ebook=112,pagenumber_book=101")

    Figure 4-29　Speech Recognition vs. Speech Synthesis


    Just as preparation is needed before speech recognition, preparation is also needed
    before speech synthesis. For example, recording some speech as a speech corpus
    (voice library). To cover various phonemes and intonations in the language, the
    recorded content generally needs special design. Depending on different synthesis
    methods, the size of the voice library varies, ranging from a few hours to hundreds
    of hours.


    ### 4.4.2 General Process of Speech Synthesis


    The general process of speech synthesis can be divided into the following two
    steps.


    **Step 1**: Predict the pronunciation of the text. When we humans read text, we
    analyze it, such as what the tones are, how to segment words, where the stress
    is, what the rhythm is like, etc. When machines perform speech synthesis, the
    first thing to do is also to analyze the text, so that the generated speech can
    be more natural. Natural Language Processing (NLP) technology is generally needed
    here. After completing text analysis and other work, the text information to be
    synthesized is converted into a phoneme sequence (Figure 4-30).


    **Step 2**: Synthesize sound. There are many methods to complete this step; here
    we briefly introduce two. One is the Waveform Concatenation Method (Figure 4-31).
    As the name suggests, this is a method of concatenating sound waveforms together
    to form the required speech. Specifically, based on the phoneme information formed
    in the previous step, matching sounds are searched in the voice library. After
    necessary adjustments, these sound waveforms are concatenated to complete the
    sound synthesis.


    ![](img/txt004_34.jpg "pagenumber_ebook=113,pagenumber_book=102")

    Figure 4-30　Predicting Text Pronunciation


    ![](img/txt004_35.jpg "pagenumber_ebook=113,pagenumber_book=102")

    Figure 4-31　Waveform Concatenation Method


    The other method is Statistical Parametric Synthesis. It converts the phoneme
    information formed in the first step into continuous speech parameters, then combines
    the sound features extracted from the voice library, and uses relevant algorithms
    to generate the corresponding speech.


    These two methods have their own pros and cons. In actual use, they are often
    combined to achieve better synthesis effects.


    The above is the general process of traditional speech synthesis. With the development
    of machine deep learning technology, end-to-end speech synthesis technology is
    becoming increasingly mature. "End-to-end" means that as long as text is input
    at one end, speech can be directly output at the other end. In the intermediate
    process, deep learning technology is used to train and apply the Acoustic Model.
    Currently, this end-to-end speech synthesis technology is more excellent in the
    naturalness and expressiveness of output speech, gradually becoming the mainstream
    speech synthesis method (Figure 4-32).


    ![](img/txt004_36.jpg "pagenumber_ebook=114,pagenumber_book=103")

    Figure 4-32　Speech Synthesis


    #### Thinking Exploration


    In some map Apps, you can hear certain celebrities'' voice navigation. Are the
    words they say pre-recorded, or are they synthesized?


    Actually, both exist. Short phrases like "Turn left," "Turn right," "Make a U-turn"
    are usually pre-recorded by real people, while long sentences with frequently
    changing key information like "Exit the roundabout at the second exit ahead, enter
    Hanzhong Road" are synthesized (Figure 4-33).


    ![](img/txt004_37.jpg "pagenumber_ebook=114,pagenumber_book=103")

    Figure 4-33　Voice Library


    ### 4.4.3 Role of Text Analysis


    To predict the pronunciation of text in the speech synthesis process, text analysis
    must be performed. What exactly does "Text Analysis" analyze? Simply put, its
    main work is word segmentation and annotation of the text.


    What is word segmentation? Taking Chinese as an example, in daily communication,
    a sentence generally consists of several characters and words. When we read, we
    naturally segment according to the meaning of words in the sentence. For example,
    "这是人民广场" (This is People''s Square), we generally segment as "这是 / 人民广场" (This
    is / People''s Square), not "这是 / 人民 / 广场" (This is / People / Square). But for
    machines, Chinese sentences are composed of many single characters or words, and
    the boundaries between characters and words are not obvious. Just like "人民广场"
    (People''s Square) just now, segmenting into "人民" (People) and "广场" (Square) doesn''t
    seem wrong, but is inappropriate.


    ![](img/txt004_38.jpg "pagenumber_ebook=115,pagenumber_book=104")

    Figure 4-34　Word Segmentation


    Chinese word segmentation is very complex. If some special sentences are considered,
    it might be even more difficult. For example: "上海人真多" (There are really many people
    in Shanghai / Shanghainese are really many). If segmented as "上海 / 人真多" (Shanghai
    / People really many) or "上海人 / 真多" (Shanghainese / Really many), the expressed
    meanings are completely different (Figure 4-34).


    Annotation refers to marking the segmented character/word information, such as
    which tone, where the stress is, whether there are pauses, etc.


    #### Thinking Exploration


    In the speech recognition process, the Acoustic Model needs to be trained. In
    the speech synthesis process, does the Acoustic Model need to be trained? If so,
    is the training process the same?


    #### Knowledge Expansion: Other Methods of Speech Synthesis Technology


    Common speech synthesis technology methods, besides Parametric Synthesis and Waveform
    Concatenation, include the following three.


    1. **Formant Synthesis**. This is a method of simulating the human vocal tract
    model using circuits to produce speech. This method has a complex structure, and
    the produced speech has a strong mechanical feel.

    2. **Articulatory Synthesis**. This is a method of establishing a model according
    to the structure of human speech organs to produce speech. This method is still
    in the research stage because measuring the movement of speech organs during human
    phonation is extremely difficult.

    3. **Voice Conversion**. This speech synthesis method converts Speaker A''s speech
    into speech with Speaker B''s voice characteristics. Using this method, machines
    can imitate others'' speech.


    #### Hands-on Practice


    1. Please open a search engine, search for "iFLYTEK Open Platform - Online Speech
    Synthesis" (讯飞开放平台—在线语音合成), try inputting some Chinese, English, and Arabic numerals,
    and see if these mixed contents can be correctly read aloud in different voices.


    '
