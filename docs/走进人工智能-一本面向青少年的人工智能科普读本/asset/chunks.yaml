    )\n\n## 1.1　Getting to Know AI\n\n### 1.1.1　Starting from the World AI Conference\n\
    \nThe future is here! Artificial Intelligence (`Artificial Intelligence`, `AI`)\
    \ is unknowingly walking into our lives; the era belonging to AI has arrived.\n\
    \nSince 2018, Shanghai has held the \"World Artificial Intelligence Conference\"\
    \ (`WAIC`) every year. The 2020 WAIC featured the Youth AI Innovation and Development\
    \ Forum (Figure 1-1).\n\nWhen the youth are wise, the nation is wise; when the\
    \ youth are strong, the nation is strong. Starting AI education from childhood\
    \ and creating an AI learning environment for youth is the eternal theme of the\
    \ Youth AI Innovation and Development Forum.\n\nGeneral Secretary Xi Jinping said:\
    \ \"Artificial Intelligence is a strategic technology leading a new round of technological\
