    ## Introduction


    Computer Vision Technology uses computers, cameras, and other devices to simulate
    human vision, observing and understanding the external world. It is an important
    component of the AI field. Computer Vision can achieve various tasks such as Image
    Processing, Image Recognition, Object Detection, and Object Tracking. With the
    continuous development of this technology, it has been applied in Public Safety,
    Intelligent Transportation, Industrial and Agricultural Production, Medical Diagnosis,
    and many other fields.


    ![](img/txt003_2.jpg "pagenumber_ebook=64,pagenumber_book=53")


    ## 3.1 Understanding Computer Vision Technology


    ### 3.1.1 Computer Vision Technology Around Us


    In our study and life, we encounter various cameras. For example, cameras at school
    gates measuring body temperature, security cameras in teaching buildings, cameras
    in classrooms for roll call. Classroom cameras can even detect behaviors like
    reading, raising hands, writing, standing, listening, lying on desks during class
    interaction, and combined with facial expressions (happy, sad, angry, disgusted),
    analyze our status in class. On the way to and from school, we see surveillance
    cameras in subways, buses, and on roads; cameras at community barriers that recognize
    license plates. At home, we can use phone cameras to photograph homework and check
    if answers are correct.


    All these use cameras connected to computers and other devices, employing a technology
    called Computer Vision. This is the science of making machines "see." Further,
    it uses cameras and computers to replace human eyes for target recognition, tracking,
    and measurement, and obtains corresponding information through image processing.


    #### Experience Perception


    1. This is a screenshot of a commemorative stamp issued by China Post for a unique
    Chinese plant (Figure 3-1). The plant name in the image is missing. Can we identify
    this plant?


    It turns out this plant is called *Abies beshanzuensis* (Baishanzu Fir), a plant
    unique to China. Did you get it right?


    2. A new semester begins. Student Xiao Neng wants to buy a pen suitable for writing
    (Figure 3-2). The classmate only sent a photo. Xiao Neng doesn''t know where to
    buy it. Can you help solve this?


    For example, use the "Photo Search" function of a Shopping App to see if you can
    find the corresponding purchase link.


    ![](img/txt003_3.jpg "pagenumber_ebook=65,pagenumber_book=54")

    Figure 3-1　China Post Commemorative Stamp Screenshot


    ![](img/txt003_4.jpg "pagenumber_ebook=65,pagenumber_book=54")

    Figure 3-2　Desired Pen


    ### 3.1.2 History of Computer Vision Technology Development


    Computer Vision is the science of making machines "see." Further, it studies how
    to acquire information from images or multi-dimensional data for perception.


    In 1966, AI scientists assigned homework requiring students to write a program
    that, when run on a computer, could tell what it saw through a camera. This is
    considered the earliest task description of Computer Vision.


    In the 1970s and 80s, with the gradual popularization of modern electronic computers,
    Computer Vision technology initially sprouted. Scientists began trying to let
    computers answer what exactly they saw. The first thought was to draw inspiration
    from how humans see things.


    One: At the time, people generally believed humans could see and understand things
    because they could observe objects stereoscopically through two eyes. Therefore,
    to let computers understand the images they see, the scenery must first be restored
    from 2D images to 3D structures. This is the so-called "3D Reconstruction" method
    (Figure 3-3).


    ![](img/txt003_5.jpg "pagenumber_ebook=66,pagenumber_book=55")

    Figure 3-3　Schematic of Human Binocular Vision Observing 3D Objects


    Two: People believed humans could recognize an apple because they already knew
    apples—e.g., apples can be red, yellow, green, round, smooth. If a similar knowledge
    base was built for computers, letting computers match seen images with reserved
    knowledge in the knowledge base, could computers recognize and even understand
    what they see? This is the so-called "Prior Knowledge Base" method (Figure 3-4).


    ![](img/txt003_6.jpg "pagenumber_ebook=67,pagenumber_book=56")

    Figure 3-4　Prior Knowledge Base Schematic


    This method could only extract a few basic features, had low practicality, and
    could only be used in Optical Character Recognition, Microscopic or Aerial Photo
    Recognition, etc.


    In the late 1970s, with the improvement of computer performance, image processing
    became possible, and Computer Vision received true attention and development.
    The publication of the book *Vision* in 1982 marked Computer Vision becoming an
    independent discipline.


    In the 1990s, Computer Vision technology achieved greater development. On one
    hand, because image processing hardware technologies like `CPU` (Central Processing
    Unit) and `DSP` (Digital Signal Processing) made rapid progress; on the other
    hand, scientists invented more advanced algorithms, including the introduction
    of Statistical Methods and Local Feature Descriptors. Computer Vision technology
    began to be widely applied in Industrial fields.


