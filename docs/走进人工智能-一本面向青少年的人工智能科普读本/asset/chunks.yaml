- raw: "R-Net神经网络精细程度还不够，还是不能精确检测人脸，再把R-Net神经网络输出的人脸检测，输入到最精细的O-Net神经网络。O-Net能精确检测人脸，所以输出的时候多了关键点位置和检测框的坐标以及置信度。\n\
    \n实际具体的算法远比以上复杂得多，有兴趣的同学可以自行查阅相关资料继续探索。\n\n有时候图像上不止一张人脸，那么通常最大的人脸就是我们想关注的焦点人物，所以有必要找出最大的人脸。一般来说，只要计算检测框的面积就可以了，而检测框的面积可以用检测框的坐标计算得到。\n\
    \n体验感知\n\n打开搜索引擎，搜索“腾讯AI开放平台—人脸识别”，选择“人脸检测与分析”或“多人脸检测”，看看是否能在上传的照片中识别出人脸。\n\n\
    3.4.4　人脸特征提取\n\n计算机检测到人脸之后，根据输入的人脸图像，寻找并定位出面部关键特征点，比如眼睛、鼻尖、嘴角点、眉毛以及人脸各部分轮廓点等，如图3-53所示的绿色的点。如果人脸图像因为角度、姿态关系有些歪的话，可以根据关键特征点，使用变换的方法把人脸“对齐”，或者说进行“摆正”，提高识别准确率。\n\
    \n之前在图像识别部分，我们了解了图像的特征提取，还记得使用了什么方法吗？没错，我们使用了HOG特征算法。同样，在人脸识别中也可以使用HOG特征算法，就像图3-54这样。\n\
    \n![](images/txt003_55.jpg \"pagenumber_ebook=91,pagenumber_book=80\")\n\n图3-53　人脸关键特征点\n\
    \n![](images/txt003_56.jpg \"pagenumber_ebook=91,pagenumber_book=80\")\n\n图3-54　HOG特征算法\n\
    \n通过提取人脸图像的HOG特征，就能为下一步人脸识别做好准备。\n\n那么，人脸识别的特征提取是不是只有这一种方法呢？当然不是，在有些手机使用的人脸识别技术中，提取人脸特征时就使用了一种叫作“结构光”的技术。\n\
    \n在手机屏幕正上方有个刘海一样的区域（图3-55），里面有一组红外相机和点阵投影器。点阵投影器通过向人脸投射数万个精心设计、特殊排列的红外光点（人眼不能识别的红外线，所以不会有任何感觉）。因为人脸凹凸不平，点阵的图案就会发生变化，这有点类似有些公园提供的“百变针画”的游艺项目，如图3-56所示。\n\
    \n![](images/txt003_57.jpg \"pagenumber_ebook=92,pagenumber_book=81\")\n\n图3-55　屏幕“刘海”区域\n\
    \n![](images/txt003_58.jpg \"pagenumber_ebook=92,pagenumber_book=81\")\n\n图3-56　百变针画（针雕）\n\
    \n手机通过红外相机读取人脸表面的光信息，再结合前置摄像头获取的人脸图像进行计算，就能获取带有深度信息的人脸特征。\n\n与一般通过二维图像进行人脸识别的方法相比，这种人脸识别的精度在0.1毫米级别，还能够在微光甚至无光的情况下正常工作，可以抵御纸张、视频等平面图像对人脸识别系统的攻击。\n\
    \n体验感知\n\n打开搜索引擎，搜索“腾讯AI开放平台—人脸识别”，选择“五官定位”，看看是否能在上传的照片中找到五官的位置。\n\n3.4.5　人脸比对\n\
    \n我们通过前面一系列的步骤获取到了人脸特征，目的就是与人脸数据库中的图像信息进行比对，换句话说人脸识别就是将待识别的人脸特征与已得到的人脸特征进行比较，根据相似程度对人脸的身份信息进行判断。\n\
    \n又可以把“比较”分成两类：一类是一对一进行图像比较的过程，可以叫作确认，通俗说就是证明两张人脸图像是否属于同一人；另一类是一对多进行图像匹配对比的过程，可以叫作辨认，通俗说就是能不能找到这个人。\n\
    \n在第一类比较场景中，提取到人脸的特征值后，与事先准备好的人脸的特征值进行比对。通常事先准备好的人脸特征值是从受限制条件下的人脸图像中获取的，比如身份证、护照照片等。只要两者比对的相似度在一个确定的阈值范围内，我们就认为确认了两者是同一个人，如图3-57所示。你能说说这一类比较在现实生活中还有哪些应用吗？\n\
    \n在第二类比较场景中，将提取到的需要比对的人脸特征值，与人脸数据库中所有人脸的特征值进行比对。这个人脸数据库可以是事先准备好、已经存在的，也可以是通过摄像头从实时采集到的人脸图像中提取的。这类场景中的人脸数据库通常是非限制条件下的人脸图像，比如街道、商场、学校、机场、码头等各种公共场所的监控中的图像，所以对人脸识别预处理要求较高。大家想一想，还能列举一些在现实生活中这样的比较场景吗？\n\
    \n![](images/txt003_59.jpg \"pagenumber_ebook=93,pagenumber_book=82\")\n\n图3-57　相似度与阈值\n\
    \n这类一对多比较的人脸识别应用场景，有一种用途特别牵动人心。我们都是各自家庭的宝贝，父母花了巨大心血把子女养育成人，但是有的家庭遭遇了不幸，孩子被人贩子拐卖，这对整个家庭而言无疑是沉重的打击。\n\
    \n我国的腾讯、百度等多家公司的团队都在致力于开发运用基于人脸识别的人工智能技术寻找被拐儿童的公益项目。我们知道，一个人从幼年到童年再到成年、老年，人脸特征是有很大变化的。人脸识别技术的发展正让这个问题得到更好的解决，技术人员利用人脸特征成长算法，可以根据孩子幼年时期的照片生成一张如今样貌的照片，同样也可以将幼年的照片与现在的照片进行跨年龄的人脸识别比对，就像图3-58这样。\n\
    \n通过这样的人工智能识别技术进行初步筛选，最后结合父母与疑似被拐孩子的DNA（脱氧核糖核酸）鉴定技术，可以近乎100%确定两者是否有血缘关系。据报道，目前犯罪分子采取盗窃、抢夺、拐骗等方式实施的拐卖儿童案件全国年发案只有几十起，基本上实现了现行案件快侦快破。那些离现在比较久远的拐卖儿童积案，受限于当时的技术条件，虽然尚未侦破，但公安机关并没有停止努力，通过建立以人脸识别技术为代表的人工智能技术，结合全国打拐DNA信息库，截至2019年，共找回被拐多年儿童6\
    \ 000余名。我们的科学家们还在不断优化跨年龄人脸识别模型，即使目前的识别准确率已经很高，但他们还将挑战更大的年龄跨度，期望能找到分别时间更久的孩子，让丢失孩子的家庭破镜重圆。\n\
    \n![](images/txt003_60.jpg \"pagenumber_ebook=94,pagenumber_book=83\")\n\n图3-58　跨年龄人脸识别\n\
    \n科技以人为本，人脸识别更是应该如此。科技进步让人们的工作、生活更加便捷和高效，但同时也要留意那些不恰当、不正确地使用科技的做法，在人脸识别领域，人脸识别的信息安全同样非常重要。\n\
    \n体验感知\n\n1.打开搜索引擎，搜索“腾讯AI开放平台—人脸识别”，选择“人脸对比”，上传两张含有人脸的照片，看看相似度有多少。\n\n2.在上述开放平台中，选择“跨年龄人脸识别”，上传两张同一人不同年龄拍摄的照片，看看相似度有多少。\n\
    \n\uFEFF\n\n第4章　会听说的人工智能\n\n![](images/txt004_1.jpg \"pagenumber_ebook=96,pagenumber_book=85\"\
    )\n\n导　言\n\n如果说计算机视觉技术让机器可以“看得见”，那么智能语音技术就让机器可以“听得见”和“说得出”。我们知道，听说是人类日常交流所需的基本能力，如果机器拥有了智能语音技术，就可以像人类一样能听会说，具备了与人类对话的前提条件。在这一章，我们将要学习探索人工智能领域中的智能语音技术。\n\
    \n![](images/txt004_2.jpg \"pagenumber_ebook=96,pagenumber_book=85\")\n\n4.1　认识智能语音技术\n\
    \n4.1.1　身边的智能语音技术\n\n早晨起床，你想知道今天的天气怎么样，于是你打开手机的语音助手，轻声问道：“今天的天气怎么样？”\n\n“上海市当前天气为晴，气温24度。预计从夜间开始局部多云。到今天夜间，气温将从24度下降到18度。”语音助手很快做出了回答。\n\
    \n在刚才的这个过程中，就用到了智能语音技术（图4-1）。\n\n大致说来，手机通过语音识别技术听见了你的问题，结合自然语言处理技术和相关应用程序，理解了你的问题并找到了问题答案，再通过语音合成技术把答案说给你听。\n\
    \n这里的语音识别技术、语音合成技术都属于智能语音技术（图4-2）。\n\n![](images/txt004_3.jpg \"pagenumber_ebook=97,pagenumber_book=86\"\
    )\n\n图4-1　语音助手播报天气\n\n![](images/txt004_4.jpg \"pagenumber_ebook=97,pagenumber_book=86\"\
    )\n\n图4-2　智能语音技术\n\n体验感知\n\n1.体验语音输入\n\n请使用输入法中的语音输入功能，试着朗读下面这段话，看看能不能把语音转换成正确的文字。\n\
    \n2020年，在世界人工智能大会云端峰会期间，共青团上海市委举办了青少年人工智能创新发展论坛，将专业性与青少年发展相结合，邀请国内外人工智能及教育领域专家，共话人工智能与青少年成长的新变化和新趋势，开启青少年拥抱和融入人工智能新时代的新篇章。\n\
    \n2.体验“听歌识曲”\n\n请播放一段歌曲，使用微信“摇一摇”中的“歌曲”功能，看看能不能识别出这首歌曲的名称。\n\n3.体验语音合成\n\n请打开搜索引擎，搜索“讯飞开放平台—在线语音合成”，试着输入一些文字，看看能不能把文字正确地朗读出来。\n\
    \n思考探索\n\n在生活中，还有哪些地方用到了智能语音技术呢？能不能举几个例子？\n\n4.1.2　语音识别、语音合成以及相关技术\n\n语音识别技术是一种可以让机器“听得见”的技术，可以把我们说的话转变成文字，方便机器去理解（图4-3）。不过，在开始语音识别前，需要先对声音进行采集和数字化处理，这些我们会在下一节具体介绍。\n\
    \n语音合成技术是一种可以让机器“说得出”的技术，可以把文字转变成语音（图4-4）。\n\n![](images/txt004_5.jpg \"pagenumber_ebook=98,pagenumber_book=87\"\
    )\n\n图4-4　语音合成示意图\n\n是不是机器有了语音识别和语音合成技术，能听会说，就可以和我们语音对话了呢？可能还不行，因为“听得见”不代表听得懂，“说得出”也不代表知道说什么。所以，在使用语音识别技术获取对话中的问题文字后，还需要运用自然语言处理技术（图4-5），对问题文字加以理解，并生成应答文字，再使用语音合成技术把应答文字说出来，才能真正实现和我们的对话，做到既“听得见”又“听得懂”，既“说得出”又“说得对”。\n\
    \n![](images/txt004_6.jpg \"pagenumber_ebook=99,pagenumber_book=88\")\n\n图4-5　人机语音对话示意图\n\
    \n不过机器和人类一样，也需要不断进行学习。我们可以回想一下自己刚进幼儿园时的情景，那时的我们也能听会说，也能和别人对话，但似乎交流还是有些问题，有时听不懂别人的话，有时说不清想表达的意思。随着在幼儿园、小学、中学的不断学习，我们的语言能力也不断提升，能够听懂的越来越多，也能够说得越来越好。\n\
    \n拥有人工智能的机器也需要通过机器学习等技术不断地学习（图4-6），提高语音识别、自然语言处理、语音合成的能力，做到听得更清、理解得更好、说得更明白。\n\
    \n![](images/txt004_7.jpg \"pagenumber_ebook=99,pagenumber_book=88\")\n\n图4-6　机器学习\n\
    \n4.1.3　智能语音技术的应用\n\n目前，智能语音技术在我们的日常学习生活中得到了广泛的应用，前面说到的语音助手就出现在智能手机、智能音箱、平板电脑等许多地方，我们可以用说话的方式查询天气、设置闹钟，甚至和它聊天逗趣。当然除了语音助手，智能语音技术还经常被应用于下面这些场景。\n\
    \n1.语音翻译\n\n语音翻译即口译，把一种语言的口语翻译成另一种语言的口语。在许多国际会议上经常需要进行多种语言之间的口语即时翻译（图4-7）。\n\n\
    2.语音输入\n\n语音输入即用说话的方式来输入文字。相比传统的拼音、笔画等输入法，可以减少对键盘（按键）的使用，提高输入速度，更加简单和方便（图4-8）。\n\
    \n3.语音控制\n\n语音控制即用语音发出命令，控制各种设备做出反应。比如智能家居中用到的语音开关电视、调整空调温度、拉合窗帘等（图4-9）。\n\n4.语音客服\n\
    \n语音客服接替人工客服完成接听电话的工作，协助顾客完成业务查询、业务办理等需求，减少人工客服的工作量，并可以24小时不间断地提供服务（图4-10）。\n\n\
    ![](images/txt004_8.jpg \"pagenumber_ebook=100,pagenumber_book=89\")\n\n图4-7　语音翻译\n\
    \n![](images/txt004_9.jpg \"pagenumber_ebook=100,pagenumber_book=89\")\n\n图4-8　语音输入\n\
    \n![](images/txt004_10.jpg \"pagenumber_ebook=100,pagenumber_book=89\")\n\n图4-9　语音控制\n\
    \n![](images/txt004_11.jpg \"pagenumber_ebook=100,pagenumber_book=89\")\n\n图4-10　语音客服\n\
    \n思考探索\n\n你在使用含有智能语音技术的应用时遇到过问题吗？有没有解决的办法？\n\n知识拓展\n\n全球首支人工智能合作歌曲《智联家园》\n\n在2020年7月9日的世界人工智能大会开幕式上，由小冰、小度、小爱、泠鸢yousa这四位特殊的人工智能表演者，带来了她们为本届大会原创的主题曲《智联家园》。这是全球第一首人工智能机器人自己作曲、自己合唱的歌曲，其中大量运用了智能语音技术。请使用搜索引擎搜索关键词“智联家园MV”，欣赏这首歌曲。\n\
    \n4.1.4　智能语音技术的发展\n\n以语音识别技术、语音合成技术为代表的智能语音技术经历了数十年发展，特别在近年随着深度学习的应用，智能语音技术相比之前更加成熟了。\n\
    \n1939年，根据共振峰原理研制了世界上第一个电子语音合成器。\n\n1952年，研制了世界上第一个能识别10个英文数字发音的实验系统。\n\n1980年，使用混合共振峰技术研制的语音合成器可模拟出不同的嗓音。\n\
    \n1986年3月，中国“国家高技术研究发展计划”（863计划）启动，我国的语音识别、语音合成等技术得到了更多的支持和更好的发展。\n\n1987年，开发出世界上第一个“非特定人连续语音识别系统”，大大提升了语音识别准确率。\n\
    \n1997年，出现了首款语音听写系统ViaVoice。\n\n2002年，中国科学院自动化研究所推出了Pattek ASR语音识别产品。\n\n2011年，深度神经网络技术被应用在语音识别领域；同年，智能手机上开始出现语音助手。\n\
    \n2014年，出现了智能音箱产品。\n\n2016年，中国高科技企业的语音识别准确率达到了97%。\n\n2020年，第一首人工智能自己作曲、自己合唱的歌曲诞生。\n\
    \n今天，智能语音技术进入教育、医疗、交通、金融、工业、城市管理与商业等领域的多个应用场景，开启了人机交互的新篇章。\n\n动手实践\n\n请使用图形化编程软件，加载人工智能相关模块，编写相应的程序，试着和计算机进行语音对话。\n\
    \n4.2　声音的处理\n\n4.2.1　声音的采集\n\n我们知道声音是通过物体振动产生的，且需要通过介质才能传播，而空气就是最常见的一种介质。那么声音在传播的过程中，怎么把它采集起来并进行保存呢？首先需要用到的是麦克风，也就是我们平时说的话筒（图4-11）。\n\
    \n不同类型麦克风的工作原理是不一样的，但基本的用途都是将传入的声音转化成电信号，只是转化的方式各不相同（图4-12）。\n\n![](images/txt004_12.jpg\
    \ \"pagenumber_ebook=102,pagenumber_book=91\")\n\n图4-11　话筒\n\n![](images/txt004_13.jpg\
    \ \"pagenumber_ebook=102,pagenumber_book=91\")\n\n图4-12　声音转化成电信号示意图\n\n知识拓展\n\n\
    两种不同类型的麦克风\n\n（1）动圈麦克风（图4-13）\n\n工作原理：麦克风的振膜带动线圈振动，切割磁感线产生电信号。\n\n使用特点：结构简单，对使用环境的静音要求不是很高。\n\
    \n（2）电容麦克风（图4-14）\n\n工作原理：麦克风的振膜振动引起电容容量的变化，从而形成电信号。\n\n使用特点：灵敏度较高，音色细腻，要求在静音环境中使用。\n\
    \n![](images/txt004_14.jpg \"pagenumber_ebook=102,pagenumber_book=91\")\n\n图4-13　动圈麦克风\n\
    \n![](images/txt004_15.jpg \"pagenumber_ebook=102,pagenumber_book=91\")\n\n图4-14　电容麦克风\n\
    \n4.2.2　声音的数字化\n\n声音经过麦克风转化成电信号以后，可以再经过简单处理，用模拟信号的方式保存起来，就像普通的磁带一样。或者可以经过一定处理，进一步转化为数字信号，供计算机处理使用，这个过程就称为声音的数字化。\n\
    \n为什么计算机处理声音，需要先对它进行数字化呢？\n\n这和计算机的工作原理有关，它的“大脑”——中央处理器（CPU）目前主要是由大规模集成电路构成的。我们知道对于电路来说，只有“断开”和“闭合”两种状态，可以分别用“0”和“1”来代表。因此，在计算机中处理的信息都采用二进制的0和1来表示，声音信息也不例外。\n\
    \n怎样才能将声音数字化呢？一般来说，声音信号的数字化过程需要经历采样和量化。\n\n1.采样\n\n经过麦克风采集的声音，转化成的电信号是一种连续变化的模拟信号，如果用图的方式来表示的话，可以把它想象成一条曲线，就像图4-15一样。\n\
    \n这条曲线可以理解成是由许许多多个点组成的，每个点的信息都记录着当前时间声音振动的幅度，那么我们是不是要把所有点的信息都保存下来呢？当然不用。\n\n就像称体重一样，虽然我们的体重一直在变化，但只要定期去称，比如每天称一次，或者每周称一次，就能反映出体重的变化。所以，只要每间隔一定的时间（采样周期），把曲线上对应点的信息保存下来，也就是进行一次声音电信号的采集就可以了，就像图4-16一样，这个过程叫作声音的采样。\n\
    \n当然，每次采样间隔的时间越短，单位时间内采样的次数（采样频率）也就越多，采集到的声音电信号也就越接近真实的声音信号。\n\n2.量化\n\n经过采样，得到了若干个采样点（红点表示）的信息，每个点记录的声音幅度都来自模拟的电信号，是一个比较精确的值。这些值各不相同，给之后的处理带来了困难，可以用类似“四舍五入”的办法，就像图4-17一样，得到新的一组值（绿点表示），这个过程叫作声音的量化。\n\
    \n![](images/txt004_16.jpg \"pagenumber_ebook=104,pagenumber_book=93\")\n\n图4-15　声音的电信号\n\
    \n![](images/txt004_17.jpg \"pagenumber_ebook=104,pagenumber_book=93\")\n\n图4-16　声音的采样"
  fmt: "\n# 第4章　会听说的人工智能\n\n## 导　言\n\n如果说计算机视觉技术让机器可以“看得见”，那么智能语音技术就让机器可以“听得见”和“说得出”。我们知道，听说是人类日常交流所需的基本能力，如果机器拥有了智能语音技术，就可以像人类一样能听会说，具备了与人类对话的前提条件。在这一章，我们将要学习探索人工智能领域中的智能语音技术。\n\
    \n## 4.1　认识智能语音技术\n\n### 4.1.1　身边的智能语音技术\n\n早晨起床，你想知道今天的天气怎么样，于是你打开手机的语音助手，轻声问道：“今天的天气怎么样？”\n\
    \n“上海市当前天气为晴，气温24度。预计从夜间开始局部多云。到今天夜间，气温将从24度下降到18度。”语音助手很快做出了回答。\n\n在刚才的这个过程中，就用到了智能语音技术。\n\
    \n大致说来，手机通过语音识别技术听见了你的问题，结合自然语言处理技术和相关应用程序，理解了你的问题并找到了问题答案，再通过语音合成技术把答案说给你听。\n\
    \n这里的语音识别技术、语音合成技术都属于智能语音技术。\n\n#### 体验感知\n\n1. **体验语音输入**  \n   请使用输入法中的语音输入功能，试着朗读下面这段话，看看能不能把语音转换成正确的文字。\
    \  \n   2020年，在世界人工智能大会云端峰会期间，共青团上海市委举办了青少年人工智能创新发展论坛，将专业性与青少年发展相结合，邀请国内外人工智能及教育领域专家，共话人工智能与青少年成长的新变化和新趋势，开启青少年拥抱和融入人工智能新时代的新篇章。\n\
    \n2. **体验“听歌识曲”**  \n   请播放一段歌曲，使用微信“摇一摇”中的“歌曲”功能，看看能不能识别出这首歌曲的名称。\n\n3. **体验语音合成**\
    \  \n   请打开搜索引擎，搜索“讯飞开放平台—在线语音合成”，试着输入一些文字，看看能不能把文字正确地朗读出来。\n\n#### 思考探索\n\n在生活中，还有哪些地方用到了智能语音技术呢？能不能举几个例子？\n\
    \n### 4.1.2　语音识别、语音合成以及相关技术\n\n语音识别技术是一种可以让机器“听得见”的技术，可以把我们说的话转变成文字，方便机器去理解。不过，在开始语音识别前，需要先对声音进行采集和数字化处理，这些我们会在下一节具体介绍。\n\
    \n语音合成技术是一种可以让机器“说得出”的技术，可以把文字转变成语音。\n\n是不是机器有了语音识别和语音合成技术，能听会说，就可以和我们语音对话了呢？可能还不行，因为“听得见”不代表听得懂，“说得出”也不代表知道说什么。所以，在使用语音识别技术获取对话中的问题文字后，还需要运用自然语言处理技术，对问题文字加以理解，并生成应答文字，再使用语音合成技术把应答文字说出来，才能真正实现和我们的对话，做到既“听得见”又“听得懂”，既“说得出”又“说得对”。\n\
    \n不过机器和人类一样，也需要不断进行学习。我们可以回想一下自己刚进幼儿园时的情景，那时的我们也能听会说，也能和别人对话，但似乎交流还是有些问题，有时听不懂别人的话，有时说不清想表达的意思。随着在幼儿园、小学、中学的不断学习，我们的语言能力也不断提升，能够听懂的越来越多，也能够说得越来越好。\n\
    \n拥有人工智能的机器也需要通过机器学习等技术不断地学习，提高语音识别、自然语言处理、语音合成的能力，做到听得更清、理解得更好、说得更明白。\n\n###\
    \ 4.1.3　智能语音技术的应用\n\n目前，智能语音技术在我们的日常学习生活中得到了广泛的应用，前面说到的语音助手就出现在智能手机、智能音箱、平板电脑等许多地方，我们可以用说话的方式查询天气、设置闹钟，甚至和它聊天逗趣。当然除了语音助手，智能语音技术还经常被应用于下面这些场景。\n\
    \n1. **语音翻译**  \n   语音翻译即口译，把一种语言的口语翻译成另一种语言的口语。在许多国际会议上经常需要进行多种语言之间的口语即时翻译。\n\
    \n2. **语音输入**  \n   语音输入即用说话的方式来输入文字。相比传统的拼音、笔画等输入法，可以减少对键盘（按键）的使用，提高输入速度，更加简单和方便。\n\
    \n3. **语音控制**  \n   语音控制即用语音发出命令，控制各种设备做出反应。比如智能家居中用到的语音开关电视、调整空调温度、拉合窗帘等。\n\n\
    4. **语音客服**  \n   语音客服接替人工客服完成接听电话的工作，协助顾客完成业务查询、业务办理等需求，减少人工客服的工作量，并可以24小时不间断地提供服务。\n\
    \n#### 思考探索\n\n你在使用含有智能语音技术的应用时遇到过问题吗？有没有解决的办法？\n\n#### 知识拓展\n\n**全球首支人工智能合作歌曲《智联家园》**\
    \  \n在2020年7月9日的世界人工智能大会开幕式上，由小冰、小度、小爱、泠鸢yousa这四位特殊的人工智能表演者，带来了她们为本届大会原创的主题曲《智联家园》。这是全球第一首人工智能机器人自己作曲、自己合唱的歌曲，其中大量运用了智能语音技术。请使用搜索引擎搜索关键词“智联家园MV”，欣赏这首歌曲。\n\
    \n### 4.1.4　智能语音技术的发展\n\n以语音识别技术、语音合成技术为代表的智能语音技术经历了数十年发展，特别在近年随着深度学习的应用，智能语音技术相比之前更加成熟了。\n\
    \n- 1939年，根据共振峰原理研制了世界上第一个电子语音合成器。\n- 1952年，研制了世界上第一个能识别10个英文数字发音的实验系统。\n- 1980年，使用混合共振峰技术研制的语音合成器可模拟出不同的嗓音。\n\
    - 1986年3月，中国“国家高技术研究发展计划”（863计划）启动，我国的语音识别、语音合成等技术得到了更多的支持和更好的发展。\n- 1987年，开发出世界上第一个“非特定人连续语音识别系统”，大大提升了语音识别准确率。\n\
    - 1997年，出现了首款语音听写系统ViaVoice。\n- 2002年，中国科学院自动化研究所推出了Pattek ASR语音识别产品。\n- 2011年，深度神经网络技术被应用在语音识别领域；同年，智能手机上开始出现语音助手。\n\
    - 2014年，出现了智能音箱产品。\n- 2016年，中国高科技企业的语音识别准确率达到了97%。\n- 2020年，第一首人工智能自己作曲、自己合唱的歌曲诞生。\n\
    \n今天，智能语音技术进入教育、医疗、交通、金融、工业、城市管理与商业等领域的多个应用场景，开启了人机交互的新篇章。\n\n#### 动手实践\n\n请使用图形化编程软件，加载人工智能相关模块，编写相应的程序，试着和计算机进行语音对话。\n\
    \n## 4.2　声音的处理\n\n### 4.2.1　声音的采集\n\n我们知道声音是通过物体振动产生的，且需要通过介质才能传播，而空气就是最常见的一种介质。那么声音在传播的过程中，怎么把它采集起来并进行保存呢？首先需要用到的是麦克风，也就是我们平时说的话筒。\n\
    \n不同类型麦克风的工作原理是不一样的，但基本的用途都是将传入的声音转化成电信号，只是转化的方式各不相同。\n\n#### 知识拓展\n\n**两种不同类型的麦克风**\n\
    \n1. **动圈麦克风**  \n   工作原理：麦克风的振膜带动线圈振动，切割磁感线产生电信号。  \n   使用特点：结构简单，对使用环境的静音要求不是很高。\n\
    \n2. **电容麦克风**  \n   工作原理：麦克风的振膜振动引起电容容量的变化，从而形成电信号。  \n   使用特点：灵敏度较高，音色细腻，要求在静音环境中使用。\n\
    \n### 4.2.2　声音的数字化\n\n声音经过麦克风转化成电信号以后，可以再经过简单处理，用模拟信号的方式保存起来，就像普通的磁带一样。或者可以经过一定处理，进一步转化为数字信号，供计算机处理使用，这个过程就称为声音的数字化。\n\
    \n为什么计算机处理声音，需要先对它进行数字化呢？\n\n这和计算机的工作原理有关，它的“大脑”——中央处理器（CPU）目前主要是由大规模集成电路构成的。我们知道对于电路来说，只有“断开”和“闭合”两种状态，可以分别用“0”和“1”来代表。因此，在计算机中处理的信息都采用二进制的0和1来表示，声音信息也不例外。\n\
    \n怎样才能将声音数字化呢？一般来说，声音信号的数字化过程需要经历采样和量化。\n\n#### 1. 采样\n\n经过麦克风采集的声音，转化成的电信号是一种连续变化的模拟信号，如果用图的方式来表示的话，可以把它想象成一条曲线。\n\
    \n这条曲线可以理解成是由许许多多个点组成的，每个点的信息都记录着当前时间声音振动的幅度，那么我们是不是要把所有点的信息都保存下来呢？当然不用。\n\n就像称体重一样，虽然我们的体重一直在变化，但只要定期去称，比如每天称一次，或者每周称一次，就能反映出体重的变化。所以，只要每间隔一定的时间（采样周期），把曲线上对应点的信息保存下来，也就是进行一次声音电信号的采集就可以了，这个过程叫作声音的采样。\n\
    \n当然，每次采样间隔的时间越短，单位时间内采样的次数（采样频率）也就越多，采集到的声音电信号也就越接近真实的声音信号。\n\n#### 2. 量化\n\n\
    经过采样，得到了若干个采样点的信息，每个点记录的声音幅度都来自模拟的电信号，是一个比较精确的值。这些值各不相同，给之后的处理带来了困难，可以用类似“四舍五入”的办法，得到新的一组值，这个过程叫作声音的量化。\n"
  trans: "\n\n# Chapter 4: Artificial Intelligence That Can Listen and Speak\n\n##\
    \ Introduction\n\nIf computer vision technology enables machines to \"see,\" then\
    \ intelligent speech technology enables machines to \"hear\" and \"speak.\" We\
    \ know that listening and speaking are basic abilities required for daily human\
    \ communication. If machines possess intelligent speech technology, they can listen\
    \ and speak like humans, possessing the prerequisite for conversing with people.\
    \ In this chapter, we will explore intelligent speech technology in the field\
    \ of artificial intelligence.\n\n## 4.1 Understanding Intelligent Speech Technology\n\
    \n### 4.1.1 Intelligent Speech Technology Around Us\n\nIn the morning, you wake\
    \ up and want to know the weather. You open the voice assistant on your phone\
    \ and ask softly, \"What's the weather like today?\"\n\n\"The current weather\
    \ in Shanghai is sunny, 24 degrees Celsius. Partly cloudy in some areas starting\
    \ tonight. By tonight, the temperature will drop from 24 to 18 degrees.\" The\
    \ voice assistant responds quickly.\n\nIntelligent speech technology was used\
    \ in this process.\n\nRoughly speaking, the phone \"heard\" your question through\
    \ **Speech Recognition (ASR)** technology, combined with **Natural Language Processing\
    \ (NLP)** technology and relevant applications, understood your question and found\
    \ the answer, and then \"spoke\" the answer to you through **Text-to-Speech (TTS)**\
    \ technology.\n\nBoth speech recognition and speech synthesis technologies mentioned\
    \ here belong to intelligent speech technology.\n\n#### Experience & Perception\n\
    \n1. **Experience Voice Input**  \n   Please use the voice input function of your\
    \ input method and try reading the following paragraph to see if the speech can\
    \ be converted into correct text.  \n   In 2020, during the World Artificial Intelligence\
    \ Conference Cloud Summit, the Communist Youth League Shanghai Committee hosted\
    \ the Youth Artificial Intelligence Innovation and Development Forum, combining\
    \ professionalism with youth development. It invited experts from the domestic\
    \ and international AI and education sectors to discuss new changes and trends\
    \ in AI and youth growth, opening a new chapter for youth embracing and integrating\
    \ into the new era of AI.\n\n2. **Experience \"Song Recognition\"**  \n   Please\
    \ play a song clip and use the \"Song\" function in WeChat's \"Shake\" feature\
    \ to see if it can recognize the song title.\n\n3. **Experience Speech Synthesis**\
    \  \n   Please open a search engine, search for \"iFLYTEK Open Platform - Online\
    \ Speech Synthesis,\" try entering some text, and see if it can read the text\
    \ aloud correctly.\n\n#### Think & Explore\n\nWhere else is intelligent speech\
    \ technology used in daily life? Can you give a few examples?\n\n### 4.1.2 Speech\
    \ Recognition, Speech Synthesis, and Related Technologies\n\nSpeech recognition\
    \ technology enables machines to \"hear,\" converting our spoken words into text\
    \ for machines to understand. However, before speech recognition begins, sound\
    \ needs to be collected and digitized, which we will introduce in detail in the\
    \ next section.\n\nSpeech synthesis technology enables machines to \"speak,\"\
    \ converting text into speech.\n\nDoes a machine equipped with speech recognition\
    \ and synthesis, able to hear and speak, mean it can have a voice conversation\
    \ with us? Not necessarily. \"Hearing\" does not mean \"understanding,\" and \"\
    speaking\" does not mean \"knowing what to say.\" Therefore, after obtaining the\
    \ question text via speech recognition, **Natural Language Processing (NLP)**\
    \ technology is still needed to understand the question text and generate a response\
    \ text. Then, speech synthesis technology speaks the response text. Only then\
    \ can true conversation be achieved—making the machine not only \"hear\" but \"\
    understand,\" and not only \"speak\" but \"speak appropriately.\"\n\nHowever,\
    \ just like humans, machines need continuous learning. Recall when you first entered\
    \ kindergarten: you could listen and speak and converse with others, but communication\
    \ still had issues—sometimes you couldn't understand others, sometimes you couldn't\
    \ express yourself clearly. With continuous learning in kindergarten, primary\
    \ school, and middle school, your language ability improved, understanding more\
    \ and speaking better.\n\nMachines with AI also need to continuously learn through\
    \ technologies like **Machine Learning**, improving their speech recognition,\
    \ natural language processing, and speech synthesis capabilities to hear more\
    \ clearly, understand better, and speak more clearly.\n\n### 4.1.3 Applications\
    \ of Intelligent Speech Technology\n\nCurrently, intelligent speech technology\
    \ is widely used in our daily study and life. The voice assistants mentioned earlier\
    \ appear in smartphones, smart speakers, tablets, and many other places. We can\
    \ query weather, set alarms, and even chat with them just by speaking. Of course,\
    \ besides voice assistants, intelligent speech technology is also frequently applied\
    \ in the following scenarios.\n\n1. **Speech Translation**  \n   Speech translation\
    \ is interpretation—translating spoken language from one language into spoken\
    \ language of another. Many international conferences often require instant oral\
    \ translation between multiple languages.\n\n2. **Voice Input**  \n   Voice input\
    \ means entering text by speaking. Compared to traditional Pinyin, stroke, and\
    \ other input methods, it reduces the use of keyboards (keys), increases input\
    \ speed, and is simpler and more convenient.\n\n3. **Voice Control**  \n   Voice\
    \ control means issuing commands via voice to control various devices to react.\
    \ For example, in smart homes: voice-controlled TV switching, air conditioner\
    \ temperature adjustment, curtain opening/closing, etc.\n\n4. **Voice Customer\
    \ Service**  \n   Voice customer service replaces human operators to answer calls,\
    \ assisting customers with business inquiries, transactions, and other needs,\
    \ reducing the workload of human agents and providing 24/7 uninterrupted service.\n\
    \n#### Think & Explore\n\nHave you encountered problems when using applications\
    \ with intelligent speech technology? Are there solutions?\n\n#### Knowledge Expansion\n\
    \n**The World's First AI Collaboration Song \"Smart Home\" (智联家园)**  \nAt the\
    \ opening ceremony of the 2020 World Artificial Intelligence Conference on July\
    \ 9, four special AI performers—Xiaoice, Xiaodu, Xiaoai, and Lingyuan yousa—performed\
    \ the original theme song \"Smart Home\" for the conference. This is the world's\
    \ first song composed and performed entirely by AI robots, making extensive use\
    \ of intelligent speech technology. Please search for the keyword \"Smart Home\
    \ MV\" to enjoy this song.\n\n### 4.1.4 Development of Intelligent Speech Technology\n\
    \nIntelligent speech technology, represented by speech recognition and speech\
    \ synthesis, has developed over decades. Especially in recent years, with the\
    \ application of **Deep Learning**, intelligent speech technology has become much\
    \ more mature compared to the past.\n\n- **1939:** The world's first electronic\
    \ speech synthesizer was developed based on the formant principle.\n- **1952:**\
    \ The world's first experimental system capable of recognizing 10 English digit\
    \ pronunciations was developed.\n- **1980:** A speech synthesizer using mixed\
    \ formant technology could simulate different timbres.\n- **March 1986:** China's\
    \ \"National High-Tech Research and Development Program\" (863 Program) launched,\
    \ giving more support and better development to China's speech recognition, speech\
    \ synthesis, and other technologies.\n- **1987:** The world's first \"Speaker-Independent\
    \ Continuous Speech Recognition System\" was developed, greatly improving speech\
    \ recognition accuracy.\n- **1997:** The first speech dictation system, ViaVoice,\
    \ appeared.\n- **2002:** The Institute of Automation, Chinese Academy of Sciences,\
    \ launched the Pattek ASR speech recognition product.\n- **2011:** Deep Neural\
    \ Network (DNN) technology was applied to the field of speech recognition; the\
    \ same year, voice assistants began appearing on smartphones.\n- **2014:** Smart\
    \ speaker products appeared.\n- **2016:** Chinese high-tech companies' speech\
    \ recognition accuracy reached 97%.\n- **2020:** The world's first song composed\
    \ and performed entirely by AI was born.\n\nToday, intelligent speech technology\
    \ has entered multiple application scenarios in education, healthcare, transportation,\
    \ finance, industry, urban management, commerce, and other fields, opening a new\
    \ chapter in human-computer interaction.\n\n#### Hands-on Practice\n\nPlease use\
    \ graphical programming software, load AI-related modules, write corresponding\
    \ programs, and try to have a voice conversation with the computer.\n\n## 4.2\
    \ Sound Processing\n\n### 4.2.1 Sound Collection\n\nWe know sound is produced\
    \ by object vibrations and requires a medium to propagate, with air being the\
    \ most common medium. So, during sound propagation, how do we collect and save\
    \ it? The first thing needed is a **microphone**, commonly known as a mic.\n\n\
    Different types of microphones work on different principles, but their basic purpose\
    \ is the same: to convert incoming sound into electrical signals; only the conversion\
    \ methods differ.\n\n#### Knowledge Expansion\n\n**Two Different Types of Microphones**\n\
    \n1. **Dynamic Microphone**  \n   **Working Principle:** The microphone's diaphragm\
    \ drives a coil to vibrate, cutting magnetic lines of force to generate an electrical\
    \ signal.  \n   **Usage Characteristics:** Simple structure; not very high requirements\
    \ for environmental silence.\n\n2. **Condenser Microphone**  \n   **Working Principle:**\
    \ The microphone's diaphragm vibration causes changes in capacitance, thereby\
    \ forming an electrical signal.  \n   **Usage Characteristics:** Higher sensitivity,\
    \ delicate timbre; requires use in a silent environment.\n\n### 4.2.2 Sound Digitization\n\
    \nAfter sound is converted into electrical signals by a microphone, it can be\
    \ simply processed and stored as analog signals, like ordinary magnetic tapes.\
    \ Or it can be further processed and converted into digital signals for computer\
    \ processing. This process is called **sound digitization**.\n\nWhy does a computer\
    \ need to digitize sound before processing it?\n\nThis relates to the computer's\
    \ working principle. Its \"brain\"—the **Central Processing Unit (CPU)**—is currently\
    \ mainly composed of large-scale integrated circuits. We know that for a circuit,\
    \ there are only two states: \"open\" and \"closed,\" which can be represented\
    \ by \"0\" and \"1\" respectively. Therefore, all information processed in computers\
    \ is represented by binary 0s and 1s; sound information is no exception.\n\nHow\
    \ can sound be digitized? Generally, the digitization of sound signals goes through\
    \ **sampling** and **quantization**.\n\n#### 1. Sampling\n\nThe sound collected\
    \ by the microphone is converted into an electrical signal, which is a continuously\
    \ changing analog signal. If represented graphically, it can be imagined as a\
    \ curve.\n\nThis curve can be understood as composed of countless points, each\
    \ recording the amplitude of the sound vibration at the current time. Do we need\
    \ to save the information of all points? Of course not.\n\nJust like weighing\
    \ yourself: although our weight changes constantly, as long as we weigh regularly—say,\
    \ once a day or once a week—we can reflect weight changes. So, as long as we save\
    \ the information of the corresponding points on the curve at regular intervals\
    \ (sampling period)—that is, collect the sound electrical signal once—it is sufficient.\
    \ This process is called **sound sampling**.\n\nNaturally, the shorter the interval\
    \ between each sampling, the more sampling times per unit time (sampling rate),\
    \ and the closer the collected sound electrical signal is to the real sound signal.\n\
    \n#### 2. Quantization\n\nAfter sampling, information from multiple sampling points\
    \ is obtained. The sound amplitude recorded at each point comes from the analog\
    \ electrical signal and is a relatively precise value. These values vary, causing\
    \ difficulties for subsequent processing. A method similar to \"rounding\" can\
    \ be used to obtain a new set of values. This process is called **sound quantization**.\n\
    \n"
