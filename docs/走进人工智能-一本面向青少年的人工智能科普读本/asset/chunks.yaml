    \ \"pagenumber_ebook=13,pagenumber_book=2\")\n\n> Friends, though we are young,\
    \ let us use our innocent childlike fun to paint splendid colors for AI.\n>\n\
    > Green seedlings, we love to think; let us use our wild creativity to add infinite\
    \ imagination to AI.\n>\n> Young Pioneers, we are always ready; let us use our\
    \ innovative wisdom to empower AI development.\n>\n> Communist Youth League members,\
    \ we dare to be pioneers; let us use our solid practice to gather youthful vitality\
    \ for AI.\n>\n> Young friends, we are poised and ready; let us use our fearless\
    \ responsibility to lead the leap of AI.\n>\n> ——At the closing ceremony of the\
    \ 2019 WAIC, representatives of the award-winning contestants of the Shanghai\
    \ Youth AI Innovation Competition issued this initiative.\n\n#### Knowledge Expansion:\
    \ World Artificial Intelligence Conference\n\nThe World Artificial Intelligence\
    \ Conference is jointly sponsored by the National Development and Reform Commission,\
    \ the Ministry of Science and Technology, the Ministry of Industry and Information\
    \ Technology, the Cyberspace Administration of China, the Chinese Academy of Sciences,\
    \ the Chinese Academy of Engineering, and the Shanghai Municipal People's Government.\
    \ It is a world-top intelligent cooperation and exchange platform and an industry\
    \ event with international standards and influence.\n\n- The theme of the 2018\
    \ WAIC was \"AI Empowering a New Era\".\n- The theme of the 2019 WAIC was \"Intelligent\
    \ Connectivity, Infinite Possibilities\".\n- The theme of the 2020 WAIC Cloud\
    \ Summit was \"Intelligent Connectivity, Shared Home\".\n\nThe most influential\
    \ views and consensus in the global AI field converge here, showcasing cutting-edge\
    \ new concepts, technologies, products, and applications, featuring \"high-end,\
    \ international, professional, market-oriented, and intelligent\" characteristics.\
    \ \"World Wisdom\" communicates here, engaging in high-end dialogues and forging\
    \ \"Chinese Solutions\".\n\n### 1.1.2　Human Intelligence Meets AI\n\nWhat is \"\
    intelligence\"? So far, there is no broad consensus among humans on this question.\
    \ Humans use thinking to solve problems, which involves a series of actions such\
    \ as logic and reasoning. But in fact, human methods of solving problems are often\
    \ not unique, and sometimes it is even difficult to judge whose method is better.\n\
    \nAn IQ tester may test a person's IQ, but can it be said that a person with a\
    \ high IQ possesses more intelligence and contributes more to society?\n\nThe\
    \ answer is not so. First, high IQ not only represents high intelligence but also\
    \ represents innovation ability, good thinking, and the ability to discover and\
    \ solve problems. Second, besides IQ, we also need a certain EQ (Emotional Quotient),\
    \ which is the general term for personal abilities related to self-awareness,\
    \ emotion control, self-motivation, and handling interpersonal relationships and\
    \ teamwork. Finally, we need correct values, the ability to distinguish right\
    \ from wrong, and discernment. In summary, perhaps this is the intelligence more\
    \ needed by human society.\n\nThe definition of human intelligence has not reached\
    \ a consensus, and neither has AI.\n\nIn 2019, scientists attending the WAIC gave\
    \ five definitions of AI:\n\n- **Definition 1**: AI is a computer program that\
    \ makes people feel incredible.\n- **Definition 2**: AI is a computer program\
    \ similar to the human way of thinking.\n- **Definition 3**: AI is a computer\
    \ program similar to human behavior.\n- **Definition 4**: AI is a computer program\
    \ that can learn.\n- **Definition 5**: AI is a computer program that makes reasonable\
    \ actions based on perception of the environment and obtains maximum benefits.\n\
    \nFor the definition of AI, the currently more general understanding is that AI\
    \ is a new technical science that researches and develops theories, methods, technologies,\
    \ and application systems for simulating, extending, and expanding human intelligence.\n\
    \nA book records a dialogue between the scientist Alan Turing and a police officer:\n\
    \n> **Police Officer**　Can machines think?\n>\n> **Turing**　Well, in my opinion,\
    \ your question itself is stupid.\n>\n> **Police Officer**　Is it?\n>\n> **Turing**　Machines\
    \ obviously cannot think like humans. A machine is different from a person. Because\
    \ their ways of thinking are different. The interesting thing is, does it mean\
    \ they cannot think just because some things think differently from you?\n>\n\
    > We allow human thoughts to vary widely. You like bananas, I hate long-distance\
    \ running; you like sad movies, I prefer comedies. Different tastes, different\
    \ interests, different preferences—what is the meaning of them?\n\n"
