    ## 1.3 Entering Artificial Intelligence


    In many movies, robots possess artificial intelligence. However, we need to know
    that a robot is merely a carrier of AI; it does not mean AI equals robots.


    AI encompasses many technologies. Machines able to "see" like humans use **computer
    vision** technology; able to "listen" uses **speech recognition** in intelligent
    speech technology; able to "speak" uses **speech synthesis** in intelligent speech
    technology; able to "learn" uses **machine learning** technology.


    Not only that, AI also includes **natural language processing**, **knowledge graphs**,
    **virtual reality (VR)/augmented reality (AR)**, **human-computer gaming**, and
    more.


    ### 1.3.1 Computer Vision


    Celebrity concerts sometimes come with an added "catching fugitives" function!
    Through just one Mandarin pop star''s 2018 concert tour, a total of 55 fugitives
    were caught. The successful completion of these arrests had a major "hero" behind
    the scenes—the Sky Net Project. One of the core technologies of the Sky Net Project
    is computer vision image processing and recognition technology. Through high-definition
    cameras set up at the scene, the facial features of the audience were clearly
    captured and rapidly compared with information stored in the public security database.
    Once a suspect was identified, immediate action was taken to arrest them, truly
    achieving "the net of heaven is vast; though its meshes are wide, nothing escapes."


    Besides helping catch fugitives, computer vision technology brings great convenience
    to daily life. For example, the facial recognition function on mobile phones is
    often used to unlock phones and complete payments; facial recognition attendance
    systems are also widely used in many companies (Figure 1-16).


    ![](img/txt001_18.jpg "pagenumber_ebook=27,pagenumber_book=16")

    Figure 1-16　Facial Recognition Attendance System


    Computer vision technology also has extensive applications in the medical field.
    Combined with medical imaging, it has developed into "intelligent medical imaging."
    Originally, a radiologist sees nearly a hundred patients a day, meaning they have
    to analyze nearly a thousand images daily. "Intelligent medical imaging" can greatly
    reduce doctors'' pressure; its automated analysis speed is 62%–97% faster than
    that of general radiologists, saving a significant amount in labor costs annually.


    Computer vision has also extended functions such as 3D vision and image stylization.
    For instance, AI can make photos more artistic, giving ordinary photos the Impressionist
    style of Monet''s *Water Lilies*, turning ordinary pictures into artworks.


