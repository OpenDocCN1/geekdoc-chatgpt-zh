    ## 4.3 Speech Recognition


    ### 4.3.1 Preparation for Speech Recognition


    Speech recognition technology is a technology that enables machines to "hear,"
    converting what we say into text. How exactly is this achieved? There are many
    methods, among which the classic speech recognition algorithm consists of an Acoustic
    Model, a Language Model, and a Pronunciation Dictionary. We will take this as
    an example to see how spoken speech is converted into written text step by step.


    Some preparation work needs to be done before recognition.


    First, a large amount of sound data is used to train an Acoustic Model, used to
    convert sound into acoustic symbols (Figure 4-22).


    Then, a large amount of text data is used to train a Language Model, to find possible
    textual expressions for acoustic symbols (Figure 4-23).


    ![](img/txt004_25.jpg "pagenumber_ebook=107,pagenumber_book=96")

    Figure 4-22　Acoustic Model


    ![](img/txt004_26.jpg "pagenumber_ebook=107,pagenumber_book=96")

    Figure 4-23　Language Model


    ### 4.3.2 General Process of Speech Recognition


    For example, the waveform of the pronunciation of the four characters "Artificial
    Intelligence" (人工智能) is magnified, as shown in Figure 4-24. Because it is too
    long, only a part is intercepted and displayed here.


    ![](img/txt004_27.jpg "pagenumber_ebook=107,pagenumber_book=96")

    Figure 4-24　Segment of the waveform of the pronunciation of the four characters
    "Artificial Intelligence"


    Before starting speech recognition, the waveform needs some preprocessing. For
    example, environmental noise during recording, silent blanks when not speaking,
    and other redundant information need to be removed by preprocessing to facilitate
    subsequent operations such as feature extraction. After obtaining the preprocessed
    sound, acoustic feature extraction can begin, such as extracting `MFCC` (Mel-Frequency
    Cepstral Coefficients) and `PLP` (Perceptual Linear Prediction).


    However, before this, we need to know that language consists of words, and words
    consist of phonemes. Therefore, the recognition of phonemes can be said to be
    the key to speech recognition technology.


    #### Knowledge Expansion: Phoneme


    There are many types of human languages in the world, and pronunciations vary,
    but regardless of the language, they can all be divided into the smallest phonetic
    units—phonemes—based on the natural attributes of speech. Taking Chinese as an
    example, the four characters "Artificial Intelligence" (人工智能) can be divided into
    these phonemes: `r, e, n, g, o, ng, zh, i, n, e, ng`.


    Having understood what a phoneme is, let''s look at the general process of speech
    recognition.


    **Step 1**: Frame the sound, that is, cut the sound into small segments... Each
    small segment is called a frame (Figure 4-25). The framing operation is not a
    simple cut, but cuts into overlapping frames according to a certain time interval.


    **Step 2**: Through the Acoustic Model, recognize these frames into corresponding
    speech states, that is, compose states with frames. The "states" mentioned here
    can be understood as speech units more detailed than phonemes. Exactly how many
    frames correspond to a speech state? Since everyone''s volume, pitch, and timbre
    are different, recognizing frames as states is a difficulty in speech recognition
    technology. Here we introduce a simple method: use the trained Acoustic Model
    to judge which frames have the highest probability of corresponding to a certain
    state; then these frames belong to that state.


    **Step 3**: Compose phonemes with states. Generally, three states are combined
    to form a phoneme (Figure 4-26).


    ![](img/txt004_28.jpg "pagenumber_ebook=108,pagenumber_book=97")

    Figure 4-25　Framing Process


    ![](img/txt004_29.jpg "pagenumber_ebook=108,pagenumber_book=97")

    Figure 4-26　Recognizing frames as states, composing phonemes with states


    **Step 4**: Combine phonemes into words. In this process, the Acoustic Model remains
    very important; it can find the most likely acoustic symbolic expression of phonemes
    (such as Chinese Pinyin). Combined with the Pronunciation Dictionary, the acoustic
    symbols are matched with the most likely textual expressions in the Language Model,
    thus converting sound into text (Figure 4-27).


    In summary, the general process of speech recognition is shown in Figure 4-28.


    ![](img/txt004_30.jpg "pagenumber_ebook=109,pagenumber_book=98")

    Figure 4-27　Combining phonemes into words


    ![](img/txt004_31.jpg "pagenumber_ebook=109,pagenumber_book=98")

    Figure 4-28　General Process of Speech Recognition


    ### 4.3.3 Role of the Acoustic Model


    The main role of the Acoustic Model is to recognize the framed speech into corresponding
    states, compose states into phonemes, and map phonemes to the most likely acoustic
    symbolic expressions (this requires the Pronunciation Dictionary).


    How does the Acoustic Model achieve this? The process is very complex but can
    be simply understood as training the Acoustic Model through a large amount of
    speech data to better accomplish these tasks.


    There are many methods for training Acoustic Models. Traditional methods mainly
    use `GMM-HMM` (Gaussian Mixture Model - Hidden Markov Model), while current methods
    use `DNN-HMM` (Deep Neural Network - Hidden Markov Model).


    ### 4.3.4 Role of the Pronunciation Dictionary


    The Pronunciation Dictionary is also called a Lexicon. Different languages have
    different Pronunciation Dictionaries. For example, the Mandarin Chinese Pronunciation
    Dictionary contains the correspondence between Chinese Pinyin and Chinese characters,
    just like Table 4-3, while the English Pronunciation Dictionary contains the correspondence
    between phonetic symbols and words. Still taking Mandarin Chinese as an example,
    the main role of the Pronunciation Dictionary is to find the corresponding Chinese
    Pinyin and corresponding Chinese characters (words) based on the phonemes recognized
    by the Acoustic Model, establishing a connection between the Acoustic Model and
    the Language Model, linking the two.


    Table 4-3　Example of Mandarin Chinese Pronunciation Dictionary


    ![](img/txt004_32.jpg "pagenumber_ebook=110,pagenumber_book=99")


    #### Knowledge Expansion: Frequency Bands of Sound


    The frequency of sound that the human ear can receive ranges from `20 ~ 20000
    Hz`, and the frequency of speech produced by humans ranges from `80 ~ 12000 Hz`.
    The so-called frequency band divides the sound into several sections according
    to frequency, and sounds in different frequency bands give people different feelings.


    1. `20 ~ 60 Hz`. Boosting this band gives a feeling of loud sound, making music
    powerful, but if boosted too much, it causes a muddy, unclear feeling.

    2. `60 ~ 250 Hz`. This band is the low-frequency structure of music, and its proportion
    with mid-high frequencies constitutes the balance of the timbre structure. Boosting
    this band makes the sound feel fuller, but too much causes a booming sound.

    3. `250 ~ 4000 Hz`. This band contains the low-frequency harmonics of most instruments
    and affects the clarity of human speech and instrument sounds. The human ear is
    sensitive to this band, so it is generally not adjusted; otherwise, distortion
    and other problems easily occur.

    4. `4000 ~ 5000 Hz`. This band affects the sense of distance of sound. Boosting
    it makes the sound source feel closer; conversely, it feels farther.

    5. `6000 ~ 16000 Hz`. This band affects the brilliance and clarity of timbre.
    Boosting it makes the sound brighter but less clear; conversely, it makes the
    sound clearer but thinner. This band is suitable for restoring human speech.


    #### Knowledge Expansion: Three Classifications of Speech Recognition Technology


    - **Classified by continuity of speech recognition**: Can be divided into Isolated
    Word Recognition and Continuous Speech Recognition. The former recognizes individual
    words or characters in isolation, where the pronunciation of a single word is
    relatively independent and unaffected. The latter recognizes continuous speech
    to form sentences, generally requiring a Pronunciation Dictionary to reflect the
    correspondence between acoustic symbols (such as Chinese Pinyin) and words, and
    a Language Model to reflect the correct relationships between words.

    - **Classified by distance from the microphone**: Can be divided into Near-field
    Recognition and Far-field Recognition. The former means the speaker needs to be
    close to the microphone to be recognized; smart voice assistants in mobile phones
    and tablets use near-field speech recognition. The latter means the speaker can
    be recognized even far from the microphone; smart speakers use far-field speech
    recognition.

    - **Classified by speaker''s voice characteristics for recognition**: This is
    what we often call Voiceprint Recognition (Speaker Recognition). Everyone''s speech
    actually has different characteristics, just like fingerprints and irises, all
    possessing uniqueness. They can be used to identify the speaker as a method of
    identity verification.


