    ![](img/txt002_15.jpg "pagenumber_ebook=42,pagenumber_book=31")

    **Figure 2-13　Judging Axolotls**


    Xiao Neng: "The axolotl should be A."


    If the choice is correct, it means learning is successful. If the choice is wrong,
