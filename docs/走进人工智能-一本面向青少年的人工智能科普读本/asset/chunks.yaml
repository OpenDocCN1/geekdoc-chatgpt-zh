    ### 1.3.2 Intelligent Speech


    Let''s first look at a dialogue where a customer is booking a hairdressing service
    by phone.


    > **Clerk** Hello, how can I help you?

    >

    > **Customer** Hi, I''d like to book a women''s haircut for a client. The date
    is May 3rd.

    >

    > **Clerk** Sure, one moment please.

    >

    > **Customer** Mm-hmm.

    >

    > **Clerk** What time would you like to book?

    >

    > **Customer** 12 PM.

    >

    > **Clerk** We''re fully booked at 12 PM. The closest slot is 1:15 PM.

    >

    > **Customer** How about 10 AM to 12 PM?

    >

    > **Clerk** That depends on the service. What service does she need?

    >

    > **Customer** Just a women''s haircut.

    >

    > **Clerk** Okay, 10 AM works.

    >

    > **Customer** Her name is Lisa.

    >

    > **Clerk** Okay, see Lisa on May 3rd at 10 AM.

    >

    > **Customer** That''s right, great, thanks.

    >

    > **Clerk** Okay, have a nice day, goodbye.


    One of the speakers in this dialogue is a robot. Can you guess who it is—the clerk
    or the customer?


    Actually, the "customer" is a "robot." Did you guess right? This dialogue comes
    from the 2018 Google I/O conference live demo video. The name of this AI is Google
    Duplex. This dialogue sounds incredible; the line between humans and AI is blurring.
    The voices of the human clerk and the AI customer are almost indistinguishable—the
    latter''s intonation is extremely precise, not mechanical at all. It even adds
    filler words ("Mm-hmm") before answering, just like a real human.


    In human-computer voice dialogue, intelligent speech technology is indispensable.
    Intelligent speech technology includes **speech recognition** (converting speech
    to text) and **speech synthesis** (converting text to speech). It endows machines
    with the ability to listen and speak. In daily life, we use voice input methods
    for text entry and hear voice broadcasts during phone navigation—all inseparable
    from intelligent speech technology.


    Besides intelligent speech technology, **natural language processing (NLP)** plays
    an active role in enabling machines to better understand human language and speak
    more naturally. NLP and intelligent speech technology work hand in hand, making
    voice dialogue between humans and machines smoother.


