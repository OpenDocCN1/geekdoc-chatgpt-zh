    在语音识别的过程中，需要对声学模型进行训练。在语音合成的过程中，需要对声学模型进行训练吗？如果需要，训练的过程一样吗？


    #### 知识拓展：语音合成技术的其他方法


    常见的语音合成技术方法除参数合成法和波形拼接法以外，还有以下三种。


    1. **共振峰合成法**。这是一种使用电路来模拟人的声道模型，由此产生语音的方法。这种方法结构复杂，产生的语音带有比较浓郁的机器感。

    2. **发音器官合成法**。这是一种按照人的发声器官结构来建立模型，由此产生语音的方法。这种方法目前还在研制阶段，因为人在发声时，对发声器官运动的测评非常困难。

    3. **语音转换法**。这种语音合成方法，是把讲话人甲的语音转换成具有讲话人乙的语音特征的语音。使用这种语音合成方法，可以让机器模仿他人讲话。


