    ### 2.1.2 Traditional Algorithms vs. Machine Learning-Based Algorithms


    #### 1. Traditional Algorithms


    Traditional algorithms are programs written with specific recognition rules. The
    program''s judgment process is shown in Figure 2-2. In programs written with traditional
    algorithms, many image data are pre-stored as an image library; these libraries
    are also called sample data. As seen in Figure 2-2, traditional algorithms need
    to compare whether the player''s drawing matches the graphics in the library.
    If the graphic is not in the library, the program fails to recognize it, because
    the program runs strictly according to the written instructions during execution.
    In reality, everyone''s drawing skill and style differ; drawing exactly like the
    library is very difficult.


    ![](img/txt002_4.jpg "pagenumber_ebook=36,pagenumber_book=25")

    Figure 2-2　Judgment Process of Traditional Algorithm


    #### 2. Machine Learning-Based Algorithms


    "Guess the Drawing" uses a machine learning-based algorithm. In this process,
    it does not write specific rules but lets the machine automatically learn the
    patterns from the "Guess the Drawing" library data. This process can be understood
    as the machine automatically extracting features from sample data. Then, graphics
    with the same features are categorized, and a model is built for each category
    (e.g., dog). Afterwards, it judges which category model the user''s drawing is
    closest to (Figure 2-3). For example, when we draw a dog, "Guess the Drawing"
    compares feature points (this process completes in the classifier) and finally
    classifies it into the "dog" category, thus recognizing the drawing as a dog.
    This machine learning process is shown in Figure 2-3. Even if you are a "soul
    artist" (bad at drawing), as long as you draw the features of a dog, AI can guess
    it.


    ![](img/txt002_5.jpg "pagenumber_ebook=36,pagenumber_book=25")

    Figure 2-3　Machine Learning-Based Algorithm Process in "Guess the Drawing"


    > **Thinking Exploration**

    >

    > We know "Guess the Drawing" pre-stores many images forming a library as basic
    sample data for machine learning. What should be noted when collecting these sample
    data? For example, should the quantity of sample data be larger or smaller? Should
    the drawing styles be diverse or uniform?


    ### 2.1.3 Selection of Sample Data


    To learn and build a model through a classifier requires a certain amount of data.
    If the collected sample data volume is too small to meet the learning requirement,
    or if the volume is large but the data types are too uniform, the classifier will
    produce errors. Therefore, we should avoid these two situations when selecting
    sample data.


    #### 1. Insufficient Sample Data


    Take "Guess the Drawing" as an example. What happens if sample data is too few
    during machine learning? Imagine "Guess the Drawing" wants to distinguish if the
    player drew a dog. If the library only stores a few images of dogs with long ears
    and long tails, due to insufficient samples, when a player draws a "Pomeranian"
    with short ears and tail, "Guess the Drawing" cannot recognize it as a dog. This
    is the problem caused by "insufficient sample data" during machine learning (Figure
    2-4).


    #### 2. Overly Uniform Sample Data


    Again, take "Guess the Drawing." Suppose the library has many "dog" samples, but
    they are all cartoon "Pomeranians." "Guess the Drawing" memorizes all features
    of the "Pomeranian." At this point, if a player draws a cartoon "Basset Hound,"
    "Guess the Drawing" might think the difference is too large and judge the "Basset
    Hound" not to be a dog. This is because the sample data obtained by "Guess the
    Drawing" cannot generalize the features of all "dogs"; it can only distinguish
    one type—the "Pomeranian." This is the problem caused by sample data being overly
    uniform and lacking diversity during machine learning (Figure 2-5).


    ![](img/txt002_6.jpg "pagenumber_ebook=37,pagenumber_book=26")

    Figure 2-4　"Insufficient Sample Data" Phenomenon


    ![](img/txt002_7.jpg "pagenumber_ebook=37,pagenumber_book=26")

    Figure 2-5　"Overly Uniform Sample Data" Phenomenon


    Both "insufficient sample data" and "overly uniform sample data" lead to poor
    machine learning results. Therefore, when collecting sample data, we should strive
    for diversity and collect as many samples as possible.


    ### 2.1.4 More Applications of Machine Learning-Based Algorithms


    Today, machine learning-based technology can be found in many fields; you might
    be using it in some way without realizing it. Let''s look at more applications
    of machine learning-based algorithms in life.


    #### 1. Machine Learning in Search Engines


    When using a search engine (Figure 2-6), one reason it finds the results we want
    is that it uses machine learning-based algorithms, learning to categorize and
    rank web pages that meet the search criteria.


    #### 2. Machine Learning in Spam Filters


    When using email systems, spam filters help filter large amounts of spam, also
    due to machine learning-based algorithms (Figure 2-7). To identify spam, filters
    are constantly updated; they use machine learning algorithms to let the machine
    continuously extract spam features, helping users classify spam so we are not
