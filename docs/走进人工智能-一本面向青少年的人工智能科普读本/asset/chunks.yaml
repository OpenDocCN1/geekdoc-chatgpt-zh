    # 人工智能硬件算力与核心技术


    人工智能硬件算力的核心是计算机芯片，其中人工智能芯片的主要类型如下。


    - **GPU（图形处理器）**：进行图形、图像相关运算工作的微处理器。

    - **FPGA（现场可编程门阵列）**：专用集成电路领域中的一种半定制电路，可编程、可升级、可迭代。

    - **ASIC（专用集成电路）**：应特定用户要求和特定电子系统的需要而设计、制造的集成电路，比如专用的音频、视频处理器。

    - **类脑芯片**：人工智能芯片中的一种架构。它是模拟人脑进行设计的，相比传统芯片，在功耗和学习能力上具有更大优势。


    2017年，中国科学院计算技术研究所发布了全球首个可以进行“深度学习”的“神经网络”处理器芯片——“寒武纪”（图1-14）。


    2019年，清华大学类脑计算研究中心开发出了全球首款异构融合类脑计算芯片——“天机芯”。这一成果登上顶级学术期刊《自然》（Nature）的封面（图1-15）。


    2020年，中国科学技术大学与中国科学院上海微系统所、国家并行计算机工程技术研究中心合作，成功构建76个光子的量子计算原型机“九章”。“九章”求解5 000万个样本的高斯玻色取样只需200秒，比当年最快的超级计算机快了约100亿倍。这一突破使我国成为全球第二个实现“量子优越性”的国家。


    数据、算法、算力是人工智能中必不可少的驱动力，随着三大关键技术的不断更新升级，人工智能未来可期。


