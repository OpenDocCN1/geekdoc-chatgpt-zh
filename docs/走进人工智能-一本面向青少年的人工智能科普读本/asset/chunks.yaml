    图2-9　识别植物


    2.2　监督学习


    生活中，我们通过很多方式来学习。在我们很小的时候，爸爸妈妈会拿着苹果告诉我们像这样红色的、球形的、表面光滑的就是苹果。后来当我们看到青苹果时，爸爸妈妈会告诉我们其实苹果不都是红色的，也有青色的。渐渐地我们在脑子里就有了苹果的模型，后来我们就能分辨出苹果了。等我们长大了，会自己看书了，也能从书中自学，找到事物之间的联系，有时我们也会通过不断“试错”来学习。


    机器学习也有自己的学习方式，如“监督学习”“无监督学习”“强化学习”等。


    2.2.1　人类的学习


    也许我们已经忘记了小时候父母是怎么教会我们认识苹果的，那就跟着小能同学重温一下这个学习过程吧（图2-10）。


    1.看（美西钝口螈的图片）


    为了帮助我们准确地认识美西钝口螈，小能同学采集了不同角度、不同形态、不同颜色的美西钝口螈图片，并告诉我们这些都是美西钝口螈。通过用眼睛看、观察的方式，以此来增加我们大脑对美西钝口螈的认知（图2-11）。


    ![](images/txt002_12.jpg "pagenumber_ebook=40,pagenumber_book=29")


    图2-10　人类的学习重温


    ![](images/txt002_13.jpg "pagenumber_ebook=40,pagenumber_book=29")


    图2-11　看（美西钝口螈的图片）


    2.记忆（美西钝口螈）


    想要记住美西钝口螈，我们需要找到美西钝口螈的特点。


    通过观察，可以发现美西钝口螈有如下特点：


    有六个像角一样的腮；


    脸宽大；


    有四条腿并且腿比较短、比较细；


    有着鱼一样的尾巴；


    颜色有白色的、黄色的、黑色的；……


    3.在大脑中形成模型


    记住了这些特点后，我们在脑中会形成关于美西钝口螈的模型（即对美西钝口螈的初步印象）。以后看到美西钝口螈，我们就会与大脑中的模型（图2-12）进行对比， 然后认出美西钝口螈。


    ![](images/txt002_14.jpg "pagenumber_ebook=41,pagenumber_book=30")


    图2-12　脑中形成的“美西钝口螈”模型


    4.验证模型


    是否真的学会识别美西钝口螈，需要进行实践的验证，就像我们在学校里学习知识后，还会进行一些练习与测验，用于考核我们对知识的掌握程度。


    测试的目的在于验证我们对美西钝口螈的认知是否全面、可靠。换言之，就是我们大脑中的模型是否足够支撑我们认出美西钝口螈。如果我们还不能认出美西钝口螈，就需要改进脑中关于美西钝口螈的模型。


    思考探索


    请问图2-13中哪个选项是美西钝口螈？（ ）


    ![](images/txt002_15.jpg "pagenumber_ebook=42,pagenumber_book=31")


    图2-13　判断美西钝口螈


    小能同学：“美西钝口螈应该是A。”


    如果选对了，表示学会了。如果选错了，可以观察 A选项中的图片，与脑中现有模型进行比较，然后重新归纳美西钝口螈的特点，在脑海里形成更完善的模型。


    2.2.2　监督学习的一般过程


    像人类这样，通过观察已经被告知内容的图片进行学习（我们已经通过小能同学知道这些都是美西钝口螈的图片）的方式，在机器学习领域，被称为“监督学习”。监督学习通常表示机器学习的数据是带有标记的，比如通过监督学习的方式认识美西钝口螈时，需要提供给机器标记为美西钝口螈的图片。在这种学习过程中，标记就是人给予机器的引导。


    监督学习的优点是学习效率高。但是它也有明显的缺点：过于依赖人。当人的引导出现失误，比如当机器进行关于美西钝口螈的监督学习时，在人给的大量带有标记的样本数据中，夹杂一些不是美西钝口螈的图片数据，那么机器可能就不会准确提炼出美西钝口螈的特征了。由于这样的机器学习方式非常依赖人的知识面，所以在一定程度上限制了机器的学习范围。例如，如果人也不认识美西钝口螈，那么就无法给出带有标记的样本数据，机器在监督学习的方式下就无法进行美西钝口螈的学习，也就不会认识美西钝口螈。


    体验感知


    请使用图形化编程软件，加载人工智能相关模块，给计算机看几张美西钝口螈的图片，看看计算机是否能准确认出美西钝口螈。


    机器学习的思想就是机器模拟人类生活中的过程，因此，监督学习的一般过程与我们刚刚提到的人类的学习过程非常相似。


    让我们一起来看看，机器以监督学习的方式是如何学会识别美西钝口螈的。


    在监督学习中，机器一定会给出判定结果，是美西钝口螈，或者不是美西钝口螈。因此建立分类时，需要建立两类，一类是美西钝口螈，另一类不是美西钝口螈。


    1.采集带有标记的样本数据


    人类学习的第一步是“看”，因此在监督学习中，我们为机器输入一些“美西钝口螈” 的图片，以及一些“不是美西钝口螈”的图片。


    这里提到的“美西钝口螈”的图片与“不是美西钝口螈”的图片就是带有标记的样本数据，其中“美西钝口螈”与“不是美西钝口螈”就是给出的标记。同时这里的“美西钝口螈”和“不是美西钝口螈”也是这些图片最后输出的分类，可以把它们称为“分类标签”（图2-14）。


    “分类标签”是图片的分类依据。在监督学习中，“分类标签”是由人标记的，这也体现了人在监督学习中的监督与引导。


    ![](images/txt002_16.jpg "pagenumber_ebook=43,pagenumber_book=32")


    图2-14　采集带有标记的数据样本


    知识拓展


    分类标签


    分类标签也可以称为“标签”，它是监督学习的重要特点。分类标签其实也是分类的结果。简而言之，就是在我们进行监督学习前，需要事先将结果分为几类告诉机器（至少分为两类），并且确定每一类的名称。


    注意，为了避免出现 “样本数据过少”和“样本数据过于单一”现象，在收集样本数据时要尽可能多样化，多收集一些带有标记的样本数据。


    2.提取特征


    人类通过大脑记住图片中美西钝口螈的特点，而机器则是通过特定的算法，在训练过程中会记住美西钝口螈的特征：有六个像角一样的腮；脸宽大；有四条腿并且腿比较短、比较细；有着鱼一样的尾巴；颜色有白色的、黄色的、黑色的。


    机器会将这些特征转换成其看得懂的“特征”数据。“特征”体现了“美西钝口螈”区别于“不是美西钝口螈”的不同方面的属性或特质。 “特征”是机器学习的依据，机器需要采用比较和归纳的方式进行提取。


    3.形成模型


    机器在掌握了这些特征之后，形成美西钝口螈的数据模型。 在监督学习中，从样本数据中提取的特征值直接体现在模型中，“模型”的优劣可以说是监督学习中的人工智能性能优劣的核心。


    4.验证模型


    当我们给机器一些不同于采集的美西钝口螈和其他动物的图片（没有被学习过的图片）时，机器就会用根据训练形成的模型，去辨别哪些是美西钝口螈。


    若机器能准确识别哪些是美西钝口螈，哪些不是美西钝口螈，那么认为模型是可靠的；如果机器不能准确识别，则需要加入新的样本数据，重新训练模型，即重新提取特征，形成另一个新模型。这个过程可以理解为完善和改进模型。


    监督学习的一般过程如图2-15所示。


    ![](images/txt002_17.jpg "pagenumber_ebook=45,pagenumber_book=34")


    图2-15　监督学习的一般过程


    知识拓展


    置信度


    机器在监督学习时，会有一个名为“置信度”的参数，通常以“%”形式表示。这个“置信度”可以表示可靠程度。比如某次数学考试，某同学有90%的把握考到85～90分，那么“85～90分”称为置信区间，“90%”表示的就是置信度。监督学习也是如此，如果模型输出95%为“美西钝口螈”，那么此时“美西钝口螈”就可以理解为置信区间，“95%”表示的就是置信度。在监督学习中，置信度越高，说明模型对输出的结果越肯定。


    思考探索


    置信度与哪些因素有关？如果想要提高置信度，可以怎么做？


    一般来说，置信度与采集的样本数据有关。采集的样本图片数据质量越高，数量越多，置信度越高，模型对输出的结果越肯定。


    动手实践


    请使用图形化编程软件，加载人工智能相关模块，编写一个垃圾分类的程序，让计算机能识别出干垃圾、湿垃圾、可回收垃圾和有害垃圾。


    2.3　无监督学习


    除了在监督学习中说到的人类学习的方式，人还可以在无人监督的情况下，通过归纳推理的方式自主学习。


    2.3.1　人的归纳推理式学习


    比如我们看到番茄、山楂、草莓时，可以根据它们的颜色进行归纳：它们共同的颜色是“红色”。又比如我们看到足球、橙子、西瓜时，可以根据形状进行归纳 ：它们共同的形状是“球体”。这种学习方式就是归纳推理式学习（图2-16）。人类自行发现相同点和不同点，根据这些特点分成不同的类别，并且给这些类别取名字，比如“红色”“球体”。


    当人类探索未知事物时，往往使用归纳推理的学习方式，比如生物学家根据动物的特点对动物进行分类，确定不同物种。


    俗话说“物以类聚”，像这样根据事物间的相似程度，将它们合并归纳成一个个类别的过程，称为“聚类”。


    ![](images/txt002_18.jpg "pagenumber_ebook=46,pagenumber_book=35")


    图2-16　人的归纳推理式学习


    2.3.2　无监督学习的一般过程


    人类这样的归纳推理式学习，对应到机器学习领域，就是“无监督学习”。在这种学习过程中，没有人引导和监督，也就是输入没有标记的数据，它是一种机器自主学习的方式。正因为有了无监督学习，机器开始自己探索未知的世界。无监督学习常用的方法是
    “聚类”，机器自主地将数据分割为若干个小团体，这样的小团体也可以称为“集群”。需要注意，虽然聚类在无监督学习中发挥了积极的作用，但是并不意味着“无监督学习
    = 聚类”。


    让我们一起体验一下无监督学习的聚类过程。


    本实验中准备了以下六句话作为学习数据（聚类数据）。


    ①今天去动物园看到老虎和熊猫。


    ②老虎和熊猫的观众最多。


    ③老虎是食肉动物。


    ④午饭吃蛋炒饭和罗宋汤。


    ⑤蛋炒饭里还有香肠呢。


    ⑥明天还想吃蛋炒饭和罗宋汤。


    接下来进行聚类。首先把每一句话看作是一个独立的集群。这样最开始就有六个集群。


    接下来，把最相似的集群合并归纳成一个新的集群。但是怎么判断六个集群中谁和谁“最相似”呢？


    可以把语句中包含相同名词最多的定义为“最相似”。这里将“各句话中包含的相同名词数”看作“相似度”。


    一起尝试制作一张表格，记录 ①—⑥ 句话中包含的相同名词，看看你的结果是不是和表2-1一样。


    从表2-1中我们统计出各句话之间的相似度如表2-2所示。


    表 2-1标记各语句中的名词


    ![](images/txt002_19.jpg "pagenumber_ebook=47,pagenumber_book=36")


    表 2-2各语句对应其他语句的相似度


    ![](images/txt002_20.jpg "pagenumber_ebook=47,pagenumber_book=36")


    思考探索


    通过表2-2我们发现，\_\_\_\_\_\_与\_\_\_\_\_\_相似度为2，\_\_\_\_\_\_与\_\_\_\_\_\_相似度也为2。


    我们发现句①与句②中都包含“老虎”和“熊猫”，即相似度为 2；还发现句④与句⑥中都包含“蛋炒饭”和“罗宋汤”，即相似度也为 2。


    把集群句①与集群句②合并归纳成一个新集群，集群句④与集群句⑥合并归纳成另一个新集群。此时集群数为 4，如图2-17所示。


    图2-17是统计“最相似”时获得的新集群图，我们发现此时相似度为 2。若将相似度为 1的也计算在内，那么集群 1与集群 3又可以构建成一个新的集群，集群 2与集群
    4也可以构建成一个新的集群，如图2-18所示。


    若将相似度设置为 0，那么这六句话就是一个集群了。因此我们发现相似度的设置非常重要，若相似度设置得过低（比如设置为 0），那么这个无监督学习的聚类就变得没有意义了。


    ![](images/txt002_21.jpg "pagenumber_ebook=48,pagenumber_book=37")


    图2-17　相似度为 2时新获得的集群图


    ![](images/txt002_22.jpg "pagenumber_ebook=48,pagenumber_book=37")


    图2-18　相似度为 1时新获得的集群图


    在无监督学习中，机器通过算法根据给出的相似度设置，就会把数据进行聚类，通过机器自主学习将相似的数据分到一个类别中（图2-19）。


    ![](images/txt002_23.jpg "pagenumber_ebook=49,pagenumber_book=38")


    图2-19　无监督学习中的聚类


    2.3.3　无监督学习在生活中的应用


    1.购物平台的商品自动推荐


    用户在使用购物平台时，系统会把他们的消费习惯、浏览偏好、所处地理位置等各种信息记录下来，然后根据这些信息，把购物平台的用户们聚合成不同的类型，比如“摄影爱好者”“音乐发烧友”等，然后再对不同类型的用户推送他们可能感兴趣的商品，从而增加商品被选购的几率（图2-20）。


    ![](images/txt002_24.jpg "pagenumber_ebook=49,pagenumber_book=38")


    图2-20　购物平台的商品自动推荐


    2.手机相册人物聚类


    有些手机会自动识别相册中照片的人脸，然后把这些照片根据人脸进行自动聚类，同一个人的照片就会被放在一起，方便用户查看。即使是新增加的照片也可以按照人脸自动归类。


    体验感知


    请打开手机相册中的“人物”，看看同一类中是否都是同一人的照片？


    2.3.4　监督学习与无监督学习的比较


    对比一：有分类标签与无分类标签


    监督学习是输入带有分类标签的数据。


    无监督学习是输入没有分类标签的数据。


    对比二：有确定输出结果与无确定输出结果


    监督学习的输出结果就是预设的分类标签，因此该结果是确定　的。


    无监督学习的输出结果是事先未知的，在不同算法、不同相似度情况下输出的类别结果是不确定的。比如我们观察聚类后的结果，它可能按颜色进行聚类，也可能按形状进行聚类。


    对比三：分类与聚类


    分类是监督学习的一种方法。


    聚类是无监督学习的一种方法。


    分类与聚类的最大区别在于，分类知道样本数据的类别信息。在进行监督学习时，标记分类标签其实已经确定了分多少类。但是无监督学习中的聚类事先并不知道样本数据的类别信息。根据相似度设置的不同，可能分四类，也可能分两类。聚类的时候，并不关心某一类是什么，实现的只是将相似的东西聚在一起。在聚类结果出来前，并不知道每一类有什么特点，而是要根据聚类的结果，通过人们的经验来归纳分析，得出聚成的每一类可能有什么特点。


    知识拓展


    半监督学习


    半监督学习介于监督学习与无监督学习之间，综合了监督学习和无监督学习的特点。在半监督学习中，数据是由少量的带有标记的样本数据和大量的没有标记的样本数据组成，并将进行学习与预测。一般而言，半监督学习通过在有监督的分类算法中加入无标记的样本数据来实现半监督分类，或者是在无标记的样本数据中加入有标记的样本数据，以此来增强无监督聚类的效果。


    2.4　强化学习


    在学校里，如果上课迟到会被老师批评，我们就会尽量避免“迟到”这件事。相反，如果主动帮助同学会得到老师的表扬，那么为了获得更多的表扬，我们会多做“助人”这件事情。


    人类用思考与改进的方法提升自己对知识的掌握和认知，在人工智能机器学习中，我们将这个过程称为“强化学习”。


    2.4.1　生活中的思考与改进


    前面我们举了人类思考与改进的例子。其实人类不仅仅是用思考与改进的方法学习，将它还用于训练动物，比如训练能上岗的导盲犬（图2-21）。


    训练能上岗的导盲犬的目的：让导盲犬能带领扮演盲人的训练员通过各种障碍物。如果它能成功做到就会得到表扬并被抚摸，如果做不到就会受到批评。为了不受到批评并且获得更多的表扬与抚摸，慢慢地导盲犬就学会了带训练员通过各种障碍物（图2-22）。


    ![](images/txt002_25.jpg "pagenumber_ebook=51,pagenumber_book=40")


    图2-21　训练导盲犬


    导盲犬是怎么做到的呢？首先它会观察周边的环境，包括障碍物的位置、障碍物的多少等，思考前进的路线，然后开始尝试行动。当它能够带领训练员安全通过障碍物时，会得到表扬，会被抚摸，这让它很开心。但是当它没能安全带领训练员安全通过障碍物时，会被训练员批评，这让它很失落。为了不被批评，并且获得更多的表扬和抚摸，它就会思考改进避让障碍物的路线，不断巩固成功的线路，改变失败的线路。随着训练次数的增加，不断地循环，导盲犬就能成功上岗，带领训练员通过各种障碍物。


    训练导盲犬的模型如图2-23所示。


    思考探索环境、决策、行动、奖惩这四个概念分别


    是什么意思？


    ![](images/txt002_26.jpg "pagenumber_ebook=52,pagenumber_book=41")


    图2-22　训练导盲犬的过程


    ![](images/txt002_27.jpg "pagenumber_ebook=52,pagenumber_book=41")


    图2-23　训练导盲犬的模型


    在如图2-23所示的过程中，需要厘清四个概念。


    （1）环境。导盲犬需要观察环境。障碍物的位置，障碍物的多少，被带领的训练员的体型，自己的体型等，这些都是需要导盲犬注意的环境。


    （2）决策。导盲犬会根据观察到的环境去思考避开障碍物的路线。


    （3）行动。根据思考决策的结果做出行动，具体表现为根据选择的路线带领训练员通过。


    （4） 奖惩。导盲犬在行动之后就会得到奖励或者惩罚。根据奖惩，导盲犬会继续思考调整选择的路线，形成一个循环，不断学习尝试。


    这个过程中最重要的是决策，思考如何行动才能获得更多奖励。


    2.4.2　强化学习的一般过程


    强化学习可以看作机器思考与改进的过程。


    强化学习其实就是一种不断试错的学习，在各种环境下需要尽量尝试所有可以选择的动作，通过环境给出的反馈（即奖惩）来判断动作的优劣，最终获得环境和最优动作的映射关系（即决策）。


