    ### 1.3.4 自然语言处理


    语言是人类区别于其他动物的特征，人的许多智能都和语言有密不可分的联系。自然语言是人类日常使用的语言。


    我们先来看以下这些讯息：


    - 某记者在四川九寨沟地震后25秒写出速报，信息完整，参数准确。

    - 某体育记者16天撰写出450多篇体育新闻，与直播同步发布。

    - 某财经编辑一天写出1 900篇稿件，震惊业界。


    你能想到这个“某记者”“某编辑”压根就不是普通人吗？它们是机器人！这些机器人非常擅长写体育、财经、科技等领域稿件，既有速度又有质量，而且只要不断电，24小时随时工作。以腾讯Dreamwriter写稿机器人为例，半年写稿30万篇，600万字，2016年奥运期间产出了3
    600余篇体育新闻，绝对的“业界劳模”。


    机器翻译属于自然语言处理其中的一种。世界上有那么多的种族，各种族大都有自己的语言体系。各国语言不通阻碍了大家的交流，是一个令人头疼的问题。作为一个普通人，想完成“世界那么大，我想去看看”的愿望，语言关必须要过。但是学好一门外语已经不容易了，更何况还有那么多语言，普通人根本无法全部掌握。随着翻译机的出现，现在这个问题已经得到很好的解决。


    以我国强大先进的翻译机为例，它不仅覆盖了全球近200个国家和地区的语言，而且还能识别出加拿大、英国、澳大利亚、印度、新西兰五个国家的带口音的英语和我国的四种方言（粤语、四川话、东北话、河南话）。这个功能非常了不起并且非常实用。


