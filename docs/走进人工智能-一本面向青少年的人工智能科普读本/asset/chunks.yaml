    ## 3.4.3 人脸检测


    人脸检测是在图像中准确标定出所有人脸的位置和大小，通常用一个个检测框标示出来。还记得之前我们学习过的目标检测吗？目标检测中的“目标”其实是可以包含人脸这个目标的。


    人脸检测算法要解决以下几个关键问题：


    - 人脸可能出现在图像中的任何一个位置；

    - 人脸可能部分被遮挡；

    - 人脸由于远近关系可能有不同的大小；

    - 人脸在图像中可能有不同的视角和姿态。


    还记得我们是怎么进行目标检测的吗？人脸检测也可以用类似的方法。图像中的人脸是很特殊的一类检测目标，所以需要引入“图像金字塔”的概念。


    所谓**图像金字塔**（图3-52），就是将分辨率最高的图像放在底部，往上是一系列像素逐渐降低的图像，外观很像金字塔形状，这就构成了计算机视觉中的图像金字塔。


    ![](images/txt003_54.jpg "pagenumber_ebook=90,pagenumber_book=79")


    图3-52　图像金字塔示意图


    在人脸检测过程中，人脸图像金字塔显得尤为有用，因为人脸在图像中会有远近、大小之分。人脸检测算法会规定一个最小检测范围，比如`12×12`像素，小于这个范围的人脸就不检测了。大于这个范围怎么办？就把检测到的图像逐步降低分辨率，直到`12×12`像素，在这个过程中如果检测到人脸就标记上检测框。显然这样做会造成大量的重复标记，同一个人脸会打上不同尺寸的检测框。所以接下去计算机会把标记出来的检测框进行合并去重，保留最合适人脸尺寸的检测框。


    当深度学习来临时，科学家们也想到了将深度学习与人脸检测相结合。2016年，中国科学院深圳先进技术研究院的科学家们开发了`MTCNN`算法，大体上可以分为三层网络结构：`P-Net`、`R-Net`和`O-Net`。


    简单介绍这三层神经网络的原理：


    - **`P-Net`网络**的主要目的是生成一些候选检测框，使用`P-Net`神经网络，对图像金字塔上不同分辨率的图像，每一个区域都做一次人脸检测，并且给出人脸检测框的位置和置信度。

    - **`R-Net`神经网络**和`P-Net`神经网络类似，将前面`P-Net`神经网络生成的检测框再输入`R-Net`神经网络，进一步优化。

