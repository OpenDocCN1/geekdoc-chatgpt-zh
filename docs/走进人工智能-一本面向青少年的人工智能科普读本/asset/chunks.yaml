    ### 1.3.4 Natural Language Processing


    Language is the characteristic that distinguishes humans from other animals; much
    of human intelligence is inextricably linked to language. Natural language is
    the language used by humans daily.


    Let''s look at these news items first:


    - A reporter wrote a flash report 25 seconds after the Jiuzhaigou earthquake in
    Sichuan, with complete information and accurate parameters.

    - A sports reporter wrote over 450 sports articles in 16 days, published synchronously
    with live broadcasts.

    - A financial editor wrote 1,900 manuscripts in one day, shocking the industry.


    Can you guess that these "reporters" and "editors" are not ordinary people? They
    are robots! These robots excel at writing manuscripts in sports, finance, technology,
    and other fields—with both speed and quality—and as long as the power stays on,
    they work 24/7. Take Tencent''s Dreamwriter writing robot for example: it wrote
    300,000 articles and 6 million words in half a year, producing over 3,600 sports
    articles during the 2016 Olympics—an absolute "industry model worker."


    Machine translation is one type of natural language processing. There are so many
    ethnic groups in the world, most with their own language systems. Language barriers
    hinder communication—a headache-inducing problem. For an ordinary person to fulfill
    the wish "the world is so big, I want to see it," the language barrier must be
    crossed. But mastering one foreign language is hard enough, let alone so many;
    ordinary people simply cannot master them all. With the advent of translators,
    this problem has been well solved.


    Take China''s powerful and advanced translators as an example: they not only cover
    languages of nearly 200 countries and regions worldwide but can also recognize
    accented English from five countries (Canada, UK, Australia, India, New Zealand)
    and four Chinese dialects (Cantonese, Sichuanese, Northeastern, Henanese). This
    feature is remarkable and highly practical.


