    ## 2.4.3 Comparison of Supervised, Unsupervised, and Reinforcement Learning


    However, suppose we do not know the number of gold coins on each node''s path
    ahead. Then the initial choice is between Node 1 and Node 2. We would choose Node
    2 because it yields 50 gold coins. This causes us to miss Path 1. Here we need
    to understand that the goal in reinforcement learning is **reward maximization**,
    i.e., achieving the highest cumulative return. Although choosing Node 2 yields
    the highest *immediate* reward (50 gold coins), in the long run, it does not yield
    the highest cumulative reward (Path 1 yields 660 gold coins).


    In reinforcement learning, a "good" algorithm is very "ambitious" and will not
    be tempted by immediate petty gains. It cannot only see immediate benefits but
    must learn to consider the long term.


    ### Think and Explore


    In this problem, can you identify what the environment, decision, action, and
    reward/punishment are?


    - **Environment**: There are different paths from start to finish, each with a
    different number of gold coins.

    - **Decision**: Choosing a path.

    - **Action**: Walking from start to finish along the path chosen by the decision.

    - **Reward/Punishment**: Based on the number of gold coins obtained from the action,
    calculate whether this path yields more gold coins than previous paths (since
    the goal is to get more gold coins). Consider if there are other different paths,
    forming a loop to continuously learn and try.


    The general process of reinforcement learning can be summarized as shown in Figure
    2-25.


    ![](img/txt002_29.jpg "pagenumber_ebook=54,pagenumber_book=43")


    Figure 2-25　General Process of Reinforcement Learning


    Supervised learning involves inputting labeled sample data, obtaining a model
    by training on labeled data samples, and thereby outputting a predetermined classification
    label.


    Unsupervised learning involves inputting unlabeled data, autonomously inducing
    and reasoning to group data into clusters. Since it is autonomous induction, the
    output results often cannot be determined in advance.


    Reinforcement learning does not require pre-input data; its key lies in decision-making.
    Therefore, reinforcement learning is a process of continuous trial and error,
    looping repeatedly. Based on feedback rewards/punishments in the current environment,
    it continuously thinks and improves, makes different decisions, and puts them
    into action.


