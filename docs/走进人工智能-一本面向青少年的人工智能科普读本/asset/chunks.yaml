    #### 5. Computer Vision and Security Monitoring


    In recent years, identification technology based on biological characteristics
    has received extensive attention, mainly focusing on features such as face (Figure
    3-9), iris (Figure 3-10), fingerprint (Figure 3-11), and voice, most of which
    are related to visual information.


    Taking the search for criminal suspects as an example, the traditional method
    of manually screening targets from massive video data is like finding a needle
    in a haystack, involving a huge workload and prone to omissions. Intelligent security
    technology uses computer vision and deep learning to let computers analyze personal
    features in the data, then automatically screen based on the suspect''s features,
    quickly and accurately identifying various important features of individuals,
    such as gender, age, hairstyle, clothing, build, whether they wear glasses, whether
    they are cycling, and carried items, automatically identifying suspects from large
    amounts of surveillance video. This not only saves manpower and material resources
    but also greatly shortens the time to solve cases.


    #### 6. Computer Vision and Autonomous Driving


    With the continuous popularization and promotion of technologies such as big data,
    the Internet of Things, and 5G in the automotive field, autonomous driving technology
    (Figure 3-12) has also begun to be known by the public.


    ![](img/txt003_14.jpg "pagenumber_ebook=70,pagenumber_book=59")


    Figure 3-12　Autonomous Driving


    Autonomous vehicles, also known as driverless cars, are intelligent vehicles that
    achieve unmanned driving through computer systems. Autonomous vehicles rely on
    the collaboration of artificial intelligence systems such as computer vision,
    allowing computers to automatically and safely operate motor vehicles without
    active human operation. On August 30, 2019, China''s first mass-produced L4-level
    autonomous passenger vehicle—Hongqi EV, jointly built by BAIC and FAW—obtained
    5 Beijing autonomous driving road test licenses.


    The above lists the main application scenarios of computer vision technology.
    So how exactly does a computer achieve computer vision? What is the principle
    of computer vision?


