    # 2.3 Unsupervised Learning


    Besides the human learning method mentioned in supervised learning, humans can
    also learn autonomously through inductive reasoning without human supervision.


    ## 2.3.1 Human Inductive Reasoning Learning


    For example, when we see tomatoes, hawthorns, and strawberries, we can induce
    based on their color: their common color is "red." Another example: when we see
    a soccer ball, an orange, and a watermelon, we can induce based on shape: their
    common shape is "sphere." This learning method is inductive reasoning learning
    (Figure 2-16). Humans discover similarities and differences on their own, divide
    them into different categories based on these characteristics, and name these
    categories, such as "red" and "sphere."


    When humans explore unknown things, they often use inductive reasoning learning
    methods. For example, biologists classify animals based on their characteristics
    to determine different species.


    As the saying goes, "Birds of a feather flock together." The process of merging
    and categorizing things into categories based on their degree of similarity is
    called "Clustering."


    ![](img/txt002_18.jpg "pagenumber_ebook=46,pagenumber_book=35")

    **Figure 2-16　Human Inductive Reasoning Learning**


    ## 2.3.2 General Process of Unsupervised Learning


    Such human inductive reasoning learning corresponds to "Unsupervised Learning"
    in the field of machine learning. In this learning process, there is no human
    guidance or supervision; that is, the input data is unlabeled. It is a way for
    machines to learn autonomously. It is because of unsupervised learning that machines
    begin to explore the unknown world on their own. A common method used in unsupervised
    learning is "Clustering." The machine autonomously divides data into several small
    groups, which can also be called "Clusters." Note that although clustering plays
    a positive role in unsupervised learning, it does not mean "Unsupervised Learning
    = Clustering."


    Let''s experience the clustering process of unsupervised learning together.


    In this experiment, the following six sentences are prepared as learning data
    (clustering data).


    1. Today I went to the zoo and saw tigers and pandas.

    2. Tigers and pandas had the most visitors.

    3. Tigers are carnivores.

    4. Lunch was egg fried rice and borscht.

    5. There was sausage in the egg fried rice too.

    6. I want to eat egg fried rice and borscht tomorrow too.


    Next, perform clustering. First, treat each sentence as an independent cluster.
    So initially there are six clusters.


    Next, merge the most similar clusters into a new cluster. But how to judge which
    of the six clusters are "most similar"?


    We can define the sentences containing the most identical nouns as "most similar."
    Here, the "number of identical nouns contained in each sentence" is regarded as
    "Similarity."


    Let''s try to make a table together, recording the identical nouns contained in
    sentences ①—⑥, and see if your result matches Table 2-1.


    From Table 2-1, we calculate the similarity between sentences as shown in Table
    2-2.


    **Table 2-1 Marking Nouns in Each Sentence**


    ![](img/txt002_19.jpg "pagenumber_ebook=47,pagenumber_book=36")


    **Table 2-2 Similarity of Each Sentence Corresponding to Other Sentences**


    ![](img/txt002_20.jpg "pagenumber_ebook=47,pagenumber_book=36")


