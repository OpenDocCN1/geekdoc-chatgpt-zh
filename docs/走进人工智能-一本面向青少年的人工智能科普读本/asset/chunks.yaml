    ## 4.3 语音识别


    ### 4.3.1 语音识别的准备


    语音识别技术是一种让机器“听得见”的技术，可以把我们说的话转变成文字，这究竟是怎么实现的呢？其实方法有很多，其中经典的语音识别算法是由声学模型、语言模型和发声词典组成的。我们就以它为例，来看看说话的语音是怎么一步步变成文本文字的。


    在进行识别之前需要先做一些准备工作。


    首先用大量声音数据训练一个声学模型，以用来将声音转换为声学符号（图4-22）。


    接着用大量文本数据训练一个语言模型，为声学符号找到可能的文字表达（图4-23）。


    ![](images/txt004_25.jpg "pagenumber_ebook=107,pagenumber_book=96")

    图4-22　声学模型


    ![](images/txt004_26.jpg "pagenumber_ebook=107,pagenumber_book=96")

    图4-23　语言模型


    ### 4.3.2 语音识别的一般过程


    比如把“人工智能”这四个字读音的波形图放大，如图4-24所示。由于太长，这里只截取显示了一部分。


    ![](images/txt004_27.jpg "pagenumber_ebook=107,pagenumber_book=96")

    图4-24　“人工智能”四个字读音的波形图片段


    在开始语音识别之前，需要将波形进行一些预处理。比如录音时的环境噪声、没说话时的空白静音等多余的信息，预处理就是要把这些信息剔除，方便接下来的特征提取等操作。得到预处理好的声音后，就可以开始声学特征提取了，如提取`MFCC`（梅尔频率倒谱系数）、`PLP`（感知线性预测）。


    不过在这之前我们先要知道，语言由单词组成、单词由音素组成。因此对音素的识别可以说是语音识别技术的关键。


    #### 知识拓展：音素


    世界上人类的语言有很多种，发音也各不相同，但无论哪种语言，都可以根据语音的自然属性划分成一个个最小的语音单位——音素。以汉语为例，“人工智能”四个字可以划分成`r,
    e, n, g, o, ng, zh, i, n, e, ng`这些音素。


    了解了什么是音素，接着我们来看语音识别的一般过程。


    **第一步**：对声音进行分帧，也就是把声音切分成一小段、一小段……每小段称为一帧（图4-25）。分帧的操作并不是简单地切开，而是按照一定的时间间隔，切割成彼此重叠的帧。


    **第二步**：通过声学模型，将这些帧识别成对应的语音状态，也就是用帧组成状态。这里所说的状态，可以理解成比音素更细致的语音单位。到底多少帧对应一个语音状态呢，由于每个人的音量、音调、音色都不同，因此，把帧识别成状态是语音识别技术中的一个难点。这里我们介绍一个简单的方法，就是通过训练好的声学模型去判定，看哪些帧对应某个状态的概率最大，那么这些帧就属于某个状态。


    **第三步**：用状态组成音素。一般用三个状态组合成一个音素（图4-26）。


    ![](images/txt004_28.jpg "pagenumber_ebook=108,pagenumber_book=97")

    图4-25　分帧的过程


    ![](images/txt004_29.jpg "pagenumber_ebook=108,pagenumber_book=97")

    图4-26　把帧识别成状态，用状态组成音素


    **第四步**：把音素组合成单词。在这个过程中，声学模型仍然非常重要，它能找到音素最可能的声学符号表达（如汉语拼音），结合发声词典，将声学符号与语言模型中最有可能的文字表达相对应，就能将声音转换成文字（图4-27）。


    综上所述，语音识别的一般过程如图4-28所示。


    ![](images/txt004_30.jpg "pagenumber_ebook=109,pagenumber_book=98")

    图4-27　把音素组合成单词


    ![](images/txt004_31.jpg "pagenumber_ebook=109,pagenumber_book=98")

    图4-28　语音识别的一般过程


    ### 4.3.3 声学模型的作用


    声学模型的主要作用就是把语音分成的帧识别成对应的状态，把状态组成音素，将音素对应到最有可能的声学符号表达（这里需要用到发声词典）。


    声学模型是怎么做到这些的呢？这个过程很复杂，可以简单理解为通过大量的语音数据来训练声学模型，从而更好地完成这些任务。


    训练声学模型的方法也有很多，传统的方法主要是采用`GMM-HMM`（混合高斯模型的隐马尔科夫模型），现在的方法则是使用`DNN-HMM`（深度神经网络的隐马尔科夫模型）。


    ### 4.3.4 发声词典的作用


    发声词典也叫发音字典，不同的语言有着不同的发声词典。例如汉语普通话的发声词典，里面写的是汉语拼音与汉字的对应情况，就像表4-3一样，而英语的发声词典里就是音标与单词的对应情况。还是以汉语普通话为例，发声词典的主要作用是根据声学模型识别出来的音素，找到对应的汉语拼音和相应的汉字（词），在声学模型和语言模型中间建立连接，把两者联系起来。


    表4-3　汉语普通话发声词典示例


    ![](images/txt004_32.jpg "pagenumber_ebook=110,pagenumber_book=99")


    #### 知识拓展：声音的频段


    人耳能接收到的声音频率在 `20 ~ 20000 Hz`，人们说话产生的语音频率在 `80 ~ 12000 Hz`。所谓频段就是按声音的频率分成几个区段，不同频段的声音给人们的感受也是不一样的。


    1. `20 ~ 60 Hz`。提升这一频段可以给人声音很响的感觉，让音乐强有力，但如果提升太多，会造成声音浑浊不清的感觉。

    2. `60 ~ 250 Hz`。这一频段是音乐的低频结构，它和中高音的比例构成了音色结构的平衡性。提升这一频段可以让声音感觉更丰满，但提升太多，则会发出隆隆声。

    3. `250 ~ 4000 Hz`。这一频段是大多数乐器的低频谐波，还影响着人的语音和乐器等声音的清晰度。人耳对这一频段比较敏感，所以一般不调节，否则容易产生失真等各种问题。

    4. `4000 ~ 5000 Hz`。这一频段影响着声音的距离感，提升这一频段会让人感觉与声音的来源更近；反之，则会让人感觉更远。

    5. `6000 ~ 16000 Hz`。这一频段影响着音色的洪亮度和清晰度，提升这一频段会让声音更加洪亮但不清晰；反之，则会让声音更加清晰但显得单薄。这一频段适合还原人的语音。


    #### 知识拓展：语音识别技术的三种分类


    - **按语音识别的连续与否进行分类**，可以分为孤立字词的识别和连续语音的识别。前者就是识别单独的一个个字或词，单字词的发音相对独立不受影响。后者就是对连续的语音进行识别，形成语句，一般需要发声词典，用来反映声学符号（如汉语拼音）和词之间的对应关系，还需要语言模型，用来反映词和词之间的正确关系。

    - **按距离麦克风的远近进行分类**，可以分为近场识别和远场识别。前者指的是说话的时候需要离麦克风比较近，这样才能被识别，手机、平板电脑中的智能语音助手都采用了近场语音识别。后者指的是说话的时候即使离麦克风很远，也一样能被识别，智能音箱使用的就是远场语音识别。

    - **按说话人的语音特征进行识别**，也就是我们常说的声纹识别。我们每个人的说话语音其实都有着不同的特征，就和手指指纹、眼睛虹膜一样，都具有独特性，可以用它们来识别讲话的人，作为身份验证的一种方法。


