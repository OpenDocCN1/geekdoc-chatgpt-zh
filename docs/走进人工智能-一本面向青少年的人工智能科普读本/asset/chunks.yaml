    ## 3.3.1 Object Detection


    When a computer faces an image, the most basic task is to recognize what is in
    the image. Is it a landscape or a person, a building or food? This is essentially
    image classification, which can be simply understood as tagging different images
    with corresponding labels. When the image category is known—for example, I know
    this image is about a dog and other objects—where is the dog located in the image?
    Can it be marked with a bounding box? Or when the image contains a pack of dogs,
    although the computer can recognize that the image contains dogs, it does not
    know how many dogs appear in the picture.


    At this point, further processing of the image is needed, i.e., object detection
    (Figure 3-34).


    ![](img/txt003_36.jpg "pagenumber_ebook=78,pagenumber_book=67")


    Figure 3-34　Object Detection


    Difference between image recognition and object detection: In image recognition,
    the entire image is classified into a single category and given a single label;
    in object detection, the computer needs to find the location and number of objects
    in the image and recognize what they are (Figure 3-35).


    ![](img/txt003_37.jpg "pagenumber_ebook=79,pagenumber_book=68")


    Figure 3-35　Object detection on the dog and doll image


    ### Object Detection Method 1: Traditional Object Detection


    Traditional object detection methods use manually designed feature operators to
    extract image features for object detection. Taking a single-scale object detection
    method as an example, a fixed-size detection window is used to scan the image
    from left to right and top to bottom. At each position, the image region within
    the window is fed into a classification detection algorithm. The classification
    algorithm then determines whether an object exists in this region; if so, it classifies
    the object. Once the object reaches or exceeds the threshold of a certain classification
    label, the detection window is marked and labeled with the classified category.
    Because computers process very fast, repeating this operation for all regions
    of the entire image can be completed quickly, yielding the final detection results.


    Of course, in practical applications, object detection methods are much more complex;
    certain simplifications have been made here for ease of understanding. However,
    this detection method has obvious shortcomings. For example, what size of detection
    window is appropriate? If the window is too large, the image within the detection
    region cannot be classified (Figure 3-36a); if too small, larger objects cannot
    be detected (Figure 3-36b). To optimize this method, many attempts have been made,
    which will not be elaborated on here.


    ![](img/txt003_38.jpg "pagenumber_ebook=79,pagenumber_book=68")


    Figure 3-36　Setting of the detection window


    ### Object Detection Method 2: Deep Learning-based Object Detection


    Deep learning-based object detection methods use image features learned from neural
    networks to perform object detection.


    Simply put, first, a selective search algorithm or similar region proposal method
    extracts hundreds or thousands of candidate bounding boxes of various sizes from
    the image to be detected. Then, the images within these candidate boxes are fed
    into a neural network respectively. Finally, based on the extracted image features,
    classification is performed to obtain category information and coordinate information
    corresponding to the original image, thereby achieving object detection and obtaining
    detection results (Figure 3-37).


    ![](img/txt003_39.jpg "pagenumber_ebook=80,pagenumber_book=69")


    Figure 3-37　Neural network-based object detection


    It can be seen from this that object detection, as a more refined task, is far
    more difficult to achieve than image classification.


    ## Knowledge Expansion: Cartesian Coordinate System


    In mathematics, there is a definition: in a plane, two perpendicular number lines
    with a common origin are drawn. The horizontal axis is the `x`-axis, and the vertical
    axis is the `y`-axis. This establishes a Cartesian coordinate system in the plane,
    referred to as the rectangular coordinate system.


    An ordered pair of numbers `(x, y)` can represent a point in the plane. In other
    words, a point in the plane can be represented by a set of two ordered numbers,
    which are the coordinates of this point in the coordinate system. If the coordinates
    of two points in the coordinate system are known, the length of the line segment
    between them can be calculated. Similarly, if the coordinates of three points
    are known, the area of the triangle formed by these three points can be calculated
    (Figure 3-38).


    ![](img/txt003_40.jpg "pagenumber_ebook=80,pagenumber_book=69")


    Figure 3-38　Cartesian Coordinate System


    ## 3.3.2 Object Tracking


    So far, we have learned about object detection in images. However, the images
    discussed above were static. In real life, more application scenarios require
    tracking objects in dynamic videos. For example, marking the object to be tracked
    in the first frame of a video, finding the same object in subsequent frames, and
    predicting the object''s position in the next frame—this is object tracking.


    Object tracking technology plays an important role in intelligent surveillance
    systems, autonomous driving, video retrieval, missile guidance, human-computer
    interaction, and industrial robots.


    How to achieve object tracking? There are many methods; we discuss the following
    two.


    ### Method 1: Frame-by-Frame Detection Tracking


    In the first frame of the video, the target to be tracked is set. Then, in each
    subsequent frame of the video sequence, the region with the highest similarity
    to the target is found. In other words, the features of the target in the first
    frame are extracted for learning, and then each subsequent frame is detected to
    determine the target''s position in every frame.


    ### Method 2: Inter-Frame Relationship-based Tracking


    Since the essence of object tracking is to train relevant algorithms based on
    the first frame''s data, the training data is inevitably very limited. To address
    this, a generic feature extraction model pre-trained on an image classification
    dataset can be used. During actual tracking, the pre-trained model is fine-tuned
    using the limited sample information of the current tracking target. Simply put,
    when searching for the tracking target in a video, the first search requires locating
    the target in the entire frame. But in the next frame, there is no need to search
    the entire frame; instead, one only needs to search near the location where the
    target appeared in the previous frame. Compared with frame-by-frame detection
    tracking algorithms, this method does not need to detect the full image every
    time; it only needs to scan around the previous detection box, improving detection
    efficiency.


    Currently, achieving real-time, accurate tracking under relatively complex conditions
    still faces many difficulties. The main challenges are as follows:


    1.  **Deformation**: When a moving object changes pose, its geometric features
    and appearance model may change, leading to tracking failure.

    2.  **Scale Variation**: When the tracking target shrinks, a lot of background
    information is included, causing errors in target model updates; when the target
    expands, the tracking range cannot fully cover the target, resulting in incomplete
    target information in the detection box, which also causes errors in target model
    updates.


    ![](img/txt003_41.jpg "pagenumber_ebook=82,pagenumber_book=71")


    Figure 3-39　Target occlusion


    3.  **Image Blur**: Reduced resolution, fast target motion, changes in light intensity,
    similarity between target and background, etc., can all cause image blur.

    4.  **Target Occlusion**: Object tracking requires not only detecting the target
    in each frame but also predicting the target''s position. This is because the
    target may be temporarily occluded or disappear; otherwise, failure to find the
    corresponding target model would lead to tracking failure. Therefore, when encountering
    such problems, the tracking algorithm needs to predict the most likely position
    where the target might appear (Figure 3-39).


