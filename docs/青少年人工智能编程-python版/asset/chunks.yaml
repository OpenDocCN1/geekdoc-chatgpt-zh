    = np.linspace（-1，1，data.shape[-1]）`生成75列的`x`坐标值；

    然后，用刷新函数`update（）`刷新一次，让`data`数组从左到右移动1列数据，并补充最左边1列数据，并把变化结果存储到`lines`列表对象里；

