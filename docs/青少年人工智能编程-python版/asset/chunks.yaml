    \ \"pagenumber_ebook=29,pagenumber_book=10\")\n\n图1.5　缩进格式\n\n上述都是初学者最容易出错的问题，需要读者谨记。\n\
    \n1.5　良好的编程习惯\n\n编写完成代码后，除了让计算机运行外，还需要提供良好的代码帮助阅读。\n\n这里主要通过注释说明、良好的命名方式，为代码阅读提供更好的帮助。\n\
    \n1.注释说明\n\n图1.2和图1.4中的代码，已经提供了代码注释说明，在代码开始部分“三酷猫的第一个程序”就是一个注释说明，它在代码运行时，并不被执行，仅供读者阅读理解。\n\
    \nPython语言提供了两种注释使用方法，如图1.6所示。\n\n![](images/txt002_9.jpg \"pagenumber_ebook=30,pagenumber_book=11\"\
    )\n\n图1.6　Python的两种注释使用方法\n\n1）多行注释说明\n\n在Python语言里用三引号表示多行的注释内容，如图1.6所示的第2行代码三引号，表示多行注释开始；第3行注释说明了编程开始时间，第4行说明编程作者，第5行说明编程地点，第6行三引号表示多行注释说明结束。该多行注释说明，在该代码被执行时，并没有运行输出任何内容，如图1.6右下所示，说明该部分代码仅用于读者的阅读理解。\n\
