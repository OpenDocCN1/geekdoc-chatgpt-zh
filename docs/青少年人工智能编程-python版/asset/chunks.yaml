    #### 2. 判断题

    （1）`numpy` 库支持创建一维、二维、三维、四维……的数组。（　）

    （2）`numpy` 库创建的数组元素不能通过下标方法进行修改。（　）

    （3）二维数组元素需要通过 `np.delete()` 函数进行删除，只能整列或整行删除。（　）

