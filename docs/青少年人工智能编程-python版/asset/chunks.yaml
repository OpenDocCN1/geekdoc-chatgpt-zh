    ### 1.4　编程中的红绿灯规则

    当然，1.3节的第一个程序，是三酷猫依样画葫芦输入，运气不错！现实中，一些初学者经常会碰到各种问题，如图1.4所示。第5行代码左边给出了一个红色叉号，意味着这行代码有问题。点击绿色三角形按钮，在右下角显示出错英文提示“`SyntaxError：EOL
    while scanning string literal`”，代码无法执行。

    ![](images/txt002_7.jpg "pagenumber_ebook=27,pagenumber_book=8")

    图1.4　代码出错

    说明

    建议读者见到一个出错英文单词，就记住一个，这样日积月累，编程的水平就会突飞猛进的。如认识了“`SyntaxError`”就知道是代码的语法出错了，应该查找代码的语法问题。

    从上述情况可以知道，`Python`编程，必须遵守一定编程的规则。

    `Python`编程规则如下。

    （1）大小写敏感，如图1.4所示。`print`和`Print`是两个不同的命令，第一个是正确的命令，所有字母都小写；第二个首字母P大写，意味着命令出错。

    （2）关键字的小括号、单引号，必须都用半角方式输入，不能用全角方式输入，图1.4中第5行代码在输入右小括号时，误用了全角方式，导致代码无法被执行，因此被给予出错英文提示。

    （3）若代码之间有逻辑关系，则`Python`通过缩进4个空格来进行逻辑区分，如图1.5所示，第4行与第5行代码之间通过缩进4个空格来区分它们之间的逻辑关系（`if`关键字的逻辑关系，详见第三章内容）；也可以采用一行代码结束，按回车键自动换行，接受默认的缩进空格；两种方式只能选择其一。

    （4）命名组成：在编程时，各种使用对象（如关键字、变量、函数等）名称只能由字母、数字、下划线组成——也就是只有小写字母a到z、大写字母A到Z、下划线`_`和数字0到9，才能被使用。注意，在命名时数字不能被放在名称首字符位置处，否则执行代码时编译器会报错。

    ![](images/txt002_8.jpg "pagenumber_ebook=29,pagenumber_book=10")

    图1.5　缩进格式

    上述都是初学者最容易出错的问题，需要读者谨记。


    ### 1.5　良好的编程习惯

    编写完成代码后，除了让计算机运行外，还需要提供良好的代码帮助阅读。

    这里主要通过注释说明、良好的命名方式，为代码阅读提供更好的帮助。

    1.注释说明

    图1.2和图1.4中的代码，已经提供了代码注释说明，在代码开始部分“三酷猫的第一个程序”就是一个注释说明，它在代码运行时，并不被执行，仅供读者阅读理解。

    `Python`语言提供了两种注释使用方法，如图1.6所示。

    ![](images/txt002_9.jpg "pagenumber_ebook=30,pagenumber_book=11")

    图1.6　`Python`的两种注释使用方法

    1）多行注释说明

    在`Python`语言里用三引号表示多行的注释内容，如图1.6所示的第2行代码三引号，表示多行注释开始；第3行注释说明了编程开始时间，第4行说明编程作者，第5行说明编程地点，第6行三引号表示多行注释说明结束。该多行注释说明，在该代码被执行时，并没有运行输出任何内容，如图1.6右下所示，说明该部分代码仅用于读者的阅读理解。

    2）单行注释说明

    另外一种常用的单行注释说明，用“`#`”开始来说明一行代码内容，如图1.6所示的第7行代码右边，“`#`”后内容并不被执行，而仅用于说明左边代码的含义。

    对于复杂的代码，读者一定要养成重点代码必须给予注释说明的良好习惯。

    2.良好的命名方式

    目前，编程界主推的代码命名规则有两种：驼峰命名规则、下划线命名规则。

    1）驼峰命名规则

    驼峰命名规则，就是对变量等进行命名时，采用英文单词首字母大写，其他字母小写的命名规则。如图1.7所示，第8行代码，变量`ThreeCoolCats`的三个英文单词`Three`、`Cool`、`Cats`的首字母都大写，其他字母小写，这样有利读者阅读理解，而第9、10行的变量命名则是“糟糕”的命名方式。

    ![](images/txt002_10.jpg "pagenumber_ebook=31,pagenumber_book=12")

    图1.7　命名规则

    2）下划线命名规则

    下划线命名规则，就是英文字母都为小写，英文单词之间用下划线隔离，如图1.7所示的第12行，这样主要为了方便读者阅读理解。


