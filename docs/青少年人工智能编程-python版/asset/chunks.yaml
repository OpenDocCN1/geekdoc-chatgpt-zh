    ## 后记


    几十年前，伟人邓小平以战略的眼光意识到新一代信息化革命即将到来，明确指出“学计算机要从娃娃抓起”。如今信息化已经渗透到各行各业，如电力、通信、建筑、航空航天、生物、教育、政府、制造业、农业、商业、考古等。可以说，现在的行业如果不跟信息化结合，则这个行业是落后的。由此，青少年朋友们提早了解智能编程，对自己的未来，多了一份思考，多了一种选择，有益于思维的拓展和兴趣的培养。


    20 世纪 90 年代初，作者在初一时翻到了邻居一位老大学生的计算机教材，上面介绍的大型机及“0”“1”二进制打卡式编程，给作者非常深刻的印象，促使作者喜欢上了计算机编程。从中学到大学，一路学来，不曾中断，提升编程技巧和能力。同时有了为青少年朋友们编写针对性很强的、有趣的智能编程一书的动力。


    阅读了这本书的朋友们，若能使自己对智能编程感兴趣，则写这本书的目的就已经达到。


    对于后续更进一步的智能编程的学习，除了少部分参加各种竞赛的读者，需要进一步进行针对性训练外；对大多数读者来说，建议在大学里进行更加深入的学习，以便进一步发挥智能编程的作用。当然，刘瑜老师也会继续深入研究后续相关教材，以尝试解决那些学有余力的中学生能够更好地在智能编程方向上发展。


