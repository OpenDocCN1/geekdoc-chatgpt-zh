    Python 语法、函数、数组，到制作二维图、动画、游戏，再到传统算法、图像算法、国内外竞赛知识，既能逐步提高读者通过编程解决问题的能力，又能让读者触碰智能编程在竞赛、科学研究、实际应用等方面的诱人前景；从教学角度，每章安排了练习和实验，并提供教学
    PPT 等资料，方便教师的教学使用要求。另外，本书对大数据、人工智能的基础知识做了启蒙式的潜移默化式的安排，如对数学、数据、算法的画龙点睛式安排。

    本书适合作为中学信息科技学科的教材，也适合作为各类信息化竞赛的入门教材，同时适合部分学有余力的五六年级小朋友学习，还适合大学非计算机类学生自学。


