    ### 7.2.5 正态分布曲线

    正态分布曲线^[1]（Normal Distribution Curve）反映了随机变量的分布规律。理论上的正态分布曲线是一条中间高、两端逐渐下降且完全对称的钟形曲线，如图7.10所示。在现实生活中，正态分布的现象很多，如学生考试成绩，大多数人总成绩居于钟形曲线的中间位置（分值居中），少数人总成绩居于钟形曲线的右边位置（分值较高），少数人总成绩居于钟形曲线的左边位置（分值较低）；又如吃饭速度，少数人吃饭很快，大多数人吃饭速度一般，少数人吃饭速度很慢。

    ![](images/txt008_25.jpg "pagenumber_ebook=186,pagenumber_book=167")

    图7.10　正态分布曲线图（均值）

    正态分布是高中时的数学知识，数学上对正态分布的定义^[2]为：正态分布是一种概率分布，正态分布是具有两个参数`μ`和`σ2`的连续型随机变量的分布，第一个参数`μ`是遵从正态分布的随机变量的均值，第二个参数`σ2`是此随机变量的标准差。

    `μ`读作miu（发音：谬），是正态分布的位置参数，描述正态分布的集中趋势位置。概率规律为：取与`μ`越近的值的概率越大，而取离`μ`越远的值的概率越小。正态分布以`x=μ`为对称轴，左右完全对称。正态分布的期望、均数、中位数、众数相同，均等于`μ`。

    `σ`读作sigma（发音：西格玛），描述正态分布中数据分布的离散程度，`σ`越大，数据分布越分散；`σ`越小，数据分布越集中。`σ`也称为正态分布的形状参数，`σ`越大，曲线越扁平；反之，`σ`越小，曲线越瘦高。

    正态分布数学公式为

    ![](images/txt008_26.jpg "pagenumber_ebook=187,pagenumber_book=168")

    式（7.1）的`exp`为自然常数`e`^[3]，在`numpy`库里可以用`np.e`表示。

    利用`matplotlib`绘制式（7.1）的正态分布曲线，其代码如下：

    代码文件：`7_2_5_Normal.py`

    ![](images/txt008_27.jpg "pagenumber_ebook=187,pagenumber_book=168")

    ![](images/txt008_28.jpg "pagenumber_ebook=188,pagenumber_book=169")

    ![](images/txt008_29.jpg "pagenumber_ebook=189,pagenumber_book=170")

    执行上述代码，绘制的正态分布曲线如图7.10所示。

    说明

    在实际样本数据统计情况下，事先需要计算出`μ`、`σ`的值，再求正态分布曲线。本案例直接给定了`μ=50`，`σ=12`，样本数为0到100，求其在68.26%、95.45%、99.73%三个概率区间的分布情况。

