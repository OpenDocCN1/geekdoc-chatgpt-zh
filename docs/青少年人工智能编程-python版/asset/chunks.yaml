    \n4.4.1　跳出循环\n\n在循环过程，若已经满足某个条件了，则可以通过break语句跳出循环，以减少无效循环过程。\n\n如想在水果字典里，通过for语句循环查找梨，找到梨后，就可以马上通过break语句终止循环，示例如下：\n\
