    ## 6.3.2 `numpy` 库的随机函数

    在实际测试数据不可获取的情况下，通过 `numpy` 库提供的各种随机函数，可以产生各种模拟样本数据，为数据绘图、研究及学习提供方便。


    ### 1. 随机均匀小数函数

    用 `np.random.rand()` 函数创建值范围为 `0，1)` 的均匀分布小数，并以数组形式返回。

    ![![](img/txt007_62.jpg "pagenumber_ebook=152,pagenumber_book=133")


    ### 2. 随机整数函数

    用 `np.random.randint(low, high, shape)` 函数产生数值范围为 `low，high)`，维数由 `shape` 指定的随机整数数组或一个随机整数。其中
    `low` 不小于 0；`high` 可以省略；`shape` 以元组形式指定维度，可以省略。

    ![### 3. 标准正态分布样本数值函数用 `np.random.randn()` 函数产生值分布为随机正态分布的样本数组，值范围含正负浮点数。这里的正态分布概念及几何意义，详见
