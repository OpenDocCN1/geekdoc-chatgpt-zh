    \n实验\n\n1.实验一\n\n编写自己的第一个程序，要求如下：\n\n（1）说明编程人员的姓名、编写时间、编写地址、年龄、性别；\n\n（2）打印输出自己的姓名，分别用英文、中文输出；\n\
    \n（3）打印输出“\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_”；\n\n（4）把代码保存为MyFirstCode.py文件。\n\n2.实验二\n\n编写自己的第二个程序，打印输出如下的三角形旗帜：\n\
    \n![](images/txt002_11.jpg \"pagenumber_ebook=33,pagenumber_book=14\")\n\n\uFEFF\
    \n\n第二章　智能计算基础\n\n![](images/txt003_1.jpg \"pagenumber_ebook=34,pagenumber_book=15\"\
    )\n\n从第二章开始，正式学习Python的最基础的知识，包括变量、四则运算、求余、取整、赋值、求幂、求次方根、取近似值、求随机数、求两点间距离、三角函数、逻辑比较、字符串处理等。\n\
    \n2.1　用变量记录数据\n\nPython代码需要记录各种数据：\n\n（1）整数（Integer）是指数学里的整数，如-2、-1、0、1、2、3；\n\
    \n（2）浮点数（Float）是指带小数位的数值，如0.1、100.2、0.89；\n\n（3）字符串（String），是指用单引号括起来（如'TomCat'\
    \ '我是中国人' '88888888'）；或用双引号括起来（\"OK\" \"2388888\"）；或用三引号括起来（'''China''' '''123456'''）的字符串；\n\
    \n（4）逻辑值（Logical），其值为True（真）或False（假）；其中0、None也可以代表False。\n\n上述内容需要在内存里开辟临时地址空间，用于存储其对应值，方便后续计算。在内存里临时开辟地址空间存储数据，并给出一个易于阅读名称的对象称为变量（Variable）。变量根据赋值的不同，自动区分整数、浮点数、字符串、逻辑等类型变量。\n\
    \n![](images/txt003_2.jpg \"pagenumber_ebook=35,pagenumber_book=16\")\n\n图2.1　在内存里运行的各种变量\n\
    \n图2.1模拟了计算机里的内存，所有的变量只能通过内存进行数据读写操作，由此，需要为每个变量开辟一个独一无二的内存地址，临时保存变量的值。\n\n这好比是数学老师，必须在黑板上写出一个个数字，才能为大家计算各种数值。这个内存就是黑板，为了计算机运算方便，给每个变量自动赋予一个唯一的临时地址。\n\
    \n图2.2所示的为Python语言实现的整数、字符串、浮点数、逻辑类型的变量对象，其对应各自的变量值，在代码编辑器里点击绿色三角形按钮，这些变量在内存指定的地址里运行。\n\
    \n说明\n\n读者们，从现在开始要学会根据书上的代码，进行模仿编写，以熟悉代码内容。\n\n编写前需要打开Spyder代码编辑器，也可以使用Python自带IDE代码编辑器，或其他相关编辑工具。\n\
    \n![](images/txt003_3.jpg \"pagenumber_ebook=36,pagenumber_book=17\")\n\n图2.2　不同变量的代码编写\n\
    \n变量值的变化，会导致其在内存里重新获得新的地址。这意味着每次赋值，同一个名称的变量，实际上在内存里重新生成一次。其地址变化过程如图2.3所示。首先给变量i赋值5，然后用Python自带的取地址函数id（　）获取变量i的地址263353584；然后给变量i赋新值10，再用id（　）获取变量i地址，发现变量为263353664，显然同一个变量i经过两次赋值后的内存地址变化了。\n\
    \n![](images/txt003_4.jpg \"pagenumber_ebook=36,pagenumber_book=17\")\n\n图2.3　获取变量地址\n\
    \n2.2　简易运算（一）\n\n数学里最基础的加减乘除四则运算，可以通过编程，在计算机里自动计算。那些复杂的数学计算，计算机也可以轻而易举地替代人的大脑，进行运算解答。\n\
    \n2.2.1　基本四则运算　\n\n数学里的四则运算符是“+、-、×、÷”，在计算机里其对应的四则运算符为“+、-、\\*、/”。这里加减符一致，乘除符有点区别，但是使用方法一样。\n\
    \n图2.4所示的交互式命令执行区，依次执行如下命令，并显示对应计算结果。\n\n![](images/txt003_5.jpg \"pagenumber_ebook=37,pagenumber_book=18\"\
    )\n\n![](images/txt003_6.jpg \"pagenumber_ebook=38,pagenumber_book=19\")\n\n图2.4　交互式执行加减乘除命令\n\
    \n2.2.2　四则混合运算\n\n根据数学知识可知，加减乘除四则混合运算是有优先级的，而且可以通过小括号调整优先级。\n\n![](images/txt003_7.jpg\
    \ \"pagenumber_ebook=38,pagenumber_book=19\")\n\n上述小括号及加减乘除运算的优先级，跟小学数学里的一模一样。唯一不同点，除法结果都为浮点数。\n\
    \n2.2.3　求余、取整\n\n当被除数与除数相除时，存在除不尽的问题，于是想知道余数还剩多少。Python的%运算符用于求余，另外//运算符用于获取除法的商的整数部分。\n\
    \n![](images/txt003_8.jpg \"pagenumber_ebook=39,pagenumber_book=20\")\n\n2.2.4　赋值运算\n\
    \n在数学里通过“=”实现数学公式的等价表示，或实现值的计算过程等价表示。在Python语言里通过“=”符号实现变量的赋值，示例如下：\n\n![](images/txt003_9.jpg\
    \ \"pagenumber_ebook=39,pagenumber_book=20\")\n\nPython支持传统数学要求的赋值表达方式，示例如下：\n\
    \n![](images/txt003_10.jpg \"pagenumber_ebook=39,pagenumber_book=20\")\n\n![](images/txt003_11.jpg\
    \ \"pagenumber_ebook=40,pagenumber_book=21\")\n\n上述的加减乘除都涉及了num、i、j三个变量的运算，但是为了提高内存空间的使用效率，Python提供了另外一类增量赋值表达式，如j+=i、j-=i、j\\\
    *=i、j/=i，其实现效果同①、②、③、④，只不过都省略了变量num，把结果直接存储到变量j中，这样可以节省内存空间，并提高运算速度。具体使用方法示例如下：\n\
    \n![](images/txt003_12.jpg \"pagenumber_ebook=40,pagenumber_book=21\")\n\n上述过程，j+=i计算结果等价于num=j+i，其计算结果输出为30，j值变为30，i值仍为10不变。继续在上述基础上，执行j-=i，其结果如下：\n\
    \n![](images/txt003_13.jpg \"pagenumber_ebook=40,pagenumber_book=21\")\n\n继续执行j\\\
    *=i，其结果如下：\n\n![](images/txt003_14.jpg \"pagenumber_ebook=40,pagenumber_book=21\"\
    )\n\n继续执行j/=i，其结果如下：\n\n![](images/txt003_15.jpg \"pagenumber_ebook=40,pagenumber_book=21\"\
    )\n\n![](images/txt003_16.jpg \"pagenumber_ebook=41,pagenumber_book=22\")\n\n\
    传统运算方式：借助num存储计算结果，而j、i值都不变的区别；增量赋值少了变量num，并利用j存储计算结果——也就是j值随着计算持续在变化。显然，两种计算结果存在不一致问题。\n\
    \n说明\n\n传统运算和增量赋值运算，都需要读者熟练使用。\n\n2.3　简易运算（二）\n\n计算机具备做小学数学题目的能力，自然也具备做中学数学题目的能力。\n\
    \n2.3.1　求幂、次方根\n\n求幂、n次方根是初中的基础知识之一。\n\n1.求幂\n\n求幂，就是求x的n次方的过程。在Python里用x\\*\\\
    *n表达式来实现求幂，其中x是底数，n是次数，\\*\\*是求幂运算符。\n\n![](images/txt003_17.jpg \"pagenumber_ebook=41,pagenumber_book=22\"\
    )\n\n![](images/txt003_18.jpg \"pagenumber_ebook=42,pagenumber_book=23\")\n\n\
    2.求n次方根\n\n在Python里求n次方根，可以有三种方法：\n\n1）用math自带的sqrt（　）函数求平方根\n\n在Python里求平方根可以使用自带的math数学库里的函数sqrt（　），示例如下：\n\
    \n![](images/txt003_19.jpg \"pagenumber_ebook=42,pagenumber_book=23\")\n\n2）用pow（　）函数求n次方根\n\
    \n示例如下：\n\n![](images/txt003_20.jpg \"pagenumber_ebook=42,pagenumber_book=23\"\
    )\n\n最后一个出现近似答案，是因为在pow（　）函数里，优先计算1/3并得到一个0.333…的近似指数值，最后这个近似指数值用于pow（　）求根，得到一个近似的根。\n\
