    # 第一篇　从零开始

    从零开始，意味着读者可以是从来没有接触过编程的新手。本篇以接近于手把手的方式，带领读者从零开始学习Python编程。

    这里提供几个学编程的基本技能：

    （1）每天编写代码半个小时，日积月累；

    （2）为了巩固验证自己对知识所掌握程度，完成各章后的练习和实验；

    （3）网络是一个万能的“编程老师”，碰到问题多在网上搜索，以寻求最佳答案；

    （4）多接触“大牛们”编写的代码，你的水平会得到提升。


    ## 第一章　编程准备工作

    ![](images/txt002_1.jpg "pagenumber_ebook=22,pagenumber_book=3")

    第一章是为从未接触过编程的朋友们所准备的，通过对最基础知识的介绍，让读者对编程有个初步印象，并带领读者开始一步步深入了解编程。


    ### 1.1　从计算机到人工智能

    人类是勤劳和智慧的，自进入文明社会开始，人类一直在发明新的工具，以替代人类更好地工作。如原始社会的弓箭、石斧，奴隶社会的青铜器，封建社会的铁制农具，工业社会的机器等。1946年世界上第一台可编程电子计算机（`Computer`）诞生了，其只认识“0”“1”数值，“0”和“1”的不同组合代表了人类可以识别的不同的数字、语言、图像等符号，如“0011
    0001”代表ASCⅡ码的字符“1”，“0011 0010”代表ASCⅡ码的字符“2”等，这些8位的二进制编码被称为计算机可以直接识别的机器码。这个机器码是最低级的编程语言（`Programming
    Language`），目前全世界能熟练使用它的人非常少。

    自然，人们还是喜欢用容易理解的符号来编程，如用英文来编程，只要熟悉基本的英语单词，那么无论是阅读代码还是编写代码，人们会感觉比较轻松。不过计算机不能直接识别并执行这些人类可以直接阅读的高级语言，需要通过中间工具把它们转换为机器语言，才能被执行。这个中间工具就是编译器或解释器。编译器是把所编写的代码一次性翻译成机器码，这种方式需要耗费编译时间，但执行速度快；解释器好比是现场翻译员，写一行代码，翻译并执行一行代码。这种带有中间翻译功能的对人类阅读友好的编程语言被称为高级编程语言。图1.1所示的为高级编程语言转换为机器语言并被执行的过程。

    ![](images/txt002_2.jpg "pagenumber_ebook=23,pagenumber_book=4")

    图1.1　高级编程语言转换为机器语言并被执行的过程

    目前，世界范围最流行的高级编程语言包括`Python`、`C`、`C++`、`Java`等。本书选择最容易学习而且使用范围最广，可以跟大数据、人工智能直接接触的编程语言——`Python`语言，作为本书的主要学习内容。

    1950年10月，英国人图灵指出：如果第三者无法辨别人类和机器反应的差别，则可以认为该机器具有人工智能（`Artificial Intelligence`，`AI`）。由此可以认为，如果计算机通过编程，能代替人类做加减乘除运算，能判断事务的真假，能进行数学统计，能识别声音、图像等，则这样的计算机就是智能的。


    ### 1.2　编程工具准备

    计算机编程的核心技巧就是多编写代码，代码编写多了至少能熟悉相关代码的使用。三酷猫第一次接触编程代码时，感觉哪里都是“外星人”，哪个代码都是古怪的，原因是其面对的是很多陌生的知识。在经过3个月持续不断编写代码之后，三酷猫总算“开窍”了，能独立编写需要功能的代码了，这就解决了编程入门的问题了。那么要编写并执行代码，需要准备什么呢？

    （1）一台计算机，可以是实验室的，也可以是家用的。

    （2）一款编程的软件，这里采用`Anaconda`软件安装包，使用其提供的`Spyder`代码编辑器来实现本书的学习。`Anaconda`是世界上最优秀的科学计算包之一，被广大科学家、工程师、高校师生所使用。其以`Python`语言为基础，支持大数据分析、科学计算、人工智能等编程功能——实质上其包含了最新8000多个各种功能库，如本书将要用到的科学计算库`numpy`、图形图像处理库`matplotlib`等，当然也包含了编程工具`Spyder`、`Python`。

    `Anaconda`安装包的下载及安装过程请参考附录A，本书主要基于`Win7`环境下安装，所以选择了32位2020年的11版。

