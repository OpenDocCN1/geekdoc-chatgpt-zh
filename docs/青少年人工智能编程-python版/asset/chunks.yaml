    “函数体”就是实现函数功能的代码，是函数魔盒功能的关键所在！


    函数最后用关键字`return`返回“返回值”，由于是中括号，返回值可以没有。


    注意


    自定义函数名不能与 Python 自带函数名发生冲突。如不能命名为`del`，否则调用时报错！


