    10.2.4　穷举查找


    当查找的答案不确定时，其中一个比较简单的算法就是穷举法（Method of Exhaustion），通过某种方式列举所有答案的过程。常见的列举方法有顺序列举、排列列举、组合列举三种。如10.2.1节的线性查找，就是顺序列举，其是穷举查找的一种；排列列举是答案的值之间有顺序关系，如x、y和y、x属于顺序不一致的两种答案；而组合列举是答案的值之间没有顺序关系，如x、y和y、x属于同一个答案。


