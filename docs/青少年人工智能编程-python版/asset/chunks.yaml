    10.4　贪心算法


    贪心算法（Greedy Algorithm）又称为贪婪算法，是指在对问题求解时，总是做出在当前步骤看来是最好的选择。该算法仅考虑局部最优，而10.5节的动态规划则考虑全局最优。


    贪心算法的特点：


    （1）仅考虑当前步骤最优值，与前面状态无关；


    （2）最优值即每次求最大或最小值；


    （3）可以把一个问题分解为若干个子问题并对其求解，同时对所有子问题的解求和，得到最终局部最优值。


    10.4.1　分数背包问题


    我们常说的背包问题主要分为以下几种：分数背包、0-1背包、完全背包、多重背包、分布背包等。


    其中分数背包，用贪心算法求可装入最大价值总物品，当装入物品体积不够时，可通过切割其最后一个物品来实现。对于装入背包物品的最大价值的判断，可以优先放入单位体积价值大的物品，也可以优先放入价格高的物品，或优先放入体积最小（或最大）的物品。由此，用贪心算法得到的背包最优解只能是局部的，不一定是全局最优解。


