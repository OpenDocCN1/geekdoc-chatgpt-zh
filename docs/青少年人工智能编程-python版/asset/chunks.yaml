    ![](img/txt003_16.jpg "pagenumber_ebook=41,pagenumber_book=22")


    传统运算方式：借助`num`存储计算结果，而`j`、`i`值都不变的区别；增量赋值少了变量`num`，并利用`j`存储计算结果——也就是`j`值随着计算持续在变化。显然，两种计算结果存在不一致问题。


