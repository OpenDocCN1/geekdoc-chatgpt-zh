    10.3.4　快速排序


    快速排序（Quick Sort）是对冒泡排序的一种改进，由C.A.R Hoare在1962年提出。它的基本思想是：通过一趟排序将要排序的数据分割成独立的两部分，其中一部分的所有数据比另外一部分的所有数据都要小，然后再按此方法对这两部分数据分别进行快速排序，整个排序过程可以递归进行，以此达到整个数据变成有序序列。


    分割时，先选择一个元素，作为大小比较的基准（Pivot）数。把数列里小于Pivot数的元素放到前面，大于Pivot数的元素放到后面。这个基准数可以随意取一个，一般取开始、结束或中间位置的一个元素。


