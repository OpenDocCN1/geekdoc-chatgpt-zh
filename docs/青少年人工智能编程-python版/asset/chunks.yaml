    \n代码中print是Python自带的保留关键字，用于把其括号内的内容，输出到计算机屏幕上。\n\nprint的基本使用格式举例，如图1.3所示，在交互式代码执行区输入一行打印功能代码，回车后执行该代码，显示执行结果。\n\
    \n![](images/txt002_6.jpg \"pagenumber_ebook=26,pagenumber_book=7\")\n\n图1.3　print常用使用举例\n\
    \n打印输出print关键字常用使用方法说明如下：\n\n（1）单个输出如图1.2所示，print（'Hello！'）输出一个字符串；\n\n（2）多个输出如图1.3所示，print（1，'OK'），先输出一个数字1，然后继续输出字符串OK，显然可以连续输出更多，只要中间用逗号隔离即可；\n\
    \n（3）使用格式符号，如图1.3所示，print（'%i只%s是%f元。'%（5，'猫'，2000.5）），左边'%i只%s是%f元。'里的%i、%s和%f都为格式符号，右边（5，'猫'，2000.5）为左边格式符号对应的需要输出的值：5、'猫'和2000.5；其中%i为输出整数格式符号，对应5的输出；%s为字符串格式符号，对应字符串'猫'的输出；%f为浮点数格式符号，对应浮点数2000.5的输出；该输出结果为“5只猫是2000.5元。”，该结果显然进行了格式控制，格式符号起了作用。\n\
