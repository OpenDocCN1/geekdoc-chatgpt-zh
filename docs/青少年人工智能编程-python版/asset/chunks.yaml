    数组自带的 `max()` 方法用于获取最大元素。当指定参数 `axis`，值为 0 时，求每列的最大值；值为 1 时，求每行的最大值。

    ![](images/txt007_70.jpg "pagenumber_ebook=156,pagenumber_book=137")


