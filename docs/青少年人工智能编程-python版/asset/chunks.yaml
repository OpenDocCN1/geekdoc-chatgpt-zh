    ## 10.2.3 哈希查找


    哈希查找（Hash Search）算法通过哈希地址函数实现对存储结构里的每个元素赋予唯一地址值的方法来实现哈希表的构建，并通过元素与地址的一一对应关系进行查找。该算法查找速度很快，缺点是需要存储元素对应的地址。


    哈希地址函数最常用的可以采用取余数方式来实现，其公式为`元素 % n`（求余），其中`n`为元素个数。


    用Python语言实现哈希查找算法，主要分三步进行：


    第一步，用给定的哈希函数求每个元素对应的哈希地址，本书采用取余数求地址方法，并作为键，而对应元素作为值，存储到字典里——构建对应的哈希表；


    第二步，若哈希地址发生冲突——出现重复地址现象，则可以通过地址增1方式试探性解决问题；


    第三步，在哈希表里通过哈希地址查找对应的元素。


