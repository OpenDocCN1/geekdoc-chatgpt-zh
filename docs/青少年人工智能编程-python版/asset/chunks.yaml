    ### 2.递归原理说明


    以上例求 1 到 5 的累加和为例，其在内存里一步步开辟临时存储过程，记录每次递归调用过程；最后满足递归返回条件`x==1`时，通过`return`往回返回值，其过程如图
    5.3 所示。


    ![](img/txt006_37.jpg "pagenumber_ebook=112,pagenumber_book=93")


    图 5.3　1 到 5 递归累加过程


    从图 5.3 可以看出，递归算法分两个步骤实现。


    第一步骤，递归调用自己，并在内存依次开辟每个调用的临时存储空间，用于记录每次递归调用的过程状态；图 5.3 体现为左边从上到下，一步步开辟存储空间。


    第二步骤，递归返回值，图 5.3 体现为右边从下往上的一个个气泡里的数值。如最右下角的 1 返回到第四次递归调用的`Add1(1)`处，则得到`2+1=3`后继续往上返回。


    注意


    递归过程，需要在内存临时开辟内存空间，用于记录过程状态，当递归次数变大时，很容易消耗大量的内存空间，引起内存空间不足等问题，所以递归次数需要合理控制。


