    ## 前言

    刘瑜老师的 Python 系列畅销书在网上平台销售，一直受到广大读者的追捧。这里尤其令人感动的是不少中学生甚至小学生都在使用这些书籍，参与书群的讨论，并给予好评。但是，这些书的编写初衷都是为本科生、研究生、IT
    工程师而设计的，对青少年朋友的学习，显然其针对性不够，也不够友好。出于上述原因，刘瑜老师一直在策划专门面向青少年朋友的 Python 编程书籍。在这期间，也借着编写相关
    Python 书籍的契机，结交了专门从事中小学竞赛培训、中小学信息科技教育的老师们，以及大学信息化竞赛培训的老师们。他们有的已经在为当地教育系统编写了中小学教材，有的正在思考出版更加有趣、有针对性、普及性的
    Python 教材；有的已经培养出了很多编程爱好者，并有部分学生获得了奖项。他们的想法与刘瑜老师的想法不谋而合，市场上缺少一本高水平的面向中小学的编程教材。他们对本书一起做了如下规划。


    ### 1. 内容定位

    经过 20 多位老师们集思广益，本书的内容定位如下。


    #### 1）突出编程的趣味性

    兴趣是最好的老师，学习内容在贯彻智能编程知识的同时，能兼顾一定的趣味性，能引起读者的持续好奇，能吸引读者挑战智能编程实际应用，这本身是一件愉快的事情。本书在内容安排上，突出让青少年朋友亲自动手解决图像处理等实际问题，让青少年朋友体验科学家所做的事情。


    #### 2）通俗易懂，容易操作

    考虑到本书面对的是从 12 岁到 20 岁的大跨度的读者年龄范围，所以在内容安排上，尽量由简入难，让初步接触编程的读者，包括小学高年级的读者都能接受。另外，考虑读者群的主要学习目的不是将其应用于工作，而是锻炼逻辑思维、参加竞赛、培养编程兴趣、探索人工智能知识，所以本书去掉了一些工程方面的技术内容，如
    Web、数据库、面向对象等。


    #### 3）深度考虑读者的知识背景

    这本书编写之初，就考虑到了主要读者的背景知识，如小学、初中、高中读者所具有的数学、英语等知识基础，使各层次的读者能较好掌握相关知识点。全书高中相关数学知识，涉及面不到
    5%；主体以小学、初中数学知识为主。英语主要涉及专业术语的英语表述，便于培养读者逐步积累专用术语英语知识的习惯，有利于读者长远发展。要知道“高手”编写的代码都使用的是英语语法逻辑，“高手”也来自全球各地，他们提供的资料主要都是基于英语的。


    #### 4）兼顾各类竞赛入门要求

    本书设计内容的一个主线条，就是提供竞赛必要的基础编程知识，如基本的语法、函数、算法。


    ### 2. 内容安排

    根据读者的知识接受规律和对其培养目的，本书的内容分为三篇：第一篇从零开始；第二篇快乐挑战；第三篇高级挑战。

    第一篇，着重解决以 Python 语言为主的编程基础问题，相关内容涉及编程入门，利用代码进行基本的四则运算等计算，掌握对数据存储结构的使用，掌握逻辑判断和循环处理，编写和使用函数，利用多维数组处理数据，通过数学思维绘制美妙的线条。

    第二篇，着重利用动画技术、游戏技术，自行制作会动的、具有挑战意义的小作品，它们的背后都是数学、数据和编程技巧。

    第三篇，着重考虑竞赛要求，以传统算法、图像算法为基础，了解竞赛题目的难易程度，了解人工智能技术的基础要求，并介绍了国内外具有典型代表意义的信息化竞赛，让读者轻松了解竞赛基本要求。


    ### 3. 配套学习帮助

    1）本书主要章节提供了练习和实验，有利于读者对知识加以巩固和运用，并提供配套的电子版的答案；

    2）由薛桂香老师提供免费教学短视频，方便读者更加容易地学习；

    3）提供 QQ 群（QQ 群号：680958585），以便读者与作者沟通交流。


    ### 4. 读者学习导入提示

    对于自学的读者，先需要根据附录 A 安装 Anaconda 软件包，然后根据附录 B 学会 Spyder 代码编辑工具的基本操作。没有深入接触过计算机的读者，则需要先学会操作系统的基本使用方法，学会基本的中英文输入操作。

    本书在策划编写过程中，得到了全国范围不少小学、中学、大学老师的关注和支持，在此一并感谢！

    由于受时间等的约束，书中避免不了存在一些瑕疵，请读者多提宝贵意见，作者尤为感谢！所提问题，可以在 QQ 群里反馈。

    作者

    2022 年冬，于天津


