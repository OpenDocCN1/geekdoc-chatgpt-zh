    \n![](images/txt006_34.jpg \"pagenumber_ebook=111,pagenumber_book=92\")\n\n5.2.6　递归函数\n\
    \n递归函数（Recursive Function），利用函数自己调用自己的过程，解决一类需要重复处理问题的一种代码算法。理论上所有的循环操作都可以通过递归函数来实现。\n\
    \n1.求1到5累加和的递归\n\n求1到5累加和，通过递归函数来实现，其代码如下：\n\n代码文件：5\\_2\\_6\\_Recursion.py\n\n\
    ![](images/txt006_35.jpg \"pagenumber_ebook=112,pagenumber_book=93\")\n\n上述代码执行结果如下：\n\
    \n![](images/txt006_36.jpg \"pagenumber_ebook=112,pagenumber_book=93\")\n\n2.递归原理说明\n\
    \n以上例求1到5的累加和为例，其在内存里一步步开辟临时存储过程，记录每次递归调用过程；最后满足递归返回条件x==1时，通过return往回返回值，其过程如图5.3所示。\n\
    \n![](images/txt006_37.jpg \"pagenumber_ebook=112,pagenumber_book=93\")\n\n图5.3　1到5递归累加过程\n\
    \n从图5.3可以看出，递归算法分两个步骤实现。\n\n第一步骤，递归调用自己，并在内存依次开辟每个调用的临时存储空间，用于记录每次递归调用的过程状态；图5.3体现为左边从上到下，一步步开辟存储空间。\n\
