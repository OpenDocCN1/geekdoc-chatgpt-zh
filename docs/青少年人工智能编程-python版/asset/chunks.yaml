    ## 9.4　[案例]旋转的飞镖


    游戏与动画的区别，人可以参与游戏操作，并能判断竞赛结果（谁赢谁输）。


    ### 9.4.1　游戏设计


    这里想绘制一个方块飞镖，当人连续点击鼠标时，方块飞镖会加速变大；若方块飞镖的一个角跟随机横向出现的顶板碰撞，则游戏结束，看哪位玩家用最少的时间结束游戏。


    （1）用由小到大旋转的方块代表飞镖，且颜色会变；


    （2）用顶板作为飞镖的碰撞目标，但是每次顶板出现的`x`坐标位置是随机的；


    （3）玩家可以连续点击鼠标，可以让飞镖的面积加速变大；


    （4）当飞镖的顶角碰撞顶板时，游戏结束；


    （5）游戏启动时计时开始，游戏结束时计时结束，并给出玩游戏的时间；


