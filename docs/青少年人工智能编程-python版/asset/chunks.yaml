    10.3.1　选择排序


    选择排序（Selection Sort）是指从待排序的数据元素里选一个最小（或最大）的元素放到序列最前面，然后再从未排序数据元素里选择下一个最小（或最大）的元素放到序列次前面，依次类推，一直使所有元素都完成选择，就实现了有序排序。


    如图10.4所示，根据选择排序的实现原理，从头到尾每轮选择最小元素，把它放到左边第一的位置，其实现过程举例如下：


    第一轮选择2，把它放到左边第一的位置；


    第二轮选择7，把它放到左边第二的位置；


    依次类推，一直到所有的元素都被选择完成为止。


