    ## 10.2　查找


    查找（Find）在人工智能里是一种问题求解的方法，可以通过不同的查找算法获得问题解决的答案。


    ### 10.2.1　线性查找


    线性查找（Line Search）是从头到尾依次比较查找指定值，一直比较到找到或查找到结尾没有找到值为止。如图10.2所示，假设需要查找“三酷猫”，则需要从左到右比较4次，才能找到对应的值。


    ![](images/txt013_8.jpg "pagenumber_ebook=255,pagenumber_book=236")


    图10.2　线性查找算法


    用列表实现图10.2值的记录，然后，通过循环比较，就可以轻松实现线性查找算法。


    代码文件：`10_2_1_LineFind.py`


    ![](images/txt013_9.jpg "pagenumber_ebook=256,pagenumber_book=237")


    执行结果如下：


    ![](images/txt013_10.jpg "pagenumber_ebook=256,pagenumber_book=237")


    线性查找算法的优点：算法简单、元素之间无须排序即可查找。


    线性查找算法的缺点：若需要查找的值在列表尾部，从头到尾查找，则需要查找比较所有的元素，算法效率会很低。


    ### 10.2.2　二分查找


    二分查找（Binary Search）算法也称为折半查找算法，把一个有序数列分割为两半，查找值跟中间值比较：若找到，则结束查找；否则，将区间范围缩小到左边区间或右边区间，再对其进行折半查找比较，直到找到对应的值或区间范围缩小到0，查找结束。其实现过程如图10.3所示。


    ![](images/txt013_11.jpg "pagenumber_ebook=257,pagenumber_book=238")


    图10.3　二分查找算法


    如图10.3所示，第一次折半比较区间的左右边界下标为`left=0`、`right=6`，折半中间下标为`mid=(6-0)/2=3`，下标对应的值为10，需要查找的26大于10，因此需要查找的区间在右边；


    第二次折半比较，左右边界下标为`left=mid+1=4`，`right=6`，求中间下标`mid=(6-4)/2+4=5`，该下标对应的值为26，满足查找需要，查找结束。


