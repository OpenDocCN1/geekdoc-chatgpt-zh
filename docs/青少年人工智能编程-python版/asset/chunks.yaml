    人们喜欢把一类物品放在一起，如把一堆鸡蛋放到同样大小的包装箱里，这样方便统计数量、金额，也方便运输和销售。对于数据的编程也是类似的，Python语言提供了列表、元组、字典、集合，为不同的数字、字符串等提供了对应的存储模式，方便对数据的各种处理。


    ## 3.1 列表


    列表（`List`）是Python语言显著区别于其他语言的一种数据结构，其设计更加灵活，可以弥补字符串本身的各种缺陷。


    ### 3.1.1 列表表示


    列表用中括号（`[]`）表示列表的开始和结束，元素之间用逗号（，）分隔，提供类似字符串的下标访问功能。列表元素内容及数量可变、元素之间有序排列。这里的元素是指数字、字符串、逻辑值等。列表对象创建示例如下：


    ![](images/txt004_2.jpg "pagenumber_ebook=55,pagenumber_book=36")


