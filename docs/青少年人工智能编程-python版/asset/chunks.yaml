    \n\uFEFF\n\n第二篇　快乐挑战\n\n好奇性是人类的天性，编程也是一样，如果通过编程能让自己编写有趣的动画，挑战精彩的小游戏产品，那将是一件快乐的事情。\n\
    \n\uFEFF\n\n第八章　动画世界\n\n![](images/txt010_1.jpg \"pagenumber_ebook=206,pagenumber_book=187\"\
    )\n\n利用matplotlib的animation库中的FuncAnimation（　）函数，可以让图动起来。\n\n8.1　动画原理及动画绘制函数\n\
    \n经过科学家的研究，人类视觉存在暂停现象（Duration of Vision），即人眼观察物体时，在物体的反射光信号传入大脑后，在大脑中视觉形象仍然保留一段时间的现象。这种现象是由大脑视神经的反应速度造成的，其反应时间是1/24\
    \ s。所以动画、电影利用1/24 s的时间间隔，每秒提供24帧画面，每个画面之间有细微的变化，进而使动画、电影达到动感的效果。\n\n1.FuncAnimation（　）函数的工作原理\n\
    \nFuncAnimation（　）函数利用视觉暂停现象，采用逐帧（Frame by Frame）动画方式，通过一定时间间隔不断调用参数func，更新一帧帧的图片，实现动画效果。\n\
    \n2.FuncAnimation（　）函数主要参数使用方法\n\n（1）fig：用于设置绘制动画的窗体matplotlib.figure.Figure对象，必选参数。\n\
    \n（2）func：设置调用每一帧的函数，必选参数；func（　）函数采用def func（frame，\\*fargs）方式，其中该函数的第一个参数frame为从func（　）函数后面参数frames（FuncAnimation（　）函数的参数）传递过来的一个帧数据，新增帧的位置参数由fargs提供。\n\
    \n（3）frames ：用于向func（　）函数的参数frame传递一个帧数据，其值可以是可迭代对象（iterable，如列表、元组等）、整数、生成器或None，可选参数。如果其值为None，相当于传递itertools.count（从0开始逐步增1的整数值）。\n\
    \n（4）init\\_func ：用于初始化帧的函数，在生成第1帧之前，会调用一次该函数，可选参数；如果不提供该参数，将使用frames参数中的第一个元素的绘制结果。\n\
    \n（5）interval：帧之间的间隔时间，单位为毫秒，整数，默认值为200毫秒，可选参数。\n\n（6）repeat：在帧序列执行一次之后是否循环执行，布尔值，默认值为True，可选参数。\n\
