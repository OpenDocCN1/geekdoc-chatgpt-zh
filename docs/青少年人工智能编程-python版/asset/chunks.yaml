    ## 10.5.2 0/1 背包问题


    ### 动态规划求解思路

    为了动态规划依据前一决策结果，表 10.3 的第 0 体积列第 0 行作为求当前值辅助，没有其他实质意义。


    在表 10.3 的基础上，借助动态规划解答思路，可以人工推理求解如下。


    第一步，求 1 号物品（体积为 5，价格为 5），在 1 体积，2 体积，…，9 体积依次递推求解的情况下，得到的结果为 0，0，0，0（1 体积到 4 体积情况下，无法装入
    1 号物品），5 体积到 9 体积情况下都可以装入 1 号物品，其对应填写价格都为 5。


    第二步，求先装入 2 号物品（体积为 2，价格为 6）的情况（再考虑与 1 号物品的组合），能否依次被 1 体积到 9 体积装入；求解为 1 体积无法装入，上一行最优解为
    0（`i-1，j`），则（`i，j`）处也填写 0；2 体积到 6 体积情况下，刚好可以装入 2 号物品，填写价格为 6；7 号物品到 9 号物品情况下，除了装入
    2 号物品外，还可以装入 1 号物品，以 2 号物品对应的 7 体积为例，2 号物品 5 体积小于 7 体积，可以装入该物品，于是判断上一行最优解的坐标（`i-1，j-w`）=`（1，7-2）`对应的最优解价值为
    5，则在 5 价值的基础上加当前物品的价值 6 合计为 11（装入新物品），若不装入，则意味只能装入 1 号物品，其价值为 5，两个值取大者，则第二步最优解为
    11。


    第三步，求 3 号物品装入情况……


    第四步，求 4 号物品装入情况……


    由此，在物品装入过程中，需要做两种状态的比较：


    （1）当前需要装入的物品体积大于背包空间（`v[i]＞j`）时：


    当前位置的价格为`V（i，j）=V（i-1，j）`，即当前（`i`）物品与上一行（`i-1`）物品对应 j 位置的物品存放价格一样；


    （2）当前需要装入的物品体积不大于背包剩余空间（`v[i]＜=j`）时：


    背包还有足够的空间装入当前物品，但是不一定是最优解，所以需要在装与不装之间选择一个最大值：`V（i，j）=max｛V（i-1，j），v（i）+V（i-1，jw（i））｝`，其中`V（i-1，j-w（i））`为上一行最优解，`v（i）`为
    i 行当前物品的价格。


