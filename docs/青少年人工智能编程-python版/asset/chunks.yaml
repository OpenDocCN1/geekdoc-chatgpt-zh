    / R`数据科学包，其大小超过了 600 MB；若读者计算机环境或网络速度有限，可以选择缩小包`Miniconda`安装。


    1. 下载`Anaconda`安装包

    `Anaconda`官网下地址为`https://anaconda.en.softonic.com/`，用浏览器打开，其下载界面如图 A.1 所示。为了学习方便，这里选择`Windows`环境下安装，点击“`Download
    for Windows`”按钮，在跳出来的两个界面依次点击“`Download for Windows`”按钮，进入图 A.2 下载路径设置界面，选择合适下载路径，点击“下载”按钮，正式进入下载状态，等待
    10 多分钟即可完成下载。

