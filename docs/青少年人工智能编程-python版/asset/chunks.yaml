- raw: "3.4.3　集合运算\n\n根据数学集合知识可知，集合运算包括并集、交集、差集等，这里通过Python来实现。\n\n三酷猫水果店里进货11个苹果，其中加菲猫买了6个冰心苹果、2个红富士苹果；凯蒂猫买了2个红富士苹果、1个国光苹果，如图3.1所示。由此，加菲猫集合了8个苹果，凯蒂猫集合了3个苹果。\n\
    \n![](images/txt004_47.jpg \"pagenumber_ebook=70,pagenumber_book=51\")\n\n图3.1　苹果集合\n\
    \n用集合表示如下：\n\n![](images/txt004_48.jpg \"pagenumber_ebook=70,pagenumber_book=51\"\
    )\n\n1.并集（A）\n\n在数学中并集就是集合A与B的所有元素和（把重复元素看成一个元素）。\n\n如图3.2所示，集合A有8个冰心苹果，集合B有2个红富士苹果和1个国光苹果，它们的并集有9个苹果（去掉重复的红富士1号和红富士2号）。\n\
    \n![](images/txt004_49.jpg \"pagenumber_ebook=70,pagenumber_book=51\")\n\n图3.2　并集关系\n\
    \n集合对象提供了union（　）方法，实现2个集合的并集运算，用Python实现并集运算，示例如下：\n\n![](images/txt004_50.jpg\
    \ \"pagenumber_ebook=71,pagenumber_book=52\")\n\n2.交集（A∩B）\n\n在数学中A与B交集就是包含A与B中都包含的元素。\n\
    \n图3.3所示的为集合A与集合B之间的交集关系，中间2个红富士苹果是交集的结果。\n\n![](images/txt004_51.jpg \"pagenumber_ebook=71,pagenumber_book=52\"\
    )\n\n图3.3　交集关系\n\n集合对象自带intersection（　）方法，用于运算两个集合的交集。图2.8所示的集合A、B的交集运算代码示例如下：\n\
    \n![](images/txt004_52.jpg \"pagenumber_ebook=71,pagenumber_book=52\")\n\n3.差集（A-B）\n\
    \n数学中集合A与B的差集就是包含在集合A中，但不包含在集合B中的元素。\n\n图3.4所示的为集合A与B的差集，得到A剩余6个冰心苹果。这就是A-B的差集运算结果。\n\
    \n![](images/txt004_53.jpg \"pagenumber_ebook=72,pagenumber_book=53\")\n\n图3.4　差集关系（结果为左边浅蓝色部分）\n\
    \n集合对象自带difference（　）方法，用于运算两个集合的差集，示例如下：\n\n![](images/txt004_54.jpg \"pagenumber_ebook=72,pagenumber_book=53\"\
    )\n\n4.并集、交集、差集运算，使用运算符方法\n\n集合对象除了提供对应方法用于进行集合运算外，还提供集合运算符进行集合运算，其等价关系如下。\n\n\
    并集符号：|等价于union（　）方法；\n\n交集符号：&等价于intersection（　）方法；\n\n差集符号：-等价于difference（　）方法。\n\
    \n![](images/txt004_55.jpg \"pagenumber_ebook=72,pagenumber_book=53\")\n\n![](images/txt004_56.jpg\
    \ \"pagenumber_ebook=73,pagenumber_book=54\")\n\n3.5　\\[案例\\]三酷猫水果产地统计\n\n三酷猫的水果店生意兴隆，水果的产地较多。三酷猫想用集合方法，对水果的产地进行分类统计。以樱桃为例，其来源记录如表3.2所示，供货商为加菲猫。\n\
    \n表3.2　樱桃产地清单\n\n![](images/txt004_57.jpg \"pagenumber_ebook=73,pagenumber_book=54\"\
    )\n\n三酷猫需要完成如下统计：\n\n（1）把樱桃产地分国内、国外两个集合，以统计国内、国外的樱桃产地各是多少个；\n\n（2）国内、国外总共产地的个数，用并集计算；\n\
    \n（3）通过集合的差，统计国内非特大号樱桃的规格类型。\n\n代码文件：3\\_5\\_FruitSource.py\n\n![](images/txt004_58.jpg\
    \ \"pagenumber_ebook=73,pagenumber_book=54\")\n\n![](images/txt004_59.jpg \"pagenumber_ebook=74,pagenumber_book=55\"\
    )\n\n上述代码执行结果如下：\n\n![](images/txt004_60.jpg \"pagenumber_ebook=74,pagenumber_book=55\"\
    )\n\n3.6　练习和实验\n\n练习\n\n1.填空题\n\n（1）列表元素内容及数量可变、元素之间（　）排列。\n\n（2）元组是（　）序列的集合。\n\
    \n（3）字典是可变的无序集合，用花括号（{}）表示字典的开始和结束，元素之间用逗号隔开，其元素以（　）形式表示。\n\n（4）集合是一个无序的、可变的、（　）的元素集。\n\
    \n（5）集合用花括号（{}）表示开始和结束，元素之间用逗号分隔，也可以通过（　）函数来强制表示。\n\n2.判断题\n\n（1）列表提供类似字符串的下标访问功能，下标值从0开始。（　）\n\
    \n（2）元组元素不可修改，不能排序，不能用下标访问。（　）\n\n（3）字典不能用下标访问。（　）\n\n（4）{}表示空集合。（　）\n\n（5）并集的结果元素可以重复。（　）\n\
    \n实验\n\n1.实验一\n\n三酷猫大学毕业了，他想把个人简历打印出来，准备发给招聘人员。其简历内容如下，请把它们放入同一个存储对象，并打印输出。\n\n\
    姓名：三酷猫；性别：男；年龄，21；地址：天津人民公园；联系电话：88888888；大学，猫咪大学；颜色：白色；成绩：优等；学位：学士。\n\n2.实验二\n\
    \n三酷猫参加了语文、数学、英语、物理、化学、政治、历史、体育考试，其成绩如表3.3所示。\n\n表3.3　三酷猫考试成绩\n\n![](images/txt004_61.jpg\
    \ \"pagenumber_ebook=76,pagenumber_book=57\")\n\n（1）分别用列表、元组、字典、集合表示表3.3的成绩。\n\
    \n（2）通过列表、元组、集合分别统计总成绩。\n\n（3）选择合适存储对象，进行分数排序。\n\n（4）把代码保存为SaveGradeCode.py文件。\n\
    \n【注释】  \n\n[\\[1\\]](#txt004.html#footnote_quote_txt004_1)本书对各种变量的操作，都有增加元素、删除元素或变量对象、修改元素、查找元素四种基本操作，方便读者识记。\n\
    \n[\\[2\\]](#txt004.html#footnote_quote_txt004_2)字典，英文为dictionary，在Python语言里用dict表示。\n\
    \n\uFEFF\n\n第四章　智能逻辑判断与循环\n\n![](images/txt005_1.jpg \"pagenumber_ebook=77,pagenumber_book=58\"\
    )\n\n人类对事务具有判断能力，如苹果是否红了，人是否生病了，猫咪是否饿了。另外，现实世界还存在周期性循环的现象，如春夏秋冬，每个月从1号开始递进循环到月末，果农每天记录并累加苹果的销售金额等。\n\
    \n针对这些逻辑判断和循环处理要求，几乎所有的高级编程语言都提供逻辑判断语句和循环判断语句，Python语言也不例外。\n\n4.1　智能逻辑判断\n\n\
    智能逻辑判断语句，将使所编写的代码开始具有初步的智能处理能力。\n\n4.1.1　单分支判断\n\n逻辑判断用if语句来实现，其使用基本格式如下：\n\n\
    ![](images/txt005_2.jpg \"pagenumber_ebook=77,pagenumber_book=58\")\n\n条件表达式，就是以逻辑值的形式来判断的表达式，if语句是否执行“代码模块1”：当条件表达式结果为True时，执行“代码模块1”；当条件表达式结果为False时，不执行“代码模块1”。\n\
    \n这里的条件表达式可以是2.4节的逻辑比较结果，可以是各种变量对象，也可以是其他对象。\n\n单分支判断，就是只做一步判断，要么执行“代码模块1”，要么不执行“代码模块1”，其示例如下：\n\
    \n![](images/txt005_3.jpg \"pagenumber_ebook=78,pagenumber_book=59\")\n\n![](images/txt005_4.jpg\
