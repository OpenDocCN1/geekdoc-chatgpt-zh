    （3）（　）算法的优点是查找速度很快，缺点是需要存储元素对应的地址。


    （4）（　）算法通过某种方式列举所有答案的过程。


    （5）（　）算法仅考虑局部最优，动态规划是全局性最优的一类算法。


    2.判断题


    （1）栈可以看作是只能在一端进行元素入列出列操作的特殊队列。（　）


    （2）查找算法对需要查找的元素队列，无排序要求。（　）


    （3）二分查找算法也称为折半查找算法，以实现在有序元素条件下的快速查找。（　）


    （4）选择排序是指每一步将待排序元素插入前面已经排序的有序序列中，一直到所有的元素都被插入为止。（　）


    （5）快速排序是对冒泡排序的一种改进。（　）


