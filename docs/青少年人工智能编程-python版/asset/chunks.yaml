    \n从上述情况可以知道，Python编程，必须遵守一定编程的规则。\n\nPython编程规则如下。\n\n（1）大小写敏感，如图1.4所示。print和Print是两个不同的命令，第一个是正确的命令，所有字母都小写；第二个首字母P大写，意味着命令出错。\n\
