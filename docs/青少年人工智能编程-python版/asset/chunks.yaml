    #### 2. 判断题

    （1）归一化是指通过对数据处理把它们的值限定在`[0，1]`范围内。（　）

    （2）一般的数字图像都可以看成是多维数组的像素属性值记录。（　）

    （3）归一化对数据做了无量纲处理（跟原始数据的单位没有关系），这有利于数据的分析和计算。（　）

    （4）对数据进行归一化处理，不会影响数据之间的关系。（　）

    （5）最大最小归一化适用于大多数数据，可以较好地保持数据之间的分布结构关系，对异常数据很敏感（如颜色值超过`255`的数），不适用于稀疏数据的归一化处理。（　）


