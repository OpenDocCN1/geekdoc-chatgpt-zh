    # 第十二章 国内外青少年竞赛知识


    ![](images/txt015_1.jpg "pagenumber_ebook=303,pagenumber_book=284")

    青少年通过本书学习编程，除了提高逻辑思维能力，掌握编程知识外，可以为进一步深造，或参加各类竞赛打下了基础。

    对于想通过`Python`语言的学习参加各类竞赛的读者，这一章为读者打开了竞赛的大门。


    ## 12.1 蓝桥杯

    “蓝桥杯”是指蓝桥杯全国软件和信息技术专业人才大赛，由中华人民共和国工业和信息化部人才交流中心主办，国信蓝桥教育科技股份有限公司承办的计算机类学科竞赛，一年举办一次。

    该竞赛内容难度适中，适合编程入门者竞赛体验。


    ### 12.1.1 竞赛介绍

    竞赛参赛介绍详见官网每届的《蓝桥杯全国软件和信息技术专业人才大赛大赛章程（个人赛）》，以“第十四届蓝桥杯全国软件和信息技术专业人才大赛大赛章程（个人赛）”为例。


    1. “蓝桥杯”参赛对象

    具有正式全日制学籍并且符合相关科目报名要求的研究生、本科、高职高专及中职中专学生（以报名时状态为准）、中小学生，以个人为单位进行比赛。


    2. 比赛可选择内容

    个人赛软件类、个人赛电子类、视觉艺术大赛三大类。以个人赛软件类为例，如表12.1所示，可以根据自己年龄、所在学校年级、所掌握编程语言，选择一项比赛项目进行准备，并参加比赛。

    表12.1　蓝桥杯个人赛软件类比赛项目

    ![](images/txt015_2.jpg "pagenumber_ebook=304,pagenumber_book=285")


    3. 报名方式

    学校及选手登录蓝桥杯官方网站（`www.lanqiao.cn`）在线注册并报名，选手需要选定一名指导老师（事先可以咨询本校的信息化指导老师，或所在省市省赛点举办学校的组织老师）。


    4. 报名时间

    一般在每年的10月初到12月中旬，具体看官网报名通知。


    5. 竞赛时间

    第二年的3、4月份，参加当地的省赛；省赛获得全国决赛权，参加当年5、6月份的现场总决赛。


    6. 竞赛成果应用

    大学获奖选手在部分高校保研时具有加分项照顾的优势，可以优先获得优质IT企业的面试机会。


    说明

    “青少年创意编程组”网上地址（`https://www.lanqiaoqingshao.n/ home`），一般报名时间在当年的3、4月份。


    ### 12.1.2 竞赛内容简介

    这里以`Python`软件类为例，根据《第十四届蓝桥杯全国软件和信息技术专业人才大赛个人赛（软件类）Python 组竞赛规则及说明》。


    1. 考试方式

    一人一机，全程4小时，在线答题，题型分填空题、编程大题。


    2. 考查范围

    `Python` 程序设计基础：包含使用 `Python` 编写程序的能力。该部分不考查选手对某一语言语法的理解程度，选手可以使用自己喜欢的语言编写程序。

    计算机算法：枚举、排序、搜索、计数、贪心、动态规划、图论、数论、博弈论、概率论、计算几何、字符串算法等。

    数据结构：数组、对象/结构、字符串、队列、栈、树、图、堆、平衡树/线段树、复杂数据结构、嵌套数据结构等。

    样题：见官网《第十四届蓝桥杯全国软件和信息技术专业人才大赛个人赛（软件类）Python 组竞赛规则及说明》。


    ## 12.2 全国青少年信息学奥林匹克竞赛

    全国青少年信息学奥林匹克竞赛，英文全称`National Olympiad in Informatics`，简称`NOI`，由教育部和中国科协委托中国计算机学会（`China
    Computer Federation`，简称`CCF`）举办，一年举办一次。`NOI`举办、报名官网为`https://www.noi.cn/`。


    ### 12.2.1 竞赛介绍

    `NOI`是国内含金量最高的信息化大赛，与全国中学生数学奥林匹克竞赛、全国中学生物理奥林匹克竞赛、全国中学生化学奥林匹克竞赛、全国中学生生物学奥林匹克竞赛齐名。

    `NOI`也分省赛（又称为省选）、国赛两个比赛阶段。省赛结束后，`NOI`将从正式选手中选出成绩前50名的选手，组成中国国家集训队。

    参加`NOI`资格的前提，先参加`NOIP`或`CSP-JS`，成绩优秀者才能参加`NOI`省选拔赛的资格。


    说明

    为了顺利参加`NOI`，建议在初中，最晚在高一完成`NOIP`或`CSP-J/S`两个阶段（初赛、复赛）的选拔。


    1. 参赛对象

    初高中在校学生。


    2. 竞赛报名及竞赛时间

    选手先需要通过`http://cspsj.noi.cn`官网，参加`CSP-JS`报名；以2022年为例，报名时间为6月16日到9月8日，第一轮测试竞赛时间为9月
    18日，第二轮测试竞赛时间为10月22日，只有第一轮测试成绩优秀者，才能进入第二轮测试。

    取得了`CSP-JS`或`NOIP`复赛资格后，才能进入各自省市省选`NOI`入围报名资格。以浙江省2022年的`NOI`省选赛为例，报名时间为3月13日至3月19日，`NOI`省选赛选拔竞赛时间为4月4日、4月5日，每天8：30-13：00，测试地点为杭州学军中学紫金港校区（可以在`NOI`官网`https://www.noi.cn/gs/xw/`的各省栏目查看）。

    `NOI`国赛报名以2022年为例，报名时间为6月28日至7月5日12：00截止。2022年8月20日至27日在华东师范大学教育集团成员昆山狄邦华曜学校（原昆山市上海华二学校）举行。


    ### 12.2.2 竞赛内容简介

    2021年`CCF`发布的《全国青少年信息学奥林匹克系列竞赛大纲》进一步明确了竞赛知识范围，有利于指导老师的教学和竞赛选手的学习。该大纲给出了入门级（`Junior`）、提高级（`Senior`）、`NOI`级的竞赛知识范围，并给出了对应的难度系数，1到5级为入门级，5到8级为提高级，7到10级为`NOI`级。

    上机考试环境以`Linux`为主（入门级可以是`Windows`环境），主要编程工具为`C++`。


    1. 入门级的主要考试范围

    入门级的考试内容分为笔试和编程，主要涉及计算机基础与编程环境知识、`C++`编程基本语法、相关数据结构、函数、指针、传统经典入门算法（树、图、简单排序、图论、检索、动态规划等）及以中学为主的数学知识（初中数学、组合数学）。


    2. 提高级的主要考试范围

    提高级的考试内容分为笔试和编程，主要涉及`Linux`下基本操作命令的使用、`C++`的使用、`C++`面向对象技术的初步使用、传统经典算法（排序、搜索、图论、动态规划等）及以中学为主的数学知识（高中数学、组合数学、初等数论、线性代数等）。


    3. `NOI`级的主要考试范围

    `NOI`级的主要考试内容为上机进行`C++`程序设计，设计内容包括数据结构、复杂算法（策略性、字符串、图论、动态规划等）及高中大学数学（高等数学、信息论基础、组合数学、运筹学、概率论、线性代数、计算几何、博弈论）。


    说明

    学完了`Python`语言再学`C++`语言，编程会容易得多。


    ## 12.3 国际大学生程序设计竞赛

    国际大学生程序设计竞赛（`International Collegiate Programming Contest`，简称`ICPC`），由国际计算机学会（`Association
    for Computing Machinery`，简称`ACM`）主办，是全球最具影响力的大学生程序设计竞赛。

    `ICPC`官网地址：`https://icpc.global/`。

    `ICPC`赛事由各大洲区域预赛和全球总决赛两个阶段组成，区域预赛一般安排在上一年的9至12月举行，总决赛安排在每年的3至5月举行。原则上一个大学在一个区域预赛最多可以有3支队伍，最终只能有1支队伍参加全球总决赛。如东亚的`ICPC`总部设在北京大学，用于组织东亚区域赛。

    国内主要区域预赛举办地大学包括上海大学、北京大学、清华大学、西安交通大学、中山大学、上海交通大学、四川大学、浙江大学、西安电子科技大学、西华大学、南京航空航天大学、北京航空航天大学、吉林大学、中国科学技术大学、北京交通大学、哈尔滨工程大学、杭州电子科技大学、西南民族大学、东华大学、哈尔滨工业大学、武汉大学、天津大学、浙江理工大学、福州大学、大连理工大学、复旦大学、北京邮电大学、成都东软学院、福建师范大学、东北师范大学、天津理工大学、浙江师范大学、南京理工大学、浙江工业大学、电子科技大学、湖南大学、辽宁科技大学、华南理工大学、北京师范大学、华东理工大学、牡丹江师范学院、南方科技大学、香港中文大学、香港科技大学、澳门大学、西北工业大学等。每年由具备条件的大学向东亚`ICPC`总部申请，并承办。

    参赛以团队形式（3个人一组）进行，只能用1台计算机在5小时内完成10道编程题的编写和结果提交，综合考验一个团队的协作能力、心理素质、创新能力、分析和解决问题能力、编程能力。区域竞赛所用编程语言可以是`C`、`C++`、`Java`、`Python`。

    参赛对象：主要以有编程经验的大学生为主。

    `ICPC`每年报名，以大学为组织单位，报名信息可以通过当地区域`ICPC`总部官网获取，如`ICPC`北京总部官网地址为`http://icpc.pku.edu.cn/index.htm`。

    比赛内容：各种算法编程。

    部分`ICPC`赛历年真题学习地址：`https://vjudge.csgrandeur.cn/contest/`，题目全部用英文描述。


    ## 12.4 Kaggle竞赛

    `Kaggle`主要为软件开发商、数据科学家提供数据发掘和预测竞赛、举办机器学习竞赛、托管数据库、编写和分享代码的网络平台，由联合创始人兼首席执行官Anthony
    Goldbloom于2010年在澳大利亚墨尔本创立。

    `Kaggle`官网地址：`https://www.kaggle.com/`。


    ### 12.4.1 参赛平台介绍

    用浏览器打开`Kaggle`平台界面后，得到如图12.1所示的平台栏目信息。

    ![](images/txt015_3.jpg "pagenumber_ebook=310,pagenumber_book=291")

    图12.1　`Kaggle`平台栏目


    1. 平台栏目

    最新的`Kaggle`栏目包括比赛（`Competitions`）、数据集（`Datasets`）、代码（`Code`）、讨论（`Discussions`）、课程（`Courses`）等栏目。


    1）比赛（`Competitions`）栏目

    该栏目是`Kaggle`发布比赛题目和参赛入口。参赛基本流程为：在该栏目的比赛模块里选择参赛题目，下载对应比赛测试数据，进行编程及模型训练，提交测试代码及结果，查看在线排名，继续优化测试代码（每天最多可以提交5次），最终提交比赛代码及结果数据，接受比赛结果。


    2）数据集（`Datasets`）栏目

    为网上公布的每个竞赛题提供对应的数据下载服务功能，下载的数据包括提交结果的示范、测试集、训练集，数据最常见的下载和提交格式为`CSV`格式。


    3）代码（`Code`）栏目

    这里可以看到其他参赛者自愿公开的模型代码，支持线上调试和运行自己的代码，目前支持`Python`语言、`R`语言，也支持`Numpy`、`Pandas`这些流行的数据分析库。


    4）讨论（`Discussions`）栏目

    为参赛者提供讨论`Kaggle`平台和机器学习主题的功能，包括分享反馈、提出问题等。


    5）课程（`Courses`）栏目

    为初次接触`Kaggle`者提供免费的入门课程培训内容。


    2. `Kaggle`竞赛分类

    `Kaggle`官网公开提供的公开竞赛类型如图12.2所示，包括特色型竞赛（`Featured`）、入门型竞赛（`Getting Started`）、研究型比赛（`Research`）、社区型竞赛（`Community`）、游乐型竞赛（`Playground`）、仿真型竞赛（`Simulations`）、分析型竞赛（`Analytics`）等。

    ![](images/txt015_4.jpg "pagenumber_ebook=312,pagenumber_book=293")

    图12.2　`Kaggle`官网提供的公开竞赛类型


    1）特色型竞赛

    特色型竞赛是`Kaggle`最有特色的竞赛项，网上公开题目、需求、测试数据、奖金额度，要求参赛者下载数据，自行编程解决问题，代码编写完成即可以在网上提交，参与网上解决问题答案排名，排名最优者的获奖，所提交代码很可能被赞助商直接应用到商业实践中。


    2）入门型竞赛

    为初次接触`Kaggle`新手提供“试水”的竞赛题：如预测杂货店销售趋势、用生成的对抗网络绘制自己的美术作品、手写数字识别、沉船事故幸存估计、脸部识别、`Julia`语言入门等。由于竞赛内容带有服务新手、指导新手学习的设计意图，不提供奖品或积分。


    3）研究型竞赛

    主要竞赛内容为机器学习等前沿性或公益性的题目，题目内容比特色型竞赛更具实验性，竞赛奖励可能是奖金或会议邀请或发表论文形式的奖励。


    4）社区性竞赛

    社区团队预测性竞赛。


    5）游乐型竞赛

    这类竞赛设计目的是进一步提升参赛者的“兴趣”，难度比入门型竞赛有所提高，所提供的机器学习竞赛内容相对简单。这个类的题目以有趣为主，参赛者参与热度很高。


    6）仿真型竞赛

    通过机器学习，强化学习环境，进行数据仿真研究竞赛。


    7）分析型竞赛

    主要利用大数据进行专题分析竞赛。


    ### 12.4.2 竞赛过程介绍

    `Kaggle`竞赛前，参赛者需要了解竞赛机制，掌握竞赛过程要求。


    1. 竞赛机制

    在比赛结束之前，参赛者每天最多可以提交5次测试集的预测结果。每一次提交结果都会获得最新的临时排名成绩，直至比赛结束获得最终排名。在比赛过程中，`Kaggle`将参赛者每次提交的结果取出25%～33%，并依照准确率进行临时排名。在比赛结束时，参赛者可以指定几个已经提交的结果，`Kaggle`从中去除之前用于临时排名的部分，综合剩余数据的准确率得到最终排名。


    2. 竞赛过程要求

    参赛者进入`Kaggle`界面后，可以选择一类竞赛，然后在对应的竞赛模块里，选择需要参赛的题目。不同的竞赛题目会有不同的参赛规则，参赛者第一时间应该准确掌握参赛题目的规则，可以在题目上方点击“`Rules`”，了解每个规则要求，如参赛者必须事先在该平台在线注册个人真实信息，并用唯一的一个账户参与比赛。

    在了解参赛题目的要求、比赛规则、参赛时间要求，下载参赛数据后，就可以编写算法代码了，完成代码后，就可以进行数据测试，然后按照格式要求提交测试结果文件（一天最多提交5次），最后根据比赛排名，获得相应奖励。


