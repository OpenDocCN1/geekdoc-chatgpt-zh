    图 12.2　`Kaggle`官网提供的公开竞赛类型


    1）特色型竞赛

    特色型竞赛是`Kaggle`最有特色的竞赛项，网上公开题目、需求、测试数据、奖金额度，要求参赛者下载数据，自行编程解决问题，代码编写完成即可以在网上提交，参与网上解决问题答案排名，排名最优者的获奖，所提交代码很可能被赞助商直接应用到商业实践中。


    2）入门型竞赛

    为初次接触`Kaggle`新手提供“试水”的竞赛题：如预测杂货店销售趋势、用生成的对抗网络绘制自己的美术作品、手写数字识别、沉船事故幸存估计、脸部识别、`Julia`语言入门等。由于竞赛内容带有服务新手、指导新手学习的设计意图，不提供奖品或积分。


    3）研究型竞赛

    主要竞赛内容为机器学习等前沿性或公益性的题目，题目内容比特色型竞赛更具实验性，竞赛奖励可能是奖金或会议邀请或发表论文形式的奖励。


    4）社区性竞赛

    社区团队预测性竞赛。


    5）游乐型竞赛

    这类竞赛设计目的是进一步提升参赛者的“兴趣”，难度比入门型竞赛有所提高，所提供的机器学习竞赛内容相对简单。这个类的题目以有趣为主，参赛者参与热度很高。


    6）仿真型竞赛

    通过机器学习，强化学习环境，进行数据仿真研究竞赛。


    7）分析型竞赛

    主要利用大数据进行专题分析竞赛。


    ### 12.4.2 竞赛过程介绍

    `Kaggle`竞赛前，参赛者需要了解竞赛机制，掌握竞赛过程要求。


    1. 竞赛机制

    在比赛结束之前，参赛者每天最多可以提交 5 次测试集的预测结果。每一次提交结果都会获得最新的临时排名成绩，直至比赛结束获得最终排名。在比赛过程中，`Kaggle`将参赛者每次提交的结果取出
    25%～33%，并依照准确率进行临时排名。在比赛结束时，参赛者可以指定几个已经提交的结果，`Kaggle`从中去除之前用于临时排名的部分，综合剩余数据的准确率得到最终排名。


    2. 竞赛过程要求

    参赛者进入`Kaggle`界面后，可以选择一类竞赛，然后在对应的竞赛模块里，选择需要参赛的题目。不同的竞赛题目会有不同的参赛规则，参赛者第一时间应该准确掌握参赛题目的规则，可以在题目上方点击“`Rules`”，了解每个规则要求，如参赛者必须事先在该平台在线注册个人真实信息，并用唯一的一个账户参与比赛。

    在了解参赛题目的要求、比赛规则、参赛时间要求，下载参赛数据后，就可以编写算法代码了，完成代码后，就可以进行数据测试，然后按照格式要求提交测试结果文件（一天最多提交
    5 次），最后根据比赛排名，获得相应奖励。


    【注释】

    [1] `NOIP`，全国青少年信息学奥林匹克联赛（`National Olympiad in Informatics in Provinces`）。

    [2] `CCF-J/S`，`CCF`非专业级软件能力认证（`Certified Software Professional Junior/Senior`）。

    [3] `https://www.noi.cn/generic/web/viewer.html？file=/upload/resources/file/2021/04/06/152179.pdf`。


