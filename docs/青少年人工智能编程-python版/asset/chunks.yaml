    ## 9.3　[案例]炮弹射击气球


    用乌龟图库函数实现炮弹射击气球的游戏效果，是一个比较刺激的想法。


    ### 9.3.1　游戏设计


    基本设计思路如下。


    （1）用红色小球代表炮弹，用随机产生的蓝色小球代表气球。


    （2）用`vector`对象分别记录红色炮弹和蓝色气球在画布里的坐标位置。


    （3）通过鼠标点击记录新坐标，让红色炮弹上升；鼠标点击结束后，又让红色炮弹的`y`坐标按照一定速度下降。


    （4）让蓝色气球的坐标以一定的速度朝左边移动。


    （5）每刷新一次红色炮弹和所有蓝色气球的坐标到画布上，同时比较红色炮弹和蓝色气球的（`x`、`y`）坐标距离，当二者距离小于蓝色气球直径距离时（从气球球形坐标计算），认为炮弹射中了气球，记录该气球的坐标被删除；继续刷新坐标到画布上。


    （6）当有蓝色气球到达画布的左边边缘时，游戏结束。


    ### 9.3.2　游戏代码实现


    用乌龟图库函数可以实现炮弹射击气球的游戏效果。用`ball`记录红色炮弹的移动坐标，用`targets`列表记录所有蓝色气球移动的坐标，`tap()`函数用于记录鼠标点击画布的坐标位置，`inside()`函数用于比较炮弹、气球移动是否超出画布边界，`draw()`函数用于移动一次在画布上刷新显示炮弹和气球的位置，`move()`函数用于计算更新炮弹、气球的新位置（若炮弹的距离小于气球的
    13 个像素距离，则删除该气球坐标）。用`ontimer(move, 50)`函数以 50 ms 为间隔，反复调用`move()`函数以刷新画布，产生动画游戏效果。完整代码实现如下：


