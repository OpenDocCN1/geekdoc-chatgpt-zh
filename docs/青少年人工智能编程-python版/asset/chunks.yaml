    ## 灰度处理方法


    最大值法就是取`R`、`G`、`B`三个通道值的最大值作为它们的公共灰度处理值；

    平均值法就是取`R`、`G`、`B`三个通道值的平均值作为它们的公共灰度处理值；

    加权平均法就是分别取`R×0.299`、`G×0.587`、`B×0.114`作为新的三个通道值，其中绿色通道值权重最大（为`0.587`），因为人眼对绿色的敏感度最高，红色次之，蓝色最低。

    分别用最大值法、平均值法、加权平均法把彩色图像处理成灰色图像。


