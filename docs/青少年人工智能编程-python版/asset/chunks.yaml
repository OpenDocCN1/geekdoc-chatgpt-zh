    ### 8.6 [案例] 波涛汹涌

    用二维数组绘制曲线图，是一件很容易的事情。这里需要使这些曲线连续地动起来，就像大海里的波涛涌动。可以通过对二维数组从第 1 列到最后 1 列，从左到右一列列移动数据（最左边
    1 列新增补充新值）使绘图区域的曲线显示出从左到右滚动的效果。

    主要实现步骤如下。

    首先，用`np.random.uniform（0，1，（64，75））`生成 64 行 75 列二维数组，再通过 64 次循环，用`i + G * data[i]`生成
    64 条波浪线的`y`坐标值，用`X = np.linspace（-1，1，data.shape[-1]）`生成 75 列的`x`坐标值；

    然后，用刷新函数`update（）`刷新一次，让`data`数组从左到右移动 1 列数据，并补充最左边 1 列数据，并把变化结果存储到`lines`列表对象里；

    最后，通过`FuncAnimation（）`函数完成动态绘制。

