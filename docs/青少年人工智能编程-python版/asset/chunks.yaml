    ![](img/att002_3.png "pagenumber_ebook=319,pagenumber_book=300")为打开代码文件按钮，对于已经保存到指定路径下的代码文件，可以通过点击该按钮，选择并打开指定路径下的代码文件，就可以继续编写代码。


    ![](img/att002_4.png "pagenumber_ebook=319,pagenumber_book=300")为保存代码按钮，对于已经编写的代码文件，可以点击该按钮，保存代码到代码文件里（存储到硬盘上）；若采用的是默认文件名，则会跳出文件名修改界面，输入指定文件名后，点击“`保存`”按钮，保存代码到磁盘文件上。


    ![](img/att002_5.png "pagenumber_ebook=319,pagenumber_book=300")为脚本代码运行按钮，在代码文件里编写的代码，可以通过点击该按钮，进行持续运行。


