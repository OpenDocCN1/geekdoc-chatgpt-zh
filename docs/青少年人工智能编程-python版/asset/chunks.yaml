    ![](images/txt007_73.jpg "pagenumber_ebook=157,pagenumber_book=138")


    ### 7. `sum()` 方法

    数组自带的 `sum()` 方法用于计算所有元素的和。当指定参数 `axis`，值为 0 时，求每列元素的和；值为 1 时，求每行元素的和。

