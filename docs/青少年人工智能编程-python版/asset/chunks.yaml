    10.3　排序


    现实生活中，人们经常要接触排序的问题，如一个班期末成绩按从高到低进行排序，学生做早操按从低到高进行排队。而且，读者已经发现有些查找算法运行的前提，必须先做数值排序，才能查找，如二分法查找。由此，需要掌握对数值进行排序的知识。


