    ## 12.1 蓝桥杯

    “蓝桥杯”是指蓝桥杯全国软件和信息技术专业人才大赛，由中华人民共和国工业和信息化部人才交流中心主办，国信蓝桥教育科技股份有限公司承办的计算机类学科竞赛，一年举办一次。

    该竞赛内容难度适中，适合编程入门者竞赛体验。


    ### 12.1.1 竞赛介绍

    竞赛参赛介绍详见官网每届的《蓝桥杯全国软件和信息技术专业人才大赛大赛章程（个人赛）》，以“第十四届蓝桥杯全国软件和信息技术专业人才大赛大赛章程（个人赛）”为例。


    1. “蓝桥杯”参赛对象

    具有正式全日制学籍并且符合相关科目报名要求的研究生、本科、高职高专及中职中专学生（以报名时状态为准）、中小学生，以个人为单位进行比赛。


    2. 比赛可选择内容

    个人赛软件类、个人赛电子类、视觉艺术大赛三大类。以个人赛软件类为例，如表 12.1 所示，可以根据自己年龄、所在学校年级、所掌握编程语言，选择一项比赛项目进行准备，并参加比赛。

    表 12.1　蓝桥杯个人赛软件类比赛项目

