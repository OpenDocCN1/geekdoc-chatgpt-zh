    列表提供了基本的增加、查找、修改、删除^[（[1]](#txt004.html#footnote_content_txt004_1))等功能。


    #### 1. 增加元素


    列表增加元素主要通过其自带的`append（）`方法、`insert（）`方法实现。


    ##### 1）`append（）`方法


    `append（）`方法只在现有列表的最后一个元素后面增加一个值。


    ![](img/txt004_4.jpg "pagenumber_ebook=56,pagenumber_book=37")


    ![](img/txt004_5.jpg "pagenumber_ebook=57,pagenumber_book=38")


    ##### 2）`insert(index, value)`方法


    `insert(index, value)`方法需要设置两个参数，第一个参数`index`设置需要在列表里插入的下标位置，第二个参数是需要插入列表的元素值。


    ![](img/txt004_6.jpg "pagenumber_ebook=57,pagenumber_book=38")


    若`insert(index, value)`方法的插入下标超过列表长度的下标范围，则该方法自动把值放到列表最后面，示例如下：


    ![](img/txt004_7.jpg "pagenumber_ebook=57,pagenumber_book=38")


    #### 2. 查找元素


    列表提供了下标、切片、`in`成员运算判断符、`index（）`等方法来查找元素。


    ##### 1）下标查找元素


    ![](img/txt004_8.jpg "pagenumber_ebook=57,pagenumber_book=38")


    ##### 2）切片查找元素


    ![](img/txt004_9.jpg "pagenumber_ebook=57,pagenumber_book=38")


    ![](img/txt004_10.jpg "pagenumber_ebook=58,pagenumber_book=39")


    ##### 3）`in`成员运算判断符查找元素


    ![](img/txt004_11.jpg "pagenumber_ebook=58,pagenumber_book=39")


    采用`in`成员运算判断符的优势是，当元素不存在时，计算机不会报错，而是返回`False`。


    ##### 4）`index（）`方法查找元素


    ![](img/txt004_12.jpg "pagenumber_ebook=58,pagenumber_book=39")


    当采用`index（）`方法查找的元素不存在时，计算机将报错，示例如下：


    ![](img/txt004_13.jpg "pagenumber_ebook=58,pagenumber_book=39")


    其中，“`ValueError：''梨'' is not in list`”表示梨在列表中找不到。


    #### 3. 修改元素


    修改列表里指定元素的值，可以通过赋值直接修改。


    ![](img/txt004_14.jpg "pagenumber_ebook=58,pagenumber_book=39")


    #### 4. 删除元素


    列表提供了`remove（）`方法用于删除指定元素，当列表有重复值元素时，删除最左边的一个元素。


    ![](img/txt004_15.jpg "pagenumber_ebook=59,pagenumber_book=40")


    另外可以通过`del（）`函数删除指定元素或列表对象。


    ![](img/txt004_16.jpg "pagenumber_ebook=59,pagenumber_book=40")


    #### 5. 其他操作


    另外常见的列表操作方法包括列表合并、列表元素排序等。


    ##### 1）列表合并


    列表与列表的合并，可以通过`+`直接连接合并。


    ![](img/txt004_17.jpg "pagenumber_ebook=59,pagenumber_book=40")


    ##### 2）列表元素排序


    列表提供了`sort（）`方法，用于列表元素的排序。若`sort（）`方法的参数`reverse=False`（默认值），则列表里的元素按照从小到大正序排序；若参数`reverse=True`，则列表里的元素按照从大到小倒序排序。


    ![](img/txt004_18.jpg "pagenumber_ebook=60,pagenumber_book=41")


    ### 3.1.3 列表嵌套


    列表里的元素也可以是列表，这样可以处理更加复杂的数据。


    #### 1. 列表嵌套的创建


    如班级 1 的语文、数学、英语考试，三酷猫、加菲猫、凯蒂猫的成绩如表 3.1 所示。


    表 3.1 考试成绩


    ![](img/txt004_19.jpg "pagenumber_ebook=60,pagenumber_book=41")


    把表 3.1 里的成绩放入列表，采用列表嵌套方式，示例如下：


    ![](img/txt004_20.jpg "pagenumber_ebook=60,pagenumber_book=41")


    #### 2. 嵌套列表元素的访问


    ![](img/txt004_21.jpg "pagenumber_ebook=60,pagenumber_book=41")


    ![](img/txt004_22.jpg "pagenumber_ebook=61,pagenumber_book=42")


    ## 3.2 元组


    元组（`Tuple`）是不可变序列的集合，其使用方法类似列表，主要区别是元组元素不可修改，不能排序，用小括号表示。元组与字符串、列表一样也支持下标操作。


    ### 3.2.1 元组表示


    元组基本创建方式示例如下：


    ![](img/txt004_23.jpg "pagenumber_ebook=61,pagenumber_book=42")


    注意


    一个元素的元组，元素后必须跟逗号，否则小括号变成了数学里的小括号！


    ### 3.2.2 元组操作


    元组基本操作包括查找元素、统计元素、合并元组、转换元组、删除元组等。


    #### 1. 查找元素


    元组元素查找主要通过下标或切片查找。


    ![](img/txt004_24.jpg "pagenumber_ebook=62,pagenumber_book=43")


    #### 2. 统计元素


    统计元组元素可以通过其提供的`count（）`方法统计指定元素个数，可以通过`len（）`函数统计元组长度，另外可以通过 Python 自带的`sum（）`函数求数值元素和。


    ##### （1）统计指定元素的个数，示例如下：


    ![](img/txt004_25.jpg "pagenumber_ebook=62,pagenumber_book=43")


    ##### （2）统计元组长度，示例如下：


    ![](img/txt004_26.jpg "pagenumber_ebook=62,pagenumber_book=43")


    ##### （3）求元素和，示例如下：


    ![](img/txt004_27.jpg "pagenumber_ebook=62,pagenumber_book=43")


    #### 3. 合并元组


    元组之间的合并可以通过`+`直接操作，示例如下：


    ![](img/txt004_28.jpg "pagenumber_ebook=62,pagenumber_book=43")


    ![](img/txt004_29.jpg "pagenumber_ebook=63,pagenumber_book=44")


    #### 4. 转换元组


    列表与元组之间可以通过`tuple（）`、`list（）`函数进行强制转换。


    ![](img/txt004_30.jpg "pagenumber_ebook=63,pagenumber_book=44")


    #### 5. 删除元组


    元组只允许通过`del（）`函数删除整个元组对象，而不允许删除单个元素，这体现了元素的不可修改特性。


    ![](img/txt004_31.jpg "pagenumber_ebook=63,pagenumber_book=44")


    ## 3.3 字典


    字典是一种可以存储更加复杂关系元素的数据存储结构，可以解决列表、元组解决不了的问题。


    ### 3.3.1 字典表示


    字典（`dict`^[（[2]](#txt004.html#footnote_content_txt004_2))）是可变的无序集合，用花括号（`{}`）表示字典的开始和结束，元素之间用逗号隔开，其元素以键值对（`Key：Value`）形式表示。通过`Key`和`Value`的成对表示，可以表达一对一的对应关系，如姓名：张三。字典不支持下标方式访问元素。


    字典使用示例如下：


    ![](img/txt004_32.jpg "pagenumber_ebook=64,pagenumber_book=45")


    字典元素的`Key`必须唯一，而且只能是不可变类型的字符串、数字或元组；字典元素的值可以是任何类型，如字符串、数字、列表、元组、字典等，且可以重复。


    ![](img/txt004_33.jpg "pagenumber_ebook=64,pagenumber_book=45")


    ### 3.3.2 字典操作


    对字典的基本操作可以分查找、增加、修改、删除四种。


    #### 1. 查找字典元素


    查找字典元素，可以通过字典名[`Key`]或字典对象自带的`get（）`方法进行操作。


    ##### 1）字典名[`Key`]方式查找


    其中`Key`为需要查找的键值对里的键。


    ![](img/txt004_34.jpg "pagenumber_ebook=65,pagenumber_book=46")


    输入不存在的键，计算机将报错。


    ##### 2）字典对象`get（）`方法查找


    采用`get（）`方法查找时，需要为其传递一个键。


    ![](img/txt004_35.jpg "pagenumber_ebook=65,pagenumber_book=46")


    #### 2. 增加字典对象的元素


    通过为字典名指定不存在的键，并进行赋值，实现增加字典对象的元素过程，示例如下：


    ![](img/txt004_36.jpg "pagenumber_ebook=65,pagenumber_book=46")


    注意


    若所指定的键已经存在了，则变成了键所对应值的修改，详见下面“赋值方式修改”的代码示例。


    #### 3. 修改字典对象的元素


    字典对象提供了赋值方式及其自带的`update（）`方法来修改元素。


    ##### 1）赋值方式修改


    字典对象指定的键要存在，才能用如下赋值做值修改，示例如下：


    ![](img/txt004_37.jpg "pagenumber_ebook=66,pagenumber_book=47")


    ##### 2）自带`update（）`方法修改


    用字典对象自带的`update（）`方法设置一个键参数，进行键对应的值的修改，示例如下：


    ![](img/txt004_38.jpg "pagenumber_ebook=66,pagenumber_book=47")


    当指定的键不存在时，就会变成增加元素操作。


    #### 4. 删除字典对象的元素


    用字典自带的`pop（）`方法或`del（）`函数删除指定的元素。


    ##### 1）`pop（）`方法删除指定元素


    用字典对象自带的`pop（）`方法，为其指定一个键，然后删除指定的元素，并返回删除元素的值，示例如下：


    ![](img/txt004_39.jpg "pagenumber_ebook=66,pagenumber_book=47")


    ##### 2）`del（）`函数删除指定元素


    用 Python 自带的`del（）`函数删除指定元素，也可以一次性删除指定的字典对象。


    ![](img/txt004_40.jpg "pagenumber_ebook=67,pagenumber_book=48")


    ## 3.4 集合


    集合（`Set`）是一个无序的、可变的、不重复的元素集。这里的集合元素可以是数字、字符串、逻辑值。


    ### 3.4.1 集合表示


    在 Python 里集合用花括号（`{}`）表示开始和结束，元素之间用逗号分隔，也可以通过`set（）`函数来强制表示。空集合必须用`set（）`函数来强制定义，不能直接用`{}`表示。


    ![](img/txt004_41.jpg "pagenumber_ebook=67,pagenumber_book=48")


    注意


    集合定义与字典定义的主要区别在于元素格式的区别，字典必须采用键值对形式。


    ### 3.4.2 集合元素操作


    Python 集合提供了基本的查找、增加、删除等操作方法。


    #### 1. 查找元素


    对集合里的元素进行查找，只能通过`in`成员运算符进行判断。


    ![](img/txt004_42.jpg "pagenumber_ebook=68,pagenumber_book=49")


    #### 2. 增加元素


    往集合里增加元素，既可以通过集合的`add（）`方法一个元素一个元素地增加，也可以通过集合的`update（）`方法同时增加多个元素。


    ##### 1）用`add（）`方法增加元素


    用`add（）`方法一次只能增加一个元素，示例如下：


    ![](img/txt004_43.jpg "pagenumber_ebook=68,pagenumber_book=49")


    如果所增加的元素已存在，则不进行任何操作。


    ##### 2）用`update（）`方法增加元素


    用`update（）`方法可以一次性增加多个元素，示例如下：


    ![](img/txt004_44.jpg "pagenumber_ebook=68,pagenumber_book=49")


    #### 3. 删除元素


    删除集合元素可以用其自带的`pop（）`方法，也可以用`remove（）`、`discard（）`方法。


    ##### 1）`pop（）`方法：随机删除一个元素


    ![](img/txt004_45.jpg "pagenumber_ebook=69,pagenumber_book=50")


    ##### 2）`remove（）`方法：删除一个指定元素


    ![](img/txt004_46.jpg "pagenumber_ebook=69,pagenumber_book=50")


    说明


    `remove（）`与`discard（）`方法的主要区别，当指定的元素不存在时，前者计算机报错，后者计算机不报错。


