    \n9.3.1　游戏设计\n\n基本设计思路如下。\n\n（1）用红色小球代表炮弹，用随机产生的蓝色小球代表气球。\n\n（2）用vector对象分别记录红色炮弹和蓝色气球在画布里的坐标位置。\n\
