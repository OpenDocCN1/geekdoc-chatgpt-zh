    把彩色图像处理成灰色图像（俗称的“黑白照片”），在图像人工智能识别时可以忽略彩色因素，加快图像处理速度。


    当图像像素点的颜色通道值R=G=B时，彩色图像颜色就会变成一种灰度颜色。由此，改变图像的RGB通道值，就可以实现灰度处理效果。常见的灰度处理方法有最大值法、平均值法、加权平均法。

