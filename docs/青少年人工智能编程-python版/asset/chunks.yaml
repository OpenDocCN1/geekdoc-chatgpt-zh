    学习算法（Algorithm）可以大幅提高学生通过编程解决问题的能力，有益逻辑思维的锻炼；同时，算法也是国内外信息化竞赛的核心内容，是想参加竞赛的读者必须掌握的知识；良好的算法能力，也是软件工程师、相关科学家解决实际问题的核心。


