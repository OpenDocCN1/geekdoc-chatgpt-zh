    ## 6.1.5 [案例]三酷猫照片背后的数组


    `matplotlib.pyplot`子库为读写 PNG、JPG 格式的图像，提供了`imread（　）`和`savefig（　）`函数，可以通过`import`导入使用。


    ### 1. 读取 PNG 图片到指定的数组对象


    `plt.imread（fname，format=None）`，参数说明如下。

    （1）`fname`，指定读取图片的文件名（含文件路径）。

    （2）`format`，指定文件扩展名，如果没有指定，则默认值为 PNG。


    返回值说明：数组，返回数组形式为（M，N），则图片是灰度图片；返回数组形式为（M，N，3），则图片是 RGB 图片；返回数组形式为（M，N，4），则图片是
    RGBA 图片。


    ### 2. RGBA 组成


    在计算机上图片的最小表示单位是像素，RGBA 格式图片的像素由红（Red）、绿（Green）、蓝（Blue）、透明度（Alpha）四个通道组成，每个通道占
    8bit，一个像素长度为 32bit，其结构如图 6.2 所示。前三个通道颜色的取值范围为 0 到 255 之间的整数或者 0%到 100%之间的百分数，这些值描述了红绿蓝三原色在预期色彩中的量。如
    100%红、0%绿和 0%蓝，设置为纯红色。Alpha 通道确定彩色的透明度，值范围为`[0，1]`，0 为全透明，1 为不透明。


    ![](img/txt007_29.jpg "pagenumber_ebook=136,pagenumber_book=117")


    图 6.2 RGBA 结构


    ### 3. 组数对象以图片格式存放


    `plt.imsave（fname，arr，**kwargs）`的参数说明如下。

    （1）`fname`，指定需要存储为图片的文件名（含文件路径）。

    （2）`arr`，图片数据的数组，数组形式可以是（M，N）、（M，N，3）、（M，N，4）。

    （3）`**kwargs`代表如下参数设置及使用。

    ①`vmin`，`vmax`，设置颜色范围。

    ②`cmap`，设置图片颜色，仅适用于灰度图片。

    ③`format`，指定文件的扩展名，如“.png”“ .pdf”“ .svg”等。

    ④`origin`，可选值“upper”“lower”，指定图片索引坐标（0，0）从左上角开始，还是从左下角开始。

    ⑤`dpi`，表示图像分辨率，指每英寸长度上的点数。


