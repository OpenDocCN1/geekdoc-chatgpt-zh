    ## 11.2 归一化

    归一化（Normalization）是指通过对数据处理把它们的值限定在指定范围内，多限定在\[0，1\]范围内。通过归一化处理的数据保留了原有数据之间的数值关系，同时做了无量纲处理（跟原始数据的单位没有关系了），这有利于数据的分析和计算。


    在数据分析和人工智能处理数据前，往往需要对原始数据进行归一化处理，方便数据分析和算法处理。图像数据也可以进行归一化处理。


