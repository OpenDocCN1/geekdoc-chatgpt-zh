    代码中`print`是`Python`自带的保留关键字，用于把其括号内的内容，输出到计算机屏幕上。

    `print`的基本使用格式举例，如图 1.3 所示，在交互式代码执行区输入一行打印功能代码，回车后执行该代码，显示执行结果。

