    ## 5.2 自定义函数


    Python 提供了大量的自带函数，可以快速解决问题，而无须知道函数内部是怎么实现的，这种感觉很棒！但是，人们的需求是无限的，有时程序员需要自己编写函数，方便代码的有效使用。


    ### 5.2.1 基本自定义函数


