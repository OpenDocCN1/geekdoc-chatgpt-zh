    ## 12.2 全国青少年信息学奥林匹克竞赛

    全国青少年信息学奥林匹克竞赛，英文全称`National Olympiad in Informatics`，简称`NOI`，由教育部和中国科协委托中国计算机学会（`China
    Computer Federation`，简称`CCF`）举办，一年举办一次。`NOI`举办、报名官网为`https://www.noi.cn/`。


    ### 12.2.1 竞赛介绍

    `NOI`是国内含金量最高的信息化大赛，与全国中学生数学奥林匹克竞赛、全国中学生物理奥林匹克竞赛、全国中学生化学奥林匹克竞赛、全国中学生生物学奥林匹克竞赛齐名。

    `NOI`也分省赛（又称为省选）、国赛两个比赛阶段。省赛结束后，`NOI`将从正式选手中选出成绩前 50 名的选手，组成中国国家集训队。

    参加`NOI`资格的前提，先参加`NOIP`或`CSP-JS`，成绩优秀者才能参加`NOI`省选拔赛的资格。


    说明

    为了顺利参加`NOI`，建议在初中，最晚在高一完成`NOIP`或`CSP-J/S`两个阶段（初赛、复赛）的选拔。


    1. 参赛对象

    初高中在校学生。


    2. 竞赛报名及竞赛时间

    选手先需要通过`http://cspsj.noi.cn`官网，参加`CSP-JS`报名；以 2022 年为例，报名时间为 6 月 16 日到 9 月 8 日，第一轮测试竞赛时间为
    9 月 18 日，第二轮测试竞赛时间为 10 月 22 日，只有第一轮测试成绩优秀者，才能进入第二轮测试。

    取得了`CSP-JS`或`NOIP`复赛资格后，才能进入各自省市省选`NOI`入围报名资格。以浙江省 2022 年的`NOI`省选赛为例，报名时间为 3 月
    13 日至 3 月 19 日，`NOI`省选赛选拔竞赛时间为 4 月 4 日、4 月 5 日，每天 8：30-13：00，测试地点为杭州学军中学紫金港校区（可以在`NOI`官网`https://www.noi.cn/gs/xw/`的各省栏目查看）。

    `NOI`国赛报名以 2022 年为例，报名时间为 6 月 28 日至 7 月 5 日 12：00 截止。2022 年 8 月 20 日至 27 日在华东师范大学教育集团成员昆山狄邦华曜学校（原昆山市上海华二学校）举行。


    ### 12.2.2 竞赛内容简介

    2021 年`CCF`发布的《全国青少年信息学奥林匹克系列竞赛大纲》进一步明确了竞赛知识范围，有利于指导老师的教学和竞赛选手的学习。该大纲给出了入门级（`Junior`）、提高级（`Senior`）、`NOI`级的竞赛知识范围，并给出了对应的难度系数，1
    到 5 级为入门级，5 到 8 级为提高级，7 到 10 级为`NOI`级。

    上机考试环境以`Linux`为主（入门级可以是`Windows`环境），主要编程工具为`C++`。


    1. 入门级的主要考试范围

    入门级的考试内容分为笔试和编程，主要涉及计算机基础与编程环境知识、`C++`编程基本语法、相关数据结构、函数、指针、传统经典入门算法（树、图、简单排序、图论、检索、动态规划等）及以中学为主的数学知识（初中数学、组合数学）。


    2. 提高级的主要考试范围

    提高级的考试内容分为笔试和编程，主要涉及`Linux`下基本操作命令的使用、`C++`的使用、`C++`面向对象技术的初步使用、传统经典算法（排序、搜索、图论、动态规划等）及以中学为主的数学知识（高中数学、组合数学、初等数论、线性代数等）。


    3. `NOI`级的主要考试范围

    `NOI`级的主要考试内容为上机进行`C++`程序设计，设计内容包括数据结构、复杂算法（策略性、字符串、图论、动态规划等）及高中大学数学（高等数学、信息论基础、组合数学、运筹学、概率论、线性代数、计算几何、博弈论）。


    说明

    学完了`Python`语言再学`C++`语言，编程会容易得多。


    ## 12.3 国际大学生程序设计竞赛

    国际大学生程序设计竞赛（`International Collegiate Programming Contest`，简称`ICPC`），由国际计算机学会（`Association
    for Computing Machinery`，简称`ACM`）主办，是全球最具影响力的大学生程序设计竞赛。

    `ICPC`官网地址：`https://icpc.global/`。

    `ICPC`赛事由各大洲区域预赛和全球总决赛两个阶段组成，区域预赛一般安排在上一年的 9 至 12 月举行，总决赛安排在每年的 3 至 5 月举行。原则上一个大学在一个区域预赛最多可以有
    3 支队伍，最终只能有 1 支队伍参加全球总决赛。如东亚的`ICPC`总部设在北京大学，用于组织东亚区域赛。

    国内主要区域预赛举办地大学包括上海大学、北京大学、清华大学、西安交通大学、中山大学、上海交通大学、四川大学、浙江大学、西安电子科技大学、西华大学、南京航空航天大学、北京航空航天大学、吉林大学、中国科学技术大学、北京交通大学、哈尔滨工程大学、杭州电子科技大学、西南民族大学、东华大学、哈尔滨工业大学、武汉大学、天津大学、浙江理工大学、福州大学、大连理工大学、复旦大学、北京邮电大学、成都东软学院、福建师范大学、东北师范大学、天津理工大学、浙江师范大学、南京理工大学、浙江工业大学、电子科技大学、湖南大学、辽宁科技大学、华南理工大学、北京师范大学、华东理工大学、牡丹江师范学院、南方科技大学、香港中文大学、香港科技大学、澳门大学、西北工业大学等。每年由具备条件的大学向东亚`ICPC`总部申请，并承办。

    参赛以团队形式（3 个人一组）进行，只能用 1 台计算机在 5 小时内完成 10 道编程题的编写和结果提交，综合考验一个团队的协作能力、心理素质、创新能力、分析和解决问题能力、编程能力。区域竞赛所用编程语言可以是`C`、`C++`、`Java`、`Python`。

    参赛对象：主要以有编程经验的大学生为主。

    `ICPC`每年报名，以大学为组织单位，报名信息可以通过当地区域`ICPC`总部官网获取，如`ICPC`北京总部官网地址为`http://icpc.pku.edu.cn/index.htm`。

    比赛内容：各种算法编程。

    部分`ICPC`赛历年真题学习地址：`https://vjudge.csgrandeur.cn/contest/`，题目全部用英文描述。


    ## 12.4 Kaggle 竞赛

    `Kaggle`主要为软件开发商、数据科学家提供数据发掘和预测竞赛、举办机器学习竞赛、托管数据库、编写和分享代码的网络平台，由联合创始人兼首席执行官 Anthony
    Goldbloom 于 2010 年在澳大利亚墨尔本创立。

    `Kaggle`官网地址：`https://www.kaggle.com/`。


