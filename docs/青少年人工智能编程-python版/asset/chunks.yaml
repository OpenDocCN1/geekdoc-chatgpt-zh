    用二维数组绘制曲线图，是一件很容易的事情。这里需要使这些曲线连续地动起来，就像大海里的波涛涌动。可以通过对二维数组从第1列到最后1列，从左到右一列列移动数据（最左边1列新增补充新值）使绘图区域的曲线显示出从左到右滚动的效果。

    主要实现步骤如下。

