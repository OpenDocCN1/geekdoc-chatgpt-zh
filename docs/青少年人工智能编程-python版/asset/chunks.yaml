    （2）一款编程的软件，这里采用`Anaconda`软件安装包，使用其提供的`Spyder`代码编辑器来实现本书的学习。`Anaconda`是世界上最优秀的科学计算包之一，被广大科学家、工程师、高校师生所使用。其以`Python`语言为基础，支持大数据分析、科学计算、人工智能等编程功能——实质上其包含了最新
    8000 多个各种功能库，如本书将要用到的科学计算库`numpy`、图形图像处理库`matplotlib`等，当然也包含了编程工具`Spyder`、`Python`。

    `Anaconda`安装包的下载及安装过程请参考附录 A，本书主要基于`Win7`环境下安装，所以选择了 32 位 2020 年的 11 版。

    注意

    `Anaconda`版本太高，会导致其在低版本的 Windows 操作系统里无法安装和使用。

    `Spyder`基本使用方法请参考附录 B。

    （3）上述内容准备好了，就可以打开`Spyder`代码编辑器，编写代码了。


