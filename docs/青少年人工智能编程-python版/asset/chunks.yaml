    ### 9.1 乌龟图库

    乌龟图库是 Python 安装包自带的绘图库，可以方便地用于绘制各种漂亮的图形。可以在代码编辑区或交互式代码操作环境下，用`from turtle import`直接导入该库里的各种绘制函数。


    #### 9.1.1 绘图基本要素

    乌龟图库的基本绘图要素包括画布、坐标、画笔。


    ##### 1. 画布

    乌龟图库的绘图概念和思路类似于现实中的绘图，显示的绘图区域称为画布（Canvas），可以通过`setup（）`函数设置画布的大小。其中，`done（）`函数与`setup（）`函数配套使用，确保画布窗体正常退出。

    ![](img/txt011_3.jpg "pagenumber_ebook=221,pagenumber_book=202")

    显示宽度为 420 像素、高度为 420 像素，画布左上角位置`x`位置为 370 像素，`y`位置为 0 的绘图界面，如图 9.1 所示，在其上可以绘制各种各样的图形。

    ![](img/txt011_4.jpg "pagenumber_ebook=221,pagenumber_book=202")

    图 9.1　乌龟图库画布

    说明

    显示器、照片等显示的图像是由许多明暗不同并按一定规律排列的黑白小点组成的，这些黑白小点称为像素，它是组成图像的最小基本单位。单位面积像素越多，图像越清晰。


    ##### 2. 坐标

    乌龟图库的默认坐标以画布的中心为`x`、`y`轴的圆点坐标（0，0），默认长度用像素个数作为刻度最小单位，如图 9.2 所示。读者可以根据`x`、`y`坐标值进行绘图定位，以方便从某一坐标点开始绘图。

    ![](img/txt011_5.jpg "pagenumber_ebook=222,pagenumber_book=203")

    图 9.2　乌龟图库的默认坐标位置（实际情况下不可见）


    ##### 3. 画笔

    在画布上绘制的图像，可以想象是用一支画笔绘制的，而且这支画笔可以设置颜色、线宽等属性，也可以设置画笔绘制的速度（体现动画效果）。在画布上绘制线条时，默认会在线条终端显示一个三角形图标，这个图标就代表画笔，也可以换成其他图标。画笔的运动控制及属性控制函数请见
    9.1.2、9.1.3 节内容。


    #### 9.1.2 笔线运动控制函数

