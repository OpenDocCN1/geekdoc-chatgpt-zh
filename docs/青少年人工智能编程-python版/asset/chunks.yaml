    ### 10.3.1 选择排序


    选择排序（Selection Sort）是指从待排序的数据元素里选一个最小（或最大）的元素放到序列最前面，然后再从未排序数据元素里选择下一个最小（或最大）的元素放到序列次前面，依次类推，一直使所有元素都完成选择，就实现了有序排序。


