    字典（`dict`^[（[2]](#txt004.html#footnote_content_txt004_2))）是可变的无序集合，用花括号（`{}`）表示字典的开始和结束，元素之间用逗号隔开，其元素以键值对（`Key：Value`）形式表示。通过`Key`和`Value`的成对表示，可以表达一对一的对应关系，如姓名：张三。字典不支持下标方式访问元素。


