    ## 4.4 循环需要控制


    对于循环过程，因满足或不满足某些条件，终止循环或跳过一些不执行代码，或从头开始循环是可行的，这可以减少循环次数，提高代码执行效率。


    ### 4.4.1 跳出循环


    在循环过程，若已经满足某个条件了，则可以通过`break`语句跳出循环，以减少无效循环过程。


    如想在水果字典里，通过`for`语句循环查找梨，找到梨后，就可以马上通过`break`语句终止循环，示例如下：


    ![](img/txt005_41.jpg "pagenumber_ebook=90,pagenumber_book=71")


    代码执行结果如下：


    ![](img/txt005_42.jpg "pagenumber_ebook=90,pagenumber_book=71")


    由于梨所在的元素为第 2 个，所以只要循环 2 次，就可以找到梨所对应的销售额，然后通过`break`语句退出循环；而不使用`break`语句的情况，需要循环
    5 次，其中 3 次是无效循环，进而增加了运行时间。


    说明


    实现对代码的高效率运行，是提高代码编写质量所面临的一个重要问题，也是区分编程人员水平高低的一个标志。读者朋友们在日常代码学习中，需要重视的一项技能。


    ### 4.4.2 从头循环


    在循环过程，有些条件不符合的代码，可以不执行，以提高运行效率。Python 的`continue`语句，可以跳过无须执行的代码，重新回到`while`或`for`代码行运行。


    用`for`语句循环加`if`语句判断 0 到 4 哪些是偶数，示例如下：


    ![](img/txt005_43.jpg "pagenumber_ebook=91,pagenumber_book=72")


    代码执行结果如下：


    ![](img/txt005_44.jpg "pagenumber_ebook=91,pagenumber_book=72")


    该循环通过`continue`省掉了 2 次执行`i+=1`的可能。在实际工作中很少用到`continue`语句，因为可以通过`if`语句判断跳过无须执行的代码。


    ## 4.5 \[案例\]三酷猫销售排序：冒泡排序


    冒泡排序是对无序的一组数据的元素进行两两比较，把大的放后面，小的放前面，每比较一轮实现一个最大数放到相对最后的过程，有点类似池塘里冒泡的过程，最终实现从小到大排序的过程。


    三酷猫水果店的 5 名员工各自的销售金额为`[900，801.5，2000，1590.8，1200.7]`，其按照冒泡思路，排序过程如图 4.1 所示。


    ![](img/txt005_45.jpg "pagenumber_ebook=92,pagenumber_book=73")


    图 4.1 冒泡排序


    在图 4.1 中，第一轮把从左数的 5 个金额里最大的 2000 元排到了最后，第二轮把从左数的 4 个金额里最大的 1590.8 元排到了倒数第二的位置，第三轮开始没有数据交换位置，说明排序结束。


    从图 4.1 所示冒泡排序过程，可以得出两个结论：第一，需要采用双重循环，外循环控制排序轮数，内循环控制每轮相邻两数比较过程；第二，当有一轮没有数据交换或比较到最后一轮（只需要比较最左边两个元素）时，则冒泡排序结束。


