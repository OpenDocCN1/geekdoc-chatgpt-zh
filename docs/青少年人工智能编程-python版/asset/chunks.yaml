    ## 10.4 贪心算法


    贪心算法（Greedy Algorithm）又称为贪婪算法，是指在对问题求解时，总是做出在当前步骤看来是最好的选择。该算法仅考虑局部最优，而 10.5 节的动态规划则考虑全局最优。


    贪心算法的特点：


    （1）仅考虑当前步骤最优值，与前面状态无关；


    （2）最优值即每次求最大或最小值；


    （3）可以把一个问题分解为若干个子问题并对其求解，同时对所有子问题的解求和，得到最终局部最优值。


