    图 B.2 中的①为脚本代码编辑区，可以在其上连续输入多行代码，保存为指定名称的代码文件，然后点击上面工具栏里的绿色“三角形”按钮。


    图 B.2 中的②为交互式代码执行区，输入一行代码，回车后执行一行代码；无论是交互式代码还是脚本代码，都在该区域显示执行结果。


