    ## [9.3 云计算](../contents/content.xhtml#toc58)


    互联网的诞生催生了云计算，这是为什么呢？云计算又是什么呢？我们还要从20世纪60年代说起。


    20世纪60年代，计算机分时系统的概念开始形成。那时候还没有小型和微型计算机，只有像IBM这样的计算机公司制造的大型和超大型计算机。为了使这种集中配置的大型计算资源和能力被更多的部门和人员共同使用，把计算机资源按时段分配给不同的用户，让大家共同分享，成为了一种新的计算模式。这就是分时系统的概念。


    那个时候，计算机都位于被称为计算中心的专门机构里面，由专门的技术人员管理。谁要使用计算机都需要到计算中心提交使用申请，获得机时后，把自己的程序交给操作员，通过他们来实现程序在计算机上的运行。运算结果出来以后，操作员再将其交给你。


    这种集中式的计算模式不仅成本高，而且非常不方便。只有大型企业和政府高级部门才有能力建立、维护和使用这样的计算中心。于是，一些公司开始研究开发适合中小企业和地方部门使用的中小型计算机，美国的太阳微系统公司、数字设备公司等一大批公司研发的中小型计算机应运而生。IBM公司也与时俱进，开发出了面向个人用户的微型计算机。一时之间，计算机涌入各个办公室和寻常百姓家。


    可这里又有了一个问题。众多的计算机和计算机系统都分散在千家万户之中，“各自为政”，一方面形不成规模，另一方面又造成不同程度的资源浪费。进入20世纪90年代，通信公司开始提供网络连接服务，将不同地方和不同部门的计算机系统连接起来形成一个网络。互联网和互联网技术诞生了。


    由通信网络连接起来的计算机系统看上去就像一朵云彩，云计算的概念处于萌芽之中。科学家和技术人员开始思考为什么不把网络上的各种资源整合起来共享给所有用户使用呢？于是，1983年太阳微系统公司提出了“网络就是计算机”的概念。


    1996年，美国康柏公司在内部文件中首次使用了“云计算”这个词汇。他们意识到，互联网正在把传统意义上的通信平台转化为广泛存在的智能化的计算平台。与计算机系统这样的传统计算平台比较，互联网上需要形成类似于传统计算机的公共服务环境，以支持互联网资源的有效管理和综合利用。在传统计算机中已成熟的操作系统技术已不再适用于互联网环境。互联网上分散、独立、自主控制、自治对等和冗余的资源，应该通过整合，形成互联网资源和互联网应用的一体化服务环境，提供面向互联网计算的虚拟计算环境，使用户能够方便、有效地共享和利用开放网络上的各种资源。


    ![](images/figure_0168_0107.jpg)


    云计算


    2006年8月，亚马逊公司率先推出弹性运算云端服务。紧接着在2007年10月，谷歌和IBM公司开始在美国大学里推广云端运算计划，可以降低分散式计算方式在学术研究方面的成本，并为这些大学提供相关的软硬件设备及技术支援，提供多达1600个处理器，支援不同开源代码的平台，让学生可以通过网络开展各项以大规模运算为基础的研究。


    2008年7月29日，雅虎、惠普和英特尔公司宣布了一项涵盖美国、德国和新加坡的联合研究计划，推出一个集6个数据中心为一体的云计算研究测试平台，每个数据中心配置有1400～4000个处理器。这些合作伙伴包括新加坡资讯通信发展管理局、德国卡尔斯鲁厄理工学院计算中心、美国伊利诺伊大学香槟分校、英特尔研究院、惠普实验室和雅虎。


    美国戴尔公司在2008年8月向美国专利商标局申请“云计算”商标，此举旨在加强对这一未来可能重塑技术架构的术语的控制权。戴尔公司在申请文件中称，云计算是“在数据中心和巨型规模的计算环境中，为他人提供计算机硬件定制制造”。云计算正式进入了人们的视野。一场波澜壮阔的云计算革命在互联网的基础上轰轰烈烈地开始了。


    云计算让分散在千家万户的计算机资源和应用又回到了大规模集中式的计算模式上。但和20世纪60年代传统的大规模集中式计算方法不同的是，云计算不是孤立于计算中心的独立系统，而是基于互联网的相关服务的增加、使用和交互模式，它通过互联网来提供动态的、易于扩展的和虚拟化的资源。云是网络、互联网的一种比喻式说法。云计算可以让你体验每秒10万亿次的运算能力，拥有这么强大的计算能力后，可以模拟核爆炸、预测气候变化和市场发展趋势。用户通过计算机和手机等方式接入数据中心，按自己的需求进行运算，足不出户就坐拥天下资源。


    人们关于云计算的定义一直众说纷纭。对于到底什么是云计算，至少可以找到上百种解释。按美国国家标准与技术研究院的定义，云计算是一种按使用量付费的模式，这种模式提供可用的、便捷的、按需的网络访问，进入可配置的计算资源共享池（资源包括网络、服务器、存储设备、应用软件及服务），无须投入太多的管理工作，或只需与服务提供商进行很少的交互，就能够快速获得这些资源。用通俗的话说，云计算就是通过网络上的大量计算资源进行计算。有了云计算，用户完全可以通过自己的个人计算机给提供云计算的服务提供商发送指令，通过服务提供商提供的大量服务器进行像“核爆炸”这样的计算，计算结果将会返回到用户自己的个人计算机上。


    ![](images/figure_0170_0108.jpg)


    云在手


    美国国家标准与技术研究院还定义了云端运算的3种服务模式。第一种叫软件即服务，就是消费者使用应用程序，但并不掌控作业系统、硬件或运作的网络基础架构。软件服务提供商以租赁方式向客户提供服务，而非购买。


    第二种叫平台即服务。消费者使用主机操作应用程序。消费者掌控运作应用程序的环境，也拥有主机的部分掌控权，但并不掌控作业系统、硬件或运作的网络基础架构。平台通常是应用程序基础架构。


    第三种叫基础设施即服务。消费者使用“基础运算资源”，如处理能力、储存空间、网络元件或中介软件。消费者能掌控作业系统、储存空间、已部署的应用程序及网络元件（如防火墙、负载平衡器等），但并不掌控云端基础架构。


    截至2009年，大部分的云计算服务是通过数据中心提供的可信赖的服务和建立在服务器上的不同层次的虚拟化技术提供的。人们可以在任何提供网络基础设施的地方使用这些服务。


    有了云计算，人们可以通过网络将庞大的运算处理程序自动分拆成无数个较小的子程序，再由多部伺服器所组成的庞大系统进行搜索、运算、分析，然后将处理结果回传给使用者。通过云端，远程的服务提供商可以在数秒之内处理数以千万计甚至亿计的资讯，达到和超级计算机同样强大的效能；可以进行像DNA结构分析、基因图谱测序、癌细胞解析这样复杂的需要大量计算的工作。


    人工智能在今天的飞速发展既离不开互联网，也离不开云计算。我们前面讲过ImageNet国际大赛，如果没有互联网，项目组就不可能下载接近10亿张图片；如果没有像亚马逊网站的土耳其机器人这样的众包平台来标记这些图片，就不可能有来自世界上167个国家的近5万名工作者协同合作，帮助项目组筛选、排序、标记这近10亿张照片。当然，神经网络的一代宗师辛顿教授也只能望洋兴叹，束手无策。


    ## [9.4 百科全书与谷歌大脑](../contents/content.xhtml#toc59)


    1978年，日本通产省决定研发当时世界上尚无人研发的第五代计算机，这是日本从制造大国向经济科技强国转型的计划的一部分。电子计算机的发展经历了第一代的电子管计算机、第二代的晶体管计算机、第三代的集成电路计算机和第四代的超大规模集成电路计算机等几个阶段。日本的第五代计算机研究计划在国际上引起了一场计算机研制赶超狂潮。


    美国政府决定联合多家高科技公司在得克萨斯大学建立微电子和计算机技术公司，与日本抗衡。费根鲍姆提议，建立美国国家知识技术中心，为人类有史以来的知识建立数据库。他的学生莱纳特受到了推荐，来到了该公司。


    当时，这个具有数学和物理学背景以及人工智能博士学位的年轻人已经是人工智能领域里的一颗新星。早在斯坦福大学读博士期间，他就深得费根鲍姆、明斯基等大师的指导。写博士论文时，他利用启发式推理算法，开发了一款叫作AM的程序。AM的含义是“全自动数学家”。这款程序可以基于300多个数学概念，通过200多种启发式规则，提出各种数学方面的命题，然后进行各种计算和推理，从而判定命题的真伪。这个程序思考问题的方式非常类似于人类的数学家。


    ![](images/figure_0172_0109.jpg)


    莱纳特


    来到得克萨斯大学的莱纳特早已胸有成竹，他要建立一个百科全书式的知识库。他把这个项目命名为Cyc，取自百科全书英文单词中间的3个字母。这就是最早的知识图谱。莱纳特坚定地支持他的老师费根鲍姆提出的知识原则：一个系统之所以能展示高级的智能逻辑和行为，主要是因为在所从事的领域所表示出来的特定知识，其中包括概念、事实、表示、方法、比喻和启发。他认为：“智能就是一千万条规则。”


    知识图谱从应用的角度看就是一个问答系统。这个问答系统可分成3个部分，第一个部分是问题理解，第二个部分是知识查询，第三个部分是答案生成。这3个部分相辅相成，第一个和第三个部分是自然语言处理工作，它们通过知识图谱有机地整合在一起，知识图谱是核心。当知识图谱足够大的时候，它回答问题的能力会十分惊人。


    Cyc项目试图将人类所有的常识都输入一个计算机系统中，建立一个巨型数据库，并在此基础上实现知识推理。Cyc知识库中包括“每棵树都是植物”和“植物最终都会死亡”这样的常识。当有人提出“树是否会死亡”的问题时，推理引擎就可以正确地回答该问题。Cyc知识库的规模宏大，2016年它已经包括63万多个概念，关于这些概念的“常识”达到700万条以上。为了实现这个“大百科全书”系统，莱纳特带领了几十个研究助手，对从文学到音乐、从餐饮到体育的各种日常生活的细节进行知识编码，还开发了称为Cyc
    L的专用编程语言。对各种领域的差异，莱纳特定义了一个名为“微型理论”的概念来进行管理。每个“微型理论”是一些“概念”和“常识”的集合，对应于人类社会中的各种细分行业或领域。这样，一些行业的“行话”或特殊的比喻就可以在一定的“情境”中被定义为“规则”，便于理解。


    今天的维基百科实际上就是一个知识图谱，它可以回答各式各样的问题。2011年，IBM公司开发了一个可以用自然语言和人交流的问答系统——沃森，并让它参加美国的电视智力竞赛节目《危险边缘》，战胜了当时的参赛者肯·詹宁斯和布拉德·鲁特，赢得了100万美元的奖金。《危险边缘》对于计算系统来说是一个巨大的挑战，因为它涉及的学科众多，涵盖了历史、文学、政治、艺术、娱乐和科学等广泛的主题，选手们要在很短的时间内提供正确答案。


    ![](images/figure_0173_0110.jpg)


    美国电视智力竞赛节目《危险边缘》


    更困难的是，主持人提出的问题中包含反语、双关语、谜语和一些意思深奥微妙的表达方式，让计算机领会这些表达方式相当困难。沃森能够应付这类“狡猾”的试题，主要依靠它对自然语言的理解和高速计算。


    当沃森被问到某个问题的时候，100多种运算法则会通过不同的方式对问题进行分析，并给出很多可能的答案，而这些分析都是同时进行的。在得出这些答案之后，另一组算法会对这些答案进行分析并给出得分。对于每个答案，沃森都会找出支持以及反对这个答案的证据。因此，数百个答案中的每一个都会再次引出数百条证据，同时由数百套算法对这些证据支持答案的程度进行打分。证据评估的结果越好，沃森的信心值也就越高，而评估成绩最好的答案最终会成为计算机给出的答案。但在比赛中，如果连评估成绩最好的答案都无法得到足够高的信心值，沃森就会决定不抢答这个问题，以免因为答错而输掉奖金。所有这些计算、选择与决策最多只需要3秒就可以完成。


    沃森的名字用于纪念IBM公司的创始人托马斯·沃森先生，它是IBM公司25个科研工作者过去4年的研究成果。沃森评估了大约2亿页的内容(相当于100万册书籍)。在回答问题的时候，沃森是完全自主的，也就是说不需要和网络连接。沃森可以理解自然语言的提问，分析数以百万计的信息碎片，并且根据它寻找到的证据提供最佳答案。沃森的胜利标志着人工智能专家系统和知识图谱到达了很高的水平，是对人类智能的一个挑战。


    2012年5月，谷歌首次在它的搜索页面中引入知识图谱。用户通过谷歌搜索引擎，可以看到与查询的关键词有关的更加完整的答案。比如，当你输入“达·芬奇”这个关键词时，谷歌搜索引擎会在查询结果的最上方提供达·芬奇的详细信息（如个人简介、出生地点、父母姓名），展示达·芬奇的一些名画的图片（如《蒙娜丽莎》《最后的晚餐》《岩间圣母》等），甚至列出一些与达·芬奇有关的历史人物（如文艺复兴时期的主要画家米开朗基罗、拉斐尔、波提切利等）。如果单击《蒙娜丽莎》或者拉斐尔的链接，就可以看到关于这幅名画或者拉斐尔的详细信息。用户顺着知识图谱，就可以看到关于达·芬奇的各种有趣的信息，也可以顺藤摸瓜，欣赏文艺复兴时期其他艺术家的杰作。在本书的编写过程中，作者就是通过谷歌的知识图谱来获取所需的各种资料和数据的。


    ![](images/figure_0175_0111.jpg)


    谷歌知识图谱


    谷歌副总裁阿米特·辛格尔博士在他的文章《知识图谱介绍：实体，而不是字符串》中说明了什么是知识图谱。他说，用户输入的关键词的本质含义是真实世界的实体，而非抽象的字符串。知识图谱实际上就是由实体相互连接而形成的语义网络。例如，在知识图谱中，达·芬奇和《蒙娜丽莎》都是实体，《蒙娜丽莎》是达·芬奇的作品，因此这两个实体之间形成了画家和作品之间的连接。


    2012年，谷歌知识图谱包含5亿多个实体，关于实体的事实和实体关系的信息有35亿多条。2014年，利用人工智能技术，谷歌又开发了名为Knowledge Vault的知识库，它可以通过算法自动搜集网上的信息，利用机器学习技术把网上的信息自动变成可用知识。利用知识图谱技术，谷歌大大提升了客户的搜索体验，同时，知识图谱的庞大知识库为其他人工智能技术的整合（比如实现准确的语音识别和机器翻译等）提供了广泛和强大的基础。


    2011年，谷歌和斯坦福大学联合成立了一个叫谷歌X的实验室，目的是研究开发出一款模拟人脑功能的软件，这个软件具备自学功能。谷歌的资深专家杰夫·迪恩、研究员格雷·科拉多与斯坦福大学知名人工智能专家吴恩达教授是这个实验室最初的3名成员。其中，美籍华人吴恩达教授从2006年就开始尝试用深度学习技术来解决人工智能领域的问题，这促使他在2011年与迪恩和科拉多联手创立了大型深度学习软件平台DistBelief。这是一个架构在谷歌云计算平台上的服务。谷歌X实验室的科学家们通过将1.6万台计算机的处理器相连，建造出了世界上最大的一种大型中枢网络系统。它能自主学习，被称为谷歌大脑。谷歌大脑研发团队的口号是：“让机器更智能，以提升人类生活质量。”他们相信知识应该为全人类共享，他们在机器学习算法和技术、医疗健康、机器学习支撑计算机系统、机器人、自然语言理解、艺术创作以及知觉仿真7个领域进行开发研究，并把所有科研成果公之于众。


    ## [9.5 大数据让人工智能插上了翅膀](../contents/content.xhtml#toc60)


    人工智能研究历来就有符号学派和统计学派两大阵营之分。前者更依赖具有数理逻辑的数学方法，而后者更强调概率统计的数据方法；前者更注重理论，后者更依靠经验。在人工智能的发展中，二者各有所长，难分伯仲。


    不过，神经网络、机器学习等人工智能技术都是属于统计学派的阵营。它们的成功和突破不能不感谢互联网和云计算技术的诞生和发展，是大数据让人工智能插上了新的翅膀。


    到底什么是大数据？按照麦卡锡全球研究院的定义，大数据是一种规模大到在获得、存储、管理、分析方面大大超出传统数据库软件工具的能力范围的数据集合，具有数据规模庞大、数据流转迅速、数据类型多样和价值密度低四大特征。


    大数据与互联网、云计算密不可分。大数据的数据规模让它无法在单个的计算机系统上实现，必须依赖云计算的集群处理能力和互联网的数据收集能力。所以，一种技术的产生和发展都离不开其他技术的进步和飞跃。它们互为因果，相辅相成。人工智能在大数据的基础上如虎添翼，成为今天举世瞩目的高科技。


    大数据并不仅仅意味着数据量大。在地球绕太阳运转的过程中，每一秒记录一次地球相对于太阳的运动速度和位置，这样积累多年，得到的数据量不可谓不大，但是这样的数据并没有太大可以挖掘的价值，因为地球围绕太阳运转的物理规律已经研究得比较清楚了，不需要由计算机再次总结出万有引力定律或广义相对论来。

    '
  trans: '

    到 1969 年末，他们把网络扩充至包括犹他大学和加州大学圣塔芭芭拉分校在内的 4 个地点，ARPANET 迅速发展着。1981 年，它已经是一个包括 213
    个节点的网络系统，并以每 20 天就增加一个新节点的速度发展着。ARPANET 成为了后来互联网的技术核心和实践先驱。


    ![](img/figure_0165_0106.jpg)


    互联网诞生 35 周年纪念邮票


    1983 年 1 月 1 日是 ARPANET 的一个转折点。它采用了更加灵活和强大的分组交换协议——TCP/IP。这标志着现代互联网通信技术的真正开始，这一核心技术一直沿用至今。


    TCP/IP 是传输控制协议和互联网通信协议的英文缩写。它的发明人是美国电信工程师罗伯特·卡恩。为了开发这个协议，他招募了当时在斯坦福大学工作的文顿·瑟夫。两人合作从
    1974 年推出第一个版本到 1978 年最终定型，前后花费了 5 年时间。他们的努力为今天的互联网奠定了技术基础。


    就在美国忙于把各个大学和政府部门的计算机连接起来的时候，一个在瑞士工作的英国计算机科学家蒂姆·伯纳斯-李研究发明了基于超文本链接的万维网。这是一种通过不同的标识符号定义和规范网络文件的内容和格式的计算机语言。它让在网络上传输的不同文件有了共同的格式和标准。一场全球信息革命就这样在
    20 世纪 90 年代爆发了，并且一发不可收拾，深刻地改变了世界政治、经济、文化和生活的方方面面，更为人工智能的大飞跃悄然无声地提供了史无前例的条件和基础。


    搜索引擎、图像音乐文件共享和视频下载……围绕着互联网的蓬勃发展，各种以网络为核心的应用如雨后春笋般涌现，催生了诸如雅虎、谷歌、百度和阿里巴巴这样的互联网公司。苹果公司率先推出了智能手机，让互联网从有线网络变成无线网络，让互联网的应用范围有了无限的发展空间，让网络走进每一个人的生活。互联网不仅把世界各地联系在了一起，也把各行各业联系在了一起。这引发了人类发展史上的第三次浪潮——信息革命。网络信息呈爆炸式增长，人工智能的突破性发展正是建立在海量数据的基础之上的。可以说，没有互联网的诞生，就没有人工智能技术的起死回生。


    人工智能技术中的神经网络、机器学习等都离不开互联网上的海量数据，人工智能应用中的自动驾驶、机器人等离开了网络都寸步难行。今天，我们打车要上网，订餐要上网，读书要上网，购物要上网，订票也要上网。网络电影电视、网络新闻评论、网络游戏交友、网络视频聊天、网络教学授课……让人眼花缭乱，数不胜数。网络让世界呈现在人们手指的点击之下，地球另一边发生的事情，我们瞬间就可以知道了。


    互联网彻底改变了人类文明的发展历史，创造了一个前所未有的全新时代。


    ## 9.3 云计算


    互联网的诞生催生了云计算，这是为什么呢？云计算又是什么呢？我们还要从 20 世纪 60 年代说起。


    20 世纪 60 年代，计算机分时系统的概念开始形成。那时候还没有小型和微型计算机，只有像 IBM 这样的计算机公司制造的大型和超大型计算机。为了使这种集中配置的大型计算资源和能力被更多的部门和人员共同使用，把计算机资源按时段分配给不同的用户，让大家共同分享，成为了一种新的计算模式。这就是分时系统的概念。


    那个时候，计算机都位于被称为计算中心的专门机构里面，由专门的技术人员管理。谁要使用计算机都需要到计算中心提交使用申请，获得机时后，把自己的程序交给操作员，通过他们来实现程序在计算机上的运行。运算结果出来以后，操作员再将其交给你。


    这种集中式的计算模式不仅成本高，而且非常不方便。只有大型企业和政府高级部门才有能力建立、维护和使用这样的计算中心。于是，一些公司开始研究开发适合中小企业和地方部门使用的中小型计算机，美国的太阳微系统公司、数字设备公司等一大批公司研发的中小型计算机应运而生。IBM
    公司也与时俱进，开发出了面向个人用户的微型计算机。一时之间，计算机涌入各个办公室和寻常百姓家。


    可这里又有了一个问题。众多的计算机和计算机系统都分散在千家万户之中，“各自为政”，一方面形不成规模，另一方面又造成不同程度的资源浪费。进入 20 世纪 90
    年代，通信公司开始提供网络连接服务，将不同地方和不同部门的计算机系统连接起来形成一个网络。互联网和互联网技术诞生了。


    由通信网络连接起来的计算机系统看上去就像一朵云彩，云计算的概念处于萌芽之中。科学家和技术人员开始思考为什么不把网络上的各种资源整合起来共享给所有用户使用呢？于是，1983
    年太阳微系统公司提出了“网络就是计算机”的概念。


    1996 年，美国康柏公司在内部文件中首次使用了“云计算”这个词汇。他们意识到，互联网正在把传统意义上的通信平台转化为广泛存在的智能化的计算平台。与计算机系统这样的传统计算平台比较，互联网上需要形成类似于传统计算机的公共服务环境，以支持互联网资源的有效管理和综合利用。在传统计算机中已成熟的操作系统技术已不再适用于互联网环境。互联网上分散、独立、自主控制、自治对等和冗余的资源，应该通过整合，形成互联网资源和互联网应用的一体化服务环境，提供面向互联网计算的虚拟计算环境，使用户能够方便、有效地共享和利用开放网络上的各种资源。


    ![](img/figure_0168_0107.jpg)


    云计算


    2006 年 8 月，亚马逊公司率先推出弹性运算云端服务。紧接着在 2007 年 10 月，谷歌和 IBM 公司开始在美国大学里推广云端运算计划，可以降低分散式计算方式在学术研究方面的成本，并为这些大学提供相关的软硬件设备及技术支援，提供多达
    1600 个处理器，支援不同开源代码的平台，让学生可以通过网络开展各项以大规模运算为基础的研究。


    2008 年 7 月 29 日，雅虎、惠普和英特尔公司宣布了一项涵盖美国、德国和新加坡的联合研究计划，推出一个集 6 个数据中心为一体的云计算研究测试平台，每个数据中心配置有
    1400～4000 个处理器。这些合作伙伴包括新加坡资讯通信发展管理局、德国卡尔斯鲁厄理工学院计算中心、美国伊利诺伊大学香槟分校、英特尔研究院、惠普实验室和雅虎。


    美国戴尔公司在 2008 年 8 月向美国专利商标局申请“云计算”商标，此举旨在加强对这一未来可能重塑技术架构的术语的控制权。戴尔公司在申请文件中称，云计算是“在数据中心和巨型规模的计算环境中，为他人提供计算机硬件定制制造”。云计算正式进入了人们的视野。一场波澜壮阔的云计算革命在互联网的基础上轰轰烈烈地开始了。


    云计算让分散在千家万户的计算机资源和应用又回到了大规模集中式的计算模式上。但和 20 世纪 60 年代传统的大规模集中式计算方法不同的是，云计算不是孤立于计算中心的独立系统，而是基于互联网的相关服务的增加、使用和交互模式，它通过互联网来提供动态的、易于扩展的和虚拟化的资源。云是网络、互联网的一种比喻式说法。云计算可以让你体验每秒
    10 万亿次的运算能力，拥有这么强大的计算能力后，可以模拟核爆炸、预测气候变化和市场发展趋势。用户通过计算机和手机等方式接入数据中心，按自己的需求进行运算，足不出户就坐拥天下资源。


    人们关于云计算的定义一直众说纷纭。对于到底什么是云计算，至少可以找到上百种解释。按美国国家标准与技术研究院的定义，云计算是一种按使用量付费的模式，这种模式提供可用的、便捷的、按需的网络访问，进入可配置的计算资源共享池（资源包括网络、服务器、存储设备、应用软件及服务），无须投入太多的管理工作，或只需与服务提供商进行很少的交互，就能够快速获得这些资源。用通俗的话说，云计算就是通过网络上的大量计算资源进行计算。有了云计算，用户完全可以通过自己的个人计算机给提供云计算的服务提供商发送指令，通过服务提供商提供的大量服务器进行像“核爆炸”这样的计算，计算结果将会返回到用户自己的个人计算机上。


    ![](img/figure_0170_0108.jpg)


    云在手


    美国国家标准与技术研究院还定义了云端运算的 3 种服务模式。第一种叫软件即服务，就是消费者使用应用程序，但并不掌控作业系统、硬件或运作的网络基础架构。软件服务提供商以租赁方式向客户提供服务，而非购买。


    第二种叫平台即服务。消费者使用主机操作应用程序。消费者掌控运作应用程序的环境，也拥有主机的部分掌控权，但并不掌控作业系统、硬件或运作的网络基础架构。平台通常是应用程序基础架构。


    第三种叫基础设施即服务。消费者使用“基础运算资源”，如处理能力、储存空间、网络元件或中介软件。消费者能掌控作业系统、储存空间、已部署的应用程序及网络元件（如防火墙、负载平衡器等），但并不掌控云端基础架构。


    截至 2009 年，大部分的云计算服务是通过数据中心提供的可信赖的服务和建立在服务器上的不同层次的虚拟化技术提供的。人们可以在任何提供网络基础设施的地方使用这些服务。


    有了云计算，人们可以通过网络将庞大的运算处理程序自动分拆成无数个较小的子程序，再由多部伺服器所组成的庞大系统进行搜索、运算、分析，然后将处理结果回传给使用者。通过云端，远程的服务提供商可以在数秒之内处理数以千万计甚至亿计的资讯，达到和超级计算机同样强大的效能；可以进行像
    DNA 结构分析、基因图谱测序、癌细胞解析这样复杂的需要大量计算的工作。


    人工智能在今天的飞速发展既离不开互联网，也离不开云计算。我们前面讲过 ImageNet 国际大赛，如果没有互联网，项目组就不可能下载接近 10 亿张图片；如果没有像亚马逊网站的土耳其机器人这样的众包平台来标记这些图片，就不可能有来自世界上
    167 个国家的近 5 万名工作者协同合作，帮助项目组筛选、排序、标记这近 10 亿张照片。当然，神经网络的一代宗师辛顿教授也只能望洋兴叹，束手无策。


    ## 9.4 百科全书与谷歌大脑


    1978 年，日本通产省决定研发当时世界上尚无人研发的第五代计算机，这是日本从制造大国向经济科技强国转型的计划的一部分。电子计算机的发展经历了第一代的电子管计算机、第二代的晶体管计算机、第三代的集成电路计算机和第四代的超大规模集成电路计算机等几个阶段。日本的第五代计算机研究计划在国际上引起了一场计算机研制赶超狂潮。


    美国政府决定联合多家高科技公司在得克萨斯大学建立微电子和计算机技术公司，与日本抗衡。费根鲍姆提议，建立美国国家知识技术中心，为人类有史以来的知识建立数据库。他的学生莱纳特受到了推荐，来到了该公司。


    当时，这个具有数学和物理学背景以及人工智能博士学位的年轻人已经是人工智能领域里的一颗新星。早在斯坦福大学读博士期间，他就深得费根鲍姆、明斯基等大师的指导。写博士论文时，他利用启发式推理算法，开发了一款叫作
    AM 的程序。AM 的含义是“全自动数学家”。这款程序可以基于 300 多个数学概念，通过 200 多种启发式规则，提出各种数学方面的命题，然后进行各种计算和推理，从而判定命题的真伪。这个程序思考问题的方式非常类似于人类的数学家。


    ![](img/figure_0172_0109.jpg)


    莱纳特


    来到得克萨斯大学的莱纳特早已胸有成竹，他要建立一个百科全书式的知识库。他把这个项目命名为 Cyc，取自百科全书英文单词中间的 3 个字母。这就是最早的知识图谱。莱纳特坚定地支持他的老师费根鲍姆提出的知识原则：一个系统之所以能展示高级的智能逻辑和行为，主要是因为在所从事的领域所表示出来的特定知识，其中包括概念、事实、表示、方法、比喻和启发。他认为：“智能就是一千万条规则。”


    知识图谱从应用的角度看就是一个问答系统。这个问答系统可分成 3 个部分，第一个部分是问题理解，第二个部分是知识查询，第三个部分是答案生成。这 3 个部分相辅相成，第一个和第三个部分是自然语言处理工作，它们通过知识图谱有机地整合在一起，知识图谱是核心。当知识图谱足够大的时候，它回答问题的能力会十分惊人。


    Cyc 项目试图将人类所有的常识都输入一个计算机系统中，建立一个巨型数据库，并在此基础上实现知识推理。Cyc 知识库中包括“每棵树都是植物”和“植物最终都会死亡”这样的常识。当有人提出“树是否会死亡”的问题时，推理引擎就可以正确地回答该问题。Cyc
    知识库的规模宏大，2016 年它已经包括 63 万多个概念，关于这些概念的“常识”达到 700 万条以上。为了实现这个“大百科全书”系统，莱纳特带领了几十个研究助手，对从文学到音乐、从餐饮到体育的各种日常生活的细节进行知识编码，还开发了称为
    Cyc L 的专用编程语言。对各种领域的差异，莱纳特定义了一个名为“微型理论”的概念来进行管理。每个“微型理论”是一些“概念”和“常识”的集合，对应于人类社会中的各种细分行业或领域。这样，一些行业的“行话”或特殊的比喻就可以在一定的“情境”中被定义为“规则”，便于理解。


    今天的维基百科实际上就是一个知识图谱，它可以回答各式各样的问题。2011 年，IBM 公司开发了一个可以用自然语言和人交流的问答系统——沃森，并让它参加美国的电视智力竞赛节目《危险边缘》，战胜了当时的参赛者肯·詹宁斯和布拉德·鲁特，赢得了
    100 万美元的奖金。《危险边缘》对于计算系统来说是一个巨大的挑战，因为它涉及的学科众多，涵盖了历史、文学、政治、艺术、娱乐和科学等广泛的主题，选手们要在很短的时间内提供正确答案。


    ![](img/figure_0173_0110.jpg)


    美国电视智力竞赛节目《危险边缘》


    更困难的是，主持人提出的问题中包含反语、双关语、谜语和一些意思深奥微妙的表达方式，让计算机领会这些表达方式相当困难。沃森能够应付这类“狡猾”的试题，主要依靠它对自然语言的理解和高速计算。


    当沃森被问到某个问题的时候，100 多种运算法则会通过不同的方式对问题进行分析，并给出很多可能的答案，而这些分析都是同时进行的。在得出这些答案之后，另一组算法会对这些答案进行分析并给出得分。对于每个答案，沃森都会找出支持以及反对这个答案的证据。因此，数百个答案中的每一个都会再次引出数百条证据，同时由数百套算法对这些证据支持答案的程度进行打分。证据评估的结果越好，沃森的信心值也就越高，而评估成绩最好的答案最终会成为计算机给出的答案。但在比赛中，如果连评估成绩最好的答案都无法得到足够高的信心值，沃森就会决定不抢答这个问题，以免因为答错而输掉奖金。所有这些计算、选择与决策最多只需要
    3 秒就可以完成。


    沃森的名字用于纪念 IBM 公司的创始人托马斯·沃森先生，它是 IBM 公司 25 个科研工作者过去 4 年的研究成果。沃森评估了大约 2 亿页的内容(相当于
    100 万册书籍)。在回答问题的时候，沃森是完全自主的，也就是说不需要和网络连接。沃森可以理解自然语言的提问，分析数以百万计的信息碎片，并且根据它寻找到的证据提供最佳答案。沃森的胜利标志着人工智能专家系统和知识图谱到达了很高的水平，是对人类智能的一个挑战。


    2012 年 5 月，谷歌首次在它的搜索页面中引入知识图谱。用户通过谷歌搜索引擎，可以看到与查询的关键词有关的更加完整的答案。比如，当你输入“达·芬奇”这个关键词时，谷歌搜索引擎会在查询结果的最上方提供达·芬奇的详细信息（如个人简介、出生地点、父母姓名），展示达·芬奇的一些名画的图片（如《蒙娜丽莎》《最后的晚餐》《岩间圣母》等），甚至列出一些与达·芬奇有关的历史人物（如文艺复兴时期的主要画家米开朗基罗、拉斐尔、波提切利等）。如果单击《蒙娜丽莎》或者拉斐尔的链接，就可以看到关于这幅名画或者拉斐尔的详细信息。用户顺着知识图谱，就可以看到关于达·芬奇的各种有趣的信息，也可以顺藤摸瓜，欣赏文艺复兴时期其他艺术家的杰作。在本书的编写过程中，作者就是通过谷歌的知识图谱来获取所需的各种资料和数据的。


    ![](img/figure_0175_0111.jpg)


    谷歌知识图谱


    谷歌副总裁阿米特·辛格尔博士在他的文章《知识图谱介绍：实体，而不是字符串》中说明了什么是知识图谱。他说，用户输入的关键词的本质含义是真实世界的实体，而非抽象的字符串。知识图谱实际上就是由实体相互连接而形成的语义网络。例如，在知识图谱中，达·芬奇和《蒙娜丽莎》都是实体，《蒙娜丽莎》是达·芬奇的作品，因此这两个实体之间形成了画家和作品之间的连接。


    2012 年，谷歌知识图谱包含 5 亿多个实体，关于实体的事实和实体关系的信息有 35 亿多条。2014 年，利用人工智能技术，谷歌又开发了名为 Knowledge
    Vault 的知识库，它可以通过算法自动搜集网上的信息，利用机器学习技术把网上的信息自动变成可用知识。利用知识图谱技术，谷歌大大提升了客户的搜索体验，同时，知识图谱的庞大知识库为其他人工智能技术的整合（比如实现准确的语音识别和机器翻译等）提供了广泛和强大的基础。


    2011 年，谷歌和斯坦福大学联合成立了一个叫谷歌 X 的实验室，目的是研究开发出一款模拟人脑功能的软件，这个软件具备自学功能。谷歌的资深专家杰夫·迪恩、研究员格雷·科拉多与斯坦福大学知名人工智能专家吴恩达教授是这个实验室最初的
    3 名成员。其中，美籍华人吴恩达教授从 2006 年就开始尝试用深度学习技术来解决人工智能领域的问题，这促使他在 2011 年与迪恩和科拉多联手创立了大型深度学习软件平台
    DistBelief。这是一个架构在谷歌云计算平台上的服务。谷歌 X 实验室的科学家们通过将 1.6 万台计算机的处理器相连，建造出了世界上最大的一种大型中枢网络系统。它能自主学习，被称为谷歌大脑。谷歌大脑研发团队的口号是：“让机器更智能，以提升人类生活质量。”他们相信知识应该为全人类共享，他们在机器学习算法和技术、医疗健康、机器学习支撑计算机系统、机器人、自然语言理解、艺术创作以及知觉仿真
    7 个领域进行开发研究，并把所有科研成果公之于众。


    ## 9.5 大数据让人工智能插上了翅膀


    人工智能研究历来就有符号学派和统计学派两大阵营之分。前者更依赖具有数理逻辑的数学方法，而后者更强调概率统计的数据方法；前者更注重理论，后者更依靠经验。在人工智能的发展中，二者各有所长，难分伯仲。


    不过，神经网络、机器学习等人工智能技术都是属于统计学派的阵营。它们的成功和突破不能不感谢互联网和云计算技术的诞生和发展，是大数据让人工智能插上了新的翅膀。


    到底什么是大数据？按照麦卡锡全球研究院的定义，大数据是一种规模大到在获得、存储、管理、分析方面大大超出传统数据库软件工具的能力范围的数据集合，具有数据规模庞大、数据流转迅速、数据类型多样和价值密度低四大特征。


    大数据与互联网、云计算密不可分。大数据的数据规模让它无法在单个的计算机系统上实现，必须依赖云计算的集群处理能力和互联网的数据收集能力。所以，一种技术的产生和发展都离不开其他技术的进步和飞跃。它们互为因果，相辅相成。人工智能在大数据的基础上如虎添翼，成为今天举世瞩目的高科技。


    大数据并不仅仅意味着数据量大。在地球绕太阳运转的过程中，每一秒记录一次地球相对于太阳的运动速度和位置，这样积累多年，得到的数据量不可谓不大，但是这样的数据并没有太大可以挖掘的价值，因为地球围绕太阳运转的物理规律已经研究得比较清楚了，不需要由计算机再次总结出万有引力定律或广义相对论来。

