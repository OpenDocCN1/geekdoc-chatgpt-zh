  toc: []
- raw: '初期奖金金额为20万美元，1989年起增到25万美元，目前由谷歌公司赞助的奖金已经上升至100万美元。70名得主分别来自不同的领域，排在前6位的领域有：编译原理、程序设计语言、计算复杂性理论、人工智能、密码学以及数据库。可以看出，在某种意义上，前3个领域与计算机科学本身的联系更密切一些，后3个领域则与应用系统的联系更密切一些，人工智能就在其中。毫无疑问，图灵之后的那些人工智能之父都先后在榜上有名，他们的故事我们会继续介绍。


    # [第3章 人工智能研究的里程碑](../contents/content.xhtml#toc20)


    ## [3.1 达特茅斯学院的夏天](../contents/content.xhtml#toc21)


    1956年夏天，坐落在美国新罕布什尔州的达特茅斯学院宁静而美丽。当时正值暑假，学生们都跑出去享受夏天的阳光和乐趣了，校园里十分安静。没有人注意到一群貌不惊人的理工男正专注在自己的世界里，幻想着以自己的方式创造出一种具有人类智能的机器。他们时而高谈阔论，争吵不休；时而陷入深思，沉默寡言；时而把自己独自关在屋里，门上挂起“请勿打扰”的牌子；时而结伴在校园的草坪上散步漫行，倾心交谈。


    这群人就是后来被称为人工智能之父的“大咖”们，他们在这个夏天神不知鬼不觉地开创了一门新的学科——人工智能。这一年也因此成为人工智能元年，人工智能研究历史上的一个里程碑。


    故事还要从1948年秋天远在美国西海岸的加州理工学院说起。


    1948年9月，约翰·麦卡锡是加州理工学院的一名本科生。看上去文质彬彬、不苟言笑的他经常戴着一副理工男惯常佩戴的黑色塑料半框眼镜，这让他像他的专业数学一样乏味无趣，但他内心的朝气和才华让他造就了一门名为“人工智能”的学科。


    ![](images/figure_0051_0029.jpg)


    特达茅斯学院


    加州理工学院被称为美国西海岸的麻省理工学院。9月的气候和西海岸的风光让加州理工学院充满了浪漫和温馨，一个关于人类行为中脑机制的研讨会正在这里召开。


    作为一名大学生，麦卡锡就像海绵一样尽情地吸收着一切让他感兴趣的知识。所谓近水楼台先得月，他跑去旁听了这次会议。会上来了一位大人物，他就是设计发明了世界上第一台电子计算机的美国数学家冯·诺依曼。冯·诺依曼的题为《自动机的通用和逻辑理论》的演讲引起了麦卡锡的浓厚兴趣，让他脑洞大开。这成为了他研究人工智能的导火索。


    博士毕业后，约翰·麦卡锡来到达特茅斯学院工作。1955年夏天，他接到了负责设计研发IBM 701计算机的纳萨尼尔·罗切斯特的邀请，来到IBM公司参加短期的研究活动。在那里，他们一边工作一边热烈地讨论如何使机器像人一样处理问题。他和罗切斯特一起说服了克劳德·香农和马文·明斯基，决定来年夏天一起在达特茅斯学院进行人工智能的共同研究。香农当时是贝尔实验室的一名数学家，在交换机理论和统计信息理论方面大名鼎鼎。明斯基当时是一名研究数学和神经学的年轻的哈佛学者。


    ![](images/figure_0052_0030.jpg)


    麦卡锡


    为什么研究如何使机器像人一样处理问题需要这些不同学科不同领域的人参加呢？其实，早期对人工智能的研究并没有确定的方法和方向，可以说是八仙过海，各显其能。对此感兴趣的科学家和学者都纷纷从自己的专业领域出发探索人工智能的可能性。当时，最接近人脑工作机制的就是刚刚发明不久的电子计算机，它能像人脑一样存储数据，并且可以像人脑一样在预定程序的控制下自动进行逻辑推理和数字计算，所以计算机专家自然成为了研究人工智能的主力军。神经学家、心理学家和脑专家也由于专门从事揭开人脑工作的秘密而当之无愧地成为研究人工智能的重要力量。我们知道，数学是万学之学。任何问题最后都可以归结为数学问题，而数学又是所有问题的最终答案和解决方法，所以数学家的参与不仅是自然而然的，而且是必需的。


    到哪里去找经费来支持这项活动呢？为了筹集经费，麦卡锡亲自撰写了一份项目计划书，并给项目起了个响亮的名字叫“人工智能的夏季研究”。这是历史上第一次把用机器模仿人脑的研究工作命名为人工智能，也是历史上第一次开展人工智能专题研究。


    在计划书中，麦卡锡写道：“我们打算在暑期的两个月里组织10个人的团队，专门进行人工智能研究。研究内容将包括所有在知识学习方面的基本推测和在本质上能精确描述使机器模仿人类其他智能方面的特征，试图找到任何让机器使用语言、具有抽象能力和掌握概念的方法，解决现在只有人类才可以处理的问题，让机器具有像人一样的智能。”富于想象和诱人的描写让他们最终成功地说服美国石油大亨洛克菲勒创办的基金会，争取到了基金会的慷慨赞助，于是就有了这次后来举世闻名的聚会。


    参加这个暑期项目的人除了发起人麦卡锡、罗切斯特、香农和明斯基外，还有开发了跳棋程序的IBM公司的工程师阿瑟·塞米欧、对自动感应系统有着浓厚兴趣的麻省理工学院的奥利沃·塞尔弗里奇和瑞·所罗门诺夫、研究符号逻辑推理的科学家艾伦·纽厄尔和赫伯特·西蒙，以及来自IBM公司的另一名研究国际象棋程序的科学家伊莱克斯·伯恩斯坦。其实，具有不同背景的他们各自“心怀鬼胎”，但他们都有一个共同的目标，那就是让机器能完成当时只有人才能做的事情。


    麦卡锡一直在试图建立一种类似于英语的人工语言，使机器可以用来自行解决问题。他提出了一种“常识逻辑推理”理论。设想一个旅行者从英国的格拉斯哥经过伦敦去莫斯科，计算机程序可以按以下方式分段进行处理：从格拉斯哥到伦敦，再从伦敦到莫斯科。但是，如果假设此人不幸在伦敦丢失了机票，那么他该怎么办？在现实中，此人一般不会因此取消原来去莫斯科的计划，他很可能会再买一张机票，但是预先设计好的模拟程序不允许如此灵活。因此，需要一种更符合现实的具有常识推理能力的逻辑。


    后来，他提出了一种名为“情景演算”的理论，并发明了一种建立在数学推理的基础上的表处理语言“LISP”。但麦卡锡自己也承认，在某种语境下，进行基本的猜测常常是十分困难的。一个有趣的例子是关于美国前总统里根的一个笑话。白宫发言人奥涅尔欢迎新当选的里根总统时说：“恭喜您成为了格罗弗·克利夫兰（他指的是美国的一位前总统）。”里根微笑着答道：“我只是在电影中扮演过他一次（里根指的是棒球明星格罗弗·克利夫兰）。”这完全是张冠李戴。


    在这个小组里，香农想把信息论的概念应用到计算机和大脑模型上。香农是信息论的奠基人，他提出的关于通信信息编码的三大定理是信息论的基础，为通信信息的研究指明了方向。


    西蒙和艾伦是小组里最特殊的一对。他们曾经是师生，现在是极其亲密的合作伙伴，同为人工智能符号学派的创始人。他们带来了他们正在开发的后来被称为“逻辑理论家”的程序，其中的符号结构和启发式方法成为了后来解决智能问题的理论基础。


    ![](images/figure_0054_0031.jpg)


    几位人工智能的奠基人：特雷查德·摩尔、约翰·麦卡锡、马文·明斯基、奥利沃·塞尔弗里奇和瑞·所罗门诺夫（在2006年7月纪念达特茅斯会议50周年的聚会上）


    和小组里的其他人都不同的是明斯基。他在大学里主修物理学的同时，还一口气选修了电气工程、数学、遗传学、心理学等五花八门的学科。后来，他觉得遗传学的深度不够，物理学的吸引力不足，在博士研究生期间时改为攻读数学，成为了一名数学博士。工作以后，他的全部兴趣又落在了人工智能方面。他在神经网络研究的基础上，探索让机器可以在所在环境下通过一种抽象模型自我生成。后来，他把自己的研究写成了一篇论文《面向人工智能的步骤》，这成为后来人工智能研究的指导性文件之一。


    明斯基带到达特茅斯学院的是他发明的一个神经网络系统Snare。他曾经跟《纽约时报》的记者说：“智能问题深不见底，我想这才是值得我奉献一生的领域。”他更把自己的研究延伸到几何学中的定理论证问题上，为后来的图形图像识别领域奠定了基础。明斯基成为了第一个在人工智能领域里获得图灵奖的人。


    就是这样一群相貌普通但身怀绝技、看似无奇但内心“诡异”的人，在1956年的那个夏天，在暑期空荡的达特茅斯学院里，天马行空，追逐梦想。然而，当时没有人想到这样一个建立在参加者兴趣之上的自发的暑期研究活动竟成为了开启人工智能正式研究历史的里程碑。发起人麦卡锡、罗切斯特、香农和明斯基后来被誉为人工智能之父，这个暑期研究活动也由于为人工智能奠定了最初的理论基础和确立了主要研究方向而名驰遐迩。今天，在达特茅斯学院的贝克图书馆里，你可以看到一块高悬的匾额，用于纪念人工智能作为一门正式学科在这里开始。


    ## [3.2 克劳德·香农](../contents/content.xhtml#toc22)


    在1956年的那个夏天，参加者中的香农见证了人工智能学科的诞生。20世纪50年代，图灵和冯·诺依曼两位大师相继离世后，香农成为人工智能领域承上启下的关键人物。他的突出贡献就是信息论，因而他又有着信息论之父的称号。


    他的全名叫克劳德·香农，1916年4月30日生于美国密歇根州的佩托斯基，在一个仅有3000人的小镇上长大。别看镇子小，他却生长在一个良好的教育环境中。小时候对他影响最大的是他的祖父，一位农场主兼发明家，发明过洗衣机和许多农业机械。香农从小就十分崇拜大发明家爱迪生，后来他才知道原来爱迪生竟然是他家的远房亲戚。


    ![](images/figure_0055_0032.jpg)


    香农


    早在攻读电气工程硕士学位的时候，香农的才华就崭露头角。当时他在麻省理工学院的硕士论文题目是《继电器与开关电路的符号分析》。在学习中，他注意到电话交换电路与布尔代数之间存在相似性，布尔代数的“真”与“假”和电路系统的“开”与“关”其实是一种对应关系，可以用1和0表示。于是他用布尔代数分析并优化开关电路，奠定了数字电路的理论基础。哈佛大学的教授曾经称赞他的论文是本世纪最重要、最著名的一篇硕士论文。


    1940年，香农在博士毕业后来到了普林斯顿高等研究院工作，在那里他认识了冯·诺依曼。当时他正在研究信息的定义，怎样数量化信息，怎样更好地对信息进行编码。在这些研究中，香农提出了一种度量信息的概念，用于衡量信息的不确定性。香农原本打算用“不确定性”来表达这个概念。当他和冯·诺依曼讨论这个问题时，冯·诺依曼向香农建议说：“你应该把它称为熵。”冯·诺依曼的理由是“不确定性”这个概念已用于统计力学，而没有人知道熵到底是什么，不致引起争论。


    我们知道，质量、能量和信息量是3个非常重要的量。人们很早就知道用秤计量物质的质量，而到了19世纪中叶，热量和功的关系随着热功当量的明确和能量守恒定律的建立也逐渐清楚。“能量”一词就是它们的总称，而能量的计量则通过卡、焦耳等新单位的出现而得到解决。


    关于文字、数字、图像、声音的知识已经有几千年的历史，但是它们的总称是什么，它们如何统一地进行计量，直到19世纪末还没有被正确地提出来，更谈不上如何去解决了。20世纪初期，随着电报、电话、照相、电视、无线电、雷达等的发展，如何计量信号中的信息量就成了一个引人关注的问题。


    香农在想办法把电话中的噪声除掉时，他给出通信速率的上限，并在进行信息的定量计算时，明确地把信息量定义为随机不定性的减小。1948年，香农发表了长达数十页的论文《通信的数学理论》，正式催生了信息论。在他的通信数学模型中，他清楚地提出了信息的度量问题，并采纳了冯·诺依曼的建议，正式提出了以熵（H）命名的计算信息量的著名公式。


    ![](images/figure_0057_0033.jpg)


    香农还提出了计量信息量的单位比特。今天在计算机和通信领域中广泛使用的字节（B）、千字节（KB）、兆字节（MB）、吉字节（GB）等单位都是从比特演化而来的。比特的出现标志着人类知道了如何计量信息量。香农的信息论为明确信息量的概念做出了决定性的贡献。熵这个经典的概念跨越了信息论、物理学、数学、生态学、社会学等领域，是香农创立的信息论中最核心的概念，代表了一个系统内在的混乱程度。


    虽然香农在生前与图灵和冯·诺依曼都做过同事，但他不像他们那样——一个生前默默无闻，一个虽大名鼎鼎但也只是在业内闻名。香农可是荣登过《时代》《生活》和《通俗科学》等杂志封面的公众人物，这和他发明的一个小老鼠有关。


    这事发生在1952年，香农参加了当时的一部宣传片的拍摄。


    “大家好，我是贝尔实验室的数学家克劳德·香农。”当摄像机镜头逐渐拉近时，一位穿西装、打领带、身材修长的男人用活泼轻快的语言做自我介绍。在影片中，他演示了一只带有铜须的木制玩具老鼠，他把它叫作忒修斯。


    香农的这只木老鼠是一个走迷宫的高手。它能通过不停地随机试错，穿过一座由金属墙组成的迷宫，直到在出口处找到一块金属“奶酪”。最厉害也最具独创性的是，这只木老鼠还能记住这条路线，在下一次试验中漂亮地完成任务。在下一次试验中，即使迷宫的墙壁有所移动，都难不倒它。


    香农在影片中告诉大家：“解决一个问题并记住解决方案，涉及一定程度的心智活动，这已经有点类似于人类的大脑了。”对于当时的美国观众来说，这只木老鼠几乎就是今天科幻影视中的机器猫。一夜之间，香农就成了家喻户晓、人尽皆知的传奇人物。


    这只木老鼠以及整个迷宫系统，是香农和他的妻子花了无数个夜晚建造起来的。他说，灵感来自他对儿童积木玩具的喜爱，以及他对位于伦敦汉普顿宫中的树篱迷宫的兴趣。


    ![](images/figure_0058_0034.jpg)


    香农和他的老鼠迷宫


    其实，设计这只木老鼠以及整个迷宫系统都不过是香农和他的妻子在业余时间的娱乐。香农曾谦虚地称自己的这些玩意不过是“有趣而毫无用处”。其实，他的发明兴趣几乎是无穷无尽的，他的奇思妙想也似乎层出不穷。


    在他家的工作室中，奇妙的发明堆积如山，有火焰发射喇叭和变戏法的机器人，还有一组独轮车队、一台用罗马数字操作的计算机器等。他还和麻省理工学院的教授爱德华·索普一道发明了第一台可佩戴的计算机，可在轮盘赌时使用。他们竟然还真的跑到拉斯维加斯测试其效果，结果赚了不少钱。幸好在当时的赌场中他们没有被人发现，不然一定会被轰出赌场，永远不许再进入。


    当然，香农对人工智能的兴趣最浓厚。他在早年间就设计了会下国际象棋的计算机程序。1949年，香农发表了著名的论文《编程实现计算机下棋》，这是人工智能领域萌芽期的一篇杰作。后来击败国际象棋世界冠军的“深蓝”和击败围棋世界冠军的阿尔法狗，都是在香农开拓的机器下棋领域里的新成就。


    与冯·诺依曼和图灵一样，香农也在反法西斯战争中立下了不朽的功勋。他长期在贝尔实验室工作，他在第二次世界大战期间研究的通信理论和保密系统理论被美军采用。他参与制作的通信加密设备被用于盟军领袖罗斯福、丘吉尔、艾森豪威尔和蒙哥马利等人之间的绝密通信，保护了盟军的情报安全。这套设备在打击德国法西斯的飞机和导弹，尤其是在粉碎德国对英国发动的闪电战中发挥了重大作用，功不可没。


    克劳德·香农，让我们记住他的名字吧！


    ## [3.3 西蒙与纽厄尔](../contents/content.xhtml#toc23)


    我们必须承认，参加达特茅斯暑期项目的人一个比一个更了不起。如果说香农多才多艺、身怀绝技，那么西蒙与纽厄尔更是双剑合璧，他们是绝无仅有的一对天才。他们从认识到合作，携手共事40多年，共同成为人工智能符号学派的创始人，在学界传为佳话。


    谦虚多才的西蒙完全不是技术出身，他就读于芝加哥大学政治系，学的是政治学。1943年获得芝加哥大学的政治学博士学位后，他先后担任过多个政府部门和协会的顾问。西蒙的博学足以让世人折服。他在一生中从8所名校里获得过9个博士头衔：芝加哥大学政治学博士、凯斯工程学院科学博士、耶鲁大学科学博士和法学博士、瑞典隆德大学哲学博士、麦吉尔大学法学博士、鹿特丹伊拉斯姆斯大学经济学博士、密歇根大学法学博士以及匹兹堡大学法学博士。光是这些博士头衔就足以让人头晕目眩了，更不用说由于他在决策理论研究方面的突出贡献，他还获得过1978年度诺贝尔经济学奖。当时瑞典


    ![](images/figure_0059_0035.jpg)


    西蒙


    皇家科学院给他的评价是：“就经济学最广泛的意义来说，西蒙首先是一名经济学家，他的名字主要是与经济组织中的结构和决策这一相当新的研究领域联系在一起的。”


    其实，在芝加哥大学读本科期间，西蒙就一边吸收着大量的经济学和政治学方面的基础知识，一边熟练地掌握了高等数学、符号逻辑和数理统计等重要技能。1936年从芝加哥大学毕业的他应聘到国际城市管理者协会工作，很快成为用数学方法衡量城市公用事业的效率的专家。在那里，他第一次用上了计算机，对计算机的兴趣和实践经验对他后来的事业产生了重大影响。1949年，西蒙应邀来到卡内基·梅隆大学，先是任行政学与心理学教授，后来任计算机科学与心理学终身教授。作为该大学工业管理研究生院的创办人之一，他开创了组织行为和管理科学两大学术领域。他倡导的决策理论是以社会系统理论为基础，吸收古典管理理论、行为科学和计算机科学等的内容而发展起来的一门边缘学科。


    纽厄尔比西蒙小11岁，1927年3月19日生于旧金山。他的父亲是斯坦福医学院放射学教授，精通物理和古典文学，还擅长钓鱼、淘金和做木工。他们家在山上有一座小木屋，这是他爸爸自己亲手盖的。纽厄尔对爸爸十分崇拜，称他是“一个十全十美的知识分子”。


    ![](images/figure_0060_0036.jpg)


    纽厄尔


    有其父必有其子。纽厄尔毕业于斯坦福大学物理专业，毕业后他去普林斯顿大学研究生院攻读数学。不过一年后，他就辍学到兰德公司工作，和美国空军合作开发早期预警系统。可能这就是命运的安排，如果他不辍学到兰德公司工作，也不会那么早就认识了西蒙。在兰德公司，两人相见恨晚，十分投机。预警系统需要模拟在雷达显示屏前工作的操作人员在各种情况下的反应，这导致纽厄尔对“人如何思维”这一问题产生了兴趣。也正是从这个课题开始，纽厄尔和西蒙建立起了合作关系。


    ![](images/figure_0061_0037.jpg)


    纽厄尔和西蒙


    西蒙那时已经是卡内基理工学院（后改称卡内基·梅隆大学）工业管理系的年轻系主任，他力邀纽厄尔到卡内基理工学院，并亲自担任纽厄尔的博士生导师，开始了他们终生的合作。虽然西蒙是纽厄尔的老师，但是他们的合作是平等的。他们合作的文章的署名通常是按照字母顺序排列的，纽厄尔在前，西蒙在后。参加会议时，西蒙如果见到别人把他的名字放在纽厄尔之前，通常都会纠正过来。


    前文提到，1955年圣诞假期结束后，西蒙教授走进教室向学生们宣布：“在刚刚过去的这个圣诞节，我和我的同事纽厄尔发明了一台可以思考的机器。”他所说的就是后来他们带到达特茅斯学院的“逻辑理论家”，那是当时唯一可以工作的人工智能软件。


    “逻辑理论家”是一款计算机模拟程序，它采用了产生式系统结构，以逆向搜索为主要的工作策略，参照适当的启发法，成为第一个启发型产生式系统和第一个成功的人工智能系统。什么是产生式系统结构呢？简单地说，它就是一种模仿人类思考的过程、表达具有因果关系的知识的计算系统结构。我们通常是这样认知一个事物的：如果一种动物会飞且会下蛋，那么这种动物就是鸟。把这种认知过程用符号系统表示出来就是“逻辑理论家”的一个创举。'
  fmt: '

    初期奖金金额为20万美元，1989年起增到25万美元，目前由谷歌公司赞助的奖金已经上升至100万美元。70名得主分别来自不同的领域，排在前6位的领域有：编译原理、程序设计语言、计算复杂性理论、人工智能、密码学以及数据库。可以看出，在某种意义上，前3个领域与计算机科学本身的联系更密切一些，后3个领域则与应用系统的联系更密切一些，人工智能就在其中。毫无疑问，图灵之后的那些人工智能之父都先后在榜上有名，他们的故事我们会继续介绍。


    # 第3章 人工智能研究的里程碑


    ## 3.1 达特茅斯学院的夏天


    1956年夏天，坐落在美国新罕布什尔州的达特茅斯学院宁静而美丽。当时正值暑假，学生们都跑出去享受夏天的阳光和乐趣了，校园里十分安静。没有人注意到一群貌不惊人的理工男正专注在自己的世界里，幻想着以自己的方式创造出一种具有人类智能的机器。他们时而高谈阔论，争吵不休；时而陷入深思，沉默寡言；时而把自己独自关在屋里，门上挂起“请勿打扰”的牌子；时而结伴在校园的草坪上散步漫行，倾心交谈。


    这群人就是后来被称为人工智能之父的“大咖”们，他们在这个夏天神不知鬼不觉地开创了一门新的学科——人工智能。这一年也因此成为人工智能元年，人工智能研究历史上的一个里程碑。


    故事还要从1948年秋天远在美国西海岸的加州理工学院说起。


    1948年9月，约翰·麦卡锡是加州理工学院的一名本科生。看上去文质彬彬、不苟言笑的他经常戴着一副理工男惯常佩戴的黑色塑料半框眼镜，这让他像他的专业数学一样乏味无趣，但他内心的朝气和才华让他造就了一门名为“人工智能”的学科。


    ![](images/figure_0051_0029.jpg)


    特达茅斯学院


    加州理工学院被称为美国西海岸的麻省理工学院。9月的气候和西海岸的风光让加州理工学院充满了浪漫和温馨，一个关于人类行为中脑机制的研讨会正在这里召开。


    作为一名大学生，麦卡锡就像海绵一样尽情地吸收着一切让他感兴趣的知识。所谓近水楼台先得月，他跑去旁听了这次会议。会上来了一位大人物，他就是设计发明了世界上第一台电子计算机的美国数学家冯·诺依曼。冯·诺依曼的题为《自动机的通用和逻辑理论》的演讲引起了麦卡锡的浓厚兴趣，让他脑洞大开。这成为了他研究人工智能的导火索。


    博士毕业后，约翰·麦卡锡来到达特茅斯学院工作。1955年夏天，他接到了负责设计研发`IBM 701`计算机的纳萨尼尔·罗切斯特的邀请，来到IBM公司参加短期的研究活动。在那里，他们一边工作一边热烈地讨论如何使机器像人一样处理问题。他和罗切斯特一起说服了克劳德·香农和马文·明斯基，决定来年夏天一起在达特茅斯学院进行人工智能的共同研究。香农当时是贝尔实验室的一名数学家，在交换机理论和统计信息理论方面大名鼎鼎。明斯基当时是一名研究数学和神经学的年轻的哈佛学者。


    ![](images/figure_0052_0030.jpg)


    麦卡锡


    为什么研究如何使机器像人一样处理问题需要这些不同学科不同领域的人参加呢？其实，早期对人工智能的研究并没有确定的方法和方向，可以说是八仙过海，各显其能。对此感兴趣的科学家和学者都纷纷从自己的专业领域出发探索人工智能的可能性。当时，最接近人脑工作机制的就是刚刚发明不久的电子计算机，它能像人脑一样存储数据，并且可以像人脑一样在预定程序的控制下自动进行逻辑推理和数字计算，所以计算机专家自然成为了研究人工智能的主力军。神经学家、心理学家和脑专家也由于专门从事揭开人脑工作的秘密而当之无愧地成为研究人工智能的重要力量。我们知道，数学是万学之学。任何问题最后都可以归结为数学问题，而数学又是所有问题的最终答案和解决方法，所以数学家的参与不仅是自然而然的，而且是必需的。


    到哪里去找经费来支持这项活动呢？为了筹集经费，麦卡锡亲自撰写了一份项目计划书，并给项目起了个响亮的名字叫`人工智能的夏季研究`。这是历史上第一次把用机器模仿人脑的研究工作命名为人工智能，也是历史上第一次开展人工智能专题研究。


    在计划书中，麦卡锡写道：“我们打算在暑期的两个月里组织10个人的团队，专门进行人工智能研究。研究内容将包括所有在知识学习方面的基本推测和在本质上能精确描述使机器模仿人类其他智能方面的特征，试图找到任何让机器使用语言、具有抽象能力和掌握概念的方法，解决现在只有人类才可以处理的问题，让机器具有像人一样的智能。”富于想象和诱人的描写让他们最终成功地说服美国石油大亨洛克菲勒创办的基金会，争取到了基金会的慷慨赞助，于是就有了这次后来举世闻名的聚会。


    参加这个暑期项目的人除了发起人麦卡锡、罗切斯特、香农和明斯基外，还有开发了跳棋程序的IBM公司的工程师阿瑟·塞米欧、对自动感应系统有着浓厚兴趣的麻省理工学院的奥利沃·塞尔弗里奇和瑞·所罗门诺夫、研究符号逻辑推理的科学家艾伦·纽厄尔和赫伯特·西蒙，以及来自IBM公司的另一名研究国际象棋程序的科学家伊莱克斯·伯恩斯坦。其实，具有不同背景的他们各自“心怀鬼胎”，但他们都有一个共同的目标，那就是让机器能完成当时只有人才能做的事情。


    麦卡锡一直在试图建立一种类似于英语的人工语言，使机器可以用来自行解决问题。他提出了一种“常识逻辑推理”理论。设想一个旅行者从英国的格拉斯哥经过伦敦去莫斯科，计算机程序可以按以下方式分段进行处理：从格拉斯哥到伦敦，再从伦敦到莫斯科。但是，如果假设此人不幸在伦敦丢失了机票，那么他该怎么办？在现实中，此人一般不会因此取消原来去莫斯科的计划，他很可能会再买一张机票，但是预先设计好的模拟程序不允许如此灵活。因此，需要一种更符合现实的具有常识推理能力的逻辑。


    后来，他提出了一种名为“情景演算”的理论，并发明了一种建立在数学推理的基础上的表处理语言`LISP`。但麦卡锡自己也承认，在某种语境下，进行基本的猜测常常是十分困难的。一个有趣的例子是关于美国前总统里根的一个笑话。白宫发言人奥涅尔欢迎新当选的里根总统时说：“恭喜您成为了格罗弗·克利夫兰（他指的是美国的一位前总统）。”里根微笑着答道：“我只是在电影中扮演过他一次（里根指的是棒球明星格罗弗·克利夫兰）。”这完全是张冠李戴。


    在这个小组里，香农想把信息论的概念应用到计算机和大脑模型上。香农是信息论的奠基人，他提出的关于通信信息编码的三大定理是信息论的基础，为通信信息的研究指明了方向。


    西蒙和艾伦是小组里最特殊的一对。他们曾经是师生，现在是极其亲密的合作伙伴，同为人工智能符号学派的创始人。他们带来了他们正在开发的后来被称为`逻辑理论家`的程序，其中的符号结构和启发式方法成为了后来解决智能问题的理论基础。


    ![](images/figure_0054_0031.jpg)


    几位人工智能的奠基人：特雷查德·摩尔、约翰·麦卡锡、马文·明斯基、奥利沃·塞尔弗里奇和瑞·所罗门诺夫（在2006年7月纪念达特茅斯会议50周年的聚会上）


    和小组里的其他人都不同的是明斯基。他在大学里主修物理学的同时，还一口气选修了电气工程、数学、遗传学、心理学等五花八门的学科。后来，他觉得遗传学的深度不够，物理学的吸引力不足，在博士研究生期间时改为攻读数学，成为了一名数学博士。工作以后，他的全部兴趣又落在了人工智能方面。他在神经网络研究的基础上，探索让机器可以在所在环境下通过一种抽象模型自我生成。后来，他把自己的研究写成了一篇论文《面向人工智能的步骤》，这成为后来人工智能研究的指导性文件之一。


    明斯基带到达特茅斯学院的是他发明的一个神经网络系统`Snare`。他曾经跟《纽约时报》的记者说：“智能问题深不见底，我想这才是值得我奉献一生的领域。”他更把自己的研究延伸到几何学中的定理论证问题上，为后来的图形图像识别领域奠定了基础。明斯基成为了第一个在人工智能领域里获得图灵奖的人。


    就是这样一群相貌普通但身怀绝技、看似无奇但内心“诡异”的人，在1956年的那个夏天，在暑期空荡的达特茅斯学院里，天马行空，追逐梦想。然而，当时没有人想到这样一个建立在参加者兴趣之上的自发的暑期研究活动竟成为了开启人工智能正式研究历史的里程碑。发起人麦卡锡、罗切斯特、香农和明斯基后来被誉为人工智能之父，这个暑期研究活动也由于为人工智能奠定了最初的理论基础和确立了主要研究方向而名驰遐迩。今天，在达特茅斯学院的贝克图书馆里，你可以看到一块高悬的匾额，用于纪念人工智能作为一门正式学科在这里开始。


    ## 3.2 克劳德·香农


    在1956年的那个夏天，参加者中的香农见证了人工智能学科的诞生。20世纪50年代，图灵和冯·诺依曼两位大师相继离世后，香农成为人工智能领域承上启下的关键人物。他的突出贡献就是信息论，因而他又有着信息论之父的称号。


    他的全名叫克劳德·香农，1916年4月30日生于美国密歇根州的佩托斯基，在一个仅有3000人的小镇上长大。别看镇子小，他却生长在一个良好的教育环境中。小时候对他影响最大的是他的祖父，一位农场主兼发明家，发明过洗衣机和许多农业机械。香农从小就十分崇拜大发明家爱迪生，后来他才知道原来爱迪生竟然是他家的远房亲戚。


    ![](images/figure_0055_0032.jpg)


    香农


    早在攻读电气工程硕士学位的时候，香农的才华就崭露头角。当时他在麻省理工学院的硕士论文题目是《继电器与开关电路的符号分析》。在学习中，他注意到电话交换电路与布尔代数之间存在相似性，布尔代数的“真”与“假”和电路系统的“开”与“关”其实是一种对应关系，可以用1和0表示。于是他用布尔代数分析并优化开关电路，奠定了数字电路的理论基础。哈佛大学的教授曾经称赞他的论文是本世纪最重要、最著名的一篇硕士论文。


    1940年，香农在博士毕业后来到了普林斯顿高等研究院工作，在那里他认识了冯·诺依曼。当时他正在研究信息的定义，怎样数量化信息，怎样更好地对信息进行编码。在这些研究中，香农提出了一种度量信息的概念，用于衡量信息的不确定性。香农原本打算用“不确定性”来表达这个概念。当他和冯·诺依曼讨论这个问题时，冯·诺依曼向香农建议说：“你应该把它称为熵。”冯·诺依曼的理由是“不确定性”这个概念已用于统计力学，而没有人知道熵到底是什么，不致引起争论。


    我们知道，质量、能量和信息量是3个非常重要的量。人们很早就知道用秤计量物质的质量，而到了19世纪中叶，热量和功的关系随着热功当量的明确和能量守恒定律的建立也逐渐清楚。“能量”一词就是它们的总称，而能量的计量则通过卡、焦耳等新单位的出现而得到解决。


    关于文字、数字、图像、声音的知识已经有几千年的历史，但是它们的总称是什么，它们如何统一地进行计量，直到19世纪末还没有被正确地提出来，更谈不上如何去解决了。20世纪初期，随着电报、电话、照相、电视、无线电、雷达等的发展，如何计量信号中的信息量就成了一个引人关注的问题。


    香农在想办法把电话中的噪声除掉时，他给出通信速率的上限，并在进行信息的定量计算时，明确地把信息量定义为随机不定性的减小。1948年，香农发表了长达数十页的论文《通信的数学理论》，正式催生了信息论。在他的通信数学模型中，他清楚地提出了信息的度量问题，并采纳了冯·诺依曼的建议，正式提出了以熵（`H`）命名的计算信息量的著名公式。


    ![](images/figure_0057_0033.jpg)


    香农还提出了计量信息量的单位比特。今天在计算机和通信领域中广泛使用的字节（`B`）、千字节（`KB`）、兆字节（`MB`）、吉字节（`GB`）等单位都是从比特演化而来的。比特的出现标志着人类知道了如何计量信息量。香农的信息论为明确信息量的概念做出了决定性的贡献。熵这个经典的概念跨越了信息论、物理学、数学、生态学、社会学等领域，是香农创立的信息论中最核心的概念，代表了一个系统内在的混乱程度。


    虽然香农在生前与图灵和冯·诺依曼都做过同事，但他不像他们那样——一个生前默默无闻，一个虽大名鼎鼎但也只是在业内闻名。香农可是荣登过《时代》《生活》和《通俗科学》等杂志封面的公众人物，这和他发明的一个小老鼠有关。


    这事发生在1952年，香农参加了当时的一部宣传片的拍摄。


    “大家好，我是贝尔实验室的数学家克劳德·香农。”当摄像机镜头逐渐拉近时，一位穿西装、打领带、身材修长的男人用活泼轻快的语言做自我介绍。在影片中，他演示了一只带有铜须的木制玩具老鼠，他把它叫作忒修斯。


    香农的这只木老鼠是一个走迷宫的高手。它能通过不停地随机试错，穿过一座由金属墙组成的迷宫，直到在出口处找到一块金属“奶酪”。最厉害也最具独创性的是，这只木老鼠还能记住这条路线，在下一次试验中漂亮地完成任务。在下一次试验中，即使迷宫的墙壁有所移动，都难不倒它。


    香农在影片中告诉大家：“解决一个问题并记住解决方案，涉及一定程度的心智活动，这已经有点类似于人类的大脑了。”对于当时的美国观众来说，这只木老鼠几乎就是今天科幻影视中的机器猫。一夜之间，香农就成了家喻户晓、人尽皆知的传奇人物。


    这只木老鼠以及整个迷宫系统，是香农和他的妻子花了无数个夜晚建造起来的。他说，灵感来自他对儿童积木玩具的喜爱，以及他对位于伦敦汉普顿宫中的树篱迷宫的兴趣。


    ![](images/figure_0058_0034.jpg)


    香农和他的老鼠迷宫


    其实，设计这只木老鼠以及整个迷宫系统都不过是香农和他的妻子在业余时间的娱乐。香农曾谦虚地称自己的这些玩意不过是“有趣而毫无用处”。其实，他的发明兴趣几乎是无穷无尽的，他的奇思妙想也似乎层出不穷。


    在他家的工作室中，奇妙的发明堆积如山，有火焰发射喇叭和变戏法的机器人，还有一组独轮车队、一台用罗马数字操作的计算机器等。他还和麻省理工学院的教授爱德华·索普一道发明了第一台可佩戴的计算机，可在轮盘赌时使用。他们竟然还真的跑到拉斯维加斯测试其效果，结果赚了不少钱。幸好在当时的赌场中他们没有被人发现，不然一定会被轰出赌场，永远不许再进入。


    当然，香农对人工智能的兴趣最浓厚。他在早年间就设计了会下国际象棋的计算机程序。1949年，香农发表了著名的论文《编程实现计算机下棋》，这是人工智能领域萌芽期的一篇杰作。后来击败国际象棋世界冠军的“深蓝”和击败围棋世界冠军的阿尔法狗，都是在香农开拓的机器下棋领域里的新成就。


    与冯·诺依曼和图灵一样，香农也在反法西斯战争中立下了不朽的功勋。他长期在贝尔实验室工作，他在第二次世界大战期间研究的通信理论和保密系统理论被美军采用。他参与制作的通信加密设备被用于盟军领袖罗斯福、丘吉尔、艾森豪威尔和蒙哥马利等人之间的绝密通信，保护了盟军的情报安全。这套设备在打击德国法西斯的飞机和导弹，尤其是在粉碎德国对英国发动的闪电战中发挥了重大作用，功不可没。


    克劳德·香农，让我们记住他的名字吧！


    ## 3.3 西蒙与纽厄尔


    我们必须承认，参加达特茅斯暑期项目的人一个比一个更了不起。如果说香农多才多艺、身怀绝技，那么西蒙与纽厄尔更是双剑合璧，他们是绝无仅有的一对天才。他们从认识到合作，携手共事40多年，共同成为人工智能符号学派的创始人，在学界传为佳话。


    谦虚多才的西蒙完全不是技术出身，他就读于芝加哥大学政治系，学的是政治学。1943年获得芝加哥大学的政治学博士学位后，他先后担任过多个政府部门和协会的顾问。西蒙的博学足以让世人折服。他在一生中从8所名校里获得过9个博士头衔：芝加哥大学政治学博士、凯斯工程学院科学博士、耶鲁大学科学博士和法学博士、瑞典隆德大学哲学博士、麦吉尔大学法学博士、鹿特丹伊拉斯姆斯大学经济学博士、密歇根大学法学博士以及匹兹堡大学法学博士。光是这些博士头衔就足以让人头晕目眩了，更不用说由于他在决策理论研究方面的突出贡献，他还获得过1978年度诺贝尔经济学奖。当时瑞典


    ![](images/figure_0059_0035.jpg)


    西蒙


    皇家科学院给他的评价是：“就经济学最广泛的意义来说，西蒙首先是一名经济学家，他的名字主要是与经济组织中的结构和决策这一相当新的研究领域联系在一起的。”


    其实，在芝加哥大学读本科期间，西蒙就一边吸收着大量的经济学和政治学方面的基础知识，一边熟练地掌握了高等数学、符号逻辑和数理统计等重要技能。1936年从芝加哥大学毕业的他应聘到国际城市管理者协会工作，很快成为用数学方法衡量城市公用事业的效率的专家。在那里，他第一次用上了计算机，对计算机的兴趣和实践经验对他后来的事业产生了重大影响。1949年，西蒙应邀来到卡内基·梅隆大学，先是任行政学与心理学教授，后来任计算机科学与心理学终身教授。作为该大学工业管理研究生院的创办人之一，他开创了组织行为和管理科学两大学术领域。他倡导的决策理论是以社会系统理论为基础，吸收古典管理理论、行为科学和计算机科学等的内容而发展起来的一门边缘学科。


    纽厄尔比西蒙小11岁，1927年3月19日生于旧金山。他的父亲是斯坦福医学院放射学教授，精通物理和古典文学，还擅长钓鱼、淘金和做木工。他们家在山上有一座小木屋，这是他爸爸自己亲手盖的。纽厄尔对爸爸十分崇拜，称他是“一个十全十美的知识分子”。


    ![](images/figure_0060_0036.jpg)


    纽厄尔


    有其父必有其子。纽厄尔毕业于斯坦福大学物理专业，毕业后他去普林斯顿大学研究生院攻读数学。不过一年后，他就辍学到兰德公司工作，和美国空军合作开发早期预警系统。可能这就是命运的安排，如果他不辍学到兰德公司工作，也不会那么早就认识了西蒙。在兰德公司，两人相见恨晚，十分投机。预警系统需要模拟在雷达显示屏前工作的操作人员在各种情况下的反应，这导致纽厄尔对“人如何思维”这一问题产生了兴趣。也正是从这个课题开始，纽厄尔和西蒙建立起了合作关系。


    ![](images/figure_0061_0037.jpg)


    纽厄尔和西蒙


    西蒙那时已经是卡内基理工学院（后改称卡内基·梅隆大学）工业管理系的年轻系主任，他力邀纽厄尔到卡内基理工学院，并亲自担任纽厄尔的博士生导师，开始了他们终生的合作。虽然西蒙是纽厄尔的老师，但是他们的合作是平等的。他们合作的文章的署名通常是按照字母顺序排列的，纽厄尔在前，西蒙在后。参加会议时，西蒙如果见到别人把他的名字放在纽厄尔之前，通常都会纠正过来。


    前文提到，1955年圣诞假期结束后，西蒙教授走进教室向学生们宣布：“在刚刚过去的这个圣诞节，我和我的同事纽厄尔发明了一台可以思考的机器。”他所说的就是后来他们带到达特茅斯学院的`逻辑理论家`，那是当时唯一可以工作的人工智能软件。


    `逻辑理论家`是一款计算机模拟程序，它采用了产生式系统结构，以逆向搜索为主要的工作策略，参照适当的启发法，成为第一个启发型产生式系统和第一个成功的人工智能系统。什么是产生式系统结构呢？简单地说，它就是一种模仿人类思考的过程、表达具有因果关系的知识的计算系统结构。我们通常是这样认知一个事物的：如果一种动物会飞且会下蛋，那么这种动物就是鸟。把这种认知过程用符号系统表示出来就是`逻辑理论家`的一个创举。

