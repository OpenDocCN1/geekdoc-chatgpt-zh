  trans: '


    初期奖金金额为 20 万美元，1989 年起增到 25 万美元，目前由谷歌公司赞助的奖金已经上升至 100 万美元。70 名得主分别来自不同的领域，排在前
    6 位的领域有：编译原理、程序设计语言、计算复杂性理论、人工智能、密码学以及数据库。可以看出，在某种意义上，前 3 个领域与计算机科学本身的联系更密切一些，后
    3 个领域则与应用系统的联系更密切一些，人工智能就在其中。毫无疑问，图灵之后的那些人工智能之父都先后在榜上有名，他们的故事我们会继续介绍。


    # 第 3 章 人工智能研究的里程碑


    ## 3.1 达特茅斯学院的夏天


    1956 年夏天，坐落在美国新罕布什尔州的达特茅斯学院宁静而美丽。当时正值暑假，学生们都跑出去享受夏天的阳光和乐趣了，校园里十分安静。没有人注意到一群貌不惊人的理工男正专注在自己的世界里，幻想着以自己的方式创造出一种具有人类智能的机器。他们时而高谈阔论，争吵不休；时而陷入深思，沉默寡言；时而把自己独自关在屋里，门上挂起“请勿打扰”的牌子；时而结伴在校园的草坪上散步漫行，倾心交谈。


    这群人就是后来被称为人工智能之父的“大咖”们，他们在这个夏天神不知鬼不觉地开创了一门新的学科——人工智能。这一年也因此成为人工智能元年，人工智能研究历史上的一个里程碑。


    故事还要从 1948 年秋天远在美国西海岸的加州理工学院说起。


    1948 年 9 月，约翰·麦卡锡是加州理工学院的一名本科生。看上去文质彬彬、不苟言笑的他经常戴着一副理工男惯常佩戴的黑色塑料半框眼镜，这让他像他的专业数学一样乏味无趣，但他内心的朝气和才华让他造就了一门名为“人工智能”的学科。


    ![](img/figure_0051_0029.jpg)


    特达茅斯学院


    加州理工学院被称为美国西海岸的麻省理工学院。9 月的气候和西海岸的风光让加州理工学院充满了浪漫和温馨，一个关于人类行为中脑机制的研讨会正在这里召开。


    作为一名大学生，麦卡锡就像海绵一样尽情地吸收着一切让他感兴趣的知识。所谓近水楼台先得月，他跑去旁听了这次会议。会上来了一位大人物，他就是设计发明了世界上第一台电子计算机的美国数学家冯·诺依曼。冯·诺依曼的题为《自动机的通用和逻辑理论》的演讲引起了麦卡锡的浓厚兴趣，让他脑洞大开。这成为了他研究人工智能的导火索。


    博士毕业后，约翰·麦卡锡来到达特茅斯学院工作。1955 年夏天，他接到了负责设计研发`IBM 701`计算机的纳萨尼尔·罗切斯特的邀请，来到 IBM 公司参加短期的研究活动。在那里，他们一边工作一边热烈地讨论如何使机器像人一样处理问题。他和罗切斯特一起说服了克劳德·香农和马文·明斯基，决定来年夏天一起在达特茅斯学院进行人工智能的共同研究。香农当时是贝尔实验室的一名数学家，在交换机理论和统计信息理论方面大名鼎鼎。明斯基当时是一名研究数学和神经学的年轻的哈佛学者。


    ![](img/figure_0052_0030.jpg)


    麦卡锡


    为什么研究如何使机器像人一样处理问题需要这些不同学科不同领域的人参加呢？其实，早期对人工智能的研究并没有确定的方法和方向，可以说是八仙过海，各显其能。对此感兴趣的科学家和学者都纷纷从自己的专业领域出发探索人工智能的可能性。当时，最接近人脑工作机制的就是刚刚发明不久的电子计算机，它能像人脑一样存储数据，并且可以像人脑一样在预定程序的控制下自动进行逻辑推理和数字计算，所以计算机专家自然成为了研究人工智能的主力军。神经学家、心理学家和脑专家也由于专门从事揭开人脑工作的秘密而当之无愧地成为研究人工智能的重要力量。我们知道，数学是万学之学。任何问题最后都可以归结为数学问题，而数学又是所有问题的最终答案和解决方法，所以数学家的参与不仅是自然而然的，而且是必需的。


    到哪里去找经费来支持这项活动呢？为了筹集经费，麦卡锡亲自撰写了一份项目计划书，并给项目起了个响亮的名字叫`人工智能的夏季研究`。这是历史上第一次把用机器模仿人脑的研究工作命名为人工智能，也是历史上第一次开展人工智能专题研究。


    在计划书中，麦卡锡写道：“我们打算在暑期的两个月里组织 10 个人的团队，专门进行人工智能研究。研究内容将包括所有在知识学习方面的基本推测和在本质上能精确描述使机器模仿人类其他智能方面的特征，试图找到任何让机器使用语言、具有抽象能力和掌握概念的方法，解决现在只有人类才可以处理的问题，让机器具有像人一样的智能。”富于想象和诱人的描写让他们最终成功地说服美国石油大亨洛克菲勒创办的基金会，争取到了基金会的慷慨赞助，于是就有了这次后来举世闻名的聚会。


    参加这个暑期项目的人除了发起人麦卡锡、罗切斯特、香农和明斯基外，还有开发了跳棋程序的 IBM 公司的工程师阿瑟·塞米欧、对自动感应系统有着浓厚兴趣的麻省理工学院的奥利沃·塞尔弗里奇和瑞·所罗门诺夫、研究符号逻辑推理的科学家艾伦·纽厄尔和赫伯特·西蒙，以及来自
    IBM 公司的另一名研究国际象棋程序的科学家伊莱克斯·伯恩斯坦。其实，具有不同背景的他们各自“心怀鬼胎”，但他们都有一个共同的目标，那就是让机器能完成当时只有人才能做的事情。


    麦卡锡一直在试图建立一种类似于英语的人工语言，使机器可以用来自行解决问题。他提出了一种“常识逻辑推理”理论。设想一个旅行者从英国的格拉斯哥经过伦敦去莫斯科，计算机程序可以按以下方式分段进行处理：从格拉斯哥到伦敦，再从伦敦到莫斯科。但是，如果假设此人不幸在伦敦丢失了机票，那么他该怎么办？在现实中，此人一般不会因此取消原来去莫斯科的计划，他很可能会再买一张机票，但是预先设计好的模拟程序不允许如此灵活。因此，需要一种更符合现实的具有常识推理能力的逻辑。


    后来，他提出了一种名为“情景演算”的理论，并发明了一种建立在数学推理的基础上的表处理语言`LISP`。但麦卡锡自己也承认，在某种语境下，进行基本的猜测常常是十分困难的。一个有趣的例子是关于美国前总统里根的一个笑话。白宫发言人奥涅尔欢迎新当选的里根总统时说：“恭喜您成为了格罗弗·克利夫兰（他指的是美国的一位前总统）。”里根微笑着答道：“我只是在电影中扮演过他一次（里根指的是棒球明星格罗弗·克利夫兰）。”这完全是张冠李戴。


    在这个小组里，香农想把信息论的概念应用到计算机和大脑模型上。香农是信息论的奠基人，他提出的关于通信信息编码的三大定理是信息论的基础，为通信信息的研究指明了方向。


    西蒙和艾伦是小组里最特殊的一对。他们曾经是师生，现在是极其亲密的合作伙伴，同为人工智能符号学派的创始人。他们带来了他们正在开发的后来被称为`逻辑理论家`的程序，其中的符号结构和启发式方法成为了后来解决智能问题的理论基础。


    ![](img/figure_0054_0031.jpg)


    几位人工智能的奠基人：特雷查德·摩尔、约翰·麦卡锡、马文·明斯基、奥利沃·塞尔弗里奇和瑞·所罗门诺夫（在 2006 年 7 月纪念达特茅斯会议 50 周年的聚会上）


    和小组里的其他人都不同的是明斯基。他在大学里主修物理学的同时，还一口气选修了电气工程、数学、遗传学、心理学等五花八门的学科。后来，他觉得遗传学的深度不够，物理学的吸引力不足，在博士研究生期间时改为攻读数学，成为了一名数学博士。工作以后，他的全部兴趣又落在了人工智能方面。他在神经网络研究的基础上，探索让机器可以在所在环境下通过一种抽象模型自我生成。后来，他把自己的研究写成了一篇论文《面向人工智能的步骤》，这成为后来人工智能研究的指导性文件之一。


    明斯基带到达特茅斯学院的是他发明的一个神经网络系统`Snare`。他曾经跟《纽约时报》的记者说：“智能问题深不见底，我想这才是值得我奉献一生的领域。”他更把自己的研究延伸到几何学中的定理论证问题上，为后来的图形图像识别领域奠定了基础。明斯基成为了第一个在人工智能领域里获得图灵奖的人。


    就是这样一群相貌普通但身怀绝技、看似无奇但内心“诡异”的人，在 1956 年的那个夏天，在暑期空荡的达特茅斯学院里，天马行空，追逐梦想。然而，当时没有人想到这样一个建立在参加者兴趣之上的自发的暑期研究活动竟成为了开启人工智能正式研究历史的里程碑。发起人麦卡锡、罗切斯特、香农和明斯基后来被誉为人工智能之父，这个暑期研究活动也由于为人工智能奠定了最初的理论基础和确立了主要研究方向而名驰遐迩。今天，在达特茅斯学院的贝克图书馆里，你可以看到一块高悬的匾额，用于纪念人工智能作为一门正式学科在这里开始。


    ## 3.2 克劳德·香农


    在 1956 年的那个夏天，参加者中的香农见证了人工智能学科的诞生。20 世纪 50 年代，图灵和冯·诺依曼两位大师相继离世后，香农成为人工智能领域承上启下的关键人物。他的突出贡献就是信息论，因而他又有着信息论之父的称号。


    他的全名叫克劳德·香农，1916 年 4 月 30 日生于美国密歇根州的佩托斯基，在一个仅有 3000 人的小镇上长大。别看镇子小，他却生长在一个良好的教育环境中。小时候对他影响最大的是他的祖父，一位农场主兼发明家，发明过洗衣机和许多农业机械。香农从小就十分崇拜大发明家爱迪生，后来他才知道原来爱迪生竟然是他家的远房亲戚。


    ![](img/figure_0055_0032.jpg)


    香农


    早在攻读电气工程硕士学位的时候，香农的才华就崭露头角。当时他在麻省理工学院的硕士论文题目是《继电器与开关电路的符号分析》。在学习中，他注意到电话交换电路与布尔代数之间存在相似性，布尔代数的“真”与“假”和电路系统的“开”与“关”其实是一种对应关系，可以用
    1 和 0 表示。于是他用布尔代数分析并优化开关电路，奠定了数字电路的理论基础。哈佛大学的教授曾经称赞他的论文是本世纪最重要、最著名的一篇硕士论文。


    1940 年，香农在博士毕业后来到了普林斯顿高等研究院工作，在那里他认识了冯·诺依曼。当时他正在研究信息的定义，怎样数量化信息，怎样更好地对信息进行编码。在这些研究中，香农提出了一种度量信息的概念，用于衡量信息的不确定性。香农原本打算用“不确定性”来表达这个概念。当他和冯·诺依曼讨论这个问题时，冯·诺依曼向香农建议说：“你应该把它称为熵。”冯·诺依曼的理由是“不确定性”这个概念已用于统计力学，而没有人知道熵到底是什么，不致引起争论。


    我们知道，质量、能量和信息量是 3 个非常重要的量。人们很早就知道用秤计量物质的质量，而到了 19 世纪中叶，热量和功的关系随着热功当量的明确和能量守恒定律的建立也逐渐清楚。“能量”一词就是它们的总称，而能量的计量则通过卡、焦耳等新单位的出现而得到解决。


    关于文字、数字、图像、声音的知识已经有几千年的历史，但是它们的总称是什么，它们如何统一地进行计量，直到 19 世纪末还没有被正确地提出来，更谈不上如何去解决了。20
    世纪初期，随着电报、电话、照相、电视、无线电、雷达等的发展，如何计量信号中的信息量就成了一个引人关注的问题。


    香农在想办法把电话中的噪声除掉时，他给出通信速率的上限，并在进行信息的定量计算时，明确地把信息量定义为随机不定性的减小。1948 年，香农发表了长达数十页的论文《通信的数学理论》，正式催生了信息论。在他的通信数学模型中，他清楚地提出了信息的度量问题，并采纳了冯·诺依曼的建议，正式提出了以熵（`H`）命名的计算信息量的著名公式。


    ![](img/figure_0057_0033.jpg)


    香农还提出了计量信息量的单位比特。今天在计算机和通信领域中广泛使用的字节（`B`）、千字节（`KB`）、兆字节（`MB`）、吉字节（`GB`）等单位都是从比特演化而来的。比特的出现标志着人类知道了如何计量信息量。香农的信息论为明确信息量的概念做出了决定性的贡献。熵这个经典的概念跨越了信息论、物理学、数学、生态学、社会学等领域，是香农创立的信息论中最核心的概念，代表了一个系统内在的混乱程度。


    虽然香农在生前与图灵和冯·诺依曼都做过同事，但他不像他们那样——一个生前默默无闻，一个虽大名鼎鼎但也只是在业内闻名。香农可是荣登过《时代》《生活》和《通俗科学》等杂志封面的公众人物，这和他发明的一个小老鼠有关。


    这事发生在 1952 年，香农参加了当时的一部宣传片的拍摄。


    “大家好，我是贝尔实验室的数学家克劳德·香农。”当摄像机镜头逐渐拉近时，一位穿西装、打领带、身材修长的男人用活泼轻快的语言做自我介绍。在影片中，他演示了一只带有铜须的木制玩具老鼠，他把它叫作忒修斯。


    香农的这只木老鼠是一个走迷宫的高手。它能通过不停地随机试错，穿过一座由金属墙组成的迷宫，直到在出口处找到一块金属“奶酪”。最厉害也最具独创性的是，这只木老鼠还能记住这条路线，在下一次试验中漂亮地完成任务。在下一次试验中，即使迷宫的墙壁有所移动，都难不倒它。


    香农在影片中告诉大家：“解决一个问题并记住解决方案，涉及一定程度的心智活动，这已经有点类似于人类的大脑了。”对于当时的美国观众来说，这只木老鼠几乎就是今天科幻影视中的机器猫。一夜之间，香农就成了家喻户晓、人尽皆知的传奇人物。


    这只木老鼠以及整个迷宫系统，是香农和他的妻子花了无数个夜晚建造起来的。他说，灵感来自他对儿童积木玩具的喜爱，以及他对位于伦敦汉普顿宫中的树篱迷宫的兴趣。


    ![](img/figure_0058_0034.jpg)


    香农和他的老鼠迷宫


    其实，设计这只木老鼠以及整个迷宫系统都不过是香农和他的妻子在业余时间的娱乐。香农曾谦虚地称自己的这些玩意不过是“有趣而毫无用处”。其实，他的发明兴趣几乎是无穷无尽的，他的奇思妙想也似乎层出不穷。


    在他家的工作室中，奇妙的发明堆积如山，有火焰发射喇叭和变戏法的机器人，还有一组独轮车队、一台用罗马数字操作的计算机器等。他还和麻省理工学院的教授爱德华·索普一道发明了第一台可佩戴的计算机，可在轮盘赌时使用。他们竟然还真的跑到拉斯维加斯测试其效果，结果赚了不少钱。幸好在当时的赌场中他们没有被人发现，不然一定会被轰出赌场，永远不许再进入。


    当然，香农对人工智能的兴趣最浓厚。他在早年间就设计了会下国际象棋的计算机程序。1949 年，香农发表了著名的论文《编程实现计算机下棋》，这是人工智能领域萌芽期的一篇杰作。后来击败国际象棋世界冠军的“深蓝”和击败围棋世界冠军的阿尔法狗，都是在香农开拓的机器下棋领域里的新成就。


    与冯·诺依曼和图灵一样，香农也在反法西斯战争中立下了不朽的功勋。他长期在贝尔实验室工作，他在第二次世界大战期间研究的通信理论和保密系统理论被美军采用。他参与制作的通信加密设备被用于盟军领袖罗斯福、丘吉尔、艾森豪威尔和蒙哥马利等人之间的绝密通信，保护了盟军的情报安全。这套设备在打击德国法西斯的飞机和导弹，尤其是在粉碎德国对英国发动的闪电战中发挥了重大作用，功不可没。


    克劳德·香农，让我们记住他的名字吧！


    ## 3.3 西蒙与纽厄尔


    我们必须承认，参加达特茅斯暑期项目的人一个比一个更了不起。如果说香农多才多艺、身怀绝技，那么西蒙与纽厄尔更是双剑合璧，他们是绝无仅有的一对天才。他们从认识到合作，携手共事
    40 多年，共同成为人工智能符号学派的创始人，在学界传为佳话。


    谦虚多才的西蒙完全不是技术出身，他就读于芝加哥大学政治系，学的是政治学。1943 年获得芝加哥大学的政治学博士学位后，他先后担任过多个政府部门和协会的顾问。西蒙的博学足以让世人折服。他在一生中从
    8 所名校里获得过 9 个博士头衔：芝加哥大学政治学博士、凯斯工程学院科学博士、耶鲁大学科学博士和法学博士、瑞典隆德大学哲学博士、麦吉尔大学法学博士、鹿特丹伊拉斯姆斯大学经济学博士、密歇根大学法学博士以及匹兹堡大学法学博士。光是这些博士头衔就足以让人头晕目眩了，更不用说由于他在决策理论研究方面的突出贡献，他还获得过
    1978 年度诺贝尔经济学奖。当时瑞典


    ![](img/figure_0059_0035.jpg)


    西蒙


    皇家科学院给他的评价是：“就经济学最广泛的意义来说，西蒙首先是一名经济学家，他的名字主要是与经济组织中的结构和决策这一相当新的研究领域联系在一起的。”


    其实，在芝加哥大学读本科期间，西蒙就一边吸收着大量的经济学和政治学方面的基础知识，一边熟练地掌握了高等数学、符号逻辑和数理统计等重要技能。1936 年从芝加哥大学毕业的他应聘到国际城市管理者协会工作，很快成为用数学方法衡量城市公用事业的效率的专家。在那里，他第一次用上了计算机，对计算机的兴趣和实践经验对他后来的事业产生了重大影响。1949
    年，西蒙应邀来到卡内基·梅隆大学，先是任行政学与心理学教授，后来任计算机科学与心理学终身教授。作为该大学工业管理研究生院的创办人之一，他开创了组织行为和管理科学两大学术领域。他倡导的决策理论是以社会系统理论为基础，吸收古典管理理论、行为科学和计算机科学等的内容而发展起来的一门边缘学科。


    纽厄尔比西蒙小 11 岁，1927 年 3 月 19 日生于旧金山。他的父亲是斯坦福医学院放射学教授，精通物理和古典文学，还擅长钓鱼、淘金和做木工。他们家在山上有一座小木屋，这是他爸爸自己亲手盖的。纽厄尔对爸爸十分崇拜，称他是“一个十全十美的知识分子”。


    ![](img/figure_0060_0036.jpg)


    纽厄尔


    有其父必有其子。纽厄尔毕业于斯坦福大学物理专业，毕业后他去普林斯顿大学研究生院攻读数学。不过一年后，他就辍学到兰德公司工作，和美国空军合作开发早期预警系统。可能这就是命运的安排，如果他不辍学到兰德公司工作，也不会那么早就认识了西蒙。在兰德公司，两人相见恨晚，十分投机。预警系统需要模拟在雷达显示屏前工作的操作人员在各种情况下的反应，这导致纽厄尔对“人如何思维”这一问题产生了兴趣。也正是从这个课题开始，纽厄尔和西蒙建立起了合作关系。


    ![](img/figure_0061_0037.jpg)


    纽厄尔和西蒙


    西蒙那时已经是卡内基理工学院（后改称卡内基·梅隆大学）工业管理系的年轻系主任，他力邀纽厄尔到卡内基理工学院，并亲自担任纽厄尔的博士生导师，开始了他们终生的合作。虽然西蒙是纽厄尔的老师，但是他们的合作是平等的。他们合作的文章的署名通常是按照字母顺序排列的，纽厄尔在前，西蒙在后。参加会议时，西蒙如果见到别人把他的名字放在纽厄尔之前，通常都会纠正过来。


    前文提到，1955 年圣诞假期结束后，西蒙教授走进教室向学生们宣布：“在刚刚过去的这个圣诞节，我和我的同事纽厄尔发明了一台可以思考的机器。”他所说的就是后来他们带到达特茅斯学院的`逻辑理论家`，那是当时唯一可以工作的人工智能软件。


    `逻辑理论家`是一款计算机模拟程序，它采用了产生式系统结构，以逆向搜索为主要的工作策略，参照适当的启发法，成为第一个启发型产生式系统和第一个成功的人工智能系统。什么是产生式系统结构呢？简单地说，它就是一种模仿人类思考的过程、表达具有因果关系的知识的计算系统结构。我们通常是这样认知一个事物的：如果一种动物会飞且会下蛋，那么这种动物就是鸟。把这种认知过程用符号系统表示出来就是`逻辑理论家`的一个创举。


    '
  toc: []
- raw: '一般解决问题的方法是从条件出发去寻找答案，由因寻果。但“逻辑理论家”在产生式系统结构上采用了一种相反的方法，就是从果出发，看它能不能符合因的要求，如果可以，这个果就是正确的答案。这就是逆向搜索。这就像我们在考试时的做法一样，通常先看题目，再选择可能的答案选项。但是，如果我们先看可能的答案选项，然后“带着问题”去看题目，则获得答案的速度可能更快，也更容易。


    当然，“逻辑理论家”比我们这里说的要复杂得多。它运用了一套复杂、抽象的符号系统来表达知识，通过符号运算的各种规则去解决问题。所以，它成功地支持了物理符号系统理论，加速了信息加工观点在心理学中的渗透，开辟了人工智能的一个新领域，开创了计算机模拟认知心理学的方法。


    ![](images/figure_0062_0038.jpg)


    纽厄尔和西蒙在研究下棋程序


    达特茅斯会议以后，西蒙与纽厄尔又进一步开发了IPL语言。这是最早的一种人工智能程序设计语言，其基本元素是符号，并首次引进了表处理方法。


    1966年，西蒙、纽厄尔和另外一名科学家合作，开发了最早的一款下棋程序MATER。在研究自然语言理解的过程中，西蒙和纽厄尔发展与完善了语义网络的概念和方法，把它作为知识表示的一种通用手段，并取得了很大的成功。1975年，西蒙和纽厄尔因为在人工智能、人类心理识别和表处理等方面进行的基础研究，荣获计算机科学最高奖——图灵奖。


    他们在获奖时联合发表演讲说，计算机科学应该是“按经验进行探索”的科学，因为现实世界中所存在的对象和过程都可以用符号来描述和解释，而包含着对象和过程的各种“问题”都可以启发式搜索为主要手段去获得答案。对这种搜索进行公式化的技术则取决于对对象和过程理解的深度。他们认为，程序可以在专家水平上或者在有能力的业余爱好者的水平上去解决问题。


    获奖后，西蒙和纽厄尔再接再厉，于1976年给“物理符号系统”下了定义，提出了“物理符号系统假说”，因此成为了人工智能领域中影响最大的符号学派的创始人。符号学派的哲学思路，也就是“物理符号系统假说”，简单说来就是智能是对符号的操作，最原始的符号对应于物理客体。


    ## [3.4 马文·明斯基](../contents/content.xhtml#toc24)


    我们已经看到了，来达特茅斯学院参加聚会的人都是“大咖”。他们的一个共同特点就是兴趣广泛，涉猎众多，才思过人。知识分子家庭出身的明斯基也是如此。


    在小学和中学阶段，明斯基上的都是私立学校，对电子学和化学表现出浓厚的兴趣。进入哈佛大学后，他主修的是物理学，但他选修的课程包括电气工程、数学以及遗传学等，涉及多个学科专业。有一段时间，他还在心理学系参加过课题研究。后来他放弃物理学，改修数学，因为他认为数学是万学之源。1950年毕业后，他进入普林斯顿大学研究生院读博士。在此期间，他深入思考了一直让他好奇的思维是如何萌发并形成的这一问题，提出了神经网络和脑模型的一些基本理论。


    其实，早在读大学的时候，他就接触到了关于心智起源的学说与当时的流行理论，但他对那些时髦的说法不以为然。新行为主义心理学家斯金纳根据一些动物行为的事实提出理论，把人的学习与动物的学习等同起来。这是当时大学里流行的一种理论，明斯基觉得难以接受，他下决心要把人到底是怎样思维的这件事弄清楚。


    ![](images/figure_0063_0039.jpg)


    明斯基


    当图灵在英国开始研究机器是否可以思考这个问题的时候，明斯基也在美国普林斯顿大学开始研究同一问题。在读博士期间，他提出了关于思维如何萌发并形成的一些基本理论，并建造了一台学习机，其名为Snare。这是世界上第一个用3000个真空管搭建的神经网络模拟器，其目的是学习如何穿过迷宫。它模拟一个由40个神经元组成的并可对成功的结果给予奖励的神经网络系统。这40个神经元被明斯基称为“代理”。基于“代理”的计算和分布式智能是当前人工智能研究中的一个热点，明斯基是最早提出“代理”概念的学者之一。


    Snare虽然还比较粗糙和不够灵活，但它毕竟是人工智能研究中最早的尝试之一。在Snare的基础上，明斯基综合利用他多学科的知识，解决了使机器能根据有关过去行为的知识来预测其当前行为的结果这一问题，并以《神经网络和脑模型问题》为题完成了他的博士论文。不过，一篇数学专业的论文大谈特谈人工智能领域的神经网络似乎有点不着边。在答辩的时候，答辩委员会的教授提出异议，好在冯·诺依曼出来为他说话。冯·诺依曼说：“就算现在看起来它跟数学的关系不大，但总有一天，你会发现它们之间是存在着密切联系的。”有“大佬”站台，明斯基于1954年顺利取得了数学博士学位。


    18世纪的法国学者拉美特里写过一本名著《人是机器》，主张生理决定论，即人的意识依赖生理组织，人一旦死亡，灵魂就不存在了。明斯基也是这样认为的。他深信尽管人脑极其复杂，可以进行判断和推理，有记忆，有情绪，但是本质上它依然是一台机器。这台机器是可以用计算机模拟的。在他的眼里，人与机器的边界最终将不复存在，人不过是肉做的机器，而钢铁做的机器有一天也能思考。明斯基甚至公开预言说，计算机的智能虽然未必能胜过所有人，但肯定会超过大多数人，只是不知道这一天何时来临。他告诫大家要小心，也许某天一台超级计算机突然做出决定，要用地球上所有的资源造出更多的超级计算机，达到它自己的目的。


    ![](images/figure_0064_0040.jpg)


    明斯基和《2001：太空漫游》


    1968年，他受邀参与指导科幻电影《2001：太空漫游》的拍摄。导演斯坦利上门拜访时谦虚地向他求教，向他咨询计算机图形学的现状，以及在2001年之前计算机能否字正腔圆地说话。这时的明斯基已经是享誉界内的人工智能“大咖”了。


    在电影的拍摄中，他没有参与讨论剧情，而是对影片中HAL 9000计算机应该是什么模样发表了意见。导演斯坦利原本为了让HAL 9000看上去更有视觉效果，采用了一台装饰着彩色标签的计算机。当他征求明斯基的意见时，明斯基却说：“我认为这台计算机实际上应该只是由许多小黑盒子组成，因为计算机需要通过引线传递信息来知道它里面在做什么，而不是华丽的标签。”于是，斯坦利把原来的装饰撤掉，设计了一台简单的、看上去更漂亮的HAL
    9000计算机。斯坦利希望所有的技术细节都是合理的，这样看上去才更真实。


    达特茅斯聚会后不久，明斯基就从哈佛大学转到了麻省理工学院。这时麦卡锡也由达特茅斯学院来到麻省理工学院与他会合，他们在这里共同创建了世界上第一个人工智能实验室。在这个实验室里，明斯基开发出了世界上最早的能够模拟人类活动的机器人Robot
    C，使机器人技术跃上了一个新台阶。当然，最值得一提的还是他在1975年提出的框架理论。


    框架理论的核心是以框架这种形式来表示知识。框架的顶层是固定的，表示固定的概念、对象或事件。它的下层由若干个槽组成，其中可填入具体值，以描述具体事物的特征。每个槽可以有若干个侧面，对槽做附加说明，如槽的取值范围、求值方法等。这样，框架就可以包含各种各样的信息，例如描述事物的信息、如何使用框架的信息、对下一步发生什么的期望以及期望没有实现时的应对方法等。利用多个有一定关联的框架组成框架系统，就可以完整而确切地把知识表示出来。明斯基最初把框架作为视觉感知、自然语言对话和其他复杂行为的基础提出来，但框架理论一经提出，就因为它既是层次化的又是模块化的，在人工智能界引起了极大的反响，成为通用的知识表示方法而被广泛接受和应用。不但如此，它的一些基本概念和结构也被后来兴起的面向对象的技术和方法所利用。今天流行的C++、Java等程序设计语言都是在明斯基的框架理论的启发和指导下产生的。


    ![](images/figure_0065_0041.jpg)


    明斯基和他的机器人


    明斯基的传奇之处在于他永无止境的好奇心。他的学生曾经这样评价他：“明斯基是定义计算和计算研究内容的先驱者之一……那时候有四五个才华横溢的人，他们早早地开始关于人工智能的全面研究，他们的个性与成就被深深地铭刻在计算领域的史册上，而明斯基正是其中之一。”在人工智能领域，明斯基以坚信人的思维过程是可以用机器去模拟而著称，他的名言就是“大脑无非是肉做的机器而已”。


    # [第4章 人工智能的数学基石](../contents/content.xhtml#toc25)


    ## [4.1 莱布尼茨与微积分](../contents/content.xhtml#toc26)


    微积分的创立被誉为人类精神的最大胜利，它把过去以常量为核心的数学推进到以变量为核心的数学，成为了一件具有划时代意义的大事。微积分也成为现代一切自然科学和工程技术的基础和工具，人工智能技术自然也离不开它，更离不开它的创立人之一——莱布尼茨。提起微积分，你不能不知道莱布尼茨和牛顿他们两个人关于微积分的世纪大战。


    ![](images/figure_0067_0042.jpg)


    莱布尼茨


    微积分解决的到底是什么问题呢？为什么莱布尼茨和牛顿要为微积分的发明打一场世纪大战呢？这不能不从早期人类对科学的探索说起。


    公元前7世纪，古希腊科学家、哲学家泰勒斯就对球的面积、体积与长度等问题进行了研究，试图提出一种通用的计算方法。公元前3世纪，古希腊数学家、力学家阿基米德又在自己的著作《圆的测量》和《论球与圆柱》中试图解决抛物线下的弓形面积、球和球冠的面积、螺线下的面积和旋转双曲线所得的体积等问题。中国古代的数学家也早在三国时期就对割圆术及求体积问题做过设想。这些都涉及后来微积分要解决的问题。


    到了17世纪，天文、航海等领域的许多科学问题都涉及在运动和变化中计算位置、速度和大小的问题，成为促使微积分产生的直接因素。这些问题的一个核心就是函数(或变量间的关系)的概念。我们在中学里就已经开始学习函数的概念了。随着函数概念的采用，微积分就产生了，把运动和变化引进了数学，让数学不再只是几何和算术，而是成为研究和表达普遍问题和特殊问题的计算科学。微分学解决的中心问题是运动轨迹下的切线问题，积分学的中心问题是变化情况下的求积问题。


    1646年7月1日，莱布尼茨出生于德国东部名城莱比锡。莱布尼茨从小就很聪慧，12岁时自学拉丁文，阅读了父亲的私人图书馆中的大量拉丁文古典著作。14岁时，莱布尼茨进入莱比锡大学攻读法律。20岁时，他递交了一篇出色的博士论文，但因为年纪太轻而被拒绝。后来黑格尔说，其实是因为莱布尼茨的学识过于渊博，当时学界的“大佬”们因为嫉妒而无地自容。但这阻挡不了第二年纽伦堡的一所大学授予了他博士学位。


    莱布尼茨是历史上少见的通才，被誉为17世纪的亚里士多德，著名的哲学家罗素也称赞他为“千古绝伦的大智者”。莱布尼茨最大的成就在于哲学和数学方面，但他不是一个职业学者。法学出身的他在毕业以后当起了德意志贵族们的法律顾问和幕僚，往返于欧洲的各大城市之间，为他们服务。据说他关于微积分的研究都是在颠簸的马车上完成的，当然其中最优美的还有他在伦敦旅行期间发现的圆周率的无穷级数表达式。


    1684年，莱布尼茨发表了他的第一篇微分学论文《一种求极大与极小值和求切线的新方法》。这是数学史上第一篇正式发表的微积分文献，也是莱布尼茨对他自1673年以来进行微积分研究的总结。1686年，他又发表了他的第一篇积分学论文《深奥的几何与不可分量及无限的分析》。这篇论文论述了积分（或求积问题）与微分（或切线问题）的互逆关系。从几何学入手，莱布尼茨引进了常量、变量和参变量等概念，形成了微积分的基本计算理论。他还提出了一整套微积分符号，奠定了今天在微积分中使用的符号表达系统。


    ![](images/figure_0069_0043.jpg)


    莱布尼茨的手稿


    莱布尼茨的这两篇论文让他得以宣称自己是微积分的第一创始人。微积分的意义十分重大，1700年莱布尼茨在整个欧洲被公认为当时最伟大的数学家，可这下惹怒了牛顿。牛顿，大家都应该知道，他发现的万有引力定律是古典物理学的基石之一。其实，早在他不停地做实验、潜心思考支配宇宙的物理法则的同时，他也思考了微积分所涉及的数学问题，并创立了称为流数法的微积分。但牛顿的发明和发现大多是在他几乎与世隔绝的乡下住所里完成的，并且在他大半生的时间里，他从未将这一发明公之于世，而仅仅将自己的私人稿件在朋友之间传阅。直到发明微积分10年之后，牛顿才正式出版了相关著作。


    客观地说，莱布尼茨是在晚于牛顿的1675年才发明微积分的，但他发表微积分论文的时间的确早于牛顿。这让两位科学巨人在微积分发明权的归属上大打出手、互不相让，一场“战争”就这样开始了。


    莱布尼茨曾看过牛顿早期的研究，牛顿因此认定莱布尼茨剽窃了自己的成果，他开始最大限度地利用自己的声望来攻击莱布尼茨。牛顿声称，莱布尼茨知道自己首先发明了微积分，他能证明这一点。依靠自己多年树立的巨大声望，牛顿指使亲信撰文攻击莱布尼茨。牛顿的支持者们暗示莱布尼茨剽窃了牛顿的理念，并帮着牛顿反驳各种回应和指责。


    莱布尼茨自然也毫不退让，任何人都不会对这样的攻击置之不理。在他的支持者的帮助下，莱布尼茨奋起反击。莱布尼茨宣称，事实的真相是牛顿借用了他的理念。他积极联络欧洲的学者，一封接一封地写了许多信为自己辩护。莱布尼茨还匿名发表了多篇为自己辩护以及攻击牛顿的文章。利用他在欧洲贵族中的人脉，他甚至将争论引入到政府层面，还把状告到了英国国王那里。


    微积分之争日趋激烈，牛顿和莱布尼茨以公开或秘密的方式相互攻击。他们一方面请人代写评论，另一方面自己发表匿名文章。两人都是十分有影响力的科学“大佬”，都有自己的资源和人脉，他们充分利用自己的声望号召更多的人支持自己。当时的学者由此也分成两个对立的阵营。两人收集了大量的证据，写了大量证明自己观点的文章。每次看到对方的指控时，两人都会怒不可遏、兵戎相见。直到莱布尼茨于1716年去世，这场“战争”似乎才算结束。其实，莱布尼茨的离世并未让微积分之争彻底收场，因为牛顿一直没有停止“战斗”，仍在继续发表攻击性的文章。


    现在历史学家的共识是，牛顿和莱布尼茨分别独立发明了微积分。莱布尼茨发明的时间晚，但发表在先。在微积分的表达形式方面，莱布尼茨花了很多精力去选择巧妙的记号，现代教科书中的积分符号“∫”和微分符号“dx”都是由莱布尼茨发明的。


    莱布尼茨还在另外两个贡献上深远地影响了后来的计算机科学。一是他改进了布莱士·帕斯卡的加法器，实现了可以计算乘法、除法和开方的机械式计算机，这对后来的计算机先驱巴贝奇有很大的启发作用。二是他发明了二进制。二进制使得所有的整数都可以用简单的0和1两个数来表示，最终使得电子计算机中数字的存储和运算被大大简化。


    ![](images/figure_0071_0044.jpg)


    莱布尼茨发明的计算机


    莱布尼茨，一个伟大的头脑和一场无味的战争。也许人性就是这样，天才也有自私狭隘的一面。莱布尼茨和牛顿的故事，是一个关于人类的骄傲本性的永恒教训！


    ## [4.2 数理逻辑](../contents/content.xhtml#toc27)


    什么是数理逻辑呢？它为什么对人工智能那么重要呢？


    数理逻辑又称符号逻辑或理论逻辑。它既是数学的一个分支，又是逻辑学的一个分支，是用数学方法研究逻辑的学科。早在古希腊时期，人们就开始探索思维的奥秘。逻辑是整理思想和知识的框架，没有它，理论和科学都无从产生。当时的先哲、世界古代史上伟大的科学家和教育家亚里士多德创建了逻辑这个探索、阐述和确立有效推理原则的学科。


    ![](images/figure_0071_0045.jpg)


    亚里士多德


    公元前384年，亚里士多德出生于色雷斯的斯塔基拉。这座城市是希腊的一个殖民地，与正在兴起的马其顿相邻。他的父亲是马其顿国王腓力二世的宫廷御医。17岁时，他赴雅典，在柏拉图学园就读，时间长达20年，直到柏拉图去世后方才离开。也许是受父亲的影响，亚里士多德对生物学和实证科学饶有兴趣；而在柏拉图的影响下，他又对哲学推理产生了兴趣。他在雅典跟柏拉图学习哲学的20年，对他的一生产生了决定性的影响。苏格拉底是柏拉图的老师，亚里士多德又受教于柏拉图。在雅典的柏拉图学园中，亚里士多德的表现很出色，柏拉图称他是“学园之灵”。但亚里士多德可不是个只崇拜权威、在学术上唯唯诺诺而没有自己想法的人。同大谈玄理的老师不同，他努力收集各种图书资料，勤奋钻研，甚至为自己建立了一个图书室。


    公元前335年，亚里士多德在雅典创办了自己的学校。亚里士多德边讲课边撰写了多部哲学著作。当时的教学可不像今天这样在笼子一般的课堂里进行，而是在大厅里、回廊上和花园中进行。亚里士多德在讲课时有一个习惯，他喜欢一边讲课一边漫步于走廊和花园之间，所以人们给他的哲学起了个外号，叫“逍遥的哲学”或者“漫步的哲学”。亚里士多德在此期间撰写了很多著作，主要是自然科学和哲学，这里面就有他的逻辑学著作《工具论》。他的很多作品都以讲稿为基础，有些甚至是他学生的课堂笔记。因此，有人将亚里士多德看作西方第一位教科书作者。


    《工具论》其实是他的6篇逻辑学著作的总称，这6篇逻辑学著作是《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辩谬篇》，主要论述了演绎法。该书提出了逻辑学中最核心的三段论，为形式逻辑奠定了基础。所谓三段论，简单地说就是由大前提和小前提得出结论的一种逻辑推理方法。它是对人类思维中演绎推理的一种形式化总结。比如，人都是要吃饭的，小明是人，所以小明也是要吃饭的。“小明也是要吃饭的”这个结论就是在“人都是要吃饭的”这个大前提和“小明是人”这个小前提的基础上得出的。三段论实际上是根据一个一般性的原则（大前提）以及一个附属于一般性原则的特殊化陈述（小前提），引申出另一个符合一般性原则的特殊化陈述（结论）的过程。


    ![](images/figure_0072_0046.jpg)


    亚里士多德的书稿


    亚里士多德认为逻辑学是一切科学的工具。作为形式逻辑学的奠基人，他力图把思维形式和存在联系起来，并按照客观实际来阐明逻辑的范畴。他选择了数学学科特别是几何学来应用他的理论，当时几何学已经由对土地测量的经验规则给予合理说明的阶段向具有比较完备的演绎形式的阶段过渡。


    数理逻辑包括哪些内容呢？从广义上说，数理逻辑包括集合论、模型论、证明论和递归论，这些都是听上去“高大上”的学问。不过，它的一个最基本也是最重要的组成部分是命题演算。


    说命题演算可能太专业，不大好懂，但说逻辑代数也许就容易理解一些了。逻辑代数也叫作开关代数，它的基本运算是逻辑加、逻辑乘和逻辑非，也就是命题演算中的“或”“与”“非”；运算对象只有0和1两个数，相当于命题演算中的“真”和“假”。它是命题演算的一个具体模型。


    逻辑代数的运算特点和电子电路中的开和关、高电位和低电位、导电和截止等现象完全一样，都只有两种不同的状态。因此，它在电子电路中得到了广泛的应用。利用电子元件可以组成相当于逻辑加、逻辑乘和逻辑非的门电路，即逻辑元件。我们还能用简单的逻辑元件组成各种逻辑网络。这样，任何复杂的逻辑关系都可以由逻辑元件经过适当的组合来实现，从而使电子元件具有逻辑判断的功能。这自然成为了电子计算机的硬件基础。


    发明逻辑代数的人叫乔治·布尔。1847年，布尔出版了《逻辑的数学分析》。这本小册子首次提出了布尔代数，把逻辑学带入了数理逻辑的时代。'
  fmt: '

    一般解决问题的方法是从条件出发去寻找答案，由因寻果。但“逻辑理论家”在产生式系统结构上采用了一种相反的方法，就是从果出发，看它能不能符合因的要求，如果可以，这个果就是正确的答案。这就是逆向搜索。这就像我们在考试时的做法一样，通常先看题目，再选择可能的答案选项。但是，如果我们先看可能的答案选项，然后“带着问题”去看题目，则获得答案的速度可能更快，也更容易。


    当然，“逻辑理论家”比我们这里说的要复杂得多。它运用了一套复杂、抽象的符号系统来表达知识，通过符号运算的各种规则去解决问题。所以，它成功地支持了物理符号系统理论，加速了信息加工观点在心理学中的渗透，开辟了人工智能的一个新领域，开创了计算机模拟认知心理学的方法。


    ![](images/figure_0062_0038.jpg)


    纽厄尔和西蒙在研究下棋程序


    达特茅斯会议以后，西蒙与纽厄尔又进一步开发了`IPL`语言。这是最早的一种人工智能程序设计语言，其基本元素是符号，并首次引进了表处理方法。


    1966年，西蒙、纽厄尔和另外一名科学家合作，开发了最早的一款下棋程序`MATER`。在研究自然语言理解的过程中，西蒙和纽厄尔发展与完善了语义网络的概念和方法，把它作为知识表示的一种通用手段，并取得了很大的成功。1975年，西蒙和纽厄尔因为在人工智能、人类心理识别和表处理等方面进行的基础研究，荣获计算机科学最高奖——图灵奖。


    他们在获奖时联合发表演讲说，计算机科学应该是“按经验进行探索”的科学，因为现实世界中所存在的对象和过程都可以用符号来描述和解释，而包含着对象和过程的各种“问题”都可以启发式搜索为主要手段去获得答案。对这种搜索进行公式化的技术则取决于对对象和过程理解的深度。他们认为，程序可以在专家水平上或者在有能力的业余爱好者的水平上去解决问题。


    获奖后，西蒙和纽厄尔再接再厉，于1976年给“物理符号系统”下了定义，提出了“物理符号系统假说”，因此成为了人工智能领域中影响最大的符号学派的创始人。符号学派的哲学思路，也就是“物理符号系统假说”，简单说来就是智能是对符号的操作，最原始的符号对应于物理客体。


    ## [3.4 马文·明斯基](../contents/content.xhtml#toc24)


    我们已经看到了，来达特茅斯学院参加聚会的人都是“大咖”。他们的一个共同特点就是兴趣广泛，涉猎众多，才思过人。知识分子家庭出身的明斯基也是如此。


    在小学和中学阶段，明斯基上的都是私立学校，对电子学和化学表现出浓厚的兴趣。进入哈佛大学后，他主修的是物理学，但他选修的课程包括电气工程、数学以及遗传学等，涉及多个学科专业。有一段时间，他还在心理学系参加过课题研究。后来他放弃物理学，改修数学，因为他认为数学是万学之源。1950年毕业后，他进入普林斯顿大学研究生院读博士。在此期间，他深入思考了一直让他好奇的思维是如何萌发并形成的这一问题，提出了神经网络和脑模型的一些基本理论。


    其实，早在读大学的时候，他就接触到了关于心智起源的学说与当时的流行理论，但他对那些时髦的说法不以为然。新行为主义心理学家斯金纳根据一些动物行为的事实提出理论，把人的学习与动物的学习等同起来。这是当时大学里流行的一种理论，明斯基觉得难以接受，他下决心要把人到底是怎样思维的这件事弄清楚。


    ![](images/figure_0063_0039.jpg)


    明斯基


    当图灵在英国开始研究机器是否可以思考这个问题的时候，明斯基也在美国普林斯顿大学开始研究同一问题。在读博士期间，他提出了关于思维如何萌发并形成的一些基本理论，并建造了一台学习机，其名为`Snare`。这是世界上第一个用3000个真空管搭建的神经网络模拟器，其目的是学习如何穿过迷宫。它模拟一个由40个神经元组成的并可对成功的结果给予奖励的神经网络系统。这40个神经元被明斯基称为“代理”。基于“代理”的计算和分布式智能是当前人工智能研究中的一个热点，明斯基是最早提出“代理”概念的学者之一。


    `Snare`虽然还比较粗糙和不够灵活，但它毕竟是人工智能研究中最早的尝试之一。在`Snare`的基础上，明斯基综合利用他多学科的知识，解决了使机器能根据有关过去行为的知识来预测其当前行为的结果这一问题，并以《神经网络和脑模型问题》为题完成了他的博士论文。不过，一篇数学专业的论文大谈特谈人工智能领域的神经网络似乎有点不着边。在答辩的时候，答辩委员会的教授提出异议，好在冯·诺依曼出来为他说话。冯·诺依曼说：“就算现在看起来它跟数学的关系不大，但总有一天，你会发现它们之间是存在着密切联系的。”有“大佬”站台，明斯基于1954年顺利取得了数学博士学位。


    18世纪的法国学者拉美特里写过一本名著《人是机器》，主张生理决定论，即人的意识依赖生理组织，人一旦死亡，灵魂就不存在了。明斯基也是这样认为的。他深信尽管人脑极其复杂，可以进行判断和推理，有记忆，有情绪，但是本质上它依然是一台机器。这台机器是可以用计算机模拟的。在他的眼里，人与机器的边界最终将不复存在，人不过是肉做的机器，而钢铁做的机器有一天也能思考。明斯基甚至公开预言说，计算机的智能虽然未必能胜过所有人，但肯定会超过大多数人，只是不知道这一天何时来临。他告诫大家要小心，也许某天一台超级计算机突然做出决定，要用地球上所有的资源造出更多的超级计算机，达到它自己的目的。


    ![](images/figure_0064_0040.jpg)


    明斯基和《2001：太空漫游》


    1968年，他受邀参与指导科幻电影《2001：太空漫游》的拍摄。导演斯坦利上门拜访时谦虚地向他求教，向他咨询计算机图形学的现状，以及在2001年之前计算机能否字正腔圆地说话。这时的明斯基已经是享誉界内的人工智能“大咖”了。


    在电影的拍摄中，他没有参与讨论剧情，而是对影片中`HAL 9000`计算机应该是什么模样发表了意见。导演斯坦利原本为了让`HAL 9000`看上去更有视觉效果，采用了一台装饰着彩色标签的计算机。当他征求明斯基的意见时，明斯基却说：“我认为这台计算机实际上应该只是由许多小黑盒子组成，因为计算机需要通过引线传递信息来知道它里面在做什么，而不是华丽的标签。”于是，斯坦利把原来的装饰撤掉，设计了一台简单的、看上去更漂亮的`HAL
    9000`计算机。斯坦利希望所有的技术细节都是合理的，这样看上去才更真实。


    达特茅斯聚会后不久，明斯基就从哈佛大学转到了麻省理工学院。这时麦卡锡也由达特茅斯学院来到麻省理工学院与他会合，他们在这里共同创建了世界上第一个人工智能实验室。在这个实验室里，明斯基开发出了世界上最早的能够模拟人类活动的机器人`Robot
    C`，使机器人技术跃上了一个新台阶。当然，最值得一提的还是他在1975年提出的框架理论。


    框架理论的核心是以框架这种形式来表示知识。框架的顶层是固定的，表示固定的概念、对象或事件。它的下层由若干个槽组成，其中可填入具体值，以描述具体事物的特征。每个槽可以有若干个侧面，对槽做附加说明，如槽的取值范围、求值方法等。这样，框架就可以包含各种各样的信息，例如描述事物的信息、如何使用框架的信息、对下一步发生什么的期望以及期望没有实现时的应对方法等。利用多个有一定关联的框架组成框架系统，就可以完整而确切地把知识表示出来。明斯基最初把框架作为视觉感知、自然语言对话和其他复杂行为的基础提出来，但框架理论一经提出，就因为它既是层次化的又是模块化的，在人工智能界引起了极大的反响，成为通用的知识表示方法而被广泛接受和应用。不但如此，它的一些基本概念和结构也被后来兴起的面向对象的技术和方法所利用。今天流行的`C++`、`Java`等程序设计语言都是在明斯基的框架理论的启发和指导下产生的。


    ![](images/figure_0065_0041.jpg)


    明斯基和他的机器人


    明斯基的传奇之处在于他永无止境的好奇心。他的学生曾经这样评价他：“明斯基是定义计算和计算研究内容的先驱者之一……那时候有四五个才华横溢的人，他们早早地开始关于人工智能的全面研究，他们的个性与成就被深深地铭刻在计算领域的史册上，而明斯基正是其中之一。”在人工智能领域，明斯基以坚信人的思维过程是可以用机器去模拟而著称，他的名言就是“大脑无非是肉做的机器而已”。


    # [第4章 人工智能的数学基石](../contents/content.xhtml#toc25)


    ## [4.1 莱布尼茨与微积分](../contents/content.xhtml#toc26)


    微积分的创立被誉为人类精神的最大胜利，它把过去以常量为核心的数学推进到以变量为核心的数学，成为了一件具有划时代意义的大事。微积分也成为现代一切自然科学和工程技术的基础和工具，人工智能技术自然也离不开它，更离不开它的创立人之一——莱布尼茨。提起微积分，你不能不知道莱布尼茨和牛顿他们两个人关于微积分的世纪大战。


    ![](images/figure_0067_0042.jpg)


    莱布尼茨


    微积分解决的到底是什么问题呢？为什么莱布尼茨和牛顿要为微积分的发明打一场世纪大战呢？这不能不从早期人类对科学的探索说起。


    公元前7世纪，古希腊科学家、哲学家泰勒斯就对球的面积、体积与长度等问题进行了研究，试图提出一种通用的计算方法。公元前3世纪，古希腊数学家、力学家阿基米德又在自己的著作《圆的测量》和《论球与圆柱》中试图解决抛物线下的弓形面积、球和球冠的面积、螺线下的面积和旋转双曲线所得的体积等问题。中国古代的数学家也早在三国时期就对割圆术及求体积问题做过设想。这些都涉及后来微积分要解决的问题。


    到了17世纪，天文、航海等领域的许多科学问题都涉及在运动和变化中计算位置、速度和大小的问题，成为促使微积分产生的直接因素。这些问题的一个核心就是函数(或变量间的关系)的概念。我们在中学里就已经开始学习函数的概念了。随着函数概念的采用，微积分就产生了，把运动和变化引进了数学，让数学不再只是几何和算术，而是成为研究和表达普遍问题和特殊问题的计算科学。微分学解决的中心问题是运动轨迹下的切线问题，积分学的中心问题是变化情况下的求积问题。


    1646年7月1日，莱布尼茨出生于德国东部名城莱比锡。莱布尼茨从小就很聪慧，12岁时自学拉丁文，阅读了父亲的私人图书馆中的大量拉丁文古典著作。14岁时，莱布尼茨进入莱比锡大学攻读法律。20岁时，他递交了一篇出色的博士论文，但因为年纪太轻而被拒绝。后来黑格尔说，其实是因为莱布尼茨的学识过于渊博，当时学界的“大佬”们因为嫉妒而无地自容。但这阻挡不了第二年纽伦堡的一所大学授予了他博士学位。


    莱布尼茨是历史上少见的通才，被誉为17世纪的亚里士多德，著名的哲学家罗素也称赞他为“千古绝伦的大智者”。莱布尼茨最大的成就在于哲学和数学方面，但他不是一个职业学者。法学出身的他在毕业以后当起了德意志贵族们的法律顾问和幕僚，往返于欧洲的各大城市之间，为他们服务。据说他关于微积分的研究都是在颠簸的马车上完成的，当然其中最优美的还有他在伦敦旅行期间发现的圆周率的无穷级数表达式。


    1684年，莱布尼茨发表了他的第一篇微分学论文《一种求极大与极小值和求切线的新方法》。这是数学史上第一篇正式发表的微积分文献，也是莱布尼茨对他自1673年以来进行微积分研究的总结。1686年，他又发表了他的第一篇积分学论文《深奥的几何与不可分量及无限的分析》。这篇论文论述了积分（或求积问题）与微分（或切线问题）的互逆关系。从几何学入手，莱布尼茨引进了常量、变量和参变量等概念，形成了微积分的基本计算理论。他还提出了一整套微积分符号，奠定了今天在微积分中使用的符号表达系统。


    ![](images/figure_0069_0043.jpg)


    莱布尼茨的手稿


    莱布尼茨的这两篇论文让他得以宣称自己是微积分的第一创始人。微积分的意义十分重大，1700年莱布尼茨在整个欧洲被公认为当时最伟大的数学家，可这下惹怒了牛顿。牛顿，大家都应该知道，他发现的万有引力定律是古典物理学的基石之一。其实，早在他不停地做实验、潜心思考支配宇宙的物理法则的同时，他也思考了微积分所涉及的数学问题，并创立了称为流数法的微积分。但牛顿的发明和发现大多是在他几乎与世隔绝的乡下住所里完成的，并且在他大半生的时间里，他从未将这一发明公之于世，而仅仅将自己的私人稿件在朋友之间传阅。直到发明微积分10年之后，牛顿才正式出版了相关著作。


    客观地说，莱布尼茨是在晚于牛顿的1675年才发明微积分的，但他发表微积分论文的时间的确早于牛顿。这让两位科学巨人在微积分发明权的归属上大打出手、互不相让，一场“战争”就这样开始了。


    莱布尼茨曾看过牛顿早期的研究，牛顿因此认定莱布尼茨剽窃了自己的成果，他开始最大限度地利用自己的声望来攻击莱布尼茨。牛顿声称，莱布尼茨知道自己首先发明了微积分，他能证明这一点。依靠自己多年树立的巨大声望，牛顿指使亲信撰文攻击莱布尼茨。牛顿的支持者们暗示莱布尼茨剽窃了牛顿的理念，并帮着牛顿反驳各种回应和指责。


    莱布尼茨自然也毫不退让，任何人都不会对这样的攻击置之不理。在他的支持者的帮助下，莱布尼茨奋起反击。莱布尼茨宣称，事实的真相是牛顿借用了他的理念。他积极联络欧洲的学者，一封接一封地写了许多信为自己辩护。莱布尼茨还匿名发表了多篇为自己辩护以及攻击牛顿的文章。利用他在欧洲贵族中的人脉，他甚至将争论引入到政府层面，还把状告到了英国国王那里。


    微积分之争日趋激烈，牛顿和莱布尼茨以公开或秘密的方式相互攻击。他们一方面请人代写评论，另一方面自己发表匿名文章。两人都是十分有影响力的科学“大佬”，都有自己的资源和人脉，他们充分利用自己的声望号召更多的人支持自己。当时的学者由此也分成两个对立的阵营。两人收集了大量的证据，写了大量证明自己观点的文章。每次看到对方的指控时，两人都会怒不可遏、兵戎相见。直到莱布尼茨于1716年去世，这场“战争”似乎才算结束。其实，莱布尼茨的离世并未让微积分之争彻底收场，因为牛顿一直没有停止“战斗”，仍在继续发表攻击性的文章。


    现在历史学家的共识是，牛顿和莱布尼茨分别独立发明了微积分。莱布尼茨发明的时间晚，但发表在先。在微积分的表达形式方面，莱布尼茨花了很多精力去选择巧妙的记号，现代教科书中的积分符号“`∫`”和微分符号“`dx`”都是由莱布尼茨发明的。


    莱布尼茨还在另外两个贡献上深远地影响了后来的计算机科学。一是他改进了布莱士·帕斯卡的加法器，实现了可以计算乘法、除法和开方的机械式计算机，这对后来的计算机先驱巴贝奇有很大的启发作用。二是他发明了二进制。二进制使得所有的整数都可以用简单的0和1两个数来表示，最终使得电子计算机中数字的存储和运算被大大简化。


    ![](images/figure_0071_0044.jpg)


    莱布尼茨发明的计算机


    莱布尼茨，一个伟大的头脑和一场无味的战争。也许人性就是这样，天才也有自私狭隘的一面。莱布尼茨和牛顿的故事，是一个关于人类的骄傲本性的永恒教训！


    ## [4.2 数理逻辑](../contents/content.xhtml#toc27)


    什么是数理逻辑呢？它为什么对人工智能那么重要呢？


    数理逻辑又称符号逻辑或理论逻辑。它既是数学的一个分支，又是逻辑学的一个分支，是用数学方法研究逻辑的学科。早在古希腊时期，人们就开始探索思维的奥秘。逻辑是整理思想和知识的框架，没有它，理论和科学都无从产生。当时的先哲、世界古代史上伟大的科学家和教育家亚里士多德创建了逻辑这个探索、阐述和确立有效推理原则的学科。


    ![](images/figure_0071_0045.jpg)


    亚里士多德


    公元前384年，亚里士多德出生于色雷斯的斯塔基拉。这座城市是希腊的一个殖民地，与正在兴起的马其顿相邻。他的父亲是马其顿国王腓力二世的宫廷御医。17岁时，他赴雅典，在柏拉图学园就读，时间长达20年，直到柏拉图去世后方才离开。也许是受父亲的影响，亚里士多德对生物学和实证科学饶有兴趣；而在柏拉图的影响下，他又对哲学推理产生了兴趣。他在雅典跟柏拉图学习哲学的20年，对他的一生产生了决定性的影响。苏格拉底是柏拉图的老师，亚里士多德又受教于柏拉图。在雅典的柏拉图学园中，亚里士多德的表现很出色，柏拉图称他是“学园之灵”。但亚里士多德可不是个只崇拜权威、在学术上唯唯诺诺而没有自己想法的人。同大谈玄理的老师不同，他努力收集各种图书资料，勤奋钻研，甚至为自己建立了一个图书室。


    公元前335年，亚里士多德在雅典创办了自己的学校。亚里士多德边讲课边撰写了多部哲学著作。当时的教学可不像今天这样在笼子一般的课堂里进行，而是在大厅里、回廊上和花园中进行。亚里士多德在讲课时有一个习惯，他喜欢一边讲课一边漫步于走廊和花园之间，所以人们给他的哲学起了个外号，叫“逍遥的哲学”或者“漫步的哲学”。亚里士多德在此期间撰写了很多著作，主要是自然科学和哲学，这里面就有他的逻辑学著作《工具论》。他的很多作品都以讲稿为基础，有些甚至是他学生的课堂笔记。因此，有人将亚里士多德看作西方第一位教科书作者。


    《工具论》其实是他的6篇逻辑学著作的总称，这6篇逻辑学著作是《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辩谬篇》，主要论述了演绎法。该书提出了逻辑学中最核心的三段论，为形式逻辑奠定了基础。所谓三段论，简单地说就是由大前提和小前提得出结论的一种逻辑推理方法。它是对人类思维中演绎推理的一种形式化总结。比如，人都是要吃饭的，小明是人，所以小明也是要吃饭的。“小明也是要吃饭的”这个结论就是在“人都是要吃饭的”这个大前提和“小明是人”这个小前提的基础上得出的。三段论实际上是根据一个一般性的原则（大前提）以及一个附属于一般性原则的特殊化陈述（小前提），引申出另一个符合一般性原则的特殊化陈述（结论）的过程。


    ![](images/figure_0072_0046.jpg)


    亚里士多德的书稿


    亚里士多德认为逻辑学是一切科学的工具。作为形式逻辑学的奠基人，他力图把思维形式和存在联系起来，并按照客观实际来阐明逻辑的范畴。他选择了数学学科特别是几何学来应用他的理论，当时几何学已经由对土地测量的经验规则给予合理说明的阶段向具有比较完备的演绎形式的阶段过渡。


    数理逻辑包括哪些内容呢？从广义上说，数理逻辑包括集合论、模型论、证明论和递归论，这些都是听上去“高大上”的学问。不过，它的一个最基本也是最重要的组成部分是命题演算。


    说命题演算可能太专业，不大好懂，但说逻辑代数也许就容易理解一些了。逻辑代数也叫作开关代数，它的基本运算是逻辑加、逻辑乘和逻辑非，也就是命题演算中的“或”“与”“非”；运算对象只有0和1两个数，相当于命题演算中的“真”和“假”。它是命题演算的一个具体模型。


    逻辑代数的运算特点和电子电路中的开和关、高电位和低电位、导电和截止等现象完全一样，都只有两种不同的状态。因此，它在电子电路中得到了广泛的应用。利用电子元件可以组成相当于逻辑加、逻辑乘和逻辑非的门电路，即逻辑元件。我们还能用简单的逻辑元件组成各种逻辑网络。这样，任何复杂的逻辑关系都可以由逻辑元件经过适当的组合来实现，从而使电子元件具有逻辑判断的功能。这自然成为了电子计算机的硬件基础。


    发明逻辑代数的人叫乔治·布尔。1847年，布尔出版了《逻辑的数学分析》。这本小册子首次提出了布尔代数，把逻辑学带入了数理逻辑的时代。

    '
  trans: '


    一般解决问题的方法是从条件出发去寻找答案，由因寻果。但“逻辑理论家”在产生式系统结构上采用了一种相反的方法，就是从果出发，看它能不能符合因的要求，如果可以，这个果就是正确的答案。这就是逆向搜索。这就像我们在考试时的做法一样，通常先看题目，再选择可能的答案选项。但是，如果我们先看可能的答案选项，然后“带着问题”去看题目，则获得答案的速度可能更快，也更容易。


    当然，“逻辑理论家”比我们这里说的要复杂得多。它运用了一套复杂、抽象的符号系统来表达知识，通过符号运算的各种规则去解决问题。所以，它成功地支持了物理符号系统理论，加速了信息加工观点在心理学中的渗透，开辟了人工智能的一个新领域，开创了计算机模拟认知心理学的方法。


    ![](img/figure_0062_0038.jpg)


    纽厄尔和西蒙在研究下棋程序


    达特茅斯会议以后，西蒙与纽厄尔又进一步开发了`IPL`语言。这是最早的一种人工智能程序设计语言，其基本元素是符号，并首次引进了表处理方法。


    1966 年，西蒙、纽厄尔和另外一名科学家合作，开发了最早的一款下棋程序`MATER`。在研究自然语言理解的过程中，西蒙和纽厄尔发展与完善了语义网络的概念和方法，把它作为知识表示的一种通用手段，并取得了很大的成功。1975
    年，西蒙和纽厄尔因为在人工智能、人类心理识别和表处理等方面进行的基础研究，荣获计算机科学最高奖——图灵奖。


    他们在获奖时联合发表演讲说，计算机科学应该是“按经验进行探索”的科学，因为现实世界中所存在的对象和过程都可以用符号来描述和解释，而包含着对象和过程的各种“问题”都可以启发式搜索为主要手段去获得答案。对这种搜索进行公式化的技术则取决于对对象和过程理解的深度。他们认为，程序可以在专家水平上或者在有能力的业余爱好者的水平上去解决问题。


    获奖后，西蒙和纽厄尔再接再厉，于 1976 年给“物理符号系统”下了定义，提出了“物理符号系统假说”，因此成为了人工智能领域中影响最大的符号学派的创始人。符号学派的哲学思路，也就是“物理符号系统假说”，简单说来就是智能是对符号的操作，最原始的符号对应于物理客体。


    ## 3.4 马文·明斯基


    我们已经看到了，来达特茅斯学院参加聚会的人都是“大咖”。他们的一个共同特点就是兴趣广泛，涉猎众多，才思过人。知识分子家庭出身的明斯基也是如此。


    在小学和中学阶段，明斯基上的都是私立学校，对电子学和化学表现出浓厚的兴趣。进入哈佛大学后，他主修的是物理学，但他选修的课程包括电气工程、数学以及遗传学等，涉及多个学科专业。有一段时间，他还在心理学系参加过课题研究。后来他放弃物理学，改修数学，因为他认为数学是万学之源。1950
    年毕业后，他进入普林斯顿大学研究生院读博士。在此期间，他深入思考了一直让他好奇的思维是如何萌发并形成的这一问题，提出了神经网络和脑模型的一些基本理论。


    其实，早在读大学的时候，他就接触到了关于心智起源的学说与当时的流行理论，但他对那些时髦的说法不以为然。新行为主义心理学家斯金纳根据一些动物行为的事实提出理论，把人的学习与动物的学习等同起来。这是当时大学里流行的一种理论，明斯基觉得难以接受，他下决心要把人到底是怎样思维的这件事弄清楚。


    ![](img/figure_0063_0039.jpg)


    明斯基


    当图灵在英国开始研究机器是否可以思考这个问题的时候，明斯基也在美国普林斯顿大学开始研究同一问题。在读博士期间，他提出了关于思维如何萌发并形成的一些基本理论，并建造了一台学习机，其名为`Snare`。这是世界上第一个用
    3000 个真空管搭建的神经网络模拟器，其目的是学习如何穿过迷宫。它模拟一个由 40 个神经元组成的并可对成功的结果给予奖励的神经网络系统。这 40 个神经元被明斯基称为“代理”。基于“代理”的计算和分布式智能是当前人工智能研究中的一个热点，明斯基是最早提出“代理”概念的学者之一。


    `Snare`虽然还比较粗糙和不够灵活，但它毕竟是人工智能研究中最早的尝试之一。在`Snare`的基础上，明斯基综合利用他多学科的知识，解决了使机器能根据有关过去行为的知识来预测其当前行为的结果这一问题，并以《神经网络和脑模型问题》为题完成了他的博士论文。不过，一篇数学专业的论文大谈特谈人工智能领域的神经网络似乎有点不着边。在答辩的时候，答辩委员会的教授提出异议，好在冯·诺依曼出来为他说话。冯·诺依曼说：“就算现在看起来它跟数学的关系不大，但总有一天，你会发现它们之间是存在着密切联系的。”有“大佬”站台，明斯基于
    1954 年顺利取得了数学博士学位。


    18 世纪的法国学者拉美特里写过一本名著《人是机器》，主张生理决定论，即人的意识依赖生理组织，人一旦死亡，灵魂就不存在了。明斯基也是这样认为的。他深信尽管人脑极其复杂，可以进行判断和推理，有记忆，有情绪，但是本质上它依然是一台机器。这台机器是可以用计算机模拟的。在他的眼里，人与机器的边界最终将不复存在，人不过是肉做的机器，而钢铁做的机器有一天也能思考。明斯基甚至公开预言说，计算机的智能虽然未必能胜过所有人，但肯定会超过大多数人，只是不知道这一天何时来临。他告诫大家要小心，也许某天一台超级计算机突然做出决定，要用地球上所有的资源造出更多的超级计算机，达到它自己的目的。


    ![](img/figure_0064_0040.jpg)


    明斯基和《2001：太空漫游》


    1968 年，他受邀参与指导科幻电影《2001：太空漫游》的拍摄。导演斯坦利上门拜访时谦虚地向他求教，向他咨询计算机图形学的现状，以及在 2001 年之前计算机能否字正腔圆地说话。这时的明斯基已经是享誉界内的人工智能“大咖”了。


    在电影的拍摄中，他没有参与讨论剧情，而是对影片中`HAL 9000`计算机应该是什么模样发表了意见。导演斯坦利原本为了让`HAL 9000`看上去更有视觉效果，采用了一台装饰着彩色标签的计算机。当他征求明斯基的意见时，明斯基却说：“我认为这台计算机实际上应该只是由许多小黑盒子组成，因为计算机需要通过引线传递信息来知道它里面在做什么，而不是华丽的标签。”于是，斯坦利把原来的装饰撤掉，设计了一台简单的、看上去更漂亮的`HAL
    9000`计算机。斯坦利希望所有的技术细节都是合理的，这样看上去才更真实。


    达特茅斯聚会后不久，明斯基就从哈佛大学转到了麻省理工学院。这时麦卡锡也由达特茅斯学院来到麻省理工学院与他会合，他们在这里共同创建了世界上第一个人工智能实验室。在这个实验室里，明斯基开发出了世界上最早的能够模拟人类活动的机器人`Robot
    C`，使机器人技术跃上了一个新台阶。当然，最值得一提的还是他在 1975 年提出的框架理论。


    框架理论的核心是以框架这种形式来表示知识。框架的顶层是固定的，表示固定的概念、对象或事件。它的下层由若干个槽组成，其中可填入具体值，以描述具体事物的特征。每个槽可以有若干个侧面，对槽做附加说明，如槽的取值范围、求值方法等。这样，框架就可以包含各种各样的信息，例如描述事物的信息、如何使用框架的信息、对下一步发生什么的期望以及期望没有实现时的应对方法等。利用多个有一定关联的框架组成框架系统，就可以完整而确切地把知识表示出来。明斯基最初把框架作为视觉感知、自然语言对话和其他复杂行为的基础提出来，但框架理论一经提出，就因为它既是层次化的又是模块化的，在人工智能界引起了极大的反响，成为通用的知识表示方法而被广泛接受和应用。不但如此，它的一些基本概念和结构也被后来兴起的面向对象的技术和方法所利用。今天流行的`C++`、`Java`等程序设计语言都是在明斯基的框架理论的启发和指导下产生的。


    ![](img/figure_0065_0041.jpg)


    明斯基和他的机器人


    明斯基的传奇之处在于他永无止境的好奇心。他的学生曾经这样评价他：“明斯基是定义计算和计算研究内容的先驱者之一……那时候有四五个才华横溢的人，他们早早地开始关于人工智能的全面研究，他们的个性与成就被深深地铭刻在计算领域的史册上，而明斯基正是其中之一。”在人工智能领域，明斯基以坚信人的思维过程是可以用机器去模拟而著称，他的名言就是“大脑无非是肉做的机器而已”。


    # 第 4 章 人工智能的数学基石


    ## 4.1 莱布尼茨与微积分


    微积分的创立被誉为人类精神的最大胜利，它把过去以常量为核心的数学推进到以变量为核心的数学，成为了一件具有划时代意义的大事。微积分也成为现代一切自然科学和工程技术的基础和工具，人工智能技术自然也离不开它，更离不开它的创立人之一——莱布尼茨。提起微积分，你不能不知道莱布尼茨和牛顿他们两个人关于微积分的世纪大战。


    ![](img/figure_0067_0042.jpg)


    莱布尼茨


    微积分解决的到底是什么问题呢？为什么莱布尼茨和牛顿要为微积分的发明打一场世纪大战呢？这不能不从早期人类对科学的探索说起。


    公元前 7 世纪，古希腊科学家、哲学家泰勒斯就对球的面积、体积与长度等问题进行了研究，试图提出一种通用的计算方法。公元前 3 世纪，古希腊数学家、力学家阿基米德又在自己的著作《圆的测量》和《论球与圆柱》中试图解决抛物线下的弓形面积、球和球冠的面积、螺线下的面积和旋转双曲线所得的体积等问题。中国古代的数学家也早在三国时期就对割圆术及求体积问题做过设想。这些都涉及后来微积分要解决的问题。


    到了 17 世纪，天文、航海等领域的许多科学问题都涉及在运动和变化中计算位置、速度和大小的问题，成为促使微积分产生的直接因素。这些问题的一个核心就是函数(或变量间的关系)的概念。我们在中学里就已经开始学习函数的概念了。随着函数概念的采用，微积分就产生了，把运动和变化引进了数学，让数学不再只是几何和算术，而是成为研究和表达普遍问题和特殊问题的计算科学。微分学解决的中心问题是运动轨迹下的切线问题，积分学的中心问题是变化情况下的求积问题。


    1646 年 7 月 1 日，莱布尼茨出生于德国东部名城莱比锡。莱布尼茨从小就很聪慧，12 岁时自学拉丁文，阅读了父亲的私人图书馆中的大量拉丁文古典著作。14
    岁时，莱布尼茨进入莱比锡大学攻读法律。20 岁时，他递交了一篇出色的博士论文，但因为年纪太轻而被拒绝。后来黑格尔说，其实是因为莱布尼茨的学识过于渊博，当时学界的“大佬”们因为嫉妒而无地自容。但这阻挡不了第二年纽伦堡的一所大学授予了他博士学位。


    莱布尼茨是历史上少见的通才，被誉为 17 世纪的亚里士多德，著名的哲学家罗素也称赞他为“千古绝伦的大智者”。莱布尼茨最大的成就在于哲学和数学方面，但他不是一个职业学者。法学出身的他在毕业以后当起了德意志贵族们的法律顾问和幕僚，往返于欧洲的各大城市之间，为他们服务。据说他关于微积分的研究都是在颠簸的马车上完成的，当然其中最优美的还有他在伦敦旅行期间发现的圆周率的无穷级数表达式。


    1684 年，莱布尼茨发表了他的第一篇微分学论文《一种求极大与极小值和求切线的新方法》。这是数学史上第一篇正式发表的微积分文献，也是莱布尼茨对他自 1673
    年以来进行微积分研究的总结。1686 年，他又发表了他的第一篇积分学论文《深奥的几何与不可分量及无限的分析》。这篇论文论述了积分（或求积问题）与微分（或切线问题）的互逆关系。从几何学入手，莱布尼茨引进了常量、变量和参变量等概念，形成了微积分的基本计算理论。他还提出了一整套微积分符号，奠定了今天在微积分中使用的符号表达系统。


    ![](img/figure_0069_0043.jpg)


    莱布尼茨的手稿


    莱布尼茨的这两篇论文让他得以宣称自己是微积分的第一创始人。微积分的意义十分重大，1700 年莱布尼茨在整个欧洲被公认为当时最伟大的数学家，可这下惹怒了牛顿。牛顿，大家都应该知道，他发现的万有引力定律是古典物理学的基石之一。其实，早在他不停地做实验、潜心思考支配宇宙的物理法则的同时，他也思考了微积分所涉及的数学问题，并创立了称为流数法的微积分。但牛顿的发明和发现大多是在他几乎与世隔绝的乡下住所里完成的，并且在他大半生的时间里，他从未将这一发明公之于世，而仅仅将自己的私人稿件在朋友之间传阅。直到发明微积分
    10 年之后，牛顿才正式出版了相关著作。


    客观地说，莱布尼茨是在晚于牛顿的 1675 年才发明微积分的，但他发表微积分论文的时间的确早于牛顿。这让两位科学巨人在微积分发明权的归属上大打出手、互不相让，一场“战争”就这样开始了。


    莱布尼茨曾看过牛顿早期的研究，牛顿因此认定莱布尼茨剽窃了自己的成果，他开始最大限度地利用自己的声望来攻击莱布尼茨。牛顿声称，莱布尼茨知道自己首先发明了微积分，他能证明这一点。依靠自己多年树立的巨大声望，牛顿指使亲信撰文攻击莱布尼茨。牛顿的支持者们暗示莱布尼茨剽窃了牛顿的理念，并帮着牛顿反驳各种回应和指责。


    莱布尼茨自然也毫不退让，任何人都不会对这样的攻击置之不理。在他的支持者的帮助下，莱布尼茨奋起反击。莱布尼茨宣称，事实的真相是牛顿借用了他的理念。他积极联络欧洲的学者，一封接一封地写了许多信为自己辩护。莱布尼茨还匿名发表了多篇为自己辩护以及攻击牛顿的文章。利用他在欧洲贵族中的人脉，他甚至将争论引入到政府层面，还把状告到了英国国王那里。


    微积分之争日趋激烈，牛顿和莱布尼茨以公开或秘密的方式相互攻击。他们一方面请人代写评论，另一方面自己发表匿名文章。两人都是十分有影响力的科学“大佬”，都有自己的资源和人脉，他们充分利用自己的声望号召更多的人支持自己。当时的学者由此也分成两个对立的阵营。两人收集了大量的证据，写了大量证明自己观点的文章。每次看到对方的指控时，两人都会怒不可遏、兵戎相见。直到莱布尼茨于
    1716 年去世，这场“战争”似乎才算结束。其实，莱布尼茨的离世并未让微积分之争彻底收场，因为牛顿一直没有停止“战斗”，仍在继续发表攻击性的文章。


    现在历史学家的共识是，牛顿和莱布尼茨分别独立发明了微积分。莱布尼茨发明的时间晚，但发表在先。在微积分的表达形式方面，莱布尼茨花了很多精力去选择巧妙的记号，现代教科书中的积分符号“`∫`”和微分符号“`dx`”都是由莱布尼茨发明的。


    莱布尼茨还在另外两个贡献上深远地影响了后来的计算机科学。一是他改进了布莱士·帕斯卡的加法器，实现了可以计算乘法、除法和开方的机械式计算机，这对后来的计算机先驱巴贝奇有很大的启发作用。二是他发明了二进制。二进制使得所有的整数都可以用简单的
    0 和 1 两个数来表示，最终使得电子计算机中数字的存储和运算被大大简化。


    ![](img/figure_0071_0044.jpg)


    莱布尼茨发明的计算机


    莱布尼茨，一个伟大的头脑和一场无味的战争。也许人性就是这样，天才也有自私狭隘的一面。莱布尼茨和牛顿的故事，是一个关于人类的骄傲本性的永恒教训！


    ## 4.2 数理逻辑


    什么是数理逻辑呢？它为什么对人工智能那么重要呢？


    数理逻辑又称符号逻辑或理论逻辑。它既是数学的一个分支，又是逻辑学的一个分支，是用数学方法研究逻辑的学科。早在古希腊时期，人们就开始探索思维的奥秘。逻辑是整理思想和知识的框架，没有它，理论和科学都无从产生。当时的先哲、世界古代史上伟大的科学家和教育家亚里士多德创建了逻辑这个探索、阐述和确立有效推理原则的学科。


    ![](img/figure_0071_0045.jpg)


    亚里士多德


    公元前 384 年，亚里士多德出生于色雷斯的斯塔基拉。这座城市是希腊的一个殖民地，与正在兴起的马其顿相邻。他的父亲是马其顿国王腓力二世的宫廷御医。17 岁时，他赴雅典，在柏拉图学园就读，时间长达
    20 年，直到柏拉图去世后方才离开。也许是受父亲的影响，亚里士多德对生物学和实证科学饶有兴趣；而在柏拉图的影响下，他又对哲学推理产生了兴趣。他在雅典跟柏拉图学习哲学的
    20 年，对他的一生产生了决定性的影响。苏格拉底是柏拉图的老师，亚里士多德又受教于柏拉图。在雅典的柏拉图学园中，亚里士多德的表现很出色，柏拉图称他是“学园之灵”。但亚里士多德可不是个只崇拜权威、在学术上唯唯诺诺而没有自己想法的人。同大谈玄理的老师不同，他努力收集各种图书资料，勤奋钻研，甚至为自己建立了一个图书室。


    公元前 335 年，亚里士多德在雅典创办了自己的学校。亚里士多德边讲课边撰写了多部哲学著作。当时的教学可不像今天这样在笼子一般的课堂里进行，而是在大厅里、回廊上和花园中进行。亚里士多德在讲课时有一个习惯，他喜欢一边讲课一边漫步于走廊和花园之间，所以人们给他的哲学起了个外号，叫“逍遥的哲学”或者“漫步的哲学”。亚里士多德在此期间撰写了很多著作，主要是自然科学和哲学，这里面就有他的逻辑学著作《工具论》。他的很多作品都以讲稿为基础，有些甚至是他学生的课堂笔记。因此，有人将亚里士多德看作西方第一位教科书作者。


    《工具论》其实是他的 6 篇逻辑学著作的总称，这 6 篇逻辑学著作是《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辩谬篇》，主要论述了演绎法。该书提出了逻辑学中最核心的三段论，为形式逻辑奠定了基础。所谓三段论，简单地说就是由大前提和小前提得出结论的一种逻辑推理方法。它是对人类思维中演绎推理的一种形式化总结。比如，人都是要吃饭的，小明是人，所以小明也是要吃饭的。“小明也是要吃饭的”这个结论就是在“人都是要吃饭的”这个大前提和“小明是人”这个小前提的基础上得出的。三段论实际上是根据一个一般性的原则（大前提）以及一个附属于一般性原则的特殊化陈述（小前提），引申出另一个符合一般性原则的特殊化陈述（结论）的过程。


    ![](img/figure_0072_0046.jpg)


    亚里士多德的书稿


    亚里士多德认为逻辑学是一切科学的工具。作为形式逻辑学的奠基人，他力图把思维形式和存在联系起来，并按照客观实际来阐明逻辑的范畴。他选择了数学学科特别是几何学来应用他的理论，当时几何学已经由对土地测量的经验规则给予合理说明的阶段向具有比较完备的演绎形式的阶段过渡。


    数理逻辑包括哪些内容呢？从广义上说，数理逻辑包括集合论、模型论、证明论和递归论，这些都是听上去“高大上”的学问。不过，它的一个最基本也是最重要的组成部分是命题演算。


    说命题演算可能太专业，不大好懂，但说逻辑代数也许就容易理解一些了。逻辑代数也叫作开关代数，它的基本运算是逻辑加、逻辑乘和逻辑非，也就是命题演算中的“或”“与”“非”；运算对象只有
    0 和 1 两个数，相当于命题演算中的“真”和“假”。它是命题演算的一个具体模型。


    逻辑代数的运算特点和电子电路中的开和关、高电位和低电位、导电和截止等现象完全一样，都只有两种不同的状态。因此，它在电子电路中得到了广泛的应用。利用电子元件可以组成相当于逻辑加、逻辑乘和逻辑非的门电路，即逻辑元件。我们还能用简单的逻辑元件组成各种逻辑网络。这样，任何复杂的逻辑关系都可以由逻辑元件经过适当的组合来实现，从而使电子元件具有逻辑判断的功能。这自然成为了电子计算机的硬件基础。


    发明逻辑代数的人叫乔治·布尔。1847 年，布尔出版了《逻辑的数学分析》。这本小册子首次提出了布尔代数，把逻辑学带入了数理逻辑的时代。


    '
  toc: []
- raw: '1815年，乔治·布尔出生于英国东部的林肯郡，他的父亲是个补鞋匠。因家庭条件困难，布尔没有机会接受正规的教育，但聪明勤奋的小布尔自学成才， 16岁就开始当教师补贴家用，19岁时创办了自己的学校，从此挑起了整个家庭的重担。


    布尔在教书的过程中不断探索和总结前辈的知识和理论，发明了逻辑代数，把逻辑简化成极其容易和简单的一种代数。在这种代数中，逻辑推理成了数学公式的初等运算，这些公式比过去在中学代数中所运用的大多数公式还要简单得多。布尔的发明让逻辑本身受到了数学的支配。为了使自己的研究工作趋于完善，布尔在此后6年的漫长时间里又付出了不同寻常的努力。


    ![](images/figure_0074_0047.jpg)


    布尔


    1854年，布尔出版了他的经典著作《思维规律的研究》，更加系统地阐述了布尔代数。布尔代数问世了，数学史上树起了又一座新的丰碑。但布尔作为一个师出无名的小学老师，他的发明没有受到人们的重视。欧洲大陆著名的数学家蔑视地称它为没有数学意义的、哲学上稀奇古怪的东西，他们怀疑英伦岛国的自学成才的数学家能在数学上做出什么独特贡献。


    ![](images/figure_0074_0048.jpg)


    《思维规律的研究》


    布尔在他的杰作出版后不久就去世了。直到20世纪初，英国的另外一名哲学家、逻辑学家罗素在《数学原理》中认为：“纯数学是由布尔在一部他称为《思维规律的研究》的著作中发现的。”此说一出，立刻引起世人对布尔代数的极大关注，布尔才得以重新进入人们的视野，名垂千古。


    罗素出生于1872年，逝于1970年。他不仅经历过两次世界大战，目睹了大英帝国从巅峰向下的没落，还见证了计算机科学和人工智能的孕育和诞生。罗素出身于英国贵族家庭，他的祖父约翰·罗素勋爵在19世纪40年代曾两次出任英国首相。罗素幼年就相继失去了母亲和父亲，由祖父母抚养长大。


    ![](images/figure_0075_0049.jpg)


    罗素


    罗素和他的老师怀特海花了9年时间一起写成了一部三卷本的著作《数学原理》，试图表明所有的数学真理在一组数理逻辑内的公理和推理规则下，原则上都是可以证明的。这一雄心勃勃的宏伟设想后来被美国数学家哥德尔发表的“哥德尔不完全性定理”证明是不可能实现的。


    但罗素和怀特海的《数学原理》启发了很多天才人物，与麦卡洛克一起发明了MP神经元模型的皮茨就曾经在12岁时苦读《数学原理》，还写信给罗素讨论他发现的问题，得到了罗素的极大赞赏并被邀请到剑桥大学读书，后来成为了神经网络的创始人之一。


    罗素最受欢迎的著作是《西方哲学史》，这本哲学史著作写得幽默、清晰、简洁，同时还有作者本人作为大哲学家的真知灼见。1950年，罗素为此获得了诺贝尔文学奖。颁奖词对他的介绍是：“他一生著述甚丰，涵盖极广。他论及人类知识和数理逻辑的科学著作具有划时代意义，堪与牛顿的机械原理媲美……在诺贝尔基金会设立50周年之际，瑞典文学院相信自己正是按照诺贝尔设奖的精神把这份荣誉授予伯特兰·罗素这位当代的理性和人道主义的杰出代言人的。”


    ## [4.3 贝叶斯定理和统计学派](../contents/content.xhtml#toc28)


    在人工智能领域应用最多的也许就是贝叶斯定理和基于贝叶斯定理的贝叶斯网络了，它们是机器学习的核心方法之一，从简单的拼写校正、垃圾邮件过滤到图像识别、机器翻译，几乎无所不在。贝叶斯定理的发明者是英国牧师托马斯·贝叶斯。


    ![](images/figure_0076_0050.jpg)


    贝叶斯


    说起贝叶斯，其实他并不是一名专业数学家。从英国爱丁堡大学毕业后，他就继承父业，做了英格兰长老会的一名牧师。作为一名新教的牧师，他一生都想证明上帝的存在。可在证明上帝的存在时，贝叶斯遇到了一个棘手的难题，就是无法获得完整的信息。如何处理部分未知的信息和条件让他大伤脑筋。


    白天，他一边忠心耿耿地服务于他的上帝，兢兢业业地履行他的教职，一边冥思苦想；晚上，烛灯燃尽，伏案执笔，写写算算，推导论证。遗憾的是，他到死也没能够证明上帝的存在，但他的研究创造了概率统计学中的一个原理。他发明的贝叶斯公式更是成为处理这类不确定性问题的金钥匙，冥冥之中成为了后来人工智能的一大基石。


    那么，贝叶斯公式是怎样的呢？它又是怎样解决不确定性问题的呢？贝叶斯公式写出来是这样的：


    ![](images/figure_0076_0051.jpg)


    这里的P代表事件Dj发生的可能性有多大，我们称之为Dj发生的概率。事件Dj是总事件x 中的一个随机抽取的样本。如何理解这个看似复杂的公式呢？我们通过一个例子来说明这个公式是怎样解决不确定性问题的。


    假设你有一台无线电收音机，午夜以后一个电台会发出两个固定信号之中的一个，我们用信号A和信号B来区分它们。一天夜里，我们打算接收这个电台发出的信号，猜一猜今天这个电台会发出A和B之中的哪一个信号？简单，我们实际收听一下不就得了。可是假设电台离我们很远，收到的信号又含有很大的噪声。怎么办呢？我们知道过去信号发出的概率，能不能以此来推断出今夜电台发出的信号是A还是B呢？


    让我们把今夜接收到的信号定义为y，实际发出的信号定义为x（x只可能是A或者B）。那么，接收到的信号是A的可能性可以写成P(x\=A|y），接收到的信号是B的可能性就可以写成P(x\=B|y）。一个合乎逻辑的判断规则应该是，如果今夜发出A的概率大于发出B的概率，那么今夜发出的信号就可能是A，反之亦然。可问题是我们并不能准确地知道今夜它们出现的概率。这时贝叶斯公式就可以帮我们解决这个问题，它允许我们通过猜测或获得其他概率来间接地计算出我们所要的概率。


    假设我们知道它们以前每晚发出的概率P(x\=A)和P(x\=B)，就只需要计算出在x\=A和x\=B时的P(y|x)，通过比较它们中的哪一个更大来决定今夜发出的信号是A还是B。P(y|x)被称为在给定的x下y的可能性（说得专业一点叫似然率）。关于具体运用贝叶斯公式的计算过程，我们就不在这里介绍了，等有机会学习概率统计学时，老师一定会进行详细的讲授。


    这有一点烧脑，不然贝叶斯也不会因此成为举世公认的数学家，大名鼎鼎的贝叶斯公式也不可能成为今天人工智能的一大基石。简单地说，贝叶斯公式就是在已知的先验概率的基础上，计算出可能发生的后验概率，根据后验概率的大小为决策提供依据。


    经过百年的发展和完善，贝叶斯公式已经成为了一整套理论和方法，并在概率统计领域中自成一家。1742年，贝叶斯因为他卓著的研究成果被接纳为英国皇家学会的会员，他的两部著作《机会问题的解法》和《机会的学说概论》在他死后也广受重视，影响至今。


    人工智能技术历来有符号学派和统计学派两大阵营之分。符号学派以规则和逻辑推理为核心探索人工智能的方法，统计学派则用大数据和概率统计的方法探索人工智能的实现，其核心就是贝叶斯定理。让我们通过一个机器翻译的小例子看看贝叶斯是怎么帮到我们的。


    假设我们要把这样一句英语“John loves Mary”（约翰爱玛丽）翻译成法语“Jean aime Marie”。我们用e代表“John loves Mary”，需要考察的首选f为“Jean
    aime Marie”（法语）。我们需要求出把e翻译成f的可能性有多大，即P(e|f) 是多大。为此，我们考虑 e 和 f 有多少种对齐的可能性。什么叫对齐呢？就是每一个英语单词可以有多少个法语单词与之相对。英语“John”
    对应于法语“Jean”，英语“loves”对应于法语“aime”，英语“Mary”对应于法语“Marie”，以上就是其中的一种（最靠谱的）可能的对齐。为什么要对齐呢？因为一旦对齐了，就容易计算在这个对齐之下的P(e|f)
    是多大，即计算P(John|Jean)×P(loves|aime) ×P(Mary|Marie)。然后，我们遍历所有的对齐方式，并对每种对齐方式之下的翻译概率进行求和，便可以得知
    P(e|f) 是多大。


    ![](images/figure_0078_0052.jpg)


    朱迪·珀尔


    这就是统计机器翻译的方法，因为其简单，可以自动（无须手动添加规则）进行计算，所以这种方法迅速成为了机器翻译的事实标准。而统计机器翻译的核心就是贝叶斯方法。


    1988年，以色列裔美籍计算机科学家和哲学家朱迪·珀尔教授在贝叶斯定理的基础上发明了贝叶斯网络。它是一种基于概率的不确定性的推理网络，是用来表示变量集合连接概率的图形模型，提供了一种表示因果信息的方法。我们已经知道，贝叶斯公式为预测事件出现的概率提供了一种工具，但概率预测中并不包含因果关系，而分析因果关系是一件很困难的事。比如，路上的很多人都带着雨伞代表可能会下雨，但雨伞不是下雨的原因。当你想改变事件的结果时，了解因果关系就显得十分重要了，比如要阻止一场雨，不可能让所有人都不带雨伞。朱迪教授的贝叶斯网络提供了包含因果分析的概率方法，使基于概率的机器推理模型让计算机能在复杂的、模糊的和充满不确定性的环境下工作，是目前不确定性知识表达和推理领域中最有效的理论模型之一。


    贝叶斯网络在自然语言处理、故障诊断、语音识别等许多领域得到了广泛的运用，珀尔教授也因此获得2011年度的图灵奖，成为又一位荣获图灵奖的人工智能学者。在今天这样一个物联网不断进入各行各业的新时代，智能家居、自动驾驶汽车、智能手机、智慧城市中无数的传感器每时每刻都在产生亿万字节级的数据，基于贝叶斯网络等统计数学模型的人工智能算法成为这些应用的基石。


    ## [4.4 哥德尔和他的不完全性定理](../contents/content.xhtml#toc29)


    悖论就是逻辑上的自相矛盾。


    最古老的悖论是2000多年前的“说谎者悖论”。它最简单的形式可以是这样的一句话：“我说的是假话。”如果你说这句话是假的，就可以推出它是真话；如果你认为这句话是真的，那么就可以推出它是假话。总之，这句话的真假是不能通过逻辑推理证明的。


    20世纪，一些善于思考的人隐约觉察到，在这样的悖论中隐藏着一些深刻的数学理论。事情要从崇尚理性的文艺复兴时期谈起。当时的学者笛卡儿、莱布尼茨等都想创造一种理论来解决一切问题。莱布尼茨甚至设想用数学符号表示逻辑学，以后每逢争论，拿支笔一算就见分晓了。事实证明，莱布尼茨对符号逻辑的建立起了很大的作用。


    莱布尼茨太超前于时代了，没能完成他的夙愿。又过了200年，著名学者康托尔提出集合论，为统一数学提供了一线希望。集合论是研究由一堆抽象事物构成的整体的数学理论，包含了集合、元素和成员关系等最基本的数学概念。集合论的出现，为近代数学的发展提供了有力的工具。就在数学家踌躇满志的时候，集合论中出现了悖论。康托尔自己就发现了康托尔悖论：包含一切集合的集合是否存在。更严重的是罗素悖论。


    罗素曾经认真地思考过这个悖论，并试图找到解决办法。他在《数学原理》里说道：“自亚里士多德以来，无论哪一个学派的逻辑学家从他们所公认的前提中似乎都可以推出一些矛盾来。这表明有些东西是有毛病的，但是指不出纠正的方法是什么。1903年春季，其中一种矛盾的发现把我正在享受的那种逻辑蜜月打断了。”


    他承认“说谎者悖论”是一个例证，可以最简单地勾画出他发现的那个矛盾。那个说谎者说：“不论我说什么都是假的。”事实上，这就是他所说的一句话，但是这句话是指他所说的话的总体。当把这句话包括在那个总体之中的时候，悖论就产生了。


    罗素试图用命题分层的办法来解决这个问题。我们可以说第一级命题就是不涉及命题总体的那些命题，第二级命题就是涉及第一级命题的总体的那些命题，以此类推，以至无穷。但是这一方法并没有取得成效。从1903年到1904年，他差不多完全致力于解决这一悖论，但是毫无进展。罗素悖论涉及的是以自己为元素的集合，这被称为“第三次数学危机”。后来，这种定义被公理排斥掉了，危机才得以解决。


    20世纪20年代，在集合论不断发展的基础上，大数学家希尔伯特向全世界的数学家抛出了个宏伟计划，其大意是建立一组公理体系，使一切数学命题在原则上都可由此经有限步推定真伪，这叫作公理体系的“完备性”。希尔伯特还要求公理体系保持“独立性”（即所有公理都是互相独立的，使公理系统尽可能地简洁）和“无矛盾性”（即相容性，不能从公理系统中导出矛盾）。


    当然，希尔伯特所说的公理不是我们通常认为的公理，而是经过了彻底的形式化，它们存在于一门叫作元数学的分支中。元数学与一般数学理论的关系有点像计算机中应用程序和普通文件的关系。


    希尔伯特的计划也确实有一定的进展，几乎全世界的数学家都乐观地看着数学大厦即将竣工。正当一切都越来越明朗之际，突然一声晴天霹雳。1931年，在希尔伯特提出计划不到3年，年轻的哥德尔就使希尔伯特的梦想变成了令人沮丧的噩梦。哥德尔证明：任何无矛盾的公理体系只要包含初等算术的陈述，则必定存在一个不可判定命题，用这组公理不能判定其真假。也就是说，“无矛盾性”和“完备性”是不能同时满足的！这便是闻名于世的哥德尔不完全性定理。


    ![](images/figure_0081_0053.jpg)


    哥德尔


    哥德尔，1906年生于奥匈帝国的布尔诺，1924年开始在维也纳大学攻读物理学，后来转到了数学系，1930年获得博士学位。受他的老师、逻辑学家莫里茨·石里克的影响，他开始参加维也纳学派的活动，与石里克、卡尔纳普等哲学大师一起讨论科学理论、客观存在和真理之间的关系，这为他后来的研究与发现奠定了基础。


    1931年，年轻的哥德尔做了一件他人生中轰动的事情，发表了一篇石破天惊的论文《数学原理及有关系统中的形式不可判定命题》。在论文中，他证明了哥德尔不完全性定理，即数论的所有一致的公理化形式系统都包含不可判定的命题。这篇论文对当时的数学家、逻辑学家和哲学家产生了震撼性的影响，可以说是20世纪在逻辑学和数学基础方面最重要的一篇论文。当时，冯·诺依曼评价说：“哥德尔在现代逻辑中的成就是非凡的、不朽的，他的不朽甚至超过了纪念碑，他是一座里程碑，是永存的纪念碑。”


    1938年，哥德尔又做了一件他人生中轰动的事情，和比他大6岁的曾经结过婚的夜总会女郎结婚。他们的婚姻遭到了哥德尔全家人的反对，但有情人终成眷属。也就是在那一年，他离开了维也纳，到美国普林斯顿高等研究院任职，后来加入美国国籍，成为该研究院的教授。在那里，哥德尔和爱因斯坦成了好朋友。其实，他俩的性格大相径庭，爱因斯坦开朗外向，哥德尔深沉内敛，但他们都在自己的领域做出了极为重大的贡献。他们都很聪明，有好奇心，性情直率。爱因斯坦的死对哥德尔的心情有巨大的打击。


    哥德尔不完全性定理一举粉碎了数学家2000年来的信念。他告诉我们，真与可证明是两个概念。可证明的一定是真的，但真的不一定可证明。在某种意义上，悖论的阴影将永远伴随着我们。无怪乎大数学家外尔发出这样的感叹：“上帝是存在的，因为数学无疑是相容的；魔鬼也是存在的，因为我们不能证明这种相容性。”


    但是，哥德尔不完全性定理的影响远远超出了数学的范畴。它不仅使数学和逻辑学发生了革命性的变化，引发了许多富有挑战性的问题，而且涉及哲学、语言学、计算机科学甚至宇宙学。2002年8月17日，著名的宇宙学家霍金在北京举行的国际弦理论会议上发表了题为《哥德尔与M理论》的报告，认为建立一个单一的描述宇宙的大统一理论是不太可能的，这一推测也正是基于哥德尔不完全性定理。


    有意思的是，在现今十分热门的人工智能领域，哥德尔不完全性定理是否适用也成为了人们争论的焦点。1961年，牛津大学的哲学家卢卡斯提出，根据哥德尔不完全性定理，机器不可能具有人的心智。他的观点激起了很多人的反对。他们认为，哥德尔不完全性定理与机器有无心智没有关系，但哥德尔不完全性定理对人的限制同样也适用于机器倒是事实。


    哥德尔不完全性定理的影响如此之广泛，难怪哥德尔会被看作当代最有影响力的智慧巨人之一，受到人们的永恒怀念。美国《时代》杂志曾评选出20世纪100位最伟大的人物，在数学家中排在第一位的就是哥德尔。


    在人工智能即将进入突破阶段的今天，相信从牛顿到哥德尔这些数学大师的思想以及他们发明的各种精妙绝伦的数学理论和工具将启发和引领更多的天才去破解人类思维和机器学习最终的奥秘。


    ## [4.5 一代宗师杰弗里·辛顿](../contents/content.xhtml#toc30)


    在人工智能研究中，模拟人类大脑的神经网络技术自发明以后，其实一直不受待见，因为20世纪计算机的计算能力和存储空间都无法支持大数据的处理。一个人类大脑的神经网络有数以亿计的连接。如果一个人工神经网络要想接近人脑，每个人工神经元就必须达到1万个大脑神经元的功能，这谈何容易呀！因此，美国在里根政府时期大幅削减了对人工智能特别是神经网络技术的支持，这让很多人工智能研究人员纷纷改行，更让一些研究神经网络技术的专家离开美国前往加拿大，后来成为神经网络技术一代宗师的杰弗里·辛顿就是其中之一。


    曾经任美国卡内基·梅隆大学教授的辛顿于1947年出生在英国。他出身于一个非常传奇的家族。他爷爷的外祖父就是伟大的数学家乔治·布尔，乔治·布尔的妻子名叫玛丽·埃沃莱斯特，是一位作家。玛丽·埃沃莱斯特的叔叔是乔治·埃沃莱斯特，他是英国著名的测绘学家和探险家，曾经担任过英国殖民地印度的测量局局长，领导了喜马拉雅山脉测量工作。辛顿的全名就是杰弗里·埃沃莱斯特·辛顿。当年他的家人给他命名埃沃莱斯特时，也许已经预言了他未来勇攀科学高峰的命运。


    ![](images/figure_0083_0054.jpg)


    辛顿


    辛顿从小就对人类的大脑是如何工作的十分着迷。他后来回忆说，上中学的时候，班里的一个同学忽悠他说，大脑的工作就像一张全息图。他当时信以为真，十分兴奋。辛顿进入剑桥大学学习心理学后意识到，科学家并没有真正理解大脑，他们并没有完全了解大脑是如何学习以及如何提升智力的。在辛顿看来，这些都是关乎人工智能研究梦想的大问题，他开始在剑桥大学和爱丁堡大学探索神经网络。1978年，辛顿从爱丁堡大学获得人工智能博士学位。毕业后，辛顿开始了他雄心勃勃的计划，利用计算机硬件和软件来模拟人类大脑，研究如何大幅度缩短训练人工神经网络所需要的时间，创建一种神经网络的机器学习方法。这是后来人们高度关注的深度学习。


    人工神经网络的一大难题，就是如何驾驭百万级乃至亿级神经元之间那庞大得如天文数字一般的组合关系。这一过程的关键是要将人工神经网络组织成为堆叠层。拿人脸识别来说，当一个人工神经网络中的一组特征被发现能够形成某种图案（比如说一只眼睛）时，这一结果就会被向上转移到该人工神经网络的另一层做进一步的分析。接下来的这一层可能会将两只眼睛拼在一起，将这一有意义的数据再传递到层级结构的第三层，该层可以将眼睛和鼻子的图像结合到一起进行分析。就这样一层一层地叠加，识别一张人脸可能需要数百万个这种节点，堆叠层可高达15个层级。'
  fmt: '

    ## 布尔与罗素

    1815年，乔治·布尔出生于英国东部的林肯郡，他的父亲是个补鞋匠。因家庭条件困难，布尔没有机会接受正规的教育，但聪明勤奋的小布尔自学成才，16岁就开始当教师补贴家用，19岁时创办了自己的学校，从此挑起了整个家庭的重担。

    布尔在教书的过程中不断探索和总结前辈的知识和理论，发明了逻辑代数，把逻辑简化成极其容易和简单的一种代数。在这种代数中，逻辑推理成了数学公式的初等运算，这些公式比过去在中学代数中所运用的大多数公式还要简单得多。布尔的发明让逻辑本身受到了数学的支配。为了使自己的研究工作趋于完善，布尔在此后6年的漫长时间里又付出了不同寻常的努力。


    ![](images/figure_0074_0047.jpg)

    布尔

    1854年，布尔出版了他的经典著作《思维规律的研究》，更加系统地阐述了布尔代数。布尔代数问世了，数学史上树起了又一座新的丰碑。但布尔作为一个师出无名的小学老师，他的发明没有受到人们的重视。欧洲大陆著名的数学家蔑视地称它为没有数学意义的、哲学上稀奇古怪的东西，他们怀疑英伦岛国的自学成才的数学家能在数学上做出什么独特贡献。


    ![](images/figure_0074_0048.jpg)

    《思维规律的研究》

    布尔在他的杰作出版后不久就去世了。直到20世纪初，英国的另外一名哲学家、逻辑学家罗素在《数学原理》中认为：“纯数学是由布尔在一部他称为《思维规律的研究》的著作中发现的。”此说一出，立刻引起世人对布尔代数的极大关注，布尔才得以重新进入人们的视野，名垂千古。

    罗素出生于1872年，逝于1970年。他不仅经历过两次世界大战，目睹了大英帝国从巅峰向下的没落，还见证了计算机科学和人工智能的孕育和诞生。罗素出身于英国贵族家庭，他的祖父约翰·罗素勋爵在19世纪40年代曾两次出任英国首相。罗素幼年就相继失去了母亲和父亲，由祖父母抚养长大。


    ![](images/figure_0075_0049.jpg)

    罗素

    罗素和他的老师怀特海花了9年时间一起写成了一部三卷本的著作《数学原理》，试图表明所有的数学真理在一组数理逻辑内的公理和推理规则下，原则上都是可以证明的。这一雄心勃勃的宏伟设想后来被美国数学家哥德尔发表的“哥德尔不完全性定理”证明是不可能实现的。

    但罗素和怀特海的《数学原理》启发了很多天才人物，与麦卡洛克一起发明了`MP`神经元模型的皮茨就曾经在12岁时苦读《数学原理》，还写信给罗素讨论他发现的问题，得到了罗素的极大赞赏并被邀请到剑桥大学读书，后来成为了神经网络的创始人之一。

    罗素最受欢迎的著作是《西方哲学史》，这本哲学史著作写得幽默、清晰、简洁，同时还有作者本人作为大哲学家的真知灼见。1950年，罗素为此获得了诺贝尔文学奖。颁奖词对他的介绍是：“他一生著述甚丰，涵盖极广。他论及人类知识和数理逻辑的科学著作具有划时代意义，堪与牛顿的机械原理媲美……在诺贝尔基金会设立50周年之际，瑞典文学院相信自己正是按照诺贝尔设奖的精神把这份荣誉授予伯特兰·罗素这位当代的理性和人道主义的杰出代言人的。”


    ## 4.3 贝叶斯定理和统计学派

    在人工智能领域应用最多的也许就是贝叶斯定理和基于贝叶斯定理的贝叶斯网络了，它们是机器学习的核心方法之一，从简单的拼写校正、垃圾邮件过滤到图像识别、机器翻译，几乎无所不在。贝叶斯定理的发明者是英国牧师托马斯·贝叶斯。


    ![](images/figure_0076_0050.jpg)

    贝叶斯

    说起贝叶斯，其实他并不是一名专业数学家。从英国爱丁堡大学毕业后，他就继承父业，做了英格兰长老会的一名牧师。作为一名新教的牧师，他一生都想证明上帝的存在。可在证明上帝的存在时，贝叶斯遇到了一个棘手的难题，就是无法获得完整的信息。如何处理部分未知的信息和条件让他大伤脑筋。

    白天，他一边忠心耿耿地服务于他的上帝，兢兢业业地履行他的教职，一边冥思苦想；晚上，烛灯燃尽，伏案执笔，写写算算，推导论证。遗憾的是，他到死也没能够证明上帝的存在，但他的研究创造了概率统计学中的一个原理。他发明的贝叶斯公式更是成为处理这类不确定性问题的金钥匙，冥冥之中成为了后来人工智能的一大基石。

    那么，贝叶斯公式是怎样的呢？它又是怎样解决不确定性问题的呢？贝叶斯公式写出来是这样的：


    ![](images/figure_0076_0051.jpg)

    这里的`P`代表事件`Dj`发生的可能性有多大，我们称之为`Dj`发生的概率。事件`Dj`是总事件`x` 中的一个随机抽取的样本。如何理解这个看似复杂的公式呢？我们通过一个例子来说明这个公式是怎样解决不确定性问题的。

    假设你有一台无线电收音机，午夜以后一个电台会发出两个固定信号之中的一个，我们用信号`A`和信号`B`来区分它们。一天夜里，我们打算接收这个电台发出的信号，猜一猜今天这个电台会发出`A`和`B`之中的哪一个信号？简单，我们实际收听一下不就得了。可是假设电台离我们很远，收到的信号又含有很大的噪声。怎么办呢？我们知道过去信号发出的概率，能不能以此来推断出今夜电台发出的信号是`A`还是`B`呢？

    让我们把今夜接收到的信号定义为`y`，实际发出的信号定义为`x`（`x`只可能是`A`或者`B`）。那么，接收到的信号是`A`的可能性可以写成`P(x\=A|y）`，接收到的信号是`B`的可能性就可以写成`P(x\=B|y）`。一个合乎逻辑的判断规则应该是，如果今夜发出`A`的概率大于发出`B`的概率，那么今夜发出的信号就可能是`A`，反之亦然。可问题是我们并不能准确地知道今夜它们出现的概率。这时贝叶斯公式就可以帮我们解决这个问题，它允许我们通过猜测或获得其他概率来间接地计算出我们所要的概率。

    假设我们知道它们以前每晚发出的概率`P(x\=A)`和`P(x\=B)`，就只需要计算出在`x\=A`和`x\=B`时的`P(y|x)`，通过比较它们中的哪一个更大来决定今夜发出的信号是`A`还是`B`。`P(y|x)`被称为在给定的`x`下`y`的可能性（说得专业一点叫似然率）。关于具体运用贝叶斯公式的计算过程，我们就不在这里介绍了，等有机会学习概率统计学时，老师一定会进行详细的讲授。

    这有一点烧脑，不然贝叶斯也不会因此成为举世公认的数学家，大名鼎鼎的贝叶斯公式也不可能成为今天人工智能的一大基石。简单地说，贝叶斯公式就是在已知的先验概率的基础上，计算出可能发生的后验概率，根据后验概率的大小为决策提供依据。

    经过百年的发展和完善，贝叶斯公式已经成为了一整套理论和方法，并在概率统计领域中自成一家。1742年，贝叶斯因为他卓著的研究成果被接纳为英国皇家学会的会员，他的两部著作《机会问题的解法》和《机会的学说概论》在他死后也广受重视，影响至今。

    人工智能技术历来有符号学派和统计学派两大阵营之分。符号学派以规则和逻辑推理为核心探索人工智能的方法，统计学派则用大数据和概率统计的方法探索人工智能的实现，其核心就是贝叶斯定理。让我们通过一个机器翻译的小例子看看贝叶斯是怎么帮到我们的。

    假设我们要把这样一句英语“John loves Mary”（约翰爱玛丽）翻译成法语“Jean aime Marie”。我们用`e`代表“John loves
    Mary”，需要考察的首选`f`为“Jean aime Marie”（法语）。我们需要求出把`e`翻译成`f`的可能性有多大，即`P(e|f)` 是多大。为此，我们考虑
    `e` 和 `f` 有多少种对齐的可能性。什么叫对齐呢？就是每一个英语单词可以有多少个法语单词与之相对。英语“John” 对应于法语“Jean”，英语“loves”对应于法语“aime”，英语“Mary”对应于法语“Marie”，以上就是其中的一种（最靠谱的）可能的对齐。为什么要对齐呢？因为一旦对齐了，就容易计算在这个对齐之下的`P(e|f)`
    是多大，即计算`P(John|Jean)`×`P(loves|aime)` ×`P(Mary|Marie)`。然后，我们遍历所有的对齐方式，并对每种对齐方式之下的翻译概率进行求和，便可以得知
    `P(e|f)` 是多大。


    ![](images/figure_0078_0052.jpg)

    朱迪·珀尔

    这就是统计机器翻译的方法，因为其简单，可以自动（无须手动添加规则）进行计算，所以这种方法迅速成为了机器翻译的事实标准。而统计机器翻译的核心就是贝叶斯方法。

    1988年，以色列裔美籍计算机科学家和哲学家朱迪·珀尔教授在贝叶斯定理的基础上发明了贝叶斯网络。它是一种基于概率的不确定性的推理网络，是用来表示变量集合连接概率的图形模型，提供了一种表示因果信息的方法。我们已经知道，贝叶斯公式为预测事件出现的概率提供了一种工具，但概率预测中并不包含因果关系，而分析因果关系是一件很困难的事。比如，路上的很多人都带着雨伞代表可能会下雨，但雨伞不是下雨的原因。当你想改变事件的结果时，了解因果关系就显得十分重要了，比如要阻止一场雨，不可能让所有人都不带雨伞。朱迪教授的贝叶斯网络提供了包含因果分析的概率方法，使基于概率的机器推理模型让计算机能在复杂的、模糊的和充满不确定性的环境下工作，是目前不确定性知识表达和推理领域中最有效的理论模型之一。

    贝叶斯网络在自然语言处理、故障诊断、语音识别等许多领域得到了广泛的运用，珀尔教授也因此获得2011年度的图灵奖，成为又一位荣获图灵奖的人工智能学者。在今天这样一个物联网不断进入各行各业的新时代，智能家居、自动驾驶汽车、智能手机、智慧城市中无数的传感器每时每刻都在产生亿万字节级的数据，基于贝叶斯网络等统计数学模型的人工智能算法成为这些应用的基石。


    ## 4.4 哥德尔和他的不完全性定理

    悖论就是逻辑上的自相矛盾。

    最古老的悖论是2000多年前的“说谎者悖论”。它最简单的形式可以是这样的一句话：“我说的是假话。”如果你说这句话是假的，就可以推出它是真话；如果你认为这句话是真的，那么就可以推出它是假话。总之，这句话的真假是不能通过逻辑推理证明的。

    20世纪，一些善于思考的人隐约觉察到，在这样的悖论中隐藏着一些深刻的数学理论。事情要从崇尚理性的文艺复兴时期谈起。当时的学者笛卡儿、莱布尼茨等都想创造一种理论来解决一切问题。莱布尼茨甚至设想用数学符号表示逻辑学，以后每逢争论，拿支笔一算就见分晓了。事实证明，莱布尼茨对符号逻辑的建立起了很大的作用。

    莱布尼茨太超前于时代了，没能完成他的夙愿。又过了200年，著名学者康托尔提出集合论，为统一数学提供了一线希望。集合论是研究由一堆抽象事物构成的整体的数学理论，包含了集合、元素和成员关系等最基本的数学概念。集合论的出现，为近代数学的发展提供了有力的工具。就在数学家踌躇满志的时候，集合论中出现了悖论。康托尔自己就发现了康托尔悖论：包含一切集合的集合是否存在。更严重的是罗素悖论。

    罗素曾经认真地思考过这个悖论，并试图找到解决办法。他在《数学原理》里说道：“自亚里士多德以来，无论哪一个学派的逻辑学家从他们所公认的前提中似乎都可以推出一些矛盾来。这表明有些东西是有毛病的，但是指不出纠正的方法是什么。1903年春季，其中一种矛盾的发现把我正在享受的那种逻辑蜜月打断了。”

    他承认“说谎者悖论”是一个例证，可以最简单地勾画出他发现的那个矛盾。那个说谎者说：“不论我说什么都是假的。”事实上，这就是他所说的一句话，但是这句话是指他所说的话的总体。当把这句话包括在那个总体之中的时候，悖论就产生了。

    罗素试图用命题分层的办法来解决这个问题。我们可以说第一级命题就是不涉及命题总体的那些命题，第二级命题就是涉及第一级命题的总体的那些命题，以此类推，以至无穷。但是这一方法并没有取得成效。从1903年到1904年，他差不多完全致力于解决这一悖论，但是毫无进展。罗素悖论涉及的是以自己为元素的集合，这被称为“第三次数学危机”。后来，这种定义被公理排斥掉了，危机才得以解决。

    20世纪20年代，在集合论不断发展的基础上，大数学家希尔伯特向全世界的数学家抛出了个宏伟计划，其大意是建立一组公理体系，使一切数学命题在原则上都可由此经有限步推定真伪，这叫作公理体系的“完备性”。希尔伯特还要求公理体系保持“独立性”（即所有公理都是互相独立的，使公理系统尽可能地简洁）和“无矛盾性”（即相容性，不能从公理系统中导出矛盾）。

    当然，希尔伯特所说的公理不是我们通常认为的公理，而是经过了彻底的形式化，它们存在于一门叫作元数学的分支中。元数学与一般数学理论的关系有点像计算机中应用程序和普通文件的关系。

    希尔伯特的计划也确实有一定的进展，几乎全世界的数学家都乐观地看着数学大厦即将竣工。正当一切都越来越明朗之际，突然一声晴天霹雳。1931年，在希尔伯特提出计划不到3年，年轻的哥德尔就使希尔伯特的梦想变成了令人沮丧的噩梦。哥德尔证明：任何无矛盾的公理体系只要包含初等算术的陈述，则必定存在一个不可判定命题，用这组公理不能判定其真假。也就是说，“无矛盾性”和“完备性”是不能同时满足的！这便是闻名于世的哥德尔不完全性定理。


    ![](images/figure_0081_0053.jpg)

    哥德尔

    哥德尔，1906年生于奥匈帝国的布尔诺，1924年开始在维也纳大学攻读物理学，后来转到了数学系，1930年获得博士学位。受他的老师、逻辑学家莫里茨·石里克的影响，他开始参加维也纳学派的活动，与石里克、卡尔纳普等哲学大师一起讨论科学理论、客观存在和真理之间的关系，这为他后来的研究与发现奠定了基础。

    1931年，年轻的哥德尔做了一件他人生中轰动的事情，发表了一篇石破天惊的论文《数学原理及有关系统中的形式不可判定命题》。在论文中，他证明了哥德尔不完全性定理，即数论的所有一致的公理化形式系统都包含不可判定的命题。这篇论文对当时的数学家、逻辑学家和哲学家产生了震撼性的影响，可以说是20世纪在逻辑学和数学基础方面最重要的一篇论文。当时，冯·诺依曼评价说：“哥德尔在现代逻辑中的成就是非凡的、不朽的，他的不朽甚至超过了纪念碑，他是一座里程碑，是永存的纪念碑。”

    1938年，哥德尔又做了一件他人生中轰动的事情，和比他大6岁的曾经结过婚的夜总会女郎结婚。他们的婚姻遭到了哥德尔全家人的反对，但有情人终成眷属。也就是在那一年，他离开了维也纳，到美国普林斯顿高等研究院任职，后来加入美国国籍，成为该研究院的教授。在那里，哥德尔和爱因斯坦成了好朋友。其实，他俩的性格大相径庭，爱因斯坦开朗外向，哥德尔深沉内敛，但他们都在自己的领域做出了极为重大的贡献。他们都很聪明，有好奇心，性情直率。爱因斯坦的死对哥德尔的心情有巨大的打击。

    哥德尔不完全性定理一举粉碎了数学家2000年来的信念。他告诉我们，真与可证明是两个概念。可证明的一定是真的，但真的不一定可证明。在某种意义上，悖论的阴影将永远伴随着我们。无怪乎大数学家外尔发出这样的感叹：“上帝是存在的，因为数学无疑是相容的；魔鬼也是存在的，因为我们不能证明这种相容性。”

    但是，哥德尔不完全性定理的影响远远超出了数学的范畴。它不仅使数学和逻辑学发生了革命性的变化，引发了许多富有挑战性的问题，而且涉及哲学、语言学、计算机科学甚至宇宙学。2002年8月17日，著名的宇宙学家霍金在北京举行的国际弦理论会议上发表了题为《哥德尔与M理论》的报告，认为建立一个单一的描述宇宙的大统一理论是不太可能的，这一推测也正是基于哥德尔不完全性定理。

    有意思的是，在现今十分热门的人工智能领域，哥德尔不完全性定理是否适用也成为了人们争论的焦点。1961年，牛津大学的哲学家卢卡斯提出，根据哥德尔不完全性定理，机器不可能具有人的心智。他的观点激起了很多人的反对。他们认为，哥德尔不完全性定理与机器有无心智没有关系，但哥德尔不完全性定理对人的限制同样也适用于机器倒是事实。

    哥德尔不完全性定理的影响如此之广泛，难怪哥德尔会被看作当代最有影响力的智慧巨人之一，受到人们的永恒怀念。美国《时代》杂志曾评选出20世纪100位最伟大的人物，在数学家中排在第一位的就是哥德尔。

    在人工智能即将进入突破阶段的今天，相信从牛顿到哥德尔这些数学大师的思想以及他们发明的各种精妙绝伦的数学理论和工具将启发和引领更多的天才去破解人类思维和机器学习最终的奥秘。


    ## 4.5 一代宗师杰弗里·辛顿

    在人工智能研究中，模拟人类大脑的神经网络技术自发明以后，其实一直不受待见，因为20世纪计算机的计算能力和存储空间都无法支持大数据的处理。一个人类大脑的神经网络有数以亿计的连接。如果一个人工神经网络要想接近人脑，每个人工神经元就必须达到1万个大脑神经元的功能，这谈何容易呀！因此，美国在里根政府时期大幅削减了对人工智能特别是神经网络技术的支持，这让很多人工智能研究人员纷纷改行，更让一些研究神经网络技术的专家离开美国前往加拿大，后来成为神经网络技术一代宗师的杰弗里·辛顿就是其中之一。

    曾经任美国卡内基·梅隆大学教授的辛顿于1947年出生在英国。他出身于一个非常传奇的家族。他爷爷的外祖父就是伟大的数学家乔治·布尔，乔治·布尔的妻子名叫玛丽·埃沃莱斯特，是一位作家。玛丽·埃沃莱斯特的叔叔是乔治·埃沃莱斯特，他是英国著名的测绘学家和探险家，曾经担任过英国殖民地印度的测量局局长，领导了喜马拉雅山脉测量工作。辛顿的全名就是杰弗里·埃沃莱斯特·辛顿。当年他的家人给他命名埃沃莱斯特时，也许已经预言了他未来勇攀科学高峰的命运。


    ![](images/figure_0083_0054.jpg)

    辛顿

    辛顿从小就对人类的大脑是如何工作的十分着迷。他后来回忆说，上中学的时候，班里的一个同学忽悠他说，大脑的工作就像一张全息图。他当时信以为真，十分兴奋。辛顿进入剑桥大学学习心理学后意识到，科学家并没有真正理解大脑，他们并没有完全了解大脑是如何学习以及如何提升智力的。在辛顿看来，这些都是关乎人工智能研究梦想的大问题，他开始在剑桥大学和爱丁堡大学探索神经网络。1978年，辛顿从爱丁堡大学获得人工智能博士学位。毕业后，辛顿开始了他雄心勃勃的计划，利用计算机硬件和软件来模拟人类大脑，研究如何大幅度缩短训练人工神经网络所需要的时间，创建一种神经网络的机器学习方法。这是后来人们高度关注的深度学习。

    人工神经网络的一大难题，就是如何驾驭百万级乃至亿级神经元之间那庞大得如天文数字一般的组合关系。这一过程的关键是要将人工神经网络组织成为堆叠层。拿人脸识别来说，当一个人工神经网络中的一组特征被发现能够形成某种图案（比如说一只眼睛）时，这一结果就会被向上转移到该人工神经网络的另一层做进一步的分析。接下来的这一层可能会将两只眼睛拼在一起，将这一有意义的数据再传递到层级结构的第三层，该层可以将眼睛和鼻子的图像结合到一起进行分析。就这样一层一层地叠加，识别一张人脸可能需要数百万个这种节点，堆叠层可高达15个层级。

