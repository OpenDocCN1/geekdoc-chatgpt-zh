- raw: '谷歌科学家李开复在和《人工智能时代》的作者、未来学家杰瑞·卡普兰讨论这个问题的时候，杰瑞·卡普兰提出了自己的看法。他认为，超人工智能的诞生及其威胁人类这件事发生的概率非常小。其实，我们现在做的只是在制造工具，以自动完成此前需要人类参与才能完成的工作。之所以会有“人工智能威胁论”，根本上是因为大众习惯了把人工智能人格化，这是问题的根源。


    李开复也认为，我们所面对的只不过是一系列工程设计上的问题。我们必须确保我们设计、制造的产品和提供的服务符合我们的愿望和预期。这件事与桥梁工程师使用一整套质量保障方案来确保他们建造的桥梁不会坍塌并没有什么两样。我们有许多工程学上的原则来指导我们测试一个系统，确定什么样的系统是合格的，什么样的系统是足够安全的。在人工智能领域，我们同样需要这样的技术，因为人工智能十分强大，具有潜在的危险性。但这并不是因为智能机器会像人类一样思考，而是仅仅因为它们十分强大，我们必须小心地使用它们。


    就拿无人驾驶汽车来说，在一些极端的例子里，无人驾驶汽车确实需要做出决定是要撞向左边，伤及左边的行人，还是要撞向右边，伤及右边的行人。但无人驾驶汽车只是一套机器系统，它们并不会真正地自己做出决策。它们只是根据对环境的感知，按照某种事先预定的原则和人类的设计做出反应，而我们人类对于整套系统的感知和反馈模式拥有完全的控制权。如果它们做了什么不符合我们社会准则的事情，那一定是因为我们人类在设计它们时犯了错误。


    从猿猴的智能到人类的智能，再到人类制造的人工智能技术和智能机器，“智能”经历了相当长时期的演进。我们已经讲过，人工智能普遍被认为可以分为3个程度，即弱人工智能、强人工智能和超人工智能。显然，如果人们对人工智能会不会挑战和威胁人类有所担忧，那么我们担心的就是这里所说的强人工智能和超人工智能。我们到底该如何看待强人工智能和超人工智能呢？它们会像阿尔法狗那样，以远超我们预料的速度降临世间吗？


    今天，学者们对超人工智能何时到来众说纷纭。有人说强人工智能或超人工智能的到来还需要15年，有人说是20年，有人说是50年。悲观者认为，技术加速发展的趋势无法改变，超越人类智能的机器将在不久的将来得以实现，那时的人类将面临生死存亡的重大考验。而乐观主义者则更愿意相信，人工智能在未来相当长的一个历史时期都只是人类的工具，很难突破超人类智能的门槛。


    技术在今天正以日新月异的速度发展着。对于人工智能的未来，目前人们还没有一致的看法，对智能的定义还是非常主观的，这依赖于每个人自己的视角。在今天这个弱人工智能时代里，人类对于人工智能或者智能的认识还在不断变化之中，我们还不能真正定义什么是强人工智能，什么是超人工智能。我们已经知道，阿尔法狗虽然在围棋上已经“战无不胜”，超过人类，但它连自己移动棋子的能力都没有，更不要说在围棋棋局中根据人类对手的表情，推测对方的心理状态，并有针对性地制定战术策略了。


    DeepMind的联合创始人、首席执行官穆斯塔法·苏莱曼说：“人类距离通用人工智能的实现还有很长一段路要走。说到未来的样子，很多想象很有趣，很有娱乐性，但跟我们正在开发的系统并没有太多相似之处。我没法想出来哪一部电影会让我想到：是的，人工智能看起来就是这样的。”科幻大片里的场景与我们今天实现和可以预见的人工智能技术和产品还相差甚远，无法实现。


    华盛顿大学计算机科学家奥伦·伊兹奥尼说：“今天的人工智能距离人们可能或应该担忧机器统治世界的程度还非常遥远……如果我们讨论的是在1000年后或更遥远的未来人工智能是否有可能给人类带来厄运，那么绝对是有可能的，但我不认为这种长期的讨论应该分散我们关注真实问题的注意力。”


    但不管怎么说，有一点是可以肯定的，那就是技术正在深刻地改变着人类的生活、生产和生存方式。这种深刻的变革已经且仍将不断地挑战人类的智慧。


    ## [10.5 相信未来，相信人类的智慧](../contents/content.xhtml#toc66)


    人工智能的故事到这里就要告一段落了，但人工智能的发展远没有结束，甚至可以说是刚刚开始，故事还在继续。


    回顾历史，从17世纪至今，世界经过了3次工业革命，完成了从手工劳动到信息化的飞跃。与工业革命前的中世纪相比，人类已经生活在一个完全不同的、由现代科技支撑和推动的全新时代。


    在21世纪的今天，如果有哪一种技术可以和历次工业革命中的先导科技相提并论的话，那一定是正在步入发展期的人工智能技术。以交通为例，蒸汽机、内燃机、燃气轮机、电动机的发明，让我们的出行从人抬马拉的农耕时代跃入了以飞机、高铁、汽车、轮船为代表的现代交通时代。在人工智能时代，仅自动驾驶技术一项就足以彻底改变我们的交通出行方式。事实上，人工智能技术在各行各业都正引发着颠覆性的变化，带来生产效率前所未有的提高。历史必将如实地记录下这一次史无前例的人类大革命，这一革命的核心驱动力就是人工智能。


    人工智能不仅是一场技术革命，它对生产效率的大幅提高、对人类劳动的逐步替代、对生产方式的根本改变必然触及社会、经济、政治、文化、教育等人类生活的方方面面，成为一场深刻影响人类命运的大革命。人工智能的未来必将与重大的生产变革、社会变革、经济变革、教育变革、思想变革、文化变革等同步，成为人类社会的一次全新的大飞跃、大变革、大融合、大发展的开端。


    这是一个伟大的时代，这是一个创新的时代，这是一个人工智能的时代，这也是一个改变人类命运的时代。让我们满怀信心，迎接挑战，相信人类的智慧，阔步前进，走向未来！


