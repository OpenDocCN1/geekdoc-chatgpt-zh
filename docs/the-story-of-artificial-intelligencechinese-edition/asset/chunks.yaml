- raw: '今天我们常说的大数据其实是在2000年后因为信息交换、存储和处理三方面能力的大幅提升而产生的数据。据估算，从1986年到2007年这20多年间，地球上每天可以通过既有信息通道交换的信息数量增长了约217倍，这些信息的数字化程度则从1986年的约20%增长到2007年的约99.9%。在数字化信息呈爆炸式增长的过程中，每个参与信息交换的节点都可以在短时间内接收并存储大量数据。这是大数据得以收集和积累的重要前提条件。例如，根据对社交网站推特的统计，全球范围内每秒新增的推文条数约为6000条，每分钟约为360000条，每天约为5亿条，每年约为2000亿条。在网络带宽大幅提高之前，这个规模的信息交换是不可想象的。


    全球信息存储能力大约每3年翻一番。从1986年到2007年，全球信息存储能力增加了约120倍，所存储信息的数字化程度也从1986年的约1%增长到2007年的约94%。1986年，即便用上我们所有的信息载体和存储手段，我们也只能存储全世界所交换信息的大约1%，而2007年这个数字已经增长到约16%。信息存储能力的提升为我们利用大数据提供了近乎无限的想象空间。例如，谷歌这样的搜索引擎几乎就是一个全球互联网的“备份中心”，谷歌的大规模文件存储系统完整保留了全球大部分公开网页的数据内容，相当于每天都在为全球互联网做“热备份”。


    有了海量信息的获取和存储能力，我们也必须具有对这些信息进行整理、加工和分析的能力。谷歌、脸书、亚马逊、百度、阿里巴巴等公司在数据量逐渐增大的同时，也相应建立了灵活、强大的分布式数据处理集群。数万台乃至数十万台计算机构成的并行计算集群每时每刻都在对积累的数据进行进一步的加工和分析。利用这些数据处理平台，像谷歌这样的公司每天都会对多达数百亿的搜索进行记录、整理，将其转换成便于分析的格式，并提供强有力的数据分析工具，可以非常快地对数据进行聚合、维度转换、分类和汇总等操作。


    大数据让人工智能在接近和突破人类智能方面成功地迈出了第一步。谷歌的围棋程序阿尔法狗已经达到了人类围棋选手无法达到的境界，没有人可以与之竞争。这是因为阿尔法狗能够不断进行学习，而它赖以学习提高的基础就是大数据。


    有了大数据，人工智能就有了新机会。人工智能从大数据中挖掘出以往难以想象的有价值的数据、知识和规律。简单地说，有了足够的数据作为深度学习的输入，计算机就可以学会以往只有人类才能理解的概念和知识，然后将这些概念和知识应用到之前从来没有看见过的新数据上。在任何拥有大数据的领域，人工智能都有一展身手的空间，都可以实现高质量的应用。


    # [第10章 奇点——人工智能会取代人类吗](../contents/content.xhtml#toc61)


    ## [10.1 人工智能正在改变人类的生活](../contents/content.xhtml#toc62)


    北京时间2019年3月26日21点，华为在巴黎召开P30系列新品发布会，重磅推出P30 Pro、P30等机型。可以看到，在法国巴黎的公交车上，华为P30系列手机的广告铺天盖地。这是让每一个在巴黎的中国人都感到骄傲的事情。发布会现场人声鼎沸，会场的内部很有科幻色彩。发布会结束后，全球多个国家的消费者排队抢购华为P30系列手机。


    ![](images/figure_0179_0112.jpg)


    华为新一代智能手机


    自2007年6月苹果公司公布它研制的世界上第一款智能手机iPhone起，一场智能手机大战就拉开了帷幕，各种各样的智能手机不断出现，让其中蕴含的各种人工智能技术不断深入千家万户，深入人们日常生活的方方面面。


    今天智能手机不仅具有人脸识别、指纹识别等图像识别功能，而且具有语音翻译、导航定位、自动支付和远程遥控等功能。所有这些功能的背后都离不开人工智能技术的支持。今天，我们几乎已经离不开智能手机了。一机在手，万事不愁；一机在手，走遍全球。这已经不是幻想，而是一个不断给人带来惊喜的现实。


    ![](images/figure_0180_0113.jpg)


    大疆无人机


    大疆的成名仿佛在一夜之间，2014年声名鹊起。大疆无人机系列产品先后被英国《经济学人》杂志评为“全球最具代表性的机器人”之一，被美国《时代周刊》评为“十大科技产品”，被《纽约时报》评为“2014年杰出高科技产品”。这家公司占据了全球民用小型无人机市场约七成的份额，产品主要销往欧美国家。大疆所依靠的就是先进的人工智能技术。


    大疆无人机配备了高性能相机，除可拍摄高清照片外，还能实现摄像，并实时回传；内嵌的自动导航系统可以准确锁定高度和位置，稳定悬停，在失控情况下可实现自主返航；其高清数字图像传输系统可实现2千米以内的图像传输，内置的视觉和超声波传感器可让无人机在无卫星定位导航的环境中实现精确定位悬停和平稳飞行。


    阿里巴巴在新零售领域最受人关注的是无人超市“淘咖啡”。2019年7月8日，阿里巴巴在杭州推出为期5天的“造物节”，无人便利店项目“淘咖啡”公开亮相。


    面积为200平方米的“淘咖啡”可以容纳50人同时购物，里边摆放有咖啡、甜点、玩偶、笔记本等各类商品，并具备餐饮功能。顾客打开手机上的淘宝APP，扫描二维码便可获得入店资格。通过闸机后，顾客可随意挑选货品。离开时，顾客通过一道“支付门”，面前会出现一个屏幕。经过身份识别后，程序会自动完成支付，用户就可以拿着物品离开了。


    商品拿起就走，没有收银员，还无须扫码支付，走出大门时自动扣款……这种新奇的购物体验让这家超市迅速被挤爆，人们纷纷排队体验无人超市的黑科技。


    ![](images/figure_0181_0114.jpg)


    “淘咖啡”


    ![](images/figure_0181_0115.jpg)


    上海洋山深水港无人码头


    人工智能不仅正在走进千家万户，而且不断深入生产和社会生活的方方面面。上海洋山深水港位于长江入海口，是中国首个在微小岛上建设的港口。洋山港一手牵着长江经济带，一手挽起海上丝绸之路，是中国发展上海自贸区、建设海洋强国的重要支撑。起重机不停地装卸集装箱，一辆辆没有车厢的平板车往来穿梭，很难想象这些设备都无人操作。洋山深水港四期工程真正实现了码头装卸、水平运输、堆场装卸环节的全程智能化、无人化操作。


    今天，如果你来到像格力重工这样的大型企业，车间里少有挥汗如雨的工人，取而代之的是自动化生产线上的机器人和机械手。其实，无论是在中国还是在其他国家，无人车间、无人工厂已经如雨后春笋般涌现出来。无处不在的人工智能技术正在改变着工业生产的方式，释放出前所未有的生产力。


    ## [10.2 什么是奇点](../contents/content.xhtml#toc63)


    1993年，圣地亚哥州立大学计算机教授、科幻小说作家弗诺·文奇发表了一篇论文，其题目是“技术奇点的到来”。一石激起千层浪，他的这篇论文引起了广泛关注。他在论文中正式定义和阐述了一个叫奇点的概念。文奇写道，奇点将是人类时代的终结，而新的超级智能将会自我发展，把人类远远地甩在后面。他预测，奇点的到来不会早于2005年，也不会晚于2030年。


    一时间，未来学家和科幻作家纷纷用“奇点”来表示超人工智能到来的那个神秘时刻。当然，没有人知道奇点会不会到来，会在何时到来。但正因为这样，人们才感到惊讶，乃至忐忑不安。


    人工智能的飞速发展和巨大潜力不能不让人产生这样一个问题，那就是人工智能会不会赶上和超越人类智能？早在冯·诺依曼发明世界上第一台电子计算机时，他就和一名一起工作的波兰科学家谈起过他对未来的担忧。他认为，技术的加速发展会在未来的某一时刻超出人类的控制而成为与人类竞争的力量，从而威胁人类的生存。后来，英国数学家古德还提出过一个智能爆炸模型。通过这个模型，他预测到未来的超人工智能将会引发奇点的到来。


    所谓奇点，就是随着科学技术的飞跃发展，人们提出的一种对未来某一时刻人工智能将超越人类智能的假说。


    回顾人类发展的历史，我们会发现，世界的变化的确是翻天覆地的。假如我们让某个15世纪的古人穿越到今天，他会看到什么？在他的眼里，各种各样的金属铁壳在地面上飞驰，在天空中翱翔；人们拿着一个小瓷片似的东西就能和大洋另一侧的人聊天，看遥远地方正在进行的体育比赛，或观看一场半个世纪前的演唱会；农田里看不到干活的人群，粮食就自己长出来；工厂里也都是些奇怪的铁家伙，它们自己动来动去，制造出各种东西……
    这一切足以把他吓得魂飞魄散，就像今天我们看到科幻大片所展示的未来远景一样。变形金刚、钢铁侠等科技怪兽不也让今天的人们不寒而栗吗？也许科幻大片里的故事有些夸张，但产生这样的故事一点也不夸张，而且它们正在变成现实。


    谷歌科学家李开复就做过这样一个描述：把人类大约6000年的文明史浓缩到一天（也就是24小时），我们可以看到苏美尔人、古埃及人、古代中国人在凌晨时分先后发明了文字；20点前后，中国北宋的毕昇发明了活字印刷术；蒸汽机大约在22:30被欧洲人发明出来；23:15，人类学会了使用电力；23:43，人类发明了通用电子计算机；23:54，人类开始使用互联网；23:57，人类进入移动互联网时代；一天里的最后10秒，谷歌阿尔法狗宣布人工智能时代的到来。你注意到了吗？新事物产生的时间间隔越来越短。这种技术发展在时间上的加速趋势，不能不让人浮想联翩，感到恐慌。


    2015年，一个叫蒂姆·厄班的人发表了一篇题为《人工智能革命：通向超人工智能之路》的文章。蒂姆·厄班在文章中指出：“硬件的快速发展和软件的创新是同时发生的，强人工智能的降临可能比我们预期的更早，因为呈指数级增长的开端可能像蜗牛漫步，但是后期会跑得非常快；同时，软件的发展可能看起来很缓慢，但是一次顿悟就能永远改变进步的速度。”


    蒂姆·厄班的推理足以让每个人惊出一身冷汗。他说：“一个人工智能系统花了几十年时间达到了人类脑残智能的水平，而当这个节点出现的时候，计算机对于世界的感知大概和一个4岁小孩一样；而在这个节点后1小时，计算机马上推导出了统一广义相对论和量子力学的物理学理论；而在这之后一个半小时，这个强人工智能变成了超人工智能，智能达到了普通人类的17万倍。”


    也就是说，一个具备了人类认知能力和学习能力的机器，可以借助云计算这样强大的计算资源、互联网、知识库以及永不疲倦、不需要吃饭睡觉的特点，无休止地学习、迭代下去，并在令人吃惊的极短时间内，完成从强人工智能到超人工智能的跃进。


    历史上，人类第一次面临自己创造的对自己的挑战。怎么办？


    ## [10.3 人类面临自己制造的挑战](../contents/content.xhtml#toc64)


    著名的理论物理学家、《时间简史》的作者霍金是众多担忧超人工智能的科学家之一，他的学术地位和影响力让他的看法格外引人注意。他认为：“完全人工智能的研发可能意味着人类的末日。”他对机器与人在进化速度上的不对等性表示担忧。霍金说：“人工智能可以在自身基础上进化，可以一直保持加速的趋势，不断重新设计自己。而我们人类的生物进化速度相当有限，无法与之竞争，终将被淘汰。”


    特斯拉与SpaceX公司的创始人、钢铁奇侠马斯克也有与霍金大致相似的担忧。他说：“我们对待人工智能必须非常小心。如果必须预测我们面临的最大现实威胁，那恐怕就是人工智能了。”


    霍金和马斯克在警告世人，人类正在面临自己制造的挑战，我们必须积极行动起来，为人类找出应对未来潜在威胁的对策。马斯克说：“我越来越倾向于认为，也许在国家层面或国际层面上必须有一种规范的监管机制来保证我们不会在这方面做任何蠢事。”


    那么，人工智能的高速发展到底在哪些具体方面会挑战和威胁人类的生存呢？最显而易见的就是人类现在大量的工作岗位将会被机器人所取代，人工智能的普及会导致人类失业问题。霍金说：“工厂自动化已经让众多传统制造业的工人失业，人工智能的兴起很有可能会让失业潮波及中产阶级，最后只给人类留下护理、创造和监督工作。”


    毫无疑问，人工智能将改变全世界各行各业的现有工作方式、商业模式以及相关的经济结构。那么，当人工智能开始大规模取代人类工作者的时候，我们应该做些什么才能避免人类大批失业、社会陷入动荡的危险局面呢？尤瓦尔·赫拉利在《未来简史》中说：“研究历史，就是为了挣脱过去的桎梏，让我们能看到不同的方向，并开始注意到前人无法想象或过去不希望我们想象到的可能性……研究历史并不能告诉我们该如何选择，但至少能给我们提供更多的选项。”


    从原始社会的刀耕火种到现代社会高度的分工协作，人类生产基本上都遵循了金字塔式的劳动结构模型，金字塔底层是大量从事简单、重复性劳动的人。过去几千年里，人类经历了生产关系的变革，从农业革命到工业革命，再到科技革命，变化的结果只是大规模地提高了生产效率，改变了社会分工，从而以更低的劳动成本创造出更多的社会财富，但没有从根本上改变生产关系的金字塔式结构。


    当人工智能取代了简单、重复性工作以后，原本从事简单工作的人将如何生存呢？金字塔式结构在历史上将第一次受到冲击。如果未来失去工作的人都必须从做简单工作转换为从事相对复杂的脑力劳动，那么他们要学习的知识体系对他们来说将是一个庞大的架构。那些中年失去工作的普通劳动者怎么可能重新开始一次历时数年的学习深造呢？


    这就成为了一个社会结构变革中的社会大问题。有人提出，当生产成本由于人工智能技术的普及越来越低而生产效率越来越高的时候，社会财富将会越来越多，人类将有更多的资源和能力来面对失业或工作转换的问题。


    美国计算机科学家、创业家、未来学家杰瑞·卡普兰在《人工智能时代》一书中提出过一个解决人工智能带来的失业或工作转换问题的方法——工作抵押。这是一种由政府、雇主和教育系统联合提供保障的再培训机制。当雇主希望使用人工智能来替代一部分工作人员时，被解雇的人会得到一个免费接受培训的机会，代价是在培训结束后必须为目标雇主工作一段时间。当然，这只是一种设想，实际情况可能远比他设想的要复杂得多。因此，更多的思想家、社会学家和政府智库都在积极严肃地探讨人类社会应该如何应对这一关于人类命运的大问题。


    在挑战面前，人类的观念、思想以及旧有的社会结构和模式都必然会发生极大的改变。在机器学习的同时，人类教育也会出现转型。李开复提出，整个教育体制应更多地关注素质教育和高端教育，让每个人都有机会学习和尝试各种更复杂或更需要人类创造力的工作，培养更多的博学之才、专深之才、文艺人才和领导人才。在人工智能时代，我们需要的教育不再是技能型，而应是思想型、才艺型和智慧型，培养在社会结构的调整中，能够快速灵活地完成不同类型工作间的转换、发挥人类创造力的人才，这样人们才不必终日担心被人工智能取代。


    人工智能的高速发展给人类带来的更进一步的挑战和威胁是，当人工智能超越人类智能以后，人工智能机器人会不会像科幻大片中的那些怪兽那样消灭人类呢？


    2015年，马斯克与彼得·蒂尔等一起在旧金山创立了一个非营利组织OpenAI。OpenAI汇集了一批人工智能领域的顶尖高手，探索实现强人工智能的可能性和研发“安全的”人工智能，通过实践来寻找将人工智能技术的潜在威胁降至最低的方法。他们希望将人工智能关在道德或制度的“牢笼”里，让人工智能难以威胁人类。既然奇点的来临无法避免，那么不如积极面对，当威胁来临时，我们对威胁本身的理解就会更加深刻。


    2017年初，上百名人工智能专家聚集到了加州的阿西洛马度假村，深入探讨了人工智能对人类的威胁问题。会议通过并发表了23条人工智能技术应该遵守的基本原则，这23条基本原则涵盖了科研、伦理和价值观、长期策略3个方面。这23条基本原则像科幻大师阿西莫夫笔下的著名的机器人三定律一样，从方法、特征、伦理、道德等多方面，对未来的人工智能可以做什么以及不可以做什么提出了限制条件。


    人工智能的高速发展给人类带来的最终挑战和威胁是，当人工智能超越人类智能以后，人生还有意义吗？古希腊哲学家亚里士多德曾在他想象自动机器人时认为，自动机器人会被主人所奴役，让人变得贪图安逸、不思进取。


    我们正在进入这样一个前所未有的时代。随着科技的进步，人工智能技术将在大量简单、重复性、不需要复杂思考就能完成决策的工作中取代人类。汽车将不需要人类来驾驶，语言也不再是人类交流的障碍，生产劳动将完全由机器人代替，甚至家务和购物都不用人来操心受累，人们有大量的空闲时间，或者沉浸在各种高级娱乐里，或者追随自己的个人兴趣。


    在这样的时代里，压在每个人肩头的工作压力、家庭压力会逐渐消失，任何追求都似乎没有太大的意义，那么我们活着干什么呢？到底是要做一个天天领着社会福利、躺在家里玩游戏、身形如电影《机器人总动员》里的人类后代一样臃肿的废物，还是努力学习新知识，积极从事文学和艺术工作，不断探索宇宙和哲学，不断思索自身存在的价值，重塑自己在人工智能社会中的地位与价值，寻找生物特征以外的生命意义？


    人生目标以及价值观将面临全新的挑战。在这样一个人类历史上从未经历过的崭新时代里，人生的意义何在？如何过完一生才最有价值？这一切都需要我们重新思考、重新定义和重新开始。


    人类因为有感情、会思考、懂生死、善适应而具有“感情”“思维”“自我意识”和“生死意识”等特质，从而使我们区别于其他动物，因此也可以且应该使我们区别于机器人。在《真实的人类》里，合成人曾说：“我不惧怕死亡，这使得我比任何人类更强大。”而人类则说：“你错了。如果你不惧怕死亡，那你就从未活着，你只是一种存在而已。”


    法国哲学家布莱士·帕斯卡说过：“人只不过是一根稻草，是自然界中最脆弱的东西，但他是一根能思想的稻草。用不着整个宇宙都拿起武器来才能毁灭，一口气、一滴水就足以置他于死地了。然而，纵使宇宙毁灭了他，人却仍然要比置他于死地的东西高贵得多，因为他知道自己要死亡以及宇宙对于他所具有的优势，而宇宙对此一无所知。所以，我们全部的尊严就在于思想。”这也许太抽象了，但令人深思。


    的确，人只不过是一根稻草，但人是一根能思想的稻草。人工智能的到来在挑战着人类，威胁着人类，但有思想的人类并不会因此而灭亡，因为我们全部的智慧就在于思想。我们一定能够找到答案。


    ## [10.4 奇点会是人类的终点吗](../contents/content.xhtml#toc65)


    18世纪，工业革命在欧洲全面爆发。


    1733年，英国发明家约翰·凯发明了用于织布的飞梭。1764年，英国布莱克本的纺织工詹姆斯·哈格里夫斯发明了现代机械——纺纱机，这是“使英国工人的状况发生根本变化的第一个发明”。人类生产与制造方式开始向机械化转换，以大规模的工厂生产取代手工作坊，出现了以机器取代人力的趋势。人类旧有的生产方式受到了挑战，大批技术工人和手工业者面临失业的威胁。


    1779年，英国莱斯特的一名叫内德·卢德的纺织工因愤怒而砸毁两台织布机，后来人们以讹传讹，将此事说成卢德将军或卢德王领导反抗工业化的运动，从而引发了反对机械化的卢德运动，还产生了所谓的卢德主义者。在这场运动中，常常发生毁坏纺织机的事件。


    今天，人工智能在信息革命的快速发展中更加深刻地“威胁”到了人类的生存。奇点会是人类的终点吗？我们到底该怎样看待“人工智能威胁论”呢？'
  fmt: '

    今天我们常说的大数据其实是在2000年后因为信息交换、存储和处理三方面能力的大幅提升而产生的数据。据估算，从1986年到2007年这20多年间，地球上每天可以通过既有信息通道交换的信息数量增长了约217倍，这些信息的数字化程度则从1986年的约20%增长到2007年的约99.9%。在数字化信息呈爆炸式增长的过程中，每个参与信息交换的节点都可以在短时间内接收并存储大量数据。这是大数据得以收集和积累的重要前提条件。例如，根据对社交网站推特的统计，全球范围内每秒新增的推文条数约为6000条，每分钟约为360000条，每天约为5亿条，每年约为2000亿条。在网络带宽大幅提高之前，这个规模的信息交换是不可想象的。


    全球信息存储能力大约每3年翻一番。从1986年到2007年，全球信息存储能力增加了约120倍，所存储信息的数字化程度也从1986年的约1%增长到2007年的约94%。1986年，即便用上我们所有的信息载体和存储手段，我们也只能存储全世界所交换信息的大约1%，而2007年这个数字已经增长到约16%。信息存储能力的提升为我们利用大数据提供了近乎无限的想象空间。例如，谷歌这样的搜索引擎几乎就是一个全球互联网的“备份中心”，谷歌的大规模文件存储系统完整保留了全球大部分公开网页的数据内容，相当于每天都在为全球互联网做“热备份”。


    有了海量信息的获取和存储能力，我们也必须具有对这些信息进行整理、加工和分析的能力。谷歌、脸书、亚马逊、百度、阿里巴巴等公司在数据量逐渐增大的同时，也相应建立了灵活、强大的分布式数据处理集群。数万台乃至数十万台计算机构成的并行计算集群每时每刻都在对积累的数据进行进一步的加工和分析。利用这些数据处理平台，像谷歌这样的公司每天都会对多达数百亿的搜索进行记录、整理，将其转换成便于分析的格式，并提供强有力的数据分析工具，可以非常快地对数据进行聚合、维度转换、分类和汇总等操作。


    大数据让人工智能在接近和突破人类智能方面成功地迈出了第一步。谷歌的围棋程序阿尔法狗已经达到了人类围棋选手无法达到的境界，没有人可以与之竞争。这是因为阿尔法狗能够不断进行学习，而它赖以学习提高的基础就是大数据。


    有了大数据，人工智能就有了新机会。人工智能从大数据中挖掘出以往难以想象的有价值的数据、知识和规律。简单地说，有了足够的数据作为深度学习的输入，计算机就可以学会以往只有人类才能理解的概念和知识，然后将这些概念和知识应用到之前从来没有看见过的新数据上。在任何拥有大数据的领域，人工智能都有一展身手的空间，都可以实现高质量的应用。


    # 第10章 奇点——人工智能会取代人类吗


    ## 10.1 人工智能正在改变人类的生活


    北京时间2019年3月26日21点，华为在巴黎召开P30系列新品发布会，重磅推出P30 Pro、P30等机型。可以看到，在法国巴黎的公交车上，华为P30系列手机的广告铺天盖地。这是让每一个在巴黎的中国人都感到骄傲的事情。发布会现场人声鼎沸，会场的内部很有科幻色彩。发布会结束后，全球多个国家的消费者排队抢购华为P30系列手机。


    ![](images/figure_0179_0112.jpg)


    华为新一代智能手机


    自2007年6月苹果公司公布它研制的世界上第一款智能手机iPhone起，一场智能手机大战就拉开了帷幕，各种各样的智能手机不断出现，让其中蕴含的各种人工智能技术不断深入千家万户，深入人们日常生活的方方面面。


    今天智能手机不仅具有人脸识别、指纹识别等图像识别功能，而且具有语音翻译、导航定位、自动支付和远程遥控等功能。所有这些功能的背后都离不开人工智能技术的支持。今天，我们几乎已经离不开智能手机了。一机在手，万事不愁；一机在手，走遍全球。这已经不是幻想，而是一个不断给人带来惊喜的现实。


    ![](images/figure_0180_0113.jpg)


    大疆无人机


    大疆的成名仿佛在一夜之间，2014年声名鹊起。大疆无人机系列产品先后被英国《经济学人》杂志评为“全球最具代表性的机器人”之一，被美国《时代周刊》评为“十大科技产品”，被《纽约时报》评为“2014年杰出高科技产品”。这家公司占据了全球民用小型无人机市场约七成的份额，产品主要销往欧美国家。大疆所依靠的就是先进的人工智能技术。


    大疆无人机配备了高性能相机，除可拍摄高清照片外，还能实现摄像，并实时回传；内嵌的自动导航系统可以准确锁定高度和位置，稳定悬停，在失控情况下可实现自主返航；其高清数字图像传输系统可实现2千米以内的图像传输，内置的视觉和超声波传感器可让无人机在无卫星定位导航的环境中实现精确定位悬停和平稳飞行。


    阿里巴巴在新零售领域最受人关注的是无人超市“淘咖啡”。2019年7月8日，阿里巴巴在杭州推出为期5天的“造物节”，无人便利店项目“淘咖啡”公开亮相。


    面积为200平方米的“淘咖啡”可以容纳50人同时购物，里边摆放有咖啡、甜点、玩偶、笔记本等各类商品，并具备餐饮功能。顾客打开手机上的淘宝APP，扫描二维码便可获得入店资格。通过闸机后，顾客可随意挑选货品。离开时，顾客通过一道“支付门”，面前会出现一个屏幕。经过身份识别后，程序会自动完成支付，用户就可以拿着物品离开了。


    商品拿起就走，没有收银员，还无须扫码支付，走出大门时自动扣款……这种新奇的购物体验让这家超市迅速被挤爆，人们纷纷排队体验无人超市的黑科技。


    ![](images/figure_0181_0114.jpg)


    “淘咖啡”


    ![](images/figure_0181_0115.jpg)


    上海洋山深水港无人码头


    人工智能不仅正在走进千家万户，而且不断深入生产和社会生活的方方面面。上海洋山深水港位于长江入海口，是中国首个在微小岛上建设的港口。洋山港一手牵着长江经济带，一手挽起海上丝绸之路，是中国发展上海自贸区、建设海洋强国的重要支撑。起重机不停地装卸集装箱，一辆辆没有车厢的平板车往来穿梭，很难想象这些设备都无人操作。洋山深水港四期工程真正实现了码头装卸、水平运输、堆场装卸环节的全程智能化、无人化操作。


    今天，如果你来到像格力重工这样的大型企业，车间里少有挥汗如雨的工人，取而代之的是自动化生产线上的机器人和机械手。其实，无论是在中国还是在其他国家，无人车间、无人工厂已经如雨后春笋般涌现出来。无处不在的人工智能技术正在改变着工业生产的方式，释放出前所未有的生产力。


    ## 10.2 什么是奇点


    1993年，圣地亚哥州立大学计算机教授、科幻小说作家弗诺·文奇发表了一篇论文，其题目是“技术奇点的到来”。一石激起千层浪，他的这篇论文引起了广泛关注。他在论文中正式定义和阐述了一个叫奇点的概念。文奇写道，奇点将是人类时代的终结，而新的超级智能将会自我发展，把人类远远地甩在后面。他预测，奇点的到来不会早于2005年，也不会晚于2030年。


    一时间，未来学家和科幻作家纷纷用“奇点”来表示超人工智能到来的那个神秘时刻。当然，没有人知道奇点会不会到来，会在何时到来。但正因为这样，人们才感到惊讶，乃至忐忑不安。


    人工智能的飞速发展和巨大潜力不能不让人产生这样一个问题，那就是人工智能会不会赶上和超越人类智能？早在冯·诺依曼发明世界上第一台电子计算机时，他就和一名一起工作的波兰科学家谈起过他对未来的担忧。他认为，技术的加速发展会在未来的某一时刻超出人类的控制而成为与人类竞争的力量，从而威胁人类的生存。后来，英国数学家古德还提出过一个智能爆炸模型。通过这个模型，他预测到未来的超人工智能将会引发奇点的到来。


    所谓奇点，就是随着科学技术的飞跃发展，人们提出的一种对未来某一时刻人工智能将超越人类智能的假说。


    回顾人类发展的历史，我们会发现，世界的变化的确是翻天覆地的。假如我们让某个15世纪的古人穿越到今天，他会看到什么？在他的眼里，各种各样的金属铁壳在地面上飞驰，在天空中翱翔；人们拿着一个小瓷片似的东西就能和大洋另一侧的人聊天，看遥远地方正在进行的体育比赛，或观看一场半个世纪前的演唱会；农田里看不到干活的人群，粮食就自己长出来；工厂里也都是些奇怪的铁家伙，它们自己动来动去，制造出各种东西……
    这一切足以把他吓得魂飞魄散，就像今天我们看到科幻大片所展示的未来远景一样。变形金刚、钢铁侠等科技怪兽不也让今天的人们不寒而栗吗？也许科幻大片里的故事有些夸张，但产生这样的故事一点也不夸张，而且它们正在变成现实。


    谷歌科学家李开复就做过这样一个描述：把人类大约6000年的文明史浓缩到一天（也就是24小时），我们可以看到苏美尔人、古埃及人、古代中国人在凌晨时分先后发明了文字；20点前后，中国北宋的毕昇发明了活字印刷术；蒸汽机大约在22:30被欧洲人发明出来；23:15，人类学会了使用电力；23:43，人类发明了通用电子计算机；23:54，人类开始使用互联网；23:57，人类进入移动互联网时代；一天里的最后10秒，谷歌阿尔法狗宣布人工智能时代的到来。你注意到了吗？新事物产生的时间间隔越来越短。这种技术发展在时间上的加速趋势，不能不让人浮想联翩，感到恐慌。


    2015年，一个叫蒂姆·厄班的人发表了一篇题为《人工智能革命：通向超人工智能之路》的文章。蒂姆·厄班在文章中指出：“硬件的快速发展和软件的创新是同时发生的，强人工智能的降临可能比我们预期的更早，因为呈指数级增长的开端可能像蜗牛漫步，但是后期会跑得非常快；同时，软件的发展可能看起来很缓慢，但是一次顿悟就能永远改变进步的速度。”


    蒂姆·厄班的推理足以让每个人惊出一身冷汗。他说：“一个人工智能系统花了几十年时间达到了人类脑残智能的水平，而当这个节点出现的时候，计算机对于世界的感知大概和一个4岁小孩一样；而在这个节点后1小时，计算机马上推导出了统一广义相对论和量子力学的物理学理论；而在这之后一个半小时，这个强人工智能变成了超人工智能，智能达到了普通人类的17万倍。”


    也就是说，一个具备了人类认知能力和学习能力的机器，可以借助云计算这样强大的计算资源、互联网、知识库以及永不疲倦、不需要吃饭睡觉的特点，无休止地学习、迭代下去，并在令人吃惊的极短时间内，完成从强人工智能到超人工智能的跃进。


    历史上，人类第一次面临自己创造的对自己的挑战。怎么办？


    ## 10.3 人类面临自己制造的挑战


    著名的理论物理学家、《时间简史》的作者霍金是众多担忧超人工智能的科学家之一，他的学术地位和影响力让他的看法格外引人注意。他认为：“完全人工智能的研发可能意味着人类的末日。”他对机器与人在进化速度上的不对等性表示担忧。霍金说：“人工智能可以在自身基础上进化，可以一直保持加速的趋势，不断重新设计自己。而我们人类的生物进化速度相当有限，无法与之竞争，终将被淘汰。”


    特斯拉与SpaceX公司的创始人、钢铁奇侠马斯克也有与霍金大致相似的担忧。他说：“我们对待人工智能必须非常小心。如果必须预测我们面临的最大现实威胁，那恐怕就是人工智能了。”


    霍金和马斯克在警告世人，人类正在面临自己制造的挑战，我们必须积极行动起来，为人类找出应对未来潜在威胁的对策。马斯克说：“我越来越倾向于认为，也许在国家层面或国际层面上必须有一种规范的监管机制来保证我们不会在这方面做任何蠢事。”


    那么，人工智能的高速发展到底在哪些具体方面会挑战和威胁人类的生存呢？最显而易见的就是人类现在大量的工作岗位将会被机器人所取代，人工智能的普及会导致人类失业问题。霍金说：“工厂自动化已经让众多传统制造业的工人失业，人工智能的兴起很有可能会让失业潮波及中产阶级，最后只给人类留下护理、创造和监督工作。”


    毫无疑问，人工智能将改变全世界各行各业的现有工作方式、商业模式以及相关的经济结构。那么，当人工智能开始大规模取代人类工作者的时候，我们应该做些什么才能避免人类大批失业、社会陷入动荡的危险局面呢？尤瓦尔·赫拉利在《未来简史》中说：“研究历史，就是为了挣脱过去的桎梏，让我们能看到不同的方向，并开始注意到前人无法想象或过去不希望我们想象到的可能性……研究历史并不能告诉我们该如何选择，但至少能给我们提供更多的选项。”


    从原始社会的刀耕火种到现代社会高度的分工协作，人类生产基本上都遵循了金字塔式的劳动结构模型，金字塔底层是大量从事简单、重复性劳动的人。过去几千年里，人类经历了生产关系的变革，从农业革命到工业革命，再到科技革命，变化的结果只是大规模地提高了生产效率，改变了社会分工，从而以更低的劳动成本创造出更多的社会财富，但没有从根本上改变生产关系的金字塔式结构。


    当人工智能取代了简单、重复性工作以后，原本从事简单工作的人将如何生存呢？金字塔式结构在历史上将第一次受到冲击。如果未来失去工作的人都必须从做简单工作转换为从事相对复杂的脑力劳动，那么他们要学习的知识体系对他们来说将是一个庞大的架构。那些中年失去工作的普通劳动者怎么可能重新开始一次历时数年的学习深造呢？


    这就成为了一个社会结构变革中的社会大问题。有人提出，当生产成本由于人工智能技术的普及越来越低而生产效率越来越高的时候，社会财富将会越来越多，人类将有更多的资源和能力来面对失业或工作转换的问题。


    美国计算机科学家、创业家、未来学家杰瑞·卡普兰在《人工智能时代》一书中提出过一个解决人工智能带来的失业或工作转换问题的方法——工作抵押。这是一种由政府、雇主和教育系统联合提供保障的再培训机制。当雇主希望使用人工智能来替代一部分工作人员时，被解雇的人会得到一个免费接受培训的机会，代价是在培训结束后必须为目标雇主工作一段时间。当然，这只是一种设想，实际情况可能远比他设想的要复杂得多。因此，更多的思想家、社会学家和政府智库都在积极严肃地探讨人类社会应该如何应对这一关于人类命运的大问题。


    在挑战面前，人类的观念、思想以及旧有的社会结构和模式都必然会发生极大的改变。在机器学习的同时，人类教育也会出现转型。李开复提出，整个教育体制应更多地关注素质教育和高端教育，让每个人都有机会学习和尝试各种更复杂或更需要人类创造力的工作，培养更多的博学之才、专深之才、文艺人才和领导人才。在人工智能时代，我们需要的教育不再是技能型，而应是思想型、才艺型和智慧型，培养在社会结构的调整中，能够快速灵活地完成不同类型工作间的转换、发挥人类创造力的人才，这样人们才不必终日担心被人工智能取代。


    人工智能的高速发展给人类带来的更进一步的挑战和威胁是，当人工智能超越人类智能以后，人工智能机器人会不会像科幻大片中的那些怪兽那样消灭人类呢？


    2015年，马斯克与彼得·蒂尔等一起在旧金山创立了一个非营利组织OpenAI。OpenAI汇集了一批人工智能领域的顶尖高手，探索实现强人工智能的可能性和研发“安全的”人工智能，通过实践来寻找将人工智能技术的潜在威胁降至最低的方法。他们希望将人工智能关在道德或制度的“牢笼”里，让人工智能难以威胁人类。既然奇点的来临无法避免，那么不如积极面对，当威胁来临时，我们对威胁本身的理解就会更加深刻。


    2017年初，上百名人工智能专家聚集到了加州的阿西洛马度假村，深入探讨了人工智能对人类的威胁问题。会议通过并发表了23条人工智能技术应该遵守的基本原则，这23条基本原则涵盖了科研、伦理和价值观、长期策略3个方面。这23条基本原则像科幻大师阿西莫夫笔下的著名的机器人三定律一样，从方法、特征、伦理、道德等多方面，对未来的人工智能可以做什么以及不可以做什么提出了限制条件。


    人工智能的高速发展给人类带来的最终挑战和威胁是，当人工智能超越人类智能以后，人生还有意义吗？古希腊哲学家亚里士多德曾在他想象自动机器人时认为，自动机器人会被主人所奴役，让人变得贪图安逸、不思进取。


    我们正在进入这样一个前所未有的时代。随着科技的进步，人工智能技术将在大量简单、重复性、不需要复杂思考就能完成决策的工作中取代人类。汽车将不需要人类来驾驶，语言也不再是人类交流的障碍，生产劳动将完全由机器人代替，甚至家务和购物都不用人来操心受累，人们有大量的空闲时间，或者沉浸在各种高级娱乐里，或者追随自己的个人兴趣。


    在这样的时代里，压在每个人肩头的工作压力、家庭压力会逐渐消失，任何追求都似乎没有太大的意义，那么我们活着干什么呢？到底是要做一个天天领着社会福利、躺在家里玩游戏、身形如电影《机器人总动员》里的人类后代一样臃肿的废物，还是努力学习新知识，积极从事文学和艺术工作，不断探索宇宙和哲学，不断思索自身存在的价值，重塑自己在人工智能社会中的地位与价值，寻找生物特征以外的生命意义？


    人生目标以及价值观将面临全新的挑战。在这样一个人类历史上从未经历过的崭新时代里，人生的意义何在？如何过完一生才最有价值？这一切都需要我们重新思考、重新定义和重新开始。


    人类因为有感情、会思考、懂生死、善适应而具有“感情”“思维”“自我意识”和“生死意识”等特质，从而使我们区别于其他动物，因此也可以且应该使我们区别于机器人。在《真实的人类》里，合成人曾说：“我不惧怕死亡，这使得我比任何人类更强大。”而人类则说：“你错了。如果你不惧怕死亡，那你就从未活着，你只是一种存在而已。”


    法国哲学家布莱士·帕斯卡说过：“人只不过是一根稻草，是自然界中最脆弱的东西，但他是一根能思想的稻草。用不着整个宇宙都拿起武器来才能毁灭，一口气、一滴水就足以置他于死地了。然而，纵使宇宙毁灭了他，人却仍然要比置他于死地的东西高贵得多，因为他知道自己要死亡以及宇宙对于他所具有的优势，而宇宙对此一无所知。所以，我们全部的尊严就在于思想。”这也许太抽象了，但令人深思。


    的确，人只不过是一根稻草，但人是一根能思想的稻草。人工智能的到来在挑战着人类，威胁着人类，但有思想的人类并不会因此而灭亡，因为我们全部的智慧就在于思想。我们一定能够找到答案。


    ## 10.4 奇点会是人类的终点吗


    18世纪，工业革命在欧洲全面爆发。


    1733年，英国发明家约翰·凯发明了用于织布的飞梭。1764年，英国布莱克本的纺织工詹姆斯·哈格里夫斯发明了现代机械——纺纱机，这是“使英国工人的状况发生根本变化的第一个发明”。人类生产与制造方式开始向机械化转换，以大规模的工厂生产取代手工作坊，出现了以机器取代人力的趋势。人类旧有的生产方式受到了挑战，大批技术工人和手工业者面临失业的威胁。


    1779年，英国莱斯特的一名叫内德·卢德的纺织工因愤怒而砸毁两台织布机，后来人们以讹传讹，将此事说成卢德将军或卢德王领导反抗工业化的运动，从而引发了反对机械化的卢德运动，还产生了所谓的卢德主义者。在这场运动中，常常发生毁坏纺织机的事件。


    今天，人工智能在信息革命的快速发展中更加深刻地“威胁”到了人类的生存。奇点会是人类的终点吗？我们到底该怎样看待“人工智能威胁论”呢？

