  trans: '


    大狗有 90 厘米长，75 厘米高，重达 110 千克，看上去不像一条大狗，倒真像一匹小骡子。它由小型汽油发动机驱动，可以驮运 150 千克物品，以 6.4
    千米/小时的速度行进，攀爬 35 度的陡坡。它的四足上装有约 50 个感应器，具有立体视觉系统。在身上的一台计算机的控制下，它可以完成导航、平衡和运动控制。它的四足有模拟实际生物四肢的液压关节，所以它可以坐下、站立，像动物一样行走和奔跑，摔倒以后还能自己爬起来。


    ![](img/figure_0154_0099.jpg)


    机器大狗


    大狗问世后立刻引起了不小的轰动，《华尔街日报》等各大新闻媒体争相报道。人们对大狗栩栩如生的步态和行动自如的能力惊叹不已。


    大狗的开发者叫马克·雷伯特。他早年在加州理工学院研究能跑会跳的机器人，后来跑到卡内基·梅隆大学和麻省理工学院做教授。1992 年，他创立了一家专门开发机器人的公司，这就是今天的波士顿动力公司。


    有大学的优势，有军方的资助，大狗的开发一代一代地不断深入和加强。到了 2012 年，大狗已经可以在 24 小时内走完 32 千米的路程，而且无须加油；驮载重量也由初期的
    150 千克提高到了 180 千克；视觉系统也得到了加强，并使用 LIDAR 感知地形。LIDAR 使用脉冲激光传感器测量物体之间的距离，是许多自动驾驶车辆导航系统的重要组成部分。机器人还使用路径规划算法来跟踪其起点与目的地之间的路线。


    2013 年末，波士顿动力公司发布了一段视频。在这段视频中，最新一代的大狗不但有四足，而且还添加了一只手臂，可以拾起重达 23 千克的物体，并将其投掷出去，威力惊人。不过，在
    2015 年末，大狗项目的军方资助停止了。因为大狗虽然一代比一代厉害，但它也有一个致命的缺陷，那就是由汽油发动机驱动的大狗的噪声太大，不适合在战场上使用。虽然有用电动机驱动的替代版本，但毕竟功率不够，只能驮载
    18 千克的物品，使用价值大打折扣。


    ![](img/figure_0155_0100.jpg)


    波士顿动力公司的大狗


    ![](img/figure_0155_0101.jpg)


    大狗投掷空心砖


    不过，波士顿动力公司并没有因此停止自己的研发。在大狗技术的基础上，他们进一步开发了机器豹子、机器野猫以及双足机器人等产品。他们开发的双足机器人有着非常独特的蹲伏式走路方式。它们的膝关节弯曲，躯干尽可能保持不动，这并非人类的走路方式。采用这种蹲伏式走路方式，是因为腿部保持弯曲状态可以防止跌倒。专家们除了提高类人机器人的效率外，也试图让机器人像人一样走路，让它们变得更加灵活，能够应对更加复杂的地形，甚至未来在救援行动中发挥积极作用。


    在网上可以看到这些机器人的不少视频，非常有趣。在最近的一段视频中，波士顿动力公司让他们的大狗排成两队，像狗拉雪橇一样拖动一辆集装箱式大货车。这些大狗的步调一致，齐心协力，憨态可掬。看着这些视频里的机器怪兽，不能不想起《三国演义》里诸葛亮发明的木牛流马，它们也许可以算得上这些机器大狗、机器野猫的祖先了。


    世界上所有腿足机器人的研制都受到了波士顿动力公司的启发和影响。中国机器人专家王兴兴就是大狗的粉丝。他在天使投资的助力下，在杭州创办了自己的机器人公司宇树科技。他开发的第一个四足机器人叫太空狗，灵感来自俄罗斯的太空狗，寓意走向未知。王兴兴毕业于上海大学。在读硕士研究生期间，他开发出了一个可以移动的机器走兽，并立志要开发出比波士顿动力公司的产品更简单的小型化产品来满足人们的日常需要。


    宇树科技公司自主研发了机器人的机械结构、控制系统和运动控制算法，还自行开发了定制电机、驱动器和力量感应器。他们的太空狗能在崎岖的路面上稳定行走，表现良好。对于他们开发的机器人控制算法，王兴兴曾自豪地说：“太空狗的实际表现出乎意料地好，这是数学的伟大。”


    2018 年，宇树科技公司的太空狗受邀参加了在西班牙马德里召开的世界机器人大会。太空狗有幸和波士顿动力公司的大狗一起玩耍，吸引了世界同行的眼球。开发人员也有幸和机器人“大咖”马克·雷伯特进行了面对面的交流。


    做“狗”虽“疯狂”，做“人”更“风流”。2008 年北京奥运会中出现过福娃机器人，它能够感应到 1 米范围内的游客，与人对话、摄影留念、唱歌舞蹈，还能回答与奥运会相关的问题。福娃机器人集成了先进的自动控制技术和语音技术，不仅可以用动作和表情表达自己的状态，还能用汉语、英语等语言进行简单的人机对话。“我是奥运福娃欢欢，我最喜欢红色……”它的声音充满童真。当你问“你叫什么名字”时，它会说“我叫欢欢”；如果你问“北京奥运会是在哪一天开幕的”，它则回答“2008
    年 8 月 8 日”。


    今天我们可以看到各种各样的机器动物、机器人，它们生动活泼，功能各异，为我们的生活和工作带来了越来越多的帮助和乐趣。


    ![](img/figure_0156_0102.jpg)


    宇树科技公司的太空狗


    ## 8.5 硅谷奇人“钢铁侠”


    在美国硅谷的旧金山湾区，有一个被誉为当今“钢铁侠”的科技风云人物，他就是特斯拉电动汽车的发明人、大名鼎鼎的埃隆·马斯克。如果你以为他只发明了特斯拉电动汽车，那么你就太不了解他了。他的发明上至太空，下至水底，高铁对于他来说已经是太传统和老旧的东西了。对于人工智能，他的思考更加超前。


    2008 年，美国大片《钢铁侠》风靡全球。片中主角托尼·史塔克身着高科技铁甲，上天入地，保卫地球。协助史塔克的智能机器人贾维斯也超级聪明能干，和美丽的女助理“小辣椒”一起成为史塔克的左膀右臂。据创作《钢铁侠》漫画的斯坦·李介绍，“钢铁侠”的原型人物是
    20 世纪美国著名企业家霍华德·休斯。曾经在好莱坞电影《飞行家》中出演休斯的著名影星迪卡普里奥这么评价过他：“霍华德·休斯的一生是我所看到的最跌宕起伏、离奇诡异的。他什么都经历过了，与疾病斗争，受强迫症困扰，成为飞行冠军，成为美国首位亿万富翁，转向好莱坞，成为与电影体制对着干的制片人，与大财团和垄断者抗争，甚至与参议员反目。他从来不能和一个女人天长地久，因为他总是不自觉地把面前的女人看成他的飞机，他始终希望能有飞得更快、更平滑的飞机，还要有更大的涡轮。”今天的马斯克也是这样一位富有、充满传奇色彩和饱受争议的天才人物。


    马斯克，1971 年出生于南非。10 岁时，他就开始自学编程。12 岁时，他成功设计出一款游戏，并以 500 美元的价格卖出，展现了他在科技和商业方面的才华。1995
    年，马斯克毕业于美国宾夕法尼亚大学，拿到物理学和经济学的双学位，然后进入斯坦福大学攻读应用物理学博士学位。但是没过多久，他便痴迷于硅谷的创业氛围，不想把时间和精力浪费在死板的学业上，于是申请退学，走上创业之路。


    马斯克创业的第一步是和他的弟弟金博尔·马斯克合伙创立了一个帮助企业发布商品信息和地图位置的公司，后来以 3 亿美元卖给了康柏公司，淘到了他的第一桶金。接着他投资创立了电子支付公司，不久与彼得·蒂尔等人创立的公司合并，成为后来大名鼎鼎的
    PayPal 公司。2002 年，eBay 以 15 亿美元收购了 PayPal，马斯克分到 1.8 亿美元。有钱更疯狂，他开始更加大胆地把他改变世界的梦想付诸实践。从移民火星到清洁能源，从自动驾驶电动汽车到管道极速电磁列车，他的梦想一个比一个更令人瞠目结舌。


    2002 年 6 月，为了帮助人类实现移民火星的梦想，马斯克成立了他的第三家公司 SpaceX，并亲自出任首席执行官和技术总监。经过多次失败之后， SpaceX
    公司终于成功地发射了可以重复使用的“猎鹰 9 号”火箭和航天飞机“龙飞船”，还把他的特斯拉汽车送上了太空，让特斯拉遨游宇宙，俯瞰天下。火箭的重复使用极大地降低了航天事业的成本。


    2004 年，马斯克投资了专注于研制纯电动汽车的特斯拉公司。在马斯克的领导下，特斯拉公司建设了号称全球最智能的全自动化生产工厂。在工厂的冲压生产线、车身中心、烤漆中心与组装中心这四大制造环节中总共有
    150 多台机器人参与工作。在这些车间中，机器人可以互相无缝衔接，配合工作，以至于车间里很少能看到工人。2016 年 11 月，特斯拉公司宣布收购德国自动化生产公司，计划进一步提升生产线的自动化水平。2017
    年 4 月，特斯拉公司的市值达到 500 亿美元，一度超过了百年老店通用汽车和福特汽车。


    特斯拉汽车不但可以实现全电动驾驶，而且它的车载自动驾驶辅助系统是目前所有汽车里最先进的人工智能自动驾驶系统。虽然时有事故发生而招来异议，但连谷歌和苹果公司的自动驾驶研究人员也不得不承认特斯拉公司在自动驾驶技术实践上的领先优势和取得的成功。马斯克更是“口出狂言”，他说，两年之内，特斯拉全自动驾驶电动车将取代目前的出租车。特斯拉大型货车也已经开始投产。


    对于人工智能，马斯克一方面把它具体应用在自己的发明创造中，另一方面又深深地为这样的技术发展可能给人类造成的威胁而担忧。马斯克曾公开表示：“如果让我猜对人类生存最大的威胁，我认为可能是人工智能。因此，我们需要对人工智能保持万分警惕，研究人工智能如同在召唤恶魔。”为了有效地把握人工智能这把双刃剑，他积极投资人工智能的相关研究。


    2015 年，马斯克联合了著名投资人彼得·蒂尔和其他一些硅谷大亨，共同投资 10 亿美元创建了人工智能非营利组织 OpenAI。OpenAI 大量招募人工智能领域的优秀人才，研究目标包括制造“通用”机器人和使用自然语言的聊天机器人。OpenAI
    把人工智能领域的研究成果开放地分享给全世界。因为马斯克认为，只有让人工智能技术普及到所有人都可以用的程度，才能有效地减轻超级智能可能会带来的威胁。


    马斯克在 2016 年又神秘地投资成立了另一家名叫 Neuralink 的公司。目前，没有人真正知道这家公司在开发什么具体的产品和研究哪一方面的技术，但据媒体的猜测，Neuralink
    公司正致力于一种被称为“神经蕾丝”的技术的开发，该技术将能把微小的脑部电极植入人体，并希望有朝一日能够实现对人类思维的上传和下载。这听起来和电影《阿凡达》中男主人公直接通过“神经链接”驾驭巨型飞鸟翱翔天际的科幻情景非常相像。马斯克在一次会议上曾经提到：“设想人工智能的进步速度，很显然人类将会被甩在后面。唯一的解决方案就是建立一种‘直接皮质界面’，在人类大脑中植入芯片。你可以将其理解为植入人类大脑内部的人工智能，通过这种方式来大幅度提升人类大脑的功能。”马斯克不否认
    Neuralink 公司承载了他希望通过植入人脑芯片实现人类与计算机“共生”的梦想。


    钢铁奇侠马斯克的神奇故事还远没有结束，具有奇思妙想而又勇于实践的他在未来会有更多的精彩呈现给大家。让我们拭目以待吧。


    # 第 9 章 数据，数据，还是数据


    ## 9.1 什么是数据


    数据，在英文中叫 Data。这个词最早出现在 17 世纪 40 年代。安德鲁斯·奥宗是法国 17 世纪著名的天文学家，他用自己发明的天文望远镜发现了彗星，后来他移居意大利的罗马，打算建造一个
    300 米长的光学天文望远镜，用来观察月球上的动物。为了向英国和法国的皇家学会展示他的天文望远镜的技术细节和他对星体运动轨迹的观察，他发明了用表格来记录和表示数据的方法，促成了早期“数据”一词及其概念的产生和形成。


    1880 年，美国工业革命的爆发促使了第一次人口普查的开展，人口状况变成了数据，极大地促进了美国经济的发展。然而由于当时计算机还没有出现，人口数据的统计和分析工作完全由手工完成，这让美国花费了
    7 年时间才最终形成了人口普查报告。为了缩短时间，1890 年赫尔曼·霍利里斯（又译何乐礼）发明了一种列表机。这种机器可以系统地处理记录在一种打孔卡片上的数据。由于他的发明，1890
    年的人口普查只花了 18 个月就完成了。他发明的这种打孔卡片也成为了后来发明的计算机输入数据的一种方式。


    ![](img/figure_0161_0103.jpg)


    安德鲁斯·奥宗的数据表


    机器计算设备根据它们表示数据的方式而有不同的划分。模拟计算机用电压、位置和距离等物理量来表示数据，数字计算机则通过对数据进行数字编码来表示数据。根据编码方法的不同，又可以有不同的表示方法。而革命性的突破是莱布尼茨二进制的发明，它不但简单，而且让数字编码、逻辑系统和电子信号脉冲的物理形式有机地联系起来，使电子计算机的发明成为可能。


    二进制数据是用 0 和 1 两个数码来表示的数。它的基数为 2，进位规则是“逢二进一”，借位规则是“借一当二”。数据在计算机中主要是以补码的形式进行存储的。计算机中的二进制是一个非常微小的开关，用“开”来表示
    1，“关”来表示 0。因为它只使用 0 和 1 两个数字符号，非常简便，易于用电子方式实现。电子数字计算机用于识别和处理由 0 和 1 符号串组成的代码，其运算模式就是二进制。


    ![](img/figure_0162_0104.jpg)


    二进制加法运算


    ASCII 码就是一种被普遍采用的英文字符信息编码方案，它用 8 位二进制数表示各种字母和符号。例如，用 01000001 表示 A, 01000010 表示
    B。1980 年，中国为 6763 个常用汉字制定了编码，称为《信息交换用汉字编码字符集 基本集》，标准号为 GB 2312—1980，每个汉字占 16 位。计算机的一个存储单元（即一个字节）里存放的究竟是英文还是汉字，它们都由程序进行识别。例如，表示英文字符的
    8 位二进制编码的最高位是 0，而表示汉字的两个 8 位二进制编码的最高位是 1，这样程序就能区别存储单元里存放的是英文还是汉字。


    随着电子计算机的发明，用只有 0 和 1 的二进制来表示任何数据成为现实。1946 年，“数据”一词被用来描述可以传输和存储的计算机信息。1947 年，约翰·图基把用
    0 和 1 在计算机里表示数据的单位命名为“位”（bit）。二进制编码是计算机内部用来表示信息的一种手段，人们平常和计算机打交道时，根本不用理会它。我们仍然用人们习惯的方式输入或者输出信息，其中的转换都是由计算机自动完成的。人工智能大师香农在他于
    1948 年发表的论文《通信的数学理论》中正式使用“数据”一词，而“数据处理”一词的首次使用是在 1954 年。1977 年，图基在他出版的《探索性数据分析》中，强调了数据和数据处理的重要性。


    计算机是处理信息的机器，信息处理的前提是信息的表示。计算机内信息的表示形式是二进制数字编码。也就是说，各种类型的信息，无论是数值、文字还是声音、图像都必须转换成数字（即二进制编码的形式），才能在计算机中进行处理。移动一下鼠标，按一下键盘，你的每一个动作最后到了计算机里也都变成了
    0 和 1，只用这两个数字就能弄出这么完美的东西来，这就是智慧的结晶。即使功能再强大的计算机系统（在软件和系统的层层叠加下，我们根本就不了解计算机内部的数据）也只是
    0 和 1 两个状态的组合而已。


    ![](img/figure_0163_0105.jpg)


    图基的文章《探索性数据分析》


    数据和信息（或知识）常常被人们混用，但其实它们的含义并不相同。数据只有在被分析后或在具体的内容下才成为信息。数据的概念通常和科学研究联系在一起，它是一个可以包罗万象的收集内容的集合。数据具有可收集、可衡量与分析、可报告等特点，同时数据还可以用图表等可视化工具表示出来。原始数据是被收集来之后没有进行过整理的数据，可能是杂乱无章甚至含有错误的数据。这样的数据需要进行不同的整理之后才能加以利用。整理以后的数据叫已处理数据。今天，数据已经完全数字化，并大规模地通过计算机进行处理和存储。数据正在像
    18 世纪的石油对于经济发展的重要性一样，成为主宰和决定今天数字经济发展的“新能源”。


    1974 年，丹麦计算机科学家彼得·诺尔在瑞典和美国出版了他的名作《计算机方法的简明调查》。这本书是对现代数据处理方法的一个全面总结，对现代数据和数据处理的概念做了进一步的总结。他说：“数据是一种用来交流和可被一些程序处理的对事实或看法的形式化表示。”他还在书中正式提出了“数据科学”的概念。他把数据科学定义为“一门关于表达特定领域里的数据的学问”。1977
    年，国际统计计算学会正式成立，把传统的统计方法、现代计算机技术和专业领域的知识结合起来，以达到把数据转换为信息和知识的目的。


    真正的数据和数据处理的转折点出现在 20 世纪 80 年代，关系数据库的发明和数据库存取检索语言的出现让数据的深入和广泛应用成为可能。各行各业都把自己的数据装进计算机系统，凭借数据库来存储、管理、分析和处理数据，各种各样的建立在数据库上的应用也应运而生，极大地促进了科学研究、金融贸易、生产管理和经济生活的发展。数据不再是孤立、零散和让人费时费力的东西，而在集中、便捷和快速的处理下，向人们展现出前所未有的价值和曾经深藏不露的魅力。


    ## 9.2 互联网的诞生


    数据通信的概念远早于计算机的发明，它让数据通过像无线电或通信电缆这样的电磁介质在两个不同的地方相互传输。电报、传真都是这样的早期通信系统，它们的特点是只能在两台设备间进行点对点的数据传输。香农是通信理论的开创人，建立了以通信理论为基础的信息论。


    早期的计算机系统是一个中央处理系统，它通过外挂的终端设备输入和输出信息。虽然这种点对点的通信方式可以让两台远程设备连接起来，但并不能让任意两台设备自由通信，并且在两台设备间必须有一条固定的物理连线，所以还称不上互联网络。


    1960 年 1 月，一个叫李克里德的美国心理学家和计算机科学家发表了一篇关于全球网络的论文，提出了让在不同地方的不同计算机通过网络连接起来传输信息的设想。1962
    年 8 月，他和另外一名科学家再次共同发表论文，把这一设想具体化。同年 10 月，美国国防部高级研究计划局雇用了李克里德，让他把国防部位于不同地方的大型计算机系统连接起来。他开始正式领导一个研究小组，进行分布式网络技术的研究工作，并在位于加州圣莫尼卡的系统开发公司、加州大学伯克利分校和麻省理工学院分别安装了一台互相联通的网络终端。这成为了互联网最早的雏形。


    如何把不同的物理网络连接成一个逻辑网络是网络通信的首要问题。早期网络使用的信息交换系统存在一个节点故障导致整个信息传输失败的问题。英国国家物理实验室的计算机科学家唐纳德·戴维斯提出了一种被称为包交换的网络通信方法。他把要传输的信息分成一个一个片段分别进行传输，这大大提高了传输的灵活性和效率。美国工程师斯拉里·罗伯茨利用唐纳德·戴维斯的包交换方法，开发了第一个成功实现的互联网——ARPANET。


    1969 年 10 月 29 日 22 点 30 分，ARPANET 成功地把坐落在洛杉矶的加州大学洛杉矶分校和位于旧金山湾区的斯坦福研究院联通。计算机教授李奥纳多从加州大学洛杉矶分校向斯坦福研究院发送了第一条信息。


    他一边在他的终端上输入“Lee”一边通过电话问对方：“你看到我输入的‘Lee’了吗？”


    对方在电话里答道：“看到了，我们看到了。”


    李奥纳多又兴奋地输入一个“O”，然后通过电话问：“你看到我输入的‘O’了吗？”


    对方答道：“看到，我们看到‘O’了。”


    李奥纳多继续输入“G”，可这时系统垮掉了。但不管怎么说，他们成功了！


    '
