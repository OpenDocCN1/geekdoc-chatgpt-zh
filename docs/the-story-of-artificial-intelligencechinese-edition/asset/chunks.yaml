    图像识别技术的核心是模式识别。所谓模式识别，说得通俗一点，就是把一个事物的特点找出来。我们已经知道，无论是人和动植物还是汽车、房子和机器，任何事物在外观上都有与众不同之处，可以进行分类，一个类别就是一个模式。这样就可以做到“物以类聚，人以群分”。


    概率统计的方法和神经网络在早期就已经是图像识别技术的基础，提供了图像中不同特征的统计分布和概率特征，并且以按层次分别提取的方法提高提取效率，强化特征本质，从而做出判断。对照片图像的识别开始于对军事侦察中拍摄下来的目标进行图像识别，从而指出目标图像是哪一种军事设施，例如坦克、飞机或大炮等。但限于当时光学摄像技术和计算机处理能力低下，图像识别技术只能对黑白照片上的二维图像进行比较粗糙的大概特征的识别，不能做到更精准的细部分析和三维图像的有效识别。


    与此同时，图像识别的另一个研究方向是解决如何识别三维图像。这对于开发可以自由移动的机器人来说至关重要，因为机器人必须有能力观察四周环境的物理情况，以决定移动的目标和路径。其实，任何三维物体在二维照片上的立体感都来自不同阴影形成的界线，所以对三维图像的识别是从识别和分析图像中物体的线条关系和特征入手的，其学名叫目标的边线识别。


    1968年，斯坦福研究院在美国国防部的资助下开发出了第一个载入史册的智能移动机器人——沙克依。这个机器人通过一个电视摄像机来对四周的环境进行“观察”，把“看到”的情况“告诉”自己的“大脑”。它的车载小型计算机对“看到”的情形进行图像识别和分析，从而可以判断出是墙还是门以及是在房间内还是在走廊中，还可以“看出”物体的形状，进而根据它的目标要求确定移动的方向，驱车而行。它的诞生不仅标志着智能机器人技术的飞跃，而且标志着图形识别技术的重大突破，其中的很多技术一直沿用至今。


    随着研究的不断深入和硬件技术的飞速发展，图像识别也从黑白到彩色，从静态图像到动态视频，从识别分析具体的特定目标到全面识别分析图像中的所有事物。2012年，谷歌的科学家用16000台计算机搭建、模拟了一个人脑神经网络，并向这个网络展示了1000万段从YouTube上随机选取的视频。结果，这个系统在没有外界干涉的条件下，自己认识到猫是一种怎样的动物，并成功找到了几乎所有包含猫的照片，识别率为81.7%。


    人工智能技术已经给了机器一双慧眼，让机器比人更“心明眼亮”。今天，无人驾驶汽车、无人驾驶飞机、无人收费停车场、手机扫一扫等应用正逐步深入我们的生活，深刻地改变着我们的生活和工作方式，这背后的秘密就是计算机图像处理与识别技术。


    # [第7章 让计算机能听会说](../contents/content.xhtml#toc43)


    ## [7.1 计算机听到的是什么](../contents/content.xhtml#toc44)


    2018年5月，谷歌的开发者大会在位于山景城的谷歌总部如期举行。谷歌首席执行官桑德健步走上讲台，幽默而风趣地说：“我先给大家做一段演示，相信你们一定会感到惊讶。”接着，他打开了谷歌的智能语音助手，请它帮助自己预约一个理发时间。


    ![](images/figure_0121_0083.jpg)


    谷歌开发者大会


    智能语音助手开始拨打一个理发店的电话号码，会场上鸦雀无声。不一会儿，电话拨通了。


    智能语音助手开口问道：“嗨，我想为一位女性客户预约做一下发型。5月3日方便吗？”


    理发店接待员说：“应该没问题，请稍等。”


    智能语音助手说：“嗯。”


    会场上，人们听到智能语音助手煞有介事地运用语气词，不时发出善意的哄笑。


    理发店接待员看过预约记录后说：“没问题，请问大概是什么时段？”


    智能语音助手说：“中午12点。”


    理发店接待员说：“12点已经有预约了，其他最接近的时间是1:15。”


    智能语音助手问：“上午10点到12点之间有空闲时段吗？”


    理发店接待员说：“10点这个时段有空位。”


    在场的人们被智能语音助手完美无缺的表现震惊了，掌声雷鸣般地响起。马上有许多人在推特上迫不及待地说：“谷歌智能语言助手居然能这样自然流畅地和真人交流，连声音都和人类的声音一模一样，这太让人震惊，太可怕了！”


    桑德演示的智能语音助手就是一个语音识别系统，它不但可以听懂人类的语言，而且可以模仿人类说话。


    ![](images/figure_0122_0084.jpg)


    语音识别


    关于让计算机能听会说的研究很早就已经开始了。20世纪30年代，美国的贝尔实验室就已经着手进行语音识别的研究工作，并在1952年成功地让机器可以识别从0到9的人类发音。进入到60年代以后，美国、日本、英国和苏联都相继开展了计算机语音识别的专门研究。


    我们知道，声音是一种波，称之为声波。计算机通过话筒把接收到的声波转换成电信号。电信号是一种连续变化的电波，计算机通过采样把电信号数字化。所谓采样就是在相同的时间节点上不断采集电信号的大小，这样就把连续的电信号转换成一串离散的数字。采样的频率越高，采集的数据量就越大，声音就被还原得越自然。这样采集下来的数据通过编码存储到计算机里，以便进行下一步的识别。


    计算机下一步怎样识别出声音包含的意思呢？我们讲话时声音的最小单位是音素，也就是元音和辅音。英语有48个音素，其中元音音素为20个，辅音音素为28个。首先，计算机会根据波形数据对语音进行分段，识别出其中的每一个音素。然后，把识别出来的音素合成单词，把单词合成句子，最后对句子的意思进行理解。当然，我们这里讲的只是一个简单的过程，实际识别远没有这么简单。我们每个人讲话时都会带有不同的口音，生活中很少有人会字正腔圆、一字一顿地说话。不同环境、不同场景的噪声也会对所采集的语音信号有很大的干扰。语言的歧义性和模糊性更会影响到听众对意思的理解，如“雕像”和“刁相”的发音相同。


    所以，早期的语音识别方法是从对固定领域里的十分有限的词汇和句子进行模式匹配开始的。先通过训练阶段，让人把词汇表中的每个单词依次读一遍，并且将其特征作为模板存入模板库。在识别阶段，将输入的语音的特征依次与模板库中的每个模板进行相似度比较，将相似度最高者作为识别结果输出。


    20世纪70年代，卡内基·梅隆大学在美国国防部的资助下成为了美国语音识别的一个富于成果的研究基地。在卡内基·梅隆大学里有一对夫妇，他们是计算机博士詹姆斯·贝克和珍妮特·贝克，开发了一套名为“龙”的语音识别技术，还以此创立了龙系统技术公司。他们在语音识别中引入了一种新的方法，把声波出现模式的概率和词频概率联系起来去发现对应关系的最大概率。这种概率统计的方法给语音识别研究打开了一扇大门，为后来语音识别技术的发展提供了宝贵的思路和经验。


    另一位著名的语音识别研究者是图灵奖得主拉吉·瑞迪教授，他带领自己的学生把根据语言学习知识总结出来的语音和英语音素、音节的对应关系用知识判定树的方式画在黑板上，每次从系统中得到一个新的发音时，就根据黑板上的知识来确定对应的是哪个音素、哪个音节、哪个单词。如果黑板上的知识无法涵盖某个新的发音，就相应地扩展黑板上的知识树。他把研发出的这个系统叫作Hearsay，人们亲切地把它叫作“黑板架构模型”。


    他的学生布鲁斯·劳埃尔觉得Hearsay有很大的局限性，他转而用自己的方式对该系统进行了改进，设计出了名为HARPY的语音识别系统。布鲁斯·劳埃尔的思路是：把所有能讲的话串成一个知识网络，把每个单词打开变成单独的音节、音素，然后根据它们的相互关系，将它们串联在网络里，并对网络进行优化，用动态规划算法快速搜索这个知识网络，找出最优解。他在博士论文中展示了这套语音识别系统，成为卡内基·梅隆大学研发出的当时世界上最好的语音识别系统，可以识别1011个英文单词。


    可别小看这1011个单词的识别，它凝结了数不清的研究和探索，成功的代价也是巨大的。HARPY语音识别系统为了听懂1秒的内容需要执行3000万条计算机指令，在当时的计算机硬件条件下需要大约1分钟的时间。今天，计算机1秒就可以处理数十亿条指令，实时处理语音才成为可能。


    基于数据的统计建模，比模仿人类思维方式总结知识规则更容易解决计算机领域的问题。计算机的“思维”方法与人类的思维方法之间似乎存在着非常微妙的差异，以至于在计算机科学的实践中越是抛弃人类既有的经验知识，越依赖问题本身的数据特征，越容易得到更好的结果。因此，以知识为基础的语音识别研究日益受到重视。在进行连续语音识别的时候，除了识别声学信息外，更多的是利用各种语言知识（诸如构词、句法、语义、对话背景等）来进一步对语音进行识别和理解。同时，在语音识别研究领域也产生了基于统计概率的语言模型。


    彼得·布朗特别聪明，他跟当年从卡内基·梅隆大学毕业的许多博士生一样，进入了那个时代科学家最向往的几个超级乐园之一——IBM公司的沃森研究中心。在沃森研究中心里，彼得·布朗跟着弗雷德里克·耶利内克领导的小组研究语音识别。那个时代语音识别的主流技术还是拉吉·瑞迪教授主导的专家系统模式，可IBM公司里的这一小撮人因为一时找不到语言学方面的专家，只好悄悄搞起了概率统计模型。世界上的事情有时候就是这样的，有心插花花不开，无心栽柳柳成荫。他们自己也没想到，弄一大堆训练数据统计来统计去，效果反而比专家系统的方法还好，成功率提升了不少。随着统计模型的崛起，在随后的一二十年中，按照单词统计的识别错误率从40%左右降低到20%左右。


    ![](images/figure_0125_0085.jpg)


    语音助理


    2011年之前，主流的语音识别算法在各主要语音测试数据集中的识别准确率还与人类的听写准确率有一定的差距。2013年，谷歌语音识别系统识别单词的错误率在23%左右。也就是说，语音识别系统基本上还停留在比较稚嫩的阶段，说话者必须放慢语速，力求吐字清晰，才能获得令人满意的准确率。然而，突破就在眼前。在神经网络和深度学习突飞猛进的时代，人工神经网络在语音识别中的应用研究大规模地兴起。在这些研究中，大部分采用了基于反向传播算法的多层感知网络，大大提高了区分复杂的分类边界的能力，助推了模式的划分。新的突破只用了两三年的时间就让微软、IBM、谷歌等公司将语音识别的错误率从20%左右降低到了6.3%，这就有了我们开始时讲到的那一幕。2018年5月谷歌的智能语音助手向世人展示了今天人工智能语音识别技术令人惊叹的发展。故事还在继续，层出不穷的新突破正在让我们目不暇接。


    ## [7.2 计算机是怎样读懂文章的](../contents/content.xhtml#toc45)


    自人类文明诞生以来，文字就是人类交流信息、记载历史和传播知识的基本介质。不仅如此，文字作为人类语言的书写形式，还是人类文化思想和智能的一种载体。所以，在人工智能研究中，如何让计算机识文断字就是一个十分重要的课题，叫作自然语言识别。而自然语言识别的一个重要理论基础就是语言学。


    美国哲学家、语言学家和认知科学家乔姆斯基是开拓这一领域的先驱和大师。没有他，我们可能还在黑暗中摸索。直到有了乔姆斯基，语言学才有了坚实的理论基础，成为一门真正的科学。难怪有人称乔姆斯基是语言学的牛顿。


    乔姆斯基出生在美国费城的一个犹太家庭，16岁就进了入宾夕法尼亚大学。在大学二年级的时候，乔姆斯基厌倦学业，准备退学，他的老师、结构语言学的开山鼻祖哈里斯劝他留下，还给了他一本自己尚未出版的书稿《结构语言学方法》，建议他学习语言学，并对他说要先从数学和哲学入手开始学习。哈里斯是把语言学从人文学科转为科学的第一人，他在宾夕法尼亚大学建立了美国第一个语言学系。在老师的影响下，乔姆斯基豁然开窍，从此走上了语言学之路。


    在宾夕法尼亚大学拿到学士和硕士学位后，他跑到哈佛大学，投奔在了当时美国哲学界领袖奎因的门下，成为了一名初级研究员。在哈佛大学，他发表了他的第一篇学术论文《句法分析系统》。


    1955年4月，为了免服兵役，乔姆斯基跑回宾夕法尼亚大学，求老师帮忙给他一个博士学位。因为按规定，如果拥有博士学位，就可以不去当兵。他的老师们当然知道，博士学位对于乔姆斯基的才能来说不过是小菜一碟，但也不能说给就给，还是要有规矩的。于是他们说，只要你能拿出一篇像样的博士论文，我们就可以让你拿到博士学位。乔姆斯基就从他正在写的一部近千页的大作中节选出了一篇博士论文。他的大作就是在20年后才发表的《语言学理论的逻辑结构》，是他那具有划时代意义的句法分析理论的雏形。他的老师们自然无话可说。仅书面回答了几个问题后，他就顺利拿到了博士学位。


    按照乔姆斯基的句法分析理论，句子可以通过一系列规则得到解析。一个句子可以解析为名词词组和动词词组，而名词词组和动词词组又可以继续被解析下去。他认为，所有语言都是与此类似的句法结构，并进一步指出语言的结构是内在的，而不是通过经验得到的。他还试图证明，语言机制的核心是简单的合并操作，而合并是人类通过进化所特有的能力。对语言的创造性使用是人性的标志。乔姆斯基的文法和各种自动机的关系是计算机科学的理论基石之一，也为如何让计算机识文断字的早期研究和其后发展奠定了理论基础。


    1968年，卡内基·梅隆大学的一个叫奎林的学生对用计算机表达人类思维活动特别是记忆的组织方式十分感兴趣。他提出了一种以网络格式表达人类知识构造的形式，人们称之为语义网络，用于描述物体的概念与状态及其相互间的关系。语义网络由节点和节点之间的弧组成，节点表示概念(事件、事物)，弧表示它们之间的关系。在数学中，语义网络是一个有向图，与逻辑表示法对应。


    语义网络是一种用图来表示知识的结构化方式。在一个语义网络中，信息被表达为一组节点，节点通过一组带标记的有向线段彼此相连，用于表示节点间的关系。开始时，语义网络是作为人类联想记忆的一个明显公理模型提出的，随后在人工智能中用于自然语言理解。


    语义网络的一个重要特性是属性继承。凡是用有向弧连接起来的两个节点都有上位与下位关系。例如“兽”是“动物”的下位概念，又是“虎”的上位概念。所谓属性继承指的是上位概念具有的属性均可由下位概念继承。在属性继承的基础上，可以方便地进行推理。语义网络可以深层次地表示知识，直接而明确地表达概念的语义关系，模拟人的语义记忆和联想方式，为知识的整体表示、检索和推理提供了基础。


    ![](images/figure_0128_0086.jpg)


    语义网络


    有了以模式识别技术为主的文字识别方法和以语义网络技术为主的文字理解方法，让机器识文断字就成为了现实。今天手机上的扫一扫、自动翻译软件、专家系统和知识库的背后都有它们的身影。


    在自然语言识别的研究中一直有两种不同的方法，其中一种是以乔姆斯基为代表的语言学方法，另一种是以贾里尼克为代表的统计学方法。所谓的统计学方法就是在大量数据的基础上形成语料库，通过概率统计来发现数据特征，建立数据模型。实际上，这是一种建立在大数据之上的机器学习方法。简单点说，一个词在生活中的用法多种多样，但在不同环境和场合下出现的频率不同，和其他词语关联的频率也不同。我们把这种出现的频率叫作概率。把各种词语出现的概率统计记录下来，建立一个词语的统计模型。通过这样的统计模型，我们就可以分析和理解一个句子的意思。


    贾里尼克是IBM公司的一名科学家。他领导了IBM公司沃森研究中心机器翻译小组的工作，推出了法语和英语间的翻译系统CANDIDE，成为了自然语言识别领域里统计学方法的代表。他的名言是：“我每开除一名语言学家，我的语音识别系统的性能就将提高1倍。”看得出来，他是多么不喜欢自然语言处理中的语言学方法。


    然而，条条大路通罗马。在人工智能科学的研究中，一直就是八仙过海，各显其能。


    ## [7.3 新闻不再用人写](../contents/content.xhtml#toc46)


    2016年，谷歌的工程师让人工智能系统学习了2865篇爱情小说，然后又教给它一些英语诗歌创作的基本格式，接下来人工智能系统真的写出了一首又一首情感小诗。比如下面这首小诗：“没有人见过他/这让我想哭泣/这让我觉得不安/没有人见过他/这想法让我微笑/痛苦曾经难以忍受/人们曾经无语/那个男人喊了出来/那个老人说/那个男人问。”


    这些英文诗读下来，虽说有一些多愁善感的意味，但还是让人觉得似是而非，多少有些莫名其妙。但人工智能在新闻写作上就大不一样了。你知道吗？现在相当数量的新闻都是由计算机上的人工智能程序自动撰写的。


    2011年，思科公司的一个名叫罗比·艾伦的工程师创办了一家小公司，取名叫Automated Insights，其首字母缩写就是人工智能的英文缩写——AI。罗比·艾伦立志研发人工智能自动写作程序。Automated
    Insights公司与美联社等新闻机构合作，用机器自动撰写新闻稿件。2013年，机器自动撰写的新闻稿件已达3亿篇，超过了所有主要新闻机构的稿件产出数量；2014年，Automated
    Insights公司的人工智能程序撰写的新闻稿已超过10亿篇。


    美联社于2014年宣布，将使用Automated Insights公司的技术为美国和加拿大的上市公司撰写营收业绩报告。目前，美联社每季度使用人工智能程序自动撰写的营收报告接近3700篇，这个数量是同时段美联社记者和编辑手工撰写的相关报告数量的12倍。2016年，美联社将自动新闻撰写扩展到体育领域，从美国职业棒球联盟的赛事报道入手，大幅减轻人类记者和编辑的劳动强度。


    2014年3月17日清晨，仍在梦乡中的洛杉矶市居民被轻微的地面晃动惊醒。这是一次震级不大的地震，但因为震源较浅，市民的感受还是比较明显的。地震发生后不到3分钟，《洛杉矶时报》就在网上发布了一则有关这次地震的详细报道，报道不但提及了地震台网观测到的详细数据，还回顾了旧金山区域最近10天的地震观测情况。


    人们在新闻报道的网页上看到了《洛杉矶时报》记者的姓名，但该新闻之所以能够在如此短的时间里发出，完全要归功于可以不停工作的人工智能新闻撰写程序。在地震发生的瞬间，计算机就从地震台网的数据接口中获得了有关地震的所有数据，然后飞速生成英文报道全文。刚刚从睡梦中惊醒的记者一睁眼就看到了屏幕上的报道文稿，他快速审阅、署名后，用鼠标单击了“发布”按钮。一篇自动生成并由人工复核的新闻稿就这样在第一时间快速面世了。


    美国的美联社、《华盛顿邮报》以及中国的新华社在人工智能新闻写作方面进行的探索和实践，在很大程度上提高了新闻写作的效率，同时也保证了新闻写作的准确性。对于一些新闻消息来说，是可以通过人工智能进行信息检索和信息加工来实现的。


    人工智能是如何进行写作的呢？其实，计算机主要采用机器学习、深度学习等算法来生成文章或辅助写作，如写稿机器人、写作辅助工具、智能写诗、智能写春联等。写新闻的机器人记者实时在网上发现最新的信息，大量搜索相关数据，并根据以往对事实进行评论的方法和用语来迅速产生一篇报道。比如在体育报道方面，它能够充分理解“反败为胜”“团队努力”之类的专业术语，同时根据算法的判断对体育比赛最重要的方面进行报道。它不是单纯地复述事实，而是会给文章加入一些不同的新元素。


    我们知道，任何一类文章都有自己的体裁特点和风格样式，这种体裁特点和风格样式在新闻报道上更加突出和鲜明。人工智能写作的基本能力就建立在分析大量数据的基础上，总结和发现这些规律和特点，然后通过解构，从大量数据中提取所需内容，并通过排列、组合形成新的文章。

