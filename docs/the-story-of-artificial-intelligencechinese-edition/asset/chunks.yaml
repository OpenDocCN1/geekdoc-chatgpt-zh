    ## 布尔与罗素

    1815 年，乔治·布尔出生于英国东部的林肯郡，他的父亲是个补鞋匠。因家庭条件困难，布尔没有机会接受正规的教育，但聪明勤奋的小布尔自学成才，16 岁就开始当教师补贴家用，19
    岁时创办了自己的学校，从此挑起了整个家庭的重担。

    布尔在教书的过程中不断探索和总结前辈的知识和理论，发明了逻辑代数，把逻辑简化成极其容易和简单的一种代数。在这种代数中，逻辑推理成了数学公式的初等运算，这些公式比过去在中学代数中所运用的大多数公式还要简单得多。布尔的发明让逻辑本身受到了数学的支配。为了使自己的研究工作趋于完善，布尔在此后
    6 年的漫长时间里又付出了不同寻常的努力。


    ![](img/figure_0074_0047.jpg)

    布尔

    1854 年，布尔出版了他的经典著作《思维规律的研究》，更加系统地阐述了布尔代数。布尔代数问世了，数学史上树起了又一座新的丰碑。但布尔作为一个师出无名的小学老师，他的发明没有受到人们的重视。欧洲大陆著名的数学家蔑视地称它为没有数学意义的、哲学上稀奇古怪的东西，他们怀疑英伦岛国的自学成才的数学家能在数学上做出什么独特贡献。


    ![](img/figure_0074_0048.jpg)

    《思维规律的研究》

    布尔在他的杰作出版后不久就去世了。直到 20 世纪初，英国的另外一名哲学家、逻辑学家罗素在《数学原理》中认为：“纯数学是由布尔在一部他称为《思维规律的研究》的著作中发现的。”此说一出，立刻引起世人对布尔代数的极大关注，布尔才得以重新进入人们的视野，名垂千古。

    罗素出生于 1872 年，逝于 1970 年。他不仅经历过两次世界大战，目睹了大英帝国从巅峰向下的没落，还见证了计算机科学和人工智能的孕育和诞生。罗素出身于英国贵族家庭，他的祖父约翰·罗素勋爵在
    19 世纪 40 年代曾两次出任英国首相。罗素幼年就相继失去了母亲和父亲，由祖父母抚养长大。


    ![](img/figure_0075_0049.jpg)

    罗素

    罗素和他的老师怀特海花了 9 年时间一起写成了一部三卷本的著作《数学原理》，试图表明所有的数学真理在一组数理逻辑内的公理和推理规则下，原则上都是可以证明的。这一雄心勃勃的宏伟设想后来被美国数学家哥德尔发表的“哥德尔不完全性定理”证明是不可能实现的。

    但罗素和怀特海的《数学原理》启发了很多天才人物，与麦卡洛克一起发明了`MP`神经元模型的皮茨就曾经在 12 岁时苦读《数学原理》，还写信给罗素讨论他发现的问题，得到了罗素的极大赞赏并被邀请到剑桥大学读书，后来成为了神经网络的创始人之一。

    罗素最受欢迎的著作是《西方哲学史》，这本哲学史著作写得幽默、清晰、简洁，同时还有作者本人作为大哲学家的真知灼见。1950 年，罗素为此获得了诺贝尔文学奖。颁奖词对他的介绍是：“他一生著述甚丰，涵盖极广。他论及人类知识和数理逻辑的科学著作具有划时代意义，堪与牛顿的机械原理媲美……在诺贝尔基金会设立
    50 周年之际，瑞典文学院相信自己正是按照诺贝尔设奖的精神把这份荣誉授予伯特兰·罗素这位当代的理性和人道主义的杰出代言人的。”


    ## 4.3 贝叶斯定理和统计学派

    在人工智能领域应用最多的也许就是贝叶斯定理和基于贝叶斯定理的贝叶斯网络了，它们是机器学习的核心方法之一，从简单的拼写校正、垃圾邮件过滤到图像识别、机器翻译，几乎无所不在。贝叶斯定理的发明者是英国牧师托马斯·贝叶斯。


    ![](img/figure_0076_0050.jpg)

    贝叶斯

    说起贝叶斯，其实他并不是一名专业数学家。从英国爱丁堡大学毕业后，他就继承父业，做了英格兰长老会的一名牧师。作为一名新教的牧师，他一生都想证明上帝的存在。可在证明上帝的存在时，贝叶斯遇到了一个棘手的难题，就是无法获得完整的信息。如何处理部分未知的信息和条件让他大伤脑筋。

    白天，他一边忠心耿耿地服务于他的上帝，兢兢业业地履行他的教职，一边冥思苦想；晚上，烛灯燃尽，伏案执笔，写写算算，推导论证。遗憾的是，他到死也没能够证明上帝的存在，但他的研究创造了概率统计学中的一个原理。他发明的贝叶斯公式更是成为处理这类不确定性问题的金钥匙，冥冥之中成为了后来人工智能的一大基石。

    那么，贝叶斯公式是怎样的呢？它又是怎样解决不确定性问题的呢？贝叶斯公式写出来是这样的：


    ![](img/figure_0076_0051.jpg)

    这里的`P`代表事件`Dj`发生的可能性有多大，我们称之为`Dj`发生的概率。事件`Dj`是总事件`x` 中的一个随机抽取的样本。如何理解这个看似复杂的公式呢？我们通过一个例子来说明这个公式是怎样解决不确定性问题的。

    假设你有一台无线电收音机，午夜以后一个电台会发出两个固定信号之中的一个，我们用信号`A`和信号`B`来区分它们。一天夜里，我们打算接收这个电台发出的信号，猜一猜今天这个电台会发出`A`和`B`之中的哪一个信号？简单，我们实际收听一下不就得了。可是假设电台离我们很远，收到的信号又含有很大的噪声。怎么办呢？我们知道过去信号发出的概率，能不能以此来推断出今夜电台发出的信号是`A`还是`B`呢？

    让我们把今夜接收到的信号定义为`y`，实际发出的信号定义为`x`（`x`只可能是`A`或者`B`）。那么，接收到的信号是`A`的可能性可以写成`P(x\=A|y）`，接收到的信号是`B`的可能性就可以写成`P(x\=B|y）`。一个合乎逻辑的判断规则应该是，如果今夜发出`A`的概率大于发出`B`的概率，那么今夜发出的信号就可能是`A`，反之亦然。可问题是我们并不能准确地知道今夜它们出现的概率。这时贝叶斯公式就可以帮我们解决这个问题，它允许我们通过猜测或获得其他概率来间接地计算出我们所要的概率。

    假设我们知道它们以前每晚发出的概率`P(x\=A)`和`P(x\=B)`，就只需要计算出在`x\=A`和`x\=B`时的`P(y|x)`，通过比较它们中的哪一个更大来决定今夜发出的信号是`A`还是`B`。`P(y|x)`被称为在给定的`x`下`y`的可能性（说得专业一点叫似然率）。关于具体运用贝叶斯公式的计算过程，我们就不在这里介绍了，等有机会学习概率统计学时，老师一定会进行详细的讲授。

    这有一点烧脑，不然贝叶斯也不会因此成为举世公认的数学家，大名鼎鼎的贝叶斯公式也不可能成为今天人工智能的一大基石。简单地说，贝叶斯公式就是在已知的先验概率的基础上，计算出可能发生的后验概率，根据后验概率的大小为决策提供依据。

    经过百年的发展和完善，贝叶斯公式已经成为了一整套理论和方法，并在概率统计领域中自成一家。1742 年，贝叶斯因为他卓著的研究成果被接纳为英国皇家学会的会员，他的两部著作《机会问题的解法》和《机会的学说概论》在他死后也广受重视，影响至今。

    人工智能技术历来有符号学派和统计学派两大阵营之分。符号学派以规则和逻辑推理为核心探索人工智能的方法，统计学派则用大数据和概率统计的方法探索人工智能的实现，其核心就是贝叶斯定理。让我们通过一个机器翻译的小例子看看贝叶斯是怎么帮到我们的。

    假设我们要把这样一句英语“John loves Mary”（约翰爱玛丽）翻译成法语“Jean aime Marie”。我们用`e`代表“John loves
    Mary”，需要考察的首选`f`为“Jean aime Marie”（法语）。我们需要求出把`e`翻译成`f`的可能性有多大，即`P(e|f)` 是多大。为此，我们考虑
    `e` 和 `f` 有多少种对齐的可能性。什么叫对齐呢？就是每一个英语单词可以有多少个法语单词与之相对。英语“John” 对应于法语“Jean”，英语“loves”对应于法语“aime”，英语“Mary”对应于法语“Marie”，以上就是其中的一种（最靠谱的）可能的对齐。为什么要对齐呢？因为一旦对齐了，就容易计算在这个对齐之下的`P(e|f)`
    是多大，即计算`P(John|Jean)`×`P(loves|aime)` ×`P(Mary|Marie)`。然后，我们遍历所有的对齐方式，并对每种对齐方式之下的翻译概率进行求和，便可以得知
    `P(e|f)` 是多大。


    ![](img/figure_0078_0052.jpg)

    朱迪·珀尔

    这就是统计机器翻译的方法，因为其简单，可以自动（无须手动添加规则）进行计算，所以这种方法迅速成为了机器翻译的事实标准。而统计机器翻译的核心就是贝叶斯方法。

    1988 年，以色列裔美籍计算机科学家和哲学家朱迪·珀尔教授在贝叶斯定理的基础上发明了贝叶斯网络。它是一种基于概率的不确定性的推理网络，是用来表示变量集合连接概率的图形模型，提供了一种表示因果信息的方法。我们已经知道，贝叶斯公式为预测事件出现的概率提供了一种工具，但概率预测中并不包含因果关系，而分析因果关系是一件很困难的事。比如，路上的很多人都带着雨伞代表可能会下雨，但雨伞不是下雨的原因。当你想改变事件的结果时，了解因果关系就显得十分重要了，比如要阻止一场雨，不可能让所有人都不带雨伞。朱迪教授的贝叶斯网络提供了包含因果分析的概率方法，使基于概率的机器推理模型让计算机能在复杂的、模糊的和充满不确定性的环境下工作，是目前不确定性知识表达和推理领域中最有效的理论模型之一。

    贝叶斯网络在自然语言处理、故障诊断、语音识别等许多领域得到了广泛的运用，珀尔教授也因此获得 2011 年度的图灵奖，成为又一位荣获图灵奖的人工智能学者。在今天这样一个物联网不断进入各行各业的新时代，智能家居、自动驾驶汽车、智能手机、智慧城市中无数的传感器每时每刻都在产生亿万字节级的数据，基于贝叶斯网络等统计数学模型的人工智能算法成为这些应用的基石。


    ## 4.4 哥德尔和他的不完全性定理

    悖论就是逻辑上的自相矛盾。

    最古老的悖论是 2000 多年前的“说谎者悖论”。它最简单的形式可以是这样的一句话：“我说的是假话。”如果你说这句话是假的，就可以推出它是真话；如果你认为这句话是真的，那么就可以推出它是假话。总之，这句话的真假是不能通过逻辑推理证明的。

    20 世纪，一些善于思考的人隐约觉察到，在这样的悖论中隐藏着一些深刻的数学理论。事情要从崇尚理性的文艺复兴时期谈起。当时的学者笛卡儿、莱布尼茨等都想创造一种理论来解决一切问题。莱布尼茨甚至设想用数学符号表示逻辑学，以后每逢争论，拿支笔一算就见分晓了。事实证明，莱布尼茨对符号逻辑的建立起了很大的作用。

    莱布尼茨太超前于时代了，没能完成他的夙愿。又过了 200 年，著名学者康托尔提出集合论，为统一数学提供了一线希望。集合论是研究由一堆抽象事物构成的整体的数学理论，包含了集合、元素和成员关系等最基本的数学概念。集合论的出现，为近代数学的发展提供了有力的工具。就在数学家踌躇满志的时候，集合论中出现了悖论。康托尔自己就发现了康托尔悖论：包含一切集合的集合是否存在。更严重的是罗素悖论。

    罗素曾经认真地思考过这个悖论，并试图找到解决办法。他在《数学原理》里说道：“自亚里士多德以来，无论哪一个学派的逻辑学家从他们所公认的前提中似乎都可以推出一些矛盾来。这表明有些东西是有毛病的，但是指不出纠正的方法是什么。1903
    年春季，其中一种矛盾的发现把我正在享受的那种逻辑蜜月打断了。”

    他承认“说谎者悖论”是一个例证，可以最简单地勾画出他发现的那个矛盾。那个说谎者说：“不论我说什么都是假的。”事实上，这就是他所说的一句话，但是这句话是指他所说的话的总体。当把这句话包括在那个总体之中的时候，悖论就产生了。

    罗素试图用命题分层的办法来解决这个问题。我们可以说第一级命题就是不涉及命题总体的那些命题，第二级命题就是涉及第一级命题的总体的那些命题，以此类推，以至无穷。但是这一方法并没有取得成效。从
    1903 年到 1904 年，他差不多完全致力于解决这一悖论，但是毫无进展。罗素悖论涉及的是以自己为元素的集合，这被称为“第三次数学危机”。后来，这种定义被公理排斥掉了，危机才得以解决。

    20 世纪 20 年代，在集合论不断发展的基础上，大数学家希尔伯特向全世界的数学家抛出了个宏伟计划，其大意是建立一组公理体系，使一切数学命题在原则上都可由此经有限步推定真伪，这叫作公理体系的“完备性”。希尔伯特还要求公理体系保持“独立性”（即所有公理都是互相独立的，使公理系统尽可能地简洁）和“无矛盾性”（即相容性，不能从公理系统中导出矛盾）。

    当然，希尔伯特所说的公理不是我们通常认为的公理，而是经过了彻底的形式化，它们存在于一门叫作元数学的分支中。元数学与一般数学理论的关系有点像计算机中应用程序和普通文件的关系。

    希尔伯特的计划也确实有一定的进展，几乎全世界的数学家都乐观地看着数学大厦即将竣工。正当一切都越来越明朗之际，突然一声晴天霹雳。1931 年，在希尔伯特提出计划不到
    3 年，年轻的哥德尔就使希尔伯特的梦想变成了令人沮丧的噩梦。哥德尔证明：任何无矛盾的公理体系只要包含初等算术的陈述，则必定存在一个不可判定命题，用这组公理不能判定其真假。也就是说，“无矛盾性”和“完备性”是不能同时满足的！这便是闻名于世的哥德尔不完全性定理。


    ![](img/figure_0081_0053.jpg)

    哥德尔

    哥德尔，1906 年生于奥匈帝国的布尔诺，1924 年开始在维也纳大学攻读物理学，后来转到了数学系，1930 年获得博士学位。受他的老师、逻辑学家莫里茨·石里克的影响，他开始参加维也纳学派的活动，与石里克、卡尔纳普等哲学大师一起讨论科学理论、客观存在和真理之间的关系，这为他后来的研究与发现奠定了基础。

    1931 年，年轻的哥德尔做了一件他人生中轰动的事情，发表了一篇石破天惊的论文《数学原理及有关系统中的形式不可判定命题》。在论文中，他证明了哥德尔不完全性定理，即数论的所有一致的公理化形式系统都包含不可判定的命题。这篇论文对当时的数学家、逻辑学家和哲学家产生了震撼性的影响，可以说是
    20 世纪在逻辑学和数学基础方面最重要的一篇论文。当时，冯·诺依曼评价说：“哥德尔在现代逻辑中的成就是非凡的、不朽的，他的不朽甚至超过了纪念碑，他是一座里程碑，是永存的纪念碑。”

    1938 年，哥德尔又做了一件他人生中轰动的事情，和比他大 6 岁的曾经结过婚的夜总会女郎结婚。他们的婚姻遭到了哥德尔全家人的反对，但有情人终成眷属。也就是在那一年，他离开了维也纳，到美国普林斯顿高等研究院任职，后来加入美国国籍，成为该研究院的教授。在那里，哥德尔和爱因斯坦成了好朋友。其实，他俩的性格大相径庭，爱因斯坦开朗外向，哥德尔深沉内敛，但他们都在自己的领域做出了极为重大的贡献。他们都很聪明，有好奇心，性情直率。爱因斯坦的死对哥德尔的心情有巨大的打击。

    哥德尔不完全性定理一举粉碎了数学家 2000 年来的信念。他告诉我们，真与可证明是两个概念。可证明的一定是真的，但真的不一定可证明。在某种意义上，悖论的阴影将永远伴随着我们。无怪乎大数学家外尔发出这样的感叹：“上帝是存在的，因为数学无疑是相容的；魔鬼也是存在的，因为我们不能证明这种相容性。”

    但是，哥德尔不完全性定理的影响远远超出了数学的范畴。它不仅使数学和逻辑学发生了革命性的变化，引发了许多富有挑战性的问题，而且涉及哲学、语言学、计算机科学甚至宇宙学。2002
    年 8 月 17 日，著名的宇宙学家霍金在北京举行的国际弦理论会议上发表了题为《哥德尔与 M 理论》的报告，认为建立一个单一的描述宇宙的大统一理论是不太可能的，这一推测也正是基于哥德尔不完全性定理。

    有意思的是，在现今十分热门的人工智能领域，哥德尔不完全性定理是否适用也成为了人们争论的焦点。1961 年，牛津大学的哲学家卢卡斯提出，根据哥德尔不完全性定理，机器不可能具有人的心智。他的观点激起了很多人的反对。他们认为，哥德尔不完全性定理与机器有无心智没有关系，但哥德尔不完全性定理对人的限制同样也适用于机器倒是事实。

    哥德尔不完全性定理的影响如此之广泛，难怪哥德尔会被看作当代最有影响力的智慧巨人之一，受到人们的永恒怀念。美国《时代》杂志曾评选出 20 世纪 100 位最伟大的人物，在数学家中排在第一位的就是哥德尔。

    在人工智能即将进入突破阶段的今天，相信从牛顿到哥德尔这些数学大师的思想以及他们发明的各种精妙绝伦的数学理论和工具将启发和引领更多的天才去破解人类思维和机器学习最终的奥秘。


    ## 4.5 一代宗师杰弗里·辛顿

    在人工智能研究中，模拟人类大脑的神经网络技术自发明以后，其实一直不受待见，因为 20 世纪计算机的计算能力和存储空间都无法支持大数据的处理。一个人类大脑的神经网络有数以亿计的连接。如果一个人工神经网络要想接近人脑，每个人工神经元就必须达到
    1 万个大脑神经元的功能，这谈何容易呀！因此，美国在里根政府时期大幅削减了对人工智能特别是神经网络技术的支持，这让很多人工智能研究人员纷纷改行，更让一些研究神经网络技术的专家离开美国前往加拿大，后来成为神经网络技术一代宗师的杰弗里·辛顿就是其中之一。

    曾经任美国卡内基·梅隆大学教授的辛顿于 1947 年出生在英国。他出身于一个非常传奇的家族。他爷爷的外祖父就是伟大的数学家乔治·布尔，乔治·布尔的妻子名叫玛丽·埃沃莱斯特，是一位作家。玛丽·埃沃莱斯特的叔叔是乔治·埃沃莱斯特，他是英国著名的测绘学家和探险家，曾经担任过英国殖民地印度的测量局局长，领导了喜马拉雅山脉测量工作。辛顿的全名就是杰弗里·埃沃莱斯特·辛顿。当年他的家人给他命名埃沃莱斯特时，也许已经预言了他未来勇攀科学高峰的命运。


    ![](img/figure_0083_0054.jpg)

    辛顿

    辛顿从小就对人类的大脑是如何工作的十分着迷。他后来回忆说，上中学的时候，班里的一个同学忽悠他说，大脑的工作就像一张全息图。他当时信以为真，十分兴奋。辛顿进入剑桥大学学习心理学后意识到，科学家并没有真正理解大脑，他们并没有完全了解大脑是如何学习以及如何提升智力的。在辛顿看来，这些都是关乎人工智能研究梦想的大问题，他开始在剑桥大学和爱丁堡大学探索神经网络。1978
    年，辛顿从爱丁堡大学获得人工智能博士学位。毕业后，辛顿开始了他雄心勃勃的计划，利用计算机硬件和软件来模拟人类大脑，研究如何大幅度缩短训练人工神经网络所需要的时间，创建一种神经网络的机器学习方法。这是后来人们高度关注的深度学习。

    人工神经网络的一大难题，就是如何驾驭百万级乃至亿级神经元之间那庞大得如天文数字一般的组合关系。这一过程的关键是要将人工神经网络组织成为堆叠层。拿人脸识别来说，当一个人工神经网络中的一组特征被发现能够形成某种图案（比如说一只眼睛）时，这一结果就会被向上转移到该人工神经网络的另一层做进一步的分析。接下来的这一层可能会将两只眼睛拼在一起，将这一有意义的数据再传递到层级结构的第三层，该层可以将眼睛和鼻子的图像结合到一起进行分析。就这样一层一层地叠加，识别一张人脸可能需要数百万个这种节点，堆叠层可高达
    15 个层级。


    '
