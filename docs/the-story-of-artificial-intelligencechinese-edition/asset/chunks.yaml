- raw: '1986年，深度学习开始崭露头角。这一年，辛顿和另外两位教授在《自然》杂志上发表了重要论文《通过反向传播算法实现表征学习》，文中提出的反向传播算法大幅缩短了训练人工神经网络所需要的时间。辛顿发明的训练方法对20世纪50年代的人工神经网络进行了极大的改进，它从数学层面上优化每一层的结果，从而使人工神经网络在形成堆叠层时加快学习速度。直到30多年后的今天，反向传播算法仍然是训练人工神经网络的基本方法。


    然而，基于深层神经网络的深度学习并没有在学术界受到重视，研究人员发表文章和获取科研经费都比较困难。生不逢时的辛顿却默默坚守着自己的研究工作，还为此毅然移居加拿大，去多伦多大学任教。在那里，他培养了一大批优秀的学生，这里面就有后来在深度学习领域大名鼎鼎的延恩·乐存和约书亚·本吉奥。


    2004年，依靠来自加拿大高级研究所的资金支持，辛顿创立了“神经计算和自适应感知”项目。该项目的目的是创建一支世界一流的团队，致力于生物智能的模拟，也就是模拟大脑利用视觉、听觉和书面语言进行理解并对它的环境做出反应这一过程。辛顿精心挑选了研究人员，邀请了来自计算机科学、生物学、电子工程、神经科学、物理学和心理学等领域的专家参与该项目。他建立这样的跨学科合作项目对人工智能的研究是一个伟大的创举，定期参加项目研讨会的许多研究人员［比如杨立昆（Yann
    LeCun）、约书亚·本吉奥和吴恩达］后来都取得了非常突出的成就。最核心的是，这一团队系统地打造了一批更高效的深度学习算法。最终，他们的杰出成就推动了深度学习成为人工智能领域的主流方向。


    进入20世纪以后，计算机硬件突飞猛进的发展和互联网产生的海量数据让人工神经网络起死回生。2012年，在图形识别国际大赛上，辛顿率领加拿大多伦多大学的超视团队，在150万张图像识别竞赛中，以低于10%的错误率精准地识别出图像中的内容是动物、花、船还是人等，拔得头筹。同年，辛顿教授获得有“加拿大诺贝尔奖”之称的基廉奖，这是加拿大的国家最高科学奖。


    虽然时光晚至，但年过六十的辛顿老骥伏枥，不甘寂寞，和他的两个学生创办了一家专注于深度学习的公司。说是一家公司，实际上既无产品又无客户，只有3个深度学习领域的“牛人”和几篇论文。公司创立后不久，谷歌、微软和百度就争相前来收购，并“大打出手”，最后谷歌出价最高，打败竞争对手，把辛顿和他的两个学生收编到了自己的旗下。投入数千万美元就为“买下”3个人，业界为之惊叹。当年出走加拿大的辛顿也因此再度回到美国，他常常因为工作往返于加拿大和美国之间，成了当今最贵的科技“空中飞人”。


    # [第5章 人和机器的世纪大战](../contents/content.xhtml#toc31)


    ## [5.1 让机器与人下棋的魔术骗局](../contents/content.xhtml#toc32)


    下棋一直就是对人类智能的挑战，自然也成为了人工智能的标志。最早出现的下棋机器人叫“土耳其人”,1769年由德国发明家肯佩伦发明。因为当时土耳其那具有东方风情的服饰十分时髦，肯佩伦就把他发明的下棋机器人做成土耳其人的样子，以此夺人眼球。


    这个可以和人下棋的机器人不但轰动一时，成为当时整个欧洲的奇葩，而且引发了半个多世纪跨越欧美大陆的关注和讨论，成为一个嘲讽了许多名人大咖的世纪骗局。故事还要从它的发明人肯佩伦说起。


    ![](images/figure_0086_0055.jpg)


    肯佩伦画像


    肯佩伦生于1734年，他的父亲是德国皇室的一名海关官员。年轻时，他在维也纳学习哲学和法律，还作为一个艺术朝圣者去过意大利。在父亲的引荐下，他以自己英俊的相貌和才华获得了德国女皇玛丽娅的赏识，进入皇室效力。丰厚的收入和充裕的闲暇时间，让他在科学和机械方面的业余爱好得到了充分的发展。当时的欧洲正处于工业革命的背景下，人们对科学和机械充满了好奇和兴趣，就像我们今天对人工智能的好奇和兴趣一样。在以皇室为核心的上流社会中，各种新奇的发明和装置成为了人们茶余饭后的一大娱乐内容和科学活动的一个重要部分。可以自行游水、进食和扇动翅膀的机械鸭子，可以自动弹奏钢琴和吹奏长笛的机器人，这样的发明层出不穷，不仅给当时的人们带来了不断的惊奇，而且给他们带来了无穷的乐趣和想象。


    一次，在皇室成员观看新奇发明的表演中，女皇玛丽娅问坐在身边的肯佩伦，他觉得这些发明怎么样，肯佩伦不屑一顾地说，这些都是小招数，他可以做得更好更新奇。玛丽娅在惊讶之余竟然认真起来，因为她认为肯佩伦是一个说到做到、才华横溢的年轻人。她居然特准肯佩伦休6个月长假，回家专心发明一个与众不同的玩意儿来向整个欧洲炫耀德国的伟大。


    1770年春天，经过6个月鲜为人知的准备，肯佩伦终于公布了他发明的一个下棋机器人。首次表演当然是在以女皇玛丽娅为首的皇室成员面前。在灯光通明的表演大厅里，下棋机器人被推出了幕帘。这是一个由下面带有抽屉的长方形半高矮柜和坐在矮柜后面的一个土耳其人模样的木制机器人组成的复杂装置。当肯佩伦分别打开左右两侧的柜门时，可以看到里面的齿轮、杠杆等各种机械装置。柜面上是一个国际象棋的棋盘，机器人坐在棋盘的后面，一手撑在棋盘的一边，一手端着一根长长的烟斗。


    ![](images/figure_0087_0056.jpg)


    下棋机器人“土耳其人”


    十分善于表演的肯佩伦像节目主持人一样，他站在柜子的一边，大声宣布这个机器人可以和任何前来挑战它的棋手对弈。于是，有皇室成员自告奋勇上前一较高下。当机器人真的自动和上来对弈的人下起棋来时，大厅里的人无不惊讶万分，赞叹不绝。


    不久，消息就通过报纸和私人书信传遍整个欧洲。前来一探真假和比试高下的王公贵族和国际象棋大师们络绎不绝。肯佩伦名震欧洲，身价百倍。但这个神奇的下棋机器人也引来了当时无数的科学家、国际象棋大师和媒体人的疑惑和猜测，肯佩伦是如何让一个机械装置和真人实战对弈的呢？


    各种推论和假说层出不穷，但它们时而自相矛盾，经不起推敲；时而破绽百出，难以自圆其说，没有一个可以真正得到证实。直到肯佩伦去世，也没人能真正破解下棋机器人的秘密。


    肯佩伦在生前把这个下棋机器人卖给了德国发明家兼娱乐人马泽尔。1809年，马泽尔把它展示给拿破仑，并和这个不可一世的征服者对弈一局。机器人大胜，这让拿破仑恼羞成怒，他把棋盘上的棋子一把全都撸到地上。此后，马泽尔带着这个象棋机器人在欧洲巡演几十年，和各国高手过招，虽然有输有赢，但总体上赢多输少，名噪天下。后来他还带着机器人漂洋过海，来到美国和富兰克林对弈。


    在肯佩伦发明下棋机器人以后的85年间，这个机器人的足迹遍及欧美，和包括俄国沙皇在内的无数显赫人物、国际象棋大师对弈过。这一直是人们试图解开的一个世纪之谜。英国数学家、第一台机械式计算机的发明人巴贝奇就在小时候被这个机器人的神奇所吸引，他长大以后还有幸亲自和它对弈。虽然他也无法猜出其中的秘密，但他坚信机器下棋是完全可能的事情，还打算自己建造一台这样的机器。不过，当时他正忙于发明世界上第一台机械式计算机——分析机，没有多余的时间和精力做这件事。


    下棋机器人的秘密最终在1857年被揭开，这时马泽尔早已过世了。揭开这个世纪之谜的人是下棋机器人的最后一个主人的女儿。她在纽约发行的一份杂志《象棋月刊》上发表了题为《象棋老兵的终结》的系列文章，详细讲述了下棋机器人是如何和真人对弈的。


    其实秘密很简单，下棋机器人根本不能自动和任何人对弈。在半个多世纪的对弈表演中，和人下棋的是藏在柜子里的另一个真人棋手。如果说下棋机器人的发明有什么过人之处，那就是柜子的精巧设计和它的主人们的过人骗术。


    ![](images/figure_0089_0057.jpg)


    秘密所在


    一场世纪大骗局最终还是被揭穿了。幸好那些和它对过弈的王公权贵都早已离世，不然他们一定会为自己的愚蠢而恼羞成怒、无地自容。然而，人类对人工智能的追求没有因此而终止。人机对弈的梦想继续激励着无数科学家和发明家勇往直前，让机器战胜人类棋手的愿望最终得以实现。


    ## [5.2 跳棋中的机器学习](../contents/content.xhtml#toc33)


    为什么人们那么早就迷恋让机器下棋呢？人工智能大师明斯基曾经给出过简单而明确的答复。他说：“选择下棋和数学问题作为人工智能的研究对象不是因为它们简单明确，而是因为它们在一个很小的初始结构中蕴含了极其复杂的问题，从而能够在程序设计中以相对较小的转换来获得真正形式化的表达。”在一篇关于计算机下棋的早期论文中，另外两名人工智能大师西蒙和约翰·肖也提出：“如果一个人能够设计出一台成功的弈棋机，他似乎就渗入了人类智力活动的核心。”受这些大师的激励，无数计算机专业人士、国际棋手和业余爱好者开始研究和开发一代又一代的下棋系统，有些人追求胜负和奖金，更多的人则把下棋系统作为实验工具，研究人类智能的工作机制。


    20世纪40年代末，美国伊利诺伊大学的塞缪尔教授开始研究用计算机下跳棋。后来他加入了IBM公司的实验室，在IBM 701计算机上完成了他的第一个跳棋程序，并把它带到了达特茅斯学院的那场聚会上。从达特茅斯学院回来后，他不断改进他的程序，在1962年夏天打败了美国跳棋大师罗伯特·尼雷（一个盲人天才棋手）。轰动一时的消息让IBM公司的股票大涨十几个百分点，乐坏了IBM公司的老板托马斯·沃森。IBM公司后来一直是棋类程序开发的支持者和参与者。


    人类思考棋类问题的核心智慧就是找到妙招，而找到妙招的关键就是推算出若干步之内无论对方如何应对，自己都处于局面变好的态势。塞缪尔教授热衷于研究计算机下跳棋的目的是探索如何让计算机能够学习。他开发的跳棋程序的最大特点就是自学习功能，也就是今天机器学习的雏形。


    ![](images/figure_0090_0058.jpg)


    塞缪尔


    塞缪尔教授是如何让机器决定每一步中棋子的移动呢？塞缪尔教授考虑到一个跳棋的棋盘只有64（即8×8）个两种颜色相间的方格（棋子位置），可以采用一个树形结构来列出每一步中棋子移动的所有可能的情况，然后列出每一种可能情况的下一步可能出现的情况，这样一步一步地列出从开始的第一步到结束的最后一步的所有可能情况。这样，一个招法（下一步棋）向着后续招法分叉，形成了一个树形结构，称之为博弈树。这种方法全面生成所有可能的招法，并选择最优的一种走法，也就是尽可能对博弈树进行穷尽搜索，这样就可以做到胸有成竹。


    ![](images/figure_0091_0059.jpg)


    跳棋


    不过他马上发现，虽然这种方法在理论上可行，但实际上几乎是不可能实现的。因为这将涉及5×1020个位置，这简直就是一个天文数字，所以他只能走一步看几步。那么到底能够看几步呢？限于各种条件，一般来说只能看3～10步。可是在这3～10步中又该如何选择呢？塞缪尔教授采用了一种打分的办法。


    1944年，冯·诺依曼和经济学家摩根斯特恩合作出版过一本著名的书籍《博弈论》，书中提出了一种两人对弈的算法。塞缪尔教授参考这种算法，用一个评估函数给每一步打分，然后根据每一个可能的下一步得分的高低来决定怎么走。塞缪尔教授不是一步一步地计算，而是把3～10步内所有组合的计算分数累计起来，从中采用积分最高的路径走下一步。他还同时采用了另外一种方法，就是参照棋谱决定走棋步骤。学习下棋的人都知道，学习前人下过的经典棋谱是迅速提高棋艺、掌握成功妙招的最佳方法。熟记棋谱一百种，即使难赢也难输。


    ![](images/figure_0091_0060.jpg)


    舍佛


    塞缪尔教授的努力虽然名噪一时，但他的程序在与人的对弈中还是有赢有输。直到20世纪80年代末，最强的跳棋程序才由加拿大阿尔伯塔大学开发出来，开发人员给这款程序起了一个名字叫钦诺克。这个名字来自加拿大的一个冬季暖风的命名，大概寓意着他们的跳棋程序是当时人工智能研究低潮中的一股暖风。程序开发团队的带头人是该校计算机系教授谢弗。


    ![](images/figure_0092_0061.jpg)


    丁斯利


    自从20世纪50年代起，跳棋的人类冠军一直就是美国数学家丁斯利。丁斯利对跳棋理论深有研究，当他知道谢弗的钦诺克后，很想和它一较高下。美国、英国和加拿大的跳棋协会一直拒绝钦诺克参赛，也禁止作为协会冠军的丁斯利与之角逐。为了能和钦诺克下棋，丁斯利毅然放弃了他的冠军称号。1992年，丁斯利大战钦诺克，以4胜2负33平的成绩赢了钦诺克。


    谢弗团队不甘失败，两年以后在波士顿的计算机博物馆再次与丁斯利对战。经过两年改进的钦诺克大不一样，开局的6盘都把丁斯利逼和，第7局丁斯利以身体不适为由退出了比赛。不久，丁斯利就被诊断出患有胰腺癌。虽然后来他的病情有所好转，准备再次一战，但病情的突然恶化让他抱憾而去。从此，谢弗团队和他们的钦诺克只能“独孤求败”了。


    谢弗团队并没有因为钦诺克打遍天下无敌手而终止研究跳棋理论和相关实践。2007年，他们最终证明，在跳棋比赛中，只要双方不犯错误，最终都将是和棋。为了这个证明，他们付出了18年的努力，穷尽了跳棋全部的500995484682338672639种棋局位置，钦诺克也完善到了战无不胜的最高境地。在2007年9月的《科学》杂志上，他们自豪地宣布，跳棋的人机对弈历史结束了，人工智能大获全胜！


    于是人类开始向棋类的又一高峰进军，那就是国际象棋。和跳棋相比，国际象棋至少有1040种可能的位置，远远高于跳棋的复杂程度。不过，参加过达特茅斯学院聚会的人工智能大师西蒙在1957年宣称，10年内计算机就可以打败任何人类棋手。1965年，他再次宣称，20年内这个目标一定会实现。结果怎样呢？他的再一次预言到底实现了没有？这是我们要讲的另外一个故事。


    ## [5.3 游戏中的人工智能方法](../contents/content.xhtml#toc34)


    在人们研究人机博弈的过程中，美国的纽厄尔和西蒙提出了一种叫作“启发式搜索”的方法，该方法后来广泛用于解决计算机下棋问题。


    让我们先做个游戏吧。下图中有8个数字和一个空格，请利用空格来移动这8个数字，使它们从左面这种无序状态排列成右面这种有序状态。记住，只能通过空格进行移动。


    ![](images/figure_0093_0062.jpg)


    拼图游戏图示1


    也许大家认为这太简单了。那么让我们把这张图扩展成15个数字和一个空格，就像下图所示的那样，再试试看。如果我们继续把图扩展到99个数字和一个空格，这个游戏也许就没有那么简单了。大家有没有想过，如果让计算机来帮我们玩，计算机应该怎样做呢？


    ![](images/figure_0093_0063.jpg)


    拼图游戏图示2


    其实，这个游戏是人工智能研究中的一个非常著名的问题，叫作“玩具问题”，也称为“15格拼图游戏”。在早期研究这个问题的人之中，纽厄尔和西蒙针对这样一个看似简单的游戏，提出了他们解决这个问题的理论方法，并将其发展成解决这类问题的启发式搜索法。这种方法成为今天人工智能的一大技术。纽厄尔和西蒙的启发式搜索法是怎样的一种方法呢？


    首先，让我们来看看如何让计算机理解这个游戏，换句话说，就是如何在计算机上表示这个游戏。这里我们要介绍一种称为符号结构的计算机数据结构。在计算机上， 每一个字母和数字都可以看作一个符号，而多个符号可以组成一个列表，例如（A,7,Q）。这种符号和符号列表就是最简单的符号结构。复杂的符号结构可以是包括符号列表的列表，例如〈（B,3）,（A,7,Q）〉。这种符号结构可以复杂到多层嵌套，从而可以表达更复杂的问题。


    用这样的符号结构来表达问题，解决问题就变成了寻找一种或多种方法来把一种符号结构（问题表达的初始结构）转换成另一种符号结构（问题解决的答案结构）。利用纽厄尔和西蒙提出的方法，我们先用符号结构把我们的游戏表示出来。开始时游戏的符号结构可以表示成〈（2,8,3）,（1,6,4）,（7，空，
    5）〉，游戏完成后的符号结构应该是〈（1,2,3）,（8，空，4）,（7,6,5）〉。现在就是要通过符号结构的变换，从初始结构达到最终结构。


    从初始结构开始，我们有3种可能的变换：〈（2,8,3）,（1,6,4）,（空， 7,5）〉,〈（2,8,3）,（1,6,4）,（7,5，空）〉和〈（2,8,3）,（1，空，4）,
    （7,6,5）〉。显而易见，它们都不是我们所要的最终结果，所以我们会继续在此基础上一直这样变换下去，直到出现我们所需要的结果为止。我们可以把这个变换过程用一幅像树一样的结构图表示出来，如下页中的图所示。我们把这种结构图称为搜索树。可以想象，当问题复杂的时候，这样的搜索会无限扩展下去，搜索树也会蔓延开来，成为一棵可能失控的“参天大树”。这时纽厄尔和西蒙就提出了启发式搜索法，简单地说，这种方法就是在转换中使用一些限制条件，只保留最接近结果的转换过程。


    ![](images/figure_0095_0064.jpg)


    搜索树


    在我们的游戏中，转换可以看成在生成的树杈下继续扩展。为了防止无限蔓延，按照纽厄尔和西蒙的启发式搜索法，我们应该把扩展限制在可能最接近结果的树杈上进行。一种这样的启发式搜索是我们只扩展那些和结果比有最少可能情况的树杈。当然这不是唯一的方法，也不能保证一定能够得到最终结果。但一旦成功，这就会是最佳方法。也许大家可以发现其他的启发式搜索法，有兴趣的话，可以动动脑筋，毕竟我们的游戏比较简单。


    我们已经看到了，这样一个简单的游戏里竟然蕴藏着这么深刻的人工智能技术理论。其实，许多人工智能问题的初始既不神秘，也没有那么高深莫测，很多问题和方法都来自我们对生活和常识的深入思考和进一步的理论研究。今天，人工智能研究人员和科学家正在继续探索如何更好地在人工智能领域表达现实中的问题，特别是如何让人工智能系统自我产生出它自己对问题的表达，因为他们发现如何表达一个问题对解决这个问题来说至关重要。


    另一位研究过人机博弈的人工智能大师香农把棋盘定义为二维数组，每个棋子都有一个对应的计算机子程序，计算棋子所有可能的走法，最后用一个评估函数对各种情况下的走法进行综合评估。


    达特茅斯学院聚会的发起人麦卡锡也曾对如何控制一棵搜索树的无限增长提出过一种修枝剪杈的方法，称之为α-β剪枝术。采用动态计算评估函数，一边生成博弈树一边计算评估函数。当评估函数的值超越给定的上界和下界时，搜索过程就停止，这样大大减小了搜索树的规模。


    在探索人工智能的道路上，英雄辈出，永无止境。虽然西蒙对国际象棋的预言一再落空，但人类探索的脚步并没有因此而停止。1997年，IBM公司的“深蓝”机器人两次大胜国际象棋世界冠军卡斯帕罗夫，宣布了机器最终在国际象棋上战胜了人类，让西蒙的预言在40年后得以实现。


    ## [5.4 “深蓝”大战国际象棋世界冠军卡斯帕罗夫](../contents/content.xhtml#toc35)


    1997年5月11日，是人机挑战赛历史上的又一个具有划时代意义的时刻。IBM公司研制的超级计算机“深蓝”在正常时限的比赛中首次击败了等级分排名世界第一的棋手加里·卡斯帕罗夫。机器的胜利标志着国际象棋的历史进入新时代。


    “深蓝”重达1270千克，有32个“大脑”（微处理器），每秒可以计算2亿步招数。“深蓝”还“背下”（存储）了100多年来优秀棋手对弈的200多万个棋局。'
  fmt: '

    1986年，深度学习开始崭露头角。这一年，辛顿和另外两位教授在《自然》杂志上发表了重要论文《通过反向传播算法实现表征学习》，文中提出的反向传播算法大幅缩短了训练人工神经网络所需要的时间。辛顿发明的训练方法对20世纪50年代的人工神经网络进行了极大的改进，它从数学层面上优化每一层的结果，从而使人工神经网络在形成堆叠层时加快学习速度。直到30多年后的今天，反向传播算法仍然是训练人工神经网络的基本方法。


    然而，基于深层神经网络的深度学习并没有在学术界受到重视，研究人员发表文章和获取科研经费都比较困难。生不逢时的辛顿却默默坚守着自己的研究工作，还为此毅然移居加拿大，去多伦多大学任教。在那里，他培养了一大批优秀的学生，这里面就有后来在深度学习领域大名鼎鼎的延恩·乐存和约书亚·本吉奥。


    2004年，依靠来自加拿大高级研究所的资金支持，辛顿创立了“神经计算和自适应感知”项目。该项目的目的是创建一支世界一流的团队，致力于生物智能的模拟，也就是模拟大脑利用视觉、听觉和书面语言进行理解并对它的环境做出反应这一过程。辛顿精心挑选了研究人员，邀请了来自计算机科学、生物学、电子工程、神经科学、物理学和心理学等领域的专家参与该项目。他建立这样的跨学科合作项目对人工智能的研究是一个伟大的创举，定期参加项目研讨会的许多研究人员［比如杨立昆（Yann
    LeCun）、约书亚·本吉奥和吴恩达］后来都取得了非常突出的成就。最核心的是，这一团队系统地打造了一批更高效的深度学习算法。最终，他们的杰出成就推动了深度学习成为人工智能领域的主流方向。


    进入20世纪以后，计算机硬件突飞猛进的发展和互联网产生的海量数据让人工神经网络起死回生。2012年，在图形识别国际大赛上，辛顿率领加拿大多伦多大学的超视团队，在150万张图像识别竞赛中，以低于10%的错误率精准地识别出图像中的内容是动物、花、船还是人等，拔得头筹。同年，辛顿教授获得有“加拿大诺贝尔奖”之称的基廉奖，这是加拿大的国家最高科学奖。


    虽然时光晚至，但年过六十的辛顿老骥伏枥，不甘寂寞，和他的两个学生创办了一家专注于深度学习的公司。说是一家公司，实际上既无产品又无客户，只有3个深度学习领域的“牛人”和几篇论文。公司创立后不久，谷歌、微软和百度就争相前来收购，并“大打出手”，最后谷歌出价最高，打败竞争对手，把辛顿和他的两个学生收编到了自己的旗下。投入数千万美元就为“买下”3个人，业界为之惊叹。当年出走加拿大的辛顿也因此再度回到美国，他常常因为工作往返于加拿大和美国之间，成了当今最贵的科技“空中飞人”。


    # [第5章 人和机器的世纪大战](../contents/content.xhtml#toc31)


    ## [5.1 让机器与人下棋的魔术骗局](../contents/content.xhtml#toc32)


    下棋一直就是对人类智能的挑战，自然也成为了人工智能的标志。最早出现的下棋机器人叫“土耳其人”,1769年由德国发明家肯佩伦发明。因为当时土耳其那具有东方风情的服饰十分时髦，肯佩伦就把他发明的下棋机器人做成土耳其人的样子，以此夺人眼球。


    这个可以和人下棋的机器人不但轰动一时，成为当时整个欧洲的奇葩，而且引发了半个多世纪跨越欧美大陆的关注和讨论，成为一个嘲讽了许多名人大咖的世纪骗局。故事还要从它的发明人肯佩伦说起。


    ![](images/figure_0086_0055.jpg)


    肯佩伦画像


    肯佩伦生于1734年，他的父亲是德国皇室的一名海关官员。年轻时，他在维也纳学习哲学和法律，还作为一个艺术朝圣者去过意大利。在父亲的引荐下，他以自己英俊的相貌和才华获得了德国女皇玛丽娅的赏识，进入皇室效力。丰厚的收入和充裕的闲暇时间，让他在科学和机械方面的业余爱好得到了充分的发展。当时的欧洲正处于工业革命的背景下，人们对科学和机械充满了好奇和兴趣，就像我们今天对人工智能的好奇和兴趣一样。在以皇室为核心的上流社会中，各种新奇的发明和装置成为了人们茶余饭后的一大娱乐内容和科学活动的一个重要部分。可以自行游水、进食和扇动翅膀的机械鸭子，可以自动弹奏钢琴和吹奏长笛的机器人，这样的发明层出不穷，不仅给当时的人们带来了不断的惊奇，而且给他们带来了无穷的乐趣和想象。


    一次，在皇室成员观看新奇发明的表演中，女皇玛丽娅问坐在身边的肯佩伦，他觉得这些发明怎么样，肯佩伦不屑一顾地说，这些都是小招数，他可以做得更好更新奇。玛丽娅在惊讶之余竟然认真起来，因为她认为肯佩伦是一个说到做到、才华横溢的年轻人。她居然特准肯佩伦休6个月长假，回家专心发明一个与众不同的玩意儿来向整个欧洲炫耀德国的伟大。


    1770年春天，经过6个月鲜为人知的准备，肯佩伦终于公布了他发明的一个下棋机器人。首次表演当然是在以女皇玛丽娅为首的皇室成员面前。在灯光通明的表演大厅里，下棋机器人被推出了幕帘。这是一个由下面带有抽屉的长方形半高矮柜和坐在矮柜后面的一个土耳其人模样的木制机器人组成的复杂装置。当肯佩伦分别打开左右两侧的柜门时，可以看到里面的齿轮、杠杆等各种机械装置。柜面上是一个国际象棋的棋盘，机器人坐在棋盘的后面，一手撑在棋盘的一边，一手端着一根长长的烟斗。


    ![](images/figure_0087_0056.jpg)


    下棋机器人“土耳其人”


    十分善于表演的肯佩伦像节目主持人一样，他站在柜子的一边，大声宣布这个机器人可以和任何前来挑战它的棋手对弈。于是，有皇室成员自告奋勇上前一较高下。当机器人真的自动和上来对弈的人下起棋来时，大厅里的人无不惊讶万分，赞叹不绝。


    不久，消息就通过报纸和私人书信传遍整个欧洲。前来一探真假和比试高下的王公贵族和国际象棋大师们络绎不绝。肯佩伦名震欧洲，身价百倍。但这个神奇的下棋机器人也引来了当时无数的科学家、国际象棋大师和媒体人的疑惑和猜测，肯佩伦是如何让一个机械装置和真人实战对弈的呢？


    各种推论和假说层出不穷，但它们时而自相矛盾，经不起推敲；时而破绽百出，难以自圆其说，没有一个可以真正得到证实。直到肯佩伦去世，也没人能真正破解下棋机器人的秘密。


    肯佩伦在生前把这个下棋机器人卖给了德国发明家兼娱乐人马泽尔。1809年，马泽尔把它展示给拿破仑，并和这个不可一世的征服者对弈一局。机器人大胜，这让拿破仑恼羞成怒，他把棋盘上的棋子一把全都撸到地上。此后，马泽尔带着这个象棋机器人在欧洲巡演几十年，和各国高手过招，虽然有输有赢，但总体上赢多输少，名噪天下。后来他还带着机器人漂洋过海，来到美国和富兰克林对弈。


    在肯佩伦发明下棋机器人以后的85年间，这个机器人的足迹遍及欧美，和包括俄国沙皇在内的无数显赫人物、国际象棋大师对弈过。这一直是人们试图解开的一个世纪之谜。英国数学家、第一台机械式计算机的发明人巴贝奇就在小时候被这个机器人的神奇所吸引，他长大以后还有幸亲自和它对弈。虽然他也无法猜出其中的秘密，但他坚信机器下棋是完全可能的事情，还打算自己建造一台这样的机器。不过，当时他正忙于发明世界上第一台机械式计算机——分析机，没有多余的时间和精力做这件事。


    下棋机器人的秘密最终在1857年被揭开，这时马泽尔早已过世了。揭开这个世纪之谜的人是下棋机器人的最后一个主人的女儿。她在纽约发行的一份杂志《象棋月刊》上发表了题为《象棋老兵的终结》的系列文章，详细讲述了下棋机器人是如何和真人对弈的。


    其实秘密很简单，下棋机器人根本不能自动和任何人对弈。在半个多世纪的对弈表演中，和人下棋的是藏在柜子里的另一个真人棋手。如果说下棋机器人的发明有什么过人之处，那就是柜子的精巧设计和它的主人们的过人骗术。


    ![](images/figure_0089_0057.jpg)


    秘密所在


    一场世纪大骗局最终还是被揭穿了。幸好那些和它对过弈的王公权贵都早已离世，不然他们一定会为自己的愚蠢而恼羞成怒、无地自容。然而，人类对人工智能的追求没有因此而终止。人机对弈的梦想继续激励着无数科学家和发明家勇往直前，让机器战胜人类棋手的愿望最终得以实现。


    ## [5.2 跳棋中的机器学习](../contents/content.xhtml#toc33)


    为什么人们那么早就迷恋让机器下棋呢？人工智能大师明斯基曾经给出过简单而明确的答复。他说：“选择下棋和数学问题作为人工智能的研究对象不是因为它们简单明确，而是因为它们在一个很小的初始结构中蕴含了极其复杂的问题，从而能够在程序设计中以相对较小的转换来获得真正形式化的表达。”在一篇关于计算机下棋的早期论文中，另外两名人工智能大师西蒙和约翰·肖也提出：“如果一个人能够设计出一台成功的弈棋机，他似乎就渗入了人类智力活动的核心。”受这些大师的激励，无数计算机专业人士、国际棋手和业余爱好者开始研究和开发一代又一代的下棋系统，有些人追求胜负和奖金，更多的人则把下棋系统作为实验工具，研究人类智能的工作机制。


    20世纪40年代末，美国伊利诺伊大学的塞缪尔教授开始研究用计算机下跳棋。后来他加入了IBM公司的实验室，在IBM 701计算机上完成了他的第一个跳棋程序，并把它带到了达特茅斯学院的那场聚会上。从达特茅斯学院回来后，他不断改进他的程序，在1962年夏天打败了美国跳棋大师罗伯特·尼雷（一个盲人天才棋手）。轰动一时的消息让IBM公司的股票大涨十几个百分点，乐坏了IBM公司的老板托马斯·沃森。IBM公司后来一直是棋类程序开发的支持者和参与者。


    人类思考棋类问题的核心智慧就是找到妙招，而找到妙招的关键就是推算出若干步之内无论对方如何应对，自己都处于局面变好的态势。塞缪尔教授热衷于研究计算机下跳棋的目的是探索如何让计算机能够学习。他开发的跳棋程序的最大特点就是自学习功能，也就是今天机器学习的雏形。


    ![](images/figure_0090_0058.jpg)


    塞缪尔


    塞缪尔教授是如何让机器决定每一步中棋子的移动呢？塞缪尔教授考虑到一个跳棋的棋盘只有64（即8×8）个两种颜色相间的方格（棋子位置），可以采用一个树形结构来列出每一步中棋子移动的所有可能的情况，然后列出每一种可能情况的下一步可能出现的情况，这样一步一步地列出从开始的第一步到结束的最后一步的所有可能情况。这样，一个招法（下一步棋）向着后续招法分叉，形成了一个树形结构，称之为博弈树。这种方法全面生成所有可能的招法，并选择最优的一种走法，也就是尽可能对博弈树进行穷尽搜索，这样就可以做到胸有成竹。


    ![](images/figure_0091_0059.jpg)


    跳棋


    不过他马上发现，虽然这种方法在理论上可行，但实际上几乎是不可能实现的。因为这将涉及5×1020个位置，这简直就是一个天文数字，所以他只能走一步看几步。那么到底能够看几步呢？限于各种条件，一般来说只能看3～10步。可是在这3～10步中又该如何选择呢？塞缪尔教授采用了一种打分的办法。


    1944年，冯·诺依曼和经济学家摩根斯特恩合作出版过一本著名的书籍《博弈论》，书中提出了一种两人对弈的算法。塞缪尔教授参考这种算法，用一个评估函数给每一步打分，然后根据每一个可能的下一步得分的高低来决定怎么走。塞缪尔教授不是一步一步地计算，而是把3～10步内所有组合的计算分数累计起来，从中采用积分最高的路径走下一步。他还同时采用了另外一种方法，就是参照棋谱决定走棋步骤。学习下棋的人都知道，学习前人下过的经典棋谱是迅速提高棋艺、掌握成功妙招的最佳方法。熟记棋谱一百种，即使难赢也难输。


    ![](images/figure_0091_0060.jpg)


    舍佛


    塞缪尔教授的努力虽然名噪一时，但他的程序在与人的对弈中还是有赢有输。直到20世纪80年代末，最强的跳棋程序才由加拿大阿尔伯塔大学开发出来，开发人员给这款程序起了一个名字叫钦诺克。这个名字来自加拿大的一个冬季暖风的命名，大概寓意着他们的跳棋程序是当时人工智能研究低潮中的一股暖风。程序开发团队的带头人是该校计算机系教授谢弗。


    ![](images/figure_0092_0061.jpg)


    丁斯利


    自从20世纪50年代起，跳棋的人类冠军一直就是美国数学家丁斯利。丁斯利对跳棋理论深有研究，当他知道谢弗的钦诺克后，很想和它一较高下。美国、英国和加拿大的跳棋协会一直拒绝钦诺克参赛，也禁止作为协会冠军的丁斯利与之角逐。为了能和钦诺克下棋，丁斯利毅然放弃了他的冠军称号。1992年，丁斯利大战钦诺克，以4胜2负33平的成绩赢了钦诺克。


    谢弗团队不甘失败，两年以后在波士顿的计算机博物馆再次与丁斯利对战。经过两年改进的钦诺克大不一样，开局的6盘都把丁斯利逼和，第7局丁斯利以身体不适为由退出了比赛。不久，丁斯利就被诊断出患有胰腺癌。虽然后来他的病情有所好转，准备再次一战，但病情的突然恶化让他抱憾而去。从此，谢弗团队和他们的钦诺克只能“独孤求败”了。


    谢弗团队并没有因为钦诺克打遍天下无敌手而终止研究跳棋理论和相关实践。2007年，他们最终证明，在跳棋比赛中，只要双方不犯错误，最终都将是和棋。为了这个证明，他们付出了18年的努力，穷尽了跳棋全部的500995484682338672639种棋局位置，钦诺克也完善到了战无不胜的最高境地。在2007年9月的《科学》杂志上，他们自豪地宣布，跳棋的人机对弈历史结束了，人工智能大获全胜！


    于是人类开始向棋类的又一高峰进军，那就是国际象棋。和跳棋相比，国际象棋至少有1040种可能的位置，远远高于跳棋的复杂程度。不过，参加过达特茅斯学院聚会的人工智能大师西蒙在1957年宣称，10年内计算机就可以打败任何人类棋手。1965年，他再次宣称，20年内这个目标一定会实现。结果怎样呢？他的再一次预言到底实现了没有？这是我们要讲的另外一个故事。


    ## [5.3 游戏中的人工智能方法](../contents/content.xhtml#toc34)


    在人们研究人机博弈的过程中，美国的纽厄尔和西蒙提出了一种叫作“启发式搜索”的方法，该方法后来广泛用于解决计算机下棋问题。


    让我们先做个游戏吧。下图中有8个数字和一个空格，请利用空格来移动这8个数字，使它们从左面这种无序状态排列成右面这种有序状态。记住，只能通过空格进行移动。


    ![](images/figure_0093_0062.jpg)


    拼图游戏图示1


    也许大家认为这太简单了。那么让我们把这张图扩展成15个数字和一个空格，就像下图所示的那样，再试试看。如果我们继续把图扩展到99个数字和一个空格，这个游戏也许就没有那么简单了。大家有没有想过，如果让计算机来帮我们玩，计算机应该怎样做呢？


    ![](images/figure_0093_0063.jpg)


    拼图游戏图示2


    其实，这个游戏是人工智能研究中的一个非常著名的问题，叫作“玩具问题”，也称为“15格拼图游戏”。在早期研究这个问题的人之中，纽厄尔和西蒙针对这样一个看似简单的游戏，提出了他们解决这个问题的理论方法，并将其发展成解决这类问题的启发式搜索法。这种方法成为今天人工智能的一大技术。纽厄尔和西蒙的启发式搜索法是怎样的一种方法呢？


    首先，让我们来看看如何让计算机理解这个游戏，换句话说，就是如何在计算机上表示这个游戏。这里我们要介绍一种称为符号结构的计算机数据结构。在计算机上， 每一个字母和数字都可以看作一个符号，而多个符号可以组成一个列表，例如（A,7,Q）。这种符号和符号列表就是最简单的符号结构。复杂的符号结构可以是包括符号列表的列表，例如〈（B,3）,（A,7,Q）〉。这种符号结构可以复杂到多层嵌套，从而可以表达更复杂的问题。


    用这样的符号结构来表达问题，解决问题就变成了寻找一种或多种方法来把一种符号结构（问题表达的初始结构）转换成另一种符号结构（问题解决的答案结构）。利用纽厄尔和西蒙提出的方法，我们先用符号结构把我们的游戏表示出来。开始时游戏的符号结构可以表示成〈（2,8,3）,（1,6,4）,（7，空，
    5）〉，游戏完成后的符号结构应该是〈（1,2,3）,（8，空，4）,（7,6,5）〉。现在就是要通过符号结构的变换，从初始结构达到最终结构。


    从初始结构开始，我们有3种可能的变换：〈（2,8,3）,（1,6,4）,（空， 7,5）〉,〈（2,8,3）,（1,6,4）,（7,5，空）〉和〈（2,8,3）,（1，空，4）,
    （7,6,5）〉。显而易见，它们都不是我们所要的最终结果，所以我们会继续在此基础上一直这样变换下去，直到出现我们所需要的结果为止。我们可以把这个变换过程用一幅像树一样的结构图表示出来，如下页中的图所示。我们把这种结构图称为搜索树。可以想象，当问题复杂的时候，这样的搜索会无限扩展下去，搜索树也会蔓延开来，成为一棵可能失控的“参天大树”。这时纽厄尔和西蒙就提出了启发式搜索法，简单地说，这种方法就是在转换中使用一些限制条件，只保留最接近结果的转换过程。


    ![](images/figure_0095_0064.jpg)


    搜索树


    在我们的游戏中，转换可以看成在生成的树杈下继续扩展。为了防止无限蔓延，按照纽厄尔和西蒙的启发式搜索法，我们应该把扩展限制在可能最接近结果的树杈上进行。一种这样的启发式搜索是我们只扩展那些和结果比有最少可能情况的树杈。当然这不是唯一的方法，也不能保证一定能够得到最终结果。但一旦成功，这就会是最佳方法。也许大家可以发现其他的启发式搜索法，有兴趣的话，可以动动脑筋，毕竟我们的游戏比较简单。


    我们已经看到了，这样一个简单的游戏里竟然蕴藏着这么深刻的人工智能技术理论。其实，许多人工智能问题的初始既不神秘，也没有那么高深莫测，很多问题和方法都来自我们对生活和常识的深入思考和进一步的理论研究。今天，人工智能研究人员和科学家正在继续探索如何更好地在人工智能领域表达现实中的问题，特别是如何让人工智能系统自我产生出它自己对问题的表达，因为他们发现如何表达一个问题对解决这个问题来说至关重要。


    另一位研究过人机博弈的人工智能大师香农把棋盘定义为二维数组，每个棋子都有一个对应的计算机子程序，计算棋子所有可能的走法，最后用一个评估函数对各种情况下的走法进行综合评估。


    达特茅斯学院聚会的发起人麦卡锡也曾对如何控制一棵搜索树的无限增长提出过一种修枝剪杈的方法，称之为α-β剪枝术。采用动态计算评估函数，一边生成博弈树一边计算评估函数。当评估函数的值超越给定的上界和下界时，搜索过程就停止，这样大大减小了搜索树的规模。


    在探索人工智能的道路上，英雄辈出，永无止境。虽然西蒙对国际象棋的预言一再落空，但人类探索的脚步并没有因此而停止。1997年，IBM公司的“深蓝”机器人两次大胜国际象棋世界冠军卡斯帕罗夫，宣布了机器最终在国际象棋上战胜了人类，让西蒙的预言在40年后得以实现。


    ## [5.4 “深蓝”大战国际象棋世界冠军卡斯帕罗夫](../contents/content.xhtml#toc35)


    1997年5月11日，是人机挑战赛历史上的又一个具有划时代意义的时刻。IBM公司研制的超级计算机“深蓝”在正常时限的比赛中首次击败了等级分排名世界第一的棋手加里·卡斯帕罗夫。机器的胜利标志着国际象棋的历史进入新时代。


    “深蓝”重达1270千克，有32个“大脑”（微处理器），每秒可以计算2亿步招数。“深蓝”还“背下”（存储）了100多年来优秀棋手对弈的200多万个棋局。

    '
  trans: '


    1986 年，深度学习开始崭露头角。这一年，辛顿和另外两位教授在《自然》杂志上发表了重要论文《通过反向传播算法实现表征学习》，文中提出的反向传播算法大幅缩短了训练人工神经网络所需要的时间。辛顿发明的训练方法对
    20 世纪 50 年代的人工神经网络进行了极大的改进，它从数学层面上优化每一层的结果，从而使人工神经网络在形成堆叠层时加快学习速度。直到 30 多年后的今天，反向传播算法仍然是训练人工神经网络的基本方法。


    然而，基于深层神经网络的深度学习并没有在学术界受到重视，研究人员发表文章和获取科研经费都比较困难。生不逢时的辛顿却默默坚守着自己的研究工作，还为此毅然移居加拿大，去多伦多大学任教。在那里，他培养了一大批优秀的学生，这里面就有后来在深度学习领域大名鼎鼎的延恩·乐存和约书亚·本吉奥。


    2004 年，依靠来自加拿大高级研究所的资金支持，辛顿创立了“神经计算和自适应感知”项目。该项目的目的是创建一支世界一流的团队，致力于生物智能的模拟，也就是模拟大脑利用视觉、听觉和书面语言进行理解并对它的环境做出反应这一过程。辛顿精心挑选了研究人员，邀请了来自计算机科学、生物学、电子工程、神经科学、物理学和心理学等领域的专家参与该项目。他建立这样的跨学科合作项目对人工智能的研究是一个伟大的创举，定期参加项目研讨会的许多研究人员［比如杨立昆（Yann
    LeCun）、约书亚·本吉奥和吴恩达］后来都取得了非常突出的成就。最核心的是，这一团队系统地打造了一批更高效的深度学习算法。最终，他们的杰出成就推动了深度学习成为人工智能领域的主流方向。


    进入 20 世纪以后，计算机硬件突飞猛进的发展和互联网产生的海量数据让人工神经网络起死回生。2012 年，在图形识别国际大赛上，辛顿率领加拿大多伦多大学的超视团队，在
    150 万张图像识别竞赛中，以低于 10%的错误率精准地识别出图像中的内容是动物、花、船还是人等，拔得头筹。同年，辛顿教授获得有“加拿大诺贝尔奖”之称的基廉奖，这是加拿大的国家最高科学奖。


    虽然时光晚至，但年过六十的辛顿老骥伏枥，不甘寂寞，和他的两个学生创办了一家专注于深度学习的公司。说是一家公司，实际上既无产品又无客户，只有 3 个深度学习领域的“牛人”和几篇论文。公司创立后不久，谷歌、微软和百度就争相前来收购，并“大打出手”，最后谷歌出价最高，打败竞争对手，把辛顿和他的两个学生收编到了自己的旗下。投入数千万美元就为“买下”3
    个人，业界为之惊叹。当年出走加拿大的辛顿也因此再度回到美国，他常常因为工作往返于加拿大和美国之间，成了当今最贵的科技“空中飞人”。


    # 第 5 章 人和机器的世纪大战


    ## 5.1 让机器与人下棋的魔术骗局


    下棋一直就是对人类智能的挑战，自然也成为了人工智能的标志。最早出现的下棋机器人叫“土耳其人”,1769 年由德国发明家肯佩伦发明。因为当时土耳其那具有东方风情的服饰十分时髦，肯佩伦就把他发明的下棋机器人做成土耳其人的样子，以此夺人眼球。


    这个可以和人下棋的机器人不但轰动一时，成为当时整个欧洲的奇葩，而且引发了半个多世纪跨越欧美大陆的关注和讨论，成为一个嘲讽了许多名人大咖的世纪骗局。故事还要从它的发明人肯佩伦说起。


    ![](img/figure_0086_0055.jpg)


    肯佩伦画像


    肯佩伦生于 1734 年，他的父亲是德国皇室的一名海关官员。年轻时，他在维也纳学习哲学和法律，还作为一个艺术朝圣者去过意大利。在父亲的引荐下，他以自己英俊的相貌和才华获得了德国女皇玛丽娅的赏识，进入皇室效力。丰厚的收入和充裕的闲暇时间，让他在科学和机械方面的业余爱好得到了充分的发展。当时的欧洲正处于工业革命的背景下，人们对科学和机械充满了好奇和兴趣，就像我们今天对人工智能的好奇和兴趣一样。在以皇室为核心的上流社会中，各种新奇的发明和装置成为了人们茶余饭后的一大娱乐内容和科学活动的一个重要部分。可以自行游水、进食和扇动翅膀的机械鸭子，可以自动弹奏钢琴和吹奏长笛的机器人，这样的发明层出不穷，不仅给当时的人们带来了不断的惊奇，而且给他们带来了无穷的乐趣和想象。


    一次，在皇室成员观看新奇发明的表演中，女皇玛丽娅问坐在身边的肯佩伦，他觉得这些发明怎么样，肯佩伦不屑一顾地说，这些都是小招数，他可以做得更好更新奇。玛丽娅在惊讶之余竟然认真起来，因为她认为肯佩伦是一个说到做到、才华横溢的年轻人。她居然特准肯佩伦休
    6 个月长假，回家专心发明一个与众不同的玩意儿来向整个欧洲炫耀德国的伟大。


    1770 年春天，经过 6 个月鲜为人知的准备，肯佩伦终于公布了他发明的一个下棋机器人。首次表演当然是在以女皇玛丽娅为首的皇室成员面前。在灯光通明的表演大厅里，下棋机器人被推出了幕帘。这是一个由下面带有抽屉的长方形半高矮柜和坐在矮柜后面的一个土耳其人模样的木制机器人组成的复杂装置。当肯佩伦分别打开左右两侧的柜门时，可以看到里面的齿轮、杠杆等各种机械装置。柜面上是一个国际象棋的棋盘，机器人坐在棋盘的后面，一手撑在棋盘的一边，一手端着一根长长的烟斗。


    ![](img/figure_0087_0056.jpg)


    下棋机器人“土耳其人”


    十分善于表演的肯佩伦像节目主持人一样，他站在柜子的一边，大声宣布这个机器人可以和任何前来挑战它的棋手对弈。于是，有皇室成员自告奋勇上前一较高下。当机器人真的自动和上来对弈的人下起棋来时，大厅里的人无不惊讶万分，赞叹不绝。


    不久，消息就通过报纸和私人书信传遍整个欧洲。前来一探真假和比试高下的王公贵族和国际象棋大师们络绎不绝。肯佩伦名震欧洲，身价百倍。但这个神奇的下棋机器人也引来了当时无数的科学家、国际象棋大师和媒体人的疑惑和猜测，肯佩伦是如何让一个机械装置和真人实战对弈的呢？


    各种推论和假说层出不穷，但它们时而自相矛盾，经不起推敲；时而破绽百出，难以自圆其说，没有一个可以真正得到证实。直到肯佩伦去世，也没人能真正破解下棋机器人的秘密。


    肯佩伦在生前把这个下棋机器人卖给了德国发明家兼娱乐人马泽尔。1809 年，马泽尔把它展示给拿破仑，并和这个不可一世的征服者对弈一局。机器人大胜，这让拿破仑恼羞成怒，他把棋盘上的棋子一把全都撸到地上。此后，马泽尔带着这个象棋机器人在欧洲巡演几十年，和各国高手过招，虽然有输有赢，但总体上赢多输少，名噪天下。后来他还带着机器人漂洋过海，来到美国和富兰克林对弈。


    在肯佩伦发明下棋机器人以后的 85 年间，这个机器人的足迹遍及欧美，和包括俄国沙皇在内的无数显赫人物、国际象棋大师对弈过。这一直是人们试图解开的一个世纪之谜。英国数学家、第一台机械式计算机的发明人巴贝奇就在小时候被这个机器人的神奇所吸引，他长大以后还有幸亲自和它对弈。虽然他也无法猜出其中的秘密，但他坚信机器下棋是完全可能的事情，还打算自己建造一台这样的机器。不过，当时他正忙于发明世界上第一台机械式计算机——分析机，没有多余的时间和精力做这件事。


    下棋机器人的秘密最终在 1857 年被揭开，这时马泽尔早已过世了。揭开这个世纪之谜的人是下棋机器人的最后一个主人的女儿。她在纽约发行的一份杂志《象棋月刊》上发表了题为《象棋老兵的终结》的系列文章，详细讲述了下棋机器人是如何和真人对弈的。


    其实秘密很简单，下棋机器人根本不能自动和任何人对弈。在半个多世纪的对弈表演中，和人下棋的是藏在柜子里的另一个真人棋手。如果说下棋机器人的发明有什么过人之处，那就是柜子的精巧设计和它的主人们的过人骗术。


    ![](img/figure_0089_0057.jpg)


    秘密所在


    一场世纪大骗局最终还是被揭穿了。幸好那些和它对过弈的王公权贵都早已离世，不然他们一定会为自己的愚蠢而恼羞成怒、无地自容。然而，人类对人工智能的追求没有因此而终止。人机对弈的梦想继续激励着无数科学家和发明家勇往直前，让机器战胜人类棋手的愿望最终得以实现。


    ## 5.2 跳棋中的机器学习


    为什么人们那么早就迷恋让机器下棋呢？人工智能大师明斯基曾经给出过简单而明确的答复。他说：“选择下棋和数学问题作为人工智能的研究对象不是因为它们简单明确，而是因为它们在一个很小的初始结构中蕴含了极其复杂的问题，从而能够在程序设计中以相对较小的转换来获得真正形式化的表达。”在一篇关于计算机下棋的早期论文中，另外两名人工智能大师西蒙和约翰·肖也提出：“如果一个人能够设计出一台成功的弈棋机，他似乎就渗入了人类智力活动的核心。”受这些大师的激励，无数计算机专业人士、国际棋手和业余爱好者开始研究和开发一代又一代的下棋系统，有些人追求胜负和奖金，更多的人则把下棋系统作为实验工具，研究人类智能的工作机制。


    20 世纪 40 年代末，美国伊利诺伊大学的塞缪尔教授开始研究用计算机下跳棋。后来他加入了 IBM 公司的实验室，在 IBM 701 计算机上完成了他的第一个跳棋程序，并把它带到了达特茅斯学院的那场聚会上。从达特茅斯学院回来后，他不断改进他的程序，在
    1962 年夏天打败了美国跳棋大师罗伯特·尼雷（一个盲人天才棋手）。轰动一时的消息让 IBM 公司的股票大涨十几个百分点，乐坏了 IBM 公司的老板托马斯·沃森。IBM
    公司后来一直是棋类程序开发的支持者和参与者。


    人类思考棋类问题的核心智慧就是找到妙招，而找到妙招的关键就是推算出若干步之内无论对方如何应对，自己都处于局面变好的态势。塞缪尔教授热衷于研究计算机下跳棋的目的是探索如何让计算机能够学习。他开发的跳棋程序的最大特点就是自学习功能，也就是今天机器学习的雏形。


    ![](img/figure_0090_0058.jpg)


    塞缪尔


    塞缪尔教授是如何让机器决定每一步中棋子的移动呢？塞缪尔教授考虑到一个跳棋的棋盘只有 64（即 8×8）个两种颜色相间的方格（棋子位置），可以采用一个树形结构来列出每一步中棋子移动的所有可能的情况，然后列出每一种可能情况的下一步可能出现的情况，这样一步一步地列出从开始的第一步到结束的最后一步的所有可能情况。这样，一个招法（下一步棋）向着后续招法分叉，形成了一个树形结构，称之为博弈树。这种方法全面生成所有可能的招法，并选择最优的一种走法，也就是尽可能对博弈树进行穷尽搜索，这样就可以做到胸有成竹。


    ![](img/figure_0091_0059.jpg)


    跳棋


    不过他马上发现，虽然这种方法在理论上可行，但实际上几乎是不可能实现的。因为这将涉及 5×1020 个位置，这简直就是一个天文数字，所以他只能走一步看几步。那么到底能够看几步呢？限于各种条件，一般来说只能看
    3～10 步。可是在这 3～10 步中又该如何选择呢？塞缪尔教授采用了一种打分的办法。


    1944 年，冯·诺依曼和经济学家摩根斯特恩合作出版过一本著名的书籍《博弈论》，书中提出了一种两人对弈的算法。塞缪尔教授参考这种算法，用一个评估函数给每一步打分，然后根据每一个可能的下一步得分的高低来决定怎么走。塞缪尔教授不是一步一步地计算，而是把
    3～10 步内所有组合的计算分数累计起来，从中采用积分最高的路径走下一步。他还同时采用了另外一种方法，就是参照棋谱决定走棋步骤。学习下棋的人都知道，学习前人下过的经典棋谱是迅速提高棋艺、掌握成功妙招的最佳方法。熟记棋谱一百种，即使难赢也难输。


    ![](img/figure_0091_0060.jpg)


    舍佛


    塞缪尔教授的努力虽然名噪一时，但他的程序在与人的对弈中还是有赢有输。直到 20 世纪 80 年代末，最强的跳棋程序才由加拿大阿尔伯塔大学开发出来，开发人员给这款程序起了一个名字叫钦诺克。这个名字来自加拿大的一个冬季暖风的命名，大概寓意着他们的跳棋程序是当时人工智能研究低潮中的一股暖风。程序开发团队的带头人是该校计算机系教授谢弗。


    ![](img/figure_0092_0061.jpg)


    丁斯利


    自从 20 世纪 50 年代起，跳棋的人类冠军一直就是美国数学家丁斯利。丁斯利对跳棋理论深有研究，当他知道谢弗的钦诺克后，很想和它一较高下。美国、英国和加拿大的跳棋协会一直拒绝钦诺克参赛，也禁止作为协会冠军的丁斯利与之角逐。为了能和钦诺克下棋，丁斯利毅然放弃了他的冠军称号。1992
    年，丁斯利大战钦诺克，以 4 胜 2 负 33 平的成绩赢了钦诺克。


    谢弗团队不甘失败，两年以后在波士顿的计算机博物馆再次与丁斯利对战。经过两年改进的钦诺克大不一样，开局的 6 盘都把丁斯利逼和，第 7 局丁斯利以身体不适为由退出了比赛。不久，丁斯利就被诊断出患有胰腺癌。虽然后来他的病情有所好转，准备再次一战，但病情的突然恶化让他抱憾而去。从此，谢弗团队和他们的钦诺克只能“独孤求败”了。


    谢弗团队并没有因为钦诺克打遍天下无敌手而终止研究跳棋理论和相关实践。2007 年，他们最终证明，在跳棋比赛中，只要双方不犯错误，最终都将是和棋。为了这个证明，他们付出了
    18 年的努力，穷尽了跳棋全部的 500995484682338672639 种棋局位置，钦诺克也完善到了战无不胜的最高境地。在 2007 年 9 月的《科学》杂志上，他们自豪地宣布，跳棋的人机对弈历史结束了，人工智能大获全胜！


    于是人类开始向棋类的又一高峰进军，那就是国际象棋。和跳棋相比，国际象棋至少有 1040 种可能的位置，远远高于跳棋的复杂程度。不过，参加过达特茅斯学院聚会的人工智能大师西蒙在
    1957 年宣称，10 年内计算机就可以打败任何人类棋手。1965 年，他再次宣称，20 年内这个目标一定会实现。结果怎样呢？他的再一次预言到底实现了没有？这是我们要讲的另外一个故事。


    ## 5.3 游戏中的人工智能方法


    在人们研究人机博弈的过程中，美国的纽厄尔和西蒙提出了一种叫作“启发式搜索”的方法，该方法后来广泛用于解决计算机下棋问题。


    让我们先做个游戏吧。下图中有 8 个数字和一个空格，请利用空格来移动这 8 个数字，使它们从左面这种无序状态排列成右面这种有序状态。记住，只能通过空格进行移动。


    ![](img/figure_0093_0062.jpg)


    拼图游戏图示 1


    也许大家认为这太简单了。那么让我们把这张图扩展成 15 个数字和一个空格，就像下图所示的那样，再试试看。如果我们继续把图扩展到 99 个数字和一个空格，这个游戏也许就没有那么简单了。大家有没有想过，如果让计算机来帮我们玩，计算机应该怎样做呢？


    ![](img/figure_0093_0063.jpg)


    拼图游戏图示 2


    其实，这个游戏是人工智能研究中的一个非常著名的问题，叫作“玩具问题”，也称为“15 格拼图游戏”。在早期研究这个问题的人之中，纽厄尔和西蒙针对这样一个看似简单的游戏，提出了他们解决这个问题的理论方法，并将其发展成解决这类问题的启发式搜索法。这种方法成为今天人工智能的一大技术。纽厄尔和西蒙的启发式搜索法是怎样的一种方法呢？


    首先，让我们来看看如何让计算机理解这个游戏，换句话说，就是如何在计算机上表示这个游戏。这里我们要介绍一种称为符号结构的计算机数据结构。在计算机上， 每一个字母和数字都可以看作一个符号，而多个符号可以组成一个列表，例如（A,7,Q）。这种符号和符号列表就是最简单的符号结构。复杂的符号结构可以是包括符号列表的列表，例如〈（B,3）,（A,7,Q）〉。这种符号结构可以复杂到多层嵌套，从而可以表达更复杂的问题。


    用这样的符号结构来表达问题，解决问题就变成了寻找一种或多种方法来把一种符号结构（问题表达的初始结构）转换成另一种符号结构（问题解决的答案结构）。利用纽厄尔和西蒙提出的方法，我们先用符号结构把我们的游戏表示出来。开始时游戏的符号结构可以表示成〈（2,8,3）,（1,6,4）,（7，空，
    5）〉，游戏完成后的符号结构应该是〈（1,2,3）,（8，空，4）,（7,6,5）〉。现在就是要通过符号结构的变换，从初始结构达到最终结构。


    从初始结构开始，我们有 3 种可能的变换：〈（2,8,3）,（1,6,4）,（空， 7,5）〉,〈（2,8,3）,（1,6,4）,（7,5，空）〉和〈（2,8,3）,（1，空，4）,
    （7,6,5）〉。显而易见，它们都不是我们所要的最终结果，所以我们会继续在此基础上一直这样变换下去，直到出现我们所需要的结果为止。我们可以把这个变换过程用一幅像树一样的结构图表示出来，如下页中的图所示。我们把这种结构图称为搜索树。可以想象，当问题复杂的时候，这样的搜索会无限扩展下去，搜索树也会蔓延开来，成为一棵可能失控的“参天大树”。这时纽厄尔和西蒙就提出了启发式搜索法，简单地说，这种方法就是在转换中使用一些限制条件，只保留最接近结果的转换过程。


    ![](img/figure_0095_0064.jpg)


    搜索树


    在我们的游戏中，转换可以看成在生成的树杈下继续扩展。为了防止无限蔓延，按照纽厄尔和西蒙的启发式搜索法，我们应该把扩展限制在可能最接近结果的树杈上进行。一种这样的启发式搜索是我们只扩展那些和结果比有最少可能情况的树杈。当然这不是唯一的方法，也不能保证一定能够得到最终结果。但一旦成功，这就会是最佳方法。也许大家可以发现其他的启发式搜索法，有兴趣的话，可以动动脑筋，毕竟我们的游戏比较简单。


    我们已经看到了，这样一个简单的游戏里竟然蕴藏着这么深刻的人工智能技术理论。其实，许多人工智能问题的初始既不神秘，也没有那么高深莫测，很多问题和方法都来自我们对生活和常识的深入思考和进一步的理论研究。今天，人工智能研究人员和科学家正在继续探索如何更好地在人工智能领域表达现实中的问题，特别是如何让人工智能系统自我产生出它自己对问题的表达，因为他们发现如何表达一个问题对解决这个问题来说至关重要。


    另一位研究过人机博弈的人工智能大师香农把棋盘定义为二维数组，每个棋子都有一个对应的计算机子程序，计算棋子所有可能的走法，最后用一个评估函数对各种情况下的走法进行综合评估。


    达特茅斯学院聚会的发起人麦卡锡也曾对如何控制一棵搜索树的无限增长提出过一种修枝剪杈的方法，称之为α-β剪枝术。采用动态计算评估函数，一边生成博弈树一边计算评估函数。当评估函数的值超越给定的上界和下界时，搜索过程就停止，这样大大减小了搜索树的规模。


    在探索人工智能的道路上，英雄辈出，永无止境。虽然西蒙对国际象棋的预言一再落空，但人类探索的脚步并没有因此而停止。1997 年，IBM 公司的“深蓝”机器人两次大胜国际象棋世界冠军卡斯帕罗夫，宣布了机器最终在国际象棋上战胜了人类，让西蒙的预言在
    40 年后得以实现。


    ## 5.4 “深蓝”大战国际象棋世界冠军卡斯帕罗夫


    1997 年 5 月 11 日，是人机挑战赛历史上的又一个具有划时代意义的时刻。IBM 公司研制的超级计算机“深蓝”在正常时限的比赛中首次击败了等级分排名世界第一的棋手加里·卡斯帕罗夫。机器的胜利标志着国际象棋的历史进入新时代。


    “深蓝”重达 1270 千克，有 32 个“大脑”（微处理器），每秒可以计算 2 亿步招数。“深蓝”还“背下”（存储）了 100 多年来优秀棋手对弈的 200
    多万个棋局。


    '
