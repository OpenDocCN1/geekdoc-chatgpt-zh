- raw: '于是，他决定买下德沃尔的专利，将德沃尔的发明投入应用，来生产取代人力劳动的机器人。恩格尔伯格把自己的想法告诉了德沃尔，德沃尔也十分愿意。1957年，恩格尔伯格拉到了300万美元的天使投资，两人合作创立了Unimation公司，这是世界上第一家机器人生产公司。1959年，一个重达2吨但精度达0.0025毫米的庞然大物诞生了，这就是世界上第一台工业机器人尤尼梅特（Unimate）。


    ![](images/figure_0142_0091.jpg)


    德沃尔


    1966年，恩格尔伯格带着最新一代的尤尼梅特机器人上了美国最热门的晚间电视节目《今夜秀》，让它对着全美观众表演高尔夫球推杆、倒啤酒、指挥乐队等有趣动作。恩格尔伯格一夜成名，被称为“工业机器人之父”。


    1983年，恩格尔伯格和他的同事将Unimation公司卖给了西屋公司，并创建了TRC公司，开始研制服务机器人，把机器人推向更广阔的应用领域。1988年，恩格尔伯格的护士助手医疗机器人上市。依靠大量的传感器，护士助手医疗机器人能够在医院中自由行动，协助护士提供送饭、送药和送信等服务，好似电影《超能陆战队》中的“大白”。


    机械手主要由执行机构、驱动机构和控制系统三大部分组成。机械手的执行机构分为手部、手臂和躯干。手臂的内孔中装有传动轴，可把动力传递给手部，实现转动手腕、伸缩手指的功能。机械手手部的构造模仿了人的手指，分为无关节、固定关节和自由关节3种，可根据夹持对象的形状和大小，配备多种形状和大小的夹头以满足操作的需要。而没有手指的手部一般由真空吸盘或磁性吸盘来完成抓取功能。手臂的作用是引导手指准确地抓住工件，并将其运送到所需的位置上。躯干是安装手臂、动力源和各种执行机构的支架。


    ![](images/figure_0143_0092.jpg)


    机械手


    机械手所用的驱动机构主要有液压驱动、气压驱动、电气驱动和机械驱动几种，其中液压驱动和气压驱动用得最多。在液压驱动式机械手中，通常由液压驱动机、伺服阀、油泵、油箱等组成驱动系统，驱动机械手的执行机构进行工作。它具有很大的抓举能力，对付几百千克的重物都不在话下。在气压驱动式机械手中，驱动系统通常由汽缸、气阀、气罐和空气压缩机组成，动作迅速，结构简单，造价较低，维修方便，但难以进行速度控制，气压也不可太高，故抓举能力有限。电气驱动是机械手中应用得最多的一种驱动方式，因为电源使用方便，响应快，驱动力较大（关节型可持重400千克），信号检测、传动、处理都很方便，并可采用多种灵活的控制方案。


    机械手的控制参数包括工作顺序、到达位置、动作时间、运动速度、加减速等。机械手的控制方式分为点位控制和连续轨迹控制两种。控制系统可根据动作的要求，采用数字顺序控制方式，通过编程加以存储，然后根据规定的步骤执行相应的程序来完成控制任务。


    国际标准化组织采纳了美国机器人学会给机器人下的定义：“一种可编程和多功能的操作机，或为了执行不同的任务而具有可用计算机对动作进行改变和编程的专门系统。”


    从20世纪70年代开始，除了美国，日本和欧洲的机器人工业也有了快速发展。根据国际机器人联合会发布的《2012年世界机器人研究报告》，到2011年底，已有超过100万个工业机器人在世界各地的工厂中服务。今天工业机器人更是无所不在，无人车间、无人工厂已经开始普及。


    当然，大多数工业机器人还不会行走，早期的机械手也都是些老老实实地待在工位上勤勤恳恳地干着固定工作的大家伙。前文曾介绍过，第一个可以自由行走的通用机器人是由美国斯坦福研究所在1968年开发研制的。由于它移动起来摇摇晃晃，所以被命名为沙克依。沙克依是首台全面应用人工智能技术的移动机器人，能够自主进行感知、环境建模、行为规划并执行任务。它装备了电子摄像机、三角测距仪、碰撞传感器以及驱动电机，并通过无线通信系统由两台计算机进行控制。当时计算机的运算速度非常慢，导致沙克依往往需要数小时的时间来感知和分析环境以及规划行动路径。虽然今天看起来沙克依简单而又笨拙，但在研制沙克依的过程中获得的各种技术成果影响了很多后续的研究。


    在仿人机器人方面，日本走在世界前列。1973年，日本早稻田大学的加藤一郎教授研发出了第一台用双脚走路的机器人WABOT-1，加藤一郎后来被誉为“仿人机器人之父”。在他的影响下，日本的很多大企业也投入到了仿人机器人和娱乐机器人的开发中，比较著名的产品有本田公司的仿人机器人ASIMO和索尼公司的机器宠物狗AIBO。


    1998年，丹麦乐高公司推出了“头脑风暴”机器人套件。使用套件中的机器人核心控制模块、电机和传感器，孩子们也能走进机器人的世界，可以自行设计各种像人、像狗甚至像恐龙的机器人，然后动手像搭积木一样把它拼装出来，并可通过简单编程让机器人做各种动作。机器人已经全面走入我们的生活，从生产到娱乐，从教育到服务。我们离创造出科幻大片中的机器人的时刻已经不远了。


    ![](images/figure_0145_0093.jpg)


    乐高公司的“头脑风暴”机器人套装


    ## [8.2 科幻作家阿西莫夫和著名的机器人三定律](../contents/content.xhtml#toc51)


    随着人工智能的飞速发展，机器人的功能越来越强大，有人担心有一天机器人会不会取代人类而主宰地球的命运？好莱坞大片更是把这种担心在屏幕上变成了惊悚的场景和令人恐惧的灾难，在电影《黑客帝国》中人工智能计算机就统治了整个世界。其实，科幻作家阿西莫夫很早就意识到了这个问题，他著名的机器人三定律就是他为机器人制定的“道德底线”。


    艾萨克·阿西莫夫出生在莫斯科西南约400千米的一个名叫彼得罗维奇的小村庄里。他的父母是犹太人，家庭非常普通，他在两岁的时候差点死于肺炎，据说他是当地肺炎流行时唯一幸存下来的孩子。后来，全家人在阿西莫夫定居于美国的舅舅的帮助下，几经周折来到美国。到达美国后，他的父母开了一家糖果店维生。


    ![](images/figure_0145_0094.jpg)


    阿西莫夫


    少年时代的阿西莫夫是个超级神童，智商高达160，多次跳级，考试总是第一，是个名副其实的学霸，但也是个捣蛋鬼，让老师头疼不已。11岁时，他爱上了写作，不过和所有初出茅庐的作者一样，他频繁遭遇退稿。他在15岁时考入美国哥伦比亚大学，然后一路读到博士。在求学期间，阿西莫夫终于发表了他的第一篇科幻小说《逐出灶神星》，紧接着发表了《致命的武器》《趋势》等作品。他用自己的文字征服了读者，也用稿费收入支付了自己的学费，从而减轻了家里的负担。


    他从小就深刻理解病痛、种族问题和世俗生活的艰难，这些都影响了他的创作，让他的作品中总是带有浓厚的人文情怀和对民主、科学、环保的关注。在哥伦比亚大学读研究生期间，成绩优异的他又发表了《我，机器人》等作品，几次荣获雨果奖和星云奖。他的才华和成就让他成为了美国科幻小说作家、科普作家和文学评论家，是美国科幻小说黄金时代的代表人物之一。


    他一生著书近500本，题材涉及自然科学、社会科学和文学艺术等许多领域，与儒勒·凡尔纳和乔治·威尔斯并称为科幻历史上的三巨头。他还是著名的门萨俱乐部的会员，后来担任副会长。他的作品“基地系列”“银河帝国三部曲”和“机器人系列”被誉为“科幻圣经”。


    就在阿西莫夫顺利取得了硕士学位并马上开始申请哥伦比亚大学的博士课程那一年，他发表了短篇小说《转圈圈》，首次在书中提出了著名的机器人三定律，为规范机器人的行为提出了自己的看法。这后来成为了“现代机器人学的基石”。


    机器人三定律为机器人订下了这样的行为准则。


    （1）机器人不能伤害人类，或者目睹人类个体将遭遇危险而袖手旁观。


    （2）机器人必须执行人类的命令，除非这些命令与第一条定律相抵触。


    （3）机器人在不违背第一、二条定律的情况下要尽可能保护自己的生存。


    1985年，阿西莫夫出版了“机器人系列”的最后一部作品《机器人与帝国》。在这部书中，他提出了凌驾于机器人三定律之上的第零定律：机器人必须保护人类的整体利益不受损害，其他三条定律只有在这一前提下才能成立。


    阿西莫夫对人文主义抱有严肃的态度，他经常发表与其相关的演说并写文章甚至著书来探讨。他把科学看作地球上伟大而统一的原则。他利用科幻小说这种特殊的文学形式，在普及科学知识的同时，促使人们去考虑人类与科技、历史等各方面的关系，考虑人类与整个社会的协调发展。晚年时，他担任了美国人文主义学会的主席，直到他去世。


    机器人真的会超越人类吗？如果这真的会发生，那将是什么时候呢？发生了以后，人类又将如何与机器人相处呢？要想回答这些问题，我们先要了解今天的人工智能到底有多“聪明”，人工智能到底会发展到什么程度，什么样的人工智能会让机器人超出人类的控制范围而给人类带来威胁。让我们先厘清一下有关不同层级人工智能的几个基本定义。


    人工智能可以分为3个层级。第一个层级叫弱人工智能，也称为限制领域人工智能或应用型人工智能。在这个层级上，人工智能专注于解决特定领域的问题。今天我们看到的所有人工智能都属于弱人工智能的范畴，如谷歌的阿尔法狗就是一个很好的实例。它的能力仅限于围棋，下棋时还需要人帮忙摆棋子。它自己连从棋盒里拿出棋子并将其置于棋盘之上的能力都没有，更别提下棋前向对手行礼、下棋后一起复盘等围棋礼仪了。显然，这样的人工智能技术对人类来说还谈不上什么大的威胁。


    人工智能的第二个层级叫强人工智能，又称通用人工智能或完全人工智能。在这个层级上，人工智能可以胜任人类的所有工作。人可以做什么，强人工智能就可以做什么。能否通过图灵测试是强人工智能的一个实践性标志。一旦实现了符合这一描述的强人工智能，我们几乎可以肯定，所有人类工作都可以由人工智能来做。机器人为我们服务，每台机器人也许可以一对一地接替每个人类个体的具体工作，人类则获得完全意义上的自由，不再需要劳动。但目前我们还没有达到这样的水平。但它对人类可能带来的威胁是不言而喻的。


    人工智能的第三个层级叫超人工智能，也就是说在这个层级上，人工智能已经全面超过人类智能。这样的人工智能不但有意识和情感，而且有思想和意志。牛津大学哲学家、未来学家尼克·波斯特洛姆在他的《超级智能》一书中将超人工智能定义为“在科学创造力、智慧和社交能力等每一方面都比最强大的人类大脑聪明得多的智能”。显然，对今天的人类来说，这是一种完全存在于科幻电影中的场景。但不难想象，如果人工智能发展到这一水平，人类被灭绝可能就是很容易的事情。


    显然，如果对人工智能会不会挑战和威胁人类有所担忧的话，我们担心的就是这里所说的强人工智能和超人工智能。我们到底该如何看待强人工智能和超人工智能呢？它们会像阿尔法狗那样以远超我们预料的速度降临世间吗？


    今天，关于超人工智能是否会到来和何时到来，学者们众说纷纭。悲观者认为技术加速发展的趋势无法改变，超越人类智能的机器将在不久的未来得以实现，那时的人类将面临生死存亡的重大考验。而乐观主义者则更愿意相信，人工智能在未来相当长的一个历史时期都只是人类的工具，很难突破超人工智能的门槛。


    技术在今天正以日新月异的速度发展着。关于人工智能的未来，目前还没有统一的看法，但有一点是肯定的，那就是技术正在深刻地改变着人类的生活、生产和生存方式。这种深刻的变革已经并将不断地挑战人类的智慧和未来。


    ## [8.3 一辆不用司机驾驶的汽车](../contents/content.xhtml#toc52)


    20世纪60年代初，斯坦福大学机械工程专业的一个名叫詹姆斯的研究生鼓捣出了一个有4个轮子、可以在电视摄像机和无线电信号控制下自动行驶的电瓶车。虽然它的速度只有0.3千米/小时，但这毕竟是一次关于自动驾驶电动车的最初尝试。


    ![](images/figure_0148_0095.jpg)


    斯坦福电瓶车


    不久，斯坦福大学人工智能实验室主任厄纳斯特和电子工程专业的博士生史密斯也加入了研究之中。他们对詹姆斯的电瓶车做了些改进。在实验室四周的道路上，这辆电瓶车可以沿着一条白线，在交通信号灯的控制下，以1.3千米/小时的速度自动行驶。他们的成果引起了人工智能专业其他研究生的兴趣，他们纷纷参与到了研究之中。


    不过，实验也并不都是一帆风顺的。一次，电瓶车撞到了一个出口的路肩上，电瓶中的液体都漏了出来。这个电瓶车成为了美国研究如何从地球上控制月球车的一个模拟器。


    1986年，美国卡内基·梅隆大学计算机科学学院机器人研究中心的研究人员在一辆雪佛兰汽车上安装了3台Sun工作站、一台由该大学自行研制的WARP并行计算阵列、一部GPS（全球定位系统）信号接收器以及其他相关的硬件单元，成功地试验了真正意义上的自动驾驶汽车。他们给这辆车起了个名字叫NavLab，大概取意自导航实验室。这辆自动驾驶汽车可以在公路上以32千米/小时的速度行驶，是真正意义上现代自动驾驶汽车的雏形。


    ![](images/figure_0149_0096.jpg)


    NavLab 1 自动驾驶汽车


    1989年，卡内基·梅隆大学在自动驾驶系统中引进了神经网络技术，进行感知和控制单元的试验。大约在同一时期，奔驰、通用、博世、尼桑、丰田、奥迪等传统汽车行业的厂商也开始加大对自动驾驶系统的投入，陆续推出了不少原型车。


    今天，谷歌的自动驾驶汽车已经在美国的数个州获得了合法上路测试的许可，也在实际路面上积累了上百万千米的行驶经验。电动汽车先驱特斯拉更是早在2014年下半年就开始在销售电动汽车的同时，向车主提供可选配的名为Autopilot的辅助驾驶软件。


    在辅助驾驶的过程中，计算机依靠车载传感器实时获取的路面信息和预先通过机器学习得到的经验模型，自动调整车速，控制电机、制动系统以及转向系统，帮助车辆避开来自前方和侧方的碰撞，防止车辆滑出路面，成为了驾驶员的理想助手。其实，早在20世纪20年代，当时的主流汽车厂商就开始试验自动驾驶或辅助驾驶功能。


    在中国，国防科技大学早在1987年就研制出了一辆自动驾驶汽车的原型车。虽然这辆车非常小，样子也与普通汽车相去甚远，但基本上具备了自动驾驶汽车的主要组成部分。2003年，国防科技大学和一汽集团联合改装了一辆红旗轿车，在自动驾驶状态下最高速度可以达到130千米/小时，而且实现了自主超车功能。2011年，改进后的自动驾驶红旗轿车完成了从长沙到武汉的公路测试，总里程为286千米，其中人工干预的里程只有2240米。此外，清华大学、中国科技大学等也各自开展了自动驾驶技术的早期研究。


    被誉为谷歌自动驾驶汽车之父的塞巴斯蒂安·特龙在加入谷歌之前，就曾带领斯坦福大学的技术团队研发出了一辆名为Stanley的自动驾驶汽车，并参加了美国国防部高级研究计划局组织的自动驾驶挑战赛。塞巴斯蒂安·特龙主持研制的Stanley汽车赢得了2005年美国国防部高级研究计划局自动驾驶挑战赛的冠军。


    Stanley自动驾驶汽车使用了多种传感器组合，包括激光雷达、摄像机、GPS以及惯性传感器。所有这些传感器收集的实时信息由超过10万行的软件代码进行解读、分析并完成决策。在障碍检测方面，Stanley自动驾驶汽车已经使用了机器学习技术。塞巴斯蒂安·特龙带领的团队也将Stanley自动驾驶汽车在道路测试中不得不由人类驾驶员干预处理的所有紧急情况记录下来，交给机器学习程序反复分析，从中总结出可以复用的感知模型和决策模型，用不断迭代测试、不断改进算法模型的方式，让Stanley自动驾驶汽车越来越聪明。


    ![](images/figure_0151_0097.jpg)


    Stanley自动驾驶汽车


    和人工智能一样，自动驾驶也是一个有歧义、经常被人用不同方式解读的概念。为了更好地区分不同层级的自动驾驶技术，国际自动机工程师学会（原译国际汽车工程师协会）于2014年发布了自动驾驶的六级分类体系。美国国家公路交通安全管理局原本有自己的一套分类体系，但在2016年9月开始使用国际自动机工程师学会的分类标准。今天绝大多数主流的自动驾驶研究者已将国际自动机工程师学会的分类标准当作通行的分类原则。


    国际自动机工程师学会的分类标准将自动驾驶技术分为第0级到第5级共6个级别。在这个分类标准中，目前日常使用的大多数汽车处在第0级和第1级之间，碰撞报警属于第0级技术，自动防碰撞、定速巡航属于第1级辅助驾驶技术，自动泊车功能介于第1级和第2级之间，特斯拉公司正在销售的Autopilot辅助驾驶技术属于第2级。


    按照国际自动机工程师学会的标准，第2级和第3级技术之间存在相当大的跨度。使用第1级和第2级辅助驾驶功能时，人类驾驶员必须时刻关注路况，并及时对各种复杂情况做出反应。但在国际自动机工程师学会定义的第3级技术标准中，监控路况的任务由自动驾驶系统来完成。这个差别是巨大的。技术人员也通常将第2级和第3级之间的分界线视作“辅助驾驶”和“自动驾驶”的区别所在。


    当然，即便按照国际自动机工程师学会的标准实现了第3级的自动驾驶，根据这个级别的定义，人类驾驶员也必须随时待命，准备响应系统的请求，处理那些系统没有能力应对的特殊情况。使用这个级别的自动驾驶功能时，人类驾驶员是无法在汽车上看手机、上网或玩游戏的。


    毫无疑问，自动驾驶将在不久的将来走进我们的生活。关于真正意义上的第4级和第5级自动驾驶技术什么时候可以普及，人们有各种各样的预测。百度希望到2019年时将有大量的自动驾驶汽车上路进行测试，2021年自动驾驶汽车将进入大批量制造和商用化阶段。特斯拉公司的创始人埃隆·马斯克宣布，目前上市的特斯拉汽车已经在硬件标准上具备了实现国际自动机工程师学会第5级自动驾驶的能力。


    ![](images/figure_0152_0098.jpg)


    特斯拉汽车


    我们不妨想象一下，未来的某一天吃过早饭后，我们走出家门，全自动驾驶汽车正在门口等着我们。看到我们出来，它自动打开车门，我们一头钻进了车里。车里既没有驾驶室和司机，也没有方向盘、挡把和脚踏板。一个温柔的声音从车里问候我们：“早上好！请问你们想去哪里？”我们说出了自己要去的地方后，这个温柔的声音又说：“请系好安全带，我们就要出发了。今天路况良好，10分钟后就可以到达。”话音刚落，就在我们系好安全带的一瞬间，车子自己就缓缓开动了。


    车里的我们开口说：“请让我们看看今天的新闻视频。”


    我们眼前的车窗立刻变成了一块屏幕，新闻视频自动显示在了上面。


    不一会儿，目的地到了，车门又自动打开。我们下车时，车里又响起了那个温柔的声音：“祝你们愉快！我会再来接你们的。”


    自动驾驶已经不再是科幻小说中的一个场景。我们这里所说的一切很可能就发生在不远的明天。我们不用考驾照，不用雇司机，直接告诉汽车我们要去哪里，汽车就自己载着我们前往，不用担心走错路，不用担心警察开罚单，我们还能在行车之时看书、打游戏、看电视剧甚至睡大觉，相信每个人都会为此兴奋不已。


    ## [8.4 做狗也疯狂](../contents/content.xhtml#toc53)


    大狗是美国波士顿动力公司于2005年开发的一款四足机器狗。其实在开发之初，波士顿动力公司受美国国防部高级研究计划局的资助，想开发一种可以像骡子一样驮运物品、在战场上随士兵一起行动的机器人，因为具有轮子的车辆在崎岖复杂的地理条件下并不是十分理想的选择。用四足代替轮子，可以更加灵活地应对陡峭的山路、丛林和河床复杂的溪流。'
  fmt: '

    于是，他决定买下德沃尔的专利，将德沃尔的发明投入应用，来生产取代人力劳动的机器人。恩格尔伯格把自己的想法告诉了德沃尔，德沃尔也十分愿意。1957年，恩格尔伯格拉到了300万美元的天使投资，两人合作创立了Unimation公司，这是世界上第一家机器人生产公司。1959年，一个重达2吨但精度达0.0025毫米的庞然大物诞生了，这就是世界上第一台工业机器人尤尼梅特（Unimate）。


    ![](images/figure_0142_0091.jpg)


    德沃尔


    1966年，恩格尔伯格带着最新一代的尤尼梅特机器人上了美国最热门的晚间电视节目《今夜秀》，让它对着全美观众表演高尔夫球推杆、倒啤酒、指挥乐队等有趣动作。恩格尔伯格一夜成名，被称为“工业机器人之父”。


    1983年，恩格尔伯格和他的同事将Unimation公司卖给了西屋公司，并创建了TRC公司，开始研制服务机器人，把机器人推向更广阔的应用领域。1988年，恩格尔伯格的护士助手医疗机器人上市。依靠大量的传感器，护士助手医疗机器人能够在医院中自由行动，协助护士提供送饭、送药和送信等服务，好似电影《超能陆战队》中的“大白”。


    机械手主要由执行机构、驱动机构和控制系统三大部分组成。机械手的执行机构分为手部、手臂和躯干。手臂的内孔中装有传动轴，可把动力传递给手部，实现转动手腕、伸缩手指的功能。机械手手部的构造模仿了人的手指，分为无关节、固定关节和自由关节3种，可根据夹持对象的形状和大小，配备多种形状和大小的夹头以满足操作的需要。而没有手指的手部一般由真空吸盘或磁性吸盘来完成抓取功能。手臂的作用是引导手指准确地抓住工件，并将其运送到所需的位置上。躯干是安装手臂、动力源和各种执行机构的支架。


    ![](images/figure_0143_0092.jpg)


    机械手


    机械手所用的驱动机构主要有液压驱动、气压驱动、电气驱动和机械驱动几种，其中液压驱动和气压驱动用得最多。在液压驱动式机械手中，通常由液压驱动机、伺服阀、油泵、油箱等组成驱动系统，驱动机械手的执行机构进行工作。它具有很大的抓举能力，对付几百千克的重物都不在话下。在气压驱动式机械手中，驱动系统通常由汽缸、气阀、气罐和空气压缩机组成，动作迅速，结构简单，造价较低，维修方便，但难以进行速度控制，气压也不可太高，故抓举能力有限。电气驱动是机械手中应用得最多的一种驱动方式，因为电源使用方便，响应快，驱动力较大（关节型可持重400千克），信号检测、传动、处理都很方便，并可采用多种灵活的控制方案。


    机械手的控制参数包括工作顺序、到达位置、动作时间、运动速度、加减速等。机械手的控制方式分为点位控制和连续轨迹控制两种。控制系统可根据动作的要求，采用数字顺序控制方式，通过编程加以存储，然后根据规定的步骤执行相应的程序来完成控制任务。


    国际标准化组织采纳了美国机器人学会给机器人下的定义：“一种可编程和多功能的操作机，或为了执行不同的任务而具有可用计算机对动作进行改变和编程的专门系统。”


    从20世纪70年代开始，除了美国，日本和欧洲的机器人工业也有了快速发展。根据国际机器人联合会发布的《2012年世界机器人研究报告》，到2011年底，已有超过100万个工业机器人在世界各地的工厂中服务。今天工业机器人更是无所不在，无人车间、无人工厂已经开始普及。


    当然，大多数工业机器人还不会行走，早期的机械手也都是些老老实实地待在工位上勤勤恳恳地干着固定工作的大家伙。前文曾介绍过，第一个可以自由行走的通用机器人是由美国斯坦福研究所在1968年开发研制的。由于它移动起来摇摇晃晃，所以被命名为沙克依。沙克依是首台全面应用人工智能技术的移动机器人，能够自主进行感知、环境建模、行为规划并执行任务。它装备了电子摄像机、三角测距仪、碰撞传感器以及驱动电机，并通过无线通信系统由两台计算机进行控制。当时计算机的运算速度非常慢，导致沙克依往往需要数小时的时间来感知和分析环境以及规划行动路径。虽然今天看起来沙克依简单而又笨拙，但在研制沙克依的过程中获得的各种技术成果影响了很多后续的研究。


    在仿人机器人方面，日本走在世界前列。1973年，日本早稻田大学的加藤一郎教授研发出了第一台用双脚走路的机器人WABOT-1，加藤一郎后来被誉为“仿人机器人之父”。在他的影响下，日本的很多大企业也投入到了仿人机器人和娱乐机器人的开发中，比较著名的产品有本田公司的仿人机器人ASIMO和索尼公司的机器宠物狗AIBO。


    1998年，丹麦乐高公司推出了“头脑风暴”机器人套件。使用套件中的机器人核心控制模块、电机和传感器，孩子们也能走进机器人的世界，可以自行设计各种像人、像狗甚至像恐龙的机器人，然后动手像搭积木一样把它拼装出来，并可通过简单编程让机器人做各种动作。机器人已经全面走入我们的生活，从生产到娱乐，从教育到服务。我们离创造出科幻大片中的机器人的时刻已经不远了。


    ![](images/figure_0145_0093.jpg)


    乐高公司的“头脑风暴”机器人套装


    ## 8.2 科幻作家阿西莫夫和著名的机器人三定律


    随着人工智能的飞速发展，机器人的功能越来越强大，有人担心有一天机器人会不会取代人类而主宰地球的命运？好莱坞大片更是把这种担心在屏幕上变成了惊悚的场景和令人恐惧的灾难，在电影《黑客帝国》中人工智能计算机就统治了整个世界。其实，科幻作家阿西莫夫很早就意识到了这个问题，他著名的机器人三定律就是他为机器人制定的“道德底线”。


    艾萨克·阿西莫夫出生在莫斯科西南约400千米的一个名叫彼得罗维奇的小村庄里。他的父母是犹太人，家庭非常普通，他在两岁的时候差点死于肺炎，据说他是当地肺炎流行时唯一幸存下来的孩子。后来，全家人在阿西莫夫定居于美国的舅舅的帮助下，几经周折来到美国。到达美国后，他的父母开了一家糖果店维生。


    ![](images/figure_0145_0094.jpg)


    阿西莫夫


    少年时代的阿西莫夫是个超级神童，智商高达160，多次跳级，考试总是第一，是个名副其实的学霸，但也是个捣蛋鬼，让老师头疼不已。11岁时，他爱上了写作，不过和所有初出茅庐的作者一样，他频繁遭遇退稿。他在15岁时考入美国哥伦比亚大学，然后一路读到博士。在求学期间，阿西莫夫终于发表了他的第一篇科幻小说《逐出灶神星》，紧接着发表了《致命的武器》《趋势》等作品。他用自己的文字征服了读者，也用稿费收入支付了自己的学费，从而减轻了家里的负担。


    他从小就深刻理解病痛、种族问题和世俗生活的艰难，这些都影响了他的创作，让他的作品中总是带有浓厚的人文情怀和对民主、科学、环保的关注。在哥伦比亚大学读研究生期间，成绩优异的他又发表了《我，机器人》等作品，几次荣获雨果奖和星云奖。他的才华和成就让他成为了美国科幻小说作家、科普作家和文学评论家，是美国科幻小说黄金时代的代表人物之一。


    他一生著书近500本，题材涉及自然科学、社会科学和文学艺术等许多领域，与儒勒·凡尔纳和乔治·威尔斯并称为科幻历史上的三巨头。他还是著名的门萨俱乐部的会员，后来担任副会长。他的作品“基地系列”“银河帝国三部曲”和“机器人系列”被誉为“科幻圣经”。


    就在阿西莫夫顺利取得了硕士学位并马上开始申请哥伦比亚大学的博士课程那一年，他发表了短篇小说《转圈圈》，首次在书中提出了著名的机器人三定律，为规范机器人的行为提出了自己的看法。这后来成为了“现代机器人学的基石”。


    机器人三定律为机器人订下了这样的行为准则。


    （1）机器人不能伤害人类，或者目睹人类个体将遭遇危险而袖手旁观。


    （2）机器人必须执行人类的命令，除非这些命令与第一条定律相抵触。


    （3）机器人在不违背第一、二条定律的情况下要尽可能保护自己的生存。


    1985年，阿西莫夫出版了“机器人系列”的最后一部作品《机器人与帝国》。在这部书中，他提出了凌驾于机器人三定律之上的第零定律：机器人必须保护人类的整体利益不受损害，其他三条定律只有在这一前提下才能成立。


    阿西莫夫对人文主义抱有严肃的态度，他经常发表与其相关的演说并写文章甚至著书来探讨。他把科学看作地球上伟大而统一的原则。他利用科幻小说这种特殊的文学形式，在普及科学知识的同时，促使人们去考虑人类与科技、历史等各方面的关系，考虑人类与整个社会的协调发展。晚年时，他担任了美国人文主义学会的主席，直到他去世。


    机器人真的会超越人类吗？如果这真的会发生，那将是什么时候呢？发生了以后，人类又将如何与机器人相处呢？要想回答这些问题，我们先要了解今天的人工智能到底有多“聪明”，人工智能到底会发展到什么程度，什么样的人工智能会让机器人超出人类的控制范围而给人类带来威胁。让我们先厘清一下有关不同层级人工智能的几个基本定义。


    人工智能可以分为3个层级。第一个层级叫弱人工智能，也称为限制领域人工智能或应用型人工智能。在这个层级上，人工智能专注于解决特定领域的问题。今天我们看到的所有人工智能都属于弱人工智能的范畴，如谷歌的阿尔法狗就是一个很好的实例。它的能力仅限于围棋，下棋时还需要人帮忙摆棋子。它自己连从棋盒里拿出棋子并将其置于棋盘之上的能力都没有，更别提下棋前向对手行礼、下棋后一起复盘等围棋礼仪了。显然，这样的人工智能技术对人类来说还谈不上什么大的威胁。


    人工智能的第二个层级叫强人工智能，又称通用人工智能或完全人工智能。在这个层级上，人工智能可以胜任人类的所有工作。人可以做什么，强人工智能就可以做什么。能否通过图灵测试是强人工智能的一个实践性标志。一旦实现了符合这一描述的强人工智能，我们几乎可以肯定，所有人类工作都可以由人工智能来做。机器人为我们服务，每台机器人也许可以一对一地接替每个人类个体的具体工作，人类则获得完全意义上的自由，不再需要劳动。但目前我们还没有达到这样的水平。但它对人类可能带来的威胁是不言而喻的。


    人工智能的第三个层级叫超人工智能，也就是说在这个层级上，人工智能已经全面超过人类智能。这样的人工智能不但有意识和情感，而且有思想和意志。牛津大学哲学家、未来学家尼克·波斯特洛姆在他的《超级智能》一书中将超人工智能定义为“在科学创造力、智慧和社交能力等每一方面都比最强大的人类大脑聪明得多的智能”。显然，对今天的人类来说，这是一种完全存在于科幻电影中的场景。但不难想象，如果人工智能发展到这一水平，人类被灭绝可能就是很容易的事情。


    显然，如果对人工智能会不会挑战和威胁人类有所担忧的话，我们担心的就是这里所说的强人工智能和超人工智能。我们到底该如何看待强人工智能和超人工智能呢？它们会像阿尔法狗那样以远超我们预料的速度降临世间吗？


    今天，关于超人工智能是否会到来和何时到来，学者们众说纷纭。悲观者认为技术加速发展的趋势无法改变，超越人类智能的机器将在不久的未来得以实现，那时的人类将面临生死存亡的重大考验。而乐观主义者则更愿意相信，人工智能在未来相当长的一个历史时期都只是人类的工具，很难突破超人工智能的门槛。


    技术在今天正以日新月异的速度发展着。关于人工智能的未来，目前还没有统一的看法，但有一点是肯定的，那就是技术正在深刻地改变着人类的生活、生产和生存方式。这种深刻的变革已经并将不断地挑战人类的智慧和未来。


    ## 8.3 一辆不用司机驾驶的汽车


    20世纪60年代初，斯坦福大学机械工程专业的一个名叫詹姆斯的研究生鼓捣出了一个有4个轮子、可以在电视摄像机和无线电信号控制下自动行驶的电瓶车。虽然它的速度只有0.3千米/小时，但这毕竟是一次关于自动驾驶电动车的最初尝试。


    ![](images/figure_0148_0095.jpg)


    斯坦福电瓶车


    不久，斯坦福大学人工智能实验室主任厄纳斯特和电子工程专业的博士生史密斯也加入了研究之中。他们对詹姆斯的电瓶车做了些改进。在实验室四周的道路上，这辆电瓶车可以沿着一条白线，在交通信号灯的控制下，以1.3千米/小时的速度自动行驶。他们的成果引起了人工智能专业其他研究生的兴趣，他们纷纷参与到了研究之中。


    不过，实验也并不都是一帆风顺的。一次，电瓶车撞到了一个出口的路肩上，电瓶中的液体都漏了出来。这个电瓶车成为了美国研究如何从地球上控制月球车的一个模拟器。


    1986年，美国卡内基·梅隆大学计算机科学学院机器人研究中心的研究人员在一辆雪佛兰汽车上安装了3台Sun工作站、一台由该大学自行研制的WARP并行计算阵列、一部GPS（全球定位系统）信号接收器以及其他相关的硬件单元，成功地试验了真正意义上的自动驾驶汽车。他们给这辆车起了个名字叫NavLab，大概取意自导航实验室。这辆自动驾驶汽车可以在公路上以32千米/小时的速度行驶，是真正意义上现代自动驾驶汽车的雏形。


    ![](images/figure_0149_0096.jpg)


    NavLab 1 自动驾驶汽车


    1989年，卡内基·梅隆大学在自动驾驶系统中引进了神经网络技术，进行感知和控制单元的试验。大约在同一时期，奔驰、通用、博世、尼桑、丰田、奥迪等传统汽车行业的厂商也开始加大对自动驾驶系统的投入，陆续推出了不少原型车。


    今天，谷歌的自动驾驶汽车已经在美国的数个州获得了合法上路测试的许可，也在实际路面上积累了上百万千米的行驶经验。电动汽车先驱特斯拉更是早在2014年下半年就开始在销售电动汽车的同时，向车主提供可选配的名为Autopilot的辅助驾驶软件。


    在辅助驾驶的过程中，计算机依靠车载传感器实时获取的路面信息和预先通过机器学习得到的经验模型，自动调整车速，控制电机、制动系统以及转向系统，帮助车辆避开来自前方和侧方的碰撞，防止车辆滑出路面，成为了驾驶员的理想助手。其实，早在20世纪20年代，当时的主流汽车厂商就开始试验自动驾驶或辅助驾驶功能。


    在中国，国防科技大学早在1987年就研制出了一辆自动驾驶汽车的原型车。虽然这辆车非常小，样子也与普通汽车相去甚远，但基本上具备了自动驾驶汽车的主要组成部分。2003年，国防科技大学和一汽集团联合改装了一辆红旗轿车，在自动驾驶状态下最高速度可以达到130千米/小时，而且实现了自主超车功能。2011年，改进后的自动驾驶红旗轿车完成了从长沙到武汉的公路测试，总里程为286千米，其中人工干预的里程只有2240米。此外，清华大学、中国科技大学等也各自开展了自动驾驶技术的早期研究。


    被誉为谷歌自动驾驶汽车之父的塞巴斯蒂安·特龙在加入谷歌之前，就曾带领斯坦福大学的技术团队研发出了一辆名为Stanley的自动驾驶汽车，并参加了美国国防部高级研究计划局组织的自动驾驶挑战赛。塞巴斯蒂安·特龙主持研制的Stanley汽车赢得了2005年美国国防部高级研究计划局自动驾驶挑战赛的冠军。


    Stanley自动驾驶汽车使用了多种传感器组合，包括激光雷达、摄像机、GPS以及惯性传感器。所有这些传感器收集的实时信息由超过10万行的软件代码进行解读、分析并完成决策。在障碍检测方面，Stanley自动驾驶汽车已经使用了机器学习技术。塞巴斯蒂安·特龙带领的团队也将Stanley自动驾驶汽车在道路测试中不得不由人类驾驶员干预处理的所有紧急情况记录下来，交给机器学习程序反复分析，从中总结出可以复用的感知模型和决策模型，用不断迭代测试、不断改进算法模型的方式，让Stanley自动驾驶汽车越来越聪明。


    ![](images/figure_0151_0097.jpg)


    Stanley自动驾驶汽车


    和人工智能一样，自动驾驶也是一个有歧义、经常被人用不同方式解读的概念。为了更好地区分不同层级的自动驾驶技术，国际自动机工程师学会（原译国际汽车工程师协会）于2014年发布了自动驾驶的六级分类体系。美国国家公路交通安全管理局原本有自己的一套分类体系，但在2016年9月开始使用国际自动机工程师学会的分类标准。今天绝大多数主流的自动驾驶研究者已将国际自动机工程师学会的分类标准当作通行的分类原则。


    国际自动机工程师学会的分类标准将自动驾驶技术分为第0级到第5级共6个级别。在这个分类标准中，目前日常使用的大多数汽车处在第0级和第1级之间，碰撞报警属于第0级技术，自动防碰撞、定速巡航属于第1级辅助驾驶技术，自动泊车功能介于第1级和第2级之间，特斯拉公司正在销售的Autopilot辅助驾驶技术属于第2级。


    按照国际自动机工程师学会的标准，第2级和第3级技术之间存在相当大的跨度。使用第1级和第2级辅助驾驶功能时，人类驾驶员必须时刻关注路况，并及时对各种复杂情况做出反应。但在国际自动机工程师学会定义的第3级技术标准中，监控路况的任务由自动驾驶系统来完成。这个差别是巨大的。技术人员也通常将第2级和第3级之间的分界线视作“辅助驾驶”和“自动驾驶”的区别所在。


    当然，即便按照国际自动机工程师学会的标准实现了第3级的自动驾驶，根据这个级别的定义，人类驾驶员也必须随时待命，准备响应系统的请求，处理那些系统没有能力应对的特殊情况。使用这个级别的自动驾驶功能时，人类驾驶员是无法在汽车上看手机、上网或玩游戏的。


    毫无疑问，自动驾驶将在不久的将来走进我们的生活。关于真正意义上的第4级和第5级自动驾驶技术什么时候可以普及，人们有各种各样的预测。百度希望到2019年时将有大量的自动驾驶汽车上路进行测试，2021年自动驾驶汽车将进入大批量制造和商用化阶段。特斯拉公司的创始人埃隆·马斯克宣布，目前上市的特斯拉汽车已经在硬件标准上具备了实现国际自动机工程师学会第5级自动驾驶的能力。


    ![](images/figure_0152_0098.jpg)


    特斯拉汽车


    我们不妨想象一下，未来的某一天吃过早饭后，我们走出家门，全自动驾驶汽车正在门口等着我们。看到我们出来，它自动打开车门，我们一头钻进了车里。车里既没有驾驶室和司机，也没有方向盘、挡把和脚踏板。一个温柔的声音从车里问候我们：“早上好！请问你们想去哪里？”我们说出了自己要去的地方后，这个温柔的声音又说：“请系好安全带，我们就要出发了。今天路况良好，10分钟后就可以到达。”话音刚落，就在我们系好安全带的一瞬间，车子自己就缓缓开动了。


    车里的我们开口说：“请让我们看看今天的新闻视频。”


    我们眼前的车窗立刻变成了一块屏幕，新闻视频自动显示在了上面。


    不一会儿，目的地到了，车门又自动打开。我们下车时，车里又响起了那个温柔的声音：“祝你们愉快！我会再来接你们的。”


    自动驾驶已经不再是科幻小说中的一个场景。我们这里所说的一切很可能就发生在不远的明天。我们不用考驾照，不用雇司机，直接告诉汽车我们要去哪里，汽车就自己载着我们前往，不用担心走错路，不用担心警察开罚单，我们还能在行车之时看书、打游戏、看电视剧甚至睡大觉，相信每个人都会为此兴奋不已。


    ## 8.4 做狗也疯狂


    大狗是美国波士顿动力公司于2005年开发的一款四足机器狗。其实在开发之初，波士顿动力公司受美国国防部高级研究计划局的资助，想开发一种可以像骡子一样驮运物品、在战场上随士兵一起行动的机器人，因为具有轮子的车辆在崎岖复杂的地理条件下并不是十分理想的选择。用四足代替轮子，可以更加灵活地应对陡峭的山路、丛林和河床复杂的溪流。

    '
  trans: '

    于是，他决定买下德沃尔的专利，将德沃尔的发明投入应用，来生产取代人力劳动的机器人。恩格尔伯格把自己的想法告诉了德沃尔，德沃尔也十分愿意。1957 年，恩格尔伯格拉到了
    300 万美元的天使投资，两人合作创立了 Unimation 公司，这是世界上第一家机器人生产公司。1959 年，一个重达 2 吨但精度达 0.0025 毫米的庞然大物诞生了，这就是世界上第一台工业机器人尤尼梅特（Unimate）。


    ![](img/figure_0142_0091.jpg)


    德沃尔


    1966 年，恩格尔伯格带着最新一代的尤尼梅特机器人上了美国最热门的晚间电视节目《今夜秀》，让它对着全美观众表演高尔夫球推杆、倒啤酒、指挥乐队等有趣动作。恩格尔伯格一夜成名，被称为“工业机器人之父”。


    1983 年，恩格尔伯格和他的同事将 Unimation 公司卖给了西屋公司，并创建了 TRC 公司，开始研制服务机器人，把机器人推向更广阔的应用领域。1988
    年，恩格尔伯格的护士助手医疗机器人上市。依靠大量的传感器，护士助手医疗机器人能够在医院中自由行动，协助护士提供送饭、送药和送信等服务，好似电影《超能陆战队》中的“大白”。


    机械手主要由执行机构、驱动机构和控制系统三大部分组成。机械手的执行机构分为手部、手臂和躯干。手臂的内孔中装有传动轴，可把动力传递给手部，实现转动手腕、伸缩手指的功能。机械手手部的构造模仿了人的手指，分为无关节、固定关节和自由关节
    3 种，可根据夹持对象的形状和大小，配备多种形状和大小的夹头以满足操作的需要。而没有手指的手部一般由真空吸盘或磁性吸盘来完成抓取功能。手臂的作用是引导手指准确地抓住工件，并将其运送到所需的位置上。躯干是安装手臂、动力源和各种执行机构的支架。


    ![](img/figure_0143_0092.jpg)


    机械手


    机械手所用的驱动机构主要有液压驱动、气压驱动、电气驱动和机械驱动几种，其中液压驱动和气压驱动用得最多。在液压驱动式机械手中，通常由液压驱动机、伺服阀、油泵、油箱等组成驱动系统，驱动机械手的执行机构进行工作。它具有很大的抓举能力，对付几百千克的重物都不在话下。在气压驱动式机械手中，驱动系统通常由汽缸、气阀、气罐和空气压缩机组成，动作迅速，结构简单，造价较低，维修方便，但难以进行速度控制，气压也不可太高，故抓举能力有限。电气驱动是机械手中应用得最多的一种驱动方式，因为电源使用方便，响应快，驱动力较大（关节型可持重
    400 千克），信号检测、传动、处理都很方便，并可采用多种灵活的控制方案。


    机械手的控制参数包括工作顺序、到达位置、动作时间、运动速度、加减速等。机械手的控制方式分为点位控制和连续轨迹控制两种。控制系统可根据动作的要求，采用数字顺序控制方式，通过编程加以存储，然后根据规定的步骤执行相应的程序来完成控制任务。


    国际标准化组织采纳了美国机器人学会给机器人下的定义：“一种可编程和多功能的操作机，或为了执行不同的任务而具有可用计算机对动作进行改变和编程的专门系统。”


    从 20 世纪 70 年代开始，除了美国，日本和欧洲的机器人工业也有了快速发展。根据国际机器人联合会发布的《2012 年世界机器人研究报告》，到 2011
    年底，已有超过 100 万个工业机器人在世界各地的工厂中服务。今天工业机器人更是无所不在，无人车间、无人工厂已经开始普及。


    当然，大多数工业机器人还不会行走，早期的机械手也都是些老老实实地待在工位上勤勤恳恳地干着固定工作的大家伙。前文曾介绍过，第一个可以自由行走的通用机器人是由美国斯坦福研究所在
    1968 年开发研制的。由于它移动起来摇摇晃晃，所以被命名为沙克依。沙克依是首台全面应用人工智能技术的移动机器人，能够自主进行感知、环境建模、行为规划并执行任务。它装备了电子摄像机、三角测距仪、碰撞传感器以及驱动电机，并通过无线通信系统由两台计算机进行控制。当时计算机的运算速度非常慢，导致沙克依往往需要数小时的时间来感知和分析环境以及规划行动路径。虽然今天看起来沙克依简单而又笨拙，但在研制沙克依的过程中获得的各种技术成果影响了很多后续的研究。


    在仿人机器人方面，日本走在世界前列。1973 年，日本早稻田大学的加藤一郎教授研发出了第一台用双脚走路的机器人 WABOT-1，加藤一郎后来被誉为“仿人机器人之父”。在他的影响下，日本的很多大企业也投入到了仿人机器人和娱乐机器人的开发中，比较著名的产品有本田公司的仿人机器人
    ASIMO 和索尼公司的机器宠物狗 AIBO。


    1998 年，丹麦乐高公司推出了“头脑风暴”机器人套件。使用套件中的机器人核心控制模块、电机和传感器，孩子们也能走进机器人的世界，可以自行设计各种像人、像狗甚至像恐龙的机器人，然后动手像搭积木一样把它拼装出来，并可通过简单编程让机器人做各种动作。机器人已经全面走入我们的生活，从生产到娱乐，从教育到服务。我们离创造出科幻大片中的机器人的时刻已经不远了。


    ![](img/figure_0145_0093.jpg)


    乐高公司的“头脑风暴”机器人套装


    ## 8.2 科幻作家阿西莫夫和著名的机器人三定律


    随着人工智能的飞速发展，机器人的功能越来越强大，有人担心有一天机器人会不会取代人类而主宰地球的命运？好莱坞大片更是把这种担心在屏幕上变成了惊悚的场景和令人恐惧的灾难，在电影《黑客帝国》中人工智能计算机就统治了整个世界。其实，科幻作家阿西莫夫很早就意识到了这个问题，他著名的机器人三定律就是他为机器人制定的“道德底线”。


    艾萨克·阿西莫夫出生在莫斯科西南约 400 千米的一个名叫彼得罗维奇的小村庄里。他的父母是犹太人，家庭非常普通，他在两岁的时候差点死于肺炎，据说他是当地肺炎流行时唯一幸存下来的孩子。后来，全家人在阿西莫夫定居于美国的舅舅的帮助下，几经周折来到美国。到达美国后，他的父母开了一家糖果店维生。


    ![](img/figure_0145_0094.jpg)


    阿西莫夫


    少年时代的阿西莫夫是个超级神童，智商高达 160，多次跳级，考试总是第一，是个名副其实的学霸，但也是个捣蛋鬼，让老师头疼不已。11 岁时，他爱上了写作，不过和所有初出茅庐的作者一样，他频繁遭遇退稿。他在
    15 岁时考入美国哥伦比亚大学，然后一路读到博士。在求学期间，阿西莫夫终于发表了他的第一篇科幻小说《逐出灶神星》，紧接着发表了《致命的武器》《趋势》等作品。他用自己的文字征服了读者，也用稿费收入支付了自己的学费，从而减轻了家里的负担。


    他从小就深刻理解病痛、种族问题和世俗生活的艰难，这些都影响了他的创作，让他的作品中总是带有浓厚的人文情怀和对民主、科学、环保的关注。在哥伦比亚大学读研究生期间，成绩优异的他又发表了《我，机器人》等作品，几次荣获雨果奖和星云奖。他的才华和成就让他成为了美国科幻小说作家、科普作家和文学评论家，是美国科幻小说黄金时代的代表人物之一。


    他一生著书近 500 本，题材涉及自然科学、社会科学和文学艺术等许多领域，与儒勒·凡尔纳和乔治·威尔斯并称为科幻历史上的三巨头。他还是著名的门萨俱乐部的会员，后来担任副会长。他的作品“基地系列”“银河帝国三部曲”和“机器人系列”被誉为“科幻圣经”。


    就在阿西莫夫顺利取得了硕士学位并马上开始申请哥伦比亚大学的博士课程那一年，他发表了短篇小说《转圈圈》，首次在书中提出了著名的机器人三定律，为规范机器人的行为提出了自己的看法。这后来成为了“现代机器人学的基石”。


    机器人三定律为机器人订下了这样的行为准则。


    （1）机器人不能伤害人类，或者目睹人类个体将遭遇危险而袖手旁观。


    （2）机器人必须执行人类的命令，除非这些命令与第一条定律相抵触。


    （3）机器人在不违背第一、二条定律的情况下要尽可能保护自己的生存。


    1985 年，阿西莫夫出版了“机器人系列”的最后一部作品《机器人与帝国》。在这部书中，他提出了凌驾于机器人三定律之上的第零定律：机器人必须保护人类的整体利益不受损害，其他三条定律只有在这一前提下才能成立。


    阿西莫夫对人文主义抱有严肃的态度，他经常发表与其相关的演说并写文章甚至著书来探讨。他把科学看作地球上伟大而统一的原则。他利用科幻小说这种特殊的文学形式，在普及科学知识的同时，促使人们去考虑人类与科技、历史等各方面的关系，考虑人类与整个社会的协调发展。晚年时，他担任了美国人文主义学会的主席，直到他去世。


    机器人真的会超越人类吗？如果这真的会发生，那将是什么时候呢？发生了以后，人类又将如何与机器人相处呢？要想回答这些问题，我们先要了解今天的人工智能到底有多“聪明”，人工智能到底会发展到什么程度，什么样的人工智能会让机器人超出人类的控制范围而给人类带来威胁。让我们先厘清一下有关不同层级人工智能的几个基本定义。


    人工智能可以分为 3 个层级。第一个层级叫弱人工智能，也称为限制领域人工智能或应用型人工智能。在这个层级上，人工智能专注于解决特定领域的问题。今天我们看到的所有人工智能都属于弱人工智能的范畴，如谷歌的阿尔法狗就是一个很好的实例。它的能力仅限于围棋，下棋时还需要人帮忙摆棋子。它自己连从棋盒里拿出棋子并将其置于棋盘之上的能力都没有，更别提下棋前向对手行礼、下棋后一起复盘等围棋礼仪了。显然，这样的人工智能技术对人类来说还谈不上什么大的威胁。


    人工智能的第二个层级叫强人工智能，又称通用人工智能或完全人工智能。在这个层级上，人工智能可以胜任人类的所有工作。人可以做什么，强人工智能就可以做什么。能否通过图灵测试是强人工智能的一个实践性标志。一旦实现了符合这一描述的强人工智能，我们几乎可以肯定，所有人类工作都可以由人工智能来做。机器人为我们服务，每台机器人也许可以一对一地接替每个人类个体的具体工作，人类则获得完全意义上的自由，不再需要劳动。但目前我们还没有达到这样的水平。但它对人类可能带来的威胁是不言而喻的。


    人工智能的第三个层级叫超人工智能，也就是说在这个层级上，人工智能已经全面超过人类智能。这样的人工智能不但有意识和情感，而且有思想和意志。牛津大学哲学家、未来学家尼克·波斯特洛姆在他的《超级智能》一书中将超人工智能定义为“在科学创造力、智慧和社交能力等每一方面都比最强大的人类大脑聪明得多的智能”。显然，对今天的人类来说，这是一种完全存在于科幻电影中的场景。但不难想象，如果人工智能发展到这一水平，人类被灭绝可能就是很容易的事情。


    显然，如果对人工智能会不会挑战和威胁人类有所担忧的话，我们担心的就是这里所说的强人工智能和超人工智能。我们到底该如何看待强人工智能和超人工智能呢？它们会像阿尔法狗那样以远超我们预料的速度降临世间吗？


    今天，关于超人工智能是否会到来和何时到来，学者们众说纷纭。悲观者认为技术加速发展的趋势无法改变，超越人类智能的机器将在不久的未来得以实现，那时的人类将面临生死存亡的重大考验。而乐观主义者则更愿意相信，人工智能在未来相当长的一个历史时期都只是人类的工具，很难突破超人工智能的门槛。


    技术在今天正以日新月异的速度发展着。关于人工智能的未来，目前还没有统一的看法，但有一点是肯定的，那就是技术正在深刻地改变着人类的生活、生产和生存方式。这种深刻的变革已经并将不断地挑战人类的智慧和未来。


    ## 8.3 一辆不用司机驾驶的汽车


    20 世纪 60 年代初，斯坦福大学机械工程专业的一个名叫詹姆斯的研究生鼓捣出了一个有 4 个轮子、可以在电视摄像机和无线电信号控制下自动行驶的电瓶车。虽然它的速度只有
    0.3 千米/小时，但这毕竟是一次关于自动驾驶电动车的最初尝试。


    ![](img/figure_0148_0095.jpg)


    斯坦福电瓶车


    不久，斯坦福大学人工智能实验室主任厄纳斯特和电子工程专业的博士生史密斯也加入了研究之中。他们对詹姆斯的电瓶车做了些改进。在实验室四周的道路上，这辆电瓶车可以沿着一条白线，在交通信号灯的控制下，以
    1.3 千米/小时的速度自动行驶。他们的成果引起了人工智能专业其他研究生的兴趣，他们纷纷参与到了研究之中。


    不过，实验也并不都是一帆风顺的。一次，电瓶车撞到了一个出口的路肩上，电瓶中的液体都漏了出来。这个电瓶车成为了美国研究如何从地球上控制月球车的一个模拟器。


    1986 年，美国卡内基·梅隆大学计算机科学学院机器人研究中心的研究人员在一辆雪佛兰汽车上安装了 3 台 Sun 工作站、一台由该大学自行研制的 WARP
    并行计算阵列、一部 GPS（全球定位系统）信号接收器以及其他相关的硬件单元，成功地试验了真正意义上的自动驾驶汽车。他们给这辆车起了个名字叫 NavLab，大概取意自导航实验室。这辆自动驾驶汽车可以在公路上以
    32 千米/小时的速度行驶，是真正意义上现代自动驾驶汽车的雏形。


    ![](img/figure_0149_0096.jpg)


    NavLab 1 自动驾驶汽车


    1989 年，卡内基·梅隆大学在自动驾驶系统中引进了神经网络技术，进行感知和控制单元的试验。大约在同一时期，奔驰、通用、博世、尼桑、丰田、奥迪等传统汽车行业的厂商也开始加大对自动驾驶系统的投入，陆续推出了不少原型车。


    今天，谷歌的自动驾驶汽车已经在美国的数个州获得了合法上路测试的许可，也在实际路面上积累了上百万千米的行驶经验。电动汽车先驱特斯拉更是早在 2014 年下半年就开始在销售电动汽车的同时，向车主提供可选配的名为
    Autopilot 的辅助驾驶软件。


    在辅助驾驶的过程中，计算机依靠车载传感器实时获取的路面信息和预先通过机器学习得到的经验模型，自动调整车速，控制电机、制动系统以及转向系统，帮助车辆避开来自前方和侧方的碰撞，防止车辆滑出路面，成为了驾驶员的理想助手。其实，早在
    20 世纪 20 年代，当时的主流汽车厂商就开始试验自动驾驶或辅助驾驶功能。


    在中国，国防科技大学早在 1987 年就研制出了一辆自动驾驶汽车的原型车。虽然这辆车非常小，样子也与普通汽车相去甚远，但基本上具备了自动驾驶汽车的主要组成部分。2003
    年，国防科技大学和一汽集团联合改装了一辆红旗轿车，在自动驾驶状态下最高速度可以达到 130 千米/小时，而且实现了自主超车功能。2011 年，改进后的自动驾驶红旗轿车完成了从长沙到武汉的公路测试，总里程为
    286 千米，其中人工干预的里程只有 2240 米。此外，清华大学、中国科技大学等也各自开展了自动驾驶技术的早期研究。


    被誉为谷歌自动驾驶汽车之父的塞巴斯蒂安·特龙在加入谷歌之前，就曾带领斯坦福大学的技术团队研发出了一辆名为 Stanley 的自动驾驶汽车，并参加了美国国防部高级研究计划局组织的自动驾驶挑战赛。塞巴斯蒂安·特龙主持研制的
    Stanley 汽车赢得了 2005 年美国国防部高级研究计划局自动驾驶挑战赛的冠军。


    Stanley 自动驾驶汽车使用了多种传感器组合，包括激光雷达、摄像机、GPS 以及惯性传感器。所有这些传感器收集的实时信息由超过 10 万行的软件代码进行解读、分析并完成决策。在障碍检测方面，Stanley
    自动驾驶汽车已经使用了机器学习技术。塞巴斯蒂安·特龙带领的团队也将 Stanley 自动驾驶汽车在道路测试中不得不由人类驾驶员干预处理的所有紧急情况记录下来，交给机器学习程序反复分析，从中总结出可以复用的感知模型和决策模型，用不断迭代测试、不断改进算法模型的方式，让
    Stanley 自动驾驶汽车越来越聪明。


    ![](img/figure_0151_0097.jpg)


    Stanley 自动驾驶汽车


    和人工智能一样，自动驾驶也是一个有歧义、经常被人用不同方式解读的概念。为了更好地区分不同层级的自动驾驶技术，国际自动机工程师学会（原译国际汽车工程师协会）于
    2014 年发布了自动驾驶的六级分类体系。美国国家公路交通安全管理局原本有自己的一套分类体系，但在 2016 年 9 月开始使用国际自动机工程师学会的分类标准。今天绝大多数主流的自动驾驶研究者已将国际自动机工程师学会的分类标准当作通行的分类原则。


    国际自动机工程师学会的分类标准将自动驾驶技术分为第 0 级到第 5 级共 6 个级别。在这个分类标准中，目前日常使用的大多数汽车处在第 0 级和第 1 级之间，碰撞报警属于第
    0 级技术，自动防碰撞、定速巡航属于第 1 级辅助驾驶技术，自动泊车功能介于第 1 级和第 2 级之间，特斯拉公司正在销售的 Autopilot 辅助驾驶技术属于第
    2 级。


    按照国际自动机工程师学会的标准，第 2 级和第 3 级技术之间存在相当大的跨度。使用第 1 级和第 2 级辅助驾驶功能时，人类驾驶员必须时刻关注路况，并及时对各种复杂情况做出反应。但在国际自动机工程师学会定义的第
    3 级技术标准中，监控路况的任务由自动驾驶系统来完成。这个差别是巨大的。技术人员也通常将第 2 级和第 3 级之间的分界线视作“辅助驾驶”和“自动驾驶”的区别所在。


    当然，即便按照国际自动机工程师学会的标准实现了第 3 级的自动驾驶，根据这个级别的定义，人类驾驶员也必须随时待命，准备响应系统的请求，处理那些系统没有能力应对的特殊情况。使用这个级别的自动驾驶功能时，人类驾驶员是无法在汽车上看手机、上网或玩游戏的。


    毫无疑问，自动驾驶将在不久的将来走进我们的生活。关于真正意义上的第 4 级和第 5 级自动驾驶技术什么时候可以普及，人们有各种各样的预测。百度希望到 2019
    年时将有大量的自动驾驶汽车上路进行测试，2021 年自动驾驶汽车将进入大批量制造和商用化阶段。特斯拉公司的创始人埃隆·马斯克宣布，目前上市的特斯拉汽车已经在硬件标准上具备了实现国际自动机工程师学会第
    5 级自动驾驶的能力。


    ![](img/figure_0152_0098.jpg)


    特斯拉汽车


    我们不妨想象一下，未来的某一天吃过早饭后，我们走出家门，全自动驾驶汽车正在门口等着我们。看到我们出来，它自动打开车门，我们一头钻进了车里。车里既没有驾驶室和司机，也没有方向盘、挡把和脚踏板。一个温柔的声音从车里问候我们：“早上好！请问你们想去哪里？”我们说出了自己要去的地方后，这个温柔的声音又说：“请系好安全带，我们就要出发了。今天路况良好，10
    分钟后就可以到达。”话音刚落，就在我们系好安全带的一瞬间，车子自己就缓缓开动了。


    车里的我们开口说：“请让我们看看今天的新闻视频。”


    我们眼前的车窗立刻变成了一块屏幕，新闻视频自动显示在了上面。


    不一会儿，目的地到了，车门又自动打开。我们下车时，车里又响起了那个温柔的声音：“祝你们愉快！我会再来接你们的。”


    自动驾驶已经不再是科幻小说中的一个场景。我们这里所说的一切很可能就发生在不远的明天。我们不用考驾照，不用雇司机，直接告诉汽车我们要去哪里，汽车就自己载着我们前往，不用担心走错路，不用担心警察开罚单，我们还能在行车之时看书、打游戏、看电视剧甚至睡大觉，相信每个人都会为此兴奋不已。


    ## 8.4 做狗也疯狂


    大狗是美国波士顿动力公司于 2005 年开发的一款四足机器狗。其实在开发之初，波士顿动力公司受美国国防部高级研究计划局的资助，想开发一种可以像骡子一样驮运物品、在战场上随士兵一起行动的机器人，因为具有轮子的车辆在崎岖复杂的地理条件下并不是十分理想的选择。用四足代替轮子，可以更加灵活地应对陡峭的山路、丛林和河床复杂的溪流。

    '
  toc: []
- raw: '大狗有90厘米长，75厘米高，重达110千克，看上去不像一条大狗，倒真像一匹小骡子。它由小型汽油发动机驱动，可以驮运150千克物品，以6.4千米/小时的速度行进，攀爬35度的陡坡。它的四足上装有约50个感应器，具有立体视觉系统。在身上的一台计算机的控制下，它可以完成导航、平衡和运动控制。它的四足有模拟实际生物四肢的液压关节，所以它可以坐下、站立，像动物一样行走和奔跑，摔倒以后还能自己爬起来。


    ![](images/figure_0154_0099.jpg)


    机器大狗


    大狗问世后立刻引起了不小的轰动，《华尔街日报》等各大新闻媒体争相报道。人们对大狗栩栩如生的步态和行动自如的能力惊叹不已。


    大狗的开发者叫马克·雷伯特。他早年在加州理工学院研究能跑会跳的机器人，后来跑到卡内基·梅隆大学和麻省理工学院做教授。1992年，他创立了一家专门开发机器人的公司，这就是今天的波士顿动力公司。


    有大学的优势，有军方的资助，大狗的开发一代一代地不断深入和加强。到了2012年，大狗已经可以在24小时内走完32千米的路程，而且无须加油；驮载重量也由初期的150千克提高到了180千克；视觉系统也得到了加强，并使用LIDAR感知地形。LIDAR使用脉冲激光传感器测量物体之间的距离，是许多自动驾驶车辆导航系统的重要组成部分。机器人还使用路径规划算法来跟踪其起点与目的地之间的路线。


    2013年末，波士顿动力公司发布了一段视频。在这段视频中，最新一代的大狗不但有四足，而且还添加了一只手臂，可以拾起重达23千克的物体，并将其投掷出去，威力惊人。不过，在2015年末，大狗项目的军方资助停止了。因为大狗虽然一代比一代厉害，但它也有一个致命的缺陷，那就是由汽油发动机驱动的大狗的噪声太大，不适合在战场上使用。虽然有用电动机驱动的替代版本，但毕竟功率不够，只能驮载18千克的物品，使用价值大打折扣。


    ![](images/figure_0155_0100.jpg)


    波士顿动力公司的大狗


    ![](images/figure_0155_0101.jpg)


    大狗投掷空心砖


    不过，波士顿动力公司并没有因此停止自己的研发。在大狗技术的基础上，他们进一步开发了机器豹子、机器野猫以及双足机器人等产品。他们开发的双足机器人有着非常独特的蹲伏式走路方式。它们的膝关节弯曲，躯干尽可能保持不动，这并非人类的走路方式。采用这种蹲伏式走路方式，是因为腿部保持弯曲状态可以防止跌倒。专家们除了提高类人机器人的效率外，也试图让机器人像人一样走路，让它们变得更加灵活，能够应对更加复杂的地形，甚至未来在救援行动中发挥积极作用。


    在网上可以看到这些机器人的不少视频，非常有趣。在最近的一段视频中，波士顿动力公司让他们的大狗排成两队，像狗拉雪橇一样拖动一辆集装箱式大货车。这些大狗的步调一致，齐心协力，憨态可掬。看着这些视频里的机器怪兽，不能不想起《三国演义》里诸葛亮发明的木牛流马，它们也许可以算得上这些机器大狗、机器野猫的祖先了。


    世界上所有腿足机器人的研制都受到了波士顿动力公司的启发和影响。中国机器人专家王兴兴就是大狗的粉丝。他在天使投资的助力下，在杭州创办了自己的机器人公司宇树科技。他开发的第一个四足机器人叫太空狗，灵感来自俄罗斯的太空狗，寓意走向未知。王兴兴毕业于上海大学。在读硕士研究生期间，他开发出了一个可以移动的机器走兽，并立志要开发出比波士顿动力公司的产品更简单的小型化产品来满足人们的日常需要。


    宇树科技公司自主研发了机器人的机械结构、控制系统和运动控制算法，还自行开发了定制电机、驱动器和力量感应器。他们的太空狗能在崎岖的路面上稳定行走，表现良好。对于他们开发的机器人控制算法，王兴兴曾自豪地说：“太空狗的实际表现出乎意料地好，这是数学的伟大。”


    2018年，宇树科技公司的太空狗受邀参加了在西班牙马德里召开的世界机器人大会。太空狗有幸和波士顿动力公司的大狗一起玩耍，吸引了世界同行的眼球。开发人员也有幸和机器人“大咖”马克·雷伯特进行了面对面的交流。


    做“狗”虽“疯狂”，做“人”更“风流”。2008年北京奥运会中出现过福娃机器人，它能够感应到1米范围内的游客，与人对话、摄影留念、唱歌舞蹈，还能回答与奥运会相关的问题。福娃机器人集成了先进的自动控制技术和语音技术，不仅可以用动作和表情表达自己的状态，还能用汉语、英语等语言进行简单的人机对话。“我是奥运福娃欢欢，我最喜欢红色……”它的声音充满童真。当你问“你叫什么名字”时，它会说“我叫欢欢”；如果你问“北京奥运会是在哪一天开幕的”，它则回答“2008年8月8日”。


    今天我们可以看到各种各样的机器动物、机器人，它们生动活泼，功能各异，为我们的生活和工作带来了越来越多的帮助和乐趣。


    ![](images/figure_0156_0102.jpg)


    宇树科技公司的太空狗


    ## [8.5 硅谷奇人“钢铁侠”](../contents/content.xhtml#toc54)


    在美国硅谷的旧金山湾区，有一个被誉为当今“钢铁侠”的科技风云人物，他就是特斯拉电动汽车的发明人、大名鼎鼎的埃隆·马斯克。如果你以为他只发明了特斯拉电动汽车，那么你就太不了解他了。他的发明上至太空，下至水底，高铁对于他来说已经是太传统和老旧的东西了。对于人工智能，他的思考更加超前。


    2008年，美国大片《钢铁侠》风靡全球。片中主角托尼·史塔克身着高科技铁甲，上天入地，保卫地球。协助史塔克的智能机器人贾维斯也超级聪明能干，和美丽的女助理“小辣椒”一起成为史塔克的左膀右臂。据创作《钢铁侠》漫画的斯坦·李介绍，“钢铁侠”的原型人物是20世纪美国著名企业家霍华德·休斯。曾经在好莱坞电影《飞行家》中出演休斯的著名影星迪卡普里奥这么评价过他：“霍华德·休斯的一生是我所看到的最跌宕起伏、离奇诡异的。他什么都经历过了，与疾病斗争，受强迫症困扰，成为飞行冠军，成为美国首位亿万富翁，转向好莱坞，成为与电影体制对着干的制片人，与大财团和垄断者抗争，甚至与参议员反目。他从来不能和一个女人天长地久，因为他总是不自觉地把面前的女人看成他的飞机，他始终希望能有飞得更快、更平滑的飞机，还要有更大的涡轮。”今天的马斯克也是这样一位富有、充满传奇色彩和饱受争议的天才人物。


    马斯克，1971年出生于南非。10岁时，他就开始自学编程。12岁时，他成功设计出一款游戏，并以500美元的价格卖出，展现了他在科技和商业方面的才华。1995年，马斯克毕业于美国宾夕法尼亚大学，拿到物理学和经济学的双学位，然后进入斯坦福大学攻读应用物理学博士学位。但是没过多久，他便痴迷于硅谷的创业氛围，不想把时间和精力浪费在死板的学业上，于是申请退学，走上创业之路。


    马斯克创业的第一步是和他的弟弟金博尔·马斯克合伙创立了一个帮助企业发布商品信息和地图位置的公司，后来以3亿美元卖给了康柏公司，淘到了他的第一桶金。接着他投资创立了电子支付公司，不久与彼得·蒂尔等人创立的公司合并，成为后来大名鼎鼎的PayPal公司。2002年，eBay以15亿美元收购了PayPal，马斯克分到1.8亿美元。有钱更疯狂，他开始更加大胆地把他改变世界的梦想付诸实践。从移民火星到清洁能源，从自动驾驶电动汽车到管道极速电磁列车，他的梦想一个比一个更令人瞠目结舌。


    2002年6月，为了帮助人类实现移民火星的梦想，马斯克成立了他的第三家公司SpaceX，并亲自出任首席执行官和技术总监。经过多次失败之后， SpaceX公司终于成功地发射了可以重复使用的“猎鹰9号”火箭和航天飞机“龙飞船”，还把他的特斯拉汽车送上了太空，让特斯拉遨游宇宙，俯瞰天下。火箭的重复使用极大地降低了航天事业的成本。


    2004年，马斯克投资了专注于研制纯电动汽车的特斯拉公司。在马斯克的领导下，特斯拉公司建设了号称全球最智能的全自动化生产工厂。在工厂的冲压生产线、车身中心、烤漆中心与组装中心这四大制造环节中总共有150多台机器人参与工作。在这些车间中，机器人可以互相无缝衔接，配合工作，以至于车间里很少能看到工人。2016年11月，特斯拉公司宣布收购德国自动化生产公司，计划进一步提升生产线的自动化水平。2017年4月，特斯拉公司的市值达到500亿美元，一度超过了百年老店通用汽车和福特汽车。


    特斯拉汽车不但可以实现全电动驾驶，而且它的车载自动驾驶辅助系统是目前所有汽车里最先进的人工智能自动驾驶系统。虽然时有事故发生而招来异议，但连谷歌和苹果公司的自动驾驶研究人员也不得不承认特斯拉公司在自动驾驶技术实践上的领先优势和取得的成功。马斯克更是“口出狂言”，他说，两年之内，特斯拉全自动驾驶电动车将取代目前的出租车。特斯拉大型货车也已经开始投产。


    对于人工智能，马斯克一方面把它具体应用在自己的发明创造中，另一方面又深深地为这样的技术发展可能给人类造成的威胁而担忧。马斯克曾公开表示：“如果让我猜对人类生存最大的威胁，我认为可能是人工智能。因此，我们需要对人工智能保持万分警惕，研究人工智能如同在召唤恶魔。”为了有效地把握人工智能这把双刃剑，他积极投资人工智能的相关研究。


    2015年，马斯克联合了著名投资人彼得·蒂尔和其他一些硅谷大亨，共同投资10亿美元创建了人工智能非营利组织OpenAI。OpenAI大量招募人工智能领域的优秀人才，研究目标包括制造“通用”机器人和使用自然语言的聊天机器人。OpenAI把人工智能领域的研究成果开放地分享给全世界。因为马斯克认为，只有让人工智能技术普及到所有人都可以用的程度，才能有效地减轻超级智能可能会带来的威胁。


    马斯克在2016年又神秘地投资成立了另一家名叫Neuralink的公司。目前，没有人真正知道这家公司在开发什么具体的产品和研究哪一方面的技术，但据媒体的猜测，Neuralink公司正致力于一种被称为“神经蕾丝”的技术的开发，该技术将能把微小的脑部电极植入人体，并希望有朝一日能够实现对人类思维的上传和下载。这听起来和电影《阿凡达》中男主人公直接通过“神经链接”驾驭巨型飞鸟翱翔天际的科幻情景非常相像。马斯克在一次会议上曾经提到：“设想人工智能的进步速度，很显然人类将会被甩在后面。唯一的解决方案就是建立一种‘直接皮质界面’，在人类大脑中植入芯片。你可以将其理解为植入人类大脑内部的人工智能，通过这种方式来大幅度提升人类大脑的功能。”马斯克不否认Neuralink公司承载了他希望通过植入人脑芯片实现人类与计算机“共生”的梦想。


    钢铁奇侠马斯克的神奇故事还远没有结束，具有奇思妙想而又勇于实践的他在未来会有更多的精彩呈现给大家。让我们拭目以待吧。


    # [第9章 数据，数据，还是数据](../contents/content.xhtml#toc55)


    ## [9.1 什么是数据](../contents/content.xhtml#toc56)


    数据，在英文中叫Data。这个词最早出现在17世纪40年代。安德鲁斯·奥宗是法国17世纪著名的天文学家，他用自己发明的天文望远镜发现了彗星，后来他移居意大利的罗马，打算建造一个300米长的光学天文望远镜，用来观察月球上的动物。为了向英国和法国的皇家学会展示他的天文望远镜的技术细节和他对星体运动轨迹的观察，他发明了用表格来记录和表示数据的方法，促成了早期“数据”一词及其概念的产生和形成。


    1880年，美国工业革命的爆发促使了第一次人口普查的开展，人口状况变成了数据，极大地促进了美国经济的发展。然而由于当时计算机还没有出现，人口数据的统计和分析工作完全由手工完成，这让美国花费了7年时间才最终形成了人口普查报告。为了缩短时间，1890年赫尔曼·霍利里斯（又译何乐礼）发明了一种列表机。这种机器可以系统地处理记录在一种打孔卡片上的数据。由于他的发明，1890年的人口普查只花了18个月就完成了。他发明的这种打孔卡片也成为了后来发明的计算机输入数据的一种方式。


    ![](images/figure_0161_0103.jpg)


    安德鲁斯·奥宗的数据表


    机器计算设备根据它们表示数据的方式而有不同的划分。模拟计算机用电压、位置和距离等物理量来表示数据，数字计算机则通过对数据进行数字编码来表示数据。根据编码方法的不同，又可以有不同的表示方法。而革命性的突破是莱布尼茨二进制的发明，它不但简单，而且让数字编码、逻辑系统和电子信号脉冲的物理形式有机地联系起来，使电子计算机的发明成为可能。


    二进制数据是用0和1两个数码来表示的数。它的基数为2，进位规则是“逢二进一”，借位规则是“借一当二”。数据在计算机中主要是以补码的形式进行存储的。计算机中的二进制是一个非常微小的开关，用“开”来表示1，“关”来表示0。因为它只使用0和1两个数字符号，非常简便，易于用电子方式实现。电子数字计算机用于识别和处理由0和1符号串组成的代码，其运算模式就是二进制。


    ![](images/figure_0162_0104.jpg)


    二进制加法运算


    ASCII码就是一种被普遍采用的英文字符信息编码方案，它用8位二进制数表示各种字母和符号。例如，用01000001表示A, 01000010表示B。1980年，中国为6763个常用汉字制定了编码，称为《信息交换用汉字编码字符集
    基本集》，标准号为GB 2312—1980，每个汉字占16位。计算机的一个存储单元（即一个字节）里存放的究竟是英文还是汉字，它们都由程序进行识别。例如，表示英文字符的8位二进制编码的最高位是0，而表示汉字的两个8位二进制编码的最高位是1，这样程序就能区别存储单元里存放的是英文还是汉字。


    随着电子计算机的发明，用只有0和1的二进制来表示任何数据成为现实。1946年，“数据”一词被用来描述可以传输和存储的计算机信息。1947年，约翰·图基把用0和1在计算机里表示数据的单位命名为“位”（bit）。二进制编码是计算机内部用来表示信息的一种手段，人们平常和计算机打交道时，根本不用理会它。我们仍然用人们习惯的方式输入或者输出信息，其中的转换都是由计算机自动完成的。人工智能大师香农在他于1948年发表的论文《通信的数学理论》中正式使用“数据”一词，而“数据处理”一词的首次使用是在1954年。1977年，图基在他出版的《探索性数据分析》中，强调了数据和数据处理的重要性。


    计算机是处理信息的机器，信息处理的前提是信息的表示。计算机内信息的表示形式是二进制数字编码。也就是说，各种类型的信息，无论是数值、文字还是声音、图像都必须转换成数字（即二进制编码的形式），才能在计算机中进行处理。移动一下鼠标，按一下键盘，你的每一个动作最后到了计算机里也都变成了0和1，只用这两个数字就能弄出这么完美的东西来，这就是智慧的结晶。即使功能再强大的计算机系统（在软件和系统的层层叠加下，我们根本就不了解计算机内部的数据）也只是0和1两个状态的组合而已。


    ![](images/figure_0163_0105.jpg)


    图基的文章《探索性数据分析》


    数据和信息（或知识）常常被人们混用，但其实它们的含义并不相同。数据只有在被分析后或在具体的内容下才成为信息。数据的概念通常和科学研究联系在一起，它是一个可以包罗万象的收集内容的集合。数据具有可收集、可衡量与分析、可报告等特点，同时数据还可以用图表等可视化工具表示出来。原始数据是被收集来之后没有进行过整理的数据，可能是杂乱无章甚至含有错误的数据。这样的数据需要进行不同的整理之后才能加以利用。整理以后的数据叫已处理数据。今天，数据已经完全数字化，并大规模地通过计算机进行处理和存储。数据正在像18世纪的石油对于经济发展的重要性一样，成为主宰和决定今天数字经济发展的“新能源”。


    1974年，丹麦计算机科学家彼得·诺尔在瑞典和美国出版了他的名作《计算机方法的简明调查》。这本书是对现代数据处理方法的一个全面总结，对现代数据和数据处理的概念做了进一步的总结。他说：“数据是一种用来交流和可被一些程序处理的对事实或看法的形式化表示。”他还在书中正式提出了“数据科学”的概念。他把数据科学定义为“一门关于表达特定领域里的数据的学问”。1977年，国际统计计算学会正式成立，把传统的统计方法、现代计算机技术和专业领域的知识结合起来，以达到把数据转换为信息和知识的目的。


    真正的数据和数据处理的转折点出现在20世纪80年代，关系数据库的发明和数据库存取检索语言的出现让数据的深入和广泛应用成为可能。各行各业都把自己的数据装进计算机系统，凭借数据库来存储、管理、分析和处理数据，各种各样的建立在数据库基础上的应用也应运而生，极大地促进了科学研究、金融贸易、生产管理和经济生活的发展。数据不再是孤立、零散和让人费时费力的东西，而在集中、便捷和快速的处理下，向人们展现出前所未有的价值和曾经深藏不露的魅力。


    ## [9.2 互联网的诞生](../contents/content.xhtml#toc57)


    数据通信的概念远早于计算机的发明，它让数据通过像无线电或通信电缆这样的电磁介质在两个不同的地方相互传输。电报、传真都是这样的早期通信系统，它们的特点是只能在两台设备间进行点对点的数据传输。香农是通信理论的开创人，建立了以通信理论为基础的信息论。


    早期的计算机系统是一个中央处理系统，它通过外挂的终端设备输入和输出信息。虽然这种点对点的通信方式可以让两台远程设备连接起来，但并不能让任意两台设备自由通信，并且在两台设备间必须有一条固定的物理连线，所以还称不上互联网络。


    1960年1月，一个叫李克里德的美国心理学家和计算机科学家发表了一篇关于全球网络的论文，提出了让在不同地方的不同计算机通过网络连接起来传输信息的设想。1962年8月，他和另外一名科学家再次共同发表论文，把这一设想具体化。同年10月，美国国防部高级研究计划局雇用了李克里德，让他把国防部位于不同地方的大型计算机系统连接起来。他开始正式领导一个研究小组，进行分布式网络技术的研究工作，并在位于加州圣莫尼卡的系统开发公司、加州大学伯克利分校和麻省理工学院分别安装了一台互相联通的网络终端。这成为了互联网最早的雏形。


    如何把不同的物理网络连接成一个逻辑网络是网络通信的首要问题。早期网络使用的信息交换系统存在一个节点故障导致整个信息传输失败的问题。英国国家物理实验室的计算机科学家唐纳德·戴维斯提出了一种被称为包交换的网络通信方法。他把要传输的信息分成一个一个片段分别进行传输，这大大提高了传输的灵活性和效率。美国工程师斯拉里·罗伯茨利用唐纳德·戴维斯的包交换方法，开发了第一个成功实现的互联网——ARPANET。


    1969年10月29日22点30分，ARPANET成功地把坐落在洛杉矶的加州大学洛杉矶分校和位于旧金山湾区的斯坦福研究院联通。计算机教授李奥纳多从加州大学洛杉矶分校向斯坦福研究院发送了第一条信息。


    他一边在他的终端上输入“Lee”（李）一边通过电话问对方：“你看到我输入的‘Lee’了吗？”


    对方在电话里答道：“看到了，我们看到了。”


    李奥纳多又兴奋地输入一个“O”，然后通过电话问：“你看到我输入的‘O’了吗？”


    对方答道：“看到，我们看到‘O’了。”


    李奥纳多继续输入“G”，可这时系统垮掉了。但不管怎么说，他们成功了！'
  fmt: '

    大狗有90厘米长，75厘米高，重达110千克，看上去不像一条大狗，倒真像一匹小骡子。它由小型汽油发动机驱动，可以驮运150千克物品，以6.4千米/小时的速度行进，攀爬35度的陡坡。它的四足上装有约50个感应器，具有立体视觉系统。在身上的一台计算机的控制下，它可以完成导航、平衡和运动控制。它的四足有模拟实际生物四肢的液压关节，所以它可以坐下、站立，像动物一样行走和奔跑，摔倒以后还能自己爬起来。


    ![](images/figure_0154_0099.jpg)


    机器大狗


    大狗问世后立刻引起了不小的轰动，《华尔街日报》等各大新闻媒体争相报道。人们对大狗栩栩如生的步态和行动自如的能力惊叹不已。


    大狗的开发者叫马克·雷伯特。他早年在加州理工学院研究能跑会跳的机器人，后来跑到卡内基·梅隆大学和麻省理工学院做教授。1992年，他创立了一家专门开发机器人的公司，这就是今天的波士顿动力公司。


    有大学的优势，有军方的资助，大狗的开发一代一代地不断深入和加强。到了2012年，大狗已经可以在24小时内走完32千米的路程，而且无须加油；驮载重量也由初期的150千克提高到了180千克；视觉系统也得到了加强，并使用LIDAR感知地形。LIDAR使用脉冲激光传感器测量物体之间的距离，是许多自动驾驶车辆导航系统的重要组成部分。机器人还使用路径规划算法来跟踪其起点与目的地之间的路线。


    2013年末，波士顿动力公司发布了一段视频。在这段视频中，最新一代的大狗不但有四足，而且还添加了一只手臂，可以拾起重达23千克的物体，并将其投掷出去，威力惊人。不过，在2015年末，大狗项目的军方资助停止了。因为大狗虽然一代比一代厉害，但它也有一个致命的缺陷，那就是由汽油发动机驱动的大狗的噪声太大，不适合在战场上使用。虽然有用电动机驱动的替代版本，但毕竟功率不够，只能驮载18千克的物品，使用价值大打折扣。


    ![](images/figure_0155_0100.jpg)


    波士顿动力公司的大狗


    ![](images/figure_0155_0101.jpg)


    大狗投掷空心砖


    不过，波士顿动力公司并没有因此停止自己的研发。在大狗技术的基础上，他们进一步开发了机器豹子、机器野猫以及双足机器人等产品。他们开发的双足机器人有着非常独特的蹲伏式走路方式。它们的膝关节弯曲，躯干尽可能保持不动，这并非人类的走路方式。采用这种蹲伏式走路方式，是因为腿部保持弯曲状态可以防止跌倒。专家们除了提高类人机器人的效率外，也试图让机器人像人一样走路，让它们变得更加灵活，能够应对更加复杂的地形，甚至未来在救援行动中发挥积极作用。


    在网上可以看到这些机器人的不少视频，非常有趣。在最近的一段视频中，波士顿动力公司让他们的大狗排成两队，像狗拉雪橇一样拖动一辆集装箱式大货车。这些大狗的步调一致，齐心协力，憨态可掬。看着这些视频里的机器怪兽，不能不想起《三国演义》里诸葛亮发明的木牛流马，它们也许可以算得上这些机器大狗、机器野猫的祖先了。


    世界上所有腿足机器人的研制都受到了波士顿动力公司的启发和影响。中国机器人专家王兴兴就是大狗的粉丝。他在天使投资的助力下，在杭州创办了自己的机器人公司宇树科技。他开发的第一个四足机器人叫太空狗，灵感来自俄罗斯的太空狗，寓意走向未知。王兴兴毕业于上海大学。在读硕士研究生期间，他开发出了一个可以移动的机器走兽，并立志要开发出比波士顿动力公司的产品更简单的小型化产品来满足人们的日常需要。


    宇树科技公司自主研发了机器人的机械结构、控制系统和运动控制算法，还自行开发了定制电机、驱动器和力量感应器。他们的太空狗能在崎岖的路面上稳定行走，表现良好。对于他们开发的机器人控制算法，王兴兴曾自豪地说：“太空狗的实际表现出乎意料地好，这是数学的伟大。”


    2018年，宇树科技公司的太空狗受邀参加了在西班牙马德里召开的世界机器人大会。太空狗有幸和波士顿动力公司的大狗一起玩耍，吸引了世界同行的眼球。开发人员也有幸和机器人“大咖”马克·雷伯特进行了面对面的交流。


    做“狗”虽“疯狂”，做“人”更“风流”。2008年北京奥运会中出现过福娃机器人，它能够感应到1米范围内的游客，与人对话、摄影留念、唱歌舞蹈，还能回答与奥运会相关的问题。福娃机器人集成了先进的自动控制技术和语音技术，不仅可以用动作和表情表达自己的状态，还能用汉语、英语等语言进行简单的人机对话。“我是奥运福娃欢欢，我最喜欢红色……”它的声音充满童真。当你问“你叫什么名字”时，它会说“我叫欢欢”；如果你问“北京奥运会是在哪一天开幕的”，它则回答“2008年8月8日”。


    今天我们可以看到各种各样的机器动物、机器人，它们生动活泼，功能各异，为我们的生活和工作带来了越来越多的帮助和乐趣。


    ![](images/figure_0156_0102.jpg)


    宇树科技公司的太空狗


    ## [8.5 硅谷奇人“钢铁侠”](../contents/content.xhtml#toc54)


    在美国硅谷的旧金山湾区，有一个被誉为当今“钢铁侠”的科技风云人物，他就是特斯拉电动汽车的发明人、大名鼎鼎的埃隆·马斯克。如果你以为他只发明了特斯拉电动汽车，那么你就太不了解他了。他的发明上至太空，下至水底，高铁对于他来说已经是太传统和老旧的东西了。对于人工智能，他的思考更加超前。


    2008年，美国大片《钢铁侠》风靡全球。片中主角托尼·史塔克身着高科技铁甲，上天入地，保卫地球。协助史塔克的智能机器人贾维斯也超级聪明能干，和美丽的女助理“小辣椒”一起成为史塔克的左膀右臂。据创作《钢铁侠》漫画的斯坦·李介绍，“钢铁侠”的原型人物是20世纪美国著名企业家霍华德·休斯。曾经在好莱坞电影《飞行家》中出演休斯的著名影星迪卡普里奥这么评价过他：“霍华德·休斯的一生是我所看到的最跌宕起伏、离奇诡异的。他什么都经历过了，与疾病斗争，受强迫症困扰，成为飞行冠军，成为美国首位亿万富翁，转向好莱坞，成为与电影体制对着干的制片人，与大财团和垄断者抗争，甚至与参议员反目。他从来不能和一个女人天长地久，因为他总是不自觉地把面前的女人看成他的飞机，他始终希望能有飞得更快、更平滑的飞机，还要有更大的涡轮。”今天的马斯克也是这样一位富有、充满传奇色彩和饱受争议的天才人物。


    马斯克，1971年出生于南非。10岁时，他就开始自学编程。12岁时，他成功设计出一款游戏，并以500美元的价格卖出，展现了他在科技和商业方面的才华。1995年，马斯克毕业于美国宾夕法尼亚大学，拿到物理学和经济学的双学位，然后进入斯坦福大学攻读应用物理学博士学位。但是没过多久，他便痴迷于硅谷的创业氛围，不想把时间和精力浪费在死板的学业上，于是申请退学，走上创业之路。


    马斯克创业的第一步是和他的弟弟金博尔·马斯克合伙创立了一个帮助企业发布商品信息和地图位置的公司，后来以3亿美元卖给了康柏公司，淘到了他的第一桶金。接着他投资创立了电子支付公司，不久与彼得·蒂尔等人创立的公司合并，成为后来大名鼎鼎的PayPal公司。2002年，eBay以15亿美元收购了PayPal，马斯克分到1.8亿美元。有钱更疯狂，他开始更加大胆地把他改变世界的梦想付诸实践。从移民火星到清洁能源，从自动驾驶电动汽车到管道极速电磁列车，他的梦想一个比一个更令人瞠目结舌。


    2002年6月，为了帮助人类实现移民火星的梦想，马斯克成立了他的第三家公司SpaceX，并亲自出任首席执行官和技术总监。经过多次失败之后， SpaceX公司终于成功地发射了可以重复使用的“猎鹰9号”火箭和航天飞机“龙飞船”，还把他的特斯拉汽车送上了太空，让特斯拉遨游宇宙，俯瞰天下。火箭的重复使用极大地降低了航天事业的成本。


    2004年，马斯克投资了专注于研制纯电动汽车的特斯拉公司。在马斯克的领导下，特斯拉公司建设了号称全球最智能的全自动化生产工厂。在工厂的冲压生产线、车身中心、烤漆中心与组装中心这四大制造环节中总共有150多台机器人参与工作。在这些车间中，机器人可以互相无缝衔接，配合工作，以至于车间里很少能看到工人。2016年11月，特斯拉公司宣布收购德国自动化生产公司，计划进一步提升生产线的自动化水平。2017年4月，特斯拉公司的市值达到500亿美元，一度超过了百年老店通用汽车和福特汽车。


    特斯拉汽车不但可以实现全电动驾驶，而且它的车载自动驾驶辅助系统是目前所有汽车里最先进的人工智能自动驾驶系统。虽然时有事故发生而招来异议，但连谷歌和苹果公司的自动驾驶研究人员也不得不承认特斯拉公司在自动驾驶技术实践上的领先优势和取得的成功。马斯克更是“口出狂言”，他说，两年之内，特斯拉全自动驾驶电动车将取代目前的出租车。特斯拉大型货车也已经开始投产。


    对于人工智能，马斯克一方面把它具体应用在自己的发明创造中，另一方面又深深地为这样的技术发展可能给人类造成的威胁而担忧。马斯克曾公开表示：“如果让我猜对人类生存最大的威胁，我认为可能是人工智能。因此，我们需要对人工智能保持万分警惕，研究人工智能如同在召唤恶魔。”为了有效地把握人工智能这把双刃剑，他积极投资人工智能的相关研究。


    2015年，马斯克联合了著名投资人彼得·蒂尔和其他一些硅谷大亨，共同投资10亿美元创建了人工智能非营利组织OpenAI。OpenAI大量招募人工智能领域的优秀人才，研究目标包括制造“通用”机器人和使用自然语言的聊天机器人。OpenAI把人工智能领域的研究成果开放地分享给全世界。因为马斯克认为，只有让人工智能技术普及到所有人都可以用的程度，才能有效地减轻超级智能可能会带来的威胁。


    马斯克在2016年又神秘地投资成立了另一家名叫Neuralink的公司。目前，没有人真正知道这家公司在开发什么具体的产品和研究哪一方面的技术，但据媒体的猜测，Neuralink公司正致力于一种被称为“神经蕾丝”的技术的开发，该技术将能把微小的脑部电极植入人体，并希望有朝一日能够实现对人类思维的上传和下载。这听起来和电影《阿凡达》中男主人公直接通过“神经链接”驾驭巨型飞鸟翱翔天际的科幻情景非常相像。马斯克在一次会议上曾经提到：“设想人工智能的进步速度，很显然人类将会被甩在后面。唯一的解决方案就是建立一种‘直接皮质界面’，在人类大脑中植入芯片。你可以将其理解为植入人类大脑内部的人工智能，通过这种方式来大幅度提升人类大脑的功能。”马斯克不否认Neuralink公司承载了他希望通过植入人脑芯片实现人类与计算机“共生”的梦想。


    钢铁奇侠马斯克的神奇故事还远没有结束，具有奇思妙想而又勇于实践的他在未来会有更多的精彩呈现给大家。让我们拭目以待吧。


    # [第9章 数据，数据，还是数据](../contents/content.xhtml#toc55)


    ## [9.1 什么是数据](../contents/content.xhtml#toc56)


    数据，在英文中叫Data。这个词最早出现在17世纪40年代。安德鲁斯·奥宗是法国17世纪著名的天文学家，他用自己发明的天文望远镜发现了彗星，后来他移居意大利的罗马，打算建造一个300米长的光学天文望远镜，用来观察月球上的动物。为了向英国和法国的皇家学会展示他的天文望远镜的技术细节和他对星体运动轨迹的观察，他发明了用表格来记录和表示数据的方法，促成了早期“数据”一词及其概念的产生和形成。


    1880年，美国工业革命的爆发促使了第一次人口普查的开展，人口状况变成了数据，极大地促进了美国经济的发展。然而由于当时计算机还没有出现，人口数据的统计和分析工作完全由手工完成，这让美国花费了7年时间才最终形成了人口普查报告。为了缩短时间，1890年赫尔曼·霍利里斯（又译何乐礼）发明了一种列表机。这种机器可以系统地处理记录在一种打孔卡片上的数据。由于他的发明，1890年的人口普查只花了18个月就完成了。他发明的这种打孔卡片也成为了后来发明的计算机输入数据的一种方式。


    ![](images/figure_0161_0103.jpg)


    安德鲁斯·奥宗的数据表


    机器计算设备根据它们表示数据的方式而有不同的划分。模拟计算机用电压、位置和距离等物理量来表示数据，数字计算机则通过对数据进行数字编码来表示数据。根据编码方法的不同，又可以有不同的表示方法。而革命性的突破是莱布尼茨二进制的发明，它不但简单，而且让数字编码、逻辑系统和电子信号脉冲的物理形式有机地联系起来，使电子计算机的发明成为可能。


    二进制数据是用0和1两个数码来表示的数。它的基数为2，进位规则是“逢二进一”，借位规则是“借一当二”。数据在计算机中主要是以补码的形式进行存储的。计算机中的二进制是一个非常微小的开关，用“开”来表示1，“关”来表示0。因为它只使用0和1两个数字符号，非常简便，易于用电子方式实现。电子数字计算机用于识别和处理由0和1符号串组成的代码，其运算模式就是二进制。


    ![](images/figure_0162_0104.jpg)


    二进制加法运算


    ASCII码就是一种被普遍采用的英文字符信息编码方案，它用8位二进制数表示各种字母和符号。例如，用01000001表示A, 01000010表示B。1980年，中国为6763个常用汉字制定了编码，称为《信息交换用汉字编码字符集
    基本集》，标准号为GB 2312—1980，每个汉字占16位。计算机的一个存储单元（即一个字节）里存放的究竟是英文还是汉字，它们都由程序进行识别。例如，表示英文字符的8位二进制编码的最高位是0，而表示汉字的两个8位二进制编码的最高位是1，这样程序就能区别存储单元里存放的是英文还是汉字。


    随着电子计算机的发明，用只有0和1的二进制来表示任何数据成为现实。1946年，“数据”一词被用来描述可以传输和存储的计算机信息。1947年，约翰·图基把用0和1在计算机里表示数据的单位命名为“位”（bit）。二进制编码是计算机内部用来表示信息的一种手段，人们平常和计算机打交道时，根本不用理会它。我们仍然用人们习惯的方式输入或者输出信息，其中的转换都是由计算机自动完成的。人工智能大师香农在他于1948年发表的论文《通信的数学理论》中正式使用“数据”一词，而“数据处理”一词的首次使用是在1954年。1977年，图基在他出版的《探索性数据分析》中，强调了数据和数据处理的重要性。


    计算机是处理信息的机器，信息处理的前提是信息的表示。计算机内信息的表示形式是二进制数字编码。也就是说，各种类型的信息，无论是数值、文字还是声音、图像都必须转换成数字（即二进制编码的形式），才能在计算机中进行处理。移动一下鼠标，按一下键盘，你的每一个动作最后到了计算机里也都变成了0和1，只用这两个数字就能弄出这么完美的东西来，这就是智慧的结晶。即使功能再强大的计算机系统（在软件和系统的层层叠加下，我们根本就不了解计算机内部的数据）也只是0和1两个状态的组合而已。


    ![](images/figure_0163_0105.jpg)


    图基的文章《探索性数据分析》


    数据和信息（或知识）常常被人们混用，但其实它们的含义并不相同。数据只有在被分析后或在具体的内容下才成为信息。数据的概念通常和科学研究联系在一起，它是一个可以包罗万象的收集内容的集合。数据具有可收集、可衡量与分析、可报告等特点，同时数据还可以用图表等可视化工具表示出来。原始数据是被收集来之后没有进行过整理的数据，可能是杂乱无章甚至含有错误的数据。这样的数据需要进行不同的整理之后才能加以利用。整理以后的数据叫已处理数据。今天，数据已经完全数字化，并大规模地通过计算机进行处理和存储。数据正在像18世纪的石油对于经济发展的重要性一样，成为主宰和决定今天数字经济发展的“新能源”。


    1974年，丹麦计算机科学家彼得·诺尔在瑞典和美国出版了他的名作《计算机方法的简明调查》。这本书是对现代数据处理方法的一个全面总结，对现代数据和数据处理的概念做了进一步的总结。他说：“数据是一种用来交流和可被一些程序处理的对事实或看法的形式化表示。”他还在书中正式提出了“数据科学”的概念。他把数据科学定义为“一门关于表达特定领域里的数据的学问”。1977年，国际统计计算学会正式成立，把传统的统计方法、现代计算机技术和专业领域的知识结合起来，以达到把数据转换为信息和知识的目的。


    真正的数据和数据处理的转折点出现在20世纪80年代，关系数据库的发明和数据库存取检索语言的出现让数据的深入和广泛应用成为可能。各行各业都把自己的数据装进计算机系统，凭借数据库来存储、管理、分析和处理数据，各种各样的建立在数据库基础上的应用也应运而生，极大地促进了科学研究、金融贸易、生产管理和经济生活的发展。数据不再是孤立、零散和让人费时费力的东西，而在集中、便捷和快速的处理下，向人们展现出前所未有的价值和曾经深藏不露的魅力。


    ## [9.2 互联网的诞生](../contents/content.xhtml#toc57)


    数据通信的概念远早于计算机的发明，它让数据通过像无线电或通信电缆这样的电磁介质在两个不同的地方相互传输。电报、传真都是这样的早期通信系统，它们的特点是只能在两台设备间进行点对点的数据传输。香农是通信理论的开创人，建立了以通信理论为基础的信息论。


    早期的计算机系统是一个中央处理系统，它通过外挂的终端设备输入和输出信息。虽然这种点对点的通信方式可以让两台远程设备连接起来，但并不能让任意两台设备自由通信，并且在两台设备间必须有一条固定的物理连线，所以还称不上互联网络。


    1960年1月，一个叫李克里德的美国心理学家和计算机科学家发表了一篇关于全球网络的论文，提出了让在不同地方的不同计算机通过网络连接起来传输信息的设想。1962年8月，他和另外一名科学家再次共同发表论文，把这一设想具体化。同年10月，美国国防部高级研究计划局雇用了李克里德，让他把国防部位于不同地方的大型计算机系统连接起来。他开始正式领导一个研究小组，进行分布式网络技术的研究工作，并在位于加州圣莫尼卡的系统开发公司、加州大学伯克利分校和麻省理工学院分别安装了一台互相联通的网络终端。这成为了互联网最早的雏形。


    如何把不同的物理网络连接成一个逻辑网络是网络通信的首要问题。早期网络使用的信息交换系统存在一个节点故障导致整个信息传输失败的问题。英国国家物理实验室的计算机科学家唐纳德·戴维斯提出了一种被称为包交换的网络通信方法。他把要传输的信息分成一个一个片段分别进行传输，这大大提高了传输的灵活性和效率。美国工程师斯拉里·罗伯茨利用唐纳德·戴维斯的包交换方法，开发了第一个成功实现的互联网——ARPANET。


    1969年10月29日22点30分，ARPANET成功地把坐落在洛杉矶的加州大学洛杉矶分校和位于旧金山湾区的斯坦福研究院联通。计算机教授李奥纳多从加州大学洛杉矶分校向斯坦福研究院发送了第一条信息。


    他一边在他的终端上输入“Lee”一边通过电话问对方：“你看到我输入的‘Lee’了吗？”


    对方在电话里答道：“看到了，我们看到了。”


    李奥纳多又兴奋地输入一个“O”，然后通过电话问：“你看到我输入的‘O’了吗？”


    对方答道：“看到，我们看到‘O’了。”


    李奥纳多继续输入“G”，可这时系统垮掉了。但不管怎么说，他们成功了！

