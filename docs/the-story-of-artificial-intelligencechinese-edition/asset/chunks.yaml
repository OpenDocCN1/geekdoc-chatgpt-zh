- raw: '《纽约时报》研究与发展实验室提出了一整套新闻编码理论，这套理论以“积木式”的编辑模式改变了新闻生产和分发的所有环节，最大限度地释放了媒体人的生产力。最核心的是把可能会被重复使用的部分识别出来并加以注释，这一过程称为“文法”或“颗粒”。所有资讯的内容都被转化为了可供拼装的“颗粒”，每个部分都被重新编码，添加标签，而且是可以被嵌入的。这样新闻制作就变成了一种固定的方法。首先选定主题，然后编写搜索引擎搜取题材对应的文本数据，再通过清洗和整理数据，去除无效信息，进一步探索数据，发现其中有价值的信息，最后编写机器学习算法完成创作。


    人工智能参与的写作是“代入式”写作，也就是说人工智能进行的是程序编辑或公式编辑写作。目前，网络上有“网络小说生成器”“诗歌写作生成器”等各种文学写作程序。实际上，这些写作软件只能进行简单的文字拼接和粘贴，在程序的背后，人工智能软件中已经被“植入”了大量故事段落或者诗句资料，只要给定一个主题，它就可以在极短的时间内“运算”和“比对”出一首诗歌或者一篇小说。


    微软亚洲互联网工程院在2014年5月发布了一款人工智能机器人小冰，它凭借在大数据、自然语义分析、机器学习和深度神经网络方面的技术积累，实现了超越简单人机问答的自然交互。小冰出版过诗集《阳光失了玻璃窗》，还参加过中央电视台《机智过人》节目进行的人机诗歌写作对抗。小冰的出现引发了关于人工智能写作的争论和探讨。人们争论的焦点主要集中在人工智能是否已经发展到能够替代真正人类所开展的具有丰富想象力的文学创作活动，以及人工智能写作是否真的像人工智能专家所认为的那样具有广阔前景。


    在小冰的现代诗歌“创作”和“鉴赏”中，读者经常面临很多的“纠结”，常常误以为人工智能“创作”诗歌在有些情况下无异于诗人的创作。其实，出现这种结果主要是因为现代诗歌的基本特征和当前现代诗歌写作中所存在的问题的双重作用。现代诗歌创作与古典诗歌创作有很大的不同，现代诗歌创作没有严格的限制和约束，自由发挥的随意性很大，常常通过跳跃、断句、隐喻、象征等方式来传达朦胧、隐晦甚至诡异的诗意，诗句之间被打乱的逻辑关系常常把诗意的重构丢给读者，从而使诗意有更大的想象空间。所以，当我们选择阅读某些现代诗歌的时候，对诗意的领会就会比较“艰难”。这种“艰难”如果具有正当性，诗歌就是好作品，而有的“艰难”是接受者或创作者的水平参差不齐造成的。这正是现代诗歌在今天常常遭受读者和文学研究者“诘难”的重要原因。


    然而，这在无形中给人工智能的现代诗歌创作提供了更大的可发展性。小冰自身存储了大量现代诗句，它可以从资源库中调取、比对资源进行写作。对于单个句子，小冰的确可以完美且没有语法错误地完成创作，而且这句诗一定是“诗句”，因为它直接“借鉴”或“挪用”了经典诗歌作品中的句子。但在进行多句连读和分析时，我们发现诗歌的意境和韵味常常难以令人满意，而且诗歌写得越长，我们越能发现其中的“裂痕”和问题。从这一点上来说，诗歌以及其他诸多文体的创作活动是人类特有的表达方式，文学写作思维具有复杂性和综合性特征，而并非只是简单的逻辑推演与行动选择，故人工智能文学写作在目前的条件下不过是在玩“文字游戏”，毕竟今天的人工智能还不具有人类的情感和思想，只有“智商”而无“情商”。


    ## [7.4 从陪聊到辩论](../contents/content.xhtml#toc47)


    随着人工智能自然语言处理技术的突破，以自然语言处理技术为基础的应用如雨后春笋般产生。陪聊是最早出现的一种会话机器人。2016年，微软公司发布了一款针对青少年的名为Tay的在线聊天机器人。Tay的会话内容主要由包括即兴喜剧演员在内的人士的作品汇集而成。由于Tay对世界一无所知，并不具备独立思考能力，完全是在算法的驱动下，被动地与真人会话，很快就在一些人恶意的引诱下，表现出了极端的种族主义倾向。微软公司不得不紧急叫停。微软公司的一位副总裁急忙出来道歉，表示对未提前看到这种可能性承担全部责任。


    目前市场上已经有了各种类型的聊天机器人，比如客服机器人、儿童教育机器人、娱乐聊天机器人、家居服务机器人、车载控制机器人和全方位服务型机器人等。


    ![](images/figure_0133_0087.jpg)


    机器人


    聊天机器人可以划分为目标驱动型和无目标驱动型两种。目标驱动型聊天机器人是指聊天机器人有明确的服务目标或者服务对象，比如客服机器人、儿童教育机器人以及提供天气预报、订票、订餐等服务的机器人。这种目标驱动型聊天机器人也可以称作特定领域的聊天机器人。


    无目标驱动型聊天机器人是指聊天机器人并非为特定服务目的而开发，比如纯粹聊天机器人、娱乐聊天机器人以及计算机游戏中的虚拟人物聊天机器人都属于此类。这种无明确任务目标的聊天机器人也可以称作为开放领域的聊天机器人。


    机器人是如何与真人聊天的呢？目前聊天机器人方面的人工智能技术主要有两种：检索式和生成式。所谓检索式就是事先建立一个对话库，聊天系统接收到用户输入的句子后，在对话库中以搜索匹配的方式进行应答内容提取。这种方式简单，但对对话库的要求很高，需要对话库足够大，能够尽量多地匹配用户的提问，否则会经常出现找不到合适应答内容的情形。它的好处是一旦找到匹配的内容，应答质量高，因为对话库中的内容都是真实的对话数据，表达比较自然。


    生成式聊天机器人则是在接收到用户输入的句子后，根据对会话内容的理解和搜索，采用语句合成手段自动生成一句话作为应答。这种机器人的好处是可能覆盖任意话题的用户提问，缺点是生成的应答句子很可能存在问题，比如语句不通顺、句法错误等看上去比较低级的错误。


    在大数据和人工神经网络技术突飞猛进的今天，更多的会话机器人都具有深度学习能力，因而变得能言善辩。它们不仅可以针对用户的提问，产生和用户的问句语义一致且逻辑正确的应答，并且语法正确，对答生动有趣，具有个性，不刻板沉闷，给人一种和真人聊天一样的感觉。


    2019年2月11日，在旧金山的叶巴布纳艺术中心上演过一幕人机互怼的大戏。IBM公司研发的人工智能辩论系统和人类辩论大师哈利什·纳塔拉简进行了一场激烈、精彩的辩论。人类擅长和热衷于辩论，但在人工智能高度发展的今天，计算机也毫不逊色。


    辩论场上看上去像液晶广告牌一样的计算机就是IBM公司目前在人工智能领域里最新的研发成果——人工智能辩论系统。其实，它已经不是第一次和人类辩论了。在2018年6月的人机辩论首战中，它的两个对手都是来自以色列的顶级辩论专家，最终战绩是1胜1负。


    代表人类出战的哈利什可不是一般人，他是2012年欧洲辩论赛的冠军，取得了牛津大学政治、哲学、经济专业的学士学位以及剑桥大学的哲学和国际关系专业的硕士学位。哈利什是英国前首相卡梅伦的学弟、AKE咨询公司的经济风险主管，获得的世界级辩论奖项多得数不清了，还保持着多项辩论世界纪录。


    辩论规则很简单，在双方都没有预先准备和进行任何交流的条件下，现场公布辩题。双方都有15分钟的准备时间，开始后各有4分钟时间立论和4分钟时间反驳对方的观点，最后各有2分钟时间总结陈词，基本上遵循了传统辩论比赛的规则。胜负由旧金山湾区学校的顶尖辩手和100多名记者现场评判。在开场前，评判人员根据辩题投票选择支持正方或反方。辩论结束后再次投票，支持人数增加的一方获胜。辩论的题目是“我们是否应该让幼儿园获得补贴”。


    ![](images/figure_0134_0088.jpg)


    辩论现场


    辩论开始后，人工智能辩论系统首先用一种近乎单调的女性声音开口说：“哈利什，你好。”接着它侃侃而谈，把它的主要观点“补贴学前教育有助于打破贫困循环”说得几乎无懈可击。别看它是机器，它的措辞完整，能够旁征博引，还引用了美国疾病控制与预防中心的数据。


    接下来由人类辩手哈利什表述观点。他直接反驳人工智能辩论系统提出的“拯救贫困”的观点，针锋相对。人和机器，你来我往，唇枪舌剑，毫不相让。


    比赛之前，79%的观众同意幼儿园应该得到减免，只有13%的人反对。经过20分钟两个回合，双方分别总结陈词。最终投票结果为，IBM公司的人工智能辩论系统的支持票数降低到62%，丢掉了17%的票数。由于辩论胜负在于哪一方在辩论中获得支持的人数增加，因而人类获胜。


    人工智能辩论系统展示了人工智能会话系统已经变得越来越灵活了。人工智能已经开始从只能回答某类特定问题的聊天机器人向可以回答更广泛的、答案并不唯一的问题发展。


    “技术的发展正在突破人工智能的更多界限，让它可以更好地和我们互动，更好地理解我们。”IBM公司的达瑞欧在CNN的节目《第一步》中说。


    人工智能辩论系统是怎么辩论的呢？简单地讲，它从拿到观点到演讲分为这样几步。首先是判断观点。当操作者输入一个观点后，系统根据语义理解，自动判断该观点属于正方或反方。其次是筛选资料，在IBM公司为它构建的数据库中，找到所有可以支持这一观点的论据，并且判断论据的说服力。


    除了各种知识文献外，这个系统存储的数据资料中还有一类非常关键的内容，就是观点在社会中引起的反响，其中可能包括专家发言、民意调查、辩论赛数据等可以反映该观点说服力的数据。这也是为什么它可以在极短的时间内从各种可能的答案中选择一个比较有说服力的答案，它只需要几秒就能从数据集中发现用哪种方法说服人类更有效。


    找到了最有力的论点后，再找到支持该论点的最合适的论据，接下来就是排列组合，决定先说哪些，后说哪些，怎么说效果更好，最终形成辩论的整体逻辑。然后就到了最后一步，把这些内容变成演讲形式，并且用人类说话的方式通过语音表达出来。


    这里涉及自然语言识别、语义理解等人工智能领域里的多项技术，在几年以前几乎没有哪个科技公司能达到这种程度。这一步对人工智能来说也是很艰难的，但IBM公司的这套系统显然已经可以做到。


    这套人工智能辩论系统具有强大的语义理解和语言生成能力，应用领域包括净化网络环境、辅助语言学习，可以彻底改变人机交互方式。进一步的意义在于，它能通过不断提升数据处理能力，向医生、投资人、律师甚至执法机关和政府部门在做出重要决策时提供客观全面、无人性偏颇和不受情绪左右的建议。


    当然，目前我们看到的所有“机器独立意识”其实都只是程序员根据人类模拟出的假象，目前人工智能技术的极限还只是“解决特定问题”。人工智能辩论系统的诞生代表着人类在尝试教会机器该如何思考上的一个突破。IBM公司智能辩论系统的官网底部有这么一句话：“辩论，只是一个开始。”是啊，虽然今天人工智能辩论系统输了，但明天鹿死谁手就很难说了。


    ## [7.5 出国无须带翻译](../contents/content.xhtml#toc48)


    今天，你拿出手机，无论是扫一扫还是语音翻译，各种机器翻译软件应有尽有，让你出国不用带翻译。这是自然语言识别技术发展的结果。


    关于机器翻译的研究从20世纪三四十年代就已经开始了。一个名叫阿尔楚尼的亚美尼亚裔法国科学家最早提出了用机器进行翻译的想法。他发明了一种机械存储装置，可以容纳数千个单词，通过键盘后面的宽纸带进行资料检索。阿尔楚尼认为，它可以用来记录列车时刻表和银行账户，尤其适合作为机器词典。在宽纸带上面，每一行记录源语言的一个词项以及这个词项在多种目标语言中的对应词项，在另一条纸带上对应的词项处记录相应的代码，这些代码以打孔的方式来表示。


    1933年，他申请了翻译机的专利，把它命名为“机械脑”。机械脑于1937年正式展出，引起了法国邮政、电信部门的兴趣。但是，由于不久爆发了第二次世界大战，阿尔楚尼的机械脑只能让位于战争更紧迫的需要，无果而终。


    1954年，美国乔治城大学在IBM公司的协同下，用IBM 701计算机首次完成了英俄机器翻译试验。虽然该系统只有6条语法规则和250个单词，但它成功地向公众和科学界展示了机器翻译的可行性，从而翻开了机器翻译研究的新篇章。


    中国开始这项研究也并不晚，早在1956年国家就把这项研究列入了全国科学工作发展规划，课题名称是“机器翻译、自然语言翻译规则的建设和自然语言的数学理论”。1957年，中国科学院语言研究所与计算技术研究所合作，开展了俄汉机器翻译试验，翻译了9种不同类型的较为复杂的句子。


    然而早期的研究并不顺利。1964年，为了对机器翻译的研究进展做出评价，美国科学院成立了语言自动处理咨询委员会。开展了为期两年的综合调查、分析和测试后，他们得出的结论是机器翻译比人工翻译还要慢，而且更不准确，成本是人工翻译的两倍，毫无价值。于是在1966年11月，该委员会公布了一篇题为《语言与机器》的报告，全面否定了机器翻译的可行性，并建议停止对机器翻译项目的资金支持。这一报告的发布给了当时正在蓬勃发展的机器翻译研究当头一棒，机器翻译研究陷入了近乎停滞的僵局。


    但科学研究并没有因此停止，特别是计算机科学、语言学理论方面的研究。进入20世纪70年代以后，计算机硬件技术的快速发展以及人工智能在自然语言处理上的应用，从技术层面推动了机器翻译研究的复苏，机器翻译研究又开始活跃起来，各种实用的以及试验性的系统被先后推出。


    随着互联网的出现和普及，数据量激增，统计方法得到了充分应用。互联网公司纷纷成立机器翻译研究组，研发了基于互联网大数据的机器翻译系统，从而使机器翻译真正走向实用化，“百度翻译”“谷歌翻译”纷纷出笼。近年来，随着深度学习的发展，机器翻译技术得到了进一步的发展，促进了翻译质量的快速提升，在口语等领域的翻译更加地道流畅。


    机器翻译系统可划分为基于规则和基于语料库两大类。在基于规则的翻译中，由词典和规则库构成知识源。从美国乔治城大学的机器翻译试验到20世纪50年代末的系统，基本上都属于这一类机器翻译系统。在基于语料库的翻译中，由经过划分并具有标注的语料库构成知识源，既不需要词典，也不需要规则，以统计规律为主。


    基于统计的机器翻译方法把机器翻译看成一个信息传输过程，把源语言句子到目标语言句子的翻译看成一个概率问题。任何一个目标语言句子都有可能是任何一个源语言句子的译文，只是概率不同，机器翻译的任务就是找到概率最大的句子。具体方法是将翻译看作原文通过模型转换为译文的解码过程。因此，统计机器翻译又可以分为模型问题、训练问题和解码问题3个方面。


    所谓模型问题就是为机器翻译建立概率模型，也就是要定义源语言句子到目标语言句子的翻译概率的计算方法。训练问题是利用语料库得到这个模型的所有参数。解码问题则是在已知模型和参数的基础上，对于输入的任何一个源语言句子，去查找概率最大的译文。


    早在1949年用统计学方法解决机器翻译问题的想法就由美国数学家韦弗提出，但由于当时以乔姆斯基为首的很多人对统计方法在自然语言识别领域里的应用持批判态度，这种方法很快就被放弃了。批判的理由主要是语言是无限的，基于经验主义的统计描述无法满足语言的实际要求。另外，限于当时计算机的运算速度，统计的价值也无从显现。不过，自此就有了统计学派和符号学派在人工智能方法上的两军对垒。


    ![](images/figure_0138_0089.jpg)


    韦弗


    2016年，谷歌发布了神经机器翻译系统，使用了循环神经网络进行序列到序列的学习，大幅提高了机器翻译的水平。循环神经网络是一种深度学习算法，它让神经网络内部的所有节点都相互连接，并使用能量函数进行学习，大大强化了学习效果。神经翻译的基本单位是句子，相对于基于短语的翻译，误差率降低了60%，翻译质量得到了巨大的提升。2017年，脸书也推出了基于卷积神经网络的翻译系统。


    语言学泰斗乔姆斯基也许会问：“这种翻译算理解吗？这不过是在玩弄数据。”但也许翻译根本就不是理解的问题，不需要语义分析，而只是数据问题，是一种“经验之谈”。没有乔姆斯基，自然语言研究也许还在黑暗之中摸索，但有了乔姆斯基，是不是一定要束缚我们对其他方法的探索和尝试呢？毕竟实践是检验真理的唯一标准。


    # [第8章 机器人来啦](../contents/content.xhtml#toc49)


    ## [8.1 让机器自己工作](../contents/content.xhtml#toc50)


    美国好莱坞大片《星球大战》系列长达7集，跨越了30多年。一个名叫阿纳金·天行者的人从一名绝地武士演变成不可一世的大魔头“黑武士”，但他的儿子卢克和他作对，最后打败了他，消灭了银河帝国。天行者父子两代人的故事把善与恶的斗争贯穿在整个《星球大战》系列之中，书写了一部银河史诗。影片中塑造了许多不同的机器人角色，但给观众留下深刻印象的还是那对幽默搞笑的机器人小伙伴R2-D2和C-3PO。它们多次在关键时刻扭转乾坤，营救过莱娅公主和卢克。


    R2-D2是个机智、勇敢而又鲁莽的宇航技工机器人。它小巧的身体只有0.96米高，但塞满了装有各种工具的附加臂。这使它成为了一个了不起的太空船技工和计算机接口专家。


    C-3PO是一个神经质的、多愁善感的礼仪机器人。所谓礼仪机器人主要是用来娱乐搞笑的。它由废弃的残片和回收物拼凑而成，“衣不遮体”，很多接线和部件暴露在外。阿纳金·天行者打算让这个自制机器人帮助他的妈妈施密。C-3PO幽默滑稽，善良可爱，受到了观众的喜爱。


    电影中的机器人当然都是虚构的，它们其实都是由真人扮演的角色，但它们反映了人类对机器人的想象和创造。


    在人工智能的应用中，机器人是一个集人工智能各个分支领域的成果于一体的产物，计算机视觉、自然语言处理、专家系统等都需要完美地应用于机器人领域。不过到目前为止，现实中的机器人和电影中的机器人相比，无论是智商还是颜值都相差甚远。有人开玩笑说：“所谓人工智能，就是让机器人试着做到在电影里它们能做到的事。”


    最早出现的现代机器人是机械手，它可代替人类做繁重的劳动以实现生产的机械化和自动化，能在有害环境中进行操作以保护人身安全，因而广泛地应用于机械制造、冶金、电子、轻工业和原子能等行业，被称为工业机器人。


    机械手是一种能模仿人类手臂的某些动作和功能，用以按固定程序抓取、搬运物件或操作工具的自动操作装置。它可以通过编程来完成各种预期的作业，在构造和性能上兼有人和机器的优点。


    ![](images/figure_0141_0090.jpg)


    约瑟夫·恩格尔伯格


    发明世界上第一个机械手的人叫约瑟夫·恩格尔伯格。1925年，他出生于纽约布鲁克林的一个德国移民家庭。从小酷爱技术与科幻的他先在哥伦比亚大学攻读物理学，然后又用了3年时间获得该校的机械工程硕士学位。科幻给了他想象的灵感，技术让他具有了实现灵感的能力。


    其实，早就有人开始研究如何让生产制造自动化，但一种可以让这种自动化变成现实的机器一直没有开发出来。自学成才的发明家德沃尔从事机电工程和机器控制方面的工作。在工作中，他设计了一种能按照程序重复“抓”和“举”等精细工作的机械臂。1954年，德沃尔正式向美国政府提出专利申请，要求生产一种用于工业生产的“具有重复性作用的机器人”。


    在一次鸡尾酒会上，恩格尔伯格认识了德沃尔。他们相谈甚欢，发现彼此都喜爱科幻小说。德沃尔乘兴向恩格尔伯格解释了自己的发明概念。恩格尔伯格饶有兴致地听着，他很快便意识到这位新认识的仁兄的发明将是他机器人梦想的技术起点。'
  fmt: '

    《纽约时报》研究与发展实验室提出了一整套新闻编码理论，这套理论以“积木式”的编辑模式改变了新闻生产和分发的所有环节，最大限度地释放了媒体人的生产力。最核心的是把可能会被重复使用的部分识别出来并加以注释，这一过程称为“文法”或“颗粒”。所有资讯的内容都被转化为了可供拼装的“颗粒”，每个部分都被重新编码，添加标签，而且是可以被嵌入的。这样新闻制作就变成了一种固定的方法。首先选定主题，然后编写搜索引擎搜取题材对应的文本数据，再通过清洗和整理数据，去除无效信息，进一步探索数据，发现其中有价值的信息，最后编写机器学习算法完成创作。


    人工智能参与的写作是“代入式”写作，也就是说人工智能进行的是程序编辑或公式编辑写作。目前，网络上有“网络小说生成器”“诗歌写作生成器”等各种文学写作程序。实际上，这些写作软件只能进行简单的文字拼接和粘贴，在程序的背后，人工智能软件中已经被“植入”了大量故事段落或者诗句资料，只要给定一个主题，它就可以在极短的时间内“运算”和“比对”出一首诗歌或者一篇小说。


    微软亚洲互联网工程院在2014年5月发布了一款人工智能机器人小冰，它凭借在大数据、自然语义分析、机器学习和深度神经网络方面的技术积累，实现了超越简单人机问答的自然交互。小冰出版过诗集《阳光失了玻璃窗》，还参加过中央电视台《机智过人》节目进行的人机诗歌写作对抗。小冰的出现引发了关于人工智能写作的争论和探讨。人们争论的焦点主要集中在人工智能是否已经发展到能够替代真正人类所开展的具有丰富想象力的文学创作活动，以及人工智能写作是否真的像人工智能专家所认为的那样具有广阔前景。


    在小冰的现代诗歌“创作”和“鉴赏”中，读者经常面临很多的“纠结”，常常误以为人工智能“创作”诗歌在有些情况下无异于诗人的创作。其实，出现这种结果主要是因为现代诗歌的基本特征和当前现代诗歌写作中所存在的问题的双重作用。现代诗歌创作与古典诗歌创作有很大的不同，现代诗歌创作没有严格的限制和约束，自由发挥的随意性很大，常常通过跳跃、断句、隐喻、象征等方式来传达朦胧、隐晦甚至诡异的诗意，诗句之间被打乱的逻辑关系常常把诗意的重构丢给读者，从而使诗意有更大的想象空间。所以，当我们选择阅读某些现代诗歌的时候，对诗意的领会就会比较“艰难”。这种“艰难”如果具有正当性，诗歌就是好作品，而有的“艰难”是接受者或创作者的水平参差不齐造成的。这正是现代诗歌在今天常常遭受读者和文学研究者“诘难”的重要原因。


    然而，这在无形中给人工智能的现代诗歌创作提供了更大的可发展性。小冰自身存储了大量现代诗句，它可以从资源库中调取、比对资源进行写作。对于单个句子，小冰的确可以完美且没有语法错误地完成创作，而且这句诗一定是“诗句”，因为它直接“借鉴”或“挪用”了经典诗歌作品中的句子。但在进行多句连读和分析时，我们发现诗歌的意境和韵味常常难以令人满意，而且诗歌写得越长，我们越能发现其中的“裂痕”和问题。从这一点上来说，诗歌以及其他诸多文体的创作活动是人类特有的表达方式，文学写作思维具有复杂性和综合性特征，而并非只是简单的逻辑推演与行动选择，故人工智能文学写作在目前的条件下不过是在玩“文字游戏”，毕竟今天的人工智能还不具有人类的情感和思想，只有“智商”而无“情商”。


    ## 7.4 从陪聊到辩论


    随着人工智能自然语言处理技术的突破，以自然语言处理技术为基础的应用如雨后春笋般产生。陪聊是最早出现的一种会话机器人。2016年，微软公司发布了一款针对青少年的名为Tay的在线聊天机器人。Tay的会话内容主要由包括即兴喜剧演员在内的人士的作品汇集而成。由于Tay对世界一无所知，并不具备独立思考能力，完全是在算法的驱动下，被动地与真人会话，很快就在一些人恶意的引诱下，表现出了极端的种族主义倾向。微软公司不得不紧急叫停。微软公司的一位副总裁急忙出来道歉，表示对未提前看到这种可能性承担全部责任。


    目前市场上已经有了各种类型的聊天机器人，比如客服机器人、儿童教育机器人、娱乐聊天机器人、家居服务机器人、车载控制机器人和全方位服务型机器人等。


    ![](images/figure_0133_0087.jpg)


    机器人


    聊天机器人可以划分为目标驱动型和无目标驱动型两种。目标驱动型聊天机器人是指聊天机器人有明确的服务目标或者服务对象，比如客服机器人、儿童教育机器人以及提供天气预报、订票、订餐等服务的机器人。这种目标驱动型聊天机器人也可以称作特定领域的聊天机器人。


    无目标驱动型聊天机器人是指聊天机器人并非为特定服务目的而开发，比如纯粹聊天机器人、娱乐聊天机器人以及计算机游戏中的虚拟人物聊天机器人都属于此类。这种无明确任务目标的聊天机器人也可以称作为开放领域的聊天机器人。


    机器人是如何与真人聊天的呢？目前聊天机器人方面的人工智能技术主要有两种：检索式和生成式。所谓检索式就是事先建立一个对话库，聊天系统接收到用户输入的句子后，在对话库中以搜索匹配的方式进行应答内容提取。这种方式简单，但对对话库的要求很高，需要对话库足够大，能够尽量多地匹配用户的提问，否则会经常出现找不到合适应答内容的情形。它的好处是一旦找到匹配的内容，应答质量高，因为对话库中的内容都是真实的对话数据，表达比较自然。


    生成式聊天机器人则是在接收到用户输入的句子后，根据对会话内容的理解和搜索，采用语句合成手段自动生成一句话作为应答。这种机器人的好处是可能覆盖任意话题的用户提问，缺点是生成的应答句子很可能存在问题，比如语句不通顺、句法错误等看上去比较低级的错误。


    在大数据和人工神经网络技术突飞猛进的今天，更多的会话机器人都具有深度学习能力，因而变得能言善辩。它们不仅可以针对用户的提问，产生和用户的问句语义一致且逻辑正确的应答，并且语法正确，对答生动有趣，具有个性，不刻板沉闷，给人一种和真人聊天一样的感觉。


    2019年2月11日，在旧金山的叶巴布纳艺术中心上演过一幕人机互怼的大戏。IBM公司研发的人工智能辩论系统和人类辩论大师哈利什·纳塔拉简进行了一场激烈、精彩的辩论。人类擅长和热衷于辩论，但在人工智能高度发展的今天，计算机也毫不逊色。


    辩论场上看上去像液晶广告牌一样的计算机就是IBM公司目前在人工智能领域里最新的研发成果——人工智能辩论系统。其实，它已经不是第一次和人类辩论了。在2018年6月的人机辩论首战中，它的两个对手都是来自以色列的顶级辩论专家，最终战绩是1胜1负。


    代表人类出战的哈利什可不是一般人，他是2012年欧洲辩论赛的冠军，取得了牛津大学政治、哲学、经济专业的学士学位以及剑桥大学的哲学和国际关系专业的硕士学位。哈利什是英国前首相卡梅伦的学弟、AKE咨询公司的经济风险主管，获得的世界级辩论奖项多得数不清了，还保持着多项辩论世界纪录。


    辩论规则很简单，在双方都没有预先准备和进行任何交流的条件下，现场公布辩题。双方都有15分钟的准备时间，开始后各有4分钟时间立论和4分钟时间反驳对方的观点，最后各有2分钟时间总结陈词，基本上遵循了传统辩论比赛的规则。胜负由旧金山湾区学校的顶尖辩手和100多名记者现场评判。在开场前，评判人员根据辩题投票选择支持正方或反方。辩论结束后再次投票，支持人数增加的一方获胜。辩论的题目是“我们是否应该让幼儿园获得补贴”。


    ![](images/figure_0134_0088.jpg)


    辩论现场


    辩论开始后，人工智能辩论系统首先用一种近乎单调的女性声音开口说：“哈利什，你好。”接着它侃侃而谈，把它的主要观点“补贴学前教育有助于打破贫困循环”说得几乎无懈可击。别看它是机器，它的措辞完整，能够旁征博引，还引用了美国疾病控制与预防中心的数据。


    接下来由人类辩手哈利什表述观点。他直接反驳人工智能辩论系统提出的“拯救贫困”的观点，针锋相对。人和机器，你来我往，唇枪舌剑，毫不相让。


    比赛之前，79%的观众同意幼儿园应该得到减免，只有13%的人反对。经过20分钟两个回合，双方分别总结陈词。最终投票结果为，IBM公司的人工智能辩论系统的支持票数降低到62%，丢掉了17%的票数。由于辩论胜负在于哪一方在辩论中获得支持的人数增加，因而人类获胜。


    人工智能辩论系统展示了人工智能会话系统已经变得越来越灵活了。人工智能已经开始从只能回答某类特定问题的聊天机器人向可以回答更广泛的、答案并不唯一的问题发展。


    “技术的发展正在突破人工智能的更多界限，让它可以更好地和我们互动，更好地理解我们。”IBM公司的达瑞欧在CNN的节目《第一步》中说。


    人工智能辩论系统是怎么辩论的呢？简单地讲，它从拿到观点到演讲分为这样几步。首先是判断观点。当操作者输入一个观点后，系统根据语义理解，自动判断该观点属于正方或反方。其次是筛选资料，在IBM公司为它构建的数据库中，找到所有可以支持这一观点的论据，并且判断论据的说服力。


    除了各种知识文献外，这个系统存储的数据资料中还有一类非常关键的内容，就是观点在社会中引起的反响，其中可能包括专家发言、民意调查、辩论赛数据等可以反映该观点说服力的数据。这也是为什么它可以在极短的时间内从各种可能的答案中选择一个比较有说服力的答案，它只需要几秒就能从数据集中发现用哪种方法说服人类更有效。


    找到了最有力的论点后，再找到支持该论点的最合适的论据，接下来就是排列组合，决定先说哪些，后说哪些，怎么说效果更好，最终形成辩论的整体逻辑。然后就到了最后一步，把这些内容变成演讲形式，并且用人类说话的方式通过语音表达出来。


    这里涉及自然语言识别、语义理解等人工智能领域里的多项技术，在几年以前几乎没有哪个科技公司能达到这种程度。这一步对人工智能来说也是很艰难的，但IBM公司的这套系统显然已经可以做到。


    这套人工智能辩论系统具有强大的语义理解和语言生成能力，应用领域包括净化网络环境、辅助语言学习，可以彻底改变人机交互方式。进一步的意义在于，它能通过不断提升数据处理能力，向医生、投资人、律师甚至执法机关和政府部门在做出重要决策时提供客观全面、无人性偏颇和不受情绪左右的建议。


    当然，目前我们看到的所有“机器独立意识”其实都只是程序员根据人类模拟出的假象，目前人工智能技术的极限还只是“解决特定问题”。人工智能辩论系统的诞生代表着人类在尝试教会机器该如何思考上的一个突破。IBM公司智能辩论系统的官网底部有这么一句话：“辩论，只是一个开始。”是啊，虽然今天人工智能辩论系统输了，但明天鹿死谁手就很难说了。


    ## 7.5 出国无须带翻译


    今天，你拿出手机，无论是扫一扫还是语音翻译，各种机器翻译软件应有尽有，让你出国不用带翻译。这是自然语言识别技术发展的结果。


    关于机器翻译的研究从20世纪三四十年代就已经开始了。一个名叫阿尔楚尼的亚美尼亚裔法国科学家最早提出了用机器进行翻译的想法。他发明了一种机械存储装置，可以容纳数千个单词，通过键盘后面的宽纸带进行资料检索。阿尔楚尼认为，它可以用来记录列车时刻表和银行账户，尤其适合作为机器词典。在宽纸带上面，每一行记录源语言的一个词项以及这个词项在多种目标语言中的对应词项，在另一条纸带上对应的词项处记录相应的代码，这些代码以打孔的方式来表示。


    1933年，他申请了翻译机的专利，把它命名为“机械脑”。机械脑于1937年正式展出，引起了法国邮政、电信部门的兴趣。但是，由于不久爆发了第二次世界大战，阿尔楚尼的机械脑只能让位于战争更紧迫的需要，无果而终。


    1954年，美国乔治城大学在IBM公司的协同下，用IBM 701计算机首次完成了英俄机器翻译试验。虽然该系统只有6条语法规则和250个单词，但它成功地向公众和科学界展示了机器翻译的可行性，从而翻开了机器翻译研究的新篇章。


    中国开始这项研究也并不晚，早在1956年国家就把这项研究列入了全国科学工作发展规划，课题名称是“机器翻译、自然语言翻译规则的建设和自然语言的数学理论”。1957年，中国科学院语言研究所与计算技术研究所合作，开展了俄汉机器翻译试验，翻译了9种不同类型的较为复杂的句子。


    然而早期的研究并不顺利。1964年，为了对机器翻译的研究进展做出评价，美国科学院成立了语言自动处理咨询委员会。开展了为期两年的综合调查、分析和测试后，他们得出的结论是机器翻译比人工翻译还要慢，而且更不准确，成本是人工翻译的两倍，毫无价值。于是在1966年11月，该委员会公布了一篇题为《语言与机器》的报告，全面否定了机器翻译的可行性，并建议停止对机器翻译项目的资金支持。这一报告的发布给了当时正在蓬勃发展的机器翻译研究当头一棒，机器翻译研究陷入了近乎停滞的僵局。


    但科学研究并没有因此停止，特别是计算机科学、语言学理论方面的研究。进入20世纪70年代以后，计算机硬件技术的快速发展以及人工智能在自然语言处理上的应用，从技术层面推动了机器翻译研究的复苏，机器翻译研究又开始活跃起来，各种实用的以及试验性的系统被先后推出。


    随着互联网的出现和普及，数据量激增，统计方法得到了充分应用。互联网公司纷纷成立机器翻译研究组，研发了基于互联网大数据的机器翻译系统，从而使机器翻译真正走向实用化，“百度翻译”“谷歌翻译”纷纷出笼。近年来，随着深度学习的发展，机器翻译技术得到了进一步的发展，促进了翻译质量的快速提升，在口语等领域的翻译更加地道流畅。


    机器翻译系统可划分为基于规则和基于语料库两大类。在基于规则的翻译中，由词典和规则库构成知识源。从美国乔治城大学的机器翻译试验到20世纪50年代末的系统，基本上都属于这一类机器翻译系统。在基于语料库的翻译中，由经过划分并具有标注的语料库构成知识源，既不需要词典，也不需要规则，以统计规律为主。


    基于统计的机器翻译方法把机器翻译看成一个信息传输过程，把源语言句子到目标语言句子的翻译看成一个概率问题。任何一个目标语言句子都有可能是任何一个源语言句子的译文，只是概率不同，机器翻译的任务就是找到概率最大的句子。具体方法是将翻译看作原文通过模型转换为译文的解码过程。因此，统计机器翻译又可以分为模型问题、训练问题和解码问题3个方面。


    所谓模型问题就是为机器翻译建立概率模型，也就是要定义源语言句子到目标语言句子的翻译概率的计算方法。训练问题是利用语料库得到这个模型的所有参数。解码问题则是在已知模型和参数的基础上，对于输入的任何一个源语言句子，去查找概率最大的译文。


    早在1949年用统计学方法解决机器翻译问题的想法就由美国数学家韦弗提出，但由于当时以乔姆斯基为首的很多人对统计方法在自然语言识别领域里的应用持批判态度，这种方法很快就被放弃了。批判的理由主要是语言是无限的，基于经验主义的统计描述无法满足语言的实际要求。另外，限于当时计算机的运算速度，统计的价值也无从显现。不过，自此就有了统计学派和符号学派在人工智能方法上的两军对垒。


    ![](images/figure_0138_0089.jpg)


    韦弗


    2016年，谷歌发布了神经机器翻译系统，使用了循环神经网络进行序列到序列的学习，大幅提高了机器翻译的水平。循环神经网络是一种深度学习算法，它让神经网络内部的所有节点都相互连接，并使用能量函数进行学习，大大强化了学习效果。神经翻译的基本单位是句子，相对于基于短语的翻译，误差率降低了60%，翻译质量得到了巨大的提升。2017年，脸书也推出了基于卷积神经网络的翻译系统。


    语言学泰斗乔姆斯基也许会问：“这种翻译算理解吗？这不过是在玩弄数据。”但也许翻译根本就不是理解的问题，不需要语义分析，而只是数据问题，是一种“经验之谈”。没有乔姆斯基，自然语言研究也许还在黑暗之中摸索，但有了乔姆斯基，是不是一定要束缚我们对其他方法的探索和尝试呢？毕竟实践是检验真理的唯一标准。


    # 第8章 机器人来啦


    ## 8.1 让机器自己工作


    美国好莱坞大片《星球大战》系列长达7集，跨越了30多年。一个名叫阿纳金·天行者的人从一名绝地武士演变成不可一世的大魔头“黑武士”，但他的儿子卢克和他作对，最后打败了他，消灭了银河帝国。天行者父子两代人的故事把善与恶的斗争贯穿在整个《星球大战》系列之中，书写了一部银河史诗。影片中塑造了许多不同的机器人角色，但给观众留下深刻印象的还是那对幽默搞笑的机器人小伙伴R2-D2和C-3PO。它们多次在关键时刻扭转乾坤，营救过莱娅公主和卢克。


    R2-D2是个机智、勇敢而又鲁莽的宇航技工机器人。它小巧的身体只有0.96米高，但塞满了装有各种工具的附加臂。这使它成为了一个了不起的太空船技工和计算机接口专家。


    C-3PO是一个神经质的、多愁善感的礼仪机器人。所谓礼仪机器人主要是用来娱乐搞笑的。它由废弃的残片和回收物拼凑而成，“衣不遮体”，很多接线和部件暴露在外。阿纳金·天行者打算让这个自制机器人帮助他的妈妈施密。C-3PO幽默滑稽，善良可爱，受到了观众的喜爱。


    电影中的机器人当然都是虚构的，它们其实都是由真人扮演的角色，但它们反映了人类对机器人的想象和创造。


    在人工智能的应用中，机器人是一个集人工智能各个分支领域的成果于一体的产物，计算机视觉、自然语言处理、专家系统等都需要完美地应用于机器人领域。不过到目前为止，现实中的机器人和电影中的机器人相比，无论是智商还是颜值都相差甚远。有人开玩笑说：“所谓人工智能，就是让机器人试着做到在电影里它们能做到的事。”


    最早出现的现代机器人是机械手，它可代替人类做繁重的劳动以实现生产的机械化和自动化，能在有害环境中进行操作以保护人身安全，因而广泛地应用于机械制造、冶金、电子、轻工业和原子能等行业，被称为工业机器人。


    机械手是一种能模仿人类手臂的某些动作和功能，用以按固定程序抓取、搬运物件或操作工具的自动操作装置。它可以通过编程来完成各种预期的作业，在构造和性能上兼有人和机器的优点。


    ![](images/figure_0141_0090.jpg)


    约瑟夫·恩格尔伯格


    发明世界上第一个机械手的人叫约瑟夫·恩格尔伯格。1925年，他出生于纽约布鲁克林的一个德国移民家庭。从小酷爱技术与科幻的他先在哥伦比亚大学攻读物理学，然后又用了3年时间获得该校的机械工程硕士学位。科幻给了他想象的灵感，技术让他具有了实现灵感的能力。


    其实，早就有人开始研究如何让生产制造自动化，但一种可以让这种自动化变成现实的机器一直没有开发出来。自学成才的发明家德沃尔从事机电工程和机器控制方面的工作。在工作中，他设计了一种能按照程序重复“抓”和“举”等精细工作的机械臂。1954年，德沃尔正式向美国政府提出专利申请，要求生产一种用于工业生产的“具有重复性作用的机器人”。


    在一次鸡尾酒会上，恩格尔伯格认识了德沃尔。他们相谈甚欢，发现彼此都喜爱科幻小说。德沃尔乘兴向恩格尔伯格解释了自己的发明概念。恩格尔伯格饶有兴致地听着，他很快便意识到这位新认识的仁兄的发明将是他机器人梦想的技术起点。

    '
  trans: '


    《纽约时报》研究与发展实验室提出了一整套新闻编码理论，这套理论以“积木式”的编辑模式改变了新闻生产和分发的所有环节，最大限度地释放了媒体人的生产力。最核心的是把可能会被重复使用的部分识别出来并加以注释，这一过程称为“文法”或“颗粒”。所有资讯的内容都被转化为了可供拼装的“颗粒”，每个部分都被重新编码，添加标签，而且是可以被嵌入的。这样新闻制作就变成了一种固定的方法。首先选定主题，然后编写搜索引擎搜取题材对应的文本数据，再通过清洗和整理数据，去除无效信息，进一步探索数据，发现其中有价值的信息，最后编写机器学习算法完成创作。


    人工智能参与的写作是“代入式”写作，也就是说人工智能进行的是程序编辑或公式编辑写作。目前，网络上有“网络小说生成器”“诗歌写作生成器”等各种文学写作程序。实际上，这些写作软件只能进行简单的文字拼接和粘贴，在程序的背后，人工智能软件中已经被“植入”了大量故事段落或者诗句资料，只要给定一个主题，它就可以在极短的时间内“运算”和“比对”出一首诗歌或者一篇小说。


    微软亚洲互联网工程院在 2014 年 5 月发布了一款人工智能机器人小冰，它凭借在大数据、自然语义分析、机器学习和深度神经网络方面的技术积累，实现了超越简单人机问答的自然交互。小冰出版过诗集《阳光失了玻璃窗》，还参加过中央电视台《机智过人》节目进行的人机诗歌写作对抗。小冰的出现引发了关于人工智能写作的争论和探讨。人们争论的焦点主要集中在人工智能是否已经发展到能够替代真正人类所开展的具有丰富想象力的文学创作活动，以及人工智能写作是否真的像人工智能专家所认为的那样具有广阔前景。


    在小冰的现代诗歌“创作”和“鉴赏”中，读者经常面临很多的“纠结”，常常误以为人工智能“创作”诗歌在有些情况下无异于诗人的创作。其实，出现这种结果主要是因为现代诗歌的基本特征和当前现代诗歌写作中所存在的问题的双重作用。现代诗歌创作与古典诗歌创作有很大的不同，现代诗歌创作没有严格的限制和约束，自由发挥的随意性很大，常常通过跳跃、断句、隐喻、象征等方式来传达朦胧、隐晦甚至诡异的诗意，诗句之间被打乱的逻辑关系常常把诗意的重构丢给读者，从而使诗意有更大的想象空间。所以，当我们选择阅读某些现代诗歌的时候，对诗意的领会就会比较“艰难”。这种“艰难”如果具有正当性，诗歌就是好作品，而有的“艰难”是接受者或创作者的水平参差不齐造成的。这正是现代诗歌在今天常常遭受读者和文学研究者“诘难”的重要原因。


    然而，这在无形中给人工智能的现代诗歌创作提供了更大的可发展性。小冰自身存储了大量现代诗句，它可以从资源库中调取、比对资源进行写作。对于单个句子，小冰的确可以完美且没有语法错误地完成创作，而且这句诗一定是“诗句”，因为它直接“借鉴”或“挪用”了经典诗歌作品中的句子。但在进行多句连读和分析时，我们发现诗歌的意境和韵味常常难以令人满意，而且诗歌写得越长，我们越能发现其中的“裂痕”和问题。从这一点上来说，诗歌以及其他诸多文体的创作活动是人类特有的表达方式，文学写作思维具有复杂性和综合性特征，而并非只是简单的逻辑推演与行动选择，故人工智能文学写作在目前的条件下不过是在玩“文字游戏”，毕竟今天的人工智能还不具有人类的情感和思想，只有“智商”而无“情商”。


    ## 7.4 从陪聊到辩论


    随着人工智能自然语言处理技术的突破，以自然语言处理技术为基础的应用如雨后春笋般产生。陪聊是最早出现的一种会话机器人。2016 年，微软公司发布了一款针对青少年的名为
    Tay 的在线聊天机器人。Tay 的会话内容主要由包括即兴喜剧演员在内的人士的作品汇集而成。由于 Tay 对世界一无所知，并不具备独立思考能力，完全是在算法的驱动下，被动地与真人会话，很快就在一些人恶意的引诱下，表现出了极端的种族主义倾向。微软公司不得不紧急叫停。微软公司的一位副总裁急忙出来道歉，表示对未提前看到这种可能性承担全部责任。


    目前市场上已经有了各种类型的聊天机器人，比如客服机器人、儿童教育机器人、娱乐聊天机器人、家居服务机器人、车载控制机器人和全方位服务型机器人等。


    ![](img/figure_0133_0087.jpg)


    机器人


    聊天机器人可以划分为目标驱动型和无目标驱动型两种。目标驱动型聊天机器人是指聊天机器人有明确的服务目标或者服务对象，比如客服机器人、儿童教育机器人以及提供天气预报、订票、订餐等服务的机器人。这种目标驱动型聊天机器人也可以称作特定领域的聊天机器人。


    无目标驱动型聊天机器人是指聊天机器人并非为特定服务目的而开发，比如纯粹聊天机器人、娱乐聊天机器人以及计算机游戏中的虚拟人物聊天机器人都属于此类。这种无明确任务目标的聊天机器人也可以称作为开放领域的聊天机器人。


    机器人是如何与真人聊天的呢？目前聊天机器人方面的人工智能技术主要有两种：检索式和生成式。所谓检索式就是事先建立一个对话库，聊天系统接收到用户输入的句子后，在对话库中以搜索匹配的方式进行应答内容提取。这种方式简单，但对对话库的要求很高，需要对话库足够大，能够尽量多地匹配用户的提问，否则会经常出现找不到合适应答内容的情形。它的好处是一旦找到匹配的内容，应答质量高，因为对话库中的内容都是真实的对话数据，表达比较自然。


    生成式聊天机器人则是在接收到用户输入的句子后，根据对会话内容的理解和搜索，采用语句合成手段自动生成一句话作为应答。这种机器人的好处是可能覆盖任意话题的用户提问，缺点是生成的应答句子很可能存在问题，比如语句不通顺、句法错误等看上去比较低级的错误。


    在大数据和人工神经网络技术突飞猛进的今天，更多的会话机器人都具有深度学习能力，因而变得能言善辩。它们不仅可以针对用户的提问，产生和用户的问句语义一致且逻辑正确的应答，并且语法正确，对答生动有趣，具有个性，不刻板沉闷，给人一种和真人聊天一样的感觉。


    2019 年 2 月 11 日，在旧金山的叶巴布纳艺术中心上演过一幕人机互怼的大戏。IBM 公司研发的人工智能辩论系统和人类辩论大师哈利什·纳塔拉简进行了一场激烈、精彩的辩论。人类擅长和热衷于辩论，但在人工智能高度发展的今天，计算机也毫不逊色。


    辩论场上看上去像液晶广告牌一样的计算机就是 IBM 公司目前在人工智能领域里最新的研发成果——人工智能辩论系统。其实，它已经不是第一次和人类辩论了。在 2018
    年 6 月的人机辩论首战中，它的两个对手都是来自以色列的顶级辩论专家，最终战绩是 1 胜 1 负。


    代表人类出战的哈利什可不是一般人，他是 2012 年欧洲辩论赛的冠军，取得了牛津大学政治、哲学、经济专业的学士学位以及剑桥大学的哲学和国际关系专业的硕士学位。哈利什是英国前首相卡梅伦的学弟、AKE
    咨询公司的经济风险主管，获得的世界级辩论奖项多得数不清了，还保持着多项辩论世界纪录。


    辩论规则很简单，在双方都没有预先准备和进行任何交流的条件下，现场公布辩题。双方都有 15 分钟的准备时间，开始后各有 4 分钟时间立论和 4 分钟时间反驳对方的观点，最后各有
    2 分钟时间总结陈词，基本上遵循了传统辩论比赛的规则。胜负由旧金山湾区学校的顶尖辩手和 100 多名记者现场评判。在开场前，评判人员根据辩题投票选择支持正方或反方。辩论结束后再次投票，支持人数增加的一方获胜。辩论的题目是“我们是否应该让幼儿园获得补贴”。


    ![](img/figure_0134_0088.jpg)


    辩论现场


    辩论开始后，人工智能辩论系统首先用一种近乎单调的女性声音开口说：“哈利什，你好。”接着它侃侃而谈，把它的主要观点“补贴学前教育有助于打破贫困循环”说得几乎无懈可击。别看它是机器，它的措辞完整，能够旁征博引，还引用了美国疾病控制与预防中心的数据。


    接下来由人类辩手哈利什表述观点。他直接反驳人工智能辩论系统提出的“拯救贫困”的观点，针锋相对。人和机器，你来我往，唇枪舌剑，毫不相让。


    比赛之前，79%的观众同意幼儿园应该得到减免，只有 13%的人反对。经过 20 分钟两个回合，双方分别总结陈词。最终投票结果为，IBM 公司的人工智能辩论系统的支持票数降低到
    62%，丢掉了 17%的票数。由于辩论胜负在于哪一方在辩论中获得支持的人数增加，因而人类获胜。


    人工智能辩论系统展示了人工智能会话系统已经变得越来越灵活了。人工智能已经开始从只能回答某类特定问题的聊天机器人向可以回答更广泛的、答案并不唯一的问题发展。


    “技术的发展正在突破人工智能的更多界限，让它可以更好地和我们互动，更好地理解我们。”IBM 公司的达瑞欧在 CNN 的节目《第一步》中说。


    人工智能辩论系统是怎么辩论的呢？简单地讲，它从拿到观点到演讲分为这样几步。首先是判断观点。当操作者输入一个观点后，系统根据语义理解，自动判断该观点属于正方或反方。其次是筛选资料，在
    IBM 公司为它构建的数据库中，找到所有可以支持这一观点的论据，并且判断论据的说服力。


    除了各种知识文献外，这个系统存储的数据资料中还有一类非常关键的内容，就是观点在社会中引起的反响，其中可能包括专家发言、民意调查、辩论赛数据等可以反映该观点说服力的数据。这也是为什么它可以在极短的时间内从各种可能的答案中选择一个比较有说服力的答案，它只需要几秒就能从数据集中发现用哪种方法说服人类更有效。


    找到了最有力的论点后，再找到支持该论点的最合适的论据，接下来就是排列组合，决定先说哪些，后说哪些，怎么说效果更好，最终形成辩论的整体逻辑。然后就到了最后一步，把这些内容变成演讲形式，并且用人类说话的方式通过语音表达出来。


    这里涉及自然语言识别、语义理解等人工智能领域里的多项技术，在几年以前几乎没有哪个科技公司能达到这种程度。这一步对人工智能来说也是很艰难的，但 IBM 公司的这套系统显然已经可以做到。


    这套人工智能辩论系统具有强大的语义理解和语言生成能力，应用领域包括净化网络环境、辅助语言学习，可以彻底改变人机交互方式。进一步的意义在于，它能通过不断提升数据处理能力，向医生、投资人、律师甚至执法机关和政府部门在做出重要决策时提供客观全面、无人性偏颇和不受情绪左右的建议。


    当然，目前我们看到的所有“机器独立意识”其实都只是程序员根据人类模拟出的假象，目前人工智能技术的极限还只是“解决特定问题”。人工智能辩论系统的诞生代表着人类在尝试教会机器该如何思考上的一个突破。IBM
    公司智能辩论系统的官网底部有这么一句话：“辩论，只是一个开始。”是啊，虽然今天人工智能辩论系统输了，但明天鹿死谁手就很难说了。


    ## 7.5 出国无须带翻译


    今天，你拿出手机，无论是扫一扫还是语音翻译，各种机器翻译软件应有尽有，让你出国不用带翻译。这是自然语言识别技术发展的结果。


    关于机器翻译的研究从 20 世纪三四十年代就已经开始了。一个名叫阿尔楚尼的亚美尼亚裔法国科学家最早提出了用机器进行翻译的想法。他发明了一种机械存储装置，可以容纳数千个单词，通过键盘后面的宽纸带进行资料检索。阿尔楚尼认为，它可以用来记录列车时刻表和银行账户，尤其适合作为机器词典。在宽纸带上面，每一行记录源语言的一个词项以及这个词项在多种目标语言中的对应词项，在另一条纸带上对应的词项处记录相应的代码，这些代码以打孔的方式来表示。


    1933 年，他申请了翻译机的专利，把它命名为“机械脑”。机械脑于 1937 年正式展出，引起了法国邮政、电信部门的兴趣。但是，由于不久爆发了第二次世界大战，阿尔楚尼的机械脑只能让位于战争更紧迫的需要，无果而终。


    1954 年，美国乔治城大学在 IBM 公司的协同下，用 IBM 701 计算机首次完成了英俄机器翻译试验。虽然该系统只有 6 条语法规则和 250 个单词，但它成功地向公众和科学界展示了机器翻译的可行性，从而翻开了机器翻译研究的新篇章。


    中国开始这项研究也并不晚，早在 1956 年国家就把这项研究列入了全国科学工作发展规划，课题名称是“机器翻译、自然语言翻译规则的建设和自然语言的数学理论”。1957
    年，中国科学院语言研究所与计算技术研究所合作，开展了俄汉机器翻译试验，翻译了 9 种不同类型的较为复杂的句子。


    然而早期的研究并不顺利。1964 年，为了对机器翻译的研究进展做出评价，美国科学院成立了语言自动处理咨询委员会。开展了为期两年的综合调查、分析和测试后，他们得出的结论是机器翻译比人工翻译还要慢，而且更不准确，成本是人工翻译的两倍，毫无价值。于是在
    1966 年 11 月，该委员会公布了一篇题为《语言与机器》的报告，全面否定了机器翻译的可行性，并建议停止对机器翻译项目的资金支持。这一报告的发布给了当时正在蓬勃发展的机器翻译研究当头一棒，机器翻译研究陷入了近乎停滞的僵局。


    但科学研究并没有因此停止，特别是计算机科学、语言学理论方面的研究。进入 20 世纪 70 年代以后，计算机硬件技术的快速发展以及人工智能在自然语言处理上的应用，从技术层面推动了机器翻译研究的复苏，机器翻译研究又开始活跃起来，各种实用的以及试验性的系统被先后推出。


    随着互联网的出现和普及，数据量激增，统计方法得到了充分应用。互联网公司纷纷成立机器翻译研究组，研发了基于互联网大数据的机器翻译系统，从而使机器翻译真正走向实用化，“百度翻译”“谷歌翻译”纷纷出笼。近年来，随着深度学习的发展，机器翻译技术得到了进一步的发展，促进了翻译质量的快速提升，在口语等领域的翻译更加地道流畅。


    机器翻译系统可划分为基于规则和基于语料库两大类。在基于规则的翻译中，由词典和规则库构成知识源。从美国乔治城大学的机器翻译试验到 20 世纪 50 年代末的系统，基本上都属于这一类机器翻译系统。在基于语料库的翻译中，由经过划分并具有标注的语料库构成知识源，既不需要词典，也不需要规则，以统计规律为主。


    基于统计的机器翻译方法把机器翻译看成一个信息传输过程，把源语言句子到目标语言句子的翻译看成一个概率问题。任何一个目标语言句子都有可能是任何一个源语言句子的译文，只是概率不同，机器翻译的任务就是找到概率最大的句子。具体方法是将翻译看作原文通过模型转换为译文的解码过程。因此，统计机器翻译又可以分为模型问题、训练问题和解码问题
    3 个方面。


    所谓模型问题就是为机器翻译建立概率模型，也就是要定义源语言句子到目标语言句子的翻译概率的计算方法。训练问题是利用语料库得到这个模型的所有参数。解码问题则是在已知模型和参数的基础上，对于输入的任何一个源语言句子，去查找概率最大的译文。


    早在 1949 年用统计学方法解决机器翻译问题的想法就由美国数学家韦弗提出，但由于当时以乔姆斯基为首的很多人对统计方法在自然语言识别领域里的应用持批判态度，这种方法很快就被放弃了。批判的理由主要是语言是无限的，基于经验主义的统计描述无法满足语言的实际要求。另外，限于当时计算机的运算速度，统计的价值也无从显现。不过，自此就有了统计学派和符号学派在人工智能方法上的两军对垒。


    ![](img/figure_0138_0089.jpg)


    韦弗


    2016 年，谷歌发布了神经机器翻译系统，使用了循环神经网络进行序列到序列的学习，大幅提高了机器翻译的水平。循环神经网络是一种深度学习算法，它让神经网络内部的所有节点都相互连接，并使用能量函数进行学习，大大强化了学习效果。神经翻译的基本单位是句子，相对于基于短语的翻译，误差率降低了
    60%，翻译质量得到了巨大的提升。2017 年，脸书也推出了基于卷积神经网络的翻译系统。


    语言学泰斗乔姆斯基也许会问：“这种翻译算理解吗？这不过是在玩弄数据。”但也许翻译根本就不是理解的问题，不需要语义分析，而只是数据问题，是一种“经验之谈”。没有乔姆斯基，自然语言研究也许还在黑暗之中摸索，但有了乔姆斯基，是不是一定要束缚我们对其他方法的探索和尝试呢？毕竟实践是检验真理的唯一标准。


    # 第 8 章 机器人来啦


    ## 8.1 让机器自己工作


    美国好莱坞大片《星球大战》系列长达 7 集，跨越了 30 多年。一个名叫阿纳金·天行者的人从一名绝地武士演变成不可一世的大魔头“黑武士”，但他的儿子卢克和他作对，最后打败了他，消灭了银河帝国。天行者父子两代人的故事把善与恶的斗争贯穿在整个《星球大战》系列之中，书写了一部银河史诗。影片中塑造了许多不同的机器人角色，但给观众留下深刻印象的还是那对幽默搞笑的机器人小伙伴
    R2-D2 和 C-3PO。它们多次在关键时刻扭转乾坤，营救过莱娅公主和卢克。


    R2-D2 是个机智、勇敢而又鲁莽的宇航技工机器人。它小巧的身体只有 0.96 米高，但塞满了装有各种工具的附加臂。这使它成为了一个了不起的太空船技工和计算机接口专家。


    C-3PO 是一个神经质的、多愁善感的礼仪机器人。所谓礼仪机器人主要是用来娱乐搞笑的。它由废弃的残片和回收物拼凑而成，“衣不遮体”，很多接线和部件暴露在外。阿纳金·天行者打算让这个自制机器人帮助他的妈妈施密。C-3PO
    幽默滑稽，善良可爱，受到了观众的喜爱。


    电影中的机器人当然都是虚构的，它们其实都是由真人扮演的角色，但它们反映了人类对机器人的想象和创造。


    在人工智能的应用中，机器人是一个集人工智能各个分支领域的成果于一体的产物，计算机视觉、自然语言处理、专家系统等都需要完美地应用于机器人领域。不过到目前为止，现实中的机器人和电影中的机器人相比，无论是智商还是颜值都相差甚远。有人开玩笑说：“所谓人工智能，就是让机器人试着做到在电影里它们能做到的事。”


    最早出现的现代机器人是机械手，它可代替人类做繁重的劳动以实现生产的机械化和自动化，能在有害环境中进行操作以保护人身安全，因而广泛地应用于机械制造、冶金、电子、轻工业和原子能等行业，被称为工业机器人。


    机械手是一种能模仿人类手臂的某些动作和功能，用以按固定程序抓取、搬运物件或操作工具的自动操作装置。它可以通过编程来完成各种预期的作业，在构造和性能上兼有人和机器的优点。


    ![](img/figure_0141_0090.jpg)


    约瑟夫·恩格尔伯格


    发明世界上第一个机械手的人叫约瑟夫·恩格尔伯格。1925 年，他出生于纽约布鲁克林的一个德国移民家庭。从小酷爱技术与科幻的他先在哥伦比亚大学攻读物理学，然后又用了
    3 年时间获得该校的机械工程硕士学位。科幻给了他想象的灵感，技术让他具有了实现灵感的能力。


    其实，早就有人开始研究如何让生产制造自动化，但一种可以让这种自动化变成现实的机器一直没有开发出来。自学成才的发明家德沃尔从事机电工程和机器控制方面的工作。在工作中，他设计了一种能按照程序重复“抓”和“举”等精细工作的机械臂。1954
    年，德沃尔正式向美国政府提出专利申请，要求生产一种用于工业生产的“具有重复性作用的机器人”。


    在一次鸡尾酒会上，恩格尔伯格认识了德沃尔。他们相谈甚欢，发现彼此都喜爱科幻小说。德沃尔乘兴向恩格尔伯格解释了自己的发明概念。恩格尔伯格饶有兴致地听着，他很快便意识到这位新认识的仁兄的发明将是他机器人梦想的技术起点。


