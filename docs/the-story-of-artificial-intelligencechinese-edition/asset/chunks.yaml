- raw: '在生活中，我们是怎样识别物体的呢？我们通过观察，发现和总结一个物体的特点，并对其进行分类，从而识别一个物体。比如，我们通过观察认识到汽车是一种至少有4个轮子的可以自动行驶的物体，而有3个轮子的是三轮车，有两个轮子的是自行车或摩托车。车轮的多少就是不同车种的一个分类特征。再比如，大象有着长鼻子、硕大的身躯和粗壮的四肢。我们用这样的一些特征就可以把大象从一群动物中识别出来。计算机视觉也是这样，通过对照片上的内容进行特征提取，然后加以分类总结，得出不同物体的不同特征，再用这些特征来识别它们分别可能是什么东西。


    当然，计算机对照片特征的提取必须是数字化的，就是说物体的特征是用数据表达的，比如反映位置关系的距离等。利用这样的一些数据，我们就可以在计算机里把一个事物用一组数据描绘出来。


    我们知道同一类事物不可能完全一样，即使人也有高矮胖瘦之分。那么，计算机怎样判断这个高高大大的是人，而那个矮矮胖胖的不是人呢？这就需要计算机通过“学习”来认识和归纳人的总体特征范围，这个范围称为特征空间。凡是这个特征空间里的事物，我们都可以认为它们是同一类物体。


    当计算机对它“看”到的事物的特征有了认识并进行总结以后，把一个事物与其他事物区别开来就是一个分类过程。在计算机视觉系统中负责分类的部分叫分类器，它其实是一个函数，叫分类函数。一个分类函数是怎样得到的呢？


    我们可以把人工智能系统和人类做类比。为了认识世界，我们需要在学校里进行长时间的学习；为了检验学习效果，我们还要参加考试；若考试不合格，还要重新学习，再次进行考试；考试通过后，才能走上社会参加工作。计算机视觉系统也是一样，它的学习称为训练，考试过程称为测试。若测试不理想，计算机就要继续反复进行训练和测试，然后才能投入应用。


    所以，一个分类函数是通过不断用大量数据进行训练并加以改进后得到的。在训练过程中使用的特征数据叫作训练数据；相应地，在测试阶段使用的数据叫作测试数据。它们都是事先准备好的已经知道实际类型的数据。


    1957年，在康奈尔航空实验室工作的美国神经学家弗兰克·罗森布拉特提出了一种可以模拟人类感知能力的机器，称之为感知机。 感知机是一个二分类的线性分类模型，输入为实例的特征数据，输出为实例的类别。1960年，罗森布拉特用他的感知机成功地学习、识别了一些英文字母。除了能够识别出现次数较多的字母，感知机也能对不同书写方式的字母图像进行概括和归纳。现在，感知机已经是一种常用的训练分类函数的方法。


    在人脸识别中，这种像感知机一样的二分类技术广泛应用在相机对人脸的检测中。为了把相机取景框中的人脸识别出来，图像被分割成上万个相互重叠的、连续的小的图像块，然后每一个图像块都会通过人脸分类器，从而判断它是不是人脸的一部分。这个分类器就是事先训练好的感知机。由于分割的图像块具有不同的尺寸，它们密密麻麻地重叠在一起，覆盖了整个图像，所以图像中的人脸不管大小都能被识别出来。被识别出来的部分最后会合并起来，我们看到的就是图像中的每张脸被一个个线框标识出来。


    在深度学习出现以前，图像特征设计一直是计算机视觉领域的一个重要研究课题。在这个领域里，初期人们都是通过手工设计各种图像特征。随着神经网络和深度学习的出现，计算机视觉进一步发展到从图像中提取特征的方法。卷积运算就是其中的一种技术。


    卷积运算是一种数学计算，就像加减乘除一样，它用一个称为卷积核的矩阵自上而下、自左向右地在图像上滑动，将卷积核矩阵的各个元素与它在图像上覆盖的对应位置的元素相乘，然后求和，得到输出像素值。它的特点是通过对图像数据进行这样的复合计算，把原始图像变换成一幅新的图像。新的图像不但比原始图像具有更少的数据量，而且让原始图像中的特点更加突出鲜明，从而得到原始图像的一个特征图。


    ![](images/figure_0110_0076.jpg)


    图像识别


    为了让机器可以看得见且看得明白，需要采用图像采集（通过摄像头）、图像处理以及图像识别等一系列步骤。特征与分类是图像识别的基本方法，随着人工智能技术的发展，图像识别的特征与分类方法也越来越深入。建立在神经网络上的深度学习为机器视觉打开了一扇令人鼓舞的大门，一代宗师辛顿教授的学生亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫采用深度学习算法开发了一个叫AlexNet的图像识别系统，赢得了2012年ImageNet图像分类大赛的冠军，第一次在人脸识别的准确率上胜过人类。他们的故事我们在后面继续讲述。


    ## [6.3 如何识别运动中的物体](../contents/content.xhtml#toc40)


    随着人工智能技术的飞速发展，计算机视觉已经由识别辨认静态图像发展到识别跟踪动态视频中的内容。如何让计算机识别运动中的物体呢？


    首先，让我们看看人是怎样看到瞬息万变的外部世界的。人类生物学研究发现，人眼具有一种机制，就是光照射到视网膜上后，所形成的图像会保留一段时间，产生画面延续的感觉。这种机制叫作视觉暂留。由于这种机制，人就可以把看到的一个个独立的静态画面连接起来，形成动态的效果。我们可以看到画面中的运动物体，就是被人眼的视觉暂留机制所“欺骗”的结果。正是因为这样，我们看到的电视、电影和网上的视频都是以每秒24帧连续播放的静止画面形成的。


    ![](images/figure_0111_0077.jpg)


    飞行中的海燕


    那么，连续变化的视频和静态照片有什么本质上的不同呢？相对于静态图片，我们可以认为视频多了一个维度，即时间维度。对于静态图片，我们用一个二维函数就可以表达画面上的每个像素，而对于视频，我们需要用三维函数I
    （x, y,t）来表示视频画面的信息。其中，t是时间，（x,y）是该画面中某个像素对应的位置坐标。这样，我们就把动态视频和静态图像密切地联系起来了，从而可以运用识别辨认静态图像的很多技术来进行视频方面的研究。


    视频研究包括视频描述和理解、动作和行为识别、视频分类和时间动作检测等几个方面，其中动作和行为识别是核心。动作和行为识别就是给计算机一段视频，让计算机告诉我们里面发生了什么，里面的人在做什么。


    人类的行为本身是一个十分复杂的过程，让计算机理解起来有很大的难度。拍摄视频时的距离、光线、角度以及遮挡等因素都会给动作和行为识别造成很大的影响。当前行为数据库中的样本十分有限。一个常用的行为数据库可能只包含从优酷视频这样的网站上收集的上千个行为视频，涵盖上百个类别；而相比之下，像ImageNet这样的图片数据库包含数千万张图片，涵盖几万个类别。


    我们已经知道在图像识别中特征的选择对分类来说是至关重要的。那么，人类在生活中根据什么来判断一个人的行为呢？让我们考察一堂体育课上学生们都在干什么。在运动场上，我们发现体育老师把学生分成了两组，一组练习跳高，另一组进行长跑。我们一眼就可以判断出谁在跳高，谁在长跑，因为他们运动的行为不同。跳高者的运动轨迹是向上高高跃起，提膝抬腿，跨过横栏，双脚下垂落地；长跑者的运动轨迹是平行向前，虽然也提膝抬腿，但没有高高跃起，双脚也不是双双下垂落地，而是一前一后交替落地。可以看出，运动是我们判断行为类别的重要特征。


    ![](images/figure_0112_0078.jpg)


    运动的光流


    区别不同行为和动作的重要依据是运动，那么该如何提取视频中的运动信息呢？20世纪末，人工智能科学家开始研究如何跟踪动态目标，各种各样的方法也随之而生。其中的一种方法是利用视频中的特定光流来描述运动的情况，发现运动的特点。所谓光流简单地说就是同一个点（像素）在相邻两幅图像中的位移。另外一种方法是追踪特定目标的形状在不同画面上的连续变化，以得到它的运动特征。


    ![](images/figure_0113_0079.jpg)


    光流图


    视频识别还有一个问题，就是如何对一段较长的视频里的行为进行提取。因为在一段较长的视频中，如果对时间流进行连续密集的采样（选取画面），则会产生大量的计算，需要很大的存储空间，而且相邻画面可能极为相似，变化不大，对于突出特征来说意义不大。所以，一种在时间上稀疏的采样策略应运而生。这样不仅可以节省计算成本和存储空间，而且使运动轨迹更加容易突显出来。


    进一步处理长视频的方法就是分段识别，然后汇总整合，得到视频行为的类别。具体的做法就是，在时间上将一段输入视频划分为几小段，分别针对每一小段视频随机选择光流图和图片帧，对每个片段进行行为识别，最后融合汇总不同段落的行为识别，得到整段视频的行为类别。


    总之，视频识别远比静态图像识别复杂，相应的技术还在进一步的研究和发展中。同时，这些技术的应用也在不断增多，比如智能零售系统就是一个很好的例子。智能零售里需要解决的问题是通过摄像头动态监视商店里的情况，自动判断有多少人进入了商店，其中男女各有多少，他们都是谁，他们在某个商品前停留了多长时间。这些问题我们通过现在的技术都可以解决。


    更进一步，我们已经可以让计算机通过观看体育竞赛视频自动产生专业化的解说，也可以通过图像自动产生一些背景音乐。这些都是非常有意思的应用。基于这些内容产生的算法，会让未来出现一个新媒体时代。在新媒体里，所有的内容都是由计算机产生或者在计算机的辅助下产生的。


    当今的电视节目广泛采用全息成像技术，在人工智能的帮助下合成虚拟人物。无论是体育明星还是当红主播人物，合成的虚拟人物与原型真人的相似度可高达99%。无论是外形、声音、眼神还是脸部动作，虚拟人物都能展现得淋漓尽致、惟妙惟肖，令人惊叹。


    当今的人工智能视频技术只需将特定人物的面部特征和动作特征提取出来，再截取半小时的语音数据，即可生成形象和声音模型。有了这些形象和声音模型以后，任何输入的文字都可以由特定人物形象用声音读或唱出来，甚至可以多种语言来读或唱。也就是说，在大数据的“喂养”下，人工智能中的识别技术已经让“克隆”成为可能。以后，我们每一个人都可以拥有一个自己专属的虚拟孪生机器人，它们将作为我们的化身在世界上行走。如果哪一天你在街上遇到一个长相和言谈举止与你一模一样的机器人，千万不要惊讶，因为这一幕的出现不会太远了。


    ## [6.4 慧眼识英雄](../contents/content.xhtml#toc41)


    2013年，谷歌高价收购了辛顿教授创立的DNN研究公司。前面我们已经讲过，实际上这家公司一无产品二无客户，只有辛顿教授和他的两个学生。这两个学生就是亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫。别小看了这两个学生，他们深得辛顿教授的亲传，采用深度学习算法开发了AlexNet图像识别软件，在2012年的ImageNet国际大赛上拔得头筹。


    ![](images/figure_0114_0080.jpg)


    辛顿教授与他的学生克里泽夫斯基和苏特斯科夫


    亚历克斯·克里泽夫斯基出生在乌克兰，后来移民到加拿大。大学毕业以后，他不想马上去做一个“码农”，于是申请在多伦多大学做辛顿教授的博士生。在读博士期间，他和学友伊利亚·苏特斯科夫决定参加ImageNet国际大赛，这成为了他的人生转折点。他们为什么想去参加这个国际大赛呢？事情还得从大赛本身说起。


    ImageNet国际大赛是一个向世界上所有人开放的竞赛，目的是在图像识别和分类技术领域里发现和鼓励更好的算法，从而证明人工智能在图像识别上的无限可能。ImageNet国际大赛是基于一个叫ImageNet的图像数据库里的海量数据进行的。1976年出生于北京的李飞飞在16岁时随父母移居美国，后来成为斯坦福大学终身教授以及人工智能实验室与视觉实验室主任。2007年，李飞飞与普林斯顿大学的李凯教授合作，发起了ImageNet计划。利用互联网，ImageNet项目组下载了近10亿张图片，并利用像亚马逊网站的土耳其机器人这样的众包平台来标记这些图片。来自167个国家的近5万名工作人员协同合作，帮助项目组对这近10亿张图片进行筛选、排序、标记。2009年，
    ImageNet项目诞生了，这是一个含有1500万张照片的数据库，涵盖了22000种物品。这些物品是根据日常英语单词进行分类组织的，对应于大型英语知识图库WordNet的22000个同义词集。无论是在质量上还是在数量上，ImageNet都是一个规模空前的数据库。同时，它被公布为互联网上的免费资源，全世界的研究人员都可以免费使用。


    克里泽夫斯基在跟随辛顿教授学习时，熟悉辛顿教授在深度学习方面的研究成果。不过，当时辛顿教授的算法都是在计算机的中央处理器上运行的。尽管随着计算机芯片技术的飞速发展，计算机的中央处理器的运算速度已经得到了大幅提升，但面对包含海量数据的图像信息，还是显得太慢。克里泽夫斯基想，能不能重新设计一种神经网络，让它在远比中央处理器快得多的图形处理器上运行，实现深度神经网络计算，从而提高图像识别能力？由于图形处理器强大的并行运算能力，12个图形处理器的深度学习性能相当于2000个中央处理器。2006年，有人在图形处理器上运行一个卷积神经网络，获得了比在中央处理器上运行时快4倍的效果。2011年，有人实现了深度神经网络在图形处理器上的运行，取得了60倍的速度提升。


    在自己想法的驱动下，克里泽夫斯基和他的学友苏特斯科夫开发出了以他的名字命名的一个新的深度学习神经网络图像识别系统AlexNet。这是一个具有8个层深的神经网络，前5层是卷积层，最后3层是全连接层。经过测试，结果十分令人兴奋，超出了当时其他所有的算法。2011年，他的学友苏特斯科夫听说了ImageNet数据库，他认为这是检验他们开发成果的最好平台。于是，他们共同优化和训练他们开发出来的AlexNet系统，让它处理上百万张图像的速度由原来的数周到数月缩短至五六天，并且识别的准确率大幅提升。他们决定参加2016年的ImageNet国际大赛。


    他们的老师辛顿教授听说以后表示反对，当然反对的理由是技术性的。然而，克里泽夫斯基并不服输，他和他的团队花了一年的时间来研究和解决老师提出的问题。后来苏特斯科夫评价说：“克里泽夫斯基对机器学习有着极其深刻的理解。和其他许多研究人员不同，他有着一颗工程师的心，并且具有不达目的誓不罢休的毅力。”


    其实影响克里泽夫斯基的还有一个人，他就是曾经跟随辛顿教授做过博士后研究的杨立昆。他对人工智能领域最核心的贡献是发展和推广了卷积神经网络。1960年，杨立昆出生在法国巴黎附近，他的父亲是一名航空工程师，这让他有了一个业余爱好——制造飞机。在一次与IEEE组织的深度对谈中，C++之父本贾尼·斯特劳斯特卢普开玩笑问他：“你曾经做过一些非常酷的玩意儿，其中大多数能够飞起来。你现在还有没有时间摆弄它们，还是这些乐趣已经被你的工作压榨光了？”杨立昆认真地回答说：“工作里也有非常多的乐趣，但有时我需要亲手创造些东西。这种习惯遗传于我的父亲，他是一名航空工程师，我的父亲和哥哥也热衷于制造飞机。因此，当去法国度假的时候，我们就会在长达3周的时间里沉浸于制造飞机。”


    ![](images/figure_0116_0081.jpg)


    杨立昆


    卷积神经网络是深度学习中实现图像识别和语言识别的关键技术。和辛顿教授一样，杨立昆也是在人工智能和神经网络研究的低潮时期长期坚持科研并最终取得成功的典范。正如辛顿教授所说：“是杨立昆高举着火炬冲过了最黑暗的时代。”


    卷积神经网络的出现受到了生物自然视觉认知机制的启发。20世纪60年代初，美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔通过对猫视觉神经细胞的研究，提出了感受域的概念。受此启发，1980年日本计算机科学家福岛邦彦提出了卷积神经网络的前身Neocognitron。80年代，杨立昆发展并完善了卷积神经网络的理论。1989年，杨立昆发表了一篇著名的论文《反向传播算法用于手写邮政编码的识别》。1998年，他设计了一个被称为LeNet-5的系统（一个七层神经网络），这是第一个成功地应用于数字识别问题的卷积神经网络。在国际通用的手写体数字识别数据集MNIST中，LeNet-5可以达到接近99.2%的正确率。这一系统后来被美国的银行广泛用于支票上数字的识别。


    卷积神经网络通过局部感受域和权值共享的方式极大地减少了神经网络需要训练的参数的个数，因此非常适用于构建可扩展的深度网络，用于图像、语音、视频等复杂信号的模式识别。目前用于图像识别的比较典型的卷积神经网络的深度可达30层，有2400万个节点、1.4亿个参数和150亿个连接。连接数量远远多于参数数量的原因就是权值共享，即很多连接使用相同的参数。


    AlexNet在2012年的ImageNet国际大赛上大获全胜，克里泽夫斯基名噪一时。性情温和的他此前从来没有面对过媒体和公众，但在2012年竞赛结果公布以后，电子邮件像潮水般飞来，媒体和大公司的老板也纷纷上门，各种采访和高薪聘请络绎不绝。用他自己的话说：“简直像梦幻一般。”最终，他和老师辛顿及学友苏特斯科夫一同去了谷歌。


    不过3年以后，2015年AlexNet的纪录就被微软开发的拥有100层深度的神经网络系统刷新了。人工智能技术正在以日新月异的速度飞速发展着，江山更有才人出，各领风骚永向前！


    ## [6.5 天网恢恢，疏而不漏](../contents/content.xhtml#toc42)


    2018年10月22日，《新民晚报》以《捕神张学友！最新演唱会又抓9名逃犯！》为题，报道了2018年张学友巡回演唱会的“赫赫战功”。4月7日南昌演唱会上首名逃犯在现场落网，5月5日赣州演唱会上再抓获一名逃犯。5月20日嘉兴演唱会、6月9日金华演唱会、7月6日呼和浩特演唱会……前前后后竟然抓到55名在逃犯人。天网工程是这些抓捕行动的终极秘密武器。


    看过热播电视剧《破冰行动》的观众都应该熟悉里面行动指挥中心的监控系统。在电视剧中，行动指挥中心在对塔寨村的围剿行动里采用了高科技监控手段，在毒枭的四周布下了天罗地网。毒犯们的一举一动都被各种监控摄像系统盯了个一清二楚。


    经常坐高铁出行的朋友可能会注意到火车站里面有一种特别长的摄像头，其实那就是电视剧里所描写的专门设置的超清摄像头。这种摄像头可以清晰地捕捉到动态画面中人物的面部特征，并且迅速和公安系统信息库中储存的信息进行比对。最重要的是面对如此庞杂的信息，整个系统的处理过程不超过10秒。道路行车监控系统更是大家十分熟悉的，任何违章行为和车辆牌照信息在天眼之下一览无余。


    ![](images/figure_0118_0082.jpg)


    天眼


    这里的核心技术就是人工智能中的计算机图像处理与识别技术。图像处理与识别系统主要包括图像采集系统、图像处理系统和图像识别系统三大部分。我们平常看到的各式各样的摄像头是图像采集系统最主要的组成部分，图像通过它被动态地采集下来，然后传给后台的计算机系统进行存储和处理。由于天气、时间和各种干扰等因素，被采集的图像质量可能会参差不齐，所以先要经过处理，让图像变得清晰干净并具有统一的质量和格式，才好用于识别处理。这就是图像处理系统的工作。处理好的图像会被送入图像识别系统进行各种有针对性的图像识别工作。假设需要寻找某个人，图形识别系统就会把从图像中识别出来的每一个人和数据库里的人像资料进行比对，这就是我们所说的人脸识别。目前，人脸识别的准确率已经超过了人类的平均水平。'
  fmt: '

    在生活中，我们是怎样识别物体的呢？我们通过观察，发现和总结一个物体的特点，并对其进行分类，从而识别一个物体。比如，我们通过观察认识到汽车是一种至少有4个轮子的可以自动行驶的物体，而有3个轮子的是三轮车，有两个轮子的是自行车或摩托车。车轮的多少就是不同车种的一个分类特征。再比如，大象有着长鼻子、硕大的身躯和粗壮的四肢。我们用这样的一些特征就可以把大象从一群动物中识别出来。计算机视觉也是这样，通过对照片上的内容进行特征提取，然后加以分类总结，得出不同物体的不同特征，再用这些特征来识别它们分别可能是什么东西。


    当然，计算机对照片特征的提取必须是数字化的，就是说物体的特征是用数据表达的，比如反映位置关系的距离等。利用这样的一些数据，我们就可以在计算机里把一个事物用一组数据描绘出来。


    我们知道同一类事物不可能完全一样，即使人也有高矮胖瘦之分。那么，计算机怎样判断这个高高大大的是人，而那个矮矮胖胖的不是人呢？这就需要计算机通过“学习”来认识和归纳人的总体特征范围，这个范围称为特征空间。凡是这个特征空间里的事物，我们都可以认为它们是同一类物体。


    当计算机对它“看”到的事物的特征有了认识并进行总结以后，把一个事物与其他事物区别开来就是一个分类过程。在计算机视觉系统中负责分类的部分叫分类器，它其实是一个函数，叫分类函数。一个分类函数是怎样得到的呢？


    我们可以把人工智能系统和人类做类比。为了认识世界，我们需要在学校里进行长时间的学习；为了检验学习效果，我们还要参加考试；若考试不合格，还要重新学习，再次进行考试；考试通过后，才能走上社会参加工作。计算机视觉系统也是一样，它的学习称为训练，考试过程称为测试。若测试不理想，计算机就要继续反复进行训练和测试，然后才能投入应用。


    所以，一个分类函数是通过不断用大量数据进行训练并加以改进后得到的。在训练过程中使用的特征数据叫作训练数据；相应地，在测试阶段使用的数据叫作测试数据。它们都是事先准备好的已经知道实际类型的数据。


    1957年，在康奈尔航空实验室工作的美国神经学家弗兰克·罗森布拉特提出了一种可以模拟人类感知能力的机器，称之为`感知机`。 `感知机`是一个二分类的线性分类模型，输入为实例的特征数据，输出为实例的类别。1960年，罗森布拉特用他的`感知机`成功地学习、识别了一些英文字母。除了能够识别出现次数较多的字母，`感知机`也能对不同书写方式的字母图像进行概括和归纳。现在，`感知机`已经是一种常用的训练分类函数的方法。


    在人脸识别中，这种像`感知机`一样的二分类技术广泛应用在相机对人脸的检测中。为了把相机取景框中的人脸识别出来，图像被分割成上万个相互重叠的、连续的小的图像块，然后每一个图像块都会通过人脸分类器，从而判断它是不是人脸的一部分。这个分类器就是事先训练好的`感知机`。由于分割的图像块具有不同的尺寸，它们密密麻麻地重叠在一起，覆盖了整个图像，所以图像中的人脸不管大小都能被识别出来。被识别出来的部分最后会合并起来，我们看到的就是图像中的每张脸被一个个线框标识出来。


    在深度学习出现以前，图像特征设计一直是计算机视觉领域的一个重要研究课题。在这个领域里，初期人们都是通过手工设计各种图像特征。随着神经网络和深度学习的出现，计算机视觉进一步发展到从图像中提取特征的方法。卷积运算就是其中的一种技术。


    卷积运算是一种数学计算，就像加减乘除一样，它用一个称为卷积核的矩阵自上而下、自左向右地在图像上滑动，将卷积核矩阵的各个元素与它在图像上覆盖的对应位置的元素相乘，然后求和，得到输出像素值。它的特点是通过对图像数据进行这样的复合计算，把原始图像变换成一幅新的图像。新的图像不但比原始图像具有更少的数据量，而且让原始图像中的特点更加突出鲜明，从而得到原始图像的一个特征图。


    ![](images/figure_0110_0076.jpg)


    图像识别


    为了让机器可以看得见且看得明白，需要采用图像采集（通过摄像头）、图像处理以及图像识别等一系列步骤。特征与分类是图像识别的基本方法，随着人工智能技术的发展，图像识别的特征与分类方法也越来越深入。建立在神经网络上的深度学习为机器视觉打开了一扇令人鼓舞的大门，一代宗师辛顿教授的学生亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫采用深度学习算法开发了一个叫`AlexNet`的图像识别系统，赢得了2012年`ImageNet`图像分类大赛的冠军，第一次在人脸识别的准确率上胜过人类。他们的故事我们在后面继续讲述。


    ## 6.3 如何识别运动中的物体


    随着人工智能技术的飞速发展，计算机视觉已经由识别辨认静态图像发展到识别跟踪动态视频中的内容。如何让计算机识别运动中的物体呢？


    首先，让我们看看人是怎样看到瞬息万变的外部世界的。人类生物学研究发现，人眼具有一种机制，就是光照射到视网膜上后，所形成的图像会保留一段时间，产生画面延续的感觉。这种机制叫作视觉暂留。由于这种机制，人就可以把看到的一个个独立的静态画面连接起来，形成动态的效果。我们可以看到画面中的运动物体，就是被人眼的视觉暂留机制所“欺骗”的结果。正是因为这样，我们看到的电视、电影和网上的视频都是以每秒24帧连续播放的静止画面形成的。


    ![](images/figure_0111_0077.jpg)


    飞行中的海燕


    那么，连续变化的视频和静态照片有什么本质上的不同呢？相对于静态图片，我们可以认为视频多了一个维度，即时间维度。对于静态图片，我们用一个二维函数就可以表达画面上的每个像素，而对于视频，我们需要用三维函数`I(x,
    y, t)`来表示视频画面的信息。其中，`t`是时间，`x, y`是该画面中某个像素对应的位置坐标。这样，我们就把动态视频和静态图像密切地联系起来了，从而可以运用识别辨认静态图像的很多技术来进行视频方面的研究。


    视频研究包括视频描述和理解、动作和行为识别、视频分类和时间动作检测等几个方面，其中动作和行为识别是核心。动作和行为识别就是给计算机一段视频，让计算机告诉我们里面发生了什么，里面的人在做什么。


    人类的行为本身是一个十分复杂的过程，让计算机理解起来有很大的难度。拍摄视频时的距离、光线、角度以及遮挡等因素都会给动作和行为识别造成很大的影响。当前行为数据库中的样本十分有限。一个常用的行为数据库可能只包含从优酷视频这样的网站上收集的上千个行为视频，涵盖上百个类别；而相比之下，像`ImageNet`这样的图片数据库包含数千万张图片，涵盖几万个类别。


    我们已经知道在图像识别中特征的选择对分类来说是至关重要的。那么，人类在生活中根据什么来判断一个人的行为呢？让我们考察一堂体育课上学生们都在干什么。在运动场上，我们发现体育老师把学生分成了两组，一组练习跳高，另一组进行长跑。我们一眼就可以判断出谁在跳高，谁在长跑，因为他们运动的行为不同。跳高者的运动轨迹是向上高高跃起，提膝抬腿，跨过横栏，双脚下垂落地；长跑者的运动轨迹是平行向前，虽然也提膝抬腿，但没有高高跃起，双脚也不是双双下垂落地，而是一前一后交替落地。可以看出，运动是我们判断行为类别的重要特征。


    ![](images/figure_0112_0078.jpg)


    运动的光流


    区别不同行为和动作的重要依据是运动，那么该如何提取视频中的运动信息呢？20世纪末，人工智能科学家开始研究如何跟踪动态目标，各种各样的方法也随之而生。其中的一种方法是利用视频中的特定光流来描述运动的情况，发现运动的特点。所谓光流简单地说就是同一个点（像素）在相邻两幅图像中的位移。另外一种方法是追踪特定目标的形状在不同画面上的连续变化，以得到它的运动特征。


    ![](images/figure_0113_0079.jpg)


    光流图


    视频识别还有一个问题，就是如何对一段较长的视频里的行为进行提取。因为在一段较长的视频中，如果对时间流进行连续密集的采样（选取画面），则会产生大量的计算，需要很大的存储空间，而且相邻画面可能极为相似，变化不大，对于突出特征来说意义不大。所以，一种在时间上稀疏的采样策略应运而生。这样不仅可以节省计算成本和存储空间，而且使运动轨迹更加容易突显出来。


    进一步处理长视频的方法就是分段识别，然后汇总整合，得到视频行为的类别。具体的做法就是，在时间上将一段输入视频划分为几小段，分别针对每一小段视频随机选择光流图和图片帧，对每个片段进行行为识别，最后融合汇总不同段落的行为识别，得到整段视频的行为类别。


    总之，视频识别远比静态图像识别复杂，相应的技术还在进一步的研究和发展中。同时，这些技术的应用也在不断增多，比如智能零售系统就是一个很好的例子。智能零售里需要解决的问题是通过摄像头动态监视商店里的情况，自动判断有多少人进入了商店，其中男女各有多少，他们都是谁，他们在某个商品前停留了多长时间。这些问题我们通过现在的技术都可以解决。


    更进一步，我们已经可以让计算机通过观看体育竞赛视频自动产生专业化的解说，也可以通过图像自动产生一些背景音乐。这些都是非常有意思的应用。基于这些内容产生的算法，会让未来出现一个新媒体时代。在新媒体里，所有的内容都是由计算机产生或者在计算机的辅助下产生的。


    当今的电视节目广泛采用全息成像技术，在人工智能的帮助下合成虚拟人物。无论是体育明星还是当红主播人物，合成的虚拟人物与原型真人的相似度可高达99%。无论是外形、声音、眼神还是脸部动作，虚拟人物都能展现得淋漓尽致、惟妙惟肖，令人惊叹。


    当今的人工智能视频技术只需将特定人物的面部特征和动作特征提取出来，再截取半小时的语音数据，即可生成形象和声音模型。有了这些形象和声音模型以后，任何输入的文字都可以由特定人物形象用声音读或唱出来，甚至可以多种语言来读或唱。也就是说，在大数据的“喂养”下，人工智能中的识别技术已经让“克隆”成为可能。以后，我们每一个人都可以拥有一个自己专属的虚拟孪生机器人，它们将作为我们的化身在世界上行走。如果哪一天你在街上遇到一个长相和言谈举止与你一模一样的机器人，千万不要惊讶，因为这一幕的出现不会太远了。


    ## 6.4 慧眼识英雄


    2013年，谷歌高价收购了辛顿教授创立的`DNN`研究公司。前面我们已经讲过，实际上这家公司一无产品二无客户，只有辛顿教授和他的两个学生。这两个学生就是亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫。别小看了这两个学生，他们深得辛顿教授的亲传，采用深度学习算法开发了`AlexNet`图像识别软件，在2012年的`ImageNet`国际大赛上拔得头筹。


    ![](images/figure_0114_0080.jpg)


    辛顿教授与他的学生克里泽夫斯基和苏特斯科夫


    亚历克斯·克里泽夫斯基出生在乌克兰，后来移民到加拿大。大学毕业以后，他不想马上去做一个“码农”，于是申请在多伦多大学做辛顿教授的博士生。在读博士期间，他和学友伊利亚·苏特斯科夫决定参加`ImageNet`国际大赛，这成为了他的人生转折点。他们为什么想去参加这个国际大赛呢？事情还得从大赛本身说起。


    `ImageNet`国际大赛是一个向世界上所有人开放的竞赛，目的是在图像识别和分类技术领域里发现和鼓励更好的算法，从而证明人工智能在图像识别上的无限可能。`ImageNet`国际大赛是基于一个叫`ImageNet`的图像数据库里的海量数据进行的。1976年出生于北京的李飞飞在16岁时随父母移居美国，后来成为斯坦福大学终身教授以及人工智能实验室与视觉实验室主任。2007年，李飞飞与普林斯顿大学的李凯教授合作，发起了`ImageNet`计划。利用互联网，`ImageNet`项目组下载了近10亿张图片，并利用像亚马逊网站的土耳其机器人这样的众包平台来标记这些图片。来自167个国家的近5万名工作人员协同合作，帮助项目组对这近10亿张图片进行筛选、排序、标记。2009年，
    `ImageNet`项目诞生了，这是一个含有1500万张照片的数据库，涵盖了22000种物品。这些物品是根据日常英语单词进行分类组织的，对应于大型英语知识图库`WordNet`的22000个同义词集。无论是在质量上还是在数量上，`ImageNet`都是一个规模空前的数据库。同时，它被公布为互联网上的免费资源，全世界的研究人员都可以免费使用。


    克里泽夫斯基在跟随辛顿教授学习时，熟悉辛顿教授在深度学习方面的研究成果。不过，当时辛顿教授的算法都是在计算机的中央处理器上运行的。尽管随着计算机芯片技术的飞速发展，计算机的中央处理器的运算速度已经得到了大幅提升，但面对包含海量数据的图像信息，还是显得太慢。克里泽夫斯基想，能不能重新设计一种神经网络，让它在远比中央处理器快得多的图形处理器上运行，实现深度神经网络计算，从而提高图像识别能力？由于图形处理器强大的并行运算能力，12个图形处理器的深度学习性能相当于2000个中央处理器。2006年，有人在图形处理器上运行一个卷积神经网络，获得了比在中央处理器上运行时快4倍的效果。2011年，有人实现了深度神经网络在图形处理器上的运行，取得了60倍的速度提升。


    在自己想法的驱动下，克里泽夫斯基和他的学友苏特斯科夫开发出了以他的名字命名的一个新的深度学习神经网络图像识别系统`AlexNet`。这是一个具有8个层深的神经网络，前5层是卷积层，最后3层是全连接层。经过测试，结果十分令人兴奋，超出了当时其他所有的算法。2011年，他的学友苏特斯科夫听说了`ImageNet`数据库，他认为这是检验他们开发成果的最好平台。于是，他们共同优化和训练他们开发出来的`AlexNet`系统，让它处理上百万张图像的速度由原来的数周到数月缩短至五六天，并且识别的准确率大幅提升。他们决定参加2016年的`ImageNet`国际大赛。


    他们的老师辛顿教授听说以后表示反对，当然反对的理由是技术性的。然而，克里泽夫斯基并不服输，他和他的团队花了一年的时间来研究和解决老师提出的问题。后来苏特斯科夫评价说：“克里泽夫斯基对机器学习有着极其深刻的理解。和其他许多研究人员不同，他有着一颗工程师的心，并且具有不达目的誓不罢休的毅力。”


    其实影响克里泽夫斯基的还有一个人，他就是曾经跟随辛顿教授做过博士后研究的杨立昆。他对人工智能领域最核心的贡献是发展和推广了卷积神经网络。1960年，杨立昆出生在法国巴黎附近，他的父亲是一名航空工程师，这让他有了一个业余爱好——制造飞机。在一次与`IEEE`组织的深度对谈中，`C++`之父本贾尼·斯特劳斯特卢普开玩笑问他：“你曾经做过一些非常酷的玩意儿，其中大多数能够飞起来。你现在还有没有时间摆弄它们，还是这些乐趣已经被你的工作压榨光了？”杨立昆认真地回答说：“工作里也有非常多的乐趣，但有时我需要亲手创造些东西。这种习惯遗传于我的父亲，他是一名航空工程师，我的父亲和哥哥也热衷于制造飞机。因此，当去法国度假的时候，我们就会在长达3周的时间里沉浸于制造飞机。”


    ![](images/figure_0116_0081.jpg)


    杨立昆


    卷积神经网络是深度学习中实现图像识别和语言识别的关键技术。和辛顿教授一样，杨立昆也是在人工智能和神经网络研究的低潮时期长期坚持科研并最终取得成功的典范。正如辛顿教授所说：“是杨立昆高举着火炬冲过了最黑暗的时代。”


    卷积神经网络的出现受到了生物自然视觉认知机制的启发。20世纪60年代初，美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔通过对猫视觉神经细胞的研究，提出了感受域的概念。受此启发，1980年日本计算机科学家福岛邦彦提出了卷积神经网络的前身`Neocognitron`。80年代，杨立昆发展并完善了卷积神经网络的理论。1989年，杨立昆发表了一篇著名的论文《反向传播算法用于手写邮政编码的识别》。1998年，他设计了一个被称为`LeNet-5`的系统（一个七层神经网络），这是第一个成功地应用于数字识别问题的卷积神经网络。在国际通用的手写体数字识别数据集`MNIST`中，`LeNet-5`可以达到接近99.2%的正确率。这一系统后来被美国的银行广泛用于支票上数字的识别。


    卷积神经网络通过局部感受域和权值共享的方式极大地减少了神经网络需要训练的参数的个数，因此非常适用于构建可扩展的深度网络，用于图像、语音、视频等复杂信号的模式识别。目前用于图像识别的比较典型的卷积神经网络的深度可达30层，有2400万个节点、1.4亿个参数和150亿个连接。连接数量远远多于参数数量的原因就是权值共享，即很多连接使用相同的参数。


    `AlexNet`在2012年的`ImageNet`国际大赛上大获全胜，克里泽夫斯基名噪一时。性情温和的他此前从来没有面对过媒体和公众，但在2012年竞赛结果公布以后，电子邮件像潮水般飞来，媒体和大公司的老板也纷纷上门，各种采访和高薪聘请络绎不绝。用他自己的话说：“简直像梦幻一般。”最终，他和老师辛顿及学友苏特斯科夫一同去了谷歌。


    不过3年以后，2015年`AlexNet`的纪录就被微软开发的拥有100层深度的神经网络系统刷新了。人工智能技术正在以日新月异的速度飞速发展着，江山更有才人出，各领风骚永向前！


    ## 6.5 天网恢恢，疏而不漏


    2018年10月22日，《新民晚报》以《捕神张学友！最新演唱会又抓9名逃犯！》为题，报道了2018年张学友巡回演唱会的“赫赫战功”。4月7日南昌演唱会上首名逃犯在现场落网，5月5日赣州演唱会上再抓获一名逃犯。5月20日嘉兴演唱会、6月9日金华演唱会、7月6日呼和浩特演唱会……前前后后竟然抓到55名在逃犯人。天网工程是这些抓捕行动的终极秘密武器。


    看过热播电视剧《破冰行动》的观众都应该熟悉里面行动指挥中心的监控系统。在电视剧中，行动指挥中心在对塔寨村的围剿行动里采用了高科技监控手段，在毒枭的四周布下了天罗地网。毒犯们的一举一动都被各种监控摄像系统盯了个一清二楚。


    经常坐高铁出行的朋友可能会注意到火车站里面有一种特别长的摄像头，其实那就是电视剧里所描写的专门设置的超清摄像头。这种摄像头可以清晰地捕捉到动态画面中人物的面部特征，并且迅速和公安系统信息库中储存的信息进行比对。最重要的是面对如此庞杂的信息，整个系统的处理过程不超过10秒。道路行车监控系统更是大家十分熟悉的，任何违章行为和车辆牌照信息在天眼之下一览无余。


    ![](images/figure_0118_0082.jpg)


    天眼


    这里的核心技术就是人工智能中的计算机图像处理与识别技术。图像处理与识别系统主要包括图像采集系统、图像处理系统和图像识别系统三大部分。我们平常看到的各式各样的摄像头是图像采集系统最主要的组成部分，图像通过它被动态地采集下来，然后传给后台的计算机系统进行存储和处理。由于天气、时间和各种干扰等因素，被采集的图像质量可能会参差不齐，所以先要经过处理，让图像变得清晰干净并具有统一的质量和格式，才好用于识别处理。这就是图像处理系统的工作。处理好的图像会被送入图像识别系统进行各种有针对性的图像识别工作。假设需要寻找某个人，图形识别系统就会把从图像中识别出来的每一个人和数据库里的人像资料进行比对，这就是我们所说的人脸识别。目前，人脸识别的准确率已经超过了人类的平均水平。

    '
  trans: '


    在生活中，我们是怎样识别物体的呢？我们通过观察，发现和总结一个物体的特点，并对其进行分类，从而识别一个物体。比如，我们通过观察认识到汽车是一种至少有 4 个轮子的可以自动行驶的物体，而有
    3 个轮子的是三轮车，有两个轮子的是自行车或摩托车。车轮的多少就是不同车种的一个分类特征。再比如，大象有着长鼻子、硕大的身躯和粗壮的四肢。我们用这样的一些特征就可以把大象从一群动物中识别出来。计算机视觉也是这样，通过对照片上的内容进行特征提取，然后加以分类总结，得出不同物体的不同特征，再用这些特征来识别它们分别可能是什么东西。


    当然，计算机对照片特征的提取必须是数字化的，就是说物体的特征是用数据表达的，比如反映位置关系的距离等。利用这样的一些数据，我们就可以在计算机里把一个事物用一组数据描绘出来。


    我们知道同一类事物不可能完全一样，即使人也有高矮胖瘦之分。那么，计算机怎样判断这个高高大大的是人，而那个矮矮胖胖的不是人呢？这就需要计算机通过“学习”来认识和归纳人的总体特征范围，这个范围称为特征空间。凡是这个特征空间里的事物，我们都可以认为它们是同一类物体。


    当计算机对它“看”到的事物的特征有了认识并进行总结以后，把一个事物与其他事物区别开来就是一个分类过程。在计算机视觉系统中负责分类的部分叫分类器，它其实是一个函数，叫分类函数。一个分类函数是怎样得到的呢？


    我们可以把人工智能系统和人类做类比。为了认识世界，我们需要在学校里进行长时间的学习；为了检验学习效果，我们还要参加考试；若考试不合格，还要重新学习，再次进行考试；考试通过后，才能走上社会参加工作。计算机视觉系统也是一样，它的学习称为训练，考试过程称为测试。若测试不理想，计算机就要继续反复进行训练和测试，然后才能投入应用。


    所以，一个分类函数是通过不断用大量数据进行训练并加以改进后得到的。在训练过程中使用的特征数据叫作训练数据；相应地，在测试阶段使用的数据叫作测试数据。它们都是事先准备好的已经知道实际类型的数据。


    1957 年，在康奈尔航空实验室工作的美国神经学家弗兰克·罗森布拉特提出了一种可以模拟人类感知能力的机器，称之为`感知机`。 `感知机`是一个二分类的线性分类模型，输入为实例的特征数据，输出为实例的类别。1960
    年，罗森布拉特用他的`感知机`成功地学习、识别了一些英文字母。除了能够识别出现次数较多的字母，`感知机`也能对不同书写方式的字母图像进行概括和归纳。现在，`感知机`已经是一种常用的训练分类函数的方法。


    在人脸识别中，这种像`感知机`一样的二分类技术广泛应用在相机对人脸的检测中。为了把相机取景框中的人脸识别出来，图像被分割成上万个相互重叠的、连续的小的图像块，然后每一个图像块都会通过人脸分类器，从而判断它是不是人脸的一部分。这个分类器就是事先训练好的`感知机`。由于分割的图像块具有不同的尺寸，它们密密麻麻地重叠在一起，覆盖了整个图像，所以图像中的人脸不管大小都能被识别出来。被识别出来的部分最后会合并起来，我们看到的就是图像中的每张脸被一个个线框标识出来。


    在深度学习出现以前，图像特征设计一直是计算机视觉领域的一个重要研究课题。在这个领域里，初期人们都是通过手工设计各种图像特征。随着神经网络和深度学习的出现，计算机视觉进一步发展到从图像中提取特征的方法。卷积运算就是其中的一种技术。


    卷积运算是一种数学计算，就像加减乘除一样，它用一个称为卷积核的矩阵自上而下、自左向右地在图像上滑动，将卷积核矩阵的各个元素与它在图像上覆盖的对应位置的元素相乘，然后求和，得到输出像素值。它的特点是通过对图像数据进行这样的复合计算，把原始图像变换成一幅新的图像。新的图像不但比原始图像具有更少的数据量，而且让原始图像中的特点更加突出鲜明，从而得到原始图像的一个特征图。


    ![](img/figure_0110_0076.jpg)


    图像识别


    为了让机器可以看得见且看得明白，需要采用图像采集（通过摄像头）、图像处理以及图像识别等一系列步骤。特征与分类是图像识别的基本方法，随着人工智能技术的发展，图像识别的特征与分类方法也越来越深入。建立在神经网络上的深度学习为机器视觉打开了一扇令人鼓舞的大门，一代宗师辛顿教授的学生亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫采用深度学习算法开发了一个叫`AlexNet`的图像识别系统，赢得了
    2012 年`ImageNet`图像分类大赛的冠军，第一次在人脸识别的准确率上胜过人类。他们的故事我们在后面继续讲述。


    ## 6.3 如何识别运动中的物体


    随着人工智能技术的飞速发展，计算机视觉已经由识别辨认静态图像发展到识别跟踪动态视频中的内容。如何让计算机识别运动中的物体呢？


    首先，让我们看看人是怎样看到瞬息万变的外部世界的。人类生物学研究发现，人眼具有一种机制，就是光照射到视网膜上后，所形成的图像会保留一段时间，产生画面延续的感觉。这种机制叫作视觉暂留。由于这种机制，人就可以把看到的一个个独立的静态画面连接起来，形成动态的效果。我们可以看到画面中的运动物体，就是被人眼的视觉暂留机制所“欺骗”的结果。正是因为这样，我们看到的电视、电影和网上的视频都是以每秒
    24 帧连续播放的静止画面形成的。


    ![](img/figure_0111_0077.jpg)


    飞行中的海燕


    那么，连续变化的视频和静态照片有什么本质上的不同呢？相对于静态图片，我们可以认为视频多了一个维度，即时间维度。对于静态图片，我们用一个二维函数就可以表达画面上的每个像素，而对于视频，我们需要用三维函数`I(x,
    y, t)`来表示视频画面的信息。其中，`t`是时间，`x, y`是该画面中某个像素对应的位置坐标。这样，我们就把动态视频和静态图像密切地联系起来了，从而可以运用识别辨认静态图像的很多技术来进行视频方面的研究。


    视频研究包括视频描述和理解、动作和行为识别、视频分类和时间动作检测等几个方面，其中动作和行为识别是核心。动作和行为识别就是给计算机一段视频，让计算机告诉我们里面发生了什么，里面的人在做什么。


    人类的行为本身是一个十分复杂的过程，让计算机理解起来有很大的难度。拍摄视频时的距离、光线、角度以及遮挡等因素都会给动作和行为识别造成很大的影响。当前行为数据库中的样本十分有限。一个常用的行为数据库可能只包含从优酷视频这样的网站上收集的上千个行为视频，涵盖上百个类别；而相比之下，像`ImageNet`这样的图片数据库包含数千万张图片，涵盖几万个类别。


    我们已经知道在图像识别中特征的选择对分类来说是至关重要的。那么，人类在生活中根据什么来判断一个人的行为呢？让我们考察一堂体育课上学生们都在干什么。在运动场上，我们发现体育老师把学生分成了两组，一组练习跳高，另一组进行长跑。我们一眼就可以判断出谁在跳高，谁在长跑，因为他们运动的行为不同。跳高者的运动轨迹是向上高高跃起，提膝抬腿，跨过横栏，双脚下垂落地；长跑者的运动轨迹是平行向前，虽然也提膝抬腿，但没有高高跃起，双脚也不是双双下垂落地，而是一前一后交替落地。可以看出，运动是我们判断行为类别的重要特征。


    ![](img/figure_0112_0078.jpg)


    运动的光流


    区别不同行为和动作的重要依据是运动，那么该如何提取视频中的运动信息呢？20 世纪末，人工智能科学家开始研究如何跟踪动态目标，各种各样的方法也随之而生。其中的一种方法是利用视频中的特定光流来描述运动的情况，发现运动的特点。所谓光流简单地说就是同一个点（像素）在相邻两幅图像中的位移。另外一种方法是追踪特定目标的形状在不同画面上的连续变化，以得到它的运动特征。


    ![](img/figure_0113_0079.jpg)


    光流图


    视频识别还有一个问题，就是如何对一段较长的视频里的行为进行提取。因为在一段较长的视频中，如果对时间流进行连续密集的采样（选取画面），则会产生大量的计算，需要很大的存储空间，而且相邻画面可能极为相似，变化不大，对于突出特征来说意义不大。所以，一种在时间上稀疏的采样策略应运而生。这样不仅可以节省计算成本和存储空间，而且使运动轨迹更加容易突显出来。


    进一步处理长视频的方法就是分段识别，然后汇总整合，得到视频行为的类别。具体的做法就是，在时间上将一段输入视频划分为几小段，分别针对每一小段视频随机选择光流图和图片帧，对每个片段进行行为识别，最后融合汇总不同段落的行为识别，得到整段视频的行为类别。


    总之，视频识别远比静态图像识别复杂，相应的技术还在进一步的研究和发展中。同时，这些技术的应用也在不断增多，比如智能零售系统就是一个很好的例子。智能零售里需要解决的问题是通过摄像头动态监视商店里的情况，自动判断有多少人进入了商店，其中男女各有多少，他们都是谁，他们在某个商品前停留了多长时间。这些问题我们通过现在的技术都可以解决。


    更进一步，我们已经可以让计算机通过观看体育竞赛视频自动产生专业化的解说，也可以通过图像自动产生一些背景音乐。这些都是非常有意思的应用。基于这些内容产生的算法，会让未来出现一个新媒体时代。在新媒体里，所有的内容都是由计算机产生或者在计算机的辅助下产生的。


    当今的电视节目广泛采用全息成像技术，在人工智能的帮助下合成虚拟人物。无论是体育明星还是当红主播人物，合成的虚拟人物与原型真人的相似度可高达 99%。无论是外形、声音、眼神还是脸部动作，虚拟人物都能展现得淋漓尽致、惟妙惟肖，令人惊叹。


    当今的人工智能视频技术只需将特定人物的面部特征和动作特征提取出来，再截取半小时的语音数据，即可生成形象和声音模型。有了这些形象和声音模型以后，任何输入的文字都可以由特定人物形象用声音读或唱出来，甚至可以多种语言来读或唱。也就是说，在大数据的“喂养”下，人工智能中的识别技术已经让“克隆”成为可能。以后，我们每一个人都可以拥有一个自己专属的虚拟孪生机器人，它们将作为我们的化身在世界上行走。如果哪一天你在街上遇到一个长相和言谈举止与你一模一样的机器人，千万不要惊讶，因为这一幕的出现不会太远了。


    ## 6.4 慧眼识英雄


    2013 年，谷歌高价收购了辛顿教授创立的`DNN`研究公司。前面我们已经讲过，实际上这家公司一无产品二无客户，只有辛顿教授和他的两个学生。这两个学生就是亚历克斯·克里泽夫斯基和伊利亚·苏特斯科夫。别小看了这两个学生，他们深得辛顿教授的亲传，采用深度学习算法开发了`AlexNet`图像识别软件，在
    2012 年的`ImageNet`国际大赛上拔得头筹。


    ![](img/figure_0114_0080.jpg)


    辛顿教授与他的学生克里泽夫斯基和苏特斯科夫


    亚历克斯·克里泽夫斯基出生在乌克兰，后来移民到加拿大。大学毕业以后，他不想马上去做一个“码农”，于是申请在多伦多大学做辛顿教授的博士生。在读博士期间，他和学友伊利亚·苏特斯科夫决定参加`ImageNet`国际大赛，这成为了他的人生转折点。他们为什么想去参加这个国际大赛呢？事情还得从大赛本身说起。


    `ImageNet`国际大赛是一个向世界上所有人开放的竞赛，目的是在图像识别和分类技术领域里发现和鼓励更好的算法，从而证明人工智能在图像识别上的无限可能。`ImageNet`国际大赛是基于一个叫`ImageNet`的图像数据库里的海量数据进行的。1976
    年出生于北京的李飞飞在 16 岁时随父母移居美国，后来成为斯坦福大学终身教授以及人工智能实验室与视觉实验室主任。2007 年，李飞飞与普林斯顿大学的李凯教授合作，发起了`ImageNet`计划。利用互联网，`ImageNet`项目组下载了近
    10 亿张图片，并利用像亚马逊网站的土耳其机器人这样的众包平台来标记这些图片。来自 167 个国家的近 5 万名工作人员协同合作，帮助项目组对这近 10 亿张图片进行筛选、排序、标记。2009
    年， `ImageNet`项目诞生了，这是一个含有 1500 万张照片的数据库，涵盖了 22000 种物品。这些物品是根据日常英语单词进行分类组织的，对应于大型英语知识图库`WordNet`的
    22000 个同义词集。无论是在质量上还是在数量上，`ImageNet`都是一个规模空前的数据库。同时，它被公布为互联网上的免费资源，全世界的研究人员都可以免费使用。


    克里泽夫斯基在跟随辛顿教授学习时，熟悉辛顿教授在深度学习方面的研究成果。不过，当时辛顿教授的算法都是在计算机的中央处理器上运行的。尽管随着计算机芯片技术的飞速发展，计算机的中央处理器的运算速度已经得到了大幅提升，但面对包含海量数据的图像信息，还是显得太慢。克里泽夫斯基想，能不能重新设计一种神经网络，让它在远比中央处理器快得多的图形处理器上运行，实现深度神经网络计算，从而提高图像识别能力？由于图形处理器强大的并行运算能力，12
    个图形处理器的深度学习性能相当于 2000 个中央处理器。2006 年，有人在图形处理器上运行一个卷积神经网络，获得了比在中央处理器上运行时快 4 倍的效果。2011
    年，有人实现了深度神经网络在图形处理器上的运行，取得了 60 倍的速度提升。


    在自己想法的驱动下，克里泽夫斯基和他的学友苏特斯科夫开发出了以他的名字命名的一个新的深度学习神经网络图像识别系统`AlexNet`。这是一个具有 8 个层深的神经网络，前
    5 层是卷积层，最后 3 层是全连接层。经过测试，结果十分令人兴奋，超出了当时其他所有的算法。2011 年，他的学友苏特斯科夫听说了`ImageNet`数据库，他认为这是检验他们开发成果的最好平台。于是，他们共同优化和训练他们开发出来的`AlexNet`系统，让它处理上百万张图像的速度由原来的数周到数月缩短至五六天，并且识别的准确率大幅提升。他们决定参加
    2016 年的`ImageNet`国际大赛。


    他们的老师辛顿教授听说以后表示反对，当然反对的理由是技术性的。然而，克里泽夫斯基并不服输，他和他的团队花了一年的时间来研究和解决老师提出的问题。后来苏特斯科夫评价说：“克里泽夫斯基对机器学习有着极其深刻的理解。和其他许多研究人员不同，他有着一颗工程师的心，并且具有不达目的誓不罢休的毅力。”


    其实影响克里泽夫斯基的还有一个人，他就是曾经跟随辛顿教授做过博士后研究的杨立昆。他对人工智能领域最核心的贡献是发展和推广了卷积神经网络。1960 年，杨立昆出生在法国巴黎附近，他的父亲是一名航空工程师，这让他有了一个业余爱好——制造飞机。在一次与`IEEE`组织的深度对谈中，`C++`之父本贾尼·斯特劳斯特卢普开玩笑问他：“你曾经做过一些非常酷的玩意儿，其中大多数能够飞起来。你现在还有没有时间摆弄它们，还是这些乐趣已经被你的工作压榨光了？”杨立昆认真地回答说：“工作里也有非常多的乐趣，但有时我需要亲手创造些东西。这种习惯遗传于我的父亲，他是一名航空工程师，我的父亲和哥哥也热衷于制造飞机。因此，当去法国度假的时候，我们就会在长达
    3 周的时间里沉浸于制造飞机。”


    ![](img/figure_0116_0081.jpg)


    杨立昆


    卷积神经网络是深度学习中实现图像识别和语言识别的关键技术。和辛顿教授一样，杨立昆也是在人工智能和神经网络研究的低潮时期长期坚持科研并最终取得成功的典范。正如辛顿教授所说：“是杨立昆高举着火炬冲过了最黑暗的时代。”


    卷积神经网络的出现受到了生物自然视觉认知机制的启发。20 世纪 60 年代初，美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔通过对猫视觉神经细胞的研究，提出了感受域的概念。受此启发，1980
    年日本计算机科学家福岛邦彦提出了卷积神经网络的前身`Neocognitron`。80 年代，杨立昆发展并完善了卷积神经网络的理论。1989 年，杨立昆发表了一篇著名的论文《反向传播算法用于手写邮政编码的识别》。1998
    年，他设计了一个被称为`LeNet-5`的系统（一个七层神经网络），这是第一个成功地应用于数字识别问题的卷积神经网络。在国际通用的手写体数字识别数据集`MNIST`中，`LeNet-5`可以达到接近
    99.2%的正确率。这一系统后来被美国的银行广泛用于支票上数字的识别。


    卷积神经网络通过局部感受域和权值共享的方式极大地减少了神经网络需要训练的参数的个数，因此非常适用于构建可扩展的深度网络，用于图像、语音、视频等复杂信号的模式识别。目前用于图像识别的比较典型的卷积神经网络的深度可达
    30 层，有 2400 万个节点、1.4 亿个参数和 150 亿个连接。连接数量远远多于参数数量的原因就是权值共享，即很多连接使用相同的参数。


    `AlexNet`在 2012 年的`ImageNet`国际大赛上大获全胜，克里泽夫斯基名噪一时。性情温和的他此前从来没有面对过媒体和公众，但在 2012
    年竞赛结果公布以后，电子邮件像潮水般飞来，媒体和大公司的老板也纷纷上门，各种采访和高薪聘请络绎不绝。用他自己的话说：“简直像梦幻一般。”最终，他和老师辛顿及学友苏特斯科夫一同去了谷歌。


    不过 3 年以后，2015 年`AlexNet`的纪录就被微软开发的拥有 100 层深度的神经网络系统刷新了。人工智能技术正在以日新月异的速度飞速发展着，江山更有才人出，各领风骚永向前！


    ## 6.5 天网恢恢，疏而不漏


    2018 年 10 月 22 日，《新民晚报》以《捕神张学友！最新演唱会又抓 9 名逃犯！》为题，报道了 2018 年张学友巡回演唱会的“赫赫战功”。4 月
    7 日南昌演唱会上首名逃犯在现场落网，5 月 5 日赣州演唱会上再抓获一名逃犯。5 月 20 日嘉兴演唱会、6 月 9 日金华演唱会、7 月 6 日呼和浩特演唱会……前前后后竟然抓到
    55 名在逃犯人。天网工程是这些抓捕行动的终极秘密武器。


    看过热播电视剧《破冰行动》的观众都应该熟悉里面行动指挥中心的监控系统。在电视剧中，行动指挥中心在对塔寨村的围剿行动里采用了高科技监控手段，在毒枭的四周布下了天罗地网。毒犯们的一举一动都被各种监控摄像系统盯了个一清二楚。


    经常坐高铁出行的朋友可能会注意到火车站里面有一种特别长的摄像头，其实那就是电视剧里所描写的专门设置的超清摄像头。这种摄像头可以清晰地捕捉到动态画面中人物的面部特征，并且迅速和公安系统信息库中储存的信息进行比对。最重要的是面对如此庞杂的信息，整个系统的处理过程不超过
    10 秒。道路行车监控系统更是大家十分熟悉的，任何违章行为和车辆牌照信息在天眼之下一览无余。


    ![](img/figure_0118_0082.jpg)


    天眼


    这里的核心技术就是人工智能中的计算机图像处理与识别技术。图像处理与识别系统主要包括图像采集系统、图像处理系统和图像识别系统三大部分。我们平常看到的各式各样的摄像头是图像采集系统最主要的组成部分，图像通过它被动态地采集下来，然后传给后台的计算机系统进行存储和处理。由于天气、时间和各种干扰等因素，被采集的图像质量可能会参差不齐，所以先要经过处理，让图像变得清晰干净并具有统一的质量和格式，才好用于识别处理。这就是图像处理系统的工作。处理好的图像会被送入图像识别系统进行各种有针对性的图像识别工作。假设需要寻找某个人，图形识别系统就会把从图像中识别出来的每一个人和数据库里的人像资料进行比对，这就是我们所说的人脸识别。目前，人脸识别的准确率已经超过了人类的平均水平。


