    TCP/IP是传输控制协议和互联网通信协议的英文缩写。它的发明人是美国电信工程师罗伯特·卡恩。为了开发这个协议，他招募了当时在斯坦福大学工作的文顿·瑟夫。两人合作从1974年推出第一个版本到1978年最终定型，前后花费了5年时间。他们的努力为今天的互联网奠定了技术基础。


    就在美国忙于把各个大学和政府部门的计算机连接起来的时候，一个在瑞士工作的英国计算机科学家蒂姆·伯纳斯-李研究发明了基于超文本链接的万维网。这是一种通过不同的标识符号定义和规范网络文件的内容和格式的计算机语言。它让在网络上传输的不同文件有了共同的格式和标准。一场全球信息革命就这样在20世纪90年代爆发了，并且一发不可收拾，深刻地改变了世界政治、经济、文化和生活的方方面面，更为人工智能的大飞跃悄然无声地提供了史无前例的条件和基础。


