  trans: '


    遗传算法是基于生物学的，理解或编程都不太难。首先，建立初始状态。初始种群是从解中随机选择出来的，将这些解比喻为染色体或基因，该种群被称为第一代。其次，评估适应度。为每一个解（染色体）指定一个适应度，应根据问题求解的实际接近程度来指定（以便逼近求解问题的答案）。不要把这些“解”与问题的“答案”混为一谈，可以把它理解成为要得到答案时系统可能需要利用的那些特性。再次，进行繁殖。具有较高适应度的那些染色体更可能产生后代（后代产生后也将发生突变）。后代是父母的产物，它们由来自父母的基因结合而成，这个过程被称为“杂交”。最后，产生下一代。如果新的一代包含一个解，能产生一个充分接近或等于期望答案的输出，那么问题就已经解决了。如果情况并非如此，新的一代将重复其父母所进行的繁衍过程，一代一代地演化下去，直到得到期望的解为止。


    神经网络和遗传算法都有一个共同特点，那就是效果要等到多步以后才能看到，这就要求尽可能多地访问所有的状态。这既是对计算力的一个挑战，也是对存储空间的一个很高的要求。当时，计算机硬件的功能还远不够强大，它们的成效自然难以展现出来，毕竟理论先进不代表实际可行。所以，今天大受追捧的神经网络和遗传算法在发明之初却是曲高和寡，不受重视。现实和理想之间总是有距离的，在科学的世界里也是一样，但历史是在不断向前发展的。


    ## 1.5 让计算机理解人类的语言

    1949 年 5 月 31 日，《纽约时报》兴奋地发布了一条新闻：“一种新型的‘电子大脑’不仅可以进行复杂的数学运算，而且可以翻译外文。它由位于加州大学的国家标准实验室研制。参加项目研发的科学家们说，他们将实现覆盖《韦伯大学词典》6
    万个单词的 3 种语言的翻译能力。”


    然而，这样一种系统的研发在当时面临着各种技术问题，最后只能无果而终。连《纽约时报》后来也不得不承认说：“如何让一台机器分辨法语中同一个单词的意思是‘桥’还是‘码头’？所有机器能做的事情只是简单地寻找一个法语单词在英语词典里对应的单词，无法从实际语义上确定应该如何翻译。”


    自然语言处理一直是人工智能研究中的一个重要课题。人工智能研究早期探索的一个方向，就是想要找到一种方法能够让机器识文断字。我们知道人类的多种智能都与语言文字有着密切的关系。人类的逻辑思维以语言为形式，人类的绝大部分知识也是以语言文字的形式记载和流传下来的。


    实现人机间自然语言通信意味着要使计算机既能看得懂文字，理解其中的意思，又能以自然语言的形式来表达给定的意图、思想等。前者称为自然语言理解，后者称为自然语言生成，这就是自然语言处理。机器翻译就是自然语言处理的一个具体应用。


    一个真正的机器翻译系统直到 1954 年 1 月才在美国乔治城大学开发成功。虽然它只包含了 6 条语法规则和 250 个单词，但它把几十个俄文句子成功地翻译成了英文，这在历史上还是第一次。当时还没有像现在这样方便的人机交互方式，俄文句子必须通过打孔卡片输入到一台
    IBM 701 大型计算机中，翻译出来的英文也是通过一台连接在这台计算机上的打印机打印出来的。


    在关于机器翻译的研究中一直有两种不同的方法，其中一种是以乔姆斯基为代表的语言学方法，另一种是以贾里尼克为代表的统计学方法。身为犹太人的乔姆斯基出生在美国宾夕法尼亚州的费城。虽然他从宾夕法尼亚大学取得了语言学博士学位，但他的大部分博士研究是用
    4 年时间以哈佛年轻学者的身份在哈佛大学完成的。在博士论文的撰写中，他开始形成自己的一些语言学思想，后来他将这些思想进一步阐发，写成了《句法结构》这本被认为是
    20 世纪理论语言学研究方面最伟大贡献的著作。这本书也成为了人工智能机器翻译语言学方法的圣经。


    按照乔姆斯基的句法结构，句子可以通过一系列规则得到解析。一个句子可以解析成名词词组和动词词组，而名词词组和动词词组又可以进一步解析。他认为，所有语言都有与此类似的句法结构，这种结构是内在的，而不是通过经验得来的。在乔姆斯基的理论中，机器翻译就是通过对一个句子进行结构解析和合并重构来完成的。这其实是一种逻辑方法，并暗合于计算机科学中的有限自动机理论，成为了早期机器翻译的主要方法。


    乔姆斯基不仅是一位学者，还是一名社会活动家，1967 年因为反对越战坐过牢。麻省理工学院为了保护这位“口无遮拦”的“院宝”，多次为他雇用保镖保护他的人身安全，因为他的名字曾经出现在邮件炸弹的黑名单上。其实，他是一位典型的学究，率性固执，但天真善良。据说，他在狱中因为不能给学生上课而感到不安和自责。


    和以乔姆斯基理论为代表的语言学方法对立的就是统计学方法。1988 年，美国 IBM 公司沃森研究中心机器翻译小组发表了一篇关于机器翻译统计学方法的论文，并推出了法语和英语的翻译系统
    CANDIDE。贾里尼克作为该小组的组长，成为了机器翻译统计学方法的代表。他的名言就是“我每开除一位语言学家，我的语音识别系统的性能就能提高 1 倍”。看得出来，他是多么不喜欢自然语言处理中的语言学方法。


    ![](img/figure_0029_0015.jpg)


    乔姆斯基


    所谓统计学方法，就是在大量数据的基础上形成语料库，通过概率统计来发现数据特征，建立数据模型。实际上，这是一种建立在大数据之上的机器学习方法。简单来说，一个词在生活中的用法多种多样，但在不同环境和场合中出现的频率不同，和其他词语关联的频率也不同。我们把这种出现的频率叫作概率，把各种词语出现的概率记录下来，建立一个词语统计模型。通过这样的统计模型，我们就可以分析和理解一个句子的意思。


    就在乔姆斯基一边研究他的句法结构一边积极参与反战的社会活动时，另一位德裔犹太人魏森鲍姆在麻省理工学院编写了一个用于心理咨询的会话程序 ELIZA。用今天的话说，这就是一个聊天机器人，它能通过计算机终端和人进行交流。其实，ELIZA
    是一个超级简单的程序。它只是简单地在一个按词频排序的词库里进行搜索，如果找到了一个合适的单词来匹配，就在脚本库里选择一个合适的回复。


    连魏森鲍姆教授自己也没有想到，这样一个小玩意儿竟然轰动一时。很多来麻省理工学院访问的学术界和新闻界人士都要来到他的办公室亲自和这位机器心理医生聊一聊。一次，一位来找魏森鲍姆教授谈合作的某公司副总裁在终端上聊了一会儿，觉得这玩意儿真不错。他认为一定有人在机器后面操作。于是在走的时候，他把自己的电话号码输入到终端上，说：“有时间给我打电话，好吗？”可终端一直没有回答他。这可把这位副总裁气坏了，因为从来没有人敢这样怠慢他。其实他自己输完最后一句话后没有按回车键，机器不是傲慢，而是以为他的话还没有讲完，一直在毕恭毕敬地等着他结束对话呢。


    ![](img/figure_0030_0016.jpg)


    魏森鲍姆


    维诺格拉德不是乔姆斯基的学生，但他在读研究生的时候选修了语言学系乔姆斯基教授的句法课。因为他读的是人工智能专业，所以在期末考试的论文中，他试图说明为什么人工智能的方法可行。这让乔姆斯基很不开心，一气之下给了维诺格拉德一个
    C 的成绩，吓得维诺格拉德再也不敢选乔姆斯基的课程了。不过，维诺格拉德的博士论文题目还是和语言有关，他开发了一个叫积木世界的东西。他用显示器展示了一个虚拟的积木世界，人们可以通过简单的自然语言，命令一个虚拟的机械手对这个积木世界里面的积木进行虚拟操作。如果机器不能确定人们给出的命令，就会向人们提问。整个系统就像一个游戏一样。


    ![](img/figure_0031_0017.jpg)


    积木世界


    维诺格拉德的积木世界远比魏森鲍姆的机器心理医生复杂，学术意义也更加深刻。它把当时的很多人工智能技术整合到了一起，除了自然语言处理外，其中还用到了规划和知识表达。它涉及语言的很多方面，包括语言的输入、输出和生成，知识的表示和理解，世界和思想。积木世界还暗含了一种哲学思想，即意义就是语言的使用。语言的使用就是心和物（世界）之间的交互。积木世界就是语言游戏，成为了一种研究语言的方法。为此，维诺格拉德获得了国际人工智能联合会颁发的第一届“计算机与思维奖”。


    # 第 2 章 什么是人工智能


    ## 2.1 人工智能第一人

    人类探索人工智能的历史悠久。人工智能真正成为一门学科是由有人工智能之父称号的麦卡锡在 1956 年夏天达特茅斯的那次研究活动中确立的，但人工智能概念的正式提出是在
    1948 年，出自一个英国人，他的名字叫阿兰·图灵。


    ![](img/figure_0032_0018.jpg)


    阿兰·图灵雕像


    图灵从小聪明绝顶，正直清高。据说上中学时，他就表现出了过人的数学天分。在数学课上，他完全不听讲，也不看书，所有定理都是自己推导出来的。他把中学以前的数学知识从头到尾“发明”了一遍，这让老师和校长大为头痛。后来校长忍无可忍，把图灵的父亲找来告状，还嘲讽地说：“你的孩子偏科，我们这里培养的是文化人，他要是想当科学家，那可是来错了地方。”鼠目寸光的校长做梦也没能预见到这个“偏科”的学生后来竟真的成为了世界上最伟大的科学家和哲学家之一。


    作为富家子弟的图灵出身名校。据说他去英国剑桥大学入学报到的时候，他的父母为了避税，正带着全家在法国定居。他只好从法国跨越英吉利海峡去英国。可是渡轮到岸的时间太晚了，去学校的班车已经没有了。他二话不说，从行李里拿出随身携带的自行车，买了张地图，一路骑行赶往学校。然而，“车不作美”，中途坏了两次。近百千米的路程，他走了一夜，中途还在一家五星级酒店休息了一下。事后，他把这家五星级酒店的发票寄给父母，证明自己既没有说谎也没有乱花钱。


    图灵是科班出身的数学家，在他生活的那个年代，数学就是脑袋加纸笔。他一直在想，既然数学是一门严谨而富于逻辑的学问，那么能不能发明一种机器代替纸笔进行数学运算，进而帮助人们解决一切数学和逻辑可以解决的问题？一天，他又躺在学校的草坪上仰天冥想，突然一个简单的机械装置浮现出他的脑海中，这就是后来被称为图灵机的虚拟计算装置。他的这个装置是现代计算机的核心原型和本质概括。


    图灵机是一个简单得不能再简单的装置。它由 3 个部分构成：一条无限长的纸带，上面有无穷多的格子，每个格子里可以写 1 或 0；一个可以移动的读写头，每次可以向当前指向的格子读或写
    1 或 0；一个逻辑规则器，可以根据在当前纸带位置上读到的是 1 还是 0，结合逻辑规则，指示读写头向前或向后移动一个格子，或在当前的格子里写入 1 或 0。


    图灵证明了他的这个装置与计算理论中的邱奇演算和哥德尔递归函数等价，从而证明了这个简单装置的无限计算能力。有了图灵机，我们就可以把原来纯数学和逻辑的东西与物理世界的实体装置联系起来，函数变成了规则控制下的纸带和读写头。今天的电子计算机实际上就是图灵的这个虚拟计算装置的一个具体实现。被称为电子计算机之父的冯·诺依曼一直都说，他的思想来自图灵机，其核心内容就是存储程序结构，一个被编码的图灵机就是存储的程序。所以说计算机科学起源于图灵一点也不过分。1936
    年他发表的那篇论文《论可计算数》和文中描述的图灵机成为了人类文明中具有划时代意义的里程碑。


    ![](img/figure_0034_0019.jpg)


    《论可计算数》


    ![](img/figure_0034_0020.jpg)


    图灵机


    1939 年 9 月 1 日，德国军队占领了波兰，2 日英国对德国宣战，3 日图灵被召往布莱切利园。这个庄园其实是英国政府的密码学校和密码破译基地，负责为英国海陆空三军提供密码加解密服务。图灵的工作是负责破解德国传奇的
    Enigma 加密机。战时的工作十分繁重，据说一次图灵需要去伦敦参加一个紧急会议，但一时没有车可以送他，于是他说了一句“我自己解决吧”，就拔腿奔跑而去。64
    千米的路对于他来说似乎毫不费力，会后他又自己跑了回来。图灵的长跑纪录是奥运会水平的，他本来想代表英国参加 1948 年的奥运会，但因为受了伤，只好放弃。


    即使在战争中，图灵也没有放弃对机器与智能问题的思考。战后，他来到曼彻斯特大学任教。在朋友的催促下，他把他对机器与智能问题的思考写成了文章，这就是 1950
    年他在英国哲学杂志《心》上发表的又一篇具有划时代意义的论文《计算机与智能》。在论文中，他提出了“模仿游戏”这个后来被人们称为“图灵测试”的人工智能的定义。该论文被公认为最早对人工智能进行系统化和科学化的论述。


    “模仿游戏”很简单。两个封闭的房间里分别有一个人和一台机器，他们通过一个打字终端来回答屋子外面的人提出的问题。如果屋子外面的人不能通过提问判断两个房间里面回答问题的哪一个是人哪一个是机器，那么机器就被认为是有智能的。图灵不仅在论文中提出了“机器能思维吗”这个问题，而且提出了这个问题的各种变种；不仅给出了答案，而且预想了人们对于答案的可能异议以及对异议的反驳。他还进一步预测，2000
    年机器的内存会达到 1GB。事实证明他的预测十分准确。


    2011 年， IBM 公司的沃森超级计算机在美国的电视智力竞猜节目中击败人类，成为“图灵测试”里程碑式的证明，标志着人工智能的历史性飞跃。美国麻省理工学院的机器人专家布鲁克斯不无感叹地说道：“阅读图灵的文章，真是令人折服。他早就想到了这些玩意儿，没有人比他更先知。”


    然而，图灵的聪明才智并没有让他的人生辉煌，他的个人生活一直困扰着他，还让他官司缠身。英国政府不但没有因为他在战时从事密码工作的贡献而保护他，反而吊销了他的安全许可，这意味着他从此没有办法在这个领域里工作。


    1954 年 6 月 7 日，他被发现死在自己家中的床上，年纪还不到 42 岁。关于他的死因，至今众说纷纭。为了纪念和表彰图灵对计算机科学的贡献，美国计算机学会于
    1966 年设立了图灵奖，这是一个被称为“计算机科学界的诺贝尔奖”的最高专业奖项。2009 年 9 月 10 日，图灵死后 55 年，在英国人民的强烈呼吁下，英国首相布朗面向全英国人民正式向图灵致歉。布朗说：“我很骄傲地说，我们错了，我们应该更好地对待你。”


    图灵这个伟大的天才生时平凡，死时阴暗。像很多伟大的人物一样，他所有的荣誉和地位都是在他死后获得的。今天，在英国曼彻斯特公园里，图灵雕像的基座上刻着著名逻辑学家罗素的一句话：“数学不仅有真理，也有最高的美，那是一种冷艳和简朴的美，就像雕像。”图灵被认为是人类历史上最伟大的
    12 位哲学家之一，和亚里士多德齐名。也许伟大、光荣其实并不重要，重要的是真和美；也许你是谁也不重要，重要的是你为人类做过什么贡献。图灵以他对人工智能理论空前绝后的卓越贡献而成为人工智能第一人。


    ## 2.2 冯·诺依曼和第一台电子计算机

    虽然人工智能和计算机科学是两个不同的研究领域，但人工智能其实一直和计算机科学密不可分，毕竟电子计算机又被人们俗称为电脑，而人工智能的核心就是基于逻辑电子电路的各种各样的计算方法。计算机科学一直都有两条互相交错的路线，理论路线的起源是我们前面讲过的图灵，而工程路线则可以追溯到冯·诺依曼，一位匈牙利裔美国数学家，第一台电子计算机的发明者。他们共同关注的课题都是大脑和智能。


    冯·诺依曼是 20 世纪最重要的数学家之一，在纯粹数学和应用数学方面都有杰出的贡献。他生前的名气比图灵大得不止一星半点，图灵申请奖学金的推荐信还是冯·诺依曼写的。他慧眼识英雄，老早就看出图灵与众不同，曾经挽留过刚毕业的图灵留在普林斯顿大学给他做助手。后来他一再说，自己发明的电子计算机的核心概念，除了来自巴贝奇的一些预见，其余全部来自图灵。当然，这是后话，况且发明电子计算机也不是他唯一的成就和贡献。


    ![](img/figure_0036_0021.jpg)


    冯·诺依曼


    冯·诺依曼的职业生涯大致可以分为两个阶段。1940 年以前，他主要从事纯粹数学的研究，在数理逻辑、集合论和量子理论方面都卓有建树；他还开拓了遍历理论的新领域，运用紧致群解决了希尔伯特第五问题，在测度论、格论和连续几何学方面做出过开创性的贡献。在
    1936 年到 1943 年间，他和数学家默里合作创造了算子环理论，即所谓的冯·诺依曼代数。


    1940 年以后，冯·诺依曼进入了他职业生涯的第二个阶段，研究方向转向应用数学。如果说他的纯粹数学成就属于数学界，那么他在力学、经济学、数值分析和电子计算机方面的成就则属于全人类。第二次世界大战爆发后，冯·诺依曼因战事的需要开始研究可压缩气体的运动，建立冲击波理论和湍流理论，发展了流体力学。自
    1942 年起，他同莫根施特恩合作，写作《博弈论和经济行为》一书。这是博弈论中的经典著作，使他成为数理经济学的奠基人之一。


    冯·诺依曼发明电子计算机其实是一个巧合。第二次世界大战爆发后，冯·诺依曼就参加了美国研制原子弹的工作。在对核反应过程的研究中，要对一个反应的传播做出“是”或“否”的回答。解决这一问题通常需要通过几十亿次的数学运算和逻辑判断，为此他所在的洛斯阿拉莫斯实验室聘用了
    100 多名女计算员，利用台式计算机从早到晚不停地计算，可还是远远不能满足需要。无穷无尽的数字和逻辑指令如同无底洞一样把人们的智慧和精力消耗殆尽，这让冯·诺依曼大伤脑筋。


    1944 年夏季的一天，正在火车站候车的冯·诺依曼巧遇了戈尔斯坦中尉。当时，戈尔斯坦中尉是美国弹道实验室的军方负责人，他正在参与当时主要由英国科学家负责的
    ENIAC 计算机的研制工作。在交谈中，戈尔斯坦告诉冯·诺依曼，ENIAC 计算机证明电子真空技术可以大大地提高计算技术。不过，ENIAC 计算机存在两大问题：一是没有存储器，无论是计算过程还是计算结果都无法保存在计算机里，每次运算都要从零开始；二是它用布线接板进行控制，搭接工作甚至需要几天来完成，计算效率也就被这一工作抵消了。他们正在寻找解决这两个问题的方法，想尽快着手研制另一台计算机，以便改进其性能。具有远见卓识的冯·诺依曼突然眼前一亮，他意识到了这项工作的深远意义。


    ![](img/figure_0038_0022.jpg)


    电子计算机 ENIAC


    不久，冯·诺依曼就由戈尔斯坦中尉介绍参加了 ENIAC 计算机研制小组。1945 年，在他的领导下，研制小组发布了一个全新的“存储程序通用电子计算机方案”（EDVAC）。在此过程中，冯·诺依曼显示出了他扎实的数理基础，充分发挥了他的顾问作用以及探索和综合分析问题的能力。冯·诺依曼以《关于
    EDVAC 的报告草案》为题，起草了长达 101 页的总结报告。该报告广泛而具体地介绍了制造电子计算机和设计程序的新思想。这份报告是计算机发展史上的一份具有划时代意义的文献，它向世界宣告：电子计算机的时代开始了。


    EDVAC 方案明确了新机器由 5 部分组成，其中包括运算器、控制器、存储器、输入设备和输出设备，并描述了这 5 部分的功能和相互关系。在报告中，冯·诺依曼对
    EDVAC 中的两大设计思想做了进一步的论证，为计算机的设计树立了一座里程碑。


    设计思想之一是二进制，他根据电子元件双稳态工作的特点，建议在电子计算机中采用二进制。他在报告中提到了二进制的优点，并预言二进制的采用将大大简化机器的逻辑线路。冯·诺依曼提出的计算机基本工作原理奠定了现代电子计算机的基础，使他成为了“电子计算机之父”。


