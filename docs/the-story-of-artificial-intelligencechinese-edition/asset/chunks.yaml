- raw: '卡斯帕罗夫和“深蓝”的比赛在纽约公平中心举行。摄像头全程监控，媒体跟踪报道，全球数百万人观看了这场比赛。“深蓝”获胜的概率并不确定，因为在1996年的第一次对决中，“深蓝”以2∶4落败卡斯帕罗夫。比赛并不是在标准舞台上进行，而是在一个小型电视演播室内进行。观众在地下剧场内通过电视屏幕观看比赛，这里与举行比赛的场地相隔几层楼。剧场可容纳大约500人，在6场比赛中，每场都座无虚席。


    ![](images/figure_0097_0065.jpg)


    卡斯帕罗夫和“深蓝”的比赛


    卡斯帕罗夫赢了第一局，第二局则输给了“深蓝”，场内场外气氛格外紧张。在接下来的3局中，二者打成平局。6局比赛结束后，“深蓝”最终获胜。比赛结果在瞬间成了全球媒体争相报道的头条新闻，让全球30多亿人惊叹于计算机的超人能力。


    其实，国际象棋是人工智能研究中最早涉及的棋类。在第二次世界大战还在进行的时候，图灵就开发过一个国际象棋程序。不过，当时的计算机既无时间（因为忙于第二次世界大战情报破译）又无能力（因为当时的计算机还很简陋），图灵只好和同事在纸上模拟竞赛。他模拟程序的运行，计算一步要花上近1小时的时间。好在他的同事还算有耐心，也许是因为他的同事总是赢。


    冯·诺依曼也研究过计算机下棋，还提出了博弈树搜索理论。不过，真正开启计算机下棋理论研究的是1950年香农在《哲学杂志》上发表的论文《计算机下棋程序》，其中的主要思路在后来的“深蓝”和谷歌的阿尔法狗系统中都有体现。下棋程序的一个核心技术就是博弈树搜索。


    博弈树搜索是指一个招法向着后续招法分叉，形成一棵博弈树。最简单的搜索法称为暴力搜索法。这种方法全面生成所有可能的招法，并选择其中最优的一个，也就是尽可能对博弈树穷尽搜索。另一种策略称为β方法，基本思想是剔除某些分叉。


    暴力搜索法遇到的主要难题是博弈树所包含的局面数量实在太多了。国际象棋每个局面平均有40步符合规则的招法，如果你对每步招法都考虑应招，就会遇到1600（即40×40）个局面，而4步之后是256万个，6步之后是约41亿个。平均一局棋大约走40个回合80步，于是所有可能的局面就达10128个。这个数字远远大于已知宇宙中原子的总数目（大约为1080）！


    纽厄尔、西蒙和约翰·肖发展的α-β算法可以从搜索树中剔除相当大的部分而不影响最后的结果。它的基本思想是：如果有些招法将自己引入了很差的局面，这个招法的所有后续招法就都不用继续分析了。也就是说，如果有一个完美的局面评估方法，那么只要把最好的一个招法留下来就可以了。当然，这种完美的评估方法不存在，不过只要有一个足够好的评估方法，那么就可以在每一层分析时只保留几个比较好的招法，这就大大减轻了搜索法的负担。α-β算法和优秀人类棋手下棋时的思考过程已经非常接近了。


    20世纪70年代，发明了UNIX系统和C语言的计算机科学家汤普森开始研究国际象棋。他和贝尔实验室的同事一起决定建造一台专门用于下国际象棋的机器，他们把这台机器叫作Belle，使用了价值大约为2万美元的几百块芯片。Belle每秒能够搜索大约18万个局面，而当时的百万美元级超级计算机只能搜索5000个。Belle在比赛中可以搜索8～9层那么深，是第一台达到国际象棋大师级水平的计算机。


    ![](images/figure_0098_0066.jpg)


    Belle国际象棋机器


    从1980年到1983年，它战胜了所有其他计算机棋手，赢得了世界计算机国际象棋竞赛冠军。Belle的成功，开创了通过研发国际象棋专用芯片来提高搜索速度的道路。1982年，汤普森准备带着Belle去苏联参加比赛。在肯尼迪机场过海关时，Belle被海关没收了，理由是企图向苏联运送先进武器。原来Belle的终端里有当时对苏联禁运的超大规模集成电路，这还了得？调查前前后后竟然用了一年时间，汤普森被罚款600美元，才算把Belle最终赎了回来。


    ![](images/figure_0099_0067.jpg)


    “深蓝”的开发团队


    汤普森针对搜索深度和棋力提高之间的关系做了非常有意义的实验。他让Belle跟自己下棋，但只让一方的搜索深度不断增加。结果是根据胜负比率，平均每增加一个搜索深度，可大约换算成国际象棋等级分200分。由此推论，可以计算出搜索深度达到14层时，就达到了当时世界冠军卡斯帕罗夫的水平，即2800分。当时计算机行业专家的推测是：要与人类世界冠军争夺输赢，必须研制一台每秒运算10亿次的计算机（对应于搜索到14层的深度）。


    光阴似箭，一晃就到了20世纪90年代。IBM公司自从在人机跳棋比赛中大获全胜以来，一直想在国际象棋对决上也能拔得头筹，特别是他们在看到相关技术的巨大商业价值后，游说了当时最强的两个机器象棋系统开发团队，其中一个是卡内基·梅隆大学的柏林纳团队，另一个是来自中国台湾的许峰雄团队。当时许峰雄团队开发的象棋系统已经达到了2400分的等级水平。“深蓝”正式在IBM公司立项，名字来自IBM公司的昵称。因为IBM公司生产的大型计算机都是深蓝色的，所以“深蓝”一直是计算机界对IBM公司的别称。“深蓝”项目的目标就是打败国际象棋世界冠军卡斯帕罗夫。这就有了前面讲的故事。


    然而，人机对决的历史还没有最终结束，围棋这一棋类的珠穆朗玛峰还没有人攀登。鹿死谁手，还需拭目以待。


    ## [5.5 阿尔法狗打败世界围棋大师](../contents/content.xhtml#toc36)


    在人工智能研究突破跳棋、国际象棋之后，人类又开始向棋弈的最高峰——围棋发起最后的冲锋。关于计算机下围棋，“深蓝”的主开发师许峰雄都说：“这实在太难了，以至于在未来20年中可能都得不到解决。”这句话里“解决”的含义应该就是战胜围棋世界冠军，然而这个预言在2016年提前6年被强大的阿尔法狗团队打破。


    阿尔法狗是由谷歌旗下的DeepMind公司开发的人工智能围棋程序。深心公司的创始人戴密斯·哈萨比斯是个混血儿，他的父亲是希腊的塞浦路斯人，母亲是新加坡华人。他生于1976年，在英国伦敦长大。小时候，他就是国际象棋和计算机双料神童，4岁开始下国际象棋，8岁自学编程，13岁获得国际象棋大师称号。2010年，哈萨比斯创立了专注于人工智能研发的深心公司，目标是建立强大的通用学习算法，将技术应用于解决现实世界的难题。


    2016年3月9日，一场划时代的围棋人机大战在韩国举行，出来挑战人类的是谷歌从2014年开始研发的人工智能围棋程序阿尔法狗，和机器对弈的是来自韩国的围棋世界冠军李世石。七天鏖战，五大回合，风云滚滚，举世瞩目。最终，阿尔法狗以4∶1大胜李世石，宣告了在人机大战中人类的彻底失败，成为了人工智能超越人类智能的一大例证。


    ![](images/figure_0100_0068.jpg)


    阿尔法狗与李世石对决


    美国政治家乔治·多尔西曾经说过：“游戏是知识之源。”下棋是人类游戏中的一大古老项目，从跳棋、国际象棋到围棋，人们痴迷于其中，乐此不疲。计算机科学之父图灵说过：“下棋需要智能。”下棋一直被视为对人类智能的挑战，自然也成了人工智能水平的一种标志。


    阿尔法狗是一个相当复杂的程序系统，用到了人工智能技术的很多方面，但最为核心的就是被称为强化学习的技术。它的发明者是美国计算机科学博士巴托和他在麻省理工学院培养出来的第一个博士生萨顿。然而造化弄人，强化学习自发明以来一直不被重视，也没有得到什么有价值的应用，直到谷歌的阿尔法狗采用这一技术大胜人类之后，它才受到追捧。


    ![](images/figure_0101_0069.jpg)


    迷宫图


    强化学习是一种什么样的方法呢？我们都玩过迷宫游戏，下面就用这个游戏来说明一下。假设在一个迷宫里，一只老鼠想要找到藏匿在其中的一块奶酪，我们用左边的图来表示。图中的灰点表示老鼠可能前往的地方，用强化学习的术语讲，这些点被称为状态。在每一个状态下，老鼠有4种可能的选择，即向左、向右、向前（前进）和向后（后退）。当然，在不同的状态下，不一定所有的选择都是可行的。比如说到了死角，就只能有一种选择——后退。每一种选择都会让老鼠进入下一个状态，面临下一种选择。这种状态和选择的集合可以构成一幅行进的路线图。老鼠怎样在这些可能的状态中进行选择呢？


    老鼠面临的问题是它事先并不知道这个迷宫是什么样子，也不知道它有多少可能的选择。它只能通过不断地探索，在失败中标记路线，调整自己的行进路线，我们把这种方法叫作试错法。强化学习就是通过探索每一个状态下的所有可能性并将其标记下来，绘制出一幅包含所有可能性的路线图。每一种可能的行进路线称为一种策略，而最佳的策略就是路径最短的那种走法。这幅图在强化学习里面叫博弈树。


    问题又来了。随着可能性的增多，博弈树呈指数级增长，导致计算时间和数据存储量呈爆炸性增长。麦卡锡提出用α-β剪枝技术来控制博弈树的蔓延。这种剪枝技术的核心思想是边画树状图边计算评估路径的优劣，当评估值超出一定范围时，博弈树的蔓延就停止，这样就大大减小了博弈树的规模。


    然而，在围棋程序上，这种方法又遇到了困难。围棋的棋子比跳棋和国际象棋多得多，组合的可能性也多，画出博弈树后采用α-β剪枝技术不太经济。于是，有人想到了蒙特卡罗法。它最早是由法国数学家布丰在1777年用投针实验的方法求圆周率时提出的。后来冯·诺依曼用世界闻名的赌城摩洛哥的蒙特卡罗进行命名。


    蒙特卡罗法最常用的教学例子是计算圆的面积。在一个正方形里面画一个内切圆，然后随机往这个正方形里扔沙粒。扔到足够多时，开始数有多少沙粒落在圆的里面，用这个数字除以所投沙粒的总数后再乘以正方形的面积，就得到圆的面积了。这其实是一种概率统计的方法。


    阿尔法狗团队首先利用几万局专业棋手对局的棋谱来训练系统，对棋盘上的每个可落子的位置都给出了一个估值，也就是围棋高手下到这个点的概率。得到初步的策略网络后，平衡目标和策略网络，在适当牺牲走棋质量的条件下，速度要比策略网络快，即“快速走子”。训练策略网络时，采用深度学习算法，以当前盘面状态作为输入，输出下一步棋在棋盘的其他空地上落子的概率。


    ![](images/figure_0102_0070.jpg)


    阿尔法狗开发团队


    “快速走子”是基于局部特征和线性模型进行训练的。完成这一步后，阿尔法狗已经初步模拟了人类专业棋手的棋感。接下来，阿尔法狗采用左右互搏的模式，不同版本的阿尔法狗之间下了3000万局。利用强化学习算法，通过每局的胜负来进行学习，不断优化和升级策略网络，同时建立了一个可以针对当前局面估计黑棋和白棋胜率的估值网络。根据阿尔法狗团队的数据，对比围棋专业棋手的下法，策略网络在2毫秒内能达到57%的走子准确率，“快速走子”在2微秒内能达到24.2%的走子准确率。


    实际对弈时，阿尔法狗通过蒙特卡罗法来管理整个对弈的搜索过程。首先，通过策略网络，阿尔法狗可以优先搜索本方最有可能落子的点（通常少于10个）。对于每种可能，阿尔法狗可以通过估值网络评估胜算率。同时，可以利用“快速走子”走到结局，通过结局的胜负来判断局势的优劣。综合这两种判断的评分，再进一步优化策略网络的判断，分析需要更进一步展开搜索和演算的局面。综合这几种工具，辅以超级强大的并行运算能力，阿尔法狗在推演棋局变化和寻找妙招方面的能力已经远超人类棋手。阿尔法狗系统配置有1920个CPU（中央处理器）和280个GPU（图形处理器），可以同时运行64个搜索线程。这样的计算速度就好像有几十个九段高手在同时思考棋局，还有几十个三段棋手帮着他们把一些难以判断的局面直接预演下来，拿出结论。任何一位人类棋手要与这样强大的对手对抗，实在是难上加难。


    2016年3月的这场围棋人机大战标志着跨世纪的棋弈人机大战的最终结束。回首机器下棋的历史，从20世纪80年代末跳棋程序钦诺克的“独孤求败”，到90年代末IBM公司的国际象棋程序“深蓝”无人能敌，再到本世纪初中国象棋程序开始击败人类特级大师，直到今天谷歌的阿尔法狗完胜人类围棋大师，人工智能技术在不断的探索中前进，在棋弈对决中彻底战胜了人类智能！


    # [第6章 给计算机一双眼睛](../contents/content.xhtml#toc37)


    ## [6.1 让计算机看得见需要什么](../contents/content.xhtml#toc38)


    在人类对外部世界的了解和认知中，很大一部分来自视觉，那么能不能让机器也具有视觉呢？人工智能领域的一个十分重要的课题是让计算机能够看得见，我们称之为计算机视觉或机器视觉。


    最早的机器视觉探索是从字符识别开始的。早在20世纪五六十年代，字符识别系统的研究就已经取得了很大的成果。这个领域被称为光学字符识别，它可以让打印在纸上的固定字体的字符被机器识别出来。


    当时很成功的一个案例是斯坦福研究所开发出的一套系统，它用带有磁性的墨水打印字符，以此来自动识别银行的支票。通过专用的扫描设备，可以把打印的字符准确地采集下来并传送给计算机系统，再和一个模板字符库里的字符进行比对，从而识别出支票上的每一个字符。1959年，美国银行开始正式采用这套系统处理银行的支票业务，不久各个银行也纷纷采用，并且一直沿用至今。


    虽然这套系统十分成功并被应用于银行系统，但关于文字识别，它的局限性是十分明显的。为了识别出一个字符，这个字符必须用磁性墨水打印出来，并且必须具有固定的字体、格式和大小。对于任何手写体以及任何不是用磁性墨水打印出来的字符，这套系统就无法识别了。1960年，美国的两名科学家奥利沃塞·福瑞德和沃瑞克·纳瑟发表了一篇论文，提出了通过图像处理、图像特征提取和概率方法来识别手写字符。


    ![](images/figure_0105_0071.jpg)


    支票


    ![](images/figure_0105_0072.jpg)


    磁性字符


    他们的方法可以简单地概括成这样几个步骤：首先对写有字符的纸进行扫描，形成一个由0和1组成的二进制码的像素位图；然后对这样的图像进行清理，把明显是“杂音”的数位去除，把字符的笔画加粗强化，让字符更清晰和突出；接下来对笔画特征进行分辨和提取，检查字符笔画中有没有横竖撇捺、交叉和闭环等特征，并且给字符中每一个识别出来的特征一个概率值。这个概率值称为权重值，用于反映这一特征相对于其他特征的重要程度，从而区分出不同字符间相似的笔画。整个过程分步骤一层一层地从初始处理分辨向抽象特征提取汇总，得出这个字符不同于其他字符的特征，从而确定这是一个什么字符。


    特征权重值是通过使用大量供训练用的字符图像让系统进行学习而最终确定的。经过训练后，系统可以开始识别任何新的字符图像。根据奥利沃塞·福瑞德和沃瑞克·纳瑟的介绍，“用这种方法，系统经训练后识别字符的正确率和人工识别相比只有大约10%的差距”。在当时的技术条件下，这样的结果相当令人鼓舞。


    ![](images/figure_0106_0073.jpg)


    特征提取


    但字符识别只是计算机视觉中最简单的一种，因为图像中的字符只是有限而简单的二维图形，而真正的计算机视觉应能处理来自三维世界的二维平面图像，就像我们用照相机拍下的照片那样。但通过二维图像展现三维世界时，我们会失去一些信息，比如景深。同样的物体从不同角度拍下来，看上去也会不一样。用一幅二维图像充分地还原真实的场景几乎是一件不太可能的事情。


    人类和动物是怎样看世界的呢？他们都能很好地通过落在视网膜上的二维图像准确地认识周边的三维世界。我们不难发现，人和很多动物都有两只眼睛，具有立体视觉。也就是说，用两只眼睛看世界时，观察到的物体由于两只眼睛的观察角度不同而在位置和形状上有所不同，从而可以把握物体的立体空间。计算机也可以从两个不同的角度对同一环境的图像进行采集、分析和计算，从而获得环境的深度信息。那么，是不是只有这样，机器才能真正获得外部世界的准确信息呢？


    其实，计算机视觉采用的大多数方法并不是立体视觉，而是利用光线、物体线条之间的角度关系和背景信息等从一幅二维图像上获得对三维世界的认识。有的科学家试图在对生物视觉原理的研究和发现中寻找计算机视觉问题的解决方法。


    美国麻省理工学院的4个生物学家在研究青蛙如何观察世界时，发现青蛙其实并不是通过完整的视觉还原来感知其眼前的事物的。他们发现青蛙的眼睛由一些“探测器”构成。这些“探测器”都具有自己的功能，有的用来探视小的运动物体（如飞虫），有的对光线的突然变化十分敏感。通过对不同环境因素的汇总，青蛙可以准确地获得关于食物或危险的信息。他们把自己的研究发现写成了一篇论文《青蛙的眼睛告诉了青蛙大脑些什么？》，立刻引起了人工智能学者和专家们的注意。


    美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔从1958年开始研究大脑神经的视觉功能。他们发现哺乳动物的一些神经元会选择性地对图像和图像中的一些特定形状产生反应。1959年，他们在猫的大脑的视觉神经部分植入了微电极。他们发现，当猫看到不同角度的短线条时，不同的神经元会迅速放电。他们甚至可以绘出一幅猫脑中的不同神经元对不同角度的线条发生反应的图像。进一步的研究表明，另外一些神经元会对更复杂的形状产生反应。同样的现象在猴子的大脑里也被发现。这项研究不仅让他们获得了1981年的诺贝尔生理学或医学奖，而且也让研究计算机视觉的人工智能学者脑洞大开，让他们认识到在计算机视觉处理上从一幅图像中提取线条具有十分重要的意义。


    ![](images/figure_0107_0074.jpg)


    一个魔方的线框图


    第一个写出能从一幅图像里提取物体线条的程序的人是麻省理工学院的博士研究生劳伦斯·罗伯茨。在1963年读博士时，他发现可以根据一张照片上黑白颜色的层次分布情况来确定照片上物体的不同面之间的边界线条，从而得到一幅关于物体形状的线框图。虽然他的方法只能处理黑白照片，但在当时是一个创举。当时图像处理方面的研究大都是在处理像字符识别这样的二维对象，那些方法无法处理表现三维物体的图片。他的发明把图像处理推向了一个全新的方向，让后来的图形识别研究在其基础上阔步前进。他也成为了美国国防部高级研究计划局的首席科学家和信息技术部主任，在日后发明互联网时发挥了重要的作用。


    ## [6.2 特征与分类——图像识别的基本方法](../contents/content.xhtml#toc39)


    早在20世纪60年代，位于硅谷的全景研究公司就已经开发出了人脸识别程序。他们通过对一个人脸部的40张不同照片上五官的特点（比如两眼瞳孔之间的距离、眼角的位置、嘴的大小等）进行提取，得到了一个有20个关于距离和大小等特征的数据列表。这些列表形成了一个人脸数据库，可以用这个数据库里的特征数据来识别人脸。如果一个人的脸部特征数据与数据库里存储的信息非常接近或相同，则认为他的脸被识别出来了。


    这种早期的人脸识别技术还是比较简单和原始的，对照片上人脸不同部位的大小、位置、角度和光线等的要求比较苛刻，否则识别效果就会很差。但这些方法中已经包含了图像识别的基本技术，那就是特征提取和分类。


    ![](images/figure_0108_0075.jpg)


    人脸特征识别'
  fmt: '

    卡斯帕罗夫和“深蓝”的比赛在纽约公平中心举行。摄像头全程监控，媒体跟踪报道，全球数百万人观看了这场比赛。“深蓝”获胜的概率并不确定，因为在1996年的第一次对决中，“深蓝”以2∶4落败卡斯帕罗夫。比赛并不是在标准舞台上进行，而是在一个小型电视演播室内进行。观众在地下剧场内通过电视屏幕观看比赛，这里与举行比赛的场地相隔几层楼。剧场可容纳大约500人，在6场比赛中，每场都座无虚席。


    ![](images/figure_0097_0065.jpg)


    卡斯帕罗夫和“深蓝”的比赛


    卡斯帕罗夫赢了第一局，第二局则输给了“深蓝”，场内场外气氛格外紧张。在接下来的3局中，二者打成平局。6局比赛结束后，“深蓝”最终获胜。比赛结果在瞬间成了全球媒体争相报道的头条新闻，让全球30多亿人惊叹于计算机的超人能力。


    其实，国际象棋是人工智能研究中最早涉及的棋类。在第二次世界大战还在进行的时候，图灵就开发过一个国际象棋程序。不过，当时的计算机既无时间（因为忙于第二次世界大战情报破译）又无能力（因为当时的计算机还很简陋），图灵只好和同事在纸上模拟竞赛。他模拟程序的运行，计算一步要花上近1小时的时间。好在他的同事还算有耐心，也许是因为他的同事总是赢。


    冯·诺依曼也研究过计算机下棋，还提出了博弈树搜索理论。不过，真正开启计算机下棋理论研究的是1950年香农在《哲学杂志》上发表的论文《计算机下棋程序》，其中的主要思路在后来的“深蓝”和谷歌的阿尔法狗系统中都有体现。下棋程序的一个核心技术就是博弈树搜索。


    博弈树搜索是指一个招法向着后续招法分叉，形成一棵博弈树。最简单的搜索法称为暴力搜索法。这种方法全面生成所有可能的招法，并选择其中最优的一个，也就是尽可能对博弈树穷尽搜索。另一种策略称为β方法，基本思想是剔除某些分叉。


    暴力搜索法遇到的主要难题是博弈树所包含的局面数量实在太多了。国际象棋每个局面平均有40步符合规则的招法，如果你对每步招法都考虑应招，就会遇到1600（即40×40）个局面，而4步之后是256万个，6步之后是约41亿个。平均一局棋大约走40个回合80步，于是所有可能的局面就达10128个。这个数字远远大于已知宇宙中原子的总数目（大约为1080）！


    纽厄尔、西蒙和约翰·肖发展的α-β算法可以从搜索树中剔除相当大的部分而不影响最后的结果。它的基本思想是：如果有些招法将自己引入了很差的局面，这个招法的所有后续招法就都不用继续分析了。也就是说，如果有一个完美的局面评估方法，那么只要把最好的一个招法留下来就可以了。当然，这种完美的评估方法不存在，不过只要有一个足够好的评估方法，那么就可以在每一层分析时只保留几个比较好的招法，这就大大减轻了搜索法的负担。α-β算法和优秀人类棋手下棋时的思考过程已经非常接近了。


    20世纪70年代，发明了UNIX系统和C语言的计算机科学家汤普森开始研究国际象棋。他和贝尔实验室的同事一起决定建造一台专门用于下国际象棋的机器，他们把这台机器叫作Belle，使用了价值大约为2万美元的几百块芯片。Belle每秒能够搜索大约18万个局面，而当时的百万美元级超级计算机只能搜索5000个。Belle在比赛中可以搜索8～9层那么深，是第一台达到国际象棋大师级水平的计算机。


    ![](images/figure_0098_0066.jpg)


    Belle国际象棋机器


    从1980年到1983年，它战胜了所有其他计算机棋手，赢得了世界计算机国际象棋竞赛冠军。Belle的成功，开创了通过研发国际象棋专用芯片来提高搜索速度的道路。1982年，汤普森准备带着Belle去苏联参加比赛。在肯尼迪机场过海关时，Belle被海关没收了，理由是企图向苏联运送先进武器。原来Belle的终端里有当时对苏联禁运的超大规模集成电路，这还了得？调查前前后后竟然用了一年时间，汤普森被罚款600美元，才算把Belle最终赎了回来。


    ![](images/figure_0099_0067.jpg)


    “深蓝”的开发团队


    汤普森针对搜索深度和棋力提高之间的关系做了非常有意义的实验。他让Belle跟自己下棋，但只让一方的搜索深度不断增加。结果是根据胜负比率，平均每增加一个搜索深度，可大约换算成国际象棋等级分200分。由此推论，可以计算出搜索深度达到14层时，就达到了当时世界冠军卡斯帕罗夫的水平，即2800分。当时计算机行业专家的推测是：要与人类世界冠军争夺输赢，必须研制一台每秒运算10亿次的计算机（对应于搜索到14层的深度）。


    光阴似箭，一晃就到了20世纪90年代。IBM公司自从在人机跳棋比赛中大获全胜以来，一直想在国际象棋对决上也能拔得头筹，特别是他们在看到相关技术的巨大商业价值后，游说了当时最强的两个机器象棋系统开发团队，其中一个是卡内基·梅隆大学的柏林纳团队，另一个是来自中国台湾的许峰雄团队。当时许峰雄团队开发的象棋系统已经达到了2400分的等级水平。“深蓝”正式在IBM公司立项，名字来自IBM公司的昵称。因为IBM公司生产的大型计算机都是深蓝色的，所以“深蓝”一直是计算机界对IBM公司的别称。“深蓝”项目的目标就是打败国际象棋世界冠军卡斯帕罗夫。这就有了前面讲的故事。


    然而，人机对决的历史还没有最终结束，围棋这一棋类的珠穆朗玛峰还没有人攀登。鹿死谁手，还需拭目以待。


    ## [5.5 阿尔法狗打败世界围棋大师](../contents/content.xhtml#toc36)


    在人工智能研究突破跳棋、国际象棋之后，人类又开始向棋弈的最高峰——围棋发起最后的冲锋。关于计算机下围棋，“深蓝”的主开发师许峰雄都说：“这实在太难了，以至于在未来20年中可能都得不到解决。”这句话里“解决”的含义应该就是战胜围棋世界冠军，然而这个预言在2016年提前6年被强大的阿尔法狗团队打破。


    阿尔法狗是由谷歌旗下的DeepMind公司开发的人工智能围棋程序。深心公司的创始人戴密斯·哈萨比斯是个混血儿，他的父亲是希腊的塞浦路斯人，母亲是新加坡华人。他生于1976年，在英国伦敦长大。小时候，他就是国际象棋和计算机双料神童，4岁开始下国际象棋，8岁自学编程，13岁获得国际象棋大师称号。2010年，哈萨比斯创立了专注于人工智能研发的深心公司，目标是建立强大的通用学习算法，将技术应用于解决现实世界的难题。


    2016年3月9日，一场划时代的围棋人机大战在韩国举行，出来挑战人类的是谷歌从2014年开始研发的人工智能围棋程序阿尔法狗，和机器对弈的是来自韩国的围棋世界冠军李世石。七天鏖战，五大回合，风云滚滚，举世瞩目。最终，阿尔法狗以4∶1大胜李世石，宣告了在人机大战中人类的彻底失败，成为了人工智能超越人类智能的一大例证。


    ![](images/figure_0100_0068.jpg)


    阿尔法狗与李世石对决


    美国政治家乔治·多尔西曾经说过：“游戏是知识之源。”下棋是人类游戏中的一大古老项目，从跳棋、国际象棋到围棋，人们痴迷于其中，乐此不疲。计算机科学之父图灵说过：“下棋需要智能。”下棋一直被视为对人类智能的挑战，自然也成了人工智能水平的一种标志。


    阿尔法狗是一个相当复杂的程序系统，用到了人工智能技术的很多方面，但最为核心的就是被称为强化学习的技术。它的发明者是美国计算机科学博士巴托和他在麻省理工学院培养出来的第一个博士生萨顿。然而造化弄人，强化学习自发明以来一直不被重视，也没有得到什么有价值的应用，直到谷歌的阿尔法狗采用这一技术大胜人类之后，它才受到追捧。


    ![](images/figure_0101_0069.jpg)


    迷宫图


    强化学习是一种什么样的方法呢？我们都玩过迷宫游戏，下面就用这个游戏来说明一下。假设在一个迷宫里，一只老鼠想要找到藏匿在其中的一块奶酪，我们用左边的图来表示。图中的灰点表示老鼠可能前往的地方，用强化学习的术语讲，这些点被称为状态。在每一个状态下，老鼠有4种可能的选择，即向左、向右、向前（前进）和向后（后退）。当然，在不同的状态下，不一定所有的选择都是可行的。比如说到了死角，就只能有一种选择——后退。每一种选择都会让老鼠进入下一个状态，面临下一种选择。这种状态和选择的集合可以构成一幅行进的路线图。老鼠怎样在这些可能的状态中进行选择呢？


    老鼠面临的问题是它事先并不知道这个迷宫是什么样子，也不知道它有多少可能的选择。它只能通过不断地探索，在失败中标记路线，调整自己的行进路线，我们把这种方法叫作试错法。强化学习就是通过探索每一个状态下的所有可能性并将其标记下来，绘制出一幅包含所有可能性的路线图。每一种可能的行进路线称为一种策略，而最佳的策略就是路径最短的那种走法。这幅图在强化学习里面叫博弈树。


    问题又来了。随着可能性的增多，博弈树呈指数级增长，导致计算时间和数据存储量呈爆炸性增长。麦卡锡提出用α-β剪枝技术来控制博弈树的蔓延。这种剪枝技术的核心思想是边画树状图边计算评估路径的优劣，当评估值超出一定范围时，博弈树的蔓延就停止，这样就大大减小了博弈树的规模。


    然而，在围棋程序上，这种方法又遇到了困难。围棋的棋子比跳棋和国际象棋多得多，组合的可能性也多，画出博弈树后采用α-β剪枝技术不太经济。于是，有人想到了蒙特卡罗法。它最早是由法国数学家布丰在1777年用投针实验的方法求圆周率时提出的。后来冯·诺依曼用世界闻名的赌城摩洛哥的蒙特卡罗进行命名。


    蒙特卡罗法最常用的教学例子是计算圆的面积。在一个正方形里面画一个内切圆，然后随机往这个正方形里扔沙粒。扔到足够多时，开始数有多少沙粒落在圆的里面，用这个数字除以所投沙粒的总数后再乘以正方形的面积，就得到圆的面积了。这其实是一种概率统计的方法。


    阿尔法狗团队首先利用几万局专业棋手对局的棋谱来训练系统，对棋盘上的每个可落子的位置都给出了一个估值，也就是围棋高手下到这个点的概率。得到初步的策略网络后，平衡目标和策略网络，在适当牺牲走棋质量的条件下，速度要比策略网络快，即“快速走子”。训练策略网络时，采用深度学习算法，以当前盘面状态作为输入，输出下一步棋在棋盘的其他空地上落子的概率。


    ![](images/figure_0102_0070.jpg)


    阿尔法狗开发团队


    “快速走子”是基于局部特征和线性模型进行训练的。完成这一步后，阿尔法狗已经初步模拟了人类专业棋手的棋感。接下来，阿尔法狗采用左右互搏的模式，不同版本的阿尔法狗之间下了3000万局。利用强化学习算法，通过每局的胜负来进行学习，不断优化和升级策略网络，同时建立了一个可以针对当前局面估计黑棋和白棋胜率的估值网络。根据阿尔法狗团队的数据，对比围棋专业棋手的下法，策略网络在2毫秒内能达到57%的走子准确率，“快速走子”在2微秒内能达到24.2%的走子准确率。


    实际对弈时，阿尔法狗通过蒙特卡罗法来管理整个对弈的搜索过程。首先，通过策略网络，阿尔法狗可以优先搜索本方最有可能落子的点（通常少于10个）。对于每种可能，阿尔法狗可以通过估值网络评估胜算率。同时，可以利用“快速走子”走到结局，通过结局的胜负来判断局势的优劣。综合这两种判断的评分，再进一步优化策略网络的判断，分析需要更进一步展开搜索和演算的局面。综合这几种工具，辅以超级强大的并行运算能力，阿尔法狗在推演棋局变化和寻找妙招方面的能力已经远超人类棋手。阿尔法狗系统配置有1920个CPU（中央处理器）和280个GPU（图形处理器），可以同时运行64个搜索线程。这样的计算速度就好像有几十个九段高手在同时思考棋局，还有几十个三段棋手帮着他们把一些难以判断的局面直接预演下来，拿出结论。任何一位人类棋手要与这样强大的对手对抗，实在是难上加难。


    2016年3月的这场围棋人机大战标志着跨世纪的棋弈人机大战的最终结束。回首机器下棋的历史，从20世纪80年代末跳棋程序钦诺克的“独孤求败”，到90年代末IBM公司的国际象棋程序“深蓝”无人能敌，再到本世纪初中国象棋程序开始击败人类特级大师，直到今天谷歌的阿尔法狗完胜人类围棋大师，人工智能技术在不断的探索中前进，在棋弈对决中彻底战胜了人类智能！


    # [第6章 给计算机一双眼睛](../contents/content.xhtml#toc37)


    ## [6.1 让计算机看得见需要什么](../contents/content.xhtml#toc38)


    在人类对外部世界的了解和认知中，很大一部分来自视觉，那么能不能让机器也具有视觉呢？人工智能领域的一个十分重要的课题是让计算机能够看得见，我们称之为计算机视觉或机器视觉。


    最早的机器视觉探索是从字符识别开始的。早在20世纪五六十年代，字符识别系统的研究就已经取得了很大的成果。这个领域被称为光学字符识别，它可以让打印在纸上的固定字体的字符被机器识别出来。


    当时很成功的一个案例是斯坦福研究所开发出的一套系统，它用带有磁性的墨水打印字符，以此来自动识别银行的支票。通过专用的扫描设备，可以把打印的字符准确地采集下来并传送给计算机系统，再和一个模板字符库里的字符进行比对，从而识别出支票上的每一个字符。1959年，美国银行开始正式采用这套系统处理银行的支票业务，不久各个银行也纷纷采用，并且一直沿用至今。


    虽然这套系统十分成功并被应用于银行系统，但关于文字识别，它的局限性是十分明显的。为了识别出一个字符，这个字符必须用磁性墨水打印出来，并且必须具有固定的字体、格式和大小。对于任何手写体以及任何不是用磁性墨水打印出来的字符，这套系统就无法识别了。1960年，美国的两名科学家奥利沃塞·福瑞德和沃瑞克·纳瑟发表了一篇论文，提出了通过图像处理、图像特征提取和概率方法来识别手写字符。


    ![](images/figure_0105_0071.jpg)


    支票


    ![](images/figure_0105_0072.jpg)


    磁性字符


    他们的方法可以简单地概括成这样几个步骤：首先对写有字符的纸进行扫描，形成一个由0和1组成的二进制码的像素位图；然后对这样的图像进行清理，把明显是“杂音”的数位去除，把字符的笔画加粗强化，让字符更清晰和突出；接下来对笔画特征进行分辨和提取，检查字符笔画中有没有横竖撇捺、交叉和闭环等特征，并且给字符中每一个识别出来的特征一个概率值。这个概率值称为权重值，用于反映这一特征相对于其他特征的重要程度，从而区分出不同字符间相似的笔画。整个过程分步骤一层一层地从初始处理分辨向抽象特征提取汇总，得出这个字符不同于其他字符的特征，从而确定这是一个什么字符。


    特征权重值是通过使用大量供训练用的字符图像让系统进行学习而最终确定的。经过训练后，系统可以开始识别任何新的字符图像。根据奥利沃塞·福瑞德和沃瑞克·纳瑟的介绍，“用这种方法，系统经训练后识别字符的正确率和人工识别相比只有大约10%的差距”。在当时的技术条件下，这样的结果相当令人鼓舞。


    ![](images/figure_0106_0073.jpg)


    特征提取


    但字符识别只是计算机视觉中最简单的一种，因为图像中的字符只是有限而简单的二维图形，而真正的计算机视觉应能处理来自三维世界的二维平面图像，就像我们用照相机拍下的照片那样。但通过二维图像展现三维世界时，我们会失去一些信息，比如景深。同样的物体从不同角度拍下来，看上去也会不一样。用一幅二维图像充分地还原真实的场景几乎是一件不太可能的事情。


    人类和动物是怎样看世界的呢？他们都能很好地通过落在视网膜上的二维图像准确地认识周边的三维世界。我们不难发现，人和很多动物都有两只眼睛，具有立体视觉。也就是说，用两只眼睛看世界时，观察到的物体由于两只眼睛的观察角度不同而在位置和形状上有所不同，从而可以把握物体的立体空间。计算机也可以从两个不同的角度对同一环境的图像进行采集、分析和计算，从而获得环境的深度信息。那么，是不是只有这样，机器才能真正获得外部世界的准确信息呢？


    其实，计算机视觉采用的大多数方法并不是立体视觉，而是利用光线、物体线条之间的角度关系和背景信息等从一幅二维图像上获得对三维世界的认识。有的科学家试图在对生物视觉原理的研究和发现中寻找计算机视觉问题的解决方法。


    美国麻省理工学院的4个生物学家在研究青蛙如何观察世界时，发现青蛙其实并不是通过完整的视觉还原来感知其眼前的事物的。他们发现青蛙的眼睛由一些“探测器”构成。这些“探测器”都具有自己的功能，有的用来探视小的运动物体（如飞虫），有的对光线的突然变化十分敏感。通过对不同环境因素的汇总，青蛙可以准确地获得关于食物或危险的信息。他们把自己的研究发现写成了一篇论文《青蛙的眼睛告诉了青蛙大脑些什么？》，立刻引起了人工智能学者和专家们的注意。


    美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔从1958年开始研究大脑神经的视觉功能。他们发现哺乳动物的一些神经元会选择性地对图像和图像中的一些特定形状产生反应。1959年，他们在猫的大脑的视觉神经部分植入了微电极。他们发现，当猫看到不同角度的短线条时，不同的神经元会迅速放电。他们甚至可以绘出一幅猫脑中的不同神经元对不同角度的线条发生反应的图像。进一步的研究表明，另外一些神经元会对更复杂的形状产生反应。同样的现象在猴子的大脑里也被发现。这项研究不仅让他们获得了1981年的诺贝尔生理学或医学奖，而且也让研究计算机视觉的人工智能学者脑洞大开，让他们认识到在计算机视觉处理上从一幅图像中提取线条具有十分重要的意义。


    ![](images/figure_0107_0074.jpg)


    一个魔方的线框图


    第一个写出能从一幅图像里提取物体线条的程序的人是麻省理工学院的博士研究生劳伦斯·罗伯茨。在1963年读博士时，他发现可以根据一张照片上黑白颜色的层次分布情况来确定照片上物体的不同面之间的边界线条，从而得到一幅关于物体形状的线框图。虽然他的方法只能处理黑白照片，但在当时是一个创举。当时图像处理方面的研究大都是在处理像字符识别这样的二维对象，那些方法无法处理表现三维物体的图片。他的发明把图像处理推向了一个全新的方向，让后来的图形识别研究在其基础上阔步前进。他也成为了美国国防部高级研究计划局的首席科学家和信息技术部主任，在日后发明互联网时发挥了重要的作用。


    ## [6.2 特征与分类——图像识别的基本方法](../contents/content.xhtml#toc39)


    早在20世纪60年代，位于硅谷的全景研究公司就已经开发出了人脸识别程序。他们通过对一个人脸部的40张不同照片上五官的特点（比如两眼瞳孔之间的距离、眼角的位置、嘴的大小等）进行提取，得到了一个有20个关于距离和大小等特征的数据列表。这些列表形成了一个人脸数据库，可以用这个数据库里的特征数据来识别人脸。如果一个人的脸部特征数据与数据库里存储的信息非常接近或相同，则认为他的脸被识别出来了。


    这种早期的人脸识别技术还是比较简单和原始的，对照片上人脸不同部位的大小、位置、角度和光线等的要求比较苛刻，否则识别效果就会很差。但这些方法中已经包含了图像识别的基本技术，那就是特征提取和分类。


    ![](images/figure_0108_0075.jpg)


    人脸特征识别

    '
  trans: '


    卡斯帕罗夫和“深蓝”的比赛在纽约公平中心举行。摄像头全程监控，媒体跟踪报道，全球数百万人观看了这场比赛。“深蓝”获胜的概率并不确定，因为在 1996 年的第一次对决中，“深蓝”以
    2∶4 落败卡斯帕罗夫。比赛并不是在标准舞台上进行，而是在一个小型电视演播室内进行。观众在地下剧场内通过电视屏幕观看比赛，这里与举行比赛的场地相隔几层楼。剧场可容纳大约
    500 人，在 6 场比赛中，每场都座无虚席。


    ![](img/figure_0097_0065.jpg)


    卡斯帕罗夫和“深蓝”的比赛


    卡斯帕罗夫赢了第一局，第二局则输给了“深蓝”，场内场外气氛格外紧张。在接下来的 3 局中，二者打成平局。6 局比赛结束后，“深蓝”最终获胜。比赛结果在瞬间成了全球媒体争相报道的头条新闻，让全球
    30 多亿人惊叹于计算机的超人能力。


    其实，国际象棋是人工智能研究中最早涉及的棋类。在第二次世界大战还在进行的时候，图灵就开发过一个国际象棋程序。不过，当时的计算机既无时间（因为忙于第二次世界大战情报破译）又无能力（因为当时的计算机还很简陋），图灵只好和同事在纸上模拟竞赛。他模拟程序的运行，计算一步要花上近
    1 小时的时间。好在他的同事还算有耐心，也许是因为他的同事总是赢。


    冯·诺依曼也研究过计算机下棋，还提出了博弈树搜索理论。不过，真正开启计算机下棋理论研究的是 1950 年香农在《哲学杂志》上发表的论文《计算机下棋程序》，其中的主要思路在后来的“深蓝”和谷歌的阿尔法狗系统中都有体现。下棋程序的一个核心技术就是博弈树搜索。


    博弈树搜索是指一个招法向着后续招法分叉，形成一棵博弈树。最简单的搜索法称为暴力搜索法。这种方法全面生成所有可能的招法，并选择其中最优的一个，也就是尽可能对博弈树穷尽搜索。另一种策略称为β方法，基本思想是剔除某些分叉。


    暴力搜索法遇到的主要难题是博弈树所包含的局面数量实在太多了。国际象棋每个局面平均有 40 步符合规则的招法，如果你对每步招法都考虑应招，就会遇到 1600（即
    40×40）个局面，而 4 步之后是 256 万个，6 步之后是约 41 亿个。平均一局棋大约走 40 个回合 80 步，于是所有可能的局面就达 10128
    个。这个数字远远大于已知宇宙中原子的总数目（大约为 1080）！


    纽厄尔、西蒙和约翰·肖发展的α-β算法可以从搜索树中剔除相当大的部分而不影响最后的结果。它的基本思想是：如果有些招法将自己引入了很差的局面，这个招法的所有后续招法就都不用继续分析了。也就是说，如果有一个完美的局面评估方法，那么只要把最好的一个招法留下来就可以了。当然，这种完美的评估方法不存在，不过只要有一个足够好的评估方法，那么就可以在每一层分析时只保留几个比较好的招法，这就大大减轻了搜索法的负担。α-β算法和优秀人类棋手下棋时的思考过程已经非常接近了。


    20 世纪 70 年代，发明了 UNIX 系统和 C 语言的计算机科学家汤普森开始研究国际象棋。他和贝尔实验室的同事一起决定建造一台专门用于下国际象棋的机器，他们把这台机器叫作
    Belle，使用了价值大约为 2 万美元的几百块芯片。Belle 每秒能够搜索大约 18 万个局面，而当时的百万美元级超级计算机只能搜索 5000 个。Belle
    在比赛中可以搜索 8～9 层那么深，是第一台达到国际象棋大师级水平的计算机。


    ![](img/figure_0098_0066.jpg)


    Belle 国际象棋机器


    从 1980 年到 1983 年，它战胜了所有其他计算机棋手，赢得了世界计算机国际象棋竞赛冠军。Belle 的成功，开创了通过研发国际象棋专用芯片来提高搜索速度的道路。1982
    年，汤普森准备带着 Belle 去苏联参加比赛。在肯尼迪机场过海关时，Belle 被海关没收了，理由是企图向苏联运送先进武器。原来 Belle 的终端里有当时对苏联禁运的超大规模集成电路，这还了得？调查前前后后竟然用了一年时间，汤普森被罚款
    600 美元，才算把 Belle 最终赎了回来。


    ![](img/figure_0099_0067.jpg)


    “深蓝”的开发团队


    汤普森针对搜索深度和棋力提高之间的关系做了非常有意义的实验。他让 Belle 跟自己下棋，但只让一方的搜索深度不断增加。结果是根据胜负比率，平均每增加一个搜索深度，可大约换算成国际象棋等级分
    200 分。由此推论，可以计算出搜索深度达到 14 层时，就达到了当时世界冠军卡斯帕罗夫的水平，即 2800 分。当时计算机行业专家的推测是：要与人类世界冠军争夺输赢，必须研制一台每秒运算
    10 亿次的计算机（对应于搜索到 14 层的深度）。


    光阴似箭，一晃就到了 20 世纪 90 年代。IBM 公司自从在人机跳棋比赛中大获全胜以来，一直想在国际象棋对决上也能拔得头筹，特别是他们在看到相关技术的巨大商业价值后，游说了当时最强的两个机器象棋系统开发团队，其中一个是卡内基·梅隆大学的柏林纳团队，另一个是来自中国台湾的许峰雄团队。当时许峰雄团队开发的象棋系统已经达到了
    2400 分的等级水平。“深蓝”正式在 IBM 公司立项，名字来自 IBM 公司的昵称。因为 IBM 公司生产的大型计算机都是深蓝色的，所以“深蓝”一直是计算机界对
    IBM 公司的别称。“深蓝”项目的目标就是打败国际象棋世界冠军卡斯帕罗夫。这就有了前面讲的故事。


    然而，人机对决的历史还没有最终结束，围棋这一棋类的珠穆朗玛峰还没有人攀登。鹿死谁手，还需拭目以待。


    ## 5.5 阿尔法狗打败世界围棋大师


    在人工智能研究突破跳棋、国际象棋之后，人类又开始向棋弈的最高峰——围棋发起最后的冲锋。关于计算机下围棋，“深蓝”的主开发师许峰雄都说：“这实在太难了，以至于在未来
    20 年中可能都得不到解决。”这句话里“解决”的含义应该就是战胜围棋世界冠军，然而这个预言在 2016 年提前 6 年被强大的阿尔法狗团队打破。


    阿尔法狗是由谷歌旗下的 DeepMind 公司开发的人工智能围棋程序。深心公司的创始人戴密斯·哈萨比斯是个混血儿，他的父亲是希腊的塞浦路斯人，母亲是新加坡华人。他生于
    1976 年，在英国伦敦长大。小时候，他就是国际象棋和计算机双料神童，4 岁开始下国际象棋，8 岁自学编程，13 岁获得国际象棋大师称号。2010 年，哈萨比斯创立了专注于人工智能研发的深心公司，目标是建立强大的通用学习算法，将技术应用于解决现实世界的难题。


    2016 年 3 月 9 日，一场划时代的围棋人机大战在韩国举行，出来挑战人类的是谷歌从 2014 年开始研发的人工智能围棋程序阿尔法狗，和机器对弈的是来自韩国的围棋世界冠军李世石。七天鏖战，五大回合，风云滚滚，举世瞩目。最终，阿尔法狗以
    4∶1 大胜李世石，宣告了在人机大战中人类的彻底失败，成为了人工智能超越人类智能的一大例证。


    ![](img/figure_0100_0068.jpg)


    阿尔法狗与李世石对决


    美国政治家乔治·多尔西曾经说过：“游戏是知识之源。”下棋是人类游戏中的一大古老项目，从跳棋、国际象棋到围棋，人们痴迷于其中，乐此不疲。计算机科学之父图灵说过：“下棋需要智能。”下棋一直被视为对人类智能的挑战，自然也成了人工智能水平的一种标志。


    阿尔法狗是一个相当复杂的程序系统，用到了人工智能技术的很多方面，但最为核心的就是被称为强化学习的技术。它的发明者是美国计算机科学博士巴托和他在麻省理工学院培养出来的第一个博士生萨顿。然而造化弄人，强化学习自发明以来一直不被重视，也没有得到什么有价值的应用，直到谷歌的阿尔法狗采用这一技术大胜人类之后，它才受到追捧。


    ![](img/figure_0101_0069.jpg)


    迷宫图


    强化学习是一种什么样的方法呢？我们都玩过迷宫游戏，下面就用这个游戏来说明一下。假设在一个迷宫里，一只老鼠想要找到藏匿在其中的一块奶酪，我们用左边的图来表示。图中的灰点表示老鼠可能前往的地方，用强化学习的术语讲，这些点被称为状态。在每一个状态下，老鼠有
    4 种可能的选择，即向左、向右、向前（前进）和向后（后退）。当然，在不同的状态下，不一定所有的选择都是可行的。比如说到了死角，就只能有一种选择——后退。每一种选择都会让老鼠进入下一个状态，面临下一种选择。这种状态和选择的集合可以构成一幅行进的路线图。老鼠怎样在这些可能的状态中进行选择呢？


    老鼠面临的问题是它事先并不知道这个迷宫是什么样子，也不知道它有多少可能的选择。它只能通过不断地探索，在失败中标记路线，调整自己的行进路线，我们把这种方法叫作试错法。强化学习就是通过探索每一个状态下的所有可能性并将其标记下来，绘制出一幅包含所有可能性的路线图。每一种可能的行进路线称为一种策略，而最佳的策略就是路径最短的那种走法。这幅图在强化学习里面叫博弈树。


    问题又来了。随着可能性的增多，博弈树呈指数级增长，导致计算时间和数据存储量呈爆炸性增长。麦卡锡提出用α-β剪枝技术来控制博弈树的蔓延。这种剪枝技术的核心思想是边画树状图边计算评估路径的优劣，当评估值超出一定范围时，博弈树的蔓延就停止，这样就大大减小了博弈树的规模。


    然而，在围棋程序上，这种方法又遇到了困难。围棋的棋子比跳棋和国际象棋多得多，组合的可能性也多，画出博弈树后采用α-β剪枝技术不太经济。于是，有人想到了蒙特卡罗法。它最早是由法国数学家布丰在
    1777 年用投针实验的方法求圆周率时提出的。后来冯·诺依曼用世界闻名的赌城摩洛哥的蒙特卡罗进行命名。


    蒙特卡罗法最常用的教学例子是计算圆的面积。在一个正方形里面画一个内切圆，然后随机往这个正方形里扔沙粒。扔到足够多时，开始数有多少沙粒落在圆的里面，用这个数字除以所投沙粒的总数后再乘以正方形的面积，就得到圆的面积了。这其实是一种概率统计的方法。


    阿尔法狗团队首先利用几万局专业棋手对局的棋谱来训练系统，对棋盘上的每个可落子的位置都给出了一个估值，也就是围棋高手下到这个点的概率。得到初步的策略网络后，平衡目标和策略网络，在适当牺牲走棋质量的条件下，速度要比策略网络快，即“快速走子”。训练策略网络时，采用深度学习算法，以当前盘面状态作为输入，输出下一步棋在棋盘的其他空地上落子的概率。


    ![](img/figure_0102_0070.jpg)


    阿尔法狗开发团队


    “快速走子”是基于局部特征和线性模型进行训练的。完成这一步后，阿尔法狗已经初步模拟了人类专业棋手的棋感。接下来，阿尔法狗采用左右互搏的模式，不同版本的阿尔法狗之间下了
    3000 万局。利用强化学习算法，通过每局的胜负来进行学习，不断优化和升级策略网络，同时建立了一个可以针对当前局面估计黑棋和白棋胜率的估值网络。根据阿尔法狗团队的数据，对比围棋专业棋手的下法，策略网络在
    2 毫秒内能达到 57%的走子准确率，“快速走子”在 2 微秒内能达到 24.2%的走子准确率。


    实际对弈时，阿尔法狗通过蒙特卡罗法来管理整个对弈的搜索过程。首先，通过策略网络，阿尔法狗可以优先搜索本方最有可能落子的点（通常少于 10 个）。对于每种可能，阿尔法狗可以通过估值网络评估胜算率。同时，可以利用“快速走子”走到结局，通过结局的胜负来判断局势的优劣。综合这两种判断的评分，再进一步优化策略网络的判断，分析需要更进一步展开搜索和演算的局面。综合这几种工具，辅以超级强大的并行运算能力，阿尔法狗在推演棋局变化和寻找妙招方面的能力已经远超人类棋手。阿尔法狗系统配置有
    1920 个 CPU（中央处理器）和 280 个 GPU（图形处理器），可以同时运行 64 个搜索线程。这样的计算速度就好像有几十个九段高手在同时思考棋局，还有几十个三段棋手帮着他们把一些难以判断的局面直接预演下来，拿出结论。任何一位人类棋手要与这样强大的对手对抗，实在是难上加难。


    2016 年 3 月的这场围棋人机大战标志着跨世纪的棋弈人机大战的最终结束。回首机器下棋的历史，从 20 世纪 80 年代末跳棋程序钦诺克的“独孤求败”，到
    90 年代末 IBM 公司的国际象棋程序“深蓝”无人能敌，再到本世纪初中国象棋程序开始击败人类特级大师，直到今天谷歌的阿尔法狗完胜人类围棋大师，人工智能技术在不断的探索中前进，在棋弈对决中彻底战胜了人类智能！


    # 第 6 章 给计算机一双眼睛


    ## 6.1 让计算机看得见需要什么


    在人类对外部世界的了解和认知中，很大一部分来自视觉，那么能不能让机器也具有视觉呢？人工智能领域的一个十分重要的课题是让计算机能够看得见，我们称之为计算机视觉或机器视觉。


    最早的机器视觉探索是从字符识别开始的。早在 20 世纪五六十年代，字符识别系统的研究就已经取得了很大的成果。这个领域被称为光学字符识别，它可以让打印在纸上的固定字体的字符被机器识别出来。


    当时很成功的一个案例是斯坦福研究所开发出的一套系统，它用带有磁性的墨水打印字符，以此来自动识别银行的支票。通过专用的扫描设备，可以把打印的字符准确地采集下来并传送给计算机系统，再和一个模板字符库里的字符进行比对，从而识别出支票上的每一个字符。1959
    年，美国银行开始正式采用这套系统处理银行的支票业务，不久各个银行也纷纷采用，并且一直沿用至今。


    虽然这套系统十分成功并被应用于银行系统，但关于文字识别，它的局限性是十分明显的。为了识别出一个字符，这个字符必须用磁性墨水打印出来，并且必须具有固定的字体、格式和大小。对于任何手写体以及任何不是用磁性墨水打印出来的字符，这套系统就无法识别了。1960
    年，美国的两名科学家奥利沃塞·福瑞德和沃瑞克·纳瑟发表了一篇论文，提出了通过图像处理、图像特征提取和概率方法来识别手写字符。


    ![](img/figure_0105_0071.jpg)


    支票


    ![](img/figure_0105_0072.jpg)


    磁性字符


    他们的方法可以简单地概括成这样几个步骤：首先对写有字符的纸进行扫描，形成一个由 0 和 1 组成的二进制码的像素位图；然后对这样的图像进行清理，把明显是“杂音”的数位去除，把字符的笔画加粗强化，让字符更清晰和突出；接下来对笔画特征进行分辨和提取，检查字符笔画中有没有横竖撇捺、交叉和闭环等特征，并且给字符中每一个识别出来的特征一个概率值。这个概率值称为权重值，用于反映这一特征相对于其他特征的重要程度，从而区分出不同字符间相似的笔画。整个过程分步骤一层一层地从初始处理分辨向抽象特征提取汇总，得出这个字符不同于其他字符的特征，从而确定这是一个什么字符。


    特征权重值是通过使用大量供训练用的字符图像让系统进行学习而最终确定的。经过训练后，系统可以开始识别任何新的字符图像。根据奥利沃塞·福瑞德和沃瑞克·纳瑟的介绍，“用这种方法，系统经训练后识别字符的正确率和人工识别相比只有大约
    10%的差距”。在当时的技术条件下，这样的结果相当令人鼓舞。


    ![](img/figure_0106_0073.jpg)


    特征提取


    但字符识别只是计算机视觉中最简单的一种，因为图像中的字符只是有限而简单的二维图形，而真正的计算机视觉应能处理来自三维世界的二维平面图像，就像我们用照相机拍下的照片那样。但通过二维图像展现三维世界时，我们会失去一些信息，比如景深。同样的物体从不同角度拍下来，看上去也会不一样。用一幅二维图像充分地还原真实的场景几乎是一件不太可能的事情。


    人类和动物是怎样看世界的呢？他们都能很好地通过落在视网膜上的二维图像准确地认识周边的三维世界。我们不难发现，人和很多动物都有两只眼睛，具有立体视觉。也就是说，用两只眼睛看世界时，观察到的物体由于两只眼睛的观察角度不同而在位置和形状上有所不同，从而可以把握物体的立体空间。计算机也可以从两个不同的角度对同一环境的图像进行采集、分析和计算，从而获得环境的深度信息。那么，是不是只有这样，机器才能真正获得外部世界的准确信息呢？


    其实，计算机视觉采用的大多数方法并不是立体视觉，而是利用光线、物体线条之间的角度关系和背景信息等从一幅二维图像上获得对三维世界的认识。有的科学家试图在对生物视觉原理的研究和发现中寻找计算机视觉问题的解决方法。


    美国麻省理工学院的 4 个生物学家在研究青蛙如何观察世界时，发现青蛙其实并不是通过完整的视觉还原来感知其眼前的事物的。他们发现青蛙的眼睛由一些“探测器”构成。这些“探测器”都具有自己的功能，有的用来探视小的运动物体（如飞虫），有的对光线的突然变化十分敏感。通过对不同环境因素的汇总，青蛙可以准确地获得关于食物或危险的信息。他们把自己的研究发现写成了一篇论文《青蛙的眼睛告诉了青蛙大脑些什么？》，立刻引起了人工智能学者和专家们的注意。


    美国神经生理学家戴维·休伯尔和托斯坦·维厄瑟尔从 1958 年开始研究大脑神经的视觉功能。他们发现哺乳动物的一些神经元会选择性地对图像和图像中的一些特定形状产生反应。1959
    年，他们在猫的大脑的视觉神经部分植入了微电极。他们发现，当猫看到不同角度的短线条时，不同的神经元会迅速放电。他们甚至可以绘出一幅猫脑中的不同神经元对不同角度的线条发生反应的图像。进一步的研究表明，另外一些神经元会对更复杂的形状产生反应。同样的现象在猴子的大脑里也被发现。这项研究不仅让他们获得了
    1981 年的诺贝尔生理学或医学奖，而且也让研究计算机视觉的人工智能学者脑洞大开，让他们认识到在计算机视觉处理上从一幅图像中提取线条具有十分重要的意义。


    ![](img/figure_0107_0074.jpg)


    一个魔方的线框图


    第一个写出能从一幅图像里提取物体线条的程序的人是麻省理工学院的博士研究生劳伦斯·罗伯茨。在 1963 年读博士时，他发现可以根据一张照片上黑白颜色的层次分布情况来确定照片上物体的不同面之间的边界线条，从而得到一幅关于物体形状的线框图。虽然他的方法只能处理黑白照片，但在当时是一个创举。当时图像处理方面的研究大都是在处理像字符识别这样的二维对象，那些方法无法处理表现三维物体的图片。他的发明把图像处理推向了一个全新的方向，让后来的图形识别研究在其基础上阔步前进。他也成为了美国国防部高级研究计划局的首席科学家和信息技术部主任，在日后发明互联网时发挥了重要的作用。


    ## 6.2 特征与分类——图像识别的基本方法


    早在 20 世纪 60 年代，位于硅谷的全景研究公司就已经开发出了人脸识别程序。他们通过对一个人脸部的 40 张不同照片上五官的特点（比如两眼瞳孔之间的距离、眼角的位置、嘴的大小等）进行提取，得到了一个有
    20 个关于距离和大小等特征的数据列表。这些列表形成了一个人脸数据库，可以用这个数据库里的特征数据来识别人脸。如果一个人的脸部特征数据与数据库里存储的信息非常接近或相同，则认为他的脸被识别出来了。


    这种早期的人脸识别技术还是比较简单和原始的，对照片上人脸不同部位的大小、位置、角度和光线等的要求比较苛刻，否则识别效果就会很差。但这些方法中已经包含了图像识别的基本技术，那就是特征提取和分类。


    ![](img/figure_0108_0075.jpg)


    人脸特征识别


