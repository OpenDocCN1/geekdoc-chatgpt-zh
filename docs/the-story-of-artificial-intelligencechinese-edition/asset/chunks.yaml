- raw: '1903年12月28日，冯·诺依曼生于匈牙利布达佩斯的一个犹太人家庭。他的父亲是布达佩斯的一名银行家，母亲是一位善良的家庭妇女，贤惠温顺，受过良好的教育。


    冯·诺依曼从小就显示出了数学和记忆方面的天分。在孩提时代，冯·诺依曼就有过目不忘的天赋。6岁时，他就能用希腊语同父亲互相开玩笑，还能通过心算做8位数除法。8岁时，他掌握了微积分。10岁时，他花费了数月时间读完了一部48卷的世界史，并且可以将当前发生的事件和历史上的某个事件进行对比，讨论两者的军事理论和政治策略。12岁时，他就读懂领会了数学家波莱尔的大作《函数论》。


    在布达佩斯大学，他注册为数学系的学生，但他并不听课，只是每年按时参加考试，考试成绩还都是A。与此同时，他却跑到柏林大学去听课。1923年，他又进入瑞士苏黎世联邦工业大学学习化学，并在那里获得了化学工程学士学位。通过在每学期期末回到布达佩斯大学进行课程考试，他获得了布达佩斯大学数学博士学位。


    1930年，他首次赴美，成为普林斯顿大学的客座讲师。善于汇集人才的美国政府不久就聘他为客座教授。1933年，普林斯顿高级研究院正式聘请他为教授。当时该研究院聘有6名教授，其中包括爱因斯坦，而年仅30岁的冯·诺依曼是他们当中最年轻的一位。


    ![](images/figure_0039_0023.jpg)


    授奖


    1955年夏天，X射线检查出他患有癌症，这多少可能和他参加原子弹研制工作有关。随着病情的发展，他只能在轮椅上继续思考、演说及参加会议。在病中，他接受了耶鲁大学西里曼讲座的邀请，但在讲座期间，他的身体太虚弱了，没法到现场。到他去世时，讲稿也没有完成。1957年2月8日，他在医院里逝世，享年53岁。


    冯·诺依曼才华超群。在他去世的前几天，肿瘤已经占据了他的大脑，但他的记忆力还是不可思议地好。一天，他的同事、数学家乌拉姆坐在他的病榻前，用希腊语朗诵一本他特别喜欢的修昔底德的书，书中讲述亚丁人进攻梅洛思的故事和佩里莱的演说。他一边听一边不断纠正乌拉姆的错误和发音。冯·诺依曼死后获得了极高的评价，过人才华和众多成就让他成为了人类历史上迄今为止屈指可数的几位伟大的科学家之一。


    ## [2.3 冯·诺依曼和人工智能](../contents/content.xhtml#toc17)


    冯·诺依曼是一位大师级人物，他在数学、理论物理和逻辑等众多领域做出了重大的贡献和影响，历史上很少有人能企及。他和众多大师级人物的往来与交流影响和改变了许多人，比如图灵、纳什和麦卡锡等。他对人工智能的贡献也远不止发明了世界上第一台电子计算机，今天我们热烈讨论的阿尔法狗、神经网络等都与冯·诺依曼有着千丝万缕的联系。


    1948年9月，一个关于人类行为中脑机制的研讨会在美国加州理工学院召开。长期以来，科学家们一直对人脑的结构和思维机制抱有浓厚的兴趣，生物学家、解剖学家、心理学家和神经学家都努力在自己的研究领域中探索人类行为中的脑机制，试图揭开人类思维的奥秘。加州理工学院召开的这场研讨会就是科学家们关于这一主题的一次交流活动。


    加州理工学院坐落在素有阳光之州称呼的加利福尼亚的洛杉矶市。9月的气候和西海岸的风光确实让这次会议十分吸引人，但更有吸引力的是会议上来的一位大人物，他就是冯·诺依曼。一场关于认知科学的研讨会似乎与计算机和数学没有太大关系，那么这位计算机界的大人物为什么来参会呢？


    ![](images/figure_0041_0024.jpg)


    冯·诺依曼在讲演


    原来冯·诺依曼发明了第一台电子计算机以后一直有一个想法，那就是能不能发明一种具有足够的复杂性、在理论上能自我复制的机器——自动机？无疑他主创的电子计算机成为他思考的原型和出发点，但一种能自我复制的机器应该具有类似于人脑的机制，所以这场关于人类行为中脑机制的研讨会就引起了他的兴趣。他希望在计算机结构的基础上，开展可以接近人类大脑机制的人工自动机理论研究。


    当时正在那里就读本科的约翰·麦卡锡恰巧也旁听了会议。这让他心潮澎湃，脑洞大开。后来他回忆说：“正是这次会议激发了我对人工智能的浓厚兴趣和研究欲望。”是冯·诺依曼影响了这位后来被称为人工智能之父的年轻人。


    冯·诺依曼在这次会议上发表了题为《自动机的通用和逻辑理论》的演讲，开启了细胞自动机的理论研究。此后，他的助手伯克斯在余生中都没有离开过细胞自动机研究，还培养了世界上第一位计算机科学博士霍兰德。冯·诺依曼在细胞自动机和DNA方面的研究工作自然也间接地影响到了霍兰德。在他的博士论文中，霍兰德首次提出了一种新的人工智能算法——遗传算法。霍兰德的大弟子巴托尔和巴托尔的大弟子萨顿后来又发明了强化学习理论。强化学习理论被用在谷歌的阿尔法狗上，击败了几乎所有的围棋大师。该理论也被用在卡内基·梅隆大学的Libratu机器牌手上，赢得了得州扑克大赛。所以，毫不夸张地说，受生物学启发的人工智能研究的根在冯·诺依曼。


    什么是细胞自动机呢？简单地说，细胞自动机就是为模拟包括自组织结构在内的复杂现象提供的一种强有力的方法。自然界里许多复杂的结构和过程，归根结底都是由大量的基本组成单元通过简单的相互作用所形成的。细胞自动机给出了这些基本组成单元的简单相互作用的关系。


    ![](images/figure_0042_0025.jpg)


    细胞自动机


    为了理解细胞自动机，让我们看一个简单的例子。找一张画有许多格子的图纸，用铅笔将其中的一些格子涂黑后就可以得到一个图案。第一排也许有一个或几个格子被涂黑了，而一个简单的细胞自动机则通过确定某种简单的规则，从第二排开始往下画出新图案来。


    具体到每一行中的每一个格子上，要观察其上一行中对应的格子及该格子两边的情况，然后根据这3个格子是否被涂黑以及黑白格子如何相邻的既定规则（比如，当这3个格子从左至右分别为黑、黑、白时，其正下面的格子为白，否则为黑），确定当前的格子是被涂黑还是留白。如此反复进行下去，一条或一组这样的简单规则及简单的初始条件就构成了一个细胞自动机。


    细胞自动机理论主要研究由小的计算机或部件按邻域连接方式连接成较大的并行工作的计算机或部件的理论模型。


    冯·诺依曼的工作还影响了计算机科学家沃尔夫勒姆。沃尔夫勒姆一直在研究细胞自动机，他的研究的副产品就是著名的数学软件Mathematica和搜索引擎Alpha。沃尔夫勒姆在其《新科学》一书中12次提到冯·诺依曼，而排名第一的是图灵，他被提及19次。


    冯·诺依曼为人热情，殷勤好客。他有一所方便聚会的大房子，每当闲暇之余，他就呼朋唤友前来聚会。每次聚会，朋友们总是想要和这位天才“斗智斗勇”，其中发生了许多有趣的故事。有一次，冯·诺依曼与几位数学家聚餐，被他们一起用伏特加一通猛灌。终于，冯·诺依曼不胜酒力，摇摇晃晃地去厕所呕吐了。他从厕所回来后继续和朋友们讨论数学问题，思路还是异常清晰。朋友们面面相觑，感觉自己的智商完全被这位天才所碾压。


    ![](images/figure_0043_0026.jpg)


    冯·诺依曼在聚会上


    还有一次，他在宴会上和一位据称最了解拜占庭历史的历史专家发生了争执，争执源自冯·诺依曼对这位专家所描述的拜占庭历史的质疑。两人争得面红耳赤，各不相让。这时有人拿来了史学书籍，发现冯·诺依曼竟然一字不差地复述了书上的内容，这位历史专家只好闭嘴。不过，冯·诺依曼也表示，以后邀请这位拜占庭历史专家来聚会时，绝不再与其争论拜占庭历史。


    冯·诺依曼逝世后，他的大作《计算机与人脑》才正式出版，书中预示了人工智能的发展路线。冯·诺依曼在不同场合都高度评价了图灵机和皮茨的神经网络。《计算机与人脑》的第一部分是“计算机”，第二部分是“大脑”，他把二者看成解决同一问题的两种方法。长期以来，人工智能研究领域就一直有符号学派和神经学派之分。符号学派就是计算机的代表，神经学派就是大脑的代表，他们各抒己见，互不相让。冯·诺依曼的《计算机与人脑》其实告诉大家，二者殊途同归，人工智能的两派应该互相倾听，互相学习，取长补短。


    冯·诺依曼的故事是永远也讲不完的。


    ## [2.4 什么是人工智能](../contents/content.xhtml#toc18)


    人工智能就在我们身边，但并非所有人都能留意到它的存在。在有些人的眼里，人工智能或多或少类似于科幻大片里的机器人，有着超人的智力和摆平一切的能力。在另一些人看来，计算机能做许多人类做不到的事，比如1秒完成数百亿次运算，人类再聪明也无法在计算速度上与计算机相比，这就是人工智能。那么，到底谁的看法正确呢？到底什么是人工智能呢？


    尽管我们谈到的智能搜索引擎、智能助理、机器翻译、机器视觉、自动驾驶、机器人等技术都属于人工智能的范畴，但人工智能从来没有一个明确、公认的科学定义。历史上，人工智能的定义历经多次转变。一些粗浅的、未能揭示内在规律的定义很早就被研究者所抛弃，但被广泛接受的定义仍然有很多个，它们分别从不同的角度说明什么是人工智能。


    “人工智能”一词最早是由麦卡锡提出的。他在为他发起的达特茅斯夏季科研项目筹集经费的报告中，第一次使用了“人工智能”一词。由此，那次科研聚会也被称为人工智能元年，人工智能作为一门正式学科被确立，麦卡锡自然成为了人工智能之父。


    麦卡锡在报告中是这样描述人工智能的：“这个研究项目是对让机器可以模仿人类智能的各个方面的原理进行研究，从而使机器可以解决那些只有人类智能才能解决的问题。”也就是说，人工智能是让机器可以完成人们不认为机器能胜任的事。这个定义非常笼统，也非常有趣。一个计算机程序是不是人工智能，完全由这个程序能不能模仿人类思维来决定。这一定义反映了大多数人对人工智能的认识。


    ![](images/figure_0044_0027.jpg)


    什么是人工智能


    但不是所有人都认可这个定义。谷歌科学家李开复认为，从根本上讲，这是一种类似于仿生学的直观思路。既然叫人工智能，那么用程序来模拟人类的智慧就是最直截了当的做法。但历史经验证明，仿生学的思路在科技发展中不一定可行。


    人类究竟是怎样思考的？这本身就是一个复杂的技术和哲学问题。要了解人类自身的思考方式，哲学家们试图通过反省与思辨，找到人类思维的逻辑法则，而科学家们则通过心理学和生物学实验，了解人类在思考时的身心变化规律。这两条道路都在人工智能的发展历史上起到过极为重要的作用。所以，人们关于人工智能的定义一直是众说纷纭，各抒己见。


    在20世纪60年代中期，斯坦福大学的专家系统Dendral取得了令人瞩目的成功，衍生出一大批根据物质光谱推断物质结构的智能程序。Dendral之所以能在限定的领域解决问题，一是依赖化学家们积累的有关何种分子结构可能产生何种光谱的经验知识，二是依赖符合人类逻辑推理规律的大量判定规则。从机器翻译到语音识别，从军事决策到资源勘探，Dendral的成功事实上带动了专家系统在人工智能各相关领域的广泛应用。一时间，专家系统似乎就是人工智能的代名词，其热度不亚于今天的深度学习。


    但是，人们很快就发现了基于人类知识库和逻辑学规则构建人工智能系统的局限性。一个解决特定的、狭小领域内问题的专家系统很难被扩展到稍微宽广一些的知识领域中，更别提扩展到基于世界知识的日常生活里了。1957年苏联发射世界上第一颗人造卫星后，美国政府和军方急于使用机器翻译系统了解苏联的科技动态，但用语法规则和词汇对照表实现的从俄语到英语的机器翻译笑话百出，例如把“心有余而力不足”翻译为“伏特加不错而肉都烂掉了”，完全无法处理自然语言中的歧义和丰富多彩的表达方式。


    生物学家和心理学家很早就开始研究人类大脑的工作方式，其中最重要的就是大脑神经元处理和传播信息（在物理上表现为一种刺激）的过程。早在通用电子计算机出现之前，科学家们就已经提出了有关神经元处理信息的假想模型，即人类大脑中数量庞大的神经元共同组成一个各部分相互协作的网络结构，信息通过若干层神经元的增强、衰减或屏蔽后，作为系统的输出信号，控制人体对环境刺激的反应（产生的一个动作）。


    20世纪50年代，早期人工智能研究者将神经网络用于模式识别，用计算机算法模拟神经元对输入信号的处理过程，并根据信号经过多层神经元处理后得到的输出结果对算法的参数进行修正。但限于当时的技术条件，这种基于大规模计算和大量数据的方法难成气候。直到20世纪90年代，随着计算机运算能力的飞速发展，神经网络在人工智能领域才获重生。但直到2010年前后，支持深度神经网络的计算机集群才开始得到广泛应用，供深度学习系统训练使用的大规模数据集也越来越多。神经网络这一仿生学概念在人工智能的新一轮复兴中，真正扮演了至关重要的核心角色。


    然而，神经网络到底在多大程度上精确地反映了人类大脑的工作方式，这仍然存在争议。在仿生学的道路上，最本质的问题是，人类至今对大脑如何实现学习、记忆、归纳、推理等思维过程的机理还不完全了解，所以真实模拟人脑的运作其实还处于盲人摸象阶段。既然连人类智能都还没有真正搞清楚，又怎么能科学地给人工智能下一个明确的定义呢？


    今天，“无学习，不人工智能”几乎成了人工智能研究的核心指导思想。许多研究者更愿意将自己称为机器学习专家，而非泛泛的人工智能专家。谷歌的阿尔法狗因为学习了大量专业棋手的棋谱，然后又从自我对弈中持续学习和提高，所以才有了战胜人类世界冠军的本钱。微软的小冰因为大量学习了互联网上的流行语料，才能用既时尚又活泼的聊天方式与用户交流。媒体更是大肆宣传说，人工智能应用在深度学习的基础上，是计算机从大量数据中通过自我学习掌握经验模型的结果。于是，有人定义人工智能是一种会学习的机器。


    但是人工智能在学习方面远不如人类，特别是在抽象或归纳能力上十分逊色。一个小孩子可以轻轻松松地通过认识一辆车识别出大多数车来，但人工智能系统为了识别一辆车要经过上万次的学习才行。所以，这种定义人工智能的说法也有问题。


    其实，针对人工智能，不同的定义将人们导向不同的研究或认知方向，不同的理解分别适用于不同的人群和语境。如果非要调和所有看上去合理的定义，我们得到的也许就只是一个全面但过于笼统、模糊的概念。


    维基百科的“人工智能”词条采用的是斯图亚特·罗素（又译作斯图尔特·罗素）与彼得·诺维格在《人工智能：一种现代的方法》一书中所下的定义。他们认为，人工智能是关于“智能主体的研究与设计”的学问，而“智能主体是指一个可以观察周遭环境并做出行动以达成目标的系统”。


    基本上，这个定义涵盖了目前各种不同的人工智能定义，既强调人工智能可以根据环境感知做出主动反应，又强调人工智能所做出的反应必须达成目标，同时不再强调人工智能对人类思维方式或人类总结的思维法则（逻辑学规律）的模仿。


    关于到底什么是人工智能的定义过程，说明了人工智能其实还是一门十分年轻和有待进一步发展探索的学问。它所涉及的领域之广，方法之多，应用之众，让它成为了一门充满神奇魅力的科学，也引无数英雄各领风骚。


    ## [2.5 图灵奖——计算机界的诺贝尔奖](../contents/content.xhtml#toc19)


    我们已经知道了图灵的故事，虽然他的发明创造并没有让他在生前名声大噪，但随着时间的推移，他的理论越来越被人们承认和证明是人类文明最重要的成果之一。计算机科学起源于1936年他发表的那篇论文《论可计算的数》是怎么说都不过分的公认事实。连世界上第一台电子计算机的发明人冯·诺依曼也一再说，他的发明来自图灵理论。


    图灵提出的图灵机的伟大和深刻是到目前为止没有人所能超越的，至今全部的计算机理论最后都可以归结到图灵机上。而图灵机本身看上去又是那么简单明了，散发着人类智慧之光。就是这样一个简单得不能再简单的装置，被图灵证明和邱奇的λ演算是等价的，而λ演算又被证明和哥德尔的递归函数等价。哥德尔曾经对自己的递归函数是不是最广义的计算装置不是很有把握，图灵机让他完全不再怀疑自己。


    邱奇是一位美国数学家，1936年发表可计算函数的第一个精确定义，对算法理论的系统发展做出了巨大贡献。邱奇在普林斯顿大学执教并工作了40年，曾任数学与哲学教授。后来，他到了加州大学洛杉矶分校。他的λ演算是一套用于研究函数定义、函数应用和递归的形式系统，这种演算可以用来清晰地定义什么是一个可计算函数。


    λ演算可以被称为最小的通用程序设计语言，它包括一条变换规则(变量替换)和一种函数定义方式。λ演算的通用之处在于，任何一个可计算函数都能用这种形式来表达和求值。因此，它是等价于图灵机的。尽管如此，λ演算强调的是变换规则的运用，而非实现它们的具体机器，可以认为这是一种更接近软件而非硬件的方式。它是一个数理逻辑形式系统，使用变量代入和置换来研究基于函数定义和应用的计算。而图灵则用了一个简单的物理模型——图灵机实现了它，伟大之处自不待言。


    关于这个演算的名称λ，其实来自一个排版错误。邱奇本来采用了罗素的标记法，采用X上面戴个小帽子的符号![](images/figure_0048_0028.jpg)，但排版工人找不到这样的字模，就用λ代替了。邱奇的整个演算系统都是基于这个小帽子的，于是λ就成了邱奇无名函数的代名词，邱奇演算也被叫作λ演算了。


    如果图灵对人类的贡献仅限于计算机科学，那么他也许就没有今天这么崇高的声誉和地位。1950年他在英国哲学杂志《心》上发表的文章《计算机与智能》，是他的又一个具有划时代意义的成就，成为历史上最早的关于人工智能的系统化的科学论述，是人工智能研究的指导性文献。文章中提出的“模仿游戏”，也就是“图灵测试”，一直是人工智能的一种判断标准和定义。


    图灵很早就探讨了大脑皮层的发育过程，提出了人类智能发育从非组织化向组织化转变的看法，并指出人身上的任何部分都可以用机器来模仿。他还提到了基因、进化和选择。冯·诺依曼在他的启发下，提出人类神经系统的本质是数字的，尽管关于神经系统的化学和生物过程的描述可能是模拟的。现代物理学的一个假设就是整个宇宙都是离散的，即数字的。如果一切都是数字的，那么图灵机就是最简单而有力的模型。研究人工智能绕不开图灵机和以其为基础的整个计算机理论。


    现在可以看出图灵和他的理论是多么伟大和不可思议。所以，1966年美国计算机学会设立了图灵奖，以此来表彰科学家们在这个领域里做出的杰出贡献。由于图灵奖对获奖条件的要求极高，评奖程序又极其严格，一般每年只奖励一名计算机科学家，只有少数年份有两名合作者或在同一方向上做出贡献的科学家共享此奖。它是计算机界最负盛名、最崇高的一个奖项，有“计算机界的诺贝尔奖”之称。


    图灵奖一般在下一年的4月初颁发，从1966年至今共有70名获奖者。按国籍分，美国学者最多，欧洲学者次之，华人学者目前仅有2000年图灵奖得主姚期智。据相关资料，截至2018年，美国斯坦福大学的图灵奖获得者数量位列世界第一，麻省理工学院和加州大学伯克利分校并列世界第二，哈佛大学和普林斯顿大学分列世界第四和第五。'
  fmt: '

    # 冯·诺依曼与人工智能


    ## 2.2 冯·诺依曼生平


    1903年12月28日，冯·诺依曼生于匈牙利布达佩斯的一个犹太人家庭。他的父亲是布达佩斯的一名银行家，母亲是一位善良的家庭妇女，贤惠温顺，受过良好的教育。


    冯·诺依曼从小就显示出了数学和记忆方面的天分。在孩提时代，冯·诺依曼就有过目不忘的天赋。6岁时，他就能用希腊语同父亲互相开玩笑，还能通过心算做8位数除法。8岁时，他掌握了微积分。10岁时，他花费了数月时间读完了一部48卷的世界史，并且可以将当前发生的事件和历史上的某个事件进行对比，讨论两者的军事理论和政治策略。12岁时，他就读懂领会了数学家波莱尔的大作《函数论》。


    在布达佩斯大学，他注册为数学系的学生，但他并不听课，只是每年按时参加考试，考试成绩还都是A。与此同时，他却跑到柏林大学去听课。1923年，他又进入瑞士苏黎世联邦工业大学学习化学，并在那里获得了化学工程学士学位。通过在每学期期末回到布达佩斯大学进行课程考试，他获得了布达佩斯大学数学博士学位。


    1930年，他首次赴美，成为普林斯顿大学的客座讲师。善于汇集人才的美国政府不久就聘他为客座教授。1933年，普林斯顿高级研究院正式聘请他为教授。当时该研究院聘有6名教授，其中包括爱因斯坦，而年仅30岁的冯·诺依曼是他们当中最年轻的一位。


    ![](images/figure_0039_0023.jpg)


    授奖


    1955年夏天，X射线检查出他患有癌症，这多少可能和他参加原子弹研制工作有关。随着病情的发展，他只能在轮椅上继续思考、演说及参加会议。在病中，他接受了耶鲁大学西里曼讲座的邀请，但在讲座期间，他的身体太虚弱了，没法到现场。到他去世时，讲稿也没有完成。1957年2月8日，他在医院里逝世，享年53岁。


    冯·诺依曼才华超群。在他去世的前几天，肿瘤已经占据了他的大脑，但他的记忆力还是不可思议地好。一天，他的同事、数学家乌拉姆坐在他的病榻前，用希腊语朗诵一本他特别喜欢的修昔底德的书，书中讲述亚丁人进攻梅洛思的故事和佩里莱的演说。他一边听一边不断纠正乌拉姆的错误和发音。冯·诺依曼死后获得了极高的评价，过人才华和众多成就让他成为了人类历史上迄今为止屈指可数的几位伟大的科学家之一。


    ## 2.3 冯·诺依曼和人工智能


    冯·诺依曼是一位大师级人物，他在数学、理论物理和逻辑等众多领域做出了重大的贡献和影响，历史上很少有人能企及。他和众多大师级人物的往来与交流影响和改变了许多人，比如图灵、纳什和麦卡锡等。他对人工智能的贡献也远不止发明了世界上第一台电子计算机，今天我们热烈讨论的阿尔法狗、神经网络等都与冯·诺依曼有着千丝万缕的联系。


    1948年9月，一个关于人类行为中脑机制的研讨会在美国加州理工学院召开。长期以来，科学家们一直对人脑的结构和思维机制抱有浓厚的兴趣，生物学家、解剖学家、心理学家和神经学家都努力在自己的研究领域中探索人类行为中的脑机制，试图揭开人类思维的奥秘。加州理工学院召开的这场研讨会就是科学家们关于这一主题的一次交流活动。


    加州理工学院坐落在素有阳光之州称呼的加利福尼亚的洛杉矶市。9月的气候和西海岸的风光确实让这次会议十分吸引人，但更有吸引力的是会议上来的一位大人物，他就是冯·诺依曼。一场关于认知科学的研讨会似乎与计算机和数学没有太大关系，那么这位计算机界的大人物为什么来参会呢？


    ![](images/figure_0041_0024.jpg)


    冯·诺依曼在讲演


    原来冯·诺依曼发明了第一台电子计算机以后一直有一个想法，那就是能不能发明一种具有足够的复杂性、在理论上能自我复制的机器——自动机？无疑他主创的电子计算机成为他思考的原型和出发点，但一种能自我复制的机器应该具有类似于人脑的机制，所以这场关于人类行为中脑机制的研讨会就引起了他的兴趣。他希望在计算机结构的基础上，开展可以接近人类大脑机制的人工自动机理论研究。


    当时正在那里就读本科的约翰·麦卡锡恰巧也旁听了会议。这让他心潮澎湃，脑洞大开。后来他回忆说：“正是这次会议激发了我对人工智能的浓厚兴趣和研究欲望。”是冯·诺依曼影响了这位后来被称为人工智能之父的年轻人。


    冯·诺依曼在这次会议上发表了题为《自动机的通用和逻辑理论》的演讲，开启了细胞自动机的理论研究。此后，他的助手伯克斯在余生中都没有离开过细胞自动机研究，还培养了世界上第一位计算机科学博士霍兰德。冯·诺依曼在细胞自动机和DNA方面的研究工作自然也间接地影响到了霍兰德。在他的博士论文中，霍兰德首次提出了一种新的人工智能算法——遗传算法。霍兰德的大弟子巴托尔和巴托尔的大弟子萨顿后来又发明了强化学习理论。强化学习理论被用在谷歌的阿尔法狗上，击败了几乎所有的围棋大师。该理论也被用在卡内基·梅隆大学的Libratu机器牌手上，赢得了得州扑克大赛。所以，毫不夸张地说，受生物学启发的人工智能研究的根在冯·诺依曼。


    什么是细胞自动机呢？简单地说，细胞自动机就是为模拟包括自组织结构在内的复杂现象提供的一种强有力的方法。自然界里许多复杂的结构和过程，归根结底都是由大量的基本组成单元通过简单的相互作用所形成的。细胞自动机给出了这些基本组成单元的简单相互作用的关系。


    ![](images/figure_0042_0025.jpg)


    细胞自动机


    为了理解细胞自动机，让我们看一个简单的例子。找一张画有许多格子的图纸，用铅笔将其中的一些格子涂黑后就可以得到一个图案。第一排也许有一个或几个格子被涂黑了，而一个简单的细胞自动机则通过确定某种简单的规则，从第二排开始往下画出新图案来。


    具体到每一行中的每一个格子上，要观察其上一行中对应的格子及该格子两边的情况，然后根据这3个格子是否被涂黑以及黑白格子如何相邻的既定规则（比如，当这3个格子从左至右分别为黑、黑、白时，其正下面的格子为白，否则为黑），确定当前的格子是被涂黑还是留白。如此反复进行下去，一条或一组这样的简单规则及简单的初始条件就构成了一个细胞自动机。


    细胞自动机理论主要研究由小的计算机或部件按邻域连接方式连接成较大的并行工作的计算机或部件的理论模型。


    冯·诺依曼的工作还影响了计算机科学家沃尔夫勒姆。沃尔夫勒姆一直在研究细胞自动机，他的研究的副产品就是著名的数学软件Mathematica和搜索引擎Alpha。沃尔夫勒姆在其《新科学》一书中12次提到冯·诺依曼，而排名第一的是图灵，他被提及19次。


    冯·诺依曼为人热情，殷勤好客。他有一所方便聚会的大房子，每当闲暇之余，他就呼朋唤友前来聚会。每次聚会，朋友们总是想要和这位天才“斗智斗勇”，其中发生了许多有趣的故事。有一次，冯·诺依曼与几位数学家聚餐，被他们一起用伏特加一通猛灌。终于，冯·诺依曼不胜酒力，摇摇晃晃地去厕所呕吐了。他从厕所回来后继续和朋友们讨论数学问题，思路还是异常清晰。朋友们面面相觑，感觉自己的智商完全被这位天才所碾压。


    ![](images/figure_0043_0026.jpg)


    冯·诺依曼在聚会上


    还有一次，他在宴会上和一位据称最了解拜占庭历史的历史专家发生了争执，争执源自冯·诺依曼对这位专家所描述的拜占庭历史的质疑。两人争得面红耳赤，各不相让。这时有人拿来了史学书籍，发现冯·诺依曼竟然一字不差地复述了书上的内容，这位历史专家只好闭嘴。不过，冯·诺依曼也表示，以后邀请这位拜占庭历史专家来聚会时，绝不再与其争论拜占庭历史。


    冯·诺依曼逝世后，他的大作《计算机与人脑》才正式出版，书中预示了人工智能的发展路线。冯·诺依曼在不同场合都高度评价了图灵机和皮茨的神经网络。《计算机与人脑》的第一部分是“计算机”，第二部分是“大脑”，他把二者看成解决同一问题的两种方法。长期以来，人工智能研究领域就一直有符号学派和神经学派之分。符号学派就是计算机的代表，神经学派就是大脑的代表，他们各抒己见，互不相让。冯·诺依曼的《计算机与人脑》其实告诉大家，二者殊途同归，人工智能的两派应该互相倾听，互相学习，取长补短。


    冯·诺依曼的故事是永远也讲不完的。


    ## 2.4 什么是人工智能


    人工智能就在我们身边，但并非所有人都能留意到它的存在。在有些人的眼里，人工智能或多或少类似于科幻大片里的机器人，有着超人的智力和摆平一切的能力。在另一些人看来，计算机能做许多人类做不到的事，比如1秒完成数百亿次运算，人类再聪明也无法在计算速度上与计算机相比，这就是人工智能。那么，到底谁的看法正确呢？到底什么是人工智能呢？


    尽管我们谈到的智能搜索引擎、智能助理、机器翻译、机器视觉、自动驾驶、机器人等技术都属于人工智能的范畴，但人工智能从来没有一个明确、公认的科学定义。历史上，人工智能的定义历经多次转变。一些粗浅的、未能揭示内在规律的定义很早就被研究者所抛弃，但被广泛接受的定义仍然有很多个，它们分别从不同的角度说明什么是人工智能。


    “人工智能”一词最早是由麦卡锡提出的。他在为他发起的达特茅斯夏季科研项目筹集经费的报告中，第一次使用了“人工智能”一词。由此，那次科研聚会也被称为人工智能元年，人工智能作为一门正式学科被确立，麦卡锡自然成为了人工智能之父。


    麦卡锡在报告中是这样描述人工智能的：“这个研究项目是对让机器可以模仿人类智能的各个方面的原理进行研究，从而使机器可以解决那些只有人类智能才能解决的问题。”也就是说，人工智能是让机器可以完成人们不认为机器能胜任的事。这个定义非常笼统，也非常有趣。一个计算机程序是不是人工智能，完全由这个程序能不能模仿人类思维来决定。这一定义反映了大多数人对人工智能的认识。


    ![](images/figure_0044_0027.jpg)


    什么是人工智能


    但不是所有人都认可这个定义。谷歌科学家李开复认为，从根本上讲，这是一种类似于仿生学的直观思路。既然叫人工智能，那么用程序来模拟人类的智慧就是最直截了当的做法。但历史经验证明，仿生学的思路在科技发展中不一定可行。


    人类究竟是怎样思考的？这本身就是一个复杂的技术和哲学问题。要了解人类自身的思考方式，哲学家们试图通过反省与思辨，找到人类思维的逻辑法则，而科学家们则通过心理学和生物学实验，了解人类在思考时的身心变化规律。这两条道路都在人工智能的发展历史上起到过极为重要的作用。所以，人们关于人工智能的定义一直是众说纷纭，各抒己见。


    在20世纪60年代中期，斯坦福大学的专家系统Dendral取得了令人瞩目的成功，衍生出一大批根据物质光谱推断物质结构的智能程序。Dendral之所以能在限定的领域解决问题，一是依赖化学家们积累的有关何种分子结构可能产生何种光谱的经验知识，二是依赖符合人类逻辑推理规律的大量判定规则。从机器翻译到语音识别，从军事决策到资源勘探，Dendral的成功事实上带动了专家系统在人工智能各相关领域的广泛应用。一时间，专家系统似乎就是人工智能的代名词，其热度不亚于今天的深度学习。


    但是，人们很快就发现了基于人类知识库和逻辑学规则构建人工智能系统的局限性。一个解决特定的、狭小领域内问题的专家系统很难被扩展到稍微宽广一些的知识领域中，更别提扩展到基于世界知识的日常生活里了。1957年苏联发射世界上第一颗人造卫星后，美国政府和军方急于使用机器翻译系统了解苏联的科技动态，但用语法规则和词汇对照表实现的从俄语到英语的机器翻译笑话百出，例如把“心有余而力不足”翻译为“伏特加不错而肉都烂掉了”，完全无法处理自然语言中的歧义和丰富多彩的表达方式。


    生物学家和心理学家很早就开始研究人类大脑的工作方式，其中最重要的就是大脑神经元处理和传播信息（在物理上表现为一种刺激）的过程。早在通用电子计算机出现之前，科学家们就已经提出了有关神经元处理信息的假想模型，即人类大脑中数量庞大的神经元共同组成一个各部分相互协作的网络结构，信息通过若干层神经元的增强、衰减或屏蔽后，作为系统的输出信号，控制人体对环境刺激的反应（产生的一个动作）。


    20世纪50年代，早期人工智能研究者将神经网络用于模式识别，用计算机算法模拟神经元对输入信号的处理过程，并根据信号经过多层神经元处理后得到的输出结果对算法的参数进行修正。但限于当时的技术条件，这种基于大规模计算和大量数据的方法难成气候。直到20世纪90年代，随着计算机运算能力的飞速发展，神经网络在人工智能领域才获重生。但直到2010年前后，支持深度神经网络的计算机集群才开始得到广泛应用，供深度学习系统训练使用的大规模数据集也越来越多。神经网络这一仿生学概念在人工智能的新一轮复兴中，真正扮演了至关重要的核心角色。


    然而，神经网络到底在多大程度上精确地反映了人类大脑的工作方式，这仍然存在争议。在仿生学的道路上，最本质的问题是，人类至今对大脑如何实现学习、记忆、归纳、推理等思维过程的机理还不完全了解，所以真实模拟人脑的运作其实还处于盲人摸象阶段。既然连人类智能都还没有真正搞清楚，又怎么能科学地给人工智能下一个明确的定义呢？


    今天，“无学习，不人工智能”几乎成了人工智能研究的核心指导思想。许多研究者更愿意将自己称为机器学习专家，而非泛泛的人工智能专家。谷歌的阿尔法狗因为学习了大量专业棋手的棋谱，然后又从自我对弈中持续学习和提高，所以才有了战胜人类世界冠军的本钱。微软的小冰因为大量学习了互联网上的流行语料，才能用既时尚又活泼的聊天方式与用户交流。媒体更是大肆宣传说，人工智能应用在深度学习的基础上，是计算机从大量数据中通过自我学习掌握经验模型的结果。于是，有人定义人工智能是一种会学习的机器。


    但是人工智能在学习方面远不如人类，特别是在抽象或归纳能力上十分逊色。一个小孩子可以轻轻松松地通过认识一辆车识别出大多数车来，但人工智能系统为了识别一辆车要经过上万次的学习才行。所以，这种定义人工智能的说法也有问题。


    其实，针对人工智能，不同的定义将人们导向不同的研究或认知方向，不同的理解分别适用于不同的人群和语境。如果非要调和所有看上去合理的定义，我们得到的也许就只是一个全面但过于笼统、模糊的概念。


    维基百科的“人工智能”词条采用的是斯图亚特·罗素（又译作斯图尔特·罗素）与彼得·诺维格在《人工智能：一种现代的方法》一书中所下的定义。他们认为，人工智能是关于“智能主体的研究与设计”的学问，而“智能主体是指一个可以观察周遭环境并做出行动以达成目标的系统”。


    基本上，这个定义涵盖了目前各种不同的人工智能定义，既强调人工智能可以根据环境感知做出主动反应，又强调人工智能所做出的反应必须达成目标，同时不再强调人工智能对人类思维方式或人类总结的思维法则（逻辑学规律）的模仿。


    关于到底什么是人工智能的定义过程，说明了人工智能其实还是一门十分年轻和有待进一步发展探索的学问。它所涉及的领域之广，方法之多，应用之众，让它成为了一门充满神奇魅力的科学，也引无数英雄各领风骚。


    ## 2.5 图灵奖——计算机界的诺贝尔奖


    我们已经知道了图灵的故事，虽然他的发明创造并没有让他在生前名声大噪，但随着时间的推移，他的理论越来越被人们承认和证明是人类文明最重要的成果之一。计算机科学起源于1936年他发表的那篇论文《论可计算的数》是怎么说都不过分的公认事实。连世界上第一台电子计算机的发明人冯·诺依曼也一再说，他的发明来自图灵理论。


    图灵提出的图灵机的伟大和深刻是到目前为止没有人所能超越的，至今全部的计算机理论最后都可以归结到图灵机上。而图灵机本身看上去又是那么简单明了，散发着人类智慧之光。就是这样一个简单得不能再简单的装置，被图灵证明和邱奇的λ演算是等价的，而λ演算又被证明和哥德尔的递归函数等价。哥德尔曾经对自己的递归函数是不是最广义的计算装置不是很有把握，图灵机让他完全不再怀疑自己。


    邱奇是一位美国数学家，1936年发表可计算函数的第一个精确定义，对算法理论的系统发展做出了巨大贡献。邱奇在普林斯顿大学执教并工作了40年，曾任数学与哲学教授。后来，他到了加州大学洛杉矶分校。他的λ演算是一套用于研究函数定义、函数应用和递归的形式系统，这种演算可以用来清晰地定义什么是一个可计算函数。


    λ演算可以被称为最小的通用程序设计语言，它包括一条变换规则(变量替换)和一种函数定义方式。λ演算的通用之处在于，任何一个可计算函数都能用这种形式来表达和求值。因此，它是等价于图灵机的。尽管如此，λ演算强调的是变换规则的运用，而非实现它们的具体机器，可以认为这是一种更接近软件而非硬件的方式。它是一个数理逻辑形式系统，使用变量代入和置换来研究基于函数定义和应用的计算。而图灵则用了一个简单的物理模型——图灵机实现了它，伟大之处自不待言。


    关于这个演算的名称λ，其实来自一个排版错误。邱奇本来采用了罗素的标记法，采用X上面戴个小帽子的符号![](images/figure_0048_0028.jpg)，但排版工人找不到这样的字模，就用λ代替了。邱奇的整个演算系统都是基于这个小帽子的，于是λ就成了邱奇无名函数的代名词，邱奇演算也被叫作λ演算了。


    如果图灵对人类的贡献仅限于计算机科学，那么他也许就没有今天这么崇高的声誉和地位。1950年他在英国哲学杂志《心》上发表的文章《计算机与智能》，是他的又一个具有划时代意义的成就，成为历史上最早的关于人工智能的系统化的科学论述，是人工智能研究的指导性文献。文章中提出的“模仿游戏”，也就是“图灵测试”，一直是人工智能的一种判断标准和定义。


    图灵很早就探讨了大脑皮层的发育过程，提出了人类智能发育从非组织化向组织化转变的看法，并指出人身上的任何部分都可以用机器来模仿。他还提到了基因、进化和选择。冯·诺依曼在他的启发下，提出人类神经系统的本质是数字的，尽管关于神经系统的化学和生物过程的描述可能是模拟的。现代物理学的一个假设就是整个宇宙都是离散的，即数字的。如果一切都是数字的，那么图灵机就是最简单而有力的模型。研究人工智能绕不开图灵机和以其为基础的整个计算机理论。


    现在可以看出图灵和他的理论是多么伟大和不可思议。所以，1966年美国计算机学会设立了图灵奖，以此来表彰科学家们在这个领域里做出的杰出贡献。由于图灵奖对获奖条件的要求极高，评奖程序又极其严格，一般每年只奖励一名计算机科学家，只有少数年份有两名合作者或在同一方向上做出贡献的科学家共享此奖。它是计算机界最负盛名、最崇高的一个奖项，有“计算机界的诺贝尔奖”之称。


    图灵奖一般在下一年的4月初颁发，从1966年至今共有70名获奖者。按国籍分，美国学者最多，欧洲学者次之，华人学者目前仅有2000年图灵奖得主姚期智。据相关资料，截至2018年，美国斯坦福大学的图灵奖获得者数量位列世界第一，麻省理工学院和加州大学伯克利分校并列世界第二，哈佛大学和普林斯顿大学分列世界第四和第五。

    '
