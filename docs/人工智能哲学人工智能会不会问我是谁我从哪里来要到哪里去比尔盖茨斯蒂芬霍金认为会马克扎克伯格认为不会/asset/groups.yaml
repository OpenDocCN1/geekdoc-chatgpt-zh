    # 第二种可能性：机器将替代部分工作


    第二种可能性是机器替代了我们的部分工作，这会导致长期失业。回顾我们之前的基本问题，这种可能性大概会与那些把自己视为动物或人类的人产生共鸣，它也会与那些认为除了物质世界还有精神世界或心灵世界的二元论者一拍即合，它也将吸引那些把他们的“自我”视为一种“涌现的特性”或“灵魂”的人。所有这些不同信念的核心都是认为人类和机器之间存在实质性的差异，因此机器的能力是有限度的。但是同时，这些信念也承认人类和机器的能力有大范围的交集。


    “部分”替代的逻辑直截了当，也是许多读者都熟悉的叙述。就像这样：当然，过去也有因技术而失业的现象，但总是被创造新就业的技术所抵消。而现在时代不同了，情况有所变化。首先，创新的速度要快得多，所以工作岗位被淘汰的速度也相应快得多。其次，在过去，自动化只取代了体力劳动，但现在我们面对的是认知劳动的普遍自动化，这将摧毁许多以前没有被自动化染指的行业。最后，自动化技术的成本正在迅速下降，这意味着2020年价值100万美元的机器人到2030年可能只需要1000美元。


    综上所述，我们即将经历比以往任何时候都更剧烈的失业潮。而且种种迹象表明，一般情况下，一份工作的报酬越低，就越容易实现自动化。这意味着技术水平最低的工人将首先失去工作，总的来说，这一群体能够竞争的岗位将越来越少。


    虽然技术确实会创造一些新的工作岗位，但它们的数量相对较少，而且需要更多的教育和培训。当然，你可以开一家工厂，为快餐店建立接单机器人售货亭，并创造少量新的高薪工作岗位，但那家工厂可以制造成千上万个这样的机器人，就会摧毁不计其数的人工接单岗位。如果技术摧毁大量低技能工作的同时，只创造少数新的高技能'
  - '[PAGE 88]


    工作，那么我们就将面临低技能工作岗位的短缺和大量长期失业的低技能工人。因此，我们会处于永久性的大萧条之中。


    若说有些工作计算机不会去做，或者至少几个世纪都不会去做，我想到了牧师、水管工和警察。机器能做的事情确实有限，然而，这些限制远远小于许多现有工作的要求。


    一旦你接受了自动化将承担越来越多的低技能工作的观点，你就无法逃避这样一个事实：这将导致有很多低技能工人，但只有少量低技能工作岗位。


    我们怎么看待上述内容？让我们来探究它背后的五个假设基点。


    假设1：机器和技术造成了失业。


    长期以来，技术是工作岗位的“破坏者”的指责一直备受争议。16世纪80年代，威廉·李(William Lee)发明了织袜机。他托关系获得了向伊丽莎白女王展示他装置的机会，并希望能获得皇家专利。女王认为这个装置很灵巧，但却告诫李：“你想想看，这发明对我可怜的臣民们会有什么影响呢？它无疑会剥夺他们的就业机会，给他们带来毁灭，使他们成为乞丐。”事实上，正是由于织袜从业者的愤怒，李不得不离开了英国。


    在接下来的几个世纪里，随着制造业的快速发展席卷全球，每一项发明都遭受了劳动者的愤怒和敌意。法国纺织工人拒绝使用自动织布机，把他们的木鞋扔进机器里。在英国，施莱暴动(Swing
    Riots)的参与者抵制自动打谷机，将谷物砸碎。船夫们破坏了蒸汽机的第一次试运行，他们认为蒸汽机会使他们失业。在德国，反对织带机的抗议活动声势浩大，以至于政府下令烧毁了织带机。飞梭的发明使织布变得更容易时，它的创造者约翰·凯伊(John
    Kay)却受到了一群人的攻'
  - '[PAGE 89]


    击。詹姆斯·哈格里夫斯(James Hargreaves)在纺织业创造了另一项奇迹——珍妮纺纱机(spinning jenny)，但只能眼睁睁地看着机器被英国的又一群暴徒烧毁。约翰·希斯考特(John
    Heathcoat)发明了一种技术，可以让蕾丝的生产变得更高效，他眼睁着自己的整个工厂及其设备在光天化日之下被烧毁。


    1811 年，这种对自动化的敌意演变成卢德运动(the Luddite movement)，该运动由一群强烈反对技术取代技工的人组成，发起人是青年内德·卢德。据说，他砸碎了两台织袜机，这吸引了数百名支持者，他们在农村四处游荡，焚烧工厂，还杀害了一些地方的机器所有者。


    在此背景下的一个故事或许可以为我们指明前进的道路。这件事发生在1814年11月29日。正是在这一天，《泰晤士报》(The Times)首次使用蒸汽印刷机印刷。印刷工人发誓要报复机器的发明者，并毁灭机器本身。但是，他们被告知，如果不使用暴力，在他们于别的地方找到类似工作前，还可以拿到全额薪资。这对印刷工人来说似乎是公平的，进步的步伐还在继续。


    这些暴力和破坏性的反应是可以理解的。当时大多数劳动者生活在贫困线或以下。无论男人还是女人一生都只从事一门手艺，以此糊口。就业机会会很少。与机器竞争并在交锋中失去生计的想法似乎太可怕了，令人难以想象。这些工人一定认为，富有的工厂老板对金钱有着无法抑制的渴望，如果技术允许的话，他们会把每个工人的工作都砍掉。这甚至可能是真的。


    这些极端的反应不是对一般技术发明的反应，而是对具体的可节省劳动力新技术的反应。你不会在历史课上读到1949年的空调大暴动，原因很简单：人们只会为能替代人类劳动的技术发明而暴动。'
  - '[PAGE 90]


    这种对新技术引发的后果迟疑不决的倾向也延续到了现代。柯达相机被预言会摧毁艺术。人们对电能的恐惧也很强烈。1891年，本杰明·哈里森(Benjamin Harrison)总统让白宫的工作人员开关灯，因为他和他的家人都不敢接触电路开关。20世纪30年代，当汽车收音机广泛使用时，有人认为人们会在开车时摆弄收音机而分心，即使他们不这样做，他们也会因为收音机的存在而分心，然后引发车祸。目前对转基因生物的担忧，无论是否值得，都是人类与生俱来的谨慎表现。


    除了工人自身对自动化的实际担忧外，还有意识形态方面的担忧。卡尔·马克思(Karl Marx)相信机器与工人是互相矛盾的，他说：“当劳动工具以机器的形式出现时，立即会成为工人自身的竞争对手。历史上没有比英国纺织工的逐渐消亡更可怕的悲剧了。”有些人认为人类与机器在同一活动中竞争的想法本身就是错误的。


    如果节省劳动力的技术确实导致失业，我们就会遇到一些麻烦。比如：AI每天都有新的突破。每年授予的技术专利都比前一年更多。美国每天大约有1000份专利申请获得通过。此外，在过去的几年里，全球机器人销量逐年创下历史新高。过去10年，成本下降了四分之一，预计未来10年还将再下降四分之一。与此同时，机器人的质量正在提高。没有理由认为这些趋势会改变。在亚马逊，已经有15
    000个机器人在仓库工作，打包产品并准备发货。亚马逊的机器人数量在未来也不太可能下降。


    对于失业的担忧有一个简单的逻辑，它是这样的：世界上只有这么多工作岗位，如果你给了机器人一个，那么人类就少了一个。有趣的是，这种想法显然是不真实的。曾经存在的大多数工作都被技术取代了。我举几个例子，次序不分先后：大多数马倌在汽车发明时失业了。煤油灯一亮，几乎所有的蜡烛匠人都被解雇了。不久以前，在保龄球运动中，把倒下的球瓶归位的工作还是由人工来完成的，但后来'
  - '[PAGE 91]


    他们被机器人取代了。有人发明了“吞噬工作”的按钮技术，电梯操作员就被淘汰了。原先电报是由男孩们传递的，直到有人打破了这个状态，发明了电话，这使男孩们都失去了工作。曾几何时，你期望着在黄昏时分点亮路灯，为战胜黑暗尽自己的一份力量，直到有人发明了电灯。曾经运送冰块是一项需要大量运输人员的产业，直到电冰箱的出现，把全行业的运送工人都送进了失业行列。从前人们用扫把打扫街道，后来就发明了清洁车来做这事。


    这些被科技取代的人后来怎么样了？毕竟，你从未听说过一群四处游荡的电梯操作员找不到工作的故事。答案是显而易见的。所有那些眼看着自己的工作被裁掉的人都去做了其他的工作。我并不是刻意弱化这些转变的难度，相反，我指出这一点是为了强调人类的非凡之处。自然界中的动物只能做单一的事情。正如我前面提到的，狭义人工智能只能做一件事。但我们的才艺近乎无限。人类的潜力是全世界最大的尚未充分开发的资源。在对美好生活的追求中，我们使用的技术越多，我们能做的就越多，因此，总的来说，我们的工资也会水涨船高。


    当然，我们已经看到技术确实降低了特定行业对工人的需求。仅仅在20世纪，农业类工作岗位的占比从40%下降到2%。就在20世纪后半叶，制造业工作岗位所创造的价值占经济总量的比例从30%下降到10%。在那个世纪，我们目睹了全新职业的诞生和消亡。职业的迭代几乎让人不知所措。比较一下1900年的劳动力和2000年的劳动力，我估计，在现代经济中一份工作的半衰期大约是50年左右。从1900年到1950年，大概有一半的工作岗位消失了，主要是在农业领域。从1950年到2000年，另外一半也消失了，其中许多是制造业。而且，就算不是全部，大部分的破坏都是由技术造成的。要相信技术是工作岗位的破坏者，就必须解释这样一个事实：所有这些破坏都发生在充分就业、国民生产总值不断增长和工资不断上涨的时期(与这一趋势背道而'
  - '[PAGE 92]


    驰的10年大萧条，不是由技术造成的，而是由宏观经济的力量造成的)。


    但是美国的整个20世纪是反常的吗？ 解决这个问题的一个方法是，将拥有大量机器人的地方与没有机器人的地方进行比较。如果机器人真的取代了人类，我们应该会看到制造业工作岗位对人的需求下降，而有更多的机器人投身于此。但是，正如布鲁金斯学会(the
    Brookings Institution)[8]的马克·穆罗(Mark Muro)和斯科特·安德斯(Scott Andes)在《哈佛商业评论》(Harvard
    Business Review)上所写：


    ......机器人的应用与制造业就业率的变化之间没有明显的关系。尽管德国在1993年至2007年间安装了比以往更多的机器人，但其在1996年至2012年间的制造业工作岗位仅缩减了19%。与德国相比，同一时期美国的制造业工作岗位减少了33%。


    他们接着指出，尽管其他国家诸如意大利、韩国和法国等国部署的机器人数量超过了美国，但它们在制造业岗位上的流失比例却低于美国。另一方面，包括英国和澳大利亚在内的国家在机器人方面的投资低于美国，制造业工作岗位的降幅却比美国更大。机器人能够创造制造业的工作岗位而不是摧毁它们，这一想法并不像看起来的那么令人惊讶。当你能在一个行业中引入效率，你就能降低成本或提高质量。降低成本和提高质量会带来更高的产量，从而创造就业机会。


    事实是，技术主要是在增加工人，而不是取代他们。麻省理工学院(Massachusetts Institute of Technology，简称MIT)经济学教授戴维·奥托尔(David
    Autor)认为，技术并不能真正完成绝大多数工作，“不能被自动化代替的任务通常由自动化来补足......大多数工作流程都依赖于多方面的投入：包括劳动力和资本，智力和体力，创造力和机械性重复劳动，技术掌握和直觉判断，汗水和灵感，遵守规则和明智地运用自由裁量权。”'
  - '[PAGE 93]


    他坚持认为，使用技术使工作的某些部分实现自动化，几乎总是使那些机器无法全部胜任的任务变得更有价值，因为随着技术的发展，整个工作的价值会上升。


    哈佛大学经济学家劳伦斯·卡茨(Lawrence Katz)赞同这一观点，并坚定地表示：没有任何历史迹象表明有某种形式的失业是由技术造成的。他在接受《麻省理工科技评论》(The
    MIT Technology Review)采访时表示：“我们的工作岗位从未被耗尽。从长远来看，人们没有失业的长期趋势，就业率是相当稳定的。人们总能创造新的工作岗位。人们总会想出新的事情去做。”


    当然，在一些情况下，新技术会直接淘汰工作岗位。但历史表明，它也创造出了新的岗位与之抵消。有时这种此消彼长的联系很难被察觉。杜塞尔多夫(Dusseldorf)机场现在提供机器人代客泊车服务。你按下一个按钮，一个巨大的机器就会把你的车抬起来，并把它塞进一个垂直的车库。这产生了新的工作岗位，但不在机场。而在一家制造泊车机器人的工厂，雇用工人的工资大概比代客泊车的服务员的工资还要高。所以这项技术创造了新的高薪工作。


    我们如何看待被机器替代的工作，比如代客泊车呢？假设一件理论上无论如何都可以由机器完成的工作，如果非要让一个人去做它，那简直就是“无人性的”。“这项工作并没有彰显那个人作为一个人的优势。这是你可以给任何人做的最糟糕的工作，这好像是在说，“在我们造出一台机器来做这件事之前，你只是一个替身”。“厌倦”(boredom)这个词是在我们有了工厂之后才发明的。事实上，它最早被用于狄更斯(Dickens)的小说《荒凉山庄》(Bleak
    House)。工厂里充斥着非人性化的工作。这就是狄更斯不得不为无休止的重复和乏味的工作创造一个同义词的原因。机器人不会感到无聊，坦白地说，人类值得更好的工作。显然，世界上至少有10亿人愿意从事任何工作，即使是那些无'
  - '[PAGE 94]


    聊冗长的工作。底层的这10亿人挣扎在饥饿的边缘，他们对所有工作来者不拒。这是显而易见的。但作为一个物种，我们的长期目标应该是制造机器来做这些工作，这样人们就可以做只有人类才能胜任的工作。


    因此，认为技术正在消除对工人的需求的想法似乎很难证实。要实现这一目标，“这次不同以往”的假设必须是铁板钉钉的。我们一会儿会讲到。


    # 假设2：太多的工作岗位将加速被摧毁。


    “工作岗位将加速被摧毁”的论点也是老掉牙的。1930年，经济学家约翰·梅纳德·凯恩斯(John Maynard Keynes)就提到过：“我们正遭受一种新疾病的折磨……技术失业。我们发现节约劳动力方法的速度，超出了我们发现劳动力新用途的速度。这就意味着失业。”1978年，《新科学家》(New
    Scientist)杂志重申了这一担忧：“技术与就业机会之间最常被考虑和讨论的关系当然是技术节约劳动力从而消除就业机会(若非工作本身)的趋势。”


    1995年，类似的评论层出不穷。戴维·F.诺布尔(David F. Noble)在《没有人类的进步》(Progress without People)一书中写道：


    > 计算机辅助制造、机器人技术、计算机库存、自动化交换机和出纳机、电信技术——所有这些都被用来取代和替换人工，使雇主能够降低劳动力成本，外包、迁移业务。


    但这是真的吗？新技术是否会过快地摧毁当前的工作岗位？


    许多研究都试图直接回答这个问题。牛津大学(University of Oxford)的卡尔·本尼迪克特·弗雷(Carl Benedikt Frey)和迈克尔·A.奥斯本(Michael
    A. Osborne)在2013年出版了一本当时最权威的，当然也是被引用最多的报告。这份名为《就业的未来》(The Future of'
  - '[PAGE 95]


    Employment)的报告长达72页，但媒体最常提及的是其中一句话：“美国将会有大约47%的工作面临被计算机取代的风险。”嘿，谁还需要更多呢？可以肯定的是，它引发了标题党的集体狂欢。似乎每一个新闻源都在大声疾呼：“20年后，我们一半的工作岗位将被计算机夺去。”


    如果我们真的会在20年后失去一半的工作岗位，那么《纽约时报》（The New York Times)在1969年应该不会以《月球漫步》（Men walk on
    moon)[9]为头版，而应该报道这个故事。但这实际上并不是弗雷和奥斯本的本意。在报告的最后，他们用400字描述了研究方法的一些局限性：“我们没有试图估计有多少工作将真正实现自动化。自动化的实际程度和发展速度将取决于若干未说明的其他因素。”


    那47%的数字是怎么回事？他们说的是，这47%岗位中的一些工作内容将会实现自动化。嗯，这一点都不令人震惊。几乎所有的工作都涉及可自动化的任务单元，但工作岗位依然存在，只是工作内容不同而已。


    例如，对于下列工作岗位的自动化概率，弗雷和奥斯本给出了65%或更高的预测，它们是：社会科学研究助理、大气和太空科学家、药房助理。这意味着什么呢？社会科学教授将不再有研究助理吗？他们当然还会有的，只是研究助理当时做的大部分事情都将被自动化了，但他们还要做其他不同的事情。那么你还会问不会再有太空科学家了吗？不会再有人协助药剂师了吗？


    弗雷和奥斯本说，理发师的工作任务有80%的可能性会被AI或机器人取代。导游和木匠助手之类的工作中，某些特定的工作内容有90%或更高的概率被自动化替代。


    自动化和人们的工作岗位被取代并无联系，这是显而易见的：木匠助手的一些工作将会被自动化，但木匠助手的职业不会消失；而从'
  - '[PAGE 96]


    建筑师到动物学家，几乎每个人的工作内容都会发生变化。当然，你的iPhone可以当你的导游，但这不会让导游失业。任何花时间阅读《就业的未来》的人都看到了这一点。弗雷和奥斯本明显也非常坦率，他们提到：


    我们没有捕捉到任何由于相关工作任务被自动化而导致的职业内部变化，这些任务的自动化只是为人类劳动力腾出时间来执行其他任务。


    作为对弗雷和奥斯本报告的回应，致力于自由市场和民主的国家组成的政府间经济组织——经济合作与发展组织(OECD)在2016年发布了一份报告，直接反驳了弗雷和奥斯本的观点。在这份题为《经合组织国家工作自动化的风险》(The
    Risk of Automation for Jobs in OECD Countries)的报告中，作者们采用了一种“工作岗位整体化考量”的方法，得出了自动化导致失业的可能性比例为9%。这对于整体经济来说是相当正常的波动。


    2015年底，麦肯锡公司(McKinsey & Company)发布了一份题为《工作场所自动化的四个基本要素》(Four Fundamentals of Workplace
    Automation)的报告，得出了与经合组织类似的结论。但同样，其中也有一些具有煽动性的数字，以至于媒体无法抗拒地引用了这些数字，从而制造耸人听闻的标题。该报告称：“最少有45%的工作可以使用已经证实的技术实现自动化。”可以推断，这句话与“45%的工作将被现有技术淘汰”有异曲同工之妙。经常被忽视的是对报告更充分的解释：


    迄今为止的研究结果表明，最重要的一点是，聚焦于工作岗位是一种误导。很少有工作在近期或中期能完全实现自动化。相反，某些工作内容更有可能是自动化的，这只会导致工作流程的变换，并对由人执行的工作内容进行重新定义，就像自动取款机的出现重新定义了银行出纳员的工作一样。


    “47%(或45%)的工作岗位将消失”的解释甚至经不住最随意的推敲。人类，即使是那些很少或没有受过专业训练的人，也拥有我们几乎想象不到的令人难以置信的技能。让我们仔细看看弗雷和奥斯本名'
  md: '

    ### 假设7：机器将变得如此廉价和高效，以至于它们的成本将低于人力。


    ### 假设8：教授机器一项新技能的编程成本加上运行机器的成本总是小于雇用人工劳动力成本。


    假设机器会变得很廉价或很高效，以至于它们将比人工更便宜，并且编程和运行这些机器的成本将低于雇佣人类的成本。这两个假设都与使用这些机器来做廉价劳动的经济可行性有关，倘若人类会失去所有的工作，条件就是制造、编程和操作这些机器的成本必须低于雇用一个人从事这些工作的成本。随着时间的推移，开发用于执行模糊任务的机器成本可能会迅速下降，也可能不会。业界知识分子重量级人物之一吴恩达认为这将会发生“AI将逐渐学会我们所做的一切。当一台机器几乎可以比任何人做得更好时，我们的社会结构就会开始瓦解。对此我们需要做好心理准备。”


    ### 假设9：人类缺乏发现机器无法胜任的任务的能力。


    最后一个假设是，人类缺乏发现机器无法完成的新工作的能力。在这种情况下，一旦我们发明了一项新工作，机器都可以比人类更快、更廉价地完成这项工作。


    如果上述九个假设都成立，那么几乎所有的人类有偿工作都将消失，社会上的大多数机构将不得不重新布局。想象生活在这样一个世界，所有的乌托邦和反乌托邦生活方式都会浮现在脑海中。如果这些假设中有一个是不正确的，那么这个论点就不攻自破了。而这些假设都是建立在“人类是机器、计算机将持续进化、建造技术的成本将继续下降”的出发点上的，那么其结果在许多人看来都是显而易见的，结果就是机器迟早会超过我们。


    ## 第二种可能性：机器将替代部分工作


    第二种可能性是机器替代了我们的部分工作，这会导致长期失业。回顾我们之前的基本问题，这种可能性大概会与那些把自己视为动物或人类的人产生共鸣，它也会与那些认为除了物质世界还有精神世界或心灵世界的二元论者一拍即合，它也将吸引那些把他们的“自我”视为一种“涌现的特性”或“灵魂”的人。所有这些不同信念的核心都是认为人类和机器之间存在实质性的差异，因此机器的能力是有限度的。但是同时，这些信念也承认人类和机器的能力有大范围的交集。


    “部分”替代的逻辑直截了当，也是许多读者都熟悉的叙述。就像这样：当然，过去也有因技术而失业的现象，但总是被创造新就业的技术所抵消。而现在时代不同了，情况有所变化。首先，创新的速度要快得多，所以工作岗位被淘汰的速度也相应快得多。其次，在过去，自动化只取代了体力劳动，但现在我们面对的是认知劳动的普遍自动化，这将摧毁许多以前没有被自动化染指的行业。最后，自动化技术的成本正在迅速下降，这意味着2020年价值100万美元的机器人到2030年可能只需要1000美元。


    综上所述，我们即将经历比以往任何时候都更剧烈的失业潮。而且种种迹象表明，一般情况下，一份工作的报酬越低，就越容易实现自动化。这意味着技术水平最低的工人将首先失去工作，总的来说，这一群体能够竞争的岗位将越来越少。


    虽然技术确实会创造一些新的工作岗位，但它们的数量相对较少，而且需要更多的教育和培训。当然，你可以开一家工厂，为快餐店建立接单机器人售货亭，并创造少量新的高薪工作岗位，但那家工厂可以制造成千上万个这样的机器人，就会摧毁不计其数的人工接单岗位。如果技术摧毁大量低技能工作的同时，只创造少数新的高技能工作，那么我们就将面临低技能工作岗位的短缺和大量长期失业的低技能工人。因此，我们会处于永久性的大萧条之中。


    若说有些工作计算机不会去做，或者至少几个世纪都不会去做，我想到了牧师、水管工和警察。机器能做的事情确实有限，然而，这些限制远远小于许多现有工作的要求。


    一旦你接受了自动化将承担越来越多的低技能工作的观点，你就无法逃避这样一个事实：这将导致有很多低技能工人，但只有少量低技能工作岗位。


    我们怎么看待上述内容？让我们来探究它背后的五个假设基点。


    ### 假设1：机器和技术造成了失业。


    长期以来，技术是工作岗位的“破坏者”的指责一直备受争议。16世纪80年代，威廉·李(William Lee)发明了织袜机。他托关系获得了向伊丽莎白女王展示他装置的机会，并希望能获得皇家专利。女王认为这个装置很灵巧，但却告诫李：“你想想看，这发明对我可怜的臣民们会有什么影响呢？它无疑会剥夺他们的就业机会，给他们带来毁灭，使他们成为乞丐。”事实上，正是由于织袜从业者的愤怒，李不得不离开了英国。


    在接下来的几个世纪里，随着制造业的快速发展席卷全球，每一项发明都遭受了劳动者的愤怒和敌意。法国纺织工人拒绝使用自动织布机，把他们的木鞋扔进机器里。在英国，施莱暴动(Swing
    Riots)的参与者抵制自动打谷机，将谷物砸碎。船夫们破坏了蒸汽机的第一次试运行，他们认为蒸汽机会使他们失业。在德国，反对织带机的抗议活动声势浩大，以至于政府下令烧毁了织带机。飞梭的发明使织布变得更容易时，它的创造者约翰·凯伊(John
    Kay)却受到了一群人的攻击。詹姆斯·哈格里夫斯(James Hargreaves)在纺织业创造了另一项奇迹——珍妮纺纱机(spinning jenny)，但只能眼睁睁地看着机器被英国的又一群暴徒烧毁。约翰·希斯考特(John
    Heathcoat)发明了一种技术，可以让蕾丝的生产变得更高效，他眼睁着自己的整个工厂及其设备在光天化日之下被烧毁。


    1811年，这种对自动化的敌意演变成卢德运动(the Luddite movement)，该运动由一群强烈反对技术取代技工的人组成，发起人是青年内德·卢德。据说，他砸碎了两台织袜机，这吸引了数百名支持者，他们在农村四处游荡，焚烧工厂，还杀害了一些地方的机器所有者。


    在此背景下的一个故事或许可以为我们指明前进的道路。这件事发生在1814年11月29日。正是在这一天，《泰晤士报》(The Times)首次使用蒸汽印刷机印刷。印刷工人发誓要报复机器的发明者，并毁灭机器本身。但是，他们被告知，如果不使用暴力，在他们于别的地方找到类似工作前，还可以拿到全额薪资。这对印刷工人来说似乎是公平的，进步的步伐还在继续。


    这些暴力和破坏性的反应是可以理解的。当时大多数劳动者生活在贫困线或以下。无论男人还是女人一生都只从事一门手艺，以此糊口。就业机会会很少。与机器竞争并在交锋中失去生计的想法似乎太可怕了，令人难以想象。这些工人一定认为，富有的工厂老板对金钱有着无法抑制的渴望，如果技术允许的话，他们会把每个工人的工作都砍掉。这甚至可能是真的。


    这些极端的反应不是对一般技术发明的反应，而是对具体的可节省劳动力新技术的反应。你不会在历史课上读到1949年的空调大暴动，原因很简单：人们只会为能替代人类劳动的技术发明而暴动。


    这种对新技术引发的后果迟疑不决的倾向也延续到了现代。柯达相机被预言会摧毁艺术。人们对电能的恐惧也很强烈。1891年，本杰明·哈里森(Benjamin Harrison)总统让白宫的工作人员开关灯，因为他和他的家人都不敢接触电路开关。20世纪30年代，当汽车收音机广泛使用时，有人认为人们会在开车时摆弄收音机而分心，即使他们不这样做，他们也会因为收音机的存在而分心，然后引发车祸。目前对转基因生物的担忧，无论是否值得，都是人类与生俱来的谨慎表现。


    除了工人自身对自动化的实际担忧外，还有意识形态方面的担忧。卡尔·马克思(Karl Marx)相信机器与工人是互相矛盾的，他说：“当劳动工具以机器的形式出现时，立即会成为工人自身的竞争对手。历史上没有比英国纺织工的逐渐消亡更可怕的悲剧了。”有些人认为人类与机器在同一活动中竞争的想法本身就是错误的。


    如果节省劳动力的技术确实导致失业，我们就会遇到一些麻烦。比如：AI每天都有新的突破。每年授予的技术专利都比前一年更多。美国每天大约有1000份专利申请获得通过。此外，在过去的几年里，全球机器人销量逐年创下历史新高。过去10年，成本下降了四分之一，预计未来10年还将再下降四分之一。与此同时，机器人的质量正在提高。没有理由认为这些趋势会改变。在亚马逊，已经有15000个机器人在仓库工作，打包产品并准备发货。亚马逊的机器人数量在未来也不太可能下降。


    对于失业的担忧有一个简单的逻辑，它是这样的：世界上只有这么多工作岗位，如果你给了机器人一个，那么人类就少了一个。有趣的是，这种想法显然是不真实的。曾经存在的大多数工作都被技术取代了。我举几个例子，次序不分先后：大多数马倌在汽车发明时失业了。煤油灯一亮，几乎所有的蜡烛匠人都被解雇了。不久以前，在保龄球运动中，把倒下的球瓶归位的工作还是由人工来完成的，但后来他们被机器人取代了。有人发明了“吞噬工作”的按钮技术，电梯操作员就被淘汰了。原先电报是由男孩们传递的，直到有人打破了这个状态，发明了电话，这使男孩们都失去了工作。曾几何时，你期望着在黄昏时分点亮路灯，为战胜黑暗尽自己的一份力量，直到有人发明了电灯。曾经运送冰块是一项需要大量运输人员的产业，直到电冰箱的出现，把全行业的运送工人都送进了失业行列。从前人们用扫把打扫街道，后来就发明了清洁车来做这事。


    这些被科技取代的人后来怎么样了？毕竟，你从未听说过一群四处游荡的电梯操作员找不到工作的故事。答案是显而易见的。所有那些眼看着自己的工作被裁掉的人都去做了其他的工作。我并不是刻意弱化这些转变的难度，相反，我指出这一点是为了强调人类的非凡之处。自然界中的动物只能做单一的事情。正如我前面提到的，狭义人工智能只能做一件事。但我们的才艺近乎无限。人类的潜力是全世界最大的尚未充分开发的资源。在对美好生活的追求中，我们使用的技术越多，我们能做的就越多，因此，总的来说，我们的工资也会水涨船高。


    当然，我们已经看到技术确实降低了特定行业对工人的需求。仅仅在20世纪，农业类工作岗位的占比从40%下降到2%。就在20世纪后半叶，制造业工作岗位所创造的价值占经济总量的比例从30%下降到10%。在那个世纪，我们目睹了全新职业的诞生和消亡。职业的迭代几乎让人不知所措。比较一下1900年的劳动力和2000年的劳动力，我估计，在现代经济中一份工作的半衰期大约是50年左右。从1900年到1950年，大概有一半的工作岗位消失了，主要是在农业领域。从1950年到2000年，另外一半也消失了，其中许多是制造业。而且，就算不是全部，大部分的破坏都是由技术造成的。要相信技术是工作岗位的破坏者，就必须解释这样一个事实：所有这些破坏都发生在充分就业、国民生产总值不断增长和工资不断上涨的时期（与这一趋势背道而驰的10年大萧条，不是由技术造成的，而是由宏观经济的力量造成的）。


    但是美国的整个20世纪是反常的吗？解决这个问题的一个方法是，将拥有大量机器人的地方与没有机器人的地方进行比较。如果机器人真的取代了人类，我们应该会看到制造业工作岗位对人的需求下降，而有更多的机器人投身于此。但是，正如布鲁金斯学会(the
    Brookings Institution)[8]的马克·穆罗(Mark Muro)和斯科特·安德斯(Scott Andes)在《哈佛商业评论》(Harvard
    Business Review)上所写：


    > ......机器人的应用与制造业就业率的变化之间没有明显的关系。尽管德国在1993年至2007年间安装了比以往更多的机器人，但其在1996年至2012年间的制造业工作岗位仅缩减了19%。与德国相比，同一时期美国的制造业工作岗位减少了33%。


    他们接着指出，尽管其他国家诸如意大利、韩国和法国等国部署的机器人数量超过了美国，但它们在制造业岗位上的流失比例却低于美国。另一方面，包括英国和澳大利亚在内的国家在机器人方面的投资低于美国，制造业工作岗位的降幅却比美国更大。机器人能够创造制造业的工作岗位而不是摧毁它们，这一想法并不像看起来的那么令人惊讶。当你能在一个行业中引入效率，你就能降低成本或提高质量。降低成本和提高质量会带来更高的产量，从而创造就业机会。


    事实是，技术主要是在增加工人，而不是取代他们。麻省理工学院(Massachusetts Institute of Technology，简称MIT)经济学教授戴维·奥托尔(David
    Autor)认为，技术并不能真正完成绝大多数工作，“不能被自动化代替的任务通常由自动化来补足......大多数工作流程都依赖于多方面的投入：包括劳动力和资本，智力和体力，创造力和机械性重复劳动，技术掌握和直觉判断，汗水和灵感，遵守规则和明智地运用自由裁量权。”


    他坚持认为，使用技术使工作的某些部分实现自动化，几乎总是使那些机器无法全部胜任的任务变得更有价值，因为随着技术的发展，整个工作的价值会上升。


    哈佛大学经济学家劳伦斯·卡茨(Lawrence Katz)赞同这一观点，并坚定地表示：没有任何历史迹象表明有某种形式的失业是由技术造成的。他在接受《麻省理工科技评论》(The
    MIT Technology Review)采访时表示：“我们的工作岗位从未被耗尽。从长远来看，人们没有失业的长期趋势，就业率是相当稳定的。人们总能创造新的工作岗位。人们总会想出新的事情去做。”


    当然，在一些情况下，新技术会直接淘汰工作岗位。但历史表明，它也创造出了新的岗位与之抵消。有时这种此消彼长的联系很难被察觉。杜塞尔多夫(Dusseldorf)机场现在提供机器人代客泊车服务。你按下一个按钮，一个巨大的机器就会把你的车抬起来，并把它塞进一个垂直的车库。这产生了新的工作岗位，但不在机场。而在一家制造泊车机器人的工厂，雇用工人的工资大概比代客泊车的服务员的工资还要高。所以这项技术创造了新的高薪工作。


    我们如何看待被机器替代的工作，比如代客泊车呢？假设一件理论上无论如何都可以由机器完成的工作，如果非要让一个人去做它，那简直就是“无人性的”。“这项工作并没有彰显那个人作为一个人的优势。这是你可以给任何人做的最糟糕的工作，这好像是在说，“在我们造出一台机器来做这件事之前，你只是一个替身”。“厌倦”(boredom)这个词是在我们有了工厂之后才发明的。事实上，它最早被用于狄更斯(Dickens)的小说《荒凉山庄》(Bleak
    House)。工厂里充斥着非人性化的工作。这就是狄更斯不得不为无休止的重复和乏味的工作创造一个同义词的原因。机器人不会感到无聊，坦白地说，人类值得更好的工作。显然，世界上至少有10亿人愿意从事任何工作，即使是那些无聊冗长的工作。底层的这10亿人挣扎在饥饿的边缘，他们对所有工作来者不拒。这是显而易见的。但作为一个物种，我们的长期目标应该是制造机器来做这些工作，这样人们就可以做只有人类才能胜任的工作。


    因此，认为技术正在消除对工人的需求的想法似乎很难证实。要实现这一目标，“这次不同以往”的假设必须是铁板钉钉的。我们一会儿会讲到。


    ### 假设2：太多的工作岗位将加速被摧毁。


    “工作岗位将加速被摧毁”的论点也是老掉牙的。1930年，经济学家约翰·梅纳德·凯恩斯(John Maynard Keynes)就提到过：“我们正遭受一种新疾病的折磨……技术失业。我们发现节约劳动力方法的速度，超出了我们发现劳动力新用途的速度。这就意味着失业。”1978年，《新科学家》(New
    Scientist)杂志重申了这一担忧：“技术与就业机会之间最常被考虑和讨论的关系当然是技术节约劳动力从而消除就业机会(若非工作本身)的趋势。”


    1995年，类似的评论层出不穷。戴维·F.诺布尔(David F. Noble)在《没有人类的进步》(Progress without People)一书中写道：


    > 计算机辅助制造、机器人技术、计算机库存、自动化交换机和出纳机、电信技术——所有这些都被用来取代和替换人工，使雇主能够降低劳动力成本，外包、迁移业务。


    但这是真的吗？新技术是否会过快地摧毁当前的工作岗位？


    许多研究都试图直接回答这个问题。牛津大学(University of Oxford)的卡尔·本尼迪克特·弗雷(Carl Benedikt Frey)和迈克尔·A.奥斯本(Michael
    A. Osborne)在2013年出版了一本当时最权威的，当然也是被引用最多的报告。这份名为《就业的未来》(The Future of Employment)的报告长达72页，但媒体最常提及的是其中一句话：“美国将会有大约47%的工作面临被计算机取代的风险。”嘿，谁还需要更多呢？可以肯定的是，它引发了标题党的集体狂欢。似乎每一个新闻源都在大声疾呼：“20年后，我们一半的工作岗位将被计算机夺去。”


    如果我们真的会在20年后失去一半的工作岗位，那么《纽约时报》(The New York Times)在1969年应该不会以《月球漫步》(Men walk on
    moon)[9]为头版，而应该报道这个故事。但这实际上并不是弗雷和奥斯本的本意。在报告的最后，他们用400字描述了研究方法的一些局限性：“我们没有试图估计有多少工作将真正实现自动化。自动化的实际程度和发展速度将取决于若干未说明的其他因素。”


    那47%的数字是怎么回事？他们说的是，这47%岗位中的一些工作内容将会实现自动化。嗯，这一点都不令人震惊。几乎所有的工作都涉及可自动化的任务单元，但工作岗位依然存在，只是工作内容不同而已。


    例如，对于下列工作岗位的自动化概率，弗雷和奥斯本给出了65%或更高的预测，它们是：社会科学研究助理、大气和太空科学家、药房助理。这意味着什么呢？社会科学教授将不再有研究助理吗？他们当然还会有的，只是研究助理当时做的大部分事情都将被自动化了，但他们还要做其他不同的事情。那么你还会问不会再有太空科学家了吗？不会再有人协助药剂师了吗？


    弗雷和奥斯本说，理发师的工作任务有80%的可能性会被AI或机器人取代。导游和木匠助手之类的工作中，某些特定的工作内容有90%或更高的概率被自动化替代。


    自动化和人们的工作岗位被取代并无联系，这是显而易见的：木匠助手的一些工作将会被自动化，但木匠助手的职业不会消失；而从建筑师到动物学家，几乎每个人的工作内容都会发生变化。当然，你的iPhone可以当你的导游，但这不会让导游失业。任何花时间阅读《就业的未来》的人都看到了这一点。弗雷和奥斯本明显也非常坦率，他们提到：


    我们没有捕捉到任何由于相关工作任务被自动化而导致的职业内部变化，这些任务的自动化只是为人类劳动力腾出时间来执行其他任务。


    作为对弗雷和奥斯本报告的回应，致力于自由市场和民主的国家组成的政府间经济组织——经济合作与发展组织(OECD)在2016年发布了一份报告，直接反驳了弗雷和奥斯本的观点。在这份题为《经合组织国家工作自动化的风险》(The
    Risk of Automation for Jobs in OECD Countries)的报告中，作者们采用了一种“工作岗位整体化考量”的方法，得出了自动化导致失业的可能性比例为9%。这对于整体经济来说是相当正常的波动。


    2015年底，麦肯锡公司(McKinsey & Company)发布了一份题为《工作场所自动化的四个基本要素》(Four Fundamentals of Workplace
    Automation)的报告，得出了与经合组织类似的结论。但同样，其中也有一些具有煽动性的数字，以至于媒体无法抗拒地引用了这些数字，从而制造耸人听闻的标题。该报告称：“最少有45%的工作可以使用已经证实的技术实现自动化。”可以推断，这句话与“45%的工作将被现有技术淘汰”有异曲同工之妙。经常被忽视的是对报告更充分的解释：


    迄今为止的研究结果表明，最重要的一点是，聚焦于工作岗位是一种误导。很少有工作在近期或中期能完全实现自动化。相反，某些工作内容更有可能是自动化的，这只会导致工作流程的变换，并对由人执行的工作内容进行重新定义，就像自动取款机的出现重新定义了银行出纳员的工作一样。


