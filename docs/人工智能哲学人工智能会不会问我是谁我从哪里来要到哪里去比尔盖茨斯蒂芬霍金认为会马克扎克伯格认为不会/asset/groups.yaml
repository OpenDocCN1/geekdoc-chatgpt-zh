    有些人认为我们要好好利用我们的时间，否则，我们将消失于虚拟世界，这世界如此逼真，它们以如此不可抗拒和无风险的方式满足我们对爱、接纳和成就的社会需求，比我们“有缺陷”的现实好得多。毕竟，他们认为，只要现实还存在，人们就会试图逃离它，通常是以发醉、蒸馏或吸入等方式。我们今天所拥有的在线虚拟世界，其诱惑力直接体现在它们的受欢迎程度上。它们中很多都测量了用户花费在它们身上的总时间，已累计达到几百万年。这种受欢迎程度是通过我们低技术含量的和相当不切实际的计算机实现的，与虚拟现实所带来的完全沉浸感相比，这些在线虚拟世界会黯然失色。


