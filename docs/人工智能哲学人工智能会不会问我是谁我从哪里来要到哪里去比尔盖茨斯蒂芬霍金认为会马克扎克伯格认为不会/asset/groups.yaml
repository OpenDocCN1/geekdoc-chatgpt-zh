  - '[PAGE 9]


    # 卷首语


    (请认真阅读，此处是重点)


    机器人，职业，人工智能，有意识的计算机，超级智能，丰裕，失业的未来，“无用的”人类，稀缺性的终结，创造性的电脑，机器人霸主，无限的财富，劳动的终结，永不得翻身的下层阶级。


    以上这些短语和概念，很可能每天都在你的动态资讯中出现一些。关于它们的描述，有时候是积极的、充满期待的，但更多时候是可怕的和反乌托邦的。按说，论述这些话题的专家全是聪明、见多识广之人，但他们对未来的预测可不是有点不同，简直是完全相悖。这种对立性着实令人费解：为什么埃隆·马斯克(Elon
    Musk)、史蒂芬·霍金(Stephen Hawking)和比尔·盖茨(Bill Gates)都忌惮人工智能(以下简称“AI”)，并忧心忡忡地表示在不久的将来，AI会对人类的生存构成威胁？而为什么另一个同样杰出的群体，包括马克·扎克伯格(Mark
    Zuckerberg)、吴恩达(Andrew Ng)[1]和佩德罗·多明戈斯(Pedro Domingos)[2]在内，又认为“人工智能威胁论”给的理由太过牵强，几乎不攻自破。扎克伯格甚至称那些鼓吹末日将至的人相当不负责，当今人工智能领域最伟大的人物之一吴恩达亦表示，这种焦虑就像是担忧“火星上的人口过剩”，完全没有必要。埃隆·马斯克曾宣称人工智能是人类文明持续存在所面临的重大危机。在这之后，首席人工智能研究员和作者佩德罗·多明戈斯在推特上发了“一个字：唉”作为回应。两大阵营的成员都对自己的观点充满信心，同时对另一阵营的观点嗤之以鼻。'
  - '[PAGE 10]


    谈到机器人和自动化，情况与上述相同，专家们的意见大相径庭。有人说所有的工作都将被自动化取代，或者至少我们将进入永久性的经济大萧条，当一部分人通过他们高科技的、现代化的职业过上丰富多彩的奢华生活时，另一部分人工劳动力却因为没有能力和机器人竞争而失去工作。其他人对这些担忧不屑一顾，他们以自动化提高了工人生产率和工资的历史记录作为依据，推断未来更大的问题将是人力短缺。虽然这些群体之间的肉搏并不常见，但并不乏居高临下的谩骂。


    最后，当开始思考计算机是否会变得有意识并被赋予生命这一问题时，专家们再一次分成了两流。一些人认为，计算机可以有意识是一个不证自明的事实，因此任何其他的观点都是愚蠢的迷信。另一些人则强烈反对，他们认为计算机和生物是两种截然不同的东西，从机器和生物的定义来看，“活机器”的概念是自相矛盾的。


    对于那些全程关注这场辩论的人来说，最终只是感到困惑和沮丧。许多人在两派人的争论声中举手投降，他们总结说：如果处于技术前沿的人们都不能对将要发生的事情达成一致，那么还指望我们普通人做些什么呢？他们开始对未来惶恐，并由此认为这些令人不知所措的问题必然是无解的。


    有没有解决这场辩论的出路呢？我认为是有的。当我们意识到这些专家之所以持不同意见，不是因为他们知道不同的东西，只是因为他们选择相信不同的东西时，事情就有了转机。


    举个例子，有人预言我们将制造出有意识的计算机，并不是因为他们对“意识”的理解比常人更多，而是因为他们相信一个非常基本的理念：人类本质上就是机器。如果这一观点成立，那么我们最终可以造出一个机器人也就顺理成章。另一方面，那些坚持己见认为机器永远无法获得意识的人，也往往是因为他们不相信人类是纯粹的机器。'
  - '[PAGE 11]


    综上所述，本书的主题是：解构那些“有关机器人、工作、人工智能和意识等看法”背后的核心信念。我的目的是引导你看透这些棘手问题，细致入微地分析所有的信念假设，这些假设组成了专家们以满腔热忱发表的诸多观点。


    这本书绝不是我对这些问题的个人思考，虽然我也没有刻意隐藏我的思考，但个人思考对于你如何阅读这本书来说并不重要。因为我的最终的目标是：你在读完这本书后应该彻底了解，对于以上提到的问题，你的信念将引导你走向何方，之后，当你再听到一些硅谷大拿、杰出的教授或诺贝尔奖获得者对“机器人、工作或人工智能”发表自信满满的声明时，你能够立刻透过现象，洞悉他们声明背后的信念。


    像这样的旅程该从哪里开始呢？必然要从遥远的过去，甚至要从语言发明之际说起。我们在这本书中要解决的问题关乎现实、人类和心灵的本质，而不是关于晶体管、神经元和算法之类的技术问题。我们首先要弄清楚“人类是什么”，继而才能更明确地解决“机器人从人类手中夺走了什么工作”这类问题。如果我们本末倒置，就会出现困惑。


    因此，我邀请你和我一起漫步，穿越10万年的人类历史，沿着时间的轨迹，一边讨论重大问题，一边探索即将到来的未来。本书是一次征程，感谢一路有你相伴。


    拜伦·瑞希


    得克萨斯州，奥斯汀


    [1]吴恩达(Andrew Ng, 1976-)，出生于伦敦，毕业于加州大学，计算机科学家，斯坦福大学计算机科学系和电子工程系副教授，人工智能实验室主任，人工智能和机器学习领域国际上最权威的学者之一。'
  - '[PAGE 12]


    [2]佩德罗·多明戈斯(Pedro Domingos)，美国华盛顿大学计算机科学教授，加州大学欧文分校信息与计算机科学博士，在机器学习与数据挖掘方面著有二百多部专业著作和数百篇论文。'
  - '[PAGE 13]


    # 前言


    20世纪发生了不计其数的改变，快速的改变似乎是近百年最显著的特征。据说，几十项甚至可能几百项技术进步彻底改变了我们的生活，这些技术包括汽车、航空旅行、电视、个人电脑、互联网和手机。我们利用了原子，飞入了太空，发明了抗生素，消灭了天花，对基因组进行了测序。


    但是当回看历史时，我们会发现人类在过去的5000年里只发生了微乎其微的变化。我们和生活在5000年前的人一样，也有妈妈、爸爸、孩子、学校、政府、宗教、战争、和平；我们仍然庆祝出生并哀悼死亡；体育、婚礼、舞蹈、珠宝、文身、时尚、八卦、社会等级、恐惧、爱情、欢乐、幸福和狂喜等永远与我们如影随形。这在人类所有文化中都是普遍存在的。从这个角度看，一直以来人类真的没有太大的变化。我们仍然在早上去上班，只是我们到达那里的方式改变了；在古亚述(ancient
    Assyria)[1]，小孩拉着带轮子的小木马玩具晃晃悠悠；在古希腊，男孩们拔河比力气；古埃及的化妆品闻名于世；几千年前，波斯人庆祝生日的方式和我们几乎一样，有聚会、礼物和特别的甜点。


    不，我们这个时代最值得注意的，不是我们看到的变化，而是我们没有改变的地方，真正令人惊奇的正是我们与祖先的相似之处。在古罗马，角斗士有偿代言，他们在比赛开始之前背诵产品广告：“这就是我使用安蒂尼乌斯之剑的原因，不管花多少钱都买不到这么好的剑。”就像我们这个时代一样，那个时代的人为了出名也会做出些引人注目的破坏行为。比如，据说在公元前356年7月21日，一个名叫黑若斯达特斯(Herostratus)的纵火犯烧毁了以弗所(Ephesus)[2]的阿耳忒弥斯'
  - '[PAGE 14]


    神庙(Temple of Artemis)[3]——古代世界七大奇迹之一，仅仅因为他想通过这种方式名声大噪，法官迅速应对了黑若斯达特斯的奇葩想法，规定世人只要说他的名字就是犯罪。但很显然，黑若斯达特斯达到了他遗臭万年的目的。


    假设你去拜访古代朋友的家，你可能会看见大门上安装了一个黄铜狮子头，狮子的嘴里衔着圆环，你可以通过圆环拍击大门，告知主人你来了。如果你去参加一场5000年前的婚礼，你很可能会在婚礼派对上，跟随大家一起向新人抛撒大米，以此表达对新人的美好祝愿。如今，当我们看到考古学家们挖掘出的古代弹弓铅弹上都刻有“捕获”这个词时，仍旧会心一笑。


    古人就和我们一样。2300 年前希腊人提奥夫拉斯图斯(Theophrastus)写了一本名为《性格》的书。我们可以从书中真正体会到亘古不变的人类本性。提奥夫拉斯图斯在书中表达了对人类本性的讽刺，并按照不同性格对人进行了分类，例如谄媚型、粗野型、健谈型等。如果你认识的某人经常拍他的食物并发布在网上，你可以把他归类到提奥夫拉斯图斯所说的“絮叨型”：这类人会先赞美妻子，然后细细讲他做过的梦，再一盘一盘的给你讲他昨天的晚饭都吃了什么，最后总结道：“我们绝不是过去的我们了。”提奥夫拉斯图斯接着又描述了“愚蠢型”：当这种人去看戏剧时，很快就会睡过去，直到最后空荡荡的会场只剩下他一人……他们常在夜里胡吃海喝，等到不得不起身回家时，在半醉半醒间定会走错家门，并被邻居家的看门狗追咬。


    从人类历史上看，我们的时代几乎没有变化。事实上，我认为在人类历史上，真正的改变只有三次。每一次都源于技术，但不仅仅是一项技术，而是一组相互关联的技术，它们以根本的、永久的，甚至是生物的方式改变了我们。这就是技术，迄今为止只有三大变革而已。'
  - '[PAGE 15]


    # 这本书关乎第四次技术变革。


    [1]亚述(Assyria)，古代西亚奴隶制国家，位于底格里斯河中游，属于闪米特族的亚述人在此建立亚述尔城后逐渐形成贵族专制的奴隶制城邦。古代亚述的历史从苏美尔时期，到亚述帝国连续2000余年，一般分为古亚述、中亚述和帝国3个阶段。其中古亚述时期为公元前2000-前1600年间。


    [2]以弗所(EPHESUS，土耳其)，古典早期最重要的城市之一，以弗所在古代安纳托利亚半岛(Anatolia)是一座爱奥尼亚地区(Ionian)的希腊城市，在公元前10世纪由雅典殖民者建立。基士特河口从这里流向爱琴海(AegeanSea)，它也是帕尼欧尼亚同盟的一部分。


    [3]阿尔忒弥斯神庙是希腊神话阿尔忒弥斯女神的神庙，长425尺，宽230尺，有126根高60尺的大理石柱。据称建筑时间前后长达120年(相比之下，大希腊王建耶路撒冷圣殿也只用了46年)。'
  - '[PAGE 16]


    # # 第一章 通往现代的漫漫雄关道


    有人认为人之所以是人，是因为我们会使用工具。历史上的工具发展经历了三个阶段：火、农具、车轮，这些工具确实改变了我们，改变了我们的生活方式，改变了我们作为一个物种的轨迹。今日的我们仿佛是被这些工具塑造的，而人工智能再次让我们思考：我是谁。


    # ## 普罗米修斯的故事


    普罗米修斯(Prometheus)[1]的故事十分古老，至少已经传诵了3000年，还有可能流传更久。故事梗概如下：普罗米修斯和他的兄弟厄皮米修斯(Epimetheus)[2]都是泰坦神(Titans)[3](早于古典奥林匹斯神族)，受命使用黏土创造地球上的所有生物。一方面，厄皮米修斯创造动物，他迅速行动起来，随意地将黏土拍打在一起，做成动物的模样。宙斯还提供了一些天赋，并派兄弟俩将这些天赋分配给生物们，做好动物的厄皮米修斯快速分配起来，因此一些动物变得狡猾，一些动物可以伪装自己，一些动物长出凶猛的獠牙，还有一些动物可以飞翔。另一方面，普罗米修斯作为一名细心的工匠，他耗费了大量的时间，只负责创造一种生物——人类。他以众神的形象为模板精心打造人形，让人直立行走。当普罗米修斯塑好人形后，他发现他的兄弟把宙斯提供的所有天赋都给予了动物。很容易想到那个画面：普罗米修斯望着曾经装着所有的天赋而如今空无一物的盒子，对他的兄弟无奈地说：“伙计，这是真的吗？”所以，普罗米修斯决定做一件被明令禁止的事情：将火赐予人类。因为这一行为，他付出了惨重的代价：宙斯命人把他绑在岩石上，让一只秃鹰啄食他的肝脏，而他的肝脏每天夜里总是重新长出来，第二天继续被秃鹰啄食，日复一日，永无尽头，直到赫拉克勒斯(Hercules)[4]解救了他。'
  - '[PAGE 17]


    # 01 第一纪： 语言和火


    无从得知孤立无助的人类何时驯服了火，但有相当充分的证据表明早在约10万年以前，火就已经得到广泛的应用。在希腊更晚期的关于普罗米修斯的神话故事中，我们很容易看出火如何让人类发生了天翻地覆的变化，这是历史亘古不变的记忆。“火”作为一项原始的多功能技术，它带来光明；它驱逐动物，守护人类的安全；它提供热量，使人类能够适应更寒冷的气候环境。但毫无疑问，为人类烹饪食物才是火最伟大的意义所在。


    为什么火的烹饪功能如此重要呢？因为烹饪极大地提高了人体的热量摄入。比起生肉来，熟肉易于咀嚼，而且蛋白质在烹饪过程中会分解，使其更容易被人体消化吸收，最为关键的是，在火的作用下纤维素和淀粉都更容易被分解，因此很多原本不能食用的植物变成了人的食物来源。事实上，烹饪“外包”了人类消化食物过程的部分职责，在漫长的进化中，人类的消化系统已适应熟食，生食难以消化，所以现代人想通过吃生食获取人体所需的热量是很难的。


    人体怎样利用摄取的新热量呢？这些热量被我们用于大脑，使其发生了前所未有的进化，在短时间内，人类大脑的神经元就增至黑猩猩和大猩猩的三倍。这样的大脑就好比一辆意大利超级跑车，它可以在瞬间从0迈加速到60迈，所以它必然会消耗大量汽油，事实上，人类所摄取的热量有至少20%都被用在供给我们高级的大脑。这样的消耗在生物界是极其奢侈和不可思议的，极少有其他动物把哪怕10%的能量用于提升智力。从生存的角度来看，这是一个相当大的赌注，人类基本对大脑押上了全部的身家，而这一切都是值得的，越发强大的大脑创造了除“火”以外的另一项新技术——语言。诚如语言学家威尔·杜兰特(Will
    Durant)[5]所说，语言让我们一跃成为“真正的人类”。'
