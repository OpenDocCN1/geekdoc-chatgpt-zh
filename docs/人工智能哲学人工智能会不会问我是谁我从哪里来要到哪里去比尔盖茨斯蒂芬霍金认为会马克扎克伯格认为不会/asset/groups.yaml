    我将这个过程描述为，大脑的某个部分似乎是负责人，相当于大脑的司仪，挑选由谁来发言，选择你能领悟到什么。如果是这样的话，那么你大脑的那一部分就是你，但大多数大脑科学家认为，大脑中并不存在这样的部分。大脑自发管理，没有“你”做总指挥。把它想象成一场大型的鸡尾酒会，大家都在喋喋不休。突然，一个女人喊道，“我的衣服着火了”，整个会场都被她吸引了目光。一个男人抓起花瓶，把花拔了出来，浇了她一身水。与此同时，另一位客人脱掉外套，开始灭火。正当骚动平息下来时，有人喊道：“外面是猫王(埃尔维斯)吗？”每个人都跑过去看向窗外。在这些事例中，没有人负责。没有人发号施令，不同的过程只是“吸引注意力”。


