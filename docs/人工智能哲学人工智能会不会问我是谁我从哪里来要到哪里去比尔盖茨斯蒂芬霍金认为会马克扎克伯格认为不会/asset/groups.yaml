    mind)会注意到这一点，并迅速猜测你为什么会转换焦点。然后它会对你说，“你现在应该移动你的眼睛，看看另一边的数字是否与这一边相同。然后——这就是你的显意识狡猾的地方——它重写你的记忆，让你以为你是决定转换焦点在先，付诸行动在后。贝尔和布卢姆做了一些非常令人信服的实验来证明这一点，这些实验只需要一台个人电脑和一个简易程序就可以重现。所以，在他们看来，你自由意志的感觉，那种你在做决定的感觉，是在你真正做这些事情的几毫秒之后产生的。我再重申一遍：你做某事的决定似乎是在你做了某事之后发生的。这就好像你的意识永远都在你的身体后面追着大喊：“那是我的主意！那是我的主意！”


    为什么我们的大脑会对我们耍这种把戏？为什么我们会认为有一个管理员“我”在发号施令？一种理论认为信仰自由意志是有益的。2008年，心理学家凯瑟琳·沃斯(Kathleen
    Vohs)和乔纳森·斯库勒(Jonathan Schooler)发表的一份报告，似乎为这一理论提供了依据。两'
