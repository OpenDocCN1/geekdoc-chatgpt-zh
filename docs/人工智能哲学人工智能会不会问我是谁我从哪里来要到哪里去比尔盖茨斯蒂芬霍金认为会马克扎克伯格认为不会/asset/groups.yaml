    # 理论1：弱涌现


    雷·库兹韦尔(Ray Kurzweil)在他写的《如何创造思维》(How to Create a Mind)一书中设想，大脑是由大约10万个不同的程序按照层次排列而成的集合。每个程序都知道如何做一件小事。10万个程序中的某一个也许只能识别字母A，而存在于它下面层级的一个程序也许只能识别字母A中的一横。当你阅读一本书的时候，随着你脑内所有程序以不可思议的速度被唤起，你的大脑中会发生无数的事情，使你能够把信息拼凑起来，从而了解周围的世界。库兹韦尔认为，意识是“复杂物理系统的一种涌现特性”，其可以在计算机中复制。库兹韦尔明确提出了机器意识的问题，他说：“一台成功模拟人脑复杂性的计算机，也将拥有与人类相同的涌现意识。”当然，这完全是猜测，但他可能是对的。


    许多相信意识是一种涌现现象的人，所指的其实是弱涌现(weak emergence)，当我们对不同事物相互作用的结果感到惊讶时，就会出现弱涌现(我们一会儿会讲到强涌现，strong
    emergence)。你可以研究一年的氧气，然后再研究一年的氢气，却永远不要猜测二者结合在一起会产生水，一种完全不同于这两种成分的物质。你永远猜不到它在室温下是液体。可一旦水被创造出来，你可以转过来说：“哇，现在我看到发生了什么，但是我从来没有想到会发生这样的事。”因此，水的湿润性是一种弱涌现性，因为氧和氢在室温下都不是湿的。弱涌现是一个意料之外但可以解释的结果(至少在理论上)。它认为一切都是因果关系结果的产物，因果关系结果可以解释为在夸克(quarks)和轻子(leptons)的四大基本力[6]的基础上运行的可预测结果，而夸克和轻子是物质的基本组成部分。就是这样。在弱涌现的情况下，所有的物理定律仍然完好无损，但我们仍然有很多东西要学习，以便能够猜测在某些情况下会发生什么。'
