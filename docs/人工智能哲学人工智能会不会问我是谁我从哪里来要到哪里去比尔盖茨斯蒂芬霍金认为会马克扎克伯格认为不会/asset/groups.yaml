    of plants)一书中，突然出现了植物可以“感觉”的观点(更准确地说，是重新兴起，因为这是一种古老的信仰)。这本书还提到了中央情报局(CIA)的一份报告，报告称一名男子将测谎仪连接到一株植物上，当他想到要烧掉一片叶子时，仪器就会做出反应，这表明植物也有心灵感应。


