    奇迹，我们都足够幸运把技术的恩赐视为理所当然。我们的生活水平是建立在我们所能消耗的能量之上的。世界各地，每个人都在一定程度上受益于他能够额外消费的能量。如果你现在恰好住在中国，你会消耗自身的100瓦能量，加上额外的2500瓦能量，巴西的额外能量有2000瓦，而印度只有1000瓦。在一些国家，除维持生命的基本消耗外，每个人能消耗的额外能量只有几百瓦，这就是贫困。


    目前，能源非常昂贵，我们都在尽量减少使用。例如，美国航空公司(American Airlines)取消了飞机上的购物册，此举仅仅通过减少纸张重量，就为航空公司节省了每年35万美元的燃油成本。我们花费了大量的精力、时间和金钱来寻找减少能源使用的方法。但是，从整个星球的角度来看，我们的目标应该是增加我们的能源消耗——当然，是以清洁、可持续和公平的方式。要做到这一点，唯一的方法就是发明或发现新的廉价、免费的清洁能源，这是走向共同繁荣的最快途径。


    我相信我们会实现这个目标，因为能源是宇宙中最丰富的物质。虽然化石燃料本身是有限的和稀缺的，但能源却无处不在。事实上，权威人士告诉我，E=mc²的意思是最微小的物质也蕴含着丰富的能量。技术是开启所有清洁绿色能源的关键。鉴于这项技术可以实现我们之前探索过的“翻倍”目标，那么，在数十种几乎免费的无限能源的潜在来源中，总有一种会被攻克，开始为地球提供动力，这只是时间问题。


    我们周围有无穷无尽的能源，只需几个技术突破，每一种能源都能改变整个星球。例如，一场飓风所包含的能量足以为美国提供一年的电力，我们只需要弄清楚如何驾驭它。我们生活在一个每天都潮起潮落的星球，它释放出的能量比我们能够使用的要多，我们只需要学习如何收获其中的一小部分。我们生活在一个有着熔融内核的星球上，内核比太阳表面还要热，如果我们能收获其中的一小部分，整个地球就可以在窗户全开的情况下启动空调，并且毫无负罪感。我们上层大气中的风速高达每小时200英里，很多公司都在研究如何获得这些能量。中国、欧洲和其他地方正在建造核聚变反应堆的发电厂，试图制造微型太阳并获得用之不竭的能量。当然，太阳每年温和地向我们倾泻400万艾焦耳[4]的能量，我们使用了多少呢？500艾焦耳。所以在太阳赐予我们的400万艾焦耳能量中，我们只需要找出收集500艾焦耳能量的方法。如果存在这样的方法，那这就只是一个技术问题。


    我们需要多少能量呢？要使地球上每个人的用电量达到美国人均的两倍，每年需要5000艾焦耳，相当于目前美国能源产量的10倍。诚然，这是一个令人望而生畏的数字，但与我们刚刚讨论的一些资源潜能相比，这是一个可能达到的数字。


    我们可以期待重大突破，因为财政激励措施都到位了。能量产量的微小改善都会带来利润动机和财富，使得我们见证了太阳能和其他清洁能源的价格急剧下降。没有理由相信这种情况不会持续下去。


    ## 不再有战争


    那么第四纪的战争呢？我们是否将进入一个AI导致战争激增的时代，就像我们在第12小节中讨论的那样？不这么认为。相反，我认为国家之间有组织的战争正在终结。这似乎是一个荒谬的乐观预测。每天的新闻总是充斥着铿锵作响的军刀声。自从城市建立以来，有组织的战争就一直伴随着我们。在过去5000年有文字记录的年份里，没有战争的时间加起来大约只有200年。因此，任何声称战争将会停止的人，都有责任证明，一些基本因素正在发生变化，使得战争已经过时。首先，我们到底有多暴力？与整个动物界相比，乍一看，人类似乎比所有其他动物都更倾向于互相伤害。此外，许多人凭直觉怀疑，我们也比那些生活在天真烂漫的古代社会的狩猎采集者祖先更暴力。


    然而，这两种假设都是错误的。当你观察动物的暴力致死率时，会得到一些非常有趣的数字。事实证明，猫鼬是地球上最狡猾、最凶残的物种，大约五分之一的猫鼬死于另一只猫鼬之手。它们看起来像是生活在《人类清除计划》（The
    Purge）之类的电影所描述的环境：一刻不停地猎杀同类。一些猴子和狐猴的物种几乎与猫鼬同样残忍。沿着列表往下看，我们可以看到大约13%的狮子是被其他狮子杀死的，10%左右的狼死于其他狼的爪下，棕熊互相残杀的比率略低于10%。然后再来观察更为平和的动物，与人类有一些共同行为的类人猿，杀害同类的比率比棕熊又下降了约2%。


    那么人类更暴力吗？让我们从地球上最和平的地方开始，看看人类现在的暴力水平。根据经济与和平研究所(Institute for Economics and Peace)的全球和平指数(Global
    Peace Index)，冰岛以较大优势成为最和平的地方。冰岛人口刚刚超过33万，在最近的正常年份，冰岛记录的死亡人数约为2000人。如果冰岛上住的都是猫鼬，那么这2000例死亡中就有400例是被谋杀的。如果冰岛成为类人猿栖息地，那么其中40例的死亡将是由其他猿类造成的。那么冰岛有多少人类死于谋杀呢？基本上是2个。有些年份冰岛没有出现任何死于谋杀的人，而在最近的12年间，冰岛只发生了25起谋杀案。该国也没有经历过因战争致死的事情。这就是今天和平文明的顶峰，大概0.1%的死亡是由人类残杀造成的，比类人猿少95%以上。所以我们知道我们可以做到这一点，对吧？冰岛人在生物学上并不比世界其他地方更和平，他们只是在文化上更平和。


    那么，世界其他地区的情况如何呢？显然会更加暴力，但并不像你想象的那么糟。我们每年有6000万人死亡，其中45万人死于谋杀。战争中的伤亡人数变化很大，但是为了方便计算，如果我们估算有15万人(大约是过去半个世纪的平均数字)，那么由暴力造成的总死亡人数就是60万人，与6000万人的总死亡人数比较，也就是大约占了1%。


    值得注意的是，这个数字正在下降。我们最权威的考古推测，远古人类互相残杀的比率接近于猫鼬，所以在从野蛮到冰岛人的转变道路上，人类取得了巨大进步。


    然而，每年有15万人死于战争，这仍然是一个不小的数字。我们真的能在未来避免战争吗？我认为有令人信服的理由让我们可以抱有希望。


    ### 首先，也是最重要的，是经济原因。


    战争不再对国家有利。因为越来越多的财富以无形资产的形式储存，再也没有什么战利品可以攫取。诚然，军火商从战争中赚钱，可一旦一个国家从战争中获得经济利益的可能性消失，战争也将随之消失。在现代，富裕的国家根本无法承受彼此之间的战争带来的损失。一项估计表明，如果东京被地震摧毁，重建成本将达到10万亿美元。日本怎会考虑与一个可能摧毁东京的国家开战？重建纽约、北京、伦敦或巴黎的成本是相当的。在一个不对等战争的世界里，富裕国家实际上比贫穷国家损失更多，因为破坏他人的行为变得没那么烧钱，而被打击的目标却有天文数字的价值。随着整个世界变得更加富裕，战争在财政上变得更加不可想象。


    但经济后果并不仅限于被炸弹摧毁的东西。世界贸易联系日益紧密，贸易伙伴之间很少发生战争，因为战争对商业有害，而商业拥有巨大的影响力。我们的世界金融体系正在形成一个相互依赖的整体，战争实际上是经济自杀。军事联盟因将爱好和平的国家拖入其好战盟友挑起的战争而臭名昭著，但这些联盟正在消失，取而代之的往往是既支持贸易又支持和平的经济联盟。


    ### 第二，助长战争的条件正在消失。


    一个国家的人均GDP越低，未来发生战争的可能性就越大，所以如果我们消除贫困，就能减少战争。粮食短缺也是未来冲突的诱发因素。所以如果我们终结饥饿问题，我们同样能减少战争。文盲和缺乏教育已被证明与贫穷和战争有关，幸运的是，受教育程度和识字率都在逐步上升。民主和平理论认为，民主国家之间很少发生战争，民主正席卷世界。二战刚结束时，只有10个民主国家，现在已经超过100个。经常把战争当作消遣的君主政体正在消失。


    ### 第三，世界文化悄然发生变化。


    我们生活的世界，经济成就在很大程度上取代了军事成就，民族主义处于衰落当中。各国阻止信息流动的能力接连丧失，这使得各国更难以垄断信息和控制舆论。各地的人们都不再假定官方的说法就是正确的，这加大了为战争编造借口的难度。每周七天，每天二十四小时的新闻循环将战争的恐怖实时地带入我们的家中，而互联网则让我们看到了四面八方的苦难。越来越多的人出国旅行，不同国籍、种族和宗教之间的联姻也日益增多，这有助于和平。各国政府变得更加透明和公开，有五十多个国家正在制定或部署政务公开的举措。


    沟通比以往任何时候都要容易，它促进了和平。如果白宫(the White House)和克里姆林宫(the Kremlin)之间的热线有助于缓和冷战期间的紧张局势，那么60亿手机账户的作用又将有多大呢？社交媒体允许人们组织和推动政府改革。随着英语成为全世界的第二语言，语言障碍得以减少了。人工智能实时语音翻译的即将到来，将打破更多的沟通障碍。


    这样的例子不胜枚举。如果你没被说服，就在心里搜寻与我列出的大趋势相反的例子吧。但是，请重新阅读这份清单，并问一问，它的对立面到底是不是战争。想象一个没有民主的世界，更多的饥饿，更多的贫困，更多的民族主义，完全经济孤立主义，国家对新闻媒体的控制，教化未开的公民，没有互联网，等等。这难道不是一个充满危机，一触即发的世界吗？我们正在建设与之相反的东西，那么这怎么可能不是和平的力量呢？


    我们离结束战争还有很长的路要走。军火工业仍然是地球上三大产业之一，另外两个是粮食和药物。在美国，我们得到了艾森豪威尔(Eisenhower)总统曾经警告过我们要防止的——由利润驱动的永久性军火工业。亨利·福特(Henry
    Ford)曾经说过：“告诉我谁能从战争中获利，我就能告诉你如何停止战争。”所以在第四纪，军备开支很可能不会下降，我们将继续制造更新更好的武器，包括装备AI的杀人机器人。在未来很长一段时间内，各国将继续花费巨额财富储备来获取致命武库。较之以前有所改变的是，权衡什么时候使用这些武器，这将成为一个更加昂贵和具有更大风险的命题。


    尽管第四纪有了全面的进步，但有两种破坏性的暴力形式不会很快终结。首先，总会有像安德斯·贝林·布雷维克(Anders Behring Breivik)[5]、蒂莫西·麦克维(Timothy
    McVeigh)[6]和察尔纳耶夫兄弟(Tsarnaev brothers)[7]这样的人。也总会有像911事件里那样的恐怖分子。能否使这些对陌生人实施大规模破坏的人不复存在，我也给不出一个确定的回答，或许实现的哪一天也还遥遥无期，而事实上，这些人的破坏力还将不断增强。其次，内战、政变和叛乱也将继续。但它们在遥远的未来会得以消除，因为所有国家都在繁荣中发展，每个国家的每个人都会认同同一体系。


    ## 休闲时间


    早些时候，我们讨论了凯恩斯的观点：在未来，我们每周只工作15个小时。我建议，如果以历史为鉴，除满足基本需求的必要劳动外，我们还应继续做工，旨在获得一份不断增长的“需求清单”。也就是说，在第四纪，我们肯定还会有休闲时间，甚至更多。


    多余的休闲时间无疑会有新的来源。其中之一将是“更加节省个人劳动力设备”的开发。我们以前见过这样的东西：洗衣机、电熨斗、电动吸尘器等等。回想一下，手机尚未普及之前，组织最简单的活动需要花费多少时间和精力。我还记得我大学期间，如果想和一个朋友见面吃汉堡，会有如下过程：我去他的宿舍，但他不在。所以我会在他的门上贴一张便条，上面写着：“我在图书馆。我们去吃汉堡吧。”当他看到消息去到图书馆的时候，我已经离开了，图书管理员会指着一个大致方向，告诉他我朝“那边”走去了。约会失败，忘记汉堡吧。后来我和这位朋友的再次相见，已经是14年后，在我们孩子的少年棒球联赛上偶然重逢。


    同样地，在GPS出现之前，每个驾车者都携带着床单大小的地图，而这些地图在印刷之前就已经过时了。当已婚夫妇一起开车出行时，往往是一人开车，另一人手拿地图。基于这种事实，地图上通常会刊登离婚律师的广告。


    技术把我们从以上这些不计其数的时间浪费中解放出来。我们完全有理由相信，未来会更高效。想想看，在交通中花费的等待时间，都将在未来节省下来。惊喜吧！通过优化路线，无人驾驶汽车会把本将虚耗的等待时间还给你。设想一下，在接下来的几年里，你会花多少分钟来寻找你的失物，这些时间都将属于你，因为你的智能家居会记录下你放置每样东西的路径。考虑一下你余生在“决定去看什么电影，去哪家餐馆吃饭，去看哪个医生，去哪里度假”上花费的总时间。当然，决定权永远掌握在你手中，但人工智能会比你更了解你自己，你将开始相信它的建议。


    我们的生活每时每刻都在被成千上万件几乎感觉不到的小事侵蚀，每个人都感同身受：我们排队等候，填写表格，阅读说明，下载更新，试穿衣服，卸下杂货，坐在候诊室里，在官僚机构中穿梭。机器人和人工智能不会把所有的时间都还给我们，但我们会像我们希望的那样，得到其中的很大一部分。那么我们将如何利用这些额外的时间呢？


    我认为，要了解该问题，可以去观察我们使用互联网的方式。这是一项还处于早期阶段的最新的变革性技术。我们怎么会选择使用这样一项前所未有的技术呢？其揭示了很多关于我们的信息，其中大部分都是好的。


    ## 我们想要表达自己


    我们很容易淡忘，在互联网出现之前，每个人都很少写东西。我想到了我父母那一代人。大概从1960年到2000年间，我父亲一直在美国企业工作，母亲则与我们守在家里。和那一代中的大多数人一样，他们根本不怎么书写。然而在大众印象里，他们不写电子邮件，但写了很多信，这不是真的。第二次世界大战后，随着电话的普及，书信写作开始下降。据美联社(Associated
    Press)报道，到1987年，远在互联网进入主流之前，平均每个家庭每两周才会收到一封信。如果我当时反问我的父母为什么他们不多写一点，这个问题貌似太奇怪，我妈妈甚至会摸摸我的额头，看我是不是发烧了。他们很可能会回答：“没有什么想说的。”然而，这个答案是错误的。事实证明，他们不写只是因为书写工具太麻烦了，而且，也没有途径发布他们写的东西。我们是怎么知道的？这很简单：当我们发明电子邮件时，每个人都开始写信。信件如此之多，以至于每秒有超过200万封电子邮件被发送出去。刚才，在你阅读这篇文章的一秒钟里，又发送了200万封。现在，又是200万。当我们发明博客后，有超过1亿人创建了博客。当我们创建一个机制，让人们用来评价和审查产品，无数的人都照着做了。事实证明，我们都想吐露心声，一旦有了工具，表达的闸门就会打开。


    这不是代际现象，而是一种行为现象。50岁以上人群对这些技术的应用落后于年轻一代，但最终还是赶上了他们。2015年，美国20岁年轻人中有89%使用电子邮件，相比之下，70岁老人中的这一比例为88%。


    ## 我们想彼此建立友好关系


    事实表明，我们不仅想表达自己，也想与别人建立友好关系。每天有13亿人登录Facebook。每个人平均都有150个Facebook好友。[ 有趣的是，150是邓巴数字(Dunbar''s
    number)[8]，是通过实验推测出的一个人可以与之保持稳定关系的人数。]随着时间的推移，人们发布了无数的帖子，更新了无数的状态，总共产生了超过10000亿个“赞”。有很多人给一大堆东西点赞。此外，人们相互交流，并通过数千个不同的网站进行链接。他们联系在一起分享共同的兴趣、结识新朋友、约会等等。互联网以无人预料到的方式促进了社会互动。


    ## 我们想互相帮助


    除了交流，我们也想互相帮助。在互联网上，人们不求任何回报地帮助别人。你可以在论坛上提出问题，询问网友你和家人应该为即将到来的波特兰(Portland)之行做什么准备，然后会有十几个人参与进来。如果你被诊断出患有某种疾病，你无疑可以成为“支援论坛”的一分子。你在个人问题上挣扎吗？有一些团体可以帮助你，并给你提建议。这些人的所有互助几乎完全是出于利他主义。


    ## 我们是有创造力的


    谁能想到我们那么有创造力呢？互联网打开了我们创造性的闸门。每秒钟有5万张照片上传到Facebook上，每天有数以百万计的视频被上传到YouTube，iTunes商店有3000万首歌曲。事实证明，我们当中有很多人是摄影师、录像师和音乐家，这超出了任何人的想象。我们只是缺少创建和共享这些内容的工具。一旦我们制造出这些工具，创造性的风潮就会被释放出来。这是前所未有的事情。巨大的民主化表明，我们都是有创造力的，艺术并非少数天才的专属领域。


    ## 我们想有影响力


    互联网赋予许多人力量，激励他们为一个更美好的世界而努力。社会行为是互联网的规范。请愿书被创建和传播，慈善机构筹集资金、提高群体意识，我们的集体愤怒被引导并转化为行动。想想在互联网出现之前做这些有多难。到头来，我们对让生活变得有意义抱有强烈的渴望，而互联网使之成为可能。


    ## 我们想知道真相


    有种观点认为，互联网把你锁在一个信息泡沫里，让你只看得到支持你观点的事实，这让人们感到非常惊惶和绝望。我确信这种情况会发生，但想想另一种选择吧，这对我们有好处。例如，在1980年，你从当地报纸上获得每日所需的信息，并从三个网络新闻节目中任选一个观看，三个节目时长为一小时，内容都是基本相同的故事。就是这样，我们都受制于极少数人的意见。互联网允许对每一项声明进行事实核查，对每一个谎言提出质疑。你想知道的任何事情，只需敲击几下键盘，点击几下鼠标。互联网上每秒有超过10万次的网络搜索，从本质上说，每一次搜索都代表着一个人，他想知道一些他目前不知道的事情。这是知识的大民主化，无疑是一件好事。


    以上是我们在过去几十年里了解到的关于自己的六件事。我们有理由相信，这些在第四纪伊始崭露头角的属性将继续在这个时代中繁荣兴盛。人工智能会为我们提供新的方法来实现这一切。它将帮助我们辨别真相、与他人互动、富有创见，以及其他一切。


    互联网为我们提供了做这些事情的基础设施，尽管我们认为它是先进的，可很快我们就会把它看作是有缺陷的，并想知道我们是如何利用它做所有事情的。像互联网这么大、范围这么广的事物，需要像人工智能这样更先进的东西来帮助我们与它进行交互，而这一点正在实现。


    有些人认为我们要好好利用我们的时间，否则，我们将消失于虚拟世界，这世界如此逼真，它们以如此不可抗拒和无风险的方式满足我们对爱、接纳和成就的社会需求，比我们“有缺陷”的现实好得多。毕竟，他们认为，只要现实还存在，人们就会试图逃离它，通常是以发醉、蒸馏或吸入等方式。我们今天所拥有的在线虚拟世界，其诱惑力直接体现在它们的受欢迎程度上。它们中很多都测量了用户花费在它们身上的总时间，已累计达到几百万年。这种受欢迎程度是通过我们低技术含量的和相当不切实际的计算机实现的，与虚拟现实所带来的完全沉浸感相比，这些在线虚拟世界会黯然失色。


    这一场景的社会含义并不难理解。友谊、婚姻、养儿育女，这一切都在物质世界中终结。出生率下降，社会交往减少。我们已经退出了物理世界。我们通过静脉注射的方式维持生命，不再借助VR面具，而是直接连通大脑和虚拟现实，让一切更为真实。


    这些戏剧性的故事构成了有趣的科幻小说，但我不相信。正如无纸化世界使用的纸张比以往任何时候都多，互联网时代带来的一个意料不到的后果是，当人们在网上相遇时，他们最终往往会在现实中亲自见面。所以数字化的介绍变成了亲身体验。这是为什么呢？为什么我们似乎更喜欢真实的经历？真实似乎富有一种无法人工制造的无形品质。虚假的世界只是看起来真实而已。


    那么，我们会利用技术从世界撤离吗？会放弃与人类同胞的关系吗？比起支持性的证据，我看到了更多相反立场的证据，我们希望有

    '
