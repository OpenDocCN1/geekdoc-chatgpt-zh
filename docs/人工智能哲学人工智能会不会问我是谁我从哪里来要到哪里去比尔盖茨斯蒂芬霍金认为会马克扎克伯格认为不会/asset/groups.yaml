    ## 第四章 计算机意识


    未来的计算机是只存在于这个世界上，还是在体验这个世界？它是否既具有自知，又能够反思这种自知？但我们还可以走的更远，思考当我们把人类独特的本质赋予机器人的时候，我们是否能够将机器人看作我们的同类？计算机除了需要问我是谁，可能还需要问我做对了吗。


    ### 约翰·弗鲁姆的故事


    在太平洋靠近澳大利亚的海域，是美拉尼西亚地区(Melanesia)，由瓦努阿图(Vanuatu)、所罗门群岛(the Solomon Islands)、巴布亚新几内亚(Papua
    New Guinea)、斐济(Fiji)四个国家以及一些较小的岛屿组成。第二次世界大战期间，这些国家处于太平洋战区的交通要塞，所以美军来到了这里，并由此在当地出现了一种奇怪的社会现象，被称为“货物崇拜”(cargo
    cults)。


    这些岛屿上的原住民亲眼看到，登陆后的美军清理了一些地面作为跑道，并建造了一座瞭望塔。之后在岛民充满敬畏的注视中，空中的飞机呼啸着降落在跑道上，卸下大量货物，通常，军方会与岛民分享其中的一些，包括罐头食品和加工制品。


    这催生了“货物崇拜”。当地人照猫画虎，也清理跑道，用竹子建起塔台。他们没有收音机，大概就用椰子做成了一个与收音机形似的盒子。他们没有灯光来引导飞机进入跑道，作为替代他们沿着跑道种植竹子。他们用木头做枪，学着美国人那样进行军事演习。他们穿的衣服，也被刻意设计得与美军军装类似。有时他们甚至会用稻草建造全尺寸的飞机，希望能引来其他飞机。他们做了美国人之前在当地所做的一切。但奇怪的是，他们的召唤不管用了，飞机不再着陆，也不再有货物到达。


    即使在今天，瓦努阿图依然有一群人信仰二战时期美国军人的理想化身——约翰·弗鲁姆(John Frum)。每年的2月15日，他们都会举行游行来纪念他，并坚信他有朝一日会带着货物重返人间，与众人分享。


    ### 16 感知能力


    我们要阐述的问题是，能否创造出有意识的计算机，如果不能，那么这些致力于造出一个的人们是否只是“技术性货物崇拜”的信徒？他们受到迷惑，相信如果以某种方式制造机器，“飞机”就会着陆，机器就会有意识。


    我们将直面意识(consciousness)问题，但要做到这一点，首先需要探究两个概念：感知能力(sentience)和自由意志(free will)。对它们的全面了解将有助于确定机器是否可以变得有意识，因为尽管这两个词不是意识的同义词，但它们确实与意识有一些共同的本质特征。让我们从“感知能力”开始。这个词经常被误用，在科幻小说中，它通常用来表示“智能的(intelligent)”，比如“参宿七(Rigel
    7)[1]上的存在者已经开始构建城市，并且明显是具有智能的(sentient)”，但这并不是它真正的意思。它其实是指感觉或“觉察”事物的能力。在参宿七这个例子中应该使用的正确单词是“有智慧的(sapient)”，其意等同于“智能的(intelligent)”。这就是为什么我们是智人(Homo
    sapiens)也叫作智能人(intelligent people)，而不是知觉人(Homo sentients)。


    虽然感知能力并不意味着“智能”，但它对我们来说仍然是一个重要的概念。例如，我们关心动物是否有感知能力。它们能感觉到疼痛

