  - '[PAGE 122]


    力的需求。将经济数据与机器人抢占劳动岗位联系起来存在两个问题。首先，无明显起伏的就业市场始于2000年，并持续了大约15年，在这期间我们经历了几次经济衰退、金融危机、贸易增长等等。目前还不清楚自动化是否是根本原因。其次，在美国，2015年的收入中位数的增长是有史以来最大的，超过300万人摆脱了贫困。


    最后，如果第三种可能性发生，就不会有失业的人。但这真的可能吗？随着机械化和自动化程度的提高，肯定会有一些人跟不上时代的步伐，最终有些人无法参与就业市场竞争，对吗？A劳动参与率(the
    labor participation rate)，是经济活动人口(包括就业者和失业者)占劳动年龄人口的比率，是用来衡量人们参与经济活动状况的指标。


    不对。假设一个人只要没有受到身体或精神衰弱的折磨，就不会成为低技能的人。智商为90和智商为130的人在玩《危险边缘》的时候差距似乎很明显，但在现实中，从大格局来看，差别是微不足道的。这一观点是著名的波兰尼悖论(Polanyi
    paradox)[11]的基础。1966年，迈克尔·波兰尼(Michael Polanyi)提出，人类知识的广阔领域包括学习力和技艺，这些知识可能解放我们的意识。例如，想想烤蛋糕的所有步骤。把盘子拿出来，熔化黄油，打碎鸡蛋，搅拌面糊，在蛋糕上撒上糖霜，等等。事实上，任何人都可以不假思索做到这一切。但是人类的能力不仅在于做蛋糕，还在于我们都能做的其他10
    000件事，比如发现配偶心情不好、刷牙或骑自行车。我们都是巨大的能力仓库。但是因为一个人可以做10 000件事，另一个人不但可以做那10 000件事，并且还知道房地产规划，所以我们说第一个人的技能低，第二个人的技能高。但事实并非如此，因为他们都拥有99%或更多的相同技能。


    从计算机的角度看，医生和码头工人之间没有什么不同，他们都能够完成模式识别、理解社会背景以及归纳和演绎推理。此外，他们也能阐述自己的感觉，流利地说一门语言，转动门把手，系好自己的'
  - '[PAGE 123]


    鞋带。船长向码头工人解释他的货物清单和医生向病人阐述他的病情并没有什么不同。


    另外，那些认为有人无法学习新的工作技能的观点，低估了人类的潜力。认为从事某种非技术工作的人已经达到了他能力的上限是完全不正确的。以我的经验，大多数人都觉得他们能做的比要求他们做的更多。如果有机会承担更具挑战性的工作，以换取更多的地位和金钱，大多数人倾向于接受挑战。人们想要有意义、有目标的生活，当然，如果能得到的话，他们还想要更高的工资。我们雇用一个人盖屋顶的唯一原因不是因为那个人只会盖屋顶，而是因为我们还没有发明一种机器来盖屋顶。因此，尽管盖屋顶的人可能有能力管理20名工人，并提出一个积极的创收计划，但屋顶需要铺瓦，而没有人制造出盖屋顶的机器来接替这个人。


    当90%的人务农时，剩余10%的人无疑会认为这90%的人没有其他能力。如果认为这90%的人可以成为实验室技术人员、市场总监和冰雕师，这种想法让那10%的人觉得荒诞可笑。他们会这样说：“这90%的人只是普通的农民。”


    但他们种田是因为我们需要农民，而不是因为他们只能做这些。我坚信，很大一部分劳动力需要从机器能做的苦差事中解放出来。


    想象一个以修剪草坪为生的人，让我们叫他杰瑞(Jerry)。杰瑞高中毕业，但没受过更多的教育。此外，假设有人开发了一种售价较低的自动割草机，而杰瑞突然发现割草机这个行业的利润已经跌到了谷底，他能做什么呢？


    记住，在可能性三的观点下，杰瑞实际能从事的工作有很多很多。杰瑞所要做的就是找到一种增加自我价值的方法。然后他就能得到一份工作。例如，杰瑞可能会在网上学习如何种植和维护葡萄藤。'
  - '[PAGE 124]


    这不是一个很大的能力变化，对吧？我并不是说杰瑞会成为一名园艺家。他只是读了足够多的书来学习如何种植和培育葡萄。然后，他开始挨家挨户地宣传在家自己栽培葡萄的乐趣。见鬼，我会购买他的服务。


    然后，20年后，葡萄藤机器人公司推出了一种机器人，它可以种植比杰瑞更好的葡萄藤。那么杰瑞要如何应对呢？他可以阅读维多利亚时代的园林绿化书籍，然后，挨家挨户地游说，按照古老的方法和惯例，精准地种植灌木和花卉。但总有一天这份工作也会被机器人取代，但那时杰瑞已经退休了。


    有谁能说杰瑞“失业”呢？他是已知宇宙中最复杂、最全能的物体。


    # 11 几个重大问题


    # 收入不平等


    收入不平等怎么办？如果收入不平等，那前述三种可能性并无差别。但无论AI机器人是否替代所有的工作、部分工作或不会替代任何工作，收入不平等都将是一个日益严重的问题。让我们探索一下原因。


    “富人越来越富，穷人越来越穷”是老生常谈的论调之一。然而，数据似乎证明了这一点。两位意大利经济学家将1427年佛罗伦萨的税务记录与今天的税务记录进行了比较，发现当时最富有的家庭现在仍然是最富有的。在英国，使用同样的方法，其他经济学家发现，1170年的富人似乎仍然是今天的富人。但为什么会这样呢？一种普遍的看法是，富人控制着政府，并在社会上施加影响，从而能够在经济层面'
  - '[PAGE 125]


    为自己谋取利益。第二种理论认为财富创造财富。在大富翁游戏中，通常每个玩家是从1500美元起步的。现在我们试试玩一个不同版本，让有些玩家从50美元开始，另外一些从5000美元开始。


    这两种对富人变得越来越富的解释很可能都是正确的，但在现代，有一些更重要的东西在起作用。富人能够调配更多的技术，从而能够更快地增加财富。工人吉尔(Jill)有了手机，是的，她的经济潜力增加了。老板简(Jane)给她的1000名员工中的每个人都下发了一个新的生产力管理软件，然后将提高了1000倍的生产力收入囊中。但要做到这一点，她首先必须有钱购买1000份软件。这就是在现代社会用财富产生更多财富的方式。


    此外，今天的技术可以极大地提高生产力，因此，投入很少的钱创造巨量的财富比以往任何时候都要容易，然后再利用这些财富创造更多的财富，生生不息。现在活着的亿万富翁比以往任何时候都多，而且他们中靠自己赚钱而不是继承遗产的比例还在继续上升。你怎么能在1000年前白手起家，然后不断创造出10亿美元的价值呢？但在过去十多年的时间里，谷歌创造了七位亿万富翁，脸书创造了六位。所以在现代，旧的财富得以保存，新的财富得以创造。仅仅这个简单的事实就加剧了收入不平等。但事情不仅如此。


    事实证明，新技术的经济效益对富人的帮助大于穷人。这是怎么回事？从技术中获得的经济收益有三种不同的分配方式，只有其中一种可以帮助穷人。


    首先，当技术被企业采用时，所有生产率的提高都会通过降低成本和提高利润率来推高公司股票的价值。因为在美国，70%的股票由20%的人持有，所以这一经济利益就落入了这20%的富人手中。与此同时，这些企业的工人以固定价格出售他们的劳动力，在经济上并不分享新技术带来的效率收益。如果你在零售巨头公司工作，它安装了'
  - '[PAGE 126]


    一种新技术，可以在结账时更快地扫描商品价格，那么这家公司的成本就会降低，但小时工却不会因此而加薪。所以，技术能够而且经常能够提高企业利润而不提高工资。这就是为什么在收入保持不变的情况下股市可以上涨。


    其次，对于个体经营者或能够出售其产出(而不是按小时计算的劳动力)的人来说，他们能够获得技术带来的效率收益，因为他们可以说是自己公司的所有者。这些人大多属于中高收入阶层，包括律师、会计师和建筑师。他们能够有效利用技术来减少他们必须做的低价值单调乏味的工作，从而腾出时间来做更多高价值的工作。律师过去花费大量时间研究法律判例，如今可以在瞬间完成这一搜索，并以此收回数小时或数天的生产力，再将其卖到其他地方。


    最后，富人和穷人都受益于他们消费的商品的低成本和高质量。

    例如，所有的消费者都能买得起比上次大两倍的电视机，不是因为他们赚了更多的钱，而是因为电视机的价格没有随着电视机尺寸的增大而上涨。这是一个常见的现象：在15年的时间里，伴随生产效率的提高，价格降低，质量提高，T型车(Model
    T)的价格下降了近75%。这种实践今天还在继续，只是速度更快。


    当然，即使在最后一种情况中，富人受益也比穷人更多，因为他们消费得更多。但对穷人有好处并不是一件小事。以互联网为例。考虑一下这个问题：有人要付你多少钱才能让你不再使用互联网？假设你回答“100万美元”。在某种现实意义上讲，这意味着互联网对你来说价值100万美元。但是你可以从当地的宽带供应商那里以每月49.95美元的价格买到它。这对你来说是巨大的利润!我们的现代技术确实提高了几乎每个人的生活水平。如今，一个拥有智能手机的人可以获得比10年前地球上任何人更多的信息，而且拥有比20年前大多数人更好的相机。智能手机的通信能力还会让几年前的国家元首和军队首脑羡慕'
  - '[PAGE 127]


    不已。事实上，它们的计算能力比1950年地球上存在的任何东西都要强。这只是一个很小的便携设备，你可以通过一个为期两年的合同免费获得。除此之外，还有其他10
    000种技术可以改善我们所有人的生活，从抗生素到止汗剂再到防抱死刹车，这样的技术数不胜数。因此，科技对我们所有人的生活质量和经济生活水平都大有裨益。


    这三种机制全都讲的是技术生产率的提高如何直接惠及高收入人群，而只间接地帮助低收入人群。这并不是某种阴谋，而是事情的发展方式就是如此，也是技术需要投资，投资需要财富这一事实的结果。所以这就是技术进步如何在政策没有变化的情况下加剧收入不平等的原因，更多的技术只会导致更多的不平等。


    另一个进一步加剧经济不平等的因素是，目前技术投资的回报超过了劳动力投资的回报。换言之，如果你是一名企业主，准备用1000美元投资你的企业，总的来说，你把钱投资在新技术上会比把这1000块钱花费在支付员工加班费上赚得更多。有许多政策举措可以抵消“劳动力投资回报低”这一影响，包括通过培训提高工人生产率，减少劳动所得税，从而降低劳动力价格，以及取消鼓励资本投资于技术而非劳动力的人为低利率。


    一定会有人问，收入不平等是否真的是我们应该关注的问题，为什么不去关心诸如“非富人的绝对收入”呢？技术让一些人比以前更容易创造数10亿美元的财富，这本身并不是一件坏事。穷人的收入翻一番，富人的收入翻三倍，这加剧了不平等。但如果有人提出让穷人的收入翻番，我猜穷人会欣然接受。在我看来，美国的收入中位数持平而国民生产总值却在上升，这才是真正的问题所在。世界上最富有的人之一沃伦·巴菲特(Warren
    Buffett)是这样总结的：


    富人做得非常好，企业做得也很好，利润率与历史水平相比非常高，但对于占总人口20%的最底层的2400万人来说，最高年收入只有2.2万美元。我们还没有学会如何让每个人分'
  - '[PAGE 128]


    享我们所拥有的财富。


    好消息是，考虑到我们即将进入一个经济高速增长的时代，贫困和工资停滞是我们应该能够解决的问题。


    # 社会动荡


    无论机器人和工作岗位发生了什么，都不太可能发生动荡，因为社会动荡的代价远远大于防止其发生的代价。如果出现第一种可能性所设想的情况，我们都是利益共同体。但从逻辑上讲，要实现这一设想情境，还必须经历一个经济高速增长的时期。如果我们制造机器来做几乎所有的事情，只有当机器比工人更便宜、更好用时，才有可能实现。因此，如果我们所有人都因为机器而失业，那么按照逻辑，这将是一个国民生产总值飞速增长的世界。


    但有一个担忧。史蒂芬·霍金说得好：


    > 如果可以分享机器生产的财富，那么每个人都可以享受奢华的休闲生活，可如果机器所有者游说反对财富进行再分配成功，大多数人可能最终会陷入悲惨的贫困境地。


    可能会发生什么？如果世界分裂成两个阵营，一边是0.1%极端富有的机器拥有者，另一边是99.9%的人，这些人现在失业了，破产了，对整个悲惨的事态很不知所措怎么办？


    当富人听到“暴民”们第一次抱怨时，会发生什么？他们肯定了解足够多的历史，知道暴徒会惹是生非、急躁激进。毫无疑问，像法国人不久以前所做的那样，砍掉几个脑袋的渴望仍然潜伏在暴民心中，几乎不受到文明的制约。富人将知道他们没有国王的神圣权力来约束愤怒的暴民。


    因此，富人和有权有势的人有两种选择：贿赂或武力。在过去，他们要么用面包和马戏团收买穷人，要么用暴力镇压他们。你会怎么'
  - '[PAGE 129]


    做？还记得吗？这一切都是在数万亿美元新增财富的背景下发生的。你会试图冒险去镇压那99.9%的穷人吗？还是让富人接受福利国家(welfare state)[12]的扩张？


    我不认为理性的富人会选择“镇压”选项。毕竟，这99.9%的人也拥有求偿权。在民主国家，他们可以推选令货币贬值的领导人，这样就可以将财富从债权国转移到债务国。他们可以制定充公赋税(conisacatory
    taxes)，就像二战后的英国一样。他们可以贬低财富，这种力量尤其强大，因为在现代世界中，公众舆论是最强大的社会力量。


    因此，我不知道富人是如何一边避免“分享财富”，一边维持动荡发生的低概率。


    第二种可能性设想的情况怎么样呢？记住，那个世界就像大萧条时期一样，只是它是永久性的。然后会发生什么呢？


    大萧条可能是一个很好的比喻。这个时期各种各样的坏事发生了：犯罪率上升，卖淫率上升，营养不良率上升，自杀率上升，等等。但并没有大范围的动荡。那些害怕会发生社会动荡的人，他们的担心主要来自大量工作岗位的过快流失。虽然我们的农业人口从90%减少到2%，但这花了200年的时间。可是未来呢？我们会发生戏剧性的、闪电般快速的工作岗位流失吗？不太可能。在大萧条时期，美国的失业率在短短四年时间内从5%上升到20%。即使是那些最担心技术导致失业的人也不认为我们会在四年内失去15%的工作岗位。


    但如果我们真的有像大萧条那样的永久性失业怎么办？社会会做何反应？这和可能性一的答案相同，在可能性一中，社会动荡的代价远远大于避免社会动荡的代价。如果你回顾历史上的社会动乱时期，只有当没有足够的财富来平息它时，它才会成功发生。法国大革命时'
  - '[PAGE 130]


    期的君主政体被打破了。当俄罗斯公民起义时，俄罗斯一贫如洗。我们在这里谈论的所有失业都是源于财富的大幅增长，而不是财富的缺乏。问题的关键不是缺钱，而是资金分配不均匀。


    最后，如果第三种可能性发生，那么我们不会看到动乱，因为我们现在没有看到大范围的动乱。可能性三的情况就像现在的情况一样，只是我们都更富有了。


    # 普遍基本收入


    为什么穷人穷？叫我普林斯顿·皮特(Princeton Pete)吧，我主张他们很穷是因为他们没有钱。普遍基本收入(universal basic income，简称UBI)是解决这一问题的直接办法。顾名思义，这是每个人的最低保障收入。


    UBI是一个古老的概念，最近又流行起来。支持这一观点的人是一群同床异梦之人，他们很少达成一致意见，彼此都以怀疑的眼光看待对方。自由派人士认为，当前的政府扶贫项目体系本质上是有辱人格的，需要反复对无数官僚封地的小暴君们卑躬屈膝。支持这一项目体系的保守党人已经屈服于福利国家，但没有屈服于其错综复杂性，以及所有代价高昂的低效和冗余。甚至一些自由论者也喃喃地赞同说，这“至少不会扭曲边际激励[13]”(自由论者经常这样说，甚至在党会上也是如此)。


    让我们看看这个想法从何而来，它是如何运作的，以及它是否会实现。


    正如我所说，这是一个古老的想法。没有经过经济情况调查的经济性政府津贴，可以追溯到古罗马时期，任何愿意排队领取面包的公民都可以领取大量补贴面包。'
  - '[PAGE 131]


    反对UBI的声音同样由来已久。就在2000年以前，西塞罗(Cicero)[14]在为普布利厄斯·塞斯蒂乌斯(Publius Sestius)[15]辩护的演讲中说：


    盖乌斯·格拉古(Gaius Gracchus)[16]提出一项谷物法。人们很高兴，因为它不用劳动就能提供丰富的食物。然而，真正的善人却反对它，因为他们认为此举会引导群众从努力工作转向懒惰，他们会眼睁睁看着国库耗尽。


    在其现代的化身中，UBI的起源可以追溯到18世纪的哲学家，他们对此有两种不同的普遍观点。第一，没有人应该“谋生”，也就是说，没有人需要争取生存权。所有人都有生存的权利，无论他们能否在经济上养活自己。他们赚取收入的能力应该与他们生存的权利脱钩。这是基本人权的观点。


    另一种观点则完全不同，它与人权无关，而是与财产权有关。这种观点认为存在大量科学知识、社会制度和共同的惯例，如语言、金钱和法律，这些都应该被合法地视为人人共享。那些创造了一个新部件并赚了100万美元的人是利用这些共同拥有的资产赚了100万美元。事实上，可以认为几乎所有的财富都是由这些资产创造的，因此每个人对几乎所有的钱都有平等的所有权。对于那些正在推进这一进程的人来说，这无疑是一条便捷的思路。


    美国的开国元勋托马斯·潘恩(Thomas Paine)相信这两种观念的变体。他在1797年写的一本名为《土地正义论》(Agrarian Justice)的小册子中，提出了普遍收入的主张。这一主张的前提是，在我们作为狩猎采集者的自然状态下，地球是“人类的共同财产”。除此之外，水、空气和动物也是如此。但在此过程中，出现了一种财产制度，超过半数的人口不再拥有任何土地。他的解决方案是什么？他没有拒绝财产所有权本身；相反，他主张我们应该建立“一个国家基金，当每个人年满21岁时，应该从这个基金中得到总计15英镑的款项，作为每个人因为引入土地财产制度而遭受的自然继承物损失的部分补偿”。'
  - '[PAGE 132]


    UBI的想法从未完全受冷遇。巴克敏斯特·富勒(Buckminster Fuller) [17]非常坚决地表示支持：


    我们必须完全地摒弃貌似有理的观念——每个人都必须谋生……我们不断创造新工作都是因为这种错误的想法，即每个人都必须从事某种苦差事，因为马尔萨斯-达尔文主义(Malthusian-Darwinism)认为人必须工作证明自己有生存权。所以我们有检查“检查员”的检查员，和为了让“检查员”检查“检查员”而制造工具的人员。人们真正的工作应该是回到学校，在有人出现并告诉他们必须谋生之前，思考随便什么他们在思考的事项。


    到了 20 世纪 60 年代，当一份名为《三重革命》(The Triple Revolution)的备忘录提交给约翰逊(Johnson)总统时，美国似乎到了实现普遍基本收入的时候了。这份名单由包括诺贝尔奖得主、政治家、未来学家、历史学家、经济学家和技术专家在内的精英人士共同签署。报告称，在自动化程度不断提高的世界里，“掩盖一个历史性悖论变得越来越困难：在有足够的生产潜力满足美国每个人的需求的时候，相当大一部分人口靠最低收入(通常低于贫困线)生存”。


    报告最后呼吁建立UBI：


    在通常被认为是工作的地方……因此，我们敦促社会……做出无条件的承诺，作为一项权利，向每个人和每个家庭提供足够的收入。


    这份报告不止表明了经济匮乏的时代即将结束，还认为“公平分配”将取而代之成为一个新的经济问题。


    作为对备忘录的回应，约翰逊决定成立一个蓝带委员会(如果你决定设立一个委员会，不要搞红丝带或白丝带，直达蓝带)，并称其为“国家技术、自动化和经济进步委员会”(National
    Commission on Technology, Automation, and Economic Progress)。其任务是了解自动化对工作的影响，并提出政策建议，以减轻其有害影响。'
  md: '

    力的需求。将经济数据与机器人抢占劳动岗位联系起来存在两个问题。首先，无明显起伏的就业市场始于2000年，并持续了大约15年，在这期间我们经历了几次经济衰退、金融危机、贸易增长等等。目前还不清楚自动化是否是根本原因。其次，在美国，2015年的收入中位数的增长是有史以来最大的，超过300万人摆脱了贫困。


    最后，如果第三种可能性发生，就不会有失业的人。但这真的可能吗？随着机械化和自动化程度的提高，肯定会有一些人跟不上时代的步伐，最终有些人无法参与就业市场竞争，对吗？劳动参与率(the
    labor participation rate)，是经济活动人口(包括就业者和失业者)占劳动年龄人口的比率，是用来衡量人们参与经济活动状况的指标。


    不对。假设一个人只要没有受到身体或精神衰弱的折磨，就不会成为低技能的人。智商为90和智商为130的人在玩《危险边缘》的时候差距似乎很明显，但在现实中，从大格局来看，差别是微不足道的。这一观点是著名的波兰尼悖论(Polanyi
    paradox)[11]的基础。1966年，迈克尔·波兰尼(Michael Polanyi)提出，人类知识的广阔领域包括学习力和技艺，这些知识可能解放我们的意识。例如，想想烤蛋糕的所有步骤。把盘子拿出来，熔化黄油，打碎鸡蛋，搅拌面糊，在蛋糕上撒上糖霜，等等。事实上，任何人都可以不假思索做到这一切。但是人类的能力不仅在于做蛋糕，还在于我们都能做的其他10000件事，比如发现配偶心情不好、刷牙或骑自行车。我们都是巨大的能力仓库。但是因为一个人可以做10000件事，另一个人不但可以做那10000件事，并且还知道房地产规划，所以我们说第一个人的技能低，第二个人的技能高。但事实并非如此，因为他们都拥有99%或更多的相同技能。


    从计算机的角度看，医生和码头工人之间没有什么不同，他们都能够完成模式识别、理解社会背景以及归纳和演绎推理。此外，他们也能阐述自己的感觉，流利地说一门语言，转动门把手，系好自己的鞋带。船长向码头工人解释他的货物清单和医生向病人阐述他的病情并没有什么不同。


    另外，那些认为有人无法学习新的工作技能的观点，低估了人类的潜力。认为从事某种非技术工作的人已经达到了他能力的上限是完全不正确的。以我的经验，大多数人都觉得他们能做的比要求他们做的更多。如果有机会承担更具挑战性的工作，以换取更多的地位和金钱，大多数人倾向于接受挑战。人们想要有意义、有目标的生活，当然，如果能得到的话，他们还想要更高的工资。我们雇用一个人盖屋顶的唯一原因不是因为那个人只会盖屋顶，而是因为我们还没有发明一种机器来盖屋顶。因此，尽管盖屋顶的人可能有能力管理20名工人，并提出一个积极的创收计划，但屋顶需要铺瓦，而没有人制造出盖屋顶的机器来接替这个人。


    当90%的人务农时，剩余10%的人无疑会认为这90%的人没有其他能力。如果认为这90%的人可以成为实验室技术人员、市场总监和冰雕师，这种想法让那10%的人觉得荒诞可笑。他们会这样说：“这90%的人只是普通的农民。”


    但他们种田是因为我们需要农民，而不是因为他们只能做这些。我坚信，很大一部分劳动力需要从机器能做的苦差事中解放出来。


    想象一个以修剪草坪为生的人，让我们叫他杰瑞(Jerry)。杰瑞高中毕业，但没受过更多的教育。此外，假设有人开发了一种售价较低的自动割草机，而杰瑞突然发现割草机这个行业的利润已经跌到了谷底，他能做什么呢？


    记住，在可能性三的观点下，杰瑞实际能从事的工作有很多很多。杰瑞所要做的就是找到一种增加自我价值的方法。然后他就能得到一份工作。例如，杰瑞可能会在网上学习如何种植和维护葡萄藤。


    这不是一个很大的能力变化，对吧？我并不是说杰瑞会成为一名园艺家。他只是读了足够多的书来学习如何种植和培育葡萄。然后，他开始挨家挨户地宣传在家自己栽培葡萄的乐趣。见鬼，我会购买他的服务。


    然后，20年后，葡萄藤机器人公司推出了一种机器人，它可以种植比杰瑞更好的葡萄藤。那么杰瑞要如何应对呢？他可以阅读维多利亚时代的园林绿化书籍，然后，挨家挨户地游说，按照古老的方法和惯例，精准地种植灌木和花卉。但总有一天这份工作也会被机器人取代，但那时杰瑞已经退休了。


    有谁能说杰瑞“失业”呢？他是已知宇宙中最复杂、最全能的物体。


    ## 11 几个重大问题


    ## 收入不平等


    收入不平等怎么办？如果收入不平等，那前述三种可能性并无差别。但无论AI机器人是否替代所有的工作、部分工作或不会替代任何工作，收入不平等都将是一个日益严重的问题。让我们探索一下原因。


    “富人越来越富，穷人越来越穷”是老生常谈的论调之一。然而，数据似乎证明了这一点。两位意大利经济学家将1427年佛罗伦萨的税务记录与今天的税务记录进行了比较，发现当时最富有的家庭现在仍然是最富有的。在英国，使用同样的方法，其他经济学家发现，1170年的富人似乎仍然是今天的富人。但为什么会这样呢？一种普遍的看法是，富人控制着政府，并在社会上施加影响，从而能够在经济层面为自己谋取利益。


    第二种理论认为财富创造财富。在大富翁游戏中，通常每个玩家是从1500美元起步的。现在我们试试玩一个不同版本，让有些玩家从50美元开始，另外一些从5000美元开始。


    这两种对富人变得越来越富的解释很可能都是正确的，但在现代，有一些更重要的东西在起作用。富人能够调配更多的技术，从而能够更快地增加财富。工人吉尔(Jill)有了手机，是的，她的经济潜力增加了。老板简(Jane)给她的1000名员工中的每个人都下发了一个新的生产力管理软件，然后将提高了1000倍的生产力收入囊中。但要做到这一点，她首先必须有钱购买1000份软件。这就是在现代社会用财富产生更多财富的方式。


    此外，今天的技术可以极大地提高生产力，因此，投入很少的钱创造巨量的财富比以往任何时候都要容易，然后再利用这些财富创造更多的财富，生生不息。现在活着的亿万富翁比以往任何时候都多，而且他们中靠自己赚钱而不是继承遗产的比例还在继续上升。你怎么能在1000年前白手起家，然后不断创造出10亿美元的价值呢？但在过去十多年的时间里，谷歌创造了七位亿万富翁，脸书创造了六位。所以在现代，旧的财富得以保存，新的财富得以创造。仅仅这个简单的事实就加剧了收入不平等。但事情不仅如此。


    事实证明，新技术的经济效益对富人的帮助大于穷人。这是怎么回事？从技术中获得的经济收益有三种不同的分配方式，只有其中一种可以帮助穷人。


    首先，当技术被企业采用时，所有生产率的提高都会通过降低成本和提高利润率来推高公司股票的价值。因为在美国，70%的股票由20%的人持有，所以这一经济利益就落入了这20%的富人手中。与此同时，这些企业的工人以固定价格出售他们的劳动力，在经济上并不分享新技术带来的效率收益。如果你在零售巨头公司工作，它安装了一种新技术，可以在结账时更快地扫描商品价格，那么这家公司的成本就会降低，但小时工却不会因此而加薪。所以，技术能够而且经常能够提高企业利润而不提高工资。这就是为什么在收入保持不变的情况下股市可以上涨。


    其次，对于个体经营者或能够出售其产出(而不是按小时计算的劳动力)的人来说，他们能够获得技术带来的效率收益，因为他们可以说是自己公司的所有者。这些人大多属于中高收入阶层，包括律师、会计师和建筑师。他们能够有效利用技术来减少他们必须做的低价值单调乏味的工作，从而腾出时间来做更多高价值的工作。律师过去花费大量时间研究法律判例，如今可以在瞬间完成这一搜索，并以此收回数小时或数天的生产力，再将其卖到其他地方。


    最后，富人和穷人都受益于他们消费的商品的低成本和高质量。例如，所有的消费者都能买得起比上次大两倍的电视机，不是因为他们赚了更多的钱，而是因为电视机的价格没有随着电视机尺寸的增大而上涨。这是一个常见的现象：在15年的时间里，伴随生产效率的提高，价格降低，质量提高，T型车(Model
    T)的价格下降了近75%。这种实践今天还在继续，只是速度更快。


    当然，即使在最后一种情况中，富人受益也比穷人更多，因为他们消费得更多。但对穷人有好处并不是一件小事。以互联网为例。考虑一下这个问题：有人要付你多少钱才能让你不再使用互联网？假设你回答“100万美元”。在某种现实意义上讲，这意味着互联网对你来说价值100万美元。但是你可以从当地的宽带供应商那里以每月49.95美元的价格买到它。这对你来说是巨大的利润!我们的现代技术确实提高了几乎每个人的生活水平。如今，一个拥有智能手机的人可以获得比10年前地球上任何人更多的信息，而且拥有比20年前大多数人更好的相机。智能手机的通信能力还会让几年前的国家元首和军队首脑羡慕不已。事实上，它们的计算能力比1950年地球上存在的任何东西都要强。这只是一个很小的便携设备，你可以通过一个为期两年的合同免费获得。除此之外，还有其他10000种技术可以改善我们所有人的生活，从抗生素到止汗剂再到防抱死刹车，这样的技术数不胜数。因此，科技对我们所有人的生活质量和经济生活水平都大有裨益。


    这三种机制全都讲的是技术生产率的提高如何直接惠及高收入人群，而只间接地帮助低收入人群。这并不是某种阴谋，而是事情的发展方式就是如此，也是技术需要投资，投资需要财富这一事实的结果。所以这就是技术进步如何在政策没有变化的情况下加剧收入不平等的原因，更多的技术只会导致更多的不平等。


    另一个进一步加剧经济不平等的因素是，目前技术投资的回报超过了劳动力投资的回报。换言之，如果你是一名企业主，准备用1000美元投资你的企业，总的来说，你把钱投资在新技术上会比把这1000块钱花费在支付员工加班费上赚得更多。有许多政策举措可以抵消“劳动力投资回报低”这一影响，包括通过培训提高工人生产率，减少劳动所得税，从而降低劳动力价格，以及取消鼓励资本投资于技术而非劳动力的人为低利率。


    一定会有人问，收入不平等是否真的是我们应该关注的问题，为什么不去关心诸如“非富人的绝对收入”呢？技术让一些人比以前更容易创造数10亿美元的财富，这本身并不是一件坏事。穷人的收入翻一番，富人的收入翻三倍，这加剧了不平等。但如果有人提出让穷人的收入翻番，我猜穷人会欣然接受。在我看来，美国的收入中位数持平而国民生产总值却在上升，这才是真正的问题所在。世界上最富有的人之一沃伦·巴菲特(Warren
    Buffett)是这样总结的：


    > 富人做得非常好，企业做得也很好，利润率与历史水平相比非常高，但对于占总人口20%的最底层的2400万人来说，最高年收入只有2.2万美元。我们还没有学会如何让每个人分享我们所拥有的财富。


    好消息是，考虑到我们即将进入一个经济高速增长的时代，贫困和工资停滞是我们应该能够解决的问题。


    ## 社会动荡


    无论机器人和工作岗位发生了什么，都不太可能发生动荡，因为社会动荡的代价远远大于防止其发生的代价。如果出现第一种可能性所设想的情况，我们都是利益共同体。但从逻辑上讲，要实现这一设想情境，还必须经历一个经济高速增长的时期。如果我们制造机器来做几乎所有的事情，只有当机器比工人更便宜、更好用时，才有可能实现。因此，如果我们所有人都因为机器而失业，那么按照逻辑，这将是一个国民生产总值飞速增长的世界。


    但有一个担忧。史蒂芬·霍金说得好：


    > 如果可以分享机器生产的财富，那么每个人都可以享受奢华的休闲生活，可如果机器所有者游说反对财富进行再分配成功，大多数人可能最终会陷入悲惨的贫困境地。


    可能会发生什么？如果世界分裂成两个阵营，一边是0.1%极端富有的机器拥有者，另一边是99.9%的人，这些人现在失业了，破产了，对整个悲惨的事态很不知所措怎么办？


    当富人听到“暴民”们第一次抱怨时，会发生什么？他们肯定了解足够多的历史，知道暴徒会惹是生非、急躁激进。毫无疑问，像法国人不久以前所做的那样，砍掉几个脑袋的渴望仍然潜伏在暴民心中，几乎不受到文明的制约。富人将知道他们没有国王的神圣权力来约束愤怒的暴民。


    因此，富人和有权有势的人有两种选择：贿赂或武力。在过去，他们要么用面包和马戏团收买穷人，要么用暴力镇压他们。你会怎么做？还记得吗？这一切都是在数万亿美元新增财富的背景下发生的。你会试图冒险去镇压那99.9%的穷人吗？还是让富人接受福利国家(welfare
    state)[12]的扩张？


    我不认为理性的富人会选择“镇压”选项。毕竟，这99.9%的人也拥有求偿权。在民主国家，他们可以推选令货币贬值的领导人，这样就可以将财富从债权国转移到债务国。他们可以制定充公赋税(confiscatory
    taxes)，就像二战后的英国一样。他们可以贬低财富，这种力量尤其强大，因为在现代世界中，公众舆论是最强大的社会力量。


    因此，我不知道富人是如何一边避免“分享财富”，一边维持动荡发生的低概率。


    第二种可能性设想的情况怎么样呢？记住，那个世界就像大萧条时期一样，只是它是永久性的。然后会发生什么呢？


    大萧条可能是一个很好的比喻。这个时期各种各样的坏事发生了：犯罪率上升，卖淫率上升，营养不良率上升，自杀率上升，等等。但并没有大范围的动荡。那些害怕会发生社会动荡的人，他们的担心主要来自大量工作岗位的过快流失。虽然我们的农业人口从90%减少到2%，但这花了200年的时间。可是未来呢？我们会发生戏剧性的、闪电般快速的工作岗位流失吗？不太可能。在大萧条时期，美国的失业率在短短四年时间内从5%上升到20%。即使是那些最担心技术导致失业的人也不认为我们会在四年内失去15%的工作岗位。


    但如果我们真的有像大萧条那样的永久性失业怎么办？社会会做何反应？这和可能性一的答案相同，在可能性一中，社会动荡的代价远远大于避免社会动荡的代价。如果你回顾历史上的社会动乱时期，只有当没有足够的财富来平息它时，它才会成功发生。法国大革命时期的君主政体被打破了。当俄罗斯公民起义时，俄罗斯一贫如洗。我们在这里谈论的所有失业都是源于财富的大幅增长，而不是财富的缺乏。问题的关键不是缺钱，而是资金分配不均匀。


    最后，如果第三种可能性发生，那么我们不会看到动乱，因为我们现在没有看到大范围的动乱。可能性三的情况就像现在的情况一样，只是我们都更富有了。


    ## 普遍基本收入


    为什么穷人穷？叫我普林斯顿·皮特(Princeton Pete)吧，我主张他们很穷是因为他们没有钱。普遍基本收入(universal basic income，简称UBI)是解决这一问题的直接办法。顾名思义，这是每个人的最低保障收入。


    UBI是一个古老的概念，最近又流行起来。支持这一观点的人是一群同床异梦之人，他们很少达成一致意见，彼此都以怀疑的眼光看待对方。自由派人士认为，当前的政府扶贫项目体系本质上是有辱人格的，需要反复对无数官僚封地的小暴君们卑躬屈膝。支持这一项目体系的保守党人已经屈服于福利国家，但没有屈服于其错综复杂性，以及所有代价高昂的低效和冗余。甚至一些自由论者也喃喃地赞同说，这“至少不会扭曲边际激励[13]”(自由论者经常这样说，甚至在党会上也是如此)。


    让我们看看这个想法从何而来，它是如何运作的，以及它是否会实现。


    正如我所说，这是一个古老的想法。没有经过经济情况调查的经济性政府津贴，可以追溯到古罗马时期，任何愿意排队领取面包的公民都可以领取大量补贴面包。


    反对UBI的声音同样由来已久。就在2000年以前，西塞罗(Cicero)[14]在为普布利厄斯·塞斯蒂乌斯(Publius Sestius)[15]辩护的演讲中说：


    盖乌斯·格拉古(Gaius Gracchus)[16]提出一项谷物法。人们很高兴，因为它不用劳动就能提供丰富的食物。然而，真正的善人却反对它，因为他们认为此举会引导群众从努力工作转向懒惰，他们会眼睁睁看着国库耗尽。


    在其现代的化身中，UBI的起源可以追溯到18世纪的哲学家，他们对此有两种不同的普遍观点。第一，没有人应该“谋生”，也就是说，没有人需要争取生存权。所有人都有生存的权利，无论他们能否在经济上养活自己。他们赚取收入的能力应该与他们生存的权利脱钩。这是基本人权的观点。


    另一种观点则完全不同，它与人权无关，而是与财产权有关。这种观点认为存在大量科学知识、社会制度和共同的惯例，如语言、金钱和法律，这些都应该被合法地视为人人共享。那些创造了一个新部件并赚了100万美元的人是利用这些共同拥有的资产赚了100万美元。事实上，可以认为几乎所有的财富都是由这些资产创造的，因此每个人对几乎所有的钱都有平等的所有权。对于那些正在推进这一进程的人来说，这无疑是一条便捷的思路。


    美国的开国元勋托马斯·潘恩(Thomas Paine)相信这两种观念的变体。他在1797年写的一本名为《土地正义论》(Agrarian Justice)的小册子中，提出了普遍收入的主张。这一主张的前提是，在我们作为狩猎采集者的自然状态下，地球是“人类的共同财产”。除此之外，水、空气和动物也是如此。但在此过程中，出现了一种财产制度，超过半数的人口不再拥有任何土地。他的解决方案是什么？他没有拒绝财产所有权本身；相反，他主张我们应该建立“一个国家基金，当每个人年满21岁时，应该从这个基金中得到总计15英镑的款项，作为每个人因为引入土地财产制度而遭受的自然继承物损失的部分补偿”。


    UBI的想法从未完全受冷遇。巴克敏斯特·富勒(Buckminster Fuller)[17]非常坚决地表示支持：


    我们必须完全地摒弃貌似有理的观念——每个人都必须谋生……我们不断创造新工作都是因为这种错误的想法，即每个人都必须从事某种苦差事，因为马尔萨斯-达尔文主义(Malthusian-Darwinism)认为人必须工作证明自己有生存权。所以我们有检查“检查员”的检查员，和为了让“检查员”检查“检查员”而制造工具的人员。人们真正的工作应该是回到学校，在有人出现并告诉他们必须谋生之前，思考随便什么他们在思考的事项。


    到了20世纪60年代，当一份名为《三重革命》(The Triple Revolution)的备忘录提交给约翰逊(Johnson)总统时，美国似乎到了实现普遍基本收入的时候了。这份名单由包括诺贝尔奖得主、政治家、未来学家、历史学家、经济学家和技术专家在内的精英人士共同签署。报告称，在自动化程度不断提高的世界里，“掩盖一个历史性悖论变得越来越困难：在有足够的生产潜力满足美国每个人的需求的时候，相当大一部分人口靠最低收入(通常低于贫困线)生存”。


    报告最后呼吁建立UBI：


    在通常被认为是工作的地方……因此，我们敦促社会……做出无条件的承诺，作为一项权利，向每个人和每个家庭提供足够的收入。


    这份报告不止表明了经济匮乏的时代即将结束，还认为“公平分配”将取而代之成为一个新的经济问题。


    作为对备忘录的回应，约翰逊决定成立一个蓝带委员会(如果你决定设立一个委员会，不要搞红丝带或白丝带，直达蓝带)，并称其为“国家技术、自动化和经济进步委员会”(National
    Commission on Technology, Automation, and Economic Progress)。其任务是了解自动化对工作的影响，并提出政策建议，以减轻其有害影响。

