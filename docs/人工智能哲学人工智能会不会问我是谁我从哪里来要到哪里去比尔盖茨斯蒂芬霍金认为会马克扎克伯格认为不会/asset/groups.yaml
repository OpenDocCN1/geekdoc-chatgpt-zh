- raw:
  - '[PAGE 212]


    的海洋盐度，等等。各种各样的事物都被保持在地球“适合”的范围内，以利于生命的栖息，尽管不一定是有利于人类的生命。


    让我们更深入地探讨一下这个理论。在前一章中，我们讨论了你的身体是如何由不知道你存在的细胞构成的。一个“你”从所有的细胞中涌现而生。同样地，地球上的这200
    000兆(即2后面跟着17个0)动物能产生一种涌现的实体吗？它生存、思考、感受，以我们感知自身细胞的方式来感知我们？地球真的能有意识吗？


    盖亚假说很有趣，因为这里适用的问题和我们在讨论计算机时要解决的问题是一样的。如果地球是有意识的，我们怎么知道？它能感觉到疼痛吗？它有情感吗？它会怎么看待我们？


    说到太阳呢？它是有意识的吗？它所显示的复杂活动与人脑并非完全不同。当然，在古代，它是人格化的，即使在今天，孩子们在幼儿园画户外场景时也总是给太阳画一个笑脸。


    意识的最后一个候选者是互联网本身。当就这个问题向艾伦脑科学研究所(Allen Institute for Brain Science)的克里斯托弗·科赫(Christof
    Koch)提问时，他表示自己接受这样的想法：


    从整体上看，互联网上大约有1019个晶体管，相当于10 000人大脑中的突触数量总和……无论今天的互联网本身是否有某种知觉，都完全是推测性的。不过，这当然也是可以想象的。


    有关互联网有意识的想法虽然牵强附会，但却令人着迷。当生物学家J. B. S.霍尔丹(J. B. S. Haldane)被问及通过对自然的研究，他能推断出关于上帝的什么信息时，据说他的回答是，上帝似乎“对甲虫有着过度的偏爱”。同样，如果互联网实际上是有意识的，它似乎对猫有着过分的偏爱。'
  - '[PAGE 213]


    所以我们在没有很多明确答案的情况下，结束关于谁是有意识的调查。人类可能是这个星球上唯一知道体验是什么的物种。或者几乎在所有的事情上都是如此，人类是唯一的体验者。对我们来说，在很大程度上，“无知”是一件非常重要的事情。我们生活的世界，可能用第一人称视角看，万物都是生机勃勃的。一棵树可能会在迎接新的一天时意识到，它喜欢阳光照射在树叶上的感觉。又或者，我们可能生活在一个“事物有反应但没有体验”的世界中。当你睡着的时候，如果有人挠你的脚趾，你的反应是把脚趾缩起来。如果有人把蜡烛举得离你的脚趾太近，你就把脚移开。你感觉到了，你做出了反应，但你没有体验到。那种感觉，那种活着的感觉，正是我们所好奇的。


    那么有意识的计算机拥有权利吗？根据几乎所有的定义判断，一台有意识的计算机是活的。很难想象什么东西既有意识却没有生命。我也无法设想，我们可以把一片草叶看作是有生命的，却仍然把一个有自知和自我意识的实体归类为无生命的。唯一的例外是对生命的一种定义中，要求生命必须是有机的，但这未免武断，因为这与事物的先天特征无关，而仅仅与它的构成有关。


    当然，我们可能很难理解这种异态生命形式。机器的意识可能是虚无缥缈的，只是偶尔一瞬间涌现的模糊认知。或者它可能是很激烈的，以我们无法理解的速度运行。如果通过接入互联网和所有与之相连的设备，有意识的机器不断地体验一切，那会怎样？想象一下，假如它可以同时通过每一个摄像头，感知到我们的存在。我们怎样才能理解这样一个实体，又或者说，它怎样理解人类？如果它能够理解我们，它会把我们看作是同类吗？如果答案是肯定的，那么它“关掉”我们就会像我们报废一台旧笔记本电脑那样，可能不会令它产生过多道德上的顾虑。'
  - '[PAGE 214]


    这种新生命形式会拥有权利吗？这是一个复杂的问题，取决于你认为权利从何而来。让我们考虑一下。


    用尼采的学说总能很好地开启这个观点。他认为你只拥有你能够享有的权利。人们要求我们拥有权利，是因为我们能够强制执行它们。不能说牛有生命权，因为人类吃它们。计算机将拥有它们可以依法享有的权利。它们也许能夺取想要的一切。可能不是我们决定给予它们权利，而是它们在没有我们任何输入的情况下索求一整套权利。


    有关权利的第二个理论是，它们是由共识创造的。美国人有言论自由的权利，因为我们作为一个国家，集体决定同意并实施了这项权利。在这种观点下，权利只能在我们能够强制执行的范围内存在。而在此范围内，我们决定赋予计算机什么权利？它可能是生命权、自由权和自决权。人们可以很容易地想象出计算机权利法案。


    另一种权利理论则认为，权利中至少有一些是不可剥夺的。无论我们承认与否，它们都是存在的，不基于武力也不基于共识。美国《独立宣言》(The American Declaration
    of Independence)说：生命权、自由权和追求幸福的权利是不可剥夺的。顺便说一句，不可剥夺的权利是如此根本，你不能宣称放弃它们。它们和你密不可分。你不能出卖或给予他人杀害你的权利，因为生命权是一项不可剥夺的权利。这种基本权利观认为，它们不可剥夺的特性来自外部，比如上帝、自然，或者对于人类来说在某种程度上是根本的东西。如果是这种情况，那么我们不能决定计算机是否有权利。因为这既不取决于计算机，也不取决于我们。


    毫无疑问，计算机权利运动将映射出动物权利运动的情况。而动物权利运动采取了渐进主义的策略，即朝着更大的目标争取一系列小的进步。如果事实如此，那么也就不会有一个分水岭时刻，能让计算'
  - '[PAGE 215]


    机在突然之间被承认拥有基本权利——当然，除非一台有意识的计算机有能力要求这些权利。


    有意识的电脑会成为道德代理人吗？也就是说，它是否有分辨是非的能力，并因此对自己的行为负责？这个问题很难回答，因为我们可以设想一个不理解我们道德观念的自知实体。我们不认为发狂并开始撕咬每个人的狗的行为是不道德的，因为狗不是道德的代理人。然而我们可能还是会把狗杀死。“有意识的计算机做出一些我们认为不道德的事情”是一个很难开启的概念，人们想知道，如果有意识的计算机从事道德败坏的事情，我们是否会拔掉它的插头，或试图修复它。如果有意识的计算机是一个道德代理人，那么我们将开始改变描述机器时使用的词汇。突然间，它们可以是高尚的、粗俗的、开明的、有道德的、有灵性的、堕落的或邪恶的。


    一些人会认为有意识的机器是有灵魂的吗？当然会。动物就被认为有灵魂，一些人还认为树也有灵魂。


    在所有这类问题上，作为一个物种，我们很可能不会在许多观点上达成集体共识，或者，如果我们最终可以达成共识，那也需要很长一段时间，远远超过创造这项技术本身所需的时间。这最终让我们想到一个问题：“计算机能够变得有意识吗？”


    # 19 意识的八种理论：计算机能变得有意识吗


    现在，我们准备解决这个关键问题。换言之，未来的计算机是一件物品还是一个生物？它是只存在于这个世界上，还是在体验这个世界？它是否既具有自知，又能够反思这种自知？1997年，当世界象棋'
  - '[PAGE 216]


    冠军加里·卡斯帕罗夫(Garry Kasparov)被IBM的深蓝计算机(Deep Blue computer)击败时，卡斯帕罗夫安慰自己说：“好吧，至少它没有享受胜利。”那么未来的计算机会享受胜利吗，甚至夹杂着点幸灾乐祸？


    在某种层面看，关于“有意识的计算机”的想法似乎很奇怪。计算机的内存就是一堆晶体管，其中一些开，还有一些关。计算机处理器所要做的就是执行一系列存储指令。这怎么可能从“计算”变成“思考”呢？但是那些相信“有意识的机器是可能的”人指出，大脑也可以用一种简化的方式来描述，这似乎并没有妨碍意识的产生。


    但仅基于一个数据点预测事物，存在一个固有的挑战。我们所知道的唯一有意识的东西，毫无疑问就是我们自己。这使得我们更难弄清楚是什么让我们有意识。其他行星上的生命问题也发现了类似的困惑。宇宙中行星的数量是多少并不重要，因为我们并不知道有多少种生命形成的可能性。我们只有一个数据点。


    对于机器意识有两种截然不同的解决途径。一个很简单明了的，如果你可以把它称为命题，这个命题的内容即机器总有一天会迎来“质变时刻”，并获得意识。这也是当我们提出“机器能有意识吗？”这个问题时，我们通常认为的答案。但还有第二条路径，涉及到提取我们的意识，然后上传至计算机。


    将我们的核心本质，我们的自我，上传至一台机器，其优势显而易见。这简直是天作之合。我们有意识，有激情，有生活的乐趣。机器可以直接连接到互联网，拥有超高速处理器和完美的存储，我们能勾搭上吗？


    山姆·奥尔特曼(Sam Altman)认为这就是出路：


    “结合”是我们最好的方案。任何没有结合的版本都会出现冲突：或者我们奴役AI，或者它奴役我们。完全无保留的结合形式是，我们把大脑上传到数据云端。我很乐意这样'
  - '[PAGE 217]


    做。我们需要提升人类的水平，因为我们的后代要么征服银河系，要么永远消灭宇宙中存在的意识。多么值得憧憬的时代啊，真想活着看到那天！


    詹姆斯·洛夫洛克(James Lovelock)阐述了我们之前探讨过的盖亚假说，他也支持“结合”策略：


    我认为就像地球上所有的生物一样，我们人类的寿命是有限的。如果我们能以某种方式与我们的电子创造物在一个更大的内共生(endosymbiosis)[5]中结合，它可能为人类和“盖亚”的进化提供更好的前景。


    与机器结合可以被认为类似于不同君主国后代之间的联姻，这是确保和平的一种手段。纵观历史，通过后代联姻的方式，这种血脉交融和各派系之间的利益融合，有时是促进和平与稳定的一种力量。我之所以说“有时”，是因为历史上有很多例外，比如第一次世界大战爆发时，希腊、罗马尼亚、丹麦、挪威、德国、俄罗斯、西班牙和联合王国(由英格兰、苏格兰、威尔士和北爱尔兰组成的政治实体)的君主都是英国维多利亚女王的孙辈，这些国家却都参与了那场战争。


    如果人类意识与机器意识的结合成为可能，会有成群结队的人迫不及待地在街上排起长队，就像他们为iPhone发布会所做的那样。在你所能想象的任何虚拟世界中，永生都是一个相当强大的诱惑。但也有反乌托邦的场景。理论上，一个施虐狂或AGI可以控制你的虚拟世界，难以置信地折磨你长达100万年。这绝对是商业中所谓的“下行情况”。


    支持者认为，这就是我们的未来，也许还是我们不太遥远的未来。从环境恶化到收入不平等，再到医疗成本的上涨，它就是解决这些问题的灵丹妙药。让我们放弃我们的身体，进入某种隔间，你的身体在里面被扫描，被上传到机器里，然后身体被销毁。然而，你的体验应该只是先走进隔间，再走出去。那些认为这可能的人会争辩说，'
  - '[PAGE 218]


    你甚至不会注意到发生了什么，当然，你会意识到自己拥有超人的力量，并且对异性有了莫名的吸引力。


    从某种意义上说，支持者是对的。在一台只需要一点点能量就能运转的计算机里，可以保存上万亿个人的数据，直到宇宙变冷直至消亡。那台计算机的复制品，以及每个人的意识，都可以被发射到太空，去探索星系之间的无限虚空，去奔跑，无拘无束，直到永远。这当然是有效率的。


    整个过程中有很多未知因素。没有人知道需要收集多少数据才能把你复制到电脑里。它仅仅是关于每个神经元和每个突触性质的一些数据吗？还是我们必须深入每个神经元数十亿次，收集构成每个神经元的无数分子的数据？我说“无数”是因为科学家们根本不知道大脑中有多少分子，更不用说明子的数量了。此外，可能还有其他重要的“数据”与大脑的状态或大脑中发生的大量化学反应有关。正因为如此，估算初的大脑建模所需的计算量之间相差了万亿倍。在这方面，有点像对“何时能构建出能运行的AIG”的估算，估算的时间跨度从5到500年不等。


    即使你能弄清楚如何为大脑建模，仍然面临着“如何把大脑中的所有数据都输入CPU”的问题。也就是扫描的问题。理论上，有三种方法可以做到这一点。


    第一种方法是建立一个基于外部成像的大脑模型。从比例上讲，这就好比在不进入帝国大厦的情况下，完整复制帝国大厦的建筑及其内，甚至囊括每个单独的回形针和图钉。而如果我们需要分子水平的分辨率，这在数学上就相当于在不进入建筑物内部的情况下，精确地复制建筑物内的每一粒灰尘。另外，考虑到建模关键不仅仅在于大脑的组成，更在于大脑的活动，想象一下，在帝国大厦有一股巨大的龙'
  - '[PAGE 219]


    卷风吹动着周围的一切，其速度是有史以来最快龙卷风的200倍，这就是你大脑中活动发生的速度。


    第二种选择是，你可以将大脑冷冻起来，然后逐个神经元地把它拆解，在这个过程中记录下数据。又或者更坏的情况是，也许你不得不一次性把它分解到分子程度，这是一项几乎难以想象的复杂任务。但如果可以做到呢？你愿意做吗？你睡着了，身体被冻住了，大脑被逐个神经元地分解，数据被记录在计算机模型中。当模型被激活时，计算机说：“我真的希望这能行得通。等一下。哦，天哪！我现在在机器里吗？哦，我的天啊，不敢相信它真的做到了。”


    最后一个办法是，也许可以制造原子标度的机器人，纳米机器人(nanites)在你的大脑中爬行，绘制出整个运作过程。标度问题再次出现了。神经元，分子还是原子？大脑中有1000亿个神经元，所以计算它们的数量并非易事。而且，每个神经元又是由300万亿个原子组成的，局面与之前完全不同。


    如果这些技术都实现了，你得到了相关的数据，然后把它上传至计算机，你到底有什么？还是原来的你吗？或者只是你的复制品？仿真品？这是三件完全不同的事物。


    所以这就是通往机器意识的两条路。第一条是机器本身获得了意识；第二条是机器只不过是我们上传意识的容器。这两种可能的情况都会发生吗？在这两种情况下，答案完全取决于意识是如何产生的。


    这听起来可能像一个死胡同，因为我已经多次说过我们不知道这个问题的答案。然而，尽管我们不知道意识是如何产生的，但有很多理论。我们可以把它们分成八组，每一组都是一个广义的理论。然后，我们可以检验这八种理论，看看根据这一理论，机器是否可以变得有意识，我们是否可以把我们的意识上传到机器上。'
