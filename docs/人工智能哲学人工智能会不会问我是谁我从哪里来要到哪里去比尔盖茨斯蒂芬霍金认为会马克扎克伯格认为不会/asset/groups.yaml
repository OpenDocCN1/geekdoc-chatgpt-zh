    # 人类的心灵


    大脑和心灵的区别是什么？大脑是一个由3磅黏性物质组成的器官，以机械的方式运作。心灵是你能做的所有心理层面的事情，看起来比这个黏糊糊的东西可能做成的事要困难得多。心灵是情感、想象力、判断力、智力、决断力和意志力的源泉。音乐之所以能够触发你的抑郁，全因心灵的存在，正是心灵使我们能够畅想未来。


    想想吧，一个器官怎么会有创造力呢？3磅的人体组织怎么会坠入爱河？单纯的神经元怎么会认为某件事很有趣呢？


    心灵的概念已经渗透到我们的日常语言中，并被每个人所使用。我们问人们是否疯了(out of their mind)，我们寻求内心的平静(seek peace
    of mind)，我们告诉人们我们在想什么(what''s on our mind)。我们被告知英雄所见略同(great minds think alike)。我们可能对某件事犹豫不决(of
    two minds)，或者相反，我们也会认死理(one-track mind)。人们心智健全(of sound mind)，事情可以让你心醉神迷(blow
    your mind)，你可以下定决心(make up your mind)。关于心灵，还有数百种更通俗的俗语，如果用“大脑(brain)”这个词来代替，它们的意思似乎都不太一样。


    然而，当人们援引心灵这个概念时，他们要表达的意思是非常不同的。回到我们的基本问题，如果你是一元论者或者你相信人是机器，你可能会说：“心灵只是一个笼统的短语，用来描述大脑所做的那些我们并不真正理解的事情。但是大脑所做的一切只是正常的心理过'
  - '[PAGE 152]


    程。心灵可能是大脑的一个涌现性，但即使如此，它也只是简单的生物学问题。”


    二元论者或相信人类不仅仅是机器的人可能会说：“心灵就是你。它存在于物理定律之外。它可能是由大脑创造的，但它与单纯的器官功能完全不同。你永远无法把它变成一个化学公式，因为它本质上就不是物质的。”


    AGI可以绕开混沌的心灵概念而建立吗？不可以，因为很遗憾，“心灵”使得构建AGI变得更加困难。根据定义，AGI必须比动物王国里的任何生物都聪明得多。如果你做了一个像最聪明的海豚一样聪明的计算机海豚AI，没有人会称它为AGI。想想电影《我，机器人》(I,
    Robot)中的对话，威尔·史密斯(Will Smith)饰演的警探史普纳(Detective Spooner)正在审问一个名叫桑尼(Sonny)的机器人：


    > 史普纳警探：机器人能编写交响乐吗？机器人能在画布上画出美丽的画吗？

    > 桑尼反问：你能吗？


    写交响乐和画漂亮画的能力肯定来自心灵，不管它是什么，我们希望AGI能够做到这两件事，因为要成为真正的通用智能，它必须具有人类水平的认知能力。所以必须正视心灵的作用。


    那么，心灵是如何产生的呢？心灵有一个特性，它是你头脑中的声音，是那个内在的“你”，观察着世事变化。单凭大脑怎么可能做到呢？毕竟，线虫也有大脑，但它302个神经元中是否能对世界产生动态的连续评论是值得怀疑的。因为不管那个声音是什么，也不管心灵是什么，那个声音是心灵的一个方面。如果你还记得，这是我们最基本的问题之一：“你的‘自我’是什么？”


    正如你们可能记得的，对于自我，有三种可能的解释，由此延伸到心灵。'
  - '[PAGE 153]


    首先，你的自我在大脑的一个把戏。提醒一下，这个把戏是说，大脑如何将感官体验结合成一个集成流，以及当大脑的不同部分想表达自己的时候，是怎么“掌握发言权”的。对于心灵是什么，这个观点认为，你没有心灵，本身只有一个大脑，所有我们不了解的能力，比如创造力和情感，只是正常的大脑功能。


    第二种选择是，你的“自我”是大脑的一种涌现属性。难道心灵就是这样吗？你可能还记得，涌现是指事物的整体呈现出某一个体所没有的特性和能力。早些时候，我提到了蚁群。即使蚂蚁个体都不聪明，蚁群也表现出聪明的行为。单看细胞的任何部分都不是活的，但是整个细胞却是活的。在这种观点下，大脑是由1000亿个神经元的所有活动以某种方式创造出来的。确切地讲，还不明确涌现是如何在物理系统中发生的，所以“心灵是大脑的一种涌现属性”的说法，只是把这个问题又抛给了另一个问题。尽管如此，这也是一种关于心灵之源的普遍信念。


    “自我”的最后一个解释是，它是你的灵魂，是你存在于物理定律之外的一个部分。你的心灵可能是你身体的非实体部分，在你的肉体死亡后，它有可能存活下来。从这个观点来看，情绪、创造力以及心灵的所有属性都不是数十亿神经元活动的产物，而是灵魂的某些方面。这就解释了为什么科学很难理解这些能力。


    如果这三个观点中的第一个是正确的，那么创建AGI成功的可能性就非常高。随着时间的推移，心灵将被揭开神秘的面纱，计算机将能够以这样或那样的方式复制心灵的能力。如果第二个选项是正确的，那么通往AGI的道路就有点棘手了，因为我们也许需要以某种方式在机器中制造涌现现象。鉴于我们对涌现现象的理解，很难确定我们是否能够机械地再现它，但鉴于它是一种物理现象，结果还是很乐'
