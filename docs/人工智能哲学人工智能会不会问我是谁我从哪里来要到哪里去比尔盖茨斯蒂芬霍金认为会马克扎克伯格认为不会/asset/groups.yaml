    source movement)，在这场运动中，大量的程序员会与他人自由共享他们编写的代码。没有人察觉知识共享和其他权利结构的兴起，其允许人们自由地分享他们所创作的东西。没有人预见到维基百科，在那里人们不仅无偿工作，而且还匿名。


    那么，进步还会继续吗？当然，只要技术进步，因为这就是生产力提高的原因。纵观人类历史，按照净计算，我们已经利用我们不断提高的生产力改善了世界。10 000年来，善已经战胜了恶。


