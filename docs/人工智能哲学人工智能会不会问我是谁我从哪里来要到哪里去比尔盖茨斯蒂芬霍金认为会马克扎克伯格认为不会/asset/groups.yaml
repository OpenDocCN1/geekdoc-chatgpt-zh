  - '[PAGE 201]


    下本该你来写的备忘录，谁会发觉呢？然而，由于某种未知的原因，我们不是机器人，而是更奇妙的东西。


    意识和感知能力是两码事。一个构造简单的生命受伤时可能会表现出所有的疼痛迹象，但它的大脑中没有就此产生诸如“我到底做了什么，才会遭受这种痛苦？”这种持续的心理对话。感知能力有时被认为是意识的最低层次，因为在一个有感知能力的生物中，至少有一个“我”正在经历一些事情。那些在我们的基本问题中将自己定义为机器或动物的人，更有可能以一个连续体(continuum)的观点来看待意识，在这个连续体中，我们只是比动物拥有更多或者可能多得多的意识。那些认为人类与动物在本质上不同的人，大概会把人类意识视为“与众不同的事物”。


    意识也不同于智能。智能是关于推理的；而意识是体验的感觉。例如，你可能有过这样的经历，当你开车的时候，你心不在焉，陷入沉思，但不知何故，你成功地在红灯前停下，融入车流。然后突然你回过神来，想：“哦，我的天哪。我怎么开了这么远的车，完全想不起来了。”以上就是一个有智能而没有意识的案例。这两种状态的不同之处就是争论的焦点。


    我们远远没有理解“意识产生的原因”。我为什么这么说？因为意识是一种无法衡量的现象。在我们为什么拥有它或为什么需要它的问题上没有一致的意见。我们甚至不知道“意识是如何产生的”这个问题的答案是什么？对于一个连怎么提问都不清楚的问题，我们又如何回答呢？


    我们同样不知道为什么会产生意识。在前面的例子中，你走神的时候开车可能和你集中精神时开得一样好，那么为什么我们需要意识呢？有很多说法，比如意识是一种机制，让我们能轻松改变焦点，但这些说法都是猜测。也许意识就蕴含在我们头脑预测不同场景的能力'
  - '[PAGE 202]


    中。蛇只能像蛇一样行动，负鼠只能像负鼠一样行动。但人类可以观察动物和彼此，并从中学习，然后想象在某种情况下可采取的多种行动过程。该技能不是意识，但意识可能是它的一种附加特性，是对这种技能的必然要求。也许我们需要头脑中持续的声音来告诉自己：“好吧，如果我爬到那山上从没有人去过的地方，也许灌木丛里有很多浆果。它们尝起来一定非常美味！”当然这也是猜测。


    另一种理论认为，意识的产生是由于我们作为一个物种的竞争天性。如果你可以进入一个人的大脑，知道他大概在想什么，那么和他的竞争就会更容易。因此，“换位思考”的整个过程发展成了意识。另一些人则认为恰恰相反，意识的产生是因为我们彼此合作。要像我们这样齐心协力地工作，需要的不仅仅是语言。它包括对更大的目标和你在其中所扮演角色的理解。毕竟，意识使我们能够更好地互相传递信号。例如，“如果我指向那头猛犸象，奥格(Og，人名)将迅速会意，发现它正朝他撞过来”。值得注意的是，狗似乎是仅有的一种会朝着人类所指方向看的动物，这表明在驯化过程中，我们可能在无意之间选择了这种不寻常的特征。


    哲学家丹尼尔·C.丹尼特(Daniel C. Dennett)认为，意识可能产生于选择竞争还是合作的需求。决定与某人合作还是竞争也许就是意识的萌芽。他说：“如果没有利用语言愚弄他人的可能，或者缺乏合作的能力，都不会出现语言。而当你把两者放在一起时，意识才蓄势待发。”


    意识是什么时候产生的？正如你可能已经猜到的，我们也不知道。然而，有一种推测理论值得一提。朱利安·杰恩斯(Julian Jaynes)在1976年写了一本十分有趣的书，名为《二分心智的崩塌：人类意识的起源》(The
    Origin of Consciousness in the Breakdown of the Bicameral Mind)。杰恩斯认为，就在3000年前，人类还没有意识。我们大脑的两个半球不是一个整体，而是各自表现得有几分独立。其中一个半脑司'
  - '[PAGE 203]


    职指挥，它会告诉另一个半脑该做什么。人们把这种现象当作是一种命令的声音，就像在日常生活中体悟上帝的旨意。实际上，我们都是精神分裂症患者。就像一些精神分裂症患者经历的“命令幻觉”一样，我们的整个存在都是由我们从右脑接收到的命令控制的，这是基于我们经验进行的推理。


    在杰恩斯看来，这样的大脑既没有主观意识，也没有内省的能力。为了支持他的理论，他援引了古代著作，如《伊利亚特》(The Iliad)，书中的人物似乎缺乏自省。他还用这一理论来解释，为什么那个时代的人们觉得他们与神有直接的、可听到的交流。他们会体验到来自右脑的命令，并把它作为来自神灵的指令。这就是为什么古代著作中充斥着与神灵对话的人。随着二分心智的崩塌，意识出现了，祷告和占卜也出现了，杰恩斯把它理解为人类对神的声音消失的反应。苏格拉底时代的希腊人是完全有意识的，他们认识到就在几个世纪前，有一段时间众神经常与人类交流，但那个时代已经结束了，从当时起，只能通过神谕来接近神。


    不管真假，这是一个引人入胜的理论，理查德·道金斯(Richard Dawkins)将其描述为“要么是彻头彻尾的垃圾，要么是天才的杰作，没有中间地带”。有趣的是，这也是HBO电视剧《西部世界》(Westworld)的背景设定。


    这种观点认为我们对现实的感知方式随着时间的推移发生了变化，这事也并非史无前例。我们的大脑极其复杂，而且仍在变化。例如，有一个很有说服力的证据是人类直到最近才看得到颜色。这一理论诞生于19世纪，当时的英国政治家和古典学者威廉·格莱斯顿(William
    Gladstone)注意到，荷马的作品中没有提到太多颜色，他得出结论，希腊人只看得到光明和黑暗，或许还有一些红色。他们的体验就如同我们在黄昏时失去了辨别颜色的能力。一切都变成了不同深浅'
  - '[PAGE 204]


    的灰色，也许还夹杂一丝丝色彩。格莱斯顿指出，荷马曾数百次使用黑白，所以他并不讨厌用颜色来描述事物。然而，红色和一个表示黄色和绿色的单词分别被使用了大概十几次。蓝色则完全没有被提到。这并不是说缺少蓝色的东西。例如，荷马将海称为“葡萄酒”色，他对羊也有同样的描述。我不知道你碰巧来自世界的哪个地方，但在我居住的地方，葡萄酒、大海和羊的颜色并不相同。甚至天空的颜色，特别是在荷马居住的地中海地区，也是蓝色应有的色彩，但却被描述为青铜色。因为色盲的人可能会认为明亮的天空就像闪亮的青铜盔甲。


    博物学家拉扎勒斯·盖格(Lazarus Geiger)提出了一个“关于我们获得颜色知觉的顺序”理论，他把研究范围从荷马扩展到了其他希腊作家。他认为我们是最近才开始看到颜色的，我们看到颜色的顺序是从最长的波长到最短的波长，或者换句话说，是它们在彩虹中出现的顺序：红色、橙色等等，囊括罗伊·比夫(Roy
    G. Biv)[2]的所有色彩。蓝色和绿色排在较后面，即使在今天，大多数语言也不区分蓝色和绿色。盖格指出：“德谟克利特(Democritus)和毕达哥拉斯(Pythagoreans)假定了四种基本颜色，黑色、白色、红色和黄色......古代作家西塞罗(Cicero)、普林尼(Pliny)和昆体良(Quintilian)认为，希腊画家直到亚历山大时代都只使用这四种颜色，这是一个正向的佐证。”他接着说，中国人自古以来也看得到这四种颜色，再加上绿色。一项对古代印度教经文、《旧约》和《新约》《可兰经》、冰岛传奇以及其他古代作品的调查显示出了类似的模式，它们都没有提到蓝色，即使在那些对天空进行长篇描述的作品中也是如此。


    我之所以研究这一切，是因为它表明我们的大脑仍在变化，不能排除我们并非一直有意识的可能性，也不能排除我们也许在未来发展出新的“特殊能力”的可能性。这些到底是什么是无法想象的，就像一个没有意识的生物无法想象意识一样。那么谁是有意识的？'
