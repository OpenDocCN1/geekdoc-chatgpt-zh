  md: "\n- [6]蒂莫西·詹姆斯·麦克维被控违反11项美国联邦法律，最后因为策划1995年4月19日俄克拉荷马城爆炸被处决的美国公民。168人在该爆炸中丧生，是9·11袭击事件发生之前所被认为美国史上最大型及严重的本土恐怖主义袭击。他也是自1963年之后首位由美国联邦政府处决的罪犯。\n\
    \n- [7]蔡尔纳耶夫兄弟是波士顿爆炸案的主谋。波士顿马拉松爆炸案是发生于2013年4月15日北美东部时间下午2时50分的爆炸事件，此次爆炸造成3人死亡，183人受伤，17人有生命危险。\n\
    \n- [8]邓巴数字，即150定律(Rule of 150)，由英国牛津大学的人类学家罗宾·邓巴(Robin Dunbar)提出。该定律根据猿猴的智力与社交网络推断出：人类智力将允许人类拥有稳定社交网络的人数是148人，四舍五入大约是150人。\n\
    \n- [9]美国科幻电视剧《无敌金刚》中，飞行员史蒂夫·奥斯汀在双腿重伤后换上了价值600万美元的假肢，结果却拥有了超能力。\n\n- [10]滑坡理论认为，如果你允许做法A(或者无害，或者有一点点反对)，那么，将不可避免Z的情况(令人讨厌和非常不想要的)。\n\
    \n- [11]双焦眼镜：即镜片一分为二，上下两片焦距不同的透镜合起来，组成新镜片。上半片适合看远处，下半片适合看近处。预防近视的眼镜主要就是双焦镜。\n\n\
    - [12]原文是“No one blinked”，既可以翻译成“没有人眨眼”，又可以翻译成“无人介意”，实际上是一语双关。\n\n- [13]身份政治(identity\
    \ politics)新社会运动理论认为社会运动产生的社会基础不在于“阶级结构”，而在于人们在种族、性别、性取向、年龄、公民身份、价值观、信仰等方面的身份。\n\
    \n## 致谢\n\n我要感谢我的家人，在写这本书的整个过程中，他们一直给予我支持和鼓励。同时，我还要感谢我的经纪人和好朋友，弗里欧文学管理机构的斯科特·霍夫曼(Scott\
    \ Hoffman)。我猜想他第一次和我见面时的矜持是出于中间介绍人在场的礼貌，他和我一样惊讶地发现我们彼此之间存在一种一拍即合的默契。他是一个出色的经纪人，也是扑克牌比赛中斗智斗勇的对手。此外，我必须感谢我的出版商，心房图书(Atria)的彼得·博兰(Peter\
    \ Borland)，我感谢彼得出版了这本书，更感谢他如此认真地编辑它。他仔细而认真地阅读了每一份草稿，给的建议含着善意，评价中鲜少使用“平淡乏味”这个词。还要感谢肖恩·德龙(Sean\
    \ Delone)，他和彼得一起费尽心力读完了这本书。他在批注中做了许多修改，使手稿变得更好。\n\n接下来我要感谢罗伯特·布鲁克(Robert Brooker)，在我把手稿寄给彼得之前，他给了我宝贵的建议。同样，我与埃利斯·奥格尔斯比(Ellis\
    \ Oglesby)共进午餐时，也进行了一些对话，这些对话影响了本文的许多内容。此外，我还要感谢逊尼·布朗(Sunni Brown)，他把我介绍给了斯科特。我还想感谢与我交谈过的许多人，他们影响了我这份手稿，他们是：迈克尔·林德(Michael\
    \ Blend)、肖纳·巴特勒(Shawna Butler)、南希·乔尔达诺(Nancy Giordano)、杰夫·赫伯特(Jeff Hebert)、大卫·赫曼(David\
    \ Hehman)、戈迪·霍尔特曼(Gordy Holterman)、布雷特·赫特(Brett Hurt)、普里西拉·琼斯(Priscilla Jones)、史蒂夫·拉尼尔(Steve\
    \ Lanier)、杰森·莱德利(Jason Ledlie)、霍华德·洛夫(Howard Love)、约书亚·麦克卢尔(Joshua McClure)、凯文·斯塔姆鲍尔(Kevin\
    \ Stambaugh)和斯蒂芬·沃尔夫拉姆(Stephen Wolfram)。\n\n其他我想感谢其他或多或少都对本书产生了影响的人，他们是克里斯·安德森(Chris\
    \ Anderson)、约书亚·贝尔(Joshua Baer)、克里斯蒂娜·贝里(Christina Berry)、吉姆·康奈利(Jim Connally)、克里斯塔·哈贝斯托克科尔森(Christa\
    \ Haberstock Carrin)、卡林·邓恩(Carrin Dunne)、梅兰妮·邓纳姆(Melanie Dunham)、帕梅拉·B.欧文(Pamela\
    \ B. Erwin)、戴夫·帕诺斯(Dave Panos)、彼得·汉兹曼(Peter Handsman)、杰森·霍顿(Jason Horton)、史蒂夫·鲍尔曼詹森(Steve\
    \ Baughman Jensen)、法蒂安·夸斯尼(Fatin Kwasny)、迈克·莱珀(Mike Lemper)、德鲁·麦克弗森(Drew MacPherson)、帕特里夏·安·奈特·迈耶(Patricia\
    \ Ann Knight Meyer)、奥伦西娅·梅森(Orenthia D. Mason)、南希·穆利斯(Nancy Mullis)、安·塞弗娜(Ann\
    \ Sefrna)、罗恩·塞弗娜(Ron Sefrna)、凯特·辛普森(Kate Simpson)、梅塔·简·史密斯(Meta Jane Smith)、杰斯·汤普森(Jess\
    \ Thompson)、埃德·瓦塞尔(Ed Wasser)。\n\n![](img/221bf842bb710c426d93ccdb225e6223_284_0.png)\n\
    \n## 读客\n\n### 激发个人成长\n\n多年以来，千千万万有经验的读者，都会定期查看熊猫君家的最新书目，挑选满足自己成长需求的新书。\n\n读客图书以“激发个人成长”为使命，在以下三个方面为您精选优质图书：\n\
    \n- 1. 精神成长\n  熊猫君家精彩绝伦的小说文库和人文类图书，帮助你成为永远充满梦想、勇气和爱的人。\n\n- 2. 知识结构成长\n  熊猫君家的历史类、社科类图书，帮助你了解从宇宙诞生、文明演变直至今日世界的形成的方方面面。\n\
    \n- 3. 工作技能成长\n  熊猫君家的经管类、家教类图书，指引你更好地工作、更有效率地生活，减少人生中的烦恼。\n\n每一本读客图书都轻松好读，精彩绝伦，充满无穷阅读乐趣！\n\
    \n## 认准读客熊猫\n\n读客所有图书，在书脊、腰封、封底和前后勒口都有“读客熊猫”标志。\n\n## 两步帮你快速找到读客图书\n\n![](img/221bf842bb710c426d93ccdb225e6223_285_0.png)\n\
    \n- 1. 找读客熊猫\n\n- 2. 找黑白格子\n\n![](img/221bf842bb710c426d93ccdb225e6223_285_1.png)\n\
    \n马上扫二维码，关注“熊猫君”和千万读者一起成长吧！\n"
