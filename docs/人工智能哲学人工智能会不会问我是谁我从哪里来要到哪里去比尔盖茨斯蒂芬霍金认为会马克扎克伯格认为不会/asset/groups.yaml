  md: "\n公司陷入困境，因为没有人购买它的产品。它被迫裁员。现在这些被裁掉的人没有钱去买任何东西，而机器人公司却坐拥越来越多的现金。情况一直在恶化，直到所有人都失业了，机器人公司掌握了世界上所有的钱。”\n\
    \n一些人说，以上状况正在美国发生。企业利润很高，这些利润被分配给富人，而工人工资却停滞不前。如今的大型新公司，如脸书和谷歌，收入丰厚，员工不多。不像传统的大公司，如耐用品制造商，通常需要大量的劳动力。\n\
    \n这种世界观无疑有些道理，由技术创造的生产力增长带来的利润并不一定会进入工人的腰包，相反，它们通常会返还给股东。我们将在关于收入不平等的章节中讨论如何减缓资本流动，但这不应将其视为技术或经济的致命缺陷，这是需要全社会正面解决的问题。\n\
    \n此外，机器人公司的巨额利润可能不只是放在像史高治·麦克老鸭 (Scrooge McDuck)[10]那样的保险库里，任由高管们用塞满百元大钞的枕头进行枕头大战。相反，它们被用于生产，并反过来借钱给人们创业和建房，以期创造更多的工作岗位。一个没有企业利润、一切都以工资支付的经济体，就像我们刚刚探讨的相反情况一样，是会运转失灵的。\n\
    \n## 假设3：无论如何我们都会工作。\n\n“我们无论如何都要工作”的论点开始于一个你可能已经思考过的问题：我们发明了各种各样的效率工具，可以节省我们的时间，但为什么我们现在工作的时间更长了。我们的时间确实节省了，过去当你输入备忘录时，一个错误需要几秒钟才能纠正，非常让人苦恼，由此我们发明了文字处理器和后退按钮。有了互联网，过去需要几天的研究任务现在只需要几分钟，甚至几秒钟。通过上千种不同的方式，我们大大提高了工作场所的工作效率。但为什么我们仍然每周工作40个小时？为什么不是15个小时？\n\
    \n我特别提出15个小时，是因为经济学家约翰·梅纳德·凯恩斯在1930年的一篇文章《我们后代的经济前景》(Economic Possibilities for\
    \ Our Grandchildren)中做出了一个著名的预测。凯恩斯在文章中指出，几千年来，直到1700年，人类的生活水平没有发生真正的变化。他将此归因于技术进步的迟缓和资本积累的失败。然后他提出，在18世纪初，一连串的技术进步和现金的注入一起创造了现代经济，带来了复利和复利经济增长的魔力。\n\
    \n他接着说，预计到2030年，生活水平将提高4至8倍。在这一点上，他是对的，我们有望达到他预测的上限。基于这一评估，凯恩斯做出了一个惊人的预测，他说尽管人类的欲望可能无法满足，但人类的需求基本上是固定的。考虑到我们将拥有比维持生命所需多得多的钱，他相信我们会“愿意把更多的精力投入到非经济目的上”。他推测，由于解决“经济问题”已经占用了人类数千年的时间，当我们最终消除了对大量工作的需求时，我们可能会面临一些问题：首先，我们可能只是出于习惯而继续工作；其次，因为我们已经努力工作了这么长时间，我们可能在休闲中找不到快乐或意义，他说：\n\
    \n因此，自从人类出现以来，人类将第一次面临他真正的、永久的问题：如何利用他从紧迫的经济忧虑中获得的自由，如何利用科学和复利为他赢得的闲暇时间，明智地、愉快地、幸福地生活。\n\
    \n凯恩斯将富人称为“我们的高级警卫……他们在为我们其他人窥探应许之地”，凯恩斯还建议我们把富人看作是当我们摆脱贫困时可以做什么的参考案例。他对富人的懒惰选择性忽略。\n\
    \n因此凯恩斯提出，每周工作15小时可能才是正解，而不是亨利·福特(Henry Ford)所推崇的每周工作40小时。他认为，在一个世纪之内，每周工作15个小时就能满足我们所有的物质需求和基本欲望。然后，他继续表达了对那些在这样一个世界里仍然是工作狂的人的蔑视：\n\
    \n当然，仍然会有很多人有强烈的、不满足的目的性，盲目地追求财富——除非他们能找到一些合理的替代品，否则会追求不息。但我们其他人将不再有任何义务为他们鼓掌和加油。\n\
    \n那么我们该对凯恩斯说什么呢？当我们接近他的经济理想目标时，为什么不每周工作15个小时？\n\n你能一周工作15个小时吗？假设你现在挣6万美元。因此，将你的每周工作时间减少60%，你可能只赚得到2.4万美元。你能靠它生活吗？也许吧，但你必须住在一个500平方英尺(约合46平方米)的公寓里，永远不去餐馆吃饭，基本在家做饭，不开空调。事实上，这正是1930年中产阶级的生活方式：住房500平方英尺，不外出就餐，没有空调。所以，是的，只要每周工作15个小时，你就可以拥有和1930年的人一样的生活水平。此外，由于它是现代化的，比起1930年的生活，你还可以上网，并且不用担心得风疹。\n\
    \n这对经济水平再靠下一点的人有什么影响？假设你现在赚3万美元，或者每小时15美元。在决定实行凯恩斯主义的工作周后，你的收入会降至1.2万美元。你能靠它生活吗？同样，如果你愿意过1930年同一经济阶层的人的生活：你会自己种植大部分粮食，自己缝制衣服，住在城外一小块土地上。\n\
    \n事情的真相很简单：我们已经决定，我们宁愿工作更多的时间，挣更多的钱，多买些我们生活中的“必需品”。我们选择集体加班，而不是自己种土豆、削土豆皮。我们都想要更高的生活水平，而正是这种渴望创造了大部分的工作岗位。只要你想要更多的收入，就有可能找到一种利用你的技能在某个地方增加价值的方法，而这种行动创造了新的工作岗位。\n\
    \n别误会我的意思，特此强调，我并不是说今天贫困的劳动者过着舒适安逸的生活，甚至可以用比现在更少的钱过得更好。一点也不。 1930年，作为一名低收入工人，生活十分艰辛，生病时别想看医生，忘掉高等教育吧，忘掉曾经的度假，曾经有过的可支配收入，曾经获得的真正成功。然后做好预期寿命降低的准备。关键是，自凯恩斯写了这篇文章以来，我们的生活水平和对“正常”生活的期望都显著提高了，它们本应如此，而且应该继续上升，我们应该努力确保这个上升的浪潮真正提高所有人的生活质量。\n\
    \n我的意思很简单：严格地说，从技术上讲，减少工作量我们是可以生存下来的。我们选择不这样做，而是享受不断提高的生活水平。这就是凯恩斯有点偏离目标的地方。曾经是奢侈品的东西我们现在认为是必需品，没有理由认为这种趋势会以某种方式逆转。\n\
    \n这里的要点是什么？即使我们每周工作5小时或1小时，或不工作，就能过上1930年的经济生活，我们仍然会每周工作40小时左右。你可以响指一打，魔法般地用机器人取代地球上的每一份工作，付给每个人同样的工资，但到了第二天，人们还是会创造新的工作，赚取更多的钱，追求更高水平的生活。\n\
    \n如果在2047年，我们都可以通过每周工作15小时过上2017年的经济生活，你认为我们会工作多少小时？我怀疑要40个小时或更多。以2047年的标准衡量，2017年的经济生活看起来相当艰辛。总结2017年的生活，未来人可能会说：\n\
    \n2017年？嗯，那个时候，人们在买东西之前必须先看价格，看看自己是否买得起。医生会告诉你所需的医疗程序的费用，因为也许你没有钱买，或者没有保险来支付。几乎每个人仍然自己做家务，自己开车，自己给花园除草。他们住在地上像动物窝一样的小房子里。有时老鼠、蟑螂和跳蚤会进入他们的家里。他们的窗户玻璃是透明的，不管外面的景色有多难看，他们也无法安装让每个人都看得到海景的全息玻璃。还有他们吃的食物。他们不知道它是从哪里来的，也不知道上面喷了什么。他们吃的是真正动物的肉，他们甚至会把粗糙的肉块剁碎做成一种叫作“香肠”的菜，其目的就是为了掩盖肉的来源。他们无法按照自己最喜欢的口味和质地订制食品。他们只是随意地把食物放进嘴里，催眠自己喜欢它，希望它不会导致心脏病或癌症。哦，如果他们头痛，他们吃的药丸和地球上其他人吃的一模一样，而不考虑他们自己的基因组。大多数时候，如果头痛消失了，那只是运气太好了。哦，还有这个：在工作的时候，他们在一个键盘上打字。用手指。那真是一个充斥石刀和熊皮的蛮荒时代。\n\
    \n> “不，”2047年的你可能会说，“我宁愿在核聚变反应堆待到很晚，也不愿过2017年的生活了。”\n\n我们最终会满足吗？我们享受着高质量的生活水平，在中午打卡下班，会有那么一天吗？经济学家米尔顿·弗里德曼(Milton\
    \ Friedman)可能会说不，因为他相信人类的需求和欲望是无限的。另一方面，的确，由于电力和电器使我们的家务变得更容易，我们的时间更宽裕了。我们把新得到的时间用在休闲和爱好上，而不是用来赚更多的钱。因为我不需要用镰刀割草，也不需要从井里打水，所以我选择摄影或者写作。因此，我们并不是纯粹被想获得更多的欲望所驱使的。\n\
    \n我们为什么不少干点呢？凯恩斯似乎看到了一些答案。根据他的说法，可能是因为对贫穷时代的记忆让我们无法集体性冷静下来，我们需要几代人的时间才能适应成为休闲阶层的一员。或者也许“与邻居攀比”在我们心中根深蒂固，我们永远无法安心休息——只要我们在吃早餐的时候能从窗口看到他们崭新的飞车，我们可能永远都不愿意休息哪怕一天。或者也许永久的休闲在某种程度上正在腐蚀我们，因此我们对它和它的诱惑有着深深的内在憎恶。或者当我们没有金钱的尺度来告诉我们该在工作上投入多少时，我们就还没有找到从工作中获得满足感的方法。或者，最令人不安的是，也许我们是贪婪的唯物主义者，凯恩斯曾说过，“爱钱并把钱作为一种财产，区别于把钱作为享受美好生活的手段”，他将这种状况定义为“半犯罪、半病态……的精神疾病”。\n\
    \n凯恩斯本人就死于过度劳累，所以即使是他，在这一点上也可能有些矛盾。\n\n另一种解释是，也许正是我们对现状的轻微不满驱使着我们走向永恒的进步。不管事情有多好，我们总能把它描绘得更好一点，而具有不懈地向前和向上的动力是我们独特的特点。也许我们与其说是理性的智人，不如说是不满足的人。\n\
    \n现在让我们来探讨这三种可能性的含义，每种情况下的未来会是什么样子？\n\n## 10 有机器人无法涉足的工作吗\n\n当我在谈论AI和机器人时，通常会被问到一些问答。到目前为止，观众问得最多的问题都类似于：“我的孩子今天应该学习什么，以确保他们将来能够就业？”作为一个有四个二十岁以下孩子的父亲，我也仔细思考过这个问题。\n\
    \n假设第一种可能性是真的，也就是说，如果所有的工作都被机器人夺去了，那么领导理论大师沃伦·G.本尼斯(Warren G. Bennis)的预言也将成为现实：“未来的工厂将只有两名雇员——一个人和一条狗。”人的职责是喂狗。狗的作用是防止那个人接触设备。换句话说，没有机器人不能做的工作。\n\
    \n但如果可能性二或可能性三成为现实，那么就会有机器人无法胜任的工作。它们会是什么样的？评估任何工作被自动化替代的可能性的一个好方法就是我所说的“培训手册测试”。想想从事你的工作所需要的一整套工作岗位说明书，其中涉及工作的所有细节、意外情况等。那份文件得多长？说明书越长，也就说明需要解释的情况、特殊案例和异常就越多。有趣的是，在调查中，绝大多数人认为自动化会毁掉大批工作岗位，但同时他们也认为自己的工作岗位是机器人无法涉足的。换句话说，大多数人认为他们的工作手册很长很复杂，而其他人的工作手册很短很简单。\n\
    \n培训手册测试之所以有效，是因为编写关于如何做一项工作的手册有点像编程计算机或机器人来完成一项工作。在程序中，每一步、每一个偶然事件、每一个异常都需要仔细考虑和处理。\n\
    \n有人想知道是否有一些工作是不能写下来的。谁能通过一套指令来创作奏鸣曲或写出一部伟大的小说呢？你如何回答我们提到的基本问题可能决定了你对此的看法。对于那些认为自己是机器的一元论者来说，创造力并没有什么神秘之处使得机器无法掌握，而持截然相反意见的人则把创造力看作是一种特别的、独特的人类能力。\n\
    \n下面是几组工作，不管你对机器人能力的看法如何，它们应该是长期稳定的：\n\n机器人能做但可能永远不会做的工作：有些工作是相当安全的，很多人都可以做，不管他们的智力、受教育程度或财力如何，因为尽管机器人能做这些工作，但对它们来说，这样做没有经济意义。下面来想想在未来100年里，人们偶尔才会需要的那些工作岗位。\n\
    \n我住在一栋建于19世纪的房子里，里面有几个壁炉。我想要使用它们，而不用一直提心吊胆它们是否会把房子烧掉，所以我叫来了“一个家伙”来修复旧壁炉。他看了一眼，然后开始滔滔不绝地说：“很明显在19世纪的某个时候，它们还没有被重建。当时，英国有一份报告规定……然后他又谈到十几件和壁炉有关的事，我已经走神了，因为很明显，这个人比我遇到的任何人都更了解壁炉，或者他是一个看起来有说服力的骗子，我永远也猜不透他。不管怎样，结果都是一样的，我雇他来维护我的壁炉安全。他是一个在很长一段时间内都不会被机器人取代的典型代表，他的职业将长期保持，以至于他的子孙后代都可能会继续从事这一行业。\n\
    \n有很多与之类似的工作：修理古董钟，平整横梁房屋，修复古典吉他等等。但是要确保你正在处理的对象不会消失。所以成为世界上最好的录像机修理工并不是我建议的职业道路。\n\
    \n我们不想让机器人做的工作：由于种种原因，有些工作我们不想让机器做。这个情形很简单，仅举几个例子：橄榄球运动员、芭蕾舞演员、精神导师、牧师和演员，此外，还有一些工作有一些怀旧的成分，比如铁匠或蜡烛匠。\n\
    \n不可预测的工作：有些工作非常捉摸不透，以至于你写不出岗位指导手册，因为其本质是不可预测的。我曾经担任过几家公司的首席执行官，我的工作基本上是：每天早上来解决遇到的所有问题，捕捉所有出现的机会。坦白说，很多时候我只是即兴发挥。记得有一天，我审查了一份租赁协议，后来集思广益想为新产品命名，最后还抓住了一只从天花板瓷砖上掉到办公桌上的大老鼠。如果有机器人能做到这一切，我今天就会为它付定金。\n\
    \n需要高社交智商的工作：有些工作需要与他人进行高水平的互动，通常还需要出色的沟通能力。比如活动策划人、公共关系专家、政治家、人质谈判专家和社交媒体总监，这只是其中的几个例子。想想那些需要同理心、愤怒或激情的工作。\n\
    \n现场工作：机器人很难完成需要就地应变的工作。机器人在完全受控的环境中，比如工厂和仓库运转良好，而到了临时环境例如苏阿姨的阁楼，情况就不一样了。类似的工作我能想到两种：护林员和电工，但还有更多。\n\
    \n需要创造力或抽象思维的工作：让计算机做需要创造力或抽象思维的工作，即使不是不可能的，也是很困难的，因为我们甚至不了解人类是如何做这些事情的。这种类型的工作包括作家(耶，我就是!)、商标设计师、作曲家、文案策划、品牌策划师和管理顾问。\n\
    \n还没有人想到的工作：所有这些新技术将创造无数的新工作。考虑到很多现有工作都是进入20世纪以后才出现的，有理由相信更多的新职业就在眼前。市场研究公司弗雷斯特预测，在未来10年内，美国将惊人地创造出1270万个新工作岗位，用于制造机器人和开发驱动机器人的软件。\n\
    \n小测验：机器人能做你的工作吗？\n\n这些是一些不太容易被自动化影响的工作。如果你想用一个快速测试来评估特定工作被自动化的可能性，我提供了以下内容。这是十个问题，每个问题的答案都可以在0分到10分的范围内得分。对于每个问题，我都举例说明了一些0分、5分和10分的例子。我的例子意在展示极端(0分和10分的情况)和中间情形(5分的情况)，你不应该仅仅用这3个数值来评分。可以使用7分、2分和9分，甚至偶尔使用2.5分。做完后，把它们都加起来。越接近于0分，你就越不可能从老板那里得到一个意外的解聘通知。越接近100分——你是否已经开始感觉到有什么东西在你的背上呼吸，那么这可能是机器人的冷却风扇，它即将取代你的工作。\n\
    \n- 1. 你的任意两个工作日有多么相似？\n  - 10 相同(数据录入员、快餐店的订餐员)\n  - 5 有些相同，有些不同(银行出纳员)\n  -\
    \ 0 完全不同(电工、电影导演、警察)\n- 2. 你的工作是否要求你去不同的地方，不同的房间也算？\n  - 10 不(“我整天站在一个地方接受订单”或“他们全都知道我可能在博拉博拉岛”)\n\
    \  - 5 有一些位置移动(医院护士)\n  - 0 是(室内装潢师、导游)\n- 3. 有多少人从事你的工作？\n  - 10 很多：这是一份大家都知道的既定工作(医生、律师、教师、园丁)。\n\
    \  - 5 一些：有些人可能听说过这个工作，但很少有人了解(布景设计师、跳伞教练、诚实的政治家)\n  - 0 很少：我必须向人们解释我是做什么的(作品经纪人、报关员)\n\
    - 4. 你的工作需要多长时间的培训?\n  - 10 几天(保管员)\n  - 5 几周(油田钻工、商业渔民、空乘人员)\n  - 0 几个月或几年(牙科保健师、汽车机械师、锁匠)\n\
    - 5. 你的工作是否有非重复性的动作要求？\n  - 10 没有(程序员、收银员)\n  - 5 一些(保安)\n  - 0 有(舞蹈教练)\n- 6.\
    \ 最难的工作决定需要多长时间完成？\n  - 10 2秒以内(电影票销售、收费亭操作员)\n  - 5 2~5秒(房屋油漆工)\n  - 0 5秒以上(出庭律师)\n\
    - 7. 你的工作是否需要与人建立情感联系或需要个人魅力？\n  - 10 不需要(打字员、建筑工人)\n  - 5 需要一些(律师、销售员)\n  - 0\
    \ 需要(喜剧演员、儿童心理学家、市长)\n- 8. 你的工作需要多少创造力？\n  - 10 不需要(仓库工人、流水线工人)\n  - 5 需要一些(厨师、旅行代办人)\n\
    \  - 0 需要很多(作家、网页设计师、花店店主)\n- 9. 你直接管理员工吗？\n  - 10 不(空乘人员)\n  - 5 管理一些(餐厅经理)\n\
    \  - 0 管理，我还做指导和培训(警察局长)\n- 10. 会不会有其他人和你的工作方式一样？\n  - 10 会，完全一样(打字员)\n  - 5 接近，可能有75%一样(牙医、房屋油漆工)\n\
    \  - 0 完全不同(编剧)\n\n你能想出一个完美的“0分”工作吗？根据我的统计，“人质谈判专家”的总得分接近10分，仅仅是因为他不管理任何人。“与新手搭档的人质谈判专家”很可能是0分，因为他要管理和培训新手，这一项就可以减去10分。重建我烟囱的那个人可能在他的工作岗位上得到22分；其中10分是因为他没有管理任何人，7分是因为这个工作不需要太多的魅力(他需要一点销售魅力)，5分是因为这个工作只需要一些创造力。\n\
    \n我们的目标不是找到一份接近0分的工作。任何低于70分的都是安全的，足以让你拥有一个漫长而辉煌的职业生涯。有很多“100分”的工作。在快餐店为你点餐的人可能非常接近100分。\n\
    \n将来会不会有一些人完全无法与机器竞争上岗？这取决于这三种可能性中哪一种会发生。\n\n第一种可能性是最简单的情况。在这种情况下，几乎没有什么事情是机器不能做的。出于怀旧的原因，人类可能还会从事一些工作，但对我们其他人来说，人类具有经济价值的时代将会结束。卡尔·马克思曾说过：“生产了太多有用的东西，却造就了太多无用的人。”这一可能性的实现将证明他的正确性。\n\
    \n第二种可能性也涉及失业人员。它背后的核心思想是，将有大量低技能工人无法与机器竞争。从这个角度来看，未来的经济价值等级体系从高到低依次为：技能人才、机器人、低技能的工人。\n\
    \n在这种情况下，不用多长时间，机器人就能做很多低技能的工作。每替代一份工作，失业的非技术工人的数量就会增加，非技术工作岗位的数量就会减少。因此，世界上将会有越来越多的非技术工人竞争越来越少的非技术岗位。\n\
    \n有些人认为，我们已经见证了这种情况发生。为了支撑他们的观点，他们提出了劳动参与率(the labor participation rate)，这个指标表示了目前工作的成年人占所有成年人的百分比。2000年该指标达到峰值(即67%)，现在下降了大约4个百分点。这一结果意味着越来越多的人完全退出了就业市场。放弃一切，就此打住(失业率只反映了正在找工作的人，所以这些人没有计算在内)。\n\
    \n事实证明，周期性经济周期因素和婴儿潮一代的退休是造成劳动参与率下降的主要原因，但有1%左右的下降不包含在内。这1%是未来事物的先兆吗？当然，我们预计劳动参与率会随着我们变得更富有而下降，对吧？也许夫妻双方都不用再工作了，或者也许某人今年得到一笔巨额奖金，他打算休一年的假。我认为，我们很难把失业工人失去工作并对获得新工作不抱希望的说法投射到这些数据上。众所周知，很难从经济数据中得出心理结论。\n\
    \n另一些人指出，自2000年以来，我们的生产率不断提高，同时工资水平持平，就业增长缓慢。他们将这种数据组合视为一个确定的迹象，表明雇主通过投资技术而不是人力来发展业务，从而降低了对人\n"
  mdcn: "\n公司陷入困境，因为没有人购买它的产品。它被迫裁员。现在这些被裁掉的人没有钱去买任何东西，而机器人公司却坐拥越来越多的现金。情况一直在恶化，直到所有人都失业了，机器人公司掌握了世界上所有的钱。”\n\
    \n一些人说，以上状况正在美国发生。企业利润很高，这些利润被分配给富人，而工人工资却停滞不前。如今的大型新公司，如脸书和谷歌，收入丰厚，员工不多。不像传统的大公司，如耐用品制造商，通常需要大量的劳动力。\n\
    \n这种世界观无疑有些道理，由技术创造的生产力增长带来的利润并不一定会进入工人的腰包，相反，它们通常会返还给股东。我们将在关于收入不平等的章节中讨论如何减缓资本流动，但这不应将其视为技术或经济的致命缺陷，这是需要全社会正面解决的问题。\n\
    \n此外，机器人公司的巨额利润可能不只是放在像史高治·麦克老鸭 (Scrooge McDuck)[10]那样的保险库里，任由高管们用塞满百元大钞的枕头进行枕头大战。相反，它们被用于生产，并反过来借钱给人们创业和建房，以期创造更多的工作岗位。一个没有企业利润、一切都以工资支付的经济体，就像我们刚刚探讨的相反情况一样，是会运转失灵的。\n\
    \n## 假设3：无论如何我们都会工作。\n\n“我们无论如何都要工作”的论点开始于一个你可能已经思考过的问题：我们发明了各种各样的效率工具，可以节省我们的时间，但为什么我们现在工作的时间更长了。我们的时间确实节省了，过去当你输入备忘录时，一个错误需要几秒钟才能纠正，非常让人苦恼，由此我们发明了文字处理器和后退按钮。有了互联网，过去需要几天的研究任务现在只需要几分钟，甚至几秒钟。通过上千种不同的方式，我们大大提高了工作场所的工作效率。但为什么我们仍然每周工作40个小时？为什么不是15个小时？\n\
    \n我特别提出15个小时，是因为经济学家约翰·梅纳德·凯恩斯在1930年的一篇文章《我们后代的经济前景》(Economic Possibilities for\
    \ Our Grandchildren)中做出了一个著名的预测。凯恩斯在文章中指出，几千年来，直到1700年，人类的生活水平没有发生真正的变化。他将此归因于技术进步的迟缓和资本积累的失败。然后他提出，在18世纪初，一连串的技术进步和现金的注入一起创造了现代经济，带来了复利和复利经济增长的魔力。\n\
    \n他接着说，预计到2030年，生活水平将提高4至8倍。在这一点上，他是对的，我们有望达到他预测的上限。基于这一评估，凯恩斯做出了一个惊人的预测，他说尽管人类的欲望可能无法满足，但人类的需求基本上是固定的。考虑到我们将拥有比维持生命所需多得多的钱，他相信我们会“愿意把更多的精力投入到非经济目的上”。他推测，由于解决“经济问题”已经占用了人类数千年的时间，当我们最终消除了对大量工作的需求时，我们可能会面临一些问题：首先，我们可能只是出于习惯而继续工作；其次，因为我们已经努力工作了这么长时间，我们可能在休闲中找不到快乐或意义，他说：\n\
    \n因此，自从人类出现以来，人类将第一次面临他真正的、永久的问题：如何利用他从紧迫的经济忧虑中获得的自由，如何利用科学和复利为他赢得的闲暇时间，明智地、愉快地、幸福地生活。\n\
    \n凯恩斯将富人称为“我们的高级警卫……他们在为我们其他人窥探应许之地”，凯恩斯还建议我们把富人看作是当我们摆脱贫困时可以做什么的参考案例。他对富人的懒惰选择性忽略。\n\
    \n因此凯恩斯提出，每周工作15小时可能才是正解，而不是亨利·福特(Henry Ford)所推崇的每周工作40小时。他认为，在一个世纪之内，每周工作15个小时就能满足我们所有的物质需求和基本欲望。然后，他继续表达了对那些在这样一个世界里仍然是工作狂的人的蔑视：\n\
    \n当然，仍然会有很多人有强烈的、不满足的目的性，盲目地追求财富——除非他们能找到一些合理的替代品，否则会追求不息。但我们其他人将不再有任何义务为他们鼓掌和加油。\n\
    \n那么我们该对凯恩斯说什么呢？当我们接近他的经济理想目标时，为什么不每周工作15个小时？\n\n你能一周工作15个小时吗？假设你现在挣6万美元。因此，将你的每周工作时间减少60%，你可能只赚得到2.4万美元。你能靠它生活吗？也许吧，但你必须住在一个500平方英尺(约合46平方米)的公寓里，永远不去餐馆吃饭，基本在家做饭，不开空调。事实上，这正是1930年中产阶级的生活方式：住房500平方英尺，不外出就餐，没有空调。所以，是的，只要每周工作15个小时，你就可以拥有和1930年的人一样的生活水平。此外，由于它是现代化的，比起1930年的生活，你还可以上网，并且不用担心得风疹。\n\
    \n这对经济水平再靠下一点的人有什么影响？假设你现在赚3万美元，或者每小时15美元。在决定实行凯恩斯主义的工作周后，你的收入会降至1.2万美元。你能靠它生活吗？同样，如果你愿意过1930年同一经济阶层的人的生活：你会自己种植大部分粮食，自己缝制衣服，住在城外一小块土地上。\n\
    \n事情的真相很简单：我们已经决定，我们宁愿工作更多的时间，挣更多的钱，多买些我们生活中的“必需品”。我们选择集体加班，而不是自己种土豆、削土豆皮。我们都想要更高的生活水平，而正是这种渴望创造了大部分的工作岗位。只要你想要更多的收入，就有可能找到一种利用你的技能在某个地方增加价值的方法，而这种行动创造了新的工作岗位。\n\
    \n别误会我的意思，特此强调，我并不是说今天贫困的劳动者过着舒适安逸的生活，甚至可以用比现在更少的钱过得更好。一点也不。 1930年，作为一名低收入工人，生活十分艰辛，生病时别想看医生，忘掉高等教育吧，忘掉曾经的度假，曾经有过的可支配收入，曾经获得的真正成功。然后做好预期寿命降低的准备。关键是，自凯恩斯写了这篇文章以来，我们的生活水平和对“正常”生活的期望都显著提高了，它们本应如此，而且应该继续上升，我们应该努力确保这个上升的浪潮真正提高所有人的生活质量。\n\
    \n我的意思很简单：严格地说，从技术上讲，减少工作量我们是可以生存下来的。我们选择不这样做，而是享受不断提高的生活水平。这就是凯恩斯有点偏离目标的地方。曾经是奢侈品的东西我们现在认为是必需品，没有理由认为这种趋势会以某种方式逆转。\n\
    \n这里的要点是什么？即使我们每周工作5小时或1小时，或不工作，就能过上1930年的经济生活，我们仍然会每周工作40小时左右。你可以响指一打，魔法般地用机器人取代地球上的每一份工作，付给每个人同样的工资，但到了第二天，人们还是会创造新的工作，赚取更多的钱，追求更高水平的生活。\n\
    \n如果在2047年，我们都可以通过每周工作15小时过上2017年的经济生活，你认为我们会工作多少小时？我怀疑要40个小时或更多。以2047年的标准衡量，2017年的经济生活看起来相当艰辛。总结2017年的生活，未来人可能会说：\n\
    \n2017年？嗯，那个时候，人们在买东西之前必须先看价格，看看自己是否买得起。医生会告诉你所需的医疗程序的费用，因为也许你没有钱买，或者没有保险来支付。几乎每个人仍然自己做家务，自己开车，自己给花园除草。他们住在地上像动物窝一样的小房子里。有时老鼠、蟑螂和跳蚤会进入他们的家里。他们的窗户玻璃是透明的，不管外面的景色有多难看，他们也无法安装让每个人都看得到海景的全息玻璃。还有他们吃的食物。他们不知道它是从哪里来的，也不知道上面喷了什么。他们吃的是真正动物的肉，他们甚至会把粗糙的肉块剁碎做成一种叫作“香肠”的菜，其目的就是为了掩盖肉的来源。他们无法按照自己最喜欢的口味和质地订制食品。他们只是随意地把食物放进嘴里，催眠自己喜欢它，希望它不会导致心脏病或癌症。哦，如果他们头痛，他们吃的药丸和地球上其他人吃的一模一样，而不考虑他们自己的基因组。大多数时候，如果头痛消失了，那只是运气太好了。哦，还有这个：在工作的时候，他们在一个键盘上打字。用手指。那真是一个充斥石刀和熊皮的蛮荒时代。\n\
    \n> “不，”2047年的你可能会说，“我宁愿在核聚变反应堆待到很晚，也不愿过2017年的生活了。”\n\n我们最终会满足吗？我们享受着高质量的生活水平，在中午打卡下班，会有那么一天吗？经济学家米尔顿·弗里德曼(Milton\
    \ Friedman)可能会说不，因为他相信人类的需求和欲望是无限的。另一方面，的确，由于电力和电器使我们的家务变得更容易，我们的时间更宽裕了。我们把新得到的时间用在休闲和爱好上，而不是用来赚更多的钱。因为我不需要用镰刀割草，也不需要从井里打水，所以我选择摄影或者写作。因此，我们并不是纯粹被想获得更多的欲望所驱使的。\n\
    \n我们为什么不少干点呢？凯恩斯似乎看到了一些答案。根据他的说法，可能是因为对贫穷时代的记忆让我们无法集体性冷静下来，我们需要几代人的时间才能适应成为休闲阶层的一员。或者也许“与邻居攀比”在我们心中根深蒂固，我们永远无法安心休息——只要我们在吃早餐的时候能从窗口看到他们崭新的飞车，我们可能永远都不愿意休息哪怕一天。或者也许永久的休闲在某种程度上正在腐蚀我们，因此我们对它和它的诱惑有着深深的内在憎恶。或者当我们没有金钱的尺度来告诉我们该在工作上投入多少时，我们就还没有找到从工作中获得满足感的方法。或者，最令人不安的是，也许我们是贪婪的唯物主义者，凯恩斯曾说过，“爱钱并把钱作为一种财产，区别于把钱作为享受美好生活的手段”，他将这种状况定义为“半犯罪、半病态……的精神疾病”。\n\
    \n凯恩斯本人就死于过度劳累，所以即使是他，在这一点上也可能有些矛盾。\n\n另一种解释是，也许正是我们对现状的轻微不满驱使着我们走向永恒的进步。不管事情有多好，我们总能把它描绘得更好一点，而具有不懈地向前和向上的动力是我们独特的特点。也许我们与其说是理性的智人，不如说是不满足的人。\n\
    \n现在让我们来探讨这三种可能性的含义，每种情况下的未来会是什么样子？\n\n## 10 有机器人无法涉足的工作吗\n\n当我在谈论AI和机器人时，通常会被问到一些问答。到目前为止，观众问得最多的问题都类似于：“我的孩子今天应该学习什么，以确保他们将来能够就业？”作为一个有四个二十岁以下孩子的父亲，我也仔细思考过这个问题。\n\
    \n假设第一种可能性是真的，也就是说，如果所有的工作都被机器人夺去了，那么领导理论大师沃伦·G.本尼斯(Warren G. Bennis)的预言也将成为现实：“未来的工厂将只有两名雇员——一个人和一条狗。”人的职责是喂狗。狗的作用是防止那个人接触设备。换句话说，没有机器人不能做的工作。\n\
    \n但如果可能性二或可能性三成为现实，那么就会有机器人无法胜任的工作。它们会是什么样的？评估任何工作被自动化替代的可能性的一个好方法就是我所说的“培训手册测试”。想想从事你的工作所需要的一整套工作岗位说明书，其中涉及工作的所有细节、意外情况等。那份文件得多长？说明书越长，也就说明需要解释的情况、特殊案例和异常就越多。有趣的是，在调查中，绝大多数人认为自动化会毁掉大批工作岗位，但同时他们也认为自己的工作岗位是机器人无法涉足的。换句话说，大多数人认为他们的工作手册很长很复杂，而其他人的工作手册很短很简单。\n\
    \n培训手册测试之所以有效，是因为编写关于如何做一项工作的手册有点像编程计算机或机器人来完成一项工作。在程序中，每一步、每一个偶然事件、每一个异常都需要仔细考虑和处理。\n\
    \n有人想知道是否有一些工作是不能写下来的。谁能通过一套指令来创作奏鸣曲或写出一部伟大的小说呢？你如何回答我们提到的基本问题可能决定了你对此的看法。对于那些认为自己是机器的一元论者来说，创造力并没有什么神秘之处使得机器无法掌握，而持截然相反意见的人则把创造力看作是一种特别的、独特的人类能力。\n\
    \n下面是几组工作，不管你对机器人能力的看法如何，它们应该是长期稳定的：\n\n机器人能做但可能永远不会做的工作：有些工作是相当安全的，很多人都可以做，不管他们的智力、受教育程度或财力如何，因为尽管机器人能做这些工作，但对它们来说，这样做没有经济意义。下面来想想在未来100年里，人们偶尔才会需要的那些工作岗位。\n\
    \n我住在一栋建于19世纪的房子里，里面有几个壁炉。我想要使用它们，而不用一直提心吊胆它们是否会把房子烧掉，所以我叫来了“一个家伙”来修复旧壁炉。他看了一眼，然后开始滔滔不绝地说：“很明显在19世纪的某个时候，它们还没有被重建。当时，英国有一份报告规定……然后他又谈到十几件和壁炉有关的事，我已经走神了，因为很明显，这个人比我遇到的任何人都更了解壁炉，或者他是一个看起来有说服力的骗子，我永远也猜不透他。不管怎样，结果都是一样的，我雇他来维护我的壁炉安全。他是一个在很长一段时间内都不会被机器人取代的典型代表，他的职业将长期保持，以至于他的子孙后代都可能会继续从事这一行业。\n\
    \n有很多与之类似的工作：修理古董钟，平整横梁房屋，修复古典吉他等等。但是要确保你正在处理的对象不会消失。所以成为世界上最好的录像机修理工并不是我建议的职业道路。\n\
    \n我们不想让机器人做的工作：由于种种原因，有些工作我们不想让机器做。这个情形很简单，仅举几个例子：橄榄球运动员、芭蕾舞演员、精神导师、牧师和演员，此外，还有一些工作有一些怀旧的成分，比如铁匠或蜡烛匠。\n\
    \n不可预测的工作：有些工作非常捉摸不透，以至于你写不出岗位指导手册，因为其本质是不可预测的。我曾经担任过几家公司的首席执行官，我的工作基本上是：每天早上来解决遇到的所有问题，捕捉所有出现的机会。坦白说，很多时候我只是即兴发挥。记得有一天，我审查了一份租赁协议，后来集思广益想为新产品命名，最后还抓住了一只从天花板瓷砖上掉到办公桌上的大老鼠。如果有机器人能做到这一切，我今天就会为它付定金。\n\
    \n需要高社交智商的工作：有些工作需要与他人进行高水平的互动，通常还需要出色的沟通能力。比如活动策划人、公共关系专家、政治家、人质谈判专家和社交媒体总监，这只是其中的几个例子。想想那些需要同理心、愤怒或激情的工作。\n\
    \n现场工作：机器人很难完成需要就地应变的工作。机器人在完全受控的环境中，比如工厂和仓库运转良好，而到了临时环境例如苏阿姨的阁楼，情况就不一样了。类似的工作我能想到两种：护林员和电工，但还有更多。\n\
    \n需要创造力或抽象思维的工作：让计算机做需要创造力或抽象思维的工作，即使不是不可能的，也是很困难的，因为我们甚至不了解人类是如何做这些事情的。这种类型的工作包括作家(耶，我就是!)、商标设计师、作曲家、文案策划、品牌策划师和管理顾问。\n\
    \n还没有人想到的工作：所有这些新技术将创造无数的新工作。考虑到很多现有工作都是进入20世纪以后才出现的，有理由相信更多的新职业就在眼前。市场研究公司弗雷斯特预测，在未来10年内，美国将惊人地创造出1270万个新工作岗位，用于制造机器人和开发驱动机器人的软件。\n\
    \n小测验：机器人能做你的工作吗？\n\n这些是一些不太容易被自动化影响的工作。如果你想用一个快速测试来评估特定工作被自动化的可能性，我提供了以下内容。这是十个问题，每个问题的答案都可以在0分到10分的范围内得分。对于每个问题，我都举例说明了一些0分、5分和10分的例子。我的例子意在展示极端(0分和10分的情况)和中间情形(5分的情况)，你不应该仅仅用这3个数值来评分。可以使用7分、2分和9分，甚至偶尔使用2.5分。做完后，把它们都加起来。越接近于0分，你就越不可能从老板那里得到一个意外的解聘通知。越接近100分——你是否已经开始感觉到有什么东西在你的背上呼吸，那么这可能是机器人的冷却风扇，它即将取代你的工作。\n\
    \n- 1. 你的任意两个工作日有多么相似？\n  - 10 相同(数据录入员、快餐店的订餐员)\n  - 5 有些相同，有些不同(银行出纳员)\n  -\
    \ 0 完全不同(电工、电影导演、警察)\n- 2. 你的工作是否要求你去不同的地方，不同的房间也算？\n  - 10 不(“我整天站在一个地方接受订单”或“他们全都知道我可能在博拉博拉岛”)\n\
    \  - 5 有一些位置移动(医院护士)\n  - 0 是(室内装潢师、导游)\n- 3. 有多少人从事你的工作？\n  - 10 很多：这是一份大家都知道的既定工作(医生、律师、教师、园丁)。\n\
    \  - 5 一些：有些人可能听说过这个工作，但很少有人了解(布景设计师、跳伞教练、诚实的政治家)\n  - 0 很少：我必须向人们解释我是做什么的(作品经纪人、报关员)\n\
    - 4. 你的工作需要多长时间的培训?\n  - 10 几天(保管员)\n  - 5 几周(油田钻工、商业渔民、空乘人员)\n  - 0 几个月或几年(牙科保健师、汽车机械师、锁匠)\n\
    - 5. 你的工作是否有非重复性的动作要求？\n  - 10 没有(程序员、收银员)\n  - 5 一些(保安)\n  - 0 有(舞蹈教练)\n- 6.\
    \ 最难的工作决定需要多长时间完成？\n  - 10 2秒以内(电影票销售、收费亭操作员)\n  - 5 2~5秒(房屋油漆工)\n  - 0 5秒以上(出庭律师)\n\
    - 7. 你的工作是否需要与人建立情感联系或需要个人魅力？\n  - 10 不需要(打字员、建筑工人)\n  - 5 需要一些(律师、销售员)\n  - 0\
    \ 需要(喜剧演员、儿童心理学家、市长)\n- 8. 你的工作需要多少创造力？\n  - 10 不需要(仓库工人、流水线工人)\n  - 5 需要一些(厨师、旅行代办人)\n\
    \  - 0 需要很多(作家、网页设计师、花店店主)\n- 9. 你直接管理员工吗？\n  - 10 不(空乘人员)\n  - 5 管理一些(餐厅经理)\n\
    \  - 0 管理，我还做指导和培训(警察局长)\n- 10. 会不会有其他人和你的工作方式一样？\n  - 10 会，完全一样(打字员)\n  - 5 接近，可能有75%一样(牙医、房屋油漆工)\n\
    \  - 0 完全不同(编剧)\n\n你能想出一个完美的“0分”工作吗？根据我的统计，“人质谈判专家”的总得分接近10分，仅仅是因为他不管理任何人。“与新手搭档的人质谈判专家”很可能是0分，因为他要管理和培训新手，这一项就可以减去10分。重建我烟囱的那个人可能在他的工作岗位上得到22分；其中10分是因为他没有管理任何人，7分是因为这个工作不需要太多的魅力(他需要一点销售魅力)，5分是因为这个工作只需要一些创造力。\n\
    \n我们的目标不是找到一份接近0分的工作。任何低于70分的都是安全的，足以让你拥有一个漫长而辉煌的职业生涯。有很多“100分”的工作。在快餐店为你点餐的人可能非常接近100分。\n\
    \n将来会不会有一些人完全无法与机器竞争上岗？这取决于这三种可能性中哪一种会发生。\n\n第一种可能性是最简单的情况。在这种情况下，几乎没有什么事情是机器不能做的。出于怀旧的原因，人类可能还会从事一些工作，但对我们其他人来说，人类具有经济价值的时代将会结束。卡尔·马克思曾说过：“生产了太多有用的东西，却造就了太多无用的人。”这一可能性的实现将证明他的正确性。\n\
    \n第二种可能性也涉及失业人员。它背后的核心思想是，将有大量低技能工人无法与机器竞争。从这个角度来看，未来的经济价值等级体系从高到低依次为：技能人才、机器人、低技能的工人。\n\
    \n在这种情况下，不用多长时间，机器人就能做很多低技能的工作。每替代一份工作，失业的非技术工人的数量就会增加，非技术工作岗位的数量就会减少。因此，世界上将会有越来越多的非技术工人竞争越来越少的非技术岗位。\n\
    \n有些人认为，我们已经见证了这种情况发生。为了支撑他们的观点，他们提出了劳动参与率(the labor participation rate)，这个指标表示了目前工作的成年人占所有成年人的百分比。2000年该指标达到峰值(即67%)，现在下降了大约4个百分点。这一结果意味着越来越多的人完全退出了就业市场。放弃一切，就此打住(失业率只反映了正在找工作的人，所以这些人没有计算在内)。\n\
    \n事实证明，周期性经济周期因素和婴儿潮一代的退休是造成劳动参与率下降的主要原因，但有1%左右的下降不包含在内。这1%是未来事物的先兆吗？当然，我们预计劳动参与率会随着我们变得更富有而下降，对吧？也许夫妻双方都不用再工作了，或者也许某人今年得到一笔巨额奖金，他打算休一年的假。我认为，我们很难把失业工人失去工作并对获得新工作不抱希望的说法投射到这些数据上。众所周知，很难从经济数据中得出心理结论。\n\
    \n另一些人指出，自2000年以来，我们的生产率不断提高，同时工资水平持平，就业增长缓慢。他们将这种数据组合视为一个确定的迹象，表明雇主通过投资技术而不是人力来发展业务，从而降低了对人\n"
