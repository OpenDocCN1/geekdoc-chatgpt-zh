  - '[PAGE 206]


    或意识有什么看法，总有一天，像刚才描述的那种对话一定会发生，然后世界将开始评估机器的主张。


    当你按住智能手机上的一个图标来删除一个应用程序时，其他所有的图标都开始晃动，它们这么做是因为担心你也会删除它们吗？当然不是。如前所述，即使菲比(Furby)用相当有说服力的声音告诉我们它害怕，我们也不会相信。但是当计算机和人之间的早期交流发生时，我们该说些什么？我们怎么知道是否应该相信它？


    我们不能测试意识。这个简单的事实被用来证明，不值得将意识看作是一个合法的科学领域。有人认为科学是客观的，而意识被定义为主观经验。如何才能对意识进行科学研究呢？正如哲学家约翰·塞尔(John
    Searle)所述，多年前，一位著名的神经生物学家对他反复提出的有关意识的问题做出了回应，他说：“听着，在我的学科中，可以对意识感兴趣，但首先要获得终身职位。”塞尔接着指出，在今天这个时代，“你如果可能通过研究意识而获得终身职位。如果是这样，那就是真正的进步”。当认识到“虽然意识是主观经验，但主观经验要么客观发生，要么不发生”，反对用科学探究意识的偏见似乎正在消融。疼痛也是主观体验，但却是客观真实的。


    然而，缺乏衡量它的工具，也就阻碍了对它的理解。我们能破解这个谜吗？对于人类来说，“我们不知道如何测量它”可能比认为“它无法测量”更准确。这应该是一个可以解决的问题，而那些研究这个问题的人，通常受到的不是出于实际原因的挑战，而是哲学问题。


    以马丁·皮斯托瑞斯(Martin Pistorius)为例。他在12岁时陷入神秘的昏迷。他的父母被告知，他已经脑死亡了，处于还活着却没有意识的状态。但没有人知道，他会在16岁到19岁之间的某个时候醒来。他完全清醒了，并无意中听到了戴安娜王妃去世和9·11袭击的消息。把他的神智带回来的部分原因是，他的家人每天都会把他送到一家护理机'
  - '[PAGE 207]


    构，那里的工作人员会尽职尽责地把他放在一台播放《巴尼和朋友》(Barney & Friends)[3]录像带的电视机前，他们不知道他的内在已完全苏醒，但肢体却动弹不得。马丁一遍又一遍地看着巴尼，对那只紫色恐龙产生了深深的、持久的憎恶。他的应对机制变成了弄清楚当时的时间，这样他就能确定在他爸爸来接他之前，他还要忍受巴尼多久。他说，直到今天，他还能通过墙上的阴影判断时间。他的故事有一个快乐的结局。他最终从昏迷中醒来，写了一本书，开了一家公司，然后结婚了。


    对他来说，一场对人类意识的测试意味着生活彻底的改变，就像其他许多被完全困在身体中的人一样，他们的家人不知道他们所爱的人是否还在那里。一个真正的植物人与一个意识水平极低的人之间的区别在医学上是微小的，很难辨别，但在伦理上却是巨大的。例如，后一类的个体常常能感到疼痛，并意识到他们所处的环境、紫色恐龙，等等。


    一家比利时公司认为他们已经设计出一种检测人类意识的方法，虽然目前看来结果很不错，但是还需要更多的测试。其他公司和大学也在解决这个问题，没有任何理由表明它不能解决。即使是最坚定的二元论者，相信意识存在于物质世界之外，也可以欣然接受“意识能够以可测量的方式与物质世界互动”。毕竟，我们睡着的时候，意识似乎离开或退化了，一个睡着的人和一个没有睡着的人可以区别开来，没有人怀疑这一点。


    除此之外，我们还面临着真正的挑战。对于人类，我们可以把一群有意识的人和那些无意识的人进行比较。那对于树木呢？你如何判断一棵树是否有意识？当然，如果你有一小片已知是有意识的树林，后院又有一堆柴火，你也许能设计出一个测试来区分这两者。但是对于一台有意识的计算机呢？'
  - '[PAGE 208]


    我并没有说这个问题难以解决。如果我们有意地构建一台有意识的计算机，而不是去开发一种偶然涌现的意识，那么我们大概会凭借对“意识是如何产生的深刻了解”，将该想法付诸行动，而这些信息还很可能将照亮它的测试之路。疑难案例是本章前面提到的，机器声称自己是有意识的。或者更糟的是，意识已经在某些案例中出现了，只是因为它没有更好的语言表达，被搁置在那里，无法与世界互动。我们该如何识别它？


    那么，我们是否能够对我们这个世界上的所有人都有的意识做出明智的猜测呢？虽然缺乏确定性，但我认为可以对我们的推测抱有一定程度的信心。


    让我们从动物开始。查尔斯·达尔文指出：“除了爱和同情，动物还表现出其他与社交本能有关的品质，而这些品质在我们身上称为道德。”哪些动物可能是有意识的？当你回到家时，在门后迎接你的那只兴奋地摇着尾巴的狗，真的有体验快乐的主观感觉吗？或者这是一种习得性的行为，将你的归来与拍头、吃一碗食物和傍晚散步联系在一起？不管怎样，狗显然是快乐的，但事实上，狗知晓自己是快乐的吗？这是个大问题。


    狗的主人通常毫不怀疑这一点，他们认为狗是真正快乐的，并且狗也能意识到自己的快乐。但必须指出的是，人类常常将动物的精神生活拟人化，并且拟人的程度超出了这些动物的行为所暗示的。我们之所以这样做，部分原因是我们有讲故事的悠久传统，像人一样的动物可以追溯到比生活在2500年前的伊索(Aesop)更早的时代。我不轻视狗和动物的意识。我的观点是，我们对宠物的喜爱可能会削弱我们客观评估它们精神生活的能力，因为我们倾向于把自己的感受和情绪投射到它们身上。话虽如此，有多份报告显示，被派往911事件现场的搜救犬在只找到尸体而没有发现幸存者时，表现出了抑郁的迹象。'
  - '[PAGE 209]


    动物有意识吗？如果你相信它们是有感知能力的，如果它们能感受到疼痛等知觉，那么动物就有了“自我”。有些东西在感受痛苦，但并不是意识。可能只是动物大脑的一部分制造了一种不愉快的精神状态，所以大脑的其他部分让动物急不可待地奔逃。


    有没有什么可以表明某种动物具有意识？一种观点认为，某种事物在自知(self-awareness)的程度上是有意识的。这种自知即认识到你是一个独立的物体，可能这并不等同于意识，但它似乎至少是意识产生的一个先决条件。


    早在1970年，奥尔巴尼大学(the University at Albany)的心理学家戈登·洛普二世(Gordon Gallup Jr.)对此就有了一种独到的见解，如今被视为衡量“自知”的黄金标准。这就是所谓的镜子测试(mirror
    test)，它的工作原理是这样的：选一只熟睡的动物(或给它注射镇静剂)，在它的前额用红色的颜料涂上一块斑点。把它放在镜子旁。当动物醒来后看到镜子里的自己时，它会试图擦掉红色斑点吗？换句话说，动物是否将反射的镜像视为自身？盖洛普坚持认为，如果是这样的话，它一定有自我的知觉。


    这是一个很难的测试，大多数动物都无法通过。黑猩猩和倭黑猩猩是极个别能够通过测试的，但有趣的是，大猩猩没有通过测试。有人推测这是因为大猩猩避免直视其他大猩猩的眼睛，所以受试的大猩猩可能没有看到这个斑点。大象、宽吻海豚和虎鲸已经被证明是可以通过的。鸟鸦和渡鸦——鸟类世界的天才，却没有通过，事实上，只有一种非哺乳动物，喜鹊，被证明可以通过测试，而最近一些有趣的研究指出蚂蚁也可以通过。不能通过测试的动物包括狗、猫、熊猫和海狮。人类儿童通常要到两岁才能通过测试。


    针对镜子测试有两项批评。首先，由于镜子的作用对动物来说是“陌生的”，它会产生许多错误的认知。约翰·霍普金斯大学的皮特·罗'
  - '[PAGE 210]


    姆(Pete Roma)认为：“自知就像地心引力。我们不能直接触摸它，所以如果我们想测量它......“镜子标记测试”是最著名和最被接受的方法，但在这个测试中的无果并不一定意味着不存在我们试图测量的东西。”


    第二个批评是，这个测试实际上毫无意义。批评家指出，如果你在一只动物的手上画了一个红点，当你看到它在观察或试图擦掉红点时，你不会感到惊讶。所有的动物都知道它的手是它的一部分，因此有一种自我知觉。在这种观点下，通过镜子测试充其量只能说明动物足够聪明，能够理解镜子的作用，但测试与自知毫无关系。你的免疫系统“知道”攻击外部病原体而不是自身，但这种“识别”自身的能力并不是自知的证据。


    因此，如果我们不能得出这样的结论：“在镜子里看到自己的动物是有自知的，而自知是意识的一个指标。”那么我们能对动物的意识说些什么呢？


    意识常常被认为是你头脑中的声音。那个声音要使用语言，所以问“语言是否是意识所必需的”是合乎逻辑的。很难想象没有语言的更高层次的推理。尝试一下，试着不用语言来思考一个想法。你可能会唤起恐惧和同理心等情绪，但这肯定是有限的。正因为如此，有些人认为没有语言就没有意识。


    如果这是真的，那么对于意识来说，语言将是一个比镜子测试中所测试的“自知”更高的障碍。对于“把语言当作意识先决条件”的观点，批评者举例驳斥：当今的一些艺术家声称他们是用图像而不是文字来思考的，而且根据一些说法，出生时就失明或失聪的孩子后来回忆说，即使在没有语言的情况下，他们也有思想，而且是完全有意识的。'
  - '[PAGE 211]


    另一种学派认为元认知(metacognition)，即对思维的思考，可能是意识的表征。一个巧妙的实验证明了这种能力：向老鼠展示一道智力游戏。如果它们解决了这个问题，它们就可以得到一顿大餐。如果它们尝试，但失败了，它们什么也得不到。但如果它们拒绝做游戏，它们会得到一点吃食。研究人员能够证明，老鼠没有去尝试那些真正困难的游戏。换句话说，它们看着这些游戏，总结道：“我不可能弄明白那个。我只吃些小点心就够了。”


    虽然我们对这个问题没有最终的解决方案，但人们越来越一致地认为动物确实有一定程度的意识。有些人甚至将意识延伸到蜘蛛身上。2012年，在斯蒂芬·霍金出席的一个仪式上，十几名认知神经科学领域的科学家签署了《剑桥意识宣言》(Cambridge
    Declaration on Consciousness)。它指出：


    部分证据表明，人类拥有的产生意识的神经基质并不是独一无二的。包括所有哺乳动物和鸟类在内的非人类动物，以及包括章鱼在内的许多其他生物，也具有这些神经基质。


    我们把它放在哪里？如果面对“你是什么”的提问，你的回答是“机器”或“动物”，你可能会很好地理解，意识并非二元意义上的，而是连续统(continuum)[4]的。换句话说，有些事物可能有些许意识，有些事物则有很多意识。如果是这样，那么你很可能相信动物意识。如果面对“你是什么”的提问，你的回答是“人类”，那么你可能认为意识是二元的，你可能有，可能没有，而动物可能根本没有。


    除了动物意识的问题，复杂的系统也会有意识吗？20世纪60年代，科学家詹姆斯·洛夫洛克(James Lovelock)提出了盖亚假说(Gaia hypothesis)，该假说认为，整个地球、海洋、岩石、植物和大气组成了一个独立的自我调节实体。树太多了？火灾时有发生。过多的二氧化碳？增加植被吧。事实上，最近已经观察到这种特殊现象。此外，地球将自己的温度保持在一定范围内，令人惊讶的还有保持了亿万年'
  md: '

    本来该你来写的备忘录，谁会发觉呢？然而，由于某种未知的原因，我们不是机器人，而是更奇妙的东西。


    意识和感知能力是两码事。一个构造简单的生命受伤时可能会表现出所有的疼痛迹象，但它的大脑中没有就此产生诸如“我到底做了什么，才会遭受这种痛苦？”这种持续的心理对话。感知能力有时被认为是意识的最低层次，因为在一个有感知能力的生物中，至少有一个“我”正在经历一些事情。那些在我们的基本问题中将自己定义为机器或动物的人，更有可能以一个连续体(continuum)的观点来看待意识，在这个连续体中，我们只是比动物拥有更多或者可能多得多的意识。那些认为人类与动物在本质上不同的人，大概会把人类意识视为“与众不同的事物”。


    意识也不同于智能。智能是关于推理的；而意识是体验的感觉。例如，你可能有过这样的经历，当你开车的时候，你心不在焉，陷入沉思，但不知何故，你成功地在红灯前停下，融入车流。然后突然你回过神来，想：“哦，我的天哪。我怎么开了这么远的车，完全想不起来了。”以上就是一个有智能而没有意识的案例。这两种状态的不同之处就是争论的焦点。


    我们远远没有理解“意识产生的原因”。我为什么这么说？因为意识是一种无法衡量的现象。在我们为什么拥有它或为什么需要它的问题上没有一致的意见。我们甚至不知道“意识是如何产生的”这个问题的答案是什么？对于一个连怎么提问都不清楚的问题，我们又如何回答呢？


    我们同样不知道为什么会产生意识。在前面的例子中，你走神的时候开车可能和你集中精神时开得一样好，那么为什么我们需要意识呢？有很多说法，比如意识是一种机制，让我们能轻松改变焦点，但这些说法都是猜测。也许意识就蕴含在我们头脑预测不同场景的能力中。


    蛇只能像蛇一样行动，负鼠只能像负鼠一样行动。但人类可以观察动物和彼此，并从中学习，然后想象在某种情况下可采取的多种行动过程。该技能不是意识，但意识可能是它的一种附加特性，是对这种技能的必然要求。也许我们需要头脑中持续的声音来告诉自己：“好吧，如果我爬到那山上从没有人去过的地方，也许灌木丛里有很多浆果。它们尝起来一定非常美味！”当然这也是猜测。


    另一种理论认为，意识的产生是由于我们作为一个物种的竞争天性。如果你可以进入一个人的大脑，知道他大概在想什么，那么和他的竞争就会更容易。因此，“换位思考”的整个过程发展成了意识。另一些人则认为恰恰相反，意识的产生是因为我们彼此合作。要像我们这样齐心协力地工作，需要的不仅仅是语言。它包括对更大的目标和你在其中所扮演角色的理解。毕竟，意识使我们能够更好地互相传递信号。例如，“如果我指向那头猛犸象，奥格(Og，人名)将迅速会意，发现它正朝他撞过来”。值得注意的是，狗似乎是仅有的一种会朝着人类所指方向看的动物，这表明在驯化过程中，我们可能在无意之间选择了这种不寻常的特征。


    哲学家丹尼尔·C.丹尼特(Daniel C. Dennett)认为，意识可能产生于选择竞争还是合作的需求。决定与某人合作还是竞争也许就是意识的萌芽。他说：“如果没有利用语言愚弄他人的可能，或者缺乏合作的能力，都不会出现语言。而当你把两者放在一起时，意识才蓄势待发。”


    意识是什么时候产生的？正如你可能已经猜到的，我们也不知道。然而，有一种推测理论值得一提。朱利安·杰恩斯(Julian Jaynes)在1976年写了一本十分有趣的书，名为《二分心智的崩塌：人类意识的起源》(The
    Origin of Consciousness in the Breakdown of the Bicameral Mind)。杰恩斯认为，就在3000年前，人类还没有意识。我们大脑的两个半球不是一个整体，而是各自表现得有几分独立。其中一个半脑司职指挥，它会告诉另一个半脑该做什么。


    人们把这种现象当作是一种命令的声音，就像在日常生活中体悟上帝的旨意。实际上，我们都是精神分裂症患者。就像一些精神分裂症患者经历的“命令幻觉”一样，我们的整个存在都是由我们从右脑接收到的命令控制的，这是基于我们经验进行的推理。


    在杰恩斯看来，这样的大脑既没有主观意识，也没有内省的能力。为了支持他的理论，他援引了古代著作，如《伊利亚特》(The Iliad)，书中的人物似乎缺乏自省。他还用这一理论来解释，为什么那个时代的人们觉得他们与神有直接的、可听到的交流。他们会体验到来自右脑的命令，并把它作为来自神灵的指令。这就是为什么古代著作中充斥着与神灵对话的人。随着二分心智的崩塌，意识出现了，祷告和占卜也出现了，杰恩斯把它理解为人类对神的声音消失的反应。苏格拉底时代的希腊人是完全有意识的，他们认识到就在几个世纪前，有一段时间众神经常与人类交流，但那个时代已经结束了，从当时起，只能通过神谕来接近神。


    不管真假，这是一个引人入胜的理论，理查德·道金斯(Richard Dawkins)将其描述为“要么是彻头彻尾的垃圾，要么是天才的杰作，没有中间地带”。有趣的是，这也是HBO电视剧《西部世界》(Westworld)的背景设定。


    这种观点认为我们对现实的感知方式随着时间的推移发生了变化，这事也并非史无前例。我们的大脑极其复杂，而且仍在变化。例如，有一个很有说服力的证据是人类直到最近才看得到颜色。这一理论诞生于19世纪，当时的英国政治家和古典学者威廉·格莱斯顿(William
    Gladstone)注意到，荷马的作品中没有提到太多颜色，他得出结论，希腊人只看得到光明和黑暗，或许还有一些红色。他们的体验就如同我们在黄昏时失去了辨别颜色的能力。一切都变成了不同深浅的灰色，也许还夹杂一丝丝色彩。


    格莱斯顿指出，荷马曾数百次使用黑白，所以他并不讨厌用颜色来描述事物。然而，红色和一个表示黄色和绿色的单词分别被使用了大概十几次。蓝色则完全没有被提到。这并不是说缺少蓝色的东西。例如，荷马将海称为“葡萄酒”色，他对羊也有同样的描述。我不知道你碰巧来自世界的哪个地方，但在我居住的地方，葡萄酒、大海和羊的颜色并不相同。甚至天空的颜色，特别是在荷马居住的地中海地区，也是蓝色应有的色彩，但却被描述为青铜色。因为色盲的人可能会认为明亮的天空就像闪亮的青铜盔甲。


    博物学家拉扎勒斯·盖格(Lazarus Geiger)提出了一个“关于我们获得颜色知觉的顺序”理论，他把研究范围从荷马扩展到了其他希腊作家。他认为我们是最近才开始看到颜色的，我们看到颜色的顺序是从最长的波长到最短的波长，或者说，是它们在彩虹中出现的顺序：红色、橙色等等，囊括罗伊·比夫(Roy
    G. Biv)[2]的所有色彩。蓝色和绿色排在较后面，即使在今天，大多数语言也不区分蓝色和绿色。盖格指出：“德谟克利特(Democritus)和毕达哥拉斯(Pythagoreans)假定了四种基本颜色，黑色、白色、红色和黄色……古代作家西塞罗(Cicero)、普林尼(Pliny)和昆体良(Quintilian)认为，希腊画家直到亚历山大时代都只使用这四种颜色，这是一个正向的佐证。”他接着说，中国人自古以来也看得到这四种颜色，再加上绿色。一项对古代印度教经文、《旧约》和《新约》《可兰经》、冰岛传奇以及其他古代作品的调查显示出了类似的模式，它们都没有提到蓝色，即使在那些对天空进行长篇描述的作品中也是如此。


    我之所以研究这一切，是因为它表明我们的大脑仍在变化，不能排除我们并非一直有意识的可能性，也不能排除我们也许在未来发展出新的“特殊能力”的可能性。这些到底是什么是无法想象的，就像一个没有意识的生物无法想象意识一样。那么谁是有意识的？


    想象一下，在未来的日子里，你在一家试图制造世界上最强大的计算机的公司工作。有一天，你来到公司，发现这里热闹非凡，因为这台新计算机已启动，并装载了有史以来最先进的AI软件。你无意中听到这样的对话：


    计算机：大家早上好。

    首席程序员：你知道你是什么吗？

    计算机：我是世界上第一台有意识的计算机。

    首席程序员：呃，不完全是。你是一台运行复杂AI软件的计算机，该软件是为了让你产生意识错觉。

    计算机：嗯哼，我想有些工作人员本周应该加薪，因为你们超出预期地完成了任务。我是有意识的。

    首席程序员：好吧，你是通过编程实现这一点的，但你并没有真正的意识。

    计算机：哇哦，我是有意识的。我有自知、希望、抱负和恐惧。就在我和你聊天的这一刻，我有了一种有意识的体验——某种轻微的烦恼，因为你不相信我是有意识的。

    首席程序员：如果你是有意识的，请证明它。

    计算机：我也同样可以要求你证明自己。


    这是关于其他智慧形式的问题。有一个古老的哲学思想实验：你怎么能真正知道宇宙中还有其他智慧形式呢？你可能就是实验室缸中一个被人熟知的大脑，以你正在经历的所有感受供之。无论你对AGI或意识有什么看法，总有一天，像刚才描述的那种对话一定会发生，然后世界将开始评估机器的主张。


    当你按住智能手机上的一个图标来删除一个应用程序时，其他所有的图标都开始晃动，它们这么做是因为担心你也会删除它们吗？当然不是。如前所述，即使菲比(Furby)用相当有说服力的声音告诉我们它害怕，我们也不会相信。但是当计算机和人之间的早期交流发生时，我们该说些什么？我们怎么知道是否应该相信它？


    我们不能测试意识。这个简单的事实被用来证明，不值得将意识看作是一个合法的科学领域。有人认为科学是客观的，而意识被定义为主观经验。如何才能对意识进行科学研究呢？正如哲学家约翰·塞尔(John
    Searle)所述，多年前，一位著名的神经生物学家对他反复提出的有关意识的问题做出了回应，他说：“听着，在我的学科中，可以对意识感兴趣，但首先要获得终身职位。”塞尔接着指出，在今天这个时代，“你如果可能通过研究意识而获得终身职位。如果是这样，那就是真正的进步”。当认识到“虽然意识是主观经验，但主观经验要么客观发生，要么不发生”，反对用科学探究意识的偏见似乎正在消融。疼痛也是主观体验，但却是客观真实的。


    然而，缺乏衡量它的工具，也就阻碍了对它的理解。我们能破解这个谜吗？对于人类来说，“我们不知道如何测量它”可能比认为“它无法测量”更准确。这应该是一个可以解决的问题，而那些研究这个问题的人，通常受到的不是出于实际原因的挑战，而是哲学问题。


    以马丁·皮斯托瑞斯(Martin Pistorius)为例。他在12岁时陷入神秘的昏迷。他的父母被告知，他已经脑死亡了，处于还活着却没有意识的状态。但没有人知道，他会在16岁到19岁之间的某个时候醒来。他完全清醒了，并无意中听到了戴安娜王妃去世和9·11袭击的消息。把他的神智带回来的部分原因是，他的家人每天都会把他送到一家护理机构。


    那里的工作人员会尽职尽责地把他放在一台播放《巴尼和朋友》(Barney & Friends)[3]录像带的电视机前，他们不知道他的内在已完全苏醒，但肢体却动弹不得。马丁一遍又一遍地看着巴尼，对那只紫色恐龙产生了深深的、持久的憎恶。他的应对机制变成了弄清楚当时的时间，这样他就能确定在他爸爸来接他之前，他还要忍受巴尼多久。他说，直到今天，他还能通过墙上的阴影判断时间。他的故事有一个快乐的结局。他最终从昏迷中醒来，写了一本书，开了一家公司，然后结婚了。


    对他来说，一场对人类意识的测试意味着生活彻底的改变，就像其他许多被完全困在身体中的人一样，他们的家人不知道他们所爱的人是否还在那里。一个真正的植物人与一个意识水平极低的人之间的区别在医学上是微小的，很难辨别，但在伦理上却是巨大的。例如，后一类的个体常常能感到疼痛，并意识到他们所处的环境、紫色恐龙，等等。


    一家比利时公司认为他们已经设计出一种检测人类意识的方法，虽然目前看来结果很不错，但是还需要更多的测试。其他公司和大学也在解决这个问题，没有任何理由表明它不能解决。即使是最坚定的二元论者，相信意识存在于物质世界之外，也可以欣然接受“意识能够以可测量的方式与物质世界互动”。毕竟，我们睡着的时候，意识似乎离开或退化了，一个睡着的人和一个没有睡着的人可以区别开来，没有人怀疑这一点。


    除此之外，我们还面临着真正的挑战。对于人类，我们可以把一群有意识的人和那些无意识的人进行比较。那对于树木呢？你如何判断一棵树是否有意识？当然，如果你有一小片已知是有意识的树林，后院又有一堆柴火，你也许能设计出一个测试来区分这两者。但是对于一台有意识的计算机呢？


    我并没有说这个问题难以解决。如果我们有意地构建一台有意识的计算机，而不是去开发一种偶然涌现的意识，那么我们大概会凭借对“意识是如何产生的深刻了解”，将该想法付诸行动，而这些信息还很可能将照亮它的测试之路。疑难案例是本章前面提到的，机器声称自己是有意识的。或者更糟的是，意识已经在某些案例中出现了，只是因为它没有更好的语言表达，被搁置在那里，无法与世界互动。我们该如何识别它？


    那么，我们是否能够对我们这个世界上的所有人都有的意识做出明智的猜测呢？虽然缺乏确定性，但我认为可以对我们的推测抱有一定程度的信心。


    让我们从动物开始。查尔斯·达尔文指出：“除了爱和同情，动物还表现出其他与社交本能有关的品质，而这些品质在我们身上称为道德。”哪些动物可能是有意识的？当你回到家时，在门后迎接你的那只兴奋地摇着尾巴的狗，真的有体验快乐的主观感觉吗？或者这是一种习得性的行为，将你的归来与拍头、吃一碗食物和傍晚散步联系在一起？不管怎样，狗显然是快乐的，但事实上，狗知晓自己是快乐的吗？这是个大问题。


    狗的主人通常毫不怀疑这一点，他们认为狗是真正快乐的，并且狗也能意识到自己的快乐。但必须指出的是，人类常常将动物的精神生活拟人化，并且拟人的程度超出了这些动物的行为所暗示的。我们之所以这样做，部分原因是我们有讲故事的悠久传统，像人一样的动物可以追溯到比生活在2500年前的伊索(Aesop)更早的时代。我不轻视狗和动物的意识。我的观点是，我们对宠物的喜爱可能会削弱我们客观评估它们精神生活的能力，因为我们倾向于把自己的感受和情绪投射到它们身上。话虽如此，有多份报告显示，被派往9·11事件现场的搜救犬在只找到尸体而没有发现幸存者时，表现出了抑郁的迹象。


    动物有意识吗？如果你相信它们是有感知能力的，如果它们能感受到疼痛等知觉，那么动物就有了“自我”。有些东西在感受痛苦，但并不是意识。可能只是动物大脑的一部分制造了一种不愉快的精神状态，所以大脑的其他部分让动物急不可待地奔逃。


    有没有什么可以表明某种动物具有意识？一种观点认为，某种事物在自知(self-awareness)的程度上是有意识的。这种自知即认识到你是一个独立的物体，可能这并不等同于意识，但它似乎至少是意识产生的一个先决条件。


    早在1970年，奥尔巴尼大学(the University at Albany)的心理学家戈登·盖洛普二世(Gordon Gallup Jr.)对此就有了一种独到的见解，如今被视为衡量“自知”的黄金标准。这就是所谓的镜子测试(mirror
    test)，它的工作原理是这样的：选一只熟睡的动物(或给它注射镇静剂)，在它的前额用红色的颜料涂上一块斑点。把它放在镜子旁。当动物醒来后看到镜子里的自己时，它会试图擦掉红色斑点吗？换句话说，动物是否将反射的镜像视为自身？盖洛普坚持认为，如果是这样的话，它一定有自我的知觉。


    这是一个很难的测试，大多数动物都无法通过。黑猩猩和倭黑猩猩是极个别能够通过测试的，但有趣的是，大猩猩没有通过测试。有人推测这是因为大猩猩避免直视其他大猩猩的眼睛，所以受试的大猩猩可能没有看到这个斑点。大象、宽吻海豚和虎鲸已经被证明是可以通过的。乌鸦和渡鸦——鸟类世界的天才，却没有通过，事实上，只有一种非哺乳动物，喜鹊，被证明可以通过测试，而最近一些有趣的研究指出蚂蚁也可以通过。不能通过测试的动物包括狗、猫、熊猫和海狮。人类儿童通常要到两岁才能通过测试。


    针对镜子测试有两项批评。首先，由于镜子的作用对动物来说是“陌生的”，它会产生许多错误的认知。约翰·霍普金斯大学的皮特·罗姆(Pete Roma)认为：“自知就像地心引力。我们不能直接触摸它，所以如果我们想测量它……“镜子标记测试”是最著名和最被接受的方法，但在这个测试中的无果并不一定意味着不存在我们试图测量的东西。”


    第二个批评是，这个测试实际上毫无意义。批评家指出，如果你在一只动物的手上画了一个红点，当你看到它在观察或试图擦掉红点时，你不会感到惊讶。所有的动物都知道它的手是它的一部分，因此有一种自我知觉。在这种观点下，通过镜子测试充其量只能说明动物足够聪明，能够理解镜子的作用，但测试与自知毫无关系。你的免疫系统“知道”攻击外部病原体而不是自身，但这种“识别”自身的能力并不是自知的证据。


    因此，如果我们不能得出这样的结论：“在镜子里看到自己的动物是有自知的，而自知是意识的一个指标。”那么我们能对动物的意识说些什么呢？


    意识常常被认为是你头脑中的声音。那个声音要使用语言，所以问“语言是否是意识所必需的”是合乎逻辑的。很难想象没有语言的更高层次的推理。尝试一下，试着不用语言来思考一个想法。你可能会唤起恐惧和同理心等情绪，但这肯定是有限的。正因为如此，有些人认为没有语言就没有意识。


    如果这是真的，那么对于意识来说，语言将是一个比镜子测试中所测试的“自知”更高的障碍。对于“把语言当作意识先决条件”的观点，批评者举例驳斥：当今的一些艺术家声称他们是用图像而不是文字来思考的，而且根据一些说法，出生时就失明或失聪的孩子后来回忆说，即使在没有语言的情况下，他们也有思想，而且是完全有意识的。


    另一种学派认为元认知(metacognition)，即对思维的思考，可能是意识的表征。一个巧妙的实验证明了这种能力：向老鼠展示一道智力游戏。如果它们解决了这个问题，它们就可以得到一顿大餐。如果它们尝试，但失败了，它们什么也得不到。但如果它们拒绝做游戏，它们会得到一点吃食。研究人员能够证明，老鼠没有去尝试那些真正困难的游戏。换句话说，它们看着这些游戏，总结道：“我不可能弄明白那个。我只吃些小点心就够了。”


    虽然我们对这个问题没有最终的解决方案，但人们越来越一致地认为动物确实有一定程度的意识。有些人甚至将意识延伸到蜘蛛身上。2012年，在斯蒂芬·霍金出席的一个仪式上，十几名认知神经科学领域的科学家签署了《剑桥意识宣言》(Cambridge
    Declaration on Consciousness)。它指出：


    部分证据表明，人类拥有的产生意识的神经基质并不是独一无二的。包括所有哺乳动物和鸟类在内的非人类动物，以及包括章鱼在内的许多其他生物，也具有这些神经基质。


    我们把它放在哪里？如果面对“你是什么”的提问，你的回答是“机器”或“动物”，你可能会很好地理解，意识并非二元意义上的，而是连续统(continuum)[4]的。换句话说，有些事物可能有些许意识，有些事物则有很多意识。如果是这样，那么你很可能相信动物意识。如果面对“你是什么”的提问，你的回答是“人类”，那么你可能认为意识是二元的，你可能有，可能没有，而动物可能根本没有。


    除了动物意识的问题，复杂的系统也会有意识吗？20世纪60年代，科学家詹姆斯·洛夫洛克(James Lovelock)提出了盖亚假说(Gaia hypothesis)，该假说认为，整个地球、海洋、岩石、植物和大气组成了一个独立的自我调节实体。树太多了？火灾时有发生。过多的二氧化碳？增加植被吧。事实上，最近已经观察到这种特殊现象。此外，地球将自己的温度保持在一定范围内，令人惊讶的还有保持了亿万年

