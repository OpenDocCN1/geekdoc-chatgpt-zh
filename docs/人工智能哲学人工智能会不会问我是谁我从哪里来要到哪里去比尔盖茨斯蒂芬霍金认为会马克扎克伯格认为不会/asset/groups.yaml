  - '[PAGE 20]


    语系的语言更早的语言，巴斯克人中还流传一个传说，亚当和夏娃在伊甸园中也讲巴斯克语。


    语言的多功能性和复杂性着实令人叹服。拿英语为例，虽然大部分人日常中只使用大约25 000个英文单词，但当今的英语至少含有100万个特有的单词。尽管新词增加的速度正在减缓(在过去，比如莎士比亚(Shakespeare)，早饭之前就会生造出三个新单词)，但每个小时都有约一个新的英文单词被创造出来。而最近造成生造新单词速度减缓的首要原因是自动拼写检查程序的出现，该程序对此类的生造词绝不姑息，它会自动检测文中所谓的“新词”，并在该单词下面用红色线标记。除非你想发出一封满是红色下划线的邮件，否则最好还是老老实实使用默认列表中的官方词汇。


    在第一纪，也就是我们通过使用语言和火，作为狩猎采集者而生活的，大约10万年的时间里是怎样的景象？当时总人口在20万上下，所以即便我们不是一个濒临灭绝的物种，人类的生存也充满了不确定性。然而，实际情况无疑是多种多样的，当时的人类仍有相当一部分生活在公有制社会。直到1700年，全球范围内仍有超过5000万狩猎采集者。所以对于存于现代的狩猎采集者，我们有大量的第一手观察资料。甚至到了今天，最权威的统计数据表明，仍存在超过100个与世隔绝的狩猎采集部落，总人数超过10
    000人。


    如果说现代狩猎采集者的例子体现了农业出现前人类的生存方式，我们能够断定维持生计绝不是一件轻而易举的事，可能一场急病就会导致个体死亡。所以，公有制的原型很可能起源于此，每个人对于帮助他人都怀有一种强烈的、利己主义动机，因为哪怕一个社会中最强壮的成员也有需要别人帮助的一天。由于这个原因，会共享的群体比自私的个人更具适应性。另外，在狩猎采集的生活中，积累财富并没有什么意义，一整天挖来的毛毛虫不是财富，就算当它是财富，'
  - '[PAGE 21]


    也无法保存。日复一日，当时的人类勉强维持着贫瘠的生活，只是为了在凛冽的冬天或者在遭遇一头暴戾的猛犸象时能够活下去。


    透过浪漫主义的“玫瑰色眼镜”，卢梭(Rousseau)的现代追随者倾向于回顾第一纪，回归到一个更加质朴的时代：人与自然和谐共处，没有被现代世界的纸醉金迷所玷污。但如果大多数人真的回到那个时代去体验生活，很可能会发现这些旧时光并没有那么美好。首先，那个时代充满暴力。哈佛大学(Harvard
    University)的心理学家史蒂芬·平克(Steven Pinker)基于对古代人类遗骸的研究估计：近六分之一的古代狩猎采集者死于他人的暴力。作为对比，发生了两次世界大战的“血腥”20世纪，只有三十分之一的人命丧于此。因此，我们可以信心百倍地说，古代狩猎采集者的生命是短暂的、痛苦的和残酷的。但这就是人类的试验场，在语言的加持下，我们踏上了通往现代之路。


    # 02 第二纪：农业和城市


    在大约10万年的漫长年月里的每一天，人们聚集在一起，边打猎采集边闲聊生活之道。10万年后，一些戏剧性的事情发生了——我们发明了农业，再次彻底地改变了人类和我们的社会。农耕时代发生在短短的10
    000年前，当时地球上的人口数量为400万左右，只比现在的洛杉矶人口多一点。这就意味着，在9万年的时间里，我们的人口数量只增长了4~5倍，增长幅度微弱得难以置信，亦表明了我们的生活是不稳定的。


    与语言一样，农业也是一项技术，它触发了一系列其他领域的进步，其中首要的进步当数城市的出现。农业发展需要人类在一个地方安顿下来，城市因此应运而生，而这种实践几乎是创造性的。早期的城市，比如恰塔霍裕克(Çatalhüyük)[10]、杰里科(Jericho)[11]、阿布胡赖'
  - '[PAGE 22]


    拉(Abu Hureyra)，通常位于河流附近，以获取水源和肥沃的农田，并围绕它们建立了市场、住宅和寺庙。在第二纪里，我们开始使用鸦片，掷骰赌博，化妆和佩戴黄金首饰。


    城市促进了商业和思想交流，但它们也让我们完全地、不可逆转地定居下来。我们常驻于此，通过堤坝和梯田改造这片土地，我们筑起栅栏，我们埋葬死者并建成墓地，以便日后祭奠。这些以及其他种种习俗，就像钉死棺材的铆钉，牢牢地锁闭了我们的流浪天性，已经没有回头路了。


    伴随农业而来的第二个进步是“劳动分工”。虽然劳动分工看起来并不复杂，但其产生的巨大影响促使它成为人类历史上的重要里程碑。通过劳动分工，每个人不再做个体生存所必需的所有事情，而是专注于更精细的工作，效率得以提高，从而带来巨大的经济增长。随着贸易和技术的进步，劳动分工成为传统经济理论中仅有的三个“免费午餐”之一，即在任何人都不更加努力工作的条件下，仅通过劳动分工就可以增加整体财富。


    农业没有直接引起劳动分工，它首先让我们建立了城市，城市又产生了劳动分工。这究竟是怎么一回事？原来，当大量人口群居而生时，劳动分工最为有效。远离邻居生活的农民无法实现真正的专业化，他们必然事事亲力亲为，却无一精通。想象一下，如果你抛开自己可能很擅长的本职工作，变得自己要做一切事情，从缝制衣服到自制肥皂，那将会多么没有效率！最古老城市的考古证据表明，从第二纪开始，这些地方出现了一系列不同的职业。当人类开始大规模地成群聚居，他们就获得了专业化带来的不可思议的经济优势。


    劳动分工使得人与人之间的合作从原来可选择的渐渐变成必要的。经济学家伦纳德·里德(Leonard Read)[12]写的一篇著名文章《我，'
  - '[PAGE 23]


    铅笔》(I, Pencil)中，描述了一件复杂又简单的事情：没有任何人知道如何制作一支简单的铅笔，铅笔还是被制作出来了，这是因为数百个不同领域的、从未谋面的人分工协作，每个人都力所能及地参与了铅笔的诞生过程。事实上，劳动分工给予了我们今天所拥有的一切，没有它，我们就不复存在。


    伴随着城市发展的另一项技术是在有组织作战中使用的武器，它们的发明是出于保卫城市中财富的需求。最早期的城市通常都会花费巨资，投入大量人力物力来修筑城墙，这意味着当时存在的入侵风险，或者至少人们认为会被入侵。


    由于农业和城市的出现，人类首次拥有了土地私有权。他们将一块区域视为自己的领土，并尽可能长期守护领土。第二纪初期的考古证据表明，土地边界往往是很明确的。哲学家让·雅克·卢梭(Jean
    Jacques Rousseau)认为这种做法是我们现代世界的开端，他同时说：第一个圈地并宣布这块地属于他，而其他人天真地相信了他，那么这个人就是公民社会(civil
    society)[13]真正的创始人。


    农业和私有土地终结了第一纪的经济平等。能力、出身和运气的先天不平等，导致了不均衡的财务积累。虽然当时还没有现代意义上的货币出现，但财富的概念确已存在。人们可以拥有土地、牲畜和储存谷物的粮仓。这种财富可以无限期地积累，一个人的富裕程度是没有上限的。由于土地可以耕种，牛也可以繁殖，早期的财富就是积累的源头。因此，财富的持有量趋于增长。鉴于财富可以代代相传，它得以在多个生命周期中积累和汇集。


    不幸的是，人类被奴役也始于第二纪。在狩猎采集者的世界里，不存在财富，或者至多是短暂拥有、只能持续一两天的财富。所以奴隶制在经济上几乎毫无意义。但是随着城市土地所有权的出现以及财'
  - '[PAGE 24]


    富的积累，我们天生的占有欲被点燃，加上被贫困时期的记忆所激发，对财富的渴望似乎是无止境的，至少在某些人身上是这样。那些狂热地工作以赚取他们的第二个10亿美元的人就证明了这一点，尽管他们很清楚，他们赚的第一个10亿美元是十辈子都花不完的。


    对于一个没有人权或自由的概念的世界来说，奴隶制并没有带来真正的伦理挑战。直到后来，随着文明的进步，才意识到这种制度是不道德的。


    随着时间的推移，一些人聚集了比其他人更多的土地和资本。当社会越来越富裕，复杂性也应时而生。贸易变得更加成熟，科技的进步，城市的发展，所有这些的共同发展提高了一个人可以积累的财富上限。


    农业革命的一个意想不到的后果是，虽然可以生产出更多的粮食，但粮食也可以被扣留。这在狩猎采集者的世界是不可能的，但随着城市和农业的发展，扣留粮食成为当权者压制反对者的一种方式，而分发粮食则是为了确保服从，在当今世界的一些地方仍然如此。


    正是在这样的背景下，第二纪的人被划分为统治者和被统治者，出现了贵族和皇室。统治阶级享有特权，例如穿某种类型或颜色的衣服，吃某种食物，或者，就阿兹特克(Aztecs)[14]统治者来说，闻某种类型的花。而这些都是明令禁止被统治阶级做的事情。


    自由和平等之间的矛盾首次被展现在人类面前。正如历史学家威尔·杜兰特所指出的那样，鱼与熊掌不可兼得，你只能选择一个。真正自由的人将变得不平等，而被强迫平等的人又是不自由的。这场拉锯战至今仍在上演。'
  - '[PAGE 25]


    早些时候，我提到想象力是进步的首要条件，而农业给了我们第二个条件。由于种植和收割作物需要规划，而狩猎和采集则不需要，我们可以将农业的发明视为对未来的概念的发明，这是进步的第二个必要条件。


    # 03 第三纪：文字和车轮


    火让我们烹饪食物，用来供养我们的大脑，大脑又反过来产生语言，让我们能够一起工作，形成抽象思考，创造故事。10 000年前，农业让我们安顿下来，建设城市，并积累财富。城市的肥沃土壤孕育出劳动分工，而劳动分工促进了经济增长和创新。


    第三纪始于5000年前，那时生活在现今伊拉克南部的苏美尔人(Sumerians)[15]可能是第一个发明文字的人类，大约在同一时期，埃及和中国似乎也都独立发展了自己的文字，有学者认为中国才是最早的文字发明者，而后在现今的墨西哥也开发了自己的文字。文字改变了人类，因为这是第一次，一个人所知道的东西可以在他死后被完好地保存下来。知识可以完美地复制和传播到世界各地，人的想法可以脱离人的头脑而长久存在！


    以上这些好处都不是发明书写的原因。最早期的文字是为了记录资产和交易现随后逐渐扩展延伸到法律文书、法律规范和宗教典籍，戏剧和诗歌等创造性的写作则出现得更晚一些。


    起初，正如人们所预料的那样，这个星球上的1000万人口中很少有人会阅读。因为书写的花费很高，不仅学习读写要投入大量的时间，而且“纸张”的选择十分有限，要么是纸莎草纸，要么是烤黏土，要么是大理石，要么是其他贵得离谱的材料。所以读写能力的普及十分缓慢。'
  - '[PAGE 26]


    但是文字的力量使它迅速扩展到生活的各个方面，并由此改变了世界。没有这项技术，我们的现代世界将会怎样？书写是人类历史上重大的分水岭。按照定义，启蒙时代和农耕时代是史前时代，历史始于5000年前的第三纪。


    不是所有人都认为文字是个好发明。柏拉图(Plato)在他的著作中描述了一位伟大的国王，他斥责创造文字的神：


    这项发明将使那些使用它的人健忘，因为这些人不再练习他们的记忆力......你发明的灵丹妙药是用来提醒的而不是用来记忆的，你教给你的学生的只是智慧的表象，而非真正的智慧。


    柏拉图是对的，文字确实会伤害我们的记忆力。就像我们用火来“外包”我们的消化能力一样，文字也“外包”了我们的记忆力。在文字发明之前，如果你想知道一些事情，最好用脑子记住它，因为除此之外无计可施。古代历史蕴含的线索暗示着一个诱人的猜想：人类曾经拥有强大的记忆力。与那个时代的人相比，如今的我记忆差到记不住ATM机的密码。但是我们的记忆力并没有随着文字的发明而立即退化，因为在很长时间里书籍仍然是不常见的。而现在大多数知识都来自谷歌搜索，我们的记忆可能会进一步衰退。


    就像我们探索过的其他关键技术一样，文字也带来或促进了一系列新技术的发展。第一个就是车轮，大约在5000年前与文字同时出现。车轮和文字就像花生酱和果酱一样，形影不离。它们扩展了商业，帮助了信息的流动，促进了旅行。文字意味着统治者可以制定法律法规，而车轮让这些法规得以广泛传播和实施。


    早期的法律法规非常稀少，以至于在不止一种文化中，统治者在掌权之前被要求熟记每一条法律。因为法律屈指可数，你没有理由不去记住它们，正是在这个时期出现了“背不出法律不是借口”这句格言，尽管现在我们仍然这么说，但实际上恰恰相反：在一个有着数百'
  - '[PAGE 27]


    万页法律的国家，背不出似乎是一个很好的借口。早期的法典，如有4000年历史的《乌尔纳姆法典》(The Code of Ur-Nammu)，明确规定了对谋杀、抢劫、绑架、强奸、作伪证、侵犯他人身体以及与土地所有权有关的各种犯罪的具体处罚措施，如淹没邻居的田地、未能耕种租来的田地和偷偷耕种他人的田地等。比《乌尔纳姆法典》晚了两三个世纪的《汉谟拉比法典》(The
    Code of Hammurabi)，包含282条法律，涵盖了以上的所有内容，同时还增加了合同执行、产品责任和继承的内容。


    货币也出现在第三纪。像我们今天这样的压印硬币直到很久以后才被发明，但在第三纪早期，世界各地出现了金、银、贝壳和盐等十几种其他形式的货币。普遍认为金属是理想的交易媒介，因为它们有价值，可分割，耐用便携。冶金学本身开始于第三纪之初，人类很快就认识到锡和铜的结合可以冶炼出优于两者的青铜。


    随着文字、车轮和金钱的同时出现，建立民族国家和帝国所需的基本要素已经就位。几乎在同一时期，我们看到了全世界范围内首批大型文明以独立各异的形态绽放。中国、印度河流域、美索不达米亚、埃及和中美洲全都成为了幅员辽阔、凝聚力强、繁荣昌盛的文明家园。没有人知道这些文明是如何在彼此没有联系的地方，几乎同时如约定好一般崭露头角的。文字也是一样，没有人知道，世界为什么在5万年前或者2万年前没有文字、车轮和农业呢？


    因此，就我们讲述的人类历史来说，我们有语言、想象力、劳动分工、城市和对未来的概念，我们还有了文字、法律规范、车轮、合同和金钱。在接下来的几千年中，所有这些都使我们能够相对快速地发展技术。


    直到近代，我们的世界一直处于第三纪。虽然过程中发生了令人难以置信的创新，例如蒸汽机的研制、电力的利用以及活字印刷的发'
  - '[PAGE 28]


