    仅仅几年之后，在尼克松总统的领导下，美国就成为了有史以来最接近UBI的国家。尼克松和参众两院一样支持这项法案，但它在参议院财政委员会夭折，成为政治内斗的受害者。


    UBI如何执行？在其最纯粹的形式下，UBI不进行经济情况调查。每个人都能得到它。在这方面，它就像阿拉斯加永久基金(the Alaska Permanent
    Fund)一样，每年一次向阿拉斯加的每个人支付同等份额的本州产油资产收益。无经济情况调查UBI的支持者认为，这是UBI获得政治保护的唯一途径。他们指出，社会保障之所以神圣不可侵犯，正是因为它具有普遍性。此外，社会保障和阿拉斯加永久基金也不被视为福利，因此不会比在一家新汽车经销店盛大开业时抓一个免费热狗吃更让人感到耻辱。他们认为，经济情况调查将使其成为一个政治目标，并使其蒙羞，并仍将要求穷人“毕恭毕敬”地接受测试。


    不进行经济情况调查的原因显然在于成本。让我们来看一些数字。在美国，我们有17万亿美元的国民生产总值。联邦预算是4万亿美元，州预算是1.5万亿美元，地方预算是1.5万亿美元。这意味着在一个17万亿美元的经济体中，我们的政府成本是7万亿美元，或者说正好是40%。


    美国的贫困线是每年人均1.2万美元。UBI要确保没有人低于这一水平。因此，它将每月支付1000美元给每个美国人。考虑到我们的人口是3.2亿，每月将花费3200亿美元，即每年大约5万亿美元。所以，在经济体量还是17万亿美元的前提下，政府的成本却将增加到12万亿美元，大体相当于国民生产总值的70%。当然，在理论上，当你有UBI的时候，你会取消一些其他的政府项目，比如食品券，这可以贴补一部分UBI成本。


    现在，这个分析有点误导人，因为政府将会收集大量的现金并在扣除手续费后立即支出。但无论以何种标准衡量，这都将使政府获得前所未有的经济总量。70%的总税率意味着中产阶级和富人的税率超过70%，以抵销穷人的较低税率，因为穷人大概不希望税率达到70%。当然，世界以前也经历过高税收。20世纪60年代，英国政府对披头士乐队(The
    Beatles)的大部分收入征收98%的税。这就解释了为什么他们的歌曲《收税员》以“让我告诉你怎么做/你留一块，十九块给我……百分之五是不是好像太少了/我没全部拿走你就应该心存感激了”开头。这种税收水平显然是令人窒息的，创作这样的歌词也不足为奇了。


    关于UBI的成本，有人建议，应将其系统安排在现有的成本总额制度范围内。即通过缩减其他成本，为UBI集结资金，因此他们要求废除社会保障、医疗保险、医疗补助、食品券，以及所有其他涉及向个人转移或补贴的政府项目。随着收入的增加，他们还打算适度减少福利。批评这一安排的人士认为，它将从本应有资格享受这些服务的穷人那里收取资金，并支付给富人，而后者同样也能获得UBI。


    另一种情况是，我们最终采用了UBI。考虑到教育、医疗和住房的价格都在上涨，政府也许只能以一种有效的方式补贴这三个领域。先例已经树立：事实上，在美国，房屋税减免的利息代表着一种事实上的补贴。其理由是：普遍的房屋所有权对其本身是有益的，国家通过这种方式鼓励人们添置房产。同样在健康和公民教育领域也是如此。


    UBI的另一种选择形式就是不保证收入，只保证工作。这可以采取以下几种形式之一。首先，我们可以重新定义什么是工作。目前，哪些活动能给你带来收入、哪些活动不能给你带来收入、哪些活动能把你归类为就业者，哪些活动不能把你归类为就业者，这似乎有点随机。如果你照顾自己年迈的父母，那就不是一份工作，你处于失业状态，但如果你照顾别人年迈的父母，你就算有工作了。在当地食品银行做全职志愿者的退休人员算是无业人员，而同一家食品银行的兼职办公室经理就是就业状态，并领取工资。我们可能会想出办法，让所有以任何身份“工作”的人都被认为是被雇用的，并能得到报酬。虽然这样的制度有可能被滥用，但通过一系列的代金券和信用额度，它将是切实可行的。它保留了工作所能带来的尊严和目标，并肯定了每个人都有某种贡献社会的方式。


    对政府来说，致力于为失业者提供培训和教育的项目更合理、也更能给予失业者力量。几乎所有人都认可，授人以鱼不如授人以渔。要真正实现经济转型，这些项目需要在现有基础上大幅增加。


    另一种保证就业的方法是政府雇用失业者，就像它在大萧条时期所做的那样。政府作为一个最后兜底的雇主，可以雇用1000万人，每年付给他们每个人35000美元，政府还要管理这个项目，并保证其大体占国民生产总值的3%。试想一下，1000万人是如何被安置工作的：建造基础设施、粉刷壁画、种植树苗，以及其他100万项活动，这些活动绝不是“无用工作”。在大萧条时期，工程进度管理署(the
    Works Progress Administration)雇用了数百万人，并利用他们的联合劳动将19世纪的美国基础设施升级改造，带入了20世纪。类似的推动我们进入21世纪的努力或许也即将到来。


    什么样的社会力量会反对UBI？富人吗？也许会。但是，对于未来不得不在生活区域设置路障，以隔离日益骚动的暴徒的设想，可能足以激励一些人支持UBI。若非如此，怎么连亿万富翁中最铁石心肠的埃比尼泽·斯克鲁奇(Ebenezer
    Scrooge)[18]也赞成对富人征收高税率并配以UBI呢？UBI将为埃比尼泽的产品创造客户，因此他可能会推断，他可以把所有的税款连同其他亿万富翁支付的一大笔钱一起收回。


    UBI的批评者对它的评价往往是很尖刻的。奥伦·卡斯(Oren Cass)在为《国家评论》(National Review)撰写的文章中写道：“依赖政府救济的下层阶级将不再是社会面临的最大挑战之一，而是将被重塑为最值得骄傲的成就之一。”其他针对UBI的批评包括，它剥夺了人们从事生产性工作所能得到的尊严，它破坏了自力更生，它让每个人在经济上完全独立于他人，从而破坏了家庭。此外，没有工作的人容易成为没有目标的人，长期的休闲会导致大脑和身体机能衰退。简而言之，谋生需要促进自力更生，赋予生活以目标，并使我们每个人都能作为一个整体中相互依存的一部分参与社会。目标在这里非常重要。著名记者、风险投资家埃丝特·戴森(Esther
    Dyson)就这个话题展开了雄辩：“我在俄罗斯生活过一段时间，我发现那里的女人比男人好过得多。男人中的很大一部分都在漫无目的地讨生活，做着无用的工作，挣得很少的工资，然后他们的妻子拿着卢布，排队领取食物并抚养孩子。”


    UBI会引起通货膨胀吗？可能。如果所有生活在贫困线以下的人突然被提高到贫困线以上，他们就会花钱。因此，富人不会花掉的钱将重新分配给穷人，而穷人会花掉这些钱。这将导致对商品和服务的需求急剧增加，从而引发通货膨胀。


    当一个国家的人均国民生产总值上升时，贫困标准也会相应拉升。然后建立安全保障体系，确保每个人都生活在贫困线以上。那些居住在美国的人是幸运的，他们生活在一个足够富裕的国家，甚至可以参与今天这样的辩论。全球人均国民生产总值为9000美元，但在美国，我们将贫困线定义为人均12000美元。换句话说，我们是如此富有，我们贫困线比全球平均收入高出33%。


    但是，对于那些无力就UBI或“重新定义就业”或“重新培训人口以适应未来就业”展开辩论的国家会怎样呢？“最底层的10亿人”会发生什么？也就是那些每天设法靠不到两美元维持生存的人，他们会永远贫穷吗？他们确实提出了一个看似棘手的问题：教育缺乏、基础设施差、营养不良、医疗保健不足以及政府经常功能失调的困扰，他们仍然必须在无情的世界里竞争，在这个世界里，一个人可以赚取的最高工资上限在他可以创造的价值内。他们现在必须和机器人竞争吗？技术将再次引领向上的道路。我们会在第五部分中更详细地探讨这一点，但现在只需要说，那些赋予人们能力并促进人们自给自足的技术，诸如互联网、3D打印、手机和太阳能，给予了这个星球上最贫穷的人心怀希望的真正理由。虽然对于富人来说，技术为其提供了500个分散注意力的渠道，但它会给穷人带来干净的水、便宜的食物和100种释放他们潜能的方法。


    那么，我们会采用UBI吗？如果第一种可能性发生，是的，我们极有可能会采用。


    如果第二种可能性发生，也很大概率会采用UBI。正如加州大学伯克利分校公共政策教授、美国前劳工部长罗伯特·赖克(Robert Reich)所言：“在(UBI)被认真对待之前，中产阶级需要经历比以往多得多的工作岗位和工资流失。不幸的是，这些损失是不可避免的。我们将在大约10年后就最低基本收入问题进行严肃的讨论。”


    如果第三种可能性发生，那么UBI是不太可能的，因为经济增长将缓解其需求。


    ## 12 机器人在战争中的应用


    大多数关于自动化的公共讨论都与就业有关，这就是为什么我们花了这么多时间来研究它。第二个发生实质性讨论的领域是机器人在战争中的应用。在过去的几千年里，技术已经几十次改变了战争的面貌。冶金、马、战车、火药、马镫、大炮、飞机、原子武器和计算机都对我们互相残杀的方式产生了重大影响。机器人和AI将再次改变它。


    我们是否应该制造能够根据编程设定的要素做出自主杀戮决定的机器人武器？支持者坚持认为，机器人可以减少平民死亡人数，因为机器人将精准地遵守协议，不会滥杀无辜。在一瞬间，一个士兵，由于遭受疲劳或恐惧，可能会犯一个致命错误。然而，对于机器人来说，它所需的刹那间就能完成任务，没有疲劳、恐惧，更没有致命错误。


    这很可能是真的，但这并不是世界各国军队采用AI机器人的主要动机。这些武器之所以吸引他们，有三个原因。首先，它们在执行任务时比人类士兵更有效；其次，军队担心潜在的对手正在开发这些技术，所以想先发制人；最后，他们将通过部署机器人来减少军队的人员伤亡。最后一个原因有一个令人不寒而栗的副作用：它可以降低战争的政治成本，从而使战争变得更加普遍。


    目前的核心问题是，是否应该允许机器独立决定杀死谁和放过谁。当我说眼前的决定是我们是否应该建造杀手机器人时，并没有过于夸张。这里没有“我们是否有能力建造”的疑问，没有人怀疑我们能做到。问题是：我们应该吗？


    许多从事人工智能研究但不与军方合作的人认为我们不应该这样做。1000多名科学家签署了一封公开信，敦促禁止完全自主的武器系统。史蒂芬·霍金在2014年撰写的一篇社论中表示，这些武器最终可能会通过AI军备竞赛的形式毁灭整个人类。


    尽管关于是否建立这些系统看似存在着激烈的争论，但似乎又有些言不由衷。机器人应该被允许做出杀戮决定吗？从某种意义上说，它们的杀戮行为已经存在了一个多世纪了。人类很乐意埋下数百万颗地雷，以无差别的方式炸掉一名士兵或一名儿童的腿。这些武器有AI的基本形式：如果某物的重量超过50磅，它们就会引爆。假设一家公司在市场上推出了一种地雷，它可以区分儿童和士兵，也许是通过重量或步幅来判断的吧。那么这种地雷就会被投入实战，因为它们提高了杀伤效力。这样会更好，对吧？出于同样的原因，如果一种新的地雷模型能在爆炸前嗅出火药的气味，它也会被广泛使用。以市场为导向，很快你就能以这种方式让机器人在没有人类参与的情况下做出杀戮决定。诚然，目前地雷是被条约禁止的，但它们在如此长时间内的广泛使用表明，我们默许了武器系统中相当多的附带损害。无人机战争、导弹和炸弹都同样不精确。它们都是一种类型的杀手机器人。我们不太可能拒绝更有鉴别能力的杀人机器。然而，我渴望在这一点上被证明是错误的。北卡罗来纳大学(University
    of North Carolina)的物理学家，和平、战争与国防课程副教授马克·古布鲁德(Mark Gubrud)教授表示：对于自主武器，美国有一个“假装谨慎和负责的政策，但实际上该政策为自主武器的蓬勃发展和早期使用扫清了道路”。


    然而，建造这些武器系统对抗威胁是真实存在的。2014年，联合国就其所称的“致命自主武器系统”举行了一次会议。该会议发表的报告称，恐怖分子也在寻求这些武器，他们很可能会得到这些武器。此外，目前世界各地不乏正在开发的武器系统，都在不同程度上利用了AI。俄罗斯正在开发一种机器人，它可以利用雷达、热成像和摄像机的组合，在四英里之外探测并射杀人类。一家韩国公司已经在出售价值4000万美元的自动炮塔，根据国际法，该炮塔会向两英里内的任何潜在目标发出“请转身离开，否则我们就开枪”的信号。它需要一个人来下达杀戮的决定，但这只是一个因客户需求而添加的功能。事实上，地球上每个拥有庞大军事预算的国家，大概总共有二十多个国家，都在致力于开发AI驱动的武器。


    即使人们达成了共识，又该如何禁止这种武器？核武器之所以能够得到控制，有一部分原因是它们很明了。爆炸要么是由核装置引起的，要么不是。没有灰色地带。另一方面，带有AI的机器人是灰色的。一件武器需要存在多少人工智能才会被认为是非法的？地雷和终结者之间的区别只是其AI化的程度多少的问题。


    GPS技术设计有内置限制。对于速度超过每小时1200英里或高于60000英尺的物体来说，它将失效。这是为了防止它被用来引导导弹。但是软件几乎是不包含内置限制的。因此，为武器系统提供动力的AI可能会得到广泛应用。这些系统的硬件与传统的恐怖主义武器相比是昂贵的，但与更大的常规武器系统相比则是相当廉价。


    考虑到这一切，我怀疑禁止这些武器的努力不会奏效。即使机器人的程序是识别一个目标，即使机器人被编程来识别目标，然后需要人类批准才能摧毁它——很明显，只要按下开关，批准步骤就可以被关闭。这一幕最终无疑会发生。


    AI机器人可能会被视为一个对国家安全迫在眉睫的威胁，以至于让一些国家觉得他们必须冒险拥有它们，以抵抗威胁。在冷战期间，美国经常担心与潜在敌对国家的军事力量存在明显或可能的差距。我想起了20世纪50年代的轰炸机缺口和20世纪60年代的导弹缺口。一些人的工作职责就是警惕来自意图伤害世界的人所制订的计划，对于他们来说，人工智能的差距甚至更可怕。


