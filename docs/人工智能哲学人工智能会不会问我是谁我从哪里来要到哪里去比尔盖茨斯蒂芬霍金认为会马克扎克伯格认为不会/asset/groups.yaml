    # 23 解决所有的技术问题


    # 饥饿、贫困和疾病


    饥饿、贫困和疾病这三大灾难，自我我们诞生以来就一直困扰着人类。它们让我们非常痛苦，以至于我们认为它们几乎是不可避免的。但真的是这样吗？还是说，它们只是技术问题，正处于我们能着手解决的风口浪尖？


    首先，饥饿本质上是一个技术问题。我们不是必然要挨饿的，我们只是还没有解决它。


    在第二纪的开端，随着农业的发明，想养活所有人类需要90%的人口从事农业，这种状况持续了10 000年，即使到了1800年，美国还有超过80%的人口在种植粮食。到1900年，这一比例已减半至40%，仅仅30年后，这个比例又下降了一半，降至20%，接下来的减半只花了25年，在1955年降到10%。到现在为止该指数又两次减半，今天的比例略高于2%。这就是技术显现的力量。


    然而，世界上仍然有大约8亿的饥饿人口，其中许多是儿童。事实上，五岁以下儿童50%的死亡可归结于饥饿或营养不良。我们可以每天花25美分为发展中国家的一名饥民提供食物，这意味着每年花费大约700亿美元，就可以让地球上的所有饥民吃饱，相当于全球在宠物食品上的花费。


    一个普遍存在的误解是，认为造成饥饿人口的原因是地球正在超负荷养活不断增长的人口，事实并非如此。世界上只有大约三分之一的耕地用于农作物生产，而就这三分之一的耕地的使用效率还很低。比如，中国每英亩的农作物产量比美国高得多，这主要是因为，尽管'
  - '[PAGE 252]


    两国的国土面积相当，但中国的人口是美国的三倍，人均耕地面积只有美国的六分之一，所以中国人必须更高效地种植农作物。事实上，即使只算在美国扔掉的粮食都足以养活世界上所有的饥民。


    对世界上存在饥饿人口的另一个解释是：从根本上说这是一个分配问题，证据是：“其实有足够的粮食，但出于政治原因，你无法将其给予民众。”可实际情况并非如此。当然，有些地方把粮食当作资本，以至于某些群体无法获得粮食，但这只占全球饥民数量的2%左右。


    世界上有近10亿的饥饿人口，很明显造成他们饥饿的原因不是单一的，但最大的原因无疑就是贫困。世界上79%的饥饿人口生活在粮食净出口国。怎么会这样呢？这些国家的人民之所以挨饿，是因为该国生产的产品在世界市场上的售价超过了当地居民的支付能力。在现代，你不会因为没有粮食而挨饿，但你会因为没有钱而挨饿。所以真正的问题是，从全局看，食物太贵了，而很多人太穷了，负担不起。解决方案是保持粮食成本降低的趋势。


    幸运的是，有了像AI和机器人这样的技术，我们可以做很多事情来降低粮食价格，终结饥饿。AI将给我们提供惊人的新见解，告诉我们应该在何地种植何种作物，以及在何处销售。除此之外，我们可以培育更好的种子，并传播有关灌溉、施肥和作物轮作的赋权信息。每位农民拥有智能手机后，会比十多年前的任何人都更擅长耕作。而得益于技术进步，收益率上升的同时，成本还会下降。


    如果你仔细想想，我们并没有像看起来那样把技术真正应用到农业上。我们种植粮食的方式在10 000年间并没有发生根本的改变。你把一粒种子埋在地里，期待降雨，然后静待粮食的丰收。我觉得，随着我们开始“制造”粮食，这种传统种植方式将不会成为未来的常态。当我们可以3D打印美味、健康、廉价的食物时，为什么还要种植呢？'
  - '[PAGE 253]


    将来每个人都可能成为素食者，而且是一个严格的素食主义者，因为人造肉更便宜、更美味、更健康、更环保。如果人造牛排像真牛排一样渗血，味道比你吃过的最好的牛排更好，并富含营养，而价格只需几美分，谁还会买“真”牛排呢？我是以一个资深的烧烤爱好者的身份来说这一切的，所以我阐述的并不只是能不能吃的问题。随着时间的推移，我猜想我们会认为吃真正的动物是野蛮的，甚至有点恶心。我们可能会停止制作与真牛排形似的人造牛排。现在我们已经习惯了吃那些看不出原来是什么动物的加工过的肉(比如热狗、汉堡和鸡块)，因为保持它们的传统形状只会令人不快地想起一个更原始的时代。


    人造肉的广泛使用将导致牛、猪、山羊、绵羊、鸡、火鸡等动物数量的大幅下降。在马身上就发生了类似的事情，因为我们不再用马来运输和做农活了，但至少马是有个性的。我在农场长大，我可以告诉你，养一头宠物牛可没有什么乐趣，它们既不能像狗一样跳到空中接飞盘，也不能像猫一般蜷缩在你的膝盖上发出咕噜咕噜的声音。


    如果饥饿问题的根本原因是贫困，那么贫困又是什么引起的呢？我想我们也正在解决贫困的路上。贫困也是一个技术问题，而人工智能、机器人科学和我们开发的所有其他技术将在全世界范围内缔造繁荣。正如我们前面所讨论的，尽管收入不平等的问题可能会加剧，但几乎可以肯定的是，贫困会被消除。为何如此乐观呢？


    如果你把过去2000年的人类平均收入画出来，你会得到一条近乎平滑的直线，发现这条线几乎在所有的时间里都是平的，直到1700年左右，它突然急转弯，像火箭一样急剧上升，之后就从未动摇，从未回落。随着平均收入的翻倍增长，我有充分的理由相信这条线会继续飙升。关于这一切是如何发生的，科学方法是如何引发工业革命，以'
  - '[PAGE 254]


    及如何打开一个前所未有的创新时代的，前面我们已经详细地讨论过了。


    然而贫困依然存在。是的，虽然它已大幅下降，虽然地球上的人均收入约为每天30美元，但有10亿人每天仅靠2美元生活。那么这些人摆脱贫困的途径又是什么呢？


    尽管我们可以从1900年左右开始，以类比的方式，更有针对性地谈论贫困率，但它对我们的现状影响不大。所以让我们跳到1980年，当时世界人口有40亿，其中50%的人每天的生活费不足2美元(该数据是根据通货膨胀调整后得出的)。到1990年，这个数字下降到35%，也是在那一年，联合国定下了在25年内使贫困人口减半的目标。这个目标最后只用了20年就达成了，因此联合国在2010年再次召开会议，制定了一个新的目标：到2030年彻底消除贫困，这个目标我们很有希望实现。目前，世界上大致有12%的人(将近10亿人)生活在贫困中。这个群体被称为“底层10亿人”，帮助他们摆脱贫困已经成为一项真正的挑战。


    即使我们按照这个目标消除贫困，这项工作还有提升的空间。也就是说上文所说的每人每天不到2美元的生活费，每年约为700美元，相当于一个四口之家年收入3000美元左右。因此，在实现2030年的目标之后，下一个目标应该是让每人每天的收入都超过3美元，这是一种可以衡量的更好的生活方式，然后再努力提高到10美元，达到目前全球的中位数。


    如此艰巨的任务，我们究竟怎样才能实现呢？答案是提高生产率。每天工作12小时的人不可能通过成倍增加工作时间来使收入翻倍，他们必须让每一个工作单元更有效率，当然，这也是通过技术实现的。通过提高生产率，世界上最贫穷的地区将会脱贫，考虑到技术增长的速度，这一天会很快到来。想想手机，在1994年，世界上只有'
  - '[PAGE 255]


    1%的成年人拥有手机；到2020年，预计90%超过6岁的人口都将拥有一部手机。手机是一种增强能力的技术，通过提高信息传播的速度，可以真正增加劳动力。再想想互联网，在1997年，世界上只有1%的人可以上网；现在这个数字是50%，未来将上升到接近100%。互联网让人们自由访问巨量的知识宝库，并提供了买卖商品的新方法，极大地增强了人类劳动。


    有了人工智能，每个人的智能手机里都将拥有世界上最好的医生、教育工作者、机械师、治疗师、水管工、私人教练、营养师等等。无须任何代价，作为文明伟大礼物的巨大知识宝库将向每个人敞开。互联网赋予我们力量，但仅仅获取信息，并不等同于拥有比这些知识更高级的人工智能。人工智能影响我们所做的每一个决定，有效促进了地球上现有人类的能力，使之比以往任何一个人都更加聪明和智慧。人工智能让最贫穷的人也能获得与最富有的人同样的知识。知识真的是一种力量，一种让自己的生活变得更好的力量。创新将源源不断地涌现，为底层10亿人提供摆脱贫困、分享现代世界巨大财富所需的工具。


    关于我们的第三个灾祸——疾病，它也是一个技术问题。疾病没有必然存在的理由，它的存在只是因为我们还没有找到消除它的方法。我们有信心根除它。为何如此乐观？


    想一下有史以来最严重的疾病：天花。该病困扰了人类10 000年，仅在20世纪，它就造成4亿人死亡，比历史上所有战争中死亡的人数加起来还要多。想想看那是多么可怕的场景，但我们消灭了它！爱德华·詹纳(Edward
    Jenner)在18世纪90年代发明了牛痘疫苗，这是十分惊人的举动，因为其发生在微生物理论的开发者——路易斯·巴斯德(Louis Pasteur)出生之前。也就是说在我们还不知道天花是由病毒引起'
  - '[PAGE 256]


    的时候，就已经学会了接种天花疫苗，接种的技术也很简单，不比石刀割熊皮难多少。


    但是想想我们今天能用我们的技术做些什么。我们可以从本质上瓦解我们的病理学敌人，未来我们要用计算机模拟它们，在顷刻之间尝试10 000种治疗方法。此外，我们正着手深入了解人类基因组，并已经开始针对特定病人的疾病制订治疗方案。最后，我们有大数据，可以不限量研究患某些疾病患者的病史，从中提炼出最细微的信息，这些信息为创造治愈方法提供了线索。阿里·帕萨博士和很多人一样致力于研究“能够比医生更好地诊断和治疗疾病”的人工智能，他说：“切实地说，在两三年内我不认为人类能比机器诊断得更好。”


    人工智能、更多的数据和更廉价的传感器相结合，将会产生难以置信的强大效能。医学突破会来得相当快，而且充满戏剧性。例如，病毒就是一种潜伏的小生物。它们进化得非常高效，利用宿主复制自己。但是它们愚蠢至极，它们无法形成一种策略来对抗我们对它们所做的一切。毕竟，它们不能测序我们的基因组。它们所能做的就是等待一些偶然的突变发生，来伺机规避我们的措施。就是这样，这就是它们的全部策略。与此同时，我们的医学知识年复一年、十年又十年地持续翻倍，翻倍，翻倍。你觉得谁会赢得比赛胜利？


    这不是“天上掉馅饼”的空想，许多令人惊叹的技术要么已经上市，要么即将上市。现在我们有一种眼镜，可以让某些盲人获得有限的视力。在欧洲，无线电波被用来有效地治疗高血压。由大脑控制的假肢已经被开发出来。我们很快就能3D打印出新的静脉和动脉，并在10年内打印出肝脏等替代器官。康复机器人肢体通过逐渐减少它们的辅助作用，让患者逐渐恢复手臂和腿的功能。远程成像机器人能够让医生为世界任何地方的人进行网上诊断。计算机控制的激光可以做人'
  - '[PAGE 257]


    手无法操作的手术。荷兰的一家公司开发出一种药丸，可以到达身体的特定部位给药。突破永无止境。


    几乎可以肯定的是，疾病肆虐的日子快到头了。虽然现实的挑战仍然存在，但其中最主要的问题不是疾病本身，而是围绕该行业的经济因素。幸运的是，我们一些最有效的药物，比如青霉素，价格非常便宜。然而，另一个极端是丙型肝炎的治疗目前要花费10万美元。因此，在很多情况下，富人可以负担起治疗费用，但穷人不行。我们还远远没有掌握如何有效和公平地分配医疗服务资源，医疗支出已接近美国经济的五分之一，每年的人均医疗支出为1万美元。诚然，美国是一个例外，但全球平均医疗支出占GDP的10%，因此每个人都在穷尽办法为医疗买单。尽管这一切令人沮丧，但它并不是一个永久的问题。技术的一个关键特征是，随着时间的推移，它的性能会增强，伴随而来的是成本的下降。


    # 免费的清洁能源


    你，或者更准确地说，你的身体以大约100瓦的恒定功率工作，相当于一个中等亮度的灯泡所消耗的能量。你全部的心理活动，加上你的肌肉、器官运作，体温维持等所有这些，都是用相对较少的能量完成的。如果你被扔到一个荒岛上，身上只穿了几件衣服，你可能会感到100瓦电力的极限。在1800年之前，当蒸汽动力真正开始腾飞之前，大多数人可能都非常清楚人类的工作量极限，因为他们每天的工作量都接近极限。


    在现代，人们不仅要消耗自己的100瓦能量，还要以电能、汽油等形式消耗更多的能源。对于一个美国人来说，要额外消耗10 000瓦的恒功率。这种能量消耗让我们可以过上悠闲的生活，坐在温控的房间里，以极快的速度从一个地方移动到另一个地方。它为我们的电脑提供动力，为我们修路，为我们收割粮食，为我们创造所有其他的日常'
  md: '

    因为我们有文明，我们才能发展文化。而文化让我们拥有了威廉·莎士比亚的《罗密欧与朱丽叶》(Romeo and Juliet)、路德维希·凡·贝多芬的《欢乐颂》、米开朗琪罗·博那罗蒂的《圣母怜子像》、J.
    K. 罗琳(J. K. Rowling)的《哈利·波特》系列丛书以及林-曼努埃尔·米兰达(Lin-Manuel Miranda)的《汉密尔顿》(Hamilton)。


    我们在通往文明的道路上已经走了很长一段路。然而，我们的旅程还远未结束。正如瑞典医生汉斯·罗斯林(Hans Rosling)所说：“你必须同时在脑海中记住两种想法：一是世界正在变好，二是世界还不够好。”虽然只需要几分钟，就能列出困扰我们这个世界的骇人听闻的暴行和不公，但一代又一代的人类在他们离开时，确实让这个世界比他们发现它时好了一点。这种累积效应，跨越几个世纪的复合利益，把我们带到今天。


    文明会消失吗？是的。所以它必须代代相传。如果我们在这项任务上失败了，我们将再次成为野蛮人。我们比想象中更接近原始的自我。诺贝尔文学奖获得者威廉·戈尔丁(William
    Golding)将一个魔鬼的名字“别西卜(Beelzebub)”译为英文“蝇王”(Lord of the Flies)，将其作为他写的著作的标题。这么做的原因在于，本书讲述了关于文明的脆弱性和人类的野蛮本能轻易占据上风，与蝇王的恶行相呼应。我们的原始本性仍然潜伏在我们体内，这也许解释了为什么啃食带骨鸡肉，而不是使用工具剔骨，会增加孩子们的攻击性和不服从性。可能啃鸡骨头的行为会唤醒我们内心的野蛮人，让我们想起编码在我们DNA中的遥远记忆。


    尽管文明可能会消失，可从历史的角度切入，它是有弹性的。无疑，它的影响力时强时弱，但从长远来看，它是向上的态势。无论怎样阐述文明与进步的纠缠关系都不为过。你可以采用追溯时间，记录文明繁盛之地的方法，来讲述科学和物质进步的故事。


    以2500年前的古希腊为例。那是一个多么进步的时代啊：文明繁荣，民主诞生，哲学发展，法治得到贯彻实施。厄拉多塞(Eratosthenes)计算了地球的周长。希波克拉底(Hippocrates)使医学成为一门科学。西奥弗拉斯特斯(Theophrastus)给植物分类并命名。欧帕利努斯(Eupalinus)建造了一座宏伟的水渠，阿基米德(Archimedes)制造了他著名的螺旋扬水器(screw
    to raise water)[1]，阿那克西曼德(Anaximander)假设地球上的生命起源于海洋。这样的例子不胜枚举。


    三个世纪后，文明在中国进发。汉朝把中国统一在一个高效的官僚体制下，并见证了艺术和文化的巨大进步。在这种环境下，数学和科学取得了令人瞩目的成就，其中的一些在两千年内都不会被其他任何地方所超越。


    向前再迈进三个世纪，将你的焦点转移到罗马。罗马以其法典和高效的政府成为文明的缩影。罗马的和平给数百万人民带来了繁荣和稳定。在此期间，罗马人铺设道路和建造港口的技术发展得非常先进，沿用至今。


    再快进700年到伊斯兰黄金时代(the Islamic Golden Age)[2]，当时北非、近东和中东的伊斯兰民族竭力从世界各地的文化中收集所有的书面知识，并将其翻译成阿拉伯语。这样的做法让他们在代数、几何学、三角学，甚至在发现微积分线索方面都获得了巨大进步，而这些线索在将近1000年的时间里都不会在其他地方成形过。


    回到现代，从过去的几个世纪直到今天，我们看到文明扩展到了生活的各个领域。而同一时期，我们目睹了史无前例的进步，这绝非巧合。文明和进步的步伐没有丝毫减弱的迹象，也没有任何理由会减弱。只要技术进步，人类的生产力就会进步，文明也会随之进步。


    但是，也许你在想，技术难道不是双刃剑吗？难道技术没有增强政府压迫人民的力度吗？难道邪恶和毁灭的力量没有随着每一次技术突破而增长吗？难道技术没有赋予那些喜欢破坏而非创造的人力量吗？难道不是19个人用价值25美元的美工刀劫持了价值2.5亿美元的飞机，并用它们给世界造成了2.5万亿美元的经济损失和数千人的死亡吗？


    是的，这都是真的。大多数技术是中性的，可以用于好的也可以用于坏的目的。炸药可以用来修建一条穿山隧道，也可以用来炸毁一条隧道。冶金可用于制造刀剑，也可以制造犁铧。对我们来说幸运的是，绝大多数人类喜欢建设而非破坏。现代世界证明了这一点。它的存在只是因为大多数人在大多数时候都是诚实的。想象一下，如果20%在网上订购商品的人对他们信用卡上的费用提出异议。他们可能会说：“确实有一个包裹送到了我家，但是里面只有一块砖头。”如果发生这种情况，信用卡将在一夜之间消失。它们能存在只是因为大多数人是诚实的。事实证明，我们大多数人的集体建设速度远远高于相对少数人的破坏速度。


    一般来说，我们使用技术时都抱有善意。以互联网为例。那里的确存在不端行为。我们经常听说相关报道。但退一步看，整体情况显示有20亿人互相帮助。论坛随处可见，人们在上面发问，完全陌生的人百忙之中抽出时间回答问题。在互联网上，互助小组、交流会议和有价值的信息一应俱全，所有这些都是个人的产物，他们的努力完全是无偿的。但他们还是这么做了，因为和大多数人一样，他们关心彼此。


    喜剧演员巴顿·奥斯瓦尔特(Patton Oswalt)说得好：


    > 如果人性天生邪恶，我们就不会走到今天这步。我们老早就把自己活活吃掉了。所以，当你发现暴力、偏执、狭隘、恐惧或只是普通的厌女症、仇恨或无知时，就直视它的眼


    没有人预言到互联网的出现，我们与它不期而遇。如今，使用它的目的与当初创建它的目的完全不同。现在的互联网并不是美国国防部高级研究计划局(DARPA)建立的[3]，因为互联网的理念在于，不限于某个机构，而是包括全世界的用户文件共享和通信网络，这与DARPA的初衷相悖。但事实证明，我们做到了。一旦我们拥有了它，一旦我们开始想办法用它来做些什么，各种稀奇古怪、出乎意料的事情就发生了，其中的很多都展现了我们最好的一面。没有人猜到会有一场开源运动(open
    source movement)，在这场运动中，大量的程序员会与他人自由共享他们编写的代码。没有人察觉知识共享和其他权利结构的兴起，其允许人们自由地分享他们所创作的东西。没有人预见到维基百科，在那里人们不仅无偿工作，而且还匿名。


    那么，进步还会继续吗？当然，只要技术进步，因为这就是生产力提高的原因。纵观人类历史，按照净计算，我们已经利用我们不断提高的生产力改善了世界。10 000年来，善已经战胜了恶。


    我们前面探讨过的技术的双重力量有一个微妙但重要的含义。如果技术真的能加倍、加倍、再加倍，那就意味着我们最终能够解决所有纯粹的技术问题。如果一个问题完全是技术性的，那么这就意味着它有一个技术性的解决方案，随着技术力量的持续翻倍，我们会找到解决方案。由于我们往往会低估翻倍的速度，我们很可能会比预期的更快地解决这些问题。别误会我的意思。现实中有很多问题不是技术性的。仅举几个例子：嫉妒、仇恨、种族主义和贪婪。最终，我们面临的挑战是成为更好的人，而在这里，技术只能提供间接的帮助——有时还会带来伤害。但对于纯粹技术性的问题，我们将制订技术性的解决方案。


    我们将看到哪些技术问题得到解决呢？这就是我们的下一站。


    ## 23 解决所有的技术问题


    ## 饥饿、贫困和疾病


    饥饿、贫困和疾病这三大灾难，自我们诞生以来就一直困扰着人类。它们让我们非常痛苦，以至于我们认为它们几乎是不可避免的。但真的是这样吗？还是说，它们只是技术问题，正处于我们能着手解决的风口浪尖？


    首先，饥饿本质上是一个技术问题。我们不是必然要挨饿的，我们只是还没有解决它。


    在第二纪的开端，随着农业的发明，想养活所有人类需要90%的人口从事农业，这种状况持续了10 000年，即使到了1800年，美国还有超过80%的人口在种植粮食。到1900年，这一比例已减半至40%，仅仅30年后，这个比例又下降了一半，降至20%，接下来的减半只花了25年，在1955年降到10%。到现在为止该指数又两次减半，今天的比例略高于2%。这就是技术显现的力量。


    然而，世界上仍然有大约8亿的饥饿人口，其中许多是儿童。事实上，五岁以下儿童50%的死亡可归结于饥饿或营养不良。我们可以每天花25美分为发展中国家的一名饥民提供食物，这意味着每年花费大约700亿美元，就可以让地球上的所有饥民吃饱，相当于全球在宠物食品上的花费。


    一个普遍存在的误解是，认为造成饥饿人口的原因是地球正在超负荷养活不断增长的人口，事实并非如此。世界上只有大约三分之一的耕地用于农作物生产，而就这三分之一的耕地的使用效率还很低。比如，中国每英亩的农作物产量比美国高得多，这主要是因为，尽管两国的国土面积相当，但中国的人口是美国的三倍，人均耕地面积只有美国的六分之一，所以中国人必须更高效地种植农作物。事实上，即使只算在美国扔掉的粮食都足以养活世界上所有的饥民。


    对世界上存在饥饿人口的另一个解释是：从根本上说这是一个分配问题，证据是：“其实有足够的粮食，但出于政治原因，你无法将其给予民众。”可实际情况并非如此。当然，有些地方把粮食当作资本，以至于某些群体无法获得粮食，但这只占全球饥民数量的2%左右。


    世界上有近10亿的饥饿人口，很明显造成他们饥饿的原因不是单一的，但最大的原因无疑就是贫困。世界上79%的饥饿人口生活在粮食净出口国。怎么会这样呢？这些国家的人民之所以挨饿，是因为该国生产的产品在世界市场上的售价超过了当地居民的支付能力。在现代，你不会因为没有粮食而挨饿，但你会因为没有钱而挨饿。所以真正的问题是，从全局看，食物太贵了，而很多人太穷了，负担不起。解决方案是保持粮食成本降低的趋势。


    幸运的是，有了像AI和机器人这样的技术，我们可以做很多事情来降低粮食价格，终结饥饿。AI将给我们提供惊人的新见解，告诉我们应该在何地种植何种作物，以及在何处销售。除此之外，我们可以培育更好的种子，并传播有关灌溉、施肥和作物轮作的赋权信息。每位农民拥有智能手机后，会比十多年前的任何人都更擅长耕作。而得益于技术进步，收益率上升的同时，成本还会下降。


    如果你仔细想想，我们并没有像看起来那样把技术真正应用到农业上。我们种植粮食的方式在10 000年间并没有发生根本的改变。你把一粒种子埋在地里，期待降雨，然后静待粮食的丰收。我觉得，随着我们开始“制造”粮食，这种传统种植方式将不会成为未来的常态。当我们可以3D打印美味、健康、廉价的食物时，为什么还要种植呢？


    将来每个人都可能成为素食者，而且是一个严格的素食主义者，因为人造肉更便宜、更美味、更健康、更环保。如果人造牛排像真牛排一样渗血，味道比你吃过的最好的牛排更好，并富含营养，而价格只需几美分，谁还会买“真”牛排呢？我是以一个资深的烧烤爱好者的身份来说这一切的，所以我阐述的并不只是能不能吃的问题。随着时间的推移，我猜想我们会认为吃真正的动物是野蛮的，甚至有点恶心。我们可能会停止制作与真牛排形似的人造牛排。现在我们已经习惯了吃那些看不出原来是什么动物的加工过的肉(比如热狗、汉堡和鸡块)，因为保持它们的传统形状只会令人不快地想起一个更原始的时代。


    人造肉的广泛使用将导致牛、猪、山羊、绵羊、鸡、火鸡等动物数量的大幅下降。在马身上就发生了类似的事情，因为我们不再用马来运输和做农活了，但至少马是有个性的。我在农场长大，我可以告诉你，养一头宠物牛可没有什么乐趣，它们既不能像狗一样跳到空中接飞盘，也不能像猫一般蜷缩在你的膝盖上发出咕噜咕噜的声音。


    如果饥饿问题的根本原因是贫困，那么贫困又是什么引起的呢？我想我们也正在解决贫困的路上。贫困也是一个技术问题，而人工智能、机器人科学和我们开发的所有其他技术将在全世界范围内缔造繁荣。正如我们前面所讨论的，尽管收入不平等的问题可能会加剧，但几乎可以肯定的是，贫困会被消除。为何如此乐观呢？


    如果你把过去2000年的人类平均收入画出来，你会得到一条近乎平滑的直线，发现这条线几乎在所有的时间里都是平的，直到1700年左右，它突然急转弯，像火箭一样急剧上升，之后就从未动摇，从未回落。随着平均收入的翻倍增长，我有充分的理由相信这条线会继续飙升。关于这一切是如何发生的，科学方法是如何引发工业革命，以及如何打开一个前所未有的创新时代的，前面我们已经详细地讨论过了。


    然而贫困依然存在。是的，虽然它已大幅下降，虽然地球上的人均收入约为每天30美元，但有10亿人每天仅靠2美元生活。那么这些人摆脱贫困的途径又是什么呢？


    尽管我们可以从1900年左右开始，以类比的方式，更有针对性地谈论贫困率，但它对我们的现状影响不大。所以让我们跳到1980年，当时世界人口有40亿，其中50%的人每天的生活费不足2美元(该数据是根据通货膨胀调整后得出的)。到1990年，这个数字下降到35%，也是在那一年，联合国定下了在25年内使贫困人口减半的目标。这个目标最后只用了20年就达成了，因此联合国在2010年再次召开会议，制定了一个新的目标：到2030年彻底消除贫困，这个目标我们很有希望实现。目前，世界上大致有12%的人(将近10亿人)生活在贫困中。这个群体被称为“底层10亿人”，帮助他们摆脱贫困已经成为一项真正的挑战。


    即使我们按照这个目标消除贫困，这项工作还有提升的空间。也就是说上文所说的每人每天不到2美元的生活费，每年约为700美元，相当于一个四口之家年收入3000美元左右。因此，在实现2030年的目标之后，下一个目标应该是让每人每天的收入都超过3美元，这是一种可以衡量的更好的生活方式，然后再努力提高到10美元，达到目前全球的中位数。


    如此艰巨的任务，我们究竟怎样才能实现呢？答案是提高生产率。每天工作12小时的人不可能通过成倍增加工作时间来使收入翻倍，他们必须让每一个工作单元更有效率，当然，这也是通过技术实现的。通过提高生产率，世界上最贫穷的地区将会脱贫，考虑到技术增长的速度，这一天会很快到来。想想手机，在1994年，世界上只有1%的成年人拥有手机；到2020年，预计90%超过6岁的人口都将拥有一部手机。手机是一种增强能力的技术，通过提高信息传播的速度，可以真正增加劳动力。再想想互联网，在1997年，世界上只有1%的人可以上网；现在这个数字是50%，未来将上升到接近100%。互联网让人们自由访问巨量的知识宝库，并提供了买卖商品的新方法，极大地增强了人类劳动。


    有了人工智能，每个人的智能手机里都将拥有世界上最好的医生、教育工作者、机械师、治疗师、水管工、私人教练、营养师等等。无须任何代价，作为文明伟大礼物的巨大知识宝库将向每个人敞开。互联网赋予我们力量，但仅仅获取信息，并不等同于拥有比这些知识更高级的人工智能。人工智能影响我们所做的每一个决定，有效促进了地球上现有人类的能力，使之比以往任何一个人都更加聪明和智慧。人工智能让最贫穷的人也能获得与最富有的人同样的知识。知识真的是一种力量，一种让自己的生活变得更好的力量。创新将源源不断地涌现，为底层10亿人提供摆脱贫困、分享现代世界巨大财富所需的工具。


    关于我们的第三个灾祸——疾病，它也是一个技术问题。疾病没有必然存在的理由，它的存在只是因为我们还没有找到消除它的方法。我们有信心根除它。为何如此乐观？


    想一下有史以来最严重的疾病：天花。该病困扰了人类10 000年，仅在20世纪，它就造成4亿人死亡，比历史上所有战争中死亡的人数加起来还要多。想想看那是多么可怕的场景，但我们消灭了它！爱德华·詹纳(Edward
    Jenner)在18世纪90年代发明了牛痘疫苗，这是十分惊人的举动，因为其发生在微生物理论的开发者——路易斯·巴斯德(Louis Pasteur)出生之前。也就是说在我们还不知道天花是由病毒引起的时候，就已经学会了接种天花疫苗，接种的技术也很简单，不比石刀割熊皮难多少。


    但是想想我们今天能用我们的技术做些什么。我们可以从本质上瓦解我们的病理学敌人，未来我们要用计算机模拟它们，在顷刻之间尝试10 000种治疗方法。此外，我们正着手深入了解人类基因组，并已经开始针对特定病人的疾病制订治疗方案。最后，我们有大数据，可以不限量研究患某些疾病患者的病史，从中提炼出最细微的信息，这些信息为创造治愈方法提供了线索。阿里·帕萨博士和很多人一样致力于研究“能够比医生更好地诊断和治疗疾病”的人工智能，他说：“切实地说，在两三年内我不认为人类能比机器诊断得更好。”


    人工智能、更多的数据和更廉价的传感器相结合，将会产生难以置信的强大效能。医学突破会来得相当快，而且充满戏剧性。例如，病毒就是一种潜伏的小生物。它们进化得非常高效，利用宿主复制自己。但是它们愚蠢至极，它们无法形成一种策略来对抗我们对它们所做的一切。毕竟，它们不能测序我们的基因组。它们所能做的就是等待一些偶然的突变发生，来伺机规避我们的措施。就是这样，这就是它们的全部策略。与此同时，我们的医学知识年复一年、十年又十年地持续翻倍，翻倍，翻倍。你觉得谁会赢得比赛胜利？


    这不是“天上掉馅饼”的空想，许多令人惊叹的技术要么已经上市，要么即将上市。现在我们有一种眼镜，可以让某些盲人获得有限的视力。在欧洲，无线电波被用来有效地治疗高血压。由大脑控制的假肢已经被开发出来。我们很快就能3D打印出新的静脉和动脉，并在10年内打印出肝脏等替代器官。康复机器人肢体通过逐渐减少它们的辅助作用，让患者逐渐恢复手臂和腿的功能。远程成像机器人能够让医生为世界任何地方的人进行网上诊断。计算机控制的激光可以做人手无法操作的手术。荷兰的一家公司开发出一种药丸，可以到达身体的特定部位给药。突破永无止境。


    几乎可以肯定的是，疾病肆虐的日子快到头了。虽然现实的挑战仍然存在，但其中最主要的问题不是疾病本身，而是围绕该行业的经济因素。幸运的是，我们一些最有效的药物，比如青霉素，价格非常便宜。然而，另一个极端是丙型肝炎的治疗目前要花费10万美元。因此，在很多情况下，富人可以负担起治疗费用，但穷人不行。我们还远远没有掌握如何有效和公平地分配医疗服务资源，医疗支出已接近美国经济的五分之一，每年的人均医疗支出为1万美元。诚然，美国是一个例外，但全球平均医疗支出占GDP的10%，因此每个人都在穷尽办法为医疗买单。尽管这一切令人沮丧，但它并不是一个永久的问题。技术的一个关键特征是，随着时间的推移，它的性能会增强，伴随而来的是成本的下降。


    ## 免费的清洁能源


    你，或者更准确地说，你的身体以大约100瓦的恒定功率工作，相当于一个中等亮度的灯泡所消耗的能量。你全部的心理活动，加上你的肌肉、器官运作，体温维持等所有这些，都是用相对较少的能量完成的。如果你被扔到一个荒岛上，身上只穿了几件衣服，你可能会感到100瓦电力的极限。在1800年之前，当蒸汽动力真正开始腾飞之前，大多数人可能都非常清楚人类的工作量极限，因为他们每天的工作量都接近极限。


    在现代，人们不仅要消耗自己的100瓦能量，还要以电能、汽油等形式消耗更多的能源。对于一个美国人来说，要额外消耗10 000瓦的恒功率。这种能量消耗让我们可以过上悠闲的生活，坐在温控的房间里，以极快的速度从一个地方移动到另一个地方。它为我们的电脑提供动力，为我们修路，为我们收割粮食，为我们创造所有其他的日常

