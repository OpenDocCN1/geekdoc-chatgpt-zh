    什么时候开始并不重要，重要的是要明白一旦它真的开始了，变化就会很快发生。我们花了5000年的时间才从发明车轮发展到登上月球(有趣的是，我们登上月球之后，才有人想到把轮子安装到行李箱上)。但在2500年前，我们却没有到地球与月球之间一半的距离，差得远呢。从人类第一次在月球上行走的时刻倒推20年，我们才打破了音障(sound
    barrier)[28]，倒推60年我们才实现了空中飞行。在发明车轮之后的4940年里，我们仍然牢牢地附着在这个星球的表面，但60年后，我们不仅飞了起来，还登上了月球并返回了地球。正是在这种发展速度下，伴随着频繁的戏剧性的革命，你应该期待第四次变革降临到我们身上。就像飞机着陆前经历的最剧烈的颠簸一样，我们从这一点向前的旅程也将会有些颠沛。未来50年里，我们可能会看到比过去5000年更多的变化。弗拉基米尔·列宁(Vladimir
    Lenin)说：“有时候几十年都一成不变，有时候几周内却沧海桑田。”随着第四纪的到来，预计人工智能和机器人技术将会以越来越快的速度取得突破。


    数百万年来，我们一直在使用科技。10万年前，我们有了语言。几千年前，我们开始深入探讨宇宙及我们在宇宙中的位置。几个世纪前，我们将科学系统化，创造了难以想象的繁荣。几十年前，我们开始制造机械大脑，就在几年前，我们学会了引人注目的新方法，让这些“大脑”更加强大。这一刻似乎就是历史的转折点。


    现在，我们已经来到了第四纪的门口，我们发现自己对我们到底建造了什么和究竟将走向何方存在分歧。现在我们正在创造的技术，将迫使我们重新审视一些非常古老的问题的答案。


    # 05 三个重要问题'
  - '[PAGE 42]


    既然第四纪即将来临，我们已经准备好去解决机器人、工作、人工智能和有意识计算机的问题。为此，我需要向读者提出三个基本问题。在这本书的其余部分，我将反复提及它们。它们都是老生常谈，是我们几千年来一直在问自己的问题。说“没有错误答案”是不准确的，因为毫无疑问，有许多错误的答案，只是对它们错在什么地方没有达成一致。


    为什么这些问题很重要？因为它们关系到我们将要讨论的许多问题，包括人工智能能做什么，计算机是否能变得有意识，以及机器人是否会取代我们的所有工作。虽然有人也许希望我们直接跳到技术细节，但这不是解决这些问题的最佳方法。如果有意识的计算机——能够思考的机器，以及能够复制人类全部能力的机器人——是有可能实现的，那么技术的稳步提高最终将把它们带给我们。换句话说，如果它们是可能的，那么它们就是不可避免的。但它们真的是可能的吗？这个问题远未解决，而它的解决完全取决于“三大问题”的答案。


    这些问题是哲学性的，而不是技术性的，回答它们，你不需要具备人工智能或机器人方面的专业知识。从历史上看，这些问题对现实世界的影响不大。它们主要是学术性的心理练习，那种你可能会在深夜与大学朋友讨论的东西。但现在一切都变了！在第四世纪的黎明，它们突然变成了非常实际的问题。从非常真实的意义上讲，这三个问题的答案将决定我们整个物种的未来和命运。我再重复一遍：几千年来一直只是抽象的，而且对许多人来说基本上无关紧要的哲学思考，现在是我们这个时代的核心问题。如果一个人知道他们的答案，未来会变得更加清晰。如果你觉得解决重大的哲学问题很困难，那么，好吧，我唯一能安慰你的是，它们都是以多项选择题的形式呈现的。


    # 宇宙的构成是什么？'
  md: '

    说到全新材料，目前有各种各样的候选人在努力攻关，承诺将使摩尔定律延续下去。


    真正有趣的是，不仅是计算机，几乎所有类型的技术，似乎都遵循自己的摩尔定律。某项技术的性能也许不会每两年翻一番，但它每N年就会翻一番。任何购买了笔记本电脑、数码相机或电脑显示器的人都亲身体验到了这一点。硬盘容纳得越来越多，像素不断增加，屏幕分辨率也在提高。


    甚至有人坚持认为多细胞生命也遵循摩尔定律，每3.76亿年复杂性就会翻倍。遗传学家理查德·戈登(Richard Gordon)和阿列克谢·沙罗夫(Alexei
    Sharov)提出了一个有趣的结论，那就是多细胞生命存在了大约100亿年，比地球本身还要早，这意味着——好吧，这暗示着各种各样的事情，比如人类的生命一定起源于银河系的其他地方，并通过这样或那样的方式来到这里。


    技术翻倍是一件大事，比人们最初预想的还要重要。众所周知，人类低估了持续翻倍的重要性，因为在我们的日常生活中，没有任何事情是这样的。你不会和2个孩子在一起，一觉醒来变成4个孩子，然后是8个孩子，然后是16个。就像我们的银行存款余额不会日复一日地从100美元到200美元再到400美元再到800美元。


    为了理解重复加倍的东西变化速度有多快，再想想国际象棋发明的故事吧。大约1000年前，在今印度地域的一位数学家把他的创造物带给了统治者，并向他展示了游戏规则。统治者非常感动，问数学家想要什么奖励。数学家回答说，他是一个谦虚的人，需求很少。他说在棋盘的第一个方格上放一粒米，然后在第二格放两粒米，第三格放四粒米，其后的每一格都比前面一格多放一倍的米，他只要第六十四格上放的大米。


    你觉得这会有多少米？考虑到我对这个故事所做的铺垫，你知道这将是一个很大的数字。但是想象一下这么多米是什么样子。它能装满一个粮仓吗？一个仓库吗？它实际上比整个人类历史上种植的水稻加起来还要多。顺便说一下，当统治者反应过来后，他把数学家处死了，所以这就是另一个要吸取的人生教训了。


    想象一下多米诺骨牌，你排起一排多米诺骨牌，推倒一张，它推倒下一张，依此类推。每张多米诺骨牌可以推倒比自己高50%的多米诺骨牌。所以，如果你设置32张多米诺骨牌，每张都比前一张大50%，最后一张多米诺骨牌可能会撞倒帝国大厦(the
    Empire State Building)。而这仅仅才是50%的增长率，还不是成倍增加。


    如果你认为我们在当下已经看到了一些非常惊人的技术进步，那么请系好安全带。我们现在就好像是在棋盘的第六十或六十一格上，翻倍是一件相当有难度的事。如果你想去做某件事而计算机没有相应的运算能力，只要等待两年，你就会拥有两倍的计算能力。当然，我们花了几千年的时间才制造出你桌上的这台计算机，但是再过两年，我们就会制造出比这台性能强大一倍的计算机。两年后，性能又会增加一倍。因此，虽然我们花了近5000年的时间才从算盘发展到iPad，但从现在起的25年后，我们将拥有远远领先于iPad的物件，就像iPad领先于算盘一样。我们绞尽脑汁也想象不出那会是什么样子。


    科学方法和摩尔定律的神秘结合给我们带来了新技术的爆炸式增长，这些技术是我们日常生活的一部分。它给了我们机器人、纳米技术、基因编辑技术CRISPR-Cas9
    [21]、太空旅行、原子能以及其他上百个奇迹。事实上，技术进步的速度如此之快，以至于我们对这一切的奇迹都麻木了。新技术的出现速度如此之快，它们仿佛已经变得平淡无奇。我们口袋里装着超级计算机，可以让我们与地球上几乎任何人即时通信。这些设备无处不在，甚至连孩子都有，而且价格低廉，还可以免费获得两年的合约。我们拥有了过去被认为上帝才有的力量，比如看到很远的地方发生的事件。我们可以用手指的最小运动来改变房间的温度。我们可以在离地六英里的高空以音速飞行，这种交通工具十分安全，从统计学上讲，一个人连续每天飞行，累计10万年才会发生事故。然而，当火鸡卷卖完了，我们不得不吃科布沙拉(Cobb
    salad)[22]时，不知怎的，我们还是会感到不方便。


    在古代，如果你想知道一个难题的答案，你必须去朝圣以得到一个神谕，比如德尔斐神谕(the Oracle at Delphi)[23]。在经历了漫长而艰辛的旅程之后，你终于可以向祭司提出你的问题，祭祀会在由药物引发的恍惚状态下回答你的问题。一些晦涩难懂的答案可以用十几种不同的方法来解释。现在来对比一下谷歌：你输入一个问题，在四分之一秒内，谷歌就按照顺序列出500亿个网页供你阅读。


    在第三纪最后几年出现的所有技术中，计算机的进步超过了所有技术。它们不仅仅是小玩意儿，还是具有哲学意义的装置。我为什么这么说？因为它们做了一件非常特别的事情——计算。我知道这似乎是显而易见的，但计算是宇宙的心跳，它是宇宙时钟的嘀嗒声。计算具有这般的基础性，有些人认为世间万物都是计算，包括你的大脑、宇宙、空间、时间、意识和生命本身。博学家斯蒂芬·沃尔夫勒姆(Stephen
    Wolfram)就是这么认为的，他在2002年的代表作《一种新科学》(A New Kind of Science)中用1200页的篇幅阐述了自己的观点。他论证了一个非常简单的规则：只要一两行代码，就可以产生巨大的复杂性。他进一步推测，生成整个宇宙所需的代码可能只有几行长。这是一个具有煽动性的假设，有许多信徒。


    不管怎样，宇宙的大部分显然是可计算的。飓风和脱氧核糖核酸是可计算的，雪花和沙丘也是如此。奇妙的是，物理世界中作为计算结果的事物都可以在一个邮票大小的计算设备中进行建模。试想一下，把一个人送上月球需要对火箭、助推力和重力……以及现实世界的所有东西进行极其复杂的计算。然而，我们可以在一个微型处理器内用1和0来映射它。这表明了一个深刻的事实，即任何可以在计算机中建模的事情在现实世界中都是通过计算发生的。换句话说，阿波罗11号的发射是计算的，它不仅仅是涉及计算，它的发射是计算，它的整个任务都是计算。


    在极端案例中，情况变得有趣起来。人类是计算性的吗？我们的大脑是遵循阿波罗11号相同基本规则的巨型钟表装置吗？为了了解计算机的局限性(如果有的话)，我们需要回答这些问题。


    这就是为什么我说计算机是具有哲学意义的设备。锤子只能敲钉子，锯子只能锯木头，但计算机可以映照出现实世界中10亿个不同的东西。公正地说，我们还不理解计算机在形而上学的含义。我们知道它以微妙和显著的方式改变了世界，但更多的事情正在发生。正如著名教授和哲学家马歇尔·麦克卢汉(Marshall
    McLuhan)几十年前所说，计算机是“人类最非凡的技术，它是我们中枢神经系统的延伸。与计算机相比，车轮只算一个呼啦圈”。计算机日新月异，同时它又随处可见。人们只能想象到它在一个世纪后能做什么，甚至更短，10年后能做什么。


    这个设备是从哪里来的？我们是怎么决定做一个出来的，甚至怎么想到这样的事物是可能的？从计算机诞生到今天的历史很短，就本书的目的而言，只要提到巴贝奇、图灵、冯·诺依曼和香农这四个名字就够了，把它们放在一起念，发音听起来就像一家高科技律师事务所。让我们分别看看他们四人的观点，当它们结合在一起时，将为你提供现代计算的基本要素。


    查尔斯·巴贝奇(Charles Babbage)的故事始于1821年的伦敦。当时，工业革命正在进行，科学和数学从大学和实验室转移到工厂。在计算机出现之前，人们出版了大量的数学用表，方便那些从事复杂计算的人快捷运算。这些表册中容纳了对数、天文计算、工业和科学所必需的其他数据集。问题是其中的每一个数字都是手工计算的，因此包含许多错误。一个错误的数字可能会使一艘船偏离航线，损坏银行记录，或导致生产出故障机器。巴贝奇对这些错误感到沮丧，他说：“我倒希望这些计算是用蒸汽完成的。”


    这句话意义深远，而且对于那个年代来讲非常超前。从中可以捕获一种感觉，即机械的东西比有机的东西更稳定可靠。蒸汽驱动的机器以一种严格的标准被仔细打磨，这些机器孜孜不倦地工作，生产出始终如一的高质量产品。巴贝奇的天才之处就在于他意识到，如果蒸汽可以制造齿轮，那么它也可以计算对数。


    因此，他构思并试图建造一台完整的计算机。他理解这台机器的重大意义，并指出“只要有一台分析机(Analytical Engine)存在，它必然会引领未来的科学进程”。不幸的是，他耗尽了资金、努力却以失败告终，这也是一直以来新兴事业的普遍命运。然而，在2002年，伦敦科学博物馆造出了巴贝奇设计的重达10,000磅的计算机，它运转完美。巴贝奇的故事讲完了，这个猜测蒸汽可以为计算机提供动力的人退场了。


    接下来上场的是艾伦·图灵(Alan Turing)。在我们的故事中，图灵的贡献出现在1936年，当时他第一次描述了我们现在称之为“图灵机(Turing machine)”的东西。图灵构思了一台可以处理复杂数学问题的假想机器。该机器由一条狭长的方格纸带组成，理论上它是无限长的。在纸带上，总是有一个活动单元格，在该单元格上方悬停着一个读写头。根据收到的指令或运行的程序，读写头可以在纸带上读写和移动。


    图灵机的意义不在于“他指出了如何建立一台计算机”，而是“这个简单的假想设备可以解决大量的(几乎所有的)计算问题”。事实上，今天计算机可以做的任何事情，理论上都可以在图灵机上完成。图灵不仅构想了这台机器，而且把原理都弄明白了。想一想这台简单的机器，这个只用到几个部件的思想实验(thought
    experiment)：阿波罗11号登月和返回地球所需要做的一切都可以在图灵机上编程，你的智能手机能做的一切都可以在图灵机上编程，IBM沃森(IBM Watson)[24]能做的一切都可以在图灵机上编程。谁能猜到这样一个不起眼的小设备竟能做到这一切呢？图灵确实想到了，但似乎再没有其他人像图灵这样拥有独特的想法。图灵的故事到此结束。


    下面讲约翰·冯·诺依曼(John von Neumann)，我们称他为现代计算机之父。1945年，他为计算机开发了冯·诺依曼体系结构(von Neumann
    architecture)。如果说图灵机纯粹是理论上的，旨在界定计算机可以做什么的问题，那冯·诺依曼体系结构就解决了如何构建真实计算机的问题。他建议使用一个内部处理器和可以同时存储程序和数据的计算机内存。除此之外，可能还要有外部存储器来存储当前不需要的数据和信息，再加上输入和输出设备，一个冯·诺依曼装置就组建完成了。当你阅读的时候，你可以把你的所读依次映射到计算机的中央处理器、内存、硬盘驱动器、键盘和显示器，这样就走了一圈。


    最后来说说香农。在1949年，克劳德·香农(Claude Shannon)写了一篇题为《编程实现计算机下棋》(Programming a Computer
    for Playing Chess)的论文，其中描述了一种将国际象棋简化为可以在计算机上编程的一系列方法。虽然这听起来没什么大不了，不太可能让香农成为计算机史上的拉什莫尔山(Mount
    Rushmore)[25]的四大巨头之一，但从实际和现实的角度来看，香农让计算机可以在一个抽象的层面上操作信息，决定如何移动棋子。这让人们第一次认识到了计算机不仅仅是用来进行数学计算的机器。想想看，1949年以前，计算机只是那种物理课上用到的，可编程的计算器；1949年以后，可以想象某一天，计算机会建议你购买哪些股票。尽管包括图灵在内的许多其他人在理论上都证明了计算机的能力，但是香农将其实现了。


    总结一下：巴贝奇认识到可以用机器做数学运算，图灵发现他们还可以运行程序，冯·诺依曼想出了如何构建计算机硬件，而香农展示了软件如何做乍一看不像数学问题的事情。


    这就是我们今天的处境。唯一真正改变的就是计算机变得更快、更便宜了。为了观察这种现象，让我们算下每秒进行10亿次浮点运算的成本是多少。在1961年，还不存在这样的计算机，但如果你把美国两年的GNP(国民生产总值)全都花在购买当时速度最快的计算机上，然后把它们连接在一起，其计算速度就会接近每秒10亿次浮点运算。


    到1984年，买一台1 gigaflops(每秒进行10亿次浮点运算)的计算机——克雷“超级计算机”[26]，大概要付出相当于购买一架非常好的私人飞机的价钱。但相比花费两年的GNP，价格已经暴跌，算是很便宜了。到1997年，用买一辆优质德国跑车的钱就可以获得1
    gigaflops的计算能力。到2013年，超级计算机索尼PlayStation 4问世，价格低至25美元/gigaflops。到了现在，10,000倍 gigaflops的计算机售价才几百美元，成本仅5美分/gigaflops。


    计算机性能的价格将很快降到零点几美分/gigaflops，并还将继续快速下降。现在的超级电脑不再使用gigaflops作为度量单位。甚至也不使用teraflops(1000
    gigaflops)，而是使用petaflops(1,000,000 gigaflops)。截至2018年1月，全世界最快和第二快的计算机都位于中国。它们的运行速度接近100
    petaflops(100,000,000 gigaflops)。然而，预计到2018年晚些时候，美国、日本，无疑还有其他地方将制造出运算速度超过100 petaflops的计算机。此外，至少有五家公司承诺在2020年前推出exaflop(1000
    petaflops)机器。没有任何迹象表明这场竞赛在近期有放缓的趋势。


    这一切是怎么发生的？价格怎么会跌成那样？在1960年，你可以花大约1美元(相当于今天的8美元多一点)买一个晶体管。所以，如果你需要12.5万个晶体管，就需要付出相当于今天的100万美元。但随着产量的飙升，价格大幅下跌。到2004年，晶体管的制造数量已经超过了全世界种植的稻米数量。仅仅六年后，在2010年，你可以用买一粒米的价钱买到1960年价值100万美元的125,000个晶体管。


    技术更新是不停歇的，它变得更好，更便宜，永不止步。正是基于计算机未来潜在能力这一事实，许多计算机科学家提出了他们的主张，例如通用人工智能、机器意识。我们将在本书的其余部分讨论这些主题。


    电脑介入我们生活中到底有多深？没有人知道世界上有几十亿台计算机在运行。据信，计算机使用的电力约占世界全部电力的10%。它们是我们生活中如此重要的一部分，以至于没有它们我们大概真的无法生活，更不能维持我们目前的生活水平。我们的人口也许太过庞大，特别是在大城市，如果计算机被移除或丧失功能，没有计算机在后台管理从物流到水处理的所有事情，可能会导致人类消亡。正如史蒂夫·沃兹尼亚克(Steve
    Wozniak)[27]所说：“突然间，我们失去了很多控制。我们不能关掉互联网，我们不能关掉智能手机，我们不能关掉电脑。你过去常向一个聪明的人请教问题，现在你问谁？它以g-o开头，但它不是上帝，而是谷歌。”


    在20世纪60和70年代，我们建造了足够多的计算机，意义在于把它们连接起来组成一个巨大的网络，我们称之为互联网。1989年，蒂姆·伯纳斯·李(Tim Berners-Lee)创建了超文本传输协议(HTTP)，用于从远程计算机上访问服务器上的文档。我们称之为万维网(WWW)。现在，我们不仅要把计算机连接到互联网上，还要把所有由数据驱动的设备都连接到互联网上。目前大约有300亿台设备联网，预计到2030年这个数字将上升到5000亿台。


    这个故事讲述了我们如何从第三纪最后衰落的几个世纪走向第四纪的门槛。每一个新时代都见证了技术外包，也见证了人类肉体生命或精神生命机能的增强。我们用火来帮助消化，用文字书写来增强记忆，用车轮来解放我们的背和腿。在我们的时代，我们已经创造了一种设备——机械大脑，它用途广泛，可以通过编程来解决我们要求它解决的几乎无限多的问题。我们现在正在开发人工智能，一种让设备独立运行的方法，通过机器人技术的力量，我们已经开始赋予它机动性，以及与物理世界互动的方式。我们将越来越多地、想必是尽可能多地使用计算机和机器人来外包我们的思想和行动。这是一个真正的变化，它标志着一个新时代——第四纪的到来。从这种转变中产生的问题是深刻的，因为它们关系到作为人类意味着什么。机器能思考吗？他们能有意识吗？所有的人类活动都能被机械地复制吗？我们只是机器吗？这本书的最终目的是探索这些想法——弄清楚我们究竟可以将多少人类活动，包括脑力和体力活动，委托给机器，以及这种变化的影响对世界的意义所在。


    第四纪已经开始了吗？好吧，当只有少数人学会了耕作，或少数与世隔绝的地方发展了文字，是否就标志了一个新时代的开始，或是旧时代终结的开始？其实我们从哪里分期无关紧要。我们现在谈论几十年前克劳德·香农解释计算机如何编程下棋时是否意味着新时代到来了，抑或是否在几年后，只有当计算机可以用自然语言与人类进行复杂的对话时才昭示了新纪元的出现？这种过于琐碎的分析也不具有特别的意义。我们假设转变开始的时间不早于1950年，完成的时间不迟于2050年。你可以选择在这期间的任何地方画一条线，或者将整个周期标记为过渡期。


    什么时候开始并不重要，重要的是要明白一旦它真的开始了，变化就会很快发生。我们花了5000年的时间才从发明车轮发展到登上月球(有趣的是，我们登上月球之后，才有人想到把轮子安装到行李箱上)。但在2500年前，我们却没有到地球与月球之间一半的距离，差得远呢。从人类第一次在月球上行走的时刻倒推20年，我们才打破了音障(sound
    barrier)[28]，倒推60年我们才实现了空中飞行。在发明车轮之后的4940年里，我们仍然牢牢地附着在这个星球的表面，但60年后，我们不仅飞了起来，还登上了月球并返回了地球。正是在这种发展速度下，伴随着频繁的戏剧性的革命，你应该期待第四次变革降临到我们身上。就像飞机着陆前经历的最剧烈的颠簸一样，我们从这一点向前的旅程也将会有些颠沛。未来50年里，我们可能会看到比过去5000年更多的变化。弗拉基米尔·列宁(Vladimir
    Lenin)说：“有时候几十年都一成不变，有时候几周内却沧海桑田。”随着第四纪的到来，预计人工智能和机器人技术将会以越来越快的速度取得突破。


    数百万年来，我们一直在使用科技。10万年前，我们有了语言。几千年前，我们开始深入探讨宇宙及我们在宇宙中的位置。几个世纪前，我们将科学系统化，创造了难以想象的繁荣。几十年前，我们开始制造机械大脑，就在几年前，我们学会了引人注目的新方法，让这些“大脑”更加强大。这一刻似乎就是历史的转折点。


    现在，我们已经来到了第四纪的门口，我们发现自己对我们到底建造了什么和究竟将走向何方存在分歧。现在我们正在创造的技术，将迫使我们重新审视一些非常古老的问题的答案。


    ## 05 三个重要问题


    既然第四纪即将来临，我们已经准备好去解决机器人、工作、人工智能和有意识计算机的问题。为此，我需要向读者提出三个基本问题。在这本书的其余部分，我将反复提及它们。它们都是老生常谈，是我们几千年来一直在问自己的问题。说“没有错误答案”是不准确的，因为无疑，有许多错误的答案，只是对它们错在什么地方没有达成一致。


    为什么这些问题很重要？因为它们关系到我们将要讨论的许多问题，包括人工智能能做什么，计算机是否能变得有意识，以及机器人是否会取代我们的所有工作。虽然有人也许希望我们直接跳到技术细节，但这不是解决这些问题的最佳方法。如果有意识的计算机——能够思考的机器，以及能够复制人类全部能力的机器人——是有可能实现的，那么技术的稳步提高最终将把它们带给我们。换句话说，如果它们是可能的，那么它们就是不可避免的。但它们真的是可能的吗？这个问题远未解决，而它的解决完全取决于“三大问题”的答案。


    这些问题是哲学性的，而不是技术性的，回答它们，你不需要具备人工智能或机器人方面的专业知识。从历史上看，这些问题对现实世界的影响不大。它们主要是学术性的心理练习，那种你可能会在深夜与大学朋友讨论的东西。但现在一切都变了！在第四纪的黎明，它们突然变成了非常实际的问题。从非常真实的意义上讲，这三个问题的答案将决定我们整个物种的未来和命运。我再重复一遍：几千年来一直只是抽象的，而且对许多人来说基本上无关紧要的哲学思考，现在是我们这个时代的核心问题。如果一个人知道他们的答案，未来会变得更加清晰。如果你觉得解决重大的哲学问题很困难，那么，好吧，我唯一能安慰你的是，它们都是以多项选择题的形式呈现的。


    ### 宇宙的构成是什么？

    '
  mdcn: '

    说到全新材料，目前有各种各样的候选人在努力攻关，承诺将使摩尔定律延续下去。


    真正有趣的是，不仅是计算机，几乎所有类型的技术，似乎都遵循自己的摩尔定律。某项技术的性能也许不会每两年翻一番，但它每N年就会翻一番。任何购买了笔记本电脑、数码相机或电脑显示器的人都亲身体验到了这一点。硬盘容纳得越来越多，像素不断增加，屏幕分辨率也在提高。


    甚至有人坚持认为多细胞生命也遵循摩尔定律，每3.76亿年复杂性就会翻倍。遗传学家理查德·戈登(Richard Gordon)和阿列克谢·沙罗夫(Alexei
    Sharov)提出了一个有趣的结论，那就是多细胞生命存在了大约100亿年，比地球本身还要早，这意味着——好吧，这暗示着各种各样的事情，比如人类的生命一定起源于银河系的其他地方，并通过这样或那样的方式来到这里。


    技术翻倍是一件大事，比人们最初预想的还要重要。众所周知，人类低估了持续翻倍的重要性，因为在我们的日常生活中，没有任何事情是这样的。你不会和2个孩子在一起，一觉醒来变成4个孩子，然后是8个孩子，然后是16个。就像我们的银行存款余额不会日复一日地从100美元到200美元再到400美元再到800美元。


    为了理解重复加倍的东西变化速度有多快，再想想国际象棋发明的故事吧。大约1000年前，在今印度地域的一位数学家把他的创造物带给了统治者，并向他展示了游戏规则。统治者非常感动，问数学家想要什么奖励。数学家回答说，他是一个谦虚的人，需求很少。他说在棋盘的第一个方格上放一粒米，然后在第二格放两粒米，第三格放四粒米，其后的每一格都比前面一格多放一倍的米，他只要第六十四格上放的大米。


    你觉得这会有多少米？考虑到我对这个故事所做的铺垫，你知道这将是一个很大的数字。但是想象一下这么多米是什么样子。它能装满一个粮仓吗？一个仓库吗？它实际上比整个人类历史上种植的水稻加起来还要多。顺便说一下，当统治者反应过来后，他把数学家处死了，所以这就是另一个要吸取的人生教训了。


    想象一下多米诺骨牌，你排起一排多米诺骨牌，推倒一张，它推倒下一张，依此类推。每张多米诺骨牌可以推倒比自己高50%的多米诺骨牌。所以，如果你设置32张多米诺骨牌，每张都比前一张大50%，最后一张多米诺骨牌可能会撞倒帝国大厦(the
    Empire State Building)。而这仅仅才是50%的增长率，还不是成倍增加。


    如果你认为我们在当下已经看到了一些非常惊人的技术进步，那么请系好安全带。我们现在就好像是在棋盘的第六十或六十一格上，翻倍是一件相当有难度的事。如果你想去做某件事而计算机没有相应的运算能力，只要等待两年，你就会拥有两倍的计算能力。当然，我们花了几千年的时间才制造出你桌上的这台计算机，但是再过两年，我们就会制造出比这台性能强大一倍的计算机。两年后，性能又会增加一倍。因此，虽然我们花了近5000年的时间才从算盘发展到iPad，但从现在起的25年后，我们将拥有远远领先于iPad的物件，就像iPad领先于算盘一样。我们绞尽脑汁也想象不出那会是什么样子。


    科学方法和摩尔定律的神秘结合给我们带来了新技术的爆炸式增长，这些技术是我们日常生活的一部分。它给了我们机器人、纳米技术、基因编辑技术CRISPR-Cas9
    [21]、太空旅行、原子能以及其他上百个奇迹。事实上，技术进步的速度如此之快，以至于我们对这一切的奇迹都麻木了。新技术的出现速度如此之快，它们仿佛已经变得平淡无奇。我们口袋里装着超级计算机，可以让我们与地球上几乎任何人即时通信。这些设备无处不在，甚至连孩子都有，而且价格低廉，还可以免费获得两年的合约。我们拥有了过去被认为上帝才有的力量，比如看到很远的地方发生的事件。我们可以用手指的最小运动来改变房间的温度。我们可以在离地六英里的高空以音速飞行，这种交通工具十分安全，从统计学上讲，一个人连续每天飞行，累计10万年才会发生事故。然而，当火鸡卷卖完了，我们不得不吃科布沙拉(Cobb
    salad)[22]时，不知怎的，我们还是会感到不方便。


    在古代，如果你想知道一个难题的答案，你必须去朝圣以得到一个神谕，比如德尔斐神谕(the Oracle at Delphi)[23]。在经历了漫长而艰辛的旅程之后，你终于可以向祭司提出你的问题，祭祀会在由药物引发的恍惚状态下回答你的问题。一些晦涩难懂的答案可以用十几种不同的方法来解释。现在来对比一下谷歌：你输入一个问题，在四分之一秒内，谷歌就按照顺序列出500亿个网页供你阅读。


    在第三纪最后几年出现的所有技术中，计算机的进步超过了所有技术。它们不仅仅是小玩意儿，还是具有哲学意义的装置。我为什么这么说？因为它们做了一件非常特别的事情——计算。我知道这似乎是显而易见的，但计算是宇宙的心跳，它是宇宙时钟的嘀嗒声。计算具有这般的基础性，有些人认为世间万物都是计算，包括你的大脑、宇宙、空间、时间、意识和生命本身。博学家斯蒂芬·沃尔夫勒姆(Stephen
    Wolfram)就是这么认为的，他在2002年的代表作《一种新科学》(A New Kind of Science)中用1200页的篇幅阐述了自己的观点。他论证了一个非常简单的规则：只要一两行代码，就可以产生巨大的复杂性。他进一步推测，生成整个宇宙所需的代码可能只有几行长。这是一个具有煽动性的假设，有许多信徒。


    不管怎样，宇宙的大部分显然是可计算的。飓风和脱氧核糖核酸是可计算的，雪花和沙丘也是如此。奇妙的是，物理世界中作为计算结果的事物都可以在一个邮票大小的计算设备中进行建模。试想一下，把一个人送上月球需要对火箭、助推力和重力……以及现实世界的所有东西进行极其复杂的计算。然而，我们可以在一个微型处理器内用1和0来映射它。这表明了一个深刻的事实，即任何可以在计算机中建模的事情在现实世界中都是通过计算发生的。换句话说，阿波罗11号的发射是计算的，它不仅仅是涉及计算，它的发射是计算，它的整个任务都是计算。


    在极端案例中，情况变得有趣起来。人类是计算性的吗？我们的大脑是遵循阿波罗11号相同基本规则的巨型钟表装置吗？为了了解计算机的局限性(如果有的话)，我们需要回答这些问题。


    这就是为什么我说计算机是具有哲学意义的设备。锤子只能敲钉子，锯子只能锯木头，但计算机可以映照出现实世界中10亿个不同的东西。公正地说，我们还不理解计算机在形而上学的含义。我们知道它以微妙和显著的方式改变了世界，但更多的事情正在发生。正如著名教授和哲学家马歇尔·麦克卢汉(Marshall
    McLuhan)几十年前所说，计算机是“人类最非凡的技术，它是我们中枢神经系统的延伸。与计算机相比，车轮只算一个呼啦圈”。计算机日新月异，同时它又随处可见。人们只能想象到它在一个世纪后能做什么，甚至更短，10年后能做什么。


    这个设备是从哪里来的？我们是怎么决定做一个出来的，甚至怎么想到这样的事物是可能的？从计算机诞生到今天的历史很短，就本书的目的而言，只要提到巴贝奇、图灵、冯·诺依曼和香农这四个名字就够了，把它们放在一起念，发音听起来就像一家高科技律师事务所。让我们分别看看他们四人的观点，当它们结合在一起时，将为你提供现代计算的基本要素。


    查尔斯·巴贝奇(Charles Babbage)的故事始于1821年的伦敦。当时，工业革命正在进行，科学和数学从大学和实验室转移到工厂。在计算机出现之前，人们出版了大量的数学用表，方便那些从事复杂计算的人快捷运算。这些表册中容纳了对数、天文计算、工业和科学所必需的其他数据集。问题是其中的每一个数字都是手工计算的，因此包含许多错误。一个错误的数字可能会使一艘船偏离航线，损坏银行记录，或导致生产出故障机器。巴贝奇对这些错误感到沮丧，他说：“我倒希望这些计算是用蒸汽完成的。”


    这句话意义深远，而且对于那个年代来讲非常超前。从中可以捕获一种感觉，即机械的东西比有机的东西更稳定可靠。蒸汽驱动的机器以一种严格的标准被仔细打磨，这些机器孜孜不倦地工作，生产出始终如一的高质量产品。巴贝奇的天才之处就在于他意识到，如果蒸汽可以制造齿轮，那么它也可以计算对数。


    因此，他构思并试图建造一台完整的计算机。他理解这台机器的重大意义，并指出“只要有一台分析机(Analytical Engine)存在，它必然会引领未来的科学进程”。不幸的是，他耗尽了资金、努力却以失败告终，这也是一直以来新兴事业的普遍命运。然而，在2002年，伦敦科学博物馆造出了巴贝奇设计的重达10,000磅的计算机，它运转完美。巴贝奇的故事讲完了，这个猜测蒸汽可以为计算机提供动力的人退场了。


    接下来上场的是艾伦·图灵(Alan Turing)。在我们的故事中，图灵的贡献出现在1936年，当时他第一次描述了我们现在称之为“图灵机(Turing machine)”的东西。图灵构思了一台可以处理复杂数学问题的假想机器。该机器由一条狭长的方格纸带组成，理论上它是无限长的。在纸带上，总是有一个活动单元格，在该单元格上方悬停着一个读写头。根据收到的指令或运行的程序，读写头可以在纸带上读写和移动。


    图灵机的意义不在于“他指出了如何建立一台计算机”，而是“这个简单的假想设备可以解决大量的(几乎所有的)计算问题”。事实上，今天计算机可以做的任何事情，理论上都可以在图灵机上完成。图灵不仅构想了这台机器，而且把原理都弄明白了。想一想这台简单的机器，这个只用到几个部件的思想实验(thought
    experiment)：阿波罗11号登月和返回地球所需要做的一切都可以在图灵机上编程，你的智能手机能做的一切都可以在图灵机上编程，IBM沃森(IBM Watson)[24]能做的一切都可以在图灵机上编程。谁能猜到这样一个不起眼的小设备竟能做到这一切呢？图灵确实想到了，但似乎再没有其他人像图灵这样拥有独特的想法。图灵的故事到此结束。


    下面讲约翰·冯·诺依曼(John von Neumann)，我们称他为现代计算机之父。1945年，他为计算机开发了冯·诺依曼体系结构(von Neumann
    architecture)。如果说图灵机纯粹是理论上的，旨在界定计算机可以做什么的问题，那冯·诺依曼体系结构就解决了如何构建真实计算机的问题。他建议使用一个内部处理器和可以同时存储程序和数据的计算机内存。除此之外，可能还要有外部存储器来存储当前不需要的数据和信息，再加上输入和输出设备，一个冯·诺依曼装置就组建完成了。当你阅读的时候，你可以把你的所读依次映射到计算机的中央处理器、内存、硬盘驱动器、键盘和显示器，这样就走了一圈。


    最后来说说香农。在1949年，克劳德·香农(Claude Shannon)写了一篇题为《编程实现计算机下棋》(Programming a Computer
    for Playing Chess)的论文，其中描述了一种将国际象棋简化为可以在计算机上编程的一系列方法。虽然这听起来没什么大不了，不太可能让香农成为计算机史上的拉什莫尔山(Mount
    Rushmore)[25]的四大巨头之一，但从实际和现实的角度来看，香农让计算机可以在一个抽象的层面上操作信息，决定如何移动棋子。这让人们第一次认识到了计算机不仅仅是用来进行数学计算的机器。想想看，1949年以前，计算机只是那种物理课上用到的，可编程的计算器；1949年以后，可以想象某一天，计算机会建议你购买哪些股票。尽管包括图灵在内的许多其他人在理论上都证明了计算机的能力，但是香农将其实现了。


    总结一下：巴贝奇认识到可以用机器做数学运算，图灵发现他们还可以运行程序，冯·诺依曼想出了如何构建计算机硬件，而香农展示了软件如何做乍一看不像数学问题的事情。


    这就是我们今天的处境。唯一真正改变的就是计算机变得更快、更便宜了。为了观察这种现象，让我们算下每秒进行10亿次浮点运算的成本是多少。在1961年，还不存在这样的计算机，但如果你把美国两年的GNP(国民生产总值)全都花在购买当时速度最快的计算机上，然后把它们连接在一起，其计算速度就会接近每秒10亿次浮点运算。


    到1984年，买一台1 gigaflops(每秒进行10亿次浮点运算)的计算机——克雷“超级计算机”[26]，大概要付出相当于购买一架非常好的私人飞机的价钱。但相比花费两年的GNP，价格已经暴跌，算是很便宜了。到1997年，用买一辆优质德国跑车的钱就可以获得1
    gigaflops的计算能力。到2013年，超级计算机索尼PlayStation 4问世，价格低至25美元/gigaflops。到了现在，10,000倍 gigaflops的计算机售价才几百美元，成本仅5美分/gigaflops。


    计算机性能的价格将很快降到零点几美分/gigaflops，并还将继续快速下降。现在的超级电脑不再使用gigaflops作为度量单位。甚至也不使用teraflops(1000
    gigaflops)，而是使用petaflops(1,000,000 gigaflops)。截至2018年1月，全世界最快和第二快的计算机都位于中国。它们的运行速度接近100
    petaflops(100,000,000 gigaflops)。然而，预计到2018年晚些时候，美国、日本，无疑还有其他地方将制造出运算速度超过100 petaflops的计算机。此外，至少有五家公司承诺在2020年前推出exaflop(1000
    petaflops)机器。没有任何迹象表明这场竞赛在近期有放缓的趋势。


    这一切是怎么发生的？价格怎么会跌成那样？在1960年，你可以花大约1美元(相当于今天的8美元多一点)买一个晶体管。所以，如果你需要12.5万个晶体管，就需要付出相当于今天的100万美元。但随着产量的飙升，价格大幅下跌。到2004年，晶体管的制造数量已经超过了全世界种植的稻米数量。仅仅六年后，在2010年，你可以用买一粒米的价钱买到1960年价值100万美元的125,000个晶体管。


    技术更新是不停歇的，它变得更好，更便宜，永不止步。正是基于计算机未来潜在能力这一事实，许多计算机科学家提出了他们的主张，例如通用人工智能、机器意识。我们将在本书的其余部分讨论这些主题。


    电脑介入我们生活中到底有多深？没有人知道世界上有几十亿台计算机在运行。据信，计算机使用的电力约占世界全部电力的10%。它们是我们生活中如此重要的一部分，以至于没有它们我们大概真的无法生活，更不能维持我们目前的生活水平。我们的人口也许太过庞大，特别是在大城市，如果计算机被移除或丧失功能，没有计算机在后台管理从物流到水处理的所有事情，可能会导致人类消亡。正如史蒂夫·沃兹尼亚克(Steve
    Wozniak)[27]所说：“突然间，我们失去了很多控制。我们不能关掉互联网，我们不能关掉智能手机，我们不能关掉电脑。你过去常向一个聪明的人请教问题，现在你问谁？它以g-o开头，但它不是上帝，而是谷歌。”


    在20世纪60和70年代，我们建造了足够多的计算机，意义在于把它们连接起来组成一个巨大的网络，我们称之为互联网。1989年，蒂姆·伯纳斯·李(Tim Berners-Lee)创建了超文本传输协议(HTTP)，用于从远程计算机上访问服务器上的文档。我们称之为万维网(WWW)。现在，我们不仅要把计算机连接到互联网上，还要把所有由数据驱动的设备都连接到互联网上。目前大约有300亿台设备联网，预计到2030年这个数字将上升到5000亿台。


    这个故事讲述了我们如何从第三纪最后衰落的几个世纪走向第四纪的门槛。每一个新时代都见证了技术外包，也见证了人类肉体生命或精神生命机能的增强。我们用火来帮助消化，用文字书写来增强记忆，用车轮来解放我们的背和腿。在我们的时代，我们已经创造了一种设备——机械大脑，它用途广泛，可以通过编程来解决我们要求它解决的几乎无限多的问题。我们现在正在开发人工智能，一种让设备独立运行的方法，通过机器人技术的力量，我们已经开始赋予它机动性，以及与物理世界互动的方式。我们将越来越多地、想必是尽可能多地使用计算机和机器人来外包我们的思想和行动。这是一个真正的变化，它标志着一个新时代——第四纪的到来。从这种转变中产生的问题是深刻的，因为它们关系到作为人类意味着什么。机器能思考吗？他们能有意识吗？所有的人类活动都能被机械地复制吗？我们只是机器吗？这本书的最终目的是探索这些想法——弄清楚我们究竟可以将多少人类活动，包括脑力和体力活动，委托给机器，以及这种变化的影响对世界的意义所在。


    第四纪已经开始了吗？好吧，当只有少数人学会了耕作，或少数与世隔绝的地方发展了文字，是否就标志了一个新时代的开始，或是旧时代终结的开始？其实我们从哪里分期无关紧要。我们现在谈论几十年前克劳德·香农解释计算机如何编程下棋时是否意味着新时代到来了，抑或是否在几年后，只有当计算机可以用自然语言与人类进行复杂的对话时才昭示了新纪元的出现？这种过于琐碎的分析也不具有特别的意义。我们假设转变开始的时间不早于1950年，完成的时间不迟于2050年。你可以选择在这期间的任何地方画一条线，或者将整个周期标记为过渡期。


    什么时候开始并不重要，重要的是要明白一旦它真的开始了，变化就会很快发生。我们花了5000年的时间才从发明车轮发展到登上月球(有趣的是，我们登上月球之后，才有人想到把轮子安装到行李箱上)。但在2500年前，我们却没有到地球与月球之间一半的距离，差得远呢。从人类第一次在月球上行走的时刻倒推20年，我们才打破了音障(sound
    barrier)[28]，倒推60年我们才实现了空中飞行。在发明车轮之后的4940年里，我们仍然牢牢地附着在这个星球的表面，但60年后，我们不仅飞了起来，还登上了月球并返回了地球。正是在这种发展速度下，伴随着频繁的戏剧性的革命，你应该期待第四次变革降临到我们身上。就像飞机着陆前经历的最剧烈的颠簸一样，我们从这一点向前的旅程也将会有些颠沛。未来50年里，我们可能会看到比过去5000年更多的变化。弗拉基米尔·列宁(Vladimir
    Lenin)说：“有时候几十年都一成不变，有时候几周内却沧海桑田。”随着第四纪的到来，预计人工智能和机器人技术将会以越来越快的速度取得突破。


    数百万年来，我们一直在使用科技。10万年前，我们有了语言。几千年前，我们开始深入探讨宇宙及我们在宇宙中的位置。几个世纪前，我们将科学系统化，创造了难以想象的繁荣。几十年前，我们开始制造机械大脑，就在几年前，我们学会了引人注目的新方法，让这些“大脑”更加强大。这一刻似乎就是历史的转折点。


    现在，我们已经来到了第四纪的门口，我们发现自己对我们到底建造了什么和究竟将走向何方存在分歧。现在我们正在创造的技术，将迫使我们重新审视一些非常古老的问题的答案。


    ## 05 三个重要问题


    既然第四纪即将来临，我们已经准备好去解决机器人、工作、人工智能和有意识计算机的问题。为此，我需要向读者提出三个基本问题。在这本书的其余部分，我将反复提及它们。它们都是老生常谈，是我们几千年来一直在问自己的问题。说“没有错误答案”是不准确的，因为无疑，有许多错误的答案，只是对它们错在什么地方没有达成一致。


    为什么这些问题很重要？因为它们关系到我们将要讨论的许多问题，包括人工智能能做什么，计算机是否能变得有意识，以及机器人是否会取代我们的所有工作。虽然有人也许希望我们直接跳到技术细节，但这不是解决这些问题的最佳方法。如果有意识的计算机——能够思考的机器，以及能够复制人类全部能力的机器人——是有可能实现的，那么技术的稳步提高最终将把它们带给我们。换句话说，如果它们是可能的，那么它们就是不可避免的。但它们真的是可能的吗？这个问题远未解决，而它的解决完全取决于“三大问题”的答案。


    这些问题是哲学性的，而不是技术性的，回答它们，你不需要具备人工智能或机器人方面的专业知识。从历史上看，这些问题对现实世界的影响不大。它们主要是学术性的心理练习，那种你可能会在深夜与大学朋友讨论的东西。但现在一切都变了！在第四纪的黎明，它们突然变成了非常实际的问题。从非常真实的意义上讲，这三个问题的答案将决定我们整个物种的未来和命运。我再重复一遍：几千年来一直只是抽象的，而且对许多人来说基本上无关紧要的哲学思考，现在是我们这个时代的核心问题。如果一个人知道他们的答案，未来会变得更加清晰。如果你觉得解决重大的哲学问题很困难，那么，好吧，我唯一能安慰你的是，它们都是以多项选择题的形式呈现的。


    ### 宇宙的构成是什么？

