    # # 第四章 计算机意识


    未来的计算机是只存在于这个世界上，还是在体验这个世界？它是否既具有自知，又能够反思这种自知？但我们还可以走的更远，思考当我们把人类独特的本质赋予机器人的时候，我们是否能够将机器人看作我们的同类？计算机除了需要问我是谁，可能还需要问我做对了吗。


    # 约翰·弗鲁姆的故事


    在太平洋靠近澳大利亚的海域，是美拉尼西亚地区(Melanesia)，由瓦努阿图(Vanuatu)、所罗门群岛(the Solomon Islands)、巴布亚新几内亚(Papua
    New Guinea)、斐济(Fiji)四个国家以及一些较小的岛屿组成。第二次世界大战期间，这些国家处于太平洋战区的交通要塞，所以美军来到了这里，并由此在当地出现了一种奇怪的社会现象，被称为“货物崇拜”(cargo
    cults)。


    这些岛屿上的原住民亲眼看到，登陆后的美军清理了一些地面作为跑道，并建造了一座瞭望塔。之后在岛民充满敬畏的注视中，空中的飞机呼啸着降落在跑道上，卸下大量货物，通常，军方会与岛民分享其中的一些，包括罐头食品和加工制品。


    这催生了“货物崇拜”。当地人照猫画虎，也清理跑道，用竹子建起塔台。他们没有收音机，大概就用椰子做成了一个与收音机形似的盒子。他们没有灯光来引导飞机进入跑道，作为替代他们沿着跑道种植竹子。他们用木头做枪，学着美国人那样进行军事演习。他们穿的衣服，也被刻意设计得与美军军装类似。有时他们甚至会用稻草建造全尺寸的飞机，希望能引来其他飞机。他们做了美国人之前在当地所'
  - '[PAGE 189]


    做的一切。但奇怪的是，他们的召唤不管用了，飞机不再着陆，也不再有货物到达。


    即使在今天，瓦努阿图依然有一群人信仰二战时期美国军人的理想化身——约翰·弗鲁姆(John Frum)。每年的2月15日，他们都会举行游行来纪念他，并坚信他有朝一日会带着货物重返人间，与众人分享。


    # 16 感知能力


    我们要阐述的问题是，能否创造出有意识的计算机，如果不能，那么这些致力于造出一个的人们是否只是“技术性货物崇拜”的信徒？他们受到迷惑，相信如果以某种方式制造机器，“飞机”就会着陆，机器就会有意识。


    我们将直面意识(consciousness)问题，但要做到这一点，首先需要探究两个概念：感知能力(sentience)和自由意志(free will)。对它们的全面了解将有助于确定机器是否可以变得有意识，因为尽管这两个词不是意识的同义词，但它们确实与意识有一些共同的本质特征。让我们从“感知能力”开始。这个词经常被误用，在科幻小说中，它通常用来表示“智能的(intelligent)”，比如“参宿七(Rigel
    7)[1]上的存在者已经开始构建城市，并且明显是具有智能的(sentient)”，但这并不是它真正的意思。它其实是指感觉或“觉察”事物的能力。在参宿七这个例子中应该使用的正确单词是“有智慧的(sapient)”，其意等同于“智能的(intelligent)”。这就是为什么我们是智人(Homo
    sapiens)也叫作智能人(intelligent people)，而不是知觉人(Homo sentients)。


    虽然感知能力并不意味着“智能”，但它对我们来说仍然是一个重要的概念。例如，我们关心动物是否有感知能力。它们能感觉到疼痛'
  md: '

    妨碍了道德准则被以简单的方式实例化为计算机程序。阿西莫夫认为他可以用三条法则来解决这个问题，但一个人的道德准则包含数千条。考虑以下内容：


    偷窃是错误的吗？是的。


    第二次世界大战期间从纳粹手中偷窃也是错的吗？不，这没有错。


    二战期间从纳粹德国的一家儿童医院偷面包是错的吗？哦。好吧，我承认是错的。


    二战期间，当你饿坏了的时候，从纳粹德国一家儿童医院偷取一些多余的面包，这是错的吗？嗯，我想这没错。


    正如你可能猜到的，这个问题可以无限延伸。


    “未来生命研究所”(Future of Life Institute)支持的一个项目，致力于解决如何在AGI中灌输伦理道德的问题，它是这样描述这一挑战的：“一些AI系统确实会根据其后果生成决策，但道德并不只取决于后果。道德评判还受权利(如隐私)、角色(如家庭中的)、过去的行为(如承诺)、动机和意图以及其他道德相关特征的影响。这些多样化的因素还没有被植入AI系统。”


    问题很棘手。随着人工智能进入医学等更为关键的领域，它所做出的伦理决策影响会越来越大。不要搞错的一点是：未来AI将会编入伦理标准程序。这甚至不是有意之举。一旦AI必须在X和Y之间做出抉择，它必然应用某种类型的价值体系，而且几乎肯定会产生意想不到的后果。目前，AI的价值体系等同于创建AI的程序员的价值体系。如果我们曾经实现过AGI，那么这个体系的道德价值含义将会更加深刻。


    AGI面临的第二个伦理挑战是如何在伦理层面使用它。谈到这个，我的脑海中立即浮现出在伦理上滥用AGI的几种方式，我可没有犯罪策划者那般邪恶的狡猾，能想到这些无非是因为其本身就显而易见。AGI将成为一个强大的、新兴的和创造性的工具，被用于偷窃和诈骗。这是一种古老的舞蹈，和文明一样古老；然而，那些站在法律和秩序一边的人也会利用AGI来挫败同样的犯罪行为。


    AGI也可能在其他方面被误用。例如，国家、公司或其他实体可以利用它以新型的、复杂的方式侵犯隐私。举个例子，它可以截取大量的互联网传输流量，有效地查看每个人正在输入和浏览的内容。它可以读取每个人的电子邮件。通过语音识别技术，它不仅可以监听每一个电话，还可以监听麦克风附近的所有对话。摄像机已经覆盖了整个世界，人脸识别技术方兴未艾。牛津大学和谷歌深度思考(DeepMind)的研究人员在唇语阅读方面取得了重大进展，该技术可以与摄像机结合使用。以上技术进步引发了什么结果呢？即一台实际上无所不在又无所不知的机器。


    如果听说某个机构能够收集所有数据，并不会令人惊讶。那已不是新鲜事。但由于数据集的庞大规模，隐私得以受到保护。我们每个人都在信息海洋中迷失。没有人能探明其意，连计算机也不能将它全部整理分类。但是想象一下AGI能做什么，它可以理解所有语言，识别所有面孔，跟踪所有行动。它可以有效地创建针对每个人的主文件，甚至能注意到最隐晦的细节。之后，它可以连接所有的点位，找出所有的联系，推测每一个计划，计算出每个人做任何事情的可能性。在它面前除了“个人思想”有希望逃离控制外，其他领域毫无隐私可言。


    这不是一场以阴谋论为主题的谈话。我们正以非恶意的理由快速开发这些工具。几乎所有你读到的关于大数据的东西，无论是医学、气象学还是其他什么，都需要这些工具。能够识别癌症幸存者的症状之间关联的技术，与能够识别政治派别之间联系的技术是相同的。它们的区别只在于数据差异。顺便说一下，以上技术都不需要AGI的超级智能自学能力，所以现在对于我们没有难度。虽然创建AGI的可能性仍然是一个悬而未决的问题，但我们一直在稳步改进狭义AI技术。随着时间的推移，我们将在这方面做得更好，处理器将变得更快，世界上越来越多的生物将与网络互联生活。只要改变一个国家的法律，就能将互联网从信息工具转变为监控工具。毫无疑问，这种情况已经在世界上的某些地区发生了。


    我们如何防止其发生？最简单的方法就是不要去改变。问题是，它将零零星星地出现，而单独一项并不值得发起一场抗议游行。之后，出于安保的利益，它将迅速加快发展。然而最终，只有当人们大声疾呼、提出要求时，监控型国家(surveillance
    state)才会出现。自由常因民众的欢呼而消亡。


    滥用AGI的另一种可能性大概看起来没那么糟糕，但它值得深思。它与AGI的情感方面和潜在的非人性化方面有关。前些时候，我讲了早期人工智能先驱约瑟夫·魏森鲍姆的故事。后来，当他看到人们如何与他发明的简化人工智能治疗师伊莱扎进行情感互动时，他转而反对创建AI的想法。1976年，他写了一本具有里程碑意义的书，名为《计算机威力与人类理性》(Computer
    Power and Human Reason)。在书中他坚持任何需要真正同理心的工作，如长者助手、士兵，甚至是客服代表，都不应该由计算机从事。他认为，与模仿人类同理心的机器进行广泛的互动，会让我们所有人感到更加孤立和被贬低。


    他的观点很有说服力。也许我们都有过这样令人沮丧的经历：被困在某个令人愤怒的官僚体系中，试图完成一些事情，而冷漠的人却告诉我们，我们漏掉了某项流程，他们指示我们重新排队。完全缺乏同理心是孤立的，想象一下，生活由越来越多的交互关系组成，这些互动需要同理心，而AI或AGI却在设定的程序中假装能够同理共情，这取代了真正的情感互动，着实令人担忧。


    此外，魏森鲍姆对“决定”和“选择”进行了区分，并建议计算机应该只做前者。“决定”是计算性的，就像决定哪条工作路径最短一样。然而，他认为机器永远不应该做出“选择”。一个人可能会选择把他的车撞到树上以避开一个孩子，但这是人类的特权，魏森鲍姆深感把这种权力委托给机器，非但没有让机器变得高贵，反而贬低了人类。魏森鲍姆认为，我们倾向于将人类的核心部分委托给计算机，这恰恰表明了“人类精神的萎缩，这种萎缩源自我们把自己当作计算机”，这句话让我们回想起“我们到底是什么”这一基本问题。


    另外，如果我们真的制造出栩栩如生的机器人，并编程让它们去做所有我们不想做的枯燥、肮脏和危险的工作，这会不会对我们如何看待他人产生意想不到的腐蚀影响？想象一个拥有AGI的逼真机器人，帮助奶奶做家务，让她能够独立生活。更进一步，随着时间的推移，我们使机器人在外观上、表现面部表情等方面越来越像人类。但并不是和人类无法区分，仅是与人类相似。我们将如何对待这个实体？一方面，AGI就像一个人，充满了模拟的智慧、情感和同理心，所以我们可以用一种反身性的客套态度来对待它。另一方面，它只是一堆电线和小装置，和用来疏通厕所的塞子一样，本不应该被过度关注。在这种情况下，也没有什么可关注的了。长年累月间，这种对AGI的矛盾观点将难以维持。这个可自由支配的人形机器人会不会在不经意间降低我们对人类生命的重视程度？


    日本研究人员进行的一项研究表明，事实可能就是这样。机器人Robovie II被放进了一个商场。其设定的程序是礼貌地要求挡住它去路的人让开。如果人类不这样做，机器人就会绕着人走。结果发现，孩子们往往倾向于给机器人制造麻烦。他们会故意挡住机器人的去路。


    但这还不是全部。通常孩子们的行为会从那里升级。他们变得暴跳如雷，拳打脚踢、咒骂Robovie。有几次，他们还用瓶子击打机器人。


    研究人员对“如何对机器人进行编程以避免这种情况出现”产生兴趣。他们制作了一个模型，来总结谁可能会伤害机器人。结果发现最有可能的候选者是一群没有成年人监护的孩子。因此，他们给机器人编程，让它逃离这些状况，转而奔向一个高个子的人，起码可以从身高判断出其大概是一个成年人吧。


    Robovie看起来并不像人类。然而，令人不安的是，当研究人员询问那些欺负过机器人的孩子，他们是否会认为机器人与人类相似时，74%的孩子回答“是”，只有13%的孩子认为Robovie像机器。50%的孩子觉得他们的欺压行为会给Robovie带来压力或痛苦。


    所以关键是，随着设备变得越来越复杂，这种行为模式是否会成为习惯，以及这种行为是否会影响到与他人的互动。可以想象，欺负机器人可能会让人类感到麻木。


    我们是否生活在一个模拟世界中？


    有没有可能所有这些都已经发生了，已经有人建立了一个AGI，它可以容纳模拟生命，而且这些模拟生命还相信自己是有意识的？因此，有没有可能我们实际上是生活在模拟中的实体？如果真是这样，那么“为什么世界上存在伤痛、悲惨、疾病和苦难？”的问题就呈现出了新的意义。苦难当然是真实的，至少对那些遭受苦难的人来说。在《黑客帝国》中，谈到了在模拟世界中遭受的痛苦问题，但之后就被刻意回避了。当时特工史密斯(Agent
    Smith)解释说，最初黑客帝国“被设计成一个完美的人类世界，在那里没有痛苦，每个人都会快乐”，但他接着说，它是一场灾难，因为我们的大脑不会接受此般完美。但这


    是好莱坞式的回答。有很多真实的社会，相对来说伤痛和苦难就很少。因此，如果我们的现实是一个模拟世界，它似乎既不是故意的仁慈，也不是有意残忍，它更为中性。有一个古老而神秘的想法认为我们周围的一切都是幻觉。而关于模拟世界的假设其实也如出一辙，只不过它披着现代的外衣，手持苹果手机罢了。尼尔·德格拉斯·泰森
    (Neil deGrasse Tyson)表示，模拟这种可能性“非常高”。其他追随者包括广大的知识分子、科幻作家、硅谷人士，比如埃隆·马斯克。从广义上讲，支持模拟观点的论据有两个：


    首先，统计概率论。这意味着：在某一时刻，我们将能够在计算机中对我们宇宙进行完全现实化的模拟，并让人类以代码形式存在于其中。考虑到宇宙的年龄，我们有理由假设其他文明已经先行一步了。一旦模拟世界被创建了一次，就可以生成无限多的模拟副本。鉴于宇宙的规模，接近无穷尽的物种可能已经开发了这种模拟技术，每个物种都能被复制数百万次。因此，很有可能存在一个“真实”宇宙和10000亿个数字宇宙。从统计数据来看，我们几乎确定生活在万亿数字宇宙之中。


    我觉得这种推理不能令人信服。就像是一种陈述，其中每一步都是真实的，但结论却具有误导性，例如“系安全带会增加癌症发病率”或“几乎所有谋杀都发生在凶手进食后的10小时”。我认为这种说法缺乏真诚，事实上，我们没有理由相信其中任何说法的真实性。我们没有理由相信一个模拟人会有主观体验，就像我们没有理由相信吃豆人(PacMan)[17]在被鬼击中时会感到疼痛。我们没有理由相信一个外星物种会进行模拟，也没有理由相信人造宇宙的存在，如果模拟宇宙真被开发出来了，其将被无限地复制，但我们依然没有理由相信进行模拟的人会欺骗我们，让我们误以为自己是真实的。


    支持模拟假设的第二个论据是，如果把模拟世界看成《黑客帝国》里的“矩阵”(matrix)，我们可以真实地检测到这个矩阵中的小瑕疵。具体是这样的：任何模拟因其内在属性都必然是有限的，因为运行它的计算机是有限的。所以，模型会有边界，可能以极限的形式表达，我们将其理解为约束我们宇宙的物理定律。但光凭这些还不能完全建立模拟。想想外太空数十亿个星系，每一个星系都由数十亿颗恒星组成，每一个恒星又由10^57个原子(1后面跟着57个0)组成。每个原子都有自己的速度和轨道。从我们的角度看，这些庞大的星系只不过是夜空中的一些小光电，构建这样一个模拟系统的人不太可能为了跟踪每个原子的位置而过度使用所需的数据处理能力。一些科学家坚持认为，我们能够发现矩阵中极限和模糊计算的相关证据。


    网上对这种可能性进行了激烈的讨论，如果你倾向于接受红色药丸，可以从一篇由波恩大学(the University of Bonn)的赛拉斯·比恩(Silas
    R. Beane)和他的团队撰写的论文《数字模拟宇宙的束缚》(Constraints on the Universe as a Numerical Simulation)开始。


    但我个人拒绝沉迷于此。奇怪的是，关于“我们知道的一切和我们爱的每一个人是否只存在于一个外星少年的U盘里”的猜测，似乎并无关紧要。无论我们是否生活在一个模拟的世界中，我们只知道一个宇宙，其中只有一颗行星孕育了生命。作为一个物种，我们还有很多事情要做，包括养活饥饿的人，治愈疾病，以及创造一个所有人都能发挥最大潜能的世界。无论是模拟还是现实，痛苦和折磨对那些经历过的人来说都是真实的。


