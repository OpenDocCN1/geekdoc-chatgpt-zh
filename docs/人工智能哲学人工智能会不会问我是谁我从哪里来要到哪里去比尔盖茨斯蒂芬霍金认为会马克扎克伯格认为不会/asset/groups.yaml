    痛吗？ (4)一个没有神经系统的结构复杂的外星人是否可能以一种与人类完全不同的方式感受疼痛？ (5)无机物(即不含碳的)有没有可能感觉到疼痛？其中可能包括晶体、雷暴、由水和泥土构成的外星人，或其他无机物质。


    你回答“是”的次数越多，你就越相信机器是有感知能力的。


    # 17 自由意志


    在讨论“计算机变得有意识”这个问题之前，我们要讨论的第二个话题是自由意志。为什么这与计算机意识密切相关呢？在你的日常生活中，你有体验，这是意识的基础，你做出选择，这就是自由意志。你品尝菠萝是有意而为的体验，然后你会行使自由意志，选择是否再咬一口。自由意志和意识就像同一枚硬币的正反两面，就如同你在体味菠萝的同时也在行使自由意志。


    如果自由意志最终被证明是完全机械的，实际上只是一种幻觉，这将表明(尽管不能证明)，意识也符合这种模式。然而，如果自由意志存在于物质因果关系之外的东西，那么意识也可能如此。此外，如果自由意志确实存在，那么我就会想到两个问题：“它从何而来？”“计算机可以有自由意志吗？”


    我们通过两套不同的物理定律来理解物质世界，一套适用于大物体(large objects)，另一套适用于小物体(small objects)，二者似乎都不允许自由意志。大物体遵循牛顿物理学说，该学说认为每一个行为过程都有其原因。你生活中的每一件事，直到今天早上你的脚指头撞到床架上，都是一系列可以追溯到宇宙大爆炸事件的必然结果。适用于小物体的一套法则是量子理论，该观点下存在没有缘由的行为，这些行为完全是随机的。放射性物质的衰变常被引作例子，它以一定的速'
  - '[PAGE 196]


    率衰变，但单个粒子的衰变却是完全的、真正随机的，这里所说的“随机”是指其最本质的含义。所以，从本质上看，你要么是个机器人，要么是个行为随机的疯子。


    一方面，我们确实有一种看起来像自由意志的东西。另一方面，我们没有找到很好的方法来解释自由意志存在的可能性。正因为如此，人们分成了两个阵营：相信自由意志的“自由意志论者(libertarians)”(不同于与政治意识形态层面的自由主义者)，和不相信自由意志的决定论者(determinists)。对我们来说，最重要的问题即你的大脑是否是一个因果系统。换句话说，你的大脑是不是就像一个巨大的发条装置？你上好发条，它就会运行它那死板不变的程序。人们都不认为时钟有自由意志。它只是精准执行它被设计来做的事情，在做什么的问题上，时钟毫无发言权。你也是这样吗？你正在做选择的想法只是一种错觉吗？一般来说，二元论者相信自由意志，而一元论者则不相信。


    神经科学如何看待自由意志？约翰·霍普金斯大学(The ohns Hopkins University)的利昂·格迈因德尔(Leon Gmeindl)和邱宇钦(YuChin
    Chiu)做了一个有趣的实验。他们将受试者放在核磁共振成像机中，受试者可以看到一个屏幕，屏幕的左侧和右侧有彩色的字母和数字在滚动，而中间什么也没有。他们被要求注视一边，转换他们的注意焦点，再看另一边，然后，在某一时刻，将焦点转换回来。他们没有得到何时做这些事情的指令，全部自发完成。这一实验的构想是，无论大脑的哪个部分在转换焦点的前一瞬间处于活跃状态，那就一定是“自由意志”所在的区域，或者至少是改变注意焦点的自由意志的所在。果不其然，格迈因德尔和邱在受试者们的大脑中发现了一致的区域，在那里，焦点转换之前会立即引发活跃状态。那么，这就是所谓的自由意志存在于大脑中的地方吗？如果是，它看起来的确像是纯粹的确定'
