    约翰·霍普金斯大学的另一个项目包含了制造一个可以由大脑控制的完整的人造手臂。目前，大约有十几种假肢投入应用，但同样，它们也需要手术，目前每条假肢的成本为50万美元。然而，约翰·霍普金斯大学截肢研究项目经理罗伯特·阿米格(Robert
    Armiger)说：“所有这项工作的长期目标是以无创的、无须额外的手术、没有额外的植入物的方式，找到控制精密的机器人设备的方法。”


