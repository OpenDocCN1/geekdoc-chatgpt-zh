    早些时候，我们讨论了凯恩斯的观点：在未来，我们每周只工作15个小时。我建议，如果以历史为鉴，除满足基本需求的必要劳动外，我们还应继续做工，旨在获得一份不断增长的“需求清单”。也就是说，在第四纪，我们肯定还会有休闲时间，甚至更多。


    多余的休闲时间无疑会有新的来源。其中之一将是“更加节省个人劳动力设备”的开发。我们以前见过这样的东西：洗衣机、电熨斗、电'
