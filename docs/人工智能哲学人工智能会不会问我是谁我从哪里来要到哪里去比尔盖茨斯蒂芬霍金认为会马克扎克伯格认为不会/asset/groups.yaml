    ## 第二章 狭义人工智能和机器人


    解数学题仿佛是比知道我是谁更复杂的能力，但现在已经实现的“狭义人工智能”可以轻松解决我们需要想破头的数学难问题，却不会像我们问父母一样问：“我是从哪里来的？”它仅仅是个被我们使用的工具。看起来能够思考自我才使我们掌握了主导权。


    ### 约翰·亨利的故事


    在19世纪的民间故事中，约翰·亨利(John Henry)被描述为一名“钢钻工”，他的工作是把钢钉锤入岩石。结合当时的历史环境看，这么做是为了在岩石上凿洞，以便在其中插入炸药，从而为铺设新的列车轨道扫清路障。约翰·亨利是当时最好的钢钻工，直到有一天，人们发明了蒸汽钻机来做同样的工作。约翰·亨利不认为自己会被机器取代，所以他告诉工头：“好吧，一个人必须表现得像个男人。在蒸汽钻机打败我之前，我不会屈服，即便我死，也要手握钢锤而死。”于是他向蒸汽钻机挑战，看到底谁更好。这是一场势均力敌的比赛，约翰·亨利最终获胜了。然而，这项比赛强度太大了，以至于比赛一结束约翰·亨利就当场瘫倒在地，手里拿着锤子精疲力竭地死去了。各地的人都感叹说，“约翰·亨利死得像个男人”。


    ### 06 狭义人工智能


    人工智能到底是什么？这不是一个一拍脑袋就能回答的简单问题。为了尝试解答这一问题，我们需要回到这个术语起源之时。


    人工智能在1955年左右开始成为一门真正的科学。那一年达特茅斯学院(Dartmouth College)的数学教授约翰·麦卡锡(John McCarthy)决定发起一个项目，探索“人工智能”的可能性和局限性。“人工智能”这个词就是约翰在上一年刚创造的新术语。该项目的目标是“找到某些途径，使机器能够使用语言、形成抽象概念、解决目前留给人类的各种问题，并改进它们自己”。为了做到这一点，他召集了另外三名计算机科学家：马文·明斯基(Marvin
    Minsky)、纳撒尼尔·罗彻斯特(Nathaniel Rochester)和克劳德·香农(前文讨论首个象棋计算机程序时提到过他)，组成一个小组。这四名小组成员都致力于研究“可以思考的计算机”。


    他们的目标是“探索如何让机器使用语言，形成抽象概念，解决目前留给人类的各种问题，并改进它们自己”。随后，他们又为这一目标增加了一条非常“乐观”的预测，说它乐观主要是因为考虑到那是在1955年提出的：“我们认为，如果精心选拔的一组科学家共同研究一个夏天，这些问题中的一个或多个可以取得重大进展。”


    后来麦卡锡后悔使用“人工智能”来描述这个概念，他觉得这个词的起点太高了。他真希望自己当时把它叫作“计算智能”。许多业内人士直到现在仍然同意这一观点，并竭力与“人工智能”这个术语保持距离，但是他们这么做似乎往往是出于商业动机，企图在人工智能领域再开辟一个新的领域，好让他们可以自称为先驱。


    我认为“人工智能”这个词很棒，但存在两个问题：“人工”和“智能”。“人工”这个词的问题在于它有两种完全不同的意思，容易产生歧义。用“人工”做修饰语，是不是意味着它看起来像智能但实际上不是？就像“人工草坪”中的“人工”一词？或者应该把“人工”这个词理解为真正的智能，但却是人造的，区别于自然或生物创造的？同样，“智能”这个词也是一个问题，因为对什么是智能没有一致的定义。而各种候选定义对“智能”的解读范围又太过宽泛，让人摸不着头脑。


    俗话说，“谁带你入场，你就该和谁跳舞”。自我们知道“人工智能”这个词起，一直走到今天这一步，它已经成为了约定俗成的叫法，带我们入场了。而且考虑到中国跳棋(Chinese
    Checkers)既不起源自中国(Chinese)，也不是西洋跳棋(Checkers)，阿拉伯数字是在印度创造的，考拉熊不是熊，那么使用人工智能这个术语可能也没问题。


    关于人工智能，最宽泛的定义是：对数据或其环境做出反应的技术。这意味着带有烟量传感器的喷水灭火系统也是人工智能的一种。除此之外，还有一种更严苛的定义：人工智能是一种可随机应变的技术。从这个意义上说，一个可以根据你喜欢的房间温度来自动调节温度的机器是人工智能，但自动喷水灭火系统就不属于人工智能了。


    但是真的很重要的一点是，今天当人们谈论人工智能时，这个词表示了两种截然不同的含义：“狭义人工智能”(narrow AI)和“通用人工智能”(general
    AI)。我们现在所拥有的AI只是狭义人工智能，这也是迄今为止我们唯一知道该如何构建的人工智能种类，它也被称为“弱人工智能”(weak AI)。狭义人工智能是指计算机解决特定问题或执行特定任务的能力，在现实生活中用途很多。另外一种人工智能有三个不同的学名：通用人工智能(general
    AI)、强人工智能(strong AI)或人工通用智能(artificial general intelligence，简称AGI)。这三个名称可以互换使用，但从现在开始，我会特定使用AGI来指代像你我一样聪明和多才多艺的人工智能。Roomba真空吸尘器、苹果智能语音助手Siri、无人驾驶汽车都是狭义人工智能，一个可以卸载洗碗机的假想机器人也是狭义人工智能。但如果你想要一个MacGyver机器人[1]，那就需要AGI，因为MacGyver必须对能够应对以前没有遇到的情况。AGI目前还不存在，即使AGI有实现的可能性，也没有关于如何构建它的协议，这就是本书第四部分要讲的内容。就目前而言，我们只关注狭义人工智能，尽管它的名字听起来有点弱，但它确实是一项了不起的技术。狭义人工智能并不是“简单的人工智能”，因为人类在人工智能领域投入的绝大多数金钱和汗水，都用在研发这类人工智能上了。从这里开始，当我使用人工智能(简称AI)这个术语时，我指的是狭义的人工智能。


    AI已经发展到了每天会出现在我们生活中的地步。这是一个漫长的过程，因为在过去几十年里，随着人们对AI缓慢发展的失望，对该技术的投资曾经枯竭，AI的进展已经放缓了好几次。这些匮乏时期被称为“AI寒冬”，它们一直持续直到有一些新技术或技艺重新点燃人们对AI的热情，从而开始下一轮周期，循环往复。现在，AI已经在如此多的领域证明了自己的能力，我们不太可能再经历AI寒冬了。这股进步浪潮让IBM的首席执行官吉尼·罗梅蒂(Ginni
    Rometty)预测“到2021年，认知人工智能(cognitive AI，简称认知AI)将影响人们所做的每一个决策”。


    那么AI是如何工作的呢？从广义上讲，构建AI有三种不同的方法。假设你想制作一个AI告诉农民何时播种。第一种制作方法是“经典AI”，之所以叫这个名字，是因为在AI研究的早期，科学家认为这种方法是最有效的。经典AI全面考虑所有的影响因素(例如土壤类型、作物、降雨量等)，并围绕这些因素建立模型，对它们进行相应的加权，从而做出决策，为农民提出播种时间的建议。


    第二种方法称为专家系统(expert system)。召集一百位最有经验的农民，让他们写下他们所知道的关于种植的每一条规则。将这些规则导入系统并进行整理，然后你输入相关变量，系统将根据这些规则提出建议。这就是专家系统的开发过程。


    第三种方法是机器学习。机器学习指的是一个过程，通过这个过程，你可以获取所有农民何时种植以及产量多少的数据，然后用一台计算机来发现规则，通过历年的数据回顾会发现，某些规则使产量最大化了。然而，机器学习的棘手之处在于，尽管它的建议可能行得


    人工智能的发展速度可能会加快。芯片设计者谈到，他们产品的增长速度比摩尔定律预测的要快。量子计算机不再是科幻小说的幻想，它们有强化摩尔定律的潜力。谷歌的量子人工智能实验室负责人哈特穆特·内文(Hartmut
    Neven)认为10年内，随着技术的进步，我们现在用的机器会像录像机一样过时，到那时就只有量子计算机可以担起发展AI的重担。将日益增强的处理能力与每天产生的25亿GB(千兆字节)的海量数据相结合，用来训练人工智能，就有了难以想象的快速进步的可能。


    虽然上文提到的三种基本方法有各种各样的变体，但它们万变不离其宗，要么涉及创建模型，要么涉及询问专家，要么涉及研究数据。它们都不是实现人工智能的“正确”方法，因为这些方法不能解决所有的问题。这三种方法当然都是制造人工智能的正确方法，但AGI可能需要完全不同的开发路径，因为它试图做与众不同的事情。换言之，AGI能够解决没有预先编程的非特定问题，而AI只能解决狭义的特定问题，所以两者的制造方式有极大不同。没有人确切知道制造AGI的方法，专家们在这个问题上也存在分歧。


