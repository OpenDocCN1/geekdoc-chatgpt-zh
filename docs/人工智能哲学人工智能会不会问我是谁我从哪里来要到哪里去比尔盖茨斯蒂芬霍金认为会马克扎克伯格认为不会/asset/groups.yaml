    语系的语言更早的语言，巴斯克人中还流传一个传说，亚当和夏娃在伊甸园中也讲巴斯克语。


    语言的多功能性和复杂性着实令人叹服。拿英语为例，虽然大部分人日常中只使用大约25,000个英文单词，但当今的英语至少含有100万个特有的单词。尽管新词增加的速度正在减缓（在过去，比如莎士比亚（Shakespeare），早饭之前就会生造出三个新单词），但每个小时都有约一个新的英文单词被创造出来。而最近造成生造新单词速度减缓的首要原因是自动拼写检查程序的出现，该程序对此类的生造词绝不姑息，它会自动检测文中所谓的“新词”，并在该单词下面用红色线标记。除非你想发出一封满是红色下划线的邮件，否则最好还是老老实实使用默认列表中的官方词汇。


    在第一纪，也就是我们通过使用语言和火，作为狩猎采集者而生活的，大约10万年的时间里是怎样的景象？当时总人口在20万上下，所以即便我们不是一个濒临灭绝的物种，人类的生存也充满了不确定性。然而，实际情况无疑是多种多样的，当时的人类仍有相当一部分生活在公有制社会。直到1700年，全球范围内仍有超过5000万狩猎采集者。所以对于存于现代的狩猎采集者，我们有大量的第一手观察资料。甚至到了今天，最权威的统计数据表明，仍存在超过100个与世隔绝的狩猎采集部落，总人数超过10,000人。


    如果说现代狩猎采集者的例子体现了农业出现前人类的生存方式，我们能够断定维持生计绝不是一件轻而易举的事，可能一场急病就会导致个体死亡。所以，公有制的原型很可能起源于此，每个人对于帮助他人都怀有一种强烈的、利己主义动机，因为哪怕一个社会中最强壮的成员也有需要别人帮助的一天。由于这个原因，会共享的群体比自私的个人更具适应性。另外，在狩猎采集的生活中，积累财富并没有什么意义，一整天挖来的毛毛虫不是财富，就算当它是财富，也无法保存。日复一日，当时的人类勉强维持着贫瘠的生活，只是为了在凛冽的冬天或者在遭遇一头暴戾的猛犸象时能够活下去。


    透过浪漫主义的“玫瑰色眼镜”，卢梭（Rousseau）的现代追随者倾向于回顾第一纪，回归到一个更加质朴的时代：人与自然和谐共处，没有被现代世界的纸醉金迷所玷污。但如果大多数人真的回到那个时代去体验生活，很可能会发现这些旧时光并没有那么美好。首先，那个时代充满暴力。哈佛大学（Harvard
    University）的心理学家史蒂芬·平克（Steven Pinker）基于对古代人类遗骸的研究估计：近六分之一的古代狩猎采集者死于他人的暴力。作为对比，发生了两次世界大战的“血腥”20世纪，只有三十分之一的人命丧于此。因此，我们可以信心百倍地说，古代狩猎采集者的生命是短暂的、痛苦的和残酷的。但这就是人类的试验场，在语言的加持下，我们踏上了通往现代之路。


    ## 02 第二纪：农业和城市


    在大约10万年的漫长年月里的每一天，人们聚集在一起，边打猎采集边闲聊生活之道。10万年后，一些戏剧性的事情发生了——我们发明了农业，再次彻底地改变了人类和我们的社会。农耕时代发生在短短的10,000年前，当时地球上的人口数量为400万左右，只比现在的洛杉矶人口多一点。这就意味着，在9万年的时间里，我们的人口数量只增长了4~5倍，增长幅度微弱得难以置信，亦表明了我们的生活是不稳定的。


    与语言一样，农业也是一项技术，它触发了一系列其他领域的进步，其中首要的进步当数城市的出现。农业发展需要人类在一个地方安顿下来，城市因此应运而生，而这种实践几乎是创造性的。早期的城市，比如恰塔霍裕克（Çatalhüyük）[10]、杰里科（Jericho）[11]、阿布胡赖拉（Abu
    Hureyra），通常位于河流附近，以获取水源和肥沃的农田，并围绕它们建立了市场、住宅和寺庙。在第二纪里，我们开始使用鸦片，掷骰赌博，化妆和佩戴黄金首饰。


    城市促进了商业和思想交流，但它们也让我们完全地、不可逆转地定居下来。我们常驻于此，通过堤坝和梯田改造这片土地，我们筑起栅栏，我们埋葬死者并建成墓地，以便日后祭奠。这些以及其他种种习俗，就像钉死棺材的铆钉，牢牢地锁闭了我们的流浪天性，已经没有回头路了。


    伴随农业而来的第二个进步是“劳动分工”。虽然劳动分工看起来并不复杂，但其产生的巨大影响促使它成为人类历史上的重要里程碑。通过劳动分工，每个人不再做个体生存所必需的所有事情，而是专注于更精细的工作，效率得以提高，从而带来巨大的经济增长。随着贸易和技术的进步，劳动分工成为传统经济理论中仅有的三个“免费午餐”之一，即在任何人都不更加努力工作的条件下，仅通过劳动分工就可以增加整体财富。


    农业没有直接引起劳动分工，它首先让我们建立了城市，城市又产生了劳动分工。这究竟是怎么一回事？原来，当大量人口群居而生时，劳动分工最为有效。远离邻居生活的农民无法实现真正的专业化，他们必然事事亲力亲为，却无一精通。想象一下，如果你抛开自己可能很擅长的本职工作，变得自己要做一切事情，从缝制衣服到自制肥皂，那将会多么没有效率！最古老城市的考古证据表明，从第二纪开始，这些地方出现了一系列不同的职业。当人类开始大规模地成群聚居，他们就获得了专业化带来的不可思议的经济优势。


    劳动分工使得人与人之间的合作从原来可选择的渐渐变成必要的。经济学家伦纳德·里德（Leonard Read）[12]写的一篇著名文章《我，铅笔》（I, Pencil）中，描述了一件复杂又简单的事情：没有任何人知道如何制作一支简单的铅笔，铅笔还是被制作出来了，这是因为数百个不同领域的、从未谋面的人分工协作，每个人都力所能及地参与了铅笔的诞生过程。事实上，劳动分工给予了我们今天所拥有的一切，没有它，我们就不复存在。


    伴随着城市发展的另一项技术是在有组织作战中使用的武器，它们的发明是出于保卫城市中财富的需求。最早期的城市通常都会花费巨资，投入大量人力物力来修筑城墙，这意味着当时存在的入侵风险，或者至少人们认为会被入侵。


    由于农业和城市的出现，人类首次拥有了土地私有权。他们将一块区域视为自己的领土，并尽可能长期守护领土。第二纪初期的考古证据表明，土地边界往往是很明确的。哲学家让·雅克·卢梭（Jean
    Jacques Rousseau）认为这种做法是我们现代世界的开端，他同时说：第一个圈地并宣布这块地属于他，而其他人天真地相信了他，那么这个人就是公民社会（civil
    society）[13]真正的创始人。


    农业和私有土地终结了第一纪的经济平等。能力、出身和运气的先天不平等，导致了不均衡的财务积累。虽然当时还没有现代意义上的货币出现，但财富的概念确已存在。人们可以拥有土地、牲畜和储存谷物的粮仓。这种财富可以无限期地积累，一个人的富裕程度是没有上限的。由于土地可以耕种，牛也可以繁殖，早期的财富就是积累的源头。因此，财富的持有量趋于增长。鉴于财富可以代代相传，它得以在多个生命周期中积累和汇集。


    不幸的是，人类被奴役也始于第二纪。在狩猎采集者的世界里，不存在财富，或者至多是短暂拥有、只能持续一两天的财富。所以奴隶制在经济上几乎毫无意义。但是随着城市土地所有权的出现以及财富的积累，我们天生的占有欲被点燃，加上被贫困时期的记忆所激发，对财富的渴望似乎是无止境的，至少在某些人身上是这样。那些狂热地工作以赚取他们的第二个10亿美元的人就证明了这一点，尽管他们很清楚，他们赚的第一个10亿美元是十辈子都花不完的。


    对于一个没有人权或自由的概念的世界来说，奴隶制并没有带来真正的伦理挑战。直到后来，随着文明的进步，才意识到这种制度是不道德的。


    随着时间的推移，一些人聚集了比其他人更多的土地和资本。当社会越来越富裕，复杂性也应时而生。贸易变得更加成熟，科技的进步，城市的发展，所有这些的共同发展提高了一个人可以积累的财富上限。


    农业革命的一个意想不到的后果是，虽然可以生产出更多的粮食，但粮食也可以被扣留。这在狩猎采集者的世界是不可能的，但随着城市和农业的发展，扣留粮食成为当权者压制反对者的一种方式，而分发粮食则是为了确保服从，在当今世界的一些地方仍然如此。


    正是在这样的背景下，第二纪的人被划分为统治者和被统治者，出现了贵族和皇室。统治阶级享有特权，例如穿某种类型或颜色的衣服，吃某种食物，或者，就阿兹特克（Aztecs）[14]统治者来说，闻某种类型的花。而这些都是明令禁止被统治阶级做的事情。


    自由和平等之间的矛盾首次被展现在人类面前。正如历史学家威尔·杜兰特所指出的那样，鱼与熊掌不可兼得，你只能选择一个。真正自由的人将变得不平等，而被强迫平等的人又是不自由的。这场拉锯战至今仍在上演。


    早些时候，我提到想象力是进步的首要条件，而农业给了我们第二个条件。由于种植和收割作物需要规划，而狩猎和采集则不需要，我们可以将农业的发明视为对未来的概念的发明，这是进步的第二个必要条件。


    ## 03 第三纪：文字和车轮


    火让我们烹饪食物，用来供养我们的大脑，大脑又反过来产生语言，让我们能够一起工作，形成抽象思考，创造故事。10,000年前，农业让我们安顿下来，建设城市，并积累财富。城市的肥沃土壤孕育出劳动分工，而劳动分工促进了经济增长和创新。


    第三纪始于5000年前，那时生活在现今伊拉克南部的苏美尔人（Sumerians）[15]可能是第一个发明文字的人类，大约在同一时期，埃及和中国似乎也都独立发展了自己的文字，有学者认为中国才是最早的文字发明者，而后在现今的墨西哥也开发了自己的文字。文字改变了人类，因为这是第一次，一个人所知道的东西可以在他死后被完好地保存下来。知识可以完美地复制和传播到世界各地，人的想法可以脱离人的头脑而长久存在！


    以上这些好处都不是发明书写的原因。最早期的文字是为了记录资产和交易，随后逐渐扩展延伸到法律文书、法律规范和宗教典籍，戏剧和诗歌等创造性的写作则出现得更晚一些。


    起初，正如人们所预料的那样，这个星球上的1000万人口中很少有人会阅读。因为书写的花费很高，不仅学习读写要投入大量的时间，而且“纸张”的选择十分有限，要么是纸莎草纸，要么是烤黏土，要么是大理石，要么是其他贵得离谱的材料。所以读写能力的普及十分缓慢。


    但是文字的力量使它迅速扩展到生活的各个方面，并由此改变了世界。没有这项技术，我们的现代世界将会怎样？书写是人类历史上重大的分水岭。按照定义，启蒙时代和农耕时代是史前时代，历史始于5000年前的第三纪。


    不是所有人都认为文字是个好发明。柏拉图（Plato）在他的著作中描述了一位伟大的国王，他斥责创造文字的神：


    这项发明将使那些使用它的人健忘，因为这些人不再练习他们的记忆力……你发明的灵丹妙药是用来提醒的而不是用来记忆的，你教给你的学生的只是智慧的表象，而非真正的智慧。


    柏拉图是对的，文字确实会伤害我们的记忆力。就像我们用火来“外包”我们的消化能力一样，文字也“外包”了我们的记忆力。在文字发明之前，如果你想知道一些事情，最好用脑子记住它，因为除此之外无计可施。古代历史蕴含的线索暗示着一个诱人的猜想：人类曾经拥有强大的记忆力。与那个时代的人相比，如今的我记忆差到记不住ATM机的密码。但是我们的记忆力并没有随着文字的发明而立即退化，因为在很长时间里书籍仍然是不常见的。而现在大多数知识都来自谷歌搜索，我们的记忆可能会进一步衰退。


    就像我们探索过的其他关键技术一样，文字也带来或促进了一系列新技术的发展。第一个就是车轮，大约在5000年前与文字同时出现。车轮和文字就像花生酱和果酱一样，形影不离。它们扩展了商业，帮助了信息的流动，促进了旅行。文字意味着统治者可以制定法律法规，而车轮让这些法规得以广泛传播和实施。


    早期的法律法规非常稀少，以至于在不止一种文化中，统治者在掌权之前被要求熟记每一条法律。因为法律屈指可数，你没有理由不去记住它们，正是在这个时期出现了“背不出法律不是借口”这句格言，尽管现在我们仍然这么说，但在实际上恰恰相反：在一个有着数百万页法律的国家，背不出似乎是一个很好的借口。早期的法典，如有4000年历史的《乌尔纳姆法典》（The
    Code of Ur-Nammu），明确规定了对谋杀、抢劫、绑架、强奸、作伪证、侵犯他人身体以及与土地所有权有关的各种犯罪的具体处罚措施，如淹没邻居的田地、未能耕种租来的田地和偷偷耕种他人的田地等。比《乌尔纳姆法典》晚了两三个世纪的《汉谟拉比法典》（The
    Code of Hammurabi），包含282条法律，涵盖了以上的所有内容，同时还增加了合同执行、产品责任和继承的内容。


    货币也出现在第三纪。像我们今天这样的压印硬币直到很久以后才被发明，但在第三纪早期，世界各地出现了金、银、贝壳和盐等十几种其他形式的货币。普遍认为金属是理想的交易媒介，因为它们有价值，可分割，耐用便携。冶金学本身开始于第三纪之初，人类很快就认识到锡和铜的结合可以冶炼出优于两者的青铜。


    随着文字、车轮和金钱的同时出现，建立民族国家和帝国所需的基本要素已经就位。几乎在同一时期，我们看到了全世界范围内首批大型文明以独立各异的形态绽放。中国、印度河流域、美索不达米亚、埃及和中美洲全都成为了幅员辽阔、凝聚力强、繁荣昌盛的文明家园。没有人知道这些文明是如何在彼此没有联系的地方，几乎同时如约定好一般崭露头角的。文字也是一样，没有人知道，世界为什么在5万年前或者2万年前没有文字、车轮和农业呢？


    因此，就我们讲述的人类历史来说，我们有语言、想象力、劳动分工、城市和对未来的概念，我们还有了文字、法律规范、车轮、合同和金钱。在接下来的几千年中，所有这些都使我们能够相对快速地发展技术。


    直到近代，我们的世界一直处于第三纪。虽然过程中发生了令人难以置信的创新，例如蒸汽机的研制、电力的利用以及活字印刷的发明，但这些并没有引发人类本质的变化，不能与语言、农业和文字带来的改变相提并论。第三纪的标志性创新与其说是剧变式的，不如说是渐进式的。这并不是在贬低这些创新。印刷术深刻地改变了世界，但它只是以一种更廉价、更有效的方式来达成我们已经可以做到的事情——列奥纳多·达·芬奇（Leonardo
    da Vinci）看到现代的两翼飞机的详细示意图也能明白它的作用。要说我们已经迈入了一个新的时代，一定有一些事情发生了，并通过某种深远的和永久的途径，改变了我们，改变了我们生活方式，改变了我们作为一个物种的轨迹。


    接下来故事将把我们带到了第四个时代，它起源于第三纪的最后几个世纪。


    ## 04 第四纪：机器人和人工智能


    尽管我们已经习惯了技术的快速发展，但其实在人类历史99.9%以上的时间里，技术都是停滞不前的。阿舍利手斧（Acheulean hand ax）[16]——最古老的工具之一，在100万年的使用中保持不变。想象一下！100万年都不改变。虽然当今的技术在以更快的速度发展，可这仅仅是近几个世纪的事情。一些历史学家说，列奥纳多·达·芬奇是最后一个无所不知的人。当然这不是字面意义上的意思，但这确实表明了一点，即列奥纳多生活在一个科学如此稚嫩的时代，所以一个人可以掌握所有已知的实用知识。


    但是，当列奥纳多于1519年去世时，事情已经开始发生变化。到了16世纪中叶，尼古拉·哥白尼（Nikolaj Kopernik）在《天体运行论》（On the
    Revolutions of the Heavenly Spheres）一书中重新排列了宇宙。此后不久，一群窥见科学未来发展潜力的人中，有一位名叫让·博丹（Jean
    Bodin）[17]的法国思想家，他不信奉过去的黄金时代，更确切地讲，他相信印刷术的力量将推动世界向前发展，科学“本身蕴含着未来任何时代都无法耗尽的宝贵财富”。


    到1600年，事情真的开始变化了。1609年，约翰内斯·开普勒（Johannes Kepler）给伽利略·伽利雷（Galileo Galilei）写了一封信，信中谈到了宇宙飞船的未来：“应该制造适合天空的船只和风帆。飞船上还要有一些人，并确保他们不会在枯燥的广袤无垠的太空中退缩。”1620年，弗朗西斯·培根爵士（Francis
    Bacon）出版了一本名为《新工具》（The New Method）[18]的书，这本书被看作是现代科学方法的开端。培根强调通过细心观察和数据记录，对自然进行了第一手研究。从这些数据中，也只有从这些数据中，我们才能得出结论。


    虽然这并不是我们今天看待科学方法的确切方式，但培根的观点很重要，因为他提出了一种通过观察来系统化获取知识的方法。这是一个伟大的、改变世界的想法。在此之前，技术进步是断断续续的，因为没有系统的科学方法，无论是从车轮这个实际技术，还是由车轮代表的其他技术，都在被一遍遍地重复发明。而有了科学方法，其他人就可以在一个人收集的数据和结论上做进一步研究。这使我们的科学知识得到了复合增长，正是这些科学知识带领我们走向了今天。


    今天的科学方法是一套公认的技术，用来获取知识，之后再以一种其他人可以验证，并能够在其之上建立新知识的方式加以传播。客观的测量是必不可少的，因为它允许他人重现研究者的发现。科学方法需要廉价的印刷术才能普及，这可能就是为什么它在人类历史上没有得到更早发展的原因，也是为什么科学随着印刷成本的下降而发展得更快的原因。


    古人有许多非凡的技术突破，但由于他们缺乏发布和传播有关信息的技术和流程，这些突破很快就被遗忘了。一个例证就是安提基瑟拉计算机（Antikythera mechanism）[19]，这是一个有2000年历史的希腊机械装置，用来预测天体位置，计算日食发生的时间。我们之所以知道这个装置，是因为一次沉船事故中恰好使它保存下来使我们能够找到它，否则也无缘得见。而在我们所处的现代世界中，这样一个革命性的设备会被不厌其烦地写下来、拍下来，世界各地的大学都将互相赶超着努力对这种设备进行改进，企业家们将筹集资金以建造更便宜、更小、更快的安提基瑟拉计算机。


    这就是技术进步的方式：通过不同的人对所做工作的不断改进，艾萨克·牛顿（Isaac Newton）将这一过程描述为“站在巨人的肩膀上会看得更远”。牛顿，这个今人依然站在他肩上的巨人，于1687年发表了著作《自然哲学的数学原理》（Philosophiae
    Naturalis Principia Mathematica），描述了三大运动定律和万有引力定律。仅用几个公式，牛顿就证明了即便是行星本身也遵循简单的机械定律。


    把我们技术的飞速进步完全归功于科学方法，未免过于简单化了。这只是一幅复杂拼图的最后一块。正如我已经指出的，我们首先要有想象力、时间观念和文字。此外，我们还需要更多，在这个需求清单中，我们可能会添加一种低成本的方法来传播知识、普及文字、法治、非财政税收、个人自由，以及提倡冒险的文化。


    印刷机的发明及其广泛应用，提高了人们的读写能力和信息的自由流动。这是于17世纪拉开现代世界序幕的主要催化剂。同一时间，欧洲也发生了另一件事，或许也意想不到的推动了现代性的到来：新推出的咖啡取代啤酒，成为人们整天饮用的饮料。现在瓶装水成为了日常饮料，如果我们不经意间又回到了一个新的黑暗时代，至少我们能保持充足的水分，或者星巴克会拯救世界。


    科学方法极大地推动了技术发展，它揭示了各种技术与生俱来但又神秘莫测的特性：即在一定时期内其性能可以持续不断地翻倍。


    半个世纪前我们发现了这一神秘的技术特性，当时英特尔创始人之一戈登·摩尔（Gordon Moore）发现了一件有趣的事情：集成电路中的晶体管数量大约每两年就翻一番。他注意到这种现象已经持续了一段时间，他推测这种趋势可能还会持续10年。这一观测结果后来被称为摩尔定律（Moore''s
    law）。


    集成电路中晶体管的数量翻一倍，计算机的性能也随之提高一倍。如果这就是整个故事，那就没什么意思了。这时候雷·库兹韦尔（Ray Kurzweil）登场了，他语出惊人：在晶体管发明之前，计算机的功率就已经翻了一番。


    1890年，简单的机电设备[20]被用于美国人口普查。如果把自那以来的计算机处理能力做成图表，库兹韦尔发现，不管基础技术如何，计算机的处理能力每隔一年就会翻一番。想想看：计算机的基础技术从机械化，到使用继电器，再到真空管，再到晶体管，再到集成电路，一直以来，摩尔定律从未被打破。怎么会这样？


    好吧，简而言之，没人知道。如果你想出来了，告诉我，我们可以分享诺贝尔奖金。“装置的性能”这种抽象事物，怎么能遵循如此严格的定律呢？不仅没有人真正知道答案，甚至没有什么人去思考这个问题。但这似乎是宇宙的某种规律，它需要一定的技术才能到达一个地方，然后一旦你拥有它，你就能够使用这种技术使它再次翻倍。


    摩尔定律一直持续到今天，远超摩尔自己猜测的“该定律会坚持10年”的预期。虽然每隔几年你就会看到类似“这是摩尔定律的终结吗？”的新闻标题，正如几乎所有的标题都是问句的形式，所有的答案都是否定的。从量子计算机到单原子晶体管（single-atom
    transistors）再

    '
  merge: 1
- raw:
  - '[PAGE 32]


    到全新材料，目前有各种各样的候选人在努力攻关，承诺将使摩尔定律延续下去。


    真正有趣的是，不仅是计算机，几乎所有类型的技术，似乎都遵循自己的摩尔定律。某项技术的性能也许不会每两年翻一番，但它每N年就会翻一番。任何购买了笔记本电脑、数码相机或电脑显示器的人都亲身体验到了这一点。硬盘容纳得越来越多，像素不断增加，屏幕分辨率也在提高。


    甚至有人坚持认为多细胞生命也遵循摩尔定律，每3.76亿年复杂性就会翻倍。遗传学家理查德·戈登(Richard Gordon)和阿列克谢·沙罗夫(Alexei
    Sharov)提出了一个有趣的结论，那就是多细胞生命存在了大约100亿年，比地球本身还要早，这意味着——好吧，这暗示着各种各样的事情，比如人类的生命一定起源于银河系的其他地方，并通过这样或那样的方式来到这里。


    技术翻倍是一件大事，比人们最初预想的还要重要。众所周知，人类低估了持续翻倍的重要性，因为在我们的日常生活中，没有任何事情是这样的。你不会和2个孩子在一起，一觉醒来变成4个孩子，然后是8个孩子，然后是16个。就像我们的银行存款余额不会日复一日地从100美元到200美元再到400美元再到800美元。


    为了理解重复加倍的东西变化速度有多快，再想想国际象棋发明的故事吧。大约1000年前，在今印度地域的一位数学家把他的创造物带给了统治者，并向他展示了游戏规则。统治者非常感动，问数学家想要什么奖励。数学家回答说，他是一个谦虚的人，需求很少。他说在棋盘的第一个方格上放一粒米，然后在第二格放两粒米，第三格放四粒米，其后的每一格都比前面一格多放一倍的米，他只要第六十四格上放的大米。'
  - '[PAGE 33]


    你觉得这会有多少米？考虑到我对这个故事所做的铺垫，你知道这将是一个很大的数字。但是想象一下这么多米是什么样子。它能装满一个简仓吗？一个仓库吗？它实际上比整个人类历史上种植的水稻加起来还要多。顺便说一下，当统治者反应过来后，他把数学家处死了，所以这就是另一个要吸取的人生教训了。


    想象一下多米诺骨牌，你排起一排多米诺骨牌，推倒一张，它推倒下一张，依此类推。每张多米诺骨牌可以推倒比自己高50%的多米诺骨牌。所以，如果你设置32张多米诺骨牌，每张都比前一张大50%，最后一张多米诺骨牌可能会撞倒帝国大厦(the
    Empire State Building)。而这仅仅才是50%的增长率，还不是成倍增加。


    如果你认为我们在当下已经看到了一些非常惊人的技术进步，那么请系好安全带。我们现在就好像是在棋盘的第六十或六十一格上，翻倍是一件相当有难度的事。如果你想去做某件事而计算机没有相应的运算能力，只要等待两年，你就会拥有两倍的计算能力。当然，我们花了几千年的时间才制造出你桌上的这台计算机，但是再过两年，我们就会制造出比这台性能强大一倍的计算机。两年后，性能又会增加一倍。因此，虽然我们花了近5000年的时间才从算盘发展到iPad，但从现在起的25年后，我们将拥有远远领先于iPad的物件，就像iPad领先于算盘一样。我们终尽脑汁也想象不出那会是什么样子。


    科学方法和摩尔定律的神秘结合给我们带来了新技术的爆炸式增长，这些技术是我们日常生活的一部分。它给了我们机器人、纳米技术、基因编辑技术CRISPR-Cas9
    [21]、太空旅行、原子能以及其他上百个奇迹。事实上，技术进步的速度如此之快，以至于我们对这一切的奇迹都麻木了。新技术的出现速度如此之快，它们仿佛已经变得平淡无奇。我们口袋里装着超级计算机，可以让我们与地球上几乎任何人即时通信。这些设备无处不在，甚至连孩子都有，而且价格低廉，还'
  - '[PAGE 34]


    可以免费获得两年的合约。我们拥有了过去被认为上帝才有的力量，比如看到很远的地方发生的事件。我们可以用手指的最小运动来改变房间的温度。我们可以在离地六英里的高空以音速飞行，这种交通工具十分安全，从统计学上讲，一个人连续每天飞行，累计10万年才会发生事故。然而，当火鸡卷卖完了，我们不得不吃科布沙拉(Cobb
    salad)[22]时，不知怎的，我们还是会感到不方便。


    在古代，如果你想知道一个难题的答案，你必须去朝圣以得到一个神谕，比如德尔斐神谕(the Oracle at Delphi)[23]。在经历了漫长而艰辛的旅程之后，你终于可以向祭司提出你的问题，祭祀会在由药物引发的恍惚状态下回答你的问题。一些晦涩难懂的答案可以用十几种不同的方法来解释。现在来对比一下谷歌：你输入一个问题，在四分之一秒内，谷歌就按照顺序列出500亿个网页供你阅读。


    在第三纪最后几年出现的所有技术中，计算机的进步超过了所有技术。它们不仅仅是小玩意儿，还是具有哲学意义的装置。我为什么这么说？因为它们做了一件非常特别的事情——计算。我知道这似乎是显而易见的，但计算是宇宙的心跳，它是宇宙时钟的嘀嗒声。计算具有这般的基础性，有些人认为世间万物都是计算，包括你的大脑、宇宙、空间、时间、意识和生命本身。博学家斯蒂芬·沃尔夫勒姆(Stephen
    Wolfram)就是这么认为的，他在2002年的代表作《一种新科学》(A New Kind of Science)中用1200页的篇幅阐述了自己的观点。他论证了一个非常简单的规则：只要一两行代码，就可以产生巨大的复杂性。他进一步推测，生成整个宇宙所需的代码可能只有几行长。这是一个具有煽动性的假设，有许多信徒。


    不管怎样，宇宙的大部分显然是可计算的。飓风和脱氧核糖核酸是可计算的，雪花和沙丘也是如此。奇妙的是，物理世界中作为计算结果的事物都可以在一个邮票大小的计算设备中进行建模。试想一'
  - '[PAGE 35]


    下，把一个人送上月球需要对火箭、助推力和重力……以及现实世界的所有东西进行极其复杂的计算。然而，我们可以在一个微型处理器内用1和0来映射它。这表明了一个深刻的事实，即任何可以在计算机中建模的事情在现实世界中都是通过计算发生的。换句话说，阿波罗11号的发射是计算的，它不仅仅是涉及计算，它的发射是计算，它的整个任务都是计算。


    在极端案例中，情况变得有趣起来。人类是计算性的吗？我们的大脑是遵循阿波罗11号相同基本规则的巨型钟表装置吗？为了了解计算机的局限性(如果有的话)，我们需要回答这些问题。


    这就是为什么我说计算机是具有哲学意义的设备。锤子只能敲钉子，锯子只能锯木头，但计算机可以映照出现实世界中10亿个不同的东西。公正地说，我们还不理解计算机在形而上学的含义。我们知道它以微妙和显著的方式改变了世界，但更多的事情正在发生。正如著名教授和哲学家马歇尔·麦克卢汉(Marshall
    McLuhan)几十年前所说，计算机是“人类最非凡的技术，它是我们中枢神经系统的延伸。与计算机相比，车轮只算一个呼啦圈”。计算机日新月异，同时它又随处可见。人们只能想象到它在一个世纪后能做什么，甚至更短，10年后能做什么。


    这个设备是从哪里来的？我们是怎么决定做一个出来的，甚至怎么想到这样的事物是可能的？从计算机诞生到今天的历史很短，就本书的目的而言，只要提到巴贝奇、图灵、冯·诺伊曼和香农这四个名字就够了，把它们放在一起念，发音听起来就像一家高科技律师事务所。让我们分别看看他们四人的观点，当它们结合在一起时，将为你提供现代计算的基本要素。


    查尔斯·巴贝奇(Charles Babbage)的故事始于1821年的伦敦。当时，工业革命正在进行，科学和数学从大学和实验室转移到工厂。在'
  - '[PAGE 36]


    计算机出现之前，人们出版了大量的数学用表，方便那些从事复杂计算的人快捷运算。这些表册中容纳了对数、天文计算、工业和科学所必需的其他数据集。问题是其中的每一个数字都是手工计算的，因此包含许多错误。一个错误的数字可能会使一艘船偏离航线，损坏银行记录，或导致生产出故障机器。巴贝奇对这些错误感到沮丧，他说：“我倒希望这些计算是用蒸汽完成的。”


    这句话意义深远，而且对于那个年代来讲非常超前。从中可以捕获一种感觉，即机械的东西比有机的东西更稳定可靠。蒸汽驱动的机器以一种严格的标准被仔细打磨，这些机器孜孜不倦地工作，生产出始终如一的高质量产品。巴贝奇的天才之处就在于他意识到，如果蒸汽可以制造齿轮，那么它也可以计算对数。


    因此，他构思并试图建造一台完整的计算机。他理解这台机器的重大意义，并指出“只要有一台分析机(Analytical Engine)存在，它必然会引领未来的科学进程”。不幸的是，他耗尽了资金、努力却以失败告终，这也是一直以来新兴事业的普遍命运。然而，在2002年，伦敦科学博物馆造出了巴贝奇设计的重达10
    000磅的计算机，它运转完美。巴贝奇的故事讲完了，这个猜测蒸汽可以为计算机提供动力的人退场了。


    接下来上场的是艾伦·图灵(Alan Turing)。在我们的故事中，图灵的贡献出现在1936年，当时他第一次描述了我们现在称之为“图灵机(Turing machine)”的东西。图灵构思了一台可以处理复杂数学问题的假想机器。该机器由一条狭长的方格纸带组成，理论上它是无限长的。在纸带上，总是有一个活动单元格，在该单元格上方悬停着一个读写头。根据收到的指令或运行的程序，读写头可以在纸带上读写和移动。'
  - '[PAGE 37]


    图灵机的意义不在于“他指出了如何建立一台计算机”，而是“这个简单的假想设备可以解决大量的(几乎所有的)计算问题”。事实上，今天计算机可以做的任何事情，理论上都可以在图灵机上完成。图灵不仅构想了这台机器，而且把原理都弄明白了。想一想这台简单的机器，这个只用到几个部件的思想实验(thought
    experiment)：阿波罗11号登月和返回地球所需要做的一切都可以在图灵机上编程，你的智能手机能做的一切都可以在图灵机上编程，IBM沃森(IBM Watson)[24]能做的一切都可以在图灵机上编程。谁能猜到这样一个不起眼的小设备竟能做到这一切呢？图灵确实想到了，但似乎再没有其他人像图灵这样拥有独特的想法。图灵的故事到此结束。


    下面讲约翰·冯·诺依曼(John von Neumann)，我们称他为现代计算机之父。1945年，他为计算机开发了冯·诺依曼体系结构(von Neumann
    architecture)。如果说图灵机纯粹是理论上的，旨在界定计算机可以做什么的问题，那冯·诺依曼体系结构就解决了如何构建真实计算机的问题。他建议使用一个内部处理器和可以同时存储程序和数据的计算机内存。除此之外，可能还要有外部存储器来存储当前不需要的数据和信息，再加上输入和输出设备，一个冯·诺依曼装置就组建完成了。当你阅读的时候，你可以把你的所读依次映射到计算机的中央处理器、内存、硬盘驱动器、键盘和显示器，这样就走了一圈。


    最后来说说香农。在1949年，克劳德·香农(Claude Shannon)写了一篇题为《编程实现计算机下棋》(Programming a Computer
    for Playing Chess)的论文，其中描述了一种将国际象棋简化为可以在计算机上编程的一系列方法。虽然这听起来没什么大不了，不太可能让香农成为计算机史上的拉什莫尔山(Mount
    Rushmore)[25]的四大巨头之一，但从实际和现实的角度来看，香农让计算机可以在一个抽象的层面上操作信息，决定如何移动棋子。这让人们第一次认识到了计算机不仅仅是用来进行数学计算的机器。想想看，1949年以前，计算机只是那种物'
  - '[PAGE 38]


    理课上用到的，可编程的计算器；1949年以后，可以想象某一天，计算机会建议你购买哪些股票。尽管包括图灵在内的许多其他人在理论上都证明了计算机的能力，但是香农将其实现了。


    总结一下：巴贝奇认识到可以用机器做数学运算，图灵发现他们还可以运行程序，冯·诺依曼想出了如何构建计算机硬件，而香农展示了软件如何做乍一看不像数学问题的事情。


    这就是我们今天的处境。唯一真正改变的就是计算机变得更快、更便宜了。为了观察这种现象，让我们算下每秒进行10亿次浮点运算的成本是多少。在1961年，还不存在这样的计算机，但如果你把美国两年的GNP(国民生产总值)全都花在购买当时速度最快的计算机上，然后把它们连接在一起，其计算速度就会接近每秒10亿次浮点运算。


    到1984年，买一台1gigaflops(每秒进行10亿次浮点运算)的计算机——克雷“超级计算机”[26]，大概要付出相当于购买一架非常好的私人飞机的价钱。但相比花费两年的GNP，价格已经暴跌，算是很便宜了。到1997年，用买一辆优质德国跑车的钱就可以获得1gigaflops的计算能力。到2013年，超级计算机索尼PlayStation
    4问世，价格低至25美元/gigaflops。到了现在，10000倍gigaflops的计算机售价才几百美元，成本仅5美分/gigalops。


    计算机性能的价格将很快降到零点几美分/gigaflops，并还将继续快速下降。现在的超级电脑不再使用gigaflops作为度量单位。甚至也不使用teraflops(1000
    gigaflops)，而是使用petaflops(1 000 000 gigaflops)。截至2018年1月，全世界最快和第二快的计算机都位于中国。它们的运行速度接近100
    petaflops(100 000 000 gigaflops)。然而，预计到2018年晚些时候，美国、日本，无疑还有其他地方将制造出运算速度超过100 petaflops的计算机。此外，至少有五家公司承诺在2020年前推出'
  - '[PAGE 39]


    exaflop(1000 pealops)机器。没有任何迹象表明这场竞赛在近期有放缓的趋势。


    这一切是怎么发生的？价格怎么会跌成那样？在1960年，你可以花大约1美元(相当于今天的8美元多一点)买一个晶体管。所以，如果你需要12.5万个晶体管，就需要付出相当于今天的100万美元。但随着产量的飙升，价格大幅下跌。到2004年，晶体管的制造数量已经超过了全世界种植的稻米数量。仅仅六年后，在2010年，你可以用买一粒米的价钱买到1960年价值100万美元的125
    000个晶体管。


    技术更新是不停歇的，它变得更好，更便宜，永不止步。正是基于计算机未来潜在能力这一事实，许多计算机科学家提出了他们的主张，例如通用人工智能、机器意识。我们将在本书的其余部分讨论这些主题。


    电脑介入我们生活中到底有多深？没有人知道世界上有几十亿台计算机在运行。据信，计算机使用的电力约占世界全部电力的10%。它们是我们生活中如此重要的一部分，以至于没有它们我们大概真的无法生活，更不能维持我们目前的生活水平。我们的人口也许太过庞大，特别是在大城市，如果计算机被移除或丧失功能，没有计算机在后台管理从物流到水处理的所有事情，可能会导致人类消亡。正如史蒂夫·沃兹尼亚克(Steve
    Wozniak)[27]所说：“突然间，我们失去了很多控制。我们不能关掉互联网，我们不能关掉智能手机，我们不能关掉电脑。你过去常向一个聪明的人请教问题，现在你问谁？它以g-o开头，但它不是上帝，而是谷歌。”


    在20世纪60和70年代，我们建造了足够多的计算机，意义在于把它们连接起来组成一个巨大的网络，我们称之为互联网。1989年，蒂姆·伯纳斯·李(Tim Berners-Lee)创建了超文本传输协议(HTTP)，用于从'
  - '[PAGE 40]


    远程计算机上访问服务器上的文档。我们称之为万维网(WWW)。现在，我们不仅要把计算机连接到互联网上，还要把所有由数据驱动的设备都连接到互联网上。目前大约有300亿台设备联网，预计到2030年这个数字将上升到5000亿台。


    这个故事讲述了我们如何从第三纪最后衰落的几个世纪走向第四纪的门槛。每一个新时代都见证了技术外包，也见证了人类肉体生命或精神生命机能的增强。我们用火来帮助消化，用文字书写来增强记忆，用车轮来解放我们的背和腿。在我们的时代，我们已经创造了一种设备——机械大脑，它用途广泛，可以通过编程来解决我们要求它解决的几乎无限多的问题。我们现在正在开发人工智能，一种让设备独立运行的方法，通过机器人技术的力量，我们已经开始赋予它机动性，以及与物理世界互动的方式。我们将越来越多地、想必是尽可能多地使用计算机和机器人来外包我们的思想和行动。这是一个真正的变化，它标志着一个新时代——第四纪的到来。从这种转变中产生的问题是深刻的，因为它们关系到作为人类意味着什么。机器能思考吗？他们能有意识吗？所有的人类活动都能被机械地复制吗？我们只是机器吗？这本书的最终目的是探索这些想法——弄清楚我们究竟可以将多少人类活动，包括脑力和体力活动，委托给机器，以及这种变化的影响对世界的意义所在。


    第四纪已经开始了吗？好吧，当只有少数人学会了耕作，或少数与世隔绝的地方发展了文字，是否就标志了一个新时代的开始，或是旧时代终结的开始？其实我们从哪里分期无关紧要。我们现在谈论几十年前克劳德·香农解释计算机如何编程下棋时是否意味着新时代到来了，抑或是否在几年后，只有当计算机可以用自然语言与人类进行复杂的对话时才昭示了新纪元的出现？这种过于琐碎的分析也不具有特别的意义。我们假设转变开始的时间不早于1950年，完成的时间不迟'
