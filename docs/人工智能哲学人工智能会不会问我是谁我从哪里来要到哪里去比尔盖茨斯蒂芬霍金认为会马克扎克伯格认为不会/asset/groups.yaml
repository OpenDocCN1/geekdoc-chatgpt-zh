    如果意识是一种弱涌现性，机器能够实现吗？答案是肯定的。然而，我们连能够成功模拟线虫大脑的计算机都没有，更别提造出能够成功模拟人脑的计算机了。假设我们能造出一台机器，并通过弱涌现来获得意识，这可能只是一种货物崇拜。


