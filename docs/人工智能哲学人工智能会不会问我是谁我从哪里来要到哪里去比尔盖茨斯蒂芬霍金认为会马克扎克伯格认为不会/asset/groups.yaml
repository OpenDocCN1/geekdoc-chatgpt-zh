    给克赖斯特彻奇的出版社编辑写了一封信，题为《机器中的达尔文》(Darwin Among the Machines)。他似乎对这种可能性感到欣喜若狂：


    我们指的是这样一个问题：取代人类成为地球主宰者的会是什么样的生物呢？......看起来我们自己正在创造自己的接班人——随着时间的推移，我们会发现自己是一个劣等种族，力量薄弱，控制自我的道德品质较差。我们将把它们视为最优秀、最聪明的人所能达到的最高境界，没有邪恶的激情，没有嫉妒，没有贪婪，没有不纯洁的欲望，萦绕在这些荣光生物之间的宁静之力永远不会被打破。


    这让人不禁想和塞缪尔·巴特勒讨论下他信中所描述的情景是不是可能成真。我们可以从亚伯拉罕·林肯(Abraham Lincoln)的观点切入，即“没有恶习的人几乎没有美德”，一台既不贪婪也没有肮脏欲望的机器可能既不具备高贵的品质也没有同情心。


    1872年，巴特勒出版了一本名为《埃瑞璜》(Erewhon)的小说，在小说中他进一步发展了自己的思想。这部小说的结论是，如果一个人想避免机器取得优势地位，只有一个办法：把它们全部丢掉，连小工具也不放过。


    20世纪到来时，机器人完全成为科学的产物。“机器人”这个词本身源于斯拉夫语中“奴隶制”一词，它是捷克剧作家卡雷尔·恰佩克(Karel apek)在1920年为他的戏剧R.
    U.R.创造的，R.U.R是Rossum''s Universal Robots的缩写，译为“罗素姆万能机器人”，在剧中，发明了机器人的哈利·多明(Harry
    Domin)做出了一个预言，听起来与一个世纪后，我们这个时代的技术乐观主义者所做的预言完全相同：


    10年后，罗素姆万能机器人将生产非常多的玉米，非常多的布料，非常多的一切，以至于这些东西几乎都是免费的。不再有贫困。所有的工作都将由活机器来完成。每个人都将从忧虑中解脱出来，从劳动的退化中解放出来，每个人都只为完善自己而活着。


    剧中的机器人是依据生物力学制造的，它们被设计出来做任何人类不想做的苦差事。它们的灵魂没有被这项工作压垮，因为它们没有'
  - '[PAGE 67]


    灵魂，没有感觉，没有任何感情。最终人类不再工作，机器人承包了所有的事情，直到有一天，机器人决定接管地球并杀死所有的人类。


    在机器人的大多数现代化身中，它们要么是人类的帮手，要么是人类的陪衬。从《银翼杀手》(Blade Runner)的复制人到人人喜爱的礼仪机器人C-3PO[4]，机器人显然只能在虚构故事中大显身手，充当各种各样的角色。你可能还记得动画片《杰森一家》(The
    Jetsons)中的机器人女仆罗西(Rosie)，有一件有趣的事值得注意，这部动画片制作于1962年，背景设定却是在2062年，这意味着比起1962年，现在的我们更接近它设定的年代，但女仆机器人至今仍难觅芳踪。话虽如此，我们拥有的机器人在某些方面比罗西更神奇。世界上有成千上万的我们所依赖和享受的东西是无法自己制作的，比如你电脑里的CPU。如果没有机器人为我们提供诸如此类的帮助，那我们的工作就不会完成，因为这些工作实在是超出了人类的能力。


    长久以来，我们渴望建造机器人来做“3D”种类的工作，即又脏又危险又枯燥的(dirty， dangerous， dull)工作。还可以再加上另外四个 D ：不喜欢、有辱身份的、让人力竭的、可憎的
    (disliked， demeaning， draining， detestable首字母都为D)。我们想把所有这类工作都交给机器人，只有他们才不介意做这些。


    有些人甚至希望让机器人接管所有种类的工作。从这一视角展望未来，工厂自己运营，所有的生活需求都可以在不需要人力的情况下得到满足。在这个世界，技术创造了足够多的财富，以至于“为谋生而工作”的概念不再有意义，因为工作与生存之间的长久联系已经被打破了。


    此外，许多人希望我们能制造出机器人帮手，来协助我们的日常生活。由于预期寿命延长和出生率下降将导致人类护理人员短缺，丰'
  - '[PAGE 68]


    田公司正投资10亿美元建造可以帮助老年人的机器人。索尼公司则致力于研制能与人类情感交流的机器人。这些设备真的可以通过赋予人们自给自足的能力来提高人类尊严。另一些人则希望能将救灾机器人部署到世界上遭遇灾难的地区。


    我们对机器人的恐惧来自哪里？一般来自以下几个方面。最主要的担忧是机器人将在就业市场上与我们竞争，而我们会输给它们。到目前为止，机器人带给人类的福利是，让我们得以从烦琐的工作中脱身去做更加复杂和更有价值的工作。但是在福利的尽头会发生什么呢？当一个机器人所做的大部分工作都比人类做得更好时，会发生什么呢？


    制造业的基本特征加剧了这种恐惧，这个基本特征就是随着时间的推移，生产出的产品质量不断提高，价格往往会下降。所以机器人也会变得更好，更便宜，而且永无止境，日臻完善。我们无疑会担心，在某个时刻，机器人劳动力将比人类劳动力更廉价、更优秀。那些低技能人士会被永远挡在就业市场之外吗？如果只需一次性投入1万美元就能购买一个快餐机器人永久提高服务，快餐企业难道还会愿意雇用人类，并持续支付给他们15美元、10美元的最低时薪工资吗？答案是显而易见的，最低时薪定得再低，人类也竞争不过机器人了。如果在快餐行业发生这种大规模的机器人替代人力，那么就代表经济权力戏剧性地从劳动力转向了机器人拥有者。


    另一个普遍的担忧是《机器人总动员》(WALL-E future)所描述的未来可能成为现实。在那个世界里，当我们不再需要工作时，我们就会变得异常懒惰，混吃等死。最要命的是，我们的大脑也退化了，因为机器不仅能自我维持，还能维护其他一切。有些人担心我们会对机器人产生强烈的情感依恋，以至于它们会取代人类之间的纽带。当你的奶奶有一个细心的机器人助手时，你就不必再去看望她。机器人伴'
  - '[PAGE 69]


    侣甚至可能成为人类配偶最合适的替代品，机器人朋友可能比有机的生物更值得信赖。但这并不是普遍的恐惧，因为很多人希望这个未来会发生，并期盼我们能以上述方式与机器人互动。


    当然，人们的最惧怕的是机器人造反。尽管讲到这一点时，人们总觉得事出有因，也有几种流行的设想：机器人成为敌人，要么是因为人类的恶意改造或技术性错误，要么是因为意外的紧急行为。但事实上，世界各地的军队目前都在致力于制造性能更好的机器人杀手。


    # 08 技术挑战


    狭义AI和物理机器人的结合不仅仅是1+1=2。当它们结合在一起时，你就得到了一个看似很智能的代理，它可以自主工作。这也是“希望”和“恐惧”产生的地方。机器人专家开始制造越来越多的具有狭义人工智能的机器人，当人们第一次接触它们的时候，往往不能确定该如何看待它们。因为这项技术是新的，我们不了解它的局限性，也不了解它可能产生的影响。我们不知道这些设备最终能做什么。


    大多数对于这些技术的希望、恐惧和疑问都来源于不知道它们会使未来变成什么样。这是因为我们不知道它们的缺陷，尽管我们在AI和机器人技术方面都取得了巨大的进步，但是对于每天与这些技术互动的人来说，AI和机器人技术的缺陷都是显而易见的。让我们来探讨其中的一些。


    AI机器人面临的第一个问题是视觉成像。我们可以在机器人身上安装一个先进的摄像头，但那只能获取数据。机器人还必须把数据全部整理出来。当你看向厨房储藏柜时，你会看到一堆单独的物品。但机器人只能看到像素，好比一个由数百万种的光和颜色组成的万花筒。它不知道什么是盒子，什么是架子，甚至也没物体边缘的概念。'
  - '[PAGE 70]


    它只是看到一堆没有区别的点。作为人类，你是怎么识别物体的呢？你是怎么从这些像素数字里得出那是一罐“豆子猪肉”的？这着实很困难。当你目光落在储藏柜中时，你大脑里进行的处理过程是极其复杂的。要想描述你的大脑是如何完成这个小小的奇迹的行为，需要数页关于多边形、锥体和层的技术咒语。你能够在瞬间识别出一栋房子的建筑风格，识别出一只飞翔的鸽子，分辨出你所认识的双胞胎，或者其他任何你毫不费力就能完成的上百项类似任务，这些能力都令世界各地的AI程序员艳羡不已。我认识一些程序员，如果他们认为可以通过解剖你的大脑找到问题的答案，我想他们会那么做的，那我建议你们不要接受他们调制的鸡尾酒。


    假设你解决了视觉成像的问题，机器人能够识别储藏柜里的每一件物品。顺便说一下，它们到现在也不能识别，但是让我们想象它们可以。机器人仍然无法理解它们“看到”的任何东西，那是因为AI不能将看到的事物情景化。如果你开车穿过城镇，看见路上有一只小狗，一个蹒跚学步的孩子正走向小狗，在他身后一个成年女人疯狂地朝孩子跑去想要阻止他，你很容易就把这些场景拼凑起来。但是对计算机来说，这就真的只是一堆改变了颜色的像素，或者说，只是一堆1和0。想想看，对于人类来说，弄清楚一张给定的照片里发生了什么是多么轻而易举：那张是一场康加舞(conga
    lines)[5]，那张是一个为了惊喜派对而藏起来的人，那张是一个家长拍的毕业舞会照片，那张是钢琴独奏会，还有那张是学校演出，这张是洗礼仪式，等等。我们能轻易分辨每一张场景是因为我们有解读它的文化背景。现在，理论上来说，你可以训练一台计算机做同样的事情。向计算机展示足够多的康加舞，它会变得非常擅长识别康加舞，事实上会比人类做得更好。如果生活中除了需要识别的静止照片之外再无他物，那事情就很简单了。但是生活是动态的，“情境”是从一系列静止图像的差异中衍生而来，有无数种可能的组合方式。对于这类信息，几乎没有可用的训练'
  - '[PAGE 71]


    集。当你看到年轻的邻居夫妇，匆忙走向汽车，妻子捂着肚子，丈夫拿着一个旅行袋，一脸的担忧，你很容易就能搞清楚发生了什么。但这对计算机来说很难。或者更进一步，你没看见邻居夫妇匆匆离去，现在已经是两天后了，你注意到他们院子里有两份报纸，他们的车也不见了，你马上就心中有数了。你甚至不需要深思熟虑，只是随意地对你的配偶说：“亲爱的，我想邻居要生孩子了。”如果你的另一家邻居有个儿子，快满16岁了，莫名其妙地，他开始挨家挨户地要求帮忙修剪院子，你可能会推断他想买车。而训练计算机进行以上的推断是相当困难的。


    但是，假设你训练一个AI，让它能够从康加舞、怀孕的妻子和16岁的男孩那里获得情境线索。当然我们现在还做不到这个，但是让我们想象我们可以。那么，我们的境况也不会好多少，因为AI只能做这些事情。我们不知道如何教它做迁移学习(transfer
    learning)。什么是迁移学习？如果我给你看一件物品，比方说是一个大约一英尺高的猎鹰小雕像，然后我要你从给定的十多张照片里找出猎鹰，你可以轻松办到，即使猎鹰被一棵树挡住了一半，或在水下，或倒挂着，或侧卧着，或在头上涂了花生酱。我敢打赌，虽然你从来没有见过一只头上涂了花生酱的猎鹰雕像，但你仍然能认出那是只猎鹰。这是因为人类可以用一生的时间来观察被其他物体遮挡的东西，水下的物体，或者被花生酱之类的物质覆盖的物体，积累经验，获取知识，然后把这些知识应用到新的任务中。这就是迁移学习，我们不知道人类是怎么做到的，更不用说教计算机如何去做了。


    假设我们解决了这个问题。当然我们没有解决，可能也不会很快解决。但是让我们想象一下，人工智能可以把它在一个领域学到的东西应用到其他领域，我们仍然没有走得很远，因为人工智能不知道如何随机应变。而每个人类，无论其技能水平如何，都能以一种远远超出任何机器的方式随机应变。如果你弄坏了门把手，尽管在你以往的'
  - '[PAGE 72]


    经验中门把手是用来拧的，从来没有折断过，但现在它断了，你不会怔怔愣在原地不知所措，你会试着想办法把门打开。如果你把自己锁在房子外面，你会想办法进去。如果一阵风把你的伞吹走了，你就会去把它追回来，而从来没有人教过你这些，你可以无师自通。因此，即使计算机可以有视觉、并能够理解它所看到的，从中获得情境背景，并可以将其用于其他领域，它仍然没有创造力。我们人类不仅仅像上文假设的AI一样被动地感知世界，我们对世界的反应形式也超越了迁移学习的水平。


    除此之外，还有另外四种感官要考虑。以听觉为例，我们正处于一个伟大的现代社会，当我打电话给我的航空公司，向它的自动系统口述我的会员号，它大约有一半的概率会识别错误。事实证明，识别语音是一个相当困难的事情，尽管在大多数语言中，一个人报会员号可能只说几十个字母或数字。但当你考虑到地方口音和不同声音的音调差异时，从电脑的角度来看，你的“H”发音和我的“8”(eight)发音非常接近。如果线路再受到静电干扰，或者楼下有人在用吸尘器，又或者只是感冒了，问题就会变得更糟。同样，数据不是问题，但处理数据却是问题。屏蔽真空吸尘器的声音是非常具有挑战性，人类却能忽略特定的声音，但是我们不知道这是如何做到的，我们当然也不知道如何让AI做到这一点。


    然而，尽管有这些限制，我们早期的AI已经以很多种方式造福了我们的生活。AI为你导航，过滤垃圾邮件，预测天气，推荐产品，识别信用卡欺诈。智能相机用AI来识别人脸，运动队用AI来改进策略，人力资源部门用AI来筛选求职者。AI也可以读取手写文字，将语音转换成文本，并将它们翻译成其他语言。所有这些任务都是纯粹的计算活动。任何拥有大量数据的地方，即使是无序的原始数据，都是AI的用武之地。例如，AI将快速分析我们所有的卫星数据，并帮助我们发掘古城，追踪野生动物的数量，监测植被生长。然后，它将利用所有'
  - '[PAGE 73]


    的交通数据，帮助我们建设更智能的道路，改进交通灯计时使其更有效率，并减少事故。这样的例子不胜枚举。《连线》（Wired）杂志的创始主编凯文·凯利(Kevin
    Kelly)在推特上总结了这一切：“未来10 000家初创企业的商业计划很容易预测：即X+AI。”


    那么为什么AI可以为我们做所有这些事情，但同时又有我们刚才描述的所有限制呢？因为我们擅长每次教AI做一件事。如果你想让人工智能下棋或识别邮件垃圾，那么你就事论事简单教给它就行了。你不会要求它去概括、适应情境、有创造性，或能做任何其他的事情。只要教它那一件事，它会在这方面做得很好。这就是为什么它被称为狭义人工智能。


    在第二节中，我们讨论了劳动分工的优点，它是经济学理论中不多的“免费午餐”之一，它使文明和繁荣成为可能，但它也不全是优点。劳动分工告诉我们，当人们被训练成一项专业任务的专家，这会有助于增进社会整体繁荣。这不仅适用于制造业，在其他任何领域也是如此。假设你是一名多面手律师，收入还不错，但是如何提高自己业务收费水平呢？你可能会专攻《著作权法》，除此之外，你还可以进一步专门化。然而这样做，你就埋下了自毁前程的隐患。具有讽刺意味的是，你越专业，你就越容易被机器取代。你越是精通某一个细分领域的知识，这些知识就越容易被计算机编码成一系列的规范步骤。比起X射线技术人员，狩猎采集者的计算机替代品更难制造，就是因为技术人员只做一件狭义的事情。


    众所周知，肯·詹宁斯在《危险边缘》（Jeopardy!)[6]上被IBM计算机沃森打败了。肯·詹宁斯说，IBM的工作人员绘制了一幅线形图，以记录沃森在追赶“肯·詹宁斯”的过程中所取得的进展，每个星期，沃森都在缓慢赶上来。随后詹宁斯在他的TED演讲中讲述了这一切给他的感觉：'
  - '[PAGE 74]


    我看到了这条线。我意识到，这就是未来来临时的样子。它不是终结者的枪瞄准镜，它只是一根细细小小的线，离你最擅长，也是唯一让你与众不同的事情越来越近。


    参加《危险边缘》是一件狭义的事情，好吧，实际上是一些狭义的事情。这就是为什么今天的AI可以掌握它。


    到目前为止，我们一直在探索AI机器人面临的认知挑战，现在让我们来看看同样艰巨的物理挑战。对于AI机器人来说，物质世界是一个充满难题的地方，但假设它在一个受控的环境(比如工厂)中执行纯粹的重复动作，机器人就可以做得非常好。没有一个人能把10亿个晶体管焊接到邮票大小的计算机芯片上，但机器人可以。如果没有机器人来制造我们每天使用的东西，我们就会以20世纪50年代的技术来推动20世纪50年代的经济发展，充其量也只能以20世纪50年代的生活水平生活。所以，如果你享受现代世界的繁荣和便利，请感谢你将遇到的每一个机器人。然而，就算拼尽我们所有的技术，我们依旧不知道如何制造出一个类似三岁孩童水平的机器人，更不用说造一个比成年人更好的机器人了。尽管最近取得了一些进展，但脱离了工厂环境的机器人仍然是罕见的，它们面临着一系列挑战，包括运动、感知和对环境的操控。正如机器人学家埃里科·圭佐(Erico
    Guizzo)总结的那样：


    几十年来，许多人一直在研究类人机器人，但驱动机器人腿和手臂所需的电动机太大、太重、速度太慢。今天最先进的类人机器人仍然是笨重的大块金属，让它们在人类周边活动是不安全的。


    机器人面临的第一个挑战是弄清楚自己所处的地理位置。这既是感官方面的挑战，又是AI方面的挑战。机器人专家还没有真正制订出如何做到这一点的最佳实践方案，因为这一任务千变万化。机器人的任务是绘制出它所在位置的地图，然后跟踪它在地图上的位置。这听起来并不难，因为人类能毫不费力地做到。但请从机器人的角度来想象这个问题，一个机器人被丢进房间，它“看到”一把椅子和一个脚凳，由于椅子和脚凳是可以移动的，机器人不能把它们当成参照物。'
