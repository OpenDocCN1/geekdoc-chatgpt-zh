    ## 第三章 通用人工智能


    “通用人工智能”将是一位人造爱因斯坦，这要么是可能实现，要么是不可能的。这两种观点之间的差别判若鸿沟，而它与我们对现实本质、自我身份的认同感和人类实质的核心信念有关。要是相信一元论，那么只要模拟大脑就能拥有会思考的机器人，要是相信二元论，那么机器将永远只是机器。


    ## 魔法师学徒的故事


    1940年，华特·迪士尼(Walt Disney)发行了动画电影《幻想曲》(Fantasia)，这是一部以古典音乐为背景的故事片，由八个不同的故事组成。其中最著名的故事段落是《魔法师的学徒》(The
    Sorcerer''s Apprentice)，改编自18世纪歌德(Goethe)创作的一首诗。


    故事一开始，米老鼠是魔法师的学徒，他做着从公共水井中汲水的繁重工作。当米老鼠返回屋中时，恰好看到他的魔法师正戴着魔法帽施展各种魔法。之后，魔法师显然有些累了，他放下帽子，上床睡觉。


    米奇做了一件自以为很聪明的事：他偷偷戴上帽子，赋予躺在角落里的扫帚生命，并让它长出手臂，然后训练它用水桶打水。扫帚很快就掌握了自己的工作内容，米奇也可以趁机小睡一会儿，享受一次来之不易的休息时光。


    但当他醒来时，他看到他的创造物还在不停歇地工作，这换作任何一个理性的人(或老鼠)都不会那么做，他们肯定早就停下了。因为扫帚的勤劳，城堡的整个地下室都被两三英尺深的水淹没了。然而，扫帚向前犁着，一桶一桶地把水送进来，丝毫没有停止的意思。毕竟，这就是它被设定要做的事情。


    米奇试图阻止它，但扫帚被赋予了使命和目标，根本不听其他使唤。米奇不得不采取激烈的措施，他抓起一把斧头，把扫帚砍成小块。他擦了擦额头，松了一口气，屏幕内外的人都以为这是一个满意的结局。灾难被避免了。


    然而并没有!砸碎扫帚产生了意想不到的灾难性后果。每个扫帚碎块都重新组合成一把新扫帚，由此组成了一支扫帚大军，它们有一个共同的目标：把更多的水运进来。除非海洋被排干，否则它们肯定不会停止。


    米奇无法叫停他的创造物。幸运的是，扭转乾坤的人适时出现，魔法师被屋外的骚动惊醒，及时下楼阻止了整场灾难，并从米奇这个悔过的学徒手中取回了他的帽子。


    ## 13 人类大脑


    我们已经彻底探索了狭义AI的世界。无人驾驶汽车、记忆你偏爱温度的自动调温器以及电邮文件夹中的垃圾邮件过滤器都是由狭义AI驱动的。是的，这些都是技术上的奇迹，但请不要试图咨询它们中的任何一个，你应该给你的配偶送什么圣诞礼物。另一方面，通用人工智能(AGI)是一种至少和你我一样聪明的智能。你可以要求它做任何事情，包括它从未被编程设定过的任务，它会想出如何执行这样的任务，然后尝试去做。问它6乘以7等于多少，你会得到答案。问它你是否应该娶你的女朋友，你同样会得到答案。

