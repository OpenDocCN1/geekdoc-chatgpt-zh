    以2500年前的古希腊为例。那是一个多么进步的时代啊：文明繁荣，民主诞生，哲学发展，法治得到贯彻实施。厄拉多塞(Eratosthenes)计算了地球的周长。希波克拉底(Hippocrates)使医学成为一门科学。西奥弗拉斯特斯(Theophrastus)给植物分类并命名。欧帕利努斯(Eupalinus)建造了一座宏伟的水渠，阿基米德(Archimedes)制造了他著名的螺旋扬水器(screw
