    这样的例子不胜枚举。这里涉及的问题有抗生素耐药性、气候变化、人口过剩。或者大规模太阳耀斑摧毁了地球上一半的电子设备和所有的卫星，接着又出现了人口过剩、水资源短缺、流氓核国家和疯狂的世界领导人。此外，还有功能失调的政府、歪曲的新闻、人为导制的假事实和大量的排斥异己行为。网上世界似乎陷入了永久性的尖酸刻薄中，因为人们把自己关在相互隔绝的气泡里，远离那些“合理反对自己最珍视价值观”的人，继而导致身份政治(Identity
