    更多的机会来运用我刚才描述的六个属性。当今互联网的现实，以及它对我们的启示，绝不意味着我们想要远离这个世界；相反，它清楚地表明我们想参与其中。


    ## 全新的你


    第四纪的许多技术都和卫生健康有关。这是意料之中的，因为全球每年在医疗保健上的支出超过7万亿美元，因此有大量的商业机会。但在医学领域取得如此多进展的一个更大的原因是，我们的身体表现得就跟技术很像。因为人类的心脏有瓣膜和心室，我们可以用同样的基本方法打造人造心脏，发挥与人类心脏同样的作用。当我们身体的某些方面出现问题时，我们求助于技术来修复我们有缺陷或磨损的部分。


    我们用技术来修复我们的身体，但是能否用技术来强健身体呢？如果让你选择，你会升级你的身体，让其变得更好、更强、更快吗？你愿意把你的腿换成史蒂夫·奥斯汀(Steve
    Austin)[9]式的，每小时能跑60英里仿生腿吗？你会做一个医学上的侵入性手术来增强你的肌肉吗？


    其中的一些问题比另一些更容易回答。那么人造器官呢？当然，我们已经用“心”在做了。没有人认为起搏器或人造心脏会让你变得不那么像人类。在未来，我们被告知，微型机器将在我们的血液中游动，治愈我们的疾病，让我们保持年轻和健康，那有谁会厌恶这种肉眼都看不见的东西呢？毕竟我们已经让医生给我们注射了很多不明所以的药物。


    如果我们能造出一只更好的耳朵呢？人们会想要这样的东西吗？人们会用完全健康的耳朵去换一个新的版本吗？当然！这是一个没有明确界限的“滑坡理论”(slippery
    slope)[10]，所以将会发生什么是可以预测的。回顾过去：用眼镜矫正视力，眼镜被称为天赐之物。本·富兰克林(Ben Franklin)发明了双焦眼镜(bifocals)[11]，没有人抱怨眼镜的进步。


    然后是隐形眼镜，它实际上装在眼睛里，但没有人介意[12]，请原谅我使用了双关语。之后LASIK(准分子激光原位角膜磨镶术)出现了，我们切割人们的眼球并重塑它们。技术永不止步。视觉是一件如此奇妙的事情，把这项技术送给视力有问题的人，几乎立刻就能压倒任何关于无人性的、模糊的、不恰当的争论。如果我们制造一只让盲人看到东西的仿生眼，一些视力不好的人会选择替换。一些只有轻微散光的人也会选择替换。然后每个人都会选择替换上仿生眼。谁不想看到一英里以外呢？此外，你还可以选择新眼睛的颜色，无论是蓝色、棕色还是渐变色。


    没有人知道这一切能走多远，但在某一时刻，我们可能会开始思考人类的终点和机器的起点在哪里。旧的问题将呈现出新的维度：作为一个人意味着什么？生与死是什么？“你”是你的身体吗？“你”是你的大脑吗？“你”是你的心灵吗？


    况且为什么非要等到你出生后才开始改进呢？为什么不设计出更好的人类呢？好几家公司都在开发一种技术，让父母能够挑选出他们最聪明的胚胎。理由很诱人：“为什么不做100个，从中选出最好的？”牛津大学教授朱利安·萨乌莱斯库(Julian
    Savulescu)表示，这种操作是“优秀的育儿方式”，他将其称为“理性设计”，他接着说：“事实上，当谈到筛选人格缺陷时，比如潜在的酗酒、精神变态和暴力倾向，你可以说人们在道德上有义务选择伦理性更好的孩子。”


    这一切同样是一个滑坡。那些拥有某些已知有害基因的父母已经使用胚胎选择来阻止这些基因传递给他们的孩子。正如人们所预料的，遗传学将引发另一个与财富有关的问题。当富人改良他们孩子的基因，使之变得高大、漂亮、聪明、抗病时，会发生什么呢？他们可以说是男超人和女超人的新种族。或者至少，他们可能是这么认为的。


    ## 24 死亡，你的毒钩在哪里


    《吉尔伽美什史诗》(The epic of Gilgamesh)是流传下来的最古老的书面故事。它最早的文字碎片可以追溯到大约4000年前，但在那之前，这个故事一定以口头形式存在了很久。在故事中，吉尔伽美什是一位国王，有一天他和他的朋友恩奇都(Enkidu)与天之公牛战斗。恩奇都死了，吉尔伽美什第一次尝到了死亡的苦涩。他发誓要获得永生，于是找到了他的祖先乌特纳比西丁(Utnapishtim)，问他如何才能长生不老。乌特纳比西丁告诉他这是不可能的，只有乌特纳比西丁和他的妻子被神赐予永生，但是，有一种生长在海底的植物可以让吉尔伽美什重返青春。他找到了它，但是在吃之前，一条蛇吃掉了它。最终，吉尔伽美什意识到他的追求是徒劳的，他认为唯一真正不朽的是在此生有限的时间里所取得的成就，也许，只是也许，如果你足够伟大，你将被永远铭记。


    我讲述这个故事有两个原因。首先，我认为它揭示了人类最古老的故事是关于逃避死亡所做的徒劳尝试和失败。其次，几千年后的今天，这个故事是怎样与我们产生共鸣：2015年末，在伊拉克又发现了《吉尔伽美什史诗》新的20行，这个故事登上了世界各地的头版头条。


    在第四纪，我们有可能在吉尔伽美什失败的地方获得成功吗？我们已经探索过把人类的意识上传到机器上，以此作为永生的途径，但是又有什么办法延长我们身体的存在时间呢？在第22小节中，我提出了一个观点，即所有纯粹的技术问题都将得到解决。死亡只是一个技术问题吗？我想是的。越来越多的医生主张把衰老归为一种疾病。虽然似乎只是语义上的变化，但实际是视角的改变，这有助于消除衰老和死亡相关的宿命论，新的视角要求我们寻求治愈方法，以此重构该问题。使你变老的原因是有限的，而且每一个看起来都像技术问题。那么你为什么不修复和替换身体的部件和系统，而要任由它们随着时间流逝而腐烂呢？


    我们为什么会衰老和死亡？科学家们推测，造成这种现象的原因不超过6个，但却广泛存在。你的DNA会突变，引发癌症。或者你的线粒体发生变异，导致你的身体崩溃。另一个原因是，经年累月某些“垃圾”会在你的身体里堆积。你的身体就像俄罗斯方块游戏：你所有的成就都消失了，相应的所有的错误被堆积起来。阿尔茨海默病(Alzheimer)患者大脑中的斑块就是这样一个例子。


    另一个问题与细胞分裂有关。有时细胞分裂过多，有时则停止分裂，这就导致了类似帕金森症的症状。你变老的另一个原因是你的端粒(telomere)消失了。端粒是DNA末端重复的部分，可以保护DNA不退化。每次你体内的DNA被复制时，RNA都不会完全复制到最后，所以每次DNA的副本都要短一点。一开始没什么大不了的，你的身体聪明地把一堆无用的东西粘在每条DNA的末端，这些就是端粒。但是，如果你的细胞分裂太多次，端粒就会完全被耗尽。然后越来越短的DNA副本开始丢失一些重要的东西，你的身体就垮了。


    幸运的是，有一个解决办法。一种叫作端粒酶(telomerase)的酶，当它被激活时，会向端粒中添加更多的物质。对于人类来说，当细胞在人体外分裂了很多次时它被激活。遗憾的是，它在各种癌症中也被激活，使癌细胞保持“永生”，这是攻克癌症必须面临的挑战之一。龙虾的端粒酶不断被激活，所以龙虾不会自然衰老。如果你观察一只50岁龙虾和一只5岁龙虾的器官，你很难把它们区分开来。


    假设你没有变老，那会是什么样子？你不会永生的。根据精算估计，你可能活到6500岁左右。这就是一些奇怪的事故降临在你身上所需的时间，比如一架大钢琴从窗户掉下来砸在你身上。在这样一个世界里，死亡将会是一场更大的悲剧，因为意外死亡不是让你少活40年，而是4000年。


    我们什么时候才能看到衰老的终结？好吧，我们不必一蹴而就。如果预期寿命开始以每年超过1岁的速度递增，我们就成功了。有人认为这将在25年内实现。AGI可能会在25分钟内解决这个问题——或者它能做到却故意不告诉我们，因为它推断出需要对我们守口如瓶。


    你想长生不老吗？有一个古老的禅宗祝福：“愿你父亲死去，愿你死去，愿你儿子死去。”这是神的恩宠，因为改变这样的秩序是一件可怕的事情。作为四个孩子的父亲，如果我比我的孩子活得长，我会感到很难过。但除此之外，我乐意“不死”。我四十多岁了，已经能感觉到身后死神冰冷的气息，我强烈地意识到，今天的寿险精算表会笃定我的生命已经超过半程了。然而，我还有十几辈子的事情想做。但担忧的不是不能永生，而是要自己选择死亡的时刻和方式，以自己的意愿面对死亡。做自己生命的主宰，直到能说出尤利乌斯·凯撒(Julius
    Caesar)说过的话——“我活得年岁已高，成就也足矣。”那将是一件伟大的事情。


    此外，也有人认为，我们的死亡迫使我们分清轻重缓急，做出选择，因为我们的寿命有限。在一个“后老化”的世界里，拖延症达到一种全新的等级：“嗯，几个世纪后我就可以做到了。”这可能是一种常见的情绪


    另一些人则认为，老年人应该死去，因为这将为新思想和进步扫清了道路。想象一下，如果17世纪甚至19世纪的人还在，他们还可能发号施令吗？这是否阻碍了进步，阻碍了迈向更文明社会的步伐？归根到底，死亡也许是生命永葆青春的方式，大概世界会像我们蜕死皮一样蜕去旧皮。地球上出现生命距今已经上亿万年了，但生命永葆年轻，不停更新。大多数生命形式只有几天、几个月或几年的寿命，这使得青春活力成为这个星球的时代精神之一。


    逃脱死亡的整个问题可能并没有讨论的意义。我们貌似犯了和吉尔伽美什一样的基本错误，每次我们以为找到了能让我们长生不老的植物，就会被蛇叼走。有很多很好的理由来解释为什么根本不可能延长寿命。随着医学的集体进步，我们降低了婴儿死亡率，治愈了许多疾病，帮助人们活得更久，但我们并没有真正提高最大预期寿命。现在，大约有40万人活过了100岁，其中，仅仅400人将迎来110岁生日，就是这样。迄今为止，只有大概40人到达115岁，只有1个人被证实度过了120岁的生日。尽管百岁老人的比例继续上升，但达到125岁的人数仍然为零，它永不会发生。


    解决我在本节中概述的老化问题可能会揭示出新的问题。我们有2万个基因，每一个的功能都可能有极限。尽管我们在计算机方面取得了许多进步，但仍然需要不时地重启计算机。复杂的系统可能并不完美。


    克雷格·文特尔(Craig Venter)是一位生物化学家，也是负责第一次基因组测序的人，他认为我们无法战胜衰老：


    > 我想我们永远也到不了那里。我对生物现实有了更多的了解。我的观点是，如果你想长生不老，那就在有生之年做些有用的事情。


    这正是吉尔伽美什的结论。


    ## 25 可能出现什么差错吗


    拥有一个没有疾病、贫穷、饥饿和战争的世界是人类亘古不变的梦想，也是我们即将实现的梦想。之所以会这样想的理由简单明了：人类劳动力因技术而倍增，这使繁荣得以不间断地增长。无论财富分配多么不平等，我们都将进入一个更富足的世界，甚至那些最贫穷的人也将丰衣足食。利用技术，我们也将解决所有的技术问题，摆脱疾病，提供充足的清洁能源，并解决我们共同面临的一系列问题。然而，人们因被来自世界各地的新闻所淹没，往往对未来心怀忐忑。当人们被一遍又一遍地追问他们被谋杀或房子被闯入的可能性时，他们总会高估这些事件实际发生的概率。许多人将这种误解归咎于媒体，毕竟“五点新闻”总是在放广告的前一秒播报，“稍后回来，我们会找出来水里有什么正在杀死你”，但也不能说都是媒体的错。还有另外一个原因，我们不擅长评估某些类型的风险：你被纽约人咬伤的可能性是被鲨鱼咬伤的10倍；在北美，你被香槟软木塞杀死的可能性远远大于被蛇杀死的可能性；而在美国，被运转失灵的自动贩卖机杀死的人比被熊杀死的人还要多。但你永远猜不到这些。我们本能地知道要远离响尾蛇，而不是自动售货机；尽管几十年来民用航空都很安全，但我们凭直觉错误地认为开车比坐飞机更安全。


    人类偏好过分谨慎。对我们的祖先来说，神经过敏也是一种长处。把一块石头误认为是一只熊，然后逃走，总比把一只熊误认为是一块石头而留在原地要好得多。对恐惧的认知偏见并不总是坏事。


    那么未来我们需要担心什么呢？最明显的挑战是生物学。没有什么能阻止人们将“病原体”生物工程化。CRISPR基因编辑是如此简单和廉价，小学生可以用100美元的工具包修改酵母基因。现有的病原体已经够糟糕的了，但对其基因进行修修剪剪，可能会导致更可怕的情况。这种技术也可以用于制造种族武器，比如一种对具有特定种族血统的人影响病原体。此外，如果将其用在改变人类上，即使是意图是善意的，也将带来我们在本书中探索过的文化挑战，还会给我们带来生存的生物风险。最后，我们应该考虑生物学方面更抽象的挑战：我们之所以能够发展人权的概念，只是因为构成人的物质基础是明确的。但是，如果在医疗设施中培育克隆人来获取器官又怎么样呢？


    电影《千钧一发》(Gattaca)描绘了一个存在完美基因和缺陷基因的未来，在那里发明了一种新的制度——基因制度，在这种制度下，基因改造的人不仅在能力上，而且在道德价值上都被认为是优越的。如果你可以花钱去看医生，升级你的基因组，那会怎么样？


    这样的例子不胜枚举。这里涉及的问题有抗生素耐药性、气候变化、人口过剩。或者大规模太阳耀斑摧毁了地球上一半的电子设备和所有的卫星，接着又出现了人口过剩、水资源短缺、流氓核国家和疯狂的世界领导人。此外，还有功能失调的政府、歪曲的新闻、人为制造的假事实和大量的排斥异己行为。网上世界似乎陷入了永久性的尖酸刻薄中，因为人们把自己关在相互隔绝的气泡里，远离那些“合理反对自己最珍视价值观”的人，继而导致身份政治(Identity
    politics)[13]占据主导地位。但是这并不是全部，还有更多：恐怖主义、收入不平等、难民危机和宗教极端主义。今天的世界有时似乎在混乱中焦虑万分，没有方向。当像这样把所有的威胁都列出来的时候，即使是乐观主义者也会有一点心神不宁。但是，回过头来看，你会发现，与人类从野蛮走向文明的道路上所克服的困难相比，上述这些困难微不足道。曾经有一段时间，整个人类种群可能只剩下1000名育龄人口，甚至人认为只剩几百名，我们是濒临灭绝的物种，危在旦夕。想象一下我们曾经的处境有多么脆弱，就会发现我们已经克服了比现在更严重的威胁，而且这里没有熊——只有另一块需要爬过去的岩石。


    ## 26 第五纪


    宇宙浩瀚无边。这对你来说可能不是什么新闻，但是想想以下场景：把一粒沙子放在你的指尖上，然后向夜空伸出你的手臂，试着找出那粒沙子。如果你看到了它了，那你就会知道3万个星系的观察视野有多大，就它挡住的那么大。


    1977年，美国国家航空航天局(NASA)发射了一艘名为“旅行者1号”的航天器，将其送入广袤无垠的太空。它除搭载一系列的科学设备外，还携带了一个盒子，里面装有一个记录人类信息的镀金磁盘，这么做的目的是希望磁盘能被银河系中的其他生物发现并破译。这里的传达的信息代表友谊而非恐惧，它是带着遇见其他友好生物的期待而准备的。磁盘中也包括了我们的一部分文化，比如音乐和艺术，因为这些东西代表了我们是谁。


    到1990年，探测器飞到了距离地球近40亿英里的地方，接近太阳系的边缘。天文学家卡尔·萨根(Carl Sagan)从一开始就参与了旅行者1号的研究，他游说美国国家航空航天局做了一些不在任务计划之内的事情：把探测器上的镜头对准地球，从遥远的地方拍下了我们星球的照片。


    我们称这张照片为“暗淡蓝点(Pale Blue Dot)”，因为从旅行者1号的角度看，地球是一个很小的蓝点，是在巨大的黑色画布上唯一可见的物体。这个苍白的点很难被发现，你必须耐心地在照片中寻找我们的星球。


    这个小小的蓝点说明了两个重要的观点：第一，我们的好奇心永无止境，我们壮志踌躇。我们想要解开宇宙本身的秘密，我们向甚至不知道其存在的生物发送信息，这些信息可能需要10亿年才能送达。其次，“暗淡蓝点”表明，我们所有人的命运都深深地交织在一起，在我们所有人居住的无尽黑暗的宇宙的映衬下，将人类分为存在巨大差异的“我们”和“他们”是荒谬的。可以说，我们就生活在一个小斑点上，孤独地飘浮于永恒的太空之夜。我们真正拥有的只有彼此。


    作为一个物种，我们实际存在的巨大挑战是认识到我们注定要共享相同的命运，必须团结起来，拧成一股绳。在旅行者1号发射的十多年前，杰克·肯尼迪(Jack Kennedy)就捕捉到了这种情感，他说：“人类最基本的共同点是，我们都居住在这个星球上。我们都呼吸着同样的空气。我们都珍惜孩子的未来。我们都是凡人。”


    当人类掌握了第一项真正的技术——火的时候，我们的故事拉开了序幕。也正因为如此，一些完全出乎意料、在当时绝对无法理解的技术出现了：我们拥有了语言。从此我们开始建造城市，耕种粮食，发展文字，创造文明。一路上，我们驯服了内心的野蛮，或者至少学会了控制它。但我们最好的计划受到了资源有限性的限制。资源有限性就体现在没有充足的好东西上，没有足够的食物、药物、教育。但我们学到了一个强大的诀窍：技术，它可以用来克服资源有限性，并赋予人类移山的能力。


    这就是我们现在所处的位置：一个伟大新时代的开始，第四纪，它给了我们惊人的新力量，让我们可以用它来改善地球上每个人的生活。这符合我们集体的最大利益，因为如果所有人晚上都在自己床上安睡，如果每个人都身体健康，如果每个人都拥有真正的机会，那么我们所面临的社会问题，我们残余的野蛮和贪婪，都将逐渐消失。


    之后会发生什么？第五纪会带来什么？我们是否会向没有生命的行星发射探测器，在纳米机器人的道路上继续深入，从而在分子水平上转换现有的任何物质，进而为生命建造田园般的新家园？通过这种方式我们是否会能够冒险进驻其他星球？


    至于为什么我们没有在一个本应充满外星生命的宇宙中发现外星生命，有一个理论认为，也许智能总会导致自我毁灭。1966年，卡尔·萨根提出了一个有趣的观点：在发展星际通信的过程中，文明大概会走到一个岔路口，要么在一个世纪内摧毁自己，要么学会控制自我毁灭的行为，并继续生存数10亿年。


    如果萨根是对的，那么我们现在就走向成功的那边——10亿年俱乐部。要做到这一点，我们智慧的增长速度必须快过技术的破坏力的增长速度。萨根很好地总结了我们目前的处境：“在无尽的黑暗中，在无垠的空间中，没有任何迹象表明会有来自别处的帮手来救赎我们。我们唯有依靠自己。”


    我全心全意地、毫不掩饰地完全信任人类。而且人类找到了！我发现了人性的内在价值，所以我希望人类真的能扩展到整个宇宙中，宇宙看起来确实像在等着我们去拜访它。我希望10亿颗行星上各有10亿人，他们每个人都生活在安全、健康和繁荣之中，所有人都有能力实现自己的最大潜力。


    但在我们谈论其他行星之前，我们必须把需要的一些带到地球这颗行星上。曾经有一段时间，让人人享有安全、健康和繁荣的愿望超出了我们的能力范围。我们使用术语“乌托邦”来形容这种不可能的世界。它的原意是“不存在的地方”。它不存在，但我们真心希望它存在。


    当你阅读一些来自16世纪和17世纪最古老的乌托邦文学作品时，你能想到这些作者所设想的世界在当时看起来是多么古怪。托马斯·莫尔(Thomas More)爵士1516年发表的著作《乌托邦》，第一次提到“乌托邦”这个词，书中描述了一片人人享有宗教自由的土地。写于1602年的《太阳城》(Civitas
    Solis)，构想了一个没有奴隶制度的地方。1699年的《忒勒马科斯历险记》(Adventures of Telemachus)则描述了一个立宪政体的乌托邦。这些都是疯狂的想法，不是吗？宗教自由无疑会导致内战，奴隶制和君主专制制度已经存在了数千年。19世纪出版了更多乌托邦式的文学作品，其中包含了一些奇特想法，比如全民教育、男女平等、政府安全网络和预防性医疗保健。如今这些想法不再被认为是疯狂的，我们的现代世界正在一步步实现它们。当我们实现这些目标时，又会想出更多疯狂的想法，直到有一天我们醒来，发现我们无法想象一个比我们目前生活的世界更好的世界。我深信这将会发生。在那之前，我建议我们超越这些前人所提的乌托邦，我们需要一个充满抱负和自信而非空想的新词来激发新的思维模式。如果“乌托邦”指的是一个不存在的世界，我提供一个词“维乌托邦(verutopia)”，意思是“一个真实的地方”，一个我们可以共同努力建设的地方。维乌托邦是能为所有人带来充满机遇和富足的第五纪的世界。我们可以建设这样的未来，甚至可以凭借我们自己的能力去亲眼目睹它。它不再只是一场无意义的梦，而是一种真实的可能性。它不再是一个资源问题，而仅仅是一个意志问题。


    [1]螺旋扬水器，后人称它为“阿基米德螺旋”，是一个装在木制圆筒里的巨大螺旋状物(在一个圆柱体上螺旋状地绕上中空的管子)，把它倾斜放置，下端浸入水中，随着圆柱体的旋转，水便沿螺旋管被提升上来，从上端流出。这样，就可以把水从一个水平面提升到另一个水平面，对田地进行灌溉。“阿基米德螺旋”扬水机至今仍在埃及等地使用。


    [2]伊斯兰黄金时代：又称伊斯兰教复兴，在习惯上是指8-13世纪之间的500年，近来的一些学术研究将之扩展至15世纪。在这段时期，伊斯兰世界的艺术家、工程师、学者、诗人、哲学家、地理学家及商人辈出，在传统学术的基础上保留并促进了艺术、农业、经济、工业、法律、文学、航海、哲学、科学、社会学、科技各方面的发展，并在基础之上对这些方面实施改革创新。


    [3]1969年，美国国防部高级研究计划管理局开始建立一个命名为ARPAnet的网络，把美国的几个军事及研究部门用电脑主机连接起来。当初，ARPAnet只连接4台主机，从军事要求上是置于美国国防部高级机密的保护之下，从技术上它还不具备向外推广的条件。


    [4]1艾焦耳=10万亿焦耳。


