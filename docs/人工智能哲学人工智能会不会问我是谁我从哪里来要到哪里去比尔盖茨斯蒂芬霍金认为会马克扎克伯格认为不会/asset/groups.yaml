    # 18 意识


    意识是什么？据说无人知晓。但这不是真的。人们对这个问题看法普遍统一。迷惑之处在于意识是如何产生的。那么，意识究竟是什么呢？它是主观体验的感触，是你第一人称的知觉。你能感觉到在壁炉里燃烧的火的温暖，但是温度计只能测量温度。这两者的区别就'
  - '[PAGE 200]


    是“意识”。简单地说，它是“你”之所以成为你的体验。它让生活变得有价值，因为没有它，你只是一个没有感情的行尸走肉，感受不到爱和快乐。意识确实是人类存在于世的唯一且最重要的方面。


    想想看，让我们理解一个简单机器人的“大脑”。它会一直走直到撞在墙上，然后才改变方向，再试一次。可以这么说，它可能表现出复杂的行为，但我们知道“那代表不了什么”。它的内在没有体验挫折的“自我”。为什么我们不像那样？我们大脑中简单的物理过程是如何让我们体验事物的呢？物质怎么会感到沮丧呢？岩石能坠入爱河吗？当然不能，但为什么我们可以？我们是由和那块岩石完全一样的材料组成的，仅仅是元素周期表上的元素。无论数量有多少，一群神经元是如何去感知的？单纯的物质怎么会有第一人称视角呢？


    想象这样的场景：一眨眼工夫，还未引起他人注意，外星人就绑架了你，并用一个和你长得一模一样的机器人取而代之。再想深入一些，这个机器人被编程做你每天会做的所有事情。但这个机器人只是一个美化了的烤面包机。它不会思考。它不知道感受万物是什么样。它不知道你爱你的另一半，或是被交通堵塞所困扰，抑或是幻想做白日梦的感觉。它不知道回忆起一个有趣的笑话，然后咯咯笑的感觉。它不知道思索死亡是一种什么经历，也不知道对身后之事感到好奇的感觉。它不知道野心是什么样的。在炎热的天气里，它永远无法享受一杯冰柠檬水所带来的心旷神怡的清凉。它不知道听到一首自己喜欢的歌是什么感觉。它从未体验过闻到新鲜出炉的面包或刚从烘干机里拿出来的衣服所散发味道的快感。它不知道心痛的感觉。它不知道一个人处于极度狂喜或悔恨万分时的感受。它不知道勇敢或胆怯是怎样的。这个机器人只是一堆电线和马达，被设计成行为举止像你一样，并模仿你。所以机器人和真实的你的区别在于意识。但问题是：机器人也真能圆满完成你该有的反应。如果它在你微笑的时候微笑，并写'
  md: '

    吗？如果它们可以，那么我们在对待它们的方式上就会考虑这一点。

    我用抗生素消灭的细菌和我拍死的蚊子都没有感知能力。但是狗能感觉到疼痛，就像牛和猿一样。因此，我们有反对虐待动物的法律，但这些法律不适用于水母(jellyfish)和绦虫(tapeworms)。在动物王国里，对于“感知能力”从何处开始并没有共识，但我们却有信心知道在极端条件下，“感知能力”从何处结束。


    计算机有感知能力吗？理论上一台机器有诸如疼痛之类的感受吗？该答案对计算机的意识问题很重要。不管对于什么事物，没有体验就不会有意识。所以感知能力必然是意识的先决条件。


    当我还是个孩子的时候，我有一条唤作米丝蒂(Misty)的魏玛猎犬(Weimaraner)。有一次我和我的朋友史蒂夫(Steve)和她一起玩耍，她跳过水龙头时发生了意外，前腿受伤了。她的哭声让我觉得她真的很疼。


    1998年，老虎电子公司(Tiger Electronics)推出了一款名为菲比(Furby)的机器人玩偶，大受欢迎，在三年内销售了4000万台。随着时间的推移，它逐渐“学习”人类的语言，并内置了一些基本的传感器。当菲比被撞倒时，程序设定它用一种悲伤的腔调说“我很害怕”。它真的害怕吗？我怀疑所有人都有这个疑问。


    上述米丝蒂和菲比娃娃的故事有什么不同？什么样的事情能归为“疼痛”？


    如果你把一个能探测到热量的传感器插入计算机，然后给计算机编一个程序，即在燃烧的火柴靠近传感器时，让计算机发出“哎哟，哎哟”的声音，此时计算机会感到疼痛吗？如果你的答案是否定的，那么要怎样区分计算机发出的痛苦叫声和米丝蒂的痛苦叫声呢？


    回想一下我们关于宇宙组成的基本问题。一元论还是二元论？你可能还记得，一元论认为宇宙中的一切都是由原子构成的，并受物理学支配。这就是为什么它经常被称为唯物主义或物理主义。如果你是一元论者，“疼痛”的抽象概念实际上会带来一些问题。例如，一元论者可能会说：“疼痛是纯粹的物理现象。用锤子敲击你的拇指，你就会对这个事实有深刻的体会。”


    但在上述例子中，疼痛到底是什么？一元论者可能会给出字典上对疼痛的定义：“发生在大脑中的一种不愉快的感受，通常是由疾病或损伤引起。”这个定义并没有触及本质。“不愉快”这个词回避了“愉快是什么”，这与“疼痛是什么”是同一类问题。“感受”(sensation)这个词同样不对，因为其本身就是我们仍在努力理解的东西。“感受”某事意味着什么？此外，将“疼痛”定位在大脑中，表明一个外星生命或奇怪的新生物抑或没有真正大脑的智能机器都不能感觉到疼痛。一元论者相信外星人可能会画出蒙娜丽莎(Mona
    Lisa)的外星版本，但如果它踢碰到脚趾，得直跳脚，秉持“疼痛”字典定义的一元论者将不得不说，它实际上并没有感觉到疼痛，因为它没有大脑。这种观点显然不能令人满意。很难说一元论者会选择什么来定义“疼痛”，既要包括人类和动物，还要排除菲比玩偶和细菌，更要为树木和计算机敞开大门？


    如果你是二元论者，在理解“疼痛”时就会遇到不同的问题。你可以欣然接受“疼痛”是一个抽象的、非物质的存在。你甚至不会苛求它必须是大脑的产物。你对疼痛的理解适用于人和动物，但排除菲比玩偶，并假设可以容纳植物和机器。疼痛不是生理上的，而是精神上的。这就是二元论对此问题的全部看法。但是你仍然无法回避一元论者驳斥二元论的主要论点，即精神世界和物质世界是如何相互作用。如果疼痛是存在于物质世界之外的非物质事物，那么，正如一元论者会问的那样：“为什么用实体锤敲打你的肉体拇指，会引起疼痛这种非物质的感觉？”


    无论一个人持何种立场，这两种观点都有一个共性：要想让疼痛存在，就必须有感受疼痛的物质。无论你是一元论者还是二元论者，一定有一个“我”来感受疼痛。在我看来，我的狗米丝蒂似乎有一个感受疼痛的“我”。这并不是说它有意识，我们稍后会讲到。但它似乎有一个能体会“疼痛”的自我。这让我们回到了“你的‘自我’是什么”的基本问题上。


    如果你相信你的“自我”是大脑的一个把戏，是大脑中许多部分协同工作的幻觉，那么我们可以制造一台执行类似把戏的计算机，这似乎是合理的。那会是一台有感知能力的计算机，但不算是一台有意识的计算机，相反，它只是能感知某些事物而已。而如果你认为你的自我是你大脑的一种“涌现”属性，那么我们就必须保持这个问题的开放性，因为我们对涌现的理解还不够透彻，不知道它是否能以一种可预测的方式机械地复制。最后，如果你对“自我”的看法是非物质的，比如灵魂、精神或生命力，那么一台有感觉的计算机几乎是不可能的，除非你相信这种力量可以存在于人造物体中。尽管许多人确实相信有些地方会闹鬼，但很难想象计算机工厂会大规模生产这种东西。什么生命形式能感觉到疼痛？如前所述，这是一个悬而未决的问题，也是一个备受争议的问题。让我们遍寻从人类到植物的所有生物，看看我们能得出什么结论。


    你当然知道，只要你有感觉，你就能感到疼痛。对于其他人什么时候感到疼痛，你也有十足的自信能知道，因为他们会自我陈述，除非他们说谎，否则他们是判断自己是否感到疼痛的权威。我们推断哺乳动物受到了疼痛的折磨，是因为它们和人类表现出许多相同的症状，而且引起我们疼痛的因素，似乎也同样会影响它们。如果一只猿猴用锤子敲击自己的拇指并嚎叫，我们得出结论，这种举动对它造成了伤害。如果猿猴用手语表达痛苦的哀嚎，那么这种肢体语言亦会成为我们证实它疼痛的证据。然而，在哺乳动物疼痛的问题上并没有达成普遍的共识。1990年以前在美国接受培训的兽医，被教导说要无视动物的疼痛，因为人们相信动物实际上没有任何知觉。这个话题从现实意义上讲仍然很重要，因为它涉及到对动物的医学和产品测试，以及动物在科学研究中的应用。同样值得注意的是，直到20世纪下半叶，医学界还一致认为婴儿和动物一样不会感到疼痛，因此不需要麻醉就可以进行手术。


    关于哺乳动物是否能感觉到疼痛并没有普遍的共识，这应该引起重视。人们怎么会持这种观点呢？又是如何成为最近的主流观点的？这种观点推论如下：“狗在被针戳到时会畏缩，就像单细胞阿米巴变形虫的畏缩表现一样，并不表示任何感觉。它只是一种被编入动物DNA的反应。我们之所以把疼痛的感觉投射到狗身上，是因为在类似的情况下，我们也会感到疼痛。”


    哺乳动物不会感到疼痛的说法在我听来确实像是敷衍了事。它使人们避免了各种关于“我们如何对待和利用动物”的伦理问题。我怀疑没有人能说服我，让我相信我的狗米丝蒂没有疼痛的感觉，但在讲述这个故事时，我故意使用了她“似乎是”(appeared
    to)这个短语，因为从最严格的意义上讲，我不“知道”她是否疼痛。


    抛开哺乳动物的疼痛不谈，对于鱼类和无脊椎动物是否有疼痛感觉的共识更少也就不足为奇了。你无法通过它们的行为来判断它们的疼痛，因为动物就算感到难以忍受的疼痛，也会不惜一切代价将其隐藏起来，以免成为猎物的目标。有些人相信昆虫是不会感到疼痛的，这就是为什么有时你会看到一只身体残缺的昆虫四处爬动，似乎对这个世界并不在意。珊瑚，作为一种简单的生命形式，似乎也不会感觉到疼痛，因为它们对温和而无害的触摸与猛烈戳捅的反应是相同的。


    说到植物，它们又怎么样呢？你可能会嗤之以鼻，但有一些有趣的研究表明，那里发生的事情比我们看到的要多。在彼得·汤普金斯(Peter Tompkins)和克里斯托弗·伯德(Christopher
    Bird)于1973年出版的《植物的秘密生活》(The Secret Lives of plants)一书中，突然出现了植物可以“感觉”的观点(更准确地说，是重新兴起，因为这是一种古老的信仰)。这本书还提到了中央情报局(CIA)的一份报告，报告称一名男子将测谎仪连接到一株植物上，当他想到要烧掉一片叶子时，仪器就会做出反应，这表明植物也有心灵感应。


    这种类型的实验很难复制，植物学家对此存疑，但该主题足够重要，值得在2013年《纽约客》(The New Yorker)上进行专题讨论。在10000字针对该观念的论述中，许多可信赖的科学家都乐于提出充分的论据，或者至少会考虑一下该论点。


    我提出植物疼痛的问题，并不因为我认为植物是有感知能力的，而是为了指出，我们不确定它们是否能感觉到疼痛，因为这种疼痛与人类对疼痛的感觉是不同的。这不仅仅是一个学术问题，因为如果我们无法知道与我们共享大部分DNA的植物是如何感受或感受不到疼痛的，我们又如何知道计算机能否感受到疼痛呢？即使计算机说“哎哟，真疼啊”，这难道不是计算机编程的产物吗？就算它可以自我编程，你怎么知道它是否有任何感觉呢？你可以想象，当AI要处理一个问题时，它推断出，如果它声称关闭计算机会使它受到伤害，那么或许人类就会允许它保持开机状态，这样它就能更好地完成任务。它由此得出一个关于“伤害”的数学结论，即使它实际上感觉不到任何东西。


    在我们刚刚探讨过的关于感知能力的各种问题上，并没有达成普遍的共识，这不应该让任何人感到惊讶。毕竟，诸如此类的问题也同样困扰苏格拉底(Socrates)，让他夜不能寐。但还是希望你，作为一个读者，对它们有一些个人的理解。根据你的观念回答以下问题，记录你回答“是”的次数：

    - (1)狗会感到疼痛吗？

    - (2)昆虫和蜘蛛等无脊椎动物可能感觉到疼痛吗？即便与人类的感觉不同？

    - (3)植物有可能感觉到疼痛吗？

    - (4)一个没有神经系统的结构复杂的外星人是否可能以一种与人类完全不同的方式感受疼痛？

    - (5)无机物(即不含碳的)有没有可能感觉到疼痛？其中可能包括晶体、雷暴、由水和泥土构成的外星人，或其他无机物质。


    你回答“是”的次数越多，你就越相信机器是有感知能力的。


    ## 17 自由意志


    在讨论“计算机变得有意识”这个问题之前，我们要讨论的第二个话题是自由意志。为什么这与计算机意识密切相关呢？在你的日常生活中，你有体验，这是意识的基础，你做出选择，这就是自由意志。你品尝菠萝是有意而为的体验，然后你会行使自由意志，选择是否再咬一口。自由意志和意识就像同一枚硬币的正反两面，就如同你在体味菠萝的同时也在行使自由意志。


    如果自由意志最终被证明是完全机械的，实际上只是一种幻觉，这将表明(尽管不能证明)，意识也符合这种模式。然而，如果自由意志存在于物质因果关系之外的东西，那么意识也可能如此。此外，如果自由意志确实存在，那么我就会想到两个问题：“它从何而来？”“计算机可以有自由意志吗？”


    我们通过两套不同的物理定律来理解物质世界，一套适用于大物体(large objects)，另一套适用于小物体(small objects)，二者似乎都不允许自由意志。大物体遵循牛顿物理学说，该学说认为每一个行为过程都有其原因。你生活中的每一件事，直到今天早上你的脚指头撞到床架上，都是一系列可以追溯到宇宙大爆炸事件的必然结果。适用于小物体的一套法则是量子理论，该观点下存在没有缘由的行为，这些行为完全是随机的。放射性物质的衰变常被引作例子，它以一定的速率衰变，但单个粒子的衰变却是完全的、真正随机的，这里所说的“随机”是指其最本质的含义。所以，从本质上看，你要么是个机器人，要么是个行为随机的疯子。


    一方面，我们确实有一种看起来像自由意志的东西。另一方面，我们没有找到很好的方法来解释自由意志存在的可能性。正因为如此，人们分成了两个阵营：相信自由意志的“自由意志论者(libertarians)”(不同于与政治意识形态层面的自由主义者)，和不相信自由意志的决定论者(determinists)。对我们来说，最重要的问题即你的大脑是否是一个因果系统。换句话说，你的大脑是不是就像一个巨大的发条装置？你上好发条，它就会运行它那死板不变的程序。人们都不认为时钟有自由意志。它只是精准执行它被设计来做的事情，在做什么的问题上，时钟毫无发言权。你也是这样吗？你正在做选择的想法只是一种错觉吗？一般来说，二元论者相信自由意志，而一元论者则不相信。


    神经科学如何看待自由意志？约翰·霍普金斯大学(The Johns Hopkins University)的利昂·格迈因德尔(Leon Gmeindl)和邱宇钦(YuChin
    Chiu)做了一个有趣的实验。他们将受试者放在核磁共振成像机中，受试者可以看到一个屏幕，屏幕的左侧和右侧有彩色的字母和数字在滚动，而中间什么也没有。他们被要求注视一边，转换他们的注意焦点，再看另一边，然后，在某一时刻，将焦点转换回来。他们没有得到何时做这些事情的指令，全部自发完成。这一实验的构想是，无论大脑的哪个部分在转换焦点的前一瞬间处于活跃状态，那就一定是“自由意志”所在的区域，或者至少是改变注意焦点的自由意志的所在。果不其然，格迈因德尔和邱在受试者们的大脑中发现了一致的区域，在那里，焦点转换之前会立即引发活跃状态。那么，这就是所谓的自由意志存在于大脑中的地方吗？如果是，它看起来的确像是纯粹的确定性大脑活动。没有什么特别的事情发生。大脑只是在做它自己的事情。然而，事情并没有那么简单。正如他们所说，事情越来越复杂。


    心理学家丹·韦格纳(Dan Wegner)和塔利亚·惠特利(Thalia Wheatley)在1999年发表的一篇开创性论文中提出了一个革命性的想法。他们坚持认为，与一个人决定做某事，进而付诸行动不同，实际上，大脑中的事情是以相反的顺序运行的。首先，理论上说，你做了某件事，然后你才告诉自己决定做这件事。这能是真的吗？无论如何肯定与生活的感受不一样。这是怎么回事？这是一个好问题。


    耶鲁大学(Yale University)的两位心理学家亚当·贝尔(Adam Bear)和保罗·布鲁姆(Paul Bloom)给出了一个答案：你大脑的不同部分，每一个都有具体分工，指挥你的身体做不同的事情，比如(根据我们上面的例子)注视屏幕的另一边。然后，当你确实开始看向另一边时，你的显意识(conscious
    mind)会注意到这一点，并迅速猜测你为什么会转换焦点。然后它会对你说，“你现在应该移动你的眼睛，看看另一边的数字是否与这一边相同。然后——这就是你的显意识狡猾的地方——它重写你的记忆，让你以为你是决定转换焦点在先，付诸行动在后。贝尔和布鲁姆做了一些非常令人信服的实验来证明这一点，这些实验只需要一台个人电脑和一个简易程序就可以重现。所以，在他们看来，你自由意志的感觉，那种你在做决定的感觉，是在你真正做这些事情的几毫秒之后产生的。我再重申一遍：你做某事的决定似乎是在你做了某事之后发生的。这就好像你的意识永远都在你的身体后面追着大喊：“那是我的主意！那是我的主意！”


    为什么我们的大脑会对我们耍这种把戏？为什么我们会认为有一个管理员“我”在发号施令？一种理论认为信仰自由意志是有益的。2008年，心理学家凯瑟琳·沃斯(Kathleen
    Vohs)和乔纳森·斯库勒(Jonathan Schooler)发表的一份报告，似乎为这一理论提供了依据。两组学生被要求做一次数学测验，其中一组刚刚读了一篇关于自由意志为何不存在的文章。结果读过这篇文章的那一组比没有读过的那一组作弊更多，这表明关于自由意志的信仰对鼓励社会中的道德选择是很重要的。此外，也许因为我们认为自由意志是存在的，所以我们更愿意惩罚罪犯，让人们为自己的行为负责，所有这些都有助于建设一个文明社会。


    尽管实验相当具有说服力，但所有这些都还没有得到证实。我们甚至不知道记忆是如何在大脑中编码的。当被问到我们能够测量大脑中的什么时，我们使用最模糊的术语“活动”。这就像有人把纽约市发生的一切描述为“运动”。目前，就神经科学而言，我们所能看到的只是那些正在发生的事情，所以仍须秉持谦虚。


    话虽如此，让我们假设一切都是真的，你的大脑确实会自己做决定，而你稍后会试图证明它的正确性。一元论者，或者相信人类是机器的人，会把这看作是一元论者立场的另一个证据。一元论者可能认为所谓的自由意志是复杂的、混乱的或虚幻的，但无论它是什么，它都发生在大脑中，并受物理定律的支配。你的大脑就像时钟，嘀嗒嘀嗒地走着，“你”对它会做什么没有发言权。


    二元论者，以及用非机械论术语来看待人类的人，他对自由意志的信念和我们刚才讨论的实验之间也可以和谐共处。虽然二元论者无疑相信大脑控制着躯体，但他们发现了一个引人关注的问题，即为什么人们选择在那一瞬间看向屏幕的另一边，是什么触发了观察到的大脑活动？对于每一个回答，他们都会以一个四岁孩子般令人抓狂的坚持反过来追问：“这些答案又是什么造成的呢？”最终，在这种观点下，你要么回到大爆炸，要么发现自由意志。


    一元论者可能会在二元论者的独白中翻白眼，用一种愤怒的声音回应说，我们完全有理由相信自由意志是一种决定论的心理过程。接着二元论者被迫再次反击：“我们也完全有理由相信，自由意志就是我们自己日常选择事物的经验，除此之外，它什么也不是。”


    伟大的诗人塞缪尔·约翰逊(Samuel Johnson)在几百年前就敏锐地捕捉到了这场冲突。当被问及他是否相信人类有自由意志时，他回答说，所有的理论都认为我们没有，所有的经验都认为我们有。确实，当我们向内看的时候，我们并不觉得自己在以时钟或行星轨道那样的机械精度运转，反而感觉我们有活力、意志、意图、动机和雄心。这些都可能是幻想，但事实上，双方阵营的每个人都承认，这确实让我们感觉自己像是有自由意志。


    正如我们迄今所看到的几个问题一样，解决起来并不容易。如果自由意志确实存在，那么人们就必须努力弄清它从何而来，以及它为什么无法在牛顿因果框架或量子物理的随机性中存在。如果它确实存在于物质世界之外，又是什么在支配着它呢？又来自哪里？它是如何与生物大脑沟通的呢？只有了解这是如何发生的，才能让人们知道计算机是否可以具有自由意志。


    那些否认自由意志的人也被置于同样的困境。我们都知道当医生测试你的膝跳反射时是什么感觉。在该动作中体会不到自由意志，你的腿只是踢了踢而已。但是决定要点哪种口味的冰激凌却是截然不同的感受。这种感受什么？为什么与踢腿的感受不同呢？


    ## 18 意识


    意识是什么？据说无人知晓。但这不是真的。人们对这个问题看法普遍统一。迷惑之处在于意识是如何产生的。那么，意识究竟是什么呢？它是主观体验的感触，是你第一人称的知觉。你能感觉到在壁炉里燃烧的火的温暖，但是温度计只能测量温度。这两者的区别就是“意识”。简单地说，它是“你”之所以成为你的体验。它让生活变得有价值，因为没有它，你只是一个没有感情的行尸走肉，感受不到爱和快乐。意识确实是人类存在于世的唯一且最重要的方面。


    想想看，让我们理解一个简单机器人的“大脑”。它会一直走直到撞在墙上，然后才改变方向，再试一次。可以说，它可能表现出复杂的行为，但我们知道“那代表不了什么”。它的内在没有体验挫折的“自我”。为什么我们不像那样？我们大脑中简单的物理过程是如何让我们体验事物的呢？物质怎么会感到沮丧呢？岩石能坠入爱河吗？当然不能，但为什么我们可以？我们是由和那块岩石完全一样的材料组成的，仅仅是元素周期表上的元素。无论数量有多少，一群神经元是如何去感知的？单纯的物质怎么会有第一人称视角呢？


