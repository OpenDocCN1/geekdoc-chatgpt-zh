    将来会不会有一些人完全无法与机器竞争上岗？这取决于这三种可能性中哪一种会发生。


    第一种可能性是最简单的情况。在这种情况下，几乎没有什么事情是机器不能做的。出于怀旧的原因，人类可能还会从事一些工作，但对我们其他人来说，人类具有经济价值的时代将会结束。卡尔·马克'
