    如果强涌现是计算机产生意识的根源，那么它能有意识吗？不知道。你能把你的意识上传到机器里吗？不知道。从定义上讲，强涌现是无法解释的，我们最终掌握它的情况也不确定。它的论点是，如果强涌现确实是一个机械过程，那么我们应该能够机械地再现它。反对这一观点的理由是，那些归因于强涌现的东西——意识、心灵和生命——本身就是我们所知道的最令人费解的东西。它们是巨大的谜团，可能永远在我们的控制之外。


    # 理论3：物质的物理属性


    其他一些人则相信，你不需要任何复杂的涌现现象来解释意识。理查德·道金斯理性与科学基金会(Richard Dawkins Foundation for Reason
    & Science)在其网页上发表了一篇由得克萨斯大学奥斯汀分校哲学教授盖伦·斯特劳森(Galen Strawson)撰写的文章。斯特劳森坚持认为，我们无法理解意识是如何产生的，源于我们对物理学的无知。斯特劳森写道：“我们不知道物理材料的内在本质。”他相信，随着我们对物理学理解的加深，意识将撕下神秘面纱，被视为一个物理过程。从这个角度来看，我们所说的“看似无法解释的意识本质”，并不令人感到惊讶。物理宇宙充满了奇怪的、貌似无法解释的东西，比如量子论、相对论和暗物质。考虑一下纠缠现象，在这种现象中，两个粒子紧密关联，即使它们分处宇宙两头，如果你改变其中一个粒子，另一个也会立即做出反应，比光本身的速度还要快。爱因斯坦(Einstein)甚至把这种现象归类为“鬼魅学说”。与量子纠缠相比，意识似乎并不那么奇怪。


    如果确有其事，意识是物质的一种物理属性，机器能获得意识吗？能。事实上，这种情况非常简单。一旦我们能更好地理解物质，我们就会理解意识。根据这一理论，开发有意识的计算机不用依赖于涌现特性的变革性神秘力量，而只取决于对简单物质更深入的理解。'
