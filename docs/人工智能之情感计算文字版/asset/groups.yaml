    院自动化研究所模式识别国家重点实验室的专家们针对语言中的焦点现象，首先提出了情感焦点生成模型。这为语音合成中情感状态的自动预测提供了依据，结合高质量的声学模型，使得情感语音合成和识别率先达到了实际应用水平。


    语音中的情感特征化比面部表情的情感特征化要难。面部表情信号传达了个人特征和表情，一般不传达语言信息。另一方面，语音信号包含的是混合信息，包括说话者特征、情感和说话内容中强调的词汇和语法。计算机在语音情感的识别和合成方面的进展很慢。随着计算机多媒体技术的不断发展，能处理包含在媒体中的情感信息的拟人化的多媒体计算机系统的研究越来越引起人们的兴趣。因为语音信号既是多媒体人机交互的主要利用方式，又是传载情感信息的重要媒体，所以对于包含在语音信号中的情感信息进行计算机处理研究就显得尤为重要。当人通过听觉器官把他人的语言声调信号接收并传递到人的大脑之中，大脑就会对其时间构造、振幅构造、基频构造和共振峰构造等方面的特点和分布规律进行检测、预处理和特征提取，然后，把以前存储在大脑中的若干基本表情的语言声调信号的时间构造、振幅构造、基频构造和共振峰构造等特征方面的构造特点和分布规律提取出来，进行对比分析和模糊判断，找出两者声音特征最接近的某种基本表情。


    +   ● 肢体语言识别


    人的姿态一般伴随着交互过程而发生变化，这种变化表达了一些信息。例如手势的加强通常反映一种强调的心态，身体某一部位不停地摆动，则通常具有情绪紧张的倾向。相对于语音和人脸表情变化来说，姿态变化的规律性较难获取，但由于人的姿态变化会使表述更加生动，因而人们依然对其表示强烈的关注。科学家针对肢体运动专门设计了一系列运动和身体信息捕获设备，例如运动捕获仪、数据手套、智能座椅等；国外一些著名的大学和跨国公司，例如麻省理工学院、IBM
    等则在这些设备的基础上构筑了智能空间；同时也有人将智能座椅应用于汽车的驾座上，用于动态监测驾驶人员的情绪状态，并提出适时警告。


    +   ● 语言文字识别


    语言和文字属于第二信号系统，由于它们脱离了现实事物对于人的条件反射活动的直接参与，从而可以更为广泛地、普遍地、直接地、快速地、灵活地、多样地、深入地对各种事物进行认识，从而可以使人类能够对更为抽象、更为本质、更为遥远、更为间接、更为广泛、更为模糊、更为变化莫测的事物的价值关系进行认识和反应。


    当人通过听觉器官把他人的语言信号接收并传递到人脑中，或者通过视觉器官把文字信号接收并传递到人脑中，大脑就会对其进行语义分析，对它们所描述事物的价值关系的目标指向、'
