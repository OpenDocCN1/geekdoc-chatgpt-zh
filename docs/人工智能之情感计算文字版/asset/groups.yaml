    \ of Michigan\n\n  概述: 作者认为，情感识别系统的应用非常有意义，比如社会和情感人机交互系统及与健康相关的系统可以帮助个体更好地记录他们的情感世界。但情感的表达是非常复杂的，可以通过面部表情、语音语调以及肢体语言的变化来体现。情感识别系统必须能够“解码”这些外在的变化来了解其代表的真实情感。但是，外在表情和行为的变化不仅仅受到情绪的影响，比如面部表情的变化有时是由于语言发音引起的。有效的情感识别系统必须能够辨别人的表情及行为变化是由于语言发音导致的，还是由于情感变化导致的。在本文中，作者描述了一种面部表情分析模型，目的是减少语言发音对于面部表情的影响，更加准确地识别表情变化背后的情感变化，提高面部表情的情感识别率。\n\
