    概述: 音乐研究中最具挑战性的工作是建立能够比较音乐情感内涵，并能根据情感组织音乐的计算模型。本文中，作者提出了一种新型声学情感高斯模型（AEG）来界定音乐情感感知的过程。AEG
    作为一种生成模型，对学习过程做出了简单直接的解释。为了架起声学特征空间与音乐情感空间的桥梁，作者从数据中提取了一系列潜在特征集，并将其引入到模型中，执行两个空间端到端语义映射。AEG
    模型适用于音乐情感自动标注与基于情感的音乐检索。为了深入了解 AEG 模型，文中提供了模型学习过程的说明。为了表明 AEG 模型具有更高的精度，作者对两种音乐语料库
    MER60 和 Muturk 进行了综合性能研究。结果显示，AEG 模型在音乐情感注释方面胜过以前的方法。另外，文章首次提出了基于音乐情感检索的定量评估。


