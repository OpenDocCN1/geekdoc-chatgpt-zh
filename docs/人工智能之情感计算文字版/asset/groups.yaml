    变化方式、变化时态、对方的利益相关性等进行判断，从而确定和选择情感表达的某种基本模式。


    +   - 生理模式识别


    从生理信号中抽取出来的特征模式可以用来识别情感。计算机在人做出表情（如悲痛或愤怒）的时候，观察多种收集到的信号，然后分析哪种生理信号模式和特定情感状态关系最密切。然后计算机系统应用先前分析的结果，根据收集到的原始数据来识别出包含在信号中最有可能的情感。这方面的研究才刚刚开始。通常通过观察所有数据的子集能判断出哪种特征值的辨别能力最强。试过所有可能的三种情感、两种特征值的组合，发现愤怒、悲痛和尊敬的组合或愤怒、高兴和尊敬的组合中，情感是最容易识别出的。这两种情况中，都有一个最佳的识别特征值，即
    EMG 信号的平均值，但是另一个最佳特征值却是不同的。愤怒、悲痛和尊敬的组合中，标准化信号的第一次差分绝对值的平均值就是最佳的；而对愤怒、高兴和尊敬的组合中，最佳选择还是第一次差分绝对值的平均值，但这次是从
    EMG 信号中得到的。


    # ## 1.2.2.3 情感信号的融合算法研究


    某一情感的变化对应于多种生理或行为的变化，不能从单一生理或行为的变化引出相应的情感的变化，因此，情感的判定是融合各种生理或行为的过程，应该研究有关情感计算的信息融合理论与技术。


    信息融合又称数据融合，也可以称为传感器信息融合或多传感器信息融合，是一个对从单个和多个信息源获取的数据和信息进行关联、相关和综合，以获得精确的位置和身份估计，以及对态势和威胁及其重要程度进行全面及时评估的信息处理过程；该过程是对其估计、评估和额外信息源需求评价的一个持续精练（Refinement）过程，同时也是信息处理过程不断自我修正的一个过程，以获得结果的改善。


    信息融合技术可概括为：利用计算机技术对按时序获得的若干传感器的观测信息在一定准则下加以自动分析、综合处理，以完成所需的决策和估计任务而进行的信息处理过程。按照这一定义，多传感器系统是信息融合的硬件基础，多源信息是信息融合的加工对象，协调优化和综合处理是信息融合的核心。也可以认为，信息融合或数据融合技术是利用计算机技术对来自多传感器（同类或者不同类）探测的多源信息，按一定规则进行自动分析和综合后，自动生成人们所期望的合成信息的信息处理技术。它对多类型、多源、多平台传感器所获得的各种情报信息（如数据、照片、视频图像等信息）进行采集、传输、汇集、分析、过滤、综合、相关及合成，快速进行情报处理和自动图形标绘。'
