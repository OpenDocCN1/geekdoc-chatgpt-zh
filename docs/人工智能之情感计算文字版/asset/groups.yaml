    # 2.4 情感计算获奖论文


    本节对近年 ACM MM 中涉及情感计算的获奖论文进行简单介绍，欢迎读者交流补充。


    +   • **2018-ACM MM Best Demo**


    **篇名：** AniDance: Real-Time Dance Motion Synthesize to the Song.


    **作者：** Taoran Tang, Hanyang Mao, Jia Jia


    **单位：** Tsinghua University


    **概述：** 本篇论文介绍了一个名为 AniDance 的系统，它可以实时地将舞蹈动作与旋律相结合。当用户在手机中播放一首歌或者在 AniDance 中播放一首歌时，歌曲旋律将驱动
    3D 空间角色跳舞，创造出一个生动的舞蹈动画。在实践中，研究人员通过捕捉真实的舞蹈表演，来构成 3D 空间舞蹈运动数据集，使用 LSTM 自动编码器来识别音乐和舞蹈之间的关系。基于这些技术，用户可以提升他们的学习能力以及对舞蹈和音乐的兴趣。


    **下载地址：** https://hcsi.cs.tsinghua.edu.cn/Paper/Paper18/MM18-TANGTAORANDEMO.pdf'
  - '[PAGE 35]


    +   ● 2016-ACMMM Best Paper


    篇名: Multi-modal Multi-view Topic-opinion Mining for Social Event Analysis


    作者: 钱胜胜、张天柱、徐常胜


    单位: 中国科学院自动化研究所


    概述: 本篇论文针对社会事件数据中呈现的多视角多模态等属性，提出一种多模态多视角的主题观点挖掘方法。该方法利用不同新闻媒体对同一个社会热点事件观点的差异性，研究不同视角对应的观点。通过本方法，既能够细致地分析不同媒体对社会热点事件的观点，又能够对社会热点事件进行全方位展示，便于探究热点事件的全局态势与舆情走势。本篇论文从多个社交平台上检测社会热点事件，并将其全面地展现出来，不仅切合政府和民众的需求，也是国际学术的研究热点。获奖论文敏锐地利用不同社交平台的在传播速度和传播内容上的特点，提出了一个有效的跨平台跨模态的社会热点事件监测方法。选题的新颖性、解决思路的创新性、以及技术的有效性，均受到评审专家的一致认可。


    下载地址: http://www.millenniumsoftsol.com/courses/IEEETitles/Java/Multi-Modal-Event.pdf


    +   ● 2014- ACM MM Best Student Paper Award


    篇名: Say Cheese vs. Smile: Reducing Speech-Related Variability for Facial Emotion
    Recognition


    作者: Yelin Kim and Emily Mower Provost.


    单位: Electrical Engineering: Systems, University of Michigan


    概述: 作者认为，情感识别系统的应用非常有意义，比如社会和情感人机交互系统及与健康相关的系统可以帮助个体更好地记录他们的情感世界。但情感的表达是非常复杂的，可以通过面部表情、语音语调以及肢体语言的变化来体现。情感识别系统必须能够“解码”这些外在的变化来了解其代表的真实情感。但是，外在表情和行为的变化不仅仅受到情绪的影响，比如面部表情的变化有时是由于语言发音引起的。有效的情感识别系统必须能够辨别人的表情及行为变化是由于语言发音导致的，还是由于情感变化导致的。在本文中，作者描述了一种面部表情分析模型，目的是减少语言发音对于面部表情的影响，更加准确地识别表情变化背后的情感变化，提高面部表情的情感识别率、


    下载地址: https://cn.aminer.cn/archive/say-cheese-vs-smile-reducing-speech-related-variability-for-facial-emotion-recognition/555045d945ce0a409b5a118'
