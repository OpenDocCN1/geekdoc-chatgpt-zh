    # # 2 技术篇


    情感计算是一个多学科交叉的崭新的研究领域，它涵盖了传感器技术、计算机科学、认知科学、心理学、行为学、生理学、哲学、社会学等方面。情感计算的最终目标是赋予计算机类似于人的情感能力。要达到这个目标，许多技术问题有待解决。这些技术问题的突破对各学科的发展都产生巨大的推动作用。本篇分别从情感计算的传统研究方法和新兴研究方法对技术发展进行了探讨。此外，本篇对情感计算方向较有代表性的获奖论文进行了归纳整理，更加清晰地展示了目前该领域的研究成果。


    # ## 2.1 传统的研究


    传统的情感计算方法是按照不同的情感表现形式分类的，分别是：文本情感分析、语音情感分析、视觉情感分析。以下对三种传统的分析方法进行详细介绍。


    # ### 2.1.1 文本情感计算


    20世纪90年代末，国外的文本情感分析已经开始。早期，Riloff和Shepherd在文本数据的基础上进行了构建语义词典的相关研究。McKeown发现连词对大规模的文本数据集中形容词的语义表达的制约作用，进而对英文的形容词与连词做情感倾向研究。自此之后，越来越多的研究开始考虑特征词与情感词的关联关系。Turney等使用点互信息的方法扩展了正负面情感词典，在分析文本情感时使用了极性语义算法，处理通用的语料数据时准确率达到了74%。在近些年的研究中，Narayanan等结合各种特征及其相关联信息，提出了基于分句、整句、结果句的分类方案，获得了很好的效果。Pang等以积极情感和消极情感为维度，对电影评论进行了情感分类。他分别采用了支持向量机、最大熵、朴素贝叶斯算法进行分类实验，发现支持向量机的精确度达到了80%。随着研究的不断深入，学者在对情感分析算法进行改进的同时，也将其应用到不同的行业中进行了实践。


    文本情感计算的过程可以由 3 部分组成：文本信息采集、情感特征提取和情感信息分类。文本信息采集模块通过文本抓取工具（如网页爬虫工具）获得情感评论文本，并传递到下一个情感特征提取模块，然后对文本中自然语言文本转化成计算机能够识别和处理的形式，并通过情感信息分类模块得到计算结果。文本情感计算侧重研究情感状态与文本信息之间的对应关系，提供人类情感状态的线索。具体地，需要找到计算机能提取出来的特征，并采用能用于情感分类的模型。因此，关于文本情感计算过程的讨论，主要集中在文本情感特征标注（信息采集）、情感特征提取和情感信息分类这三个方面[7]。'
  - '[PAGE 16]


    # 文本情感特征标注


    情感特征标注是对情感语义特征进行标注，通常是将词或者语义块作为特征项。情感特征标注首先对情感语义特征的属性进行设计，如褒义词、贬义词、加强语气、一般语气、悲伤、高兴等等；然后通过机器自动标注或者人工标注的方法对情感语义特征进行标注，形成情感特征集合。情感词典是典型的情感特征集合，也是情感计算的基础。在大多数研究中，有关情感计算的研究通常是将情感词典直接引入自定义词典中。


    运用情感词典计算出文本情感值是一种简单迅速的方法，但准确率有待提高。在实际的情感计算中，会因为具体的语言应用环境而有所不同。例如，“轻薄”一词通常认为是否定词，但是在电脑、手机却被视为肯定词汇。同时，文本中常会出现否定前置、双重否定以及文本口语化和表情使用等，这些都将会对文本情感特征的提取和判断产生较大的影响。因此在进行文本情感提取时，需要对文本及其对应的上下文关系、环境关系等进行分析。


    # 情感特征提取


    文本包含的情感信息是错综复杂的，在赋予计算机以识别文本情感能力的研究中，从文本信号中抽取特征模式至关重要。在对文本预处理后，初始提取情感语义特征项。特征提取的基本思想是根据得到的文本数据，决定哪些特征能够给出最好的情感辨识。通常算法是对已有的情绪特征词打分，接着以得分高低为序，超过一定阈值的特征组成特征子集。特征词集的质量直接影响最后结果，为了提高计算的准确性，文本的特征提取算法研究将继续受到关注。长远看来，自动生成文本特征技术将进一步提高，特征提取的研究重点也更多地从对词频的特征分析转移到文本结构和情感词上。


    # 情感信息分类


    文本情感分类技术中，主要采用两种技术路线：基于规则的方法和基于统计的方法。在 20 世纪 80 年代，基于规则的方法占据主流位置，通过语言学家的语言经验和知识获取句法规则，以此作为文本分类依据。但是，获取规则的过程复杂且成本巨大，也对系统的性能有负面影响，且很难找到有效的途径来提高开发规则的效率。20
    世纪 90 年代之后，人们更倾向于使用统计的方法，通过训练样本进行特征选择和参数训练，根据选择的特征对待分类的输入样本进行形式化，然后输入到分类器进行类别判定，最终得到输入样本的类别。


    下表整理了 10 个文本情感分析 API，供读者参考：'
  md: '

    纹理和较细致的图形变换算法，达到生动的情感表达效果。在此基础上，不同的算法形成了不同水平的应用系统。


    随着人脸的计算机处理技术（包括人脸检测和人脸识别）不断完善，利用计算机进行面部表情分析也就成为可能。由于各种面部表情本身体现在各个特征点运动上的差别并不是很大，而表情分析对于人脸的表情特征提取的准确性和有效性要求比较高，因而难以顺利地实现。具体的表情识别方法主要有三个：一是整体识别法和局部识别法，二是形变提取法和运动提取法，三是几何特征法和容貌特征法。当然，这三个发展方向不是严格独立的，恰恰相反，它们是相互联系和影响的，它们从不同侧面提取所需要的表情特征，都只是提供了一种分析表情的思路。例如：嘴巴张开并不代表就是笑，也有可能是哭和惊讶等。所用到的识别特征主要有：灰度特征、运动特征和频率特征三种。灰度特征是从表情图像的灰度值上来处理，利用不同表情有不同灰度值来得到识别的依据；运动特征利用了不同表情情况下人脸的主要表情点的运动信息来进行识别；频域特征主要是利用了表情图像在不同的频率分解下的差别，速度快是其显著特点。


    通常根据视频识别要比根据静态图像识别更准确，视频能捕捉某种表情形成过程的面部动作。当人通过视觉器官把他人面部的刺激信号接收并传递到人的大脑之中，大脑就会进行人脸检测、人脸图像预处理、人脸特征提取等程序，然后，把以前存储在大脑中的若干基本表情的人脸特征（即脸谱）提取出来，进行对比分析和模糊判断，找出两者的人脸特征最接近的某种基本表情。这时，大脑皮层就会接通该基本表情所对应的兴奋区与边缘系统的神经联系，从而产生愉快或痛苦的情感体验。同时，大脑皮层还会接通该基本表情所对应的兴奋区与网状结构的神经联系，从而确定愉快或痛苦的强度。


    ## 语音情感识别


    在人类的交互过程中，语音是人们最直接的交流通道，人们通过语音能够明显地感受到对方的情绪变化，例如通过特殊的语气词、语调发生变化等等。在人们通电话时，虽然彼此看不到，但能从语气中感觉到对方的情绪变化。例如同样一句话“你真行”，在运用不同语气时，可以使之成为一句赞赏的话，也可以使之成为讽刺或劝忌的话。目前，国际上对情感语音的研究主要侧重于情感的声学特征分析这一方面。一般来说，语音中的情感特征往往通过语音韵律的变化表现出来。例如，当一个人发怒的时候，讲话的速率会变快，音量会变大，音调会变高等，同时一些音素特征（共振峰、声道截面函数等）也能反映情感的变化。语音情感识别是指由计算机自动识别输入语音的情感状态。不同语言声调表情的信号在其时间构造、振幅构造、基频构造和共振峰构造等特征方面也有着不同的构造特点和分布规律。只要把各种具体模式的语言声调表情在时间构造、振幅构造、基频构造和共振峰构造等方面的特点和分布规律进行测算和分析，并以此为基础或模板，就可以识别出所有语言声调中所隐含的情感内容。中国科学院自动化研究所模式识别国家重点实验室的专家们针对语言中的焦点现象，首先提出了情感焦点生成模型。这为语音合成中情感状态的自动预测提供了依据，结合高质量的声学模型，使得情感语音合成和识别率先达到了实际应用水平。


    语音中的情感特征化比面部表情的情感特征化要难。面部表情信号传达了个人特征和表情，一般不传达语言信息。另一方面，语音信号包含的是混合信息，包括说话者特征、情感和说话内容中强调的词汇和语法。计算机在语音情感的识别和合成方面的进展很慢。随着计算机多媒体技术的不断发展，能处理包含在媒体中的情感信息的拟人化的多媒体计算机系统的研究越来越引起人们的兴趣。因为语音信号既是多媒体人机交互的主要利用方式，又是传载情感信息的重要媒体，所以对于包含在语音信号中的情感信息进行计算机处理研究就显得尤为重要。当人通过听觉器官把他人的语言声调信号接收并传递到人的大脑之中，大脑就会对其时间构造、振幅构造、基频构造和共振峰构造等方面的特点和分布规律进行检测、预处理和特征提取，然后，把以前存储在大脑中的若干基本表情的语言声调信号的时间构造、振幅构造、基频构造和共振峰构造等特征方面的构造特点和分布规律提取出来，进行对比分析和模糊判断，找出两者声音特征最接近的某种基本表情。


    - 肢体语言识别


    人的姿态一般伴随着交互过程而发生变化，这种变化表达了一些信息。例如手势的加强通常反映一种强调的心态，身体某一部位不停地摆动，则通常具有情绪紧张的倾向。相对于语音和人脸表情变化来说，姿态变化的规律性较难获取，但由于人的姿态变化会使表述更加生动，因而人们依然对其表示强烈的关注。科学家针对肢体运动专门设计了一系列运动和身体信息捕获设备，例如运动捕获仪、数据手套、智能座椅等；国外一些著名的大学和跨国公司，例如麻省理工学院、IBM
    等则在这些设备的基础上构筑了智能空间；同时也有人将智能座椅应用于汽车的驾座上，用于动态监测驾驶人员的情绪状态，并提出适时警告。


    - 语言文字识别


    语言和文字属于第二信号系统，由于它们脱离了现实事物对于人的条件反射活动的直接参与，从而可以更为广泛地、普遍地、直接地、快速地、灵活地、多样地、深入地对各种事物进行认识，从而可以使人类能够对更为抽象、更为本质、更为遥远、更为间接、更为广泛、更为模糊、更为变化莫测的事物的价值关系进行认识和反应。


    当人通过听觉器官把他人的语言信号接收并传递到人脑中，或者通过视觉器官把文字信号接收并传递到人脑中，大脑就会对其进行语义分析，对它们所描述事物的价值关系的目标指向、变化方式、变化时态、对方的利益相关性等进行判断，从而确定和选择情感表达的某种基本模式。


    - 生理模式识别


    从生理信号中抽取出来的特征模式可以用来识别情感。计算机在人做出表情（如悲痛或愤怒）的时候，观察多种收集到的信号，然后分析哪种生理信号模式和特定情感状态关系最密切。然后计算机系统应用先前分析的结果，根据收集到的原始数据来识别出包含在信号中最有可能的情感。这方面的研究才刚刚开始。通常通过观察所有数据的子集能判断出哪种特征值的辨别能力最强。试过所有可能的三种情感、两种特征值的组合，发现愤怒、悲痛和尊敬的组合或愤怒、高兴和尊敬的组合中，情感是最容易识别出的。这两种情况中，都有一个最佳的识别特征值，即
    EMG 信号的平均值，但是另一个最佳特征值却是不同的。愤怒、悲痛和尊敬的组合中，标准化信号的第一次差分绝对值的平均值就是最佳的；而对愤怒、高兴和尊敬的组合中，最佳选择还是第一次差分绝对值的平均值，但这次是从
    EMG 信号中得到的。


    ### 1.2.2.3 情感信号的融合算法研究


    某一情感的变化对应于多种生理或行为的变化，不能从单一生理或行为的变化引出相应的情感的变化，因此，情感的判定是融合各种生理或行为的过程，应该研究有关情感计算的信息融合理论与技术。


    信息融合又称数据融合，也可以称为传感器信息融合或多传感器信息融合，是一个对从单个和多个信息源获取的数据和信息进行关联、相关和综合，以获得精确的位置和身份估计，以及对态势和威胁及其重要程度进行全面及时评估的信息处理过程；该过程是对其估计、评估和额外信息源需求评价的一个持续精练（Refinement）过程，同时也是信息处理过程不断自我修正的一个过程，以获得结果的改善。


    信息融合技术可概括为：利用计算机技术对按时序获得的若干传感器的观测信息在一定准则下加以自动分析、综合处理，以完成所需的决策和估计任务而进行的信息处理过程。按照这一定义，多传感器系统是信息融合的硬件基础，多源信息是信息融合的加工对象，协调优化和综合处理是信息融合的核心。也可以认为，信息融合或数据融合技术是利用计算机技术对来自多传感器（同类或者不同类）探测的多源信息，按一定规则进行自动分析和综合后，自动生成人们所期望的合成信息的信息处理技术。它对多类型、多源、多平台传感器所获得的各种情报信息（如数据、照片、视频图像等信息）进行采集、传输、汇集、分析、过滤、综合、相关及合成，快速进行情报处理和自动图形标绘。


    ## 1.3 情感计算的理论观点


    心理学领域有关情感体验的理论观点主要有两类：范畴观和维度观。


    持范畴观的学者将情绪或情感分成独立的范畴，这些相互离散的情绪范畴在外部表现、生理唤醒模式上都存在一定的差异[2]。对于情感计算研究，基于范畴观来描述和测量情感的优势主要有两点。首先，用情绪范畴描述情绪和情感符合人们的直觉和常识，有利于情感计算的成果在现实生活中的推广和应用。其次，基于情绪范畴来进行情感计算，有利于智能系统中识别情绪后，进一步推理与之相联系的特定心理功能和可能的原因，然后做出适当的响应。但范畴观也给情感计算研究带来了制约和问题。首先，哪些情绪范畴对于情感计算来说是必要的，目前研究者对此并没有统一的认识。其次，情绪范畴是对情绪的定性描述，无法用量化的数字表达主观的情绪体验。


    维度观则认为情感具有基本维度和两极性。例如，近代科学心理学之父威廉·冯特提出的三维说，认为情绪情感有三个维度组成，每个维度的变化幅度都存在两种相互独立的状态。Osgood发现，情绪体验可以从评价、力度、活跃性三个方面来进行评价[3]。Mehrabian
    和 Russell 基于 Osgood 的思路，提出了 PAD 情绪模型，此模型不但给出了对情感空间进行描述的理论构想，同时采用量化的方法试图建立情感空间中各种情绪范畴的定位和关系，因此被广泛地应用在情绪心理学、人格心理学、社会心理学等基础领域，以及市场营销、产品满意度等应用领域[4]。基于维度的趋向为情感计算提供了量化的理论和方法基础，但是，究竟需要多少维度才足以充分地表达人类的情感及哪些维度是必要的，这仍是一个难题。


    ## 1.4 情感计算的认知困境


    情感计算一经提出，迅速受到学术界的关注和企业界的迅速反应。英国电信公司（British Telecom）和 IBM 已成立了专门的情感计算研究小组，学术界如美国麻省理工学院的媒体实验室、剑桥大学、中国科学院等也在进行情感计算方面的研究。虽然情感计算的研究如火如荼地进行着，并且也取得了很大的成果，但对于情感计算的一些基本问题在认识上仍然存在分歧[6]。


    ### 1.4.1 情感计算可能性


    情感可不可以计算实际上是一个哲学终极问题，这个问题衍生出如下问题：情感能计算吗？如果能计算，应该如何计算？计算的方法可行、可靠吗？对此明显分为两种截然相反的观点：


    一种是对情感计算的怀疑与否定，认为情感计算是不可能的和没必要的，主要体现在：


    - 1) 认为情感计算在理论上是不可能的。情绪是人类本身专有的，一旦它脱离人就不存在了或者说变成假的了，一台机器不可能会自发地产生那些根本不属于它的特性；情感是不能制造的，模拟永远是不真实的，机器是永远不会产生像人与人相互交流时的那种情感。神经科学家达马西奥研究一批大脑受损的病人，他们尽管在数学和语言能力上没有任何缺陷，但他们的日常生活能力却大受影响。因此，长于数学和语言能力的机器难以处理情感。


    - 2) 认为情感计算在研究方向与方法是不可行的。情绪表达在模式与方法上是非常广泛的，而对这些是不可能进行准确把握的，如大脑活动、血液化学、神经传递物质等，因此在收集必要的数据方面变得不太可能或者不可行。并且，情绪比较随意和时常变化，要从一些数据准确地识别个体的情感状态也是办不到的。另一方面，要对情感进行计算，那么就必须要建立情感认知模型，但是要建立精细、多模态以及适合个体习惯的情感模型是非常困难的，至少在以后相当长的时间内是不可能的。


    但以 R.W Picard 为代表的计算机学家们却认为机器具有情感是可能的，在方法上也是可行的。他们认为情感并非如心理学家所认为的那样仅仅是人的内心体验状态，而是可以通过人生理、表情、语言等体现出来，可以通过一定的技术进行测量与处理。虽然人的情感表现具有一定的差异性，但是通过他们使用的可穿戴计算机的实验却发现情感识别能够达到
    80%左右的准确性。另一方面他们认为建立在实验基础上的情感建模也取得了不少进步，很多实验室与研究所根据自己的研究都建立了比较有价值的情感模型，如美国麻省理工学院媒体实验室首先给出了一个隐马尔可夫模型、日本早稻田大学建立了
    WE-3RV 的 3D 情感空间模型、计算机学家 Sumedha Kshirsagar 等建立的多层情绪—心情—性格模型等。


    ### 1.4.2 情感计算的理论基础


    无论是情感计算的开创者 R.W Picard，还是后来的计算机学家对情感的计算处理，他们的理论是建立在心理学基础之上的。心理学把情感分为快乐、焦虑、悲伤、愤怒和厌恶，其它情感都是由此派生出来的：把情感的表现局限于心理感受强度、表情特征和生理指标。当前建立起来的情感模型主要考虑的也是这五种基本情感（见前面所述的情感模型），建模方法大都是基于维度论的方法，通过测量生理特征和行为特征（如面部表情、语音等）来推测情感状态，但是这样的模型总存在着这样或者那样的不足；同时，对于同一类型情感，无论是情感感受强度，还是情感表达强度和情感生理唤醒，都可以采用不同的生理指标进行计算和测量，究竟应该选用哪一个生理指标？对于同一类型情感采用同一个生理指标进行测量和计算时，由于受到许多环境因素以及人体其它生理因素和精神因素的影响，其测量值的差异性和波动性如何消除？因此，一些人认为把情感计算的理论基础建立在心理学之上是不妥的，而应该把它的理论基础建立在“统一价值论”之上。统一价值论认为任何主观意识都不是无中生有的，也不是孤立存在的，都是对某一客观存在的反映，总会有某一客观存在与之相对应；情感作为一种特殊的主观心理活动，反映了一种特殊的客观存在——人与事物之间的价值关系，情感与价值的关系在本质上就是主观与客观的关系。因此，统一价值论把情感诠释为“人脑对事物的价值关系的一种主观反映”，以数学形式对情感进行精确定义，建立情感和价值观的数学分析模型，实现了情感的合并运算和合成运算，根据价值的不同变化特征对情感进行分类，从而将“情感计算”转化为“价值计算”。


    ### 1.4.3 情感计算技术的两面性


    人工智能与计算机领域对此持乐观的态度，为我们展现了在不久的将来机器具有情感的广阔前景。中国科学院心理研究所傅小兰研究员认为“情感计算研究将为人类提供更加人性化、情感化的服务和产品，创造更加美好的生活”，清华大学计算机系张迎辉等相信“情感计算的发展必将极大地改变人们的生活，自然和谐的人机交互的梦想会离我们越来越近”，情感计算将在如下几个方面产生深刻影响：


    - 对人类的情感进行识别和响应，帮助人们理解自己和他人的情感世界。

    - 在远程教育平台中，进一步优化计算机辅助学习的功能。

    - 推进可穿戴的计算机系统的发展，以及智能、便携式个人身体保健与监护系统的开发。

    - 帮助我们增加使用设备的安全性和增加自动感知人们的情绪状态的功能，可以在娱乐、游戏等方面提供更好的服务。


    但是在社会与伦理领域的人士看来，如果机器具有像人一样的情感，将会对人类以及人类社会带来巨大的影响。首先，人与人之间的两维关系将被彻底打破，如何处理人与机器的感情问题，这将会产生一系列的伦理道德问题。其次，社会结构与秩序将会重组，人与机器在社会关系中的角色如何维持与平衡。因此他们认为机器具有了情感带给人类的不仅仅是福音，还带来麻烦与问题，并且麻烦与问题多于好处。


    ## 2 技术篇


    情感计算是一个多学科交叉的崭新的研究领域，它涵盖了传感器技术、计算机科学、认知科学、心理学、行为学、生理学、哲学、社会学等方面。情感计算的最终目标是赋予计算机类似于人的情感能力。要达到这个目标，许多技术问题有待解决。这些技术问题的突破对各学科的发展都产生巨大的推动作用。本篇分别从情感计算的传统研究方法和新兴研究方法对技术发展进行了探讨。此外，本篇对情感计算方向较有代表性的获奖论文进行了归纳整理，更加清晰地展示了目前该领域的研究成果。


    ### 2.1 传统的研究


    传统的情感计算方法是按照不同的情感表现形式分类的，分别是：文本情感分析、语音情感分析、视觉情感分析。以下对三种传统的分析方法进行详细介绍。


    ### 2.1.1 文本情感计算


    20世纪90年代末，国外的文本情感分析已经开始。早期，Riloff和Shepherd在文本数据的基础上进行了构建语义词典的相关研究。McKeown发现连词对大规模的文本数据集中形容词的语义表达的制约作用，进而对英文的形容词与连词做情感倾向研究。自此之后，越来越多的研究开始考虑特征词与情感词的关联关系。Turney等使用点互信息的方法扩展了正负面情感词典，在分析文本情感时使用了极性语义算法，处理通用的语料数据时准确率达到了74%。在近些年的研究中，Narayanan等结合各种特征及其相关联信息，提出了基于分句、整句、结果句的分类方案，获得了很好的效果。Pang等以积极情感和消极情感为维度，对电影评论进行了情感分类。他分别采用了支持向量机、最大熵、朴素贝叶斯算法进行分类实验，发现支持向量机的精确度达到了80%。随着研究的不断深入，学者在对情感分析算法进行改进的同时，也将其应用到不同的行业中进行了实践。


    文本情感计算的过程可以由 3 部分组成：文本信息采集、情感特征提取和情感信息分类。文本信息采集模块通过文本抓取工具（如网页爬虫工具）获得情感评论文本，并传递到下一个情感特征提取模块，然后对文本中自然语言文本转化成计算机能够识别和处理的形式，并通过情感信息分类模块得到计算结果。文本情感计算侧重研究情感状态与文本信息之间的对应关系，提供人类情感状态的线索。具体地，需要找到计算机能提取出来的特征，并采用能用于情感分类的模型。因此，关于文本情感计算过程的讨论，主要集中在文本情感特征标注（信息采集）、情感特征提取和情感信息分类这三个方面[7]。


    ### 文本情感特征标注


    情感特征标注是对情感语义特征进行标注，通常是将词或者语义块作为特征项。情感特征标注首先对情感语义特征的属性进行设计，如褒义词、贬义词、加强语气、一般语气、悲伤、高兴等等；然后通过机器自动标注或者人工标注的方法对情感语义特征进行标注，形成情感特征集合。情感词典是典型的情感特征集合，也是情感计算的基础。在大多数研究中，有关情感计算的研究通常是将情感词典直接引入自定义词典中。


    运用情感词典计算出文本情感值是一种简单迅速的方法，但准确率有待提高。在实际的情感计算中，会因为具体的语言应用环境而有所不同。例如，“轻薄”一词通常认为是否定词，但是在电脑、手机却被视为肯定词汇。同时，文本中常会出现否定前置、双重否定以及文本口语化和表情使用等，这些都将会对文本情感特征的提取和判断产生较大的影响。因此在进行文本情感提取时，需要对文本及其对应的上下文关系、环境关系等进行分析。


    ### 情感特征提取


    文本包含的情感信息是错综复杂的，在赋予计算机以识别文本情感能力的研究中，从文本信号中抽取特征模式至关重要。在对文本预处理后，初始提取情感语义特征项。特征提取的基本思想是根据得到的文本数据，决定哪些特征能够给出最好的情感辨识。通常算法是对已有的情绪特征词打分，接着以得分高低为序，超过一定阈值的特征组成特征子集。特征词集的质量直接影响最后结果，为了提高计算的准确性，文本的特征提取算法研究将继续受到关注。长远看来，自动生成文本特征技术将进一步提高，特征提取的研究重点也更多地从对词频的特征分析转移到文本结构和情感词上。


    ### 情感信息分类


    文本情感分类技术中，主要采用两种技术路线：基于规则的方法和基于统计的方法。在 20 世纪 80 年代，基于规则的方法占据主流位置，通过语言学家的语言经验和知识获取句法规则，以此作为文本分类依据。但是，获取规则的过程复杂且成本巨大，也对系统的性能有负面影响，且很难找到有效的途径来提高开发规则的效率。20
    世纪 90 年代之后，人们更倾向于使用统计的方法，通过训练样本进行特征选择和参数训练，根据选择的特征对待分类的输入样本进行形式化，然后输入到分类器进行类别判定，最终得到输入样本的类别。


    下表整理了 10 个文本情感分析 API，供读者参考：

    '
  mdcn: '

    纹理和较细致的图形变换算法，达到生动的情感表达效果。在此基础上，不同的算法形成了不同水平的应用系统。


    随着人脸的计算机处理技术（包括人脸检测和人脸识别）不断完善，利用计算机进行面部表情分析也就成为可能。由于各种面部表情本身体现在各个特征点运动上的差别并不是很大，而表情分析对于人脸的表情特征提取的准确性和有效性要求比较高，因而难以顺利地实现。具体的表情识别方法主要有三个：一是整体识别法和局部识别法，二是形变提取法和运动提取法，三是几何特征法和容貌特征法。当然，这三个发展方向不是严格独立的，恰恰相反，它们是相互联系和影响的，它们从不同侧面提取所需要的表情特征，都只是提供了一种分析表情的思路。例如：嘴巴张开并不代表就是笑，也有可能是哭和惊讶等。所用到的识别特征主要有：灰度特征、运动特征和频率特征三种。灰度特征是从表情图像的灰度值上来处理，利用不同表情有不同灰度值来得到识别的依据；运动特征利用了不同表情情况下人脸的主要表情点的运动信息来进行识别；频域特征主要是利用了表情图像在不同的频率分解下的差别，速度快是其显著特点。


    通常根据视频识别要比根据静态图像识别更准确，视频能捕捉某种表情形成过程的面部动作。当人通过视觉器官把他人面部的刺激信号接收并传递到人的大脑之中，大脑就会进行人脸检测、人脸图像预处理、人脸特征提取等程序，然后，把以前存储在大脑中的若干基本表情的人脸特征（即脸谱）提取出来，进行对比分析和模糊判断，找出两者的人脸特征最接近的某种基本表情。这时，大脑皮层就会接通该基本表情所对应的兴奋区与边缘系统的神经联系，从而产生愉快或痛苦的情感体验。同时，大脑皮层还会接通该基本表情所对应的兴奋区与网状结构的神经联系，从而确定愉快或痛苦的强度。


    ## 语音情感识别


    在人类的交互过程中，语音是人们最直接的交流通道，人们通过语音能够明显地感受到对方的情绪变化，例如通过特殊的语气词、语调发生变化等等。在人们通电话时，虽然彼此看不到，但能从语气中感觉到对方的情绪变化。例如同样一句话“你真行”，在运用不同语气时，可以使之成为一句赞赏的话，也可以使之成为讽刺或劝忌的话。目前，国际上对情感语音的研究主要侧重于情感的声学特征分析这一方面。一般来说，语音中的情感特征往往通过语音韵律的变化表现出来。例如，当一个人发怒的时候，讲话的速率会变快，音量会变大，音调会变高等，同时一些音素特征（共振峰、声道截面函数等）也能反映情感的变化。语音情感识别是指由计算机自动识别输入语音的情感状态。不同语言声调表情的信号在其时间构造、振幅构造、基频构造和共振峰构造等特征方面也有着不同的构造特点和分布规律。只要把各种具体模式的语言声调表情在时间构造、振幅构造、基频构造和共振峰构造等方面的特点和分布规律进行测算和分析，并以此为基础或模板，就可以识别出所有语言声调中所隐含的情感内容。中国科学院自动化研究所模式识别国家重点实验室的专家们针对语言中的焦点现象，首先提出了情感焦点生成模型。这为语音合成中情感状态的自动预测提供了依据，结合高质量的声学模型，使得情感语音合成和识别率先达到了实际应用水平。


    语音中的情感特征化比面部表情的情感特征化要难。面部表情信号传达了个人特征和表情，一般不传达语言信息。另一方面，语音信号包含的是混合信息，包括说话者特征、情感和说话内容中强调的词汇和语法。计算机在语音情感的识别和合成方面的进展很慢。随着计算机多媒体技术的不断发展，能处理包含在媒体中的情感信息的拟人化的多媒体计算机系统的研究越来越引起人们的兴趣。因为语音信号既是多媒体人机交互的主要利用方式，又是传载情感信息的重要媒体，所以对于包含在语音信号中的情感信息进行计算机处理研究就显得尤为重要。当人通过听觉器官把他人的语言声调信号接收并传递到人的大脑之中，大脑就会对其时间构造、振幅构造、基频构造和共振峰构造等方面的特点和分布规律进行检测、预处理和特征提取，然后，把以前存储在大脑中的若干基本表情的语言声调信号的时间构造、振幅构造、基频构造和共振峰构造等特征方面的构造特点和分布规律提取出来，进行对比分析和模糊判断，找出两者声音特征最接近的某种基本表情。


    - 肢体语言识别


    人的姿态一般伴随着交互过程而发生变化，这种变化表达了一些信息。例如手势的加强通常反映一种强调的心态，身体某一部位不停地摆动，则通常具有情绪紧张的倾向。相对于语音和人脸表情变化来说，姿态变化的规律性较难获取，但由于人的姿态变化会使表述更加生动，因而人们依然对其表示强烈的关注。科学家针对肢体运动专门设计了一系列运动和身体信息捕获设备，例如运动捕获仪、数据手套、智能座椅等；国外一些著名的大学和跨国公司，例如麻省理工学院、IBM
    等则在这些设备的基础上构筑了智能空间；同时也有人将智能座椅应用于汽车的驾座上，用于动态监测驾驶人员的情绪状态，并提出适时警告。


    - 语言文字识别


    语言和文字属于第二信号系统，由于它们脱离了现实事物对于人的条件反射活动的直接参与，从而可以更为广泛地、普遍地、直接地、快速地、灵活地、多样地、深入地对各种事物进行认识，从而可以使人类能够对更为抽象、更为本质、更为遥远、更为间接、更为广泛、更为模糊、更为变化莫测的事物的价值关系进行认识和反应。


    当人通过听觉器官把他人的语言信号接收并传递到人脑中，或者通过视觉器官把文字信号接收并传递到人脑中，大脑就会对其进行语义分析，对它们所描述事物的价值关系的目标指向、变化方式、变化时态、对方的利益相关性等进行判断，从而确定和选择情感表达的某种基本模式。


    - 生理模式识别


    从生理信号中抽取出来的特征模式可以用来识别情感。计算机在人做出表情（如悲痛或愤怒）的时候，观察多种收集到的信号，然后分析哪种生理信号模式和特定情感状态关系最密切。然后计算机系统应用先前分析的结果，根据收集到的原始数据来识别出包含在信号中最有可能的情感。这方面的研究才刚刚开始。通常通过观察所有数据的子集能判断出哪种特征值的辨别能力最强。试过所有可能的三种情感、两种特征值的组合，发现愤怒、悲痛和尊敬的组合或愤怒、高兴和尊敬的组合中，情感是最容易识别出的。这两种情况中，都有一个最佳的识别特征值，即
    EMG 信号的平均值，但是另一个最佳特征值却是不同的。愤怒、悲痛和尊敬的组合中，标准化信号的第一次差分绝对值的平均值就是最佳的；而对愤怒、高兴和尊敬的组合中，最佳选择还是第一次差分绝对值的平均值，但这次是从
    EMG 信号中得到的。


    ### 1.2.2.3 情感信号的融合算法研究


    某一情感的变化对应于多种生理或行为的变化，不能从单一生理或行为的变化引出相应的情感的变化，因此，情感的判定是融合各种生理或行为的过程，应该研究有关情感计算的信息融合理论与技术。


    信息融合又称数据融合，也可以称为传感器信息融合或多传感器信息融合，是一个对从单个和多个信息源获取的数据和信息进行关联、相关和综合，以获得精确的位置和身份估计，以及对态势和威胁及其重要程度进行全面及时评估的信息处理过程；该过程是对其估计、评估和额外信息源需求评价的一个持续精练（Refinement）过程，同时也是信息处理过程不断自我修正的一个过程，以获得结果的改善。


    信息融合技术可概括为：利用计算机技术对按时序获得的若干传感器的观测信息在一定准则下加以自动分析、综合处理，以完成所需的决策和估计任务而进行的信息处理过程。按照这一定义，多传感器系统是信息融合的硬件基础，多源信息是信息融合的加工对象，协调优化和综合处理是信息融合的核心。也可以认为，信息融合或数据融合技术是利用计算机技术对来自多传感器（同类或者不同类）探测的多源信息，按一定规则进行自动分析和综合后，自动生成人们所期望的合成信息的信息处理技术。它对多类型、多源、多平台传感器所获得的各种情报信息（如数据、照片、视频图像等信息）进行采集、传输、汇集、分析、过滤、综合、相关及合成，快速进行情报处理和自动图形标绘。


    ## 1.3 情感计算的理论观点


    心理学领域有关情感体验的理论观点主要有两类：范畴观和维度观。


    持范畴观的学者将情绪或情感分成独立的范畴，这些相互离散的情绪范畴在外部表现、生理唤醒模式上都存在一定的差异[2]。对于情感计算研究，基于范畴观来描述和测量情感的优势主要有两点。首先，用情绪范畴描述情绪和情感符合人们的直觉和常识，有利于情感计算的成果在现实生活中的推广和应用。其次，基于情绪范畴来进行情感计算，有利于智能系统中识别情绪后，进一步推理与之相联系的特定心理功能和可能的原因，然后做出适当的响应。但范畴观也给情感计算研究带来了制约和问题。首先，哪些情绪范畴对于情感计算来说是必要的，目前研究者对此并没有统一的认识。其次，情绪范畴是对情绪的定性描述，无法用量化的数字表达主观的情绪体验。


    维度观则认为情感具有基本维度和两极性。例如，近代科学心理学之父威廉·冯特提出的三维说，认为情绪情感有三个维度组成，每个维度的变化幅度都存在两种相互独立的状态。Osgood发现，情绪体验可以从评价、力度、活跃性三个方面来进行评价[3]。Mehrabian
    和 Russell 基于 Osgood 的思路，提出了 PAD 情绪模型，此模型不但给出了对情感空间进行描述的理论构想，同时采用量化的方法试图建立情感空间中各种情绪范畴的定位和关系，因此被广泛地应用在情绪心理学、人格心理学、社会心理学等基础领域，以及市场营销、产品满意度等应用领域[4]。基于维度的趋向为情感计算提供了量化的理论和方法基础，但是，究竟需要多少维度才足以充分地表达人类的情感及哪些维度是必要的，这仍是一个难题。


    ## 1.4 情感计算的认知困境


    情感计算一经提出，迅速受到学术界的关注和企业界的迅速反应。英国电信公司（British Telecom）和 IBM 已成立了专门的情感计算研究小组，学术界如美国麻省理工学院的媒体实验室、剑桥大学、中国科学院等也在进行情感计算方面的研究。虽然情感计算的研究如火如荼地进行着，并且也取得了很大的成果，但对于情感计算的一些基本问题在认识上仍然存在分歧[6]。


    ### 1.4.1 情感计算可能性


    情感可不可以计算实际上是一个哲学终极问题，这个问题衍生出如下问题：情感能计算吗？如果能计算，应该如何计算？计算的方法可行、可靠吗？对此明显分为两种截然相反的观点：


    一种是对情感计算的怀疑与否定，认为情感计算是不可能的和没必要的，主要体现在：


    - 1) 认为情感计算在理论上是不可能的。情绪是人类本身专有的，一旦它脱离人就不存在了或者说变成假的了，一台机器不可能会自发地产生那些根本不属于它的特性；情感是不能制造的，模拟永远是不真实的，机器是永远不会产生像人与人相互交流时的那种情感。神经科学家达马西奥研究一批大脑受损的病人，他们尽管在数学和语言能力上没有任何缺陷，但他们的日常生活能力却大受影响。因此，长于数学和语言能力的机器难以处理情感。


    - 2) 认为情感计算在研究方向与方法是不可行的。情绪表达在模式与方法上是非常广泛的，而对这些是不可能进行准确把握的，如大脑活动、血液化学、神经传递物质等，因此在收集必要的数据方面变得不太可能或者不可行。并且，情绪比较随意和时常变化，要从一些数据准确地识别个体的情感状态也是办不到的。另一方面，要对情感进行计算，那么就必须要建立情感认知模型，但是要建立精细、多模态以及适合个体习惯的情感模型是非常困难的，至少在以后相当长的时间内是不可能的。


    但以 R.W Picard 为代表的计算机学家们却认为机器具有情感是可能的，在方法上也是可行的。他们认为情感并非如心理学家所认为的那样仅仅是人的内心体验状态，而是可以通过人生理、表情、语言等体现出来，可以通过一定的技术进行测量与处理。虽然人的情感表现具有一定的差异性，但是通过他们使用的可穿戴计算机的实验却发现情感识别能够达到
    80%左右的准确性。另一方面他们认为建立在实验基础上的情感建模也取得了不少进步，很多实验室与研究所根据自己的研究都建立了比较有价值的情感模型，如美国麻省理工学院媒体实验室首先给出了一个隐马尔可夫模型、日本早稻田大学建立了
    WE-3RV 的 3D 情感空间模型、计算机学家 Sumedha Kshirsagar 等建立的多层情绪—心情—性格模型等。


    ### 1.4.2 情感计算的理论基础


    无论是情感计算的开创者 R.W Picard，还是后来的计算机学家对情感的计算处理，他们的理论是建立在心理学基础之上的。心理学把情感分为快乐、焦虑、悲伤、愤怒和厌恶，其它情感都是由此派生出来的：把情感的表现局限于心理感受强度、表情特征和生理指标。当前建立起来的情感模型主要考虑的也是这五种基本情感（见前面所述的情感模型），建模方法大都是基于维度论的方法，通过测量生理特征和行为特征（如面部表情、语音等）来推测情感状态，但是这样的模型总存在着这样或者那样的不足；同时，对于同一类型情感，无论是情感感受强度，还是情感表达强度和情感生理唤醒，都可以采用不同的生理指标进行计算和测量，究竟应该选用哪一个生理指标？对于同一类型情感采用同一个生理指标进行测量和计算时，由于受到许多环境因素以及人体其它生理因素和精神因素的影响，其测量值的差异性和波动性如何消除？因此，一些人认为把情感计算的理论基础建立在心理学之上是不妥的，而应该把它的理论基础建立在“统一价值论”之上。统一价值论认为任何主观意识都不是无中生有的，也不是孤立存在的，都是对某一客观存在的反映，总会有某一客观存在与之相对应；情感作为一种特殊的主观心理活动，反映了一种特殊的客观存在——人与事物之间的价值关系，情感与价值的关系在本质上就是主观与客观的关系。因此，统一价值论把情感诠释为“人脑对事物的价值关系的一种主观反映”，以数学形式对情感进行精确定义，建立情感和价值观的数学分析模型，实现了情感的合并运算和合成运算，根据价值的不同变化特征对情感进行分类，从而将“情感计算”转化为“价值计算”。


    ### 1.4.3 情感计算技术的两面性


    人工智能与计算机领域对此持乐观的态度，为我们展现了在不久的将来机器具有情感的广阔前景。中国科学院心理研究所傅小兰研究员认为“情感计算研究将为人类提供更加人性化、情感化的服务和产品，创造更加美好的生活”，清华大学计算机系张迎辉等相信“情感计算的发展必将极大地改变人们的生活，自然和谐的人机交互的梦想会离我们越来越近”，情感计算将在如下几个方面产生深刻影响：


    - 对人类的情感进行识别和响应，帮助人们理解自己和他人的情感世界。

    - 在远程教育平台中，进一步优化计算机辅助学习的功能。

    - 推进可穿戴的计算机系统的发展，以及智能、便携式个人身体保健与监护系统的开发。

    - 帮助我们增加使用设备的安全性和增加自动感知人们的情绪状态的功能，可以在娱乐、游戏等方面提供更好的服务。


    但是在社会与伦理领域的人士看来，如果机器具有像人一样的情感，将会对人类以及人类社会带来巨大的影响。首先，人与人之间的两维关系将被彻底打破，如何处理人与机器的感情问题，这将会产生一系列的伦理道德问题。其次，社会结构与秩序将会重组，人与机器在社会关系中的角色如何维持与平衡。因此他们认为机器具有了情感带给人类的不仅仅是福音，还带来麻烦与问题，并且麻烦与问题多于好处。


    ## 2 技术篇


    情感计算是一个多学科交叉的崭新的研究领域，它涵盖了传感器技术、计算机科学、认知科学、心理学、行为学、生理学、哲学、社会学等方面。情感计算的最终目标是赋予计算机类似于人的情感能力。要达到这个目标，许多技术问题有待解决。这些技术问题的突破对各学科的发展都产生巨大的推动作用。本篇分别从情感计算的传统研究方法和新兴研究方法对技术发展进行了探讨。此外，本篇对情感计算方向较有代表性的获奖论文进行了归纳整理，更加清晰地展示了目前该领域的研究成果。


    ### 2.1 传统的研究


    传统的情感计算方法是按照不同的情感表现形式分类的，分别是：文本情感分析、语音情感分析、视觉情感分析。以下对三种传统的分析方法进行详细介绍。


    ### 2.1.1 文本情感计算


    20世纪90年代末，国外的文本情感分析已经开始。早期，Riloff和Shepherd在文本数据的基础上进行了构建语义词典的相关研究。McKeown发现连词对大规模的文本数据集中形容词的语义表达的制约作用，进而对英文的形容词与连词做情感倾向研究。自此之后，越来越多的研究开始考虑特征词与情感词的关联关系。Turney等使用点互信息的方法扩展了正负面情感词典，在分析文本情感时使用了极性语义算法，处理通用的语料数据时准确率达到了74%。在近些年的研究中，Narayanan等结合各种特征及其相关联信息，提出了基于分句、整句、结果句的分类方案，获得了很好的效果。Pang等以积极情感和消极情感为维度，对电影评论进行了情感分类。他分别采用了支持向量机、最大熵、朴素贝叶斯算法进行分类实验，发现支持向量机的精确度达到了80%。随着研究的不断深入，学者在对情感分析算法进行改进的同时，也将其应用到不同的行业中进行了实践。


    文本情感计算的过程可以由 3 部分组成：文本信息采集、情感特征提取和情感信息分类。文本信息采集模块通过文本抓取工具（如网页爬虫工具）获得情感评论文本，并传递到下一个情感特征提取模块，然后对文本中自然语言文本转化成计算机能够识别和处理的形式，并通过情感信息分类模块得到计算结果。文本情感计算侧重研究情感状态与文本信息之间的对应关系，提供人类情感状态的线索。具体地，需要找到计算机能提取出来的特征，并采用能用于情感分类的模型。因此，关于文本情感计算过程的讨论，主要集中在文本情感特征标注（信息采集）、情感特征提取和情感信息分类这三个方面[7]。


    ### 文本情感特征标注


    情感特征标注是对情感语义特征进行标注，通常是将词或者语义块作为特征项。情感特征标注首先对情感语义特征的属性进行设计，如褒义词、贬义词、加强语气、一般语气、悲伤、高兴等等；然后通过机器自动标注或者人工标注的方法对情感语义特征进行标注，形成情感特征集合。情感词典是典型的情感特征集合，也是情感计算的基础。在大多数研究中，有关情感计算的研究通常是将情感词典直接引入自定义词典中。


    运用情感词典计算出文本情感值是一种简单迅速的方法，但准确率有待提高。在实际的情感计算中，会因为具体的语言应用环境而有所不同。例如，“轻薄”一词通常认为是否定词，但是在电脑、手机却被视为肯定词汇。同时，文本中常会出现否定前置、双重否定以及文本口语化和表情使用等，这些都将会对文本情感特征的提取和判断产生较大的影响。因此在进行文本情感提取时，需要对文本及其对应的上下文关系、环境关系等进行分析。


    ### 情感特征提取


    文本包含的情感信息是错综复杂的，在赋予计算机以识别文本情感能力的研究中，从文本信号中抽取特征模式至关重要。在对文本预处理后，初始提取情感语义特征项。特征提取的基本思想是根据得到的文本数据，决定哪些特征能够给出最好的情感辨识。通常算法是对已有的情绪特征词打分，接着以得分高低为序，超过一定阈值的特征组成特征子集。特征词集的质量直接影响最后结果，为了提高计算的准确性，文本的特征提取算法研究将继续受到关注。长远看来，自动生成文本特征技术将进一步提高，特征提取的研究重点也更多地从对词频的特征分析转移到文本结构和情感词上。


    ### 情感信息分类


    文本情感分类技术中，主要采用两种技术路线：基于规则的方法和基于统计的方法。在 20 世纪 80 年代，基于规则的方法占据主流位置，通过语言学家的语言经验和知识获取句法规则，以此作为文本分类依据。但是，获取规则的过程复杂且成本巨大，也对系统的性能有负面影响，且很难找到有效的途径来提高开发规则的效率。20
    世纪 90 年代之后，人们更倾向于使用统计的方法，通过训练样本进行特征选择和参数训练，根据选择的特征对待分类的输入样本进行形式化，然后输入到分类器进行类别判定，最终得到输入样本的类别。


    下表整理了 10 个文本情感分析 API，供读者参考：

    '
