    # 4.3 医疗康复


    近年来，情感计算运用于自闭症治疗得到越来越多的关注。例如，美国麻省理工学院情感计算团队正在开发世界上第一个可穿戴的情感计算技术设备：一个具有社交智能的假肢，用来实时检测自闭症儿童的情感，帮助机器人人使用自闭症儿童独有的数据，来评估这些互动过程中每个孩子的参与度和兴趣。这个装置用一个小型照相机，分析孩子的面部表情和头部运动来推断他们的认知情感状态。还有一种叫“galvanivator”的工具，通过测量穿戴者的皮肤电流数据，推断孩子的兴奋程度。这个像手套一样的设备可以利用发光二极管描绘出人体生理机能亢奋程度'
  - '[PAGE 62]


    度的图谱。这种可视化的展现方式，能够清晰地展示出人的认知情感水平。NAO 机器人和个性化的机器学习在治疗自闭症患者上也表现出很大的优越性：


    # ● NAO机器人


    人类治疗师会向孩子展示一张照片或者闪存卡片，用来表示不同的情绪，以教会他们如何识别恐惧、悲伤或喜悦的表情。治疗师随后对机器人进行编程，向孩子们展示这些相同的情绪，并且在孩子与机器人交往时观察孩子。孩子们的行为提供了宝贵的反馈信息，机器人和治疗师可以根据反馈信息继续学习。


    研究人员在这项研究中使用了 SoftBank Robotics NAO 类人机器人。NAO 将近 2 英尺高，类似于装甲超级英雄，通过改变眼睛的颜色、肢体的运动以及声音的音调来表达不同的情绪。

    参加这项研究的 35 名自闭症儿童中，有 17 人来自日本，18 人来自塞尔维亚，年龄从 3 岁到 13 岁不等。他们在 35 分钟的会议中以各种方式对机器人做出反应，从看起来无聊和困倦，到在房间里兴奋地跳来跳去，拍手，大笑或触摸机器人。研究中的大多数孩子对机器人的看法是，它不仅仅是一个玩具，应该尊重
    NAO，因为它是一个真实的人。另外，人类用许多不同的方式改变自己的表情，但机器人则通过同样的方式来改变表情，这对孩子来说更加有利，因为孩子可以通过非常有条理的方式学习如何表达表情[16]。


    ![](img/ada8a307f39841b3f0e78bc1750bcaa4_62_0.png)


    图 10 NAO 机器人


    # ● 个性化的机器学习


    麻省理工学院的研究小组意识到，具有深度学习能力的治疗机器人能够更好感知儿童的行为的。深度学习系统使用分层的多层数据处理来处理其任务，每一个连续的层都是对原始数据抽象的表示。


    尽管自 20 世纪 80 年代以来深度学习的概念已经出现，但直到最近才有足够的计算能力来实现这种人工智能。深度学习已被用于自动语音和对象识别程序中，这种应用非常适合解决面部、身体和声音等多重特征的问题，从而更好地理解抽象的概念，如儿童的参与感。'
