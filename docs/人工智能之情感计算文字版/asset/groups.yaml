    我们对情感计算领域 TOP 学者的迁徙路径做了分析。由图 6 可以看出，各国情感计算 TOP 学者的流失和引进是相对比较均衡的，其中美国是情感计算领域人才流动大国，人才输入和输出幅度领先于其他国家，且从数据来看人才流出大于人才流入。英国、加拿大和印度等国人才迁徙流量小于美国；中国人才流入略高于人才流出。人才的频繁流入流出，使得该领域的学术交流活动增加，带动了人才质量提升的同时，也促进了领域理论及技术的更新迭代，逐渐形成一种良性循环的过程。


