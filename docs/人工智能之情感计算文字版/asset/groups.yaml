    http://cvpr.ucsd.edu/vivachallenge/index.php/hands/hand-detection/ |

    | 11k Hands | 11k Hands 数据集涵盖了来自 190 个 18-75 岁之间的实验对象的手部图像（1600 x 1200 像素）。每个实验对象都要求张开或是握紧左右手的手指，然后，在统一的白色背景，且手距离相机位置大致相同的情况下，分别从每只手的背侧和手掌侧进行拍摄。元数据的记录包括：（1）实验对象
    ID，（2）性别，（3）年龄，（4）肤色、以及（5）有关所捕捉到的手的一组信息，即右手或左手、手的部位（手背或手掌）以及逻辑指标，即指示手部图像是否包含配饰、指甲油或不符合规则处。所提出的数据集具有大量附加更为详尽的元数据的手部图像。该数据集是免费的，可用于合理的学术研究直接使用。
