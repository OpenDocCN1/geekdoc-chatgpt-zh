    ## 情感理解与表达


    通过对情感的获取、分析与识别，计算机便可了解其所处的情感状态。情感计算技术的实质是通过各种传感器获取由人的情感所引起的表情生理变化信号，利用“情感模型”对这些信号进行识别和分析，从而理解人的情感并做出适当的响应。因此，这部分主要研究的是如何根据情感信息的识别结果，对用户的情感变化做出最适宜的反应。随着情感信息捕获技术的提高和情感数据资源的扩大，对多特征融合的情感理解模型的研究能力将会有进一步的提高和突破。


    前面的研究是从视觉面部表情或者是行为特征来推断情感状态。情感表达则是研究其反过程，即给定某一情感状态，研究如何使这一情感状态在一种或几种视觉面部表情或行为特征中体现出来。例如，如何在手势合成和面部表情合成中得以体现，使机器具有情感，能够与用户进行情感交流[12]
    。


