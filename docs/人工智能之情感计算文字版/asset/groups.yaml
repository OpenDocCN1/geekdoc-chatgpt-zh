    # ACM ICMI--EmotiW


    ACM ICMI（ACM International Conference on Multimodal Interaction）是多模式人、人和人机交互，界面和系统开发的多学科研究的首要国际论坛。会议重点关注理论和实证基础，组件技术以及定义多模态交互分析，界面设计和系统开发领域的组合多模式处理技术。ICMI
    包含一系列 workshop 与 challenge。Challenge 主要包含三个，其中，challenge 中参与人数最多、举办时间最长的是 Emotion
    Recognition in the Wild Challenge (EmotiW)。EmotiW 挑战重点关注无约束条件下的情感感知和基于嵌入式音频视频的情感分类和基于图像的组级面部表情识别，以模仿现实世界的情况，以下是
