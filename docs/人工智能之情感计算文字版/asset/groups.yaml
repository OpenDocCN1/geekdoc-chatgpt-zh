    ## 3.3 研究机构


    目前国内从事情感计算研究的代表性实验室主要有以下机构：


    - 清华大学人机交互与媒体集成研究所


    清华大学人机交互与媒体集成研究所简称“媒体所”，在媒体信息智能处理、人机交互、普适计算等方面开展高水平研究，现任所长为史元春教授。媒体所建有多个学术基地，如清华信息科学与技术国家实验室普适计算研究部（普适计算教育部重点实验室）、清华大学计算机系—腾讯互联网创新技术联合实验室、网络多媒体北京市重点实验室等。媒体所近年主持多项本学科领域重要项目（“973”、“863”重点、NSFC重点等），在顶级刊会发表大量学术论文并获多篇最佳论文奖，获得国家级科技奖励5项。主要研究方向：智能信息处理（计算机视觉、图形学、多媒体编码与检索等）、和谐人机交互（情感计算、语音交互等）、普适计算环境（普适计算模式、主动服务等）。


    - 中国科学院模式识别国家重点实验室


    中科院模式识别国家重点实验室筹建于 1984 年，1987 年 8 月正式对外开放，是由国家计委投资筹建的第一批国家重点实验室之一。实验室依托于中国科学院自动化研究所，第一任主任是马颂德研究员，第二任主任是谭铁牛院士，现任主任是刘成林研究员。实验室目前承担着百余项科研项目，其中包括国家重点基础研究计划“973”项目、国家自然科学基金重大项目、国家高技术计划“863”项目，国家科技支撑计划项目及国际合作项目等。近年来，实验室获国家科技进步二等奖
    1 项，中科院自然科学二等奖 2 项。主要研究方向：模式识别基础理论（认知机理与计算模型、模式分类与机器学习、模式描述与结构理解等）、图像处理与计算机视觉（三维视觉和场景分析、文档图像分析等）、语音与语言信息处理（语音识别、话语理解等）、脑网络组研究（脑网络拓扑结构、脑网络的动力学属性等）。


    - 哈尔滨工业大学社会计算与信息检索研究中心


    哈尔滨工业大学社会计算与信息检索研究中心（HIT—SCIR）成立于 2000 年 9 月，研究中心主任是刘挺教授。已完成或正在承担的国家 973 课题、国家自然科学基金重点项目、国家
    863 重点项目、国际合作、企业合作等课题 60 余项。在这些项目的支持下打造出“语言技术平台 LTP”，获 2010 年钱伟长中文信息处理科学技术一等奖。主要研究方向包括语言分析、信息抽取、情感分析、问答系统、社会媒体处理和用户画像
    6 个方面。


    - 华中科技大学智能媒体计算与网络安全实验室


    华中科技大学智能媒体计算与网络安全实验室近五年来承担了国家重点研发计划、国家支撑计划、国家自然科学基金、国家 863 重点项目、湖北省杰出青年基金、武汉市青年科技晨光计划、博士点基金和企业合作项目等
    50 余项科研项目，在计算机学报、IEEE Transaction on Parallel and Distributed System、IEEE Computer
    Graphics and Application、IEEE Transaction on Multimedia 等国内外权威期刊和重要国际会议上发表论文 150
    余篇，其中被 SCI、EI 权威索引论文 100 余篇次，获得发明专利和软件著作权 50 余项，获得湖北省科技进步二等奖 1 项、日内瓦发明奖 1 项。目前主要的研究方向包括数字媒体处理与检索、视频情感计算、增强现实、网络安全与大数据处理、多核计算与流编译和教育信息化等。


    - 合肥工业大学情感计算与系统结构研究所


    合肥工业大学情感计算研究所于 2011 年成立，主任为孙晓教授。主要从事先进智能、情感计算、大规模数据与知识获取的基础理论研究工作。研究所构建了丰富的数据资源，包括文本语料库、面部表情库、动作-情感库等，其中全球最大规模的中文情感语料库，已授权全球近
    300 家高校、科研机构使用。构建了基于大规模多源情感数据库的情感感知、推理与交互的总体研究思路与方法体系，取得了系列突破性研究成果，使我国在先进智能及情感机器人达到了世界先进水平。主持并参与国家
    973 预研项目、863 项目，国家自然科学基金项目、安徽省自然科学基金项目、企业委托项目等多项。2011 年 12 月获批建设“情感计算与先进智能机器安徽省重点实验室”，系统展开情感计算与先进智能机器的研究，是国内首个以情感计算命名的重点实验室。研究方向包括：情感计算；自然语言处理；听觉信息认知计算；视觉信息认知计算；情感可穿戴计算；机器人云理论及其应用。


    - 东南大学情感信息处理实验室


    东南大学情感信息处理实验室（Affective Information Processing Lab，AIPL）创建于 2004 年，隶属于东南大学生物科学与医学工程学院和儿童发展与学习科学教育部重点实验室（东南大学），任为郑文明。实验室深耕情感计算领域，主持包括
    973 计划、国家自然科学基金重点项目在内的多项国家和省部级课题，在包括 IEEE Transactions 系列期刊和 ICCV、PR、ECCV、NIPS、IJCAI
    和 AAAI 等计算机领域顶级会议上已发表论文百余篇，部分研究成果获国家技术发明二等奖 1 项（2018 年）、教育部自然科学二等奖 2 项（2015 年和
    2008 年）和江苏省科技进步二等奖 1 项（2009 年）。研究方向包括：情感计算、模式识别、计算机视觉和机器学习及其在儿童智能发展、教育和医疗等方面的应用研究。


    ## 4 应用篇


    近年来，Picard 领导的美国麻省理工学院多媒体实验室相继提出了近 50 种情感计算应用项目。例如，将情感计算应用于医疗康复，协助自闭症者，识别其情感变化，理解患者的行为；在教育中应用情感计算，实现对学习状态的采集及分析，指导教学内容的选择及教学进度进行；还可以将情感计算应用于生活中，计算机能够感知用户对音乐的喜好，根据对情感反应的理解判断，为用户提供更感兴趣的音乐播放等。本篇将对情感计算在课堂教学、情感检测和医疗康复中的运用做详细介绍。


    ### 4.1 课堂教学


    - 面部识别测量学生理解程度


    在美国，公立学校的预算限制引发大规模的教师裁员和教室拥挤不堪。教师工作时间紧张，还要考虑和满足每个学生的需求。结果就是，那些课业困难的孩子容易受到忽视。因为只要孩子不提出问题，老师就不会关注到他。


    在过去三年里，有企业把面部识别技术应用到了第一线教学当中。在 SensorStar 实验室，他们用相机捕捉学生上课反应，并且输入到计算机里面，运用算法来确定学生注意力是否转移。通过面部识别软件
    EngageSense，计算机能够测量微笑、皱眉和声音来测定学生课堂参与度。孩子们的眼睛是专注于老师的吗？他们是在思考还是发呆？他们是微笑还是皱着眉头？或者他们只是觉得困惑？还是无聊？测量之后，老师将会收到一份反馈报告，基于面部分析，报告会告诉老师他们的学生学习兴趣何时最高、何时最低。这样，老师能够对自己的教学方案做出调整，满足更多学生的需求。此外，比尔和梅林达盖茨基金会资助了传感器手镯（sensor
    bracelets）的开发，这可以用来追踪学生的参与水平。腕部设备能够发送小电流，通过在神经系统响应刺激时测量电荷的细微变化便可以得知学生的课程兴奋程度。


    心理学家 Paul Ekman 将面部识别技术研究提升到了一个新的层次。他对 5000 多种面部运动进行了分类，以帮助识别人类情绪。他的研究为 Emotient
    Inc、Affectiva Inc 和 Eyeris 等公司提供了帮助，这些公司将心理学和数据挖掘相结合，检测人的细微表情，并对人的反应进行分类。目前为止，面部识别技术的重点是协助联邦执法和市场调研。不过，圣地亚哥市的研究人员也在医疗行业试用这项技术，测定孩子接受外科手术之后的疼痛程度[13]。


    - 机器学习定制学生课堂学习内容


    TechCrunch 公司的员工设计了在线教育平台，来提供一对一指导和精熟学习（mastery learning）。这是应用创新型思维，通过实时的评估和定制化的学习方式，有效地解决本杰明提出的著名的“Sigma
    2 Problem”。深度学习系统将学生学习效果数据进行分类，并且在此基础上制定相关的教学内容。该系统还可以推荐附加练习，并且根据学生个人能力和教学要求，实时推荐课程内容，调整教学速度[14]。


    北卡罗来纳州州立大学研究员开发了一种软件，通过摄像头捕捉和分析学生面部表情，以此改变在线课程。目前，大多数情感计算技术还仅仅停留在学术研究领域。但也已经有公司开始应用这项技术，并能成功地分辨学生表情，并根据他们的学习能力和方式，来自动调整适合的学习内容和环境。英特尔公司正是其中的一员。有了这些学生表情数据，可以让“Emoshape”这样的情感计算智能系统，自动分析情感，并做出适当回复。这些系统具备了解决个体问题的能力，也使老师能够提供高度个性化的内容来激发学生的学习兴趣。


    人工智能和大数据已经促成了大部分行业的技术革新，从电子商务到交通、金融、医疗。人工智能和大数据已经在教育方面取得进展。尽管有些反对的声音，比如说如何保护学生隐私、如何提高教学效率等，但需要指出的是，这些技术的应用并不是要代替老师，而是扮演辅助老师的角色，识别学生的个体需求，以制定更加智能的教学方案。


    ### 4.2 情绪监测


    为了深度挖掘人类情感的奥秘，美国麻省理工学院计算机科学与人工智能实验室打造了用无线信号监测情绪的 EQ-Radio[15]。在没有身体感应器和面部识别软件辅助的情况下，EQ-Radio
    通过测量呼吸和心跳的微小变化，利用无线信号捕捉到一些肉眼不一定能察觉的人类行为，判断一个人到底处于以下四种情绪中的哪一种：激动、开心、生气或者忧伤，正确率高达
    87%。美国麻省理工学院教授和该项目的负责人 Dina Katabi 预测，这个系统会被运用于娱乐、消费者行为和健康护理等方面：电影工作室和广告公司也可以用这个系统来测试观众实时的反应；而在智能家居的环境中，该系统可以通过捕捉与人的心情有关的信息，调节室内温度，或者建议你应该呼吸一些新鲜空气。


    现有的情绪监控方法大多依赖于视听设备或者是安装在人身上的感应器，这两种技术都有缺点：面部表情并不一定符合内心状态，而安装在身上的感应器（比如胸带和心电监护仪）会造成各种不便，而且一旦它们的位置稍微移动，监测到的数据就不精确了。


    EQ-Radio 会发送能监测生理信息的无线信号，该信号最终会反馈给设备本身。其中的算法可以分析心跳之间的微小变化，从而判断人们的情绪。消极情绪会被判定为“忧伤”，而正面且高涨的情绪会被判定为“激动”。尽管这样的测量会因人而异，但其中还是有内在统一性。通过了解人们处于不同的情绪状态下，他们的心跳会如何变化，我们就可以对他所处的情绪状态进行有效的判断。


    在他们设计的实验中，参与实验者选择他们记忆中最能代表激动、开心、生气、忧伤以及毫无情感的一段视频或音乐。在掌握了这段时长两分钟的视频里的五种情绪设置后，EQ-Radio
    可以精确地通过一个人的行为判断他处于这四种情绪中的哪一种。与微软研发的基于视觉和面部表情的 Emotion API 相比，EQ-Radio 在识别喜悦、忧伤和愤怒这三个情绪上精确度更高。同时，这两种系统在判断中性情绪时的精准度差不多，因为毫无情绪的脸总是更容易被识别。


    目前，对美国麻省理工学院计算机科学与人工智能实验室而言，最艰巨的任务就是摆脱不相关数据的干扰。比如，为了分析心率，他们要抑制呼吸可能带来的影响，因为呼吸时，人的肺部起伏比他心跳时的心脏起伏要大。


    ![](img/ada8a307f39841b3f0e78bc1750bcaa4_61_0.png)


    图 9 EQ-Radio 无线信号监测


    ### 4.3 医疗康复


    近年来，情感计算运用于自闭症治疗得到越来越多的关注。例如，美国麻省理工学院情感计算团队正在开发世界上第一个可穿戴的情感计算技术设备：一个具有社交智能的假肢，用来实时检测自闭症儿童的情感，帮助机器人使用自闭症儿童独有的数据，来评估这些互动过程中每个孩子的参与度和兴趣。这个装置用一个小型照相机，分析孩子的面部表情和头部运动来推断他们的认知情感状态。还有一种叫“galvanivator”的工具，通过测量穿戴者的皮肤电流数据，推断孩子的兴奋程度。这个像手套一样的设备可以利用发光二极管描绘出人体生理机能亢奋程度的图谱。这种可视化的展现方式，能够清晰地展示出人的认知情感水平。NAO
    机器人和个性化的机器学习在治疗自闭症患者上也表现出很大的优越性：


    ### NAO 机器人


    人类治疗师会向孩子展示一张照片或者闪存卡片，用来表示不同的情绪，以教会他们如何识别恐惧、悲伤或喜悦的表情。治疗师随后对机器人进行编程，向孩子们展示这些相同的情绪，并且在孩子与机器人交往时观察孩子。孩子们的行为提供了宝贵的反馈信息，机器人和治疗师可以根据反馈信息继续学习。


    研究人员在这项研究中使用了 SoftBank Robotics NAO 类人机器人。NAO 将近 2 英尺高，类似于装甲超级英雄，通过改变眼睛的颜色、肢体的运动以及声音的音调来表达不同的情绪。

    参加这项研究的 35 名自闭症儿童中，有 17 人来自日本，18 人来自塞尔维亚，年龄从 3 岁到 13 岁不等。他们在 35 分钟的会议中以各种方式对机器人做出反应，从看起来无聊和困倦，到在房间里兴奋地跳来跳去，拍手，大笑或触摸机器人。研究中的大多数孩子对机器人的看法是，它不仅仅是一个玩具，应该尊重
    NAO，因为它是一个真实的人。另外，人类用许多不同的方式改变自己的表情，但机器人则通过同样的方式来改变表情，这对孩子来说更加有利，因为孩子可以通过非常有条理的方式学习如何表达表情[16]。


    ![](img/ada8a307f39841b3f0e78bc1750bcaa4_62_0.png)


    图 10 NAO 机器人


    ### 个性化的机器学习


    麻省理工学院的研究小组意识到，具有深度学习能力的治疗机器人能够更好感知儿童的行为。深度学习系统使用分层的多层数据处理来处理其任务，每一个连续的层都是对原始数据抽象的表示。


    尽管自 20 世纪 80 年代以来深度学习的概念已经出现，但直到最近才有足够的计算能力来实现这种人工智能。深度学习已被用于自动语音和对象识别程序中，这种应用非常适合解决面部、身体和声音等多重特征的问题，从而更好地理解抽象的概念，如儿童的参与感。

