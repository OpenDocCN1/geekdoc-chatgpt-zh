    # 1.3 情感计算的理论观点


    心理学领域有关情感体验的理论观点主要有两类：范畴观和维度观。


    持范畴观的学者将情绪或情感分成独立的范畴，这些相互离散的情绪范畴在外部表现、生理唤醒模式上都存在一定的差异[2]。对于情感计算研究，基于范畴观来描述和测量情感的优势主要有两点。首先，用情绪范畴描述情绪和情感符合人们的直觉和常识，有利于情感计算的成果在现实生活中的推广和应用。其次，基于情绪范畴来进行情感计算，有利于智能系统中识别情绪后，进一步推理与之相联系的特定心理功能和可能的原因，然后做出适当的响应。但范畴观也给情感计算研究带来了制约和问题。首先，哪些情绪范畴对于情感计算来说是必要的，目前研究者对此并没有统一的认识。其次，情绪范畴是对情绪的定性描述，无法用量化的数字表达主观的情绪体验。


    维度观则认为情感具有基本维度和两极性。例如，近代科学心理学之父威廉·冯特提出的三维说，认为情绪情感有三个维度组成，每个维度的变化幅度都存在两种相互独立的状态。Osgood发现，情绪体验可以从评价、力度、活跃性三个方面来进行评价[3]。Mehrabian
    和 Russell 基于 Osgood 的思路，提出了 PAD 情绪模型，此模型不但给出了对情感空间进行描述的理论构想，同时采用量化的方法试图建立情感空间中各种情绪范畴的定位和关系，因此被广泛地应用在情绪心理学、人格心理学、社会心理学等基础领域，以及市场营销、产品满意度等应用领域[4]。基于维度的趋向为情感计算提供了量化的理论和方法基础，但是，究竟需要多少维度才足以充分地表达人类的情感及哪些维度是必要的，这仍是一个难题。


    # 1.4 情感计算的认知困境


    情感计算一经提出，迅速受到学术界的关注和企业界的迅速反应。英国电信公司（British Telecom）和 IBM 已成立了专门的情感计算研究小组，学术界如美国麻省理工学院的媒体实验室、剑桥大学、中国科学院等也在进行情感计算方面的研究。虽然情感计算的研究如火如荼地进行着，并且也取得了很大的成果，但对于情感计算的一些基本问题在认识上仍然存在分歧[6]。


    # 1.4.1 情感计算可能性


    情感可不可以计算实际上是一个哲学终极问题，这个问题衍生出如下问题：情感能计算吗？如果能计算，应该如何计算？计算的方法可行、可靠吗？对此明显分为两种截然相反的观点：


    一种是对情感计算的怀疑与否定，认为情感计算是不可能的和没必要的，主要体现在：'
  - '[PAGE 13]


    1) 认为情感计算在理论上是不可能的。情绪是人类本身专有的，一旦它脱离人就不存在了或者说变成假的了，一台机器不可能会自发地产生那些根本不属于它的特性；情感是不能制造的，模拟永远是不真实的，机器是永远不会产生像人与人相互交流时的那种情感。神经科学家达马西奥研究一批大脑受损的病人，他们尽管在数学和语言能力上没有任何缺陷，但他们的日常生活能力却大受影响。因此，长于数学和语言能力的机器难以处理情感。


    2) 认为情感计算在研究方向与方法是不可行的。情绪表达在模式与方法上是非常广泛的，而对这些是不可能进行准确把握的，如大脑活动、血液化学、神经传递物质等，因此在收集必要的数据方面变得不太可能或者不可行。并且，情绪比较随意和时常变化，要从一些数据准确地识别个体的情感状态也是办不到的。另一方面，要对情感进行计算，那么就必须要建立情感认知模型，但是要建立精细、多模态以及适合个体习惯的情感模型是非常困难的，至少在以后相当长的时间内是不可能的。


    但以 R.W Picard 为代表的计算机学家们却认为机器具有情感是可能的，在方法上也是可行的。他们认为情感并非如心理学家所认为的那样仅仅是人的内心体验状态，而是可以通过人生理、表情、语言等体现出来，可以通过一定的技术进行测量与处理。虽然人的情感表现具有一定的差异性，但是通过他们使用的可穿戴计算机的实验却发现情感识别能够达到
    80%左右的准确性。另一方面他们认为建立在实验基础上的情感建模也取得了不少进步，很多实验室与研究所根据自己的研究都建立了比较有价值的情感模型，如美国麻省理工学院媒体实验室首先给出了一个隐马尔可夫模型、日本早稻田大学建立了
    WE-3RV 的 3D 情感空间模型、计算机学家 Sumedha Kshirsagar 等建立的多层情绪—心情—性格模型等。


    # 1.4.2 情感计算的理论基础


    无论是情感计算的开创者 R.W Picard，还是后来的计算机学家对情感的计算处理，他们的理论是建立在心理学基础之上的。心理学把情感分为快乐、焦虑、悲伤、愤怒和厌恶，其它情感都是由此派生出来的：把情感的表现局限于心理感受强度、表情特征和生理指标。当前建立起来的情感模型主要考虑的也是这五种基本情感（见前面所述的情感模型），建模方法大都是基于维度论的方法，通过测量生理特征和行为特征（如面部表情、语音等）来推测情感状态，但是这样的模型总存在着这样或者那样的不足；同时，对于同一类型情感，无论是情感感受强度，还是情感表达强度和情感生理唤醒，都可以采用不同的生理指标进行计算和测量，究竟应该选用哪一个生理指标？对于同一类型情感采用同一个生理指标进行测量和计算时，由于受到许多环境因素以及人体其它生理因素和精神因素的影响，其测量值的差异性和波动性如何消除？因此，一些人认为把情感计算的理论基础建立在心理学之上是不妥的，而应该把它的理论基础'
  - '[PAGE 14]


    建立在“统一价值论”之上。统一价值论认为任何主观意识都不是无中生有的，也不是孤立存在的，都是对某一客观存在的反映，总会有某一客观存在与之相对应；情感作为一种特殊的主观心理活动，反映了一种特殊的客观存在——人与事物之间的价值关系，情感与价值的关系在本质上就是主观与客观的关系。因此，统一价值论把情感诠释为“人脑对事物的价值关系的一种主观反映”，以数学形式对情感进行精确定义，建立情感和价值观的数学分析模型，实现了情感的合并运算和合成运算，根据价值的不同变化特征对情感进行分类，从而将“情感计算”转化为“价值计算”。


    # 1.4.3 情感计算技术的两面性


    人工智能与计算机领域对此持乐观的态度，为我们展现了在不久的将来机器具有情感的广阔前景。中国科学院心理研究所傅小兰研究员认为“情感计算研究将为人类提供更加人性化、情感化的服务和产品，创造更加美好的生活”，清华大学计算机系张迎辉等相信“情感计算的发展必将极大地改变人们的生活，自然和谐的人机交互的梦想会离我们越来越近”，情感计算将在如下几个方面产生深刻影响：


    +   - 对人类的情感进行识别和响应，帮助人们理解自己和他人的情感世界。

    +   - 在远程教育平台中，进一步优化计算机辅助学习的功能。

    +   - 推进可穿戴的计算机系统的发展，以及智能、便携式个人身体保健与监护系统的开发。

    +   - 帮助我们增加使用设备的安全性和增加自动感知人们的情绪状态的功能，可以在娱乐、游戏等方面提供更好的服务。


    但是在社会与伦理领域的人士看来，如果机器具有像人一样的情感，将会对人类以及人类社会带来巨大的影响。首先，人与人之间的两维关系将被彻底打破，如何处理人与机器的感情问题，这将会产生一系列的伦理道德问题。其次，社会结构与秩序将会重组，人与机器在社会关系中的角色如何维持与平衡。因此他们认为机器具有了情感带给人类的不仅仅是福音，还带来麻烦与问题，并且麻烦与问题多于好处。'
