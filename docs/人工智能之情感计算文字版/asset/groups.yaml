    \ 本篇论文针对社会事件数据中呈现的多视角多模态等属性，提出一种多模态多视角的主题观点挖掘方法。该方法利用不同新闻媒体对同一个社会热点事件观点的差异性，研究不同视角对应的观点。通过本方法，既能够细致地分析不同媒体对社会热点事件的观点，又能够对社会热点事件进行全方位展示，便于探究热点事件的全局态势与舆情走势。本篇论文从多个社交平台上检测社会热点事件，并将其全面地展现出来，不仅切合政府和民众的需求，也是国际学术的研究热点。获奖论文敏锐地利用不同社交平台的在传播速度和传播内容上的特点，提出了一个有效的跨平台跨模态的社会热点事件监测方法。选题的新颖性、解决思路的创新性、以及技术的有效性，均受到评审专家的一致认可。\n\
