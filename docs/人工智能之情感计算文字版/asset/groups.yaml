    名人图像的大型人脸属性数据集，每个数据集都有 40 个属性注释。该数据集中的图像涵盖了大型姿态变化和复杂背景。CelebA 的多样性很好，有约 10 万张带微笑属性的数据。
    | http://mmlab.ie.cuhk.edu.hk/projects/CelebA.html |

    | Surveillance Cameras Face Database | 是人脸静态图像的数据库。图像是在不受控制的室内环境中使用五种不同品质的视频监控摄像机拍摄的。数据库包含
    130 个主题的 4160静态图像（在可见和红外光谱中）。 | http://www.scface.org/ |

