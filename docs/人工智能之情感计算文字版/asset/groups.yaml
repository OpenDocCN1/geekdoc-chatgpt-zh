    # 5.3 情感计算未来发展


    +   ● 数据库的建立


    现在已实现的情感计算大部分原型情感的识别来源单一。数据库本身存在短板，如训练分类的样本数少，体态识别大多依赖于一组有限的肢体表达（跳舞、手势、步态等），只关注内部效度而缺少外部效度。因此识别方面，未来研究应在情感分类方面继续努力，创建新的数据库，尤其是婴幼儿及儿童数据库的建立。


    +   ● 神经科学与情感计算的结合


    神经科学方面，人类大脑情感过程的神经解剖学基础极其复杂并且远未被理解，因此该领域还不能为开发情感计算模型提供充足的理论基础。


    +   ● 情感的测试


    人机交互或人与人交互过程中，人的情感变化是变速的。虽然 Picard 在《情感计算》一书中用两个比喻将情感复合分成两类：微波炉加热食物时开关间断循环与冷热水混合，两者通过不同方式的复合使物体达到“温”的状态，前者类似于“爱恨交加”所对应的情感状态，后者类似于
    Russell 等人提出的环形情感模型中愉快与低强度结合为轻松的这种新状态。但基于不同情境下的情感复合远不止这两类。将动态的数字平台做成模型很难实现，因为情感的输入、输出应该在不同的情境下产生和测试。'
