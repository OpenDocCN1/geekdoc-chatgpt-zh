- raw: "真正对传统法治全面反思始于网络法（cyber law）。1996年美国知名学者弗兰克·伊斯特布鲁克（Frank Easterbrook）受邀参加芝加哥大学法学院举办的一场网络法研讨会，他指出，网络法并无自身独特之命题，不足以成为独立的部门法研究领域。他说，网络法就好像是“（关于）拼凑的法律”，只是将网络空间中各类可能出现的纷争及可适用于调处相关纷争的法律规则拼凑起来，但网络空间中的纠纷最终还是要回到法律既有的基础部门（例如合同、侵权、财产等）寻求一般性的制度解决。[^((14))](#chapter2.xhtml#jz_01_0829)对此，著名网络法学家莱斯格（Lessig）进行了反驳，提出了多元规制的理论。所谓“多元规制”，指在由国家和政府制定与执行的法律之外，市场、社会规范和技术架构等人文和物质因素，同样对社会主体的行为具有规制性影响。这决定了法律理应选择的最优规制模式，即在线上也往往与线下有所不同，对线上行为的规制需更多借助或经由技术本身。正是在这一分写框架下，“代码即法律”（code\
    \ is law）这一命题最终产生。\n\n在这样的问题意识下，我国学者进一步指出，传统法治建立在现实世界的基础上，主要是人类工业文明的产物，以主权、强制、国家为基本特征。互联网是一个虚拟的世界，有它自己的语言、交往与行为方式，是平面、开放、无边界的空间。互联网的出现不单单意味着传送手段的变化，更重要的是它代表着新的社会形态——信息社会的来临。因此，作为新经济、新社会形态代表的互联网对建立在传统社会与文明基础上的传统法治的挑战必然是巨大、深远和全面的。[^((15))](#chapter2.xhtml#jz_01_0830)\n\
    \n前述法学理论对于技术关注的主要阶段的观察，提醒我们正视如下问题：技术究竟对传统法治的一般理论产生了哪些影响？人工智能法治就是要发现这样的一般理论，而非制造更多的“拼凑的法”或者人工智能法。在既有的学术分工体制下，法律人需要也无法回避自身不熟悉的科技问题。但在这一过程中，只有借助法学所处的更大的社会科学知识传统中的理论资源，法学研究者才能够更好地留意，并努力克服当前研究中常见的议题零碎化和缺乏融贯视角等问题，在包括人工智能应用与平台经济规制等在内的各重要议题上取得研究突破，并通过法律与科技的交叉研究为法律学术贡献整体性启示。[^((16))](#chapter2.xhtml#jz_01_0831)\n\
    \n## 第二节  \n\n人工智能及其法治应用\n\n人工智能及其他信息技术的推进与普遍应用尤其是其在法治系统中的应用，对传统法治的体系建设与运作机理的影响值得进一步检视。\n\
    \n### 一、人工智能的简要发展历程\n\n智能科技是人类在制造工具的过程中产生的，起初以便利人类为目的，现在已成为人类改变或控制客观环境的手段或工具，以改造世界为目的。[^((17))](#chapter2.xhtml#jz_01_0832)在智能社会时代，决定智能社会性质特征的是以算法为中心、以数据为先导、以区块链和人工智能为集成、以互联网和物联网为链接的当代信息技术。\n\
    \n1956年夏，麦卡锡、明斯基等科学家在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”时，首次提出“人工智能”（Artificial Intelligence，AI）这一概念，标志着人工智能学科的诞生。[^((18))](#chapter2.xhtml#jz_01_0833)之后人工智能经过了“三起两落”的发展历史，进入21世纪，随着计算机能力的提升，人工智能进入了新的发展时期。\n\
    \n我们可以用两种方式去定义人工智能，为人类认识人工智能这一复杂的科技现象提供基本视角。一是从架构的角度，主要是从采用的工具和方法来看；二是从功能的角度来看，关注这些系统实际能干什么，能完成什么任务。[^((19))](#chapter2.xhtml#jz_01_0834)一方面，人工智能成为传统法治调整、规制的对象；另一方面，人工智能在法治领域的应用，作为人工智能技术开发应用的一个部分，又大大推动了法治的更新与转型，形成所谓的人工智能法治。\n\
    \n### 二、人工智能法治应用的概念\n\n人工智能法治作为一个新概念、新理念、新领域，是建立在数字化基础上的，智能技术应用辅助法治运行所形成的法治形态，是传统法治在智能时代的最新发展，所以应强调智能科技及其法治应用对于法治系统的重构作用。人工智能法治应用的研究内容涵盖人工智能法治的基础理论、体制机制、规范体系、法律体系以及前沿问题等诸多方面。\n\
    \n出于认识视角的差异，学界对人工智能法治应用的界定也有所不同。有人认为，从广义层面上来看，人工智能法治应用是指通过运用现代科技和发挥人类思维智慧来实现社会正义的治理手段；从狭义层面来看，人工智能法治应用是指采用人工智能技术的法治类型。[^((20))](#chapter2.xhtml#jz_01_0835)有人认为，从应用领域和过程来说，人工智能法治应用属于法治智能化范畴，意在运用互联网、大数据、云计算、人工智能、区块链等技术，感测、汇集、分析、整合、输出法治运行必要的关键信息，对包括立法、执法、司法、普法工作的各种需求作出智能响应，并运用于法治工作的装备、设施、程序、方式，法律供给、服务、救济的输出与接收的过程、环节，极大地提高法治的效率、质量、效益，其实质是以现代信息技术和人工智能技术为辅助，实行智能化法治建设和运行。[^((21))](#chapter2.xhtml#jz_01_0836)有人从信息管理的视角出发，认为法治的本质是管理，而在智能社会中，管理本身发生了本质性的变化，出现了信息驱动的机制和秩序，从基于规制的管理逐渐转变为基于信息的管理，而大数据、AI、互联网就是基于信息管理的技术条件。[^((22))](#chapter2.xhtml#jz_01_0837)\n\
    \n上述学说虽然内容不同，但均认为人工智能法治应用是人工智能在法治场景中的应用。在法律学的范畴体系中，法律运行的秩序是指立法、执法、司法、法律服务等多个过程中所形成的法治秩序。从这个角度来说，人工智能法治应用是指人工智能技术在立法、执法、司法和法律服务等法治领域所形成的技术与法律的应用形态。[^((23))](#chapter2.xhtml#jz_01_0838)但法治的特性决定了人工智能法治应用并非通用技术在法治场景中的平移运用，亦非“AI”与“法治”的简单相加。其以算法为核心，而算法又依托于法律大数据这一基本要素。[^((24))](#chapter2.xhtml#jz_01_0839)人工智能法治应用是法律与技术秉持开放协作的原则进行深度融合后形成的知识体系。人工智能法治应用在一定程度上提升了法治的效率，实现了推动法治运行多主体、多要素的互动与协调，促进了法律与技术跨学科跨领域的交流合作，有助于实现法律和科技的共治。\n\
    \n### 三、人工智能法治应用的特征\n\n进入21世纪以来，人类社会呈现出加速变革的态势，迅速被推入智能社会。在这一技术浪潮中，人工智能法治应用的发展也被极速推动，在以数据为要素、算法为核心的基本框架下，在立法、执法、司法、法律服务等诸多领域产生新形态、新景象。人工智能法治依托科技的支撑，同时又反哺科技领域，以法治的方式引领和保障人工智能技术的规范发展。\n\
    \n##### （一）人工智能法治应用以数据为要素、以算法为核心\n\n人工智能法治应用的核心技术就是算法。算法是各种信息技术有机结合、广泛运用和创造丰富多彩的无限价值的关键。“算法”驱动了人工智能，而“算法”的来源、输入、对象和价值则体现为数据。\n\
    \n智能社会本质上是一个“算法泛在”并由算法主导的社会。把算法作为主导智能社会及其法律秩序的核心，其科学逻辑和法理依据在于算法在智能社会是最具影响力和标志性的先进生产力，是对智能社会具有全方位决定性意义的超级力量。[^((25))](#chapter2.xhtml#jz_01_0840)\n\
    \n随着信息技术的发展，万事万物、社会运行的每一个部分都可互通互联，并提供海量多样化的数据供智能算法分析处理；智能算法的预测和决策则可以直接控制物理设备，亦可为个人决策、群体决策乃至国家决策提供辅助支撑，带来了智能司法、智能执法等诸多法治领域的新发展，给我们带来了人工智能法治应用的新景象。\n\
    \n人工智能法治应用的基本要素是数据，由此也形成了以法律大数据驱动为核心的法治社会。物联网收集法律大数据、借助人工智能分析法律大数据，从而使得法治应用的各个环节能够产生极高的效率。但是，数据挖掘具有极高的技术性，它不仅取决于分析人掌握的数据数量，也取决于取得数据的质量。[^((26))](#chapter2.xhtml#jz_01_0841)人工智能法治应用中的数据特别体现为法律大数据，在立法方面体现为海量的法律、行政法规、地方性法规、政府规章和司法解释等；在执法方面体现为通过物联感知设备监测的大量个人数据、交通数据、城市运行数据等；在司法层面则体现为海量的裁判案件数据；在法律服务方面主要体现为在线数据库的建立以及公证服务对区块链技术的应用等。总体而言，法律大数据因立法、执法、司法、法律服务等应用领域的不同特性而具有不同的表现形式，但这些数据的获取都是紧密围绕人工智能法治应用的实践，以实际需求为导向的。\n\
    \n由数据驱动的算法决策所形成的人工智能法治应用，改变了以往传统法治的基本特征与运行规律。具体表现如下：第一，人工智能将法治活动由自然人的经验理性推向数字理性；第二，数字理性准确提炼了生活中的规则，为准确提炼法律规范提供了精准的数理基础；第三，数理基础也在最大程度上降低了法律规范表述的模糊性，提升了法律规范体系的客观性；第四，智能技术的运用，尤其是全程应用，如上海“206工程”、雪亮工程等，均在最大程度上约束了法治活动参与者，大大提升了法治运行的质效。\n\
    \n##### （二）人工智能法治应用推动法治变革\n\n法治是最好的治理方式，法治环境是最重要的发展环境，人工智能的发展同样需要法治的引领和保障。[^((27))](#chapter2.xhtml#jz_01_0842)然而，人工智能的出现，对当下的伦理标准、法律规则、社会秩序及公共管理体制带来了前所未有的危机和挑战。它不仅凸显现存法律制度产品供给的缺陷，还与已有法律秩序形成潜在冲突，挑战着我们业已构成的法律认知。[^((28))](#chapter2.xhtml#jz_01_0843)\n\
    \n传统法治系统是一个自足的系统，存在自身的价值与目的追求。尽管技术对法律制度影响重大，技术在法律中的适用以及技术对法律制度的影响还是会受到法治系统的限制。之所以如此，很重要的原因不是法律本身一定排斥这些科学技术，而恰恰是技术发展还相当不完备。[^((29))](#chapter2.xhtml#jz_01_0844)比如，算法在市场资源分配中的作用越来越大、影响越来越深，正在广泛而深刻地影响社会关系及其法律关系。作为算法控制者的一方（主要是企业）具有强大的谈判能力，而作为主要的风险承受者的社会公众缺乏风险识别能力、谈判能力、自我防控能力和救济能力。因此，算法引发了社会公正治理问题。[^((30))](#chapter2.xhtml#jz_01_0845)同时，算法运用所产生的一系列法律和社会治理问题，倒逼着法律制度和治理体系不断变革。\n\
    \n##### （三）人工智能法治应用是法律与技术的深度融合\n\n人工智能法治是智能科技与法治系统深度交融所催生的新的法治形态。既往的研究基本局限于科技对法律的作用、法律对科技的反作用等线性思维。随着科技及其应用广泛而深入地介入人类生活，技术开始发挥越来越大的制度供给作用，制度优势和科技优势深度融合，甚至逐渐形成法律和科技共治的新的秩序供给模式。在传统法治认识上，法律规范和技术规范是二元的。技术规范调整的主要对象是人与自然的关系，它规定人们如何使用生产力、生产工具等，以及如何有效地利用生产工具，开发自然资源；而法律调整的是人与社会的关系，规范人的涉他、涉众行为。但是，随着科技的发展，大量的技术规范需要转化为法律规范，或者由法律强制力保障实施，由此形成了法律代码化与代码法律化的发展趋势。例如，机械制造、生产操作、交通安全、环境保护、卫生保健、互联网运行、大数据集成、人工智能等方面的技术规范大量地被法律化，既保障了科学技术在生产和生活中的运用，也有效维护了人民群众的生命安全和全社会的利益。我国《民法典》对当事人通过互联网等信息网络订立电子合同以及这些合同的履行设置了专门的法律规则，“人格权编”规定了大数据背景下个人信息的保护问题，“侵权责任编”对网络侵权作出了比较严格的规定，这些都是法律和科技共治的制度保障。[^((31))](#chapter2.xhtml#jz_01_0846)诚信治理也为法律和科技共治提供了一个范例。在传统社会，诚信治理依靠的是法律和道德手段；在智能社会，科技发挥着不可替代的作用。大数据的存储、处理和应用能力的快速发展，云计算和区块链技术的不断成熟，都为维护社会诚信、建设信用社会提供了坚实的技术支持。只要一个人的行为是通过电子途径完成的，就会留痕、被完整记录并保存下来。每个人关乎他人和社会利益的活动信息，尤其是缺失诚信、违约侵权的不良行为和活动等都会被记录在案，无法涂改、遗忘不了、删除不能，这就倒逼人们在智能技术的监督下诚实守信、谨言慎行、远离邪恶。特别是区块链技术广泛应用后，各种信息永久保存，就更迫使人们自觉规范行为、树立诚信形象、建立个人良好信用记录。可见，许多法律和道德禁止不住的失信言行却被智能科技管起来了，科技让生活更美好的同时，也使社会更文明。构建以科学、人本、公正、包容、共治为核心要素和鲜明标识的法理型法律秩序，是破解智能社会“治理赤字”的当务之急，也是智能社会行稳致远的根本保障。[^((32))](#chapter2.xhtml#jz_01_0847)\n\
    \n需要指出的是，规划在科技与法律的交融中起到了举足轻重的作用。当下，我国不仅具有在大数据、云计算、人工智能、区块链、互联网、物联网、电子商务等领域的科技优势，还有中国特色社会主义的制度优势。可以预见，当科技与制度深度融合之时，我国的制度优势和科技优势所特有的规划能级必将形成新的综合优势，使智能社会治理产生巨大效能。国家法律法规数据库的建设，跨部门大数据办案平台的运行，杭州、北京、广州互联网法院的创建，全国各地智慧法院、智慧检务、智慧公安的建设，中国裁判文书网全面运行，都表明中国之治正借助新科技优势而取得无与伦比的治理效能。\n\
    \n在智能社会推进科技与法律共治，要充分发挥技术防控的基础性作用和法律防控的保障性作用，把两种防控机制有机结合，使代码规制与法律规则、算法与国法相辅相成，这既能提升智能科技风险防控质量和效率，又能以法律的肯定性、强制力和权威性强化科技人员的防控责任，使风险防控责任落实到人、落实到位。\n\
    \n人工智能导致的自动化决策，引发人们对法治正当性的质疑。比如，COMPAS是一个由私营企业编写出的、能够帮助司法人员作出判断的系统。通过向被告询问137个问题，并搜索他曾经的犯罪记录，得到一堆数字，然后经过公司设定的复杂算法，最终得出包括他的孤僻程度、犯罪型人格的得分、性格稳定度、危险指数等。COMPAS系统在美国很多个州中都被使用，其中使用得最广泛的是威斯康星州。从2012年起，威斯康星州就鼓励在全州所有法庭上都用COMPAS系统，在监狱系统中也使用它给犯人作出评估，协助司法人员完成从行刑到假释的判断，该系统引发了人们的质疑。在法治领域打开算法黑箱，追求智能技术的可信赖，成为法治系统的最为紧迫的基本任务，同时也促使法治系统扩展，提前介入技术的开发并注重过程规则的设计。\n\
    \n### 四、人工智能法治应用的沿革\n\n人工智能法治应用的发展直接受到人工智能发展的影响，而人工智能的发展并不是一帆风顺的，历经了萌芽、初始阶段，经历了高潮、低谷、再高潮的波浪式前进的发展过程，每一次低谷之后，都会有一个新高潮，不断推动人工智能走向一个新时代。[^((33))](#chapter2.xhtml#jz_01_0848)在人工智能法治应用的各个领域，人工智能司法应用的表现最为突出。目前，人工智能立法应用还处于萌芽阶段，人工智能执法应用处于高速发展阶段，人工智能法律服务处于摸索前进阶段，相对于前三者，人工智能司法应用已处于成熟完善阶段，其发展沿革最具代表性。此外，人工智能司法应用在法治应用的全流程中也处于关键环节，是直接裁判当事人权利义务关系的核心，其中，以电子诉讼、司法大数据为核心的智慧法院建设的表现最为突出。所以，这里以法院信息化1.0、2.0、3.0三个阶段为例予以分析。\n\
    \n##### （一）以“数字化”为核心的法院信息化1.0\n\n1996年开始的法院信息化1.0以“数字化”为核心，关注的是纸质文档向电子文档的转换。法院信息化1.0是法院内部基础建设的阶段，以提高内部办公和管理效率为主要目的，以电脑办公和司法统计（管理）信息化为主要特征，以电脑单机和内部局域网为主要应用场景，尚未干预司法活动本身。[^((34))](#chapter2.xhtml#jz_01_0849)\n\
    \n##### （二）以“网络化”为核心的法院信息化2.0\n\n法院信息化2.0以“网络化”为核心，关注的是法院工作方式由线下到线上的转换。法院信息化2.0是加快建设法院外网并启动智慧法院建设的阶段，以办案自动化、网络化和数据互联互通为主要特征，重点开始转向改进审判管理和以当事人为中心的司法服务，并全面应用于互联网，局域网不再是主要的应用场景。2006年前后，部分地方法院开始探索网上审判，即利用电子邮件、QQ聊天软件等审理异地或跨国案件。[^((35))](#chapter2.xhtml#jz_01_0850)\n\
    \n##### （三）以“智能化”为核心的法院信息化3.0\n\n2015年开始的法院信息化3.0以“智能化”为核心，在数字化与网络化基础之上，通过大数据与人工智能技术的应用来实现审判的智能化。法院信息化3.0是“嵌入式数字化管理”和“司法+互联网”的阶段，着力提升智慧法院的服务性、全面性、共享性和均衡性，通过重塑司法程序、再造诉讼流程，使法院的组织结构、诉讼活动被塑造出全新“形态”：虚拟的法庭代替了物理的法院，诉讼由线下转到线上，由“面对面”“共时”“同步”变成“网对网”“错时”“异步”。[^((36))](#chapter2.xhtml#jz_01_0851)\n\
    \n最高人民法院于2015年7月首次提出“智慧法院”这一概念，并于2017年4月印发《最高人民法院关于加快建设智慧法院的意见》，智慧法院建设于当年即取得显著成效，2018年人工智能司法应用建设持续发力，在人工智能辅助审判执行和司法管理、智能化助力司法公开和智能化推动网络纠纷化解等领域，智慧法院由初步形成向全面建设迈进。[^((37))](#chapter2.xhtml#jz_01_0852)\n\
    \n## 第三节  \n\n人工智能法治应用的核心议题"
  fmt: '

    真正对传统法治全面反思始于网络法（`cyber law`）。1996年美国知名学者弗兰克·伊斯特布鲁克（`Frank Easterbrook`）受邀参加芝加哥大学法学院举办的一场网络法研讨会，他指出，网络法并无自身独特之命题，不足以成为独立的部门法研究领域。他说，网络法就好像是“（关于）拼凑的法律”，只是将网络空间中各类可能出现的纷争及可适用于调处相关纷争的法律规则拼凑起来，但网络空间中的纠纷最终还是要回到法律既有的基础部门（例如合同、侵权、财产等）寻求一般性的制度解决。[^((14))](#chapter2.xhtml#jz_01_0829)对此，著名网络法学家莱斯格（`Lessig`）进行了反驳，提出了多元规制的理论。所谓“多元规制”，指在由国家和政府制定与执行的法律之外，市场、社会规范和技术架构等人文和物质因素，同样对社会主体的行为具有规制性影响。这决定了法律理应选择的最优规制模式，即在线上也往往与线下有所不同，对线上行为的规制需更多借助或经由技术本身。正是在这一分写框架下，“代码即法律”（`code
    is law`）这一命题最终产生。


    在这样的问题意识下，我国学者进一步指出，传统法治建立在现实世界的基础上，主要是人类工业文明的产物，以主权、强制、国家为基本特征。互联网是一个虚拟的世界，有它自己的语言、交往与行为方式，是平面、开放、无边界的空间。互联网的出现不单单意味着传送手段的变化，更重要的是它代表着新的社会形态——信息社会的来临。因此，作为新经济、新社会形态代表的互联网对建立在传统社会与文明基础上的传统法治的挑战必然是巨大、深远和全面的。[^((15))](#chapter2.xhtml#jz_01_0830)


    前述法学理论对于技术关注的主要阶段的观察，提醒我们正视如下问题：技术究竟对传统法治的一般理论产生了哪些影响？人工智能法治就是要发现这样的一般理论，而非制造更多的“拼凑的法”或者人工智能法。在既有的学术分工体制下，法律人需要也无法回避自身不熟悉的科技问题。但在这一过程中，只有借助法学所处的更大的社会科学知识传统中的理论资源，法学研究者才能够更好地留意，并努力克服当前研究中常见的议题零碎化和缺乏融贯视角等问题，在包括人工智能应用与平台经济规制等在内的各重要议题上取得研究突破，并通过法律与科技的交叉研究为法律学术贡献整体性启示。[^((16))](#chapter2.xhtml#jz_01_0831)


    ## 第二节 人工智能及其法治应用


    人工智能及其他信息技术的推进与普遍应用尤其是其在法治系统中的应用，对传统法治的体系建设与运作机理的影响值得进一步检视。


    ### 一、人工智能的简要发展历程


    智能科技是人类在制造工具的过程中产生的，起初以便利人类为目的，现在已成为人类改变或控制客观环境的手段或工具，以改造世界为目的。[^((17))](#chapter2.xhtml#jz_01_0832)在智能社会时代，决定智能社会性质特征的是以算法为中心、以数据为先导、以区块链和人工智能为集成、以互联网和物联网为链接的当代信息技术。


    1956年夏，麦卡锡、明斯基等科学家在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”时，首次提出“人工智能”（`Artificial Intelligence`，`AI`）这一概念，标志着人工智能学科的诞生。[^((18))](#chapter2.xhtml#jz_01_0833)之后人工智能经过了“三起两落”的发展历史，进入21世纪，随着计算机能力的提升，人工智能进入了新的发展时期。


    我们可以用两种方式去定义人工智能，为人类认识人工智能这一复杂的科技现象提供基本视角。一是从架构的角度，主要是从采用的工具和方法来看；二是从功能的角度来看，关注这些系统实际能干什么，能完成什么任务。[^((19))](#chapter2.xhtml#jz_01_0834)一方面，人工智能成为传统法治调整、规制的对象；另一方面，人工智能在法治领域的应用，作为人工智能技术开发应用的一个部分，又大大推动了法治的更新与转型，形成所谓的人工智能法治。


    ### 二、人工智能法治应用的概念


    人工智能法治作为一个新概念、新理念、新领域，是建立在数字化基础上的，智能技术应用辅助法治运行所形成的法治形态，是传统法治在智能时代的最新发展，所以应强调智能科技及其法治应用对于法治系统的重构作用。人工智能法治应用的研究内容涵盖人工智能法治的基础理论、体制机制、规范体系、法律体系以及前沿问题等诸多方面。


    出于认识视角的差异，学界对人工智能法治应用的界定也有所不同。有人认为，从广义层面上来看，人工智能法治应用是指通过运用现代科技和发挥人类思维智慧来实现社会正义的治理手段；从狭义层面来看，人工智能法治应用是指采用人工智能技术的法治类型。[^((20))](#chapter2.xhtml#jz_01_0835)有人认为，从应用领域和过程来说，人工智能法治应用属于法治智能化范畴，意在运用互联网、大数据、云计算、人工智能、区块链等技术，感测、汇集、分析、整合、输出法治运行必要的关键信息，对包括立法、执法、司法、普法工作的各种需求作出智能响应，并运用于法治工作的装备、设施、程序、方式，法律供给、服务、救济的输出与接收的过程、环节，极大地提高法治的效率、质量、效益，其实质是以现代信息技术和人工智能技术为辅助，实行智能化法治建设和运行。[^((21))](#chapter2.xhtml#jz_01_0836)有人从信息管理的视角出发，认为法治的本质是管理，而在智能社会中，管理本身发生了本质性的变化，出现了信息驱动的机制和秩序，从基于规制的管理逐渐转变为基于信息的管理，而大数据、`AI`、互联网就是基于信息管理的技术条件。[^((22))](#chapter2.xhtml#jz_01_0837)


    上述学说虽然内容不同，但均认为人工智能法治应用是人工智能在法治场景中的应用。在法律学的范畴体系中，法律运行的秩序是指立法、执法、司法、法律服务等多个过程中所形成的法治秩序。从这个角度来说，人工智能法治应用是指人工智能技术在立法、执法、司法和法律服务等法治领域所形成的技术与法律的应用形态。[^((23))](#chapter2.xhtml#jz_01_0838)但法治的特性决定了人工智能法治应用并非通用技术在法治场景中的平移运用，亦非“`AI`”与“法治”的简单相加。其以算法为核心，而算法又依托于法律大数据这一基本要素。[^((24))](#chapter2.xhtml#jz_01_0839)人工智能法治应用是法律与技术秉持开放协作的原则进行深度融合后形成的知识体系。人工智能法治应用在一定程度上提升了法治的效率，实现了推动法治运行多主体、多要素的互动与协调，促进了法律与技术跨学科跨领域的交流合作，有助于实现法律和科技的共治。


    ### 三、人工智能法治应用的特征


    进入21世纪以来，人类社会呈现出加速变革的态势，迅速被推入智能社会。在这一技术浪潮中，人工智能法治应用的发展也被极速推动，在以数据为要素、算法为核心的基本框架下，在立法、执法、司法、法律服务等诸多领域产生新形态、新景象。人工智能法治依托科技的支撑，同时又反哺科技领域，以法治的方式引领和保障人工智能技术的规范发展。


    #### （一）人工智能法治应用以数据为要素、以算法为核心


    人工智能法治应用的核心技术就是算法。算法是各种信息技术有机结合、广泛运用和创造丰富多彩的无限价值的关键。“算法”驱动了人工智能，而“算法”的来源、输入、对象和价值则体现为数据。


    智能社会本质上是一个“算法泛在”并由算法主导的社会。把算法作为主导智能社会及其法律秩序的核心，其科学逻辑和法理依据在于算法在智能社会是最具影响力和标志性的先进生产力，是对智能社会具有全方位决定性意义的超级力量。[^((25))](#chapter2.xhtml#jz_01_0840)


    随着信息技术的发展，万事万物、社会运行的每一个部分都可互通互联，并提供海量多样化的数据供智能算法分析处理；智能算法的预测和决策则可以直接控制物理设备，亦可为个人决策、群体决策乃至国家决策提供辅助支撑，带来了智能司法、智能执法等诸多法治领域的新发展，给我们带来了人工智能法治应用的新景象。


    人工智能法治应用的基本要素是数据，由此也形成了以法律大数据驱动为核心的法治社会。物联网收集法律大数据、借助人工智能分析法律大数据，从而使得法治应用的各个环节能够产生极高的效率。但是，数据挖掘具有极高的技术性，它不仅取决于分析人掌握的数据数量，也取决于取得数据的质量。[^((26))](#chapter2.xhtml#jz_01_0841)人工智能法治应用中的数据特别体现为法律大数据，在立法方面体现为海量的法律、行政法规、地方性法规、政府规章和司法解释等；在执法方面体现为通过物联感知设备监测的大量个人数据、交通数据、城市运行数据等；在司法层面则体现为海量的裁判案件数据；在法律服务方面主要体现为在线数据库的建立以及公证服务对区块链技术的应用等。总体而言，法律大数据因立法、执法、司法、法律服务等应用领域的不同特性而具有不同的表现形式，但这些数据的获取都是紧密围绕人工智能法治应用的实践，以实际需求为导向的。


    由数据驱动的算法决策所形成的人工智能法治应用，改变了以往传统法治的基本特征与运行规律。具体表现如下：第一，人工智能将法治活动由自然人的经验理性推向数字理性；第二，数字理性准确提炼了生活中的规则，为准确提炼法律规范提供了精准的数理基础；第三，数理基础也在最大程度上降低了法律规范表述的模糊性，提升了法律规范体系的客观性；第四，智能技术的运用，尤其是全程应用，如上海“`206工程`”、雪亮工程等，均在最大程度上约束了法治活动参与者，大大提升了法治运行的质效。


    #### （二）人工智能法治应用推动法治变革


    法治是最好的治理方式，法治环境是最重要的发展环境，人工智能的发展同样需要法治的引领和保障。[^((27))](#chapter2.xhtml#jz_01_0842)然而，人工智能的出现，对当下的伦理标准、法律规则、社会秩序及公共管理体制带来了前所未有的危机和挑战。它不仅凸显现存法律制度产品供给的缺陷，还与已有法律秩序形成潜在冲突，挑战着我们业已构成的法律认知。[^((28))](#chapter2.xhtml#jz_01_0843)


    传统法治系统是一个自足的系统，存在自身的价值与目的追求。尽管技术对法律制度影响重大，技术在法律中的适用以及技术对法律制度的影响还是会受到法治系统的限制。之所以如此，很重要的原因不是法律本身一定排斥这些科学技术，而恰恰是技术发展还相当不完备。[^((29))](#chapter2.xhtml#jz_01_0844)比如，算法在市场资源分配中的作用越来越大、影响越来越深，正在广泛而深刻地影响社会关系及其法律关系。作为算法控制者的一方（主要是企业）具有强大的谈判能力，而作为主要的风险承受者的社会公众缺乏风险识别能力、谈判能力、自我防控能力和救济能力。因此，算法引发了社会公正治理问题。[^((30))](#chapter2.xhtml#jz_01_0845)同时，算法运用所产生的一系列法律和社会治理问题，倒逼着法律制度和治理体系不断变革。


    #### （三）人工智能法治应用是法律与技术的深度融合


    人工智能法治是智能科技与法治系统深度交融所催生的新的法治形态。既往的研究基本局限于科技对法律的作用、法律对科技的反作用等线性思维。随着科技及其应用广泛而深入地介入人类生活，技术开始发挥越来越大的制度供给作用，制度优势和科技优势深度融合，甚至逐渐形成法律和科技共治的新的秩序供给模式。在传统法治认识上，法律规范和技术规范是二元的。技术规范调整的主要对象是人与自然的关系，它规定人们如何使用生产力、生产工具等，以及如何有效地利用生产工具，开发自然资源；而法律调整的是人与社会的关系，规范人的涉他、涉众行为。但是，随着科技的发展，大量的技术规范需要转化为法律规范，或者由法律强制力保障实施，由此形成了法律代码化与代码法律化的发展趋势。例如，机械制造、生产操作、交通安全、环境保护、卫生保健、互联网运行、大数据集成、人工智能等方面的技术规范大量地被法律化，既保障了科学技术在生产和生活中的运用，也有效维护了人民群众的生命安全和全社会的利益。我国《民法典》对当事人通过互联网等信息网络订立电子合同以及这些合同的履行设置了专门的法律规则，“人格权编”规定了大数据背景下个人信息的保护问题，“侵权责任编”对网络侵权作出了比较严格的规定，这些都是法律和科技共治的制度保障。[^((31))](#chapter2.xhtml#jz_01_0846)诚信治理也为法律和科技共治提供了一个范例。在传统社会，诚信治理依靠的是法律和道德手段；在智能社会，科技发挥着不可替代的作用。大数据的存储、处理和应用能力的快速发展，云计算和区块链技术的不断成熟，都为维护社会诚信、建设信用社会提供了坚实的技术支持。只要一个人的行为是通过电子途径完成的，就会留痕、被完整记录并保存下来。每个人关乎他人和社会利益的活动信息，尤其是缺失诚信、违约侵权的不良行为和活动等都会被记录在案，无法涂改、遗忘不了、删除不能，这就倒逼人们在智能技术的监督下诚实守信、谨言慎行、远离邪恶。特别是区块链技术广泛应用后，各种信息永久保存，就更迫使人们自觉规范行为、树立诚信形象、建立个人良好信用记录。可见，许多法律和道德禁止不住的失信言行却被智能科技管起来了，科技让生活更美好的同时，也使社会更文明。构建以科学、人本、公正、包容、共治为核心要素和鲜明标识的法理型法律秩序，是破解智能社会“治理赤字”的当务之急，也是智能社会行稳致远的根本保障。[^((32))](#chapter2.xhtml#jz_01_0847)


    需要指出的是，规划在科技与法律的交融中起到了举足轻重的作用。当下，我国不仅具有在大数据、云计算、人工智能、区块链、互联网、物联网、电子商务等领域的科技优势，还有中国特色社会主义的制度优势。可以预见，当科技与制度深度融合之时，我国的制度优势和科技优势所特有的规划能级必将形成新的综合优势，使智能社会治理产生巨大效能。国家法律法规数据库的建设，跨部门大数据办案平台的运行，杭州、北京、广州互联网法院的创建，全国各地智慧法院、智慧检务、智慧公安的建设，中国裁判文书网全面运行，都表明中国之治正借助新科技优势而取得无与伦比的治理效能。


    在智能社会推进科技与法律共治，要充分发挥技术防控的基础性作用和法律防控的保障性作用，把两种防控机制有机结合，使代码规制与法律规则、算法与国法相辅相成，这既能提升智能科技风险防控质量和效率，又能以法律的肯定性、强制力和权威性强化科技人员的防控责任，使风险防控责任落实到人、落实到位。


    人工智能导致的自动化决策，引发人们对法治正当性的质疑。比如，`COMPAS`是一个由私营企业编写出的、能够帮助司法人员作出判断的系统。通过向被告询问137个问题，并搜索他曾经的犯罪记录，得到一堆数字，然后经过公司设定的复杂算法，最终得出包括他的孤僻程度、犯罪型人格的得分、性格稳定度、危险指数等。`COMPAS`系统在美国很多个州中都被使用，其中使用得最广泛的是威斯康星州。从2012年起，威斯康星州就鼓励在全州所有法庭上都用`COMPAS`系统，在监狱系统中也使用它给犯人作出评估，协助司法人员完成从行刑到假释的判断，该系统引发了人们的质疑。在法治领域打开算法黑箱，追求智能技术的可信赖，成为法治系统的最为紧迫的基本任务，同时也促使法治系统扩展，提前介入技术的开发并注重过程规则的设计。


    ### 四、人工智能法治应用的沿革


    人工智能法治应用的发展直接受到人工智能发展的影响，而人工智能的发展并不是一帆风顺的，历经了萌芽、初始阶段，经历了高潮、低谷、再高潮的波浪式前进的发展过程，每一次低谷之后，都会有一个新高潮，不断推动人工智能走向一个新时代。[^((33))](#chapter2.xhtml#jz_01_0848)在人工智能法治应用的各个领域，人工智能司法应用的表现最为突出。目前，人工智能立法应用还处于萌芽阶段，人工智能执法应用处于高速发展阶段，人工智能法律服务处于摸索前进阶段，相对于前三者，人工智能司法应用已处于成熟完善阶段，其发展沿革最具代表性。此外，人工智能司法应用在法治应用的全流程中也处于关键环节，是直接裁判当事人权利义务关系的核心，其中，以电子诉讼、司法大数据为核心的智慧法院建设的表现最为突出。所以，这里以法院信息化`1.0`、`2.0`、`3.0`三个阶段为例予以分析。


    #### （一）以“数字化”为核心的法院信息化1.0


    1996年开始的法院信息化`1.0`以“数字化”为核心，关注的是纸质文档向电子文档的转换。法院信息化`1.0`是法院内部基础建设的阶段，以提高内部办公和管理效率为主要目的，以电脑办公和司法统计（管理）信息化为主要特征，以电脑单机和内部局域网为主要应用场景，尚未干预司法活动本身。[^((34))](#chapter2.xhtml#jz_01_0849)


    #### （二）以“网络化”为核心的法院信息化2.0


    法院信息化`2.0`以“网络化”为核心，关注的是法院工作方式由线下到线上的转换。法院信息化`2.0`是加快建设法院外网并启动智慧法院建设的阶段，以办案自动化、网络化和数据互联互通为主要特征，重点开始转向改进审判管理和以当事人为中心的司法服务，并全面应用于互联网，局域网不再是主要的应用场景。2006年前后，部分地方法院开始探索网上审判，即利用电子邮件、`QQ`聊天软件等审理异地或跨国案件。[^((35))](#chapter2.xhtml#jz_01_0850)


    #### （三）以“智能化”为核心的法院信息化3.0


    2015年开始的法院信息化`3.0`以“智能化”为核心，在数字化与网络化基础之上，通过大数据与人工智能技术的应用来实现审判的智能化。法院信息化`3.0`是“嵌入式数字化管理”和“司法+互联网”的阶段，着力提升智慧法院的服务性、全面性、共享性和均衡性，通过重塑司法程序、再造诉讼流程，使法院的组织结构、诉讼活动被塑造出全新“形态”：虚拟的法庭代替了物理的法院，诉讼由线下转到线上，由“面对面”“共时”“同步”变成“网对网”“错时”“异步”。[^((36))](#chapter2.xhtml#jz_01_0851)


    最高人民法院于2015年7月首次提出“智慧法院”这一概念，并于2017年4月印发《最高人民法院关于加快建设智慧法院的意见》，智慧法院建设于当年即取得显著成效，2018年人工智能司法应用建设持续发力，在人工智能辅助审判执行和司法管理、智能化助力司法公开和智能化推动网络纠纷化解等领域，智慧法院由初步形成向全面建设迈进。[^((37))](#chapter2.xhtml#jz_01_0852)


    ## 第三节 人工智能法治应用的核心议题

    '
  trans: '


    真正对传统法治全面反思始于网络法（`cyber law`）。1996 年美国知名学者弗兰克·伊斯特布鲁克（`Frank Easterbrook`）受邀参加芝加哥大学法学院举办的一场网络法研讨会，他指出，网络法并无自身独特之命题，不足以成为独立的部门法研究领域。他说，网络法就好像是“（关于）拼凑的法律”，只是将网络空间中各类可能出现的纷争及可适用于调处相关纷争的法律规则拼凑起来，但网络空间中的纠纷最终还是要回到法律既有的基础部门（例如合同、侵权、财产等）寻求一般性的制度解决。^((14))对此，著名网络法学家莱斯格（`Lessig`）进行了反驳，提出了多元规制的理论。所谓“多元规制”，指在由国家和政府制定与执行的法律之外，市场、社会规范和技术架构等人文和物质因素，同样对社会主体的行为具有规制性影响。这决定了法律理应选择的最优规制模式，即在线上也往往与线下有所不同，对线上行为的规制需更多借助或经由技术本身。正是在这一分写框架下，“代码即法律”（`code
    is law`）这一命题最终产生。


    在这样的问题意识下，我国学者进一步指出，传统法治建立在现实世界的基础上，主要是人类工业文明的产物，以主权、强制、国家为基本特征。互联网是一个虚拟的世界，有它自己的语言、交往与行为方式，是平面、开放、无边界的空间。互联网的出现不单单意味着传送手段的变化，更重要的是它代表着新的社会形态——信息社会的来临。因此，作为新经济、新社会形态代表的互联网对建立在传统社会与文明基础上的传统法治的挑战必然是巨大、深远和全面的。^((15))


    前述法学理论对于技术关注的主要阶段的观察，提醒我们正视如下问题：技术究竟对传统法治的一般理论产生了哪些影响？人工智能法治就是要发现这样的一般理论，而非制造更多的“拼凑的法”或者人工智能法。在既有的学术分工体制下，法律人需要也无法回避自身不熟悉的科技问题。但在这一过程中，只有借助法学所处的更大的社会科学知识传统中的理论资源，法学研究者才能够更好地留意，并努力克服当前研究中常见的议题零碎化和缺乏融贯视角等问题，在包括人工智能应用与平台经济规制等在内的各重要议题上取得研究突破，并通过法律与科技的交叉研究为法律学术贡献整体性启示。^((16))


    ## 第二节 人工智能及其法治应用


    人工智能及其他信息技术的推进与普遍应用尤其是其在法治系统中的应用，对传统法治的体系建设与运作机理的影响值得进一步检视。


    ### 一、人工智能的简要发展历程


    智能科技是人类在制造工具的过程中产生的，起初以便利人类为目的，现在已成为人类改变或控制客观环境的手段或工具，以改造世界为目的。^((17))在智能社会时代，决定智能社会性质特征的是以算法为中心、以数据为先导、以区块链和人工智能为集成、以互联网和物联网为链接的当代信息技术。


    1956 年夏，麦卡锡、明斯基等科学家在美国达特茅斯学院开会研讨“如何用机器模拟人的智能”时，首次提出“人工智能”（`Artificial Intelligence`，`AI`）这一概念，标志着人工智能学科的诞生。^((18))之后人工智能经过了“三起两落”的发展历史，进入
    21 世纪，随着计算机能力的提升，人工智能进入了新的发展时期。


    我们可以用两种方式去定义人工智能，为人类认识人工智能这一复杂的科技现象提供基本视角。一是从架构的角度，主要是从采用的工具和方法来看；二是从功能的角度来看，关注这些系统实际能干什么，能完成什么任务。^((19))一方面，人工智能成为传统法治调整、规制的对象；另一方面，人工智能在法治领域的应用，作为人工智能技术开发应用的一个部分，又大大推动了法治的更新与转型，形成所谓的人工智能法治。


    ### 二、人工智能法治应用的概念


    人工智能法治作为一个新概念、新理念、新领域，是建立在数字化基础上的，智能技术应用辅助法治运行所形成的法治形态，是传统法治在智能时代的最新发展，所以应强调智能科技及其法治应用对于法治系统的重构作用。人工智能法治应用的研究内容涵盖人工智能法治的基础理论、体制机制、规范体系、法律体系以及前沿问题等诸多方面。


    出于认识视角的差异，学界对人工智能法治应用的界定也有所不同。有人认为，从广义层面上来看，人工智能法治应用是指通过运用现代科技和发挥人类思维智慧来实现社会正义的治理手段；从狭义层面来看，人工智能法治应用是指采用人工智能技术的法治类型。^((20))有人认为，从应用领域和过程来说，人工智能法治应用属于法治智能化范畴，意在运用互联网、大数据、云计算、人工智能、区块链等技术，感测、汇集、分析、整合、输出法治运行必要的关键信息，对包括立法、执法、司法、普法工作的各种需求作出智能响应，并运用于法治工作的装备、设施、程序、方式，法律供给、服务、救济的输出与接收的过程、环节，极大地提高法治的效率、质量、效益，其实质是以现代信息技术和人工智能技术为辅助，实行智能化法治建设和运行。^((21))有人从信息管理的视角出发，认为法治的本质是管理，而在智能社会中，管理本身发生了本质性的变化，出现了信息驱动的机制和秩序，从基于规制的管理逐渐转变为基于信息的管理，而大数据、`AI`、互联网就是基于信息管理的技术条件。^((22))


    上述学说虽然内容不同，但均认为人工智能法治应用是人工智能在法治场景中的应用。在法律学的范畴体系中，法律运行的秩序是指立法、执法、司法、法律服务等多个过程中所形成的法治秩序。从这个角度来说，人工智能法治应用是指人工智能技术在立法、执法、司法和法律服务等法治领域所形成的技术与法律的应用形态。^((23))但法治的特性决定了人工智能法治应用并非通用技术在法治场景中的平移运用，亦非“`AI`”与“法治”的简单相加。其以算法为核心，而算法又依托于法律大数据这一基本要素。^((24))人工智能法治应用是法律与技术秉持开放协作的原则进行深度融合后形成的知识体系。人工智能法治应用在一定程度上提升了法治的效率，实现了推动法治运行多主体、多要素的互动与协调，促进了法律与技术跨学科跨领域的交流合作，有助于实现法律和科技的共治。


    ### 三、人工智能法治应用的特征


    进入 21 世纪以来，人类社会呈现出加速变革的态势，迅速被推入智能社会。在这一技术浪潮中，人工智能法治应用的发展也被极速推动，在以数据为要素、算法为核心的基本框架下，在立法、执法、司法、法律服务等诸多领域产生新形态、新景象。人工智能法治依托科技的支撑，同时又反哺科技领域，以法治的方式引领和保障人工智能技术的规范发展。


    #### （一）人工智能法治应用以数据为要素、以算法为核心


    人工智能法治应用的核心技术就是算法。算法是各种信息技术有机结合、广泛运用和创造丰富多彩的无限价值的关键。“算法”驱动了人工智能，而“算法”的来源、输入、对象和价值则体现为数据。


    智能社会本质上是一个“算法泛在”并由算法主导的社会。把算法作为主导智能社会及其法律秩序的核心，其科学逻辑和法理依据在于算法在智能社会是最具影响力和标志性的先进生产力，是对智能社会具有全方位决定性意义的超级力量。^((25))


    随着信息技术的发展，万事万物、社会运行的每一个部分都可互通互联，并提供海量多样化的数据供智能算法分析处理；智能算法的预测和决策则可以直接控制物理设备，亦可为个人决策、群体决策乃至国家决策提供辅助支撑，带来了智能司法、智能执法等诸多法治领域的新发展，给我们带来了人工智能法治应用的新景象。


    人工智能法治应用的基本要素是数据，由此也形成了以法律大数据驱动为核心的法治社会。物联网收集法律大数据、借助人工智能分析法律大数据，从而使得法治应用的各个环节能够产生极高的效率。但是，数据挖掘具有极高的技术性，它不仅取决于分析人掌握的数据数量，也取决于取得数据的质量。^((26))人工智能法治应用中的数据特别体现为法律大数据，在立法方面体现为海量的法律、行政法规、地方性法规、政府规章和司法解释等；在执法方面体现为通过物联感知设备监测的大量个人数据、交通数据、城市运行数据等；在司法层面则体现为海量的裁判案件数据；在法律服务方面主要体现为在线数据库的建立以及公证服务对区块链技术的应用等。总体而言，法律大数据因立法、执法、司法、法律服务等应用领域的不同特性而具有不同的表现形式，但这些数据的获取都是紧密围绕人工智能法治应用的实践，以实际需求为导向的。


    由数据驱动的算法决策所形成的人工智能法治应用，改变了以往传统法治的基本特征与运行规律。具体表现如下：第一，人工智能将法治活动由自然人的经验理性推向数字理性；第二，数字理性准确提炼了生活中的规则，为准确提炼法律规范提供了精准的数理基础；第三，数理基础也在最大程度上降低了法律规范表述的模糊性，提升了法律规范体系的客观性；第四，智能技术的运用，尤其是全程应用，如上海“`206
    工程`”、雪亮工程等，均在最大程度上约束了法治活动参与者，大大提升了法治运行的质效。


    #### （二）人工智能法治应用推动法治变革


    法治是最好的治理方式，法治环境是最重要的发展环境，人工智能的发展同样需要法治的引领和保障。^((27))然而，人工智能的出现，对当下的伦理标准、法律规则、社会秩序及公共管理体制带来了前所未有的危机和挑战。它不仅凸显现存法律制度产品供给的缺陷，还与已有法律秩序形成潜在冲突，挑战着我们业已构成的法律认知。^((28))


    传统法治系统是一个自足的系统，存在自身的价值与目的追求。尽管技术对法律制度影响重大，技术在法律中的适用以及技术对法律制度的影响还是会受到法治系统的限制。之所以如此，很重要的原因不是法律本身一定排斥这些科学技术，而恰恰是技术发展还相当不完备。^((29))比如，算法在市场资源分配中的作用越来越大、影响越来越深，正在广泛而深刻地影响社会关系及其法律关系。作为算法控制者的一方（主要是企业）具有强大的谈判能力，而作为主要的风险承受者的社会公众缺乏风险识别能力、谈判能力、自我防控能力和救济能力。因此，算法引发了社会公正治理问题。^((30))同时，算法运用所产生的一系列法律和社会治理问题，倒逼着法律制度和治理体系不断变革。


    #### （三）人工智能法治应用是法律与技术的深度融合


    人工智能法治是智能科技与法治系统深度交融所催生的新的法治形态。既往的研究基本局限于科技对法律的作用、法律对科技的反作用等线性思维。随着科技及其应用广泛而深入地介入人类生活，技术开始发挥越来越大的制度供给作用，制度优势和科技优势深度融合，甚至逐渐形成法律和科技共治的新的秩序供给模式。在传统法治认识上，法律规范和技术规范是二元的。技术规范调整的主要对象是人与自然的关系，它规定人们如何使用生产力、生产工具等，以及如何有效地利用生产工具，开发自然资源；而法律调整的是人与社会的关系，规范人的涉他、涉众行为。但是，随着科技的发展，大量的技术规范需要转化为法律规范，或者由法律强制力保障实施，由此形成了法律代码化与代码法律化的发展趋势。例如，机械制造、生产操作、交通安全、环境保护、卫生保健、互联网运行、大数据集成、人工智能等方面的技术规范大量地被法律化，既保障了科学技术在生产和生活中的运用，也有效维护了人民群众的生命安全和全社会的利益。我国《民法典》对当事人通过互联网等信息网络订立电子合同以及这些合同的履行设置了专门的法律规则，“人格权编”规定了大数据背景下个人信息的保护问题，“侵权责任编”对网络侵权作出了比较严格的规定，这些都是法律和科技共治的制度保障。^((31))诚信治理也为法律和科技共治提供了一个范例。在传统社会，诚信治理依靠的是法律和道德手段；在智能社会，科技发挥着不可替代的作用。大数据的存储、处理和应用能力的快速发展，云计算和区块链技术的不断成熟，都为维护社会诚信、建设信用社会提供了坚实的技术支持。只要一个人的行为是通过电子途径完成的，就会留痕、被完整记录并保存下来。每个人关乎他人和社会利益的活动信息，尤其是缺失诚信、违约侵权的不良行为和活动等都会被记录在案，无法涂改、遗忘不了、删除不能，这就倒逼人们在智能技术的监督下诚实守信、谨言慎行、远离邪恶。特别是区块链技术广泛应用后，各种信息永久保存，就更迫使人们自觉规范行为、树立诚信形象、建立个人良好信用记录。可见，许多法律和道德禁止不住的失信言行却被智能科技管起来了，科技让生活更美好的同时，也使社会更文明。构建以科学、人本、公正、包容、共治为核心要素和鲜明标识的法理型法律秩序，是破解智能社会“治理赤字”的当务之急，也是智能社会行稳致远的根本保障。^((32))


    需要指出的是，规划在科技与法律的交融中起到了举足轻重的作用。当下，我国不仅具有在大数据、云计算、人工智能、区块链、互联网、物联网、电子商务等领域的科技优势，还有中国特色社会主义的制度优势。可以预见，当科技与制度深度融合之时，我国的制度优势和科技优势所特有的规划能级必将形成新的综合优势，使智能社会治理产生巨大效能。国家法律法规数据库的建设，跨部门大数据办案平台的运行，杭州、北京、广州互联网法院的创建，全国各地智慧法院、智慧检务、智慧公安的建设，中国裁判文书网全面运行，都表明中国之治正借助新科技优势而取得无与伦比的治理效能。


    在智能社会推进科技与法律共治，要充分发挥技术防控的基础性作用和法律防控的保障性作用，把两种防控机制有机结合，使代码规制与法律规则、算法与国法相辅相成，这既能提升智能科技风险防控质量和效率，又能以法律的肯定性、强制力和权威性强化科技人员的防控责任，使风险防控责任落实到人、落实到位。


    人工智能导致的自动化决策，引发人们对法治正当性的质疑。比如，`COMPAS`是一个由私营企业编写出的、能够帮助司法人员作出判断的系统。通过向被告询问 137
    个问题，并搜索他曾经的犯罪记录，得到一堆数字，然后经过公司设定的复杂算法，最终得出包括他的孤僻程度、犯罪型人格的得分、性格稳定度、危险指数等。`COMPAS`系统在美国很多个州中都被使用，其中使用得最广泛的是威斯康星州。从
    2012 年起，威斯康星州就鼓励在全州所有法庭上都用`COMPAS`系统，在监狱系统中也使用它给犯人作出评估，协助司法人员完成从行刑到假释的判断，该系统引发了人们的质疑。在法治领域打开算法黑箱，追求智能技术的可信赖，成为法治系统的最为紧迫的基本任务，同时也促使法治系统扩展，提前介入技术的开发并注重过程规则的设计。


    ### 四、人工智能法治应用的沿革


    人工智能法治应用的发展直接受到人工智能发展的影响，而人工智能的发展并不是一帆风顺的，历经了萌芽、初始阶段，经历了高潮、低谷、再高潮的波浪式前进的发展过程，每一次低谷之后，都会有一个新高潮，不断推动人工智能走向一个新时代。^((33))在人工智能法治应用的各个领域，人工智能司法应用的表现最为突出。目前，人工智能立法应用还处于萌芽阶段，人工智能执法应用处于高速发展阶段，人工智能法律服务处于摸索前进阶段，相对于前三者，人工智能司法应用已处于成熟完善阶段，其发展沿革最具代表性。此外，人工智能司法应用在法治应用的全流程中也处于关键环节，是直接裁判当事人权利义务关系的核心，其中，以电子诉讼、司法大数据为核心的智慧法院建设的表现最为突出。所以，这里以法院信息化`1.0`、`2.0`、`3.0`三个阶段为例予以分析。


    #### （一）以“数字化”为核心的法院信息化 1.0


    1996 年开始的法院信息化`1.0`以“数字化”为核心，关注的是纸质文档向电子文档的转换。法院信息化`1.0`是法院内部基础建设的阶段，以提高内部办公和管理效率为主要目的，以电脑办公和司法统计（管理）信息化为主要特征，以电脑单机和内部局域网为主要应用场景，尚未干预司法活动本身。^((34))


    #### （二）以“网络化”为核心的法院信息化 2.0


    法院信息化`2.0`以“网络化”为核心，关注的是法院工作方式由线下到线上的转换。法院信息化`2.0`是加快建设法院外网并启动智慧法院建设的阶段，以办案自动化、网络化和数据互联互通为主要特征，重点开始转向改进审判管理和以当事人为中心的司法服务，并全面应用于互联网，局域网不再是主要的应用场景。2006
    年前后，部分地方法院开始探索网上审判，即利用电子邮件、`QQ`聊天软件等审理异地或跨国案件。^((35))


    #### （三）以“智能化”为核心的法院信息化 3.0


    2015 年开始的法院信息化`3.0`以“智能化”为核心，在数字化与网络化基础之上，通过大数据与人工智能技术的应用来实现审判的智能化。法院信息化`3.0`是“嵌入式数字化管理”和“司法+互联网”的阶段，着力提升智慧法院的服务性、全面性、共享性和均衡性，通过重塑司法程序、再造诉讼流程，使法院的组织结构、诉讼活动被塑造出全新“形态”：虚拟的法庭代替了物理的法院，诉讼由线下转到线上，由“面对面”“共时”“同步”变成“网对网”“错时”“异步”。^((36))


    最高人民法院于 2015 年 7 月首次提出“智慧法院”这一概念，并于 2017 年 4 月印发《最高人民法院关于加快建设智慧法院的意见》，智慧法院建设于当年即取得显著成效，2018
    年人工智能司法应用建设持续发力，在人工智能辅助审判执行和司法管理、智能化助力司法公开和智能化推动网络纠纷化解等领域，智慧法院由初步形成向全面建设迈进。^((37))


    ## 第三节 人工智能法治应用的核心议题


