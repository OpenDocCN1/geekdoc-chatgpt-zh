- raw: "人工智能法律服务赋予法律服务以人工智能的技术支持，人工智能法律服务的产生源自两种动力：其一，法律理论与实践发展的需求。在法律对人工智能的风险分析与规避进行研究的过程中，我们对人工智能的应用有了更加深入的理解，从法律视角出发的对人工智能的研究也更加丰富与完善。与此同时，随着法律文献和司法纠纷的越加增多，法律服务者的工作和心理压力不断增大，迫切需要新技术的支持与辅助。其二，人工智能应用领域扩展的必然。人工智能已经突破了单纯的计算机研究领域，在数学、医学、心理学、仿生学等领域都有了新的发展，繁杂的法律数据、准确的法律推理、精细的法律检索都需要消耗大量的人力、物力、财力，而人工智能恰巧能利用其技术优势突破现有障碍，提高法律实践的效率。\n\
    \n将人工智能领域的技术成果应用于法律行业，建立法律决策计算模型，可以使人工智能实现法律推理。人工智能是利用计算机来模拟人的某些思维过程和智能行为的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机，旨在使计算机能实现更高层次的应用。“法律+AI技术”有三种可能的推理建模方案：一是归责推理方案，即利用演绎推理将法律规范编码成法律解释库和案件事实库，以实现自动法律演绎推理；二是案例推理方案，即利用类比推理将案例编码成法律解释库和案件事实库，以实现自动法律类比推理；三是数据推理方案，即利用归纳推理将有价值的法律信息编码成法律解释库和案件事实库，以实现自动法律大数据推理。\n\
    \n人工智能在法律领域的应用场景主要有：智能法律咨询、智能法律检索、类案检索、案件预测、智能合同分析、智能合同起草、文书审阅、智能业务辅导等，其能够提高法律事务处理效率，降低法律门槛。\n\
    \n代表性参与者包括综合技术及解决方案提供商如腾讯、阿里和科大讯飞等，也包括专业的法律信息化企业如华宇软件和华夏电通、擎盾等。国外的法律人工智能公司则更多，比如，美国的合同分析平台LinkSquares发布了人工智能合同生成器，该生成器可实现自主模板起草，审查和修改及审批，所有这些流程步骤，都将被整合到一个工作流程中。\n\
    \n##### 1．国外人工智能法律服务的发展\n\n20世纪80年代，美国的人工智能专家以“人工智能与法律”为研究主题，展开了深入的探讨与分析，伯曼教授与哈夫纳教授是这一领域的奠基人和开拓者，他们为促进法律的人工智能化，于1987年召开学术会议，并于1992年组织专门的研究学会，还在1993年创设《人工智能与法律》刊物，从而激起了学术界的研究热情。\n\
    \n国外人工智能系统的发展也越来越成熟，2015年美国的机器人律师“ROSS”就是一款整理信息数据的人工智能软件，2016年英国开发了一款专门处理停车罚单的上诉程序，2017年俄罗斯的Sberbank银行引进了处理各种投诉信件的机器人律师。上述例子也仅仅是冰山一角，人工智能系统正在渗透法律的方方面面。\n\
    \n##### 2．我国人工智能法律服务的发展\n\n自2015年起，我国每年都有有关人工智能的法律政策新举措出台。2015年5月20日，国务院印发《中国制造2025》，同年7月5日，又印发《关于积极推进“互联网+”行动的指导意见》，这两份文件将中国制造的主攻方向定为“智能制造”，即推动智能机器人、物联网、云计算技术的应用和数据共享。2016年7月28日，国务院印发《“十三五”国家科技创新规划》，主张在人工智能领域重点发展数据驱动的类人智能技术方法，同年12月19日，国务院印发《“十三五”国家战略性新兴产业发展规划》，要求发展人工智能，培育人工智能的产业生态，推动人工智能的规模化应用。2017年1月16日，中共中央办公厅、国务院办公厅印发了《关于促进移动互联网健康有序发展的意见》，加紧人工智能、虚拟现实等关键技术布局，以尽快实现部分前沿和颠覆性技术的突破。\n\
    \n在中央政策的指导下，地方也纷纷通过采取具体的举措来搭建人工智能的发展平台。在法律领域，2016年贵州法院创造性地开展司法辅助系统的开发利用工作，借助人工智能辅助工具提升司法工作人员的业务能力和工作效率。2016年“法律谷”推出一款服务律师团体和普通消费者的检索产品，通过在“法律谷”输入案情，便可查询与之类似的法院审理的案例和推荐的律师。“理迈”是一款可以提供法律信息监控服务的智能产品，它可以帮助用户快速精选相关案例，并可以对相关案例进行分类、统计、图表呈现，帮助用户理解规范、防范法律风险、形成解决方案，从而潜在提升用户的竞争力。“206系统”于2017年7月亮相，这套系统以审判为中心进行诉讼管理，规范办案程序标准和证据使用标准，有利于提升办案的质量和效率，减少司法的任意性。2016年6月，杭州铁路运输法院雇用了一名机器人员工“小G”，负责智能配送。同年12月24日，广西奎路律师事务所推出首个广西法律机器人“南宁市刑期预测系统”，这一系统利用真实的海量判决书，通过数据分析的方式预测案件的结果。2016年10月15日，“法小淘”在杭州云栖大会上演示了其功能，它可以根据案件的口头描述与询问人进行对话，并分析案件的案由、索赔金额、推荐律师等。“吴小甪”“法狗狗”等人工智能系统也纷纷上线，服务司法领域和社会人群。\n\
    \n### 二、人工智能法律服务应用的重大意义\n\n##### （一）法律服务资源配置方式发生变化\n\n传统的法律服务资源配置方式存在随意性、盲目性的特点，供需双方的匹配常依赖熟人推介或者律师事务所、律师的宣传。但法律服务行业的专业性造成供需双方强烈的信息不对称，对于需方来说，对律师的选择在一定程度上带有赌博性质；而对于供方的律师事务所和律师来说，一方面其面对资源过剩却难觅高质量客户的问题，另一方面面对缺乏有效手段挖掘潜在客户的问题。资源配置方式的随意性、盲目性造成了法律服务资源的浪费，进而导致整个法律服务行业效率不高，法律服务行业的专业化发展受阻。\n\
    \n人工智能的应用能够优化法律服务资源的配置。过去法律服务资源配置中存在最大的问题在于，法律服务行业的专业性造成了供需双方之间的信息壁垒，而法律大数据的运用则有利于突破该壁垒，减少法律服务资源的闲置，缩短配置周期，并提高配置质量。以中国裁判文书网的检索功能为例，当事人可以按照案件的案由、法院名称、案件类型、律师事务所名称、律师姓名等关键词进行单一或者组合式检索，缩小选择的范围。裁判文书的网上公开，不仅为当事人提供了数据化筛选律师的途径，也催生了法律服务评价体系的重构，律师承办案件的数量、类型、结果等重要信息的公示，在一定程度上对律师的业务水平进行了公开，当事人可以通过相关信息甄别律师的执业水平，提高匹配的精确度。相应地，律师也可以运用人工智能进行搜索分析，实现深层次的客户挖掘，如通过大规模检索裁判文书，分析某一地区某一类型案件，进而掌握经常涉诉而又无代理人的当事人的信息，又如通过分析发现某时间段某类型案件量突然增多，进而将关注点放在与该类型案件有关的当事人上。第三方法律服务平台通过运用数据分析统计，也可以给供需双方提供更多磋商的机会，从而提高法律服务资源的利用率。不同于传统的推介，第三方法律服务平台使用大数据的商业应用模式，采集供需双方的用户信息，将用户的关注领域、使用习惯、律师的专业方向等信息进行整合，实现高度相关的律师和客户之间的互相推送，从而实现利用数据寻找目标的高效匹配模式。\n\
    \n##### （二）法律服务市场生态位的重构\n\n在市场经济背景下，各行业的业态都遵循一定的发展规律，既受市场普遍规律的影响，也受特定行业规律的制约，法律服务行业亦不例外。借用生物学的概念，法律服务行业也有自己的生态系统，不同的律师事务所、律师位居不同的生态位，法律服务客户资源在一定时段内被不同的从业者所控制，也有所谓“优劣”之分，法律服务也有所谓“高低”之别，其优劣高低的差异很大程度上是由法律服务收益的效率决定的。传统上，优质客户委托的案件标的额大、律师费提成比例高，以大型企业的商事案件为代表。相反，普通客户委托案件所产生的收益则相对较小，单位案件的服务收益率较低。优质客户资源总是稀缺的，一般由少部分律师掌握，他们占据着所谓“较高”的生态位，而其他大部分律师则分布在所谓“中低”的生态位。\n\
    \n法律服务客户资源的所谓“优劣”“高低”之分促使从业者更愿意将目标瞄准高生态位的客户，希望摆脱“中低”生态位，其主要原因在于，在传统执业模式下，律师办理案件时基本是以个人为单位的，个人精力的有限性与案件的复杂性充满矛盾，单位案件的收益率则显得尤为重要。所谓“低端”业务，并非指案件本身没有价值，只是投入较高而产出较低。面对单位产出较低的案件，律师如果能够提高办案效率，实现类型化案件的批量办理，那么传统上法律服务客户资源的“优劣”“高低”之分将变得不再那样明显。而人工智能技术的助推恰恰能够给以上情况带来改变，通过对人工智能技术的运用，律师能够从宏观上把握某一类型案件的规律，降低时间成本。将法律关系相对简单但程序繁杂的案件交由办案团队实现流水作业，可将过去在办案过程中过多的投入降到最低，降低成本提升单位案件的收益率，从而实现“中低端”生态位新的发展模式和盈利模式。随之，法律服务行业将会分化出两种行之有效的发展模式，一种是利用新技术降低成本，集约化办理类型化的批量案件，另一种是专注于办理本就相对复杂、单位收益率高的案件。在两种不同的发展模式下，律师均能深度挖掘不同生态位的价值，促进法律服务行业生态结构的重构，实现行业的良性发展。\n\
    \n##### （三）执业思维模式发生改变\n\n我国是成文法国家，演绎推理是司法活动中最重要的推理方式，律师在办理案件过程中最常运用的就是演绎推理。归纳推理和类比推理在我国司法活动中运用的比例不高，除了法律制度和法文化传统方面的影响外，传统样本采集技术方面的固有缺陷也是一个重要原因。无论是归纳推理还是类比推理，都涉及对既有相似案例的样本采集。由于待采集的样本规模无限大，单纯用人力几乎不可能实现对样本的大规模采集，也无法进行多维度分析，同时用有限的样本推理出的结论又存在很大的不确定性，充其量只能提供部分参考价值。而人工智能技术的运用则能够突破样本采集方面的局限，极大地扩展样本采集的范围，降低归纳推理和类比推理带来的不确定性。\n\
    \n从演绎推理到归纳推理、类比推理，是思维模式的转变，即从依赖因果关系到寻找相关关系的转变。运用演绎推理，通过三段论的方式分析案件体现了因果关系思维，理论上其最大的优点是确定性，即如果作为大前提的法律规则是固定的，那么作为小前提的事实一旦符合大前提的条件，结论则应当是确定无疑的。但是，因果关系思维更加适用于规模小、封闭性强的系统，对于开放性强、变量大的系统，因果关系思维则显得捉襟见肘。“对于开放复杂的巨系统，传统的因果分析难以奏效，因为系统中各个组成部分之间相互有影响，可能互为因果，因果关系隐藏在整个系统之中。现在的‘因’可能是过去的‘果’，此处的‘果’也可能是别处的‘因’，因果关系本质上是一种相互纠缠的相关性。”法律解决的是复杂的社会问题，法律的滞后性和社会生活的复杂性经常使演绎推理无法发挥有效的作用，法律解释和客观世界的双重不确定性常导致演绎推理难以奏效。运用归纳推理和类比推理分析案件，则突破了因果关系的思维模式，其核心在于寻找与当前案例相关的样本，从海量相似样本中提炼出需要的结果，而无需纠结产生结果的原因是什么。\n\
    \n法律大数据所隐含的信息能够帮助律师突破思维盲区，客观存在的数据可提供意想不到的信息，激发思维的灵感。样本的规模化，弥补了归纳推理和类比推理的缺陷。运用相关关系思维预测案件走向准确度将大大提升。人工智能既是一项全新的技术手段，也代表一种全新的思维模式，目前在我国法律实务中，检索相似案例已经成为律师办案过程中的一个重要环节，律师援引相似案例的现象越来越普遍。这说明在人工智能技术的影响下，我国律师办案的思维模式已经开始发生改变，随着人工智能技术的进一步完善，这一趋势将会更加明显。\n\
    \n##### （四）催生新的服务类型\n\n人工智能的运用不仅惠及诉讼业务，也会催生新的服务类型，由于数据采集、存储、分析技术水平获得了大幅提升，专门以法律数据的分析、整合为服务内容就成为可能，拥有相关资源的律师事务所或者法律服务电商平台可以运用新技术创设新的服务模式，提供新的服务类型。会有更多的律师事务所将法律数据的整合、分析作为新的业务；法律数据涉及专业法律知识，而律师事务所则可以充分利用其专业理论与实务方面的优势，对数据的分类处理提前作出规划，使法律数据分析、整合这项新的业务更加符合市场需求；法律服务的核心竞争力将不再局限于办案水平，对法律数据的综合分析和运用能力也是核心竞争力的一项重要内容，掌握更加先进的人工智能技术，就会在竞争中更有机会取得领先地位。\n\
    \n### 三、人工智能法律服务的优势分析\n\n##### （一）提高案件结果预测的准确度\n\n当事人与律师就案件洽谈时，最关心的是案件可能的走向和结果，成案与否主要取决于律师对案件走向和结果的分析，分析过程所反映出的专业素养和执业经验是成案的核心要素。而律师在专业法律知识层面的认知水平在一定程度上会影响当事人的信任度，律师如果单纯从法律法规入手分析案件，并不一定会取得良好的效果。律师分析案件的常规方式是语言表达，而包含专业法律概念的语言具有一定的抽象性，欠缺直观。律师对案件结果的预测建立在个人执业经验之上，主观性强，难免会出现偏差。法律大数据在律师洽谈案件中的作用是显著的，大数据的核心价值在于预测，数据统计结果的可视化呈现能够弥补抽象言语和律师经验方面的缺陷。律师通过关联案件检索，将同类或者相似案件的争议焦点、主要裁判观点、原被告胜诉率等信息分类整合后呈现给当事人及将抽象的语言表达转化为具体且直观的数据表达，有助于提升案件预测的准确度，从而提高成案率。[^((1))](#chapter7.xhtml#jz_01_1005)\n\
    \n##### （二）提高模拟庭审的质量\n\n模拟庭审是针对待开庭目标案件的预先演练，通过模拟庭审律师可以直观地感受案件可能的走向，更加准确地把握案件的争议焦点，去除思维的盲点。模拟庭审比单纯通过分析法条和案情所进行的思维实验更高效，更易帮助律师切中案件要害。在模拟庭审中，律师需要总结案件可能出现的变数，通过预先制定诉讼方案、运用诉讼技巧将变数带来的负面效应降至最低，从而实现本方当事人的利益。模拟庭审所使用的案件样本尤为重要，案件模型中各种要素的不同组合会产生不同的效果，对不同要素的调控可以从不同角度锻炼律师的应变能力，增强律师对相同或相关案件的理解。调控案件模型的要素依赖于可参考的案件样本，大数据带来的充足样本能够起到重要作用，大数据本身的多维度特点能够提供足够的调控、组合空间，“数据的总和比部分更有价值，当我们将多个数据集的总和重组在一起时，重组总和本身的价值也比单个总和更大”。通过检索案件积累充足的样本，分析提取案件中的要素，设置案件的模型，可以扩充模拟庭审的信息量，提高模拟庭审的质量。\n\
    \n##### （三）减少重复劳动，形成高效智能办案方式\n\n2017年国务院印发的《新一代人工智能发展规划》提出推进社会治理智能化，其中包含建设智慧法庭的要求。高效化、智能化是司法的发展趋势。法律服务行业的发展与司法改革息息相关，当前，恰逢国家战略转型，应适时利用大数据、人工智能等新技术改进传统执业思路，形成高效、智能的新型办案方式。法律服务行业的各个工作环节均包含事务性工作部分和创造性工作部分，其中事务性工作创造的价值较低，律师仍要投入巨大精力，进行大量重复劳动，这使律师办案的效率和精确度均受到影响。在传统的办案方式中，律师缺乏高效的数据查询、整合手段，工作中相当一部分时间被事务性工作所占用，无法全身心投入创造性更高的智慧劳动中。法律大数据的普及和应用则可以为律师办案提供丰富的信息来源，律师可以依托法律大数据，形成高效、智能的新型办案方式。将事务性工作和创造性工作分别打造为标准化工作方案和非标准化工作方案，可以有效降低事务性工作的时间占用。律师可以通过大数据平台整合资源，如创设法律文书模板、可视化流程图、尽职调查报告样本等内容，将类型化案件中的普遍要素抽离，形成标准化办案流程，实现事务性工作和创造性工作的分流。以大数据为基础的人工智能系统在审查合同、智能阅卷、法律文书自动生成等方面也有巨大的应用空间，可以帮助律师有效减少投入、降低成本。如2018年2月，由以色列法律科技公司Law\
    \ Geex研发的法律AI平台与20名经验丰富的律师进行一场人机竞赛，比赛内容是在4小时内审查5项保密协议（NDA），并确定30个法律问题，问题涉及仲裁、保密和赔偿。比赛的结果是，人类律师的平均准确率达85%，而AI平台的准确率达95%；AI平台在26秒内完成的任务，人类律师平均需要92分钟。\n\
    \n##### （四）降低个性化法律服务成本\n\n标准化服务是法律服务行业追求的重要内容，旨在提高办案效率，减少重复劳动，节约时间成本。但标准化办案只适用于能够重复实践的部分，事实上，每个案件的情况各不相同，标准化之外的部分是案件更重要的部分。律师为客户提供的更加细致入微的个性化服务，不仅建立在对案情的了解之上，也建立在对客户本身信息的了解之上，尤其是为大型企业提供的非诉型法律服务，具有很强的专属性。但高质量、专属性的法律服务需要律师投入大量的时间和精力，因为个性化的法律服务建立在对当事人具体信息的掌握之上，而当事人的信息并不易掌握，律师需要在工作磨合中，运用法律思维逐渐挖掘潜在的、有价值的客户信息，调整服务思路，最终制定最适合的服务方案，因此个性化的法律服务成本较高。而法律大数据的普及则提供了便捷、全面的信息获取方式，律师可以利用法律大数据进行深层次挖掘，获得客户本身也不能完全掌握的信息，这不仅能使律师全面洞察客户存在的法律风险，也能够在很大程度上降低个性化法律服务的成本。\n\
    \n## 第二节  \n\n人工智能法律服务应用的实践\n\n### 一、我国人工智能法律服务应用的实践\n\n我国人工智能法律服务应用在公证服务、律师辅助、企业法务、普法宣传等各领域均有发展，应用形式包括区块链公证、在线数据库、企业合规智能化、普法机器人等。国外人工智能法律服务应用起步较早，其在发展的早期阶段以网络服务和智能软件为主要形式，当前亦在开展更为深入和广泛的探索，包括法律人工智能算法的开发与升级、数据库的优化等，并且正通过简化操作、平台化等方式不断提升面向用户的服务质量，扩大服务普及范围。另外还应注意到，人工智能给用户个人信息与隐私安全带来威胁、算法黑箱导致歧视以及人工智能对传统行业带来冲击等方面的法律风险也逐渐显现。\n\
    \n##### （一）技术侧重分析\n\n##### 1．区块链法律服务应用\n\n多地正在开展区块链公证先行试点，建立地方性、区域性“联盟链”，其他未正式上线区块链公证服务的地区也正在将相关工作纳入法律服务智能化发展计划。东部地区特别是江浙一带多领域、多部门的区块链法律服务广泛分布在各主要城市，取得了较好成效。\n\
    \n##### 2．大数据法律服务应用"
  fmt: '

    人工智能法律服务赋予法律服务以人工智能的技术支持，人工智能法律服务的产生源自两种动力：其一，法律理论与实践发展的需求。在法律对人工智能的风险分析与规避进行研究的过程中，我们对人工智能的应用有了更加深入的理解，从法律视角出发的对人工智能的研究也更加丰富与完善。与此同时，随着法律文献和司法纠纷的越加增多，法律服务者的工作和心理压力不断增大，迫切需要新技术的支持与辅助。其二，人工智能应用领域扩展的必然。人工智能已经突破了单纯的计算机研究领域，在数学、医学、心理学、仿生学等领域都有了新的发展，繁杂的法律数据、准确的法律推理、精细的法律检索都需要消耗大量的人力、物力、财力，而人工智能恰巧能利用其技术优势突破现有障碍，提高法律实践的效率。


    将人工智能领域的技术成果应用于法律行业，建立法律决策计算模型，可以使人工智能实现法律推理。人工智能是利用计算机来模拟人的某些思维过程和智能行为的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机，旨在使计算机能实现更高层次的应用。“法律+AI技术”有三种可能的推理建模方案：一是归责推理方案，即利用演绎推理将法律规范编码成法律解释库和案件事实库，以实现自动法律演绎推理；二是案例推理方案，即利用类比推理将案例编码成法律解释库和案件事实库，以实现自动法律类比推理；三是数据推理方案，即利用归纳推理将有价值的法律信息编码成法律解释库和案件事实库，以实现自动法律大数据推理。


    人工智能在法律领域的应用场景主要有：智能法律咨询、智能法律检索、类案检索、案件预测、智能合同分析、智能合同起草、文书审阅、智能业务辅导等，其能够提高法律事务处理效率，降低法律门槛。


    代表性参与者包括综合技术及解决方案提供商如腾讯、阿里和科大讯飞等，也包括专业的法律信息化企业如华宇软件和华夏电通、擎盾等。国外的法律人工智能公司则更多，比如，美国的合同分析平台LinkSquares发布了人工智能合同生成器，该生成器可实现自主模板起草，审查和修改及审批，所有这些流程步骤，都将被整合到一个工作流程中。


    ## 1．国外人工智能法律服务的发展

    20世纪80年代，美国的人工智能专家以“人工智能与法律”为研究主题，展开了深入的探讨与分析，伯曼教授与哈夫纳教授是这一领域的奠基人和开拓者，他们为促进法律的人工智能化，于1987年召开学术会议，并于1992年组织专门的研究学会，还在1993年创设《人工智能与法律》刊物，从而激起了学术界的研究热情。


    国外人工智能系统的发展也越来越成熟，2015年美国的机器人律师“ROSS”就是一款整理信息数据的人工智能软件，2016年英国开发了一款专门处理停车罚单的上诉程序，2017年俄罗斯的Sberbank银行引进了处理各种投诉信件的机器人律师。上述例子也仅仅是冰山一角，人工智能系统正在渗透法律的方方面面。


    ## 2．我国人工智能法律服务的发展

    自2015年起，我国每年都有有关人工智能的法律政策新举措出台。2015年5月20日，国务院印发《中国制造2025》，同年7月5日，又印发《关于积极推进“互联网+”行动的指导意见》，这两份文件将中国制造的主攻方向定为“智能制造”，即推动智能机器人、物联网、云计算技术的应用和数据共享。2016年7月28日，国务院印发《“十三五”国家科技创新规划》，主张在人工智能领域重点发展数据驱动的类人智能技术方法，同年12月19日，国务院印发《“十三五”国家战略性新兴产业发展规划》，要求发展人工智能，培育人工智能的产业生态，推动人工智能的规模化应用。2017年1月16日，中共中央办公厅、国务院办公厅印发了《关于促进移动互联网健康有序发展的意见》，加紧人工智能、虚拟现实等关键技术布局，以尽快实现部分前沿和颠覆性技术的突破。


    在中央政策的指导下，地方也纷纷通过采取具体的举措来搭建人工智能的发展平台。在法律领域，2016年贵州法院创造性地开展司法辅助系统的开发利用工作，借助人工智能辅助工具提升司法工作人员的业务能力和工作效率。2016年“法律谷”推出一款服务律师团体和普通消费者的检索产品，通过在“法律谷”输入案情，便可查询与之类似的法院审理的案例和推荐的律师。“理迈”是一款可以提供法律信息监控服务的智能产品，它可以帮助用户快速精选相关案例，并可以对相关案例进行分类、统计、图表呈现，帮助用户理解规范、防范法律风险、形成解决方案，从而潜在提升用户的竞争力。“206系统”于2017年7月亮相，这套系统以审判为中心进行诉讼管理，规范办案程序标准和证据使用标准，有利于提升办案的质量和效率，减少司法的任意性。2016年6月，杭州铁路运输法院雇用了一名机器人员工“小G”，负责智能配送。同年12月24日，广西奎路律师事务所推出首个广西法律机器人“南宁市刑期预测系统”，这一系统利用真实的海量判决书，通过数据分析的方式预测案件的结果。2016年10月15日，“法小淘”在杭州云栖大会上演示了其功能，它可以根据案件的口头描述与询问人进行对话，并分析案件的案由、索赔金额、推荐律师等。“吴小甪”“法狗狗”等人工智能系统也纷纷上线，服务司法领域和社会人群。


    ## 二、人工智能法律服务应用的重大意义

    ### （一）法律服务资源配置方式发生变化

    传统的法律服务资源配置方式存在随意性、盲目性的特点，供需双方的匹配常依赖熟人推介或者律师事务所、律师的宣传。但法律服务行业的专业性造成供需双方强烈的信息不对称，对于需方来说，对律师的选择在一定程度上带有赌博性质；而对于供方的律师事务所和律师来说，一方面其面对资源过剩却难觅高质量客户的问题，另一方面面对缺乏有效手段挖掘潜在客户的问题。资源配置方式的随意性、盲目性造成了法律服务资源的浪费，进而导致整个法律服务行业效率不高，法律服务行业的专业化发展受阻。


    人工智能的应用能够优化法律服务资源的配置。过去法律服务资源配置中存在最大的问题在于，法律服务行业的专业性造成了供需双方之间的信息壁垒，而法律大数据的运用则有利于突破该壁垒，减少法律服务资源的闲置，缩短配置周期，并提高配置质量。以中国裁判文书网的检索功能为例，当事人可以按照案件的案由、法院名称、案件类型、律师事务所名称、律师姓名等关键词进行单一或者组合式检索，缩小选择的范围。裁判文书的网上公开，不仅为当事人提供了数据化筛选律师的途径，也催生了法律服务评价体系的重构，律师承办案件的数量、类型、结果等重要信息的公示，在一定程度上对律师的业务水平进行了公开，当事人可以通过相关信息甄别律师的执业水平，提高匹配的精确度。相应地，律师也可以运用人工智能进行搜索分析，实现深层次的客户挖掘，如通过大规模检索裁判文书，分析某一地区某一类型案件，进而掌握经常涉诉而又无代理人的当事人的信息，又如通过分析发现某时间段某类型案件量突然增多，进而将关注点放在与该类型案件有关的当事人上。第三方法律服务平台通过运用数据分析统计，也可以给供需双方提供更多磋商的机会，从而提高法律服务资源的利用率。不同于传统的推介，第三方法律服务平台使用大数据的商业应用模式，采集供需双方的用户信息，将用户的关注领域、使用习惯、律师的专业方向等信息进行整合，实现高度相关的律师和客户之间的互相推送，从而实现利用数据寻找目标的高效匹配模式。


    ### （二）法律服务市场生态位的重构

    在市场经济背景下，各行业的业态都遵循一定的发展规律，既受市场普遍规律的影响，也受特定行业规律的制约，法律服务行业亦不例外。借用生物学的概念，法律服务行业也有自己的生态系统，不同的律师事务所、律师位居不同的生态位，法律服务客户资源在一定时段内被不同的从业者所控制，也有所谓“优劣”之分，法律服务也有所谓“高低”之别，其优劣高低的差异很大程度上是由法律服务收益的效率决定的。传统上，优质客户委托的案件标的额大、律师费提成比例高，以大型企业的商事案件为代表。相反，普通客户委托案件所产生的收益则相对较小，单位案件的服务收益率较低。优质客户资源总是稀缺的，一般由少部分律师掌握，他们占据着所谓“较高”的生态位，而其他大部分律师则分布在所谓“中低”的生态位。


    法律服务客户资源的所谓“优劣”“高低”之分促使从业者更愿意将目标瞄准高生态位的客户，希望摆脱“中低”生态位，其主要原因在于，在传统执业模式下，律师办理案件时基本是以个人为单位的，个人精力的有限性与案件的复杂性充满矛盾，单位案件的收益率则显得尤为重要。所谓“低端”业务，并非指案件本身没有价值，只是投入较高而产出较低。面对单位产出较低的案件，律师如果能够提高办案效率，实现类型化案件的批量办理，那么传统上法律服务客户资源的“优劣”“高低”之分将变得不再那样明显。而人工智能技术的助推恰恰能够给以上情况带来改变，通过对人工智能技术的运用，律师能够从宏观上把握某一类型案件的规律，降低时间成本。将法律关系相对简单但程序繁杂的案件交由办案团队实现流水作业，可将过去在办案过程中过多的投入降到最低，降低成本提升单位案件的收益率，从而实现“中低端”生态位新的发展模式和盈利模式。随之，法律服务行业将会分化出两种行之有效的发展模式，一种是利用新技术降低成本，集约化办理类型化的批量案件，另一种是专注于办理本就相对复杂、单位收益率高的案件。在两种不同的发展模式下，律师均能深度挖掘不同生态位的价值，促进法律服务行业生态结构的重构，实现行业的良性发展。


    ### （三）执业思维模式发生改变

    我国是成文法国家，演绎推理是司法活动中最重要的推理方式，律师在办理案件过程中最常运用的就是演绎推理。归纳推理和类比推理在我国司法活动中运用的比例不高，除了法律制度和法文化传统方面的影响外，传统样本采集技术方面的固有缺陷也是一个重要原因。无论是归纳推理还是类比推理，都涉及对既有相似案例的样本采集。由于待采集的样本规模无限大，单纯用人力几乎不可能实现对样本的大规模采集，也无法进行多维度分析，同时用有限的样本推理出的结论又存在很大的不确定性，充其量只能提供部分参考价值。而人工智能技术的运用则能够突破样本采集方面的局限，极大地扩展样本采集的范围，降低归纳推理和类比推理带来的不确定性。


    从演绎推理到归纳推理、类比推理，是思维模式的转变，即从依赖因果关系到寻找相关关系的转变。运用演绎推理，通过三段论的方式分析案件体现了因果关系思维，理论上其最大的优点是确定性，即如果作为大前提的法律规则是固定的，那么作为小前提的事实一旦符合大前提的条件，结论则应当是确定无疑的。但是，因果关系思维更加适用于规模小、封闭性强的系统，对于开放性强、变量大的系统，因果关系思维则显得捉襟见肘。“对于开放复杂的巨系统，传统的因果分析难以奏效，因为系统中各个组成部分之间相互有影响，可能互为因果，因果关系隐藏在整个系统之中。现在的‘因’可能是过去的‘果’，此处的‘果’也可能是别处的‘因’，因果关系本质上是一种相互纠缠的相关性。”法律解决的是复杂的社会问题，法律的滞后性和社会生活的复杂性经常使演绎推理无法发挥有效的作用，法律解释和客观世界的双重不确定性常导致演绎推理难以奏效。运用归纳推理和类比推理分析案件，则突破了因果关系的思维模式，其核心在于寻找与当前案例相关的样本，从海量相似样本中提炼出需要的结果，而无需纠结产生结果的原因是什么。


    法律大数据所隐含的信息能够帮助律师突破思维盲区，客观存在的数据可提供意想不到的信息，激发思维的灵感。样本的规模化，弥补了归纳推理和类比推理的缺陷。运用相关关系思维预测案件走向准确度将大大提升。人工智能既是一项全新的技术手段，也代表一种全新的思维模式，目前在我国法律实务中，检索相似案例已经成为律师办案过程中的一个重要环节，律师援引相似案例的现象越来越普遍。这说明在人工智能技术的影响下，我国律师办案的思维模式已经开始发生改变，随着人工智能技术的进一步完善，这一趋势将会更加明显。


    ### （四）催生新的服务类型

    人工智能的运用不仅惠及诉讼业务，也会催生新的服务类型，由于数据采集、存储、分析技术水平获得了大幅提升，专门以法律数据的分析、整合为服务内容就成为可能，拥有相关资源的律师事务所或者法律服务电商平台可以运用新技术创设新的服务模式，提供新的服务类型。会有更多的律师事务所将法律数据的整合、分析作为新的业务；法律数据涉及专业法律知识，而律师事务所则可以充分利用其专业理论与实务方面的优势，对数据的分类处理提前作出规划，使法律数据分析、整合这项新的业务更加符合市场需求；法律服务的核心竞争力将不再局限于办案水平，对法律数据的综合分析和运用能力也是核心竞争力的一项重要内容，掌握更加先进的人工智能技术，就会在竞争中更有机会取得领先地位。


    ## 三、人工智能法律服务的优势分析

    ### （一）提高案件结果预测的准确度

    当事人与律师就案件洽谈时，最关心的是案件可能的走向和结果，成案与否主要取决于律师对案件走向和结果的分析，分析过程所反映出的专业素养和执业经验是成案的核心要素。而律师在专业法律知识层面的认知水平在一定程度上会影响当事人的信任度，律师如果单纯从法律法规入手分析案件，并不一定会取得良好的效果。律师分析案件的常规方式是语言表达，而包含专业法律概念的语言具有一定的抽象性，欠缺直观。律师对案件结果的预测建立在个人执业经验之上，主观性强，难免会出现偏差。法律大数据在律师洽谈案件中的作用是显著的，大数据的核心价值在于预测，数据统计结果的可视化呈现能够弥补抽象言语和律师经验方面的缺陷。律师通过关联案件检索，将同类或者相似案件的争议焦点、主要裁判观点、原被告胜诉率等信息分类整合后呈现给当事人及将抽象的语言表达转化为具体且直观的数据表达，有助于提升案件预测的准确度，从而提高成案率。[^((1))](#chapter7.xhtml#jz_01_1005)


    ### （二）提高模拟庭审的质量

    模拟庭审是针对待开庭目标案件的预先演练，通过模拟庭审律师可以直观地感受案件可能的走向，更加准确地把握案件的争议焦点，去除思维的盲点。模拟庭审比单纯通过分析法条和案情所进行的思维实验更高效，更易帮助律师切中案件要害。在模拟庭审中，律师需要总结案件可能出现的变数，通过预先制定诉讼方案、运用诉讼技巧将变数带来的负面效应降至最低，从而实现本方当事人的利益。模拟庭审所使用的案件样本尤为重要，案件模型中各种要素的不同组合会产生不同的效果，对不同要素的调控可以从不同角度锻炼律师的应变能力，增强律师对相同或相关案件的理解。调控案件模型的要素依赖于可参考的案件样本，大数据带来的充足样本能够起到重要作用，大数据本身的多维度特点能够提供足够的调控、组合空间，“数据的总和比部分更有价值，当我们将多个数据集的总和重组在一起时，重组总和本身的价值也比单个总和更大”。通过检索案件积累充足的样本，分析提取案件中的要素，设置案件的模型，可以扩充模拟庭审的信息量，提高模拟庭审的质量。


    ### （三）减少重复劳动，形成高效智能办案方式

    2017年国务院印发的《新一代人工智能发展规划》提出推进社会治理智能化，其中包含建设智慧法庭的要求。高效化、智能化是司法的发展趋势。法律服务行业的发展与司法改革息息相关，当前，恰逢国家战略转型，应适时利用大数据、人工智能等新技术改进传统执业思路，形成高效、智能的新型办案方式。法律服务行业的各个工作环节均包含事务性工作部分和创造性工作部分，其中事务性工作创造的价值较低，律师仍要投入巨大精力，进行大量重复劳动，这使律师办案的效率和精确度均受到影响。在传统的办案方式中，律师缺乏高效的数据查询、整合手段，工作中相当一部分时间被事务性工作所占用，无法全身心投入创造性更高的智慧劳动中。法律大数据的普及和应用则可以为律师办案提供丰富的信息来源，律师可以依托法律大数据，形成高效、智能的新型办案方式。将事务性工作和创造性工作分别打造为标准化工作方案和非标准化工作方案，可以有效降低事务性工作的时间占用。律师可以通过大数据平台整合资源，如创设法律文书模板、可视化流程图、尽职调查报告样本等内容，将类型化案件中的普遍要素抽离，形成标准化办案流程，实现事务性工作和创造性工作的分流。以大数据为基础的人工智能系统在审查合同、智能阅卷、法律文书自动生成等方面也有巨大的应用空间，可以帮助律师有效减少投入、降低成本。如2018年2月，由以色列法律科技公司Law
    Geex研发的法律AI平台与20名经验丰富的律师进行一场人机竞赛，比赛内容是在4小时内审查5项保密协议（NDA），并确定30个法律问题，问题涉及仲裁、保密和赔偿。比赛的结果是，人类律师的平均准确率达85%，而AI平台的准确率达95%；AI平台在26秒内完成的任务，人类律师平均需要92分钟。


    ### （四）降低个性化法律服务成本

    标准化服务是法律服务行业追求的重要内容，旨在提高办案效率，减少重复劳动，节约时间成本。但标准化办案只适用于能够重复实践的部分，事实上，每个案件的情况各不相同，标准化之外的部分是案件更重要的部分。律师为客户提供的更加细致入微的个性化服务，不仅建立在对案情的了解之上，也建立在对客户本身信息的了解之上，尤其是为大型企业提供的非诉型法律服务，具有很强的专属性。但高质量、专属性的法律服务需要律师投入大量的时间和精力，因为个性化的法律服务建立在对当事人具体信息的掌握之上，而当事人的信息并不易掌握，律师需要在工作磨合中，运用法律思维逐渐挖掘潜在的、有价值的客户信息，调整服务思路，最终制定最适合的服务方案，因此个性化的法律服务成本较高。而法律大数据的普及则提供了便捷、全面的信息获取方式，律师可以利用法律大数据进行深层次挖掘，获得客户本身也不能完全掌握的信息，这不仅能使律师全面洞察客户存在的法律风险，也能够在很大程度上降低个性化法律服务的成本。


    ## 第二节 人工智能法律服务应用的实践

    ### 一、我国人工智能法律服务应用的实践

    我国人工智能法律服务应用在公证服务、律师辅助、企业法务、普法宣传等各领域均有发展，应用形式包括区块链公证、在线数据库、企业合规智能化、普法机器人等。国外人工智能法律服务应用起步较早，其在发展的早期阶段以网络服务和智能软件为主要形式，当前亦在开展更为深入和广泛的探索，包括法律人工智能算法的开发与升级、数据库的优化等，并且正通过简化操作、平台化等方式不断提升面向用户的服务质量，扩大服务普及范围。另外还应注意到，人工智能给用户个人信息与隐私安全带来威胁、算法黑箱导致歧视以及人工智能对传统行业带来冲击等方面的法律风险也逐渐显现。


    #### （一）技术侧重分析

    #### 1．区块链法律服务应用

    多地正在开展区块链公证先行试点，建立地方性、区域性“联盟链”，其他未正式上线区块链公证服务的地区也正在将相关工作纳入法律服务智能化发展计划。东部地区特别是江浙一带多领域、多部门的区块链法律服务广泛分布在各主要城市，取得了较好成效。


    #### 2．大数据法律服务应用

    '
  trans: '


    人工智能法律服务赋予法律服务以人工智能的技术支持，人工智能法律服务的产生源自两种动力：其一，法律理论与实践发展的需求。在法律对人工智能的风险分析与规避进行研究的过程中，我们对人工智能的应用有了更加深入的理解，从法律视角出发的对人工智能的研究也更加丰富与完善。与此同时，随着法律文献和司法纠纷的越加增多，法律服务者的工作和心理压力不断增大，迫切需要新技术的支持与辅助。其二，人工智能应用领域扩展的必然。人工智能已经突破了单纯的计算机研究领域，在数学、医学、心理学、仿生学等领域都有了新的发展，繁杂的法律数据、准确的法律推理、精细的法律检索都需要消耗大量的人力、物力、财力，而人工智能恰巧能利用其技术优势突破现有障碍，提高法律实践的效率。


    将人工智能领域的技术成果应用于法律行业，建立法律决策计算模型，可以使人工智能实现法律推理。人工智能是利用计算机来模拟人的某些思维过程和智能行为的学科，主要包括计算机实现智能的原理、制造类似于人脑智能的计算机，旨在使计算机能实现更高层次的应用。“法律+AI
    技术”有三种可能的推理建模方案：一是归责推理方案，即利用演绎推理将法律规范编码成法律解释库和案件事实库，以实现自动法律演绎推理；二是案例推理方案，即利用类比推理将案例编码成法律解释库和案件事实库，以实现自动法律类比推理；三是数据推理方案，即利用归纳推理将有价值的法律信息编码成法律解释库和案件事实库，以实现自动法律大数据推理。


    人工智能在法律领域的应用场景主要有：智能法律咨询、智能法律检索、类案检索、案件预测、智能合同分析、智能合同起草、文书审阅、智能业务辅导等，其能够提高法律事务处理效率，降低法律门槛。


    代表性参与者包括综合技术及解决方案提供商如腾讯、阿里和科大讯飞等，也包括专业的法律信息化企业如华宇软件和华夏电通、擎盾等。国外的法律人工智能公司则更多，比如，美国的合同分析平台
    LinkSquares 发布了人工智能合同生成器，该生成器可实现自主模板起草，审查和修改及审批，所有这些流程步骤，都将被整合到一个工作流程中。


    ## 1．国外人工智能法律服务的发展

    20 世纪 80 年代，美国的人工智能专家以“人工智能与法律”为研究主题，展开了深入的探讨与分析，伯曼教授与哈夫纳教授是这一领域的奠基人和开拓者，他们为促进法律的人工智能化，于
    1987 年召开学术会议，并于 1992 年组织专门的研究学会，还在 1993 年创设《人工智能与法律》刊物，从而激起了学术界的研究热情。


    国外人工智能系统的发展也越来越成熟，2015 年美国的机器人律师“ROSS”就是一款整理信息数据的人工智能软件，2016 年英国开发了一款专门处理停车罚单的上诉程序，2017
    年俄罗斯的 Sberbank 银行引进了处理各种投诉信件的机器人律师。上述例子也仅仅是冰山一角，人工智能系统正在渗透法律的方方面面。


    ## 2．我国人工智能法律服务的发展

    自 2015 年起，我国每年都有有关人工智能的法律政策新举措出台。2015 年 5 月 20 日，国务院印发《中国制造 2025》，同年 7 月 5 日，又印发《关于积极推进“互联网+”行动的指导意见》，这两份文件将中国制造的主攻方向定为“智能制造”，即推动智能机器人、物联网、云计算技术的应用和数据共享。2016
    年 7 月 28 日，国务院印发《“十三五”国家科技创新规划》，主张在人工智能领域重点发展数据驱动的类人智能技术方法，同年 12 月 19 日，国务院印发《“十三五”国家战略性新兴产业发展规划》，要求发展人工智能，培育人工智能的产业生态，推动人工智能的规模化应用。2017
    年 1 月 16 日，中共中央办公厅、国务院办公厅印发了《关于促进移动互联网健康有序发展的意见》，加紧人工智能、虚拟现实等关键技术布局，以尽快实现部分前沿和颠覆性技术的突破。


    在中央政策的指导下，地方也纷纷通过采取具体的举措来搭建人工智能的发展平台。在法律领域，2016 年贵州法院创造性地开展司法辅助系统的开发利用工作，借助人工智能辅助工具提升司法工作人员的业务能力和工作效率。2016
    年“法律谷”推出一款服务律师团体和普通消费者的检索产品，通过在“法律谷”输入案情，便可查询与之类似的法院审理的案例和推荐的律师。“理迈”是一款可以提供法律信息监控服务的智能产品，它可以帮助用户快速精选相关案例，并可以对相关案例进行分类、统计、图表呈现，帮助用户理解规范、防范法律风险、形成解决方案，从而潜在提升用户的竞争力。“206
    系统”于 2017 年 7 月亮相，这套系统以审判为中心进行诉讼管理，规范办案程序标准和证据使用标准，有利于提升办案的质量和效率，减少司法的任意性。2016
    年 6 月，杭州铁路运输法院雇用了一名机器人员工“小 G”，负责智能配送。同年 12 月 24 日，广西奎路律师事务所推出首个广西法律机器人“南宁市刑期预测系统”，这一系统利用真实的海量判决书，通过数据分析的方式预测案件的结果。2016
    年 10 月 15 日，“法小淘”在杭州云栖大会上演示了其功能，它可以根据案件的口头描述与询问人进行对话，并分析案件的案由、索赔金额、推荐律师等。“吴小甪”“法狗狗”等人工智能系统也纷纷上线，服务司法领域和社会人群。


    ## 二、人工智能法律服务应用的重大意义

    ### （一）法律服务资源配置方式发生变化

    传统的法律服务资源配置方式存在随意性、盲目性的特点，供需双方的匹配常依赖熟人推介或者律师事务所、律师的宣传。但法律服务行业的专业性造成供需双方强烈的信息不对称，对于需方来说，对律师的选择在一定程度上带有赌博性质；而对于供方的律师事务所和律师来说，一方面其面对资源过剩却难觅高质量客户的问题，另一方面面对缺乏有效手段挖掘潜在客户的问题。资源配置方式的随意性、盲目性造成了法律服务资源的浪费，进而导致整个法律服务行业效率不高，法律服务行业的专业化发展受阻。


    人工智能的应用能够优化法律服务资源的配置。过去法律服务资源配置中存在最大的问题在于，法律服务行业的专业性造成了供需双方之间的信息壁垒，而法律大数据的运用则有利于突破该壁垒，减少法律服务资源的闲置，缩短配置周期，并提高配置质量。以中国裁判文书网的检索功能为例，当事人可以按照案件的案由、法院名称、案件类型、律师事务所名称、律师姓名等关键词进行单一或者组合式检索，缩小选择的范围。裁判文书的网上公开，不仅为当事人提供了数据化筛选律师的途径，也催生了法律服务评价体系的重构，律师承办案件的数量、类型、结果等重要信息的公示，在一定程度上对律师的业务水平进行了公开，当事人可以通过相关信息甄别律师的执业水平，提高匹配的精确度。相应地，律师也可以运用人工智能进行搜索分析，实现深层次的客户挖掘，如通过大规模检索裁判文书，分析某一地区某一类型案件，进而掌握经常涉诉而又无代理人的当事人的信息，又如通过分析发现某时间段某类型案件量突然增多，进而将关注点放在与该类型案件有关的当事人上。第三方法律服务平台通过运用数据分析统计，也可以给供需双方提供更多磋商的机会，从而提高法律服务资源的利用率。不同于传统的推介，第三方法律服务平台使用大数据的商业应用模式，采集供需双方的用户信息，将用户的关注领域、使用习惯、律师的专业方向等信息进行整合，实现高度相关的律师和客户之间的互相推送，从而实现利用数据寻找目标的高效匹配模式。


    ### （二）法律服务市场生态位的重构

    在市场经济背景下，各行业的业态都遵循一定的发展规律，既受市场普遍规律的影响，也受特定行业规律的制约，法律服务行业亦不例外。借用生物学的概念，法律服务行业也有自己的生态系统，不同的律师事务所、律师位居不同的生态位，法律服务客户资源在一定时段内被不同的从业者所控制，也有所谓“优劣”之分，法律服务也有所谓“高低”之别，其优劣高低的差异很大程度上是由法律服务收益的效率决定的。传统上，优质客户委托的案件标的额大、律师费提成比例高，以大型企业的商事案件为代表。相反，普通客户委托案件所产生的收益则相对较小，单位案件的服务收益率较低。优质客户资源总是稀缺的，一般由少部分律师掌握，他们占据着所谓“较高”的生态位，而其他大部分律师则分布在所谓“中低”的生态位。


    法律服务客户资源的所谓“优劣”“高低”之分促使从业者更愿意将目标瞄准高生态位的客户，希望摆脱“中低”生态位，其主要原因在于，在传统执业模式下，律师办理案件时基本是以个人为单位的，个人精力的有限性与案件的复杂性充满矛盾，单位案件的收益率则显得尤为重要。所谓“低端”业务，并非指案件本身没有价值，只是投入较高而产出较低。面对单位产出较低的案件，律师如果能够提高办案效率，实现类型化案件的批量办理，那么传统上法律服务客户资源的“优劣”“高低”之分将变得不再那样明显。而人工智能技术的助推恰恰能够给以上情况带来改变，通过对人工智能技术的运用，律师能够从宏观上把握某一类型案件的规律，降低时间成本。将法律关系相对简单但程序繁杂的案件交由办案团队实现流水作业，可将过去在办案过程中过多的投入降到最低，降低成本提升单位案件的收益率，从而实现“中低端”生态位新的发展模式和盈利模式。随之，法律服务行业将会分化出两种行之有效的发展模式，一种是利用新技术降低成本，集约化办理类型化的批量案件，另一种是专注于办理本就相对复杂、单位收益率高的案件。在两种不同的发展模式下，律师均能深度挖掘不同生态位的价值，促进法律服务行业生态结构的重构，实现行业的良性发展。


    ### （三）执业思维模式发生改变

    我国是成文法国家，演绎推理是司法活动中最重要的推理方式，律师在办理案件过程中最常运用的就是演绎推理。归纳推理和类比推理在我国司法活动中运用的比例不高，除了法律制度和法文化传统方面的影响外，传统样本采集技术方面的固有缺陷也是一个重要原因。无论是归纳推理还是类比推理，都涉及对既有相似案例的样本采集。由于待采集的样本规模无限大，单纯用人力几乎不可能实现对样本的大规模采集，也无法进行多维度分析，同时用有限的样本推理出的结论又存在很大的不确定性，充其量只能提供部分参考价值。而人工智能技术的运用则能够突破样本采集方面的局限，极大地扩展样本采集的范围，降低归纳推理和类比推理带来的不确定性。


    从演绎推理到归纳推理、类比推理，是思维模式的转变，即从依赖因果关系到寻找相关关系的转变。运用演绎推理，通过三段论的方式分析案件体现了因果关系思维，理论上其最大的优点是确定性，即如果作为大前提的法律规则是固定的，那么作为小前提的事实一旦符合大前提的条件，结论则应当是确定无疑的。但是，因果关系思维更加适用于规模小、封闭性强的系统，对于开放性强、变量大的系统，因果关系思维则显得捉襟见肘。“对于开放复杂的巨系统，传统的因果分析难以奏效，因为系统中各个组成部分之间相互有影响，可能互为因果，因果关系隐藏在整个系统之中。现在的‘因’可能是过去的‘果’，此处的‘果’也可能是别处的‘因’，因果关系本质上是一种相互纠缠的相关性。”法律解决的是复杂的社会问题，法律的滞后性和社会生活的复杂性经常使演绎推理无法发挥有效的作用，法律解释和客观世界的双重不确定性常导致演绎推理难以奏效。运用归纳推理和类比推理分析案件，则突破了因果关系的思维模式，其核心在于寻找与当前案例相关的样本，从海量相似样本中提炼出需要的结果，而无需纠结产生结果的原因是什么。


    法律大数据所隐含的信息能够帮助律师突破思维盲区，客观存在的数据可提供意想不到的信息，激发思维的灵感。样本的规模化，弥补了归纳推理和类比推理的缺陷。运用相关关系思维预测案件走向准确度将大大提升。人工智能既是一项全新的技术手段，也代表一种全新的思维模式，目前在我国法律实务中，检索相似案例已经成为律师办案过程中的一个重要环节，律师援引相似案例的现象越来越普遍。这说明在人工智能技术的影响下，我国律师办案的思维模式已经开始发生改变，随着人工智能技术的进一步完善，这一趋势将会更加明显。


    ### （四）催生新的服务类型

    人工智能的运用不仅惠及诉讼业务，也会催生新的服务类型，由于数据采集、存储、分析技术水平获得了大幅提升，专门以法律数据的分析、整合为服务内容就成为可能，拥有相关资源的律师事务所或者法律服务电商平台可以运用新技术创设新的服务模式，提供新的服务类型。会有更多的律师事务所将法律数据的整合、分析作为新的业务；法律数据涉及专业法律知识，而律师事务所则可以充分利用其专业理论与实务方面的优势，对数据的分类处理提前作出规划，使法律数据分析、整合这项新的业务更加符合市场需求；法律服务的核心竞争力将不再局限于办案水平，对法律数据的综合分析和运用能力也是核心竞争力的一项重要内容，掌握更加先进的人工智能技术，就会在竞争中更有机会取得领先地位。


    ## 三、人工智能法律服务的优势分析

    ### （一）提高案件结果预测的准确度

    当事人与律师就案件洽谈时，最关心的是案件可能的走向和结果，成案与否主要取决于律师对案件走向和结果的分析，分析过程所反映出的专业素养和执业经验是成案的核心要素。而律师在专业法律知识层面的认知水平在一定程度上会影响当事人的信任度，律师如果单纯从法律法规入手分析案件，并不一定会取得良好的效果。律师分析案件的常规方式是语言表达，而包含专业法律概念的语言具有一定的抽象性，欠缺直观。律师对案件结果的预测建立在个人执业经验之上，主观性强，难免会出现偏差。法律大数据在律师洽谈案件中的作用是显著的，大数据的核心价值在于预测，数据统计结果的可视化呈现能够弥补抽象言语和律师经验方面的缺陷。律师通过关联案件检索，将同类或者相似案件的争议焦点、主要裁判观点、原被告胜诉率等信息分类整合后呈现给当事人及将抽象的语言表达转化为具体且直观的数据表达，有助于提升案件预测的准确度，从而提高成案率。^((1))


    ### （二）提高模拟庭审的质量

    模拟庭审是针对待开庭目标案件的预先演练，通过模拟庭审律师可以直观地感受案件可能的走向，更加准确地把握案件的争议焦点，去除思维的盲点。模拟庭审比单纯通过分析法条和案情所进行的思维实验更高效，更易帮助律师切中案件要害。在模拟庭审中，律师需要总结案件可能出现的变数，通过预先制定诉讼方案、运用诉讼技巧将变数带来的负面效应降至最低，从而实现本方当事人的利益。模拟庭审所使用的案件样本尤为重要，案件模型中各种要素的不同组合会产生不同的效果，对不同要素的调控可以从不同角度锻炼律师的应变能力，增强律师对相同或相关案件的理解。调控案件模型的要素依赖于可参考的案件样本，大数据带来的充足样本能够起到重要作用，大数据本身的多维度特点能够提供足够的调控、组合空间，“数据的总和比部分更有价值，当我们将多个数据集的总和重组在一起时，重组总和本身的价值也比单个总和更大”。通过检索案件积累充足的样本，分析提取案件中的要素，设置案件的模型，可以扩充模拟庭审的信息量，提高模拟庭审的质量。


    ### （三）减少重复劳动，形成高效智能办案方式

    2017 年国务院印发的《新一代人工智能发展规划》提出推进社会治理智能化，其中包含建设智慧法庭的要求。高效化、智能化是司法的发展趋势。法律服务行业的发展与司法改革息息相关，当前，恰逢国家战略转型，应适时利用大数据、人工智能等新技术改进传统执业思路，形成高效、智能的新型办案方式。法律服务行业的各个工作环节均包含事务性工作部分和创造性工作部分，其中事务性工作创造的价值较低，律师仍要投入巨大精力，进行大量重复劳动，这使律师办案的效率和精确度均受到影响。在传统的办案方式中，律师缺乏高效的数据查询、整合手段，工作中相当一部分时间被事务性工作所占用，无法全身心投入创造性更高的智慧劳动中。法律大数据的普及和应用则可以为律师办案提供丰富的信息来源，律师可以依托法律大数据，形成高效、智能的新型办案方式。将事务性工作和创造性工作分别打造为标准化工作方案和非标准化工作方案，可以有效降低事务性工作的时间占用。律师可以通过大数据平台整合资源，如创设法律文书模板、可视化流程图、尽职调查报告样本等内容，将类型化案件中的普遍要素抽离，形成标准化办案流程，实现事务性工作和创造性工作的分流。以大数据为基础的人工智能系统在审查合同、智能阅卷、法律文书自动生成等方面也有巨大的应用空间，可以帮助律师有效减少投入、降低成本。如
    2018 年 2 月，由以色列法律科技公司 Law Geex 研发的法律 AI 平台与 20 名经验丰富的律师进行一场人机竞赛，比赛内容是在 4 小时内审查
    5 项保密协议（NDA），并确定 30 个法律问题，问题涉及仲裁、保密和赔偿。比赛的结果是，人类律师的平均准确率达 85%，而 AI 平台的准确率达 95%；AI
    平台在 26 秒内完成的任务，人类律师平均需要 92 分钟。


    ### （四）降低个性化法律服务成本

    标准化服务是法律服务行业追求的重要内容，旨在提高办案效率，减少重复劳动，节约时间成本。但标准化办案只适用于能够重复实践的部分，事实上，每个案件的情况各不相同，标准化之外的部分是案件更重要的部分。律师为客户提供的更加细致入微的个性化服务，不仅建立在对案情的了解之上，也建立在对客户本身信息的了解之上，尤其是为大型企业提供的非诉型法律服务，具有很强的专属性。但高质量、专属性的法律服务需要律师投入大量的时间和精力，因为个性化的法律服务建立在对当事人具体信息的掌握之上，而当事人的信息并不易掌握，律师需要在工作磨合中，运用法律思维逐渐挖掘潜在的、有价值的客户信息，调整服务思路，最终制定最适合的服务方案，因此个性化的法律服务成本较高。而法律大数据的普及则提供了便捷、全面的信息获取方式，律师可以利用法律大数据进行深层次挖掘，获得客户本身也不能完全掌握的信息，这不仅能使律师全面洞察客户存在的法律风险，也能够在很大程度上降低个性化法律服务的成本。


    ## 第二节 人工智能法律服务应用的实践

    ### 一、我国人工智能法律服务应用的实践

    我国人工智能法律服务应用在公证服务、律师辅助、企业法务、普法宣传等各领域均有发展，应用形式包括区块链公证、在线数据库、企业合规智能化、普法机器人等。国外人工智能法律服务应用起步较早，其在发展的早期阶段以网络服务和智能软件为主要形式，当前亦在开展更为深入和广泛的探索，包括法律人工智能算法的开发与升级、数据库的优化等，并且正通过简化操作、平台化等方式不断提升面向用户的服务质量，扩大服务普及范围。另外还应注意到，人工智能给用户个人信息与隐私安全带来威胁、算法黑箱导致歧视以及人工智能对传统行业带来冲击等方面的法律风险也逐渐显现。


    #### （一）技术侧重分析

    #### 1．区块链法律服务应用

    多地正在开展区块链公证先行试点，建立地方性、区域性“联盟链”，其他未正式上线区块链公证服务的地区也正在将相关工作纳入法律服务智能化发展计划。东部地区特别是江浙一带多领域、多部门的区块链法律服务广泛分布在各主要城市，取得了较好成效。


