  toc: []
- raw: '随着人工智能技术的发展，计算机逐渐从辅助工具向代理人的角色进行转变。一些行业中出现了人机混同的现象，劳动力与服务等行业中人类甚至基本被机器取代。人机共处的行为方式改变了传统社会的行为模式。例如在人工智能司法应用的过程中，人工智能通过技术手段使得审判效率大大提高，缓解了“案多人少”的矛盾；人工智能司法应用预防并减少甚至杜绝冤假错案的发生，让“公平能够以看得见的方式实现”；与此同时，人工智能司法应用让证据数字化使得法律真正成为科学。[^((115))](#chapter1.xhtml#jz_01_0812)人机混同的行为模式在给人们的生产生活带来便利的同时也在深刻改变着传统社会的行为方式。“你在应用互联网连接世界时，互联网实际上重塑了你与世界接触的方式。”[^((116))](#chapter1.xhtml#jz_01_0813)当人工智能体具有的自主学习能力，超出人们的理解和控制范围时，人机混同的行为将在意思衔接、行为协同、后果混同等方面对传统行为方式带来革命性的改变，给传统法律行为带来重大挑战。[^((117))](#chapter1.xhtml#jz_01_0814)


    人类社会经历了三次大革命：第一次是农业革命。在农业革命时期，人类学会了种植和养殖，具备了自主性。第二次是工业革命。在工业革命时期，人类完成了从手工业到机器大工业的过渡，将自己从繁重的体力劳动中解放出来。第三次是人类正在经历的信息革命。在信息革命时期，网络化、信息化、技术化高速发展，人工智能不仅仅会逐渐取代体力，还会逐渐取代人的脑力。信息革命改变了传统法治的基础，改变了传统物理世界中的经济基础。数字经济发生了质的变化：一是传统生产要素在数字社会的生产生活中拥有了数字化的特征；二是信息技术发展催生了全新的第五大生产要素：数据。[^((118))](#chapter1.xhtml#jz_01_0815)在人工智能时代，人工智能法治是建立在数字经济基础上，以智能科技应用辅助法治运行所形成的法治形态，是传统法治进入智能时代后的新变革。


    **课后习题：**


    （简答题）


    1．尝试梳理人工智能法治的特征。


    2．论述人工智能带来的新时代挑战。


    （思考题）


    在你看来，人工智能是否具有法律主体的地位？人工智能技术发展带来的机遇和风险是什么？人工智能时代带来的数字法治变革主要体现在哪些方面？


