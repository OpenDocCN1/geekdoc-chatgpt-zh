    \n[(2)](#postscript1.xhtml#jzyy_01_1011)　例如，2008年浙江省卫生厅发布的《浙江省卫生信息化建设“十一五”规划》提到“要在中医诊断技术、方法和仪器设备及生物医学工程技术方面广泛采用人工智能、信号处理和资料挖掘等信息技术”，这是医疗人工智能首次出现在省级政策文件中。2018年发布的《安徽省新一代人工智能产业发展规划（2018—2030年）》和《安徽省人民政府办公厅关于促进“互联网+医疗健康”发展的实施意见》都提出积极推动智能医疗的发展，研发外科辅助机器人、医学影像辅助诊断系统，推进医学影像识别的应用等。2018年，上海市政府发布《“健康上海2030”规划纲要》和《上海市人民政府关于推进本市健康服务业高质量发展加快建设一流医学中心城市的若干意见》，推进人工智能在医学领域的应用。2018年9月发布的《北京市加快医药健康协同创新行动计划（2018—2020年）》，将促进医药健康与人工智能、大数据技术融合新兴业态等领域发展作为重点任务之一。\n\
