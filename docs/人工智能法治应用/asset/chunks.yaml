- raw: "三是共享平台，其对案件关联信息进行高效匹配，实现数据共享。共享平台的搭建使公安机关、检察院、法院、司法局各部门实现互联互通、统一协作，并实现了各个机关之间的数据对接和交换，打破长久以来在信息化应用上各机关之间存在的使各机关各自为政、自成体系、互不连通、不能共享的数据壁垒。例如海南省第一中级人民法院建立了全国首个涉外民商事纠纷在线多元化解平台，其“一站式”解决纠纷模式有效联通了人民调解平台、法院审判系统等平台，实现了数据的共享互通。\n\
    \n### 二、功能集约化\n\n信息化时代，司法人工智能应用正朝着数字化和集约化的方向发展，使分散、碎片化的司法功能和任务可集中到一个平台来集约化处理。所谓“集约”，指对资源要素进行集中管理和统一配置，达到节约成本、提高效率、提升管理水平、实现效益最大化的目的。随着我国司法案件数量的不断激增，提升司法效率、优化司法资源配置的重要性日益凸显。近年来我国的司法改革将“高效”放置在仅次于“公正”的位置，并将“高效”与“公正”并列为树立司法权威的来源，强调运用新科技“统筹使用司法人才，优化审判资源配置”。[^((31))](#chapter5.xhtml#jz_01_0976)\n\
    \n大数据、人工智能等新技术因其数字化、高效率等特点可实现司法资源的集约化调配和整合，案件审理跨行政区域线上审理、合议使跨域一体化司法成为可能。以浙江省人民法院推动的“全域数字法院”建设为例，该法院是一个以技术变革推动业务流程再造、组织架构重塑和诉讼制度改革的全域现代化法院，旨在通过高度的数字化和智能化实现数字正义，打破空间和时间的制约，形成全业务平台通办、全时空泛在服务、全流程智能辅助、全省域资源整合、全方位制度变革的信息时代司法运行、组织和管理的新模式。[^((32))](#chapter5.xhtml#jz_01_0977)在对外诉讼服务方面形成移动微法院、浙江法院网、智慧法院APP三位一体的主渠道，在诉前调解方面搭建在线矛盾纠纷多元化ODR平台，在审判执行阶段探索形成人工智能辅助的凤凰智审、智慧执行新模式。浙江“全域数字法院”实现“全省一个平台”，为实现全省法院人、案、事、物等司法资源与司法事务的在线协同和优化配置提供支撑，有助于让算法和大数据能发挥其最大应用价值。\n\
    \n集约化应用不仅体现在司法机关的案件审理和诉讼流程中，在提供诉讼权利保障方面，司法人工智能为当事人提供“一站式”服务，提升了司法机关向当事人提供的服务的质量。例如深圳市宝安区人民法院的“24小时自助法院”，该法院能向当事人提供各类自助终端设备，包括自助立案、自助缴费、开庭公告、文书查询、案件查询、联系方式、在线预约七大功能，基本囊括了当事人在诉前的所有准备过程，避免了原先当事人的奔波劳累。同时司法人工智能应用的功能集约化还体现在对包括对立案开庭通知的送达人员、庭前证据财产的保全人员、庭审过程的陪审员与书记员、庭审后的执行人员在内的各类司法辅助人员的科学统一调配，优化司法机关内部人事管理法律关系的配置上。例如北京市朝阳区人民法院的“1+1+N”特色集约化新型审判团队模式，就实现了“集约”工作模式下事务性工作的流程管理、自动生成、信息交互和提醒提示等功能，实现了人力资源的合理配置。[^((33))](#chapter5.xhtml#jz_01_0978)\n\
    \n### 三、应用领域化\n\n司法领域因其特殊的性质对技术应用提出独特的要求。法律体系中，每一种部门法都有其自身特有的维度和属性，且相较于其他领域而言，司法领域的知识体系就具有要素多、属性多等特点，在应用人工智能的过程中也形成许多有司法领域特色的技术，逐渐形成应用领域化的特征。现阶段人工智能技术主要应用在刑事、民事和行政领域，并根据各个领域的独有特征发挥不同的作用。\n\
    \n民事审判领域的人工智能期适用对象是民事诉讼事务，作用在于打破传统民事诉讼过程中的时空局限，提高民事诉讼的精准化程度。我国将人工智能应用于民事审判是在智慧法院的建设中实现的，即通过将人工智能应用于智慧法院来逐步提升民事审判工作的质量与效率。民事司法人工智能的特点包括：协助法官进行民事诉讼事务的处理，包括服务公众智能化、诉讼服务智能化、司法审判智能化、司法管理智能化等具体应用；具有初步的搜索、感知和识别等类人能力，进行包括类案推送、偏离度预警、裁量预测等具体实践；协助民事审判符合《民事诉讼法》的要求，例如人工智能在被应用于证据审查中时，既需在技术上实现对真假证据的识别，也要满足法律对证据的可质证性、可鉴真性等要求。\n\
    \n人工智能在行政执法领域的应用一方面提升政府监管个人、组织和社会的效能，一方面也为保障公民权利创造更加优越的条件，在公共治理领域带来变革与创新。当下人工智能行政执法实践的应用特征主要为：数据、算法和算力的共同支撑决定了人工智能在行政执法领域应用的广度和深度。数据量的多少和数据的有效程度是决定人工智能识别率和精准度的关键因素，使用最广泛的深度学习算法能够使执法人工智能的数据处理结果更加准确，算力作为三者中的核心因素能够推进人工智能的训练场景与行政执法实际应用结合得更为紧密；部分自动行政与完全自动行政并行；智能执法逐步嵌入具体行政执法的各个实践领域，具体实践包括行政检查智能化、行政审批智能化、行政处罚智能化、行政给付智能化等。[^((34))](#chapter5.xhtml#jz_01_0979)\n\
    \n在人工智能在司法领域的应用方面，我国刑事司法人工智能应用走在世界前列。以智能辅助办案系统为代表的刑事司法人工智能迅速在我国崛起，刑事司法人工智能已经涵盖刑事审前程序、定罪程序和量刑程序，几乎实现对刑事诉讼领域的全覆盖。在刑事司法人工智能实践的过程中，逐渐形成四种系统：智能辅助决策应用系统，应用于刑事审判中的证据审查、事实认定以及审前程序中的社会危险评估等领域；智能辅助支持系统，应用于敏感案件自动标示预警、辅助录入、立案风险自动拦截、庭审语音识别、文书智能纠错等提升检查和审判质量效率等方面；案件管理应用系统，以提高诉讼效率为主要实现方向；诉讼服务应用，旨在通过运用刑事司法人工智能方便当事人诉讼、提供便捷的诉讼服务，并为当事人提供法律咨询。[^((35))](#chapter5.xhtml#jz_01_0980)\n\
    \n### 四、范围全面化\n\n我国的司法信息化建设在前一阶段的主要发展方向为审判管理，包括对立案、分案、审理、审批等管理环节实现动态管理，使信息录入、审限管理程序运行等更加系统、规范、客观。[^((36))](#chapter5.xhtml#jz_01_0981)而现阶段与以往不同的是，人工智能司法应用已经由在前期自动生成文书案卷逐渐拓展到立案、审判流程，已经基本覆盖诉讼的所有主要环节。司法大数据与人工智能技术不再局限于传统的流程管理，逐渐扩展到“管理”领域之外的司法公开、诉讼服务、审判执行等环节，实现“全业务”“全流程”“全方位”覆盖，体现出范围全面性的特点。\n\
    \n在人工智能司法应用送达方面，广东省率先建立智能短信送达系统；江西省于2019年建立省级集约化送达中心，创立全国首个“审送分离”集约化、智能化送达模式；湖南省引进邮政寄递一体化服务平台，实现“法院专递”邮件全程信息、“法院专递回执”投递信息全程纪实并及时反馈的功能。\n\
    \n作为诉讼的灵魂，合法有效、确实充分的证据是案件事实清楚的前提和关键。通过利用司法大数据和人工智能的核心技术，人工智能司法应用辅助实现案件审判环节的证据统一化。以“206系统”为例，其核心功能就是证据标准指引功能，证据标准指引指在办理刑事案件过程中，一般应收集哪些证据以及怎样收集证据的规范，由完整的证据链条、必须查证的事实、所需收集的基本证据、需要注意或提示的问题、证据的综合分析判断等方面组成。系统已经完成上海刑事案件常涉的102个罪名的证据标准指引制定工作，可以为办案人员收集和固定证据的过程提供统一的标准化、数据化、清单式的操作指引。[^((37))](#chapter5.xhtml#jz_01_0982)\n\
    \n在“智慧检务”方面，运用于司法监督领域和公益诉讼领域的人工智能司法应用也逐步发展并实践。以上海市杨浦区、青浦区、闵行区检察院作为试点的刑事诉讼监督一体化流程监督管理平台，凭借其构建的线索汇集库、违法信息库、诉讼监督案件信息库、类案监督案件库以及综合数据统计分析库五大类数据库，将监督贯穿于从立案、侦查、审查起诉到审判、执行整个刑事诉讼程序中，弥补了检察环节中的盲点。在公益诉讼方面，全国范围已有多家检察院或自主或联合社会力量开发了辅助公益诉讼的人工智能应用。2019年福建省利用“网络爬虫”等技术建设能够替代人工性的线索抓取、分流以及共享的“智慧蓝”公益诉讼检察联动平台，并依托微信平台建立“公益眼”小程序。平台和小程序的建立能够丰富科技线索采集方式和线索举报模式，使公益诉讼报案信息的收获和线索收集更为及时、灵活和准确。\n\
    \n## 第四节  \n\n人工智能司法应用面临的风险与挑战及应对\n\n### 一、人工智能司法应用面临的风险与挑战\n\n由前可知，国外一些学者和法官对人工智能技术风险抱有疑虑有其原因。人工智能技术的三大基本要素为数据、算力、算法：数据是人工智能技术的基石，是人工智能技术运行的原料性基础；算力是人工智能技术的保障，海量的数据需要足够的算力予以支撑；算法是人工智能技术的核心，算法的技术水平直接决定了人工智能技术的智能程度。然而当前的人工智能司法应用至少在数据和算法两个基本要素上存在技术风险与挑战。\n\
    \n##### （一）基础性数据问题尚未完全解决\n\n人工智能以数据作为基础，在算法的支持下，通过对海量数据的分析，达到自主运行的水平。传统模式下，公安机关、检察院、法院、司法局均掌握着大量的司法数据，但在司法机关与司法机关之间、司法机关与行政机关之间并没有实现真正的互联互通、数据共享。实践表明，人工智能司法应用较大程度上打破了各机关之间的数据壁垒，但数据壁垒、数据孤岛等基础性数据问题尚未完全解决。数据壁垒的出现带来的后果是，在功能开发过程中，研发人员只能从自己所在的机构或最终的裁判文书中获得数据进行分析，这导致人工智能司法数据资源浪费且质量得不到保障。此外，各地司法机关在推进智能辅助办案系统方面基本处于各自为政的状态，而这些自发的革新除带来技术竞争方面的积极作用外，也使得司法机关之间出现人为制造的壁垒，并导致数据流通困难，数据共享难以实现。此外，在法院外部数据资源相对匮乏的情况下，应进一步全面开展更宏观层面的数据分析挖掘，实现数据一体化。\n\
    \n有学者总结我国人工智能司法应用主要存在的障碍：（1）法律数据不充分，例如大量裁判文书不上网、裁判者心证过程等决策信息未体现于裁判文书中；（2）法律数据不真实，例如公开的裁判理由与实际的裁判理由并不一致；（3）法律数据不客观，不同法官对同一问题的不同看法，导致裁判数据的主体性、主观性；（4）法律数据结构化不足，例如法律语词的不统一导致人工智能识别困难。这些数据方面技术障碍的存在，既有技术本身的原因，例如数据库建设水平低下、人工智能获取数据能力不足等，也有制度性的原因，例如我国当前司法实践中存在的法院正卷副卷“二元化”体制、审判委员会案件审理方式等，都加剧了此种数据方面的技术障碍。[^((38))](#chapter5.xhtml#jz_01_0983)事实上，在其他国家，这种数据方面的技术障碍也同样存在，例如英国法律规定的陪审团评议信息不公开制度、法国基于犯罪者回归需要而规定的特定犯罪记录删除制度，都给数据的提供与获取制造了困难。\n\
    \n##### （二）算法问题可能影响司法公正与公开\n\n以深度学习为核心机理的人工智能依赖以数据为基础的算法并在此基础上进行高效率运算与容量存储，进而实现人类自身智能的增幅与扩容。但在算法方面，问题主要体现在两方面，一是算法的技术水平较低，二是算法的封闭和秘密性。前者是因为当前运用于司法裁判的人工智能技术是以知识图谱为主流算法的，通过知识图谱描摹案件的主要构成要件和证据构成，距离人工智能科技企业宣称的“知识图谱＋深度学习”的算法还有相当大的差距，加之知识图谱构建中信息抽取能力的欠缺，知识图谱构建的速度和精度都严重不足，这些都使得运用于司法裁判的人工智能技术十分初级，人工智能司法应用的实际价值因此被削弱。[^((39))](#chapter5.xhtml#jz_01_0984)\n\
    \n虽然算法的代码与程序的形式是客观的，其运行结果理应也是理性、非主观的，然而实践表明运行结果并不是完全不涉及价值判断的。出现瑕疵的原因是多样的，算法设计架构者的专业能力和认知水平不足，效率与相关性的目标导向而非精确与因果性的设计导向造成的隐性影响，所使用数据的不充足、不全面或低质量、含瑕疵，均可能导致算法歧视。\n\
    \n算法歧视是算法在自动化决策过程中，基于偏见对个人或群体的不公平对待，比如排序被滥用或误用引发的风险分配的不公平，它是建立在数据基础之上的算法所犯的错误和产生的偏见，具有明显的特殊性。其特殊性具体表现在：第一，算法歧视更加精准。算法能够对每个用户精准画像，被打上歧视标签的用户绝无逃脱的可能。第二，算法歧视更加多元。人类歧视通常依据的是性别、学历等显形特征，但算法能够挖掘出更加深层次的隐形特征来作为其歧视处理的依据，包括网页浏览记录、购物记录、行车路线等。第三，算法歧视更为片面。人类社会对个体的判断通常是综合和动态的，而算法无法获取或处理用户的全部数据。第四，算法歧视更加隐蔽。传统基于种族、性别、民族等特征的歧视是法律所禁止的，但算法却可以规避这些规定，难以为人所探察。而在人工智能司法应用领域，如2016年美国的威斯康星州诉埃里克·卢米斯案件（State\
    \ of Wisconsin v. Eric L. Loomis）中，上诉人卢米斯主张本案中联邦巡回法院刑事法庭在量刑过程中所使用的COMPAS系统存在算法歧视，侵犯了他的正当程序权利。此案引发了巨大的争议与激烈的讨论，即便联邦最高法院认定COMPAS系统具有合宪畛域内的客观中立性，但在对于该系统的独立控制测试中发现的算法歧视，例如，黑人比之白人，其再犯风险高两倍，而实践中只有约20%的人会再次犯罪，在司法实践中极易引起公众对司法公正的质疑。[^((40))](#chapter5.xhtml#jz_01_0985)尽管威斯康星州最高法院驳回了卢米斯的上诉，联邦最高法院最终也拒绝对此案签发调卷令，从而使得该案终结，但该案引发的争论远未停息，许多批评者认为这样的判决无论是在程序还是实体方面都有违公正。该案说明，人工智能技术在司法裁判的运用尽管可以大大减轻法官的工作量并加快诉讼的进程，但“暗箱操作”的算法可能预先存在偏见却又无法向辩方公开以及接受审查，即便其向辩方公开，辩方也无审查算法的能力，这使得人们怀疑其可能有违宪法中的正当程序条款，并最终损害司法公正。\n\
    \n“黑箱”原本是控制学术语，是对那些无法打开，无法从外部直接观测其内部状态的系统的统称。算法在这一黑箱之中进行自动化数据处理与分析，这就是算法的“不透明性”。对于公众而言，算法逻辑、源代码的私密性及其无法转化为可视性技术公开发布，就极有可能导致算法黑箱的产生。由于全国各大法院往往并不具备独立自主研发人工智能司法应用的能力，例如，智慧法院的建设主要依靠政府招投标、技术外包等手段完成，而出于对商业秘密进行保护与对抗竞争的需要，各大科技企业的核心技术算法属于知识产权法的保护范围，难以向公众披露，而应用于司法等公共领域的人工智能应用应以公开为原则，不公开为例外，这样才能实现司法的“阳光化”。[^((41))](#chapter5.xhtml#jz_01_0986)\n\
    \n### 二、人工智能司法应用的风险规制\n\n##### （一）明确人工智能司法应用的适用范围\n\n如前所述，目前人工智能技术在司法中的应用定位为司法辅助工具，为保证其切实履行辅助工具之功效而不会对司法活动造成不利影响，就应当对其运用范围作出合理界定。\n\
    \n一是有关司法裁判确立规则方面，应当明确禁止人工智能的干预。在英美法系中，法官基于“遵循先例”的原则进行“造法”是一项重要职能，但在我国，法律虽无关于“法官造法”的明确规定，但通过司法裁判确立规则的情形是现实存在的，如我国最高人民法院公布的指导性案例常常为各级法院所参考、遵照。这些通过司法裁判确立的规则具有多样性特征，有可能升格为较高位阶的规则，例如被司法解释所采纳，甚至为法律所吸收。如果这些规则的制定过程允许人工智能的干预，实际上不但是对司法权的侵害，而且可能影响立法权。\n\
    \n二是在刑事案件审理过程中，人工智能司法应用一般应该限于辅助量刑。刑事诉讼涉及公民的生命、财产、自由等最核心、最基本的权利，社会对刑事案件的容错率极低，因此须特别注意。不仅如此，许多刑事案件的案情复杂或涉及诸多法益，错案发生的可能性较高，需要考量的因素较多。同时，审理刑事案件时还需要理解纷繁复杂证据背后的“天理人情”，否则可能作出冰冷僵硬、看似合法的“错案”，例如内蒙古“收购玉米案”、天津“大妈持枪案”等。因此在刑事案件中，在案件事实的认定和法律适用中，一般应当把握好人工智能的干预限度，将人工智能技术的运用主要限定于案件事实认定清楚、罪名确定之后的量刑程序，即通过人工智能司法应用提出量刑建议，由法官最终作出裁判。这样既符合人工智能的技术特点，也有利于实现案件审判的良好效果。特别是在被告人认罪的案件中，一旦确定此种认罪自愿合法，则案件往往无须正式审判，或审判程序从简，此时法官可以在人工智能技术的辅助下迅速量刑。[^((42))](#chapter5.xhtml#jz_01_0987)\n\
    \n三是在行政案件审理过程中，人工智能司法应用不宜用于判断行政行为的合法性。“民告官”的行政诉讼主要解决的是行政行为的合法性问题，而行政行为合法性的审查中包含很大一部分的价值判断内容，而这正是去价值判断化的人工智能的“弱项”。因此在行政案件中的法律适用问题上，尤其是判断行政行为是否合法的问题上，人工智能技术运用的余地较为有限。然而对于行政案件的其他一些问题，例如在案件证据的收集、审查方面，人工智能技术可以发挥较为积极的作用，而随着国家机关间信息共享平台的建成，法院也可以通过这类平台，利用人工智能工具抓取相关数据和证据，协助法官完成对行政案件的审判工作。[^((43))](#chapter5.xhtml#jz_01_0988)\n\
    \n四是在民事案件审理过程中，一般而言人工智能司法应用有较大的运用空间。民事案件中，法院通常遵循不告不理的原则，案件的事实判断更多取决于原被告双方的举证，且证明标准一般要求相对较低的“优势证据规则”。因此，可以运用人工智能技术根据双方的举证进行事实判断，提出法律适用的辅助性意见，并最终由法官作出裁判。在这些案件中，在尊重法官的裁判权的前提下，人工智能技术可以发挥较为积极的辅助作用。但是民事案件也存在一些例外，例如婚姻家庭类案件，往往涉及人类情感和家庭伦理关系，特别是针对离婚案件中夫妻感情是否破裂的问题，人工智能往往无法作出判断，因此在民事诉讼中人工智能司法应用整体发挥较大作用的情况下，也会根据具体案件的性质限缩人工智能司法应用的适用空间。[^((44))](#chapter5.xhtml#jz_01_0989)\n\
    \n##### （二）通过制度规则充分保障当事人诉讼权利"
