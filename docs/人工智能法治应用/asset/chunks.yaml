- raw: "在传统的法律体系中，行政执法是国家行政机关及其工作人员在其对社会生活进行组织和管理过程中依照法律对行政管理相对人采取的直接影响其权利义务，或对行政相对人权利行使和义务履行情况进行监督检查的活动，它主要由行政机关及其工作人员最经常、最普遍的具体行政行为所构成。[^((2))](#chapter4.xhtml#jz_01_0912)换言之，行政执法是指行政主体依法对行政相对人采取的具体的直接影响其权利义务，或者对相对人权利的行使和义务的履行情况进行监督检查的具体行政行为。[^((3))](#chapter4.xhtml#jz_01_0913)\n\
    \n从行政主体的范围上来说，行政主体包括主管行政机关和经合法授权、具有行政职能的非行政机关组织，例如公安机关、农业部门、林业部门、教育部门、文化部门、应急管理部门、水利部门，等等。相较于立法应用的主体主要是全国人大及其常委会、地方各级人大及其常委会，司法应用的主体主要是各级人民法院而言，执法应用的主体具有多元性、涵盖范围较广等特点。行政执法手段主要包括行政检查、行政决定、行政许可、行政奖励、行政征收、行政处罚、行政强制执行等。行政执法原则主要包括合法性原则、合理性原则、效率原则、程序性原则等。相较于人工智能执法应用而言，传统意义上的行政执法大多都是现场执法、人工执法，存在一定的局限性，而这也是人工智能执法应用发展的空间所在。\n\
    \n### 二、人工智能执法应用的概念\n\n行政主体根据相关法律规定，在执法的过程中运用人工智能技术，更好地辅助执法活动的进行，这一应用过程则是人工智能执法应用的具体体现。从不同的角度出发，人工智能执法应用的概念界定也有所不同。\n\
    \n从智能科技和现代警务的融合发展来看，人工智能执法应用是通过广泛采集、聚类分析、强度整合、多元共享社会积聚的多维度、多属性、多密度的数据资源，对情报、组织、技术、服务和监管等基本要素加以逻辑演绎、算法感知、自动化学习等智能处理而形成的数字化、互联化、智能化执法应用新体态。从本质上来讲，人工智能执法应用的要旨是使拥有智慧的人与被赋能的物之间形成互联互通、互补互促、互存互动的三维结构空间，以实现公共安全治理效益效能的最大化和最优化。[^((4))](#chapter4.xhtml#jz_01_0914)\n\
    \n从发展背景和运用过程来看，人工智能执法应用是指在新一代信息技术快速发展的背景下，海量吸存数据，把传统的人流、物流、资金流形成的信息化“社会流”纳入管控，利用云计算、云平台进行智能分析和处理，以“人”为中心，掌控“屋、车、路、网、场、组织”等周边要素，形成的动态轨迹管控机制。[^((5))](#chapter4.xhtml#jz_01_0915)\n\
    \n从技术架构来看，人工智能执法应用以互联网、物联网、云计算、智能引擎、视频技术、数据挖掘、知识管理等为技术支撑，以信息化为核心，通过互联化、物联化、智能化的方式，促进执法系统各个功能模块高度集成、协调运作。[^((6))](#chapter4.xhtml#jz_01_0916)\n\
    \n究其根本，从行政执法的本质概念出发，人工智能执法应用是指具有执法权的行政主体，包括主管行政机关和经合法授权、具有行政职能的非行政机关组织，将人工智能技术运用到执法的各个环节的具体过程。主要表现形式是公安机关和政府各部门，如林业、环保、应急管理部门等，运用大数据、算法等人工智能技术，在交通执法、生态保护等领域开展执法活动。公安机关作为行政执法领域最为突出的主体，也是人工智能执法应用的典型代表，本章也将重点围绕这一核心主体展开。\n\
    \n### 三、人工智能执法应用的发展历程\n\n人工智能执法应用的发展历程主要可分为数据化、网络化、合成化、智慧化四个阶段，厘清人工智能执法应用发展的历史脉络，探析技术视角下人工智能执法应用发展的阶段性成果，有助于把握智能技术对执法领域的智慧重构。鉴于公安机关的执法权最具代表性，且其对人工智能执法应用的探索也处于领先地位，本章将以公安机关对人工智能技术的应用为索引，简要介绍人工智能执法应用的发展历程。\n\
    \n##### （一）数据化1.0阶段\n\n20世纪70年代，“自动化”一词便出现在办公室日常工作当中，主要目的是实现纸质作业向电子审批的转型。20世纪80年代，公安数据和信息仍以纸质形式保存，案件侦查靠人眼、人证，巡逻、盘查、出警靠人力。2000年以后，随着计算机的普及，数字化警务悄然兴起，公安机关也开始利用计算机实现信息的采集、录入、查询。\n\
    \n##### （二）网络化2.0阶段\n\n21世纪初，中国实施“金盾一期”工程，旨在提高公安信息基础设施基数，拓宽信息通信技术在警务领域的应用面向，加大局域网渗透警务领域的力度，推动公安系统主客体的串联，形成基于互联网的分级式指挥调度模式。2006年，国家为公安机关量身打造的金盾工程一期项目如期完成，90%以上公安机关基层所队完成了网络接入。在这之后，公安机关对网络化警务驾轻就熟，各警种纷纷建设应用各类信息系统，分级指挥调度模式，依托警用地理信息系统和全球卫星定位系统，各种移动终端、单兵装备大范围到位。\n\
    \n##### （三）合成化3.0阶段\n\n虽然警务数据节点式的扩散和空间化的布局给警务系统带来了“数据红利”，但“数据藩篱”和“归属壁垒”依旧存在，信息共享机制的失灵引发了警令重叠、警情阻塞、部门林立、各自为战等现象，致使多警种、跨部门、跨区域的协同作战难以有序展开。为此，在破解警务信息流通困局的前提下，我国继续实施以形成公安机关信息资源和社会信息资源全警采集、全警应用、全警共享的公安信息化应用格局为目标的“金盾二期”工程，在此基础上形成了以数据导向、集成指挥、合成作战为特征的合成化警务。[^((7))](#chapter4.xhtml#jz_01_0917)\n\
    \n##### （四）智慧化4.0阶段\n\n2013年，互联网席卷，人流物流大迁徙，治安形势日趋复杂化、网络化，需进行多警种、跨部门紧密协作，大数据在公安领域萌芽。2017年7月，国务院《新一代人工智能发展规划》提出“要利用人工智能提升公共安全保障能力”，公安机关开启智慧警务的发展新征程。2019年5月，全国公安工作会议明确将大数据列为推动公安工作创新发展的引擎和培育战斗力生成的新增长点。在面向人工智能时代的华丽转场中，警务系统的发展趋势、内容要素、治理结构和表现形式再次发生了颠覆性的变革与创新，逐渐从数据化警务、网络化警务、合成化警务转向智慧化警务。\n\
    \n### 四、人工智能执法应用的意义\n\n人工智能既是多种数字技术范式更迭的产物，也是驱动社会治理多重变革的算法工具。在新技术革命条件下，人工智能赋能传统执法迈向以数字化、网络化、智能化为主要特征的智慧警务时代。\n\
    \n##### （一）人工智能执法应用是未来演进的必然趋势\n\n近年来，随着公安信息化建设的持续推进，我国公安机关的警务改革已开始迈进智能化发展的快车道，警务与人之间的相互感知和联系越来越紧密，人工智能执法应用建设已成为当代警务发展的新趋势。人工智能执法应用的感知、整合、共享、创新等特点，使公安管理和警务理念都发生着重大转变。发展更科学、管理更高效、指挥更有力、服务更便捷的主体思路日渐突出是未来人工智能执法应用演进的必然趋势。[^((8))](#chapter4.xhtml#jz_01_0918)\n\
    \n##### （二）人工智能执法应用是推动公安战斗性转型、治理现代化的必然要求\n\n人工智能执法应用对于整合警务资源、改造警务流程、创新警务模式、降低警务成本、实现警务效能的最优化具有推动作用。这场新警务革命的实质是推动公安机关建设和警务工作由数量规模型向质量效能型、由人力密集型向科技密集型转变。它要求把传统的公安机关战斗力生成模式转变到依靠科学技术特别是以信息技术为核心的高新技术上来。在这一转变过程中，大数据将成为公安机关战斗力生成的核心要素，公安机关拥有对海量数据占有、控制、分析、处理的主导权，可将大数据优势转化为公安决策优势，继而转化为治安优势。[^((9))](#chapter4.xhtml#jz_01_0919)此外，兼具智性与人性、数据与算法的人工智能执法应用建设对于加快数字中国和平安中国建设具有重要的实践意义，对于不断推进国家治理体系和治理能力现代化具有重要的样本意义。[^((10))](#chapter4.xhtml#jz_01_0920)\n\
    \n## 第二节  \n\n人工智能执法应用的实践\n\n### 一、人工智能执法应用的系统架构\n\n人工智能执法应用的系统架构是一个完善、相互联系且相互支撑的整体，主要包括技术层、应用层、主体层。技术层包括感知层、网络层与数据层。感知层是人工智能执法应用的基础，其通过摄像头、射频识别、智能终端、传感器等泛在网技术，实现对公安管理要素和治安控制对象的物质属性、环境状况、行为态势等静、动态信息的大规模、分布式的信息采集与状态辨识。感知层所需要的关键技术包括智能识别、检测技术、短距离有线和无线通信技术等。网络层是人工智能执法应用的通信网络，包括大容量、高宽带、全覆盖的公安专网、互联网、电子政务网、视频物联网、移动警务网、无线集群网等。数据层主要对海量公安数据进行存储和处理。应用层将基于云计算、海量存储、数据挖掘等服务支撑的各种智慧应用，包括警务云计算中心、警务指挥与控制中心、警用地理信息系统、智慧警察管理、智慧道路交通管理、智慧治安防控体系、智慧人口管理、智慧社区警务、智慧公安教育训练等进行整合，进而构建起智慧的公安管理体系、公安执法体系和公安服务体系。主体层是人工智能执法应用的主体，包括各级政府、公安机关及其民警队伍、公众及其他社会组织。人工智能执法应用不是一个简单的信息化项目和单项工程规划，需要多个部门整体协调。因此，政府在人工智能执法应用建设中必然担当起引导者、规划者、投资者、协调者和应用者的角色。公安机关是人工智能执法应用建设的职能部门，直接负责和组织人工智能执法应用的建设与运营。公众是社会的主人，是人工智能执法应用的参与者和受益者。其他社会组织作为社会治安的消费者也应当积极参与和支持人工智能执法应用建设。此外，从技术层面看，人工智能执法应用建设辅助主体还应包括电信运营商和信息技术软硬件开发商，它们主要为公安机关提供网络服务和技术服务。[^((11))](#chapter4.xhtml#jz_01_0921)\n\
    \n### 二、人工智能执法应用的技术核心\n\n##### （一）数据是人工智能执法应用的基础\n\n公安机关作为与个人、企业及其他组织联系最为紧密的部门，一直在“默默地”收集、存储及处理各种类型的数据，这就为人工智能执法应用的出现奠定了坚实的基础。《人民警察法》第2条第1款对警察的职责进行了明确规定，规定概括起来大致可以分为“保护个人生命、身体及财产安全”和“维护公共安全与秩序”两大部分。在履行警察职责的活动中，既有限制公民的权利和自由的活动，也有非限制公民的权利和自由的活动，无论是哪种活动，收集、处理各种数据均是必不可少的环节。从公安信息化基础设施建设角度看，我国先后开启了“金盾工程”“平安城市”“雪亮工程”等公安信息化工程。通过摄像头、射频识别、智能终端、传感器等泛在网技术，实现了对公安管理要素与治安控制对象的物质属性、环境状况、行为态势等静、动态信息的大规模、分布式的信息采集与状态辨识。如今，治安监控系统、道路监控系统、居民身份系统、现场图像采集系统等系统中的有效数据奠定了人工智能执法应用发展的基础。[^((12))](#chapter4.xhtml#jz_01_0922)\n\
    \n近年来，各级公安机关针对大数据的治理和应用进行大量的摸索并付诸实践，取得很多基于大数据的技战法，积累了很多应用大数据的经验，但仍有各部门信息共享存在壁垒、数据系统重复构建等问题。针对这些问题，公安部在2018年1月成立全国公安大数据工作领导小组，旨在统筹规划全国公安大数据建设工作，该小组提出要加快推进数据流、业务流、管理流融合，其善于从海量的数据资源中挖掘内在价值，善于以大数据应用助推警务机制变革。[^((13))](#chapter4.xhtml#jz_01_0923)\n\
    \n##### （二）算法是人工智能执法应用的灵魂\n\n大数据问题的核心就是大数据技术，即从各种各样的巨量数据中，快速获得有价值信息的技术，而大数据分析则主要借助数据分析工具以及数据挖掘算法，从海量的数据中挖掘出有价值的信息。数据挖掘算法是大数据分析的理论核心，各种数据挖掘的算法只有基于不同的数据类型和格式才能更加科学地呈现数据本身的特点。各类算法工具为大数据警务创造了无限可能性，其核心就是将“因果关系”转变为“相关关系”，将“合理怀疑”转变为“大数据怀疑”。在人工智能执法应用中，警务部门通过找到一个现象的关联物，相关关系就可以帮助我们捕捉现在和预测未来。此外，在警察执法中，警察盘查权是一种重要的权力，它是警务部门对可疑人员和可疑场所进行临时阻拦、盘问、检视、检查的权力。警察行使盘查权的一个重要条件是“合理怀疑”或“有违法犯罪嫌疑”，其标准一般建立在警察的经验判断之上，而“经验”常常被随意扩大。在人工智能执法应用中，大数据的相关关系分析法更准确、更快，而且不易受偏见的影响。正确使用大数据怀疑，不仅可以提高准确性和效率，而且还能对犯罪活动模式产生意想不到的洞察。[^((14))](#chapter4.xhtml#jz_01_0924)\n\
    \n### 三、人工智能执法的应用场域\n\n##### （一）治安防控场域以城市管理、交通执法为典型\n\n从应用场域来看，人工智能执法应用主要涉及破案打击、治安防控、反恐维稳、规范执法、情报研判、服务群众六个场域，治安防控场域下包括安全检查、报警处理、城市管理、高空抛物、交通执法、戒毒干预、犬只管理、网络监管、小区安防、校园安全、疫情管理、应急管理等12个具体场景，其中，城市管理、交通执法场景中人工智能执法应用得最为广泛。\n\
    \n《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》（以下简称“十四五”规划）的要求与城市数字化转型的迫切需求使得城市管理场景的应用数量增加。“十四五”时期，数据作为新的生产要素，人工智能作为新的生产力，云计算作为新的生产工具，将助推城市数字化转型，所以城市管理场景的突出表现离不开城市数字化转型的时代趋势。2021年7月，城市管理场景已在17个省级行政区落地，覆盖的全国省级行政区过半数，已经成为未来人工智能执法应用发展不可逆的一个趋势。城市数字化转型涵盖城市生产、生活、生态等方方面面，包括经济数字化、生活数字化、治理数字化等领域，其首次被提出是在2021年1月上海市委、市政府发布的《关于全面推进上海城市数字化转型的意见》中。人工智能在城市管理场景的应用大多集中在东部的省级行政区，特大城市、超大城市对城市数字化转型的需求更为迫切。\n\
    \n人工智能技术在交通执法场景的应用主要体现在城市交通大脑、交通运输、出行服务等方面，其技术实质就是对城市交通场景中众多传感器采集的数据信息进行关联性处理与分析，从而进行集中的交通管控，优化非现场执法。交通执法场景的应用几乎已经覆盖全部省级行政区，正向技术纵深化方向发展。人工智能技术在交通执法场景应用较广的原因有两点：一是其适用性强，入门门槛较低，可成为人工智能执法应用的试点领域；二是随着机动车保有量的不断增加，交通执法场景对人工智能技术的要求也会越来越高，已能实现人工智能自主学习下的路权的自动分配。\n\
    \n##### （二）规范执法场域强调执法程序受到监督\n\n以功能进行区分，规范执法场域可分为网格化执法巡查系统、智能执法办案系统、市场信用评价系统、可视化调度指挥系统、执法监督考核系统、执法云存证系统、大数据分析研判系统、互联网公示平台、执法专项应用系统等九个方面。从应用场景来看，应用较为广泛的是执法监管、案件辅助和智能审讯场景。\n\
    \n首先，执法监管场景主要是对公安机关接处警、受立案、涉案财物管理、执法办案等全流程的监督，其一方面使得执法流程透明化、清晰化、数据化，另一方面也通过评价机制的运用提升执法办案质量。其次，案件辅助场景强调公安机关、检察院、法院、司法局刑事办案信息数据的互联互通、一网运行，实现智能辅助办案从打击犯罪到司法审判全流程覆盖。最后，智能审讯则实现了受害人无接触式询问、身份识别、自然语言识别、在线视频示证等功能，使得公安机关在审讯过程中能够快速地获取与案件相关的基本信息，由此提高了审讯工作的效率。由此可见，人工智能执法技术的应用不仅仅体现在公安机关对交管治安等领域的主动管理中，还体现在公安机关受到人工智能技术的监督中。\n\
    \n##### （三）服务群众场域聚焦“一网通办”\n\n人工智能技术在服务群众场域的应用主要表现在各省级行政区“一网通办”服务事项的增加和服务质量的提升。2021年7月，全国31个省级行政区均已建立省级“一网通办”平台，不少省级行政区早在2019年就已建成“一网通办”平台，2021年只是对其进行了升级，如扩大服务事项的覆盖面、增加服务事项的数量、扩大“一网通办”的平台应用渠道，将其从电脑端、APP客户端扩展至微信小程序、支付宝小程序等端口。“一网通办”平台服务事项的数量已较为庞大、初具规模。此外，“一网通办”跨省、跨地区的合作也在不断深化。上海、江苏、浙江、安徽长三角“一网通办”，“京津冀+雄安（3+1）”政务服务协同发展平台，泛珠三角区域“跨省通办”，四川、重庆、云南、贵州、西藏西南五省市“跨省通办”正在逐步推开。长三角“一网通办”已实现65个服务事项跨省通办，覆盖长三角地区41个城市的政务服务中心；“京津冀+雄安（3+1）”政务服务协同发展平台已实现178项便民服务跨省办理；泛珠三角区域“跨省通办”可一站办理广东、广西、海南、湖南、江西、湖北、福建等地共470项政务服务事项。\n\
    \n### 四、人工智能执法的典型应用\n\n##### （一）城市治理数字化平台\n\n我国城市存在巨大的存量治理和精细化发展需求，随着城市公共管理的数据来源不断扩大，城市大数据平台也逐渐发展成为多方共建共用共享的大数据平台。应在充分运用知识图谱技术的基础上，实现分散数据资源的联通共享并对政务数据和社会数据进行深度挖掘，最大化发挥数据要素的效能。\n\
    \n上海通过运行“一网统管”创造性地推出了一套较为完整的城市运行基本体征指标体系，其将城市运行数据分成三大类：第一类是“获得感”数据，主要包括“菜篮子”、“米袋子”、水电煤气等基本民生保障类，包括巡查价格是否平稳、供应是否充足、负荷是否超标、网速宽带使用是否正常等；第二类是“幸福感”数据，主要包括陆海空出入口的实时变化情况、市内交通畅通与否、景区密集程度等；第三类是“安全感”数据，主要包括各类突发性事件、热线情况。遍布上海的560多万个物联感知设备，无时无刻不在监测建筑物、道路、供水、电力、燃气、环境等基础设施动态情况，实时回传数据，一有异常立即告警。江苏省南通市基于京东数科“智能城市操作系统”建成了全国首个市域治理现代化指挥中心，该中心打破数据孤岛，汇聚南通市64个部门、10个县市区数十亿量级的数据。该系统开发了1张总体态势图和16张专题图，助力城市管理者对城市运行的方方面面实现“一屏统揽”。指挥中心在“数据融合强应用”方面建设了危化品全流程监管系统等一批全市域、跨部门的创新应用。\n\
