    公共数据治理主体方面，以上海、浙江为例的公共数据治理主体架构中，皆形成专门的公共数据主管部门或令数据中心成为数据项目的实施者和直接责任主体。在试点地区形成的规则中，这类主体具备地级政府直接授予的数据管理权限，向地级政府专门领导小组负责，受到市级政府监督。[^((1))](#chapter6.xhtml#jz_01_1001)另外，数据主管部门或者数据中心有权要求辖区内各政府部门协同参与数据开放和管理工作。在此过程中，其他各政府部门承担协助义务，部门之间应当做到分工明确、互相衔接、不得重复。数据主管部门具有较为独立的组织地位，其在地级政府的授权下进行数据协同开放管理，能够提高跨部门工作效率，减少不同部门之间因为数据牵涉自身利益而发生的推诿问题。这种专门部门直接实施、行政主体监督指导、各类部门协同参与的条块结构能够较好地适应数据管理的跨领域、跨部门性。2020年4月13日，国家互联网信息办公室、国家发展改革委等12个部门联合发布《网络安全审查办法》，该办法以网络安全审查办公室为直接安全负责部门，同样采用这种条块结合、统一领导、分级负责的数据治理模式。


    针对具体应用场景方面，在金融数据领域，《个人金融信息保护技术规范》（以下简称《规范》）作为金融行业标准已经由中国人民银行发布，并于2020年2月13日实施。《规范》规定了个人金融信息全生命周期的安全防护要求，为金融机构提供了参照与指导。此外，近年来中国人民银行还发布《关于银行业金融机构做好个人金融信息保护工作的通知》《关于金融机构进一步做好个人金融信息保护工作的通知》《银行业消费者权益保护工作指引》《金融消费者权益保护实施办法》《个人金融信息（数据）保护试行办法（初稿）》《关于进一步加强征信信息安全管理的通知》等一系列规章及规范性文件。此外，在公共卫生数据方面，国家卫健委于2018年7月12日推出了《国家健康医疗大数据标准、安全和服务管理办法（试行）》，旨在加强健康医疗大数据服务管理，充分发挥健康医疗大数据作为国家重要基础性战略资源的作用。中国移动在业内率先发布《重大突发公共卫生事件网信安全法律风险合规指引》，针对电信运营商在重大突发公共卫生事件中如何合规地发布公益信息，相关的法律风险有哪些和如何在此过程中保护个人隐私等多个重点难点问题进行了梳理。


    ## 二、现状梳理


    ### （一）中央：强调社会主体对数据安全责任的承担


    2021年6月，全国人大常委会通过的《数据安全法》是我国第一部有关数据安全的专门法律，也是国家安全领域的一部重要法律。建立国家法律层面的数据安全法，有助于形成数据生产企业和各级政府管理部门的数据保护意识，完善统一的数据分类分级保护目录；建立规范基准之上的数据获取、数据利用和数据治理的有针对性和细颗粒度的数据保护，有助于促进数据产业合理合规利用数据、共享数据和开放数据，推进我国数字化战略进程，有效支撑云计算、大数据、人工智能、物联网、区块链和5G可持续性发展。出台《数据安全法》也是应对全球数字化和一体化经济发展的重要举措，其明确了规范跨境数据流动和流转的法律要件，明确了数据跨境流动的出口管制、报批制度和反制措施，从而明晰了国内存储数据的跨境和境外司法监管的保护机制，有助于开展跨境国际数据交流合作，促进数据跨境安全自由流动，履行数据相关主体的责任义务和报批流程，实施国家利益的数据出口管制，应对境外数据活动的歧视性政策和反制措施，使得我国境内数据安全保护有了国家尚方宝剑。


    ### （二）贵州：强调政府的开放与安全统管责任


    贵州省市场监督管理局于2019年8月发布《贵州省大数据安全保障条例》，该地方性法规与中央发布的数据安全管理政策不同，并没有从个人信息和重要信息的严格保护角度制定规则，反而以《保守国家秘密法》为主要的上位法依据，设计大数据的宏观治理结构，以安全责任、监督管理、知识产权保障等手段聚焦防范大数据攻击、平台数据窃取、干扰、窃取、公开等意外事故，保障大数据真实性、完整性、有效性、保密性、可控性，强调政府机关（如公安部、国家互联网信息办公室、国家信息中心大数据发展部等）的安全保管义务。


    ### （三）浙江：强调数据开放与安全并行发展


    2020年浙江省政府办公厅发布《公共数据开放与安全暂行管理办法》，该地方政府规章围绕公共数据安全，制定涵盖数据全生命周期（采集、归集、清洗、共享开放、运用、销毁）的安全管理措施。该规章借鉴了其他国内数据安全相关法律法规的规定，例如数据采集的合法必要性原则、突发事件收集数据的合法性、开放主体公共管理职责、侵犯个人信息和商业秘密保护等规定，提出公共数据的安全性是开放的前提与基础。


    ### （四）上海：构建数据开放服务的动态管理及闭环模式


    依据国务院印发的《促进大数据发展行动纲要》（国发〔2015〕50号）等文件的精神，为推动政务数据资源优化配置和增值利用，促进政府部门间业务协同，上海在2016年2月下发《市政府关于印发＜上海市政务数据资源共享管理办法＞的通知》（以下简称《通知》）。《通知》提出政府信息共享的目的依据、概念定义、职责分工、原则要求、资源管理平台属性、数据采集原则、共享使用原则等内容。同年12月，市政府制定发布《上海市推进智慧城市建设“十三五”规划》，成为地方政府中依托大数据推进政府信息共享机制建设的先行者。2018年4月，上海市大数据中心正式揭牌成立，中心旨在构建全市数据资源共享体系，制定数据资源归集、治理、共享、开放、应用、安全等技术标准及管理办法，实现跨层级、跨部门、跨系统、跨业务的数据共享和交换。2018年9月，市政府颁布《上海市公共数据和一网通办管理办法》（以下简称9号令），其目标定位是促进公共数据的整合应用，提升政府治理能力和公共服务水平。9号令对公共数据进行定义：各级行政机关以及履行公共管理和服务职能的事业单位在依法履职过程所采集和产生的数据资源。此外，9号令还明确了公共数据的主管部门，即市政府办公厅。办公厅负责统筹规划和协调推进、指导监督上海市公共数据中全流程环节（归集、整合、共享、开放、应用、管理）的相关工作，具体实施工作则由市大数据中心来负责组织。其他政府部门，例如经济信息化部门则参与对公共数据开放、应用开发的指导和协调工作。2019年8月，市政府颁布《上海市公共数据开放暂行办法》，进一步对开放和利用数据，提升政府治理能力和公共服务水平，推动数字经济发展等内容进行了规定。


    ## 第三节 人工智能社会治理和公共服务应用的风险分析


    ### 一、数据全生命周期的安全风险点


    大数据和各种智能化硬件带来的生产和生活场景的智能化变革导致数据井喷式增长，数据的采集终端越来越多、采集频率越来越快，整个人类社会每时每刻都在产生着海量数据，这使数据在采集阶段的安全风险陡然增加。同时，数据作为机器学习的根基，持续推动智能化技术的快速成熟与迭代，将带来更广泛的数据应用，而这又将形成更大的数据资源库，其结果是，对数据的分级分类管理工作难度呈几何式增长，数据的质量管控工作越来越具有挑战性。另外，随着人工智能技术的发展，对数据的深度分析和挖掘活动的规模和频率迅速增加，个人敏感信息、国家重要信息被非法流转和利用的可能性剧增。其中令人关注的是，许多国外商业和研发机构因其业务之需或其他目的，正在通过挖掘爬取、交易购买、资助学术、联合开发等方式，不同程度地收集、处理、使用上海这座经济活跃的超大城市散布的数据。尤其不少国外科技公司更加会进一步通过伪装，渗透、刺探大量的敏感领域数据，以及监控数据传输、控制数据流向、操纵网上内容，直接在境内或跨境导致数据的违规非法使用并严重威胁上海的城市安全与社会稳定。


    因此，覆盖数据全生命周期的数据安全问题主要有三个，分别为数据隐私问题、数据质量问题和数据保护问题。数据隐私问题指在公共数据的挖掘、测试、运行过程中存在的隐私侵犯问题，这一类问题当前是公共数据应用需要解决的关键问题之一；数据质量问题主要指潜在于机器学习的训练数据集以及采集的现场数据中的质量问题，及其可能导致的后果；数据保护问题主要指数据开发应用企业对持有数据进行安全保护时涉及的问题，涉及数据的采集、传输、存储、使用、流转、销毁等全生命周期（见图6-1）。


    ![](images/img10_p260_1.jpg)


    **图6-1　数据全生命周期的风险点**


    ### 二、数据基础设施的三种模式


    数据信息安全防护的相关技术是保障公共数据安全的一个重要维度。从一定意义上讲，个体信息安全关系到个体的隐私保护等权益，而群体信息安全关系到群体利益与国家安全。一旦公共数据在流通过程中出现保密性、完整性、可靠性等方面的安全风险，整个国家的公共数据治理体系都会面临重大的数据信用危机。各省市应按照国家统一的技术标准和安全准则，进行公共数据信息平台设计、建设和应用，了解底层技术对公共数据安全的影响。常见的数据存储及传输技术有分散型、集中型、区块链型三种模式，分别在数据安全方面有各自的特点。


    #### （一）分散型——分布式服务总线交换机制


    企业连接框架是企业服务总线的一种具体实现。该框架的首要目标是通过使用标准的开放的协议以及经过验证的企业应用集成模式，将不同的应用程序系统集成起来。企业服务总线（Enterprise
    Service Bus，ESB）是将传统中间件技术与XML、Web服务等技术相结合的产物。ESB提供了网络中最基本的连接中枢，是构筑企业神经系统的必要元素。基于企业服务总线的技术是政府数据共享交换解决方案之一，在企业服务总线基础上，分布式政府数据资源共享交换采用面向服务的架构（Service-Oriented
    Architecture，SOA），结合相应的服务语义、流程服务等技术构建电子政务解决方案。如湖南长沙市就采用了企业服务总线的架构（见图6-2）。


    ![](images/img10_p261_1.jpg)


    **图6-2　分布式服务总线交换机制**


    资料来源：长沙市应用支撑平台


    分布式服务总线机制具有的优势在于数据的收集面更广、数据来源更贴近用户端，从数据安全的角度来说，存在三方面的问题：（1）发布服务需要对原来系统进行部分修改或重构，无法对数据原本的安全性追根溯源；（2）各主体间交换数据，需要复杂的配置服务，安全维护成本高；（3）数据清洗、比对的工作被交给了用户端，造成用户端工作量巨大；数据的安全保障基本由各分散存储点自行掌控，安全标准难以统一。


    #### （二）集中型——数据集中共享机制


    数据中心对数据采用大集中模式实现共享、逐级采集，其对多个不同的机构进行数据采集，并对源数据进行归并分析，形成统一的资源库。目前有多个国家部门、省、市、高校采用大集中模式建设数据中心，实现数据共享，以环境公共数据为例，国家环境数据中心的建设就采用了大集中模式（见图6-3）。


    ![](images/img10_p262_1.jpg)


    **图6-3　数据集中共享机制**


    这种机制的优势是可以统一数据资源，保证对外提供数据的一致性。但是，在该机制下数据中心的存储量及对不同的数据源需要进行的收集、比对、清洗和异构数据转换等工作导致数据中心服务端工作量非常大，并且存在无法保证数据实时性及执行的配合度问题。在该机制下，数据安全性较高，但是数据的可流动性较差。


    #### （三）区块链型——分布式加密存储共享


    区块链以哈希值加密分布式记账，记录数据资产的整个交易过程，实现去中心化实时数据共享，实现多方相互监督。将交易过程数据存储在网络中无数电脑的数据库中，通过实时透明化的多方相互交叉监督，代替传统的第三方担保，建立更强的信任关系。其技术突破点在于：（1）实现底层数据库之间的互联互通，它能从根本上解决TCP/IP协议难以解决的数据孤岛问题，也就可以推动传统互联网发展到新的阶段。（2）区块链从技术上解决了“数据确权”问题：通过竞争机制下的“矿工”，为信息打上“时间戳”，使前后传播的信息间产生异质性；通过“智能合约”，自动实现信息在不同主体间传播时的产权流动；通过“分布式账本”，即多方主体相互制约、相互监督的形式保证这个过程的实现；明晰数据产权，使个体、企业、政府间数据边界得以澄清，在实现隐私保护前提下，巩固数据交易市场根基。区块链技术有效赋能金融市场，促成了金融数据在开放性和安全性上的质的飞跃。虽然这类技术能够解决数据外部存储的安全性问题，但是区块链技术对公共资源的占用度较高，当前仅能针对有限范围的重要数据进行精准存证，不能完全解决数据存储中的安全性问题。


    公共数据安全必须解决数据本身的可信任度问题。可以利用区块链技术，以分布式账本为基础，根据不同的数据权属、功能定位、应用场景和开放权限构建不同层级的协议。区块链的可监管、可治理、高信任等特点，使我们在流通公共数据的过程中可以避免数据造假行为，达到数据的全链校验和信用公示，切实解决数据验证与信用自律等难题，达成数据流通过程中权利人和流通者的利益共识。需要注意的是，尽管区块链技术可以大大提高效率，但社会的正常运行仍需要相关权力部门的合理干预，因此，国家往往需要确立专门的监管部门来负责管理数据写入权限，确保每个主权区块链点对点的参与者都能够遵守数据使用规则。


    ### 三、风险防控的基本对策


    从制度环境来看，法律政策是中央或地方政府部门保证其制定和推行的相关战略与政策一致性、连贯性的重要抓手，法律政策是否完善及其对政府数据治理的支持程度都会成为影响公共数据开放、共享的因素。个人隐私及数据安全保护方面的法律规范的缺失，尤其是各层级、各部门的数据权属不清，严重制约了地方政府数据共享，进一步造成安全责任难以有效落实。


    #### （一）法律法规应对


    ##### 1．确立公共数据权属


    应明晰公共数据社会化应用的理论前提及与公共数据相关的法律关系和权利属性，进而根据确定安全责任人，形成责任制约束。当前各国数据治理实践普遍存在数据权属关系不清造成的部门之间以邻为壑、数据共享进展缓慢、数据安全隐患等问题。目前，针对数据的权属及法律关系问题，理论和实践中都没有通行的定义，数据没有在法律上被赋予资产的属性，所以数据所有权、使用权、管理权、交易权、享有权没有被相关的法律所充分认同和明确界定。结合国内外立法，对数据权属问题主要有三种截然不同的态度：


    第一种类型以欧盟为代表，英国、巴西、印度等国家也采用这种类型，其基于个人权利严格保护的立法态度，将受保护的客体限定在个人数据或个人信息。如英国《数据保护法》（Data
    Protection Act）主要目的是保护个人信息不被误用或滥用。《数据保护法》第1条就明确该法规制个人数据的处理，其中包括：基于数据主体同意或其他情形，合法、公平获取个人数据；经授权后可处理个人数据等信息，但需纠正不准确的个人数据。欧盟《通用数据保护条例》第1条也表明该规定是针对自然人的个人数据处理以及个人数据流动，该规定保护自然人对其数据的基本权利与自由。从印度《2018年个人数据保护法（草案）》第2条、巴西《通用数据保护法》第3条可以看出，印度、巴西的数据保护立法均追随欧盟《通用数据保护条例》，采用统一立法模式。与《通用数据保护条例》旨在解决保护欧洲公民的基本权利与促进数据流通两个核心目标不同，印度《2018年个人数据保护法（草案）》提出了保护公民利益、贸易和工业利益、国家利益三重目的，希望实现以公民利益为重点，并与保护贸易和工业利益以及国家利益的完整达成微妙平衡的综合目的。巴西《通用数据保护法》则将立法目的明确为保护自由和隐私的基本权利以及自然人人格的自由发展。从强化数据主体基本权利的共同目标看，这一类型的数据保护法主要从提升个人数据主体控制力和加强数据控制者的义务责任两方面加以规定，在提升个人数据主体控制力方面，强化个人数据收集和处理的“知情同意原则”，完善细化数据主体的知情权、访问权等；在加强数据控制者的义务责任方面，将数据控制者内部的数据保护官制度升格为一般性机制，并对数据保护官的地位、职能等进行细致规定。


    第二种类型以中国、美国为代表，其对于数据权利保护保留观望的态度，从立法层面和司法实践来看，我国在数据权利保护层面主要以司法实践进行个案型场景式应对，寻求结合现有法律框架的亦步亦趋的处理方式，个人信息保护和企业数据财产权并重地稳步推进数据立法。美国在个人数据保护方面，仍然坚持公平信息实践原则，采取分散立法模式，也未设立统一的个人信息保护机构；采用行业自治为主，专门性立法为辅的保护模式。美国立法和政策制定者希望市场在个人数据保护方面发挥主要作用。


    第三种类型以澳大利亚为代表，其持较为开放宽松的数据权属保护态度。澳大利亚《数据使用规范（草案）》，成为规范收集、使用、管理和披露数据的行业标准。该规范以“不损害”用户权益为核心，要求机构组织采取措施确保数据无法二次定位到用户，并非以严格保护为出发点。2019年8月1日，澳大利亚参议院通过《用户数据权利法案》（Customer
    Data Right Bill）。法案的主要内容为数据用户有权利将自己的数据共享给其他数据平台。赋予用户数据权利是开放式银行业务（Open Banking）最重要的一个环节，故法案的通过给了金融科技公司很大的支持，同时也增加了金融科技公司与大银行之间的竞争。


    综上所述，各国针对公共数据的权利属性和治理关系有不同的规制模式，体现出对数据产业保护和数据安全性的不同权衡标准。安全责任承担者也根据权属分配的不同，在政府与企业之间平衡取舍。


    ##### 2．廓清法律规则结构


    数据保护法律规则是大数据安全的重要基础。以如下国家近期数据保护的主要法律为例（见表6-1），各国制定相关法律法规的思路和策略有框架性的相似之处，但也有一些区别，体现在对管辖地区、保护数据的定义方式和监管主体组织构造等方面。


    **表6-1　各国数据安全法律监管模式对比**


    ![](images/img10_p267_1.jpg)


    在具体规则层面，可以从数据监管者、数据主体、数据控制者三方关系出发，整理出如下规则：


    （1）数据监管者


    第一，监管的辖区范围。监管的辖区范围指法律法规规定的所能管辖的数据涉及的领土范围，尤其是设立在境外的数据中心是否受到本国法律法规的监管是目前业界关注的重点问题之一。不同国家和地区对此的规定有一定的差异性。如美国、澳大利亚、中国的管辖范围是本国领土，也就是说，外国企业以及本国企业设在境外的数据中心，可能会逃避本国法律法规约束。但欧盟、俄罗斯、新加坡等国家和地区则相对监管较严，如俄罗斯规定其数据保护法律法规不受领土管辖权的限制，适用于任何在俄罗斯发生的所有数据处理过程，包括对俄罗斯公民数据的收集和使用，而不论数据中心是否建立或位于俄罗斯境内。对于跨境的数据流，如果俄罗斯公民是对应的数据传输协定中的一方，那么该数据流就处于俄罗斯的数据保护法律法规监管辖区范围内。

    '
  trans: '


    公共数据治理主体方面，以上海、浙江为例的公共数据治理主体架构中，皆形成专门的公共数据主管部门或令数据中心成为数据项目的实施者和直接责任主体。在试点地区形成的规则中，这类主体具备地级政府直接授予的数据管理权限，向地级政府专门领导小组负责，受到市级政府监督。^((1))另外，数据主管部门或者数据中心有权要求辖区内各政府部门协同参与数据开放和管理工作。在此过程中，其他各政府部门承担协助义务，部门之间应当做到分工明确、互相衔接、不得重复。数据主管部门具有较为独立的组织地位，其在地级政府的授权下进行数据协同开放管理，能够提高跨部门工作效率，减少不同部门之间因为数据牵涉自身利益而发生的推诿问题。这种专门部门直接实施、行政主体监督指导、各类部门协同参与的条块结构能够较好地适应数据管理的跨领域、跨部门性。2020
    年 4 月 13 日，国家互联网信息办公室、国家发展改革委等 12 个部门联合发布《网络安全审查办法》，该办法以网络安全审查办公室为直接安全负责部门，同样采用这种条块结合、统一领导、分级负责的数据治理模式。


    针对具体应用场景方面，在金融数据领域，《个人金融信息保护技术规范》（以下简称《规范》）作为金融行业标准已经由中国人民银行发布，并于 2020 年 2 月 13
    日实施。《规范》规定了个人金融信息全生命周期的安全防护要求，为金融机构提供了参照与指导。此外，近年来中国人民银行还发布《关于银行业金融机构做好个人金融信息保护工作的通知》《关于金融机构进一步做好个人金融信息保护工作的通知》《银行业消费者权益保护工作指引》《金融消费者权益保护实施办法》《个人金融信息（数据）保护试行办法（初稿）》《关于进一步加强征信信息安全管理的通知》等一系列规章及规范性文件。此外，在公共卫生数据方面，国家卫健委于
    2018 年 7 月 12 日推出了《国家健康医疗大数据标准、安全和服务管理办法（试行）》，旨在加强健康医疗大数据服务管理，充分发挥健康医疗大数据作为国家重要基础性战略资源的作用。中国移动在业内率先发布《重大突发公共卫生事件网信安全法律风险合规指引》，针对电信运营商在重大突发公共卫生事件中如何合规地发布公益信息，相关的法律风险有哪些和如何在此过程中保护个人隐私等多个重点难点问题进行了梳理。


    ## 二、现状梳理


    ### （一）中央：强调社会主体对数据安全责任的承担


    2021 年 6 月，全国人大常委会通过的《数据安全法》是我国第一部有关数据安全的专门法律，也是国家安全领域的一部重要法律。建立国家法律层面的数据安全法，有助于形成数据生产企业和各级政府管理部门的数据保护意识，完善统一的数据分类分级保护目录；建立规范基准之上的数据获取、数据利用和数据治理的有针对性和细颗粒度的数据保护，有助于促进数据产业合理合规利用数据、共享数据和开放数据，推进我国数字化战略进程，有效支撑云计算、大数据、人工智能、物联网、区块链和
    5G 可持续性发展。出台《数据安全法》也是应对全球数字化和一体化经济发展的重要举措，其明确了规范跨境数据流动和流转的法律要件，明确了数据跨境流动的出口管制、报批制度和反制措施，从而明晰了国内存储数据的跨境和境外司法监管的保护机制，有助于开展跨境国际数据交流合作，促进数据跨境安全自由流动，履行数据相关主体的责任义务和报批流程，实施国家利益的数据出口管制，应对境外数据活动的歧视性政策和反制措施，使得我国境内数据安全保护有了国家尚方宝剑。


    ### （二）贵州：强调政府的开放与安全统管责任


    贵州省市场监督管理局于 2019 年 8 月发布《贵州省大数据安全保障条例》，该地方性法规与中央发布的数据安全管理政策不同，并没有从个人信息和重要信息的严格保护角度制定规则，反而以《保守国家秘密法》为主要的上位法依据，设计大数据的宏观治理结构，以安全责任、监督管理、知识产权保障等手段聚焦防范大数据攻击、平台数据窃取、干扰、窃取、公开等意外事故，保障大数据真实性、完整性、有效性、保密性、可控性，强调政府机关（如公安部、国家互联网信息办公室、国家信息中心大数据发展部等）的安全保管义务。


    ### （三）浙江：强调数据开放与安全并行发展


    2020 年浙江省政府办公厅发布《公共数据开放与安全暂行管理办法》，该地方政府规章围绕公共数据安全，制定涵盖数据全生命周期（采集、归集、清洗、共享开放、运用、销毁）的安全管理措施。该规章借鉴了其他国内数据安全相关法律法规的规定，例如数据采集的合法必要性原则、突发事件收集数据的合法性、开放主体公共管理职责、侵犯个人信息和商业秘密保护等规定，提出公共数据的安全性是开放的前提与基础。


    ### （四）上海：构建数据开放服务的动态管理及闭环模式


    依据国务院印发的《促进大数据发展行动纲要》（国发〔2015〕50 号）等文件的精神，为推动政务数据资源优化配置和增值利用，促进政府部门间业务协同，上海在 2016
    年 2 月下发《市政府关于印发＜上海市政务数据资源共享管理办法＞的通知》（以下简称《通知》）。《通知》提出政府信息共享的目的依据、概念定义、职责分工、原则要求、资源管理平台属性、数据采集原则、共享使用原则等内容。同年
    12 月，市政府制定发布《上海市推进智慧城市建设“十三五”规划》，成为地方政府中依托大数据推进政府信息共享机制建设的先行者。2018 年 4 月，上海市大数据中心正式揭牌成立，中心旨在构建全市数据资源共享体系，制定数据资源归集、治理、共享、开放、应用、安全等技术标准及管理办法，实现跨层级、跨部门、跨系统、跨业务的数据共享和交换。2018
    年 9 月，市政府颁布《上海市公共数据和一网通办管理办法》（以下简称 9 号令），其目标定位是促进公共数据的整合应用，提升政府治理能力和公共服务水平。9 号令对公共数据进行定义：各级行政机关以及履行公共管理和服务职能的事业单位在依法履职过程所采集和产生的数据资源。此外，9
    号令还明确了公共数据的主管部门，即市政府办公厅。办公厅负责统筹规划和协调推进、指导监督上海市公共数据中全流程环节（归集、整合、共享、开放、应用、管理）的相关工作，具体实施工作则由市大数据中心来负责组织。其他政府部门，例如经济信息化部门则参与对公共数据开放、应用开发的指导和协调工作。2019
    年 8 月，市政府颁布《上海市公共数据开放暂行办法》，进一步对开放和利用数据，提升政府治理能力和公共服务水平，推动数字经济发展等内容进行了规定。


    ## 第三节 人工智能社会治理和公共服务应用的风险分析


    ### 一、数据全生命周期的安全风险点


    大数据和各种智能化硬件带来的生产和生活场景的智能化变革导致数据井喷式增长，数据的采集终端越来越多、采集频率越来越快，整个人类社会每时每刻都在产生着海量数据，这使数据在采集阶段的安全风险陡然增加。同时，数据作为机器学习的根基，持续推动智能化技术的快速成熟与迭代，将带来更广泛的数据应用，而这又将形成更大的数据资源库，其结果是，对数据的分级分类管理工作难度呈几何式增长，数据的质量管控工作越来越具有挑战性。另外，随着人工智能技术的发展，对数据的深度分析和挖掘活动的规模和频率迅速增加，个人敏感信息、国家重要信息被非法流转和利用的可能性剧增。其中令人关注的是，许多国外商业和研发机构因其业务之需或其他目的，正在通过挖掘爬取、交易购买、资助学术、联合开发等方式，不同程度地收集、处理、使用上海这座经济活跃的超大城市散布的数据。尤其不少国外科技公司更加会进一步通过伪装，渗透、刺探大量的敏感领域数据，以及监控数据传输、控制数据流向、操纵网上内容，直接在境内或跨境导致数据的违规非法使用并严重威胁上海的城市安全与社会稳定。


    因此，覆盖数据全生命周期的数据安全问题主要有三个，分别为数据隐私问题、数据质量问题和数据保护问题。数据隐私问题指在公共数据的挖掘、测试、运行过程中存在的隐私侵犯问题，这一类问题当前是公共数据应用需要解决的关键问题之一；数据质量问题主要指潜在于机器学习的训练数据集以及采集的现场数据中的质量问题，及其可能导致的后果；数据保护问题主要指数据开发应用企业对持有数据进行安全保护时涉及的问题，涉及数据的采集、传输、存储、使用、流转、销毁等全生命周期（见图
    6-1）。


    ![](img/img10_p260_1.jpg)


    **图 6-1　数据全生命周期的风险点**


    ### 二、数据基础设施的三种模式


    数据信息安全防护的相关技术是保障公共数据安全的一个重要维度。从一定意义上讲，个体信息安全关系到个体的隐私保护等权益，而群体信息安全关系到群体利益与国家安全。一旦公共数据在流通过程中出现保密性、完整性、可靠性等方面的安全风险，整个国家的公共数据治理体系都会面临重大的数据信用危机。各省市应按照国家统一的技术标准和安全准则，进行公共数据信息平台设计、建设和应用，了解底层技术对公共数据安全的影响。常见的数据存储及传输技术有分散型、集中型、区块链型三种模式，分别在数据安全方面有各自的特点。


    #### （一）分散型——分布式服务总线交换机制


    企业连接框架是企业服务总线的一种具体实现。该框架的首要目标是通过使用标准的开放的协议以及经过验证的企业应用集成模式，将不同的应用程序系统集成起来。企业服务总线（Enterprise
    Service Bus，ESB）是将传统中间件技术与 XML、Web 服务等技术相结合的产物。ESB 提供了网络中最基本的连接中枢，是构筑企业神经系统的必要元素。基于企业服务总线的技术是政府数据共享交换解决方案之一，在企业服务总线基础上，分布式政府数据资源共享交换采用面向服务的架构（Service-Oriented
    Architecture，SOA），结合相应的服务语义、流程服务等技术构建电子政务解决方案。如湖南长沙市就采用了企业服务总线的架构（见图 6-2）。


    ![](img/img10_p261_1.jpg)


    **图 6-2　分布式服务总线交换机制**


    资料来源：长沙市应用支撑平台


    分布式服务总线机制具有的优势在于数据的收集面更广、数据来源更贴近用户端，从数据安全的角度来说，存在三方面的问题：（1）发布服务需要对原来系统进行部分修改或重构，无法对数据原本的安全性追根溯源；（2）各主体间交换数据，需要复杂的配置服务，安全维护成本高；（3）数据清洗、比对的工作被交给了用户端，造成用户端工作量巨大；数据的安全保障基本由各分散存储点自行掌控，安全标准难以统一。


    #### （二）集中型——数据集中共享机制


    数据中心对数据采用大集中模式实现共享、逐级采集，其对多个不同的机构进行数据采集，并对源数据进行归并分析，形成统一的资源库。目前有多个国家部门、省、市、高校采用大集中模式建设数据中心，实现数据共享，以环境公共数据为例，国家环境数据中心的建设就采用了大集中模式（见图
    6-3）。


    ![](img/img10_p262_1.jpg)


    **图 6-3　数据集中共享机制**


    这种机制的优势是可以统一数据资源，保证对外提供数据的一致性。但是，在该机制下数据中心的存储量及对不同的数据源需要进行的收集、比对、清洗和异构数据转换等工作导致数据中心服务端工作量非常大，并且存在无法保证数据实时性及执行的配合度问题。在该机制下，数据安全性较高，但是数据的可流动性较差。


    #### （三）区块链型——分布式加密存储共享


    区块链以哈希值加密分布式记账，记录数据资产的整个交易过程，实现去中心化实时数据共享，实现多方相互监督。将交易过程数据存储在网络中无数电脑的数据库中，通过实时透明化的多方相互交叉监督，代替传统的第三方担保，建立更强的信任关系。其技术突破点在于：（1）实现底层数据库之间的互联互通，它能从根本上解决
    TCP/IP 协议难以解决的数据孤岛问题，也就可以推动传统互联网发展到新的阶段。（2）区块链从技术上解决了“数据确权”问题：通过竞争机制下的“矿工”，为信息打上“时间戳”，使前后传播的信息间产生异质性；通过“智能合约”，自动实现信息在不同主体间传播时的产权流动；通过“分布式账本”，即多方主体相互制约、相互监督的形式保证这个过程的实现；明晰数据产权，使个体、企业、政府间数据边界得以澄清，在实现隐私保护前提下，巩固数据交易市场根基。区块链技术有效赋能金融市场，促成了金融数据在开放性和安全性上的质的飞跃。虽然这类技术能够解决数据外部存储的安全性问题，但是区块链技术对公共资源的占用度较高，当前仅能针对有限范围的重要数据进行精准存证，不能完全解决数据存储中的安全性问题。


    公共数据安全必须解决数据本身的可信任度问题。可以利用区块链技术，以分布式账本为基础，根据不同的数据权属、功能定位、应用场景和开放权限构建不同层级的协议。区块链的可监管、可治理、高信任等特点，使我们在流通公共数据的过程中可以避免数据造假行为，达到数据的全链校验和信用公示，切实解决数据验证与信用自律等难题，达成数据流通过程中权利人和流通者的利益共识。需要注意的是，尽管区块链技术可以大大提高效率，但社会的正常运行仍需要相关权力部门的合理干预，因此，国家往往需要确立专门的监管部门来负责管理数据写入权限，确保每个主权区块链点对点的参与者都能够遵守数据使用规则。


    ### 三、风险防控的基本对策


    从制度环境来看，法律政策是中央或地方政府部门保证其制定和推行的相关战略与政策一致性、连贯性的重要抓手，法律政策是否完善及其对政府数据治理的支持程度都会成为影响公共数据开放、共享的因素。个人隐私及数据安全保护方面的法律规范的缺失，尤其是各层级、各部门的数据权属不清，严重制约了地方政府数据共享，进一步造成安全责任难以有效落实。


    #### （一）法律法规应对


    ##### 1．确立公共数据权属


    应明晰公共数据社会化应用的理论前提及与公共数据相关的法律关系和权利属性，进而根据确定安全责任人，形成责任制约束。当前各国数据治理实践普遍存在数据权属关系不清造成的部门之间以邻为壑、数据共享进展缓慢、数据安全隐患等问题。目前，针对数据的权属及法律关系问题，理论和实践中都没有通行的定义，数据没有在法律上被赋予资产的属性，所以数据所有权、使用权、管理权、交易权、享有权没有被相关的法律所充分认同和明确界定。结合国内外立法，对数据权属问题主要有三种截然不同的态度：


    第一种类型以欧盟为代表，英国、巴西、印度等国家也采用这种类型，其基于个人权利严格保护的立法态度，将受保护的客体限定在个人数据或个人信息。如英国《数据保护法》（Data
    Protection Act）主要目的是保护个人信息不被误用或滥用。《数据保护法》第 1 条就明确该法规制个人数据的处理，其中包括：基于数据主体同意或其他情形，合法、公平获取个人数据；经授权后可处理个人数据等信息，但需纠正不准确的个人数据。欧盟《通用数据保护条例》第
    1 条也表明该规定是针对自然人的个人数据处理以及个人数据流动，该规定保护自然人对其数据的基本权利与自由。从印度《2018 年个人数据保护法（草案）》第 2
    条、巴西《通用数据保护法》第 3 条可以看出，印度、巴西的数据保护立法均追随欧盟《通用数据保护条例》，采用统一立法模式。与《通用数据保护条例》旨在解决保护欧洲公民的基本权利与促进数据流通两个核心目标不同，印度《2018
    年个人数据保护法（草案）》提出了保护公民利益、贸易和工业利益、国家利益三重目的，希望实现以公民利益为重点，并与保护贸易和工业利益以及国家利益的完整达成微妙平衡的综合目的。巴西《通用数据保护法》则将立法目的明确为保护自由和隐私的基本权利以及自然人人格的自由发展。从强化数据主体基本权利的共同目标看，这一类型的数据保护法主要从提升个人数据主体控制力和加强数据控制者的义务责任两方面加以规定，在提升个人数据主体控制力方面，强化个人数据收集和处理的“知情同意原则”，完善细化数据主体的知情权、访问权等；在加强数据控制者的义务责任方面，将数据控制者内部的数据保护官制度升格为一般性机制，并对数据保护官的地位、职能等进行细致规定。


    第二种类型以中国、美国为代表，其对于数据权利保护保留观望的态度，从立法层面和司法实践来看，我国在数据权利保护层面主要以司法实践进行个案型场景式应对，寻求结合现有法律框架的亦步亦趋的处理方式，个人信息保护和企业数据财产权并重地稳步推进数据立法。美国在个人数据保护方面，仍然坚持公平信息实践原则，采取分散立法模式，也未设立统一的个人信息保护机构；采用行业自治为主，专门性立法为辅的保护模式。美国立法和政策制定者希望市场在个人数据保护方面发挥主要作用。


    第三种类型以澳大利亚为代表，其持较为开放宽松的数据权属保护态度。澳大利亚《数据使用规范（草案）》，成为规范收集、使用、管理和披露数据的行业标准。该规范以“不损害”用户权益为核心，要求机构组织采取措施确保数据无法二次定位到用户，并非以严格保护为出发点。2019
    年 8 月 1 日，澳大利亚参议院通过《用户数据权利法案》（Customer Data Right Bill）。法案的主要内容为数据用户有权利将自己的数据共享给其他数据平台。赋予用户数据权利是开放式银行业务（Open
    Banking）最重要的一个环节，故法案的通过给了金融科技公司很大的支持，同时也增加了金融科技公司与大银行之间的竞争。


    综上所述，各国针对公共数据的权利属性和治理关系有不同的规制模式，体现出对数据产业保护和数据安全性的不同权衡标准。安全责任承担者也根据权属分配的不同，在政府与企业之间平衡取舍。


    ##### 2．廓清法律规则结构


    数据保护法律规则是大数据安全的重要基础。以如下国家近期数据保护的主要法律为例（见表 6-1），各国制定相关法律法规的思路和策略有框架性的相似之处，但也有一些区别，体现在对管辖地区、保护数据的定义方式和监管主体组织构造等方面。


    **表 6-1　各国数据安全法律监管模式对比**


    ![](img/img10_p267_1.jpg)


    在具体规则层面，可以从数据监管者、数据主体、数据控制者三方关系出发，整理出如下规则：


    （1）数据监管者


    第一，监管的辖区范围。监管的辖区范围指法律法规规定的所能管辖的数据涉及的领土范围，尤其是设立在境外的数据中心是否受到本国法律法规的监管是目前业界关注的重点问题之一。不同国家和地区对此的规定有一定的差异性。如美国、澳大利亚、中国的管辖范围是本国领土，也就是说，外国企业以及本国企业设在境外的数据中心，可能会逃避本国法律法规约束。但欧盟、俄罗斯、新加坡等国家和地区则相对监管较严，如俄罗斯规定其数据保护法律法规不受领土管辖权的限制，适用于任何在俄罗斯发生的所有数据处理过程，包括对俄罗斯公民数据的收集和使用，而不论数据中心是否建立或位于俄罗斯境内。对于跨境的数据流，如果俄罗斯公民是对应的数据传输协定中的一方，那么该数据流就处于俄罗斯的数据保护法律法规监管辖区范围内。


    '
