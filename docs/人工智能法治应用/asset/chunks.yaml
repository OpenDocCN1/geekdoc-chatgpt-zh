    # 第四章 人工智能的执法应用


    **本章提要：**执法是彰显法治权威的重要一环。人工智能既是多种数字技术范式更迭的产物，也是驱动社会治理多重变革的算法工具。在新技术革命条件下，人工智能赋能传统执法迈向以数字化、网络化、智慧化为主要特征的执法应用新时代。但是，人工智能技术是把双刃剑。如何解决个人信息保护与大数据收集的冲突、协调数据安全与隐私保护的关系，是未来人工智能执法应用不容忽视的问题。


    ## 第一节 人工智能执法应用的理论基础


    ### 一、社会主义行政执法理论体系


    要对人工智能执法应用的概念进行界定，就必须首先了解何为“执法”。此处的“执法”特指行政执法，与广义上的“执法”属于属种关系。广义上的执法是指，国家机关依法实施法律的活动，其既包括国家行政机关的执法活动，也包括国家司法机关的司法活动。在特定情况下，国家权力机关和其他社会组织也依法享有执法权，如国家权力机关根据宪法和法律的规定依法组织选举活动，依法撤销与宪法、法律相抵触的法律、法规和决定等。再如某些企事业单位经法定授权或委托也可以依法实施某些行政管理职权。可见，执法并非等同于行政执法，也并非由行政机关一家行使，行政执法只是国家执法体系中的一种。^((1))人工智能执法应用中的“执法”概念在传统的法律框架中对应的是“行政执法”，作此限定意在基于法治应用各个环节的主要特点，使人工智能执法应用区别于人工智能司法应用等其他法治应用环节。


