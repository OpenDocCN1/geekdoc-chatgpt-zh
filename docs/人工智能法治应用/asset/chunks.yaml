    此外，加拿大政府开放数据时使用的开放政府许可（Open Government License Canada，OGL Canada），是一个免版税的、永久的、非排他性的许可协议。2014
    年 2 月起，澳大利亚政府针对数据门户上的数据开放采用的是国际通用知识共享许可协议 4.0 版（Creative Commons Licenses v4.0）。澳大利亚政府开放许可框架包括八个许可协议：六个知识共享许可协议、限制性许可证模板（RLT）以及
    BSD 3-Clause 软件许可。欧洲联盟许可协议（European Union Public License，EUPL）是欧洲第一个开源软件许可协议，其在欧盟委员会的倡议下创建，包含多种官方语言版本。


    ## 三、我国许可协议的现状和思考


    我国在政府数据开放方面缺乏完善的许可机制。一些数据开放平台已经发布许可协议类似的使用条款，例如上海市政府数据服务网的使用条款就列明了网站服务内容、授权声明、接受条款、用户义务、收费政策、隐私保护、免责声明，具备许可协议的一些要素。而大多数平台没有类似的许可框架，仅仅单独出具免责声明。因此需要制定一个完善的政府数据开放许可框架，明确数据产权，对第三方使用、再利用、二次发布数据进行规定与限制并对数据使用与利益协调进行规范。


    通过对上海市、北京市、深圳市、广州市、武汉市地方政府的数据开放平台进行调查发现，我国政府开放数据平台皆未采用国际上通用的许可协议，其对于用户使用政府数据的权限主要通过网站页面上的“使用条款”“服务条款”“法律声明”等进行描述。所有开放平台都明确规定，用户可以免费获取、使用网站上的数据（见表
    6-8）。


