  toc: []
- raw: '在专利法领域，对人工智能的功能性应用及人工智能技术在其他领域的运用和发明，因为其以技术方法、工艺流程、技术产品等为载体或者表现形态，尚不足以对现行法形成挑战和冲击；人工智能算法是人工智能最本质最抽象的应用，虽然强人工智能独立开发完成的发明创造尚未出现，但是，以算法作为重要特征的发明创造已经大量出现，其是否具有可专利性即其是否属于专利权的客体的问题因算法具有抽象性、智能性而颇具争议，争议的本质乃是人工智能算法是否属于《专利法》保护的对象。人工智能算法核心之一的代码成为《著作权法》的客体并无任何障碍，然而除了代码，人工智能的核心还包括各种数据，并且，《著作权法》保护的只是与其他代码有实质差异的代码，其并不保护代码的运行、运用方案。在人工智能发明可专利性的法律标准方面，本质为算法创新的人工智能发明因突破了《专利法》保护的排除范围而具有被授权的可能性。人工智能发明新颖性、创造性、实用性的审查标准均能够在既有专利制度框架内形成。此外，除对人工智能技术本身能否获得知识产权的保护的讨论之外，在数字时代如何对知识产权进行刑事保护也是学者的研究重点。有学者认为，在立法上，应完善我国知识产权犯罪的刑事立法，实现“同等行为同等保护”，适当提高知识产权犯罪的入罪标准，并在量刑时综合考虑行为的社会危害性，同时，应进一步完善网络服务提供者的刑事责任。在司法上，对于知识产权案件的审理，应在程序上推动刑民审判的融合。同时，应重视刑法解释在刑法适用中的作用，将新出现的行为样态合理解释到现行刑法表述的语义范畴中。在人工智能技术蓬勃发展之时，更应认识到知识产权保护是产权保护制度的重要内容，为实现保护知识产权的目标，要充分发挥法律的威慑作用。


    ##### （六）关注人工智能法治与治理的国际对话


    在加快人工智能研发的原则、政策、伦理标准、指导方针等制定的同时，积极开展国际交流，加强人工智能法治与治理的国际对话。2020年至2021年，人工智能法治与治理领域的国际学术交流与理论对话进一步加强。在中国，学术界普遍认为，应探讨人工智能风险的典型类型和发展趋势，从科技赋能治理的角度，研判人工智能时代的安全挑战，探索人工智能安全发展的创新之道，促进人工智能产业的健康发展，加快人工智能监管、隐私保护、算法问责、安全保障及法律责任等方面的前瞻研究，不断更新人工智能治理的“中国方案”，确保人工智能的发展造福人类未来。在西方，人工智能在产业变革、社会变革等方面的巨大潜力得到了更多国家的广泛认同。美国、日本、德国和韩国等国结合数字新基建、数据新要素、在线新经济等新背景，聚焦当前人工智能数据安全领域的重大风险和热点问题，构建了包括法律、标注规范、企业管理、安全能力供给等多维度综合性的人工智能数据安全治理框架，并针对人工智能通用规则和人脸识别、车联网、智能制造等具体行业场景，提出了一系列综合性安全解决方案。


    ### 二、人工智能法治应用与人工智能法治


    人工智能相关法治体系不断发展，尤其是人工智能的法理界定即相应的权利、义务、责任等基本范畴已经建立。在相关法治体系为人工智能提供坚实的法理支撑的同时，人工智能也促进了法治体系的健全。现有人工智能研究的覆盖领域越来越全面，不仅包括立法、司法、执法、守法等关键领域，还包括医疗卫生、城市建设、金融、交通等重点领域。特别是2020年以来，将人工智能与法治融合的需求变得更为迫切。人工智能研究要与人工智能法律规范体系的建立和发展相适应，要率先在医疗卫生、城市建设、交通、金融等重点领域形成科学有效的行业规范，制定相应的行政法规，并有规划地实行地区试点，同时保障人工智能在立法、司法、执法、守法等关键领域的同步实施，在人工智能领域建立好、完善好相关科学的、可操作的法律体系，让人工智能的发展有章可循、有法可依。


    ##### （一）制定并完善人工智能发展的政策规划


    据有关机构预测，到2024年，人工智能市场预计将突破5000亿美元大关，五年复合年增长率（CAGR）为17.5%，总收入将达到5543亿美元。中美两国占据人工智能领域的绝对竞争优势地位。其中，2020年美国人工智能企业有2257家，占全球总数的38.3%；中国以1454家人工智能企业位居第二，占24.66%。2020年中美两国人工智能企业数量占全球半数以上。在全球范围内，中美双雄并立，构成人工智能第一梯队，日本、英国、以色列和法国等国家构成第二梯队。2020年，俄罗斯人工智能产业迎来发展热潮，但对人工智能产业整体格局并未产生决定性影响。[^((1))](#postscript1.xhtml#jz_01_1010)世界各主要国家和地区正相继出台更具针对性的政策举措，完善和落实人工智能战略规划，持续加大人工智能领域的研发投入与扩大人工智能的应用范围。在我国，受新冠肺炎疫情的影响，各地立法机关增强了对于信息技术的应用，立法意见征询、立法辅助、立法草案以及立法工作信息化等方面的终端应用和基础数据库开发均有进步。2021年2月24日，国家法律法规数据库开通上线，免费向社会公众提供法律检索查询服务；北大法宝智能立法支持平台持续扩容，针对立法的不同环节研发相应的辅助平台，尤其是在线起草文件系统。科大讯飞开发了备案审查与行政复议全流程智能化系统，通过调用人工智能引擎的图文识别和要素抽取能力，建构模型库，实现其与相关规范的关联与适用。2021年3月13日，十三届全国人大第四次会议通过的《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》提出：在突破核心技术、打造数字经济新优势、营造良好数字生态三个方面布局人工智能发展。推动人工智能基础设施建设、研究和教育发展，通过政策试点，积累经验全面推广。发布人工智能标准体系建设指南和伦理指引规范，并陆续制定具体标准。


    至2020年年底，美国、欧盟的大部分成员国、英国、俄罗斯、日本、韩国等国家，都已陆续发布国家人工智能战略。2020年6月至2021年3月，以上国家都制订了落实计划，推进国家人工智能战略的实施。如2020年8月，美国白宫科技政策办公室公布人工智能发展年度计划（2020—2021），计划增加财政预算15亿美元，专门用于激励人工智能领域的应用研发和理论探索。2021年1月，美国设立专门的国家人工智能倡议办公室，其作为美国整个创新生态系统的国家研究和政策的中心机构，负责协调政府、行业和学术界人工智能研究和政策的制定及实施。互联网信息化技术与线上会议也为民众的参与创造契机，美国众议院引入人工智能工具，通过自动化分析辅助立法草案的准备，在新冠肺炎疫情蔓延的背景下，虚拟会议、混合会议有效保证立法机关发挥职责；2021年4月，欧盟更新了《人工智能协调计划》，重点针对新冠肺炎疫情带来的挑战，提出加快相关人工智能技术研发应用等举措。


    ##### （二）聚焦人工智能高速发展领域的立法


    在人工智能领域，自动驾驶、智能医疗、人脸识别等诸多产业都在高速发展，这些领域的立法均值得关注。在立法中应注重法律的规范、引导和保障作用。以自动驾驶为例，相关法律法规在加速制定中，以适应智能驾驶技术快速发展与普及的需要。2021年2月，中共中央、国务院发布《国家综合立体交通网规划纲要》，提出到2035年，要基本建成便捷顺畅、经济高效、绿色集约、智能先进、安全可靠的现代化高质量国家综合立体交通网。加强智能化载运工具和关键专用装备研发，推进智能网联汽车（智能汽车、自动驾驶、车路协同）、智能化通用航空器应用。2021年4月，公安部公开《道路交通安全法（修订建议稿）》，对智能网联汽车及自动驾驶提出规范意见，为未来自动驾驶的应用提供了法律基础。2021年10月，国家互联网信息办公室等五部门联合发布的《汽车数据安全管理若干规定（试行）》正式施行，对智能网联汽车的数据处理和数据安全作出具体规定。在国外，美国交通部（USDOT）于2021年1月发布《自动驾驶汽车综合计划》，确定实现自动驾驶系统（ADS）愿景的三个目标。2021年2月，欧盟网络安全局（ENISA）发布《在自动驾驶中采用人工智能的安全挑战》报告，就自动驾驶汽车中采用人工智能技术的网络安全挑战提出了解决建议。同年3月，欧盟数据保护委员会（EDPB）发布《车联网个人数据保护指南》，明确智联车辆出行处理个人数据的准则，解决高度敏感数据的使用、透明度和用户控制等问题。


    除自动驾驶领域的立法之外，当前，智慧医疗、人脸识别、数据治理、算法规制等领域的立法也在如火如荼地进行之中。例如，在智能医疗领域，我国在人工智能医疗领域的应用发展一直位于世界前列。我国智能医疗企业占人工智能企业总数的22%，医疗人工智能成为人工智能发展的重点。智能医疗涵盖智慧医院管理、人工智能诊疗、人工智能慢性病管理、人工智能药品开发和医药智能监管以及流行病智能监测和防控等。近十多年来，中国密集分布有关人工智能的医疗政策，其关注度世界领先。[^((2))](#postscript1.xhtml#jz_01_1011)从法律行为的角度来看，人工智能医疗领域涉及的法律问题主要处在医疗数据利用、智能医疗器械使用、智能医疗药物研发、智能医疗诊断、智能医疗机构运营等领域，我们对这些领域中的行为性质认定、当事人之间的权利和义务、医疗责任分配等法律问题均需要作出立法回应。再如，运用人工智能的关键是算法，算法能够为立法提供技术支持，进而影响立法体系和立法内容。而算法在立法语言规范与立法评估中的作用问题、算法参与立法活动的成本质效问题、算法对于法律体系协调统一问题，均须人工智能技术的应用推动相关立法作出回应。


    ##### （三）依法加强个人信息保护并防范人工智能技术被滥用


    加强个人信息数据安全保护的法律和政策正在相继出台，旨在防范人工智能滥用带来的法律风险。2020年5月28日十三届全国人大第三次会议通过《民法典》，首次明确要将个人信息作为受法律保护的民事权益，并在现行法律的基础上，规范个人信息处理的基本规则。2021年6月10日《数据安全法》通过，2021年8月20日《个人信息保护法》通过，进一步细化个人信息处理规则和数据分级保护制度。为了防止人脸识别技术的滥用，《个人信息保护法》明确将生物识别信息纳入受保护的个人信息的范围，并规定了处理个人图像、个人身份特征信息的特别规则。2020年7月，美国国防部发布《国防部人工智能数据与技术管理保护审计报告》，建议国防部加强对人工智能项目的管理，加强数据安全保障，改善数据共享与开发流程。2021年4月，欧盟发布《人工智能的法律框架草案》，将人工智能细分为不可接受、高风险、有限风险和最小风险四类并分类规制。


    ##### （四）人工智能司法应用趋于专业化


    区块链等技术辅助类专门化应用的研发成为全球人工智能司法应用的发展趋势。在中国，人民法院信息化3.0版基本建成，多个利用深度学习算法、区块链和大数据智能分析技术，能够实现证据比对、事实认定等突破性功能的智审平台建立完成；在全国检察机关统一业务应用系统2.0等逐步应用的基础上，检察机关在公益诉讼案件中对人工智能司法应用取得较大发展。各级人民法院、检察院开始真正利用司法大数据和算法来推动人工智能司法应用的发展。人工智能司法应用跨区域协作逐步展开。在国外，受新冠肺炎疫情影响，线上审判的“云开庭”模式已成为全球人工智能司法应用发展最突出的形式。2020年12月，欧洲司法效率委员会（CEPEJ）在全体会议上通过了网络司法与人工智能工作组下一阶段的工作路线图，将未来的工作聚焦于在线争议解决（ODR）应用、区块链在司法领域的使用等领域；美国同样关注区块链的司法应用，并开始在电子记录的保存更新、证据运用等方面尝试应用区块链技术。


    ##### （五）人工智能执法应用向精细化模式发展


    人工智能执法应用技术发展以业务实践和法律需求为导向，从平面化向纵深化发展，应用平台建设从数据融合共享向跨区域深度合作方向转变。在我国，人工智能在交通执法场域的应用已实现了路网可计算、人车可测量的精细化发展模式，人工智能可通过自主学习分配路权；人工智能在情报研判场域的应用则已实现高质量数据清洗、高效率数据分析的导向式研判。与此同时，跨区域的数据共享与合作进一步加深，全国有31个省级行政区已建成并在逐步升级其一网通办平台；全国各地公安大数据技术应用创新中心的建设使公安机关内部警务数据平台跨层级、跨业务、跨警种的趋势更加明显。在国外，人工智能执法应用向精确化、精细化进一步发展，如：美国研发的优先级视频审核功能，可通过警用摄像机和算法技术捕捉警务人员的不当行为；日本研发的运用人工智能技术的系统，可以预测出长期潜逃的通缉犯现在的模样。


    ##### （六）人工智能法律服务应用更加广泛多元


    人工智能法律服务应用功能由个别趋向多元，应用形式由单一化趋向平台化，应用受众由专业群体向大众群体发展。在我国，人工智能各项技术在法律服务领域的应用呈现出更为综合的趋势，各项单一功能通过不断组合，为使用者提供多元化、定制化的服务。如“法信”平台将自然语言识别与深度学习相结合，不仅其自身能够快速识别文档内容并整理相关法律文件，同时还能为使用平台功能的用户提供智能化的检索服务并根据用户的模糊检索条件自动推荐相关内容。在国外，法律服务领域涌现出越来越多的平台化服务提供商，平台将技术、资源与业务整合起来，既能极大提升自身的服务水平，也能为用户提供全流程、高质量的法律服务。如美国的法律服务网站DoNotPay最初仅提供帮助人们处理停车罚单的自动咨询服务，而如今其已经涵盖反骚扰、霸王条款识别等多项功能，能满足100多种服务需求，成为人工智能法律服务的大型平台。


    ### 三、人工智能法治应用与人工智能伦理


    约翰·罗尔斯指出：“法律与道德这一主题引起人们注意许多不同的问题。其中有：道德观念影响法律制度和受法律制度影响的途径和方式；道德概念和原则是否应进入一个适当的法律定义中；法律道德强制；批评法律制度的道德理性原则和我们默许法律制度的道德基础。”显然，罗尔斯提出的四个不同问题实际上涉及法律和道德的价值和规范等层面的相互关系。法律和伦理是相互联系、相互影响的两种规范。法律和伦理之间不仅具有关联性，而且具有互动性。一方面，了解法律与伦理的相互关系，对于法律规范和伦理规范的整理、更新、调适和完善有着积极意义。另一方面，法律与伦理是两种不同的规范，尽管它们之间存在着密切的联系，但是它们在规范价值层次、规范调整范围、规范方式和强制程度等方面存在很大的差异。这些差别表明，法律与伦理有不同的规范空间和规范层次，法律是法律，伦理是伦理，法律规范不能代替伦理规范，伦理规范也不能代替法律规范。它们发挥着不同的规范作用。[^((3))](#postscript1.xhtml#jz_01_1012)


    当前，新一代人工智能技术应用不断加速，其在有力促进经济社会发展的同时，也逐步引发了主体责任不清、算法歧视、侵犯隐私等触及传统伦理价值的问题，伦理风险已经成为人工智能技术研发和应用的一个焦点议题。当前我们的人工智能还没发展到使机器拥有人一样的自主意识与行为能力，但随着人工智能从工具化向人性化逐渐过渡，传统法律主体的地位势必受到冲击。即便现有的法律体系并不能够支持人工智能享有和人一样的法律主体资格，但在理论界，法律主体的范围呈现逐渐扩宽的趋势。将机器人视作法律客体并无障碍，但考虑到人工智能体在未来的发展以及我国实际的情况，是否有必要将人工智能置于“主体”地位？如果我们为人工智能创设法律主体地位，能否为解决某些人工智能侵权问题的责任承担问题提供思路？人工智能又能享受何种程度的权利、承担何种程度的责任？这些都是人工智能伦理和人工智能法学亟待解决的问题。


    ##### （一）人工智能运用的法律主体地位问题


    人工智能法律主体地位问题是关于人工智能是否可以作为法律主体，主体地位如何以及承担何种责任的问题。我国刑法及民法学界已经对人工智能的主体地位问题展开了广泛探讨。围绕人工智能的刑事主体地位及其刑事责任承担，刑法学界对人工智能的刑事主体地位问题持比较慎重的立场，因为刑事主体地位不仅涉及对犯罪主体的责任追究，还与被害人的权利救济有直接关联。民法学界对人工智能民事主体地位所持的立场整体而言也偏于慎重。[^((4))](#postscript1.xhtml#jz_01_1013)近几年来引发讨论的人工智能法律主体资格问题主要是人工智能生成物是否受《著作权法》保护。北京互联网法院在计算机系统自动生成物一案判决中首次指出：软件用户仅提交了搜索关键词，其应用“可视化”功能自动生成的分析报告亦非对软件用户思想、感情的独创性表达，故该分析报告亦不宜认定为使用者的创作成果。此外，人工智能是否可以在特定场景中被认定为法律所规定的人？一家香港公司制造的机器人索菲亚被沙特阿拉伯授予公民身份，这引起了对人工智能法律人格问题的热烈讨论。[^((5))](#postscript1.xhtml#jz_01_1014)


    ##### （二）应用人工智能的刑事责任问题


    人工智能刑事责任不仅关乎人工智能本身还及于使用人工智能技术或设备的人。人工智能被赋予公民身份这一事件向刑法学界提出了挑战，人工智能能否成为刑事责任主体变成了一个值得讨论的话题，并且真正对当下刑法提出挑战的是人工智能与生物工程结合后的产物——被改造的人类自身。同时，放眼未来，从刑法发展论和立法论的角度出发，应增设“滥用人工智能罪”并确立研发者或使用者的严格责任以及确立智能机器人刑事责任主体地位；有学者指出，对人工智能的犯罪行为当中实行和参与观念的更新需要接受预防性犯罪化理念的指导。应对商业流程环节和行政把关环节进行预备行为实行化和共犯行为正犯化的考量，然后对客观归责和正当事由进行理论的预防性更新，因为现有的刑法教义学产生于前人工智能时代的社会实践。[^((6))](#postscript1.xhtml#jz_01_1015)但是，除智能机器人刑事责任主体地位问题和“滥用人工智能罪”的罪责问题外，目前学界从这种将来视角出发所进行的关于刑法发展论和立法论的理论研讨总体上比较简单、空泛，其仅仅是一些碎片化的立法思考，完全不能适应人工智能时代算法安全犯罪观和规范刑法学发展的需要。[^((7))](#postscript1.xhtml#jz_01_1016)我国《新一代人工智能发展规划》要求“推广应用人工智能治疗新模式新手段，建立快速精准的智能医疗体系”。在大力发展人工智能的同时，必须高度重视人工智能可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度地降低风险，确保人工智能安全、可靠、可控发展，加快研究制定相关安全管理法规，为新技术的快速应用奠定法律基础。刑法在保护法益的同时，也要保障医疗人工智能以及其他领域人工智能的快速应用、安全健康发展。[^((8))](#postscript1.xhtml#jz_01_1017)


    ##### （三）人工智能运用的隐私权保护问题'
  fmt: '

    在专利法领域，对人工智能的功能性应用及人工智能技术在其他领域的运用和发明，因为其以技术方法、工艺流程、技术产品等为载体或者表现形态，尚不足以对现行法形成挑战和冲击；人工智能算法是人工智能最本质最抽象的应用，虽然强人工智能独立开发完成的发明创造尚未出现，但是，以算法作为重要特征的发明创造已经大量出现，其是否具有可专利性即其是否属于专利权的客体的问题因算法具有抽象性、智能性而颇具争议，争议的本质乃是人工智能算法是否属于《专利法》保护的对象。人工智能算法核心之一的代码成为《著作权法》的客体并无任何障碍，然而除了代码，人工智能的核心还包括各种数据，并且，《著作权法》保护的只是与其他代码有实质差异的代码，其并不保护代码的运行、运用方案。在人工智能发明可专利性的法律标准方面，本质为算法创新的人工智能发明因突破了《专利法》保护的排除范围而具有被授权的可能性。人工智能发明新颖性、创造性、实用性的审查标准均能够在既有专利制度框架内形成。此外，除对人工智能技术本身能否获得知识产权的保护的讨论之外，在数字时代如何对知识产权进行刑事保护也是学者的研究重点。有学者认为，在立法上，应完善我国知识产权犯罪的刑事立法，实现“同等行为同等保护”，适当提高知识产权犯罪的入罪标准，并在量刑时综合考虑行为的社会危害性，同时，应进一步完善网络服务提供者的刑事责任。在司法上，对于知识产权案件的审理，应在程序上推动刑民审判的融合。同时，应重视刑法解释在刑法适用中的作用，将新出现的行为样态合理解释到现行刑法表述的语义范畴中。在人工智能技术蓬勃发展之时，更应认识到知识产权保护是产权保护制度的重要内容，为实现保护知识产权的目标，要充分发挥法律的威慑作用。


    ### （六）关注人工智能法治与治理的国际对话

    在加快人工智能研发的原则、政策、伦理标准、指导方针等制定的同时，积极开展国际交流，加强人工智能法治与治理的国际对话。2020年至2021年，人工智能法治与治理领域的国际学术交流与理论对话进一步加强。在中国，学术界普遍认为，应探讨人工智能风险的典型类型和发展趋势，从科技赋能治理的角度，研判人工智能时代的安全挑战，探索人工智能安全发展的创新之道，促进人工智能产业的健康发展，加快人工智能监管、隐私保护、算法问责、安全保障及法律责任等方面的前瞻研究，不断更新人工智能治理的“中国方案”，确保人工智能的发展造福人类未来。在西方，人工智能在产业变革、社会变革等方面的巨大潜力得到了更多国家的广泛认同。美国、日本、德国和韩国等国结合数字新基建、数据新要素、在线新经济等新背景，聚焦当前人工智能数据安全领域的重大风险和热点问题，构建了包括法律、标注规范、企业管理、安全能力供给等多维度综合性的人工智能数据安全治理框架，并针对人工智能通用规则和人脸识别、车联网、智能制造等具体行业场景，提出了一系列综合性安全解决方案。


    ## 二、人工智能法治应用与人工智能法治

    人工智能相关法治体系不断发展，尤其是人工智能的法理界定即相应的权利、义务、责任等基本范畴已经建立。在相关法治体系为人工智能提供坚实的法理支撑的同时，人工智能也促进了法治体系的健全。现有人工智能研究的覆盖领域越来越全面，不仅包括立法、司法、执法、守法等关键领域，还包括医疗卫生、城市建设、金融、交通等重点领域。特别是2020年以来，将人工智能与法治融合的需求变得更为迫切。人工智能研究要与人工智能法律规范体系的建立和发展相适应，要率先在医疗卫生、城市建设、交通、金融等重点领域形成科学有效的行业规范，制定相应的行政法规，并有规划地实行地区试点，同时保障人工智能在立法、司法、执法、守法等关键领域的同步实施，在人工智能领域建立好、完善好相关科学的、可操作的法律体系，让人工智能的发展有章可循、有法可依。


    ### （一）制定并完善人工智能发展的政策规划

    据有关机构预测，到2024年，人工智能市场预计将突破5000亿美元大关，五年复合年增长率（CAGR）为17.5%，总收入将达到5543亿美元。中美两国占据人工智能领域的绝对竞争优势地位。其中，2020年美国人工智能企业有2257家，占全球总数的38.3%；中国以1454家人工智能企业位居第二，占24.66%。2020年中美两国人工智能企业数量占全球半数以上。在全球范围内，中美双雄并立，构成人工智能第一梯队，日本、英国、以色列和法国等国家构成第二梯队。2020年，俄罗斯人工智能产业迎来发展热潮，但对人工智能产业整体格局并未产生决定性影响。[^((1))](#postscript1.xhtml#jz_01_1010)世界各主要国家和地区正相继出台更具针对性的政策举措，完善和落实人工智能战略规划，持续加大人工智能领域的研发投入与扩大人工智能的应用范围。在我国，受新冠肺炎疫情的影响，各地立法机关增强了对于信息技术的应用，立法意见征询、立法辅助、立法草案以及立法工作信息化等方面的终端应用和基础数据库开发均有进步。2021年2月24日，国家法律法规数据库开通上线，免费向社会公众提供法律检索查询服务；北大法宝智能立法支持平台持续扩容，针对立法的不同环节研发相应的辅助平台，尤其是在线起草文件系统。科大讯飞开发了备案审查与行政复议全流程智能化系统，通过调用人工智能引擎的图文识别和要素抽取能力，建构模型库，实现其与相关规范的关联与适用。2021年3月13日，十三届全国人大第四次会议通过的《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》提出：在突破核心技术、打造数字经济新优势、营造良好数字生态三个方面布局人工智能发展。推动人工智能基础设施建设、研究和教育发展，通过政策试点，积累经验全面推广。发布人工智能标准体系建设指南和伦理指引规范，并陆续制定具体标准。


    至2020年年底，美国、欧盟的大部分成员国、英国、俄罗斯、日本、韩国等国家，都已陆续发布国家人工智能战略。2020年6月至2021年3月，以上国家都制订了落实计划，推进国家人工智能战略的实施。如2020年8月，美国白宫科技政策办公室公布人工智能发展年度计划（2020—2021），计划增加财政预算15亿美元，专门用于激励人工智能领域的应用研发和理论探索。2021年1月，美国设立专门的国家人工智能倡议办公室，其作为美国整个创新生态系统的国家研究和政策的中心机构，负责协调政府、行业和学术界人工智能研究和政策的制定及实施。互联网信息化技术与线上会议也为民众的参与创造契机，美国众议院引入人工智能工具，通过自动化分析辅助立法草案的准备，在新冠肺炎疫情蔓延的背景下，虚拟会议、混合会议有效保证立法机关发挥职责；2021年4月，欧盟更新了《人工智能协调计划》，重点针对新冠肺炎疫情带来的挑战，提出加快相关人工智能技术研发应用等举措。


    ### （二）聚焦人工智能高速发展领域的立法

    在人工智能领域，自动驾驶、智能医疗、人脸识别等诸多产业都在高速发展，这些领域的立法均值得关注。在立法中应注重法律的规范、引导和保障作用。以自动驾驶为例，相关法律法规在加速制定中，以适应智能驾驶技术快速发展与普及的需要。2021年2月，中共中央、国务院发布《国家综合立体交通网规划纲要》，提出到2035年，要基本建成便捷顺畅、经济高效、绿色集约、智能先进、安全可靠的现代化高质量国家综合立体交通网。加强智能化载运工具和关键专用装备研发，推进智能网联汽车（智能汽车、自动驾驶、车路协同）、智能化通用航空器应用。2021年4月，公安部公开《道路交通安全法（修订建议稿）》，对智能网联汽车及自动驾驶提出规范意见，为未来自动驾驶的应用提供了法律基础。2021年10月，国家互联网信息办公室等五部门联合发布的《汽车数据安全管理若干规定（试行）》正式施行，对智能网联汽车的数据处理和数据安全作出具体规定。在国外，美国交通部（USDOT）于2021年1月发布《自动驾驶汽车综合计划》，确定实现自动驾驶系统（ADS）愿景的三个目标。2021年2月，欧盟网络安全局（ENISA）发布《在自动驾驶中采用人工智能的安全挑战》报告，就自动驾驶汽车中采用人工智能技术的网络安全挑战提出了解决建议。同年3月，欧盟数据保护委员会（EDPB）发布《车联网个人数据保护指南》，明确智联车辆出行处理个人数据的准则，解决高度敏感数据的使用、透明度和用户控制等问题。


    除自动驾驶领域的立法之外，当前，智慧医疗、人脸识别、数据治理、算法规制等领域的立法也在如火如荼地进行之中。例如，在智能医疗领域，我国在人工智能医疗领域的应用发展一直位于世界前列。我国智能医疗企业占人工智能企业总数的22%，医疗人工智能成为人工智能发展的重点。智能医疗涵盖智慧医院管理、人工智能诊疗、人工智能慢性病管理、人工智能药品开发和医药智能监管以及流行病智能监测和防控等。近十多年来，中国密集分布有关人工智能的医疗政策，其关注度世界领先。[^((2))](#postscript1.xhtml#jz_01_1011)从法律行为的角度来看，人工智能医疗领域涉及的法律问题主要处在医疗数据利用、智能医疗器械使用、智能医疗药物研发、智能医疗诊断、智能医疗机构运营等领域，我们对这些领域中的行为性质认定、当事人之间的权利和义务、医疗责任分配等法律问题均需要作出立法回应。再如，运用人工智能的关键是算法，算法能够为立法提供技术支持，进而影响立法体系和立法内容。而算法在立法语言规范与立法评估中的作用问题、算法参与立法活动的成本质效问题、算法对于法律体系协调统一问题，均须人工智能技术的应用推动相关立法作出回应。


    ### （三）依法加强个人信息保护并防范人工智能技术被滥用

    加强个人信息数据安全保护的法律和政策正在相继出台，旨在防范人工智能滥用带来的法律风险。2020年5月28日十三届全国人大第三次会议通过《民法典》，首次明确要将个人信息作为受法律保护的民事权益，并在现行法律的基础上，规范个人信息处理的基本规则。2021年6月10日《数据安全法》通过，2021年8月20日《个人信息保护法》通过，进一步细化个人信息处理规则和数据分级保护制度。为了防止人脸识别技术的滥用，《个人信息保护法》明确将生物识别信息纳入受保护的个人信息的范围，并规定了处理个人图像、个人身份特征信息的特别规则。2020年7月，美国国防部发布《国防部人工智能数据与技术管理保护审计报告》，建议国防部加强对人工智能项目的管理，加强数据安全保障，改善数据共享与开发流程。2021年4月，欧盟发布《人工智能的法律框架草案》，将人工智能细分为不可接受、高风险、有限风险和最小风险四类并分类规制。


    ### （四）人工智能司法应用趋于专业化

    区块链等技术辅助类专门化应用的研发成为全球人工智能司法应用的发展趋势。在中国，人民法院信息化3.0版基本建成，多个利用深度学习算法、区块链和大数据智能分析技术，能够实现证据比对、事实认定等突破性功能的智审平台建立完成；在全国检察机关统一业务应用系统2.0等逐步应用的基础上，检察机关在公益诉讼案件中对人工智能司法应用取得较大发展。各级人民法院、检察院开始真正利用司法大数据和算法来推动人工智能司法应用的发展。人工智能司法应用跨区域协作逐步展开。在国外，受新冠肺炎疫情影响，线上审判的“云开庭”模式已成为全球人工智能司法应用发展最突出的形式。2020年12月，欧洲司法效率委员会（CEPEJ）在全体会议上通过了网络司法与人工智能工作组下一阶段的工作路线图，将未来的工作聚焦于在线争议解决（ODR）应用、区块链在司法领域的使用等领域；美国同样关注区块链的司法应用，并开始在电子记录的保存更新、证据运用等方面尝试应用区块链技术。


    ### （五）人工智能执法应用向精细化模式发展

    人工智能执法应用技术发展以业务实践和法律需求为导向，从平面化向纵深化发展，应用平台建设从数据融合共享向跨区域深度合作方向转变。在我国，人工智能在交通执法场域的应用已实现了路网可计算、人车可测量的精细化发展模式，人工智能可通过自主学习分配路权；人工智能在情报研判场域的应用则已实现高质量数据清洗、高效率数据分析的导向式研判。与此同时，跨区域的数据共享与合作进一步加深，全国有31个省级行政区已建成并在逐步升级其一网通办平台；全国各地公安大数据技术应用创新中心的建设使公安机关内部警务数据平台跨层级、跨业务、跨警种的趋势更加明显。在国外，人工智能执法应用向精确化、精细化进一步发展，如：美国研发的优先级视频审核功能，可通过警用摄像机和算法技术捕捉警务人员的不当行为；日本研发的运用人工智能技术的系统，可以预测出长期潜逃的通缉犯现在的模样。


    ### （六）人工智能法律服务应用更加广泛多元

    人工智能法律服务应用功能由个别趋向多元，应用形式由单一化趋向平台化，应用受众由专业群体向大众群体发展。在我国，人工智能各项技术在法律服务领域的应用呈现出更为综合的趋势，各项单一功能通过不断组合，为使用者提供多元化、定制化的服务。如“法信”平台将自然语言识别与深度学习相结合，不仅其自身能够快速识别文档内容并整理相关法律文件，同时还能为使用平台功能的用户提供智能化的检索服务并根据用户的模糊检索条件自动推荐相关内容。在国外，法律服务领域涌现出越来越多的平台化服务提供商，平台将技术、资源与业务整合起来，既能极大提升自身的服务水平，也能为用户提供全流程、高质量的法律服务。如美国的法律服务网站DoNotPay最初仅提供帮助人们处理停车罚单的自动咨询服务，而如今其已经涵盖反骚扰、霸王条款识别等多项功能，能满足100多种服务需求，成为人工智能法律服务的大型平台。


    ## 三、人工智能法治应用与人工智能伦理

    约翰·罗尔斯指出：“法律与道德这一主题引起人们注意许多不同的问题。其中有：道德观念影响法律制度和受法律制度影响的途径和方式；道德概念和原则是否应进入一个适当的法律定义中；法律道德强制；批评法律制度的道德理性原则和我们默许法律制度的道德基础。”显然，罗尔斯提出的四个不同问题实际上涉及法律和道德的价值和规范等层面的相互关系。法律和伦理是相互联系、相互影响的两种规范。法律和伦理之间不仅具有关联性，而且具有互动性。一方面，了解法律与伦理的相互关系，对于法律规范和伦理规范的整理、更新、调适和完善有着积极意义。另一方面，法律与伦理是两种不同的规范，尽管它们之间存在着密切的联系，但是它们在规范价值层次、规范调整范围、规范方式和强制程度等方面存在很大的差异。这些差别表明，法律与伦理有不同的规范空间和规范层次，法律是法律，伦理是伦理，法律规范不能代替伦理规范，伦理规范也不能代替法律规范。它们发挥着不同的规范作用。[^((3))](#postscript1.xhtml#jz_01_1012)


    当前，新一代人工智能技术应用不断加速，其在有力促进经济社会发展的同时，也逐步引发了主体责任不清、算法歧视、侵犯隐私等触及传统伦理价值的问题，伦理风险已经成为人工智能技术研发和应用的一个焦点议题。当前我们的人工智能还没发展到使机器拥有人一样的自主意识与行为能力，但随着人工智能从工具化向人性化逐渐过渡，传统法律主体的地位势必受到冲击。即便现有的法律体系并不能够支持人工智能享有和人一样的法律主体资格，但在理论界，法律主体的范围呈现逐渐扩宽的趋势。将机器人视作法律客体并无障碍，但考虑到人工智能体在未来的发展以及我国实际的情况，是否有必要将人工智能置于“主体”地位？如果我们为人工智能创设法律主体地位，能否为解决某些人工智能侵权问题的责任承担问题提供思路？人工智能又能享受何种程度的权利、承担何种程度的责任？这些都是人工智能伦理和人工智能法学亟待解决的问题。


    ### （一）人工智能运用的法律主体地位问题

    人工智能法律主体地位问题是关于人工智能是否可以作为法律主体，主体地位如何以及承担何种责任的问题。我国刑法及民法学界已经对人工智能的主体地位问题展开了广泛探讨。围绕人工智能的刑事主体地位及其刑事责任承担，刑法学界对人工智能的刑事主体地位问题持比较慎重的立场，因为刑事主体地位不仅涉及对犯罪主体的责任追究，还与被害人的权利救济有直接关联。民法学界对人工智能民事主体地位所持的立场整体而言也偏于慎重。[^((4))](#postscript1.xhtml#jz_01_1013)近几年来引发讨论的人工智能法律主体资格问题主要是人工智能生成物是否受《著作权法》保护。北京互联网法院在计算机系统自动生成物一案判决中首次指出：软件用户仅提交了搜索关键词，其应用“可视化”功能自动生成的分析报告亦非对软件用户思想、感情的独创性表达，故该分析报告亦不宜认定为使用者的创作成果。此外，人工智能是否可以在特定场景中被认定为法律所规定的人？一家香港公司制造的机器人索菲亚被沙特阿拉伯授予公民身份，这引起了对人工智能法律人格问题的热烈讨论。[^((5))](#postscript1.xhtml#jz_01_1014)


    ### （二）应用人工智能的刑事责任问题

    人工智能刑事责任不仅关乎人工智能本身还及于使用人工智能技术或设备的人。人工智能被赋予公民身份这一事件向刑法学界提出了挑战，人工智能能否成为刑事责任主体变成了一个值得讨论的话题，并且真正对当下刑法提出挑战的是人工智能与生物工程结合后的产物——被改造的人类自身。同时，放眼未来，从刑法发展论和立法论的角度出发，应增设“滥用人工智能罪”并确立研发者或使用者的严格责任以及确立智能机器人刑事责任主体地位；有学者指出，对人工智能的犯罪行为当中实行和参与观念的更新需要接受预防性犯罪化理念的指导。应对商业流程环节和行政把关环节进行预备行为实行化和共犯行为正犯化的考量，然后对客观归责和正当事由进行理论的预防性更新，因为现有的刑法教义学产生于前人工智能时代的社会实践。[^((6))](#postscript1.xhtml#jz_01_1015)但是，除智能机器人刑事责任主体地位问题和“滥用人工智能罪”的罪责问题外，目前学界从这种将来视角出发所进行的关于刑法发展论和立法论的理论研讨总体上比较简单、空泛，其仅仅是一些碎片化的立法思考，完全不能适应人工智能时代算法安全犯罪观和规范刑法学发展的需要。[^((7))](#postscript1.xhtml#jz_01_1016)我国《新一代人工智能发展规划》要求“推广应用人工智能治疗新模式新手段，建立快速精准的智能医疗体系”。在大力发展人工智能的同时，必须高度重视人工智能可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度地降低风险，确保人工智能安全、可靠、可控发展，加快研究制定相关安全管理法规，为新技术的快速应用奠定法律基础。刑法在保护法益的同时，也要保障医疗人工智能以及其他领域人工智能的快速应用、安全健康发展。[^((8))](#postscript1.xhtml#jz_01_1017)


    ### （三）人工智能运用的隐私权保护问题

    '
  trans: '


    在专利法领域，对人工智能的功能性应用及人工智能技术在其他领域的运用和发明，因为其以技术方法、工艺流程、技术产品等为载体或者表现形态，尚不足以对现行法形成挑战和冲击；人工智能算法是人工智能最本质最抽象的应用，虽然强人工智能独立开发完成的发明创造尚未出现，但是，以算法作为重要特征的发明创造已经大量出现，其是否具有可专利性即其是否属于专利权的客体的问题因算法具有抽象性、智能性而颇具争议，争议的本质乃是人工智能算法是否属于《专利法》保护的对象。人工智能算法核心之一的代码成为《著作权法》的客体并无任何障碍，然而除了代码，人工智能的核心还包括各种数据，并且，《著作权法》保护的只是与其他代码有实质差异的代码，其并不保护代码的运行、运用方案。在人工智能发明可专利性的法律标准方面，本质为算法创新的人工智能发明因突破了《专利法》保护的排除范围而具有被授权的可能性。人工智能发明新颖性、创造性、实用性的审查标准均能够在既有专利制度框架内形成。此外，除对人工智能技术本身能否获得知识产权的保护的讨论之外，在数字时代如何对知识产权进行刑事保护也是学者的研究重点。有学者认为，在立法上，应完善我国知识产权犯罪的刑事立法，实现“同等行为同等保护”，适当提高知识产权犯罪的入罪标准，并在量刑时综合考虑行为的社会危害性，同时，应进一步完善网络服务提供者的刑事责任。在司法上，对于知识产权案件的审理，应在程序上推动刑民审判的融合。同时，应重视刑法解释在刑法适用中的作用，将新出现的行为样态合理解释到现行刑法表述的语义范畴中。在人工智能技术蓬勃发展之时，更应认识到知识产权保护是产权保护制度的重要内容，为实现保护知识产权的目标，要充分发挥法律的威慑作用。


    ### （六）关注人工智能法治与治理的国际对话

    在加快人工智能研发的原则、政策、伦理标准、指导方针等制定的同时，积极开展国际交流，加强人工智能法治与治理的国际对话。2020 年至 2021 年，人工智能法治与治理领域的国际学术交流与理论对话进一步加强。在中国，学术界普遍认为，应探讨人工智能风险的典型类型和发展趋势，从科技赋能治理的角度，研判人工智能时代的安全挑战，探索人工智能安全发展的创新之道，促进人工智能产业的健康发展，加快人工智能监管、隐私保护、算法问责、安全保障及法律责任等方面的前瞻研究，不断更新人工智能治理的“中国方案”，确保人工智能的发展造福人类未来。在西方，人工智能在产业变革、社会变革等方面的巨大潜力得到了更多国家的广泛认同。美国、日本、德国和韩国等国结合数字新基建、数据新要素、在线新经济等新背景，聚焦当前人工智能数据安全领域的重大风险和热点问题，构建了包括法律、标注规范、企业管理、安全能力供给等多维度综合性的人工智能数据安全治理框架，并针对人工智能通用规则和人脸识别、车联网、智能制造等具体行业场景，提出了一系列综合性安全解决方案。


    ## 二、人工智能法治应用与人工智能法治

    人工智能相关法治体系不断发展，尤其是人工智能的法理界定即相应的权利、义务、责任等基本范畴已经建立。在相关法治体系为人工智能提供坚实的法理支撑的同时，人工智能也促进了法治体系的健全。现有人工智能研究的覆盖领域越来越全面，不仅包括立法、司法、执法、守法等关键领域，还包括医疗卫生、城市建设、金融、交通等重点领域。特别是
    2020 年以来，将人工智能与法治融合的需求变得更为迫切。人工智能研究要与人工智能法律规范体系的建立和发展相适应，要率先在医疗卫生、城市建设、交通、金融等重点领域形成科学有效的行业规范，制定相应的行政法规，并有规划地实行地区试点，同时保障人工智能在立法、司法、执法、守法等关键领域的同步实施，在人工智能领域建立好、完善好相关科学的、可操作的法律体系，让人工智能的发展有章可循、有法可依。


    ### （一）制定并完善人工智能发展的政策规划

    据有关机构预测，到 2024 年，人工智能市场预计将突破 5000 亿美元大关，五年复合年增长率（CAGR）为 17.5%，总收入将达到 5543 亿美元。中美两国占据人工智能领域的绝对竞争优势地位。其中，2020
    年美国人工智能企业有 2257 家，占全球总数的 38.3%；中国以 1454 家人工智能企业位居第二，占 24.66%。2020 年中美两国人工智能企业数量占全球半数以上。在全球范围内，中美双雄并立，构成人工智能第一梯队，日本、英国、以色列和法国等国家构成第二梯队。2020
    年，俄罗斯人工智能产业迎来发展热潮，但对人工智能产业整体格局并未产生决定性影响。^((1))世界各主要国家和地区正相继出台更具针对性的政策举措，完善和落实人工智能战略规划，持续加大人工智能领域的研发投入与扩大人工智能的应用范围。在我国，受新冠肺炎疫情的影响，各地立法机关增强了对于信息技术的应用，立法意见征询、立法辅助、立法草案以及立法工作信息化等方面的终端应用和基础数据库开发均有进步。2021
    年 2 月 24 日，国家法律法规数据库开通上线，免费向社会公众提供法律检索查询服务；北大法宝智能立法支持平台持续扩容，针对立法的不同环节研发相应的辅助平台，尤其是在线起草文件系统。科大讯飞开发了备案审查与行政复议全流程智能化系统，通过调用人工智能引擎的图文识别和要素抽取能力，建构模型库，实现其与相关规范的关联与适用。2021
    年 3 月 13 日，十三届全国人大第四次会议通过的《中华人民共和国国民经济和社会发展第十四个五年规划和 2035 年远景目标纲要》提出：在突破核心技术、打造数字经济新优势、营造良好数字生态三个方面布局人工智能发展。推动人工智能基础设施建设、研究和教育发展，通过政策试点，积累经验全面推广。发布人工智能标准体系建设指南和伦理指引规范，并陆续制定具体标准。


    至 2020 年年底，美国、欧盟的大部分成员国、英国、俄罗斯、日本、韩国等国家，都已陆续发布国家人工智能战略。2020 年 6 月至 2021 年 3 月，以上国家都制订了落实计划，推进国家人工智能战略的实施。如
    2020 年 8 月，美国白宫科技政策办公室公布人工智能发展年度计划（2020—2021），计划增加财政预算 15 亿美元，专门用于激励人工智能领域的应用研发和理论探索。2021
    年 1 月，美国设立专门的国家人工智能倡议办公室，其作为美国整个创新生态系统的国家研究和政策的中心机构，负责协调政府、行业和学术界人工智能研究和政策的制定及实施。互联网信息化技术与线上会议也为民众的参与创造契机，美国众议院引入人工智能工具，通过自动化分析辅助立法草案的准备，在新冠肺炎疫情蔓延的背景下，虚拟会议、混合会议有效保证立法机关发挥职责；2021
    年 4 月，欧盟更新了《人工智能协调计划》，重点针对新冠肺炎疫情带来的挑战，提出加快相关人工智能技术研发应用等举措。


    ### （二）聚焦人工智能高速发展领域的立法

    在人工智能领域，自动驾驶、智能医疗、人脸识别等诸多产业都在高速发展，这些领域的立法均值得关注。在立法中应注重法律的规范、引导和保障作用。以自动驾驶为例，相关法律法规在加速制定中，以适应智能驾驶技术快速发展与普及的需要。2021
    年 2 月，中共中央、国务院发布《国家综合立体交通网规划纲要》，提出到 2035 年，要基本建成便捷顺畅、经济高效、绿色集约、智能先进、安全可靠的现代化高质量国家综合立体交通网。加强智能化载运工具和关键专用装备研发，推进智能网联汽车（智能汽车、自动驾驶、车路协同）、智能化通用航空器应用。2021
    年 4 月，公安部公开《道路交通安全法（修订建议稿）》，对智能网联汽车及自动驾驶提出规范意见，为未来自动驾驶的应用提供了法律基础。2021 年 10 月，国家互联网信息办公室等五部门联合发布的《汽车数据安全管理若干规定（试行）》正式施行，对智能网联汽车的数据处理和数据安全作出具体规定。在国外，美国交通部（USDOT）于
    2021 年 1 月发布《自动驾驶汽车综合计划》，确定实现自动驾驶系统（ADS）愿景的三个目标。2021 年 2 月，欧盟网络安全局（ENISA）发布《在自动驾驶中采用人工智能的安全挑战》报告，就自动驾驶汽车中采用人工智能技术的网络安全挑战提出了解决建议。同年
    3 月，欧盟数据保护委员会（EDPB）发布《车联网个人数据保护指南》，明确智联车辆出行处理个人数据的准则，解决高度敏感数据的使用、透明度和用户控制等问题。


    除自动驾驶领域的立法之外，当前，智慧医疗、人脸识别、数据治理、算法规制等领域的立法也在如火如荼地进行之中。例如，在智能医疗领域，我国在人工智能医疗领域的应用发展一直位于世界前列。我国智能医疗企业占人工智能企业总数的
    22%，医疗人工智能成为人工智能发展的重点。智能医疗涵盖智慧医院管理、人工智能诊疗、人工智能慢性病管理、人工智能药品开发和医药智能监管以及流行病智能监测和防控等。近十多年来，中国密集分布有关人工智能的医疗政策，其关注度世界领先。^((2))从法律行为的角度来看，人工智能医疗领域涉及的法律问题主要处在医疗数据利用、智能医疗器械使用、智能医疗药物研发、智能医疗诊断、智能医疗机构运营等领域，我们对这些领域中的行为性质认定、当事人之间的权利和义务、医疗责任分配等法律问题均需要作出立法回应。再如，运用人工智能的关键是算法，算法能够为立法提供技术支持，进而影响立法体系和立法内容。而算法在立法语言规范与立法评估中的作用问题、算法参与立法活动的成本质效问题、算法对于法律体系协调统一问题，均须人工智能技术的应用推动相关立法作出回应。


    ### （三）依法加强个人信息保护并防范人工智能技术被滥用

    加强个人信息数据安全保护的法律和政策正在相继出台，旨在防范人工智能滥用带来的法律风险。2020 年 5 月 28 日十三届全国人大第三次会议通过《民法典》，首次明确要将个人信息作为受法律保护的民事权益，并在现行法律的基础上，规范个人信息处理的基本规则。2021
    年 6 月 10 日《数据安全法》通过，2021 年 8 月 20 日《个人信息保护法》通过，进一步细化个人信息处理规则和数据分级保护制度。为了防止人脸识别技术的滥用，《个人信息保护法》明确将生物识别信息纳入受保护的个人信息的范围，并规定了处理个人图像、个人身份特征信息的特别规则。2020
    年 7 月，美国国防部发布《国防部人工智能数据与技术管理保护审计报告》，建议国防部加强对人工智能项目的管理，加强数据安全保障，改善数据共享与开发流程。2021
    年 4 月，欧盟发布《人工智能的法律框架草案》，将人工智能细分为不可接受、高风险、有限风险和最小风险四类并分类规制。


    ### （四）人工智能司法应用趋于专业化

    区块链等技术辅助类专门化应用的研发成为全球人工智能司法应用的发展趋势。在中国，人民法院信息化 3.0 版基本建成，多个利用深度学习算法、区块链和大数据智能分析技术，能够实现证据比对、事实认定等突破性功能的智审平台建立完成；在全国检察机关统一业务应用系统
    2.0 等逐步应用的基础上，检察机关在公益诉讼案件中对人工智能司法应用取得较大发展。各级人民法院、检察院开始真正利用司法大数据和算法来推动人工智能司法应用的发展。人工智能司法应用跨区域协作逐步展开。在国外，受新冠肺炎疫情影响，线上审判的“云开庭”模式已成为全球人工智能司法应用发展最突出的形式。2020
    年 12 月，欧洲司法效率委员会（CEPEJ）在全体会议上通过了网络司法与人工智能工作组下一阶段的工作路线图，将未来的工作聚焦于在线争议解决（ODR）应用、区块链在司法领域的使用等领域；美国同样关注区块链的司法应用，并开始在电子记录的保存更新、证据运用等方面尝试应用区块链技术。


    ### （五）人工智能执法应用向精细化模式发展

    人工智能执法应用技术发展以业务实践和法律需求为导向，从平面化向纵深化发展，应用平台建设从数据融合共享向跨区域深度合作方向转变。在我国，人工智能在交通执法场域的应用已实现了路网可计算、人车可测量的精细化发展模式，人工智能可通过自主学习分配路权；人工智能在情报研判场域的应用则已实现高质量数据清洗、高效率数据分析的导向式研判。与此同时，跨区域的数据共享与合作进一步加深，全国有
    31 个省级行政区已建成并在逐步升级其一网通办平台；全国各地公安大数据技术应用创新中心的建设使公安机关内部警务数据平台跨层级、跨业务、跨警种的趋势更加明显。在国外，人工智能执法应用向精确化、精细化进一步发展，如：美国研发的优先级视频审核功能，可通过警用摄像机和算法技术捕捉警务人员的不当行为；日本研发的运用人工智能技术的系统，可以预测出长期潜逃的通缉犯现在的模样。


    ### （六）人工智能法律服务应用更加广泛多元

    人工智能法律服务应用功能由个别趋向多元，应用形式由单一化趋向平台化，应用受众由专业群体向大众群体发展。在我国，人工智能各项技术在法律服务领域的应用呈现出更为综合的趋势，各项单一功能通过不断组合，为使用者提供多元化、定制化的服务。如“法信”平台将自然语言识别与深度学习相结合，不仅其自身能够快速识别文档内容并整理相关法律文件，同时还能为使用平台功能的用户提供智能化的检索服务并根据用户的模糊检索条件自动推荐相关内容。在国外，法律服务领域涌现出越来越多的平台化服务提供商，平台将技术、资源与业务整合起来，既能极大提升自身的服务水平，也能为用户提供全流程、高质量的法律服务。如美国的法律服务网站
    DoNotPay 最初仅提供帮助人们处理停车罚单的自动咨询服务，而如今其已经涵盖反骚扰、霸王条款识别等多项功能，能满足 100 多种服务需求，成为人工智能法律服务的大型平台。


    ## 三、人工智能法治应用与人工智能伦理

    约翰·罗尔斯指出：“法律与道德这一主题引起人们注意许多不同的问题。其中有：道德观念影响法律制度和受法律制度影响的途径和方式；道德概念和原则是否应进入一个适当的法律定义中；法律道德强制；批评法律制度的道德理性原则和我们默许法律制度的道德基础。”显然，罗尔斯提出的四个不同问题实际上涉及法律和道德的价值和规范等层面的相互关系。法律和伦理是相互联系、相互影响的两种规范。法律和伦理之间不仅具有关联性，而且具有互动性。一方面，了解法律与伦理的相互关系，对于法律规范和伦理规范的整理、更新、调适和完善有着积极意义。另一方面，法律与伦理是两种不同的规范，尽管它们之间存在着密切的联系，但是它们在规范价值层次、规范调整范围、规范方式和强制程度等方面存在很大的差异。这些差别表明，法律与伦理有不同的规范空间和规范层次，法律是法律，伦理是伦理，法律规范不能代替伦理规范，伦理规范也不能代替法律规范。它们发挥着不同的规范作用。^((3))


    当前，新一代人工智能技术应用不断加速，其在有力促进经济社会发展的同时，也逐步引发了主体责任不清、算法歧视、侵犯隐私等触及传统伦理价值的问题，伦理风险已经成为人工智能技术研发和应用的一个焦点议题。当前我们的人工智能还没发展到使机器拥有人一样的自主意识与行为能力，但随着人工智能从工具化向人性化逐渐过渡，传统法律主体的地位势必受到冲击。即便现有的法律体系并不能够支持人工智能享有和人一样的法律主体资格，但在理论界，法律主体的范围呈现逐渐扩宽的趋势。将机器人视作法律客体并无障碍，但考虑到人工智能体在未来的发展以及我国实际的情况，是否有必要将人工智能置于“主体”地位？如果我们为人工智能创设法律主体地位，能否为解决某些人工智能侵权问题的责任承担问题提供思路？人工智能又能享受何种程度的权利、承担何种程度的责任？这些都是人工智能伦理和人工智能法学亟待解决的问题。


    ### （一）人工智能运用的法律主体地位问题

    人工智能法律主体地位问题是关于人工智能是否可以作为法律主体，主体地位如何以及承担何种责任的问题。我国刑法及民法学界已经对人工智能的主体地位问题展开了广泛探讨。围绕人工智能的刑事主体地位及其刑事责任承担，刑法学界对人工智能的刑事主体地位问题持比较慎重的立场，因为刑事主体地位不仅涉及对犯罪主体的责任追究，还与被害人的权利救济有直接关联。民法学界对人工智能民事主体地位所持的立场整体而言也偏于慎重。^((4))近几年来引发讨论的人工智能法律主体资格问题主要是人工智能生成物是否受《著作权法》保护。北京互联网法院在计算机系统自动生成物一案判决中首次指出：软件用户仅提交了搜索关键词，其应用“可视化”功能自动生成的分析报告亦非对软件用户思想、感情的独创性表达，故该分析报告亦不宜认定为使用者的创作成果。此外，人工智能是否可以在特定场景中被认定为法律所规定的人？一家香港公司制造的机器人索菲亚被沙特阿拉伯授予公民身份，这引起了对人工智能法律人格问题的热烈讨论。^((5))


    ### （二）应用人工智能的刑事责任问题

    人工智能刑事责任不仅关乎人工智能本身还及于使用人工智能技术或设备的人。人工智能被赋予公民身份这一事件向刑法学界提出了挑战，人工智能能否成为刑事责任主体变成了一个值得讨论的话题，并且真正对当下刑法提出挑战的是人工智能与生物工程结合后的产物——被改造的人类自身。同时，放眼未来，从刑法发展论和立法论的角度出发，应增设“滥用人工智能罪”并确立研发者或使用者的严格责任以及确立智能机器人刑事责任主体地位；有学者指出，对人工智能的犯罪行为当中实行和参与观念的更新需要接受预防性犯罪化理念的指导。应对商业流程环节和行政把关环节进行预备行为实行化和共犯行为正犯化的考量，然后对客观归责和正当事由进行理论的预防性更新，因为现有的刑法教义学产生于前人工智能时代的社会实践。^((6))但是，除智能机器人刑事责任主体地位问题和“滥用人工智能罪”的罪责问题外，目前学界从这种将来视角出发所进行的关于刑法发展论和立法论的理论研讨总体上比较简单、空泛，其仅仅是一些碎片化的立法思考，完全不能适应人工智能时代算法安全犯罪观和规范刑法学发展的需要。^((7))我国《新一代人工智能发展规划》要求“推广应用人工智能治疗新模式新手段，建立快速精准的智能医疗体系”。在大力发展人工智能的同时，必须高度重视人工智能可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度地降低风险，确保人工智能安全、可靠、可控发展，加快研究制定相关安全管理法规，为新技术的快速应用奠定法律基础。刑法在保护法益的同时，也要保障医疗人工智能以及其他领域人工智能的快速应用、安全健康发展。^((8))


    ### （三）人工智能运用的隐私权保护问题

