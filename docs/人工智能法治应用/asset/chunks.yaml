    **版　　次**　2021年11月第1版\n\n**印　　次**　2021年11月第1次印刷\n\nISBN 978-7-208-17412-2/D·3860\n\
    \n**定　　价**　96.00元\n\n\uFEFF\n\n# 人工智能法学系列教材编写委员会\n\n编委会顾问：张文显\n\n编委会主任：崔亚东\n\n\
    编委会副主任：刘晓红、叶青、刘庆峰、郭伟清、黄祥青、施伟东、刘学尧\n\n编委会委员：（按姓氏笔画排列）：王志强、王国华、文学国、孔祥俊、白宁、石其宝、杨华、陈亮、何志鹏、吴泽勇、宋晓燕、欧阳为民、胡鹏、赵玉成、唐议、高志刚、袁胜育、曹红星、黄芹华、蒋传光、蒋晓伟、熊明辉\n\
    \n编委会办公室主任：杨华\n\n副主任：黄芹华、赵玉成、胡荣鑫\n\n\uFEFF\n\n# 前言\n\n**智联世界，无限可能。**\n\n**谁拥有人工智能，谁将拥有未来。**\n\
    \n进入21世纪以来，人工智能进入新的发展阶段，呈现出深度学习、跨界融合、人机协同、群智开放、自主操控等新特征，成为新一轮科技革命和产业变革的重要驱动力，并上升为国家战略。\n\
    \n习近平强调，“加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题”。[^((1))](#preface2.xhtml#jz_01_0696)\n\
    \n人工智能应用场景不断拓展，已渗透人类社会方方面面，并深刻改变着人们的生产、生活、生存方式和思维、行为方式，深刻改变着国家治理、社会治理的形式和能力，尤其是2020年以来，其在防范新冠肺炎疫情中的神奇表现，让人们对人工智能有了更加深刻的认识和感受，如同是水和电一样，无处不在，无时不在。\n\
    \n**人工智能是一把双刃剑。**\n\n人工智能具有的技术属性和社会属性高度融合的特征，决定其在造福人类的同时，也会带来风险与挑战。\n\n2018年9月17日，国家主席习近平在致2018世界人工智能大会的贺信中深刻地指出：“新一代人工智能正在全球范围内蓬勃兴起，为经济社会发展注入了新动能，正在深刻改变人们的生产生活方式。把握好这一发展机遇，处理好人工智能在法律、安全、就业、道德伦理和政府治理等方面提出的新课题，需要各国深化合作、共同探讨。中国愿在人工智能领域与各国共推发展、共护安全、共享成果。”\
    \ [^((2))](#preface2.xhtml#jz_01_0697)\n\n国务院《新一代人工智能发展规划》中指出：“人工智能发展的不确定性带来新挑战。人工智能是影响面广的颠覆性技术，可能带来改变就业结构、冲击法律与社会伦理、侵犯个人隐私、挑战国际关系准则等问题，将对政府管理、经济安全和社会稳定乃至全球治理产生深远影响。在大力发展人工智能的同时，必须高度重视可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度降低风险，确保人工智能安全、可靠、可控发展。”\n\
    \n智能社会，如何应对人工智能等新技术带来的风险与挑战？\n\n**人工智能法治应运而生。**\n\n**构建智能社会法治秩序正在成为共识。**\n\n**共识之一，构建智能社会法治秩序重要而紧迫。**当AlphaGo战胜李世石，新一轮人工智能刚刚兴起之时，人们认为，人工智能等新技术尚处于发展阶段，过早的规制会阻碍限制其创新与发展，**可以让子弹先飞一会。**但随着数字时代来临，数字技术的飞速发展，智能社会的快速形成，人们已逐渐地认识到应对已出现的和潜在的风险与挑战的重要性和紧迫性，构建智能社会法治秩序的必要性和可行性。加快建立智能社会法治秩序已成为社会普遍的呼声。**要让子弹有序地飞。**\n\
    \n**共识之二，法治是最有效的治理方式。**习近平强调：要“坚持在法治轨道上推进国家治理体系和治理能力现代化”。法治是治理社会的有效方式，也是维护智能社会秩序的最优选择。在智能社会面临的各种风险之中，最突出的是法律规制失灵;在各种挑战当中，最严峻的是法治秩序失调。运用法治思维、法治方法是推进智能社会治理最有效的途径。\n\
    \n**共识之三，智能社会治理需全球一体化。**智能社会存在的风险挑战是世界面临的共同问题，智能社会的治理赤字具有全球化趋势，因此我们要运用习近平人类命运共同体的理念，推动全球一体共同治理、共护安全、共享成果。\n\
    \n我国高度重视智能社会法治秩序建设，相关**政策体系、规则体系、技术标准体系、法律法规体系**建设快速推进，治理的社会化、法治化、智能化、专业化水平不断提高，智能社会法治秩序的“**中国方案**”正在形成。\n\
    \n**上海努力打造国家人工智能发展高地。**\n\n习近平总书记在浦东开发开放30周年庆祝大会上的讲话中强调：“要聚焦关键领域发展创新型产业，加快在**集成电路、生物医药、人工智能**等领域打造世界级产业集群。”\n\
    \n2017年6月上海提出：**上海要努力打造国家人工智能发展高地。**\n\n2018年9月上海进一步提出，上海将依托科教资源、应用场景、海量数据、基础设施等优势，以面向全球、面向未来的视野，聚焦**创新策源、应用示范、制度供给和人才聚集**，加快建设人工智能发展的“上海高地”。\n\
    \n**人工智能**已成为上海发展的重大战略。\n\n截至2020年，上海人工智能重点企业1149家，形成较为完备的人工智能产业链条，全年规上产业规模达到2246亿元，实现50%左右逆势增长，行业复苏态势明显，2018—2020年年均增速29.5%。\n\
    \n**上海努力打造人工智能法治高地。**\n\n2020年7月9日，李强同志在2020世界人工智能大会云端峰会上强调：“更加重视应对人工智能发展带来的道德伦理、隐私保护、安全风险等问题，加快研究制定相关法规制度，让人工智能更好为人所用、为人服务。”2021年7月9日，李强同志在2021世界人工智能大会再次强调：“要持续打造更加安全的敏捷治理，彰显科技向善理念，不断强化制度供给，在健全法规体系、标准体系、监管体系等方面努力形成‘上海方案’，为全球人工智能治理贡献上海智慧。”\n\
    \n数字化转型，智能社会来临，法律人应如何面对？法律人的责任何在？我认为：\n\n第一，AI+法治——即主动拥抱新科技。抓住机遇，积极推动AI与法治的深度融合，让法治插上科技的翅膀，更好地维护社会公平与正义。\n\
    \n第二，AI法治——即积极推动智能社会法治体系建设，营造智能社会法治生态，建立智能社会法治秩序，运用法治思维、法治方法，促进、规范、保障人工智能安全、可靠、可控、健康发展，使其更好地造福人类。\n\
    \n上海法学、法律界积极行动，主动服务国家人工智能战略的实施和上海人工智能“四个高地”建设，努力营造人工智能法治生态，打造人工智能法治高地。例如，2018年9月世界人工智能大会法治论坛发布了国内第一个《人工智能与未来法治构建上海倡议》，率先提出人工智能法治概念，提出构建人工智能法治14项倡议；自2018年以来连续四年在“世界人工智能大会”上举办“世界人工智能大会法治论坛”，会议主题包括“人工智能发展应用与法治保障”“共建未来法治，共享智能福祉”“人工智能的权利义务与法治实践”“智能社会的法治秩序”；先后发布了《世界人工智能法治蓝皮书》《人工智能安全与法治导则》《人工智能法治发展评估指数》等，国内外一大批专家学者发表演讲，形成了一批具有战略性、前瞻性、指导性学术观点繁荣引领人工智能法治理论研究，建立人工智能治理国际交流平台，为智能社会法治建设提供智力支持和理论支持。\n\
    \n**建立人工智能法学院，培养人工智能法治复合型人才。**\n\n“科教兴国、人才强国”是建设中国特色社会主义的重大战略之一。而人工智能等新科技的竞争与发展，人才是关键。\n\
    \n习近平强调：“人工智能具有多学科综合、高度复杂的特征。要加强人才队伍建设，以更大的决心、更有力的措施，打造多种形式的高层次人才培养平台，加强后备人才培养力度，为科技和产业发展提供更加充分的人才支撑。”习近平还就高校加强人工智能专业人才培养、调整学科设置、课程设置作出重要指示。\n\
    \n高等院校担负着建立人工智能与法学交叉学科、加快人工智能法治复合型人才培养的重大使命。**上海政法学院**在校党委书记夏小和、校长刘晓红的带领下，敢于担当、敢为人先、敢于创新，在上海市法学会、科大讯飞公司的支持下，于2019年5月在全国率先成立了“**人工智能法学院**”。自2019年起，已连续两年招收法学（AI法学方向）本科生和法律硕士研究生，每年招收本科生40名、研究生10名，**成为全国乃至世界第一所招收AI法学方向本科生的法学院**。\n\
    \n人工智能法学院是一个新事物，人工智能法学是一门新学科。新成立的人工智能法学院建设任务繁重，涉及人才培养、学科建设、科学研究、教师队伍等多个方面，其中教材是必不可少的。由于人工智能法学是新事物、新学科，教材编写没有任何可以学习与借鉴的经验和样板，于是上海政法学院决定组织人员**自主编写**。这是一项具有战略性、开创性、前沿性、先导性、引领性的工程，虽然困难重重，但意义重大。上海政法学院成立了“**人工智能法学系列教材编写委员会**”（以下简称编委会）。根据学院的要求，编委会制定了《人工智能法学教材编写纲要》，规划系列教材编写19本。教材编写工作坚持以习近平法治思想为指引，坚持“基本原理、基本知识、基本体系”原则和“厚基础、宽口径、强能力、高素质”的本科教育教学要求，注重人工智能实践及理论的阐释、基本知识点的讲清悟透、基本知识体系的完整构建等教学需求，着力在提升人工智能法学系列教材的专业性、针对性和创新性，探索理论与实践深度融合的本科教材编写和知识传播新模式上下功夫，通过完成编写任务，建立人工智能法学专业教材体系，形成上海人工智能法学的教学特色，为国家人工智能战略发展、上海人工智能高地建设培养人工智能法学领域复合型人才，为推动人工智能法学学科建设、人才培养、理论创新和应用示范等方面提供“上海方案”，服务人工智能法治研究和法治实践，促进国际交流与合作。\n\
    \n人工智能法学系列教材编写正在有序推进中。学院及编委会采取“政产学研用”多位一体的方法，集中法学、教育学、计算机科学、法律实务部门、人工智能研究和应用等领域的专家学者、教师，推进编写工作。参与编写的人员积极、主动、认真、务实，不辞辛劳，自觉为教材编写奉献智慧和力量。目前系列教材陆续出版，在此向所有参与教材编写的人员表示衷心感谢！\n\
    \n编委会十分荣幸地请到了中国法学会学术委员会主任、资深教授张文显先生担任“人工智能法学系列教材编写委员会”顾问，并为人工智能法学系列教材作序，在此表示衷心感谢！\n\
    \n系列教材由上海人民出版社出版，封面设计由北京“高高国际”设计公司完成，在此表示衷心感谢！\n\n上海市法学会党组书记、会长\n\n人工智能法学系列教材编写委员会主任\n\
    \n崔亚东（二级大法官）\n\n2021年7月31日\n\n* * *\n\n[(1)](#preface2.xhtml#jzyy_01_0696)　2018年10月31日，习近平总书记在中共中央政治局第九次集体学习时的讲话。\n\
    \n[(2)](#preface2.xhtml#jzyy_01_0697)　2018年9月17日，习近平主席致2018世界人工智能大会的贺信。\n\n\uFEFF\
    \n\n# 序\n\n2018年10月，习近平总书记在中共中央政治局第九次集体学习上就人工智能发展现状和趋势以及人工智能健康发展发表了重要讲话，他指出：“人工智能是新一轮科技革命和产业变革的重要驱动力量，加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题。”他同时强调，“要加强人工智能发展的潜在风险研判和防范，维护人民利益和国家安全，确保人工智能安全、可靠、可控。要整合多学科力量，加强人工智能相关法律、伦理、社会问题研究，建立健全保障人工智能健康发展的法律法规、制度体系、伦理道德”。习近平总书记的重要讲话，为人工智能安全发展、健康发展、法治建设、人才培养等指明了方向，设定了根本遵循。\n\
    \n在智能社会，科技具有“双刃剑”的特点。其在法治的轨道上发展和运用则造福社会和人类，脱离法治的轨道必然祸害社会和人类。以大数据、云计算、互联网、区块链为标志的智能科技所催生的“数字化”“网络化”“智能化”革命，对现行秩序带来了严重冲击和挑战，我们要积极引导、规范和保障人工智能的健康发展，构建智能社会的法治秩序。\n\
    \n构建智能社会的法治秩序需要造就大批高素质人工智能法治人才，而培养人才就需要科学合理的专业设置和教材支撑。高等院校担负着建立人工智能与法学交叉学科、加快人工智能法治复合型人才培养的重要使命。上海政法学院以敢于担当、敢为人先的精神，在上海市法学会、科大讯飞公司等单位的大力支持下，于2019年5月在上海率先成立人工智能法学院，并于当年起即招收AI法学方向的本科生和法律硕士研究生。目前，已经招生三届，在校本科生达到120余名。人工智能法学是一门新兴学科，与法学、哲学、伦理学、人工智能等学科交叉融合，教材与教师是人工智能法学专业、学科建设的一大难题。上海政法学院不畏艰难、勇于攻坚，聘请了一批在人工智能法治应用领域的专家，集中了本校人工智能法学研究的教师，组建了以崔亚东为主任的人工智能法学系列教材编写委员会，制定了《上海政法学院人工智能法学系列教材编写纲要》，规划编写19本教材，为人工智能法学专业建设、人才培养提供支持。这套教材是人工智能法学首套系统完备的教材系列，是对人工智能法学教育与人才培养的创新与探索。本套教材具有很强的专业性、创造性和示范性，具体如下：\n\
    \n一是体现了人工智能法学的专业性。建设人工智能法学专业，是贯彻落实习近平法治思想的重要体现，旨在为构建健康、安全、可控、可靠的人工智能产业发展提供专业保障。但是，培养既懂法学、又懂人工智能，并且能够将二者有机融合的专业人才绝非易事。根据上海政法学院制定的教材编写总体规划，人工智能法学系列教材注重人工智能科技与法律的紧密结合，如《人工智能法学概论》《人工智能法治应用》《人工智能辅助办案》《法律大数据分析》《数字证据与区块链》等，均体现了人工智能法学的独特性，为培养人工智能时代的社会治理人才提供了必要支撑。\n\
    \n二是体现了教材编写委员会的创造性。推进“新文科”“新工科”“新医科”“新农科”等跨学科交叉融合建设，是高等教育领域的一项重大改革，而建设人工智能法学专业正是推进“新文科”建设的重要举措。该套教材为支撑人工智能法学学科建设，融合了法学、哲学、伦理学、人工智能等方面的知识体系，并结合司法实务工作经验，为培养跨学科的复合型、应用型人才提供了教材保障。人工智能法学是一个新生事物，本套教材编写以创新为驱动，注重人工智能与法学学科及相关学科的交叉融合，为形成新兴学科体系、培育新的学科增长点和特色方向打下坚实的基础。\n\
    \n三是本套教材编写为培养应用型、复合型法学人才提供示范。法学是一门实践性、应用性很强的学科，法学专业人才培养要有相应的实务性教材相配套。本套教材以上海司法体制改革经验、司法和执法领域与人工智能深度融合应用的创新成果为标本，同时广泛吸收借鉴国内外相关实务经验和研究成果，具有深厚的本土经验和宽广的国际视野。本套教材以解决人工智能法治领域理论和实践应用问题为牵引，促进人工智能法学基础理论研究与智能社会的实践相结合，为培养复合型、应用型法学人才树立教材典范。\n\
    \n人工智能法学系列教材的出版，是人工智能法学学科建设和法治人才培养的重要支撑，也是智能时代中国法治发展的崭新探索。希望通过本系列教材的建设，培养更多人工智能法学人才、法治人才，为保障人工智能健康发展，建设中国特色社会主义现代化法治强国作出重大贡献。\n\
    \n是为序！\n\n中国法学会党组成员、学术委员会主任\n\n吉林大学、浙江大学文科资深教授\n\n张文显\n\n2021年7月31日\n\n\uFEFF\n\
    \n# 关于《人工智能法治应用》的编写说明\n\n（人工智能法学系列教材之二）\n\n### 一、编写背景\n\n设立人工智能法学专业方向，是贯彻习近平新时代中国特色社会主义思想的体现，也是响应习近平总书记在第十九届中央政治局第九次集体学习时的讲话中所指出的“要整合多学科力量，加强人工智能相关法律、伦理、社会问题研究，建立健全保障人工智能健康发展的法律法规、制度体系、伦理道德”的具体行动。\n\
    \n编写人工智能法学系列教材，是支撑人工智能法学专业建设、培养人工智能法学复合型、应用型专业人才的必要前提。人才培养需要配套的人才培养方案和系统完备的教材体系相支撑。当然，这也是一项重要的、艰巨的挑战。因为别的专业已经驶上发展的快车道，而我们还在披荆斩棘地铺路。\n\
    \n然而，伴随着全国吹响“新文科”课程建设号角，在加快法学应用型、复合型人才培养号召的背景下，探索专业、学科交叉的步伐越来越快。上海政法学院设立人工智能法学专业方向，成立人工智能法学系列教材编写委员会，制定人工智能法学教材编写纲要，为培养人工智能法学复合型、应用型人才提供基础和保障。\n\
    \n### 二、编写目的和内容\n\n本书是规划编写的19本人工智能法学系列教材中的一本。本书立足于人工智能的法治应用，在对人工智能法治问题的新概念、新理论进行尝试性解读的同时，总结了人工智能在立法、执法、司法、守法和法律服务中的应用情况及其发展趋势，解释了人工智能与法的紧密联系，走出了推动人工智能法学专业发展和人工智能法学复合型、应用型人才培养的探索性步伐，也为从事人工智能法学相关研究的人员展示了人工智能与法治的融合状况，并提出可以进一步思考的空间。\n\
    \n本书的内容分为总论、分论和余论，总论涵盖人工智能法治的研究范畴、人工智能法治应用概述等内容；分论包括人工智能的立法应用、人工智能的执法应用、人工智能的司法应用、人工智能社会治理和公共服务应用、人工智能法律服务应用等内容；余论是开放式的探讨，旨在为探索人工智能法学人才培养提供继续思考的空间。\n\
    \n### 三、编写过程\n\n本书的编写是在上海政法学院党委、人工智能法学系列教材编写委员会和上海政法学院人工智能法学院的关心、指导和支持下完成的。\n\n\
    为开展本书的编写工作，组建了由杨华任主编，彭辉、陈吉栋、吴惟予、黄一帆、余圣琪任副主编的编辑团队。具体编写分工如下：\n\n杨华负责本书的统筹规划和思路确定、拟定大纲；负责本书的统稿与修订；统筹本书与人工智能法学系列其他教材知识体系间的安排；协调与出版社、系列丛书各主编等主体之间的关系。\n\
    \n彭辉负责第六章、第七章和余论部分的编写。"
