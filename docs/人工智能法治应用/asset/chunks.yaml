- raw: "根据对国内25家主要人工智能法律服务企业（机构）所运用的底层技术的统计，大数据技术在其中占76%。数据挖掘（data mining）属于大数据技术项下的子技术，是指在大量的数据中自动搜索隐藏于其中的有着特殊关系性的数据和信息，并将其转化为计算机可处理的结构化表示，是知识发现的一个关键步骤。通过数据挖掘积累庞大的数据集，再通过特征提取和知识图谱等技术将数据类型化、结构化，可以高效准确地总结数据特征，掌控发展规律，预测未来形势。\n\
    \n法律服务领域大数据技术的应用体现为对于法律法规、政策文件、司法案例、社会热点、学理研究等信息进行结构化分类，建立多元化、立体化和可视化的法律信息库，如北大法宝建立的案例库及其同时提供的可视化分析图表。建立类型化的法律数据库一方面能够为法律工作者提供便捷且明确的资料获取途径，同时也能为进一步开发利用人工智能技术（如依托深度学习开发法律机器人等）储备基础数据。\n\
    \n##### 3．语言处理技术法律服务应用\n\n各类识别技术是人工智能技术研发的主要方向，对应法律服务的需求，自然语言处理和图像识别等技术在本领域的应用最为常见。自然语言处理技术具体包括智能分词、文本理解、内容分类、词向量、关键词提取等内容。法律工作者需要对大量文本类内容进行理解和分析，借助自然语言识别技术，用户可以快速了解法律文件的主要内容。\n\
    \n根据对国内25家主要人工智能法律服务企业（机构）所运用底层技术的统计，自然语言处理技术在其中占比达到52%。自然语言处理技术帮助法律服务企业研发能够精确理解法律文件和用户需求的人工智能产品。例如“法狗狗”推出的合同分析功能，能够快速并精确地标注关键内容，该技术还被应用于法律咨询领域，目的是精准识别咨询者意图；案例分析领域有法信平台“同案智推”功能，能够快速定位判决书要点，并根据要点推送类似案件，实现语言识别与深度学习的融合运用。\n\
    \n##### （二）应用场域分析\n\n##### 1．公共法律服务\n\n全国各地均有人工智能法律服务新应用，东部地区占比最高，达37.63%，这既与东部地区面积较大有关，同时也与东部地区自身较为领先的经济发展水平有关。其他地区发展状况分别为：西部地区36.56%；中部地区19.35%；东北地区6.45%。全国法律服务领域人工智能新应用分布广泛，且除东部、东北相对发达地区外，西部、中部等内陆地区，特别是其中处在人工智能发展阶段的省市均积极响应司法部“2020年底实现‘智慧法律服务’”的总目标号召，以智能化方式为当地群众提供便捷高效的公共法律服务。\n\
    \n司法部于2018年印发的《关于深入推进公共法律服务平台建设的指导意见》要求全国公共法律服务机构在2020年年底前实现服务精准化，公共法律服务实体、热线、网络平台全面融合，全面建成公共法律服务平台，推进三大平台一体服务。针对公共法律服务的应用场景，司法部印发的《公共法律服务事项清单》将其划分为16项具体事务。本书将应用场景限定为下述六项：法治宣传、法律咨询、法律检索、法律援助、公证与司法鉴定、其他司法行政业务（包括纠纷调解、监狱管理与社区矫正业务、机关综合业务管理等）。\n\
    \n2020年度在我国公共法律服务领域人工智能新增应用的具体场景方面，法律咨询占比最大，有66%的新增应用提供法律咨询服务，之后分别为法律援助（占60%）、法治宣传（占38%）、法律检索（占32%）、公证鉴定（占26%）、其他司法行政业务（纠纷调解占22%；业务管理占20%；监狱管理、矫正业务占2%）。\n\
    \n（1）法律咨询\n\n在公共法律服务中，法律咨询场景人工智能应用最为突出。法律咨询是公共法律服务的主要业务，公共法律服务以群众向服务机构咨询法律问题为起点。人工智能咨询服务产品在不断扩大应用场域的同时也在不断降低操作难度，推出更多对话式机器人/智能问答平台为有困难的当事人提供咨询服务，这些对话式机器人/智能平台根据案情给出相关法律建议。对话式机器人/智能平台在自然语言理解方面还有很大的提升空间。对话式机器人/智能平台也主要针对婚姻、劳务、民间借贷、知识产权等工作生活中常见的简单纠纷类型，代替律师进行咨询回答。例如，中国法律服务网提供智能法律咨询服务，可以为前来咨询的用户免费提供相应问题的法律意见书，涵盖婚姻家事、交通事故、民间借贷、物业纠纷、食品安全等29个问题域并可为群众在日常生活中遇到的各类法律问题提供方便快捷的初步咨询服务。2020年度智能法律咨询服务已经出具法律咨询意见书1850855份，得到群众广泛好评。\n\
    \n（2）法律援助\n\n法律援助在公共法律服务人工智能新增应用中亦占较大比例，主要包括律师推荐与联络、法律文书起草、诉讼程序对接等法律实务内容。公共法律机构响应司法部提出的实体、热线、网络三大平台融合倡议，将传统的线下法律援助业务整合到线上公共法律服务平台。例如宁夏司法行政机关在本统计年度中将全区28个法律援助中心、21家公证处、194家律师事务所、26家基层法律服务所、33家司法鉴定机构、3868个人民调解组织全部纳入“宁夏回族自治区司法厅全区信息化建设项目（智慧法律服务调度管理平台）”，实现公共法律服务“一网通办”。天津公共法律服务智能终端提供“全时空”智能咨询，实现当事人与法律服务人员“面对面”交流，支持法律援助网上申办与自助语音法律服务等功能，打造群众身边的“无人律所”。\n\
    \n（3）公证\n\n2018年9月30日，最高人民法院发布《关于公证债权文书执行若干问题的规定》，阐明了具有强制执行效力债权文书的公证和执行的规范化，对债权文书执行智能系统的建设具有重大意义。客观上讲，赋强公证区块链就是运用大数据、云计算、人工智能技术，构建智能的债权文书执行系统，有针对性地解决普惠金融的催收成本高、效率差、周期长等痛点问题。回应与解决普惠金融问题的关键，在于让金融机构与公证机构建立区块链的数据分布式存储与互信体系；借助在线赋强公证的方式，获得具有执行效力的法律文书，推动在线贷前、贷后的全流程管理。它在贷款申请环节实现对客户的警示和对潜在欺诈客户风险的规避；在贷后催收环节由公证机构进行核实催告，减少金融机构相关部门的催收工作量，同时在催收监管趋严的当下，解决传统催收方式催收成本高、效率低、周期长、催收手段不合规等问题。一旦发生不良贷款，凭借线上出具的电子执行文书，即可直接进入法院强执阶段，大幅提高法院执行效率；且法院追缴失败之后，又可及时把失信人纳入失信被执行人名单加以惩戒。其中，金融机构的这种在线贷款借助赋强公证的切入点，即在于把贷款申请嵌入公证流程，引入公证机构直面借款人进行识别，把赋强公证的流程清晰告知客户，予以贷前法律连续后果提示和预警。然后，完成借款协议双方的在线签约和客户每笔用款交易数据的在线存证，构建起完整的贷款证据链。基于金融机构的视角，贷前赋强公证所获取的客户信息全部基于符合公证法定要件的客户授权，且通过加密算法传送和存放；同时，贷款交易数据也通过密文形式加以传输。借助这样的方案，区块链上的大数据在客户端、金融机构端实现了安全可靠的分布式存储。正是这一分布式存储的可信性，让金融机构实现了全线上完成贷前流程申请、公证机构的贷后不良对客催告，以及属地化的申请法院强制执行和对接失信被执行人名单。因此，赋强公证区块链的本质在于解决了电子存证的公正性，借此可以大幅提升线上债权文书执行的质效，为金融机构和客户两端提供“一站式”的债权纠纷解决方案，其结果表现为对债权人、债务人的实体和程序权益的高效保护，在推动普惠金融建设上具有标杆性作用。\n\
    \n（4）普法宣传\n\n普法宣传是建设法治社会的关键环节，传统普法工作以社区宣讲、发放宣传册、观看宣传片等形式为主，而依托智能普法机器人等人工智能技术，可以进一步增强普法工作成效，使其更易于为年轻一代所接受。北京人人律智能大数据科技有限公司依托其法律内容资源和行业经验积累，构建“智能硬件+智能应用+移动互联网”的公共法律服务智能终端。人人律智能大数据公司充分融合人工智能、大数据、云计算、法律知识图谱等技术理念，自主研发“小律”智慧普法与公共法律服务机器人、触摸一体机、自助柜员机、无人亭、可视化自助机、线上智能法律咨询机器人等系列智能终端，通过人工智能实现自然语言的识别，实现更为清晰的问题理解、分析和回答。人工智能机器人的应用，助推地方普法工作的顺利地开展。\n\
    \n##### 2．企业法律服务\n\n人工智能在商业法律服务领域能够提供多种服务。传统工作模式下，法律从业者通过人工方式进行重复性大、内容密集的工作，效率低下，成本高昂。人工智能通过人机互动的方式实现工作自动化，以机器取代人工，帮助法律工作者完成基础性的法律服务工作，在降低人工成本的同时大幅提升工作效率。对国内25家主要人工智能法律服务企业开展统计分析后，相应结果显示国内人工智能法律服务企业提供应用场景主要包括：法律咨询（占48%）；文件审阅（占48%）；法律检索（占40%）；预测评估（包括案件预测与风险评估等，占28%）；存证鉴定（占16%）；业务管理（占12%）。\n\
    \n企业提供的法律咨询服务和公共机构提供的法律咨询重合度较高，不再赘述，以下对排名二、三、四位的应用场域进行介绍。\n\n（1）法律检索\n\n法律检索需要耗费检索人员大量时间精力。国内已有一批可以提供高效辅助功能的人工智能法律检索产品，如“法信”平台，作为中国首个法律知识和案例大数据融合服务平台，其能够为法律从业人员提供一站式专业知识解决方案、类案剖析、同案智推等服务。其中的同案智推服务依托自然语言处理和深度学习技术，支持用户输入口语化的案情描述或上传整篇法律文书，系统会自动识别案情特征等内容，并从海量裁判中匹配类似案件，为用户提供快捷准确的服务。\n\
    \n（2）文件审阅\n\n文件审阅工作内容体量大，但单项工作所蕴含的内在价值低，通过运用自然语言识别技术并结合深度学习，人工智能逐渐能够理解基础法律文件的内涵并实际参与到文件审阅工作中，在文件整理、尽职调查、合规风控等法律事务中发挥了重要作用。此外，在合同审核方面，智能合同服务可以提供人工智能合同分析，帮助用户以更低的成本、更高的效率管理合同，防范法律风险。当前的智能技术已经可以实现不同版本的精细化比对，例如北大法宝依托其数据资源推出的智慧法务平台，能够准确发现合同文本与合同范本之间的差异。\n\
    \n（3）预测评估\n\n日常业务中企业时常因面临各类风险而遭遇诉讼。无论是对于风险自身的评估抑或遭遇诉讼后对可能结果的预判，传统的人力工作方式无论在数据采集还是对各类因素的分析方面均有力所不逮之处。人工智能的应用带来转机，结合自然语言识别与深度学习技术，人工智能能够根据用户输入的案情描述，分析案情的关键点，进而结合相似案件的判罚情况评估本案的结果。例如擎盾研发的诉讼风险评估产品，基于裁判文书中事实、诉求、证据、争议焦点等法律要素，提炼案件特征，形成法律知识图谱，进而通过生成法律意见书的方式帮助当事人知悉诉讼风险。\n\
    \n##### （三）发展特点分析\n\n##### 1．应用功能由个别类型向多元化发展\n\n人工智能在法律服务领域的应用呈现出由初期探索迈向全面发展的趋势。早期的法律人工智能应用多集中于单一化、特定化的应用场景，各项技术仅支持独立使用。随着科技的进一步发展，如今的法律人工智能已在开展各项技术交融的探索，如“法信”平台将自然语言识别与深度学习相结合，不仅其自身能够快速识别文档内容并整理相关法律文件，同时还能为使用平台功能的用户提供智能化的检索服务并根据用户的模糊检索条件自动推荐相关内容。人工智能技术在法律服务领域的应用呈现出更为综合的趋势，各项单一功能可不断组合，为使用者提供多元化、定制化的服务。\n\
    \n##### 2．应用形式由单一系统向平台化发展\n\n早期与法律服务相关的人工智能应用多倾向针对单一场景的应用软件，而此种服务模式已经难以适应当前信息时代的发展趋势，因此在法律服务领域涌现出越来越多的平台化服务提供商。国内北大法宝、“法信”等数据服务商不断整合合同审核、案件预测等法律服务内容，逐步建立大型法律服务平台。这些平台将技术、资源与业务整合起来，既能极大提升自身服务水平，也可为用户提供全流程、高质量的法律服务。\n\
    \n##### 3．应用受众由专业群体向大众化发展\n\n人工智能法律服务产品在设计上进一步贴近群众，能够更有效地服务社会公众。行业涌现出的一批具备情感交互功能的智能法律助理产品，旨在实现知识传递、情感交流和需求满足之间的良性循环。通过智能问答平台进行法律咨询，可实现对简单法律问题的精准识别、充分理解、高效分析和及时回答。我国法律机器人的发展和应用体现出此种趋势，其内容和形式的可操作性不断改善，更加贴近群众日常生活。\n\
    \n### 二、国外人工智能法律服务应用\n\n##### （一）区域应用统计\n\n##### 1．美国\n\n以美国266家人工智能法律服务商为样本的统计结果显示，美国人工智能技术已在法律服务各业务领域广泛分布，特别是在合同审核与诉讼服务领域，分别对应公司法务和律师业务的核心内容，占总量的21.81%和19.17%。除上述业务外，法律服务市场（包括律师平台等）、智能顾问、业务管理、法律数据库和自动文件生成等应用场景亦多有智能技术的参与，形成了全流程、多方位的智能法律服务行业样态。\n\
    \n##### 2．日本\n\n2020年度，日本法律服务行业新增应用23件。人工智能技术涵盖的应用场景的进一步分析结果显示，合同服务（包括合同生成、缔结、审阅等）占43.48%，其他如商事登记服务、尽职调查和电子取证、法律数据库和律师咨询、业务平台等也多有人工智能助力。\n\
    \n##### （二）应用发展动态\n\n##### 1．人工智能应用\n\n人工智能系统当前所能处理的法律任务可以被分为三大领域：文件分析、法律检索以及自动化事务处理。文件分析还可细分为合同分析、文件审核与电子档案查询等板块。例如摩根大通使用其自有的智能合同软件每年能够减少36万小时的合同审核时间。一些法律科技初创公司如KiraSystems和eBrevia等也提供人工智能驱动的尽职调查与合同分析系统，可以减少其客户在处理法律事务方面的时间成本与经济成本。\n\
    \n人工智能法律检索工具能够提供多样化的数据采集、分析与预测服务。深度学习技术平台Intraspexion开发法律预测软件，用于提醒客户潜在法律风险。预测分析公司CourtQuant与几家诉讼融资公司开展合作，为其提供诉讼资金相关机会的评估服务。\n\
    \n合同审查在风控、尽职调查、取证、诉讼等诸多场合具有重大意义，但其仍是一项耗时耗力的工作。人工智能为上述烦琐耗时的工作提供快速高效的解决方案，例如德勤（Deloitte）借助机器学习合同分析系统Kira\
    \ Systems，只需15分钟就可以读完原本需要人类律师花费12个小时才能审阅完的合同。在国外业界，人工智能合同分析服务已经蔚然成风，KM Standards、RAVN、Seal\
    \ Software、Beagle、LawGeex等提供智能合同服务的法律科技公司越来越多，在人工智能技术的驱动下，合同审查服务质量不断提升，人工智能法律服务应用市场蓬勃发展。\n\
    \n##### 2．综合平台服务\n\n集成多种功能和丰富资源的法律服务平台已成为法律服务企业的首选运营模式，国外法律服务领域人工智能平台化趋势显著。例如美国的智能律师服务平台DoNotPay，最初仅帮助人们处理停车罚单的自动咨询服务，如今已经提供反骚扰、霸王条款识别等多项服务，涵盖100多种服务需求，成为人工智能法律服务的大型平台。\n\
    \n## 第三节  \n\n人工智能法律服务应用面临的新挑战\n\n### 一、人工智能对法律服务的影响\n\n技术的进步是先进生产力取代落后生产力的历史进程。科技水平的提高往往可以为产权的有效界定与保护提供可靠的技术手段，降低产权的排他性费用，从而使产权制度安排成为可能。随科技创新先后建立的技术研发制度、产权制度、风险投资制度和法律保障制度等，推动人类社会制度的不断转变和完善。积极的技术冲击引发了一场诱导性制度变革。技术进步扩大了制度变迁的获利空间，增加了制度变迁的潜在利润，降低了制度变迁的成本，刺激和扩大了制度变迁的需求。技术变迁对制度变革有着广泛的影响。科技进步使产出在很大范围内产生规模递增效应，导致更为复杂的经济组织形式变得有利可图。技术变迁在增加制度变革潜在利润的同时，也降低了部分制度变革的操作成本。以人工智能技术发展及其在法律服务领域应用为例，其给法律服务业发展带来了巨大的机遇，为法律服务业模式创新与发展提供了契机。人工智能技术大大提高了法律服务效率，解放了生产力，实现了资源的优化配置，改善了人们获取法律服务的途径和品质。随着图形图像识别、自然语言处理、意识上传等人工智能技术要素的日新月异，法律服务业发展往往体现为以那些具有技术优势与交易成本优势的制度实现效率更高的制度安排，“人工智能+”的技术变迁对制度变革的推动作用势必进一步推动法律服务业的模式创新的实现。人工智能技术的发展会带来法律服务领域的制度变革，法律服务领域的制度变革也可能对人工智能技术进步和产业发展产生重要影响，如法律服务领域的制度对人工智能技术的监管和规制。好的制度对人工智能领域的技术创新和成果转化大有裨益，对技术进步引发的问题的解决也有帮助。应关注人工智能技术与法律服务领域制度之间的互动，促进人工智能技术与法律服务深度融合，充分发挥技术变迁对制度变革的积极作用。对人工智能技术对法律服务业发展的积极影响，应给予鼓励和促进。"
