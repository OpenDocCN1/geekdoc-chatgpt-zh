    ## 第二，需保护的数据

    一般说来，需要监管的数据可划分为两类：个人识别信息（Personal Identity Information，PII）和个人隐私/敏感数据。其中，PII
    是指能直接根据该信息识别和定位到个人的信息，如姓名、身份证号码、银行卡号、家庭住址等；个人隐私/敏感数据是指虽不能直接识别和定位到个人，但通过关联和综合分析，有可能定位到个人的信息，如健康信息、教育经历、征信记录等。各国对个人隐私/敏感数据的定义不同，其保护的数据范围也就各不相同，如我国在一些部门规章中划定了个人信息保护的具体范围，而俄罗斯、新加坡等国则规定凡是和个人相关的信息，被认为是个人隐私/敏感数据，均在保护范围内。


    ## 第三，监管对象

    一般情况下，所有涉及数据收集、存储、处理、利用的数据控制者都是被监管的对象，但各国也根据本国国情规定了可免除监管的例外，如新加坡规定公民个人行为、员工就业过程中的必要行为、政府/新闻/科研等公共机构的部分行为、某些获取了明确证明或书面合同的数据中介机构等，可免于数据保护法律法规的监管。


    ## 第四，需监管的行为

    美国、欧盟、中国、俄罗斯、新加坡等均提出应对数据的全生命周期进行监管，监管对象包括收集、记录、组织、积累、存储、变更（更新、修改）、检索、恢复、使用、转让（传播，提供接入等）、脱敏、删除、销毁等行为，但各国也根据本国国情规定了可免除监管的例外，如依据俄罗斯法，专为个人和家庭需求处理个人数据（前提是不侵犯数据对象的权利）、处理国家保密数据、依照有关法院立法由主管当局向俄罗斯法院提供相关数据等情况，则属于相应的例外豁免情形。


    ## 第五，监管者权力

    为保证数据安全法律法规的落实，监管部门需设立相应的机构和人员，配置相应的权力，如执法权等。俄罗斯数据保护最主要的监管部门是俄罗斯电信/信息技术和大众传媒联邦监管局（Roskomnadzor）。此外俄罗斯政府、俄罗斯联邦技术和出口服务局（FSTEC）以及俄罗斯联邦安全局（FSS）等主管监管部门也制定了一些数据保护的特定条款。新加坡数据保护最主要的法律依据是《个人数据保护法》（PDPA），同时为了执行
    PDPA，新加坡专门成立个人数据保护委员会（PDPC）来承担 PDPA 的制定和实施工作。俄罗斯的 Roskomnadzor 和新加坡的 PDPC 均具有一定的执法权。


    ## （2）数据主体

    数据主体层面主要围绕数据主体来界定数据保护要点，也就是用户在使用信息服务的过程中所拥有的权利，包括数据收集/处理前被告知的权利（知情权）、授权个人数据收集/处理的权利（授权处理权）、访问/查询/更正个人信息的权利（访问/查询/更正权）、停止收集/删除个人信息的权利（停止收集/删除权）、投诉的权利（投诉权），以及其他相关权利等。各国数据保护法律法规对数据主体权利基本进行了规定，但规定的细致程度又各不相同。如针对知情权，我国
    2016 年 11 月颁布的《网络安全法》规定，要向用户公开收集、使用规则，明示收集、使用信息的目的、方式和范围，并经被收集者同意，但并没有详细规定具体的明示的形式和内容，授权同意的方式等内容。而俄罗斯则规定，数据主体全名/地址/身份证明
    ID（如护照）/身份证明的发行时间与发证机关/签名等信息、数据控制者的全名/地址/数据处理目的等关键信息，需要以书面形式给出（包括电子签名的方式）。新加坡一方面规定，数据控制者在收集个人数据之前需经数据主体的同意，另一方面未指定特定的通知形式。


    ## （3）数据控制者

    数据控制者层面主要围绕数据控制者在数据收集、存储、处理等全生命周期中承担的义务，界定数据保护的要点，包括配合数据主体实现其权利的义务、确保数据安全的义务、收集数据前征求数据监管者同意的义务、向数据监管者报备数据收集和利用情况的义务、发生异常事件时的通报义务、数据境外流转/存储前向数据监管者申请的义务等。以向数据监管者报备数据收集和利用情况的义务为例，我国的法律法规未明确规定数据控制者处理数据前需向指定的政府主管部门申请或登记。俄罗斯规定，数据控制者在操作处理个人数据之前必须报备其主管监管部门
    Roskomnadzor（可提供纸版或电子版），且报备时必须提供数据控制者的名称和地址、处理个人数据的目的和种类、数据对象的分类、数据保护人员的姓名和联系方式、用于承载俄罗斯公民数据的数据库地址等信息。Roskomnadzor
    接到报备后在 30 天内对数据控制者的相关信息进行注册，并在相关网站上登记和公开。新加坡则规定数据控制者在一般情况下有义务通知数据用户，形式主要包括书面和口头通知两种。虽然
    PDPA 并没有制定具体形式，但特别指出针对用户不了解的数据使用目的，数据控制者必须提供所有相关信息。


    ### 3．政策工具应对

    迈克尔·豪利特和拉米什基于政府提供公共产品的主导性，将政策工具分为强制性、混合性、自愿性三大类十小类（见表 6-2）。其中强制性工具强调借助国家或政府的权威及强制力迫使目标群体采取或不采取某种行为，混合性工具往往允许政府一定程度地参与，但将行动的最终决策权留给其他主体（如市场、社会组织等），自愿性工具的特点是政府不参与或不主动介入而让其他主体自主处理公共问题。


