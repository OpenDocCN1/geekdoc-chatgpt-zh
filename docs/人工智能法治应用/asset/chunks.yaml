    ## 前言


    **智联世界，无限可能。**


    **谁拥有人工智能，谁将拥有未来。**


    进入 21 世纪以来，人工智能进入新的发展阶段，呈现出深度学习、跨界融合、人机协同、群智开放、自主操控等新特征，成为新一轮科技革命和产业变革的重要驱动力，并上升为国家战略。


    习近平强调，“加快发展新一代人工智能是事关我国能否抓住新一轮科技革命和产业变革机遇的战略问题”。^((1))


    人工智能应用场景不断拓展，已渗透人类社会方方面面，并深刻改变着人们的生产、生活、生存方式和思维、行为方式，深刻改变着国家治理、社会治理的形式和能力，尤其是
    2020 年以来，其在防范新冠肺炎疫情中的神奇表现，让人们对人工智能有了更加深刻的认识和感受，如同是水和电一样，无处不在，无时不在。


    **人工智能是一把双刃剑。**


    人工智能具有的技术属性和社会属性高度融合的特征，决定其在造福人类的同时，也会带来风险与挑战。


    2018 年 9 月 17 日，国家主席习近平在致 2018 世界人工智能大会的贺信中深刻地指出：“新一代人工智能正在全球范围内蓬勃兴起，为经济社会发展注入了新动能，正在深刻改变人们的生产生活方式。把握好这一发展机遇，处理好人工智能在法律、安全、就业、道德伦理和政府治理等方面提出的新课题，需要各国深化合作、共同探讨。中国愿在人工智能领域与各国共推发展、共护安全、共享成果。”
    ^((2))


    国务院《新一代人工智能发展规划》中指出：“人工智能发展的不确定性带来新挑战。人工智能是影响面广的颠覆性技术，可能带来改变就业结构、冲击法律与社会伦理、侵犯个人隐私、挑战国际关系准则等问题，将对政府管理、经济安全和社会稳定乃至全球治理产生深远影响。在大力发展人工智能的同时，必须高度重视可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度降低风险，确保人工智能安全、可靠、可控发展。”


    智能社会，如何应对人工智能等新技术带来的风险与挑战？


    **人工智能法治应运而生。**


    **构建智能社会法治秩序正在成为共识。**


    **共识之一，构建智能社会法治秩序重要而紧迫。**当 AlphaGo 战胜李世石，新一轮人工智能刚刚兴起之时，人们认为，人工智能等新技术尚处于发展阶段，过早的规制会阻碍限制其创新与发展，**可以让子弹先飞一会。**但随着数字时代来临，数字技术的飞速发展，智能社会的快速形成，人们已逐渐地认识到应对已出现的和潜在的风险与挑战的重要性和紧迫性，构建智能社会法治秩序的必要性和可行性。加快建立智能社会法治秩序已成为社会普遍的呼声。**要让子弹有序地飞。**


    **共识之二，法治是最有效的治理方式。**习近平强调：要“坚持在法治轨道上推进国家治理体系和治理能力现代化”。法治是治理社会的有效方式，也是维护智能社会秩序的最优选择。在智能社会面临的各种风险之中，最突出的是法律规制失灵;在各种挑战当中，最严峻的是法治秩序失调。运用法治思维、法治方法是推进智能社会治理最有效的途径。


    **共识之三，智能社会治理需全球一体化。**智能社会存在的风险挑战是世界面临的共同问题，智能社会的治理赤字具有全球化趋势，因此我们要运用习近平人类命运共同体的理念，推动全球一体共同治理、共护安全、共享成果。


    我国高度重视智能社会法治秩序建设，相关**政策体系、规则体系、技术标准体系、法律法规体系**建设快速推进，治理的社会化、法治化、智能化、专业化水平不断提高，智能社会法治秩序的“**中国方案**”正在形成。


    **上海努力打造国家人工智能发展高地。**


    习近平总书记在浦东开发开放 30 周年庆祝大会上的讲话中强调：“要聚焦关键领域发展创新型产业，加快在**集成电路、生物医药、人工智能**等领域打造世界级产业集群。”


    2017 年 6 月上海提出：**上海要努力打造国家人工智能发展高地。**


    2018 年 9 月上海进一步提出，上海将依托科教资源、应用场景、海量数据、基础设施等优势，以面向全球、面向未来的视野，聚焦**创新策源、应用示范、制度供给和人才聚集**，加快建设人工智能发展的“上海高地”。


    **人工智能**已成为上海发展的重大战略。


    截至 2020 年，上海人工智能重点企业 1149 家，形成较为完备的人工智能产业链条，全年规上产业规模达到 2246 亿元，实现 50%左右逆势增长，行业复苏态势明显，2018—2020
    年年均增速 29.5%。


    **上海努力打造人工智能法治高地。**


    2020 年 7 月 9 日，李强同志在 2020 世界人工智能大会云端峰会上强调：“更加重视应对人工智能发展带来的道德伦理、隐私保护、安全风险等问题，加快研究制定相关法规制度，让人工智能更好为人所用、为人服务。”2021
    年 7 月 9 日，李强同志在 2021 世界人工智能大会再次强调：“要持续打造更加安全的敏捷治理，彰显科技向善理念，不断强化制度供给，在健全法规体系、标准体系、监管体系等方面努力形成‘上海方案’，为全球人工智能治理贡献上海智慧。”


    数字化转型，智能社会来临，法律人应如何面对？法律人的责任何在？我认为：


    第一，AI+法治——即主动拥抱新科技。抓住机遇，积极推动 AI 与法治的深度融合，让法治插上科技的翅膀，更好地维护社会公平与正义。


    第二，AI 法治——即积极推动智能社会法治体系建设，营造智能社会法治生态，建立智能社会法治秩序，运用法治思维、法治方法，促进、规范、保障人工智能安全、可靠、可控、健康发展，使其更好地造福人类。


    上海法学、法律界积极行动，主动服务国家人工智能战略的实施和上海人工智能“四个高地”建设，努力营造人工智能法治生态，打造人工智能法治高地。例如，2018 年
    9 月世界人工智能大会法治论坛发布了国内第一个《人工智能与未来法治构建上海倡议》，率先提出人工智能法治概念，提出构建人工智能法治 14 项倡议；自 2018
    年以来连续四年在“世界人工智能大会”上举办“世界人工智能大会法治论坛”，会议主题包括“人工智能发展应用与法治保障”“共建未来法治，共享智能福祉”“人工智能的权利义务与法治实践”“智能社会的法治秩序”；先后发布了《世界人工智能法治蓝皮书》《人工智能安全与法治导则》《人工智能法治发展评估指数》等，国内外一大批专家学者发表演讲，形成了一批具有战略性、前瞻性、指导性学术观点繁荣引领人工智能法治理论研究，建立人工智能治理国际交流平台，为智能社会法治建设提供智力支持和理论支持。


    **建立人工智能法学院，培养人工智能法治复合型人才。**


    “科教兴国、人才强国”是建设中国特色社会主义的重大战略之一。而人工智能等新科技的竞争与发展，人才是关键。


    习近平强调：“人工智能具有多学科综合、高度复杂的特征。要加强人才队伍建设，以更大的决心、更有力的措施，打造多种形式的高层次人才培养平台，加强后备人才培养力度，为科技和产业发展提供更加充分的人才支撑。”习近平还就高校加强人工智能专业人才培养、调整学科设置、课程设置作出重要指示。


    高等院校担负着建立人工智能与法学交叉学科、加快人工智能法治复合型人才培养的重大使命。**上海政法学院**在校党委书记夏小和、校长刘晓红的带领下，敢于担当、敢为人先、敢于创新，在上海市法学会、科大讯飞公司的支持下，于
    2019 年 5 月在全国率先成立了“**人工智能法学院**”。自 2019 年起，已连续两年招收法学（AI 法学方向）本科生和法律硕士研究生，每年招收本科生
    40 名、研究生 10 名，**成为全国乃至世界第一所招收 AI 法学方向本科生的法学院**。


    人工智能法学院是一个新事物，人工智能法学是一门新学科。新成立的人工智能法学院建设任务繁重，涉及人才培养、学科建设、科学研究、教师队伍等多个方面，其中教材是必不可少的。由于人工智能法学是新事物、新学科，教材编写没有任何可以学习与借鉴的经验和样板，于是上海政法学院决定组织人员**自主编写**。这是一项具有战略性、开创性、前沿性、先导性、引领性的工程，虽然困难重重，但意义重大。上海政法学院成立了“**人工智能法学系列教材编写委员会**”（以下简称编委会）。根据学院的要求，编委会制定了《人工智能法学教材编写纲要》，规划系列教材编写
    19 本。教材编写工作坚持以习近平法治思想为指引，坚持“基本原理、基本知识、基本体系”原则和“厚基础、宽口径、强能力、高素质”的本科教育教学要求，注重人工智能实践及理论的阐释、基本知识点的讲清悟透、基本知识体系的完整构建等教学需求，着力在提升人工智能法学系列教材的专业性、针对性和创新性，探索理论与实践深度融合的本科教材编写和知识传播新模式上下功夫，通过完成编写任务，建立人工智能法学专业教材体系，形成上海人工智能法学的教学特色，为国家人工智能战略发展、上海人工智能高地建设培养人工智能法学领域复合型人才，为推动人工智能法学学科建设、人才培养、理论创新和应用示范等方面提供“上海方案”，服务人工智能法治研究和法治实践，促进国际交流与合作。


    人工智能法学系列教材编写正在有序推进中。学院及编委会采取“政产学研用”多位一体的方法，集中法学、教育学、计算机科学、法律实务部门、人工智能研究和应用等领域的专家学者、教师，推进编写工作。参与编写的人员积极、主动、认真、务实，不辞辛劳，自觉为教材编写奉献智慧和力量。目前系列教材陆续出版，在此向所有参与教材编写的人员表示衷心感谢！


    编委会十分荣幸地请到了中国法学会学术委员会主任、资深教授张文显先生担任“人工智能法学系列教材编写委员会”顾问，并为人工智能法学系列教材作序，在此表示衷心感谢！


    系列教材由上海人民出版社出版，封面设计由北京“高高国际”设计公司完成，在此表示衷心感谢！


    上海市法学会党组书记、会长


    人工智能法学系列教材编写委员会主任


