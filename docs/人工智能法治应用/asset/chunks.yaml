    (1)　崔亚东主编：《世界人工智能法治蓝皮书（2021）》，上海人民出版社 2021 年版，第 2 页。

    (2)　例如，2008 年浙江省卫生厅发布的《浙江省卫生信息化建设“十一五”规划》提到“要在中医诊断技术、方法和仪器设备及生物医学工程技术方面广泛采用人工智能、信号处理和资料挖掘等信息技术”，这是医疗人工智能首次出现在省级政策文件中。2018
    年发布的《安徽省新一代人工智能产业发展规划（2018—2030 年）》和《安徽省人民政府办公厅关于促进“互联网+医疗健康”发展的实施意见》都提出积极推动智能医疗的发展，研发外科辅助机器人、医学影像辅助诊断系统，推进医学影像识别的应用等。2018
    年，上海市政府发布《“健康上海 2030”规划纲要》和《上海市人民政府关于推进本市健康服务业高质量发展加快建设一流医学中心城市的若干意见》，推进人工智能在医学领域的应用。2018
    年 9 月发布的《北京市加快医药健康协同创新行动计划（2018—2020 年）》，将促进医药健康与人工智能、大数据技术融合新兴业态等领域发展作为重点任务之一。

    (3)　刘华：《法律与伦理的关系新论》，《政治与法律》2002 年第 1 期。

    (4)　杨猛宗：《人工智能机器人劳动者主体身份的反思与应然转向》，《政法论丛》2020 年第 6 期。

    (5)　刘云：《论人工智能的法律人格制度需求与多层应对》，《东方法学》2021 年第 1 期。

    (6)　郭旨龙：《中国刑法何以预防人工智能犯罪》，《当代法学》2020 年第 2 期。

    (7)　魏东：《人工智能算法安全犯罪观及其规范刑法学展开》，《政法论丛》2020 年第 3 期。

    (8)　皮勇：《论医疗人工智能的刑法问题》，《法律科学》（西北政法大学学报）2021 年第 1 期。

    (9)　郭旨龙：《从公民身份到信息身份：隐私功能的理论重述与制度安排》，《法制与社会发展》2020 年第 5 期。

    (10)　解正山：《数据驱动时代的数据隐私保护——从个人控制到数据控制者信义义务》，《法商研究》2020 年第 2 期。

    (11)　戴龙：《论数字贸易背景下的个人隐私权保护》，《当代法学》2020 年第 1 期。

    (12)　王叶刚：《网络隐私政策法律调整与个人信息保护：美国实践及其启示》，《环球法律评论》2020 年第 2 期。

    (13)　宁园：《健康码运用中的个人信息保护规制》，《法学评论》2020 年第 6 期。


    # 附录

    ## 人工智能法治应用实例选

    ### 一、立法应用

    2018 年 2 月，上海率先建成“智慧法制”立法信息平台，与办公厅公文系统对接，将电子数据一键推送，使地方行政立法工作有了人工智能辅助，有利于立法工作的有序推进。


    2019 年 2 月 11 日，时任美国总统唐纳德·特朗普签署一项行政命令《保持美国在人工智能领域的领导地位》，该命令旨在刺激人工智能的发展和监管。其通过指示联邦机构优先投资于人工智能的研发，巩固美国的全球地位。


    2020 年 1 月，辽宁省人大代表履职信息化平台及移动客户端“辽宁人大”APP，省人大代表可以在会议期间，使用 APP 查阅资料、履职交流、传递意见等。该
    APP 实现了地方电子立法化，提高了立法效率。


    2020 年 2 月 19 日，欧盟委员会发布《人工智能白皮书》，旨在通过提升欧洲在人工智能领域的创新能力，防范和处理人工智能技术带来的各类风险，推动道德的和可信赖人工智能的发展。


    2020 年 5 月，美国出台《生成人工智能网络安全法》，要求：美国商务部和联邦贸易委员会明确人工智能在美国应用的优势和障碍；调查其他国家的人工智能战略，并与美国进行比较；评估供应链风险以及提出如何解决这些风险。


    2021 年 2 月 24 日，国家法律法规数据库正式开通，旨在促进法治建设与信息化工作的有机融合，实现立法公开的及时性、系统性、便利性。


    2021 年 4 月 21 日，为将欧洲变成值得全球信赖的人工智能中心，加强整个欧盟范围内对于人工智能的使用、投资和创新，欧盟委员会通过《人工智能法》提案，旨在建立关于人工智能技术的统一规则。


    2021 年 6 月 21 日，欧盟数据保护委员会和欧盟数据保护监督局呼吁欧盟全面禁止在公共场所使用人工智能自动识别人类特征，以对“敏感个人信息”类型数据进行保护，这对于人工智能立法有指引作用。


    2021 年 6 月 28 日，深圳推出全国人工智能领域首部地方性法规，规定市政府设立人工智能伦理委员会，推动构建覆盖全面、导向明确、规范有序、协调一致的人工智能伦理治理规则。


    在美国，通告和评论项目使公众可以方便快捷地查看 400 多万份政府文件，包括在《联邦公报》上发表的联邦法规和地方政府发布的通告。该项目利用先进分析和自然语言处理来摄取政府文件，追踪政策、法律和规章的变化。用户可以轻而易举地对拟订中的联邦法规进行评论或投票。网站数据每天都会更新，实时显示新的提案和趋势。在提案变成法律之前，用户可以利用网站内部集成的社交媒体和网上的最佳写作技巧来有效地宣扬他们的观点，寻求其他人的支持。


    海牙国际刑事法院推出判例法数据库，该数据库提供免费、便捷和不断更新的判例法查询服务，包括与国际犯罪和国际刑事诉讼程序、被告权利和受害者权利有关的判例。


    ### 二、司法应用

    2016 年 7 月，美国威斯康星州最高法院批准使用一种风险评估算法 COMPAS 对被告的犯罪危险等级进行测算，并最终依据该算法量刑。


    2017 年 2 月 23 日，中国社会科学院法学研究所发布《法治蓝皮书：中国法院信息化发展报告 No.1（2017）》。蓝皮书指出，北京法院依托“睿法官”系统，整合多类数据资源进行大数据挖掘分析，为法官判案提供统一、全面的审理规范和办案指引，同时自动生成裁判文书，统一法律适用，提高审判质效。


    2017 年 4 月，海南省高级人民法院引入大数据和人工智能技术，自主研发覆盖量刑规范化改革的全方位智能量刑辅助办案系统，它不仅能辅助法官办案，还能破解量刑公正难题。这也使得海南量刑规范化工作一直走在全国前列，多次受到最高人民法院的肯定，一些经验在全国推广。


    2017 年 12 月，巴西联邦最高法院启动 VICTOR 系统。系统旨在加速法院诉讼时间表中相同或相似案件的审理。系统会阅读案件相关材料，分析词语的语境并将案件按照联邦最高法院划定的类别进行分类，该系统将会大幅度提高法院工作效率。


    浙江省玉环市人民法院刑庭已将“政法一体化办案系统 e 助理”运用到审判执行的全流程中，自 2018 年 9 月系统使用以来，审判效率得到明显提升。系统利用“阿里飞狐”人工智能技术，将审判事务性工作从原有的人工操作升级为智能操作，通过软件机器人代替人力完成重复性的任务。


    2019 年 1 月 23 日，由上海市第二中级人民法院公开开庭审理的一起抢劫案件首次运用“刑事案件智能辅助办案系统”即“206 系统”辅助庭审，这也是全国法院首次运用“206
    系统”辅助庭审。“206 系统”的证据标准、证据规则指引功能可实现证据资料的智能审查，为办案人员提供标准化指引。


    2019 年 2 月，吉林省高级人民法院紧跟最高人民法院建成区块链吉林节点。2019 年 5 月 24 日，区块链吉林节点正式并入人民法院司法区块链，并开始将全省法院诉讼的电子卷宗、档案和流程节点信息等材料进行上链固定。吉林省高级人民法院利用区块链技术，在智能审执衔接流程中通过规划“智能审执衔接行为链”，串联起审判系统、电子法院、“12368”短信平台、执行系统以及司法区块链平台五大系统，保证可信司法公开、可信流程公开。


    2019 年 6 月 14 日，阿里巴巴达摩院发布了一项新研究：AI 进化到助理法官水平，可一秒“判案”。阿里巴巴推出的“AI 法官”针对交易纠纷类案件建立了整套审判知识图谱，能够迅速分析案情并在极短时间内向法官给出判案建议。


    2020 年 8 月山西省高级人民法院开始推广建设面向全山西所有法院的“智慧案管平台”，其拥有全省审判管理、审判监督、司法公开等重要功能。


    浙江省高级人民法院在确定镇海法院为人工智能辅助审判试点法院后，2020 年 9 月 16 日下午，法官利用人工智能程序“凤凰智审”，实现当庭智能生成判决、当庭宣判、当庭送达、当天一键归档。


    2021 年 4 月 6 日，印度最高法院宣布推出人工智能门户网站 SUPACE，旨在使司法服务提供机制更加透明、更有效率。


    2021 年 4 月 21 日，深圳市龙华区人民法院首次使用区块链证据核验平台，对案件证据进行当庭核验，实现知识产权民事案件的快速审理。


    加利福尼亚州洛杉矶县高等法院引入专门处理交通传票的人工智能 Gina，其可以说五种语言，每月可为 5000 多名当事人服务。


    加拿大引入最新电子谈判系统 Smartsettle 代替人工调解，当事人在系统中可以输入自己的策略以及价格底限，这一过程是不公开的，由系统采用人工智能算法并参考各方的竞标策略和优先事项推动双方进行谈判，提高谈判成功率。


    总部位于爱沙尼亚首都塔林的律师事务所 Eesti Oigusbüroo 通过聊天机器人提供免费法律援助，并生成简单的法律文件发送给收款机构。


    ### 三、执法应用

    2014 年，最高人民法院建立“总对总”网络查控系统，与公安部、民政部、自然资源部、交通运输部、央行、银保监会等 16 家单位和 3900 多家银行业金融机构联网，可以在系统上查询被执行人全国范围内的不动产、存款、金融理财产品、船舶、车辆、证券、网络资金等
    16 类 25 项信息。


    2014 年，洛杉矶警察启用实时监控系统 RACR，该系统能分析执法部门收集的隐蔽线索，实现执法信息共享。系统主要根据社交网络中的海量数据进行加工，可以迅速地从海量数据中锁定破案的关键线索。


    2015 年 7 月，芝麻信用和最高人民法院签署了对失信被执行人信用惩戒合作备忘录，开创第三方商业征信机构与法院联合开展信用惩戒的先例，借助云计算、机器学习等技术将被执行人失信信息纳入综合信用评价体系，可降低失信被执行人信用评分，并间接影响失信被执行人享受各类信用服务的权利。


    内蒙古自治区鄂尔多斯市公安局开发出无人机三维警力部署系统，在 2017 年《联合国防治荒漠化公约》第十三次缔约方大会上首次实战应用。其主要应用于隐蔽侦查、大型安保、反恐特战等业务。通过无人机三维警力部署系统可以实现对警力部署场所快速导入部署方案，开展警力部署。


    2017 年，迪拜警方引进机器人警官。这些机器人主要位于城市周围的旅游景点，能够执行有限的功能。人们可以利用其配备的触摸屏报告犯罪行为，其装备的摄像头可将实时图像传输回正在监控的操作室。这些机器人能够说六种不同的语言，这使得他们能够更好地与语言不通的游客进行交流。


    2017 年，英国警方引入危害评估风险工具 HART，旨在防止犯罪现象的发生，判断嫌疑犯再次犯法的风险，并将其分为低、中、高三个级别。


    2017 年，印度旁遮普警方的有组织犯罪控制部门使用旁遮普人工智能系统 PAIS 破获一起毒品交易案，PAIS 是一个使用人工智能辅助面部识别算法，可与国家警察维护的
    10 万多名犯罪记录的数据库相匹配。


    2018 年，全国首套人工智能执法系统在深圳启用，其采用人工智能技术进行智慧防疫检测。


    2019 年，在日本，专家正在研究开发一套新的交通系统，旨在通过应用人工智能技术分析数据来缓解城市交通拥堵。通过分析车流量数据，以及摄像头采集到的车辆位置等图像信息，人工智能系统将控制信号灯的切换以及时长等，从而缓解拥堵状况。


    2020 年，科大讯飞海南自贸港人工智能翻译服务中心运用智能语音机器人进行社区疫情排查和防疫宣传。


    2020 年，美国海关与边境保护局宣布将在美国和墨西哥的边境入境口岸之间埋设数千个地面传感器，借助人工智能，布置无人机和摄像头，对越境现象进行检查。


    2021 年，北京市顺义区发生局部聚集性疫情，人工智能技术团队绘出患者流调轨迹地图并帮助疾控人员迅速锁定管控范围。


    2021 年，日本警察厅决定引进通过人工智能技术解析嫌疑人在社交网站所使用的内容，并据此制作人物相关图的搜查系统。SNS 有时会被用作特殊诈骗等犯罪活动中许多涉案人员的“犯罪平台”，警察厅希望该系统能有助于弄清并查出包括幕后主使在内的犯罪组织全貌。


    不仅如此，根据美国政府问责局的数据，已有 16 个州允许联邦调查局使用面部识别技术将犯罪嫌疑人的面孔与其驾驶执照或身份证的照片进行对比。此外，至少有 1/4
    的州或地方的警察部门可以通过它们或其他机构的系统实现面部识别。使用面部识别技术可以更容易、更有效地抓捕犯罪分子，并让国家免受恐怖主义之害。


    在波士顿马拉松爆炸案中，大数据技术让警方得以快速分析 48 万多幅图像。这些图像即为非结构化数据。对嫌疑犯的详细描述使分析人员可以撰写代码和算法，对图像进行迅速分析，寻找异常情况和特定模式。从传感器信息中自动筛查犯罪行为令实时分析得以实现，其缩短了决策时间，减少了接触敏感数据的人员或系统的数量。


    美国联邦住房管理局利用大数据分析管理正向现金流基金，在房地产泡沫破裂期间，FHA 是唯一一家不需要救助的次贷保险机构。它运用大数据分析来助力预测违约率、偿还率和索赔率。另外，它还利用大数据技术为可能出现的场景构建现金流模型，以确定维持正向现金流所需的保费。


    ### 四、法律服务应用

    2015 年，全球首位人工智能律师 Ross 入职了美国最大的全球律师事务所之一——Baker & Hostetler，Ross 在这家公司的破产业务部门工作，负责协助处理企业破产相关事务。机器人律师
    Ross 可通过阅读各项法律法规、收集证据、做出推论，给出与证据高度相关的答案。拥有机器学习能力的它可以在查阅以往的法律案例和与人类进行的互动当中不断提升自己的答疑能力，使自身性能与准确率获得持续提升。这个学习系统还可以帮助人类律师更新他们的法律法规。


