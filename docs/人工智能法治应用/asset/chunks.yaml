    ### (2) 我国的数据安全标准


    我国正在开展大数据和大数据安全相关标准化工作的标准化组织，主要有国家标准化管理委员会（SAC）下属的全国信息技术标准化委员会（以下简称信标委，委员会编号为
    TC28）和全国信息安全标准化技术委员会（以下简称信安标委，委员会编号为 TC260）等。信标委主要负责制定和完善我国大数据领域标准体系，组织开展大数据相关技术和标准的研究，推动国际标准化活动，对口
    ISO/IEC JTC1 WG9 大数据工作组。信安标委主要负责制定和完善我国大数据安全领域标准体系，组织开展大数据安全相关技术和标准研究。


    为了加快推动我国大数据安全标准化工作，信安标委在 2016 年 4 月成立大数据安全标准特别工作组，主要负责制定和完善我国大数据安全领域标准体系，组织开展大数据安全相关技术和标准研究，已有多项建成和在报批阶段的标准（见表
    6-4）。


    **表 6-4　我国大数据安全标准（含起草报批）^((2))^((3))**


    ![](img/img10_p289_1.jpg)


    随着大数据应用场景越来越丰富，大数据安全问题越发重要。制度与技术作为大数据应用的双轮驱动核心，二者互为依托，大数据安全标准是技术的重要组成部分，亦是制度的有力支撑，在大数据整体市场中承担着规范各方行为主体的技术行为的职责。大数据安全与数据确权、隐私保护和开发共享密切相关，因此大数据安全标准的制定和更新应及时、有效地跟上大数据应用发展的步伐。


    从上述国内外相关标准化组织制定或拟制定的大数据安全标准来看，我国虽然在大数据安全标准方面起步较晚，但积极主动参与国际通用标准化建设，如《信息技术大数据参考架构第
    4 部分：安全与隐私保护》以及两项研究项目《大数据安全能力成熟度模型》《大数据安全实施指南》，均由我国专家主导。以信息技术为核心的全面布局表明以美国为代表的发达国家在大数据研发和应用的基础数据标准上具备深厚的“沉淀池”，其很早注意到政府公共部门、企业独立主体、行业领域专题、个人隐私保护等多方在数据安全保护和共享方面的差异性和衔接性。诸如
    WG9 在研的大数据术语和参考架构等国际标准和相关技术报告对我国的大数据标准有重要的指导和借鉴意义。作为后起之秀，我国相比外国建立了更为深入和广泛的大数据安全标准体系，包含大数据基础概念、数据共享交换、全周期技术管理、平台和工具、运维和评估、隐私安全、行业应用等七个要素。应通过与国际上其他标准化组织合作，快速进入国际标准化建设轨道，融合大数据应用产业的国际生态圈，推动我国大数据在多领域、多行业安全、高效发展。


    ## 第四节 人工智能社会治理和公共服务应用的协议许可


    人工智能的社会治理和公共服务应用需要通过许可协议机制来实现，开放许可协议是政府数据开放政策法规制定的重要环节。2015 年 1 月，万维网基金会发布的《开放数据晴雨表（第二版）》指出，要真正实现数据开放，必须在一个许可协议下，以可机读的形式发布，这是数据开放的基本条件。由此可知，许可协议是用于评估政府数据开放程度的重要指标，政府数据开放许可协议已成为国际组织和各国政府数据开放关注的重要课题之一，相关研究已在国际上引起了重视。


    政府数据往往成为著作权、数据库权等各种权利的客体，这使得使用者在利用数据时受到限制，甚至面临侵权风险，开放许可机制就成为解决这一问题的关键点。许可方式直接影响到数据利用与增值的范围和方式。开放政府许可协议通过授权的方式为开放政府数据的利用与开发提供法律制度保障与支持，它直接决定了开放数据能否实现其最终目的，即数据利用与增值。对于受到权利保护的政府数据，要通过许可协议授权公众使用，规范其利用行为，使公众能够对政府数据在最大范围内进行多元化应用。对不同类型、属性的数据实行不同的开放许可协议，一来有利于保护商业秘密数据，二来有利于实现涉及商业秘密数据的交易向特定人员的开放。


    2008 年发布的《经合组织委员会关于增强公共部门信息的访问和更有效的使用的建议》，强调开放许可协议的价值：最合适的开放许可协议能够促进公共部门数据利用和再利用的最大化；许可条款应该是非歧视的、非排他性的；除非必要，不应设置限制用户获取、使用、处理、分享信息的条件。2013
    年，《开放数据宪章》提到，政府部门应该使用开放许可或者其他相关措施，让信息使用没有任何限制、费用，无论用于商业领域还是非商业领域。2014 年，美国白宫科学与技术办公室（OSTP）开展主题为开放政府数据许可协议的讨论。2018
    年，美国国会正式通过《开放政府数据法案》。


    国际上开放许可有多种形式。英国政府许可框架（UKGLF）提出了三种开放政府协议：第一种是在商业与非商业使用和再利用情况下的开放政府许可协议。第二种是仅限于非商业目的的非商业性政府许可协议。这两种协议都允许公众免费复制、发布、传播、修改信息，甚至进一步挖掘数据中蕴藏的商业或非商业价值。第三种是对数据再利用收取费用的收费许可协议，依此协议，公众在付费后可以排他性地使用特定数据。


    ### 一、国际组织制定的许可协议


    许可是准许组织机构或个人再利用受到著作权或数据库权等保护的信息和资料的一种机制，它明确了利用者和再利用者被准许做什么和受到哪些权限限制。国际组织制定的开放数据许可协议的类型主要包括两种：知识共享许可协议（CC
    协议）和开放数据共用许可协议。


    其中，知识共享许可协议是知识共享（Creative Commons，CC）组织发布的许可，适用于创作内容，例如照片、文本、数据等对象。知识共享许可协议主要包含六个基本类型：署名（CC-BY）；署名—相同方式共享（CC-BY-SA）；署名—禁止演绎（CC-BY-ND）；署名—非商业性使用（CC-BY-NC）；署名—非商业性使用—相同方式共享（CC-BY-NC-SA）；署名—非商业性使用—禁止演绎（CC-BY-NC-ND）。


    此外，知识共享组织还提出公共领域许可协议（CCO）、公共领域许可（Public Domain）、附加许可协议（CC+）。有关知识共享许可协议的类型以及对应的许可内容见表
    6-5。


