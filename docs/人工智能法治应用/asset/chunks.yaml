    上海大学法学院龚思涵参与第二章第一节至第二节、第三章、第四章第一节至第三节的资料整理和撰写。


    上海社会科学院法学研究所张宸、薛子寒参与第六章、第七章和余论部分的资料整理和撰写。


    需要说明的是，由于人工智能法学是一门新兴的学科，尚无可学习借鉴的教材样本，参与编写的人员知识有限，错误难以避免，恳请各位专家和读者批评指正！


