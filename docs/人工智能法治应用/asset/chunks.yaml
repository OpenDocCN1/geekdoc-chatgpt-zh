    (64)　中国人工智能产业发展联盟：《人工智能助力新冠疫情防控调研报告》，2020 年 3 月。

    (65)　崔亚东：《人工智能与司法现代化》，上海人民出版社 2019 年版，第 31 页。

    (66)　根据世界知识产权组织有关报告，2019 年我国申请人工智能专利的数量位居世界前列，与美国、日本合计占全球总量的 78%。

    (67)　例如，《网络安全法》《数据安全法》《个人信息保护法》等。此外，国内不少地方正在积极探索有关人脸识别方面的地方立法。

    (68)　参见王成：《人工智能法律规制的正当性、进路与原则》，《江西社会科学》2019 年第 2 期。

    (69)　季冬梅：《人工智能透明性原则的制度构建：范式选择与要素分析》，《科学学研究》，https://doi.org/10.16192/j.cnki.1003-2053.20210603.001。

    (70)　周辉等：《人工智能治理：场景、原则与规则》，中国社会科学出版社 2021 年版，第 28 页。

    (71)　欧盟委员会：《可信赖人工智能伦理指南》（可信赖人工智能伦理指南），https://digital-strategy.ec.europa.eu/en/library/ethics-guidelines-trustworthy-ai，2021
    年 6 月 30 日访问。

    (72)　周辉等：《人工智能治理：场景、原则与规则》，中国社会科学出版社 2021 年版，第 33 页。

    (73)　具体原则包含七个方面：一是公平分配数据以避免对弱势群体过分不利；二是从数据和先进建模技术的使用中创造尽可能大的利益；三是参与数据实践，鼓励有利于人类繁荣、人类尊严和人类自主的实践；四是重视对受数据应用影响的人和社会进行深思熟虑的判断，并且这种判断与受影响的人和社区的价值观和伦理原则保持一致；五是作出的决定不应对个人造成可预见的伤害，或者当在必要时为了更大利益，至少应尽量减少这种伤害；六是允许用户保持对使用中的数据、数据应用的场景以及修改数据和场景能力的控制；七是确保人工智能系统的功能核心是用户的整体福祉。


    # 分论


    ## 第三章 人工智能的立法应用


    ### 本章摘要

    立法是法治的核心环节。利用人工智能大数据等新兴技术手段来辅助立法，有助于提高立法工作的效能，但目前人工智能的立法应用在广度和深度上仍然存在局限。本章以人工智能立法的具体环节为索引，对人工智能辅助立法的技术支撑和具体应用进行了系统介绍，并全景式地展现了人工智能立法目前的进展、挑战与未来趋势。


    ### 第一节 人工智能立法应用的理论基础

    根据《立法法》的相关规定，在立法的过程中，必须高度重视立法公开、立法参与、立法听证、立法调研、立法论证，以保证立法的有效性、针对性和可操作性。传统的立法实践环节要求采取座谈会、论证会、听证会等多种形式听取意见和建议，以及通过基层立法联系点、网上民意调查等方式开展立法调研。科学化的立法方式在过去很长一段时间内发挥了极其重要的作用，也形成一系列有益的做法与成功的经验。但不可忽视的是，立法调研的机制和成效仍有待完善之处。例如立法调研的范围存在局限性、立法评估的结果现实性不强、立法梳理较为烦琐等。


