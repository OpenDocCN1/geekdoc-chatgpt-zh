    \n[(6)](#postscript1.xhtml#jzyy_01_1015)　郭旨龙：《中国刑法何以预防人工智能犯罪》，《当代法学》2020年第2期。\n\
    \n[(7)](#postscript1.xhtml#jzyy_01_1016)　魏东：《人工智能算法安全犯罪观及其规范刑法学展开》，《政法论丛》2020年第3期。\n\
