    ## 美国


    在 2009 年 5 月，总务管理局（General Services Administration）正式上线联邦政府数据的开源网站 Data.gov，至今已经披露超过
    20 万个来自各联邦机构、州、县以及城市的数据集供公众、学生、教师以及商业机构进行使用。在 2019 年 1 月，美国《开放政府数据法》（The Open
    Government Data Act）出台，将 Data.gov 网站的政府数据披露正式规定于法律，并规定了标准化的、可被机器读取的数据格式。该法还规定美国总务管理局与美国预算管理办公室（Office
    of Management and Budget）以及美国政府信息服务办公室（Office of Government Information Services）共同负责政府公共数据信息的披露以及治理。该法要求各联邦机构任命一位雇员为“首席数据官”，负责数据的治理、不同机构间的数据协作、向国会提交年度报告等事宜。此外，在美国预算管理办公室中设立“首席数据官委员会”，其成员由各联邦机构首席数据官、电子政务办公室、首席信息官等组成，负责政府数据的公开和治理事宜。


    对于政府公共数据以外的公共数据，美国并没有通过统一的部门进行管理以及治理，而是在联邦层面采取各部门分别治理的形式，对涉及侵犯公民隐私、数据安全实践、欺诈交易的行为进行监管和处罚。其中，由于联邦贸易委员会（Federal
    Trade Commission）的权力较为广泛，对于大多数商业实体具有司法权，因此其在数据隐私及安全问题上通常作为联邦层面的专门机构对公共数据保护及治理事宜定下基调，其他部门及机构在各自管辖领域内参照
    FTC 的标准和指引进行更严格的细分管辖。美国的其他联邦层面公共数据专门机构包括美国财政部下的通货监管办公室（Office of the Comptroller
    of the Currency）、联邦通讯委员会（Federal Communications Commission）、证券交易委员会（Securities
    and Exchange Commission）、卫生与公众服务部（Department of Health and Human Services）、消费者金融保护局（Consumer
    Financial Protection Bureau）等。在国家和联邦层面以外，各州政府也相继出台新的公共数据治理法案并设立专门机构进行监管。


    《医疗电子交换法》（Health Insurance Portability and Accountability Act，HIPPA）规定本法效力范围内的实体机构需要任命一位
    HIPAA 安全负责人，负责电子医疗信息的信息安全保护事宜。美国马萨诸塞州和其他部分州的监管体系中也出了要求企业任命一位或多位负责企业信息安全的员工的规定。


    ## (2) 澳大利亚


    澳大利亚的公共数据治理专门机构为国家数据委员办公室（Office of the National Data Commissioner），隶属于澳大利亚总理内阁部门（Department
    of the Prime Minster and Cabinet），但最新的《数据公开和透明法》（Data Availability and Transparency
    Act）将国家数据委员办公室设置为独立的机构，该机构负责公共数据公开的所有事宜。国家数据委员办公室由一位国家数据委员（National Data Commissioner）以及国家数据咨询委员会组成。国家数据委员负责与国家信息委员（Information
    Commissioner）、隐私委员（Privacy Commissioner）以及其他数据相关机构合作，共同推进公共数据的开放以及高效、安全使用。国家数据咨询委员会由政府人员、商业人士、学术机构人士以及社区利益代表人士等组成，负责在数据使用伦理、行业发展、国际协作、技术实施等事宜为国家数据委员办公室提供咨询意见。其他涉及公共数据治理的重要机构还包括信息委员会办公室（Office
    of the National Data Commissioner），负责监管执行隐私法（Privacy Act）、自由信息法（Freedom of Information
    Act）及其他法律所涉及的隐私保护、政府信息披露、信息及数据公开的政策等事宜。


    ## (3) 韩国


    2013 年 12 月，韩国设立开放数据战略委员会（Open Data Strategy Council，ODSC），该委员会是韩国开放数据领域最高决策制定部门，负责审核、协调有关公共数据的重大政策和规划，并对这些政策和规划的执行情况进行评估。该部门人员由公共部门和非公共部门（社会组织、学术机构等）组成。内政部（Ministry
    of the Interior）为开放数据战略委员会提供资金，并负责开放数据的总体规划、检查、基础设施构建，以及开放数据目录的发布。此外，韩国各个公共部门设立公共数据供给专员（Office
    in Charge of Providing Public Data）职务，负责公共数据提供的相关事宜。


    韩国在 2011 年 3 月出台了《个人信息保护法》，并在同年 9 月设立了个人信息保护委员会（Personal Information Protection
    Commission），委员会在总统的直接管辖下负责《个人信息保护法》的推进工作，其行政地位低于总统但高于各韩国各部委，直接负责韩国公民个人数据安全，其职责包括制定、修改、执行个人数据保护相关法律及行政措施及进行数据保护领域的国际合作事宜，在数据保护违法事件中还具有调解功能。委员会成员数量不超过
    15 人，由总统直接任命，成员包括国会选举的 5 名成员和韩国大法院推选的 5 名成员。其下设有负责在数据保护领域统筹协调各部门合作与国际协作的计划管理部，负责数据安全相关法律司法解释及相关案件审查的审查部，负责数据保护领域法案、政策评估的法案评估部，负责调查监管公共和私人领域数据安全违法行为的调查部，以及负责调解的纠纷调解部。


    ## (4) 英国


    英国的数据治理相关机构由内阁办公室及政府数字服务局、数据战略委员会、信息专员办公室、信息专员、数字文化传媒体育部、国家档案馆、政府通信总部、国家网络安全中心、司法部以及政府法律部构成。由于英国是全球范围开展包括个人隐私保护、数据安全保护、政府数据公开等数据治理事宜最早的国家之一，其数据治理的专门机构已经经历多次的改革和迭代，形成多部门各司其职、职责边界明确、共同推进数据开放及治理的组织架构。在公共数据公开方面，内阁办公室以及其下属的政府数字服务局处于核心领导协调地位，负责数据治理政策的有效制定、协调和实施，推动政府数据的发布以及政府部门间数据的管理和使用。政府数字服务局还整合原商业、能源和工业战略部下的数据战略委员会，因此也具有保证公共部门制作高质量及数据可信赖，促进公共部门公开数据与企业有效互动提升数据效益等职能。除公共数据公开方面外，信息专员办公室及信息专员负责数据的隐私保护事宜，政府通信总部和国家网络安全中心负责数据安全及数据基础设施建设管理事宜，司法部及政府法律部负责《信息自由法》《数据保护法》等相关法律的司法解释和政策制定事宜。


    ## (5) 日本


    日本的公共数据治理专门机构为隶属内阁秘书处的开放政府数据委员会（Committee of Open Government Data）以及总务省资助的开放数据促进会（Open
    Data Promotion Consortium）。开放政府数据委员会由公共部门和私营部门的成员组成，负责开放数据政策的执行和跟踪审查。委员会下设数据工作小组和规则工作小组，成员来自政府、学界以及各行各业。开放数据促进会主要负责公共数据开放的数据标准、数据格式指引的制定，旨在促进行业、政府及学术界对公开数据的使用效率。促进会的主要职能为构建融合医疗、农业、行政等不同领域数据的信息合作平台，提供新的数据利用服务及各种数据应用服务。在数据隐私保护方面，日本设立个人信息保护委员会（Personal
    Information Protection Commission），其具有制定推动基本政策、监管、纠纷调解、特别个人信息保护评估（主要指公民身份证信息相关事宜）、公共关系、国际合作、个人信息保护机构管理和汇报国会八大职能。个人信息保护委员会是日本法律系统内最高级别的独立机构之一，其有权对企业进行审计或发出禁止令，但无权进行行政处罚。


    ## (6) 新加坡


    新加坡于 2011 年上线政府数据公开平台 Data.gov.sg，公开了 70 个公众机构所提供的包括经济、教育、环境、金融、健康、基础设施、社会、科技和交通等领域的可公开数据集，网站由财政部（Ministry
    of Finance）发起，并由政府技术局（Government Technology Agency of Singapore）运营管理。


    新加坡在 2013 年 1 月 2 日成立个人数据保护委员会（Personal Data Protection Commission），负责执行新加坡 2012
    年出台的《个人数据保护法》（Personal Data Protection Act）。委员会出台多种总体数据保护指引和细分行业数据保护指引。在 2019
    年 3 月 31 日，新加坡政府设立公共领域数据安全审查委员会，负责涉及公共领域的数据治理事宜，其成员由贸易与工业部、交通部、通信部等负责人组成。公共领域数据安全审查委员会负责公共数据的数据安全标准及监管事宜。


    ## 2. 层次多元的安全标准指引


    数据安全标准在保障公共数据安全、推动行业健康有序发展的过程中发挥着引领和支撑作用，完善的数据安全标准能够有效提升数据安全保护能力，助力数字经济高质量发展。针对敏感数据泄漏、访问权限混乱、隐私信息滥用等现实性数据问题，应加强数据防护措施，为此，国内外相关标准化组织均制定了数据标准，旨在规范大数据应用，切实保障大数据安全。


    ### (1) 数据安全的国际标准


    世界范围多个标准化组织正在实施大数据安全的数据标准化，主要有国际标准化组织/国际电工委员会的第一联合技术委员会（ISO/IEC JTC1）下属的大数据工作组（WG9）和安全技术分委员会（SC27）、国际电信联盟电信标准化部门（ITU-T）、美国国家标准与技术研究院（NIST）等（见表
    6-3）。


    ISO/IEC JTC1 是一个信息技术领域的国际标准化委员会，由 17 个分委员会（SC）和 2 个报告小组组成，各设有秘书处。这 17 个分委员会分别处于不同的
    12 个技术领域。JTC1 改革后的工作范围限于信息技术的国际标准化。信息技术包括系统和工具的规范、设计和开发，涉及信息的采集、表示、处理、安全、传送、交换、显示、管理、组织、存储和检索等内容。JTC1
    的成员类型分为 3 种：参加成员（P-MEMBER）、观察成员（O-MEMBER）和联络成员。目前，JTC1 有 27 个积极成员（澳大利亚、比利时、巴西、加拿大、中国、捷克、丹麦、埃及、芬兰、法国、德国、匈牙利、爱尔兰、意大利、日本、韩国、荷兰、新西兰、挪威、葡萄牙、罗马尼亚、南非、斯洛文尼亚、瑞典、瑞士、英国和美国）、38
    个成员、16 个内部联络成员（指 ISO 和 IEC 范围内的技术委员会）以及 22 个外部联络成员（其他组织或机构）。


    ITU-T 是国际电信联盟管理下的专门制定远程通信相关国际标准的组织。由 ITU-T 指定的国际标准通常被称为建议书（Recommendations），ITU-T
    的各种建议书的类型由一个首字母来代表，称为系列，每个系列的建议书除了代表类型的字母以外还有一个编号，例如“V.90”等。


    NIST 于 2012 年 6 月启动关于大数据相关基本概念、技术和标准需求的研究，2013 年 5 月成立 NIST 大数据公共工作组（NBG-PWG），该工作组对所有感兴趣的相关方开放，无会员费，旨在通过结合行业、学术和政府等各方力量加速对大数据这一新兴产业的采纳，其成果由
    NIST 评审和发布。


