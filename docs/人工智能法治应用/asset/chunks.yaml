- raw: "将人工智能司法应用运用于司法裁判可能对既有的诉讼结构造成冲击，尤其可能使得公权力机关的力量大幅提升。为平衡控审辩三方，特别是在刑事诉讼和行政诉讼中，应当对当事人的诉讼权利予以补强，从而实现诉讼结构的重新稳定。\n\
    \n首先，应当强化诉讼中的信息开示制度。有学者建议将刑事诉讼中的阅卷权改造为“数据访问权”。[^((45))](#chapter5.xhtml#jz_01_0990)以刑事诉讼和行政诉讼中的阅卷权制度[^((46))](#chapter5.xhtml#jz_01_0991)为例，基于平衡控辩双方力量的理念，法律要求控审方向辩方单向开示信息，允许辩方查阅、摘抄、复制证据材料和诉讼文书这两类案卷材料。然而随着人工智能技术的运用，公权力机关运用人工智能技术抓取的数据范围将远远超越传统意义上的证据材料和诉讼文书的范围，使得辩方的阅卷权出现“盲区”，从而影响阅卷权目的的实现。在此种情形下，有专家建议将传统的阅卷权改造为“数据访问权”，即数据主体可以从数据控制者处确认其个人数据是否正被处理，并行使访问个人数据及获得相关信息的权利。[^((47))](#chapter5.xhtml#jz_01_0992)如此，一方面可明确该权利的主体即为被追诉之人，而辩护人是协助其行使此项权利之人，从而解决阅卷权制度下权利主体不明的问题，另一方面基于数据访问权主动行使的特征，可避免重蹈传统阅卷权制度下要求法院、检察院批准导致的阅卷难的覆辙。可通过设置时间和特殊情形的限制避免此种权利的滥用。\n\
    \n其次，应对数据鸿沟问题给予关注，并根据实际情况为当事人提供专业人士的帮助。人工智能技术是近年来的新兴技术，而对将该技术适用于司法活动所带来的诉讼变革，当事人本人或其辩护人、诉讼代理人仅依靠其自身能力是难以有效应对的，特别是当检察机关、审判机关或行政机关等公权力机关运用人工智能技术获得大量与诉讼相关的数据后，很可能有意或无意地向当事人进行“文件倾倒”。公权力机关看似完成了信息开示，实际上则陷当事人于海量数据的侵害。此外，老年人等社会弱势群体接受新事物的能力较弱，需要进一步推动解决这类当事人在运用智能技术方面遇到的困难，坚持传统方式与智能化创新并行，为所有当事人提供更平等、更便利的诉讼服务。\n\
    \n最后，应当赋予当事人在个人信息保护方面的权利。科技时代的国家成为个人信息最大的收集者、处理者、存储者和利用者，隐私权保护走向个人信息保护成为必然的社会和法治变迁方向。司法活动中引入的人工智能技术，强化了国家通过诉讼收集使用个人信息的能力，使得作为信息主体的当事人行使信息权利保护其个人信息安全的需求更为迫切。我国的《数据安全法》《个人信息保护法》，以及欧盟的《通用数据保护条例》都旨在赋予公民相关个人信息权利，即是对此种需求的应对。在人工智能司法应用推广的大趋势下，国家需要为当事人面临的诉讼中人工智能技术的运用导致的信息失控风险提供充分且有效的救济途径。\n\
    \n##### （三）适度控制司法活动与技术产业的合作边界\n\n司法是维护社会公平正义的最后一道防线。当前，人工智能技术赋能司法的主要路径往往是司法机关寻求并借助科技企业的帮助并将新技术应用到司法活动中。但应当注意的是，企业以盈利为目的，司法机关在与其合作的过程中需要避免其以有意识或无意识地将观念、利益诉求等“注入”智能化工具的方式影响司法活动，进而威胁司法独立原则，甚至影响法院独立行使审判权和检察院独立行使检察权。有鉴于此，需在司法与产业之间划定合理边界，使二者间保持既足以合作又不至于互相干预的合理距离。具体如下：\n\
    \n其一，辨分相互之间的利益。如前所述，企业逐利是其本能，这是资本固有的天性。相比之下，司法所追求的主要是案件得到公平公正的处理，与企业以利益为目的存在巨大区别。只有将法院与企业之间的不同利益提前分离，才能保证二者不致混同，从而保障司法活动的独立运行，实现司法公平正义。此种利益的分离首先即是要确保人工智能技术引入司法活动中的科技招标采购环节的廉洁性。应以透明公开的招标采购程序、严格的审计审查和惩戒措施防止企业对经济利益的不当追求对法院工作人员造成侵蚀，导致二者利益的混同，甚至导致贪贿行为的出现。[^((48))](#chapter5.xhtml#jz_01_0993)\n\
    \n其二，将内外部人员适当分离。法院缺少运用人工智能技术所需的专业技术人员，因此在技术的运用、培训、维护、修缮等方面往往要借助来自外部技术企业的人力资源，例如上海市高院在开发“206系统”的过程中选择与科大讯飞公司合作，后者派出大量技术人员参与研发；浙江省高院则与阿里巴巴集团合作打造智慧法院。可以说，法院借用科技企业的专业技术人员无可厚非，也符合中央关于司法辅助业务外包的改革思路。然而有学者提出为防止这些人员与法官“过从甚密”，进而干预司法，应当在二者之间设置障碍以划定其交往界限。[^((49))](#chapter5.xhtml#jz_01_0994)具体而言，对来自企业的技术人员的借用，应如同“206系统”一般，通过法院的信息技术保障部门进行，审判部门或法官寻求此类专业人员的帮助时应接受有关部门的统一安排，不宜由审判部门或法官个人直接接触这些人员。如此一来，可以在法官和来自企业的专业技术人员之间形成必要的阻断，防止科技企业利用其人员与法官因将人工智能技术引入司法裁判而产生的交往进行利益输送或观念灌输，进而影响案件的公正办理。\n\
    \n其三，角色与权限的提前界定。现阶段，人工智能司法应用“不是要替代司法人员独立判断”，而是要“帮助司法人员依法、全面、规范收集和审查证据，统一司法尺度，保障司法公正”。[^((50))](#chapter5.xhtml#jz_01_0995)因此，科技企业在与法院展开人工智能司法应用合作时也应以此为要求。以法院系统为例，为保障法官在案件办理中的独立判断和权威，特别是其独立审判权，应制定企业将人工智能技术运用于司法裁判的行为规则，明确科技企业的辅助角色。[^((51))](#chapter5.xhtml#jz_01_0996)具体而言，科技企业的作用应限于对人工智能产品的开发、维护、更新等技术层面上，而在司法人工智能产品的设计目标、应用要求等方面应当由法院主导，这也是目前多地智慧法院的建设思路。在产品开发设计的过程中，要十分警惕科技企业将其利益、观念等，特别是针对特殊人群如妇女、儿童、少数族裔、同性恋群体等的歧视性偏见，利用程序、算法等加入人工智能工具之中，从而在智能化工具的运用中实际地影响案件的公正办理。此外，更要严禁科技企业通过开发和设计带有倾向性的人工智能产品干预具体个案或某类案件（例如涉及科技企业的知识产权纠纷案件）的办理，防止其利用人工智能技术在司法裁判中的运用谋取私利。[^((52))](#chapter5.xhtml#jz_01_0997)\n\
    \n## 第五节  \n\n人工智能司法应用的发展趋势\n\n### 一、诉讼服务体系智能转型\n\n马克思和恩格斯说过：“一切划时代的体系的真正的内容都是由于产生这些体系的那个时期的需要而形成起来的。”[^((53))](#chapter5.xhtml#jz_01_0998)人民群众在司法个案中的公平正义获得感，除体现在与其利益息息相关的裁判结果外，最直观的莫过于在诉讼过程中接受诉讼服务时的切身感受。\n\
    \n##### （一）“一站式”服务理念\n\n2019年7月31日，最高人民法院发布《关于建设一站式多元解纷机制 一站式诉讼服务中心的意见》，要求实现“一站式多元解纷、一站式诉讼服务”，为现代化诉讼服务体系建设确定了新的方向。\n\
    \n以上海法院智慧诉讼服务平台为例，平台对所有的对外服务事项集中办理，通过和服务大厅、12368热线、司法公开等平台的互联互通，为当事人提供全方位、多层次的诉讼服务，建立由用户层、应用层、微服务层、治理层、基础设施层五个部分组成的数据交换标准体系并可通过数据交换平台实现与法院业务系统的数据互联互通，实现信息资源全面共享。在技术架构上，按照为服务实现能力与业务的关联，对系统中的诉讼服务、送达服务、文书辅助服务、卷宗查询服务、光学字符抓取、电子签章等应用服务进行拆分，并通过服务治理层实现管理。治理层通过API网关、调用跟踪、崩溃熔断、负载均衡等，全方位对应用服务进行治理。基础设施层作为系统运行的基础，采用Artery\
    \ Docker容器云平台，是一套集部署、管理、调度、运维于一体的系统。未来，在人工智能和大数据技术的加持下，“一站式”服务将继续得到升级与完善。\n\n\
    ##### （二）线上线下集成\n\n利用现代科技，实现线下诉讼服务集成到线上，极大地扩展了诉讼服务的制度内涵和覆盖范围。在各地法院尚“各自为政”的时代，诉讼服务质量、效率和效果的提高受到严重制约，不仅不同地区法院之间在诉讼服务上难以形成“一盘棋”，而且法院与党政机关、社会组织之间也不能形成通畅的纠纷化解工作体系。随着人工智能、大数据、云计算、5G等科技的发展，以及光缆、电缆、基站等基础设施的完善，法院大力打造的以中国移动微法院、调解平台等十大诉讼服务平台为支撑的一站式建设总体框架基本成型。对当事人来说，不仅异地立案、视频调解、网上开庭等已经成为现实，而且其将可以享受“只进一个门、最多跑一次、可以不用跑”的纠纷化解服务。这不仅在过去不敢设想，在世界范围也别无分店。可以预见，随着法院诉讼服务潜能的进一步发掘，法律职业分工甚至法学教育的内容都可能发生微妙的转变。\n\
    \n### 二、司法审判活动场景化智能变革\n\n习近平总书记在党的十九大报告中指出“中国特色社会主义进入了新时代”，强调要“提高社会治理社会化、法治化、智能化、专业化水平”。全国法院借助人工智能发展的最新科技成果，努力破解深化司法改革进程中遇到的突出问题，提升了审判质效。司法审判活动中长期存在的案多人少，线上庭审体验不佳，当事人参加庭审存在时空难度等问题，将在人工智能等技术的赋能下发生巨大变化。\n\
    \n##### （一）全流程多场景的线上诉讼服务\n\n传统模式下的庭审，原则上要求诉讼参与人全体参与其中，然而由于时空的限制往往无法实现，通过人工智能技术、云储存、5G技术对审判活动进行场景化的智能变革，能够达成全流程多场景的线上诉讼服务；利用证据提交、证据交换、询问、调解等多用途、多场景、全流程地发送重要诉讼活动，可使跨地域间的诉讼参与人也能正常参与其中。在诉讼过程中，通过智慧审判系统的图文识别、自然语言理解、司法要素抽取等人工智能功能，能够实现机器识别证据、理解证据、分析证据，进而辅助法官归纳争议焦点、检验审查证据、采信证据、认定事实、适用法律。上海市高级人民法院推动的基于电子卷宗“单套制”的网上办案，可为智能辅助审判、提高审判质效提供基础保障。\n\
    \n##### （二）诉讼活动从线下到线上、到云端\n\n通过5G高速传输，使用智慧庭审系统开庭甚至能够清晰、无延迟地观察到诉讼参与人的微动作，极大地提升线上开庭的“真实感”与“仪式感”。将所有的在线诉讼活动直接上传“云端”，可保证完整诉讼过程全程留痕、全程高清、全程可溯、全程监管。而在卷宗线下到线上、线上到云端的流转过程中，通过法院案件信息防篡改系统，基于分布式对等网络模型，利用电子数据扫描、PBFT共识机制、区块链分布式存储技术、多线程技术、非对称加密技术、平行链管理及联盟链架构等先进技术的集成，可实现智慧审判系统电子证据及卷宗的防篡改、流转真实可信。向防篡改系统写入数据的事务请求时需附有发起方私钥签名，该签名随事务请求在网络参与节点间广播并得到验证，因此事务请求是不可伪造和防篡改的。同时，块链式数据结构进一步防止了篡改。\n\
    \n### 三、司法审判体系智能升级\n\n人工智能司法应用助力司法审判体系的智能升级，为我国法院业务提质增效带来重大机遇，但人民群众日益多元化的需求和广大干警日趋迫切的提质增效需求也向智慧法院建设提出了更高要求。为进一步推进人工智能与司法审判的深度融合，解决全国各区域、各级别法院人工智能司法应用发展的不平衡、不充分，信息共享的不充分，降低建设成本，提升数据资源使用，加快集约化建设与实际应用，今后司法审判体系可从以下方面进行架构完善与升级。\n\
    \n##### （一）继续深化人工智能应用，提升智能化水平\n\n当前人工智能司法应用主要作用于法院审判质效的提升，但应用的智能化水平还有提升的空间，迫切需要利用司法认知智能技术进一步提升审判能力现代化，真正做到应用全面标准化、规范化、智能化，实现减负增效。全面深化全业务网上办理、全流程依法公开、全方位智能服务，通过进一步集成、升级、普及和深化应用，建立完善的人工智能司法应用体系，促进法院智慧建设与业务的深度融合，实现知识驱动、智能辅助，能力支撑、全面赋能，云网一体、集约高效，中台架构、创新业态，质效运维、安全可靠，规则引领、规范有序，打造集数字化、智能化、人文化于一体的新时代智慧法院，实现业务支撑深度、广度的跨越式提升。需充分把握“十四五规划”战略机遇，坚持统筹推进与重点实施相结合、坚持法官需求与机制保障相结合、坚持司法人工智能业务一体化的科学布局，顺应新一轮科技革命浪潮的必然选择，提升司法公信力与人民群众获得感，深化人民法院司法改革的重要支撑。\n\
    \n##### （二）统一技术标准，加强集约化建设\n\n加强全国法院顶层设计、做好统筹工作，制定统一技术管理标准，从数据一体化、技术一体化、服务一体化，三个一体化角度不断提升和推进。从一体化的角度进行信息汇集，包括数据资产的汇集和管理与业务智慧成果的汇集和管理。通过数据治理、感知计算等手段，对数据资产、业务智慧等多元数据进行融合和关联。同时，通过法律知识图谱的构建和自然语言理解、机器学习技术、法律认知技术的运用，实现法律概念的理解，构建法律认知引擎、数据分析模型和知识服务工具。打造一体化的知识中心，实现对法官办案的智能辅助支持，包括知识推送、知识检索、智能研判等。同时打通个案数据、用户行为数据和外部数据的采集，形成数据循环。以劳争案件为例，可通过打通与劳动仲裁、社会保险的数据壁垒、实现业务联动，提升法官的办案效率。\n\
    \n### 四、司法服务管理智能更新\n\n司法审判工作关系到人民群众的操心事、烦心事，是群众的“大事”。[^((54))](#chapter5.xhtml#jz_01_0999)司法工作人员一生可能会经手成百上千个案子，但对于每一个案子的当事人来说，司法人员的每一次审判都有可能影响他的生活，甚至改变他的人生。因此，作为维护社会公平正义的最后一道防线，司法机关能否让人民群众在每一起司法案件中都能感受到公平正义，既取决于司法工作人员的专业技能水平，同时也取决于司法机关的纪律作风和工作态度。而信息技术的升级也为司法服务内部管理带来了新方法和新思路。\n\
    \n从功能来看，人工智能等新科技主要在检查监督、质量评估、管理保障等方面发挥作用。在检查监督方面，大数据分析、视频图像识别、语义分析等技术的不断发展为实现审判执行办案过程的全程可视、全程留痕、全程监督提供了有力帮助。例如，北京市第四中级人民法院自主研发的法院视频巡查系统就是对接监控网络及数字法庭的多维度视频行为识别软件系统，其下包括庭审视频巡查、诉服视频巡查和办公智能巡查三个子系统，巡查范围涵盖全部数字法庭、调解室、谈话室、立案大厅等公共空间，可实现对法院全部公共区域的无死角、全覆盖监控分析。该系统利用大数据和人工智能实现监督管理工作由被动抽查到向全域、全员、全过程主动实时监控管理的转型，是人民法院纪检监察工作发展中审务督察工作与现代技术手段深度融合的典型范例。\n\
    \n人工智能司法相关应用也能为司法的可监督性、可问责性制度体系的全面更新与优化提供保障，使该制度能够更加有效地制约司法、引领司法，为公正、廉洁司法提供坚强保障。例如，浙江法院基于智能化管理体制和模式，专门设置适用于人民法庭的审判执行质量和效率评估体系。该体系可以综合评估体系中的各项指标和要求，形成有效的“评估数据”，据此对各个法庭的公正性、效率性等诸多表现进行动态排序，实现实时监督。各种数据系统不仅能使外在监督更加全面客观，同时也能使司法机构内部监督形成常规机制，在此机制下，法官、法庭和法院可以随时进行自我评估，还可以互相评估和互相监督，达到共同学习、共同进步，提升整体司法水平的目的。\n\
    \n除了对司法过程的监督检查、对工作人员司法公务行为的严格约束，新科技也在内部管理自动化、工作保障信息化等方面提供了新的开展路径。例如，全国检察机关队伍管理系统采用统一研发、两级部署、四级应用的模式，[^((55))](#chapter5.xhtml#jz_01_1000)该模式包括“一库、一平台、两体系、十一系统”的全方位队伍建设信息化项目，支持对全国检察人员在进入、岗位、任免、培训等方面的全生命周期管理。在保障辅助方面，烟台市莱山区检察院研发了车辆智能管理子系统，配置了“车钥匙智能卡柜”，通过连接“莱检通”、执法执勤车辆使用管理权限和网络，实现刷卡用车、车辆出入射频扫描登记、周末公车封存等功能，保证执法执勤车辆的实时监控。\n\
    \n未来，利用现代化科技技术手段促进司法工作人员依法规范履职、加强内部监督管理、维护司法机关清正廉洁的司法形象，逐渐成为新科技时代背景下司法服务管理革新和发展的方向，司法服务管理也将继续朝着与互联网、大数据、人工智能等现代科学技术深度融合，司法机关内部信息化建设转型升级，司法管理全方位、高层次智能化的目标迈进。\n\
    \n**课后习题：**\n\n（简答题）\n\n1．尝试梳理当前人工智能司法应用的核心功能。\n\n2．简述人工智能司法应用对于实现公平正义的价值。\n\n\
    3．简述人工智能司法应用的风险与不足。\n\n（思考题）\n\n你认为人工智能司法应用是否能够取代人类法官？未来这类应用将有哪些发展，又会给司法活动带来怎样的变革？\n\
    \n* * *\n\n[(1)](#chapter5.xhtml#jzyy_01_0946)　张文显、孙妍：《中国特色社会主义司法理论体系初论》，《法制与社会发展》2012年第6期。\n\
    \n[(2)](#chapter5.xhtml#jzyy_01_0947)　季卫东：《人工智能时代的司法权之变》，《东方法学》2018年第1期；左卫民：《关于法律人工智能在中国运用前景的若干思考》，《清华法学》2018年第2期；李本：《美国司法实践中的人工智能：问题与挑战》，《中国法律评论》2018年第2期；左卫民：《热与冷：中国法律人工智能的再思考》，《环球法律评论》2019第2期。\n\
    \n[(3)](#chapter5.xhtml#jzyy_01_0948)　《最高人民法院关于深化人民法院司法体制综合配套改革的意见——人民法院第五个五年改革纲要（2019—2023）》（法发〔2019〕8号）。\n\
    \n[(4)](#chapter5.xhtml#jzyy_01_0949)　孙航：《加强区块链和人工智能应用 全面提升智慧法院建设水平》，《人民法院报》2019年11月10日。\n\
    \n[(5)](#chapter5.xhtml#jzyy_01_0950)　程金华：《人工、智能与法院大转型》，《上海交通大学学报》（哲学社会科学版）2019年第6期。\n\
    \n[(6)](#chapter5.xhtml#jzyy_01_0951)　郑戈：《人工智能与法律的未来》，《探索与争鸣》2017年第10期。"
  fmt: '

    将人工智能司法应用运用于司法裁判可能对既有的诉讼结构造成冲击，尤其可能使得公权力机关的力量大幅提升。为平衡控审辩三方，特别是在刑事诉讼和行政诉讼中，应当对当事人的诉讼权利予以补强，从而实现诉讼结构的重新稳定。


    首先，应当强化诉讼中的信息开示制度。有学者建议将刑事诉讼中的阅卷权改造为“数据访问权”。[^((45))](#chapter5.xhtml#jz_01_0990)以刑事诉讼和行政诉讼中的阅卷权制度[^((46))](#chapter5.xhtml#jz_01_0991)为例，基于平衡控辩双方力量的理念，法律要求控审方向辩方单向开示信息，允许辩方查阅、摘抄、复制证据材料和诉讼文书这两类案卷材料。然而随着人工智能技术的运用，公权力机关运用人工智能技术抓取的数据范围将远远超越传统意义上的证据材料和诉讼文书的范围，使得辩方的阅卷权出现“盲区”，从而影响阅卷权目的的实现。在此种情形下，有专家建议将传统的阅卷权改造为“数据访问权”，即数据主体可以从数据控制者处确认其个人数据是否正被处理，并行使访问个人数据及获得相关信息的权利。[^((47))](#chapter5.xhtml#jz_01_0992)如此，一方面可明确该权利的主体即为被追诉之人，而辩护人是协助其行使此项权利之人，从而解决阅卷权制度下权利主体不明的问题，另一方面基于数据访问权主动行使的特征，可避免重蹈传统阅卷权制度下要求法院、检察院批准导致的阅卷难的覆辙。可通过设置时间和特殊情形的限制避免此种权利的滥用。


    其次，应对数据鸿沟问题给予关注，并根据实际情况为当事人提供专业人士的帮助。人工智能技术是近年来的新兴技术，而对将该技术适用于司法活动所带来的诉讼变革，当事人本人或其辩护人、诉讼代理人仅依靠其自身能力是难以有效应对的，特别是当检察机关、审判机关或行政机关等公权力机关运用人工智能技术获得大量与诉讼相关的数据后，很可能有意或无意地向当事人进行“文件倾倒”。公权力机关看似完成了信息开示，实际上则陷当事人于海量数据的侵害。此外，老年人等社会弱势群体接受新事物的能力较弱，需要进一步推动解决这类当事人在运用智能技术方面遇到的困难，坚持传统方式与智能化创新并行，为所有当事人提供更平等、更便利的诉讼服务。


    最后，应当赋予当事人在个人信息保护方面的权利。科技时代的国家成为个人信息最大的收集者、处理者、存储者和利用者，隐私权保护走向个人信息保护成为必然的社会和法治变迁方向。司法活动中引入的人工智能技术，强化了国家通过诉讼收集使用个人信息的能力，使得作为信息主体的当事人行使信息权利保护其个人信息安全的需求更为迫切。我国的《数据安全法》《个人信息保护法》，以及欧盟的《通用数据保护条例》都旨在赋予公民相关个人信息权利，即是对此种需求的应对。在人工智能司法应用推广的大趋势下，国家需要为当事人面临的诉讼中人工智能技术的运用导致的信息失控风险提供充分且有效的救济途径。


    ### （三）适度控制司法活动与技术产业的合作边界


    司法是维护社会公平正义的最后一道防线。当前，人工智能技术赋能司法的主要路径往往是司法机关寻求并借助科技企业的帮助并将新技术应用到司法活动中。但应当注意的是，企业以盈利为目的，司法机关在与其合作的过程中需要避免其以有意识或无意识地将观念、利益诉求等“注入”智能化工具的方式影响司法活动，进而威胁司法独立原则，甚至影响法院独立行使审判权和检察院独立行使检察权。有鉴于此，需在司法与产业之间划定合理边界，使二者间保持既足以合作又不至于互相干预的合理距离。具体如下：


    其一，辨分相互之间的利益。如前所述，企业逐利是其本能，这是资本固有的天性。相比之下，司法所追求的主要是案件得到公平公正的处理，与企业以利益为目的存在巨大区别。只有将法院与企业之间的不同利益提前分离，才能保证二者不致混同，从而保障司法活动的独立运行，实现司法公平正义。此种利益的分离首先即是要确保人工智能技术引入司法活动中的科技招标采购环节的廉洁性。应以透明公开的招标采购程序、严格的审计审查和惩戒措施防止企业对经济利益的不当追求对法院工作人员造成侵蚀，导致二者利益的混同，甚至导致贪贿行为的出现。[^((48))](#chapter5.xhtml#jz_01_0993)


    其二，将内外部人员适当分离。法院缺少运用人工智能技术所需的专业技术人员，因此在技术的运用、培训、维护、修缮等方面往往要借助来自外部技术企业的人力资源，例如上海市高院在开发“206系统”的过程中选择与科大讯飞公司合作，后者派出大量技术人员参与研发；浙江省高院则与阿里巴巴集团合作打造智慧法院。可以说，法院借用科技企业的专业技术人员无可厚非，也符合中央关于司法辅助业务外包的改革思路。然而有学者提出为防止这些人员与法官“过从甚密”，进而干预司法，应当在二者之间设置障碍以划定其交往界限。[^((49))](#chapter5.xhtml#jz_01_0994)具体而言，对来自企业的技术人员的借用，应如同“206系统”一般，通过法院的信息技术保障部门进行，审判部门或法官寻求此类专业人员的帮助时应接受有关部门的统一安排，不宜由审判部门或法官个人直接接触这些人员。如此一来，可以在法官和来自企业的专业技术人员之间形成必要的阻断，防止科技企业利用其人员与法官因将人工智能技术引入司法裁判而产生的交往进行利益输送或观念灌输，进而影响案件的公正办理。


    其三，角色与权限的提前界定。现阶段，人工智能司法应用“不是要替代司法人员独立判断”，而是要“帮助司法人员依法、全面、规范收集和审查证据，统一司法尺度，保障司法公正”。[^((50))](#chapter5.xhtml#jz_01_0995)因此，科技企业在与法院展开人工智能司法应用合作时也应以此为要求。以法院系统为例，为保障法官在案件办理中的独立判断和权威，特别是其独立审判权，应制定企业将人工智能技术运用于司法裁判的行为规则，明确科技企业的辅助角色。[^((51))](#chapter5.xhtml#jz_01_0996)具体而言，科技企业的作用应限于对人工智能产品的开发、维护、更新等技术层面上，而在司法人工智能产品的设计目标、应用要求等方面应当由法院主导，这也是目前多地智慧法院的建设思路。在产品开发设计的过程中，要十分警惕科技企业将其利益、观念等，特别是针对特殊人群如妇女、儿童、少数族裔、同性恋群体等的歧视性偏见，利用程序、算法等加入人工智能工具之中，从而在智能化工具的运用中实际地影响案件的公正办理。此外，更要严禁科技企业通过开发和设计带有倾向性的人工智能产品干预具体个案或某类案件（例如涉及科技企业的知识产权纠纷案件）的办理，防止其利用人工智能技术在司法裁判中的运用谋取私利。[^((52))](#chapter5.xhtml#jz_01_0997)


    ## 第五节 人工智能司法应用的发展趋势


    ### 一、诉讼服务体系智能转型


    马克思和恩格斯说过：“一切划时代的体系的真正的内容都是由于产生这些体系的那个时期的需要而形成起来的。”[^((53))](#chapter5.xhtml#jz_01_0998)人民群众在司法个案中的公平正义获得感，除体现在与其利益息息相关的裁判结果外，最直观的莫过于在诉讼过程中接受诉讼服务时的切身感受。


    #### （一）“一站式”服务理念


    2019年7月31日，最高人民法院发布《关于建设一站式多元解纷机制 一站式诉讼服务中心的意见》，要求实现“一站式多元解纷、一站式诉讼服务”，为现代化诉讼服务体系建设确定了新的方向。


    以上海法院智慧诉讼服务平台为例，平台对所有的对外服务事项集中办理，通过和服务大厅、12368热线、司法公开等平台的互联互通，为当事人提供全方位、多层次的诉讼服务，建立由用户层、应用层、微服务层、治理层、基础设施层五个部分组成的数据交换标准体系并可通过数据交换平台实现与法院业务系统的数据互联互通，实现信息资源全面共享。在技术架构上，按照为服务实现能力与业务的关联，对系统中的诉讼服务、送达服务、文书辅助服务、卷宗查询服务、光学字符抓取、电子签章等应用服务进行拆分，并通过服务治理层实现管理。治理层通过API网关、调用跟踪、崩溃熔断、负载均衡等，全方位对应用服务进行治理。基础设施层作为系统运行的基础，采用Artery
    Docker容器云平台，是一套集部署、管理、调度、运维于一体的系统。未来，在人工智能和大数据技术的加持下，“一站式”服务将继续得到升级与完善。


    #### （二）线上线下集成


    利用现代科技，实现线下诉讼服务集成到线上，极大地扩展了诉讼服务的制度内涵和覆盖范围。在各地法院尚“各自为政”的时代，诉讼服务质量、效率和效果的提高受到严重制约，不仅不同地区法院之间在诉讼服务上难以形成“一盘棋”，而且法院与党政机关、社会组织之间也不能形成通畅的纠纷化解工作体系。随着人工智能、大数据、云计算、5G等科技的发展，以及光缆、电缆、基站等基础设施的完善，法院大力打造的以中国移动微法院、调解平台等十大诉讼服务平台为支撑的一站式建设总体框架基本成型。对当事人来说，不仅异地立案、视频调解、网上开庭等已经成为现实，而且其将可以享受“只进一个门、最多跑一次、可以不用跑”的纠纷化解服务。这不仅在过去不敢设想，在世界范围也别无分店。可以预见，随着法院诉讼服务潜能的进一步发掘，法律职业分工甚至法学教育的内容都可能发生微妙的转变。


    ### 二、司法审判活动场景化智能变革


    习近平总书记在党的十九大报告中指出“中国特色社会主义进入了新时代”，强调要“提高社会治理社会化、法治化、智能化、专业化水平”。全国法院借助人工智能发展的最新科技成果，努力破解深化司法改革进程中遇到的突出问题，提升了审判质效。司法审判活动中长期存在的案多人少，线上庭审体验不佳，当事人参加庭审存在时空难度等问题，将在人工智能等技术的赋能下发生巨大变化。


    #### （一）全流程多场景的线上诉讼服务


    传统模式下的庭审，原则上要求诉讼参与人全体参与其中，然而由于时空的限制往往无法实现，通过人工智能技术、云储存、5G技术对审判活动进行场景化的智能变革，能够达成全流程多场景的线上诉讼服务；利用证据提交、证据交换、询问、调解等多用途、多场景、全流程地发送重要诉讼活动，可使跨地域间的诉讼参与人也能正常参与其中。在诉讼过程中，通过智慧审判系统的图文识别、自然语言理解、司法要素抽取等人工智能功能，能够实现机器识别证据、理解证据、分析证据，进而辅助法官归纳争议焦点、检验审查证据、采信证据、认定事实、适用法律。上海市高级人民法院推动的基于电子卷宗“单套制”的网上办案，可为智能辅助审判、提高审判质效提供基础保障。


    #### （二）诉讼活动从线下到线上、到云端


    通过5G高速传输，使用智慧庭审系统开庭甚至能够清晰、无延迟地观察到诉讼参与人的微动作，极大地提升线上开庭的“真实感”与“仪式感”。将所有的在线诉讼活动直接上传“云端”，可保证完整诉讼过程全程留痕、全程高清、全程可溯、全程监管。而在卷宗线下到线上、线上到云端的流转过程中，通过法院案件信息防篡改系统，基于分布式对等网络模型，利用电子数据扫描、PBFT共识机制、区块链分布式存储技术、多线程技术、非对称加密技术、平行链管理及联盟链架构等先进技术的集成，可实现智慧审判系统电子证据及卷宗的防篡改、流转真实可信。向防篡改系统写入数据的事务请求时需附有发起方私钥签名，该签名随事务请求在网络参与节点间广播并得到验证，因此事务请求是不可伪造和防篡改的。同时，块链式数据结构进一步防止了篡改。


    ### 三、司法审判体系智能升级


    人工智能司法应用助力司法审判体系的智能升级，为我国法院业务提质增效带来重大机遇，但人民群众日益多元化的需求和广大干警日趋迫切的提质增效需求也向智慧法院建设提出了更高要求。为进一步推进人工智能与司法审判的深度融合，解决全国各区域、各级别法院人工智能司法应用发展的不平衡、不充分，信息共享的不充分，降低建设成本，提升数据资源使用，加快集约化建设与实际应用，今后司法审判体系可从以下方面进行架构完善与升级。


    #### （一）继续深化人工智能应用，提升智能化水平


    当前人工智能司法应用主要作用于法院审判质效的提升，但应用的智能化水平还有提升的空间，迫切需要利用司法认知智能技术进一步提升审判能力现代化，真正做到应用全面标准化、规范化、智能化，实现减负增效。全面深化全业务网上办理、全流程依法公开、全方位智能服务，通过进一步集成、升级、普及和深化应用，建立完善的人工智能司法应用体系，促进法院智慧建设与业务的深度融合，实现知识驱动、智能辅助，能力支撑、全面赋能，云网一体、集约高效，中台架构、创新业态，质效运维、安全可靠，规则引领、规范有序，打造集数字化、智能化、人文化于一体的新时代智慧法院，实现业务支撑深度、广度的跨越式提升。需充分把握“十四五规划”战略机遇，坚持统筹推进与重点实施相结合、坚持法官需求与机制保障相结合、坚持司法人工智能业务一体化的科学布局，顺应新一轮科技革命浪潮的必然选择，提升司法公信力与人民群众获得感，深化人民法院司法改革的重要支撑。


    #### （二）统一技术标准，加强集约化建设


    加强全国法院顶层设计、做好统筹工作，制定统一技术管理标准，从数据一体化、技术一体化、服务一体化，三个一体化角度不断提升和推进。从一体化的角度进行信息汇集，包括数据资产的汇集和管理与业务智慧成果的汇集和管理。通过数据治理、感知计算等手段，对数据资产、业务智慧等多元数据进行融合和关联。同时，通过法律知识图谱的构建和自然语言理解、机器学习技术、法律认知技术的运用，实现法律概念的理解，构建法律认知引擎、数据分析模型和知识服务工具。打造一体化的知识中心，实现对法官办案的智能辅助支持，包括知识推送、知识检索、智能研判等。同时打通个案数据、用户行为数据和外部数据的采集，形成数据循环。以劳争案件为例，可通过打通与劳动仲裁、社会保险的数据壁垒、实现业务联动，提升法官的办案效率。


    ### 四、司法服务管理智能更新


    司法审判工作关系到人民群众的操心事、烦心事，是群众的“大事”。[^((54))](#chapter5.xhtml#jz_01_0999)司法工作人员一生可能会经手成百上千个案子，但对于每一个案子的当事人来说，司法人员的每一次审判都有可能影响他的生活，甚至改变他的人生。因此，作为维护社会公平正义的最后一道防线，司法机关能否让人民群众在每一起司法案件中都能感受到公平正义，既取决于司法工作人员的专业技能水平，同时也取决于司法机关的纪律作风和工作态度。而信息技术的升级也为司法服务内部管理带来了新方法和新思路。


    从功能来看，人工智能等新科技主要在检查监督、质量评估、管理保障等方面发挥作用。在检查监督方面，大数据分析、视频图像识别、语义分析等技术的不断发展为实现审判执行办案过程的全程可视、全程留痕、全程监督提供了有力帮助。例如，北京市第四中级人民法院自主研发的法院视频巡查系统就是对接监控网络及数字法庭的多维度视频行为识别软件系统，其下包括庭审视频巡查、诉服视频巡查和办公智能巡查三个子系统，巡查范围涵盖全部数字法庭、调解室、谈话室、立案大厅等公共空间，可实现对法院全部公共区域的无死角、全覆盖监控分析。该系统利用大数据和人工智能实现监督管理工作由被动抽查到向全域、全员、全过程主动实时监控管理的转型，是人民法院纪检监察工作发展中审务督察工作与现代技术手段深度融合的典型范例。


    人工智能司法相关应用也能为司法的可监督性、可问责性制度体系的全面更新与优化提供保障，使该制度能够更加有效地制约司法、引领司法，为公正、廉洁司法提供坚强保障。例如，浙江法院基于智能化管理体制和模式，专门设置适用于人民法庭的审判执行质量和效率评估体系。该体系可以综合评估体系中的各项指标和要求，形成有效的“评估数据”，据此对各个法庭的公正性、效率性等诸多表现进行动态排序，实现实时监督。各种数据系统不仅能使外在监督更加全面客观，同时也能使司法机构内部监督形成常规机制，在此机制下，法官、法庭和法院可以随时进行自我评估，还可以互相评估和互相监督，达到共同学习、共同进步，提升整体司法水平的目的。


    除了对司法过程的监督检查、对工作人员司法公务行为的严格约束，新科技也在内部管理自动化、工作保障信息化等方面提供了新的开展路径。例如，全国检察机关队伍管理系统采用统一研发、两级部署、四级应用的模式，[^((55))](#chapter5.xhtml#jz_01_1000)该模式包括“一库、一平台、两体系、十一系统”的全方位队伍建设信息化项目，支持对全国检察人员在进入、岗位、任免、培训等方面的全生命周期管理。在保障辅助方面，烟台市莱山区检察院研发了车辆智能管理子系统，配置了“车钥匙智能卡柜”，通过连接“莱检通”、执法执勤车辆使用管理权限和网络，实现刷卡用车、车辆出入射频扫描登记、周末公车封存等功能，保证执法执勤车辆的实时监控。


    未来，利用现代化科技技术手段促进司法工作人员依法规范履职、加强内部监督管理、维护司法机关清正廉洁的司法形象，逐渐成为新科技时代背景下司法服务管理革新和发展的方向，司法服务管理也将继续朝着与互联网、大数据、人工智能等现代科学技术深度融合，司法机关内部信息化建设转型升级，司法管理全方位、高层次智能化的目标迈进。


    **课后习题：**


    （简答题）


    1．尝试梳理当前人工智能司法应用的核心功能。


    2．简述人工智能司法应用对于实现公平正义的价值。


    3．简述人工智能司法应用的风险与不足。


    （思考题）


    你认为人工智能司法应用是否能够取代人类法官？未来这类应用将有哪些发展，又会给司法活动带来怎样的变革？


    * * *


    [(1)](#chapter5.xhtml#jzyy_01_0946)　张文显、孙妍：《中国特色社会主义司法理论体系初论》，《法制与社会发展》2012年第6期。


    [(2)](#chapter5.xhtml#jzyy_01_0947)　季卫东：《人工智能时代的司法权之变》，《东方法学》2018年第1期；左卫民：《关于法律人工智能在中国运用前景的若干思考》，《清华法学》2018年第2期；李本：《美国司法实践中的人工智能：问题与挑战》，《中国法律评论》2018年第2期；左卫民：《热与冷：中国法律人工智能的再思考》，《环球法律评论》2019第2期。


    [(3)](#chapter5.xhtml#jzyy_01_0948)　《最高人民法院关于深化人民法院司法体制综合配套改革的意见——人民法院第五个五年改革纲要（2019—2023）》（法发〔2019〕8号）。


    [(4)](#chapter5.xhtml#jzyy_01_0949)　孙航：《加强区块链和人工智能应用 全面提升智慧法院建设水平》，《人民法院报》2019年11月10日。


    [(5)](#chapter5.xhtml#jzyy_01_0950)　程金华：《人工、智能与法院大转型》，《上海交通大学学报》（哲学社会科学版）2019年第6期。


    [(6)](#chapter5.xhtml#jzyy_01_0951)　郑戈：《人工智能与法律的未来》，《探索与争鸣》2017年第10期。

