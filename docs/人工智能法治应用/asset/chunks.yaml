  trans: '


    网络空间是一个真实的虚拟存在，是一个没有物理空间的独立世界。在这里，人类实现了与肉体分离的“数字化生存”，拥有了“数字化人格”。“数字化人格”就是“通过个人信息的收集和处理勾画一个在网络空间的个人形象”——凭借数字化信息而建立起来的人格。个人信息包括当事人不愿他人知道或他人不便知道的隐私信息，主要类别有：个人登录的身份和健康状况、个人的信用和财产状况、电子邮箱地址、网络活动踪迹等。在信息化社会，这些零散的和广泛的个人信息有可能被收集，并被数据处理，拼合成所谓数字化人格——在很大程度上是被迫建立的，个人毫不知情的人格。在今天和未来，当移动互联网、大数据和机器智能三者叠加后，我们将生活在一个“无隐私的社会”。


    人工智能的发展以海量的数据为基础支撑，当下大数据及移动互联网技术掀起的全球技术革命的浪潮使得一切都透明起来，社会公众的隐私泄露似乎被默认，一场信任危机已经到来。但是人工智能发展的根本目的是服务人类，而不是使人类为其所控。当下社会对公民个人信息的保护也在不断深化。


    美国的一项研究将隐私构想成社会利益和归属的标记，这一定位旨在扩大国家赋予和规制的公民身份的标准含义，即隐私不仅是法律上的自决权利，而且是作为人格和国家身份的感知基础的社会权利。有学者认为，个人因身份感被侵蚀而成为在线的海量类似信息有机体之一。自我暴露为线下身份的重新定义和新的关系的建立提供了一个平台，从而使我们可以重新配置和定义这些空间中的关系和社区的概念，让我们在没有实体的信息圈里重新树立、调整自己的身份，由此迎来自主构建信息身份这种信息隐私的数字化信息时代，因此在数据时代应当适应新的信息环境的隐私观念，对隐私认同持全新而非固化的理解。^((9))有学者认为，敏感的个人数据可能被用于对个人进行不公平的推断，特别是当现有数据库本就对某些种族或性别的人存有偏见时，其就可能进一步加剧现存的社会不平等。若无适当的隐私保护机制，个人数据被滥用的情况或将层出不穷，这不仅会加剧社会歧视，也将影响信息社会的可持续发展。^((10))有学者积极关注数字经济时代个人隐私权的保护问题，认为国家要积极承担数据保护责任，例如限制数据流动，要求数据本地化，形成实质上的数字贸易壁垒，但是其中对个人数据的存储限制、目的限制、数据最小化等限制要求，又是对个人信息严格保护的要求，旨在防止个人数据时刻处于被任意采集和商业化滥用的危险境地。^((11))因此，在当下制定隐私政策已经成为满足个人信息保护现实需求的重要方式之一。通过研究国外经验，可发现美国主要将隐私政策界定为一种企业的自律规则，侧重于通过行政手段对个人信息提供保护。而在我国，公民个人信息权益已经得到了《民法典》的确认和保护，因此对隐私政策的法律调整也应当以此为基础展开。我国目前尚未形成明确的个人信息保护模式，同时，固有法或传统观念对互联网时代的影响也并不明显，这恰是一种机遇。因此，我国的隐私政策宜采用一种公、私法律手段相结合的方式。即一方面注重通过行政手段对企业自律行为进行调整与规制，以弥补私法在调整隐私政策方面的不足；另一方面，重视发挥私法在调整隐私政策方面的作用，以弥补行政手段在调整隐私政策方面的不足，并充分发挥个人在隐私政策调整方面的作用。^((12))此外，2020
    年人类面临重大公共卫生危机，在此背景下，健康码的推广成为我国疫情防控的创举，在与健康码相关的个人信息保护中，应弱化知情同意原则之同意规则，坚守知情规则，并强化最小必要原则，严格限制个人信息处理的范畴、期限和披露。^((13))综上而言，数字时代的隐私权保护，一要对隐私权进行客观解读，二要充分利用市场和行政手段来化解经济发展便利和个人隐私之间的冲突，这意味着要明确法治治理的边界。


