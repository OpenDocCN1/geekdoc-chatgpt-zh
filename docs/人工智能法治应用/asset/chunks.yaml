- raw: "作为社会治理的“最小单元”和“末端细胞”，居民小区直观地体现了社会治理的成效和人民群众对平安的感知程度，而智能安防小区则成为推动社会基层精细化治理的重要抓手。\n\
    \n上海市公安局研发的智能化小区防范和服务系统，能够全方位地保障小区安全。例如通过智能安防系统的“关键字查找”功能，能够迅速确定车位被占的车主信息；依托“关键字抓取”功能，民警通过公安网能够很快查询、联系到老人家属并上门查看，帮助突发疾病的老人化险为夷；独居老人的情况可被录入智能安防系统终端“关注标识”，只要其持续一段时间未出门，系统会推送信息提醒社区工作人员和民警上门核查，而针对未录入信息的人员连续多日出现在小区的情况，系统同样会主动提醒，从而有效预防小区内侵犯财产类违法犯罪案件。2021年7月，上海市公安局已在1万余个居民住宅小区、3400余栋商务办公楼宇完成智能安防建设，其部署的90余万个安防感知“神经元”时刻关注着治安态势的风吹草动。浙江省嘉兴市嘉善县公安局研发的“智安小区”平台，集人脸识别、车牌识别、电动车防盗识别、重点部位巡更、小区公共视频、家庭摄录一体机、APP信息传送等功能为一体。按照“分类整合、逐级汇聚”原则，嘉善县将全市“智安小区”采集的所有数据汇入市公安局的大数据池。同时研发了基于大数据生态框架的“物联网应用”“视频一体化”“人像慧视”等三大主平台。在小区内部和社区警务室均设立小区智控二级平台，并连接市镇两级综合指挥室，对小区整体社情、警情进行实时智能预测预警。\n\
    \n## 第三节  \n\n人工智能执法应用的特点与挑战\n\n### 一、人工智能执法应用的主要特点\n\n##### （一）技术发展以业务实践和法律需求为导向\n\
    \n不同行政区的人工智能执法技术与当地的业务需求和重点工作紧密相连，例如云南省瑞丽市靠近边境，境外输入疫情防控压力大，瑞丽市政府、云南省人工智能重点实验室与小语智能信息科技（云南）有限公司研发的东南亚语言智能翻译机能够直接实现中文和缅文之间语音、文字的自动翻译，提高了当地公安机关开展疫情防控的效率；南京市、武汉市位于长江沿岸，长江“生态眼”、打击非法捕捞犯罪信息化平台为长江沿岸的生态保护提供了智能监管。此外，在法律与政策的双重影响下，图像识别、数据分析的能力以法律的需求为导向进一步加强。例如《民法典》关于高空抛物的规定使得高空抛物监控系统得到发展；《长江保护法》的出台使非法捕捞监管系统的分析能力得到提升；“十四五”规划关于城市管理的内容使得城市数字化转型进一步加快；《上海市非机动车安全管理条例》的出台使得交通执法场景的人工智能技术的应用范围由机动车扩展至非机动车。\n\
    \n##### （二）数据融合共享的步伐不断加快\n\n数据尚未高度融合共享是掣肘公安机关人工智能技术发展的难题，数据壁垒不仅存在于公安系统内部的不同警种、不同地域、不同层级、不同平台之间，而且也存在于公安机关与其他外部部门之间。智慧警务建设的一大特点便是不断促进跨层级、跨地域、跨系统、跨部门、跨业务的数据共享。为了实现公安系统内部信息的融合共享，公安部按照统一数据资源的要求，将各警种业务数据充分汇聚融合，初步建成部级大数据平台；在地方层面，以广东省为例，基于“全省一片云”的规划，广东省形成智慧新指挥、新侦查、新民生、新防控等八大创新警务应用，完成了省级警务云资源服务平台的建设。公安机关与外部其他部门的数据开放共享也得到进一步加强。2019年10月，北京市建立了跨部门的“目录区块链”系统，将全市53个部门的职责、目录以及数据联结在一起，解决了数据缺位、越位的问题。依托“目录区块链”可将公安机关与其他部门间的共享关系和流程上链锁定，通过数据共享规则的建立解决数据随意流转、业务系统无序的问题。\n\
    \n此外，数据融合的趋势也不断从省内数据共享到跨区域深度合作转变。以“一网通办”平台为例，跨区域数据集约合作进一步加深。在东部地区，以长三角政务服务一体化、“京津冀+雄安（3+1）”政务服务协同发展平台和泛珠三角区域“跨省通办”为典型。在中部地区，以黑龙江与吉林政务服务事项“跨省通办”（哈长城市群区域通办服务专区）为典型。在西部地区，以“川渝通办”，四川、重庆、云南、贵州、西藏西南五省市“跨省通办”和新疆、甘肃、青海、陕西“丝路通办”政务服务“跨省通办”为典型。此外，东中西部的合作也不断加强，冀鲁豫三省五县“一网通办”、晋陕豫黄河金三角地区四市“跨省通办”、重庆、贵州、陕西、湖南、湖北环渝省份跨省市公安政务服务通办机制也在逐步推进中，全国各地公安大数据技术应用创新中心的建成更是打通了东西部合作的任督二脉。\n\
    \n##### （三）促进执法活动由事后处理向事前预警转变\n\n依托大数据分析和挖掘技术，人工智能促进执法活动由被动向主动、由事后处理向事前预警转型。在侦查领域，人工智能、大数据的应用改变了传统的回溯型侦查模式，转而形成大数据驱动下的预测型侦查模式，其通过分析犯罪的时空分布将犯罪地理空间特征、时间特征、人群特征、犯罪类型等多种影响因子相结合，最终得出犯罪的高发热点、高发时段和发展趋势，系统自动分析研判实现精准预警。在治安防控领域，广东省公安厅治安局开发的“社区新警务”移动应用，成为集“采集、研判、行动、反馈”工作链条于一体的最小警务单元，有助于从源头预防恶性事件的发生。\n\
    \n### 二、人工智能执法应用面临的挑战\n\n##### （一）执法过程中数据的收集与个人信息保护的冲突\n\n在公安数据的获取及管理上，针对如一些较为敏感的公安数据如何在公安系统内部不同部门之间的流转与共享，如何保障公安数据的获取，数据是否有偿，敏感信息持有权归属等问题，尚缺乏相应的法律规定及政策保障。[^((15))](#chapter4.xhtml#jz_01_0925)随着技术的越加成熟，在理论上，人工智能技术能否继续应用也存在较大争议，特别是人脸识别技术，争议主要出于对公民隐私保护的担忧，以及数据泄露的风险。\n\
    \n在人脸识别技术的适用过程中，美国各州对其的态度是谨慎的，认为人脸识别技术的使用将会侵犯公民隐私权，减损公民权利和公民自由，故对其适用的范围普遍进行了限制。2020年2月14日，美国加利福尼亚州众议院通过第2261号关于人脸识别技术的法案，即《加州人脸识别技术法案》，禁止任何机构使用人脸识别服务进行持续的追踪监视，除非是在严重刑事犯罪执法调查有关的特定情况下。2020年3月12日，美国华盛顿州参众两院通过第6280号参议院议案，即美国华盛顿州《人脸识别服务法》，规定州和地方政府机构可使用人脸识别服务定位或识别失踪人员、确定死者身份，包括失踪或被谋杀的印第安人女性、安珀警报和银色警报的对象及其他可能的受害者，以确保公众安全。美国旧金山于2019年5月14日通过法案，禁止市郡政府机构使用AI面部识别技术，该法案提议者、市议员亚伦表示，这项法例并不是反技术，而是要确保安全和负责任地使用“监控技术”并允许公众参与决策。之后，旧金山又提出《人脸识别道德使用法案（草案）》，规定相关政府机构不得安装任何与人脸识别相关的设备，不得访问或使用人脸识别技术获取的个人信息。加利福尼亚州参议院推出一项法案，禁止警方使用带有人脸识别等生物技术的全身摄像头。马萨诸塞州的萨默维尔市议会投票通过法案，该法案除禁止市政部门积极使用人工智能以外，还禁止在任何刑事调查领域或法律诉讼中使用面部识别软件系统产生的数据或证据。美国民主党参议员杰夫·默克利（俄勒冈州）和科里·布克（新泽西州）则于2020年2月12日在参议院提出《人脸识别道德使用法案》草案，要求禁止政府机构使用人脸识别直到委员会形成政府使用准则和限制条件为止，以防止人脸识别技术违反宪法第一修正案中规定的公民权利，即侵犯公民隐私权和影响公民自由。\n\
    \n在保护个人隐私方面，欧盟被认为是全球最严格的地区。2018年5月，欧盟正式实施《通用数据保护条例》，以规制包含人脸数据在内的生物识别数据的使用。欧盟委员会负责数字事务的执行副主席韦斯塔格曾表示，通过人脸识别进行身份验证的技术违反了欧盟《通用数据保护条例》的有关规定，是不合法的，具体法律依据为该条例第6条，即除公共安全需要的情形外，个人数据须征得本人明确同意才能使用。2019年12月，欧盟委员会表示正在考虑实施史上最严的人工智能监管措施，其在拟发布的《人工智能白皮书（草案）》中，经过综合权衡，对使用人脸识别等远程生物识别系统提出了严格限制。此外，2019年11月，欧盟基本权利局发布《面部识别技术：执法中的基本权利考虑》报告，着眼于实时面部识别技术中涉及的基本权利，重点在于实现将面部识别技术用于执法和边境管理。\n\
    \n##### （二）人工智能执法应用缺乏标准化体系\n\n在人工智能执法应用建设方面，暂无国家层面的顶层设计和宏观指导，国家级的政策规划和法律法规等尚不完善，尤其缺少运营准入标准，存在项目一哄而上、基础参差不齐、部门各自为政的现象。目前最重要的是尽快制定统一标准，实现警务机制整合和信息资源共享。[^((16))](#chapter4.xhtml#jz_01_0926)在运行管理方面，缺乏统一的标准影响数据的集中处理和信息共享的效能。技术、管理、维护方面相关标准缺失，现有标准执行不力等问题都需要公安机关相关部门出台相应的标准来加以解决。[^((17))](#chapter4.xhtml#jz_01_0927)\n\
    \n##### （三）人工智能执法应用对数据的利用效率较低\n\n一方面，人工智能执法应用的大数据信息资源不到位。部分数据存在更新不及时、内容不准确、采集质量差等诸多问题，大数据信息资源还处于休眠状态，未得到深入挖掘、分析研判，应用效能较低。另一方面，人工智能执法应用数据资源分析利用水平不高。公安机关在日常警务实践中掌握的数据量大且格式多样，急需分析功能强的数据分析软件，但现阶段专业的警务大数据分析软件极其匮乏，数据信息系统往往只能用于简单的查询与统计，对信息的应用深度不足，未能有效发挥情报信息主导侦查、防控的实际效能。[^((18))](#chapter4.xhtml#jz_01_0928)\n\
    \n## 第四节  \n\n人工智能执法应用的发展趋势\n\n### 一、5G+AI技术红利将满足执法应用中的超高清视频需求\n\n随着5G（第五代移动通信技术）与AI（人工智能技术）技术的发展，5G+AI技术红利能够满足执法人员在执法活动中对超高清视频的传输和分析需求。具体而言，如何解决执法应用中的两大难点——超高清视频产生的海量数据的低延时传输和数据分析，是本节主要介绍的内容。\n\
    \n##### （一）执法应用中的超高清视频需求\n\n以公安机关通过人脸识别系统追捕逃犯为例，人脸识别系统需要通过安装在公共区域内的高清摄像头对道路卡口、车站、地铁站、机场等进行视频监控，同时迅速传回服务器进行智能分析。系统通过人工智能算法强大的识别功能检测出动态视频中的人脸并将其与逃犯的记录做实时比对，比对成功则立即报警推送给警务人员处置。整个过程中存在两大难点：一是要实现监控摄像头拍摄超高清视频产生的海量数据的低延时传输。二是要迅速对高清视频数据进行分析和进行人脸识别比对。其中任何一环出现延误，就足以让逃犯逃之夭夭。\n\
    \n以2012年某市的案件为例，案件发生后该市警方从全市1万多个摄像头共提取了大小近2000T的视频数据，调动1500多名公安干警查阅搜索视频线索，共耗时一个多月。海量视频的有效利用构成巨大挑战，完全依靠人工费时费力，而5G网络的高数据流量密度和低时延，以及AI算法人脸识别的精准度提供的技术红利，可有效满足执法应用中高清视频的需求。\n\
    \n##### （二）执法应用中5G技术的应用\n\n5G网络的典型特征是大带宽、高可靠低时延、海量连接，可以使端到端时延降低5倍，并提供1Gbps以上的业务带宽、毫秒级的超低时延以及每平方公里百万量级的连接密度。这使人与机器之间的通信、机器与机器之间的通信成为可能。5G技术通过采用大量新技术和新架构提高高清视频摄像头的上传带宽，可以实现摄像头1Gbps以上的业务带宽，实现执法应用对视频清晰度和低延时需求，解决了大容量、高分辨率视频信号的回传问题。\n\
    \n##### （三）5G+AI技术的执法应用\n\n针对通过5G技术传回的海量高清视频数据，如何迅速进行数据分析并从中识别出需要的信息（例如逃犯的人脸信息）就成为执法难点。如前文提到，完全依靠人工搜寻有用信息费时费力。而AI技术可以将海量高清视频数据结构化，针对海量视频内容进行自动化处理，提供行人、机动车、非机动车等关键目标的监测、跟踪、属性分析，同时迅速识别出海量信息中的关键信息，让执法活动更加智能便捷。\n\
    \n### 二、联邦学习将助力执法数据融合与公民隐私保护\n\n##### （一）什么是联邦学习\n\n联邦学习是一种具有隐私保护、安全加密技术的分布式机器学习框架，旨在让分散的各机器学习参与方在不向其他参与者披露隐私数据的前提下，协作进行机器学习的模型训练。[^((19))](#chapter4.xhtml#jz_01_0929)其背后的技术原理最早可以追溯到19世纪80年代。当时我国著名的计算机科学家，后来成为中国科学院、美国科学院院士的姚期智博士提出了“百万富翁”问题。假设有两个百万富翁，他们想比比谁更有钱，但是却出于隐私保护不想让对方知道自己到底拥有多少财富。如何在不借助第三方外力的情况下，让他们知道他们之间谁更有钱？该问题其实属于密码学领域的一个分支，也就是“多方安全计算”（Secure\
    \ Multi-Party Computation，SMPC）。SMPC技术能够在数据不泄露的情况下联合多方的数据进行联合计算并得到明文计算结果，最终实现数据的所有权和数据使用权的分离。而最早提出并奠定了该计算理论的姚期智教授也在2000年获颁被誉为计算机界诺贝尔奖的图灵奖。\n\
    \n##### （二）联邦学习的基本架构和应用场景\n\n##### 1．联邦学习的定义\n\n随着人工智能技术的发展，各行各业对于大数据的需求越发强烈。然而绝大多数行业的数据都是以数据孤岛的形式存在的。也就是说，数据在不同机构或部门中独立收集、存储、管理，难以流通。这就给执法部门的执法活动带来了巨大的阻碍。例如，金融诈骗团伙在骗得受害人的银行汇款之后，通常会立即通过不同银行的不同账户层层转账，以逃脱执法部门的追查。各银行出于保护自身数据隐私的考虑，不会主动向经侦执法部门披露相关的转账信息，由此造成了一座座数据孤岛。在过去的执法活动中，为打破数据孤岛，执法部门通常会收集来自不同机构的数据，将其统一整合到中心数据集群后进行集中分析和处理。然而，由于数据获取成本极高，也不利于公民隐私的保护，在保护数据隐私的前提下解决执法活动中的数据孤岛问题迫在眉睫。\n\
    \n在数据安全与隐私愈发被重视的大背景下，联邦学习成为促进执法数据融合、保护公民隐私的利器。联邦学习是指能够实现在数据不出本地的前提下，由多个参与方联合、协作完成建模任务，并且进行分布式机器学习的范式。[^((20))](#chapter4.xhtml#jz_01_0930)下面我们将简单介绍一下联邦学习的两种基本架构和三种应用场景。\n\
    \n##### 2．联邦学习的基本架构\n\n联邦学习的基本架构主要有两种：第一种是中心化联邦学习架构，也就是较为传统的“客户端+服务器”的架构。例如，谷歌于2016年为解决安卓手机终端用户在本地更新模型问题，进而提升安卓系统性能所采用的架构。中心化联邦学习架构在科学家Brendan\
    \ McMahan等人的论文“Communication-efficient learning of deep networks from decentralized\
    \ data”中有详细的说明。[^((21))](#chapter4.xhtml#jz_01_0931)\n\n联邦学习的第二种基本架构去中心化联邦学习架构，主要针对多家面临数据孤岛困境的企业联合进行模型训练的场景。由于难以从多家企业中选出进行协调的服务器方，所以在去中心化联邦学习架构中没有第三方服务器的参与，而由参与方之间直接交互、对等计算，从而在保障数据安全的同时维护各参与方的数据隐私。[^((22))](#chapter4.xhtml#jz_01_0932)\n\
    \n##### 3．联邦学习的应用场景\n\n根据各个参与联邦学习的参与方对于数据集合贡献方式的不同，可以将联邦学习细分为三种不同的应用场景：横向联邦学习、纵向联邦学习和联邦迁移学习。\n\
    \n横向联邦学习适用于各数据持有方的业务类型相似、所获得的用户特征多，然而用户空间重叠较少的场景。横向联邦学习以数据的特征维度为导向，首先选取参与方特征相同，用户不完全相同的部分，并进行联合训练。在训练的过程中，各参与方之间数据样本的联合，扩大了训练模型的样本空间，从而提升了模型的效果。[^((23))](#chapter4.xhtml#jz_01_0933)以各地区不同的商场为例，商场拥有客户的购物信息大多类似，但是用户人群并不相同。各商场可以通过横向联邦学习联合不同商场和不同用户的购物信息，对其相同的购物特征进行模型训练，共同构建更加精准的用户购物模型。\n\
    \n纵向联邦学习适用于各参与方之间用户空间重叠较多，而特征空间重叠较少的场景。纵向联邦学习是以共同用户为数据的对齐导向，其取出参与方共同的用户，对其特征不完全相同的部分进行联合模型训练。为保证非交叉部分数据的安全性，在进行数据联合时，每个参与方只有基于本地数据训练的模型，从而保障了的数据流通的安全，维护了各参与方的数据隐私。[^((24))](#chapter4.xhtml#jz_01_0934)以一定区域内的不同银行为例，由于地理位置类似，所以其用户空间交叉较多。但是，其业务类型不同，因而用户的特征相差较大。各银行可以通过纵向联邦学习联合来自不同银行和共同用户的业务信息，对用户的业务需求进行模型训练，共同开发更加精准的用户业务模型。\n\
    \n联邦迁移学习是对横向和纵向联邦学习的补充，适用于各参与方之间用户空间重叠较少，并且特征空间重叠也较少，或基本没有重叠的场景。依然以之前商场和银行为例，处于完全不同地域的商场和银行，受地域不同的限制，用户交叉度不大。同时，由于商场和银行两者的机构类型不同，二者的数据特征也交叉不大。在这种情况下，联邦迁移学习基于各参与方数据或模型之间的相似性，通过将在源域（domains）中学习的模型迁移到目标域中来解决参与方数据规模小和标签样本少的问题，从而提升了联邦模型的效果。举例来说，就是商场对用户购物行为的模型学习，可能有助于银行对客户业务模型的学习（如在商场高消费的客户需要银行提供高额度的信用卡业务）。换句话说，人类可应用先前所学的知识和能力来更好地解决新问题，而迁移学习的目的是使人工智能也能具备这种能力。\n\
    \n##### （三）联邦学习的行业解决方案\n\n在保护数据隐私的前提下解决行业中的数据孤岛问题，是联邦学习价值的核心所在。接下来，我们将从执法数据融合与公民隐私保护的角度，结合智慧金融、智慧医疗、电商及智慧执法四大典型应用场景，分析联邦学习具体的应用背景，介绍基于联邦学习的解决方案是如何赋能行业、实现执法的降本增效、产生公民隐私保护的效果。相信在不久的将来，联邦学习会帮助我们打破各领域、各行业的数据壁垒，让人工智能带来的红利惠及社会的方方面面。[^((25))](#chapter4.xhtml#jz_01_0935)"
