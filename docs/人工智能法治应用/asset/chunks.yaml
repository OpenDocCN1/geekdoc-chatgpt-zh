    \n**表6-6　开放数据共用许可协议的类型**\n\n![](images/img10_p294_1.jpg)\n\n另外，开放数据共用许可协议是开放知识基金会（OKF）发布的许可协议类型，旨在规范和约束数据提供者和数据使用者在使用、发布、修改和传播数据时的责任与义务，是国际通用的许可协议类型。开放数据共用许可协议包含三种类型：公共领域贡献与许可（Public\
    \ Domain Dedication and License，PDDL）、开放数据共享署名许可（Attribution License，ODC-By）和开放数据库许可（Open\
    \ Database License，ODC-ODbL）（见表6-6）。\n\n开放数据共用许可协议是专门针对数据或数据库开放的许可协议类型，具有许可对象单一的特点。开放数据共用许可协议适用于复杂的数据集内容和数据库作品，不适用于计算机软件、电影、音乐等创作作品，许可对象单一；开放数据共用许可协议应用领域不够广泛，目前远不及知识共享许可协议广泛，国外政府数据开放中目前有法国使用开放数据库许可协议（ODbL）。开放数据共用许可协议是国际通用的开放许可协议，其包含的三种许可类型均符合开放的条件，不限制商业领域使用和对数据的修改、演绎等，其中限制最多的开放数据库许可（ODbL）也可以用于商业领域。\n\
    \n### 二、域外各国许可协议比较\n\n各国制定的许可协议即开放政府许可协议，是指政府部门专门为开放政府数据或者公共部门信息制定的许可协议，也是促进数据开放的重要许可协议类型（见表6-7）。国外政府开放数据时大多采用已有的许可协议，也有部分国家采用知识共享许可协议或其移植版，由于各国移植知识共享协议时只是对其稍作修改，因此下文对知识共享许可协议不再做深入讨论。\n\
    \n美国联邦政府开放政府数据时使用知识领域许可协议。如其所述，知识领域许可协议是放弃了所有权利的保护，包括著作权、数据库权和自动授予创作者的专有权利，即“没有任何权利保留”的许可协议。\n\
    \n英国国家档案馆于2016年发布政府许可框架（UK Government Licensing Framework，UKGLF）第5版，包括三种许可方式。第一种是开放政府许可（Open\
    \ Government License，OGL），适用于商业与非商业使用；第二种是非商业性使用政府许可（Non-Commercial Government\
    \ License），仅限于非商业使用；第三种是收费许可（Charged License），许可对象付费使用公共部门数据。其中，英国中央及地方政府默认优先使用的许可是开放政府许可。\n\
    \n**表6-7　各国制定的许可协议比较**\n\n![](images/img10_p296_1.jpg)\n\n**（续表）**\n\n![](images/img10_p297_1.jpg)\n\
    \n此外，加拿大政府开放数据时使用的开放政府许可（Open Government License Canada，OGL Canada），是一个免版税的、永久的、非排他性的许可协议。2014年2月起，澳大利亚政府针对数据门户上的数据开放采用的是国际通用知识共享许可协议4.0版（Creative\
    \ Commons Licenses v4.0）。澳大利亚政府开放许可框架包括八个许可协议：六个知识共享许可协议、限制性许可证模板（RLT）以及BSD 3-Clause软件许可。欧洲联盟许可协议（European\
    \ Union Public License，EUPL）是欧洲第一个开源软件许可协议，其在欧盟委员会的倡议下创建，包含多种官方语言版本。\n\n### 三、我国许可协议的现状和思考\n\
    \n我国在政府数据开放方面缺乏完善的许可机制。一些数据开放平台已经发布许可协议类似的使用条款，例如上海市政府数据服务网的使用条款就列明了网站服务内容、授权声明、接受条款、用户义务、收费政策、隐私保护、免责声明，具备许可协议的一些要素。而大多数平台没有类似的许可框架，仅仅单独出具免责声明。因此需要制定一个完善的政府数据开放许可框架，明确数据产权，对第三方使用、再利用、二次发布数据进行规定与限制并对数据使用与利益协调进行规范。\n\
    \n通过对上海市、北京市、深圳市、广州市、武汉市地方政府的数据开放平台进行调查发现，我国政府开放数据平台皆未采用国际上通用的许可协议，其对于用户使用政府数据的权限主要通过网站页面上的“使用条款”“服务条款”“法律声明”等进行描述。所有开放平台都明确规定，用户可以免费获取、使用网站上的数据（见表6-8）。\n\
    \n**表6-8　我国政府数据开放平台采用的许可协议情况**\n\n![](images/img10_p298_1.jpg)\n\n**（续表）**\n\n\
    ![](images/img10_p299_1.jpg)\n\n## 第五节  \n\n人工智能社会治理和公共服务的公共数据开放模式\n\n上海市、杭州市、贵州省树立的“开放+安全”的地方立法已经奠定我国的基本数据治理模式：数据安全固然是数据应用的红线，但不应成为数字市场发展的阻碍，数据的高质量开放能为数据治理引入市场驱动力，刺激市场主体自发探索数据安全管理框架。因此，我国尚需探索市场资源注入下的公共数据开放运用，即数据的收费开放模式。\n\
    \n政府数据开放在信息时代下面临诸多新议题，由于信息存在的形式、开放的技术与方式已经远远不同于纸质文件信息时代，信息开放的主体、社会属性与开放过程中的利益关系也发生了变化。在信息化水平较低的时期，大数据的概念还没有出现，政府公开其掌控的公共信息是其法定义务。随着信息化水平不断提高，大体量、多维度、强时效的大数据网络开始形成，社会公众对于政府信息公开的质量的要求也随之提高，政府更加注重信息公开的需求导向与安全稳定。因此信息公开的经济成本也不再低廉，如果强制收费，对于公民知情权是否构成阻碍？是否有违政府的公共服务属性？但如果不收费，当前大数据时代下的政府数据公开工作缺乏经济支撑，则公共数据作为一种公共产品有供给不足之虞，这有可能导致数据公开的质量低下；若仅通过财政补贴来支撑数据公开，随着数据量的指数级增长，相关费用无疑会成为政府的一大负担。因此，对于政府掌握的公共数据，其公开与开放是否应当收费？如果收费，收费标准应如何划定？各国政府数据开放的收费实践状况如何？有无借鉴意义？这些都是我国政府数据开放时需要考虑的问题。\n\
    \n### 一、公共数据开放的主要模式\n\n通过对国内外公共数据开放的收费模式进行收集整理，可总结出公共数据开放的三种主要模式：免费、成本定价、“成本+利润”。\n\
    \n##### （一）免费模式\n\n一般而言，公共财政负担全部成本、政府免费开放公共数据的模式一直被认为是政府数据开放的自然选择。从政府收取税金为公民提供公共服务的角度来看，数据开放作为改善政府治理、提高公共福利的手段应当采用免费模式，政府应当将数据免费提供给社会，由社会共享并进行价值增值。免费开放模式为不少国家和地区所采用。《“开放数据晴雨表”全球报告\
    \ 第四版》中开放水平前十名国家的政府数据免费开放状况如表6-9所示。\n\n**表6-9　2017年“开放数据晴雨表”中开放水平前十名的国家数据免费开放情况**\n\
    \n![](images/img10_p301_1.jpg)\n\n表6-9显示，针对政府公共职能中涉及的数据内容，各国基本采取“原则免费，例外收费”的方式。其中，土地所有权数据、政府财政支出数据、公司注册数据在多个国家采取收费获取制。而地图数据、人口普查数据、政府预算数据、立法数据、公共交通时刻表、国际贸易数据、卫生部门业绩、中小教育数据、犯罪统计数据、国家环境统计数据、国家政治选举数据、公共合同数据在这十个开放水平领先的国家中基本可以免费获得。《“开放数据晴雨表”全球报告\
    \ 第四版》中体现出我国免费获取的数据种类包括人口普查数据，政府预算数据，立法数据，公共交通时刻表，国际贸易数据，卫生部门业绩，中小教育数据，犯罪统计数据，国家环境统计数据，公共协议、合同数据等。[^((4))](#chapter6.xhtml#jz_01_1004)\n\
    \n免费开放数据固然是传统政府信息公开的主要渠道，《“开放数据晴雨表”全球报告》关注的也正是政府在行使公共职权、履行公共义务等方面基本的数据公开项目。但是，数据的免费开放并不能解决当下所有的公共数据开放需求，一些需要对数据深度挖掘分析才能够提供的公共服务（例如金融、公共卫生、公共安全等服务），必将产生较大的信息处理成本。数据的免费开放模式并不能为这些公共服务提供良好的经济助力。\n\
    \n##### （二）成本定价模式\n\n政府收集数据、整理数据和存储数据需要大量的人力和财力，大数据中心需要大量的资金才能开展营运，其中包括实施成本费用和运营成本费用。政府前期要投入资金，购入存储设备，建设相应的营运机构，并配备专业人员和相应的工作人员，后期需要对大数据中心进行维护和管理。因此，按成本费用定价收费有其合理性。\n\
    \n国际上的一部分通常做法是除了免费开放数据，在特定领域制定必要限度的成本定价模式，以部分欧盟国家和美国为例：欧盟国家主要通过向增值开发用户收取信息使用费的方式来收回数据采集、加工和整理过程中耗费的管理成本。欧盟2003年的《政府信息资源再利用指令》规定，数据利用的收费原则上应仅限于个人利用请求的边际成本（复制、提供和传播成本）；收费不得超过生产和传播数据的成本，同时考虑合理的投资回报；当收到数据利用请求时，应让申请人知晓收费的计算方式；应提前制定并公布收费标准和数据利用的条件，如果拒绝某项数据利用的请求，必须解释原因并提供帮助信息；如果政府部门利用其持有的信息提供增值信息服务，并与私营部门数据利用者进行竞争，那么政府部门也应付费。美国政府规定，即便是高价值的数据，仍尽量免费提供，如果收费，不得高于信息的传播成本。\n\
    \n成本定价模式存在两方面的不足：一方面，政府的公法人特征要求公共部门不能将公共数据直接出售给出价高者以牟利，而应以补偿成本为基本依据来确定公共数据资源的使用价格；另一方面，政府往往没有能力获知数据开放的全部成本，也不可能获知未来公共数据资源的使用者数量，采用平均成本法或边际成本法会造成补偿不足的现象，从而抑制政府向社会开放公共数据的动力。总之，成本定价法并不是政府进行有偿数据开放时的一种好的政策工具选择。\n\
    \n##### （三） “成本+利润”定价模式\n\n这种模式是在前一模式基础上，按数据的成本加上一定的利润幅度定价并收取费用，即在成本基础上加上一定的利润构成价格。对于政府数据购买者而言，如果政府定价收取费用的数据具有较大的使用价值，可以在使用后获得更大的收益，则这种预期收益将驱使购买者通过付出一定的代价获得政府数据的使用权。该收费模式体现的是“受益者负担原则”，即以行政收费支撑公共资源的有偿使用，其正当性在于政府若能够确认特定的个人或群体获得了国有资源利用的全部或大部分收益，那么补偿费用就不应由全体公民负担，而应由特定获益者负担。\n\
    \n国际上对数据按“成本+利润”定价模式进行收费的国家也不在少数：英国政府除了提供公益性的数据服务，还进行营利性的数据资源开发，收取“合理的投资回报”。英国规定对公开信息的加工和再利用可以收取一定的费用，其收费原理是在生产和传播成本之外，还可收取一定合理的投资回报。政府部门除了从事公益性、非营利的信息服务，还可开展营利性的商业信息服务，与私营部门展开竞争。如英国气象局增值开发的特殊天气预报服务通过收费电话和短信来收费。英国的《政府信息资源规定》将收费分为三种情况：一是在大部分情况下，收取信息生产、发布、传播的边际成本；二是对政府部门工作人员需要投入大量信息成本的数据收费；三是图书馆、档案馆和博物馆，收取信息收集、生产、复制、传播和保存的直接成本和间接成本，此外还可收取版权清理费、合理的投资回报。日本政府的做法是把适当超过成本的定价当作使数据受益者承担支付责任的方式，将特定受益人获得的一部分“特别受益”还原为社会一般利益。欧洲议会在2003年也颁布《政府信息资源再利用指令》，指出公共数据资源的开发再利用以收回成本为目的，而成本的收回包含“合理的投资回报率”。很多欧洲国家将对公共资源的使用收费视为缓解政府整体财政压力的重要手段。例如，法国政府规定，政府公共资源的收费价格确定为“实际发生成本加上合理利润”。德国也允许公共收费的价格包括超过成本的溢价部分，并利用这部分利润来补贴其他亏损的公共服务项目。\n\
    \n“成本+利润”定价模式可以促进利用信息的社会主体与政府形成良好合作关系，促成信息更好的利用，但也存在以下困难：由于预期收益具有不确定性，买方愿意付出的成本是有限的。更关键的是，利润幅度如何核定，以及政府谋取利润行为的正当性何在等现实和理论质疑，都是无法回避的难题。\n\
    \n### 二、收费数据的种类和特征\n\n各国关于收费数据的种类、收费标准的规定都不同，但是从实际运作来看，各国政府会根据数据处理的间接成本的高低来确定数据的收费模式。有学者认为，数据间接成本包括大量的数据采集、清洗、加工、整合、整理、展现。收费的重点是一些增值服务、海量数据的提供。\n\
    \n##### （一）采取成本定价模式的数据\n\n##### 1．需加工处理才能满足需求的数据\n\n指需进行筛选、加工处理或需经过其他加工、运维、软件部署、升级更新工作才能提取的数据。如相关单位要求政府将数据及其相关软件打包部署到自己的独立网络环境中，实现本地化部署、数据管理软件升级、数据更新等一系列活动需要收费的话，可以由软件系统或政府数据的运维方，主要针对数据的运营成本进行。\n\
    \n##### 2．需提供调用接口才能满足需求的数据\n\n这类数据类型复杂、实时性强，需要提供数据调用接口，进行二次开发。如某些部门在原始数据之上提供二次开发接口，以及相应的应用说明和代码示例，用户据此可以轻松调取政府数据资源。这类数据的收费主体包括两部分：一是提供数据资源的数据主管部门，主要针对数据的运维成本进行收费；二是提供二次开发服务或资源接口的服务商，主要针对数据的再利用方面进行收费。\n\
    \n##### （二）采取“成本+利润”半商业模式定价的数据\n\n##### 1．需跨单位调取整合才能提供的数据\n\n指本身横跨多个部门，需要经过复杂的调取处理流程，采集来自不同部门、不同业务、不同区域、不同系统的数据，进行整合后，才能满足用户提出的数据需求的数据。比如，交通运输部门春运黄金周期间的全国人口迁徙量、出行距离特征、热点城市、热点出行路线、热点客运枢纽等方面的数据。针对这类数据，可以参考英国的管理模式，设立专门的机构或委托给相关支撑单位，按照与政府部门签署的协议，以及规定的收费标准，进行半商业化运营，提供数据供给服务。\n\
    \n##### 2．数据量庞大的原始数据\n\n这类海量原始数据，有视频流数据、环境监测数据、海量统计数据等。针对这类数据，可以参考上述的管理模式，由专门的机构或相关支撑单位进行半商业化运营，提供数据支撑服务。\n\
    \n##### 3．时间跨度较大的历史数据\n\n这类数据时间久远，并未完全数字化，要恢复提供需要耗费不少人力物力。针对这类数据，可以参考上述的管理模式，由专门的机构进行半商业化运营，提供数据支撑服务。\n\
    \n### 三、公共数据收费的分层管理\n\n经过对各国数据开放经验和资料的总结，在信息化发展迅速、数据需求多元化的背景下，政府应依数据种类对公共数据收费进行分层管理。\n\
    \n首先，基于政府收取税金提供公共管理和服务的特征，政府开放数据时应秉承“原则免费，例外收费”的做法，最大限度地减少公民获得信息的成本，同时保留政府获得必要的数据处理工作成本报酬的权利。\n\
    \n其次，当数据的开放存在明显的受益者时，应当坚持“受益者承担”原则，让获取数据的特定受益者承担“成本+利润”的费用，形成政府与社会在特定数据领域的良性合作，激发数据运用的多元性和延展性。\n\
    \n最后，从政府数据收费的合法性基础来看，在数据收费的情形中，政府可以基于对数据库享有的“著作权”，向数据使用方主张获得经济利益的权利，但是其获取的经济利益必须同样用于数据公共服务领域；当数据库是政府与多方主体合作建成，不宜由政府对数据库单独主张“制作权”时，而应以“行政收费”的方式，向公民、法人和其他组织作出收取一定费用的行政决定。\n\
    \n**课后习题：**\n\n1．人工智能社会治理和公共服务应用的安全风险的具体表现有哪些？\n\n2．人工智能社会治理和公共服务应用的安全标准的属性和类型特点是什么？\n\
    \n3．结合你对人工智能的认识，谈一谈人工智能社会治理和公共服务应用的未来具体场景有哪些方向。\n\n* * *\n\n[(1)](#chapter6.xhtml#jzyy_01_1001)　例如《上海市“AI+一网通办”工作方案》规定，一网通办方案的核心主体为上海市大数据中心，由上海市推进“一网通办”改革和政务公开领导小组以及市政府办公厅作为监督指导主体，其他各行政部门为协同主体。\n\
    \n[(2)](#chapter6.xhtml#jzyy_01_1002)　SWG-BDS，大数据案例标准特别工作组。\n\n[(3)](#chapter6.xhtml#jzyy_01_1003)　WG7，信息安全管理工作组。\n\
    \n[(4)](#chapter6.xhtml#jzyy_01_1004)　例如北京市政务数据资源网、上海市公共数据开放平台、广州市政府数据统一开放平台、深圳市政府数据开放平台、武汉市政务公开数据服务网等公共数据公开平台都免费开放数据。但也有部分地方平台在服务协议中提到“现阶段免费”，但设置了模糊的期限或限制，如采用“保留收费权利”\
    \ 等表述。信息来源：《2018中国地方政府数据开放平台报告》。\n\n\uFEFF\n\n# 第七章  \n\n人工智能法律服务应用\n\n**本章提要：**人工智能的发展在全球范围掀起观念革命、技术革命和商业革命。人工智能法律服务不仅影响了公众对法律模式的认知，调整了法律规则的内在映射，而且也丰富了法律的价值导向，极大地冲击了现有的思维观念、工作方式和工作效率。这在法律服务领域，既是挑战也是机遇，本章从人工智能法律服务应用的理论基础出发，对人工智能法律服务的实践应用进行归纳，并提出人工智能法律服务目前面临的挑战与其在未来发展的趋势。\n\
    \n## 第一节  \n\n人工智能法律服务应用的理论基础\n\n在对人工智能法律服务的研究中，我们需要了解人工智能法律服务的源头及其在国内外的发展历程，从而为后续的分析、探讨奠定理论基础。\n\
    \n### 一、人工智能法律服务的基本定位\n\n对人工智能法律服务的研究起源于布坎南和海德里克1970年发表的《关于人工智能和法律推理若干问题的考察》一文，此文拉开了在法律服务领域应用人工智能的序幕。"
