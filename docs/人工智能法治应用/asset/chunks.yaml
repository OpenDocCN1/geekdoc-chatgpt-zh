    等表述。信息来源：《2018 中国地方政府数据开放平台报告》。


    # 第七章 人工智能法律服务应用


    **本章提要：**人工智能的发展在全球范围掀起观念革命、技术革命和商业革命。人工智能法律服务不仅影响了公众对法律模式的认知，调整了法律规则的内在映射，而且也丰富了法律的价值导向，极大地冲击了现有的思维观念、工作方式和工作效率。这在法律服务领域，既是挑战也是机遇，本章从人工智能法律服务应用的理论基础出发，对人工智能法律服务的实践应用进行归纳，并提出人工智能法律服务目前面临的挑战与其在未来发展的趋势。


    ## 第一节 人工智能法律服务应用的理论基础


    在对人工智能法律服务的研究中，我们需要了解人工智能法律服务的源头及其在国内外的发展历程，从而为后续的分析、探讨奠定理论基础。


    ### 一、人工智能法律服务的基本定位


    对人工智能法律服务的研究起源于布坎南和海德里克 1970 年发表的《关于人工智能和法律推理若干问题的考察》一文，此文拉开了在法律服务领域应用人工智能的序幕。


