- raw: "总体来看，人工智能在法治领域已获得一定的应用成效，但人工智能技术尚处于不断发展演进的过程中，其在法治领域更大规模的应用落地客观上还面临数据、成本、安全、人才等各种显性和隐性的障碍。而且由于存在“技术黑箱”、算法共振、算法歧视、数据高依赖度等情况，人工智能在法治领域的不当应用可能引发责任边界模糊、智慧司法鸿沟、个人隐私泄露等一系列的风险与挑战，必须对此予以高度的重视，并采取相应的规制措施。\n\
    \n**课后习题：**\n\n1．人工智能法治应用的基本特征有哪些？\n\n2．简述人工智能法治应用的核心议题。\n\n3．人工智能法治应用的场景有哪些？\n\
    \n* * *\n\n[(1)](#chapter2.xhtml#jzyy_01_0816)　张文显：《构建智能社会的法律秩序》，《东方法学》2020年第5期。\n\
    \n[(2)](#chapter2.xhtml#jzyy_01_0817)　［古希腊］亚里士多德：《政治学》，吴寿彭译，商务印书馆1983年版，第167—168页。\n\
    \n[(3)](#chapter2.xhtml#jzyy_01_0818)　郑永流：《法治四章》，中国政法大学出版社2002年版；陈新民：《国家的法治主义——英国的法治（rule\
    \ of law）与德国法治国家（Der Rechtsstaat）之概念》，《台大法学论丛》第28卷第1期。\n\n[(4)](#chapter2.xhtml#jzyy_01_0819)　徐显明：《论法治构成要件——兼及法治的某些原则及观念》，《法学研究》1996年第3期。\n\
