    # 总论


    ## 第一章 人工智能法治的研究范畴


    **本章提要：**近些年来，随着互联网、算法、数据的日趋成熟，人工智能产业迅速兴起，智能芯片、无人机、智能网联汽车、智能机器人等领域蓬勃发展。人工智能在促进社会发展的同时也带来了风险与挑战，个人隐私保护、数据黑产、数据安全、道德伦理等领域均受其影响。为应对人工智能带来的风险与挑战，人工智能法治这一新概念应运而生。在习近平法治思想和全面依法治国的背景下，法治对人工智能发展的保障作用日益凸显，应运用法治思维，对网络、算法、数据、代码等领域进行重点规制，以人工智能法治理论为基础，建立涵盖人工智能立法、司法、执法、守法等领域的人工智能法治体系，为人工智能的健康快速发展提供安全、可靠、可控的保障。


    ### 第一节 人工智能法治的内涵和属性


    人工智能法治是随人工智能的发展而产生的一个新概念，是人工智能时代的法治需求。为更好地理解人工智能法治的内涵和属性，一方面需要对人工智能法治、人工智能法治相关概念进行辨析并阐述人工智能法治的主要特征；另一方面，需要从立法、执法、司法、守法等方面的人工智能法治体系出发，对人工智能法治基础理论、人工智能法治规范体系、人工智能法治前沿问题等进行探讨。


    #### 一、人工智能法治的内涵


    随着智能算法、数据中心、5G、物联网等技术的应用和发展，人工智能产业面临的数据安全、算法监管、责任承担等法律问题日益凸显，运用人工智能法治促进人工智能产业的健康发展已经成为更多人的共识。人工智能法治伴随着人工智能产业的发展而产生，是一个全新的概念。何为人工智能法治？为了明确地辨析人工智能法治的内涵，下文将对人工智能、法治以及人工智能法治进行阐述。


    ##### （一）人工智能法治的概念


    随着人工智能新兴技术的广泛应用，世界各国都在推进智慧国家、智慧城市、智慧社区、智慧政务、智慧司法、智慧检务等方面的建设。传统的治理方式正在经受人工智能技术带来的考验，人工智能法治是在人工智能技术快速发展下应运而生的新概念。人工智能法治目前并没有统一的定义，为更好地阐释人工智能法治的概念，需要分别从人工智能的定义、人工智能法治的定义的角度出发进行阐述。


    ###### 1．人工智能的定义


    2020 年《欧盟人工智能白皮书》指出，人工智能的定义“必须足够灵活以适应技术进步，同时又必须足够精准以提供必要的法律确定性”。关于人工智能的概念，各国并没有达成统一的定义。《牛津词典》将“人工智能”定义为“关于计算机系统的理论和发展，这类计算机系统能执行通常需要人类智能的行为，如视觉感知、语音识别、决策和语言间的翻译等”。《中国人工智能标准化白皮书》认为：人工智能是利用数字计算机或者数字计算机控制的机器模拟、延伸和扩展人的智能，感知环境，获取知识并使用知识获得最佳结果的理论、方法、技术及应用系统。虽然没有统一的定义，但人工智能各种定义的最重要的共同特性，就是人工智能能够对输入的数据、信息或知识进行系统化处理，并且能够将得到的数据、信息或知识进行输出。^((1))


    可以按照不同的标准对人工智能进行分类，根据其智能化程度的不同，可将人工智能分为弱人工智能、强人工智能、超人工智能。根据人工智能与人之间关系的不同，可将人工智能分为由人主导的人工智能、由机器人主导的人工智能和人机融合的人工智能。^((2))根据含义的不同，可将人工智能分为狭义人工智能和通用人工智能。狭义人工智能也被称为弱人工智能，通用人工智能也被称为强人工智能。^((3))


    ###### 2．法治的内涵


    法治指以法而治或依法而治。主要包括两个层面，其一主要是指把法看作统治者治理国家的工具和手段，是与人治相对立的概念，即以法而治。其二是指在民主基础上形成的与专制相对立的一个立国、治国的基本原则，即依法而治。^((4))法治思想可以上溯至古希腊先哲柏拉图和亚里士多德，古代意义上的法治主要是以法而治，更多的是指与人治相对的治国策略。柏拉图在《理想国》中主张哲学王的统治，即主张人治，对法律的作用持消极的态度。《政治家篇》《法律篇》体现了柏拉图晚年关于法治的观点的变化。《政治家篇》在坚持人治的前提下重视法治的作用，《法律篇》则体现了柏拉图的法治观。^((5))亚里士多德的法治观奠定了西方法治思想的理论框架，他是法治理论的开创者。亚里士多德提出了“法治优于一人之治”，并提出：“法治应包含两重意义：已成立的法律获得普遍的服从，而大家所服从的法律又应该本身是制定得良好的法律。”^((6))


    在西方，法治思想和理论可谓源远流长，但直到近代以来，才开始随自由、平等和人权等民主思想广泛传播。^((7))洛克提出的“政治契约论”、孟德斯鸠揭示的“法的精神”、卢梭缔造的“社会契约论”等思想奠定了法治思想的理论基础。富勒提出了八条“法治原则”：法律规则的普遍性，法律规则必须公布，法律不能溯及既往，法律必须明确，法律规则不能相互矛盾，法律不应要求不可能实现的事情，法律规则应具有稳定性，法律规定与实施必须相一致。^((8))拉兹提出：“法治是一种理念：法律应当遵守的一种标准，但是，法律可能（并且有时）的确彻底而系统地违背这一标准。”^((9))拉兹的法治理念不同于富勒的“法治原则”，富勒认为“法治原则”是法律的内在属性，只有符合内在道德的法律才能成为法律。拉兹则认为法律只要能有效地指引人们的行为就符合法治的要求。


    在中国，部分先秦思想家提出了以法为治的治国主张。如《管子·明法》中提到的“以法治国”；《商君书·更法》中主张的“据法而治”；《慎子·君人》中记载的“事断于法”；《韩非子·饰邪》中指明的“以法为本”。在建立统一的中央集权国家之时，法治思想具有重要的作用。但中国古代的“法治”依附于君主专制，强调的是权力和秩序，体现出御用精神。“罢黜百家，独尊儒术”后，儒家学说成为封建社会的正统思想，“法治”理论成为“人治”思想的附属品。1999
    年，“依法治国”入宪。依法治国是党领导人民治理国家的基本方略，是建设中国特色社会主义的必然要求和重要保障。党的十八大以来，党中央明确提出全面依法治国，并将其纳入“四个全面”战略布局。党的十八届四中全会通过《中共中央关于全面推进依法治国若干重大问题的决定》。党的十九大确立习近平新时代中国特色社会主义思想，从建设中国特色社会主义法治体系出发，对加强社会治理制度建设作出全新的战略部署，要求“完善党委领导、政府负责、社会协同、公众参与、法治保障的社会治理体制，提高社会治理社会化、法治化、智能化、专业化水平”，进而“打造共建共治共享的社会治理格局”。2020
    年 11 月，中央全面依法治国工作会议确立习近平法治思想为中国特色社会主义法治建设的指导思想。我们应深入贯彻习近平法治思想，大力加强中国特色社会主义法治体系建设，进而探索自主性的中国法治道路。


    ###### 3．人工智能法治的概念


    人工智能法治是一个新概念、新领域、新理念，是人工智能发展的必然趋势，也是人工智能发展的需要和保障。人工智能在高速发展的过程中，面临着前所未有的机遇，也需要应对前所未有的挑战，良法善治是人工智能健康持续发展的必备理念。人工智能法治是在数字化基础上，以智能科技应用辅助法治运行所形成的法治形态，是传统法治进入智能时代的最新发展。


    1979 年，骆茹敏提出“科技管理中法律调解系统的建立是客观需要，大势所趋”。^((10))1981 年，钱学森提出要建立系统科学及其体系，并开创复杂巨系统科学与技术这一新的科学领域。1985
    年，钱学森在全国首次法制系统科学讨论会上提出了在法律实务中运用人工智能的构想。^((11))2003 年，“中国智能自动化会议（中国香港）”提出了建设“智能法学”（intelligent
    law）学科的想法。2017 年以来，相继出现“未来法治”^((12))“智慧法治”^((13))等新概念。 2018 年 9 月，上海召开了世界人工智能大会。2019
    年 6 月，中国制定了《新一代人工智能治理原则》，提出了和谐友好、公平公正、包容共享、尊重隐私、安全可控、共担责任、开放协作、敏捷治理的人工智能治理八原则。随着新兴技术产业的快速发展，人工智能法治发展迅速。其一，人工智能的法律法规从宏观指导趋向于具体规制；其二，人工智能法学在构建基础理论的前提下，重视法治在人工智能运用层面的作用；其三，人工智能法治应用从综合性应用迈向与专门性应用共同发展的深度融合。^((14))


    ##### （二）人工智能法治的特征


    随着技术的进步和发展，人工智能已经融入人们日常的生活、学习和工作中。在抗击席卷全球的 2020 年新型冠状病毒肺炎疫情的过程中，不论是在疫情的流调和追踪、疫情的防控和抗击还是在生产生活的恢复中，人工智能都发挥了积极的作用。许多国家意识到发展人工智能的重要性并将其确立为国家发展战略，与此同时，人工智能法治的建设也成为各国的重要议程。人工智能法治是人工智能发展和应用的重要产物，反过来人工智能法治必将进一步促进、规范、保障人工智能的发展。^((15))人工智能法治作为一个新概念，具有以下几个特征：


    ###### 1．以人为本


    在人工智能时代，区块链、5G 等高科技的发展使得人工智能的发展越来越迅速，人机协作的情况越来越普遍。目前，关于人工智能体的法律主体地位学界存在肯定说和否定说的争议。肯定说认为，人工智能体具有类人的智慧，应该赋予人工智能体以法律主体的地位。否定说认为，人工智能体虽然具有类人的特征，但其作为人类的创造物也可以被人类所毁灭，始终位于人类的操纵之下，不具有法律主体地位，只能作为人类的附属品。^((16))在人工智能时代，人的主体地位不能动摇，人工智能法治要以人为本，设立法律的根本目的在于保护人格尊严。不论是斯多葛学派从共同人性论的角度出发进行的人格尊严的探讨，还是西塞罗和塞涅卡对人格尊严和人的价值的进一步强调，都表征人是主体，拥有人之所以为人的价值和尊严。^((17))人的尊严是人类共同体成员拥有的高贵和尊荣，是对人平等身份的确认。^((18))


    ###### 2．包容共享


    人工智能时代已经到来，人们的日常生活与人工智能息息相关。人工智能技术的发展颠覆了传统的生产生活方式。智慧国家、智慧城市、智慧社区的建设，也挑战着传统的法治治理模式。包容共享是人工智能法治主要特征之一。党的十九大确立了习近平新时代中国特色社会主义思想，从建设中国特色社会主义法治体系出发，对加强社会治理制度建设做出了全新的战略部署，要求“完善党委领导、政府负责、社会协同、公众参与、法治保障的社会治理体制，提高社会治理社会化、法治化、智能化、专业化水平”，进而“打造共建共治共享的社会治理格局”。党的十九届四中全会进一步提出“坚持和完善共建共治共享的社会治理制度”。共建共治共享为人工智能法治建设提供理论指引和制度保障。人工智能技术的发展带来了共享经济，互联网经济就是典型的共享经济。在大数据的发展下，平台经济也随之出现。只有人工智能法治包容共享、多元发展才能促进人工智能的健康快速发展。


    ###### 3．保障人权


    在人工智能时代，人们的生产生活发生了新的改变。新业态、新模式、新平台接踵而至，人们的行为方式和社会关系都发生了新变革。传统的人权理论面临着新的挑战，如技术的进步使得全方位的监控侵犯着公民的隐私权利、算法黑箱和算法霸权严重侵犯着公民的人格尊严、数据信息掌握不对称造成的数据鸿沟侵犯着公民的自主性及自由等。卡雷尔·瓦萨克提出的“三代人权”理论被大众所知悉，“第一代人权”主张公民政治权利，“第二代人权”强调经济、社会和文化权利，“第三代人权”主张的是生存发展权。


    人工智能时代催生了“第四代人权”，随着网络化、智能化、技术化的快速发展，人工智能完成的将不仅仅是人类的体力劳动，还会是人类的脑力劳动。与此同时，未来人工智能不仅能够代替人类作出初级决策，还能对人类的生产生活资源进行安排和规划。因此，人工智能法治的重要特征之一就是保障数字时代的人权。“数字人权是以数据和信息为载体，展现着智慧社会中人的数字化生存样态和发展需求的基本权利，其目标在于反技术霸权、反数据信息控制，努力消解和应对信息鸿沟、侵犯隐私、算法歧视、监控扩张等人权难题。”^((19))“数字人权”在人工智能法治中彰显了重要的价值和意义，“数字人权”的意义在于，以人权的力量和权威强化对数字科技开发及运用的伦理约束和法律规制。^((20))


    #### 二、人工智能法治的属性


    人工智能法治的属性主要包括两个方面。一方面是人工智能法治体系，包括与人工智能发展相关的立法规范、与人工智能执法活动相关的智能执法、与审理人工智能新型案件相关的司法机制、与人工智能守法相关的数据合规体系。另一方面是人工智能法治的领域，包括人工智能法治基础理论、人工智能法治规范体系、人工智能法治前沿问题。


    ##### （一）人工智能法治体系


    人工智能法治体系是一个有机统一体，包括立法文件和立法规范、执法活动和执法制度、司法审理的制度和机制、守法的合规保护机制和体系。法治的基础理念是良法善治，核心环节是依法办事。《人工智能与未来法治构建上海倡议》提出面向全球、面向未来、面向和平、坚持以人为本、向善安全、创新发展、共享成果、可靠可控、规范有序的原则，构建人工智能法治体系，将人工智能发展应用纳入法治轨道。应推动人工智能与立法、执法、司法、守法等活动深度融合，促进人工智能安全、可靠、可控、健康、持续发展。


    ###### 1．立法


    人工智能立法指人工智能技术在立法层面的应用。立法并不仅仅指制定法律法规的单一环节，而是一个从立项、调查、起草、审议、实施、立法后评估等全方位的系统过程。目前，人工智能在立法领域的应用处在起步阶段，并没有与立法进行广度和深度融合。关于我国的人工智能立法，从中央而言，已基本建成全国统一的备案审查信息平台。从地方而言，主要有两种方式，一是政府自己建立立法信息平台，如上海的立法智能辅助系统、智能立法信息系统；二是政府购买立法辅助产品，如北大法宝智能立法支持平台。由于人工智能立法需要以大数据技术为基础且其依托的立法知识图谱技术并不完善，所以立法阶段的人工智能应用有限，多体现为对法律法规进行简单的整理等辅助性工作。国外人工智能立法的应用同中国一样处在探索和起步阶段，各国对人工智能立法的应用体现为利用区块链技术进行的线上立法投票系统、在新冠肺炎疫情影响下升温的视频会议系统、辅助清理法律法规的系统以及针对立法意见进行文本分析的系统。


    ###### 2．执法


    人工智能执法是人工智能法治体系中的重要环节。人工智能执法利用人工智能技术降低了警力成本、提高了警务效率。执法领域的客观需求促进了人工智能执法的发展。由于公安机关内部多警种分类，我国人工智能执法主要运用于公安机关大数据整合、便民服务、刑事侦查、疫情防控、跨部门办案、禁毒业务、维稳反恐、交通执法、治安防控、金融监管、监狱管理等多个方面。^((21))国外的人工智能执法应用发展较早、使用较普遍，美国、英国、日本、德国等发达国家都对人工智能执法应用进行了研究和探索，主要将其用于预防犯罪、侦破案件、管理边境、维稳反恐以及便民服务等方面。由机器取代人力进行执法，乍看之下似乎是一个节省成本的实用措施；但是在一个现代社会里，执法必须是社会共同体的延伸，由公民本身授予其权力。^((22))人工智能执法在技术层面为警务运用带来了便利，但也在理论层面带来了隐私保护的风险。人脸识别技术被广泛运用于人工智能执法应用中，美国各州在联邦政府之前已经开始对人脸识别技术的使用进行规制，美国主要限制公权力对人脸识别信息的收集和使用，对于私营企业使用人脸识别技术给予较大的宽容与发展空间；欧盟并没有制定专门的人脸识别应用的法律，主要通过欧盟的《通用数据保护条例》（GDPR）进行规制，采取统一禁止的管理模式。^((23))


