- raw: "在2009年5月，总务管理局（General Services Administration）正式上线联邦政府数据的开源网站Data.gov，至今已经披露超过20万个来自各联邦机构、州、县以及城市的数据集供公众、学生、教师以及商业机构进行使用。在2019年1月，美国《开放政府数据法》（The\
    \ Open Government Data Act）出台，将Data.gov网站的政府数据披露正式规定于法律，并规定了标准化的、可被机器读取的数据格式。该法还规定美国总务管理局与美国预算管理办公室（Office\
    \ of Management and Budget）以及美国政府信息服务办公室（Office of Government Information Services）共同负责政府公共数据信息的披露以及治理。该法要求各联邦机构任命一位雇员为“首席数据官”，负责数据的治理、不同机构间的数据协作、向国会提交年度报告等事宜。此外，在美国预算管理办公室中设立“首席数据官委员会”，其成员由各联邦机构首席数据官、电子政务办公室、首席信息官等组成，负责政府数据的公开和治理事宜。\n\
    \n对于政府公共数据以外的公共数据，美国并没有通过统一的部门进行管理以及治理，而是在联邦层面采取各部门分别治理的形式，对涉及侵犯公民隐私、数据安全实践、欺诈交易的行为进行监管和处罚。其中，由于联邦贸易委员会（Federal\
    \ Trade Commission）的权力较为广泛，对于大多数商业实体具有司法权，因此其在数据隐私及安全问题上通常作为联邦层面的专门机构对公共数据保护及治理事宜定下基调，其他部门及机构在各自管辖领域内参照FTC的标准和指引进行更严格的细分管辖。美国的其他联邦层面公共数据专门机构包括美国财政部下的通货监管办公室（Office\
    \ of the Comptroller of the Currency）、联邦通讯委员会（Federal Communications Commission）、证券交易委员会（Securities\
    \ and Exchange Commission）、卫生与公众服务部（Department of Health and Human Services）、消费者金融保护局（Consumer\
    \ Financial Protection Bureau）等。在国家和联邦层面以外，各州政府也相继出台新的公共数据治理法案并设立专门机构进行监管。\n\n\
    《医疗电子交换法》（Health Insurance Portability and Accountability Act，HIPPA）规定本法效力范围内的实体机构需要任命一位HIPAA安全负责人，负责电子医疗信息的信息安全保护事宜。美国马萨诸塞州和其他部分州的监管体系中也出了要求企业任命一位或多位负责企业信息安全的员工的规定。\n\
    \n（2）澳大利亚\n\n澳大利亚的公共数据治理专门机构为国家数据委员办公室（Office of the National Data Commissioner），隶属于澳大利亚总理内阁部门（Department\
    \ of the Prime Minster and Cabinet），但最新的《数据公开和透明法》（Data Availability and Transparency\
    \ Act）将国家数据委员办公室设置为独立的机构，该机构负责公共数据公开的所有事宜。国家数据委员办公室由一位国家数据委员（National Data Commissioner）以及国家数据咨询委员会组成。国家数据委员负责与国家信息委员（Information\
    \ Commissioner）、隐私委员（Privacy Commissioner）以及其他数据相关机构合作，共同推进公共数据的开放以及高效、安全使用。国家数据咨询委员会由政府人员、商业人士、学术机构人士以及社区利益代表人士等组成，负责在数据使用伦理、行业发展、国际协作、技术实施等事宜为国家数据委员办公室提供咨询意见。其他涉及公共数据治理的重要机构还包括信息委员会办公室（Office\
    \ of the National Data Commissioner），负责监管执行隐私法（Privacy Act）、自由信息法（Freedom of Information\
    \ Act）及其他法律所涉及的隐私保护、政府信息披露、信息及数据公开的政策等事宜。\n\n（3）韩国\n\n2013年12月，韩国设立开放数据战略委员会（Open\
    \ Data Strategy Council，ODSC），该委员会是韩国开放数据领域最高决策制定部门，负责审核、协调有关公共数据的重大政策和规划，并对这些政策和规划的执行情况进行评估。该部门人员由公共部门和非公共部门（社会组织、学术机构等）组成。内政部（Ministry\
    \ of the Interior）为开放数据战略委员会提供资金，并负责开放数据的总体规划、检查、基础设施构建，以及开放数据目录的发布。此外，韩国各个公共部门设立公共数据供给专员（Office\
    \ in Charge of Providing Public Data）职务，负责公共数据提供的相关事宜。\n\n韩国在2011年3月出台了《个人信息保护法》，并在同年9月设立了个人信息保护委员会（Personal\
    \ Information Protection Commission），委员会在总统的直接管辖下负责《个人信息保护法》的推进工作，其行政地位低于总统但高于各韩国各部委，直接负责韩国公民个人数据安全，其职责包括制定、修改、执行个人数据保护相关法律及行政措施及进行数据保护领域的国际合作事宜，在数据保护违法事件中还具有调解功能。委员会成员数量不超过15人，由总统直接任命，成员包括国会选举的5名成员和韩国大法院推选的5名成员。其下设有负责在数据保护领域统筹协调各部门合作与国际协作的计划管理部，负责数据安全相关法律司法解释及相关案件审查的审查部，负责数据保护领域法案、政策评估的法案评估部，负责调查监管公共和私人领域数据安全违法行为的调查部，以及负责调解的纠纷调解部。\n\
    \n（4）英国\n\n英国的数据治理相关机构由内阁办公室及政府数字服务局、数据战略委员会、信息专员办公室、信息专员、数字文化传媒体育部、国家档案馆、政府通信总部、国家网络安全中心、司法部以及政府法律部构成。由于英国是全球范围开展包括个人隐私保护、数据安全保护、政府数据公开等数据治理事宜最早的国家之一，其数据治理的专门机构已经经历多次的改革和迭代，形成多部门各司其职、职责边界明确、共同推进数据开放及治理的组织架构。在公共数据公开方面，内阁办公室以及其下属的政府数字服务局处于核心领导协调地位，负责数据治理政策的有效制定、协调和实施，推动政府数据的发布以及政府部门间数据的管理和使用。政府数字服务局还整合原商业、能源和工业战略部下的数据战略委员会，因此也具有保证公共部门制作高质量及数据可信赖，促进公共部门公开数据与企业有效互动提升数据效益等职能。除公共数据公开方面外，信息专员办公室及信息专员负责数据的隐私保护事宜，政府通信总部和国家网络安全中心负责数据安全及数据基础设施建设管理事宜，司法部及政府法律部负责《信息自由法》《数据保护法》等相关法律的司法解释和政策制定事宜。\n\
    \n（5）日本\n\n日本的公共数据治理专门机构为隶属内阁秘书处的开放政府数据委员会（Committee of Open Government Data）以及总务省资助的开放数据促进会（Open\
    \ Data Promotion Consortium）。开放政府数据委员会由公共部门和私营部门的成员组成，负责开放数据政策的执行和跟踪审查。委员会下设数据工作小组和规则工作小组，成员来自政府、学界以及各行各业。开放数据促进会主要负责公共数据开放的数据标准、数据格式指引的制定，旨在促进行业、政府及学术界对公开数据的使用效率。促进会的主要职能为构建融合医疗、农业、行政等不同领域数据的信息合作平台，提供新的数据利用服务及各种数据应用服务。在数据隐私保护方面，日本设立个人信息保护委员会（Personal\
    \ Information Protection Commission），其具有制定推动基本政策、监管、纠纷调解、特别个人信息保护评估（主要指公民身份证信息相关事宜）、公共关系、国际合作、个人信息保护机构管理和汇报国会八大职能。个人信息保护委员会是日本法律系统内最高级别的独立机构之一，其有权对企业进行审计或发出禁止令，但无权进行行政处罚。\n\
    \n（6）新加坡\n\n新加坡于2011年上线政府数据公开平台Data.gov.sg，公开了70个公众机构所提供的包括经济、教育、环境、金融、健康、基础设施、社会、科技和交通等领域的可公开数据集，网站由财政部（Ministry\
    \ of Finance）发起，并由政府技术局（Government Technology Agency of Singapore）运营管理。\n\n新加坡在2013年1月2日成立个人数据保护委员会（Personal\
    \ Data Protection Commission），负责执行新加坡2012年出台的《个人数据保护法》（Personal Data Protection\
    \ Act）。委员会出台多种总体数据保护指引和细分行业数据保护指引。在2019年3月31日，新加坡政府设立公共领域数据安全审查委员会，负责涉及公共领域的数据治理事宜，其成员由贸易与工业部、交通部、通信部等负责人组成。公共领域数据安全审查委员会负责公共数据的数据安全标准及监管事宜。\n\
    \n##### 2．层次多元的安全标准指引\n\n数据安全标准在保障公共数据安全、推动行业健康有序发展的过程中发挥着引领和支撑作用，完善的数据安全标准能够有效提升数据安全保护能力，助力数字经济高质量发展。针对敏感数据泄漏、访问权限混乱、隐私信息滥用等现实性数据问题，应加强数据防护措施，为此，国内外相关标准化组织均制定了数据标准，旨在规范大数据应用，切实保障大数据安全。\n\
    \n（1）数据安全的国际标准\n\n世界范围多个标准化组织正在实施大数据安全的数据标准化，主要有国际标准化组织/国际电工委员会的第一联合技术委员会（ISO/IEC\
    \ JTC1）下属的大数据工作组（WG9）和安全技术分委员会（SC27）、国际电信联盟电信标准化部门（ITU-T）、美国国家标准与技术研究院（NIST）等（见表6-3）。\n\
    \nISO/IEC JTC1是一个信息技术领域的国际标准化委员会，由17个分委员会（SC）和2个报告小组组成，各设有秘书处。这17个分委员会分别处于不同的12个技术领域。JTC1改革后的工作范围限于信息技术的国际标准化。信息技术包括系统和工具的规范、设计和开发，涉及信息的采集、表示、处理、安全、传送、交换、显示、管理、组织、存储和检索等内容。JTC1的成员类型分为3种：参加成员（P-MEMBER）、观察成员（O-MEMBER）和联络成员。目前，JTC1有27个积极成员（澳大利亚、比利时、巴西、加拿大、中国、捷克、丹麦、埃及、芬兰、法国、德国、匈牙利、爱尔兰、意大利、日本、韩国、荷兰、新西兰、挪威、葡萄牙、罗马尼亚、南非、斯洛文尼亚、瑞典、瑞士、英国和美国）、38个成员、16个内部联络成员（指ISO和IEC范围内的技术委员会）以及22个外部联络成员（其他组织或机构）。\n\
    \nITU-T是国际电信联盟管理下的专门制定远程通信相关国际标准的组织。由ITU-T指定的国际标准通常被称为建议书（Recommendations），ITU-T的各种建议书的类型由一个首字母来代表，称为系列，每个系列的建议书除了代表类型的字母以外还有一个编号，例如“V.90”等。\n\
    \nNIST于2012年6月启动关于大数据相关基本概念、技术和标准需求的研究，2013年5月成立NIST大数据公共工作组（NBG-PWG），该工作组对所有感兴趣的相关方开放，无会员费，旨在通过结合行业、学术和政府等各方力量加速对大数据这一新兴产业的采纳，其成果由NIST评审和发布。\n\
    \n**表6-3　一些国际大数据安全标准简介**\n\n![](images/img10_p287_1.jpg)\n\n**（续表）**\n\n![](images/img10_p288_1.jpg)\n\
    \n（2）我国的数据安全标准\n\n我国正在开展大数据和大数据安全相关标准化工作的标准化组织，主要有国家标准化管理委员会（SAC）下属的全国信息技术标准化委员会（以下简称信标委，委员会编号为TC28）和全国信息安全标准化技术委员会（以下简称信安标委，委员会编号为TC260）等。信标委主要负责制定和完善我国大数据领域标准体系，组织开展大数据相关技术和标准的研究，推动国际标准化活动，对口ISO/IEC\
    \ JTC1 WG9大数据工作组。信安标委主要负责制定和完善我国大数据安全领域标准体系，组织开展大数据安全相关技术和标准研究。\n\n为了加快推动我国大数据安全标准化工作，信安标委在2016年4月成立大数据安全标准特别工作组，主要负责制定和完善我国大数据安全领域标准体系，组织开展大数据安全相关技术和标准研究，已有多项建成和在报批阶段的标准（见表6-4）。\n\
    \n**表6-4　我国大数据安全标准（含起草报批）[^((2))](#chapter6.xhtml#jz_01_1002)[^((3))](#chapter6.xhtml#jz_01_1003)**\n\
    \n![](images/img10_p289_1.jpg)\n\n随着大数据应用场景越来越丰富，大数据安全问题越发重要。制度与技术作为大数据应用的双轮驱动核心，二者互为依托，大数据安全标准是技术的重要组成部分，亦是制度的有力支撑，在大数据整体市场中承担着规范各方行为主体的技术行为的职责。大数据安全与数据确权、隐私保护和开发共享密切相关，因此大数据安全标准的制定和更新应及时、有效地跟上大数据应用发展的步伐。\n\
    \n从上述国内外相关标准化组织制定或拟制定的大数据安全标准来看，我国虽然在大数据安全标准方面起步较晚，但积极主动参与国际通用标准化建设，如《信息技术大数据参考架构第4部分：安全与隐私保护》以及两项研究项目《大数据安全能力成熟度模型》《大数据安全实施指南》，均由我国专家主导。以信息技术为核心的全面布局表明以美国为代表的发达国家在大数据研发和应用的基础数据标准上具备深厚的“沉淀池”，其很早注意到政府公共部门、企业独立主体、行业领域专题、个人隐私保护等多方在数据安全保护和共享方面的差异性和衔接性。诸如WG9在研的大数据术语和参考架构等国际标准和相关技术报告对我国的大数据标准有重要的指导和借鉴意义。作为后起之秀，我国相比外国建立了更为深入和广泛的大数据安全标准体系，包含大数据基础概念、数据共享交换、全周期技术管理、平台和工具、运维和评估、隐私安全、行业应用等七个要素。应通过与国际上其他标准化组织合作，快速进入国际标准化建设轨道，融合大数据应用产业的国际生态圈，推动我国大数据在多领域、多行业安全、高效发展。\n\
    \n## 第四节  \n\n人工智能社会治理和公共服务应用的协议许可\n\n人工智能的社会治理和公共服务应用需要通过许可协议机制来实现，开放许可协议是政府数据开放政策法规制定的重要环节。2015年1月，万维网基金会发布的《开放数据晴雨表（第二版）》指出，要真正实现数据开放，必须在一个许可协议下，以可机读的形式发布，这是数据开放的基本条件。由此可知，许可协议是用于评估政府数据开放程度的重要指标，政府数据开放许可协议已成为国际组织和各国政府数据开放关注的重要课题之一，相关研究已在国际上引起了重视。\n\
    \n政府数据往往成为著作权、数据库权等各种权利的客体，这使得使用者在利用数据时受到限制，甚至面临侵权风险，开放许可机制就成为解决这一问题的关键点。许可方式直接影响到数据利用与增值的范围和方式。开放政府许可协议通过授权的方式为开放政府数据的利用与开发提供法律制度保障与支持，它直接决定了开放数据能否实现其最终目的，即数据利用与增值。对于受到权利保护的政府数据，要通过许可协议授权公众使用，规范其利用行为，使公众能够对政府数据在最大范围内进行多元化应用。对不同类型、属性的数据实行不同的开放许可协议，一来有利于保护商业秘密数据，二来有利于实现涉及商业秘密数据的交易向特定人员的开放。\n\
    \n2008年发布的《经合组织委员会关于增强公共部门信息的访问和更有效的使用的建议》，强调开放许可协议的价值：最合适的开放许可协议能够促进公共部门数据利用和再利用的最大化；许可条款应该是非歧视的、非排他性的；除非必要，不应设置限制用户获取、使用、处理、分享信息的条件。2013年，《开放数据宪章》提到，政府部门应该使用开放许可或者其他相关措施，让信息使用没有任何限制、费用，无论用于商业领域还是非商业领域。2014年，美国白宫科学与技术办公室（OSTP）开展主题为开放政府数据许可协议的讨论。2018年，美国国会正式通过《开放政府数据法案》。\n\
    \n国际上开放许可有多种形式。英国政府许可框架（UKGLF）提出了三种开放政府协议：第一种是在商业与非商业使用和再利用情况下的开放政府许可协议。第二种是仅限于非商业目的的非商业性政府许可协议。这两种协议都允许公众免费复制、发布、传播、修改信息，甚至进一步挖掘数据中蕴藏的商业或非商业价值。第三种是对数据再利用收取费用的收费许可协议，依此协议，公众在付费后可以排他性地使用特定数据。\n\
    \n### 一、国际组织制定的许可协议\n\n许可是准许组织机构或个人再利用受到著作权或数据库权等保护的信息和资料的一种机制，它明确了利用者和再利用者被准许做什么和受到哪些权限限制。国际组织制定的开放数据许可协议的类型主要包括两种：知识共享许可协议（CC协议）和开放数据共用许可协议。\n\
    \n其中，知识共享许可协议是知识共享（Creative Commons，CC）组织发布的许可，适用于创作内容，例如照片、文本、数据等对象。知识共享许可协议主要包含六个基本类型：署名（CC-BY）；署名—相同方式共享（CC-BY-SA）；署名—禁止演绎（CC-BY-ND）；署名—非商业性使用（CC-BY-NC）；署名—非商业性使用—相同方式共享（CC-BY-NC-SA）；署名—非商业性使用—禁止演绎（CC-BY-NC-ND）。\n\
    \n此外，知识共享组织还提出公共领域许可协议（CCO）、公共领域许可（Public Domain）、附加许可协议（CC+）。有关知识共享许可协议的类型以及对应的许可内容见表6-5。\n\
    \n**表6-5　知识共享许可协议的类型**\n\n![](images/img10_p293_1.jpg)\n\n知识共享许可协议适用范围广泛，适用对象包括受著作权保护的文本、照片、幻灯片、电影、音乐、数据集、数据库、其他形式资料等，独独不适用于软件内容。从许可权限来看，知识共享许可协议4.0版本许可的权利包括邻接权、表演权、广播权、录音权和独特的数据库权。2004年以来，知识共享组织承认各国版权法的不同，鼓励各国发展自己的许可协议版本。目前，我国知识共享许可协议的使用者有国家图书馆、中国科学院国家科学图书馆、超星公开课等开放教育资源、科学松鼠会等。"
