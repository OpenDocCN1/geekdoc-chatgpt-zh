    年第 2 期；李本：《美国司法实践中的人工智能：问题与挑战》，《中国法律评论》2018 年第 2 期；左卫民：《热与冷：中国法律人工智能的再思考》，《环球法律评论》2019
    第 2 期。


    (3)　《最高人民法院关于深化人民法院司法体制综合配套改革的意见——人民法院第五个五年改革纲要（2019—2023）》（法发〔2019〕8 号）。


