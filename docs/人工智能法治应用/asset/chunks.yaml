    \n\uFEFF\n\n# 附录  \n\n人工智能法治应用实例选\n\n### 一、立法应用\n\n2018年2月，上海率先建成“智慧法制”立法信息平台，与办公厅公文系统对接，将电子数据一键推送，使地方行政立法工作有了人工智能辅助，有利于立法工作的有序推进。\n\
    \n2019年2月11日，时任美国总统唐纳德·特朗普签署一项行政命令（《保持美国在人工智能领域的领导地位》），该命令旨在刺激人工智能的发展和监管。其通过指示联邦机构优先投资于人工智能的研发，巩固美国的全球地位。\n\
    \n2020年1月，辽宁省人大代表履职信息化平台及移动客户端“辽宁人大”APP，省人大代表可以在会议期间，使用APP查阅资料、履职交流、传递意见等。该APP实现了地方电子立法化，提高了立法效率。\n\
    \n2020年2月19日，欧盟委员会发布《人工智能白皮书》，旨在通过提升欧洲在人工智能领域的创新能力，防范和处理人工智能技术带来的各类风险，推动道德的和可信赖人工智能的发展。\n\
    \n2020年5月，美国出台《生成人工智能网络安全法》，要求：美国商务部和联邦贸易委员会明确人工智能在美国应用的优势和障碍；调查其他国家的人工智能战略，并与美国进行比较；评估供应链风险以及提出如何解决这些风险。\n\
    \n2021年2月24日，国家法律法规数据库正式开通，旨在促进法治建设与信息化工作的有机融合，实现立法公开的及时性、系统性、便利性。\n\n2021年4月21日，为将欧洲变成值得全球信赖的人工智能中心，加强整个欧盟范围内对于人工智能的使用、投资和创新，欧盟委员会通过《人工智能法》提案，旨在建立关于人工智能技术的统一规则。\n\
    \n2021年6月21日，欧盟数据保护委员会（EDPB）和欧盟数据保护监督局（EDPS）呼吁欧盟全面禁止在公共场所使用人工智能自动识别人类特征，以对“敏感个人信息”类型数据进行保护，这对于人工智能立法有指引作用。\n\
    \n2021年6月28日，深圳推出全国人工智能领域首部地方性法规，规定市政府设立人工智能伦理委员会，推动构建覆盖全面、导向明确、规范有序、协调一致的人工智能伦理治理规则。\n\
    \n在美国，通告和评论项目（Notice and Comment Project）使公众可以方便快捷地查看400多万份政府文件，包括在《联邦公报》（Federal\
    \ Register）上发表的联邦法规和地方政府发布的通告。该项目利用先进分析和自然语言处理来摄取政府文件，追踪政策、法律和规章的变化。用户可以轻而易举地对拟订中的联邦法规进行评论或投票。网站数据每天都会更新，实时显示新的提案和趋势。在提案变成法律之前，用户可以利用网站内部集成的社交媒体和网上的最佳写作技巧来有效地宣扬他们的观点，寻求其他人的支持。\n\
    \n海牙国际刑事法院（ICC）推出判例法数据库，该数据库提供免费、便捷和不断更新的判例法查询服务，包括与国际犯罪和国际刑事诉讼程序、被告权利和受害者权利有关的判例。\n\
    \n### 二、司法应用\n\n2016年7月，美国威斯康星州最高法院批准使用一种风险评估算法（COMPAS）对被告的犯罪危险等级进行测算，并最终依据该算法量刑。\n\
    \n2017年，2月23日，中国社会科学院法学研究所发布《法治蓝皮书：中国法院信息化发展报告No.1（2017）》。蓝皮书指出，北京法院依托“睿法官”系统，整合多类数据资源进行大数据挖掘分析，为法官判案提供统一、全面的审理规范和办案指引，同时自动生成裁判文书，统一法律适用，提高审判质效。\n\
    \n2017年4月，海南省高级人民法院引入大数据和人工智能技术，自主研发覆盖量刑规范化改革的全方位智能量刑辅助办案系统，它不仅能辅助法官办案，还能破解量刑公正难题。这也使得海南量刑规范化工作一直走在全国前列，多次受到最高人民法院的肯定，一些经验在全国推广。\n\
    \n2017年12月，巴西联邦最高法院启动VICTOR系统。系统旨在加速法院诉讼时间表中相同或相似案件的审理。系统会阅读案件相关材料，分析词语的语境并将案件按照联邦最高法院划定的类别进行分类，该系统将会大幅度提高法院工作效率。\n\
    \n浙江省玉环市人民法院刑庭已将“政法一体化办案系统e助理”运用到审判执行的全流程中，自2018年9月系统使用以来，审判效率得到明显提升。系统利用“阿里飞狐”人工智能技术，将审判事务性工作从原有的人工操作升级为智能操作，通过软件机器人代替人力完成重复性的任务。\n\
    \n2019年1月23日，由上海市第二中级人民法院公开开庭审理的一起抢劫案件首次运用“刑事案件智能辅助办案系统”（即“206系统”）辅助庭审，这也是全国法院首次运用“206系统”辅助庭审。“206系统”的证据标准、证据规则指引功能可实现证据资料的智能审查，为办案人员提供标准化指引。\n\
    \n2019年2月，吉林省高级人民法院紧跟最高人民法院建成区块链吉林节点。2019年5月24日，区块链吉林节点正式并入人民法院司法区块链，并开始将全省法院诉讼的电子卷宗、档案和流程节点信息等材料进行上链固定。吉林省高级人民法院利用区块链技术，在智能审执衔接流程中通过规划“智能审执衔接行为链”，串联起审判系统、电子法院、“12368”短信平台、执行系统以及司法区块链平台五大系统，保证可信司法公开、可信流程公开。\n\
    \n2019年6月14日，阿里巴巴达摩院发布了一项新研究：AI进化到助理法官水平，可一秒“判案”。阿里巴巴推出的“AI法官”针对交易纠纷类案件建立了整套审判知识图谱，能够迅速分析案情并在极短时间内向法官给出判案建议。\n\
    \n2020年8月山西省高级人民法院开始推广建设面向全山西所有法院的“智慧案管平台”，其拥有全省审判管理、审判监督、司法公开等重要功能。\n\n浙江省高级人民法院在确定镇海法院为人工智能辅助审判试点法院后，2020年9月16日下午，法官利用人工智能程序“凤凰智审”，实现当庭智能生成判决、当庭宣判、当庭送达、当天一键归档。\n\
    \n2021年4月6日，印度最高法院宣布推出人工智能门户网站SUPACE，旨在使司法服务提供机制更加透明、更有效率。\n\n2021年4月21日，深圳市龙华区人民法院首次使用区块链证据核验平台，对案件证据进行当庭核验，实现知识产权民事案件的快速审理。\n\
    \n加利福尼亚州洛杉矶县高等法院引入专门处理交通传票的人工智能Gina，其可以说五种语言，每月可为5000多名当事人服务。\n\n加拿大引入最新电子谈判系统Smartsettle代替人工调解，当事人在系统中可以输入自己的策略以及价格底限，这一过程是不公开的，由系统采用人工智能算法并参考各方的竞标策略和优先事项推动双方进行谈判，提高谈判成功率。\n\
    \n总部位于爱沙尼亚首都塔林的律师事务所Eesti Oigusbüroo通过聊天机器人提供免费法律援助，并生成简单的法律文件发送给收款机构。\n\n###\
    \ 三、执法应用\n\n2014年，最高人民法院建立“总对总”网络查控系统，与公安部、民政部、自然资源部、交通运输部、央行、银保监会等16家单位和3900多家银行业金融机构联网，可以在系统上查询被执行人全国范围内的不动产、存款、金融理财产品、船舶、车辆、证券、网络资金等16类25项信息。\n\
    \n2014年，洛杉矶警察启用实时监控系统（RACR），该系统能分析执法部门收集的隐蔽线索，实现执法信息共享。系统主要根据社交网络中的海量数据进行加工，可以迅速地从海量数据中锁定破案的关键线索。\n\
    \n2015年7月，芝麻信用和最高人民法院签署了对失信被执行人信用惩戒合作备忘录，开创第三方商业征信机构与法院联合开展信用惩戒的先例，借助云计算、机器学习等技术将被执行人失信信息纳入综合信用评价体系，可降低失信被执行人信用评分，并间接影响失信被执行人享受各类信用服务的权利。\n\
    \n内蒙古自治区鄂尔多斯市公安局开发出无人机三维警力部署系统，在2017年《联合国防治荒漠化公约》第十三次缔约方大会上首次实战应用。其主要应用于隐蔽侦查、大型安保、反恐特战等业务。通过无人机三维警力部署系统可以实现对警力部署场所快速导入部署方案，开展警力部署。\n\
    \n2017年，迪拜警方引进机器人警官。这些机器人主要位于城市周围的旅游景点，能够执行有限的功能。人们可以利用其配备的触摸屏报告犯罪行为，其装备的摄像头可将实时图像传输回正在监控的操作室。这些机器人能够说六种不同的语言，这使得他们能够更好地与语言不通的游客进行交流。\n\
    \n2017年，英国警方引入危害评估风险工具（HART），旨在防止犯罪现象的发生，判断嫌疑犯再次犯法的风险，并将其分为低、中、高三个级别。\n\n2017年，印度旁遮普警方的有组织犯罪控制部门使用旁遮普人工智能系统（PAIS）破获一起毒品交易案，PAIS是一个使用人工智能辅助面部识别算法，可与国家警察维护的10万多名犯罪记录的数据库相匹配。\n\
    \n2018年，全国首套人工智能执法系统在深圳启用，其采用人工智能技术进行智慧防疫检测。\n\n2019年，在日本，专家正在研究开发一套新的交通系统，旨在通过应用人工智能技术分析数据来缓解城市交通拥堵。通过分析车流量数据，以及摄像头采集到的车辆位置等图像信息，人工智能系统将控制信号灯的切换以及时长等，从而缓解拥堵状况。\n\
    \n2020年，科大讯飞海南自贸港人工智能翻译服务中心运用智能语音机器人进行社区疫情排查和防疫宣传。\n\n2020年，美国海关与边境保护局（CBP）宣布将在美国和墨西哥的边境入境口岸之间埋设数千个地面传感器，借助人工智能，布置无人机和摄像头，对越境现象进行检查。\n\
    \n2021年，北京市顺义区发生局部聚集性疫情，人工智能技术团队绘出患者流调轨迹地图并帮助疾控人员迅速锁定管控范围。\n\n2021年，日本警察厅决定引进通过人工智能技术解析嫌疑人在社交网站（SNS）所使用的内容，并据此制作人物相关图的搜查系统。SNS有时会被用作特殊诈骗等犯罪活动中许多涉案人员的“犯罪平台”，警察厅希望该系统能有助于弄清并查出包括幕后主使在内的犯罪组织全貌。\n\
    \n不仅如此，根据美国政府问责局的数据，已有16个州允许联邦调查局使用面部识别技术将犯罪嫌疑人的面孔与其驾驶执照或身份证的照片进行对比。此外，至少有1/4的州或地方的警察部门可以通过它们或其他机构的系统实现面部识别。使用面部识别技术可以更容易、更有效地抓捕犯罪分子，并让国家免受恐怖主义之害。\n\
    \n在波士顿马拉松爆炸案中，大数据技术让警方得以快速分析48万多幅图像。这些图像即为非结构化数据。对嫌疑犯的详细描述使分析人员可以撰写代码和算法，对图像进行迅速分析，寻找异常情况和特定模式。从传感器信息中自动筛查犯罪行为令实时分析得以实现，其缩短了决策时间，减少了接触敏感数据的人员或系统的数量。\n\
    \n美国联邦住房管理局（FHA）利用大数据分析管理正向现金流基金，在房地产泡沫破裂期间，FHA是唯一一家不需要救助的次贷保险机构。它运用大数据分析来助力预测违约率、偿还率和索赔率。另外，它还利用大数据技术为可能出现的场景构建现金流模型，以确定维持正向现金流所需的保费。\n\
    \n### 四、法律服务应用\n\n2015年，全球首位人工智能律师Ross入职了美国最大的全球律师事务所之一——Baker & Hostetler，Ross在这家公司的破产业务部门工作，负责协助处理企业破产相关事务。机器人律师Ross可通过阅读各项法律法规、收集证据、做出推论，给出与证据高度相关的答案。拥有机器学习能力的它可以在查阅以往的法律案例和与人类进行的互动当中不断提升自己的答疑能力，使自身性能与准确率获得持续提升。这个学习系统还可以帮助人类律师更新他们的法律法规。"
  fmt: '

    网络空间是一个真实的虚拟存在，是一个没有物理空间的独立世界。在这里，人类实现了与肉体分离的“数字化生存”，拥有了“数字化人格”。“数字化人格”就是“通过个人信息的收集和处理勾画一个在网络空间的个人形象”——凭借数字化信息而建立起来的人格。个人信息包括当事人不愿他人知道或他人不便知道的隐私信息，主要类别有：个人登录的身份和健康状况、个人的信用和财产状况、电子邮箱地址、网络活动踪迹等。在信息化社会，这些零散的和广泛的个人信息有可能被收集，并被数据处理，拼合成所谓数字化人格——在很大程度上是被迫建立的，个人毫不知情的人格。在今天和未来，当移动互联网、大数据和机器智能三者叠加后，我们将生活在一个“无隐私的社会”。


    人工智能的发展以海量的数据为基础支撑，当下大数据及移动互联网技术掀起的全球技术革命的浪潮使得一切都透明起来，社会公众的隐私泄露似乎被默认，一场信任危机已经到来。但是人工智能发展的根本目的是服务人类，而不是使人类为其所控。当下社会对公民个人信息的保护也在不断深化。


    美国的一项研究将隐私构想成社会利益和归属的标记，这一定位旨在扩大国家赋予和规制的公民身份的标准含义，即隐私不仅是法律上的自决权利，而且是作为人格和国家身份的感知基础的社会权利。有学者认为，个人因身份感被侵蚀而成为在线的海量类似信息有机体之一。自我暴露为线下身份的重新定义和新的关系的建立提供了一个平台，从而使我们可以重新配置和定义这些空间中的关系和社区的概念，让我们在没有实体的信息圈里重新树立、调整自己的身份，由此迎来自主构建信息身份这种信息隐私的数字化信息时代，因此在数据时代应当适应新的信息环境的隐私观念，对隐私认同持全新而非固化的理解。[^((9))](#postscript1.xhtml#jz_01_1018)有学者认为，敏感的个人数据可能被用于对个人进行不公平的推断，特别是当现有数据库本就对某些种族或性别的人存有偏见时，其就可能进一步加剧现存的社会不平等。若无适当的隐私保护机制，个人数据被滥用的情况或将层出不穷，这不仅会加剧社会歧视，也将影响信息社会的可持续发展。[^((10))](#postscript1.xhtml#jz_01_1019)有学者积极关注数字经济时代个人隐私权的保护问题，认为国家要积极承担数据保护责任，例如限制数据流动，要求数据本地化，形成实质上的数字贸易壁垒，但是其中对个人数据的存储限制、目的限制、数据最小化等限制要求，又是对个人信息严格保护的要求，旨在防止个人数据时刻处于被任意采集和商业化滥用的危险境地。[^((11))](#postscript1.xhtml#jz_01_1020)因此，在当下制定隐私政策已经成为满足个人信息保护现实需求的重要方式之一。通过研究国外经验，可发现美国主要将隐私政策界定为一种企业的自律规则，侧重于通过行政手段对个人信息提供保护。而在我国，公民个人信息权益已经得到了《民法典》的确认和保护，因此对隐私政策的法律调整也应当以此为基础展开。我国目前尚未形成明确的个人信息保护模式，同时，固有法或传统观念对互联网时代的影响也并不明显，这恰是一种机遇。因此，我国的隐私政策宜采用一种公、私法律手段相结合的方式。即一方面注重通过行政手段对企业自律行为进行调整与规制，以弥补私法在调整隐私政策方面的不足；另一方面，重视发挥私法在调整隐私政策方面的作用，以弥补行政手段在调整隐私政策方面的不足，并充分发挥个人在隐私政策调整方面的作用。[^((12))](#postscript1.xhtml#jz_01_1021)此外，2020年人类面临重大公共卫生危机，在此背景下，健康码的推广成为我国疫情防控的创举，在与健康码相关的个人信息保护中，应弱化知情同意原则之同意规则，坚守知情规则，并强化最小必要原则，严格限制个人信息处理的范畴、期限和披露。[^((13))](#postscript1.xhtml#jz_01_1022)综上而言，数字时代的隐私权保护，一要对隐私权进行客观解读，二要充分利用市场和行政手段来化解经济发展便利和个人隐私之间的冲突，这意味着要明确法治治理的边界。


