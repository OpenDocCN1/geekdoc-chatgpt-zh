    # 第七章 人工智能法律服务应用


    **本章提要：**人工智能的发展在全球范围掀起观念革命、技术革命和商业革命。人工智能法律服务不仅影响了公众对法律模式的认知，调整了法律规则的内在映射，而且也丰富了法律的价值导向，极大地冲击了现有的思维观念、工作方式和工作效率。这在法律服务领域，既是挑战也是机遇，本章从人工智能法律服务应用的理论基础出发，对人工智能法律服务的实践应用进行归纳，并提出人工智能法律服务目前面临的挑战与其在未来发展的趋势。


    ## 第一节 人工智能法律服务应用的理论基础


    在对人工智能法律服务的研究中，我们需要了解人工智能法律服务的源头及其在国内外的发展历程，从而为后续的分析、探讨奠定理论基础。


    ### 一、人工智能法律服务的基本定位


    对人工智能法律服务的研究起源于布坎南和海德里克1970年发表的《关于人工智能和法律推理若干问题的考察》一文，此文拉开了在法律服务领域应用人工智能的序幕。

    '
  trans: '


    知识领域许可协议完全将许可对象置于公共领域，其他六种基本许可类型许可的层级也不尽相同，具有许可层级丰富的特点。值得注意的是，知识共享许可协议中的 CC-BY-NC、CC-BY-NC-SA、CC-BY-NC-ND
    和 CC-BY-ND 许可协议类型由于不能应用于商业领域，同时禁止演绎等要求会限制数据的开放，因此不是开放数据许可协议的理想型协议。


    **表 6-6　开放数据共用许可协议的类型**


    ![](img/img10_p294_1.jpg)


    另外，开放数据共用许可协议是开放知识基金会（OKF）发布的许可协议类型，旨在规范和约束数据提供者和数据使用者在使用、发布、修改和传播数据时的责任与义务，是国际通用的许可协议类型。开放数据共用许可协议包含三种类型：公共领域贡献与许可（Public
    Domain Dedication and License，PDDL）、开放数据共享署名许可（Attribution License，ODC-By）和开放数据库许可（Open
    Database License，ODC-ODbL）（见表 6-6）。


    开放数据共用许可协议是专门针对数据或数据库开放的许可协议类型，具有许可对象单一的特点。开放数据共用许可协议适用于复杂的数据集内容和数据库作品，不适用于计算机软件、电影、音乐等创作作品，许可对象单一；开放数据共用许可协议应用领域不够广泛，目前远不及知识共享许可协议广泛，国外政府数据开放中目前有法国使用开放数据库许可协议（ODbL）。开放数据共用许可协议是国际通用的开放许可协议，其包含的三种许可类型均符合开放的条件，不限制商业领域使用和对数据的修改、演绎等，其中限制最多的开放数据库许可（ODbL）也可以用于商业领域。


    ## 二、域外各国许可协议比较


    各国制定的许可协议即开放政府许可协议，是指政府部门专门为开放政府数据或者公共部门信息制定的许可协议，也是促进数据开放的重要许可协议类型（见表 6-7）。国外政府开放数据时大多采用已有的许可协议，也有部分国家采用知识共享许可协议或其移植版，由于各国移植知识共享协议时只是对其稍作修改，因此下文对知识共享许可协议不再做深入讨论。


    美国联邦政府开放政府数据时使用知识领域许可协议。如其所述，知识领域许可协议是放弃了所有权利的保护，包括著作权、数据库权和自动授予创作者的专有权利，即“没有任何权利保留”的许可协议。


    英国国家档案馆于 2016 年发布政府许可框架（UK Government Licensing Framework，UKGLF）第 5 版，包括三种许可方式。第一种是开放政府许可（Open
    Government License，OGL），适用于商业与非商业使用；第二种是非商业性使用政府许可（Non-Commercial Government License），仅限于非商业使用；第三种是收费许可（Charged
    License），许可对象付费使用公共部门数据。其中，英国中央及地方政府默认优先使用的许可是开放政府许可。


