  trans: '

    2020 年 1 月 20 日，上海出现 16 例本地新冠肺炎确诊病例。上海通过“一网通办”和“一网统管”平台，第一时间启动应急机制，迅速锁定场所、锁定病例、锁定识别对象，开发疫情智能防控系统，精准有序地遏制住疫情。截至
    2020 年 1 月 27 日，一共安排核酸检测累计筛查 4.1 万多人，疫情很快得到控制。随着防疫重点逐渐转向境外流入控制，疫情智能防控系统又纳入境外人员服务系统，集纳了入境、集中隔离、居家隔离等信息，令整体防疫效率大幅提升。在上海“一网统管”疫情智能防控系统中，上海各个小区的居家观察人数、健康状况、重点地区来沪人数、小区封闭状况、卫生消毒状况等数据全部汇总，一目了然。这套疫情智能防控系统平台深刻地改变了流行病学调查。例如新冠肺炎疫情期间，数据显示有些区的隔离点酒店已经满客，有些区的酒店却几乎空置，此时进行更高效的调整，再结合住建部门留存的建筑数据，有助于进一步筑牢疫情防控的安全屏障。


    在上海“一网统管”疫情智能防控系统结合社区基层力量，在上海新冠肺炎疫情期间防控效果显著。居家隔离人员的监测涉及的公安民警、卫生防疫站和居委会等方面，必须联勤联动。疫情智能防控系统确认的居家隔离人员回到小区后，公安民警
    12 小时内必须上门确认，再将每天消杀和测量体温的任务指派给居委会，后者定期上门查看，确保疫情隔离的万无一失。


    ## （2）智慧教育


    人工智能在教育领域的应用主要集中在对知识进行归类和匹配高效的教育模式，应用场景包括智能评测、个性化辅导、儿童陪伴等。^((64))根据亿欧智库发布的《2018
    人工智能赋能教育产业研究报告》，外语语音评测、智能批改和习题推荐、分级阅读、教育智能机器人和智能陪练是目前应用较广的人工智能类产品。报告指出，相较传统教育过程中以教师和家长为主体的教学模式，人工智能赋能的教育流程实现了以学生自主学习为主体的教学。智慧教育能够从知识状态检测开始，通过分析学生的知识结构与储备，智能规划学习路径，推荐适合的学习内容和习题，并实时优化调整教学内容，为学生提供更智能高效的学习环境。


    ## （3）智能安防


    根据民生证券于 2019 年 8 月发布的《民生计算机人工智能专题报告之一》，利用人工智能技术强化计算机视觉处理是智能安防领域的核心应用场景。例如公安部主导的“金盾工程”和“天网工程”，科技部和公安部主导的“平安城市”，以及中央社会治安综合治理委员会主导的“雪亮工程”等。


    计算机视觉与安防的结合具有场景明确、基础技术积累充分、政府政策鼓励等优势。在技术成熟度上，处理安防影像的技术已经研发得较为完备，这是人工智能在智能安防领域得到快速部署的重要因素。此外，政法机关对智能安防行业的指导性政策也加快了人工智能技术的应用，如“平安城市”“雪亮工程”等。以智能安防中抓捕逃犯的重要技术——人脸识别为例，芯片技术的高速发展为人工智能算法提供超强算力保障，同时具备足够算力的摄像机芯片为智能算法和应用提供了高效的运行环境。而成熟的算法也可以通过自动优化各种非正常条件下的高清成像，更精准地识别出图像中人物、车辆的特征信息及行为信息，实现更多维的数据感知。安防部门通过人工智能加持的人脸识别摄像头，能预判更多异常情况的发生，从而提前做出预警。同时摄像头录像功能支撑从事后的线索查找到事中的遗留线索。


    可以说，随着人工智能的快速发展，智能安防正由原来的“人看”向“机器自动研判”演进，安防事件的处理效率也将借助人工智能技术进一步提升。


    ## 第四节 人工智能法治应用的基本原则


    我国数据资源丰富，同时得益于中央和地方有力的政策支持、巨大的应用需求和开放的市场环境，近年来我国人工智能技术和产业蓬勃发展，人工智能基础研究、技术开发的水平在全球处于优势地位，专用芯片、应用算法、开放平台等技术产品不断优化，计算机视觉、自然语言理解等技术应用达到国际先进水平。^((65))人工智能法治应用发展较快，对包括法治建设在内各类应用场景需求迫切。但人工智能法治应用在引发巨大变革的同时，也带来了包括算法歧视、技术黑箱等诸多方面的风险，人工智能该如何健康发展，如何治理方面的问题也随之出现。面对人工智能在社会经济各领域广泛应用的重大机遇和随之而来的现实挑战，有必要在应用治理领域加强前瞻研究和规范引导，做到扬长避短、趋利避害。鉴于此，国家新一代人工智能治理专业委员会于
    2019 年 6 月 17 日印发《新一代人工智能治理原则——发展负责任的人工智能》，涉及人工智能发展相关各方应遵循的原则，旨在促进新一代人工智能健康发展，更好地协调发展与治理的关系，确保人工智能安全可靠可控，推动经济、社会及生态可持续发展，共建人类命运共同体。


    在上述总体框架下，结合国际经验和法治建设领域实际需求，人工智能在法治领域的应用应坚持以下基本原则：


    ### 一、依法合规原则


    人工智能具有很高的技术门槛，同时人工智能技术具有极强的渗透能力，已经出现在工作和生活的许多场景当中，与每个人的利益密切相关。鉴于人工智能技术与生俱来的“技术黑箱”特性，有必要为蕴含风险的人工智能的研究、设计、生产、试验、销售、流通、使用全流程订立规则，并进行法律规制。对此，国内外都将依法合规原则作为人工智能治理最基本的一项原则。例如：我国《新一代人工智能治理原则——发展负责任的人工智能》中的“共担责任”部分要求相关主体严格遵守法律法规、伦理道德和标准规范；美国在其《人工智能应用监管指南备忘录（草案）》中要求人工智能系统，特别是那些可能对重要公共政策或私营部门决策产生明确和实质性影响的应用具有合规性，符合法律规定；《日本人工智能学会伦理准则》要求，人工智能系统要遵纪守法，其《人工智能利用原则草案》亦规定了妥当利用原则，提出应当努力在人与人工智能系统之间或人类之间正确分配角色的情况下，以适当的范围和方式使用人工智能系统和服务。


    2018 年 10 月，习近平总书记在中共中央政治局第九次集体学习时指出，要加强人工智能发展的潜在风险研判和防范，维护人民利益和国家安全，确保人工智能安全、可靠、可控；要整合多学科力量，加强人工智能相关法律、伦理、社会问题研究，建立健全保障人工智能健康发展的法律法规、制度体系、伦理道德。具体到人工智能法治应用领域，依法合规原则就是围绕这类新型应用而展开的各项法治活动、工作应严格遵守与人工智能相关的信息技术、网络安全、数据治理、隐私保护、业务监管等领域法律规范，^((66))坚守人工智能法治应用的依法合规底线和行为红线，不仅关系到个人合法权益的保障，而且直接关系到公共利益的维护和社会公平正义的实现。因此，与人工智能法治应用相关的行为，都必须是依法进行的依法合规行为。同时，该原则还要求责任主体积极采用人工智能相关国家标准、行业标准和自律标准，鼓励其执行严于法律规范、国家标准和地方标准的技术标准。应结合人工智能法治应用新进展新特点，积极加强人工智能法治应用与发展的共性法律问题研究，推动建立符合我国国情、更具智能化时代适应性的多层次智慧法治应用体系。


    ### 二、透明度原则


    与过去任何时代的科技相比，人工智能应用系统的内部运行方式及各环节之间的配合，都更不易为常人所理解，因此在该领域更应当强调透明度原则。此外，算法正在统治世界，并正在形成代码之治。某些巨头掌握的数据资源和技术比政府更多，因此事实上获得了比政府更强大的能力和权力。当越来越多的人依赖定制化的公共服务时，人工智能可能影响到人们的基本权利。应当像监督政府公权力一样监督这些少数的巨头，要把人工智能约束到制度的笼子里。^((67))


    人工智能研究和应用应当透明，特别是对于人类具有重大影响的人工智能，应当公开和监督。透明度原则作为“阿西洛马人工智能原则”之一，是指通过保证信息的公开透明来应对算法黑箱造成的信息不对称，实现风险防控与监管。^((68))该原则的主要内容包括可解释性、可溯源性、可理解性、信息披露、信息展示等。该原则被各国在人工智能治理中普遍采用。例如：新加坡咨询通信媒体发展局在《AI
    治理和伦理的三项倡议》中要求人工智能需要具有可解释性和透明性；同样，在有关透明度要求方面，美国列举了最佳实践的具体要求，并且将信息披露作为透明度原则的有益补充，以此达到风险管理和产业激励的双重目标。^((69))人工智能的本质在于算法和数据处理，透明度原则主要围绕这两个领域展开。就算法而言，算法黑箱的解释难题似乎是无解的。但事实上，人们对此存在误解。以行政执法领域的自动化决策为例，一方面，影响结果的有价值信息的获取是在收集数据之时，而非人工智能作出自动化决策之后，这意味着个人仅概括地了解系统的一般原则即可，并不需要彻底把握人工智能作出某项具体决定的逻辑。另一方面，算法的可解释性原则至今仍然存在着巨大争议，描述神经网络完成训练的过程恐怕和描述人类如何进行思考一样困难。法律所看重的是“可解释性”，而不是“可阐释性”。换言之，它不关注人工智能内部究竟如何运作，而只关心输入数据和输出结果的关联关系。具体到原则内容上，公众有权以常人可理解的方式了解算法的制定主体、算法的制定程序、制定规则、监督机制及责任机制等信息。同时，算法的透明公开可能还仰赖于在政府的主导下人工智能基础知识的普及。就数据处理而言，鉴于人工智能技术对大数据的依赖，公众应有权知晓其个人信息的利用和保护等方面的情况，而这部分内容也是欧盟《通用数据保护条例》和我国《个人信息保护法》等立法的重点关注项之一。


    此外，透明度原则还要求人工智能法治应用应当确保公众的知情参与。通过更多地了解人工智能相关技术的信息，公众不仅会对该技术更具信心，从而支持人工智能产业的发展，也会对立法、执法、司法部门有更多的理解，这有利于人工智能法治应用的健康有序发展。


    ### 三、安全可控原则


    在人工智能的快速发展进程中，安全与风险问题也随之上升到前所未有的高度。人工智能的风险与威胁，不仅会导致法律、伦理等方面的风险，同时，会引发社会、经济、军事等重大领域的安全问题。正因如此，国务院发布的《新一代人工智能发展规划》明确要求，在大力发展人工智能的同时，必须高度重视其可能带来的安全风险挑战，加强前瞻预防与约束引导，最大限度地降低风险，确保人工智能安全、可靠、可控发展。同样，欧盟《可信赖人工智能伦理指南》也要求避免伤害（prevention
    of harm），在寻求人工智能系统的利益最大化的同时，防止和尽量减少安全风险。^((70))实践中，数据的不安全和算法的不安全是制约当前人工智能技术与产业发展的主要因素，也是发展安全可控人工智能应用需要解决的核心问题。“安全”是指数据安全与算法安全两大核心能力，应在解决数据强依赖带来的隐私泄漏与数据投毒等隐患的同时提升算法的“鲁棒性”与可靠性。“可控”既指应用层面的合规可控，更指核心技术的自主可控，应以自主可控为根基，通过理论创新、技术突破形成具有知识产权的产品和应用。可以说，安全可控是未来发展人工智能的核心基准，也是加快人工智能应用高质量发展的有力支撑。


    安全可控原则包括安全、稳健、无害、非恶意、预防、保护、完整性等要素。^((71))具体来说，贯彻该原则：一要加强人工智能研发者、使用者及其他相关方的能力建设和行为规范建设，确保相关人员具备人工智能法治应用所需的专业能力、业务知识和工作经验。二要加强“人工智能+法治”交叉领域的理论研究、模型测试、安全评估和审计体系建设，不断提升各类人工智能法治应用的透明性、可靠性、可控性，逐步实现可追溯、可信赖、可审计。按照分级分类管理思路，结合具体法治应用场景确定相应级别的算法模型可解释程度，不应以算法黑箱等作为可解释性不足的理由。做好技术提供方尽职调查、风险隔离和退出管理，不断提升责任主体的技术实力和运维能力，避免对技术提供方的过度依赖。三要建立行之有效的人工智能法治应用安全评估研究体制、机制。安全问题是人工智能等新技术需要面对的传统风险，虽然主流的观点认为，损失也许是不可避免的，但是应当通过充分评估来降低安全风险，且应当明确规定相应的责任。因此，应针对人工智能应用在公民隐私权、信息权、知情权以及知识产权保护、未成年人保护等方面可能带来的风险与挑战，认真评估人工智能相关应用可能引发的法律、安全、伦理和社会治理等方面问题，提前布局不断升级的智能化的法律问题前瞻性研究，确保人工智能安全、可靠、可控发展。


    ### 四、以人为本原则


    科技创新的最终目的是为了人民。从某种程度上说，科学技术是一把“双刃剑”，因为它既能通过促进经济和社会发展造福人类，同时也可能在一定条件下对人类的生存和发展带来消极后果。习近平总书记强调，“科技创新是提高社会生产力和综合国力的战略支撑，必须把科技创新摆在国家发展全局的核心位置”，“要把满足人民对美好生活的向往作为科技创新的落脚点，把惠民、利民、富民、改善民生作为科技创新的重要方向”。因此，确立人工智能法治应用服务人民的基本原则，坚持技术为民，坚持技术发展始终是维护最广大人民的根本利益；使人工智能成果更多、更公平惠及全体人民，是确保人工智能法治事业始终服务于人的全面发展以及人类社会可持续发展的前提。


    以人为本原则要求人工智能法治应用必须尊重人的自主权和尊严。进一步说，人工智能让以人为本原则有了更多实现方式，而以人为本原则是人工智能良性发展的基础所在。在
    IBM 公司的深蓝电脑击败卡斯帕罗夫后，有一场名为“自由式国际象棋”的比赛。这场比赛的特点是，对抗的双方都是人和机器的组合。令人意外的是，最终获胜者并不是一位拥有最先进计算机的“大师”，而是一对同时使用三台普通计算机的美国业余棋手。人的战略指导与计算机的战术敏锐相结合，形成势不可挡的能力。从这场比赛中我们得到这样一个规律：弱人机+好流程要优于仅仅拥有强大性能的计算机，同时也优于强人机+差流程。于是人们将弱人机+好流程胜过强人机+差流程的规律称为“卡斯帕罗夫定律”。该规律的关键是流程，或者说人机协作的方式，而评价这种协作方式好坏的标准就是是否做到了以人为本。有鉴于此，新加坡《人工智能治理模式框架（第二版）》对“以人为本”原则作了详细的规则设计，其认为人工智能的设计、开发和部署的首要考虑因素应该是扩大人的能力、保护人的利益，包括人的幸福和安全。^((72))


    在以人为本原则之下，只考虑算法层面是不够的，整体的决策流程（包括算法和人）也必须经过类似的精心设计。算法的最终用户应该对这个工具有足够详细的了解，以便更有效地使用算法。因此通过可视化方式清楚地传达算法的假设、局限性和数据特征非常有必要。此外，应该建立指导原则和业务规则，并提醒最终用户何时以及如何根据算法结果或以其他信息进行操作。更好的人机协作模式和以人为中心的设计有助于缩小人工智能算法输出与预期结果之间的差距。人工智能本身并不创造价值，为实际场景而设计并解决具体问题的人工智能才创造价值。


    在人工智能法治应用领域，一方面，需要以维护人民群众法治权益、增进人民群众公平正义为导向，尊重社会共同法治观和伦理道德，持续提升技术水平、改进技术利用方式，开发“有温度的”“以人民为中心的”人工智能法治应用与服务，促进智慧法治发展。另一方面，应坚持守正创新、技术向善，制定实施科学合理的公民权利保护机制、隐私安全政策、风险防范措施和应急处置安排，在数据获取、算法设计、产品研发和应用过程中消除偏见和歧视，禁止人工智能的滥用、恶用，同时避免误用。总之，在人工智能法治应用的发展中，要坚持底线思维，人工智能实际上也是一种“从人到人”的算法模式，要做到始终以人为本，要以用户的数据权利为优先。只有真正把“人”放在技术、算法之上，才是真正的人工智能应用。


    ### 五、权责一致原则


    在人工智能技术语境下，机器的自主性已经超出人之前所预期的范围，而这对责任体系的配置提出了新的要求。因此，应围绕人工智能相关的技术开发和应用领域建立明确的责任体系，以便在人工智能应用结果导致人类伦理或法律的冲突问题时，人们能够在技术层面对人工智能技术开发人员或设计部门问责，并在人工智能应用层面建立合理的责任体系。这一责任体系的核心内容就是权责一致原则，即在人工智能的设计和应用中应当保证问责的实现，如在人工智能的设计和使用中留存相关的算法、数据和决策的准确记录，以便在产生损害结果时能够进行审查并查明责任归属。^((73))目前，不少国家都将可追责、可问责等内涵纳入其规制文件之中。例如，日本内阁府发布的《以人类为中心的人工智能社会原则》根据问题性质在研发、提供、运用等利益相关者之间妥当分配使用人工智能带来的后果和责任。欧盟发布的两份文件中，《可信赖人工智能伦理指南》认为应建立问责机制，落实人工智能系统开发、部署和使用全过程的责任主体，《算法责任与透明治理框架》提出应将算法透明和责任治理作为解决算法公平问题的工具，强调“负责任研究和创新”（RRI）方法。


    应当明确，我们所说的人工智能伦理原则，不仅应当由研发人工智能的人类主体遵守（包括在研究机构、行业领域的科技企业和科技工作者），而且这些原则应当嵌入人工智能本身。针对机器遵循伦理规则这一点，有人仍有质疑。典型的看法是，伦理规则只是给人的，没有可能给人工智能系统（包括机器人）设定伦理规则。的确，传统上伦理规则针对的是能够遵循这些规则的主体也就是人本身。但是，考虑到人工智能的特征在于机器对人的智能的“模拟、延伸和扩展”，即其决策不需要在操控者一步步的指令下进行，同时这种决策可能会产生人类预料不到的结果，故人工智能系统也应当受到伦理规则的规制。


    为在人工智能法治应用领域实现权责一致原则，一是组建和使用相关应用的机构以及主管部门应推动建立科学合理的人工智能治理框架，为本机构应用人工智能所产生的结果负责。主动建立完善清晰、透明、公开的权责清单，通过完善立法、标准规范等路径明确研发者、使用者及其他相关方的权利、义务和责任，建立覆盖人工智能法治应用全流程的问责机制。二是要坚持负责任智慧法治理念，通过信息公开、风险预防、结果公示、使用声明等方式，切实维护当事人的知情权、自主选择权、公平交易权、信息安全权等权利。与合作机构、技术供应商等审慎签订合同协议，明确风险承担、功能安排、数据管理、后果追究等方面的责任边界。三是要建立人工智能算法的公共审查制度。公共审查能提高相关政府、科研和其他机构采纳的人工智能算法被纠错的可能性。合理的公共审查能够保证必要的非涉密数据被合理记录、相应算法应受到监督、法治应用应受到合理审查。

