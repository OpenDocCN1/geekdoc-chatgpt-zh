- pgno: 269
  md: '# 17.2 运动场


    首先，我们从三维速度向量推导二维成像平面上的运动场的数学表示。为简化计算，假设世界坐标系与照相机坐标系重合。考虑空间中的一点 \( P(t) \) 在时间
    \( \delta t \) 后移动到点 \( P(t + \delta t) \)，相应地，其在成像平面上的投影点 \( P''(t) \) 移动到点 \(
    P''(t + \delta t) \)，如图 17-2 所示。设 \( p:(x,y,z)^\top \) 和 \( p'':(x'',y'',f)^\top
    \) 分别为空间点 \( P \) 及其投影点 \( P'' \) 的坐标，空间中的速度向量为 \( v:(v_x,v_y,v_z)^\top \)，成像平面上的速度向量为
    \( v'':(v''_x,v''_y,v''_z=0)^\top \)。假设照相机的焦距 \( f \) 已知，则根据照相机成像原理，有


    \( p'' = f \frac{p}{z} \)


    其中，\( z \) 是点 \( P \) 在照相机坐标系下的深度。进一步，成像平面上的速度向量 \( v'' \) 可以通过对上述公式求导获得：


    \( v'' = f \frac{z v - v_z p}{z^2} = \frac{f v - v_z p''}{z} \)


    也就是：


    \( v''_x = \frac{f v_x - v_z x''}{z} \\)

    \( v''_y = \frac{f v_y - v_z y''}{z} \\)

    \( v''_z = \frac{f v_z - v_z f}{z} = 0 \)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_269_0.png)


    这里可见，\( v'' \) 在成像平面上沿 \( x \) 轴及 \( y \) 轴分量与空间点的深度 \( z \) 成反比，体现为“近物快，远物慢”。这与我们在日常生活中观察到的情况一致，例如在驾车过程中，远处景物移动相对较慢，而近处景物的移动看起来更快。


    图 17-2 三维运动与二维运动场的关系


