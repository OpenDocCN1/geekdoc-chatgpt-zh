    在本章中，我们将在基于深度学习的图像分类的基础上实现语义分割。


    # 11.2 数据集和度量


    用于语义分割评测的标准数据集主要有如下 3 个。


    +   (1) PASCAL VOC[1]: PASCAL VOC 数据集是 PASCAL VOC 挑战赛官方使用的数据集。该数据集包含 20 类约 1 万幅图像，每幅图像都有完整的标签。


    +   (2) Cityscapes[2]: Cityscapes 数据集采集自德国及其邻国的 50 个城市，包括了春、夏、秋 3 个季节的街区场景。该数据集分为两卷，其中一卷包含
    5000 幅带有高质量像素级标签的图像，共有 19 个类别。


    +   (3) ADE20K[3]: ADE20K 数据集是 MIT 发布的场景理解数据集，包含 2 万多幅标记完整的图像，共超过 3000 个类别。


    在语义分割中，通常采用平均交并比（mean intersection over union，mIoU）作为评测指标。令 c 表示真实类别，l 表示预测类别（c,
    l ∈ C），则 mIoU 定义如下：


    ```

    mIoU = \frac{1}{|C|} \sum_{c \in C} \frac{n_{cc}}{\sum_{l \in C} n_{cl} + \sum_{l
    \in C} n_{lc} - n_{cc}}

    ```


    其中，|C| 表示集合中元素的个数；$n_{cl}$ 表示将 c 预测为 l；$n_{lc}$ 表示将 l 预测为 c；$n_{cc}$ 表示将 c 正确预测为
    c。


    # 11.3 全卷积网络


    我们知道语义分割实际上是进行逐像素的分类，因此，一个最为直观的语义分割方法便是'
