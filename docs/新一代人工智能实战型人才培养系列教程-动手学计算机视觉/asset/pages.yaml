  md: '假定 $\bar{P}$ 满足 $\|\bar{P}\|_2 = 1$，那么上式又可以写为


    ```

    \(\min_p \| A p \|^2 \text{ s.t. } \|\bar{P}\|_2 = 1\)

    ```


    这是一个二次规划问题，具体求解方法可参考 8.6 节中介绍的方法。矩阵 \(A^T A\) 的最小特征值对应的特征向量是此方程组的近似解。但是要注意，所有角点都在一个标定板平面上。回顾一下我们对世界坐标系的处理：我们将世界坐标系固定在棋盘格上，\(z\)
    轴垂直于棋盘格平面，\(x\) 轴和 \(y\) 轴与棋盘格平面平行。在这种情况下，棋盘格上任一点的物理坐标 \(z_w^{(i)} = 0\)。此时，矩阵
    \(A\) 中存在多个为全零的列，如第 3 列、第 7 列和第 11 列。那么，\(\mathbf{P}\) 中对应维度上的值无法确定，因此不应采用之前的方法进行求解。在这种情况下，前面的投影方程就变为


    ```

    \(\begin{bmatrix} u^{(i)} \\ v^{(i)} \\ 1 \end{bmatrix} = \begin{bmatrix} f_x
    & 0 & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} r_{11} &
    r_{12} & r_{13} & t_x \\ r_{21} & r_{22} & r_{23} & t_y \\ r_{31} & r_{32} & r_{33}
    & t_z \end{bmatrix} \begin{bmatrix} x_w^{(i)} \\ y_w^{(i)} \\ 0 \\ 1 \end{bmatrix}\)

    ```


    不难发现，\(r_{13}, r_{23}, r_{33}\) 这 3 个未知数在上式中是无法求解的。不妨将这一列去掉，得到


    ```

    \(\begin{bmatrix} u^{(i)} \\ v^{(i)} \\ 1 \end{bmatrix} = \begin{bmatrix} f_x
    & 0 & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} r_{11} &
    r_{12} & t_x \\ r_{21} & r_{22} & t_y \\ r_{31} & r_{32} & t_z \end{bmatrix} \begin{bmatrix}
    x_w^{(i)} \\ y_w^{(i)} \\ 1 \end{bmatrix}\)

    ```


    将 \([r_{11} r_{21} r_{31}]^T\) 作为一个整体，记为 \(r_1\)，将 \([r_{12} r_{22} r_{32}]^T\)
    记为 \(r_2\)，那么上式可以写为


    ```

    \(\begin{bmatrix} u^{(i)} \\ v^{(i)} \\ 1 \end{bmatrix} = K [r_1 \quad r_2 \quad
    t] \begin{bmatrix} x_w^{(i)} \\ y_w^{(i)} \\ 1 \end{bmatrix}\)

    ```


    将上面的 \(K[r_1 \quad r_2 \quad t]\) 记为 \(H = [h_1 \quad h_2 \quad h_3]\)，其中 \(h_1
    = K r_1, h_2 = K r_2, h_3 = K t\)。这里的 \(H\) 就是我们在第 8 章中提到的单应性矩阵。\(H\) 矩阵本身是一个
    \(3 \times 3\) 的矩阵，有 8 个自由度（最后一个自由度是尺度因子，可以通过归一化来确定），因此至少需要 4 对点来构建包含 8 个未知数的线性方程组用于求解
    \(H\)。在得到单应性矩阵 \(H\) 之后，接下来需要考虑的问题就是如何从 \(H\) 中解出 \(K, R, t\)。这里我们需要利用旋转矩阵的性质，即旋转矩阵是一个正交矩阵，因此有
    \(r_1^T r_2 = 0, r_1^T r_1 = r_2^T r_2 = 1\)。又因为 \(r_1 = K^{-1} h_1, r_2 = K^{-1}
    h_2\)，那么我们可以得到


    ```

    \(\begin{cases} h_1^T B h_2 = 0 \\ h_1^T B h_1 = h_2^T B h_2 \end{cases}\)

    ```


    上式中的 \(B = K^{-T} K^{-1}\)。显然 \(B\) 是一个对称半正定矩阵，因此 \(B\) 包含了 6 个未知数。由于每幅不同视角下的标定板图像能够提供一个上述的方程组，即两个方程，因此我们至少需要
    3 幅不同视角下的标定板图像才能求解 \(B\)。注意，内参矩阵 \(K\) 是一个可逆的右上三角矩阵，故 \(K^{-T}\) 和 \(K^{-1}\)
    分别是左下三角矩阵和右上三角矩阵，那么 \(B\) 是一个对称正定矩阵。因此我们只要求解出 \(B\)，就可以通过楚列斯基分解（Cholesky decomposition）求解出照相机内参矩阵
    \(K\)。在得到内参矩阵之后，我们可以通过 \(K^{-1} h_3\) 求解出 \(t\)，最后通过 \(r_1 = K^{-1} h_1, r_2 =
    K^{-1} h_2\) 求解出旋转矩阵的前两列。这样计算出来的 \(r_1\) 和 \(r_2\) 是不满足正交性的，因此我们需要对其进行正交化处理，一般用施密特'
