    # 6.4 图像变换对角点检测的影响


    在 6.1 节中提到，特征点对于图像变换具有一定的不变性（重复性）。下面来探讨一下，当图像发生变换，如旋转、平移、缩放等时，检测出的角点是否具有不变性？


    对图像进行旋转，检测出的角点不变。如图 6-7 所示，可以很直观地发现，对图像的旋转改变的仅仅是矩阵 M 的旋转因子 R，并不改变其对应的特征值，因此对角点检测没有影响。


