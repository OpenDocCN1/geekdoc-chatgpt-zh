    # 12.3.2 Fast R-CNN


    R-CNN 的思路虽然很直接，但很明显也存在着许多问题：


    +   (1) 对于每幅图像中的每个候选区域都要利用主干网络计算一次特征，而一幅图像通常有 2000 个候选区域，计算效率低；


    +   (2) 候选区域之间重叠较多，进行特征提取时存在重复计算；


    +   (3) R-CNN 的训练阶段包含多个训练过程（主干网络的训练、SVM 分类器及包围盒回归器的训练），而这些训练过程并不是端到端的，即目标类别分类和包围盒回归的结果无法反馈给前端的主干网络用以更新网络参数。


    为解决这些问题，Ross Girshick 于 2015 年提出了 Fast R-CNN[3]。Fast R-CNN 的设计更为紧凑，极大提高了目标检测速度。使用
    VGG16 作为主干网络时，与 R-CNN 相比，Fast R-CNN 在 PASCAL VOC 2007 上的训练时间从 84 h 缩短到 9.5 h，每幅图像的测试时间从
    47 s 缩短到 0.32 s。


    相较于 R-CNN，Fast R-CNN 有两个重大改进：


    +   (1) 不再对每个候选区域单独提取特征，而是在提取整幅图像的特征图后，直接从特征图提取每个候选区域的特征，避免了多次用主干网络计算特征的过程；


    +   (2) Fast R-CNN 的候选区域特征提取与分类器及回归器的训练是一个端到端的过程，分类和回归的结果可以反馈给主干网络用以更新网络参数。


    实现这两个改进的关键是引入一个感兴趣区域（region of interest, ROI）特征提取器。所谓'
