  md: '# # 第 5 章

    # 边缘检测


    # ## 5.1 简介


    边缘（edge）是图像中局部亮度、纹理或颜色发生剧烈变化的位置。如图 5-1 所示，这些变化往往发生在物体与背景、物体与物体、区域与区域之间的边界上，边缘蕴含了图像中物体的形状信息和场景的结构信息，这些信息在视觉系统中扮演着至关重要的角色。美国国家工程院院士
    Jitendra Malik 指出形状提供了比其他特征更为鲁棒的信息[1]。例如图 5-1 中的右边的边缘图已经完全丢失了色彩信息，但是仍然可以识别出这些边缘所表示的语义——天鹅。David
    Marr 的视觉理论[2]也印证了这一点，根据他的理论，视觉信息处理的第一步是建立在从图像中提取的边缘等重要特征之上的，也就是说边缘检测是视觉信息处理的基础。在本章中，我们将介绍边缘检测的数学模型及几种经典边缘检测算法的实现。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_66_0.png)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_66_1.png)


    图 5-1 边缘检测示意


    # ## 5.2 边缘检测的数学模型


    给定一幅图像 I，边缘检测的目标是计算出图像中每一点(i,j)处的边缘强度 \(E_s(i,j|I)\) 和边缘方向 \(E_\theta(i,j|I)\)。


    图 5-2 展示了一个一维信号，可以把它看作二维图像像素的强度沿一个坐标轴（x 轴）方向的信号。根据 5.1 节中的定义，边缘所处的位置就是像素的强度发生快速变化的位置。由微积'
