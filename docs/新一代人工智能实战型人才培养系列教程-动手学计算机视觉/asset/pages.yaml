    # ## 10.4 基于深度卷积网络的图像分类算法


    2012 年，随着 AlexNet 的横空出世，基于深度卷积神经网络的方法逐渐成为计算机视觉领域的主流方法。对于图像分类任务，利用深度卷积神经网络可以实现从图像到分类标签的端到端预测，不再需要分阶段的表征提取与分类器训练。


    ResNet 网络是 2015 年由微软亚洲研究院研究员何恺明等人提出的，斩获了当年 ImageNet 大规模视觉识别竞赛的图像分类任务和目标检测任务两个第一名。在
    ResNet 提出之前，所有的神经网络都是由卷积层和池化层的叠加组成的（关于神经网络的相关知识，可参阅《动手学深度学习》）。人们认为卷积层和池化层的层数越多，获取的图像表征信息越强，学习效果就越好。但在实际的实验中研究人员发现，随着卷积层和池化层的叠加，不但没有出现学习效果越来越好的情况，反而出现了梯度消失和梯度爆炸，以及退化问题。在神经网络的反向传播中，每向前传播一层，都要乘以每一层的误差梯度，若误差梯度是一个小于
    1 的数，当网络层数越来越多时，梯度会越来越小，出现梯度消失；若误差梯度是一个大于 1 的数，当网络层数越来越多时，梯度会越来越大，出现梯度爆炸。通过数据的预处理及在网络中使用批量标准化（batch
    normalization, BN）层可以解决梯度消失或梯度爆炸问题。退化问题是指层数更多的网络在训练集和测试集上的表现不如层数少的网络。针对退化问题，ResNet
    引入了残差块（如图 10-6 所示），增加了恒等映射作为短路连接（shortcut connection），跨越几个层，将输入添加到输出。


