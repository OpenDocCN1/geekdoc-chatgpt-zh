- pgno: 31
  md: '类似地，在图像处理中，卷积的计算是把每个像素的邻域内的像素值加权求和。这里，空间上的邻域就对应时间上的前后时刻，图像就是输入信号函数，加权的权重就是系统函数，卷积的结果就是系统函数对输入图像的响应，也就是图像特征。由此可见，对图像进行卷积就是提取图像特征的过程，这也是图像识别等计算机视觉任务的基础。


    在本章中，我们以一维卷积为引子，介绍卷积的数学定义与代码实现，然后推广到二维卷积，并介绍对图像的卷积操作。


    # 2.2 一维卷积


    从数学上来说，卷积与加、减、乘、除一样是一种运算，其运算的根本操作是将两个函数（\(f(\cdot)\) 和 \(k(\cdot)\)）中的一个先平移，再与另一个函数相乘后累加。在这个运算过程中，因为涉及积分或者级数的操作，所以看起来很复杂。对于定义在连续域的函数，根据卷积的定义，一维卷积的公式如下：


    \(g(x) = f(x)*k(x) = \int_{-\infty}^{\infty} f(\tau)k(x-\tau)\)d\(\tau\)


    在上式中，一维卷积的输入是一个一维信号 \(f(x)\) 和一个一维卷积核 \(k(x)\)；在信号处理中，\(f(x)\) 是输入信号函数，\(k(x)\)
    是系统函数。很容易看出，卷积是在 \((-\infty, \infty)\) 的范围内对 \(\tau\) 求积分，积分对象为 \(f(\tau)\) 与
    \(k(x-\tau)\) 的乘积。需要注意的是，等式右边只有 \(k(x-\tau)\) 中涉及 \(x\)，其余部分只与 \(\tau\) 有关。


    根据一维连续卷积的公式，可以得出卷积操作的计算步骤。


    +   (1) 变换：改变输入信号函数的横坐标，自变量由 \(x\) 变成 \(\tau\)。


    +   (2) 翻转：将其中一个函数翻转。


    +   (3) 平移：翻转后的函数随变量 \(\tau\) 平移，得到 \(k(x-\tau)\)。若 \(\tau > 0\)，则向右平移，反之向左平移。


    +   (4) 相乘：将 \(f(\tau)\) 和 \(k(x-\tau)\) 相乘。


    +   (5) 积分：\(f(\tau)\) 与 \(k(x-\tau)\) 的乘积曲线下的面积即为在 \(x\) 位置的卷积值。


    卷积作为一种运算，有以下几种性质。


    +   (1) 交换律：\(f(x)*k(x) = k(x)*f(x)\)。


    +   (2) 结合律：\([f(x)*g(x)]*k(x) = f(x)*[g(x)*k(x)]\)。


    +   (3) 分配律：\(f(x)*[g(x)+k(x)] = f(x)*g(x) + f(x)*k(x)\)。


    一维连续卷积在音频处理等方面具有举足轻重的地位。但是，通常计算机所能处理的信号并不是连续的而是离散的，因此，接下来介绍离散函数的一维卷积。


    根据卷积的定义，离散函数的一维卷积公式如下：'
