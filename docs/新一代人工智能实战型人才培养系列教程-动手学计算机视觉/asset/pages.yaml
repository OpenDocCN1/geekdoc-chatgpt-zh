    # 图 11-4 用1x1卷积层替换所有的全连接层


    # 11.3.1 上采样


    为解决输出的热图分辨率比原图小的问题，FCN 对特征图进行上采样，使其和原图的空间分辨率保持一致。上采样一般可以通过双线性插值法实现。如图 11-5 所示，设
    g 是一个二维信号，若已知 g 在点 Q<sub>11</sub>(坐标为(x<sub>1</sub>,y<sub>1</sub>))、Q<sub>12</sub>(坐标为(x<sub>1</sub>,y<sub>2</sub>))、Q<sub>21</sub>(坐标为(x<sub>2</sub>,y<sub>1</sub>))、Q<sub>22</sub>(坐标为(x<sub>2</sub>,y<sub>2</sub>))处的值，要求
    g 在点 P 坐标为(x,y))的值。求值的过程实际上就是双线性插值的过程。首先在 x 方向上进行插值：


    ```

    g(x, y_1) \approx \frac{x - x_1}{x_2 - x_1}[g(Q_{21}) - g(Q_{11})] + g(Q_{11})
    = \frac{x_2 - x}{x_2 - x_1}g(Q_{11}) + \frac{x - x_1}{x_2 - x_1}g(Q_{21})


    g(x, y_2) \approx \frac{x - x_1}{x_2 - x_1}[g(Q_{22}) - g(Q_{12})] + g(Q_{12})
    = \frac{x_2 - x}{x_2 - x_1}g(Q_{12}) + \frac{x - x_1}{x_2 - x_1}g(Q_{22})

    ```


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_163_1.png)


    # 图 11-5 双线性插值法举例


    然后在 y 方向上进行插值：'
