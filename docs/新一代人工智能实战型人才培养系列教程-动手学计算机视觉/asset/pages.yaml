    # 13.3.1 特征金字塔网络


    由于图像中的目标大小各不相同，为了能够检测到不同大小的目标，目标检测模型通常需要多尺度检测架构。图 13-4 展示了 4 种不同的用于目标检测的特征提取框架。


    图 13-4（a）是 Fast R-CNN、Faster R-CNN 等目标检测模型采用的网络架构。这种架构只在主干网络的最后一层卷积层输出的特征图上做目标检测，故该架构最大的问题是对小目标的检测效果不理想。这是因为小尺度目标的特征会随着主干网络逐层下采样逐渐消失，在最后一层仅有少量的特征支持小目标的精准检测。


    图 13-4（b）是早期的目标检测算法常用的图像金字塔结构，它通过将输入图像缩放到不同尺度来构建图像金字塔，随后主干网络通过处理这些不同尺度的图像来得到不同尺度的特征图，最后分别在每个尺度的特征图上做目标检测。不难看出，使用图像金字塔最大的问题是主干网络的多次推理会带来计算开销的成倍增长。


    图 13-4（c）展示的网络架构从主干网络的多个层级都输出特征图，然后在不同空间分辨率的特征图上进行独立的目标检测。显然，这种结构并没有进行不同层之间的特征交互，既没有给深层特征赋予浅层特征擅长定位小目标的能力，也没有给浅层的特征赋予深层蕴含的语义信息，因此对目标检测效果的提升有限。


    图 13-4（d）展示了 FPN 的架构。FPN 的主要思想是构建一个特征金字塔，将不同层级的特征图融合到一起，从而实现不同大小目标的检测。具体而言，类似图
    13-4（c），FPN 先使用一个主干网络得到每个层级的特征图，从下到上分别命名为 C2、C3、C4，其中的数字 2、3、4（直到 1），代表特征图空间分辨率为原图的
    1/2^i，由此得到的深层的特征图空间分辨率小，浅层的特征图空间分辨率大，这一过程称为自底向上。在此之后，FPN 构建了一个自顶向下的路径来对不同空间分辨率的特征图进行融合。首先
    FPN 直接输出空间分辨率最小的特征图[图 13-4（d）右边第 3 层，顶层]，记为 P4，然后对 P4 进行 2 倍的上采样，使其空间分辨率大小和 C3'
