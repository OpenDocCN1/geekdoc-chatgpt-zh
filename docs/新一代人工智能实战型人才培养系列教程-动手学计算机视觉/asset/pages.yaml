  md: "# 15.4 C3D 代码实现\n\n前面我们已经介绍了三维卷积和 C3D 模型，接下来将开始动手实现一个 C3D 模型并在 UCF101 数据集上进行训练和测试。\n\
    \n```\nimport torch.nn as nn\n\nclass C3D(nn.Module):\n    \"\"\"\n    C3D, Convolution\
    \ 3D, 即三维卷积\n    \"\"\"\n\n    def __init__(self):\n        super(C3D, self).__init__()\n\
    \        # 注意到核函数为三维，符合三维卷积的要求\n        self.conv1 = nn.Conv3d(3, 64, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.pool1 = nn.MaxPool3d(kernel_size=(1,\
    \ 2, 2), stride=(1, 2, 2))\n        self.conv2 = nn.Conv3d(64, 128, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.pool2 = nn.MaxPool3d(kernel_size=(2,\
    \ 2, 2), stride=(2, 2, 2))\n        self.conv3a = nn.Conv3d(128, 256, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.conv3b = nn.Conv3d(256, 256, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.pool3 = nn.MaxPool3d(kernel_size=(2,\
    \ 2, 2), stride=(2, 2, 2))\n        self.conv4a = nn.Conv3d(256, 512, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.conv4b = nn.Conv3d(512, 512, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.pool4 = nn.MaxPool3d(kernel_size=(2,\
    \ 2, 2), stride=(2, 2, 2))\n        self.conv5a = nn.Conv3d(512, 512, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.conv5b = nn.Conv3d(512, 512, kernel_size=(3,\
    \ 3, 3), padding=(1, 1, 1))\n        self.pool5 = nn.MaxPool3d(kernel_size=(2,\
    \ 2, 2), stride=(2, 2, 2),\n                                  padding=(0, 1, 1))\n\
    \n        self.fc6 = nn.Linear(8192, 4096)\n        self.fc7 = nn.Linear(4096,\
    \ 4096)\n        self.fc8 = nn.Linear(4096, 487)\n\n        self.dropout = nn.Dropout(p=0.5)\n\
    \        self.relu = nn.ReLU()\n        self.softmax = nn.Softmax()\n\n    def\
    \ forward(self, x):\n        h = self.relu(self.conv1(x))\n        h = self.pool1(h)\n\
    \n        h = self.relu(self.conv2(h))\n        h = self.pool2(h)\n\n        h\
    \ = self.relu(self.conv3a(h))\n        h = self.relu(self.conv3b(h))\n       \
    \ h = self.pool3(h)\n```"
