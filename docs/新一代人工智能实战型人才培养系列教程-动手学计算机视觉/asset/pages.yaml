  md: '```

    assoc(\mathcal{A}, \mathcal{V}) = \sum_{u \in \mathcal{A}, v \in \mathcal{V},
    \langle u, v \rangle \in \mathcal{E}} w(u, v)

    ```


    不难发现，如果集合 A 只包含一个点，assoc(A, V) 与 cut(A, B) 是相等的，此时 Ncut(A, B) 较大；而当集合 A 包含多个点时，assoc(A,
    V) 的值就比 cut(A, B) 大，此时 Ncut(A, B) 就比较小。这也是为什么归一化割可以避免 min-cut 出现的问题。


    为了更好地表示 Ncut(A, B)，如图 9-7 所示，用一个二值向量 x[x_i \in {-1, 1}] 表示顶点的分布情况。若顶点处于黑色位置，则对应的
    x_i 值为 1；若顶点处于灰色位置，则对应的 x_i 值为 -1。如此，可以将 Ncut(A, B) 改写为


    ```

    Ncut(\mathcal{A}, \mathcal{B}) = \frac{\sum_{(x_i > 0, x_j < 0)} -w_{ij} x_i x_j}{\sum_{x_i
    > 0} d_i} + \frac{\sum_{(x_i < 0, x_j > 0)} -w_{ij} x_i x_j}{\sum_{x_i < 0} d_i}

    ```


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_134_0.png)


    图 9-7 用向量表示顶点的聚类


    其中，i、j 分别表示顶点；w_{ij} = w(i, j)；d_i = \sum_j w(i, j)。令 D 为对角矩阵，D_{ii} = d_i；令 W
    为权重矩阵，W_{ij} = w_{ij}。令


    ```

    y = \frac{1}{2} [(1 + x) - b(1 - x)]

    ```


    其中，b = \frac{\sum_{x_i > 0} d_i}{\sum_{x_i < 0} d_i}，有


    ```

    \min_x Ncut(x) = \min_y \frac{y^T (D - W) y}{y^T D y}

    ```


    通过下式可以求得上述优化问题的最优解：


    ```

    (D - W)y = \lambda D y

    ```


    即


    ```

    D^{-\frac{1}{2}} (D - W) D^{-\frac{1}{2}} D^{\frac{1}{2}} y = \lambda D^{\frac{1}{2}}
    y

    ```'
