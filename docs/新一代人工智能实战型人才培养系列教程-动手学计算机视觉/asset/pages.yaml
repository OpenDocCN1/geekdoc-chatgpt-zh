- pgno: 241
  md: "虑时间信息。在本节中，我们将介绍一个经典的动作识别模型——C3D[1]（convolutional 3D），它利用三维卷积网络来提取视频数据中的时空特征，从而实现高精确度的动作识别。\n\
    \n# 15.3.1 三维卷积\n\n在介绍 C3D 之前，我们先来了解一下其核心组件——三维卷积。三维卷积是对二维卷积的自然扩展。在二维卷积中，卷积核在输入的二维数据（如图像）上滑动，计算邻近区域的加权和。而在三维卷积中，卷积核除了在宽度（W）和高度（H）上滑动外，还会在深度（D）上滑动，如图\
    \ 15-2 所示。这里深度通常对应于视频帧的时间维度。给定视频序列 S（假设其中的图像均为灰度图），将其理解成一个三阶张量，对其进行三维卷积的数学表达式为\n\
    \n```\nG(i, j, k) = \\sum_{m=1}^{k_d} \\sum_{n=1}^{k_h} \\sum_{p=1}^{k_w} K(m,\
    \ n, p) \\cdot S(i-m, j-n, k-p)\n```\n\n其中，K 是三维卷积核；G 是输出张量；\\(k_d\\)、\\(k_h\\\
    ) 和 \\(k_w\\) 分别表示卷积核在空间宽度、高度和时间深度上的尺寸。三维卷积的补零、步长等操作与二维卷积类似，这里不做展开。\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_241_0.png)\n\
    \n图 15-2 三维卷积示意\n\n下面展示一个简易的三维卷积的例子。\n\n```\nimport numpy as np\nimport pprint\
    \ as pp\n\ndef generate_increasing_volume(d, h, w):\n    \"\"\"\n    生成一个递增的张量，每个元素的值为其在张量中的索引值加\
    \ 1\n\n    参数:\n    - d, h, w: 生成张量的深度、高度和宽度\n\n    返回:\n    - volume: 生成的递增张量\n\
    \    \"\"\"\n    return np.arange(1, d*h*w + 1).reshape(d, h, w)\n\ndef conv3d(input_volume,\
    \ kernel):\n    \"\"\"\n    对给定的输入张量和指定的卷积核进行三维卷积操作\n\n    参数:\n    - input_volume:\
    \ 三维 numpy 数组，维度对应深度、高度和宽度\n    - kernel: 三维 numpy 数组，维度比输入张量阶数小，且每个维度的大小为奇数\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "```\n返回:\n- output_volume: 三维 numpy 数组, 卷积操作的输出张量\n\"\"\"\nd, h, w = input_volume.shape\n\
    kd, kh, kw = kernel.shape\n\n# 计算输出张量的阶数\noutput_d = d - kd + 1\noutput_h = h\
    \ - kh + 1\noutput_w = w - kw + 1\n\n# 初始化输出的张量\noutput_volume = np.zeros((output_d,\
    \ output_h, output_w))\n\n# 计算三维卷积\nfor i in range(output_d):\n    for j in range(output_h):\n\
    \        for k in range(output_w):\n            sub_volume = input_volume[i:i+kd,\
    \ j:j+kh, k:k+kw]\n            output_volume[i, j, k] = np.sum(sub_volume * kernel)\n\
    \nreturn output_volume\n\n# 生成一个 4x4x4 的三阶递增张量\ninput_volume_increasing = generate_increasing_volume(4,\
    \ 4, 4)\nkernel = np.array([[[1, 1], [1, 1]], [[1, 1], [1, 1]]]) # 一个 2x2x2 的核\n\
    \n# 对递增张量进行三维卷积操作\noutput_volume_increasing = conv3d(input_volume_increasing,\
    \ kernel)\nprint(\"输入张量的部分:\")\npp.pprint(input_volume_increasing[0:2, 0:2, 0:2])\n\
    print(\"核:\")\npp.pprint(kernel)\nprint(\"输出张量的部分:\")\nprint(output_volume_increasing[0,\
    \ 0, 0])\n```\n\n```\n输入张量的部分:\narray([[[ 1,  2],\n        [ 5,  6]],\n\n    \
    \   [[17, 18],\n        [21, 22]]])\n核:\narray([[[1, 1],\n        [1, 1]],\n\n\
    \       [[1, 1],\n        [1, 1]]])\n输出张量的部分:\n92.0\n```"
  merge: -1
