  md: "![](img/0e497601c0ca26be98c5399cbd72eb4c_75_0.png)\n\n# 3. 边缘强度非极大值抑制\n\n从上面的结果可以发现，直接从梯度得到的边缘线非常粗，显得很模糊，因此需要应用非极大值抑制将边缘细化。非极大值抑制沿每个梯度方向找到边缘强度局部极大的像素予以保留，去除该方向上边缘强度非局部极大的像素。\n\
    \n先将图像中每个像素的梯度方向量化为 8 个固定方向，即 $\\left\\{ \\frac{k}{8} \\pi \\right\\}_{k=0}^7$\
    \ 。接着，将当前像素的边缘强度与沿该像素的梯度方向（包括正、反方向）的邻域内像素的边缘强度进行比较。如果当前像素的边缘强度最大，则保留该像素为边缘中像素，反之则将其从边缘中移除。\n\
    \n例如在图 5-4 中，考察当前像素(i,j)，它的梯度方向如图 5-4 中箭头所示。沿该梯度方向的正、反方向分别找到当前像素的两个邻域像素(i',j')和(i'',j'')（通常选取当前像素的\
    \ 8 邻域像素）。如果当前像素(i,j)的边缘强度在这 3 个像素中最大，即 $E_s(i,j|I) = \\max\\{E_s(i,j|I), E_s(i',j'|I),\
    \ E_s(i'',j''|I)\\}$，则将当前像素保留在边缘中，反之将其从边缘中移除，并设置 $E_s(i,j|I) = 0$。注意，在 Canny 算法的原文中，作者是采用沿梯度方向寻找拉普拉斯算子过零点的方法来确定边缘强度局部最大点，这里我们通过非极大值抑制来实现同样的效果。\n\
    \n![](img/0e497601c0ca26be98c5399cbd72eb4c_75_1.png)\n\n```\n# 非极大值抑制算法\ndef non_maximum_suppression(G,\
    \ theta):\n    # 获得梯度图的大小\n    H, W = G.shape\n\n    # 将梯度方向投影到最近的 45° 空间中\n \
    \   theta = np.floor((theta + 22.5) / 45) * 45\n    theta %= 360\n\n    # 最后输出的图像梯度\n\
    \    out = G.copy()\n\nfor i in range(1, H-1):\n```"
