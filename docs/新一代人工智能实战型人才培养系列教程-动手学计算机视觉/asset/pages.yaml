  md: "```\n# 初始化最终的结果，为布尔矩阵\nedges = np.zeros((H, W), dtype=np.bool_)\nweak_edges\
    \ = np.copy(weak_edges)\nedges = np.copy(strong_edges)\n# 将所有强边缘点的坐标组合成一个列表\n\
    q = [[i,j) for i in range(H) for j in range(W) if strong_edges[i,j]]\nwhile q:\n\
    \    # pop()函数返回列表中的末尾元素，并将其从列表中删除\n    i, j = q.pop()\n    # (a, b)是(i, j)的邻居\n\
    \    for a, b in get_neighbors(i, j, H, W):\n        # 如果当前点是弱边缘点且在强边缘点的邻域内，即可认为该点是边缘点\n\
    \        if weak_edges[a][b]:\n            # 为了避免对同一弱边缘点重复判断，便将其值设置为 0\n     \
    \       weak_edges[a][b] = 0\n            # 在边缘点中添加该弱边缘点\n            edges[a][b]\
    \ = 1\n            # 由于该弱边缘点已经变成边缘点，因此需要将其加入 q 中\n            # 通过将该点放进 q 中，在下一次迭代中可判断该点周围是否存在弱边缘点\n\
