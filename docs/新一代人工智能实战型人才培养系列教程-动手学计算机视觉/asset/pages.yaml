  md: "g(x, y) \\approx g(x, y_1) + \\frac{y - y_1}{y_2 - y_1} [g(x, y_2) - g(x, y_1)]\n\
    = \\frac{y_2 - y}{y_2 - y_1} g(x, y_1) + \\frac{y - y_1}{y_2 - y_1} g(x, y_2)\n\
    = \\frac{1}{(x_2 - x_1)(y_2 - y_1)} [x_2 - x \\quad x - x_1] \\begin{bmatrix}\
    \ g(Q_{11}) & g(Q_{12}) \\\\ g(Q_{21}) & g(Q_{22}) \\end{bmatrix} \\begin{bmatrix}\
    \ y_2 - y \\\\ y - y_1 \\end{bmatrix}\n\n如此，便可以求出点 P 的值。可以发现，双线性插值其实就是在两个方向上分别进行插值，而每个方向的“插值”过程类似于计算一个线性函数在某一点的函数值的过程。当我们学会了双线性插值之后，便可以对一幅分辨率为\
    \ 2 像素x2 像素的图像上采样，将其分辨率变为 4 像素x4 像素，如图 11-6 所示。\n\n观察上述数学形式，可以发现双线性插值可以通过卷积实现。因此可以用深度网络中的卷积层实现特征图的上采样，只是这个卷积层的卷积核是固定的。那么是否可以用可学习的卷积核来实现特征图上采样呢？当然也是可以的。这种可学习的卷积称为转置卷积或反卷积，是一个步长小于\
    \ 1 的卷积。实际上，当卷积的步长 s < 1 时，对图像进行卷积相当于在图像的相邻像素间插入 1/s-1 个零再进行步长为 1 的卷积。如图 11-7\
    \ 所示，对输入图像做步长为 0.5 的卷积实现对其上采样：首先要在图像的每两个相邻像素间插入一个值为零的像素，并在边界以 2 像素x2 像素补零；然后，对其做步长为\
    \ 1，卷积核为 3x3 的卷积。最终将图像从 2 像素x2 像素上采样到 5 像素x5 像素。在实际操作中，对特征图的每个通道依次进行上采样，得到最终的结果。\n\
    \n![](img/0e497601c0ca26be98c5399cbd72eb4c_164_0.png)\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_164_1.png)\n\
    \n在代码中，通过调用以下函数实现转置卷积。\n\n```\n```python\nimport torch\ntorch.nn.ConvTranspose2d(\n\
    \    in_channels=3,    # 输入数据的通道数\n    out_channels=3,   # 输出数据的通道数\n    kernel_size=3,\
    \    # 卷积核的大小\n    stride=2,         # 卷积步长\n    padding=0,        # 原图周围需要填充的像素\n\
    \    output_padding=0, # 输出特征图边缘需要填充的像素，一般不设置\n    groups=1,         # 分组卷积的组数，一般默认设置为\
    \ 1\n    bias=True         # 卷积偏置，一般设置为 False，设置为 True 可以增加模型的泛化能力\n)\n```\n```"
