- pgno: 45
  md: '那么如何实现“磨皮”呢？“磨皮”就是希望人脸变得平滑。回顾 3.1 节中所述，用方波信号对图像做卷积不就可以让图像变得平滑吗？所以，没错，用方波信号作为卷积核对人脸图像进行卷积就是实现“磨皮”的一种最简单的方法。那么，这背后的原理又是什么呢？


    方波信号作为卷积核的数学形式大家都很熟悉了，如下式所示：


    \(\boldsymbol{K} = \frac{1}{k^2} \begin{bmatrix} 1 & \cdots & 1 \\ \vdots & \ddots
    & \vdots \\ 1 & \cdots & 1 \end{bmatrix}_{k \times k}\)


    其中，\(k\) 为卷积核的大小。设输入图像为 \(\boldsymbol{I}\)，对其用上述方波信号作为卷积核做卷积的输出图像为 \(\hat{\boldsymbol{I}}\)，根据第
    2 章卷积的计算公式，我们得到 \(\boldsymbol{I}\) 和 \(\hat{\boldsymbol{I}}\) 间的关系：


    \(\hat{I}(i, j) = I(i, j) * K(i, j) = \sum_{m=i-k}^{i-1} \sum_{n=j-k}^{j-1} I(m,
    n) K(i-m, j-n) = \frac{1}{k^2} \sum_{m=i-k}^{i-1} \sum_{n=j-k}^{j-1} I(m, n)\)


    由此可见，用方波信号对图像做卷积，其实就是对图像中每个 \(k \times k\) 邻域内的像素进行平均，所以方波卷积核也称为均值滤波器（mean filter），其中
    \(k\) 为均值滤波器的大小。大家知道求均值可以降噪，而图像上的噪声一般是像素值发生突变的地方，例如人脸上的褶皱。通过均值滤波对图像处理，就可以去除这些褶皱，实现“磨皮”。均值滤波器能去掉高频噪声，只保留图像的低频信息，因此是一种低通滤波器，即允许低频信息通过的滤波器。下面，我们对
    3.2.2 节生成的有高斯噪声的人脸图像进行均值滤波，并观察其效果。


    ```

    # 均值滤波器 size=3

    size = 3

    k3 = 1/size/size * np.ones((size, size))


    # 展示输入图像与滤波核

    conv_gaussian = conv_2d(img_gaussian, k3)

    conv_gaussian.plot()


    # 展示卷积结果

    conv_gaussian.plot_conv()

    ```


