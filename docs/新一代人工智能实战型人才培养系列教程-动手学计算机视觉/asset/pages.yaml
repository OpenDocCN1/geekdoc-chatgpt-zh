- pgno: 253
  md: '# 16.2.6 畸变


    前面提到小孔成像的进光量不足，因此我们通常使用透镜来代替小孔进行成像。然而，透镜的制造和组装过程可能引入某些偏差，这些偏差将导致光线并不完全按照预期的路径传播，从而引起图像畸变。这些畸变有两种类型：


    +   - 由于透镜设计和光学特性导致的畸变称为径向畸变；


    +   - 由于透镜与成像平面未能保持严格平行而产生的畸变称为切向畸变。


    接下来，我们将分别介绍径向畸变和切向畸变的成因以及纠正方法。


    # 1. 径向畸变


    在理想情况下，透镜应当使得射入的光线精确会聚在成像平面上的特定点上。然而在实际中，光线经过透镜时并不总是完美地聚焦到一个点上，特别是经过透镜边缘的光线。这种现象称为透镜的球面像差。在透镜的中心附近，光线较容易被准确聚焦，但随着光线射入点与透镜中心距离的增加，光线的聚焦误差也增大，导致图像上相应位置的点不再是射入光线的真实映射，而是向内或向外偏移，形成了所谓的径向畸变。径向畸变通常表现为两种形式：桶形畸变和枕形畸变。枕形畸变使得图像边缘向中心凹陷，而桶形畸变则使得图像边缘向外膨胀，如图
    16-5 所示。畸变的程度通常随着与透镜中心的距离的增加而加剧。


    # 2. 切向畸变


    为了确保光线均匀聚焦于成像平面，理想情况下透镜与成像平面应保持完全平行。但是由于制造缺陷、装配误差等因素，透镜可能与成像平面不完全平行，如图 16-6 所示。这种不完全平行导致光线在抵达成像平面时呈现一定角度，进而在图像的某些区域造成拉伸或压缩现象。图像边缘区域尤其容易受到透镜倾斜或偏移的影响，因为这些区域的光线路径变化最为显著。由此产生的畸变称为切向畸变，它主要影响图像的边缘，使得直线看起来弯曲，从而影响成像质量。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_253_0.png)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_253_1.png)


    # 3. 畸变纠正


    如图 16-7 所示，径向畸变可以理解成实际成像点沿着径向方向发生了位移，而切向畸变可以理解成实际成像点沿着切线方向发生了位移。因此我们可以使用多项式函数来描述畸变带来的坐标变化，从而实现畸变纠正。'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/0e497601c0ca26be98c5399cbd72eb4c_254_0.png)


    图 16-7 畸变时成像点发生位移


    首先，让我们用数学语言来描述径向畸变的形成：给定照相机坐标系中一点的坐标为 \((x_c, y_c, z_c)\)，假如透镜不存在畸变，我们可以根据相似三角形直接得到理想情况下该点在成像平面上的投影点（像素点）在图像坐标系中的坐标。由
    16.2.4 节我们可以得到


    ```

    \(\begin{bmatrix} u \\ v \\ 1 \end{bmatrix} = \begin{bmatrix} f_x & 0 & c_x \\
    0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x''_c \\ y''_c \\ 1 \end{bmatrix}\)

    ```


    其中，\(x''_c\) 和 \(y''_c\) 分别等于 \(\frac{x_c}{z_c}\) 和 \(\frac{y_c}{z_c}\)。然而由于透镜的畸变，实际上观测到的像素位置在径向发生了偏移，且其偏移程度与该点到图像中心的距离有关。因此，我们可以用一个多项式函数来描述径向畸变的纠正：


    ```

    \(\begin{cases} x_{cor} = x''_c(1 + k_1 r^2 + k_2 r^4 + k_3 r^6 + ...) \\ y_{cor}
    = y''_c(1 + k_1 r^2 + k_2 r^4 + k_3 r^6 + ...) \end{cases}\)

    ```


    其中，\(r^2 = x_c''^2 + y_c''^2\)。这里的 \(k_1, k_2, k_3, ...\) 是径向畸变的畸变系数，它们是通过照相机标定得到的。在一般的镜头中，使用前两个系数（\(k_1\)
    和 \(k_2\) ）就能很好地处理畸变；对于畸变很大的镜头，如鱼眼镜头等，我们还需要加入 \(k_3\) 项甚至更高次项对畸变进行纠正。类似地，切向畸变可以看成坐标点沿着切线方向发生了变化，因此我们可以引入额外的两个参数
    \(p_1\) 和 \(p_2\) 来进行切向畸变的纠正：


    ```

    \(\begin{cases} x_{cor} = x''_c + 2 p_1 x''_c y''_c + p_2 (r^2 + 2 x_c''^2) \\
    y_{cor} = y''_c + p_1 (r^2 + 2 y_c''^2) + 2 p_2 x''_c y''_c \end{cases}\)

    ```


    经过上面的学习，我们已经初步了解了径向畸变和切向畸变的纠正模型，真实的场景中，径向畸变和切向畸变通常同时存在，因此我们需要联立径向畸变和切向畸变的纠正方程：


    ```

    \(\begin{cases} x_{cor} = x''_c(1 + k_1 r^2 + k_2 r^4 + k_3 r^6 + ...) + 2 p_1
    x''_c y''_c + p_2 (r^2 + 2 x_c''^2) \\ y_{cor} = y''_c(1 + k_1 r^2 + k_2 r^4 +
    k_3 r^6 + ...) + p_1 (r^2 + 2 y_c''^2) + 2 p_2 x''_c y''_c \end{cases}\)

    ```


    然后基于照相机内参矩阵 \(K\) 将 \((x_{cor}, y_{cor})^T\) 转换为 \((u_{cor}, v_{cor})^T\)，这样我们就得到了纠正后的图像坐标系坐标：'
  merge: -1
  img_proc: true
- pgno: 255
  md: '```

    \begin{cases} u_{cor} = f_x x_{cor} + c_x \\ v_{cor} = f_y y_{cor} + c_y \end{cases}

    ```


    由于不同照相机的特性不同，这 5 个参数在实际运用过程中可以自由组合，并不一定需要全部考虑。


    至此，我们完整地介绍了照相机成像模型，这个模型能够很好地描述照相机的成像过程并且能够纠正径向畸变和切向畸变。在实际应用中，我们需要通过照相机标定来获取模型中参数的值。


    # ## 16.3 照相机标定的实现


    在 16.2 节中，我们深入探讨了照相机成像原理、内外参数的概念及畸变纠正模型。已知照相机内外参数和畸变参数，可以精确计算空间中任意一点在成像平面上投影点的坐标。那么，反过来，能否通过空间点在成像平面上投影点的坐标来求解照相机的内外参数和畸变参数呢？这个问题就是照相机标定问题。答案是肯定的，这个过程本质上是一个参数估计问题，通过数学上的优化方法可以实现。具体来说，我们可以收集一系列已知三维空间点及其对应的二维图像上投影点的坐标，使用这些坐标作为输入，通过最小化重投影误差，即三维点投影到二维成像平面上的点与实际图像上观测到的点之间的坐标差异，来反向解出照相机的参数。这种方法通常需要多组数据以确保求解过程的稳定性和准确性。通过这种方法，我们可以得到照相机的内参、外参及畸变参数，从而实现照相机标定。


    # ## 16.3.1 标定板


    在介绍标定流程之前，我们先了解一下标定板。标定板是照相机标定过程中不可或缺的工具。它通常由一系列具有高对比度的图案组成，这些图案的几何尺寸和布局是精确已知的。图
    16-8 展示了一种常见的标定板，它的图案是由一系列黑白相间的棋盘格组成，因此被称为棋盘格标定板。我们将以棋盘格标定板为例说明如何进行照相机标定。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_255_0.png)


    图 16-8 棋盘格标定板'
