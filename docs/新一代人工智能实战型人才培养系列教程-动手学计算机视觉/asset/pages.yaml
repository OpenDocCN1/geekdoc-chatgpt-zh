  md: "```\nclass ResidualBlock(nn.Module):\n    # 深度学习中的图像和利用模型提取的特征图往往有很多通道（channel）\n\
    \    # 如 RGB 图像的通道为 3，即 R 通道、B 通道与 G 通道\n    def __init__(self, inchannel, outchannel,\
    \ stride=1, shortcut=None):\n        super(ResidualBlock, self).__init__()\n \
    \       # 观察图 10-6，不难发现残差块可大致分为左右两部分\n        # 左边是一系列的网络层级，右边是一个短路连接\n      \
    \  # 定义左边\n        self.left = nn.Sequential(\n            # 对应图 10-6 中第一个权重层\n\
    \            nn.Conv2d(inchannel, outchannel, 3, stride, 1, bias=False),\n   \
    \         nn.BatchNorm2d(outchannel),\n\n            # 对应图 10-6 中的 ReLU\n    \
    \        nn.ReLU(inplace=True),\n\n            # 对应图 10-6 中第二个权重层\n          \
    \  nn.Conv2d(outchannel, outchannel, 3, 1, 1, bias=False),\n            nn.BatchNorm2d(outchannel)\n\
    \        )\n\n        # 定义右边\n        self.right = shortcut\n\n    # forward()\
    \ 函数在网络结构中起到举足轻重的作用，它决定着网络如何对数据进行传播\n    def forward(self, x):\n        out =\
    \ self.left(x)\n        # 构建残差块\n        residual = x if self.right is None else\
    \ self.right(x)\n        out += residual\n\n    return F.relu(out)\n```\n\n# 在这一模块中，将实现\
    \ ResNet34，其对应的架构可查看图 10-7\n\n```\nclass ResNet(nn.Module):\n    def __init__(self,\
    \ num_classes=102):\n        super(ResNet, self).__init__()\n        # 前几层图像转换\n\
    \        self.pre = nn.Sequential(\n            nn.Conv2d(3, 64, 7, 2, 3, bias=False),\n\
    \            nn.BatchNorm2d(64),\n            nn.ReLU(inplace=True),\n       \
    \     nn.MaxPool2d(3, 2, 1),\n        )\n\n        # 重复的网络层分别有 3、4、6、3 个残差块\n\
    \        self.layer1 = self._make_layer(64, 128, 3)\n        self.layer2 = self._make_layer(128,\
    \ 256, 4, stride=2)\n        self.layer3 = self._make_layer(256, 512, 6, stride=2)\n\
    \        self.layer4 = self._make_layer(512, 512, 3, stride=2)\n```"
