    同理，对图像平移并不会改变矩阵的特征值大小，因此 Harris 角点检测依旧具有不变性。但是对图像进行缩放，原来图像中的角点有可能被检测为边缘。如图 6-8
    所示，图像放大之后，原来的角点被检测为多个边缘点。因此，角点对于图像的尺度变化不具有不变性！


