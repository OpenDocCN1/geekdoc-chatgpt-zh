  md: "为了方便，我们将直接使用归一化互相关作为度量指标，并直接调用库函数 cv2.TM_CCORR_NORMED() 来完成归一化互相关。\n\n```\n\
    import numpy as np\n\n# 利用快速排序算法找到数列中第 k 大的值\ndef findKth(s, k):\n    return findKth_c(s,\
    \ 0, len(s) - 1, k)\n\ndef findKth_c(s, low, high, k):\n    m = partition(s, low,\
    \ high)\n    if m == len(s) - k:\n        return s[m]\n    elif m < len(s) - k:\n\
    \        return findKth_c(s, m + 1, high, k)\n    else:\n        return findKth_c(s,\
    \ low, m - 1, k)\n\ndef partition(s, low, high):\n    pivot, j = s[low], low\n\
    \    for i in range(low + 1, high + 1):\n        if s[i] <= pivot:\n         \
    \   j += 1\n            s[i], s[j] = s[j], s[i]\n    s[j], s[low] = s[low], s[j]\n\
    \    return j\n```\n\n```\n# 构建多目标模板匹配类\nclass temp_match_multi():\n    def __init__(self,\
    \ img, temp, k=50):\n        self.img = img\n        self.temp = temp\n      \
