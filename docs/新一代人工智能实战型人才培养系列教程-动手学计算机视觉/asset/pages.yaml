  md: "实际上，除了零填充操作可以实现输出信号长度的变化，还可以通过改变卷积核每次移动的步长（stride）改变输出信号的长度。这里的步长是指卷积核每次移动的距离，例如使用一个步长为\
    \ 2 的卷积核对图 2-3 中的输入信号进行卷积，当卷积核在 “0” 的位置完成卷积之后，便会直接在 “3” 的位置进行下一次卷积。很明显，此时一共会进行\
    \ 4 次卷积操作，因此输出信号的长度为 4。假设卷积核的步长为 s，在输入信号每一边零填充的个数为 p，可以得到输出信号的长度为 \\(\\frac{m-n+2p}{s}\
    \ + 1\\)。这一公式在二维卷积中同样适用。\n\n接下来，我们将动手编写一维卷积函数。我们用数组表示离散函数，并对输入信号零填充，零填充的个数为卷积核大小减\
    \ 1，设置卷积核的步长为 1，则输出信号的长度为 m+n-1。\n\n```\nimport matplotlib.pyplot as plt\n\n#\
    \ 一维卷积\nclass conv_1d():\n    def __init__(self, a, b):\n        # 输入信号\n    \
    \    self.f = a\n        # 卷积核\n        self.b = b\n        # 输入信号的坐标，默认从 0 开始。\n\
