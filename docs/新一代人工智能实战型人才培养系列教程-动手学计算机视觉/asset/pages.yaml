    \ = p2_norm[i, 0]\n    w[i, 3] = p1_norm[i, 0] * p2_norm[i, 1]\n    w[i, 4] =\
    \ p1_norm[i, 1] * p2_norm[i, 1]\n    w[i, 5] = p2_norm[i, 1]\n    w[i, 6] = p1_norm[i,\
    \ 0]\n    w[i, 7] = p1_norm[i, 1]\n    w[i, 8] = 1\n# SVD\nU, sigma, VT = np.linalg.svd(w)\n\
    f = VT[-1, :].reshape(3, 3)\nU, sigma, VT = np.linalg.svd(f)\nsigma[2] = 0\nf\
    \ = U.dot(np.diag(sigma)).dot(VT)\n# 逆归一化\nf = T2.T.dot(f).dot(T1)\n\n#### 随机计算的\
