  md: '# # 第 19 章


    # # 三维重建


    # ## 19.1 简介


    前面几章介绍了照相机的标定、光流的计算和平行双目视觉，这些都是在探索如何从二维图像中获取三维信息。有了这些知识的铺垫，本章终于要介绍如何从我们日常生活中拍摄的图像中重建三维场景了。


    首先考虑单幅图像的情况。由于单幅图像无法提供深度信息，因此无法准确估计成像物体的真实尺寸，从而会出现如图 19-1 所示的视觉错觉。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_292_0.png)


    图 19-1 单幅图像无法提供深度信息导致的视觉错觉


    要重建场景几何结构，往往需要多幅图像。第 18 章介绍了平行双目视觉系统，通过视差，我们能够从平行双目照相机所拍摄的图像对中恢复场景的深度信息。但是在实际生活中，我们所获得的多幅图像往往不是由平行双目照相机拍摄的，在很多情况下，这些图像是由同一台照相机从不同的视角拍摄的。试想，我们在桌面上看到了一个精致的不倒翁，于是手持同一台照相机从不同视角拍摄了两张照片，如图
    19-2 所示。显然这两幅图像并不符合平行双目视觉系统中两台照相机的光轴平行这一假设，因此不能直接套用平行双目视觉系统中所介绍的方法来计算深度信息。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_292_1.png)'
