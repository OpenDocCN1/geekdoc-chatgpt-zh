- pgno: 283
  md: '以被视为具有相同特性的针孔照相机模型。它们被水平放置，这意味着两台照相机的光心均位于 x 轴上，且它们的光轴平行。照相机光心之间的水平距离称为双目照相机的基线（baseline，长度用
    b 表示），这是衡量双目照相机几何配置的关键参数。基线的长度对于计算图像间的视差及最终确定场景中物体的深度信息至关重要。


    现在，考虑一个空间点 P，它在左侧照相机坐标系下的坐标为(x, y, z)，在左侧照相机和右侧照相机各成一像，记作 Pl、Pr。理想情况下，由于左、右照相机只在
    x 轴的位置上有差异，因此 P 的像也只在 x 轴（对应图像的 u 轴）上有差异。我们记它在左侧图像上的像素坐标为 (ul, vl)，在右侧图像的像素坐标为
    (ur, vr)。


    # 18.2.2 视差


    如图 18-2 所示，空间点 P 和左、右照相机的光心 Ol、Or 及点 P 和左、右屏幕投影点 Pl、Pr 构成了相似三角形 △POlOr ~ △PPlPr。通常，双目照相机的基线长度
    b 是已知的且左、右照相机内参完全相同。根据照相机的成像原理，我们可以得到


    ```

    $$u_l = \frac{f \times x}{z} + c_x, \quad v_l = \frac{f \times y}{z} + c_y$$

    ```


    由于右侧照相机的光心和左侧照相机的光心在 x 轴上的坐标差值为基线长度 b，因此有


    ```

    $$u_r = \frac{f \times (x - b)}{z} + c_x, \quad v_r = \frac{f \times y}{z} + c_y$$

    ```


    将上述两个方程整理为


    ```

    $$u_l - u_r = \frac{f \times b}{z}$$

    ```


    令 $d = u_l - u_r$，则有


    ```

    $$z = \frac{f \times b}{d}$$

    ```


    这里，d 为左图像和右图像的横坐标之差，称为视差（disparity）；z 为点的深度。观察这组表达式不难发现，在水平放置的双目照相机中，一个空间点在两个照相机成像平面上的
    v 轴（垂直轴）坐标是相同的，而该点的深度决定了其视差。由公式可知，视差与深度成反比，视差越大，深度越小。我们可以利用视差来估计场景中物体的深度信息。同时需要注意的是，视差的计算是基于像素坐标的，而像素坐标是离散的，因此视差也是离散的。双目视觉系统所能测量的深度的分度值（能够测量出的最小深度变化量）存在一个理论上的最大值，也就是
    f x b。在照相机参数固定的情况下，基线


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_283_0.png)


    # 图 18-2 视差计算'
