  md: "# 8.2 图像变换\n\n仔细观察图 8-1 中的一系列图像与图 8-2 中拼接的全景图，它们在几何上有什么相似性吗？没错，图 8-2 中的全景图可以通过图\
    \ 8-1 中的子图经过缩放、旋转、射影等一些操作之后拼接组合得到。对图像进行的这些操作统称为图像变换（image transformation）。我们先简单介绍几种常用的图像变换。\n\
    \n(1) 平移：将图像 $I$ 按向量 $(t_x, t_y)$ 平移，则图像上一点 $(i, j)$，对应的向量为 $\boldsymbol{p} =\
    \ (i, j)$，经过平移后得到新的点为 $(i', j')$，对应的向量为 $\boldsymbol{p}' = (i', j')$，有 $\boldsymbol{p}'\
    \ = \boldsymbol{p} + \boldsymbol{t}$，其中，$\boldsymbol{t} = (t_x, t_y)$ 的方向为平移方向，$\b\
    oldsymbol{t}$ 的大小为平移距离；\n\n(2) 旋转：将图像绕原点(0,0)逆时针旋转 $\theta$，则图像上一点 $(i, j)$，对应的向量为\
    \ $\boldsymbol{p} = (i, j)$，旋转之后得到的新的点对应的向量为 $\boldsymbol{p}' = \boldsymbol{R}\b\
    oldsymbol{p}$，其中，$\boldsymbol{R} = \begin{bmatrix} \\cos\theta & -\\sin\theta\
    \ \\ \\sin\theta & \\cos\theta \\end{bmatrix}$ 为旋转矩阵；\n\n(3) 缩放：以原点(0,0)为缩放中心，对图像沿\
    \ $x$ 轴缩放 $s_x$ 倍，沿 $y$ 轴缩放 $s_y$ 倍，则图像上一点 $(i, j)$，对应的向量为 $\boldsymbol{p} = (i,\
    \ j)$，缩放之后得到的点对应的向量为 $\boldsymbol{p}' = \boldsymbol{S}\boldsymbol{p}$。其中，$\boldsymbol{S}\
    \ = \begin{bmatrix} s_x & 0 \\ 0 & s_y \\end{bmatrix}$ 是缩放矩阵；\n\n(4) 对称：如果将图像绕\
    \ $y$ 轴做镜像，不难得到图像上一点 $(i, j)$，对应的向量为 $\boldsymbol{p} = (i, j)$，关于 $y$ 轴对称的点对应的向量为\
    \ $\boldsymbol{p}' = (-i, j)$，那么 $\boldsymbol{p}' = \begin{bmatrix} -1 & 0 \\\
    \ 0 & 1 \\end{bmatrix} \boldsymbol{p}$；如果将图像绕直线 $y=x$ 做镜像，则 $\boldsymbol{p}' =\
    \ (j, i)$，即 $\boldsymbol{p}' = \begin{bmatrix} 0 & 1 \\ 1 & 0 \\end{bmatrix} \b\
    oldsymbol{p}$。\n\n不难发现，上述 (2)、(3)、(4) 中图像变换前后的对应关系是线性的，即可以写成 $\boldsymbol{p}'\
    \ = \boldsymbol{T}\boldsymbol{p}$ 的矩阵形式，而平移却不可以用这样的线性变换来表示。矩阵乘法的线性变换形式易于计算，能否将平移也用矩阵乘法形式表示呢？\n\
    \n当然可以。只不过，需要把常用的笛卡儿坐标系拓展至齐次坐标系（homogeneous coordinate system）。令 $\\lambda$ 是一个常数，在笛卡儿坐标系下，对于一个向量\
    \ $\boldsymbol{v}$，一般有 $\boldsymbol{v} \neq \\lambda \boldsymbol{v}$；而在齐次坐标系下，总有\
    \ $\boldsymbol{v} = \\lambda \boldsymbol{v}$。那么笛卡儿坐标系和齐次坐标系如何转换呢？如图 8-3 所示，在 $x$\
    \ 轴、$y$ 轴的基础上增加 $w$ 轴，并将笛卡儿坐标系中的点 $(i, j)$ 表示为 $(i, j, 1)$，我们把这样的坐标系称为齐次坐标系。对于齐次坐标系中任意一点\
    \ $(x, y, w)$，其对应的笛卡儿坐标系中的坐标为 $(x/w, y/w)$。\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_116_0.png)\n\
    \n在此基础上，可以把平移前后的点表示为"
