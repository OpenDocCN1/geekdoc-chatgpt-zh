  md: '# # 第 8 章 图像拼接


    # ## 8.1 简介


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_115_0.png)


    当游览祖国的大好河山时，我们往往一边感慨山川的奇伟俊丽，一边遗憾自己没有设备去拍一幅全景图，而只能拍一些不同视角下分离的照片。通过对本章的学习，或许你就可以自己生成全景图。


    图像拼接（image stitching）是指将多张拍摄同一场景的有重叠的图像（可能是不同时间、不同视角或者不同传感器获得的图像）拼接成一幅无缝的大尺寸全景图的技术。图像拼接在运动检测与跟踪、增强现实、分辨率增强、视频压缩和图像稳定等计算机视觉任务上有很多的应用。图
    8-1 和图 8-2 展示了一个图像拼接的例子。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_115_1.png)


    图 8-1 从不同视角拍摄同一场景得到的不同图像


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_115_2.png)


    图 8-2 图像拼接'
