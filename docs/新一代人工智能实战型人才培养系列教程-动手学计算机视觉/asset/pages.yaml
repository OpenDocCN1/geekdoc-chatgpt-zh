  md: '有些检测到的特征点并不是真正的特征点，需要进一步筛选。由于这些特征点是离散的尺度空间中的极值点，而离散空间中的极值点与连续空间中的极值点是有差别的，如图
    7-11 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_98_0.png)


    图 7-11 离散空间与连续空间极值点的差别（另见彩插图 5）


    为了从候选特征点中筛选出真正需要的特征点，可以利用插值的方法。首先对高斯差分算子进行曲线拟合。该算子的泰勒展开为


    \( D(\boldsymbol{x}) = D(\boldsymbol{0}) + \frac{\partial D^{\mathrm{T}}}{\partial
    \boldsymbol{x}} \boldsymbol{x} + \frac{1}{2} \boldsymbol{x}^{\mathrm{T}} \frac{\partial^2
    \boldsymbol{D}}{\partial x^2} \boldsymbol{x} \)


    其中，\( \boldsymbol{x} = (x, y, \sigma)^{\mathrm{T}} \)。令方程求导为 0，可以得到真实极值点位置相对于当前位置的偏移量：


    \( \hat{\boldsymbol{x}} = -\frac{\partial^2 \boldsymbol{D}}{\partial x^2} \frac{\partial
    \boldsymbol{D}}{\partial \boldsymbol{x}} \)


    一般认为，当 \( \hat{\boldsymbol{x}} \) 在任一维度（\( x, y \) 或 \( \sigma \)）的偏移量大于 0.5 时，插值中心已经偏移到它的邻近点上，所以必须更新当前候选特征点的位置，并在新的位置上反复插值直到收敛。在实际操作中，这一过程也有可能超出所设定的迭代次数，或者更新的极值点的位置超出图像边界，这样的点应该删除。


    代入极值点 \( \boldsymbol{x}^* = \boldsymbol{x} + \hat{\boldsymbol{x}} \)，方程的值为


    \( D(\boldsymbol{x}^*) = D(\boldsymbol{0}) + \frac{1}{2} \frac{\partial \boldsymbol{D}^{\mathrm{T}}}{\partial
    \boldsymbol{x}} \hat{\boldsymbol{x}} \)


    我们把 \( D(\boldsymbol{x}^*) \) 称为该点的对比度。由于对比度低的点容易受噪声的干扰而变得不稳定，因此需要将低对比度（小于某个经验值，如
    0.03）的极值点删除。


    除此之外，还要消除边缘响应（edge response）大的候选特征点，7.1 节提到边缘区域不是特征点区域，因为无法对其进行精准定位，那么该如何消除边缘响应大的候选特征点呢？在第
    6 章中，对于图像中某一位置(i,j)，可以用角点响应函数确定其是否为边缘。令 \( \lambda_1 \) 和 \( \lambda_2 \) 是(i,j)位置对应的黑塞矩阵
    \( \boldsymbol{H} \) 的两个特征值，当其中一个特征值远大于另一个时，认为该位置是边缘。假设 \( \lambda_1 = r \lambda_2
    \)，有


    \( \frac{\text{trace}(\boldsymbol{H})^2}{\text{det}(\boldsymbol{H})} = \frac{(\lambda_1
    + \lambda_2)^2}{\lambda_1 \lambda_2} = \frac{(r+1)^2 \lambda_2^2}{r \lambda_2^2}
    = \frac{(r+1)^2}{r} \)


    根据不等式的相关知识，我们知道，上述公式的值在 \( r=1 \)（两个特征值相等）时最小，而随着 \( r \) 的增大而增大。\( r \) 越大，即表示两个特征值差距越大，这一位置越有可能是边缘。因此，为了检测候选特征点是否为边缘点，只需检验下式是否被满足：


    \( \frac{\text{trace}(\boldsymbol{H})^2}{\text{det}(\boldsymbol{H})} < \frac{(r+1)^2}{r}
    \)


    根据经验，\( \gamma=10 \)。这样，经过筛选的特征点即为最终确定的特征点。'
