  img_proc: true
- pgno: 183
  md: 'ROI，是图像上的候选区域映射在特征图上的对应区域。这个特征提取器需要从整幅图像的特征图中提取每个 ROI 的特征(从而根据候选区域和 ROI 的映射关系，得到每个候选区域的特征)，且不同空间分辨率的
    ROI 需要具有统一的特征维度，以方便接入后续的分类器和回归器进行训练。Fast R-CNN 中提出的候选区域特征提取器叫作 ROI 池化。简单来说，ROI
    池化层将每个 ROI 均匀分成 M x N 个子窗口，然后对每个子窗口内的特征进行池化。设整幅图像的特征图中特征向量的维度为 d，则不论 ROI 的空间分辨率为多少，通过
    ROI 池化层产生的 ROI 特征图的维度统一为 M x N x d 。


    具体来说，Fast R-CNN 整体流程如图 12-7 所示，可分为 3 个步骤：


    +   (1) 从输入图像提取候选区域；

    +   (2) 利用主干网络计算整幅输入图像的特征图；

    +   (3) 通过 ROI 池化从整幅图像的特征图直接提取每个候选区域的特征，用于候选区域目标类别分类与包围盒回归。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_183_0.png)


    # 图 12-7 Fast R-CNN 流程（插图素材源自参考文献[3]）


    由于 ROI 池化是在整幅图像的特征图上进行的，实现这个操作需要计算得到候选区域和 ROI 之间的映射关系，这先要了解主干网络（如 ResNet 或 VGG
    等）中卷积层和池化层的操作对特征图空间分辨率的影响。例如，一幅图像在经过一个步长为 2 的卷积层或池化层后，输出的特征图的宽度和高度分别是原图像的宽度和高度的
    1/2。依此类推，一幅图像在经过 l 个步长为 2 的卷积层或池化层后，输出的特征图的宽度和高度则分别是原图像的宽度和高度的 1/2^l。由此可见，当前特征图与原始输入图像相比，空间分辨率会存在一个比例关系，称为空间下采样因子（spatial
    downsampling factor）。例如，在使用 VGG16 作为主干网络时，其最后一个卷积层输出的特征图的空间下采样因子 S = 32 （因为下采样了
    5 次）。对于一个给定的原始图像上的候选区域，可以通过以下计算过程找到在特征图中对应的 ROI。


    设原始图像中的候选区域的左上角坐标为 (x1, y1)，右下角坐标为 (x2, y2)。先将原始坐标除以空间下采样因子 S，然后对左上角坐标向下取整，并对右下角坐标向上取整，分别得到取整的坐标
    [(x1/S), (y1/S)] 和 [(x2/S), (y2/S)]。取整是因为除以空间下采样因子可能会导致坐标为非整'
  merge: -1
  img_proc: true
- pgno: 184
  md: '数。这里我们举一个实际的例子，假设原始候选区域的左上角坐标和右下角坐标分别为(50,50)和(200,200)，并且空间下采样因子为 16，如图 12-8
    所示，对应在特征图中区域的左上角坐标和右下角坐标即为\(\left(\frac{50}{16},\frac{50}{16}\right)\)和\(\left(\frac{200}{16},\frac{200}{16}\right)\)（图中虚线框），那么取整后的坐标分别为\(\left(\left\lfloor\frac{50}{16}\right\rfloor,\left\lfloor\frac{50}{16}\right\rfloor\right)\)和\(\left(\left\lceil\frac{200}{16}\right\rceil,\left\lceil\frac{200}{16}\right\rceil\right)\)。根据取整后的坐标，可以找到特征图中与原始图像中的候选区域对应的映射区域。在上述例子中，经过取整，特征图中的映射区域的左上角坐标为(3,3)，右下角坐标为(13,13)，即映射区域为实线框所示区域。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_184_0.png)


    图 12-8 对特征图中候选区域的坐标进行取整


    基于上述计算过程得到特征图中的映射区域后，便可以通过 ROI 池化层来提取这些区域的特征。接下来，如图 12-7 所示，每个 ROI 特征图通过两个全连接层后得到一个
    ROI 特征向量；最后，基于 ROI 特征向量，对给定候选区域进行目标类别分类和包围盒回归。


    与 R-CNN 一样，Fast R-CNN 也包括训练和测试两个阶段。在训练阶段，对于每个 ROI，需要为其赋予一个真实类别标签 \(u\) 和包围盒回归偏移量
    \(v\)，采用的赋予方式与 R-CNN 中的相同。Fast R-CNN 中定义该 ROI 上的损失函数为


    \(L(q,u,t,v)=L_{cls}(q,u)+\lambda l(u)L_{loc}(t,v)\)


    其中，\(q\) 是图 12-7 中 softmax 层对该 ROI 的类别分类输出，是一个定义在 \(|C|+1\) （+1 表示背景类别）个类别上的概率分布；\(t\)
    是图 12-7 中包围盒回归层对该 ROI 的包围盒回归偏移量输出；\(l\) 是一个指示函数（indicator function），在 \(u \ge
    1\) 时返回 1，否则返回 0，因为当候选区域被认为是背景类别时不需要进行候选区域的包围盒回归。


    损失函数由两部分组成，一个是分类损失 \(L_{cls}\)，一个是包围盒回归损失 \(L_{loc}\)。其中，\(L_{cls}(q,u)=-\log(q_u)\)，\(q_u\)
    表示预测的分布 \(q\) 在真实类别 \(u\) 上的概率值。而 \(L_{loc}\) 是平滑 L1 范数（smooth L1 norm）损失，定义如下：


    \(L_{loc}(t,v)=\sum_{j\in\{x,y,w,h\}}smooth_{L_1}(t_j-v_j)\)


    其中，


    \(smooth_{L_1}(x)=\begin{cases} 0.5x^2, & |x|<1 \\ |x|-0.5, & \text{其他} \end{cases}\)'
