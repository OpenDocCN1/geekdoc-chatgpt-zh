    \ by CCORR\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_62_0.png)\n\n由结果可见，通过归一化，消除了输入图像子图整体亮度对互相关计算的影响，提升了互相关度量的鲁棒性。\n\
    \n# 4.3 多目标模板匹配\n\n与单目标模板匹配不同的是，在多目标匹配任务中，需要设定一个阈值。当模板与某个输入图像子图的相似度大于该阈值时，即可认为该输入图像子图即为需要匹配的对象。\n\
    \n这里，我们需要对阈值的选择进行说明。如果阈值设定过小，那么图像中会有很多子图被认为和模板匹配，造成很多虚假匹配；而一旦阈值设定过大，图像中也许没有任何子图可以和模板匹配。因此，在多目标模板匹配中，需要选择一个合适的阈值。设定需要匹配的子图个数\
    \ k，并将阈值设定为第 k+1 大的相似度的值。"
