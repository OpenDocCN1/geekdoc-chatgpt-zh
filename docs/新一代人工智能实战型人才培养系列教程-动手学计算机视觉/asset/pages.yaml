    \(\tilde{u}_i^\top F \tilde{u}_r = 0\)


    到这里，我们就建立了三维空间中一点在左、右成像平面上的投影点在图像坐标系中的坐标之间的关系，$F$ 一般称为基础矩阵（fundamental matrix）。


    # 19.2.3 利用八点法求解基础矩阵


    由恒等式 \(\tilde{u}_i^\top F \tilde{u}_r = 0\) 可知，本质矩阵 \(E\) 和基础矩阵 \(F\) 之间仅相差一个与照相机内参相关的矩阵。因此只要我们能够求解出矩阵
    \(F\)，并结合已知的照相机内参（即便照相机内参未知，也可通过第 16 章中介绍的方法来标定获得），便能够获得照相机之间的相对位姿。\(F\) 是一个 \(3
    \times 3\) 的矩阵，理论上有 9 个参数，但由于基础矩阵存在尺度不定性（即基础矩阵与任意非零标量的乘积不改变对极约束），实际上只需需 8 个独立参数。因此，至少需要
    8 对匹配点就能通过“八点法”求解基础矩阵。这些匹配点可以依据第 7 章介绍的特征检测方法获得。接下来我们介绍如何利用八点法来求解基础矩阵。


    首先假定已经通过特征检测获得了左、右图像上匹配点的像素坐标对，记为 \(((u_i^{(i)}, v_i^{(i)}), (u_r^{(i)}, v_r^{(i)}))\)，其中
    \(i = 1, 2, \cdots, m\) 且 \(m \ge 8\)。那么我们有


    [ [u_i^{(i)} \quad v_i^{(i)} \quad 1] \begin{bmatrix} f_{11} & f_{12} & f_{13}
    \\ f_{21} & f_{22} & f_{23} \\ f_{31} & f_{32} & f_{33} \\ \end{bmatrix} \begin{bmatrix}
    u_r^{(i)} \\ v_r^{(i)} \\ 1 \\ \end{bmatrix} = 0 ]


    展开可得


    \((f_{11}u_r^{(i)} + f_{12}v_r^{(i)} + f_{13})u_i^{(i)} + (f_{21}u_r^{(i)} + f_{22}v_r^{(i)}
    + f_{23})v_i^{(i)} + f_{31}u_r^{(i)} + f_{32}v_r^{(i)} + f_{33} = 0\)


    代入不同的像素坐标就可以构成一个齐次线性方程组


    \(\begin{bmatrix} u_i^{(1)}u_r^{(1)} & u_i^{(1)}v_r^{(1)} & u_i^{(1)} & v_i^{(1)}u_r^{(1)}
    & v_i^{(1)}v_r^{(1)} & v_i^{(1)} & u_r^{(1)} & v_r^{(1)} & 1 \\ u_i^{(2)}u_r^{(2)}
    & u_i^{(2)}v_r^{(2)} & u_i^{(2)} & v_i^{(2)}u_r^{(2)} & v_i^{(2)}v_r^{(2)} & v_i^{(2)}
    & u_r^{(2)} & v_r^{(2)} & 1 \\ \vdots & \vdots & \vdots & \vdots & \vdots & \vdots
    & \vdots & \vdots & \vdots \\ u_i^{(m)}u_r^{(m)} & u_i^{(m)}v_r^{(m)} & u_r^{(m)}
    & v_i^{(m)}u_r^{(m)} & v_i^{(m)}v_r^{(m)} & v_i^{(m)} & u_r^{(m)} & v_r^{(m)}
    & 1 \\ \end{bmatrix} \begin{bmatrix} f_{11} \\ f_{12} \\ f_{13} \\ f_{21} \\ f_{22}
    \\ \vdots \\ f_{23} \\ f_{31} \\ f_{32} \\ f_{33} \\ \end{bmatrix} = \begin{bmatrix}
    0 \\ 0 \\ \vdots \\ 0 \\ \end{bmatrix}\)


    这个方程是不是看上去很熟悉？我们在第 16 章中介绍照相机标定时看到过类似的 \(A \cdot f = 0\)，计算 \(\min_f \|Af\|^2\)
    s.t. \(\|f\|^2 = 1\)。具体求解过程可参考第 16 章，这里不再赘述。'
