- pgno: 296
  md: '[x_i \quad y_i \quad z_i] \begin{bmatrix} t_z y_i - t_y z_i \\ t_z x_i - t_x
    z_i \\ t_y y_i - t_x x_i \end{bmatrix} = 0


    上式可以转换为矩阵和向量相乘的形式：


    [x_i \quad y_i \quad z_i] \begin{bmatrix} 0 & -t_z & t_y \\ t_z & 0 & -t_x \\
    -t_y & t_x & 0 \end{bmatrix} \begin{bmatrix} x_i \\ y_i \\ z_i \end{bmatrix} =
    0


    两个向量的外积总是可以写成由其中一个向量中的元素排成的反对称矩阵与另一个向量的乘积。在这里，中间的矩阵就是一个反对称矩阵，记为 $T_x$。那么可以得到


    x_i^\top T_x x_i = 0


    将右侧的 $x_i$ 用 $R x_i + t$ 表示：


    x_i^\top T_x R x_i + x_i^\top T_x t = 0


    显然 $t$ 与自身的外积 $t \times t$ 为 0，于是得到


    x_i^\top \begin{bmatrix} 0 & -t_z & t_y \\ t_z & 0 & -t_x \\ -t_y & t_x & 0 \end{bmatrix}
    \begin{bmatrix} r_{11} & r_{12} & r_{13} \\ r_{21} & r_{22} & r_{23} \\ r_{31}
    & r_{32} & r_{33} \end{bmatrix} x_r = 0


    我们将上式的中间部分 $T_x R$ 简写为 $E$，那么得到 $x_i^\top E x_r = 0$。在这个式子中，$x_i$ 是空间点 $P$ 在左照相机坐标系中的坐标，$x_r$
    是空间点 $P$ 在右照相机坐标系中的坐标，中间的矩阵 $E$ 关联了三维空间中的点在不同照相机坐标系下的坐标，这个矩阵称为本质矩阵（essential matrix）。


    接下来考虑以照相机内参来表示坐标关系，假定左、右照相机的内参分别为 $K_l$、$K_r$。根据上面的推导，我们已经知道了同一个三维点在不同照相机坐标系下的坐标与照相机位置和姿态之间的关系。照相机坐标系到图像坐标系的变换关系为


    [x_i \quad y_i \quad z_i] \begin{bmatrix} e_{11} & e_{12} & e_{13} \\ e_{21} &
    e_{22} & e_{23} \\ e_{31} & e_{32} & e_{33} \end{bmatrix} \begin{bmatrix} x_r
    \\ y_r \\ z_r \end{bmatrix} = 0


    将其写成照相机内参相乘的形式：


    [u_i \quad v_i \quad 1](K_l^{-\top})^\top E K_r^{-1} \begin{bmatrix} u_r \\ v_r
    \\ 1 \end{bmatrix} = 0


    再令 $F = (K_l^{-\top})^\top E K_r^{-1}$，就得到


    [u_i \quad v_i \quad 1] \begin{bmatrix} f_{11} & f_{12} & f_{13} \\ f_{21} & f_{22}
    & f_{23} \\ f_{31} & f_{32} & f_{33} \end{bmatrix} \begin{bmatrix} u_r \\ v_r
    \\ 1 \end{bmatrix} = 0'
