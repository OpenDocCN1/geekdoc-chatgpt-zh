- pgno: 293
  md: '![](img/0e497601c0ca26be98c5399cbd72eb4c_293_0.png)


    图 19-2 从不同视角拍摄的不倒翁


    为了从这些图像中恢复场景的三维信息，我们需要使用照相机模型之间的约束来进行场景的几何结构推理。


    本章将介绍如何从非平行双目视觉系统拍摄的图像中恢复场景的几何信息，主要内容是对极几何（epipolar geometry）和三角测量（triangulation）。


    # 19.2 对极几何


    在介绍对极几何之前，先回顾一下平行双目视觉系统。在平行双目视觉系统中，两台照相机水平放置且光轴互相平行。在这种情况下，由于左、右照相机位置只在 x 轴上有差异，因此空间中一点在左、右照相机成像平面上的像也只在
    x 轴（对应图像的水平轴）上有差异，这就是视差。在非平行双目视觉系统中，两台照相机的光轴不再平行，而是存在一定的会聚度（convergence），如图 19-3
    所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_293_1.png)


    图 19-3 平行双目视觉系统与非平行双目视觉系统


    在这种情况下，不能再沿着水平轴寻找左右两个成像平面上的对应点，而必须考虑更复杂的几何关系。我们将在本节中介绍如何通过对极几何来解决这个问题。


    # 19.2.1 数学定义


    如图 19-4 所示，我们考虑一个非平行双目视觉系统。该视觉系统中的两台照相机分别称为左照相机和右照相机，它们的光轴不平行，各自的成像平面分别称为左成像平面和右成'
