  md: '所示，我们可以将中间不同层级的特征图连接起来，连接后的特征图包含了局部的与全局的信息，也包含了浅层的与深层的信息。通过跳跃连接，构建既具有很强语义性，又包含精确物体位置信息的特征图，从而实现精准的语义分割。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_166_0.png)


    图 11-8 融合中间卷积层的特征，这些特征包含了局部的与全局的信息，也包含了浅层的与深层的信息


    具体而言，如图 11-9 所示，从 FCN 的主干网络可以得到空间分辨率分别是原图 1/2、1/4、1/8、1/16 和 1/32 的 5 个特征图。连接特征图的方式有多种，根据连接的特征图层级的不同，FCN
    有不同的变种，包括 FCN-8s、FCN-16s 和 FCN-32s。不同层级的特征图不但空间分辨率不一样，通道数也不一样，因此在对它们进行连接时，需要先将它们的通道数调整成一致。如何在不改变特征图的空间分辨率的情况下改变特征图的通道数？没错，我们刚刚介绍过的1×1
    卷积正好可以实现这个功能。我们用1×1 卷积将不同层级的特征图的通道数都调整为 |C|。对于主干网络池化层 5（pool5）输出的特征图，在通过1×1 卷积调整完通道数后，直接对其进行
    32 倍上采样，得到与原图相同空间分辨率的特征图，这样的模型被称为 FCN-32s；我们也可以将主干网络池化层 5 输出的特征图进行 2 倍上采样后，与主干网络池化层
    4（pool4）输出的特征图进行逐元素相加（element-wise sum），再将相加后的特征图进行 16 倍上采样，得到与原图相同空间分辨率的特征图，这样的模型被称为
    FCN-16s；同样，我们还可以将上述相加后的特征图先进行 2 倍上采样，然后与主干网络池化层 3（pool3）输出的特征图逐元素相加得到新的特征图，再将这个特征图进行
    8 倍上采样，得到与原图相同空间分辨率的特征图，这样的模型被称为 FCN-8s。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_166_1.png)


    图 11-9 FCN 中的跳跃连接（插图源自参考文献[4]）


    为了更好地说明这一过程，我们来看 FCN-8s 的代码实现。这里，我们选择 ResNet101 作为模型的主干网络。'
