- pgno: 284
  md: "越长，双目视觉系统能够测量的深度范围越大，深度测量的分度值越大；相反，基线越短，能够测量的深度范围越小，深度测量的分度值越小，但测量的精密程度提高。将各像素计算出来的视差绘制在像素坐标处，便得到了对应的视差图（disparity\
    \ map）。将各像素的视差通过前述公式转换成深度，便可得到深度图（depth map），深度图可以直观地反映出场景中物体的深度信息。\n\n# 18.2.3\
    \ 双目特征匹配\n\n尽管使用视差计算深度的公式本身很直接，但实际上获得视差的过程却相对复杂。这一过程要求我们能够精确地确定左图像中某像素在右图像中的对应像素，这一过程就是双目特征匹配。第\
    \ 4 章和第 7 章介绍了模板匹配和特征点匹配，这些技术都可以用于计算视差。不过在双目照相机系统中，情况更为特殊：由于两台照相机是水平对齐的，空间中任一点在这两个照相机成像平面上的投影将具有相同的垂直坐标。因此，在特征匹配过程中，我们只需沿水平方向进行搜索以找到对应的匹配点。\n\
    \n一个最直接的方法是选中左图像中的任意像素，然后在右图像中该像素所在的行上搜索其对应的像素。但是单个像素的匹配有极大的不确定性，例如，一个颜色单一的物体在一行上可能存在好几个完全一样的像素。为了减少这种不确定性，我们可以考虑不直接匹配像素，而是匹配像素块，也就是块匹配。在待匹配像素周围选取一个尺寸为\
    \ w×w 的小块，然后以对应行上的每个像素为中心选取很多同样尺寸的小块进行比较，就可以在一定程度上提高区分性。\n\n在图 18-3 (a) 的原图像 I1\
    \ 中选中模板窗口 T，在图 18-3 (b) 的待匹配图像 I2 对应高度的像素区域寻找其对应的窗口 T' 成为我们关心的问题。这正是在第 4 章中讨论过的模板匹配问题。\n\
    \n![](img/0e497601c0ca26be98c5399cbd72eb4c_284_0.png)\n\n为了表述清楚，不妨定义待匹配块为 \\(\
    \ A \\in \\mathbb{R}^{w \\times w} \\)，对应行上的待匹配的 \\( n \\) 个小块记为 \\( B_k \\)，其中\
    \ \\( k=1, 2, \\cdots, n \\)。可以通过以下几种匹配算法来衡量块之间的差异。\n\n+   (1) 绝对差和（sum of absolute\
    \ difference，SAD），顾名思义，即取两个小块的差的绝对值之和：\n+   \n+   \\( S(A, B)_{SAD} = \\sum_{i,j}\
    \ |A(i, j) - B(i, j)| \\)\n\n+   (2) 平方差和（sum of squared difference，SSD），计算两个小块的平方差之和：\n\
    +   \n+   \\( S(A, B)_{SSD} = \\sum_{i,j} (A(i, j) - B(i, j))^2 \\)"
  merge: -1
  img_proc: true
- pgno: 285
  md: '(3) 归一化互相关（normalized cross correlation，NCC），这种方式计算的是两个小块的相关性：


    ```

    S(A, B)_{NCC} = \frac{\sum_{i,j} A(i,j)B(i,j)}{\sqrt{\sum_{i,j} A(i,j)^2 \sum_{i,j}
    B(i,j)^2}}

    ```


    除了基础的匹配算法，还可以对每个像素块进行预处理，如去除每个小块的均值，实现去均值的 SSD、去均值的 NCC 等。去均值的优势在于，它能够消除图像块之间的亮度差异，从而提高匹配的准确性。具体来说，去均值处理可以使图像块的灰度值更加接近，即使图像块整体上存在亮度差异，也能保证匹配的准确性。每种方法都有其特点和局限性：SAD
    速度最快，但对局部亮度变化非常敏感；SSD 速度中等，对亮度偏移较为敏感；而 NCC 虽然速度最慢，但其优势在于不受对比度和亮度变化的影响。因此，在实际应用中，选择哪种匹配算法应根据具体需求和场景的特点决定。


    在块匹配算法中，选取的块的尺寸直接影响匹配的效率和结果的质量。如图 18-4 所示，不同的块尺寸会产生不同质量的视差图。总的来说，较小的块尺寸能够捕获更多的细节信息，但这同时也可能会导致较多的匹配误差和噪声。相反，较大的块尺寸可以产生更平滑的视差图，但这种方法可能会忽略掉一些重要的细节信息。为了平衡块尺寸对匹配效果的影响，一种有效的策略是采用多尺度窗口匹配方法。对于每个像素，我们不只使用单一尺寸的窗口进行匹配，而是尝试多个不同尺寸的窗口。然后，基于最佳相似性度量选择相应的视差作为最终结果。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_285_0.png)


    图 18-4 不同的块尺寸下的视差图


    # 18.2.4 全局优化


    在之前讨论的方法中，每个像素的深度是独立计算的，这可能导致相邻像素之间存在显著的深度差异。然而，在现实世界中，相邻像素的深度通常相似，深度的突变较少。基于这一先验知识，可以引入空间正则化项来改进深度估计，从而使预测的深度图更加平滑。因此，双目特征匹配问题可以转化为一个全局优化问题。


    我们先定义什么是优秀的双目特征匹配结果。优秀的双目特征匹配结果应具有以下特性。


    +   (1) 高匹配质量：确保每个像素在对应图像中都有一个高质量的匹配点。


    +   (2) 深度平滑性：要求相邻像素之间的视差变化保持一致。


    基于上述目标，我们可以构建一个匹配代价函数 E(d) = E_d(d) + \lambda E_s(d) 。其中， E_d(d) 是单个像素匹配的好坏，通常可用
    18.2.3 节中介绍的图像块之间的差异来度量； E_s(d) 代表平滑项，'
  merge: -1
  img_proc: true
- pgno: 286
  md: "用于衡量相邻像素的平滑程度。\\( E_a(d) \\) 主要由各类匹配算法得到，而 \\( E_s(d) \\) 则主要由邻近像素的视差差异来计算。不妨定义一个集合\
    \ \\( \\mathcal{E} \\)，其中的每个元素都是一组邻近像素组成的二元组：\\( (p, q) \\)。那么给定 \\( (p, q) \\\
    in \\mathcal{E} \\)，我们有\n\n\\[ E_s(d) = \\sum_{(p,q) \\in \\mathcal{E}} V(d_p,\
    \ d_q) \\]\n\n这里，\\( d_p \\) 和 \\( d_q \\) 分别代表像素 \\( p \\) 和像素 \\( q \\) 的视差，\\\
    ( V \\) 代表计算平滑项的度量函数，常用的函数包括 \\( L_1 \\) 距离函数和判别函数。\\( L_1 \\) 距离定义为\n\n\\[ V(d_p,\
    \ d_q) = |d_p - d_q| \\]\n\n判别函数定义为\n\n\\[ V(d_p, d_q) = \\begin{cases} 0, & \\\
