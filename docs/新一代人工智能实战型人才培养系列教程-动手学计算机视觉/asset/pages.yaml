    仔细观察可以发现，使用均值滤波器对图像去噪时，输出的图像中有很明显的“块状效应”，即图像中有很明显的成块状的区域。有没有什么好的办法能解决这一问题呢？这时候，高斯滤波器就派上用场了。


    # 3.4 高斯滤波


    高斯滤波器（Gaussian filter）广泛用于消除图像噪声。与均值滤波器不同的是，高斯滤波器对邻域内的每个像素进行加权平均而非直接平均，权重由高斯分布来确定。直观地看，高斯滤波器的形状如图
    3-2 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_47_1.png)


    图 3-2 高斯滤波器 （另见彩插图 1）


    高斯滤波器的高斯核同样是一个 k×k 的矩阵，记为 G，该矩阵每个位置(i,j)的值具体定义如下：


    $G(i, j) = \frac{1}{2\pi\sigma^2} e^{-\frac{i^2+j^2}{2\sigma^2}}$


    其中，G(i, j) 表示距离滤波器中心点位移为(i,j)处的高斯核的权重；σ是高斯核的标准差。标准差越大，高斯核开口越大，远处像素对中心像素的影响程度越大；标准差越小，高斯核开口越小，远处像素对中心像素的影响程度越小。用上述高斯核对输入图像
    I 进行高斯滤波得到输出图像 $\hat{I}$：


    $\hat{I}(i, j) = I(i, j) * G(i, j) = \sum_{m=i-k}^{i+k} \sum_{n=j-k}^{j+k} I(m,n)G(i-m,
    j-n)$


    根据高斯函数的性质，有 $\sum_i \sum_j G(i, j) \approx 1$。由此可见，对输入图像用高斯滤波器进行处理的输出是以高斯核为权重的输入图像像素的加权平均，同时离中心越近的像素权重越大。因此，相'
