    # 3.7 图像锐化


    既然可以通过滤波的方式让图像变得平滑，那么也可以让图像变得清晰，这一过程被称作图像锐化。如前所述，图像平滑是过滤掉图像中高频信息，保留低频信息，那么图像锐化是不是反其道而行之，去掉低频信息，保留高频信息就可以实现呢？试想一下，当一幅图像经过高斯滤波之后，它的高频信息被滤波器去除，只保留了低频信息。如果我们用原图像减去滤波后的图像，是不是就可以得到图像中更多的高频信息？那我们先这样尝试一下。


    ```

    # 由于卷积运算满足分配律，我们可以直接计算叠加后的卷积核

    size = 3

    k0 = np.zeros((size, size))

    k0[int((size-1)/2)][int((size-1)/2)] = 1


    kg = gauss(size, 1)

    k_shapen = 1 * (k0 - kg)


    # 得到高斯滤波的图像

    img_gau = cv2.GaussianBlur(img, (9,9), 5)

    shapen = conv_2d(img_gau, k_shapen)


    # 展示锐化效果

    shapen.plot_conv()

    ```


