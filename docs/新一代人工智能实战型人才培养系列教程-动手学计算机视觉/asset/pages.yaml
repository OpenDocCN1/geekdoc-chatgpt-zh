- pgno: 187
  md: '图像中锚框的总数为 \( H \times W \times k \) 个。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_187_0.png)


    # 图 12-10 RPN 的网络结构（插图源自参考文献[4]）


    Faster R-CNN 同样包括训练和测试两个阶段。在训练阶段，相比 Fast R-CNN 的训练阶段，Faster-CNN 增加了 RPN 的训练。类似于
    R-CNN 和 Fast R-CNN 的训练过程，为了训练 RPN，需要给每个锚框赋予一个真实类别标签，该真实类别标签是一个二类标签，表示该锚框中是否存在需要检测的目标。真实类别标签的赋予仍然基于
    IoU 的准则。满足以下两个条件之一，一个锚框就可以被赋予正的真实类别标签（该锚框为正锚框，其中存在需要检测的目标）：


    +   (1) 该锚框内部的像素集合与某个真实包围盒内部的像素集合之间的 IoU 是所有锚框中最大的；


    +   (2) 该锚框内部的像素集合与任意一个真实包围盒内部的像素集合之间的 IoU 大于 0.7。


    通常来说，根据条件 2 已经足够确定一个锚框的真实类别标签为正标签，但在有些极端情况下，对一个真实包围盒，可能无法找到任何一个锚框满足条件 2，这时就需要条件
    1 作为补充。如果一个锚框不满足上述任意一个条件，并且该锚框内部的像素集合与每个真实包围盒内部的像素集合之间的 IoU 都小于 0.3，那么这个锚框将被赋予负的真实类别标签（该锚框为负锚框，其中不存在需要检测的目标）。如果一个锚框既没有被赋予正标签，也没有被赋予负标签，那么这个锚框将不参与
    RPN 的训练过程。


    RPN 也为每个锚框指定了一个真实包围盒，用于后续包围盒回归任务。具体而言，首先计算每个真实包围盒内部的像素集合与所有锚框内部的像素集合的 IoU，找到最大
    IoU 对应的真实包围盒与锚框，并将它们匹配；接着，对剩下未匹配的锚框，先寻找与其内部的像素集合 IoU 最大的像素集合对应的真实包围盒，若该 IoU 大于设定的阈值（一般为
    0.5），则将该真实包围盒匹配给该锚框。反之，则不进行匹配。


    在上述定义的基础上，对一幅图像而言，RPN 的损失函数定义如下：


    ```

    \( L(q^i, u^i, t^i, v^i) = \frac{1}{N_{cls}} \sum_i L_{cls}(q^i, u^i) + \frac{\lambda}{N_{reg}}
    \sum_i u^i L_{reg}(t^i, v^i) \)

    ```'
