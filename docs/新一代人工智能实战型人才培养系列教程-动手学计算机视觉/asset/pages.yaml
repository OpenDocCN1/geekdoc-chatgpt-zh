  md: '![](img/0e497601c0ca26be98c5399cbd72eb4c_120_0.png)


    图 8-6 基于 SIFT 特征描述得到的两幅图像中的匹配特征点对（另见彩插图 6）


    先放下匹配这个问题，从一个更简单的例子入手。图 8-7（a）展示了一组数据点，我们希望用一条直线来拟合这些数据点。但这些数据点并不在一条直线上，因此我们并不知道应该用哪部分点去拟合直线。但是，从直觉出发，我们会认为图
    8-7（c）中的直线比图 8-7（b）中的直线拟合效果更好，因为有更多的数据点分布在直线的附近。深入思考，正常的数据点是大多数的具有相似分布规律的数据点，而异常数据点的分布则杂乱无章。我们通常将符合样本整体模型的点称为内群点（inlier），将偏离模型或与模型不一致的点称为离群点（outlier）。用任意两个数据点拟合一条直线，如果有越多的数据点与这条直线一致，即分布在其附近，则这条直线具有越多的内群点，这条直线也就越有可能是我们希望拟合的直线，而与这条直线不符的数据点则是异常样本。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_120_1.png)


    图 8-7 直线拟合


    随机抽样一致（random sample consensus，RANSAC）算法就是利用上述思想从一组观测数据中拟合数学模型的迭代方法。RANSAC 是一种鲁棒参数估计算法，其步骤如下：


    +   (1) 随机选择 s 个样本（其中，s 是可以用于拟合模型的最小样本量）；

    +   (2) 用这些样本拟合模型；

    +   (3) 统计与模型一致的内群点的个数；

    +   (4) 上述过程重复 N 次；

    +   (5) 选择具有最多内群点个数的模型作为最终拟合的结果。


    对于直线拟合这一问题，一个样本是指一个数据点，所以这里 s = 2，因为两个数据点确定一条直线。回到图像特征点对匹配问题这个问题，一个样本是指一对匹配的特征点对。同为正'
