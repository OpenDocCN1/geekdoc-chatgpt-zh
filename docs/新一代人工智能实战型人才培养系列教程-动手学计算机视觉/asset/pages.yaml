- pgno: 249
  md: '# ### 16.2.1 照相机模型


    在介绍照相机成像原理之前，我们有必要先了解一些相关术语。


    +   - 光心：透镜的中心，经过光心的光线将不发生任何偏移。

    +   - 光轴：一条垂直于透镜，穿过光心的直线。

    +   - 焦点：与光轴平行的光线经过透镜后会聚的点，一般位于光轴上。

    +   - 焦距：一般指光心到焦点的距离。


    接下来，我们使用初中物理课上的蜡烛投影实验来介绍透镜照相机模型。如图 16-1 所示，有一支点燃的蜡烛位于水平轴上的 A 点，在蜡烛的右侧有一面凸透镜，其光心为
    O 点，透镜的焦点位于 B 点。如果我们在凸透镜的右侧 C 点放置一个屏幕，那么蜡烛的光透过凸透镜后会在屏幕上形成一个倒立的蜡烛像。在这种情况下，定义光轴上的物距
    OA = n，焦距 OB = f，像距 OC = m 。


    那么根据凸透镜的折射原理，我们可以得到


    mn = mf + nf


    也就是：


    \(\frac{1}{f} = \frac{1}{m} + \frac{1}{n}\)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_249_0.png)


    图 16-1 蜡烛投影实验


    一般地，我们认为物距远大于像距，即 n >> m，所以 m ≈ f，即可以近似认为 B 点和 C 点的物理位置相同。在这种情况下，透镜照相机模型可以近似为针孔照相机模型，m
    也被称为针孔照相机模型的有效焦距。


    # ### 16.2.2 坐标系的定义


    在第 8 章中，我们已经介绍了齐次坐标系和空间变换的矩阵形式，在此基础上，我们对不同的坐标系进行定义。


    +   - 世界坐标系：三维坐标系，用于描述空间点在真实世界的绝对位置，任何空间点在世界坐标系中有唯一的坐标。由于照相机本身存在于三维空间，因此我们使用世界坐标系记录照相机的空间坐标。世界坐标系的单位一般是
    m。

    +   - 照相机坐标系：三维坐标系，为了方便描述在照相机视角下空间点的位置而定义的坐标系。照相机坐标系是以照相机的光心为原点的坐标系，可由世界坐标系通过平移和旋转得到。照相机坐标系的单位一般是
    m。

    +   - 图像坐标系：二维坐标系，以成像平面左上角为原点，一般用 (u,v) 表示坐标。图像坐标系的单位是像素。


    # ### 16.2.3 照相机外参


    如图 16-2 所示，空间中的一点 P 在经过照相机投影之后落在了成像平面上的一点 P''。令'
