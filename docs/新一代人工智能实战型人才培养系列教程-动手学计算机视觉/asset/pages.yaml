- pgno: 243
  md: '在此例中，我们使用一个 2×2×2 的全 1 卷积核，对一个元素递增的 4×4×4 张量进行三维卷积运算。卷积核在输入张量上滑动，对每个局部张量进行乘法和求和操作，得到一个
    3×3×3 的输出张量。


    三维卷积与二维卷积相比，其主要优势在于能够直接处理视频数据的时间维度信息。二维卷积只在空间上进行操作，因此在图像上卷积后还需要设计融合时间信息的方法。而三维卷积能够直接捕捉视频序列的时间连续性，从而更有效地识别并分析动态场景和行为。这使得三维卷积在动作识别和其他视频分析任务中具有显著优势。


    # 15.3.2 C3D 模型


    正因为三维卷积的优势，Du Tran 等人[1]于 2014 年提出直接使用三维卷积网络来提取视频数据中的时空特征，从而实现高精确度的视频动作识别。他们提出的
    C3D 模型是一个端到端的三维卷积网络，由 8 个卷积层、5 个池化层、2 个全连接层和 1 个 softmax 层组成，其网络架构如图 15-3 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_243_0.png)


    图 15-3 C3D 模型示意


    C3D 模型的输入是 16×112×112×3 的视频数据，其中 16 表示输入的视频序列长度，112 表示视频帧的宽度和高度，3 表示视频帧的通道数。根据对二维卷积神经网络的研究发现[7]，小的感受野（3×3
    卷积核）配合更深的网络架构可以获得最佳结果。因此，在 C3D 的架构搜索研究中，Du Tran 等人将空间感受野固定为 3×3，只改变三维卷积核的时间深度，并且通过实验发现，3×3×3
    的卷积核效果最好。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_243_1.png)


    图 15-4 t-SNE 可视化（插图源自参考文献[1]）（另见彩插图 16）


    Du Tran 等人通过在另一数据集上可视化学习到的特征来定性评估 C3D 的通用性，确认这些特征是否适合视频分析。具体来说，他们从 UCF101 数据集随机挑选了
    10 万个视频序列，使用 C3D 提取这些序列的特征，并使用 t-SNE[8] 将特征映射到二维空间。图 15-4 展示了结果，同一动作的序列显示相同颜色。结果表明，C3D
    提取的特征区分明显，表明其能够有效地提取视频数据中的时空特征。'
