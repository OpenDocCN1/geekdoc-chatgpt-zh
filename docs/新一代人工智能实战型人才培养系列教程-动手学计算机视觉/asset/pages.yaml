  md: '# 9.2.2 基于图切割的图像分割算法


    基于图切割的图像分割算法利用了图论领域的理论和方法。通常做法是将待分割的图像映射为带权无向图 G=(V, E)，其中，V={v1, v2, ..., vn}
    是顶点的集合，E 为边的集合。图中的顶点 vi ∈ V 对应图像中的像素，边 e ∈ E 连接着一对相邻的像素，边的权重 w(vi, vj) 表示相邻像素在灰度、颜色或纹理方面的非负相似度，其中，vi
    和 vj 之间的边 <vi, vj> ∈ E。因此，图像的分割问题转化为图切割问题，每个子图对应原图像中被分割的区域，如图 9-4 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_133_0.png)


    如何对图进行切割呢？与 k 均值算法的核心思想相同，我们希望切割后的子图内的顶点之间的相似度最大，而子图与子图之间的顶点对的相似度最小。我们以将一幅图像切割成两个子图为例（如图
    9-5 所示），把 G=(V, E) 的顶点分成两个子集 A、B，满足 A∪B=V，A∩B=Ø 。


    我们定义 cut(A,B)= Σu∈A,v∈B,vu>ve w(u,v) 。最小割（minimum cut，min-cut） [3] 算法通过最小化 cut(A,B)
    使两个子图之间的边的权重和最小。


    然而，利用 min-cut 切割图时，实际的切割情况往往如图 9-6 所示，结果并不理想。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_133_1.png)


    这种情况很容易解释，因为 min-cut 是通过最小化 cut(A,B) 实现的图切割，当其中一个子图只存在一个顶点时，cut(A,B) 很有可能是最小的。为了解决这种极端的切割情况，归一化割（normalized
    cut，Ncut） [4] 算法应运而生。


    归一化割算法通过最小化下式对顶点进行切割：


    Ncut(A,B)=\(\frac{cut(A,B)}{assoc(A,V)} + \frac{cut(A,B)}{assoc(B,V)}\)


    其中，assoc(A,V) 表示 A 中所有顶点与图中所有顶点相连的边的权重和，即'
