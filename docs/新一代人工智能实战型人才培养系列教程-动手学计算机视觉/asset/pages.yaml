  img_proc: true
- pgno: 273
  md: "虽然在许多情况下这些假设是有效的，但它们也带来了一些限制，尤其是在处理快速运动的物体或亮度变化显著的场景时。为了提高算法的泛用性和鲁棒性，研究人员和工程人员后续又做了诸多工作[4]。这里我们简单介绍一些实用的改进方法。\n\
    \n(1) 迭代法通过逐步估计光流然后更新光流的形式来计算光流。如图 17-6 所示，迭代法初始阶段从位移估计开始，通过使用 Lucas-Kanade 光流法得到一个初步估计的速度向量\
    \ \\(\\hat{d}\\)，并更新向量 \\(d_1 = d_n + \\hat{d}\\)。接着，将第一帧图像根据当前的位移结果进行扭曲，使其更接近第二帧图像的亮度分布。通过不断迭代这个过程，计算新的估计值并累加每次迭代得到的速度向量，最终得到精确的光流估计，使得扭曲后的第一帧亮度与第二帧亮度几乎一致。\n\
    \n![](img/0e497601c0ca26be98c5399cbd72eb4c_273_0.png)\n\n(2) 多尺度图像法（图像金字塔法）：针对两帧之间物体运动位移较大的情况，通过构建图像金字塔降低图像的尺寸，从而减小像素位移（如图\
    \ 17-7 所示），使微小移动假设再次成立。例如，原图像尺寸为 400 像素×400 像素，此时像素在图像平面上的移动距离为 16 像素；当图像缩小为 200\
    \ 像素×200 像素时，移动距离就变成了 8 像素；进一步缩小为 100 像素×100 像素时，移动距离变为 4 像素。\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_273_1.png)\n\
    \n# 17.4 代码实现\n\n接下来，让我们动手实现 Lucas-Kanade 光流法。首先，我们创建一幅噪声图像并将其顺时针旋转 1°。\n\n```\n\
    import cv2\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport random\n\
    import math\n\n# 根据角度旋转图像\ndef rotate_image(img, angle):\n    # 计算旋转中心\n```"
