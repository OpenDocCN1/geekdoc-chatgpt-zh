- pgno: 83
  md: '# # 第 6 章


    # # 角点检测


    # ## 6.1 简介


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_83_0.png)


    第 4 章提到，模板匹配是最基础、最简单的图像匹配，即模板与待匹配子图必须具有极高的相似度。那么，一般情况下，图像匹配如何实现？例如图 6-1 (a) 所示的在不同视角下拍摄的建筑物，如何找到两幅图像间的匹配关系？这需要检测图像中的特征进行匹配。说到特征，可能最先想到的就是如图
    6-1 (b) 所示的那些特殊位置，如建筑物的顶点。这些局部特征通常被称为关键点特征（keypoint feature）或者兴趣点特征（interesting
    point feature）。作为关键点特征，通常需要满足 4 个性质：（1）重复性（repeatability），同样的关键点特征应在不同几何变换和光度变换下的图像中都能被检测到；（2）显著性（saliency），每个关键点特征都具有与其他关键点特征不同的区分性描述，通常为其所在位置周围的图像块的表征；（3）紧性（compactness），关键点特征个数要比图像像素数少得多；（4）鲁棒性（robustness），关键点特征对图像杂乱背景和遮挡具有一定的不敏感性。图
    6-1 (b) 所示的关键点特征就具备上述性质，而且它们都处在两条线（边缘）的交叉点处，所以它们有个形象的名字——角点（corner）。通过匹配两幅图像中对应的角点
    [图 6-1 (c) ]，基于匹配关系计算出两幅图像的变换矩阵，就可以将两幅图像拼接成一幅大图了 [图 6-1 (d) ]。在本章中将介绍一个经典的图像角点检测算法——Harris
    角点检测算法。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_83_1.png)


    图 6-1 基于角点的图像匹配'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 6.2 Harris 角点检测算法


    如何检测角点呢？我们先分析一下角点的特点。图 6-2 展示了一个最基本的角点示例。从这个示例中能发现什么规律呢？如果在图像中某一位置 p 放置一个小窗口，然后对其做局部范围内微小的移动，并考察移动前后窗口内像素值的变化量，可以发现：当
    p 处于平坦区域时，不论将窗口向哪个方向移动，移动前后窗口内像素值变化量都很小；当 p 处于边缘附近时，如果将窗口沿着边缘方向移动，移动前后窗口内像素值变化量也很小，但如果将其向其他方向移动，则会出现较大的像素值变化量；当
    p 处于角点附近时，不论将窗口向哪个方向移动，都会出现较大的像素值变化量。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_84_0.png)


    图 6-2 平坦区域、边缘，以及角点的对比


    根据上述讨论，可以按照以下思路来检测角点：使用一个固定大小的窗口在图像中某一位置进行任意方向上微小的移动，并比较移动前后该窗口内像素值变化量。如果任意方向上的微小位移都能引起窗口内较大的像素值变化，那么我们就认为该窗口中存在角点。Harris
    角点检测算法便是基于上述原理的一个代表性的算法。


    Harris 算法主要包含以下两步：


    +   (1) 对图像每个位置，计算窗口移动前后其内部的像素值变化量；

    +   (2) 计算像素值变化量对应的角点响应函数，并对该函数进行阈值处理，提取角点。


    # 6.2.1 计算像素值变化量


    在图像 I 中某一位置放置一个窗口 W，将其移动一个微小位移(u,v)，如图 6-3 所示，定义窗口移动前后的像素值变化量 E(u,v)如下：


    ```

    E(u,v) = \sum_{(i,j)\in W} (I(i+u, j+v) - I(i, j))^2

    ```


    其中，(i,j)是窗口内的一个位置；I(i,j) 是当前像素值；I(i+u, j+v) 是位移后的像素值。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_84_1.png)


    图 6-3 在某一位置窗口的移动


    我们知道，当窗口位于平坦区域时，无论位置(u,v)指向什么方向，E(u,v)的值都会比较小，因为在平坦区域上 I(i+u, j+v) 和 I(i, j) 基本相等；当窗口位于边缘时，如果位移(u,v)的方向是边缘沿线的方向，计算得到
    E(u,v) 会比较大，而如果位移(u,v)的方向是沿着边缘方向，则 E(u,v) 会比较小；只有当窗口处于角点时，'
  merge: -1
  img_proc: true
- pgno: 85
  md: '无论位移(u,v)指向什么方向，其对应的 E(u,v)都会非常大。因此，我们的目的是寻找这样的窗口，能够满足对于任意的(u,v)，E(u,v)的值都很大。不过，很难遍历所有的(u,v)以求得对应的
    E(u,v)。因此，需要使用数学工具对上式求解。


    使用上述公式的一阶泰勒展开以获取其近似形式。对一幅二维图像，其一阶泰勒展开可写作


    I(i+u, j+v) ≈ I(i, j) + uI_x + vI_y


    其中，I_x 是图像沿 x 轴的梯度幅值；I_y 是图像沿 y 轴的梯度幅值。即


    I_x = \frac{\partial I(i,j)}{\partial x}, I_y = \frac{\partial I(i,j)}{\partial
    y}


    因此，可以将 E(u,v)写成


    E(u,v) = \sum_{(i,j)\in W} (I(i,j) + uI_x + vI_y - I(i,j))^2

    = \sum_{(i,j)\in W} (uI_x + vI_y)^2

    = \sum_{(i,j)\in W} (u^2 I_x^2 + v^2 I_y^2 + 2uv I_x I_y)


    将(u,v)提取出，便得到最终的形式：


    E(u,v) = [u \ v] M \begin{bmatrix} u \\ v \end{bmatrix}


    其中，矩阵 M 为


    M = \sum_{(i,j)\in W} \begin{bmatrix} I_x^2 & I_x I_y \\ I_x I_y & I_y^2 \end{bmatrix}


    不难发现，M = \sum_{(i,j)\in W} H，其中 H 是图像 I 的黑塞矩阵（Hessian matrix）。因为 M 是一个实对称矩阵，一定能实现对角化，所以将其进一步处理为


    M = R \begin{bmatrix} \lambda_1 & 0 \\ 0 & \lambda_2 \end{bmatrix} R^T


    其中，\lambda_1, \lambda_2 是矩阵 M 的特征值；R 是二维旋转矩阵。将上式代入 E(u,v) 的计算，得到


    E(u,v) = [u \ v] R \begin{bmatrix} \lambda_1 & 0 \\ 0 & \lambda_2 \end{bmatrix}
    R^T \begin{bmatrix} u \\ v \end{bmatrix}


    令 [m \ n] = [u \ v]R，可得


    E(u,v) = [m \ n] \begin{bmatrix} \lambda_1 & 0 \\ 0 & \lambda_2 \end{bmatrix}
    [m \ n]^T = m^2 \lambda_1 + n^2 \lambda_2


    由此可见，像素值变化量 E(u,v) 的大小与矩阵 M 的两个特征值 \lambda_1 和 \lambda_2 直接相关。E(u,v) 可以表示成由特征值
    \lambda_1, \lambda_2 确定长、短半轴，由特征向量确定方向的椭圆，如图 6-4 所示。'
