    通过以上代码可以加深对 FCN 的理解。通过上采样得到的特征图具有和原图相同的空间分辨率，基于该特征图可以进行逐像素的类别预测，这样可以逐像素计算预测标签和真实标签之间的交叉熵损失函数以训练
    FCN：


    \(\ell(\mathcal{D}) = -\frac{1}{N} \sum_{n=1}^{N} \sum_{i} \log(P(y_i^{(n)} |
    I^{(n)}))\)


    其中，\(P(y_i^{(n)} | I^{(n)})\) 表示训练数据集 \(\mathcal{D}\) 中第 \(n\) 幅图像熵的第 \(i\) 个像素对应的标签被
    FCN 预测为 \(y_i^{(n)} \in \mathcal{C}\) 的概率。


    现在总结一下用 FCN 进行语义分割的流程：首先利用主干网络对图像进行特征提取，主干网络的不同层级可以输出空间分辨率不同的特征图；然后用 1x1 的卷积层将不同层级的特征图的通道数调整为
    \(|\mathcal{C}|\)；接着用跳跃连接融合不同层级的特征图，并通过上采样将特征图的空间分辨率增大到与原图一致；最后基于上采样后的特征图进行逐像素的类别预测。FCN
    进行语义分割的整体流程框架如图 11-10 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_168_0.png)


    图 11-10 FCN 进行语义分割的整体流程框架（插图源自参考文献[4]）'
