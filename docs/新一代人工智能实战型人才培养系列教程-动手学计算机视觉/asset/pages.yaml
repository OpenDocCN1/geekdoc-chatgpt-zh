    # 3.5 双边滤波


    高斯滤波器虽然能得到很好的去噪效果，但是由 3.4 节的结果可知，图像的内容也被模糊了，如人脸的五官变得模糊了，眼球和眼白之间也出现了灰色的部分。这是高斯滤波器在滤波的过程中将白色区域与黑色区域进行加权叠加导致的。那么，有没有什么办法能解决这个问题？这时候，就需要引入一个新的滤波器——双边滤波器，其能够在有效地处理高斯噪声的同时，保持图像内容的清晰。


    设对一幅图像 I 进行双边滤波后的输出图像为 \(\hat{I}\)，则它们之间的关系由下式计算：


    ```

    \(\hat{I}(i, f) = \frac{1}{W_{sb}} \sum_{m=i-k}^{i+k} \sum_{n=j-k}^{j+k} I(m,n)G_s(i-m,
    j-n)G_b(I(m,n)-I(i,j))\)

    ```


    其中，'
