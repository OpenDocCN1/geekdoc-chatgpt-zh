- pgno: 271
  md: '图像中对应的像素的亮度不随时间变化。这意味着具有这种对应关系的像素的亮度值在连续帧中不会发生变化。


    # (2) 微小移动：假设在短时间内，三维点的移动是微小的。


    根据亮度恒定假设，即一个三维点在二维图像中对应的像素在时间 \( t-1 \) 和时间 \( t \) 的亮度值保持不变，可以得到


    ```

    \( I(x, y, t-1) = I(x+\delta x, y+\delta y, t) \)

    ```


    其中，\( (x, y) \) 和 \( (x+\delta x, y+\delta y) \) 分别为同一个三维点在 \( t-1 \) 时刻和 \( t
    \) 时刻在成像平面上投影点的坐标。又根据微小移动假设可得 \( \delta x \) 和 \( \delta y \) 都很小。故而可对上式右边进行泰勒级数展开：


    ```

    \( I(x+\delta x, y+\delta y, t) \approx I(x, y, t) + \frac{\partial I}{\partial
    x}\delta x + \frac{\partial I}{\partial y}\delta y \)

    ```


    进而可得


    ```

    \( I(x, y, t) + \frac{\partial I}{\partial x}\delta x + \frac{\partial I}{\partial
    y}\delta y - I(x, y, t-1) = 0 \)

    ```


    又根据时间上的一阶泰勒展开，可得


    ```

    \( I(x, y, t) - I(x, y, t-1) \approx \frac{\partial I}{\partial t}(\delta t =
    1) \)

    ```


    这里，\( \delta t = 1 \) 是因为连续两帧图像帧差为 1，进而得到


    ```

    \( I_x \cdot u + I_y \cdot v + I_t = 0 \)

    ```


    其中，\( I_x \)、\( I_y \) 和 \( I_t \) 分别表示图像在 \( x \)、\( y \) 和 \( t \) 方向上的梯度，即
    \( I_x = \frac{\partial I}{\partial x} \)，\( I_y = \frac{\partial I}{\partial
    y} \)，\( I_t = \frac{\partial I}{\partial t} \)；\( u \) 和 \( v \) 分别表示像素在 \( x
    \) 轴和 \( y \) 轴方向上的运动速度，即 \( u = \frac{\delta x}{\delta t} \)，\( v = \frac{\delta
    y}{\delta t} \)。上式可以改写为


    ```

    \( \nabla I \cdot (u, v) + I_t = 0 \)

    ```


    上式中的 \( (u, v) \) 就是我们需要求解的光流向量。写成矩阵形式为


    ```

    \( \begin{bmatrix} I_x & I_y \end{bmatrix} \begin{bmatrix} u \\ v \end{bmatrix}
    = -I_t \)

    ```


    这个方程表达了图像亮度的空间梯度和时间梯度之间的关系，可用于估计像素亮度随时间的运动，即光流，因此也被称为光流方程。然而，这个方程中存在两个未知数 \( u
    \) 和 \( v \)，仅由这个方程无法得到未知数的确定解，需要通过额外的约束或优化方法来求解。


    # 17.3.3 Lucas-Kanade 光流法


    为了解决上述方程中的欠定问题，Lucas-Kanade 光流法[3]引入了空间一致性假设，即假定场景中相同表面的相邻点具有相似的运动，这些点投影到成像平面上时也保持邻近，并且它们'
  merge: -1
  img_proc: true
- pgno: 272
  md: "的运动速度也相似。这意味着，如果我们考虑一个特征点及其邻域内的点，我们可以假设这些点在 x 轴和 y 轴方向上的速度（ u 和 v ）是相同的。\n\n\
    以图 17-5 为例，在一个邻域内，如方框标注的区域内，所有光流向量可以认为是一致的。因此，通过在这样的特征区域内应用光流方程，我们可以联立多个方程来求解该区域内的统一速度\
    \ u 和 v。\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_272_0.png)\n\n具体而言，假定使用一个\
    \ 5×5 的窗口作为空间一致性假设区域，那么在这个窗口中的每个像素都可以计算一次光流方程，总共能够得到 25 个方程，即\n\n```\n\\(\\begin{bmatrix}\
    \ I_x(p_1) & I_y(p_1) \\\\ I_x(p_2) & I_y(p_2) \\\\ \\vdots & \\vdots \\\\ I_x(p_{25})\
    \ & I_y(p_{25}) \\end{bmatrix} \\begin{bmatrix} u \\\\ v \\end{bmatrix} = - \\\
    begin{bmatrix} I_t(p_1) \\\\ I_t(p_2) \\\\ \\vdots \\\\ I_t(p_{25}) \\end{bmatrix}\\\
    )\n```\n\n为了描述方便，简写为\n\n```\n\\( A d = -b \\rightarrow \\min \\| A d + b \\|^2\
    \ \\)\n```\n\n显然，这又是一个关于 u, v 的超定线性方程，传统上是使用最小二乘法求解：\n\n```\n\\(\\begin{bmatrix}\
    \ \\sum I_x I_x & \\sum I_x I_y \\\\ \\sum I_x I_y & \\sum I_y I_y \\end{bmatrix}\
    \ \\begin{bmatrix} u \\\\ v \\end{bmatrix} = - \\begin{bmatrix} \\sum I_x I_t\
    \ \\\\ \\sum I_y I_t \\end{bmatrix}\\)\n```\n\n也就是\n\n```\n\\( A A^T \\begin{bmatrix}\
    \ u \\\\ v \\end{bmatrix} = -A^T b \\)\n```\n\n那么可以求解得\n\n```\n\\(\\begin{bmatrix}\
    \ u \\\\ v \\end{bmatrix} = -(A^T A)^{-1} A^T b \\)\n```\n\n我们在第 6 章中介绍了 Harris\
    \ 角点检测算法，对比一下，可以发现上式的形式非常像 Harris 算法，因此不难得出上式有解的条件：\n\n+   (1) \\( A^T A \\) 可逆；\n\
    +   \n+   (2) \\( A^T A \\) 的特征值 \\( \\lambda_1, \\lambda_2 \\) 不能太小；\n+   \n\
    +   (3) \\( A^T A \\) 是良态（well conditioned）矩阵，对数据的微小扰动敏感，即 \\( \\lambda_1 \\)\
    \ 和 \\( \\lambda_2 \\) 应该尽量接近。\n\n符合这些条件的区域一般是角点区域，因此 Lucas-Kanade 光流法在角点处效果最好。\n\
    \n# 17.3.4 Lucas-Kanade 光流法的改进\n\nLucas-Kanade 光流法的约束条件就是它的三大假设：亮度恒定、微小移动和空间一致性。"
