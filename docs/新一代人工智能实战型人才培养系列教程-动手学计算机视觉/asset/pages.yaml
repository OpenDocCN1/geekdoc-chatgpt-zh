  md: '# 7.2.3 特征点方向计算


    为了能够匹配不同旋转角度下的相似目标，特征点应具有旋转不变性，所以需要确定特征点的主方向。如何确定特征点的主方向呢？在第 5 章中，我们介绍过图像梯度可以描述图像局部结构的方向，可以基于这个思想去计算特征点的主方向。根据
    7.2.1 节，可以得到每个特征点的位置及特征尺度，根据 Lowe 的建议，以特征点的位置为中心，4.5 倍的特征尺度（1.5 倍大小的 3σ原则）为半径的圆的外接正方形区域即为该特征点对应的块状区域。完成特征点梯度计算后，使用直方图统计特征点邻域内像素的梯度幅值和方向。直方图以每
    10°为一柱，将 360°分为 36 柱，柱代表的方向为特征点的梯度方向，柱的高度代表了梯度幅值。在块状区域内，将梯度方向在某一个柱内的像素挑出来，并将它们的幅值相加作为柱的高度。因为在正方形区域内像素的梯度幅值对特征点的贡献是不同的，还可以对幅值进行加权处理后再相加，这里采用高斯加权。若当前像素与特征点的偏移为(i,j)，则对应的高斯权重
    w 为


    w = e^{\left(-\frac{i^2+j^2}{2(1.5\sigma)^2}\right)}


    在统计完成各个方向的加权梯度幅值，得到直方图 H 之后，为了防止某个梯度方向角度因受到噪声的干扰而改变，还需要对梯度方向直方图进行平滑处理，平滑公式为


    H(i) = \frac{6}{16}H(i) + \frac{4}{16}(H(i-1)+H(i+1)) + \frac{1}{16}(H(i-2)+H(i+2))


    由于角度是循环的（0°=360°），若上述公式中索引越界，则可以通过圆周循环的方法找到其所对应的[0°,360°)之间的位置，如 H(38) = H(2)。平滑处理后，以直方图中最大值的方向作为该特征点的主方向。如图
    7-12 所示，直方图中的→代表了特征点的主方向（此图中的直方图只将方向分为 8 柱，每 45°为一柱）。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_99_0.png)


    图 7-12 使用直方图统计选取特征点方向


    除了给每个特征点确定一个主方向外，还可能给其选择一个或多个辅方向。增加辅方向是为了增强图像匹配的鲁棒性。辅方向的定义是，当存在另一个柱高度大于主方向柱高度的
    80% 的柱时，该柱所代表的方向就是该特征点的辅方向。


    至此，检测出的图像 SIFT 特征点含有位置、尺度和方向这 3 种信息。'
