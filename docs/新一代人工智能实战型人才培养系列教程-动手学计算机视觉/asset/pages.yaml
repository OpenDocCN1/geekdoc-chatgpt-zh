  md: "是否翻转！而在深度学习的主流工具开发包（如 PyTorch 和 Caffe）中，都是假设卷积神经网络的卷积核是已经翻转过的。换言之，平时用的卷积神经网络的代码其实计算的是互相关。这也难怪不少人工智能的学者认为卷积神经网络其实和模板匹配相似，如著名物理学家史蒂芬·霍金（Stephen\
    \ Hawking）的学生艾伦·尤伊尔（Alan Yuille）教授曾不止一次提到卷积神经网络和模板匹配的关系。\n\n下面，我们编程实现上述互相关公式，并测试是否可以达到想要的模板匹配效果。\n\
    \n```\n# utils 为之前已经编写的函数包\nfrom utils import *\n\nimport cv2\nfrom matplotlib\
    \ import pyplot as plt\nimport numpy as np\n\n# 计算互相关\ndef CCORR(img, temp):\n\
    \    w, h = temp.shape[::-1]\n    W, H = img.shape[::-1]\n    img = np.array(img,\
    \ dtype='float')\n    temp = np.array(temp, dtype='float')\n    res = np.zeros((W\
    \ - w + 1, H - h + 1))\n\n    # 利用循环计算互相关\n    for i in range(W - w + 1):\n  \
    \      for j in range(H - h + 1):\n            res[i, j] = np.sum(temp * img[j:j\
    \ + h, i:i + w])\n    return res\n\n# 构建单目标匹配类\nclass temp_match_single():\n \
    \   def __init__(self, img, temp):\n        self.img = img\n        self.temp\
    \ = temp\n\n    def match(self):\n        # 输入目标图像\n        img = cv2.cvtColor(self.img,\
    \ cv2.COLOR_BGR2GRAY)\n        # 输入模板图像\n        temp = cv2.cvtColor(self.temp,\
    \ cv2.COLOR_BGR2GRAY)\n        w, h = temp.shape[::-1]\n\n        # 计算互相关\n  \
    \      res = CCORR(img, temp)\n\n        # 找到互相关值最大的位置\n        loc = np.where(res\
    \ == np.max(res))\n        top_left = [int(loc[0]), int(loc[1])]\n        bottom_right\
    \ = (top_left[0] + w, top_left[1] + h)\n```"
