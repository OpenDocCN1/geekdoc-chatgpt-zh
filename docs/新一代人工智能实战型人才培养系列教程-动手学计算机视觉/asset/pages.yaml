    # 12.3 目标检测模型


    虽然在 2012 年 Geoffrey Hinton 和他的学生提出了 AlexNet（见第 11 章），证明了深度卷积神经网络在图像分类上的突出性能，开启了计算机视觉的深度学习时代，但是在接下来的一两年里，研究人员并没有找到能够有效解决目标检测这一视觉识别任务的深度学习模型。这是因为，目标检测过程通常基于滑动窗口（sliding
    window）的策略，即用窗口（这种窗口就是一种预测包围盒）在图像上滑动，滑动到一个位置，就通过一个分类器去判断该位置窗口内是否存在目标。由于目标大小是未知的，这种滑动窗口策略需要在图像上每个位置尝试多种尺寸的窗口，每幅图总共需要尝试的窗口数可能高达数十万甚至数百万。如果用卷积神经网络作为窗口分类器，那么一幅图像的处理时长可能都需要数小时。这种处理速度是无法接受的。


    是否有办法提升这种基于滑动窗口的目标检测速度呢？2014 年，Ross Girshick 等人给出了解决方案——区域卷积神经网络（region convolutional
    neural network，R-CNN）[1]。他们提出，不必遍历所有位置所有尺寸的窗口，只需要找到可能存在目标的候选窗口，然后用卷积神经网络对这些候选窗口做分类就可以了。那么，如何找到可能存在目标的候选窗口呢？在
    2010 年左右，候选目标检测（object proposal detection）[2] 的问题被提出，即不关心目标的类别是什么，只从图像中快速找到可能存在目标的区域即可，这些区域称为候选区域（region
    proposal）。候选区域所属的包围盒即是候选窗口（通常候选区域是矩形区域，这种情况下候选区域就是候选'
  merge: -1
  img_proc: true
- pgno: 180
  md: '窗口，本章默认这两者等价）。候选区域可能存在于目标的置信度称为 objectness。基于候选目标检测可以找到可能存在目标的候选窗口，而这些候选窗口的数量远远小于所有滑动窗口的数量。这便是
    R-CNN 改善检测速度的基本思想。2014 年，R-CNN 在 PASCAL VOC 检测数据集上以绝对优势获得第一名，为目标检测开启了一个新的里程碑。随后
    Girshick 等人又对 R-CNN 做了进一步改进和优化，提出了 Fast R-CNN[3] 和 Faster R-CNN[4]，不但进一步提升了检测速度，也提升了检测精度。


    # 12.3.1 R-CNN


    R-CNN 是基于深度学习进行目标检测的开山之作，其流程如图 12-4 所示。可大致分为以下几个步骤：


    +   (1) 从输入图像中提取 1000~2000 个候选区域；


    +   (2) 利用深度卷积神经网络（CNN）提取每个候选区域的特征；


    +   (3) 基于提取的深度卷积特征，利用 SVM 分类器对每个候选区域进行目标类别识别；


    +   (4) 基于提取的深度卷积特征，利用包围盒回归器修正候选区域的位置与尺寸。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_180_0.png)


    图 12-4 R-CNN 流程（插图素材源自参考文献[1]）


    R-CNN 是基于深度学习的方法，所以包括训练和测试两个阶段。R-CNN 的这两个阶段大体上遵循上述的步骤，但也略有不同。接下来，我们分别详细介绍 R-CNN
    的训练阶段和测试阶段。


    在训练阶段，首先利用候选目标检测方法，如 Selective Search[5]，在每幅训练图像上提取 1000~2000 个候选区域；接着，把所有候选区域归一化成相同的空间分辨率，如
    227 像素×227 像素，然后训练一个 CNN 用于提取这些候选区域的特征；此阶段中用到的 Selective Search 是一种经典的候选目标检测方法。它通过第
    9 章中介绍的图像分割方法得到图像中的一些分割区域，然后基于区域特征，如颜色、亮度和纹理等，分层次合并区域，从图像中提取出可能包含目标的候选区域。


    用于提取候选区域特征的 CNN 一般是常用的主干网络，如 AlexNet、VGG、ResNet 等。这些主干网络已在 ImageNet 数据集完成预训练，在
    R-CNN 的训练阶段需要对其进行再训练。训练时，需要先对每个候选区域赋予其类别标签 u ∈ C 。令第 n 幅训练图像 I^(n) 中的一个候选区域内的像素集合为
    R，首先找到与该候选区域重合度最高的真实包围盒：m* = arg max_m IoU(R, B^(n,m))，其中 B^(n,m) 表示真实包围盒 b^(n,m)
    内的像素集合，该候选区域的类别标签 u 通过如下准则确定：'
