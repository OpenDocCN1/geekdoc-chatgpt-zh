    \ 1]\n        ])\n    # 对点集进行归一化\n    return homoco_pts_2_euco_pts(np.matmul(T,\n\
    \        euco_pts_2_homoco_pts(pts).T).T), T\n```\n\n到这里我们就已经得到了两幅图之间的对应像素关系，接下来使用八点法求解基础矩阵。\n\
