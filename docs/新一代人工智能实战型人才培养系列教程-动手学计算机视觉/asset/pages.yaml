  md: '\( u = \begin{cases} c^{(n,m)}, & \text{IoU}(\mathcal{R}, \mathcal{B}^{(n,m)})
    > 0.5 \\ 0, & \text{其他} \end{cases} \)


    \( u=0 \) 说明该候选区域对应的是背景，因为没有任何一个真实包围盒和它的重合度足够大。对每个候选区域赋予类别标签后，便可以基于该赋予的类别标签以图像分类为目标训练主干网络（训练方法参见
    10.4 节中介绍的图像分类算法）。训练结束后，利用训练好的主干网络提取每个候选区域的特征。最后，基于主干网络提取的特征对每个类别训练一个 SVM 分类器，用于每个候选区域的类别标签预测。


    除此之外，R-CNN 中还引入了包围盒回归器，对候选区域的位置和尺寸进行调整。对位置及尺寸进行调整的原因是候选区域的初始位置往往与真实包围盒存在偏差。图 12-5
    展示了一个直观的例子：实线框表示目标玩具的真实包围盒，虚线框为预测的包围盒，需要对虚线框进行调整，才能使其最终的位置及尺寸与实线框更接近。具体而言，对上述候选区域，令其包围盒的坐标为
    \(\boldsymbol{r} = (r_x, r_y, r_h, r_w)\)，其中，\((r_x, r_y)\) 表示该预测包围盒中心点的坐标，\(r_h\)
    和 \(r_w\) 分别表示该候选区域的高和宽，与其重合度最高的真实包围盒为 \(\boldsymbol{b} = (b_x^{(n,m)}, b_y^{(n,m)},
    b_h^{(n,m)}, b_w^{(n,m)})\)（为了符号的简洁性，在后续的表述中我们省略上标 \((n, m^*)\)）。该候选区域所属的包围盒 \(\boldsymbol{r}\)
    相对于真实包围盒 \(\boldsymbol{b}\) 需要回归的包围盒的坐标偏移量 \(\boldsymbol{v} = (v_x, v_y, v_h,
    v_w)\) 定义为


    \( v_x = \frac{b_x - r_x}{r_w} \)


    \( v_y = \frac{b_y - r_y}{r_h} \)


    \( v_h = \log \frac{b_h}{r_h} \)


    \( v_w = \log \frac{b_w}{r_w} \)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_181_0.png)


    # 图 12-5 预测包围盒（虚线框）和真实包围盒（实线框）


    由定义可知，该包围盒的坐标偏移量包括候选区域中心点与真实包围盒中心点的相对坐标差 \(v_x\) 和 \(v_y\) 以及高和宽的缩放比例对数 \(v_h\)
    和 \(v_w\)。该回归任务可以通过一个线性回归器实现。令利用训练好的主干网络提取得到的该候选区域特征为 \(\boldsymbol{\Phi}(\boldsymbol{r})\)，则可以用
    \(\boldsymbol{w}^{\top} \boldsymbol{\Phi}(\boldsymbol{r})\) 拟合该候选区域所属的包围盒相对于真实包围盒的坐标偏移量
    \(\boldsymbol{v}\)，其中 \(\boldsymbol{w}\) 是可学习的参数。该包围盒回归任务的损失函数定义为


    \( L = \| \boldsymbol{w}^{\top} \boldsymbol{\Phi}(\boldsymbol{r}) - \boldsymbol{v}
    \|^2 + \| \boldsymbol{w} \|^2 \)


    R-CNN 测试阶段的步骤和训练阶段类似。给定一幅测试图像，同样也是用候选目标检测方法提取 1000～2000 个候选区域，然后将它们的空间分辨率归一化到
    227 像素 \(\times\) 227 像素。接着用训练好的主干网络提取这些候选区域的特征。基于提取的候选区域特征，用训练好的 SVM 分类器和包围盒回归器分别预测每个候选区域的目标类别和微调其位置及尺寸。因为通常检测得到的预测包围盒的数量非常多，其中存在很多误检，所以测试阶段比训练阶段多一个关键步骤——非极大值抑制（NMS），用以去除冗余的预测包围盒：对于每个类别，先挑选出置信度'
