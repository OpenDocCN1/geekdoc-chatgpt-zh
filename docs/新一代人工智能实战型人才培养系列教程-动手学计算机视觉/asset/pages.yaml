  md: '# 13.2 数据集和度量


    由于实例分割与目标检测之间有着紧密的联系，用于这两种任务的数据集和度量也很类似。MS COCO 是最常用的实例分割数据集，mAP 是实例分割的评价指标。与目标检测不同的是，这里的
    mAP 是通过 Mask IoU 进行度量。同目标检测中的 Box IoU 类似，对于图像中的一个目标，令其真实的掩模内部的像素集合为 A，一个预测的掩模内部的像素集合为
    B，Mask IoU 通过这两个掩模内像素集合的 IoU 来度量两个掩模的重合度： IoU(A,B) = (A ∩ B) / (A ∪ B)，即图 13-2
    中黄色部分的面积除以红色的面积。与目标检测中计算 mAP 的过程一样，对每种类别，通过调节 Mask IoU 的阈值，可以得到该类别实例分割结果的 PR 曲线，PR
    曲线下方的面积即为该类别实例分割结果的 AP，所有类别实例分割结果的 AP 的平均即为 mAP。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_216_0.png)


    # 13.3 Mask R-CNN


    既然实例分割结合了目标检测和语义分割，那么实现实例分割的一个很直接的思路就是先进行目标检测，然后在每个预测包围盒里做语义分割。著名的 Mask R-CNN[1]模型采用的就是这一思路，从模型的命名可以看出，这是
    R-CNN 系列工作的延续。Mask R-CNN 也是由何恺明、Georgia Gkioxari、Piotr Dollár 和 Ross Girshick
    提出的，获得了 2017 年国际计算机视觉大会（International Conference on Computer Vision，ICCV）最佳论文奖——马尔奖（Marr
    Prize）。


    Mask R-CNN 的结构如图 13-3 所示。不难发现，Mask R-CNN 是 Faster R-CNN 的拓展，它们之间的主要区别有 3 点：


    +   (1) 引入特征金字塔网络（feature pyramid network，FPN）[2]与 ResNet 一起作为主干网络。FPN 作为一种融合多尺度特征信息的手段，在视觉领域有着非常广泛的应用；


    +   (2) 提出感兴趣区域对齐（ROI align）取代 Faster R-CNN 中的 ROI 池化作为目标区域的特征提取器，用于提取整个候选区域特征并将候选区域特征图尺寸归一化到统一大小，用于后续的预测；


    +   (3) 增加了一个用于预测掩模的分支，该分支与分类头和回归头并行。'
