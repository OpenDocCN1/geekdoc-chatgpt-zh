    \ *\n                   np.hstack((pts2.T, np.ones((pts2.shape[1],1)))), axis=1))\n\
    \n    mask = (dist1 < threshold) & (dist2 < threshold)\n    return pts1[:,mask],\
    \ pts2[:,mask]\n\npts1 = np.transpose(pair[(0,1)]['pts1'])\npts2 = np.transpose(pair[(0,1)]['pts2'])\n\
