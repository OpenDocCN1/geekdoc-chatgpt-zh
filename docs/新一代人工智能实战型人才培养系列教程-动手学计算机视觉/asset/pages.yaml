- pgno: 51
  md: '```

    $G_s(m,n) = \frac{1}{2\pi\sigma_s^2} e^{-\frac{m^2+n^2}{2\sigma_s^2}}, G_b(d)
    = \frac{1}{2\pi\sigma_b^2} e^{-\frac{d^2}{2\sigma_b^2}}$$

    $W_{sb} = \sum_{m=i-k}^{i-1} \sum_{n=j-k}^{j-1} G_s(i-m, j-n) G_b(|I(m,n) - I(i,j)|)$

    ```


    $G_s$ 即 3.4 节中的高斯卷积核。双边滤波器只是在原有的高斯滤波器的基础上增加了一项高斯核 $G_b$，其中， $d = I(m,n) - I(i,j)$
    是图像在位置(m,n)和(i,j)处的像素值（亮度或者颜色）的差值。那么，只有当 $d$ 很小时，也就是位置(m,n)处的像素值和位置(i,j)处的像素值差别很小时，(m,n)处的像素值才会以很大的权重去影响输出图像在位置(i,j)处的像素值
    $\hat{I}(i,j)$ 的计算；反之，当 $d$ 很大时，也就是位置(m,n)处的像素值和位置(i,j)处的像素值差别很大时，(m,n)处的像素值不会对输出图像在位置(i,j)处的像素值
    $\hat{I}(i,j)$ 的计算产生很大影响。图 3-3 可以帮助我们更加清楚地理解双边滤波器的工作原理。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_51_0.png)


    图 3-3 双边滤波器滤波示意（另见彩插图 2）


    在图 3-3 中，我们将一幅输入图像「图 3-3（a）」输入双边滤波器进行滤波。图中红色点表示(i,j)所处的位置，而绿色点和橙色点分别代表不同的(m,n)所处的位置，图中点的高低表示像素值的大小。可以很明显地看出，红色点与橙色点的像素值大小接近，而与绿色点的像素值相差较多。我们知道双边滤波器是由两个高斯核「图
    3-3（b）上方」组成。当输入图像经过双边滤波器时，由于绿色点和红色点的亮度（像素值）差别较大，绿色点的影响会被抑制。换言之，在高斯滤波的基础上增加了一项高斯核之后，便可让亮度或颜色差别小的像素影响到高斯核的加权计算，而差别大的像素对高斯核的加权叠加影响减小，这就避免了图像的内容被模糊。例如，对实验的人脸做双边滤波，眼球上黑色的像素只会和黑色区域上的像素做加权平均，而不会和眼白的像素做加权平均，这就保证了滤波后眼球和眼白的界线。总体而言，在像素亮度或颜色变化不大的区域，双边滤波有类似于高斯滤波的效果，而在亮度或颜色变化剧烈的区域，高斯滤波的效果被新增的一项减弱了。$W_{sb}$
    是一个归一化因子，\(\frac{\sum_{m=i-k}^{i-1} \sum_{n=j-k}^{j-1} G_s(i-m,j-n)G_b(|I(m,n)-I(i,j)|)}{W_{sb}}
    = 1\)，这是为了防止图像经过滤波器之后，其像素值的大小超过值域（0~255）。注意，均值滤波器的归一化因子是均值滤波器的卷积核大小 $k^2$，而高斯滤波器满足
    $\sum \sum G(i,j) \approx 1$，无须专门做归一化。


