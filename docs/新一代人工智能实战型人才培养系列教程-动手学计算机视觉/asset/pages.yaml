  md: "```\nimport torchvision.datasets as datasets\nimport torchvision.models\nfrom\
    \ torch.utils.data import DataLoader, Dataset\nimport matplotlib.pyplot as plt\n\
    ```\n\n一般而言，在进行深度学习时，为了让深度网络学习的信息更加鲁棒，都会对图像进行“数据增强”。简单来说，数据增强是指在数据量比较固定的情况下，通过对原有的数据进行灰度、裁切、旋转、镜像、明度、色调、饱和度等一系列变换，增加数据量，以提高神经网络的性能。我们在实验中也对图像数据进行了增强。\n\
    \n```\n# 定义训练图像增强（变换）的方法\ntrain_transform = transforms.Compose(\n    [transforms.ToPILImage(),\n\
    \    # transforms.Resize((224, 224)),\n    transforms.ToTensor(),\n    transforms.Normalize(mean=[0.485,\
    \ 0.456, 0.406],\n                         std=[0.229, 0.224, 0.225])])\n```\n\
    \n把 Caltech-101 数据集封装成类，并生成训练集类、验证集类以及测试集类。\n\n```\n# 数据集\nclass ImageDataset(Dataset):\n\
    \    def __init__(self, images, labels=None, transforms=None):\n        self.X\
    \ = images\n        self.y = labels\n        self.transforms = transforms\n\n\
    \    def __len__(self):\n        return (len(self.X))\n\n# 用于深度学习训练构建的数据类中，__getitem__()函数非常重要\n\
    # __getitem__()决定着数据如何传入模型\n# 在下面的代码中，可以发现，当 transforms 非空时，\n# 数据将先经过 transforms\
    \ 进行数据增强，再返回进行后续操作\ndef __getitem__(self, i):\n    data = self.X[i][:][:]\n  \
    \  if self.transforms:\n        data = self.transforms(data)\n    if self.y is\
    \ not None:\n        return (data, self.y[i])\n    else:\n        return data\n\
    \n# 生成不同的类用于训练、验证及测试\ntrain_data = ImageDataset(x_train, y_train, train_transform)\n\
    val_data = ImageDataset(x_val, y_val, val_transform)\ntest_data = ImageDataset(x_test,\
    \ y_test, val_transform)\n```\n\n将生成的类传入数据加载器。在训练深度网络时，通常使用数据加载器将数据传入网络。"
