  md: '在本章中，我们将介绍两种代表性的无监督图像分割算法——基于 k 均值的图像分割算法和基于归一化割的图像分割算法。


    # # 9.2 图像分割算法


    本章聚焦无监督图像分割，因此我们首先要知道什么是无监督学习（unsupervised learning）。无监督学习是机器学习的一种类型，其特点是每个用于训练的样本只有其本身的信息，而没有任何标签信息，即没有“监督”信息。聚类（clustering）就是一种常用的无监督学习的方法，是指根据在数据中发掘出的样本与样本之间的关系，将数据进行分簇，使簇内的数据相互之间是相似的（相关的），而不同簇中的数据是不同的（不相关的）。簇内相似性越大，簇间差距越大，说明聚类效果越好。作为一种无监督学习的方法，聚类是许多领域常用的机器学习技术。图像分割的本质就是对像素进行聚类，所以图像分割算法一般是基于聚类算法的。


    # ## 9.2.1 基于 k 均值聚类的图像分割算法


    k 均值（k-means）[1][2]是一种在机器学习和数据分析领域广泛使用的聚类算法。它旨在将数据集划分为 k 个不同的、不重叠的子集或簇，每个数据样本归属于距离其最近的簇。具体而言，k
    均值算法通过以下几个关键步骤进行迭代操作。


    +   1. 初始化：从数据集中随机选择 k 个数据样本，并将其视为初始簇中心。

    +   2. 分配：将每个数据样本分配给与其距离最近的簇中心所属的簇。

    +   3. 更新：当所有数据样本分配完毕，计算每个簇中所有数据样本的均值，并将其作为新的簇中心。

    +   4. 重复：重复分配和更新步骤，直到簇中心不再发生显著变化，或达到预设的迭代次数。


    k 均值算法因其计算简单和收敛速度快而受到广泛应用，它不仅应用于传统的数据分析，还广泛应用于图像处理领域。如果将图像的像素视作数据点，并使用 k 均值算法对其进行聚类，就可以实现图像分割。那么，对于一幅图像，应该如何定义像素的信息呢？我们知道，每个像素包含
    R、G、B 这 3 个通道的数值（如图 9-3 所示），因此可以以 RGB 值为特征对像素进行聚类。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_129_0.png)


    图 9-3 以 RGB 值为特征对像素进行聚类（另见彩插图 8）'
