    +   - **无监督预训练范式的普及。**大数据时代，数据往往是无标注的，以往基于有标注数据的视觉模型主干网络预训练范式已无法适应时代的发展。取而代之的是基于无标注大数据的无监督预训练范式。事实上无监督预训练范式，如掩模语言建模（masked
    language modeling）已经在自然语言处理领域取得了巨大成功。类似的方法，如掩模图像建模（masked image modeling）也将在计算机视觉中得到广泛应用。基于无监督预训练的视觉大模型可以拟合大规模图像数据集，使视觉大模型具有很强的泛化能力，还可在特定任务上进行微调。这种方法将加速计算机视觉任务的开发和部署。

