- pgno: 268
  md: '# 第 17 章


    # 运动场和光流


    # 17.1 简介


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_268_0.png)


    在一个不断运动的世界中，我们的眼睛和大脑能够自然而然地感知到周围环境的运动。与此对应，计算机视觉技术面临的一个挑战是如何从获取的图像序列中提取出运动信息。通过运动场（motion
    field）和光流（optical flow）估计，我们可以从视频中重建运动信息。


    运动场描述了三维世界中点的运动在二维成像平面上的投影，如图 17-1 所示。运动场是图像上所有像素对应的三维空间点的三维速度向量在成像平面上的二维投影速度向量所形成的场。运动场是三维运动在二维成像平面上的理想表示，它直接关联到物体的实际物理运动，但我们无法直接从图像中观测到这种运动，只能通过分析图像序列中的光流来近似估计运动场。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_268_1.png)


    图 17-1 三维速度向量与其二维投影的对应关系


    光流定义为图像序列中由物体、照相机或光照变化引起的像素亮度随时间变化的表现。它由图像强度的变化计算而来，被视为像素二维投影速度向量的一个近似。整个图像平面上所有像素的光流向量构成了光流场，描述了图像层面的运动模式，是二维运动场的一个近似。然而光流场并不总是与实际的运动场一致，因为光流可能受到光照变化等非运动因素的影响。


    美国心理学家 James J. Gibson 在 20 世纪 40 年代首次提出了光流的概念[1]，自那以后，光流估计就成为计算机视觉领域的研究热点，并在运动分析、目标跟踪、图像配准和三维重建等多个方面得到了广泛应用。


    本章将深入介绍光流估计的基本原理和经典方法，通过理解和应用这些方法，我们可以更好地从视频中重建运动信息，使从二维图像中构建出的物体运动更接近于真实的三维物理世界的目标的运动。'
