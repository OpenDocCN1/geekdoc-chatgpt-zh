- pgno: 188
  md: '其中，\( i \) 是一个由这幅图像中锚框组成的小批次（mini-batch）中的锚框索引。理论上，该小批次可以包含这幅图像中所有的锚框，但这样计算损失函数会导致类别样本数量失衡，因为通常一幅图像中负锚框的个数远多于正锚框。为此，RPN
    在一幅图像中按正负锚框最大比例为 1：1 随机采样 256 个锚框来进行损失函数的计算，这 256 个锚框便是这幅图像产生的“小批次”。如果一幅图像中的正锚框数量少于
    128，那么将使用负锚框对这一小批次进行填充。\( q'' \) 为该锚框为正锚框的预测分数，\( u'' \) 是该锚框被赋予的真实类别标签。若锚框为正锚框，则
    \( u'' = 1 \)，反之若锚框为负锚框，\( u'' = 0 \)。\( t'' \) 和 \( v'' \) 分别是真实包围盒相对于该锚框的坐标偏移量的预测值和真实值。包围盒回归损失使用平滑函数
    \( smooth_{L_1} \) 进行计算，另外，\( u''L_{reg} \) 表明只有正锚框才需要进行包围盒回归。\( N_{cls} \) 是小批次的大小，即
    \( N_{cls} = 256 \)；\( N_{reg} \) 是特征图上点的总数，\( N_{reg} \) 近似为 2400；\( \lambda
    \) 是一个超参数，默认 \( \lambda = 10 \)，这样，分类损失和包围盒回归损失的权重近似相等。


    RPN 产生的一些候选区域之间存在较高的重叠。为了减少冗余，RPN 根据它们的置信度分数采用非极大值抑制（NMS）来减少重叠的候选区域。其中，NMS 的 IoU
    阈值固定为 0.7，这样，每幅图像大约会保留 2000 个候选区域。NMS 不但不会降低最终的检测准确性，还减少了候选区域的数量。在进行 NMS 后，RPN
    选取分数排名靠前的 \( N \) 个候选区域用于 Fast R-CNN 的训练。由于 RPN 和 Fast R-CNN 的分别训练会以不同的方式影响主干网络的参数，因此
    Faster R-CNN 采用了一种“四步交替训练”的方式实现训练时主干网络的参数共享，而不是学习两组单独的主干网络参数。四步交替训练流程如下。


    +   (1) RPN 所接的主干网络参数由在 ImageNet 数据集上预训练好的主干网络参数初始化，并按上述过程训练 RPN 和与之所接的主干网络；


    +   (2) Fast R-CNN 所接的主干网络参数同样由在 ImageNet 数据集上预训练好的主干网络参数初始化。然后使用第一步 RPN 生成的候选区域训练
    Fast R-CNN 和与之所接的主干网络。注意，此时 RPN 和 Fast R-CNN 不共享主干网络的参数，即它们所接的主干网络的参数是不同的；


    +   (3) 使用 Fast R-CNN 所接的主干网络参数来初始化 RPN 所接的主干网络参数，并固定主干网络参数，微调只属于 RPN 的网络层级。此时，RPN
    和 Fast R-CNN 共享主干网络；


    +   (4) 固定共享的主干网络的参数，微调只属于 Fast R-CNN 的网络层级。


    Faster R-CNN 在测试阶段的步骤与训练阶段类似，也是包含了上述几个步骤。对一幅测试图像，Faster R-CNN 先利用 RPN 生成一系列候选区域，利用
    NMS 对这些候选区域进行筛选，然后利用 Fast R-CNN 对这些候选区域进行包围盒的预测。


    接下来我们来看 RPN 的代码实现中的一些细节。在代码中，RPN 被定义为 RegionProposalNetwork，输入是使用 CNN 主干网络提取训练图像得到的特征图，输出是该特征图上的候选区域。


    # 12.4 RPN 代码整体框架


    先概览 RPN 代码的整体框架。'
