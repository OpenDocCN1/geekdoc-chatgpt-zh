- pgno: 42
  md: '# # 第 3 章

    # 图像滤波


    # ## 3.1 简介


    还记得在第 2 章中使用二维方波信号对图像进行卷积之后的结果吗？没错，图像平滑了，也模糊了。这便是所谓的图像滤波。滤波是图像处理的一项重要技术，在实际生活中有着广泛的应用。很多人都使用过图像处理软件（如
    Photoshop 和美图秀秀）修图，给照片中的人美颜，进行“磨皮”“祛痘”“祛斑”等处理，如图 3-1 所示。这些修图操作都离不开图像滤波技术的支持。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_42_0.png)


    图 3-1 软件修图


    滤波这个术语同样来自信号处理领域。所谓“波”是指的图像的频谱，即图像信号在频域上的表示。大家可以把图像的频谱简单地理解为：图中像素值变化剧烈的区域对应高频信息，像素值变化不大的区域对应低频信息。滤波就是过滤掉某些频率的信息，从而改变图像，使其达到想要的图像效果。用二维方波信号对图像进行卷积，使图像平滑，即像素值变化小，这样就过滤掉了图像中高频信息，这个过程就是图像去噪（image
    denoising）的过程。当然，也可以反其道而行之，通过滤波增强图像中的高频信息，从而实现图像锐化（image sharpening），也就是图像去模糊。通常把实现特定滤波操作的函数称为滤波器（filter）。


    在本章中，我们将介绍一些典型的滤波器。我们先从图像去噪的角度引出不同的滤波器，介绍它们的性质和去噪效果，然后再介绍如何通过滤波实现图像锐化。


    # ## 3.2 图像噪声


    我们先学习两种典型的图像噪声——椒盐噪声和高斯噪声。


    # ## 3.2.1 椒盐噪声


    椒盐噪声（salt and pepper noise）是数字图像中的一种常见噪声。所谓“椒盐”，“椒”是指'
  merge: -1
  img_proc: true
- pgno: 43
  md: "像素值为 0 的黑点，“盐”是指像素值为 255 的白点。椒盐噪声就是在图像中随机出现的黑色和白色的像素，其产生的原因可能是图像传感器突然受到强烈的干扰，使传感器中模数转换器发生错误。添加椒盐噪声的算法比较简单，只需在图像中随机加入一些全黑或全白的像素即可。下面，我们编程实现椒盐噪声。\n\
    \n```\n# 在第 2 章中编写了 utils 函数包文件，本书编写的函数都会封装到 utils 函数包中\nfrom utils import *\n\
    \n# 添加椒盐噪声\ndef add_Salt(img, pro):\n    # img 为输入图像\n    # pro 为椒盐噪声的比例\n\n \
    \   # 添加黑色像素\n    noise = np.random.uniform(0, 255, img[:, :, 0].shape)\n    #\
    \ mask 为添加噪声的掩模\n    mask = noise < pro * 255\n    # 扩展 mask 的维度\n    mask = np.expand_dims(mask,\
    \ axis=2)\n    mask = np.repeat(mask, 3, axis=2)\n    img = img * (1 - mask)\n\
    \n    # 添加白色像素\n    mask = noise > 255 - pro * 255\n    mask = np.expand_dims(mask,\
    \ axis=2)\n    mask = np.repeat(mask, 3, axis=2)\n    noise_img = 255 * mask +\
    \ img * (1 - mask)\n\nreturn noise_img\n\nimg = cv2.imread('lenaface.jpg')\n#\
    \ 添加椒盐噪声的图像\nimg_salt = add_Salt(img, 0.05)\nplt.imshow(img_salt[:,:,::-1])\n\
    plt.axis('off')\nplt.show()\n```\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_43_0.png)"
  merge: -1
