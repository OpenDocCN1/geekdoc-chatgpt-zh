- pgno: 12
  md: '# 本书内容安排


    计算机视觉是一门以应用为导向的学科，不同的应用对应不同的计算机视觉任务，所以本书的编排也以计算机视觉任务为划分。笔者根据对计算机视觉的理解，将计算机视觉任务划分为三大类：图像处理、视觉识别和场景重建。由于计算机视觉系统的输入是图像或者视频，所以首先需要对图像进行处理，这也是另外两类任务的基础。本书中图像处理的内容包括：卷积、图像滤波、模板匹配、边缘检测、角点检测、SIFT
    特征检测、图像拼接、图像分割。这些图像处理任务也常被称为底层视觉（low-level vision）任务。我们在这一部分中将介绍经典图像处理算法。在图像处理的基础上，我们可以对图像中的语义内容进行理解，这类任务被称为视觉识别任务，也被称为高层视觉（high-level
    vision）任务。本书中视觉识别的内容包括：图像分类、语义分割、目标检测、实例分割、人体姿态估计、动作识别。我们在这一部分中将主要介绍基于深度学习的视觉识别算法。另外，我们还可以恢复出图像中场景的三维结构，这类任务被称为场景重建。本书中场景重建的内容包括：照相机标定、运动场和光流、平行双目视觉、三维重建。我们在这一部分中将介绍基于几何的场景重建算法。


    # 本书使用方法


    本书每一章都由一个 Python Notebook 组成，在这些 Notebook 中详细阐述了计算机视觉相关概念定义、理论分析、算法过程和可运行代码。读者可以根据自己的需求自行选择感兴趣的部分阅读。例如，只想学习各个算法的整体思想而不关注具体实现细节的读者，可以只阅读除代码以外的文字部分；已经了解算法原理，只想要动手进行代码实践的读者，可以只关注代码的具体实现部分。


    本书面向的读者主要是对计算机视觉感兴趣的高校学生（无论是本科生还是研究生）、教师、企业研究员及工程师。在阅读本书之前，读者需要掌握一些基本的数学概念和数理统计基础知识（如矩阵运算、概率分布和数值分析方法等）。


    本书为计算机视觉的入门读物，也可以作为高校计算机视觉课程的教材或者辅助材料。本书提供的代码都是基于 Python 3 编写的，读者需要具有一定的 Python
    编程基础。我们对本书用到的 Python 工具库都进行了简要说明。每份示例代码中都包含可以由读者自行设置的变量，方便读者进行修改并观察相应结果，从而加深对算法的理解。书中会尽可能对一些关键代码进行注释，但我们也深知远无法将每行代码都解释清楚，还希望读者在代码学习过程中多思考，甚至翻阅一些其他资料，以做到完全理解。本书的源代码可在仓库
    https://github.com/boyu-ai/Hands-on-CV 中下载。我们为本书录制了视频课程，读者可扫描书中的二维码进行学习，也可以在 https://hcv.boyuai.com
    网站中进行学习。


    在入门计算机视觉的基础上，如果读者有兴趣以动手学的形式进一步了解深度学习，推荐阅读《动手学深度学习》；如果读者有兴趣以动手学的形式进一步了解数据结构与算法，推荐阅'
