    same\"))(x)\n    x = TimeDistributed(nn.BatchNorm2d(256))(x, training=train_bn)\n\
    \    x = F.relu(x)\n\n    x = TimeDistributed(nn.Conv2d(256, (3, 3), padding=\"\
