  md: "```\nfor i in range(W-w+1):\n    for j in range(H-h+1):\n        res[i,j] =\
    \ np.sum(temp*img[j:j+h, i:i+w])\n        # 在这里进行归一化操作\n        if normalize:\n\
    \            res[i,j] = res[i,j] / t / np.sqrt(np.sum(img[j:j+h, i:i+w]**2))\n\
    \    return res\n\nimg = cv2.imread('lena_tri.jpg')\ntemplate = cv2.imread('lena_small.png')\n\
