- pgno: 57
  md: '# ## 4.1 简介


    图像匹配（image matching），即找到不同图像中相同或相似物体的对应位置关系，是计算机视觉的一个基础问题。基于图像匹配，可以完成图像检索、图像拼接和图像识别等一系列计算机视觉任务。最基础、最简单的图像匹配就是模板匹配：给定一幅模板图像，在另一幅图像中找到与该模板相似度最高的目标位置。例如图
    4-1 所示，给定云朵为模板图像，需要找到该图中是否含有云朵，如果有，则需要确定云朵的位置。根据目标的数目，可以将模板匹配分为单目标模板匹配和多目标模板匹配。在本章中，我们将介绍模板匹配的步骤及用于匹配的相似度度量方法。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_57_0.png)


    图 4-1 模板匹配示例


    # ## 4.2 模板匹配的实现


    我们先介绍模板匹配的步骤。'
