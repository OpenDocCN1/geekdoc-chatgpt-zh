  md: '在本章中，我们将首先介绍数据集与评测指标，然后动手学动作识别中的经典方法——C3D[1]。


    # ## 15.2 数据集和度量


    本节将介绍动作识别常用的数据集及度量。


    # ### 15.2.1 数据集


    目前人体动作识别常用的数据集包括以下 3 个。


    (1) UCF101[2]: UCF101 数据集于 2012 年发布，它由 YouTube 中的部分真实世界视频组成，包含 101 种不同的动作类别。这些类别可以分为
    5 种类型：人体运动、人与人交互、人与物体交互、演奏乐器和体育运动。UCF101 数据集共有 13320 个视频片段，累计时长超过 27 h，所有视频的帧率固定为每秒
    25 帧。


    (2) Sports-1M[3]: Sports-1M 于 2014 年发布，是第一个规模较大的视频动作数据集，由超过 100 万个 YouTube 视频组成，其中标注了
    487 种运动类别。由于类别的粒度较小，其类别间的差异较小。


    (3) DeepMind Kinetics human action dataset: Kinetics 家族是目前应用最广泛的基准数据集。2017 年推出的
    Kinetics-400[4]包含约 24 万个训练视频和 2 万个验证视频，涵盖 400 种人类动作类别，每类动作至少有 400 个视频片段，每个视频片段时长约为
    10 s。随着时间的推移，Kinetics 家族一直在不断扩大，2018 年推出的 Kinetics-600[5]包含超过 49 万个视频，2019 年推出的
    Kinetics-700[6]包含超过 65 万个视频。


    # ### 15.2.2 评测指标


    在人体动作识别任务中，常用的评估指标如下。


    (1) 精确度（accuracy）：精确度是处理分类任务最常用的评价指标，它表示分类正确的样本数占总样本数的比例。


    (2) 命中率（hit@k）：模型预测的前 k 个结果中是否包含了正确的标签。具体定义如下：


    \(\text{hit} @k = \frac{1}{M} \sum_{m=1}^{M} I(l^{(m)} \in \{ \hat{l}_{top1}^{(m)},
    \hat{l}_{top2}^{(m)}, ..., \hat{l}_{topk}^{(m)} \})\)


    其中，\(M\) 是测试集中的视频序列数量；\(l^{(m)}\) 是第 \(m\) 个视频序列的真实动作标签；\(\{ \hat{l}_{top1}^{(m)},
    \hat{l}_{top2}^{(m)}, ..., \hat{l}_{topk}^{(m)} \}\) 是模型对第 \(m\) 个视频序列预测的前 \(k\)
    个标签集合；\(I\) 是指示函数。


    # ## 15.3 动作识别模型——C3D


    视频数据不同于图像数据，它是一个连续的序列，为了识别出视频中的动作，我们需要考'
