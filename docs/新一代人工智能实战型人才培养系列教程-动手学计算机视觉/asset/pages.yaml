    R-CNN 网络。


    # 12.4.5 filter_proposal 模块


    filter_proposal 模块对得到的候选区域进行筛选，主要包括以下几步：


    +   (1) 根据包含目标的置信度降序排序候选区域，选择前 pre_nms_topn 个候选区域；

    +   (2) 对超出图像边界的候选区域进行裁剪；

    +   (3) 去除面积过小的候选区域；

    +   (4) 进行 NMS 去除冗余的候选区域；

    +   (5) 对 NMS 的结果根据分数进行降序排序，输出前 post_nms_topn 个候选区域。


