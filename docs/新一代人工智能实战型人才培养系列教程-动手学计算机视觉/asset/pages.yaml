    # 5.3.2 Canny 边缘检测算法


    虽然 Sobel 算子中加入了类似于高斯滤波的算子，使其对图像噪声有一定的抑制性，但是区分图像噪声和边缘本身是一个很困难的任务，特别是是图像中常常会存在由杂乱纹理产生的虚假边缘。通过图像平滑能够在一定程度上抑制噪声，但是，平滑也会使得图像变得模糊，降低边缘的强度，所以对图像的平滑程度应当是可以调节的，边缘检测的结果应该也是多尺度的（如可以调节平滑程度）。接下来，我们介绍一种多尺度边缘检测算法——Canny
    边缘检测算法[4]。


    Canny 算法可能是计算机视觉中使用最广泛的边缘检测算法，它通常通过以下几步实现：


    +   (1) 图像平滑，即抑制噪声；

    +   (2) 图像梯度计算；

    +   (3) 边缘强度非极大值抑制（non-maximum suppression，NMS）；

    +   (4) 基于滞后的阈值化（hysteresis-based thresholding）的边缘定位。


    # 1. 图像平滑


    由于边缘检测对图像噪声非常敏感，因此在进行后续的操作之前，需要先对图像进行去噪。结合第 3 章中所学的知识，一般使用高斯滤波器对图像进行去噪。对图像平滑的程度取决于高斯核标准差σ
    的大小。σ 越大，图像越平滑，但也越模糊；σ 越小，图像细节保留越多，但是噪声也越多。不同的σ 代表了不同的尺度，调节σ 的大小，在不同平滑程度的图像上进行边缘检测，得到的便是多尺度边缘检测结果。在实现程序中，我们先将高斯核的大小设置为
    5，σ 设置为 1.5（一般高斯核的大小是 σ 的 3 倍时，滤波效果比较好）。'
