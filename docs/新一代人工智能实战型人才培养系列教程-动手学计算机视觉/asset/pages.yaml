    我们以使用 ResNet18 进行图像分类为例进一步说明 ResNet 的架构。将一幅分辨率为 224 像素×224 像素的 RGB 图像输入 ResNet，ResNet
    通过 conv1 层网络对其进行卷积，得到一个空间分辨率为 112 像素×112 像素、通道数为 64 的特征图。回顾在第 2 章中介绍的二维卷积，可以知道，由于
    conv1 层中卷积的步长设置为 2，因此得到的特征图的空间分辨率只有输入图像的 1/4。通道数为 64 的特征图是怎么来的？我们在第 2 章中介绍了用一个
    k×k 卷积核对输入图像做卷积，会得到一个通道数为 1 的特征图。那么，通道数为 64 的特征图就是用 64 个 k×k 卷积核对输入图像做卷积，然后将得到的
    64 个通道数为 1 的特征图沿特征维度拼接得到的。注意，特征图也可以看成一幅图像，所以，我们可以通过卷积来改变特征图的通道数，即特征维度。一般来说，对一个通道数为
    t、空间分辨率为 H×W 的特征图，使用 s 个卷积核同时对该特征图进行卷积，便可输出一个通道数为 s 的特征图。由此可见，通过卷积可以完成对特征图特征维度的升维和降维，这个性质非常有用。在
    conv1 层之后，ResNet 依次通过 4 个模块，每个模块都将特征图的空间分辨率缩小 1/4，最终 conv5_x 的输出是一个 512 通道的 7
    像素×7 像素的特征图。在此之后，将特征图依次输入全局平均池化层和一个具有 1000 个神经元且使用 softmax 激活函数的全连接层。全连接层将一个任意通道数的特征图映射到一个维度为类别数目的向量，该向量表示模型预测的类别的概率分布。最终，可以根据这一概率分布，预测图像的类别。


