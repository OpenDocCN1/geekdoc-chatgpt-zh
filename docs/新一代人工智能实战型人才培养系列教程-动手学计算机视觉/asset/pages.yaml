  md: '# # 第 16 章


    照相机标定


    # ## 16.1 简介


    拍摄图像作为捕捉和记录这个世界的一个主要手段，在我们生活的三维世界中扮演着不可或缺的角色。图像是由照相机成像函数 f 将真实世界的场景 S 投影到二维平面上的视觉记录
    I，为我们提供了观察和理解世界的一个窗口。然而真实的世界是三维的，而记录下来的图像是二维的，且图像的分辨率有限，因此这一转换过程不可避免地伴随着信息的损失。尽管如此，我们仍然希望能够通过图像重建出其中描述的场景。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_248_0.png)


    为了向这一目标迈进，我们必须首先深入了解照相机成像函数 f。因为只有完全掌握了照相机将三维世界投影到二维图像的原理，我们才有可能逆向这一过程，实现从图像到场景的还原，即从二维信息恢复三维信息。在本章中，我们将先介绍照相机成像的基本原理，即照相机如何确立真实三维空间中一点与其在二维图像上投影点之间的映射关系，然后介绍如何通过照相机标定（camera
    calibration）来计算照相机的成像过程中的参数。


    # ## 16.2 照相机成像原理


    尽管现实世界中的照相机光学系统极其复杂，但是照相机成像函数 f 的核心原理却与简化模型无太大差异。为了便于计算和阐述，我们采用简化的针孔照相机模型和透镜照相机模型来近似实际照相机的工作原理。针孔照相机模型，作为一种基础且高效的理论模型，阐释了光通过一个小孔并在另一侧的光屏（成像平面）上形成图像的过程。虽然理论上，小孔成像能够产生清晰的图像，但是由于小孔只允许极少的光线进入，因此成像亮度很低，这不仅限制了在光线不足的情况下小孔成像的使用，还要求较长的曝光时间以获得清晰的图像。而透镜照相机模型采用凸透镜来代替针孔模型中的小孔进行成像，更加贴近我们实际使用的照相机。需要注意的是，透镜的制造和组装过程可能引入某些偏差，这些偏差将导致光线并不完全按照预期的路径传播，从而引起图像畸变（distortion）。通过照相机标定，我们可以建模这些畸变，并有效地纠正它们。'
  merge: -1
