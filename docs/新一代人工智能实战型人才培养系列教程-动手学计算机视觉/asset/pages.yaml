  md: '# # 第 12 章

    # 目标检测


    # ## 12.1 简介


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_177_0.png)


    目标检测（object detection）是计算机视觉中的一个核心问题，其目的是识别图像中每个目标的类别并且对它们进行定位。定位（localization）即确定目标的位置和尺寸，通常需要勾勒出目标轮廓的包围盒（bounding
    box），确定该包围盒的中心点坐标及宽和高。用数学语言来描述目标检测的问题，即定义图像空间 I 和预定义的类别集合 C，给定数据集 D = {(I^(n),
    Y^(n))}^N_{n=1}，其中，I^(n) ∈ I 是数据集中的第 n 幅图像，Y^(n) = {<c^(n,m), b^(n,m)>}^M_{m=1}
    是其对应的目标包围盒标签，M^(n) 是这幅图像中目标的个数，二元组 <c^(n,m), b^(n,m)> 是这幅图像中第 m 个目标的包围盒标签，c^(n,m)
    ∈ C 是类别标签，b^(n,m) = (b_x, b_y, b_h, b_w)^(n,m) 是一个四元组，表示包围盒坐标（由于该四元组 b^(n,m) 表示了一个唯一确定的包围盒，我们称之为包围盒的坐标，本章提到的包围盒坐标均指代该四元组），包括包围盒中心点坐标
    (b_x, b_y) 以及包围盒的高 b_h 和宽 b_w；图像分类的任务是从 D 中学习得到一个从图像空间到包围盒集合的映射 f : I -> Y，从而给定任意一幅测试图像
    I，可以用学习得到的映射函数 f 预测该图像中目标包围盒集合：\hat{Y} = f(I)。


    图 12-1 展示了一个目标检测的例子，图中的“人”“玩具”和“椅子”被识别出来，它们的包围盒也被勾勒出来。由于目标检测的输出是包围盒这种形状规则的矩形，在工业领域中对下游业务适用性高，所以得到广泛应用，例如辅助驾驶系统中的感知模块的输出就是检测到的目标的包围盒。在本章中，我们将介绍基于深度学习的目标检测方法，并动手实现相应的目标检测框架。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_177_1.png)


    图 12-1 目标检测示例'
