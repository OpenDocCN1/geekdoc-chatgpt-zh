- pgno: 11
  md: '# 前言


    在如今这个数字化时代，很难说计算机视觉还是一种神秘的无人知晓的高科技，因为自拍美颜、人脸识别、辅助驾驶等计算机视觉应用早已进入人类的日常生活。计算机视觉正在引领着人类走向智能化未来的大门。


    2019 年至 2020 年，本书的作者之一沈为教授曾在美国约翰斯·霍普金斯大学计算机系讲授计算机视觉课程。从 2021 年起，沈为继续为上海交通大学人工智能（卓越人才试点班）讲授计算机视觉课程。在授课过程中，他发现学习者学习计算机视觉课程主要面临两方面的挑战。一方面，计算机视觉涵盖了多个领域的知识，包括图像处理、模式识别、几何重建和深度学习等，知识体系庞大，这对学习者掌握计算机视觉的整个知识体系提出了挑战。很多学习者甚至是年轻的计算机视觉研究者往往只对计算机视觉的某一个子方向比较精通，而对其他子方向了解甚少。另一方面，计算机视觉是一个对工程实现要求较高的领域，计算机视觉算法的原理学会了，并不代表能够将其编程实现并获得期望的结果。为帮助学习者应对计算机视觉学习过程中的这些挑战，笔者编写了这本《动手学计算机视觉》。针对第一个挑战，笔者参考了计算机视觉大师
    Richard Szeliski 教授的著作 Computer Vision: Algorithms and Applications 中的知识体系架构，并结合笔者的授课经验，将本书的内容分为
    4 个部分：计算机视觉导论、图像处理、视觉识别和场景重建。前两部分是后两部分的基础，后两部分代表了两类计算机视觉的任务，其中第三部分是对图像内容的语义理解，第四部分是对图像中场景的几何结构进行重建。笔者期望通过这
    4 个部分的划分与联系，尽量涵盖计算机视觉的所有内容。针对第二个挑战，笔者以 Python Notebook 的形式直接编写本书，将算法原理和可运行的代码融合在一起呈现出来。这样，学习者可以快速地上手实现所学的计算机视觉算法，形成算法原理和实验结果的闭环。


    中国并不缺少好的计算机视觉教材，艾海舟老师翻译的《计算机视觉——算法与应用》和叶韵老师编著的《深度学习与计算机视觉：算法原理、框架应用与代码实现》都是极好的入门书。本书则力争从知识点的涵盖面和理论与实践结合两方面取得一些突破。一方面，本书尽可能多地涵盖计算机视觉的知识点，特别是经典计算机视觉，因为其中的很多思想到今天仍然是非常有用的；另一方面，本书以大量实例和代码带领读者走进计算机视觉的世界，提高自学效率，辅助课堂教学。期望本书能为我国计算机视觉人才的培养贡献一份力量。'
