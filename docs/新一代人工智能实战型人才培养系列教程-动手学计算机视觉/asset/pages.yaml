    # 内容提要


    本书着眼于计算机视觉教学实践，系统地介绍了计算机视觉的基本内容及其代码实现。

    本书包含 4 个部分：第一部分为计算机视觉导论，带领读者初步了解计算机视觉。第二部分为计算机视觉中的图像处理基础，介绍了图像滤波、特征检测、图像拼接、图像分割等经典的图像处理算法；第三部分为计算机视觉中的视觉识别方法，主要讲解基于深度学习的视觉识别方法，包括基于深度学习的图像分类、语义分割、目标检测、动作识别等；第四部分为计算机视觉中的场景重建，主要讨论照相机标定、运动场和光流、平行双目视觉以及三维重建。本书将计算机视觉算法原理与实践相结合，以大量示例和代码带领读者走进计算机视觉的世界，让读者对计算机视觉的研究内容、基本原理有基本认识。

    本书适合对计算机视觉感兴趣的专业技术人员和研究人员阅读，同时适合作为人工智能相关专业计算机视觉课程的教材。


