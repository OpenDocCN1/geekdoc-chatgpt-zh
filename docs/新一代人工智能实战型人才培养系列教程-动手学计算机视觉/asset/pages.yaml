    图 2-4 二维卷积的部分计算过程（步长为 1）


    不难发现，由于卷积核大小的限制，我们无法直接对图 2-4 中输入图像的左上角的像素“1”进行卷积操作。因此，在计算最边缘的一行和一列的输出结果时，一般对原矩阵进行零填充，再进行矩阵的卷积和操作，如图
    2-5 所示。


    | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | 2 | 3 | 4 | 5 | 0 |

    | 0 | 6 | 7 | 8 | 9 | 10 | 0 |

    | 0 | 11 | 12 | 13 | 14 | 15 | 0 |

    | 0 | 16 | 17 | 18 | 19 | 20 | 0 |

    | 0 | 21 | 22 | 23 | 24 | 25 | 0 |

    | 0 | 0 | 0 | 0 | 0 | 0 | 0 |


    图 2-5 图像的零填充


    对于一幅 H×W 的输入图像，我们对其零填充的层数为 p，使用一个步长为 s、大小为 k×k 的卷积核对其进行卷积，则输出矩阵的行数为 \(\frac{H-k+2p}{s}+1\)，列数为
    \(\frac{W-k+2p}{s}+1\)。


    注意，上述对图像进行二维卷积的过程只考虑了图像只有两个维度的情况（即灰度图），而实际中的图像往往还存在第三个维度，如常见的彩色图像，其形状为 H×W×3，即考虑了每个像素对应
    R、G、B 这 3 个通道；又如高光谱图像，其形状为 H×W×L（L > 3），即每个像素对应 L 个通道，包含 L 个与波长对应的光谱信息。由此可见，每个像素对应的通道数越多，图像所蕴含的信息也就可能越丰富，所以第三个维度也称为图像的特征维度。那么对于这种通道数
    L > 1 的图像如何做二维卷积呢？对一幅 H×W×L 的输入图像做二维卷积，需要卷积核的通道数也为 L，即二维卷积核的通道数默认和输入图像的通道数相同。因此我们在描述二维卷积核的大小时，习惯上只会提及空间两个维度的大小，如
    k×k 的卷积，但实际上卷积核的形状是 k×k×L，L 的大小由输入图像的通道数决定。当 L > 1 时，对一幅 H×W×L 的输入图像做 k×k 的卷积，可以通过以下步骤实现：首先，按如前所述的二维卷积操作，对
    H×W×L 的输入图像的每一个通道所对应的 H×W 图像，从维度为 k×k×L 的卷积核中取该通道所对应的 k×k 二维卷积核对其做卷积。这样会得到 L 个空间分辨率相同，通道数为
    1 的卷积结果。然后，对这 L 个卷积结果逐元素相加，便得到所要求的二维卷积结果（该结果也称为特征图，这个概念在本书第二部分中会经常用到）。更多关于多通道图像的二维卷积计算的内容可参阅《动手学深度学习》。


    接下来，我们开始编写二维卷积。我们将对一幅图像进行处理，并直观地展示卷积前后图像的变化。与一维卷积类似，我们也使用冲激信号和方波信号作为卷积核。注意代码中二维冲激信号和二维方波信号的实现。这里直接调用
    Python 中的库函数 cv2.filter2D() 进行二维卷积操作。我们把二维卷积的代码实现留作习题。'
