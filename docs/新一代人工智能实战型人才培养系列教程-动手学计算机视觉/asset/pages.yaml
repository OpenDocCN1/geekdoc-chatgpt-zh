    # ## 2.3 二维卷积


    在计算机视觉领域，常常需要对图像进行处理，卷积正是一种常用的图像处理操作。一幅数字图像可以看作一个二维空间的离散函数，表示为 $I(i,j)$。与一维离散函数对应，可用矩阵表示图像这种二维离散函数。假设图像高为
    $H$，宽为 $W$，设置卷积核为 $K(i,j)$，可以得到二维卷积的公式：


    $$G(i, j) = I(i, j) * K(i, j) = \sum_{i''=1}^{H} \sum_{j''=1}^{W} I(i'', j'')
    K(i-i'', j-j'')$$


    将卷积的概念从一维扩展到二维，其结果非常类似，只不过变成了矩阵的“卷和”操作。卷和就是离散的卷积，卷积是积分，而卷和是点与点的乘法和加法。以下是一个二维图像（矩阵）同一个二维卷积核卷积的过程。


    +   (1) 将二维卷积核对应的矩阵水平翻转，竖直翻转。


    +   (2) 将这个卷积核矩阵与输入图像左上角对齐。


    +   (3) 将卷积核矩阵的每个元素与输入图像中每个对齐的元素相乘，再把所有的乘积加起来，得到当前卷积的结果。让这个卷积核矩阵在输入图像上滑动，每次滑动的步长为
    s，重复上述计算。


    图 2-4 描述了二维卷积的部分计算过程。通过在输入图像上滑动，逐步得到整幅图像的卷积输出。'
