  md: '遵循二维正态分布 \( N(\mu, \sigma) \)，其中 \( \mu \) 和 \( \sigma \) 分别等于训练数据中所有样本的观测偏移量
    \( (y_j^{c-1} - y_j) \) 的均值和方差。这样就可以将增强的训练数据和真实数据共同用于训练阶段 c 的姿态回归器。增强的训练数据可以表示为


    \(\mathcal{D}_A^c = \{(crop(I, b_j^{c-1}), norm(y_j; b_j^{c-1})) | (I, y_j) \sim
    \mathcal{D}, \delta \sim N(\mu, \sigma), b_j^{c-1} = (y_j + \delta, H_j, W_j)\}\)


    级联阶段 c 的训练目标为


    \(\min_{\theta_j^c} \sum_{(I, y_j) \in \mathcal{D}_A^c} \| y_j - \psi_j(I; \theta_j^c)
    \|_2^2\)


    DeepPose 相对于以往基于图像块的方法有如下创新点。


    +   (1) 对于如何使用全局观点点获得关节点的坐标的问题，DeepPose 提出了使用深度神经网络作为全局特征提取，将整幅图像作为输入的方法。


    +   (2) 人体关节点本身存在分布规律，而关节点的坐标在图像坐标系下并无特别的规律，因此 DeepPose 提出了在每个环节中，通过中心点、长和宽选择一个包围盒，然后计算节点在包围盒中的坐标，从而将绝对坐标转换为统一的坐标。


    +   (3) 为了实现更高精度的坐标计算，DeepPose 提出了级联的深度神经网络，在获得初步的关节点坐标之后，再在原始图像中根据该坐标选择一定的局部区域，从而实现更高准确度的坐标计算。


    通过这一系列的设计，DeepPose 成功地成为当时的最高水平（state-of-the-art，SOTA），并引领了深度学习在人体姿态估计领域的潮流。接下来，我们来动手编写
    DeepPose 并在 MS COCO 数据集上测试预测效果。


    # 14.4 DeepPose 代码实现


    由于 DeepPose 的级联过程需要对每个关节点训练一个回归器，这一过程非常耗时。如 DeepPose 的论文中所述，训练每个级联精化阶段需要花费 7 天时间。因此，我们这里采用一种高效的处理方式：在每个阶段，将上一阶段预测的关节点坐标和对图像提取得到的特征图进行拼接，并基于这一拼接的特征进行这一阶段关节点坐标的精化。与
    DeepPose 的级联精化过程相比，我们采用的方式去除了裁剪操作，无须多次计算图像特征，因此高效得多；又因为拼接的特征图中包含了上一阶段预测的关节点位置信息，可以使网络更加关注该位置周围的局部图像区域，从而实现关节点坐标的精化。


    我们首先编写 DeepPose 的代码。


    ```

    import torch

    import torch.nn as nn

    import torchvision.models as models

    ```'
