  md: '# 第9章 图像分割


    # 9.1 简介


    平面设计师在对图像进行处理时，往往需要提取图像中的某一个物体(如图 9-1 所示)，这种技术被形象地称为“抠图”。“抠图”是图像分割的一个实际应用。在计算机视觉领域，图像分割（image
    segmentation）是最古老的，也是被研究得最多的一个问题。根据是否基于人为给定的语义监督，图像分割可分为无监督图像分割（unsupervised image
    segmentation）和有监督图像分割（supervised image segmentation）。本章将聚焦无监督图像分割，而有监督图像分割（包括语义分割和实例分割等）应归类于图像识别问题，将在后续章节介绍。无监督图像分割，其目的是把图像划分成若干互不相交的区域，使得具有相似特征的像素被划分到同一区域，具有不同特征的像素被划分到不同的区域（如图
    9-2 所示）。这一目标完全通过挖掘图像内在结构信息实现，而不基于人为标注的语义类别，所以无监督图像分割是一个普适性的问题，其结果可以为解决高层视觉识别任务（如语义分割、目标检测、实例分割等）提供基础或者初始条件。


