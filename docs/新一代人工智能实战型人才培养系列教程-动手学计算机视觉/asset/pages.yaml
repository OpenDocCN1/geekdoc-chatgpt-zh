    \ (d) 右边第 2 层]，这一过程称为横向连接。这种融合方式迭代地在每层执行，上一层不断与下一层融合，从而实现自顶向下的效果。通过这种方式，FPN 可以获取多个尺度的特征，并将这些特征融合在一起，形成了\
    \ P2、P3、P4，从而提高对多尺度目标检测的准确性和效率。另外，在某些方法中，还会通过步长为 2 的卷积层对 P4 进行处理，得到 P5、P6 等。\n\
