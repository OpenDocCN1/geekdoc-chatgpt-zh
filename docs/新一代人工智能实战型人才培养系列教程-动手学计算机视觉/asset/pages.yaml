  md: '# 12.2 数据集和度量


    常用于目标检测的数据集包括：PASCAL VOC、MS COCO 和 ImageNet，其中 PASCAL VOC 和 ImageNet 数据集在之前的章节中已经介绍过，此处不再赘述。


    MS COCO（Microsoft common objects in context）数据集是一个广泛用于计算机视觉任务的大型数据集，于 2014 年由微软发布。它主要用于目标检测、分割、关键点检测和图像描述生成等任务。MS
    COCO 数据集的目标是为了推动计算机视觉技术在更复杂的场景中的发展。MS COCO 数据集有以下特点。


    +   (1) 图像数量多：数据集包含了约 20 万幅标注过的图像，以及约 13 万幅未标注的图像。


    +   (2) 类别和来源丰富：图像涵盖了 80 个类别的物体，如动物、交通工具、家具等，同时图像来源丰富，包括从网络上抓取的图像、街景图像和室内图像等。


    +   (3) 场景复杂：数据集中的图像包含了各种复杂的场景，如拥挤的市场、交通堵塞的道路等，这对计算机视觉模型提出了较高的挑战。


    最常用的目标检测评价指标是全类平均精度（mean average precision，mAP）。从 mAP 的命名可以看出，这是一个定义在每个类别上的精度指标。因此在定义
    mAP 之前，需要先定义一个目标是否被检测到的准则。如图 12-2 所示，对于图像中的一个目标，令其真实的（ground-truth）包围盒内部的像素集合为
    A，一个预测的包围盒内部的像素集合为 B，通过这两个包围盒内像素集合的交并比（intersection over union，IoU）来定义两个包围盒的重合度，其中，IoU(A,
    B) = \frac{A \cap B}{A \cup B}，即图 12-2 (a) 中灰色部分的面积除以图 12-2 (b) 中灰色部分的面积。注意，这里
    IoU 的定义与第 11 章中对 IoU 的定义在数学上等价，在目标检测中，IoU 也称为 Box IoU。给定一个阈值 \theta，如果 IoU(A,
    B) > \theta，则认为 B 所属的预测包围盒命中了该目标；反之，则认为 B 所属的预测包围盒并未命中该目标。根据这个基于 IoU 的准则，给定一种类别，对每个预测类别为该给定类别的预测包围盒，如果它内部的像素集合与某个类别标签为该给定类别的真实包围盒内部的像素集合之间的
    IoU 大于给定阈值，则这个预测包围盒是真阳性（true positive，TP）；如果其内部的像素集合与任意一个类别标签为该给定类别的真实包围盒内部的像素集合的
    IoU 都小于给定阈值，那么这个预测包围盒是假阳性（false positive，FP）；如果一个类别标签为该给定类别的真实包围盒中的目标没有被任何预测包围盒命中，那么这是假阴性（false
    negative，FN）。这样，对每幅图像的检测结果，可以计算出对于该给定类别的查全率（recall），即正确检测相对于所有真实包围盒的比例，以及查准率（precision，也称为精度），即正确检测相对于所有预测包围盒的比例：


    ```

    recall = \frac{TP}{TP + FN}


    precision = \frac{TP}{TP + FP}

    ```


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_178_0.png)'
