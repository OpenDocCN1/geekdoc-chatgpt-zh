  md: '# 第 11 章


    # 语义分割


    # 11.1 简介


    语义分割（semantic segmentation）是计算机视觉领域的一个基础问题，也是一项具有挑战性的视觉识别任务。简单来说，语义分割的目标是为一幅图像的每个像素预测一个标签，可以说它是一种像素级的“图像分类”，如图
    11-1 所示。需要注意的是，与在第 9 章中介绍的无监督图像分割不同，语义分割得到的分割是具有语义性的，每个分割对应于给定的标注集中的一个类别。如图 11-2
    所示，其中粉红色和玫红色的分割分别对应于“人”和“马”这两个类别。用数学语言来描述语义分割问题，即定义图像空间 I 和预定义的类别集合 C，给定数据集 \(\mathcal{D}
    = \{(I^{(n)}, Y^{(n)})\}_{n=1}^N\)，其中，\(I^{(n)} \in \mathbb{I}\) 是数据集中的第 \(n\)
    幅图像，\(Y^{(n)}\) 是这幅图像对应的标签图（label map），标签图中的第 \(i\) 个元素 \(y_i^{(n)} \in \mathcal{C}\)
    是第 \(n\) 幅图像的第 \(i\) 个像素的标签；语义分割的任务是从 \(\mathcal{D}\) 中学习得到一个从图像空间到标签图空间的映射 \(f:
    \mathbb{I} \rightarrow \mathcal{Y}\)，其中，\(\forall n, Y^{(n)} \in \mathcal{Y}\)，从而给定任意一幅测试图像
    \(I\)，可以用学习得到的映射函数 \(f\) 预测其标签，即 \(\hat{Y} = f(I)\)。与图像分类类似，这个学习过程需要建模条件概率 \(P(Y|I)\)，则
    \(\hat{Y} = f(I) = \arg\max_{Y \in \mathcal{Y}} P(Y|I)\)。语义分割能够提供像素级的类别信息，因此在实际场景中有很多应用，如自动驾驶、缺陷检测、医学影像辅助诊断等。


