    # 图 7-4 高斯拉普拉斯算子的尺度归一化响应


    至此，我们学习了基于尺度空间的块状区域检测的基本原理。那么，如何将该原理应用到图像中呢？


    图像的尺度空间 \(L(x, y, \sigma)\) 可通过一个不同尺度的高斯函数 \(G(x, y, \sigma)\) 与输入图像 \(I(x, y)\)
    卷积得到，在该尺度空间 \((x, y, \sigma)\) 处的值 \(L(x, y, \sigma)\) 为


    ```

    L(x, y, \sigma) = G(x, y, \sigma) * I(x, y)

    ```


    其中，\((x, y)\) 是二维空间坐标，\(\sigma\) 是高斯分布的标准差，也称为尺度空间因子。由滤波的知识可知，\(\sigma\) 值越小，即尺度越小，图像模糊的程度越小；\(\sigma\)
    值越大，即尺度越大，图像模糊的程度越大。大尺度对应图像的概貌特征，小尺度对应图像的细节特征。计算输入图像与归一化高斯拉普拉斯算子卷积的结果，根据卷积结果中是否存在极值点来判断当前位置是否是块状区域，即是否存在特征点。如图
