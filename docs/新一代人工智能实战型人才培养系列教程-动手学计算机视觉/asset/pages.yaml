    mrcnn_probs = F.softmax(mrcnn_class_logits, dim=-1)\n```\n\n```\n# 回归头\n# 包围盒回归\n\
    x = TimeDistributed(nn.Linear(fc_layers_size, num_classes * 4))(shared)\n# mrcnn_bbox:\
    \ [batch, num_ROIs, num_classes, 4]\nmrcnn_bbox = x.view(-1, x.size(1), num_classes,\
    \ 4)\nreturn mrcnn_class_logits, mrcnn_probs, mrcnn_bbox\n```\n\n```\n# 掩模预测\n\
    # 进行 ROI 对齐\n# 根据 ROI 进行语义分割\n####################################################################\n\
    def build_fpn_mask_graph(ROIs, feature_maps, image_meta, pool_size, num_classes,\n\
    \                         train_bn=True):\n    # 首先对特征图进行 ROI 对齐，得到空间分辨率相同的 ROI\n\
    \    x = PyramidROIAlign([pool_size, pool_size])([ROIs, image_meta] + feature_maps)\n\
    \n    # x: [batch, num_ROIs, MASK_POOL_SIZE, MASK_POOL_SIZE, channels]\n    #\
