  md: '# # 第 18 章


    # ## 平行双目视觉


    # ### 18.1 简介


    照相机成像是一个将三维世界映射到二维图像的过程，如果我们想从图像中恢复出三维世界的信息，我们需要解决一个重要的问题：恢复照相机成像过程中丢失的深度信息。给定单幅图像，我们无法确定每个像素对应三维空间中点的坐标。因为从照相机光心到成像平面的连线上的所有三维空间中的点都可以投影到同一像素上。只知道一个像素对应的深度，我们才能精确地确定它在三维空间中对应点的空间位置。在本章中，我们将介绍平行双目照相机的构造和成像原理，以及如何利用平行双目照相机获取场景的深度信息。


    # ### 18.2 平行双目照相机


    平行双目照相机是目前最常见的深度照相机，它由两台水平放置的独立照相机组成，每台照相机都有自己的光心和成像平面。接下来，我们将介绍平行双目照相机的构成及其工作原理，为了简化描述，除非特别说明，本章中所提及的双目照相机都是平行双目照相机。


    # #### 18.2.1 概念定义


    将两台照相机并排排列，且使其光轴互相平行，可以形成一个类似人类双眼视觉的系统，因此这种配置被称为平行双目视觉系统，这两台照相机就被称为平行双目照相机，其所拍摄的两张照片就构成了一组双目图像。主流的平行双目照相机都是水平平行排布的，左右两台照相机分别对应于人类的左眼和右眼，如图
    18-1 所示。当然纵向的双目照相机从原理上也是可以实现的（读者可以想象那种奇怪的形状）。在这种左右双目照相机系统中，两台照相机可


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_282_0.png)'
  merge: -1
