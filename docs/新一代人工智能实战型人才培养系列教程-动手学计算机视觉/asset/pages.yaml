  md: "# 12.6 小结\n\n本章介绍了目标检测的基本原理，详细讲解了深度学习时代最具有代表性的目标检测模型——R-CNN 系列模型及它们的发展脉络，并实现了相应的功能。作为计算机视觉的最重要的基本任务之一，目标检测有着广泛的工业应用场景，如汽车产业的辅助驾驶系统。接下来，我们将介绍图像语义理解中的另一个重要任务——实例分割。\n\
    \n+   ### 习题\n+   \n+   (1) Fast R-CNN 中每幅图像的测试时间并未包含候选区域提取所用的时间。通过实验测试，包含候选区域提取过程比不包含该过程的测试时间增加多少？\n\
    +   \n+   (2) 训练时，将每个锚框输入 RPN 的 head 模块中可以得到两个向量，分别表示该锚框包含目标的置信度和与其匹配的真实包围盒相对于该锚框的坐标偏移量。如果修改\
    \ RPN 的 head 结构，令其对每个锚框直接输出一个更高维度的向量，该向量由原来两个向量的预测信息拼接而成，这么做会增强目标检测的效果吗？通过实验验证。\n\
    +   \n+   (3) 在代码实现里，RPN 生成了 3 种不同尺寸和比例的锚框。如果使用更多尺寸或比例（如 5 种不同的尺寸或者比例）的锚框，目标检测的效果会提高吗？通过实验验证。\n\
    +   \n+   (4) 在 Faster R-CNN 的论文中提到了另外 3 种不同的训练策略，阅读论文并探究它们和 Faster R-CNN 所采用的四步交替训练法的区别，并通过实验观察不同的训练策略对模型测试效果的影响。\n\
