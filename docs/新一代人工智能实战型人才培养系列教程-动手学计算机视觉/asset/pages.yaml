    \ = img.shape\n    out = np.zeros((Hi, Wi))\n    k = np.array([[0,0.5,0],[0,0,0],[0,-0.5,0]])\n\
    \    out = cv2.filter2D(img, -1, k)\n    return out\n\n# 获得两个方向上图像的梯度幅值\nGx =\
