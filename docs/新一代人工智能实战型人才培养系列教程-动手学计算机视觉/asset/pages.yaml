- pgno: 276
  md: "```\n- i_y: y 轴方向的导数图像\n- i_t: 时间方向的导数图像\n\"\"\"\n# 计算 t 方向导数\ni_t = smooth(img2\
    \ - img1, smoothing)\n# 计算 x、y 方向导数\ni_x, i_y = gaussderiv(smooth(np.divide(img1\
    \ + \\\n    img2, 2), smoothing), derivation)\nreturn i_x, i_y, i_t\n```\n\n再根据得到的梯度，分块计算块内的光流。\n\
    \n```\ndef sum_kernel(x, N):\n    \"\"\"\n    计算块和\n    \"\"\"\n    return cv2.filter2D(x,\
    \ -1, np.ones((N, N)))\n\ndef lucas_kanade(img1, img2, N, smoothing=1, derivation=0.4):\n\
    \    \"\"\"\n    Lucas-Kanade 算法\n\n    参数:\n    - img1: 前一帧图像\n    - img2: 后一帧图像\n\
    \    - N: 块大小\n    - smoothing: 高斯模糊的标准差\n    - derivation: 高斯求导的标准差\n\n    返回:\n\
    \    - u: x 轴方向的速度图像\n    - v: y 轴方向的速度图像\n    \"\"\"\n    # 计算图像导数\n    i_x,\
    \ i_y, i_t = calculate_derivatives(img1, img2, smoothing, derivation)\n\n    #\
    \ 计算 i_x_t 和 i_y_t\n    i_x_t = sum_kernel(np.multiply(i_x, i_t), N)\n    i_y_t\
    \ = sum_kernel(np.multiply(i_y, i_t), N)\n\n    # 计算梯度的平方\n    i_x_2 = sum_kernel(np.square(i_x),\
    \ N)\n    i_y_2 = sum_kernel(np.square(i_y), N)\n\n    i_x_y = sum_kernel(np.multiply(i_x,\
    \ i_y), N)\n\n    # 计算平方和\n    D = np.subtract(\n    np.multiply(i_x_2, i_y_2),\n\
    \    np.square(i_x_y)\n    )\n```"
