- pgno: 30
  md: '# ## 2.1 简介


    如今在计算机视觉领域，卷积（convolution）可能是出现得最频繁的术语。这是因为卷积神经网络被广泛地用于解决多种计算机视觉任务，已经成为计算机视觉领域的一种默认工具。但是卷积这个术语并不来自计算机科学领域，而是来自信号处理领域。卷积是信号处理中的一个重要操作，用于计算线性系统对输入信号的输出响应。什么是卷积呢？顾名思义，就是先“卷”，再“积”。用专业术语来说，卷积的输入是两个函数，一个是输入信号函数，另一个是系统函数；卷积操作先将一个函数翻转，然后将其与另一个函数进行滑动叠加，最后得到输出结果，如图
    2-1 所示。在函数连续的情况下，叠加指的是对两个函数的乘积求积分，而在离散情况下是对函数加权求和，为简单起见，统称为叠加。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_30_0.png)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_30_1.png)


    图 2-1 输入信号函数和系统函数的卷积


    那么，卷积这样一个操作有什么意义呢？为什么要先对输入的函数进行翻转呢？信号处理的教材通常会这样解释：卷积的结果不仅和当前输入的信号响应值有关，也和该信号在过去所有时刻的输入响应值有关。这表明卷积不仅考虑当下的情况，也考虑过去时刻的情况，它是一种对相应效果的累积，所以有一个先“卷”再“积”的过程。这么描述仍然很抽象，我们举一个实际生活中的例子。试想你站在一个池塘边，在池塘里扔石子。扔一颗石子，池塘里就会产生水波，然后水波慢慢地衰退，水面重新平静。扔石子就是输入信号，产生的水波就是对输入的响应。那么如果按一定速度不停地往池塘里扔石子呢？在这种情况下，在水面上某处某一时刻的水波的大小如何计算？根据常识，我们知道当前时刻某处的水波大小不但和当前时刻扔的石子产生的水波有关，还和之前所有扔的石子产生的水波有关，是这些水波的累积结果。这便是先“卷”再“积”的过程，“卷”考虑了与当前输入相关的所有输入，而“积”则把这些输入的效果进行叠加。'
  merge: -1
