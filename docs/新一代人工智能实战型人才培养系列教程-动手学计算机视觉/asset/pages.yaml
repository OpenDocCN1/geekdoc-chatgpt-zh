  md: '台照相机间几何配置（特别是它们之间的相对位置和姿态）的约束。这一约束使得我们可以通过寻找左、右图像上像素的对应关系来推断照相机之间的相对位置和姿态，从而恢复场景的三维信息。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_295_0.png)


    # 19.2.2 本质矩阵


    在 19.2.1 节中，我们通过几何直观地理解了对极约束。在本节中，我们将推导对极约束的数学表示。


    定义右照相机光心在左照相机坐标系下的坐标为 \( t \in \mathbb{R}^{3 \times 1} \)，从右照相机坐标系到左照相机坐标系的旋转矩阵为
    \( R \in \mathbb{R}^{3 \times 3} \)，\( x_l \) 和 \( x_r \) 分别为点 \( P \) 在左、右照相机坐标系下的坐标，那么可以得到
    \( x_l \) 和 \( x_r \) 之间的关系：


    ```

    \( x_l = R x_r + t \)

    ```


    展开为


    ```

    \(\begin{bmatrix} x_l \\ y_l \\ z_l \end{bmatrix} = \begin{bmatrix} r_{11} & r_{12}
    & r_{13} \\ r_{21} & r_{22} & r_{23} \\ r_{31} & r_{32} & r_{33} \end{bmatrix}
    \begin{bmatrix} x_r \\ y_r \\ z_r \end{bmatrix} + \begin{bmatrix} t_x \\ t_y \\
    t_z \end{bmatrix}\)

    ```


    接下来考虑极平面上的几何关系。如图 19-7 所示，向量 \( t \)、\( x_l \) 和 \( x_r \) 共面，我们可以用向量 \( t \)
    和 \( x_l \) 的外积来表示极平面的法向量 \( n \)，其与向量 \( t \)、\( x_l \) 和 \( x_r \) 均垂直。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_295_1.png)


    那么我们可以得到一个恒等式：


    ```

    \( x_l^T \cdot (t \times x_l) = 0 \)

    ```


    根据外积的定义可以得到'
