- pgno: 32
  md: '```

    g(i) = f(i) * k(i) = \sum_l f(l)k(i-l)

    ```


    其中，\( l \) 遍历 \( f(i) \) 的定义域。与一维连续卷积不同的是，输入信号和卷积核是离散函数 \( f(i) \) 和 \( k(i) \)（通常可用数组或者向量表示），而积分变成了求和。卷积核的长度一般是奇数，这是为了对称而设计的。通常情况下，输入信号函数
    \( f(i) \) 的长度远远大于卷积核 \( k(i) \) 的长度。图 2-2 是一维离散卷积的计算过程。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_32_0.png)


    图 2-2 一维离散卷积计算


    根据以上定义，可以得出一维离散卷积的计算步骤。


    +   (1) 变换：改变输入信号函数的模坐标，自变量由 \( i \) 变成 \( l \)。

    +   (2) 翻转：将其中一个函数翻转。

    +   (3) 平移：翻转后的函数随变量 \( l \) 平移，得到 \( k(i-l) \)。若 \( l>0 \)，则向右平移，反之向左平移，且 \(
    l \) 为整数。

    +   (4) 相乘：将 \( f(l) \) 和 \( k(i-l) \) 相乘。

    +   (5) 累加：\( f(l) \) 与 \( k(i-l) \) 的乘积的累加值即为在 \( i \) 位置的卷积值。


    由图 2-2 不难得出，对于离散变量，卷积可以理解为“卷和”，即相乘之后累加求和。除此之外，还应该注意输出信号的长度和输入信号、卷积核之间的关系。


    假设输入信号长度为 \( m \)，卷积核大小为 \( n \)，按照图 2-2 所示方法，可以很容易得到输出信号的长度为 \( m-n+1 \)。但这是不是意味着对于一个输入信号反复卷积，它的输出长度将会越来越小？


    实际上，这种情况确实可能存在。因此，为了防止这种情况出现，通常会对输入信号进行零填充（zero-padding）操作。对于输入，会在 “1” 的左边和 “7”
    的右边各添加数字 “0”，如图 2-3 所示，如此一来输入信号的长度便增加了 2，因此对应的输出信号长度也随之增加。零填充操作让输出信号和输入信号的长度能够保持一致，更有甚者，如果对图中输入信号的左右两边各添加两个
    “0”，输出信号的长度则大于输入信号的长度。一般来说，在输入信号一边零填充的个数要小于卷积核的大小。这是因为当 0 的个数超过或等于卷积核的长度时，卷积所得的结果为
    0，相当于对输出信号也进行了零填充操作，这没有意义。更为直观的零填充操作可见二维卷积。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_32_1.png)


    图 2-3 输入信号的零填充'
