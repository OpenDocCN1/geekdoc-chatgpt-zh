    \ 对极误差阈值\n\n    返回:\n    - pts1_filtered, pts2_filtered: 过滤后的匹配点\n    \"\"\"\n\
    \    pts1_reshaped = pts1.T.reshape(-1,1,2)\n    pts2_reshaped = pts2.T.reshape(-1,1,2)\n\
    \n    # 计算两幅图像的极线\n    lines1 = cv2.computeCorrespondEpilines(pts2_reshaped, 2,\
