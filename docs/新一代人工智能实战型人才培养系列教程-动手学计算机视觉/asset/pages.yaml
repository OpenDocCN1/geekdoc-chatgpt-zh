    \ angle, 1.0)\n# 旋转图像\nrotated = cv2.warpAffine(img, rot_mat,\n    img.shape[1::-1],\
    \ flags=cv2.INTER_LINEAR)\nreturn rotated\n```\n\n```\n# 创建一个 200*200 的随机数组，并将其转换为\
    \ float32 类型\nimg_t0 = np.random.rand(200, 200).astype(np.float32)\n# 复制 img_t0\
    \ 的内容到 img_t1\nimg_t1 = img_t0.copy()\n# 将 img_t1 旋转-1°\nimg_t1 = rotate_image(img_t1,\
    \ -1)\n# 可视化\nfig1, (ax_1, ax_2) = plt.subplots(1, 2)\n# 在 ax_1 中显示 img_t0\nax_1.imshow(img_t0)\n\
    ax_1.set_title(\"Frame t0\")\n# 在 ax_2 中显示 img_t1\nax_2.imshow(img_t1)\nax_2.set_title(\"\
    Frame t1\")\n# 显示图像\nplt.show()\n```\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_274_0.png)\n\
    \n接着，我们实现一个高斯滤波器对图像进行模糊处理以降低噪声影响，然后计算图像的梯度。\n\n```\ndef smooth(img, sigma):\n\
    \    \"\"\"\n    高斯模糊函数，返回模糊后的图像\n\n    参数：\n    - img: 输入图像\n    - sigma: 高斯核的标准差\n\
    \    \"\"\"\n    # 创建 x 数组，范围为[-3sigma,3sigma]\n    x = np.array(list(range(math.floor(-3.0\
    \ * sigma + 0.5),\n    math.floor(3.0 * sigma + 0.5) + 1)))\n```"
