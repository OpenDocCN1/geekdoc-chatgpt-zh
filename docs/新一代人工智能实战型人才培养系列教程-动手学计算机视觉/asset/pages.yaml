- pgno: 22
  md: '# 第 1 章


    # 初探计算机视觉


    # 1.1 什么是计算机视觉


    亲爱的读者，欢迎来到计算机视觉的课堂。听到计算机视觉这个术语，你会想到什么？你可能会想到科幻电影中能够自动识别目标的智能机器人，或是火星探测中能够自动漫游的火星车，抑或是已步入我们生活的人脸识别门禁、刷脸支付系统。没错，这些正是计算机视觉所要实现的或是已经实现的技术。


    # 扫码观看视频课程


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_22_0.png)


    人类对计算机视觉的探索源自人类对自身生物视觉的认知以及对人工智能机器人的向往。作为人类，我们能够很容易感知我们周围的三维世界，理解并识别我们接收到的视觉信息。正如图
    1-1 所示，我们人类会以眼睛作为视觉传感器，将场景投影到视网膜上成像，然后以大脑作为分析器，对图像进行分析。通过大脑的分析，我们能够理解场景所表达的内容，知道该场景是傍晚的景色；我们能够识别场景中的目标，如白虎、云等；我们还能感知场景中的三维几何结构，知道各个目标之间的远近关系。注意，所谓视觉，并不只是看的过程，更重要的是分析的过程。得益于我们无与伦比的大脑，人类视觉系统是非常强大的。那么计算机是否也可以拥有和人类一样的视觉系统呢？如图
    1-1 所示，与人类视觉系统类比，计算机视觉系统以摄像机作为视觉传感器，以计算机作为分析器。由于人脑太过复杂，其分析机理并未被研究清楚，所以我们并不要求计算机完全模仿人脑的分析过程，而是把整个计算机视觉系统当成一个黑盒子，要求在同样的输入下，计算机视觉系统与人类视觉系统的输出相同。由于摄像机拍摄得到的通常为图像或者视频，所以计算机视觉的目标就是从图像或者视频中分析出真实世界的属性，如检测识别出场景中的目标或是重建场景的三维结构，分析的结果需要与人类视觉的分析结果一致。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_22_1.png)


    图 1-1 人类视觉系统（上）与计算机视觉系统（下）'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.2 为什么需要计算机视觉


    人类接收到的信息大部分来自视觉。作为视觉信息的载体，图像和视频中蕴含的信息量是巨大的，可以说每幅图像都讲述了一个故事。随着移动终端和互联网的发展，我们能够轻松地获取和访问海量的图像与视频。如果计算机能具有和人类一样的视觉系统，快速地分析理解这些海量图像与视频中的内容，那么无疑会极大地提升我们的生活质量。如今，计算机视觉技术并不再是科幻，而是已经用于我们的生活，开始发挥作用。以下是一些典型的计算机视觉应用。


    +   (1) 人脸检测与识别。人脸检测很早就用于数字照相机中，帮助对焦人脸。人脸识别现在已广泛用于列车旅客进站检票系统。个人计算机和笔记本电脑登录系统等。


    +   (2) 光学字符识别（optical character recognition, OCR）。OCR 技术现在已广泛用于车牌识别（自动快速地确定车辆进出一个场地的时间）和支票识别（通过手机
    APP 扫描支票就可以完成支票金额的存入）。


    +   (3) 全景图像拼接。如今的智能手机上就有全景图像拍摄功能。拿着手机平扫，就可以拍摄出全景图像。


    +   (4) 三维建模。一些手机 APP 已经实现了三维建模功能。拿着手机对目标进行多角度拍摄，就可以重建出目标的三维模型。


    +   (5) 视频会议背景虚化。视频会议软件通常都会提供背景虚化的功能，其中就用到了计算机视觉中的图像分割技术。


    +   (6) 辅助驾驶系统。很多汽车已经搭载了辅助驾驶系统。辅助驾驶系统集成了目标检测、图像分割等计算机视觉技术，实现车道线检测、障碍物检测、测距等功能，提升驾驶的安全性。现在计算机视觉的研究者正努力将辅助驾驶系统提升至自动驾驶系统，实现无人驾驶汽车。


    +   (7) 辅助医学影像诊断。医学影像，如 X 光、超声波、计算机断层扫描（computer tomography, CT）、磁共振成像（magnetic
    resonance imaging, MRI）等，能帮助医生以无创的方式诊断患者的病况。如今的辅助医学影像诊断系统已集成了不少计算机视觉技术（如语义分割），实现病变区域检测、病情预测等功能，减轻医生的工作负荷。


    # 1.3 计算机视觉的难点与挑战


    尽管计算机视觉已经在一些特定场合实现了落地应用，但是通用场合下的计算机视觉仍然是尚未解决的难题。我们对通用计算机视觉的要求，即在同样的输入下计算机视觉系统的输出和人类视觉系统的输出一致，看上去似乎并不高，这是因为人类对于自身对视觉信息的分析能力已经习以为常。但是我们要强调的是，实现通用计算机视觉是非常困难的，这主要是因为计算机视觉面临语义鸿沟（semantic
    gap）。同样一幅图像，我们人类看到的是具有语义的内容。以图 1-2 为例，我们可以很容易分割出图像中的主体目标，知道这是一只骆驼，它的身体被一'
  merge: -1
  img_proc: true
- pgno: 24
  md: '堆杂草遮住了部分；而对于计算机，它“看到”的只是一个没有什么意义的数字矩阵（图像在计算机中以数字形式存储），这个数字字矩阵和我们看到的语义信息之间的关联显然是不直接的，它们之间存在着巨大的鸿沟，这就是语义鸿沟。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_24_0.png)


    | 254 | 152 | 154 | 56 | 72 | 78 | 96 | 98 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 120 | 187 | 192 | 143 | 176 | 113 | 131 | 127 |

    | 162 | 172 | 196 | 124 | 175 | 123 | 122 | 116 |

    | 223 | 198 | 230 | 162 | 159 | 92 | 27 | 85 |

    | 83 | 77 | 73 | 140 | 144 | 201 | 240 | 159 |

    | 165 | 82 | 76 | 45 | 18 | 64 | 165 | 57 |

    | 52 | 58 | 90 | 70 | 68 | 89 | 201 | 78 |

    | 79 | 16 | 37 | 135 | 173 | 126 | 136 | 157 |


    图 1-2 语义鸿沟示例


    要实现计算机视觉，就需要缩小这个语义鸿沟，但受很多因素影响，这个任务变得非常具有挑战性。图 1-3 列出了其中一些挑战性因素。


    +   (1) 光照变化：光照变化会改变目标成像后的表象（appearance），增加目标识别的难度。

    +   (2) 视角变化：视角变化也会改变目标成像后的表象，增加目标识别的难度。

    +   (3) 尺度变化：人类视觉能自适应地捕捉多尺度的目标，而计算机往往只能通过多尺度搜索来发现不同尺度的目标。

    +   (4) 类内变化：同一类的目标可能表象存在很大不同，如图 1-3 所示的两把椅子。人类可以通过知识进行推理，知道这两个物体都是椅子，但这对计算机来说太难了。

    +   (5) 杂乱背景：杂乱背景的干扰会导致前景目标难以被分割出来，尤其是在前景和背景纹理相似的情况下。

    +   (6) 遮挡：遮挡会使目标部分缺失，从而增加目标识别的难度。人类视觉会自动地通过“脑补”补全缺失的部分，而计算机很难实现“脑补”。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_24_1.png)


    图 1-3 影响计算机视觉的挑战性因素'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1.4 计算机视觉的历史与发展


    图 1-4 展示了计算机视觉发展史上的里程碑。图的上半部分是计算机视觉的理论与方法的发展历程。由于计算机视觉系统处理的是视觉信息，也就是图像，所以计算机视觉的发展离不开数字图像数据的支撑，图
    1-4 的下半部分就展示了图像数据的发展。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_25_0.png)


    图 1-4 计算机视觉发展史


    1959 年，神经生理学家 David Hubel 和 Torsten Wiesel 通过猫的视觉实验，发现生物的视觉系统是从简单到复杂逐步整合信息的。他们因为这一研究成果获得了
