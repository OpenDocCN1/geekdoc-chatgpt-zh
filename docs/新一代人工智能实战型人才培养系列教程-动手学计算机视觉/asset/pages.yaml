  md: "接下来计算两幅图像间的对应关系，查询并匹配两者之间的特征。\n\n```\ndef get_matches(des_query, des_train):\n\
    \    \"\"\"\n    匹配相关图像特征\n\n    参数：\n    - des_query: (np.ndarray): 查询描述子\n \
    \   - des_train: (np.ndarray): 训练描述子\n\n    返回：\n    - goods: (list): 匹配结果\n \
    \   \"\"\"\n    # 创建匹配器\n    bf = cv2.BFMatcher(cv2.NORM_L2)\n    # 获取匹配结果\n \
    \   matches = bf.knnMatch(des_query, des_train, k=2)\n    # 创建 goods 列表用于存储有用的匹配结果\n\
    \    goods = []\n    # 遍历所有匹配结果\n    for m, n in matches:\n        # 设置阈值为 0.65，保留更多的特征\n\
    \        if m.distance < 0.65 * m.distance:\n            goods.append(m)\n   \
    \ return goods\n```\n\n```\ndef get_match_point(p, p_, matches):\n    \"\"\"\n\
    \    寻找匹配的关键点\n\n    参数：\n    - p: (list[cv2.KeyPoint]): 查询关键点\n    - p_: (list[cv2.KeyPoint]):\
    \ 训练关键点\n    - matches: (list[cv2.DMatch]): 匹配信息\n\n    返回：\n    - points_query:\
    \ (np.ndarray): 查询关键点\n    - points_train: (np.ndarray): 训练关键点\n    \"\"\"\n \
    \   # 从查询关键点中找到匹配的关键点\n    points_query = np.asarray([p[m.queryIdx].pt for m in\
