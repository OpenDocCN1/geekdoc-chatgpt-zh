  md: '常样本的匹配特征点对应具有一致的几何变换关系，而作为异常样本的误匹配特征点对，它们之间各有各的不同。对于不同的图像变换，s 大小不同。对于平移变换，s
    = 1，因为只需要一对匹配点对就可以确定平移变换的参数；而对于射影变换，s = 4，大家想为什么？


    图 8-8 展示了使用 RANSAC 算法拟合平移变换的一次实验。在图 8-8 (a) 中，首先选择蓝色箭头代表的平移拟合模型，那么该平移模型的内群点（蓝色箭头）个数为
    4，而与之不一致的离群点（黄色箭头与红色箭头）个数为 3。在下一次尝试中 [如图 8-8 (b) 所示]，再随机选择数据（黄色箭头）拟合对应的模型，并统计内群点的个数（只有一个）。最终，会选择内群点最多的模型（在图
    8-8 中为蓝色箭头对应的特征点对）作为最终拟合的结果。而那些匹配错误的特征点对（如红色箭头对应的特征点对）则没有被用到，即这些异常样本被“去除”。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_121_0.png)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_121_1.png)


    图 8-8 利用 RANSAC 算法去除匹配异常的特征点对（另见彩插图 7）


    需要说明的是，RANSAC 算法不能保证得到最优解，因为它只在一定的概率下去逼近最优解。不过，随着迭代次数的增加，逼近最优解的概率会增加。


    # 8.3.3 图像变换与缝合


    图像拼接的最后一步是将输入图像变换并缝合到一幅图像中。对于两幅图像 A 和 B，在已经检测出对应的特征点对，并利用 RANSAC 算法计算得到变换矩阵 T
    之后，将图像 B 转换为 TB。然后，对转换后的图像，即 TB，与图像 A 在重叠部分的像素值求平均值，以优化图像缝合的边界。如此，便可得到最终缝合好的拼接图像。


    综上所述，我们把图像拼接的全过程总结为以下 4 步：


    +   (1) 计算两幅图像的特征点；


    +   (2) 将两幅图像的特征点进行匹配；


    +   (3) 根据匹配的特征点对，利用 RANSAC 算法计算图像变换矩阵；


    +   (4) 将图像进行拼接。


