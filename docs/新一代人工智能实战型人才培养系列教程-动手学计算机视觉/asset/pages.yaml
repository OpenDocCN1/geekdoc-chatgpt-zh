- pgno: 142
  md: '# ## 10.2 数据集和度量


    在图像分类任务中，我们通常会选择以下几种数据集进行模型的训练与测试。


    +   (1) MNIST[9]: MNIST 是一个手写数字的数据集，每个样本都是一幅黑白图像，对应的标签为数字 0～9 中的一个。它包含了 60000
    幅训练图像和 10000 幅测试图像。


    +   (2) Caltech-101[10]: Caltech-101 由李飞飞等于 2003 年发布。该数据集包含 102 个类别（101 个目标类别和
    1 个背景类别），9144 幅图像用于训练和测试。


    +   (3) CIFAR-10[11]: CIFAR-10 是由 Geoffrey Hinton 和他的学生 Alex Krizhevsky、Ilya Sutskever
    整理的一个用于识别常见类别的小型数据集，它包含 10 个类别，50000 幅训练图像和 10000 幅测试图像。


    +   (4) ImageNet[12]: ImageNet 是一个大规模图像识别数据集，由李飞飞团队从 2007 年开始通过各种方式收集而成。ImageNet
    数据集包含了 2 万多个类别，超过 1400 万幅图像。


    本章使用 Caltech-101 作为实验的数据集，随机选择 60% 的数据作为训练样本，在剩下的数据中，随机选择 50% 作为验证样本、另外 50% 作为测试样本。


    在图像分类中，通常以 top-k 错误率作为模型的度量指标之一。对于 n 幅测试图像样本，若模型预测的前 k 个类别中包含真实类别的测试图像的数量为 m，则该模型的
    top-k 错误率定义为


    top-k 错误率=\left(1-\frac{m}{n}\right)\times100\%


    我们在本章使用 top-1 错误率作为度量指标。


    # ## 10.3 基于视觉词袋模型的图像分类算法


    视觉词袋模型是一种提取图像表征的方法，它可大致分为以下 4 步：


    +   (1) 从训练图像集中提取特征，形成特征库；


    +   (2) 对特征库中的特征向量进行聚类，构建“视觉词典”；


    +   (3) 用所学到的视觉词典对每幅图像的特征进行编码；


    +   (4) 基于特征编码对图像进行表征。


    具体地，首先，从给定的训练图像中提取特征，通常，可以提取图像的 SIFT 特征。根据在第 7 章中所学的内容，每个 SIFT 特征描述符是一个 128 维的向量。将从训练图像集提取的所有
    SIFT 特征收集到一起，形成一个图像特征库。然后，通过聚类（如 k 均值聚类）将这些图像特征聚成 k 个聚类中心，这些聚类中心被称为“视觉单词”，所有视觉单词构成的集合即为视觉词典。在图
    10-3 所示的视觉词典中，每一小块表示一个视觉单词。'
