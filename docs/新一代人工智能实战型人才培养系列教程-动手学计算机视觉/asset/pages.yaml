    # 13.3.2 感兴趣区域对齐


    在 ROI 池化层中，为了得到固定空间分辨率的 ROI 特征图（如 7 像素×7 像素）并将其送给后续的预测分支，需要将每个 ROI 的包围盒顶点坐标取整。在将该
    ROI 切分为 7×7 共 49 个子窗口的过程中也需要将每个子窗口的坐标取整，如图 13-5 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_220_0.png)


    图 13-5 ROI 池化过程中存在的取整现象


    在上述过程中，之所以需要取整，是因为将原始图像的候选区域映射到图像特征图中对应的 ROI 后，ROI 顶点坐标可能是非整数，每一个子窗口的坐标也可能是非整数，而提取的特征图上每个位置坐标为整数。因此，通常需要将浮点数坐标取整到最近的整数坐标。但既然是近似，就会引入误差，从而影响检测算法的性能。为了解决这个问题，ROI
    对齐不再使用取整来处理非整数坐标，而是直接使用这些坐标，如图 13-6 所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_220_1.png)


    图 13-6 ROI 对齐中利用双线性插值法计算每个子窗口中 4 个非整数坐标处的特征值'
