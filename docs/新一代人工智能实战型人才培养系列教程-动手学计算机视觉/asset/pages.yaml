    \ \\( I_y \\)；接着，我们可以计算图像中每个像素梯度的大小（边缘强度）\\( E_s(i,j|I) = \\|\\nabla I(i,j)\\\
    | = \\sqrt{I_x^2(i,j) + I_y^2(i,j)}\\)，其中梯度方向是 \\(\\tan^{-1}\\left(\\frac{I_y(i,j)}{I_x(i,j)}\\\
    right)\\)，即垂直于边缘的方向，如图 5-3 所示。\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_73_0.png)\n\
    \n图 5-3 梯度的方向\n\n```\n# 求沿 x 轴方向的梯度幅值\ndef partial_x(img):\n    # 获得图像的大小\n  \
