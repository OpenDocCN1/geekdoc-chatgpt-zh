  md: '![](img/0e497601c0ca26be98c5399cbd72eb4c_86_0.png)


    # 图 6-4 矩阵与特征值的关系


    # 6.2.2 计算角点响应函数


    如前所述，角点附近的像素值变化量 \( E(u,v)\) 对于任意的微小位移 \( (u,v)\) 都很大。也就是说，如果一个点是角点，那么它对应的像素值变化量
    \( E(u,v)\) 的极小值也很大。那么 \( E(u,v)\) 的极小值如何求解呢？ 6.2.1 节中已经将 \( E(u,v)\) 表示为两个特征值
    \( \lambda_1, \lambda_2\) 的函数，又知 \( [m \ n] = [u \ v]R\)，则有


    ```

    m^2 + n^2 = [m \ n] \begin{bmatrix} m \\ n \end{bmatrix} = [u \ v] R R^T \begin{bmatrix}
    u \\ v \end{bmatrix} = u^2 + v^2

    ```


    这里，假设微小位移 \( (u,v)\) 近似于单位向量，即 \( u^2 + v^2 \approx 1\)，则有 \( m^2 + n^2 \approx
    1\)，易得 \( E(u,v)\) 的极大值和极小值分别为


    ```

    \max_{u,v} E(u,v) = \max(\lambda_1, \lambda_2) \\ \min_{u,v} E(u,v) = \min(\lambda_1,
    \lambda_2)

    ```


    如图 6-4 所示，因为角点对应的像素值变化量 \( E(u,v)\) 的极小值很大，所以角点对应的两个特征值 \( \lambda_1, \lambda_2\)
    都应该比较大。对于边缘和平坦区域，同样也可以依据两个特征值 \( \lambda_1, \lambda_2\) 的大小来确定。两个特征值与图像区域的关系如图
    6-5 所示，总结如下。


    +   (1) 两个特征值都小，且近似相等，说明椭圆的两个半轴很长且长短近似；对应图像中的平坦区域。


    +   (2) 一个特征值大，另一个特征值小，且二者相差较大，说明椭圆的两个半轴一长一短且相差较大；对应图像中的边缘。


    +   (3) 两个特征值都大，且近似相等，说明椭圆的两个半轴很短且长短近似；对应图像中的角点。


    虽然通过两个特征值 \( \lambda_1, \lambda_2\) 的大小可以定性得到角点的性质，但是我们总是希望能够通过一个单一的度量指标，即角点响应函数，来确定哪些点是角点。根据经验，定义角点响应函数为


    ```

    \rho = \lambda_1 \lambda_2 - \alpha(\lambda_1 + \lambda_2)^2

    ```


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_86_1.png)


    # 图 6-5 两个特征值与图像区域的关系'
