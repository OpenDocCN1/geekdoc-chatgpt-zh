  md: '# # 第 15 章 动作识别


    # ## 15.1 简介


    在之前的章节中，读者已经学习了针对图像的“十八般武艺”，能够检测目标、分割物体甚至估计人体姿态。但是在真实世界中，万事万物都是运动的，因此需要掌握对视频流的“武技”。在本章中，我们将尝试理解这个运动的世界，具体来说，我们将介绍人体动作识别（human
    action recognition）。


    人体动作识别，顾名思义，是指识别视频中人类的动作，从而可以推断人物的意图和状态，为视频内容的理解提供重要信息。例如，在视频监控领域，人体动作识别可用于检测犯罪和安全事件；在体育赛事领域，人体动作识别可以用来分析运动员的技术和战术；在娱乐和广告领域，人体动作识别可以用来分析观众的反应和参与度。需要注意的是，这里讨论的是狭义的动作识别，即将动作识别理解成一个视频分类任务，如图
    15-1 所示，而广义的动作识别则包含更细粒度的识别任务，如从视频中检测出某种动作对应的几帧。


    用数学语言描述狭义的人体动作识别任务就是：预定义 $K$ 个动作标签 $\mathcal{L} = \{l_1, l_2, \cdots, l_K\}$，定义视频序列空间
    $\mathbb{S}$，给定数据集 $\mathcal{D} = \{(S^{(n)}, l^{(n)})\}_{n=1}^N$，其中 $S^{(n)}
    \in \mathbb{S}$ 是数据集中的第 $n$ 个视频序列，$l^{(n)}$ 是这个视频序列对应的动作标签。$S^{(n)}$ 通常可以表示为一个高阶张量，如果视频的图像是灰度图像，那么它是一个三阶张量，如果视频的图像是彩色图像，则是四阶张量。人体动作识别任务是从
    $\mathcal{D}$ 中学习得到一个从视频序列空间到人体动作标签空间的映射 $f$，从而给定任意一段测试视频序列 $S$，可以用学习得到的映射函数 $f$
    预测其标签：$\hat{l} = f(S)$。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_239_0.png)


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_239_1.png)


    图 15-1 动作识别可以当作对视频序列的分类任务'
