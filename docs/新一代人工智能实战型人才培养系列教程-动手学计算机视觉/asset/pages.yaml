  md: '# 19.2.4 通过本质矩阵求解照相机位姿


    在 19.2.3 节中，我们已经通过八点法解出了基础矩阵 \( F \)。接下来，我们将通过基础矩阵 \( F \) 求解本质矩阵 \( E \)，并进一步求解照相机的位姿。在
    19.2.3 节已介绍过，\( E \) 具有固定的表达形式 \( E = T_x R \)，其中 \( T_x \) 是一个反对称矩阵，代表了照相机的平移向量，\(
    R \) 是一个正交矩阵，代表了照相机的旋转矩阵。由于 \( T_x \) 和 \( R \) 具有特定的性质，我们可以利用奇异值分解（SVD）将它们从 \(
    E \) 中分离出来。设 \( E \) 的 SVD 形式为 \( E = U \Sigma V^\top \)，其中 \( U \) 和 \( V \)
    是正交矩阵，\( \Sigma \) 是奇异值矩阵，有


    \( E = \begin{bmatrix} u_{11} & u_{12} & u_{13} \\ u_{21} & u_{22} & u_{23} \\
    u_{31} & u_{32} & u_{33} \end{bmatrix} \begin{bmatrix} \sigma_1 & 0 & 0 \\ 0 &
    \sigma_2 & 0 \\ 0 & 0 & \sigma_3 \end{bmatrix} \begin{bmatrix} v_{11} & v_{12}
    & v_{13} \\ v_{21} & v_{22} & v_{23} \\ v_{31} & v_{32} & v_{33} \end{bmatrix}^\top
    \)


    根据 \( E = T_x R \) 和 \( E = U \Sigma V^\top \)，我们可以解出符合条件的 \( R \) 和 \( t \)：


    \(\left\{\begin{array}{l} R = (\det UWV^\top) UWV^\top \quad t = u_3 \\ R = (\det
    UWV^\top) UWV^\top \quad t = -u_3 \\ R = (\det UW^\top V^\top) UW^\top V^\top
    \quad t = u_3 \\ R = (\det UW^\top V^\top) UW^\top V^\top \quad t = -u_3 \end{array}\right.\)


    上式中，\( u_3 \) 代表 \( U \) 的第三列；\( W \) 是一个辅助矩阵，具体为


    \( W = \begin{bmatrix} 0 & -1 & 0 \\ 1 & 0 & 0 \\ 0 & 0 & 1 \end{bmatrix} \)


    不难发现，数学上存在的 4 个解代表着两台照相机与空间点之间存在的 4 种相对位姿关系，如图 19-8 所示。按照针孔照相机的定义，任何能够被照相机观测到的点（即在照相机前方的点）的
    \( z \) 轴坐标均为正。因此，我们需要在这 4 种 \( R \) 和 \( t \) 的组合下分别计算三维空间中任意一点的深度（按照 19.3 节中介绍的三角测量方法计算深度）。若计算出该点在两个照相机坐标系下的深度均为正值，则对应的
    \( R \) 和 \( t \) 的组合就是正确的两台照相机之间的相对位姿。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_298_0.png)


    图 19-8 4 个解各自所代表的三维空间点与左、右照相机的相对位姿


