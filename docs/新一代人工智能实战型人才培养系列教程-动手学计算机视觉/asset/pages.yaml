- pgno: 44
  md: "# 3.2.2 高斯噪声\n\n高斯噪声（Gaussian noise）是指概率密度函数服从高斯分布（正态分布）的噪声。晚上拍照的时候，常常会发现拍摄的图像和白天光照条件良好时相比有点模糊，这种模糊就是高斯噪声造成的。高斯噪声的产生通常是因为在拍摄时亮度不够、图像传感器中电路各元器件自身的噪声和相互影响，或图像传感器长期工作温度过高等。下面，我们编程实现高斯噪声。先按照二维高斯分布随机生成噪声样本，然后将其添加到图像中。\n\
    \n```\ndef add_Gaussian(img, sigma=20, mean=0):\n    lab = cv2.cvtColor(img, cv2.COLOR_BGR2Lab)\n\
    \    # 生成高斯噪声\n    noise = np.random.normal(mean, sigma, lab[:, :, 0].shape)\n\
    \    lab = lab.astype(float)\n    # 添加高斯噪声\n    lab[:, :, 0] = lab[:, :, 0] +\
    \ noise\n    lab[:, :, 0] = np.clip(lab[:, :, 0], 0, 255)\n    lab = lab.astype(np.uint8)\n\
    \    noise_img = cv2.cvtColor(lab, cv2.COLOR_Lab2BGR)\n    return noise_img\n\n\
    # 添加高斯噪声的图像\nimg_gaussian = add_Gaussian(img)\nplt.imshow(img_gaussian[:, :, ::-1])\n\
    plt.axis('off')\nplt.show()\n```\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_44_0.png)\n\
    \n实际上，椒盐噪声和高斯噪声随时随地会出现在我们的生活中。图像的美颜处理中，人脸“祛痘”、人脸“磨皮”等等就是通过滤波去除椒盐噪声和高斯噪声。接下来，我们将从实际的例子出发，介绍几种不同的滤波技术。\n\
    \n# 3.3 均值滤波\n\n大家拍艺术照通常会要求对照片进行精修，其中对人脸进行“磨皮”是精修中常用的操作。"
