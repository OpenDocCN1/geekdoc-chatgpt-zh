  md: '上式可以简写为


    $A x_r = b$


    这是一个超定非齐次线性方程组，可以通过伪逆矩阵来表示其最小二乘解：


    $A^T A x_r = A^T b$

    $x_r = (A^T A)^{-1} A^T b$


    最后的 $(A^T A)^{-1} A^T b$ 即为所求的 $(x_r, y_r, z_r)$，即指定像素对应的三维空间点在右照相机坐标系中的坐标，再根据相对位姿就可以计算其在左照相机坐标系中的坐标。考虑到特征点匹配中可能存在很多误匹配，我们需要借助对极约束来进一步过滤错误匹配。怎么借助对极约束呢？给定一个已计算好的基础矩阵、两个图像（左图像和右图像）和一个左图像上的像素点坐标
    $[u_l, v_l]$，根据对极约束的定义可以得到


    $[u_l, v_l, 1] \begin{bmatrix} f_{11} & f_{12} & f_{13} \\ f_{21} & f_{22} & f_{23}
    \\ f_{31} & f_{32} & f_{33} \end{bmatrix} \begin{bmatrix} u_r \\ v_r \\ 1 \end{bmatrix}
    = 0$


    其中，$[u_r, v_r]$ 为右图像上对应像素点的坐标（未知）。将等式展开就可以得到


    $(f_{11}u_l + f_{21}v_l + f_{31})u_r + (f_{12}u_l + f_{22}v_l + f_{32})v_r + (f_{13}u_l
    + f_{23}v_l + f_{33}) = 0$


    可以简写为


    $a''u_r + b''v_r + c'' = 0$


    到这里就得到了左图像上像素点在右图像上对应的极线表达式。同理我们可以得到右图像上像素点在左图像上对应的极线表达式。根据对极约束，左图像和右图像上匹配点都应该落在各自对应的极线上，即匹配点到对应极线的距离应该为
    0。设置一个合适的距离阈值，就可以筛选出符合对极约束的高质量匹配点。使用这些经过筛选的匹配点进行三角测量，可以得到更准确的三维重建结果。此外，三角测量还有非线性法，核心思想是找到空间中一点
    $P''$，使得其在左右两照相机上的投影点与目前已知的像素点的距离（重投影误差）最小，这里不再详细介绍。


