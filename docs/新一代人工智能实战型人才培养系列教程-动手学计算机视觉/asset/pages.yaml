- pgno: 100
  md: '# 7.2.4 特征点描述


    本书为每个特征点建立一个描述符，即用一组向量表示这个特征点。这个描述符需要满足：（1）描述符具有独特性，即相似的特征点具有相似的描述符，不相似的特征点具有不同的描述符，从而可以基于描述符对不同图像中的特征点进行匹配；（2）描述符不随各种变化（如光照变化、视角变化等）而改变，从而保证匹配不受这些变化的影响。


    为了生成描述符，对于每个特征点，以该点为中心，以半径 \( r = \frac{3\sigma\sqrt{2}(d+1)}{2} \) 作圆，确定该圆的外接正方形区域，并将该区域划分成
    \( d \times d \) 个子区域。根据经验，\( d = 4 \)。如图 7-13 所示，在每个子区域内对 8 个方向（东、西、南、北、东南、东北、西南、西北）上的图像梯度幅值做直方图统计。梯度幅值可以经过高斯加权，也可以不加权。这样，每个子区域可以用长度为
    8 的直方图向量表示。最后由 16 个子区域的向量连接构成的长度为 128 维的向量就是该特征点的描述符，也称为 SIFT 特征向量。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_100_0.png)


    图 7-13 SIFT 特征向量的构建


    然而，上述操作得到的 SIFT 特征向量并不具有旋转不变性，因此，在进行梯度幅值计算之前需要将每个特征点所在的块状区域的横轴方向旋转到主方向上（如图 7-14
    所示）。这种旋转并不会改变特征点的相邻像素，也不会改变邻域内像素梯度的幅值，它只改变了每个像素的梯度方向。为什么通过将块状区域的横轴方向旋转到主方向便可以实现特征向量的旋转不变性？这是因为，对特征点进行特征描述时，需要利用横、纵轴方向进行梯度方向的确定。如果该方向和图像本身相关，那么当图像旋转时，该坐标轴也会随之而旋转，得到的描述符也就不同。当该方向仅依赖块状区域的主方向时，无论对图像进行多大角度的旋转，计算的特征描述符都不会改变。换言之，依赖的坐标系并不是绝对的，而是相对的。'
