    \ T=None):\n    \"\"\"\n    对点集进行归一化\n    \"\"\"\n    # 如果 T 参数为空\n    if T is\
    \ None:\n        # 求点集的平均值\n        u = np.mean(pts, 0)\n        # 求点集中每个点与原点之间的距离之和\n\
    \        d = np.sum(np.sqrt(np.sum(np.power(pts, 2), 1)))\n        # 计算归一化矩阵\n\
    \        T = np.array([\n            [np.sqrt(2) / d, 0, -(np.sqrt(2) / d * u[0])],\n\
