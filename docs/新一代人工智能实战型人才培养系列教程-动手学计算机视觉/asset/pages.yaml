  md: '```

    \begin{bmatrix} i'' \\ j'' \\ 1 \end{bmatrix} = \begin{bmatrix} 1 & 0 & t_x \\
    0 & 1 & t_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} i \\ j \\ 1 \end{bmatrix}

    ```


    同样，对于旋转、缩放，也可以依次表示为


    ```

    旋转：

    \begin{bmatrix} i'' \\ j'' \\ 1 \end{bmatrix} = \begin{bmatrix} \cos \theta &
    -\sin \theta & 0 \\ \sin \theta & \cos \theta & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix}
    i \\ j \\ 1 \end{bmatrix}


    缩放：

    \begin{bmatrix} i'' \\ j'' \\ 1 \end{bmatrix} = \begin{bmatrix} s_x & 0 & 0 \\
    0 & s_y & 0 \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} i \\ j \\ 1 \end{bmatrix}

    ```


    至此，在齐次坐标系下，上述的图像变换操作都可以用一个 3x3 的矩阵 T 来表示。可以看到，平移、旋转与缩放操作对应的矩阵 T 的最后一行都是[0 0 1]。我们把变换矩阵形如
    \( T = \begin{bmatrix} a & b & c \\ d & e & f \\ 0 & 0 & 1 \end{bmatrix} \) 对应的图像变换称为仿射变换（affine
    transformation）。那么，变换矩阵 T 的最后一行不是[0 0 1]，而是任意的[g h 1]，图像会发生什么样的变化呢？


    可以通过实验得到类似图 8-4 的结果，很明显，在 T 的最后一行不是[0 0 1]时，图像发生了一些变形，原本平行的图像边框不再平行，我们把变换矩阵形如
    \( T = \begin{bmatrix} a & b & c \\ d & e & f \\ g & h & 1 \end{bmatrix} \) 的图像变换操作称作射影变换（projective
    transformation），这样的变换矩阵 T 称为单应性矩阵（homography matrix）。在 3x3 的矩阵中，单应性矩阵的形式是最通用的，所以射影变换包含了上述所有图像变换。在不同视角下拍摄平面目标和固定照相机位置并旋转照相机角度，以这两种方式拍摄得到的图像都满足射影变换。通常对同一场景拍摄多幅图像的情况可以近似为上述两种情况，所以可以通过射影变换来实现全景图的拼接。


