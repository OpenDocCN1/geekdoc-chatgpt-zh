- pgno: 250
  md: '点 \( P \) 在世界坐标系中的坐标为 \( \boldsymbol{p}_w : (x_w, y_w, z_w) \)，它的齐次坐标形式为 \(
    \tilde{\boldsymbol{p}}_w : (x_w, y_w, z_w, 1) \)；点 \( P \) 在照相机坐标系中的坐标为 \( \boldsymbol{p}_c
    : (x_c, y_c, z_c) \)，它的齐次坐标形式为 \( \tilde{\boldsymbol{p}}_c : (x_c, y_c, z_c, 1)
    \)，它们的转换关系可以通过两个坐标系之间的旋转和平移关系来描述。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_250_0.png)


    图 16-2 照相机投影意义


    给定照相机的光心 \( O \) 在世界坐标系中的坐标 \( \boldsymbol{o} \)，以及世界坐标系到照相机坐标系的旋转矩阵：


    ```

    \[

    R = \begin{bmatrix} r_{11} & r_{12} & r_{13} \\ r_{21} & r_{22} & r_{23} \\ r_{31}
    & r_{32} & r_{33} \end{bmatrix}, R \in R^{3 \times 3}

    \]

    ```


    对于空间中任意一点 \( P \)，有


    ```

    \[

    \boldsymbol{p}_c^T = R(\boldsymbol{p}_w - \boldsymbol{o})^T = R\boldsymbol{p}_w^T
    - R\boldsymbol{o}^T

    \]

    ```


    将 \( -R\boldsymbol{o}^T \) 记为 \( t \)：


    ```

    \[

    t = -R\boldsymbol{o}^T = \begin{bmatrix} t_1 \\ t_2 \\ t_3 \end{bmatrix}, t \in
    R^{3 \times 1}

    \]

    ```


    齐次形式为


    ```

    \[

    \tilde{\boldsymbol{p}}_c^T = \begin{bmatrix} R & t \\ \boldsymbol{0}^T & 1 \end{bmatrix}
    \tilde{\boldsymbol{p}}_w^T

    \]

    ```


    上式中 \( \boldsymbol{0}^T \) 代表一个 1x3 的行零向量。这样我们就得到了世界坐标系到照相机坐标系的变换矩阵 \( [R|t] \)，通常称为照相机外参（camera
    extrinsics）矩阵。


    # 16.2.4 照相机内参


    照相机的外参矩阵描述了世界坐标系与照相机坐标系之间的坐标变换，已知照相机的外参矩阵可以将真实三维空间中的一点在世界坐标系中的坐标变换为照相机坐标系中的坐标。接下来需要计算该点在照相机坐标系中的坐标与其在成像平面上投影点在图像坐标系中的坐标的转换关系。不妨沿用之前的定义，在照相机坐标系中该点坐标为
    \( \boldsymbol{p}_c : (x_c, y_c, z_c) \)，在成像平面上投影点为 \( P'' \)。我们认为成像平面与照相机坐标系的
    z 轴垂直，且成像平面位于 z 轴的负方向。那么照相机坐标系 z 轴与成像平面的交点即为光心 \( O \) 在成像平面上的投影点 \( O'' \)，x
    轴与 y 轴分别与成像平面的水平轴（x 轴）和垂直轴（y 轴）平行。设 \( P'' \) 在照相机坐标系中坐标为 \( (x_i, y_i, -f) \)，'
