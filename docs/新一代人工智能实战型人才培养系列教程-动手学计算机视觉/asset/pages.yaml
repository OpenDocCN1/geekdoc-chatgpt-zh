- pgno: 251
  md: '其中 $f$ 是照相机的有效焦距。如图 16-2 所示，$P$ 点经由 $O$ 点投影到 $P''$ 点，因此根据相似三角形我们可以得到


    \(\frac{z_c}{f} = -\frac{x_c}{x_i} = -\frac{y_c}{y_i}\)


    从而不难得到


    \(\begin{cases} x_i = -f \frac{x_c}{z_c} \\ y_i = -f \frac{y_c}{z_c} \end{cases}\)


    式中负号表示成的像是倒立的。真实的成像平面如图 16-3 (a) 所示，为了简化模型，我们可以把成像平面对称到照相机前方，和三维空间点一起放在照相机坐标系的同一侧，如图
    16-3 (b) 所示。实际上在日常生活中，我们看到的像都是正的，因为照相机在实际输出过程中中已经自动纠正了倒像，因此这样做不仅可以把公式中的负号去掉，使公式更加简洁，也更加贴近日常生活中的观测。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_251_0.png)


    去掉负号后，上式的矩阵形式为


    \(\begin{bmatrix} z_c x_i \\ z_c y_i \\ z_c \end{bmatrix} = \begin{bmatrix} f
    & 0 & 0 & 0 \\ 0 & f & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix} \begin{bmatrix} x_c
    \\ y_c \\ z_c \\ 1 \end{bmatrix}\)


    对于成像平面上的点，其在照相机坐标系下的 $z$ 轴坐标均相同，因此我们可以只用 $x$ 轴坐标和 $y$ 轴坐标来描述其空间位置。又因为成像平面垂直于光轴，光心
    $O$ 在成像平面的投影为 $O''$，所以点 $P''$ 在照相机坐标系下的 $x$ 和 $y$ 轴坐标 $(x_i, y_i)$ 可以认为是在成像平面上以
    $O''$ 为原点构建的。而图像坐标系，如图 16-4 所示，其原点在成像平面的左上角，因此需要对坐标 $(x_i, y_i)$ 进行平移变换，使 $O''$
    与图像坐标系原点重合。另外，坐标 $(x_i, y_i)$ 的单位是 m，而图像坐标系以像素为单位，因此还需要尺度因子来描述单个像素对应的实际物理长度。又由于照相机的像素在水平和垂直方向上的尺度因子可能不同，因此我们需要两个不同的尺度因子来描述这个尺度变换。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_251_1.png)


    这里，我们设图像坐标系在 $u$ 轴（水平轴）上的尺度因子为 $\alpha$，在 $v$ 轴（垂直轴）上的尺度'
  merge: -1
  img_proc: true
- pgno: 252
  md: '因子为β，同时，$O''$相对于图像坐标系原点的位移为 $(c_x,c_y)$。那么，$P''$ 在照相机坐标系中的坐标与其在图像坐标系中的坐标 $(u,v)$
    的关系为


    ```

    \(\begin{cases} u=\alpha \times f \frac{x_c}{z_c}+c_x \\ v=\beta \times f \frac{y_c}{z_c}+c_y
    \end{cases}\)

    ```


    将上式中的 \(\alpha \times f\) 合并为 \(f_x\)，\(\beta \times f\) 合并为 \(f_y\)，就可以得到完整的矩阵：


    ```

    \(\begin{bmatrix} z_c u \\ z_c v \\ z_c \end{bmatrix} = \begin{bmatrix} f_x &
    0 & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x_c \\ y_c
    \\ z_c \end{bmatrix}\)

    ```


    上式中，我们一般把中间的 3×3 矩阵称为照相机内参（camera intrinsics）矩阵 \(K\)。一般地，照相机内参在出厂之后可以认为固定不变，不会在使用过程中发生显著变化。有的厂商会直接告诉用户照相机内参，但是大多数时候我们需要自己去标定照相机内参。有时候我们会看到，在一些厂商给出的内参矩阵中有一个参数
    \(s\)，这个参数是用来描述像素的非正交性的：


    ```

    \(\begin{bmatrix} z_c u \\ z_c v \\ z_c \end{bmatrix} = \begin{bmatrix} f_x &
    s & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x_c \\ y_c
    \\ z_c \end{bmatrix}\)

    ```


    不过在大多数情况下，从现有工艺和简化计算的角度考虑，我们可以认为 \(s=0\)，即像素是正交的。


    # 16.2.5 投影矩阵


    根据 16.2.3 节和 16.2.4 节，在已知照相机内参和外参的情况下，都能够计算空间中任意一点在图像坐标系中的坐标。那么我们可以将照相机内参和外参合并起来得到一个
    3×4 的矩阵，这个矩阵被称为投影矩阵。投影矩阵的定义如下：


    ```

    \(P = K [R | t] = \begin{bmatrix} p_{11} & p_{12} & p_{13} & p_{14} \\ p_{21}
    & p_{22} & p_{23} & p_{24} \\ p_{31} & p_{32} & p_{33} & p_{34} \end{bmatrix}\)

    ```


    为了得到一个可逆的投影矩阵，通常考虑增加一个额外的行，从而构建一个 4×4 的齐次矩阵：


    ```

    \(\tilde{P} = \begin{bmatrix} K & \mathbf{0} \\ \mathbf{0}^\top & 1 \end{bmatrix}
    \begin{bmatrix} R & t \\ \mathbf{0}^\top & 1 \end{bmatrix}\)

    ```


    已知投影矩阵和空间点的齐次坐标，可以通过矩阵乘法得到其在图像坐标系中的坐标：


    ```

    \(\tilde{p}_i^\top = \tilde{P} \tilde{p}_w^\top\)

    ```


    其中 \(\tilde{p}_i\) 是点 \(P\) 在图像坐标系中的齐次坐标。'
