    中值滤波器（median filter）是一种统计排序滤波器，即图像像素等于周围像素排序后的中值。对于图像中一点(i, j)，中值滤波以该点为中心，将邻域内所有像素的统计排序中值作为此点的像素值。椒盐噪声在图像中是少数，大部分像素点的像素值是正常的，所以像素的中值通常是正常像素值，这便是中值滤波器去除椒盐噪声的原理。


