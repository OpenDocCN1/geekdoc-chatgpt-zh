- pgno: 186
  md: '# 12.3.3 Faster R-CNN


    尽管 Fast R-CNN 相较于 R-CNN 在测试时间上实现了显著的提升，从每幅图像的 47 s 缩减至 0.32 s，测试速度提升了 146 倍，但需要注意的是，这个测试时间并未包含候选区域提取所用的时间。实际上，候选区域提取过程正是目标检测速度的瓶颈所在。


    为了进一步提升目标检测的速度，任少卿、何恺明、Ross Girshick 和孙剑于 2015 年提出了 Faster R-CNN[4]。该方法通过引入候选区域网络（region
    proposal network，RPN）实现了高效的候选区域提取，将目标检测的测试时间缩短到每幅图像 0.2 s（包含候选区域提取过程），相较于 R-CNN
    实现了近 250 倍的速度提升。相较于 Fast R-CNN，Faster R-CNN 通过 RPN 直接从图像的特征图生成若干候选区域，取代了之前传统的候选目标检测方法（如
    Selective Search），实现了端到端的训练模式。简单地说，Faster R-CNN 可以被理解为“RPN + Fast R-CNN”，其整体流程如图
    12-9 所示，主要包括以下两个步骤：


    +   (1) 通过 RPN 从输入图像中提取候选区域；

    +   (2) 基于 Fast R-CNN 的框架对这些候选区域进行目标类别分类与包围盒回归；


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_186_0.png)


    图 12-9 Faster R-CNN 流程（插图素材源自参考文献[4]）


    RPN 是 Faster R-CNN 中引入的核心模块，它采用轻量级的卷积神经网络作用于特征图上，利用卷积操作的滑动窗口特性，实现了滑动窗口检测策略，从而取代了传统的候选区域生成方法，其过程如图
    12-10 所示。RPN 以主干网络中的卷积层输出的特征图为输入，利用轻量级的卷积神经网络在特征图上滑动，每滑动到一点处，将以当前点为中心的空间分辨率为 s×s（一般
    s = 3 像素）的滑动窗口内的特征映射成一个维度为 d（通常，d = 256 或者 512）的特征向量。该特征向量被输入到两个并行的全连接层——一个分类层和一个回归层，实现候选区域生成。注意，目前我们只提及了候选区域的位置，即当前滑动窗口的中心，而候选区域的尺寸仍然是未知的。为此，RPN
    中引入了一个重要概念——锚框（anchor）。锚框是居中于当前滑动窗口的一个矩形区域，通过预定义的尺寸和高宽比确定其空间分辨率。这样，上述分类层输出两个分数，即当前锚框中存在目标的置信度和不存在目标的置信度；回归层输出
    4 个包围盒的坐标偏移量参数，即当前锚框（锚框是矩形区域，也是一个包围盒）与其对应目标的真实包围盒之间的坐标偏移量。由于图像中的目标尺寸是未知的，为了实现多尺寸目标检测，RPN
    在特征图的每个点生成多个候选区域，生成的候选区域个数 k 由预定义的锚框种类决定，即由基础空间分辨率的锚框种类决定。RPN 中通常采用 3 种锚框尺寸和 3
    种锚框高宽比，所以总共有 k = 9 种预定义的锚框。因为定义了 k 种锚框，上述的分类层和回归层分别在每个滑动窗口处输出 2k 个置信度分数和 4k 个包围盒的坐标偏移量参数。若主干网络卷积层输出的特征图的大小为
    H×W （一般约为 2400），其中 H 和 W 分别是特征图的高和宽，则该'
