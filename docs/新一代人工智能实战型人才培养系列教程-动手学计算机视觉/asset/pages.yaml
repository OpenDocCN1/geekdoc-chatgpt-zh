    CNN 模型进行训练。接着，使用训练后的 CNN 模型对这些图像块进行分类。在对图像上的每个像素进行类别预测后，便得到整幅图像的语义分割结果，如图 11-3
    最右侧图所示。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_162_0.png)


    图 11-3 一个直观的语义分割模型


    上述的方法虽然直观，但在实际中却存在许多问题。


    +   (1) 由于一幅图像中可能存在成千上万像素，且相邻像素的图像块有大部分重叠，使得这一方法计算量大、计算效率低。

    +   (2) 与整幅图像相比，图像块显得比较小，而且只能提取图像局部的特征，这使得分类的性能受限。

    +   (3) 整个过程不是端到端的，它需要有预处理和后处理的环节。


    为了应对这些问题，2015 年 Jonathan Long 等人提出了一种全新的分割网络——全卷积网络（fully convolutional network，FCN）[4]。与传统的
    CNN 网络（如 AlexNet 等）不同，在 FCN 中，网络输出的全连接层被替换为卷积核大小为 1×1 的卷积层，如图 11-4 所示。根据第 10 章的内容，对于图像分类，可以使用全连接层将卷积层输出的多通道图像特征图映射成一个维度为
    |C| 的向量，该向量中每个元素的值表示属于对应类别的置信度，如此便可以实现一幅图像的分类。然而在语义分割中，需要对一幅图像的每个像素进行分类，因此全连接层并不适用。为了实现端到端的预测，使用一个
    1×1 卷积层替换全连接层，将卷积层输出的多通道特征图映射成一个空间分辨率不变的通道数为 |C| 的类别置信度图。这样，卷积层输出的特征图上的每个空间位置都对应一个维度为
    |C| 的向量，表示该位置对应的原图区域属于 C 中每个类别的置信度，如此便可实现图像的语义分割。我们把类别置信度图叫作热图（heatmap），属于某类的置信度越高，热度就越高。调整热图的空间分辨率，使其和原图一致，便可以得到所需的语义分割的结果。


    不过，在图 11-4 中依旧可以发现两个明显的问题：随着卷积的进行，特征图越来越小，最终输出的热图要比原图小很多；由于最终输出的热图较小，其蕴含的边界信息也变得十分的粗糙，无法精准地勾勒出原图中物体的轮廓。为了解决上述两个问题，FCN
    网络引入了两种有效的架构：上采样（upsampling）和跳跃连接（skip-connection）。'
