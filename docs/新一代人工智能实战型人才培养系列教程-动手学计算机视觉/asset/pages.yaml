    \ 8 邻域内）时，才被确定为边缘点。接下来，我们实现对弱边缘点的确定过程。\n\n```\n# 获得在(x,y)处的邻居\ndef get_neighbors(x,\
    \ y, H, W):\n    neighbors = []\n    for i in (x - 1, x, x + 1):\n        for\
    \ j in (y - 1, y, y + 1):\n            if i >= 0 and i < H and j >= 0 and j <\
    \ W:\n                if (i == x and j == y):\n                    continue\n\
    \                neighbors.append((i, j))\n\n    return neighbors\n\n# 判断弱边缘点是否为边缘\n\
    def link_edges(strong_edges, weak_edges):\n    # 获得图的大小\n    H, W = strong_edges.shape\n\
    \n    # 获得强边缘点的位置\n    indices = np.stack(np.nonzero(strong_edges)).T\n```"
