    # 8.6 拓展阅读


    使用最小二乘法求解


    ```

    $$\min_p \|Ap\|^2 \quad \text{s.t.} \quad \|\bar{p}\|_2 = 1$$

    ```


    已知


    ```

    $$\|Ap\|^2 = (Ap)^T(Ap) = p^T A^T Ap \quad \text{s.t.} \quad \|p\|^2 = p^T p =
    1$$

    ```


    那么，可以构建一个损失函数 \( l(p) \) 来迭代找到满足方程组的解：


    ```

    $$\min_p \left\{ l(p) = p^T A^T Ap + \lambda \left( p^T p - 1 \right) \right\}$$

    ```


    对 \( p \) 求导，可得


    ```

    $$A^T Ap + \lambda p = 0$$

    ```


    显然，矩阵 \( A^T A \) 的最小特征值 \( \lambda \) 对应的特征向量 \( p \) 是此方程组的近似解。


