    \      self.bx = [i for i in range(len(b))]\n\n    def conv(self):\n        lst1\
    \ = self.a\n        lst2 = self.b\n        l1 = len(lst1)\n        l2 = len(lst2)\n\
    \        lst1 = [0] * (l2 - 1) + lst1 + [0] * (l2 - 1)\n        lst2.reverse()\n\
    \        c = [0 for x in range(0, l1 + l2 - 1)]\n        for i in range(l1 + l2\
    \ - 1):\n            for j in range(l2):\n                c[i] += lst1[i + j]\
    \ * lst2[j]\n        return c\n\n    def plot(self):\n        a = self.a\n   \
    \     b = self.b\n        ax = self.ax\n        bx = self.bx\n\n        # 为了更直观地查看结果，我们分别绘制\
