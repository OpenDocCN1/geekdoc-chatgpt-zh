- pgno: 140
  md: '# 第 10 章 图像分类


    # 10.1 简介


    在前面的章节中，我们介绍了一系列图像处理算法。这些图像处理算法能够帮助我们从图像中提取所需的信息，为后续的计算机视觉任务打下了基础。从本章开始，我们将进入计算机视觉领域中视觉识别的部分。视觉识别的目标是希望计算机对图像的识别结果与人类对图像的识别结果一致。因此视觉识别通常需要一个（机器）学习的过程。自
    2012 年深度学习崛起，视觉识别领域的任务绝大部分是基于深度学习的方法来完成的。因此在视觉识别这一部分，我们将主要介绍基于深度学习的视觉识别算法。


    图像分类（image classification）是视觉识别的最基本的问题之一，对这个问题的研究也是研究其他视觉识别问题的基础。图像分类，顾名思义，就是根据一定的分类规则，将图像划分到预定义的类别中。如图
    10-1 所示，简单的图像分类就是分别给这些图像打上“猫”“骆驼”“老虎”等标签。用数学语言来描述图像分类问题，即定义图像空间 I 和预定义的类别集合 C，给定数据集
    D={(I^(n), y^(n))}_{n=1}^N，其中，I^(n) ∈ I 是数据集中的第 n 幅图像，y^(n) ∈ C 是其对应的标签；图像分类的任务是从
    D 中学习得到一个从图像空间到类别集合的映射 f：I -> C，从而给定任意一幅图像 I，可以用学习得到的映射函数 f 预测其标签，即 y_hat = f(I)。通常，这个学习过程需要建模条件概率
    P(y|I)，则 y_hat = f(I) = arg max_{y in C} P(y|I)。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_140_0.png)


    图 10-1 图像分类示例


    传统的图像分类流程如图 10-2 所示。先从用于训练的图像中提取图像表征（image representation），并结合对应的标签信息训练一个图像分类的模型（分类器）。对于每一幅测试图像，采用同样的表征提取过程得到其表征，并利用训练得到的分类器预测其所属类别。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '图像表征的提取是图像分类中关键的一步。机器学习中不同分类器的性能差别不大，因此图像表征的好坏直接决定了图像分类性能的高低。传统图像表征提取算法主要基于手工设计的图像特征向量，如第
    7 章介绍的 SIFT 特征就是一种最典型的手工设计的图像特征向量。传统图像表征中的集大成者是视觉词袋模型（bag of features，BoF）[1-4]，由
    Andrew Zisserman 等人受文本检索领域的词袋模型（bag of words model）启发而提出。该表征模型先从图像中检测并提取出多个特征点，之后利用聚类算法对这些特征点的特征向量进行聚类得到“词典”，在此基础上通过构建好的词典对每幅图像中的特征向量进行编码，从而构建每幅图像的表征，即视觉词袋模型表征。传统的图像分类过程可以基于视觉词袋模型表征训练图像分类器。可以看到，传统的图像表征提取与图像分类器的训练是分开进行的（如图
    10-2 所示），手工设计的图像表征往往会过早地丢失有用的信息，而分类的结果又无法反馈给图像表征的提取阶段，因此分类性能会受一定的限制。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_141_0.png)


    图 10-2 图像分类流程


    （图中训练图像素材源自 MS COCO 数据集，测试图像素材源自 ImageNet 数据集）


    随着深度学习的崛起，通过深度卷积神经网络（deep convolutional neural network，DCNN）联合图像表征学习和分类器学习逐渐成为主流，因为通过联合学习可以使分类的结果与图像表征的提取相互影响，从而大幅提升图像分类的性能。第一个深度卷积神经网络由
    Yann LeCun 于 1989 年提出[5]，用于手写字符的识别。随后在 1998 年，他改进了这个网络。改进后的网络被称为 LeNet-5[6]，已具有所有现代卷积神经网络的元素。2012
    年，Geoffrey Hinton 带领他的学生构建了 AlexNet[7]模型。AlexNet 是一个 8 层的卷积神经网络，在 ImageNet 图像分类比赛中取得冠军，从此开启了图像分类的深度学习时代。2015
    年，微软亚洲研究院的研究员何恺明等人提出了 ResNet[8]。ResNet 是一种可以堆叠上千层的卷积神经网络，它刷新了 ImageNet 图像分类比赛的最好成绩，从此深度学习开始统治整个视觉识别领域。


    在本章中，我们将分别介绍基于传统的视觉词袋模型的图像分类算法和基于深度卷积网络 ResNet 的图像分类算法。在介绍算法之前，我们需要先了解一些图像分类常用的数据集及度量（metric）。'
