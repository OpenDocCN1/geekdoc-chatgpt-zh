- pgno: 67
  md: '分的知识，我们知道函数的变化可以用函数的一阶导数来表示，也就是说，图像边缘就是图像一阶导数的极大值处。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_67_0.png)


    # 图 5-2 一维信号中的边缘


    接下来，我们介绍图像一阶导数（微分）的计算。


    根据微积分的知识，一元函数 f(x) 的一阶微分定义为


    \frac{df(x)}{dx} = \lim_{\Delta x \to 0} \frac{f(x + \Delta x) - f(x - \Delta
    x)}{2\Delta x}


    而我们知道，图像 I 是一个矩阵，其中每个元素的值（像素值）可以表示为一个二元函数 f(x, y) 的输出，而二元函数的微分可由一元函数的一阶微分推广得到：


    \frac{\partial f(x, y)}{\partial x} = \lim_{\epsilon \to 0} \frac{f(x + \epsilon,
    y) - f(x - \epsilon, y)}{2\epsilon}


    \frac{\partial f(x, y)}{\partial y} = \lim_{\epsilon \to 0} \frac{f(x, y + \epsilon)
    - f(x, y - \epsilon)}{2\epsilon}


    由于数字图像是离散的，在数字图像中最小的位置距离单位为 1 像素，即 $\epsilon = 1$。那么在离散情况下，将上述中连续的位置坐标(x, y)转变为离散的矩阵元素位置索引(i,
    j)，上式变为


    $I_x(i, j) = \frac{I(i+1, j) - I(i-1, j)}{2}$


    $I_y(i, j) = \frac{I(i, j+1) - I(i, j-1)}{2}$


    其中，$I_x(i, j)$ 和 $I_y(i, j)$ 分别是图像像素值关于位置的二元函数在像素(i, j)处沿 x 轴方向和沿 y 轴方向的一阶偏导数；记
    $\nabla I(i, j) = [I_x(i, j) \quad I_y(i, j)]$ 表示图像在该点处的梯度（gradient），故 $I_x(i,
    j)$ 和 $I_y(i, j)$ 即为沿 x 轴方向和沿 y 轴方向的梯度幅值（magnitude）。因此，在离散的数字图像中，对图像的一阶微分是通过一阶差分实现的。将上式变形：


    $I_x(i, j) = \frac{1}{2} \sum_{m=-1}^{1} \sum_{n=-1}^{1} I(i-m, j-n)K_x(m, n)$


    $I_y(i, j) = \frac{1}{2} \sum_{m=-1}^{1} \sum_{n=-1}^{1} I(i-m, j-n)K_y(m, n)$


    令矩阵 $K_x = \begin{bmatrix} 0 & 0 & 0 \\ +1 & 0 & -1 \\ 0 & 0 & 0 \end{bmatrix},
    \quad K_y = \begin{bmatrix} 0 & +1 & 0 \\ 0 & 0 & 0 \\ 0 & -1 & 0 \end{bmatrix}$,
    其中，$K_x$ 中心位置的坐标为(0,0)，对 $K_y$ 同理。'
