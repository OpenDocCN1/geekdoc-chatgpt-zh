  md: "# Matching Result by CCOORR\n\n![](img/0e497601c0ca26be98c5399cbd72eb4c_61_0.png)\n\
    \n结果没有出乎大家的意料？我们并没有匹配到正确目标！问题出在哪里？\n\n仔细观察互相关的公式，可以发现是模板图像像素值和输入图像子图像素值直接相乘，那么在模板一定的情况下，子图整体像素值越大（也就是越亮），它们之间的乘积也就越大。因此互相关更容易找到输入图像中亮度高的区域，而不是与模板最相似的区域。那么如何解决这个问题呢？显然，我们需要该相似度度量与输入图像中每个子图整体像素值大小无关，这就需要归一化。接下来我们引入另一种相似度度量方法——归一化互相关。\n\
    \n# 2. 归一化互相关\n\n归一化互相关需对模板和输入图像子图做归一化，去除因为它们的整体像素值大小对互相关结果的影响。模板与输入图像子图归一化互相关计算公式为\n\
    \nR(i,j) = \\frac{\\sum_m \\sum_n I(m,n) \\cdot T(m-i,n-j)}{\\sqrt{\\sum_m \\\
    sum_n I^2(m,n)} \\sqrt{\\sum_m \\sum_n T^2(m-i,n-j)}}\n\n这里，分母中的两部分分别反映了模板和输入图像子图自身像素值的大小，相乘后作为归一化因子，以消除它们对互相关计算的影响。其实，这也是余弦相似度的一种表示。按照上述公式，编程实现归一化互相关，改写\
    \ CCOORR() 函数，再试试是否可以找到正确的目标区域。\n\n```\n# 对原有 CCOORR() 函数进行改写，定义归一化互相关\ndef CCOORR(img,\
    \ temp, normalize=True):\n    w, h = temp.shape[::-1]\n    W, H = img.shape[::-1]\n\
    \    res = np.zeros((W-w+1, H-h+1))\n    img = np.array(img, dtype='float')\n\
    \    temp = np.array(temp, dtype='float')\n    t = np.sqrt(np.sum(temp**2))\n\
    ```"
