  md: '像平面，对应的照相机坐标系为左照相机坐标系和右照相机坐标系，所拍摄的图像为左图像和右图像。注意，如果这两台照相机内参完全相同，那么可以等价为放置在不同视角的同一台照相机。为了描述简单，我们将世界坐标系与左照相机的照相机坐标系重合。假设这两台照相机的光心分别位于点
    $O_l$ 和 $O_r$。空间中一点 $P$ 在左、右照相机坐标系中的坐标分别为 $x_l$ 和 $x_r$，该点在左、右成像平面上的两个投影点 $P_l$
    和 $P_r$ 在左、右图像坐标系下的坐标分别为 $u_l$ 和 $u_r$。


    接下来我们定义一些术语来描述空间几何关系：射线 $O_l P_l$ 和射线 $O_r P_r$ 在三维空间中相交于点 $P$，那么 $O_l$、$O_r$、$P$
    这三个点可以确定一个平面，称为对极平面（epipolar plane）或极平面。和在平行双目视觉系统中定义的一样，两个光心的连线 $O_l O_r$ 称为基线。基线与两个成像平面的交点分别为
    $E_l$ 和 $E_r$。不难发现，$E_l$ 和 $E_r$ 分别是光心 $O_l$ 和 $O_r$ 在相对的成像平面上的投影。称 $E_l$ 和 $E_r$
    为对极点（epipole）或极点，极平面与两个成像平面之间的相交线 $P_l E_l$ 和 $P_r E_r$ 称为对极线（epipolar line）或极线。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_294_0.png)


    需要注意的是，在照相机的位置和姿态不变的情况下，极点的位置是唯一的。如图 19-5 所示，除了空间点 $P$，空间中的其他点 $P''$ 也可以构建出新的极平面
    $O_l O_r P''$。无论空间点位置如何变化，对应的极平面都包含基线 $O_l O_r$，因此其总是与成像平面相交于 $E_l$ 和 $E_r$ 两点。我们也可以从极点的物理意义入手来理解极点的唯一性：极点是光心在相对的成像平面上的投影，一旦照相机的位置和姿态确定了，极点
    $E_l$ 和 $E_r$ 的位置也就确定了。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_294_1.png)


    图 19-6 展示了对极几何中的的一个关键概念：对于左成像平面上一点 $P_l$，其对应的三维空间点 $P$ 在右成像平面上的投影必然位于右成像平面上的一条极线上。这一现象称作对极约束（epipolar
    constraint）。具体来说，如果我们有一组非平行双目图像，每一个三维空间中的点在左图像中的投影像素点和它在右图像中的投影像素点之间的位置关系不是随机的，而是受到两'
