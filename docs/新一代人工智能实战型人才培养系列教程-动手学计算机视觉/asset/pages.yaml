- pgno: 58
  md: '# 4.2.1 匹配步骤


    对于一幅模板图像 T 和输入图像 I，令其大小分别为 w×h 和 W×H (w≤W，h≤H)，我们按照以下匹配步骤在图像 I 中寻找与图像 T 最相似的目标位置。


    +   (1) 让模板图像在输入图像上滑动，在每个滑动位置(i,j)，计算模板与以(i,j)为左上角顶点、大小为 w×h 的输入图像子图的相似度。


    +   (2) 当上述滑动结束后，将得到一个相似度矩阵 R，矩阵的每个元素 R(i, j) 是上述在滑动位置(i,j)处计算得到的相似度。不难得出，矩阵 R
    的大小为 (W-w+1)×(H-h+1)。


    +   (3) 获得相似度矩阵之后，查找元素最大值所在的位置 (i*，j*)。在输入图像中，以 (i*，j*) 为左上角顶点、以 w 和 h 为宽和高的区域便是输入图像中与模板图像最相似的区域，也就是要找的目标位置。


    如图 4-2 所示，要在图 4-2 (b) 中寻找与图 4-2 (a) 最相似的区域，先将模板图像从输入图像的左上角（右图中左上角方框的位置）开始滑动，分别计算每个位置的相似度，并将具有最大相似度的子图作为输出。从而实现输入图像中的模板匹配。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_58_0.png)


    图 4-2 模板匹配示意


    不过，该如何计算相似度呢？


    # 4.2.2 相似度度量


    模板匹配的相似度度量方法有很多种，在本节中，我们主要介绍互相关和归一化互相关。


    +   1. 互相关


    互相关的做法非常简单：将模板与输入图像子图的对应位置元素相乘并求和。在位置(i,j)处（以(i,j)为左上角顶点），模板与输入图像子图互相关计算公式为


    ```

    R(i, j) = \sum_{m=i}^{i+w-1} \sum_{n=j}^{j+h-1} I(m,n) \cdot T(m-i, n-j)

    ```


    其中，(m,n)是输入图像中任一像素点的坐标；(m-i,n-j)是模板上对应该像素点的坐标。


    不知大家是否觉得上式似曾相识？回顾第 2 章二维卷积的公式，它们之间的差别仅在于 T'
  merge: -1
  img_proc: true
