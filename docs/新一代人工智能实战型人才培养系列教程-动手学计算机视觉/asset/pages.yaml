  md: "```\nfrom torchvision import models\n\n# 使用 ResNet101 作为主干网络，模型使用 ImageNet\
    \ 预训练\npretrained_net = models.resnet101(pretrained='imagenet')\n\nimport torch.nn\
    \ as nn\n\n# FCN-8s 模型\nclass FCN8s(nn.Module):\n    def __init__(self, num_classes):\n\
    \        super(FCN8s, self).__init__()\n        # 这里使用 children() 调用 ResNet101\
    \ 的部分网络\n        # 该深度特征图的大小为输入图像的 1/8\n        self.stage1 = nn.Sequential(*list(pretrained_net.children())[:-4])\n\
    \        # 该深度特征图的大小为输入图像的 1/16\n        self.stage2 = list(pretrained_net.children())[-4]\n\
    \        # 该深度特征图的大小为输入图像的 1/32\n        self.stage3 = list(pretrained_net.children())[-3]\n\
    \n        # 调整 stage3 输出的通道数\n        self.scores1 = nn.Conv2d(2048, num_classes,\
    \ 1)\n        # 调整 stage2 输出的通道数\n        self.scores2 = nn.Conv2d(1024, num_classes,\
    \ 1)\n        # 调整 stage1 输出的通道数\n        self.scores3 = nn.Conv2d(512, num_classes,\
    \ 1)\n\n        # 8 倍上采样\n        self.upsample_8x = nn.ConvTranspose2d(\n   \
    \         num_classes, num_classes, 16, 8, 4, bias=False)\n        self.upsample_8x.weight.data\
    \ = bilinear_kernel(\n            num_classes, num_classes, 16) # 使用双线性 kernel\n\
    \n        # 2 倍上采样\n        self.upsample_2x = nn.ConvTranspose2d(\n         \
    \   num_classes, num_classes, 4, 2, 1, bias=False)\n        self.upsample_2x.weight.data\
    \ = bilinear_kernel(\n            num_classes, num_classes, 4) # 使用双线性 kernel\n\
    \n    def forward(self, x):\n        x = self.stage1(x)\n        # s1 1/8\n  \
    \      s1 = x\n\n        x = self.stage2(x)\n        # s2 1/16\n        s2 = x\n\
    \n        x = self.stage3(x)\n        # s3 1/32\n        s3 = x\n\n        # 调整\
    \ pool5 输出特征图的通道数\n```"
