- pgno: 275
  md: "```\n# 计算高斯核 G\nG = np.exp(-x ** 2 / (2 * sigma ** 2))\nG = G / np.sum(G)\n\
    # 对图像进行二维卷积\nreturn cv2.sepFilter2D(img, -1, G, G)\n```\n\n```\ndef gaussderiv(img,\
    \ sigma):\n\"\"\"\n高斯求导函数\n\n参数：\n- param img: 输入图像\n- param sigma: 高斯核的标准差\n\n\
    返回：\n- Dx: x 轴方向的导数图像\n- Dy: y 轴方向的导数图像\n\"\"\"\n# 创建 x 数组，范围为[-3sigma,3sigma]\n\
    x = np.array(list(range(math.floor(-3.0 * sigma + 0.5),\n                    \
    \ math.floor(3.0 * sigma + 0.5) + 1)))\n\n# 计算高斯核 G\nG = np.exp(-x ** 2 / (2 *\
    \ sigma ** 2))\nG = G / np.sum(G)\n\n# 计算高斯求导核 D\nD = -2 * (x * np.exp(-x ** 2\
    \ / (2 * sigma ** 2))) / (\\\n    np.sqrt(2 * math.pi) * sigma ** 3)\nD = D /\
    \ (np.sum(np.abs(D)) / 2)\n\n# 分别对图像进行 x 方向和 y 方向二维卷积\nDx = cv2.sepFilter2D(img,\
    \ -1, D, G)\nDy = cv2.sepFilter2D(img, -1, G, D)\n\nreturn Dx, Dy\n```\n\n```\n\
    def calculate_derivatives(img1, img2, smoothing, derivation):\n\"\"\"\n计算图像的导数\n\
    \n参数：\n- img1: 前一帧图像\n- img2: 后一帧图像\n- smoothing: 高斯模糊的标准差\n- derivation: 高斯求导的标准差\n\
    \n返回：\n- i_x: x 轴方向的导数图像\n```"
