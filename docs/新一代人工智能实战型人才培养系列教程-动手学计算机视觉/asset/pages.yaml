  md: "假设两幅图像共有 \\( n \\) 对匹配的特征点，可以得到以下方程：\n\n\\(\\left[\\begin{array}{ccccccccc}\
    \ x_1 & y_1 & 1 & 0 & 0 & 0 & -x'_1x_1 & -x'_1y_1 & -x'_1 \\\\ 0 & 0 & 0 & x_1\
    \ & y_1 & 1 & -y'_1x_1 & -y'_1y_1 & -y'_1 \\\\ \\vdots &  &  &  &  &  &  &  &\
    \ \\vdots \\\\ x_n & y_n & 1 & 0 & 0 & 0 & -x'_nx_n & -x'_ny_n & -x'_n \\\\ 0\
    \ & 0 & 0 & x_n & y_n & 1 & -y'_nx_n & -y'_ny_n & -y'_n \\end{array}\\right] \\\
    left[\\begin{array}{c} a \\\\ b \\\\ c \\\\ d \\\\ e \\\\ f \\\\ g \\\\ h \\\\\
    \ i \\end{array}\\right] = \\left[\\begin{array}{c} 0 \\\\ 0 \\\\ \\vdots \\\\\
    \ 0 \\\\ 0 \\end{array}\\right]_{2n}\\)\n\n令矩阵 \\( A = \\left[\\begin{array}{ccccccccc}\
    \ x_1 & y_1 & 1 & 0 & 0 & 0 & -x'_1x_1 & -x'_1y_1 & -x'_1 \\\\ 0 & 0 & 0 & x_1\
    \ & y_1 & 1 & -y'_1x_1 & -y'_1y_1 & -y'_1 \\\\ \\vdots &  &  &  &  &  &  &  &\
    \ \\vdots \\\\ x_n & y_n & 1 & 0 & 0 & 0 & -x'_nx_n & -x'_ny_n & -x'_n \\\\ 0\
    \ & 0 & 0 & x_n & y_n & 1 & -y'_nx_n & -y'_ny_n & -y'_n \\end{array}\\right]_{2n\
    \ \\times 9} \\) , \\( t=[abcdefghi]^T\\) , 上述等式\n\n可以简写成\n\n\\( At = 0 \\)\n\n\
    一般来说，能够得到的特征点对的数量远多于方程未知量的个数，且由于有的特征点对的位置存在误差，上式可能没有唯一闭式解。因此，往往通过优化下述问题来求解 \\\
    ( t \\)：\n\n\\( \\min \\| At - 0 \\|_F^2 \\, \\text{s.t.} \\, \\|t\\|^2 = 1 \\\
    )\n\n只需要求解上述方程得到到 \\( t \\) ，便可得到变换矩阵 \\( T \\) 。注意，变换矩阵 \\( T \\) 是定义在齐次坐标系下的，所以尺度对其无影响。故而，只需要求解单位向量\
    \ \\( \\hat{t} \\) ，即矩阵 \\( A^T A \\) 的最小特征值对应的特征向量（证明过程详见 8.6 节）。\n\n我们把图像拼接的过程总结为以下\
    \ 3 步：\n\n+   （1）计算两幅图像的特征点；\n+   \n+   （2）将两幅图像的特征点进行匹配；\n+   \n+   （3）根据匹配的特征点对计算图像变换矩阵。\n\
    \n# 8.3.2 利用 RANSAC 算法去除误匹配\n\n当利用 SIFT 进行特征匹配时，有些时候可能会出现图 8-6 的情况。图 8-6 中右图绿色圆圈内的特征点是与左图匹配的特征点，但利用\
    \ SIFT 匹配特征点时，会将左图中部分特征点匹配到右图绿色圆圈之外的特征点（如红色圆圈内的特征点）。这些特征点匹配是错误的匹配，应该被移除，从而保证变换矩阵计算的鲁棒性。应该如何移除错误的匹配点对呢？"
