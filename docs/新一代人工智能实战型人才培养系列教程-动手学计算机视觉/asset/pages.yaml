- pgno: 96
  md: '# 7.2 SIFT 算法


    SIFT[1]的全称是 scale invariant feature transform（尺度不变特征变换），由 David G. Lowe 教授于 1999
    年在国际计算机视觉会议（IEEE International Conference on Computer Vision，ICCV）上提出，是计算机视觉领域二十多年来引用率最高的论文之一。SIFT
    算法是一种高效的基于尺度空间的块状区域检测算法，包含块状区域的检测及块状区域的描述（SIFT 特征）。它的提出极大推动了计算机视觉领域的发展，并被广泛用于视觉识别和三维重建。SIFT
    算法的主要思想与 7.1 节中描述的一致，即利用尺度空间来检测图像中的块状区域。


    # 7.2.1 局部极值点检测


    在 7.1 节中，我们已经知道如何利用尺度空间检测特征点，即利用尺度归一化的高斯拉普拉斯算子 \(\sigma^2\nabla^2 G\) 与图像 \(I\)
    做卷积，寻找响应中极值点对应的 \(\sigma\) 。为了提高计算效率，我们可以使用高斯差分（difference of Gaussian，DoG）算子
    \(D\) 近似代替归一化高斯拉普拉斯算子。高斯差分算子定义如下：


    \(D(x,y,\sigma)=G(x,y,k\sigma)-G(x,y,\sigma)\)


    因为


    \(\sigma\nabla^2 G = \frac{\partial G}{\partial \sigma} \approx \frac{G(x,y,k\sigma)-G(x,y,\sigma)}{k\sigma-\sigma}\)


    因此，我们可以得到


    \(D(x,y,\sigma)=G(x,y,k\sigma)-G(x,y,\sigma) \approx (k-1)\sigma^2 \nabla^2 G\)


    其中， \(k\) 是常数，所以 \(k-1\) 对极值点不会有影响。根据图 7-8 所示，我们可以发现，归一化高斯拉普拉斯算子和高斯差分算子近似。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_96_0.png)


    图 7-8 归一化高斯拉普拉斯算子和高斯差分算子的比较'
  merge: -1
  img_proc: true
- pgno: 97
  md: '用高斯差分算子 \( D(x, y, \sigma) \) 对图像 \( I(x, y) \) 做卷积，得到


    \( D(x, y, \sigma) * I(x, y) = (G(x, y, k\sigma) - G(x, y, \sigma)) * I(x, y)
    \\ = L(x, y, k\sigma) - L(x, y, \sigma) \)


    由此可见，高斯差分算子与图像卷积的结果可以由不同尺度的 \( \mathbf{L} \) 直接相减得到，因此，可以通过如图 7-9 所示的方法来计算高斯差分算子与图像的卷积。首先得到一幅图像对应的尺度空间，即通过一个可变尺度的高斯函数与输入图像做卷积得到一系列响应图像，并将尺度大小相邻的两幅响应图像做差，即可得到相应的不同尺度的高斯差分算子与输入图像的卷积。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_97_0.png)


    如前所述，特征点对应高斯差分算子响应图上的极值点。为了检测响应图上的极值点，需要将响应图上每个点的响应值与它所有相邻点比较。如图 7-10 中间子图所示，需要将中间橙色的特征检测点与它在整个
    \( (x, y, \sigma) \) 图像尺度空间上的 26 邻域点（包括与它在同一尺度响应图上的 8 个相邻点及两个相邻尺度响应图上对应的 \( 9
    \times 2 \) 个相邻点）的响应值进行比较。如果该点的响应值在 26 邻域点中是最大的，则认为该点是候选特征点。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_97_1.png)


