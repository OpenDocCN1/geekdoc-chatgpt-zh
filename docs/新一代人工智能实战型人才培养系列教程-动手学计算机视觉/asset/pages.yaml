  md: '正交化（Schimdt orthogonalization）来实现。根据旋转矩阵的性质，其第三列可以通过前两列叉乘得到，也就是 $\boldsymbol{r}_3
    = \boldsymbol{r}_1 \times \boldsymbol{r}_2$。这里需要检查一下 $\boldsymbol{r}_3$ 的方向是否正确，即
    $\det(\boldsymbol{R})=1$，如果不正确，我们需要将其取反。到这里，我们就得到了照相机内参矩阵 $\boldsymbol{K}$ 和外参矩阵
    $[\boldsymbol{R} | \boldsymbol{t}]$，但是别忘了，这些推导都建立在图像没有畸变的前提下，因此还需要考虑畸变项。


    首先假定刚刚获得的内参矩阵 $\boldsymbol{K}$ 是正确的，由 16.2.6 节中的畸变模型，可以得到


    ```

    \(\begin{bmatrix} x_{\text{cor}} \\ y_{\text{cor}} \end{bmatrix} = (1 + k_1 r^2
    + k_2 r^4 + k_3 r^6) \begin{bmatrix} x \\ y \end{bmatrix} + \begin{bmatrix} 2
    p_1 x y + p_2 (r^2 + 2 x^2) \\ p_1 (r^2 + 2 y^2) + 2 p_2 x y \end{bmatrix}\)

    s.t. \(x^2 + y^2 = r^2\)

    ```


    我们假定透镜是无偏的，那么通过投影矩阵我们可以获得空间中角点对应的期望的图像坐标系坐标 \((\overline{x}, \overline{y})\)，可得


    ```

    \(\min_k ||(x_{\text{cor}} - \overline{x}, y_{\text{cor}} - \overline{y})||^2\)

    ```


    其中，\(\boldsymbol{k} = [k_1, k_2, p_1, p_2, k_3]^T\)。这个等式又变成了一个优化问题，我们可以套用在求解内参时的方法，代入不同图像中的观测结果，迭代解出
    \(\boldsymbol{k}\)。计算畸变参数时假定了照相机内参是正确的，这个假设在没有畸变时是合理的，但是在考虑畸变时就不合理了，那么为了得到最终的结果，我们需要交替迭代求解内参矩阵与畸变参数。


    通过交替迭代求解，我们最终就得到了照相机标定的结果 \(\{k_1, k_2, p_1, p_2, k_3\}, \{f_x, f_y, c_x, c_y\}\)。在实际标定过程中，上述收敛过程比较慢。一般通过最小化下列函数来估计参数的完整集：


    ```

    \(\sum_{i=1}^n \sum_{j=1}^m || \boldsymbol{m}_{ij} - \boldsymbol{m}(\boldsymbol{K},
    k_1, k_2, k_3, p_1, p_2, \boldsymbol{R}_i, \boldsymbol{t}_i, \boldsymbol{M}_j)
    ||^2\)

    ```


    上式 \(\boldsymbol{m}(\boldsymbol{K}, k_1, k_2, k_3, p_1, p_2, \boldsymbol{R}_i,
    \boldsymbol{t}_i, \boldsymbol{M}_j)\) 是空间中的点 \(\boldsymbol{M}_j\) 在第 \(i\) 幅标定板图像（第
    \(i\) 个照相机位置）上的投影点在该标定板图像坐标系中的坐标，\(\boldsymbol{m}_{ij}\) 是实际观测到的坐标。这个优化问题是一个非线性最小二乘问题，可以通过高斯-牛顿法（Gauss-Newton
    method）或者列文伯格-马夸特法（Levenberg-Marquardt method）来求解。


