- pgno: 270
  md: '# 17.3 光流


    上文介绍了从三维速度向量推导二维运动场的数学表示方法。然而在多数情况下，直接计算物体的运动场并不可行，我们通常采用计算光流的方法来近似估计物体的运动场。接下来我们将探讨光流估计的基本原理和常用的计算方法。


    # 17.3.1 特征点法


    光流本质上是由图像亮度变化产生的二维像素变化，因此可以通过跟踪图像中的特征点来计算。如第 7 章所述，从图像中提取视觉特征（如角点和块状区域），并在连续帧之间追踪这些特征点的对应关系，是计算光流的一种方法。这种基于特征点的光流估计产生的是稀疏光流，尽管它在表达多帧之间的运动关系上很鲁棒，尤其适用于描述较大位移的相对运动，但也存在以下局限性。


    +   (1) 计算成本高：特征点的提取和描述符的计算过程非常耗时。例如，SIFT 算法在 CPU 上运行并不能实现实时计算，而 ORB[2]算法也需要大约
    20 ms 的计算时间。


    +   (2) 信息利用不充分：采用特征点方法时，图像中除了特征点之外的所有信息都被忽略了。一幅图像可能包含数十万像素点，而特征点的数量通常只有几百个，这意味着大量可能有用的图像信息被丢弃。


    +   (3) 特征匮乏的场景：照相机有时可能移动到缺乏明显特征的场景中，例如面对一堵白墙或者空旷的走廊，这些场景中特征点的数量可能大幅减少，难以找到足够的匹配点来准确计算光流和照相机的运动。


    # 17.3.2 直接法


    直接法利用图像的像素亮度信息来估计运动，不需要计算特征点和描述子，这使其能够在特征缺失的情况下有效进行运动估计。只要场景中存在亮度变化（无论是渐变还是不足以形成局部图像梯度的变化），直接法都能够发挥作用。与仅能重建稀疏光流的特征点法不同，直接法能够根据可用像素的数量构建稀疏、稠密或半稠密的光流。然而，直接法对图像外观的变化（如亮度变化）较为敏感，可能会错误地将这些变化解释为运动。因此，这类方法更适用于在视频中运动幅度较小的情况下计算光流。


    接下来，我们介绍如何使用直接法计算光流。如图 17-4 所示，给定运动前后的两帧 I(x, y, t-1) 和 I(x, y, t)，我们的目标是找到图像中像素之间的对应关系，从而得到每个像素的光流。为了直接从像素层面找到像素间的对应关系，需要引入以下假设。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_270_0.png)


    +   (1) 亮度恒定：假设三维世界中一点在二维'
