  md: '# # 第 13 章 实例分割


    # ## 13.1 简介


    扫码观看视频课程


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_215_0.png)


    实例分割（instance segmentation）的目的是从图像中分割出每个目标实例的掩模（mask）。与语义分割相比，实例分割不但要区分不同的类别，还要区分出同一种类别下的不同目标实例。如图
    13-1 所示，语义分割的结果中，不同的羊对应的标签是一样的，即都被分配为“羊”的类别，而实例分割的结果中，不同的羊的类别标签一样，但是会有不同的实例号：与目标检测相比，实例分割需要在每个包围盒内再进一步将目标的掩模分割出来。因此，实例分割任务是语义分割任务与目标检测任务的结合。用数学语言来描述实例分割的问题，即定义图像空间
    I 和类别集合 C，给定数据集 $\mathcal{D} = \{(\boldsymbol{I}^{(n)}, \boldsymbol{Y}^{(n)})\}_{n=1}^{N}$，其中
    $\boldsymbol{I}^{(n)} \in \mathbb{I}$ 是数据集中的第 $n$ 幅图像；$\boldsymbol{Y}^{(n)} \in
    \{\boldsymbol{C} \times \mathbb{N}\}^{H^{(n)} \times W^{(n)}}$ 是其对应的实例分割标签图，$H^{(n)}$
    和 $W^{(n)}$ 分别是图像 $\boldsymbol{I}^{(n)}$ 的高和宽，$\mathbb{N}$ 是自然数集，实例分割标签图中第 $i$
    个条目 $\boldsymbol{y}_i^{(n)} = \boldsymbol{Y}^{(n)}(i) = (y_i, z_i)$ 是图像中第 $i$
    个像素对应的标签，$y_i \in \mathcal{C}$ 是该像素的类别标签，$z_i \in \mathbb{N}$ 是该像素从属实例的实例号。实例分割任务是从
    $\mathcal{D}$ 中学习得到一个从图像空间到实例分割标签图空间的映射 $f : \mathbb{I} \to \mathcal{Y}, \forall
    n, \boldsymbol{Y}^{(n)} \in \mathcal{Y}$，从而对于给定的任意一幅测试图像 $\boldsymbol{I}$，可以用学习得到的映射函数
    $f$ 预测该图像的实例分割标签图：$\hat{\boldsymbol{Y}} = f(\boldsymbol{I})$。


    ![](img/0e497601c0ca26be98c5399cbd72eb4c_215_1.png)


