    # 第一章： 数字经济时代的中国企业


    # | 数字经济的概念内涵与发展特征


    数字经济公司快速崛起，世界已经进入数字经济时代。从2013年至2018年，全球前十大市值公司排名发生了天翻地覆的变化。苹果、Alphabet（谷歌母公司）、Facebook、亚马逊、阿里巴巴、腾讯6家公司迅速跻身全球值钱的公司之列，再加上业务转型后的微软，全球前十大市值公司中新的数字经济模式的公司达到了7家。


    数据智能技术是这些数字经济公司崛起的第一推动力，网络协同效应是这些平台型公司扩张的关键范式。这些公司利用数据和算法，只用了短短十几年的时间就形成的史上最庞大且高频互动的客户群体，为投资者带了未来发展的巨大想象力。比用户规模更为重要的是，这些数字经济公司依托智能手机和各种APP在全球范围内形成的平台，为普罗大众提供了高频使用的数据服务，这更是传统公司所望尘莫及的。未来这些新兴公司手中掌握的数据智能技术不仅改变了个别产业模式，更具备了全面服务于工业、农业和服务业升级转型的巨大机会。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_2_0.png)


    图：数字经济的DNA： 网络协同和数据智能'
  merge: -1
  img_proc: true
- pgno: 3
  md: '利用网络协同效应和数据智能技术，数字经济公司为个人消费者和企业用户带来了更精准的商业体验。网络协同效应构筑的平台模式，通过为个人消费者免费提供服务为主的方式沉淀了丰富维度的实时数据。数据智能技术，利用算法和模型来预测企业和民众的需求，提供主动化的服务。基于更多维度的数据，通过算法的持续改进，迭代和优化，用机器的决策取代人类的决策，才能够在足够短的时间内快速学习、提升和逼近可能的潜在需求，实现精准的体验。


    数字经济是以数据为生产资料，云计算、大数据、人工智能等技术作为生产力，利用算力和算法，将数据转变为价值的一种新经济形态。数字经济是人类社会继农业经济、工业经济之后一种全新的经济范式，其生产要素和生产关系都发生了全新的变化。数字经济不仅不会替代工业和农业经济，而且会利用数据智能技术反哺工业经济和农业经济，提升产出效率。


    数字经济由数字产业化和产业数字化两部分组成，产业数字化是数字经济的蓝海。数字产业化是指互联网，软件和电子通信等信息化行业，产业数字化是传统的第一、二、三产业利用数据智能技术带来的产出增量。由于传统的第一、二、三产业基数相比信息产业非常巨大，可以预见的是，未来“产业数字化”的增量将超过“数字产业化”的存量，产业数字化是数字经济发展的蓝海，将成为数字经济的主流。


    例如，2016年我国软件业收入规模合计超过4.9万亿元，规模以上工业企业主营业务收入115亿元。假设人工智能和大数据工业数字化融合的效益为行业提升4%，其增量就将超过整个软件行业规模。因此，数字经济在其他产业领域的应用带来的效率增长和产出增加将成为推动经济发展的主引擎。


    # 数字经济构成


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_3_0.png)


    图：产业数字化是数字经济的“蓝海”


    数字经济发展当前尚处于萌芽阶段，从全球数字经济商业商业创新的案例来看，当前阶段的数字经济呈现出4大特征，包括数据和智能、平台和普惠。


    数据是数字经济重要的生产资料，智能预测和决策是数字经济重要的产品形态。进入移动互联网时代后，以数字化设备直接记录的比特数据，互联网上的所有连接以及连接的多方信息天然地就被以“比特”的方式沉淀了下来，这些数据的实时流动实现了人们的“在线”。正是有了这么多源源不断的活数据，云计算技术得以蓬勃发展，人工智能的算法和模型得以快速迭代，以数据智能服务为主要产品形态的数字经济才得以孕育和兴起。数据作为生产资料提供了智能决策，人民对智能决策的反馈和使用又产生了新的数据。


    数字经济范式普遍具备平台特征。平台实际上是一个能够支持原来供应链里各种角色自组织协作的数字基础设施，而平台体系本质上一种基于数字基础设施方便协作的二维生态。和传统的一维全球供应链体系相比，二维的自组织协作平台体系能够自生长，不断的聚集更多的行业资源，加速孵化未来的数字经济创新。'
