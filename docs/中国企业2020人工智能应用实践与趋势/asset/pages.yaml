    语音合成服务（TTS）：就是将文本转成语音的服务。也可以为企业提供深度定制TTS声音的能力。同时提供语言模型自学习工具，通过文本数据自学习训练语音模型，以达到定制效果。在智能客服，智能家居和智能音箱，有声朗读等领域应用非常广泛。


