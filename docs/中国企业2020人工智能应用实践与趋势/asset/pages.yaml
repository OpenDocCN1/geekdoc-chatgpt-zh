  md: '# # 人工智能时代的企业安全机遇与挑战


    迄今为止，人工智能已经成功部署在数以千万计的应用程序中帮助企业提高生产力、开创新业务、拉动销售业绩和改善组织效能。随着21世纪10年代后人工智能的普遍应用，人们也开始逐渐关心AI带来的社会效应和安全风险的问题，同时2010年后也是网络安全漏洞频发的十年，在过去8年的时间里无以计数的记录被泄漏，被黑客攻击的公司和用户户面临巨大的风险，造成严重的财务和名誉损失，阿里云每天为客户抵抗30亿次网络攻击和2000次DDoS攻击，仅2018年上半年阿里云服务器上检测并阻止了五千亿次以上的Web攻击，趋势表明攻击次数和IP数与日俱增。随着云计算、IOT、5G前沿技术的兴起，越来越多的终端设备接入网络，网络安全成为全数字化企业的核心。


    不断扩展的安全边界难以抵御当今的高级威胁，人工智能技术甚至也被黑客应用到网络攻击策略里。例如AI算法会利用鱼叉网络钓鱼的方法锁定个人或机构的社交媒体账号骗取受害者的敏感信息，在信息发送速率上AI可以达到人为的6倍，攻击成功率提升了100%。


    过去恶意软件通过手动编写脚本生成病毒和木马，并利用rootkit、密码抓取器或其他工具进行分发和执行。AI技术使得整个流程更自动化和智能化。AI安全里一个典型的问题就是对抗样本，对抗样本的概念被Szegedy学者第一次提出。对抗样本是指被黑客设计的神经网络模型的输入单元，它们好比一种视错觉混乱机器得出错误的结论。Goodfellow在其2014发表的论文中把对抗样本的概念通过图像生动地表现了出来，一个原本被识别为熊猫的图像在加入了干扰白噪声之后被机器识别为长臂猿，可信度高达99.3%。


    常见的对抗样本攻击分为两类：1）逃避攻击；2）模仿攻击。逃避攻击通过产生可以绕过安全系统检测的对抗样本，“瞒天过海”地实现对系统的恶意攻击；模仿攻击是指通过产生特定的对抗样本，使学习模型错误地将人类看来差距很大的样本错误归类为攻击者想要模仿的样本，从而获取受模仿者权限的目的。再简单的AI系统都有可能被对抗样本技术进行侵入，然而因为本身问题的复杂和多变性，目前为止科学家还没有找到一种有效地并具有普适性的防御架构和解决方案。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_44_0.png)


    图：对抗样本示例


    科技是把双刃剑，人工智能在网络安全防御应用里的能力也不容小觑。Capgemini咨询公司于2019年刚刚发布的一份名为人工智能重塑网络安全的研究报告，调研了来自7大行业（消费品、银行、保险、汽车、电信等）共计850名企业高管，通过实地走访了解AI在各企业里对网络安全起到的作用和价值。研究结果表明几乎7成的企业高层相信AI在网络攻击防御里起到的重要角色，超过一半的企业使用AI技术帮助诊断安全漏洞和隐患，其中80%的电信公司表示对人工智能在识别威胁和组织攻击上的高度依赖。在AI的协助下，整体诊断过程的成本得到了明显控制，对潜在网络威胁的整体反应时间也降低了12%。'
