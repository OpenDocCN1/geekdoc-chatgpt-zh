- pgno: 11
  md: '其核心思想指每一个输入单元都应该由多个特征所表示，并且每一个特征都应该和其他可能输入的表示产生联结作用，描述特定特征的神经元应该从所有相关的输入单元（图像）中进行学习而不仅仅是从一个特定类别的单元（图像）中训练而来。为了达到这种基于深层次网络内部表示作用的学习效果，反向传播算法（Backward
    Propagation）应运而生，它是一种高效地训练多层神经网络的方法，学习合适的内部表示进而学习任意的输入到输出的映射关系。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_11_0.png)


    图：反向传播方法示意图


    反向传播方法一经发表就得到了学术界的关注和广泛应用，并在多向任务建模的方面取得了重要的进展。然而彼时人工智能正处于其历史进程中第二次浪潮的尾期，随着90年代初期Apple和IBM通用计算机的兴起，以XCON为首的AI为主程序的专家系统的没落，人工智能商业界高投资、高期望、低回报、低交付的现象愈发严重，整个投资和媒体界人士纷纷表示对人工智能的失望，导致该领域的大量撤资。到了21世纪初，互联网的高速发展成功激活了人工智能第三次浪潮回归的3个重要因素，它们分别为（一）、海量数据积累和指数级数据体量增长；（二）、数据存储成本的大幅下降；（三）、处理器产业不断成熟导致算力性能的明显提升。不同于前两次AI“春天”，深度学习网络在模型表现和商业应用都远远优于与之竞争的基于其他机器学习技术或手动设计功能的AI系统，亦称为了第三次AI浪潮发展最显著特征之一。关于深度学习的发展和应用，我们会在下一小节做着重探讨。


    # 以深度学习为主持点的人工智能第三次浪潮


    追溯人工智能的现代史，‘Artificial Intelligence’这一术语是在1956年达特茅斯学院夏季学术大会上，由美国计算机和认知科学家John
    McCarthy第一次提出，研讨会本身意义重大，被业内普遍视为人工智能作为一门研究学科的创立，1956年也称为AI元年。早期开创AI的先驱者对AI的定义、研究方法和发展方向展开了极其热烈的讨论，他们认为AI的初衷是由机器模拟人类、动植物和物种种群的演变行为，任何领域的学习过程或任何智能的表征特点理论上都可以被机器精准地模拟出来。


    英国计算机与人工智能鼻祖Alan Turing提出了机器智能领域里两个重要的学术问题：1）机器能否模仿人脑的认知、思考、推理和解决问题的能力？2）如果可以，如何判断机器具备以上所述的所有能力？同时还提出了非常有益的人工智能发展建议，他认为与其设计类似于成人IQ思维的机器体系，不如制造一个更简单的系统，类似孩童一般，通过不断地学习、不断地成长，从而被一步步训练成更智能的综合系统，而这一理念深深嵌入到现代人工智能、机器学习算法的核心设计思想里。


    历史上，人工智能历经了两次跌宕起伏的发展时期，分别为1956－1987年，1981－1987年，AI发展的两次上升期；及1974－1980 年，1987－1993
    年，AI发展的两次寒冬期。第一次寒冬期始于英国莱特希尔教授（Sir James Lighthill）在1973年其人工智能普查报告的发布，报告中表达了对先前的AI投资未能产生预期收益的失望并呼吁人们终止对AI的过度期望和无理性的资本输入2。第二次寒冬期源于桌面电脑的迅速崛起，工业界、产业界对AI的兴趣衰减，同时AI系统升级维护成本又过于昂贵，导致AI产业投资性价比的显著下降。然而一线的科研仍在继续，提及AI的人越来越少，取而代之的是机器学习、基于知识的模式识别等学术术语开始涌现。然而在90年代开始，人工智能已经开始无声无息地成功融入到成千上万的系统中去。'
