  md: '因此大量视频内容的修复翻新是一个传媒业急需的能力，但老旧视频中普遍存在黑白色调、色偏、雪花噪点、扫描线、重影、分辨率低、台标广告等等画质问题，仅靠人力显然无法完全应对。


    2018年优酷启动“经典影剧修复计划”，希望通过新技术能够对经典剧集进行修复，投入少量的人力，就能批量完成去噪、去模糊、去划痕、去闪烁等一系列修复动作，而AI视频画质重生的能力则填补了这样的空缺。


    在实际应用中，AI技术通过大量的修复样本数据学习和拓展，使得算法能够将新视频内容的画质迁移到老旧内容上，让旧视频的画质问题得到修复，画面比例和分辨率得到提升，且相比于人工修复的方式可以在成本和效率上都得到极大的进步，使得海量老旧内容的画质重生变为可能，帮助它们换发“第二春”。


    这样的技术应用在优酷等媒体平台上，上线“高清经典”等内容专区，满足了人们的观影诉求，截止2019年5月底，优酷已完成了对100余部逾4000集经典剧集以及20余部影片的修复，相较于传统方法，算法大大提高了修复效率，如今修复一部经典电影到4K级只要1小时，而过去单机工作室修复一部两小时的电影需要数十天甚至数百天的时间。


    # # 人工智能在金融业的应用价值


    得益于数据、算法和算力三者的共同发展，人工智能技术迎来了第三次发展浪潮，计算机视觉（如人脸识别）、自然语言处理、语音识别等人工智能技术已经日臻成熟，随着其在社会和商业上的应用，已经产生了巨大的影响，并逐渐为客户所接受，这在金融业也不例外。


    人工智能会首先影响金融业的前端，即客户端，为金融业与客户的交流、交互带来全新的界面，成为重构客户端体验和交互方式的关键技术，在服务侧降低客户体验和客户交互的成本，在客户侧创造新的交互体验、提高交互效率。


    比如就客户体验方面来说，数据智能既能够通过对数据的智能化处理，实现对客户需求、客户身份和客户行为的感知（包括客户画像），也能够为客户提供智能化服务，提高客户的满意度（如智能客服）——占用金融业（尤其是金融业和保险业）巨大成本的呼叫中心（客户服务中心）未来很可能会发生革命性的改变，大量的人工坐席将被解放出来、服务成本将大幅降低。


    人工智能对金融业的后端所产生的影响将更为巨大，并通过三个阶段的发展逐渐展露出其巨大的价值：


    1.0阶段，流程智能化


    3.0阶段，产品与服务智能化


    2.0阶段，客户洞察智能化


    # ## 1.0阶段，流程智能化


    流程一直是金融业内部运营的重要关注点，为了确保风险可控以及符合监管合规的要求，并做到权责分明，金融业有一整套复杂、传统、人机不友好的流程系统与流程交互界面，随着数字经济复杂性的提升和反脆弱的需求，动态、简洁、灵活的流程是金融业的发展关键也是需要变革的第一要务。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '因此，人工智能将被首先用于流程智能化，改变金融业人与流程之间的协作与交互方式（比如为人在某些流程节点提供建议或提前预知流程潜在问题），并在这一过程中，帮助金融业实现流程智能化、自动化、无人化（减少人员参与），继而提高效率、降低成本。


    # 2.0阶段，客户洞察智能化


    客户体验极致化的关键就是准确、细致、深入和全面的客户洞察（也可称之为客户画像），但随着构建客户画像的数据维度的增加（如引入非结构化数据，以及从金融信息扩展到社交数据等非金融数据）以及对客户洞察要求的提高（在互联网行业，每个用户往往有数百个标签，并被归类于数百个不同客户画像社群），传统的数据分析与客户归类方法已经远远不能胜任。


    人工智能将极大的助力、加速甚至改变这一过程：首先，人工智能可以将客户数据的获取、分析自动化，提高金融业处理海量客户数据时的处理能力，快速将客户进行归类或将客户问题进行定位归因，形成自动化、智能化的客户分析和客户洞察，准确定位新客户潜在需求或老客户的潜在问题，并将这些洞察转化为产品、服务及客户体验，比如在手机银行客户端中针对不同的客户基于其喜好和习惯（千人千面），展现不同的功能磁贴排列，或推荐金融产品服务。


    其次，人工智能并不仅仅是在现有的客户画像模型或归类上展开工作，借助深度学习、强化学习以及对抗神经网络的能力，人工智能具备自我发现的创造能力，它能够找到数据内蕴藏的潜在规律和不同元素之间的内在联系，挖掘出新的客户画像、客户使用产品和服务的规律、客户体验方面所存在的问题。


    # 3.0阶段，产品与服务智能化


    在中国市场快速发展的智能投顾已经证明了人工智能技术对于金融业在产品与服务智能化上所蕴藏的巨大潜力和商业价值，这种结合投资者的财务状况、风险偏好、理财目标等，通过已搭建的数据模型和后台算法为投资者提供相关理财建议的方式，虽然只是初级的人工智能赋能，但已经完成了智能化在金融业客户群中的市场教育。


    在3.0阶段，人工智能将深入到金融业的具体业务当中，从数据中自动发现业务规则、洞察业务风险将成为现实，比如说，实时强化学习和深度学习可以应用于交易中的实时风控和实时反欺诈，或提供动态的高级别安全和身份认证，或者在金融业的营销中自动形成不同的营销方案、产品组合甚至是自动化完成营销内容的撰写和设计。


    未来从营销获客、反欺诈、风控到催收，人工智能都将出现在金融业的业务中。不仅为客户提供更好的体验，更是提高金融业务水平，显著增强人的能力、效率并避免人的劣势和错误的关键，在征信、风控、反欺诈、投顾、营销、服务等方面呈充分渗透。


    # 人工智能为车险行业节省数十亿成本


    车险报案索赔环节是一个复杂的过程。查勘定损员需要完成查勘、定损、索赔资料收集等数个复杂环节，涉及到保险公司查勘员对车辆的现场勘查、定损员前往现场或根据照片进行评估定损，最终才能确定车辆损伤程度、维修方案以及赔偿额度。由于车险报案索赔环节耗时改善有限，这一环节在整个车险理赔周期中占比高达85.84%，直接导致2017年平均出险支付周期仅缩短6.69%。'
