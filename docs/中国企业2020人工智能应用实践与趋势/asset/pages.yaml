  md: '# 03 传统高性能计算正在与人工智能融合为“先进计算”


    Hyperion Research的分析师Steve Conway认为，以深度学习为代表的人工智能研究和应用，正在将那些“并不真正了解HPC的公司和组织，推向HPC的领域，而他们对此一无所知。”


    事实上，现在有可用的大型数据集合（由于我们社会的数字化）和强大的计算资源，这样的组合允许这个领域取得很大的进步。人工智能（特别是机器学习和深度学习）需要庞大的计算资源，随着数据的增长，计算力变得越来越重要，只有拥有更好的、与人工智能计算（特别是深度学习计算）相匹配的计算系统（比如提供GPU计算能力或是深度学习算法框架平台）才能更好的训练（深度学习）模型。这一计算系统正是先进计算系统。


    因此，AI需要借助先进计算力量，或者说“AI站在先进计算的肩膀上会走的更远”，事实上，类似的尝试早在传统超算领域就已经被证明是可行的：20世纪90年代初，美国华盛顿的乔治梅森大学医院就经常使用他们的Cray超级计算机来帮助监测乳腺癌，经过训练，在传统超算上能够针对X光片识别出被称为“微钙化”的早期指标，而且优于人的能力——针对传统超算、大数据分析处理和人工智能计算的新一代先进计算中心，显然会是更好的支撑平台


    此外，美国计划在2021年建成的E级计算系统Aurora据DOE所披露的信息显示，就已经是一个先进计算系统，它不仅仅是只支持运行计算密集型应用的传统超算，它也将支持或者说针对数据密集型分析应用进行优化（预计也会包括针对深度学习的优化），换句话说，Aurora是一个可以支持AI代码的先进计算系统，它将支持深度学习工作负载。


    # 06 边缘人工智能算力持续提升


    随着物联网边缘设备对人工智能能力的要求不断提升，对即时、高吞吐量的边缘人工智能算力的需求也在持续增加，边缘设备需要借助人工智能及与之相匹配的算力，即时做出分析、判断和决策。与此同时，2025年，预计将会有1500亿台机器传感器和物联网设备持续输出数据，这比当今使用智能手机的个人用户所产生的数据要高出几个数量级，因此，无论是市场规模还是算力需求规模都极为庞大。


    希捷在制造工厂部署了基于GPU的智能边缘视觉解决方案，以对硬盘读写磁头的质量进行检测。其所部署的NVIDIA EGX平台能够在边缘实现推理的大幅加速，使希捷的工厂管理人员能够看到过去人类操作员无法看到的细微缺陷。高性能的边缘人工智能算力让希捷的工厂有望通过更高的效率和质量，实现高达10%的制造吞吐量提升和高达300%的投资回报率。


    # 丨数据与人工智能的关系与趋势洞察


    第三次人工智能浪潮的主流就是基于大数据量，利用深度学习（包括机器学习，以下同）算法，挖掘数据中存在的有用信息，并找到深层的逻辑关系，其处理的数据越多，深度学习就越能体现出优势，特别是在算法还未完全成熟、仍然处在持续迭代的阶段（比如弱人工智能），以前很多用机器学习解决不了或处理不好的问题，通过提供大数据能够得到很好解决或性能的大幅提升。


    随着信息化、数字化，以及物联网、智能设备、移动互联网的深入推进，越来越多的物理世界和数字世界的数据被沉淀出来，让深度学习有了足够多的数据样本，从而能够不断的从数据中学习知识，提升智能水平。毫无疑问，在数据量非常小的时候，深度学习的复杂网络往往无法取得很好的效果。


    但数据却并非一种取之不尽用之不竭的资源，即使是数据具备可再生性（即源源不断的产出），人工智能所需要的数据仍然相当昂贵和耗时，一方面，深度学习需要准确标记的图像或文本训练数据，而数据标记需要大量的人力工作；另一方面，许多数据存在着隐私和安全风险，比如说医疗、教育和公共事务数据，就存在着数据获取难的问题。


    随着深度学习技术的发展与应用，数据孤岛、数据隐私（数据安全）、小数据集和数据缺失（数据集不完整及数据标记缺失）等问题变得日益凸显，当前人工智能进一步发展，必须要解决数据的挑战，找到在当前的数据状态下持续发展的方法——这就是人工智能专家吴恩达所提出的问题：“数据当然是越多越好，我也并没有说许多数据是无用数据。但是，在农业、制造、医疗等领域的部分应用场景中，如果你手头只有100张照片，怎么办呢？”


    “小数据，大智能”，是用小数据集推动人工智能技术能力提升和产业应用发展是一个非常重要的课题，在这一领域已经有了一定的探索。'
