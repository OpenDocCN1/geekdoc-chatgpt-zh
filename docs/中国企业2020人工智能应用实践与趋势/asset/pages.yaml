    # 人工智能让杭州的城市交通学会思考


    杭州城市大脑·交通构建了情、指、勤一体的人工智能综合体，实现了AI信号灯优化、智能巡检发现交通事件、实时指挥处置优化等功能，帮助杭州交警支队提升管理水平和社会治理能力。杭州城市大脑帮助交通管理从单纯的空间管理走向时间和空间兼具的综合管理，从交警单向度治理走向社会共治，从定性管理走向定量管理，从传统警务走向数字警务，极大地推进了交通治理体系和治理能力现代化的建设。


    杭州市的城市大脑利用数据和算法来优化信号灯路口1300个，覆盖杭州四分之一路口。城市大脑通过智能调节红绿灯，在杭州萧山区的部分路段的初步试验中，车辆通行速度最高提升了11%。在主城区，城市大脑实现视频实时报警，准确率达95%以上。在苏州工业园区的两个试点中，利用人工智能算法优化客车运营线路和和发车频次，在不增加客车数量的前提下，高峰时段公交的客流量分别增加近17%和10%。在马来西亚的吉隆坡引入利用实时视频计算等人工智能算法，实现救护车优先调度功能，测试显示救护车到达医院的时间可缩短48.9%。


    杭州智慧交通建设主要通过人工智能信号灯、智能事件发现、应急车辆优先通行等建设方案，通过挖掘数据的价值进行分析，以全局的视野实现智能化管控。


    通过部署人工智能信号灯应用，实时融合互联网数据和静态路网信息，实时评估路口信号灯运行效率，对于全局交通运行情况一目了然，不再需要凭感觉人工判断，或者靠路面交警巡逻，可以辅助交警更好地量化了解路口交通运行情况，快速识别低效路口，比传统方式更高效、更全面。结合对交通态势的评价，精准的分析和锁定拥堵原因，通过对红绿灯配时优化实时调控全城的信号灯，从而降低区域拥堵。实际应用中，杭州中河-上塘路高架车辆道路通行时间缩短15.3%，莫干山路部分路段缩短8.5%；萧山信号灯自动配时路段的平均道路通行速度提升15%，平均通行时间缩短3分钟。


    智能事件发现的构建，通过对城市中海量的摄像头、特别是对360度球机的充分利用，能够利用视频识别算法来识别路面的各类事件，联动路面的机动队并向最近警力进行自动化精准的事件推送，大大提升了交警事件发现和处置的效率。应用过程中，杭州试点“视频巡检替代人工巡检”，日报警量多达500次，识别准确率92%以上。'
