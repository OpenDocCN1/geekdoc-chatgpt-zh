  md: '内河船舶的业务线很多，所以需要在不同的部门办理船舶检验证书、船舶所有权登记证书、船舶营业运输证、船舶国籍证书、船舶最低安全配员证书、国内水路运输经营许可证、船舶核验合格证共7本证书。


    除了办证之外，每年每艘船舶还必须要进行年审，就像刘雨扣夫妻一样，只有年审合格了，船才能继续上水路。在年审期间他们不得不放下手头的生意，多次将船停靠在码头，去多个部门办理，这几天下来要少跑好几趟货，一趟就是几百块钱的收入。


    但这一切，在2018年的7月份开始，发生了改变。这次，“最多跑一次”改革也跑到了水上。借助云计算、人工智能等新技术，浙江“最多跑一次”改革实现了数据的全网打通，让数据代人跑腿。杭州市港航管理局也在全国首创了“多证合一”、“多检合一”。无数像刘雨扣夫妻这样的船户，享受到了数字化时代的便利。


    本来一艘船必须要的重重的7本证，现在统一变成了一本“内河船舶管理信息簿”，厚厚的20多页纸变成了2页纸，还加上了一个时髦的“二维码”。扫一扫这个二维码，可以得到关于这艘船舶的所有信息。跑在云平台上的这个二维码，让船舶拥有了一张专属的电子身份证，更加利于船户营运和市场监管。


    # 人工智能种出更甜的阎良甜瓜


    上百年的甜瓜种植结合农业大脑的人工智能技术，展示出了新风貌。在技术人员的支持下，甜瓜的整个生产生长过程全部实现了数字化——无论是浇土、育苗、移栽、开花、结果，农民用手机就可以精确了解到浇水、施肥、授粉、缠蔓等耕作信息。


    “农业大脑能调动智能设备进行喷洒灌溉，记录甜瓜的日照时间、施肥量等信息。所以，瓜农不用靠经验判断、不打激素，跟着手机软件上一套科学的标准化种植手册操作，确保在每个甜瓜品质顶点的时候采摘。”阿里云智慧农业算法工程师童鸿翔介绍，“普通甜瓜甜度在13°至16°。但是AI技术种植的甜瓜，平均甜度能达到20°。通过阿里云和支付宝研发的瓜脸识别技术，还能判断出甜瓜的成熟度。”目前，应用农业大脑技术种植的阎良甜瓜共计2600亩。


