  md: '# 鹿班智能设计：双11背后的人工智能设计师


    2018年底，CCTV综艺节目《机智过人》上迎来了一位“人工智能设计师”：鹿班，在与人类设计师的交锋中，鹿班与人类设计师之间互有胜负，虽然人工智能未能在“设计”这一人类创意的明珠上完全战胜人类，但现场的设计师们还是对鹿班表达了由衷的赞叹。


    鹿班是一款来自于阿里云的“通过人工智能技术，快速、批量、自动化的进行图片涉及，为企业大幅度节省设计人力资源成本的智能设计产品。” 2017年，鹿班一天就能完成
    4000 万张海报，平均每秒 8000 张，而在整个2018年，鹿班在电商平台上共赋能超过30万商家，生成了1000万张图片。


    目前，鹿班已经具备了四大核心能力：


    +   ## 一键生成

    +   将商品相关素材、文字输入，选择自己需要的海报尺寸、风格等，可自动生成符合要求的海报作品。


    +   ## 设计拓展

    +   将设计完成稿输入，选择需要拓展的尺寸，可自动生成相应拓展尺寸的结果。


    +   ## 智能排版

    +   将拍摄好的照片和需要的文字输入，选择尺寸，可自动生成带有随机风格的海报作品或产品展示。


    +   ## 智能创作

    +   拥有自己独特风格的设计师将自己创作好的系列作品输入，可以训练机器，并成为系统新的效果风格。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_30_0.png)


    不止是鹿班，阿里云的智能设计能力已经进入到设计师云集的设计公司，为设计师提高效率带来大量的帮助。


    目前，洛可可通过跟阿里云的深度合作，已经开始用人工智能技术高效赋能设计师。比如，在logo设计工作中，人工智能技术就“解救”了设计师。


    洛可可设计师经常会接到logo设计的需求。按照以往的业务流程，设计师设计一个logo要做很多准备工作，进行图像检索、查询，比对以及效果优化等工作，但这个流程非常长，快的话需要一两周，慢的话可能需要耗时三到五个月。


    现在，通过使用阿里云平台上的图像识别等智能技术，可以一秒钟找到200个不同的logo素材，供洛可可设计师参考。此外，人工智能还在帮助设计师减少重复劳动，比如说在设计完一个logo之后，帮助设计师最终包装设计或者视频中的效果图。


    # 三维脚型扫描仪：黑科技测脚仪助力新零售


    在2018年在淘宝头条亲测节活动会场，两台特别的机器吸引了不少市民和消费者的“驻足”。有市民脱了鞋子赤脚站在这台机器上，就能全方位知道自己的脚型参数，以后买鞋就更清楚自己适合什么类型、材质、尺寸的鞋了。一时间，黑科技测脚仪引发了阵阵喧闹，越来越多的消费者对它产生了浓厚的兴趣。


