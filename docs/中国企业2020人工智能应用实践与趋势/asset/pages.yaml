  md: '# # 基于神经网络系统的人工智能算法趋势演进


    # ## 算法的定义


    算法名字的由来源于中世纪一位名叫花拉子米（ al-Khw ā rizm ī ）的波斯著名学者。他在825年写成的《印度数字算术》（ On the Calculations
    with Hindu Numbers ）对于印度-阿拉伯数字系统概念在中东以及欧洲的传播和推广起到了关键作用。花拉子米Al-Khw ā rizm ī 拉丁语的译名为Algoritmi，算法algorithm一词由此演变而来。


    中世纪的拉丁语 ‘algorismus’ 指的是四个基本的数学运算：加、减、乘和除法的运算程序和方法体系，但其实早期广义上的算法并不局限于数学领域里的应用实践，旧时人们用它们来制定各个领域的策略、规则，甚至用于预测未来。例如中国早期历史里，“术数”或“数术”，是中华古代神秘文化的精髓所在。


    中国古人将自然环境所观察的变化，与时事、政治和社会的振荡相结合相联系，认为两者之间有着某种内在的关系，而这种关系可以用数术的方法进行归纳和推理。而到了现代社会，由于计算机的发明，术语“算法”的定义与过程、方法和技术这类术语间的模糊概念逐步地区别开来，隐喻地表示递进的逻辑过程，并成为计算逻辑的核心。


    现代算法是从不断重复出现的现象里抽象得出的描述事物变化特征的理想化模型，是一个对空间、时间、资源和运算方法之间的组织；算法是一个问题的解决方案，并把过程拆解划分成有限地步骤进行方案的实施；更重要的是，算法是一个高度经济化的过程，它必须要在有限的时间、空间上使用最少量的资源解决问题，同时却不失其高效和灵活性。


    # # 人工智能算法的重要进程（基于神经网络）


    今天，随着人工智能的广泛普及和应用，人们倾向于将算法视为以数据为中心的抽象数学思想的应用。在第一次AI summer来临前的黎明期，20世纪50年代，在康奈尔航天航空实验室里，科学家Frank
    Rosenblatt设计并发明了一款名叫感知机（Perceptron）的机器学习矩阵神经网络系统。感知机是一种用于二元线性分类器的监督式学习算法，即是一种可以决定由数字向量表示的输入是否属于某种特定分类的函数。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_10_0.png)


    图：感知机组成示意图


    感知机的第一款原型机叫Mark 1 感知机器，由20 x 20组硫化铜光电池的输入设备组成，这组输入设备模拟了类似人类‘视网膜’的作用，目的是通过灯泡的打开或关闭组成一个400像素的图像。机器通过电线连接到一层人工神经元，分解成一个独立的输入主体，中间的配置面板基于输入特征进行不同权重组合的调节，权重通过电位计进行解码，并在后续的训练期间通过电动机进行迭代更新。Perceptron可以用于训练识别特定的图像构造，诸如字母或者三角形等的简单几何形状，确定识别的模式是否属于特定类别。感知机的出现使单个神经元的训练得到了可能，为后期神经网络学习和目前非常流行的深度学习算法的发展方向奠定了重要的基础。


    单层的感知机解决了简单的输入和输出线性配对关系的学习问题，但是一个最重要的缺陷是这种低维度的特征关系抽取无法表征两者之间非线性的关系模式。为了解决这个难题Hinton在1986年提出了分布式表示（Distributed
    Representation）的概念。'
