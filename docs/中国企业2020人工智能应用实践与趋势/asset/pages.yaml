  md: '# 人工智能深度洞察，优酷《微微一笑很倾城》10天破60亿播放


    早在前几年，优酷在舆情数据分析中，就已经发现小说《微微一笑很倾城》连续几年的阅读量都非常可观。因此在2016年8月由小说改编的电视剧《微微一笑很倾城》杀青并在东方卫视、江苏卫视首播逐渐吸引收视量时，立刻决定买断电视剧的网络播放版权，因为决策早，相对价格较低。


    在该剧集开始网络播放的时候。优酷最先只是把这部剧集定位为A级（优酷根据剧集重要性分布定级为B/A/S）。但随着剧集的播出，用户点击数量、播放量、关注流量开始逐步拉开，优酷立刻对用户数据进行了详细分析。发现该剧对年轻女性，尤其是29岁以下的年轻女学生和白领的吸引力超出预判，且剧集的受众人群基本上和优酷的年轻重度消费人群匹配度非常高。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_36_0.png)


    图：优酷基于用户数据优化内容播放


    通过用户分群和收视数据的匹配，优酷判断该剧集后续的播放点击量还会进一步放大，立刻将该剧集的重要性由A级上升到S级，并进行侧重宣传和资源投入，最终出现10天突破60亿播放量的现象级IP。这背后的逻辑就是对消费者收视行为喜好以及用户数据的关联，通过消费者的深度洞察，随时调整内容触达和资源投入，优酷的成功也在意料之中，目前该剧正在筹划拍摄第二季，其中内容的具体设计也参考了消费者对第一季的反馈数据。


    # 中央电视台基于阿里视频云及CDN实现的CCTV5手机客户端


    央视在行业的变化影响下主动求变。2016年6月起，CCTV5 APP上线运营，央视将内容频道中最优质、规模最大、拥有世界众多顶级赛事独家报道权的CCTV5与移动互联网进行结合，用新媒体结合体育赛事去开拓新的用户群体，更进一步贴近年轻人的消费需求。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_36_1.png)


    图：基于视频云和CDN的CCTV5客户端受到年青人欢迎'
