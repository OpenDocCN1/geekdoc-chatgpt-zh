- pgno: 20
  md: '# 三、突破人类能力极限


    人类拥有很强的逻辑思维能力、复杂事物处理能力和情感分析能力，这让人类成为地球上独一无二的物种，但随着计算机的普及，人类在全局认知、高并发性、深度逻辑和复杂（准确）记忆方面与现代计算、存储和算法相比处在下风，人工智能能够突破人类在这些领域的能力极限，提供全新的生产力。除此以外，在一些高度危险、高度复杂的生产环境中，人工智能也将肩负起突破人类能力极限的重任。


    阿里巴巴一款名为“天巡”的卫星遥感影像智能解译产品，将人工智能深度学习技术融合到遥感影像的解译中，实现了遥感影像数据的自动化解译，将传统解译方案需要的几个月的解译时间缩短到几个小时。在提升解译效率的同时，自动解译产品的分析能力相对于传统解译方式也有较大提高，针对新增建筑的解译准确率能够达到95%。在自然资源部与农业农村部联合推动的“全国大棚房问题专项整治行动”中，已率先利用这项技术以大棚房监管为突破点，实现90%的监测准确率。


    # 四、利用已有数据来激活业务和商业流程


    在过去20年，中国企业已经普遍进行了信息化和电子化，沉淀出了大量的高价值数据，如市场营销数据、银行的客户金融数据、证券公司的投资数据、零售企业的消费数据等等，这些数据都可以利用人工智能进行“激活”，从数据中找到新的业务价值点、业务流程或客户需求，帮助企业比现在的人工做出更好的业务服务和业务流程。


    许多企业都在使用机器人流程自动化（RPA）工具，使“机器人”能够捕获和解释用于处理事务、处理数据、触发响应和与其他数字系统通信的现有应用，RPA可以执行跨越多个应用的复杂嵌套例程，并与这些系统进行交互，而无需构建复杂死板的系统到系统接口。在大多数情况下，通过使用
    RPA 技术，企业能够将共享服务运营中事务活动的运营成本降低 30% 至 50%，通过与人工智能技术的结合，企业能够将将 RPA 扩展到以前并不适合实施自动化的领域或是提高目前已接入机器人的流程中机器人的产量。


    # 五、精准匹配并找到被忽视潜在逻辑与联系


    人工智能具有强大的数学能力加上足够的计算速度，远远超过人类的计算承载力，可同时处理上百万种情况。大脑可以在由海量数据形成的复杂拓扑网络中，以难以置信的速度放大关键的数据节点，并识别数据间的最优量化关系。这种认知反演的方式突破了“老专家”传统的思维定式，将隐性和碎片化的问题变得显性化，并由此生成新的知识。


    与此同时，数字世界的试错成本远低于物理世界。人工智能就像做微创手术一样，并不需要大量的硬件投入与业务改变，仅通过在虚拟环境中对数据的改动与优化，即可产生明显的价值与收益，且路线不可对可及时调头。因此，人工智能能够帮助企业精准匹配用户需求或业务需求，并且找到原本因为人力、人脑等外部因素限制而无法发现的潜在逻辑与内在联系。


    以人工智能为基础的阿里云工业大脑在应用到攀钢西昌钒钛转炉炼钢工艺后，打通炼钢全流程数据，通过建模分析获得炼钢工艺优化的关键因子，结合专家知识，定位提轧、脱硫和炼钢三个关键工序。通过对这三个工序的深入建模分析，聚焦在脱硫工序，依靠脱硫仿真模型与参数寻优模型寻找最优参数。根据实际测算，通过优化的参数推荐，每生产一吨钢可以节省一公斤铁。对于年产值400万吨钢的攀钢来说，一年的成本节省就在700万以上。'
