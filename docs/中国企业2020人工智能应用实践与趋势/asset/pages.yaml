  md: '2017年9月，支付宝在杭州肯德基KPRO餐厅上线刷脸支付，消费者开通后在自助点餐机上选好餐，进入支付页面，选择“支付宝刷脸付”，然后进行人脸识别，大约需要1–2秒，再输入与账号绑定的手机号，确认后即可支付。支付过程不到10秒。如果不是第一次刷脸卡，直接点击“刷脸支付”，人脸识别后就确认支付，整个过程不到一分钟，完全是秒付，大幅缩短了平时在餐饮店结账等待的时间。


    # 业务模式与工作流程创新


    数字化的商业模式正成为主流，基于数字平台的商业模式、大量数据与技术实现的新模式以及传统商业模式的数字化迭代优化，都让传统商业开始有了数字化的赋能，实现了效率提升与降本增效。这意味着企业必须要进行业务模式与工作流程的创新，而数字化也能够帮助企业，在实质上无法远离人力工作的传统信息化上进行升级迭代。通过数字化、智能化的方式，构建起自动化、人力少干预、流程高并发的业务模式与工作流程。


    业务模式与工作流程创新不仅仅是从海量数据中生成数据洞察，实时且正确地制定决策，更是塑造全新的模式。以温德姆酒店及度假村集团(Wyndham Hotels &
    Resorts)为例，通过数字化创新，该酒店集团开发了能够使用一组业务角色来监视需求并进行费率调整的机器人，将流程实现了数字化。这些机器人运行在我们的数字平台上，并且可以跨功能运行——可以根据需要运行在物业管理、中央预订甚至是数据仓库中。这帮助酒店的收入管理人员（负责观察一组酒店，并根据入住率调整价格）花更多的时间分析市场。


    # 内部IT创新


    传统企业内部IT存在着巨大的创新空间，复杂的内部办公平台、过度关注硬件基础设施、无法连通融合的软件平台、极低的人效比、常年伴随左右的安全风险以及耗资巨大仍然不确定极强的“RAS特性（Reliability,Availability,Serviceability
    可靠性、可用性、可服务性）”，数字化创新在以上诸多方面都能够起到重要作用。


    钉钉是一种全新的数字化工作方式，它通过提供智能移动办公平台，解决企业内部IT的许多日常办公需求，并提供软硬件结合的解决方案，如智能前台机、智能考勤机、人脸考勤机等设备。在西贝莜面村，钉钉帮助其进入了移动互联无纸化办公时代，以审批为例，通过钉钉的审批，各个审批环节都电子化，责任人手机上即可处理，没有及时审批还可以催签，而且审批文件电子存档，审批凭证保管查找方便，合规化。


    # 数字化创新的基础设施与关键技术


    纵观世界文明史，每一次产业技术革命，都给人类生产生活带来巨大而深刻的影响，不断提高人类认识世界、改造世界的能力。当前，数字技术日新月异，应用潜能全面进发，数字经济正在经历高速增长、快速创新，并广泛渗透到其他经济领域，数字化创新正深刻改变世界经济的发展动力、发展方式，重塑社会治理格局。未来几十年，是数字化创新改造提升旧动能、培育壮大新动能的发展关键期，是全面繁荣数字经济的战略机遇期。发展契机转瞬即逝，谁能抓住机遇，谁就能赢得发展先机。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_5_0.png)


    原创性数字化技术和融合性创新是数字化创新的两种重要形式。互联网、云计算、大数据、机器智能、物联网、区块链等原创性数字化技术应用于信息的采集、存储、分析和共享过程中，改变了社会互动方式。数字化、网络化、智能化的信息通信技术使现代经济活动更加灵活、敏捷、智慧。其中产业数字化的融合性创新尤为关键，即传统行业利用数字产业的创新而带来的产出增加和效率提升，例如工农业应用人工智能和大数据等数字技术，融合性创新生产工艺和流程，从带来的产量和效率的增加。'
