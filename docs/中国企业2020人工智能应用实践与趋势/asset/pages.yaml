  md: '但无论是BP算法还是十年后与卡斯帕罗夫展开历史上首次“人机大战”的 Deep Blue，人工智能在当时严重的受到了算力不足的影响，事实上，即使是2006年Geoffrey
    E. Hinton正式提供深度学习并进行实证，算力不足仍然困扰着人工智能业界。


    很多人工智能业界的专家认为，在弱人工智能时代（现阶段），算力是最重要的人工智能发展影响因素，DeepMind 杰出研究科学家Richard S. Sutton
    就认为，利用算力才是王道，在其基础上搜索和算法才能带来技术水平的长期提升。


    他认为，AI 研究人员常常试图在自身智能体中构建知识，从短期看，这通常是有帮助的，能够令研究人员满意，但从长远看，这会令研究人员停滞不前，甚至抑制进一步发展，突破性进展最终可能会通过一种相反的方法——基于以大规模计算为基础的搜索和学习。最后的成功往往带有一丝苦涩，并且无法完全消化，因为这种成功不是通过一种令人喜欢、以人为中心的方法获得的：“通用方法非常强大，这类方法会随着算力的增加而继续扩展，即使可用计算变得非常大。搜索和学习似乎正是两种以这种方式随意扩展的方法。”


    当然，许多业界专家与Richard S. Sutton的想法存在差异，但算力的重要性毋庸置疑，而近年来，与人工智能相关的算力也确实得到的长足的进展，并呈现出一定的趋势。


    # # 01 人工智能算力需求暴增，异构计算成为主流


    根据IDC公布的《2018年中国AI基础架构市场调查报告》显示，2018年中国AI基础架构市场销售额同比增幅高达132%，整体销售额达到13.18亿美元。此外，根据OpenAI的分析报告，从2012年开始，AI训练所用的计算量呈现指数增长，平均每3.43个月便会翻倍，截止目前计算量扩大了30万倍。到2020年前，AI所需的计算量预计还会继续增长12倍。


    随着算力需求的暴增，对算力的合理利用和不同计算单元的协作就变得日益重要，将CPU、DSP、GPU、ASIC、协处理器、FPGA等各种计算单元、使用不同的类型指令集、不同的体系架构的计算单元组成一个混合的系统执行计算，让每一种不同类型的计算单元都可以执行自己最擅长的任务，从而大幅度提高人工智能计算的效率和速度。


    总的来说，不同处理器芯片在构建异构计算方面有着自己的鲜明特点。CPU、GPU领域存在大量的开源软件和应用软件，任何新的技术首先会用CPU来实现算法，因此CPU编程的资源丰富而且容易获得，开发成本低而开发周期。


    FPGA的实现采用Verilog/VHDL等底层硬件描述语言实现，需要开发者对FPGA的芯片特性有较为深入的了解，但其高并行性的特性往往可以使业务性能得到量级的提升；同时FPGA是动态可重配的，当在数据中心部署之后，可以根据业务形态来配置不同的逻辑实现不同的硬件加速功能。


    ASIC芯片可以获得最优的性能，即面积利用率高、速度快、功耗低；但是AISC开发风险极大，需要有足够大的市场来保证成本价格，而且从研发到市场的时间周期很长，不适合例如深度学习CNN等算法正在快速迭代的领域。


    # # 02 GPU仍然是人工智能计算的主要算力供给


    同样据《2018年中国AI基础架构市场调查报告》显示，2018年GPU服务器继续保持高速增长，销售额同比大增131.2%，仍然是AI基础架构领域的主流，销售额占比达到99%。


    其中，近8成销售额来自于4卡及以上GPU服务器，占比达到80.4%；16卡GPU服务器增长迅猛，销售额从2017年的2090万美元增长到2018年的2.63亿美元，同比增速高达1161.7%，在GPU服务器整体份额中的比例从2017年的3.7%快速攀升至2018年的20.4%。


    值得注意的是，越来越多的人工智能计算服务器开始使用8 GPU甚至16 GPU卡，这意味着随着数据的爆发式增长、深度神经网络日趋复杂，单系统可提供更高密度、更高性能的AI基础架构，将在AI线下训练场景中得到更广泛应用。此外，IDC的数据显示，用于线上推理场景的加速卡在2018年实现了快速增长。IDC数据显示，GPU中的M4、P4、T4销售额从2017年的4810万美元，增长到2018年的3.6亿美元，份额占比从8.5%提升到27.6%。


    此外，GPU计算正朝着“Non-CPU”方向发展，即不需要计算系统中使用CPU，用户可构建起完全由GPU组成的计算系统。'
