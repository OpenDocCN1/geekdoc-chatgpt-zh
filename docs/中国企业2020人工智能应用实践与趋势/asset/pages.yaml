  md: '2016年法国欧洲杯、2016年里约奥运会、2018年俄罗斯世界杯，这些重大赛事的手机端CCTV5直播方便了广大的收视群体，尤其是赛事集锦的点播和插播尤其受欢迎。手机APP，尤其是视频直播的APP用传统IT架构无法满足需求，必须借助公共云和CDN来实现。央视使用阿里视频云和CDN进行承载，（阿里云CDN拥有全球超过1500个加速节点，120T带宽能力，是国内拥有最多节点的CDN服务商）。这是央视手机客户端视频直播稳定输出和客户良好体验的强大保证。


    整体项目从2016年2月中旬开始，到6月1日开通，不到4个月的时间即完成搭建。随着用户数的不断上涨，到2018年，央视在阿里云上的弹性计算和带宽峰值已经扩展了6倍以上。有力的支撑了CCTV5的峰值直播。


    # CCTV5手机客户端世界杯使用人工智能自动剪辑


    本届俄罗斯世界杯吸引了亿万球迷的关注，每场比赛之后的精彩赛事集锦更是重播度和关注度的焦点所在。和往届不同的是，今年CCTV5手机客户端的每一场精彩集锦，不再依靠传统的人工剪辑，而是全部交给了AI。


    传统的人工剪辑，全流程至少需要30分钟，而AI能够在每场比赛结束后3分钟之内生成集锦，比赛结束后能迅速在CCTV5客户端上发布。效率最高提升了10倍，这大大增加了CCTV5手机客户端的用户量和播放量，抢占了这轮世界杯的发布先机。


    基于达摩院人工智能的技术积累，阿里巴巴为CCTV5手机客户端量身打造了全方位的创新多模态视频+音频人工智能剪辑技术，提供计算机视觉、音频、机器学习等技术与体育赛事的结合，从数字化剪辑、数字化体验、数字化竞技和数字化传播等几个方面推动世界杯手机直播和赛事剪辑的数字化升级。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_37_0.png)


    图：基于视频云和CDN的CCTV5客户端受到年青人欢迎


    经过世界杯比赛精彩赛事剪辑的实际发布效果检验，精彩集锦的片段选择合理性、视频和解说音频片段的完整度、片段剪辑精准度、整体呈现效果都收获了广大球迷用户的认可和满意。AI的加入，大大释放了人工剪辑工作量、增加了内容露出的时效性。


    此外阿里和央视还一起共同打造了央视的新媒体广告平台，基于阿里营销引擎，除了统一新媒体广告平台以外，还可以实现人群定向、广告精准投放等功能。不但广告内容投放独立（和内容投放相互不影响），而且在广告营销领域实现了精准营销的新功能，获得广大广告投放商的好评。


    # 优酷开设“高清经典”专区：经典老剧标清修复成高清


    随着融合媒体的发展和时代的变迁，越来越多的经典影视老片被人们追忆回看，虽然老片的内容引人入胜，但其画质由于当时的拍摄和存储条件等限制往往非常低劣，影响人们的观影体验，而手工翻新动辄千万级别的投入又使得仅仅少量内容可以得到这样的机会。'
