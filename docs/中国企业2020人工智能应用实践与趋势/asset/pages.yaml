    # 以深度学习为主特点的AI第三次浪潮


    关于第三次AI浪潮回归的起点众说纷纭，学界认为人工智能第三次浪潮源于2006年Geoffery Hinton表明“深度信念网络”（Deep Believe
    Network）可以被一种名为“贪婪逐层预训练（Greedy layer-wise pre-training）”的策略进行高效训练快速收敛的理论。这种训练策略的出现使得之前不可能被有效训练地深度神经网络变得可被训练，大大提升了模型训练效率和输出的准确性，从而认证了‘深度学习’这一概念的可行性。


    行业界认为人工智能的第三次复兴应追溯到2012年的ImageNet挑战赛，Geoffery Hinton和其学生 Alex Krizhevsky 研发了一种名叫AlexNet的深度神经网络，在挑战赛中成功地将图片识别错误率降低了10.8个百分点。


    深度学习又是如何定义呢？它是机器学习中一种基于对数据进行表征学习的方法。表征学习指使用机器学习的方法挖掘定义输入数据特性的表示特征本身，而不仅仅只是简单地提取表示做输入和输出之间的关系映射。人工智能、机器学习、表征学习和深度学习之间是包含与被包含的所属关系。


    ![](img/a66911e9fba9d642937cd9d0af9ec51c_12_0.png)


    图：人工智能、机器、表征和深度学习的所属关系


    和20世纪90年代的系统做对比，21世纪的深度学习模型有着三个显著特点： 1）系统规模及复杂性； 2）过程训练高效性； 3）结果预测准确性。2000年以后深度学习模型的总体规模经过50年的迭代后发生了很大程度的跃迁。除了上文所述的“贪婪逐层预训练”的机制让深度学习网络的训练变得更可行之外，第三次浪潮中深度学习的成功很大程度上依赖于其算法模型的规模指数级升级。模型规模取决于深度学习中层体（隐藏层）的深度以及每层神经元的联结稠密度。2015年后，模型中神经元连接的数量级（10³）已经可以匹配于较小的哺乳动物（老鼠），离人类神经元的规模（＞10⁴）还有一定距离。而就神经元总数来说，深度模型目前从1985的蝎虎水平（＞10²）跨越到了蜜蜂的量级（10⁶），但与人类规模还相差甚远（＞10¹¹）。更大体量的网络、更高密度的系统可以在真实环境中处理更复杂的问题并得出更精准的结论。这种规模的增长是以更大的存储空间、更快的计算速度作为底层技术支撑和驱动的。从20世纪50年代开始，系统通过不断地演化提高性能（下图），科学家推测按照目前这种进化速度，到本世纪50年代，神经网络能具备与人脑相同数量级别的神经元与连接稠密程度。'
