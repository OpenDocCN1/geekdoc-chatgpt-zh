    ## 四、人工智能标准体系建设


    2020年7月，国家标准委、中央网信办、发展改革委、科技部、工业和信息化部联合印发《国家新一代人工智能标准体系建设指南》（国标委联〔2020〕35号）（以下简称《指南》）。《指南》提出了适合现阶段的人工智能标准体系。


    人工智能标准体系由中国电子技术标准化研究院牵头，依托国家人工智能标准化总体组，汇聚国内主流的人工智能领域产学研用单位支撑编制。标准体系是人工智能标准化的顶层设计，用于指导人工智能标准化工作，支撑人工智能技术研发和产业发展。


    ### 4.1 标准体系编制原则


    标准体系编制坚持以下原则：


    - （1）指导性原则。为未来两年国家标准立项和综合标准化专项的设立提供依据，指导人工智能标准的研制，引导企业参与并提出重点标准；

    - （2）可用性原则。在指导标准研制的同时，注重标准验证和落地应用，构建满足产业发展需求、先进适用的人工智能标准体系；

    - （3）阶段性原则。关注当前我国人工智能发展的实际需求，综合考虑人工智能技术发展和应用水平，满足未来两年我国人工智能标准体系建设的需要。


    ### 4.2 标准体系结构


    人工智能标准体系结构包括“A基础共性”、“B支撑技术与产品”、“C基础软硬件平台”、“D关键通用技术”、“E关键领域技术”、“F产品与服务”、“G行业应用”、“H安全/伦理”等八部分，如图4所示。


