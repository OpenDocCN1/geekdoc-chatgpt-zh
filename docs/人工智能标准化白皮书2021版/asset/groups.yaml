    TOPS INT8算力，功耗仅有480W；2）敏捷部署：半天即可完成对接及调试；3）边缘本地化部署，保障数据安全。


    # (3) 方案实施后的价值或成果


    该方案的实施有效提供了诊断速度、精准度，并且改善了疗效评估，体现在：1）筛查病患的速度大幅提升，将医生15分钟的工作量压缩到10秒；2）有效保障诊断精准度：将准确率从传统的70%提高的90%；3）有效评估治疗疗效：通过人工智能与人工的交叉又检验疗效，提供患者疗效评估的有效性。与英伟达类似方案相比，本方案有效降低成本约20%。


    该方案同时采取分级部署形式，通过将人工智能一体机和发热门诊CT共同部署，实现诊断数据的实时上报，使上级卫健委指挥中心及时、准确获取疫情现状。


