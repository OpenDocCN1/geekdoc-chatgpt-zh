    # 五、人工智能标准化工作重点建议


    基于人工智能技术和产业发展现状，结合标准化工作进展及标准体系建设情况，提出我国人工智能标准化重点工作建议。


    # （1）完善工作机制，助力产业健康可持续发展


    人工智能正在与实体经济深度融合，人工智能标准化工作呈现出多领域协同参与的态势。一是通过全国信标委人工智能分技术委员会（SAC/TC 28/SC 42），统筹推进人工智能、物联网、云计算、大数据等新一代信息技术领域的标准化工作，加强人工智能在垂直领域的应用。二是发挥好国家人工智能标准化总体组平台作用，协调实体经济相关领域的人工智能标准研制，吸纳政产学研用各方力量，共同推进人工智能标准化工作。


    # （2）研制重点标准，完善人工智能标准体系


    以“优势先行、成熟先用、基础统领、应用牵引”为原则，推动人工智能重点标准研制。一是夯实产业基础，重点研制性能基准、硬件虚拟接口、开发框架兼容规范等标准。二是支撑产业应用，围绕智能语音、计算机视觉等具备一定产业规模的领域，研制一批产业应用标准。三是推动融合发展，以支撑人工智能与实体经济深度融合发展为目标，研制一批智慧交通、智慧医疗、智慧课堂等行业应用标准。


    # （3）开展试点示范，提升产业服务能力


    我国人工智能标准化工作稳步推进，相关标准正在陆续发布，需要各级政府及相关部门发挥引导作用，加强对人工智能标准化的宣传推广。一是围绕机器学习模型、机器翻译能力等级评估等重点标准，开展宣贯活动，将标准应用和人工智能产业发展相结合。二是推动标准符合性评估体系建设，重点选取国家人工智能创新应用先导区、国家新一代人工智能创'
  - '[PAGE 44]


    新发展试验区，开展标准应用示范。三是建设人工智能标准化公共技术服务平台，提升标准化对产业的服务能力，支撑基础共性技术研发、第三方评价等工作。


    # (4) 打造事实标准，提升行业竞争能力


    事实标准是行业竞争的杀手锏。通过总结DCMM、ITSS、CMMI等信息技术标准的推广经验，探索我国人工智能事实标准的培育模式。结合重大工程和重大项目，围绕开源社区、新型基础设施建设，通过咨询培训、测试评估、产品认证等手段，促进标准规模化推广应用，打造一批人工智能事实标准。


    # (5) 强化国际交流，推动中国智慧走出去


    一是积极对接ISO/IEC JTC 1等国际标准组织，持续加强人工智能国际标准参与力度。二是依托国家人工智能标准化总体组、全国信标委人工智能分技术委员会，组织国内标准化机构和企业，参与国际标准制修订工作，为国际标准提案贡献中国智慧。三是支持国内专家在国际标准化组织中承担秘书、召集人等职务，提升国际话语权。四是积极承办人工智能相关的国际会议和论坛，深化人工智能领域的双边多边合作，实现互利共赢。'
