    图4 人工智能标准体系结构


    （1）基础共性标准。人工智能是一个复杂的系统工程，涉及到多方面的基础性问题，规范其所涉及的这些基础性问题，是人工智能科学全面应用的前提。该部分重点开展人工智能术语、参考架构、通用性测试评估等标准研制工作，对标准体系结构中其它部分起基础支撑作用。


    （2）支撑技术与产品标准。人工智能基于物联网产生并存储于云平台的海量数据资源，通过大数据分析技术，利用计算存储资源池和智能算法为各行业应用提供智能化服务。该部分重点围绕支撑人工智能发展，与人工智能强相关的智能运算资源应用服务领域的标准化工作。


    （3）基础软硬件平台标准。作为人工智能落地至关重要的基础软硬件设施，智能芯片、系统软件、开发框架提供了人工智能应用开发所需要的工具集合，实现软硬一体思路下算法、芯片、软件、系统的协同优化。该部分重点围绕人工智能芯片、硬件基础设施、开发框架的算力及功能等需求，开展标准研制工作。


    （4）关键通用技术标准。机器学习、知识图谱、类脑智能计算、量子智能计算、模式识别作为人工智能的关键性通用技术，是人工智能在关键领域应用技术的基础。以机器学习为例，其在智能语音识别、自然语言处理、目标检测、视频分类等领域取得了一定成果。该部分主要针对关键通用技术的特点，围绕模型、系统、性能评价等开展标准研制工作。


    （5）关键领域技术标准。自然语言处理、智能语音、计算机视觉、生物特征识别、虚拟现实/增强现实、人机交互等关键领域技术是目前人工智能应用于实体经济的重要驱动力。该部分主要开展语言信息提取、文本处理、语义处理、语音识别与处理、图像识别合成、图像识别与处理、人体生理特征或行为特征识别、虚拟现实/增强现实、智能感知、多模态交互等标准研制工作。


    （6）产品与服务标准。针对人工智能技术形成的智能化产品及服务模式，智能机器人、智能运载工具、智能终端、智能服务将人工智能领域技术成果集成化、产品化、服务化。该部分重点为提升人工智能产品和服务质量水平，主要开展服务机器人、工业机器人、行驶环境融合感知、移动智能终端、智能服务等相关标准研制工作。


    （7）行业应用标准。位于人工智能标准体系结构的最顶层，标准体系中所指的行业应用是依据国务院印发的《新一代人工智能发展规划》，结合当前人工智能应用发展态势而确定的人工智能标准化重点行业应用领域。该部分主要面向行业中与人工智能强相关的具体需求，开展标准化工作，支撑人工智能在行业应用的发展。


    （8）安全/伦理标准。位于人工智能标准体系结构的最右侧，贯穿于其他部分，包括人工智能领域基础，数据、算法和模型，技术和系统，管理和服务，安全测试评估，产品和应用等信息安全相关标准，以及涉及传统道德和法律秩序的伦理标准。支撑建立人工智能合规体系，保障人工智能产业健康有序发展。


    ### 4.3 标准体系框架


    人工智能标准体系框架主要由基础共性、支撑技术与产品、基础软硬件平台、关键通用技术、关键领域技术、产品与服务、行业应用、安全/伦理八个部分组成，如图5所示。


    人工智能标准体系是人工智能标准化工作的顶层设计，国内标准化组织和机构根据人工智能标准体系开展标准化工作。据梳理，本白皮书3.5节中涉及的国内标准化组织，已发布、报批、在研以及拟研制的人工智能标准共215项，详见附件2。


    ![](img/951a2171a213838862fedd56f63c7110_36_0.png)


    图5 人工智能标准体系框架


    ### 4.4 标准体系建设的要点


    - （1）避免多领域交叉冲突。人工智能在各行业的应用落地涉及大数据、云计算等多种技术，人工智能标准体系与大数据、云计算等支撑技术，机器人、智能运载工具等产品，智能制造、智慧城市、智能政务等行业的相关标准体系存在交集，但非包含或覆盖关系。人工智能标准体系编制过程中充分调研了《智能制造标准体系建设指南》《国家机器人标准体系建设指南》《国家车联网产业标准体系建设指南（智能网联汽车）》等规划，此处涉及的交集皆指与人工智能强相关的部分或环节，为避免矛盾，相关内容直接参考已有规划。


    - （2）建立动态更新完善机制。随着人工智能的发展，人工智能在各个垂直领域的应用落地新模式将不断涌现，“人工智能+”将全面开花，新一代人工智能标准体系也将进一步更新完善。以本标准体系为起点，持续关注我国人工智能在转型升级中的实际需求，综合考虑因科技发展而出现的新技术和新应用，通过建立动态更新完善机制，以满足我国人工智能标准体系建设的需要。


    - （3）正确把握与技术和产业发展的关系。需注意本标准体系中标准化建设重点与人工智能发展进程中标准需求的不定性、未知性、突发性存在着差距。应注意在人工智能技术和产业发展进程中，市场环境、产业需求变幻无穷，其标准需求也可能瞬息万变，本标准体系中提及的标准建设重点仅做引导、支撑产业发展用途，不代表人工智能技术、产业发展的趋势或目标。


    ### 4.5 重点标准研制


    近期人工智能领域将重点推动以下标准的制定、试验验证、试点应用工作。


    - （1）《信息技术 人工智能 深度学习框架多硬件平台适配技术要求》


    《信息技术 人工智能 深度学习框架多硬件平台适配技术要求》规定了深度学习框架适配多硬件平台的技术方案，包括云侧与端侧场景适配不同组合的操作系统、训练芯片、推理芯片，并基于不同的适配方案定义了深度学习框架指标体系，规范深度学习框架与硬件平台的兼容适配及优化等关键技术。该标准为建立国产人工智能软硬件协同能力提供依据。深度

