    ### (2) 《信息技术 人工智能 资源管理规范 第1部分：计算虚拟化》


    《信息技术 人工智能 资源管理规范 第1部分：计算虚拟化》规定人工智能虚拟化技术框架以及相关的接口要求，关于人工智能计算任务中需要的虚拟化能力、调度能力的指标。该标准可用于指导人工智能计算虚拟化系统的设计、研发、测试。人工智能计算资源管理系统如图7所示，算法应用层是开发者和用户在深度学习框架的基础上进行算法设计，然后下发给资源调度层进行算法的计算执行。资源调度层根据下发的计算任务和资源池的情况，完成任务的分配，弹性的选择虚拟化后的AI计算实例。虚拟化方案对物理AI加速卡（CPU、GPU、FPGA、NPU）进行虚拟化，得到不同规格的AI计算实例，形成资源池，并接入资源调度层提供的统一接口。


    ![](img/951a2171a213838862fedd56f63c7110_39_0.png)


    ### 图7 人工智能计算资源管理系统


    ### (3)《信息技术 人工智能 服务器系统性能测试规范》


    《信息技术 人工智能 服务器系统性能测试规范》规定了人工智能服务器系统（含服务器、服务器集群、高性能计算集群等）的性能测试方法。人工智能服务器性能测试框架如图8所示。该标准在人工智能服务器的训练、推理两种工作模式下，对性能测试的测试过程、测试规则以及测试场景进行了标准化设计，保证数据集、测试工具、测试指标、测试结果的公平性与科学性。


    ![](img/951a2171a213838862fedd56f63c7110_39_1.png)


    ### 图8 人工智能服务器性能测试框架


    ### (4)《信息技术 人工智能 风险评估模型》


    《信息技术 人工智能 风险评估模型》规定了人工智能领域产品的风险评估模型，包括风险能力等级、风险要素、风险能力要求，给出了判定人工智能产品的风险评估等级的方法。人工智能风险评估模型整体框架如图9所示。该标准可以指导人工智能产品开发方、用户方以及第三方等相关组织对人工智能产品风险开展评估工作。


    ![](img/951a2171a213838862fedd56f63c7110_40_0.png)


    ### （5）《人工智能 面向机器学习的系统规范》


    《人工智能 面向机器学习的系统规范》规定了面向机器学习的系统的技术要求和测试方法。该标准用于各领域面向机器学习的系统及解决方案的规划、设计，可作为评估、选型及验收的依据。


    ### （6）《信息技术 人工智能 平台计算资源要求》


    《信息技术 人工智能 平台计算资源要求》规定人工智能计算资源及其调度的技术要求，用于指导人工智能计算资源组合、调度系统或子系统的设计、研发和评估。


    ### （7）《人工智能 服务能力成熟度评估规范》


    《人工智能 服务能力成熟度评估规范》规定了人工智能服务能力成熟度评估规范，规定了成熟度等级、能力框架和评估方法。该标准用于对服务提供商提供的人工智能服务能力的成熟度评估，以及服务能力成熟度模型中某项能力主域、能力子域的单项评估。


    ### (8) 《信息技术 人工智能 面向机器学习的数据标注规程》


    《信息技术 人工智能 面向机器学习的数据标注规程》规定了面向机器学习的数据标注流程框架及具体标注流程。该标准用于指导面向人工智能研究或开发应用的企业、高校、科研院所、政府机构实施数据标注。


    ### (9) 《人工智能 隐私保护机器学习技术要求》


    《人工智能 隐私保护机器学习技术要求》规定了隐私保护机器学习系统的技术要求，来规范隐私保护机器学习系统的技术框架及流程、功能要求、非功能性要求和安全要求。该标准用于指导科技企业、用户机构、第三方机构等，对隐私保护机器学习系统的设计、开发、测试、使用、运维管理等。


    ### (10) 《信息技术 神经网络表示与模型压缩 第1部分：卷积神经网络》


    《信息技术 神经网络表示与模型压缩 第1部分：卷积神经网络》规定了卷积神经网络模型的基本表示与压缩方法，用于指导神经网络模型的研制、开发、测试评估、应用。


    ## 五、人工智能标准化工作重点建议


    基于人工智能技术和产业发展现状，结合标准化工作进展及标准体系建设情况，提出我国人工智能标准化重点工作建议。


    ### （1）完善工作机制，助力产业健康可持续发展


    人工智能正在与实体经济深度融合，人工智能标准化工作呈现出多领域协同参与的态势。

    - 一是通过全国信标委人工智能分技术委员会（SAC/TC 28/SC 42），统筹推进人工智能、物联网、云计算、大数据等新一代信息技术领域的标准化工作，加强人工智能在垂直领域的应用。

    - 二是发挥好国家人工智能标准化总体组平台作用，协调实体经济相关领域的人工智能标准研制，吸纳政产学研用各方力量，共同推进人工智能标准化工作。


    ### （2）研制重点标准，完善人工智能标准体系


    以“优势先行、成熟先用、基础统领、应用牵引”为原则，推动人工智能重点标准研制。

    - 一是夯实产业基础，重点研制性能基准、硬件虚拟接口、开发框架兼容规范等标准。

    - 二是支撑产业应用，围绕智能语音、计算机视觉等具备一定产业规模的领域，研制一批产业应用标准。

    - 三是推动融合发展，以支撑人工智能与实体经济深度融合发展为目标，研制一批智慧交通、智慧医疗、智慧课堂等行业应用标准。


    ### （3）开展试点示范，提升产业服务能力


    我国人工智能标准化工作稳步推进，相关标准正在陆续发布，需要各级政府及相关部门发挥引导作用，加强对人工智能标准化的宣传推广。

    - 一是围绕机器学习模型、机器翻译能力等级评估等重点标准，开展宣贯活动，将标准应用和人工智能产业发展相结合。

    - 二是推动标准符合性评估体系建设，重点选取国家人工智能创新应用先导区、国家新一代人工智能创新发展试验区，开展标准应用示范。

    - 三是建设人工智能标准化公共技术服务平台，提升标准化对产业的服务能力，支撑基础共性技术研发、第三方评价等工作。


    ### (4) 打造事实标准，提升行业竞争能力


    事实标准是行业竞争的杀手锏。通过总结DCMM、ITSS、CMMI等信息技术标准的推广经验，探索我国人工智能事实标准的培育模式。结合重大工程和重大项目，围绕开源社区、新型基础设施建设，通过咨询培训、测试评估、产品认证等手段，促进标准规模化推广应用，打造一批人工智能事实标准。


    ### (5) 强化国际交流，推动中国智慧走出去


    - 一是积极对接ISO/IEC JTC 1等国际标准组织，持续加强人工智能国际标准参与力度。

    - 二是依托国家人工智能标准化总体组、全国信标委人工智能分技术委员会，组织国内标准化机构和企业，参与国际标准制修订工作，为国际标准提案贡献中国智慧。

    - 三是支持国内专家在国际标准化组织中承担秘书、召集人等职务，提升国际话语权。

    - 四是积极承办人工智能相关的国际会议和论坛，深化人工智能领域的双边多边合作，实现互利共赢。


