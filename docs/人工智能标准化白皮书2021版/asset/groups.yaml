    ### 3.5.1 全国信息技术标准化技术委员会


    全国信息技术标准化技术委员会（SAC/TC 28）与国际标准化组织ISO/IEC JTC 1对口。其中人工智能分技术委员会（SAC/TC 28/SC 42）于2020年3月成立，国际对口ISO/IEC
    JTC 1/SC 42，负责人工智能基础、技术、风险管理、可信赖、治理、产品及应用等人工智能领域国家标准制修订工作。


    除人工智能分技术委员会以外，SAC/TC 28还开展了人机交互、生物特征识别、计算机视觉等人工智能相关领域的标准化工作。用户界面分技术委员会（SAC/TC
    28/SC 35）在人机交互领域成立开展智能语音、体感交互等标准研制。生物特征识别分技术委员会（SAC/TC 28/SC 37）在生物特征识别方面开展了指纹识别、人脸识别、生物特征样本等标准研制。计算机图形图像处理及环境数据分技术委员会（SAC/TC
    28/SC 24）在计算机图形图像处理、增强现实等领域开展了标准研制。


    此外，全国信标委大数据标准工作组、云计算标准工作组、物联网标准工作组、国家传感器网络标准工作组等标准化组织在SAC/TC 28的组织引领下，也开展了相关领域基础标准研制，为人工智能技术及应用提供支撑。


