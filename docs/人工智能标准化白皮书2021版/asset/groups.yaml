    Engineers, IEEE ) 主要聚焦人工智能领域伦理道德标准，2017年3月，发表《旨在推进人工智能和自治系统的伦理设计的IEEE全球倡议书》，倡议建立人工智能伦理的设计原则和标准，帮助人们避免对人工智能技术产生恐惧和盲目崇拜。


