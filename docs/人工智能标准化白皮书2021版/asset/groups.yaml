    # # 一、前言


    党中央、国务院高度重视新一代人工智能发展。习近平总书记指出：“人工智能是引领这一轮科技革命和产业变革的战略性技术，具有溢出带动性很强的‘头雁’效应”。“加快发展新一代人工智能是我们赢得全球科技竞争主动权的重要战略抓手”。为应对新冠肺炎疫情的冲击，党中央国务院将新型基础设施建设上升为国家战略，其中重要的一项就是人工智能。国务院发布实施了《新一代人工智能发展规划》等文件，以新一代人工智能技术的产业化和集成应用为重点，以加快人工智能与实体经济融合为主线，着力推动人工智能技术、产业全面健康发展。


    在政产学研用各方共同努力下，我国人工智能产业发展的成果显著。一是创新能力不断增强，图像识别、智能语音等技术达到全球领先水平，人工智能论文和专利数量居全球前列。二是产业规模持续增长，京津冀、长三角、珠三角等地形成了完备的人工智能产业链。三是融合应用不断深入，智能制造、智慧交通、智慧医疗等新业态、新模式不断涌现，对行业发展的赋能作用进一步凸显。


    我国人工智能产业发展取得显著成绩的同时，面临着不少困难和挑战，比如底层技术存在较大欠缺、能够实现商业价值的应用较少、与实体经济的融合存在较高门槛等。《中共中央关于坚持和完善中国特色社会主义制度
    推进国家治理体系和治理能力现代化若干重大问题的决定》指出要“强化标准引领，提升产业基础能力和产业链现代化水平”。人工智能产业的发展离不开标准的引领，扎实做好人工智能标准化工作，对突破核心技术、加快应用落地、完善产业生态具有重要意义。


    本白皮书在《人工智能标准化白皮书（2018版）》的基础上，进一'
  - '[PAGE 8]


    步提出了以下内容：一是从产业链的角度，分析了人工智能产业现状及发展趋势；二是介绍了当前国际上普遍认可的系统生命周期模型、人工智能生态系统框架和机器学习技术框架；三是梳理了国内外主要人工智能标准化组织的重点工作；四是落实《国家新一代人工智能标准体系建设指南》（国标委联〔2020〕35号），形成人工智能标准体系框架及标准体系明细表；五是结合标准化工作进展及标准体系建设情况，提出我国人工智能标准化重点工作建议。'
  - '[PAGE 9]


    # 二、人工智能现状及发展趋势


    人工智能是新一轮科技革命和产业变革的重要驱动力量。麦肯锡公司的数据表明，人工智能每年能创造3.5万亿至5.8万亿美元的商业价值，使传统行业商业价值提升60%以上。


    我国人工智能市场规模巨大、企业投资热情高。埃森哲公司的数据显示，半数（49%）的中国人工智能企业，近三年的研发投入超过0.5亿美元。IDC预测，到2023年中国人工智能市场规模将达到979亿美元。为实现人工智能产业高质量发展，提升产业链、供应链现代化水平，《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》提出：“发展算法推理训练场景，推动通用化和行业性人工智能开放平台建设”，并要求在前沿基础理论、专用芯片、深度学习框架等前沿领域重点攻关，实施一批具有前瞻性、战略性的国家重大科技项目。


    人工智能产业链包括基础层、技术层和应用层：基础层提供了数据及算力资源，包括芯片、开发编译环境、数据资源、云计算、大数据支撑平台等关键环节，是支撑产业发展的基座。技术层包括各类算法与深度学习技术，并通过深度学习框架和开放平台实现了对技术和算法的封装，快速实现商业化，推动人工智能产业快速发展。应用层是人工智能技术与各行业的深度融合，细分领域众多、领域交叉性强，呈现出相互促进、繁荣发展的态势。'
  - '[PAGE 10]


    # 2.1 基础层


    # 2.1.1 发展现状


    **(1) 算力需求不断提升，人工智能芯片成为产业焦点**


    芯片作为算力基础设施，是推动人工智能产业发展的动力源泉。随着人工智能算法的发展，视频图像解析、语音识别等细分领域算力需求呈爆发式增长，通用芯片已无法满足需求。而针对不同领域推出专用的芯片，既能够提供充足的算力，也满足低功耗和高可靠性要求。如华为、寒武纪、中星微等企业推出的推理芯片产品，应用于智能终端、智能安防、自动驾驶等领域，可以对大规模计算进行加速，满足更高的算力需求。


    **(2) 数据总量爆发式增长，支持产品和服务智能化水平提升**


    国内各行业已经普遍实现了信息化，沉淀出了大量数据。据国家信息中心预测，到2025年，我国数据总量将占全球27%，成为世界第一数据资源大国。这些数据中不乏金融、市场营销、消费等具有潜在价值的数据。人工智能可以从数据中找到业务价值点和客户需求，帮助企业提供更好的业务服务。


    # 2.1.2 存在的问题及挑战


    # (1) 硬件方面


    一是利用率低，传统硬件架构难以完全满足人工智能对密集计算的要求。二是兼容性差，面向不同场景的人工智能计算硬件指令集、微架构设计不同，缺乏统一的标准规范，无法兼容。


    # (2) 使能软件方面


    一是工具融合程度有待提升。人工智能编译工具由不同的硬件、软件生产者提供，工具完整性、融合程度、效率等没有统一的衡量标准。二是设备间协同困难。不同的智能设备间协议不同，无法实现互联互通。'
  - '[PAGE 11]


    # (3) 数据方面


    一是数据的采集和使用有待规范。人工智能是“数据密集型”行业，安全有效地采集、管理和使用数据，支撑人工智能实践，已成为制约人工智能应用系统建设的瓶颈。二是数据存在安全风险。需要制定高效的预防措施，确保数据安全和人工智能的安全、可靠、可控发展，防止被不法分子滥用。


    # 2.1.3 发展趋势分析


    # (1) 芯片形成产业生态


    人工智能的发展，对芯片的计算架构、运算能力、算法适用性等提出新的挑战。同时，芯片只有与应用场景结合，才能落地，形成了芯片、场景相互绑定的产业生态。


    # (2) 数据利用更加高效


    进入大数据时代后，人工智能系统可利用的数据资源从样本数据转变为大规模多源异构数据，海量高价值数据不断提高人工智能预测的准确性，并促进人工智能技术在多场景的深度应用。


    # 2.2 技术层


    # 2.2.1 发展现状


    人工智能深度学习框架实现了对算法的封装。随着人工智能的发展，各种深度学习框架不断涌现。谷歌、微软、亚马逊和Facebook等巨头，推出了TensorFlow、CNTK、MXNet、PyTorch和Caffe2等深度学习框架，并广泛应用。此外，谷歌、Open
    AI Lab、Facebook还推出了TensorFlow TFLite、Tengine和QNNPACK等轻量级的深度学习框架。


    近年来，国内也涌现出了多个深度学习框架。百度、华为推出了'
  - '[PAGE 12]


    PaddlePaddle（飞桨）、MindSpore，中科院计算所、复旦大学研制了Seetaface、FudanNLP。小米、腾讯、百度和阿里，推出了MACE、NCNN、Paddle
    Lite、MNN等轻量级的深度学习框架。国内深度学习框架在全球占据了一席之地，但美国的TensorFlow和PyTorch仍是主流。


    # 2.2.2 存在的问题及挑战


    # ( 1 ) 人工智能算法遇到技术瓶颈


    一是泛化性弱。人工智能模型训练后可以达到理想的性能，但应用场景与训练环境场景区别较大时，性能会显著下降。二是易受到对抗样本攻击。人视觉或听觉无法感知的扰动，可能会使模型输出错误结果。


    # ( 2 ) 深度学习框架依赖生态建设


    在应用方面，TensorFlow、PyTorch等通用型深度学习框架，应用于自然语言处理、计算机视觉、语音处理等领域，以及机器翻译、智慧金融、智能医疗、自动驾驶等行业。各细分领域还涌现出大批专业型深度学习框架，如编写机器人软件的ROS、应用于计算机视觉领域的OpenCV、擅长自然语言处理的NLTK，以及应用于增强现实的ARTToolKit等。


    我国深度学习框架起步较晚，在算法、芯片、终端和场景应用方面都依赖国外的深度学习框架生态。


    # ( 3 ) 人工智能测试体系不够全面


    一是测试重复度高。现有测试基准的测试内容和模型重复度高，但又有遗漏；二是体系化设计与建设有待加强，尚未形成成熟的功能、性能测试基准；三是人工智能测试标准体系还未形成，公平性和权威性有待完善。


    # 2.2.3 发展趋势分析


