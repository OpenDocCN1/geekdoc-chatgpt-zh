    ### (2) 具体解决方案介绍


    云天励飞2019年为成都市公安局双流分局交付了一套深海多维大数据系统。系统以“人像为核心”，在新建感知源的同时，也整合天网、智能交通等分局既有数据，整合“人车非”视频全要素，融合通信、交通、身份信息等数据，借助云天励飞底层聚类归档的天图引擎、以及百亿级关系图谱能力的天谱引擎等人工智能大数据分析能力，打造了一套融合GIS的区域级轨迹分析、全域布控预警、城市级人车档案、图码联侦、全息关系图谱、多种管控枝战法于一体的智慧警务应用系统，全面提升了双流分局警务实战效能，同时也推动了新型人工智能能力下智慧警务机制的衍生，为区域“打防管控服”提供警务有效保障。


    ![](img/951a2171a213838862fedd56f63c7110_83_0.png)


    2019年以来，成都市公安局双流区分局紧紧抓住我区大力推动人工智能产业发展有利契机，以“空港智慧警务”建设为载体全力提升城市智慧治理水平，建成西南地区首个“区域级”人像轨迹系统。自2019年8月“空港智慧警务”应用平台正式运行以来，共采集动态人像图片32亿余张，分局各警种系统登录使用35020余次，人脸检索231750余次，协助抓获各类违法犯罪嫌疑人950余人（其中网上逃犯200余人），协助找回各类走失人员200余人，协助破获“2020.1.9金店抢劫案”、“2020.2.11白云西街故意杀人案”、“杜某芳被故意伤害致死案”、“6.14故意杀人案”等大要案。

