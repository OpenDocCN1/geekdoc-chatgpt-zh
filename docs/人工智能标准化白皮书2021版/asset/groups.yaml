    ## 应用案例


    根据人工智能应用场景，本白皮书选编了9个典型应用案例，限于篇幅，每个案例仅是简要介绍，感兴趣的读者可以联系案例单位获取进一步信息。


    ### 案例一：智慧城市人工智能中台解决方案


    - 应用领域：人工智能+城市

    - 应用场景：智慧城市“一网统管”

    - 案例提供者：上海依图网络科技有限公司


    ### (1) 客户需求与方案简介


    在新型智慧城市治理和管理模式中，依图科技基于“云—边—端”的技术架构构建支持分布式联动的算力平台和人工智能中台，成为智慧城市创新技术解决方案。某市推出一网通办、一网统管，统筹解决城市管理、社会治理、企业及民生问题。通过人工智能、物联网、大数据等现代化信息手段和基于国产人工智能深度学习芯片的视频解析一体机等算力基础设施进行城市数字化建设，进而推动跨部门的协同打通，增强基层人员和管理组织的科学决策的能力。利用智能化的手段，做到机器感知、自动派单、业务闭环，真正做到应用为要，管用为王。


    ### (2) 具体解决方案介绍


    依图人工智能中台的技术架构如下图所示，其中基础设施是用于支持人工智能中台业务开展的各类计算设施与网络设施，包括云计算设备、边缘计算设备、端侧传感器与计算设备及网络通信设施等。


    市级平台

    市级界面 统计分析 事件中心 算法仓库

    区级平台 街镇平台

    区级界面 统计分析 事件中心 算法仓库 街镇界面 实战场景 事件中心 算法调度 实时演示


    智能交互

    智能认知

    统计分析 高发区域 高发事件 闭环处置 数据关联 派单逻辑 智能结案 智能复核 知识图谱


    智能感知

    划分分域 设备管理 算法仓库（算法管理调度） 视频解析 语音识别 物联感知 边缘算力（算力管理调度） 任务调度 信息存储 流媒体平台（视频流管理调度）

    基础设施

    云计算 传输网 摄像机 物联网 传感器


    安全保护 运维保障


    智能感知层将真实世界的物理量通过传感器设备映射为数字量，并使用视频解析、语音识别、物联感知等人工智能推理技术将其转化为计算机结构化感知数据，通过算法仓库实现各类算法管理和算法调度，结合训练引擎协同实现算法训练的可迭代升级、可自身演进演化。


    智能认知层是基于感知层信息及对语义信息进行理解，并结合常识和领域知识进行更高程度的智能化操作，通过知识推理、知识计算与融合等知识图谱技术为智慧城市上层应用的使用提供决策支撑，实现对城市职能各方面的统筹和管理。


    智能交互层主要面向“街镇—区级—市级”三级平台的应用提供服务，包括可视化界面、统计分析、事件中心、算法仓库、算法调度、实时演示等。


    ### (3) 方案实施后的价值或成果


    实际应用中，某区城运中心联合各个委、办、局，打通数据、资源壁垒，结合城市治理痛点和各部门实际需求，利用依图人工智能中台做到智能发现，智能感知，智能推送，摆脱人为影响，最终各个业务部门做到闭环处置。


    ![](img/951a2171a213838862fedd56f63c7110_65_0.png)


    该项目使用依图自主研发的国产视频解析一体机，接入并解析650路视频流、3511路图片流，未来也可以随着需求的增加，通过平行扩展增加算力；实现诸如人群聚集、区域入侵、徘徊检测、积水检测、违章停车、头盔检测、垃圾识别、公共防偷拍、人物知识图谱等近300种算法，同时可以根据业务场景需求进行相应的配置和调整。系统目前已在多个场景落地，包括街道公共安全管理、校园周边安全管理、幸福养老服务管理、社区文明治理、船舶违停管理等，并取得了理想的效果。


    ### 案例二：高速公路人工智能稽核系统


    - 应用领域：人工智能+交通

    - 应用场景：高速公路稽核

    - 案例提供者：云从科技


    ### (1) 客户需求与方案简介


    我国于2020年1月1日正式撤销省界收费站，实现真正意义上的全国联网收费。取消省界站后，高速公路联网收费打破地域限制，单次通行费用高，逃费诱惑大，诱发了更多逃费方式，如假套牌、屏蔽OBU等。随着路网规模扩大，高速通行数据激增，收费稽核和追缴难度变大，传统以人工为主的稽核方式难以为继。


    云从科技高速稽核人机协同平台通过智能分析挖掘高速公路逃费问题，对“偷、逃、漏”通行费行为形成有效稽核，净化了高速公路通行环境，维护了高速公路良好通行秩序。


    ### (2) 具体解决方案介绍


    方案基于云从科技人机协同平台的人工智能识别引擎，融合高速公路通行交易及其视频图像等多源数据，还原车辆路网行驶轨迹，构建全域协同布控的高速公路高效稽查方案。主要功能如下：


    ![](img/951a2171a213838862fedd56f63c7110_66_0.png)


    - 1) 车辆分析


    车辆ReID，通过深度学习方法提取车辆全景照的特征；车辆属性分析，包含车辆号牌、品牌、型号、车身颜色；车辆特征分析，包括号牌位置、车身文字、车头摆件、车检标签等。


    - 2) 异常行为分析


    分析识别大车小标、小车大标、倒挂甩挂、屏蔽OBU/CPC、一车多卡/一车多签、有入无出、掉头行驶/网内循环行驶、倒换ETC、闯关等。


    - 3) 全量轨迹点组合轨迹


    通行OBU/ETC介质记录与人工智能识别记录相融合，直观发现路径拟合中的异常问题。

