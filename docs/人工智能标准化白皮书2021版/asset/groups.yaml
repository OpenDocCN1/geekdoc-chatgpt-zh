    # 3.4.2 NIST


    美国国家标准与技术研究院（National Institute of Standards and Technology，NIST）隶属于美国商务部，在美国政府支持下，推进人工智能标准工作。


    2019年8月，NIST发布了《美国人工智能领导力：联邦参与制定技术标准及相关工具的计划》的报告，把“积极参与人工智能标准的开发”列为重要任务。报告提出了联邦政府机构制定人工智能技术及相关标准给的指导意见，认为应优先制定人工智能包容性和可访问性、开放透明、基于共识、具有全球性和非歧视性等方面的标准，并提出了人工智能标准的九个重点领域：概念和术语、数据和知识、人际互动、指标、网络、性能测试和报告方法、安全、风险管理、可信赖。


    2020年8月，NIST发布《可解释人工智能的四项原则》，介绍了可解释人工智能的四项原则，包括解释原则（Explanation）、有意义原则（Meaningful）、解释准确性原则（Explanation
    Accuracy）和知识局限性原则（Knowledge Limits）。


    2021年3月，NIST发布《信任与人工智能》（NISTIR 8332草案），提出了一种评估用户对人工智能系统信任度的方法。方法认为了解用户对人工智能的信任，才能从中获益并将风险降至最低。'
