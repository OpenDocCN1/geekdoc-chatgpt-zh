    65从2012年开始研制数字工厂国际标准，是开展“人工智能+智能制造”的核心技术组织。


    IEC/SyC AAL主动辅助生活系统委员会为老年人智能家居和智能生活环境领域提供标准化方案。在研的标准包括IEC 63168《互联家庭环境中多系统协同 电气/电子安全相关系统功能安全》、IEC
    63204《主动辅助生活参考架构和参考模型》、IEC TS 63234《主动辅助生活服务经济性评价》等标准。


    IEC/SEG 10自主和人工智能应用伦理系统评估组于2018年成立，其主要工作是识别与IEC技术活动相关的伦理问题和社会问题，适当地向SMB提出建议，为IEC委员会制定有关自主和/或人工智能应用的伦理方面的广泛适用的指导方针，确保IEC委员会之间的工作一致性，促进与JTC
    1/SC 42的合作等。


    ### 3.3.4 ITU


    国际电信联盟（International Telecommunications Union，ITU）下设ITU-T，研究通过人工智能提高电信自动化、性能和服务质量，重点推动通信领域、多媒体技术和应用、健康医疗、自助和辅助驾驶等领域的标准化工作。近年来，ITU-T研制了《深度神经网络基准评价方法》《深度学习软件框架评价方法论》《共享机器学习技术框架》等人工智能标准。


    ## 3.4 国外标准化工作情况


    ### 3.4.1 IEEE


    电气和电子工程师协会（Institute of Electrical and Electronics Engineers, IEEE）主要聚焦人工智能领域伦理道德标准，2017年3月，发表《旨在推进人工智能和自治系统的伦理设计的IEEE全球倡议书》，倡议建立人工智能伦理的设计原则和标准，帮助人们避免对人工智能技术产生恐惧和盲目崇拜。


    截止2021年6月，IEEE批准了包括《深度学习评估框架与流程》《知识图谱框架》《道德人工智能和自治系统的幸福感度量》《金融服务领域知识图谱应用指南》等20余项人工智能标准项目。


    ### 3.4.2 NIST


    美国国家标准与技术研究院（National Institute of Standards and Technology，NIST）隶属于美国商务部，在美国政府支持下，推进人工智能标准工作。


    2019年8月，NIST发布了《美国人工智能领导力：联邦参与制定技术标准及相关工具的计划》的报告，把“积极参与人工智能标准的开发”列为重要任务。报告提出了联邦政府机构制定人工智能技术及相关标准给的指导意见，认为应优先制定人工智能包容性和可访问性、开放透明、基于共识、具有全球性和非歧视性等方面的标准，并提出了人工智能标准的九个重点领域：概念和术语、数据和知识、人际互动、指标、网络、性能测试和报告方法、安全、风险管理、可信赖。


    2020年8月，NIST发布《可解释人工智能的四项原则》，介绍了可解释人工智能的四项原则，包括解释原则（Explanation）、有意义原则（Meaningful）、解释准确性原则（Explanation
    Accuracy）和知识局限性原则（Knowledge Limits）。


    2021年3月，NIST发布《信任与人工智能》（NISTIR 8332草案），提出了一种评估用户对人工智能系统信任度的方法。方法认为了解用户对人工智能的信任，才能从中获益并将风险降至最低。


    2021年6月，NIST发布《识别和管理人工智能偏见的建议》（NIST 特别出版物 1270），提出基于风险管理的思路，建立可信赖和负责任的人工智能框架并形成配套的人工智能可信标准。


    ### 3.4.3 EU


    欧洲国家更关注人工智能带来的安全、隐私、尊严等方面的伦理风险。2016年至今，欧盟发布了一系列文件，希望通过政策和标准降低人工智能带来的伦理风险。


    《对欧盟机器人民事法律规则委员会的建议草案》《欧盟机器人民事法律规则》等文件赋予自助机器人法律地位；《人工智能道德准则草案》为人工智能系统的实施和操作提出了指导；《可信赖人工智能的伦理准则》，提出了实现可信赖人工智能全生命周期的框架；《人工智能白皮书——通往卓越和信任的欧洲路径》，提出要建立“可信赖的人工智能框架”，研发以人为本的技术，打造公平且具有竞争力的数字经济，建设开放、民主和可持续的社会。2021年4月，欧盟提出的《人工智能法》提案，精细划分人工智能应用场景的风险等级，制定针对性的监管措施，用于化解人工智能风险，保证欧盟人工智能市场的统一、可信赖。


    ### 3.4.4 其他


    2017年，Microsoft、Facebook、Amazon等龙头企业联合发布了开放神经网络交换（ONNX）格式标准，为人工智能模型提供了开源格式。


    ONNX可使模型在不同框架之间进行切换，开发人员在项目的开发过程中更换更合适的工具。目前，Intel、AMD、IBM、ARM、Nvidia、华为等国内外硬件厂商均支持该标准。Tensorflow、Caffe2、PyTorch、MXNet、ML.NET，TensorRT
    和 Microsoft CNTK等深度学习框架，也支持加载ONNX模型进行推理。


    ## 3.5 国内标准化工作情况


    ### 3.5.1 全国信息技术标准化技术委员会


    全国信息技术标准化技术委员会（SAC/TC 28）与国际标准化组织ISO/IEC JTC 1对口。其中人工智能分技术委员会（SAC/TC 28/SC 42）于2020年3月成立，国际对口ISO/IEC
    JTC 1/SC 42，负责人工智能基础、技术、风险管理、可信赖、治理、产品及应用等人工智能领域国家标准制修订工作。


    除人工智能分技术委员会以外，SAC/TC 28还开展了人机交互、生物特征识别、计算机视觉等人工智能相关领域的标准化工作。用户界面分技术委员会（SAC/TC
    28/SC 35）在人机交互领域成立开展智能语音、体感交互等标准研制。生物特征识别分技术委员会（SAC/TC 28/SC 37）在生物特征识别方面开展了指纹识别、人脸识别、生物特征样本等标准研制。计算机图形图像处理及环境数据分技术委员会（SAC/TC
    28/SC 24）在计算机图形图像处理、增强现实等领域开展了标准研制。


    此外，全国信标委大数据标准工作组、云计算标准工作组、物联网标准工作组、国家传感器网络标准工作组等标准化组织在SAC/TC 28的组织引领下，也开展了相关领域基础标准研制，为人工智能技术及应用提供支撑。


    ### 3.5.2 全国自动化系统与集成标准化技术委员会


    全国自动化系统与集成标准化技术委员会（SAC/TC 159）主要负责面向产品设计、采购、制造和运输、支持、维护、销售过程及相关服务的自动化系统与集成领域的标准化工作，与自动化系统与集成技术委员会（ISO/TC
    184）和机器人技术委员会（ISO/TC 299）对口。


    TC 159下设的机器人与机器人装备分技术委员会（SAC/TC 159/SC 2）负责与人工智能领域相关的标准化工作，其工作范围涉及三个方面，一是应用于工业和非工业特定环境的、可自动控制的、可编程的、可操作的机器人，代表标准为《机器人控制器开放式通信接口规范》《工业机器人用户编程指令》《面向多核处理器的机器人实时操作系统应用框架》。二是在多轴、固定或移动情况下可编程的机器人，代表标准为《工业机器人坐标系和运动命名原则》《装配机器人通用技术条件》《工业机器人机械接口第2部分：轴类》等。三是机器人装备，代表性标准为《机器人与机器人装备词汇》《机器人设计平台系统集成体系结构》《机器人机构的模块化功能构件规范》等。


    ### 3.5.3 全国音频、视频和多媒体标准化技术委员会


    全国音频、视频及多媒体系统与设备标准化技术委员会（SAC/TC 242）主要负责全国音视频及多媒体技术专业领域标准化工作。目前正在开展《智能电视交互应用接口规范》《智能电视语音识别
    测试方法》《智能电视语音识别通用技术要求》等与人工智能相关的标准研制。


    ### 3.5.4 全国信息安全标准化技术委员会


    全国信息安全标准化技术委员会（SAC/TC 260）主要负责全国信息安全领域标准化工作，推动了《信息安全技术 基于可信环境的生物特征识别身份鉴别协议》《信息安全技术
    指纹识别系统技术要求》《信息技术 安全技术 生物特征识别信息的保护要求》等生物特征识别标准的制修订。


    ### 3.5.5 全国智能运输系统标准化技术委员会


    全国智能运输系统标准化技术委员会（SAC/TC 268）主要负责全国智能运输系统领域内标准化工作。TC 268围绕智能运输领域，发布了《智能运输系统 换道决策辅助系统
    性能要求与检测方法》《智能运输系统 车辆前向碰撞预警系统 性能要求和测试规程》等标准，推动《智能运输系统 智能驾驶电子地图数据模型与交换格式 第1部分：高速公路》《智能运输系统
    智能驾驶电子地图数据模型与交换格式 第2部分：城市道路》等标准的研制。


