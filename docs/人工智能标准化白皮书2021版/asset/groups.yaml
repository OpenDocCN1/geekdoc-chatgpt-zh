    # 附件3


    # 应用案例


    根据人工智能应用场景，本白皮书选编了9个典型应用案例，限于篇幅，每个案例仅是简要介绍，感兴趣的读者可以联系案例单位获取进一步信息。


    # 案例一：智慧城市人工智能中台解决方案


    +   - 应用领域：人工智能+城市

    +   - 应用场景：智慧城市“一网统管”

    +   - 案例提供者：上海依图网络科技有限公司


    # (1) 客户需求与方案简介


    在新型智慧城市治理和管理模式中，依图科技基于“云—边—端”的技术架构构建支持分布式联动的算力平台和人工智能中台，成为智慧城市创新技术解决方案。某市推出一网通办、一网统管，统筹解决城市管理、社会治理、企业及民生问题。通过人工智能、物联网、大数据等现代化信息手段和基于国产人工智能深度学习芯片的视频解析一体机等算力基础设施进行城市数字化建设，进而推动跨部门的协同打通，增强基层人员和管理组织的科学决策的能力。利用智能化的手段，做到机器感知、自动派单、业务闭环，真正做到应用为要，管用为王。


    # (2) 具体解决方案介绍


    依图人工智能中台的技术架构如下图所示，其中基础设施是用于支持人工智能中台业务开展的各类计算设施与网络设施，包括云计算设备、边缘计算设备、端侧传感器与计算设备及网络通信设施等。'
