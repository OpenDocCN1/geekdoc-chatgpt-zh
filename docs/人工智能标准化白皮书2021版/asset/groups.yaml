    ## 案例五：云南西双版纳国家级自然保护区野生亚洲象监测预警体系建设项目


    应用领域：人工智能+农业


    应用场景：亚洲象监测预警、夜间/残缺影像人工智能识别


    案例提供者：浪潮软件科技有限公司


    ### (1) 客户需求与方案简介


    客户方提出根据历年云南省亚洲象资源调查在种群数量、分布、栖息地、肇事等方面的调查成果，认真分析亚洲象监测体系中存在的主要问题，深入剖析人象冲突的核心问题及解决办法。浪潮方提出通过地面人员巡护监测、无人机采集、智能视频监控、红外相机监控等多种手段，以及其它系统数据对接，实现有线、无线网络的快速传输和空地多路数据的汇集；通过构建高效的多组织协同的扁平化监测预警体系，打造全面感知、反应灵敏的监测预警平台，建立响应及时、服务全面的社会联动机制。为以后制定更好、更合理、更科学的保护管理措施提供有效的科学依据，为各级领导及时掌握亚洲象监测预警情况，实施果断决策提供真实、可靠、及时、准确、完整的信息支撑。


    ### (2) 具体解决方案介绍


    通过地面人员巡护监测、无人机采集、智能视频监控、红外相机监控等多种手段，以及其它系统数据对接，实现有线、无线网络的快速传输和空地多路数据的汇集；依托人工智能及大数据等信息化手段，建立信息共享机制、减少人为识别工作量、建立健全的预警机制、建立对外服务系统，方案整体架构如下图所示：


    ![](img/951a2171a213838862fedd56f63c7110_74_0.png)


    通过红外相机/摄像头监测，能有效地释放大量的人力资源和弥补人工监测客观存在的不足之处，通过将红外相机/摄像头安装在亚洲象迁移路线上的村寨周边区域，可24小时不间断监控亚洲象活动。红外相机/摄像头的数据流向及预警流程如图2所示：


    ![](img/951a2171a213838862fedd56f63c7110_74_1.png)


    前端可通过红外相机、摄像机、无人机、监测人员等监测亚洲象，根据实际情况，监测预警平台通过智能广播设备、移动终端APP、短信等渠道，智能发布预警信息。


    ### (3) 方案实施后的价值或成果


    自方案实施以来，布设605台红外相机、21路摄像头，累计拍摄照片108万余张，算法识别准确度高达99%，突破夜间及残缺影像识别的技术壁垒，在可视条件极低的条件下仍可准确识别亚洲象并成功预警，有效识别亚洲象并预警5100余次，成功避免“人象冲突”事件500余起，预警中心系统如下图所示：


    ![](img/951a2171a213838862fedd56f63c7110_75_0.png)


    ![](img/951a2171a213838862fedd56f63c7110_75_1.png)


    方案建成后，辖区没有发生过一起人员伤亡事件，有效缓解了人象冲突，避免了国家和人民的经济损失，为亚洲象科学研究提供了大量珍贵的科研影像资料，为亚洲象专职监测员提供科学有效的监测手段，提升亚洲象日常监测工作的有效性。


    ## 案例六：基于人工智能的智能音箱+蓝牙mesh的智能家居系统


    应用领域：人工智能+家居


    应用场景：基于语音的智能家居控制


    案例提供者：北京小米移动软件有限公司


    ### (1) 客户需求与方案简介


    当前人工智能技术与智能家居的结合越来越深入。人工智能技术可以嵌入至更多生活场景，以此打造一个智慧生活场景的生态体系。本案例是在智能音箱上基于蓝牙mesh连接智能家居设备，构建起以智能音箱为中心的智能家居蓝牙网络拓扑结构。用户既可以通过距离设备最近的智能音箱来控制设备，也可以通过智能音箱的桥接实现跨音箱远程控制设备。借助于智能音箱的桥接，在获取智能家居设备实际状态方面，蓝牙mesh方案可以达到类似Wi-Fi的用户体验，用户可以轻松实现在手机App上查看设备在线或者离线，控制设备并迅速了解成功与否等功能。


    ![](img/951a2171a213838862fedd56f63c7110_76_0.png)


    在实际使用过程中，用户只需通过语音指令即可完成设备操作控制，下图以同一房间内语音控制开灯为例来说明语音交互的流程：


    ![](img/951a2171a213838862fedd56f63c7110_77_0.png)


    ### (2) 具体解决方案介绍


    本方案提供了两种设备入网方案：手机App靠近配网和音箱语音配网，用户可以选择使用手机App一键配网，也可以选择使用音箱来语音操作配网。两种入网方式均支持批量操作，一次入网一批设备，一个mesh网络中设备数量的理论上限为32,767，通过合理布局即可弹性扩展。另外，本方案在入网速度和安全性上做了持续的优化，单设备入网可快至2s，极大缩短了设备入网的时间。云端和蓝牙mesh设备端进行了双向验证，彻底杜绝了山寨设备的接入。


    大规模设备接入后带来的一项重大用户体验提升是设备可分组控制，即使用一条控制消息，可同时控制一组设备，组内设备同步执行控制指令。用户可以按照个性化需求，将任意多个蓝牙mesh设备甚至不同空间的蓝牙mesh设备组成一组，轻松实现“回家打开灯”、“打开阅读灯”等场景。同时，同一设备也可以属于多个不同的组。此外，本方案还可与智能家居生态中的其他设备设置自动化联动，很容易就可以达到“进门自动开灯”、“出门自动关灯”等便捷体验。


    ### (3) 方案实施后的价值或成果


    基于智能音箱+蓝牙mesh的智能家居系统方案独具五大创新特色：


    - 1) 便捷的入网方案，不依赖Wi-Fi路由器，简单易用。

    - 2) 智能家居设备批量接入，快捷方便。

    - 3) 具有完整的闭环语音控制系统，可跨音箱设备隔级控制智能家居设备，具有业界领先的交互体验。

    - 4) 全场景低功耗，与行业同类产品相比，续航能力优势明显。

    - 5) 云端设备双向认证，让智能家居更安全。


    案例所述的基于智能音箱+蓝牙mesh的智能家居系统的技术思路已在行业内得到广泛应用，既降低了用户使用成本又提升了用户使用体验，在业内具有非常好的竞争力和推广前景，并且已在小米智能家居生态的智能开关、智能灯等系列爆品中得到了充分验证。


    ## 案例七：腾讯智慧模型平台方案


    应用领域：人工智能+金融


    应用场景：银行营销、风控及运营相关业务场景的建模


    案例提供者：腾讯


    ### (1) 客户需求与方案简介


    该模型平台项目是客户为了补足行内现有数据分析建模能力的短板，统一管理模型的开发和运行，形成平台级的人工智能服务能力中心而规划开展建设的项目。项目基于腾讯云智能钛TI平台建立以大数据、机器学习算法、深度学习算法等技术为基础，集数据处理、模型训练、离线/在线推理及系统管理为一体的机器学习平台，将基于智能钛TI平台，结合银行相关业务场景进行业务建模，充分挖掘行内现有数据价值。


    ### (2) 具体解决方案介绍


    借助腾讯云智能钛人工智能平台打通包含从数据获取、数据处理、算法构建、模型训练、模型评估、模型部署，到人工智能应用开发的业务+人工智能落地全流程链路，帮助用户快速创建、部署和管理人工智能应用。智能钛人工智能平台包含九大能力中心，分别是应用中心、应用服务编排、模型服务、边缘中心、数据中心、自动学习、训练工坊、模型管理和管理中心。为用户提供人工智能模型生产及应用发布的全流程服务，快速获取多种来源训练数据，并提供多种工具进行数据标注及特征提取，按需采用简易化或专业化算法建模工具，调度算力资源进行模型生产及效果评估，模型一键部署至生产服务，快速连接云-边-端数据、算法与智能设备，并提供组件编排工具以支持服务和资源的管理及调度。此外，还进一步通过对人工智能服务组件的持续集成和标准化接口开放，整合内外部算法、数据、设备资源，一站式满足复杂人工智能业务场景对人工智能服务的需求。


    ![](img/951a2171a213838862fedd56f63c7110_79_0.png)


    ### (3) 方案实施后的价值或成果


    - 1) 为行内的风控、营销、运营业务提供智能化的数据支撑服务，提升数据应用的深度和广度。

    - 2) 提高行内数据团队及相关业务人员的建模能力和算法模型应用水平，培养建模专家和业务专家，提升行内机器学习建模的自主可控水平。

    - 3) 为客户向数字化、智能化银行的全面转型提供能力支撑。


    ## 五大核心价值


    ① 释放行内数据价值

    平台内的AI服务能力中台并行拥有海量数据分析建模能力的优势，助力银行开发众多的统一管理、资讯或有针对性的信息，实现智能化决策。


    ② 降低金融业务运行成本

    通过策略分析，全面拓展财务业务应用，降低人员成本，提高运营效率；同时通过智能化金融、流动性预警等，智能资金全盘运用，精细化资金管理，降低运营成本。


    ③ 提升智能服务稳定性

    支持海量数据接入，大大缩短智能服务开发周期，采用集群TEE安全云基础架构，共享多模型服务计算资源，提高智能服务稳定性，并降低系统建设及维护成本。


    ④ 优化营销宣传效率效果

    智能化平台更能帮助优化用户画像，精准算法等服务，实现更精准、更高效的智能营销。


    ⑤ 协助搭建技术核心团队

    逐步提升行内数据团队以及相关负责人员的赋能度，解决模型应用水平，助力培养自搭建专家和业内专家。


    ## 案例八：智慧仓储物流系统


    应用领域：人工智能+物流


    应用场景：自动化工厂配套智慧仓储物流解决方案


    案例提供者：北京旷视科技有限公司


    ### (1) 客户需求与方案简介


    中国是全球最大的物流市场，作为现代制造业与物流业深度融合的关键环节，“建设现代物流体系”在中央经济工作会议上被纳入2021年经济工作的重点任务之一。其中一个重要的组成部分是现代化的仓储物流，通过引入人工智能、物联网、大数据等先进的信息技术，构建智慧仓储物流系统方案，较大提升生产制造的效率。


    在此行业趋势下，某家用电子产品领先企业A为进一步提升产品的整体竞争能力，经过充分调研分析后，决定规划对生产工厂的自动化改造。项目需求建设高度自动化、信息化的智慧仓储物流体系，集成收货平台、立体仓库、智能搬运、自动配送、自动拆垛等自动化设备，服务于自动连续生产的智能制造能力，缩短生产周期，降低制造成本，快速响应市场需求。


    ### (2) 具体解决方案介绍


    解决方案以旷视河图系统为核心，构建系统总体架构，如图所示，弥合了行业内软件和硬件割裂的局面，推动软硬一体化进程，能够提供多设备的接入能力以及丰富的机器人智能化管理方案，帮助企业打造“人机协同，群智开放”的智能物联新模式，实现降本增效。


    ![](img/951a2171a213838862fedd56f63c7110_81_0.png)


    建立全流程管控机制，打造以MES为核心，贯通SAP、PLM、WMS、SRM、电子看板、产线等系统和工具的数字化管理平台，建设成集高效制造、数据互联互通、管理精益化的数字化无人工厂。


    建立产品快速追溯体系，针对原材料、生产过程、物料零部件、质量控制快速追溯，提高分析能力、信息化管理水平。


    建立完善的车间原材料、半成品及成品管控，实现精准的物料需求配送及库存管控，降低生产现场在制及原材料。


    建立数据平台，实现生产过程信息数据的集中存储和分析，建立信息平台。


    ### (3) 方案实施后的价值或成果


    采用了智慧仓储物流方案后，企业A的智能化生产的安全性和效率得到了显著提高，例如：


    - 1) 库容显著提升：货流量、立体库在库量、分拣出库流量、物料配送量等关键性能都有极大提升，超出预定目标，物料存储周期提升30%。

    - 2) 安全性提高：工业生产领域，安全永远是核心要素之一。在智慧仓储物流方案中还部署了全球第一台具备垛形识别、轨道异物检测、视觉盘点功能的人工智能堆垛机，较大程度降低了事故发生的可能性。

