    学习框架多硬件平台适配总体架构如图6所示，该标准规范的技术方案包括设备管理层接入接口、算子适配层接入接口，训练框架与推理框架的多硬件适配指标体系包括安装部署、兼容适配、算子支持、模型支持、训练性能、稳定性和易扩展性等。


