    ## 三、人工智能标准化工作情况


    ### 3.1 人工智能标准化的必要性


    标准是经济活动和社会发展的技术支撑，是国家基础性制度的重要方面。标准化在国家治理体系和治理能力现代化建设中发挥着基础性、引领性作用。我国人工智能产业发展取得了突破性进展，但依然面临着底层技术欠缺、能够实现商业价值的应用较少、与实体经济的融合存在门槛等问题，迫切需要加强人工智能标准化工作，支撑人工智能产业健康可持续发展。


    人工智能标准化对加快技术创新具有重要意义。一方面，促进科技成果转化，推动科技创新成果推广应用、促进产业升级和技术革新。另一方面，能够固化全球先进技术成果，淘汰落后产能，为产业发展释放更多资源和空间。


    人工智能标准化促进产业健康可持续发展。一方面，支撑政府治理，促进政府管理和市场监管更加科学有序。另一方面，形成开放的人工智能产业生态，促进产业链上下游、大中小微企业之间协同发展。


    人工智能标准化为产品和服务质量提供保障。一方面，人工智能企业积极参与标准制定，在追求高标准中创造更多优质产品和服务。另一方面，依据标准开展符合性测试，保障产品和服务的质量。


    人工智能标准化是信息安全的坚实保障。一方面，可以有效减少人工智能技术带来的信息安全、个人隐私等问题。另一方面，可以解决应用中伦理道德规范和安全标准滞后于技术发展的问题。


    ### 3.2 人工智能标准化相关政策


    ### 3.2.1 国外情况


    ### (1) 美国：不断加强政策对标准的引领


    2019年2月，美国总统特朗普签署《美国人工智能倡议》，重点关注人工智能研发、标准规范制定。2019年6月，美国白宫发布《国家人工智能研究与发展策略规划》，关注人工智能基础研究、伦理、可信赖及相关标准，提出制定标准和基准以测量和评估人工智能技术。2021年1月，美国国家标准协会（ANSI）发布《美国标准化战略2020》，进一步关注人工智能标准。


    ### (2) 欧盟：通过标准和立法加强监管


    2019-2020年，欧盟委员会发布了《人工智能道德准则》《人工智能白皮书》《可信赖人工智能评估清单》《数字服务法案》《数字市场法案》等文件，推进人工智能立法，加强人工智能监管。2021年2月，欧洲标准化委员会和欧洲电工标准化委员会发布《欧洲标准化战略2030》提出制定人工智能领域的先进创新标准。2021年4月，欧盟委员会联合研究中心发布《人工智能标准化格局——进展情况及与人工智能监管框架提案的关系》，通过制定国际、欧洲标准支撑人工智能监管。


    ### (3) 日本：注重顶层设计和战略引导


    2018年12月，日本内阁发布《以人类为中心的人工智能社会原则》，综合考虑人工智能对人类、社会系统、产业结构、政府等带来的影响，有助于理解人机关系、标准、行为规范等。2019年6月，日本政府出台《人工智能战略2019》，提出建设人工智能强国，设定了奠定发展基础、构建社会应用和产业化基础、制定并应用人工智能伦理规范等目标，推动人工智能技术和产业发展。


    ### 3.2.2 国内情况


    我国发布了一系列人工智能政策，加强人工智能顶层设计，大力推动人工智能技术、产业和标准相关工作。2017年7月，国务院印发《新一代人工智能发展规划》，提出了开展人工智能标准框架体系研究的重要任务。2017年12月，工业和信息化部印发《促进新一代人工智能产业发展三年行动计划（2018-2020年）》，提出要建设人工智能产业标准规范体系，构建人工智能产品评估评测体系。2020年7月，国家标准委、中央网信办、发展改革委、科技部、工业和信息化部联合印发《国家新一代人工智能标准体系建设指南》，形成标准引领人工智能产业发展的新格局。


    ### 3.3 国际标准化工作情况


    ### 3.3.1 ISO/IEC JTC 1


    国际标准化组织和国际电工委员会第一联合技术委员会（ISO/IEC JTC 1）以信息技术为核心，依托人工智能分技术委员会（SC 42）开展人工智能标准化工作，重点围绕人工智能基础共性、关键通用技术、可信及伦理方面开展标准研制工作。同时，ISO/IEC
    JTC 1还开展了人工智能安全、关键行业的应用等标准化工作。


    ### （1）ISO/IEC JTC 1/SC 42


    2017年10月，ISO/IEC JTC 1召开第32届全会，成立SC 42人工智能分技术委员会，研究范围为人工智能标准化。SC 42承担了JTC 1的大部分人工智能标准化项目，指导JTC
    1、IEC和ISO开发人工智能应用程序。ISO/IEC JTC 1/SC 42主要围绕人工智能基础、数据、可信、用例、算法、治理等方面开展国际标准化研究，下设基础标准工作组（WG
    1）、数据工作组（WG 2）、可信工作组（WG 3）、用例与应用工作组（WG 4）、人工智能计算方法和系统特征工作组（WG 5）、人工智能治理（与SC 40）联合工作组（JWG
    1）、人工智能系统工程咨询组（AG 2）、传播与推广专设组（AHG 1）、与SC 38的联络专设组（AHG 2）、与SC 27的联络专设组（AHG 4）、人工智能标准化形势和路线图专设组（AHG
    5）等组织。


    其中，WG 1负责人工智能基础标准的研制，目前主要研制《信息技术 人工智能 概念和术语》《信息技术 运用机器学习的人工智能系统框架》《信息技术 人工智能 管理体系》等3项标准，具体如下：


    ISO/IEC 22989《信息技术 人工智能 概念和术语》解释了针对第三次人工智能技术发展特点形成的人工智能术语和概念，并描述了人工智能系统生命周期模型、人工智能系统功能模型、人工智能生态系统框架等参考架构。


    ISO/IEC 23053《信息技术 运用机器学习的人工智能系统框架》提出了机器学习技术框架，梳理了监督学习、无监督学习、半监督学习、迁移学习和增强学习等机器学习方法，并界定了机器学习全流程。


    ISO/IEC 42001《信息技术 人工智能 管理体系》作为管理体系类标准规定了在组织范围内建立、实施、维护和持续改进人工智能管理体系的要求和指南。


    WG 2负责人工智能、大数据和其他数据分析背景下的数据标准化研究工作，正在围绕人工智能系统数据质量研制《信息技术 人工智能 分析和机器学习的数据质量 第1部分：概述、术语与示例》等系列标准。


    WG 3负责人工智能可信方面的研究和标准化工作，其研究成果备受关注。目前已发布《信息技术 人工智能 人工智能可信概述》《人工智能神经网络鲁棒性评价 第1部分：概述》2项标准，正在研制《信息技术
    人工智能 人工智能系统和人工智能辅助决策的偏见》《信息技术 人工智能 伦理和社会关注概述》等标准。WG 3已发布及在研标准包括但不限于：


    ISO/IEC TR 24028《信息技术 人工智能 人工智能可信概述》从宏观上提出人工智能系统可信赖问题，并分析了人工智能系统存在技术脆弱性的影响因素以及缓解这些因素以提高人工智能系统可信度的方法，具体措施包括改善人工智能系统的透明度、可控性等。


    ISO/IEC TR 24029系列标准《信息技术 人工智能 评估神经网络的鲁棒性》中第1部分：概述，可用于评估神经网络鲁棒性，提供了评估神经网络鲁棒性的统计方法、形式化方法和实证方法；第2部分：使用形式方法的方法论则规定了鲁棒性评估涵盖的技术、使用条件和阶段，以及如何使用评估后的数据等。


    ISO/IEC TR 24027《信息技术 人工智能 人工智能系统和人工智能辅助决策的偏见》讨论了公平性与算法偏见的关系，说明了人工智能系统决策存在偏见的原因及类型，进而讨论了评估和缓解人工智能系统中造成偏见的方法。


    ISO/IEC 23894《信息技术 人工智能 风险管理》是以ISO 31000《通用风险管理》标准为指引而构建的人工智能技术和系统开发及应用过程的管理指南，描述了人工智能系统风险评估要素及风险应对措施。


    ISO/IEC TR 24368《信息技术 人工智能 伦理和社会关注概述》定义了人工智能伦理与社会原则，并在此基础上举例说明了在开发和使用人工智能过程中有关伦理和社会关注方面的实践。


    WG 4负责收集人工智能用例并开展人工智能应用的标准化研究，已发布《信息技术 人工智能 用例》1项标准，正在研制《信息技术 人工智能 人工智能应用指引》《信息技术
    人工智能 人工智能系统生命周期过程》2项标准。


    WG 5负责人工智能系统计算方法和系统特征的研究和标准化工作，目前正在研制《信息技术 人工智能 人工智能系统计算方法概述》《信息技术 人工智能 机器学习分类性能评估》等3项标准。


    JWG 1由ISO/IEC JTC 1/SC 42和ISO/IEC JTC 1/SC 40 IT服务管理与IT治理分技术委员会联合成立，目前负责标准ISO/IEC
    38507《信息技术 IT 治理 组织使用人工智能的治理影响》的研制工作。


    ISO/IEC JTC 1/SC 42具体标准研制清单详见附件1。


    ### （2）ISO/IEC JTC 1的其它分委会


    在ISO/IEC JTC 1中，除了SC 42以外，SC 6、SC 7、SC 27、SC 29、SC 35等分委会也在开展了人工智能相关标准化工作。


    ISO/IEC JTC 1/SC 6系统间远程通信和信息交换分技术委员会的预研究工作项目《人工智能赋能的网络》与人工智能在通信领域应用相关；ISO/IEC
    JTC 1/SC 7软件工程分委会发布了技术报告ISO/IEC TR 29119-11:2020《基于人工智能的系统测试导则》；ISO/IEC JTC 1/SC
    27信息安全、网络安全和隐私保护分技术委员会的预研究工作项目PWI 7769《人工智能安全威胁和故障处理指南》及PWI 6089《人工智能对安全和隐私的影响》与人工智能安全相关；ISO/IEC
    JTC 1/SC 29音频、图像、多媒体和超媒体信息的编码分技术委员会，开展国际标准ISO/IEC 6048《基于人工智能学习的JPEG影像编码系统》研制，推动成立了面向机器的视频编码研究小组。


    ISO/IEC JTC 1/SC 35用户界面分技术委员会在人工智能领域重点推动全双工语音交互、跨设备交互和情感计算方面国际标准的研制。2020年7月，中国推动在SC
    35下成立了WG 10情感计算工作组。SC 35研制的人工智能主要标准包括：ISO/IEC 30150《信息技术 情感计算用户界面》系列标准、ISO/IEC
    CD 24661《信息技术 用户界面 全双工语音用户界面》，以及ISO/IEC NP 4933《信息技术 用户界面 跨设备交互映射事件框架》。


    ### 3.3.2 ISO


    国际标准化组织（International Organization for Standardization, ISO）面向智能制造、机械安全、智能运输、健康信息、机器人等应用领域，推动人工智能标准化。


    ISO/TMB/SMCC智能制造协调委员会联合ISO及ISO/IEC JTC 1相关技术委员会及分技术委员会的主席，编制了智能制造主题白皮书。白皮书定义智能制造概念，识别智能制造相关方，梳理相关技术，提出发展原则，分析未来影响。


    ISO/TC 199机械安全技术委员会围绕机械安全开展标准化工作，发布了技术报告ISO/TR 22100-5:2021《机械安全 与ISO 12100的关联
    第5部分：应用人工智能机器学习》。


    ISO/TC 204智能运输系统技术委员会围绕公共运输领域，推进预研究工作项目《智能运输系统 公共运输 用于智能运输路线设计和更新的机器学习/人工智能》。


    ISO/TC 215健康信息学技术委员会发布了技术报告ISO/TR 24291:2021《健康信息学 影像和其它医学应用中的机器学习技术应用》。


    ISO/TC 299机器人技术委员会推动除玩具与军事以外领域的机器人标准化，推动研制人工智能相关国际标准31项，其中22项已发布，包括机器人术语、工业机器人安全、协作机器人、服务机器人性能测试等方向。


    ### 3.3.3 IEC


    国际电工委员会（International Electrotechnical Commission，IEC）在智能制造、智能设备、智能家居、智慧城市、智慧能源等垂直领域开展了人工智能相关标准化工作，并在人工智能伦理方面进行了探索。


    IEC/MSB市场战略局主要负责识别IEC相关领域的未来技术发展趋势，并提供战略指导。2018年10月发布了白皮书《人工智能跨行业应用》，阐述了语言识别、图像识别和机器学习等关键人工智能技术及其与垂直行业的融合，为更多创新应用、商业模式落地以及标准化体系构建提供指导。

