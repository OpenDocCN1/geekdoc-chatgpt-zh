    2021年6月，NIST发布《识别和管理人工智能偏见的建议》（NIST 特别出版物 1270），提出基于风险管理的思路，建立可信赖和负责任的人工智能框架并形成配套的人工智能可信标准。


    # 3.4.3 EU


    欧洲国家更关注人工智能带来的安全、隐私、尊严等方面的伦理风险。2016年至今，欧盟发布了一系列文件，希望通过政策和标准降低人工智能带来的的伦理风险。


    《对欧盟机器人民事法律规则委员会的建议草案》《欧盟机器人民事法律规则》等文件赋予自助机器人法律地位；《人工智能道德准则草案》为人工智能系统的实施和操作提出了指导；《可信赖人工智能的伦理准则》，提出了实现可信赖人工智能全生命周期的框架；《人工智能白皮书——通往卓越和信任的欧洲路径》，提出要建立“可信赖的人工智能框架”，研发以人为本的技术，打造公平且具有竞争力的数字经济，建设开放、民主和可持续的社会。2021年4月，欧盟提出的《人工智能法》提案，精细划分人工智能应用场景的风险等级，制定针对性的监管措施，用于化解人工智能风险，保证欧盟人工智能市场的统一、可信赖。


    # 3.4.4 其他


