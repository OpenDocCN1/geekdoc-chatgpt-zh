    40 ) 联合工作组（ JWG 1 ）、人工智能系统工程咨询组（ AG 2 ）、传播与推广专设组（ AHG 1 ）、与SC 38的联络专设组（ AHG 2
    ）、与SC 27的联络专设组（ AHG 4 ）、人工智能标准化形势和路线图专设组（ AHG 5 ）等组织。


    其中，WG 1负责人工智能基础标准的研制，目前主要研制《信息技术 人工智能 概念和术语》《信息技术 运用机器学习的人工智能系统框架》《信息技术 人工智能 管理体系》等3项标准，具体如下：


    ISO/IEC 22989《信息技术 人工智能 概念和术语》解释了针对第三次人工智能技术发展特点形成的人工智能术语和概念，并描述了人工智能系统生命周期模型、人工智能系统功能模型、人工智能生态系统框架等参考架构。


    ISO/IEC 23053《信息技术 运用机器学习的人工智能系统框架》提出了机器学习技术框架，梳理了监督学习、无监督学习、半监督学习、迁移学习和增强学习等机器学习方法，并界定了机器学习全流程。


    ISO/IEC 42001《信息技术 人工智能 管理体系》作为管理体系类标准规定了在组织范围内建立、实施、维护和持续改进人工智能管理体系的要求和指南。


    WG 2负责人工智能、大数据和其他数据分析背景下的数据标准化研究工作，正在围绕人工智能系统数据质量研制《信息技术 人工智能 分析和机器学习的数据质量 第1部分：概述、术语与示例》等系列标准。


    WG 3负责人工智能可信方面的研究和标准化工作，其研究成果备受关注。目前已发布《信息技术 人工智能 人工智能可信概述》《人工智能神经网络鲁棒性评价 第1部分：概述》2项标准，正在研制《信息技术
    人工智能 人工智能系统和人工智能辅助决策的偏见》《信息技术 人工智能 伦理和社会关注概述》等标准。WG 3已发布及在研标准包括但不限于：


    ISO/IEC TR 24028《信息技术 人工智能 人工智能可信概述》从宏观'
