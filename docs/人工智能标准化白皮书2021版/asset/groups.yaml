    的发展，人工智能正在迈向认知智能，即应用于复杂度高的场景中，通过多模态人工智能和大数据等技术，实现分析和决策。


    # （2）从专用智能向通用智能发展


    专用智能具有领域局限性。通用人工智能减少了对特定领域知识的依赖性、提高处理任务的普适性，是人工智能未来的发展方向。


    # （3）通过开源构建生态


    开源的深度学习框架为开发者提供了可以直接使用的算法工具，减少二次开发、提高效率。国内外巨头纷纷通过开源的方式推广深度学习框架，布局开源人工智能生态，抢占产业制高点。


    # 2.3 应用层


    # 2.3.1 发展现状


    # （1）应用场景深度融合


    一是计算机视觉技术产业应用日趋多样化。目前，计算机视觉技术已经成功应用于公共安防等数十个领域。据麦姆斯咨询的数据显示，预计到2023年，全球图像感知市场规模将达到173.8亿美元。二是智能语音技术应用场景逐步拓展。随着对话生成、语音识别算法性能的提升，智能语音的市场规模不断扩大。根据中商产业研究院的统计，2016-2019年间，中国智能音箱的出货量增长了17倍。语音转写、声纹识别等语音技术产品已广泛应用于各行各业。


    # （2）人工智能与实体经济融合发展


    人工智能与传统产业的融合，不仅提高了产业发展的效率，而且实现产业的升级换代，形成新业态，构建新型创新生态圈，催生新的经济增长点。


    人工智能在智能制造、智能家居、智能交通、智能医疗、教育、金融等领域的应用，呈现全方位爆发态势。一是智能制造方面，运营管理优'
  - '[PAGE 14]


    化、预测性维护、制造过程物流优化均衡。二是智能家居领域，智能软件、智能平台、智能硬件等不同的环节，人工智能技术渗透程度较为均衡。但是，行业产品、平台类别众多，兼容性问题突出。三是智能交通领域，与基础设施、运输装备、运输服务、行业治理深度融合，赋能智能感知，提升智能交通的视觉感知能力，提供准确和及时的交通指标数据。四是智能医疗领域，赋能人工智能辅助诊断系统和设备、治疗与监护、管理与风险防控、智能疫情服务平台，提升医疗诊断效率，提高流程管理效率与准确性。五是教育领域，赋能教育服务平台、虚拟实验室和体验馆、教学效果分析和反馈，改善教育实施场景和供给水平，实现信息共享、数据融合、业务协同、智能服务，形成个性化、多元化互补的教育生态体系。六是金融领域，赋能金融风险控制、数据处理、网络安全等，推动金融产品、服务、管理等环节的新一轮变革。


    # 2.3.2 存在问题及挑战


    # （1）行业发展不均衡特征突出


    我国人工智能领域，重应用、轻基础现象严重。一方面，人工智能专用芯片硬件技术起步晚，亟需完善相关的上下游产业链，建立行业应用事实标准。另一方面，对国外开源深度学习系统平台依赖度高，缺少类似的国产成熟的开源平台。在应用层面，发展结构性失衡仍然突出。由于行业监管和盈利条件限制，人工智能的行业应用程度和发展前景存在显著差异。参考在金融、医疗、物流、安防等方面的示范性应用，提升人工智能在零售、制造等传统领域的创新突破。


    # （2）系统开发与维护费时低效


    一方面，实践落地中，商用的人工智能产品缺乏开发、运维的二次应用能力。另一方面，大型人工智能系统设计及实现中，从业者经验匮乏，迫使行业机构额外投入，支撑技术团队，阻碍智能技术的应用实践。智'
  - '[PAGE 15]


    能应用场景通常需要云-端协同智能处理能力，但云侧组件繁多、配置复杂，部署成本较高。


    # （3）人工智能伦理挑战


    一是受历史条件和发展阶段限制，人类对人工智能产品的道德风险，存在认知滞后性。二是人工智能产品缺少完善的伦理控制，同时被赋予更多的自主决策权，催生更多的伦理道德问题。


    # 2.3.3 发展趋势分析


    # （1）发展势头相对趋稳


    近年来，人工智能方面的投融资更为理性，新增企业数量趋缓。产业稳步增长，投融资事件数量相对减少、金额相对增加。产业更加看重底层基础设施建设、核心技术创新和上层应用赋能，产业链条更加明晰。


    随着我国政府大力支持和经济转型升级需求，人工智能产业链条关联性和协同性将进一步增强。


    # （2）与实体经济融合加速


    人工智能与实体经济实现加速融合，为零售、交通、医疗、制造业、金融等产业带来提效降费、转型升级的实际效能。无人商店、无人送货车、病例细胞筛查、数字孪生、智慧工厂、3D打印、智能投顾等新产品、新服务大量涌现，加速培育产业新动能，开拓实体经济新增长点，有力推动我国经济结构优化升级。


    我国人工智能市场潜力巨大，应用空间广阔，尤其是在数据规模和产品创新能力等方面占据优势。另外，5G商用后，人工智能与行业深度融合，并逐步向复杂场景深入，推动更多行业进入智能化阶段。


    # （3）政策红利日渐凸显


    2017年来，人工智能先后出现在政府工作报告和党的十九大报告中。工业和信息化部发布了两批国家人工智能创新应用先导区名单；科技部支'
  - '[PAGE 16]


    持苏州、长沙等地建设国家新一代人工智能创新发展试验区。各地方结合自身优势和产业基础，积极布局人工智能发展规划，大力发展人工智能。

    未来，资本将更多聚集在应用层细分领域的龙头企业，投资焦点将从应用层逐步下移，人工智能芯片和深度学习框架将获得资本市场的更大关注。


