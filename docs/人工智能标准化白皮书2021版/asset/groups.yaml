    # 3.3.4 ITU


    国际电信联盟（International Telecommunications Union，ITU）下设ITU-T，研究通过人工智能提高电信自动化、性能和服务质量，重点推动通信领域、多媒体技术和应用、健康医疗、自助和辅助驾驶等领域的标准化工作。近年来，ITU-T研制了《深度神经网络基准评价方法》《深度学习软件框架评价方法论》《共享机器学习技术框架》等人工智能标准。


    # 3.4 国外标准化工作情况


    # 3.4.1 IEEE


    电气和电子工程师协会（Institute of Electrical and Electronics'
