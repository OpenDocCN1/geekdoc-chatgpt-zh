    ## 案例三：面向发热门诊的Atlas传染病筛查诊断预警方案


    应用领域：人工智能+医疗


    应用场景：新冠肺炎智能诊断系统的设计与优化


    案例提供者：华为技术有限公司（合作伙伴：安德医智）


    ### (1) 客户需求与方案简介


    自2019年末新冠肺炎疫情爆发以来，发热门诊成为对急性传染性呼吸系统疾病预防、预警的重要机构之一。多家医院出现院内感染事件，国务院、卫健委做出部署要求“医疗机构院感防控一直是管理的重点，也是不可突破的底线和红线。未来将在全国推广湖北武汉的发热门诊网格化布局经验”。武汉62家定点医院发热门诊为了降低院内感染风险，全部配备独立CT和抢救设备。然而，在发热门诊实现新冠肺炎的前期快速检测和准确报告有多个问题：1）早期患者影像征象不明显导致漏诊和误报，造成病情加重和疫情扩散；2）易与其他传染性肺炎相混淆；3）检测周期长；4）患者聚集等待报告，造成交叉感染；5）医务人员极度疲惫下容易漏诊；6）影响疫情管控的及时性、准确性。


    华为技术有限公司联合安德医智等合作伙伴形成了面向发热门诊的Atlas传染病筛查诊断预警方案，为医院发热门诊提供新冠肺炎、人禽流感病毒肺炎等11种肺部疾病的智能辅助诊断。


    ### (2) 具体解决方案介绍


    面向发热门诊的Atlas传染病筛查诊断预警方案在门诊现场部署传染病人工智能辅助诊断一体机，将华为Atlas基础软硬件与医疗影像诊断算法及PACS/CT设备相结合，从而在边缘侧形成对新冠肺炎等11种肺部疾病的智能辅助诊断能力。


    ![](img/951a2171a213838862fedd56f63c7110_68_0.png)


    - 1) 在人工智能医疗服务，系统有对肺部疾病的病变标记定量分析、精准评估综合分析、动态分析智能随诊、筛查分流定性预警等功能。

    - 2) 在人工智能应用方面，系统对影像进行病灶分割、定量分析、三维重建等操作，并对结果进行可视化输出（如下图）。


    ![](img/951a2171a213838862fedd56f63c7110_68_1.png)


    - 3) 人工智能辅助诊断平台：为了让人工智能服务和应用更加快速的部署和应用于发热门诊，系统采用边缘推理的华为Atlas 800服务器，有如下特点：1）高算力、低能耗，可支持620
    TOPS INT8算力，功耗仅有480W；2）敏捷部署：半天即可完成对接及调试；3）边缘本地化部署，保障数据安全。


    ### (3) 方案实施后的价值或成果


    该方案的实施有效提升了诊断速度、精准度，并且改善了疗效评估，体现在：1）筛查病患的速度大幅提升，将医生15分钟的工作量压缩到10秒；2）有效保障诊断精准度：将准确率从传统的70%提高到90%；3）有效评估治疗疗效：通过人工智能与人工的交叉互检疗效，提供患者疗效评估的有效性。与英伟达类似方案相比，本方案有效降低成本约20%。


    该方案同时采取分级部署形式，通过将人工智能一体机和发热门诊CT共同部署，实现诊断数据的实时上报，使上级卫健委指挥中心及时、准确获取疫情现状。


    ![](img/951a2171a213838862fedd56f63c7110_69_0.png)


    ## 案例四：视觉人工智能智慧诊疗系统


    应用领域：人工智能+医疗


    应用场景：提供组织级别和细胞级别的病理辅助诊断，覆盖胸部、消化道等多个恶性病高发器官，提示95%的常见癌症病灶类型区域和高危异常细胞。


    案例提供者：商汤科技


    ### (1) 客户需求与方案简介


    病理诊断在诊疗环节意义重大，但我国病理医生却极度短缺。截至2020年，我国在册病理医生仅2万名，现有的病理医生规模远不能满足国内医院的临床需求。面对以上状况，通过供给侧改革，除增加医疗资源供给外，利用人工智能技术赋能，提高医疗资源的使用效率是快速缓解当下医疗资源不足的有效途径之一。


    通过人工智能算法辅助医生诊疗，可大幅减轻医生负担，将所释放的精力和时间处理更紧急的事件、诊治更多的病患、与病患做更专注的交流，在减轻医疗系统压力的同时有利于医患关系的良性化发展。


    人工智能算法实现了专家经验和知识图谱的数字化、标准化，可将其复制并输出，增加医疗资源的总体供给，快速提升基层医院的医疗水平，使得患者无论是在发达地区或是偏远地区，均可就近就医，享受到基本同质的医疗服务，促进医疗卫生资源均衡化发展。


    ### (2) 具体解决方案介绍


    针对病理诊断与筛查的主要痛点，商汤基于视觉人工智能技术积累，将自研的SenseCare智慧诊疗平台，通过无缝连接数字病理扫描仪，其上搭载的“智慧病理人工智能应用”提供组织级别和细胞级别的病理辅助诊断，覆盖消化道的多个恶性病高发器官，提示95%的常见癌症病灶类型区域和高危异常细胞。


    SenseCare智慧诊疗平台是商汤自主研发的为全院医生提供智慧化诊疗辅助的高效工具。平台立足于医疗大数据，凭借商汤在视觉人工智能上深厚的技术积累以及医学影像高级后处理技术，集合了高并发三维渲染与可拓展临床人工智能应用两大引擎，为医院提供覆盖“诊断”“治疗”“康复”全流程的人工智能支持，满足医生从临床诊断、手术规划到术前模拟的全流程需求，高便捷性地进行“诊疗愈”全栈操作。


    SenseCare智慧诊疗平台利用高效的视觉人工智能，主要从两个方面大幅提高了病理诊断效率，减轻了病理医生的工作负担：一是能够基于数字化病理切片，通过视觉人工智能算法，大批量、快速处理图像数据，直接提示并定位病灶，极大地缩短了单张病理切片的读片时间；二是对于切片进行初步筛查，从而进一步优化病理医生的资源分配——算法计算为恶性的切片，可以由高年资医生着重诊断，确定癌症种类及分型，算法计算为良性的切片，医生可快速确认人工智能结果。


    SenseCare平台在研发初期，联合上海第一人民医院及商汤医疗合作伙伴，面向多种技术质量及评估标准，基于上万例病人的真实数据，包括随访数据——覆盖消化道常见恶性病变，100万+癌症区域数据及10万+恶性细胞数据，训练模型以提高算法精度。此外，平台的开发人员结合医生每周的使用反馈和需求，对算法进行周期性迭代和优化，不断提升SenseCare智慧病理人工智能应用在实际使用中的精度和速度。


    ![](img/951a2171a213838862fedd56f63c7110_71_0.png)


    正是秉承“立足医疗大数据、服务临床诊疗愈”这一理念，SenseCare智慧诊疗平台基于平台的可灵活拓展性，迄今已推出包含胸部CT、胸部X线、心脏冠脉、病理、骨肿瘤等多款产品解决方案，覆盖超过13个人体部位和器官，为多科室的临床诊疗需求提供人工智能助力，帮助临床医生进行高精度疾病检测、分型、良恶性预测等多维分析，以及3D术前规划与模拟等治疗方案的设计。


    ### (3) 方案实施后的价值或成果


    在筛查精准度上，平台对相关疾病高危病例检出率可达到100%，排阴率超过80%。此外，平台融合商汤OCR技术，将数字切片的人工智能计算结果与病理编号相关联，简化医生搜索匹配流程，系统化地打造基于人工智能的数字病理辅助阅片平台。


    在新冠疫情期间，SenseCare胸部CT智能临床解决方案第一时间驰援北京、上海、天津、山东、河北、福建等多省市新冠肺炎重点筛查医院，高效、准确地为前线医务工作者提供决策依据。“我们通过引入商汤科技SenseCare肺部人工智能分析产品，能够实现对新冠肺炎CT影像的智能化诊断与定量评价，几秒内就能完成定量分析，自动筛查疑似。”青岛某医院放射科主任介绍其团队能以最短的时间出具检查报告，避免人员长时间滞留，降低交叉感染风险，背后的秘密就是人工智能辅助诊断。


