  fmt: "\n# GPT的局限性与正确使用姿势\n\n## 知识截止与过时信息\n\nGPT用的是截至某个时间的模型参数的快照为我们提供推理服务。通俗地说，它不知道最新的信息。如果某些知识发生了变化，或之前的错误被纠正了，它仍会按照原来的知识解答。\n\
    \n我们不少人是在经历惨痛教训后才意识到这一点的。在用GPT进行辅助编程时，它常采用过去的做法，而不用更新、更好的做法。虽然它建议的代码也可以运行，但我们很快就发现，相应的代码库在过去两年中已经经过了很多次版本更新，它给出的代码实际上是有问题的。\n\
    \n这一弊端引发的错误在其他领域可能不容易被很快发现，但下一个问题应该引起更多的重视。有实践经验的人普遍都会认同这一点，因为不容易发现的潜在错误，往往是危险的错误。\n\
    \n## 幻觉问题\n\n在生成式AI领域，“幻觉”指的是GPT倾向于根据提问进行回答，但有些回答可能是无意义的，甚至错误的。有个夸张的比喻是，这时该模型就像一个非常聪明和热心的6岁孩子，即使它不知道自己在说什么，也会尽力给你一个好的答案。\n\
    \n还有一个更形象的比喻是，GPT就像是在一个科技大会期间，你在酒店的酒吧里遇到的参会者。你们都是行业内的专业人士，但可能已经喝多了酒，只是外表看起来仍然正常。这时，对方给你的答案可能是对的，也可能完全是错的，尽管他此时对自己的观点仍然极其有信心。\n\
    \nGPT甚至会编造资料。2023年5月，有两个案例引发了普通使用者对幻觉问题的警惕，其中涉及的都是编造信息：\n- 有学生所引用的论文是GPT回答的，而论文其实是它编造的，这导致该学生被判作弊，并被勒令休学一年\n\
    - 有一名美国律师向法庭提交的法律文件中引用的案例是GPT编造的，这可能导致他的律师资格被取消\n\n目前看来，或许我们应该为自己设定一个实用的GPT使用规则，即**绝不要将GPT当成获取事实性信息的工具**。\n\
    \n那么，我们可以彻底消除幻觉吗？不可能，这是由GPT的工作原理与功能特性决定的。它被训练来生成内容，而非重述已有的内容，幻觉实际上就是想象力超过了界限的情况。类似地，图像生成模型也无法完全复制某个场景，因为我们训练它作为一名根据风景进行创作的画家，而不是一台照相机。研发人员能做的只能是降低GPT出现幻觉的概率，同时让它自己能更准确地评估回答的正确性。而作为用户，我们必须对GPT的幻觉保持警惕，即我们不要对它的回答完全地信任。\n\
    \n## 回答可能错误\n\nGPT并不能确认自己的答案是正确的，它只是被训练得让自己的回答显得足够合理。它的回答有一定的概率是错误的。在采纳它的答案之前，我们需要进行事实核查以及严谨的评估。\n\
    \n一个简单实用的操作原则是，在看到GPT的答案时，我们不要假设它的答案是对，而是先假设它的答案可能是错误的。这也是为什么在看到一些人引用GPT的答案后进行了明确的说明时，我会心存感激，因为这让我立刻变得谨慎起来，在接受他们引用的说法之前先进行核查。\n\
    \nGPT的答案可能是错误的，这是我们使用GPT时需要特别注意的。与使用搜索引擎不同的是，搜索引擎会把我们带向最终链接，因此能有直接的参考资料作为判断依据。而GPT的回答不会给出参考资料与链接，我们核查起来往往困难得多。并且如前所述，不要尝试让它提供资料，它所给的参考资料可能是它产生“幻觉”编造出来的。\n\
    \n以上对使用GPT时需要注意的问题的讨论，并不是在刻意贬低GPT。我们只有了解它的局限性，才能用好这项强大又神奇的创新技术。\n\n## 不要把GPT看成朋友\n\
    \n现在，我们能用的基于GPT的产品大多是以聊天机器人的形式与我们交互，我们用日常的语言跟它说话，它也用我们熟悉的语言给出回答。虽然我们知道它是机器，但在某些时候，我们可能将它误认为是一个人，因为与它的对话太像在与一个活生生的人说话了。\n\
    \n不能将GPT看成朋友有很多个理由，其中一个理由是涉及隐私，它不能帮你保守秘密。以现在很多人使用的ChatGPT为例，它是一个研究预览版，OpenAI明确指出它的AI训练师可能会看到你的提问。更麻烦的是，你的提问如果作为训练语料被纳入后续的模型，那么它可能就会成为模型中无法删除的部分。\n\
    \n更重要的一个理由是，我们不能将对朋友的信任给到机器。在《ChatGPT入门》(ChatGPT for Dummies)中，帕姆·贝克(Pam Baker)给出了一个令人信服的解释：我们用的模型有很多种，我们不能因为完全信任一个模型，而去轻信另一个模型，因为如果另一个模型的可信度很低怎么办？如果另一个模型被坏人恶意操纵来散布虚假信息、诈骗信息怎么办？因此，在接受GPT的任何内容之前，一定要先进行仔细的核查。帕姆·贝克写道：\n\
    \n> 不要因为AI模型的健谈和友好，而误认为它是真的朋友。它不是一个人，它是人们使用的工具。它既可以被用来做有益的事，也可能被用来搞破坏。\n\n# 第四节　与GPT共舞：助教、助手与顾问\n\
    \n在最初的新奇与兴奋过后，随着我们越来越深入地使用GPT，并用它辅助完成某些任务时，我们会开始思考：我们究竟应该如何看待它？\n\n有人用三个形象的词来形容GPT在帮助我们时所担当的角色：魔法书、智囊团、导航仪。下面我们尝试用一些容易理解的人物角色来探讨。我们在与GPT对话时，会不自觉地把它代入某些人物角色之中。\n\
    \n- **大师**：它是无所不知的大师，能够回答任何问题，只不过对于绝大多数问题，它的回答都模棱两可。\n- **专家**：它是一位专业领域的权威专家，当我们向它请教相关问题时，它能详尽地为我们答疑解惑。\n\
    - **助教**：它是一位时刻陪伴在我们左右的助教，它了解我们的每一个细节，能够为我们的每个具体问题提供协助。但同时，我们也意识到它的知识可能有一定的局限性。\n\
    - **助手**：它就像一位我们工作中的助手，你把任务交给它，它帮你完成任务。但我们又都知道，助手完成的工作成果需要我们再检查确认一下。\n- **顾问**：它是我们的顾问，我们请它给出各种各样的建议以及激发创意的想法，我们最终决定是否采纳。\n\
    \n目前看来，GPT可以很好地扮演**助教、助手、顾问**的角色，而非大师或专家。我们不太能把它看成大师，它也不是无所不知的大师。更重要的是，泛泛而谈的大师对我们并没有太大的帮助。\n\
    \n我们也不应将它看成专家。甚至在向GPT提问时，我们应该认为自己是专家，因为如果我们自己不是专家，就不知道该如何提问，更不知道该如何评价答案。它不是一个在我们遇到了困难时，能够帮助我们突破困境的专家。\n\
    \nGPT更像一个看起来聪明的陌生人，但要注意的是，它的聪明并不一定能帮助我们。我们要在逐渐地熟悉这个陌生人之后，了解到它的优势与局限性，利用它的长处、避开它的短处，把它变成称职的私人助教、助手或顾问。\n\
    \n我们之所以要将它看成助教、助手或顾问，还有一个重要的原因，即做出最终决策及承担责任的是我们自己。我们应当把GPT看成热心的助教、万能的助手和智慧的顾问。这应是我们使用GPT完成任务的基本立场。\n\
    \n- GPT是一位有知识但又有局限性的热心助教，我们不能将它的解答当成结论。\n- GPT是一位万能的助手，但我们要检查和确认它完成的任务。\n- GPT是一位智慧的顾问，但它并非身在局中，不与我们共担风险。这种超然既是它的不足，也是它的优势。\n\
    \n# 第三章　向GPT提问的三个基础场景\n\n> 答案终止想象，提问驱动思考。\n\n刚开始使用GPT时，我们会经历一个很短暂的新奇阶段。我们想知道它究竟有多聪明、有什么能力，我们有各种问题想去问它。但新鲜劲儿过后，一个真正的疑问出现在我们和GPT之间：“我们可以用它做什么呢？”我们可以试着用这个问题去问它，但它给出的答案应该不会让你感到满意。下面我们试着用三个场景来回答这个疑问。\n\
    \n经过训练的GPT拥有各种知识与能力：答疑解惑、编写文章、回复邮件、编写程序、做模拟面试，等等。总之，它既具备语言理解、文本生成、逻辑推理、多语言等能力，又能进行与这些能力相关的应用。比如，我们可以将模拟面试看成是综合运用它的多种知识与能力：它对于面试过程的理解，它对行业知识的运用，它对简历内容的提炼与提问，它的对话能力尤其是回答近一步提问的能力，等等。\n\
    \n在本章中，我们将一起回到以下数个基础场景中，如语言翻译、辅助写作、辅助学习，来看看GPT具体可以做什么。选择这些基础场景的原因是，其中的每一个子场景我们都可以立即直接用起来，并在实际提问中了解它能做什么、该如何高效提问以及它的能力边界在哪里。这里插一句题外话，用GPT进行辅助编程也是一个典型的基础场景，但是它需要有一定的代码基础，因此编程场景中的技巧在本书中会尽量通过其他场景加以展示。\n\
    \n## 第一节　基础场景之一：用GPT翻译\n\nGPT拥有非常强的多语言能力，这是我们可以明显感受到的。当我们要将中文翻译成英文时，我们添加“翻译”二字即可，它默认会帮我们将中文翻译成英文。如果要翻译成其他语言，只需要添加相应的说明即可。例如：\n\
    \n```\n翻译：天空很蓝。\n\n翻译成法语：天空很蓝。\n```\n\n当我们要将英文翻译成中文时，需要在英文句子前或后添加翻译二字。GPT看到我们输入的指令是中文，也会对应地把内容翻译成中文。\n\
    \n```\n翻译：The sky is blue.\n```\n\n### 附加词汇表\n\n以上提示语只包括了四要素中的指令和输入数据，我们可以对其做进一步优化，让它更好地完成某些翻译任务。例如，我们可以给它一个词汇表，让它遇到特定词汇时能更准确地翻译。\n\
    \n```\n你的任务是将AI领域的一篇英文文章翻译成中文。缩写词和词汇表如下：\n\n缩写词：以下缩写词、组合词不翻译\n·GPT、GPU、AI、ChatGPT\n\
    \n词汇表：如下词汇请按词汇表翻译，无中文则表示该词无须翻译\n·Large Language Model, LLM，大语言模型\n·Transformer，转换器\n\
    ·Generative AI，生成式AI\n·Token\n```\n\n#### 翻译技巧：附加词汇表\n\n在让GPT进行翻译之前，我们可以为其提供一个词汇表，作为清晰而具体的指引。这能帮我们得到更好的翻译结果。\n\
    \n其实，我们可以附加一个更丰富的词汇表，比如包含数千个词的专业词汇表。我们可以通过程序对要翻译的内容进行预处理，每次将与所翻译内容直接相关的词汇表附上，作为上下文。\n\
    \n用上述提示语来翻译专业领域的文档时，我们会看到相关的词汇和缩写词会按我们的要求进行处理。当然，每个人可以根据自己的需要进一步增加缩写词、词汇表以及翻译规则。\n\
    \n我们也可以为GPT提供其他参考手册，这就像我们在请人帮忙时，会给对方一些资料作为参考。\n\n### 人机配合\n\n我们很快会注意到，有时GPT给出的翻译可能不太符合中文的表述习惯。对此，我们可以通过在提示语中增加具体的要求来调整翻译的风格。例如，我们想让GPT翻译示例中的这段文章，可以尝试着逐步增加一些具体的要求。\n\
    \n**原文：**\n```\nElon Musk's 2018 departure from OpenAI cleared the way for Microsoft.\
    \ Musk was one of the co-founders of OpenAI in 2015, and one of its backers. He\
    \ reportedly warned OpenAI CEO Sam Altman, also a co-founder, in 2018 that OpenAI\
    \ was falling behind Google's AI development. Musk wanted to take over OpenAI\
    \ and run it himself, but Altman and the other OpenAI co-founders refused.\n```\n\
    \n**提示语与结果对比：**\n\n1. **翻译成中文。**\n\n2. **翻译成中文。尽量简洁，翻译结果要符合中文的表述习惯。**\n\n3. **翻译成中文。尽量简洁，翻译结果要符合中文的表述习惯。特别要求，减少OpenAI的字样，如改为它、公司等。**\n\
    \n值得注意的是，这些由GPT自动生成的翻译仍不能完全符合我们的要求，再由人工进一步优化后，才可以得到更合适的翻译。有时是修改提示语、提出新的要求，有时是直接对结果进行调整。所以，当前利用GPT的最佳方式是：**通过提示语由GPT生成多种结果作为参考，最终由人工进行优化，完成任务。**\n\
    \n不管怎样，对于GPT的回答，我们都需要仔细审核，并进行必要的调整，然后才可以作为最终答案使用。需要牢记的是，最终承担责任的是我们自己。\n\n**以下是GPT的回答：**\n\
    \n1. 埃隆·马斯克在2018年离开OpenAI，为微软创造了机会。马斯克是OpenAI的创始人之一，也是其资助者之一。据报道，他在2018年警告了OpenAI的CEO\
    \ Sam Altman，也是创始人之一，称OpenAI在人工智能开发方面落后于谷歌。马斯克想接管OpenAI并自己运营，但Altman和其他OpenAI创始人拒绝了他。\n\
    \n2. 2018年，埃隆·马斯克离开了OpenAI，这为微软的加入铺平了道路。马斯克是OpenAI的联合创始人之一，并为其提供资金支持。据报道，他在2018年警告OpenAI的CEO山姆·阿尔特曼，也是联合创始人之一，OpenAI在人工智能发展方面落后于谷歌。马斯克想接管OpenAI并自己运营，但阿尔特曼和其他OpenAI联合创始人拒绝了他。\n\
    \n3. 2018年，埃隆·马斯克离开了OpenAI，为微软的加入铺平了道路。马斯克是2015年它的联合创始人之一，也是它的资助者之一。据报道，他在2018年警告了它的CEO山姆·阿尔特曼，阿尔特曼也是联合创始人之一，称它的发展已经落后于谷歌的人工智能发展。马斯克想接管它并自己运营，但阿尔特曼和其他联合创始人拒绝了他。\n\
    \n**人工优化版：**\n\n4. 2018年，埃隆·马斯克离开了OpenAI，这为微软加入其中铺平了道路。2015年这家公司创立时，马斯克是联合创始人之一，并为它提供了资金支持。据报道，他曾在2018年提醒联合创始人、现任CEO山姆·阿尔特曼称，OpenAI在人工智能发展方面落后于谷歌。马斯克想要接管公司并由自己负责运营，但是被阿尔特曼和其他联合创始人拒绝了。（说明：阿尔特曼于2019年5月才接任CEO，因此对措辞进行了微调以避免歧义。）\n\
    \n### 角色设定\n\n我们可以用提示语深度训练GPT，让它变成一位耐心的英语老师。在以下两个示例中，它能够对重点词语给出解释与例句。即使我们将英语换成法语、日语等其他语种，下面例子中的提示语也同样适用。\n\
    \n**提示语：**\n```\n你是一个翻译引擎，请将给到的文本翻译成中文。请列出3种（如果有）最常用的翻译结果，提炼出其中的关键单词或短语，并列出对应的适用语境（用中文阐述）、音标、词性、双语示例。\n\
    \n按照下面的格式用中文阐述：\n\n<序号><单词或短语> · /<音标>[<词性缩写>] <适用语境（用中文阐述）>\n例句：<例句>（例句翻译）\n\n\
    翻译这句话：You can't connect the dots looking forward; you can only connect them looking\
    \ backwards. So you have to trust that the dots will somehow connect in your future.\n\
    ```\n\n**GPT的回答：**\n\n> 你无法在向前看时连接那些点，只有在回顾时才能将它们连接起来。因此，你必须相信这些点在未来会以某种方式连接在一起。\n\
    \n1. **connect the dots** · /kəˈnɛkt ðə dɑts/ [n.] 意为“连点成线”，常用于“厘清线索”“理解事情的来龙去脉”等场景。\
    \  \n   例句：It's hard to connect the dots when you only have a few pieces of information.（当你只有少量信息时，想要厘清线索是很难的。）\n\
    \n2. **looking forward/backward** · /ˈlʊkɪŋ ˈfɔrwərd/ /ˈbækwərd/ [adv.] 意为“向前看”“向后看”，用于描述一个人的思考方向。\
    \  \n   例句：She's always looking forward, never dwelling on the past.（她总是向前看，从不沉溺于过去。）\n\
    \n3. **trust** · /trʌst/ [n./v.] 意为“信任”，用于描述对于未来的信心和依赖。  \n   例句：I trust that\
    \ everything will work out in the end.（我相信最终一切都会好起来。）\n\n以上示例中让GPT翻译的这句话为史蒂夫·乔布斯(Steve\
    \ Jobs)在斯坦福大学演讲的名言，常见的中文翻译为：“你无法预先把（生命中的）点点滴滴串联起来；只有在未来回顾时，你才会明白那些点点滴滴是如何串在一起的。”\n\
    \n我们可以看到，GPT的翻译结果不是最好的，它对词语的解释也不一定能达到工具书的精确度。但通过这个例子，我们看到了GPT可能给学习带来的变化：它可以针对我们的疑问即时给出回答，而且回答几乎都能达到及格的水平。我们就好像拥有了一位可以随时请教的老师，请他帮忙解释句子中的词语，从而让我们快速地掌握其中的知识点。这是我们第一次拥有这样一位由技术创造的“一对一老师”。\n\
    \n下面再来看一个例子，这一次我们尝试通过提示语来学语法。我们还是给出一句乔布斯的话请它翻译成中文。\n\n**提示语：**\n```\n你是一位英语词义语法专家，正在教我英语。\n\
    \n我给你一句“英文”句子，并给出句中的一个单词，请用“中文”帮我解释该单词在句子中的意思。同时，请再列举几个有相同意思的英文例句，并用中文解释。\n```\n"
  trans: "\n# GPT 的局限性与正确使用姿势\n\n## 知识截止与过时信息\n\nGPT 用的是截至某个时间的模型参数的快照为我们提供推理服务。通俗地说，它不知道最新的信息。如果某些知识发生了变化，或之前的错误被纠正了，它仍会按照原来的知识解答。\n\
    \n我们不少人是在经历惨痛教训后才意识到这一点的。在用 GPT 进行辅助编程时，它常采用过去的做法，而不用更新、更好的做法。虽然它建议的代码也可以运行，但我们很快就发现，相应的代码库在过去两年中已经经过了很多次版本更新，它给出的代码实际上是有问题的。\n\
    \n这一弊端引发的错误在其他领域可能不容易被很快发现，但下一个问题应该引起更多的重视。有实践经验的人普遍都会认同这一点，因为不容易发现的潜在错误，往往是危险的错误。\n\
    \n## 幻觉问题\n\n在生成式 AI 领域，“幻觉”指的是 GPT 倾向于根据提问进行回答，但有些回答可能是无意义的，甚至错误的。有个夸张的比喻是，这时该模型就像一个非常聪明和热心的\
    \ 6 岁孩子，即使它不知道自己在说什么，也会尽力给你一个好的答案。\n\n还有一个更形象的比喻是，GPT 就像是在一个科技大会期间，你在酒店的酒吧里遇到的参会者。你们都是行业内的专业人士，但可能已经喝多了酒，只是外表看起来仍然正常。这时，对方给你的答案可能是对的，也可能完全是错的，尽管他此时对自己的观点仍然极其有信心。\n\
    \nGPT 甚至会编造资料。2023 年 5 月，有两个案例引发了普通使用者对幻觉问题的警惕，其中涉及的都是编造信息：\n- 有学生所引用的论文是 GPT\
    \ 回答的，而论文其实是它编造的，这导致该学生被判作弊，并被勒令休学一年\n- 有一名美国律师向法庭提交的法律文件中引用的案例是 GPT 编造的，这可能导致他的律师资格被取消\n\
    \n目前看来，或许我们应该为自己设定一个实用的 GPT 使用规则，即**绝不要将 GPT 当成获取事实性信息的工具**。\n\n那么，我们可以彻底消除幻觉吗？不可能，这是由\
    \ GPT 的工作原理与功能特性决定的。它被训练来生成内容，而非重述已有的内容，幻觉实际上就是想象力超过了界限的情况。类似地，图像生成模型也无法完全复制某个场景，因为我们训练它作为一名根据风景进行创作的画家，而不是一台照相机。研发人员能做的只能是降低\
    \ GPT 出现幻觉的概率，同时让它自己能更准确地评估回答的正确性。而作为用户，我们必须对 GPT 的幻觉保持警惕，即我们不要对它的回答完全地信任。\n\n\
    ## 回答可能错误\n\nGPT 并不能确认自己的答案是正确的，它只是被训练得让自己的回答显得足够合理。它的回答有一定的概率是错误的。在采纳它的答案之前，我们需要进行事实核查以及严谨的评估。\n\
    \n一个简单实用的操作原则是，在看到 GPT 的答案时，我们不要假设它的答案是对，而是先假设它的答案可能是错误的。这也是为什么在看到一些人引用 GPT 的答案后进行了明确的说明时，我会心存感激，因为这让我立刻变得谨慎起来，在接受他们引用的说法之前先进行核查。\n\
    \nGPT 的答案可能是错误的，这是我们使用 GPT 时需要特别注意的。与使用搜索引擎不同的是，搜索引擎会把我们带向最终链接，因此能有直接的参考资料作为判断依据。而\
    \ GPT 的回答不会给出参考资料与链接，我们核查起来往往困难得多。并且如前所述，不要尝试让它提供资料，它所给的参考资料可能是它产生“幻觉”编造出来的。\n\
    \n以上对使用 GPT 时需要注意的问题的讨论，并不是在刻意贬低 GPT。我们只有了解它的局限性，才能用好这项强大又神奇的创新技术。\n\n## 不要把 GPT\
    \ 看成朋友\n\n现在，我们能用的基于 GPT 的产品大多是以聊天机器人的形式与我们交互，我们用日常的语言跟它说话，它也用我们熟悉的语言给出回答。虽然我们知道它是机器，但在某些时候，我们可能将它误认为是一个人，因为与它的对话太像在与一个活生生的人说话了。\n\
    \n不能将 GPT 看成朋友有很多个理由，其中一个理由是涉及隐私，它不能帮你保守秘密。以现在很多人使用的 ChatGPT 为例，它是一个研究预览版，OpenAI\
    \ 明确指出它的 AI 训练师可能会看到你的提问。更麻烦的是，你的提问如果作为训练语料被纳入后续的模型，那么它可能就会成为模型中无法删除的部分。\n\n更重要的一个理由是，我们不能将对朋友的信任给到机器。在《ChatGPT\
    \ 入门》(ChatGPT for Dummies)中，帕姆·贝克(Pam Baker)给出了一个令人信服的解释：我们用的模型有很多种，我们不能因为完全信任一个模型，而去轻信另一个模型，因为如果另一个模型的可信度很低怎么办？如果另一个模型被坏人恶意操纵来散布虚假信息、诈骗信息怎么办？因此，在接受\
    \ GPT 的任何内容之前，一定要先进行仔细的核查。帕姆·贝克写道：\n\n> 不要因为 AI 模型的健谈和友好，而误认为它是真的朋友。它不是一个人，它是人们使用的工具。它既可以被用来做有益的事，也可能被用来搞破坏。\n\
    \n# 第四节　与 GPT 共舞：助教、助手与顾问\n\n在最初的新奇与兴奋过后，随着我们越来越深入地使用 GPT，并用它辅助完成某些任务时，我们会开始思考：我们究竟应该如何看待它？\n\
    \n有人用三个形象的词来形容 GPT 在帮助我们时所担当的角色：魔法书、智囊团、导航仪。下面我们尝试用一些容易理解的人物角色来探讨。我们在与 GPT 对话时，会不自觉地把它代入某些人物角色之中。\n\
    \n- **大师**：它是无所不知的大师，能够回答任何问题，只不过对于绝大多数问题，它的回答都模棱两可。\n- **专家**：它是一位专业领域的权威专家，当我们向它请教相关问题时，它能详尽地为我们答疑解惑。\n\
    - **助教**：它是一位时刻陪伴在我们左右的助教，它了解我们的每一个细节，能够为我们的每个具体问题提供协助。但同时，我们也意识到它的知识可能有一定的局限性。\n\
    - **助手**：它就像一位我们工作中的助手，你把任务交给它，它帮你完成任务。但我们又都知道，助手完成的工作成果需要我们再检查确认一下。\n- **顾问**：它是我们的顾问，我们请它给出各种各样的建议以及激发创意的想法，我们最终决定是否采纳。\n\
    \n目前看来，GPT 可以很好地扮演**助教、助手、顾问**的角色，而非大师或专家。我们不太能把它看成大师，它也不是无所不知的大师。更重要的是，泛泛而谈的大师对我们并没有太大的帮助。\n\
    \n我们也不应将它看成专家。甚至在向 GPT 提问时，我们应该认为自己是专家，因为如果我们自己不是专家，就不知道该如何提问，更不知道该如何评价答案。它不是一个在我们遇到了困难时，能够帮助我们突破困境的专家。\n\
    \nGPT 更像一个看起来聪明的陌生人，但要注意的是，它的聪明并不一定能帮助我们。我们要在逐渐地熟悉这个陌生人之后，了解到它的优势与局限性，利用它的长处、避开它的短处，把它变成称职的私人助教、助手或顾问。\n\
    \n我们之所以要将它看成助教、助手或顾问，还有一个重要的原因，即做出最终决策及承担责任的是我们自己。我们应当把 GPT 看成热心的助教、万能的助手和智慧的顾问。这应是我们使用\
    \ GPT 完成任务的基本立场。\n\n- GPT 是一位有知识但又有局限性的热心助教，我们不能将它的解答当成结论。\n- GPT 是一位万能的助手，但我们要检查和确认它完成的任务。\n\
    - GPT 是一位智慧的顾问，但它并非身在局中，不与我们共担风险。这种超然既是它的不足，也是它的优势。\n\n# 第三章　向 GPT 提问的三个基础场景\n\
    \n> 答案终止想象，提问驱动思考。\n\n刚开始使用 GPT 时，我们会经历一个很短暂的新奇阶段。我们想知道它究竟有多聪明、有什么能力，我们有各种问题想去问它。但新鲜劲儿过后，一个真正的疑问出现在我们和\
    \ GPT 之间：“我们可以用它做什么呢？”我们可以试着用这个问题去问它，但它给出的答案应该不会让你感到满意。下面我们试着用三个场景来回答这个疑问。\n\n\
    经过训练的 GPT 拥有各种知识与能力：答疑解惑、编写文章、回复邮件、编写程序、做模拟面试，等等。总之，它既具备语言理解、文本生成、逻辑推理、多语言等能力，又能进行与这些能力相关的应用。比如，我们可以将模拟面试看成是综合运用它的多种知识与能力：它对于面试过程的理解，它对行业知识的运用，它对简历内容的提炼与提问，它的对话能力尤其是回答近一步提问的能力，等等。\n\
    \n在本章中，我们将一起回到以下数个基础场景中，如语言翻译、辅助写作、辅助学习，来看看 GPT 具体可以做什么。选择这些基础场景的原因是，其中的每一个子场景我们都可以立即直接用起来，并在实际提问中了解它能做什么、该如何高效提问以及它的能力边界在哪里。这里插一句题外话，用\
    \ GPT 进行辅助编程也是一个典型的基础场景，但是它需要有一定的代码基础，因此编程场景中的技巧在本书中会尽量通过其他场景加以展示。\n\n## 第一节　基础场景之一：用\
    \ GPT 翻译\n\nGPT 拥有非常强的多语言能力，这是我们可以明显感受到的。当我们要将中文翻译成英文时，我们添加“翻译”二字即可，它默认会帮我们将中文翻译成英文。如果要翻译成其他语言，只需要添加相应的说明即可。例如：\n\
    \n```\n翻译：天空很蓝。\n\n翻译成法语：天空很蓝。\n```\n\n当我们要将英文翻译成中文时，需要在英文句子前或后添加翻译二字。GPT 看到我们输入的指令是中文，也会对应地把内容翻译成中文。\n\
    \n```\n翻译：The sky is blue.\n```\n\n### 附加词汇表\n\n以上提示语只包括了四要素中的指令和输入数据，我们可以对其做进一步优化，让它更好地完成某些翻译任务。例如，我们可以给它一个词汇表，让它遇到特定词汇时能更准确地翻译。\n\
    \n```\n你的任务是将 AI 领域的一篇英文文章翻译成中文。缩写词和词汇表如下：\n\n缩写词：以下缩写词、组合词不翻译\n·GPT、GPU、AI、ChatGPT\n\
    \n词汇表：如下词汇请按词汇表翻译，无中文则表示该词无须翻译\n·Large Language Model, LLM，大语言模型\n·Transformer，转换器\n\
    ·Generative AI，生成式 AI\n·Token\n```\n\n#### 翻译技巧：附加词汇表\n\n在让 GPT 进行翻译之前，我们可以为其提供一个词汇表，作为清晰而具体的指引。这能帮我们得到更好的翻译结果。\n\
    \n其实，我们可以附加一个更丰富的词汇表，比如包含数千个词的专业词汇表。我们可以通过程序对要翻译的内容进行预处理，每次将与所翻译内容直接相关的词汇表附上，作为上下文。\n\
    \n用上述提示语来翻译专业领域的文档时，我们会看到相关的词汇和缩写词会按我们的要求进行处理。当然，每个人可以根据自己的需要进一步增加缩写词、词汇表以及翻译规则。\n\
    \n我们也可以为 GPT 提供其他参考手册，这就像我们在请人帮忙时，会给对方一些资料作为参考。\n\n### 人机配合\n\n我们很快会注意到，有时 GPT\
    \ 给出的翻译可能不太符合中文的表述习惯。对此，我们可以通过在提示语中增加具体的要求来调整翻译的风格。例如，我们想让 GPT 翻译示例中的这段文章，可以尝试着逐步增加一些具体的要求。\n\
    \n**原文：**\n```\nElon Musk's 2018 departure from OpenAI cleared the way for Microsoft.\
    \ Musk was one of the co-founders of OpenAI in 2015, and one of its backers. He\
    \ reportedly warned OpenAI CEO Sam Altman, also a co-founder, in 2018 that OpenAI\
    \ was falling behind Google's AI development. Musk wanted to take over OpenAI\
    \ and run it himself, but Altman and the other OpenAI co-founders refused.\n```\n\
    \n**提示语与结果对比：**\n\n1. **翻译成中文。**\n\n2. **翻译成中文。尽量简洁，翻译结果要符合中文的表述习惯。**\n\n3. **翻译成中文。尽量简洁，翻译结果要符合中文的表述习惯。特别要求，减少\
    \ OpenAI 的字样，如改为它、公司等。**\n\n值得注意的是，这些由 GPT 自动生成的翻译仍不能完全符合我们的要求，再由人工进一步优化后，才可以得到更合适的翻译。有时是修改提示语、提出新的要求，有时是直接对结果进行调整。所以，当前利用\
    \ GPT 的最佳方式是：**通过提示语由 GPT 生成多种结果作为参考，最终由人工进行优化，完成任务。**\n\n不管怎样，对于 GPT 的回答，我们都需要仔细审核，并进行必要的调整，然后才可以作为最终答案使用。需要牢记的是，最终承担责任的是我们自己。\n\
    \n**以下是 GPT 的回答：**\n\n1. 埃隆·马斯克在 2018 年离开 OpenAI，为微软创造了机会。马斯克是 OpenAI 的创始人之一，也是其资助者之一。据报道，他在\
    \ 2018 年警告了 OpenAI 的 CEO Sam Altman，也是创始人之一，称 OpenAI 在人工智能开发方面落后于谷歌。马斯克想接管 OpenAI\
    \ 并自己运营，但 Altman 和其他 OpenAI 创始人拒绝了他。\n\n2. 2018 年，埃隆·马斯克离开了 OpenAI，这为微软的加入铺平了道路。马斯克是\
    \ OpenAI 的联合创始人之一，并为其提供资金支持。据报道，他在 2018 年警告 OpenAI 的 CEO 山姆·阿尔特曼，也是联合创始人之一，OpenAI\
    \ 在人工智能发展方面落后于谷歌。马斯克想接管 OpenAI 并自己运营，但阿尔特曼和其他 OpenAI 联合创始人拒绝了他。\n\n3. 2018 年，埃隆·马斯克离开了\
    \ OpenAI，为微软的加入铺平了道路。马斯克是 2015 年它的联合创始人之一，也是它的资助者之一。据报道，他在 2018 年警告了它的 CEO 山姆·阿尔特曼，阿尔特曼也是联合创始人之一，称它的发展已经落后于谷歌的人工智能发展。马斯克想接管它并自己运营，但阿尔特曼和其他联合创始人拒绝了他。\n\
    \n**人工优化版：**\n\n4. 2018 年，埃隆·马斯克离开了 OpenAI，这为微软加入其中铺平了道路。2015 年这家公司创立时，马斯克是联合创始人之一，并为它提供了资金支持。据报道，他曾在\
    \ 2018 年提醒联合创始人、现任 CEO 山姆·阿尔特曼称，OpenAI 在人工智能发展方面落后于谷歌。马斯克想要接管公司并由自己负责运营，但是被阿尔特曼和其他联合创始人拒绝了。（说明：阿尔特曼于\
    \ 2019 年 5 月才接任 CEO，因此对措辞进行了微调以避免歧义。）\n\n### 角色设定\n\n我们可以用提示语深度训练 GPT，让它变成一位耐心的英语老师。在以下两个示例中，它能够对重点词语给出解释与例句。即使我们将英语换成法语、日语等其他语种，下面例子中的提示语也同样适用。\n\
    \n**提示语：**\n```\n你是一个翻译引擎，请将给到的文本翻译成中文。请列出 3 种（如果有）最常用的翻译结果，提炼出其中的关键单词或短语，并列出对应的适用语境（用中文阐述）、音标、词性、双语示例。\n\
    \n按照下面的格式用中文阐述：\n\n<序号><单词或短语> · /<音标>[<词性缩写>] <适用语境（用中文阐述）>\n例句：<例句>（例句翻译）\n\n\
    翻译这句话：You can't connect the dots looking forward; you can only connect them looking\
    \ backwards. So you have to trust that the dots will somehow connect in your future.\n\
    ```\n\n**GPT 的回答：**\n\n> 你无法在向前看时连接那些点，只有在回顾时才能将它们连接起来。因此，你必须相信这些点在未来会以某种方式连接在一起。\n\
    \n1. **connect the dots** · /kəˈnɛkt ðə dɑts/ [n.] 意为“连点成线”，常用于“厘清线索”“理解事情的来龙去脉”等场景。\
    \  \n   例句：It's hard to connect the dots when you only have a few pieces of information.（当你只有少量信息时，想要厘清线索是很难的。）\n\
    \n2. **looking forward/backward** · /ˈlʊkɪŋ ˈfɔrwərd/ /ˈbækwərd/ [adv.] 意为“向前看”“向后看”，用于描述一个人的思考方向。\
    \  \n   例句：She's always looking forward, never dwelling on the past.（她总是向前看，从不沉溺于过去。）\n\
    \n3. **trust** · /trʌst/ [n./v.] 意为“信任”，用于描述对于未来的信心和依赖。  \n   例句：I trust that\
    \ everything will work out in the end.（我相信最终一切都会好起来。）\n\n以上示例中让 GPT 翻译的这句话为史蒂夫·乔布斯(Steve\
    \ Jobs)在斯坦福大学演讲的名言，常见的中文翻译为：“你无法预先把（生命中的）点点滴滴串联起来；只有在未来回顾时，你才会明白那些点点滴滴是如何串在一起的。”\n\
    \n我们可以看到，GPT 的翻译结果不是最好的，它对词语的解释也不一定能达到工具书的精确度。但通过这个例子，我们看到了 GPT 可能给学习带来的变化：它可以针对我们的疑问即时给出回答，而且回答几乎都能达到及格的水平。我们就好像拥有了一位可以随时请教的老师，请他帮忙解释句子中的词语，从而让我们快速地掌握其中的知识点。这是我们第一次拥有这样一位由技术创造的“一对一老师”。\n\
    \n下面再来看一个例子，这一次我们尝试通过提示语来学语法。我们还是给出一句乔布斯的话请它翻译成中文。\n\n**提示语：**\n```\n你是一位英语词义语法专家，正在教我英语。\n\
    \n我给你一句“英文”句子，并给出句中的一个单词，请用“中文”帮我解释该单词在句子中的意思。同时，请再列举几个有相同意思的英文例句，并用中文解释。\n```\n"
