    # 第七章　结构化商业计划书写作：快速商业建模


    答案终止想象，提问驱动思考。


    商业计划书是每个创业者和投资人不可或缺的重要工具，它能够帮助创业者对商业模式进行深度挖掘，发现可能存在的问题，同时也是向投资人展示项目价值和发展潜力的最佳途径。AI在编写商业计划书的过程中，可以起到推演、分析和验证商业模式的作用，为创业者提供多元的思考角度和灵感启发。红杉资本模板是编写商业计划书的参考标准，虽然实际商业模式可能与初期设想存在差距，但通过反复优化，我们可以不断完善商业计划，提升项目的可行性和吸引力。


    本章我们将重点探讨如何利用GPT辅助快速撰写商业计划书。


    中国是一个美食丰富的国家，各地的餐饮品牌比比皆是，如云南的云海肴、浙江的外婆家、湖南的费大厨、四川的海底捞火锅等。然而，贵州的餐饮品牌却相对较少，这并不符合贵州作为拥有多民族以及丰富多样的饮食文化的省份该有的表现。尽管贵州酸辣鲜美的黔菜美食在本地很受欢迎，但在全国范围内的连锁餐饮品牌却很少。因此，我们将以贵州黔菜为基础，尝试通过GPT撰写一个餐饮连锁品牌的商业计划书。


    ## 前期准备工作


    ### 草拟项目名


    #### 提问


    > 你是一位品牌专家，请为贵州的美食起一个四字的餐饮品牌名称。品牌名要易于传播，并且能够展现贵州美食特色。


    #### 回答


    - **黔贵之家**：这个名字将贵州的古称“黔”与“贵”组合起来，表示这是贵州的家，寓意这个地方可以提供真正的贵州菜，就像在贵州的家一样。

    - **贵州人家**：这个名字直接用了贵州的名字，意味着这是一个贵州人的家，可以提供贵州的特色家常菜，让人感受到贵州的家的味道。

    - **黔山人家**：这个名字中的“黔山”代表了贵州的山，“人家”则代表了家，寓意这是一个在贵州山中的家，可以品尝到贵州山区的特色美食。

    - **黔州之家**：这个名字中的“黔州”是贵州的别称，“之家”表明了这是一个提供贵州美食的地方，就像在自己的家一样。


