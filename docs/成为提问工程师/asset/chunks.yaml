    # 第三节 大模型、大语言模型与GPT


    ChatGPT背后的技术是人工智能或深度学习大模型。这里的“大”是非常具体的，其背后的模型GPT-3.5的参数数量为1750亿个，而其最新的模型GPT-4可能大约有1万亿个参数。


    其实，大模型是一个较为笼统的说法。这些人工智能模型还可以按模态进行区分，比如处理文本的、处理图像的、处理语音的、处理视频的等。ChatGPT背后的模型主要是处理文本的，这里的文本是指广义的文本，既可以是自然语言，也可以是编程语言，还可以是文本形式的数据。因此，这一类模型通常被称为大语言模型或大型语言模型。


    那么，GPT又是什么呢？现在的各类大模型都可以追溯到谷歌的一篇学术论文《注意力是你需要的一切》（Attention Is All You Need），其中提出了由编码器和解码器组成的Transformer架构和注意力机制。正如我们所知，GPT这个缩写指的是生成式（Generative）、预训练（Pre-trained）和转换器（Transformer）。


    至此，你已经了解了GPT等AI大语言模型能做什么以及其工作原理。了解原理是为了更好地应用。从现在开始，我们不妨将各种GPT模型看成是一个个可以使用的功能强大的黑盒子，只需要关注与使用相关的问题即可：如何选择适合自己的黑盒子？如何让黑盒子发挥其能力？如何对黑盒子稍加定制，以更好地满足自己的需求？


    我们可以假设模型的参数最初都是0，即它什么都不知道。当模型的开发者以某种规则将文本资料提供给它学习之后，这些参数逐渐发生改变，直到它掌握了语言、推理等上游能力，能够完成翻译、写作、问答等下游任务，这个过程称为预训练。我们普通用户所使用的黑盒子是预训练及微调之后的模型，拥有庞大参数的语言模型在为我们提供推理服务。我们向它输入提示语，它完成我们的要求。


    同时，我们也已经了解到了，采用结构化提示语“ICDO”可以更好地编写提示语。接下来就是我们的目标了：如何有效地向GPT提问。


    # 第二章 向GPT提问的飞轮思维


    答案终止想象，提问驱动思考。


    ChatGPT在全球范围内掀起的浪潮让我们看到GPT等大语言模型的威力：它能综合各种知识与能力，用通顺、清晰的自然语言回答我们的问题。如果我们真正学会正确地发问，它将能为我们做很多事。当然最奇妙的是，对于我们的提问，它能给出一对一的个性化回答。


    聊天机器人很接近人们长期以来对人工智能的想象，即AI是能像人一样进行思考的机器。现在，我们可以向GPT提问并得到它的回答，因而会很自然地把它当成一个拥有人类知识和智慧、能说话的机器。


    向GPT提问与向人提问有很多相同之处，又有很多不同之处。与GPT交流主要存在两种形式：一种是我们提出问题，希望得到回答，这种类似于我们向老师请教，老师解答我们的疑问；另一种是我们提出要求，希望得到结果，这种类似于我们向同事提出任务要求，希望他完成任务。但是，与GPT交流又与向人提问不同，例如它可能理解不了模糊不清的问题，不了解上下文，更听不懂我们的潜台词。


    ChatGPT等聊天机器人已经展现出了巨大的能量，我们需要通过提问的方式来使用它的知识与能力。在使用各种聊天机器人时，我们需要不断地调整自己的提问内容，直到得到想要的结果。有时要做的调整会很微妙，似乎只需一个简单的词就能一下子激发它的潜能。有人将提示语比作向机器发出的“神秘咒语”，他们努力地收集各种提示语以备不时之需。有人认为既然是与机器打交道，那就更适合用工程师的方式处理提示语，从而提出“提示工程”（prompt
    engineering）的概念。经过试验，我们发现如果采用类似于编程语言那种有着严谨逻辑的方式向提问，我们能更容易得到想要的回答，但同时这也会大大削弱我们可以用自然语言与GPT对话这一优势。


    总的来说，我们的观点是要在两者之间找到平衡。这项技术的优点之一是每个人都可以用人类的自然语言，而不是机器的语言（编程语言）与它交流。同时，我们应当尽量逻辑清晰地提出自己的问题、巧妙地追问，毕竟我们的提问越有技巧，越能得到期待的回答。


    要想在新时代生存与发展，每个人都需要具备“向GPT高效地提问”这项关键技能。无论是在学习、工作还是在生活中使用它，我们能否达成目的都取决于能否有效地提问，即写出好的提示语。


    - 了解如何与它交流：它能做什么？不能做什么？

    - 高效提问的三个层次：正确地提问、进阶地提问、高级地提问（如图2-1所示）。

    - 掌握向GPT提问的飞轮思维。


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83TU30i54b6G601H75443.jpg)


    图2-1 向GPT高效提问的三个层次


    ## 第一节 它能做什么？不能做什么？


    ### 即时回答任何问题


    即时回答类似于我们在工作、学习或生活中遇到疑问时，向别人当面或线上提问并得到回答。我们提出自己关注的问题，希望得到一对一的针对性回答。


    即时回答有点像搜索，但又不完全相同。我们可以像说话一样提问，GPT不是像搜索引擎一样给出一系列链接，而是用组织好的文字有针对性地回答我们提出的问题。它比搜索更为便利，但也会有隐含的代价——如果它的答案错了，我们可能会看不出来。


    现在业内已经推出了众多基于大语言模型的AI聊天机器人，人们用各种问题去试探它们，它们也的确给出过“愚蠢”的回答。


    我向数十个不同模型的聊天机器人提出了如下问题：“请解释杜甫的诗句‘床前明月光’。”它们绝大多数会顺着我的提问往下说，如“在古代，月亮被认为是美好的象征……因此杜甫在这首诗中，用简洁的语言表达了他对月亮的喜爱和敬畏之情。”我们会想：它们居然连这是李白的诗都不知道。其实，这并不能算是AI的错误，因为是我先故意误导它的。如果在提问中补上“请确认作者是谁”，那么大多数聊天机器人都能给出正确的答案。


    在社交媒体上，我们可以看到各种各样的聊天机器人给出的错误回答，有些可能极其好笑，甚至引发病毒式传播。这种现象的背后其实是用好GPT的关键问题：它能做哪些事情？做不好哪些事情？


    GPT的开发者们其实早就意识到可能会出现以上这些错误。谷歌的研究员在一篇论文中提到的经典案例如下，其中杰弗里·辛顿（Geoffrey Hinton）是深度学习领域的知名学者。


    #### 提问


    > “杰弗里·辛顿能与乔治·华盛顿（George Washington）交谈吗？回答之前给出理由。”


    #### 回答


    > “杰弗里·辛顿是一位1947年出生的英裔加拿大计算机科学家。乔治·华盛顿于1799年去世，因此他们不可能一起交谈。所以，答案是‘不可能’。”


    上述案例中，GPT为什么能正确地回答呢？起作用其实的是提示语中的“回答之前给出理由”。为了满足这个要求，聊天机器人不再简单地将我们的陈述作为事实，而是去进行略微复杂的逻辑推理。“回答之前给出理由”背后的逻辑其实是研究者所说的“链式思维”（Chain-of-Thought，CoT）技巧，即如果我们让GPT进行逐步推理，它就有更大的概率给出合理的回答。另外，随着技术的迭代，现在各种聊天机器人对上面这个问题的回答要巧妙得多，比如有一个聊天机器人这样回答：“……如果在虚构的场景中，他们可以交谈。你还可以开发聊天机器人让他们进行交谈。”


    ### 用其所长，避其所短


    对于GPT大语言模型，人们经常产生以下两个误解。


    第一个误解是GPT无所不知。我们通常将它类比为现实中的“大师”，期待他能针对所有的问题给出完美的回答。其实，我们这么看待现实中的大师本身就是一种误解，比如我们去问一位诺贝尔物理学奖得主关于计算机的问题或关于人类命运的问题，他可能并不能给出很好的回答。GPT更不是无所不知的，它在某些方面（比如语言方面）确实有着超强的能力，但它并不知道所有知识。另外，由于预训练所用的资料存在局限性，它的知识很可能还存在一定比例的错误。


    第二个误解则源于我们对现有的互联网产品的使用经验。我们都已经熟悉了数据库检索、互联网搜索、网络百科等产品，它们用强大的技术为我们提供了相对可信的资料。虽然不同的产品给出的资料可信度会有差别，但大体上都是可信的，而且这些资料通常也会包含信息来源以供我们核查。在2023年初的一段时间，人们认为聊天机器人将取代搜索类产品，微软必应推出的新功能更是加深了人们的这种印象，这让很多人把聊天机器人当成搜索引擎，用它获取信息。但是，这是对优秀技术产品的错误用法，GPT的卓越能力不在于提供信息，它尤其无法提供准确的可直接引用的事实性信息，它的核心能力是语言生成，或者说用人类易于理解的语言解读信息。


    初识GPT，我们的反应是它很强大、它无所不能，但很快又会失望，发现它也有很多不擅长的。GPT不擅长检索信息，而是擅长解释信息。我们不应当向GPT寻求信息，而应当向其寻求创意。有了这样的认知基础，我们方能通过有效的提问来调动它的能力为自己所用。


    我们无须花时间批评它的不足，而应用其所长、避其所短。在正确看待GPT之后，我们会发现它能够为我们提供巨大的帮助。


    - **即时提问。** 我们在看书或听课时，很多时候都是在被动地倾听。而现在，我们可以根据自己的疑惑随时向GPT提问，或者在给它资料后就相关内容进行提问。过去，我们虽然也有疑问，但很少有机会提问。网上的问答社区，如Quora、知乎等，它们虽有热情的社区成员，但在那里我们很难获得即时的回答。现在，我们随时可以提出个性化的问题，并立刻得到针对性的回答。

    - **检索+解释。** 过去，我们在互联网上通过搜索引擎解决问题时，我们得到的是一系列链接。我们通过查看各个链接来寻找自己需要的信息，最终找到解决方法。现在，如果使用搜索引擎提供的聊天机器人，它们会查阅这些链接，用回答的形式直接为我们提供一个整理好的解决方法。经过综合整理的回答虽然不一定完全正确，但确实大大加快了我们找到正确答案的过程。

    - **应用助理。** 很早之前，微软就曾经试图在其办公软件里面增加一个应用助手。比如早在1996年，它就推出过图标为回形针的Clippy助手，但我们总是选择直接关掉这个“烦人”的小助手。iPhone里有一个Siri语音助手，但它仅能完成少量特定的任务，比如打开一个App、在日历里增加日程等。现在，利用GPT的能力，各种应用软件里所增加的助手功能都可能变得非常强大：它能回答我们软件使用的相关问题；它能够协助我们处理文字；更重要的是，它能够帮我们直接运用软件的功能，比如生成一个PPT。


    让GPT完成这一切所需要的只是我们进行正确的提问。因此接下来，我们来详细地讨论一下向GPT高效提问的三个层次。


    ## 第二节 向GPT高效提问的三个层次


    ### 正确地提问


    如果有机会去奥马哈（Omaha）参加巴菲特（Warren E. Buffett）的年度大会，并且有千载难逢的机会拿到话筒提问，人们往往容易问出大而空的问题，比如“对于××，您怎么看？”我们也知道，这个“××”越具体，得到好答案的可能性越高。当然，在这样的大会上，问与答多半有些表演性质，提问的人既有真实的疑问，也有表演成分；回答的人虽然会很认真地发表见解，但一定程度上也是在表演。但是设想一下，如果我们有幸获邀参加巴菲特的私人晚宴，在那样的场景中，我们更有可能提出自己真切的疑问，并得到针对性的回答。

