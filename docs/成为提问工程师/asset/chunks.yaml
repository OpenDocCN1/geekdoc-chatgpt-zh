    \  | ID：EPUB\\_20260428160408 \n\n## 第四节　与GPT共舞：助教、助手与顾问\n\n在最初的新奇与兴奋过后，随着我们越来越深入地使用GPT，并用它辅助完成某些任务时，我们会开始思考：我们究竟应该如何看待它？\n\
