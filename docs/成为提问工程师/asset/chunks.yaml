    \  | ID：EPUB\\_20260428160408 \n\n## 第一节　专业人士与外行的差别：知识框架与抓住要点的能力\n\n计算机科学家金出武雄有本书，书名是《像外行一样思考，像专家一样实践》。我对这句话的理解是，我们要跳出“盒子”，像外行一样寻找新创意，但落实时要像专业人士一样严谨。\n\
    \n当我们要寻求创意时，我们要像专家一样思考，让GPT像外行一样思考。\n\n当我们要落实方案时，我们要像专家一样思考，让GPT像专家一样实践。\n\n当我们使用GPT来辅助工作时，也可以借鉴这句话：当我们要寻求创意时，我们要像专家一样思考，让GPT像外行一样思考，这样它能带给我们很多天马行空的创意。当我们要落实方案时，我们要像专家一样思考，让GPT像专家一样实践。我们要设定框架、检查并决定是否接纳GPT的实践成果。如你所见，在两种情况下，我们人类都需要像专家一样思考。\n\
    \n我们每个人都或多或少是某个领域的专业人士，在这个领域受过系统的教育与培训，有一定的常识和直觉判断力，有惯用的思维框架，有随手可用的工具箱，有各种通常归之为隐性知识的经验及宝贵的教训。当开始使用GPT时，要重新审视自己的长处和不足，思考什么应该自己做、什么可以交给它做。现在看来，要与GPT共舞，尤其需要增强两方面的专业能力：构建知识体系的能力与抓住要点的能力。\n\
    \n高水平的专业人士拥有已内化的知识体系。当他们工作时，这些内化的知识体系会自然地影响他们思考的落脚点（我们的问题是什么）、方法选择（往哪个方向寻求解答）和结果评估（以什么标准判断解答是有效的）。\n\
    \n下面以每个商业人士都会关注的营销为例。我想起来前几年读过的小马宋那本通俗易懂的《营销笔记》。营销领域总会不断涌现出各种新概念、新方法，但作为这一领域的初级专业人士，熟练掌握一些基本的知识框架，如4P理论包含的产品(Product)、价格(Price)、推广(Promotion)、渠道(Place)，就足以应对大部分营销工作任务。小马宋展示的案例主要聚焦产品与价格，例如他提出了一个鲜明的观点：“价格也是产品的一种重要特征。”\n\
    \n假设有一个营销相关的问题需要向GPT提问，我们已经选定了一个知识框架（比如用价格定位产品），想要进行有针对性的提问（比如我们该如何设定价格），那么，GPT有很大概率会给出有参照性的案例、有启发性的观点。我们可以借助它解决自己遇到的营销问题。\n\
    \n反之，如果提问者没有选定知识框架，可能就会问出非常笼统的问题：“定价的方法有几种？”[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)或“请你帮我写一个彰显商品高价值的广告语。”这时，GPT的回答很难真正有用，因为提问者无法把回答放进框架，让它变成可用的方案。更重要的是，提问者无法借助自己的知识框架来判断回答的对错与价值。\n\
    \n实际上，GPT这类工具对于已有一定知识框架（即方法论）的专业人士来说最有价值。用GPT帮忙时，我们面对的场景不是“我有问题，AI有答案”，而是“我知道问题出在哪儿（因为我有一个知识框架），我要请AI针对某个具体问题提供帮助”。\n\
    \n我们可以按如下方式进一步强化自己的知识体系，从而更好地运用GPT。首先，在一个细分领域内，我们要掌握数个关于这一领域的主要方法论或思维工具，了解其原理、优势、不足以及适用场景。我们还要能针对亟待解决的问题选择相应的知识框架。\n\
