- raw: "我们让GPT多次回复这个提示语，得到了多个改写版本，其中一个版本的回答是：“我不再是坐在桌前，拿着笔在纸上创作的人。我唤醒聊天机器人，和它开始对话，就像在和一个久未见面的老朋友聊天一样。……在对话中，我的思想如同泉水一样，悄悄地涌出。”这段文字的确在一定程度上模仿了村上春树回忆自己写作时的散文风格。我们也可以设定其他作家的风格，给出相关的范文，GPT也能参照着改写。当然，我们也可以把自己过去的文章片段作为范文，让它模仿我们的风格写作。\n\
