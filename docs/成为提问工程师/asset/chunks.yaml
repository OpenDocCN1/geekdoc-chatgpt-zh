    # 前言


    ## 成为 AI 时代的超级个体


    假如 AI 能够做得比你更好，你应该怎么办？


    从 2022 年底开始，生成式 AI 与大模型的能力变成一个个简单易用的产品呈现在我们面前。人工神经网络模型的参数凝聚着人类的大部分知识与能力，一场“让知识触手可及”的新技术变革正在影响每一个人。“计算触手可及”“信息触手可及”两次数字化变革已经告诉我们，逃避机器或战胜机器是不可能的，我们只能尽早加入新潮流，与机器共舞。


    这里并非要渲染 AI 的危险，“机器霸主将统治人类”这样让人心生恐惧的画面并不是真的。我的看法是：AI 给我们带来的将是最好的时代。如果能够调用大模型中的知识与技能，我们每个人都有可能变得强大无比；如果掌握与大模型交互的方式，即通过提示语向模型提出要求，那么就能让它的知识与能力为我们所用。在
    AI 时代，人类将再次腾飞。


    我们需要做的是用提问来调用大模型的智能。对每个个体来说，大模型的智能是学习工具，我们可以用它加快学习；大模型的智能是提高生产率的工具，我们可以用它提升工作效率；大模型的智能更是生产工具，我们可以用它直接产出内容。


    在 AI 时代，每个人的新位置在哪里取决于个人现在如何行动。AI 给每个人带来的改变按沃顿商学院教授伊桑·莫利克(Ethan Mollick)所说的有三种可能：AI
    是技能平衡器，让普通人也有较好的能力；AI 是技能加速器，让所有人不同程度地变得更强；AI 是王者制造器，可以成倍地提升优秀个体的能力。对我们每个人来说，要尽力让第三种成为现实：精通向
    AI 提问的能力，让 AI 帮我们成为超级个体。也就是说，每个人都应该成为善于运用大模型智能的提问工程师。


    在我们看来，向 AI 提问有八个重要原则：


    - 原则之一：理解“生成的本质”是文本模式的预测。

    - 原则之二：警惕大模型的“幻觉”，始终对回答进行事实核查。

    - 原则之三：向 AI 提问时，采用 ICDO 等结构化提示语。

    - 原则之四：理解模型能从提示语中直接学习，并在提问时提供上下文。

    - 原则之五：让模型进行“链式思考”，采用“慢思考”模式。

    - 原则之六：提问时，将复杂的任务分解成更简单的子任务，再让 AI 处理。

    - 原则之七：用模型能理解的格式输入信息。

    - 原则之八：坐稳“主驾驶位”，与机器共舞。


    有人认为，学习向 AI 提问或所谓的提问工程就是简单地学习大模型这种工具的使用，因而，这是一种很浅显的技能。这其实是关于如何运用大模型智能的一种典型误解。最初接触时，提问工程的主要任务确实是掌握如何调用大模型的知识与技能，但很快就会发现，模型的能力固然强大，可当要在一个具体的领域运用它时，还需要自己掌握这个领域的知识框架。这才是向
    AI 提问的真正难点，也是每个人要持续在实践中学习与练习的。


    在推动这本书创作的过程中，本书的策划——出版人袁璐恰好展现了杰出的提问工程师的两种特质：第一，提出好问题，他提出一个问题，然后由我们三位作者与大模型一起给出解答；第二，了解知识框架，他带着“以图书作为知识传递的载体”这一框架推进这本书的创作与出版。在
    AI 时代，人与大模型共舞的过程是：杰出的提问工程师提出问题 → 用框架指导机器去干活 → 拿到结果。


    最后，还有一个问题待解答。我们掌握了向 AI 提问的能力、能够轻松调用大模型智能拿到结果，那我们以后就不用做任何其他事情了吗？并非如此。我们依然是人机共舞的主角：我们需要知道向哪儿走，即知道目标是什么。我们需要有直觉判断力（判断答案可能是什么）、理性判别力（判断答案正误）、鉴赏力（判断是否还有更好的答案）。最终，享受成果和承担责任的，是我们人类自己，而非机器。因此在这里，我尝试给出一个成为
    AI 时代超级个体的公式：AI 时代的超级个体 = （目标 + 认知 + 责任）× 提问的能力。


    # 第一章 理解 GPT


    答案终止想象，提问驱动思考。


    2022 年 11 月 30 日，OpenAI 公司通过一篇博客向大众推出了名为 ChatGPT 的 AI 聊天机器人。人们登录 OpenAI 官网，向 ChatGPT
    提出问题，就能获得答案。OpenAI 公司这样介绍自己的新产品：“我们训练了一个名为 ChatGPT 的 AI 模型，你可以通过对话的方式与它交互，它能够回答后续的问题、修正之前回答中的错误、质疑不正确的前提条件以及拒绝不当的请求。”介绍中所说的
    AI 模型指的是采用深度学习技术的人工神经网络，OpenAI 公司称之为 GPT。


    ChatGPT 聊天机器人一经推出，立刻成为互联网用户追捧的热门产品。2022 年 12 月 5 日，OpenAI 公司创始人山姆·奥特曼(Sam Altman)发布了一条推特(Twitter)：“今天，ChatGPT
    的用户数量超过了 100 万。”OpenAI 的早期投资者、联合创始人之一埃隆·马斯克(Elon Musk)在这条推特下面提问：“生成每条聊天的平均成本是多少？”奥特曼回答：“生成每条聊天的成本大约是几美分。我们还在想办法更精确地计算和优化生成聊天的成本。”


    此时，人们已经注意到 ChatGPT 是一个令人惊讶的产品：它是有史以来达到百万用户用时最短的互联网产品，创造了 5 天达到百万用户的全新纪录。此前，极具“病毒传播效应”的图片社交应用照片墙(Instagram)达到百万用户规模耗时
    2.5 个月，脸书(Facebook)耗时 10 个月，推特(Twitter)耗时 2 年（如图 1-1 所示）。此后，ChatGPT 的发展更是势不可挡。上线
    2 个月后，即 2023 年 2 月 1 日，各大媒体纷纷引述数据并进行分析报道：“2023 年 1 月，ChatGPT 的月活跃用户数达到了 1 亿，再次创造了纪录。”


    ![图 1-1 各大互联网产品达到百万用户的时间](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83H630d54b6G601Hfc34e.jpg)


    ChatGPT 为何能够快速地吸引如此多的用户呢？它为何能够引发新一轮 AI 浪潮？人们为何认为它将引爆全新的互联网变革与知识变革？


    使用新的 AI 工具的人已经深刻感受到，这一轮 AI 浪潮与之前的不太一样。2016 年，谷歌公司的围棋 AI 程序阿尔法狗(AlphaGo)战胜了人类围棋世界冠军。虽然人们惊叹于
    AI 能够进行如此复杂的思考，但是这项技术并没有马上变成每个人可用的产品。而这一次 ChatGPT 引发的 AI 浪潮中，各种各样的 AI 模型和产品“喷涌”而出，在搜索引擎、办公软件、在线教育平台等日常应用中，我们随处都可以直接体验到
    AI 提供的新功能。


    面对新浪潮，我们关心的不再只是过去那种过于宏大的问题。比如，如果机器会思考，人类的命运将会如何发展？现在，我们所关心的问题还与自身紧密相关：别人在用这些新推出的
    AI 工具做什么？我们如何快速掌握和熟练运用这些新技术？一些危言耸听的媒体报道甚至让人们陷入对未来的担忧：我会被 AI 取代吗？其实，你不会被 AI 取代，而会被熟练运用
    AI 的人取代。


    本书试图回答一个非常具体的问题：在快速了解这一轮生成式 AI 新技术的原理、能力以及局限性之后，我们如何掌握这些必备的新技能？如何向 AI 提问才能得到自己想要的答案？


    ## 第一节 GPT 为何火爆？它能做什么？


    截至本章写作之时，AI 聊天机器人 ChatGPT 仍是一款研究性预览版产品。数以亿计的用户明知它不是一个正式版产品，但仍然迫不及待地想要使用它。类似的技术和产品也吸引了非常多的用户，比如下列这些由大型科技公司推出的产品：微软的搜索引擎必应(Bing)推出的新必应聊天、谷歌推出的
    Bard 聊天机器人、百度推出的文心一言大语言模型、阿里巴巴在钉钉中推出的通义千问模型、笔记软件 Notion 和办公软件金山文档(WPS)推出的 AI 功能等。


    问答或对话是普通用户与这一轮新 AI 产品的典型交互方式。这类产品都是将用户提出的问题交给背后的大语言模型去处理，然后生成相应的内容再反馈给用户。在本书中，我们将各类
    AI 产品背后的模型称为“大语言模型”，而在讨论特定 AI 产品时，我们会用一个更为普及的词——GPT，来指代其背后的模型。GPT 是 OpenAI 于 2018
    年推出的第一代模型的缩写，意思是“生成式预训练转换器”(Generative Pre-trained Transformer)。


    下面以 ChatGPT 聊天机器人为例，来看看我们可以用它做什么。它的界面是一个聊天对话框，我们既可以与它问答（即一问一答），也可以与它开展多轮对话。我们可以用日常的语言（自然语言）与它对话，提出问题或提出要求，它会以文字的形式回答我们。


    ChatGPT 擅长很多事，它能完成很多我们曾经认为需要经过良好的教育和长期的训练才能做好的知识型任务，比如以下六类事务。


    - **语言翻译**：ChatGPT 精通多种语言，而且可以按要求完成各语种的翻译任务。

    - **摘要总结**：ChatGPT 能够理解长篇的文字并撰写出摘要，也可以根据会议的录音整理出会议记录。

    - **辅助写作**：ChatGPT 能够根据修改要求（如修正语法、改变文风）来修改一篇文章，且修改后的文字质量超过大多数普通人的写作水平。

    - **数学解题**：ChatGPT 能够解答数学题，并能给出解题过程和最终结果，它的数学能力相当强。

    - **编写程序**：ChatGPT 能够编写一段实现某个功能的程序。它既能够按照我们的要求，用规定的编程语言编写一段程序，也能够解释我们发给它的一段程序代码。

    - **数据分析**：ChatGPT 能够从文档中提取数据并进行分析。它能够对一家上市公司的财报数据进行总结和分析，并以文字的方式呈现。


    当我们与 ChatGPT 进行多轮对话时，就像在与一个人聊天。如果发现它答错了，或者给出我们不想要的答案，就可以纠正它。这种情况下，它会立刻认错，并迅速调整，输出新的回答。


    能够进行多轮对话这一重要的特点使得 ChatGPT 变得更加实用。因为它不一定能在一开始就完美地满足我们提出的要求，但是我们可以以多轮对话的方式为它补充信息、纠正错漏、完善要求，以“训练”它给出符合我们预期的回答。


    这种交互方式很像我们在日常工作中与他人沟通交流的方式。比如，我请一位同事帮忙做某事，一开始，或许是我提出的要求不够精确，又或许同事没能理解我的要求，他给出的反馈不符合我的期待。然后我会想办法完善自己的要求，并提供更多更具体的参考案例和相关资料。几轮沟通过后，他给出的结果将渐趋完美。ChatGPT
    采用的问答与对话模式使得普通人也能够用上其背后的 AI 模型。


    简言之，ChatGPT 让我们感到惊艳的能力主要有三个。


    - 它能够理解普通人说的话，并用普通人能理解的话给出回答，也就是能够理解自然语言、生成自然语言。

    - 它拥有各种各样的专业技能，如翻译、摘要、写作、算术、编程、分析等。

    - 它可以进行多轮对话，这让我们可以更好地使用它完成一些复杂的任务。


    GPT 能够理解我们的要求，并用我们能理解的语言给出回答。生成式 AI 模型在经过训练后不仅能够理解我们的语言，还拥有足够的知识储备，能够进行分析和推理。


    ### GPT 能为我们做什么


    ChatGPT 能为我们做什么？OpenAI 的官网展示了众多使用示例。比如，从一段文本中提取关键字、根据产品说明生成广告文案、生成会议记录、提取文章摘要、创建面试问题等。


    给这些功能按类别进行分类，ChatGPT 能够完成的文字相关任务包括问答、分类、编程、对话、生成、翻译和转换等。


    各家公司可以基于 GPT 模型进行功能定制，为用户提供服务，比如一些社交问答网站就提供了多种聊天机器人服务。当我们询问其中一个聊天机器人时，它这样介绍模型的原理与使用场景¹：


    > GPT 是一种基于深度学习算法的大语言模型，它使用无监督学习来训练神经网络处理大量的文本数据。通过这样的训练，模型能够理解自然语言的模式和结构，并能根据提示生成连贯和有意义的文本。

    >

    > GPT 可以用于各种场景，例如回答问题、提供建议、生成文本，甚至执行翻译或提取摘要等。以下是一些特定的语言模型使用案例。

    >

    > - **聊天机器人**：GPT 非常适合用于聊天机器人和虚拟助手。它能理解用户输入的内容并生成适当的回复，可以实现客户服务自动化、提供信息，甚至为用户提供娱乐。

    > - **内容生成**：GPT 生成连贯和有意义文本的能力使其成为有价值的内容生成工具。例如，GPT 可以用于生成新闻文章、产品描述或创意写作等。

    > - **语言翻译**：由于 GPT 掌握多种语言，因此可以将文本从一种语言翻译成另一种语言。这项能力对于那些需要与世界各地的人进行交流的企业或个人尤其有用。

    > - **文章摘要**：GPT 可以提取长文本或文章的要点，生成摘要，帮助人们快速了解主要观点而无须阅读整个文本。

    > - **个性化对话**：通过分析用户之前的交互内容和偏好，GPT 可以为该用户提供个性化内容或建议。这项能力对于希望为客户提供个性化体验的企业非常有用。

    > - **资料研究**：由于 GPT 理解和生成文本的能力较强，因此可以帮助研究人员撰写摘要和分析大量数据。例如，可以将其用于分析科学论文或社交媒体网站上的大量帖子，以识别模式或预测趋势。


    ### 大语言模型的能力


    大语言模型在完成预训练之后，研发人员通常会从语言生成、知识利用、复杂推理这三个方面来测试其基础能力，并进行一些高级能力评估。从表 1-1 中可以看到，研发人员试图让大语言模型拥有何种能力。


    **表 1-1 大语言模型的能力**


    ![表 1-1 大语言模型的能力](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83H630j54b6G601H6310e.jpg)


    资料来源：《大语言模型调研》，2023 年。


    大语言模型产品中，OpenAI 公司的 ChatGPT 最为成功，但它并不是唯一的一个。除此之外，Anthropic 公司推出了模型和聊天机器人 Claude
    应用，而问答社区 Quora 推出的 Poe 聊天机器人也支持多种模型。另外还涌现了多个繁荣的开源模型社区，如 Facebook 母公司 Meta 公司推出的
    LLaMA（羊驼）开源语言模型、清华大学开源的 ChatGLM 等。


    微软、谷歌、百度分别推出了自己的模型及聊天机器人（见表 1-2），但与 ChatGPT 这种仅基于大语言模型来给出作答不同，它们的聊天机器人均与搜索紧密结合。


    **表 1-2 由互联网公司推出的聊天机器人不完全列表**


    ![表 1-2 由互联网公司推出的聊天机器人不完全列表](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83LE30b54b6G601Hac807.jpg)


    获得较多用户认可的基于大语言模型的 AI 产品除了聊天机器人这种形式之外，还有笔记软件 Notion 推出的 AI 助理功能 Notion AI，其用了大约
    4 个月的时间获得了 400 万付费用户。Notion 不仅是当下流行的学习笔记工具，也是很多公司的办公协同工具。我们使用它的 AI 助理功能，只要像日常写笔记时一样输入斜杠符号“/”，就可以召唤出
    AI 助理帮助我们撰写笔记文档。根据 Notion 的调研结果，用户用得最多的几个场景分别是头脑风暴、任务清单以及编写大纲，而用户觉得最有用的功能是语法修改和撰写文章概要。


    目前，各家互联网科技公司都在尝试将 AI 的聊天功能或助手功能集成到已有产品上。比如，微软将其集成到了自己的办公软件中，新推出了名为 Copilot（领航员）的
    AI 助理。我们可以用文字跟它交流，这个强大的助理能够按我们的要求处理演示文稿(Power Point，PPT)，或者用工作表(Excel)的数据生成图表。微软最近还将该功能直接引入操作系统中，推出了视窗领航员的功能，用户可以与它对话。


    ### 当前 GPT 产品的形式


    - 通用聊天机器人助理

    - 搜索引擎聊天机器人助理

    - 应用软件助理

    - 应用网站助理


    OpenAI 在发布 GPT-4 时，在官网展示了其与一些产业和应用相结合的案例²。


    目前，普通用户能够直接使用的 GPT 应用主要包含以下形式：通用聊天机器人助理、搜索引擎聊天机器人助理、应用软件助理、应用网站助理。当前 GPT 领域的发展呈现杠铃式形态：一端是能力快速提升的各类大语言模型，另一端是主要以问答或助理的形式呈现，并使每个人都可以使用的应用。相信未来会发展出更多的应用形式，而不仅仅是问答与助理这样的方式。


