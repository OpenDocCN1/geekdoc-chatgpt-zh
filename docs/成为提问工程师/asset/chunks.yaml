    \n我们不少人是在经历惨痛教训后才意识到这一点的。在用GPT进行辅助编程时，它常采用过去的做法，而不用更新、更好的做法。虽然它建议的代码也可以运行，但我们很快就发现，相应的代码库在过去两年中已经经过了很多次版本更新，它给出的代码实际上是有问题的。\n\
    \n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p class=\"content\">这一弊端引发的错误在其他领域可能不容易被很快发现，但下一个问题应该引起更多的重视。有实践经验的人普遍都会认同这一点，因为不容易发现的潜在错误，往往是危险的错误。\n\
    \n2.它会产生“幻觉”。\n\n在生成式AI领域，“幻觉”指的是GPT倾向于根据提问进行回答，但有些回答可能是无意义的，甚至错误的。有个夸张的比喻是，这时该模型就像一个非常聪明和热心的6岁孩子，即使它不知道自己在说什么，也会尽力给你一个好的答案。\n\
    \n还有一个更形象的比喻是，GPT就像是在一个科技大会期间，你在酒店的酒吧里遇到的参会者。你们都是行业内的专业人士，但可能已经喝多了酒，只是外表看起来仍然正常。这时，对方给你的答案可能是对的，也可能完全是错的，尽管他此时对自己的观点仍然极其有信心。\n\
    \nGPT甚至会编造资料。2023年5月，有两个案例引发了普通使用者对幻觉问题的警惕，其中涉及的都是编造信息：有学生所引用的论文是GPT回答的，而论文其实是它编造的，这导致该学生被判作弊，并被勒令休学一年；有一名美国律师向法庭提交的法律文件中引用的案例是GPT编造的，这可能导致他的律师资格被取消。目前看来，或许我们应该为自己设定一个实用的GPT使用规则，即绝不要将GPT当成获取事实性信息的工具。\n\
    \n那么，我们可以彻底消除幻觉吗？不可能，这是由GPT的工作原理与功能特性决定的。它被训练来生成内容，而非重述已有的内容，幻觉实际上就是想象力超过了界限的情况。类似地，图像生成模型也无法完全复制某个场景，因为我们训练它作为一名根据风景进行创作的画家，而不是一台照相机。研发人员能做的只能是降低GPT出现幻觉的概率，同时让它自己能更准确地评估回答的正确性。而作为用户，我们必须对GPT的幻觉保持警惕，即我们不要对它的回答完全地信任。\n\
    \n3.它有一定概率会答错。\n\nGPT并不能确认自己的答案是正确的，它只是被训练得让自己的回答显得足够合理。它的回答有一定的概率是错误的。在采纳它的答案之前，我们需要进行事实核查以及严谨的评估。\n\
    \n一个简单实用的操作原则是，在看到GPT的答案时，我们不要假设它的答案是对，而是先假设它的答案可能是错误的。这也是为什么在看到一些人引用GPT的答案后进行了明确的说明时，我会心存感激，因为这让我立刻变得谨慎起来，在接受他们引用的说法之前先进行核查。\n\
    \nGPT的答案可能是错误的，这是我们使用GPT时需要特别注意的。与使用搜索引擎不同的是，搜索引擎会把我们带向最终链接，因此能有直接的参考资料作为判断依据。而GPT的回答不会给出参考资料与链接，我们核查起来往往困难得多。并且如前所述，不要尝试让它提供资料，它所给的参考资料可能是它产生“幻觉”编造出来的。\n\
    \n以上对使用GPT时需要注意的问题的讨论，并不是在刻意贬低GPT。我们只有了解它的局限性，才能用好这项强大又神奇的创新技术。\n\n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)span\
    \ class=\"bold\">4.不要把GPT看成朋友。\n\n现在，我们能用的基于GPT的产品大多是以聊天机器人的形式与我们交互，我们用日常的语言跟它说话，它也用我们熟悉的语言给出回答。虽然我们知道它是机器，但在某些时候，我们可能将它误认为是一个人，因为与它的对话太像在与一个活生生的人说话了。\n\
    \n不能将GPT看成朋友有很多个理由，其中一个理由是涉及隐私，它不能帮你保守秘密。以现在很多人使用的ChatGPT为例，它是一个研究预览版，OpenAI明确指出它的AI训练师可能会看到你的提问。更麻烦的是，你的提问如果作为训练语料被纳入后续的模型，那么它可能就会成为模型中无法删除的部分。\n\
    \n更重要的一个理由是，我们不能将对朋友的信任给到机器。在《ChatGPT入门》(ChatGPT for Dummies)中，帕姆·贝克(Pam Baker)给出了一个令人信服的解释：我们用的模型有很多种，我们不能因为完全信任一个模型，而去轻信另一个模型，因为如果另一个模型的可信度很低怎么办？如果另一个模型被坏人恶意操纵来散布虚假信息、诈骗信息怎么办？因此，在接受GPT的任何内容之前，一定要先进行仔细的核查。帕姆·贝克写道：“不要因为AI模型的健谈和友好，而误认为它是真的朋友。它不是一个人，它是人们使用的工具。它既可以被用来做有益的事，也可能被用来搞破坏。”\n\
