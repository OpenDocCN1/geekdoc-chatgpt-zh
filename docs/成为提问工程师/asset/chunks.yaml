    \  | ID：EPUB\\_20260428160408 \n\n## 第二节　基础场景之二：用GPT辅助写作\n\n既然GPT精通语言，又能完成生成文本的任务，自然就会有人想用它来写作。很多人想的是，只要跟GPT说：“请你帮我写一篇关于故宫600年历史的文章。”然后文章就会自动写出来。且慢！且不说GPT写不出来这样的文章，即便能写出来，这样的文章又有何价值呢？GPT的确有一定的写作能力，但我们要正确地提问，才能让它的这种能力为我所用。\n\
    \n我们可以利用GPT的文本生成能力，一步一步引导它来辅助写作。首先，我们可以让它修改语法错误，这是最为平常的用法了。比如，你刚刚读到的这句话，修改前被GPT指出“句子结构不完整，缺少主语”。当然，我没有按它的建议修改，而是选择了按自己的方式来改写，因为我想强调“我们”，对比示例如下：\n\
    \n原文：可以让它修改语法错误，这是最为平常的用法了。\n\nGPT建议：最为常见的用法是让它修改语法错误。\n\n接下来让我们一起探索用GPT辅助写作的更多方法。需要注意的是，GPT并不能帮我们写作，它能做的是辅助写作。GPT无法完成一个命题作文，即便它能写出来，我们也无法完全采纳它所写的内容。它能做的是为我们组织材料、优化风格、提供建议。\n\
    \n#### 辅助写作一：调整文章的表达方式\n\n一种有趣的用法是让GPT模仿某种风格明显的语言来调整表达方式。比如，工程师们常喜欢做这样的实验，他们经常对GPT说：“用海盗的风格重说这段话。”下面是一个关于网络安全知识描述的示例（原文为英文，这里翻译成中文）：“噫，伙计们！零信任乃是保护你们个人信息免受可恶的网络小偷侵害的一种方式。其基本理念是，你们不能相信任何人，即便是自己的队友。”这种模仿很有趣：“请模仿乔布斯的风格。”“请模仿白居易的风格。”当然，这些模仿并没有什么实用价值，我们通常也并不需要这样鲜明且浮于表面的风格模仿。\n\
    \n不过，我们的确可以让GPT来调整文章的表达方式。例如，我是一位专业人士，现在要进行一项科普工作，首先需要修改一篇文章，让小学高年级学生和初中生都能够理解。[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)这时，我们就可以请GPT来帮忙修改。\n\
    \n下面我从认知心理学家史蒂芬·平克(Steven Pinker)的《风格感觉——21世纪写作指南》(The Sense of Style: The Thinking\
