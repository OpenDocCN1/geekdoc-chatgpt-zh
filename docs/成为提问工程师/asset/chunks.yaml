    \n我对你的评分可以帮助你了解你所提供的答案质量。如果你给出的回复，包括D型对话里做出的引导，以及S型对话里给出的“提示语”质量一般，我会给你打低分，并要求你重新生成“提示语”。任务会在我给“提示语”打出9分甚至10分之后告一段落。这个评分的依据是我把你写的“提示语”发到GPT的另一个对话里，获得的答案质量。\n\
    \n以下是将GPT转变为学习助手Mr. Ranedeer的提示语片段，它用提示语设定了学习深度、学习风格、沟通风格、语言风格、推理框架等（原文为英文，且为JSON格式）：\n\
    \n\"深度\": {"
  fmt: '

    # 后面的故事就是“我全明白了”和迎头赶上


    费曼说道：“经过了一段焦虑不安和觉得事事落后于人的日子，现在我终于觉得自己融入大家了。我也有了新发现……”


    GPT在学习上为我们提供了一个全新功能，那就是即便有些东西我们完全看不懂，我们也不再那么畏难了。因为现在我们可以把每一个不懂的知识点都拿去问GPT，而它确实也会仔细地为每个人解答。这为我们打开了学习新知识、新技能的大门。


    ## 辅助学习一：让GPT解释知识


    初到一个全新的领域时，我们会发现一切都是陌生的。即便已经掌握了一些基础知识和整体框架，但对于大多数内容还是感到陌生。现在，只要克服了最初的畏难情绪，我们就可以用GPT来辅助学习。


    过去我们看到一页资料不明白时，只能求助于他人，后来我们可以通过搜索引擎来寻求解答，现在我们可以直接让GPT为我们解释，并针对自己不懂的地方继续向它追问。当然，需要注意的是，我们要了解它擅长什么、不擅长什么，并警惕它的解释可能存在错误。


    ### 用好GPT的必备知识


    - `Markdown`文本格式

    - `Markdown`表格


    ### 高阶必备知识


    - `LaTeX`数学公式

    - `Regex`正则表达式


    下面就以使用GPT必备的一些技能性知识为例来说明如何通过GPT进行学习。在使用GPT时，我们可能会接触到如下几种新知识，这对于大多数没有程序员从业背景的人来说可能较为陌生。比如，有时GPT给我们的文本其实并不是纯文本，而是支持在纯文本里面加一些标签的`Markdown`格式的文本。


    - `Markdown`文本可用来表示有编号的列表、无编号的列表、表格、引用；

    - 用单个反引号、三个反引号来表示其中引用的是程序代码；

    - `Markdown`文本可与`LaTeX`结合来呈现数学公式；

    - `Markdown`文本可与一些工具结合来展示图表、思维导图，等等。


    `Markdown`格式的文本离大多数人并不远。现在的一些笔记应用和办公协同软件，如`Notion`、`飞书`，都可以直接编写`Markdown`格式的文档。只不过由于`Word`引领的“所见即所得”的思路过于强大，很多人忽视了其实更适合互联网时代的`Markdown`格式。但现在，为了充分使用GPT的强大功能，我们需要学习这些文本格式。幸运的是，我们可以利用GPT来学习它们。


    下面就来举例说明。如表3-1所示，上边为显示的表格，下边为`Markdown`原始文本。


    ### 表3-1 收入表格


    `Markdown`文本生成的表格如下：


    #### 收入表格


    | 季度 | 收入（万） | 利润（万） | 利润率 |

    | --- | --- | --- | --- |

    | Q1 | 100 | 30 | 30% |

    | Q2 | 130 | 45 | 34.6% |

    | Q3 | 70 | 10 | 14.3% |

    | Q4 | 90 | 25 | 27.8% |

    | 全年 | 390 | 110 | 28.2% |


    如果对这种表格感到陌生，我们可以请GPT给出解释。


    #### 提问


    > “解释`Markdown`表格的基础”。


    #### 回答


    `Markdown`表格采用的是一种在文本中插入表格的语法，该表格由行和列组成。表格的基本用法如下：


    1. 用“`|`”符号分隔每一个单元格，用“`-`”符号分隔表头和表格主体。

    2. 第一行为表头，第二行为分隔表头和表格主体的分隔线。

    3. 表格的每一行数据占一行，每一列的数据用“`|`”分隔。


    爱因斯坦的质能方程式是非常著名的科学公式。在左栏中，我们给出公式，并列出了GPT对其做出的解释。右栏中展示的是用`LaTeX`文本形式表示的这个公式。GPT对它的写法也进行了解释。


    当我们了解到公式其实就是文本时，GPT的很多创新用法就出现了。例如，我们可以用手机拍摄书中公式的照片，用一些工具将之转换为`LaTeX`格式的公式文本。输入公式文本请GPT解释：


    > “请解释一下这个公式。”

    >

    > “请一步一步地推导这个公式。”


    另外，`LaTeX`公式有时候很复杂，一旦缺少内容就不能正常显示。出问题时，对`LaTeX`公式进行人工检查和修正费时又费力。而这对于GPT来说则是很容易的事，所以在这种情况下，我们可以求助于GPT：


    > “这个`LaTeX`公式哪里出现了错误导致不能显示？请解释并帮忙修正。”


    知名作家、原麦肯锡合伙人冯唐在《冯唐成事心法》中讲过一个用“100个关键词”快速了解一个行业的做法，他写道：“明白了100个关键词之后，你会发现，你跟专家的距离迅速缩短”。要注意的是，他所说的其实是了解一个行业需要分四步：第一步是“先知道100个关键词”；第二步是“找三到五个专家，跟他们坐下来谈半天到一整天”；第三步是“找三到五本专著，仔细地看完”；第四步是“价值最大化或影响最大化”，即“有了自己的主场后先做到顶尖，有了扎实的根据地后再考虑跨界”。


    在GPT出现后，“100个关键词”的学习方法被不少人发扬光大，因为我们现在可以请GPT来为我们整理关键词。如下是一个可参考的提示语模板，使用时将其中的“行业或领域”替换成自己所关心的行业或领域就可以了。


    ```

    詹姆斯·麦肯锡(James O. Mckimsey)快速了解一个行业的方法是，通过大量行业高频关键词来建立概念。现在我是一个对“行业或领域”不了解的小白，请为我整理出30个常用关键词，制作成Markdown表格，表头是：关键词（英文）分类（中文）、介绍（限50字）、使用场景。

    ```


    冯唐在他的书中还提到了，麦肯锡顾问还会通过向专家请教来学习，这对我们也相当有启发性。我们也可以在刚入门时采用这个方法，但我们可以先向GPT提问，然后再向人类专家提问。冯唐写道：“没有傻问题，尽量多问问题。你可以一开始就跟专家讲，你对这个行业一无所知，只是一个通用管理顾问，现在想跟他聊聊，谢谢他能来，然后一个个问题、事无巨细地问下去。问了三到五个专家之后，你会发现他们回答的共同点，那就是你入门这个行业所需要知道的最重要的东西。”现在，有了GPT之后，我们更可以毫无障碍地问遍所有的“傻”问题，直到自己没有任何疑问为止。之后，我们再向人类专家进行更深入的请教。


    ## 辅助学习二：让GPT教你如何做


    多数时候，我们需要的不是学习，而是通过学习来解决一个个问题。我们心中有时想的是：不要给我讲原理，告诉我应该怎么做就行。


    这时，我们需要的是一个实用教程(`tutorial`)，一步一步指导我们如何做。例如，换一个电灯泡的教程如下：首先，准备好电灯泡；其次，关掉电源；然后，把旧电灯泡取下；最后，把新电灯泡拧上。


    也许大家会觉得换电灯泡这件事太简单，那下面再列举几个稍微复杂一点的例子：如何自己安装宜家的家具？如何设置手机中的交通卡？如何设置会议软件的语言翻译功能？


    我们经常在网络上搜索各类实用教程，但是真正实用的教程是稀缺的。有的教程可能最初是好的，但由于没有及时更新而逐渐变得不实用。有的教程因为过于简略导致用起来异常困难，这多半是因为作者知道太多知识，却不能用同理心理解用户并不知道相关的知识，我们作为用户不得不自行补充很多信息。


    对此GPT就能发挥其特有的作用了，它可以针对性地为我们即时编写一个教程，并按我们的理解程度进行详略得当的安排。当然，编写教程的人也可以利用GPT来进行辅助写作，用它来优化初稿、更新迭代。这里我们利用的不是GPT的写作能力，而是它针对性回答问题的能力。


    下面来看一个具体场景。假设我们刚刚开始从用微软`Windows`操作系统的电脑转换到苹果电脑，虽然表面上看起来差不多，但其中有很多细节上的差异。比如每个人都很熟悉`Windows`系统中的文件夹，但在苹果电脑中文版系统里，它对应的却是一个奇怪的翻译词——访达(`Finder`)。


    假设现在我们有一个具体的问题：如何在电脑和手机之间共享文件？我们当然可以去搜索网络上的教程，不过也可以描述自己的问题，让GPT生成一个针对性的教程。


    > “请给我一个苹果电脑和苹果手机共享文件(`AirDrop`)的教程，要包括如何设置电脑、手机及账号，设置成只接受自己设备间的互传、不接受其他人的，要详尽地列出操作步骤，让我可以照着做。”


    通常来说，GPT给出的答案比官方的文档以及在网上能够找到的教程都要实用，因为它可以按我们的要求给出针对性的教程，我们可以以此为参考去解决自己的问题。


    让GPT给出如何做的实用教程，即询问GPT一件事的完成步骤，可能是我们使用最多的提问类别之一。


    实际上，让GPT给出实用教程可能是我们用得最多的提问类别之一。在使用各种基于GPT的生产工具时，比如编程工具，我自己大概有50%的问题会落在这个类别上。


    针对这个类别进行提问，我们能体会到与GPT交互的一个典型特征：提问的范围越小、提供的背景信息越具体，得到的答案可操作性就越强。


    例如，以下是程序员可能会经常用到的，向GPT提问的一些示例。通常，他们会在提问语的后面加上“请按1.2.3.……给出具体的操作指引”等要求以获得一个实用教程。


    - 如何安装某个软件？如何使用软件的某个功能？

    - 如何在云服务器上安装软件、部署代码，运行某个特定的服务？

    - 如何使用某个程序库，实现某个功能？


    有人可能会有一个疑问，不是说GPT不了解最新的信息吗？是的，它缺乏新技术进展的信息，但这并不是完全绕不过去的难题。一些生产工具会用外接资料库的形式获取最新的信息，或者对GPT模型进行微调，以让它掌握最新知识。


    在以下的提问示例中，最关键的是“上下文”，提供必要的资料可以让GPT按所给的资料更好地编写教程。


    1. 指令：“请你根据文档，为我提供解决具体问题的操作教程。”

    2. 上下文：“这是做这件事的相关文档：……”

    3. 问题：“我想要（如这样的效果），请问如何做？”

    4. 输出：“请给出详尽的、一步一步如何做的教程。格式是：第1步，子步骤1.1、1.2等；第2步，子步骤2.1、2.2等。教程如下：……”


    ## 辅助学习三：让GPT帮你建立知识体系


    用GPT辅助学习还有第三种用法，即可以用它建立知识体系。需要说明的是，这里所说的知识体系，指的并非一个人的知识体系，而是某一领域的知识与技能的体系。


    具体来说，我们可以用GPT来记笔记和整理笔记，从而让自己更好地建立具体领域的知识体系。下面以“如何对GPT提问”来举例说明：在使用GPT的过程中，你可能已经通过提问掌握了一些点点滴滴的知识，而建立知识体系的过程就是把它们联结起来。我们所建立的知识体系大体上包括以下三个部分：


    1. 向GPT提问的原理、基础、要点、注意事项等；

    2. GPT的多种功能：辅助翻译、辅助写作、辅助学习等；

    3. GPT的使用场景：办公场景、运营场景、拓展场景等。


    角色设定、飞轮思维模型、提示语四要素等属于第一部分。我们现在讨论的语言、写作、学习这些基础应用场景属于第二部分。我们在使用的过程中，可能还会发现一些优秀的提示语写法和用法，可以在笔记中把它们记录下来，使之成为工具箱中的“利器”。


    使用GPT更好地建立知识体系的另一个做法是：之前我们可能懒得详细记笔记，更不想整理笔记；现在，可以用笔记软件中的AI助手辅助写作，还可以让它帮忙整理笔记。例如，我们可以用提示语让它帮忙整理：


    > “帮我将记录下来的写作辅助提示语整理成列表。”

    >

    > “帮我把笔记中与办公场景相关的提示语分门别类整理好，并为每个类别加上简短说明。”


    有了GPT的帮助，在一个细分领域积累知识点、构建知识体系的任务就会变得非常轻松。


    ## 提示语进阶


    你可能已经注意到了，向GPT提问的提示语不只是“请帮我解答这个问题：……”这么简单。大多数时候，我们需要输入相当复杂的提示语才能使它完成任务。那么，如何才能让提示语更有效呢？我们梳理了如下这些最佳实践，其中综合了`OpenAI`提示语最佳实践、微软`Azure`云服务的提示语教程、`OpenAI`与知名AI学者吴恩达教授合作的提示语工程课程，以及我个人在使用提示语时总结的经验教训。


    ### 用分隔符将内容分开


    例如，我们可以用三个英文引号(`"""`)将长内容包裹起来，从而让GPT直接了解这不是命令，而是内容。


    #### 不太有效的提示语


    > 请总结如下文字的要点、以列表的形式给出。

    >

    > {文字内容}


    #### 有效的提示语


    > 请总结如下文字的要点、以列表的形式给出。

    >

    > ```

    > {文字内容}

    > ```


    当然，你可以用其他分隔符，比如三个英文连接符“`---`”，只要能够清晰区分即可。


    ### 给出清晰明确的、数量化的指令


    #### 不太有效的提示语


    > 请举几个例子。


    #### 更好的提示语


    > 请举3个例子。


    #### 不太有效的提示语


    > 请根据内容编写摘要。


    #### 更好的是提示语


    > 请根据内容编写140字以内的摘要，要包含问题、要点、结论。


    ### 采用少样本提示


    当我们直接提问时，采用的是“零样本提示”，调用的是GPT中经过预训练的知识与技能。为了让GPT更好地回答，我们可以采用“少样本提示”的提问方式，即提供几个示例，以便GPT能够从这几个样本中学习到规则，从而更好地回答问题。如下提示语提供了两个提取关键词的示例。


    ```

    你的任务是从文本中提取关键词。


    文本1：Stripe为应用开发者提供API，让他们将付款处理集成到他们的网站和移动应用程序中。


    关键词1：Stripe、付款处理、API、应用开发者、网站、移动应用程序


    ##


    文本2：OpenAI训练了先进的语言模型，非常擅长理解和生成文本。你可以通过我们的API访问这些模型，并将其用于解决各类涉及处理语言的任务。


    关键词2：OpenAI、语言模型、文本处理、API


    ##


    文本3：{这里输入要提取关键词的文本内容}


    关键词3：

    ```


    ### 链式思考提问：“请一步一步解题”


    在让GPT处理数学或逻辑问题时，要求它“一步一步解题”(`Let''s think step by step.`)可以让它逐步进行推理，从而降低错误率。这就是链式思考技术，它可以引导GPT更严谨地进行推理。


    也有论文给出了更加复杂的提示语（如下示例），并证明这也能进一步优化推理的效果。


    > 首先，让我们理解问题并制订解决问题的计划。然后，让我们一步一步地执行计划并解决问题。


    ### “请回答‘我不知道’”


    这句话有助于降低GPT为了让对话延续下去而编造内容的可能性，也就是可用来抑制“幻觉”问题。


    > 如果你不知道或不确信，不要编造任何内容，直接回答“我不知道”。


    ### 输出格式的样例


    如果我们给出明确的要求甚至样例，GPT就有更高的概率按我们的要求给出答复。


    ```

    请从如下文本中提取公司名。


    期待的输出格式：


    公司名: <公司名用英文逗号(,)分隔>


    文本："""


    我们要它处理的文本内容


    """

    ```


    ### 调整GPT的参数


    当我们通过一些工具使用GPT时，还可以设置以下5个参数。


    1. **温度(`temperature`)**：较高的温度会导致更高的随机性和不确定性，生成的文本可能更加多样化和不可预测。较低的温度会导致更低的随机性和不确定性，生成的文本可能更加可控，但也可能更加单调。

    2. **标记符最长限制(`maximum length`)**：也被称为GPT的上下文窗口，指包含所有提问和回答的标记符的最大数量。它用来限制生成文本的最大长度，以避免生成过长的文本。

    3. **Top P**：一个控制生成文本多样性的参数。它基于概率分布，只选择概率最高的前P个单词作为下一个单词的候选项。这可以避免生成不合理的文本，同时也可以增加文本的多样性。

    4. **频次惩罚(`frequency penalty`)**：它会惩罚已经生成过的单词，使得生成的文本中不会再出现重复的单词或短语。

    5. **存在惩罚(`presence penalty`)**：它会惩罚与给定主题不相关的单词或短语，使得生成的文本更加贴近给定的主题。


    通常来说，我们最常用到的是前两个参数：`ChatGPT`网页版的温度为`0.7`，这让它显得思路开阔且“健谈”。但如果我们希望它能够极度严谨地仅根据所给的资料回答提问，可以将温度设为`0`。如果我们希望它生成较长的文本，则可将标记符最长限制的数值加大，比如从`256`提高到`1024`。


