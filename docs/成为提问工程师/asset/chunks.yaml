    # The Rest of the Story Is "I Fully Understand" and Catching Up


    Feynman said: "After a period of anxiety and feeling behind in everything, I finally
    feel like I fit in with everyone. I''ve made new discoveries too..."


    GPT provides us with a brand-new function in learning: even if there are things
    we completely fail to understand, we no longer fear difficulty. Because now we
    can take every knowledge point we don''t understand and ask GPT, and it will indeed
    answer carefully for each person. This opens the door for us to learn new knowledge
    and skills.


    ## Assisted Learning 1: Let GPT Explain Knowledge


    When first entering a completely new field, we find everything unfamiliar. Even
    if we have mastered some basics and the overall framework, we still feel unfamiliar
    with most of the content. Now, as long as we overcome the initial fear of difficulty,
    we can use GPT to assist learning.


    In the past, when we didn''t understand a page of material, we could only seek
    help from others; later we could use search engines for answers; now we can directly
    ask GPT to explain for us, and continue to follow up on what we don''t understand.
    Of course, we need to note that we must understand what it is good at, what it
    is not good at, and be vigilant that its explanations may contain errors.


    ### Essential Knowledge for Using GPT Well


    - `Markdown` text format

    - `Markdown` tables


    ### Advanced Essential Knowledge


    - `LaTeX` mathematical formulas

    - `Regex` regular expressions


    Below, we will use some skill-based knowledge essential for using GPT as examples
    to illustrate how to learn through GPT. When using GPT, we may encounter the following
    types of new knowledge, which may be relatively unfamiliar to most people without
    a programming background. For instance, sometimes the text GPT gives us is not
    plain text, but `Markdown` formatted text that supports adding tags within plain
    text.


    - `Markdown` text can represent numbered lists, unnumbered lists, tables, blockquotes;

    - Use single backticks or triple backticks to indicate quoted program code;

    - `Markdown` text can combine with `LaTeX` to render mathematical formulas;

    - `Markdown` text can combine with certain tools to display charts, mind maps,
    etc.


    `Markdown` formatted text is not far from most people. Current note-taking apps
    and office collaboration software, such as `Notion`, `Feishu (Lark)`, can directly
    edit `Markdown` formatted documents. It''s just that the "What You See Is What
    You Get" (WYSIWYG) concept led by `Word` is too powerful, causing many to overlook
    the `Markdown` format which is actually more suitable for the internet era. But
    now, to fully utilize GPT''s powerful functions, we need to learn these text formats.
    Fortunately, we can use GPT to learn them.


    Below is an illustration. As shown in Table 3-1, the top part is the rendered
    table, and the bottom part is the `Markdown` raw text.


    ### Table 3-1 Revenue Table


    The table generated by `Markdown` text is as follows:


    #### Revenue Table


    | Quarter | Revenue (10k) | Profit (10k) | Profit Margin |

    | --- | --- | --- | --- |

    | Q1 | 100 | 30 | 30% |

    | Q2 | 130 | 45 | 34.6% |

    | Q3 | 70 | 10 | 14.3% |

    | Q4 | 90 | 25 | 27.8% |

    | Full Year | 390 | 110 | 28.2% |


    If you find this kind of table unfamiliar, you can ask GPT for an explanation.


    #### Prompt


    > "Explain the basics of `Markdown` tables."


    #### Response


    `Markdown` tables use a syntax for inserting tables in text, consisting of rows
    and columns. The basic usage is as follows:


    1. Use the "`|`" symbol to separate each cell, and the "`-`" symbol to separate
    the header from the table body.

    2. The first row is the header, the second row is the separator line dividing
    the header and the table body.

    3. Each row of data in the table occupies one line, and data in each column is
    separated by "`|`".


    Einstein''s mass-energy equivalence equation is a very famous scientific formula.
    In the left column, we present the formula and list GPT''s explanation of it.
    The right column shows the `LaTeX` text representation of this formula. GPT also
    explained its syntax.


    Once we understand that formulas are essentially text, many innovative uses of
    GPT emerge. For example, we can use a phone to photograph a formula in a book,
    use tools to convert it into `LaTeX` format formula text. Input the formula text
    and ask GPT to explain:


    > "Please explain this formula."

    >

    > "Please derive this formula step by step."


    Additionally, `LaTeX` formulas can sometimes be very complex; once content is
    missing, they cannot display correctly. When problems occur, manually checking
    and correcting `LaTeX` formulas is time-consuming and laborious. But this is an
    easy task for GPT, so in this case, we can turn to GPT for help:


    > "Where is the error in this `LaTeX` formula causing it not to display? Please
    explain and help correct it."


    Renowned writer and former McKinsey partner Feng Tang mentioned a method of "100
    keywords" to quickly understand an industry in *Feng Tang''s Philosophy of Achievement*.
    He wrote: "Once you understand 100 keywords, you''ll find the distance between
    you and experts rapidly shortens." Note that what he describes is actually a four-step
    process for understanding an industry: Step one is "First know 100 keywords";
    Step two is "Find three to five experts, sit down and talk for half a day to a
    whole day"; Step three is "Find three to five monographs, read them carefully";
    Step four is "Maximize value or impact", i.e., "After establishing your home base,
    first become top-tier; with a solid base, then consider crossing over."


    After GPT appeared, the "100 keywords" learning method was carried forward by
    many, because we can now ask GPT to organize keywords for us. Below is a reference
    prompt template; when using it, replace "Industry or Field" with the industry
    or field you care about.


    ```

    James O. McKimsey''s method for quickly understanding an industry is to build
    concepts through high-frequency industry keywords. Now I am a novice unfamiliar
    with "Industry or Field", please organize 30 common keywords for me, make a Markdown
    table, with headers: Keyword (English), Category (Chinese), Introduction (max
    50 words), Usage Scenario.

    ```


    Feng Tang also mentioned in his book that McKinsey consultants also learn by consulting
    experts, which is equally inspiring for us. We can also adopt this method when
    starting out, but we can ask GPT first, then ask human experts. Feng Tang wrote:
    "There are no stupid questions, ask as many as possible. You can tell the expert
    upfront that you know nothing about this industry, just a general management consultant,
    now want to chat with him, thank him for coming, then ask questions one by one,
    no matter how big or small. After asking three to five experts, you''ll find the
    commonalities in their answers, which are the most important things you need to
    know to enter this industry." Now, with GPT, we can ask all "stupid" questions
    without any barriers until we have no doubts left. Afterwards, we can consult
    human experts more deeply.


    ## Assisted Learning 2: Let GPT Teach You How to Do It


    Most of the time, what we need is not learning itself, but solving problems through
    learning. We sometimes think: Don''t tell me the principles, just tell me how
    to do it.


    At this point, what we need is a practical **tutorial**, guiding us step by step
    on how to do it. For example, a tutorial on changing a light bulb: First, prepare
    the light bulb; Second, turn off the power; Third, remove the old bulb; Fourth,
    screw in the new bulb.


    Perhaps everyone thinks changing a light bulb is too simple, so here are a few
    slightly more complex examples: How to assemble IKEA furniture yourself? How to
    set up a transit card on your phone? How to set up the language translation function
    in meeting software?


    We often search for various practical tutorials online, but truly practical tutorials
    are scarce. Some tutorials might have been good initially but gradually became
    impractical due to lack of timely updates. Some are so brief that they are exceptionally
    difficult to use, mostly because the author knows too much but cannot empathize
    with the user''s lack of relevant knowledge, forcing the user to supplement a
    lot of information themselves.


    This is where GPT can play its unique role: it can write a targeted tutorial for
    us instantly, and arrange the detail level appropriately according to our level
    of understanding. Of course, people writing tutorials can also use GPT to assist
    writing, using it to optimize drafts and iterate updates. Here we utilize not
    GPT''s writing ability, but its ability to answer questions in a targeted manner.


    Let''s look at a specific scenario. Suppose we just switched from a Microsoft
    `Windows` computer to a Mac. Although they look similar on the surface, there
    are many differences in details. For example, everyone is familiar with folders
    in the `Windows` system, but in the Chinese version of the Mac system, the corresponding
    term is a strange translation—**Finder** (`访达`).


    Suppose we now have a specific question: How to share files between computer and
    phone? We can certainly search for online tutorials, but we can also describe
    our problem and let GPT generate a targeted tutorial.


    > "Please give me a tutorial on sharing files between a Mac and an iPhone (`AirDrop`),
    including how to set up the computer, phone, and account, set to only accept transfers
    between own devices and not from others, list the operation steps in detail so
    I can follow them."


    Usually, the answers given by GPT are more practical than official documentation
    and tutorials found online, because it can provide targeted tutorials according
    to our requirements, which we can use as a reference to solve our problems.


    Asking GPT for practical tutorials on how to do things—i.e., asking GPT for the
    steps to complete a task—is probably one of the most frequently used prompt categories.


    In fact, asking GPT for practical tutorials may be one of the prompt categories
    we use the most. When using various GPT-based production tools, such as programming
    tools, about 50% of my own questions fall into this category.


    When prompting for this category, we can experience a typical characteristic of
    interacting with GPT: the narrower the scope of the question and the more specific
    the background information provided, the more actionable the answer.


    For example, the following are examples of questions programmers might frequently
    ask GPT. Usually, they add requirements like "Please give specific operational
    guidance in 1.2.3... format" at the end of the prompt to get a practical tutorial.


    - How to install a certain software? How to use a certain function of the software?

    - How to install software, deploy code, and run a specific service on a cloud
    server?

    - How to use a certain library to implement a certain function?


    Someone might wonder, isn''t it said that GPT doesn''t know the latest information?
    Yes, it lacks information on new technological advances, but this is not an insurmountable
    obstacle. Some production tools obtain the latest information via external knowledge
    bases, or fine-tune the GPT model to give it the latest knowledge.


    In the following prompt examples, the most critical part is "Context"; providing
    necessary materials allows GPT to write better tutorials based on the given materials.


    1. Instruction: "Please provide an operational tutorial to solve a specific problem
    based on the documentation."

    2. Context: "Here is the relevant documentation for doing this: ..."

    3. Question: "I want (such an effect), how do I do it?"

    4. Output: "Please give a detailed, step-by-step tutorial. Format: Step 1, sub-steps
    1.1, 1.2, etc.; Step 2, sub-steps 2.1, 2.2, etc. Tutorial as follows: ..."


    ## Assisted Learning 3: Let GPT Help You Build a Knowledge System


    There is a third use of GPT-assisted learning: using it to build a knowledge system.
    It should be noted that the knowledge system here refers not to an individual''s
    knowledge system, but to the system of knowledge and skills in a specific field.


    Specifically, we can use GPT to take and organize notes, thereby better building
    a knowledge system for a specific field. Below we take "How to Prompt GPT" as
    an example: In the process of using GPT, you may have mastered some bits and pieces
    of knowledge through prompting; the process of building a knowledge system is
    to connect them. The knowledge system we build roughly includes the following
    three parts:


    1. Principles, basics, key points, precautions, etc., of prompting GPT;

    2. GPT''s various functions: assisted translation, assisted writing, assisted
    learning, etc.;

    3. GPT''s usage scenarios: office scenarios, operation scenarios, expansion scenarios,
    etc.


    Role setting, Flywheel Mental Model, Four Elements of Prompts, etc., belong to
    the first part. The basic application scenarios we are discussing now—language,
    writing, learning—belong to the second part. In the process of use, we may also
    discover some excellent prompt writing methods and usages, which can be recorded
    in notes to become "sharp tools" in the toolbox.


    Another practice for better building a knowledge system with GPT is: previously
    we might have been too lazy to take detailed notes, let alone organize them; now,
    we can use the AI assistant in note-taking software to assist writing, and also
    ask it to help organize notes. For example, we can use prompts to ask it to help
    organize:


    > "Help me organize the recorded writing-assistance prompts into a list."

    >

    > "Help me categorize and organize the prompts related to office scenarios in
    my notes, and add a brief description for each category."


    With GPT''s help, the task of accumulating knowledge points and building a knowledge
    system in a niche field becomes very easy.


    ## Advanced Prompting


    You may have noticed that prompts for GPT are not as simple as "Please help me
    answer this question: ...". Most of the time, we need to input fairly complex
    prompts to make it complete tasks. So, how can we make prompts more effective?
    We have organized the following best practices, which integrate `OpenAI` prompt
    best practices, Microsoft `Azure` cloud service prompt tutorials, the Prompt Engineering
    course by `OpenAI` and renowned AI scholar Professor Andrew Ng, as well as lessons
    learned from my personal experience using prompts.


    ### Use Delimiters to Separate Content


    For example, we can wrap long content with three English double quotes (`"""`),
    so GPT directly understands this is not a command, but content.


    #### Less Effective Prompt


    > Please summarize the key points of the following text and present them as a
    list.

    >

    > {Text Content}


    #### Effective Prompt


    > Please summarize the key points of the following text and present them as a
    list.

    >

    > ```

    > {Text Content}

    > ```


    Of course, you can use other delimiters, such as three English hyphens "`---`",
    as long as they can clearly distinguish.


    ### Give Clear, Explicit, Quantified Instructions


    #### Less Effective Prompt


    > Please give a few examples.


    #### Better Prompt


    > Please give 3 examples.


    #### Less Effective Prompt


    > Please write a summary based on the content.


    #### Better Prompt


    > Please write a summary within 140 words based on the content, including the
    problem, key points, and conclusion.


    ### Use Few-Shot Prompting


    When we ask directly, we use "Zero-Shot Prompting", invoking the knowledge and
    skills pre-trained in GPT. To get GPT to answer better, we can use "Few-Shot Prompting",
    i.e., provide a few examples so GPT can learn the rules from these samples and
    answer better. The prompt below provides two examples of keyword extraction.


    ```

    Your task is to extract keywords from text.


    Text 1: Stripe provides APIs for app developers to integrate payment processing
    into their websites and mobile apps.


    Keywords 1: Stripe, payment processing, API, app developers, websites, mobile
    apps


    ##


    Text 2: OpenAI has trained advanced language models that are very good at understanding
    and generating text. You can access these models via our API and use them to solve
    various tasks involving language processing.


    Keywords 2: OpenAI, language models, text processing, API


    ##


    Text 3: {Enter text content to extract keywords here}


    Keywords 3:

    ```


    ### Chain-of-Thought Prompting: "Let''s Think Step by Step"


    When letting GPT handle math or logic problems, asking it to "think step by step"
    (`Let''s think step by step.`) allows it to reason gradually, thereby reducing
    error rates. This is the Chain-of-Thought technique, which guides GPT to reason
    more rigorously.


    There are also papers that give more complex prompts (as shown below) and prove
    they can further optimize reasoning effects.


    > First, let''s understand the problem and formulate a plan to solve it. Then,
    let''s execute the plan step by step and solve the problem.


    ### "Reply ''I Don''t Know''"


    This sentence helps reduce the possibility of GPT fabricating content to keep
    the conversation going, i.e., it can be used to suppress "hallucination" issues.


    > If you don''t know or are not sure, don''t fabricate anything, just reply "I
    don''t know".


    ### Output Format Examples


    If we give explicit requirements or even examples, GPT has a higher probability
    of replying as required.


    ```

    Please extract company names from the following text.


    Expected output format:


    Company Name: <Company names separated by English commas (,)>


    Text: """


    Text content we want it to process


    """

    ```


    ### Adjust GPT Parameters


    When using GPT through certain tools, we can also set the following 5 parameters.


    1. **Temperature (`temperature`)**: Higher temperature leads to higher randomness
    and uncertainty; generated text may be more diverse and unpredictable. Lower temperature
    leads to lower randomness and uncertainty; generated text may be more controllable
    but also more monotonous.

    2. **Maximum Length (`maximum length`)**: Also known as GPT''s context window,
    refers to the maximum number of tokens containing all questions and answers. It
    is used to limit the maximum length of generated text to avoid overly long output.

    3. **Top P**: A parameter controlling the diversity of generated text. Based on
    probability distribution, it selects only the top P words with the highest probability
    as candidates for the next word. This avoids generating unreasonable text while
    increasing diversity.

    4. **Frequency Penalty (`frequency penalty`)**: It penalizes words that have already
    been generated, preventing repeated words or phrases in the generated text.

    5. **Presence Penalty (`presence penalty`)**: It penalizes words or phrases unrelated
    to the given topic, making the generated text more relevant to the given topic.


    Usually, the two parameters we use most are the first two: `ChatGPT` web version
    has a temperature of `0.7`, making it seem open-minded and "talkative". But if
    we want it to answer strictly based only on given materials, we can set temperature
    to `0`. If we want it to generate longer text, we can increase the maximum length
    value, e.g., from `256` to `1024`.


    ### Write Highly Structured Prompts


    The advantage of GPT prompts is that they can use natural language, but the drawback
    of natural language is the existence of ambiguous expressions. When we need to
    complete a super complex task, we need to rely on structured language to write.
    The most structured language is, of course, programming languages, and we have
    indeed seen people using programming languages to write prompts.


    At the same time, we can still write prompts like we usually speak, but we must
    make our questions more logical and structured. For example, in May 2023, we saw
    two highly structured prompt examples: one written by renowned think tank researcher
    Ni Kaomeng using natural language; another written in lightweight data interchange
    (`JavaScript Object Notation`, `JSON`) format to turn GPT into a learning assistant.


    Below is a fragment of the prompt Ni Kaomeng used to have `GPT-4` assist in rewriting
    prompts:


    > We rate each other, 10 for perfect, 9 for excellent, 8 for great. We can add
    a sentence at the end of each of our turns, reminding the other party to rate
    their expression, explain the reason, and give suggestions.

    >

    > Your rating of me helps me understand the quality of information I provide.
    If my information is relatively comprehensive, enough to write a "Prompt", you
    give 8 or even higher, then generate the "Prompt". If you rate me below 8, i.e.,
    7, 6, or lower, tell me the reason, and guide me to supplement information through
    questions, etc. If my subsequent information still doesn''t meet the standard,
    you can continue to give low scores and request improvements until it meets the
    standard and then generate the "Prompt".

    >

    > My rating of you helps you understand the quality of your answers. If your replies,
    including guidance in Type D dialogue, and the "Prompt" quality in Type S dialogue
    are average, I will give you a low score and ask you to regenerate the "Prompt".
    The task ends after I rate the "Prompt" 9 or even 10. The basis for this rating
    is that I send the "Prompt" you wrote to another GPT conversation, and judge based
    on the quality of the answer obtained.


    Below is a fragment of the prompt turning GPT into the learning assistant `Mr.
    Ranedeer`, which sets learning depth, learning style, communication style, language
    style, reasoning framework, etc., via prompt (original in English, in `JSON` format):


    ```

    "Depth": {

    ```

