    # Section 3 Thinking Fast and Slow: Adopting Chain-of-Thought


    Experimentally, one finds that this problem, like "Yann LeCun''s Gear Problem"[⁷],
    is also an interesting golden benchmark. Dozens of us conducted hundreds of experiments
    and found that the probability of various chatbots giving the correct answer immediately
    is very low. Asking them to redo it doesn''t necessarily correct the error. Prompting
    them to reason step-by-step increases the probability of a correct answer, but
    they still make mistakes. Interestingly, if asked to solve it using algebraic
    methods, they almost always get it right. If asked to implement it in code, the
    program code can also calculate the answer correctly in one go.


    "Problems where the result can be directly verified for correctness" are the type
    of problems most suitable for GPT.


    "Problems where correctness can be judged instantly and rapid iteration is possible"
    are where applying GPT maximizes efficiency.


    During my use of GPT, I often recall the feeling of being initially misled by
    wrong answers. It must be emphasized again: **never directly trust the answers
    given by GPT**, not even for the simplest arithmetic problems; we must verify
    them ourselves.


    Of course, we cannot conclude from this that we should not use GPT to solve math
    problems. Researchers are currently training GPT with various methods to enable
    it to solve math problems more accurately. At the same time, generally speaking,
    using GPT to solve math problems is a good method; after all, it gets the answer
    right most of the time, only occasionally making mistakes, and we can always conveniently
    verify the results. "Problems where the result can be directly verified for correctness"
    are the type of problems most suitable for GPT.


    The programming problems we discussed earlier are also very suitable for GPT assistance.
    The code it provides can be run immediately to see if the result is right or wrong.
    If it''s wrong, we can feed the runtime error back to GPT and ask it to modify
    further, keeping the iterative loop going fast. The accuracy of GPT programming
    is not as high as ordinary people think, but the lower accuracy does not pose
    any obstacle to assisted programming, for two reasons: first, we can run it instantly
    to judge whether its answer is right or wrong; second, we can feed the runtime
    error information back to it, ask it to continue modifying, and then run it again
    until there are no problems.


    We can also ask multiple models separately and compare their answers. This is
    actually one of the methods OpenAI uses to evaluate models; it conducts so-called
    adversarial fact-checking among its multiple models, also using one model (e.g.,
    GPT-4) to evaluate the answers of another model (GPT-3.5).


    The third major challenge we encounter in using GPT is: **Are the answers it gives
    good enough?** If we don''t know what a good answer is, or don''t understand what
    constitutes a good answer, we might just accept a mediocre answer.


    We need discernment or connoisseurship regarding good answers. When we apply GPT
    in a field, whether for programming, writing, translation, or image creation,
    we should strive to improve our own cognition and appreciation ability in the
    corresponding field, knowing what constitutes a high-level answer. The advent
    of GPT does not mean we no longer need to learn; we must continue to hone ourselves.
    Now, many tasks can be handed over to GPT, while we only need to be responsible
    for asking questions, giving feedback, and making judgments. Note that **making
    the judgment is our ultimate task**, and it relies on our connoisseurship.


    Figure 4-3 is the Pyramid Capability Model of "Dancing with GPT" we proposed,
    from bottom to top: Domain Knowledge and Methodology, i.e., the knowledge framework
    of the domain; Problem Identification and Analysis, i.e., we must be able to know
    what the problems are; Tool Usage Skills, such as prompting techniques; Professional
    Tool Skills, such as iteration, using professional tools; Judgment of Results,
    i.e., judging the correctness and quality of results; Cognition and Connoisseurship,
    which determines whether we accept a general answer or continue iterating until
    we get the best answer.


    ![](img/pyramid_model.jpg)


    Figure 4-3 Pyramid Capability Model of Dancing with GPT


    In addition, with the widespread application of GPT, we need to master another
    unique discernment and connoisseurship: **How to judge whether a text was written
    by a human or generated by GPT?**


    When we see a text online, or when someone gives us a text, if it is generated
    by GPT but not declared as such, we need the ability to identify it. Of course,
    we are not school teachers; the purpose is not to catch students using GPT for
    homework. The reason we judge whether a text is generated by GPT is that if it
    is, it may contain some annoying errors. Therefore, when we "sniff out" that a
    text was written by GPT, we must be immediately alert.


    We cannot ensure that all users of GPT are responsible. After GPT generates a
    piece of content that looks neat, there will inevitably be people who use it directly
    without verification or modification. They simply don''t know that GPT generates
    answers based on probability, and GPT cannot guarantee the correctness of the
    answer content. Of course, they might not care at all. To me, the absurd, obvious
    errors in these answers are naturally easy to spot at a glance; the more troublesome
    ones are the many small errors hidden within, which can equally lead to serious
    mistakes. Obvious errors are not scary; what is scary is the "plausible but misleading"
    misdirection.


    Let''s take a small example: asking GPT to rewrite a sentence. The original began:
    "From this we can also get an inspiration for using GPT..."; its rewrite began:
    "By using GPT, we can get an inspiration...". Probabilistically, the beginnings
    of these two sentences are very similar, but in terms of content itself, it completely
    changed the original meaning. Therefore, as more and more content on the internet
    is generated by GPT, we need to be increasingly vigilant.


    Another example: asking someone to summarize a report. They provide a summary
    generated by GPT, but they haven''t read the report themselves and carefully verified
    the summary, nor have they explicitly stated that this is a GPT-generated summary.
    Then, their practice could cause serious work errors. Therefore, to avoid such
    problems as much as possible, we need to train ourselves to have a certain discernment
    regarding GPT-generated content.


    We need to understand some common defects of GPT-generated content, know how these
    defects differ from defects in human writing, so that we can consciously avoid
    these defects when using content. More importantly, **whenever we adopt any content,
    viewpoint, or advice, we need to verify it again ourselves**. After all, we are
    the ones using the content, and we are the ones who suffer the loss if something
    goes wrong.


    ---


    Renowned psychologist Daniel Kahneman''s book *Thinking, Fast and Slow* is very
    well-known among the public. Psychologists Keith Stanovich and Richard West, among
    others, divided the human brain system into "System 1" and "System 2", and Kahneman''s
    book led many people to use fast respectively:


    **Prompt**


    > A juggler can juggle 16 balls. Half of the balls are golf balls, and half of
    those golf balls are blue. How many blue golf balls are there? Let''s think step
    by step.


    **Response**


    > There are 16 balls in total. Half are golf balls, so there are 8 golf balls.
    Half of those golf balls are blue, so there are 4 blue golf balls.


    Thus, an important prompt engineering technique is "Chain-of-Thought Prompting",
    simply put, making GPT think step by step. As for what phrasing to use, we can
    decide according to the situation, generally requiring it to give the solution
    steps and list the solving process. For example, "Give the solution process first,
    then the answer." "Help me write a program. First give the overall idea and the
    approach for each step, then give the code."


    Chain-of-Thought is a rapidly evolving field. Recently, someone combined two related
    approaches: one is utilizing GPT''s "Self-Consistency", i.e., letting GPT solve
    the problem using multiple methods, then letting it judge which answer is correct
    and which approach is better; the other is the typical Chain-of-Thought approach,
    i.e., letting GPT solve the problem in steps.


    In May 2023, researchers from Princeton University and Google combined these two
    ideas and proposed the concept of "Tree of Thoughts", a thinking method that can
    significantly improve the problem-solving ability of large language models. The
    illustration is quite simple and clear; the rightmost example in Figure 4-4 shows
    not just letting GPT give the answer directly, nor just Chain-of-Thought or multi-path
    thinking, but letting it break the task into multiple steps, and **at each step,
    try multiple approaches**. Then, let it judge which of the multiple approaches
    for this step is better. Finally, stepping through selections like this, it finds
    the best path among possible choices.


    ![](img/tree_of_thought.jpg)


    Figure 4-4 From Chain-of-Thought to Tree of Thoughts


    Image source: *Tree of Thoughts: Deliberate Problem Solving with Large Language
    Models*, May 2023.


    We can also use the Tree of Thoughts method in prompts. Of course, when using
    this method, we are no longer just prompting GPT to think step by step, but to
    think *with* it, to dance with it. The specific steps are as follows:


    1.  First, tell GPT you want it to complete a task. We break the task down into
    several steps ourselves, or ask it to give a decomposition plan.

    2.  Second, ask it to give three options for the first step, and simultaneously
    ask it to evaluate these options.

    3.  Then, select one from the first-step options it gave. Then ask it to proceed,
    and give three options for the second step, as well as evaluations of these options.
    Loop like this until the final result is obtained.

    4.  Finally, ask it to evaluate the final result. Afterwards, we need to judge
    the final result ourselves and make our own choice.


    In fact, this is precisely the value of ChatGPT adopting a conversational form:
    we can use a conversational way to think with the machine. We don''t just ask
    one question; we break a big problem into several small questions and ask them
    one by one. We can continue to ask follow-up questions based on its answers, and
    in the dialogue with it, gradually get the answer we want. Using GPT is thinking
    in dialogue.


    After the release of the GPT-4 model, a report published by OpenAI showed its
    stunning scores in academic exams. This capability is partly attributed to GPT-4''s
    advantages in Chain-of-Thought.


    In May 2023, a new paper from OpenAI, *Let''s Verify Step by Step*, may be a major
    breakthrough on the road to improving GPT''s capabilities. As the title of this
    paper states, if each solution step is used to supervise the training of the GPT
    model, the model''s problem-solving ability in mathematics, physics, chemistry,
    and other aspects can be significantly improved. If GPT takes the AP Exams organized
    by the College Board for high school students, process supervision can increase
    GPT''s calculus problem-solving accuracy from 68.9% to 86.7%, chemistry from 68.9%
    to 80%, physics from 77.8% to 82.2%, and scores in math competitions similar to
    the Olympiad from 49.1% to 53.2% of the full score. The reason for this change
    is that for problems requiring multi-step reasoning, the model''s training method
    replaced "outcome supervision" with "process supervision". Here we can use an
    analogy of tutoring a child: when a child does homework, they must write the calculation
    process; when a parent tutors the child, they shouldn''t just check if the answer
    is correct, but also check the solution steps and correct them, so the child''s
    grades can be effectively improved.


    If we analogize GPT to a brain, during model training, using a method similar
    to Chain-of-Thought (i.e., process supervision) for training can improve its capabilities;
    and when we use the model, using the Chain-of-Thought method can also better unleash
    its capabilities. In short, **Chain-of-Thought is a key technique that we should
    deeply understand, continuously practice, and proficiently master when using GPT.**


    ---


    # Chapter 5 High-Efficiency AI Notes


    Answers stop imagination; questions drive thinking.


    AI has a huge impact on people''s work and life. In terms of work, AI can do some
    repetitive, tedious tasks, helping us improve work efficiency and reduce error
    rates. At the same time, AI can also assist us in better handling large amounts
    of data and information, improving the accuracy and speed of decision-making.
    In terms of life, AI can provide people with more intelligent and convenient services,
    such as smart homes, smart logistics, smart healthcare, etc. Of course, AI may
    also affect employment in certain positions, which requires us to actively adapt
    to social development trends and master relevant skills.


    ## Section 1 Application of AI in Content Generation


    We receive all kinds of information every day, and our daily work involves dealing
    with all kinds of information. Many people are knowledge workers, and knowledge
    workers cannot do without content production.


    Content production covers a very wide range of fields. For example, in daily work,
    we need to write copy, weekly reports, outlines, emails, and conduct market research,
    etc. In addition, because live streaming and short videos are very popular now,
    we also need to write scripts for live streaming and short videos, conduct industry
    analysis, write market planning proposals, or carry out news reporting. These
    are all work scenarios we often face.


    ### Marketing Copy


    In work, many people encounter situations where they need to write marketing copy.
    For example, some people make coffee beans, some sell fruit, some are yoga teachers,
    and some are responsible for community operations... and all these jobs involve
    writing marketing copy.


    Let''s see how to use AI to assist in writing a course product copy. We need to
    set a persona for it, for example, tell the AI tool: you are now a copy editor,
    you need to write a marketing copy of a certain length for a certain product,
    and you need to start from a certain angle (product features). Finally, refine
    the requirements, for example, this copy targets a specific audience, pay attention
    to language style, such as adding emojis in the copy. Let''s take a look at the
    reference copy GPT gives.


    > 21 Days "AI + Notes", Say Goodbye to High Intensity, Welcome High Efficiency!

    >

    > In the AI era, the pace of life and work is getting faster and faster, and the
    amount of information we carry every day is getting larger and larger. So, we
    not only need high-intensity work performance, but more importantly, we need high-efficiency
    work methods. How to get rid of the unhealthy mentality in work and improve personal
    ability? The answer is: use the power of structural thinking.


    [⁷]: After the appearance of OpenAI''s ChatGPT, Yann LeCun (Chinese name: 杨立昆),
    a top scholar in the field of deep learning, proposed a golden benchmark problem,
    known as "Yann LeCun''s Gear Problem". This problem is often used to test whether
    a model has a certain degree of reasoning ability. The initial version of the
    problem is: We have 6 connected gears in front of us, numbered 1 to 6. If gear
    3 rotates clockwise, what are the rotation directions of gear 1 and gear 6 respectively?


