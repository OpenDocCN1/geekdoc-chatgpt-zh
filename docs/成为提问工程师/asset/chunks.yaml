  trans: '

    # 向 GPT 提问的基础能力


    GPT 出现之后，我们发现它与以往所有互联网产品最大的不同之处是，我们可以问出困扰自己的具体问题。向它提问就像我们获得了与专家一对一提问的机会。如果我们能正确地提问，就将拥有对个人而言的巨大收获。只不过，由于过去我们很少有机会这样提问并得到回答，因此当这样的机会摆在面前时，我们可能已经忘记了该如何提问。


    现在，GPT 的出现让我们必须重视和培养这样的提问能力。我们可以设想自己重回大学校园，我们的提问不是报告厅里听完名家演讲后的提问，也不是上课过程中的举手提问，而更像是到教授办公室向他一对一请教。现在，向
    GPT 提问就是要求我们恢复本来就有的基础提问能力：全面地提供信息，准确地描述疑问，提出关于解答的请求。


    这样的基础提问能力实际上也是当下每个人工作能力的基石。在工作中，我们遇到问题向他人请教时，也应当包括上述这三个要素，即背景信息、问题描述、解答要求。在工作中，当我们以另一种提问方式——即提出要求——请他人帮助完成某项任务时，我们提出的要求也由稍加调整的这三个要素组成：背景信息、任务目标、工作要求。另外，在工作中，当我们向他人提交工作结果，等待对方接受时，我们使用的也是变化后的这三个要素：背景信息、已经完成的任务目标、对解决过程的说明。


    ## 向 GPT 提问三要素


    - 详尽的背景信息

    - 具体的问题描述

    - 清晰的解答要求


    向 GPT 提问，我们可以采用类似的方式，但也需要根据其特点略加调整，这些构成了我们向 GPT 提问的基础技能，可以帮助我们获得更好的答案。调整后的三要素具体如下。


    **详尽的背景信息**：在与专家交流时，我们通常处于共同的背景中。为节省交流时间，我们一般只需要提供非常简洁的背景信息即可。但与机器交流时，我们应提供更多的上下文信息，机器也能够极快地阅读我们所给的信息。


    **具体的问题描述**：我们应当提出非常具体的问题，不要假设 GPT 能够猜到我们的意思。高水平的专家在听了我们的疑问后，有时会复述问题：“你的问题是不是这样……”但
    GPT 不会这么做，如果我们的问题不够具体，它就不能给出令人满意的回答。


    **清晰的解答要求**：机器不理解模糊的要求，因此我们提出的要求要清晰、明确。例如，我们的要求不应该是“给这篇文章写个摘要”，而应是“给这篇文章写个 100
    字的摘要，用普通人可以读懂的方式写，以列表的形式呈现。”我们的要求越具体，得到的结果就越符合预期。


    我们也可以偶尔用一个小技巧，让 GPT 变成能够复述并明确问题的高水平专家。第一步，我们提出要求：我的问题是……请按你能够给出最佳回答的提问方式复述这个问题。第二步，请它回答这个复述的问题。这实际上是让它先变身为一个善于优化提示语的专家，然后再让它做问题相关领域的解题专家。


    最后，让我们回到“对于××，您怎么看”这样的问题。即便我们假设，GPT 是一个知道现有所有知识的超级大脑，但如果提示语是“对于××，您怎么看”，它实际上也无法就这么宽泛的问题给出有价值的回复，最多是表面上看着还行的笼统回答。除了将“××”变得具体之外，我们还可以通过另一种技巧来试图获得更好的回答，也就是让它模仿某个角色：“对于××，如果您是巴菲特，您会怎么看？”我们可以把巴菲特换成查理·芒格、瑞·达利欧、史蒂夫·乔布斯或我们能想到的其他人。


    这其实是从 GPT 得到好答案的一个基础技巧，通过角色限定来让它把“思考”的范围缩小，从而给出有价值的回答。比如，我们可以这样跟它说，“现在，你是一个以英语为母语的人，请用地道的日常英语回答我的提问。”“现在，你是一个人工智能深度学习领域的专家，请帮我解释相关的概念与原理。”当然，我们并不总需要这么明确地限定角色，因为当我们提供背景信息、问题描述时，它就已经在缩小思考范围了。


    另外，我们可能还会注意到一点：如果以轻松的方式提问，GPT 的回答风格也会是轻松的。如果以客气、严谨的方式提问，GPT 的回答也会跟随你的风格。我现在向 GPT
    提问偶尔会以“请您”这样的敬语开始，当然这并不是说 GPT 具有自己的意识，因而我们要对它更客气。我们之所以需要注意自己的提问风格，是因为提示语是 GPT
    生成回答的“种子”，会引导回答的内容与风格。因此，我们想要哪种风格的回答，就要输入哪种风格的提示语。


    总的来说，如果我们向 GPT 提问时做到了有详尽的背景信息、具体的问题描述、清晰的解答要求，通常就能从它那里得到不错的回答了。


    向 GPT 提问时，我们不妨将它看成是不太熟悉的人，因此尽量用友好的态度、较为正式的方式与它交流，详细地解释问题并提出清晰的要求。


    同时，我们还需要对这个“不太熟悉的人”保持谨慎，因为我们不知道他的回答是否正确。特别需要注意的是，当我们以错误的方式提问时，GPT 也会努力回答，且答案看上去格式工整，但那很可能是格式完美的错误答案。


    # 进阶地提问


    有些公司会聘请长期的外部顾问。外部顾问往往是某个领域的资深专家，能够为我们提供高水平的解答。但更重要的是，他在担任顾问期间会持续了解我们，与我们讨论遇到的具体问题，并给出针对性的建议。很显然，当我们有问题时，向他提问的效果通常比请教其他专家要好得多。这种聘请长期外部顾问的做法是在与人交流时的一种进阶做法。类似地，在与
    GPT 交流时，我们同样也要掌握一些进阶的做法。


    要想真正从 GPT 中获益，每个人都应当掌握与 GPT 交流的进阶提问方式。


    在 ChatGPT 的网页版中，我们可以开启多个对话。如果我们有意识地让一个对话仅讨论一个主题，下次再遇到类似问题就继续到之前的对话下面接着问，会发现它的回答要好得多。这个效果就相当于在与一个了解我们的顾问交流。这背后的逻辑也很简单，我们在这个对话中发起新的提问时，之前的问答将被作为上下文以某种方式提交给背后的模型，因此它的回复看起来就更懂我们了。


    实际上，应用开发者在进行 GPT 模型的开发时，需要考虑的一个要点就是如何将用户和模型已经完成的对话概括成摘要，作为用户提出新问题时的上下文，让模型能够始终保持对该话题的关注，从而更好地理解用户的新问题并给出回答。通常而言，记忆力更好的聊天机器人会显得更聪明。


    一些进阶做法能让我们在提问时得到更好的解答。向 GPT 提问的进阶做法将是本书要讨论的重点内容，稍后的各个章节也会有更多讨论。在这里先试举数例。


    ## 进阶提问技巧：少样本提示


    **少样本提示**（`few shot prompt`）。例如，我们希望 GPT 能够帮我们判断，微信中发出某句话的人的情绪是正面、中性还是负面，我们可以预先给出几个例子，说明如何判断微信中的表情。在微信对话中，抿嘴笑脸的表情通常不应当被解读为正面情绪；龇牙笑脸通常为正面情绪；偷笑笑脸通常为中性情绪，而非负面情绪。当我们这样做了之后，GPT
    将能对微信聊天中的对话进行更好的情绪判断。


    在提示语中列出数个“问题—答案”样例，让 GPT 能从样例中学习并按照示例回答问题。


    这种在提示语中提供一些示例的做法称为`少样本提示`，与之对应的是`零样本提示`（`zero shot prompt`），即在提示语中没有任何示例。大量研究和实践都证明，即便模型之前并不了解这项任务，通过对上下文中的少量样本进行学习，它也能学会并完成类似任务。`少样本提示`能够大幅度提高
    GPT 回答的准确性。


    `少样本提示`是最为常用的技巧之一。在提示语中，我们可以提供一个或数个示例，从而让 GPT 的回答能够非常好地遵从示例。例如，我们请 GPT 给出 10 个不常见的表示颜色的词语，我们可以先给出数个例子：“给出十个常见颜色词的替代词。比如天蓝色
    - azure，紫色 - violet。”GPT 的确能根据示例信息理解我们的需求，并给出符合要求的回答：“白色 - ivory，红色 - crimson，绿色
    - emerald……”。


    ## 进阶提问技巧：调整提示语重复提问


    从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。


    调整提示语重复提问。就一个问题向 GPT 提问时，我们不是问一次或两次，而是需要变换方式问几十次。按我们人类交流的常识来看，反复问略有变化的同一问题会招致厌烦，但
    GPT 不会感到厌烦。我们可以从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。我们可以用各种方式向 GPT
    问同一问题，直到获得令我们满意的答案为止。


    不少人认为，提示工程就是编写出一些提示语或收集一些提示语模板，让自己能够用这些提示语得到想要的答案。实际上，提示工程至少是指，我们可以像工程师一样工作，从各个角度调整提示语、反复试验，对比什么样的调整导致了什么样的结果变化，最终找到符合自己需求的提示语。通常，利用程序脚本和`API`，提示工程师会一次运行数量众多的略有变化的提示语，分析并确定哪个提示语可以让我们得到更好的答案。


    其实，每个人都可以在日常使用中通过“调整提示语，重复提问”这一技巧来更好地使用 GPT。例如，为了撰写本书，我有时需要用较为通俗的语句来介绍各种技术，我会用到以下提示语来看看
    GPT 的建议：“请用通俗的话重写。”我们可以反复尝试各种可能的提示语，看看它的回复发生了什么变化：“请用通俗易懂的中文重写”“请用通俗易懂的中文讲解”“请通俗易懂地讲解”“请通俗易懂地讲解，使之适用于忙碌的上班族/中学生，可举例”。


    在我做的若干实验中，我发现，给定一段关于深度学习的英文论文片段，“重写”和“讲解”这两种提示语会导向不同的回复。这很容易解释，“重写”会让 GPT 尽量跟随原文，而“讲解”会让它更为自由。“可举例”是提示它在解读原文之后，用案例再讲解一遍。“忙碌的上班族”和“中学生”虽然都是提示它做到尽量通俗，但“中学生”的提示效果优于前者，得到的回答更易于普通人理解，示例更通俗易懂。但更进一步改为“小学生”后，我发现就所选的论文片段而言，GPT
    无法举出它认为合适的例子，这反而让知识讲解变得不清晰了。从这些例子中可以看出，调整提示语和反复地提问，能够帮我们获得更好的结果。


    ## 进阶提问技巧：拆解任务，分步提问


    我们并不是试图用一次问答让 GPT 完成任务，而是自己预先拆分步骤、分次提问，让 GPT 一次完成一项任务，最终获得想要的结果。


    拆解任务，分步提问。接着上面的例子，我们再来说一个关于进阶技巧的例子。例如，我现在要处理的是一段英文论文的片段，目的是对其进行通俗的解读。我把 GPT 的处理过程分成了两个步骤：第一步，让它严格地进行英译中翻译；第二步，让它按照某种要求重写。


    我的做法是拆解任务，分步提问，以获得最终想要的结果。这种做法并不是试图用一次问答让 GPT 完成任务，而是自己预先拆分步骤、分次提问，让 GPT 一次只完成一项特定任务。


    当然，采用聊天机器人问答这种形式来完成这项任务时，我们可以介入其中，调整中间结果，从而让最终结果变得更好。我们可以调整它给出的翻译表述，然后将调整过的翻译作为下一步任务的输入内容。到了最后一步，如果要采用它的结果，我们通常还需要将文本与原文进行比对，确保内容无错漏，如有必要则还要进行一些调整。


    虽然现在人们对 GPT 的期待值非常高，但是在工作场景中进行实际应用时，我们会发现它很难通过一问一答就直接给到我们想要的结果。除非使用者对结果的好坏并不在意，否则
    GPT 基本不可能一次就达到目标，我们总是在重复提问、多次提问中逐渐得到想要的回答。拆解任务，分步提问是我们用好它的技巧之一。


    ## 进阶提问能激发 GPT 的隐藏能力


    像所有的工具一样，GPT 也要掌握使用方法，才能发挥其能力。


    进阶地提问就好像是沿着 GPT 的原理与设计，找到面板上的某个开关，释放出它的隐藏能力。


    收集有效的提示语，撰写详尽的、结构化的提示语，进行少样本提问，反复调整提示语并测试结果以及拆解任务、分步提问都是常见的进阶提问技巧。


    # 高阶地提问


    要想最大限度地使用好 GPT，我们还要运用不少高阶技巧。目前，大多数人还很难直接运用这些高阶技巧，但随着越来越多的开发者努力工作，各种各样的由 GPT 支持的工具会不断出现，每个人都能从中获益。


    ## 高阶提问技巧：外挂知识库


    目前为 GPT 外挂一个知识库的通常做法是将知识库资料进行名为嵌入的向量化处理。之后，当用户提问时，将用户的问题在知识库中进行语义匹配以检索出相关的资料，然后将用户的问题和资料一起提交给
    GPT。


    之前我们讲到，在提问时我们应提供尽量多的背景信息，以便 GPT 能更好地理解问题。那么，我们能否把数百万字的法律文献给它，然后以此为背景信息来进行提问呢？我们能否把自己企业的所有产品资料都给它，然后进行提问呢？


    对于大多数用户来说，目前还很难做到。但不少程序员已经用上了这样的高阶提问方式：程序员在使用一项编程技术时，通常需要查阅对应的技术文档。他们在提问之前做了一些前期准备工作，对数千页的文档进行处理，然后每次提问时都让
    GPT 先参阅文档再进行回答，这相当于给 GPT 外挂了一个知识库。我们还可以想办法让回答的关键部分与知识库的内容保持高度一致，这也能部分解决“GPT 能够解释，但难以准确引用”的问题。


    以上做法的实现主要是采用嵌入的方式将大量文档转换为大语言模型能够处理的向量形式（也可称为向量化），并将之存入向量数据库。当我们想提出一个问题时，首先将按同样方式嵌入的问题和向量库中的资料进行语义匹配，检索出可能与问题相关的文本片段，然后将这些文本片段作为提问的背景信息提供给
    GPT，让它根据资料进行回答。


    当我们直接使用 GPT 聊天机器人时，发给 GPT 模型的提示语通常就是一句话或几句话，但使用这种高阶方式时，我们发给模型的提示语可能包含了数千字。随着各类大语言模型开始提供更大的上下文窗口，我们可以一次性给出更多的文本，例如`GPT-4`最多可以接收包含
    3.2 万个标记符（`Token`）的上下文，而 2023 年 5 月 Athropic 的`Claude`聊天机器人新版则提供了最多 10 万个标记符的上下文窗口，这意味着我们可以将一整本教科书资料一次性提供给模型作为背景材料。


    现在，业内已经推出了一些能与资料聊天的应用：与 PDF 聊天，我们可以上传一份文档，然后向它提问；与一本书聊天，读书软件会采用类似的方式让我们可以就这本书的内容与之对话；与自己的笔记聊天，我们可以在笔记软件中提问，每次提问时软件会检索出相关笔记作为上下文；与公司财报对话，我们可以就一家上市公司的财报进行提问。可以预见，在不久的将来，提供易用的界面让用户可以与文档对话将是一个重要的应用类型，它让我们能更好地从资料中获取信息。


    当然，检索出相关资料的过程并不像这里介绍的这么简单，研究者还在想各种办法以改善效果。举例来说，现在主要的大语言模型之一`GPT-3.5`的上下文仅有 4096
    个标记符，问题本身和回答还要占掉一定数量，我们能够提供的附加资料最多也就是 2000～3000 个英文单词或汉字。如何对原始资料进行有效的切片，每次匹配出最相关的片段，需要根据实际情况进行反复考量和试验。如果切片过大，那么每次仅能包含少量资料，而其他与之相关的资料可能就被忽略了。如果切片过小，又可能导致失去资料本身的逻辑性，使得每次所附的资料仅是零散的碎片。


    又比如，虽然在高维向量空间对内容进行语义匹配被证明是一种有效的方式，但是，还有没有更好的方式能进一步提升匹配效果呢？目前，卡内基梅隆大学、滑铁卢大学的研究者提出的方法“假设性文档嵌入”（`Hypothetical
    Document Embeddings`，`HyDE`）被越来越多的人采用。我们仅凭用户的提问很难在资料库中匹配到相关的资料，这可能是问题（提问）和答案（资料库中的相关资料）在文字表达上没什么相关性导致的。要想进一步改善，我们可以这么做：将问题先抛给
    GPT，让它给出“假设性回答”。然后，我们用这个“假设性回答”去匹配资料，这时从资料库中匹配出相关资料的概率要大大高于仅用原问题去匹配。


    目前，语言模型相关的两个热门的软件库`LangChain`和`LlamaIndex`都直接支持了这种巧思，开发者可以方便地使用这个方法。另外，如何更好地进行索引、提供更好的向量数据库是当前
    GPT 应用技术发展的热点。


    你或许会觉得，这些与技术开发相关的任务交给技术工程师们去完成就好了。的确，他们的努力很快会使其变成易用的产品。但是，了解这些技术的实现原理将有助于我们更好地选择适合自己的产品。我们也可以知道为什么有时候这些针对资料库进行的回答似乎并不全面，导致这种不足的原因是其背后的做法存在局限。让一个技术产品为我们所用的最好方式是了解它的原理，知道它的局限，然后最大化地发挥它的长处。


    在使用 GPT 时，人们常常会冒出很多有趣的想法：


    - “它能够先搜索再回答吗？”OpenAI 的聊天机器人`ChatGPT`已经配置了可以上网的插件，而微软必应、谷歌、百度的聊天机器人本来就是搜索功能与大语言模型功能的综合体。

    - “它能够听懂语音，然后用语音回答吗？”现在已经有不少基于 GPT 的工具可以做到这一点，实际上它们所做的是，用语音识别记下我们的问题，将问题发给 GPT
    回答，然后将文本转换成语音，播放给用户听。

    - “它能够绘制思维导图/做 PPT 吗？能够进行 AI 绘图吗？”其实也可以，我们提出要求，让 GPT 生成思维导图的文本，然后将文本导入相应的思维导图软件就可以了。类似的，我们提出要求，让
    GPT 生成适用于`Stable Diffusion`的提示语。

    - “它可以订机票/订酒店吗？”可以，我们还可以向它发出指令，让其调用旅行网站的接口查询票价、征询我们的意见、执行订票/订酒店操作等。


    以上这些问题实际上都要用到向 GPT 提问的高阶技巧，即将它的语言生成能力与其他的一个或数个工具结合起来，从而完成一项完整的任务。这些任务可能具有一定专业性，需要专业的工程师来协助执行，但我们可以通过将
    GPT 与其他工具联合起来一起使用来完成这样的专业任务。


    当我们使用这些提问技巧向 GPT 提问时，提问方式已经发生了一个微妙的变化：我们不再像之前一样要求它生成一个我们可以看得懂的回答，而是在要求它生成一个其他的软件、工具、`API`可以“看”得懂的回答，然后这个回答将被输入到其他软件、工具、`API`中，生成想要的结果。


    因此，这个高阶技巧需要与其他工具联合使用，它的目的是让大语言模型生成其他工具能“看”得懂的文本。实际上，用 GPT 进行编程就是这么做的。2023 年 3
    月，在`GPT-4`发布会上，演示者拍摄了一张手绘的网站草图给具有图像模态能力的`GPT-4`，它生成了一个前端网站相关的代码，然后演示者将代码复制到相应的网站工具中运行，一个网站便由此生成。

