    \nGPT是一位有知识但又有局限性的热心助教，我们不能将它的解答当成结论。\n\nGPT是一位万能的助手，但我们要检查和确认它完成的任务。\n\nGPT是一位智慧的顾问，但它并非身在局中，不与我们共担风险。这种超然既是它的不足，也是它的优势。\n\
