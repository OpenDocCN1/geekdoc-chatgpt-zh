    \  | ID：EPUB\\_20260428160408 \n\n# 第三章　向GPT提问的三个基础场景\n\n答案终止想象，提问驱动思考。\n\n刚开始使用GPT时，我们会经历一个很短暂的新奇阶段。我们想知道它究竟有多聪明、有什么能力，我们有各种问题想去问它。但新鲜劲儿过后，一个真正的疑问出现在我们和GPT之间：“我们可以用它做什么呢？”我们可以试着用这个问题去问它，但它给出的答案应该不会让你感到满意。下面我们试着用三个场景来回答这个疑问。\n\
