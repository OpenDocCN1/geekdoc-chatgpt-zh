- raw: 'GPT出现之后，我们发现它与以往所有互联网产品最大的不同之处是，我们可以问出困扰自己的具体问题。向它提问就像我们获得了与专家一对一提问的机会。如果我们能正确地提问，就将拥有对个人而言的巨大收获。只不过，由于过去我们很少有机会这样提问并得到回答，因此当这样的机会摆在面前时，我们可能已经忘记了该如何提问。


    现在，GPT的出现让我们必须重视和培养这样的提问能力。我们可以设想自己重回大学校园，我们的提问不是报告厅里听完名家演讲后的提问，也不是上课过程中的举手提问，而更像是到教授办公室向他一对一请教。现在，向GPT提问就是要求我们恢复本来就有的基础提问能力：全面地提供信息，准确地描述疑问，提出关于解答的请求。


    这样的基础提问能力实际上也是当下每个人工作能力的基石。在工作中，我们遇到问题向他人请教时，也应当包括上述这三个要素，即背景信息、问题描述、解答要求。在工作中，当我们以另一种提问方式——即提出要求——请他人帮助完成某项任务时，我们提出的要求也由稍加调整的这三个要素组成：背景信息、任务目标、工作要求。另外，在工作中，当我们向他人提交工作结果，等待对方接受时，我们使用的也是变化后的这三个要素：背景信息、已经完成的任务目标、对解决过程的说明。


    ##### 向GPT提问三要素


    ·详尽的背景信息


    ·具体的问题描述


    [EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)\="content">·清晰的解答要求


    向GPT提问，我们可以采用类似的方式，但也需要根据其特点略加调整，这些构成了我们向GPT提问的基础技能，可以帮助我们获得更好的答案。调整后的三要素具体如下。


    详尽的背景信息：在与专家交流时，我们通常处于共同的背景中。为节省交流时间，我们一般只需要提供非常简洁的背景信息即可。但与机器交流时，我们应提供更多的上下文信息，机器也能够极快地阅读我们所给的信息。


    具体的问题描述：我们应当提出非常具体的问题，不要假设GPT能够猜到我们的意思。高水平的专家在听了我们的疑问后，有时会复述问题：“你的问题是不是这样……”但GPT不会这么做，如果我们的问题不够具体，它就不能给出令人满意的回答。


    清晰的解答要求：机器不理解模糊的要求，因此我们提出的要求要清晰、明确。例如，我们的要求不应该是“给这篇文章写个摘要”，而应是“给这篇文章写个100字的摘要，用普通人可以读懂的方式写，以列表的形式呈现。”我们的要求越具体，得到的结果就越符合预期。


    我们也可以偶尔用一个小技巧，让GPT变成能够复述并明确问题的高水平专家。第一步，我们提出要求：我的问题是……请按你能够给出最佳回答的提问方式复述这个问题。第二步，请它回答这个复述的问题。这实际上是让它先变身为一个善于优化提示语的专家，然后再让它做问题相关领域的解题专家。


    最后，让我们回到“对于××，您怎么看”这样的问题。即便我们假设，GPT是一个知道现有所有知识的超级大脑，但如果提示语是“对于××，您怎么看”，它实际上也无法就这么宽泛的问题给出有价值的回复，最多是表面上看着还行的笼统回答。除了将“××”变得具体之外，我们还可以通过另一种技巧来试图获得更好的回答，也就是让它模仿某个角色：“对于××，如果您是巴菲特，您会怎么看？”我们可以把巴菲特换成查理·芒格(Charlie
    Thomas Munger)、瑞·达利欧(Ray Dalio)、史蒂夫·乔布斯(Steve Jobs)或我们能想到的其他人。


    这其实是从GPT得到好答案的一个基础技巧，通过角色限定来让它把“思考”的范围缩小，从而给出有价值的回答。比如，我们可以这样跟它说，“现在，你是一个以英语为母语的人，请用地道的日常英语回答我的提问。”“现在，你是一个人工智能深度学习领域的专家，请帮我解释相关的概念与原理。”当然，我们并不总需要这么明确地限定角色，因为当我们提供背景信息、问题描述时，它就已经在缩小思考范围了。


    另外，我们可能还会注意到一点：如果以轻松的方式提问，GPT的回答风格也会是轻松的。如果以客气、严谨的方[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)式提问，GPT的回答也会跟随你的风格。我现在向GPT提问偶尔会以“请您”这样的敬语开始，当然这并不是说GPT具有自己的意识，因而我们要对它更客气。我们之所以需要注意自己的提问风格，是因为提示语是GPT生成回答的“种子”，会引导回答的内容与风格。因此，我们想要哪种风格的回答，就要输入哪种风格的提示语。


    总的来说，如果我们向GPT提问时做到了有详尽的背景信息、具体的问题描述、清晰的解答要求，通常就能从它那里得到不错的回答了。


    向GPT提问时，我们不妨将它看成是不太熟悉的人，因此尽量用友好的态度、较为正式的方式与它交流，详细地解释问题并提出清晰的要求。


    同时，我们还需要对这个“不太熟悉的人”保持谨慎，因为我们不知道他的回答是否正确。特别需要注意的是，当我们以错误的方式提问时，GPT也会努力回答，且答案看上去格式工整，但那很可能是格式完美的错误答案。


    #### 进阶地提问


    有些公司会聘请长期的外部顾问。外部顾问往往是某个领域的资深专家，能够为我们提供高水平的解答。但更重要的是，他在担任顾问期间会持续了解我们，与我们讨论遇到的具体问题，并给出针对性的建议。很显然，当我们有问题时，向他提问的效果通常比请教其他专家要好得多。这种聘请长期外部顾问的做法是在与人交流时的一种进阶做法。类似地，在与GPT交流时，我们同样也要掌握一些进阶的做法。


    要想真正从GPT中获益，每个人都应当掌握与GPT交流的进阶提问方式。


    在ChatGPT的网页版中，我们可以开启多个对话。如果我们有意识地让一个对话仅讨论一个主题，下次再遇到类似问题就继续到之前的对话下面接着问，会发现它的回答要好得多。这个效果就相当于在与一个了解我们的顾问交流。这背后的逻辑也很简单，我们在这个对话中发起新的提问时，之前的问答将被作为上下文以某种方式提交给背后的模型，因此它的回复看起来就更懂我们了。


    实际上，应用开发者在进行GPT模型的开发时，需要考虑的一个要点就是如何将用户和模型已经完成的对话概括成摘要，作为用户提出新问题时的上下文，让模型能够始终保持对该话题的关注，从而更好地理解用户的新问题并给出回答。通常而言，记忆力更好的聊天机器人会显得更聪明。


    一些进阶做法能让我们在提问时得到更好的解答。向GPT提问的进阶做法将是本书要讨论的重点内容，稍后的各个章节也会有更多讨论。在这里先试举数例。


    少样本提示(few shot prompt)。例如，我们希望GPT能够帮我们判断，微信中发出某句话的人的情绪是正面、中性还是负面，我们可以预先给出几个例子，说明如何判断微信中的表情。在微信对话中，抿嘴[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)笑脸的表情通常不应当被解读为正面情绪；龇牙笑脸通常为正面情绪；偷笑笑脸通常为中性情绪，而非负面情绪。当我们这样做了之后，GPT将能对微信聊天中的对话进行更好的情绪判断。


    ##### 进阶提问技巧：少样本提示


    在提示语中列出数个“问题—答案”样例，让GPT能从样例中学习并按照示例回答问题。


    这种在提示语中提供一些示例的做法称为少样本提示，与之对应的是零样本提示(zero shot prompt)，即在提示语中没有任何示例。大量研究和实践都证明，即便模型之前并不了解这项任务，通过对上下文中的少量样本进行学习，它也能学会并完成类似任务。少样本提示能够大幅度提高GPT回答的准确性。


    少样本提示是最为常用的技巧之一。在提示语中，我们可以提供一个或数个示例，从而让GPT的回答能够非常好地遵从示例。例如，我们请GPT给出10个不常见的表示颜色的词语，我们可以先给出数个例子：“给出十个常见颜色词的替代词。比如天蓝色
    -azure，紫色 -violet。”GPT的确能根据示例信息理解我们的需求，并给出符合要求的回答：“白色 -ivory，红色 -crimson，绿色 -emerald……”。


    ##### 进阶提问技巧：调整提示语重复提问


    从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。


    调整提示语重复提问。就一个问题向GPT提问时，我们不是问一次或两次，而是需要变换方式问几十次。按我们人类交流的常识来看，反复问略有变化的同一问题会招致厌烦，但GPT不会感到厌烦。我们可以从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。我们可以用各种方式向GPT问同一问题，直到获得令我们满意的答案为止。


    不少人认为，提示工程就是编写出一些提示语或收集一些提示语模板，让自己能够用这些提示语得到想要的答案。实际上，提示工程至少是指，我们可以像工程师一样工作，从各个角度调整提示语、反复试验，对比什么样的调整导致了什么样的结果变化，最终找到符合自己需求的提示语。通常，利用程序脚本和API，提示工程师会一次运行数量众多的略有变化的提示语，分析并确定哪个提示语可以让我们得到更好的答案。


    其实，每个人都可以在日常使用中通过“调整提示语，重复提问”这一技巧来更好地使用GPT。例如，为了撰写本书，我有时需要用较为通俗的语句来介绍各种技术，我会用到以下提示语来看看GPT的建议：“请用通俗的话重写。”我们可以反复尝试各种可能的提示语，看看它的回复发生了什么变化：“请用通俗易懂的中文重写”“请用通俗易懂的中文讲解”“请通俗易[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)懂地讲解”“请通俗易懂地讲解，使之适用于忙碌的上班族/中学生，可举例”。


    在我做的若干实验中，我发现，给定一段关于深度学习的英文论文片段，“重写”和“讲解”这两种提示语会导向不同的回复。这很容易解释，“重写”会让GPT尽量跟随原文，而“讲解”会让它更为自由。“可举例”是提示它在解读原文之后，用案例再讲解一遍。“忙碌的上班族”和“中学生”虽然都是提示它做到尽量通俗，但“中学生”的提示效果优于前者，得到的回答更易于普通人理解，示例更通俗易懂。但更进一步改为“小学生”后，我发现就所选的论文片段而言，GPT无法举出它认为合适的例子，这反而让知识讲解变得不清晰了。从这些例子中可以看出，调整提示语和反复地提问，能够帮我们获得更好的结果。


    拆解任务，分步提问。接着上面的例子，我们再来说一个关于进阶技巧的例子。例如，我现在要处理的是一段英文论文的片段，目的是对其进行通俗的解读。我把GPT的处理过程分成了两个步骤：第一步，让它严格地进行英译中翻译；第二步，让它按照某种要求重写。


    ##### 进阶提问技巧：拆解任务，分步提问


    我们并不是试图用一次问答让GPT完成任务，而是自己预先拆分步骤、分次提问，让GPT一次完成一项任务，最终获得想要的结果。


    我的做法是拆解任务，分步提问，以获得最终想要的结果。这种做法并不是试图用一次问答让GPT完成任务，而是自己预先拆分步骤、分次提问，让GPT一次只完成一项特定任务。


    当然，采用聊天机器人问答这种形式来完成这项任务时，我们可以介入其中，调整中间结果，从而让最终结果变得更好。我们可以调整它给出的翻译表述，然后将调整过的翻译作为下一步任务的输入内容。到了最后一步，如果要采用它的结果，我们通常还需要将文本与原文进行比对，确保内容无错漏，如有必要则还要进行一些调整。


    虽然现在人们对GPT的期待值非常高，但是在工作场景中进行实际应用时，我们会发现它很难通过一问一答就直接给到我们想要的结果。除非使用者对结果的好坏并不在意，否则GPT基本不可能一次就达到目标，我们总是在重复提问、多次提问中逐渐得到想要的回答。拆解任务，分步提问是我们用好它的技巧之一。


    ##### 进阶提问能激发GPT的隐藏能力


    像所有的工具一样，GPT也要掌握使用方法，才能发挥其能力。


    进阶地提问就好像是沿着GPT的原理与设计，找到面板上的某个开关，释放出它的隐藏能力。


    收集有效的提示语，撰写详尽的、结构化的提示语，进行少样本提问，反复调整提示语并测试结果以及拆[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)解任务、分步提问都是常见的进阶提问技巧。


    #### 高阶地提问


    要想最大限度地使用好GPT，我们还要运用不少高阶技巧。目前，大多数人还很难直接运用这些高阶技巧，但随着越来越多的开发者努力工作，各种各样的由GPT支持的工具会不断出现，每个人都能从中获益。


    ##### 高阶提问技巧：外挂知识库


    目前为GPT外挂一个知识库的通常做法是将知识库资料进行名为嵌入的向量化处理。之后，当用户提问时，将用户的问题在知识库中进行语义匹配以检索出相关的资料，然后将用户的问题和资料一起提交给GPT。


