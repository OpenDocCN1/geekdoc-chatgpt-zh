    \n（此为错误答案）最省钱的方案是租用4辆大客车和2辆小客车，共计2200元，算式为4×400+2×300=2200。具体分配为：前三辆大客车各乘坐50人，共计150人；第四辆大客车乘坐40人，加上剩下的10人，共计50人；两辆小客车各乘坐35人，共计70人。这样，10名教师和210名同学就可以安排妥当，且租车费用最少，共为2200元。\n\
    \n（提示语增加“一步一步做”后的回答，此为错误答案）首先需要确定一共要租多少辆车，可以用以下公式计算：总人数÷每辆车限乘人数=所需车数。210÷50=4.2，向上取整得5，需要租5辆大客车。10名教师也需要乘车，所以共需乘坐215人。剩余的5人可以乘坐一辆小客车。因此，总共需要租6辆车，其中5辆大客车和1辆小客车。因此，总共需要付的租金为2300元，算式为2000+300=2300，这是最省钱的租车方案。\n\
    \n（正确答案，此为按小学生思路做出的解答）为了解决这个问题，我们可以先尝试使用大客车来满足所有人的需求。然后，我们可以尝试减少大客车的数量，同时增加小客车的数量，以找到最省钱的组合。\n\
    \n1.使用大客车：我们需要5辆大客车才能满足220个座位的需求。租金为2000元，算式为5×400=2000。\n\n2.减少1辆大客车，增加1辆小客车：我们使用4辆大客车和1辆小客车，共计235个座位，租金为1900元。\n\
    \n3.继续减少1辆大客车，增加1辆小客车：使用3辆大客车和2辆小客车，共计220个座位，租金为1800元。\n\n我们发现，使用3辆大客车和2辆小客车的组合正好可以满足所有人的需求，且租金最低。因此，最省钱的方式是租3辆大客车和2辆小客车，最少需要付1800元。"
  fmt: '

    # 第四章　像专家一样运用GPT


    答案终止想象，提问驱动思考。


    “人应该拥有多元化的能力，包括但不限于飞行能力、隐身能力、超凡力量、时间旅行能力、心灵感应能力等。人们只有拥有这些能力，才能够真正地实现自我价值，探索未知领域，创造更加美好的未来。”你肯定能一眼看出这段话是堆砌辞藻的胡言乱语。是的，这是GPT被误导后说出的无意义的“呓语”。在识别胡言乱语方面，我们每个人都是识别能力不同的专家。


    当下，人们对GPT寄予厚望，希望它能够直接完成文稿写作、商务谈判、代码编写，等等。然而GPT写出来的文稿是否真的能用呢？GPT生成的商务对话是否合乎要求，而非让对方觉得受到冒犯了呢？我在辅助编程领域较多且深入地实际使用过GPT，我的体会是它具有理解代码、编写代码的能力，但是它的编程能力有很大的局限性：硬技能超棒，但缺乏新知识；基础任务完成得不错，但也存在大大小小的错误；细节任务完成得很快，但全局观有限。简言之，如果使用者不是真的懂编程，很难用它开发出真正可用的程序。


    GPT的确掌握很多的知识，拥有强大的能力，但假如我们自己不是一个“专家级”的使用者，那么很难通过向它提问，完美地达成自己的目标。这里的“专家级”并不是指使用GPT的技巧，而是指提问涉及的领域。在这个领域中，你必须是专业的，你越专业，GPT越强大，越能帮你达成更高目标。


    ## 第一节　专业人士与外行的差别：知识框架与抓住要点的能力


    计算机科学家金出武雄有本书，书名是《像外行一样思考，像专家一样实践》。我对这句话的理解是，我们要跳出“盒子”，像外行一样寻找新创意，但落实时要像专业人士一样严谨。


    当我们要寻求创意时，我们要像专家一样思考，让GPT像外行一样思考。


    当我们要落实方案时，我们要像专家一样思考，让GPT像专家一样实践。


    当我们使用GPT来辅助工作时，也可以借鉴这句话：当我们要寻求创意时，我们要像专家一样思考，让GPT像外行一样思考，这样它能带给我们很多天马行空的创意。当我们要落实方案时，我们要像专家一样思考，让GPT像专家一样实践。我们要设定框架、检查并决定是否接纳GPT的实践成果。如你所见，在两种情况下，我们人类都需要像专家一样思考。


    我们每个人都或多或少是某个领域的专业人士，在这个领域受过系统的教育与培训，有一定的常识和直觉判断力，有惯用的思维框架，有随手可用的工具箱，有各种通常归之为隐性知识的经验及宝贵的教训。当开始使用GPT时，要重新审视自己的长处和不足，思考什么应该自己做、什么可以交给它做。现在看来，要与GPT共舞，尤其需要增强两方面的专业能力：构建知识体系的能力与抓住要点的能力。


    高水平的专业人士拥有已内化的知识体系。当他们工作时，这些内化的知识体系会自然地影响他们思考的落脚点（我们的问题是什么）、方法选择（往哪个方向寻求解答）和结果评估（以什么标准判断解答是有效的）。


    下面以每个商业人士都会关注的营销为例。我想起来前几年读过的小马宋那本通俗易懂的《营销笔记》。营销领域总会不断涌现出各种新概念、新方法，但作为这一领域的初级专业人士，熟练掌握一些基本的知识框架，如`4P理论`包含的产品(`Product`)、价格(`Price`)、推广(`Promotion`)、渠道(`Place`)，就足以应对大部分营销工作任务。小马宋展示的案例主要聚焦产品与价格，例如他提出了一个鲜明的观点：“价格也是产品的一种重要特征。”


    假设有一个营销相关的问题需要向GPT提问，我们已经选定了一个知识框架（比如用价格定位产品），想要进行有针对性的提问（比如我们该如何设定价格），那么，GPT有很大概率会给出有参照性的案例、有启发性的观点。我们可以借助它解决自己遇到的营销问题。


    反之，如果提问者没有选定知识框架，可能就会问出非常笼统的问题：“定价的方法有几种？”或“请你帮我写一个彰显商品高价值的广告语。”这时，GPT的回答很难真正有用，因为提问者无法把回答放进框架，让它变成可用的方案。更重要的是，提问者无法借助自己的知识框架来判断回答的对错与价值。


    实际上，GPT这类工具对于已有一定知识框架（即方法论）的专业人士来说最有价值。用GPT帮忙时，我们面对的场景不是“我有问题，AI有答案”，而是“我知道问题出在哪儿（因为我有一个知识框架），我要请AI针对某个具体问题提供帮助”。


    我们可以按如下方式进一步强化自己的知识体系，从而更好地运用GPT。首先，在一个细分领域内，我们要掌握数个关于这一领域的主要方法论或思维工具，了解其原理、优势、不足以及适用场景。我们还要能针对亟待解决的问题选择相应的知识框架。


    然后，我们与GPT一起使用知识框架，并在知识框架的范围内解决问题。这大体上可以分为如下5个步骤，如图4-1所示。


    ![图4-1 用GPT解决问题的5个步骤](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83TV30e54b6G601He731c.jpg)


    **步骤1**：与GPT讨论，确认双方对知识框架的理解是一致的，同时也可以在提问中让GPT优化知识框架。


    **步骤2**：将共同讨论的知识框架变成提示语的一部分，然后请GPT使用它来解决问题。


    **步骤3**：采用知识框架将问题拆解为具体的、GPT擅长解决的问题，然后请它解决。


    **步骤4**：持续追问，即回到步骤3再次提问，直到获得合适的结果。也可能会选用其他的知识框架，即回到步骤1重新开始。另外，我们还可以让GPT采用这个知识框架对它的解答进行评价。


    **步骤5**：最后，我们对结果做出判断和调整，将结果应用于实际中。


    按照以上的5个步骤使用GPT时，我们如同与GPT组成了一个交响乐团：我们是台上的指挥，知识框架是我们的乐谱，而GPT是整个乐团的演奏者。


    高水平的专业人士往往能够从纷繁复杂的事物中抓住要点。让我们来看一个故事，这个故事被凯德·梅茨(`Cade Metz`)记录在《深度学习革命》(`Genius
    Makers`)一书中。杰弗里·辛顿(`Geoffrey Hinton`)是现今最知名的人工智能与深度学习学者。多年以来，他在加拿大多伦多大学的深度学习实验室一直是这一领域的研究重镇。他曾经与一位数学系本科生进行了一场有趣的对话。野心勃勃的本科生伊利亚·萨特斯基弗(`Ilya
    Sutskever`)向辛顿申请加入实验室。辛顿跟他聊了聊，觉得他很敏锐，因此给了他一篇几十年前的关于“反向传播”的论文，这篇论文揭示了深层神经网络的潜力，让他看完再回来找自己。


    几天后，萨特斯基弗回来了，他说：“我不明白。”辛顿既惊讶又失望，说：“这只是基本的微积分。”“哦，不是的。我不明白的是，你为什么不求导，然后采用一个合理的函数优化器。”“我花了5年时间才想到这一点。”辛顿对自己说。


    辛顿又让这个本科生去读第二篇论文。再回来时，萨特斯基弗还是说，“我不明白。”辛顿问，“为什么呢？”萨特斯基弗说：“你训练了一个神经网络来解决一个问题。但如果你想解决一个不同的问题，你又要重新开始训练另一个神经网络。其实，你应该直接训练一个神经网络来解决所有的问题。”


    辛顿立刻看到了萨特斯基弗独特的能力，他有一种得出结论的方法。实际上，萨特斯基弗这段话所说的正是之后深度学习发展的重要方向——用一种模型架构解决各种类别的深度学习问题。现在，这个思路已经变成了主导性的方法论，例如，`Transformer`架构能够同时应用于文本、图像、语音等多个模态，用于语言理解与生成、编程、逻辑推理等各种场景。


    后来，萨特斯基弗也成为人工智能领域非常重要的人物之一。他后来成为谷歌的研究人员，在那里，他发表了《从序列到序列的神经网络学习》(`Sequence to Sequence
    Learning with Neural Networks`)这篇机器翻译领域的经典论文，这篇论文实际上也可以看成是`Transformer`架构和`GPT`模型的先声。再之后，他联合其他人创立了`OpenAI`，并在其中担任首席科学家。


    在讨论如何运用GPT时提到这个故事是想说明，我们应该努力尝试掌握像萨特斯基弗这样独特的、能预见问题解决办法的能力。从中我们还可以得到一个关于如何使用GPT的启发：既然现在GPT能够协助我们，甚至替代我们做事，那么我们更需要磨砺自己，让自己能像高水平专家一样快速找到要点。找到要点是我们人类的任务，具体实现则可以交由机器去完成。


    幸运的是，现在我们可以借助GPT来找到要点。过去，我们面对的问题其实不只是找不到要点，还无法知道找到的是不是真的要点。现在借助GPT的强大能力沿着我们的想法去执行，看看执行的结果是不是符合我们的预期。通过快速迭代，我们可以更快地知道自己找到的要点是不是正确的。


    当然，最重要的依然是我们人类抓住要点的能力：你能否磨砺出锋利无比的“钩子”，从杂乱中快速且准确地“钩”出问题及其答案。“钩子”这个说法源自“7-Eleven”创始人铃木敏文：我们的脑子里要磨砺出针对一件事的问题“钩子”，用锋利的问题“钩子”钩出好想法，最终结出好成果。


    2023年初，我们向一位敏锐的专家请教大语言模型领域的问题时，也感受到了高水平的专业人士能够从庞杂的事物中抓住要点的能力。2022年底至2023年初，`OpenAI`的大语言模型`GPT-3.5`及聊天机器人`ChatGPT`引起了大量用户的兴趣。但我们这些试图利用该技术开发应用的人往往觉得，训练自己的模型门槛和成本都太高。正是基于这样的认识，很多人关注的重点是选用大公司的`API`进行提示语优化，用嵌入方式外挂知识库，等等。当然，我们也必然关注到了，自2023年3月开始，大量新模型开始陆续出现，令人应接不暇；大量的相关论文都纷纷发表出来，多得让人连摘要都读不过来。


    2023年4月初，当我向这位专家请教时，他几句话就勾勒出了要点。他为我们描绘着这样的发展线索：2023年2月底，Facebook母公司`Meta`开源了预训练的`LLaMA`模型；3月，斯坦福大学研究者基于该模型推出经过指令微调的`Alpaca`模型；之后又有人基于它开发了用对话数据训练的`Vicuna`模型，即它进化到了拥有类似`ChatGPT`的聊天功能；其间，还出现了利用低秩自适应(`LoRA`)技术对模型进行微调以大幅降低成本的做法。专家给出的推论是，开源社区以近乎“光速”的速度重建了技术路线，未来每个人都可以拥有自己的专有模型。之后数日，谷歌流出的一份内部报告也表达了类似的对开源模型的观点。


    ![图4-2 LLaMA开源模型的迭代过程](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83TV30i54b6G601Hf4b1b.jpg)


    经验丰富的专业人士还有一项独特的能力，他们能够用直觉快速判断结果是对还是错。这是本章第二节要讨论的主题：辨别力。我们甚至可以说，辨别力是我们在与GPT共舞时必备的生存技能。


    ## 第二节　与GPT共舞的生存技能：辨别力与鉴赏力


    现今，互联网上充斥着各种各样的观点，辨别力就显得尤其重要了。网上的一些内容看似出自专家之口，但实际上可能完全是其他人的胡诌。比如，有个高中生在维基百科上编写了上百万字的俄罗斯“历史”，但这些内容是她自己“创作”的，属于虚构小说，而维基百科却将其当作了事实。而这竟然在十多年后才被人发现。


    现在，越来越多的人开始使用GPT等人工智能工具，此时我们会发现，辨别力已成为我们的生存技能。缺乏辨别能力不仅会让我们轻易被社交网络上的信息误导，还容易被GPT生成的有错误的内容误导。


    我们在使用GPT时遇到的第一个挑战是：它给出的看似正确的信息真的是可信的吗？我们在使用这类工具时，需要不断地自问：它有没有胡编乱造？


    例如，当它煞有介事地给你一段马尔克斯风格的文字，并注明来自哪本小说的哪一页，你可能就相信了。但实际上，这很有可能是它编造的。虽然GPT并不是每次都错得那么离谱，但错误的概率始终是存在的。又比如，当我们提出更加严格的要求时（请它给出作品英文翻译版的详细出处），它给出的引文的确与原书差不多，但我们仍须仔细辨别，因为有时我们还会发现其中有它自己生成的内容。


    总的来说，但凡是可以模糊表述的，都可能遇到类似的挑战。它几乎不可能实现准确地引用。即便我们给了参考材料，它所进行的总结也可能与参考材料不完全一致。我尝试将德鲁克的《认识管理》的第一章内容提供给GPT，问它德鲁克在书中对管理者工作的五个基本方面的阐述，发现它的回复与原书还是略有差别的。


    当然，模糊性本来就是人类的特点，我们很难一字不差地复述某段话。这么看来，GPT在这方面和人类很像。GPT的学习原理（通过大量文本进行学习，用神经网络的参数权重压缩表示自己所学到的）、生成原理（根据概率和参数权重生成回应内容）也决定了它的回答有着与人类相似的模糊性。


    我们使用GPT遇到的第二个挑战是：它给出的回答是正确的吗？不一定，所以我们一定要自行验证一下。


    ### 提问示例


    10名教师带210名同学去研学旅行，大客车限乘50人，租金为400元；小客车限乘35人，租金为300元。他们怎么租车最省钱？最少需要付多少钱？


    （此为错误答案）最省钱的方案是租用4辆大客车和2辆小客车，共计2200元，算式为`4×400+2×300=2200`。具体分配为：前三辆大客车各乘坐50人，共计150人；第四辆大客车乘坐40人，加上剩下的10人，共计50人；两辆小客车各乘坐35人，共计70人。这样，10名教师和210名同学就可以安排妥当，且租车费用最少，共为2200元。


    （提示语增加“一步一步做”后的回答，此为错误答案）首先需要确定一共要租多少辆车，可以用以下公式计算：总人数÷每辆车限乘人数=所需车数。`210÷50=4.2`，向上取整得5，需要租5辆大客车。10名教师也需要乘车，所以共需乘坐215人。剩余的5人可以乘坐一辆小客车。因此，总共需要租6辆车，其中5辆大客车和1辆小客车。因此，总共需要付的租金为2300元，算式为`2000+300=2300`，这是最省钱的租车方案。


    （正确答案，此为按小学生思路做出的解答）为了解决这个问题，我们可以先尝试使用大客车来满足所有人的需求。然后，我们可以尝试减少大客车的数量，同时增加小客车的数量，以找到最省钱的组合。


    1. 使用大客车：我们需要5辆大客车才能满足220个座位的需求。租金为2000元，算式为`5×400=2000`。


    2. 减少1辆大客车，增加1辆小客车：我们使用4辆大客车和1辆小客车，共计235个座位，租金为1900元。


    3. 继续减少1辆大客车，增加1辆小客车：使用3辆大客车和2辆小客车，共计220个座位，租金为1800元。


    我们发现，使用3辆大客车和2辆小客车的组合正好可以满足所有人的需求，且租金最低。因此，最省钱的方式是租3辆大客车和2辆小客车，最少需要付1800元。

    '
