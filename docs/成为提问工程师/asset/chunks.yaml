- raw: "试验下来，会发现这道题像“杨立昆齿轮问题”[⁷](#fn7)[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)e\\\
    _ref\\_1\">![在OpenAI的ChatGPT出现之后，深度学习领域的顶级学者Yann LeCun（中文名：杨立昆）提出了一个黄金测试问题，被称为“杨立昆齿轮问题”，这个问题经常被用来测试模型是否具有一定的推理能力。这个问题的初版是：在我们面前有6个连在一起的齿轮，编号是1到6。如果第3个齿轮顺时针旋转，那么齿轮1和齿轮6的旋转方向分别是什么？](Images/note.png)​一样，也是个有意思的黄金测试。我们数十人进行了上百次实验，发现各个聊天机器人一下子给出正确答案的概率很低。让它重做也不一定能改对。提示它一步一步推理后，虽然得到正确答案的概率会提高，但仍然会出错。有意思的是，如果让它用代数的方法做，则基本上都能做对。让它用编程实现，则程序代码也可以一次算对。\n\
    \n“可以直接验证结果是否正确”的问题，是最适合用GPT的问题类型。\n\n“可以即时判断结果对错、可以快速迭代”的问题，应用GPT能将效率提到最高。\n\n\
    我在使用GPT的过程中，总会不时地想起最初被错误答案误导时的感受。这里要再次强调的是，永远不要直接相信GPT给出的答案，即便是最简单的算术题也不行，我们必须自己再进行一次验算。\n\
    \n当然我们不能因此得出结论，不要使用GPT解答数学题。现在研究者们正在用各种方法训练GPT，以便使其能更准确地解答数学问题。同时，一般来说，用GPT解答数学题是个好方法，毕竟它大多数时间都能算对，只是偶尔可能会出错，但我们总是可以很方便地进行验算。“可以直接验证结果是否正确”的问题，是最适合用GPT的问题类型。\n\
    \n之前我们讨论过的编程问题也是非常适合用GPT来辅助完成的问题。它给出的程序代码可以通过运行来立即查看结果是对还是错。如果是错的，我们还可以把运行错误反馈给GPT，让它做进一步修改，让循环迭代快速进行下去。GPT编程的准确度并不像普通人认为的那么高，但较低的准确度并不会给辅助编程造成任何障碍，原因有二：第一，是我们可以即时运行以判断它回答得对与错；第二，是我们可以把运行错误的信息返给它，请它继续修改，然后再次运行，直到没问题。\n\
    \n我们还可以向多个模型分别提问，对比它们的答案。这其实正是OpenAI用来评估模型的方法之一，它对自己的多个模型进行所谓的对抗性事实检查，也是在用一个模型（比如GPT-4）去评估另一个模型(GPT-3.5)的回答。\n\
    \n我们使用GPT遇到的第三大挑战是：它给出的答案足够好吗？如果我们不知道什么是好答案，不了解什么是好答案，我们可能就会接受一般的答[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)案。\n\
    \n我们需要对好答案有鉴别力或者说鉴赏力。当我们把GPT用在一个领域时，不管是用于编程、写作、翻译还是图像创作等，都应当努力提高自己在相应领域的认知和鉴赏能力，知道什么才是高水平的答案。GPT的出现并不会让我们不再需要学习，我们仍须持续磨砺自己。现在，有很多任务可以交由GPT去完成，而我们只需要负责提问、反馈和做出判断。请注意，做出判断这一步是我们的终极任务，它依赖于我们的鉴赏力。\n\
    \n图4-3是我们提出的人与GPT共舞的金字塔能力模型，自下而上依次是：领域知识与方法论，即领域的知识框架；问题识别与分析，即我们要能够知道有什么问题；工具使用技巧，如提问技巧等；专业工具技巧，如迭代、使用专业工具等；对结果的判断力，即判断结果的对与错、好与坏；认知与鉴赏力，这决定我们是接受一般的回答，还是持续迭代下去，直到获得最好的回答。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83Xd30f54b6G601Hed1ac.jpg)\n\
    \n图4-3 与GPT共舞的金字塔能力模型\n\n另外，随着GPT的广泛应用，我们还需要掌握另一种独特的鉴别力与鉴赏力：如何判断一个文本是由人撰写的，还是由GPT撰写的？\n\
    \n当我们在网上看到一个文本，或者当别人给我们一个文本时，如果它是由GPT生成的文本却未加说明，我们需要有能力将它识别出来。当然，我们并非学校里的教师，这样做的目的也不是要抓住用GPT做作业的学生。我们要判断一个文本是否由GPT生成的原因是，如果是的话，其中可能会有一些恼人的错误。因此，当“嗅”到一个文本是由GPT撰写的时候，我们要立刻警觉起来。\n\
    \n我们无法确保所有使用GPT的人都是负责任的。GPT生成一段看上去很工整的内容之后，难免有人不加核查、不经修改就直接使用了。他们根本不知道，GPT仅仅是根据概率生成回答内容，GPT不能保证回答的内容是对的。当然，他们可能根本不在乎。对我来说，这些回答中荒谬的、明显的错误当然很容易一眼就能发现，比较麻烦的是隐藏其中的很多小错，它们同样也可能导致很严重的错误。一眼就能看出来的错误不可怕，可怕的是“似是而非”的误导。\n\
    \n举一个小例子，请GPT改写一句话，原文开头是：“从中我们还可得到一个使用GPT的启发……”，它改写的开头是：“通过使用GPT，我们可以得到一个启示……”。从概率上讲，这两[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)句话的开头很像，但是从内容本身来讲，它完全改变了原本的意思。因此，互联网上由GPT生成的内容越来越多时，我们就需要不断提高警惕。\n\
    \n又比如，请人对一份报告进行总结摘要，他给出一份由GPT生成的摘要，但他自己并未阅读报告并仔细核查摘要，也没有明确说明这其实是用GPT生成的摘要。那么，他的这种做法可能就会造成严重的工作失误。因此，为了尽量规避类似的问题，我们需要训练自己，让自己对GPT生成的内容有一定的鉴别力。\n\
    \n我们要了解GPT生成内容的一些常见缺陷，知道这些缺陷与人类书写内容缺陷的不同之处，从而在使用内容时能够有意识地避开这些缺陷。更重要的是，我们在采用任何内容、观点或建议时，均需要自己进行再次查证。毕竟使用内容的人是我们自己，出问题时遭受损失的也是我们自己。\n\
    \n\\[https://t.me/+WwC4dCWvXRdhOTNh\\] © 未经授权禁止转载 [获取更多电子书：https://t.me/+WwC4dCWvXRdhOTNh](https://t.me/+WwC4dCWvXRdhOTNh)\
    \  | ID：EPUB\\_20260428160408 \n\n## 第三节　思考快与慢：采用链式思考\n\n著名心理学家丹尼尔·卡尼曼(Daniel\
    \ Kahneman)的著作《思考，快与慢》在大众中有着非常高的知名度，心理学家基思·斯坦诺维奇(Keith E. Stanovich)和理查德·韦斯特(Richard\
    \ West)等将人类的大脑系统分成了“系统1”和“系统2”，而卡尼曼的这本书让非常多的人开始使用快思考、慢思考来看待思考过程，并用它们让自己更好地思考。\n\
    \n这种区分方式也对GPT产生了很大的影响。2023年5月，OpenAI联合创始人安德烈·卡帕西(Andrej Karpathy)在详细讲解GPT模型训练的演讲中展示了众多研究成果，成果显示研究者们正在试图让GPT具有“系统2”慢思考的能力，以期用它来进一步提高GPT的性能。\n\
    \n同时，作为使用者，我们已经可以用一些技巧来让GPT进行慢思考，这也是专业地使用GPT应该掌握的技能。我们应该与GPT一起进化，当它逐渐能够慢思考之后，我们也要能够用更多的技巧激发出这个超级大脑的潜能。\n\
    \n在《思考，快与慢》中，卡尼曼这样定义“系统1”与“系统2”：\n\n系统1的运行是无意识且快速的，不怎么费脑力，没有感觉，完全处于自主控制状态。\n\n\
    系统2将注意力转移到需要费脑力的大脑活动上来，例如解答复杂的运算。\n\n对于人类来说，采用“系统2”进行思考，通常意味着如卡尼曼所说的，“始终如一地保持某种状态需要付出持之以恒的努力”。“注意力要集中”这句话往往能提醒我们进入“系统2”进行慢思考。很显然，我们不能对GPT说这句话，即使真的在提示语中用这句话也不会奏效，它可不像人类一样容易注意力不集中。那么，我们如何让GPT进入“系统2”进行慢思考呢？\n\
    \n这个神奇的提示语在第二章中其实已经提到过了，当我们在提示语中加入“让我们一步一步思考(Let's think step by step.)”后，GPT做数学题的准确率得到了大幅度提高。为什么呢？2023年1月，谷歌研究人员在论文中证明，链式思考提示语能让大语言模型开始推理，更好地激发GPT的潜能。\n\
    \n首先，让我们通过谷歌研究人员在[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)论文中给出的示例来了解常规提示语与链式思考提示语的差别。\n\
    \n常规提示语及回答示例如下：\n\n##### 提问\n\n罗杰有5个网球。他又买了2罐网球，每罐有3个网球。现在他有多少个网球？\n\n食堂有23个苹果。如果他们用20个苹果做午餐，然后又买了6个，那么他们现在有多少个苹果？\n\
    \n##### 回答\n\n答案是27。（这个答案是错误的）\n\n在以上提示语中，提问者给出了一个示例，示例直接给出了问题的答案，而没有给出解答过程。需要特别说明的是，现在如果我们将这个提问输入各个已经更新迭代过的模型，它们通常不再会给出错误答案了。这里的示例仅是用于说明常规提示语与链式思考提示语的差别。\n\
    \n链式思考提示语及回答示例如下：\n\n##### 提问\n\n罗杰有5个网球。他又买了2罐网球，每罐有3个网球。现在他有多少个网球？\n\n罗杰开始时有5个网球，2罐网球一共是6个网球（每罐3个）。5+6=11，所以答案是11个。\n\
    \n食堂有23个苹果。如果他们用20个苹果做午餐，然后又买了6个，那么他们现在有多少个苹果？\n\n##### 回答\n\n食堂原来有23个苹果。他们用20个苹果做午餐，所以他们剩下的是3个。他们又买了6个苹果，所以他们现在有9个。答案是9个。\n\
    \n在以上链式思考提示语示例中，提问者给出了一个示例，同时给出了解答过程，再给出答案。这也是提示GPT进行链式思考，不是采用“系统1”给出答案，而是采用“系统2”的慢思考方式，一步一步解题，然后给出答案。\n\
    \n就这样的数学题而言，其实没必要给出示例，我们用一些神奇的提示语就可以让GPT进行链式思考和推理。多伦多大学、谷歌、东京大学的研究人员在2023年1月发表的另一篇相关论文《大语言模型是零样本推理者》(Large\
    \ Language Models are Zero-Shot Reasoners)中说明了这一点。以下是论文中给出的一个示例，提示语和回答分别如下：\n\n\
    ##### 提问\n\n一个杂耍者可以同时玩16个球。其中一半的球是高尔夫球，而这些高尔夫球中又有一半是蓝色的。那么有多少个蓝色的高尔夫球？我们一步步来想(Let's\
    \ think step by step.)。\n\n##### 回答\n\n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p\
    \ class=\"content\">总共有16个球，其中一半的球是高尔夫球，也就是说有8个高尔夫球。而这些高尔夫球中有一半是蓝色的，也就是说有4个蓝色的高尔夫球。\n\
    \n由此可见，一个重要的编写提示语的技巧就是“链式思考提示语”，简单来说就是让GPT一步一步地思考。至于采用什么语句，我们可以根据情况自行决定，一般是要求它给出解答的步骤，列出解题过程。比如，“先给出解题过程，然后再给出答案。”“请帮我编写程序。先给出整体思路、各步骤的做法，然后再给出代码。”\n\
    \n链式思考是一个快速进化的领域，最近有人将两种相关的做法结合了起来：做法之一是利用GPT的“自我一致性”(self consistency)，即让GPT用多种方法解题，然后让它自己去判断，哪个答案是对的、哪种解题思路更好；做法之二则是链式思维的典型做法，即让GPT分步骤解题。\n\
    \n2023年5月，普林斯顿大学和谷歌的研究人员结合这两种思路提出了“树形思考”(Tree-of-Thought)的概念，这一思考方式可以大幅提高大语言模型的问题解决能力。图示相当简单明了，图4-4中最右的示例所展示的，既不是让GPT直接给出答案，也不是让它进行链式思考或者让它按多个路径思考，而是让它将任务分成多步，在每一步中都尝试用多种做法。然后，由它判断这一步的多个做法里面哪个更好。最终这样一步步选择下来，它在可能的选择中找到最佳路径。\n\
    \n![](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83bl30c54b6G601H25146.jpg)\n\
    \n图4-4 从链式思考到树形思考\n\n图片来源：《树形思考：用大语言模型深思熟虑地解决问题》，2023年5月。\n\n我们也可以在提示语中使用树形思考方法。当然，使用该方法时，我们不再是仅仅提示GPT要一步一步思考，还要与它一起思考，与它共舞，具体步骤如下。\n\
    \n·首先，告诉GPT要请它完成一项任务，我们自己将任务拆分成数个步骤，或者请它给出拆分方案。\n\n·其次，请它给出第一步的三个选项，同时请它就这些选项进行评估。\n\
    \n·然后，在它给出的第一步选项中，选择一个。然后请它接着做下去，并就第二步给出三个选项，以及对这些选项的评估。如此循环，直到得到最终结果。\n\n·最后，请它就最终结果进行评估。之后，我们需要就最终结果进行判断，做出自己的选择。\n\
    \n<[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)p class=\"content\">实际上，这也正是ChatGPT聊天机器人采用对话形式的价值：我们可以用对话的方式与机器一起思考。我们不是只提一个问题，而是将一个大问题拆成数个小问题，逐一提问。我们可以就它的回答继续追问，在与它的对话中，逐渐得到自己想要的答案。使用GPT，就是在对话中思考。\n\
    \n在GPT-4模型发布后，OpenAI发表的报告中展示了它参加学科考试时获得惊艳的成绩。这种能力要部分归功于GPT-4在链式思考上的优势。\n\n2023年5月，OpenAI的一篇新论文《让我们一步一步验证》(Let's\
