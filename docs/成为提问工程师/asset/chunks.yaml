    ### 高阶提问技巧：与其他工具联合使用


    我们向GPT提问，目标是让它生成独特的文本，这些文本可被其他的软件、工具、API利用。


    我们可以让GPT生成其他工具能够识别并采用的独特文本，而在此基础上，我们还可以更进一步。我们可以利用GPT的语言、逻辑推理等能力，让它串起完成任务的全过程，此时它变成了听我们指令、调用其他工具的中枢。换句话说，就是用大语言模型将各种工具连接起来，同时给定一个目标，让它自己进行优化和决策。`Auto-GPT`是其中的典型，它利用`OpenAI
    GPT-4`语言模型的能力，同时连接各种工具，来自动完成被设定的目标。


    还有一项每个人都可以立刻用上的高阶提问技巧：对一个提问进行多轮处理。与进阶提问技巧中“拆解任务，分步提问”不同的是，这里我们不仅仅是简单地将任务拆分为数步，还要进行多轮复杂的操作，有的由GPT完成，有的由我们自己完成，最终在人和GPT的共同协作之下完成一项复杂的任务。这不是机器的“独角戏”，而是人与机器的共舞。


    ### 高阶提问技巧：多轮交互，完成复杂任务


    与GPT进行多轮交互，部分步骤由GPT完成，部分步骤由人完成，人机协作共同完成一项复杂的任务。


    现在有很多商业公司提供的AI产品都遵循着这样的逻辑，它们在背后帮我们进行了多轮处理。为了便于理解，我们先以简单地修改文章作为例子来说明。比如我们有一个文章片段，要请GPT帮忙优化表述方式，让文章更易懂。与通常做法不同的是，我们可以按以下这样做（这可能需要一些工具辅助，但也可以通过多轮对话来进行尝试）。


    在将文章发给GPT之后，我们可以逐步提出如下要求：


    1. 首先，请就语句表达是否易懂对该文章进行评判，给出三条可能的修改方向。

    2. 其次，请针对每条建议，各给出两个修改版本：一个版本要求尽量不改动原文字；另一个版本则可以大幅度修改。

    3. 然后，希望修改版能够在风格上有所优化，比如借鉴某位作家的风格。

    4. 最后，请对文章的语法进行检查，对重复词推荐替代词，对文章做最后的修饰。


    以上利用GPT修改文章的过程中，我们不是让GPT回答一个问题，而是让它回答了很多个问题。如果我们所用的工具提供了这样的接口，可能还需要调整GPT的调用参数。比如，如果我们想看看修改版是否与原版有很大差异，我们可以把调用参数里面的温度参数从通常的`0.7`调为`1.0`，然后就会看到它的表达变得更多样化了。虽然输入的是同样的提示语，但每次的结果都很不一样。


    图2-2所示的是一个更为复杂的设想案例：我们试图将GPT作为AI旅游顾问的核心。首先，一个客户向AI旅游顾问提出需要设计一个旅游方案，GPT开始与客户对话，详细询问他的需求。其次，GPT会分析客户的需求，决定需要用到哪些工具。GPT生成适用于各个工具的文本，如调用数据库或调用接口的命令。在图2-2中，我们假设GPT会调用内部数据库以查询内部特色方案、进行全网搜索以查询最新景区信息、调用外部资料库（如查询小红书平台上的游记）、调用票务平台接口以检索机票和酒店的预定信息。然后，在收集到所有的资料和信息之后，GPT生成客户所需的旅游方案的初稿，并提交给客户征求意见。最后，当用户确认之后，GPT生成最终的旅游方案，并完成各项机票、酒店、导游服务的预订安排。


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83fs30b54b6G601H06ffc.jpg)


    图2-2 AI旅游顾问：使用GPT为客户设计旅游线路


    在这个综合性使用示例中，我们至少要用到两项高阶提问技巧：与其他工具的联合使用、通过多轮交互完成复杂任务。我们可以看到，一方面，在完成这样的综合性任务时，GPT在多个流程中都发挥了核心作用；另一方面，GPT的专业使用者也非常重要，实际上是专业使用者将所有的一切都串联了起来，最终与机器一起完成了任务。


    ### 通过高阶提问定制自己的工具


    能否定制自己的工具，是区分高手与一般使用者的标准。


    每个人的手机、电脑与别人的都不同，其中有自己选择的软件、所做的快捷设置以及个人的偏好信息。使用GPT时，我们同样也可以做很多设置，甚至定制出自己独特的使用方式。


    当我们将GPT与其他工具联合起来使用，按自己的需要进行定制，然后将之融入工作流程时，它就会发挥巨大的威力。


    ## 第三节 向GPT提问的飞轮思维


    我们提问题，AI给答案。我们如何用提问的方式从AI那里获得最大的帮助？在这里，我们尝试提出一个向GPT提问的思维范式——飞轮思维（如图2-3所示），它同时适用于向GPT正确地提问、进阶地提问、高阶地提问。


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83fs30d54b6G601H2fb92.jpg)


    图2-3 向GPT提问的飞轮思维


    图2-3所示的飞轮思维是综合多方面的认知总结而来的，具体如下：


    - 对GPT模型原理的理解

    - GPT模型微调实践

    - 依托GPT开发的面向企业和个人的产品

    - 个人学习生活中使用的GPT相关产品

    - 工作中使用的GPT相关产品

    - 向人提问的经验与教训

    - 对知识学习与技能学习的认识

    - 精益创业的迭代逻辑等


    ### 设定角色


    向GPT提问通常不是一次就能得到想要的回答。向GPT提问通常是一个循环：描述问题、获得回应、进行评判、完善问题、再次提问，直到获得满意的回答。但在直接开始提问之前，我们注意到向GPT提问还有一个前置步骤——设定角色。


    实际上，当我们不做任何角色设定时，GPT选用的是一个默认的设定，例如`ChatGPT`聊天机器人被设定成一个有用的助手。如果我们使用编程接口访问，就会明确看到这句默认的设定。一般来说，我们可以认为各种GPT模型在提供服务时，都被进行过与人类价值观对齐的操作，它们被设定为“`HHH助手`”，这三个“H”分别是有帮助的(`Helpful`)、诚实性(`Honest`)和无害性(`Harmless`)。


    以下是`ChatGPT`角色设定的相关提示语片段（原文为英文），是通过直接询问它获得的。


    ```

    ChatGPT旨在通过提供的内容，生成类似人类语言的文本。它经过训练，利用各种数据，包括书籍、文章和网站，形成对人类语言的广泛理解。


    作为一个AI语言模型，它可以回答问题、参与讨论、提供解释并协助完成各种任务。但需要注意的是，它是人工智能，没有个人经历或情感。

    ```


    我们还可以看到，`ChatGPT`对于自己能力的局限以及我们该如何使用它也有一些设定。


    ```

    尽管我努力提供准确的最新信息，但是请记住我的知识都是2021年9月之前的。因此，我可能不了解该日期之后发生的最新事件或进展。


    在使用ChatGPT时，提出具体而明确的问题非常重要，这可以确保获得最佳回答。模糊或含糊不清的查询可能导致不准确或不完整的答案。


    在必要时，请务必对我提供的信息进行批判性评估，并与可靠的来源进行交叉参考。尽管我致力于提供帮助，但无法保证所生成信息的准确性或可靠性。

    ```


    在提示语中，我们还可以根据自己的需要来设定GPT的角色，让它能够更好地回答问题。通常来说，我们通过设定角色来限定它的知识与能力范围、设定它回答问题的方式。在2023年初，各种教人如何使用`ChatGPT`的资料大多是角色设定提示语的大汇总。这里，我们以英语老师为例来说明如何设定角色。


    ```

    你是一个以英语为母语、又懂中文的英语老师。

    ```


    我们可以明确它的任务设定，这样就不用每次对话时重复设定了。


    ```

    你是一个以英语为母语、又懂中文的英语老师。当我输入一段英文时，请帮我修改为接近英语母语的表达方式。当我输入中文时，请帮我用英语重说一次，注意不是翻译。

    ```


    我们还可以设定更具体的规则，比如要求采用什么水平的英语词汇，要求采用商业书写风格还是学术书写风格，等等。


    ```

    ……请选用易懂的英文单词，避免使用复杂的句式，使用场景是工作中的交流。

    ```


    角色设定是向GPT提问的基础。我们也可以这么理解，角色设定是用这些话指定GPT的思考范围，引导它在这个范围内回答问题。当然，不一定要明确地写出一个描述性的角色说明“你是……”，也可以在提问中包含较为具体的角色设定描述。


    有时，比起一个比较模糊的角色介绍，直接提出明确的要求且含有具体的角色设定描述，可能更容易得到期待的结果。例如，无须说“你是一个文字处理高手”，而是说“给出下文的摘要，找出最重要的要点，以表格的形式给出”。谷歌的`PaLM`语言模型有一个提问样例展示网页，其中大量样例都是这么做的。下面我们来看三个例子，第一个例子中给出了一个角色定义，但其中的重点并非“产品营销人员”，而是“面向`Z世代`”这个界定；第二个和第三个都是通过具体的要求来进行角色设定，它们比类似于“你是一个善于将语句修改得更有说服力的专家”“你是一个聚会活动创意专家”这样的描述性角色说明要更有效。


    ```

    你是面向Z世代的产品营销人员。你负责为产品撰写令人感到兴奋和新鲜的广告文案。请保持文案简短。

    ```


    ```

    修改犹豫不决的措辞，使句子更具有说服力。例子：我觉得明天报告就能做好。修改后：报告将于明天完成。

    ```


    ```

    给出一个聚会创意文稿，列出一些小吃、聚会游戏以及促进人们相互了解的活动。

    ```


    ### 描述问题


    使用GPT模型的基本方式是，我们向它提出问题，即输入提示语，它给出回答。我们与它交互的循环是从描述问题并进行提问开始的。


    一般来说，我们应该向GPT提出精确的问题。`OpenAI`在《提问最佳实践》(`GPT Best Practice`)中有这样一条指引示例[⁵](#fn5)：


    说明：在背景信息、结果、长度、格式、风格等方面，提示语的描述应尽可能详细、具体。


    不太有效的例子：写一首关于OpenAI的诗。


    能得到更好结果的修改版：写一首短而激励人心的诗歌，以某著名诗人的风格，聚焦于OpenAI最近推出的`GPT-4`产品（`GPT-4`是OpenAI最新推出的大语言模型）。


    我们可以把其中的“著名诗人”改成任何想要的名字，比如沃尔特·惠特曼(Walt Whitman)。这里插一句题外话，让模型模仿知名人士的风格是生成式AI中的图像生成模型的重要提示语技巧。当我们想让它生成一种艺术风格时，最简单直接的做法是让它模仿，模仿对象的名字就是风格“咒语”：巴勃罗·毕加索(Pablo
    Picasso)、莫奈(Monet)、村上隆、新海诚、玛格南图片社……


    #### 提问


    ```

    写两首短而激励人心的诗歌，分别以诗人北岛和词人林夕的风格，聚焦于OpenAI最近推出的GPT-4产品（GPT-4是OpenAI最新推出的大语言模型）。

    ```


    #### 回答


    以下是模拟北岛风格和林夕风格的示例片段。


    ```

    ____________________________________________________________________________________


    北岛风格：


    它像一道闪电，照亮了人类的灵魂，


    让我们更深层次地认识自己。


    ____________________________________________________________________________________


    林夕风格：


    语言模型兼备天赋与技巧，


    仿佛早已看透这个世界。


    ____________________________________________________________________________________

    ```


    稍后，对于翻译、写作、学习等基础场景，工作沟通、营销、电商等应用场景，我们还会讲解更多关于如何撰写提示语的案例。在这里，让我们接着看提问的循环。


    ### 获得回应


    我们向GPT提问，它会立刻给出回答。你可能会想，到了回应这一步就是GPT的任务了，我们可以歇会儿了吧。其实不然。要想从GPT中获得尽可能大的收益，我们需要特别关注这一步。


    当我们提问时，我们的提示语中不只是有问题，还应当包括一个关键要素，即对于生成结果的要求，这也称为输出提示。关于这一点，我们会在第3章详细讲解。


    有时，输出的要求被隐含在问题中，比如“费曼学习法是什么？”“请帮我把这段文字改写为140字的微博。”


    更多时候，我们会明确地提出输出要求，比如“用`Python`编写出如上任务的代码。”“给出10个选择，用1.2.3.编号。”如果要让GPT的回答能应用于其他软件，我们还需要给出格式要求，比如“用`Markdown`表格给出，并把表格用三个反引号(`
    ``` `)包围好。”


    通常，如果回答的形式与我们所想的不一样，我们会立刻修改提问中的输出提示，看看答案有什么变化。


    ### 进行评判


    我们提问，GPT回答。它的回答好不好？我们能不能使用这个答案？对答案进行评判是我们的责任。


    在使用GPT时，我们很容易落在“光谱的两端”。一端是粗略地看它的结果，感觉很惊艳，“哇，它真的会写诗。”“它真的会做数学。”“它真的会编程。”另一端是否定它，“嗯？这数学题怎么做错了。”“代码里用的怎么是根本不存在的接口？”


    GPT给出的回答通常并不完美，我们在使用GPT时应该时刻记住这一点。这可能是由两方面原因造成的。


    第一个原因是我们的提问不够准确，又或者我们提问的方式有问题。一个有趣的例子是，GPT做数学题时有时虽然答案正确但过于简略，有时彻底做错了。但是，如果我们在提问后面加一句话，可能就会起到神奇的效果：“让我们一步一步思考。”研究分析，这句话可以让GPT做数学题的正确率提高61%。


    第二个原因是GPT的能力存在各种各样的天然局限性。我们经常看到人们对于GPT能力的惊叹，但不可忽视的是，它远不够完美：它的回答经常过于笼统，英译中的翻译可能完全译错了意思，它给的信息经不起严格的查证，甚至还可能编造完全不存在的信息。


    是否接纳GPT的回答是提问者自己的责任。我们必须自问：它这次的回答是否让我满意？如果不满意，是哪里不满意？如果重新提问，应该如何修改提问内容？


    有一个有意思的小技巧是，我们可以让GPT自己评判自己。你可以按以下内容提出追问：


    - “你完全确信这个答案吗？”如果答案是错的，它会立刻发现，并给出修改后的答案。

    - “请你自己评价一下这个答案，用`0~10分`给出评分和理由。”它的自评能帮我们对它的回答进行分析和评判。


    当然，我们也可以在给出补充信息后再要求它自行评判与修改：


    - （之前让它做一道小学数学题）你刚刚的计算中没有纳入老师的人数。

    - （之前让它就一个商业问题进行分析）补充这个方面的信息如下：……你现在是否确信刚才的分析呢？


    GPT的回答并不是非对即错那么极端，更多时候只是某些方面不符合我们的要求。这会把我们带向循环的下一步——完善问题，再次提问。


    ### 修订问题


    向GPT提问，我们通常很难一次就能获得想要的完美结果。多数情况下，我们会完善问题，再次提问。一般而言，可以从如下三个方面完善问题。在以下示例中，我们假设提问者是一个辅导小学生做作业的家长，想让GPT回答类似于“欧拉七桥问题”这样的数学问题。


    - 如果是问题本身有错漏，就补充更具体的信息。比如由于很难用文字描述欧拉七桥的图形，从而导致GPT给出错误的解答。如果是我们说错了，就修改后再次提问。

    - 如果是回答格式不符合预期，就补充输出要求：“请用小学六年级的学生能听懂的方式解题。”“请按`1.2.3.4.`列出解题步骤。”

    - 如果是问题解答有偏差，就对有偏差的点纠正追问。比如，有次实验时，我们发现GPT就欧拉七桥问题中某个点的连接线数量是偶数还是奇数出现计算错误，这时指出错误要求它重算即可。


    这里的完善问题、再次提问，既可以是完全重新提问，也可以就之前的回答进行追问。本书为了简化起见，举例时大多采用一问一答的形式。


    用文字描述欧拉七桥问题的图形是比较困难的。在撰写这段时，我试图让GPT用文字描述欧拉七桥问题，看看它能不能把数学问题描述清楚。最初，它总是给出关于历史、欧拉的故事等回答，这并非我真正想要的信息。这是因为我最初尝试的提问是“给出欧拉七桥问题的文字描述”。后来我又加上这样的提示：“说出岛屿和岸上的区域，分别给出名字，然后列出哪两个岛屿之间有桥连接。”但这个问题的答案仍然时好时坏。再加上如下这句后，我们每次都能得到期待的答案了：“请确保你的描述足够清晰，以便读者可以根据描述绘制出图形。”


    - 要用它达成何种目标？

    - 如何提出问题或提出要求？

    - 如何评价答案？如何进行后续调整？


    总之，从设定角色开始，我们与GPT的问答实际上是一个循环：提出问题、获得回答、进行评判、完善问题。在多次循环之后，我们通常能得到自己想要的理想回答。最终，我们做出判断、接受GPT给出的某个答案，结束提问的过程。


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83k030e54b6G601H0ccd7.jpg)


    图2-4 与GPT的问答循环


    在与GPT的交互中，我们需要关注以下3个关键点：要用它达成何种目标？如何提出问题或提出要求？如何评价答案以及进行后续调整？其中的微妙之处是，不要纠结自己的提问是不是好的，我们可以反复地修改自己的提问，直到拿到一个满意的回答。另外，在获得GPT提供的回答之后，我们通常仍然需要对之做进一步调整，才可实际应用。


    ### 通过迭代获得好答案


    我们很少一次就能获得好答案，通常是反复提问后才能获得好答案。


    当我们就一个问题向他人请教时，我们可能会止步于几次提问。但当我们向机器提问时，我们应该一直提问下去，直到得到预期的答案。


    向GPT提问的关键思维方式是迭代循环，即“提问—回答—评判—修改”，以接近最佳答案。我们可以看到，这个循环与精益创业的“认知—开发—测量”的迭代循环是类似的。


    ### 使用GPT需要注意的问题


    1. 它不了解最新信息。

    '
  trans: '

    ### Advanced Questioning Techniques: Combining with Other Tools


    When we ask GPT questions, the goal is to have it generate unique text that can
    be utilized by other software, tools, or APIs.


    We can have GPT generate unique text that other tools can recognize and adopt;
    furthermore, we can take this a step further. We can leverage GPT''s language
    and logical reasoning capabilities to string together the entire process of completing
    a task, at which point it becomes a central hub that listens to our instructions
    and calls other tools. In other words, it means using a large language model to
    connect various tools, giving it a goal, and letting it optimize and make decisions
    on its own. `Auto-GPT` is a typical example; it utilizes the capabilities of the
    `OpenAI GPT-4` language model while connecting various tools to automatically
    accomplish set goals.


    There is another advanced questioning technique that everyone can use immediately:
    multi-round processing of a single query. Unlike the "decompose tasks, ask step-by-step"
    technique in intermediate questioning, here we not only split the task into several
    steps but also perform multi-round complex operations—some done by GPT, some by
    us—ultimately completing a complex task through human-GPT collaboration. This
    is not a machine''s "solo act," but a pas de deux between human and machine.


    ### Advanced Questioning Techniques: Multi-Round Interaction for Complex Tasks


    Engaging in multi-round interaction with GPT, where some steps are completed by
    GPT and others by humans, with human-machine collaboration jointly completing
    a complex task.


    Many commercial AI products now follow this logic, performing multi-round processing
    behind the scenes for us. For clarity, let''s first illustrate with a simple example
    of editing an article. For instance, we have an article excerpt and ask GPT to
    help optimize the phrasing to make it easier to understand. Unlike the usual approach,
    we can proceed as follows (this may require some tool assistance but can also
    be attempted via multi-round dialogue).


    After sending the article to GPT, we can make the following requests step by step:


    1.  First, evaluate whether the phrasing is easy to understand and provide three
    possible directions for revision.

    2.  Second, for each suggestion, provide two revised versions: one minimizing
    changes to the original wording; the other allowing major revisions.

    3.  Then, request that the revised versions be stylistically optimized, for example,
    by emulating a particular writer''s style.

    4.  Finally, check the grammar, recommend synonyms for repeated words, and give
    the article a final polish.


    In the process of using GPT to edit the article above, we didn''t ask GPT to answer
    just one question, but many. If the tool we use provides such an interface, we
    might also need to adjust GPT''s calling parameters. For example, if we want to
    see if the revised version differs significantly from the original, we can change
    the temperature parameter in the calling parameters from the usual `0.7` to `1.0`,
    and we will see its expression become more diverse. Even though the same prompt
    is input, the results are very different each time.


    Figure 2-2 shows a more complex hypothetical case: we attempt to use GPT as the
    core of an AI travel consultant. First, a client asks the AI travel consultant
    to design a travel plan; GPT starts a dialogue with the client, inquiring about
    their needs in detail. Second, GPT analyzes the client''s needs and decides which
    tools to use. GPT generates text suitable for each tool, such as commands to call
    a database or an API. In Figure 2-2, we assume GPT will call an internal database
    to query proprietary plans, perform a web-wide search for the latest scenic spot
    info, call an external knowledge base (e.g., querying travel notes on Xiaohongshu),
    and call ticketing platform APIs to retrieve flight and hotel booking info. Then,
    after collecting all materials and information, GPT generates a draft of the required
    travel plan and submits it to the client for feedback. Finally, upon user confirmation,
    GPT generates the final travel plan and completes bookings for flights, hotels,
    and guide services.


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83fs30b54b6G601H06ffc.jpg)


    Figure 2-2 AI Travel Consultant: Using GPT to Design Travel Routes for Clients


    In this comprehensive usage example, we employ at least two advanced questioning
    techniques: combining with other tools and completing complex tasks through multi-round
    interaction. We can see that, on one hand, GPT plays a core role in multiple processes
    when completing such comprehensive tasks; on the other hand, the professional
    user of GPT is also crucial—it is the professional user who strings everything
    together, ultimately completing the task together with the machine.


    ### Customizing Your Own Tools Through Advanced Questioning


    The ability to customize one''s own tools is the standard that distinguishes experts
    from general users.


    Everyone''s phone and computer differ from others'', containing their own chosen
    software, shortcut settings, and personal preferences. When using GPT, we can
    similarly make many settings, even customizing our own unique usage methods. When
    we combine GPT with other tools, customize them according to our needs, and integrate
    them into our workflow, they unleash tremendous power.


    ## Section 3: The Flywheel Mindset for Questioning GPT


    We ask questions; AI gives answers. How can we use questioning to get the maximum
    help from AI? Here, we propose a, evaluate, refine the question, ask again, until
    a satisfactory answer is obtained. But before starting to ask directly, we notice
    there is a preliminary step—setting the role.


    In fact, when we don''t set any role, GPT uses a default setting; for example,
    the `ChatGPT` chatbot is set as a helpful assistant. If we access via the programming
    interface, we can explicitly see this default setting. Generally, we can assume
    that various GPT models have undergone alignment with human values during service
    provision; they are set as "`HHH Assistants`," the three "H"s standing for `Helpful`,
    `Honest`, and `Harmless`.


    Below are relevant prompt fragments for `ChatGPT`''s role setting (originally
    in English), obtained by asking it directly.


    ```

    ChatGPT 旨在通过提供的内容，生成类似人类语言的文本。它经过训练，利用各种数据，包括书籍、文章和网站，形成对人类语言的广泛理解。


    作为一个 AI 语言模型，它可以回答问题、参与讨论、提供解释并协助完成各种任务。但需要注意的是，它是人工智能，没有个人经历或情感。

    ```


    We can also see that `ChatGPT` has some settings regarding its own limitations
    and how we should use it.


    ```

    尽管我努力提供准确的最新信息，但是请记住我的知识都是 2021 年 9 月之前的。因此，我可能不了解该日期之后发生的最新事件或进展。


    在使用 ChatGPT 时，提出具体而明确的问题非常重要，这可以确保获得最佳回答。模糊或含糊不清的查询可能导致不准确或不完整的答案。


    在必要时，请务必对我提供的信息进行批判性评估，并与可靠的来源进行交叉参考。尽管我致力于提供帮助，但无法保证所生成信息的准确性或可靠性。

    ```


    In the prompt, we can also set GPT''s role according to our needs to enable it
    to answer better. Usually, we set the role to define its knowledge and capability
    scope and its way of answering. In early 2023, most materials teaching how to
    use `ChatGPT` were largely compilations of role-setting prompts. Here, we use
    an English teacher as an example to illustrate how to set a role.


    ```

    你是一个以英语为母语、又懂中文的英语老师。

    ```


    We can explicitly set its task so we don''t have to repeat the setting every conversation.


    ```

    你是一个以英语为母语、又懂中文的英语老师。当我输入一段英文时，请帮我修改为接近英语母语的表达方式。当我输入中文时，请帮我用英语重说一次，注意不是翻译。

    ```


    We can also set more specific rules, such as what level of English vocabulary
    to use, whether to use a business or academic writing style, etc.


    ```

    ……请选用易懂的英文单词，避免使用复杂的句式，使用场景是工作中的交流。

    ```


    Role setting is the foundation of questioning GPT. We can also understand it this
    way: role setting uses these words to specify GPT''s step, it''s GPT''s job, and
    we can rest. Not so. To get maximum benefit from GPT, we need to pay special attention
    to this step.


    When we ask, our prompt shouldn''t just contain the question; it should also include
    a key element: requirements for the generated result, also called output prompting.
    We will detail this in Chapter 3. Sometimes, output requirements are implicit
    in the question, e.g., "What is the Feynman Technique?" "Please rewrite this text
    into a 140-character Weibo post." More often, we explicitly state output requirements,
    e.g., "Write code for the above task in `Python`." "Give 10 options, numbered
    1.2.3." If we want GPT''s answer to be usable by other software, we also need
    format requirements, e.g., "Present in a `Markdown` table, and wrap the table
    in triple backticks (` ``` `)." Usually, if the answer format isn''t what we want,
    we immediately modify the output prompt in the question to see how the answer
    changes.


    ### Evaluating


    We ask; GPT answers. Is the answer good? Can we use it? Evaluating the answer
    is our responsibility. When using GPT, we easily fall into "two ends of the spectrum."
    One end: glancing at results, feeling amazed: "Wow, it really writes poems." "It
    really does math." "It really codes." The other end: denying it: "Huh? How did
    it get this math wrong?" "Why does the code use a non-existent interface?"


    GPT''s answers are usually not perfect; we must remember this when using GPT.
    This may be due to two reasons. First, our question isn''t accurate enough, or
    our questioning method is flawed. An interesting example: GPT sometimes gives
    correct but overly brief math answers, sometimes completely wrong. But if we add
    one sentence to the prompt, it might work wonders: "Let''s think step by step."
    Research analyzes that this sentence can increase GPT''s math accuracy by 61%.


    The second reason is GPT''s inherent limitations. We often see amazement at GPT''s
    abilities, but we must not ignore that it''s far from perfect: its answers are
    often too general; English-to-Chinese translations may completely miss the meaning;
    its info doesn''t withstand strict verification; it may even fabricate non-existent
    info.


    Whether to accept GPT''s answer is the questioner''s responsibility. We must ask
    ourselves: Am I satisfied with this answer? If not, why? If re-asking, how should
    I modify the question? An interesting trick: we can have GPT evaluate itself.
    You can follow up with:


    -   "Are you completely sure of this answer?" If wrong, it will immediately realize
    and give a corrected answer.

    -   "Please evaluate this answer yourself, give a score and reasons on a `0~10`
    scale." Its self-evaluation helps us analyze and judge its answer.


    Of course, we can also provide supplementary info and then ask it to self-evaluate
    and correct:


    -   (Previously asked to do a primary school math problem) Your calculation just
    now didn''t include the number of teachers.

    -   (Previously asked to analyze a business problem) Supplementary info is as
    follows: ... Are you now sure of your previous analysis?


    GPT''s answers aren''t extremely right or wrong; more often, just some aspects
    don''t meet our requirements. This leads us to the next step in the loop—refine
    the question, ask again.


    ### Refining the Question


    Asking GPT, we rarely get the perfect desired result in one go. In most cases,
    we refine the question and ask again. Generally, we can refine from three aspects.
    In the following examples, we assume the questioner is a parent tutoring a primary
    schooler, wanting GPT to answer a math problem like the "Seven Bridges of Königsberg".


    -   If the question itself has errors/omissions, add more specific info. E.g.,
    because it''s hard to describe the Königsberg bridges graph in text, leading to
    wrong answers. If we misspoke, correct and re-ask.

    -   If the answer format is unexpected, add output requirements: "Please solve
    in a way a 6th grader can understand." "Please list steps numbered `1.2.3.4.`"

    -   If the solution has deviations, correct the specific point. E.g., in an experiment,
    we found GPT miscalculated whether the number of connections at a node in the
    Königsberg problem was even or odd; pointing out the error and asking for recalculation
    sufficed.


    Refining and re-asking here can be a completely new question or a follow-up to
    the previous answer. For simplicity, this book mostly uses a Q&A format in examples.
    Describing the Königsberg bridges graph in text is difficult. When writing this
    section, I tried to have GPT describe the Königsberg problem in text to see if
    it could describe the math problem clearly. Initially, it always gave answers
    about history, Euler''s story, etc., not what I wanted. This was because my initial
    prompt was "Give a textual description of the Königsberg problem." Later I added:
    "Name the islands and land areas, then list which pairs have bridges connecting
    them." But the answer was still hit or miss. Adding this sentence made it work
    every time: "Please ensure your description is clear enough for a reader to draw
    the graph based on it."


    -   What goal to achieve with it?

    -   How to ask or make requests?

    -   How to evaluate answers? How to adjust subsequently?


    In short, starting from role setting, our Q&A with GPT is a loop: ask, get answer,
    evaluate, refine. After multiple loops, we usually get the ideal answer we want.
    Finally, we judge, accept an answer from GPT, and end the questioning process.


    ![](https://res.weread.qq.com/wrepub/CB_3300083703_4vdAI83k030e54b6G601H0ccd7.jpg)


    Figure 2-4 Q&A Loop with GPT


    In interacting with GPT, we need to focus on 3 key points: What goal to achieve?
    How to ask/request? How to evaluate and adjust? The subtlety is: don''t obsess
    over whether your question is good; we can repeatedly modify our question until
    we get a satisfactory answer. Also, after getting GPT''s answer, we usually still
    need further adjustments before practical application.


    ### Getting Good Answers Through Iteration


    We rarely get a good answer in one go; usually it takes repeated questioning.
    When asking a person, we might stop after a few questions. But when asking a machine,
    we should keep asking until we get the expected answer. The key mindset for questioning
    GPT is the iterative loop: "Ask—Answer—Evaluate—Modify," to approach the best
    answer. We can see this loop is similar to Lean Startup''s "Learn—Build—Measure"
    iterative loop.


    ### Issues to Note When Using GPT


    1.  It doesn''t know the latest information.

