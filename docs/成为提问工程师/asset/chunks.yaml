    一些进阶做法能让我们在提问时得到更好的解答。向GPT提问的进阶做法将是本书要讨论的重点内容，稍后的各个章节也会有更多讨论。在这里先试举数例。


    ## 进阶提问技巧：少样本提示


    **少样本提示**（`few shot prompt`）。例如，我们希望GPT能够帮我们判断，微信中发出某句话的人的情绪是正面、中性还是负面，我们可以预先给出几个例子，说明如何判断微信中的表情。在微信对话中，抿嘴笑脸的表情通常不应当被解读为正面情绪；龇牙笑脸通常为正面情绪；偷笑笑脸通常为中性情绪，而非负面情绪。当我们这样做了之后，GPT将能对微信聊天中的对话进行更好的情绪判断。


    在提示语中列出数个“问题—答案”样例，让GPT能从样例中学习并按照示例回答问题。


    这种在提示语中提供一些示例的做法称为`少样本提示`，与之对应的是`零样本提示`（`zero shot prompt`），即在提示语中没有任何示例。大量研究和实践都证明，即便模型之前并不了解这项任务，通过对上下文中的少量样本进行学习，它也能学会并完成类似任务。`少样本提示`能够大幅度提高GPT回答的准确性。


    `少样本提示`是最为常用的技巧之一。在提示语中，我们可以提供一个或数个示例，从而让GPT的回答能够非常好地遵从示例。例如，我们请GPT给出10个不常见的表示颜色的词语，我们可以先给出数个例子：“给出十个常见颜色词的替代词。比如天蓝色
    - azure，紫色 - violet。”GPT的确能根据示例信息理解我们的需求，并给出符合要求的回答：“白色 - ivory，红色 - crimson，绿色
    - emerald……”。


    ## 进阶提问技巧：调整提示语重复提问


    从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。


    调整提示语重复提问。就一个问题向GPT提问时，我们不是问一次或两次，而是需要变换方式问几十次。按我们人类交流的常识来看，反复问略有变化的同一问题会招致厌烦，但GPT不会感到厌烦。我们可以从各个角度调整提示语，包括但不限于更换词语或说法、优化表述、调整语句顺序等，让回答能够符合自己的期待。我们可以用各种方式向GPT问同一问题，直到获得令我们满意的答案为止。


    不少人认为，提示工程就是编写出一些提示语或收集一些提示语模板，让自己能够用这些提示语得到想要的答案。实际上，提示工程至少是指，我们可以像工程师一样工作，从各个角度调整提示语、反复试验，对比什么样的调整导致了什么样的结果变化，最终找到符合自己需求的提示语。通常，利用程序脚本和`API`，提示工程师会一次运行数量众多的略有变化的提示语，分析并确定哪个提示语可以让我们得到更好的答案。


    其实，每个人都可以在日常使用中通过“调整提示语，重复提问”这一技巧来更好地使用GPT。例如，为了撰写本书，我有时需要用较为通俗的语句来介绍各种技术，我会用到以下提示语来看看GPT的建议：“请用通俗的话重写。”我们可以反复尝试各种可能的提示语，看看它的回复发生了什么变化：“请用通俗易懂的中文重写”“请用通俗易懂的中文讲解”“请通俗易懂地讲解”“请通俗易懂地讲解，使之适用于忙碌的上班族/中学生，可举例”。


    在我做的若干实验中，我发现，给定一段关于深度学习的英文论文片段，“重写”和“讲解”这两种提示语会导向不同的回复。这很容易解释，“重写”会让GPT尽量跟随原文，而“讲解”会让它更为自由。“可举例”是提示它在解读原文之后，用案例再讲解一遍。“忙碌的上班族”和“中学生”虽然都是提示它做到尽量通俗，但“中学生”的提示效果优于前者，得到的回答更易于普通人理解，示例更通俗易懂。但更进一步改为“小学生”后，我发现就所选的论文片段而言，GPT无法举出它认为合适的例子，这反而让知识讲解变得不清晰了。从这些例子中可以看出，调整提示语和反复地提问，能够帮我们获得更好的结果。


    ## 进阶提问技巧：拆解任务，分步提问


    我们并不是试图用一次问答让GPT完成任务，而是自己预先拆分步骤、分次提问，让GPT一次完成一项任务，最终获得想要的结果。


    拆解任务，分步提问。接着上面的例子，我们再来说一个关于进阶技巧的例子。例如，我现在要处理的是一段英文论文的片段，目的是对其进行通俗的解读。我把GPT的处理过程分成了两个步骤：第一步，让它严格地进行英译中翻译；第二步，让它按照某种要求重写。


    我的做法是拆解任务，分步提问，以获得最终想要的结果。这种做法并不是试图用一次问答让GPT完成任务，而是自己预先拆分步骤、分次提问，让GPT一次只完成一项特定任务。


    当然，采用聊天机器人问答这种形式来完成这项任务时，我们可以介入其中，调整中间结果，从而让最终结果变得更好。我们可以调整它给出的翻译表述，然后将调整过的翻译作为下一步任务的输入内容。到了最后一步，如果要采用它的结果，我们通常还需要将文本与原文进行比对，确保内容无错漏，如有必要则还要进行一些调整。


    虽然现在人们对GPT的期待值非常高，但是在工作场景中进行实际应用时，我们会发现它很难通过一问一答就直接给到我们想要的结果。除非使用者对结果的好坏并不在意，否则GPT基本不可能一次就达到目标，我们总是在重复提问、多次提问中逐渐得到想要的回答。拆解任务，分步提问是我们用好它的技巧之一。


    ## 进阶提问能激发GPT的隐藏能力


    像所有的工具一样，GPT也要掌握使用方法，才能发挥其能力。


    进阶地提问就好像是沿着GPT的原理与设计，找到面板上的某个开关，释放出它的隐藏能力。


    收集有效的提示语，撰写详尽的、结构化的提示语，进行少样本提问，反复调整提示语并测试结果以及拆解任务、分步提问都是常见的进阶提问技巧。


    # 高阶地提问


    要想最大限度地使用好GPT，我们还要运用不少高阶技巧。目前，大多数人还很难直接运用这些高阶技巧，但随着越来越多的开发者努力工作，各种各样的由GPT支持的工具会不断出现，每个人都能从中获益。


    ## 高阶提问技巧：外挂知识库


    目前为GPT外挂一个知识库的通常做法是将知识库资料进行名为嵌入的向量化处理。之后，当用户提问时，将用户的问题在知识库中进行语义匹配以检索出相关的资料，然后将用户的问题和资料一起提交给GPT。


    之前我们讲到，在提问时我们应提供尽量多的背景信息，以便GPT能更好地理解问题。那么，我们能否把数百万字的法律文献给它，然后以此为背景信息来进行提问呢？我们能否把自己企业的所有产品资料都给它，然后进行提问呢？


    对于大多数用户来说，目前还很难做到。但不少程序员已经用上了这样的高阶提问方式：程序员在使用一项编程技术时，通常需要查阅对应的技术文档。他们在提问之前做了一些前期准备工作，对数千页的文档进行处理，然后每次提问时都让GPT先参阅文档再进行回答，这相当于给GPT外挂了一个知识库。我们还可以想办法让回答的关键部分与知识库的内容保持高度一致，这也能部分解决“GPT能够解释，但难以准确引用”的问题。


    以上做法的实现主要是采用嵌入的方式将大量文档转换为大语言模型能够处理的向量形式（也可称为向量化），并将之存入向量数据库。当我们想提出一个问题时，首先将按同样方式嵌入的问题和向量库中的资料进行语义匹配，检索出可能与问题相关的文本片段，然后将这些文本片段作为提问的背景信息提供给GPT，让它根据资料进行回答。


    当我们直接使用GPT聊天机器人时，发给GPT模型的提示语通常就是一句话或几句话，但使用这种高阶方式时，我们发给模型的提示语可能包含了数千字。随着各类大语言模型开始提供更大的上下文窗口，我们可以一次性给出更多的文本，例如`GPT-4`最多可以接收包含3.2万个标记符（`Token`）的上下文，而2023年5月Athropic的`Claude`聊天机器人新版则提供了最多10万个标记符的上下文窗口，这意味着我们可以将一整本教科书资料一次性提供给模型作为背景材料。


    现在，业内已经推出了一些能与资料聊天的应用：与PDF聊天，我们可以上传一份文档，然后向它提问；与一本书聊天，读书软件会采用类似的方式让我们可以就这本书的内容与之对话；与自己的笔记聊天，我们可以在笔记软件中提问，每次提问时软件会检索出相关笔记作为上下文；与公司财报对话，我们可以就一家上市公司的财报进行提问。可以预见，在不久的将来，提供易用的界面让用户可以与文档对话将是一个重要的应用类型，它让我们能更好地从资料中获取信息。


    当然，检索出相关资料的过程并不像这里介绍的这么简单，研究者还在想各种办法以改善效果。举例来说，现在主要的大语言模型之一`GPT-3.5`的上下文仅有4096个标记符，问题本身和回答还要占掉一定数量，我们能够提供的附加资料最多也就是2000～3000个英文单词或汉字。如何对原始资料进行有效的切片，每次匹配出最相关的片段，需要根据实际情况进行反复考量和试验。如果切片过大，那么每次仅能包含少量资料，而其他与之相关的资料可能就被忽略了。如果切片过小，又可能导致失去资料本身的逻辑性，使得每次所附的资料仅是零散的碎片。


    又比如，虽然在高维向量空间对内容进行语义匹配被证明是一种有效的方式，但是，还有没有更好的方式能进一步提升匹配效果呢？目前，卡内基梅隆大学、滑铁卢大学的研究者提出的方法“假设性文档嵌入”（`Hypothetical
    Document Embeddings`，`HyDE`）被越来越多的人采用。我们仅凭用户的提问很难在资料库中匹配到相关的资料，这可能是问题（提问）和答案（资料库中的相关资料）在文字表达上没什么相关性导致的。要想进一步改善，我们可以这么做：将问题先抛给GPT，让它给出“假设性回答”。然后，我们用这个“假设性回答”去匹配资料，这时从资料库中匹配出相关资料的概率要大大高于仅用原问题去匹配。


    目前，语言模型相关的两个热门的软件库`LangChain`和`LlamaIndex`都直接支持了这种巧思，开发者可以方便地使用这个方法。另外，如何更好地进行索引、提供更好的向量数据库是当前GPT应用技术发展的热点。


    你或许会觉得，这些与技术开发相关的任务交给技术工程师们去完成就好了。的确，他们的努力很快会使其变成易用的产品。但是，了解这些技术的实现原理将有助于我们更好地选择适合自己的产品。我们也可以知道为什么有时候这些针对资料库进行的回答似乎并不全面，导致这种不足的原因是其背后的做法存在局限。让一个技术产品为我们所用的最好方式是了解它的原理，知道它的局限，然后最大化地发挥它的长处。


    在使用GPT时，人们常常会冒出很多有趣的想法：


    - “它能够先搜索再回答吗？”OpenAI的聊天机器人`ChatGPT`已经配置了可以上网的插件，而微软必应、谷歌、百度的聊天机器人本来就是搜索功能与大语言模型功能的综合体。

    - “它能够听懂语音，然后用语音回答吗？”现在已经有不少基于GPT的工具可以做到这一点，实际上它们所做的是，用语音识别记下我们的问题，将问题发给GPT回答，然后将文本转换成语音，播放给用户听。

    - “它能够绘制思维导图/做PPT吗？能够进行AI绘图吗？”其实也可以，我们提出要求，让GPT生成思维导图的文本，然后将文本导入相应的思维导图软件就可以了。类似的，我们提出要求，让GPT生成适用于`Stable
    Diffusion`的提示语。

    - “它可以订机票/订酒店吗？”可以，我们还可以向它发出指令，让其调用旅行网站的接口查询票价、征询我们的意见、执行订票/订酒店操作等。


    以上这些问题实际上都要用到向GPT提问的高阶技巧，即将它的语言生成能力与其他的一个或数个工具结合起来，从而完成一项完整的任务。这些任务可能具有一定专业性，需要专业的工程师来协助执行，但我们可以通过将GPT与其他工具联合起来一起使用来完成这样的专业任务。


    当我们使用这些提问技巧向GPT提问时，提问方式已经发生了一个微妙的变化：我们不再像之前一样要求它生成一个我们可以看得懂的回答，而是在要求它生成一个其他的软件、工具、`API`可以“看”得懂的回答，然后这个回答将被输入到其他软件、工具、`API`中，生成想要的结果。


    因此，这个高阶技巧需要与其他工具联合使用，它的目的是让大语言模型生成其他工具能“看”得懂的文本。实际上，用GPT进行编程就是这么做的。2023年3月，在`GPT-4`发布会上，演示者拍摄了一张手绘的网站草图给具有图像模态能力的`GPT-4`，它生成了一个前端网站相关的代码，然后演示者将代码复制到相应的网站工具中运行，一个网站便由此生成。

