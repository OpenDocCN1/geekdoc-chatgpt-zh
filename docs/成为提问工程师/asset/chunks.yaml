    \  | ID：EPUB\\_20260428160408 \n\n## 第二节　与GPT共舞的生存技能：辨别力与鉴赏力\n\n现今，互联网上充斥着各种各样的观点，辨别力就显得尤其重要了。网上的一些内容看似出自专家之口，但实际上可能完全是其他人的胡诌。比如，有个高中生在维基百科上编写了上百万字的俄罗斯“历史”，但这些内容是她自己“创作”的，属于虚构小说，而维基百科却将其当作了事实。而这竟然在十多年后才被人发现。\n\
    \n现在，越来越多的人开始使用GPT等人工智能工具，此时我们会发现，辨别力已成为我们的生存技能。缺乏辨别能力不仅会让我们轻易被社交网络上的信息误导，还容易被GPT生成的有错误的内容误导。\n\
    \n我们在使用GPT时遇到的第一个挑战是：它给出的看似正确的信息真的是可信的吗？我们在使用这类工具时，需要不断地自问：它有没有胡编乱造？\n\n例如，当它煞有介事地给你一段马尔克斯风格的文字，并注明来自哪本小说的哪一页，你可能就相信了。但实际上，这很有可能是它编造的。虽然GPT并不是每次都错得那么离谱，但错误的概率始终是存在的。又比如，当我们提出更加严格的要求时（请它给出作品英文翻译版的详细出处），它给出的引文的确与原书差不多，但我们仍须仔细辨别，因为有时我们还会发现其中有它自己生成的内容。\n\
    \n总的来说，但凡是可以模糊表述的，都可能遇到类似的挑战。它几乎不可能实现准确地引用。即便我们给了参考材料，它所进行的总结也可能与参考材料不完全一致。我尝试将德鲁克的《认识管理》的第一章内容提供给GPT，问它德鲁克在书中对管理者工作的五个基本方面的阐述，发现它的回复与原书还是略有差别的。\n\
    \n当然，模糊性本来就是人类的特点，我们很难一字不差地复述某段话。这么看来，GPT在这方面和人类很像。GPT的学习原理（通过大量文本进行学习，用神经网络的参数权重压缩表示自己所学到的）、生成原理（根据概率和参数权重生成回应内容）也决定了它的回答有着与人类相似的模糊性。\n\
    \n我们使用GPT遇到的第二个挑战是：它给出的回答是正确的吗？不一定，所以我们一定要自行验证一下。\n\n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)\"\
