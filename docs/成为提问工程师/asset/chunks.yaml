    quarterly summaries, and annual summaries are the most common tasks. We can instruct
    AI tools to write weekly reports for us. Simply by clearly stating our job responsibilities,
    work completed this week, achievements, and shortcomings, AI tools can write a
    weekly report with clear logic and complete structure.


