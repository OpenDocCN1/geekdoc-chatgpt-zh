    \  | ID：EPUB\\_20260428160408 \n\n# 第一章　理解GPT\n\n答案终止想象，提问驱动思考。\n\n2022年11月30日，OpenAI公司通过一篇博客向大众推出了名为ChatGPT的AI聊天机器人。人们登录OpenAI官网，向ChatGPT提出问题，就能获得答案。OpenAI公司这样介绍自己的新产品：“我们训练了一个名为ChatGPT的AI模型，你可以通过对话的方式与它交互，它能够回答后续的问题、修正之前回答中的错误、质疑不正确的前提条件以及拒绝不当的请求。”介绍中所说的AI模型指的是采用深度学习技术的人工神经网络，OpenAI公司称之为GPT。\n\
    \nChatGPT聊天机器人一经推出，立刻成为互联网用户追捧的热门产品。2022年12月5日，OpenAI公司创始人山姆·奥特曼(Sam Altman)发布了一条推特(Twitter)：“今天，ChatGPT的用户数量超过了100万。”OpenAI的早期投资者、联合创始人之一埃隆·马斯克(Elon\
    \ Musk)在这条推特下面提问：“生成每条聊天的平均成本是多少？”奥特曼回答：“生成每条聊天的成本大约是几美分。我们还在想办法更精确地计算和优化生成聊天的成本。”\n\
    \n此时，人们已经注意到ChatGPT是一个令人惊讶的产品：它是有史以来达到百万用户用时最短的互联网产品，创造了5天达到百万用户的全新纪录。此前，极具“病毒传播效应”的图片社交应用照片墙(Instagram)达到百万用户规模耗时2.5个月，脸书(Facebook)耗时10个月，推特(Twitter)耗时2年（如图1-1所示）。此后，ChatGPT的发展更是势不可挡。上线2个月后，即2023年2月1日，各大媒体纷纷引述数据并进行分析报道：“2023年1月，ChatGPT的月活跃用户数达到了1亿，再次创造了纪录。”\n\
    \n[EPUB...](https://t.me/+WwC4dCWvXRdhOTNh)om/wrepub/CB\\_3300083703\\_4vdAI83H630d54b6G601Hfc34e.jpg\"\
    \ style=\"width:100%;\"/> \n\n图1-1 各大互联网产品达到百万用户的时间\n\nChatGPT为何能够快速地吸引如此多的用户呢？它为何能够引发新一轮AI浪潮？人们为何认为它将引爆全新的互联网变革与知识变革？\n\
    \n使用新的AI工具的人已经深刻感受到，这一轮AI浪潮与之前的不太一样。2016年，谷歌公司的围棋AI程序阿尔法狗(AlphaGo)战胜了人类围棋世界冠军。虽然人们惊叹于AI能够进行如此复杂的思考，但是这项技术并没有马上变成每个人可用的产品。而这一次ChatGPT引发的AI浪潮中，各种各样的AI模型和产品“喷涌”而出，在搜索引擎、办公软件、在线教育平台等日常应用中，我们随处都可以直接体验到AI提供的新功能。\n\
    \n面对新浪潮，我们关心的不再只是过去那种过于宏大的问题。比如，如果机器会思考，人类的命运将会如何发展？现在，我们所关心的问题还与自身紧密相关：别人在用这些新推出的AI工具做什么？我们如何快速掌握和熟练运用这些新技术？一些危言耸听的媒体报道甚至让人们陷入对未来的担忧：我会被AI取代吗？其实，你不会被AI取代，而会被熟练运用AI的人取代。\n\
    \n本书试图回答一个非常具体的问题：在快速了解这一轮生成式AI新技术的原理、能力以及局限性之后，我们如何掌握这些必备的新技能？如何向AI提问才能得到自己想要的答案？\n\
