  fmt: '

    # 当前AI能力的边界与局限


    值得注意的是，目前这种转化为聊天机器人或应用助理的能力只是大语言模型能力的一小部分，很多专业的应用仍然需要通过应用程序接口（`Application Programming
    Interface`，`API`）直接调用模型能力，进行多轮复杂的操作，甚至可能需要有人工参与才能完成任务。


    举一个例子，如果我们要将一本书由中文翻译成英文，首先需要将书拆成模型能够处理的多个片段，其次要附上词汇表所用的模型，才能进行翻译，最后可能还要多次调用其他模型，对内容进行语法检查和语言润色等。


    当我们尝试使用各种AI聊天机器人或助理功能，特别是把它们应用在自己的工作中时，也会发现它们有一些不足之处。比如，有人会把`ChatGPT`当作搜索引擎用，查询最新的信息，但很快就会发现它并不知道最新的信息，它所知道的信息截止于某个时间。更糟糕的是，有时它会给出完全错误的信息，而且是用非常“自信”的方式来表达这些信息。它甚至还会凭空编造一些信息，就像有人喝醉酒后胡言乱语一样，可是它给出的回答又极有条理，让人难以辨别。我们如果轻信这些信息并加以使用，就会造成很多麻烦。后面的章节会专门讨论这个话题。但总的来说，如果能够聪明地避开它们的缺点，用其所长，这些AI工具就可以在很多方面提供帮助。


    # 第二节　GPT拥有什么能力？为何拥有这些能力？


    尝试使用各种基于`GPT`模型的新AI工具后，我们会发现它们拥有各种让人惊奇的能力，比如写作、编程、逻辑推理等。我们很容易产生一些疑问：`GPT`究竟拥有什么能力？它为何拥有这些能力？我们越想用好它，就越有必要弄清这些问题。


    `GPT`拥有一定的能力与专业知识，但不擅长处理信息、易产生“幻觉”。


    ## GPT的能力


    一般来说，我们可以认为经过训练的`GPT`模型拥有以下这几种能力：


    - **语言理解能力**：它能够理解用人类自然语言提出的要求和提供的信息；

    - **文本生成能力**：它能够根据我们的需要生成文本，比如续写文章、撰写摘要、回答问题；

    - **逻辑推理能力**：它能够进行演绎、归纳等推理操作；

    - **数学能力**：它能够理解数学原理、数学公式，并解答数学问题；

    - **多语言能力**：它不仅掌握了多种语言，而且能够在多种语言之间进行翻译；

    - **编程能力**：它能够理解用编程语言撰写的代码，而且能够按我们的要求编写新代码。


    简言之，它不仅拥有语言、数学、推理能力，而且掌握一些专业领域的知识。我们通过提问的方式来调用它的这些能力与知识。


    同时，我们也都已经意识到，`GPT`的能力有其独特的局限性。它似乎并不拥有一些我们本以为作为一种计算机系统必然拥有的能力。具体来说就是，当我们搜索时，计算机系统会进行检索并给出数据库中或互联网上已存储的信息，但是，想要让`GPT`不加改动地给出一句引文却不是一件容易的事。它似乎知道这句话，但并不能给出精确的引文。这还不是最糟的，更糟的情况是，它可能给出的是自己编造的引文，这就是生成式AI模型的“幻觉”（`hallucination`）问题。为了让对话进行下去，它产生了“幻觉”，然后给出了虚假的、自己编造的回答。


    回到最初，`GPT`模型所做的实际上是“文本补全”的工作，即根据前面给出的话，补全后面的话——通俗地说就是，我们说一个开头，它接着把这些话说下去。再往前追溯就是`Transformer`架构，其最初用于机器翻译，将一种语言转换为另一种语言，即根据源语言的语义和目标语言的词汇概率补全句子的下一个词。后来，这个架构逐渐用于完成更一般性的生成任务，比如续写文章。


    那么，`GPT`模型又是怎么知道后面应该补全什么内容呢？它实际上是一个“内容词预测器”软件，它所做的是根据前面的词和概率预测下一个词。它一个词、一个词地补全下去，就“写”出了给我们的回答。


    那么，接下来的问题是，`GPT`模型又是怎么预测下一个词的呢？简单地说就是，它“看”了极其多的文本资料；通俗地说就是，研究人员用巨量的文本训练了这个模型。它可以根据前面的词，计算出后面的词出现的概率，然后把概率最高的词作为下一个词。对此，史蒂芬·沃尔弗拉姆（`Stephen
    Wolfram`）举例说，根据前面一段话，模型预测后面的5个单词依次是（按概率排序）：`learn`、`predict`、`make`、`understand`、`do`。那么，`GPT`模型就会把`learn`作为下一个词。之后，它又接着预测下一个词。


    实际上，我们可以通过调整“温度”（`temperature`）指标来调整选择下一个词的概率。所谓的“温度”指的是体现随机性的指标，“温度”越低，随机性越低。模型总是选择概率最高的词，这时，你可能会觉得它比较“古板”；“温度”提高，随机性增高，模型会在一组词中随机选择下一词，从而每次产生的结果会有很大的差异，这时，你又会觉得它比较有创意。


    接下来的问题是，`GPT`模型如何判断下一个单词出现的概率是多少呢？多层人工神经网络中的参数或权重（`parameters/weight`）决定了下一个词出现的概率，这些参数是通过用超大数量的文本对人工神经网络进行训练而调整到位的。这也是`GPT`中“P”的含义——对人工神经网络进行预训练（`pre-trained`），让它掌握预测下一个词所需要的参数。`GPT-3.5`拥有1750亿个参数。


    随着训练所用的文本资料和参数数量的增加，`GPT`模型预测下一个词的核心能力越来越强。它似乎也有了语言能力、掌握了知识、学会了推理，这颇有点像人类的成长，当孩子逐渐学会了说话之后，他学习了知识，后来又能够进行推理了。`GPT`模型的演进方式是：当加大训练的文本数量后，它的知识与能力会得到大幅度提升。那么，怎么让它的能力为我们所用呢？至此，本书的主角——提示语（`prompt`）的重要性一下子就凸显出来了。


    一般来说，我们会给`GPT`一段提示语（如一段需要翻译的文字、一段需要续写的文字、一段需要它总结的长文），然后让它根据我们的提示语补全下去。不过，既然它已经拥有了语言能力、推理能力、生成能力，那么我们何不将提示语转变为提问（请回答……）或转变为命令（请帮我做……）呢？


    我们将向`GPT`模型输入的请求称为提示语，它是使用`GPT`模型所拥有的知识与能力的接口。如图1-2所示，我们可以通过在搜索引擎上搜索关键词来获取和使用海量的信息（如谷歌和百度所做的）和服务（如亚马逊、淘宝、美团所做的）。现在，我们可以通过提示语来使用AI模型所掌握的知识与能力。


    ![图1-2 “提示语”是使用AI模型知识与能力的接口](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83LE30i54b6G601H37790.jpg)


    很多人是在应用`ChatGPT`等生成式AI产品时，才第一次注意到`prompt`这个词。它的中文释义之一是为防止演员忘词而准备的提示词。在2007年出版的《提问指南》（`Make
    Questions Work`）一书中，作者用`prompt`一词来表示用以获取想要的回答或更多信息的进一步的问题。现在，`prompt`有了新的含义：在使用各种生成式AI模型时，为了引导它给出理想的回答而给出的提示语。


    目前，我们通常会向两种生成式AI模型输入提示语。一种是`GPT`等大语言模型，让它们根据提示语回答问题或响应请求；另一种是由文本生成图像的绘图模型，如`OpenAI`的`DALL-E`、`Stability`公司的静态扩散（`Stable
    Diffusion`）开源模型、`Midjourney`图片制作软件等。对于后者，由于提示语的微妙变化会带来图片的巨大变化，因此有人也把提示语戏称为“咒语”，把根据提示语绘图说成是“用咒语吟诵出魔法般的画作”。


    下面让我们聚焦于使用`GPT`等大语言模型时用到的提示语。提示语几乎是调用`GPT`等大语言模型的知识与能力的唯一途径。下面我尽量用通俗的方式解释其实现原理。


    如前所述，大语言模型实际上是一个经过训练的概率模型，它所做的事情可以看成是预测下一个词。它一个词接一个词地预测，从而组成完整的句子、段落或文章。如果它要完成的是翻译任务，那么下一个词的概率预测是较为简单的，与原文进行对照翻译即可。但是，如果它要完成的是生成型的任务，比如让它续写一段话，或者让它回答我们的提问，下一个词的概率预测难度就大大增加了。


    提示语的作用是引导模型更好地计算出下一个词。沈国阳曾经在一篇文章中对提示语的本质做了很好的阐述：“调整和优化文章中前m个元素的值，这些元素通常包括任务描述、上下文信息等，使大语言模型能在给定任务的场景下生成概率更高、更符合预期的结果。”


    提示语实际上是我们写了一个文本模式，然后让`GPT`按照当前模式写下去，这就是为什么我们写的话会对它产生微妙的影响。我们写得很随意，它就很随意；我们写得很正式，它就回答得很正式。简言之，如果我们给出合适的提示语，包括明确的动作指令（如写一篇文章）、恰当的参考内容（如关于春天的）等，模型将能更好地决定下一个词，从而最终生成符合我们预期的回答。


    实际上，我们可以通过提示语将通用的大语言模型转化为聊天机器人，谷歌`Deepmind`[³](#fn3)


    ## 用提示语激发AI的潜能


    提示语是调用`GPT`知识与能力的接口。我们通过向`GPT`输入提示语、激发并调用`GPT`经过预训练和微调的知识与能力，来让AI回答我们的提问、完成我们的请求。


    实际上，`OpenAI`对`GPT`的数次版本迭代在某种程度上也均与提示语有关。


    - `GPT-1`论文的标题是《通过生成式预训练提升语言理解能力》（`Improving Language Understanding by Generative
    Pre-Training`），文中提出了通过预训练转换器实现语言理解和文本生成的方法。

    - `GPT-2`论文的标题是《语言模型是无监督的多任务学习器》（`Language Models Are Unsupervised Multitask Learners`），文中明确引入了用提示语调动模型能力的方法。

    - `GPT-3`论文的标题是《双向语言模型是少样本学习器》（`Bidirectional Language Models Are Also Few-shot
    Learners`），所谓少样本是指我们可以在提示语中加入少量样本范例，以引导模型更准确地回答类似问题（稍后我们会专门举例说明少样本的做法）。

    - `InstructGPT`（相当于`GPT-3.5`，也是`ChatGPT`采用的主要模型）的论文标题是《训练语言模型以遵从人类指令》（`Training
    Language Models to Follow Instructions with Human Feedback`），其中用来训练的指令可以看成是提示语与人类认为的理想结果的组合。


    由此可以看到，每一次的技术迭代都是为了让模型能够更好地响应提示语，给出回答。


    简言之，好的提示语对应着好的结果；糟糕的提示语对应着糟糕的结果；错误的提示语对应着错误的结果。学会向`GPT`提问，就是学会输入有效的提示语。


    下面我们从另一个角度来解析一下提示语与模型的关系。现在我们使用的大语言模型都是在预训练的基础上，经过指令微调（`instruction fine-tune`）的方式优化过的模型，这能让模型更好地理解和回答与指令相关的问题。`Facebook`的母公司`Meta`提供了一个开源的大语言模型`LLaMA`（羊驼）。2023年初，斯坦福大学团队在其基础上做出改进，制作出了模型`Alpaca`（小羊驼），据称其效果接近于`ChatGPT`。


    `Alpaca`针对图1-3所示的各种指令任务进行了优化。下面就来看看这些指令任务具体是什么？


    ![图1-3 指令动词与具体内容](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83PM30c54b6G601Ha029f.jpg)


    图1-3中的内圈是关于指令的动词，外圈是相关指令的具体内容。比如，内圈的一个指令动词是创建（`create`），而与之对应的外圈内容是故事（`story`）、句子（`sentence`）、诗歌（`poem`）、列表（`list`）。也就是说，它被训练来创作一个故事、写一个句子、写一首诗歌、创建一个列表。


    又比如，内圈的另一个指令动词是描述（`describe`），与外圈对应的内容结合起来则是：描述过程、描述差别、描述影响、描述收益。


    我们可以这么理解：首先，这些模型经过大量的学习（即预训练），掌握了基本的知识与能力；其次，它们可能会针对专业领域的内容进行再训练（比如，`OpenAI`就曾经用代码训练模型，使其具有编程能力）；最后，会根据相关指令对它们进行微调训练，以使其能够更好地完成与这些指令相关的任务。


    因此，表面上我们与之交互的是一个聊天机器人或软件助理，其实在幕后发挥作用的则是一个个经过训练的模型。它们经过训练后，具备了通用能力、各领域专业能力以及完成特定任务的能力。当我们向它们提出要求时，它们能够运用自己的这些能力来回应我们。我们使用这些能力靠的就是有效的提示语。


    ## 结构化提示语：ICDO——我明白了，马上执行！


    要使用AI模型的知识与能力，我们需要输入有效的提示语。截至目前，我们得到的经验是：应该向AI输入结构化的提示语。这里，我们将结构化的提示语命名为“`ICDO`”。我们可以这么理解，当我们向AI输入提示语后，AI会给出回应：“I
    see, do!（我明白了，马上执行！）”


    向`GPT`提问的方式是：我们输入提示语，它输出回答。当然，提示语并不只是“你帮我翻译这句话”“你帮我整理会议记录”这么简单。我们需要对它的组成要素进行深度拆解，从而掌握提出优秀问题的技能，以获得高质量的回答。通常来讲，提示语可拆解为以下四个部分：指令、上下文、输入数据、输出要求。“`ICDO`”是结构化提示语四个组成部分的英文首字母：指令（`instruction`）、上下文（`context`）、输入数据（`input
    data`）、输出要求（`output indicator`）（如图1-4所示）。它由埃尔维斯·萨拉维亚（`Elvis Saravia`）等人总结而来，我们在此基础上做了以下两项优化：将它命名为“`ICDO`”以及将它进一步结构化。埃尔维斯等人总结的“`ICDO`”原本是为用编程接口访问`GPT`的程序员准备的，但现在它也适用于所有想要高效使用AI的人。


    ![图1-4 结构化提示语“ICDO”框架](Text/https:/res.weread.qq.com/wrepub/CB_3300083703_4vdAI83PM30e54b6G601H55acc.jpg)


    我们向`GPT`输入的提示语通常由以下四个部分组成，通常情况下，我们应按照如下的顺序输入，这里列举并解读一个简单的示例。


    ### 指令（`instruction`）

    你想让`GPT`执行的特定任务。


    > 你的任务是将中文翻译成英文。


    ### 上下文（`context`）

    额外的上下文或背景信息，以引导`GPT`更好地做出响应。


    > 请按此词汇表将这些专有名词进行翻译。


    ### 输入数据（`input data`）

    用户实际输入的内容。


    > 需要翻译的句子是：天空是蓝色的。


    ### 输出要求（`output indicator`）

    指定输出的类型、格式等。


    > 译文是：The sky is blue.


    我们应该按照以上四个部分的顺序来组织自己的提示语。如果将`GPT`看作一个人，那么我们在给它布置一个任务时与我们请一个人帮忙完成任务时的交互方式是一样的：首先说明任务，给出背景信息，然后提供任务的具体信息，最后提出对于结果的明确要求。


    `GPT`也像人一样，越靠后的信息它记得越清楚。如果你先给出具体任务，再说明背景信息，它可能会混淆具体任务与背景信息。我们提问的目的是要得到结果，因此对于结果的要求应放在最后。同时，有一个被一再验证有效的向`GPT`提问的技巧是，在提示语的开头描述指令（你的任务是将中文翻译成英文），最后再以某种方式重复指令（翻译是：）；这会让`GPT`更容易清晰地理解和执行我们的要求。


    使用`GPT`一段时间后，你可能会发现，有一个使用障碍是记不住顺序。但将它缩写为“`ICDO`”之后，我们再也不用为此发愁了。每个人都可以按照这样的结构化提示语来进行提问，获得更理想的回答。


    当然，在实践中我们可能已经注意到，并不是每次提问都要包含这四大要素，有时可以酌情省略。这一点也跟我们人类之间的交流相似，有些话无须赘述。


    要想让`GPT`高效发挥它的能力，我们往往要编写更复杂的提示语。这时，结构化提示语“`ICDO`”就是我们编写提示语的框架。这里先举一个例子，让大家能有更直观的理解。比如，我们要求`GPT`按照村上春树的风格改写一段话，提示语如下所示。可以看到，我们给出了任务（请它改写文章）、上下文（参考范文）、输入数据（要改写的段落）、输出要求（请它改成写三个版本）。


    ```

    你是一个写作风格大师，你的任务是用作家村上春树的风格改写文章。请不要在改写后的文章中增添任何新信息。


    这里给你一段村上春树的散文，作为风格参考范文：我可以准确地说出下决心写小说的时刻，那是一九七八年四月一日下午一点半前后。那一天，在神宫球场的外场观众席上，我一个人一边喝着啤酒，一边观看棒球比赛。……球棒准确地击中了速球，清脆的声音响彻球场。希尔顿迅速跑过一垒，轻而易举地到达二垒。而我下决心道：“对啦，写篇小说试试。”便是在这个瞬间。在那一刻，似乎有什么东西静静地从天空飘然落下，我明白无误地接受了它。


    你要改写的段落是：AI出现之后，我们可以用它帮助写作。我们不再需要坐在桌前拿着纸和笔奋笔疾书。现在，我们打开聊天机器人，跟它对话，有时候我提问、它回答，有时候它提问、我回答，有时它开始思维发散……在与机器人的交谈中，我们的想法渐渐“流淌”出来。


    仅参考范文风格，不使用范文的内容。请保持改写后的段落与原文长度相当。请给出三个改写版本，格式如下：1. 2. 3.。请你用村上春树的风格改写以上段落。

    ```

