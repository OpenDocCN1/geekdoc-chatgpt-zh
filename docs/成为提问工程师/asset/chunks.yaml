  trans: '


    # Current AI Capabilities: Boundaries and Limitations


    It is worth noting that the current ability to transform into chatbots or application
    assistants is only a small part of the capabilities of Large Language Models (LLMs).
    Many professional applications still require calling model capabilities directly
    via **Application Programming Interfaces (`API`)** to perform complex multi-round
    operations, and may even require human involvement to complete tasks.


    Take an example: if we want to translate a book from Chinese to English, we first
    need to split the book into multiple segments processable by the model. Secondly,
    we need to provide the model with the glossary to be used for translation. Finally,
    we may need to call other models multiple times for grammar checks and language
    polishing.


    When we try to use various AI chatbots or assistant functions, especially applying
    them to our own work, we also discover their shortcomings. For instance, some
    people use `ChatGPT` as a search engine to query the latest information, but soon
    find it doesn''t know the latest information; its knowledge cuts off at a certain
    point in time. Worse still, it sometimes gives completely wrong information, expressed
    in a very "confident" manner. It even fabricates information out of thin air,
    like someone talking nonsense after getting drunk, yet its answers are extremely
    coherent, making it hard to discern. If we blindly trust and use this information,
    it will cause a lot of trouble. Later chapters will discuss this topic specifically.
    But generally speaking, if we can smartly avoid their weaknesses and leverage
    their strengths, these AI tools can provide help in many aspects.


    # Section 2: What Capabilities Does GPT Possess? Why Does It Have Them?


    After trying various new AI tools based on the `GPT` model, we discover they possess
    various surprising capabilities, such as writing, programming, logical reasoning,
    etc. We easily generate questions: What capabilities does `GPT` ultimately possess?
    Why does it possess them? The more we want to use it well, the more necessary
    it is to clarify these questions.


    `GPT` possesses certain capabilities and professional knowledge but is not good
    at processing information and is prone to "hallucination".


    ## GPT''s Capabilities


    Generally speaking, we can consider a trained `GPT` model to possess the following
    capabilities:


    - **Language Understanding Capability**: It can understand requirements posed
    and information provided in human natural language;

    - **Text Generation Capability**: It can generate text according to our needs,
    such as continuing articles, writing summaries, answering questions;

    - **Logical Reasoning Capability**: It can perform reasoning operations such as
    deduction and induction;

    - **Mathematical Capability**: It can understand mathematical principles and formulas,
    and solve mathematical problems;

    - **Multilingual Capability**: It not only masters multiple languages but can
    also translate between them;

    - **Programming Capability**: It can understand code written in programming languages
    and write new code according to our requirements.


    In short, it not only possesses language, mathematical, and reasoning capabilities
    but also masters knowledge in some professional fields. We invoke these capabilities
    and knowledge by asking questions.


    At the same time, we have all realized that `GPT`''s capabilities have unique
    limitations. It seems not to possess some capabilities we originally thought a
    computer system would inherently have. Specifically, when we search, a computer
    system retrieves and gives information already stored in databases or on the internet.
    However, getting `GPT` to give a precise citation without modification is not
    easy. It seems to know the sentence but cannot give the exact citation. That''s
    not even the worst; the worst is it may give a fabricated citation—this is the
    "hallucination" problem of generative AI models. To keep the conversation going,
    it "hallucinates" and then gives false, fabricated answers.


    Going back to the beginning, what the `GPT` model actually does is "text completion"—completing
    the following text based on the preceding text. Colloquially, we say a beginning,
    and it continues the story. Tracing further back is the `Transformer` architecture,
    initially used for machine translation, converting one language into another—completing
    the next word of a sentence based on the semantics of the source language and
    the vocabulary probability of the target language. Later, this architecture was
    gradually used for more general generation tasks, such as continuing articles.


    So, how does the `GPT` model know what to complete next? It is essentially a "next-token
    predictor" software; it predicts the next token based on preceding tokens and
    probability. It completes token by token, thereby "writing" the answer given to
    us.


    Then the next question: how does the `GPT` model predict the next token? Simply
    put, it has "read" an enormous amount of text data; colloquially, researchers
    trained this model using massive amounts of text. It calculates the probability
    of the next token appearing based on preceding tokens, then takes the token with
    the highest probability as the next token. Stephen Wolfram gave an example: based
    on the preceding paragraph, the model predicts the next 5 words in order (sorted
    by probability): `learn`, `predict`, `make`, `understand`, `do`. Then the `GPT`
    model takes `learn` as the next word. Afterwards, it predicts the next word again.


    In fact, we can adjust the probability of selecting the next word by adjusting
    the "temperature" indicator. The so-called "temperature" refers to an indicator
    reflecting randomness; the lower the "temperature", the lower the randomness.
    The model always selects the word with the highest probability; at this point,
    you might feel it is a bit "rigid"; increase the "temperature", randomness increases,
    the model randomly selects the next word from a group of words, resulting in large
    differences in results each time; at this point, you feel it is more creative.


    The next question: how does the `GPT` model judge the probability of the next
    word? Parameters or weights (`parameters/weight`) in the multi-layer artificial
    neural network determine the probability of the next word appearing. These parameters
    are adjusted into place by training the artificial neural network with a super-large
    amount of text. This is also the meaning of "P" in `GPT`—**Pre-trained**, letting
    it master the parameters needed to predict the next word. `GPT-3.5` has 175 billion
    parameters.


    As the amount of training text and parameters increase, the `GPT` model''s core
    capability of predicting the next word becomes stronger. It seems to have acquired
    language capabilities, mastered knowledge, and learned reasoning—this is quite
    similar to human growth: as a child gradually learns to speak, they learn knowledge,
    and later become capable of reasoning. The evolution of the `GPT` model is: after
    increasing the training text volume, its knowledge and capabilities improve significantly.
    So how do we make its capabilities work for us? At this point, the protagonist
    of this book—**Prompt**—suddenly highlights its importance.


    Generally, we give `GPT` a prompt (such as a paragraph to be translated, a paragraph
    to be continued, a long text to be summarized), then let it continue based on
    our prompt. However, since it already possesses language, reasoning, and generation
    capabilities, why not turn the prompt into a question (Please answer...) or a
    command (Please help me do...)?


    We call the request input to the `GPT` model a **Prompt**; it is the interface
    for using the knowledge and capabilities possessed by the `GPT` model. As shown
    in Figure 1-2, we can obtain and use massive information (as done by Google and
    Baidu) and services (as done by Amazon, Taobao, Meituan) by searching keywords
    on search engines. Now, we can use the knowledge and capabilities mastered by
    AI models through prompts.


    ![Figure 1-2 "Prompt" is the interface for using AI model knowledge and capabilities](img/CB_3300083703_4vdAI83LE30i54b6G601H37790.jpg)


    Many people only noticed the word `prompt` when applying generative AI products
    like `ChatGPT`. One of its Chinese meanings is a cue prepared to prevent actors
    from forgetting lines. In the 2007 book *Make Questions Work*, the author used
    `prompt` to refer to further questions used to obtain desired answers or more
    information. Now, `prompt` has a new meaning: the prompt given to guide it to
    give an ideal answer when using various generative AI models.


    Currently, we usually input prompts into two types of generative AI models. One
    is Large Language Models like `GPT`, letting them answer questions or respond
    to requests based on prompts; the other is text-to-image drawing models, such
    as `OpenAI`''s `DALL-E`, `Stability` company''s `Stable Diffusion` open-source
    model, `Midjourney` image generation software, etc. For the latter, since subtle
    changes in prompts bring huge changes in images, some jokingly call prompts "spells"
    and generating images from prompts "chanting spells to conjure magical paintings".


    Below, let''s focus on prompts used when using Large Language Models like `GPT`.
    Prompts are almost the only way to invoke the knowledge and capabilities of `GPT`
    and other LLMs. Below I will try to explain the implementation principle in plain
    language.


    As mentioned earlier, LLMs are essentially trained probabilistic models; what
    they do can be seen as predicting the next token. They predict token by token,
    thereby forming complete sentences, paragraphs, or articles. If it is a translation
    task, the probability prediction of the next token is relatively simple—just translate
    by comparing with the original text. But if it is a generative task, such as letting
    it continue a paragraph or answer our question, the difficulty of next-token probability
    prediction increases greatly.


    The role of the prompt is to guide the model to better calculate the next token.
    Guo-Yang Shen once excellently elucidated the essence of prompts in an article:
    "Adjust and optimize the values of the first m elements in the article; these
    elements usually include task descriptions, context information, etc., so that
    the LLM can generate results with higher probability and more in line with expectations
    in the context of a given task."


    A prompt is essentially a text pattern we write, then let `GPT` continue writing
    according to the current pattern—this is why what we write subtly influences it.
    If we write casually, it responds casually; if we write formally, it answers formally.
    In short, if we give appropriate prompts, including clear action instructions
    (e.g., write an article), appropriate reference content (e.g., about spring),
    etc., the model can better decide the next token, ultimately generating an answer
    that meets our expectations.


    In fact, we can transform a general LLM into a chatbot via prompts, Google `Deepmind`³


    ## Unleashing AI Potential with Prompts


    Prompts are the interface for invoking `GPT`''s knowledge and capabilities. We
    input prompts to `GPT`, inspire and invoke the knowledge and capabilities acquired
    by `GPT` through pre-training and fine-tuning, to let AI answer our questions
    and fulfill our requests.


    In fact, `OpenAI`''s several iterations of `GPT` versions are, to some extent,
    all related to prompts.


    - The title of the `GPT-1` paper is *Improving Language Understanding by Generative
    Pre-Training*, proposing a method to achieve language understanding and text generation
    through pre-training transformers.

    - The title of the `GPT-2` paper is *Language Models Are Unsupervised Multitask
    Learners*, explicitly introducing the method of invoking model capabilities using
    prompts.

    - The title of the `GPT-3` paper is *Language Models Are Few-Shot Learners* (Note:
    Original text says "Bidirectional Language Models Are Also Few-shot Learners"
    which seems to be a translation variance in the source; the actual GPT-3 paper
    title is "Language Models Are Few-Shot Learners". I will translate the source
    text faithfully but note the actual title). The so-called few-shot means we can
    add a few sample examples in the prompt to guide the model to answer similar questions
    more accurately (we will specifically illustrate the few-shot method later).

    - The title of the `InstructGPT` (equivalent to `GPT-3.5`, also the main model
    used by `ChatGPT`) paper is *Training Language Models to Follow Instructions with
    Human Feedback*, where the instructions used for training can be seen as a combination
    of prompts and human-preferred ideal results.


    From this, we can see that every technical iteration aims to enable the model
    to better respond to prompts and give answers.


    In short, good prompts correspond to good results; poor prompts correspond to
    poor results; wrong prompts correspond to wrong results. Learning to ask `GPT`
    questions is learning to input effective prompts.


    Below, let''s analyze the relationship between prompts and models from another
    angle. The LLMs we use now are all models optimized on the basis of pre-training
    via **Instruction Fine-tuning**, which enables the model to better understand
    and answer instruction-related questions. `Facebook`''s parent company `Meta`
    provided an open-source LLM `LLaMA`. In early 2023, a Stanford University team
    improved upon it to create the model `Alpaca`, claimed to perform close to `ChatGPT`.


    `Alpaca` was optimized for the various instruction tasks shown in Figure 1-3.
    Let''s see what these instruction tasks specifically are?


    ![Figure 1-3 Instruction Verbs and Specific Content](img/CB_3300083703_4vdAI83PM30c54b6G601Ha029f.jpg)


    The inner circle in Figure 1-3 shows instruction verbs, and the outer circle shows
    specific content of related instructions. For example, an instruction verb in
    the inner circle is **Create**, and the corresponding outer circle content is
    **Story**, **Sentence**, **Poem**, **List**. That is, it was trained to create
    a story, write a sentence, write a poem, create a list.


    Another example: another instruction verb in the inner circle is **Describe**,
    combined with corresponding outer circle content: Describe Process, Describe Difference,
    Describe Impact, Describe Benefit.


    We can understand it this way: First, these models mastered basic knowledge and
    capabilities through massive learning (pre-training); second, they may undergo
    re-training for professional domain content (e.g., `OpenAI` once trained models
    with code to give them programming capabilities); finally, they undergo fine-tuning
    based on relevant instructions to enable them to better complete tasks related
    to these instructions.


    Therefore, on the surface we interact with a chatbot or software assistant, but
    behind the scenes, it is trained models playing the role. After training, they
    possess general capabilities, domain-specific professional capabilities, and capabilities
    to complete specific tasks. When we make requests to them, they can respond using
    these capabilities. What we rely on to use these capabilities is effective prompts.


    ## Structured Prompts: ICDO — I See, Do!


    To use AI model knowledge and capabilities, we need to input effective prompts.
    So far, our experience is: we should input **structured prompts** to AI. Here,
    we name the structured prompt "**ICDO**". We can understand it this way: after
    we input a prompt, AI responds: "**I see, Do! (I understand, executing immediately!)**"


    The way to ask `GPT` is: we input a prompt, it outputs an answer. Of course, a
    prompt is not just "help me translate this sentence" or "help me organize meeting
    minutes". We need to deeply decompose its constituent elements to master the skill
    of asking excellent questions to obtain high-quality answers. Usually, a prompt
    can be decomposed into the following four parts: Instruction, Context, Input Data,
    Output Indicator. "**ICDO**" stands for the first letters of the four components
    of a structured prompt: **Instruction**, **Context**, **Data** (Input Data), **Output**
    (Output Indicator) (as shown in Figure 1-4). It was summarized by Elvis Saravia
    et al., and we have made two optimizations on this basis: naming it "**ICDO**"
    and further structuring it. The "**ICDO**" originally summarized by Elvis et al.
    was prepared for programmers accessing `GPT` via programming interfaces, but now
    it also applies to everyone who wants to use AI efficiently.


    ![Figure 1-4 Structured Prompt "ICDO" Framework](img/CB_3300083703_4vdAI83PM30e54b6G601H55acc.jpg)


    The prompts we input to `GPT` usually consist of the following four parts. Usually,
    we should input them in the following order. Here is a simple example with interpretation.


    ### Instruction (`instruction`)

    The specific task you want `GPT` to perform.


    > Your task is to translate Chinese into English.


    ### Context (`context`)

    Additional context or background information to guide `GPT` to respond better.


    > Please translate these proper nouns according to this glossary.


    ### Input Data (`input data`)

    The actual content input by the user.


    > The sentence to be translated is: The sky is blue. (Note: Source says "天空是蓝色的",
    translated back to English for the example context)


    ### Output Indicator (`output indicator`)

    Specify the output type, format, etc.


    > Translation: The sky is blue.


    We should organize our prompts in the order of the above four parts. If we regard
    `GPT` as a person, then when we assign it a task, the interaction is the same
    as asking a person to help complete a task: first state the task, give background
    information, then provide specific task information, and finally put forward explicit
    requirements for the result.


    `GPT` is also like a person; it remembers later information more clearly. If you
    give the specific task first and then explain the background, it may confuse the
    specific task with the background. Our purpose of asking is to get results, so
    requirements for results should be placed last. Meanwhile, a repeatedly verified
    effective technique for asking `GPT` is to describe the instruction at the beginning
    of the prompt (Your task is to translate Chinese into English), and repeat the
    instruction in some way at the end (Translation:); this makes it easier for `GPT`
    to clearly understand and execute our requirements.


    After using `GPT` for a while, you may find an obstacle is forgetting the order.
    But after abbreviating it as "**ICDO**", we never have to worry about it again.
    Everyone can ask questions following this structured prompt to get more ideal
    answers.


    Of course, in practice we may have noticed that not every question needs to contain
    these four elements; sometimes they can be omitted as appropriate. This is also
    similar to human communication; some things need not be repeated.


    To make `GPT` efficiently exert its capabilities, we often need to write more
    complex prompts. At this time, the structured prompt "**ICDO**" is our framework
    for writing prompts. Here is an example first for a more intuitive understanding.
    For instance, we ask `GPT` to rewrite a paragraph in Haruki Murakami''s style.
    The prompt is as follows. We can see we gave the task (ask it to rewrite), context
    (reference sample), input data (paragraph to rewrite), output requirements (ask
    it to write three versions).


    ```

    You are a writing style master. Your task is to rewrite articles in the style
    of writer Haruki Murakami. Do not add any new information to the rewritten article.


    Here is a prose by Haruki Murakami as a style reference sample: I can accurately
    state the moment I decided to write a novel; it was around 1:30 PM on April 1,
    1978. That day, in the outfield stands of Jingu Stadium, I sat alone drinking
    beer and watching a baseball game. ... The bat accurately hit the fastball, a
    crisp sound echoing through the stadium. Hilton quickly ran past first base, easily
    reaching second. And I decided: "Right, let''s try writing a novel." It was at
    that instant. At that moment, something seemed to quietly flutter down from the
    sky, and I unmistakably accepted it.


    The paragraph you need to rewrite is: Since the advent of AI, we can use it to
    assist writing. We no longer need to sit at a desk with pen and paper writing
    furiously. Now, we open a chatbot, converse with it; sometimes I ask, it answers;
    sometimes it asks, I answer; sometimes it brainstorms... In the conversation with
    the bot, our ideas gradually "flow" out.


    Refer only to the sample style, not the sample content. Please keep the rewritten
    paragraph length comparable to the original. Please give three rewritten versions
    in the format: 1. 2. 3. Please rewrite the above paragraph in Haruki Murakami''s
    style.

    ```


    '
