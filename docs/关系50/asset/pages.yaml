  md: '此类机器人的典型代表是Vector, 这是一款多功能掌上机器人，也是首批尝试进行商业化并面向公众的此类机器人之一。Vector由Anki公司开发，于2018年发布，是一种基于人工智能技术的机器人。与Siri或亚马逊的Alexa不同的是，Vector配备了多种传感器，可以自由地四处移动，并且可以在你发出口头指令后来到你面前。更重要的是，Vector有自己的个性。市面上大多数机器人都是反应式的，其反应是可预测的，但Vector的创造者希望它有可爱的“个性”。Vector会自己起身走动，还会在“睡觉”(非使用或非充电状态)时打呼噜，甚至会被巨大的噪声“吓到”，做出受惊的反应，看上去就像真的被吓到了。它的外表也被赋予了人性化的设计，小小的显示屏上有两只大眼睛，可以模仿人类的面部表情。当用户抚摸它时，它会发出快乐的声音，并配以愉悦的神情，而当用户摇晃它时，它会发出不高兴的声音，并配以生气的神情。通过程序员编写的数百万行代码、激光传感器、摄像头和麦克风，Vector可以与人们进行相当人性化的互动。


