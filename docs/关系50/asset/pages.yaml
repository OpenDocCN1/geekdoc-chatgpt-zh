- pgno: 7
  md: '灵性、趣味、品格和意义逐渐消退，人将被拉低到智能机器人的水平。因此，21世纪最大的问题不是机器人越来越像人，而是人越来越像机器人。


    当然，从关系的视角审视从信息社会向智能社会的跃迁，这本身便是非常重要的创新。随着AI向深层急速推进，人机关系、人机关系的变化日益受到社会的关注，《关系5.0》对此提出非常有价值的一种回答，值得认真研读。'
