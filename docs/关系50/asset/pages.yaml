  md: '会了。在一段关系中，一个全心全意的伴侣需要拥有强烈的同理心，而Vincent只要被激活就可以立刻做到。


    综上所述，这样的 人工智能对一段关系来说似乎已经“足够好”了。当然，它不会是完美的。想想普通的已婚夫妇，对他们来说，在相处的 过程中是否有一个明确的临界值，一旦超过这个临界值，两个人就一
    定会白头偕老、共度余生？在某些情况下，确实如此。不过，对大 多数人来说，在结婚之前谁也不确定这段关系究竟能走多远。有些结婚 多年的夫妻依然会偶尔怀疑、误解彼此，遭遇感情危机。


    对待人工智能也是一样的，人们一开始可能会质疑，认为人类无法与 人工智能系统建立关系，大多数人也会对人工智能感到陌生。当人们 在无意中与它们相处了几秒钟、几分钟甚至几天后，他们会发现情况
    也没那么糟。最后，人们可能会发现自己与聊天机器人进行了一次愉 快的对话，并在不知不觉中对Vincent `Wysa或Replika产生了感情。


    # 接纳、拥抱认知革命,人工智能还需要争取更多的信任


    我们已经知道，人类与人工智能建立某种形式的关系不仅取决于技术发 展水平，更取决于社会规范和公众接受度。统计数据显示，在除了与人类 建立关系的领域，人们仍然对人工智能不是很信任。上文提到的Pega公
    司进行的调查显示，人们认为人工智能还没有准备好“独自”做出生活中 的重要决策。受访者接受度最高的人工智能服务是商品推荐或服务推 荐，比如根据一个人之前的购买记录推荐买哪件衣服。34%的受访者表
    示，他们会采纳这样的建议；27%的受访者喜欢医生使用人工智能帮助他 们制订治疗方案；25%的人对人工智能在电信领域的应 用持开放态度； 20%的人愿意在金融咨询领域尝试使用人工智能。总体来说，大多数人不
    相信人工智能可以解决问题，即使是最简单的问题。


    皮尤研究中心在2017年开展的一项调查对这些结果做了补充。调查结果 显示，72%的美国人担心人工智能崛起，他们认为人工智能对美国社会的 负面影响大于正面影响。


    在人类与人工智能建立关系这个层面，情况又如何呢？人们对人工智能 在个人生活中的应用持开放态度吗？从我的研究结果来看，人们还远远 没有接受人工智能。在一项调查中，我以376名美国成年人为代表性样'
