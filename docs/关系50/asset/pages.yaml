  md: '# 第7章


    # 感官革命, 扩展现实让你身临其境


    如果我们希望扩展现实被广泛接受, 就需要学会取其精华、去其糟粕, 认真研究这些应用及其影响, 并制定道德标准和政策法规, 以确保这些应用安全、公正、健康、有益。


    《黑镜》(Black Mirror) 第五季第一集的内容引人深思。这一集名为《生死搏击》(Striking Vipers), 探讨了虚拟现实技术改变人类关系的可能性。丹尼和卡尔曾经是好朋友,
    随着时间的推移, 两人渐行渐远。后来, 卡尔出现在丹尼的生日派对上, 两人的友谊重新被点燃。卡尔给丹尼准备的生日惊喜是游戏《生死搏击》的虚拟现实版, 多年前他们玩过旧的版本。这款游戏的新版名为《生死搏击X》,
    玩家可以在虚拟现实中选择一个角色来玩游戏。


    在游戏中, 卡尔一直扮演一个名叫罗克珊 (Roxanne) 的女战士的角色, 丹尼选择的角色名叫兰斯 (Lance)。卡尔和丹尼使用一种非常先进的虚拟现实头戴式一体机,
    似乎可以直连大脑。借助这种脑机接口技术, 头戴式一体机可以直接将他们的思想和大脑发出的指令应用到虚拟世界。


    令丹尼和卡尔意想不到的是, 游戏中的罗克珊和兰斯在一场打斗之后莫名其妙地接吻了。随着时间的推移, 两人在游戏中的角色坠入爱河、翻云覆雨。可悲的是, 虚拟世界中的关系致使丹尼和卡尔在现实中越来越疏远,
    他们不确定这种虚拟的恋爱关系是否能够在现实世界中延续。随着游戏和现实、虚拟角色和真实自我之间的界限越来越模糊, 情况也越来越糟。丹尼已经娶妻生子, 对于他和卡尔在游戏中的虚拟恋爱关系,
    他感到很内疚。


    我们暂且不讨论脑机接口技术能否如此强大, 这个故事的迷人之处在于它对虚拟世界中的关系的思考方式。它展示了虚拟角色之间的爱情, 以及随着虚拟现实技术的出现,
    人与人之间的关系会发生什么样的变化。借助这项技术, 人们可以在虚拟世界中建立深刻的联系, 这反过来又会对现实生活产生巨大影响。'
