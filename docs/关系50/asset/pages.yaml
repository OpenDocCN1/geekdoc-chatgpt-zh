- pgno: 148
  md: '# 第8章


    # 机器人革命,人形机器人让你愿意把它当成另一半


    # 机器人就像智能手机一样,很快就能为用户提供情感陪伴。


    2002年,理查德 K. 摩根 (Richard K. Morgan) 出版了小说《副本》(Altered Carbon),后来这部小说被奈飞改编成了一部成功的剧集。故事发生在未来的现实世界,人们可以将个人意识和记忆重新载入一个新的躯体,也即副本,从而实现星际旅行。这个故事的理论前提是人类的意识储存在大脑中,身体只是自我意识的载体。“副本技术”可以将人们的意识数字化,然后将意识副本发送到其他身体里,因此人们可以随心所欲地“去往”宇宙中的任何地方。


    这种虚构的技术有一个隐含的假设:人类的“自我”就是意识,而身体没有任何存在的意义。在很长一段时间里,这也是大多数心理学家、脑科学家和哲学家的观点。根据这种观点,躯体并不是自我的组成部分,可以随意替换。


    这种观点与“人工智能完全可以取代人类伴侣”的观点不谋而合,两者都认为躯体并不重要,它与人类的情感、欢愉几乎没有关系。简言之,ChatGPT、Alexa、Google
    Home和Siri足以在我们需要的时候给予我们陪伴和支持。我们可以对人工智能系统这种没有躯体的“意识”产生依赖,把它们当作最亲密的朋友。许多电影都是基于这个前提,展示了人类和没有实体或形象的操作系统之间的联系。


    然而,越来越多的理论家认为,人类的躯体(摩根笔下的“副本”)并不只是意识的宿主,更是意识的重要组成部分。这一理论被称为具身认知(embodied cognition)或生成认知(enactive
    cognition)。这种理论认为包括大脑在内的身体是认知过程不可分割的一部分,观察、思考和理解等心理过程会受到身体感知的影响。这种理论还认为,同一意识在不同的躯体中会产生不同的体验,我们的肢体语言和面部表情也会影响我们与他人的互动,身体影响着我们与他人建立联系的方式。'
  merge: -1
