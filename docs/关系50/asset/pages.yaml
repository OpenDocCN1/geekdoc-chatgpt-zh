  md: '状况不佳, 预期寿命也较短。工人阶级居住的社区破旧不堪、人口密集且缺乏规划, 脏乱差的环境加剧了致命疾病的传播, 其中包括肺结核、霍乱、伤寒、流感和斑疹伤寒等。


    在工厂里, 这种阶级分化尤为明显。这些工厂没有采取任何安全措施, 工厂主为了控制成本无所不用其极, 甚至会雇用孤儿童工。我们从早期工厂工人的照片中经常能看到疲惫不堪的男人,
    他们衣着褴褛肮脏, 而且明显少了一两根手指。几个世纪以来, 工厂一直是危险的工作场所, 无论是成年工人还是童工, 在工伤事故中失去手指甚至整只手的情况并不少见。即便如此,
    许多迫于生计的孩子还是会主动去工厂里找一份工作, 赚取微薄的收入来贴补家用。19世纪的英国小说家弗朗西斯·特罗洛普 (Frances Trollope) 在她的作品中描述了这一现实：


    有一个7岁左右的小女孩, 她的工作是清理棉花加工车间地上的棉絮。飞扬的棉絮不断掉落在地上, 而她必须不停地从地上拾起它们, 以免棉絮堆积妨碍工人工作......当她钻到那一排排隆隆作响的机器底下时,
    她必须小心翼翼地把头、身体和伸展的四肢贴在地面上, 庞大的机器有规律地转动着, 充满了未知的危险, 她头晕目眩、身体颤抖地穿梭其间, 而且重复了一次又一次。事故经常发生,
    小女孩的亚麻色头发曾被机器硬生生地扯了下来。


    工业社会城市生活的第二个方面是工作的标准化。工业社会是由大规模生产商品的技术所驱动, 以支持其庞大且不断增长的人口数量。随着城市工业化进程的推进, 工厂上空弥漫着黑烟,
    工人的生活越来越多地围绕着工作场所转。机器不仅是提高生产力的工具, 还成了人们生活的中心。人类需要重视机器带来的一系列问题, 让科技为人类服务, 而不是沦为科技的傀儡。


    随着工业化的发展和生产流程效率的提高, 工人的可替代性变得更高。在生产线上, 工人们各司其职, 每个工人都做着一份非常具体的工作, 而且工作流程是标准化的,
    新来的工人很容易上手。因此, 家族生意、家庭作坊代代相传的观念 (由父亲教给儿子高技能的学徒模式) 面临淘汰, 像裁缝、制鞋、挤奶之类的传统行业, 甚至继承、管理自家的耕地都过时了,
    人们开始采用精密、高效的机器和最先进的技术。在工业社会, 人们致力于利用非人力资源来提高生产速度、扩大生产规模, 很少有人去关心他人和维护传统。'
