  md: '资料来源：2012，2017 Eurobarometer survey。(白色区域意指数据缺失)


    图8-1展示了欧洲人对机器人的总体评价分数在这5年间的增长趋势。当然，这场革命在地域分布上是不均衡的，一些地区的人对这种变革的接受度越来越高，但仍然有一些地区对机器人的接受度很低。总体来说，消费者正在逐步接受机器人技术的最新突破。遗憾的是，由于缺乏数据，很难将这项调查与更晚的调查进行比较。实际上，直到2024年，才有一篇发表在《自然》杂志上的文章讨论了更准确、更系统地测量这些趋势的方法，并展示了一张更现代的监测地图。


    人们对机器人接受度提高的一个有趣标志是指代语言的转变。最初的机器人被认为是无生命的物体，由“它”指代，而现在美国电气电子工程师协会开始用人称代词“他”、“她”或“他们”来指代机器人，就好像它们有生命一样。许多机器人都有自己的专有代称，甚至被它们的创造者冠以像人名字一样的名字。这种指代语言上的转变反映了人类与科技之间关系的变化，以及机器人作为人类伙伴的地位的转变。那么，这些发展与转变能否催生一种新型的人类与机器人的关系呢？我们将在下文中探讨这一点。


    # 机器人如何变得更像人类


    一天晚上，工作了一天的丹妮丝筋疲力尽地回到家，期待着和几个好友一起吃晚饭。幸运的是，约翰已经擦过地板，也叠好了洗干净的衣服。两个小时前，他就开始做饭了。丹妮丝很高兴，这意味着她可以和朋友们一起好好地享用晚餐，而不需要把工作压力发泄在朋友身上。她坐在沙发上，向约翰倾诉这一天中办公室里发生的麻烦事，而约翰耐心地听着。约翰的胳膊搭在她的肩膀上，他亲切的话语让她感到十分安慰。她很感激约翰给她带来的精神上的支持和身体上的放松，约翰不仅帮她做家务，还确保她的社交计划不受影响，让她能够保持身心放松的状态。


    当你读到这段文字时，你可能会认为约翰是丹妮丝的恋人、室友或亲密的朋友。但很快，我们就会看到一个不同的现实：约翰是一个多功能社交机器人，能够满足丹妮丝的许多需求。20世纪60年代的动画片《杰森一家》(The
    Jetsons)设想了这样一个未来现实：他们的家庭机器人“罗西”负责家务、医疗护理和大部分育儿工作。罗西或约翰可能曾经被认'
  merge: -1
  img_proc: true
- pgno: 156
  md: '为是遥远的科幻未来，但人们可能没有意识到，我们正在飞速冲向这样的现实。


    在前几章中，我讲述了人工智能的崛起，它赋予了机器认知能力，并继续加速发展。我还展示了虚拟现实和增强现实是如何创造出更加真实的感官体验，唤起了人们的视觉和听觉，甚至是嗅觉和触觉，尽管这些感官刺激并没有真实发生。现在，我们把关注点转移到机器人如何变得更像人类，让我们能够与它们建立关系。


    从我的调查结果来看，社会还没有发展到完全接受这一现实的阶段。我采访过的大多数人都对与机器人谈恋爱的想法表示担忧，甚至厌恶。50岁的已婚女性乔安娜来自宾夕法尼亚州，她表示：“无论机器人看起来多像人，它仍然是机器人，不是真的人。它只是一台被编程的机器，无法让人信任。建立恋爱关系需要两个真实的人，而不是一个人和一个机器人，这是非常不健康的。”


    27岁的杰克是一名来自佛罗里达州的工程师，他对与机器人的日常互动持相当开放的态度，但当被问及是否接受与机器人谈恋爱时，他的反应与乔安娜一样，提出了类似的批评：“这简直令人毛骨悚然，对我来说是不正常的。如果有人真的这样做，我认为这样的人有心理问题，而且是很严重的问题，需要去看心理医生。”


    乔安娜和杰克都表达了对与机器人谈恋爱的担忧。他们认为这是不健康、不正常的，这表明我们在人类和机器人的关系方面仍然深陷恐怖谷。尽管存在这些担忧和批评，但实体机器人革命似乎正在接近机器人的优势和发展说服人们跨越恐怖谷的那一刻，只是在一开始人们可能会犹豫不决。


    温迪·莫伊尔 (Wendy Moyle) 是格里菲斯大学的护理学教授，也是澳大利亚医疗实践与生存 (Healthcare Practice and Survivorship
    ) 项目的主任，还是机器人应用方面的一位杰出倡导者。莫伊尔年轻的时候目睹了4名家庭成员患上痴呆，但她没有绝望或愤怒，而是决心从事护理工作，并走上学术研究之路，主要研究痴呆、抑郁和精神错乱。随着时间的推移，莫伊尔认识到，越来越多的老年人遭受这些可怕疾病的折磨，而照顾老人的人手短缺。因此，她决定带头进行机器人辅助技术的研究。很快她就发现，机器人能显著改善老年人的身体和精神状况，这主要归功于人类和机器人在互动中建立的情感联系。如今，莫伊尔是'
  merge: -1
  img_proc: true
- pgno: 157
  md: '世界知名的学者和世界卫生组织的顾问，倡导使用机器人辅助治疗疾病。


    鉴于乔安娜和杰克提出的质疑，我问莫伊尔是否相信机器人真的能够与人类建立联系。基于她与老年人打交道的丰富经验，她非常乐观地说：“目前我们发现，当老年人和社交机器人待在一起超过一个月时，他们就会对机器人产生情感依赖，不舍得归还机器人。他们会给机器人起名字，尽管它的反应有限，他们还是会不断地与它交谈，把它当作一个朋友。在我看来，这表明在未来随着人工智能变得越来越精密，机器人能够与人类进行更深入的对话，我们很可能会看到机器人和人类建立起密切的关系。”


    对于莫伊尔的观点，我并不感到惊讶，因为人类在解决自身需求方面比我们想象的要灵活得多。也许一开始我们会难以接受，但随着机器人能为我们提供的帮助越来越大，甚至陪伴我们，满足我们的一些生理需求和情感需求，我们的态度可能会发生变化。随着机器人的触觉、动作、同理心，甚至是亲密接触能力的发展，或许有一天这些发展会结合在一起，创造出功能齐全的机器人伴侣。


    # 机器人已经可以模拟人类的触感和拥抱


    为了准确展示机器人技术取得了多大的进步，我们先来看看一项看似最难的任务：复制人类在触摸时体验到的温暖和柔软。触摸是人类互动的重要组成部分，可以催生或加深人与人之间的感情。我们会在情感、行为和生理上对触摸做出反应，至于这种反应是积极的还是消极的，取决于许多微妙的差别以及与环境相关的因素。


    正因为机器人很难模仿人类的身体接触，一些人可能会认为将机器人作为亲密伴侣的想法很荒谬。当我询问人们与机器人谈恋爱的可能性时，一次又一次地听到这种观点。50岁的已婚男性唐来自密歇根州，他表示：“我需要人类的触摸，机器人会让我感到很奇怪。我也需要对方拥有温暖、柔软的身体，而坚硬、冰冷的机器做不到这一点。我可以接受让机器人做一些日常琐事，但如果涉及感情和性，我是不可能接受的。”


    因此，在研发社交机器人时，重现人类身体接触的感觉是一项艰巨的挑战。这项挑战不仅关乎如何创造那种接近于被人类触摸的感觉，也在于'
  merge: -1
  img_proc: true
- pgno: 158
  md: '如何使人们在情感上被机器人的触摸所吸引,而不受“对方不是人类”这一想法的影响。


    荷兰的两名研究人员决定迎接这项挑战,尝试制造出一种能够准确重现人类触摸效果的机器人。两人找到了67名参与者,让他们观看一部恐怖电影,旁边有一个机器人偶尔会说一些安慰的话,同时把手放在参与者的肩膀上。结果发现,机器人的触摸可以引起与人类的触摸相同的心理反应。参与者从机器人的话语中获得了安慰,更重要的是,机器人的触摸让他们感到放松。研究人员还监测了参与者的心率和心律变化,结果发现他们的生理应激反应得到了缓解。此外,研究人员发现,机器人的触摸加深了参与者与机器人之间的亲密感和情感联系。


    然而,正如上文中的唐所提到的,机器人没有温暖、柔软的身体,这也是它们试图与人类建立联系时面临的障碍。大多数社交机器人都是坚硬冰冷的,即便是人形机器人也如此,它们触摸人类时给人的感觉并不好。根据这一需求,一组来自卡塔尔、印度、新加坡和德国的研究人员成功地让机器人模仿了人手的柔软和温暖。研究人员先让参与者选择他们喜欢的温度和柔软度,发现他们最喜欢的温度是28.4°C。接着,基于人造手上780个数据点所收集的数据,研究人员比较了人手和人造手的皮肤柔软度。最后,研究人员测试了人造手的效果,在参与者看不到的情况下用它触摸他们的手臂。结果表明,人造手的温暖和柔软程度可以做到以假乱真。


    另一项研究的结果也显示了温度调整对机器人的触摸的影响。在这项研究中,参与者被分为三组:第一组参与者握着一只温暖的机器人手;第二组参与者握着一只冰冷的机器人手;第三组参与者没有握住机器人的手。结果显示,第一组参与者与机器人的友谊及对它的信任增加得最多。


    然而,身体接触远不止轻轻地握手或拍肩膀,拥抱也是常见的人类体验的一部分。我们在婴儿时期接受的第一种身体亲密接触的行为就是拥抱,在我们的整个生命周期中,拥抱一直是社会互动的组成部分。经常通过拥抱来感受温暖和柔软对身体有很多好处。研究表明,拥抱可以降低血压和心率,改善免疫系统,减轻疼痛,改善睡眠。拥抱在人们的情感和精神生活中也扮演着重要的角色,它可以减轻压力,提高记忆力,减少焦虑,让大脑分泌催产素来促进积极情绪的产生。'
  merge: -1
  img_proc: true
- pgno: 159
  md: '令人兴奋而又惊讶的是，最新的机器人已经能够模拟温暖的拥抱，并引发人们的情感反应。最近，宾夕法尼亚大学、马克斯·普朗克智能系统研究所和苏黎世联邦理工学院学习系统中心联合开发了一个项目，展示了机器人能够提供让人类满意的拥抱，并且能够带来一些人们从与他人的拥抱中获得的益处。


    在这次尝试中，研究人员设计了一个机器人，它可以提供不同持续时间、压力和温度的拥抱。此外，研究人员还想调整拥抱的一个更细微的特征——柔软度，并通过在机器人身上覆盖几种面料的织物成功做到了这一点。研究人员测试了参与者对拥抱的反应，结果很明显：在拥抱之后，参与者表示他们的社交满意度和幸福感有所提升，感觉更安全、更舒适，并感受到了机器人对他们的关心。研究人员还发现，中等压力、温暖的拥抱是最有效的，而且当参与者想结束互动时，机器人会立即松开。


    这一系列的研究显示，机器人可以满足人类对拥抱或身体亲密接触的需求或欲望。对像唐这种持怀疑态度的人来说，这些研究表明我们可能会看到机器人比预期更早地跨越恐怖谷。显而易见，随着机器人越来越精密，人与人的身体接触和人与机器人的身体接触之间的差异会越来越小。


    # 当机器人可以展现出肢体动作与面部表情


    如果想让人形机器人更加接近人类，肢体动作和面部表情也是非常重要的因素。57岁的单身女性杰西卡来自纽约市，她告诉我：“你无法与一个没有生命的物体自由地交流，自然也就无法建立互动关系。”确实，大多数机器人看起来毫无生机，几乎没有肢体语言和面部表情，杰西卡说它们“没有生命”也是合理的。


    当机器人被赋予肢体动作和面部表情后，影响是显著的。为了探究机器人的不同表现如何影响人类的态度和行为，一项大规模的实验室研究招募了102名参与者，他们要向一个非人形机器人讲述一个私人的故事或事件，然后机器人用不同的文字组合和简单的手势来做出回应。研究结果显示，当机器人加入手势时，参与者觉得它更有吸引力、更值得信任，具体表现为与机器人的眼神交流、对机器人的微笑都增多了，身体上的距离也更近。即便机器人的肢体动作很简单，也能缓解参与者面对它时的紧张感。虽然之前的研究表明，人类对向固定的机器或机器人吐露心'
  merge: -1
  img_proc: true
- pgno: 160
  md: '声缺乏兴趣,但从这项研究的结果可以看出,即使是在创新方向迈出“加入手势”这一小步,也明显提高了参与者对机器人的信任程度。


    关于面部表情和肢体动作的影响在早期的研究中就有所体现。有研究表明,即使是强颜欢笑,也刺激多巴胺和血清素的分泌,有助于减轻压力,同时对社交活动有着积极的影响。另有类似的研究表明,挺胸抬头、舒展身体会提高睾丸素水平,降低皮质醇(压力荷尔蒙)。在他人看来,一个人做出这些姿势是自信的表现;相反,如果一个人愁眉苦脸、无精打采就会显得缺乏自信。


    同样,机器人在与人类互动时加入动作、表情也被证明是有效的。既然肢体语言对人的影响如此之大,让人们在互动的过程中即使不了解对方的性格也会被对方的动作和表情影响,那么机器人的面部表情和肢体动作为何不能以同样的方式影响人类的情感呢?


    然而,通过编程赋予机器人仿人类的肢体动作和面部表情是一种精细的工作,也是一项颇具挑战的任务。人类的面部有40多块肌肉,这些肌肉组成了我们表达不同情绪的面部表情。因此,这项任务意味着人形机器人需要在没有肌肉的情况下复制人类的表情。


    为了实现这一目标,大阪大学、京都大学和国际电气通信基础技术研究所合作开发了人形机器人Erica。根据项目介绍的描述,Erica是一个先进的机器人,她与机器人Geminoid是姐妹,硅胶皮肤和合成头发使她的外表非常像人类。研发人员希望把她塑造成一个美丽、柔和的日本女性形象,让人们可以感受到亲和力,从而放松地与她互动。Erica拥有语言理解能力和类似人类的声音,可以通过数千种语言行为和眼神对人类与她的互动做出反应。


    Erica不只会说话,她的硅胶皮肤下面还嵌入了几十个气动执行器,可以做出各种面部表情。此外,她的面部、颈部、手臂和腰部有44个自由度,让她可以做出各种面部表情和肢体动作。2024年,这类机器人的种类已经更为丰富,例如2021年首次亮相的Ameca和2022年首次亮相的Beomni。


    在俄罗斯,一家名为Promobot的公司从2019年开始定期生产外形各异的人形机器人。该公司的Robo-C模型是高度可定制的,可以复制任何人的外貌,不受国籍、年龄或性别的限制。这些人形机器人主要用于家庭和专'
  merge: -1
  img_proc: true
- pgno: 161
  md: '业领域，它们不仅长得像人类，还能做出600多种微表情，看起来非常逼真。


    有的机器人虽然没有这么逼真，但也可以复制引发人类情绪和反应的动作。iPhoneoid是一个台式机大小的迷你机器人，有两只小机械臂，尺寸不到30立方厘米。人们可以通过iPhone上的应用程序创建各种表情，机械臂会配合地做出动作。仅仅经过10次迭代，iPhoneoid的原型机就能够配合相应的手臂动作做出快乐、悲伤、恐惧和愤怒等面部表情。这表明我们可以利用现有的技术，低成本、大规模地生产类似的技术产品。


    iPhoneoid开发出来两年之后，科学家就使用进化算法提高了其表情的复杂程度。借助更高级的算法，这个有着两只机械臂的智能手机机器人可以表现出复杂情绪之间的细微差别。为了做到这一点，研究人员进一步将机器人的表情分为三个部分，即情绪、感觉和心情。根据他们的理论，情绪持续的时间较短，受到刚刚发生的特定事件的影响；感觉持续的时间较长，受到最近一段时间发生的事件的影响；心情是一个人的整体情绪状态，受到更普遍的事件的影响。


    试想一下，有一天，你心情不错，但朋友送了你一份你不太喜欢的礼物。作为接受礼物的人，你会用微笑来表达对朋友的感谢。不过，如果你的朋友观察得更仔细一点，可能会从你的眉毛或脸颊肌肉的位置看出细微的变化，这是你对礼物不满意的情绪表达。总体来说，你是高兴的，因为你度过了美好的一天。研究人员赋予了智能手机机器人表达这种复杂的、多种感受结合的情绪的能力，这标志着人形机器人技术又向前迈了一步。


    更复杂的是，机器人的脸和眼睛应该跟随与它们交谈的人类的脸和眼睛移动。人们在交谈的时候会期望得到对方的关注，如果机器人能做到这一点，用户就会有一种机器人在积极参与对话的感觉。为此，丹麦奥尔堡大学的一个研究团队开发了一种机器人系统，通过声源定位和人脸检测，该系统能够将机器人的注意力引导到房间里正在说话的人身上。研究人员将这款机器人命名为iSocioBot，并在32名成年参与者中进行了试验，结果显示它总体上很受欢迎，不仅相当智能，而且在互动时能给予对方想要的关注。


    这些技术正在被像亚马逊、特斯拉和英伟达这样的科技巨头整合到他们的机器人产品中。在2023年和2024年，这些公司都发布了改进后的'
  merge: -1
  img_proc: true
- pgno: 162
  md: '模型，集成了多种先进能力。毫无疑问，随着实体机器人革命的进程不断推进，机器人在外观、行为和肢体语言上会慢慢变得更像人类。通过应用面部表情、位置跟踪和手部运动能力等方面的技术，研发人员将有能力创造出多模态交互的机器人，这样的机器人能够更有效地与人类交流。更有可能是，像杰西卡这样对机器人持质疑态度的人很快就会把它们视为合格的情感伴侣。


    # 机器人扮演家庭成员的能力越来越强


    许多人恋爱、结婚的原因之一是生病和年老的时候能有人在身边照顾他们。虽然家庭成员和伴侣确实可以照顾他们所爱的人，但我在调研过程中发现，许多受访者都希望机器人能够帮他们分担照顾家人的责任。


    一些人对护理机器人的应用表示支持。27岁的计算机科学家杰奎琳来自俄克拉何马州，她说：“我认为那些能够与人类互动的机器人是非常有用的……它们可以在极大程度上帮助残障人士和患有精神疾病的人。”然而，许多人认为这样做是不健康的，也没有人情味。57岁的单身女性莎拉来自加利福尼亚州，她表示：“我们需要与活着的、会呼吸的人类进行情感交流，这样才能感受到爱和关怀，用机器人代替人类只会让我们感到更加孤独。”


    这种不信任可能源于没有接触过这类机器人。为了检验现实生活中人们的反应，荷兰研究人员在荷兰的一家护理中心开展了一项研究。他们派出一个社交机器人定期访问护理中心的住户，并协助他们完成日常事务，例如与家人联系、寻找物品，还能为他们提供简单的娱乐。护理中心的住户表示这个社交机器人非常有用，并强调了这个机器人系统使用起来很简单，他们很快就学会了。尤其重要的是，这个机器人的出现激起了住户们的好奇心，为他们的生活增添了乐趣。


    有趣的是，研究人员采取了另一项措施来观察护理中心的住户对机器人的满意度。在为期一周的实验中，他们让机器人拍摄了与它互动的住户的照片，看一下机器人能否在情感上影响这些住户，让他们露出笑容。实验结果很明显：在机器人拍摄的144名住户中，118人（81.9%）面带微笑。


    许多类似的研究也得出了相似的结果。例如，ENRICHME项目利用机器人系统来进行健康监测、社交支持和辅助护理等。该系统包含一个'
  merge: -1
  img_proc: true
- pgno: 163
  md: '移动社交机器人，配备有交互屏幕、环境智能系统和网络化护理管理信息平台，这个平台可以远程访问和控制。ENRICHME系统已经在波兰、希腊和英国的养老院投入使用，旨在改善护理服务。一份关于ENRICHME系统的试点研究报告表明，该系统的所有功能都有助于改善对住户的护理，并为他们带来福祉。


    因此，社交机器人可能很快就会成为人们日常生活中的伙伴，它们的用途可以扩展到帮忙做家务。iRobot公司于2002年推出了一款自动扫地机器人，如今这种机器人已经很常见，而且功能越来越丰富。德国卡尔斯鲁厄理工学院开发了ARMAR系列人形机器人，旨在协助人们完成复杂的家务，比如把餐具放入洗碗机、擦桌子，甚至使用电动工具等。第一个ARMAR机器人于2000年面世，它配有仿人手臂、立体摄像系统和机械手，能够朝各个方向移动，其关节可以旋转330度。摄像和编程技术的指数级发展使新版ARMAR机器人的功能越来越强大，它们现在可以借助传感器和人工智能技术完成诸如打开和关上冰箱、端茶送水，甚至在未知环境中导航等任务。尤其重要的是，ARMAR机器人最近获得了观察和识别人类行为和肢体语言的能力，未来有可能通过识别简单的手势来接收指令。


    另一个名为Rollin’Justin（简称Justin）的机器人由德国航空航天中心设计，最初用于卫星维修，修理卫星所需的机动性和功能使Justin可以迅速且毫不费力地适应家务工作。Justin的机械手有对生拇指，可以抓取摆在高处的东西。Justin的每只手臂可以承受14千克的重量，因而可以搬运重物，这对健康的成年人来说也是不轻松的。此外，Justin的“巧手”还能煮咖啡，拿纸杯时不会洒出液体，还能接住80％以上飞过来的物品。这些能力让我们很容易想到，Justin可以帮助照顾成年人、孩子和宠物，甚至可以参与运动项目。到2023年底，这种机器人厨房已经在伦敦的一家专卖店展出，并开始向公众出售，价格为数万英镑。


    机器人还可以为我们准备食物。Moley Robotics科技公司成立于2015年，该公司开发的机器人厨房可以根据简单的口头指令做饭。鉴于ARMAR和Justin已经向我们证明了机器人的能力，我们自然也相信机器人可以为我们准备燕麦粥或炒鸡蛋等简单的食物。Moley
    Robotics的机器人厨房是在众多优秀厨师的帮助下开发出来的，其中包括英国版《厨艺大师》的冠军蒂姆·安德森（Tim Anderson）。通过学习厨师的手部动作，机器人厨师成功地制作了大量菜肴，这些菜肴的食谱可以从在线数据库下载，而'
  merge: -1
  img_proc: true
- pgno: 164
  md: '机器人使用的烹饪技术对人类来说通常需要经过大量的烹饪培训才能掌握。在制作完从简单的煮鸡蛋到复杂的蟹肉浓汤、意大利肉酱面等菜肴后,机器人厨房甚至会自行清理,让你省出时间去做其他事情。


    然而,我们想要的不仅仅是依靠下载程序运行的机器人,我们希望机器人能够通过反复试错来学习新的行为。开发了ChatGPT的OpenAI公司,于2024年与Figure
    AI公司合作,推出了名为Figure01的机器人。该机器人利用ChatGPT的引擎进行自我学习,并通过执行任务来学习操作方法。借助摄像头阵列,它能够学习周围的环境,并理解如何完成摆在它面前的任务。随着时间的推移,机器人将学会完成更多的任务,变得更加个性化,更加关注用户的需求。


    在一个家庭机器人可以同时提供陪伴、减轻压力、提供娱乐、收取信件、支付账单、做饭打扫的世界里,机器人扮演家庭成员的能力越来越强。本书的第一部分提到,在过去,人类受益于以集体或家庭为单位分担家务的方式,这也是在所有时代、所有类型的关系中最主要和最常见的方式。然而,未来是一个由家庭机器人分担家务的世界,人类可以拥有更多的空闲时间,可以把精力从家务转移到他们自己更想去追求的爱好和事业上。


    # 与机器人共情


    与机器人建立真正的关系所需的不仅仅是身体接触或家务分担。在我就人类与机器人建立关系的可能性展开的调查中,很多人都谈到了对机器人产生感情很困难。64岁的已婚男性乔治来自纽约州北部,他告诉我:“一个人需要求助于机器人并与之建立恋爱关系,我认为这是非常可悲的。毕竟,一段浪漫的关系应该是充满感情和意义的。在我看来,向机器人寻求情感体验几乎可以说是一种耻辱。”与乔治一样,许多人根本无法想象自己会对机器人产生感情。


    然而,我们想象中的行为和感受与我们实际去做时的情况可能完全不同。从实际情况来看,机器人在工作场所的应用已经为人们所接受。2020年年底的一项调查显示,在1.2万名目前在职的参与者中,68%的人更喜欢和机器人而不是经理谈论工作中的压力和焦虑,80%的人表示他们愿意让机器人充当心理医生或咨询师,只有18%的人更喜欢人类而不是机'
  merge: -1
  img_proc: true
- pgno: 165
  md: '机器人来改善他们的心理健康。也许，问题并不在于我们与机器人互动时的行为和感受，而在于我们将这种情感联系置于什么样的情境。


    为此，研究人员调查了人类和机器人在情感层面的联系。**令人惊讶的是，研究表明人们可以对机器人产生真正的同理心，并与它们建立情感联系。**关于这个问题的经典著作之一是《媒体等同》（The
    Media Equation），这部出版于1996年的著作由计算机科学家、心理学家和哲学家合作撰写。根据书中的媒体等同理论，即便是面对20世纪90年代那种黑屏绿字的计算机，人们也会产生感情。例如，我们会“有礼貌”地对待计算机，关心它们，并受到它们的赞美的影响。


    自那时起，机器人在传达情绪方面变得越来越高效。为了证明这一点，一项研究让36名成年人与一个58厘米高的人形机器人玩模仿游戏。在游戏中，机器人会移动手臂和头部做出一系列动作，参与者必须模仿这些动作。10轮游戏后，参与者要报告自己的情绪，以及他们感知到的机器人的情绪。结果发现，人类和机器人的情绪之间存在显著的正相关性，而且机器人的肢体语言所表达的情绪与人类感知到的是一致的。也就是说，当机器人用手势表达积极的肢体语言时，参与者也会产生积极的情绪，而且也感知到了机器人的积极情绪。此外，机器人通过肢体语言表达中性情绪和消极情绪时，也能够被人类正确地感知到。


    另有研究表明，人类对机器人的情感可能会加深。其中一个影响因素是熟悉程度，随着时间的推移，人们会对机器人产生熟悉感。在一项研究中，参与者需要和一个机器人玩游戏，研究人员会观察参与者对该机器人的信任程度，并对比他们对其他机器人的信任程度。研究表明，与其他机器人相比，人们更倾向于信任与他们一起玩耍和互动过的机器人。这种现象类似于人际关系中的信任水平，人们会对有过互动的人给予更多的信任。


    几名德国研究人员更进一步，他们想知道人们是真的对机器人有感情，还是仅仅因为他们认为自己应该对机器人有感情才这么说的。换句话说，人们是否会因社会期望的影响而在看到机器人受苦时表示遗憾，但实际上并不在乎。


    这项研究没有通过问卷和访谈去了解参与者的感受，而是直接使用功能性磁共振成像（fMRI）技术来监测参与者大脑的活动，并对比参与者对机器人和对人类的情绪反应与同理心。研究人员向参与者分别展示了'
  merge: -1
  img_proc: true
- pgno: 166
  md: '人类和机器人受到热情对待或暴力对待的视频。结果出人意料，参与者对所有视频都有情绪反应。当参与者看到人类和机器人被热情对待时，他们的神经激活模式并没有什么不同，而看到暴力视频时，他们的反应有所不同。


    一些研究人员通过监测肌肉群的运动来观察参与者对机器人的情绪反应。他们要求62名成年参与者连接上肌肉传感器，并把他们分成两组，让他们观看两段不同的机器人恐龙视频，一段是友好互动的视频，另一段是机器人恐龙被折磨的视频。研究结果显示，观看友好互动视频的参与者产生了积极的情绪，而机器人恐龙被折磨的视频引发了消极、痛苦的情绪。看到机器人恐龙被折磨时，参与者出现了皱眉等与负面情绪相关的肌肉运动。


    这些研究和其他许多研究表明，我们对机器人的关心和情感远远超过我们愿意承认的程度。我们的关心和情感依赖机制很可能比我们想象的要偏向本能的层面。此外，现在的机器人已经先进到可以让我们陷入情感“陷阱”，让我们认为它们值得我们付出感情。这些推动因素为关系5.0铺平了道路，接下来的挑战是如何让机器人获得“情商”。


    # 机器人的“情商”


    虽然研究证明人类能够对机器人产生感情，但对许多人来说，是否与机器人建立相互共情的关系仍然是一个未知的问题。37岁的威尔是来自佛罗里达州的单身男性，当我问他能否想象与机器人谈恋爱时，他说：“如果一个人和机器人谈恋爱，这个人一开始可能会过于依赖机器人，一段时间后才会意识到它只是一个没有情感、不会关心人的程序。可以预见，这将加重人们的抑郁程度。”42岁的苏西来自马里兰州，她在接受访问时表达了同样的担忧：“机器人无法产生感觉或情绪，它们是机器，和机器人谈恋爱是不正常的。”


    让机器人拥有情商是一项艰巨的任务。对人类来说，培养情商的难度也很大。你可以去问问那些与各种心理健康问题做斗争的心理医生，他们会告诉你让一个人变得更体贴周到、为人处事更圆通有多难，可想而知通过编程让机器以更好的方式互动就更难了。


    为了让机器人掌握情感方面的技能，科学家做了很大的努力，通过几种方式和几个阶段来实现这个目标。科学家先将情商分成几个部分，'
  merge: -1
  img_proc: true
- pgno: 167
  md: '并分别为每个部分编写程序。例如，随着认知革命的推进，机器人可以使用深度学习人工智能技术来开发语言识别技能，从而学习如何识别与特定情绪相关的语气和词语，并做出相应的反应。


    此外，有些机器人被设计成自适应的，可以通过向用户学习来调整自己的互动方式，一种新颖又可靠的方式是让机器人用算法来评估与用户的互动。例如，一个通过编程设计为安慰人类用户的机器人，最初会尝试将柔和的语音语调和温暖的肢体语言结合起来，也许还会辅以面部表情。之后，机器人会观察人类用户的反应，并相应地进行调整，以满足人类特定的情感需求。通过一次次的尝试和学习，机器人能够了解到什么样的表达方式对这个特定的用户有效，并将其存储在内存中。


    这与人类培养情商的过程惊人地相似，当我们与周围的人互动时，无论对方是朋友、同事还是伙伴，我们都是这样做的。我们会先尝试某种行为，然后观察对方的反应，并从中学习。我们从婴儿时期开始就用哭泣来吸引注意力，用微笑来建立情感联系。随着时间的推移，我们学会了解读他人的系列行为，并在一生中不断磨炼这些技能。成年后，我们会根据自己的伴侣或恋人的反应来调整自己的行为，观察他们在压力大或快乐等状态下需要我们做出什么样的反应，并尽我们所能做出他们所需的行为和肢体语言。


    目前，机器人情商培养还处于起步阶段。即使是最复杂、最昂贵的机器人，也像婴儿一样对自己的动作和面部表情所产生的影响一知半解。当我与Erica‘Geminoid和其他一系列机器人的创造者石黑浩教授讨论这个问题时，他让我思考，等到机器人积累了基于数百万用户的数据和行为模式的那一天，它们会拥有什么样的能力。他认为，虽然那一天还没有到来，但一切正朝着那个方向发展。


    除了这些复杂的学习和适应过程，机器人还会做出一些有助于弥补它们作为非人类的缺陷的“人性化”举动，例如表现出很“乐意”照顾他人，“耐心”地协助完成认知任务，记住应该做的事情，等等。你可以想象一个面带微笑、乐于助人，只是不说你所使用的语言的护士。这种“善良”的表现也增强了它们其他方面的能力，让它们成为足够好的陪伴者。研究表明，在护理和照顾老年人方面，机器人现有的情商已经足以让用户喜欢上它们，并把它们当作好伙伴。'
