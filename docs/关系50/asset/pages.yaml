- pgno: 97
  md: '只有知道了我们在这段旅程中走了多远, 前行的方向才会更加明确, 本书讨论的核心问题“机器能否与人类建立关系”的答案也将更加明晰。


    # 科技如何模仿人类大脑?神经网络、深度学习和强化学习的发展


    在20世纪中期, 大多数关于人工智能的研究都集中在利用计算机一次解决一个问题的技术上。这种处理方法被称为“串行计算”, 它只需要一个内部处理器, 而当时的芯片和电子设备组件的尺寸都很大,
    因此这种处理方法节省了宝贵的空间。然而, 串行计算一次只能处理一种算法, 速度缓慢且不够灵活, 基于串行计算的人工智能也无法解决现实生活中复杂的非线性问题。


    在日常生活中, 即使是像准备早餐这种看似简单的工作, 也需要多任务处理。想象一下, 当你打开电水壶的开关准备烧水泡茶或煮咖啡时, 你会做些什么。在等待水烧开的这一分钟里,
    你可能会先往烤面包机里放两片面包, 然后迅速去洗脸, 最后在桌子上放一个盘子和一个杯子。如果是串行计算, 在水烧开之前, 你什么都不能做。只有摒弃这种低效的处理方法,
    我们才能朝着制造仿人智能机器迈出一步。


    若想做到这一点, 科学家必须学习和模仿人类的大脑, 以回答数学家艾伦·图灵 (Alan Turing) 在1950年向读者提出的著名问题, 即“机器能否思考”。科学家对这个问题的研究已经取得了惊人的进展。为了更好地理解人工智能技术已经发展到何种程度,
    我们先来看看我们相对比较熟悉的人工智能的基本方法。神经网络、深度学习和强化学习是人们讨论得最多的三种方法, 它们都是源自人类大脑的运行机制, 为仿人智能机器的研发做出了贡献。


    为了让计算机解决复杂的问题, 人们开始研究神经网络这一人工智能方法。神经网络人工智能模仿了人类大脑中神经元的复杂排列, 通过指示计算机并行处理不同的信息来实现多任务处理。在神经网络计算范式的基础上,
    研究人员开发了并行分布式处理（parallel distributed processing, PDP）框架。该框架表明人类的思维和行为源于不同处理单元之间的动态分布式交互,
    这些单元之间的协作由一个程序来调整, 从而使误差最小化、奖励最大化。


    最初, 神经网络和并行分布式处理被用于解决相对简单的问题, 如数据验证、销售预测以及运营研究中的简单问题等。随着时间的推移, 人们发'
  merge: -1
  img_proc: true
- pgno: 98
  md: '现这些方法可用于解释各种各样的人类行为。例如,人工智能语言翻译是基于“将单词和句子与相对应的上下文联系起来”这样一个设定,因此能够给出正确的翻译。


    第二种改进机器思维的方法被称为深度学习。通过使用电生理方法和光学方法研究哺乳动物大脑中视觉处理的单细胞记录,深度学习这一方法得以发展起来。当我们不断接受信息刺激,随着时间的推移,我们会逐渐在越来越高(或者说越来越深)的层面上处理信息。


    为了更好地理解这种方法,你可以想象一下,当你看到莫奈的《睡莲》这幅画时,你的大脑似乎立刻就能认出它。实际上,你“认出这幅画”是通过一系列快速而逐步深入的步骤进行的。首先,你认出了这幅画的颜色和轮廓,然后你意识到画的是水面上的植物,接下来你才看出实际上画的是睡莲。所有这些步骤加起来可能不到半秒的时间,但涉及几层思维过程,之后你才通过这幅画的整体风格猜测出创作者。


    类似地,深度学习通过多层嵌套的方式处理信息。计算机不需要问它看到的每一个物体是否是莫奈的《睡莲》,它的提问方式是:这是一幅画吗?这是印象派的画吗?这是一幅包含植物的印象派画作吗?那些植物是睡莲吗?它更像由处理器驱动的人工智能版本的经典桌游“猜猜我是谁”(Guess
    Who?)。通过一系列非线性的多层的思考、提问和计算,我们将视觉信息输入转化为更复杂的视觉场景展示。基于这种多层嵌套的处理方式,计算机在没有掌握相关知识的情况下也能识别各种对象。


    人工智能模仿人类大脑运作机制的第三种方法是强化学习,这是一种旨在确定哪种方法能使未来的回报最大化的算法。强化学习模型通过识别和匹配受神经科学影响的过程中的因果关系来实现这一点,这与人类和一些动物学习重复动作以获得奖励的过程类似。


    例如,许多人训练自己的狗坐下的时候会给它们一些奖励,好让它们乖乖听指令。同样的原理也适用于计算机软件,以控制交通信号灯的软件为例,理想的情况是保持道路畅通,尽可能避免交通拥堵。强化学习会告诉程序不断调整红绿灯的时间,并把成功减少交通拥堵的调整方式保留下来。研究人员在开发软件时,正是基于这种对于高效流程和理想结果的奖励机制。'
