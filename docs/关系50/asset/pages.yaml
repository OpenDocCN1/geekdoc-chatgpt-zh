  md: '个数值明显低于对人工智能协助发明新药的平均接受度(6.41分)，以及对人工智能提供金融方面的建议的平均接受度(5.59分)。可见，要想介入人们的恋爱关系，人工智能还需要争取更多的信任。


    为了继续研究这个问题，我以128名美国成年人为代表性样本，向他们介绍了Replika，并向另外88名美国成年人介绍了《每日电讯报》为读者发明的聊天机器人。我向参与者展示了两段演示聊天机器人功能的视频，并让他们想象一个出现在未来的、仿人的聊天机器人。之后，我问他们是否愿意体验聊天机器人并与它们成为朋友。


    结果显示，参与者对这两个聊天机器人都没什么兴趣，两者之间没有统计学差异。在0～10分的范围内，两组参与者在体验机器人的意愿方面的平均得分为3.6分。在播放完视频之后，我问他们是否愿意与这些聊天机器人成为朋友，他们的平均得分也很低，只有3.9分。为了让调查结果更直观，我还询问了参与者在生活中拥有人类朋友对他们来说有多重要，他们的平均得分为7分。


    在接下来的研究中，这种对人工智能的抗拒态度发生了显著变化。在一项调研中，我想看一看这种抗拒的态度是否取决于整个社会对人工智能的接受度。换句话说，如果拥有一个人工智能朋友成为常态，人们的态度会发生变化吗？


    我以426名美国成年人为代表性样本，让他们“想象一个世界，在这个世界里，每个人都至少有一个说活、长相和行为都与人类一样的虚拟朋友”。接着，我问他们是否想拥有一个这样的朋友，以及是否会喜欢与这样的朋友相处。结果发现，这种心态上的改变对参与者的评分产生了很大影响，如图6-2所示。'
