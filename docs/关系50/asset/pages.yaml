  md: '的确，关系5.0与关系4.0有一些区别，但我认为两者并没有本质上的区别。实际上，新科技支持个性和单身的发展，在信息社会中也已发生。比如，互联网上各种资源和游戏，已经给单身者和独居者提供核心家庭情感、陪伴功能的替代品。AI伴侣只是加剧单身社会的趋势。


    并且，迄今为止AI并未具有自主意识，并非真正的主体，仍然是人类的工具。所谓“AI作为情感主体”，实际上是人赋予AI更高的情感地位，并非意味着AI拥有全部的类人情感活动。机器人能够通过计算识别主人的情绪，也能通过计算以某种方式，如面部表情对主人表达情绪。但是，因为AI没有心，说AI“有感情”，实质上说的是它“看起来像是有感情”。


    显然，关系5.0时代刚刚启幕，人们对人机亲密关系接受度还有待提高。对此，奇斯列夫态度激进，呼吁大家停止“人工智能产品只是一个机器”的质疑，将之视为“朋友”“伙伴”“伴侣”，以更积极的心态拥抱人机亲密关系。因此，他建议：“我们需要为关系5.0时代的到来做好准备，在这个时代，我们将与人造生物互动，甚至关心它们，就像关心我们的宠物、环境、朋友和同事一样。”


    在现有的社会价值观之下，《关系5.0》无法回避AI伴侣可能导致诸多社会问题和伦理风险。首先是各种歧视导致的问题，如性别、种族、年龄、阶级、国籍和性取向等方面的歧视。比如，“AI老婆”是外形年轻漂亮、金发碧眼的美女，其中就包含着歧视因素。其次是隐私和安全问题。比如，联网的AI伴侣泄露家庭隐私信息。最后是物化他人问题。也就是说，长期使用AI伴侣，容易在真实的人际交往中将他人当作工具。不过，奇斯列夫将这些问题产生归根于人性而非技术的缺陷，并认为“我们现在面临的最大挑战并不是技术层面的，而是道德和教育层面的。我们应该害怕的不是机器人，而是我们自己”。


    应该说，奇斯列夫的观点颇有道理。不过，《关系5.0》忽视AI伴侣可能导致最致命的风险，即我所谓的“人的机器化”。过多地与机器打交道，可能导致人类身心的改变。比如，更多借助机器从事体力工作，人类身体的强壮度不断降低。再比如，更多依赖计算机进行脑力工作，人类思维的活跃度不断降低。AI伴侣的特殊之处在于，它侵入的不是工作场所，而是人类情感、性爱和家庭等最为隐秘的领域。长期与AI伴侣亲密接触，人类肯定会越来越AI化：说话越来越有AI味，行为越来越像机器人。当'
