  md: '他们给出了两种主要理论来解释在人类历史后期发生的这种转变，两者都比较有代表性。第一种理论是，这种转变的发生是因为性伴侣不固定导致女性经常孤身一人，而男性也没有足够的能力去争夺与多名女性生育后代的权利。第二种理论是，人类采用社会性一夫一妻制是为了应对不断增加的杀婴风险，这种风险导致母亲们急于严密地保护自己的后代。


    讨论到这里，一个十分有趣的问题出现了：在今天看来，这两种解释似乎都已经过时了，那未来会发生什么呢？在当今社会，除父母之外，法律和执法机制也会保护儿童，现代生殖技术也已经发展到不需要发生性关系、不需要性伴侣就可以实现生育的程度。在未来，我们是否会看到社会性一夫一妻制迅速崩塌，人类回到各种类型的性关系混合的关系？或者，这种转变已经开始了？我们将在后文中深入讨论这些问题。


    # 两性关系的基础：基因选择和避免近亲繁殖


    为了将前文所讨论的内容联系起来，我们现在回到本章的焦点问题：科技如何影响狩猎采集社会中的亲密关系的建立？在了解了狩猎、采集、捕鱼、捡食肉类、建造住所等所使用的技术之后，只要找到这些技术之间的联系，我们就能理解科技对史前人类建立关系的根本影响。


    # 关系的进化 以生存为核心的关系


    所有史前科技相结合，共同影响了狩猎采集社会的发展，促进了小规模部落的形成和平等主义的盛行，而这又使集体利益成为整个社会关注的焦点（与当今西方社会个人主义盛行的情况不同），因为这种社会结构有助于高效地寻找食物和住所。在狩猎采集社会，养育孩子的责任通常由母亲和祖母而不是家庭或夫妻承担，她们在育儿时会互相帮助。在其他情况下，育儿责任由部落大家庭承担。狩猎采集部落对小规模的坚持和以生存需求为本的追求也表明，当时的两性关系的基础是基因选择和避免近亲繁殖，而非浪漫主义和长期的情感依赖。


    因此，群体内部的配对结合和不同群体之间的“联姻”变得越来越自由，男人和女人都可以随意选择伴侣。由于生存需求是核心，关系1.0的主要'
