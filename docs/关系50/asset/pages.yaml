- pgno: 143
  md: '的人, 另一些人则可以在一个没有人对自己评头品足的环境中练习、提高性互动技巧。在未来的几年里, 扩展现实技术的这些应用可以根据用户的需求为关系, 尤其是亲密关系锦上添花,
    甚至取代亲密关系。


    除了这些积极的前景, 一些研究人员也提出警告: 扩展现实技术可能会导致人与人之间的接触减少, 以及人被物化甚至婴儿化的现象。此外, 由于目前扩展现实产品的多数用户都是男性,
    他们还对这个行业存在的性别偏见提出了警告。我在研究中也发现, 男性不仅更熟悉这项技术, 而且更喜欢它 (见图7-2), 这与女性和男性对待人工智能的态度不同。'
