- pgno: 61
  md: '工业社会城市生活的第三个方面是住房问题。为了逃离农村生活的不确定性，人们涌入城市寻找工作，城市人口迅速增长，住房问题急需解决。大多数城市并没有准备好应对这种转变。原先居住在城市的商人和劳工并不多，大量非熟练工人和半熟练工人的涌入给城市发展带来了沉重的负担。


    在整个工业时期，许多国家的政策制定者和城市规划者都在努力应对劳动力的快速增长。作为一种短期解决方案，临时住房挤满了城市，但居住条件并不理想。很多临时住房是用木材仓促建造的棚屋，供贫困的工人居住。在那几十年里，工人所住的临时住房都非常简陋。建筑的质量通常很差，里面挤满了工人，又脏又乱。在早期的城市里，污染严重，疾病肆虐，而工人們收入微薄，只能和其他人一起挤在负担得起的房子里。


    与此同时，由于工业社会早期没有发达的交通网络，每天的工作时间又很长，工人只能住在离工厂很近的地方。早期的城市没有便捷的交通工具，普通工人又买不起马，因此工人们的住处通常位于工厂和车间附近，一家人住在廉价楼房的单间里。为了容纳更多的家庭，这些楼房通常建造得很密集。


    这种房屋通常没有管道系统和独立卫生间，个人清洁需要在外面的公共卫生间进行，或者用锡盆从附近的水井里取水到屋子里来清洗，而且公共卫生间只能满足基本的洗漱需求。1883年出版的社会纪实作品《伦敦郊外的凄泣》（The
    Bitter Cry of Outcast London）描述了这种情況，在英国议会引起了轰动。这本小册子中写道：“墙壁和天花板都是黑色的，由于多年未打扫而积满了污秽。污物从天花板的裂缝中渗出来，顺着墙壁向下蔓延，房间里没有一处是干净的。”


    在美国这种移民国家，移民群体经常出于同舟共济的目的聚集在一起，他们居住的地方会逐渐形成一个以该移民群体命名的社区，如纽约的唐人街、巴尔的摩的小意大利、芝加哥的捷克社区（Czech
    California）等。移民们在这些社区建起自己的教堂、购物区和社交俱乐部。在当时，非裔美国人通常被安置在破旧、拥挤的住宅区，与白人隔绝开来。


    社会不平等、工作的标准化和住房问题造成了精神上和身体上的碎片化，最终发展成为家庭核心化，关系3.0开始形成。'
