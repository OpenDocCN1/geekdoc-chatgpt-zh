- pgno: 183
  md: '预, 以确保人工智能的发展符合道德准则, 只有17.5%的人表示该行业可以自我监管, 其余的人表示不确定或没有回答。与我开展的相关研究得到的结果一样,
    年龄因素也会影响人们的看法, 此调查中的年轻受访者更倾向于把这些问题留给行业处理。例如, 15～24岁年龄组持这一观点的人数(24.4%)几乎是55岁以上年龄组(13.3%)的2倍。然而,
    即使是在年轻人中, 大多数受访者也更倾向于政策干预。有趣的是, 男性(49.5%)比女性(43.5%)更支持政策干预, 尽管在我的其他研究中, 男性比女性更支持新兴技术的发展。


    为了撰写本书, 我采访了许多专家, 他们都认为人工智能发展过程中的问题并不会带来危及生命的风险, 但我们至少应该重视马斯克提出的人工智能可能是“人类文明面临的最大威胁”的警告,
    谨慎对待道德挑战的威胁, 以公正的方式发展与人类情感相关的技术。


    政府也需要跟上科技发展的步伐。根据人工智能分析公司Cognilytica在2020年发布的报告, 就新兴技术的使用规范或人工智能、扩展现实和机器人的应用和发展中的偏见问题,
    目前世界上还没有一个国家制定具体的法律或监管政策。政府当前解决的主要问题是在线数据的保护、自动驾驶汽车和人工智能武器的监管。直到2024年, 欧洲议会才推动了更广泛的人工智能技术监管法规,
    尽管这些法规仍然不完整。一些国家都在积极考虑新兴技术的使用规范, 并围绕这一话题进行了深入的讨论, 但仍处于“观望”阶段。


    我们应该预见到人工智能的道德困境, 并在日常生活中遇到这些挑战之前解决它们。如果专家或政策制定者给出解决方案或指导方针, 这将缓解公众的恐惧, 并以一种更有益的方式支持人类与科技建立关系。


    # 关系的进化 关系5.0时代, 我们面临的主要问题


    虽然本书不涉及新兴技术伦理学, 但我希望读者能够深入思考这些技术带来的问题。简单来说, 我们在关系5.0时代主要面临三种类型的问题: “它们”的问题、“我们”与“它们”互动的问题,
    以及“我们”的问题。第一种问题关注的是“它们”, 是人造生物的研发问题, 以及其中是否存在偏见; 第二种问题是关于我们与人造生物互动的问题, 比如隐私问题,
    如何让它们保守我们的秘密; 第三种问题是关于人类自己, 以及我们与人造生物建立联系时的体验问题。'
