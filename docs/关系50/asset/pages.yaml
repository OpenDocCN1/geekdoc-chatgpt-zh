- pgno: 149
  md: '莱考夫是世界知名语言学家和认知科学家，“认知语言学之父”，其经典著作《别想那只大象》不仅教我们在话语角力中抢占高地、达成目标，还可以让我们变得不那么容易被引导、操弄和煽动。该书中文简体字版已由湛庐引进、浙江人民出版社出版。——编者注


    为了理解具身认知为何是人类体验的核心，我们可以看一看不同语言和文化中隐喻的使用。1980年，哲学家和认知语言学家乔治·莱考夫（George Lakoff）®和马克·约翰逊（Mark
    Johnson）出版了开创性著作《我们赖以生存的隐喻》（Metaphors We Live By），书中提到一个现象：人们在描述幸福感时总会将其与躯体“向上”的感觉联系在一起，他们会说“站在世界之巅”、“开心到飞起来”或者“飘飘欲仙”，几十种语言中都有类似的隐喻。人们用来描述其他感受的短语也体现出这种联系。例如，用“心情跌到谷底”来形容悲伤，用“来电的感觉”来形容令人怦然心动的爱情，用“心情沉重”来形容忧郁苦闷。


    如果我们接受这种观点，认为认知过程与动作和身体有着千丝万缕的联系，那么《副本》中展示的技术就会变得不现实。也就是说，作为意识的具体体现，身体与我们的日常认知是分不开的。这就意味着我们与他人交谈的时候需要结合对方的肢体语言才能完全理解对方说的话。从人际关系的角度来看，这意味着把我们吸引到一个特定的人身边的不仅仅是他的所言所想，还有他的肢体语言。在恋爱、朋友或其他关系中，肢体语言是我们作为一个完整角色的组成部分。


    因此，根据具身认知理论，研究人员正在开发的人工智能数字化意识是无法复制人类的。离开了躯体，人类的意识就会变得不完整。如果没有肢体语言作为补充，人类将难以与机器进行身体、精神和情感上的互动。想象一下给Alexa或Siri加上一个实体的躯体，它们在回答你的问题时会做出相应的手势，或者在向你道晚安时露出一个美丽的微笑，这些才会使它们在与人类互动时像真实的人。


    事实上，认知科学家认为人类的动作、语言、生理反应和情绪之间存在复杂的四向相互作用，这个概念整合通常被称为观念联觉（ideast hesia）。因此，在人工智能设备中复制人类体验是一个巨大的挑战。程序员必须将数字化的大脑载入一个躯体，并让其以认知和身体表达相结合的方式与人类互动，才能给人以真实感。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '虚拟现实和增强现实等扩展现实技术可以解决其中一些问题,但更全面和直接的方法是为人工智能提供实体机器人这种形式的“副本”。虽然实体机器人比单独的人工智能甚至扩展现实技术都要昂贵得多,但它有自己的优势。实体机器人拥有一系列功能,不仅涉及实体层面的技术能力,还涉及情感表达与智能反应水平。与其他虚拟技术不同的是,我们可以用手触摸实体机器人,用肉眼直接观察它们。此外,目前正在开发的人造躯体是关系5.0的一个关键方面,如果没有它们,我们将无法依靠技术来执行实际的任务,也无法通过身体上的互动获得亲密感。因此,人工智能领域的领导者英伟达在2024年的开发者大会上展示了一款人形机器人,这表明该公司认为物理领域的变革同样重要。


    我向340名美国成年人提出了一个问题,即人工智能技术缺少了什么让他们感到不满意,37%的人指出是身体方面的问题。他们表示,机器人要能够行走并进行其他人类活动,还要拥有更像人类的外表,甚至能够做出表情。相比之下,他们对其他抽象功能的要求比较低,比如17%的人希望机器人有感受能力,16.5%的人希望它们掌握认知技能,14%的人希望它们具备灵活应变的能力。


    本章将讨论关系5.0的第三场革命,即实体机器人革命。我们将探讨科技拥有实体躯体后对人类与其互动的影响,并介绍社交机器人领域的进展。本章内容表明,机器人就像智能手机一样,很快就能为用户提供情感陪伴。


    # “恐怖谷理论”,与人类过于相似反而引起最强烈的负面反应


    听到“机器人”这个词时,你会想到什么?科幻小说、过时的舞步还是未来的地球居民?答案可能因人而异,但每个人都不会对机器人感到陌生。今天,人们可以在杂货店、餐馆、博物馆、酒店、学校、机场和医院看到机器人,它们按用途分为工业机器人、军事机器人、教育机器人等。


    与此同时,机器人的数量也在增加,它们不仅出现在企业和工厂中,还走进了千家万户。有了人工智能技术,机器人变得越来越智能,对人类指令的依赖越来越少。它们越来越精密,材料成本则越来越低,功能也越来越多样化。许多家庭已经用上了扫地机器人、自动洗碗机和自动割草机。它们可能长得与我们想象中的机器人不太一样,但它们本质上就是机器人。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '然而，我们面临的挑战是制造出能与人类建立关系的人形机器人。现有的机器人一般可以分为提供技术支持和提供情感支持两类，后者通常被设计为具有人类一样的外观，被称为社交机器人，这一类机器人很有可能会改变人们开展社交、维系关系的方式。


    “robot”(机器人)一词源自捷克语中表示被迫劳动的“robota”，最早出现在科幻作家卡雷尔·恰佩克 (Karel Čapek) 1920年的科幻戏剧《罗素姆万能机器人》(Rossum''s
    Universal Robots)中。剧中的生化人(机器人)由一家工厂用合成有机材料制造，它们可以像人类一样思考，最初为人类服务，但最终联合起来发动了一场反抗人类的叛乱。虽然很难确定机器人历史的起点，但可以说《罗素姆万能机器人》激发了作家和科学家的想象力。到1923年，它被翻译成30多种语言，在接下来的几十年里，发明家们对设计机器人越来越感兴趣。


    这些发明家中最重要的一位是乔治·德沃尔（George Devol），他在1954年为他的机器人“Unimate”申请了专利。Unimate是一只机械手臂，可用于汽车装配线上的压铸件焊接，这项工作非常危险，很容易导致工人受伤。1961年，通用汽车公司买下了Unimate的使用权，并将它安装在生产线上，它也因此成为世界上第一个工业机器人，让无数工人免受工伤之苦。


    与此同时，人工智能领域的研究者开始研发更智能的机器人。1966年，世界上第一个具有推理能力的多功能机器人Shakey的出现成为头条新闻，科学家和发明家对机器人的认识和研发也受到了关注。机器人很快打入了流行文化领域，仅仅10年之后，“星球大战”系列电影中两个可爱的智能机器人C-3PO和R2-D2就引发了消费者对机器人制造的兴趣。


    20世纪80年代中期，机器人开始走出电影和实验室。本田公司启动了人形机器人项目，开发了编号从E0到E6的7个基础机器人。1993年，该项目的工程师研发出了一个新机器人系列，命名为P1到P3，并配上了上肢，使这些机器人能够行走、挥手和握手。该项目的巅峰是ASIMO的问世，这个机器人是许多日本人的骄傲，在美国前总统巴拉克·奥巴马访问日本期间，ASIMO向他展示了自己踢足球的能力，一举成名。“ASIMO”这个名字是向著名科幻小说家艾萨克·阿西莫夫（Isaac
    Asimov）致敬，也是Advanced Step in Innovative Mobility（创新移动领域的开创性进步）的缩写。ASIMO的身高和体重与一名小学生相当，它配备了许多技术，如多功能紧凑型多指手和通信功能等，可以走路、向前跑、倒着跑、单腿或双腿连续跳跃。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '21世纪初, 实体机器人革命势头强劲, 机器人产品真正实现了爆炸式增长。例如, 索尼公司推出了一款名为Qrio的小型人形娱乐机器人, 富士通公司也推出了首款人形机器人HOAP-1,
    随后又推出了HOAP-2和HOAP-3。


    21世纪10年代, 更加先进的机器人进入人们的视线。例如, RobotCub Consortium集合了欧洲几所大学的顶尖科学家, 推出人形机器人iCub,
    它有着硅胶感的柔软皮肤, 传感器由意大利技术研究院制造。它高104厘米, 相当于5岁小孩的身高, 可以像小孩一样行走和爬行。它的独特之处在于“皮肤”具有感知触摸的能力,
    如果撞到墙壁或桌子, 它会像人类一样感到“疼痛”。Nao是法国机器人公司Aldebaran开发的一款机器人, 它小巧灵活、可编程, 被世界各地的大学广泛用作研究平台和教育工具。


    当今最著名的人形机器人当属Sophia °Sophia由汉森机器人技术公司于2015年开发, 以奥黛丽·赫本为原型, 结合了人工智能、视觉数据处理和面部识别等技术。Sophia参加了世界各地的许多活动和电视节目,
    甚至成为世界上第一个获得公民身份(沙特公民身份)的机器人, 这表明各个国家和组织已经认识到机器人的重要性。2021年, 汉森机器人技术公司开始大规模生产Sophia,
    以用于医疗保健行业。到了2024年, Sophia在世界上主要作为机器人的代表而存在, 而不仅仅是因为它有了更多其他用途。


    工程学的发展已经证明, 机器人可以补充甚至取代一些最基本的人类互动。美国电气电子工程师协会 (Institute of Electrical and Electronics
    Engineers, IEEE) 列出了数十种功能强大的机器人, 它们已经在全球范围内改善人类的生活条件, 重塑人类的生活方式。国际机器人联合会 (International
    Federation of Robotics, IFR ) 报告称, 从21世纪10年代末到20年代, 全球机器人销量的年增长率保持在30%左右。


    # 关系的进化 什么是恐怖谷理论


    现在的主要问题是所谓的恐怖谷理论（ uncanny valley theory ），该理论是由东京工业大学的一位机器人学教授在1970年的一篇论文中提出的。简单来说,
    那些与人类非常相似, 但又不完全相似的机器人会引起人们最强烈的负面反应, 而那些与人类的相似程度较低或与人类完'
  merge: -1
  img_proc: true
- pgno: 153
  md: '全一样的机器人更有吸引力，就好像在一个山谷周围形成了“山峰”。那些与人类相似而又不完全相似的机器人会引发用户的排斥和恐惧，这在短期和中期内阻碍了仍在不断完善的机器人产业的发展势头。


    因此, 尽管机器人技术取得了不小的进步, 研发人员仍然需要努力跨越恐怖谷, 让社会接纳机器人。目前, 人们对机器人的表现仍然不太满意, 它们有时会对社交信息做出错误解读,
    影响人们的情绪, 降低人类伙伴的信任程度。


    一个可能的解决方案是多家公司联合研发。例如, 一家公司或研究机构开发出一种功能, 比如像人一样走路或拥抱, 而另一家公司或研究机构开发出一种补充功能, 比如复杂的面部表情,
    但目前市面上还没有人形机器人将多种组件连接起来, 并集成到一款具体的产品中。一些机器人集几种功能于一体, 如非常逼真的人形机器人艺术家Ai-Da, 但它们还远远不够完整。即使到了2024年,
    尽管特斯拉已经展示了其第二代、更具先进性的人形机器人Optimus ——该机器人集成了许多基于人工智能的创新, 谷歌也成功地将语言理解、视觉分析和庞大的动作库这三个关键组件整合到机器人中,
    但仍然没有出现一个包含所有额外组件的完整整合方案。不过, 终有一日研发人员会将各种新兴机器人技术结合起来, 并将各种组件集成功能齐全的人形机器人。这种先进的机器人一旦进入市场,
    预计将以指数级的速度发展, 人们很快就将拥有一个 人形机器人朋友陪伴在身边。


    我在采访该领域专家的过程中发现, 另一个比较有前景的解决方案是将混合现实技术与机器人技术相结合。根据这一设想, 用户可以戴上头戴式一体机或智能眼镜, 将人类的影像投影到一个通用的人形机器人模型上。一旦这种方案得到完善,
    研发人员就可以创造出一个在视觉上与人类无异的机器人。如果这种方案得以施行, 我们就可以大规模生产机器人模型, 当用户没有戴混合现实眼镜时, 这些通用模型看起来是一样的,
    而一旦用户戴上一体机, 并选择他们希望赋予机器人的具体特征, 这些机器人模型就会发生巨大变化。如此将感官革命与实体机器人革命结合起来, 还可以解决恐怖谷的问题。在人工智能技术的帮助下,
    三场革命结合的“铁三角”能够带来真正的突破。


