- pgno: 12
  md: '各种新型的社交方式。从那时起，人们可以通过设计精美的社交网站和应用程序建立、发展关系，社交压力得到了缓解。新技术为人们提供了轻松结识新朋友并与之互动的机会，省去了面对面交流带来的很多麻烦，也不用担心遭到陌生人的当面拒绝。


    点击、滑动、点赞、分享，人们逐渐学会了用这种新的方式去开展社交、建立感情。科技让人们在建立人际关系时变得更灵活、更多样化、更具创造力。通过社交媒体和约会软件，人们在家中就能与他人建立联系并展开交流，放松地待在自己的情感舒适区。


    从那时起，技术发展的速度开始加快。技术从一个人们互发消息和照片的“被动”平台，摇身一变成了一个“主动”的红娘。Zoosk、Match和Elite等约会软件开始收集人们的年龄、爱好、兴趣、目标和价值观等个人信息，并与其他用户的信息进行比较，为人们寻找一些可能符合他们偏好的、匹配度较高的对象。这些复杂的算法甚至可以分析人们点击和滑动手机屏幕的模式，它们会计算人们在没有阅读某人的个人资料的情况下，在那个人照片上停留的时间。结果令人吃惊：对于那些匹配度很高但我们不想交流的人，系统会提示我们去和他们聊天，像一个唠叨的家长一样坚持让我们给他们一个机会，而这些建议通常被证明是非常正确的。


    这个简短的技术发展历程回顾向未来提出了一个问题：技术是否比我们更了解我们自己？在某些方面，算法确实比我们更灵活，更能够看清我们的本质，并不像我们想象中那么机械。我们通常认为人类是有意识的，而机器缺乏自我意识。然而，事实证明，机器虽然还没有自我意识，但有时对我们的需求和欲望比我们自己更敏感。换句话说，作为人类，我们有时候会被人性中的固执和专注所蒙蔽，对摆在我们面前的各种可能性视而不见。有些算法足够灵活，能够意识到许多我们看不到的可能性。


    当我们还在惊讶于这些令人眼花缭乱的技术时，根本性的社会变革很快就发生了，这些变化是我们预测未来的技术对社会的影响时至关重要的因素。通过应用程序和社交网站，科技使各种类型的联系方式和轻松随意的关系统成了主流。Tinder、Bumble和Grindr等约会软件都迎合了那些正在寻找长期或短期恋情、一夜情或柏拉图式关系的人。事实上，这些类'
  merge: -1
  img_proc: true
- pgno: 13
  md: '型的关系本身并不是什么新鲜事, 只是科技公司让人们的选择面更广、更容易建立关系, 社会动力迅速朝着人们意料之外的方向变化。


    人们很快就适应了这些变化, 并相应地改变了自己的社交习惯。例如, Tinder每天有20亿次浏览量, 每周有超过100万次约会, 研究结果显示, 超过1/3的约会导致了随意性行为。通过这种方式,
    Tinder满足了人们对随意关系的需求, 并将这种约会模式迅速传播到190多个国家或地区, 在几年内改变了全球用户的社交惯例。


    毫无疑问, 这只是一个漫长进程的开端。我们对未来充满了好奇: 我们还有什么需求? 技术将如何满足这些需求? 以这种技术的发展速度, 几年之后会发生什么?


    虽然我们已经意识到科技发展有助于关系的建立, 但我们对这些变化的适应如此之快是一个值得深思的现象。几年前我们还不习惯在网上寻找约会对象, 现在这已经普遍到如果你告诉别人你的约会对象是在现实生活中遇到的,
    别人会觉得很神奇。那么若干年后, 对于那些在当下看来“不正常”的现象, 例如拥有一个机器人女友 / 男友, 我们又将如何看待呢？当技术不再仅仅是关系的推动者,
    而是能够真正满足人们的社交、情感和身体需求时, 又会发生什么呢？


    现在的我们已经习惯于让亚马逊的Alexa播放我们喜欢的歌曲、回答简单的问题、提醒我们重要的日程。新冠病毒感染疫情让我们看到, 人类可以多么迅速地将人际互动转移到在线平台上,
    以及多么迅速地适应用新的技术手段与所爱的人联系。未来又会出现怎样的变革呢? 科技已经不再只是扮演牵线搭桥的角色, 而是正在转变为关系中的另一半, 成为一个独立的行动者,
    我们必须理解这种变化的意义。


    # 如何理解关系4.0前的演变, 决定我们如何理解未来


    了解人类从史前时代初期一直到今天的关系模式是如何演变的, 有助于我们理解人类正在经历的变化。从原始的狩猎工具到自动驾驶汽车, 科技是如何影响人类的? 当我们找到了这个问题的答案,
    我们可能会更好地理解科技发展在未来如何影响人类。此外, 对人类历史上各种形式的关系的认识, 或许会让我们看到它们在未来可能承载的意义和发生的变'
  merge: -1
  img_proc: true
- pgno: 14
  md: '化, 让我们知道不必局限于近代史上常见的关系模式, 因为它们会随着科技的发展而不断演变。


    鉴于上述情况, 本书第一部分介绍了人类历史上的四个重要时期, 每个时期都是由基础技术的发展所引领的。第一个时期是狩猎采集社会（社会1.0）, 它建立在狩猎、采集、捕鱼和捡食肉类等基础技术的基础上；第二个时期是农业社会（社会2.0）,
    它以农业科技为基础；第三个时期是工业社会（社会3.0）, 以蒸汽机、电力和标准化生产等创新科技为基础；第四个也是最近的一个时期是信息社会（社会4.0）, 以计算机和互联网等技术为基础。


    核心家庭是指一对夫妇及未婚子女组成的家庭, 通常称为“小家庭”。——译者注


    接着, 我将展示人类历史上的这些科技变革如何深刻地影响人们的关系。在史前时代, 部落是一个社会的核心, 当时的关系(关系1.0)更随意, 流动性更强; 在农业时代,
    多代同堂的家庭结构占据着主导地位(关系2.0); 随着工业化的进程, 核心家庭变得越来越重要（关系3.0）；在信息时代, 网络化个人主义具有很大的影响力（关系4.0）。


    当然, 对于生活在同一时代的人, 哪怕是最激进的研究人员也不会认为他们在所有文化和社会中有着相同的感受, 并以相似的方式与他人互动。我希望以更温和的方式来表达本书的观点,
    即每个时代都有一 种占据主导地位的关系模式, 而这种倾向在很大程度上受到科技的影响。


    现在, 科技正推动着人类社会走向第五次进化。2016年, 日本政府提出“社会5.0”一词, 用来描述人类发展的下一个阶段。在这个阶段, 机器人、生物技术、人工智能、量子计算、信息物理系统和纳米技术的重大突破将结合起来,
    彻底改变人们的生活方式。这一时代区别于其他时代的主要特征可以定义为, 科技从控制人类环境和工作的工具转变为一种生态系统并融入人们的生活。在这个“超级智能”社会,
    即社会5.0, 技术融入了人类的生活并成为独立的个体, 人类或将经历一场与文明史上最大的变革同等规模的社会变革。


    我认为, 这些新技术的出现以及它们与人类关系的融合, 标志着第五种关系模式的形成。本书旨在概述这种情况发生的具体方式, 并展示其带'
  merge: -1
