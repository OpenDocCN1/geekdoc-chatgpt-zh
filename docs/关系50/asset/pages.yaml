- pgno: 134
  md: '智能芯片。Hailo的芯片能够提供更好的性能,消耗更少的电力,并且可以推动扩展现实行业向前发展。


    新型扩展现实设备不断问世,新的视频硬件、人工智能芯片、生产制造方式、声频技术和身体传感器也在研发中,用户体验将不断提升、更加全面。此外,网络连接的改善和5G网络的部署也为这些应用提供了支持。可以肯定的是,所有这些努力和数十亿美元的投资将会解决目前困扰着消费者的技术问题。当被问及类似于《头号玩家》中的虚拟世界的元宇宙是否会大量出现时,英伟达首席执行官黄仁勋回答说:“答案是肯定的。我认为元宇宙的时代就要到来了,而且不止一个元宇宙。未来会出现许许多多的元宇宙,它们都是基于虚拟故事背景。例如,有些元宇宙将基于时下流行的游戏,像《我的世界》(Minecraft)、《堡垒之夜》(Fortnite)、《战地》(Battlefield)、《使命召唤》(Call
    of Duty)等各种类型和风格的游戏,你会看到《巫师》(The Witcher)元宇宙、《魔兽争霸》(Warcraft)元宇宙以及其他成百上千个元宇宙,这让人非常期待。”


    当扩展现实技术变得越来越强大并拥有越来越多的可能性时,我们还要思考一个重要的问题:在关系领域,用户能否信任扩展现实技术,让它介入情感联系的建立。换句话说,尽管感官革命在理论上听起来不错,但这需要实例来证明,尤其是在激发人们的情感和使人产生依恋方面的应用。因此,我们来看一看扩展现实技术在未来的关系中的潜在应用。


    # 问题的关键是提高人们的接受度


    人类对扩展现实做出反应时,是否真的将其视为我们所熟悉的物理现实的延伸?我们的大脑能否被重塑以接受这种人造现实,并在情感和精神上受到它的影响?虽然扩展现实技术为人们提供娱乐是非常容易的,但只有当人们被这项技术深深影响,甚至对虚拟角色产生情感依恋时,它才应该被视为一场真正的革命。


    为了解开这些疑问,我拜访了菲利普·林德纳(Philip Lindner),他似乎是解答这些问题的最佳人选。林德纳身兼两职,既是注册临床心理学家,也是瑞典卡罗林斯卡学院的博士研究员。他撰写过数十篇关于扩展现实的研究论文,包括最近的一篇综述虚拟现实的过去、现在和未来的文章。我提出人类是否有可能与虚拟角色建立关系的疑问,他明确地回答说:“答案是一定可以,人们已经在虚拟世界中建立了有意义的关系。例'
  merge: -1
  img_proc: true
- pgno: 135
  md: '如，有人在游戏《魔兽世界》中找到了一生的挚友，有人甚至在游戏中结婚了。事实上，真正的阻碍并不是当前的技术水平，而是如何让虚拟现实产品走进人们的生活并深深吸引住他们。”


    林德纳指出，人类与虚拟角色建立关系所面临的主要问题是扩展现实技术的吸引力，这一点从我在上文展示的研究结果中也可以看出。尽管扩展现实技术的沉浸感更强，但从用户体验来看，它不如人工智能技术那么受欢迎。


    如何提高人们对扩展现实技术的接受度依然是问题的关键。许多人对虚拟世界中的人际关系表示担忧，认为它不真实、无法令人满意，甚至不健康。38岁的夏洛特是一名来自科罗拉多州诺伍德市的已婚女性，她说：“我认为对虚拟角色产生依赖是不健康的，而且很奇怪。我认为它不能给人真正的满足感，它只是被程序员设计成以某种方式做出反应，这对人们来说是一种误导。”44岁的伊莱贾是一名来自俄亥俄州的单身男性，他也表达了自己的见解：“它们确实对人类有帮助，但我们必须始终牢记它们（虚拟角色）不是人类。‘仿人’做得再逼真也不可能与‘真人’相提并论。我想大多数人都明白这一点，因而很难接受技术与情感之间的纽带，毕竞任何人都能‘爱上’一个虚拟‘人’的说法实在有些牵强。”


    与夏洛特、伊莱贾持相同观点的人所质疑的是，扩展现实能否真实到足以激起用户的情感，甚至让用户产生依赖。我们已经讨论了扩展现实技术的社会接受度，但在拥抱这项技术之前，我们必须先了解感官革命的力量，以及为什么很多事情看起来难以置信，实际上是有可能变成现实的。


    # 扩展现实将激发人们的真情实感


    我们首先需要弄明白的是，扩展现实技术的沉浸感是否可以超越其他技术媒介，激发出更深刻的情感。麻省理工学院曾经做了一个实验，试图回答这个问题。研究人员进行了为期两周的对照研究，实验组使用了带有娱乐内容的虚拟现实系统，对照组则观看一台普通电视播放的相同内容。结果显示，相比对照组，实验组受益更多。根据实验报告，实验组的社会孤立程度更低，抑郁迹象较少，幸福感更高。


    鉴于虚拟现实对人类的影响，心理学家尝试用它来治疗心理疾病。这些尝试最初遭到了该领域的专业人士的质疑，他们认为，科技无法取'
  merge: -1
  img_proc: true
- pgno: 136
  md: '代专家在多年的实践和学术培训中获得的技能。然而，最近的研究表明，在引导出患者的情绪方面，虚拟现实技术不逊色于专家，获得的临床结果也类似，甚至更好。


    例如，虚拟现实技术越来越多地应用于暴露疗法（exposure-based therapy, EBT），以治疗恐惧症。虚拟现实和暴露疗法的结合（VR-EBT）成功地用于治疗军人、暴力犯罪受害者和性虐待受害者中患有创伤后应激障碍的人。在心理治疗中，VR-EBT被证明确实是有效的，有研究将缓解焦虑的药物D-环丝氨酸与VR-EBT结合使用后发现，后者使药物治疗变得多余。单纯的VR-EBT就可以显著改善患者的健康状况，并减少复发。


    另有研究表明，虚拟现实技术的潜在应用范围远远超出基于暴露疗法的领域。一项研究展示了如何利用虚拟现实技术来帮助人们更好地进行自我关怀。15名患有临床抑郁的成年人参与了一个8分钟的虚拟现实场景，研究人员先让他们进入一个虚拟角色，并指示他们通过赞美和积极的评价来表达关怀，之后他们进入第二个虚拟角色，接受了从他们所进入的第一个虚拟角色那里传递来的关怀。经过三次这样的练习（总用时不到30分钟），参与者的自我批评显著减少，抑郁程度明显降低，自我关怀增加，在某些情况下，这些改善会持续到4周之后。


    虚拟现实技术还可以用于激发人们在认知和情感层面理解他人、与他人共情的能力，一项研究通过使用虚拟现实技术向红绿色盲患者传递同情证明了这一点。两组视力正常的参与者沉浸在两种虚拟现实场景中，第一组参与者沉浸在色彩正常的世界，第二组参与者沉浸在红绿色盲患者所看到的世界。之后，他们需要辅助一个学生团体为色盲者创建一个网站。研究结果显示，那些沉浸在色盲者所看到的世界的参与者平均花费的时间、提出的建议数量是另一组的2倍。这不免让人想到在没有科技帮助的传统模式下，老师培养学生的同理心、父母培养孩子的同理心和心理学家培养患者的同理心时面临多大的挑战，同时也更加体现出科技的重要性。


    为了展示虚拟现实技术在心理治疗中的有效性，最近的一项对包括1057名参与者在内的30项研究的元分析表明，虚拟现实技术成功地用于治疗特定的恐惧症、表现焦虑（performance
    anxiety）、创伤后应激障碍、人格障碍和季节性情感障碍等。另一项对13项研究的元分析显示，在一系列指标上，精神障碍患者的病情都得到了改善。可见，虚'
  merge: -1
