  md: '笑话背后的微妙情感。有时我们用大笑来表达兴奋，有时又用它来缓解尴尬，或掩饰对失败的恐惧。这些独特的人类动力不会很快消失，没有人能剥夺人与人之间丰富的、相互交织的、复杂的情感联系。


    然而，技术在不断发展，关系的某些组成部分可能很快或者在未来几年内就会被模仿，这是我们无法回避的现实，也是本书的核心内容。即便是智能手机刚刚面世时也只具备基础功能，遭到了许多人的质疑，我们用了十几年的时间才认识到它的潜力，而其功能仍在不断增加。无论即将到来的社会变革的程度和速度如何，我们要做的是用开放的心态去面对、探讨这些变化。


    # 我们在基于什么讨论关系5.0


    本书的内容是基于我对最新文献的广泛研究，以及我和我的团队开展的多地点研究，我们使用了先进的统计模型，分析了来自世界各地的极具代表性的大型数据集。此外，我也通过在美国人口的代表性样本中提出封闭式和开放式问题来收集数据。我还运用了文本分析，系统地评估了与三场革命相关的科技产品。当然，我也向该领域的专家征询了他们对本书主题的看法和认识。借助这些研究方法，我能够用可靠的经验数据来解决本书中提出的问题，接下来我会对每一种方法进行详细介绍。


    > 欧洲晴雨表是欧共体委员会建立的一个专门项目，负责定期提供欧盟成员国民众对重大事件和问题的意见调查报告。——编者注


    我使用的数据大多来自美国和欧洲各国的社会研究调查。此外，我还研究了一些专门针对技术和机器人的调查，这些调查是由专门从事技术开发的组织开展的。最重要的是，我分析了欧洲晴雨表®的4个综合数据库，深入了解了人工智能、机器人和扩展现实在欧洲各个国家的应用，以及民众对它们的看法。我分析的第一个欧洲晴雨表数据库是2019年的“欧洲人与人工智能”调查。这项调查涉及33个国家的32543名15岁及以上的受访者，涵盖的主题包括人工智能的预期用途、对人工智能应用的担忧以及人工智能应用的伦理问题，所有的访谈都是在受访者家中以当地语言进行的，而且是面对面的交谈。我对这些数据进行了加权处理，以确保样本在性别、年龄、地区和城市化程度方面能够代表总人口的实际情况。'
