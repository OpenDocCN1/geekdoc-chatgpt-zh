  md: '![](img/9f2e212764a1fabdbc2575c9ad7ae804_175_0.png)


    # 图8-2 男性、女性对社交机器人接受度的对比


    我继续探索与机器人建立关系的可能性，结果显示，参与者的接受度大幅下降，性别差异也出现了。具体来说，男性比女性更支持与机器人建立关系，至少不拒绝与机器人进行身体上的亲密接触或建立情感联系的想法。在0～10分的范围内，男性在与机器人发生性关系和建立关系的接受度方面的得分为2.15分和2分，而女性在同一项测试中的得分为0.869分和1.24分（见图8-3）。'
