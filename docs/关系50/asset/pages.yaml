- pgno: 32
  md: '一些研究人员试图计算狩猎采集社会的平均基尼系数，该系数是衡量收入分配平均程度的一个指标。虽然对史前时代的社会资源分配进行精确的测量是不现实的，但他们通过估量部落成员的体重、狩猎成功率、财产以及社交圈的质量和规模等“财富”进行了估算。结果显示，狩猎采集社会的基尼系数约为0.25，与今天的丹麦相似，而丹麦的再分配财富占比甚大。相比之下，美国的基尼系数近年来一直在0.4左右徘徊，这表明美国社会竞争更加激烈、更加不平等。


    在现代狩猎采集社会中，我们也看到了这种平等主义的趋势。人人类学家詹姆斯·苏兹曼（James Suzman）花了近30年的时间研究布须曼人的分支之一朱／霍安西部落（Ju/’hoansi）。这是一个独立的部落，一直生活在纳米比亚和博茨瓦纳内，直到20世纪末，政府的介入破坏了他们原始的生活方式。在《工作的意义》（Work）一书中，苏兹曼介绍了这个狩猎采集部落为消除嫉妒和不平等所采取的公共策略。当部落里的一个猎人成功狩猎归来时，其他部落成员会上前去指责他，这种做法是为了让他不要太过骄傲。一名部落成员提到，大家会说他猎取的肉毫无价值，这是为了“让他冷静下来，使他变得温和”。此外，部落成员认为肉的真正主人并不是猎人，而是制造出杀死猎物的那支箭的人。这些策略使得“老年人、近视者、畸形足者和懒人也有机会成为人们关注的焦点”。


    虽然有一些例外，但许多现代狩猎采集社会相对来说都是比较平等的，人们积存财物是出于个人需求，而不是为了积累财富。在这样的社会中，储存物资的行为很少见，因为存货会成为迁徙时的负担，社会经济的核心依然是肉类、草药、水果和蔬菜等资源的共享和交换。因此，与现今社会不同的是，当时的社会并没有“富”和“穷”、“富人”和“穷人”的概念，拥有过剩的、消耗不完的物资被认为是一种负担，而不是身份地位的象征。


    事实上，利他主义在这样的社会中相当普遍。在对亚契人（Aché）的研究中，金·希尔（Kim Hill）观察到他们维持着一个游牧狩猎采集社会，以小规模群体的形式生活在巴拉圭东部。希尔指出，亚契人将10%的觅食时间用于利他合作，有时甚至会把超过一半的觅食时间花在利他活动上，例如为部落里的其他成员寻找水果、采集蜂蜜等。


    许多狩猎采集社会是以任务为导向建立起来的，个性和承诺没有任何吸引力，人们只看重结果。研究人员指出，在狩猎采集社会中，不同'
  merge: -1
  img_proc: true
- pgno: 33
  md: '年龄、性别和技能的人会负责特定的任务。例如，最厉害的猎人会带领队伍寻找猛犸象和其他猎物。如此细致的、量身定制的劳动分工提高了工作效率。这是一种以技能为基础的领导环境，它对社会中的性别平等、地位平等和年龄平等产生了深远影响。


    有趣的是,虽然黑猩猩是人类的近亲,但是它们的社会远非平等主义社会。黑猩猩社会建立在一个明确的等级制度之上,在这个制度中,雄性领袖支配着其他黑猩猩。这个现象引起了研究人员的兴趣,他们开始研究黑猩猩与狩猎采集者在进化上的明显差异,尽管从生物学的角度来看,两者极为相似。进化人类学家给出的解释是,正是这种差异使人类跨入了一种更高级的进化形式,在这种进化形式中,语言、协作和复杂的交流方式推动了人类的发展。狩猎采集社会中平等主义的发展促进了更大范围的协作,人们的工作效率和创新能力都得到了提升,工作成效也更加显著。换句话说,如果狩猎采集社会从一开始就建立起等级制度,那么人类的行为会更接近黑猩猩。


    与黑猩猩相比,有一些灵长类动物更崇尚平等。例如,倭黑猩猩社会的等级制度就要弱很多,在它们的社会活动中,支配关系也不那么明显。研究结果十分有趣:从某种程度上说,这种社会主导角色的缺失反而促进了高级社会行为的发展。研究表明,倭黑猩猩懂得如何相互合作,而且与许多哺乳动物不同的是,性行为对它们来说不仅仅是为了繁殖,也是一种社交方式。早期的人类比倭黑猩猩更善于合作,从某种意义上说,他们能够适应环境、不断进化,部分归功于社会中高度的平等主义。


    随着人类的语言和文明逐渐发展起来,人类也像许多灵长类近亲一样将等级制度引入了社会。这种相似的社会变化并非巧合,人类从狩猎采集走向农业生产的一个必要因素就是社会结构的变化,对此,我将在第2章中进行详述。


    此外,狩猎采集部落的成员会共享食物、工具和各种原材料。由于当时尚未出现货币,人类还没有囤积货币等财物的习惯。所有部落成员共享生活空间,每天大家会共同参与劳动,为整个部落提供生活所需。


    育儿的模式亦是如此。通常来说,大家会认为孩子属于整个部落,那些最擅长育儿的人或者空闲时间最充裕的人会承担起养育孩子的责任,而不管孩子的直系血亲是谁。现代狩猎采集社会也具有这个特征。在许多现'
  merge: -1
  img_proc: true
- pgno: 34
  md: '代狩猎采集社会中, 养育孩子仍然依赖于集体的力量, 对部落成员来说, 这减轻了抚育后代的辛劳。


    科技对这种社会环境的形成产生了重要影响。第一, 在人们以群体为单位进行活动时, 狩猎采集技术的应用效率更高。因此, 大多数任务都是由一群人而不是一个人完成的,
    这意味着部落的所有成员都必须参与其中、分工协作, 同时还要帮助那些年幼者、弱者和老年人。在整个生命历程中, 人类都是依靠部落的支持而生存下来的。


    第二, 平等主义盛行是因为狩猎采集技术决定了人们过着游牧生活。这种生活方式要求部落储备最低限度的物资, 因为储存的物资会在迁徙时成为负担, 储存的东西越少,
    迁徙路上的负担就越轻。游牧生活迫使人们轻装上阵, 只要找到一个栖身之处就可以生存下去, 因此在狩猎采集社会, 拥有财产并不是一个人的生活目标, 这与当今社会恰恰相反。


    第三, 居住情况不仅反映了群体的规模, 也反映了人与人之间的互动模式。当时的人类还没有建造住所的能力, 寻找庇护所对部落来说是一个集体任务, 而不是以一个人或一个家庭为单位来处理的事情。在现今的住房文化中,
    每个家庭通常拥有自己的房子, 这在我们的祖先看来是很可笑的。


    鉴于以上这些因素, “隐私”这个词在史前时代简直是天方夜谭。今天的人们非常重视隐私, 在富裕国家, 每个孩子都可以拥有自己的房间, 房间里有自己的床、自己的衣橱,
    甚至还有属于自己的笔记本电脑。此外, 养育孩子是新手父母自己的事情, 孩子的祖父母或保姆只是偶尔协助。然而, 当几十个人一起住在一个洞穴里, 隐私根本不存在,
    也是没有必要的。在当时的社会, 两个个人之间长久的、脱离了部落的关系根本不存在。当一男一女有了孩子, 他们不会从部落中独立出来, 而是将孩子带到集体中去。


    # 跨部落通婚与控制生育并存


    史前科技对人类的种种关系产生了深刻影响, 最直接的影响也许是小规模部落出现了跨部落繁殖的需求。在史前时代, 一个部落的成员必须与部落之外的人“联姻”, 以获得更多的潜在伴侣,
    从而使基因库更加多样化。从这个意义来说, 史前社会并不是以“夫妻”为中心, 而是以集体为中'
  merge: -1
  img_proc: true
- pgno: 35
  md: '心, 人们更重视生存而不是情感。换句话说, 对原始部落的成员来说, 生存优先于情感依恋。


    小规模部落形成之后, 部落成员面临的第一个问题是生育者不足带来的挑战。一夫多妻制(一男多女)或一妻多夫制(一女多男)可能是解决这个问题的一种方法。实际上,
    非一夫一妻制的关系在狩猎采集社会中并不少见, 我将在后文中阐述这一点。


    由于缺乏遗传多样性, 小规模部落还面临着第二个问题, 即灭绝的风险。对哺乳动物繁殖模式的统计分析表明, 一个由几十个个体组成的部落一定会出现近亲繁殖。因此,
    如果没有来自部落之外的基因, 一个部落注定会灭绝, 最多持续几个世纪。这可能就是历史上所有已知的人类社会都禁止近亲结婚的原因。


    早期人类存活下来的唯一途径就是进行跨部落繁殖, 即部落之间交换适合生育的成员, 男性女性都有。研究人员认为, 早期人类的这种行为与灵长类动物中有生育能力的成员从自己的族群迁徉到另一个族群的行为相似,
    这也是动物世界中的一种常见策略, 有利于提高繁殖能力。跨部落繁殖扩大了基因库, 避免了近亲繁殖带来的有害性状。因此, 不同的部落之间交换适育成员对保持部落成员健康至关重要。


    根据人类学理论, 跨部落繁殖不仅增加了遗传多样性, 还使得部落之间结成了联盟。通过这种“联姻”方式, 不同部落之间的关系更为亲密, 对彼此的敌意也减少了。因此,
    我们的祖先在部落之间迁徉, 实际上增加了部落和他们自己的生存机会。


    有趣的是, 最初参与“联姻”的原始人究竟是女性还是男性, 目前尚不清楚。不同的动物跨族群繁殖的方式不同, 有些动物族群中的适育成员的流动性更强。就黑猩猩而言,
    在族群之间迁徉的是雌性黑猩猩。雌性黑猩猩对本族群那些和自己一起长大的雄性黑猩猩的性吸引力较小, 而对其他族群的陌生雄性黑猩猩的性吸引力较大。因此, 雌性黑猩猩会在这些陌生的雄性黑猩猩附近游荡,
    然后加入它们的族群。对其他灵长类动物来说, 在族群之间迁徉的往往是雄性。例如, 雌性环尾狐猴会拒绝与本族群的近亲雄性个体交配, 于是这些雄性环尾狐猴只得离开它们的原生族群,
    雌性通过社会排斥这种方式迫使雄性离开。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 对现代人来说，“熟悉”是一段良好关系的标志之一，但通过研究人类的灵长类近亲，我们发现早期人类的关系可能存在另一种运作模式：过于“熟悉”实际上是需要离开的信号，毕竞我们祖先的繁衍模式的核心是生存。


    为了进一步了解生存问题对早期人类种种关系的影响有多深，我们再来看当时的社会在人口控制方面做了哪些事情。我们知道，如果一男一女生育两个孩子，那么下一代部落成员的数量就能基本保持稳定。事实却是，一名年龄达到50岁的史前女性可能会生12个孩子，这个数量远远超过了保持人口平衡所需的孩子数量。为了控制人口的无节制增长，缓解人口对有限的生存资源造成的压力，我们的祖先必须采取一些措施。


    史前社会的人口问题或许比你想象的要普遍得多，大多数风险因素并不足以限制人口增长。首先，分娩死亡率并没有成为减缓人口增长的一个重要因素。虽然早期女性分娩时的死亡风险看似很高，但最近来自南非南开普地区的石器时代晚期的考古证据表明，男性和女性的死亡率差不多，女性分娩时面临的风险并不是很高。当然，第一次怀孕的年轻女性除外，研究人员在死于初次怀孕分娩的年轻女性的骨骼中发现，她们在遗传上易患妊娠并发症和分娩并发症。其次，捕食者的攻击和身体疾病等外部风险对控制人口数量几乎没有帮助。当人类从非洲走向世界各地时，他们大都健康，而且死于捕食者攻击的风险很低。最后，其他一些因素也可能影响人口数量，如战争和性禁忌，但由于非常罕见，所以未能限制史前人口的增长。


    随着人口数量的快速增长，史前人类不得不采取措施控制生育，在环境资源不足以支持人口快速增长的地方尤其如此。部落里的成年人在照顾自己的同时，还要利用有限的资源保护、养育大家庭里的所有孩子，生存的压力使得控制人口显得尤为迫切。


    杀婴，听起来很残忍，但为了控制人口增长，在当时这是一种为人们所接受的解决方案。杀死婴儿确实很残忍，但婴儿的死亡在史前社会并不像在当今社会中那样悲惨或难以想象。动物也会用自己的方式来解决这个问题。例如，成年雄狮会杀死将来可能成为竞争对手的雄性幼崽；塘鹅只在特定的岩石上交配，以保证在交配季节只有一定数量'
  merge: -1
  img_proc: true
- pgno: 37
  md: '的“育龄夫妇”可以生育后代。对人类来说，在特别艰难的时期，牺牲孩子是增加部落成员生存机会的一种可行方法。


    为了生存，我们的祖先愿意杀死自己的孩子，这种动力也证明了有效的生存机制对他们来说比情感满足更重要。一个部落的成员迁徉到另一个部落以保证基因库的多样性，也是出于生存的考虑。当时的人对有利于生存和遗传多样性的条件如此重视，对现代人所熟悉的关系的建立、家庭结构却几乎没有概念。


    # 一夫一妻制理论面临的挑战


    连续性一夫一妻制是指一个人在一生中可能拥有多个配偶，但在拥有配偶时实行一夫一妻制。——译者注


    关于史前时代各种形式的关系的争论非常激烈。一些学者认为，一夫一妻制对双方都有益，即便是非长期的连续性一夫一妻制 ①。一个忠诚的伴侣能够带来稳定，有助于平息激烈的求偶竞争。随着竞争的消除，男人和女人得以和平共享资源，并在相对安全的情况下进行有规律的日常活动，比如狩猎、采集、捕鱼、捡食肉类和养育孩子等。


    根据同样的理论，男性和女性的劳动分工是家庭单位形成的必要因素。女人主要负责照顾幼儿，因此承担了更多的家务，充当了采集者和养育者的角色；男人则会外出打猎，充当了狩猎者的角色。随着男性和女性的角色划分，双方相互依赖，这种依赖关系形成了牢固的纽带，使家庭这一单位得以保持稳固。


    然而，大多数研究人员对史前时代的一夫一妻制理论持强烈反对态度，至少它不是我们今天所说的一夫一妻制。他们认为，即使史前时代的男女之间存在劳动分工，这也与一夫一妻制无关，因为这种分工是群体层面的，而不是小家庭层面的。换句话说，早期人类所从事的日常工作虽然存在分工，但那是以整个部落为单位的所有男性和女性之间的分工，而不是以小家庭为单位的一男一女之间的分工。例如，部落里的所有男性一起去打猎，所有女性则一起抚养孩子，在营地周围寻找果实，并制作部落所需的工具。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '另一些研究人员则认为，从男女体型和繁殖模式的角度分析，史前人类也不会是一夫一妻制。在实行一夫一妻制的动物物种中，雄性个体和雌性个体的体型往往相差不大。对于这种现象，最具代表性的解释是，固定的伴侣让这些动物没有求偶竞争的压力，因此雄性和雌性没有进化出不同的体型。鸟类就是一个很好的例子，雄鸟和雌鸟通常体型相当，鸟类中一夫一妻制的比例是哺乳动物的10倍。


    相反，在一夫多妻（雄性寻找多个雌性伴侣）和一妻多夫（雌性保持多个雄性伴侣）的物种中，雄性和雌性的体型往往不同。这是进化的结果，目的是在求偶竞争中获得优势或者保护后代免受伤害——为了刺激雌性再次进入发情期，雄性会杀死它们的幼崽。平均而言，男性的体型比女性大10%，基于这一事实，大多数进化生物学家得出结论：早期人类可能不是一夫一妻制。


    此外，即便一对伴侣生了几个孩子，这也并不意味着他们住在一起，像今天的核心家庭一样生活。虽然许多灵长类动物也会与同一个性伴侣生育多个后代，但现代人以及近代史上的人与伴侣生育之后会继续住在一起，这样生活方式是独一无二的。例如，在人类的近亲非洲猿的群体中，我们没有发现雄性留在核心家庭照顾后代或扮演其他类型的父亲角色的证据。


    亲代抚育是指双亲对后代的保护、喂养和教育等一系列行为。

    ——译者注


    鉴于上述情况，我们没有理由认为，一对伴侣之间的忠诚关系缘自女性在抚养孩子时需要男性提供食物和住所。实际上，人们普遍认为，人类社会是在进化到一夫一妻制之后，亲代抚育才变得普遍起来。在此之前，育儿任务是由部落大家庭来承担。以两个来自南美洲的现代狩猎采集社会为例，研究人员计算出，每对育有子女的夫妇平均得到大约1.3个其他成年人的帮助，其中大多数是男性。他们据此得出结论：额外的育儿帮助对人类的进化至关重要。


    即便有证据显示人类历史上出现过类似男性女性“配对结合”的情况，研究人员仍然认为，这种结合与我们今天所理解的“婚姻”有着截然不同的目的。在这些案例中，人们允许一男一女跨部落配对结合是为了让他们的后代被部落接受，同时也表明这些孩子的父母来自不同的遗传谱系；'
