- pgno: 15
  md: '来的根本性变化, 即人们以全新的方式建立和维系关系。我将这种新的关系模式称为“关系5.0”。


    然而, 想要解释这种新关系模式的演变, 可不只是想出一个流行术语这么简单。因此, 本书的第二部分将介绍社会基础具体发生了哪些变化, 以及我们使用了哪些技术让关系5.0得以形成。本书第二部分还将解读现代的技术变革,
    探讨这些新技术能否从根本上改变人们对人际关系、浪漫关系或柏拉图式关系的看法。


    尽管我们不太可能很快看到人与科技的亲密关系成为一种普遍现象, 但从我和其他研究人员开展的大量研究和调查的结果来看, 关于这种关系是否即将变成现实的问题, 答案是非常明确的“是的”。科技满足人们情感、智力和身体需求的愿景不再仅仅存在于科幻故事中。


    若想论证这个观点, 仅仅罗列人类历史上的伟大发明是不够的, 谨慎定义社会的哪些方面发生了根本性变化是非常必要的。有人提出了“第四次工业革命”这种说法, 用来表示过去几年的发展,
    以区别于20世纪后期与技术相关的的发展。然而, 第四次工业革命中的科技发展并不能被直接视为人类关系模式的变革。


    我们以3D打印技术为例。3D打印技术被认为是第四次工业革命的一部分, 它彻底改变了我们制造商品的方式, 在很大程度上打破了市场和发明者之间的壁垒, 让新兴企业家得以更快地制造出他们的新发明的原型,
    这打乱了原本的科技发展节奏。在医疗领域, 3D打印技术有助于按需生产小型医疗植入物, 实现了针对单个患者的量身定制。


    虽然3D打印技术可能会改变与行业相关的因素, 但是它并没有改变人类建立关系的模式。你可以利用3D打印技术设计并制作一份精美的、有创意的礼物送给你的爱人, 这可能会给你们的感情生活增添一些情趣,
    但并不会改变你们关系的基础。


    基于此, 本书提出了一个问题:什么样的科技进步会对人们产生巨大的影响, 让人們对家庭生活、爱情关系和情感需求产生不同的看法, 并做出足够彻底、足以影响情感关系和依赖模式的改变?我们应该在现实环境中进行实证研究,
    严格评估这些变化对人们的生活产生的影响。通过这种方式, 我们才能理解关系5.0的微妙之处, 以及人类的生活可能会发生多大程度的变化。'
