- pgno: 137
  md: '拟现实技术在识别和引发复杂的人类情感体验方面非常成功，这项技术在心理治疗领域的应用预计很快就会实现广泛商业化。


    在讲故事方面,扩展现实技术也能达到类似的效果。讲故事是一种跨越文化界限的情感体验,几乎所有人从出生起就开始听人讲故事,听故事也因此成为一种高度情绪化的经历。因此,对于评估扩展现实技术在激发人们情感方面所达到的效果,指标之一可能是通过虚拟现实和增强现实催生讲故事场景中人们流露出的兴奋、敬畏和喜悦之情。


    为了验证这种可能性, 韩国的科学家开发了一个可以讲故事的虚拟现实模型, 它所讲故事的流畅性、沉浸感以及情绪起伏的程度各不相同。研究人员对200名参与者的感受进行了分析,
    结果显示, 虚拟现实技术带给参与者的沉浸感越强, 故事所激起的同理心也就越强。换句话说, 参与者听故事时的同理心水平与虚拟现实技术的好坏相关。


    这些研究结果引起了媒体的关注, 越来越多的新闻媒体和杂志开始投资这一领域。他们尝试用虚拟现实技术和增强现实技术来配合他们所写的故事, 让观众和用户沉浸在他们制作的新闻内容中。《纽约时报》《华盛顿邮报》和其他很多媒体都在使用这些技术,
    以探索吸引观众和创造收入的新机会。


    然而, 我们在这些研究中看到的扩展现实技术对人类情感的影响是否只是偶发的, 它所激发的情绪是否只是暂时的, 还是说人们真的会在持续的互动中对虚拟角色产生依赖,
    形成一系列复杂的情感? 如果是后者, 那么我们离关系5.0就更近了一步。


    # 虚拟关系与现实关系同样有益


    《第二人生》是一款3D虚拟游戏, 用户可以在游戏中选择一个数字化的虚拟形象来开展社交和个人生活, 结交虚拟朋友, 参与任务、聚会和对话等活动。游戏世界中的人可以结识、约会、恋爱、结婚、组建自己的家庭,
    同时与他人保持联系, 甚至成为朋友。《第二人生》的活跃用户接近100万, 他们在游戏中可能发展出无数种关系, 许多用户模糊了虚拟和现实的边界, 在游戏中建立的家庭不仅包括虚拟世界的角色,
    还包括现实世界中的人。用户普遍认为, 这些虚拟伴侣提供的陪伴和现实生活中的关系一样有益, 应该被认真对待。'
