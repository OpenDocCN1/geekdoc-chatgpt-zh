- pgno: 128
  md: '3D化身。制作完成后，该虚拟化身可以用于虚拟现实、增强现实和混合现实的应用。


    扩展现实这个简洁的术语不仅将所有的技术变化集合在一个短语中，还代表了新技术与现实之间的联系的一种延伸。虽然我们可以将这些技术视为独立的存在，但用“扩展现实”这个术语来概括更准确，因为这些技术并没有完全脱离现实，用户仍然会体验到恐惧、敬畏和开心等真实的感受。由于这些技术通常应用于设计、规划以及现实生活中需要集思广益的项目，如厨房装修，一些用户在使用这些技术时甚至会产生创新想法。因此，“扩展现实”这个术语非常贴切，尤其在指这些技术的组合时。


    # 扩展现实技术的发展，将来会有成百上千的元宇宙


    史蒂文·斯皮尔伯格（Steven Spielberg）执导的电影《头号玩家》改编自恩斯特·克莱恩（Ernest Cline）的同名小说，故事发生在2045年的俄亥俄州哥伦布市，这一年的哥伦布已经开始衰落，到处都是废弃的活动房屋堆叠而成的的高楼。现实世界的崩溃导致大多数人沉迷于虚拟世界以逃避现实，这使得改善现实处境变得更加艰难。一款名为《绿洲》的游戏成为最火爆的虚拟世界，电影中的主角韦德·沃茨（Wade
    Watts）是一个孤儿，他在游戏中的角色叫帕西法尔（Parzival），他想找到隐藏在游戏中的彩蛋，这是《绿洲》的创始人、已故的詹姆斯·哈利迪（James
    Halliday）为玩家设计的脑力角逐的一部分，找到隐藏彩蛋的玩家可以获得他的巨额财产。


    这部电影直观地展示了虚拟现实的未来，后者给人留下了深刻印象。我们把斯皮尔伯格对与扩展现实技术相关的社会问题的警告放在本章后面讨论，先来深入探讨这部电影的技术愿景。通过分析现有技术和这部电影中呈现的技术之间的差异，我们可以更好地理解扩展现实技术目前面临的挑战。我采访过扩展现实领域的几位专家，他们认为这部电影所描述的先进技术可以说是扩展现实的发展方向。


    首先，电影中的沃茨使用的是虚拟现实万向跑步机，他可以朝任何方向、以任何速度向前奔跑。一些公司尝试开发这种技术并应用到游戏中，但发现它在商业上并不可行，因为太占空间，而且价格高昂，维护费用也非常高。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '目前市面上为数不多的虚拟现实跑步机之一是由Virtuix公司生产的Omni跑步机,但它与沃茨使用的跑步机完全不同,用户并不能在上面自由奔跑。相反,用户必须系上安全带,以避免从跑步机上摔下来,这让人想到了婴儿学步车。此外,用户还需要在自己的鞋子上装上特殊的鞋底,以便在略微倾斜的跑道上朝任何方向移动时保持平衡。


    当前扩展现实技术的另一个发展是重定向行走 (redirected walking, RDW)技术,它让玩家可以在现实中有限的区域内长时间移动。当人眼从一个注视点快速转移到另一个注视点时,它们会处于一种看不见任何东西的状态,重定向行走技术就是在这个时刻发挥作用。这项技术会巧妙地改变虚拟现实场景,让用户以为自己一直在沿着直线往前走,实际上路径已经发生变化,所以用户不会走出现实世界中的指定区域。当然,这依然需要足够大的空间,在现代的公寓中并不方便使用。


    其次,电影中呈现的扩展现实技术增加了除声音、视觉之外的更多感官刺激,比如震动。研究人员正在开发一种类似于电子游戏控制器的“震动卡”。震动技术已经应用于Gloveone和Manus这样的虚拟现实手套,它们可以模拟纹理和触感。HaptX公司开发的手套更为先进,融入了新型气动技术,产生了动觉和触觉的模拟组合。这种手套由织物制成,有数百个气囊,通过充气、放气来产生所需的感觉,这些气囊还可以对用户的手指产生阻力,让用户体验到触摸实体的感觉。Go
    Touch VR开发的“触觉环”也能模拟触摸物体的感觉,通过在用户每只手的三根手指上佩戴小型装置来改变手指上的压力,从而模拟触觉。


    另一项更先进的技术是世界上首款全身触觉反馈装置“特斯拉服”（Teslasuit）(与马斯克的电动汽车公司无关)。特斯拉服仍在开发中,它所提供的体验与电影《头号玩家》中描述的非常接近。Teslasuit公司声称,玩家穿上特斯拉服后,全身都可以体验到各种感觉,如下雨、寒冷,甚至摔倒在地的感觉。2024年,该装置的开发型号以约1.3万美元的价格售出。


    最后,电影中的沃茨使用了“视网膜投影仪”,这也是与现有技术的差别之一。在电影中,系统使用低功率激光直接将图像投射到用户的眼睛上,这种投影仪使得头戴式一体机的体积更小,投影方式更直接,并且效果更逼真。相比之下,现有的虚拟现实技术只支持在用户面前使用屏幕式显示器。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '这种视网膜投影技术的研发目前仍然处于起步阶段。2018年，英特尔发布了Vaunt智能眼镜，它使用了视网膜投影，用红色激光、绿色激光和蓝色激光在视网膜上绘制出图像。几个月后，英特尔放弃了这款产品，并将这项技术卖给了另一家公司，这家公司后来被谷歌收购了。同样是在2018年，QD
    Laser公司开发出第一款商业化的虚拟视网膜显示器，取名为RETISSA Display，并于2019年推出第二个版本，其分辨率相当于720p。2020年，博世公司在国际消费类电子产品展览会上展示了类似的技术。


    2023年，索尼展示了一种完全不同的方法，通过结合售价仅几百美元的摄像头来控制虚拟现实。索尼展示了一种使用基础脑机接口技术来控制虚拟现实的方法。虽然像游戏《生死搏击》中那种复杂的脑机接口技术还没有发展出来，但我们已经从某些科技成果中看到了希望，这些科技成果推动着马斯克的Neuralink公司取得技术突破。到目前为止，科学家已经成功利用脑机接口技术来读取、解码瘫痪患者的脑电波。在一项突破性的研究中，一种高强度的沉浸式虚拟现实训练结合脑机接口技术，让8名接受治疗的患者的触觉和感觉在神经系统层面得到了改善，甚至恢复了关键肌肉的自主运动控制。在接受治疗后，这些之前完全瘫痪的患者中有二分之一被归类为部分瘫痪。


    2020年，科学家展示了脑脊接口 (brain-spine interface, BSI) 的可能性。2024年，有报道显示，在接受治疗的20位患者中18位的情况得到了改善。通过这种技术，大脑可以解码触觉信息和人工感官信息。可见，随着技术的发展，利用大脑信号进行通信、控制设备将成为可能，尽管听起来风险很大，但研究表明，这项技术不仅可行，而且使用起来很安全。我们似乎可以看到一种趋势：脑机接口技术和脑脊接口技术的应用范围将从医疗行业扩展到更广泛的领域，让虚拟场景直接受到我们思想的影响。


    此外，扩展现实领域的程序员和设计人员正在努力改进扩展现实的内容。他们不仅研究如何使虚拟情节更加真实、复杂并具有更多可能性，还研究如何使这些应用程序根据用户的移动和节点自行生成新内容。他们的目标是让编程本身而不是内容能够快速响应用户需求，从而不断生成角色、物体和景观。这是一个非常宏伟的目标，而他们正坚定地朝着这个目标前进，尤其是在2023年人工智能技术取得突破之后。这些发展背后的技术与第6章介绍的人工智能技术相似，主要区别在于，人工智能引擎生成感官信息表征，然后利用扩展现实技术的视觉机制、听觉机制和其他感官机制将其投射出来。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '各种扩展现实技术的结合面临着更大的挑战。想象一下，在不久的将来，一名普通用户想在一个增强现实应用程序中移动一些物体，但又不想关闭另一个虚拟宠物应用程序。当两种不同的技术在同一实体对象上产生有冲突的增强现实交互时，平台应该如何处理呢？如何做到聚合输入而不偏向某一种技术？为此，微软和谷歌等公司已经在开发可以同时激活多种应用程序和技术的平台，同步所有虚拟动作和对象。


    另一个常见的挑战是用户体验问题，包括笨重的硬件、缓慢的连接和技术故障等。根据博钦律师事务所对140位业内专家的调查，41%的专家认为虚拟现实技术大规模应用的最大障碍是用户体验问题。


    虚拟世界的运行需要大量数据的支撑，而从现有产品的用户反馈中可以看出一个普遍问题：许多网络提供商无法稳定地处理大量数据的传输。例如，用户贾丝明写道：“我在玩游戏Avakin
    Life的时候显示‘无法连接网络’，可我的网速明明很快啊！”贾丝明遇到的问题并不是他手机的问题，因为很多虚拟现实用户在反馈中也提到了类似的问题。VRChat的一名用户写道：“我现在一进入游戏就会遇到杂音大、高延迟和不断闪退等问题，只要玩家超过5个人就会出现声频故障和帧速率变慢的问题。”可见，虚拟现实图像和人工智能引擎所需的数据太多，用户使用起来并不流畅。


    事实上，扩展现实用户体验仍然处于初级阶段，游戏质量不高，用户在虚拟世界中的行动自由度也有限。最影响用户体验的或许是每个虚拟内容或增强内容中只有几个场景，使得故事情节过于简单。要想让用户完全沉浸于虚拟世界，我们还有很长的路要走。


    在2020年和2021年，我进行了一项调查，结果显示，与人工智能技术相比，美国成年人对虚拟现实技术的熟悉程度较低（见图7-1）。在扩展现实家族中，虚拟现实技术是最受欢迎的，但从统计数据来看，参与者对虚拟现实技术的熟悉程度明显低于对人工智能的熟悉程度。此外，参与者表示，他们使用虚拟现实的频率较低，最重要的是，他们对虚拟现实的喜爱程度较低。'
