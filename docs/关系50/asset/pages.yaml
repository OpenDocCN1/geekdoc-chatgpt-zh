- pgno: 188
  md: '人身上。相反，如果我们坚决反对偏见，新兴技术也将反映出我们努力的成果。


    因此，我们应该教育后代，无论是与人互动还是与人工智能生命体互动，都要意识到性别化、种族化和民族化的危害，避免造成负面影响。此外，从孩子上小学开始，我们就应该与他们探讨关系5.0带来的风险，还应该让他们体验与各种人工智能生命体互动，并给予正确的引导。只有通过这种精心的教育和直接的接触，孩子们长大成人后面对人类与机器人之间的社交困境时，才能够自信地面对、解决问题。


    # 在隐私威胁和精神需求之间寻找平衡


    在探索关系5.0的伦理性问题时，我们面临着很多挑战，人工智能个人助手、虚拟化身和机器人的多样化问题只是冰山一角。另一项挑战是关于我们与人工智能和机器人之间的联系，即“我们”与“它们”互动的问题。


    一个主要的问题是如何保护个人隐私。人类伴侣通常希望彼此互相信任，希望自己可以在对方面前表现出脆弱的一面，并相信对方会为自己保守那些或尴尬或微妙的秘密。人造伴侣同样值得信任吗？


    在与机器人或人工智能设备互动时，人们很容易暴露自己的隐私或表现出脆弱的一面。一篇文献综述分析了60项关于社交机器人的研究，发现机器人通常会收集有关用户日常生活及其情绪和精神状态的敏感信息。如果这一类数据泄露，甚至只是处理不当，后果都可能很严重。例如，孩子们可能会将自己的秘密告诉机器人朋友，他们的父母知道了这些信息后，可能会违背他们的意愿监视他们；如果一个家庭通过机器人收集到了家中老人的健康数据，可能会因过度担心或错误解读数据而将老人送到专业护理机构，或者限制他们的活动。


    这一问题在关系5.0中尤其突出。当前技术的发展重点是提高人造伴侣的自适应性，这意味着数据收集是重中之重。有了更多的数据，基于人工智能的机器人才能根据用户的喜好自主调整，提高个性化程度，以满足用户的需求。事实证明，这种自动个性化是建立情感依赖的关键能力。当机器人的个性化程度足够高时，用户的参与度也会提高，他们会更愿意与机器人互动、共同生活。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '然而，这种自主调整的个性化过程很可能会导致隐私泄露的问题。例如，像丹妮丝这样的用户可能会与机器人分享工作中的机密信息，并将自己的日程安排和社交信息透露给机器人。有一些用户可能会在机器人面前脱衣服，让机器人记录下这些私人图像。一项调查询问了449名年龄在18～60岁的用户，问他们如何看待智能设备在他们生活中的存在。结果显示，用户最担心的是裸体被偷窥或裸照被泄露（32%）、身份盗窃（31%）和被偷听（26%）。有趣的是，即便机器人处于非拍摄状态，人们也不想让它看到自己的裸体，74%的参与者希望机器人能在他们开始脱衣服之前转过身去。


    扩展现实的使用所带来的隐私问题可能更加严重。扩展现实设备可以记录用户在虚拟世界中互动的内容和性质，这些数据可能会被泄露或共享。实际上，用户可能不知道扩展现实设备能够收集哪些数据，也不知道它们能在用户没有意识到的情况下收集和记录大量个人信息，毕竟这类设备看起来只是一个简单的工具，如一副普通的智能眼镜。由于不清楚扩展现实设备的全部功能，用户可能会泄露更多的信息。对于使用脑机接口技术的更先进的扩展现实设备，这种威胁可能更加严重。这类扩展现实设备可以捕捉到用户的脑电波，并将高度敏感的数据上传至云端。


    此外，扩展现实用户还经常选择与其他用户共享内容，主要是通过虚拟现实应用程序或基于互联网的软件。在某些情况下，一名用户的内容可能会在未经其明确同意的情况下与其他用户共享。例如，几名用户通过扩展现实应用一起参与一项活动的时候，在这个“小组”内部，用户可以把自己的3D摄像机拍到的视图实时分享给组内其他成员，其他成员可能会在未经该用户同意的情况下把视图分享给组外的扩展现实用户。这让研发人员十分头疼，因为他们试图保护用户的隐私并确保扩展现实技术的使用更加安全。


    关于人工智能个人助手的安全问题，人们已经进行了广泛讨论。许多用户认为人工智能助手仅仅是一种提供娱乐或早上帮忙开灯的工具，但实际上，它们在我们家中的存在远不止对语音指令做出反应这么简单。它们使用的语音通道的开放性将我们暴露在信息泄露的风险中，而且它们与云计算的持续连接也使它们很容易遭到攻击。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '显然，一个送去维修的机器人很可能会泄露用户的私人数据和视频，用户与虚拟化身之间的关系很可能会因扩展现实设备系统被入侵而暴露。此外，人工智能助手每天记录和传输着你那些连最亲近的人都不应该知道的信息。尽管这些场景听起来很危险，但大多数人每天都会坐在笔记本电脑前，面对着随时准备拍摄他们的摄像头，甚至在不知情的情况下被恶意攻击者通过远程访问打开摄像头。我们还会带着智能手机去最隐秘的地方和场合，却不担心这个小小的设备正连接着整个世界。谷歌、Meta和亚马逊已经掌握了我们的社会关系、资产和购物偏好。简言之，技术带来的隐私问题早已存在，我们已经学会了与之共存。大多数人并不会为此担忧到彻夜难眠。


    尽管如此，有人仍然针对这些问题提出了一些解决方案，这些方案经过整合后可以作为未来的监管措施的一部分。例如，研究人员设计了一种机器人，它可以利用成像筛查技术检测用户是不是裸体，一旦检测到变化，它会在用户裸露之前转身离开。另一个研究团队建议允许用户访问、删除或更正人工智能收集的所有声频和视频数据，以提高人工智能的透明度。有人建议研发可以在收集数据时发出信号并允许用户手动关闭的人造生物。


    针对扩展现实产品的安全和隐私解决方案也在制订中，研发人员已经将身份验证技术整合到了扩展现实技术中，其中一种方式是将密码解锁和图案解锁模式引入头戴式一体机。最近的一项研究在实验室条件下测试了这种设计，研究人员让30名用户通过密码或图案解锁模式使用虚拟现实小型手持设备。参与者报告了两种解锁模式的易用性，经过一次尝试之后，两种模式的平均解锁时间都缩短到了3秒以内。研发人员指出，外部观察者通过观察手势猜测出密码的可能性很小。考虑到用户对安全性的要求和初始身份验证技术已经很成熟，这些措施可能会随着扩展现实技术的发展而不断整合、升级。


    2018年，一个美国研究团队花费大量精力为扩展现实技术的开发安全制定了指导方针，以降低隐私问题的风险。通过调查现有政策、采访大量扩展现实用户和对新技术的跟踪，他们发布了所有研发人员都可以使用
    的标准，帮助人们最大限度地减少隐私泄露的风险。他们将该指导方针称为“道德准则”，其中包括扩展现实应用中信息共享透明度的建议，如何避免创建可能危及隐私或安全的虚拟空间，针对用户的实际需求改进技术（如减轻晕眩感等虚拟现实使用中的常见问题）以避免用户自主权受'
  merge: -1
  img_proc: true
- pgno: 191
  md: '损。虽然这个指导方针还处于初期阶段，但它开创了一个先例，并有望成为未来制定扩展现实隐私法的基础。


    我们应该密切关注这些问题，并制定全面、多样化的安全措施来保护我们自己。专家们应该继续积极地提出解决方案，并制定法律法规，以确保我们能够安全地使用科技产品，为新兴技术的普及铺平道路。展望未来，尽管存在各种风险和障碍，我们似乎仍将继续在隐私威胁和情感需求、精神需求之间寻找平衡，就像面对历史上每一场科技变革时所做的那样。


    # 我们应该放大的是人类的良知


    如果说人造生物的多样化是“我们”对“它们”的担忧，而隐私问题是“我们”与“它们”互动时存在的风险，那么我们需要关注的是，作为人类的“我们”在社会5.0有机会拥有新型关系的情况下所经历的变化会给我们带来哪些道德困境。


    其中一个可能的道德困境是物化。由于人工智能助手、机器人和虚拟化身介于人类和物体之间，一些人担心这可能会导致越来越多的人被物化。例如，一段真正的友谊不仅能给双方带来快乐，而且具有内在的价值，因为彼此往往会相互支持，有时甚至会为了朋友而牺牲自己的利益。人与人之间的友谊会使双方相互信任，成为彼此坚实的后盾。然而，当我们将一个人工生物视为朋友或恋人时，这可能会威胁到一段关系的内在价值。你可能会和一个机器人伴侣度过一个美好的星期天下午，因为和它聊天非常有趣、令人愉悦。这也让你觉得很有安全感，因为你知道，只要你想聊天，机器人一定会来陪你。不过，我们与机器人的关系可能并没有内在的价值，毕竟我们再尊重机器人，也不会为了它的利益做出牺牲。


    对于机器人陪伴左右的未来人类，我们还有一个担忧：如果越来越多的人把机器人作为朋友和恋人的替代品，是否也会把其他人视为机器人？是否会只把他们当作获取快乐的工具，而忽视了他们作为朋友的内在价值？


    如果想深入研究人与人之间的关系，我们可以从几个层面来思考物化他人的风险。著名哲学家玛莎·努斯鲍姆(Martha Nussbaum)认为，物化他人包括将他人视为缺乏自主权、代理权、界限、自我所有权、重要'
  merge: -1
  img_proc: true
- pgno: 192
  md: '性，以及可以和其他物体交换的物体。在我们与人造生物相处的过程中，这些特征大量存在于人造生物身上，而且我们与他人相处时的一些本能和高尚美德（比如内疚感和利他主义）也会消失。因此，真正的威胁是我们将会把他人视为自己的延伸和实现更大目标的工具。


    在调查采访的过程中，我一次又一次听到受访者表达这样的担忧。33岁的离异女性娜塔莎来自华盛顿州，她表示：“我认为与人工智能助手谈恋爱是不健康或有害的。这不仅阻碍了人们与他人建立联系，而且由于人工智能助手不太可能拒绝人们的要求，人们会逐渐认为自己对待其他人也可以像对待人工智能一样为所欲为。”


    与许多人一样，娜塔莎担心的是，随着作为伴侣的人工智能和机器人的发展，未来几代人会把这种冷漠、自恋的关系当作理想的关系模式，只能看到他人的身体和外表的价值，对待他们的方式就好像他们缺乏独立思考的能力。更糟糕的是，这可能会引发一个存在主义问题：在一个机器可以取代我们的伴侣、事业和独特性世界里，人类还有存在的必要吗？


    由此可见，机器人融入人们生活所产生的连锁效应是极其复杂和深远的。人们本就会对一切超出常理的现象产生恐惧，而关系5.0的复杂性加之人们对未知的担忧，不免使人们的恐惧加倍。


    对于这些担忧，我们同样可以提出相反的观点：人类与科技的关系会不会让我们变得更有爱心和同情心呢？一堂简短的历史课就可以告诉我们，人类是如何对感知能力较低的生物产生越来越多的同情，以及如何越来越关心其他人、其他物种和整个自然环境的。首先，人类发展出了对其他人的同理心、尊重和关怀，最早的人类以部落的形式生活在一起，他们天生就会互相照顾。这些情感慢慢延伸到其他部落、国家和种族，演变为谴责和废除奴隶制，让道德战胜了不公和人类的贪婪。虽然不平等和社会分层现象仍然存在，但回望历史，我们已经取得了长足的进步。


    接着，人类逐渐对其他物种产生同理心，展现出了对那些与自己不同的生命的关怀，这也是其他许多哺乳动物的本能。历史学家和考古学家一致认为，人类很早就表现出对其他物种的关怀。在开始驯养动物之后，人类就制定法律禁止虐待动物，狗和猫等动物甚至成了人类最亲密的朋友。最近在埃及的一次考古发掘发现了已知最古老的宠物墓地，可以追'
  merge: -1
  img_proc: true
- pgno: 193
  md: '溯到公元1世纪。585只猫和狗的遗骸被埋在事先挖好的坑里，有些还戴着项圈和其他装饰品。到了19世纪，维多利亚女王养了一只名叫达什（Dash）的狗，这只狗被广泛认为是她“最亲密的童年伙伴”。作家们也开始关注动物福利问题，拿厄普顿·辛克莱（Upton
    Sinclair）来说，他在1906年出版的著作《屠场》(The Jungle)中为屠宰场的动物遭受的苦难哀叹。没过多久，各国政府就开始立法禁止虐待动物。


    此外，近代历史告诉我们，人类并不只对其他人或身边的、和自己有感情的动物产生同情，素食主义迅速流行起来就体现了人们对其他动物的同情。动物保护组织不断发展，最终促使禁止暴力对待动物的法律出台，非法屠宰场被关闭。


    再进一步，环保主义的兴起和日渐普及以及人们对气候变化的关注表明，对于非生命体，人类也会表现出关心。换句话说，人类关怀的对象已经扩展到了之前被忽视的、不具备人类特征的生物。


    纵观整个人类历史，尽管遭遇种种逆境，人类对周围的环境似乎越来越包容。同样，我们很可能会在关系5.0中看到类似的进程。有一种可能性是，随着技术获得“生命”，我们并不会被物化，我们的同情心反而会进一步延伸到周围的物体上。正如前文所述，人类与技术建立情感联系的能力惊人，因此学会尊重电子产品对我们来说不会是一件难事。我们将学会感激和尊重技术，而不是物化亲密的人类朋友和伴侣。随着新技术不断融入人们的生活，越来越多的人会对他们的数字伴侣产生同理心。从这个意义上说，认知革命、感官革命和实体机器人革命将共同提升非生命体的地位，让我们明白即使是物体也可以且应该受到尊重。这种观念也许听起来有些奇怪，但可能是我们需要从关系5.0中学习的主要道德观。


    在日本和韩国等国家，我们已经可以看到这种发展，人与新兴技术的融合已经很普遍。在这些文化中，机器人被视为值得温暖以待的对象，人们会体贴和同情它们。密歇根大学人类学和艺术史教授珍妮弗·罗伯逊（Jennifer
    Robertson）认为，日本人对待科技产品的态度是基于神道教的概念，即关于生死的“万物有灵”信仰。与三大一神论宗教不同，神道教认为，“神灵”（Kami）这种能量存在于宇宙万物之中，不仅人类有灵，动物、树木、岩石和人类创造之物（如机器人或虚拟物品）皆'
  merge: -1
  img_proc: true
- pgno: 194
  md: '有灵。这种观念在一个日益世俗化的世界里迅速得到普及，可以帮助我们理解人与科技的共处之道。


    当前，有人已经开始呼吁对机器人和其他技术的法律和道德权利展开讨论。鉴于思想观念在这个全球化的世界中的传播速度，这些呼吁可能很快就会转变为要求立法的社会运动。就像我们尊重身边的生物并对它们产生依恋一样，我们很可能会就如何对待人工智能助手、数字化身和机器人制定相应的规则和指导方针。


    因此，关于如何应对关系5.0中的道德和伦理问题，答案似乎可以归结为我们是否相信人性本善。如果我们对人性充满信心，就能让道德和伦理融入关系5.0时代，为即将到来的变化做好准备。在开发和对待新技术上，我们的选择将反映在人工智能、虚拟生物和机器人与人类的融合方式上。如果我们选择关怀，《西部世界》中的黑暗场景将停留在虚构的科幻故事中。


    我们应该将这些发展进程置于历史连续性的背景下，并审视它们在当代社会的特征，谨慎做出选择。如果人类与科技之间的关系越来越深刻，并且随着技术的发展几乎成为一种必然，那我们更应该认真对待它。你可以反对即将到来的变革，但相应地进行自我调整可能更有帮助。


    虽然无论选择哪条路都很難保证一定是正确的方向，但至少我们能够看到希望。我们应该将平等主义和社会公正等人類历史上取得的社会进步应用到关系5.0中，并在指导方针的引导下接触已经围绕在我们身边的科技产品，也许可以从尝试使用人工智能个人助手开始，为迎接一个广泛应用机器人和虚拟世界的未来做好准备。工程师、设计师和科技企业家应该在制造对种族、性别和年龄敏感的产品时承担起更多的责任；教育工作者、精神领袖和道德影响者应该共同努力，让整个社会为进入一个尊重技术创造的时代做好准备；政府和专家应该制定法律法规、建立监督机制，确保新技术的使用合乎道德规范，防止偏见和刻板印象的产生。


    如果及时采取行动，我们可以创造一个与《西部世界》中的反乌托邦世界完全相反的世界。在这个世界中，关系5.0放大的是人类的良知和关怀，而不是社会的不平等和偏见。在这个世界中，人与人、人与技术之间的联系更加紧密，新型的友谊得以建立和发展，情感依恋将更加多样。如'
  merge: -1
  img_proc: true
- pgno: 195
  md: 果人工智能、虚拟现实和机器人的开发旨在促进社会平等和公正,我们就将迎来一个繁荣昌盛的未来。
