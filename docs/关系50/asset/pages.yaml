- pgno: 5
  md: '关系2.0时代从1.5万年前——很多人认为农业文明始于8千年前, 奇斯列夫把它追溯到更久远的时期——持续到工业革命发生。彼时, 多代同样的大家庭或家族是社会关系的基石,
    社会关系围绕财产所有权展开, 人与人之间的关系因财富差异而不再平等。在家族内部, 成员相互照顾, 共同支配家族财产, 照顾家族后代, 夫妻关系服从整个家族利益。


    关系3.0时代受到工业技术的巨大影响, 父母子女组成的核心家庭成为社会关系的中心, 集体抚育后代完全被家庭亲代抚育后代所代替。由于城市生活的碎片化, 人们变得更加个人主义。同时,
    夫妻结合更多由感情驱动, 而非之前的经济考虑, 于是父亲关系更为亲密, 核心家庭开始被视为远离社会喧嚣的避风港。


    20世纪下半叶, 信息社会催生关系4.0时代。人类社交网络结构进一步原子化, 核心家庭很快受到单身主义的冲击。整个社会快速进化为单身神话, 在其中每个人都是社会力量的中心和节点。“仅仅过了几十年时间,
    婚姻神话就破灭了, 核心家庭短暂的黄金时代很快就被新一代人所崇尚的独身主义取代。”在极端个人主义的支配下, 人们纷纷抛弃传统的家庭生活和对亲密关系的长期承诺,
    结果是结婚率大幅下降和离婚盛行。奇斯列夫认为, 核心家庭兴起于制造业繁荣, 衰落于制造业衰退。


    随着智能革命方兴未艾, AI机器人、生物技术、纳米技术、量子计算等会聚技术崛起, 《关系5.0》人类社会正在朝着社会5.0即超级智能社会进化, “技术融入了人类生活并成为独立的个体”,
    即智能代理(agent)成为社会关系的新主体, 进而人与AI机器人的社会关系大量发生, 使得社会关系模式开始进入关系5.0时代。


    《关系5.0》认为, 相比较以往的社会关系, 新科技革命正在推动该领域的三大革命, 即认知革命、感官革命和实体机器人革命。认知革命主要与AI技术的应用相关,
    指的是AI技术正在重塑人类对世界的认知, 比如AI4S(人工智能科研)。感官革命主要与元宇宙相关技术相关, 如VR(虚拟现实)、AR(增强现实)、XR(混合现实)和脑机接口技术等,
    指向是元宇宙技术正在重塑人类感官经验, 如可以远程“感知”事物。而实体机器人革命——称为“具身智能革命”可能更合适——主要与人形机器人相关, 指的是人形机器人技术正在重塑人类的身体和情感经验,
    如与人形机器人共同生活。'
