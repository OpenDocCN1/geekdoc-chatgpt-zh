  md: '在这一集的故事中，两个真实的人在游戏中的角色之间形成了一种亲密关系。在这个故事设定之下，两个虚拟角色之间的关系还可能更进一步。在现实中，这种情况也并非完全不可能出现。现在，人们已经受到虚拟角色的影响，并与它们建立了关系。


    在本章中，我将介绍扩展现实技术的现状和发展前景，扩展现实通常是虚拟现实、增强现实和混合现实 (Mixed Reality, MR) 的统称。此外，我们还将讨论这些技术在当前和未来如何影响关系。


    # 虚拟现实、增强现实、混合现实——扩展现实技术的兴起


    2019年，虚拟现实产品和增强现实产品大受欢迎。在扩展现实这个更广泛的领域，虚拟现实和增强现实是两项领先技术。Meta于2019年5月21日发布了Oculus
    Quest, 销量非常好，供不应求。尽管有传言说该公司为了让这款产品看起来极受欢迎而保留了部分库存，但第二年的销售数据显示，产品销量仍然直线上升。Meta于2020年10月13日发布了其二代产品Oculus
    Quest 2, 预订量是一代产品的5倍。到了2021年，想购买这款虚拟现实一体机仍然需要预订，等待时间长达数周。根据Meta的生产合作伙伴高通公司的数据,
    Oculus Quest 2在发布后的一年内销量就达到了1000万台。更好的技术、更低的价格推动着这个行业迅猛发展。尽管经历了人员削减, Meta仍在2023年推出了新一代且更先进的


    Oculus Quest 3。


    三星、谷歌、微软、HTC和索尼等科技公司也相继开发了易于使用的家用设备，虚拟现实产品已经不再是小众科技产品。2020年, HTC前首席执行官周永明推出了新产品XRspace
    Manova, 这是一款为大众市场设计的虚拟现实一体机，比Oculus Quest 2更轻, 专为5G网络设计。


    XRspace Manova在硬件方面的主要优势是内向外追踪摄像头, 这种摄像头可以跟踪手脚的运动, 从而让用户的虚拟角色在虚拟现实世界中自然地行动并精确模拟他们的动作。这为扩展现实技术在沉浸式社交网络、体育活动、教育培训等领域的应用提供了无数可能。苹果在2024年推出了Apple
    Vision Pro眼镜, 其在某些方面迈出了重要一步: 苹果的眼镜配备了5个传感器、6个麦克风和12个摄像头。用户可以通过镜片看到两个微型OLED显示屏，每个显示屏的分辨率为2300万像素，且响应时间极短，旨在避免眩晕感。眼动追踪通过LED灯和红外摄像头系统实现,
    该系统也是虹膜扫描的基础。'
