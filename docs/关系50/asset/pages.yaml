    # 图7-1 美国成年人对人工智能和虚拟现实的态度对比


    尽管困难重重, 扩展现实行业仍然发展迅速, 扩展现实产品正朝着更强 大、更可靠、更易于使用的方向推进。Meta公司的Oculus头戴式一体机不 断迭代升级，所使用的材料和软件都越来越好，微软也推出了
    HoloLens混合现实设备, HTC推出了VIVE虚拟现实头戴式一体机, 还有 很多科技公司也在开发相关产品。一个例子是以色列的初创公司Hailo, 该公司在2024年推出了一款专为边缘设备（如这些设备）设计的人工'
