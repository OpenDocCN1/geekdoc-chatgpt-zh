- pgno: 126
  md: '在软件方面，除了Oculus的应用程序，一些公司也开始开发和使用扩展现实技术。Hyperconnect是一家总部位于韩国首尔的公司，于2021年推出了一种新型社交论坛，用户可以在这里结识朋友、互动社交和建立关系。在这个平台上，真实的人类用户与人工智能虚拟化身进行互动，将人工智能大脑与虚拟身体结合在一起。该公司还大力投资虚拟形象技术，为公司主要的社交产品Azar开发新功能，例如与通过这些技术重现的著名历史人物（如爱因斯坦）进行虚拟互动和轻松对话的能力等。


    更重要的是，扩展现实技术越来越便宜，其产品的销量也在增加。谷歌一直致力于向大众提供价格低廉的扩展现实产品，也是这方面的领导者。谷歌推出的虚拟现实眼镜谷歌纸盒（Google
    Cardboard）售价仅为几美元，可以与普通的智能手机配合使用。用户只需在自己的移动设备上下 载虚拟现实内容（很多是免费的），然后将手机插入纸板眼镜中即可观
    看。通过这种方式，扩展现实技术更容易为大众所接受。


    有些读者不是很熟悉这些技术，我在这里做一个简要的介绍。在扩展现实的众多分支中，虚拟现实是最受欢迎的，它利用计算机技术将用户置于模拟环境中。为了体验虚拟现实，用户通常要戴上能显示三维影像的头戴式一体机。通过戴着一体机上下左右移动，用户可以看到周围的虚拟场景。这种对用户移动的响应能力极大地增强了虚拟现实技术的沉浸式效果，用户感觉自己好像置身于虚拟环境中。一些虚拟现实产品还会使用人工智能算法来快速适用户，并不断生成相应的新内容。


    用户的虚拟体验分为主动和被动两种。在被动的虚拟体验中，用户只是在一个场景中移动，而不与之交互，行为和感官都有身临其境的感觉。在主动的虚拟体验中，用户不是被动地观看一个合成世界，虚拟现实变为由用户的动作和指令创造出的一个不断发展和变化的世界，一个主动的虚拟现实世界。在这样的虚拟现实世界中，一个用户经常在虚拟环境中与其他用户一起完成一项特定的任务。因此，主动虚拟现实由沉浸、参与和与环境的互动合作这三个主要部分组成。


    为了增强用户的沉浸感，虚拟现实设备有时会配备运动传感器，用于监测用户的身体、手和头部的运动，并相应地调整内容。头戴式一体机通常包括手持控制器、耳机或类似的设备，为用户提供完整的感官体验。2021年，Meta开发了新一代控制器，一种可以将大脑发出的运动信号转换为虚拟现实动作和增强现实动作的手环。这种手环使用肌电图'
  merge: -1
  img_proc: true
- pgno: 127
  md: '(EMG)来解读用户大脑的电活动，同时将运动信息发送到虚拟角色的手部。


    此外，先进的虚拟现实设备还有可能配备位置追踪器。该组件会追随用户的位置，并在虚拟环境中进行模拟，从而使用户在虚拟现实眼镜里看到的视图相应地改变。通过将实时计算机图形学与身体追踪设备、沉浸式音效与其他感官输入和输出设备相结合，用户可以获得一种更逼真的、同一时间多感官刺激的虚拟现实体验。


    增强现实与虚拟现实类似，也可以创建虚拟物体。不过，增强现实并不是为用户呈现一个全新的虚拟环境，而是改变用户通过特殊眼镜、手机或其他透明设备看到的现实环境。通过在现实世界的环境中叠加数字化的虚拟元素，增强现实应用程序可以“增强”现实世界中的环境，为用户看到的日常事物增加一系列虚拟的视觉、听觉、感官甚至气味效果。例如，旅游行业利用基础的增强现实技术将教育文本、图像和背景声音叠加到重要的历史遗址上。


    扩展现实家族中还有一个非常重要的成员——混合现实，它是虚拟现实和增强现实的集成。增强现实是在现实世界的环境中叠加虚拟物体，而混合现实让用户可以与这些虚拟的附加物进行交互，甚至操纵这些物体。例如，微软开发的HoloLens眼镜可以在物理环境中叠加3D图像，并对用户的反应或周围环境的变化做出响应，让用户沉浸式体验现实世界中的物体。目前，混合现实技术主要应用于工程、教育、娱乐和医疗保健等领域。


    这三种技术通常都是使用虚构的创作和基于现实的创作。虚构的创作是完全数字化的，基于现实的创作则是将真实的场景和用户分解为基本特征，再通过体积视频（ volumetric
    video）技术进行建模和重构，使它们适应不同的场景。目前，这种技术已经应用于体育类游戏的开发。在这些游戏中，玩家动作会被拍摄下来并复制到虚拟比赛的无数场景中。换句话说，游戏中的每一个动作都是根据基本特征的各种组合来建模的。


    在扩展现实领域，一家名为TetaVi的初创公司最近开发了一款产品，借助这款产品，专业工作室的演员和普通人在手机上就可以使用扩展现实技术。该公司的Solo软件适用于所有智能手机拍摄的单一视点视频。TetaVi还利用人工智能技术，通过独特的算法创建了一个拥有“生命”的'
  merge: -1
