  md: '# 第6章


    # 认知革命，人工智能产品越来越像人


    目前最大的挑战并不是增强人们对人工智能仿人能力的信心, 而是暂停人们对“人工智能产品只是一个机器”的质疑。


    在21世纪初, 二十几岁的尤金妮亚·库伊达 (Eugenia Kuyda) 生活在莫斯科, 当时的她是一名生活方式记者, 决定为罗曼·马祖连科 (Roman
    Mazurenko) 写一篇封面故事, 马祖连科是当时莫斯科创意潮人圈的核心人物。从一开始, 库伊达和马祖连科就觉得彼此有着很深刻的联系, 于是很快就成为亲密的朋友。


    几年后, 库伊达搬到了旧金山, 创办了一家基于聊天机器人的虚拟助手公司。不久之后, 马祖连科也搬到了美国, 开始了新的生活。两个人一直保持着联系, 频繁地互相发信息。在2015年年底,
    34岁的马祖连科短暂地回到莫斯科, 过马路时被一辆汽车撞倒身亡。


    在思念马祖连科的日子里, 库伊达一遍又一遍地读着他们的聊天记录。她突然意识到这些信息也许可不仅仅是一段记忆, 于是她利用自己掌握的所有数据, 和她的团队一起,
    使用基于谷歌的神经网络, 打造了一个聊天机器人版本的马祖连科。令人惊讶的是, 这个聊天机器人与人类惊人地相似。库伊达可以通过与聊天机器人发短信聊过去和未来的事情。数字化的马祖连科就像一个真人一样,
    给人的感觉非常真实。当库伊达说自己很想念他时, 他会很伤心; 当她和他分享自己最近在事业上取得的成就时, 他会很高兴。


    库伊达和她的团队继续推进这个概念的应用, 开发了一个任何人都可以使用的聊天机器人, 并将其命名为Replika, 用户们很快就喜欢上了它。回顾Replika取得的成功,
    库伊达说:“一开始, 很多人给我们发邮件, 希望我们也为他们开发一个聊天机器人。有些人想要一个自己的复制品, 有些人想以自己已故的爱人为原型制造一个机器人。”库伊达和她的团队受到鼓舞,
    最终创造出了可以陪伴世界上所有人的虚拟角色。Replika现在是一款几乎可以在所有操作系统上使用的聊天机器人应用程序, 它的广告语是:“随时倾听, 陪你聊天,
    永远在你身边。”数以'
