- pgno: 184
  md: '如非必要，我们不必阻止技术进步，但我们确实可以选择通过思考这些问题来为飞速发展的现实做准备。我们可以为这些问题制定指导方针和解决方案，而不是闭上眼睛等着革命到来。只有这样，当超市的货架上出现一系列机器人产品时，已经为关系5.0做好准备的我们才能够坦然面对。


    # 如何实现人造生物的多样性


    考虑到人造生物不断增加的“人口数量”，我们可能要解决一个重要的问题，即如何实现人造生物的多样性。首先要考虑的是性别问题，即我们应该以什么样的标准赋予它们性别，关系5.0面临的首要挑战就是性别平等。大量研究表明，当设计师或用户给机器人指定性别时，刻板印象就会随之而来。人们通常会认为女性机器人是温和的、包容的，男性机器人则带有权威感。一项研究测试了参与者对不同外形的机器人的反应，这些机器人的外形包括男性化外形、女性化外形、人形和机器形。结果发现，女性形象的机器人比男性形象的机器人更受欢迎，无论是人形还是机器形都是如此。面对“她们”时，参与者会更热情、更自在，感知能力也更强。另一项研究则聚焦于对机器人提出违背道德伦理的要求时机器人的反应。结果表明，在拒绝执行命令时，男性机器人比女性机器人更不礼貌，而女性机器人给人的感觉不那么权威。然而，另一项研究表明，人们会下意识地更信任系统自带语音为男声而非女声的计算机，并且认为女声不如男声友好。


    由于社会中的群体动力和偏见可能会转移到机器人的设计中，人造生物的性别划分应该非常谨慎。从市面上的机器人产品来看，女性机器人通常被设计为秘书和保姆，这些工作通常与女性相关，而男性机器人通常从事安全保护工作。厂家都希望自己的产品能畅销，所以利用某些偏见可能会对他们有利。如果人们发现在某种环境中女性比男性更有吸引力，那么一个具有女性外观和声音的机器人将比男性机器人更容易被消费者接受。这种情况不仅反映了当今社会中的刻板印象，还证实、强化了某些偏见。对这些偏见的利用会导致不平等和刻板印象永久化，而且可能引发非常不道德的行为。


    有人尝试解决这个问题，美国国家航空航天局的机器人宇航员助手Robonaut就被设计成无性别。即便如此，人们还是—直用“他”来指代Robonaut。尼古劳斯·雷德福
    (Nicolaus Radford) 曾是美国国家航空航天'
  merge: -1
  img_proc: true
- pgno: 185
  md: '局的机器人专家，也是Robonaut的首 席工程师之一，他表示：“在看到一个机器人时，99%的人会很快赋予它性别，而这个性别通常是男性。他们会直接问‘他有什么功能？’”


    类似的尝试还包括一个名为Q的无性别语音助手，它是由丹麦的几个组织（Copenhagen Pride `Virtue `Equal AI `Koalition
    Interactive和 Thirtysoundsgood）合作开发的产品，其设计理念是倡导对人工智能产品不做性别上的区分。Q的创造者在其使命声明中写道：“随着性别二元论被打破，那些既不认为自己是男性也不认为自己是女性的人得到社会认同，我们创造的技术产品也应该跟上时代的步伐。Q代表了我们希望中的未来，一个充满创意、包容和多元化科技产品，以及鼓励身份认同的未来。”然而，许多人认为这种解决方案的可行性不大，原因正如雷德福所说，人类通常会默认性别二元论，并将偏见和刻板印象投射到人造生物身上。


    出于这个原因，雷德福决定直接挑战性别刻板印象。2013年，他和他的团队设计了一款机器人，用于安保和救援等传统上主要由男性承担的工作，还聘请了一位法国平面设计师为它设计女性的外形。他们将它命名为Valkyrie，以此向北欧神话中的女武神致敬。


    尽管美国国家航空航天局的立场是机器人不应该有性别，但他们还是做出了这一尝试。该机构的官方声明是，Valkyrie的外观这样设计，是因为需要将一个13.6千克的电池组移到躯干，以平衡其重心。美国国家航空航天局公共事务官员杰伊·博尔登（Jay
    Bolden）说：“虽然它看起来确实有着女性的外形，但这样设计更多的是考虑到重量分布和功能，而不是为了区分女性或男性。”


    雷德福并不认同美国国家航空航天局对Valkyrie性别的看法。在一次采访中，他提到了自己7岁的女儿：“神话故事中的女武神是我女儿的一个很重要的灵感来源，她经常谈论她，也很喜欢画她。”


    另一种解决方案是开发可定制的机器人，允许用户选择其外形特征的每个部分。例如，用户可以为机器人选择典型的“男性”发型，但声音是“女性”的，并让它表现得礼貌又自信。这种解决方案也符合一些研究的结果，即用户与自适应机器人在一起时感觉更好，与它们形成了更强的联结。不过，选择这种解决方案的前提是用户不会自己将刻板'
