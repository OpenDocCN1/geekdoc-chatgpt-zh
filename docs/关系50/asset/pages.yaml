- pgno: 145
  md: '图7-2 男性与女性对虚拟现实技术的态度对比


    一些研究人员据此认为，传播这些技术只会让男性在使用这些技术时更加物化女性。我们应该重视这些问题，仔细识别、严格监管并采取预防措施，以确保扩展现实技术在这些领域的应用是安全的，不会导致不公正的现象，对此我将在第9章中进行详细介绍。


    无论我们如何评判扩展现实技术应用于成人娱乐产品行业的目的，事实是扩展实在这个领域掀起了一场真正的，具有影响力的革命。尽管会有很多人批评指摘，但如果监管到位，伦理问题得到解决，扩展现实技术能够以多种形式造福社会。心理医生和性学家已经开始使用扩展现实技术，并看到了它对关系的显著而积极的影响。


    # 接纳、拥抱感官革命，关键是取其精华、去其糟粕


    尽管扩展现实技术创造出了很多人梦寐以求的虚拟世界，但许多人仍然无法接受这种技术所产生的虚拟关系。对于人类与虚拟人物建立关系，有些人表示支持，比如30岁的单身男性马克，这位来自纽约州北部的计算机科学家表示：“我认为人与人之间的互动也没有那么重要，而且大多数互动都在转向虚拟化。”


    另一些人出于某些原因持保留意见，比如来自佛罗里达州的47岁已婚女性米卡，她表示：“我认为这大错特错。人与人之间需要实际的接触，让他们陷入虚拟关系、与现实生活隔绝不是一个好主意。我认为这很奇怪，可能会阻碍人们提高日常生活中所需的社交技能。”47岁的埃丝特是一名来自加利福尼亚州的单身女性，她说：“我认为这有一些好处，但总的来说，用虚拟朋友取代人类朋友不是一件好事。我觉得这会让人们感到前所未有的孤独，让他们不再与真实的人互动。在某些情况下，它可能会对人们有所帮助，但我认为它带来的问题会比解决的问题多。”


    如果开发者想让扩展现实技术像智能手机一样得到普及，他们必须解决这些人提到的问题。其一，有人质疑这些技术能达到的“真实”程度，以及它们能在多大程度上创造出真正令人满意的互动，他们怀疑人们在使用扩展现实技术时会感到更孤独。其二，许多人担心使用扩展现实技术后自己的沟通能力会下降。在《重拾交谈》(Reclaiming
    Conversation)一书中，雪莉·特克尔(Sherry Turkle)表达了这样的担忧，她详细阐述了新兴'
  merge: -1
