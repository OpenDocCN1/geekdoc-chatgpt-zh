  md: '科技的空间,并不能代替一个真实的人。人类 的情感是复杂的,而总是用‘是’来回答的它们对人类来说太简单了。人际互动的价值体现在双方都会主动满足对方的需求,这样的关系才健康。”


    毫无疑问,如果人工智能系统想满足人类对亲密感、共情和情感理解的需求,哪怕只是部分满足,人工智能必须继续革新,从仅仅能够以类似人类的方式交谈的聊天机器人,发展到能够与人类建立情感联系的机器人。换句话说,人工智能系统的对话能力应该更进一步,朝着情感层面发展。


    这样的发展正在进行中,它们大都来自心理学领域。在心理治疗的过程中,理解患者的情绪、准确有效地做出回应、引导出建设性情绪反应都是非常重要的。从理论上讲,人工智能系统可以做到这几点,同时还具有全天候提供服务、价格更低等优势,而且不会使患者产生在与人类心理医生交谈时偶尔会产生的羞愧感。


    20世纪60年代,聊天机器人Eliza问世,这是人类首次尝试将人工智能与心理治疗结合起来。作为一种自然语言处理程序,Eliza可以模仿一些常见的心理治疗方法。具体来说,Eliza参与了罗杰斯疗法(Rogerian
    psychotherapy),它会根据患者的陈述和流露出的情绪来提问。例如,在与Eliza的一次著名的公开对话中,一名患者表示自己不开心,Eliza问:“你能解释一下是什么让你不开心吗?”当然,与现在的聊天机器人相比,Eliza所能做出的回答相对有限,但在当时,这次实验性的治疗被视为一次重大突破。


    在20世纪60年代,自动生成与治疗相关的论文和分析结果的程序还不够成熟,无法参与完整的心理治疗过程,这种不成熟导致之后很多年这个领域一直没有开展更深入的研究。随着编程能力和计算机处理能力的提高,心理治疗聊天机器人变得越来越精密。20世纪80年代,研究人员开始探索人工智能如何通过复杂的访谈来进行简单的心理诊断,编程技术的进步也使人工智能能够记录和保存大量诊断信息。虽然人工智能心理治疗在当时仍然处于初级阶段,但与以前相比,这些研究已经取得了重大进展。这些人工智能系统能够参与简单的认知行为疗法(cognitive
    behavior therapy, CBT),与罗杰斯疗法不同,认知行为疗法需要人工智能来决策。'
