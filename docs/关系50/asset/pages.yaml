  md: '机器人的总估值为6.2亿美元。2024年,高盛投资银行将其对全球人形机器人市场发展的预测从目前的60亿美元提升至2035年的380亿美元,并报告称,早在2023年就已观察到此类机器人单价的显著下降——从2022年的25万美元降至15万美元。据估计,到2025年,人形机器人的市场规模将超过270亿美元。


    2021年,特斯拉公司创始人埃隆·马斯克宣布将在未来几年专注于制造人形机器人,这使人形机器人市场规模的预测看起来十分合理。马斯克说:“它会对人类很友好,能够在人类生活的环境中执行任务。”根据特斯拉公司的公告,这个名为擎天柱(Optimus)的机器人高约172厘米,重约57千克,拥有与人类相似的手和脚。同年,亚马逊推出了机器人Astro。随后,三星、戴森和小米等公司也纷纷加入这一浪潮,甚至一些以色列的初创公司,如Unlimited
    Robotics和Menti Robotics,也加入了这一行列。虽然目前处于第一阶段的人形机器人功能有限,但毫无疑问,像特斯拉这样的大型公司以及紧随其后的初创公司,将通过产品的频繁更迭换代为人们带来越来越好的使用体验。


    事实上,早在2023年底,也就是第一版发布后的9个月,特斯拉就发布了其第二代改进版擎天柱机器人。2024年,英伟达也加入了这些公司的行列。在其年度开发者大会上,英伟达宣布通过名为Project
    GR00T (Generalist Robot 00 Technology,通用型机器人技术)的操作系统进入这一新兴市场。该操作系统旨在帮助任何制造商设计出能够借助生成式人工智能运行的机器人。


