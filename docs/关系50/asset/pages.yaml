  md: '金振宇(Jinwoo Kim)是韩国延世大学的人机交互教授,致力于研究数字疗法,特别强调声音在治疗过程中的重要性。一般的心理治疗聊天机器人主要通过文本信息和打字与患者交流,金振宇所主导的研究项目“人类与人工智能交互”(Human-AI
    Interactions, HAII)则不同,它侧重于以语音为交互点,这使整个治疗过程更接近与人类心理医生的互动。在理想情况下,患者或用户不需要做出特定的举动或以不自然的沟通方式来传达聊天机器人所需的信息。他开发的机器人使用语音编程来治疗精神疾病,如抑郁、焦虑、痴呆、多动症等。这一发展在未来可能会发挥重要作用,当语音控制的心理治疗人工智能与激增的语音控制设备(如亚马逊的Alexa)相结合,这种治疗方式将普及开来。


    印度初创公司Touchkin推出了一款由人工智能驱动的聊天机器人Wysa,可以帮助诊断、治疗抑郁。除了对话功能,它还提供多种冥想练习,还能提醒用户养成健康习惯,跟踪用户的活动进度等。产品描述这样写道:“Wysa是你的
    人工智能朋友,你可以免费和它聊天。快来和可爱的企鹅说说话,或通过它提供的免费正念练习来缓解焦虑和抑郁,进行压力管理。它是一个非常可爱、平静的聊天机器人,所说的话是基于心理治疗技术,可以帮助你更好地应对精神障碍,管理压力,改善心理健康状况。”


    对于早期的心理治疗聊天机器人(如Eliza),人们是意外地发现了它们的潜在用途,而对于Wysa,研究人员是有意地开发其潜在客户群体。研发人员意识到Wysa可能对缓解焦虑有帮助,但他们也意识到,有些人不一定是想寻求临床治疗,可能只是希望改善心理健康状况。因此,他们在描述这款产品时非常谨慎,以确保它对这两个群体都有吸引力。


    很多类似的聊天机器人正在开发中,支持这些聊天机器人有效性的证据也在不断增加。斯坦福大学研发的基于文字交流的聊天机器人Woebot就是其中之一。我在前文中提到过,Woebot是一款旨在与用户聊天和互动的应用程序,主要关注用户的心理健康,使用认知行为治疗技术帮助用户解决压力大、孤独和其他常见的心理健康问题。因此,Woebot不仅具有对话功能,还可以为用户提供有效的心理健康咨询。


    2017年,研究人员针对这款聊天机器人进行了一次实验。70名年龄在18~28岁的参与者被随机分为两组,一组使用Woebot进行了为期14天的自我帮助,对照组则得到了一本名为《大学生抑郁》(Depression
    in College Students)的电子书,由美国国家心理健康研究所提供。两组参与者在实验开始时都接受了关于自身心理健康状况的问卷'
