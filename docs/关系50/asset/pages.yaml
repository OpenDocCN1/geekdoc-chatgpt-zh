  md: '当然，科技的发展也给人类带来了新的问题。在狩猎采集社会，当居住地自然环境恶劣、气候干旱导致食物短缺时，人们可以迁徙到水土丰沃之地。对定居下来的人来说，搬家可不是那么容易的事情，当气候条件很恶劣时，他们需要找到自保的办法。


    人类其实一直为恐惧所驱使，只是 有时候我们并没有意识到它带来的影响。有时，未雨绸缪、居安思危的心理会让我们做出过激的举动，以应对不测之灾。当时，人们就受到了这种心理的影响，定居生活带来的恐惧使他们对邻居充满敌意。为此，他们制造足够多的武器，并训练年轻人，随时准备在条件艰苦时与周围物资更丰富的部落开战。相比之下，建造粮仓、积累资产是更和平的预防物资短缺的方式。经过多年的发展，保存食物和储存物资的技术不断改进，人们得以在较长时间内积累各种各样的财产。


    这些看似不起眼的科技进步引发了一场社会结构变革。史前时代的社会结构往往非常扁平，部落成员一起劳作，大家分工明确、共享成果，但农业的兴起和财产所有权的出现从根本上改变了这一点。一旦人们开始积累财富、扩张土地，他们在此之前享有的相对平等就不复存在。经济阶层出现了，财产所有者的权利需要得到保护，以免受到无财产者的侵犯。两者之间的经济差距体现在房地产、奢侈品甚至某种谋生的权利上。随着时间的推移、人口的增长，土地越来越难获得，想要拥有土地，人们就需要越来越多的财富。


    赫梯和埃及这样的帝国出现了，在这些国家，精英阶层依靠向当地居民征税生活，僵化的阶级结构和等级制度逐渐形成，社会流动性普遍较小成为农业社会的核心问题。无论在哪个地区，掌权者都是拥有最多财产的人，那些没有足够的土地和资源的人只能为地主干活，从而获得劳务报酬。


    公平地说，一些掌权者不只是将收集到的资源用于维持自己的生活方式，也用于服务当地居民。农业科技的进步推动了税收的增加，这反过来又促进了整个社会的发展。例如，罗马人发明了有利于农业社会发展的先进科技，如土地轮作和选择性育种，还培育出了新的农作物品种。到了农业时代后期，中世纪封建社会中出现了一种能够确保社会生产顺利进行的机制：庄园主征收土地税和地租，同时也为农民提供服务，这反过来又有助于贵族阶级维持他们的生活方式。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '随着财富积累的兴起和财产所有权的形成, 社会上出现了一种新的需求, 即记录、规划和监管资产, 而帮助人类满足这一需求的手段是另一项伟大的科技创新——文字。大约5000年前,
    美索不达米亚地区的苏美尔人崛起, 世界上最早的文字随之诞生, 人们开始用文字记录每个人拥有的财产。中国人和埃及人在大约同一时间创立了自己的文字系统。在农业社会,
    人们十分关注家庭生计和财产积累, 有了文字, 他们终于得以详细登记、继承财产, 并通过书面记录的方式加以保护。


    文字是一项革命性的发明, 在此之前, 知识和故事只能通过口头传播, 现在它们可以被写下来并保存几天、几周、几年, 甚至更长时间。知识可以更容易地传播到世界各地,
    故事传说得以代代相传, 教会孩子们明辨是非。金融交易也被记录下来, 人们可以用书面合约来约束交易行为。所有这些书面材料都是保护财产权、保持社会结构稳固的关键。


    在古埃及, 文字也得到了广泛使用。埃及古物学家发现了几种类型的文字, 其中很多种可以追溯到古王国时期 (公元前2686年——前2181年)。在建造金字塔和其他工程时,
    埃及人用文字做了大量的记录。此外, 埃及人还记录人口数量以便进行纳税评估, 颁布国王的命令, 记录付款明细, 传播科学知识, 等等。简言之, 埃及人在很早的时候就用文字记录社会中的重要事情。学界普遍认为,
    埃及人发明了早期的会计制度。考古证据表明, 抄写员记录的数字里甚至有分数, 象形文字中还有表示100万的数字。


    除了文字, 轮子也是一项影响深远的发明。随着它的出现, 商业迅速发展起来。大约在公元前3500年, 轮子诞生于美索不达米亚地区, 最初用于陶器制作, 但很快就被做成了推车,
    用于货物运输。通过这种运输工具, 人们可以将货物送到邻近地区, 甚至更远的地方。


    在贸易活动的推动下, 货币出现了, 它也许是文字、贸易、财产所有权三者相结合的最终表现形式。在此之前, 财富通常以土地和所有物来衡量, 货币的出现改变了这种衡量方式。最早的货币似乎是由贝壳、盐、黄金或白银制成的,
    随着冶金技术的发展, 铸造货币的材料也发生了变化, 青铜、锡和铜在不同时期成了常见的铸币材料。在印有亚历山大大帝头像的货币出现之后, 印有图案的货币变得普遍起来。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '这些货币很快成为一种国际通用的商品交换工具，而商品是依靠新发明的轮子来运输的。就这样，人类掌握了更简单的手段来记录、交流、交易和运输，这一切构成了一个既能进行国际交流、内部也能正常运行的社会的基础。在商人群体中，人们还开发了处理信用和债务的系统，失信者将面临惩罚。例如，如果一个商人拖欠债务，地方当局有时会禁止与之来自同一国家的所有商人在该地区进行贸易活动，直至债务还清为止，这就形成了一种“同侪压力”，有助于债务催收和合同执行。


    法律监督机制的建立最早也是始于这种动机，人们制定法典就是为了规范一个定居点或国家的居民之间的商业事务。例如，古巴比伦国王颁布了《汉谟拉比法典》，它是人类历史上非常古老的成文法典。该法典的内容主要是关于财产的，包括了最早的商法典，还有几个章节涉及信用、债务和贸易的问题。今天对损害财产和盗窃等行为的诉讼程序也可以追溯到该法典施行的时代。


    人们总是习惯性地认为人类的发展是随机而分散的，因此各地的文化一定存在差异。令人惊讶的是，一旦某些社会规则或科技传播开来，各地的文化就会以非常相似的模式发展起来。研究人员指出，汉谟拉比在法典中规定的惩罚与希伯来圣经中的惩罚手段相似，而且两者几乎形成于同一时期。


    对于农业社会中的法律，一个较晚的例子是中世纪的商法。该法典在整个欧洲都适用，用于确保商业公平以及违规者受到应有的惩罚。从本质上讲，该法典旨在解决地方法律差异这一重要问题。在中世纪，地方法律有时对外国来访者没有约束力，或者对他们的约束力与对本地人的约束力不同。为了应对这种情况，确保贸易活动顺利进行，商人们编制了一套统一的“行为准则”。


    这些法典集中体现了那个时期财产所有权的兴起。无论是《汉谟拉比法典》等一般民法法典，还是中世纪的商法，都明确规定了财产保护的措施，赖账、欺骗或偷窃的人一旦被抓住，将会受到不同程度的惩罚，包括死刑。


    财产所有权的另一种表现形式是某些人拥有另一些人。农业社会中的劳工有时是没有人身自由的。古代奴隶制的一个早期典型例子是《圣'
  merge: -1
  img_proc: true
- pgno: 49
  md: '经》中犹太人先后被亚述人和巴比伦人奴役；古雅典人也普遍拥有奴隶；希腊的大多数奴隶都在主人家中做工，但也有记录显示他们参与了商业活动，还会为主人跑腿。


    中世纪还发展出了另一种类似的农业劳动管理制度，即封建制度。不同于古代的奴隶制，封建制度将穷人与土地捆绑在一起，让他们参与农业生产。庄园主提供土地和农民生活所需的一切，作为回报，农奴必须向庄园主纳税，后来还出现了地租。就这样，源源不断的财富流向上层阶级，那些人可以享受奢侈悠闲的生活。


    为了更好地理解农业社会的各个方面如何影响家庭结构和关系的建立，我们再来看看继承制度的发展历程。除了商法，家庭法也与商业紧密相关，它的重要性在于帮助确定人们通过继承能够获得什么。在整个农业时代、整个古代世界、中世纪的欧洲和其他地区，继承一直是法律上的一个重要议题，也是政府和宗教关注的重点。


    对那些地主阶层的家庭来说，能够继承足够多的土地非常重要，这意味着可以维持稳定的生活。若想维护农业社会结构，地主阶级就必须拥有足够的耕地，从而使家族的农业活动能够获得经济效益。在这种因素的影响下，土地和劳动力资源逐渐集中在一起，家庭结构开始向多代人同堂的方向发展。


    农业社会是围绕着田地和农场发展起来的，财产所有权处于社会活动的核心位置。社会等级制度逐渐形成，帝国兴衰更迭，但有一点是不变的，那就是社会和经济的发展都围绕着财产的获取和保护。文字、法律和继承制度都用于确定谁拥有什么、拥有多少。多代同堂的家庭结构非常适合这种社会环境，对此，我们将在下文中展开讨论。


    # 关系2.0, “家”的出现


    随着农业科技的进步，家庭、婚姻和关系的意义发生了显著变化。人类从采集食物转向生产食物，这一根本性转变使人类的居住方式从不断迁徙变成了定居。人们不再四处游荡，也不再追着动物狩猎，而是建造了永久性的住房和农场，并开始制作陶器、珠宝和精美的石器。社会安定下来了，人们不再需要为是否以及如何携带积累的财产而烦恼，随之出现了一个新的概念——家。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '这种变化对婚姻和关系产生了深刻影响。**社会1.0关注的是远亲繁殖和物种生存的需求,而农业社会关注的是财产所有权,这种需求的变化催生了确保财产安全保存和转移的措施。**从这个意义上说,婚姻勾勒出了财产所有权的边界,并在不同家族的土地和农场之间建立起了新的联系。


    婚姻制度不是一成不变的,它在这一时期不断发生变化,关系也出现了各种各样的形式。在农业社会,人们选择婚姻的主要考虑因素之一是可以拥有更多财产,因为加入一个家族就意味着有权分享这个家族的财富。这些财富的形式通常不是容易分割的货币,因为在农业社会初期,货币还没有被发明出来,当时的财产主要是土地和贵重物品,后者包括珠宝和武器等。


    # 关系的进化 基于价值的“爱情”


    当时的人做出结婚的决定都是出于经济和财产方面的考虑。在特权阶层中,婚姻这种契约关系凝聚了两个家族的力量,通过赠予、遗产和合作的方式将土地所有权和政治权力结合起来,同时也是为了维护血脉。在下层阶级中,人们需要通过婚姻来维持生存,男性通常会根据女性的潜在经济价值和生育能力来挑选配偶。例如,出于对下一季农作物产量的担忧,男性通常会选择吃苦耐劳的女性,因为在农忙季节她们可以帮忙干农活。


    这些因素使得浪漫的爱情在当时只能是一种奢望。试想一下,当持续的干旱之后,来年春天很可能颗粒无收时,谁还有心思追求爱情呢?随着社会不平等的加剧,婚姻变成了以经济利益而非情感为主导。婚姻和出身决定了一个人的经济地位,因为财产会在一个家族代代相传,与经济地位相当的家族联姻成为人们巩固社会关系手段。


    美索不达米亚地区的婚姻制度就是一个很好的例子。在该地区,婚姻成为一种习俗繁缉的经济交易,而不是情感行为。在《从苏美尔到巴比伦》(From Sumer to
    Babylon)一文中,历史学家让-雅克·格拉斯纳(Jean-Jacques Glassner)深入分析了美索不达米亚地区的家庭习俗,强调了婚姻在苏美尔人和巴比伦人生活中的重要性。根据他的分析,尽管按照当时的习俗,男人不需要征得女方同意就可以选择任意一个女人做他的新娘,但大多数男人更愿意通过一系列步骤来完成整套结婚流程。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '第一步是选新娘。通常来说，一个家庭很早就会为家里的女儿安排包办婚姻，这样可以确保女孩在人生的大部分时间里都服从夫家的权威。由此可见，在当时的社会，人们将婚姻视为财产所有权的延伸。女性不仅受到夫家的约束，甚至必须同意在丈夫去世后嫁给他的兄弟或其他亲戚。


    第二步是支付一笔被称为“terhatum”的款项，并签订一份名为“riksatum”的法律契约。金钱的交易和契约的订立再次确保年轻女子成为未来丈夫的财产。


    第三步是宴请宾客、赠送食物（被称为“biblum”）。双方家庭相互传递这种食物，以此显示他们之间的联盟、炫耀他们的财富。新娘的家人想要证明他们的女儿来自一个经济条件良好的家庭，新郎的家人同样努力证明他们家庭完全有能力养活一个新成员。在美索不达米亚神话中，恩利尔（Enlil）是掌管风、空气、大地和风暴的神，他与妻子苏德（Sud）的故事也表明了送礼对于婚姻的重要性。当恩利尔在苏德母亲家门前的街上看到年轻美丽的苏德时一见倾心，但苏德拒绝嫁给他，于是恩利尔决定给她家里送礼物。在苏德家人收到礼物之后，苏德便成了恩利尔的妻子，被带进了他的神庙成为“天后”，掌管一切与女性有关的秘密。


    在其他文化中，婚姻是一个几乎不存在的概念。例如，如果阅读古埃及时的文字记录，你会发现其中几乎没有用来描述婚姻制度的词，原因是当时没有官方的统一形式或宗教仪式来纪念这一事件。对埃及人来说，结婚更多是出于经济目的，也是为了生育后代，婚姻不是法律或宗教问题。因此，埃及文献中经常用男人們“建立家庭”这一说法来形容婚姻。在大约公元前1000年，文字合约中甚至出现了父亲将女儿“送给”她未来丈夫的描述，可见当时的婚姻由女子的父亲和未来丈夫决定，女人很少能决定自己嫁给谁。


    在早期的帝国中，财产所有权依然极为重要，一个家族的掌门人去世后，整个家族必须由男性继承人执掌。在许多文化中，如果一位女性不能生育男性继承人，她丈夫就会寻找侧室。一般来说，正妻生下的孩子才是“合法的”家产继承人，但当男人娶了不能生育的女祭司时，传宗接代的任务就会由侧室来承担。这种现象普遍存在于巴比伦、埃及、印度、印加和阿兹特克，由正妻所生的儿子继承家业成为一种惯例。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '类似的继承制度在中世纪仍然存在。研究表明，继承权的合法性在全世界都是备受关注的问题。世界各地都有男性“纳妾”的现象，但能够继承大部分财产的继承人必须由指定的女性所生。这种现象的成因有几个，最主要的是在大多数文化中，对女性的约束其实是将她们当作“财产”来保护，男性想要确保孩子是自己亲生的，这一点对他们来说非常重要。


    # 关系的进化 婚姻是一种以交易为目的的社会制度


    在这个时期，婚姻一直是一种主要基于交易目的的社会制度。通常而言，新娘和新郎的需求并不重要，婚姻只是双方家庭之间公开商定的一纸契约。很多时候，婚姻是现实所需，而非理想所愿。人们在选择配偶时都很精明，上层阶级关心的是家族财富或权力的延续，而下层阶级关心的是基本的生计。一段婚姻成功的标志是它巩固了两个家族的财富和社会地位，而不是新郎新娘两情相悦。这一基于经济因素、经双方协商一致达成的契约经过宗教机构批准，一段婚姻才合法有效，并得到神佑。


    对精英阶层来说，未经双方家庭同意的婚姻是一大问题，不仅给王室联姻增加了难度，冲动之下选择的配偶往往还存在不般配的风险。在16世纪，法国国王亨利二世就曾试图说服天主教会要求结婚必须经过父母同意，并让教会宣布未经父母同意的婚姻无效。天主教会并没有按照他的意愿行事，这导致了激烈的冲突。最终，天主教会决定更加严格地规定缔结婚姻的条件：两个人若想结婚并举行圣礼，必须得到教会和双方家庭的同意，仪式也要依靠牧师来完成，不能完全自主。


    到了文艺复兴晚期，现代婚姻的雏形才形成，人们开始出于对陪伴的追求而选择婚姻。社会对晚婚的态度的转变就是一个很好的证明：在18世纪以前，晚婚会被人嘲笑，而在这之后的一些社会中，过了适育年龄才结婚甚至离婚再婚都被认为是可以接受的，因为婚姻能够带来陪伴。


    # 多代同堂, 农业时代最理想的家庭结构


    关系2.0的建立主要基于经济和财产方面的考虑, 家庭结构也以多代同堂为主。随着农业科技的发展, 人们的注意力逐渐转向耕地和农场。在这种背景下, 多代同堂是最理想的家庭结构,
    因为血缘关系意味着财产所有权、继承规则和劳动分工是明确的。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '在多代同堂的家庭中，每个成员都有自己的职责，如耕种劳作、喂养牲畜等。老年人会和子女、孙子孙女以及其他家庭成员住在一起，在这样的家庭中，每个人都能得到照顾，家族财产是家族存亡的关键。这样的大家庭大都住在自家田地附近，房屋通常构造简单，大家共用厨房。


    家庭变成了一个群体，大家生活在一起是为了实现共同目标，如经营农场或家族生意。这个群体可能包括学徒、收养的弃儿、仆人和奴隶。在一些大家庭中，没有继承权的“多余”的孩子往往会成为底层阶级，只能做仆人、雇农或学徒，也可能参军，或者为当地的地主做工。有一些大家庭会将其他家庭没有继承权的孩子收为仆人，让这些孩子和他们生活在一起。例如，在整个地中海地区的人口普查中，这些孩子与主人的妻子和孩子一起被统计在内。在农业文化中，多代同堂是最常见的生活形式。社会的基本单位变成了由父母、孩子、祖父母和其他近亲组成的多代同堂家庭。


    这种多代同堂而非核心家庭的家庭结构观念一直延续到工业社会，你只需研究一下词典中“家庭”一词定义的变化就会发现这一点。16世纪和17世纪的词典将“家庭”一词定义为整个家庭，包括了大家庭的所有成员，甚至仆人。到了18世纪，词典中“家庭”一词的定义变窄了，这一变化恰好与欧洲从农业社会向工业社会过渡同步。


    经过了几个世纪，浪漫的婚姻模式才成为常态，核心家庭随之出现。**到了18世纪晚期,基于感情而不是经济状况来选择伴侣才被人们接受,并流行起来。**这种改变主要是从下层阶级开始的，他们选择配偶时受到的干扰逐渐减少，浪漫成为他们考虑得更多的因素。在上层阶级中，父母为子女选择配偶时仍然更看重对方家庭的经济实力，至少在19世纪仍是如此。这是因为上层社会的父母能够给予子女经济上的支持，他们依然希望通过联姻来使家族的经济地位和社会地位更上一层楼，防止财富分散。这种重大的转变再次与该时期重要的科技发展同步，对此，我将在下一章中详细解释。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 第3章


    # 关系3.0, 核心家庭日渐重要


    **工业社会对婚姻和关系的模式产生了重大影响, 核心家庭逐渐取代了过去围绕着田地、农场和作物的多代同堂家庭。**


    随着人类文明的进步, 社会发展的周期越来越短, 变革也越来越频繁。公元前200年和公元200年出生的罗马人生活在非常相似的世界里, 但对一个14世纪的英国骑士和一个18世纪在曼彻斯特的工厂工作的英国人来说,
    他们的生活方式天差地别。在过去, 人们追求的是稳定, 但这条规则在18世纪发生了变化, 其他的一切似乎也随之改变了。


    从18世纪中期到20世纪中期, 工业革命从根本上改变了大多数人的日常生活。在长达1万多年的社会2.0, 人类定居下来, 耕种土地, 获得收成, 科技又一次实现了飞跃。蒸汽机和电的发明彻底改变了人类的生活,
    以惊人的速度和效率生产商品的工厂如雨后春笋般冒出来, 遍布世界各地。


    **工业社会还出现了一个有趣的转变: 人类在农业革命期间“驯化”了周围的环境, 工业革命时期的工厂和生产流程又开始“驯化”人类。**人们依赖新的机器和生产方式来养家糊口,
    它们成了人们生活的重心。随着时间的推移, 人们涌向城市里的工厂工作, 进入了一个以科技发展为社会中心的世界。


    工业社会对婚姻和关系的模式也产生了重大影响, 尽管影响机制很复杂且不完全一致, 但有证据表明, 工业化极大地促进了核心家庭的形成。这种家庭结构更适合城市化和工业化,
    它逐渐取代了过去围绕着田地、农场和作物的多代同堂家庭。在农业社会, 大家庭共享土地和牲畜, 人们选择婚姻的一个主要原因是保护财产所有权。相比之下, 工业社会中的家庭以新的生产方式为中心,
    家庭成员住在城市里的狭小房子里, 因此需要核心化。


    # 知识的获取与传播革命'
  merge: -1
  img_proc: true
- pgno: 55
  md: '在工业化普及之前，知识获取方法的变化就预示着这一时期的到来。在17世纪早期，培根就主张将通过数据和测量获取知识的过程系统化。沿用至今的科学方法（公认的获取知识的方法）就是由培根提出的，而且几乎没有变化。如今，随着人工智能的发展，我们探索世界的方式逐渐从观察和推理转变为数据挖掘和事实主导，并充分意识到“培根革命”在人类思想史上的重要性。


    在培根之后问世的很多著作也产生了深远影响，比如达尔文在1859年出版的《物种起源》。这些作品改变了人们的思维方式，以及人们探索、发现新事物的方式。人类开始相信实践出真知，而不是盲目依赖信仰，这种转变带来了科技的飞跃，现代意义上的科学和科学研究获得了发展，并得到越来越多的关注。


    与知识获取方法的变化密切相关的是知识传播方式的转变，大规模印刷的出现和技术学校的涌现起到了至关重要的作用。虽然知识是无价之宝，但将知识保存在修道院和寥寥几所大学里对科学发展没有任何好处。如果知识无法传播，当时已经出现的各种图表、模型以及获得的科学发现就无法帮助人们学习和进步。随着印刷技术的发展，知识得以被轮转印刷机印在长长的纸卷上，思想变得更容易传播了，这吸引了众多从前被埋没的智者。到了19世纪，技术学校的涌现进一步促进了科学知识的传播。这些新学校为科学发展提供了一个新的机会，并引发了新一轮的创新浪潮。


    从工业革命开始，世界见证了比人类历史上其他时期都多的、令人难以置信的创新壮举，如机械织布机、缝纫机、新的铁器加工方式、蒸汽动力、化学品和水泥的全新生产方式、电报、炸药、现代装配生产线等。这些发明提高了商品生产的效率，简化了人类为了生存所需付出的劳动，并为未来更重要的发明奠定了基础。


    工业革命也对食物供应产生了直接的影响。前工业化社会因劳动生产率低而饱受物资匮乏之苦，而工业社会解决了这个问题。通过商品的大规模生产和快速高效的运输系统，农业和食品加工业的面貌彻底改变了。新技术的出现使得人类能够获得充足的物资，人口急剧增长，尤其是在工业社会后期。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '工业革命带来的深刻影响还体现在时间和空间的概念上。煤气灯和电灯泡的发明点亮了黑暗的角落，人们拥有了更丰富的精神生活和物质生活。世界各地的城镇迅速被光点亮，这彻底改变了白天和黑夜的意义。工厂得以在天黑之后继续生产，大大提高了生产率。此外，蒸汽和电也许是改变人类空间观念的关键因素。随着铁路的发展，运输、旅行的时间缩短了，遥远的地方似乎变得近了一些。


    # 夫妻结合是感情驱动, 而非经济考虑


    这些科技变革对宗教的影响产生了连锁反应，继而影响了关系。在18世纪之前，社会规则一直是由教会制定，并由国家强制执行。如果一个人在公共场合做出教会所定义的不良行为，人们会揭露、嘲笑他的这种行为。国家负责执行道德戒律，警察可以调查涉嫌亵渎神明的行为，甚至可以以此为由破门而入。男人被认为是一个家庭精神和法律上的领袖，可以采取必要的手段来维护这种权威。教会不鼓励夫妻享受性亲密，而更多地将其视为生育所需的义务。因此，当时的人约束自己的行为主要是出于责任和义务，而不是出于爱或自身利益。


    教会霸权的削弱标志着重大的社会变革，这一点尤其体现在欧洲国家及其殖民地。尽管科技革命很复杂，也不是全球性的，但它在这种变革中发挥了至关重要的作用。例如，有证据表明，学校科学课程中的内容与宗教教义相冲突。此外，一些打破了神父和牧师所阐述教义的科学发现也引起了公众的注意。


    慢慢地，实践出真知的理念取代了对旧公理的盲从，科学削弱了人们对旧传统的信任，生活开始以新的生产方式为导向。尤其值得一提的是，以强烈的求知欲以及不受控的怀疑主义和无神论为特征的启蒙运动为信仰危机奠定了基础。思想家们提出了一种不需要教会来维护社会秩序的新概念。在18世纪，宗教对社会的影响开始减弱。


    随着教会和“道德十字军”失去对社会的控制，宗教观点变得不那么重要了。如果某件事对政治秩序不构成威胁，那么它更可能是一件与国家和教会无关的私事。在那个时代，年轻人即使没有严格遵守社会规范也不用承担压力，而国家也放松了对公民生活的控制。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '随着隐私变得越来越重要，核心家庭的观念也变得越来越不容忽视。这一点很容易理解，由于外界干涉减少，个人生活的某些方面变成了私事，可以由关系中的两个个人自己决定。人们开始重视两个个人之间的情感关系，以感情为基础的婚姻变得越来越普遍。最终，两个人结合在一起是出于感情而不是经济考虑的观念迅速传播开来。


    有趣的是，这种变化导致某些国家进入了另一个阶段。在这个阶段，夫妻关系和核心家庭实际上处于危险之中。随着原有的规范被打破，人们的行为不再需要教会的批准，他们抛弃了旧的道德规范，在性方面也少了很多约束，一些人变得为所欲为，最终的结果是非婚生子的现象增多，结婚率降低。在下层阶级中，这种现象尤为普遍。


    为了反对这种婚姻观念，天主教教会进行了宗教改革。他们巧妙地将婚姻从一种交易性质的“必要之恶”变成了一种重要的社会制度，开始强调婚姻有助于社会团结，于是婚姻成为一种神圣的制度。从那时起，天主教教义中出现了鼓励婚姻的内容，对关系3.0的推动作用越来越大。


    关系3.0的故事更像是工业城市的故事。若想深入了解工业化带来的巨变，最好的方式是观察工业城市的崛起历史, 同样, 若想了解关系和婚姻的变化, 最好的方式是观察城市的发展。


    # 工业城市的崛起, 核心家庭出现


    工业化和大城市的兴起齐头并进，人类社会从农业社会转向工业社会，从乡村型社会转向城市型社会。烟雾弥漫的天空、热闹的街道和陌生的人群构成的城市成为新一代人的家园，似乎与传统、宗教甚至历史都斩断了联系。各种新事物、现代文明和世俗主义蓬勃发展，多代同堂的家庭成了旧时代的产物。多代同堂家庭的孩子曾经被农田包围，长大后搬到了城市里，在大工厂周围生活。男人只带着妻子和孩子移居城镇，大家庭的成员们不需要再住在一起。工业化的城市中出现了一种全新的家庭结构，即核心家庭。


    这种从农场生活到城市生活的转变是不可阻挡的。农业科技的创新提高了土地生产力，马拉播种机、化学肥料等发明使农业生产效率变高，劳动强度变低。因此，地区性的、自给自足的、分散的农业转变'
  merge: -1
  img_proc: true
- pgno: 58
  md: '成了商业化农业。过去只能手工制作的物品现在实现了批量生产，这导致农村出现了剩余劳动力，于是他们放弃了一直以来赖以维持生计的传统农耕模式，搬到城市寻找机会，逐渐适应了快速发展的城市化和工业化。


    从另一个角度来说，城市确实更具吸引力。随着交通网络的发展，工业城市的经济得以更加稳定地发展。过去，一个村庄的发展受到当地气候和农作物产量的影响，如果遭遇干旱，人们只能祈祷他们的粮食储备能维持到下一个收获季节；如今，城市里有了快速高效的交通网络，人们可以很容易地将一个地区过剩的粮食运到另一个粮食短缺的地区。


    工业社会的到来也导致工厂对劳动力的需求增加。城市里的工厂不断发展壮大，吸引了渴望提高自己的社会地位的农村人。爱尔兰人约翰·奥尼尔 (John O’Neill)
    就是一个典型的例子，他还记录了自己的生活。1808年，奥尼尔离开科克，去伦敦找工作。刚到伦敦，他就在一家爱尔兰工厂找到了一份工作。赚到了足够的钱之后，他并没有回到科克，而是把妻子和孩子接到了伦敦，永久地定居在这里。对许多像奥尼尔这样的“农村移民”来说，最初去城里找工作只是一个阶段性的计划，后来变成了长期性的的，最终，他们成了城市里的永久居民。


    此外，城市里还充斥着奢侈商品。农民们注意到农业产量的增长快于人口的增长，于是开始考虑将更多的农产品销往城市。随着生产力的提高，农作物的种类也越来越多，除了生活必需的农产品，农民们还开始大面积种植糖料作物、烟草和棉花。这些作物几乎没有营养价值，但可以卖到城里，获得可观的利润。就这样，城市里充斥着高利润的商品，吸引了越来越多的人。


    这就不难理解为什么当时一大批人从农村迁居大城市，以寻求就业机会和更好的生活质量。英国就是一个典型的例子，其居住在城市的人口所占的比例从19世纪初的17%上升到19世纪末的72%。


    虽然这些变化最初是欧洲城市的特点，但发展中国家很快就开始效仿。受殖民扩张的影响，城市应为现代化枢纽和工业化中心这一理念在其他国家传播开来，一些国家开始践行这个理念。


    从16世纪开始，许多发展中国家的城市状况发生了变化：在拉丁美洲，旧的建筑被摧毁，西班牙人和葡萄牙人建造了新的建筑；在非洲，法国人和'
  merge: -1
  img_proc: true
- pgno: 59
  md: '英国人建立了约翰内斯堡、开普敦和内罗毕等定居点；印度的加尔各答、孟买和马德拉斯也发生了类似的变化；在北非和中东部分地区, 虽然本土文化占据主导地位,
    但也受到西方的影响, 开始了城市化进程。在全世界范围内, 我们都能看到城市是如何摆脱农业社会而崛起的。


    # 城市生活导致社会碎片化, 人们变得更加个人主义


    若想理解为什么城市化对家庭和婚姻产生了如此巨大的影响, 我们必须认识到城市生活的本质, 以及它是如何导致“社会碎片化”(social fragmentation)的。随着越来越多的人涌向大都市,
    城市生活有了自己的特点, 并影响了整个社会。集体主义和社会控制在城市中比在村庄中更弱一些, 因此社交网络在城市环境中更难形成。城市生活变得更加个人主义, 与群体身份相比,
    个体身份的构建变得更为重要。


    社会碎片化的过程可以从城市生活的三个主要方面来解释。第一个方面是社会不平等。随着社会财富的积累, 阶层分化显现, 社会阶层逐渐形成。在工业社会, 社会阶层分化严重,
    有些人获得了财富, 有些人却在贫困线上挣扎。历史学家劳伦斯·斯通 (Lawrence Stone) 将当时的经济阶层比喻为“一座大山, 山上有一座又高又细的塔,
    大山由贫穷的农民、工匠和劳工组成, 细塔则由王室、大地主贵族和富有的商人组成”。尽管有些人认为在那段时期中产阶级的占比实际上扩大了, 但大多数人的观点是当时的阶层分化加剧,
    穷人变得更穷了。


    企业成为一种新型的财产, 它们的所有者大都是工业社会中的上层阶级, 其中包括船东、工厂主和积累了大量财富的商人。中产阶级中的一些商人、律师和医生也享受着工业化带来的红利。这些“资本家”或“资产阶级”中的许多人会去音乐厅、剧院和体育场馆度过闲暇时光。当穷人被迫留在拥挤的城市工作、挣扎求生时,
    富人却可以居住在远离肮脏和疾病的地方, 同时享受先进的技术和城市文明, 并利用城市的力量巩固自己的阶级地位。18世纪的爱尔兰、法国经济学家理查德·坎蒂隆 (Richard
    Cantillon ) 这样描述地主: “居住在乡村豪宅的地主会经常进城, 他们还会把孩子送去城里接受城市文明的熏陶。”


    大多数城市居民都属于工人阶级, 他们被迫住在卫生条件差、拥挤不堪的地方, 在工厂也被压榨。在糟糕的饮食、过度拥挤的居住环境、卫生设施不足, 以及中世纪有限的医疗解决方案等因素的影响下,
    公众的健康'
