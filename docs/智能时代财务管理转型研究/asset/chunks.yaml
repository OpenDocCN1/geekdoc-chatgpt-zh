    ##### 2.智能增强


    首先，智能化对财务的影响是全面的。因此，财务的管理模式、流程体系、系统支持方式都会发生一定的改变。作为财务管理的支持保障，财务制度体系也必然受到影响。在制度体系层面，应当结合智能化对财务系统、流程带来的影响进行必要的完善和调整。


    其次，内部控制方式会因智能化发生改变。智能技术能够加强内部控制能力，可以在内部控制体系中引入更多的智能化工具，更重要的是因为智能化的到来，内部控制环境会发生重大改变，更多的财务管理工作将基于大数据、人工智能的模式，对这些看不见的流程或财务管理工作如何实施内部控制，将成为新的课题。


    而对于内部审计与稽核来说，智能化的影响最直接。在智能时代，人工智能将取代大量的财务操作人力，依靠算法的机器处理将取代依靠人的行为的业务处理，审计的范畴将从传统的审计向算法审计和IT审计转变。而在审计和稽核的手段上，基于大数据的远程稽核将成为主流模式。同时，企业依靠大数据监控，能够更早地发现风险线索，由传统审计与事后追责向事前预防转变。


