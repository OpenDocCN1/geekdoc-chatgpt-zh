  trans: '

    原本受到毕业生热捧的国有企业和外资企业都面临着各自不同的问题，国有企业的光环在慢慢消退，国企“高薪、稳定”的形象在当前的环境下难以维持；而外资企业在国内人力成本上升的压力下，有很多也在慢慢撤离到成本远低于中国的印度、马来西亚、越南等国家。


    在如此严峻的环境下，高校之间的竞争很多时候都成为就业水平的竞争，而就业的核心在于学生的素质和能力与企业用人需求之间的匹配程度。在未来，能够在智能时代培养出满足企业用人需求的高校，必然是在智能化浪潮前敢于“疯狂”一次的那些学校。


    ## 三、如何构建智能风口飞起来的能力


    面对不足，如果大学财会教育的管理者能够意识到这个问题，那么现在仍然有机会去构建智能时代的教育能力。智能化的风已经刮起，但并不是谁都能飞得起来，要抓住这一机遇，必须用心去构建自身的能力。


    ### （一）站在企业的角度来说，需要高校输出怎样的学生


    有些企业会每年设定一些名额，从名校中优选学生作为管理培训生。这些企业对学生综合能力的要求很高，如果企业本身处于智能化行业的发展受益通道中，则会侧重于学生对智能技术理念的关注和准备情况。而有很大一批素质不错的学生会进入会计师事务所或者咨询公司。如图
    4-2 所示，根据笔者自己曾在咨询公司的用人经验，更倾向于选择那些基础素质过关、逻辑能力强、有分析能力、能够熟练运用各种技术工具且视野高度开阔的学生。因此，可以看到，对于相对高端一些的用人需求来说，与智能时代技术理念的接近程度，在很大程度上决定了其进入优质岗位的机会。


    ![img](img/txt004_2.jpg)


    图 4-2　优秀企业对毕业生的选择标准


    而非常多的学生会从标准化的基础工作中开始自身的职业生涯，如财务共享服务中心。在今天，即使是财务共享服务中心，对学生的能力也有一定的要求。财务共享服务中心更愿意选择那些对常用作业系统、作业流程有一定认识的学生，在后续的培养过程中可以更高效地达到预期效果。而那些对共享中心运营环境有着更深入的理解，而且有潜质参与到流程优化和改进过程中的学生，在未来则有机会从作业型岗位走上运营管理的相关岗位。


    ### （二）高校如何输出满足智能时代要求的优质学生


    对于高校来说，具体使用怎样的方法来输出满足智能时代要求的学生呢？笔者认为有三个方面非常关键，分别为技术的演进、广泛的合作及积极的创新突破，如图 4-3 所示。


    ![img](img/txt004_3.jpg)


    图 4-3　高校培训优质财会专业学生的方法


    #### 1.技术的演进


    我们必须认识到，智能时代的到来并不是突兀的，它的出现与之前的技术发展之间存在着不可割裂的关联关系，也就是说，存在一条技术演进的路线。对于高校来说，如果要在智能时代抓住机遇，就需要在这之前快速补课，将整个技术演进路径的能力构建起来。那么，这条技术路径是怎样的呢？


    首先，从互联网开始。在当今社会环境中，学生必须对互联网有深刻的认识，企业财务所有的工作都是在互联网下的协同环境中实现的。同时，基于互联网延伸出丰富多样的财务创新应用，如财务共享服务、业财一体化、前置业务流程中的财务成本管控（商旅管理、电商釆购）等，这些都超出了传统财会教育的范畴，而全面预算、管理会计、经营分析等也都离不开互联网环境。在互联网基础上演进形成的是移动互联网，这一模式从本质上和互联网是相似的，但也丰富了财务的业务场景。


    其次是大数据和云计算。在大数据和云计算下，传统的财务分析工作会受到影响和改变，而财务的作业平台也会涉及越来越多的云计算模式，如 Oracle 和 SAP 在全球范围内大力推行的云计算服务。在这个阶段，需要高校帮助学生提升自身的认知能力，使学生能够基于这些技术对财务的影响形成自己的观点和认识。而依托大数据和云计算的产品应用，也是需要关注的。


    最后是人工智能技术的出现。人工智能是大数据和云计算发展到一定阶段后，才能够在企业实践中有效运营的技术。在这个阶段，高校需要培养学生的算法能力，虽然是财会类学生，但未来优质的工作岗位一定属于那些能够结合财会知识和算法能力的复合型人才。


    如图 4-4 所示，上面提到的技术演进路径要求高校无论是在师资储备、研究能力和学习，还是在实验环境的储备上都要形成链条式的能力，帮助学生在大学学习期间完成对整个技术演进的认知。


    ![img](img/txt004_4.jpg)


    图 4-4　技术演进路径


    #### 2.广泛的合作


    我们还要客观地认识到，要想在短时间内构建起完善的教学能力并不是容易的事情，如果仅仅依靠自身的培养和建设，则很有可能在能力尚未建立时便错过了重要的机会。那么，如何快速构建能力呢？广泛的合作是最佳的选择。在这里，我们谈四种合作模式。


    第一种合作模式是高校内部合作。当然，一谈到内部合作，大家都会抱怨合作并不容易。在内部合作方面，特别建议综合性大学和理工科大学进行一定的尝试。在这一类院校中，信息技术类学科的积累较深，与企业财务部门在进行自身变革时寻求公司内部科技部门的帮助是同样的道理，高校的财会专业借力信息技术类专业，能够快速弥补自身的短板和不足。当然，对于一些纯财经类院校，可能在这一方面就会有些难度。


    第二种合作模式是和企业合作。近几年，也有一些高校和笔者探讨过这个问题，他们希望能够通过与企业合作，为学生创造更多的实践环境，如联合建立实验室、成立实习基地等。这种模式应用比较多的主要是在财务作业运营领域，由于企业存在用工需求，希望以此来降低自身的运营成本，而高校希望给学生找到实习实践的机会，这就使双方的合作有了基础。


    第三种合作模式是与软件厂商进行合作。实际上，这种合作模式是比较常见的，但是存在合作对象不足的问题，国内院校大多与金蝶和用友公司开展合作。但是在企业实践中，对财务信息化产品的应用远不止这些，大型企业集团涉及的财务信息系统可能有数十个。在这种情况下，高校应当考虑与更广泛的软件厂商展开合作，建立丰富多样的联合实验室。对于软件厂商来说，与高校的合作在其产品的研发、测试上都会有所帮助，不妨找到双赢的合作点。


    第四种合作模式是与各种财会公会、协会合作。与这一类组织的合作并不只有考试认证，站在高校一方，应当考虑如何借助这些机构的力量来帮助学生打开视野。这些机构通常都有非常丰富的企业专家资源，借助这些机构引进专家走入大学是很好的教育创新形式。


    #### 3.积极的创新突破


    高校财会教育要想破茧而出，必须苦练内功，进行积极的创新突破，从思想上提升对智能时代的认识。实际上，财会人员无论是在高校教师的群体还是企业内部，都很容易被打上保守、不善创新之类的标签。


    如果要求高校的财会教育者能够达到智能时代的人才培养要求，就需要进行必要的自我突破，而不能继续依赖传统的知识体系。庆幸的是，近年在和高校的接触中，笔者看到了一些有想法的学者在积极突破自身的桎梏，能够做到空杯心态，走到面向企业管理人员的社会化培训的课堂中，去提升自身能力，并获得创新的思想。


    高校的教育者要在以下几个方面实现突破。


    第一，学习能力的突破。高校的教育者要能够做到快速学习和终身学习。如果一个教书育人者自身的学习能力不提升，则很难帮助学生跟上时代的步伐。不妨借鉴企业管理人员的学习方法，积极参加社会化培训，借助互联网进行碎片化学习。


    第二，创新能力的突破。教育本身就是一个产品，对于高校教师来说，要有产品经理的精神，关注用户的需求。不妨借鉴一些产品经理的工作模式，把创新当作一门学问深入钻研，设法将财会教育这个产品打造出不一样的新模式。


    第三，教授能力的突破。好的教育是能够用通俗易懂的方式帮助学生成长。好的大学教师不应当再把考试、考证作为教学追求，而需要提升自身的教学能力，将学生当成社会人来对待，试着用培养企业员工的标准来培养学生，跨越高校与企业之间人才衔接的断点。


    智能时代的财会教育，是未来整个财会行业发展的基石。站在企业的立场，我们期待高校能够培养出越来越多高素质、有创新能力、视野开阔的财务后备人才。


    ## 第二节　财务共享服务课程体系开发与建设


    财务共享中心所需人才呈现规模大、专业性强等特点，导致其已经成为各企业发展财务共享中心的一大障碍。财务共享的发展推动了人才转型，因此对于财务共享中心的人才培养、支持方面的探索显得尤为重要。


    ### 一、校企合作联合培养


    虽然中国高校培养了大批会计人员，但很难满足社会对专业型和管理型多层次会计人才的大量需求。


    人才培养策略的实施主要集中于基层适用型人才，是构建行业人才结构基础的主要方式。因此，对于共享中心、财务服务外包等智力密集型服务业来说，培养人才更是至关重要。新型产业需要新型人才，新型人才培养需要创新性的理念和方式。地方政府可以采用给园区企业培训补贴等措施来支持企业的员工培训，也可以通过与企业或者第三方机构合作来培训人才。


    一些网站如中华品牌管理网，提供了相关的财务共享人才培养课程。提供的课程包括“如何建立财务共享中心”“企业财务共享服务”“财务共享中心的建立和运营管理”“未来财务模式”“标杆企业财务共享服务案例”“财务创新管理”“人单合一双赢”“与财务共享服务”“HR
    共享服务中心的建立”“管理与优化”“移动+互联+大数据时代企业集团财务共享服务运营实战技能”“财务共享管理模式”“财务共享中心优化与完善”“非财务经理的财务”。除了理论课程之外，该网站上还提供了一些案例分析课程，如“海尔财务管理时间课程”“全球
    500 强财务管理最佳实践”等。


    类似这样的社会培训网站和课程在其他网站也有出现，但数量不多且价格昂贵。因此，建议各大学习网站可以全面普及一些价格较为合适的网络课程，让那些工资不高、从事基础财务工作的财务人员也有机会了解关于共享中心建设的知识。


    此外，除了在网上开设课程，财务共享服务建设的相关内容也可以加入各大高校会计教育的课程体系中，采取企业与高校相互合作的模式；也可以设立专门的财务共享方向的会计专业，请一些在财务共享领域资深的专家合作授课。


    ### 二、财务教育培养的课程体系


    无论是社会培训还是高校专业培训，建议财务共享课程规划从课程标准开发和课程教学体系开发两个方面进行探讨。


    #### （一）课程标准开发


    根据《会计行业中长期人才发展规划（2010～2020 年）》中对财会人才的要求及在“互联网+”时代背景下的财务人员转型趋势，财务人员的职能发生了变化，工作重心由核算向管理—业务财务—财务管理决策转变，同时财务工作职能面临着像工业
    4.0 一样的发展进程，出现财务领域的 4.0，这是社会经济发展的必然趋势。“财务共享服务”课程的设计开发将与时俱进，人才培养定位从核算型转向管理型，以实现工作体系到课程化的转变，职业能力标准到课程标准的转变，以就业为导向，培养学生良好的职业道德和素养，使学生具有熟练的职业技能和可持续发展的关键能力。


    课程建设团队将采用以下具体开发步骤。第一，由项目负责人牵头，构建由专业带头人、骨干教师、企业技术人员组成的课程建设团队，共同分析职业岗位（岗位群）能力，设计调研方案，面向会计岗位从业人员进行典型岗位调研和调查统计分析，形成调研报告。第二，根据岗位的任务、项目、能力、知识进行分析综合，形成职业岗位（岗位群）能力分析表，项目成员分解各岗位（岗位群）所需的能力、素质、知识的关联性，撰写课程标准初稿。第三，召开由课程研发专家、企业财务主管、CPA
    及项目团队成员参与的现场项目研讨会议或者评审会，审议通过课程标准。


    从高校会计专业课程的具体设置而言，高校是培养管理人才的重要阵地，在新时期大力推广管理会计、推进财务共享服务，需要进一步优化学校的管理会计人才培养方式。面对商业发展和我国高校管理会计教育的现状，对高校管理会计人才培养提出以下构想。


    从宏观角度来看，高校会计专业应按照“厚基础、宽口径、强能力、高素质”的原则进行设置。


    首先，重点高校的会计专业应适当缩减原有的大量的会计基础类核算课程，因为这些工作会在财务共享服务的趋势下逐渐被学历相对较低的人员承担。


    其次，要正确认识和理解管理会计与财务会计的融合，因为管理会计起步于财务会计。在强调学生数学能力、统计能力和计算机能力的基础上，专业课应尽量涉及企业管理的各个方面。


    最后，认清管理类会计人才知识的宽广性，高校需要拓宽专业，整体优化。在时间安排上，前两年的主要课程及实践环节都可以与同一领域的其他专业有共同的专业基础课，按管理学科宽口径培养，以打好专业基础；同时根据人才培养的方向不同设置一定数量的选修课程，后两年则分专业方向培养。


    #### （二）具体课程设置


    培养管理类会计人才，需要开设多元化的课程，不能仅仅围绕管理会计本身的内容开课。我国高校新型会计专业合理的专业课程体系应分为以下三类。


    第一类是专业基础课。主要有经济学原理、会计学原理、管理学原理、金融学、经济法、统计学、市场营销、高等数学、线性代数、概率论与数理统计。这些旨在让学生掌握本学科的基础理论、知识和技能。


    第二类是专业核心课。一是专业必修课：中高级财务会计、财务报告分析、企业战略管理、财务管理、成本管理学、投资学、审计学、税法；二是专业选修课：管理信息系统、专业英语、资产评估、商业银行经营管理、金融工程学、税务筹划。这些是集中体现本专业特点的核心课程。


    第三类是跨学科课。主要包括证券投资理论与实务、计算机会计、国际金融、会计制度设计、租赁会计、环境会计专题、人力资源会计专题等，这些课程旨在扩展学生知识面。


    同时，应注重中国经济和企业发展中出现的新财务问题，应结合学生的培养需要，体现在会计教材及具体教学过程中。例如，财务共享服务案例分析；中国集团企业财务问题，如集团企业的财务体制、资本经营、集团企业母公司对子公司的财务激励与控制等；中国中小企业财务问题，如中小企业的融资环境、财务特征、改制及出售等；中国上市公司财务问题，如上市公司融资机制与融资结构、投资机制与投资行为等。


    #### （三）理论和实践相融合的课程教学内容和结构体系设计及建设


    “财务共享服务”课程体系主要构建思路为“理实一体化”课程体系，涵盖理论及案例研究、财务共享中心建设沙盘模拟、财务共享服务软件实际操作、财务共享体验中心仿真模拟四块内容。这四块内容既相互联系构成一门完整的课程，又能独自开课单独教学。


    #### （四）财务共享服务理论与案例学习


    这部分的学习主要帮助学生建立对财务共享服务理论的认知，掌握应用分析的理论框架。


    具体授课内容包括：财务共享服务发展应用现状；企业为什么要建设财务共享中心；什么样的企业适合建设财务共享中心；不同类型企业的财务共享中心有什么特点；如何建设财务共享中心；财务共享中心建设需要重点考虑的要素；财务共享中心的建设路径和实施方法；财务共享中心的运营管理；企业共享中心建设案例分析等。


    #### （五）财务共享中心建设沙盘模拟


    财务共享沙盘模拟实验部分是课程中极具特色的部分，该模拟实验教学的目的是帮助学生更好地理解并应用财务共享服务理论，通过分工分组、角色扮演、沙盘推演等实际场景教学，应用所学理论知识来共同讨论，设计给定案例背景环境下的财务共享中心的规划和建设方案。沙盘模拟实验能充分调动学生的学习积极性和主动性，除了有助于培养学生的主动思考分析能力，更能培养学生的团队意识及沟通交流能力。


    #### （六）财务共享服务专用教学软件


    浪潮研发了财务共享服务软件教学版，重点学习财务共享服务的功能，并依据给定的部分数据实际操作。通过查看与分析财务共享软件展现的数据，一方面可以掌握财务共享中心的主要功能与作用，另一方面可以提升财务管理的水平，全面掌握财务共享中心运营的信息支撑系统。


    #### （七）财务共享体验中心仿真模拟


    高校可以按照企业共享中心的建设实际搭建仿真模拟环境，根据既定的角色设置及脚本设计，使学生分岗位在较真实的办公环境去体验财务共享中心的业务运作，真正了解实际的财务共享中心，从而培养学生处理企业实务的能力，以及更加鲜活地掌握财务共享中心的管理流程、工作形式及内容、特殊工作设备等。


    高校还应加强实践教学，培养创新能力。设置财务管理大专业、专业实习、学年论文、会计模拟实验等，将课题性实验、综合性课程设计和学生参与科学研究实践在教学计划中予以落实。针对目前有相当一部分实践教学流于形式的问题，需要三方面的共同努力：一是要努力提高学校和学生的认识；二是要努力提高工作单位的社会责任；三是加强财政部门的支持，利用其影响力促进学校与单位建立人才实践培训基地，为学生提供实习平台。


    实训课程设置的具体内容包括财务共享沙盘模拟实验课程和财务共享软件教学两个方面。


    ##### 1.财务共享沙盘模拟


    浪潮财务共享中心建设沙盘是国内首款具有独立知识产权的财务共享沙盘产品，该沙盘产品包括沙盘盘面、沙盘工具箱、沙盘模拟配套教程等。


    从目前大多数已经完成或正在建设财务共享中心的企业来看，建设过程中所考虑的主要因素包括：建设模式、实施策略、组织、人员、办公选址、业务范围、信息系统、运营管理等。这些要素在财务共享沙盘中均有所包含，并在盘面三个区域内进行展现。沙盘盘面构成主要包括：战略与政策规划中心、共享业务规划中心和运营与技术规划中心。战略与政策规划中心划分为建设目标、建设结构、职能定位、建设策略、建设原则、建设结构示意图等子区域。共享业务规划中心划分为四个业务区域，可针对企业财务共享中心建设中最常见的费用报销业务、薪资发放业务、应收业务、应付业务进行共享后的业务流程及管理制度梳理。每个业务区域均包括业务场景和制度内容，其中业务场景包括业务流转对应的具体岗位、业务操作内容和实物单据。运营与技术规划中心划分为基础环境及设备、信息系统、运营管理制度三个子区域。


    财务共享沙盘模拟实验课程是借助沙盘教具，展现出企业建设财务共享中心的主要流程，是将财务共享中心建设时考虑的主要因素、业务流程梳理、运营管理等相关内容制作成实物模型，按照一定的操作规则，模拟企业建设财务共享中心的过程。实验课程中，每组学员组成企业财务共享中心筹建小组，分别扮演集团财务部部长、业务专家、信息化专家等岗位角色，使学生身临其境，真实体验财务共享中心的筹建及运营的主要流程。


    财务共享沙盘模拟实验具有体验性和综合性的特征，可以充分调动学员学习的参与性和主动性，期望通过课程可以达到六个目标：第一，帮助学员更好地理解并应用财务共享理论；第二，教导学员分析建设财务共享中心的关键影响要素；第三，让学员学会分析建设财务共享中心的关键影响因素；第四，让学员掌握建设财务共享的框架和要素；第五，掌握建设财务共享中心的路径和方法；第六，学会制定财务共享中心的建设规划。


    教学准备：财务共享沙盘模拟实验课程主要以沙盘教具为载体，一般包括沙盘盘面和沙盘工具。同时配合沙盘模拟企业背景、业务流程现状等内容，完成财务共享中心建设的沙盘模拟任务。沙盘模拟需要较大的桌子用于摆放沙盘盘面及沙盘工具，便于学员进行集中讨论制定方案和完成相关资料的填写。


    教学计划：考虑到各院校或者各个培训机构的专业教学大纲和课程设置方面的差异，本实验课程主要分为两种不同的情形：情形一，配合财务共享理论课程开设的沙盘模拟实验课程，不需要对理论知识进行单独授课；情形二，单设财务共享沙盘模拟课程，可在实验过程中，抽取部分学时进行理论讲解。

