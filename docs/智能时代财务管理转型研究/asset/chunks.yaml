    # 第三章　智能时代财会人员转型


    ## 第一节　智能时代财务人员面临的问题


    人工智能的发展离不开技术的进步，历史上每一次技术进步，都会引发相关行业的大规模失业。19 世纪前叶，随着机械织布机在英国的广泛使用，众多有技术的纺织业者一夜之间沦落街头，加入失业大军。1900
    年，随着拖拉机、联合收割机和作物种植机的出现和使用，近一半在田地间劳作的成年人一下子变得无所事事。1945 年，自动化技术的进步使超过 1.5 万名曼哈顿电梯操作工人和维修工人成为无业者。在人工智能技术的冲击下，财会人员的劳动力市场将会发生颠覆性变革。人工智能技术掀起了世界范围内的又一轮产业变革[\[1\]](#txt003.xhtml#footnote_content_txt003_1)。人工智能背景下，财会人员的工作方式和核算方式都会发生很大的变化，财会人员面临的问题包含以下内容。


    ### 一、财务基础岗位急剧减少，高级岗位人才短缺


    第一，大量的财务基础核算工作被财务人工智能机器人替代，但是市场中财务岗位数量变化不大，因此会给财会人员带来严重的冲击，从事基础核算的财会人员面临被人工智能机器人取代的风险。在人工智能技术到来和逐渐普及之际，企业内部从事基础性会计核算、凭证整理、账簿装订、报表处理及纳税申报、纳税调整的会计人员将会逐步被人工智能机器人取代[\[2\]](#txt003.xhtml#footnote_content_txt003_2)。这部分人的就业前景将会逐步低迷，财会人员的收入和社会地位也会或多或少受到影响。这种现象最具代表性的当属全球零售业的霸主—沃尔玛，2016
    年随着财务机器人的投入使用，沃尔玛裁减财会人员 7000 余人，裁员之后基础核算财会人员减少 80％，财会人员的工作岗位数量迅速减少。[\[3\]](#txt003.xhtml#footnote_content_txt003_3)


    第二，企业内设会计机构和财务会计岗位逐步被合并和裁减。在人工智能背景下，随着大量基础性工作被机器人所取代，企业的财务会计岗位也将进一步得到精简，一些工作内容较为相近的岗位会逐步合并，一些工作内容和工作量都大幅减少的会计岗位将会与其他必须继续存续的会计岗位进行合并设立，合并以后企业所设立的会计机构和岗位都会有所减少。对于总分公司而言，分公司可以不再单设财务部门，或者对财务会计岗位进行精简，总账会计、费用会计、资金会计、成本会计、收入会计、供应链会计等会计岗位都会被适当裁减，只保留个别基础工作岗位和管理会计岗位、财务总监岗位、会计机构负责人岗位。对于母子公司而言，保留财务部门，但是内设岗位可以根据业务需求大幅缩减，对于不相容和职位分离的岗位统一由人工加智能的方式合理设置会计岗位，高速开展会计核算业务。这一方面使市场上的会计岗位总数逐步减少，另一方面使企业集团内部自设的会计岗位逐步减少。基础会计岗位数量减少将会在未来
    2～10 年内最为明显[\[4\]](#txt003.xhtml#footnote_content_txt003_4)。未来，连锁经营机构各分店的记账和会计部门统一整合至总公司的会计智能系统，数据智能化与集中化处理逐渐取代人工。


    第三，高水平专业财务管理人才紧缺。人工智能背景下，基础核算财会人员面临着被淘汰的危机，这些岗位和相应的工作交由机器人来完成将会更加规范和高效，同时完成的工作量也会更大。这使财会人员的日常工作量减少，工作压力得到缓解，财会人员可以有更多的时间和精力从事与战略管理和管理会计相关工作，为企业快速发展贡献智慧和力量。这就需要更多高水平的掌握更多专业化财务管理知识的会计人员，在企业单位从事高级财务管理工作[\[5\]](#txt003.xhtml#footnote_content_txt003_5)。当更多的基础性财务会计工作、审计工作被人工智能财务机器人取代后，企业对高水平的财务管理人员需求将更加迫切，尤其是能够掌握新的财务管理理念、财务管理技能的高精尖人才。


    第四，具有国际知识和视野的财会人员缺口较大。当前我国一些大中型企业、科技型中小企业、文化创新企业开始走出国门，与全球大多数国家和地区有业务往来，这就需要这些企业外派的财会人员和企业财务总监、会计主管，聘请的财务顾问等工作人员具有开阔的国际视野，了解和掌握派驻机构和海外分公司所在地的政治、经济、科技政策、法律法规、税收政策、会计准则、会计利润核算方式等知识，对海外机构和海外分公司的利润分配、投资收益划转等政策能够知晓和统筹规划，避免因不了解当地法律法规和政府部门出台的政策规定而受到经济处罚，给企业发展带来损失或错过发展良机。


    ### 二、企业对财会人员工作胜任能力的要求越来越高


    第一，当前财会人员的人际沟通能力难以满足人工智能时代财务管理需求。财会人员在常人眼里中规中矩，呆板不灵活，坐在办公室简单地记账算账，不与外界接触，不需要或很少与人打交道。部分财会人员由于过度关注财务数据，忽视了与人沟通的重要性。工作过程中不重视人际关系培养，不能积极地与人进行沟通交流，发挥工作主动性和积极性。在人工智能背景下，基础财务工作都由智能机器人替代完成，企业财会人员需要处理的事务往往是综合协调性的、系统维护性的、设置参数、风险点、防控措施录入性的其他工作，这些工作往往都需要其他部门的协作配合，这就需要财会人员具备良好的协调沟通能力。但是当前中小企业的财会人员还不具备这种沟通能力，因此制约了人工智能背景下财会人员的职业再规划与发展。


    第二，当前财会人员的专业技能难以满足人工智能时代财务管理需求。我国财会人员的从业人员数量过多，从业人员文化水平不一，对财务管理专业知识的掌握程度不尽相同，个人综合素质也参差不齐。有的财会人员具有注册会计师、注册税务师或国际公认的注册会计师资格，有的财会人员拥有中高级职称，有的财会人员仅仅只有会计从业资格证，甚至一些企业的财会人员从事会计工作多年但是至今还未取得会计从业资格证。一些财会人员接受了系统的本科、硕士会计学、财务管理相关知识教育，一些财会人员接受了大专、成人本科财会专业教育，一些财会人员系统地自学了财务会计相关知识和课程，也参加了很多培训机构的专业化辅导培训，这些从业人员往往能够很好地完成自己的本职工作。但是，还有一部分财会人员没有接受过专业的系统教育和培训，了解和掌握的财会知识零星琐碎，对财务管理、管理会计的相关内容一知半解。人工智能时代，基础会计工作不再需要一般会计人员来完成，这就需要会计人员掌握系统的财务会计知识，对会计核算、凭证、账簿、报表之间的逻辑关系，会计处理的特殊情况、财务风险的识别与防范、会计不相容岗位的设置及权力制衡都有一个正确而精准的认识，但国内大多数中小企业，尤其是一些小微企业的财会人员的专业技能显然难以满足人工智能时代财务管理需求。财会人员的财务专业技能水平低，主动学习意识淡薄。据调查统计，每日利用业余时间参加培训及学习的财会人员中，学习
    1 小时以内及不学习的财会人员占比高达 74.03％，学习 1 小时以上的财会人员占比仅 25.97％，财会人员对职业转型过程中的再培训及学习不够重视，主动学习意识淡薄。这些都与人工智能时代财会人员的工作要求和个人职业发展规划不适应。


    第三，当前财会人员所掌握的知识面较窄，难以满足人工智能时代财务管理需求。人工智能时代，财会人员不单单是处理会计业务、维护系统、指导智能机器人按照预定的流程和规范开展工作，更重要的是协调沟通其他部门积极配合智能机器人完成相关工作，并为其提供必要的财务数据等基础数据。财会人员在人工智能时代，需要综合考虑单位的基本情况、发展战略及对外投资、生产运营等一系列规划，全面管控和及时调整企业的资金使用及成本费用控制情况，进行财务风险识别、有效预防并采取有效的应对策略。要做到轻松自如地应对人工智能时代的财务工作，就需要财会人员掌握一定的企业管理、市场营销、对外投资、战略规划、品牌建设等相关知识，提高自身的综合业务素质，拓宽自身的知识面，在专业知识的广度和深度方面下功夫，以精准多元化的专业技能满足人工智能时代财务管理需求。反观当前的财会人员现状，不难看出国内有些中小企业、小微企业，以及一些民营企业的中高层财会人员，有些人都不了解企业管理的基本知识，对企业发展规划一无所知，不精通企业的对外业务开展方式，在实际工作中仅仅能够做到会计核算准确无误，对未来
    3～5 年内的资金需求不甚了解，缺少企业整体发展的全局观念，不能站在全局的角度，客观公正地看待所有的经营问题。


    第四，当前财会人员独立分析能力和风险管控意识，难以满足人工智能时代财务管理需求。在人工智能时代，财会人员需要掌握相关的业务知识，也需要具备一定的独立分析能力。伴随着财务岗位和财会人员的一再精简，需要几个人共同完成的基础性工作全部交给财务机器人，填制报表、调整会计利润并申报缴税等工作依靠财务机器人同样也可以完成。财会人员需要做的就是分析问题、查找原因，进行纠偏和优化流程，调整核算方法，统计和对比分析财务数据变化情况，并及时建议企业管理部门对企业生产运营作出战略调整，以求取得更好的发展业绩。而所有这些都离不开财会人员独立分析、解决问题的能力，也离不开财会人员的风险管控意识、风险识别和防控能力。当前，有些财会人员缺少独立分析能力和风险管控意识，只对数据进行整理统计，不了解数据背后的信息，不能通过独立分析将数据转化为对企业有用的经营决策。在人工智能时代，信息安全性备受关注，有些财会人员缺少以审计的视角透视企业风险的能力，风险管控的意识淡薄。这些都与人工智能时代的财务管理现实需要相违背，也与人工智能时代的财会人员职业规划与职业发展相悖。


    ### 三、企业对财会人员需求类型发生变化


    第一，需要财会人员具备投融资相关经验。企业在迅速发展过程中需要财会人员具备一定的投融资经验，帮助企业进行理财规划和投融资管理，以实现企业资产的保值和升值。大部分财会人员对证券金融、内部控制、经济热点等不够重视，投融资经验少。因此，具有投融资相关经验的财务人才紧缺。


    第二，需要财会人员具备创业思维。在一定程度上，财会工作和管理工作是具有一定的相似性和互通性的。一般来说，能够胜任财会工作的人会具备一定的管理能力。财会工作在企业中是不可或缺的，很多现代企业家都注重在财会方面的知识积累。但大部分财会人员过多关注数据，思维模式固定，缺少创业思维。


