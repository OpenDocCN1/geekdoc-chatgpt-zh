    2.智能增强


    智能时代的到来，对当今财务共享服务中心的组织与人员管理提出了不一样的要求。


    首先，从组织职责及架构设置来看，今天的财务共享服务中心在传统职能的基础上，必须要考虑一些用于自我变革的职能。实际上，有不少财务共享服务中心还在纠结是否要用自动化来替代人工，并顾虑因此对现有团队的利益影响。在笔者看来，与趋势逆行是不可取的，我们应当在当今的组织中一方面继续针对传统的集中化人工作业模式展开运营的提升；另一方面，应当设立创新科技组织，积极主动地展开自我颠覆。通过应用新技术，主动降低对人力的依赖，从而在这场变革中掌握主动。


    其次，对于这一变革时期的人员管理，要充分做好面对自动化带来人力释放影响的准备工作。将分散的人员集中起来是一场变革，在这个过程中，我们已经经历了一次减员的挑战。而今天，把集中在财务共享服务中心的人力再消化掉是另一场变革。这一次，我们应当在人员的职业发展上有针对性地考虑未来智能化的影响，提前做好人员的非共享技能培养，以帮助部分人员在智能化过程中逐渐分流至其他岗位，从而减少刚性人员裁减带来的剧痛。


    最后，在人员的考核上，应当更多地关注对于人员创新能力的提升。传统的财务共享服务模式过于强调效率，这使财务共享服务中心的员工并不热衷于使用新技术来改造现有的工作模式，而更倾向于一个稳定的工作环境，这对财务共享服务中心适应智能时代的发展变革要求是不利的。多一些主动的求变精神是智能时代财务共享服务的必由之路。


