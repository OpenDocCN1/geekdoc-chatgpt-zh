    ##### 2.智能增强


    供应链管理本身是一个相对成熟的管理领域。特别是在ERP系统出现后，企业的供应链管理能力得到了大幅度的提升。在智能技术方面，物联网技术将为此领域财务管理能力的提升提供潜在的机会。


    在物联网技术快速发展后，越来越多的企业使用物联网来跟踪其供应链的全过程。从原材料到在产品、产成品，直至后续产品的库存、配送物流及客户使用，物联网能够跟踪到每个环节的大量位置信息。对这些信息的获取，能够让我们即时获得清晰的物料及产品的库存、流转、物流情况。其一，供应链财务能够利用这些信息替代盘点，甚至也能为相关的会计核算提供更好的自动化支持；其二，能够利用这些信息优化库存价值管理，减少呆滞库存的出现；其三，配送物流数据信息对于优化配送物流成本也有重要的作用。


    在未来，物联网信息和财务的有机结合势必会改变供应链财务的管理模式。此外，在采购管理方面，通过将采购财务管理前置于业务处理，能够实现更好的管理效果。如采用类电商的模式在企业内部推动采购管理，能够实现整个采购过程的透明化和自助化，更好地推动业财全流程的融合。


