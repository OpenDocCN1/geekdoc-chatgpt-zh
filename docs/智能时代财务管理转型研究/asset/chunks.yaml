    图5-4　外延扩展阶段


    从组织形态上说，原先的层级性组织正出现矩阵式、网状或柔性组织的特征，不少企业要求财务团队既要专业，又要有极强的可扩展性，从而应对企业在发展过程中对人力多样化、差异化的需求。


    ## 第二节　智能时代财务管理策略


    当财务组织的发展进入到高级阶段后，需要面对更为复杂的灵活性及更为迫切的创新需求。传统的财务组织应对这一特点会面临极大的压力。即将谈到的柔性财务管理正是为此准备的，我们来看看它是什么，又将怎样影响和改变财务的现行管理模式。


    在智能时代财务管理的新逻辑思维中，笔者谈到了财务的刚与柔。传统的财务管理是一种刚性管理模式，而智能时代的财务管理需要具有更多的柔性。首先让我们来深入理解什么是管理的“刚与柔”，然后再来谈谈应该从哪些方面构建财务管理的柔性。


    ### 一、深入理解管理的“刚与柔”


    从字面上理解“刚”与“柔”并不困难。对于“刚”的概念，最具代表性的当属泰勒的科学管理理论，这套理论不少大学的管理学课程都有过介绍。泰勒的科学管理思想包括作业管理、组织管理和管理哲学三个核心内容。其中，作业管理强调的是如何通过科学的工作方法、培训方法和激励方法来提升劳动生产率。在电影《摩登时代》中，卓别林所饰演的工人在采用刚性的科学管理模式的工厂中进行流水线作业，几乎成为生产线上的一颗螺丝钉。而在组织管理中则区分计划和执行职能，提出了职能管理的概念；在管理哲学中强调科学管理带来的心理革命。随后很多管理思想的发展都延续了科学管理中至刚的风格。


    当然，传统管理的刚性并不局限在科学管理这一个领域，在现实的管理工作中到处都有刚性的影子。比如，组织中森严的管理层级、制度中可能隐藏的简单粗暴、流程中缺少变通的执行方式、信息系统中难以改变的架构等，这些都无时无刻不在影响着企业的发展。而在财务领域，这种刚性的影响同样不可小觑。


    当然，我们不能简单地去否定刚性，在过去的管理阶段中，刚性管理有其存在的自身价值。我们要做的是研究这些刚性的度是否合适，是否会过刚而折。如果到了折断的临界点，就应当适当地引入柔性，达到刚柔相济。


    那么，柔性管理又是怎样的呢？笔者的理解是，柔性管理和行为科学体系是一脉相承的。霍桑实验是行为科学体系建立的重要实验基础，在这个实验中，人们发现员工可能并不是泰勒所假设的“经济人”，而是“社会人”。这个观点的转变，彻底将泰勒把人当作机器的管理思想转向了关注人的主观能动性。


    同样，柔性管理的概念也不仅仅是关注对人的管理模式的改变，而是体现了一种敏捷、弹性、可扩展的精神，可以广泛地应用在战略管理、组织管理、绩效管理、团队和人员管理、信息系统、流程管理、运营管理等多个方面。“上善若水，水善利万物而不争”，姑且把这当作柔性管理的一种境界吧！


    安应民在《企业柔性管理——获取竞争优势的工具》中说：“从本质上来说，柔性管理是一种对‘稳定和变化’同时进行管理的新战略，它以思维方式从线性到非线性的转变为前提，强调管理跳跃和变化、速度和反应、灵敏与弹性，它注重平等和尊重、创造和直觉、主动和企业精神、远见和价值控制，它依据信息共享、虚拟整合、竞争性合作、差异性互补等实现知识由隐到显的转换，为企业创造与获取竞争优势。”[\[1\]](#txt005.xhtml#footnote_content_txt005_1)可以看到，这是对柔性管理的一种较为感性的理解。


    ### 二、智能时代财务为何且如何实现柔性管理


    当我们了解了柔性管理的概念后，不禁思考，在智能时代到来的大背景下，财务应当实现怎样的柔性管理呢？如图5-5所示，我们从多个方面来看一看柔性财务管理。


    ![img](images/txt005_5.jpg)

    图5-5　柔性财务管理


    谈到财务管理，在非常长的时期内，大家似乎都更愿意使用刚性思维来对待。一方面，财务本身在不断进行所谓严谨、管控、规则化的自我暗示；另一方面，财务人员长期以来就生活在各种条条框框里，从准则到各类监管制度，以及发票、单证，环境中充斥着刚性的氛围，可以说是一种过刚的状态。而这种状态会逐渐束缚财务人员的创造力，并且在今天商业环境已经改变、商业模式日新月异的情况下渐感难以适应。


    智能时代的到来，释放出要求财务进行自我改变的强烈信号，同时给我们创造了一个改变的机会。人工智能将帮助我们越来越多地完成原本需要“刚性”生产完成的工作，如财务审核、会计核算、资金结算等，而财务人员精力的释放将帮助我们有机会去重新构建创造能力和柔性管理的能力。


    #### （一）柔性的财务组织架构


    传统的财务组织通常是层次化的树状组织形式。如图5-6所示，通常在最顶层设有集团财务总监，下设几个专业部门，部门下再设相关科室，到了下属的业务单元或者子公司，又有业务单元或者子公司的总部财务，同样对口集团再设置相应的专业部门，再往下到了分支机构，视机构大小设置数量不等的财务相关部门，但具体岗位也是向上匹配的。这种组织配置方式就带有典型的“刚性”。


    ![img](images/txt005_6.jpg)

    图5-6　柔性的财务组织架构


    采用这种组织形式的好处是能够在条线上快速地完成指令的下达，并在某个专业领域产生高效的上下协同作用。但采用这种模式最大的弊端是横向协作困难，并会对变革和创新产生比较大的组织阻力。形象地看，这种模式也被称为“烟囱式”的财务组织架构。此外，还存在另一种刚性。尽管我们说横向协同有问题，但在任何一个层级又有其统一的负责人（CFO或者财务经理），这些横向负责人又会造成跨层级之间的协同出现问题，使原本垂直的刚性管理又遇到横向的钢板。而财务负责人对其横向业务领导紧密的汇报关系更加剧了这种横向钢板带来的阻力。


    因此，在组织体系中建立柔性，打破横纵钢板交织的牢笼，将带来更大的管理价值。那么，如何打造柔性组织呢？在笔者看来，可以针对以下几个可能性展开探讨。


    ##### 1. 尝试扁平化的组织形态


    对于财务来说，往往在一个法人主体上会产生多个管理层级，比如链条“CFO—财务各部门总经理—部门副总经理—室经理—员工”已经产生了五个管理层级。适度的扁平化可以考虑简化一些层级，从而提升组织的运转效率。每多一个管理层级，就会多一层纵向之间的钢板夹层。从提升效率的角度出发，这种去钢板的变革应当自下而上地进行，应当适度增加中高层的管理跨度。如图5-7所示，在这个例子中，虽然保留了室经理的专业级别和待遇，但员工直接受副总经理管理，从而简化了管理职责，有利于提高整个组织的管理柔性。


    ![img](images/txt005_7.jpg)

    图5-7　自下而上减少了一个层级后的组织


    ##### 2. 积极应用团队结构（Team-Based Structure）的组织


    在团队结构的组织中灵活地设置暂时性或永久性的团队，这样的组织形态可以改善横向关系，并且可以有效地解决横、纵钢板问题。团队的设置可以是横向组合，也可以是纵向组合，甚至可以是横纵共同组合的形式。在团队中可以纳入一个或多个管理者来共同解决问题。团队结构的好处是在面对重大问题的时候，可以让部门的局部利益让步于整体利益。团队往往还结合着项目来进行工作，项目化团队在柔性管理中有着重要的价值。


    ##### 3. 探索流程型的组织


    对于财务工作来说，从流程角度出发也能够带来组织的柔性创新，并借助流程的穿透能力打破组织的刚性壁垒。流程型的组织在财务共享服务中心的应用中最为常见，但笔者仍然建议扩大流程型组织的适用范围，比如将共享服务的流程向端到端进行拓展，将经营分析、预算管理、成本管理、税务管理等非共享运营类流程引入流程型组织中。


    #### （二）柔性的财务组织文化


    在财务组织的文化建设方面可以考虑引入柔性管理的思想，从而加强团队文化的包容性和灵活性。组织文化大致可以分为团队文化、偶发文化、市场文化和层级文化。


    对于传统的财务组织来说，应更多地注重层级文化的建设。这种组织文化往往对稳定性和控制性的要求显著高于对灵活性的要求。这也是与财务组织长期以来的稳健特征相吻合的。


    如上所说，我们有必要建立适当的组织文化柔性，而团队文化、偶发文化和市场文化都更具有柔性的特征，如图5-8所示。可以在财务组织中适当地增加这三种文化的比重。当然，保持必要的层级文化也是符合财务管理特点的。


    ![img](images/txt005_8.jpg)

    图5-8　适合柔性管理的三种组织文化


    ##### 1. 团队文化


    这种文化类型下的组织类似于一个家庭，团队文化鼓励家庭成员之间相互合作，通过共识和相互传递正向能量，带动组织凝聚力的提升，从而发挥出更好的组织效用。对财务来说，这种文化往往可以在一些关键时刻去建立，如在年报期间、财务系统建设期间都很容易构建起这样的团队文化。


    ##### 2. 偶发文化


    这是一种注重灵活性的冒险文化，强调的是创造力的构建，以及对外部环境变化的快速响应。它鼓励员工尝试使用新方法甚至冒险去完成工作。这种文化在部分财务领域并不适合，如会计核算、报告、税务、资金结算等，这些追求安全性的领域并不能让冒险文化成为主导。但是在一些需要突破创新的领域，如创新型财务流程和系统的建立、融资等领域还是需要具备一定的创新能力的。因此，偶发文化可以作为财务组织文化的补充。


    ##### 3. 市场文化


    这是一种鼓励内部竞争的文化，它对效益的关注超出了对员工满意度的重视，这种文化形态更像一种商业行为。对于财务领域来说，财务共享服务中心最容易形成这样的文化氛围。适度的市场文化在标准化的财务作业领域能够有效地提高员工的工作效率，这也是我们前面所谈到的另一种刚性，不宜过度，否则将在财务共享运营层面造成过于刚性的影响。反而在非财务共享领域，更需要加强对市场文化的引入，以驱动财务管理人员爆发出更强的战斗力和狼性。


    从以上分析可以看到，未来柔性的财务组织文化应当在层级文化的基础上更多地引入团队文化和市场文化，并将偶发文化作为必要的补充，形成丰富、立体的柔性财务组织文化体系。


    #### （三）柔性的财务战略管控


    柔性管理在财务领域的另一个应用是财务的战略管控。谈到战略管控，不少公司的做法是通过协商后制定战略目标，但一旦制定后就很少进行动态调整，造成了战略管控的刚性。而在预算管理上也存在类似问题，预算缺乏灵活的调整，难以适应市场环境的变化，带来资源配置的刚性。因此，柔性的财务战略管控可以从绩效目标管理和全面预算管理两个视角来提升其管理柔性。


    首先是绩效目标管理。在传统的目标管理中，财务部门主要根据公司战略进行目标设定、下达及跟踪考核。在这个过程中，目标需经过管理层、业务单位及财务的沟通协商后进行制定，但往往季度、半年甚至全年都不进行调整，同时目标的制定往往只关注于自身进步，以财务目标为中心，可以将这种模式简单地归纳为仅仅和自己比。这是一种带有刚性色彩的目标管理。


    在柔性管理思想下，对目标的制定和考核应当更多地关注其他的维度，除了和自己比以外，还需要考虑和市场比及和竞争对手比。通常，要设置具有挑战性的目标，可以考虑要求业务部门的绩效超出市场的平均水平，并且超出主要竞争对手的水平。当然，这是针对在行业中本身位于第一梯队的公司来说的，不同梯队的财务可以设定差异化的目标，但核心在于视角的打开和柔性化。另外，目标设定后不能一成不变，应当在全年中不断调整，不仅仅是固定时间节点的调整，市场中重大事件的发生、竞争格局或竞争环境的突然改变等也都应当进行即时调整。在目标管理上，应当兼顾财务目标与非财务目标，并具有更为主动的战略敏感性。


    其次是全面预算管理。传统的全面预算管理往往以年度为周期，基于年度循环来进行资源配置。部分公司将年度预算简单地除以12分配到每个月中。在资源配置的过程中，往往也并不适用于全面的预算编制动因，使预算编制结果与业务实际缺乏关联性。而在预算编制完成后，又较少展开预算调整，使预算和实际情况的偏离越来越严重。


    在柔性管理模式下，资源配置应当具备更加细化的时间颗粒和维度颗粒，充分考虑到不同时间周期内业务经营的实际特点，进行差异化资源配置，同时结合更多的业务实际，向作业预算的方向进行深化和努力。当然，柔性资源配置的背后还有成本和效率的约束。在当前相对刚性的资源配置模式下，很多公司的预算要到3月或4月才能完成，而且在编制过程中沟通成本高昂。向柔性管理的进一步迈进可能增加更多的成本。


    #### （四）柔性的财务共享运营


    传统的财务共享服务运营模式是典型的以制度为中介，对人的行为和组织的目标进行约束匹配的模式。这种运营模式更多的是一种刚性思维。对于刚性运营来说，需要有稳定、统一及可以预测的业务需求。同时，在业务加工过程中，以规模经济为基础，进行同类业务的大批量作业，强调统一性和标准化，在作业完成后要进行质量测试。财务共享服务中心的员工仅需完成单一作业，在管理中要求尽量减少工作差异，没有或者很少进行在职培训。


    可以看到，刚性运营能够享受规模效应、效率提升带来的成本优势。但在实践中，越来越多的企业管理者对财务共享服务中心的要求在不断提高，他们希望财务共享服务中心能够有更多的灵活性，能够应对更为多样和复杂的业务场景。而这本身也是财务共享服务中心的管理者所不断追求的。


    如表5-1所示，对柔性运营思维的应用，能够很好地应对日益提高的管理要求。在柔性运营模式下，需求可以具有不确定性、多样性和不可预测性。在运营过程中，柔性运营以范围经济为基础，进行大批量多样化生产，解决差异性和柔性的自动化处理。质量控制方式将从事后测试向前期过程中的质量环境建设和质量控制转变。对员工来说，需要从原来的一专一能转变为一专多能，当业务需求发生变化时，能够灵活地进行资源调配。


    表5-1　刚性运营与柔性运营的对比


    ![img](images/txt005_9.jpg)

    续 表


    ![img](images/txt005_10.jpg)


    财务共享服务中心的刚性是与生倶来的，也是不可或缺的，这是其安身立命之本。但财务共享服务中心的管理者必须意识到未来的趋势是刚柔并济的，柔性运营的思维和能力已经到了启动建设的时候。直观地说，刚性思维是一套直线式的生产线，而柔性思维模式则允许我们在这条直线上将差异件分流处理，同时允许员工在生产线上进行多流程环节处理，通过组织的柔性、技术的柔性、流程的柔性带来财务运营的多种可能。


    #### （五）柔性的财务信息系统


    对于财务管理来说，还有非常重要的一点，就是需要将财务信息系统的刚性束缚打破，构建柔性的财务信息系统。


    由于中国的信息化发展历程过于迅速，对于很多公司来说，在还没有看明白的时候，技术已经更新，管理又出现了新的要求，财务信息化的建设都是在不断打补丁的过程中完成的。这样的系统建设路径使多数公司的财务信息系统缺少规划，也根本谈不上柔性。对于这些公司来说，一个很大的问题就在于当业务需求发生改变时，现有的信息系统调整困难，甚至存在大量复杂的后台业务逻辑无人清楚，使新需求可能带来的影响无人能够清晰评估，并最终导致系统无法改动。


    因此，在这种情况下，财务信息系统的刚性具有极大的危害性。要改变这种局面事实上并不容易，需要从以下几个方面共同努力。


    首先，改变信息系统建设的观念和节奏，从打补丁的建设方式改变为先做规划和架构设计再开工建设。有些公司在系统建设的前期舍不得投入资金展开规划设计，导致产生高昂的后期返工和维护成本。在柔性管理思路下，建议在系统建设前期充分调研需求，多看市场成熟产品，必要时引入专业人士或者咨询公司来进行架构和需求设计，打好地基的投入看起来是刚性，但最终是给未来带来更多的柔性。


    其次，在财务信息系统的架构设计中应当充分考虑产品化的思路。有的公司认为业务没那么复杂，没必要搞所谓的产品化、可配置化，IT人员只要用代码把规则写出来，流程跑通就可以。但实际情况是，这些公司从一开始就给自己戴上了沉重的刚性枷锁。有不少公司实际上都是在自己也没有想到的情况下快速发展膨胀起来的，这个时候除了推倒重来，真的很难找到更好的方法。当然，对于一些初创型公司来说，如果自身没有充足的资金进行复杂的系统开发和建设，不妨考虑选择第三方产品，甚至是云计算产品，在低成本模式下保留自身的柔性。


    对于那些已经带上刚性枷锁的公司来说，这条路已经走得很远了，要想改变并不容易。找到合适的时机，对系统进行一次全面的再造是由刚入柔的可能方式。这种契机往往出现在公司经营业绩很好，能够投入充足预算的时期，如果结合技术的大发展、大进步，则更容易实现柔性管理。


    我们在上述内容中讨论了管理的“刚与柔”，并探讨了财务需要考虑引入柔性管理思想的五种场景。在智能时代，适度加强企业的柔性管理能力有益于企业的健康。而最佳的境界是做到刚柔并济，发挥刚与柔的和谐之美。


    ## 第三节　智能时代的财务团队


    正如先前在财务组织的极简进化史中所谈到的，财务组织在进化到高级阶段后，会进入外延扩展状态。在这一阶段中，财务组织演化出复杂多样的形态，这也顺应了在柔性管理思想下对财务组织柔性化的要求。下面我们谈一谈面向未来的智能化时代，财务组织的一种可能的外延扩展形态—财务智能化团队。


    ### 一、我们的方向正确吗


    智能时代对财务组织最大的影响就在于减少了对简单作业的需求，加强了对创新和复杂设计能力的依赖。当然，当我们谈到这里的时候，很容易引发道德争议。在网络舆论中，有不少人担心智能时代的机器会取代人的工作，这对社会来说是进步还是退步？


    为了回答这个问题，我们不妨看一下经济学中涉及的破窗理论，也称为“破窗谬论”。这个理论源于学者黑兹利特在一本小册子中的譬喻（也有人认为这一理论是19世纪法国经济学家巴斯夏在其著作《看得见的与看不见的》中提出的）。黑兹利特说，假如一个孩子打破了窗户，必将导致窗户的主人去更换玻璃，这样就会使安装玻璃的人和生产玻璃的人开工，从而推动社会就业。


    ![img](images/txt005_11.jpg)

    图5-9　“机器代替人”破窗理论演示


    如图5-9所示，从这个例子中能够看到，担心机器取代人工的人，实际上是支持用落后的工具来进行生产，如同让孩子持续砸窗户，从而推动社会就业。而事实上，如果避免了自然灾害、人为破坏，那么节约下来的时间、物质资源和劳动力完全可以用在生产其他更重要的东西上，这样社会生活会更加富足。维持落后的工具，担心机器取代人工，实际上是牺牲了创造潜在价值的可能。说到这里，我们对智能时代财务组织将减少简单作业、增加复杂设计的方向性判断就更加明确了。


    ### 二、构建财务智能化团队

    '
  trans: '


    如图 5-4 所示，在高级阶段，战略财务开始研究如何使用大数据来进行经营分析，有些公司在财务体系中分化出数据管理部或者数据中心。专业财务对管理会计的重视日趋加强，管理会计团队在财务组织中出现独立的趋势。业务财务就更加多元化，并且在不同的公司做法也不尽相同，有的公司基于价值链配置业务财务，有的公司则基于渠道配置业务财务。而财务共享服务中心在步入成熟期后，开始向深度服务或对外服务转型，如构建企业商旅服务中心，承接服务外包业务，提供数据支持服务等，同时基于机器作业的智能化应用也在财务共享服务中心出现。而另一项工作—财务信息化，在财务组织中也日趋重要，少数企业已经成立独立的财务信息化部门。随着智能时代的到来，财务信息化部门进一步演化出财务智能化团队，负责推动整个财务组织在智能化道路上前行。


    ![img](img/txt005_4.jpg)

    图 5-4　外延扩展阶段


    从组织形态上说，原先的层级性组织正出现矩阵式、网状或柔性组织的特征，不少企业要求财务团队既要专业，又要有极强的可扩展性，从而应对企业在发展过程中对人力多样化、差异化的需求。


    ## 第二节　智能时代财务管理策略


    当财务组织的发展进入到高级阶段后，需要面对更为复杂的灵活性及更为迫切的创新需求。传统的财务组织应对这一特点会面临极大的压力。即将谈到的柔性财务管理正是为此准备的，我们来看看它是什么，又将怎样影响和改变财务的现行管理模式。


    在智能时代财务管理的新逻辑思维中，笔者谈到了财务的刚与柔。传统的财务管理是一种刚性管理模式，而智能时代的财务管理需要具有更多的柔性。首先让我们来深入理解什么是管理的“刚与柔”，然后再来谈谈应该从哪些方面构建财务管理的柔性。


    ### 一、深入理解管理的“刚与柔”


    从字面上理解“刚”与“柔”并不困难。对于“刚”的概念，最具代表性的当属泰勒的科学管理理论，这套理论不少大学的管理学课程都有过介绍。泰勒的科学管理思想包括作业管理、组织管理和管理哲学三个核心内容。其中，作业管理强调的是如何通过科学的工作方法、培训方法和激励方法来提升劳动生产率。在电影《摩登时代》中，卓别林所饰演的工人在采用刚性的科学管理模式的工厂中进行流水线作业，几乎成为生产线上的一颗螺丝钉。而在组织管理中则区分计划和执行职能，提出了职能管理的概念；在管理哲学中强调科学管理带来的心理革命。随后很多管理思想的发展都延续了科学管理中至刚的风格。


    当然，传统管理的刚性并不局限在科学管理这一个领域，在现实的管理工作中到处都有刚性的影子。比如，组织中森严的管理层级、制度中可能隐藏的简单粗暴、流程中缺少变通的执行方式、信息系统中难以改变的架构等，这些都无时无刻不在影响着企业的发展。而在财务领域，这种刚性的影响同样不可小觑。


    当然，我们不能简单地去否定刚性，在过去的管理阶段中，刚性管理有其存在的自身价值。我们要做的是研究这些刚性的度是否合适，是否会过刚而折。如果到了折断的临界点，就应当适当地引入柔性，达到刚柔相济。


    那么，柔性管理又是怎样的呢？笔者的理解是，柔性管理和行为科学体系是一脉相承的。霍桑实验是行为科学体系建立的重要实验基础，在这个实验中，人们发现员工可能并不是泰勒所假设的“经济人”，而是“社会人”。这个观点的转变，彻底将泰勒把人当作机器的管理思想转向了关注人的主观能动性。


    同样，柔性管理的概念也不仅仅是关注对人的管理模式的改变，而是体现了一种敏捷、弹性、可扩展的精神，可以广泛地应用在战略管理、组织管理、绩效管理、团队和人员管理、信息系统、流程管理、运营管理等多个方面。“上善若水，水善利万物而不争”，姑且把这当作柔性管理的一种境界吧！


    安应民在《企业柔性管理——获取竞争优势的工具》中说：“从本质上来说，柔性管理是一种对‘稳定和变化’同时进行管理的新战略，它以思维方式从线性到非线性的转变为前提，强调管理跳跃和变化、速度和反应、灵敏与弹性，它注重平等和尊重、创造和直觉、主动和企业精神、远见和价值控制，它依据信息共享、虚拟整合、竞争性合作、差异性互补等实现知识由隐到显的转换，为企业创造与获取竞争优势。”[\[1\]](#txt005.xhtml#footnote_content_txt005_1)可以看到，这是对柔性管理的一种较为感性的理解。


    ### 二、智能时代财务为何且如何实现柔性管理


    当我们了解了柔性管理的概念后，不禁思考，在智能时代到来的大背景下，财务应当实现怎样的柔性管理呢？如图 5-5 所示，我们从多个方面来看一看柔性财务管理。


    ![img](img/txt005_5.jpg)

    图 5-5　柔性财务管理


    谈到财务管理，在非常长的时期内，大家似乎都更愿意使用刚性思维来对待。一方面，财务本身在不断进行所谓严谨、管控、规则化的自我暗示；另一方面，财务人员长期以来就生活在各种条条框框里，从准则到各类监管制度，以及发票、单证，环境中充斥着刚性的氛围，可以说是一种过刚的状态。而这种状态会逐渐束缚财务人员的创造力，并且在今天商业环境已经改变、商业模式日新月异的情况下渐感难以适应。


    智能时代的到来，释放出要求财务进行自我改变的强烈信号，同时给我们创造了一个改变的机会。人工智能将帮助我们越来越多地完成原本需要“刚性”生产完成的工作，如财务审核、会计核算、资金结算等，而财务人员精力的释放将帮助我们有机会去重新构建创造能力和柔性管理的能力。


    #### （一）柔性的财务组织架构


    传统的财务组织通常是层次化的树状组织形式。如图 5-6 所示，通常在最顶层设有集团财务总监，下设几个专业部门，部门下再设相关科室，到了下属的业务单元或者子公司，又有业务单元或者子公司的总部财务，同样对口集团再设置相应的专业部门，再往下到了分支机构，视机构大小设置数量不等的财务相关部门，但具体岗位也是向上匹配的。这种组织配置方式就带有典型的“刚性”。


    ![img](img/txt005_6.jpg)

    图 5-6　柔性的财务组织架构


    采用这种组织形式的好处是能够在条线上快速地完成指令的下达，并在某个专业领域产生高效的上下协同作用。但采用这种模式最大的弊端是横向协作困难，并会对变革和创新产生比较大的组织阻力。形象地看，这种模式也被称为“烟囱式”的财务组织架构。此外，还存在另一种刚性。尽管我们说横向协同有问题，但在任何一个层级又有其统一的负责人（CFO
    或者财务经理），这些横向负责人又会造成跨层级之间的协同出现问题，使原本垂直的刚性管理又遇到横向的钢板。而财务负责人对其横向业务领导紧密的汇报关系更加剧了这种横向钢板带来的阻力。


    因此，在组织体系中建立柔性，打破横纵钢板交织的牢笼，将带来更大的管理价值。那么，如何打造柔性组织呢？在笔者看来，可以针对以下几个可能性展开探讨。


    ##### 1. 尝试扁平化的组织形态


    对于财务来说，往往在一个法人主体上会产生多个管理层级，比如链条“CFO—财务各部门总经理—部门副总经理—室经理—员工”已经产生了五个管理层级。适度的扁平化可以考虑简化一些层级，从而提升组织的运转效率。每多一个管理层级，就会多一层纵向之间的钢板夹层。从提升效率的角度出发，这种去钢板的变革应当自下而上地进行，应当适度增加中高层的管理跨度。如图
    5-7 所示，在这个例子中，虽然保留了室经理的专业级别和待遇，但员工直接受副总经理管理，从而简化了管理职责，有利于提高整个组织的管理柔性。


    ![img](img/txt005_7.jpg)

    图 5-7　自下而上减少了一个层级后的组织


    ##### 2. 积极应用团队结构（Team-Based Structure）的组织


    在团队结构的组织中灵活地设置暂时性或永久性的团队，这样的组织形态可以改善横向关系，并且可以有效地解决横、纵钢板问题。团队的设置可以是横向组合，也可以是纵向组合，甚至可以是横纵共同组合的形式。在团队中可以纳入一个或多个管理者来共同解决问题。团队结构的好处是在面对重大问题的时候，可以让部门的局部利益让步于整体利益。团队往往还结合着项目来进行工作，项目化团队在柔性管理中有着重要的价值。


    ##### 3. 探索流程型的组织


    对于财务工作来说，从流程角度出发也能够带来组织的柔性创新，并借助流程的穿透能力打破组织的刚性壁垒。流程型的组织在财务共享服务中心的应用中最为常见，但笔者仍然建议扩大流程型组织的适用范围，比如将共享服务的流程向端到端进行拓展，将经营分析、预算管理、成本管理、税务管理等非共享运营类流程引入流程型组织中。


    #### （二）柔性的财务组织文化


    在财务组织的文化建设方面可以考虑引入柔性管理的思想，从而加强团队文化的包容性和灵活性。组织文化大致可以分为团队文化、偶发文化、市场文化和层级文化。


    对于传统的财务组织来说，应更多地注重层级文化的建设。这种组织文化往往对稳定性和控制性的要求显著高于对灵活性的要求。这也是与财务组织长期以来的稳健特征相吻合的。


    如上所说，我们有必要建立适当的组织文化柔性，而团队文化、偶发文化和市场文化都更具有柔性的特征，如图 5-8 所示。可以在财务组织中适当地增加这三种文化的比重。当然，保持必要的层级文化也是符合财务管理特点的。


    ![img](img/txt005_8.jpg)

    图 5-8　适合柔性管理的三种组织文化


    ##### 1. 团队文化


    这种文化类型下的组织类似于一个家庭，团队文化鼓励家庭成员之间相互合作，通过共识和相互传递正向能量，带动组织凝聚力的提升，从而发挥出更好的组织效用。对财务来说，这种文化往往可以在一些关键时刻去建立，如在年报期间、财务系统建设期间都很容易构建起这样的团队文化。


    ##### 2. 偶发文化


    这是一种注重灵活性的冒险文化，强调的是创造力的构建，以及对外部环境变化的快速响应。它鼓励员工尝试使用新方法甚至冒险去完成工作。这种文化在部分财务领域并不适合，如会计核算、报告、税务、资金结算等，这些追求安全性的领域并不能让冒险文化成为主导。但是在一些需要突破创新的领域，如创新型财务流程和系统的建立、融资等领域还是需要具备一定的创新能力的。因此，偶发文化可以作为财务组织文化的补充。


    ##### 3. 市场文化


    这是一种鼓励内部竞争的文化，它对效益的关注超出了对员工满意度的重视，这种文化形态更像一种商业行为。对于财务领域来说，财务共享服务中心最容易形成这样的文化氛围。适度的市场文化在标准化的财务作业领域能够有效地提高员工的工作效率，这也是我们前面所谈到的另一种刚性，不宜过度，否则将在财务共享运营层面造成过于刚性的影响。反而在非财务共享领域，更需要加强对市场文化的引入，以驱动财务管理人员爆发出更强的战斗力和狼性。


    从以上分析可以看到，未来柔性的财务组织文化应当在层级文化的基础上更多地引入团队文化和市场文化，并将偶发文化作为必要的补充，形成丰富、立体的柔性财务组织文化体系。


    #### （三）柔性的财务战略管控


    柔性管理在财务领域的另一个应用是财务的战略管控。谈到战略管控，不少公司的做法是通过协商后制定战略目标，但一旦制定后就很少进行动态调整，造成了战略管控的刚性。而在预算管理上也存在类似问题，预算缺乏灵活的调整，难以适应市场环境的变化，带来资源配置的刚性。因此，柔性的财务战略管控可以从绩效目标管理和全面预算管理两个视角来提升其管理柔性。


    首先是绩效目标管理。在传统的目标管理中，财务部门主要根据公司战略进行目标设定、下达及跟踪考核。在这个过程中，目标需经过管理层、业务单位及财务的沟通协商后进行制定，但往往季度、半年甚至全年都不进行调整，同时目标的制定往往只关注于自身进步，以财务目标为中心，可以将这种模式简单地归纳为仅仅和自己比。这是一种带有刚性色彩的目标管理。


    在柔性管理思想下，对目标的制定和考核应当更多地关注其他的维度，除了和自己比以外，还需要考虑和市场比及和竞争对手比。通常，要设置具有挑战性的目标，可以考虑要求业务部门的绩效超出市场的平均水平，并且超出主要竞争对手的水平。当然，这是针对在行业中本身位于第一梯队的公司来说的，不同梯队的财务可以设定差异化的目标，但核心在于视角的打开和柔性化。另外，目标设定后不能一成不变，应当在全年中不断调整，不仅仅是固定时间节点的调整，市场中重大事件的发生、竞争格局或竞争环境的突然改变等也都应当进行即时调整。在目标管理上，应当兼顾财务目标与非财务目标，并具有更为主动的战略敏感性。


    其次是全面预算管理。传统的全面预算管理往往以年度为周期，基于年度循环来进行资源配置。部分公司将年度预算简单地除以 12 分配到每个月中。在资源配置的过程中，往往也并不适用于全面的预算编制动因，使预算编制结果与业务实际缺乏关联性。而在预算编制完成后，又较少展开预算调整，使预算和实际情况的偏离越来越严重。


    在柔性管理模式下，资源配置应当具备更加细化的时间颗粒和维度颗粒，充分考虑到不同时间周期内业务经营的实际特点，进行差异化资源配置，同时结合更多的业务实际，向作业预算的方向进行深化和努力。当然，柔性资源配置的背后还有成本和效率的约束。在当前相对刚性的资源配置模式下，很多公司的预算要到
    3 月或 4 月才能完成，而且在编制过程中沟通成本高昂。向柔性管理的进一步迈进可能增加更多的成本。


    #### （四）柔性的财务共享运营


    传统的财务共享服务运营模式是典型的以制度为中介，对人的行为和组织的目标进行约束匹配的模式。这种运营模式更多的是一种刚性思维。对于刚性运营来说，需要有稳定、统一及可以预测的业务需求。同时，在业务加工过程中，以规模经济为基础，进行同类业务的大批量作业，强调统一性和标准化，在作业完成后要进行质量测试。财务共享服务中心的员工仅需完成单一作业，在管理中要求尽量减少工作差异，没有或者很少进行在职培训。


    可以看到，刚性运营能够享受规模效应、效率提升带来的成本优势。但在实践中，越来越多的企业管理者对财务共享服务中心的要求在不断提高，他们希望财务共享服务中心能够有更多的灵活性，能够应对更为多样和复杂的业务场景。而这本身也是财务共享服务中心的管理者所不断追求的。


    如表 5-1 所示，对柔性运营思维的应用，能够很好地应对日益提高的管理要求。在柔性运营模式下，需求可以具有不确定性、多样性和不可预测性。在运营过程中，柔性运营以范围经济为基础，进行大批量多样化生产，解决差异性和柔性的自动化处理。质量控制方式将从事后测试向前期过程中的质量环境建设和质量控制转变。对员工来说，需要从原来的一专一能转变为一专多能，当业务需求发生变化时，能够灵活地进行资源调配。


    表 5-1　刚性运营与柔性运营的对比


    ![img](img/txt005_9.jpg)

    续 表


    ![img](img/txt005_10.jpg)


    财务共享服务中心的刚性是与生倶来的，也是不可或缺的，这是其安身立命之本。但财务共享服务中心的管理者必须意识到未来的趋势是刚柔并济的，柔性运营的思维和能力已经到了启动建设的时候。直观地说，刚性思维是一套直线式的生产线，而柔性思维模式则允许我们在这条直线上将差异件分流处理，同时允许员工在生产线上进行多流程环节处理，通过组织的柔性、技术的柔性、流程的柔性带来财务运营的多种可能。


    #### （五）柔性的财务信息系统


    对于财务管理来说，还有非常重要的一点，就是需要将财务信息系统的刚性束缚打破，构建柔性的财务信息系统。


    由于中国的信息化发展历程过于迅速，对于很多公司来说，在还没有看明白的时候，技术已经更新，管理又出现了新的要求，财务信息化的建设都是在不断打补丁的过程中完成的。这样的系统建设路径使多数公司的财务信息系统缺少规划，也根本谈不上柔性。对于这些公司来说，一个很大的问题就在于当业务需求发生改变时，现有的信息系统调整困难，甚至存在大量复杂的后台业务逻辑无人清楚，使新需求可能带来的影响无人能够清晰评估，并最终导致系统无法改动。


    因此，在这种情况下，财务信息系统的刚性具有极大的危害性。要改变这种局面事实上并不容易，需要从以下几个方面共同努力。


    首先，改变信息系统建设的观念和节奏，从打补丁的建设方式改变为先做规划和架构设计再开工建设。有些公司在系统建设的前期舍不得投入资金展开规划设计，导致产生高昂的后期返工和维护成本。在柔性管理思路下，建议在系统建设前期充分调研需求，多看市场成熟产品，必要时引入专业人士或者咨询公司来进行架构和需求设计，打好地基的投入看起来是刚性，但最终是给未来带来更多的柔性。


    其次，在财务信息系统的架构设计中应当充分考虑产品化的思路。有的公司认为业务没那么复杂，没必要搞所谓的产品化、可配置化，IT 人员只要用代码把规则写出来，流程跑通就可以。但实际情况是，这些公司从一开始就给自己戴上了沉重的刚性枷锁。有不少公司实际上都是在自己也没有想到的情况下快速发展膨胀起来的，这个时候除了推倒重来，真的很难找到更好的方法。当然，对于一些初创型公司来说，如果自身没有充足的资金进行复杂的系统开发和建设，不妨考虑选择第三方产品，甚至是云计算产品，在低成本模式下保留自身的柔性。


    对于那些已经带上刚性枷锁的公司来说，这条路已经走得很远了，要想改变并不容易。找到合适的时机，对系统进行一次全面的再造是由刚入柔的可能方式。这种契机往往出现在公司经营业绩很好，能够投入充足预算的时期，如果结合技术的大发展、大进步，则更容易实现柔性管理。


    我们在上述内容中讨论了管理的“刚与柔”，并探讨了财务需要考虑引入柔性管理思想的五种场景。在智能时代，适度加强企业的柔性管理能力有益于企业的健康。而最佳的境界是做到刚柔并济，发挥刚与柔的和谐之美。


    ## 第三节　智能时代的财务团队


    正如先前在财务组织的极简进化史中所谈到的，财务组织在进化到高级阶段后，会进入外延扩展状态。在这一阶段中，财务组织演化出复杂多样的形态，这也顺应了在柔性管理思想下对财务组织柔性化的要求。下面我们谈一谈面向未来的智能化时代，财务组织的一种可能的外延扩展形态—财务智能化团队。


    ### 一、我们的方向正确吗


    智能时代对财务组织最大的影响就在于减少了对简单作业的需求，加强了对创新和复杂设计能力的依赖。当然，当我们谈到这里的时候，很容易引发道德争议。在网络舆论中，有不少人担心智能时代的机器会取代人的工作，这对社会来说是进步还是退步？


    为了回答这个问题，我们不妨看一下经济学中涉及的破窗理论，也称为“破窗谬论”。这个理论源于学者黑兹利特在一本小册子中的譬喻（也有人认为这一理论是 19 世纪法国经济学家巴斯夏在其著作《看得见的与看不见的》中提出的）。黑兹利特说，假如一个孩子打破了窗户，必将导致窗户的主人去更换玻璃，这样就会使安装玻璃的人和生产玻璃的人开工，从而推动社会就业。


    ![img](img/txt005_11.jpg)

    图 5-9　“机器代替人”破窗理论演示


    如图 5-9 所示，从这个例子中能够看到，担心机器取代人工的人，实际上是支持用落后的工具来进行生产，如同让孩子持续砸窗户，从而推动社会就业。而事实上，如果避免了自然灾害、人为破坏，那么节约下来的时间、物质资源和劳动力完全可以用在生产其他更重要的东西上，这样社会生活会更加富足。维持落后的工具，担心机器取代人工，实际上是牺牲了创造潜在价值的可能。说到这里，我们对智能时代财务组织将减少简单作业、增加复杂设计的方向性判断就更加明确了。


    ### 二、构建财务智能化团队


