- raw: '智能化阶段的会计引擎会在独立产品化的基础上建立跨行业的统一会计引擎模式。会计引擎可以引入机器学习技术，通过学习基于规则转换的历史数据积累，逐渐形成新的转换规则体系。有了这样的技术基础，会计引擎能够随着数据积累的不断扩充，在学习过程中持续提升业务到财务的语言转换能力，并最终实现新业务接入免配置。这就如同我们通过海量案例培养了业务专家，这些业务专家能够自主解决复杂的业财信息转换问题。


    2.区块链与业财融合


    如果说会计引擎解决了业务信息向财务信息翻译的问题，那么区块链技术的出现则在推动业财一致性方面带来了新的思路。


    本书不再用过多的篇幅阐述区块链技术本身。需要明确的是，区块链是一种分布式账簿。传统的财务记账的模式是只有一个集中的账簿，所有的账务信息都进行集中记载。业务系统中的交易记录可以理解为一本业务账，财务系统中的会计凭证则是财务账。二者是转换关系，所以在一致性上就容易出现问题。


    而对于区块链来说，它能够在业务与财务之间构建一个平行账簿。任何一笔业务发生的时候，都同时在双方的账簿中记录一笔交易。而由于业务方在企业集团内部会有多个组织或法人的形态存在，也会在关联方或者内部往来方之间形成多个平行账簿。


    基于区块链技术在企业底层搭建了这样一套平行账簿体系后，由于任何一笔交易都是在多账簿中同时记账的，这就解决了数据一致性问题。在实现了数据一致性后，业务系统与财务系统之间不需要再进行数据一致性核对，内部往来和关联交易的核对问题也能够使用类似的方式来解决。


    （四）财务机器人、智能化与共享服务的补充


    前面我们深度探讨过财务共享服务与智能化的关系，可以看到智能化阶段的到来能够极大地提升财务共享服务的效率，OCR、规则引擎、众包、人工智能等技术的综合使用，能够带来财务共享服务从传统模式向智能共享的跃迁。


    在这里，我们对财务共享服务领域当下比较流行的财务机器人的概念进行说明。实际上，财务机器人从严格意义上来说并不能称为智能化，而更类似于脚本自动化的概念。机器流程自动化（RPA）与智能化业务流程自动化（IPA）应用的最大区别在于，RPA应用的实现基础依然是传统的流程规则的明确，而IPA应用的实现基础将会是机器的自我学习、自我认知能力。在智能化阶段，如果要迈入彻底的无人共享模式，需要将多种技术进行组合使用，而财务机器人就是其中的重要一环。


    那么，什么是RPA呢？这项技术实际上是通过模拟人工作业的方式，将一些无法通过系统集成的系统手工：操作进行自动化的处理。以最常见的应付流程为例：维护供应商数据—提交釆购请求/采购订单—收货确认—收到供应商发票—三单匹配—调整差异—建立付款日期—准备付款—批准付款—付款执行—记账……在这个流程场景中，绝大多数业务环节都可以采用RPA来协助完成，如RPA可以协助企业进行供应商信息更新、创建采购申请、查询物流信息、更新采购计划、收货确认提醒、三单匹配核对、核对价格、检查付款差异、信用检查、银行对账等，通过这些环节的自动化应用，会在很大程度上提高应付流程的执行效率和质量[\[8\]](#txt001.xhtml#footnote_content_txt001_8)。


    RPA更类似于Office系统中的宏工具，只是功能上比宏工具强大了很多。RAP的优势有如下几个方面。


    首先，RPA并不是孤立的应用程序，而是具有服务端和能实现统一调度管理的工具。在这一功能的支撑下，RPA能够实现对多流程自动化任务的统一管理，也就是说，能够清晰地监控这些自动化任务发生的过程和执行结果。


    其次，RPA技术最大的优势在于能够实现跨系统平台的作业。这与宏工具不同，如果自动化任务只能在如Office这样的封闭系统中运行，那么要实现全流程的自动化就非常困难了。RAP能够跨越系统平台进行作业，这与人工作业的情况极为相似。甚至，对于使用虚拟系统的机器，RPA也能够支持本机和虚拟机之间的自动化交互作业，进一步扩大了应用场景。


    再次，RPA技术的学习成本非常低。这并不是一个需要程序员技能的工具，对于具有一定计算机基础的财务人员来说，经过培训也是可以掌握此工具的使用方法的。这使RPA能够更好地下沉至财务共享服务中心一线，在财务共享服务中心内部实现更为及时、动态的流程优化。


    最后，RPA中也能够进行一些简单的规则处理，这从某种意义上与规则引擎发挥的作用是相似的，能够使流程中一些需要简单判断就能进行的处理无须使用更为专业的规则引擎，而能够使用RPA直接实现。


    当认识了RPA的这些特点后，我们再来关注一些财务机器人在实施过程中需要关注的要点。


    首先，财务机器人的实施并不仅仅是技术问题，核心在于对流程的分析和梳理，并基于流程分析的发现设计实施方案。这个过程更偏重于对流程的理解，因此财务机器人的项目不能脱离业务开展，必须要依赖一线业务人员的深度参与，方能够发挥其价值和效果。


    其次，要意识到RPA并不是万能的，更好的解决方案是实现系统的深度集成。但由于IT开发进度的问题，或者系统之间本身难以集成，很多情况下还是需要使用RPA作为对系统集成以外大量零散手工问题的补充解决方案。很多时候，这些零散的手工环节系统集成的代价非常高，使用RPA有时候能够起到意想不到的作用。


    智能化对财务共享的影响是深远的，而这一进程也将持续进行，并集成更多新的技术形成合力。


    （五）智能化助力财务管理实践再升级


    财务转型已经正式迈入了智能化的阶段，这已经不再是假想中的趋势，而是已经在发生的事实。对于企业集团的财务转型之路来说，在实现从核算向共享，出纳向司库转型的过程中，必须要重视并且抓住技术升级转型这一重大趋势，以智能化技术为基础，全面升级企业的财务信息化能力，为业务转型奠定扎实的基础。


    在漫长的转型道路中，我们经历了管理模式的升级、信息技术的进步。财务管理实践在这一过程中从未止步。对于企业财务来说，在这个过程中，无论是组织、团队还是财务人员，都在积极进行自我提升，以适应甚至是引导这一变革。


    智能化的到来并不可怕，从某种意义上来讲，这是时代赋予我们的新的机遇。财务人员在这一浪潮到来的过程中，如果能够积极面对自身能力全面升级的需求，必然能够在此过程中掌握主动权，将智能化技术与财务管理的场景进行深度融合，从而在管理实践中创造出更大的价值。


    ## 第三节　智能时代财务管理新逻辑


    智能时代的到来改变了财务组织、财务人的认知及财务信息技术，但更重要的是改变了财务逻辑，来自逻辑层次的改变才是最终触达灵魂的改变。当我们面对智能时代，苦苦寻觅该做些什么的时候，不妨一起来思考智能时代的新逻辑，如图1-11所示。


    ![img](images/txt001_11.jpg)


    图1-11　智能时代财务管理的新“逻辑思维”之思维导图


    ### 一、财务组织与认知的新逻辑


    财务组织与认知是财务主体的躯干与心智，当智能时代来临时，首先要强身明智，认识到财务组织与认知在智能时代的改变是财务智能变革的基础。让我们从管控、组织、知识、观念四个关键词来看财务组织与认知的新逻辑。


    （一）管控：局部与全面


    现代财务管控受到组织壁垒的严重制约，从集团到业务板块，到专业公司，再到机构，每一个层次之间都存在着无形的数据壁垒。今天，当无法将人力直接渗透至最末端的时候，数据是我们实施集团管控的关键，而数据壁垒的存在让管控的力量层层衰减。智能时代的数据将实现高度的集中和透明，数据无边界将成为可能。当数据壁垒被打破时，财务管控势必将从局部走向全面。这是智能时代管控的新逻辑。


    （二）组织：刚与柔


    现代财务组织建立在刚性管理的基础上，泰罗的科学管理理论将人看作“经济人”和“会说话的机器”，强调组织权威和专业分工。刚性组织的管理依靠组织制度和职责权力，管理者的作用在于命令、监督和控制。而智能时代需要的是更多的能动与创新，“会说话的机器”将被人工智能这个“真的机器”所替代。在智能时代更需要柔性组织，柔性管理擅长挖掘员工的创造性和主观能动性，依靠共同的价值观和组织文化调动员工的高层次主导动机，实现智能时代管理所需要的跳跃与变化、速度与反应、灵敏与弹性。这是智能时代组织的新逻辑。


    （三）知识：纵与横


    现代财务管理对财务人员的要求首先是要有专业的纵深能力。财务管理本身涉及会计、税务、预算、成本等多个垂直领域，很多财务人员常年围绕一个纵深领域从事工作，也因此形成了自身在某一领域很强的专业能力。但在智能时代，财务管理的视野将被极大地拓展，人工智能能够辅助增加财务人员的知识深度，而更多需要的是具有横向宽度，能够进行跨专业领域协同创新的新知识体系。如图1-12所示，在智能时代，适度的专业宽度和专业深度所形成的T字形知识结构将更具有价值。这是智能时代知识的新逻辑。


    ![img](images/txt001_12.jpg)


    图1-12　T字形知识结构


    （四）观念：被动与迎接


    如今财务人员的观念多数在潜意识中还是偏重被动的，在现今社会，财务人员被认为且自己也认为需要用严谨的态度去处理和解决问题。管理层和业务部门也常常会认为财务是后台角色，做好自己的事情，有问题能解决就可以了。这些都是典型的被动观念和思维。在这种认知和定位下，财务人员能够掌握的资源就会极其有限，难以起到很好的管理推动作用。在智能时代，将更多地强调财务基于大数据和智能分析的主动发现和管理能力。对财务来说，要实现这样的观念转变，就需要逐渐转向强势财务，从被动响应变化转变为主动迎接挑战。这是智能时代观念的新逻辑。


    ### 二、财务管理技术的新逻辑


    管理技术是财务主体的脉络。好的管理技术能够让财务主体运转得更具活力，并焕发出青春的能量。财务管理技术的逻辑转变将让财务能够触及更为广阔的管理技术领域，获得更加先进和更有价值的管理技术工具。让我们从数据、计算、记录、流程、互联五个关键词来看财务管理技术的新逻辑。


    （一）数据：小与大


    传统的财务数据处理和数据分析都是建立在结构化数据基础上的，也可称之为“小数据”。这也是我们最擅长的领域。传统财务分析领域的技术工具也多是基于“小数据”开展的。对财务来说，即使在智能时代，“小数据”也仍然是不可舍弃的核心，毕竟太多的财务管理理论都是构建在结构化数据基础上的。但对我们来说，在手握“小数据”工具的同时，还要高度重视大数据。基于大数据的技术工具，让海量非结构化数据的处理成为可能，这能够帮助我们跳出传统思维的局限，探索出一片广阔的新天地。这是智能时代数据的新逻辑。


    （二）计算：本地与云端


    传统的信息系统或者说计算多是构建在本地部署基础上的，从用户的角度来看，本地部署模式能够更加灵活地匹配我们的管理需求，更好地支持按需建设。但随着本地部署量越来越大，其带来的负面影响是持续高昂的运维成本的投入，以及企业大量资产的占用。这些在传统时代由于算力有限，并非不可容忍之痛，而在智能时代，大数据和机器学习对算力的要求都是海量的，传统的本地部署模式势必受限，云计算将成为首选，无论是公有云、私有云还是混合云，走向云端成为必然。这是智能时代计算的新逻辑。


    （三）记录：集中与分布


    传统财务信息的记录采用的是集中记录的方式，或者说“有中心”的记录方式。这种方式的好处是数据存储量小，不会产生大量的资源消耗，但数据的安全性及一致性并不是很高。因此，很多公司常见的财务问题是业财不一致，或者可以解释成不同系统之间的同源数据不一致。而在智能时代，随着区块链技术的出现，记账方式发生了革命性的改变，从原来的集中记账转变成分布式记账，将财务信息进行去中心化的多账本同步记录。虽然这种财务信息记录模式会造成大量的数据冗余，但网络和存储的快速发展克服了这一不足，信息记录从集中到分布将有越来越多的应用场景。这是智能时代记录的新逻辑。


    （四）流程：稳健与敏捷


    为保持传统财务端到端流程的可靠性，大家更多的是进行流程固化。在业务流程相对稳健的模式下，流程的可靠性和维护的便利性得到增强，但丧失了较多的流程灵活性，以及对客户需求响应的可能性，从而造成客户满意度的下降。在智能时代，更为高效的流程引擎能够支持维度更加丰富的流程控制，并且能够基于动态数据分析及时调整流程控制参数。同时，流程中智能自动处理的环节在增加，流程变动并不会给运营造成过多压力。在这种情况下，适度地将流程从稳健向敏捷转变成为可能，也将会赢得财务客户的青睐。这是智能时代流程的新逻辑。


    （五）互联：数联与物联


    传统的财务关注数字之间的联系，无论是流程处理还是经营管理，都更多地关注数字流转。数联时代帮助我们将一系列的经营管理过程及流程转换为数字形态，从而可以展开量化管理。而在智能时代，我们可以在数联的基础上引入物联。随着物联网应用的逐渐展开，在企业经营中关键实物、运输、人、财务凭证等的流动都可以打上物联标签，而将物流信息进一步转换为数字信息，让我们可以通过数字进行进一步分析，引入在没有物联时难以关注到的管理视角，如更为复杂的物流运输的成本管理等。物联并不是排斥数联，这里强调的是将物联转换为数联，在数联里加上物联的信息。这是智能时代互联的新逻辑。


    ### 三、财务管理实践的新逻辑


    管理实践是财务主体的手足，手足敏捷能够帮助财务主体变得更加刚劲有力。财务管理实践的逻辑转变能够让我们在实践工作中引入不同的视角，通过另一种模式对现有的实践进行转换和升级。让我们从绩效、预算、管会、控本、业财、共享、财资七个关键词来看财务管理实践的新逻辑。


    （一）绩效：因果与相关


    在传统的财务管理中，绩效管理通常会预先设定因果，通过设定关键绩效指标（KPI），并设定目标值来监控业务部门的执行情况。当KPI结果发生偏离时，势必要找到其原因，再进一步寻求解决措施。这是典型的因果分析法，也是当下主流的绩效管理思维。但在智能时代，大数据并不强调因果关系，而更关注相关性，这为经营分析打开了另一扇窗。基于大数据分析，我们从数据角度去找到影响KPI偏离的因素，并获得其影响方向，直接对这些因素进行干预管理，不解释为什么，不用必须向业务部门说明其中的逻辑。这是智能时代绩效的新逻辑。


    （二）预算：经验与数配


    传统的预算编制或资源配置往往基于经验，即使采用复杂的作业预算概念，其中的业务动因也大多是基于经验形成的。因此，传统预算是一种经验预算的说法是不为过的。这种经验预算对预算编制人员的经验要求很高，并且其结果很不稳定，往往在预算沟通过程中会有很大的弹性和空间。同时，沟通双方都很难找到合适的逻辑说服对方。而在智能时代，依靠大数据的可预测性，通过分析数据，从结果出发，能够找到影响经营结果的热点因素。通过确定这些热点的资源投入，实现精准预算或精准资源配置，我们称之为数配。这是智能时代预算的新逻辑。


    （三）管会：多维与全维


    传统管理会计的核心部分就是维度，而维度往往又是很多管理会计人员的痛苦回忆。在当前模式下，管理会计要实现多维度盈利分析的目标，关系型数据库的性能早已无法支持，多维数据库成为当下管理会计系统数据载体的主流。即使这样，在管理设计中，大家也仍然极其谨慎，减少一切不必要的维度，以提高运行效率。而在智能时代，无论是算力还是数据处理模式都将可能有更大的提升空间。虽然在当下还没有看到技术突破至理想的状况，但相信在不远的将来，维度的组合计算将不再是业务设计的约束，全维管理会计将成为可能。这是智能时代管理会计的新逻辑。


    （四）控本：后行与前置


    传统的成本管控往往是在成本发生后进行的事后追踪。即使往前推进一步，做到设计阶段的成本管理，在现阶段也是必要的，是能够发挥作用的。而随着智能时代技术的进步，成本、费用被细分为一个子类，针对不同子类都可以进一步向前延伸，建立专业的前端业务管理系统，如商旅管理系统、品牌宣传管理系统、车辆管理系统、通信费管理系统等。这些前置业务系统和财务系统之间无缝衔接，将成本费用的管理前置到业务过程中。这是智能时代控本的新逻辑。


    （五）业财：分裂与融合


    传统的业务系统和财务系统之间存在一定的分离情况，业务系统通过数据体外传递的方式完成和财务系统的数据对接。而近年随着业财融合的深入，出现了单个业务系统在体内自建会计引擎，并对接财务系统的模式，但多个系统之间仍然是分裂的。在智能时代，随着会计引擎应对复杂性能力的提升，将能够逐步建立起大型企业内部统一的会计引擎，并作为载体融合多个前端差异化的业务系统，从而实现业财对接从分裂到融合的转变。这是智能时代业财的新逻辑。


    （六）共享：人工与智控


    当下的财务共享服务采用的是典型的劳动密集型运营模式，将分散的财务作业进行集中处理。这种模式的建立在过去十年内极大地解决了国内企业在会计运营成本和管控能力上所面临的问题。但也要意识到，劳动密集本身也存在着成本和操作风险。在智能时代，基于人工智能和机器学习的共享作业将逐渐取代依赖于人工作业的模式。基于前端数据的丰富采集，依托智能规则，可以大幅降低财务共享服务中心的作业人力，从劳动密集型运营转变为技术密集型运营。依托人工智能，可以实现在智能作业时开展更加丰富的智能风控。这是智能时代共享的新逻辑。


    （七）财资：平面与立体


    在传统的财资管理系统中更多的是平面化的财资管理，所谓的平面化是指将财资管理的重点放在账户管理、资金结算、资金划拨、资金对账等交易性处理流程上。这也是很多国内企业目前资金管理水平的基本状况。而在智能时代，随着对复杂的资金管理模式技术支持能力的增强，财资管理将从平面走向立体，一方面，财资管理从交易处理模式转型为复杂的司库模式，在资产负债和流动性管理、风险管理领域进行更为丰富的实践；另一方面，财资管理从企业内部资金管理模式向供应链金融模式转变，构建起多维度立体的财资管理体系。这是智能时代财资的新逻辑。


    以上就是我们提出的智能时代财务管理的新逻辑，也是构建智能时代财务管理体系的思想基础。可以看到，智能时代已经全面到来，只有从思想基础上做好准备，我们才有可能拥抱这个大时代的到来。


    ## 第四节　智能时代财务新商业经济的转变


    智能时代的来临让我们每一个财务人员受到了它的影响，并且推动了财务人员形成驱动自我进步的新逻辑思维。智能时代对社会的改变远不止于此，它正在用自己的方式推动着整个社会的革新与进步。作为社会中非常重要的一环，商业也正在发生改变。本节我们一起来看一看智能时代正在出现什么样的新商业经济，以及这些新商业经济又是如何给财务的未来带来改变的。


    那么，什么是新商业经济呢？可以将它理解为一些能够改变商业模式和商业行为的新的思想观点。在这些新的思想观点的背后，往往能够带来广泛的社会影响和大量商业模式创新的机会。我们在这里要谈到三点：共享经济、跟踪经济和合作经济，如图1-13所示。一方面，帮助与本书共同思考财务未来的朋友们深入理解和认识这些新的商业经济思维；另一方面，从这三个新商业经济思维的视角去发现可能改变财务的机会。


    ![img](images/txt001_13.jpg)


    图1-13　智能时代的新商业经济


    ### 一、共享经济与财务'
  fmt: '

    智能化阶段的会计引擎会在独立产品化的基础上建立跨行业的统一会计引擎模式。会计引擎可以引入机器学习技术，通过学习基于规则转换的历史数据积累，逐渐形成新的转换规则体系。有了这样的技术基础，会计引擎能够随着数据积累的不断扩充，在学习过程中持续提升业务到财务的语言转换能力，并最终实现新业务接入免配置。这就如同我们通过海量案例培养了业务专家，这些业务专家能够自主解决复杂的业财信息转换问题。


    ## 2. 区块链与业财融合


    如果说会计引擎解决了业务信息向财务信息翻译的问题，那么区块链技术的出现则在推动业财一致性方面带来了新的思路。


    本书不再用过多的篇幅阐述区块链技术本身。需要明确的是，区块链是一种分布式账簿。传统的财务记账的模式是只有一个集中的账簿，所有的账务信息都进行集中记载。业务系统中的交易记录可以理解为一本业务账，财务系统中的会计凭证则是财务账。二者是转换关系，所以在一致性上就容易出现问题。


    而对于区块链来说，它能够在业务与财务之间构建一个平行账簿。任何一笔业务发生的时候，都同时在双方的账簿中记录一笔交易。而由于业务方在企业集团内部会有多个组织或法人的形态存在，也会在关联方或者内部往来方之间形成多个平行账簿。


    基于区块链技术在企业底层搭建了这样一套平行账簿体系后，由于任何一笔交易都是在多账簿中同时记账的，这就解决了数据一致性问题。在实现了数据一致性后，业务系统与财务系统之间不需要再进行数据一致性核对，内部往来和关联交易的核对问题也能够使用类似的方式来解决。


    ### (四) 财务机器人、智能化与共享服务的补充


    前面我们深度探讨过财务共享服务与智能化的关系，可以看到智能化阶段的到来能够极大地提升财务共享服务的效率，OCR、规则引擎、众包、人工智能等技术的综合使用，能够带来财务共享服务从传统模式向智能共享的跃迁。


    在这里，我们对财务共享服务领域当下比较流行的财务机器人的概念进行说明。实际上，财务机器人从严格意义上来说并不能称为智能化，而更类似于脚本自动化的概念。机器流程自动化（RPA）与智能化业务流程自动化（IPA）应用的最大区别在于，RPA应用的实现基础依然是传统的流程规则的明确，而IPA应用的实现基础将会是机器的自我学习、自我认知能力。在智能化阶段，如果要迈入彻底的无人共享模式，需要将多种技术进行组合使用，而财务机器人就是其中的重要一环。


    那么，什么是RPA呢？这项技术实际上是通过模拟人工作业的方式，将一些无法通过系统集成的系统手工：操作进行自动化的处理。以最常见的应付流程为例：维护供应商数据—提交釆购请求/采购订单—收货确认—收到供应商发票—三单匹配—调整差异—建立付款日期—准备付款—批准付款—付款执行—记账……在这个流程场景中，绝大多数业务环节都可以采用RPA来协助完成，如RPA可以协助企业进行供应商信息更新、创建采购申请、查询物流信息、更新采购计划、收货确认提醒、三单匹配核对、核对价格、检查付款差异、信用检查、银行对账等，通过这些环节的自动化应用，会在很大程度上提高应付流程的执行效率和质量[\[8\]](#txt001.xhtml#footnote_content_txt001_8)。


    RPA更类似于Office系统中的宏工具，只是功能上比宏工具强大了很多。RAP的优势有如下几个方面。


    首先，RPA并不是孤立的应用程序，而是具有服务端和能实现统一调度管理的工具。在这一功能的支撑下，RPA能够实现对多流程自动化任务的统一管理，也就是说，能够清晰地监控这些自动化任务发生的过程和执行结果。


    其次，RPA技术最大的优势在于能够实现跨系统平台的作业。这与宏工具不同，如果自动化任务只能在如Office这样的封闭系统中运行，那么要实现全流程的自动化就非常困难了。RAP能够跨越系统平台进行作业，这与人工作业的情况极为相似。甚至，对于使用虚拟系统的机器，RPA也能够支持本机和虚拟机之间的自动化交互作业，进一步扩大了应用场景。


    再次，RPA技术的学习成本非常低。这并不是一个需要程序员技能的工具，对于具有一定计算机基础的财务人员来说，经过培训也是可以掌握此工具的使用方法的。这使RPA能够更好地下沉至财务共享服务中心一线，在财务共享服务中心内部实现更为及时、动态的流程优化。


    最后，RPA中也能够进行一些简单的规则处理，这从某种意义上与规则引擎发挥的作用是相似的，能够使流程中一些需要简单判断就能进行的处理无须使用更为专业的规则引擎，而能够使用RPA直接实现。


    当认识了RPA的这些特点后，我们再来关注一些财务机器人在实施过程中需要关注的要点。


    首先，财务机器人的实施并不仅仅是技术问题，核心在于对流程的分析和梳理，并基于流程分析的发现设计实施方案。这个过程更偏重于对流程的理解，因此财务机器人的项目不能脱离业务开展，必须要依赖一线业务人员的深度参与，方能够发挥其价值和效果。


    其次，要意识到RPA并不是万能的，更好的解决方案是实现系统的深度集成。但由于IT开发进度的问题，或者系统之间本身难以集成，很多情况下还是需要使用RPA作为对系统集成以外大量零散手工问题的补充解决方案。很多时候，这些零散的手工环节系统集成的代价非常高，使用RPA有时候能够起到意想不到的作用。


    智能化对财务共享的影响是深远的，而这一进程也将持续进行，并集成更多新的技术形成合力。


    ### (五) 智能化助力财务管理实践再升级


    财务转型已经正式迈入了智能化的阶段，这已经不再是假想中的趋势，而是已经在发生的事实。对于企业集团的财务转型之路来说，在实现从核算向共享，出纳向司库转型的过程中，必须要重视并且抓住技术升级转型这一重大趋势，以智能化技术为基础，全面升级企业的财务信息化能力，为业务转型奠定扎实的基础。


    在漫长的转型道路中，我们经历了管理模式的升级、信息技术的进步。财务管理实践在这一过程中从未止步。对于企业财务来说，在这个过程中，无论是组织、团队还是财务人员，都在积极进行自我提升，以适应甚至是引导这一变革。


    智能化的到来并不可怕，从某种意义上来讲，这是时代赋予我们的新的机遇。财务人员在这一浪潮到来的过程中，如果能够积极面对自身能力全面升级的需求，必然能够在此过程中掌握主动权，将智能化技术与财务管理的场景进行深度融合，从而在管理实践中创造出更大的价值。


    # 第三节　智能时代财务管理新逻辑


    智能时代的到来改变了财务组织、财务人的认知及财务信息技术，但更重要的是改变了财务逻辑，来自逻辑层次的改变才是最终触达灵魂的改变。当我们面对智能时代，苦苦寻觅该做些什么的时候，不妨一起来思考智能时代的新逻辑，如图1-11所示。


    ![img](images/txt001_11.jpg)


    图1-11　智能时代财务管理的新“逻辑思维”之思维导图


    ## 一、财务组织与认知的新逻辑


    财务组织与认知是财务主体的躯干与心智，当智能时代来临时，首先要强身明智，认识到财务组织与认知在智能时代的改变是财务智能变革的基础。让我们从管控、组织、知识、观念四个关键词来看财务组织与认知的新逻辑。


    ### (一) 管控：局部与全面


    现代财务管控受到组织壁垒的严重制约，从集团到业务板块，到专业公司，再到机构，每一个层次之间都存在着无形的数据壁垒。今天，当无法将人力直接渗透至最末端的时候，数据是我们实施集团管控的关键，而数据壁垒的存在让管控的力量层层衰减。智能时代的数据将实现高度的集中和透明，数据无边界将成为可能。当数据壁垒被打破时，财务管控势必将从局部走向全面。这是智能时代管控的新逻辑。


    ### (二) 组织：刚与柔


    现代财务组织建立在刚性管理的基础上，泰罗的科学管理理论将人看作“经济人”和“会说话的机器”，强调组织权威和专业分工。刚性组织的管理依靠组织制度和职责权力，管理者的作用在于命令、监督和控制。而智能时代需要的是更多的能动与创新，“会说话的机器”将被人工智能这个“真的机器”所替代。在智能时代更需要柔性组织，柔性管理擅长挖掘员工的创造性和主观能动性，依靠共同的价值观和组织文化调动员工的高层次主导动机，实现智能时代管理所需要的跳跃与变化、速度与反应、灵敏与弹性。这是智能时代组织的新逻辑。


    ### (三) 知识：纵与横


    现代财务管理对财务人员的要求首先是要有专业的纵深能力。财务管理本身涉及会计、税务、预算、成本等多个垂直领域，很多财务人员常年围绕一个纵深领域从事工作，也因此形成了自身在某一领域很强的专业能力。但在智能时代，财务管理的视野将被极大地拓展，人工智能能够辅助增加财务人员的知识深度，而更多需要的是具有横向宽度，能够进行跨专业领域协同创新的新知识体系。如图1-12所示，在智能时代，适度的专业宽度和专业深度所形成的T字形知识结构将更具有价值。这是智能时代知识的新逻辑。


    ![img](images/txt001_12.jpg)


    图1-12　T字形知识结构


    ### (四) 观念：被动与迎接


    如今财务人员的观念多数在潜意识中还是偏重被动的，在现今社会，财务人员被认为且自己也认为需要用严谨的态度去处理和解决问题。管理层和业务部门也常常会认为财务是后台角色，做好自己的事情，有问题能解决就可以了。这些都是典型的被动观念和思维。在这种认知和定位下，财务人员能够掌握的资源就会极其有限，难以起到很好的管理推动作用。在智能时代，将更多地强调财务基于大数据和智能分析的主动发现和管理能力。对财务来说，要实现这样的观念转变，就需要逐渐转向强势财务，从被动响应变化转变为主动迎接挑战。这是智能时代观念的新逻辑。


    ## 二、财务管理技术的新逻辑


    管理技术是财务主体的脉络。好的管理技术能够让财务主体运转得更具活力，并焕发出青春的能量。财务管理技术的逻辑转变将让财务能够触及更为广阔的管理技术领域，获得更加先进和更有价值的管理技术工具。让我们从数据、计算、记录、流程、互联五个关键词来看财务管理技术的新逻辑。


    ### (一) 数据：小与大


    传统的财务数据处理和数据分析都是建立在结构化数据基础上的，也可称之为“小数据”。这也是我们最擅长的领域。传统财务分析领域的技术工具也多是基于“小数据”开展的。对财务来说，即使在智能时代，“小数据”也仍然是不可舍弃的核心，毕竟太多的财务管理理论都是构建在结构化数据基础上的。但对我们来说，在手握“小数据”工具的同时，还要高度重视大数据。基于大数据的技术工具，让海量非结构化数据的处理成为可能，这能够帮助我们跳出传统思维的局限，探索出一片广阔的新天地。这是智能时代数据的新逻辑。


    ### (二) 计算：本地与云端


    传统的信息系统或者说计算多是构建在本地部署基础上的，从用户的角度来看，本地部署模式能够更加灵活地匹配我们的管理需求，更好地支持按需建设。但随着本地部署量越来越大，其带来的负面影响是持续高昂的运维成本的投入，以及企业大量资产的占用。这些在传统时代由于算力有限，并非不可容忍之痛，而在智能时代，大数据和机器学习对算力的要求都是海量的，传统的本地部署模式势必受限，云计算将成为首选，无论是公有云、私有云还是混合云，走向云端成为必然。这是智能时代计算的新逻辑。


    ### (三) 记录：集中与分布


    传统财务信息的记录采用的是集中记录的方式，或者说“有中心”的记录方式。这种方式的好处是数据存储量小，不会产生大量的资源消耗，但数据的安全性及一致性并不是很高。因此，很多公司常见的财务问题是业财不一致，或者可以解释成不同系统之间的同源数据不一致。而在智能时代，随着区块链技术的出现，记账方式发生了革命性的改变，从原来的集中记账转变成分布式记账，将财务信息进行去中心化的多账本同步记录。虽然这种财务信息记录模式会造成大量的数据冗余，但网络和存储的快速发展克服了这一不足，信息记录从集中到分布将有越来越多的应用场景。这是智能时代记录的新逻辑。


    ### (四) 流程：稳健与敏捷


    为保持传统财务端到端流程的可靠性，大家更多的是进行流程固化。在业务流程相对稳健的模式下，流程的可靠性和维护的便利性得到增强，但丧失了较多的流程灵活性，以及对客户需求响应的可能性，从而造成客户满意度的下降。在智能时代，更为高效的流程引擎能够支持维度更加丰富的流程控制，并且能够基于动态数据分析及时调整流程控制参数。同时，流程中智能自动处理的环节在增加，流程变动并不会给运营造成过多压力。在这种情况下，适度地将流程从稳健向敏捷转变成为可能，也将会赢得财务客户的青睐。这是智能时代流程的新逻辑。


    ### (五) 互联：数联与物联


    传统的财务关注数字之间的联系，无论是流程处理还是经营管理，都更多地关注数字流转。数联时代帮助我们将一系列的经营管理过程及流程转换为数字形态，从而可以展开量化管理。而在智能时代，我们可以在数联的基础上引入物联。随着物联网应用的逐渐展开，在企业经营中关键实物、运输、人、财务凭证等的流动都可以打上物联标签，而将物流信息进一步转换为数字信息，让我们可以通过数字进行进一步分析，引入在没有物联时难以关注到的管理视角，如更为复杂的物流运输的成本管理等。物联并不是排斥数联，这里强调的是将物联转换为数联，在数联里加上物联的信息。这是智能时代互联的新逻辑。


    ## 三、财务管理实践的新逻辑


    管理实践是财务主体的手足，手足敏捷能够帮助财务主体变得更加刚劲有力。财务管理实践的逻辑转变能够让我们在实践工作中引入不同的视角，通过另一种模式对现有的实践进行转换和升级。让我们从绩效、预算、管会、控本、业财、共享、财资七个关键词来看财务管理实践的新逻辑。


    ### (一) 绩效：因果与相关


    在传统的财务管理中，绩效管理通常会预先设定因果，通过设定关键绩效指标（KPI），并设定目标值来监控业务部门的执行情况。当KPI结果发生偏离时，势必要找到其原因，再进一步寻求解决措施。这是典型的因果分析法，也是当下主流的绩效管理思维。但在智能时代，大数据并不强调因果关系，而更关注相关性，这为经营分析打开了另一扇窗。基于大数据分析，我们从数据角度去找到影响KPI偏离的因素，并获得其影响方向，直接对这些因素进行干预管理，不解释为什么，不用必须向业务部门说明其中的逻辑。这是智能时代绩效的新逻辑。


    ### (二) 预算：经验与数配


    传统的预算编制或资源配置往往基于经验，即使采用复杂的作业预算概念，其中的业务动因也大多是基于经验形成的。因此，传统预算是一种经验预算的说法是不为过的。这种经验预算对预算编制人员的经验要求很高，并且其结果很不稳定，往往在预算沟通过程中会有很大的弹性和空间。同时，沟通双方都很难找到合适的逻辑说服对方。而在智能时代，依靠大数据的可预测性，通过分析数据，从结果出发，能够找到影响经营结果的热点因素。通过确定这些热点的资源投入，实现精准预算或精准资源配置，我们称之为数配。这是智能时代预算的新逻辑。


    ### (三) 管会：多维与全维


    传统管理会计的核心部分就是维度，而维度往往又是很多管理会计人员的痛苦回忆。在当前模式下，管理会计要实现多维度盈利分析的目标，关系型数据库的性能早已无法支持，多维数据库成为当下管理会计系统数据载体的主流。即使这样，在管理设计中，大家也仍然极其谨慎，减少一切不必要的维度，以提高运行效率。而在智能时代，无论是算力还是数据处理模式都将可能有更大的提升空间。虽然在当下还没有看到技术突破至理想的状况，但相信在不远的将来，维度的组合计算将不再是业务设计的约束，全维管理会计将成为可能。这是智能时代管理会计的新逻辑。


    ### (四) 控本：后行与前置


    传统的成本管控往往是在成本发生后进行的事后追踪。即使往前推进一步，做到设计阶段的成本管理，在现阶段也是必要的，是能够发挥作用的。而随着智能时代技术的进步，成本、费用被细分为一个子类，针对不同子类都可以进一步向前延伸，建立专业的前端业务管理系统，如商旅管理系统、品牌宣传管理系统、车辆管理系统、通信费管理系统等。这些前置业务系统和财务系统之间无缝衔接，将成本费用的管理前置到业务过程中。这是智能时代控本的新逻辑。


    ### (五) 业财：分裂与融合


    传统的业务系统和财务系统之间存在一定的分离情况，业务系统通过数据体外传递的方式完成和财务系统的数据对接。而近年随着业财融合的深入，出现了单个业务系统在体内自建会计引擎，并对接财务系统的模式，但多个系统之间仍然是分裂的。在智能时代，随着会计引擎应对复杂性能力的提升，将能够逐步建立起大型企业内部统一的会计引擎，并作为载体融合多个前端差异化的业务系统，从而实现业财对接从分裂到融合的转变。这是智能时代业财的新逻辑。


    ### (六) 共享：人工与智控


    当下的财务共享服务采用的是典型的劳动密集型运营模式，将分散的财务作业进行集中处理。这种模式的建立在过去十年内极大地解决了国内企业在会计运营成本和管控能力上所面临的问题。但也要意识到，劳动密集本身也存在着成本和操作风险。在智能时代，基于人工智能和机器学习的共享作业将逐渐取代依赖于人工作业的模式。基于前端数据的丰富采集，依托智能规则，可以大幅降低财务共享服务中心的作业人力，从劳动密集型运营转变为技术密集型运营。依托人工智能，可以实现在智能作业时开展更加丰富的智能风控。这是智能时代共享的新逻辑。


    ### (七) 财资：平面与立体


    在传统的财资管理系统中更多的是平面化的财资管理，所谓的平面化是指将财资管理的重点放在账户管理、资金结算、资金划拨、资金对账等交易性处理流程上。这也是很多国内企业目前资金管理水平的基本状况。而在智能时代，随着对复杂的资金管理模式技术支持能力的增强，财资管理将从平面走向立体，一方面，财资管理从交易处理模式转型为复杂的司库模式，在资产负债和流动性管理、风险管理领域进行更为丰富的实践；另一方面，财资管理从企业内部资金管理模式向供应链金融模式转变，构建起多维度立体的财资管理体系。这是智能时代财资的新逻辑。


    以上就是我们提出的智能时代财务管理的新逻辑，也是构建智能时代财务管理体系的思想基础。可以看到，智能时代已经全面到来，只有从思想基础上做好准备，我们才有可能拥抱这个大时代的到来。


    # 第四节　智能时代财务新商业经济的转变


    智能时代的来临让我们每一个财务人员受到了它的影响，并且推动了财务人员形成驱动自我进步的新逻辑思维。智能时代对社会的改变远不止于此，它正在用自己的方式推动着整个社会的革新与进步。作为社会中非常重要的一环，商业也正在发生改变。本节我们一起来看一看智能时代正在出现什么样的新商业经济，以及这些新商业经济又是如何给财务的未来带来改变的。


    那么，什么是新商业经济呢？可以将它理解为一些能够改变商业模式和商业行为的新的思想观点。在这些新的思想观点的背后，往往能够带来广泛的社会影响和大量商业模式创新的机会。我们在这里要谈到三点：共享经济、跟踪经济和合作经济，如图1-13所示。一方面，帮助与本书共同思考财务未来的朋友们深入理解和认识这些新的商业经济思维；另一方面，从这三个新商业经济思维的视角去发现可能改变财务的机会。


    ![img](images/txt001_13.jpg)


    图1-13　智能时代的新商业经济


    ## 一、共享经济与财务

    '
  trans: '

    智能化阶段的会计引擎会在独立产品化的基础上建立跨行业的统一会计引擎模式。会计引擎可以引入机器学习技术，通过学习基于规则转换的历史数据积累，逐渐形成新的转换规则体系。有了这样的技术基础，会计引擎能够随着数据积累的不断扩充，在学习过程中持续提升业务到财务的语言转换能力，并最终实现新业务接入免配置。这就如同我们通过海量案例培养了业务专家，这些业务专家能够自主解决复杂的业财信息转换问题。


    ## 2. 区块链与业财融合


    如果说会计引擎解决了业务信息向财务信息翻译的问题，那么区块链技术的出现则在推动业财一致性方面带来了新的思路。


    本书不再用过多的篇幅阐述区块链技术本身。需要明确的是，区块链是一种分布式账簿。传统的财务记账的模式是只有一个集中的账簿，所有的账务信息都进行集中记载。业务系统中的交易记录可以理解为一本业务账，财务系统中的会计凭证则是财务账。二者是转换关系，所以在一致性上就容易出现问题。


    而对于区块链来说，它能够在业务与财务之间构建一个平行账簿。任何一笔业务发生的时候，都同时在双方的账簿中记录一笔交易。而由于业务方在企业集团内部会有多个组织或法人的形态存在，也会在关联方或者内部往来方之间形成多个平行账簿。


    基于区块链技术在企业底层搭建了这样一套平行账簿体系后，由于任何一笔交易都是在多账簿中同时记账的，这就解决了数据一致性问题。在实现了数据一致性后，业务系统与财务系统之间不需要再进行数据一致性核对，内部往来和关联交易的核对问题也能够使用类似的方式来解决。


    ### (四) 财务机器人、智能化与共享服务的补充


    前面我们深度探讨过财务共享服务与智能化的关系，可以看到智能化阶段的到来能够极大地提升财务共享服务的效率，OCR、规则引擎、众包、人工智能等技术的综合使用，能够带来财务共享服务从传统模式向智能共享的跃迁。


    在这里，我们对财务共享服务领域当下比较流行的财务机器人的概念进行说明。实际上，财务机器人从严格意义上来说并不能称为智能化，而更类似于脚本自动化的概念。机器流程自动化（RPA）与智能化业务流程自动化（IPA）应用的最大区别在于，RPA
    应用的实现基础依然是传统的流程规则的明确，而 IPA 应用的实现基础将会是机器的自我学习、自我认知能力。在智能化阶段，如果要迈入彻底的无人共享模式，需要将多种技术进行组合使用，而财务机器人就是其中的重要一环。


    那么，什么是 RPA 呢？这项技术实际上是通过模拟人工作业的方式，将一些无法通过系统集成的系统手工：操作进行自动化的处理。以最常见的应付流程为例：维护供应商数据—提交釆购请求/采购订单—收货确认—收到供应商发票—三单匹配—调整差异—建立付款日期—准备付款—批准付款—付款执行—记账……在这个流程场景中，绝大多数业务环节都可以采用
    RPA 来协助完成，如 RPA 可以协助企业进行供应商信息更新、创建采购申请、查询物流信息、更新采购计划、收货确认提醒、三单匹配核对、核对价格、检查付款差异、信用检查、银行对账等，通过这些环节的自动化应用，会在很大程度上提高应付流程的执行效率和质量[\[8\]](#txt001.xhtml#footnote_content_txt001_8)。


    RPA 更类似于 Office 系统中的宏工具，只是功能上比宏工具强大了很多。RAP 的优势有如下几个方面。


    首先，RPA 并不是孤立的应用程序，而是具有服务端和能实现统一调度管理的工具。在这一功能的支撑下，RPA 能够实现对多流程自动化任务的统一管理，也就是说，能够清晰地监控这些自动化任务发生的过程和执行结果。


    其次，RPA 技术最大的优势在于能够实现跨系统平台的作业。这与宏工具不同，如果自动化任务只能在如 Office 这样的封闭系统中运行，那么要实现全流程的自动化就非常困难了。RAP
    能够跨越系统平台进行作业，这与人工作业的情况极为相似。甚至，对于使用虚拟系统的机器，RPA 也能够支持本机和虚拟机之间的自动化交互作业，进一步扩大了应用场景。


    再次，RPA 技术的学习成本非常低。这并不是一个需要程序员技能的工具，对于具有一定计算机基础的财务人员来说，经过培训也是可以掌握此工具的使用方法的。这使 RPA
    能够更好地下沉至财务共享服务中心一线，在财务共享服务中心内部实现更为及时、动态的流程优化。


    最后，RPA 中也能够进行一些简单的规则处理，这从某种意义上与规则引擎发挥的作用是相似的，能够使流程中一些需要简单判断就能进行的处理无须使用更为专业的规则引擎，而能够使用
    RPA 直接实现。


    当认识了 RPA 的这些特点后，我们再来关注一些财务机器人在实施过程中需要关注的要点。


    首先，财务机器人的实施并不仅仅是技术问题，核心在于对流程的分析和梳理，并基于流程分析的发现设计实施方案。这个过程更偏重于对流程的理解，因此财务机器人的项目不能脱离业务开展，必须要依赖一线业务人员的深度参与，方能够发挥其价值和效果。


    其次，要意识到 RPA 并不是万能的，更好的解决方案是实现系统的深度集成。但由于 IT 开发进度的问题，或者系统之间本身难以集成，很多情况下还是需要使用 RPA
    作为对系统集成以外大量零散手工问题的补充解决方案。很多时候，这些零散的手工环节系统集成的代价非常高，使用 RPA 有时候能够起到意想不到的作用。


    智能化对财务共享的影响是深远的，而这一进程也将持续进行，并集成更多新的技术形成合力。


    ### (五) 智能化助力财务管理实践再升级


    财务转型已经正式迈入了智能化的阶段，这已经不再是假想中的趋势，而是已经在发生的事实。对于企业集团的财务转型之路来说，在实现从核算向共享，出纳向司库转型的过程中，必须要重视并且抓住技术升级转型这一重大趋势，以智能化技术为基础，全面升级企业的财务信息化能力，为业务转型奠定扎实的基础。


    在漫长的转型道路中，我们经历了管理模式的升级、信息技术的进步。财务管理实践在这一过程中从未止步。对于企业财务来说，在这个过程中，无论是组织、团队还是财务人员，都在积极进行自我提升，以适应甚至是引导这一变革。


    智能化的到来并不可怕，从某种意义上来讲，这是时代赋予我们的新的机遇。财务人员在这一浪潮到来的过程中，如果能够积极面对自身能力全面升级的需求，必然能够在此过程中掌握主动权，将智能化技术与财务管理的场景进行深度融合，从而在管理实践中创造出更大的价值。


    # 第三节　智能时代财务管理新逻辑


    智能时代的到来改变了财务组织、财务人的认知及财务信息技术，但更重要的是改变了财务逻辑，来自逻辑层次的改变才是最终触达灵魂的改变。当我们面对智能时代，苦苦寻觅该做些什么的时候，不妨一起来思考智能时代的新逻辑，如图
    1-11 所示。


    ![img](img/txt001_11.jpg)


    图 1-11　智能时代财务管理的新“逻辑思维”之思维导图


    ## 一、财务组织与认知的新逻辑


    财务组织与认知是财务主体的躯干与心智，当智能时代来临时，首先要强身明智，认识到财务组织与认知在智能时代的改变是财务智能变革的基础。让我们从管控、组织、知识、观念四个关键词来看财务组织与认知的新逻辑。


    ### (一) 管控：局部与全面


    现代财务管控受到组织壁垒的严重制约，从集团到业务板块，到专业公司，再到机构，每一个层次之间都存在着无形的数据壁垒。今天，当无法将人力直接渗透至最末端的时候，数据是我们实施集团管控的关键，而数据壁垒的存在让管控的力量层层衰减。智能时代的数据将实现高度的集中和透明，数据无边界将成为可能。当数据壁垒被打破时，财务管控势必将从局部走向全面。这是智能时代管控的新逻辑。


    ### (二) 组织：刚与柔


    现代财务组织建立在刚性管理的基础上，泰罗的科学管理理论将人看作“经济人”和“会说话的机器”，强调组织权威和专业分工。刚性组织的管理依靠组织制度和职责权力，管理者的作用在于命令、监督和控制。而智能时代需要的是更多的能动与创新，“会说话的机器”将被人工智能这个“真的机器”所替代。在智能时代更需要柔性组织，柔性管理擅长挖掘员工的创造性和主观能动性，依靠共同的价值观和组织文化调动员工的高层次主导动机，实现智能时代管理所需要的跳跃与变化、速度与反应、灵敏与弹性。这是智能时代组织的新逻辑。


    ### (三) 知识：纵与横


    现代财务管理对财务人员的要求首先是要有专业的纵深能力。财务管理本身涉及会计、税务、预算、成本等多个垂直领域，很多财务人员常年围绕一个纵深领域从事工作，也因此形成了自身在某一领域很强的专业能力。但在智能时代，财务管理的视野将被极大地拓展，人工智能能够辅助增加财务人员的知识深度，而更多需要的是具有横向宽度，能够进行跨专业领域协同创新的新知识体系。如图
    1-12 所示，在智能时代，适度的专业宽度和专业深度所形成的 T 字形知识结构将更具有价值。这是智能时代知识的新逻辑。


    ![img](img/txt001_12.jpg)


    图 1-12　T 字形知识结构


    ### (四) 观念：被动与迎接


    如今财务人员的观念多数在潜意识中还是偏重被动的，在现今社会，财务人员被认为且自己也认为需要用严谨的态度去处理和解决问题。管理层和业务部门也常常会认为财务是后台角色，做好自己的事情，有问题能解决就可以了。这些都是典型的被动观念和思维。在这种认知和定位下，财务人员能够掌握的资源就会极其有限，难以起到很好的管理推动作用。在智能时代，将更多地强调财务基于大数据和智能分析的主动发现和管理能力。对财务来说，要实现这样的观念转变，就需要逐渐转向强势财务，从被动响应变化转变为主动迎接挑战。这是智能时代观念的新逻辑。


    ## 二、财务管理技术的新逻辑


    管理技术是财务主体的脉络。好的管理技术能够让财务主体运转得更具活力，并焕发出青春的能量。财务管理技术的逻辑转变将让财务能够触及更为广阔的管理技术领域，获得更加先进和更有价值的管理技术工具。让我们从数据、计算、记录、流程、互联五个关键词来看财务管理技术的新逻辑。


    ### (一) 数据：小与大


    传统的财务数据处理和数据分析都是建立在结构化数据基础上的，也可称之为“小数据”。这也是我们最擅长的领域。传统财务分析领域的技术工具也多是基于“小数据”开展的。对财务来说，即使在智能时代，“小数据”也仍然是不可舍弃的核心，毕竟太多的财务管理理论都是构建在结构化数据基础上的。但对我们来说，在手握“小数据”工具的同时，还要高度重视大数据。基于大数据的技术工具，让海量非结构化数据的处理成为可能，这能够帮助我们跳出传统思维的局限，探索出一片广阔的新天地。这是智能时代数据的新逻辑。


    ### (二) 计算：本地与云端


    传统的信息系统或者说计算多是构建在本地部署基础上的，从用户的角度来看，本地部署模式能够更加灵活地匹配我们的管理需求，更好地支持按需建设。但随着本地部署量越来越大，其带来的负面影响是持续高昂的运维成本的投入，以及企业大量资产的占用。这些在传统时代由于算力有限，并非不可容忍之痛，而在智能时代，大数据和机器学习对算力的要求都是海量的，传统的本地部署模式势必受限，云计算将成为首选，无论是公有云、私有云还是混合云，走向云端成为必然。这是智能时代计算的新逻辑。


    ### (三) 记录：集中与分布


    传统财务信息的记录采用的是集中记录的方式，或者说“有中心”的记录方式。这种方式的好处是数据存储量小，不会产生大量的资源消耗，但数据的安全性及一致性并不是很高。因此，很多公司常见的财务问题是业财不一致，或者可以解释成不同系统之间的同源数据不一致。而在智能时代，随着区块链技术的出现，记账方式发生了革命性的改变，从原来的集中记账转变成分布式记账，将财务信息进行去中心化的多账本同步记录。虽然这种财务信息记录模式会造成大量的数据冗余，但网络和存储的快速发展克服了这一不足，信息记录从集中到分布将有越来越多的应用场景。这是智能时代记录的新逻辑。


    ### (四) 流程：稳健与敏捷


    为保持传统财务端到端流程的可靠性，大家更多的是进行流程固化。在业务流程相对稳健的模式下，流程的可靠性和维护的便利性得到增强，但丧失了较多的流程灵活性，以及对客户需求响应的可能性，从而造成客户满意度的下降。在智能时代，更为高效的流程引擎能够支持维度更加丰富的流程控制，并且能够基于动态数据分析及时调整流程控制参数。同时，流程中智能自动处理的环节在增加，流程变动并不会给运营造成过多压力。在这种情况下，适度地将流程从稳健向敏捷转变成为可能，也将会赢得财务客户的青睐。这是智能时代流程的新逻辑。


    ### (五) 互联：数联与物联


    传统的财务关注数字之间的联系，无论是流程处理还是经营管理，都更多地关注数字流转。数联时代帮助我们将一系列的经营管理过程及流程转换为数字形态，从而可以展开量化管理。而在智能时代，我们可以在数联的基础上引入物联。随着物联网应用的逐渐展开，在企业经营中关键实物、运输、人、财务凭证等的流动都可以打上物联标签，而将物流信息进一步转换为数字信息，让我们可以通过数字进行进一步分析，引入在没有物联时难以关注到的管理视角，如更为复杂的物流运输的成本管理等。物联并不是排斥数联，这里强调的是将物联转换为数联，在数联里加上物联的信息。这是智能时代互联的新逻辑。


    ## 三、财务管理实践的新逻辑


    管理实践是财务主体的手足，手足敏捷能够帮助财务主体变得更加刚劲有力。财务管理实践的逻辑转变能够让我们在实践工作中引入不同的视角，通过另一种模式对现有的实践进行转换和升级。让我们从绩效、预算、管会、控本、业财、共享、财资七个关键词来看财务管理实践的新逻辑。


    ### (一) 绩效：因果与相关


    在传统的财务管理中，绩效管理通常会预先设定因果，通过设定关键绩效指标（KPI），并设定目标值来监控业务部门的执行情况。当 KPI 结果发生偏离时，势必要找到其原因，再进一步寻求解决措施。这是典型的因果分析法，也是当下主流的绩效管理思维。但在智能时代，大数据并不强调因果关系，而更关注相关性，这为经营分析打开了另一扇窗。基于大数据分析，我们从数据角度去找到影响
    KPI 偏离的因素，并获得其影响方向，直接对这些因素进行干预管理，不解释为什么，不用必须向业务部门说明其中的逻辑。这是智能时代绩效的新逻辑。


    ### (二) 预算：经验与数配


    传统的预算编制或资源配置往往基于经验，即使采用复杂的作业预算概念，其中的业务动因也大多是基于经验形成的。因此，传统预算是一种经验预算的说法是不为过的。这种经验预算对预算编制人员的经验要求很高，并且其结果很不稳定，往往在预算沟通过程中会有很大的弹性和空间。同时，沟通双方都很难找到合适的逻辑说服对方。而在智能时代，依靠大数据的可预测性，通过分析数据，从结果出发，能够找到影响经营结果的热点因素。通过确定这些热点的资源投入，实现精准预算或精准资源配置，我们称之为数配。这是智能时代预算的新逻辑。


    ### (三) 管会：多维与全维


    传统管理会计的核心部分就是维度，而维度往往又是很多管理会计人员的痛苦回忆。在当前模式下，管理会计要实现多维度盈利分析的目标，关系型数据库的性能早已无法支持，多维数据库成为当下管理会计系统数据载体的主流。即使这样，在管理设计中，大家也仍然极其谨慎，减少一切不必要的维度，以提高运行效率。而在智能时代，无论是算力还是数据处理模式都将可能有更大的提升空间。虽然在当下还没有看到技术突破至理想的状况，但相信在不远的将来，维度的组合计算将不再是业务设计的约束，全维管理会计将成为可能。这是智能时代管理会计的新逻辑。


    ### (四) 控本：后行与前置


    传统的成本管控往往是在成本发生后进行的事后追踪。即使往前推进一步，做到设计阶段的成本管理，在现阶段也是必要的，是能够发挥作用的。而随着智能时代技术的进步，成本、费用被细分为一个子类，针对不同子类都可以进一步向前延伸，建立专业的前端业务管理系统，如商旅管理系统、品牌宣传管理系统、车辆管理系统、通信费管理系统等。这些前置业务系统和财务系统之间无缝衔接，将成本费用的管理前置到业务过程中。这是智能时代控本的新逻辑。


    ### (五) 业财：分裂与融合


    传统的业务系统和财务系统之间存在一定的分离情况，业务系统通过数据体外传递的方式完成和财务系统的数据对接。而近年随着业财融合的深入，出现了单个业务系统在体内自建会计引擎，并对接财务系统的模式，但多个系统之间仍然是分裂的。在智能时代，随着会计引擎应对复杂性能力的提升，将能够逐步建立起大型企业内部统一的会计引擎，并作为载体融合多个前端差异化的业务系统，从而实现业财对接从分裂到融合的转变。这是智能时代业财的新逻辑。


    ### (六) 共享：人工与智控


    当下的财务共享服务采用的是典型的劳动密集型运营模式，将分散的财务作业进行集中处理。这种模式的建立在过去十年内极大地解决了国内企业在会计运营成本和管控能力上所面临的问题。但也要意识到，劳动密集本身也存在着成本和操作风险。在智能时代，基于人工智能和机器学习的共享作业将逐渐取代依赖于人工作业的模式。基于前端数据的丰富采集，依托智能规则，可以大幅降低财务共享服务中心的作业人力，从劳动密集型运营转变为技术密集型运营。依托人工智能，可以实现在智能作业时开展更加丰富的智能风控。这是智能时代共享的新逻辑。


    ### (七) 财资：平面与立体


    在传统的财资管理系统中更多的是平面化的财资管理，所谓的平面化是指将财资管理的重点放在账户管理、资金结算、资金划拨、资金对账等交易性处理流程上。这也是很多国内企业目前资金管理水平的基本状况。而在智能时代，随着对复杂的资金管理模式技术支持能力的增强，财资管理将从平面走向立体，一方面，财资管理从交易处理模式转型为复杂的司库模式，在资产负债和流动性管理、风险管理领域进行更为丰富的实践；另一方面，财资管理从企业内部资金管理模式向供应链金融模式转变，构建起多维度立体的财资管理体系。这是智能时代财资的新逻辑。


    以上就是我们提出的智能时代财务管理的新逻辑，也是构建智能时代财务管理体系的思想基础。可以看到，智能时代已经全面到来，只有从思想基础上做好准备，我们才有可能拥抱这个大时代的到来。


    # 第四节　智能时代财务新商业经济的转变


    智能时代的来临让我们每一个财务人员受到了它的影响，并且推动了财务人员形成驱动自我进步的新逻辑思维。智能时代对社会的改变远不止于此，它正在用自己的方式推动着整个社会的革新与进步。作为社会中非常重要的一环，商业也正在发生改变。本节我们一起来看一看智能时代正在出现什么样的新商业经济，以及这些新商业经济又是如何给财务的未来带来改变的。


    那么，什么是新商业经济呢？可以将它理解为一些能够改变商业模式和商业行为的新的思想观点。在这些新的思想观点的背后，往往能够带来广泛的社会影响和大量商业模式创新的机会。我们在这里要谈到三点：共享经济、跟踪经济和合作经济，如图
    1-13 所示。一方面，帮助与本书共同思考财务未来的朋友们深入理解和认识这些新的商业经济思维；另一方面，从这三个新商业经济思维的视角去发现可能改变财务的机会。


    ![img](img/txt001_13.jpg)


    图 1-13　智能时代的新商业经济


    ## 一、共享经济与财务

