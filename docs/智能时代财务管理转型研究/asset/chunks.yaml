    2.智能增强


    对于财务共享服务中心的运营管理来说，不少财务共享服务中心还停留在依靠人工进行管理分析的状态。因此，提升财务共享服务中心的运营管理水平，首先应当提升运营管理的基础信息化水平。


    在提升基础信息化水平方面，可以借助信息系统实现绩效指标的管理，并应用于绩效看板和绩效报表。在准入评估方面，可以进行系统化的评估流程执行，并将评估模型系统化。在SLA（服务水平协议）和定价方面，能够基于系统进行SLA的各项指标的计算和出具报告，并据此结合定价标准测算出具各服务对象的结算报表。在风险管理方面，能够将RCSA、KRI及重大风险事项管理三大操作风险管理工具系统化，并应用于财务共享服务中心。在质量管理方面，能够将质量抽检、质量结果反馈、质量报告出具等质量管理过程系统化。在服务管理方面，能够构建邮箱及热线系统，以支持客户服务的专业化。


    在智能时代，我们能够在上述信息化手段建立起来的基础上，引入大数据技术，提升对财务共享服务中心在绩效分析、风险发现、质量评价、服务跟踪等方面的深入管理，依托更为丰富的数据输入，提升财务共享服务中心运营管理的层次。


    ### 二、财务众包'
  fmt: '

    我们要对付的是最无能为力的关联舞弊。正如上文中所说的，人的思维能力很难发现跨越时间和空间的关联性。在大数据技术的支持下，通过构建社会网络的方式来发现渗漏风险，这成为解决关联渗漏的创新思路。


    社会网络是指利用企业内部财务相关经济事项的各个关联主体之间的相互关系构建的一个关系网络。在这个网络中，有公司的员工、员工的审批领导、供应商、供应商的股东、供应商与公司内的其他关联人等。通过筛查社会网络中可能发生渗漏行为的主体规律特征来识别利用传统反渗漏技术难以发现的渗漏行为。在社会网络模型中，集成了筛选、统计、时间还原、风险节点关系分析、可视化关联分析等模型，能够更加快捷、有效地帮助财务反渗漏分析师发现潜在的渗漏风险。


    在实际应用中，我们可以以报销单据为核心向外扩展，通过员工、审批人、供应商等多个要素之间的关联关系，跨越空间和时间构建起网络。在这个网络中，我们试图寻找所谓的“黑节点”。“黑节点”
    是指通过其他技术方式发现的有问题的单据、人或供应商。一旦出现了“黑节点”，我们就有理由怀疑在这个网络中存在其他的“被污染节点”。这种从网络和“黑节点”视角出发的渗漏发现方法往往能够以点带面地发现问题，并且将深度隐藏在空间和时间掩体后的渗漏行为挖掘出来。


    在实际构建SNA社会网络模型的时候，通常需要经过节点确定和数据提取、节点数据清洗、关联关系匹配、生产网络等步骤。在这个过程中应尽量减少数据不足、垃圾数据过多、数据冗余等问题对网络质量的影响。


    反渗漏技术即将进入智能风控时代，这让我们在面对高度进化的渗透势力时有了一战之力。财务人应该拿起智能风控的武器，来赢得战斗的胜利。


    ## 第三节　智能时代业务财务创新


    ### 一、智能时代业务财务框架详解及智能增强


    业务财务的提出为国内财务管理水平的提升注入了强大的活力，也是传统财务向新型财务转变的重要一步。业务财务的核心理念是希望财务队伍能够从自己的专业领域走出去，成为业务部门的合作伙伴，能够站在业务的视角及业务与财务专业的交集区域，开展财务管理活动。


    但是长期以来，业务财务的概念并没有相对标准的细分定义，导致每个公司对这个概念的理解或多或少都有一些差异，从而在实务中对于如何设置业务财务队伍、如何发挥这支队伍的价值等都产生了一定的困扰。下面我们从业务财务的不同角度来解析，看看业务财务在不同领域都可以做些什么，以及在智能时代能够获得怎样的技术支持。


    #### （一）产品财务管理


    ##### 1.框架详解


    产品财务管理框架详解，如表6-11所示。


    能够积极主动地参与到产品前期规划和投资阶段中，从产品设计成本管理的角度对产品规划提出财务视角的专业意见。能够对产品的投资预算、投资回报、成本策略、目标设定、利润预测、产品组合投资策略等展开专业分析。积极参与产品经营分析会议，从产品线全生命周期视角为管理层提供决策支持。


    表6-11　产品财务管理框架详解


    ![img](images/txt006_16.jpg)


    ##### 2.智能增强


    在产品财务管理方面，单纯从财务的角度来说，能够实现智能增强的范围是有限的。


    在产品规划和投资方面，基于今天的信息条件，更为广泛的数据和信息获取能够帮助我们更加有效地模拟预测产品未来的经营情况。


    在产品最佳财务实践的推广方面，可以尝试着使用一些新的技术手段来加强培训的效率和效果。在传统模式下，通常需要通过开发课程、面授推广的方式来传播最佳实践。而在今天，我们可以考虑采用更丰富的形式，如网络直播、碎片化学习等，借鉴新的学习模式的优点。


    物联网的发展使我们能够更好地跟踪实体化产品的市场投放数据，通过经营分析获得如产品的使用情况、用户的反馈情况等更有价值的数据。


    相比财务本身来说，业务财务更需要关注的是企业产品本身在智能化领域的发展。对于产品财务经理来说，需要能够紧跟智能时代的新技术与企业自身产品的结合情况，能够对涉及智能技术的新产品实现优化资源配置判断，能够应用智能技术建立新的产品规划和投资的财务评价模型，实现和传统产品评价同样的标准，甚至更好的评价能力，而不是在智能时代完全无法理解业务部门的战略、规划和行动，财务需要成为业务的伙伴，而非拖累。


