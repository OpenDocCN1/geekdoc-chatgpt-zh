    \ Sciences，2015，46（4）：361-364.\n\n\uFEFF\n\n# 第四章　智能时代财务教育改革\n\n## 第一节　智能时代大学财务教育的变革\n\
    \n教育为什么要改革，大学在智能时代能够做些什么，如何构建高校财会教育能力几个角度切入。最后，再一起来看看那些已经行动起来的高校正在做的事情。如图4-1所示。\n\
    \n![img](images/txt004_1.jpg)\n\n图4-1　智能时代大学财会教育分析\n\n### 一、大学财会教育的窘境\n\n对于大学财会教育来说，并不是大家不愿意作出一些改变，而的确是存在着一些客观的困难和挑战。实际上，如果大家用心去观察，就都能看到这些无奈。今天，企业抱怨找不到好的人才，但同时又有更多的大学生为无法就业而苦苦纠结，听说不少学生从大三开始，就对未来的就业和职业发展感到有些悲观和忧虑。虽然这些问题早就存在，但竞争毕竟没有今天这么激烈，就业机会还是很多的。\n\
    \n那么，是什么造成了大学财会教育的窘境呢？笔者总结出下面几点原因。\n\n#### （一）具有创新能力和实践经验的师资不足\n教书育人，好的师资是极其重要的。在这些年里，笔者没有中断学习，听过很多不同高校名师的课程。在那些优秀高校的顶级师资中，有不少教授兼具创新能力和实践经验。一方面，这些优秀的教授没有停止过自我学习；另一方面，他们更多的是向企业管理人员授课，从而以另一种方式积累着实践经验。\n\
    \n但同时，国内还有不少高校教师是没有这样的声望和条件去获得创新和实践的机会的。由于大学教师任职的门槛高，企业中有实践经验的管理人员也基本没有进入大学任教的条件。这就造成了大学里具有创新能力和实践经验的师资不足。\n\
    \n#### （二）学生过多且对专业热爱不足\n很多学生在高考填报志愿时，并没有认真地思考过选择财会这样一门专业对自己来说到底意味着什么？自己是否会真心热爱这门学科？没有兴趣的学习注定是低效的，并且学习者也难以成长为最顶尖的那一批人。\n\
    \n当然，很多学生根本就没有自己进行选择或者决定的机会，家长包办已经成为一种常态。笔者当时也没有这个机会，之所以学会计专业是因为学校保送，而保送学生必须读会计专业。但是好在笔者是真心热爱这一专业，这也使笔者后续的学习有了更多的动力。\n\
    \n这种非个人意愿作出的选择，再结合有些媒体不负责任地鼓吹财会专业的高就业率，造成了大家对这个行业的认知不足和一拥而入。每年社会上都会出现上百万的财会专业毕业生，以致于毕业生的就业成为难题。\n\
    \n#### （三）证书导向，不是万能药\n当学校的教育者们意识到就业是个问题后，开始研究怎样解决这个难题。考各类财会证书开始在大学中流行，学生的核心任务似乎突然间变成了考证。当然，相比那些连证都不考、完全消极应对就业压力的学生来说，考证的学生还属于能积极应对就业挑战的。但这背后也带来了新的问题。\n\
    \n在学校中流行的各类职业证书本是针对在职人士的，而且当其积累了一定的工作经验以后再来学习会更有价值，而学生单纯以应试为目的，其学习效果差了很多，拿到证书的学生也未必能够应对复杂的工作实践场景。当然，一些国内外的财会公会、机构也在积极扭转这种局面，通过在学校中开展各类素质提升活动来帮助学生成长。\n\
    \n#### （四）财会是一门技术活，在校学生缺乏实践的机会\n财会专业本身，特别是会计专业，可以说是一门技术活，经验的积累很难一朝一夕做到。而学校中设置的很多课程还是偏理论性的，学生一旦面对实务，则往往难以上手。\n\
    \n这种情况的出现是因为很多高校和企业脱节，学校教育难以模拟还原真实的实操场景，虽然近些年出现了各类实操实验课程，但多数还是属于纸面设计，在信息系统的拟真性上还有很大的差距。也有一些高校试图将学生推荐到企业实习，但由于学生能力不到位，本身做不了什么，而且企业也很难为了短期实习投入大量的精力并从中受益，实习这件事情在多数情况下流于形式。\n\
    \n#### （五）智能化结合的条件严重不足\n在智能时代，高校和社会实践就更容易脱节了，不但和智能化结合难，而且多数高校还处于和信息化难以有效对接的阶段。对于财会学科，国内很多院校只能基于一些传统的本土产品构建学习环境，对于ERP的应用，以及更为复杂的管理会计、共享服务、经营分析等应用场景则很难构建环境，更谈不上构建智能时代所需要涉及的大数据、云计算、区块链、人工智能等技术领域的学习环境。\n\
    \n### 二、大学财会教育改革的必要性\n\n对于高校来说，怎样打破这样的窘境呢？在计算机技术出现的时候，很多高校的财会专业没有抓住机会，在学校中的计算机专业如火如荼发展的时候，财会专业还在Excel和会计电算化中苦苦挣扎。在互联网出现的时候，差距进一步被拉大，学校难以为财务专业搭建一套完善的拟真网络化作业平台，学生难以在网络环境中学到互联网时代的分工协同。而今天，高校的财会教育改革势在必行。\n\
    \n#### （一）面向未来的新机会稍纵即逝\n机会并不是随时都会来临的，也不会轻易出现在没有准备的人面前。如我们前面所说的，在信息化和互联网时代来临时，多数高校都没有抓住机会。而今天，智能时代已经到来，如果错过了这个机会，有可能会错过在未来数十年中最大的一次机遇。\n\
    \n在从互联网时代向智能时代转变的过程中，技术会呈现爆发式的演进，已经没有机会让我们再像过去那样，花上十年、二十年的时间来慢慢学习、慢慢转型。如果自身没有做好准备，机会将稍纵即逝，而在第一个环节被落下后，将难以追上后续的步伐。想要做好准备，就必须有点儿疯狂的精神和行动。\n\
    \n#### （二）财会专业学生的就业竞争前置为高校教育能力的竞争\n财会专业毕业生的竞争环境已经到了非常严重的程度。一方面，财会专业毕业生的数量还在持续增长；另一方面，有很多单位没有招聘应届财会毕业生的计划，财会专业学生整体就业形势异常严峻。\n"
  trans: "\n\n## （一）财会人员转型方向\n\n### 1. 向管理会计转型\n人工智能时代，在财务机器人普及和大量财务软件上线运行的情况下，企业的财会岗位将会得到削减和整合，市场上的财会岗位总数将会逐年缩减，财会从业人员的需求也会有所降低，其中受到突出影响的是从事基础核算工作的财会人员。对于这部分财会人员来说，为了不被历史发展潮流所淘汰，就需要及时更新自身的知识结构，提升自身的价值，以求适应人工智能时代的财务管理需求。结合当前财会人员的基本情况和企业发展的现实需要，财会人员最理想的转型之路就是由财务会计尽快转型为管理会计。人工智能时代，企业对管理会计的需求量会与日俱增，管理会计将会是企业财会人员的主流。众所周知，管理会计需要具备洞察未来和指引决策的能力、管理风险的能力、建立道德环境的能力；还需要具备管理信息系统和与他人合作达成组织目标的能力。首先要重视数据分析，明确管理数据与财务数据的区别。管理数据不同于财务数据，它是企业基础核算数据整合之后形成的，对企业战略发展具有指导意义的信息，包含企业基础信息、财务数据、业务数据、业务信息等相关内容[\\\
    [9\\]](#txt003.xhtml#footnote_content_txt003_9)。企业对传统会计数据进行分类，更接近于企业的业务活动和管理要求，也能反映企业管理中所有环节中的投入与产出关系，对于业务部门来说，这样的会计核算大大增强了成本控制的责任感。\n\
    \n### 2. 向国际会计转型\n人工智能时代，大中型企业和跨国企业的业务范围和投资领域将会再次扩展，更多的企业将会走出国门与其他国家和地区的市场主体开展广泛而深入的合作，这就需要财会人员具备广阔的国际视野，不仅要了解投资目的地的风土人情和政策法规，还要了解和掌握投资目的地的财政税收情况和会计核算、利润分配、投资收益分配、税收返还、优惠政策等多个方面的专业知识，从财务管理和成本控制的角度为企业发展提供必要的技术和财务支持。从全球化发展的角度分析，会计行业的发展越来越国际化，需要财会人员具备一定的国际管理能力，如具备丰富的专业知识和商务英语理解沟通能力并熟悉全球经济和商业环境，具备职业判断与决策能力、风险控制能力及管理能力[\\\
    [10\\]](#txt003.xhtml#footnote_content_txt003_10)。对于英文水平比较高的财会人员来说，可以参加一些与国际税法相关的培训课程，对国际税法进行系统的学习。具备专业的财务知识和技能、熟练的英语运用能力、精通国内和国际税法的财会人员将是顺应未来发展趋势的财会人才。\n\
    \n## （二）财会人员自觉提高职业胜任能力\n\n### 1. 加强人际沟通\n要在工作上取得成就，实现自己的职业规划，仅仅有硬实力还不够，还需要足够的软实力，即良好的人际沟通交流能力。企业内部的良好沟通不仅可以提高工作效率，还可以营造良好的工作氛围，使员工保持友好相处的关系；另外，良好的沟通还可以使员工明白目标差异，从而调整各自的行为，进行有效的合作；良好的沟通能力可以提高管理效率。财会人员通过与上级和同事的交流沟通，可以进一步了解自身的缺点和不足，并不断完善自我。\n\
    \n### 2. 充分利用职业再培训提高自身能力\n利用业余时间参加财务专业培训，考取财务职称证书，抓住每个学习和培训的机会，努力增加自己的职业知识积累，提高职业技能。随着会计新政策、制度、技术、方法的不断更新改革，财会人员在完成基础岗位职责的前提下，面对财会行业的转型和发展，必须保持不断学习的态度，通过多种渠道和方式，丰富自己的知识，提高各项工作技能，使自己的知识和能力能够应对不断变化的环境，进行动态的职业规划，合理利用财务资源和创新管理机制，提高自己的工作能力。\n\
    \n### 3. 不断积累知识和提高技能，做到业务财务一体化，培养全局观念和战略规划能力\n财会人员不仅要了解财务专业知识，还要熟悉企业的经营业务，了解所在企业的行业类型及特点，对企业进行业务流程再造和资源整合。财会人员提高自己的控制能力和职业判断能力，对未来的业务作出合理的分析和判断。身处企业相对独立的部门，财会人员必须站在全局的角度，客观公正地看待所有的经营问题。财会人员不仅要关注财务报告数据，还应结合宏观经济和行业形势，从更广阔的视野和更长远的角度来分析决策，使资源配置更加合理。此外，财会人员还应培养战略规划能力，财会工作应该围绕企业目标，服务于企业的战略。\n\
    \n### 4. 培养独立分析的能力和风险管理意识，完成企业流程优化\n只有通过对数据进行分析，了解数据背后的信息，才能转化为对企业有用的经营决策。财会人员要用会计专业思维分析和思考问题，充分利用财务专业知识对企业进行风险控制，通过分析财务数据，洞察企业可能存在的经营风险和财务风险。财会人员需要从业务的角度来探讨项目的可行性，并通过对项目的可行性进行事前评估，分析企业的业务发展趋势和相应的资源配置问题。在一些发展到一定规模和水平的企业中，业务非常复杂，审批流程非常烦琐。为了使企业中的审批流程更加顺畅便捷，管理需求与财务控制之间需要达到一个平衡。因为如果设定一个烦琐的审批流程，审批工作的效率会降低，但是如果审批过程过于简单，风险监控就可能会出现漏洞。这就要求财会人员自觉熟悉整个过程和状态，对各系统的关联性进行设计和优化，对风险进行预先评估和漏洞管理，实施有效的控制措施，提高审批系统的效率等，优化企业流程。\n\
    \n## （三）财会人员主动拓展职业发展类型\n\n### 1. 向投融资岗位转型\n企业发展过程中，往往涉及投融资相关业务，而财会人员是企业的核心人员，熟悉企业经营情况，对投融资拥有一定的建议权。财会人员可以从企业会计准则、证券金融、财务管理、内部控制、经济热点等方面入手，努力增强对宏观经济学、金融学、市场营销学等相关领域知识的研究，增强自己对投融资工作的理解，通过不懈的努力，使自己的投融资能力不断提高，由原来的会计专业人才向企业投融资管理型人才转变。\n\
    \n### 2. 向企业主转型\n财会人员在职业生涯规划与发展过程中，可以充分利用各种资源和平台学习与创业相关的知识，有意识地参加一些与目标行业相关的培训课程，了解目标行业的信息，不断为自己创业打下基础。培养自己良好的心理素质和心理承受能力，培养自己独立思考和独立行动的好习惯。充分认识自己的知识结构，制订适合自己的发展计划和目标，为实现目标而不断努力。\n\
    \n### 3. 向职业经理人转型\n财会人员在熟悉企业工作的前提下，可以利用业余时间参加 MBA 培训课程，充分学习管理学相关课程的内容并掌握与职位相关的工作技巧。学习心理学和管理学，拓宽财会人员的知识和技能。在工作中不断学习思考并掌握更多与会计相关的工作技巧，学会分析企业和整个行业的发展趋势，随时关注国家的宏观经济政策。不断提高英语水平，使自己的知识不断更新，在工作学习中快速成长。\n\
    \n### 4. 将财务专业知识与人工智能技术相结合，向人工智能的线下管理者转型\n在知识更新换代不断加快的时代，会计工作也处于不断变化的状态，因此财会人员不仅要掌握基本的理论知识，还需要通过多渠道学习新科技知识和技能，迎接人工智能带来的新挑战，学习和掌握人工智能相关技术，将财务专业知识与人工智能技术相结合，辅助人工智能系统开发和升级，更高效地履行财会人员的工作职能。\n\
    \n### 5. 尝试跨领域发展转型\n突破财会专业的局限，在掌握会计专业知识的基础上，接受跨专业的转型和学习，拓展职业发展空间。财会人员可以根据自己的兴趣爱好和工作经历选择从事销售、技术、人力资源等工作，通过不同专业之间的交流学习，增强财会人员对自己职业生涯发展方向的认知。\n\
    \n## （四）财会人员应加快打造自身软实力\n\n### 1. 加快成长为复合型人才\n人工智能背景下，企业财会人员面临的失业风险将会大大增加，工作流程的简化和工作强度的逐步降低使财会人员不得不主动参与企业经济事项决策，并为决策人员提供专业性的财务意见和建议。在税收筹划、投资方案拟定、内部控制、风险指引和防控措施制定、收入预测、投融资决策等方面依靠自身的专业知识，切实提升资本运作和资金管理水平，以专业财会人员的视角参与企业经济事项决策，加快成长为复合型人才就成了当前财会人员的现实所需，也是人工智能时代企业发展的必然选择。作为财会人员，不但要掌握更多的财经理论知识，而且要能够在实际操作过程中将理论与实践相结合，用理论指导实践，依靠分析提炼的财务数据，总结归纳和分析企业应当采取的财务管理措施、战略性业务拓展措施和会计核算政策。\n\
    \n### 2. 掌握必要的大数据管理和集权化财务管理知识\n在人工智能背景下，市场竞争将会更加激烈，企业主对所聘用的财会人员的要求将会一再提高，在会计核算尤其是账务处理全程自动化的基础上，财务分析与决策的精准化和智能化是企业发展的必然需求，这些都需要充分依托大数据分析。因此，财会人员需要掌握必要的大数据管理的相关知识，能够在庞杂的基础数据中分析提炼出企业发展所需的财务数据，进而制定出适合企业发展的财务政策。人工智能时代，传统的会计岗位将会大大缩减，企业财会人员将会更加集权，实现信息共享和财务会计处理规范化、标准化、便捷化。财会人员除了需要学好财务相关知识外，还要不断拓展自己的视野，为以后的职业生涯发展打下坚实的基础。努力提升自己综合运用知识的能力，重视人际关系的培养，发挥工作主动性和积极性，充分利用各种机会锻炼自己，积累丰富的工作经验。人工智能背景下，财会人员需要尽快转变工作理念，培养自己的全局观念，站在全局的角度，客观公正地看待所有的经营问题。培养独立分析的能力，只有通过对数据进行分析，了解数据背后的信息，才能将其转化为对企业有用的经营决策。将互联网和会计工作相结合，用会计专业思维分析和思考问题，主动分析经济形势，积极顺应社会发展形势，转变自身职能，提高自己的核心竞争力，不断提升自身素质。\n\
    \n企业需要参与到财会人员的职业生涯规划过程中，不断完善企业的人力资源管理相关制度，与财会人员建立良好的沟通渠道。加强对财会人员的职业指导和辅导，提高财会人员的工作效率。建立职业生涯管理体系、职业生涯管理保障体系，并对职业生涯管理体系实施过程进行管理。当今竞争日益激烈，企业更需要不断完善人力资源管理相关制度，重视财会人员的职业生涯规划。把财会人员个人的职业生涯规划作为企业战略发展的一个重要组成部分，协调个人职业目标和组织发展目标，使其共同发展，以形成更有凝聚力的企业合作伙伴关系，更有效地调动财会人员的工作积极性。从以人为本的角度出发，关注财会人员职业发展诉求，拓展其职业发展空间，满足其不同阶段的需求，使财会人员的岗位能力和价值贡献得到更好的发挥。指导财会人员全面系统地掌握专业管理知识，并积极扩大和培训运行管理、风险控制等相关业务，从理论知识、管理要点、协调实践等多个维度出发，提高财会人员对企业风险和经营业务的全面理解能力。\n\
