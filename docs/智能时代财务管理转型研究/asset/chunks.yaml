    首先，在营销及销售费用管理方面，重点关注的是销售资源投放和效果达成的关系，如果能够管理好每一笔销售费用的投入产出，那么销售费用的投入就能得到很好的财务回报。在这一方面，我们可以充分利用大数据在相关性分析方面的优势，基于大量的企业内部历史销售费用投放的数据，以及市场上与企业销售活动相关的各方面的反应数据，获得销售费用投放方案与市场反应之间的相关性分析结果，从而将优质资源向市场反应积极的销售活动方案倾斜。


    其次，在客户信用和风险管理方面，能够依托大数据技术更广泛地获取与客户相关的社会化数据，不再简单地依赖于客户公布的财务报告信息，而是将客户在社会化活动中所形成的广泛的数据纳入监控范围，基于广泛的客户行为信息、舆情信息，更及时、准确地评价客户信用，建立多视角、全方位的客户信用评价模型。


    最后，在竞争对手分析方面，大数据能够帮助企业建立更加及时、有效的舆情监控系统。基于网络新闻、微信、微博等多种社会化媒体，新的舆情监控系统可以从文字、图片、语言、视频等获得全方位的信息输入，从而更早地发现市场和竞争对手的重要动态，帮助企业及早决策应对。


