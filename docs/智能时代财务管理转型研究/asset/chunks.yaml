    ### 2.智能增强


    首先，在经营计划、预算编制过程中，智能化技术能够发挥重要作用。由于经营计划和预算编制是资源配置的过程，因此资源配置的方向、权重是否合理是预算编制结果能否发挥价值的重要评价标准。大数据分析能够帮助验证业务部门在资源投向上所讲故事的真实性，能够展开更为清晰的资源投向和业绩达成的相关性分析，从而使财务有能力对资源配置投向进行评价。


    其次，在预算预测的过程中，能够基于大数据、机器学习等方法构建更为复杂和完善的预测模型，能够展开大量复杂场景下的敏感性分析。这使预算预测的可靠性和对未来复杂不确定性的预判能力都能够得到更大的提升。而现在，让人更加期待的模拟技术正在出现，引入人工智能的虚拟商业生态系统能够让未来的预测建立在与真实社会相仿的现实模拟环境中。比如，在拟真的环境中投放广告，设置不同的预算投入，模拟用户的真实反映，评价预算的投入效果等都可以在未来的某天成为现实。


    在初级人工智能阶段，预算的执行与控制能够基于所植入的更加复杂的规则来进行。在机器学习下，预算的执行与控制模型或算法能够基于所设定的控制目标，由人工智能来进行持续的完善。而在传统模式下，由于人力所限，无论是对控制规则的设计还是对控制过程的管理都被约束在一定的范围内。基于机器学习的预算执行与控制将能够提供更丰富的控制逻辑，在不同的场景下选择差异化且更合适的控制机制，实现预算的柔性管控。


    ## 二、元数据和大数据


    传统的经营分析是建立在有约束的技术条件之下的，对财务人员的经营分析技术有着较高的要求，而即使信息系统能够提供支撑，在传统的财务信息化环境中，经营分析结果对业务的决策支持能力也始终存在局限性。


    ### （一）经营分析的概念框架


    #### 1.数据基础


    对于传统经营分析或者财务分析来说，数据是基础，经营分析人员通过各种渠道获取各种各样的数据来展开分析。如果企业中已经建立了数据仓库和数据集市，那么，恭喜这些经营分析的幸运儿们，在这样的地基上盖房子还是比较靠谱的。而如果数据分散在大量独立的系统中，甚至是各层级、各类人员的Excel表中，那么就要小心了，你可能在用沙子打地基，盖起来的房子就可想而知了。


    在经营分析体系中，要构建一个好的数据地基需要企业对数据仓库、数据集市有清晰的规划和设计，对数据的定义、标准、来源和采集有清晰的业务逻辑。当然，数据仓库和数据集市都是数据的载体，要想避免数据垃圾的产生，系统本身的数据质量需要有所保障，而这种数据质量的保障能力来自前端业务流程和信息系统的有效搭建与管理。


    站在财务的角度，还必须要提到三套数据，它们是经营分析的重要数据基础。一套来自事前，我们称之为“预算”；一套来自发生后的记载，我们称之为“核算”；还有一套来自事后的深加工，我们称之为“管理会计”。将这三套数据与经营分析进行有效对接，对于提升经营分析质量有很大的帮助。


    #### 2.指标体系


    在经营分析框架中，指标体系就是房子的砖和瓦。那么，什么是指标呢？指标是一种衡量目标的单位或方法。当我们进行经营分析的时候，会围绕企业经营目标来设定一些衡量标准，通过这些衡量标准能够评价经营结果是否达到了所设定的目标，从而帮助我们进一步提升企业经营管理能力，这就是经营指标。


    对于经营指标来说，美国的关键绩效指标权威专家戴维·帕门特将它进一步划分为“成果指标”和“绩效指标”。引入“成果指标”的概念，是因为许多评价指标是几个团队输入成果的总和。这些指标在衡量各个团队共同的工作效果时很有用，但不能帮助管理层准确地定位和解决问题，管理层很难准确地查明哪个团队出了成绩，哪个团队未履行职责。而绩效指标能够解决这个问题，并能更加精准地定位问题。例如，一个没有进行多维度切分的利润指标在其看来就是典型的成果指标，并没有反映为利润作出贡献的各个团队的绩效情况[\[1\]](#txt006.xhtml#footnote_content_txt006_1)。而在实践中，我们似乎很少进行这样的区分，往往笼统地使用关键绩效指标来进行指标体系的搭建。对于一个指标体系来说，可以引入“基础指标”和“衍生指标”的概念。基础指标是难以拆分和细分的指标，而衍生指标则是基础指标的运算组合。使用这样的概念，通过优先搭建和系统化基础指标体系，再扩展衍生指标体系，能够帮助我们快速地搭建一个复杂的指标体系。


    此外，对于指标，通常会使用“指标树”的形态来进行展示。这也是构建指标之间逻辑的一种方式。我们还需要了解指标“名称”“维度”及“值”的含义，这些在后面元数据的概念中再进一步解释。


    #### 3.报表展示


    当构建好经营分析的指标体系之后，就可以搭建房子的主体了，而要使这些指标对经营发生作用，仅仅是盖个毛坯房是不够的，还需要进行精装修。这个装修的过程，我们可以理解为报表构建和展示的过程。好的装修要让业主住得舒服，好的报表展示，要让管理者能够清晰、快速地抓住重点，发现问题和解决问题。


    实际上，报表就是将各种指标的不同层级维度交叉组合起来进行应用的产物。因此，在搭建报表体系的时候，我们要先搞清楚业主，也就是经营管理者到底需要看到什么。在明确需求后，选取能够说明问题的指标，并匹配和管理对象相关的维度信息后进行组合展示。此外，在报表的指标组合中，我们还需要经常用到使用说明来解释指标，通过这样的方式搭建报表是靠谱的。笔者也见过不少不靠谱的经营分析报表，搭建的时候完全没有指标和维度的概念，也没有关注管理者的需求，这样出来的报表如果有充分的经验支持，可能还具有一定的价值，否则往往带来的则是信息垃圾。


    有了报表以后，经营分析报告也就容易出具了。但必须要注意的是，简单罗列报表的报告是初级水平的报告，能够看透数字的表象，深入数字背后分析深层次的问题，才是有附加价值的报告。


    #### 4.维护机制


    当我们把整个房子都收拾好了之后，还需要有一个靠谱的物业。经营分析这个房子的管理和维护并不是那么简单、容易的，无论是数据、指标的维护，还是报告的过程和归档管理，都需要有一套相对可靠的机制。


    在通常情况下，企业会有经营分析部门，这个部门既有战略的味道，又有财务的意思。因此，在不同公司，这个部门的归属也并不相同，甚至还有不少发生过变迁。而在经营分析部门中，要建立起这样一套维护机制，首先需要有数据维护和管理团队来解决地基的问题，然后需要有指标管理团队来进行指标的日常增删改的维护，还需要有报表团队来进行常规报表和临时报表的编制及发布，最后还需要有绩效管理团队来深入展开经营分析，并进行绩效的考核管理。在整个过程中，无论是组织、人员、流程、制度还是系统都是不可或缺的，这些共同构成了这套体系的维护机制。


    当具备了以上这些条件后，经营分析框架就能够构建起来了。实际上，今天很多从事分析工作的朋友尚未在认知上构建起这一套框架体系，这对于提升经营分析和决策支持能力会带来局限和束缚。下面我们还要在这套可以称之为既传统又主流的经营分析框架的基础上，进一步深挖经营分析的本质和未来，即元数据和大数据。


    ### （二）元数据经营分析的本质


    从定义上说，元数据可以理解为“数据的数据”。实际上，应用元数据的场景非常多，如图书馆的藏书信息卡、在线视频应用里的视频描述、网络中的网页地址等都可以用元数据来表达。元数据具有以下特点。


    首先，元数据是结构化的。如何理解呢？其实在大数据时代，人们都非常热衷于谈论非结构化数据，但忽视了这些非结构化数据在技术层面是怎样被应用起来的。如我们容易理解的，一张图片是非结构化数据，但这张图片是可以被元数据这种结构化数据所描述的，这就给我们借助元数据来理解和应用非结构化数据提供了可能。


    其次，元数据是与对象相关的数据。如以一张照片作为对象，那么描述这张照片的元数据与该照片具有相关性，但需要注意，潜在的用户不必先完整地认识对象的存在和特征，也就是说，可以使用盲人摸象的方式，借助元数据慢慢去了解对象。就像一张照片，我们可能第一次获得的元数据是EXIF信息，即从摄影的角度获取这张照片的信息，进一步我们可以了解与这张照片内容相关的其他元数据，从而从另一个角度获取照片信息。


    此外，元数据不仅能够对信息对象进行描述，还能够描述资源的使用环境、管理、加工、保存、使用等方面的信息。还以照片为例，元数据可以告诉我们这是一张网络图片，存储在什么样的服务器上等信息。


    最后，元数据常规定义中的“数据”是表示事务性质的符号，是进行各种统计、计算、科学研究、技术设计所依据的数值，或者说是数字化、公式化、代码化、图表化的信息。当然，我们也可以将文字理解为某种形式的编码数字。


    经营分析和元数据是关键。首先，我们可以看到，构成经营分析的地基是数据，而元数据作为数据的数据，能够用结构化的方法帮助我们描述和标准化基础数据。构建数据仓库过程中的数据字典，从某种意义上讲就是元数据。清晰的数据字典，能够让我们更加有效地管理数据仓库，而从经营分析管理需求的角度来说，我们希望所有进入经营分析体系的数据都能够使用元数据进行充分的结构化描述。


    其次，在砖瓦的层次——指标体系上，元数据也发挥着重要作用。如我们前面所说的，指标的结果最终会反映在数值上，针对这个数值我们用指标名称、编码、指标的维度、维度值等对这个数值（即数据）进行了描述，这种描述就是元数据。因此，我们认识到，指标体系是在经营分析层次中架构在基础数据之上的第二类重要的元数据。


    最后，我们再回到经营分析的中心点—经营活动上。我们为什么要做经营分析呢？实际上是要对经营活动展开多种视角的评价，评价的标准是经营活动是否达到了我们在开展经营活动之初所设定的目标，而KPI正是我们多视角评价经营活动的结构化描述，也可以理解为经营活动评价的元数据。


    ### （三）大数据与经营分析


    在传统的经营分析模式下，我们需要找到用于评价经营活动的元数据，也就是指标体系与经营结果之间的关系。通常情况下，如果我们看到指标与经营结果具有显著的因果关系，那么就会把这样的指标考虑纳入关键绩效指标（KPI）中来进行管理。但问题在于，这些指标的定义和发现往往是基于经营分析及因果分析所得到的，这种逻辑上的强绑定关系具有一定的局限性。


    实际上，影响经营分析结果的不仅仅是存在显著的可见因果关系的因素，还存在相关但无法解释显著因果关系的因素，这在传统模式下是难以解决的。


    大数据的出现，让我们有可能打破思维能力的约束。基于大数据技术，我们能够从因果关系突破到相关关系。通过大数据分析，我们能够发现一些没有显著因果关系的因素同样对经营活动产生了显著影响，这些因素被称之为“相关性因素”。将这些因素定义为关键绩效指标，能够帮助我们实现提升经营活动成果的目的。


    指标用于评价经营活动，同时有非因果关系的因素在影响这些指标，这又构成了第二层次的相关关系。我们发现原先所搭建的经营分析的元数据世界发生了延展，各个层级的元数据都有一些非因果关系，而相关的新元数据的出现，使我们能够更加真实地架构经营分析框架，并有效指导经营结果的改善。


    当然，在技术层面上，财务人无须思考元数据和大数据该如何结合的问题，这样的烧脑问题还是交给工程师来解决吧！


    ## 三、大数据资源配置


    在战略财务的框架下，全面预算管理一直是不容忽视的范畴，但其在企业经营管理中所发挥的作用却饱受争议。


    ### （一）预算管理就是资源配置


    预算实际上是一种对企业资源的配置方式。当股东设定了经营目标后，业务单位要达成这些经营目标就需要匹配相应的资源。如果从契约的角度来看，把预算作为一种契约，那么一方是企业的股东，另一方是企业的经营者。资源本质上属于股东，业务单位作为经营者向股东承诺经营目标，股东向经营单位承诺支持其实现经营目标所需要的资源。当然，当经营目标达成后，还有相应的绩效激励，这又是另一层次的契约关系。


    因此，在企业进行预算管理的过程中，预算编制的核心是提出股东和经营单位都能够接受的资源配置方案，也就是在经营目标承诺和资源承诺上找到平衡。


    那么，预算要考虑哪些资源分配的问题呢？企业经营无外乎人、财、物三件事情，资源配置也可以理解为人力配置、财务配置和资产配置。合理地配置人力、财务及资产资源，是企业战略目标得以实现的重要保障。


    ### （二）资源配置的难题


    #### 1.契约双方的信任问题


    和所有的契约关系相似，资源配置同样要解决资源所有者和资源使用者之间的信任问题。资源所有者追求的是资源投入产出结果的最大化。因此，在投入资源时会高度关注产出的结果，并要求获得资源接收方的绩效承诺。同样，对于资源使用者来说，也需要在承诺绩效目标后获得必要且及时到位的资源支持，避免在资源不足的情况下进行经营，最后为不良绩效结果担责。当然，对于资源所有者来说，最常见的还是担心经营单位存在道德风险，比如经营者是否会通过虚构经营目标或过度承诺以获取资源满足其短期利益目标等。


    #### 2.资源配置的标准问题


    应该采用怎样的标准来进行资源配置呢？在实际的预算过程中，资源配置标准的形成并不容易，太多的因素会挑战所设定的标准。而一旦无法形成相对清晰的标准，资源配置的过程往往就会成为一个谈判的过程，很容易陷入缺少逻辑的拉锯战中。


    简单的标准可以根据承诺（目标），基于比例模型直接给出资源承诺；复杂的标准则需要明确经营目标达成的各项驱动因素，并为每项因素细分动因，并最终从经营计划的角度来设立资源配置标准。


    #### 3.资源配置的效率问题


    资源配置的效率一直是企业预算管理活动中很头疼的一件事情。在预算的全过程中存在太多的博弈。很多公司从九、十月份开始启动预算编制工作，直到来年的三、四月份才能完成预算的定稿。在月度的资源配置活动中，如果缺乏高效的系统支持，很多公司根本难以做到精细化的月度资源配置管理。在这种情况下，月度预算往往成为年度预算下简单的“按月分解”。


    #### 4.资源配置的效果检验问题


    当完成资源配置后，就会从讨价还价的博弈循环进入承诺兑现的博弈循环。在这个过程中，对于管理者来说，最困难的是如何验证资源投放的效果和达成情况。尽管我们说最终的经营绩效指标能够反映出经营单位的绩效达成情况，但在过程中基于任务、项目等设立的资源配置标准往往很难立刻通过财务或数字验证其实现的效果，而此时又经常需要启动基于此次项目任务进一步延展的后续资源投入，这对管理者来说需要面对是否去进行“前款未清，借后款”的管理决策。


    ### （三）大数据资源配置：抓热点，抓相关性


    在契约双方的信任关系方面，一些公司试图通过签订绩效承诺书来保障契约关系；在资源配置标准方面，一些公司通过设定模型的方法来总结提炼预算标准；在资源配置效率方面，一些公司通过建立预算编制系统来优化编制流程；在效果检验方面，一些公司选择刚性的“以收定支”。但我们也不得不认识到，在传统方式下对资源配置管理的优化终将达到瓶颈。要实现突破，需要找到新的契机，而大数据恰恰在这一方面带来了新的机会。


    #### 1.热点驱动资源投放


    所谓的热点驱动就是在保持经营目标相关性的前提下，哪里吸引眼球，哪里有热度，哪里需要资源，我们就将资源投放在哪里。但在传统财务模式下要做到这一点是非常困难的，如果仅仅凭借我们对市场的经验感知是很难在经营活动中进行管理决策的，而大数据技术为解决这一问题提供了新的可能。


    ##### （1）制定经营战略


    首先，和传统的预算编制模式一致，在编制预算之前，必须明确企业的战略导向，这从根本上决定了要不要投放资源、在哪里投放资源和怎么投放资源。当然，在这个层面上，战略很可能是相对宏观的，它更多的是未来一段时间内大的经营方向和经营策略，我们无法直接基于公司的战略来展开更为清晰的预算，也就是资源配置工作。


    ##### （2）分析战略热点


    如果要想更好地衔接战略与资源配置，就必须更清晰和细化地拆解战略，也就是形成战略热点。当然，这里所说的热点和后面要谈到的基于大数据分析的热点是有所不同的，还需要依靠企业的管理经营者对企业所设定的战略目标进行细分，从管理逻辑层面定位战略在落地时需要重点关注的目标。例如，企业将智能化发展作为核心战略时，需要在技术、产品、客户、渠道等多个方面来发现其战略热点，如在产品方面定位为无人驾驶技术，在客户方面定位为女性出行者，在渠道方面定位为自营门店等，这些热点将为后续的资源配置起到一个大方向的支撑作用。


    ##### （3）基于大数据发现经营热点


    在有了战略热点后，我们仍无法有效地从管理角度进行资源配置。实际上，经营单元在战略热点明确后，就已经对需要做什么、大概需要多少资源有了一个初步的概念。很多时候，经营者就会基于这样的一个概念开始和管理层讲故事了。在传统模式下，我们通常对这样的故事只能选择“信”或“不信”。当然，如果故事中间的逻辑线索相对清晰，可能更容易获得管理者的信任，并获得资源，而如果在这个时候引入大数据分析，则可能会对传统的资源配置模式有所改变。


    在被动模型下，需要经营单元基于战略热点进行经营热点的主动设计，模型要做的事情是基于企业内外部大数据，对经营热点与战略热点的关联热度进行分析。在主动模型下，以战略热点为出发点，基于内外部大数据，发现与战略热点分层次的关联市场热点，将关联度高的市场热点纳入经营热点中，也作为资源配置的对象。


    ##### （4）基于经营热点进行资源投放


    通过这样主动与被动的热点分析，我们能够建立起以战略热点为圆心的经营热点辐射地图，并以这个地图的辐射半径为标尺展开资源配置，接近圆心的经营热点需要投放更多的资源。在具体确定资源投放额时，我们可以以战略热点构建资源池，将资源首先投放到战略热点资源池中；以经营热点为项目，向战略资源池申请资源。在资源申请的审批过程中，我们可以引入热度评估，优先将资源投放到高热度的项目中，从而避免发生先到先得、抢资源的情况。

