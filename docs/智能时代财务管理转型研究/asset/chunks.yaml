    ## 一、智能时代的进退抉择


    “进”是一种拥抱变革的态度，虽然意识到智能时代会带来空前的挑战，但总有一些人愿意成为这场变革中的主导者和生力军，并在这场智能时代的变革中迎接挑战。


    “退”是一种远离风险的态度，可能也是一种聪明的选择。如果知道自己没有办法成为“进”的那一群人，也意识到智能时代可能会促使现在的工作内容发生改变，那么明智之举就是及早远离现在的岗位，重新规划自己的未来，找到智能时代的避风港。


    “守”是一种以静制动的态度，在难以作出清晰判断的时候，静观其变，并在坚守中慢慢寻找自身定位。但需要注意的是，在智能时代社会快速变化的大环境下，静守未必是好的选择，即使选择观望，也应当及早作出适合自己的关于进退的选择。


    如果财务人员终究要在智能时代作出“进”或“退”的选择，那么影响选择的决策因素又有哪些呢？我们从以下四个方面来探讨这个问题。


    ### （一）人工智能对其所处行业及公司的影响


    在进行“进”或“退”的评估时，需要关注的是财务人员所处的行业及行业内的公司在智能时代将受到怎样的影响。我们说过，智能时代是一场巨变，在这场巨变中，有些行业和公司会兴起，而有些行业和公司会走向衰退。财务人员的职业发展本就依托于其所在公司的发展，当我们在谈论智能时代进退策略时，第一件事就是对自己所在公司的未来作出判断。行业兴、公司兴，则财务兴。什么样的公司在智能时代会兴起？想要知道这个问题的答案，不妨去读读这方面的畅销书，如吴军的《智能时代》、李彦宏的《智能革命》及李开复的《人工智能》。


    ### （二）人工智能对其所在环境竞争性的影响


    人工智能的出现会改变我们所在环境的竞争格局。对于有些公司来说，智能时代的到来有可能会让整个公司内部的竞争环境变得非常宽松。大家的焦点都在如何进行有效的合作上，并积极参与到智能时代的市场开拓中。公司的每一个员工都会感受到其存在的价值，自然有一个宽松的竞争环境。在这种情况下，财务人员可以考虑采用“进”的策略。而对于另一些公司来说，在智能时代将面临强大的压力，需要通过压缩成本、强化内部竞争来获得生存空间。在这样的环境中，如果不愿意忍受环境中激烈的竞争，则不妨采取“退”的策略。


    ### （三）个人能力与智能时代要求的适合性


    智能时代对财务人员的技能需求也发生了改变。智能时代的财务技能需求相比于传统需求有较大变化，如信息技术能力、建模能力、创新能力的提升等。如果财务人员期望在对智能技术大力推崇且形成了趋势性文化环境的公司内获得成功，就要对自己的存量能力和增量学习能力作出客观的评估，不能做到，则可以采取“退”的策略。


    ### （四）个人对人工智能风险和挑战的喜好


    智能时代的财务择业与当下相比会有更多的不确定性。技术的不确定性带来商业模式的不确定性，进而带来企业和行业的不确定性，而不确定性正是风险的内涵。在这样一个充满风险和挑战的时代，财务人员选择“拥抱”还是“远离”，在很大程度上和每个人对风险和挑战的喜好有关系。并不是说喜好风险和挑战就一定是好事情，如同投资决策中的风险厌恶程度，喜好就是喜好，并不存在道义上的对错。


    当结合上面几个因素进行综合评估后，或许财务人员能够对自己在智能时代的“进”和“退”作出大致的判断和选择。


    ## 二、智能时代，财务人择业的“拥抱”模型和“远离”模型


    如笔者在上文中所说的，财务人员在智能时代的“进”或“退”并没有对错之分，重要的是在决定了“拥抱”或“远离”后，能知道如何进行下一步的职业选择。这就是笔者在这里要谈的财务人员择业的“拥抱”模型和“远离”模型，如图
    3-2 所示。


    ![img](img/txt003_2.jpg)


    图 3-2　财务人员择业的“拥抱”模型和“远离”模型


    在这个模型中，我们从六个维度对择业目标进行简单分析。


    ### （一）关于评估维度


    #### 1. 平台


    对于平台这个维度，我们要评估的是择业对象是一个大型企业集团，还是中小型公司或创业公司。不同规模的公司能够创造的应用智能技术的机会和概率是不同的，公司规模越大，应用智能技术的可能性就越大，这是一个简单的逻辑。


    #### 2. 技术实力


    在这个维度下，我们主要看一家公司在大数据、人工智能、云计算等方面是否具有技术能力方面的显著优势。具备技术能力的公司可能有两种，一种是使用这些技术来支持自身的主业发展的大公司；另一种是以这些技术为核心的中小型公司或创业公司。总体来说，技术实力越强，在财务领域应用智能技术的可能性就越大。


    #### 3. 行业


    这里所说的行业关注的并不是行业在当前是否兴盛，更多的是要关注行业是否能够从智能革命的浪潮中获得业务发展的技术红利。一个能够获得技术红利的行业必将非常积极主动地应用智能技术。


    #### 4. 财务交易规模


    为什么不看公司业务规模呢？对于财务来说，规模巨大的公司未必一定有大量的财务交易。而要判断智能技术在财务中的应用的概率，财务交易规模的大小和财务数据量的多少才是至关重要的。


    #### 5. 待遇


    待遇，就是付给员工的薪酬。在择业模型中什么都可以不谈，但待遇是必须要谈的。但是在这里，只需简单地将待遇划分为高、中、低三个等级，在这两个模型中我们要看的是最低容忍度。


    #### 6. 未来发展机会


    未来的机会就是现在的福利，对于择业者来说，要考虑的是现在的工作能够帮助自己未来进入怎样的公司、平台。如果和自己的职业规划是一致的，那么就可以作为择业模型的加分项；否则，将成为扣分项。


    ### （二）拥抱模型下的选择


    在拥抱模型下，我们对以上这些维度应当作出怎样的选择或考虑呢？


    对于平台，选择大型企业集团，在财务实践中有更多的接触智能技术的机会。


    对于技术实力，选择具有技术优势的公司，能够享受到技术红利，有利于财务在使用较低成本的情况下展开智能应用实践，也使财务智能化应用有了更早实现的可能。此外，智能技术还可以与平台形成合力，进一步推动智能技术在财务中的使用。


    对于行业，选择进入金融、零售、通信运营等高度需要智能技术的行业，有可能更快地接触到智能技术。同时，这些行业对智能技术具有更好的认同度，能够营造出良好的创新氛围和环境。


    对于财务交易规模，选择有大规模财务交易的行业是更好的选择。智能实践是建立在领先的数据技术之上的，没有财务的大数据，何谈智能化？


    对于待遇问题，如果选择拥抱智能，也许要作出一些牺牲。较好的情况是能够获得中等待遇，如果能够获得高待遇当然更好，但是最重要的是，即使待遇偏低，我们也不妨考虑一下综合收益，即虽然在短期内待遇偏低，但有可能在未来的成长中获得快速弥补。在职业发展上，笔者一直坚信长线利益重于短期利益。


    在未来的发展中，如果选择拥抱智能，将有机会进入更大的公司，或者为自行创业积累一笔宝贵的经验和财富。当然，年轻人有这样的经历，进入咨询行业也是一种不错的选择。


    ### （三）远离模型下的选择


    在远离模型下，我们对以上这些维度又该如何选择呢？


    在平台方面，核心诉求是规避智能技术造成的职业风险。因此，选择中小型公司有更多的规避智能风险的机会，这些公司轻易不会使用价格昂贵的智能技术。


    从技术实力来看，需要小心的是以智能技术作为主业的中小型公司或创业公司，他们不会放过任何拿自己人做智能实验的机会，财务不小心就会成为那只“小白鼠”。


    对于行业，要绕开拥抱模型下的那些优选公司，如金融、零售。选择传统行业，则相对安全一些。


    就财务交易规模而言，规模一定要小。在这种情况下，老板想的是如何用人工去解决问题，而不是使用机器来替代人。


    在待遇方面，作为择业的财务人员，应当积极寻求中等收入职位，高收入职位就要看运气，如果是太低收入的职位，建议果断放弃，毕竟出来是避险的，不是出来降薪砸自己饭碗的。当然，能力不足则另说了。


    未来的发展很可能是在相近规模的公司里打转，建议选择小而全的公司，一旦遇上创业潜力不错、有机会爆发成长并成功上市的公司，或许就实现财务自由了。


    至此，读者应该已经掌握了智能时代进退自如的秘技。虽然技术在进步，社会在进步，但财务人员仍然能够找到适合自己的定位。


    ## 第四节 智能时代财会人员职业再规划发展策略


    按照目前的财务人工智能发展状况，可以推测出以下几个发展趋势：首先，财务、审计等基础的比较简单的工作将会被取代，因此这方面的工作人员会大量减少。其次，中层财务岗位的部分数据报告工作将会被替代。但是，财务管理工作中关键和核心的工作内容逻辑判断较复杂，仍需要由专业的财会人员来判断和决策[\[6\]](#txt003.xhtml#footnote_content_txt003_6)。财务人工智能的发展目前主要会对企业初级和中级岗位的财会人员造成一定的冲击，本节重点针对该部分财会人员进行分析研究，深入阐述人工智能背景下财会人员的职业再规划及职业发展策略。


    ### 一、财会人员职业再规划与发展策略分析


    #### （一）基层财会人员职业再规划与发展策略分析


    小刘是一家科技公司的会计信息系统实施“专家”，主要负责财务信息系统的维护和开发。小刘刚入职时是财务助理，深知财务人工智能对其工作的影响。因此，小刘一直思索自己未来的职业生涯发展路径。在人工智能迅速发展的外部环境下，传统的职业发展路径已经越来越窄，而且竞争也越来越激烈。人工智能对财务岗位的替代具有必然性和渐进性，从基础核算财务岗到中层财务岗都会受到人工智能的冲击。小刘通过自我分析，制定职业发展目标和具体实施方案。经过慎重考虑，小刘决定转型做一名人工智能系统的线下实施者。小刘在大学四年期间学习了会计学，拥有较好的会计基础，在校期间同时兼修了计算机专业，拥有较好的计算机基础。他经常利用业余时间对企业信息化系统建设及维护进行研究，同时还研究学习了人工智能系统开发相关内容。小刘现在是企业财务信息系统的辅助实施和管理者，辅助计算机系统正常运行。在工作过程中，小刘不但积累了与财务相关的工作经验，而且对计算机系统应用也变得更加熟悉。通过对小刘职业生涯再规划与发展路径进行分析，发现小刘职业转型面临以下问题：


    第一，岗位职责低且技术含量不高。小刘作为财务助理，主要负责企业原始凭证的登记、整理、粘贴，记账凭证的登记整理及打印装订，以及其他需要外出办理的工商及税务相关事项，处理的事务烦琐且没有技术含量。


    第二，工作范围比较窄，缺少全面分析的能力。小刘的工作重心主要聚焦在企业内部费用报销上，负责员工费用报销、单据整理及报销款支付等工作内容，接触不到与企业整体业务相关的工作，全面分析能力差。


    第三，对企业经营业务不了解。小刘平时把注意力主要放在财务数据上，未完全参与到企业的生产经营过程中，不能对企业经营业务进行全面的了解，对企业生产经营的产品、生产流程及业务流程不熟悉。


    第四，沟通协调能力较弱。小刘平时只关注财务数据及单据，很少与其他部门人员进行沟通，因此他的沟通协调能力相对比较弱。


    小刘进行职业生涯再规划与发展，调整自己工作内容后的情况：


    第一，岗位工作内容与互联网人工智能相关，工作岗位的技术含量增大，承担的责任增加，为小刘提供了很好的发展平台。


    第二，更多关注企业整体数据。小刘参与企业财务信息系统建设过程中接触到企业内部整体的数据信息，可以从全局的角度分析企业的财务信息，对企业整体经营情况有了一定的认识。小刘通过运用财务信息系统将数据信息进行收集整合，为管理者提供具有科学性和系统性的分析报告。


    第三，参与企业业务流程。小刘在建设企业财务信息系统过程中，涉及生产、销售、采购、人事、财务等多个部门的信息管理，在系统设立过程中既要保证审批程序简便，又要保证风险在可控范围内。在建设信息系统过程中，小刘不断研究生产和业务部门的工作流程，对企业的生产运营非常熟悉。


    第四，沟通协调能力得到提升。通过建设企业信息系统，小刘需要与不同部门的领导和同事进行反复的沟通协调，其沟通能力、协作能力、工作能力等都得到了很大的提升。


    小刘职业生涯再规划与发展前后对照情况，如表 3-1 所示。


    表 3-1　小刘职业生涯再规划与发展前后对照表


    ![img](img/txt003_3.jpg)


    对小刘职业生涯再规划与发展策略分析：


    小刘作为企业财务信息系统维护负责人具有良好的专业技能。他具有良好的财务教育背景和扎实的计算机基础，对信息系统有浓厚的兴趣。小刘还利用业余时间参加了人工智能系统开发的培训课程，自己研读与互联网和人工智能相关的书籍。这些是小刘可以做好企业财务信息系统维护人员的基础。小刘还具有良好的沟通协调能力，在建立和维护企业信息系统过程中需要和企业各个部门领导及员工沟通交流，反馈信息。在系统实施过程中难免遇到阻力和困难，面对压力，小刘主动调节自己，保持正确的态度和良好的心态，全方位提升人际交往能力。财务人工智能程序需要后期不断维护更新，财务信息化系统和财务机器人的开发、应用和维护均依靠财会人员和计算机开发人员之间的沟通协调。因此，财会人员和人工智能机器科学研究人员可以相互取长补短，发挥财会人员在会计行业的特殊优势，与科学研究人员相配合，在财务人工智能程序化，计算机软硬件的研发、维护和升级上发挥重要的作用[\[7\]](#txt003.xhtml#footnote_content_txt003_7)。随着会计信息化系统的持续发展，财务机器人的开发、管理和维护，将催生兼备财务知识、计算机编程能力、机器人维护能力的复合型人才需求。


    #### （二）中层财会人员职业再规划与发展策略分析


    孙女士是某外企财务主管，属于企业的中级财会人员。面对人工智能的发展，孙女士作为一名财会人员，深知财务人工智能对其工作的影响。她通过对企业的财务制度及岗位现状进行分析，为自己的职业生涯再规划与发展做准备。孙女士不断完善自己的知识结构，注重团队合作意识的培养，在工作中不断提高自己的综合管理能力。


    孙女士利用业余时间参加了 MBA 进修班的学习，精读企业管理和心理学相关书籍。她还参加了英语培训课程，在日常工作和生活中也不断练习，努力提高运用英语的能力。她非常注重提高自己与他人沟通协调的能力，培养管理能力和大局观念，提高自身的综合素质。孙女士具有良好的理解沟通和协调能力，较强的英语口语能力，熟练的财务专业技能和管理能力。她不仅熟悉中国相关法律，还熟悉西方财务法律法规。通过对孙女士职业生涯再规划与发展路径进行分析，发现孙女士职业转型面临以下问题：


    第一，岗位职责比较单一。孙女士作为企业的财务主管，主要从事财务数据整理和分析工作，岗位职责相对比较单一。


    第二，注重传统职责而缺少决策参与权。孙女士的工作重心主要放在传统财务管理上，很少涉及与制定企业战略紧密相关的税收筹划、风险控制、筹集资金、财务战略、投资业务等事务。


    第三，与业务之间缺乏互动。孙女士把注意力完全放在财务数据上，未完全参与到企业的生产经营过程中。


    第四，沟通协调能力较弱。孙女士最关注的就是财务数据，但因过度关注数字，使其在一定程度上缺少和其他人员沟通协调的技能。由于缺乏必要的沟通和协调，财务数据在企业快速发展时期已不能科学合理地反映企业价值。


    孙女士进行职业生涯再规划与发展，调整自己工作内容后的情况：


    第一，更多关注企业战略。孙女士通过转换财务管理思想，理顺财务管理目标，将财务管理的重点锁定在提升业务服务能力上，财务管理能力得到了全面提升，提高了财务参与制定企业战略的能力。


    第二，以管理者的视角分析企业战略发展趋势。孙女士通过改变原有的工作模式，站在管理者的角度对企业情况进行分析，制定了企业财务战略。建立了企业风险控制系统，该系统包括信息系统、资金管理系统及绩效考评系统等。


    第三，工作内容与企业发展战略变得更加密切。为适应企业快速发展的政策要求，孙女士通过及时转变战略思想，制定了以投资、筹资和风险控制为核心内容的财务战略来支持企业业务的发展。


    第四，从“管理控制”向“决策支持”转变，孙女士从一名控制数据的财务主管，向为企业决策提供支持的财务主管转型。财务战略转型使孙女士成为业务的最佳合作伙伴，参与企业决策。


    第五，沟通协调能力得到提升。通过进行职业再规划与发展设计，孙女士的沟通和协调能力得到了很大提升。同时，在孙女士的影响下，财务部门全体成员的整体素质也有了大幅提高。孙女士的领导能力和控制能力也不断增强。


    孙女士职业生涯再规划与发展前后对照情况，如表 3-2 所示。


    表 3-2　孙女士职业生涯再规划与发展前后对照表


