- raw: "智能时代如何减少简单作业的事情，我们会在后续智能时代如何影响财务的新技术的章节中再讲。在这里，我们要谈一谈如何通过组织设计来增强财务复杂设计能力的问题。而在智能时代，增强财务复杂设计能力的核心在于财务智能化团队的建立，这也是我们在这里要谈论的主题。\n\
    \n（一）财务智能化团队的定义\n\n首先，要对财务智能化团队做一个定义。为什么用“团队”这个词，而不是“部门”之类的呢？从笔者的角度来说，更希望这样的一个组织是基于柔性理念设置的，能够具有敏捷快速的响应能力，具备更加高效的资源组织能力、创新、协作能力等，所以用“团队”而不是“部门”能够更加贴近笔者所期待的能力需求。\n\
    \n在财务智能化的定义中，对智能化的概念会有不同的理解。如图5-10所示，第一种理解是用智能工具来武装自己，使组织的工作效能得以提升。第二种理解是组织中的工作被人工智能所替代，整个组织的工作内容已经没有人的干预，组织成为智能作业组织。第三种理解是需要一个组织，能够基于智能化的理念，帮助其他组织达到前面两种理解的目的，即智能化团队是用来帮助他人实现智能辅助工作或推动机器替代人工的。这里我们所谈论的是第三种理解下的智能化团队的概念。\n\
    \n![img](images/txt005_12.jpg)\n\n图5-10　财务对智能化的三种理解\n\n笔者给智能化团队加上“财务”限定词，是为了说明这个团队的服务对象是财务领域，而非其他领域，同时财务智能化团队的组织设置也在财务组织内部。\n\
    \n基于以上理解，我们就能够给财务智能化团队下一个定义：财务智能化团队是在企业财务组织内部，基于智能化理念、人工智能理论和方法及创新思维，推动财务组织中其他职能使用智能化工具提高效率、质量或者用人工智能取代人工作业的组织。\n\
    \n（二）财务智能化团队员工画像\n\n在有了定义后，下一个问题是：财务智能化团队的成员需要有怎样的素质特征呢？从定义来看，这个团队生来就和其他团队不一样，担负着武装群众或者解放群众的历史重任。因此，这样的团队必须要具备一些独特性。\n\
    \n1.游走在财务与科技之间\n\n对于财务智能化团队来说，需要具备复合的知识体系。一方面，需要具有丰富的财务管理知识，具备管理者的战略视角，能够从全局对财务管理的工作模式和业务流程作出深入思考；另一方面，需要对智能化技术有充分的认识，清晰地认识到智能技术能够做到什么，以及如何与财务管理的场景相结合。同时，类似于现在财务信息化团队中业务需求分析人员的工作，财务智能化团队同样需要具备将业务需求转换为智能化技术实现方案的能力。\n\
    \n2.创新是一种本能\n\n由于智能时代新技术层出不穷，如何将这些新技术与财务管理的场景进行关联成为关键问题。很多时候，人们知道新技术是什么，也知道财务管理在做什么，但就是说不清楚新技术能够帮助财务管理做到什么。就像云计算、大数据、区块链等，太多的人在讲它们有多么好，但就是很难讲清楚财务可以用它们来干什么。这个问题的背后缺少的就是创新。因此，对于财务智能化团队来说，创新要成为其工作和生活中融入的本能。只有这样，才能够敏锐地洞察智能时代财务创新的机会。\n\
    \n3.胆大心细能推动\n\n对于财务智能化团队来说，在未来相当长的一段时间内，都将致力于改变现在财务管理的固化习惯。无论是让人们接受新的技术工具，还是让人工智能替代人工作业，这背后都需要强大的魄力和推动力。财务智能化团队的成员需要胆大心细，敢于挑战权威和惯性，同时需要懂得沟通协调的艺术，能够在变革的过程中获得各利益相关方的认可，从而形成推动力。\n\
    \n4.人少精干有柔情\n\n财务智能化团队的人数并不需要很多，对于整个财务组织来说，这个团队一定是一个小众群体，它将是一把利剑。对于这样的团队来说，每个成员都要能够保持充分的活跃度和能动性。同时，整个组织需要具有高度的柔性，能够随时拆分或组合，既可以随时投入到微创新中，也可以随时投入到攻坚战中。财务智能化团队是一支富有变化性和战斗力的队伍，是未来财务组织中的特战队。\n\
    \n说到这里，我们已经知道，财务智能化团队需要具有财务和技术复合知识、敢创新、能推动、善变化、有战斗力的财务人。\n\n（三）财务智能化团队的组织设计\n\n\
    那么，我们又该如何去构建这样的一个财务智能化团队呢？我们首先从组织设计的角度来谈一谈财务智能化团队的几个关键问题。\n\n1.财务智能化团队的核心职责\n\n\
    财务智能化团队的核心职责主要有四点：第一，负责财务组织对智能化技术的战略性研究，能够积极主动地跟踪新技术动态，深入挖掘财务管理领域应用新兴智能化技术的可行场景，并制定实现路径；第二，能够有效地与IT部门对接，明确智能化应用场景的业务需求，推进并跟踪IT部门实现智能化业务需求；第三，推动已实现的智能化技术工具在财务管理实际工作中的应用，提升相关场景业务团队的工作效能；第四，积极推动人工智能技术对财务业务流程中人工作业环节的替代，提升流程的自动化处理能力。\n\
    \n2.财务智能化团队的管控关系\n\n财务智能化团队是财务组织内设机构，鉴于其在组织中需要有多方面的沟通协调能力及极强的推动要求，可以考虑将该团队的直接汇报对象设定为CFO或分管信息化建设的财务总经理。同时，赋予该团队较强的组织协调权力，以支持其推动变革项目，如项目资源调动的权力、对项目参与方进行考核的权力等。另外，财务智能化团队也需要和外围各方财务组织及科技部门保持紧密的协作关系。\n\
    \n3.财务智能化团队的组织架构\n\n作为一个柔性组织，财务智能化团队只需要有一个负责人和多个智能化财务经理，如图5-11所示。每个智能化财务经理都可以成为项目负责人或者其他项目的成员，但团队应当遵循项目经理负责制，赋予项目经理充分的资源调配权和项目管理权。而整个团队的负责人需要负责团队整体的方向和人员管理，能够对每个项目起到有效的辅导和监督作用。\n\
    \n![img](images/txt005_13.jpg)\n\n图5-11　财务智能化团队组织与管控、协同关系\n\n在明确了组织设计内容后，财务智能化团队的建设方向会逐渐清晰起来。作为一个有前瞻性思想的财务领导者，应当尽早启动对新技术的关注，以技术驱动财务管理升级。因此，能够较早地在财务组织内部设立财务智能化团队，会是很好的起点。随后，需要积极地引入富有创造力和综合能力的优秀人才，逐渐使团队的构建丰满。\n\
    \n财务智能化团队的建立会比其他财务组织的构建更富有挑战性，用有开拓性的领导力集聚创新技术人才，是团队成功构建的关键！\n\n## 第四节　智能时代的财务创新\n\
    \n当社会经济发展到今天这个阶段时，创新已经成为企业发展的核心驱动力。很多公司已经将创新作为企业战略的重要组成部分。国内外最顶尖的企业中新增了一个重要职位—首席创新官（Chief\
    \ Innovation Officer，CIO）。这个职位和首席财务官、首席技术官等处于同一层级。在这里，我们不是谈企业的首席创新官，而是来看一看财务如何创新，如何让整个财务组织形成创新的生态环境，并有机会让每个财务人都能够成为首席财务创新官。\n\
    \n### 一、智能时代财务创新的使命\n\n对于财务来说，创新并不是一件容易的事情，看看会计发展史就知道了。长期以来，社会强行赋予了我们“严谨务实”的标签，以积极的态度去理解，这是对财务工作的认可；而从另一个角度来看，也体现出财务和创新相悖的一面。\n\
    \n但事实上，我们并不否认财务是具有创新能力的。在最近数十年的时间里，财务创新在企业后台管理中仍然是一抹亮彩。计算机时代的财务迈出了会计电算化这一步，信息化时代的财务成为企业ERP建设的前锋，共享经济时代的财务共享服务中心在企业管理中独树一帜，而我们正在进入的智能时代，财务也必将有所作为。\n\
    \n智能时代赋予了财务人新的使命，对财务人的创新能力提出了新的要求。\n\n（一）创新的技术基础更为复杂，也更为便利\n\n智能时代的创新离不开技术，和过去的十多年相比，今天技术的发展和进步让财务人面临更为复杂的技术环境。在计算机时代，财务人只要会安装并操作软件就好了，在信息化时代，财务人还需要懂得一定的互联网技术。而在今天的智能时代，如果要把技术与业务场景深度融合，财务人需要懂的事情就更复杂了，无论是大数据、云计算，还是机器学习、区块链，没一件事情是简单的。在这样的一个复杂环境中来进行创新，就必须要对技术有深刻的理解。\n\
    \n与此同时，技术的获得又是便利的。例如，“某某云”能够让开发人员用较低的成本构建一个机器学习的开发实验环境，财务人只要稍微努力，去亲身体验和感受这些技术的实现过程也不难。从这一点来说，技术进步带来的是更多的便利性。\n\
    \n（二）创新的时效性要求更高\n\n智能时代的技术变化是高速的，并且遵从一定的演进路径。因此，在这样的技术节奏中，创新的时效性就显得尤为重要。如果创新的时间周期较长，往往一项新技术还没来得及得到深度的实践应用，就已经沦为“明日黄花”了。而跳跃技术阶段的创新又蕴含着较大的风险，导致一步慢、步步慢，最终在智能时代的创新竞争中失利。因此，智能时代的财务创新必须遵循唯快不破的基本逻辑。\n\
    \n（三）创新必须要和场景深度融合\n\n智能时代商业创新的本质是场景创新。一个缺乏业务应用场景的创新是没有市场和生命力的。实际上，技术的普及和平民化是一件容易的事情，但将技术与实际需求相结合，并形成有意义和有价值的应用场景就没那么容易了。对于财务来说，在接触到一个新的技术概念后，不应该着急地去全面展开基础建设，而应当客观、务实地深入挖掘应用场景，然后再来看如何把技术应用到场景中。这个时候，在技术层面所投入的建设资源将更具有针对性，能够获得更高的产出。\n\
    \n### 二、智能时代财务创新需要怎样的生态环境\n\n尽管在智能时代财务创新被赋予更高的使命，但要使财务能够从真正意义上实现管理创新，还必须要营造出一个适合创新的生态环境。这样的一个生态环境需要多方面的因素来共同打造，包括战略、文化、组织、技术等。\n\
    \n（一）公司战略的一致性\n\n财务创新要想活下来，第一个要点就是与公司战略保持一致，南辕北辙的创新终究会面对消亡的结局。对于财务来说，我们所做的事情并不是孤立的，必须要与公司的发展战略相匹配。设想，一个坚定走手工打造战略的企业推动财务智能化成功的概率，必定远低于一个将人工智能作为公司核心战略的企业。所谓顺势而为，就是这样的道理。站在风口上，财务创新必然可以迎风飞翔。因此，一个与财务创新方向匹配的公司战略是财务创新生态环境的基础。\n\
    \n（二）鼓励创新的文化氛围\n\n当财务创新与公司战略相一致时，说明我们做了对的事情，但要想作出成果，还需要有一个鼓励创新的文化氛围。在通常情况下，这种氛围在技术部门或者市场部门都较容易形成，但在财务部门往往存在一定的难度。\n\
    \n鼓励创新不是停留在口头上的一句空话，作为财务管理者，应当对作出创新贡献的员工给予积极的鼓励。\n\n生产线上的员工如果作出创新贡献，会根据其为公司带来的成本节约比例进行奖励兑现，因此不乏因创新而获得高达数百万元人民币奖金的员工出现。对于财务来说，我们很难要求管理者去承诺如此丰厚的物质奖励，但恰当的精神奖励和年度考核评价也会营造出有效的创新氛围。\n\
    \n（三）适合财务创新的组织模式\n\n适合财务创新的组织模式也是创新生态环境的重要组成部分。传统的财务组织模式对创新是不利的，部门之间的壁垒让全局性的跨部门创新难以实现。我们在柔性财务管理部分所谈到的柔性组织，设计一个层级简单、项目化、敏捷、柔性的财务组织，对于构建创新生态环境具有极其重要的意义。\n\
    \n（四）对财务创新的试错包容\n\n创新生态中的重要一环是技术，在创新过程中，很多新技术流程都需要经过实验的验证。在创新型企业中，往往对试错给予了极大的包容性，甚至很多时候鼓励试错，从中获取成功的种子。因此，好的创新生态应当具有技术试验环境，让大家在不断的尝试中找到正确答案。对于试错包容，海尔是一个不错的例子。在海尔的逻辑中，未来的商业创新具有极大的不确定性，对于一个企业来说，不妨营造一个万马奔腾的局面，最终总有那么几匹马能够跑到成功的终点。很多风险投资也是这样的，并不在于你投对了什么，而在于你错过了什么。\n\
    \n### 三、财务创新的失败\n\n谈了创新的方法，再来谈谈创新的失败。很多时候，知道为何失败比知道如何成功更有价值。财务创新的失败说起来并不复杂，下面说说创新失败的五种场景。\n\
    \n（一）目标不清晰带来创新失败\n\n很多时候，财务创新并不是在建立了清晰的目标蓝图后开始的，而是看别人做了，自己也就跟着做了，但做到半路可能都还不知道自己为什么在做这件事情。罗永浩在其专栏“干货日记”中曾经谈到不适合创业的场景，和我们这里讲的事情很相似。没有清晰的目标，无论是创业还是创新都存在极大的失败风险。结合前面所讲的，所谓清晰的目标其实可以理解为有价值的应用场景，有了场景，也就有了目标。\n\
    \n（二）技术不到位带来创新失败\n\n在财务创新项目中夭折在技术不给力上的案例太多了。很多企业财务在抛出一个创新想法的时候并没有充分评估自身的技术能力，想当然地认为自己的技术部门能够实现其构想，而一旦真正运作起来，技术环节掉链子，让整个创新项目停滞，或者错过最佳的实现时机。因此，在财务启动创新项目时，充分评估技术资源、锁定必要的技术资源都是至关重要的。必要的时候，引入外部资源或购买产品，拿来主义有时候是更加直接、有效的手段。\n\
    \n（三）创新周期过长的创新失败\n\n前面说了智能时代的创新有时效性的要求，很多创新项目就是因为周期过长而失败的。当一个项目的时间周期过长时，无论是项目的推动方还是关联方都经受不起漫长的时间磨损。随着时间的推移，很多被早期激情所掩盖的矛盾就会爆发出来。那么，以多长时间作为容忍的底线呢？经验告诉我们，这个时间周期最好不要超过18个月，否则项目的失败风险将会急剧上升。控制项目的时间周期，是财务创新者规避失败的一个简单、有效的方法。\n\
    \n（四）安于现状的创新失败\n\n很多时候，性格是我们的软肋。有不少财务创新者在意气风发地战斗了一次，获得了一次成功的创新实践后，就会陷入安于现状的陷阱。这个时候，他们忘记了创新是相对的，随着时间的推移，创新已不再新，越来越多的新进入者会使用、模仿、超越，将你的竞争优势瞬间瓦解。安于现状，是曾经的创新成功者的另一次创新失败。对于财务创新者来说，持续突破自我，实现创新循环，才有可能走得更远。\n\
    \n（五）变革阻力下的创新失败\n\n最后要谈的一种创新失败源自变革阻力。对于一些需要触动业务部门利益的财务创新来说，变革总是伴随着创新过程的。财务作为企业的后台部门，在推动剧烈变革的时候往往会面对极大的阻力和自身的心理压力。一旦内心不够强大，就会倒在创新的道路上。变革的阻力会给创新者带来绝望期，绝望期的深度代表绝望的程度，宽度代表绝望的时间，财务创新者应当积极营造良好的变革氛围，通过积极主动的沟通和获取管理层支持来减少绝望期的深度和宽度。\n\
    \n财务创新的成功建立在事先预判失败的基础上，当充分认识到创新失败的场景并有所应对时，创新将不再是一件困难的事情。\n\n### 四、人人都是首席财务创新官\n\
    \n对于财务来说，培养团队的创新能力并不是一件容易的事情，作为创新的领导者，需要有一颗坚持和包容的心，悉心营造良好的创新生态环境，培育团队的创新文化和员工的创新意识。通过一系列微创新项目树立财务人对创新的信心，并收获创新成功的经验。\n\
