    ##### 2.智能增强


    智能时代的到来将对企业的经营产生重大影响，各行各业在这个过程中都或多或少会被智能化所改变。或许你所在的企业会成为智能服务的提供商，或者成为智能技术研发的参与者，也可能在当前的业务模式中引入智能化工具，创新商业模式，提升竞争力。无论如何，智能化对企业未来的经营将会产生重要影响。部分公司会在战略层面进行调整，也有一些公司会进行战术层面的适配。


    战略财务要能够敏锐地跟上企业战略和经营变化的步伐，主动对公司的战略或战术改变提供支持，而非被动响应。在这场智能化变革中，战略财务的积极参与能够让我们赢得主动，更好地体现财务对公司战略和经营决策支持的价值。被动响应将使财务无法与业务站在同一对话层次上，从而导致业务部门自行构建或弥补战略财务能力的不足。这一现象在信息化时代已经有大量的案例，但愿历史不会重现。


