    [M\\].北京：人民出版社，2008：88.\n\n[\\[8\\]](#txt001.xhtml#footnote_quote_txt001_8)孙逸，董志强.RPA：财务智能化的必经之路\\\
    [J\\].新理财，2017（21）：64-65.\n\n\uFEFF\n\n# 第二章 智能时代财务信息化整体规划\n\n## 第一节 智能时代财务信息化概念框架\n\
    \n智能时代的到来，带来了诸多新技术，而这些新技术在财务领域的应用场景也会日趋丰富。我们之前谈到了很多关于财务认知升级的话题，也谈到了在智能时代影响财务信息化建设的重要技术。当技术和财务有机地融合在一起的时候，就会发生一些美妙的化学变化。智能时代财务信息化架构应运而生，既有传统财务信息化的醇美，也有未来时速下的性感。让我们一起来探究智能时代财务信息化架构。\n\
    \n### 一、软件架构与财务智能化功能架构蓝图\n\n首先，我们一起来看一看什么是软件架构，以及财务智能化功能架构的蓝图。\n\n#### （一）什么是软件架构\n\
    \n对于财务来说，软件架构这件事情听起来还是有点儿复杂的，说得通俗一点儿，就是要搞清楚一个系统中有哪些构成部分，这些构成部分是怎样相互发生作用的。那么对于智能时代的财务信息化架构，就是要搞明白和传统财务信息化架构相比，多了哪些构成部分，以及各部件之间相互作用的方式发生了怎样的变化。“有什么功能”可以称之为功能架构，功能加上交互关系后形成的架构可以称之为逻辑架构。而在实际的软件架构设计中，还有多个视角的架构理解，如开发架构、运行架构、物理架构、数据架构等[\\\
    [1\\]](#txt002.xhtml#footnote_content_txt002_1)，如图 2-1 所示。下面我们重点聊聊偏重于概念层次的功能架构。\n\
    \n![img](img/txt002_1.jpg)\n\n图 2-1 多视角的软件架构\n\n#### （二）智能时代财务信息化功能架构蓝图\n\n在这里，我们用更容易让财务人员理解的方式来表达智能时代财务信息化架构的概念，如图\
    \ 2-2 所示。\n\n![img](img/txt002_2.jpg)\n\n图 2-2 智能时代财务信息化功能架构蓝图\n\n从图 2-2 中，我们从数据特点、一系列引擎化的技术工具，以及财务应用和智能时代新技术的组合场景分析等方面展示了智能时代财务信息化功能架构的全貌。\n\
    \n### 二、财务智能化功能架构蓝图解析\n\n下面我们针对财务智能化功能架构蓝图逐一展开解析。\n\n#### （一）功能架构中的数据层\n\n首先要说的是智能财务信息化架构下的数据层。和传统财务信息化架构相比，最重要的是数据的内涵发生了变化。在传统架构下，处理的主要是结构化数据；而在功能架构下，结构化数据已经无法满足财务信息系统对数据的需求，非结构化数据被引入，并且成为非常重要的构成部分。\n\
    \n因此，在功能架构下的数据层中，系统对结构化数据和非结构化数据同时提供相应的管理功能支持，从数据的采集管理、对接管理、存储管理等方面进行相应的功能支持。\n\
    \n#### （二）功能架构中的智能引擎层\n\n智能引擎层是架构中的另一个重要层次。之所以叫作智能引擎层，是因为想要在搭建智能时代财务信息系统架构时，能够对关键的支持技术进行组件化，并以引擎的形式来支持不同业务场景的应用。引擎层是一个公用的技术平台，在不同的应用场景中，能够灵活地调用相关引擎来实现配套的业务应用，从而实现整个财务信息化架构底层技术工具的共享。在智能时代的财务信息化架构中，可抽象出的引擎主要包括以下几个方面。\n\
    \n##### 1. 图像智能识别引擎\n\n图像智能识别引擎主要用于广泛地进行图片信息的识别，既能够支持对结构化数据的采集，又能够支持对非结构化数据的信息提取。同时，图像智能识别引擎可以利用机器学习来提升自身的识别能力，从而扩大可应用场景。\n\
    \n##### 2. 规则引擎\n\n"
