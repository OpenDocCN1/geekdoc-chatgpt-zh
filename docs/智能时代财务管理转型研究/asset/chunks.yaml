    ##### 2. 智能增强

    通过智能技术，能够从事前、事中、事后三个层次防范财务操作风险。

    从事前防范角度来看，在传统模式下，我们所构建的KRI体系是基于经验和分析的，但这种构建方式可能存在认知完整性的缺陷。基于财务业务流程中大量的交易，以及现有模式对于风险事件的发现，能够通过机器学习方法发现新的KRI规则，从而补充和完善现有的KRI体系，加强对事前风险的防范能力。

    从事中控制角度来看，基于经验的规则系统化，能够实现初级人工智能的应用，通过大量规则，能够发现财务交易中的潜在风险事件，并能够对一些风险事件进行直接拦截。此外，基于数据积累，能够对每一笔单据进行风险分级，针对不同的风险等级配置不同的控制流程，从而提升风险管控能力。同样，基于经验的规则积累，能够借助机器学习技术进行持续的训练优化，持续提升风险控制能力。基于企业内外部大数据的积累和挖掘，能够建立更丰富的单据风险分级规则模型，使单据的风险分级更准确。

    从事后分析角度来看，能够建立起不同类型的分析模型以发现风险线索，如基于决策树的模型、社交网络的模型、聚类分析的模型等。这些模型的构建，能够帮助我们在事后进一步进行操作风险审计和问题发现，通过跨交易单据的分析，发现更为广泛的风险线索，并基于风险线索进一步发现和解决问题。同样，大数据和机器学习有助于我们持续完善各种分析模型的规则，从而提升风险线索发现的精准度。


    ### 二、智能风控

    对于专业财务来说，业务人员舞弊和渗漏风险管理一直是重中之重。然而，在传统的财务管理模式下，想要做到这一点在客观上存在较大难度。一方面，渗漏和发现渗漏就如同一场猫捉老鼠的游戏，总是不得不面对财务与业务的各种博弈升级；另一方面，要想做好这件事情，财务在反渗漏的斗争中不得不消耗大量的人力和精力。

    好在随着智能时代的到来，在财务反渗漏这件事情上有了新的转机。依托智能技术，我们有可能在与渗漏行为的博弈中占据更加主动的位置，同时能够让算力从一定程度上替代人力，智能风控让我们能更容易地抓住财务渗漏的尾巴。


    #### （一）何为财务渗漏

    对于财务来说，在面对风险时有两种典型的情况。

    一种情况是在复杂的财务流程中存在大量的财务运营工作，这些工作本身容易发生因为工作疏忽或者技能熟练度不足所导致的各种各样的差错。对于这些差错来说，我们并不把它们理解为一种渗漏行为，而更多地定位为财务的质量问题。

    另一种情况是这里要说的财务渗漏，也可以理解为公司员工出现道德问题，从而发生的舞弊欺诈事件，这些事件会直接或间接地造成公司的财务损失。由于这种行为往往隐藏在大量的常规业务中，如员工的费用报销、零星采购等，如同一个容器出现了破损，漏下了沙子，故被称之为财务渗漏行为。

    对于财务渗漏来说，最典型的关键词是“虚构”，那么我们会面临哪些虚构事项呢？


    ##### 1. 虚构经济事实

    这种情况是财务渗漏事件中性质最恶劣的，可以用“无中生有”来形容。涉案者往往是在没有任何真实业务支撑的情况下，凭空捏造一个经济事实。做得比较高明的，往往还会编造一套看起来相对靠谱的逻辑证据链，通过这样的虚构从公司套取资金。当然，套取资金后，某些有良心的人会用这些资金形成小金库，用于特殊用途或员工的补充福利，而另一些人则直接装入自己的腰包。


    ##### 2. 虚构原始凭证

    相对于完全虚构事实，虚构原始凭证的情况要稍微好些。有些时候，确实是发生了实际的费用支出，并且员工也自行垫付了资金，但由于发票遗失或者忘记事前审批等其他情况，能够支持其正常报销的原始凭证缺失，这个时候为了完成报销，员工有可能虚构原始凭证，比如购买发票、伪造审批签报等。尽管从动机上讲，虚构原始凭证比完全虚构经济事实少了那么一点儿恶劣性，但仍然是我们所认为的财务渗漏行为。


    ##### 3. 虚构业务金额

    还存在一些混搭性质的情况，并且也比较隐蔽，我们姑且称之为虚构业务金额。这种情况往往会存在一个基础的经济事实，也就是说确实有经济开支发生了。比如，员工确实出差了，但是在实际报销的时候员工把住宿金额放大，将住了5天改成10天，把每天500元变成每天1000元，这样在一件存在事实基础的事情上虚构了业务金额。这种混搭式的行为也是我们理解的财务渗漏行为。


    #### （二）进化中的财务渗漏

    我们把渗漏的发展分为基础进化、惯性进化、关联进化和突变进化四个阶段。


    ##### 1. 基础进化阶段

    在财务渗漏的最原始阶段，业务人员的渗漏行为往往是偶然的。比如，在一次报销中错误地填写了信息，而财务人员并没有发现，这种偶发的渗漏行为就如同取款时取款机吐出了一堆并不属于我们的钞票，然后我们把这些钞票放进了自己的腰包。这个阶段我们可以称为财务渗漏的基础进化阶段。


    ##### 2. 惯性进化阶段

    当给了可以犯错误的机会后，总有一些人会把这种偶然行为转化为一种惯性行为。有少部分人会尝试利用财务控制中的一些漏洞习惯性地占一些小便宜，甚至慢慢演变成主观故意的恶劣欺诈行为，但这种行为还是被控制在了个体单位内。这个阶段我们不妨称为财务渗漏的惯性进化阶段。


    ##### 3. 关联进化阶段

    再往后，贪婪是很容易被放大的，由于个体渗漏的成功率是建立在后续控制环节失效的基础上的，很多时候并不那么容易成功。把最重要的控制环节—主管领导，纳入自己的渗漏计划里往往能够迅速获得更多的成功机会。由于业务真实性的控制已经失效，只要后续能够伪造证据，就很容易完成渗漏。这种现象放大了渗漏的频率，我们不妨称这个阶段为财务渗漏的关联进化阶段。


    ##### 4. 突变进化阶段

    关联进化阶段的渗漏还是有一定的限制的，毕竟要想获取各种支持证据并不容易，虽然渗漏频率增加了，但尚未造成金额的放大。但如同生物的进化，总有一些个体会发生基因突变，形成具有显著差异的物种。在渗漏的进化之路上，有那么一些不满足于当前阶段的渗漏者扩大了他们的小圈子，通过将支持财务开支的证据链条上更多的环节纳入渗漏俱乐部，实现了端到端的渗漏能力，不求高频，只求金额大。我们将这个阶段称为财务渗漏的突变进化阶段。


    #### （三）财务反渗漏的进化与面对的难题

    ##### 1. 数据分析的资源有限

    不得不承认，靠财务人用Excel或者简单的BI工具确实能解决不少问题，但是面对报销这样的海量高频数据时，这些数据分析资源还是远远不够的。由于反渗漏的数据分析是一种线索发现的分析，和常规的数据报表是不一样的，这要求我们通过大量的数据、大量的分析尝试来发现线索。对于财务人来说，进行一两次专项分析问题不大，但要是把这件事情变成常规工作，估计很多财务人撞墙的心思都有了，这哪里还是“高大上”的反渗漏数据分析师，整个就是一个“数据码农”。


    ##### 2. 复杂逻辑难以设计

    在进行财务反渗漏的过程中，依靠逻辑来发现线索本身就是一件很困难的事情。实际上，逻辑的设计类似于数据建模的过程，要想有效地发现复杂渗漏的线索，模型就必须要构建得足够复杂。然而，人脑处理逻辑的复杂性是有限制的，当逻辑层次超出了人们的理解范围后，就很难再依靠人的认知能力来进行逻辑分析发现渗漏线索了。因此，如何突破人的逻辑局限，找到不易发现的隐藏逻辑或复杂逻辑，成为财务人反渗漏的重要挑战之一。


    ##### 3. 关联渗漏无能为力

    在反渗漏的战斗中，财务人最无能为力的场景就是面对关联渗漏。所谓的关联渗漏是指舞弊的行为被分散在不同的单据、时间甚至不同的子公司中。在这种情况下，财务人的分析发现能力很难跨越单据、时间和公司这些天然的屏障，这也成为很多渗漏者的舞弊乐园。

    不难看到，财务在反渗漏的进化中是迟滞于渗漏进化的。特别是在过去很长一段时间内，技术手段无法突破成为最大的挑战。值得庆幸的是，在智能时代，这一状况有望改变。


    #### （四）智能时代反渗漏技术的智能进化

    智能时代的到来，让我们面对亟待进化的反渗漏局面时找到了突破的转机。大数据与机器学习技术的发展，让财务有机会在反渗漏的场景中尝试应用这些新技术。下面我们一起来看看基于规则模型与监督学习模型、非监督学习模型、SAN社会网络三种形式的智能风控所带来的反渗漏升级。


    ##### 1. 基于规则模型与监督学习模型的智能风控

    事实上，基于规则的反渗漏与我们在上文中所谈道的基于数据和逻辑的反渗漏的思路是一致的。核心差别在于能够用信息系统来运行复杂的规则模型，而不是靠人进行分析。当然，你可能会说，现在就能够把规则植入系统中，和智能技术有什么关系？

    说得没错，很多人会陷入一个误区，认为人工智能到来了，要用复杂的思维去取代简单的规则处理。实际上，正确的做法是尽最大的可能在应用人工智能技术之前采用规则处理，基于规则的系统处理的成本更低并且高效。但是，在当前的技术条件下，采用规则处理有两个难点，一个是支持规则处理的数据不足；另一个是规则本身的设计困难且复杂。

    智能技术的出现，恰巧在这两个方面提供了支持。大数据技术的出现，让我们能够管理更庞杂的和非结构化数据。这些越来越大的数据让我们有机会应用更复杂的规则模型来发现渗漏线索。比如在今天，我们可以使用OCR、众包等多种形式获得大量与经济事项相关的数据进行管理，也可以从社会网络中获取与供应商、员工相关的大量信息来发现潜在的渗漏线索。另外，机器学习中的监督学习模型能够帮助我们将大量人工审核方法转化为机器规则，从而实现自动化的规则反渗漏审核。

    在基于监督学习的机器学习模式下，我们可以将长期以来基于人工反渗漏作业的单据作为学习训练的基础，通过对单据的特征进行数据化，并对这些单据是否存在渗漏情况打上标签。监督学习模型能够利用大量具备特征和标签的训练题进一步提炼规则。这些新的规则植入系统后，作用于新发生的业务单据，分析其是否存在渗漏的可能，这将有助于解决“规则建立困难”的问题。


    ##### 2. 基于非监督学习模型的智能风控

    另一种帮助我们找到渗漏线索的方法是利用机器学习中的非监督学习。从某种意义上讲，非监督学习可以理解为机器对大量数据进行自主聚类分析的过程。机器系统并不关心数据本身的含义，它将数据按照特征的相似性进行分类。在这种情况下，我们不难想象，对于大多数“正常”的单据来说，它们会具有相似性，能够被非监督学习模型归集到非常相似的大圈圈里；而那些可能存在渗漏行为的“不正常”单据，则有可能出现在特定区域的小圈圈中。通过这样的可视化分析，能够帮助我们进一步将渗漏调查的对象聚焦在这些另类的小群体单据中。

    “非我族类，其心必异。”正是基于这种思维导向，非监督学习在技术上的支持，让我们有可能突破数据和逻辑分析的局限，找到在传统模式下看不到的渗漏风险。


    ##### 3. 基于SNA社会网络的智能风控

