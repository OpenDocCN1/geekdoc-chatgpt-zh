    ##### 2.智能增强


    在通常情况下，管理层都会要求财务共享服务中心的设立具有一定的前瞻性和预测性。自十多年前开始，财务共享服务中心的建立本身就具有强烈的创新特征，我们需要向管理层阐明所采用的技术手段能够达到当前的市场水平或竞争对手水平，并能够对企业自身的管理带来提升。很多企业在这个过程中也同步进行了与支持财务共享服务相关的信息系统建设，但总体来说，并没有超出当前互联网时代的技术水平。


    今天，在展开财务共享服务中心建设的过程中，无论是进行立项还是规划都必须考虑到即将到来的智能革命对财务共享服务的影响。笔者曾经给一家中国本土进入世界五百强的家电制造企业做过财务共享服务规划和设计，在此过程中，其管理层就谈到过，希望未来的财务共享服务中心能够越做越小，而不是人数规模越来越大。这正是暗含了对智能时代共享服务建设的深刻理解。


    在笔者看来，基于信息系统的高度集成，数据信息能够自由获取，规则的自动化作业辅以人工智能作业的新的共享服务模式正在到来，也会在不久的将来逐步取代当前基于大规模人工作业的共享服务模式。实际上，这一进程一直在进行，只不过受限于技术手段和数据质量，我们所能感受到的仅仅是优化性的进步，如一些跨国外包公司热衷于
    RPA（机器流程自动化），就是在积极进行自动化替代人力的尝试。


    因此，今天我们在建立共享服务中心的规划过程中，必须要充分考虑到未来智能化技术对财务共享服务中心的影响，为当前财务共享服务中心的建设留下向智能化进行转型和拓展的接口。同时，我们必须认识到智能化很可能在最近数年中出现爆发式的技术发展，财务共享服务中心必须要有充分的认知准备，紧随技术进步，及时调整自身的运营策略，切换至智能化运营平台，以维持当前建立财务共享服务所带来的竞争优势。


    #### （二）财务共享服务中心组织与人员管理


    ##### 1.框架详解


    财务共享服务中心组织与人员管理框架详解，如表 6-16 所示。


    表 6-16　财务共享服务中心组织与人员管理框架详解


    ![img](img/txt006_23.jpg)


    ##### 2.智能增强


    智能时代的到来，对当今财务共享服务中心的组织与人员管理提出了不一样的要求。


    首先，从组织职责及架构设置来看，今天的财务共享服务中心在传统职能的基础上，必须要考虑一些用于自我变革的职能。实际上，有不少财务共享服务中心还在纠结是否要用自动化来替代人工，并顾虑因此对现有团队的利益影响。在笔者看来，与趋势逆行是不可取的，我们应当在当今的组织中一方面继续针对传统的集中化人工作业模式展开运营的提升；另一方面，应当设立创新科技组织，积极主动地展开自我颠覆。通过应用新技术，主动降低对人力的依赖，从而在这场变革中掌握主动。


    其次，对于这一变革时期的人员管理，要充分做好面对自动化带来人力释放影响的准备工作。将分散的人员集中起来是一场变革，在这个过程中，我们已经经历了一次减员的挑战。而今天，把集中在财务共享服务中心的人力再消化掉是另一场变革。这一次，我们应当在人员的职业发展上有针对性地考虑未来智能化的影响，提前做好人员的非共享技能培养，以帮助部分人员在智能化过程中逐渐分流至其他岗位，从而减少刚性人员裁减带来的剧痛。


    最后，在人员的考核上，应当更多地关注对于人员创新能力的提升。传统的财务共享服务模式过于强调效率，这使财务共享服务中心的员工并不热衷于使用新技术来改造现有的工作模式，而更倾向于一个稳定的工作环境，这对财务共享服务中心适应智能时代的发展变革要求是不利的。多一些主动的求变精神是智能时代财务共享服务的必由之路。


