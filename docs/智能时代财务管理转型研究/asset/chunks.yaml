    # 众包与财务智能化


    众包的出现与财务领域和智能时代的来临有着密不可分的关系。在人工智能和财务共享服务中心的人力替代战争中，众包是机器作业的前置补充之一，它正在和人工智能一起面向传统财务共享服务模式发起进攻。


    ## （一）众包


    众包是指一个公司或机构把过去由员工执行的工作任务，以自由自愿的形式外包给非特定的（而且通常是大型的）大众网络的做法。众包模式和传统的运营作业模式存在显著差异，并具有任务颗粒化、技能低门槛、时间碎片化、组织网络化和收益实时化五个特点。


    ### 1. 任务颗粒化


    众包可以说是劳动分工更为深化的应用场景。如果说劳动分工理论把一个复杂的业务处理推动为流程化、分环节作业的模式，那么众包模式就进一步将工作任务化，达到了更细的颗粒度。


    ### 2. 技能低门槛


    任务高度颗粒化带来的直接好处就是任务的复杂性得到降低，每一个小的任务颗粒对技能的要求将大大小于组合起来的一个完整的流程环节对工作技能的要求。这使社会上大量并不掌握复杂技能的普通人员能够参与到众包的工作中来，并且使用极低的成本来完成相关工作。


    ### 3. 时间碎片化


    在传统的流程管理中，往往需要整块的时间来完成某一项工作，而且流程中间多数是串行关系，要求工作时间具有连续性。而在众包模式下，任务颗粒化后会出现越来越多的在同一时间内的并行任务，从而对时间连续性的要求有所下降，形成任务处理时间的碎片化。因此，可以由互联网上的众多个体在同一时间并发完成多种类型的任务。


    ### 4. 组织网络化


    当技能门槛降低、任务颗粒化且时间碎片化后，众包的人员组织形式可以实现网络化。众包会有大量的社会化资源参与，形成网状的任务交付结构，最后由任务的发包方完成这项任务的流程化组装和应用。


    ### 5. 收益实时化


    对于众包网络中完成任务的个体来说，由于单个任务的收益很小，实时的收益计量是其持续参与的核心动力。收益实时化并不是要求随时支付，而是可以实时告知作业用户获得了多少收益，定期进行结算。


    ## （二）如何实现财务众包模式的落地


    由于众包是新兴的创新模式，从方法到技术平台各方面均存在挑战，要成功实现众包模式的落地，需要在前期有严谨的思考和设计，方能达到预期的效果。下面从众包的业务内容、技术平台及运营模式三个方面来谈谈如何实现众包模式的落地。


    ### 1. 确定可众包的业务内容


    在评估是否可以众包的时候，有几个原则需要加以考虑。


    #### （1）业务是否能够进行充分的标准化乃至颗粒化

    复杂的业务没有办法让技能单一的社会参与者进行处理，必须要进行颗粒化拆分，而能够拆分的前提就是可以标准化。


    #### （2）任务必须不存在信息安全隐患

    众包的对象和信息的流转渠道是完全不受控制的，所以发包信息必须不存在信息安全的强要求，否则会产生风险。


    #### （3）对于时效的要求有适度的容忍性

    众包需要有派工、等待、双人核验等过程，如果等待超时还要有二次分派的过程，尽管可以对时效进行一定的管控，但如果对时效要求极高则不适合进行众包。


    基于以上分析，在财务流程处理中有哪些业务内容可以考虑纳入众包的范围呢？以费用审核为例，如果从人的动作的角度来看，审核过程可以分解为“信息的读取”加上“和既定规则的比较”。“和既定规则的比较”属于技术含量较高的部分，并不适合众包处理，在未来需要更多基于人工智能的机器审核来完成。


    从可操作性上来说，“信息的读取”可以考虑作为众包的核心内容。它能够满足上文中所提到的标准化和颗粒化的要求，由于对人的技能要求不高，更适合采用众包模式，而这个环节的产出也可以作为智能审核的数据基础。在实践中，标准发票、企业结构化单证中涉及的科目和金额，如在风险控制线内，则可以采用众包模式来进行信息录入。


    ### 2. 众包技术平台的搭建要求


    在具体实操的过程中，需要有技术平台来支持众包业务。在具体的技术平台设计上，应考虑以下特点要求。


    #### （1）技术平台具有高稳定性

    由于是面对大用户量的平台，因此需要能够在大并发下高效率响应。此外，由于每个任务都是颗粒化的，单任务处理的周期短，任务会频繁地被分发和回收，这进一步加剧了性能压力。因此，要充分考虑平台的稳定性。


    #### （2）技术平台具有高安全性

    由于在平台上直接处理的是财务单据信息，虽然是碎片化分割出去的，但一旦发生数据泄露，大量碎片的再组合就会出现完整的、有价值的商业信息。因此，平台需要在安全性上给予很高级别的考虑。


    #### （3）技术平台具有高易用性

    在平台上从事作业的人员技能水平不高，如果平台操作复杂，则多数用户会难以适应，甚至根本无法开展工作。因此，在设计平台时需要尽可能做到傻瓜式设计，降低上手难度，使平台上的作业轻松愉快，而非充满挑战性和复杂性。


    #### （4）技术平台需要兼顾 PC 端和移动端

    参与众包的用户，一类是以此为主要收入来源的固定用户，每天会处理大量任务，极其追求作业效率，此类用户适合使用 PC 端作业；另一类是以娱乐和赚取零花钱的心态参与众包的非固定用户，考虑到此类用户碎片化作业的需求，更适合使用基于
    APP 或微信小程序的移动端作业。


    ### 3. 众包技术平台的核心功能


    在明确了众包平台所需具有的技术特点后，我们再来看一下众包平台对功能层面的主要考虑要点。


    #### （1）任务拆分和组装的功能

    在通常情况下，众包平台并不是任务的源头，需要从其他系统中导入任务。进入平台的任务是整件业务，需要在平台中进行拆分，并建立关键索引，后续派工基于拆分后的碎片任务进行，作业完成后，需要在平台中进行进一步的任务组装，组装时基于任务拆分时的关键索引进行。


    #### （2）任务分派和调度的功能

    平台不适合进行主动式任务推送，因为我们并不知道众包平台用户现在是否有意愿进行任务处理。所以，平台的任务分配采用主动提取式。主动提取后的任务需要设置基于时间的调度管控，由于用户很可能在提取任务后因为突发情况或者主观意愿，放弃了对当前任务的处理，这就需要对所有任务设置倒计时管理，在计时结束后对没有完成的任务进行取回重新分配。


    #### （3）多人作业核验的功能

    由于作业质量无法按传统模式进行流程化质量检查，因此需要在机制上做特别的设计，常用的模式是双人作业、系统核验，就是将同一个任务同时分派给两个不同的作业人。如果作业结果一致，则认为任务质量是合格的；如果不一致，则引入第三人作业，其作业结果与前两人的作业结果比对，如果一致，则以一致结果为准，否则转入问题处理。


    #### （4）计费和结算的功能

    由于要对社会上零散人员进行计费和结算，这就需要基于任务来定义计费单位，如录入类任务可按字节计费，审核任务可按复杂度和页数来综合计费。无论采用何种方式，都要保证计费依据客观、可度量。系统根据数据自动计算用户作业绩效，并自动结算。此外，可考虑支持网络结算。


    #### （5）用户和用户能力管理的功能

    平台用户量大，需要进行必要的身份验证，如身份证核验、技能证书核验等。此外，需要建立基于作业质量、信用、技能等的综合模型，对用户进行分类分级管理，允许晋升用户的级别。


    ### 4. 构建众包的运营模式


    有了技术平台后，再结合科学的商业运营模式，可以正式实现众包模式的落地。在通常情况下，众包的运营模式从目的的角度可以分为两大场景：一种场景是以参与方的身份，从解决自身人力需求出发，希望将众包模式作为工具来应用；另一种场景是以运营方的身份，将自身转型为服务平台，为更多的企业提供众包服务。两种不同的身份在众包运营中的考虑和模式是显著不同的。


    #### （1）作为参与方身份的运营模式

    作为参与方，重在使用和利用好众包。因此，参与方只需要专注于如何推广众包平台，将用户吸引到平台上来进行作业，并且保持稳定的质量水平。在这个过程中，主要需要考虑以下几点：宣传推广众包平台；找到恰当的定价水平；加强平台用户的黏性。


    #### （2）作为运营方身份的运营模式

    作为运营方，需要完全覆盖参与方的角色。上文中所谈及的参与方的各项运营要点，在运营方这里都要做到，甚至要做到更好。而在这一基础之上，运营方还需要管理好任务的来源。对于运营方来说，最重要的是要让平台变成中介，能够在平台上导入大量的任务，同时有大量的资源来承接运营任务。如果要向众包平台上的大量企业客户发布任务，则需要做好以下几项运营工作：吸引企业客户进驻平台；面向企业客户提供稳定高效的系统对接服务、专业化的服务支持及丰富的数据支持。


    ## 三、RPA 财务机器人


    RPA 的全称为 Robotic Process Automation，即“机器流程自动化”。RPA 并非长成机器人的样子，RPA 的本质是一个软件产品，它并不复杂，甚至比想象中的还要简单。


    ### （一）以跨应用系统的外挂形式存在


    讲到 RPA 的存在形态，RPA 并不是想象中的一个独立的复杂系统，它有点儿像游戏外挂，是在企业现有的系统上进行的嫁接。如用户计算机中的两个应用系统 A 和
    B，原先需要通过人工将 A 系统中的数据读取出来，再由人工录入 B 系统，现在就可以借助 RPA 在两个系统之间实现一个外挂，自动将 A 系统中的数据提取出来，并填充到
    B 系统中。RPA 并没有和 A、B 系统进行深度集成，而是一个外部挂机的自动化脚本通道。


    ### （二）能够进行可视化的监督管理


    对于 RPA 来说，很重要的一点在于它建设了针对跨应用程序运行脚本的监控平台。如果没有这个可视化的监控平台，RPA 就和科技部门在后台写的脚本程序更像了。通过这样的一个前台可视化的监督管理工具，能够记录
    RPA 中完整的行为，并且使这些脚本在可监督模式下运行。


    ### （三）可以通过简单的开发实现


    从应用实施的角度来说，RPA 是简单化的。它与 Office 宏的概念十分相似，并不需要通过复杂的开发就能够实现应用，最多达到类似于 VBA 的复杂程度。当然，从技术层面来说，Office
    宏或 VBA 工具仅能在一套应用程序体系内使用，而 RPA 能够在统一操作平台上打通多个应用系统，这是显著不同的。


    ### （四）部署周期很短


    RPA 有成熟的产品体系，能够进行简单、快速的部署实施。从时间周期上看，一个简单的场景可能几天就可以完成开发，数周时间能够实现可用。但需要注意的是，RPA
    的实施更多地需要在流程梳理方面下功夫，对于可以应用 RPA 的流程场景的识别，以及使用 RPA 后流程的标准化管理机制的设计和应用都是需要重点关注的。一个缺少标准化约束的机器人将是财务工作的灾难。


    ### （五）基于设定自动执行流程


    RPA 一旦部署完成后，就可以基于计划任务或触发条件来自动执行，而不需要依靠人工进行触发。当然，自动执行的背后同样需要对于流程的事先设计，以及对于流程执行的时间和顺序节点进行有效的事件管理，自动执行后的
    RPA 也需要进行必要的监控。


    ### （六）善于解决重复应用场景


    RPA 最擅长做的事情就是对流程中一个重复的人工场景进行自动化。虽然从优选的角度来说，我们会考虑进行系统的深度集成，从根本上解决问题，但是在有些情况下需要人工衔接的系统并不在我们的掌控之下，如纳税申报需要与税务系统进行对接，系统集成就受制于监管系统的开放程度，而
    RPA 可以在这种情况下发挥其外挂的长尾价值。


    ### （七）能够模拟人的行为串行执行


    还是用 Office 宏来举例，RPA 能够把一连串的流程整合起来执行，而且是拟人化执行，如执行复制、粘贴等系统已经内置的操作命令，并串起一个流程。这个过程是高度模仿人的行为方式来进行的，而深度集成则类似于空气动力学让飞机飞起来的模式。


    RPA 产品走的是仿生学道路，它用一个独立于企业现有业务系统的应用程序，在不改变现有系统对接方式的情况下，模拟原本依靠人工执行的系统内或系统间的衔接操作。比如，销售系统中的订单数据原本要靠人工录入
    ERP，RPA 就会模拟这个过程，将销售系统中需要录入的订单数据读取出来，并登录 ERP，模拟人工录入的方式，把数据录入进去，然后和人工一样，单击“保存”“提交”。这就是
    RPA！


    ## 四、人机协同


    ### （一）如何实现财务共享服务中心的人机协同智能化


    作为新兴技术，与财务共享服务场景的融合并不是一件容易的事情，要想一步实现智能化，实现机器替代人工作业似乎并不可行。在大量实践基础的积累之上，一种变通的思路被提出，即基于人机协同的智能化，让财务共享在智能化之路上实现质的突破。在人工与机器自动化相结合的条件下，借助
    OCR（Optical Character Recognition，光学字符识别）、网关、风险分级引擎、规则引擎所构建的人机协同智能共享技术成为过渡阶段一种具有落地性的选择。


    #### 1. 数据采集的人机协同


    要实现财务共享的智能化，首先要解决的是原始凭证如何数字化的问题。遗憾的是，当前财务原始凭证的结构化水平严重不足，在营改增之前，我国的发票种类繁多，要想获取发票中的信息，更多的是靠财务共享作业人员逐张审视。这种状况在这两年得到了改善，随着营改增的推行，越来越多差异化的发票样式向增值税专用发票和普通发票统一，使我们有机会采用新的方式来处理原始凭证。OCR
    技术在这一领域被积极地运用。


    事实上，利用 OCR 技术提取发票信息的实践一直在进行着，但如上文中所说的，在原始凭证特别是发票种类繁多的时候，使用 OCR 技术的难度是很高的。由于现行的
    OCR 技术主要还是基于模板配置的方式来进行采集准备的，这使模板开发和优化的工作量巨大，再加之识别率的不足，使不少尝试胎死腹中。但随着发票样式的统一，这一模式再次被提上议程，基于
    OCR 技术，针对增值税专用发票和普通发票的定向优化，能够将识别率提升到可接受的水平。


    但我们必须认识到，100％的 OCR 识别率是难以做到的，这使全自动化的最后一步难以迈出，在这种情况下，人机协同模式的出现打破了僵局。通过在流程中植入 OCR
    后的人工补录流程，让我们能够以较小的代价来实现全信息的数字化。通过实践看到，人机结合的 OCR 采集模式充分利用了识别技术的优点，也克服了阻碍最后一步的难题。当获取了完整的信息后，下一步的自动化机会豁然开朗，并呈现在我们的眼前。


    #### 2. 共享派工的人机协同


    在缺少数据支撑的情况下，财务共享服务中心在作业时通常是采用随机派工的方式，通过强制分派或者抢单的方式来实现作业任务的分派。这种方式的优点在于能够带来任务分派的公平性，减少不必要的协同问题。但也存在不足，采用随机分派的方式，忽视了不同任务之间风险水平的差异，也忽视了共享作业人员之间能力的差异。


    当我们尝试去正视这个问题的时候，会发现，如果能够将任务的风险水平与员工技能水平匹配，就会获得收益。这种收益来自风险更高的任务，由技能更强的员工来进行处理，从而提升了管控风险的能力，而低风险的任务交给系统或者低水平的员工来进行处理，进而降低了成本。这打破了现行共享服务主流的大锅饭模式。而当我们能够使用计算机进行自动的信用与风险分级后，再结合相匹配的人工作业，就实现了另一种方式的人工协同。


    当然，要做到这一点并不简单，最大的挑战是如何识别并定义每一个进入共享中心派工池的作业任务的风险等级。在原始凭证数据化之前，这是很难实现的，但随着数据采集人机协同的应用，我们获得了更为广泛的财务数据，在此基础上建立风险的分级模型，将任务分成不同的风险等级，并进行差异化的派工处理。但是在这个阶段，任务分级的模型算法更多的还是基于人员的作业经验，这在一定程度上限制了人机协同能力的最大化实现。


    #### 3. 共享作业的人机协同


    共享作业的人机协同是最后一个环节，也是最重要的一个环节。在传统的财务共享服务模式下，共享作业任务的处理主要依靠作业人员掌握审核作业的规则要求后，进行人为的判断处理。这种处理方式虽然采用了劳动分工的科学管理方法，通过标准化降低了人工处理的难度，但是其背后仍然需要大量具有丰富经验的财务共享服务人员作为支撑。


    在这种情况下，人们思考是否有更好的方式方法来进一步优化共享作业模式？对于利用系统进行自动化处理的探索也一直在进行着。但受制于前端数据的不足，以及系统进行自动化处理的工具局限性，这一尝试的进展也是有限的。


    随着原始凭证基于采集人机协同的数字化进程的推进，一种使用规则引擎进行自动化处理的人机协同方式被提出。在传统模式下，需要靠人记忆并执行的作业规则被进一步颗粒化，并被植入规则引擎中。规则引擎依靠丰富的数据输入及所设置的颗粒化规则进行批量审核作业，对于所有规则校验通过的任务，将免除人工处理；对于出现异常审核结果的任务，将转为人工处理。当然，这里的任务是指在上一环节中识别出的低风险任务，高风险任务仍然建议由人工处理。


    在这个过程中，一个非常重要的概念是“规则引擎”。那么，规则引擎是如何架构的呢？规则引擎可以理解为一个业务规则的解析器，在这个解析器中，原本一个相对复杂的规则被要求拆分为相对简单、可定义的规则包。每个规则包都涵盖了数据输入、算法处理、输出反馈的过程规则。而且规则引擎允许我们定义大量的规则包，并将这些规则包管理起来协同运作，实现了将复杂的人工审核过程自动化处理。


    这件事情说起来简单，但在实际的开发规则引擎实现过程中需要克服几个困难问题。首先，需要让业务团队理解规则引擎中规则包的处理能力，也就是颗粒度。业务人员只有理解了这个概念，才有可能保证所拆解的规则颗粒是系统可实现的。其次，业务人员在理解规则包颗粒度的基础上，将共享作业规则进一步拆解和颗粒化。对于每一个拆解的规则都需要满足规则包所设定的可处理要求，不重不漏，是一个细致活。同时，这些规则高度依靠经验提炼，带来了需求人员的依赖性。最后，是规则的系统化。实际上，不少规则引擎还难以做到完全由业务人员自主定义，通常还有不少复杂的规则包要通过开发来实现。这些规则包需要消耗大量的开发资源，而且如果没有建立很好的需求和开发文档管理，也会造成潜在的规则或算法风险。


    针对这些困难和挑战，我们也期待有更好、更灵活的规则引擎产品出现，使共享服务智能化的发展进入高速时代。


    ### （二）未来机器学习将怎样带来财务共享的进一步智能化


    人机结合模式的应用让我们在财务共享服务中心自动化、智能化的进程中找到了一个阶段性的过渡方法，但这并不是终点，一个好的平台应当尽最大可能地打掉人工干预的断点。通过技术手段，将人机协同进化为人工智能的闭环是未来的必由之路。


    人工智能技术高速发展，特别是机器学习领域的突破，帮助我们在 OCR、风险分级和共享作业三个领域有了一定的突破。


    #### 1. 机器学习提升 OCR 识别率和识别范围


    传统的 OCR 技术是基于一套设定的流程来执行的。首先，对于输入的图像需要进行预处理，如二值化、去噪、倾斜矫正等。其次，进行版面分析，将文档图片切分成一个个小的部分，对于发票来说，这种切分是可以基于发票的版面来进行预先设定的。最后，进行字符切割，将一个个汉字独立出来，并根据预先设立的字库对比来进行汉字识别。但这并不是最终的结果，还可以进一步基于语言上下文的关系来矫正结果，这被称为后处理。在这种模式下，识别率受到多种因素的影响，特别是在字库对比和后校验环节很容易出现问题。


    基于机器学习的 OCR 方式，能够通过对大量带有特征值和结果标签的影像进行监督学习，就像做题一样，告诉 OCR 引擎题目和答案。通过大量训练后，机器学习能够自主找到提升识别率的优化算法，从而持续提升
    OCR 的识别率。这种方法在针对同一性质的原始凭证进行大量的学习训练后，能够有效提升 OCR 的识别效果。


    语义学习在 OCR 的后处理环节同样能够发挥作用。基于机器学习进行持续的语义训练，能够帮助 OCR 在后处理时更接近人的思维逻辑，在几个模糊的、可能的选择中找到更正确的答案。持续的训练，同样能够提升后处理的精准度。


