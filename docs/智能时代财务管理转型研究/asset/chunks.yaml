    ## 教学步骤：财务共享沙盘模拟实验


    教学步骤：财务共享沙盘模拟实验教学过程中，可将学员分成不同小组，每个小组 6～8 人，小组成员分别扮演企业财务共享中心筹建小组的不同岗位角色，共同讨论确定财务共享中心建设方案。每个小组在沙盘盘面上的相应区域完成方案讨论、方案设计、展示和报告任务。


    具体模拟过程中，战略与政策规划中心模拟包含三部分，分别是选项工具摆放、手工描绘和数据计算。选项工具摆放这项工作主要包括建设目标、建设结构、职能定位、建设策略、建设原则、选址因素、选址地点、内部组织规划方法、共享中心人数测算方法。按照小组讨论结果，可选取已有的选项工具在沙盘盘面位置进行摆放，或通过在空白选项工具上填写创新性内容的方式进行摆放。手工描绘主要包括建设结构示意图和内部组织结构示意图。在建设结构和内部组织划分方法确认后，需要在这两个对应空白选项工具上手工描绘出架构示意图。此外，共享中心人数需要测算，并在空白选项工具上手工填写具体数字进行摆放。


    共享业务规划中心模拟包括费用报销、应收核算及收款结算、应付核算及付款结算、工资四类业务，均从制度内容、业务场景（操作岗位、业务操作内容、实物单据）两个方面进行规划统一。可按三步来完成：第一步，差异分析。学员需要分析四类业务在各子公司的现有管理制度和流程是否存在差异，并总结存在的差异点，在差异分析表中简单总结差异内容。差异分析表是学院在沙盘模拟过程中，用于整理分析案例公司各不同业务在管理制度或流程方面存在的差异。第二步，制度内容规划模拟。差异内容总结完毕后，学员需要了解企业期望通过财务共享中心建设达成的业务管理目标是什么，依据此目标确认需要统一的管理制度内容有哪些，并可选取已有的选项工具在沙盘盘面对应位置进行摆放，或通过在空白选项工具填写创新性内容的方式进行摆放。第三步，业务场景规划模拟。学员需要了解企业期望通过财务共享中心建设达成的业务管理目标是什么，依据此目标确认共享后的业务流程是什么，并可选取已有的选项工具在沙盘盘面对应位置进行摆放，或通过在空白选项工具上填写创新性内容的方式进行摆放。业务场景模拟完成后，对于需要纳入共享中心的操作岗位，在其上摆放小红旗代表即可。


    财务沙盘模拟的最后一部分，运营与技术规划中心模拟主要包括：基础环境及设备、信息系统和运营管理制度。学员需要依据已经规划确认的战略与政策内容、共享业务内容，确定建设财务共享中心需要的基础环境及设备、信息系统及财务共享中心建设后需要遵循的运营管理制度。按照小组讨论结果，可选取已有的选项工具在沙盘盘面对应位置进行摆放，或通过在空白选项工具上填写创新性内容的方式进行摆放。


    在模拟完成后，以小组为单位，由每组学员对本组的沙盘模拟结果进行随堂展示，对沙盘盘面的每个环节进行讲解说明，由教师随堂对每组学员展示的沙盘模拟实验结果进行点评，并进行评分，作为总成绩中沙盘呈现的分数；同时，对每组学员沙盘模拟过程中存在的问题或知识点进行总结分析。沙盘模拟实验总结报告在学员完成了财务共享中心的建设规划方案之后进行，是沙盘模拟实验的最后阶段。总结报告将对小组进行的包括建设战略和政策规划、费用报销业务、工资业务、应收业务、应付业务、运营和技术规划等所有实验任务及其预期建设效果进行总结。学员需要以小组为单位整理总结报告，并提交给教师。


    ## 2. 财务共享软件实验课程


    此外，企业数字转型、智能化发展，使财务共享趋向流程自动化和柔性化，因此，财务共享软件实验课程对于人才培养不可或缺。以浪潮 GS 企业管理软件为平台，给学院提供一套模拟企业建设财务共享的基础数据、业务数据和运营管理信息，学员以个人为单位或分成小组，按照既定的操作流程完成财务共享相关的基础数据设置、业务及组织规划、共享业务处理、运营分析等实验操作。在实验课程中，讲师针对每堂课的实验主题，讲解其相关的知识点、软件操作流程和操作方法。学员可以扮演系统管理员、业务员、运营管理人员等岗位角色，登录浪潮
    GS 软件，真实体验不同岗位角色的财务共享相关操作流程。课程主要内容包括：浪潮 GS 客户端安装部署及财务共享中心软件应用介绍、财务共享初始化设置、四类不同业务在财务共享系统中的工作流程、财务共享任务质量管理、共享中心运营分析、报表统计分析等。


    该课程可以单独开课，也可以配合财务共享沙盘模拟实验课程开课。在沙盘课程的基础上，配合软件教学，能够更好地巩固学员所掌握的知识，并提升学员在信息系统中实践的能力，期望通过课程，达到三个学习目标：了解企业建设财务共享中心需要规划的基础数据内容及操作方法；了解纳入财务共享后业务处理的操作流程及操作方法；了解财务共享中心建设完成后，企业运营管理及分析的主要内容。


    本课程建议采用上机考核的方式评定学员掌握软件的能力。实验教学是教学体系中的重要环节，实验动手能力是学员终身受益的基本功，提高学员实际动手操作能力，也是这门课程开设的核心目标。实验课的考核对提升学员软件学习的效果起着决定性的作用，通过上机考核，可以有效激发学员学习的积极性、主动性和创新精神，可以科学合理地评定学员实际的动手能力。


    综上所述，财务共享专业课程建设任重而道远。对于课程的建设，要本着求真务实、与时俱进的原则进行规划，依托“互联网+”的时代背景，将知识的传授转化为对学生综合能力的培养，并贯穿在课堂教学中，为培养符合社会所需的会计人才作出应有的贡献。


    ## 第三节　财务共享服务教育与认证体系


    在财务认证体系领域，除了传统的 CPA、ACA、ACCA 等会计资格认证，随着管理会计的不断深化，CMA、CGMA 等越来越受到财会界的重视。财务共享的出现，不仅推动了教育的变革，也促使一些原本存在的认证体系增加新的考核内容，与时俱进。


    ### 一、管理会计领域认证体系


    财务共享服务教育越来越强调管理会计的重要性，因此管理会计的一些相关证书也应该纳入共享教育的领域。


    #### （一）CMA 认证体系


    CMA 管理会计在企业运营中发挥着越来越重要的作用，实现了财务创造价值的巨大转变。管理会计的预测职能，通过对宏观环境的预测分析、对企业内部产能的预测分析、对企业利润与成本的预测分析，不断指导企业实际业务往前发展，让企业的持续发展变成了可控、健康的进程。管理会计在财务共享服务中也越来越重要，因此现代财务人员不仅需要掌握基础的核算会计，也需要具备相应的管理会计知识，培养管理思想，这样才能在财务共享时代不被淘汰。


    目前，已经存在的管理会计培训和认证体系包括 CIMA、CMA 等。其中，美国注册管理会计师 CMA 的认证体系在全球内的认可度相对较高。CMA 是美国管理会计师协会设立的专业资格，全球
    130 个国家认可，被认为是世界 500 强企业的黄金敲门砖。CMA 客观地评估了学员在管理会计及财务管理方面的相关工作经验、教育背景、专业知识、实践技能、职业道德规范，以及持续学习发展的能力。CMA
    认证能帮助持证者职业发展，保持高水准的职业道德要求，站在财务战略咨询师的角度进行企业分析决策，推动企业业绩发展，并在企业战略决策过程中担任重要角色。


    要参加 CMA 考试，必须先申请成为 IMA 普通会员。对于中国考生，可以通过 IMA 授权的中国培训机构申请入会。


    举办机构：IMA 在全世界共有会员约 68 000 人，主要分布在美国、加拿大及世界经济发达国家。CMA 是美国两个最主要、最权威的会计师资格之一，也是全球最权威的会计资格之一，作为国际上的会计准则和管理标准，CMA
    在全球很多国家都受到了认可，在中国由中国教育部考试中心组织进行考试。


    对于考试资格，具备教育部认证的全日制三年大专学历或者经过教育部认可的学士或者更高的硕士、博士学位的，都可以申请参加 CMA 考试，报考门槛并不高。考试形式采用计算机闭卷考，全球的考试标准都一样。CMA
    考试科目有两门，一门是财务报告、规划、绩效和控制（Financial Planning，Performance and Control），出题内容和比重包含外部财务报告决策（External
    Financial Reporting Decisions，15％）、计划预算和预测（Planned budget and forecast，20％）、业绩管理（Performance
    Management，20％）、成本管理（Cost Management，20％）、内部控制（Internal Controls，15％）；另一门是财务决策（Financial
    Decision Making），出题内容和比重包含财务报表分析（Financial Statement Analysis，25％）、公司财务（Corporate
    Finance，20％）、决策分析（Decision Analysis，20％）、风险管理（Risk Management，10％）、投资决策（Investment
    Decisions，15％），以及职业道德（Professional Ethics，10％）。每门考试时长均为 4 小时。


    通过 CMA 考试后，需要取得两年管理会计实务工作经验，才能获得 CMA 资格。实务经验的认定范围包含：财务分析、预算编制、管理信息系统分析、在政府或企业界级管理会计或审计工作、管理顾问、担任管理会计相关科目的教师等。两年实务经验，可在考试前取得，或在通过
    CMA 考试后七年内取得。取得 CMA 资格后，需维持 IMA 会员资格，并符合持续进修的规定，才能继续保有 CMA 的资格。


    #### （二）CIMA 认证体系


    总部位于伦敦的 CIMA 皇家特许管理会计师公会和总部位于纽约的美国注册会计师协会（AICPA）对外宣布，双方各自的理事会已经审议通过双方的合作计划——组建世界最大的会计师组织并推广一个新的全球性会计资格证书，该新证书命名为全球特许管理会计师（Chartered
    Global Management Accountant，CGMA），新证书将标志着持证人在管理会计、绩效管理、企业战略等方面的卓越能力。


    全球特许管理会计师的推出，旨在全球范围内推广、提升管理会计这个财务与战略结合的职业。CGMA 头衔就是代表着拥有高超的财务技能和管理技能的复合型人才，凭借
    AICPA 和 CIMA 这两大全球最负盛名的会计组织所享有的资源与声誉，CGMA 得到了全球范围的公认。


    CIMA 是全球最大的管理会计师组织，AICPA 是全球最大的职业会计师组织，会员遍及财务与会计的各种岗位。双方组建的新组织将拥有 55 万名会员与学员，成为目前全球最大的会计师组织。凭借
    AICPA 在北美的实力和 CIMA 在欧洲、中东、非洲及亚太地区的影响力，将有助于提高管理会计在美国的业界地位，并有利于管理会计在全球范围内的推广。


    ### 二、财务共享领域认证体系


    #### （一）ACCA 认证体系


    越来越多的企业开始通过共享服务外包来提高服务质量，降低成本和提高效率。作为一种高速发展的财务模式，共享服务已经成为财务转型中一个重要的组成部分。目前，全球在该行业已有超过
    75 万名财会工作者。借助全球共享服务领域的迅猛发展势头，ACCA 适时听取首席财务官及企业的需求，推出 ACCA 全球共享服务证书，帮助有志从事共享服务的人士拓展职业机遇。


    在该证书中国首发仪式上，ACCA 财务运营执行总监郑孟德说：“全球共享服务已不仅仅是用于提高各职能部门合作效率的手段，它是企业在共享服务管理方面的一个基本转变。采用全球共享服务模式，将使财会部门被释放出来承担更高层级的任务，从而创造更高的价值。因此，ACCA
    认为是时候引领变革，通过提供全新的资格认证来帮助企业培养高效的团队，实现财务转型。”郑孟德还表示，全球共享服务模式超越了企业的传统部门，它的有效实施通常取决于企业是否从一开始便建立了有效的领导结构，而且需要来自整个企业，包括董事会、首席执行官和首席运行官的支持。


    #### （二）全球共享服务证书


    一直以来，ACCA 通过其专业资格、大量的调研项目，以及与企业和政府机构的合作，为共享服务行业的发展提供支持。在现有资源的基础上，ACCA 针对共享服务领域专门设计了三类全新的专业资格证书。


    全球共享服务基础证书：该证书包含独立的在线评估课程，涵盖全球共享服务企业员工所需要的基础知识与技能。


    全球共享服务证书：该证书包含基础证书的五个模块和 ACCA 资格课程中相关的财务和管理会计知识。它能够有效提升员工的财务专业技能，以便胜任更有挑战的角色。


    全球共享服务高级证书：该证书更注重在高级财务管理、管理会计和绩效管理方面来提高员工的共享服务高端专业技能，顺利完成全球共享服务证书，不仅能帮助企业员工获得共享服务工作所需的专业知识，还将为他们进一步学习
    ACCA 资格课程，成为技能全面的财务管理人才打下坚实的基础。


    ACCA 认为，财会专业人士在共享服务和外包领域的发展中，将会在全球各地面对无穷的职业机遇。目前在中国，很多城市已经成为主要的共享中心。成都天府软件园作为国家服务外包基地城市示范区，已建成
    29 个财务共享中心。自 2012 年 ACCA 与天府软件园签订合作备忘录以来，双方共同为园区企业财务共享服务的发展和国际人才需求提供支持。


    2017 年 6 月 21 日，ACCA（特许公认会计师公会）与中兴财务云在上海联合宣布推出首个全球共享服务证书中文版，由中兴财务提供独家学术支持，实现中文课程学习和考试认证，推动共享服务在中国的发展，浪潮也将为此作出自己的贡献。


    GBS 全球共享服务中文版课程定位于中国的集团企业与高等院校，以及共享服务或外包服务的相关从业人员，中文版课程将更易于中国财会人员学习与理解，同时能够为学员提供共享服务必备的知识储备，并提高学员的相关从业能力。ACCA
    在 2016 年推出了共享服务行业的人才培养认证体系—全球共享服务（GBS）证书，旨在将战略前瞻思维和高超专业技能相结合，培养塑造全球商业未来的现代专业会计师。证书配套的培训课程涵盖了共享中心员工需要具备的全方位知识，能够帮助企业完善培训体系，加速全球共享服务进程。


    # 第五章　智能时代财务组织与模式变革


    ## 第一节　智能时代财务组织的简化


    财务组织如同生物一样，有着自身发展和进化的规律。在不同的历史时期，财务组织是与当时的社会、经济及技术环境相匹配的。时至今日，财务组织的发展已经进入了与智能化时代环境相适配的时期。对于“80
    后”的笔者来说，说实话，谈论组织进化史这样的话题有点儿压力。事实上，对于 2000 年以前的财务演变，笔者是没有经历过的，只能根据历史信息检索及和老财务们的沟通作出大致的判断。而
    2000 年后的二十年时间，是笔者亲身感受并参与其中的，在此做一些浅显的提炼，姑且称作“极简财务进化史”。


    我国的财务发展可以从中华人民共和国成立后开始谈起。应该说，在几十年的历程中，财务整体还是在发生着改变的，这种改变也是和整个中国社会的进步相匹配的。我们不妨把这个进化历程划分为几个阶段：入门阶段（财会一体阶段）、初级阶段（专业分离阶段）、中级阶段（战略、专业、共享、业财四分离阶段）、高级阶段（外延扩展阶段）。如同社会的发展一样，第一个阶段历时漫长，而后续几个阶段则在短短的时间内陡然加速，实现迅猛的发展。让我们逐一说起。


    ### 一、入门阶段：财会一体阶段


    从中华人民共和国成立到 20 世纪 70 年代末，大约三十年的时间，财务与会计并没有那么显著的分离，即所谓的财会一体。事实上，在这个过程中，会计对处于计划经济时期的中国来说是更为重要的。而在这个阶段，财务管理实际上更多的是服务于内部控制和成本管理。一方面，要保证不出现经济问题，需要针对资金和资产的安全投入必要的管理；另一方面，需要从降低成本上获取管理业绩。事实上，在这个阶段，有不少企业的成本管理都还是有可圈可点之处的。在入门阶段，财务管理更多地被视作会计的一个构成分支。


    ### 二、初级阶段：专业分离阶段


    所谓合久必分，经历了近三十年的财会一体后，随着改革开放的到来，企业的经营目标发生了很大改变。随着市场经济得到确立，企业更多地关注于自身的经营结果，也就是怎么赚钱的事情。在这个背景下，财务的地位发生了一些改变，从一个单纯“管家婆”的身份，转变为一个对内能当好家，对外能做参谋的新身份。


    同时，财务组织也发生了变化，一个典型的特征是在 20 世纪 80 年代的十年中，财务管理作为一门独立的学科被分离出来，而企业中也逐渐完成了财务管理部和会计部的分设。这样的好处是专业的人做专业的事情。在财务管理范畴中也逐步涵盖了越来越多的东西，如预算管理、成本管理、绩效管理等，会计则涵盖了核算、报告、税务等内容。在后期，另一个专业领域也被不少大公司分离出来，即资金管理。你可以看到很多企业在财务管理部和会计部以外都设置了资金部。


    从上面的变化可以看到，基于专业的分离趋势在财务组织中开始出现，我们把这个阶段叫作专业分离阶段，如图 5-1 所示。


    ![img](img/txt005_1.jpg)


    图 5-1　专业分离阶段


    ### 三、中级阶段：战略、专业、共享、业财四分离阶段


    从 20 世纪 90 年代开始到 2015 年这个阶段，是财务领域快速创新、积极变革的阶段，所以说这个阶段还是很有技术含量的。实际上，战略、专业、共享、业财四分离这个概念最早是咨询公司从国外引入并流行起来的。如图
    5-2 所示，财务组织有两个三角形的变化，左边的正三角形里基础作业比重很大，右边的倒三角形里管理支持比重很大。正是在这种思想的引导下，国内很多企业开展了财务共享服务中心及业财一体化的建设。而这两大工程带来的直接影响就是基础作业分离到了财务共享服务中心，业务财务队伍成为财务组织的一个很重要的配置。


    ![img](img/txt005_2.jpg)


    图 5-2　传统阶段到四分离阶段的职能转变


    在市面上流行的说法中还有一个三分离的概念，这个概念没有将专业财务与战略财务分离，统称为战略财务。但根据笔者的管理咨询工作实践，战略财务和专业财务还是有一定的差异性的，分离后更为清晰。战略财务主要聚焦集团或总部的经营分析、考核、预算、成本管理等领域，专业财务则聚焦会计报告、税务、资金等内容。财务共享是会计运营的大工厂，而业务财务则是承接战略财务和专业财务在业务部门落地的地面部队。


    如图 5-3 所示，战略、专业、共享、业财四分离的出现使财务的格局上升了一个层次。应该说，目前国内大中型企业的财务建设基本上都是按着这种模式来的，并且取得了不错的成效。


    ![img](img/txt005_3.jpg)


    图 5-3　战略、专业、共享、业财四分离阶段


    ### 四、高级阶段：外延扩展阶段


    高级阶段的财务组织说起来就是发展到一定阶段，闲不住了，就开始“折腾”起来，这也是与当下技术与概念日新月异的社会环境相匹配的。从这个角度来看，财务人并没有想象中的那么保守，反而具有一定的自我突破的决心。高级阶段在前面四分离的基础上进一步扩展了财务工作内涵的外延，笔者称之为外延扩展阶段。


    到了高级阶段，就需要有创新能力了。从 2016 年开始，整个社会的技术进步也在加速，移动互联网到了后期，人工智能开始起步，大数据概念普及，套装软件厂商开始迫不及待地布局云服务。作为财务，仅仅抱着旁观态度显然是不够的。


