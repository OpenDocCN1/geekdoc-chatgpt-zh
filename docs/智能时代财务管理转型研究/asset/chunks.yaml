    # 财务柔性管理与智能化转型


    安应民在《企业柔性管理：获取竞争优势的工具》中说：“从本质上来说，柔性管理是一种对‘稳定和变化’同时进行管理的新战略，它以思维方式从线性到非线性的转变为前提，强调管理跳跃和变化、速度和反应、灵敏与弹性，它注重平等和尊重、创造和直觉、主动和企业精神、远见和价值控制，它依据信息共享、虚拟整合、竞争性合作、差异性互补等实现知识由隐到显的转换，为企业创造与获取竞争优势。”[\[7\]](#txt001.xhtml#footnote_content_txt001_7)


    智能时代的到来，释放出要求财务进行自我改变的强烈信号，同时也给我们创造了一个改变的机会。人工智能将越来越多地帮助我们完成原本需要“刚性”生产完成的工作，如财务审核、会计核算、资金结算等，而财务人员精力的释放将帮助我们有机会去重新构建创造能力和柔性管理的能力。


    在智能化大背景下，财务组织的柔性主要体现在以下两个方面。


    ## 财务组织的柔性体现


    ### （1）组织架构的柔性

    在传统的财务组织中，层级式架构最为常见，这也具有极强的刚性。而这种架构模式并不利于创造性的发挥，反而在很多时候会成为财务组织创新和能力提升的束缚。而柔性的财务组织则可以更多地考虑减少组织层次，建立扁平化的财务组织。此外，可以更多地使用团队的架构方式。基于阶段性的创新目标灵活地设置团队，能够更好地适应智能化的组织需求。


    ### （2）财务文化的柔性

    在传统财务组织中，文化方面更多体现的是严谨。这与需要充分发挥技术想象力和进行场景创新的智能化的诉求是不相匹配的。因此，财务组织中文化的改变也是必要的。在组织文化的构建中，应当在更多地鼓励协作型的文化的同时，构建鼓励创新的文化氛围，以促进财务组织从刚性向柔性的转变。此外，适度引入市场文化，让财务工作能够适度地以市场化的方式参与公司经营，对柔性文化的建立也是很有帮助的。


    ## 智能化带来的团队和人员能力升级


    财务转型迈入智能化阶段后，不仅对运营模式、组织带来影响，对财务团队和人员的能力升级也带来了极大的挑战和要求，这种能力升级主要体现在财务人员创新能力升级和财务人员知识结构升级两个方面。


    ### 1. 财务人员创新能力升级

    智能化时代对财务人员的创新要求和传统财务时代有了显著不同，创新的压力来自多个方面。


    首先，智能化将在当前及未来相当长的时间内，对整个社会经济带来重大改变。在这个过程中，传统的商业经济模式会快速发生变化，每个企业集团的主业都会受到这一浪潮的影响，并发生深远、快速的变革。财务作为每个企业必备的管理部门，其重要的使命之一是帮助企业管理层实现战略的落地，并能够为企业的经营发展提供有效的决策支持。在企业主业发生快速变化的时候，财务的创新能力的提升如果没有办法跟上企业发展的节奏，可能会对企业的经营发展带来不利的影响，或者说难以起到应有的支持作用。


    其次，财务管理的方方面面都在因为智能化的出现而发生各种改变。财务人员自身如果在这一过程中没有认识到，或者说是应对得不及时，将直接导致所在企业的财务管理水平落后于市场，无论是财务的运营效率、决策支持水平，还是资源配置能力等各个专业领域，都会受到影响，甚至出现瓶颈。因此，在财务的专业领域积极地提升创新能力至关重要。


    那么，对于一个被广泛认为需要严谨地开展工作的群体来说，如何提升创新能力呢？如图1-7所示，可以从四个方面着手提升财务创新能力。


    ![img](images/txt001_7.jpg)

    图1-7　提升财务创新能力的四个方面


    首先，在实现财务创新本身就困难的情况下，应该将创新的方向聚焦，并保持与公司发展战略的一致性。财务创新并不是孤立的，当财务创新的目标与公司发展战略的目标高度一致时，财务创新能够获得最大化的资源保障。与此同时，管理层也容易认同和理解财务的创新工作，避免不必要的沟通和解释。


    其次，要在财务中打造鼓励创新的文化环境。创新本身并不是一件简单的事情，应该建立必要的机制，对于积极作出管理创新的财务人员给予鼓励或奖励。通过对创新的正向激励，让一线的财务人员有意愿参与到这一过程中去，而不是将创新作为机械的任务来看待。


    再次，要建立适合创新的组织环境。在层级森严的组织中是很难孕育出创新精神的。因此，在鼓励创新的同时，要适度打破组织边界，让跨团队的交流成为可能。项目制是打破组织边界很好的工具，不妨考虑将财务项目作为创新的摇篮。


    最后，创新本身就是一种尝试，对于财务人员的创新试错要有一定的包容性。在创新的过程中，很多新的技术流程都需要经过实验的验证。在创新型企业中，往往对财务人员给予了极大的包容性，甚至在很多时候鼓励财务人员试错，以取得创新成功。因此，好的创新生态应当具有技术试验环境，让大家能在不断的尝试中找到正确答案。这一点对财务人员尤为重要，因为财务人员对创新的态度本就高度谨慎，一旦受到打击，将严重影响其积极性。


    结合以上四点着手进行财务团队创新能力的升级，将为财务转型迈入智能化阶段奠定很好的基础。


    ### 2. 财务人员知识结构升级

    在智能化阶段，财务人员的知识结构也面临着极大的升级压力。在传统财务组织中，财务人员更多的是专业路线，也就是说，在某一个专业领域，如核算、资金、税务等方面从最基础的工作做起，不断丰富自己的知识结构，通过多年努力成为某一领域的专家。这样一条发展路径在传统财务发展阶段是无可厚非的，也是大多数财务人员的成长历程。


    但必须要认识到，随着智能化阶段的到来，很多新进入财务工作领域的人员已经不再有机会经历这样一条发展路径。一方面由于技术的发展，基于网络的专业协同和专业分工变得越发主流，这使从一开始就迈入特定基础工作领域的财务人员很有可能在后续的多年中始终没有机会接触到更大范围的知识领域。另一方面由于技术的进步，越来越多的基础工作会被计算机替代，这使得新入行的财务人员根本没有机会接触到最基础的财务业务。


    在这种情况下，团队中财务人员想要在智能化阶段发挥其价值，就必须要慢慢脱离传统的职业发展方式，从一开始就树立全局观和系统观，及早构建完整的财务知识结构的框架体系，知道财务各职能中的模块构成，以及各模块的相互作用关系。


    在这一框架体系的支撑下，企业应当鼓励财务团队成员构建自己更为宽阔的专业知识体系。通过系统化和全局化思维，先构建一个知识面，再逐渐加深知识面的厚度，同时选择少数专业领域重点钻研。这种团队人员的发展模式能够让财务人员在智能化阶段更好地适应多变的技术环节，并能够为及时调整自身的发展方向打下基础，从而具有更大的职业弹性。


    综上所述，智能化阶段的到来将全面驱动财务从模式、组织、文化、人员多个方面进行转型。成功转型的财务组织也必将为企业经营迈入智能化阶段提供巨大的助力，这也是财务人员应有的贡献和价值。


    # 二、智能时代的财务管理实践升级


    智能化带来的不仅是观念的转变，在财务管理的实践中，我们还能够看到越来越多的智能化应用场景，这些场景的落地也让财务管理能力不断升级。财务的整体框架包括战略财务、专业财务、业务财务、共享服务四个方面，下面分别从这几个方面展开智能化影响的探讨。


    ## （一）智能化与战略财务


    战略财务包括战略与业务支持、财会控制机制、价值管理、经营分析与绩效管理、全面预算管理等多个方面。


    智能时代的到来对企业的经营将产生重大影响，各行各业在这个过程中都或多或少地会被改变。企业会成为智能服务的提供商，或者成为智能技术研发的参与者，也可能在当前的业务模式中引入智能化工具，创新商业模式，提升竞争力。无论如何，智能化会对企业未来的经营产生重要的影响。部分公司会在战略层面进行调整，也有一些公司会进行战术层面的适配。


    战略财务要能够敏锐地跟上企业的战略和经营变化的步伐，主动对公司的战略或战术改变提供支持，而非被动响应。


    在战略财务领域，智能化技术的影响主要集中在经营分析和全面预算管理两个方面。


    ### 1. 智能化对经营分析的影响

    什么是经营分析体系？经营分析并不是简单地做一些分析报表。对于企业来说，要让经营分析能够体系化并且发挥管理价值，需要将经营分析构建在一套相对稳固的机制之上。


    对于经营分析来说，其核心是由数据、指标和报表三个层次构成的，如图1-8所示。


    ![img](images/txt001_8.jpg)

    图1-8　经营分析体系的构成


    数据比较容易理解，有了丰富的数据积累，我们才有可能展开分析。无论是传统阶段的财务，还是智能化阶段的财务，数据都极其重要。而在智能化阶段，数据的范围更是从结构化数据扩展到了非结构化数据，大数据概念的引入也让经营分析有了更多的可能。在经营分析体系中，要构建一个好的数据基地需要企业对数据仓库、数据集市有一个清晰的规划和设计，对数据的定义、标准、来源和采集有清晰的业务逻辑。当然，数据仓库和数据集市都是数据的载体，要想避免数据垃圾的产生，系统本身的数据质量要有所保障。而对这种数据质量的保障来自前端业务流程和信息系统的有效搭建和管理。


    指标是一种衡量目标的单位或方法。当我们进行经营分析时，会围绕企业经营的目标来设定一些衡量标准，这些衡量标准能够评价经营结果是否达到了设定的目标，从而帮助我们进一步提升企业的经营管理水平，这些衡量标准就是经营指标。指标的管理在经营分析体系中尤为重要，好的管理体系要构建企业的指标树，并定义每个指标的名称、维度和维度值。一套清晰有序的指标体系能够帮助企业集团更透彻地看清楚自身的经营情况和管理水平。


    经营分析结果的展示，也就是报表，实际上就是将各种指标的不同层级维度交叉组合起来进行应用的产物。因此，在搭建报表体系时，我们要先明晰经营管理者到底需要看到什么，在明确需求后，选取能够说明问题的指标，并在匹配和管理对象相关的维度信息后进行组合展示。此外，在报表的指标组合中，我们还经常需要用到使用说明来解释指标。


    在理解了经营分析体系后，我们再来看智能化对经营分析的影响。


    智能化技术将对经营分析的视角和工具方法带来影响。从分析视角上来说，传统经营分析所受到的数据的局限性将被打破。在大数据的基础上，能够从因果分析向相关性分析增强。由于数据的边界从企业内部延展到社会化数据，对于KPI、经营分析报告、市场对标等职能都可能获得更加可靠的数据基础，从而对经营分析结果的可用性带来更大的帮助。


    而在工具方法方面，大数据和云计算的结合应用将使经营分析变得更加灵活。二者的结合能够为经营分析提供更加强大的数据采集、数据捕获和数据处理服务，使经营分析的范围得到大大的拓宽。同时，大数据的非结构化数据的处理能力也能够帮助企业在进行经营分析时更好地处理市场上与企业相关的热点信息，将新闻、微信、微博等社会化媒体的信息纳入经营分析的视野。


    此外，人工智能技术的发展也将使经营分析的方法从经验分析向算法分析演变，使更为复杂的分析能够得以实现。同时，基于机器学习、算法的自我优化，能够使经营分析的能力实现持续提升。


    ### 2. 智能化对全面预算的影响

    预算实际上是一种对企业资源的配置方式，当股东设定了经营目标后，业务单位要达成这些经营目标就需要匹配相应的资源。从契约的角度来看，如果把预算作为一种契约，那么一方是企业的股东，另一方是企业的经营者。资源本质上属于股东，业务单位作为经营者向股东承诺经营目标，而股东向经营单位承诺支持其实现经营目标所需要的资源。当然，在经营目标达成后，会有相应的绩效激励，这又是另一个层次的契约关系。


    因此，在企业进行预算管理的过程中，预算编制的核心是提出股东和经营单位都能够接受的资源配置方案，也就是在经营目标承诺和资源承诺上找到平衡点。


    在企业预算管理的过程中，也就是资源配置的过程中会遇到一些难点，包括契约双方如何建立信任，使用怎样的标准来进行资源配置，如何提升资源配置效率，如何进行资源配置效果检验等问题。这些问题在传统财务管理阶段并不容易解决，往往会通过变通和妥协的方式来解决。但在智能化时代到来后，这一情况将有所改观。


    其一，在制订经营计划和预算编制过程中，智能化技术能够发挥重要作用。由于经营计划和预算编制是资源配置的过程，资源配置的方向、权重是否合理是预算编制结果是否能够发挥价值的重要评价标准。大数据分析能够帮助验证业务部门在资源投向上所讲故事的真实性，能够展开更为清晰的资源投向和业绩达成的相关性分析，从而使得财务有能力对资源配置投向进行评价。


    其二，在预算预测的过程中，能够基于大数据、机器学习等方法构建更为复杂和完善的预测模型，能够展开大量复杂场景下的敏感性分析，从而提升预算预测的可靠性和对未来复杂不确定性的预判能力。而现在，让人更加期待的模拟技术正在出现，引入人工智能的虚拟商业生态系统能够让未来的预测建立在与真实社会相仿的现实模拟环境中，如在拟真的环境中投放广告、设置不同的预算投入、模拟用户的真实反映、评价预算的投入效果等都可以在未来成为现实。


    ## （二）智能化与专业财务


    专业财务可以说是财务框架几个模块中最为成熟的部分，是企业财务管理的基础。也就是说，没有战略财务、业务财务和共享业务都是可以的，但如果没有专业财务就会导致整个财务体系无法运转。当然，成熟的背后也意味着更大的提升空间。


    专业财务领域包括会计报告管理、税务管理、资金管理、合规管理、管理会计、成本管理及财务风险管理等多个领域。智能化阶段对财税管理、管理会计、风险管理有较大的影响。


    ### 1. 智能化对财务报告与税务管理的影响

    会计与报告在传统的会计电算化、财务信息化过程中一直是重要的建设领域，财务的各项信息化工作在早期也都是在这个领域开展的。智能时代的到来对会计与报告管理领域信息化的提升带来了契机。


    在报告领域，基于机器学习技术，可以实现智能报告。将会计报告交给人工智能来处理并非不可能，现在的人工智能写出的市场研究报告已经让人难以区分背后是资深研究员还是机器。基于相对结构化的报告范式，再加入人工智能基于市场反应的学习，智能报告或许对股价的提升会越来越有帮助。


    此外，在税务管理中，还存在非常多可以借助信息技术实现自动化的领域，如对发票真伪的查验、发票认证、纳税申报等都可能引入智能化技术，进一步解放人力。


    ### 2. 智能化对管理会计的影响

    管理会计的应用十分依赖信息系统的建设。在通常情况下，管理会计需要处理大量数据，如果缺少信息系统的支持，就很难实现日常的机制化运转。但在传统模式下，管理会计在支持系统的运算性能方面存在瓶颈，在性能难以支持的情况下，需要通过简化业务逻辑的方式来满足性能的要求。


    管理会计技术支持的三个阶段，如图1-9所示。实际上，从多维数据库的出现开始，管理会计的性能已经得到了很大的改善。传统模式下的关系数据库对于大数据量的数据的处理，非常费时且性能较差，开发周期长，成本高。而多维数据库结构简单、容易理解，开发相对容易，却导致出现了很多冗余，多维数据库属于使用空间换取时间的解决方式。


    ![img](images/txt001_9.jpg)

    图1-9　管理会计技术支持的三个阶段


    随着智能化时代的到来，管理会计将更多地从技术性能方面获益。针对管理会计最大的痛点——运算性能不足，在物理架构、硬件等方面的技术进步能够使这些问题有所缓解。基于云计算架构来搭建的多维数据库，或直接使用内存数据库来进行相关的管理会计数据处理，都有优化数据性能的机会。


    另外，大数据技术架构的发展也为使用大数据平台来解决多维数据处理问题提供了新的技术思路。在实践中，已经有部分企业尝试着将新的管理会计的数据处理搭载在大数据平台中。基于大数据平台的技术优势，突破计算性能的瓶颈，使得管理会计系统能够处理更多的数据维度和更为复杂的逻辑。


    ### 3. 智能化对风险管理的影响

    在专业财务中的风险管理领域，智能化也在发挥作用。


    智能技术能够从事前、事中、事后三个层次，防范财务操作风险，如图1-10所示。


    ![img](images/txt001_10.jpg)

    图1-10　智能技术对风险管控三阶段的支持


    从事前防范角度来看，在传统模式下，我们所构建的风险监控体系是基于经验和分析的，但这种构建方式可能在认知完整性上存在缺陷。机器学习方法能够基于财务业务流程中大量的交易及风险事件，发现新的风险规则，从而补充和完善现有的风险指标体系，加强对事前风险的防范能力。


    从事中控制角度来看，基于经验的规则的系统化能够实现初级人工智能的应用。通过大量的规则，我们能够发现财务交易中的潜在风险事件，并能够对一些风险事件进行直接拦截。此外，基于数据积累，我们能够对每一笔单据进行风险分级，针对不同的风险等级配置不同的控制流程，从而提升风险管控能力。同样，机器学习技术能够基于经验的规则积累，进行持续的训练优化，持续提升风险控制能力。而基于企业内外大数据的积累和挖掘，能够建立更为丰富的单据风险分级规则模型，使单据的风险分级更加准确。


    从事后分析角度来看，能够建立起不同类型的分析模型以发现风险线索，如基于决策树的模型、社交网络的模型、聚类分析的模型等。这些模型的构建能够帮助我们在事后进一步进行操作风险审计和问题发现，通过跨交易单据的分析，发现更为广泛的风险线索，并基于风险线索进一步发现和解决问题。同样，大数据和机器学习有助于我们持续完善各种分析模型的规则，从而提升风险线索发现的精准度。


    智能化技术在风险领域的应用是相对容易起步的，也适合企业作为迈入智能化阶段的前期选择之一。


    ## （三）智能化与业务财务


    业务财务本质上是战略财务与专业财务在业务机构端的延伸，也是财务共享服务在业务前端的支持与保障。因此，从业务职能的范围来看，智能化对其的影响与对战略财务、业务财务以及共享服务的影响是类似的。我们可以从业财融合的视角来关注智能化与业务财务的关系。


    在智能化与业财融合方面，有两个技术对业财融合有比较重要的影响，分别为会计引擎与区块链。


    ### 1. 会计引擎与业财融合

    为什么说会计引擎与业财融合的关系极其紧密呢？其根本原因是业财融合最大的挑战就在于业务信息向财务信息转换过程中的数据需要保持一致。


    业务和财务都是按照各自的语言体系来进行经济事项的记录和反映。业务系统中记录的是每一笔交易的明细，在进行记录的时候只是从业务管理视角出发来记录交易中的各种业务细节。但很多时候，这种从管理角度出发的信息记录存在大量个性化和不规范的表达，难以最终汇集成企业经营的完整信息。


    而对于财务记录来说，它是通过准则的约束和规范，将各种差异化的业务信息的表达最终转换为统一的会计语言，并反映出企业的实际经营情况。但由于会计语言的规范性要求，很多信息在以会计语言记录的时候进行了舍弃。


    正是由于业务和财务两种语言体系的差异，信息从业务向财务转换的过程出现了一些困难和挑战。一方面，转换过程存在同样的信息其表达方式却不一致的问题，需要进行语言的对等翻译；另一方面，转换过程中存在数据出现偏差导致数据不一致的情况，需要进行业财核对。


    如何解决以上问题呢？在业务系统与财务系统之间构建具有高度灵活性的会计引擎能够起到一定作用。


    会计引擎是通过系统设计一个翻译器，针对不同的业务系统和财务系统之间的数据关系，在会计引擎中进行信息转换的初始配置。随后，在业务发生的过程中，每笔交易都能够最终通过会计引擎翻译为会计分录，完成从业务信息到会计信息的转换。


    会计引擎本身并不是智能化的产物，目前市场上的大多数会计引擎被集成在不同行业的业务系统中，以解决行业的特性问题。但随着技术的发展，会计引擎逐渐被抽象为独立的产品，并有可能引入智能技术进行产品升级。

