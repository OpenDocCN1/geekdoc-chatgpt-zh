    \ A，EDDY D，DOUGHTY J.Evidencing continual professional development：Maximising\
    \ impact and informing career planning\\[J\\].Journal of Medical Imaging and Radiation\
    \ Sciences，2015，46（4）：361-364.\n\n\uFEFF\n\n# 第四章　智能时代财务教育改革\n\n## 第一节　智能时代大学财务教育的变革\n\
    \n教育为什么要改革，大学在智能时代能够做些什么，如何构建高校财会教育能力几个角度切入。最后，再一起来看看那些已经行动起来的高校正在做的事情。如图 4-1\
    \ 所示。\n\n![img](img/txt004_1.jpg)\n\n图 4-1　智能时代大学财会教育分析\n\n### 一、大学财会教育的窘境\n\n\
    对于大学财会教育来说，并不是大家不愿意作出一些改变，而的确是存在着一些客观的困难和挑战。实际上，如果大家用心去观察，就都能看到这些无奈。今天，企业抱怨找不到好的人才，但同时又有更多的大学生为无法就业而苦苦纠结，听说不少学生从大三开始，就对未来的就业和职业发展感到有些悲观和忧虑。虽然这些问题早就存在，但竞争毕竟没有今天这么激烈，就业机会还是很多的。\n\
    \n那么，是什么造成了大学财会教育的窘境呢？笔者总结出下面几点原因。\n\n#### （一）具有创新能力和实践经验的师资不足\n教书育人，好的师资是极其重要的。在这些年里，笔者没有中断学习，听过很多不同高校名师的课程。在那些优秀高校的顶级师资中，有不少教授兼具创新能力和实践经验。一方面，这些优秀的教授没有停止过自我学习；另一方面，他们更多的是向企业管理人员授课，从而以另一种方式积累着实践经验。\n\
    \n但同时，国内还有不少高校教师是没有这样的声望和条件去获得创新和实践的机会的。由于大学教师任职的门槛高，企业中有实践经验的管理人员也基本没有进入大学任教的条件。这就造成了大学里具有创新能力和实践经验的师资不足。\n\
    \n#### （二）学生过多且对专业热爱不足\n很多学生在高考填报志愿时，并没有认真地思考过选择财会这样一门专业对自己来说到底意味着什么？自己是否会真心热爱这门学科？没有兴趣的学习注定是低效的，并且学习者也难以成长为最顶尖的那一批人。\n\
    \n当然，很多学生根本就没有自己进行选择或者决定的机会，家长包办已经成为一种常态。笔者当时也没有这个机会，之所以学会计专业是因为学校保送，而保送学生必须读会计专业。但是好在笔者是真心热爱这一专业，这也使笔者后续的学习有了更多的动力。\n\
    \n这种非个人意愿作出的选择，再结合有些媒体不负责任地鼓吹财会专业的高就业率，造成了大家对这个行业的认知不足和一拥而入。每年社会上都会出现上百万的财会专业毕业生，以致于毕业生的就业成为难题。\n\
    \n#### （三）证书导向，不是万能药\n当学校的教育者们意识到就业是个问题后，开始研究怎样解决这个难题。考各类财会证书开始在大学中流行，学生的核心任务似乎突然间变成了考证。当然，相比那些连证都不考、完全消极应对就业压力的学生来说，考证的学生还属于能积极应对就业挑战的。但这背后也带来了新的问题。\n\
    \n在学校中流行的各类职业证书本是针对在职人士的，而且当其积累了一定的工作经验以后再来学习会更有价值，而学生单纯以应试为目的，其学习效果差了很多，拿到证书的学生也未必能够应对复杂的工作实践场景。当然，一些国内外的财会公会、机构也在积极扭转这种局面，通过在学校中开展各类素质提升活动来帮助学生成长。\n\
    \n#### （四）财会是一门技术活，在校学生缺乏实践的机会\n财会专业本身，特别是会计专业，可以说是一门技术活，经验的积累很难一朝一夕做到。而学校中设置的很多课程还是偏理论性的，学生一旦面对实务，则往往难以上手。\n\
    \n这种情况的出现是因为很多高校和企业脱节，学校教育难以模拟还原真实的实操场景，虽然近些年出现了各类实操实验课程，但多数还是属于纸面设计，在信息系统的拟真性上还有很大的差距。也有一些高校试图将学生推荐到企业实习，但由于学生能力不到位，本身做不了什么，而且企业也很难为了短期实习投入大量的精力并从中受益，实习这件事情在多数情况下流于形式。\n\
    \n#### （五）智能化结合的条件严重不足\n在智能时代，高校和社会实践就更容易脱节了，不但和智能化结合难，而且多数高校还处于和信息化难以有效对接的阶段。对于财会学科，国内很多院校只能基于一些传统的本土产品构建学习环境，对于\
    \ ERP 的应用，以及更为复杂的管理会计、共享服务、经营分析等应用场景则很难构建环境，更谈不上构建智能时代所需要涉及的大数据、云计算、区块链、人工智能等技术领域的学习环境。\n\
    \n### 二、大学财会教育改革的必要性\n\n对于高校来说，怎样打破这样的窘境呢？在计算机技术出现的时候，很多高校的财会专业没有抓住机会，在学校中的计算机专业如火如荼发展的时候，财会专业还在\
    \ Excel 和会计电算化中苦苦挣扎。在互联网出现的时候，差距进一步被拉大，学校难以为财务专业搭建一套完善的拟真网络化作业平台，学生难以在网络环境中学到互联网时代的分工协同。而今天，高校的财会教育改革势在必行。\n\
    \n#### （一）面向未来的新机会稍纵即逝\n机会并不是随时都会来临的，也不会轻易出现在没有准备的人面前。如我们前面所说的，在信息化和互联网时代来临时，多数高校都没有抓住机会。而今天，智能时代已经到来，如果错过了这个机会，有可能会错过在未来数十年中最大的一次机遇。\n\
    \n在从互联网时代向智能时代转变的过程中，技术会呈现爆发式的演进，已经没有机会让我们再像过去那样，花上十年、二十年的时间来慢慢学习、慢慢转型。如果自身没有做好准备，机会将稍纵即逝，而在第一个环节被落下后，将难以追上后续的步伐。想要做好准备，就必须有点儿疯狂的精神和行动。\n\
    \n#### （二）财会专业学生的就业竞争前置为高校教育能力的竞争\n财会专业毕业生的竞争环境已经到了非常严重的程度。一方面，财会专业毕业生的数量还在持续增长；另一方面，有很多单位没有招聘应届财会毕业生的计划，财会专业学生整体就业形势异常严峻。\n\
    \n"
