    # 第六章　智能时代财务创新实践


    ## 第一节　智能时代战略财务创新


    ### 一、智能时代战略财务框架详解及智能增强


    智能时代战略财务管理的各项工作内容都会受到新技术的影响，包括直接的技术影响，以及智能技术改变整个社会、经济形态后带来的间接影响。在这里，我们基于 CFO 基础能力框架进行详细讲解，并进一步谈一谈战略财务在智能时代会发生怎样的改变。


