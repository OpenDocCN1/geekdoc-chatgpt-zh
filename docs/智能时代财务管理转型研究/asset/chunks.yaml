    2.智能增强


    智能化技术将对经营分析的视角和工具方法带来影响。从分析视角来说，传统经营分析所受到的数据的局限性将被打破。在大数据的基础上，能够从因果分析向相关性分析增强。由于数据的边界从企业内部延展到社会化数据，对于KPI、经营分析报告、市场对标等职能都可能获得更加可靠的数据基础，从而对经营分析结果的可用性带来更大的帮助。


    而在工具方法方面，大数据和云计算的结合应用将使经营分析获得更加灵活和丰富的分析能力。二者的结合，能够为经营分析提供更加强大的数据采集、数据捕获和数据处理能力，使经营分析的边界大大得到延展。同时，大数据的非结构化数据的处理能力能够帮助企业经营分析更好地面对市场上与企业相关的热点信息的处理，将新闻、微信、微博等社会化媒体的信息纳入经营分析的视野。


    此外，人工智能技术的发展，也将使经营分析方法从经验分析向算法分析演变。这使更为复杂的分析能够得以实现。同时，基于机器学习、算法的自我优化，能够使经营分析能力实现持续的提升。


