    [M\\].北京：人民出版社，2008：78.\n\n\uFEFF\n\n# 第六章　智能时代财务创新实践\n\n## 第一节　智能时代战略财务创新\n\n\
    ### 一、智能时代战略财务框架详解及智能增强\n\n智能时代战略财务管理的各项工作内容都会受到新技术的影响，包括直接的技术影响，以及智能技术改变整个社会、经济形态后带来的间接影响。在这里，我们基于CFO基础能力框架进行详细讲解，并进一步谈一谈战略财务在智能时代会发生怎样的改变。\n\
    \n（一）战略与业务\n\n1.框架详解\n\n战略与业务框架详解，如表6-1所示。\n\n表6-1　战略与业务框架详解\n\n![img](images/txt006_1.jpg)\n\
    \n续 表\n\n![img](images/txt006_2.jpg)\n\n2.智能增强\n\n智能时代的到来将对企业的经营产生重大影响，各行各业在这个过程中都或多或少会被智能化所改变。或许你所在的企业会成为智能服务的提供商，或者成为智能技术研发的参与者，也可能在当前的业务模式中引入智能化工具，创新商业模式，提升竞争力。无论如何，智能化对企业未来的经营将会产生重要影响。部分公司会在战略层面进行调整，也有一些公司会进行战术层面的适配。\n\
    \n战略财务要能够敏锐地跟上企业战略和经营变化的步伐，主动对公司的战略或战术改变提供支持，而非被动响应。在这场智能化变革中，战略财务的积极参与能够让我们赢得主动，更好地体现财务对公司战略和经营决策支持的价值。被动响应将使财务无法与业务站在同一对话层次上，从而导致业务部门自行构建或弥补战略财务能力的不足。这一现象在信息化时代已经有大量的案例，但愿历史不会重现。\n\
    \n（二）财会控制机制\n\n1.框架详解\n\n财会控制机制框架详解，如表6-2所示。\n\n表6-2　财会控制机制框架详解\n\n![img](images/txt006_3.jpg)\n\
    \n2.智能增强\n\n首先，智能化对财务的影响是全面的。因此，财务的管理模式、流程体系、系统支持方式都会发生一定的改变。作为财务管理的支持保障，财务制度体系也必然受到影响。在制度体系层面，应当结合智能化对财务系统、流程带来的影响进行必要的完善和调整。\n\
    \n其次，内部控制方式会因智能化发生改变。智能技术能够加强内部控制能力，可以在内部控制体系中引入更多的智能化工具，更重要的是因为智能化的到来，内部控制环境会发生重大改变，更多的财务管理工作将基于大数据、人工智能的模式，对这些看不见的流程或财务管理工作如何实施内部控制，将成为新的课题。\n\
    \n而对于内部审计与稽核来说，智能化的影响最直接。在智能时代，人工智能将取代大量的财务操作人力，依靠算法的机器处理将取代依靠人的行为的业务处理，审计的范畴将从传统的审计向算法审计和IT审计转变。而在审计和稽核的手段上，基于大数据的远程稽核将成为主流模式。同时，企业依靠大数据监控，能够更早地发现风险线索，由传统审计与事后追责向事前预防转变。\n\
    \n（三）价值管理\n\n1.框架详解\n\n价值管理框架详解，如表6-3所示。\n\n表6-3　价值管理框架详解\n\n![img](images/txt006_4.jpg)\n\
    \n续 表\n\n![img](images/txt006_5.jpg)\n\n2.智能增强\n\n对于价值管理来说，大数据是智能增强的技术核心。在大数据之上辅以机器学习，能够挖掘出更多的智能增强场景。\n\
    \n对于产权管理来说，基于规则的初级人工智能及大数据技术能够辅助进行产权风险管理，帮助我们在风险出现的早期更加及时地识别和防范风险。\n\n对于营运资金管理和现金流量管理来说，大数据可以帮助我们发现更多管理线索，而且大数据结合机器学习，能够为企业经营提供更强大的预测能力。经营预测更可靠，将在营运资本和现金流量预测方面带来价值。\n\
    \n在并购价值管理中，借助大数据的相关性分析，能够发现更多可能提升并购价值的举措线索。这些管理线索有可能在最终的并购价值创造中发挥重要作用。\n\n（四）经营分析与绩效管理\n\
