    ##### 2.智能增强


    业务流程优化是财务共享服务管理中极其重要的主题。在传统的流程优化过程中，我们试图通过对流程环节的挑战、运营方式的转变来找到优化机会。当然，财务信息化在这一过程中也发挥了重要作用，高度的业务系统和财务系统的对接，以及专业化的财务共享服务运营平台的建立，也大大提升了财务共享服务的流程效率。


    智能时代的到来，也让我们对流程优化有了更多的机会。如机器流程自动化技术成为人们关注的热点，它通过在全流程过程中寻找流程断点和人工作业的替代机会，在很多企业业务流程优化陷入瓶颈后，再次提升了流程自动化程度。


    更值得期待的是，财务共享服务业务流程将伴随着基于规则的初级人工智能的应用，以及基于机器学习的人工智能的到来而获得更多的改进机会。在新技术的影响下，现有财务共享服务的流程会先从多人工模式转向“人智结合”模式，并最终迈向智能化模式。在这个过程中，业务流程的优化和改变并不是一蹴而就的，它会伴随着技术的逐步改进，并最终实现从量变到质变的转换。


    同时需要注意的是，智能化对财务共享服务业务流程的影响是端到端的。也就是说，财务共享服务运营的输入流程也在变化中，而前端的流程智能化进程也会对财务共享服务后端的运营模式产生重大影响，很多时候，财务共享服务中心从人工向自动化、智能化的转变根本上就是前端流程直接带来的。


    #### （四）财务共享服务中心运营管理


    ##### 1.框架详解


    财务共享服务中心运营管理框架详解，如表 6-18 所示。


    表 6-18　财务共享服务中心运营管理框架详解


    ![img](img/txt006_26.jpg)


    ##### 2.智能增强


    对于财务共享服务中心的运营管理来说，不少财务共享服务中心还停留在依靠人工进行管理分析的状态。因此，提升财务共享服务中心的运营管理水平，首先应当提升运营管理的基础信息化水平。


    在提升基础信息化水平方面，可以借助信息系统实现绩效指标的管理，并应用于绩效看板和绩效报表。在准入评估方面，可以进行系统化的评估流程执行，并将评估模型系统化。在
    SLA（服务水平协议）和定价方面，能够基于系统进行 SLA 的各项指标的计算和出具报告，并据此结合定价标准测算出具各服务对象的结算报表。在风险管理方面，能够将
    RCSA、KRI 及重大风险事项管理三大操作风险管理工具系统化，并应用于财务共享服务中心。在质量管理方面，能够将质量抽检、质量结果反馈、质量报告出具等质量管理过程系统化。在服务管理方面，能够构建邮箱及热线系统，以支持客户服务的专业化。


    在智能时代，我们能够在上述信息化手段建立起来的基础上，引入大数据技术，提升对财务共享服务中心在绩效分析、风险发现、质量评价、服务跟踪等方面的深入管理，依托更为丰富的数据输入，提升财务共享服务中心运营管理的层次。


    ### 二、财务众包


