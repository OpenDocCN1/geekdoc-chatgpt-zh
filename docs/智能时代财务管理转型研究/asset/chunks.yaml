    基于以上两个领域对机器学习的深入应用，能够不断提升OCR的识别率。同时，在一些传统OCR技术难以识别的领域，特别是手写体领域的识别将得以突破。事实上，在不少针对OCR机器学习的应用领域，已经出现了达到商用级别的产品。


    ## 2.机器学习提升风险分级精度


    在另一个领域，机器学习同样能够助力财务共享自动化水平的进一步提升。如上文中所说的，在传统技术下风险分级规则的设定是基于人的经验来总结的。这就必然会面对人的能力和经验的局限性，甚至很多时候，因为缺失相关经验，使这一动作直接被搁置。


    对于风险分级来说，其核心逻辑是基于输入的数据信息，评价每一份原始凭证的风险等级。这一过程和金融行业的信用评价体系是有所类似的。当获得了大量的输入后，通过所设定的算法得到一个风险评价的结果值。


    当机器学习被应用于这一领域后，可以考虑先通过人工积累大量的训练题库，由共享服务中心的作业人员基于经验规则设定风险级别。这个设定过程的最终结果，可能是很难靠人力完全抽象为模型的。但当积累了一定的人机协同作业下的题库后，能够引入机器学习引擎，对当下系统中植入的经验规则进行学习优化，从而将人机协同的人的部分进一步机器化，而这一转换比例将在持续学习的过程中不断提升，并最终提升风险分级的精度。


    当然，对于风险分级模型的优化，还有很多需要同步进行的工作，如报账人关系网络的搭建，以及报账人、供应商信用体系的搭建等。


    ## 3.机器学习实现作业规则的自我优化


    机器学习的一个重要价值在于能够帮助我们实现共享作业规则的持续优化。和风险分级类似，在没有引入机器学习之前，我们通过规则引擎进行自动审核，而规则引擎中的规则是基于作业人员的经验提炼的。当基于规则引擎的人机协同模式获得了大量的历史题库后，同样可以基于机器学习引擎，优化和提升规则引擎中的规则，从而实现人机协同向高度自动化、智能化的转变。


    在财务共享服务中心，机器取代人工的进程已经启动，不是是否可以的问题，而是何时完成的问题。


