- raw: '规则引擎作为初级人工智能应用，会在整个财务信息化中发挥着重要作用。规则引擎通过灵活、可配置的规则定义，支持在财务流程中基于规则进行的大量的判断、审核、分类等应用。规则引擎的完善，一方面，依赖于经验分析来进行完善；另一方面，也将基于机器学习引擎来辅助其完善。


    3.流程引擎


    流程引擎无论在哪个时代都十分重要，好的流程引擎能够全面提升财务信息系统的水平。而在智能时代，流程引擎的驱动仍然是规则引擎，而规则引擎又基于机器学习得以完善优化，并最终带来流程引擎能力的提升。


    4.大数据计算引擎


    大数据计算引擎是相对独立的，基于大数据的技术架构能够处理海量的包括结构化数据和非结构化数据的计算。大数据计算引擎的实现能够使财务在大数据方面的应用场景得到真正的技术支持，而不是传统计算模式下的伪大数据。


    5.机器学习引擎


    机器学习引擎应当能够实现监督学习和非监督学习，通过大量的不同业务场景下的数据学习训练，形成相应的优化规则，并依托规则引擎作用于各种业务场景中。从这个意义上来讲，机器学习引擎有些像规则引擎的后台引擎。


    6.分布式账簿引擎


    对于区块链的应用，需要在底层搭建各类分布式账簿，而我们可以考虑通过引擎化的方式，使这种分布式账簿的搭建变得更为标准和可配置。当然，这需要区块链技术实现进一步的抽象—从技术概念走向业务简易应用的概念。有了分布式账簿引擎，基于区块链的应用可以进一步加速落地。


    （三）功能架构中的业务应用层


    业务应用层是最重要的一个层次。在业务应用层中，我们从财务业务模块和技术两个角度实现了场景功能的匹配，从而形成了相对清晰的智能时代财务信息化应用的功能场景蓝图。它可以成为有意致力于智能时代技术深度应用的企业的思维导图，企业可据此展开规划和实践。下面我们从财务业务模块的视角来逐一说明。


    1.共享运营


    如表2-1所示，对于共享运营来说，在智能化方面的应用场景是相对较多的，这也是由其作业运营的特点所决定的。信息技术本身的进步对运营效率的提升就是最直接的。


    表2-1　共享运营场景与技术匹配


    ![img](images/txt002_3.jpg)


    2.资金/司库管理


    如表2-2所示，在资金管理中与共享流程密切相关的部分已经被归入共享运营中，而针对资金管理和司库管理来说，其主要的应用在于提升基于大数据的对资金和司库管理的分析、决策能力。此外，物联网技术对于账户Ukey、用印安全管理也将发挥重要作用。


    表2-2　资金/司库管理场景与技术匹配


    ![img](images/txt002_4.jpg)


    3.会计报告


    如表2-3所示，会计报告对新技术的应用主要集中在区块链对关联交易及业财一致性的支持上。同时，智能编辑等可以应用于会计报告的智能化。而在这个领域，也会引发人们对未来套装软件是否能够支持智能化应用的思考。


    表2-3　会计报告场景与技术匹配


    ![img](images/txt002_5.jpg)


    4.税务管理


    如表2-4所示，税务管理在税务风险控制方面可以应用人工智能技术来进行支持，在税费分析、税费预测等领域也可以考虑引入大数据，充分利用企业内外部数据来提升分析质量。此外，税务管理中所涉及的不少应用场景也会前置到其他业务或财务系统中。


    表2-4　税务管理场景与技术匹配


    ![img](images/txt002_6.jpg)


    5.成本费用管理


    如表2-5所示，成本费用管理在费用分析方面可以考虑与大数据相结合，而在移动互联网方面，可以进行服务及商品采购的前置和线上管理，从而获得更好的管控效果。


    表2-5　成本费用管理场景与技术匹配


    ![img](images/txt002_7.jpg)


    6.预算管理


    如表2-6所示，预算管理的技术应用主要集中在大数据方面，通过大数据，加强对预算预测和资源配置的管理能力的提升。


    表2-6　预算管理场景与技术匹配


    ![img](images/txt002_8.jpg)


    7.管理会计


    如表2-7所示，管理会计本身在技术层面的起步就比较晚，因此它的实现仍然基于传统技术方式。但在管理会计报告的编制中，可以考虑采用智能编辑模式，盈利分析可以考虑引入广义数据，增强分析的实用性。


    表2-7　管理会计场景与技术匹配


    ![img](images/txt002_9.jpg)


    8.经营分析


    如表2-8所示，在经营分析这个领域，大数据能够有较大的应用空间。通过数据范围的扩大、相关性分析的引入，经营分析能力能够得到提升。


    表2-8　经营分析场景与技术匹配


    ![img](images/txt002_10.jpg)


    智能时代财务信息化的功能架构是基于场景构建的。这里笔者所谈的是一个概念性的设想，未来需要更多的企业付诸实践，对这个概念架构进行持续的补充和完善。笔者把这个架构蓝图作为1.0版本，并期待能够持续完善升级。


    ## 第二节　智能时代财务与科技的信息化协同


    智能时代财务信息化的架构发生了很大改变。在数据层面，从结构化数据转变为非结构化数据；在技术层面，大数据技术、机器学习、分布式账簿等新技术引擎将被广泛地应用到财务信息化中。


    在应用场景中，一方面，传统的财务信息化应用场景会被优化，形成更为高效或有用的升级场景；另一方面，基于新技术的新应用场景也将大量涌现。在这样的背景下，财务部门内部、科技部门内部、财务部门和科技部门之间的协同变得更加复杂，也变得尤为重要。而我们不得不正视的是，在智能时代来临伊始，很多财务部分和科技部门都没有做好这样的准备，面对快速来临的技术革新，往往措手不及。因此，在这里我们有必要一起来认真研究一下智能时代可能给传统的财务、科技协同关系带来怎样的挑战，以及要构建怎样的新机制来积极面对，如图2-3所示。


    ![img](images/txt002_11.jpg)


    图2-3　智能时代财务与科技的信息化协同


    ### 一、来自协同问题的挑战


    （一）财务内部信息化协同面临的挑战


    在智能时代财务信息化建设中，财务部门自身面临着巨大的协同挑战。下面我们从三个方面来探讨财务内部的协同挑战。


    1.信息化建设在财务部门之间的分散


    很多企业的财务信息化建设并没有实现统一集中的管理。在通常情况下，财务信息化建设是各个不同的职能部门从自身的业务需求出发进行的，如负责会计报告的部门建设了核算系统，负责预算的部门建设了预算编制系统，负责资金管理的部门建设了资金管理系统等。在这样的背景下，系统建设完成后，相关系统的后续运维和优化也保留在了相应的业务部门。从需求和系统建设的关联角度来看，这样的管理模式未必不好，但是当不同部门管理的财务系统要实现整合、集成，甚至内部平台化的时候，就会出现问题。部门间系统管理的割裂，成为系统间有效集成的障碍。而在智能时代，对数据和流程的集成提出了更高的要求，财务部门间分散的信息化建设将掣肘其信息化建设。


    2.智能化认知程度在不同部门之间的差异


    智能时代信息技术的广泛应用需建立在财务的各个领域对智能技术达成共识的基础上，并且基于这种共识共同推动智能技术的基础建设，进一步架构不同业务应用场景。而如果财务的各个业务部门之间未达成同等层次的共识，则会使不同部门在技术路径选择、资源投入等方面产生分歧。虽然分歧的产生并不一定会阻碍财务向智能化道路迈进，但必然会带来更多的争议和损耗，并最终使这一进程放缓。也不排除在极端情况下，因为分歧过于严重，使整件事情回归原点。


    （二）科技部门内部信息化协同面临的挑战


    科技部门内部同样存在着信息化协同的问题。如果说财务的问题在于需求割裂和认知层次差异，那么科技所面临的就是另一类协同问题。


    1.基于独立而非产品平台的后遗症


    受到财务部门需求的影响，科技部门在建设系统时，往往也是根据财务的划分，建立了一个个不同的、独立的系统，在进行集成的时候，不同的系统之间进行数据的交互打通。在这种模式下，科技部门内部往往会为每个系统配备相对独立的项目团队。而由于财务部门本身缺乏统筹，科技部门内部也容易放任各财务系统的项目团队各自发展，并最终造成割裂。在这种情况下，就会产生后遗症。由于每个系统都是各自打地基的，地基之间无法打通，就造成各个系统的风格不同，系统管理方式不同，并导致用户体验差且系统维护困难。而更严重的是，科技部门各个项目团队之间缺乏技术交流，一项新技术在某一系统应用后，其他系统团队毫不知情，更不要说技术共享了，这与智能时代高频技术革新的需求格格不入。


    2.新技术团队与传统财务科技团队的割裂


    不少公司对智能化技术的研发往往并不是从财务开始的，而是为了满足业务场景研发产生的。一些企业在进行了大量业务场景的实践后，做了技术提炼，并构建了智能技术的各类实验室，如大数据实验室、区块链实验室、人工智能实验室等。而这些实验室在形成通用的技术基础后，又进一步反哺业务场景。很遗憾的是，在这个循环中，作为服务于后台业务的财务科技团队往往成为局外人。科技部门内部前后台团队的割裂，以及新技术实验室和传统实验团队之间的割裂，都可能让财务无法分享到最新的技术成果。


    （三）财务部门与科技部门之间信息化协同面临的挑战


    第三个协同挑战来自财务部门与科技部门之间。财务部门与科技部门之间本身存在着部门间协同的问题，二者是需求和实现的关系，在这个过程中必然容易出现协同问题所带来的挑战。


    1.需求场景和技术对接渐行渐远


    财务部门与科技部门之间对接的关键在于如何把业务需求转换为系统实现的语言。在传统的财务信息化阶段，这一直就是让人纠结的问题。很多企业的财务部门不了解科技部门的思维方式，而科技部门也难以理解财务和会计的语言，导致两者之间的需求转换往往会出现偏差。好在不少企业意识到了这个问题，并设法在两者之间设置了衔接团队，进行业务需求的转换。


    但在智能时代，原本设置的衔接团队会面临更大的挑战。一方面，财务的衔接团队会发现，基于智能技术的需求场景的挖掘变得更加困难，并且由于对新技术的理解不够深刻，显然很难想清楚能够解决怎样的业务问题；另一方面，科技部门也更容易沉迷于对技术本身的研发，成为“技术控”，反而忽视了对财务应用场景的支持，就技术论技术，难以结合业务实际。这两个方面的问题最终造成需求场景和技术对接渐行渐远。


    2.条状对接和技术平台发生冲突


    前面谈到，如果科技部门的组织设置与分散的财务模块相匹配，就会带来科技部门内部的协同问题。而如果仅仅科技部门单方进行努力，将其内部的割裂团队打通，形成技术平台，那么，即使有所进步，也还是没有从根本上解决问题，反而会进一步引发新的问题，造成来自财务部门的条状需求和科技部门平台建设之间的冲突。


    在科技平台化、财务分散化的模式下，财务信息化建设仍然分散在各个不同的财务部门内，而相关业务需求是各个财务部门向科技部门进行传达的。在这种情况下，已经实现了平台化的科技部门在面对这些时间不一、规划不一、深浅不一的需求时就会面临各种问题。由于无法进行像之前独立系统团队模式下的自主响应，科技部门内部需要对接收到的需求进行统筹评估，需要向需求方反馈平台的统一规则，并引导需求方去接受平台的约束。这一过程往往也伴随着大量的沟通和冲突。


    （四）集团与业务单元之间信息化协同面临的挑战


    和前面所关注的财务与科技之间的关系不同，集团和业务单元之间的信息化协同问题体现在了更高层面上。


    1.标准化和个性化的冲突


    对于集团企业来说，如果财务信息化有条件构建在一个相对标准化的架构之上，这是一件好事情。在实践中，也有很多企业集团一直致力于实现这样的大集中架构模式。但是对于具有多元化特征的企业集团来说，要做到这一点极其不易。


    集团内部的业务单元有其各自的业务发展诉求，特别是对于多元化集团来说，不同业态下的业务单元其个性化诉求尤为强烈。在这种情况下，要在集团层面建设一个相对标准化的平台来满足不同业态的个性化需求，就会造成集团标准化和业务单元个性化诉求之间的冲突。如果一味地满足集团的需求，业务单元的发展就会受到影响；而如果完全满足业务单元的诉求，对集团管控也会带来显著影响。如何平衡两者之间的关系，构建能够同时解决标准化和个性化诉求的平台成为核心问题。


    2.渐进和突发的冲突


    在财务智能化建设的节奏上，对于集团来说，往往希望能够根据所制订的计划，有条不紊地完成信息化建设。而对于业务单元来说，很多时候信息系统的建设需求存在突发性，往往为了解决业务痛点，需要进行紧急的系统建设。在这种情况下，对于集团来说，渐进的建设节奏会受到突发情况的冲击，如果无法及时对业务单元的诉求进行响应，则会加剧两者之间的冲突。而如果业务单元一味地强调自身的突发性，不考虑整个集团信息化建设的节奏，也会带来问题。渐进和突发的冲突是在集团企业信息化、智能化建设中不得不面对的挑战。


    3.在信息上两者之间穿透和独立的冲突


    集团和业务单元之间还面临着信息“穿透”和“独立”诉求的冲突。对于集团管控来说，实现对业务单元的信息穿透是信息系统建设的重要诉求，要做到这一点，集中的财务信息化建设模式是核心。但对于业务单元来说，保持其信息的独立性或私密性，也往往是其所希望做到的。两者之间的博弈关系一方面取决于集团管控的形态，另一方面也会夹杂着监管要求的影响。特别是对于上市公司来说，信息的独立性就存在监管要求，集团与业务单元在信息“穿透”和“独立”上的分歧或冲突是天然存在的。在刨除监管因素后，信息的穿透力度更多取决于企业集团在管控模式上对业务单元的控制力度。


    ### 二、智能时代财务信息化协同体系


    在智能时代，我们将面对比在传统财务信息化模式下更加复杂的协同关系和协同挑战。对于我们来说，更加重要的是如何在困难和挑战面前积极应对，并有效地构建一套更加高效的财务信息化协同体系。在这里，我们从四个方面对智能时代财务信息化协同体系提出设想。


    （一）财务构建统一的信息化中枢


    对于财务组织内部来说，要打破信息化的建设边界。打破边界的方法可以考虑在财务体系中构建统一的信息化中枢，这个信息化中枢可以是实体组织，也可以是虚拟组织。实体组织可以是财务信息化团队或部门的形态，如某领先的互联网企业内部设有财经IT部、某大型国有商业银行有会计信息部这样的组织，这些实体化的专有组织能够在财务体系内部起到统筹协调的作用。而对于没有条件设立统一财务信息化团队的企业来说，可以考虑设立虚拟机构，如设置财务信息化管理委员会之类的跨部门统筹组织。虽然它在力度上弱于实体组织，但也能起到一定的统筹协调作用，并且在财务信息化架构搭建和重大项目的推进过程中发挥重要作用。


    （二）科技面向财务的团队和架构的私人订制


    其次，对于科技部门来说，要实现与财务部门的紧密协同，应当考虑构建面向财务部门提供服务的专属团队。在这样的专属团队中，应当从组织架构上打破传统按业务模块独立设置团队的模式，构建能够更好地匹配未来的平台化架构，包括专属需求分析团队、架构师团队、公用平台研发团队和场景实现团队，面向财务部门进行私人订制。需求分析团队应当能够有效支撑智能技术与财务需求团队的对接；架构师团队能够站在产品化和平台化角度，科学构建财务信息化架构；公用平台研发团队应当能够打通财务各底层业务模块，对可公用的技术功能进行组件化研发，并实现在不同业务场景中的应用；而场景实现团队则在公用平台的基础上，针对不同的业务场景需求通过技术来进行实现。通过这样一个平台与定制化相结合的科技团队组织来提供对财务智能化的有力支持。


    （三）科技内部市场化实现新技术引入


    对于科技内部各类“黑科技实验室”之间的协同，不妨考虑引入市场化机制。由于各类“黑科技实验室”主要的服务对象是企业的业务场景，而对于作为后台的财务场景来说，要想获得大力度的支持并不容易。在这种情况下，引入市场化机制，通过内部交易的形式，向“黑科技实验室”付费购买相关技术，能够充分调动“黑科技实验室”协同的积极性，也能够更好地从机制上让财务和业务站在同一条起跑线上。当然，并不是所有企业都有条件去建立内部市场化机制，必要的时候，寻求行政命令和行政资源的支持也是可行之路。


    （四）集团推行产品平台并定义自由度


    对于集团企业来说，要达到标准化与个性化的平衡，不妨考虑将集团自身视为财务智能化产品的提供商，在集团层面基于产品化理念，设计信息化平台。在产品的设计过程中，集团应当充分引入业务单元来对产品化需求进行论证和设计，通过大量的调研形成需求报告，并最终搭建平台。各个业务单元在实际进行信息化建设时，集团将其当作一个产品客户，通过进一步的需求调研，引入实施方法，在产品化平台的基础上进行配置实施和少量且可控的定制化开发。


    通过这种模式，集团财务能够搭建一个开放式的财务智能化产品平台，并借助平台实现管理的标准化和自由度。


    在财务智能化进程中，财务与科技的协同是一个技术与艺术并存的话题，找到合适的平衡点、实现双赢是财务智能化之路成功的关键。


    ## 第三节　智能时代的财务产品经理


    智能时代财务管理的基础是信息技术，对于财务来说，好的技术平台的支撑，能够帮助我们在智能化道路上走得更远，也能够让我们有更多的机会去实践财务创新。而在这个过程中，传统的财务信息化支持人员已经难以满足要求，我们需要智能时代的财务产品经理来陪伴我们共同走上财务智能管理之路。


    在这里，我们谈一谈什么是财务产品经理，与信息化时代相比，智能时代财务产品经理应当具备怎样的特质，而我们又该如何帮助财务信息化人员成长为智能财务产品经理。


    ### 一、什么是财务产品经理


    要知道如何成长，就先要搞明白什么是财务产品经理。其实很多财务人员对于产品经理这个概念本身是陌生的，更不要提财务产品经理、智能财务产品经理了。所以，我们有必要一起来把这个概念先谈清楚。


    （一）从产品经理的概念说起


    笔者第一次接触产品经理这个概念，是在读苏杰的《人人都是产品经理》这本书的时候。那时候才明白，原来“产品就是用来解决某个问题的东西”，而产品经理就是把这个东西设计出来并不断完善的人[\[2\]](#txt002.xhtml#footnote_content_txt002_2)。


    从这个概念上理解，产品经理是随着产品形态的发展而发展的。早期的时候，产品大多数是实体化的，如家里的电视机、洗衣机等都是实体化产品，产品经理则是管理这些实体的产品从概念提出到设计、生产、营销、销售、配送、服务等全过程的角色。而随着社会的发展，产品的形态也在改变，能够解决问题的东西不仅仅是实体，一个好的创意、管理方法也可以称为产品，产品经理不再局限于“理工男”。而当信息技术、互联网快速发展后，软件产品、互联网产品快速风靡，面向软件和互联网的产品经理成为其中的重要人群。但无论哪一种产品、哪一种产品经理，其本质都是一样的。


    优秀的产品经理的价值就在于要作出能够解决问题、让客户满意的好产品。如图2-4所示，产品经理可能面对下面这些工作。


    ![img](images/txt002_12.jpg)


    图2-4　产品经理的工作


    第一，从各种各样的需求和想法中找到要解决的问题，以及相匹配的产品方向。


    第二，为产品做一个长期的布局和规划，知道什么时候该走到哪里。


    第三，进行产品设计，参与产品的开发、测试和上线。


    第四，参与产品推广方案的设计，用营销思维让客户接受这个产品。


    第五，积极进行产品培训，获得用户支持，得到更多改善产品的反馈。'
