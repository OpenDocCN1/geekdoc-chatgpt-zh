- raw: "说到“共享经济”这个概念，相信大家都不陌生。“共享经济”这个术语最早由美国德克萨斯州立大学社会学教授马科斯·费尔逊和伊利诺伊大学社会学教授琼·斯潘思在1978年发表的论文《群落结构和协同消费》中提出。但是，共享经济现象却是最近几年才流行的，而这种流行应当说是受到了美国作家蔡思的《共享经济》一书热销的影响。吴军在其专栏“硅谷来信”中也对共享经济有不一样的深刻理解。结合这些对共享经济的理解，我们来思考共享经济与财务的关系。\n\
    \n那么，什么是共享经济呢？\n\n一种相对通俗的理解是一方把闲置资源的使用权拿出来，另一方通过付费的方式来获得使用权，在这个过程中，拿出资源的一方获得收益，使用资源的一方通过用类似租赁的方式，实现低成本和便捷的资源使用，这个过程形成经济循环。\n\
    \n从这种理解来看，共享经济似乎与分享经济极其相似，都以闲置资源或者冗余资源的共享利用为核心。共享经济的思想的确驱动了非常多的商业实践，如旅行住宿共享、物流共享、交通共享、闲置用品共享等商业模式都是共享经济思想下的产物。而在这种思想的影响下，财务领域也出现了一项非常重要的创新实践——财务共享服务，它解决了财务人力资源在分散模式下冗余浪费的问题，并实现了人力资源的共享。\n\
    \n随着我们对商业经济的观察，发现了一个问题，似乎并不是所有的依托闲置资源的共享经济模式都能够获得成功，也有不少成功的共享经济案例超出了闲置资源共享的概念范畴。\n\
    \n对于闲置资源共享的共享经济模式来说，一个极大的挑战是资源互通共享中存在的共享成本。例如，要把大家手中的闲置图书拿来共享，并形成商业模式，就要考虑闲置图书在流动过程中的物流成本和沟通成本，可能很难将人们从直接购买新书的商业经济转变到闲置图书共享经济的模式中来。\n\
    \n另一些并非基于闲置资源共享的新共享经济模式似乎取得了更大的成功，并值得我们借鉴。最为典型的是滴滴打车和共享单车。如果仔细研究就会发现，实际上这两种模式中都不是在使用闲置资源，如滴滴用车所用的车是大量社会人员为加入滴滴司机中来而购买的新车；共享单车也不是对人们家中闲置的自行车进行共享，而是向市场上投放大量的新自行车。这两种模式并没有使用闲置资源，但又都属于共享经济，其本质是通过新增平台化工具和资源，实现新增资源的共享，并以此来激发和创造出新的用户使用需求。例如，共享单车，在这种模式出现后，原本并不热衷于自行车的社会成员对自行车的使用量突然呈现出现象级的上升。那么，共享经济对财务又有怎样的启示呢？\n\
    \n基于增量资源实现共享经济的核心在于以下三点：打造新的工具或资源平台；共享新的工具或资源；基于以上条件创造新的用户需求。\n\n在这样的新共享经济思维模式下，财务管理或财务服务市场可以从一些新视角进行思考。虽然我们说财务共享服务模式在过去十年间是一项非常重要的创新实践，但也要认识到，这仍然是建立在传统共享经济思维模式下的。那么，新的共享经济思维模式能够给我们带来怎样的启发呢？这里笔者尝试提出两个想法，抛砖引玉，希望可以引发大家的思考。\n\
    \n第一，集团财务领衔进行技术平台投资和创新的增量共享经济。\n\n在增量资源共享思想的指导下，集团化企业不妨考虑形成一种集中投资先进技术平台，提供给集团内下属各个子公司使用的共享经济模式。\n\
    \n在这种模式下，对于集团来说，投入了一笔增量资源，这些资源将用于技术研发，研发取得的成果以较低的成本提供给各个子公司使用，让那些本身并没有太多想法和能力使用财务新技术或进行财务创新的专业公司，也有机会迈入财务技术革新之路。这样就如同在市场上投放了一大批共享单车，让那些原本没打算骑车出行的人群改变习惯，开始骑车出行。\n\
    \n事实上，智能时代正在改变财务的新技术（如大数据、云计算、人工智能、区块链等）的研发投入都是非常大的，如果仅仅依托子公司的资源，实现起来难度会很大。而集团财务基于共享经济的思路进行建设，将使作为用户的子公司更加积极主动地发现和创造自身的财务管理创新需求，从而带来整个集团管理水平的大幅提升。\n\
    \n第二，用高品质中小企业财务共享服务提升代理记账市场。\n\n在国内的中小企业财务服务市场中，存在着大量良莠不齐的代理记账公司。这就如同在滴滴模式出现前的出租车市场，既有规范运营公司的出租车，也有大量黑车，整个出租车市场混乱不堪，用户也难以得到好的服务。而滴滴模式通过共享平台的方式，定义了新的准入标准、新的调度方式，将各种各样的资源进行有效共享整合，并且在标准化体系中引入了大量新的专车司机，使整个市场标准日趋规范，并且扩大了整体用户规模。\n\
    \n因此，未来的代理记账市场，同样需要类似于滴滴的财务共享服务平台，通过规范代理记账行业的服务标准、信用体系，并能够依托信息系统进行供需关系间的撮合服务。在这个基础上，引入更多高品质的财务服务商，势必将使整个服务市场更加规范，并推动用户在简单的记账需求基础上衍生出对财务服务商在税务、财务制度、财务管理、经营分析等方面全方位的业务需求，实现增量共享经济。\n\
    \n### 二、跟踪经济与财务\n\n在智能时代第二个重要的商业经济思维是跟踪经济。顾名思义，跟踪经济的含义是在对某一个事项跟进追踪的过程中挖掘其商业价值。实际上，在过去近二十年的时间内，跟踪经济一直都在发挥作用，并且随着时代的变迁而不断发展。\n\
    \n早期的跟踪经济建立在PC的互联网基础之上，接下来的跟踪经济建立在手机，特别是智能手机的移动互联网基础之上，而智能时代的跟踪经济则建立在物联网基础之上。\n\
    \n基于PC的互联网跟踪经济能够实现的跟踪范围是有限的，通常无法超出计算机的物理位置，在这种情况下，当用户访问互联网时，互联网能够记载用户的登录地点和访问时间，我们可以结合这两项信息做一些简单的商业模式的挖掘，如简单的行为习惯分析、消息推送等。\n\
    \n基于移动互联网的跟踪范围能够从PC的固定位置扩大到人在移动时的动态位置。这一跟踪范围的突破使商业创新也得到了突破。通过对人移动位置的记录，发展出了高德地图的人车定位、美团外卖的送餐小哥位置定位、滴滴叫车时的乘客定位、移动考勤签到等多个方面的丰富的应用。\n\
    \n而第三个阶段的跟踪经济则建立在智能和物联网基础之上。在这个阶段中，物联网通过结合多种跟踪设备与智能时代的高运算能力，能够实现对人/物的位置、时间、行为的全方位分析。这种分析能力使跟踪经济的商业模式出现爆发式增长。我们重点对这一阶段的跟踪经济进行探讨。\n\
    \n（一）跟踪经济的发展特点\n\n在跟踪经济的发展历程中，有着怎样的发展特点呢？我们看到了三个方面：智能物联阶段的跟踪设备在丰富；智能物联阶段的分析能力在提升；智能物联阶段的商业应用在进步。\n\
    \n1.智能物联阶段的跟踪设备在丰富\n\n在智能物联阶段，跟踪方式得到了丰富。首先，智能手机仍然是跟踪的重要工具之一，但跟踪的精度和时效性都较以往大幅提升，可以说，能够做到精准实时的位置定位。其次，无线射频技术（RFID）的低成本广泛应用使对物体的大范围跟踪成为可能。最后，智能穿戴设备的普及使使用手机跟踪时的不足得以弥补，如游泳、睡眠等不适合使用手机跟踪的场景都找到了新的跟踪方式。\n\
    \n2.智能物联阶段的分析能力在提升\n\n随着跟踪设备的丰富，所能采集的跟踪信息也呈现出几何级数的上升。在这种情况下，对数据分析时计算能力的要求大幅提升，好在智能时代基于云计算技术及计算机本身算力的提升、大数据技术的发展，足以应对这样的大数据分析。在智能物联阶段，我们已经不再受到算力的约束，可以精选数据进行分析，并且可以对采集到的海量数据进行充分应用，如实现跟踪物体的每一次移动、人体的每一个动作等。\n\
    \n3.智能物联阶段的商业应用在进步\n\n智能物联在商业上的应用受益于跟踪设备的丰富和分析能力的提升，如共享单车实现了移动手机和共享单车中定位芯片的组合跟踪，并形成了新的商业模式。再如，在电子商务中，对商品出厂后的完整的移动路径可以实现跟踪，使商品造假的难度大幅提升，用户可以轻易完成对商品的寻源查询，特别是对于一些单品价值较高的网购商品，能够轻易识别其是否存在异常，如用境外商品充当国货的情况。\n\
    \n（二）基于跟踪经济思维对财务的启示\n\n对于财务来说，当跟踪成本大幅降低后，广泛地应用跟踪技术来提升财务管理的水平将成为可能。跟踪经济最重要的是能够提供大量财务所需要的核算、风控、分析的辅助支持数据，而对这些数据的充分应用，将可以解决不少在传统财务模式下难以解决的问题。\n\
    \n1.解决存货、生物资产等的管理、核算、审计问题\n\n在传统财务模式下，对于存货的管理往往需要输入大量业务信息，无论是对于企业自身的财务，还是对于外部的审计师来说，这些业务信息输入的可靠性都需要进行验证。在笔者经历过的实例中，企业发往海外的产品备件被闲置在海外的仓库中多年无人问津，从而给公司造成巨大的损失，在财务上也难以反映实际情况。对于生物资产来说，采用传统的管理模式则更加困难，如如何盘点移动中的羊群。而跟踪经济能够给这些问题提供很好的解决方法，如通过跟踪芯片能够轻松地完成对存货、生物资产的实时跟踪。对位置的精准分析有助于完成大量依赖库位转移进行财务核算工作的自动化处理，存货管理能力高度优化，使业财一体化的水平得到进一步提升。\n\
    \n2.解决合同、印章、银行账户UKey等重要风险物品的管理问题\n\n在财务管理过程中，合同、印章、银行账户UKey等都是风险较高的物品，在传统模式下对这些物品的管理难度很高，也容易发生财务操作风险事件。而在跟踪技术下，通过在合同、印章和银行账户UKey中直接附加跟踪芯片，能够实现对这些高风险物品的精准风险管理，如这些物品和保管位置之间的预警管理，当物品距离保管位置达到预警距离时将直接触发报警系统。结合保管柜的权限管理系统，能够实现对这些高风险物品被使用的具体场景的还原，能够回答诸如“谁？在什么时间？用过什么？”等风险管理问题。\n\
    \n3.实现基于丰富的跟踪场景的经营分析和业务财务管理\n\n在传统的经营分析和业务财务工作中非常大的挑战是财务和业务之间存在距离，虽然一直强调财务要深入业务，但很多时候，客观情况使我们难以完全做到这一点。这使财务分析很容易浮在表面，而难以深入分析问题的本质。跟踪经济能够在某种程度上优化这一情况，随着智能物联的发展，业务部门本身存在采用物联网管理的强烈动机，而当整个社会发展到一定阶段后，物联网必将形成社会的统一规范。这个时候，财务应当积极地将物联网背后的大量信息引入使用，并且有可能打破自身企业的边界，结合整个供应链中的物联信息去获得更为广泛的数据基础。在此基础上，财务的经营分析和业务财务工作能够获得与业务部门相对同等的信息透明度，财务业务一体化得以深度实现。\n\
    \n### 三、合作经济与财务\n\n最后要讲的一种经济形态叫作合作经济。合作经济看似很好理解，但很多时候大家的理解可能不够充分，这就会导致后续在进行商业模式创新时遇到困难。那么，如何理解合作经济呢？\n\
    \n人类一般意义的合作行为由来已久，但是作为一种特殊的社会经济组织现象和合作方式，合作经济是近代社会的产物，是人类社会发展到资本主义阶段后才出现的。合作经济思想起源于空想社会主义。19世纪初，以圣西门、傅立叶、欧文为代表的空想社会主义者幻想了一个没有剥削、没有贫困、协同劳动、平等和谐的理想社会，这是合作经济的思想雏形。\n\
    \n当然，今天的合作经济已经有了新的演变。当下，一个非常广泛的使用合作经济的概念是“互联网+”，即将互联网与某一个传统行业进行组合，从而形成一种新的商业模式。部分模式已经取得了比较好的应用成果，如互联网金融等，其为社会带来了巨大的价值共享。但很多时候，这种组合并没有产生很好的效果，如“互联网+”上门洗车、“互联网+”上门美甲等模式都没有取得预期的效果，原因在于有不少所谓的商业创新是强行相加。而在合作经济下，不仅仅局限于“互联网+”的模式，还可以往回退一步看看“互联网+”的模式，如金融行业充分利用互联网工具，同样能够使行业迸发出新的生命力。\n\
    \n在合作经济模式下，我们可以更多地关注“传统产业”+“新技术工具和商业思想”的组合，无论谁加谁，都可能出现创新。\n\n对于合作经济与财务来说，大的方向应当是将财务传统的业务模式与智能时代的新技术进行充分的结合应用。从笔者的理解来说，这种方向是趋势性的，并不存在争议。\n\
    \n但在这里，笔者想深入地谈一谈作为市场上提供财务服务的厂商，要如何参与到这样一场时代性的合作中来。实际上，在财务与技术的合作中非常核心的一环是技术能力，对于有不同技术能力的市场参与者来说，其面对的选择可能是不一样的。\n\
    \n第一，有技术实力的参与者。在这一场合作中，有一类财务服务提供商是有可能成为“财务+技术”中技术端的主导者的，如Oracle、SAP，对于国内市场来说，用友、金蝶等传统财务信息化厂商也有这样的可能。而另一些大数据、云计算、人工智能等技术领域的主导者，如BAT、平安，也可能成为这一场合作的重要参与方。对于他们来说，需要的是充分发挥自身的技术优势，深度参与到技术端的合作中去，并从技术角度设法推动一些商业模式的出现。但不得不说，这仍然是少数人的游戏，对于绝大多数财务服务市场的参与者来说，他们是没有能力去扮演好这个角色的。\n\
    \n第二，应用技术的摆渡人。在智能时代，如果对于绝大多数厂商来说无法成为那一小部分技术主导者，那么不妨看清楚自己的身份和定位，换个角色，积极地成为应用技术的中间人。\n\
    \n对于多数企业财务来说，实际上在这场“财务+技术”的合作中很难扮演好自身财务端的角色，这并不是说他们不懂财务，相反，这是他们的老本行，是他们最擅长的领域。但难点在于，如何将传统财务领域与新技术进行思想和技术层面的创造性衔接。对于技术端来说，他们更多的是在提供一种工具和平台，而如何将这些工具和平台应用到财务领域，很多时候这些“巨无霸”并不怎么在意；而对于在技术上并不擅长的财务人员来说，去创造性地寻找两者的结合点是很有难度的。这个时候，市场上的财务服务商不妨考虑将自身定位为结合传统财务和技术的“摆渡人”，通过帮助财务应用新兴管理技术来实现自身的价值，这可能是财务领域合作经济的最好模式。\n\
    \n* * *\n\n[\\[1\\]](#txt001.xhtml#footnote_quote_txt001_1)尼克.人工智能简史\\[M\\].北京：人民邮电出版社，2017：66.\n\
    \n[\\[2\\]](#txt001.xhtml#footnote_quote_txt001_2)卡普兰.人工智能时代\\[M\\].杭州：浙江人民出版社，2016：52.\n\
    \n[\\[3\\]](#txt001.xhtml#footnote_quote_txt001_3)卡普兰.人工智能时代\\[M\\].杭州：浙江人民出版社，2016：\
    \ 120.\n\n[\\[4\\]](#txt001.xhtml#footnote_quote_txt001_4)韦康博.人工智能\\[M\\].北京：\
    \ 现代出版社，2016：98.\n\n[\\[5\\]](#txt001.xhtml#footnote_quote_txt001_5)毛航天.人工智能中智能概念的发展研究\\\
    [D\\].上海：华东师范大学，2016：98.\n\n[\\[6\\]](#txt001.xhtml#footnote_quote_txt001_6)李凡.会计人员生涯发展的个案研究\\\
    [D\\].上海：华东师范大学，2006：56.\n\n[\\[7\\]](#txt001.xhtml#footnote_quote_txt001_7)安应民.企业柔性管理：获取竞争优势的工具\\\
    [M\\].北京：人民出版社，2008：88.\n\n[\\[8\\]](#txt001.xhtml#footnote_quote_txt001_8)孙逸，董志强.RPA：财务智能化的必经之路\\\
    [J\\].新理财，2017（21）：64-65.\n\n\uFEFF\n\n# 第二章　智能时代财务信息化整体规划\n\n## 第一节　智能时代财务信息化概念框架\n\
    \n智能时代的到来，带来了诸多新技术，而这些新技术在财务领域的应用场景也会日趋丰富。我们之前谈到了很多关于财务认知升级的话题，也谈到了在智能时代影响财务信息化建设的重要技术。当技术和财务有机地融合在一起的时候，就会发生一些美妙的化学变化。智能时代财务信息化架构应运而生，既有传统财务信息化的醇美，也有未来时速下的性感。让我们一起来探究智能时代财务信息化架构。\n\
    \n### 一、软件架构与财务智能化功能架构蓝图\n\n首先，我们一起来看一看什么是软件架构，以及财务智能化功能架构的蓝图。\n\n（一）什么是软件架构\n\
    \n对于财务来说，软件架构这件事情听起来还是有点儿复杂的，说得通俗一点儿，就是要搞清楚一个系统中有哪些构成部分，这些构成部分是怎样相互发生作用的。那么对于智能时代的财务信息化架构，就是要搞明白和传统财务信息化架构相比，多了哪些构成部分，以及各部件之间相互作用的方式发生了怎样的变化。“有什么功能”可以称之为功能架构，功能加上交互关系后形成的架构可以称之为逻辑架构。而在实际的软件架构设计中，还有多个视角的架构理解，如开发架构、运行架构、物理架构、数据架构等[\\\
    [1\\]](#txt002.xhtml#footnote_content_txt002_1)，如图2-1所示。下面我们重点聊聊偏重于概念层次的功能架构。\n\
    \n![img](images/txt002_1.jpg)\n\n图2-1　多视角的软件架构\n\n（二）智能时代财务信息化功能架构蓝图\n\n在这里，我们用更容易让财务人员理解的方式来表达智能时代财务信息化架构的概念，如图2-2所示。\n\
    \n![img](images/txt002_2.jpg)\n\n图2-2　智能时代财务信息化功能架构蓝图\n\n从图2-2中，我们从数据特点、一系列引擎化的技术工具，以及财务应用和智能时代新技术的组合场景分析等方面展示了智能时代财务信息化功能架构的全貌。\n\
    \n### 二、财务智能化功能架构蓝图解析\n\n下面我们针对财务智能化功能架构蓝图逐一展开解析。\n\n（一）功能架构中的数据层\n\n首先要说的是智能财务信息化架构下的数据层。和传统财务信息化架构相比，最重要的是数据的内涵发生了变化。在传统架构下，处理的主要是结构化数据；而在功能架构下，结构化数据已经无法满足财务信息系统对数据的需求，非结构化数据被引入，并且成为非常重要的构成部分。\n\
    \n因此，在功能架构下的数据层中，系统对结构化数据和非结构化数据同时提供相应的管理功能支持，从数据的采集管理、对接管理、存储管理等方面进行相应的功能支持。\n\
    \n（二）功能架构中的智能引擎层\n\n智能引擎层是架构中的另一个重要层次。之所以叫作智能引擎层，是因为想要在搭建智能时代财务信息系统架构时，能够对关键的支持技术进行组件化，并以引擎的形式来支持不同业务场景的应用。引擎层是一个公用的技术平台，在不同的应用场景中，能够灵活地调用相关引擎来实现配套的业务应用，从而实现整个财务信息化架构底层技术工具的共享。在智能时代的财务信息化架构中，可抽象出的引擎主要包括以下几个方面。\n\
    \n1.图像智能识别引擎\n\n图像智能识别引擎主要用于广泛地进行图片信息的识别，既能够支持对结构化数据的采集，又能够支持对非结构化数据的信息提取。同时，图像智能识别引擎可以利用机器学习来提升自身的识别能力，从而扩大可应用场景。\n\
    \n2.规则引擎"
  fmt: "\n# 共享经济与财务\n\n说到“共享经济”这个概念，相信大家都不陌生。“共享经济”这个术语最早由美国德克萨斯州立大学社会学教授马科斯·费尔逊和伊利诺伊大学社会学教授琼·斯潘思在1978年发表的论文《群落结构和协同消费》中提出。但是，共享经济现象却是最近几年才流行的，而这种流行应当说是受到了美国作家蔡思的《共享经济》一书热销的影响。吴军在其专栏“硅谷来信”中也对共享经济有不一样的深刻理解。结合这些对共享经济的理解，我们来思考共享经济与财务的关系。\n\
    \n那么，什么是共享经济呢？\n\n一种相对通俗的理解是一方把闲置资源的使用权拿出来，另一方通过付费的方式来获得使用权，在这个过程中，拿出资源的一方获得收益，使用资源的一方通过用类似租赁的方式，实现低成本和便捷的资源使用，这个过程形成经济循环。\n\
    \n从这种理解来看，共享经济似乎与分享经济极其相似，都以闲置资源或者冗余资源的共享利用为核心。共享经济的思想的确驱动了非常多的商业实践，如旅行住宿共享、物流共享、交通共享、闲置用品共享等商业模式都是共享经济思想下的产物。而在这种思想的影响下，财务领域也出现了一项非常重要的创新实践——财务共享服务，它解决了财务人力资源在分散模式下冗余浪费的问题，并实现了人力资源的共享。\n\
    \n随着我们对商业经济的观察，发现了一个问题，似乎并不是所有的依托闲置资源的共享经济模式都能够获得成功，也有不少成功的共享经济案例超出了闲置资源共享的概念范畴。\n\
    \n对于闲置资源共享的共享经济模式来说，一个极大的挑战是资源互通共享中存在的共享成本。例如，要把大家手中的闲置图书拿来共享，并形成商业模式，就要考虑闲置图书在流动过程中的物流成本和沟通成本，可能很难将人们从直接购买新书的商业经济转变到闲置图书共享经济的模式中来。\n\
    \n另一些并非基于闲置资源共享的新共享经济模式似乎取得了更大的成功，并值得我们借鉴。最为典型的是滴滴打车和共享单车。如果仔细研究就会发现，实际上这两种模式中都不是在使用闲置资源，如滴滴用车所用的车是大量社会人员为加入滴滴司机中来而购买的新车；共享单车也不是对人们家中闲置的自行车进行共享，而是向市场上投放大量的新自行车。这两种模式并没有使用闲置资源，但又都属于共享经济，其本质是通过新增平台化工具和资源，实现新增资源的共享，并以此来激发和创造出新的用户使用需求。例如，共享单车，在这种模式出现后，原本并不热衷于自行车的社会成员对自行车的使用量突然呈现出现象级的上升。那么，共享经济对财务又有怎样的启示呢？\n\
    \n基于增量资源实现共享经济的核心在于以下三点：打造新的工具或资源平台；共享新的工具或资源；基于以上条件创造新的用户需求。\n\n在这样的新共享经济思维模式下，财务管理或财务服务市场可以从一些新视角进行思考。虽然我们说财务共享服务模式在过去十年间是一项非常重要的创新实践，但也要认识到，这仍然是建立在传统共享经济思维模式下的。那么，新的共享经济思维模式能够给我们带来怎样的启发呢？这里笔者尝试提出两个想法，抛砖引玉，希望可以引发大家的思考。\n\
    \n第一，集团财务领衔进行技术平台投资和创新的增量共享经济。\n\n在增量资源共享思想的指导下，集团化企业不妨考虑形成一种集中投资先进技术平台，提供给集团内下属各个子公司使用的共享经济模式。\n\
    \n在这种模式下，对于集团来说，投入了一笔增量资源，这些资源将用于技术研发，研发取得的成果以较低的成本提供给各个子公司使用，让那些本身并没有太多想法和能力使用财务新技术或进行财务创新的专业公司，也有机会迈入财务技术革新之路。这样就如同在市场上投放了一大批共享单车，让那些原本没打算骑车出行的人群改变习惯，开始骑车出行。\n\
    \n事实上，智能时代正在改变财务的新技术（如大数据、云计算、人工智能、区块链等）的研发投入都是非常大的，如果仅仅依托子公司的资源，实现起来难度会很大。而集团财务基于共享经济的思路进行建设，将使作为用户的子公司更加积极主动地发现和创造自身的财务管理创新需求，从而带来整个集团管理水平的大幅提升。\n\
    \n第二，用高品质中小企业财务共享服务提升代理记账市场。\n\n在国内的中小企业财务服务市场中，存在着大量良莠不齐的代理记账公司。这就如同在滴滴模式出现前的出租车市场，既有规范运营公司的出租车，也有大量黑车，整个出租车市场混乱不堪，用户也难以得到好的服务。而滴滴模式通过共享平台的方式，定义了新的准入标准、新的调度方式，将各种各样的资源进行有效共享整合，并且在标准化体系中引入了大量新的专车司机，使整个市场标准日趋规范，并且扩大了整体用户规模。\n\
    \n因此，未来的代理记账市场，同样需要类似于滴滴的财务共享服务平台，通过规范代理记账行业的服务标准、信用体系，并能够依托信息系统进行供需关系间的撮合服务。在这个基础上，引入更多高品质的财务服务商，势必将使整个服务市场更加规范，并推动用户在简单的记账需求基础上衍生出对财务服务商在税务、财务制度、财务管理、经营分析等方面全方位的业务需求，实现增量共享经济。\n\
    \n## 二、跟踪经济与财务\n\n在智能时代第二个重要的商业经济思维是跟踪经济。顾名思义，跟踪经济的含义是在对某一个事项跟进追踪的过程中挖掘其商业价值。实际上，在过去近二十年的时间内，跟踪经济一直都在发挥作用，并且随着时代的变迁而不断发展。\n\
    \n早期的跟踪经济建立在PC的互联网基础之上，接下来的跟踪经济建立在手机，特别是智能手机的移动互联网基础之上，而智能时代的跟踪经济则建立在物联网基础之上。\n\
    \n基于PC的互联网跟踪经济能够实现的跟踪范围是有限的，通常无法超出计算机的物理位置，在这种情况下，当用户访问互联网时，互联网能够记载用户的登录地点和访问时间，我们可以结合这两项信息做一些简单的商业模式的挖掘，如简单的行为习惯分析、消息推送等。\n\
    \n基于移动互联网的跟踪范围能够从PC的固定位置扩大到人在移动时的动态位置。这一跟踪范围的突破使商业创新也得到了突破。通过对人移动位置的记录，发展出了高德地图的人车定位、美团外卖的送餐小哥位置定位、滴滴叫车时的乘客定位、移动考勤签到等多个方面的丰富的应用。\n\
    \n而第三个阶段的跟踪经济则建立在智能和物联网基础之上。在这个阶段中，物联网通过结合多种跟踪设备与智能时代的高运算能力，能够实现对人/物的位置、时间、行为的全方位分析。这种分析能力使跟踪经济的商业模式出现爆发式增长。我们重点对这一阶段的跟踪经济进行探讨。\n\
    \n### （一）跟踪经济的发展特点\n\n在跟踪经济的发展历程中，有着怎样的发展特点呢？我们看到了三个方面：智能物联阶段的跟踪设备在丰富；智能物联阶段的分析能力在提升；智能物联阶段的商业应用在进步。\n\
    \n#### 1. 智能物联阶段的跟踪设备在丰富\n\n在智能物联阶段，跟踪方式得到了丰富。首先，智能手机仍然是跟踪的重要工具之一，但跟踪的精度和时效性都较以往大幅提升，可以说，能够做到精准实时的位置定位。其次，无线射频技术（RFID）的低成本广泛应用使对物体的大范围跟踪成为可能。最后，智能穿戴设备的普及使使用手机跟踪时的不足得以弥补，如游泳、睡眠等不适合使用手机跟踪的场景都找到了新的跟踪方式。\n\
    \n#### 2. 智能物联阶段的分析能力在提升\n\n随着跟踪设备的丰富，所能采集的跟踪信息也呈现出几何级数的上升。在这种情况下，对数据分析时计算能力的要求大幅提升，好在智能时代基于云计算技术及计算机本身算力的提升、大数据技术的发展，足以应对这样的大数据分析。在智能物联阶段，我们已经不再受到算力的约束，可以精选数据进行分析，并且可以对采集到的海量数据进行充分应用，如实现跟踪物体的每一次移动、人体的每一个动作等。\n\
    \n#### 3. 智能物联阶段的商业应用在进步\n\n智能物联在商业上的应用受益于跟踪设备的丰富和分析能力的提升，如共享单车实现了移动手机和共享单车中定位芯片的组合跟踪，并形成了新的商业模式。再如，在电子商务中，对商品出厂后的完整的移动路径可以实现跟踪，使商品造假的难度大幅提升，用户可以轻易完成对商品的寻源查询，特别是对于一些单品价值较高的网购商品，能够轻易识别其是否存在异常，如用境外商品充当国货的情况。\n\
    \n### （二）基于跟踪经济思维对财务的启示\n\n对于财务来说，当跟踪成本大幅降低后，广泛地应用跟踪技术来提升财务管理的水平将成为可能。跟踪经济最重要的是能够提供大量财务所需要的核算、风控、分析的辅助支持数据，而对这些数据的充分应用，将可以解决不少在传统财务模式下难以解决的问题。\n\
    \n#### 1. 解决存货、生物资产等的管理、核算、审计问题\n\n在传统财务模式下，对于存货的管理往往需要输入大量业务信息，无论是对于企业自身的财务，还是对于外部的审计师来说，这些业务信息输入的可靠性都需要进行验证。在笔者经历过的实例中，企业发往海外的产品备件被闲置在海外的仓库中多年无人问津，从而给公司造成巨大的损失，在财务上也难以反映实际情况。对于生物资产来说，采用传统的管理模式则更加困难，如如何盘点移动中的羊群。而跟踪经济能够给这些问题提供很好的解决方法，如通过跟踪芯片能够轻松地完成对存货、生物资产的实时跟踪。对位置的精准分析有助于完成大量依赖库位转移进行财务核算工作的自动化处理，存货管理能力高度优化，使业财一体化的水平得到进一步提升。\n\
    \n#### 2. 解决合同、印章、银行账户UKey等重要风险物品的管理问题\n\n在财务管理过程中，合同、印章、银行账户UKey等都是风险较高的物品，在传统模式下对这些物品的管理难度很高，也容易发生财务操作风险事件。而在跟踪技术下，通过在合同、印章和银行账户UKey中直接附加跟踪芯片，能够实现对这些高风险物品的精准风险管理，如这些物品和保管位置之间的预警管理，当物品距离保管位置达到预警距离时将直接触发报警系统。结合保管柜的权限管理系统，能够实现对这些高风险物品被使用的具体场景的还原，能够回答诸如“谁？在什么时间？用过什么？”等风险管理问题。\n\
    \n#### 3. 实现基于丰富的跟踪场景的经营分析和业务财务管理\n\n在传统的经营分析和业务财务工作中非常大的挑战是财务和业务之间存在距离，虽然一直强调财务要深入业务，但很多时候，客观情况使我们难以完全做到这一点。这使财务分析很容易浮在表面，而难以深入分析问题的本质。跟踪经济能够在某种程度上优化这一情况，随着智能物联的发展，业务部门本身存在采用物联网管理的强烈动机，而当整个社会发展到一定阶段后，物联网必将形成社会的统一规范。这个时候，财务应当积极地将物联网背后的大量信息引入使用，并且有可能打破自身企业的边界，结合整个供应链中的物联信息去获得更为广泛的数据基础。在此基础上，财务的经营分析和业务财务工作能够获得与业务部门相对同等的信息透明度，财务业务一体化得以深度实现。\n\
    \n## 三、合作经济与财务\n\n最后要讲的一种经济形态叫作合作经济。合作经济看似很好理解，但很多时候大家的理解可能不够充分，这就会导致后续在进行商业模式创新时遇到困难。那么，如何理解合作经济呢？\n\
    \n人类一般意义的合作行为由来已久，但是作为一种特殊的社会经济组织现象和合作方式，合作经济是近代社会的产物，是人类社会发展到资本主义阶段后才出现的。合作经济思想起源于空想社会主义。19世纪初，以圣西门、傅立叶、欧文为代表的空想社会主义者幻想了一个没有剥削、没有贫困、协同劳动、平等和谐的理想社会，这是合作经济的思想雏形。\n\
    \n当然，今天的合作经济已经有了新的演变。当下，一个非常广泛的使用合作经济的概念是“互联网+”，即将互联网与某一个传统行业进行组合，从而形成一种新的商业模式。部分模式已经取得了比较好的应用成果，如互联网金融等，其为社会带来了巨大的价值共享。但很多时候，这种组合并没有产生很好的效果，如“互联网+”上门洗车、“互联网+”上门美甲等模式都没有取得预期的效果，原因在于有不少所谓的商业创新是强行相加。而在合作经济下，不仅仅局限于“互联网+”的模式，还可以往回退一步看看“互联网+”的模式，如金融行业充分利用互联网工具，同样能够使行业迸发出新的生命力。\n\
    \n在合作经济模式下，我们可以更多地关注“传统产业”+“新技术工具和商业思想”的组合，无论谁加谁，都可能出现创新。\n\n对于合作经济与财务来说，大的方向应当是将财务传统的业务模式与智能时代的新技术进行充分的结合应用。从笔者的理解来说，这种方向是趋势性的，并不存在争议。\n\
    \n但在这里，笔者想深入地谈一谈作为市场上提供财务服务的厂商，要如何参与到这样一场时代性的合作中来。实际上，在财务与技术的合作中非常核心的一环是技术能力，对于有不同技术能力的市场参与者来说，其面对的选择可能是不一样的。\n\
    \n第一，有技术实力的参与者。在这一场合作中，有一类财务服务提供商是有可能成为“财务+技术”中技术端的主导者的，如Oracle、SAP，对于国内市场来说，用友、金蝶等传统财务信息化厂商也有这样的可能。而另一些大数据、云计算、人工智能等技术领域的主导者，如BAT、平安，也可能成为这一场合作的重要参与方。对于他们来说，需要的是充分发挥自身的技术优势，深度参与到技术端的合作中去，并从技术角度设法推动一些商业模式的出现。但不得不说，这仍然是少数人的游戏，对于绝大多数财务服务市场的参与者来说，他们是没有能力去扮演好这个角色的。\n\
    \n第二，应用技术的摆渡人。在智能时代，如果对于绝大多数厂商来说无法成为那一小部分技术主导者，那么不妨看清楚自己的身份和定位，换个角色，积极地成为应用技术的中间人。\n\
    \n对于多数企业财务来说，实际上在这场“财务+技术”的合作中很难扮演好自身财务端的角色，这并不是说他们不懂财务，相反，这是他们的老本行，是他们最擅长的领域。但难点在于，如何将传统财务领域与新技术进行思想和技术层面的创造性衔接。对于技术端来说，他们更多的是在提供一种工具和平台，而如何将这些工具和平台应用到财务领域，很多时候这些“巨无霸”并不怎么在意；而对于在技术上并不擅长的财务人员来说，去创造性地寻找两者的结合点是很有难度的。这个时候，市场上的财务服务商不妨考虑将自身定位为结合传统财务和技术的“摆渡人”，通过帮助财务应用新兴管理技术来实现自身的价值，这可能是财务领域合作经济的最好模式。\n\
