- raw: '第三，需要财会人员具备企业运营管理经验。财会人员是企业的核心人员，企业发展过程中需要财会人员的全程参与。财会人员可以利用自身丰富的财务知识以及法律知识等，对企业及市场情况进行分析，帮助管理者和决策者更好地完成管理和决策工作，促进企业发展。有些财会人员过多关注财务数据，对运营管理相关知识的积累较少。


    第四，需要财会人员熟悉人工智能技术。目前，人工智能带来了新的挑战，会计工作不再是一成不变的。有些财会人员只专注财务专业知识的积累，计算机及人工智能相关的知识欠缺。因此，无法将财务专业知识与人工智能技术相结合，辅助人工智能系统的开发和升级。


    第五，需要财会人员具有跨领域工作经验。有些财会人员受到专业、性格、思维模式等影响，对企业宏观经济背景、国家政策等关注度不够。对计算机知识、宏观经济学、金融学、市场营销学等相关领域的研究较少，在跨领域横向转型中工作经验少，选择面比较窄。


    总之，人工智能背景下财会人员面临着巨大的挑战，工作岗位急剧减少，企业对财会人员的工作胜任能力要求越来越高，企业对财会人员的需求类型发生了变化。同时，管理层对财会人员的职业生涯管理不够重视，很多企业虽然有提到员工的职业生涯管理体系，但往往只是停留于表面，并没有真正将员工职业生涯管理体系付诸实践。


    ## 第二节　智能时代财务人员的基础能力框架


    ### 一、财务人员转型的方向


    随着财务共享与智能化的结合越发紧密，共享中心将从一个人力密集型组织转变为一个技术密集型组织。随着规则的不断梳理与完善，并在信息系统中形成可执行的规则后，财务共享中心的作业人员将可被替换，并最终趋于人力的削减。从管理者角度来说，这对整个组织是有益的，但也会对财务共享中心现存员工的转型形成极大的挑战。部分能力较高的员工将转至规则梳理的相关岗位，而大量的员工可能因为智能化而离开工作岗位。因此，财务人员只有适应时代发展，加速转型，才有可能避免在新财务时代被淘汰。


    （一）财务人员应向“成本控制与内部控制人员”转型


    大数据时代的到来与不断发展，企业管理会计逐渐彰显出其重要性。因此，在大数据时代下，企业的财务人员应积极调整思路，逐渐向管理会计的方向转型。对于企业来说，随着市场经济的不断发展与完善，在微利时代，成本的高低将成为企业获利的关键性因素。在大数据时代，专业的成本分析与控制人员不仅要具备丰富的、扎实的财务专业知识，还必须对企业的各项生产工艺流程、生产环节、企业的内控流程等进行了解与高度关注，并在成本控制系统的帮助下，充分挖掘相关成本数据，对成本数据进行合理的分配、归集、构成分析等，从而为企业成本的有效控制奠定基础，为企业的决策提供帮助。


    （二）财务人员应向“全面预算人员”转型


    现代企业进行的管理基本都是事后管理，越来越多的企业采用ERP系统对企业数据进行整合，通过对数据穿透查询，结合企业的预测目标，将企业事后管理逐步变成事前控制。用信息化手段进行事前控制、预测等对企业管理十分重要。在大数据时代，预算作为财务管理的领头羊、核心，要求企业参与预算的财务人员站在企业战略规划的高度，对企业的战略规划目标进行层层分解，直至最后的预算分析报告的编制、预算绩效考核，以及预算对未来目标与战略的影响与规划，使预算真正发挥其职能作用。因此，大数据时代需要企业的财务人员向全面预算人员转型。


    （三）财务人员应向“专业财务分析人员”转型


    企业的财务人员必须具备专业的分析技能，能够从海量的数据中挖掘出对企业有价值的信息；同时，还可以在数据分析过程中更加全面地了解企业的发展现状与存在的问题，及时对企业的财务状况、经营成果进行评价，为提高企业的经营管理效率提供更有价值的分析。因此，大数据时代的企业财务人员应积极向专业的财务分析人员转型。


    （四）财务人员应向“风险管理人员”转型


    风险管理主要是企业从战略制定到日常经营过程中对待风险的一系列信念与态度，目的是确定可能影响企业的潜在事项，并进行管理，为实现企业的目标提供合理的保证。实践证明，内部控制的有效实施有赖于风险管理，战略型财务人员需将企业的风险的影响控制在可接受的范围内，以此来促进企业的可持续发展。因此，在大数据时代，企业的财务人员应向风险管理人员转型。


    （五）财务人员应向“技术型财务人员、战略型财务人员”转型


    大数据、大共享理念的延伸与拓展要求财务共享的产生，并在未来成为主要的工作环境，并借此形成数据中心，为未来的决策与发展奠定基础。财务共享中心的人员是财务人员在大数据时代转型的另一个方向。在财务共享中心中，有设计好的专业的标准与流程。例如，应收应付款项、费用报销、明细账的管理、总账及各种财务报销、资金的管理、税务的合理筹划等。这一职能对财务人员的要求并不高，只要具有一定的财务基础知识、英语基础知识、计算机基础知识，并经过一定的培训即可转型上岗，对于那些处于初级阶段的财务人员来说是一个较好的工作选择。在经过一段时间的熟悉以后，可以向更高级的技术型财务人员、战略型财务人员转型。


    在财务共享管理模式下，业务转型定位将财务人员分为共享财务、业务财务、战略财务三类。其中，高端财务岗位的需求将会增加，对从业人员的学历、经验、技能要求也更高更全面。相反，财务的一般岗位对财务人员的技能要求不高，一些工作完全可以用自动化技术或人工智能代替，导致基础财务人员将会被大幅度裁员，尤其是企业内部同质化的岗位将被“共享”掉，整体财务岗位缩编。


    普通的财务人员转型为共享财务人员，其人数低于缩编后财务人员总体比重的40％。普通财务人员是指那些学历层次相对不高、年龄不大，掌握新技能、学习新知识的能力较强，同时又具备财务会计实务操作经验的工作人员。这些财务人员长期在一线从事财务基础工作，在原始单据审核、凭证录入、交易结算等方面积累了丰富的实战经验，可通过选拔、培训后到财务共享中心从事财务会计工作。但是，现实中由于国内的整体教育环境，本科学历人才的供给成本已经大幅度降低，并且呈现出供大于求的长期趋势，本科学历的员工会成为共享财务中心高性价比的首选人才。


    优秀的财务人员转型为业务财务人员，其人数约占缩编后财务人员总体比重近50％。优秀的财务人员指学历教育层次较高，专业知识系统和实操经验丰富的工作人员。他们应该深入业务前端，针对企业研发、供应、生产、营销等各个环节进行财务分析、预测、规划、控制、激励、考核等，加快财务与业务的融合，积极参与公司价值链各环节的价值创造，即完成财务与业务的各个层级的融合，能把财务数据转化为信息，并以业务语言传递给各级领导，辅助后者决策，并且可以把业务部门遇到的困难及时反馈到财务部门。


    卓越的财务人员应转型为战略财务人员，他们是真正的财务精英，将占缩编后财务人员总体的20％左右。卓越的财务人员指学历层次很高（至少财经专业本科以上毕业生），管理知识储备深厚，既掌握财务会计实务，又懂得战略规划，对财务管理及其他经济领域业务也有深入研究，精于预算管理、绩效评价、风险管理、内部控制、资本运作、纳税筹划等的工作人员，他们可作为战略财务培养。战略财务不仅相当于企业总部的参谋，还是管理者进行战略决策时的重要伙伴，是全面预算与绩效管理的设计师，是制定和实施组织战略的专家。


    ### 二、财务人员基础能力框架


    所有期望成为CFO的财务人都很关心一个问题：应当积累哪些知识才能更加高效地实现成为CFO这个目标呢？实际上，很多人在年轻的时候是没想过或没想明白这个问题的。这样，在未来出现机遇的时候，往往会与之失之交臂，或者勉强上任，但无法达到预期的绩效目标。


    笔者将通过搭建一个智能时代CFO的基础能力框架来尝试回答这个问题，如图3-1所示。对自己未来充满希望的财务朋友们，可以看看自己在哪些方面还有提升的空间。这个框架考虑到了智能时代财务管理职能的需求，故称之为智能时代CFO的基础能力框架。


    ![img](images/txt003_1.jpg)


    图3-1　智能时代CFO基础能力框架


    （一）战略财务基础能力框架


    1.战略与业务


    作为CFO，需要有非常宽阔的知识面，但最重要并不是专业知识，而是对公司战略和业务的理解及把控。该能力决定了CFO是否能够真正成为一个经营团队的合格管理者，而不仅仅是一个财务工作者。


    核心技能：战略解读；财务与战略配合；公司资源及计划的管理参与；财务资源配置管理；与业务单元的沟通。


    2.财会控制机制


    作为CFO，需要在企业内部建立完善的财务、内部控制和内部审计体系，以确保会计风险的可控性。也有一些公司是由首席风险官负责这部分职能的。


    核心技能：财务及会计制度管理；内部控制；内部审计与稽核。


    3.价值管理


    价值管理是CFO的高阶技能，需要从多方面主动管理以提升公司的价值，并最终在股价上有所体现，满足公司股东的投资回报诉求。


    核心技能：产权管理；营运资本管理；现金流量管理；经济附加值管理；新业务价值管理；并购价值管理。


    4.经营分析与绩效管理


    经营分析与绩效管理是CFO在公司经营管理方面体现自身核心价值的重要内容，好的CFO是公司持续前进的一个重要推动器。通过KPI的设定，以及持续的考核跟踪、深度的经营与数字探究，能够给企业的发展注入强大的活力。


    核心技能：KPI体系搭建；经营分析报告；绩效考核制度搭建及奖惩执行；投入产出管理；市场对标管理；重大关键项目管理。


    5.全面预算管理


    全面预算管理是CFO在资源配置方面配合企业战略落地的重要工作。凡事预则立，不预则废，CFO正是承担起这项职能的重要角色。当然，全面预算管理并不仅仅是财务的事情，但是作为CFO去承担牵头职能还是必需的。


    核心技能：经营计划管理；预算编制管理；预算执行与控制管理；预算分析；预算组织管理；预算流程管理；预算系统管理。


    （二）专业财务基础能力框架


    1.会计与报告管理


    作为CFO，会计与报告是不可缺失的基本技能。当然，CFO可以请会计专业人士和会计师事务所代劳，但无论如何是绕不开这项技能的，必须懂会计。


    核心技能：会计交易处理及相关流程；往来管理、关联交易管理等会计管理；会计报告及合并；会计信息系统，如核算系统、合并系统等；信息披露；审计流程及管理。


    2.税务管理


    税务管理是CFO的传统工作领域，无论在世界上的哪个国家，CFO都是绕不开税务工作的。而在中国，税务又有着自己的特点，CFO需要将税务管理当成一项既严肃又充满艺术性的工作来对待。


    核心技能：税务政策研究；税务关系管理；税务检查配合与风险防范；税务数据管理；税务系统管理；营改增及电子发票/特定时期的特殊事项。


    3.资金管理


    资金管理是CFO工作中的重要一环，也是对一个称职CFO的基本要求。从分类上说，资金管理是专业财务的一个构成领域，具有一定的技术性，如果没有从事过这个领域的工作，要覆盖这部分专业知识是有一定难度的。


    核心技能：资金收付管理；资金计划管理；债券融资管理；混合融资管理；股权融资管理；司库管理；外汇管理；银行关系管理；资金系统管理；流动性管理；投资管理。


    4.合规管理


    合规管理对于很多监管行业非常重要，监管机构有金融行业的银保监会、人民银行等，上市公司的证监会等。作为CFO，需要很好地把握监管政策，主动、积极应对，以避免因合规问题给公司带来损失。


    核心技能：监管政策研究；监管沟通及检查应对；监管信息报送；违规风险管理及违规后危机管理。


    5.管理会计


    管理会计是当下各大CFO面对的既久远又新鲜的课题。国内正在掀起一波管理会计体系建设的热潮，CFO不可免俗，必须要懂管理会计。


    核心技能：维度体系搭建；收入分成管理；成本分摊；多维度盈利分析；作业成本管理；资金转移定价（FTP）管理；风险成本和资本成本管理；管会数据应用（定价、精准营销等）；管理会计系统。


    6.成本管理


    成本管理单独拿出来说，是因为它对于每个企业来说都是十分重要的一项内容。对于CFO来说，要开源节流，其中的节流就要靠成本管控。甚至对于一些企业来说，成本管理是其生存的核心战略和命脉。


    核心技能：成本战略体系设计；基于价值链的全成本管理；费用的前置管控；成本文化建设；最佳成本实践的形成和推广。


    7.财务风险管理


    广义的风险管理领域是首席风险官的管理职责，但在财务领域，CFO应该对财务相关风险予以高度关注，并实施有效的管理。CFO力求创造价值，但必须牢记，风险是底线，控制好财务风险是一个好CFO的必修课。


    核心技能：财务操作风险管理；财务风险意识及管理文化建设；RCSA风险控制与自我评价工具的财务应用；KRI关键风险指标体系的财务领域搭建；重大风险事件监控。


    （三）业务财务基础能力框架


    1.产品财务管理


    产品财务是业务财务中向产品事业部提供财务专业服务的队伍，CFO需要基于产品财务队伍，加强对以产品规划、产品研发为核心的产品全生命周期的财务管理。


    核心技能：产品规划及投资财务管理；产品研发财务管理；产品周转资金管理；产品质量成本管理；产品最佳财务实践管理。


    2.营销财务管理


    营销财务是财务队伍中服务于营销或销售事业部的业务财务队伍。CFO需要通过营销财务开展对营销、销售过程的财务管理，如合同商务管理、客户相关财务管理、销售费用管理等工作。


    核心技能：商务合同财务管理；营销及销售费用管理；客户信用及风险管理；竞争对手财务及经营信息管理。


    3.供应链财务管理


    供应链财务主要为企业经营中供应链相关环节提供业务财务支持。CFO需要借助供应链财务实现对采购、生产、配送等相关业务环节的财务管理。


    核心技能：采购财务管理；生产财务管理；库存控制管理；配送物流财务管理；分销财务管理。


    4.项目财务管理


    除了以价值链划分的业务财务之外，CFO 还需要关注另一个业务财务维度，即项目维度。项目财务是从另一个视角与产品、销售、供应链财务进行矩阵式协同的业务财务职能。


    核心技能：①研发项目财务管理；②市场推动项目财务管理；③售前/销售项目财务管理；④工程项目财务管理；⑤实施交付项目财务管理；⑥管理支持项目财务管理。


    5.海外财务管理


    对于开拓海外市场的企业来说，CFO还需要高度关注海外财务管理工作，特别是在新进入一个国家时，海外财务的支持能力显得尤为重要。


    核心技能：国家财税政策管理；海外机构综合财务管理。


    6.业财一体化管理


    CFO需要始终保持对业务财务一体化的关注度和警惕性，通过加强业务财务一体化管理，实现有效的业务与财务核对管理，提升业务与财务的一致性水平。


    核心技能：业财一致的制度及流程管理；业财对账管理；业财一致性系统管理。


    （四）财务共享服务基础能力框架


    1.财务共享服务中心设立管理


    财务共享服务在中国的发展已经超过了十个年头，如今大中型企业已普遍将财务共享服务中心作为标配。因此，作为CFO，需要对财务共享服务的模式有所了解，从而有效地开展建设。


    核心技能：财务共享服务中心立项；财务共享服务中心战略规划；财务共享服务中心建设方案设计；财务共享服务中心实施；财务共享服务中心业务移管。


    2.财务共享服务中心组织与人员管理


    财务共享服务中心是一种基于大规模生产的运营管理模式，这种模式对组织和人员管理都有较高的要求，CFO应当关注财务共享服务中心的组织效率和人员的稳定性、成长性。


    核心技能：财务共享服务中心组织职责管理；财务共享服务中心岗位及架构；财务共享服务中心人员招聘；财务共享服务中心人员培训及发展；财务共享服务中心人员考核；财务共享服务中心人员保留。


    3.财务共享服务中心流程管理


    流程管理是财务共享服务管理的精髓，CFO应当关注财务共享服务中心端到端的流程体系建设及流程维护、持续优化，以提高流程效率，降低流程成本。


    核心技能：财务共享服务中心流程体系定义；财务共享服务中心标准化流程设计；财务共享服务中心标准化流程维护和执行监控；财务共享服务中心流程持续改进。


    4.财务共享服务中心运营管理


    财务共享服务中心需要有效地运营以创造价值，CFO需要对运营管理中的核心职能予以关注。


    核心技能：财务共享服务中心绩效管理；财务共享准入管理；财务共享SLA（服务水平协议）及定价管理；财务共享人员管理；财务共享风险与质量管理；财务共享“服务”管理；财务共享信息系统管理。


    5.财务服务外包及众包管理


    服务外包和众包是财务共享服务模式的延伸和补充，CFO需要关注应如何进行外包、众包与共享服务之间的选择决策，同时对外包和众包的管理也需要有特定的模式。


    核心技能：服务模式战略管理；外包供应商选择管理；外包商交付管理；众包平台搭建；众包平台用户获取、服务及管理；外包及众包风险管理。


    （五）财务通用支持基础能力框架


    1.财务组织、人员管理


    作为CFO，建设财务组织、培养财务队伍是责无旁贷的。因此，人力资源管理理论在财务领域的应用也是CFO需要掌握的。一个管理不好组织、团队和人员的CFO，必然是一个不称职的CFO。


    核心技能：财务的分层治理机制；财务组织架构及岗位设计；财务团队及干部管理；财务人员绩效管理；财务培训及知识管理。


    2.财务信息化及智能化管理


    对于现代的CFO来说，财务信息化和智能化管理已经是不可或缺的技能。财务的大量工作都是建立在信息系统基础之上的，因此，对于CFO来说，懂一些信息系统知识是十分必要的。而在未来，财务的大量工作还会进一步被信息系统所取代。可以说，不懂信息系统相关知识的CFO在未来根本无法生存。


    核心技能：财务信息化团队建设；财务产品设计及系统架构；财务与IT之间的沟通管理；财务大数据技术；财务自动化及智能化技术。


    ## 第三节　智能时代财务人员的择业模型


    智能时代的来临，对整个社会包括财务人员的影响是全面且深远的。在这样的环境下，财务人员的择业观被影响和改变着。面对未来，财务人员有三种选择—不变、远离或拥抱。选择本身没有对错之分，但我们在作出不同选择的时候，都需要给自己找到适应智能时代环境的新择业标准，这将从某种意义上改变我们的职业生涯。


    智能时代，世界在改变，财务也在改变。当智能时代来临的时候，财务人员不可避免地会受到巨大的冲击，也必须要面对认知的升级。无论是高级管理人员、财务经营分析人员、预算管理人员还是会计运营人员，都必须要面对这种改变。


    这也引发了不少财务人员对未来职业发展的担忧，关于人工智能是否会取代财务人员的讨论也成为热议的话题。在2017年4月底召开的全球移动互联网大会（GMIC ）2017北京大会上，李开复与霍金展开了隔空对话。霍金认为：“对于人工智能的崛起，其好坏我们仍无法确定，现在人类只能竭尽所能，确保其未来发展对人类和环境有利，人类别无选择。”李开复则提出这样的问题：“我们要看到，人工智能要取代50％的人的工作，在未来10～15年间，这些人怎么办？还有更重要的，教育怎么办？”是的，在智能时代，有些问题已不是我们能决定是否面对，我们只能思考如何面对。


    今天，作为一名在职场中生存的财务人员，已经难以想象终生服务于一家企业。择业本就是一件不可回避的事情，而智能时代的择业将伴随着更加困难的抉择。


    ### 一、三种选择：智能时代财务人的“进”“退”“守”


    在智能时代，财务人员面对整个社会变革、新技术的挑战能作出的选择无外乎“进”“退”“守”三种模式。'
  fmt: '

    第三，需要财会人员具备企业运营管理经验。财会人员是企业的核心人员，企业发展过程中需要财会人员的全程参与。财会人员可以利用自身丰富的财务知识以及法律知识等，对企业及市场情况进行分析，帮助管理者和决策者更好地完成管理和决策工作，促进企业发展。有些财会人员过多关注财务数据，对运营管理相关知识的积累较少。


    第四，需要财会人员熟悉人工智能技术。目前，人工智能带来了新的挑战，会计工作不再是一成不变的。有些财会人员只专注财务专业知识的积累，计算机及人工智能相关的知识欠缺。因此，无法将财务专业知识与人工智能技术相结合，辅助人工智能系统的开发和升级。


    第五，需要财会人员具有跨领域工作经验。有些财会人员受到专业、性格、思维模式等影响，对企业宏观经济背景、国家政策等关注度不够。对计算机知识、宏观经济学、金融学、市场营销学等相关领域的研究较少，在跨领域横向转型中工作经验少，选择面比较窄。


    总之，人工智能背景下财会人员面临着巨大的挑战，工作岗位急剧减少，企业对财会人员的工作胜任能力要求越来越高，企业对财会人员的需求类型发生了变化。同时，管理层对财会人员的职业生涯管理不够重视，很多企业虽然有提到员工的职业生涯管理体系，但往往只是停留于表面，并没有真正将员工职业生涯管理体系付诸实践。


    ## 第二节　智能时代财务人员的基础能力框架


    ### 一、财务人员转型的方向


    随着财务共享与智能化的结合越发紧密，共享中心将从一个人力密集型组织转变为一个技术密集型组织。随着规则的不断梳理与完善，并在信息系统中形成可执行的规则后，财务共享中心的作业人员将可被替换，并最终趋于人力的削减。从管理者角度来说，这对整个组织是有益的，但也会对财务共享中心现存员工的转型形成极大的挑战。部分能力较高的员工将转至规则梳理的相关岗位，而大量的员工可能因为智能化而离开工作岗位。因此，财务人员只有适应时代发展，加速转型，才有可能避免在新财务时代被淘汰。


    #### （一）财务人员应向“成本控制与内部控制人员”转型


    大数据时代的到来与不断发展，企业管理会计逐渐彰显出其重要性。因此，在大数据时代下，企业的财务人员应积极调整思路，逐渐向管理会计的方向转型。对于企业来说，随着市场经济的不断发展与完善，在微利时代，成本的高低将成为企业获利的关键性因素。在大数据时代，专业的成本分析与控制人员不仅要具备丰富的、扎实的财务专业知识，还必须对企业的各项生产工艺流程、生产环节、企业的内控流程等进行了解与高度关注，并在成本控制系统的帮助下，充分挖掘相关成本数据，对成本数据进行合理的分配、归集、构成分析等，从而为企业成本的有效控制奠定基础，为企业的决策提供帮助。


    #### （二）财务人员应向“全面预算人员”转型


    现代企业进行的管理基本都是事后管理，越来越多的企业采用ERP系统对企业数据进行整合，通过对数据穿透查询，结合企业的预测目标，将企业事后管理逐步变成事前控制。用信息化手段进行事前控制、预测等对企业管理十分重要。在大数据时代，预算作为财务管理的领头羊、核心，要求企业参与预算的财务人员站在企业战略规划的高度，对企业的战略规划目标进行层层分解，直至最后的预算分析报告的编制、预算绩效考核，以及预算对未来目标与战略的影响与规划，使预算真正发挥其职能作用。因此，大数据时代需要企业的财务人员向全面预算人员转型。


    #### （三）财务人员应向“专业财务分析人员”转型


    企业的财务人员必须具备专业的分析技能，能够从海量的数据中挖掘出对企业有价值的信息；同时，还可以在数据分析过程中更加全面地了解企业的发展现状与存在的问题，及时对企业的财务状况、经营成果进行评价，为提高企业的经营管理效率提供更有价值的分析。因此，大数据时代的企业财务人员应积极向专业的财务分析人员转型。


    #### （四）财务人员应向“风险管理人员”转型


    风险管理主要是企业从战略制定到日常经营过程中对待风险的一系列信念与态度，目的是确定可能影响企业的潜在事项，并进行管理，为实现企业的目标提供合理的保证。实践证明，内部控制的有效实施有赖于风险管理，战略型财务人员需将企业的风险的影响控制在可接受的范围内，以此来促进企业的可持续发展。因此，在大数据时代，企业的财务人员应向风险管理人员转型。


    #### （五）财务人员应向“技术型财务人员、战略型财务人员”转型


    大数据、大共享理念的延伸与拓展要求财务共享的产生，并在未来成为主要的工作环境，并借此形成数据中心，为未来的决策与发展奠定基础。财务共享中心的人员是财务人员在大数据时代转型的另一个方向。在财务共享中心中，有设计好的专业的标准与流程。例如，应收应付款项、费用报销、明细账的管理、总账及各种财务报销、资金的管理、税务的合理筹划等。这一职能对财务人员的要求并不高，只要具有一定的财务基础知识、英语基础知识、计算机基础知识，并经过一定的培训即可转型上岗，对于那些处于初级阶段的财务人员来说是一个较好的工作选择。在经过一段时间的熟悉以后，可以向更高级的技术型财务人员、战略型财务人员转型。


    在财务共享管理模式下，业务转型定位将财务人员分为共享财务、业务财务、战略财务三类。其中，高端财务岗位的需求将会增加，对从业人员的学历、经验、技能要求也更高更全面。相反，财务的一般岗位对财务人员的技能要求不高，一些工作完全可以用自动化技术或人工智能代替，导致基础财务人员将会被大幅度裁员，尤其是企业内部同质化的岗位将被“共享”掉，整体财务岗位缩编。


    普通的财务人员转型为共享财务人员，其人数低于缩编后财务人员总体比重的40％。普通财务人员是指那些学历层次相对不高、年龄不大，掌握新技能、学习新知识的能力较强，同时又具备财务会计实务操作经验的工作人员。这些财务人员长期在一线从事财务基础工作，在原始单据审核、凭证录入、交易结算等方面积累了丰富的实战经验，可通过选拔、培训后到财务共享中心从事财务会计工作。但是，现实中由于国内的整体教育环境，本科学历人才的供给成本已经大幅度降低，并且呈现出供大于求的长期趋势，本科学历的员工会成为共享财务中心高性价比的首选人才。


    优秀的财务人员转型为业务财务人员，其人数约占缩编后财务人员总体比重近50％。优秀的财务人员指学历教育层次较高，专业知识系统和实操经验丰富的工作人员。他们应该深入业务前端，针对企业研发、供应、生产、营销等各个环节进行财务分析、预测、规划、控制、激励、考核等，加快财务与业务的融合，积极参与公司价值链各环节的价值创造，即完成财务与业务的各个层级的融合，能把财务数据转化为信息，并以业务语言传递给各级领导，辅助后者决策，并且可以把业务部门遇到的困难及时反馈到财务部门。


    卓越的财务人员应转型为战略财务人员，他们是真正的财务精英，将占缩编后财务人员总体的20％左右。卓越的财务人员指学历层次很高（至少财经专业本科以上毕业生），管理知识储备深厚，既掌握财务会计实务，又懂得战略规划，对财务管理及其他经济领域业务也有深入研究，精于预算管理、绩效评价、风险管理、内部控制、资本运作、纳税筹划等的工作人员，他们可作为战略财务培养。战略财务不仅相当于企业总部的参谋，还是管理者进行战略决策时的重要伙伴，是全面预算与绩效管理的设计师，是制定和实施组织战略的专家。


    ### 二、财务人员基础能力框架


    所有期望成为CFO的财务人都很关心一个问题：应当积累哪些知识才能更加高效地实现成为CFO这个目标呢？实际上，很多人在年轻的时候是没想过或没想明白这个问题的。这样，在未来出现机遇的时候，往往会与之失之交臂，或者勉强上任，但无法达到预期的绩效目标。


    笔者将通过搭建一个智能时代CFO的基础能力框架来尝试回答这个问题，如图3-1所示。对自己未来充满希望的财务朋友们，可以看看自己在哪些方面还有提升的空间。这个框架考虑到了智能时代财务管理职能的需求，故称之为智能时代CFO的基础能力框架。


    ![img](images/txt003_1.jpg)


    图3-1　智能时代CFO基础能力框架


    #### （一）战略财务基础能力框架


    ##### 1. 战略与业务


    作为CFO，需要有非常宽阔的知识面，但最重要并不是专业知识，而是对公司战略和业务的理解及把控。该能力决定了CFO是否能够真正成为一个经营团队的合格管理者，而不仅仅是一个财务工作者。


    核心技能：战略解读；财务与战略配合；公司资源及计划的管理参与；财务资源配置管理；与业务单元的沟通。


    ##### 2. 财会控制机制


    作为CFO，需要在企业内部建立完善的财务、内部控制和内部审计体系，以确保会计风险的可控性。也有一些公司是由首席风险官负责这部分职能的。


    核心技能：财务及会计制度管理；内部控制；内部审计与稽核。


    ##### 3. 价值管理


    价值管理是CFO的高阶技能，需要从多方面主动管理以提升公司的价值，并最终在股价上有所体现，满足公司股东的投资回报诉求。


    核心技能：产权管理；营运资本管理；现金流量管理；经济附加值管理；新业务价值管理；并购价值管理。


    ##### 4. 经营分析与绩效管理


    经营分析与绩效管理是CFO在公司经营管理方面体现自身核心价值的重要内容，好的CFO是公司持续前进的一个重要推动器。通过KPI的设定，以及持续的考核跟踪、深度的经营与数字探究，能够给企业的发展注入强大的活力。


    核心技能：KPI体系搭建；经营分析报告；绩效考核制度搭建及奖惩执行；投入产出管理；市场对标管理；重大关键项目管理。


    ##### 5. 全面预算管理


    全面预算管理是CFO在资源配置方面配合企业战略落地的重要工作。凡事预则立，不预则废，CFO正是承担起这项职能的重要角色。当然，全面预算管理并不仅仅是财务的事情，但是作为CFO去承担牵头职能还是必需的。


    核心技能：经营计划管理；预算编制管理；预算执行与控制管理；预算分析；预算组织管理；预算流程管理；预算系统管理。


    #### （二）专业财务基础能力框架


    ##### 1. 会计与报告管理


    作为CFO，会计与报告是不可缺失的基本技能。当然，CFO可以请会计专业人士和会计师事务所代劳，但无论如何是绕不开这项技能的，必须懂会计。


    核心技能：会计交易处理及相关流程；往来管理、关联交易管理等会计管理；会计报告及合并；会计信息系统，如核算系统、合并系统等；信息披露；审计流程及管理。


    ##### 2. 税务管理


    税务管理是CFO的传统工作领域，无论在世界上的哪个国家，CFO都是绕不开税务工作的。而在中国，税务又有着自己的特点，CFO需要将税务管理当成一项既严肃又充满艺术性的工作来对待。


    核心技能：税务政策研究；税务关系管理；税务检查配合与风险防范；税务数据管理；税务系统管理；营改增及电子发票/特定时期的特殊事项。


    ##### 3. 资金管理


    资金管理是CFO工作中的重要一环，也是对一个称职CFO的基本要求。从分类上说，资金管理是专业财务的一个构成领域，具有一定的技术性，如果没有从事过这个领域的工作，要覆盖这部分专业知识是有一定难度的。


    核心技能：资金收付管理；资金计划管理；债券融资管理；混合融资管理；股权融资管理；司库管理；外汇管理；银行关系管理；资金系统管理；流动性管理；投资管理。


    ##### 4. 合规管理


    合规管理对于很多监管行业非常重要，监管机构有金融行业的银保监会、人民银行等，上市公司的证监会等。作为CFO，需要很好地把握监管政策，主动、积极应对，以避免因合规问题给公司带来损失。


    核心技能：监管政策研究；监管沟通及检查应对；监管信息报送；违规风险管理及违规后危机管理。


    ##### 5. 管理会计


    管理会计是当下各大CFO面对的既久远又新鲜的课题。国内正在掀起一波管理会计体系建设的热潮，CFO不可免俗，必须要懂管理会计。


    核心技能：维度体系搭建；收入分成管理；成本分摊；多维度盈利分析；作业成本管理；资金转移定价（FTP）管理；风险成本和资本成本管理；管会数据应用（定价、精准营销等）；管理会计系统。


    ##### 6. 成本管理


    成本管理单独拿出来说，是因为它对于每个企业来说都是十分重要的一项内容。对于CFO来说，要开源节流，其中的节流就要靠成本管控。甚至对于一些企业来说，成本管理是其生存的核心战略和命脉。


    核心技能：成本战略体系设计；基于价值链的全成本管理；费用的前置管控；成本文化建设；最佳成本实践的形成和推广。


    ##### 7. 财务风险管理


    广义的风险管理领域是首席风险官的管理职责，但在财务领域，CFO应该对财务相关风险予以高度关注，并实施有效的管理。CFO力求创造价值，但必须牢记，风险是底线，控制好财务风险是一个好CFO的必修课。


    核心技能：财务操作风险管理；财务风险意识及管理文化建设；RCSA风险控制与自我评价工具的财务应用；KRI关键风险指标体系的财务领域搭建；重大风险事件监控。


    #### （三）业务财务基础能力框架


    ##### 1. 产品财务管理


    产品财务是业务财务中向产品事业部提供财务专业服务的队伍，CFO需要基于产品财务队伍，加强对以产品规划、产品研发为核心的产品全生命周期的财务管理。


    核心技能：产品规划及投资财务管理；产品研发财务管理；产品周转资金管理；产品质量成本管理；产品最佳财务实践管理。


    ##### 2. 营销财务管理


    营销财务是财务队伍中服务于营销或销售事业部的业务财务队伍。CFO需要通过营销财务开展对营销、销售过程的财务管理，如合同商务管理、客户相关财务管理、销售费用管理等工作。


    核心技能：商务合同财务管理；营销及销售费用管理；客户信用及风险管理；竞争对手财务及经营信息管理。


    ##### 3. 供应链财务管理


    供应链财务主要为企业经营中供应链相关环节提供业务财务支持。CFO需要借助供应链财务实现对采购、生产、配送等相关业务环节的财务管理。


    核心技能：采购财务管理；生产财务管理；库存控制管理；配送物流财务管理；分销财务管理。


    ##### 4. 项目财务管理


    除了以价值链划分的业务财务之外，CFO 还需要关注另一个业务财务维度，即项目维度。项目财务是从另一个视角与产品、销售、供应链财务进行矩阵式协同的业务财务职能。


    核心技能：①研发项目财务管理；②市场推动项目财务管理；③售前/销售项目财务管理；④工程项目财务管理；⑤实施交付项目财务管理；⑥管理支持项目财务管理。


    ##### 5. 海外财务管理


    对于开拓海外市场的企业来说，CFO还需要高度关注海外财务管理工作，特别是在新进入一个国家时，海外财务的支持能力显得尤为重要。


    核心技能：国家财税政策管理；海外机构综合财务管理。


    ##### 6. 业财一体化管理


    CFO需要始终保持对业务财务一体化的关注度和警惕性，通过加强业务财务一体化管理，实现有效的业务与财务核对管理，提升业务与财务的一致性水平。


    核心技能：业财一致的制度及流程管理；业财对账管理；业财一致性系统管理。


    #### （四）财务共享服务基础能力框架


    ##### 1. 财务共享服务中心设立管理


    财务共享服务在中国的发展已经超过了十个年头，如今大中型企业已普遍将财务共享服务中心作为标配。因此，作为CFO，需要对财务共享服务的模式有所了解，从而有效地开展建设。


    核心技能：财务共享服务中心立项；财务共享服务中心战略规划；财务共享服务中心建设方案设计；财务共享服务中心实施；财务共享服务中心业务移管。


    ##### 2. 财务共享服务中心组织与人员管理


    财务共享服务中心是一种基于大规模生产的运营管理模式，这种模式对组织和人员管理都有较高的要求，CFO应当关注财务共享服务中心的组织效率和人员的稳定性、成长性。


    核心技能：财务共享服务中心组织职责管理；财务共享服务中心岗位及架构；财务共享服务中心人员招聘；财务共享服务中心人员培训及发展；财务共享服务中心人员考核；财务共享服务中心人员保留。


    ##### 3. 财务共享服务中心流程管理


    流程管理是财务共享服务管理的精髓，CFO应当关注财务共享服务中心端到端的流程体系建设及流程维护、持续优化，以提高流程效率，降低流程成本。


    核心技能：财务共享服务中心流程体系定义；财务共享服务中心标准化流程设计；财务共享服务中心标准化流程维护和执行监控；财务共享服务中心流程持续改进。


    ##### 4. 财务共享服务中心运营管理


    财务共享服务中心需要有效地运营以创造价值，CFO需要对运营管理中的核心职能予以关注。


    核心技能：财务共享服务中心绩效管理；财务共享准入管理；财务共享SLA（服务水平协议）及定价管理；财务共享人员管理；财务共享风险与质量管理；财务共享“服务”管理；财务共享信息系统管理。


    ##### 5. 财务服务外包及众包管理


    服务外包和众包是财务共享服务模式的延伸和补充，CFO需要关注应如何进行外包、众包与共享服务之间的选择决策，同时对外包和众包的管理也需要有特定的模式。


    核心技能：服务模式战略管理；外包供应商选择管理；外包商交付管理；众包平台搭建；众包平台用户获取、服务及管理；外包及众包风险管理。


    #### （五）财务通用支持基础能力框架


    ##### 1. 财务组织、人员管理


    作为CFO，建设财务组织、培养财务队伍是责无旁贷的。因此，人力资源管理理论在财务领域的应用也是CFO需要掌握的。一个管理不好组织、团队和人员的CFO，必然是一个不称职的CFO。


    核心技能：财务的分层治理机制；财务组织架构及岗位设计；财务团队及干部管理；财务人员绩效管理；财务培训及知识管理。


    ##### 2. 财务信息化及智能化管理


    对于现代的CFO来说，财务信息化和智能化管理已经是不可或缺的技能。财务的大量工作都是建立在信息系统基础之上的，因此，对于CFO来说，懂一些信息系统知识是十分必要的。而在未来，财务的大量工作还会进一步被信息系统所取代。可以说，不懂信息系统相关知识的CFO在未来根本无法生存。


    核心技能：财务信息化团队建设；财务产品设计及系统架构；财务与IT之间的沟通管理；财务大数据技术；财务自动化及智能化技术。


    ## 第三节　智能时代财务人员的择业模型


    智能时代的来临，对整个社会包括财务人员的影响是全面且深远的。在这样的环境下，财务人员的择业观被影响和改变着。面对未来，财务人员有三种选择—不变、远离或拥抱。选择本身没有对错之分，但我们在作出不同选择的时候，都需要给自己找到适应智能时代环境的新择业标准，这将从某种意义上改变我们的职业生涯。


    智能时代，世界在改变，财务也在改变。当智能时代来临的时候，财务人员不可避免地会受到巨大的冲击，也必须要面对认知的升级。无论是高级管理人员、财务经营分析人员、预算管理人员还是会计运营人员，都必须要面对这种改变。


    这也引发了不少财务人员对未来职业发展的担忧，关于人工智能是否会取代财务人员的讨论也成为热议的话题。在2017年4月底召开的全球移动互联网大会（GMIC ）2017北京大会上，李开复与霍金展开了隔空对话。霍金认为：“对于人工智能的崛起，其好坏我们仍无法确定，现在人类只能竭尽所能，确保其未来发展对人类和环境有利，人类别无选择。”李开复则提出这样的问题：“我们要看到，人工智能要取代50％的人的工作，在未来10～15年间，这些人怎么办？还有更重要的，教育怎么办？”是的，在智能时代，有些问题已不是我们能决定是否面对，我们只能思考如何面对。


    今天，作为一名在职场中生存的财务人员，已经难以想象终生服务于一家企业。择业本就是一件不可回避的事情，而智能时代的择业将伴随着更加困难的抉择。


    ### 一、三种选择：智能时代财务人的“进”“退”“守”


    在智能时代，财务人员面对整个社会变革、新技术的挑战能作出的选择无外乎“进”“退”“守”三种模式。

    '
  trans: '


    第三，需要财会人员具备企业运营管理经验。财会人员是企业的核心人员，企业发展过程中需要财会人员的全程参与。财会人员可以利用自身丰富的财务知识以及法律知识等，对企业及市场情况进行分析，帮助管理者和决策者更好地完成管理和决策工作，促进企业发展。有些财会人员过多关注财务数据，对运营管理相关知识的积累较少。


    第四，需要财会人员熟悉人工智能技术。目前，人工智能带来了新的挑战，会计工作不再是一成不变的。有些财会人员只专注财务专业知识的积累，计算机及人工智能相关的知识欠缺。因此，无法将财务专业知识与人工智能技术相结合，辅助人工智能系统的开发和升级。


    第五，需要财会人员具有跨领域工作经验。有些财会人员受到专业、性格、思维模式等影响，对企业宏观经济背景、国家政策等关注度不够。对计算机知识、宏观经济学、金融学、市场营销学等相关领域的研究较少，在跨领域横向转型中工作经验少，选择面比较窄。


    总之，人工智能背景下财会人员面临着巨大的挑战，工作岗位急剧减少，企业对财会人员的工作胜任能力要求越来越高，企业对财会人员的需求类型发生了变化。同时，管理层对财会人员的职业生涯管理不够重视，很多企业虽然有提到员工的职业生涯管理体系，但往往只是停留于表面，并没有真正将员工职业生涯管理体系付诸实践。


    ## 第二节　智能时代财务人员的基础能力框架


    ### 一、财务人员转型的方向


    随着财务共享与智能化的结合越发紧密，共享中心将从一个人力密集型组织转变为一个技术密集型组织。随着规则的不断梳理与完善，并在信息系统中形成可执行的规则后，财务共享中心的作业人员将可被替换，并最终趋于人力的削减。从管理者角度来说，这对整个组织是有益的，但也会对财务共享中心现存员工的转型形成极大的挑战。部分能力较高的员工将转至规则梳理的相关岗位，而大量的员工可能因为智能化而离开工作岗位。因此，财务人员只有适应时代发展，加速转型，才有可能避免在新财务时代被淘汰。


    #### （一）财务人员应向“成本控制与内部控制人员”转型


    大数据时代的到来与不断发展，企业管理会计逐渐彰显出其重要性。因此，在大数据时代下，企业的财务人员应积极调整思路，逐渐向管理会计的方向转型。对于企业来说，随着市场经济的不断发展与完善，在微利时代，成本的高低将成为企业获利的关键性因素。在大数据时代，专业的成本分析与控制人员不仅要具备丰富的、扎实的财务专业知识，还必须对企业的各项生产工艺流程、生产环节、企业的内控流程等进行了解与高度关注，并在成本控制系统的帮助下，充分挖掘相关成本数据，对成本数据进行合理的分配、归集、构成分析等，从而为企业成本的有效控制奠定基础，为企业的决策提供帮助。


    #### （二）财务人员应向“全面预算人员”转型


    现代企业进行的管理基本都是事后管理，越来越多的企业采用 ERP 系统对企业数据进行整合，通过对数据穿透查询，结合企业的预测目标，将企业事后管理逐步变成事前控制。用信息化手段进行事前控制、预测等对企业管理十分重要。在大数据时代，预算作为财务管理的领头羊、核心，要求企业参与预算的财务人员站在企业战略规划的高度，对企业的战略规划目标进行层层分解，直至最后的预算分析报告的编制、预算绩效考核，以及预算对未来目标与战略的影响与规划，使预算真正发挥其职能作用。因此，大数据时代需要企业的财务人员向全面预算人员转型。


    #### （三）财务人员应向“专业财务分析人员”转型


    企业的财务人员必须具备专业的分析技能，能够从海量的数据中挖掘出对企业有价值的信息；同时，还可以在数据分析过程中更加全面地了解企业的发展现状与存在的问题，及时对企业的财务状况、经营成果进行评价，为提高企业的经营管理效率提供更有价值的分析。因此，大数据时代的企业财务人员应积极向专业的财务分析人员转型。


    #### （四）财务人员应向“风险管理人员”转型


    风险管理主要是企业从战略制定到日常经营过程中对待风险的一系列信念与态度，目的是确定可能影响企业的潜在事项，并进行管理，为实现企业的目标提供合理的保证。实践证明，内部控制的有效实施有赖于风险管理，战略型财务人员需将企业的风险的影响控制在可接受的范围内，以此来促进企业的可持续发展。因此，在大数据时代，企业的财务人员应向风险管理人员转型。


    #### （五）财务人员应向“技术型财务人员、战略型财务人员”转型


    大数据、大共享理念的延伸与拓展要求财务共享的产生，并在未来成为主要的工作环境，并借此形成数据中心，为未来的决策与发展奠定基础。财务共享中心的人员是财务人员在大数据时代转型的另一个方向。在财务共享中心中，有设计好的专业的标准与流程。例如，应收应付款项、费用报销、明细账的管理、总账及各种财务报销、资金的管理、税务的合理筹划等。这一职能对财务人员的要求并不高，只要具有一定的财务基础知识、英语基础知识、计算机基础知识，并经过一定的培训即可转型上岗，对于那些处于初级阶段的财务人员来说是一个较好的工作选择。在经过一段时间的熟悉以后，可以向更高级的技术型财务人员、战略型财务人员转型。


    在财务共享管理模式下，业务转型定位将财务人员分为共享财务、业务财务、战略财务三类。其中，高端财务岗位的需求将会增加，对从业人员的学历、经验、技能要求也更高更全面。相反，财务的一般岗位对财务人员的技能要求不高，一些工作完全可以用自动化技术或人工智能代替，导致基础财务人员将会被大幅度裁员，尤其是企业内部同质化的岗位将被“共享”掉，整体财务岗位缩编。


    普通的财务人员转型为共享财务人员，其人数低于缩编后财务人员总体比重的 40％。普通财务人员是指那些学历层次相对不高、年龄不大，掌握新技能、学习新知识的能力较强，同时又具备财务会计实务操作经验的工作人员。这些财务人员长期在一线从事财务基础工作，在原始单据审核、凭证录入、交易结算等方面积累了丰富的实战经验，可通过选拔、培训后到财务共享中心从事财务会计工作。但是，现实中由于国内的整体教育环境，本科学历人才的供给成本已经大幅度降低，并且呈现出供大于求的长期趋势，本科学历的员工会成为共享财务中心高性价比的首选人才。


    优秀的财务人员转型为业务财务人员，其人数约占缩编后财务人员总体比重近 50％。优秀的财务人员指学历教育层次较高，专业知识系统和实操经验丰富的工作人员。他们应该深入业务前端，针对企业研发、供应、生产、营销等各个环节进行财务分析、预测、规划、控制、激励、考核等，加快财务与业务的融合，积极参与公司价值链各环节的价值创造，即完成财务与业务的各个层级的融合，能把财务数据转化为信息，并以业务语言传递给各级领导，辅助后者决策，并且可以把业务部门遇到的困难及时反馈到财务部门。


    卓越的财务人员应转型为战略财务人员，他们是真正的财务精英，将占缩编后财务人员总体的 20％左右。卓越的财务人员指学历层次很高（至少财经专业本科以上毕业生），管理知识储备深厚，既掌握财务会计实务，又懂得战略规划，对财务管理及其他经济领域业务也有深入研究，精于预算管理、绩效评价、风险管理、内部控制、资本运作、纳税筹划等的工作人员，他们可作为战略财务培养。战略财务不仅相当于企业总部的参谋，还是管理者进行战略决策时的重要伙伴，是全面预算与绩效管理的设计师，是制定和实施组织战略的专家。


    ### 二、财务人员基础能力框架


    所有期望成为 CFO 的财务人都很关心一个问题：应当积累哪些知识才能更加高效地实现成为 CFO 这个目标呢？实际上，很多人在年轻的时候是没想过或没想明白这个问题的。这样，在未来出现机遇的时候，往往会与之失之交臂，或者勉强上任，但无法达到预期的绩效目标。


    笔者将通过搭建一个智能时代 CFO 的基础能力框架来尝试回答这个问题，如图 3-1 所示。对自己未来充满希望的财务朋友们，可以看看自己在哪些方面还有提升的空间。这个框架考虑到了智能时代财务管理职能的需求，故称之为智能时代
    CFO 的基础能力框架。


    ![img](img/txt003_1.jpg)


    图 3-1　智能时代 CFO 基础能力框架


    #### （一）战略财务基础能力框架


    ##### 1. 战略与业务


    作为 CFO，需要有非常宽阔的知识面，但最重要并不是专业知识，而是对公司战略和业务的理解及把控。该能力决定了 CFO 是否能够真正成为一个经营团队的合格管理者，而不仅仅是一个财务工作者。


    核心技能：战略解读；财务与战略配合；公司资源及计划的管理参与；财务资源配置管理；与业务单元的沟通。


    ##### 2. 财会控制机制


    作为 CFO，需要在企业内部建立完善的财务、内部控制和内部审计体系，以确保会计风险的可控性。也有一些公司是由首席风险官负责这部分职能的。


    核心技能：财务及会计制度管理；内部控制；内部审计与稽核。


    ##### 3. 价值管理


    价值管理是 CFO 的高阶技能，需要从多方面主动管理以提升公司的价值，并最终在股价上有所体现，满足公司股东的投资回报诉求。


    核心技能：产权管理；营运资本管理；现金流量管理；经济附加值管理；新业务价值管理；并购价值管理。


    ##### 4. 经营分析与绩效管理


    经营分析与绩效管理是 CFO 在公司经营管理方面体现自身核心价值的重要内容，好的 CFO 是公司持续前进的一个重要推动器。通过 KPI 的设定，以及持续的考核跟踪、深度的经营与数字探究，能够给企业的发展注入强大的活力。


    核心技能：KPI 体系搭建；经营分析报告；绩效考核制度搭建及奖惩执行；投入产出管理；市场对标管理；重大关键项目管理。


    ##### 5. 全面预算管理


    全面预算管理是 CFO 在资源配置方面配合企业战略落地的重要工作。凡事预则立，不预则废，CFO 正是承担起这项职能的重要角色。当然，全面预算管理并不仅仅是财务的事情，但是作为
    CFO 去承担牵头职能还是必需的。


    核心技能：经营计划管理；预算编制管理；预算执行与控制管理；预算分析；预算组织管理；预算流程管理；预算系统管理。


    #### （二）专业财务基础能力框架


    ##### 1. 会计与报告管理


    作为 CFO，会计与报告是不可缺失的基本技能。当然，CFO 可以请会计专业人士和会计师事务所代劳，但无论如何是绕不开这项技能的，必须懂会计。


    核心技能：会计交易处理及相关流程；往来管理、关联交易管理等会计管理；会计报告及合并；会计信息系统，如核算系统、合并系统等；信息披露；审计流程及管理。


    ##### 2. 税务管理


    税务管理是 CFO 的传统工作领域，无论在世界上的哪个国家，CFO 都是绕不开税务工作的。而在中国，税务又有着自己的特点，CFO 需要将税务管理当成一项既严肃又充满艺术性的工作来对待。


    核心技能：税务政策研究；税务关系管理；税务检查配合与风险防范；税务数据管理；税务系统管理；营改增及电子发票/特定时期的特殊事项。


    ##### 3. 资金管理


    资金管理是 CFO 工作中的重要一环，也是对一个称职 CFO 的基本要求。从分类上说，资金管理是专业财务的一个构成领域，具有一定的技术性，如果没有从事过这个领域的工作，要覆盖这部分专业知识是有一定难度的。


    核心技能：资金收付管理；资金计划管理；债券融资管理；混合融资管理；股权融资管理；司库管理；外汇管理；银行关系管理；资金系统管理；流动性管理；投资管理。


    ##### 4. 合规管理


    合规管理对于很多监管行业非常重要，监管机构有金融行业的银保监会、人民银行等，上市公司的证监会等。作为 CFO，需要很好地把握监管政策，主动、积极应对，以避免因合规问题给公司带来损失。


    核心技能：监管政策研究；监管沟通及检查应对；监管信息报送；违规风险管理及违规后危机管理。


    ##### 5. 管理会计


    管理会计是当下各大 CFO 面对的既久远又新鲜的课题。国内正在掀起一波管理会计体系建设的热潮，CFO 不可免俗，必须要懂管理会计。


    核心技能：维度体系搭建；收入分成管理；成本分摊；多维度盈利分析；作业成本管理；资金转移定价（FTP）管理；风险成本和资本成本管理；管会数据应用（定价、精准营销等）；管理会计系统。


    ##### 6. 成本管理


    成本管理单独拿出来说，是因为它对于每个企业来说都是十分重要的一项内容。对于 CFO 来说，要开源节流，其中的节流就要靠成本管控。甚至对于一些企业来说，成本管理是其生存的核心战略和命脉。


    核心技能：成本战略体系设计；基于价值链的全成本管理；费用的前置管控；成本文化建设；最佳成本实践的形成和推广。


    ##### 7. 财务风险管理


    广义的风险管理领域是首席风险官的管理职责，但在财务领域，CFO 应该对财务相关风险予以高度关注，并实施有效的管理。CFO 力求创造价值，但必须牢记，风险是底线，控制好财务风险是一个好
    CFO 的必修课。


    核心技能：财务操作风险管理；财务风险意识及管理文化建设；RCSA 风险控制与自我评价工具的财务应用；KRI 关键风险指标体系的财务领域搭建；重大风险事件监控。


    #### （三）业务财务基础能力框架


    ##### 1. 产品财务管理


    产品财务是业务财务中向产品事业部提供财务专业服务的队伍，CFO 需要基于产品财务队伍，加强对以产品规划、产品研发为核心的产品全生命周期的财务管理。


    核心技能：产品规划及投资财务管理；产品研发财务管理；产品周转资金管理；产品质量成本管理；产品最佳财务实践管理。


    ##### 2. 营销财务管理


    营销财务是财务队伍中服务于营销或销售事业部的业务财务队伍。CFO 需要通过营销财务开展对营销、销售过程的财务管理，如合同商务管理、客户相关财务管理、销售费用管理等工作。


    核心技能：商务合同财务管理；营销及销售费用管理；客户信用及风险管理；竞争对手财务及经营信息管理。


    ##### 3. 供应链财务管理


    供应链财务主要为企业经营中供应链相关环节提供业务财务支持。CFO 需要借助供应链财务实现对采购、生产、配送等相关业务环节的财务管理。


    核心技能：采购财务管理；生产财务管理；库存控制管理；配送物流财务管理；分销财务管理。


    ##### 4. 项目财务管理


    除了以价值链划分的业务财务之外，CFO 还需要关注另一个业务财务维度，即项目维度。项目财务是从另一个视角与产品、销售、供应链财务进行矩阵式协同的业务财务职能。


    核心技能：①研发项目财务管理；②市场推动项目财务管理；③售前/销售项目财务管理；④工程项目财务管理；⑤实施交付项目财务管理；⑥管理支持项目财务管理。


    ##### 5. 海外财务管理


    对于开拓海外市场的企业来说，CFO 还需要高度关注海外财务管理工作，特别是在新进入一个国家时，海外财务的支持能力显得尤为重要。


    核心技能：国家财税政策管理；海外机构综合财务管理。


    ##### 6. 业财一体化管理


    CFO 需要始终保持对业务财务一体化的关注度和警惕性，通过加强业务财务一体化管理，实现有效的业务与财务核对管理，提升业务与财务的一致性水平。


    核心技能：业财一致的制度及流程管理；业财对账管理；业财一致性系统管理。


    #### （四）财务共享服务基础能力框架


    ##### 1. 财务共享服务中心设立管理


    财务共享服务在中国的发展已经超过了十个年头，如今大中型企业已普遍将财务共享服务中心作为标配。因此，作为 CFO，需要对财务共享服务的模式有所了解，从而有效地开展建设。


    核心技能：财务共享服务中心立项；财务共享服务中心战略规划；财务共享服务中心建设方案设计；财务共享服务中心实施；财务共享服务中心业务移管。


    ##### 2. 财务共享服务中心组织与人员管理


    财务共享服务中心是一种基于大规模生产的运营管理模式，这种模式对组织和人员管理都有较高的要求，CFO 应当关注财务共享服务中心的组织效率和人员的稳定性、成长性。


    核心技能：财务共享服务中心组织职责管理；财务共享服务中心岗位及架构；财务共享服务中心人员招聘；财务共享服务中心人员培训及发展；财务共享服务中心人员考核；财务共享服务中心人员保留。


    ##### 3. 财务共享服务中心流程管理


    流程管理是财务共享服务管理的精髓，CFO 应当关注财务共享服务中心端到端的流程体系建设及流程维护、持续优化，以提高流程效率，降低流程成本。


    核心技能：财务共享服务中心流程体系定义；财务共享服务中心标准化流程设计；财务共享服务中心标准化流程维护和执行监控；财务共享服务中心流程持续改进。


    ##### 4. 财务共享服务中心运营管理


    财务共享服务中心需要有效地运营以创造价值，CFO 需要对运营管理中的核心职能予以关注。


    核心技能：财务共享服务中心绩效管理；财务共享服务准入管理；财务共享 SLA（服务水平协议）及定价管理；财务共享人员管理；财务共享风险与质量管理；财务共享“服务”管理；财务共享信息系统管理。


    ##### 5. 财务服务外包及众包管理


    服务外包和众包是财务共享服务模式的延伸和补充，CFO 需要关注应如何进行外包、众包与共享服务之间的选择决策，同时对外包和众包的管理也需要有特定的模式。


    核心技能：服务模式战略管理；外包供应商选择管理；外包商交付管理；众包平台搭建；众包平台用户获取、服务及管理；外包及众包风险管理。


    #### （五）财务通用支持基础能力框架


    ##### 1. 财务组织、人员管理


    作为 CFO，建设财务组织、培养财务队伍是责无旁贷的。因此，人力资源管理理论在财务领域的应用也是 CFO 需要掌握的。一个管理不好组织、团队和人员的 CFO，必然是一个不称职的
    CFO。


    核心技能：财务的分层治理机制；财务组织架构及岗位设计；财务团队及干部管理；财务人员绩效管理；财务培训及知识管理。


    ##### 2. 财务信息化及智能化管理


    对于现代的 CFO 来说，财务信息化和智能化管理已经是不可或缺的技能。财务的大量工作都是建立在信息系统基础之上的，因此，对于 CFO 来说，懂一些信息系统知识是十分必要的。而在未来，财务的大量工作还会进一步被信息系统所取代。可以说，不懂信息系统相关知识的
    CFO 在未来根本无法生存。


    核心技能：财务信息化团队建设；财务产品设计及系统架构；财务与 IT 之间的沟通管理；财务大数据技术；财务自动化及智能化技术。


    ## 第三节　智能时代财务人员的择业模型


    智能时代的来临，对整个社会包括财务人员的影响是全面且深远的。在这样的环境下，财务人员的择业观被影响和改变着。面对未来，财务人员有三种选择—不变、远离或拥抱。选择本身没有对错之分，但我们在作出不同选择的时候，都需要给自己找到适应智能时代环境的新择业标准，这将从某种意义上改变我们的职业生涯。


    智能时代，世界在改变，财务也在改变。当智能时代来临的时候，财务人员不可避免地会受到巨大的冲击，也必须要面对认知的升级。无论是高级管理人员、财务经营分析人员、预算管理人员还是会计运营人员，都必须要面对这种改变。


    这也引发了不少财务人员对未来职业发展的担忧，关于人工智能是否会取代财务人员的讨论也成为热议的话题。在 2017 年 4 月底召开的全球移动互联网大会（GMIC
    ）2017 北京大会上，李开复与霍金展开了隔空对话。霍金认为：“对于人工智能的崛起，其好坏我们仍无法确定，现在人类只能竭尽所能，确保其未来发展对人类和环境有利，人类别无选择。”李开复则提出这样的问题：“我们要看到，人工智能要取代
    50％的人的工作，在未来 10～15 年间，这些人怎么办？还有更重要的，教育怎么办？”是的，在智能时代，有些问题已不是我们能决定是否面对，我们只能思考如何面对。


    今天，作为一名在职场中生存的财务人员，已经难以想象终生服务于一家企业。择业本就是一件不可回避的事情，而智能时代的择业将伴随着更加困难的抉择。


    ### 一、三种选择：智能时代财务人的“进”“退”“守”


    在智能时代，财务人员面对整个社会变革、新技术的挑战能作出的选择无外乎“进”“退”“守”三种模式。


    '
