    ### 二、智能核算：支撑业财高度融合的统一会计引擎


    #### （一）会计引擎的基本原理


    简单地理解，会计引擎可以看作是将业务系统语言转换为财务语言的翻译器。对于一个翻译器来说，如果要让它运转起来，首先要能够实现语言的输入，然后基于所输入的语言，通过一系列的语法分析及规则转换，将其形成新的语言再输出。当然，这里所讲的翻译是基于文本信息的，如果是基于语言的处理，那么最大的难点将转变为在输入环节如何让计算机能够听懂且理解人类的语言，并将这些语音信息转换为文字。


    我们可以参考类似的方式，用会计引擎来解决问题。首先，需要从各业务系统中获取业务系统数据的输入。在这个过程中，我们必须意识到，会计凭证是企业各类经济活动结果的反映。在这种情况下，能够支撑进行财务语言转换的前端业务系统的涉及面也必然是广泛的。当建立了业务系统与会计引擎之间的数据接口后，就形成了类似于翻译器的语言输入过程。接下来，要做的事情是语言的转换。对于会计引擎来说，需要建立一套类似于翻译器中词汇映射和语法映射的规则转换机制。也就是说，要建立业务数据向会计凭证转换的系统规则。


    当然，这里有一点和翻译器是不一样的。对于翻译器来说，不管输入什么，都需要被动地接收，并转换为另一种语言进行输出。而对于会计引擎来说，首先是基于会计凭证的数据构成规范来判定需要什么输入，对形成会计凭证无用的数据，根本就不会考虑作为输入。在这种情况下，业务系统根据会计凭证的数据需求提供数据输入，经过预先设定的业务语言向会计语言转换的规则处理后，形成“准凭证”。


    所谓的“准凭证”是会计引擎处理后所形成的预制凭证，由于还没有进入总账系统，故被称为“准凭证”。准凭证进入核算系统后，形成正式的会计凭证，最终完成语言输出的过程。


    #### （二）统一会计引擎


    统一会计引擎和传统会计引擎相比，核心就在于“统一”两个字。如上文中所说的，多数会计引擎都搭建在其他财务或业务系统中，以一个模块的形式存在；稍微好一些的，也就是在专业系统中圈下一块地盘，形成一个相对独立的子系统。而这里所说的统一会计引擎则是希望能够打破其寄生系统的束缚，从各个系统中独立出来，形成一个专业化的系统平台。通过这样的一个平台，形成一个多语言翻译器。也就是说，统一会计引擎的一端对接企业内所有业务系统和专业财务系统，以获得信息输入，另一端对接会计核算系统和管理会计系统，以生成会计凭证并实现财务分析。


    #### （三）智能化下的统一会计引擎


    尽管我们意识到统一会计引擎的建立难以一帆风顺，但同样看到它建立后所带来的价值。今天，随着智能化技术的进步，还有可能在建立统一会计引擎的过程中更进一步——借助智能化技术提升统一会计引擎的性能。


    如同翻译领域对智能化技术的应用，统一会计引擎可以考虑适当地应用机器学习技术来辅助完善翻译器的翻译规则，即会计引擎的凭证转换规则。在建立统一会计引擎时，通常将优先基于所积累的经验来设计规则，但面对多行业及全场景的复杂性，仅仅基于经验是不够的。机器学习技术通过对标签化业务信息的输入和学习训练后，能够更高效地提炼转换规则，提升会计引擎在面对新问题时的处理能力。另外，利用区块链技术。如果能够在业务系统、专业财务系统、核算系统之间搭建分布式底账，那么将为提升会计引擎转换结果的可追溯性带来极大的帮助。


    我国尚处于统一会计引擎建立的探索和尝试阶段，但其在大型多元化集团的落地应用并不遥远，未来出现面向社会提供服务的低成本甚至免费的、开放式的统一会计引擎平台也并不是空想，而智能化技术在开发统一会计引擎平台上也能够发挥更大的价值。


    ## 第四节　智能时代财务共享服务创新


    ### 一、智能时代财务共享服务框架详解及智能增强


    财务共享服务模式在中国是在 2005 年左右兴起的，尽管这个时候西方国家对财务共享服务的应用已经日趋成熟，但作为后来者，我国的财务共享服务发展呈现出逐渐加速的趋势。在最近五年中，财务共享服务的热度飞速上升，已然成为国内大中型企业财务组织的标配。


    在这个过程中，财务共享服务中心从设立到运营全过程的管理水平都在快速提升，到今天已经形成了相对完善的财务共享服务管理框架，并在政府、企业、高校和各类协会组织的共同推动下，逐渐成为国内财务共享服务中心特有的管理模式。


    #### （一）财务共享服务中心设立管理


