- raw: "\n\n\uFEFF ![img](images/cov001_1.jpg)\n\n\uFEFF\n\n智能时代财务管理转型研究\n\n刘　赛　刘小海◎著\n\
    \n吉林人民出版社\n\n\uFEFF\n\n# 前　言\n\n随着我国经济的高速发展和科学技术的革新进步，各行各业的发展越来越离不开信息化和网络化的支持。与此同时，我国的社会主义市场经济体制逐步完善，经济改革发展进入深水区，财会工作的速度与效率对经济发展的作用日益凸显。因此，财会人工智能时代呼之欲出，人工智能可以将会计模型和方法程序化，所以大大简化了会计工作的运算过程，提高了会计工作效率，促进了社会经济的飞速发展。\n\
    \n随着人工智能的发展及会计个人职业生涯管理体系发展的迫切需要，西方金融界和会计界对人工智能技术和财务管理方面进行了透彻而深入的研究，以期将会计和财务管理智能化，最终成功开发出有效的智能处理系统，这些智能化的专家系统能够处理复杂的财务分析和决策问题。人工智能能够在基础财会工作中基本替代传统财会工作人员，能够让财务人员从机械性、重复性强，技术含量较低的基础工作中解放出来，有更加充沛的时间来学习专业知识，同时将成本管理会计的理论与实践结合起来。财务人员需要全方位掌握财会人工智能的工作内容及涉及的范围，持续拓宽专业知识的宽度，在实践中同财会人工智能进行良好的合作，实现人机完美互补，从而为企业创造更多价值。只要会计人员满足经济发展和快速变化工作思路的要求，就能积极地迎合互联网发展的需要，改进和提高自己，持续充实会计知识，持续改革，拓宽知识面，努力使自己成为管理型、跨学科人才。\n\
    \n本书以当今财会人工智能化为时代背景，对人工智能时代财务管理的转型进行了深入探讨。首先概述了财务智能化的大背景，对人工智能的定义和发展、智能时代财务转型的必要性和可行性、智能时代的财务管理新逻辑和财务新商业经济的转变进行了阐释。其次对智能时代财务信息化进行了整体规划，并且分别针对智能时代下的财会人员、财务教育、财务组织和模式这三个方面进行了详细分析。最后总结了智能时代的财务创新与实践。本书对财会人工智能带来的挑战及相应对策进行探究，对智能时代的财务转型研究发挥了积极作用。\n\
    \n目前，财务人工智能在我国仍处于初始的发展阶段，对其进行的理论与实践研究仍然有待深入。作者在汲取了其他专家学者研究成果的基础上，根据自己多年的财务实践，最终著成本书。由于出版时间紧张，加之人工智能的发展十分迅速，本书难免存在不足之处，恳请广大读者批评指正。\n\
