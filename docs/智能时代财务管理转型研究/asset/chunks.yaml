    # 第三章　智能时代财会人员转型


    ## 第一节　智能时代财务人员面临的问题


    人工智能的发展离不开技术的进步，历史上每一次技术进步，都会引发相关行业的大规模失业。19世纪前叶，随着机械织布机在英国的广泛使用，众多有技术的纺织业者一夜之间沦落街头，加入失业大军。1900年，随着拖拉机、联合收割机和作物种植机的出现和使用，近一半在田地间劳作的成年人一下子变得无所事事。1945年，自动化技术的进步使超过1.5万名曼哈顿电梯操作工人和维修工人成为无业者。在人工智能技术的冲击下，财会人员的劳动力市场将会发生颠覆性变革。人工智能技术掀起了世界范围内的又一轮产业变革[\[1\]](#txt003.xhtml#footnote_content_txt003_1)。人工智能背景下，财会人员的工作方式和核算方式都会发生很大的变化，财会人员面临的问题包含以下内容。


    ### 一、财务基础岗位急剧减少，高级岗位人才短缺


    第一，大量的财务基础核算工作被财务人工智能机器人替代，但是市场中财务岗位数量变化不大，因此会给财会人员带来严重的冲击，从事基础核算的财会人员面临被人工智能机器人取代的风险。在人工智能技术到来和逐渐普及之际，企业内部从事基础性会计核算、凭证整理、账簿装订、报表处理及纳税申报、纳税调整的会计人员将会逐步被人工智能机器人取代[\[2\]](#txt003.xhtml#footnote_content_txt003_2)。这部分人的就业前景将会逐步低迷，财会人员的收入和社会地位也会或多或少受到影响。这种现象最具代表性的当属全球零售业的霸主—沃尔玛，2016
    年随着财务机器人的投入使用，沃尔玛裁减财会人员 7000 余人，裁员之后基础核算财会人员减少 80％，财会人员的工作岗位数量迅速减少。[\[3\]](#txt003.xhtml#footnote_content_txt003_3)


    第二，企业内设会计机构和财务会计岗位逐步被合并和裁减。在人工智能背景下，随着大量基础性工作被机器人所取代，企业的财务会计岗位也将进一步得到精简，一些工作内容较为相近的岗位会逐步合并，一些工作内容和工作量都大幅减少的会计岗位将会与其他必须继续存续的会计岗位进行合并设立，合并以后企业所设立的会计机构和岗位都会有所减少。对于总分公司而言，分公司可以不再单设财务部门，或者对财务会计岗位进行精简，总账会计、费用会计、资金会计、成本会计、收入会计、供应链会计等会计岗位都会被适当裁减，只保留个别基础工作岗位和管理会计岗位、财务总监岗位、会计机构负责人岗位。对于母子公司而言，保留财务部门，但是内设岗位可以根据业务需求大幅缩减，对于不相容和职位分离的岗位统一由人工加智能的方式合理设置会计岗位，高速开展会计核算业务。这一方面使市场上的会计岗位总数逐步减少，另一方面使企业集团内部自设的会计岗位逐步减少。基础会计岗位数量减少将会在未来
    2～10 年内最为明显[\[4\]](#txt003.xhtml#footnote_content_txt003_4)。未来，连锁经营机构各分店的记账和会计部门统一整合至总公司的会计智能系统，数据智能化与集中化处理逐渐取代人工。


    第三，高水平专业财务管理人才紧缺。人工智能背景下，基础核算财会人员面临着被淘汰的危机，这些岗位和相应的工作交由机器人来完成将会更加规范和高效，同时完成的工作量也会更大。这使财会人员的日常工作量减少，工作压力得到缓解，财会人员可以有更多的时间和精力从事与战略管理和管理会计相关工作，为企业快速发展贡献智慧和力量。这就需要更多高水平的掌握更多专业化财务管理知识的会计人员，在企业单位从事高级财务管理工作[\[5\]](#txt003.xhtml#footnote_content_txt003_5)。当更多的基础性财务会计工作、审计工作被人工智能财务机器人取代后，企业对高水平的财务管理人员需求将更加迫切，尤其是能够掌握新的财务管理理念、财务管理技能的高精尖人才。


    第四，具有国际知识和视野的财会人员缺口较大。当前我国一些大中型企业、科技型中小企业、文化创新企业开始走出国门，与全球大多数国家和地区有业务往来，这就需要这些企业外派的财会人员和企业财务总监、会计主管，聘请的财务顾问等工作人员具有开阔的国际视野，了解和掌握派驻机构和海外分公司所在地的政治、经济、科技政策、法律法规、税收政策、会计准则、会计利润核算方式等知识，对海外机构和海外分公司的利润分配、投资收益划转等政策能够知晓和统筹规划，避免因不了解当地法律法规和政府部门出台的政策规定而受到经济处罚，给企业发展带来损失或错过发展良机。


    ### 二、企业对财会人员工作胜任能力的要求越来越高


    第一，当前财会人员的人际沟通能力难以满足人工智能时代财务管理需求。财会人员在常人眼里中规中矩，呆板不灵活，坐在办公室简单地记账算账，不与外界接触，不需要或很少与人打交道。部分财会人员由于过度关注财务数据，忽视了与人沟通的重要性。工作过程中不重视人际关系培养，不能积极地与人进行沟通交流，发挥工作主动性和积极性。在人工智能背景下，基础财务工作都由智能机器人替代完成，企业财会人员需要处理的事务往往是综合协调性的、系统维护性的、设置参数、风险点、防控措施录入性的其他工作，这些工作往往都需要其他部门的协作配合，这就需要财会人员具备良好的协调沟通能力。但是当前中小企业的财会人员还不具备这种沟通能力，因此制约了人工智能背景下财会人员的职业再规划与发展。


    第二，当前财会人员的专业技能难以满足人工智能时代财务管理需求。我国财会人员的从业人员数量过多，从业人员文化水平不一，对财务管理专业知识的掌握程度不尽相同，个人综合素质也参差不齐。有的财会人员具有注册会计师、注册税务师或国际公认的注册会计师资格，有的财会人员拥有中高级职称，有的财会人员仅仅只有会计从业资格证，甚至一些企业的财会人员从事会计工作多年但是至今还未取得会计从业资格证。一些财会人员接受了系统的本科、硕士会计学、财务管理相关知识教育，一些财会人员接受了大专、成人本科财会专业教育，一些财会人员系统地自学了财务会计相关知识和课程，也参加了很多培训机构的专业化辅导培训，这些从业人员往往能够很好地完成自己的本职工作。但是，还有一部分财会人员没有接受过专业的系统教育和培训，了解和掌握的财会知识零星琐碎，对财务管理、管理会计的相关内容一知半解。人工智能时代，基础会计工作不再需要一般会计人员来完成，这就需要会计人员掌握系统的财务会计知识，对会计核算、凭证、账簿、报表之间的逻辑关系，会计处理的特殊情况、财务风险的识别与防范、会计不相容岗位的设置及权力制衡都有一个正确而精准的认识，但国内大多数中小企业，尤其是一些小微企业的财会人员的专业技能显然难以满足人工智能时代财务管理需求。财会人员的财务专业技能水平低，主动学习意识淡薄。据调查统计，每日利用业余时间参加培训及学习的财会人员中，学习
    1 小时以内及不学习的财会人员占比高达74.03％，学习 1 小时以上的财会人员占比仅 25.97％，财会人员对职业转型过程中的再培训及学习不够重视，主动学习意识淡薄。这些都与人工智能时代财会人员的工作要求和个人职业发展规划不适应。


    第三，当前财会人员所掌握的知识面较窄，难以满足人工智能时代财务管理需求。人工智能时代，财会人员不单单是处理会计业务、维护系统、指导智能机器人按照预定的流程和规范开展工作，更重要的是协调沟通其他部门积极配合智能机器人完成相关工作，并为其提供必要的财务数据等基础数据。财会人员在人工智能时代，需要综合考虑单位的基本情况、发展战略及对外投资、生产运营等一系列规划，全面管控和及时调整企业的资金使用及成本费用控制情况，进行财务风险识别、有效预防并采取有效的应对策略。要做到轻松自如地应对人工智能时代的财务工作，就需要财会人员掌握一定的企业管理、市场营销、对外投资、战略规划、品牌建设等相关知识，提高自身的综合业务素质，拓宽自身的知识面，在专业知识的广度和深度方面下功夫，以精准多元化的专业技能满足人工智能时代财务管理需求。反观当前的财会人员现状，不难看出国内有些中小企业、小微企业，以及一些民营企业的中高层财会人员，有些人都不了解企业管理的基本知识，对企业发展规划一无所知，不精通企业的对外业务开展方式，在实际工作中仅仅能够做到会计核算准确无误，对未来
    3～5年内的资金需求不甚了解，缺少企业整体发展的全局观念，不能站在全局的角度，客观公正地看待所有的经营问题。


    第四，当前财会人员独立分析能力和风险管控意识，难以满足人工智能时代财务管理需求。在人工智能时代，财会人员需要掌握相关的业务知识，也需要具备一定的独立分析能力。伴随着财务岗位和财会人员的一再精简，需要几个人共同完成的基础性工作全部交给财务机器人，填制报表、调整会计利润并申报缴税等工作依靠财务机器人同样也可以完成。财会人员需要做的就是分析问题、查找原因，进行纠偏和优化流程，调整核算方法，统计和对比分析财务数据变化情况，并及时建议企业管理部门对企业生产运营作出战略调整，以求取得更好的发展业绩。而所有这些都离不开财会人员独立分析、解决问题的能力，也离不开财会人员的风险管控意识、风险识别和防控能力。当前，有些财会人员缺少独立分析能力和风险管控意识，只对数据进行整理统计，不了解数据背后的信息，不能通过独立分析将数据转化为对企业有用的经营决策。在人工智能时代，信息安全性备受关注，有些财会人员缺少以审计的视角透视企业风险的能力，风险管控的意识淡薄。这些都与人工智能时代的财务管理现实需要相违背，也与人工智能时代的财会人员职业规划与职业发展相悖。


    ### 三、企业对财会人员需求类型发生变化


    第一，需要财会人员具备投融资相关经验。企业在迅速发展过程中需要财会人员具备一定的投融资经验，帮助企业进行理财规划和投融资管理，以实现企业资产的保值和升值。大部分财会人员对证券金融、内部控制、经济热点等不够重视，投融资经验少。因此，具有投融资相关经验的财务人才紧缺。


    第二，需要财会人员具备创业思维。在一定程度上，财会工作和管理工作是具有一定的相似性和互通性的。一般来说，能够胜任财会工作的人会具备一定的管理能力。财会工作在企业中是不可或缺的，很多现代企业家都注重在财会方面的知识积累。但大部分财会人员过多关注数据，思维模式固定，缺少创业思维。

    '
  trans: '


    第六，关注市场动态和竞争对手，随时进行产品规划的调整。


    如果能够做到以上这些，就是一个符合当今时代要求的合格的产品经理。


    ### （二）产品经理和工程师的差别在哪里


    产品经理和工程师是两个容易混淆的概念，理解二者的差别有助于我们更好地认识产品经理的角色和定位。


    产品经理的定位是从架构、功能和逻辑层面去设计一个系统，并关注这个系统能够为用户解决怎样的问题，高度关注用户的体验，力求作出让用户用起来舒服、能解决问题的好产品。而对工程师虽然也有类似的要求，但更侧重于技术研发，而较少关注这些技术可能带来怎样的应用场景。这两种定位在企业内的不同甚至可以影响组织的文化。


    对于产品团队来说，产品经理和工程师都是这个团队的构成部分，团队中还会包括设计人员、测试人员、营销人员、项目经理等角色。产品经理往往在大的产品团队中还承担着角色补位的身份，在正常情况下，产品经理和这些角色各司其职，形成良好的协作关系，而在某些角色出现缺失的时候，产品经理是这个团队中最合适的补位者，这也是为什么我们说产品经理的工作应当覆盖产品全生命周期的原因。


    ### （三）财务产品经理的定位


    当理解了产品经理这个概念后，我们再来看一看财务产品经理应该有怎样的定位。


    首先，财务产品经理应当是财务组织中的一分子，其核心职能是设计财务信息系统来解决在财务工作各类业务场景中所遇到的问题。因此，将财务产品经理设置于财务团队内部能够更好地发现用户的问题，并设计出更有针对性的产品解决方案。


    其次，财务产品经理应当将主要精力放在搞明白需求、设计出用户体验卓越的好产品上。同时，充分利用工程师们的“黑技术”，把好的技术应用到财务场景中。财务产品经理既不应当取代工程师的角色，又不应当任由工程师团队替代。


    最后，我们也要意识到，财务业务人员并不适合在没有经过充分训练的情况下直接成为财务产品经理。财务产品经理是一种复合型人才，必须将财务知识与技术能力有机融合。如果由纯粹的业务人员来设计产品会缺少全局观，难以把握架构和流程，并在与工程师的对接过程中出现理解的偏差。


    ### 二、智能财务产品经理的特质


    财务产品经理的出现能够全面提升财务的信息化应用能力，帮助财务部门应用技术手段来解决问题。那么，在智能时代，财务产品经理还需要经过怎样的迭代进化来实现进一步的提升，并应当具备怎样的特质呢？


    #### （一）新技术的敏感性


    作为应用技术来解决财务问题的财务产品经理，对技术的敏感性是不可或缺的。特别是在智能时代，技术快速迭代，对这种能力的要求更为突出。实际上，在传统的财务信息化时代，在相当长的一段时间内，技术的发展还是相对平稳的，从计算机技术的出现到互联网、移动互联网，大约二十年的时间，我们可以以比较平缓的节奏来面对技术变化对财务的影响。至少在今天，有不少企业才刚刚开始落地实践十年前的财务技术手段。


    但在过去的两三年和未来的五年中，我们处于信息化时代向智能时代转变的边缘期，在此期间，技术的多变和创新的层出不穷成为常态。如果还是以先前的节奏来面对，则很可能错失大量提升财务效能的机会。在不可多得的时代跨越期，每一个财务产品经理都应当具备高度的技术敏感性，把握时代赋予的机会。


    #### （二）新技术的财务场景化能力


    对于财务产品经理来说，一旦敏锐地捕捉到新技术的出现，最重要的事情就是能否将这些新技术用于解决实际问题，也就是这里要说到的新技术的财务场景化能力。实际上，业务问题出现的载体是业务场景，空谈一项技术是没有任何意义的。但作为财务产品经理，如果能够识别出业务部门的痛点，抽象出业务场景，分析出什么样的技术能够解决怎样的场景问题，那么他就是一个高水平的财务产品经理。


    对于如何形成这样的能力，财务产品经理不妨借鉴笔者在前面章节中所谈到的创新方法。其中，关联创新很适合让我们在财务和技术结合的边缘迸发出新的想法。


    #### （三）产品化和平台化架构能力


    在传统的财务信息化模式下，由于技术变化相对缓慢，高度定制化的信息系统也能够满足不少的用户需求，并且保持稳定性。但随着智能时代的到来，技术的加速革新，缺乏扩展性的定制系统将难以满足业务需求，产品化和平台化成为发展趋势。


    对于财务产品经理来说，产品化和平台化架构能力的形成并不是那么容易的。在传统模式下，只需要就问题解决问题，用西医的方法就足够了；而在产品化和平台化架构下，需要用中医思维来解决问题，能够站在一定的高度上对财务信息化产品中各个功能组件和关联关系进行具有前瞻性的规划，并能够在技术实现时充分考虑其可配置性和扩展性。这种能力的形成无论在专业上还是在思维能力上，都对现有的财务产品经理提出了更高的要求。


    #### （四）产品价值挖掘能力


    在智能时代，好的产品经理不仅要技术过硬，还需要会讲故事。对于所负责的产品，能够充分挖掘产品的价值，并与产品的相关方达成共识；能够更好地获得资源保障，获取用户的信任并形成更可靠的需求关系；更好地获得管理层的支持，保障产品设计最终落地。


    在通常情况下，智能时代的财务产品经理应当能够讲清楚产品实现在成本、效率、风险或管控、决策支持、客户体验等方面的价值。通过一系列的价值共识，把产品推入高速发展的轨道。


    ### 三、如何从财务 IT 成长为智能产品经理


    传统的财务信息化团队成员如何才能成长为未来的智能财务产品经理呢？传统的财务信息化团队成员在向智能财务产品经理迈进时已经具备了一定的基础，但是仍要在专业深度、广度和认知创新三个维度上进一步提升，方能够成长为一个合格的智能财务产品经理。


    #### （一）专业深度的成长


    专业深度尤为重要。在智能时代，如果要成为合格的产品经理，就需要进一步加强技术知识的储备。当然，这种加强并不是要求达到工程师的水平，而是要在现有的运维、需求分析能力的基础上，补充新技术领域的相关知识。正如笔者在前面章节中一再强调的，智能产品经理需要对大数据、云计算、机器学习、区块链、物联网等新的技术概念有所认识，能够理解这些概念的本质逻辑，知道工程师会如何应用这些技术，在应用这些技术时需要有哪些准备或基础能力。这将帮助智能产品经理更好地把控产品方向，更合理地向工程师提出产品要求。


    同时，专业深度还体现在对产品化、平台化架构方面的知识体系的完善上。当然，相关的具体工作将由科技部门的架构师团队来完成，但作为产品经理，需要有能力判断和评价架构师的设计，并有能力参与相关架构设计工作。


    在专业深度方面，还需要关注 IT 治理的相关内容，这对于管理产品从规划到实现，以及后续的稳定运营有很好的帮助。在 IT 治理方面需要关注的内容包括 IT 规划管理、IT
    获取与实现管理、IT 服务管理、IT 治理管理、IT 风险管理、信息安全管理、IT 绩效评价，以及灾难恢复和业务持续性管理等内容。


    #### （二）专业广度的成长


    对于财务产品经理来说，要打造出智能时代的财务好产品，就必须能够更加深入地承担起业务场景与信息技术相结合的中间角色。这个中间角色在业务层面要求财务产品经理具有更加广阔的专业视野。


    财务产品经理应对财务的各业务领域，如核算、预算、资金、管会、经营分析、税务、共享等，有广泛的了解。具备了这些财务专业范围内的广博知识，能够帮助产品经理实现第一个层次—财务各职能团队与科技之间的对接。


    然而，财务产品经理不能仅仅满足于这个层次的专业广度，还需要进一步拓展视野，了解各中前台业务，知识面覆盖公司经营的各类业务，并能够掌握业务与财务端到端的全流程数据流转和系统架构。在这种情况下，才能更好地通过信息技术实现业务与财务的一体化。


    构建多层次、立体、具备专业广度的知识体系，对财务产品经理从初级向高级成长至关重要。


    #### （三）认知创新的成长


    财务产品经理的养成之路还需要认知创新能力的提升。对于产品经理来说，需要更多地去研究和学习创新的工具和方法。创新本身是一门科学，而并非守株待兔式的等待创意。对于财务产品经理来说，如果想培养自身的创新能力，就需要积累大量的跨领域知识，而不仅仅是财务和科技类的知识。很多时候，创新的灵感来自貌似不相干的领域的突发刺激，当积累了足够广度的素材后，各种所谓的创新工具和方法才有可能发挥作用。


    当然，实践是创新的根源，作为智能时代的财务产品经理，需要积极地将想法付诸行动。如果暂时无法将其付诸实践，那么即使是推演也能帮助他们加深思考，并在深度思考的过程中获得认知和创新能力的提升。


    财务产品经理的形成是一个迭代进化的过程，当明确了智能财务产品经理是什么、需要怎样的能力和如何培养后，剩下的就是财务产品经理在工作中不断地积跬步，以至千里。


