- raw: '对物体表征的各种各样的消息进行归纳和汇总分析，然后对事物或特定现象进行叙述、分辨、归类和阐述的行为就是模式识别。当今社会，模式识别的方法有很多，其中最主要的方法是结构法和决策论方法[\[5\]](#txt001.xhtml#footnote_content_txt001_5)。最近几年，又出现了一些新的方法。例如，在多元化大数据基础上的多元图形基元、特征基元的模式识别和粗糙集模式识别法等。另外，它在财务领域也有大量的实际运用，如能高效地分辨并描述出财务目标和大环境，并能识别公司财务管理受到金融危机时的原因和影响，从而根据分析提出解决方案；在公司的经营框架中，能够识别公司财务经营框架及框架所掌控的运行机制；在运营管理上，它的工作重点是识别财务的主体行为及它对财务管理目标的作用；在现金的保管规划层面，能识别资金的筹划支付及流动性；在企业财务的风险规避和安全层面，模式识别可以感受到潜在的财务危机和隐患，设立一个有预防作用的模型，从而达到保护财产安全的目的。


    3.智能财务管理信息共享系统


    为了达到快速有效处理财务的目的，我们将智能财务信息管理系统分为财务操作系统和财务查询系统。这样的系统使各部门可以通过浏览Web网站方便快捷地查询相关财务信息，即使是远离公司，也可以通过网站及时查询实时财务信息，而且发布财务信息的企业成本很低。财务管理智能系统的出现，意味着财务管理变得高效方便，其与网络技术完美结合，各部门在任何地方、任何时候都可以一目了然地在共享系统中了解财务状况。而以上方便快捷的系统生成是通过将企业ERP财务信息植入系统来实现的。


    4.人工神经网络模型


    通过大量的处理单元对人脑神经系统的模仿，仿照系统的工作结构和原理，再通过各个链接方式组成网络就是人工神经网络模型。运用学习案例更新信息储备库、推理机制等，以达到帮助人类增加对外部世界的认识及智能管理的目标。它主要运用在优化、预测、归类和函数逼近等方面，主要运用范围包括对上市企业进行财务风险预测和预警、财务问题分析诊断、规划财务管理、缴税和评估、财务质量的检测评估、对风险投资的项目进行分析评估、股票价格指数的监测和分析评估、固有财产投资规划和分析预测、金融证券定价、选择经济发展方式，等等。当前，人工智能技术已经是人工智能研究领域的重点、亮点和关注点，它在经济与财务管理方面的辉煌成就已经引起了人们的特别关注。


    （二）财务智能化的架构特点


    与传统财务信息化功能架构有所不同，财务智能化是建立在一系列智能技术基础之上的。在具体的信息化架构搭建时需要考虑以下要点。


    1.构建数据基础


    对于大数据和人工智能来说，数据是这些智能技术能够有效运转的基础。因此，在信息化架构中，必须要考虑搭建一个可靠的数据层。这个数据层和传统信息化技术中所理解的后台的数据是不一样的。如图1-1所示，在这个数据层的搭建中，要兼顾结构化数据和非结构化数据。


    ![img](images/txt001_1.jpg)


    图1-1　智能化阶段的数据基础


    首先，对于结构化数据来说，需要对系统中所有具有业务含义的数据进行标签化，也就是说，要建立一个标签字典，用来结构化地重新定义系统中的每一个具有业务含义的字段，并在每一笔交易发生时，将交易中所包含的所有标签及标签值存储到数据层中。


    其次，对于非结构化数据来说，要能够采用大数据技术对非结构化数据进行管理和存储，并基于应用场景尽可能地获取更为广泛的非结构化数据。


    在建立了基于标签的结构化数据及非结构化数据的数据基础之后，无论是后续基于规则引擎的自动化处理，还是基于机器学习引擎的智能建设，都具备了基础条件。这对于财务信息化来说，是一个重要的改变。


    2.构建智能技术引擎


    在有了数据基础之后，财务信息化平台向智能化的转型还需要一系列的技术引擎的支持，如图1-2所示。


    ![img](images/txt001_2.jpg)


    图1-2　智能技术引擎


    第一是图像文字识别引擎。财务的大量数据还是以实物形态存在的，如发票、合同等。虽然这些原始凭证正在向电子化迈进，但在现阶段，实物仍然是其主要形态，而这些实物中蕴含了大量财务信息，并且是后续智能应用的关键基础。要提取这些信息，除了通过人工录入或者采取众包模式外，还可以运用图像文字识别（OCR）技术。基于OCR技术，能够批量高效地对图像中财务信息进行提取。需要注意的是，传统的OCR技术并不是非常成熟，识别率较低，基于深度学习的OCR引擎会有所改进。


    第二是规则引擎。规则引擎能够以标签为基本元素，通过特定的语法对控制规则进行表达和封装，形成一个个规则包。这些规则包从业务角度来看，能够帮助我们替代一部分人工进行系统的自动化审核控制，规则引擎本身技术并不复杂，难点在于进行清晰的标签定义和管理，梳理和拆解规则，以及基于标签定义规则。对于最简单的差旅费报销来说，其涉及的标签可能多达数百个，并且也需要数十个的规则来进行组合审核。


    第三是流程引擎。流程引擎虽然在传统的财务信息化架构中已经广泛应用，但在智能化要求下，流程引擎需要具有更强的灵活性和扩展性，以支撑在智能应用中更为复杂的后台任务路径分流。流程引擎技术本身需要引入机器学习技术，以逐渐实现流程的智能化流转管理，如在共享派工时，实现更为灵活和均衡的智能派工。


    第四是机器学习引擎。机器学习引擎是人工智能技术的关键组件，能够将一系列算法进行封装，并形成标准化的输入和输出。机器学习引擎能够通过对带有特征和标签的大量历史数据的学习去自主发现规则或算法，并将这些规则或算法应用于财务的工作场景中，实现对人工的辅助或替代。机器学习引擎是财务信息化从自动化向智能化迈进的关键一步。


    第五是分布式账簿引擎。分布式账簿引擎可以理解为实现区块链在财务领域应用的重要基础。分布式账簿引擎通过在业务系统与财务系统底层搭建统一底账的方式，实现每一笔交易发生时的平行记账，并基于区块链的原理实现去中心化和数据一致。分布式账簿引擎能够为内部往来核对、关联交易核对、业财一致性核对等复杂业务问题提供技术支持。


    在完善的数据基础的支持及多个技术引擎的共同作用下，财务信息化架构能够实现从传统的自动化向智能化的进化。


    （三）财务人工智能的缺点


    财务机器人虽然可以替代财会人员完成大部分基础核算工作，但在实际工作中仍存在一些不能替代财会人员完成的工作。


    1.成本费用高


    目前，财务机器人对工作内容的标准化要求很高，不适合多种少量的工作模式。因此，财务机器人只适用于企业规模大、财税日常工作负荷重、快速成长期的企业。而对于普通企业来说，财务机器人的成本费用太高，后期维护费用过大，从成本效益的原则考虑，很多企业目前还不具备引进财务机器人的能力。


    2.技术发展不完善


    第一，财务机器人属于发展初级阶段，功能不完善，兼容性差，使用前期问题比较多。目前，财务机器人虽然在一些企业中已经应用，但从应用情况上来看，仍处于初级阶段，应用范围较小，应用层次不高，功能不够完善。因为初级阶段开发人员未全面考虑系列化、通用化、模块化的设计，容易造成系统兼容性差，所以使用初期问题较多。


    第二，操控财务机器人的技术人员不足，售后服务问题较多。财务机器人是新兴产品，精通操控财务机器人的技术人员十分紧缺。技术人员不仅要具有一定的会计理论知识，还需要了解人工智能和互联网相关的技术知识，具有综合技能的人才的匮乏给财务机器人后期的维护升级造成了一定的影响。


    第三，会计信息的安全性受到威胁。目前的会计信息处理与保存都以电子形式为主，而财务人工智能系统由于存在一定的技术漏洞，如果防护措施不到位，则有可能会被黑客攻破系统，盗取商业信息。对于企业来说，财务信息的外泄会造成非常严重的后果，使企业遭受巨大的经济损失。


    3.人性化水平低


    第一，财务机器人很难实现情感化。虽然财务机器人的计算速度和数据处理能力要比人类强，但是始终无法与具备人类的情感丰富度相比较。与人类相比，目前财务机器人在直觉判断方面不具备优势，而且无法处理复杂的逻辑判断问题，它很难完全模拟财会人员。财务机器人是按照事先设定的规则执行程序，它既没有感情，也不能完全像人一样进行思考。尤其是在涉及人际关系的处理时，财会人员能够根据人类的表情、语气等进行判断处理，而财务机器人则不具备这种处理能力。


    第二，财务机器人的及时反应和灵活程度不够。在普通的数据核算型工作中，财务机器人可以代替财会人员，但在处理涉及多种因素的宏观经济环境变化的问题时，财务机器人无法取代财会人员。财会人员在处理一个经济类工作时，能够根据自己所掌握的知识和经验，结合企业当前的内部环境状况和外部市场经济状况来作出决策。其中涉及会计规则、法律知识及情感经验等，而且会计规则及内外部的形势是随时变化着的，财会人员能够根据其变化作出相应的改变，而财务机器人则难以得出最佳的财务结论。无论财务人工智能如何发展，在处理涉及组织与组织、人与人、企业与社会的关系等问题时，它都不可能完全取代财会人员发挥作用。


    （四）财务人工智能对财会人员工作的影响


    2017 年英国牛津大学发布的一篇研究调查称，目前被人工智能机器人代替的可能性最大的工作岗位就是财务工作。哈格教授和卡明斯教授在《信息时代的管理信息系统》中阐述了专家系统，专家系统是通过模拟人类专家解决各个领域问题的人工智能技术，适合应用在会计工作中，同时他也指出这种系统的应用将会极大地威胁财会人员的工作，财会人员将面临失业。财务人工智能技术的应用和发展对财会人员工作的影响包含以下两个方面。


    第一，财务人工智能的发展给财会人员的工作带来巨大的挑战。基础核算财务岗位急剧减少，企业对财会人员的综合管理能力的要求不断提高，对财会人员的需求类型发生一定的变化。


    第二，财务人工智能的发展加速了财会人员的职业转型发展。财务人工智能虽然在很多方面可以代替财会人员进行工作，也可以完成传统的财务核算工作，但是财务人工智能与财会人员相比，并不能适用于会计行业中的每个领域[\[6\]](#txt001.xhtml#footnote_content_txt001_6)。在人工智能背景下，财会人员需要不断提高战略分析与判断能力，提高自己的综合素质，打造自身软实力，加强对自身职业生涯的设计与管理。


    ## 第二节　智能时代促使财务转型的新技术


    ### 一、智能化全面驱动财务转型


    （一）智能化带来的财务管理模式转型


    以大数据、云技术、物联网、区块链、人工智能等为代表的智能化技术的出现，不仅从技术能力上全面提升了对财务工作的支持能力，还从思维模式上对企业财务管理的转型提出了更高的要求。


    1.集团管控向全局视角的转变


    在传统的财务管理模式下，集团财务管控长期以来一直是企业所面临的难题和挑战。对于企业集团来说，存在横向、纵向的信息壁垒，存在横纵信息割裂，如图1-3所示。


    ![img](images/txt001_3.jpg)


    图1-3　企业集团存在横纵信息割裂


    从横向来看，集团内的各业务板块及板块下的各专业公司之间存在壁垒。从集团的视角来看，业务板块及专业公司之间的信息以烟囱状的形态存在。不同专业公司之间的信息可比性存在问题，各公司之间的协同财务效果难以进行清晰的评价，专业公司之间财务结果的可比性也会存在问题。


    从纵向来看，集团和专业公司、专业公司总部与下级机构之间每一个层次也都存在信息壁垒，集团难以穿透到专业公司内部看清其经营情况，而专业公司总部也不排除和下级机构存在信息不对称和不透明的情况。


    造成这种信息割裂状况，一方面是因为管理机制，另一方面是因为在技术层面，采用传统的信息化架构模式，数据在集团层面的高度集中是困难的，多数情况下，数据在不同的管理主体中分散存储，进一步造成了数据透明的困难。


    而在技术智能化后，基于大数据、云计算等能力的支持，从技术角度来说，有条件实现数据更广范围的集中化管理，通过建立集中化的数据中心，打破集团内横向和纵向的信息壁垒。在技术条件具备的前提下，推动管理变革，成功的概率也会更大，从而进一步打破由于管理所造成的信息壁垒。


    当我们实现了数据在集团内横到边、纵到底的通透后，集团财务管控的模式能够发生本质上的改变。在传统模式下不得不进行的块状管控模式能够转变为全局管控的新模式，而对于企业集团财务转型来说，这种模式的转变具有极其重要的意义与价值。


    2.集团流程管理向敏捷化的转变


    企业集团财务信息化迈向智能化的进程伴随着流程再造的过程。在从人工管理向财务自动化管理过渡的过程中，已经发生过一次非常重要的流程再造。在管理制度化、制度流程化、流程系统化的过程中，流程与系统被紧密地结合在了一起。


    费控系统和预算管理系统的出现很好地诠释了这种改变，费控系统使员工填写纸质单据并交由领导审批，再转至财务记账付款的模式实现了全面的线上化，从而将信息流转依托纸质单据单线程流转的模式转换为实物流和信息流双线程流转的模式。预算管理系统的建立使通过Excel进行多级人工汇总的预算编制过程实现了线上化，使整个预算编制流程的效率得以大幅提高。而预算控制也由以往只能在核算完成后的事后控制转变为事前或者是事中控制。


    以上结合信息系统从人工向自动化管理转变的过程中所发生的流程再造，更多的是形成了一套新的固化流程，是对财务人员升级后的管理思维的适应。而在智能时代，流程与系统的结合方式还将发生进一步的升级，从固化向敏捷流程跃迁。


    在智能化阶段，内置规则类似条件数方式的流程流转决策机制转变为基于人工智能的优化策略的选择：在流程流转过程中，系统能够更为灵活地根据管理模板设定流程流转的路径和复杂度，如针对不同风险程度的单据，能够灵活动态地决策是否需要更高级别的领导或者是财务人员进行审批、审核。再如，在管理决策的过程中，智能系统可以通过判断决策分析后获得信息的紧急程度，并据此进行不同的后续信息反馈流程。简单地说，流程不再是固化的模式，而是基于目标的敏捷和弹性的管理模式，如图1-4所示。


    ![img](images/txt001_4.jpg)


    图1-4　智能化下的敏捷流程


    敏捷流程的实现意味着管理从人工决策向机器决策更大程度的授权，也是计算机模拟人工进入深度阶段后可以尝试的应用场景。


    3.集团财务运营向自动化、智能化的转变


    在智能化过程中，相比管控的全局化及流程的敏捷化来说，集团财务运营向自动化和智能化的转变是相对容易实现的。


    所谓集团财务运营是指在当前财务工作中涉及的工作量大、标准化高的财务作业。在财务领域，这一类业务消耗了大量的人力，但其价值产出却相对有限。因此，针对这一领域的财务信息化能力建设始终是重点和热点。


    在过去，大量财务信息系统的建设已经在这一领域自动化的实现中发挥了重要作用，如银企直连取代了以往网银方式的资金作业，通过简单的会计引擎，实现了记账从人工向自动化的转变。但是，随着智能技术的不断发展，这一领域仍然有大量的空间能够进一步实现自动化。


    财务运营领域的智能化首先需要实现所有财务作业输入信息的数字化，如上文谈及的OCR技术、众包模式等都能够帮助解决此问题。而随着电子发票、电子合同的普及，困扰我们的大量纸质凭证将从源头实现数字化。在此数据基础上，计算机能够通过建立大量的规则、模型，将财务人员工作时所使用的大量的思考、分析、判断动作进行系统化，从而达到将复杂财务运营业务自动化、智能化的目的，如图1-5所示。


    ![img](images/txt001_5.jpg)


    图1-5　财务运营自动化、智能化示例


    在具体的应用中，财务共享服务中心是财务运营智能化的主要组织，但在企业的各级机构中，同样存在大量的财务运营自动化和智能化的机会。


    （二）智能化带来的组织革新


    财务的智能化不仅带来了财务管理模式的改变，还驱动着财务的组织形态发生改变。


    1.财务组织的智能化外延扩展


    在财务转型的上一个阶段中，很多企业构建了包括战略财务、专业财务、业务财务和共享服务四分类的组织架构模式。这一转变很好地支撑了企业集团从传统财务模式向现代财务模式的转变。但是，这一组织形态在智能化的进化中还在发生着进一步的演进。


    最为典型的架构演进模式是在四分架构的基础上进一步衍生出具有外延扩展特性的创新组织，这些组织的出现为财务向智能化转型提供了重要助力，如图1-6所示。


    ![img](images/txt001_6.jpg)


    图1-6　财务组织的外延扩展


    首先，数据中心的出现。如我们在上文中所谈到的，智能化技术之一的大数据，无论是对数据的管理还是应用，都极其重要。在传统的财务组织中，数据的处理都是分散在不同的财务职能中的。在这种模式下，数据的集中度不足，也难以满足大数据的要求。而财务数据中心的建立，能够从组织上保障数据的集中化管理。通过这样一个团队，实现数据探源、抽取、存储、维护等全过程的管理，为后续进一步基于数据展开大数据分析、人工智能应用带来重要的帮助。这样的组织应该是跨越财务、业务，以及信息技术的能力边界之上的，团队人员需要具有一定的复合技术能力。


    其次，需要有管理会计等专业化数据应用团队的出现。数据中心实现的是对数据基础的管理，在此基础上，数据的应用至关重要。因此，在企业的组织进化中，也需要专注于数据应用的专业化团队，如最为典型的管理会计团队，会在基础数据的基础上进一步研究数据的分摊方法，分析多维度的成本盈利情况，构建基于管理会计的考核体系等。此外，经营分析团队也属于数据应用的专业化组织。通过这些职能的构建，数据及智能技术与财务管理的实际应用场景进行结合，能够带来更好的智能化价值。


    最后，财务智能化团队的建立。财务的智能化技术和传统的财务信息化已经有所不同。对于企业来说，需要将传统的财务信息化队伍向智能化进一步升级。当然，如果企业还没有建立信息化队伍，那么构建的必要性就更加突出了。在财务智能化团队的职能中有两个方面比较重要：一方面是围绕应用需求进行场景构建的能力，财务智能化团队要能够进行业务需求分析，能够帮助财务部门各业务团队去发现和挖掘智能化的应用需求，并思考如何通过信息技术满足这些需求。另一方面是技术能力，能够将业务需求转化为技术需求，并能够与科技部门展开有效沟通，推动科技部门对业务需求的落地实现。


    智能化背景下的财务组织较之传统模式，将更多地以数据和场景为核心，进行智能化的外延拓展。


    2.财务组织从刚性向柔性转变


    在财务组织的智能化外延扩展的同时，另一个财务组织的变化——财务组织由刚性向柔性的转变。


    对于刚性管理来说，最具有代表性的当属泰勒的科学管理理论，这套理论不少大学的管理学课程都有过介绍。泰勒的科学管理思想包括作业管理、组织管理和管理哲学三个核心内容。其中，作业管理强调的是如何通过科学的工作方法、培训方法和激励方法来提升劳动生产率。当然，传统管理的刚性并不仅仅体现在科学管理理论，在现实的管理工作中到处都有刚性管理的影子，如组织中森严的管理层级、制度中可能存在的简单粗暴、流程中缺少变通的执行方式，信息系统中难以改变的架构等。'
  fmt: '

    对物体表征的各种各样的消息进行归纳和汇总分析，然后对事物或特定现象进行叙述、分辨、归类和阐述的行为就是模式识别。当今社会，模式识别的方法有很多，其中最主要的方法是结构法和决策论方法[\[5\]](#txt001.xhtml#footnote_content_txt001_5)。最近几年，又出现了一些新的方法。例如，在多元化大数据基础上的多元图形基元、特征基元的模式识别和粗糙集模式识别法等。另外，它在财务领域也有大量的实际运用，如能高效地分辨并描述出财务目标和大环境，并能识别公司财务管理受到金融危机时的原因和影响，从而根据分析提出解决方案；在公司的经营框架中，能够识别公司财务经营框架及框架所掌控的运行机制；在运营管理上，它的工作重点是识别财务的主体行为及它对财务管理目标的作用；在现金的保管规划层面，能识别资金的筹划支付及流动性；在企业财务的风险规避和安全层面，模式识别可以感受到潜在的财务危机和隐患，设立一个有预防作用的模型，从而达到保护财产安全的目的。


    ## 3. 智能财务管理信息共享系统


    为了达到快速有效处理财务的目的，我们将智能财务信息管理系统分为财务操作系统和财务查询系统。这样的系统使各部门可以通过浏览Web网站方便快捷地查询相关财务信息，即使是远离公司，也可以通过网站及时查询实时财务信息，而且发布财务信息的企业成本很低。财务管理智能系统的出现，意味着财务管理变得高效方便，其与网络技术完美结合，各部门在任何地方、任何时候都可以一目了然地在共享系统中了解财务状况。而以上方便快捷的系统生成是通过将企业ERP财务信息植入系统来实现的。


    ## 4. 人工神经网络模型


    通过大量的处理单元对人脑神经系统的模仿，仿照系统的工作结构和原理，再通过各个链接方式组成网络就是人工神经网络模型。运用学习案例更新信息储备库、推理机制等，以达到帮助人类增加对外部世界的认识及智能管理的目标。它主要运用在优化、预测、归类和函数逼近等方面，主要运用范围包括对上市企业进行财务风险预测和预警、财务问题分析诊断、规划财务管理、缴税和评估、财务质量的检测评估、对风险投资的项目进行分析评估、股票价格指数的监测和分析评估、固有财产投资规划和分析预测、金融证券定价、选择经济发展方式，等等。当前，人工智能技术已经是人工智能研究领域的重点、亮点和关注点，它在经济与财务管理方面的辉煌成就已经引起了人们的特别关注。


    ## （二）财务智能化的架构特点


    与传统财务信息化功能架构有所不同，财务智能化是建立在一系列智能技术基础之上的。在具体的信息化架构搭建时需要考虑以下要点。


    ### 1. 构建数据基础


    对于大数据和人工智能来说，数据是这些智能技术能够有效运转的基础。因此，在信息化架构中，必须要考虑搭建一个可靠的数据层。这个数据层和传统信息化技术中所理解的后台的数据是不一样的。如图1-1所示，在这个数据层的搭建中，要兼顾结构化数据和非结构化数据。


    ![img](images/txt001_1.jpg)


    图1-1　智能化阶段的数据基础


    首先，对于结构化数据来说，需要对系统中所有具有业务含义的数据进行标签化，也就是说，要建立一个标签字典，用来结构化地重新定义系统中的每一个具有业务含义的字段，并在每一笔交易发生时，将交易中所包含的所有标签及标签值存储到数据层中。


    其次，对于非结构化数据来说，要能够采用大数据技术对非结构化数据进行管理和存储，并基于应用场景尽可能地获取更为广泛的非结构化数据。


    在建立了基于标签的结构化数据及非结构化数据的数据基础之后，无论是后续基于规则引擎的自动化处理，还是基于机器学习引擎的智能建设，都具备了基础条件。这对于财务信息化来说，是一个重要的改变。


    ### 2. 构建智能技术引擎


    在有了数据基础之后，财务信息化平台向智能化的转型还需要一系列的技术引擎的支持，如图1-2所示。


    ![img](images/txt001_2.jpg)


    图1-2　智能技术引擎


    第一是图像文字识别引擎。财务的大量数据还是以实物形态存在的，如发票、合同等。虽然这些原始凭证正在向电子化迈进，但在现阶段，实物仍然是其主要形态，而这些实物中蕴含了大量财务信息，并且是后续智能应用的关键基础。要提取这些信息，除了通过人工录入或者采取众包模式外，还可以运用图像文字识别（OCR）技术。基于OCR技术，能够批量高效地对图像中财务信息进行提取。需要注意的是，传统的OCR技术并不是非常成熟，识别率较低，基于深度学习的OCR引擎会有所改进。


    第二是规则引擎。规则引擎能够以标签为基本元素，通过特定的语法对控制规则进行表达和封装，形成一个个规则包。这些规则包从业务角度来看，能够帮助我们替代一部分人工进行系统的自动化审核控制，规则引擎本身技术并不复杂，难点在于进行清晰的标签定义和管理，梳理和拆解规则，以及基于标签定义规则。对于最简单的差旅费报销来说，其涉及的标签可能多达数百个，并且也需要数十个的规则来进行组合审核。


    第三是流程引擎。流程引擎虽然在传统的财务信息化架构中已经广泛应用，但在智能化要求下，流程引擎需要具有更强的灵活性和扩展性，以支撑在智能应用中更为复杂的后台任务路径分流。流程引擎技术本身需要引入机器学习技术，以逐渐实现流程的智能化流转管理，如在共享派工时，实现更为灵活和均衡的智能派工。


    第四是机器学习引擎。机器学习引擎是人工智能技术的关键组件，能够将一系列算法进行封装，并形成标准化的输入和输出。机器学习引擎能够通过对带有特征和标签的大量历史数据的学习去自主发现规则或算法，并将这些规则或算法应用于财务的工作场景中，实现对人工的辅助或替代。机器学习引擎是财务信息化从自动化向智能化迈进的关键一步。


    第五是分布式账簿引擎。分布式账簿引擎可以理解为实现区块链在财务领域应用的重要基础。分布式账簿引擎通过在业务系统与财务系统底层搭建统一底账的方式，实现每一笔交易发生时的平行记账，并基于区块链的原理实现去中心化和数据一致。分布式账簿引擎能够为内部往来核对、关联交易核对、业财一致性核对等复杂业务问题提供技术支持。


    在完善的数据基础的支持及多个技术引擎的共同作用下，财务信息化架构能够实现从传统的自动化向智能化的进化。


    ## （三）财务人工智能的缺点


    财务机器人虽然可以替代财会人员完成大部分基础核算工作，但在实际工作中仍存在一些不能替代财会人员完成的工作。


    ### 1. 成本费用高


    目前，财务机器人对工作内容的标准化要求很高，不适合多种少量的工作模式。因此，财务机器人只适用于企业规模大、财税日常工作负荷重、快速成长期的企业。而对于普通企业来说，财务机器人的成本费用太高，后期维护费用过大，从成本效益的原则考虑，很多企业目前还不具备引进财务机器人的能力。


    ### 2. 技术发展不完善


    第一，财务机器人属于发展初级阶段，功能不完善，兼容性差，使用前期问题比较多。目前，财务机器人虽然在一些企业中已经应用，但从应用情况上来看，仍处于初级阶段，应用范围较小，应用层次不高，功能不够完善。因为初级阶段开发人员未全面考虑系列化、通用化、模块化的设计，容易造成系统兼容性差，所以使用初期问题较多。


    第二，操控财务机器人的技术人员不足，售后服务问题较多。财务机器人是新兴产品，精通操控财务机器人的技术人员十分紧缺。技术人员不仅要具有一定的会计理论知识，还需要了解人工智能和互联网相关的技术知识，具有综合技能的人才的匮乏给财务机器人后期的维护升级造成了一定的影响。


    第三，会计信息的安全性受到威胁。目前的会计信息处理与保存都以电子形式为主，而财务人工智能系统由于存在一定的技术漏洞，如果防护措施不到位，则有可能会被黑客攻破系统，盗取商业信息。对于企业来说，财务信息的外泄会造成非常严重的后果，使企业遭受巨大的经济损失。


    ### 3. 人性化水平低


    第一，财务机器人很难实现情感化。虽然财务机器人的计算速度和数据处理能力要比人类强，但是始终无法与具备人类的情感丰富度相比较。与人类相比，目前财务机器人在直觉判断方面不具备优势，而且无法处理复杂的逻辑判断问题，它很难完全模拟财会人员。财务机器人是按照事先设定的规则执行程序，它既没有感情，也不能完全像人一样进行思考。尤其是在涉及人际关系的处理时，财会人员能够根据人类的表情、语气等进行判断处理，而财务机器人则不具备这种处理能力。


    第二，财务机器人的及时反应和灵活程度不够。在普通的数据核算型工作中，财务机器人可以代替财会人员，但在处理涉及多种因素的宏观经济环境变化的问题时，财务机器人无法取代财会人员。财会人员在处理一个经济类工作时，能够根据自己所掌握的知识和经验，结合企业当前的内部环境状况和外部市场经济状况来作出决策。其中涉及会计规则、法律知识及情感经验等，而且会计规则及内外部的形势是随时变化着的，财会人员能够根据其变化作出相应的改变，而财务机器人则难以得出最佳的财务结论。无论财务人工智能如何发展，在处理涉及组织与组织、人与人、企业与社会的关系等问题时，它都不可能完全取代财会人员发挥作用。


    ## （四）财务人工智能对财会人员工作的影响


    2017 年英国牛津大学发布的一篇研究调查称，目前被人工智能机器人代替的可能性最大的工作岗位就是财务工作。哈格教授和卡明斯教授在《信息时代的管理信息系统》中阐述了专家系统，专家系统是通过模拟人类专家解决各个领域问题的人工智能技术，适合应用在会计工作中，同时他也指出这种系统的应用将会极大地威胁财会人员的工作，财会人员将面临失业。财务人工智能技术的应用和发展对财会人员工作的影响包含以下两个方面。


    第一，财务人工智能的发展给财会人员的工作带来巨大的挑战。基础核算财务岗位急剧减少，企业对财会人员的综合管理能力的要求不断提高，对财会人员的需求类型发生一定的变化。


    第二，财务人工智能的发展加速了财会人员的职业转型发展。财务人工智能虽然在很多方面可以代替财会人员进行工作，也可以完成传统的财务核算工作，但是财务人工智能与财会人员相比，并不能适用于会计行业中的每个领域[\[6\]](#txt001.xhtml#footnote_content_txt001_6)。在人工智能背景下，财会人员需要不断提高战略分析与判断能力，提高自己的综合素质，打造自身软实力，加强对自身职业生涯的设计与管理。


    # 第二节　智能时代促使财务转型的新技术


    ## 一、智能化全面驱动财务转型


    ### （一）智能化带来的财务管理模式转型


    以大数据、云技术、物联网、区块链、人工智能等为代表的智能化技术的出现，不仅从技术能力上全面提升了对财务工作的支持能力，还从思维模式上对企业财务管理的转型提出了更高的要求。


    #### 1. 集团管控向全局视角的转变


    在传统的财务管理模式下，集团财务管控长期以来一直是企业所面临的难题和挑战。对于企业集团来说，存在横向、纵向的信息壁垒，存在横纵信息割裂，如图1-3所示。


    ![img](images/txt001_3.jpg)


    图1-3　企业集团存在横纵信息割裂


    从横向来看，集团内的各业务板块及板块下的各专业公司之间存在壁垒。从集团的视角来看，业务板块及专业公司之间的信息以烟囱状的形态存在。不同专业公司之间的信息可比性存在问题，各公司之间的协同财务效果难以进行清晰的评价，专业公司之间财务结果的可比性也会存在问题。


    从纵向来看，集团和专业公司、专业公司总部与下级机构之间每一个层次也都存在信息壁垒，集团难以穿透到专业公司内部看清其经营情况，而专业公司总部也不排除和下级机构存在信息不对称和不透明的情况。


    造成这种信息割裂状况，一方面是因为管理机制，另一方面是因为在技术层面，采用传统的信息化架构模式，数据在集团层面的高度集中是困难的，多数情况下，数据在不同的管理主体中分散存储，进一步造成了数据透明的困难。


    而在技术智能化后，基于大数据、云计算等能力的支持，从技术角度来说，有条件实现数据更广范围的集中化管理，通过建立集中化的数据中心，打破集团内横向和纵向的信息壁垒。在技术条件具备的前提下，推动管理变革，成功的概率也会更大，从而进一步打破由于管理所造成的信息壁垒。


    当我们实现了数据在集团内横到边、纵到底的通透后，集团财务管控的模式能够发生本质上的改变。在传统模式下不得不进行的块状管控模式能够转变为全局管控的新模式，而对于企业集团财务转型来说，这种模式的转变具有极其重要的意义与价值。


    #### 2. 集团流程管理向敏捷化的转变


    企业集团财务信息化迈向智能化的进程伴随着流程再造的过程。在从人工管理向财务自动化管理过渡的过程中，已经发生过一次非常重要的流程再造。在管理制度化、制度流程化、流程系统化的过程中，流程与系统被紧密地结合在了一起。


    费控系统和预算管理系统的出现很好地诠释了这种改变，费控系统使员工填写纸质单据并交由领导审批，再转至财务记账付款的模式实现了全面的线上化，从而将信息流转依托纸质单据单线程流转的模式转换为实物流和信息流双线程流转的模式。预算管理系统的建立使通过Excel进行多级人工汇总的预算编制过程实现了线上化，使整个预算编制流程的效率得以大幅提高。而预算控制也由以往只能在核算完成后的事后控制转变为事前或者是事中控制。


    以上结合信息系统从人工向自动化管理转变的过程中所发生的流程再造，更多的是形成了一套新的固化流程，是对财务人员升级后的管理思维的适应。而在智能时代，流程与系统的结合方式还将发生进一步的升级，从固化向敏捷流程跃迁。


    在智能化阶段，内置规则类似条件数方式的流程流转决策机制转变为基于人工智能的优化策略的选择：在流程流转过程中，系统能够更为灵活地根据管理模板设定流程流转的路径和复杂度，如针对不同风险程度的单据，能够灵活动态地决策是否需要更高级别的领导或者是财务人员进行审批、审核。再如，在管理决策的过程中，智能系统可以通过判断决策分析后获得信息的紧急程度，并据此进行不同的后续信息反馈流程。简单地说，流程不再是固化的模式，而是基于目标的敏捷和弹性的管理模式，如图1-4所示。


    ![img](images/txt001_4.jpg)


    图1-4　智能化下的敏捷流程


    敏捷流程的实现意味着管理从人工决策向机器决策更大程度的授权，也是计算机模拟人工进入深度阶段后可以尝试的应用场景。


    #### 3. 集团财务运营向自动化、智能化的转变


    在智能化过程中，相比管控的全局化及流程的敏捷化来说，集团财务运营向自动化和智能化的转变是相对容易实现的。


    所谓集团财务运营是指在当前财务工作中涉及的工作量大、标准化高的财务作业。在财务领域，这一类业务消耗了大量的人力，但其价值产出却相对有限。因此，针对这一领域的财务信息化能力建设始终是重点和热点。


    在过去，大量财务信息系统的建设已经在这一领域自动化的实现中发挥了重要作用，如银企直连取代了以往网银方式的资金作业，通过简单的会计引擎，实现了记账从人工向自动化的转变。但是，随着智能技术的不断发展，这一领域仍然有大量的空间能够进一步实现自动化。


    财务运营领域的智能化首先需要实现所有财务作业输入信息的数字化，如上文谈及的OCR技术、众包模式等都能够帮助解决此问题。而随着电子发票、电子合同的普及，困扰我们的大量纸质凭证将从源头实现数字化。在此数据基础上，计算机能够通过建立大量的规则、模型，将财务人员工作时所使用的大量的思考、分析、判断动作进行系统化，从而达到将复杂财务运营业务自动化、智能化的目的，如图1-5所示。


    ![img](images/txt001_5.jpg)


    图1-5　财务运营自动化、智能化示例


    在具体的应用中，财务共享服务中心是财务运营智能化的主要组织，但在企业的各级机构中，同样存在大量的财务运营自动化和智能化的机会。


    ### （二）智能化带来的组织革新


    财务的智能化不仅带来了财务管理模式的改变，还驱动着财务的组织形态发生改变。


    #### 1. 财务组织的智能化外延扩展


    在财务转型的上一个阶段中，很多企业构建了包括战略财务、专业财务、业务财务和共享服务四分类的组织架构模式。这一转变很好地支撑了企业集团从传统财务模式向现代财务模式的转变。但是，这一组织形态在智能化的进化中还在发生着进一步的演进。


    最为典型的架构演进模式是在四分架构的基础上进一步衍生出具有外延扩展特性的创新组织，这些组织的出现为财务向智能化转型提供了重要助力，如图1-6所示。


    ![img](images/txt001_6.jpg)


    图1-6　财务组织的外延扩展


    首先，数据中心的出现。如我们在上文中所谈到的，智能化技术之一的大数据，无论是对数据的管理还是应用，都极其重要。在传统的财务组织中，数据的处理都是分散在不同的财务职能中的。在这种模式下，数据的集中度不足，也难以满足大数据的要求。而财务数据中心的建立，能够从组织上保障数据的集中化管理。通过这样一个团队，实现数据探源、抽取、存储、维护等全过程的管理，为后续进一步基于数据展开大数据分析、人工智能应用带来重要的帮助。这样的组织应该是跨越财务、业务，以及信息技术的能力边界之上的，团队人员需要具有一定的复合技术能力。


    其次，需要有管理会计等专业化数据应用团队的出现。数据中心实现的是对数据基础的管理，在此基础上，数据的应用至关重要。因此，在企业的组织进化中，也需要专注于数据应用的专业化团队，如最为典型的管理会计团队，会在基础数据的基础上进一步研究数据的分摊方法，分析多维度的成本盈利情况，构建基于管理会计的考核体系等。此外，经营分析团队也属于数据应用的专业化组织。通过这些职能的构建，数据及智能技术与财务管理的实际应用场景进行结合，能够带来更好的智能化价值。


    最后，财务智能化团队的建立。财务的智能化技术和传统的财务信息化已经有所不同。对于企业来说，需要将传统的财务信息化队伍向智能化进一步升级。当然，如果企业还没有建立信息化队伍，那么构建的必要性就更加突出了。在财务智能化团队的职能中有两个方面比较重要：一方面是围绕应用需求进行场景构建的能力，财务智能化团队要能够进行业务需求分析，能够帮助财务部门各业务团队去发现和挖掘智能化的应用需求，并思考如何通过信息技术满足这些需求。另一方面是技术能力，能够将业务需求转化为技术需求，并能够与科技部门展开有效沟通，推动科技部门对业务需求的落地实现。


    智能化背景下的财务组织较之传统模式，将更多地以数据和场景为核心，进行智能化的外延拓展。


    #### 2. 财务组织从刚性向柔性转变


    在财务组织的智能化外延扩展的同时，另一个财务组织的变化——财务组织由刚性向柔性的转变。


    对于刚性管理来说，最具有代表性的当属泰勒的科学管理理论，这套理论不少大学的管理学课程都有过介绍。泰勒的科学管理思想包括作业管理、组织管理和管理哲学三个核心内容。其中，作业管理强调的是如何通过科学的工作方法、培训方法和激励方法来提升劳动生产率。当然，传统管理的刚性并不仅仅体现在科学管理理论，在现实的管理工作中到处都有刚性管理的影子，如组织中森严的管理层级、制度中可能存在的简单粗暴、流程中缺少变通的执行方式，信息系统中难以改变的架构等。

    '
  trans: '


    对物体表征的各种各样的消息进行归纳和汇总分析，然后对事物或特定现象进行叙述、分辨、归类和阐述的行为就是模式识别。当今社会，模式识别的方法有很多，其中最主要的方法是结构法和决策论方法[\[5\]](#txt001.xhtml#footnote_content_txt001_5)。最近几年，又出现了一些新的方法。例如，在多元化大数据基础上的多元图形基元、特征基元的模式识别和粗糙集模式识别法等。另外，它在财务领域也有大量的实际运用，如能高效地分辨并描述出财务目标和大环境，并能识别公司财务管理受到金融危机时的原因和影响，从而根据分析提出解决方案；在公司的经营框架中，能够识别公司财务经营框架及框架所掌控的运行机制；在运营管理上，它的工作重点是识别财务的主体行为及它对财务管理目标的作用；在现金的保管规划层面，能识别资金的筹划支付及流动性；在企业财务的风险规避和安全层面，模式识别可以感受到潜在的财务危机和隐患，设立一个有预防作用的模型，从而达到保护财产安全的目的。


    ## 3. 智能财务管理信息共享系统


    为了达到快速有效处理财务的目的，我们将智能财务信息管理系统分为财务操作系统和财务查询系统。这样的系统使各部门可以通过浏览 Web 网站方便快捷地查询相关财务信息，即使是远离公司，也可以通过网站及时查询实时财务信息，而且发布财务信息的企业成本很低。财务管理智能系统的出现，意味着财务管理变得高效方便，其与网络技术完美结合，各部门在任何地方、任何时候都可以一目了然地在共享系统中了解财务状况。而以上方便快捷的系统生成是通过将企业
    ERP 财务信息植入系统来实现的。


    ## 4. 人工神经网络模型


    通过大量的处理单元对人脑神经系统的模仿，仿照系统的工作结构和原理，再通过各个链接方式组成网络就是人工神经网络模型。运用学习案例更新信息储备库、推理机制等，以达到帮助人类增加对外部世界的认识及智能管理的目标。它主要运用在优化、预测、归类和函数逼近等方面，主要运用范围包括对上市企业进行财务风险预测和预警、财务问题分析诊断、规划财务管理、缴税和评估、财务质量的检测评估、对风险投资的项目进行分析评估、股票价格指数的监测和分析评估、固有财产投资规划和分析预测、金融证券定价、选择经济发展方式，等等。当前，人工智能技术已经是人工智能研究领域的重点、亮点和关注点，它在经济与财务管理方面的辉煌成就已经引起了人们的特别关注。


    ## （二）财务智能化的架构特点


    与传统财务信息化功能架构有所不同，财务智能化是建立在一系列智能技术基础之上的。在具体的信息化架构搭建时需要考虑以下要点。


    ### 1. 构建数据基础


    对于大数据和人工智能来说，数据是这些智能技术能够有效运转的基础。因此，在信息化架构中，必须要考虑搭建一个可靠的数据层。这个数据层和传统信息化技术中所理解的后台的数据是不一样的。如图
    1-1 所示，在这个数据层的搭建中，要兼顾结构化数据和非结构化数据。


    ![img](img/txt001_1.jpg)


    图 1-1　智能化阶段的数据基础


    首先，对于结构化数据来说，需要对系统中所有具有业务含义的数据进行标签化，也就是说，要建立一个标签字典，用来结构化地重新定义系统中的每一个具有业务含义的字段，并在每一笔交易发生时，将交易中所包含的所有标签及标签值存储到数据层中。


    其次，对于非结构化数据来说，要能够采用大数据技术对非结构化数据进行管理和存储，并基于应用场景尽可能地获取更为广泛的非结构化数据。


    在建立了基于标签的结构化数据及非结构化数据的数据基础之后，无论是后续基于规则引擎的自动化处理，还是基于机器学习引擎的智能建设，都具备了基础条件。这对于财务信息化来说，是一个重要的改变。


    ### 2. 构建智能技术引擎


    在有了数据基础之后，财务信息化平台向智能化的转型还需要一系列的技术引擎的支持，如图 1-2 所示。


    ![img](img/txt001_2.jpg)


    图 1-2　智能技术引擎


    第一是图像文字识别引擎。财务的大量数据还是以实物形态存在的，如发票、合同等。虽然这些原始凭证正在向电子化迈进，但在现阶段，实物仍然是其主要形态，而这些实物中蕴含了大量财务信息，并且是后续智能应用的关键基础。要提取这些信息，除了通过人工录入或者采取众包模式外，还可以运用图像文字识别（OCR）技术。基于
    OCR 技术，能够批量高效地对图像中财务信息进行提取。需要注意的是，传统的 OCR 技术并不是非常成熟，识别率较低，基于深度学习的 OCR 引擎会有所改进。


    第二是规则引擎。规则引擎能够以标签为基本元素，通过特定的语法对控制规则进行表达和封装，形成一个个规则包。这些规则包从业务角度来看，能够帮助我们替代一部分人工进行系统的自动化审核控制，规则引擎本身技术并不复杂，难点在于进行清晰的标签定义和管理，梳理和拆解规则，以及基于标签定义规则。对于最简单的差旅费报销来说，其涉及的标签可能多达数百个，并且也需要数十个的规则来进行组合审核。


    第三是流程引擎。流程引擎虽然在传统的财务信息化架构中已经广泛应用，但在智能化要求下，流程引擎需要具有更强的灵活性和扩展性，以支撑在智能应用中更为复杂的后台任务路径分流。流程引擎技术本身需要引入机器学习技术，以逐渐实现流程的智能化流转管理，如在共享派工时，实现更为灵活和均衡的智能派工。


    第四是机器学习引擎。机器学习引擎是人工智能技术的关键组件，能够将一系列算法进行封装，并形成标准化的输入和输出。机器学习引擎能够通过对带有特征和标签的大量历史数据的学习去自主发现规则或算法，并将这些规则或算法应用于财务的工作场景中，实现对人工的辅助或替代。机器学习引擎是财务信息化从自动化向智能化迈进的关键一步。


    第五是分布式账簿引擎。分布式账簿引擎可以理解为实现区块链在财务领域应用的重要基础。分布式账簿引擎通过在业务系统与财务系统底层搭建统一底账的方式，实现每一笔交易发生时的平行记账，并基于区块链的原理实现去中心化和数据一致。分布式账簿引擎能够为内部往来核对、关联交易核对、业财一致性核对等复杂业务问题提供技术支持。


    在完善的数据基础的支持及多个技术引擎的共同作用下，财务信息化架构能够实现从传统的自动化向智能化的进化。


    ## （三）财务人工智能的缺点


    财务机器人虽然可以替代财会人员完成大部分基础核算工作，但在实际工作中仍存在一些不能替代财会人员完成的工作。


    ### 1. 成本费用高


    目前，财务机器人对工作内容的标准化要求很高，不适合多种少量的工作模式。因此，财务机器人只适用于企业规模大、财税日常工作负荷重、快速成长期的企业。而对于普通企业来说，财务机器人的成本费用太高，后期维护费用过大，从成本效益的原则考虑，很多企业目前还不具备引进财务机器人的能力。


    ### 2. 技术发展不完善


    第一，财务机器人属于发展初级阶段，功能不完善，兼容性差，使用前期问题比较多。目前，财务机器人虽然在一些企业中已经应用，但从应用情况上来看，仍处于初级阶段，应用范围较小，应用层次不高，功能不够完善。因为初级阶段开发人员未全面考虑系列化、通用化、模块化的设计，容易造成系统兼容性差，所以使用初期问题较多。


    第二，操控财务机器人的技术人员不足，售后服务问题较多。财务机器人是新兴产品，精通操控财务机器人的技术人员十分紧缺。技术人员不仅要具有一定的会计理论知识，还需要了解人工智能和互联网相关的技术知识，具有综合技能的人才的匮乏给财务机器人后期的维护升级造成了一定的影响。


    第三，会计信息的安全性受到威胁。目前的会计信息处理与保存都以电子形式为主，而财务人工智能系统由于存在一定的技术漏洞，如果防护措施不到位，则有可能会被黑客攻破系统，盗取商业信息。对于企业来说，财务信息的外泄会造成非常严重的后果，使企业遭受巨大的经济损失。


    ### 3. 人性化水平低


    第一，财务机器人很难实现情感化。虽然财务机器人的计算速度和数据处理能力要比人类强，但是始终无法与具备人类的情感丰富度相比较。与人类相比，目前财务机器人在直觉判断方面不具备优势，而且无法处理复杂的逻辑判断问题，它很难完全模拟财会人员。财务机器人是按照事先设定的规则执行程序，它既没有感情，也不能完全像人一样进行思考。尤其是在涉及人际关系的处理时，财会人员能够根据人类的表情、语气等进行判断处理，而财务机器人则不具备这种处理能力。


    第二，财务机器人的及时反应和灵活程度不够。在普通的数据核算型工作中，财务机器人可以代替财会人员，但在处理涉及多种因素的宏观经济环境变化的问题时，财务机器人无法取代财会人员。财会人员在处理一个经济类工作时，能够根据自己所掌握的知识和经验，结合企业当前的内部环境状况和外部市场经济状况来作出决策。其中涉及会计规则、法律知识及情感经验等，而且会计规则及内外部的形势是随时变化着的，财会人员能够根据其变化作出相应的改变，而财务机器人则难以得出最佳的财务结论。无论财务人工智能如何发展，在处理涉及组织与组织、人与人、企业与社会的关系等问题时，它都不可能完全取代财会人员发挥作用。


    ## （四）财务人工智能对财会人员工作的影响


    2017 年英国牛津大学发布的一篇研究调查称，目前被人工智能机器人代替的可能性最大的工作岗位就是财务工作。哈格教授和卡明斯教授在《信息时代的管理信息系统》中阐述了专家系统，专家系统是通过模拟人类专家解决各个领域问题的人工智能技术，适合应用在会计工作中，同时他也指出这种系统的应用将会极大地威胁财会人员的工作，财会人员将面临失业。财务人工智能技术的应用和发展对财会人员工作的影响包含以下两个方面。


    第一，财务人工智能的发展给财会人员的工作带来巨大的挑战。基础核算财务岗位急剧减少，企业对财会人员的综合管理能力的要求不断提高，对财会人员的需求类型发生一定的变化。


    第二，财务人工智能的发展加速了财会人员的职业转型发展。财务人工智能虽然在很多方面可以代替财会人员进行工作，也可以完成传统的财务核算工作，但是财务人工智能与财会人员相比，并不能适用于会计行业中的每个领域[\[6\]](#txt001.xhtml#footnote_content_txt001_6)。在人工智能背景下，财会人员需要不断提高战略分析与判断能力，提高自己的综合素质，打造自身软实力，加强对自身职业生涯的设计与管理。


    # 第二节　智能时代促使财务转型的新技术


    ## 一、智能化全面驱动财务转型


    ### （一）智能化带来的财务管理模式转型


    以大数据、云技术、物联网、区块链、人工智能等为代表的智能化技术的出现，不仅从技术能力上全面提升了对财务工作的支持能力，还从思维模式上对企业财务管理的转型提出了更高的要求。


    #### 1. 集团管控向全局视角的转变


    在传统的财务管理模式下，集团财务管控长期以来一直是企业所面临的难题和挑战。对于企业集团来说，存在横向、纵向的信息壁垒，存在横纵信息割裂，如图 1-3 所示。


    ![img](img/txt001_3.jpg)


    图 1-3　企业集团存在横纵信息割裂


    从横向来看，集团内的各业务板块及板块下的各专业公司之间存在壁垒。从集团的视角来看，业务板块及专业公司之间的信息以烟囱状的形态存在。不同专业公司之间的信息可比性存在问题，各公司之间的协同财务效果难以进行清晰的评价，专业公司之间财务结果的可比性也会存在问题。


    从纵向来看，集团和专业公司、专业公司总部与下级机构之间每一个层次也都存在信息壁垒，集团难以穿透到专业公司内部看清其经营情况，而专业公司总部也不排除和下级机构存在信息不对称和不透明的情况。


    造成这种信息割裂状况，一方面是因为管理机制，另一方面是因为在技术层面，采用传统的信息化架构模式，数据在集团层面的高度集中是困难的，多数情况下，数据在不同的管理主体中分散存储，进一步造成了数据透明的困难。


    而在技术智能化后，基于大数据、云计算等能力的支持，从技术角度来说，有条件实现数据更广范围的集中化管理，通过建立集中化的数据中心，打破集团内横向和纵向的信息壁垒。在技术条件具备的前提下，推动管理变革，成功的概率也会更大，从而进一步打破由于管理所造成的信息壁垒。


    当我们实现了数据在集团内横到边、纵到底的通透后，集团财务管控的模式能够发生本质上的改变。在传统模式下不得不进行的块状管控模式能够转变为全局管控的新模式，而对于企业集团财务转型来说，这种模式的转变具有极其重要的意义与价值。


    #### 2. 集团流程管理向敏捷化的转变


    企业集团财务信息化迈向智能化的进程伴随着流程再造的过程。在从人工管理向财务自动化管理过渡的过程中，已经发生过一次非常重要的流程再造。在管理制度化、制度流程化、流程系统化的过程中，流程与系统被紧密地结合在了一起。


    费控系统和预算管理系统的出现很好地诠释了这种改变，费控系统使员工填写纸质单据并交由领导审批，再转至财务记账付款的模式实现了全面的线上化，从而将信息流转依托纸质单据单线程流转的模式转换为实物流和信息流双线程流转的模式。预算管理系统的建立使通过
    Excel 进行多级人工汇总的预算编制过程实现了线上化，使整个预算编制流程的效率得以大幅提高。而预算控制也由以往只能在核算完成后的事后控制转变为事前或者是事中控制。


    以上结合信息系统从人工向自动化管理转变的过程中所发生的流程再造，更多的是形成了一套新的固化流程，是对财务人员升级后的管理思维的适应。而在智能时代，流程与系统的结合方式还将发生进一步的升级，从固化向敏捷流程跃迁。


    在智能化阶段，内置规则类似条件数方式的流程流转决策机制转变为基于人工智能的优化策略的选择：在流程流转过程中，系统能够更为灵活地根据管理模板设定流程流转的路径和复杂度，如针对不同风险程度的单据，能够灵活动态地决策是否需要更高级别的领导或者是财务人员进行审批、审核。再如，在管理决策的过程中，智能系统可以通过判断决策分析后获得信息的紧急程度，并据此进行不同的后续信息反馈流程。简单地说，流程不再是固化的模式，而是基于目标的敏捷和弹性的管理模式，如图
    1-4 所示。


    ![img](img/txt001_4.jpg)


    图 1-4　智能化下的敏捷流程


    敏捷流程的实现意味着管理从人工决策向机器决策更大程度的授权，也是计算机模拟人工进入深度阶段后可以尝试的应用场景。


    #### 3. 集团财务运营向自动化、智能化的转变


    在智能化过程中，相比管控的全局化及流程的敏捷化来说，集团财务运营向自动化和智能化的转变是相对容易实现的。


    所谓集团财务运营是指在当前财务工作中涉及的工作量大、标准化高的财务作业。在财务领域，这一类业务消耗了大量的人力，但其价值产出却相对有限。因此，针对这一领域的财务信息化能力建设始终是重点和热点。


    在过去，大量财务信息系统的建设已经在这一领域自动化的实现中发挥了重要作用，如银企直连取代了以往网银方式的资金作业，通过简单的会计引擎，实现了记账从人工向自动化的转变。但是，随着智能技术的不断发展，这一领域仍然有大量的空间能够进一步实现自动化。


    财务运营领域的智能化首先需要实现所有财务作业输入信息的数字化，如上文谈及的 OCR 技术、众包模式等都能够帮助解决此问题。而随着电子发票、电子合同的普及，困扰我们的大量纸质凭证将从源头实现数字化。在此数据基础上，计算机能够通过建立大量的规则、模型，将财务人员工作时所使用的大量的思考、分析、判断动作进行系统化，从而达到将复杂财务运营业务自动化、智能化的目的，如图
    1-5 所示。


    ![img](img/txt001_5.jpg)


    图 1-5　财务运营自动化、智能化示例


    在具体的应用中，财务共享服务中心是财务运营智能化的主要组织，但在企业的各级机构中，同样存在大量的财务运营自动化和智能化的机会。


    ### （二）智能化带来的组织革新


    财务的智能化不仅带来了财务管理模式的改变，还驱动着财务的组织形态发生改变。


    #### 1. 财务组织的智能化外延扩展


    在财务转型的上一个阶段中，很多企业构建了包括战略财务、专业财务、业务财务和共享服务四分类的组织架构模式。这一转变很好地支撑了企业集团从传统财务模式向现代财务模式的转变。但是，这一组织形态在智能化的进化中还在发生着进一步的演进。


    最为典型的架构演进模式是在四分架构的基础上进一步衍生出具有外延扩展特性的创新组织，这些组织的出现为财务向智能化转型提供了重要助力，如图 1-6 所示。


    ![img](img/txt001_6.jpg)


    图 1-6　财务组织的外延扩展


    首先，数据中心的出现。如我们在上文中所谈到的，智能化技术之一的大数据，无论是对数据的管理还是应用，都极其重要。在传统的财务组织中，数据的处理都是分散在不同的财务职能中的。在这种模式下，数据的集中度不足，也难以满足大数据的要求。而财务数据中心的建立，能够从组织上保障数据的集中化管理。通过这样一个团队，实现数据探源、抽取、存储、维护等全过程的管理，为后续进一步基于数据展开大数据分析、人工智能应用带来重要的帮助。这样的组织应该是跨越财务、业务，以及信息技术的能力边界之上的，团队人员需要具有一定的复合技术能力。


    其次，需要有管理会计等专业化数据应用团队的出现。数据中心实现的是对数据基础的管理，在此基础上，数据的应用至关重要。因此，在企业的组织进化中，也需要专注于数据应用的专业化团队，如最为典型的管理会计团队，会在基础数据的基础上进一步研究数据的分摊方法，分析多维度的成本盈利情况，构建基于管理会计的考核体系等。此外，经营分析团队也属于数据应用的专业化组织。通过这些职能的构建，数据及智能技术与财务管理的实际应用场景进行结合，能够带来更好的智能化价值。


    最后，财务智能化团队的建立。财务的智能化技术和传统的财务信息化已经有所不同。对于企业来说，需要将传统的财务信息化队伍向智能化进一步升级。当然，如果企业还没有建立信息化队伍，那么构建的必要性就更加突出了。在财务智能化团队的职能中有两个方面比较重要：一方面是围绕应用需求进行场景构建的能力，财务智能化团队要能够进行业务需求分析，能够帮助财务部门各业务团队去发现和挖掘智能化的应用需求，并思考如何通过信息技术满足这些需求。另一方面是技术能力，能够将业务需求转化为技术需求，并能够与科技部门展开有效沟通，推动科技部门对业务需求的落地实现。


    智能化背景下的财务组织较之传统模式，将更多地以数据和场景为核心，进行智能化的外延拓展。


    #### 2. 财务组织从刚性向柔性转变


    在财务组织的智能化外延扩展的同时，另一个财务组织的变化——财务组织由刚性向柔性的转变。


    对于刚性管理来说，最具有代表性的当属泰勒的科学管理理论，这套理论不少大学的管理学课程都有过介绍。泰勒的科学管理思想包括作业管理、组织管理和管理哲学三个核心内容。其中，作业管理强调的是如何通过科学的工作方法、培训方法和激励方法来提升劳动生产率。当然，传统管理的刚性并不仅仅体现在科学管理理论，在现实的管理工作中到处都有刚性管理的影子，如组织中森严的管理层级、制度中可能存在的简单粗暴、流程中缺少变通的执行方式，信息系统中难以改变的架构等。


