    ![](img/470b883072d48f1f2917a784b39d4327_130_2.png)


    图 7-20


    总结来说，IoU 值可以理解为系统预测出来的框与原来图片中标记的框的重合程度。它的计算方法也很简单，检测结果（Detection Result）与标注数据（Ground
    Truth）的交集比上它们的并集，即为检测的准确率。'
