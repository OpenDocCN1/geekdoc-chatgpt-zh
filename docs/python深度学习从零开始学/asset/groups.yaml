    下面用一个 TensorFlow 回归的例子来实践一下，画出它的流动图，代码如下：\n\n```\n######################################################\n\
    import tensorflow as tf\nimport numpy as np\n# ① prepare the original data\nwith\
    \ tf.name_scope('data'):\n    x_data = np.random.rand(100).astype(np.float32)\n\
    \    y_data = 0.3*x_data+0.1\n# ② creat parameters\nwith tf.name_scope('parameters'):\n\
    \    weight = tf.Variable(tf.random_uniform([1],-1.0,1.0))\n    bias = tf.Variable(tf.zeros([1]))\n\
    # ③ get y_prediction\nwith tf.name_scope('y_prediction'):\n    y_prediction =\
    \ weight*x_data+bias\n# ④ compute the loss\nwith tf.name_scope('loss'):\n    loss\
    \ = tf.reduce_mean(tf.square(y_data-y_prediction))\n# ⑤ creat optimizer\noptimizer\
    \ = tf.train.GradientDescentOptimizer(0.5)\n# ⑥ creat train ,minimize the loss\n\
    with tf.name_scope('train'):\n    train = optimizer.minimize(loss)\n# ⑦ creat\
    \ init\nwith tf.name_scope('init'):\n    init = tf.global_variables_initializer()\n\
    # ⑧ creat a Session\nsess = tf.Session()\nmerge_summary = tf.summary.merge_all()\n\
    writer = tf.summary.FileWriter(\"logs/\", sess.graph)\n```\n\n## Python 深度学习从零开始学\n\
    \n```\n# ⑨ sess.run(init)\nsess.run(init)\n# ⑩ Loop\nfor step in range(101):\n\
    \    sess.run(train)\n    if step %10==0 :\n        print (step ,'weight:',sess.run(weight),'bias:',sess.run(bias))\n\
    #################################################\n```\n\n程序代码解析如下：\n\n- (1) 第一项是准备数据，使用了\
    \ NumPy 的函数，随机生成 100 个 float32 型的数据，并生成相应的观测值 y。\n- (2) 第二项是生成训练参数，由 tf.Variable\
    \ 函数生成 weight 和 bias，这个函数非常常用，变量都是用它来生成的。\n- (3) 第三项是得到预测值，通过参数 weight、bias 与\
    \ x_data 运算得到。\n- (4) 第四项是计算损失，观测值与预测值差值的平方取平均。\n- (5) 第五项是生成一个优化器，使用的是梯度下降优化器。\n\
    - (6) 第六项是用优化器去最小化损失。\n- (7) 第七项是生成初始化 op，相当于所有变量初始化的开关，在 sess 里运行则对所有变量进行初始化。\n\
    - (8) 第八项是生成会话。\n- (9) 第九项是初始化所有变量，只要使用 tf.Variable 函数则都要求 sess.run(init) 进行初始化，如果参数没有进行初始化，则无法迭代更新。\n\
    - (10) 第十项是循环训练，执行 train，它会最小化损失。在这个过程中，参数也在不停地更新，我们用 print 打印出步数和参数值。\n\n运行这个程序，具体输出如下：\n\
