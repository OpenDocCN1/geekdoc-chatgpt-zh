    \ 方法需要设置以下三个基本参数：\n\n- 优化器：用于找到使损失函数最小的权重。Keras 实现了梯度下降的优化算法，称为随机梯度下降（SGD），此外还有两种更高级的优化算法，RMSprop\
    \ 和 Adam，三种算法中一般选用 Adam。优化器就是模型训练的指导教练，告诉模型该怎么调整权值，调整多大量，最终目标是将模型权值调整到最优。\n- 损失函数：使用\
    \ cross_entropy（交叉熵，一种用于计算多分类问题误差的函数）作为损失函数。\n- 评估指标：用于设置评估模型的方式，最为常用的分类评估指标是\
