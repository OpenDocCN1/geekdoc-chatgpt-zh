    \n我们还必须将“数字列表”转化为“向量列表”，因为数字列表无法显示出各个词语之间的相互联系，转化为向量之后便能够建立起各个词语之间的联系，相似度近的便靠得更近。这里需要用到自然语言处理技术——词嵌入。词嵌入是一种将词向量化的概念，原理是单词在高维空间中被编码为实值向量，词语之间的相似性意味着空间中的接近度。\n\
    \n之所以希望每个单词都变成一个向量，目的还是为了方便计算。比如“猫”“狗”“爱情”三个词，对于我们人类而言，可以清楚地知道“猫”和“狗”表示的都是动物，而“爱情”表示的是一种情感，但是对于机器而言，这三个词都是用0和1表示的二进制的字符串而已，无法对其进行计算。而通过词嵌入这种方式将单词转变为词向量，机器便可对单词进行计算，通过计算不同词向量之间夹角的余弦值，从而得出单词之间的相似性。例如将“猫”“狗”“爱情”映射到向量空间中，“猫”对应的向量为(0.1\
    \ 0.2 0.3)，“狗”对应的向量为(0.2 0.2 0.4)，“爱情”对应的向量为(-0.4 -0.5 -0.2)（本数据仅为示意），这三个单词的相似性如图9-2所示。\n\
