    \           validation_data=(X_test, y_test)) # 指定验证集, 这里为了简化模型, 直接用测试集数据进行验证\n\
    ```\n\n图 6-29\n\n部分输出结果如图 6-30 所示，从图中可以看到预测准确率达到 86%。\n"
