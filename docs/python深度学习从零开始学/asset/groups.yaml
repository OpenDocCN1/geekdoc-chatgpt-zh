    \ 0 |\n| None | | |\n\n图 8-29\n\n## 8.3.4 进行训练\n\n搭建完卷积神经网络模型，就可以使用反向传播法进行训练了。在训练模型之前，我们需要用\
    \ compile 方法对训练模型进行设置，如图 8-30 所示。\n\n```\n# 对训练模型进行设置\n#使用adam优化器，使用交叉熵做为损失函数\n\
    model.compile(loss='categorical_crossentropy', optimizer='adam', metrics=['accuracy'])\n\
    ```\n\n图 8-30\n\nKeras 提供 fit 函数用于训练卷积神经网络，如图 8-31 所示，将训练的输入与输出传给 fit 函数，设置训练与验证数据比例\
