    \ Embedding\n```\n\n建立一个线性堆叠模型，后续只需要将各个神经网络层加入模型即可：\n\n```\nmodel = Sequential()\n\
    ```\n\n将嵌入层加入模型，并且加入 Dropout 层避免过拟合。\n\n```\nmodel.add(Embedding(output_dim=32,\n\
