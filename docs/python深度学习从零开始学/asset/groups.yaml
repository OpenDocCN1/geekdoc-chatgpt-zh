    ## Python 深度学习从零开始学


    在图 4-5 中，只有一个单一的输出神经元，但一般情况下输出层也会有多个输出神经元。中间层被称为隐藏层，因为里面的神经元既不是输入也不是输出。隐藏层是整个神经网络最为重要的部分，它可以是一层，也可以是
    N 层，隐藏层的每个神经元都会对数据进行处理。


    ![](img/470b883072d48f1f2917a784b39d4327_52_0.png)


    ![](img/470b883072d48f1f2917a784b39d4327_52_1.png)


    图 4-4


    图 4-5


    MLP 并没有规定隐藏层的数量，因此可以根据自己的需求选择合适的隐藏层层数。MLP 对输出层神经元的个数也没有限制。我们通常把具有超过一个隐藏层的神经网络叫做深度神经网络。


    总结感知器主要有以下三点：


    - （1）加入了隐藏层，隐藏层可以有多层，增强模型的表达能力。当然，隐藏层的层数越多，其复杂度也越大。

    - （2）输出层的输出神经元可以不止一个，这样模型可以灵活地应用于分类回归。

    - （3）每个感知器都对输出结果有一定比重的贡献，单个感知器权重或偏移的变化应该对输出结果产生微小影响，这里需要使用非线性的激活函数。如果不使用非线性激活函数，那么即使是多层神经网络，也无法解决线性不可分的问题（当激活函数是线性时，多层神经网络相当于单层神经网络）。


    多层神经网络中一般使用的非线性激活函数有 sigmoid、softmax 和 ReLU 等，这些非线性激活函数给感知器引入了非线性因素，使得神经网络可以任意逼近任何非线性函数，这样神经网络就可以应用到众多的非线性模型中。通过使用不同的激活函数，神经网络的表达能力进一步增强。想象一下，足够多的神经元，足够多的层级，恰到好处的模型参数，神经网络威力暴增。


    ### 4.1.2 激活函数


    所谓激活函数，就是在神经网络的神经元上运行的函数，负责将神经元的输入映射到输出端。例如最简单的激活函数，如图 4-6 所示。


    图 4-6 所示的是单位阶跃函数，以 0 为界，输出从 0 切换为 1（或从 1 切换 0），其值呈阶梯式变化，所以称之为阶跃函数。当输入大于 0 的时候就继续向下一层传递，否则就不再传递。这个函数很好地表现了“激活”的意思，但是这个函数是由两段水平线组成，具有不连续、不光滑等不太好的性质，所以它无法用于神经网络的结构。


    因为如果使用它作激活函数的话，参数的微小变化所引起的输出的变化就会直接被阶跃函数抹杀掉，在输出端完全体现不出来，无法为权重的学习提供指引，这是不利于训练过程的参数更新的。


    ![](img/470b883072d48f1f2917a784b39d4327_53_0.png)


    图 4-6


    在神经网络中较常用的激活函数包括 sigmoid、tanh、ReLU 以及 softmax 函数，这些函数有一个共同的特点，就是它们都是非线性的函数。那么我们为什么要在神经网络中引入非线性的激活函数呢？


    从感知器的结构来看，如果不用激活函数，每一层输出都是上层输入的线性函数，无论神经网络有多少层，输出都是输入的线性组合，无法直接进行非线性分类，那么整个网络就只剩下线性运算，线性运算的复合还是线性运算，最终的效果只相当于单层的线性模型。


    所以，我们要加入一种方式来完成非线性分类，这个方法就是激活函数。激活函数给神经元引入了非线性因素，它应用在隐藏层的每一个神经元上，使得神经网络能够用于表示非线性函数，这样神经网络就可以应用到众多的非线性模型中。


    举个常用的非线性的激活函数的例子——sigmoid 函数，其公式如图 4-7 所示。


    sigmoid(x) = σ(x) = 1 / (1 + e^{-x})


    图 4-7


    这个函数的特点就是左端趋近于 0，右端趋近于 1，两端都趋于饱和，函数的图像如图 4-8 所示。


    sigmoid 函数是传统神经网络中最常用的激活函数之一，从数学上来看，sigmoid 函数对中央区的信号增益较大，对两侧区的信号增益较小，在信号的特征空间映射上有很好的效果。


    相对于阶跃函数只能返回 0 或 1，sigmoid 函数可以返回 0.731…、0.880…等实数。也就是说，感知器中神经元之间流动的是 0 或 1 的二元信号，而神经网络中流动的是连续的实数值信号。阶跃函数和
    sigmoid 函数虽然在平滑性上有差异，但是如果从宏观视角上看，可以发现它们具有相似的形状。实际上，两者的结构均是“输入小时，输出接近 0（为 0）；随着输入增大，输出向
    1 靠近（变成 1）”。也就是说，当输入信号为重要信息时，阶跃函数和 sigmoid 函数都会输出较大的值；当输入信号为不重要的信息时，两者都输出较小的值。还有一个共同点是，不管输入信号有多小或者有多大，输出信号的值的范围都为
    0~1。


    还有 ReLU 函数，也是一种很常用的激活函数，它的形式更加简单，当输入小于 0 时，输出为 0；当输入大于 0 时，输出与输入相等。其图像如图 4-9 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_54_0.png)


    ![](img/470b883072d48f1f2917a784b39d4327_54_1.png)


    ReLU 函数其实是分段线性函数，把所有的负值都变为 0，而正值不变。相比于其他激活函数来说，ReLU 函数有以下优势：对于线性函数而言，ReLU 函数的表达能力更强，尤其体现在深度网络中；而对于非线性函数而言，ReLU
    函数由于其非负区间的梯度为常数，因此不存在梯度消失问题，使得模型的收敛速度维持在一个稳定状态。这里稍微描述一下什么是梯度消失问题：当梯度小于 1 时，预测值与真实值之间的误差每传播一层会衰减一次。如果在深层模型中使用
    sigmoid 作为激活函数，这种梯度消失现象尤为明显，将导致模型收敛停滞不前。如今，几乎所有深度学习模型现在都使用 ReLU 函数，但它的局限性在于它只能在神经网络模型的隐藏层中使用。


    最后的输出层一般会有特定的激活函数，不能随意改变。比如多分类，我们应该使用 softmax 函数来处理分类问题从而计算类的概率。它与 sigmoid 函数类似，唯一的区别是在
    softmax 函数中，输出被归一化，总和变为 1。如果我们遇到的是二进制输出问题，就可以使用 sigmoid 函数；而如果我们遇到的是多分类问题，使用 softmax
    函数可以轻松地为每个类型分配值，并且可以很容易地将这个值转化为概率。所以 softmax 层一般作为神经网络最后一层，作为输出层进行多分类，softmax
    输出的每个值都 ≥ 0，并且其总和为 1，所以可以认为其为概率分布。举例来说，我们有一个向量 [3,1,−3]，将这组向量传入 softmax 层进行前向传播，我们会得到约等于
    [0.88,0.12,0] 这样的新向量。注意，这里各分量的和为 1，这是公式决定的。这样，这个新向量就可以表示取到各个值的概率了。


    ### 4.1.3 损失函数


    损失函数（Loss Function）用来度量真实值和预测值之间的距离，在统计学中损失函数是一种衡量损失和错误（这种损失与“错误地”估计有关）程度的函数。


    神经网络模型的训练是指通过输入大量训练数据，使得神经网络中的各参数（如权重系数 w）不断调整，从而“学习”到一个合适的值，使得损失函数最小。


    在处理分类问题的神经网络模型中，很多都使用交叉熵（Cross Entropy）作为损失函数。交叉熵出自信息论中的一个概念，原来的含义是用来估算平均编码长度。在人工智能学习领域，交叉熵用来评估分类模型的效果，比如图像识别分类器。交叉熵在神经网络中作为损失函数，p
    为真实标记分布，q 则为训练后模型的预测标记分布，交叉熵损失函数可以衡量 p 与 q 的相似性。


    我们希望模型在训练数据上学到的预测数据分布与真实数据分布越相近越好，为了简便计算，损失函数使用交叉熵就可以了。交叉熵在分类问题中常常与 softmax 函数搭配使用，softmax
    函数将输出的结果进行处理，使其多个分类的预测值的和为 1，再通过交叉熵来计算损失。


    ### 4.1.4 梯度下降和学习率


    神经网络的目的就是通过训练使近似分布逼近真实分布。那么应该如何训练，采用什么方式一点点地调整参数，找出损失函数的极小值（最小值）？


    我们最容易想到的调整参数（权重）的方法是穷举，即取遍参数的所有可能取值，比较在不同取值情况下得到的损失函数的值，即可得到使损失函数取值最小时的参数值。然而这种方法显然是不可取的。因为在深度神经网络中，参数的数量是一个可怕的数字，动辄上万、十几万。并且，参数取值有时是十分灵活的，甚至会精确到小数点后若干位。若使用穷举法，将会造就一个几乎不可能实现的计算量。


    因此我们使用梯度下降法。梯度下降法是一种求函数最小值的方法。梯度衡量的是，如果我们稍微改变一下输入值，函数的输出值会发生多大的变化。


    既然无法直接获得该最小值，那么我们就要想办法一步一步逼近该最小值。一个常见的比喻是，下山时一步一步朝着坡度最陡的方向往下走，即可到达山谷底部，如图 4-10
    所示。假设这样一个场景：一个人被困在山上，需要从山上下来（找到山的最低点，也就是山谷），但此时山上的雾很大，导致能见度很低，因此，下山的路径就无法确定，必须利用自己周围的信息一步一步地找到下山的路。这个时候，便可利用梯度下降算法来帮助自己下山。怎么做呢？首先以当前所处的位置为基准，寻找这个位置最陡峭的地方，然后朝着下降方向走一步，然后又继续以当前位置为基准，再找最陡峭的地方往下走，直到最后到达最低处。


    ![](img/470b883072d48f1f2917a784b39d4327_55_0.png)


    图 4-10


    在梯度下降中的步长大小称为学习率。在下降过程中步长越大，梯度影响越大。我们可以通过步长来控制每一步走的距离，其实就是不要走太快，错过了最低点，同时也要保证不要走得太慢，导致太阳下山了还没有走到山谷。所以学习率的选择在梯度下降法中非常重要，不能太大也不能太小，太小的话，可能导致迟迟走不到最低点；太大的话，可能导致错过最低点。


    学习率是深度学习中的一个重要的超参数，决定着目标函数能否收敛到局部最小值以及何时收敛到最小值。超参数是在开始学习过程之前设置值的参数，而不是通过训练得到的参数数据。学习率越低，损失函数的变化速度就越慢。虽然使用低学习率可以确保我们不会错过任何局部极小值，但也意味着我们将花费更长的时间来进行收敛。学习率的设置建议通过尝试不同的固定学习率，观察迭代次数和损失率的变化关系，找到损失下降最快所对应的学习率。


    ### 4.1.5 过拟合和 Dropout


    常见的梯度下降算法 SGD（Stochastic Gradient Descent，随机梯度下降算法）已经成为深度神经网络最常用的训练算法之一，还有些优化的方法如
    Adam 算法（自适应时刻估计计算法），它们会根据训练算法的过程而自适应地修正学习率。SGD 和 Adam 也被称为优化器（Optimizer）算法。因为神经网络越复杂，数据越多，在训练神经网络的过程上花费的时间也就越多，优化器算法的作用是为了让神经网络聪明起来、快起来。


    随着迭代次数的增加，我们可以发现测试数据的损失值（Loss Score）和训练数据的损失值存在着巨大的差距，如图 4-11 所示。随着迭代次数增加，训练损失（Train
    Loss）越来越好，但测试损失（Test Loss）的结果却越来越差，训练损失和测试损失的差距越来越大，模型开始过拟合（Overfit）。而过拟合会导致模型在训练集上的表现很好，但针对验证集或测试集，表现则大打折扣。


    ![](img/470b883072d48f1f2917a784b39d4327_56_0.png)


    图 4-11


    Dropout 是指在深度学习网络的训练过程中，按照一定的概率将一部分神经网络单元暂时从网络中丢弃，相当于从原始的网络中找到一个更“瘦”的网络，从而解决过拟合的问题，如图
    4-12 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_56_1.png)


    图 4-12


    做个类比，无性繁殖可以保留大段的优秀基因，而有性繁殖则将基因随机拆解，破坏了大段基因的联合适应性，但是自然选择中选择了有性繁殖，物竞天择，适者生存，可见有性繁殖的强大。Dropout
    也能达到同样的效果，它强迫一个神经单元和随机挑选出来的其他神经元共同工作，减弱了神经元节点间的联合适应性，增强了泛化能力。


    如果一个公司的员工每天早上都是扔硬币决定今天去不去上班，那么这个公司会运作良好吗？这并非没有可能，这意味着任何重要的工作都会有替代者，不会只依赖于某一个人。同样地员工也会学会和公司内各种不同的人合作，而不是每天都面对固定的人，每个员工的能力也会得到提升。这个想法虽然不见得适用于企业管理，但却绝对适用于神经网络。在进行
    Dropout 后，一个神经元不得不与随机挑选出来的其他神经元共同工作，而不是原先固定的周边神经元。这样经过几轮训练，这些神经元的个体表现力大大增强，同时也减弱了神经元节点间的联合适应性，增强了泛化能力。我们通常是在训练神经网络的时候使用
    Dropout，这样会降低神经网络的拟合能力，而在预测的时候关闭 Dropout。这就好像中国传统武术里，一个人在练轻功的时候会在脚上绑着很多重物，但是在真正和别人打斗的时候会把重物全拿走。


    ### 4.1.6 神经网络反向传播法


    神经网络可以理解为一个输入 x 到输出 y 的映射函数，即 f(x)=y，其中这个映射 f 就是我们所要训练的网络参数 w。我们只要训练出来了参数 w，那么对于任何输入
    x，就能得到一个与之对应的输出 y。只要 f 不同，那么同一个 x 就会产生不同的 y，我们当然想要获得最符合真实数据的 y，由此就要训练出一个最符合真实数据的映射
    f。训练最符合真实数据 f 的过程，就是神经网络的训练过程。神经网络的训练可以分为两个步骤：一个是前向传播，另外一个是反向传播。


    神经网络前向传播是从输入层到输出层：从输入层（Layer1）开始，经过一层层的层，不断计算每一层的神经网络得到的结果以及通过激活函数处理的本层输出结果，最后得到输出
    y^，计算出了 y^，就可以根据它和真实值 y 的差别来计算损失值。


    反向传播就是根据损失函数 L(y^,y) 来反方向地计算每一层，由最后一层逐层向前去改变每一层的权重，也就是更新参数，即得到损失值之后，反过去调整每个变量以及每层的权重。


    反向传播法，通常缩写为 BackProp，是一种监督式学习方法，即通过标记的训练数据来学习（有监督者来引导学习）。简单来说，BackProp 就是从错误中学习，监督者在人工神经网络犯错误时进行纠正。以猜数字为例，B
    手中有一张数字牌让 A 猜，首先 A 将随意给一个数字，B 反馈给 A 是大了还是小了，然后 A 经过修改，再次给一个数字，B 再反馈给 A 是否正确以及大小关系，经过数次猜测和反馈，最后得到正确答案（当然，在实际中不可能存在百分之百的正确，只能是最大可能正确）。


    因此反向传播，就是对比预测值和真实值，继而返回去修改网络参数的过程。一开始我们随机初始化卷积核的参数，然后以误差为指导通过反向传播算法，自适应地调整卷积核的值，从而最小化模型预测值和真实值之间的误差。


    一个人工神经网络包含多层的节点：输入层、中间隐藏层和输出层。相邻层节点的连接都配有权重。学习的目的就是为这些连接分配正确的权重。通过输入向量，这些权重可以决定输出向量。在监督式学习中，训练集是已标注的，这意味着对于一些给定的输入，我们知道期望的输出。


    对于反向传播算法，最初所有的边权重（Edge Weight）都是随机分配的。对于所有训练数据集中的输入，人工神经网络都被激活，并且观察其输出。这些输出会和我们已知的、期望的输出进行比较，误差会“传播”回上一层。该误差会被标注，权重也会被相应地调整。重复该流程，直到输出误差低于制定的标准。


    反向传播算法结束后，我们就得到了一个学习过的神经网络，该神经网络被认为可以接收新输入。也可以说该神经网络从一些样本（标注数据）和其错误（误差传播）中得到了学习。


    ### 4.1.7 TensorFlow 游乐场带你玩转神经网络


    TensorFlow 游乐场是一个通过网页浏览器就可以训练简单的神经网络，并实现可视化训练过程的工具。游乐场地址为 http://playground.tensorflow.org/，如图
    4-13 所示，游乐场是一个在线演示、实验的神经网络平台，是一个入门神经网络的非常直观的网站。这个图形化平台非常强大，将神经网络的训练过程直接可视化。


    ![](img/470b883072d48f1f2917a784b39d4327_58_0.png)


    图 4-13


    打开游乐场可以看到有很多的默认参数，首先我们来解读一下顶部的一部分参数：


    - Epoch: 训练次数。

    - Learning rate: 学习率，在梯度下降算法中会用到。学习率是人为根据实际情况来设定的，学习率越低，损失函数的变化速度就越慢。

    - Activation: 激活函数，默认为非线性函数 Tanh。

    - Regularization: 正则化，提高泛化能力，防止过拟合。如果参数过多，模型过于复杂，容易造成过拟合。即模型在训练样本数据上表现得很好，但在实际测试样本上表现得较差，不具备良好的泛化能力。为了避免过拟合，最常用的一种方法是使用正则化。

    - Regularization rate: 正则率，这里是正则化加上权重参数。

    - Problem type: 问题类型。分类问题是指给定一个新模式，根据训练集推断它所对应的类别，如 +1、-1，是一种定性输出，也叫离散变量预测；回归问题是指给定一个新模式，根据训练集推断它所对应的输出值（实数）是多少，是一种定量输出，也叫连续变量预测，这里我们要解决的是一个二分类问题。


    游乐场界面从左到右由数据（DATA）、特征（FEATURES）、神经网络的隐藏层（HIDDEN LAYERS）和层中的连接线、输出（OUTPUT）几个部分组成，DATA
    提供了四种数据集，我们默认选中第一种，被选中的数据也会显示在最右侧的 OUTPUT 中。如图 4-14 所示，在这个数据中，我们可以看到在二维平面内，点被标记成两种颜色。深色（电脑屏幕显示为蓝色）代表正值，浅色（电脑屏幕显示为黄色）代表负值。这两种颜色表示想要区分的两类，所以是一个二分类问题。还可以调节训练数据和测试数据的比例，并且可以调节数据中的噪声（Noise）比例来模拟真实数据噪声。噪声数据是指数据中存在着错误或异常（偏离期望值）的数据，这些数据对数据的分析造成了干扰。我们还可以调整每批（Batch）输入的数据的多少，调整范围是
    1~30，就是说每批进入神经网络数据的点可以有 1~30 个。


    FEATURES 层对应的实体的特征向量，特征向量是神经网络的输入，一般神经网络的第一层是输入层，代表特征向量中每一个特征的取值。如图 4-15 所示，每个点都有
    X1 和 X2 两个特征，由这两个特征还可以衍生很多其他的特征，如 X1X1、X2X2、X1X2、sin(X1)、sin(X2) 等。从颜色上看，X1 左边是黄色（颜色参看网站）为负，右边是蓝色（颜色参看网站）为正，X1
    表示此点的横坐标值。同理，X2 上边是蓝色为正，下边是黄色为负，X2 表示此点的纵坐标值。X1X1 是关于横坐标的“抛物线”信息，X2X2 是关于纵坐标的“抛物线”信息，X1X2
    是“双曲抛物面”的信息，sin(X1) 是关于横坐标的“正弦函数”信息，sin(X2) 是关于纵坐标的“正弦函数”信息。因此，要学习的分类器就是要结合上述一种或者多种特征，画出一条或者多条线，将原始的黄色和蓝色能够准确地区分开。


    HIDDEN LAYERS 即为隐藏层，位于神经网络输入层与输出层之间，如图 4-16 所示。主页显示的网络有两个隐藏层，第一个隐藏层有 4 个神经元，第二个隐藏层有
    2 个神经元。隐藏层之间的连线表示权重，蓝色（颜色参看网站）表示用神经元的原始输出，黄色（颜色参看网站）表示用神经元的负输出。连接线的粗细和深浅表示权重的绝对值大小。鼠标放在线上可以看到具体值，也可以修改值。下一层的神经网络的神经元会对上一层的输出再进行组合。组合时，根据上一次预测的准确性，通过反向传播给每个组合不同的权重，连接线的粗细和深浅会发生变化，连接线越粗颜色越深，表示权重越大。


