    \ 500\ntotal validation dog images: 500\n\n图 8-46\n\n### 8.4.2 建立模型\n\n我们基于 Keras\
    \ 深度学习框架创建卷积神经网络模型来识别猫和狗。在以前 MNIST 手写数字识别示例中，我们创建了一个小型卷积神经网络，现在将复用相同的总体结构，即卷积神经网络由卷积层（使用\
    \ ReLU 激活函数）和最大池化层交替堆叠构成。\n\n但由于这里要处理的是更大的图像和更复杂的问题，因此需要相应地增大网络，即再增加一个卷积层 + 卷积层最大池化层的组合。这样既可以增大网络容量，也可以进一步减小特征图的尺寸，使其在连接平坦层时尺寸不会太大。本例中初始输入的尺寸为\
    \ 150×150，最后在平坦层之前的特征图大小为 7×7。\n\n通过 Sequential 对象创建卷积神经网络模型的程序代码如图 8-47 所示。\n\
    \n```\n```python\nfrom keras import layers\nfrom keras import models\nmodel =\
    \ models.Sequential()\n#输入图片大小是150*150 3表示图像像素用(R,G,B)表示\nmodel.add(layers.Conv2D(32,\
    \ (3,3), activation='relu', input_shape=(150, 150, 3)))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
    \nmodel.add(layers.Conv2D(64, (3,3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
    \nmodel.add(layers.Conv2D(128, (3,3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
    \nmodel.add(layers.Conv2D(128, (3,3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,2)))\n\
    \nmodel.add(layers.Flatten())\nmodel.add(layers.Dense(512, activation='relu'))\n\
    model.add(layers.Dense(1, activation='sigmoid'))\nUsing TensorFlow backend.\n\
    ```\n```\n\n图 8-47\n\n通过 print(model.summary()) 输出我们创建的整个卷积神经网络模型的框架，如图 8-48 所示，网络中特征图的深度在逐渐增大（从\
    \ 32 增大到 128），而特征图的尺寸在逐渐减小（从 148×148 减小到 7×7），这几乎是所有卷积神经网络的模式。因为面对的是一个二分类问题，所以网络最后一层是使用\
    \ sigmoid 激活的单一单元（大小为 1 的链接层）。这个单元将对某个类别的概率进行编码。\n\n![](img/470b883072d48f1f2917a784b39d4327_150_0.png)\n\
    \n图 8-48\n\n### 8.4.3 数据预处理\n\n图片不能直接放入神经网络中进行学习，学习之前应该把数据格式化为经过预处理的浮点数张量。数据预处理大致分为\
    \ 4 个步骤；\n\n- 步骤 01 读取图像文件。\n- 步骤 02 将 JPEG 文件解码为 RGB 像素网格。\n- 步骤 03 将这些像素网格转换为浮点数张量。\n\
    - 步骤 04 将像素值 (0~255) 缩放到 [0,1] 区间（神经网络喜欢处理较小的数据输入值）。\n\n这些处理步骤可能看起来有点多，但幸运的是，Keras\
    \ 中的 keras.preprocessing.image 包含图像处理辅助工具 ImageDataGenerator 类，它可以快速创建 Python\
    \ 生成器，能够将硬盘上的图像文件自动转换为预处理好的张量批量。程序代码如图 8-49 所示。\n\n```\nfrom keras.preprocessing.image\
    \ import ImageDataGenerator\n#图像像素的值域为0~255，缩放至0到1之间\ntrain_datagen = ImageDataGenerator(rescale\
    \ = 1. / 255)\ntest_datagen = ImageDataGenerator(rescale = 1. / 255)\n#generator\
    \ 实际上是将数据批量载入内存,被代码类似for in 的方式方便的访问\n#使用flow_from_directory()方法可以实现一个针对图像batch的生成器\n\
    train_generator = train_datagen.flow_from_directory(\n    train_dir, target_size=(150,\
    \ 150), # 将所有图像大小调整为150*150\n    batch_size=20,\n    class_mode = 'binary') #因为使用了binary_crossentropy损失，所以需要使用二进制标签\n\
    validation_generator = test_datagen.flow_from_directory(\n    validation_dir,\
    \ target_size = (150, 150), batch_size = 20,\n    class_mode = 'binary')\n\nFound\
    \ 3000 images belonging to 2 classes.\nFound 1000 images belonging to 2 classes.\n\
    ```\n\n图 8-49\n\n执行代码生成了由 150×150 的 RGB 图像 [形状为 (20, 150, 150, 3)] 与二进制标签 [形状为\
    \ (20, )] 组成的批量，每个批量中包含 20 个样本（批量大小）。\n\n### 8.4.4 进行训练\n\n搭建完卷积神经网络模型，就可以使用反向传播法进行训练。在训练模型之前，我们需要用\
    \ compile 方法对训练模型进行设置。如图 8-50 所示，使用交叉熵损失函数（binary_crossentropy）训练我们的模型，优化器算法使用\
    \ adam，评估指标使用 accuracy。\n\n```\n# 对训练模型进行设置\n#使用adam优化器，使用交叉熵为损失函数\nmodel.compile(loss='categorical_crossentropy',\
    \ optimizer='adam', metrics=['accuracy'])\n```\n\n图 8-50\n\n如图 8-51 所示，使用 fit_generator\
    \ 方法来拟合数据（在生成器上的效果和 fit 函数一样），它的第一个参数应该是 Python 生成器。因为数据是不断生成的，所以 Keras 模型需要知道每一轮需要从生成器中抽取多少个样本，这就用到了\
    \ step_per_epoch 参数。从生成器中抽取 steps_per_epoch 个批量后（即运行了 steps_per_epoch 次梯度下降），拟合过程将进入下一个轮次。我们还可以向里面传入一个\
    \ validation_data 参数，这个参数可以是一个生成器，也可以是 NumPy 数组组成的元组，如果是生成器的话，还需要指定 validation_steps\
    \ 参数用来说明需要从验证的生成器中抽取多少个批次用于评估。\n\n```\ntrain_history = model.fit_generator(train_generator,\
    \ steps_per_epoch = 150,\n    epochs = 30, validation_data = validation_generator,\n\
    \    verbose=2, validation_steps = 100)\n```\n\n图 8-51\n\n部分训练结果如图 8-52 所示。\n\n\
    ```\nEpoch 17/30\n - 469s - loss: 0.2059 - acc: 0.9170 - val_loss: 0.5607 - val_acc:\
