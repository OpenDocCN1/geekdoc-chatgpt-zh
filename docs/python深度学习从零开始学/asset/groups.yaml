    \n在灰度图像中，每个像素仅表示一种颜色的强度，换句话说，它只有 1 个通道。而在彩色图像中，有 3 个通道，即 RGB（红，绿，蓝）通道。标准数码相机都有\
    \ 3 通道（RGB），即彩色图像由红色、绿色和蓝色 3 个通道组成。那么计算机如何看待彩色图像呢？同样，它们看到的是矩阵。那么我们要如何矩阵中表示这个图像呢？彩色图像有\
    \ 3 个通道，与只有 1 个通道的灰度图像不同，在这种情况下，我们利用 3D 矩阵来表示彩色图像。一个通道就是一个矩阵，我们将三个矩阵堆叠在一起，例如 700×700\
    \ 大小的彩色图像的矩阵维数将为（700，700，3）。通常，彩色图像中的每个像素具有与其相关联的 3 个数字（0～255），这些数字表示该特定像素中的红色、绿色和蓝色的强度。至于为什么是红、绿、蓝这三色，因为它们是色光三原色，其他颜色都可以通过三原色按照不同的比例混合而产生。\n\
    \n图像的存储方式涉及一个专业术语——张量。张量是一种更广义的概念，如果我们希望排列方式不仅有行和列，还有更多的维度，就需要用到张量。一个向量其实就是一组数字，它实际上就是一阶张量。矩阵也是一组数字，它由行和列构成，矩阵就是二阶张量。一幅彩色图像通常由一个三阶张量表示，即除了行和列的维度之外，另外一个维度就是通道。我们可以在深度为\
    \ 3 的 3D 矩阵中表示彩色图像。\n\n我们人看到的是图像，计算机看到的是一个数字矩阵，所谓“图像识别”，就是从一大堆数字中找出规律。\n\n###\
    \ 8.1.2 卷积神经网络为什么能称霸计算机图像识别领域\n\n计算机识别图像的过程与人的判断过程非常类似，通过与已有标签的图像做比较，来对新的图像作出判断。与人的判断过程不同的是，计算机科学家会设计算法来捕捉与图像形状、颜色相关的各种特征，通过这些特征来判断图像的相似度。这个捕捉特征来判断相似程度的算法的效果，能够很大程度地决定图像识别的效果。例如，利用图像矩阵之间的欧式距离表达图像的相似度，对于复杂的图像，比如歪扭、不规则的图像，效果就会大打折扣。所以真正解决计算机图像识别的技术还是卷积神经网络。\n\
    \n人的大脑在识别图片的过程中，并不是一下子整幅图同时识别，而是首先局部感知图片中的每一个特征，然后在更高层次对局部进行综合处理，从而得到全局信息。比如，人首先理解的是颜色和亮度，然后是边缘、角点、直线等局部细节特征，接下来是纹理、几何形状等更复杂的信息和结构，最后形成整个物体的概念。卷积神经网络通过卷积和池化操作，自动学习图像在各个层次上的特征，这符合我们理解的图像识别。\n\
    \n视觉神经科学（Visual Neuroscience）对于视觉机理的研究验证了这一结论，即动物大脑的视觉皮层具有分层结构。眼睛将看到的景象成像在视网膜上，视网膜把光学信号转换成电信号，传递到大脑的视觉皮层（Visual\
    \ Cortex），视觉皮层是大脑中负责处理视觉信号的部分。1959年，David和Wiesel进行了一次实验，他们在猫的大脑初级视觉皮层内插入电极，在猫的眼前展示各种形状、空间位置、角度的光带，然后测量猫大脑神经元放出的电信号。实验发现，不同的神经元对各种空间位置和方向偏好不同。这一研究成果让他们获得了诺贝尔奖。\n\
    \n视觉皮层的层次结构如图8-2所示。从视网膜传来的信号首先到达初级视觉皮层（Primary Visual Cortex），即V1皮层。V1皮层的神经元对一些细节、特定方向的图像信号敏感。经V1皮层处理之后，将信号传递到V2皮层。V2皮层将边缘和轮廓信息表示成简单形状，然后由V4皮层中的神经元进行处理，该皮层的神经元对颜色信息敏感。最终复杂物体在IT皮层（Inferior\
    \ Temporal Cortex）被表示出来。\n\n![](img/470b883072d48f1f2917a784b39d4327_133_0.png)\n\
    \n视觉皮层结构\n\n图 8-2\n\n卷积神经网络的灵感来自视觉皮层，可以看成是对视觉机理的简单模仿。每当我们看到某些东西时，一系列神经元被激活，每一层都会检测到一组特征，如线条、边缘，而高层次的层将检测更复杂的特征，以便识别我们所看到的内容。\n\
    \n卷积神经网络的概念最早出自19世纪60年代科学家提出的感受野。当时，科学家通过对猫的视觉皮层细胞的研究发现，每一个视觉神经元只会处理一小块区域的视觉图像，即感受野。到了20世纪80年代，日本科学家提出神经认知机的概念，可以算作是卷积网络最初的实现原型。神经认知机中包含两类神经元，用来抽取特征的S-cells和用来抗形变的C-cells，其中S-cells对应现在主流卷积神经网络中的卷积核滤波操作，而C-cells则对应激活函数、最大池化等操作。\n\
    \n卷积神经网络由多个卷积层构成，每个卷积层包含多个卷积核，用这些卷积核从左向右、从上往下依次扫描整个图像，得到称为特征图的输出数据。第一个卷积层会直接接收图像像素级的输入，每一个卷积操作只处理一小块图像，进行卷积变化后再传到后面的网络，每一层卷积（也可以说是滤波器）都会提取数据中最有效的特征。这种方法可以提取到图像中最基础的特征，比如不同方向的边或者拐角，而后再进行组合和抽象形成更高阶的特征。网络前面的卷积层捕捉图像局部、细节信息，后面的卷积层的感受野逐层加大，用于捕获图像更复杂、更抽象的信息。经过多个卷积层的运算，最后得到图像在各个尺度的抽象表示。\n\
    \n在图像处理领域，卷积也是一种常用的运算，不仅可用于图像去噪、增强、边缘检测等问题，还可以提取图像的特征。卷积运算用一个卷积核矩阵自上而下、自左向右地在图像上滑动，将卷积核矩阵的各个元素与它在图像上覆盖的对应位置的元素相乘，然后求和，得到输出像素值。\n\
    \n通过卷积核作用于输入图像的所有位置，我们可以得到图像的边缘图。边缘图在边缘位置有更大的值，在非边缘处的值接近于0。如图8-3所示为对图像卷积的结果，左边为输入图像，右边为卷积后的结果。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_134_0.png)\n\n![](img/470b883072d48f1f2917a784b39d4327_134_1.png)\n\
    \n图 8-3\n\n从图 8-3 中可以看到，通过卷积操作将图像的边缘信息凸显出来了。在图像处理中，这些卷积核矩阵的数值是人工设计的。而在机器学习中，我们可以通过某种方法来自动生成这些卷积核，从而描述各种不同类型的特征。卷积神经网络就是通过这种自动学习的手段来得到各种有用的卷积核。\n\
    \n2012 年，在有计算机视觉界“世界杯”之称的 ImageNet 图像分类竞赛中，Geoffrey E. Hinton 等人凭借卷积神经网络 Alex-Net，力挫日本东京大学、英国牛津大学\
    \ VGG 组等劲旅，且以超过第二名近 12% 的准确率一举夺得该竞赛冠军，一时间在学界、业界引起极大的轰动，自此便揭开了卷积神经网络在计算机视觉领域逐渐称霸的序幕，此后每年\
    \ ImageNet 竞赛的冠军非深度卷积神经网络莫属。到了 2015 年，在改进了卷积神经网络中的激活函数后，卷积神经网络在 ImageNet 数据集上的预测错误率（4.94%）第一次低于了人类预测错误率（5.1%）。近年来，随着神经网络特别是卷积神经网络相关领域研究人员的增多、技术的日新月异，卷积神经网络也变得愈宽愈深愈加复杂。在各种深度神经网络结构中，卷积神经网络是应用最广泛的一种。卷积神经网络在\
