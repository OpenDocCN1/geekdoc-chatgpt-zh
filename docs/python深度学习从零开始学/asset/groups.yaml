    \ 2 | 1 | 1 | 778 | 25564.01 | 129909.8079 | 0 | 0 | 1 |\n| 4 | 1 | 55 | 4 | 3\
    \ | 1 | 0 | 547 | 3235.61 | 136976.1948 | 0 | 0 | 1 |\n\n图 6-25\n\n数据集拆分之后，下一步要做的是特征缩放。神经网络不喜欢大的取值范围，需要将输入神经网络的数据标准化，把数据约束在较小的区间，这就是特征缩放。对数据进行标准化，其步骤是：对于输入数据的每个特征，减去特征平均值，再除以标准差，之后得到的特征平均值为\
    \ 0，标准差为 1。这里可以直接调用 StandardScaler() 函数，如图 6-26 所示，它位于 sklearn 包下，StandardScaler\
    \ 类是处理数据归一化和标准化的利器。\n\n```\nfrom sklearn.model_selection import train_test_split\
    \ # 拆分数据集\nX_train, X_test, y_train, y_test = train_test_split(X, y,\n    test_size=0.2,\
    \ random_state=0)\nfrom sklearn.preprocessing import StandardScaler # 导入特征缩放器\n\
    sc = StandardScaler() # 特征缩放器\nX_train = sc.fit_transform(X_train) # 拟合并应用于训练集\n\
    X_test = sc.transform (X_test) # 训练集结果应用于测试集\n```\n\n图 6-26\n\n注意 对于神经网络而言，特征缩放极为重要，特征缩放将最大程度地提高梯度下降的效率。\n\
    \n### 6.5.3 建立模型\n\n导入所需模块，建立 Keras Sequential 模型，后续只需要将各个神经网络层加入模型中，这里使用 model.add\
    \ 方法加入全连接层。Keras 构建出来的神经网络通过模块组装在一起，各个深度学习元件都是 Keras 模块，比如神经网络层、损失函数、优化器、参数初始化、激活函数、模型正则化等，都是可以组合起来构建新模型的模块。\n\
    \n全连接层是最常用的深度网络层的类型，即当前层和其下一层的所有神经元之间都有连接。这个网络只有 3 层，如图 6-27 所示。参数 Input_dim 是输入维度，输入维度必须与特征维度相同；参数\
    \ unit 是输出维度；参数 activation 是激活函数，这是每一层都需要设置的参数，\n\n## Python深度学习从零开始学\n\n中间层常用\
    \ ReLU 函数。输出层，也是全连接层，指定的输出维度为 1，因为对于二分类问题，输出维度必须是 1；而对于多分类问题，有多少类别，维度就是多少。对于二分类问题的输出层，激活函数固定选择\
    \ sigmoid 函数。如果是神经网络多分类输出，激活函数是 softmax 函数，它是 sigmoid 的扩展版。\n\n```\nimport keras\
    \ # 导入Keras库\nfrom keras.models import Sequential # 导入Keras/序列模型\nfrom keras.layers\
