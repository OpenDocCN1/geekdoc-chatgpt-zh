    \ VGG 网络的基础上套了一个格拉姆矩阵用来计算不同局部特征的相关性，把它变成一个统计模型，这样就完成了图像纹理的提取。\n\n直接把局部特征看作近似的图像内容，这样就得到了一个将图像内容与纹理分开的系统。而将内容与纹理合成的方法，就是\
    \ Google 在 2015 年夏天首次发布的 DeepDream 方法，找到能让合适的特征提取神经元被激活的图像即可。\n\n风格迁移的一般步骤是：①创建一个网络，它能够同时计算风格参考图像、目标图像和生成图像的\
    \ VGG 网络层激活；②使用这三幅图像上计算的层激活来定义之前所述的损失函数，为了实现风格迁移，需要将这个损失函数最小化；③设置梯度下降过程来将这个损失函数最小化。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_212_0.png)\n\n## 第 13 章\n生成对抗网络\n\n\
    生成对抗网络（Generative Adversarial Networks，GAN）是一种深度学习模型，也是近两年深度学习领域的新秀，无监督式学习最具前景的方法之一。GAN\
    \ 模型通过框架中（至少）两个模块——生成模型（Generative Model）和判别模型（Discriminative Model）的互相博弈学习产生相当好的输出。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_212_1.png)\n\n### 13.1 什么是生成对抗网络\n\n\
    有个比喻可以解释 GAN。假设你想买块名表，但是从未买过名表的你很可能难辨别表的真假，而买名表的经验可以避免你被奸商欺骗。当你开始将大多数名表标记为假表（当然是被骗之后），卖家将开始生产更逼真的山寨名表。这个例子形象地解释了\
    \ GAN 的基本原理，判别器网络（名表买家）和生成器网络（生产假名表的卖家），两个网络相互博弈。GAN 允许生成逼真的物体（例如图像）。生成器由于压力被迫生成看似真实的样本，而判别器学习怎么分辨生成样本和真实样本。\n\
    \nGAN 的基本原理其实非常简单，这里以生成图片为例进行说明。假设我们有两个网络，G（Generator）和 D（Discriminator）。正如它的名字所暗示的那样，它们的功能分别是：\n\
    - G 是一个生成图片的网络，它接收一个随机的噪声 z，通过这个噪声生成图片，记作 G(z)。\n- D 是一个判别网络，判别一幅图片是不是“真实的”。它的输入参数是\
    \ x，x 代表一幅图片，输出 D（x）代表 x 为真实图片的概率，如果为 1，就代表 100% 是真实的图片，而输出为 0，就代表不可能是真实的图片。\n\
    \n在训练过程中，生成网络 G 的目标就是尽量生成真实的图片去欺骗判别网络 D。而 D 的目标就是尽量把 G 生成的图片和真实的图片区分开来。这样，G 和\
    \ D 就构成了一个动态的“博弈过程”。\n\n最后博弈的结果是什么？在最理想的状态下，G 可以生成足以“以假乱真”的图片 G(z)。对于 D 来说，它难以判定\
    \ G 生成的图片究竟是不是真实的，因此 D(G(z)) = 0.5。\n\n这样我们的目的就达成了：我们得到了一个生成式的模型 G，它可以用来生成图片。\n\
    \n引申到GAN里面就是，GAN中有两个这样的博弈者，一个博弈者的名字是生成模型（G），另一个博弈者的名字是判别模型（D）。它们各自有各自的功能。\n\n\
    G与D的相同点是：\n- 这两个模型都可以看成是一个黑匣子，接收输入然后有一个输出，类似一个函数，一个输入输出映射。\n\nG与D的不同点是：\n- 生成模型：比作是一个样本生成器，输入一个噪声/样本，然后把它包装成一个逼真的样本，也就是输出。\n\
    - 判别模型：比作一个二分类器（如同0-1分类器），来判断输入的样本是真是假（就是输出值大于0.5还是小于0.5）。\n\n生成对抗网络的原理图如图13-1所示。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_213_0.png)\n\n图13-1\n\n首先判别模型就是图13-1中右半部分的网络，直观来看就是一个简单的神经网络结构，输入就是一幅图像，输出就是一个概率值，用于判断真假（概率值大于0.5那就是真，小于0.5那就是假），真假也不过是人们定义的概率而已。其次是生成模型，生成模型要做什么呢？同样也可以把生成模型看成是一个神经网络模型，输入是一组随机数Z，输出是一幅图像，不再是一个数值而已。从图中可以看到，存在两个数据集，一个是真实数据集，这个好理解；另一个是假的数据集，这个数据集就是由生成网络造出来的数据集。\n\
    \n根据图13-1，我们再来理解一下GAN的目标是要干什么：\n- 判别网络的目的：就是能判别出来输入的一幅图是来自真样本集还是假样本集。假如输入的是真样本，网络输出就接近1；输入的是假样本，网络输出就接近0。这样很完美，达到了很好的判别目的。\n\
    - 生成网络的目的：生成网络是造样本的，它的目的就是使得自己造样本的能力尽可能强，强到什么程度呢？判别网络没法判断样本是真样本还是假样本。\n\n有了这个理解，我们再来看为什么叫作对抗网络。判别网络说：“我很强，来一个样本我就知道它是来自真样本集还是假样本集”。生成网络就不服了，说：“我也很强，我生成一个假样本，虽然我生成网络知道是假的，但是你判别网络不知道，我包装得非常逼真，你判别网络无法判断真假。”用输出数值来解释就是，生成网络生成的假样本进了判别网络以后，判别网络给出的结果是一个接近\
    \ 0.5 的值，极限情况就是 0.5，也就是说判别不出来了。\n\n由这个分析可以发现，生成网络与判别网络的目的正好是相反的，一个说我能判别得好，另一个说我让你判别不好，所以叫作对抗。那么最后的结果到底是谁赢呢？这就要归结到设计者，也就是我们希望谁赢了。作为设计者，我们的目的是要得到以假乱真的样本，那么很自然地我们希望生成样本赢了，也就是希望生成样本很真，让判别网络不能区分出真假样本。\n\
    \n### 13.2 生成对抗网络算法细节\n\n知道了生成对抗网络大概的目的与设计思路，我们就可以设计生成对抗网络。相比于传统的神经网络模型，GAN 是一种全新的非监督式的架构，如图\
    \ 13-2 所示。GAN 包括了两套独立的网络，两者之间作为互相对抗的目标。第一套网络是我们需要训练的分类器（图 13-2 中的 D），用来分辨是真实数据还是虚假数据；第二套网络是生成器（图\
    \ 13-2 中的 G），生成类似于真实样本的随机样本，并将其作为假样本。\n\n![](img/470b883072d48f1f2917a784b39d4327_214_0.png)\n\
    \n图 13-2\n\n详细说明如下：\n\nD 作为一个图片分类器，对一系列图片区分图片中的不同动物。生成器 G 的目标是绘制出非常接近的伪造图片来欺骗\
    \ D，做法是选取训练数据潜在空间中的元素进行组合，并加入随机噪声，例如选取一幅猫的图片，然后给猫加上第三只眼睛，以此作为假数据。\n"
