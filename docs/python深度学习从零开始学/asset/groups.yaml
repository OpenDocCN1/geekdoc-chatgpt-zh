    \ 0.8240\nEpoch 27/30\n - 520s - loss: 0.0496 - acc: 0.9857 - val_loss: 0.7360\
    \ - val_acc: 0.8120\nEpoch 28/30\n - 569s - loss: 0.0452 - acc: 0.9857 - val_loss:\
