    \ acc: 0.9907 - val_loss: 0.7702 - val_acc: 0.8250\n```\n\n图 8-52\n\n### 8.4.5\
    \ 模型保存和评估\n\n在训练完成后保存模型，这是一种良好习惯，保存模型的代码如图 8-53 所示。接下来我们分别绘制训练过程中模型在训练数据和验证数据上的损失和准确率，程序代码如图\
