    \ 年 4 月 15 日，在其首次航行期间，泰坦尼克号撞上冰山后沉没，2224 名乘客和机组人员中有 1502 人遇难。这场悲剧举世震惊，并促使各国制定出更好的船舶安全条例。海难导致生命损失的原因之一是没有足够的救生艇给乘客和机组人员。虽然幸存下来有一些运气的因素，但一些人比其他人更有可能获得生存机会，比如妇女、儿童和上层阶级。在本案例中，我们要完成对哪些人可能生存的分析，特别是要运用机器学习的工具来预测哪些乘客能幸免于难。\n\
