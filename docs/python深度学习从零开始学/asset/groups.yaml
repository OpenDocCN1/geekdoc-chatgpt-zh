    \n### 9.2.1 加入嵌入层\n\n词嵌入的作用是将人类的语言映射到几何空间中，词与词之间的语义关系通过几何距离来表示。表示不同事物的词被嵌入到相隔很远的点，而相关的词则更加靠近（“花”与“植物”，“狗”与“动物”靠得近一些）。Keras\
    \ 中的嵌入层可以将“数字列表”转换为“向量列表”。嵌入层可以理解为一个字典，将整数索引（表示特定单词）映射为密集向量，即它接收整数作为输入，并在内部字典中查找这些整数，然后返回相关联的向量。嵌入层的输入是一个二维整数张量，其形状为（samples,\
