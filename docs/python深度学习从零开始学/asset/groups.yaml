    3×3，通道数量为 64。VGGNet 全部使用 3×3 的卷积核和 2×2 的池化核，通过不断加深网络结构来提升性能。网络层数的增长并不会带来参数数量上的爆炸，因为参数量主要集中在最后三个全连接层中。VGGNet
    虽然网络更深，但比 AlexNet 收敛更快，缺点是占用内存较大。


    VGGNet 论文的一个主要结论就是深度的增加有益于精度的提升，这个结论堪称经典。连续 3 个 3×3 的卷积层（步长 1）能获得和一个 7×7 的卷积层等效的感受野，而深度的增加在增加网络的非线性时减少了参数（3×3^2<7^2）。从
    VGGNet 之后，大家都倾向于使用连续多个更小的卷积层，甚至分解卷积核（Depthwise Convolution）。


    但是，VGGNet 只是简单地堆叠卷积层，而且卷积核太深（最多达 512），特征太多，导致其参数猛增，搜索空间过大，正则化困难，因而其精度并不是最高的，在推理时也相当耗时，和
    GoogLeNet 相比其性价比明显不高。


    # 4.3.4 GoogLeNet


    GoogLeNet 是 ILSVRC 2014 的冠军获得者，是来自 Google 的 Szegedy 等人开发的卷积网络。其主要贡献是开发了一个 Inception
    模块，该模块大大减少了网络中的参数数量（4M，与带有 60M 的 AlexNet 相比不足其十分之一）。另外，这个论文在卷积神经网络的顶部使用平均池化而不是完全连接层，从而消除了大量并不重要的参数。GoogLeNet
    还有几个后续版本，最新的 是 Inception-v4。'
