    # 9.3 基于 RNN 模型的电影评论情感分析


    本节建立一个循环神经网络（Recurrent Neural Network，RNN）模型，使用该模型进行电影评论情感分析。


    # 9.3.1 为什么要使用 RNN 模型


    前面章节学习了全连接神经网络和卷积神经网络，以及它们的训练和使用方法。它们都只能单独处理一个个的输入，前一个输入和后一个输入是完全没有关系的。但是，某些任务需要能够更好地处理序列的信息，即前面的输入和后面的输入是有关系的。比如，当我们在理解一句话的意思时，孤立地理解这句话的每个词是不够的，我们需要处理这些词连接起来的整个序列；当我们处理视频的时候，也不能只单独地去分析每一帧，而要分析这些帧连接起来的整个序列。这时，就需要用到深度学习领域中另一类非常重要的神经网络——循环神经网络。


    RNN 是在自然语言处理领域中最先被用起来的，比如，RNN 可以为语言模型建模。那么，什么是语言模型呢？


    我们和电脑玩这样一个游戏，我们写出一个句子前面的一些词，然后让电脑帮我们写接下来的一个词。比如下面这句：


    我昨天上学迟到了，老师批评了__。


    在这个例子中，接下来的这个词最有可能是“我”，而不太可能是“小明”，甚至是“吃饭”。


    语言模型是对一种语言的特征进行建模，简单地说就是给定一句话前面的部分，预测接下来最有可能的一个词是什么。


    使用 RNN 之前，语言模型主要采用 N-Gram。N 可以是一个自然数，比如 2 或者 3。N-Gram 的含义是，假设一个词出现的概率只与前面 N 个词相关。以
    2-Gram 为例，首先对前面的一句话进行切词：


    我昨天上学迟到了，老师批评了__。


    如果用 2-Gram 进行建模，那么电脑在预测的时候，只会看到前面的“了”，然后，计算机会在语料库中搜索“了”后面最可能连接的一个词。不管最后计算机选的是不是“我”，我们都知道这个模型是不靠谱的，因为“了”前面的单词都没有用到。如果是
    3-Gram 模型，则会搜索“批评了”后面最可能连接的词，感觉上比 2-Gram 靠谱了不少，但还是远远不够的。因为这句话最关键的信息“我”是在“了”前面的第
    7 个词。'
