    \ 的 RGB 值转换为 [-1,1] 上的值\n    arr = np.array(im)/255*2-1\n    return arr\nimport\
    \ glob\nimport random\nclass DataSet(object):\n```\n\n```\n\"\"\"\n用于管理数据的类\n\"\
    \"\"\ndef __init__(self, data_path, image_size = 256):\n    self.data_path = data_path\n\
    \    self.epoch = 0\n    self.__init_list()\n    self.image_size = image_size\n\
    def __init_list(self):\n    self.data_list = glob.glob(self.data_path)\n    random.shuffle(self.data_list)\n\
    \    self.ptr = 0\ndef get_batch(self, batchsize):\n    \"\"\"\n    取出 batchsize\
    \ 幅图片\n    \"\"\"\n    if (self.ptr + batchsize >= len(self.data_list)):\n   \
    \     batch = [load_image(x, self.image_size) for x in self.data_list[self.ptr:]]\n\
    \        rest = self.ptr + batchsize - len(self.data_list)\n        self.__init_list()\n\
    \        batch.extend([load_image(x, self.image_size) for x in self.data_list[:rest]])\n\
    \        self.ptr = rest\n        self.epoch += 1\n    else:\n        batch =\
    \ [load_image(x, self.image_size) for x in self.data_list[self.ptr:self.ptr +\
    \ batchsize]]\n        self.ptr += batchsize\n    return self.epoch, batch\ndef\
    \ get_pics(self, num):\n    \"\"\"\n    取出 num 幅图片，用于快照\n    不会影响队列\n    \"\"\"\
    \n    return np.array([load_image(x, self.image_size) for x in random.sample(self.data_list,\
