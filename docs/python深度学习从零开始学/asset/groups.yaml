    ## IMDB 电影评论情感分析\n\n情感分析是自然语言处理中很重要一个方向，目的是让计算机理解文本中包含的情感信息。情感分析有很多的应用场景，比如做一个电商网站，卖家需要时刻关心用户对于商品的评论是否是正面的。再比如做一个电影的宣传和策划，电影在观众中的口碑也至关重要。互联网上任何一个事件或物品，都有可能产生成千上万的文本评论，如何定义每一个文本的情绪是正面还是负面的，是一件很有挑战的事情。本章将通过\
    \ IMDB（Internet Movie Database，互联网电影资料库）收集的电影评论数据集，分析某部电影是一部受到好评的电影还是一部受到差评的电影，借此研究情感分析问题。\n\
    \n## 9.1 IMDB 电影数据集和影评文字处理介绍\n\nIMDB 是一个与电影相关的在线数据库，它包含了 25000 部电影的评价信息，该数据库是由斯坦福大学的研究院整理的。\n\
    \nIMDB 电影数据集含有 50000 个电影评论，训练数据与测试数据各 25000 项，每一项电影评论都被标记为“正面评价”和“负面评价”两类。我们希望建立一个模型，在经过大量的电影评论文字训练后，这个模型可以用来预测电影评论是正面评价或是负面评价。\n\
    \n因为深度学习模型是无法处理文字的，必须将文字转换成可以计算的数字，所以需要将“电影评论文字”转换成“数字列表”并建立一一对应关系。\n\n比如，提取最常用的前\
    \ 2000 个高频词语建立 token 字典，依照英文单词在所有影评中出现的次数进行排序，排序前 2000 名的英文单词会列入字典中，建立的字典如图 9-1\
    \ 所示。\n\n```\n'the': 1, 'and': 2, 'a': 3, 'of': 4, 'to': 5, 'is': 6, 'in': 7,\
    \ 'it': 8, 'i': 9, 'this': 10, 'that': 11, 'was': 12, 'as': 13, 'for': 14,\n'with':\
    \ 15, 'movie': 16, 'but': 17, 'film': 18, 'on': 19, 'not': 20, 'you': 21, 'are':\
