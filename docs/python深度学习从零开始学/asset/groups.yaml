    # 2.4 Windows 环境下安装 TensorFlow（GPU 版本）和 Keras


    本节主要介绍如何在 Windows 环境下安装 TensorFlow（GPU 版本）和 Keras。


    # 2.4.1 确认显卡是否支持 CUDA


    在深度学习中，我们常常要对图像数据进行处理和计算，而处理器 CPU 因为需要处理的事情太多，并不能满足我们对图像处理和计算的速度的要求，显卡 GPU 就是用来帮助
    CPU 解决这个问题 的，因为 GPU 特别擅长处理图像数据。


    为什么 GPU 特别擅长处理图像数据呢？这是因为图像上的每一个像素点都有被处理的需要，而且每个像素点的处理过程和方式都十分相似，GPU 就是用很多简单的计算单元去完成大量的计算任务，类似于纯粹的人海战术。GPU
    不仅可以在图像处理领域大显身手，它还被用在科学计算、密码破解、数值分析、海量数据处理（排序、Map-Reduce 等）、金融分析等需要大规模并行计算的领域。


    而 CUDA（Compute Unified Device Architecture）是显卡厂商 NVIDIA（英伟达）推出的只能用于自家 GPU 的并行计算框架，只有安装这个框架才能够进行复杂的并行计算。该架构使
    GPU 能够解决复杂的计算问题。它包含了 CUDA 指令集架构（ISA）以及 GPU 内部的并行计算引擎。安装 CUDA 之后，可以加快 GPU 的运算和处理速度，主流的深度学习框架也都是基于
    CUDA 进行 GPU 并行加速的。


    要想安装 CUDA 用于 GPU 并行加速，首先需要确定计算机显卡是否支持 CUDA 的安装，也就是查看计算机里面有没有 NVIDIA 的独立显卡。在 NVIDIA
    官网列表（https://developer.nvidia.com/cuda-gpus）中可以查看显卡型号。


    在桌面上右击，如果能找到 NVIDIA 控制面板，如图 2-18 所示，则说明该计算机有 GPU。


    在 NVIDIA 控制面板上，通过查看系统信息获取支持的 CUDA 版本，类似结果如图 2-19 所示。


