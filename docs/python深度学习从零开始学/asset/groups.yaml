    # 第7章

    数据预处理和模型评估指标


    数据预处理是进行数据分析的第一步，获取干净的数据是得到良好分析效果的前提。如果我们想要自己的模型获得更好的预测，就必须对数据做预处理。模型评估是指对训练好的模型性能进行评估，用于评价模型的好坏。当然使用不同的性能指标对模型进行评估时往往会有不同的结果，也就是说模型的好坏是相对的，不仅取决于算法和数据，还取决于任务需求。因此，选取一个合适的模型评价指标是非常有必要的。


    ![](img/470b883072d48f1f2917a784b39d4327_118_1.png)


    # 7.1 数据预处理的重要性和原则


    不专业的人工智能开发者，往往在获得数据后就直接想使用一个算法模型，当他迫不及待地把数据输入模型，信心满满地运行模型后，结果看到一行一行的红色字体，意味着这些数据无效，这时候心态就崩了。数据科学家把他们的
    50% ~ 80% 的时间花费在收集和准备不规则数据的平凡任务中，然后才能把余下的时间用来探索数据的有用价值。


    在真实数据中，我们拿到的数据可能包含大量的缺失值，可能包含大量的噪音，也可能因为人工录入错误导致有异常点存在，这些都对我们挖掘有效信息造成了一定的困扰，所以我们需要通过一些方法来尽量提高数据的质量。较好的数据经过不同的模型训练后，其预测结果差距不是太大。在人工智能学习中，数据的质量关乎着学习任务的成败，直接影响着预测的结果。


    对于数据的预处理，常用的处理原则和方法如下：


    +   (1) 针对数据缺失的问题，我们虽然可以将存在缺失的行直接删除，但这不是一个好办法，很容易引发问题，因此需要一个更好的解决方案。最常用的方法是，用其所在列的均值来填充缺失。\n(2)
    不属于同一量纲即数据的规格不一样的数据，不能够放在一起比较。\n(3) 对于某些定量数据，其包含的有效信息为区间划分，例如学习成绩，假如只关心“及格”或“不及格”，那么需要将定量的考分转换成“1”和“0”来表示及格和不及格。二值化可以解决这一问题。\n(4)
    大部分人工智能学习算法要求输入的数据必须是数字，不能是字符串，因为大部分算法无法直接处理描述变量，因此需要将描述变量转化为数字型变量。'
