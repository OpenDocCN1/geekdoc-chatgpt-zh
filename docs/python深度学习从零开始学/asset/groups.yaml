    ## 4.2 卷积神经网络


    卷积神经网络（CNN）被广泛用于各个领域，在很多问题上都取得了当前最好的性能。本节主要介绍卷积神经网络的相关知识。


    ### 4.2.1 什么是卷积神经网络


    大约在 20 世纪 60 年代，科学家提出的感受野（Receptive Field），这是卷积神经网络发展历史中的第一件里程碑事件。当时科学家通过对猫的视觉皮层细胞的研究发现，每一个视觉神经元只会处理一小块区域的视觉图像，即感受野。


    深度学习的许多研究成果，离不开对大脑认知原理的研究，尤其是视觉原理的研究。1981 年的诺贝尔医学奖，颁发给了 David Hubel、Torsten Wiesel
    以及 Roger Sperry。前两位的主要贡献是“发现了视觉系统的信息处理”，即可视皮层是分级的。


    人类的视觉原理如下：从原始信号摄入开始（瞳孔摄入像素 Pixels），接着做初步处理（大脑皮层某些细胞发现边缘和方向），然后抽象（大脑判定眼前的物体的形状是圆形的），然后进一步抽象（大脑进一步判定该物体是一只气球）。对于不同的物体，人类视觉也是通过这样逐层分级来进行认知的：最底层特征基本上是类似的，就是各种边缘；越往上，越能提取出此类物体的一些特征（轮子、眼睛、躯干等）；到最上层，不同的高级特征最终组合成相应的图像，从而能够让人类准确地区分不同的物体。


    因此我们可以很自然地想到：可不可以模仿人类大脑的这个特点，构造多层的神经网络，较低层的识别初级的图像特征，若干底层特征组成更上一层特征，最终通过多个层级的组合在顶层做出分类呢？答案是肯定的，这也是卷积神经网络的灵感来源。


    1980 年前后，日本科学家福岛邦彦（Kunihiko Fukushima）在 Hubel 和 Wiesel 工作的基础上，模拟生物视觉系统并提出了一种层级化的多层人工神经网络，即神经认知（Neurocognitron），以处理手写字符识别和其他模式识别任务。神经认知模型在后来也被称为现今卷积神经网络的前身。在福岛邦彦的神经认知模型中，两种最重要的组成单元是
    S 型细胞（S-cells）和 C 型细胞（C-cells），两类细胞交替堆叠在一起构成了神经认知网络。其中，S 型细胞用于抽取局部特征（Local Feature），C
    型细胞则用于抽象和容错，这与现今卷积神经网络中的卷积层（Convolution Layer）和池化层（Pooling Layer）可一一对应。卷积层完成的操作，可以认为是受局部感受野概念的启发，而池化层主要是为了降低数据维度。


    卷积神经网络是一种多层神经网络，擅长处理图像尤其是大图像的相关机器学习问题。卷积神经网络通过一系列方法，成功将数据量庞大的图像识别问题不断降维，最终使其能够被训练。综合起来说，卷积神经网络通过卷积来模拟特征区分，并且通过卷积的权值共享及池化，来降低网络参数的数量级，最后通过传统神经网络完成分类等任务。


    ### 4.2.2 卷积神经网络详解


    典型的卷积神经网络由卷积层、池化层、全连接层组成。其中卷积层与池化层配合，组成多个卷积组，逐层提取特征，最终通过若干个全连接层完成分类，如图 4-19 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_62_0.png)


    图 4-19


    用卷积神经网络识别图片，一般需要如下 4 个步骤：


    - 步骤 01 卷积层初步提取特征。

    - 步骤 02 池化层提取主要特征。

    - 步骤 03 全连接层将各部分特征汇总。

    - 步骤 04 产生分类器，进行预测识别。


    想要详细了解卷积神经网络，需要先理解什么是卷积和池化。这些概念都来源于计算机视觉领域。


    ### 1. 卷积层的作用


    卷积层的作用就是提取图片中每个小部分里具有的特征。前面介绍过，卷积就是一种提取图像特征的方式，特征提取依赖于卷积运算，其中运算过程中用到的矩阵被称为卷积核。卷积核的大小一般小于输入图像的大小，因此卷积提取出的特征会更多地关注局部，这很符合日常我们接触到的图像处理。每个神经元没有必要对全局图像进行感知，只需要对局部图像进行感知，然后在更高层将局部的信息综合起来，就得到了全局的信息。


    假定我们有一个尺寸为 6×6 的图像，每一个像素点里都存储着图像的信息。我们再定义一个卷积核（相当于权重），用来从图像中提取一定的特征。卷积核与数字矩阵对应位相乘再相加，得到卷积层输出结果，如图
    4-20 所示。


    429 = (18×1+54×0+51×1+55×0+121×1+75×0+35×1+24×0+204×1)


    ![](img/470b883072d48f1f2917a784b39d4327_63_0.png)


    图 4-20


    卷积核的取值在没有学习经验的情况下，可由函数随机生成，再逐步训练调整，当所有的像素点都至少被覆盖一次后，就可产生一个卷积层的输出，如图 4-21 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_63_1.png)


    图 4-21


    神经网络模型初始时，并不知道要识别的部分具有哪些特征，而是通过比较不同卷积核的输出，来确定哪一个卷积核最能表现该图片的特征。比如要识别图像中曲线这一特征，卷积核就要对这种曲线有很高的输出值（真实区域数字矩阵与卷积核相乘作用后，输出较大，对其他形状，比如三角形，则输出较低），就说明该卷积核与曲线这一特征的匹配程度高，越能表现该曲线特征。


    此时就可以将这个卷积核保存起来用来识别曲线特征，采用同样的方式能找出识别其他部位（特征）的卷积核。在此过程中，卷积层在训练时通过不断地改变所使用的卷积核，来从中选取出与图片特征最匹配的卷积核，进而在图片识别过程中，利用这些卷积核的输出来确定对应的图片特征。


    一句话概括卷积层，其实就是使用一个或多个卷积核对输入进行卷积操作。卷积层的作用就是通过不断地改变卷积核，来确定能初步表征图片特征的、有用的卷积核是哪些，再得到与相应的卷积核相乘后的输出矩阵。由于卷积操作会导致图像变小（损失图像边缘），所以为了保证卷积后图像大小与原图一致，常用的一种做法是人为地在卷积操作之前对图像边缘进行填充。


    ### 2. 池化层的作用


    池化层的目的是减少输入图像的大小，去除次要特征，保留主要特征。卷积层输出的特征作为池化层的输入，由于卷积核数量众多，导致输入的特征维度很大。为了减少需要训练的参数数量和减少过拟合现象（过拟合时模型会过多地去注重细节特征，而不是共性特征，导致识别准确率下降），可以只保留卷积层输出的特征中有用的特征，而消除其中属于噪声的特征，这样既能减少噪声传送，还能降低特征维度。它的目标是对输入（图片、隐藏层、输出矩阵等）进行下采样（Downsampling），来减小输入的维度，并且包含局部区域的特征。


    首先，常用的池化方法有最大池化（Max Pooling）、最小池化（Min Pooling）和平均池化（Average Pooling）。其次，是池化的区域大小和步长。最大池化输出的是选择区域内数值的最大值，而平均池化输出的是选择区域内数值的平均值。如图
    4-22 所示，最大池化大小为 2×2，步长为 2。这个池化例子，将 4×4 的区域池化成 2×2 的区域，这样使数据的敏感度大大降低，同时也在保留数据信息的基础上降低了数据的计算复杂度。


    ![](img/470b883072d48f1f2917a784b39d4327_64_0.png)


    图 4-22


    ### 3. 平坦层处理


    平坦层（Flatten Layer）是一个非常简单的神经网络层，用来将一个二阶张量（矩阵）或三阶张量展开成一个一阶张量（向量），即用来将输入“压平”，把多维的输入一维化，常常用在从卷积层到全连接层的过渡。


    ### 4. 全连接层处理


    卷积层和池化层的工作就是提取特征，并减少原始图像带来的参数。然而，为了生成最终的输出，我们需要应用全连接层来生成一个分类器。全连接层在整个神经网络模型中相当于“分类器”。全连接层利用这些有用的图像特征进行分类，利用激活函数对汇总的局部特征进行一些非线性变换，得到输出结果。


    检测高级特征之后，网络最后的完全连接层就更是锦上添花了。简单地说，这一层处理输入内容后会输出一个 n 维向量，N 是该程序必须选择的分类数量。例如，我们想得到一个数字分类程序，如果有
    10 个数字，N 就等于 10。这个 n 维向量中的每一个数字都代表某一特定类别的概率。例如，某一数字分类程序的结果向量是 [0, .1, .1, .75,
    0, 0, 0, 0, 0, .05]，则代表该图片有 10% 的概率是 1，10% 的概率是 2，75% 的概率是 3，5% 的概率是 9。完全连接层观察上一层的输出（其表示了更高级特征的激活映射）并确定这些特征与哪一分类最为吻合。例如，程序预测某一图像的内容为狗，那么激活映射中的高数值便会代表一些爪子或四条腿之类的高级特征。同样地，如果程序测定某一图片的内容为鸟，激活映射中的高数值便会代表诸如翅膀或鸟喙之类的高级特征。大体上来说，完全连接层观察高级特征和哪一分类最为吻合和拥有怎样的特征权重，因此当计算出权重与先前层之间的点积后，我们将得到不同分类的正确概率。


    ### 4.2.3 卷积神经网络是如何训练的


    因为卷积核实际上就是如 3×3、5×5 这样的权值矩阵，网络要学习的，或者说要确定下来的，就是这些权值的数值。卷积神经网络不断地前、后向计算学习，更新出合适的权值，也就是一直在更新卷积核。卷积核更新了，学习到的特征也就被更新了（因为卷积核的值变了，与上一层图像的卷积计算的结果也随之变化，得到的新图像也就变了）。对分类问题而言，其目的就是：对图像提取特征，再以合适的特征来判断它所属的类别，你有哪些各自的特征，我就根据这些特征，把你划分到某个类别去。


    卷积神经网络的实质就是更新卷积核参数权值，即一直更新所提取到的图像特征，以得到可以把图像正确分类的最合适的特征。


    卷积神经网络在本质上是一种输入到输出的映射，它能够学习大量的输入与输出之间的映射关系，而不需要输入和输出之间精确的数学表达式，仅仅使用已知的模式对卷积神经网络加以训练，卷积神经网络就具有了输入与输出之间的映射能力。这里权值更新是基于反向传播算法，卷积网络执行的是监督训练，其样本集由形如（输入向量，理想输出向量）的向量对构成。这些向量对都应该来源于网络，即模拟系统的实际“执行”结果，它们能够从实际执行系统中采集。在开始训练前，全部的权值都应该用一些不同的小随机数进行初始化。“小随机数”用来保证网络不会因权值过大而进入饱和状态，从而导致训练失败。“不同”用来保证网络能够正常地学习。


    卷积神经网络的训练过程分为两个阶段。一个阶段是数据由低层次向高层次传播的阶段，即前向传播阶段。另外一个阶段是，当当前向传播得出的结果与预期不相符时，将误差从高层次向低层次进行传播训练的阶段，即反向传播阶段。


    具体的训练过程有如下 5 个步骤：


    - **步骤 01** 网络进行权值的初始化。

    - **步骤 02** 输入数据经过卷积层、下采样层、全连接层的前向传播得到输出值。

    - **步骤 03** 求出网络的输出值与目标值之间的误差。

    - **步骤 04** 当误差大于我们的期望值时，将误差传回网络中，依次求得全连接层、下采样层、卷积层的误差。各层的误差可以理解为对于网络的总误差，网络应承担多少；当误差等于或小于我们的期望值时，结束训练。

    - **步骤 05** 根据求得的误差，按极小化误差的方法调整权值矩阵，进行权值更新，然后再进入到第 2 步。


    ## 4.3 卷积神经网络经典模型架构


    ImageNet 大规模视觉识别挑战赛（ImageNet Large-Scale Visual Recognition Challenge, ILSVRC）成立于
    2010 年，旨在提高大规模目标检测和图像分类的最新技术。ILSVRC 作为最具影响力的竞赛，促进了许多经典的卷积神经网络架构的出现。ILSVRC 使用的数据都来自
    ImageNet，ImageNet 项目于 2007 年由斯坦福大学华人教授李飞飞创办，目标是收集大量带有标注信息的图片数据供计算机视觉模型训练。ImageNet
    拥有 1500 万幅标注过的高清图片，大约有 22 000 类，其中约有 100 幅标注了图片中主要物体的定位边框。


    ILSVRC 比赛使用 ImageNet 数据集的一个子集，大概拥有 120 万幅图片，以及 1000 类的标注。比赛一般采用 top-5 和 top-1
    分类错误率作为模型性能的评测指标。top1 是指概率向量中最大的值作为预测结果，若分类正确，则为正确；top5 只要概率向量中最大值的前五名里有分类正确的，即为正确。


    下面我们来介绍其他几个经典的卷积网络结构，LeNet-5、AlexNet、VGGNet、GoogLeNet 和 ResNet 等。如图 4-23 所示，它们分别获得了
    ILSVRC 比赛分类项目的 2012 年冠军（AlexNet，top-5 错误率为 16.4%，使用额外数据可达到 15.3%，8 层神经网络）、2014
    年亚军（VGGNet，top-5 错误率为 7.3%，19 层神经网络），2014 年冠军（GoogLeNet，top-5 错误率为 6.7%，22 层神经网络）和
    2015 年的冠军（ResNet，top-5 错误率为 3.57%，152 层神经网络）。


    ![](img/470b883072d48f1f2917a784b39d4327_66_0.png)


    图 4-23


    ### 4.3.1 LeNet5


    LeNet5 模型是 1998 年 Yann LeCun 教授在论文 Gradient-based Learning Applied To Document
    Recognition 中提出的，是第一个成功应对手写数字识别问题的卷积神经网络，在那时的技术条件下就能取得低于 1% 的错误率。因此，LeNet5 这一卷积神经网络便在当时效力于全美几乎所有的邮政系统，用来识别手写邮政编码进而分拣邮件和包裹。当年，美国大多数银行也用它来识别支票上面的手写数字，能够达到这种商用的地步，它的准确性可想而知。可以说，LeNet5
    是第一个产生实际商业价值的卷积神经网络，同时也为卷积神经网络以后的发展奠定了坚实的基础。


    LeNet5 这个网络虽然很小，但是它包含了深度学习的基本模块：卷积层、池化层、全连接层，是其他深度学习模型的基础。这里我们对 LeNet5 进行深入分析，同时通过实例分析，加深对卷积层和池化层的理解。如图
    4-24 所示，LeNet5 模型包括卷积层、采样层、卷积层、采样层、全连接层、全连接层、高斯连接层（Gaussian Connections Layer）。（传统上，不将输入层视为网络层次结构之一。）


    ![](img/470b883072d48f1f2917a784b39d4327_66_1.png)


    图 4-24


    LeNet5 共有 7 层，不包含输入层，每层都包含可训练参数，每个层有多个特征图（Feature Map），每个特征图通过一种卷积滤波器提取输入的一种特征，然后每个特征图有多个神经元。将一批数据输入神经网络，经过卷积、激活、池化、全连接和
    softmax 回归等操作，最终返回一个概率数组，从而达到识别图片的目的。LeNet5 各层参数说明如下。


    ### 1. INPUT——输入层


    要求输出的图像尺寸大小为 32×32，首先在数据输入层，输入图像的尺寸统一归一化为 32×32。（本层不算 LeNet5 的网络结构。）


    LeNet5 要处理的是一个多分类问题，总共有十个类，因此神经网络的最后输出层必然是 softmax 问题，然后神经元的个数是 10 个。


    ### 2. C1——卷积层


    - 输入图片尺寸：32×32。

    - 卷积核大小：5×5。

    - 卷积核种类：6。

    - 输出特征图大小：28×28，(32−5+1)=28。

    - 神经元数量：28×28×6。

    - 可训练参数：(5×5+1)×6（每个滤波器有 5×5=25 个 unit 参数和一个 bias 参数，一共 6 个滤波器）。

    - 连接数：(5×5+1)×6×28×28=122304。


    ![](img/470b883072d48f1f2917a784b39d4327_67_0.png)


    输入图片尺寸为 32×32，对输入图像进行第一次卷积运算（使用 6 个大小为 5×5 的卷积核），得到 6 个 C1 特征图（6 个大小为 28×28 的特征图（32−5+1=28），神经元的个数为
    6×28×28=784）。我们再来看看需要多少个参数，卷积核的大小为 5×5，总共就有 6×(5×5+1)=156 个参数，其中 +1 是表示一个核有一个
    bias 偏移参数。对于卷积层 C1，C1 内的每个像素都与输入图像中的 5×5 个像素和 1 个 bias 偏移有连接，所以总共有 156×28×28=122304
    个连接。有 122304 个连接，但是我们只需要学习 156 个参数，这些主要是通过权值共享实现的。


    C1 中每个特征图的每个单元都和输入的 25 个点相连，其中 5×5 的区域被称为感知野。每个特征图的每个单元共享 25 个权值和一个偏置。所谓权值共享就是同一个特征图中神经元权值共享，该特征图中的所有神经元使用同一个权值。因此参数个数与神经元的个数无关，只与卷积核的大小及特征图的个数相关。但是共有多少个连接数就与神经元的个数相关了，神经元的个数也就是特征图的大小。


    ### 3. S2——池化层


    - 输入图片尺寸：28×28。

    - 采样区域：2×2。

    - 采样种类：6。

    - 输出特征图大小：14×14。

