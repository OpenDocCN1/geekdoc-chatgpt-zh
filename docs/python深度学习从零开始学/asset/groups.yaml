    Keras。在安装 TensorFlow 和 Keras 时，需要注意两者版本的对应关系，否则可能会报错。比如，安装的 Keras 版本为 2.4，这个版本要求
    TensorFlow 是 2.2 以上，版本之间不对应是无法使用的。


    下面讲解如何安装 TensorFlow（CPU 版本）和 Keras。


    ### 1. 安装 TensorFlow（CPU 版本）


    具体操作步骤如下：


    步骤 01 首先确保 pip 的版本较新，先在命令提示符窗口输入命令 “python -m pip install -U pip” 升级 pip，如图 2-13
    所示。


