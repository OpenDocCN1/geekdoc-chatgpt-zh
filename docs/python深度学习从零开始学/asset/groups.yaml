  - '[PAGE 215]


    在训练过程中，D 会接收真数据和 G 产生的假数据，它的任务是判断图片属于真数据还是假数据。对于最后输出的结果，可以同时对两方的参数进行调优。如果 D 判断正确，那就需要调整
    G 的参数，从而使得生成的假数据更为逼真，如果 D 判断错误，则需要调节 D 的参数，避免下次类似判断出错。训练会一直持续到两者进入到一个均衡和谐的状态。


    训练后的产物是一个质量较高的自动生成器和一个判断能力较强的分类器。前者可以用于机器创作（比如自动画出“猫”“狗”），而后者则可以用来进行机器分类（比如自动判断“猫”“狗”）。


    那么一个很自然的问题来了，如何训练这样一个生成对抗网络模型？其步骤如下：


    +   步骤 01 在噪声数据分布中随机采样，输入生成模型，得到一组假数据，记为 D(z)。

    +   步骤 02 在真实数据分布中随机采样，作为真实数据，记做 x；将前两步中某一步产生的数据作为判别网络的输入（因此判别模型的输入为两类数据：真或假），判别网络的输出值为该输入属于真实数据的概率，real
    为 1，fake 为 0。

    +   步骤 03 然后根据得到的概率值计算损失函数。

    +   步骤 04 根据判别模型和生成模型的损失函数，可以利用反向传播算法更新模型的参数。（先更新判别模型的参数，然后通过再采样得到的噪声数据来更新生成器的参数。）


    生成模型与对抗模型是完全独立的两个模型，它们之间没有什么联系，训练采用的大原则是单独交替迭代训练。


    GAN 的强大之处在于能自动学习原始真实样本集的数据分布，不管这个分布有多么的复杂，只要训练得足够好就可以得到结果。传统的机器学习方法一般会先定义一个模型，再让数据去学习。而
    GAN 的生成模型最后可以通过噪声生成一个完整的真实数据（比如人脸），说明生成模型掌握了从随机噪声到人脸数据的分布规律。GAN 一开始并不知道这个规律是什么样，也就是说
    GAN 是通过一次次训练后学习到的真实样本集的数据分布。


    GAN 的核心原理如何用数学语言来描述呢？这里直接摘录 Ian Goodfellow 的论文 Generative Adversarial Nets 中的公式，如图
    13-3 所示。


    ```

    min_G max_D V(D,G) = E_{x~Pdata(x)}[log D(x)] + E_{z~pz(z)}[log(1 - D(G(z)))]

    ```


    图 13-3


    简单分析一下这个公式：


    +   • 整个公式由两项构成。x 表示真实图片，z 表示输入 G 网络的噪声，而 G(z) 表示 G 网络生成的图片。

    +   • D(x) 表示 D 网络判断真实图片是否真实的概率（因为 x 就是真实的，所以对于 D 来说，这个值越接近 1 越好）。而 D(G(z)) 是
    D 网络判断 G 生成的图片是否真实的概率。

    +   • G 的目的：上面提到过，D(G(z)) 是 D 网络判断 G 生成的图片是否真实的概率，G 应该希望自己生成的图片“越接近真实越好”。也就是说，G
    希望 D(G(z)) 尽可能的大，这时 V(D, G) 会变小。因此我们看到公式最前面的记号是 min_G。'
