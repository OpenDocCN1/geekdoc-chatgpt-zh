    由于电影评论文字的字数都不固定，同时为了保持所用电影评论的“数字列表”的长度都是统一的（放入模型中的参数必须规格统一），因此我们采取截长补短法，短的在前面填0，长
    的截取后面的元素。


    我们还必须将“数字列表”转化为“向量列表”，因为数字列表无法显示出各个词语之间的相互联系，转化为向量之后便能够建立起各个词语之间的联系，相似度近的便靠得更近。这里需要用到自然语言处理技术——词嵌入。词嵌入是一种将词向量化的概念，原理是单词在高维空间中被编码为实值向量，词语之间的相似性意味着空间中的接近度。


    之所以希望每个单词都变成一个向量，目的还是为了方便计算。比如“猫”“狗”“爱情”三个词，对于我们人类而言，可以清楚地知道“猫”和“狗”表示的都是动物，而“爱情”表示的是一种情感，但是对于机器而言，这三个词都是用0和1表示的二进制的字符串而已，无法对其进行计算。而通过词嵌入这种方式将单词转变为词向量，机器便可对单词进行计算，通过计算不同词向量之间夹角的余弦值，从而得出单词之间的相似性。例如将“猫”“狗”“爱情”映射到向量空间中，“猫”对应的向量为(0.1
    0.2 0.3)，“狗”对应的向量为(0.2 0.2 0.4)，“爱情”对应的向量为(-0.4 -0.5 -0.2)（本数据仅为示意），这三个单词的相似性如图9-2所示。


    ![](img/470b883072d48f1f2917a784b39d4327_159_0.png)


    图 9-2


    Keras 通过嵌入层（Embedding Layer）将“数字列表”转换为“向量列表”后，就可以将“向量列表”送入深度学习模型进行训练。


    处理步骤如下：


    +   - 步骤01 读取 IMDB 数据集。

    +   - 步骤02 建立 token 字典。

    +   - 步骤03 使用 token 字典将“影评文字”转化为“数字列表”。

    +   - 步骤04 截长补短让所有“数字列表”长度都是100。

    +   - 步骤05 嵌入层将“数字列表”转化为“向量列表”。

    +   - 步骤06 将向量列表送入深度学习模型（多层感知器、卷积神经网络等）进行训练。


    以下程序代码 imdb_data_preprocessing.py 可作参考，代码作用是下载 IMDB 数据集，读取并进行数据预处理。


    ```

    #####################imdb_data_preprocessing.py#####################

