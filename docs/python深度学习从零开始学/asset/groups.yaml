    # 8.4.2 建立模型


    我们基于 Keras 深度学习框架创建卷积神经网络模型来识别猫和狗。在以前 MNIST 手写数字识别示例中，我们创建了一个小型卷积神经网络，现在将复用相同的总体结构，即卷积神经网络由卷积层（使用
    ReLU 激活函数）和最大池化层交替堆叠构成。


    但由于这里要处理的是更大的图像和更复杂的问题，因此需要相应地增大网络，即再增加一个卷积层 + 卷积层最大池化层的组合。这样既可以增大网络容量，也可以进一步减小特征图的尺寸，使其在连接平坦层时尺寸不会太大。本例中初始输入的尺寸为
    150×150，最后在平坦层之前的特征图大小为 7×7。


    通过 Sequential 对象创建卷积神经网络模型的程序代码如图 8-47 所示。'
