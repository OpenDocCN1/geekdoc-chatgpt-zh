    ## 人工智能、机器学习与深度学习简介


    ![](img/470b883072d48f1f2917a784b39d4327_11_0.png)


    近些年来，业界许多的图像识别技术与语音识别技术的进步都源于深度学习（Deep Learning, DL）的发展。深度学习的发展极大地提升了机器学习（Machine
    Learning, ML）在人工智能（Artificial Intelligence, AI）领域中的核心地位，进而再次掀起了人工智能理论研究和产品研发的浪潮。深度学习摧枯拉朽般地实现了各种任务，使得几乎所有的机器辅助功能都变为可能，如无人驾驶汽车、预防性医疗保健、商业智能等，都可以实现。甚至夸张到有人认为“AI
    无所不能，马上就要改变世界、取代人类”，这种夸张的领域，基本都跟深度学习有关。


    ![](img/470b883072d48f1f2917a784b39d4327_11_1.png)


    ### 1.1 什么是人工智能


    首先，我们来界定一下接下来所要讨论的人工智能（AI）的定义和范畴。


    AI 是 Artificial Intelligence 的缩写，中文是大家熟知的“人工智能”。它可以理解为使机器具备类似人类的智能，从而代替人类去完成某些工作和任务。


    读者对 AI 的认知可能来自于《西部世界》《超能陆战队》《机器人总动员》等影视作品，这些作品中的 AI 都可以定义为“强人工智能”，因为它们能够像人类一样去思考和推理，且具备知觉和自我意识。这就是所谓的强人工智能，即指具有完全人类思考能力和情感的人工智能。“弱人工智能”是指不具备完全智慧但能完成某一特定任务的人工智能。这样的弱人工智能系统，能够在特定的任务上、在已有的数据集上进行学习，同时能够在今后没见过的场景预测上获得比较好的结果。这种“弱人工智能”就在我们身边，早已服务在大家生活的方方面面了，已经开始为社会创造价值。比如语音助手，它集成在智能手机、智能音箱、轿车里，甚至是我们的智能手表中。最常见的一种应用场景是，我们说“Hi
    Siri, 帮我查查明天上海的天气”，语音助手立即响应我们的要求，告知我们天气情况。这里面涉及了机器如何听懂、理解人类的意图，然后在互联网上找到合适的数据，再回复给我们。


    还有一个常见的应用场景是，机器人电话客服，相信大家平时都接到过一些推销电话（甚至是骚扰电话），电话那端和人类的声音是完全一样的，甚至能够对答如流，但是我们有没有想过，和我们进行交流的其实只是一台机器呢？


    这个其实是最接近大家普遍认知的人工智能，无奈要让机器完全理解人类的自然语言还是“路漫漫其修远兮”，特别是人类隐藏在语言里面的情感、隐喻，机器要理解起来依然是困难重重。所以，自然语言处理（NLP）一直被视为是人类征服人工智能的一座高峰。在网上可以搜索到很多关于自然语言处理的相关内容，有兴趣的读者可以进一步去查阅和了解。


    相比于理解自然语言，计算机视觉的发展就顺利得多，它教计算机能“看懂”一些人类交给它们的事物。比如在停车场出入口处汽车牌照的识别，以前得雇一个专职人员天天守在出入口处登记车牌号、计算停车费、缴费后放行等，现在几乎是一个摄像头即可搞定所有的事情。


    在购物的应用场景中，如 Amazon 的无人超市，能够通过人脸识别知道顾客是不是来过、以前有没有在这家超市购物过，从而给顾客推荐他们心仪的商品，使顾客获得更好的购物体验。


    除了身边这些“有形”的能看能听的人工智能产品或服务，那些帮助人类做决策、做预测的人工智能系统也是人工智能技术的强项。


    比如刷抖音的时候，后端服务器会学习用户的喜好，推荐越来越符合用户胃口的视频。


    再比如说专业性更高的医疗行业，你有没有想过，自己学医八年，从 20 到 28 岁，呕心沥血孜孜以求，到头来仍然有可能被新技术所取代。笔者的一个朋友的儿子是医疗影像专业的，在一家医院工作，有一次一起交流的时候发现他对自己的前景充满了担忧：他说一个影像科的医生，从学习到出师，需要花费十余年的时间；这些
    X 光片或者 CT、核磁共振的片子及其诊断结果，如果让人工智能诊疗系统来进行判断，可能只需要几秒钟就能完成，而且机器诊断的准确率还会明显地高于人类医生，同时成本也更低。


    对于家庭生活场景中的应用，在每年的 CES（国际消费类电子产品展览会）中我们都会看到全球智能家居厂商发布的硬核产品。2019 年科沃斯发布了第一款基于视觉识别技术的扫地机器人
    DG70，它可以识别家里的鞋子、袜子、垃圾桶、充电线，当然除了用到视觉识别系统之外，还需要机身上各种各样的传感器信息的融合处理，才能在清扫复杂家居环境时实现合理避障。


    ### 1.2 人工智能的本质


    先举一个简单的例子，如果我们需要让机器具备识别“狗”的智能：第一种方式是我们需要将狗的特征（毛茸茸、四条腿、有尾巴……）告诉机器，机器将满足这些规则的东西识别为狗；第二种方式是我们完全不告诉机器狗有什么特征，但我们给机器提供
    10 万幅狗的图片，机器自个儿从已有的图片中学习到狗的特征，从而具备识别狗的智能。


    其实，AI 在实现时其本质上都是一个函数。我们给机器提供目前已有的数据，机器从这些数据里找出一个最能拟合（即最能满足）这些数据的函数，当有新的数据需要预测时，机器就可以通过这个函数去预测出这个新数据对应的结果是什么。


    对于一个具备某种 AI 的模型而言，它有以下要素：“数据”+“算法”+“模型”，理解了这三个词及其之间的关联，AI 的本质也就容易搞清楚了。


    我们用一个能够区分猫和狗图片的分类器模型来辅助理解一下这三个词：


    “数据”就是我们需要准备的大量标注过是“猫”还是“狗”的图片。为什么要强调大量？因为只有数据量足够大，模型才能学习到足够多且准确区分猫和狗的特征，才能在区分猫狗这个任务上表现出足够的准确性。当然，在数据量不大的情况下，我们也可以训练模型，不过在新数据集上预测出来的结果往往就会差很多。


    “算法”指的是构建模型时我们打算用浅层的网络还是深层的网络，如果是深层的话，我们要用多少层，每层有多少神经元、功能是什么，等等，也就在深度学习的网络架构中确定预测函数应该采用什么样的网络结构及其层数。


    我们用 Y=f(W, X, b) 来表示这一函数，X 是已有的用来训练的数据（猫和狗的图片），Y 是已有的图片数据的标签（标注该图片是猫还是狗）。那么该函数中的
    W 和 b 是什么呢？就是函数中的 W（权重）和 b（偏置），这两个参数需要机器学习后“自己”找出来，找的过程也就是模型训练的过程。


    “模型”指的是我们把数据带入到算法中进行训练（train），机器会不断地学习，当机器找到最优 W 和 b 后，我们就说这个模型训练好了，于是函数 Y=f(W,
    X, b) 就完全确定下来了。然后，我们就可以在已有的数据集外给模型一幅新的猫或狗的图片，模型就能通过函数 Y=f(W, X, b) 算出来这幅图究竟是猫还是狗，这也就是该模型的预测功能。


    简单总结一下：不管是最简单的线性回归模型、还是较复杂的拥有几十个甚至上百个隐藏层的深度神经网络模型，其本质都是寻找一个能够良好地拟合目前已有数据的函数 Y=f(W,
    X, b)，并且我们希望这个函数在新的未知数据上也能够表现良好。


    上面提到的科沃斯发布的 DG70 扫地机器人，只给它一只“眼睛”和有限个传感器，但却要求它可以识别日常家居物品：比如前面遇到的障碍物是拖鞋还是很重的家具脚，可不可以推过去？如果遇到了衣服、抹布这种奇形怪状的软布，扫地机器人还需要准确识别出来以避免被缠绕。


    让扫地机器人完成图像识别大致需经过以下几个步骤：


    （1）定义问题：根据扫地机器人的使用场景，需要识别家居场景中可能遇到的所有障碍物：家具、桌脚、抹布、拖鞋，等等。有了这些类别的定义，我们才可以训练一个多分类模型，针对扫地机器人眼前看到的物体进行分类，并且采取相应的规避动作。由于机器智能无法像人类一样去学习，去自我进化，去举一反三，因此当前阶段的机器智能，永远只能忠实地执行人类交给它的任务。


    （2）收集数据与训练模型：接下来去收集数据并标注数据。现在的深度神经网络动不动就是几百万个参数，具有非常强大的表达能力，因此需要大量标注的数据。在收集了有关图片之后，还需要人工标注员一个一个地去判断这些图片属于上面已定义类别中的哪一类。因为标注需要人工来完成，所以这项工作的成本非常高，一个任务一年可能要花费上千万元。有了高质量的标注数据，才有可能有效驱动深度神经网络去“学习”真实的世界。


    （3）这么复杂的人工智能运算在这个具体案例上是在扫地机器人上运行的。一方面是要保护用户的隐私，不能将用户数据上传到云端；另一方面，扫地是一个动态过程，很多运算对时效性要求非常高，稍有延迟扫地机器人就可能撞到墙壁了。


    如上所述，就连简单的“识别拖鞋”都需要经过上面这么复杂的过程。所以，扫地机器人虽小，但其中涉及的技术堪比自动驾驶汽车涉及的技术。对于自动驾驶汽车来说，其信号收集的过程跟上面扫地机器人差不多。不过为了保证信号的精确程度，自动驾驶汽车除了图像视觉信号之外，车身会配备更多的传感器，用于精确感知周围的环境。


    ### 1.3 人工智能相关专业人才的就业前景


    ### 1. 国家鼓励发展新一代人工智能


    2017年7月，国务院下发《新一代人工智能发展规划》，确立了未来我国人工智能发展的目标和方向，战略目标分三步走：


    第一步，到2020年人工智能总体技术和应用与世界先进水平同步，人工智能产业成为新的重要经济增长点，人工智能技术应用成为改善民生的新途径，有力支撑进入创新型国家行列和实现全面建成小康社会的奋斗目标。


    第二步，到2025年人工智能基础理论实现重大突破，部分技术与应用达到世界领先水平，人工智能成为带动我国产业升级和经济转型的主要动力，智能社会建设取得积极进展。


    第三步，到2030年人工智能理论、技术与应用总体达到世界领先水平，成为世界主要人工智能创新中心，智能经济、智能社会取得明显成效，为跻身创新型国家前列和经济强国奠定重要基础。


    ### 2. 人工智能产业飞速发展引发巨量人才需求


    近年来，随着人工智能的飞速发展，人类的生产效率和生活品质都得到大幅提升，各路资本、巨头和创业公司纷纷涌入相关领域，苹果、谷歌、微软、亚马逊和脸书等五大巨头都投入了大量资源抢占人工智能市场，甚至将自己整体转型为人工智能驱动型公司。据麦肯锡统计，全球范围内，科技巨头在AI上的相关投入已经达到200~300亿美元，其中90%用于技术研发和部署，10%用于收购。此外，面向初创公司的VC和PE投资也快速增长，总计60~90亿美元，三年间的外部投资年增长率接近40%。国内互联网领军者“BAT”（即百度、阿里、腾讯）也将人工智能作为重点战略，凭借自身优势，积极布局人工智能领域，尤其是计算机视觉、服务机器人、语音及自然语言处理、智能医疗、机器学习、智能驾驶，等等。截至目前，阿里巴巴、腾讯、百度、华为、微软、亚马逊等国内外知名科技企业均已在上海设立了人工智能科研机构。


    在此背景下，相关人才的需求量日益增加，尤其是北京、上海、广东、江苏、浙江等地区需求量尤为庞大。北京以领先全国其他地区的政策环境、人才储备、产业基础、资本支持等成为人工智能创业的首要阵地；上海、江苏、浙江均有良好的经济基础和科技实力，人工智能应用实力雄厚，也聚集了一批人工智能垂直产业园；浙江计划用5年时间引进10万名人工智能人才，还将建立全球人工智能人才数据库。广东互联网产业发达，企业对数据需求强烈，依靠大数据产业链有效推动了人工智能产业的蓬勃发展。


    据工信部调研统计，中国人工智能产业发展与人才需求比为1:10，预计到2030年，人工智能核心产业规模将达到1万亿，相关产业规模达到10万亿，人工智能人才缺口达到500万，需求量最多的是工程应用型人才，其次是技术应用和科技转化中端人才，最后是前沿理论高端研究人才。可以预见，未来5~10年随着各类公司对人工智能布局的推广和深入，核心技术和人才的争夺将会越来越激烈。


    ### 3. 国内人工智能专业人才供不应求


    据教育部公布的信息显示，截至2018年年底，全国已经开设人工智能相关专业的院校数量为：智能科学与技术专业155所，人工智能专业38所，机器人工程专业194所。经过调研显示，普遍存在着缺乏实验环境、缺乏实验项目、缺乏课程教师、缺乏配套教材、缺乏测评体系等方面的困难，人才培养的速度总体缓慢，规模总体较小，远远不能满足相关产业的人才需求。


    ### 4. 国家鼓励加强人工智能人才培养


    2018年4月，教育部印发《高等学校人工智能创新行动计划》，从科研、教学、成果转化三个方面给高等教育体系下达“任务”：


    - 到2020年，基本完成适应新一代人工智能发展的高校科技创新体系和学科体系的优化布局。

    - 到2025年，取得一批具有国际重要影响的原创成果，部分理论研究、创新技术与应用示范达到世界领先水平。

    - 到2030年，高校成为建设世界主要人工智能创新中心的核心力量和引领新一代人工智能发展的人才高地。


    综上所述，当前国家正积极鼓励和引导发展新一代人工智能，国内人工智能产业得到了飞速发展，由此引发巨量人才需求。然而，由于现有人才存量不多，相关院校人才培养速度总体缓慢，相关人才供不应求，迫切需要加大力度培养人工智能专业人才。因此，可以预见，在未来5~10年内，人工智能专业人才就业前景十分乐观。


    以上内容的目的是为了让大家看清人工智能行业目前的发展情况，一个日益增长且正面临全面商业化的行业，需要的人只会越来越多，而不是越来越少。传统行业的智能化已经启动，企业在AI时代构建新的竞争优势的核心在于人工智能以及人才的有效供给。目前我国高等教育对人工智能人才的培养处于较为滞后的状态，高校对人才的培养很难满足企业需求。一些掌握人工智能前沿技术的企业开始寻找新的的人才培养模式，未来将有更多的符合岗位需求的人才进入市场。


    ### 1.4 机器学习和深度学习


    ### 1.4.1 什么是机器学习


    要说明什么是深度学习，首先要知道机器学习、神经网络、深度学习之间的关系。


    ## Python深度学习从零开始学


    众所周知，机器学习是一种利用数据训练出模型，然后使用模型预测的技术。与传统的为解决特定任务、通过编码实现的软件程序不同，机器学习使用大量的数据来“训练”，通过各种算法从数据中学习如何完成任务。


    机器学习是人工智能的子领域，机器学习理论主要是研究、分析和设计一些让计算机可以自动学习的算法。


    举例来说，假设要构建一个识别猫的程序。按照以往的方式，如果我们想让计算机进行识别，需要输入一串指令，例如猫长着毛茸茸的毛、顶着一对三角形的耳朵等，然后计算机根据这些指令执行下去。但是，如果我们对程序展示一只老虎的照片，程序应该如何反应呢？更何况通过传统方式制定全部所需的规则，在此过程中必然会涉及一些困难的概念，比如对毛茸茸的定义。因此，更好的方式是让机器自学。我们可以为机器提供大量猫的照片，机器系统将以自己特有方式查看这些照片。随着实验的反复进行，系统会不断学习更新，最终能够准确地判断出哪些是猫，哪些不是猫。


    在这种机器自学的方式中，我们不给机器规则，取而代之的是，我们给机器提供大量的针对某一任务的数据，让机器自己去学习，去挖掘出规律，从而具备完成某一任务的智能。因此，机器学习就是通过算法，使用大量数据进行训练，训练完成后会产生模型，训练好的模型就用于新数据结果的预测。


    机器学习的常用方法主要分为监督式学习（Supervised Learning）和无监督式学习（Unsupervised Learning）。


    ### 1. 监督式学习


    监督式学习需要使用有输入和预期输出标记的数据集。比如，如果指定的任务是使用一种图像分类算法对男孩和女孩的图像进行分类，那么男孩的图像需要带有“男孩”标签，女孩的图像需要带有“女孩”标签。这些数据被认为是一个“训练”数据集，通过已有训练数据集（即已知数据及其对应的输出）去训练，从而得到一个最优模型，这个模型就具有了对未知数据进行分类的能力。它之所以被称为监督式学习，是因为算法在使用训练数据集进行学习的过程中就像是有位老师正在监督。在我们预先知道正确的分类答案的情况下，算法对训练数据不断进行迭代预测，其预测结果由“老师”不断进行修正。当算法达到可接受的性能水平时，学习过程才会停止。


    在人对事物的认识中，我们从孩童开始就被大人們教授这是鸟、那是猪、那是房子，等等。我们所见到的景物就是输入数据，而大人們对这些景物的判断结果（是房子还是鸟）就是相应的输出。当我们见识多了以后，脑子里就慢慢地得到了一些泛化的模型，这就是训练得到的那个（或者那些）函数，之后不需要大人在旁边指点，孩子也能分辨出来哪些是房子，哪些是鸟。


    ### 2. 无监督式学习


    无监督式学习（也被称为非监督式学习）是另一种机器学习方法，它与监督式学习的不同之处在于事先没有任何训练样本，而需要直接对数据进行建模。这听起来似乎有点不可思议，但是在我们自身认识世界的过程中，很多地方都用到了无监督式学习。比如，我们去参观一个画展，就算是之前对艺术一无所知，但是在欣赏完多幅作品之后，我们也能把它们分成不同的派别（比如哪些更朦胧一点，哪些更写实一些，即使我们不知道什么叫朦胧派，什么叫写实派，但是至少我们能把它们分为两类）。


    ### 1.4.2 深度学习独领风骚


    机器学习有很多经典算法，其中有一个是“神经网络”（Neural Network，NN）算法。神经网络最初是一个生物学的概念，一般是指由大脑神经元、触点、细胞等组成的网络，用于产生意识，帮助生物思考和行动，后来人工智能受神经网络的启发，发展出了人工神经网络（Artificial
    Neural Network，ANN）。“人工神经网络”是指由计算机模拟的“神经元”（Neuron）一层一层组成的系统。这些“神经元”与人类大脑中的神经元相似，通过加权连接相互影响，并通过改变连接上的权重来改变神经网络执行的计算。


    最初的神经网络是感知器（Perceptron）模型，可以认为是单层神经网络，但由于感知器算法无法处理多分类问题和线性不可分问题，当时计算能力也落后，因而对神经网络的研究沉寂了一段时间。2006
    年，Geoffrey Hinton 在《科学》（Science）学术期刊上发表了一篇文章，不仅解决了神经网络在计算上的难度，同时也说明了深度神经网络（Deep
    Neural Network，DNN）在学习上的优异性。深度神经网络的“深度”指的是这个神经网络的复杂度，神经网络的层数越多就越复杂，它所具备的学习能力也就越强。此后神经网络重新成为机器学习中主流的学习技术，基于深度神经网络的机器学习则被称为深度学习。


    如图 1-1 所示，神经网络与深度神经网络的区别在于隐藏层级。神经网络一般有输入层→隐藏层→输出层，一般来说隐藏层大于 2 的神经网络就叫做深度神经网络。深度学习的实质就是通过构建具有很多隐藏层的机器学习模型和海量的训练数据，来学习更有用的特征，从而最终提升分类或预测的准确性。


    ![](img/470b883072d48f1f2917a784b39d4327_17_0.png)


    图 1-1


    有“计算机界诺贝尔奖”之称的 ACM A.M. 图灵奖（ACM A.M. Turing Award）公布 2018 年的获奖者是引起这次人工智能革命的三位深度学习之父——蒙特利尔大学教授
    Yoshua Bengio、多伦多大学名誉教授 Geoffrey Hinton、纽约大学教授 Yann LeCun，他们使深度神经网络成为人工智能的关键技术。ACM
    这样介绍他们三人的成就：Hinton、LeCun 和 Bengio 三人为深度神经网络这一领域建立起了概念基础，通过实验揭示了神奇的现象，还贡献了足以展示深度神经网络实际进步的工程进展。

