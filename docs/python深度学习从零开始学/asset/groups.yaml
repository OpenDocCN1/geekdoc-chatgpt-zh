    TensorFlow 游乐场所展示的是一个全连接神经网络，同一层的节点不会相互连接，而且每一层只和下一层连接，直到最后一层输出层得到输出结果。


    在 TensorFlow 游乐场中，每一个小格子代表神经网络中的一个节点，每一个节点上的颜色代表这个节点的区分平面，区分平面上的一个点的坐标代表一种取值，而点的颜色就对应其输出值，输出值的绝对值越大，颜色也就越深：黄色（颜色参看网站）越深表示负得越大，蓝色（颜色参看网站）越深表示正得越大。


    类似地，TensorFlow 游乐场中的每一条边代表了神经网络中的一个参数，它可以是任意实数，颜色越深，表示参数值的绝对值越大：黄色越深表示负得越大，蓝色越深表示正得越大；当边的颜色接近白色时，参数取值接近于
    0。


    TensorFlow 游乐场简洁明了地展示了使用神经网络解决分类问题的 4 个步骤：


    - 步骤 01 提取问题中实体的特征向量。

    - 步骤 02 定义神经网络的结构，定义如何从神经网络的输入到输出，设置隐藏层数和节点个数（前向传播）、激活函数等。

    - 步骤 03 通过训练数据来调整神经网络中参数的取值，也就是训练神经网络的过程（反向传播），利用反向传播算法不断优化权重的，使之达到最合理水平。

    - 步骤 04 使用训练好的神经网络来预测未知数据，这里训练好的网络就是其权重达到最优的情况。


