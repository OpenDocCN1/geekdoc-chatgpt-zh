    # 6.4 Keras 创建神经网络进行泰坦尼克号生还预测


    本节用泰坦尼克号生还预测这样一个实际案例来介绍如何用 Keras 创建神经网络。


    # 6.4.1 案例项目背景和数据集介绍


    泰坦尼克号的沉没是当时人类和平时期航海史上最大的灾难之一。1912 年 4 月 15 日，在其首次航行期间，泰坦尼克号撞上冰山后沉没，2224 名乘客和机组人员中有
    1502 人遇难。这场悲剧举世震惊，并促使各国制定出更好的船舶安全条例。海难导致生命损失的原因之一是没有足够的救生艇给乘客和机组人员。虽然幸存下来有一些运气的因素，但一些人比其他人更有可能获得生存机会，比如妇女、儿童和上层阶级。在本案例中，我们要完成对哪些人可能生存的分析，特别是要运用机器学习的工具来预测哪些乘客能幸免于难。


    图 6-3 所示为本案例提供的训练数据集，主要包含 11 个字段，分别是：


    +   • pclass: 表示乘客所持票类（代表舱位等级），有三种值（1、2、3）。

    +   • survived: 表示是否存活，0 代表死亡，1 代表存活。

    +   • name: 表示乘客姓名。

    +   • sex: 表示乘客性别。

    +   • age: 表示乘客年龄（有缺失）。

    +   • sibsp: 表示乘客兄弟姐妹 / 配偶的个数（整数值）。

