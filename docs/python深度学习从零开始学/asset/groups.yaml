    \ [0.0262666]\n20 weight: [0.36481026] bias: [0.06564883]\n30 weight: [0.33019403]\
    \ bias: [0.08399636]\n40 weight: [0.31406692] bias: [0.09254415]\n50 weight: [0.30655354]\
