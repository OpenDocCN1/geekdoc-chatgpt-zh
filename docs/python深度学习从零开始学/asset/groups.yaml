    # 9.4.1 LSTM 模型介绍


    RNN 模型有个长时依赖问题，长时依赖问题指的是当预测点与依赖的相关信息距离比较远的时候，就难以学到该相关信息。对于 RNN 模型，我们可以看到，每一时刻的隐藏状态都不仅由该时刻的输入决定，还取决于上一时刻的隐藏层的值。如果一个句子很长，到句子末尾时，RNN
    模型将记不住这个句子的开头的详细内容。例如句子“我家住在福州……” ，中间还有很多句子，若要在末尾预测“我在某个城市上班”，已经忘记之前写的内容，就无法理解我是在哪一个城市上班。


    长短期记忆网络的思路比较简单：既然原始 RNN 的隐藏层只有一个状态，即 h，它对于短期的输入非常敏感，那么我们就再增加一个状态，即 c，让它来保存长期的状态，如图
    9-14 所示。


    新增加的状态 c，称为单元状态（Cell State）。我们把图 9-14 按照时间维度展开，结果如图 9-15 所示。可以看出，在 t 时刻，LSTM 的输入有三个：当前时刻网络的输入值
    x_t、上一时刻 LSTM 的输出值 h_{t-1}，以及上一时刻的单元状态 c_{t-1}。LSTM 的输出有两个：当前时刻 LSTM 的输出值 h_t
    和当前时刻的单元状态 c_t。


    ![](img/470b883072d48f1f2917a784b39d4327_170_0.png)


    ![](img/470b883072d48f1f2917a784b39d4327_170_1.png)


    LSTM 的关键就是怎样控制长期状态 c。对此，LSTM 的思路是使用三个控制开关：第一个开关，负责控制继续保存长期状态 c；第二个开关，负责控制把即时状态输入到长期状态
    c；第三个开关，负责控制是否把长期状态 c 作为当前的 LSTM 的输出。三个开关的作用如图 9-16 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_170_2.png)'
  - "[PAGE 171]\n\n这些开关用门（gate）来实现，在现实生活中，门就是用来控制进出的，关上门，我们就进不去房子，打开门我们就能进去。同理，LSTM\
    \ 的门用来控制每一时刻信息的记忆与遗忘。门实际上就是一层全连接层，输入是一个向量，输出是一个 0 到 1 之间的实数向量。门如何进行控制？方法是 用门的输出向量按元素乘以我们需要控制的那个向量，其原理是：门的输出是\
    \ 0 到 1 之间的实数向量，当门输出为 0 时，任何向量与之相乘都会得到 0 向量，这就相当于什么都不能通过；输出为 1 时，任何向量与之相乘都不会有任何改变，这就相当于什么都可以通过。\n\
    \n# 9.4.2 使用 LTSM 模型进行影评情感分析\n\n完整的程序代码参考范例 keras_imdb_lstm.ipynb，这里摘出使用 LTSM\
    \ 模型的代码，其他代码如下载 IMDB 数据集、数据预处理等都与之前的模型相同。\n\n```\nfrom keras.models import Sequential\n\
