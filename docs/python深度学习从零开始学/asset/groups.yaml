    ## 4.3.5 ResNet


    深度残差网络（Deep Residual Network，ResNet）的提出是卷积神经网络史上的一件里程碑事件。ResNet 在 ILSVRC 和 COCO
    2015 上取得了很好的战绩，取得了 5 项第一，并又一次刷新了卷积神经网络模型在 ImageNet 上的历史，如图 4-29 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_73_0.png)


    图 4-29


    那么 ResNet 为什么会有如此优异的表现呢？其实 ResNet 解决了深度卷积神经网络模型难训练的问题，ResNet 多达 152 层，和 VGGNet
    在网络深度上完全不是一个量级，所以如果是第一眼看这个图的话，肯定会觉得 ResNet 是靠深度取胜。事实当然也是如此，但是 ResNet 还有架构上的技巧，这才使得网络的深度发挥出作用，这个技巧就是残差学习（Residual
    Learning）。


    从经验来看，网络的深度对模型的性能至关重要，当增加网络层数后，网络可以进行更加复杂的特征模式的提取，所以当模型更深时理论上可以取得更好的结果。但是更深的网络其性能一定会更好吗？实验发现深度网络出现了退化问题（Degradation
    problem），即网络深度增加时，网络准确度出现饱和，甚至出现下降。


    如图 4-30 所示，深层网络表象竟然还不如浅层网络的好，越深的网络越难以训练，56 层的网络比 20 层网络效果还要差。这不会是过拟合问题，因为 56 层网络的训练误差同样很高。我们知道深层网络存在着梯度消失或者爆炸的问题，这使得深度学习模型很难训练。


    ![](img/470b883072d48f1f2917a784b39d4327_73_1.png)


    图 4-30


    当网络退化时，浅层网络能够得到比深层网络更好的训练效果，这时如果我们把低层的特征传递到高层，那么效果应该至少不比浅层的网络效果差，或者说如果一个 VGG100
    网络在第 98 层使用的是和 VGG16 第 14 层一模一样的特征，那么 VGG100 的效果应该会和 VGG16 的效果相同。但是实验结果表明，VGG100
    网络的训练和测试误差比 VGG16 网络的更大。我们不得不承认是目前的训练方法有问题，才使得深层网络很难找到一个好的参数。


    ## Python 深度学习从零开始学


    按理来说，深层网络的表现应该比浅层网络的好，一个 56 层的网络，只用前 20 层，后面 36 层不干活，最起码性能应该达到和一个 20 层网络的同等水平吧。所以，肯定有方法能使得更深层的网络达到或者超过浅层网络的效果。ResNet
    有如此多的层数，那它是如何解决这个问题呢？ResNet 采用了一种“短路”的结构，如图 4-31 所示。


    假定原来的网络结构需要学习得到函数 H(x)，那么不妨将原始信号 x 接到输出部分，并修改需要学习的函数为 F(x)=H(x)-x，便可得到同样的效果。


    通过这样的方式，原始信号可以跳过一部分网络层，直接在更深的网络层传递。从直觉上来看，深度神经网络之所以难以训练，就是因为原始信号 x 在网络层中传递时，越来越失真，而“短路”结构使得原始信号直接传入神经网络的深层，避免了信号失真，这样一来便极大地加快了神经网络训练时的效率。


    34 层的深度残差网络的结构如图 4-32 所示。通过“捷径连接（Shortcut Connections）”的方式，ResNet 相当于将学习目标改变了，不再是学习一个完整的输出，而是目标值
    H(X) 和 x 的差值，也就是所谓的残差: F(x)=H(x)-x。因此，后面的训练目标就是要将残差结果逼近于 0，使得随着网络加深，准确率不下降。


    图 4-32 中有一些捷径连接是实线，有一些是虚线，它们有什么区别呢？因为经过捷径连接后，H(x)=F(x)+x，如果 F(x) 和 x 的通道相同，则可直接相加，那么通道不同怎么相加呢？


    图中的实线、虚线就是为了区分这两种情况的：


    - (1) 实线的连接部分表示通道相同，如图 4-32 中从上至下第 2 个矩形和第 4 个矩形，都是 3×3×64 的特征图，由于通道相同，所以采用计算方式为
    H(x)=F(x)+x。

    - (2) 虚线的连接部分表示通道不同，如图 4-32 中从上至下第 8 个矩形和第 10 个矩形，分别是 3×3×64 和 3×3×128 的特征图，通道不同，采用的计算方式为
    H(x)=F(x)+Wx，其中 W 是卷积操作，用来调整 x 的维度。


    ![](img/470b883072d48f1f2917a784b39d4327_74_0.png)


    图 4-31


    ![](img/470b883072d48f1f2917a784b39d4327_74_1.png)


    图 4-32

    '
