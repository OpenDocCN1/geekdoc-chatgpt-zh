    # 11.4 我能认识你——人脸识别实战


    本节的实战将使用 Dlib 自带的面部识别模块 face_recognition。想要顺利调用 face_recognition 这个库，首先需要安装好两个依赖库
    Dlib 和 OpenCV。


    face_recognition 是 GitHub 上主流的人脸识别工具包之一，该软件包使用 Dlib 库中最先进的人脸识别深度学习算法，在 LFW 数据集中有
    99.38% 的准确率。


    face_recognition 实现人脸识别的思路：


    +   （1）给定想要识别的人脸的图片并对其进行编码（每个人只需要一幅），并将这些不同的人脸编码构建成一个列表。编码其实就是将人脸图片映射成一个 128 维的特征向量。

    +   （2）OpenCV 读取视频并循环每一帧图片，将每一帧图片编码后的 128 维特征向量与前面输入的人脸库编码列表里的每个向量内积来衡量相似度，根据阈值来计算是否同一个人。

    +   （3）对识别出来的人脸打标签。


    人脸识别实现的思路是采用 HOG 方法检测输入图像中的人脸。虽然使用 CNN 或 HOG 方法在量化面部之前（对面部编码）都可以检测输入图像中的人脸，但 CNN
    方法更准确（但更慢），而 HOG 方法更快（但不太准确）。虽然 CNN 人脸检测更准确，但在没有使用 GPU 运行的情况下实时检测速度太慢。'
