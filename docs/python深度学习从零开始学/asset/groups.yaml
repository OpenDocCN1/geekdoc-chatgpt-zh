    # 10.6 迁移学习总结


    迁移学习就是将网络中每个节点的权重从一个训练好的网络迁移到一个全新的网络中，而不是从头开始为每个特定的任务训练一个神经网络，这就是所谓的“踩在巨人的肩膀上”。使用迁移学习的好处主要有降低资源、降低训练时间和减少大量的训练数据等。使用深度学习去处理实际生活中遇到的问题，如果需要消耗大量的资源，比如显卡、训练时间，就可以通过迁移学习来解决这个问题，显著降低深度学习所需的硬件资源。图像识别中最常见的一个例子是训练一个神经网络来识别不同品种的猫。我们若是从头开始训练，则需要百万级的带标注数据，海量的显卡资源。而若是使用迁移学习，使用
