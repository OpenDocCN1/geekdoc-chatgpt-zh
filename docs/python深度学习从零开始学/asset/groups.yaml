    - 卷积层：卷积层是一个卷积神经网络中最重要的部分。和传统全连接网络不同，卷积层中每一个节点的输入只是上一层神经网络的一小块，卷积层试图将神经网络中的每一小块进行更加深入的分析，从而得到抽象程度更高的特征。\n\
    - 池化层：池化层不会改变三维矩阵的深度，但是它可以缩小矩阵的大小。池化操作可以认为是将一幅分辨率较高的图片转化为分辨率较低的图片。通过池化层，可以进一步缩小最后全连接层中节点的个数，从而达到减少整个神经网络中参数的目的。\n\
    - 全连接层：经过多轮卷积层和池化层的处理之后，在卷积神经网络的最后一般会有全连接层来给出最后的分类结果。\n- 输出层：输出层用于将最终的结果输出，针对不同的问题，输出层的结构也不相同，例如\
    \ MNIST 数据集识别问题中，MNIST 数据集中数字是 0~9，要求实现多分类，需要使用 softmax 函数，输出层为有 10 个神经元的向量。\n\
    \n第一次卷积运算，输入数字图像的大小为 28×28，转换后会产生 16 幅图像，卷积运算不会改变图像的大小。第一次池化后缩减采样，将 16 幅 28×28\
    \ 的图像缩小为 16 幅 14×14 图像。\n\n第二次卷积运算，将原本 16 幅图像转换为 36 幅图像，图像大小仍然是 14×14；第 2 次池化缩减采样，将\
    \ 36 幅 14×14 的图像缩小为 36 幅 7×7 的图像。\n\n建立一个平坦层，可以将池化层 2 的 36 幅 7×7 的图像转换为一维的向量，长度是\
    \ 7×7×36=1764，也就是 1764 个浮点数作为神经元的输入。\n\n建立一个隐藏层，隐藏层有 128 个神经元，加入 Dropout 避免过拟合。\n\
    \n最后一个 softmax 输出层，共有 10 个神经元，对应数字 0~9。\n\n在 TensorFlow 中必须自行设计每一层的张量运算，完整代码如下：\n\
    \n```\n###########...3\nimport tensorflow as tf\nimport tensorflow.examples.tutorials.mnist.input_data\
    \ as input_data\nmnist = input_data.read_data_sets(\"MNIST_data/\", one_hot=True)\n\
    # 定义 weight 函数，用于建立权重张量\ndef weight(shape):\n    return tf.Variable(tf.truncated_normal(shape,\
    \ stddev=0.1),\n                       name='W')\n```\n\n## Python 深度学习从零开始学\n\
    \n```\n# 定义bias函数，用于建立偏移张量\ndef bias(shape):\n    return tf.Variable(tf.constant(0.1,\
    \ shape=shape)\n        , name = 'b')\n# 定义conv2d函数，用于进行卷积运算\ndef conv2d(x, W):\n\
    \    return tf.nn.conv2d(x, W, strides=[1,1,1,1],\n            padding='SAME')\n\
    # 定义max_pool_2x2函数，用于建立池化层\ndef max_pool_2x2(x):\n    return tf.nn.max_pool(x,\
    \ ksize=[1,2,2,1],\n            strides=[1,2,2,1],\n            padding='SAME')\n\
    # 建立输入层\nwith tf.name_scope('Input_Layer'):\n    x = tf.placeholder(\"float\"\
    ,shape=[None, 784]\n        ,name=\"x\")\n    #x原本是一维，后续要进行卷积与池化运算，必须转换为四维张量\n\
    \    x_image = tf.reshape(x, [-1, 28, 28, 1])\n# 建立卷积层1\nwith tf.name_scope('C1_Conv'):\n\
    \    W1 = weight([5,5,1,16])\n    b1 = bias([16])\n    Conv1=conv2d(x_image, W1)+\
    \ b1\n    C1_Conv = tf.nn.relu(Conv1 )\n# 建立池化层1\nwith tf.name_scope('C1_Pool'):\n\
    \    C1_Pool = max_pool_2x2(C1_Conv)\n# 建立卷积层2\nwith tf.name_scope('C2_Conv'):\n\
    \    W2 = weight([5,5,16,36])\n    b2 = bias([36])\n    Conv2=conv2d(C1_Pool,\
    \ W2)+ b2\n    C2_Conv = tf.nn.relu(Conv2)\n# 建立池化层2\nwith tf.name_scope('C2_Pool'):\n\
    \    C2_Pool = max_pool_2x2(C2_Conv)\n# 建立平坦层\nwith tf.name_scope('D_Flat'):\n\
    \    D_Flat = tf.reshape(C2_Pool, [-1, 1764])\n# 建立隐藏层，加入Dropout避免过拟合\nwith tf.name_scope('D_Hidden_Layer'):\n\
    \    W3 = weight([1764, 128])\n    b3 = bias([128])\n    D_Hidden = tf.nn.relu(\n\
    \        tf.matmul(D_Flat, W3) + b3)\n```\n\n```\nD_Hidden_Dropout = tf.nn.dropout(D_Hidden,keep_prob=0.8)\n\
    # 建立输出层\nwith tf.name_scope('Output_Layer'):\n    W4 = weight([128,10])\n    b4\
    \ = bias([10])\n    y_predict= tf.nn.softmax(\n        tf.matmul(D_Hidden_Dropout,\n\
    \            W4)+b4)\n# 定义模型训练方式\nwith tf.name_scope(\"optimizer\"):\n    y_label\
    \ = tf.placeholder(\"float\", shape=[None, 10],\n        name=\"y_label\")\n \
    \   loss_function = tf.reduce_mean(\n        tf.nn.softmax_cross_entropy_with_logits\n\
    \        (logits=y_predict,\n        labels=y_label))\n    optimizer = tf.train.AdamOptimizer(learning_rate=0.0001)\
    \ \\\n        .minimize(loss_function)\n# 定义评估模型的准确率\nwith tf.name_scope(\"evaluate_model\"\
    ):\n    correct_prediction = tf.equal(tf.argmax(y_predict, 1),\n        tf.argmax(y_label,\
    \ 1))\n    accuracy = tf.reduce_mean(tf.cast(correct_prediction, \"float\"))\n\
    # 定义训练参数\ntrainEpochs = 30\nbatchSize = 100\ntotalBatchs = int(mnist.train.num_examples/batchSize)\n\
    epoch_list=[];accuracy_list=[];loss_list=[];\nfrom time import time\nstartTime=time()\n\
    sess = tf.Session()\nsess.run(tf.global_variables_initializer())\n# 进行训练\nfor\
    \ epoch in range(trainEpochs):\n    for i in range(totalBatchs):\n        batch_x,\
    \ batch_y = mnist.train.next_batch(batchSize)\n        sess.run(optimizer, feed_dict={x:\
    \ batch_x,y_label: batch_y})\n        loss, acc = sess.run([loss_function, accuracy],\n\
    \            feed_dict={x: mnist.validation.images,\n            y_label: mnist.validation.labels})\n\
    \    epoch_list.append(epoch)\n    loss_list.append(loss);\n    accuracy_list.append(acc)\n\
    \    print(\"Train Epoch:\", '%02d' % (epoch + 1), \\\n        \"Loss=\", \"{:.9f}\"\
    .format(loss), \" Accuracy=\", acc)\nduration = time() - startTime\n```\n\n```\n\
    print(\"Train Finished takes:\", duration)\n# 画出准确率执行的结果\nimport matplotlib.pyplot\
    \ as plt\nplt.plot(epoch_list, accuracy_list,label=\"accuracy\" )\nfig = plt.gcf()\n\
    fig.set_size_inches(4,2)\nplt.ylim(0.8,1)\nplt.ylabel('accuracy')\nplt.xlabel('epoch')\n\
    plt.legend()\nplt.show()\n# 使用 test 测试数据集评估模型的准确率\nprint(\"Accuracy:\",\n    \
    \  sess.run(accuracy,feed_dict={x: mnist.test.images,\n                      \
    \            y_label: mnist.test.labels}))\n# 进行预测\nprediction_result=sess.run(tf.argmax(y_predict,1),\n\
    \                          feed_dict={x: mnist.test.images ,\n               \
    \                     y_label: mnist.test.labels})\nprint(\" 查看预测结果的前 10 项数据 \"\
    )\nprint(prediction_result[:10])\nprint(\" 查看预测结果的第 248 项数据 \")\nprint(prediction_result[247])\n\
    print(\" 查看测试数据的第 248 项数据 \")\nimport numpy as np\nprint(np.argmax(mnist.test.labels[248]))\n\
    # 找出预测错误的\nprint(\" 找出预测错误的 \")\nfor i in range(500):\n    if prediction_result[i]!=np.argmax(mnist.test.labels[i]):\n\
    \        print(\"i=\"+str(i)+\n              \"   label=\",np.argmax(mnist.test.labels[i]),\n\
    \              \"predict=\",prediction_result[i])\n# 保存模型\nsaver = tf.train.Saver()\n\
    save_path = saver.save(sess, \"saveModel/tensorflow_mlp_model1\")\nprint(\"Model\
    \ saved in file: %s\" % save_path)\n# 关闭会话\nsess.close()\n#####################################################\n\
    ```\n\n训练结果如下：\n\nTrain Epoch: 01 Loss= 1.592497230  Accuracy= 0.892\nTrain Epoch:\
