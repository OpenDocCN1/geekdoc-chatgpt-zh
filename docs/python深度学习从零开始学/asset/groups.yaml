    图 9-13\n\n训练模型，评估模型的准确率。我们会发现使用 RNN 模型后，模型准确率得以提高。\n\n## 9.4 基于 LSTM 模型的电影评论情感分析\n\
    \n本节建立一个长短期记忆（Long Short Term Memory，LSTM）模型，使用该模型进行电影评论情感分析。\n\n### 9.4.1 LSTM\
    \ 模型介绍\n\nRNN 模型有个长时依赖问题，长时依赖问题指的是当预测点与依赖的相关信息距离比较远的时候，就难以学到该相关信息。对于 RNN 模型，我们可以看到，每一时刻的隐藏状态都不仅由该时刻的输入决定，还取决于上一时刻的隐藏层的值。如果一个句子很长，到句子末尾时，RNN\
    \ 模型将记不住这个句子的开头的详细内容。例如句子“我家住在福州……” ，中间还有很多句子，若要在末尾预测“我在某个城市上班”，已经忘记之前写的内容，就无法理解我是在哪一个城市上班。\n\
    \n长短期记忆网络的思路比较简单：既然原始 RNN 的隐藏层只有一个状态，即 h，它对于短期的输入非常敏感，那么我们就再增加一个状态，即 c，让它来保存长期的状态，如图\
    \ 9-14 所示。\n\n新增加的状态 c，称为单元状态（Cell State）。我们把图 9-14 按照时间维度展开，结果如图 9-15 所示。可以看出，在\
    \ t 时刻，LSTM 的输入有三个：当前时刻网络的输入值 x_t、上一时刻 LSTM 的输出值 h_{t-1}，以及上一时刻的单元状态 c_{t-1}。LSTM\
    \ 的输出有两个：当前时刻 LSTM 的输出值 h_t 和当前时刻的单元状态 c_t。\n\n![](img/470b883072d48f1f2917a784b39d4327_170_0.png)\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_170_1.png)\n\nLSTM 的关键就是怎样控制长期状态 c。对此，LSTM\
    \ 的思路是使用三个控制开关：第一个开关，负责控制继续保存长期状态 c；第二个开关，负责控制把即时状态输入到长期状态 c；第三个开关，负责控制是否把长期状态\
    \ c 作为当前的 LSTM 的输出。三个开关的作用如图 9-16 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_170_2.png)\n\
    \n这些开关用门（gate）来实现，在现实生活中，门就是用来控制进出的，关上门，我们就进不去房子，打开门我们就能进去。同理，LSTM 的门用来控制每一时刻信息的记忆与遗忘。门实际上就是一层全连接层，输入是一个向量，输出是一个\
    \ 0 到 1 之间的实数向量。门如何进行控制？方法是 用门的输出向量按元素乘以我们需要控制的那个向量，其原理是：门的输出是 0 到 1 之间的实数向量，当门输出为\
    \ 0 时，任何向量与之相乘都会得到 0 向量，这就相当于什么都不能通过；输出为 1 时，任何向量与之相乘都不会有任何改变，这就相当于什么都可以通过。\n\n\
    ### 9.4.2 使用 LSTM 模型进行影评情感分析\n\n完整的程序代码参考范例 keras_imdb_lstm.ipynb，这里摘出使用 LSTM\
    \ 模型的代码，其他代码如下载 IMDB 数据集、数据预处理等都与之前的模型相同。\n\n```\nfrom keras.models import Sequential\n\
    from keras.layers.core import Dense, Dropout, Activation\nfrom keras.layers.embeddings\
    \ import Embedding\nfrom keras.layers.recurrent import LSTM\nmodel = Sequential()\n\
    model.add(Embedding(output_dim=32,\n                    input_dim=3800,\n    \
    \                input_length=380))\nmodel.add(Dropout(0.2))\nmodel.add(LSTM(units=32))\n\
    model.add(Dense(units=256,activation='relu'))\nmodel.add(Dropout(0.2))\nmodel.add(Dense(units=1,activation='sigmoid'))\n\
    ```\n\n以上代码使用 LSTM(32) 建立具有 32 个神经元的 LSTM 层，使用 print(model.summary) 指令查看模型，如图\
    \ 9-17 所示。\n\n| Layer (type) | Output Shape | Param # |\n|---|---|---|\n| embedding_1\
    \ (Embedding) | (None, 380, 32) | 121600 |\n| dropout_1 (Dropout) | (None, 380,\
    \ 32) | 0 |\n| lstm_1 (LSTM) | (None, 32) | 8320 |\n| dense_1 (Dense) | (None,\
    \ 256) | 8448 |\n| dropout_2 (Dropout) | (None, 256) | 0 |\n| dense_2 (Dense)\
    \ | (None, 1) | 257 |\n| Total params: 138,625 |  |  |\n| Trainable params: 138,625\
    \ |  |  |\n| Non-trainable params: 0 |  |  |\n\n图 9-17\n\n训练模型，评估模型的准确率，我们会发现使用\
    \ LSTM 模型之后，模型准确率得以提高。多层感知器模型运用于文本情感分析时，其效果不如 RNN 和 LSTM 模型的效果好。\n\n## 第 10 章\
    \ 迁移学习\n\n跟传统的监督式机器学习算法相比，深度神经网络目前最大的劣势是贵，尤其是当我们在尝试处理现实生活诸如图像识别、声音辨识等实际问题的时候。一旦花费昂贵模型中包含一些隐藏层时，多增添一层隐藏层将会花费巨大的计算资源。庆幸的是，有一种叫作“迁移学习”的方式，可以使我们在他人训练过的模型基础上进行小改动便可投入使用。本章将会讲解如何使用迁移学习的常用方法来加速解决问题的过程。\n\
    \n### 10.1 迁移学习简介\n\n所谓迁移学习，一般就是要将从源领域（Source Domain）学习到的东西应用到目标领域（Target Domain）上去，源领域的数据和目标领域的数据遵循不同的分布。迁移学习能够将适用于大数据的模型迁移到小数据上，实现个性化迁移。对于迁移学习，不妨拿老师与学生之间的关系做类比。一位老师通常在他所教授的领域有着多年的丰富经验，在这些经验积累的基础上，老师能够在课堂上教授给学生们该领域的核心知识。这个过程可以看作是老手与新手之间的“信息迁移”，这个过程对神经网络也适用。我们知道，神经网络需要用数据来进行训练，它从数据中获得信息，进而把信息转换成相应的权重。这些权重能够被提取出来，迁移到其他的神经网络中，我们“迁移”了这些学来的特征，就不需要再从零开始训练一个神经网络了。\n\
    \n所以想将深度学习应用于小型图像数据集，一种常用且非常高效的方法就是使用预训练网络（Pretrained Network）。预训练网络是一个保存好的网络，之前已在大型数据集上训练好。如果原始数据集足够大且足够通用，那么就可以把预训练网络应用到我们的问题上。比如采用在\
    \ ImageNet 上预训练好的网络，然后通过微调（Fine Tune）整个网络来适应新任务。\n\n迁移学习能解决哪些问题？比如说新开一个网店，卖一种新的糕点，但是目前没有任何的客户数据，无法建立模型对客户进行推荐。但客户买一个东西的行为会反映出客户可能还会买另外一个东西，所以如果客户在另外一个领域，比如说买饮料，已经有了很多的数据，利用这些数据建立一个模型，将客户买饮料的习惯和买糕点的习惯相关联，就可以看到饮料的推荐模型成功地迁移到糕点的推荐模型上，这样，在数据不多的情况下也可以给一些客户推荐他们可能喜欢的糕点。\n\
    \n这个例子其实就是说有两个领域，一个领域已经有很多的数据，能成功地建立一个模型，另一个领域数据不多，但是和前面那个领域是关联的，就 可以把前面那个领域模型给迁移过来。即利用上千万幅的图像训练好一个图像识别系统，当我们遇到一个新的图像领域，就不用再去找几千万幅图像来训练了，把原来的图像识别系统迁移到新的领域，在新的领域只用几万幅图片就能够获取相同的效果。模型迁移的一个好处是可以和深度学习结合起来，我们可以区分不同层次可迁移的度，相似度比较高的那些层次模型迁移的可能性就大一些。\n\
    \n### 10.2 什么是预训练模型\n\n如果我们要做一个计算机视觉的应用，相比于从头训练权重，或者说从随机初始化权重开始，下载别人已经训练好的网络结构的权重，通常能够进展得更快些。即我们可以下载别人花费了好几周甚至几个月，并且经历了非常磨人的寻最优过程而做出来的开源的权重参数，作为预训练模型（Pre-Trained\
    \ Model），用在自己的神经网络上。\n\n所以简单来说，预训练模型是前人为了解决类似问题所创造出来的模型。我们在解决问题的 时候，不用从零开始训练一个新模型，可以从类似问题中找到训练过的模型来入手。\n\
    \n比如说，我们想做一辆自动驾驶汽车，可以花费数年时间从零开始构建一个性能优良的图像识别算法，也可以从 Google 在 ImageNet 数据集上训练得到的\
    \ Inception Model（一个预训练模型）起步，直接用来识别图像。\n\n一个预训练模型可能对于我们的应用来说并不是 100% 的对接准确，但是它可以为我们节省大量的功夫，我们不需要重新训练整个模型结构，只需要针对其中的几层进行训练即可。\n\
    \n以芯片图像分类为例，对采集的芯片图像进行三分类，分别为芯片底盘、焊接球以及芯片引脚连接丝图像。现在在没有大量的图像，训练集也很小，该怎么办呢？我们可以从网上下载一些神经网络开源的实现，不仅把代码下载下来，也把权重下载下来。有许多训练好的网络，都可以下载。\n\
    \nImageNet 数据集已经被广泛用作训练集，因为它的规模足够大（包括 1200 万幅图像），有助于训练普适模型。ImageNet 的训练目标是将所有的图像正确地划分到\
    \ 1000 个分类条目下。这 1000 个分类基本上都来源于我们的日常生活，比如说猫和狗的种类、各种家庭用品、日常通勤工具，等等。\n\n比如，我们采用在\
    \ ImageNet 数据集上预先训练好的 VGG16 模型，VGG16 模型是由 13 个卷积层、5 个最大池化层以及 3 个全连接层构成。它有 1000\
    \ 个不同的类别，因此这个网络会有一个 softmax 层，输出 1000 个可能类别中的 1 个。在 VGG16 网络架构的基础上，我们可以去掉最后三个全连接层，创建自定义层，用来输出芯片底盘、焊接球和芯片引脚连接丝这三个类别。我们只需要训练最后三层的权重，把前面这些层的权重都冻结（freeze）起来。\n\
    \n加载预训练权值，初始计算并存储权值，减少冗余过程，加快训练速度；然后随机初始化三层全连接层的权值，学习数据集图像与芯片图像之间的特征空间迁移；最后的一个全连接层由\
    \ ImageNet 的 1000 个输出类调整为芯片底盘、焊接球和芯片引脚连接丝三个输出类。\n"
