    \n## 第7章 数据预处理和模型评估指标\n\n数据预处理是进行数据分析的第一步，获取干净的数据是得到良好分析效果的前提。如果我们想要自己的模型获得更好的预测，就必须对数据做预处理。模型评估是指对训练好的模型性能进行评估，用于评价模型的好坏。当然使用不同的性能指标对模型进行评估时往往会有不同的结果，也就是说模型的好坏是相对的，不仅取决于算法和数据，还取决于任务需求。因此，选取一个合适的模型评价指标是非常有必要的。\n\
