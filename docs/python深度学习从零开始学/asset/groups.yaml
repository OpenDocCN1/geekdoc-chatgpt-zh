    # Python深度学习从零开始学


    现在读者可能会想，我们可以继续提升N的值呀，比如4-Gram、5-Gram，等等。实际上，这个想法是没有实用性的，因为如果我们想处理任意长度的句子，N设为多少都不合适；另外，模型的大小和N的关系是指数级的，4-Gram模型就会占用海量的存储空间。


    所以，该轮到RNN出场了，RNN在理论上可以往前看（往后看）任意多个词。RNN网络因为使用了单词的序列信息，所以准确率比前向传递神经网络要高。


    # 9.3.2 RNN模型原理


    循环神经网络的原理是将神经元的输出再接回神经元的输入，使得神经网络具备“记忆”功能。如图9-10所示是一个简单的循环神经网络，它由输入层、一个隐藏层和一个输出层组成。


    如果把图上W所在的那带箭头的圈去掉，就变成了最普通的全连接神经网络。x是一个向量，表示输入层的值（这里没有画出来表示神经元节点的圆圈）；s是一个向量，表示隐藏层的值（这里隐藏层画了一个节点，我们也可以想象这一层其实是多个节点，节点数与向量s的维度相同）；U是输入层到隐藏层的权重矩阵；o也是一个向量，它表示输出层的值；V是隐藏层到输出层的权重矩阵。那么，W是什么呢？循环神经网络的隐藏层的值s不仅取决于当前这次的输入x，还取决于上一次隐藏层的值s。权重矩阵W就是隐藏层上一次的值作为这一次输入的权重。


    ![](img/470b883072d48f1f2917a784b39d4327_168_0.png)


    循环神经网络也可以用另一种方式来表示，如图9-11所示。


    ![](img/470b883072d48f1f2917a784b39d4327_168_1.png)


    现在看上去就比较清楚了，循环神经网络在t时刻接收到输入Xt之后，隐藏层的值是St，输出值是Ot。关键一点是，St的值不仅取决于当前时间点Xt，还取决于前一个时间点的状态St-1和U、W的神经网络参数共同评估的结果。我们可以用下面的公式（见图9-12）来表示循环神经网络的计算方法，其中，函数f是非线性函数，如ReLU。


    O_t = g(V·S_t)

    S_t = f(U·X_t + W·S_{t-1})

    St的值不仅仅取决于Xt，还取决于St-1


    ![](img/470b883072d48f1f2917a784b39d4327_168_2.png)'
