    \n深度学习的框架是神经网络模型，它研究的是多层隐藏层的深度神经网络。神经网络的重要特性是它能够从环境中进行学习。神经网络的学习是一个过程：在其所处环境的激励下，相继给网络输入一些样本模式，并按照一定的规则（学习算法）调整网络各层的权值矩阵，待网络各层权值都收敛到一定值后，学习过程结束。卷积神经网络（Convolutional\
