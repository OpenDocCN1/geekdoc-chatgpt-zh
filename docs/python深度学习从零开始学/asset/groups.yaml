    \    | X (in A) | ... | Y (in B) | ...\n    +------------+    +------------+\n\
    \    |   GB(X)   | ... |   GA(Y)   | ...\n    +------------+    +------------+\n\
    \    | GA(GB(X)) | ... | GB(GA(Y)) | ...\n    +------------+    +------------+\n\
    \    \"\"\"\n    gA, recA = gen(cycleA, A)\n```\n```\ngB, recB = gen(cycleB, B)\n\
    lines = [\n    np.concatenate(A.tolist()+B.tolist(), axis = 1),\n    np.concatenate(gA.tolist()+gB.tolist(),\
    \ axis = 1),\n    np.concatenate(recA.tolist()+recB.tolist(), axis = 1)\n]\narr\
    \ = np.concatenate(lines)\nreturn arr2image(arr)\n# 创建模型\nmodel = CycleGAN(image_size\
    \ = IMG_SIZE)\n# 先记下时间\nimport time\nstart_t = time.time()\n# 训练轮数\nEPOCH_NUM\
    \ = 100\n# 已经训练的轮数\nepoch = 0\n# 迭代几次输出一次训练信息（误差）\nDISPLAY_INTERVAL = 5\n# 迭代几次保存一个快照\n\
    SNAPSHOT_INTERVAL = 50\n# 迭代几次保存一次模型\nSAVE_INTERVAL = 200\n# 批大小\nBATCH_SIZE =\
