    \ 组成的组合，分别代表 10 个不同的分类。例如，0000000000 代表 airplane，0100000000 代表 automobile，等等。10\
    \ 个数字正好对应输出层的 10 个神经元。进行独热编码转换的代码如图 8-26 所示。\n\n```\nfrom keras.utils import np_utils\n\
