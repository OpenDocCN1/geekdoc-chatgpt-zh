    ## 6.5 Keras 创建神经网络预测银行客户流失率\n\n本节用银行客户流失率预测这样一个实际案例来介绍如何用 Keras 创建神经网络。\n\n###\
    \ 6.5.1 案例项目背景和数据集介绍\n\n客户流失意味着客户终止了和银行的各项业务。毫无疑问，一定量的客户流失会给银行带来巨大损失。考虑到避免一位客户流失的成本很可能远低于挖掘一位新客户，因此对客户流失情况的分析预测至关重要。\n\
