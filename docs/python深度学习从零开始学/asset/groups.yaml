    （5）某些算法对数据归一化敏感，标准化可大大提高模型的精度。标准化即将样本缩放到的指定的范围，标准化可消除样本间不同量级带来的影响（大数量级的特征占据主导地位；量级的差异将导致迭代收敛速度减慢；所有依赖于样本距离的算法对数据的量级都非常敏感）。


    （6）在数据集中，样本往往会有很多特征，并不是所有特征都有用，只有一些关键的特征对预测结果起决定性作用。


    # 7.2 数据预处理方法介绍


    当我们对一批原始的数据进行预处理时，具体步骤如下：


    +   步骤01 首先要明确有多少特征，哪些是连续的，哪些是类别的。

    +   步骤02 检查有没有缺失值，对缺失的特征选择恰当方式进行填补，使数据完整。

    +   步骤03 对连续的数值型特征进行标准化，使得均值为 0，方差为 1。

    +   步骤04 对类别型的特征进行独热编码。

    +   步骤05 将需要转换成为类别型数据的连续型数据进行二值化。

    +   步骤06 为防止过拟合或者其他原因，选择是否要将数据进行正则化。


    数据预处理的工具有许多，比较常用的主要有两种：Pandas 库的数据预处理和 sklearn 库中的 sklearn.preprocessing 数据预处理。本章主要介绍使用
    sklearn.preprocessing 包进行数据预处理。


