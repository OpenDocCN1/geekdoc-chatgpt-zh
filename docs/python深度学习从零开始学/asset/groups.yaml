    # Python 深度学习从零开始学


    当时，卷积神经网络最出名的一个物体识别网络之一叫作 VGG19，结构如图 12-3 所示。


    ![](img/470b883072d48f1f2917a784b39d4327_200_0.png)


    图 12-3


    每一层神经网络都会利用上一层的输出来进一步提取更加复杂的特征，直到复杂到能被用来识别物体为止，所以每一层都可以看作很多个局部特征的提取器。VGG19 在物体识别方面的精度甩了之前的算法一大截。VGG19
    具体内部在做什么其实很难理解，因为每一个神经元内部参数只是一堆数字而已。每个神经元有几百个输入和几百个输出，一个一个去梳理清楚神经元和神经元之间的关系太难了。于是，有人想出来一种办法：虽然我们不知道神经元是怎么工作的，但是如果我们知道了它的激活条件，会不会对理解神经网络更有帮助呢？于是他们编了一个程序（这个程序用的算法就是
    Back Propagation 算法即反向传播，和训练神经网络的方法一样，只是倒过来生成图片），把每个神经元所对应的能激活它的图片找了出来，特征图就是这么生成的。特征图蕴含着提取出图像的信息，当卷积神经网络用于物体识别时，随着网络的层次越来越深，网络层产生的物体特征信息越来越清晰。这意味着，沿着网络的层级结构，每一个网络层的输出越来越关注于输入图片的实际内容，而不是其它具体的像素值。利用卷积神经网络提取图像内容和风格，通过对特征图进行适当处理，将提取出来的内容表示和风格表示分别用于重建图像的内容和风格。


    2015 年，德国图宾根大学（University of Tuebingen）的 Leon A. Gatys 撰写了两篇基于神经网络图像风格迁移的论文：在第一篇论文中，Gatys
    从各层 CNN 中提取纹理信息，于是就有一个不用手工建模就能生成纹理的方法；在第二篇论文中，Gatys 更进一步指出，纹理能够描述一个图像的风格。第一篇论文比之前的纹理生成算法的创新点只有一个，它提出了一种用深度学习来给纹理建模的方法。之前说到纹理生成的一个重要的假设是纹理能够通过局部统计模型来描述，而手动建模方法太麻烦。于是
    Gatys 看了物体识别论文，发现大名鼎鼎的 VGG19 卷积神经网络模型，其实就是一堆局部特征识别器。他把事先训练好的网络拿过来，发现这些识别器还挺好用。因此，Gatys
    使用格拉姆矩阵（Gram Matrix）演算了一下那些不同局部特征的相关性，把它变成了一个统计模型，于是就有了 一个不用手工建模就能生成纹理的方法。'
