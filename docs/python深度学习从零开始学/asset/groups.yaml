    \ 为 adam，metrics 为 accuracy。\n\n```\n# 编译神经网络, 指定优化器, 损失函数, 以及评估标准\nann.compile(optimizer\
    \ = 'adam', # 优化器\n            loss = 'binary_crossentropy', # 损失函数\n        \
    \    metrics = ['acc']) # 评估指标\n```\n\n图 6-28\n\n训练神经网络也是通过 fit 方法实现，这里通过 history\
