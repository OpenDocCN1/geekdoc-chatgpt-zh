    我们可以认为 RGB 形式的彩色图片是一个具有红、绿、蓝三通道的矩阵，而二值图像和灰度图像本身在存储上就是一个矩阵，这些图片中的像素点很多。而提取到的特征往往是以特征向量的形式表示的，向量的元素一般都不会太多（一般在“千”这个数量级）。


