    \ 3-14 所示。它的每列可以是不同的数据类型（ndarray 只能有一个数据类型）。基本上可以把 DataFrame 看成是共享同一个 index 的\
    \ Series 的集合。\n\nDataFrame 的构造方法与 Series 类似，只不过它可以同时接收多条一维数据源，每一条一维数据源都会成为单独的一列，如图\
    \ 3-15 所示，图中 df1、df2、df3 分别是使用列表创建、使用 ndarrays 创建，以及使用字典创建的 DataFrame，是一个二维的数组结构。\n\
