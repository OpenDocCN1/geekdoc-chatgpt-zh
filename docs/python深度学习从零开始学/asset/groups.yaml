    # 4. IoU


    IoU 是目标检测任务中常用的评价指标。举例如图 7-18 所示，浅色框（偏上方）是真实感兴趣区域，深色框（偏下方）是预测区域。有时候预测区域并不能准确预测物体位置，因为预测区域总是试图覆盖目标物体而不是正好预测出物体位置，虽然二者的交集确实是最大的。这时如果我们能除以一个并集的大小，就可以规避这种问题。这就是
    IoU 要解决的问题了。


    IoU 的具体意义如图 7-19 所示，即预测框与标注框的交集与并集之比，数值越大表示该检测器的性能越好。


