    \ 基于多层感知器模型的电影评论情感分析\n\n本节建立一个多层感知器模型，使用该模型进行电影评论情感分析。\n\n# 9.2.1 加入嵌入层\n\n词嵌入的作用是将人类的语言映射到几何空间中，词与词之间的语义关系通过几何距离来表示。表示不同事物的词被嵌入到相隔很远的点，而相关的词则更加靠近（“花”与“植物”，“狗”与“动物”靠得近一些）。Keras\
    \ 中的嵌入层可以将“数字列表”转换为“向量列表”。嵌入层可以理解为一个字典，将整数索引（表示特定单词）映射为密集向量，即它接收整数作为输入，并在内部字典中查找这些整数，然后返回相关联的向量。嵌入层的输入是一个二维整数张量，其形状为（samples,\
    \ sequence_length），每个元素是一个整数序列；返回一个形状为 (samples, sequence_length, embedding_dimensionality)\
    \ 的三维浮点数张量。\n\n导入所需模块：\n\n```\nfrom keras.models import Sequential\nfrom keras.layers.core\
    \ import Dense, Dropout, Activation,Flatten\nfrom keras.layers.embeddings import\
    \ Embedding\n```\n\n建立一个线性堆叠模型，后续只需要将各个神经网络层加入模型即可：\n\n```\nmodel = Sequential()\n\
    ```\n\n将嵌入层加入模型，并且加入 Dropout 层避免过拟合。\n\n```\nmodel.add(Embedding(output_dim=32,\n\
    \                    input_dim=2000,\n                    input_length=100))\n\
    model.add(Dropout(0.2))\n```\n\nDropout(0.2) 的功能是，每次训练迭代时会随机地在神经网络中放弃 20% 的神经元。\n\
    \n# 9.2.2 建立多层感知器模型\n\n“数字列表”在嵌入层被转换为“向量列表”后，就可以用 于深度学习模型进行训练与预测了。建立多层感知器模型的代码如下：\n\
    \n```\nmodel.add(Flatten())\nmodel.add(Dense(units=256,activation='relu'))\nmodel.add(Dropout(0.2))\n\
    ```"
  - "[PAGE 163]\n\n```\nmodel.add(Dense(units=1,activation='sigmoid' ))\n```\n\n通过\
    \ print(model.summary()) 来查看模型的摘要，如图 9-3 所示。\n\n程序代码在模型中加入一平坦层。平坦层用来将输入“压平”，即把多维的输入一维化，常用在从卷积层到全连接层的过渡。平坦层不影响批的大小，因为“数字列表”每一项有100个数字，每个数字都转换为32维的向量，所以平坦层的神经元有32×100=3200个。然后在模型中加入隐藏层（Dense层），这里隐藏层有256个神经元，激活函数为ReLU。同时加入Dropout层以避免过拟合。再建立输出层（Dense层），输出层只有1个神经元（输出1代表正面积极评价，输出2代表负面消极评价。最后定义激活函数sigmoid。\n\
