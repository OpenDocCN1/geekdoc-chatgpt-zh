    # 5.4.1 MNIST 数字识别问题Ⅰ


    我们使用 TensorFlow 构建神经网络来识别 MNIST 数据集中的手写数字。MNIST 数据集是 NIST 数据集的一个子集，它包含了 60000
    幅图片作为训练数据，10000 幅图片作为测试数据。如图 5-9 所示，在 MNIST 数据集中的每一幅图片都代表了 0~9 中的一个数字，图片的大小都为
    28×28，且数字都会出现在图片的正中间。


    ![](img/470b883072d48f1f2917a784b39d4327_83_0.png)


    图 5-9


    MNIST 数据集可以从 http://yann.lecun.com/exdb/mnist/ 获取，它包含了四个部分：


    +   - Training set images: train-images-idx3-ubyte.gz (9.9MB, 解压后 47MB, 包含 60000
    个样本)；

    +   - Training set labels: train-labels-idx1-ubyte.gz (29KB, 解压后 60KB, 包含 60000
    个标签)；

    +   - Test set images: t10k-images-idx3-ubyte.gz (1.6MB, 解压后 7.8MB, 包含 10000 个样本)；

    +   - Test set labels: t10k-labels-idx1-ubyte.gz (5KB, 解压后 10KB, 包含 10000 个标签)。


    虽然这个数据集只提供了训练和测试数据，但是为了验证模型训练的效果，一般会从训练数据中划分出一部分数据作为验证数据。为了方便使用，TensorFlow 提供了一个类来处理
    MNIST 数据。这个类会自动下载并转化 MNIST 数据的格式，将数据从原始的数据包中解析成训练和测试神经网络时使用的格式。'
