    TensorFlow 游乐场所展示的是一个全连接神经网络，同一层的节点不会相互连接，而且每一层只和下一层连接，直到最后一层输出层得到输出结果。


    在 TensorFlow 游乐场中，每一个小格子代表神经网络中的一个节点，每一个节点上的颜色代表这个节点的区分平面，区分平面上的一个点的坐标代表一种取值，而点的颜色就对应其输出值，输出值的绝对值越大，颜色也就越深：黄色（颜色参看网站）越深表示负得越大，蓝色（颜色参看网站）越深表示正得越大。


