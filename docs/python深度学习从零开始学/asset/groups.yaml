    +   - D 的目的： D 的能力越强，D(x) 应该越大，D(G(x)) 应该越小，这时 V(D,G) 会变大。因此公式对于 D 来说就是求最大值（max_D）。


    所以，我们回过头来看这个最大最小目标函数，里面包含了判别模型的优化，包含了生成模型以假乱真的优化，完美地阐释了这样一个优美的 GAN 算法。


    # 13.3 循环生成对抗网络


    循环生成对抗网络（CycleGAN）是传统 GAN 的特殊变体，它也可以创建新的数据样本，但是通过转换输入样本来实现，而不是从头开始创建。换句话说，它学会了从两个数据源转换数据。这些数据可由提供此算法数据集的科学家或开发人员进行选择。在两个数据源是狗的图片和猫的图片的情况下，该算法能够有效地将猫的图像转换为狗的图像，反之亦然。


    传统的 GAN 是单向的，网络中由生成器 G 和判别器 D 两部分组成。假设两个数据域分别为 X、Y。G 负责把 X 域中的数据拿过来拼命地模仿成真实数据，并把它们藏在真实数据中让
    D 猜不出来，而 D 就拼命地要把伪造数据和真实数据分开。经过二者的博弈以后，G 的伪造技术越来越厉害，D 的判别技术也越来越厉害。直到 D 再也分不出数据是真实的还是
    G 生成的，这个时候对抗的过程达到一个动态的平衡。


    单向 GAN 需要两个 loss：生成器的重建 loss 和判别器的判别 loss。


    +   - 重建 loss：希望生成的图片与原图尽可能相似。

    +   - 判别 loss：生成的假图片和原始真图片都会输入到判别器中。


    而 CycleGAN 本质上是两个镜像对称的 GAN，构成了一个环形网络。两个 GAN 共享两个生成器，并各自带一个判别器，即共有两个判别器和两个生成器。一个单向
    GAN 有两个 loss，两个 GAN 即有四个 loss。


    CycleGAN 的网络架构有两个比较重要的特点：第一个特点就是双判别器，如图 13-4 所示，两个分布 X 与 Y，生成器 G、F 分别是 X 到 Y 和
    Y 到 X 的映射，两个判别器 Dx、Dy 可以对转换后的图片进行判别；第二个特点就是 cycle-consistency loss，用数据集中其他的图来检验生成器，防止
    G 和 F 过拟合，比如想把一幅小狗照片转化成梵高风格，如果没有 cycle-consistency loss，生成器可能会生成一幅梵高真实画作来骗过 Dx，而无视输入的小狗照片。


    ![](img/470b883072d48f1f2917a784b39d4327_216_0.png)


    图 13-4'
