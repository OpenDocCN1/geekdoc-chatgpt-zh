    # 3.4 数据可视化库——Matplotlib


    Matplotlib 是使用 Python 开发的一个绘图库，是 Python 编程界进行数据可视化的首选库。它提供了绘制图形的各种工具，支持的图形既包括简单的散点图、曲线图和直方图，也包括复杂的三维图形等，基本上做到了“只有你想不到，没有它做不到”的地步。


    从最简单的图形开始，绘制一条正弦曲线，如图 3-27 所示。最开始时，引入相关模块并重命名为 np 和 plt，其中 np 是用来生成图形的数据，plt 就是绘图模块。然后，使用
    np.linspace 生成一个包含 50 个元素的数组作为 x 轴数据，这些元素均匀地分布在 [0, 2π] 区间上。接着，使用 np.sin 生成与 x
    对应的 y 轴数据。再接着，使用 plt.plot(x, y) 画一个折线图形，并把 x 和 y 绘制到图形上。最后，调用 plt.show() 把绘制好的图形显示出来。


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    x = np.linspace(0, 2 * np.pi, 50)

    y = np.sin(x)

    plt.plot(x, y)

    plt.show()

    ```


