    \n图 11-6\n\n## 11.3 人脸表情分析情绪识别实战\n\n本节主要是利用 OpenCV 和 Dlib 类库检测视频流里的人脸，将眼睛和嘴巴标识出来（利用已经训练好的数据来做）。\n\
    \n通过大量人脸面部表情数据分析，一般嘴巴张开距离占面部识别框宽度的比例越大，说明这个人的情绪越激动，可能他很开心，或者他极度愤怒。而眉毛上扬越厉害，表示这个人越惊讶，眉毛的倾斜角度不同，表现出的情绪也是不一样的，开心时眉毛上扬，愤怒时眉毛皱起并且压下来。最后，人的眼睛“会说话”，人在开心大笑的时候不自觉地会眯起眼睛，而在愤怒或者惊讶的时候会瞪大眼睛。\n\
    \n当然，通过这些脸部特征，只能大致判断出一个人的情绪是开心、愤怒、惊讶，还是自然等，要做出更加准确的判断，就要捕捉脸部细微的表情变化，加上心率检测、语音检测等进行综合评价。\n\
    \n实施这个案例的第一步是要利用 Dlib 类库来检测和识别人脸，在这个案例里我们使用的是已经训练好的人脸识别检测器 shape_predictor_68_face_landmarks.dat\
