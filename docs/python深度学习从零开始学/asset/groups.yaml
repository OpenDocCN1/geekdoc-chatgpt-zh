    卷积神经网络的概念最早出自19世纪60年代科学家提出的感受野。当时，科学家通过对猫的视觉皮层细胞的研究发现，每一个视觉神经元只会处理一小块区域的视觉图像，即感受野。到了20世纪80年代，日本科学家提出神经认知机的概念，可以算作是卷积网络最初的实现原型。神经认知机中包含两类神经元，用来抽取特征的S-cells和用来抗形变的C-cells，其中S-cells对应现在主流卷积神经网络中的卷积核滤波操作，而C-cells则对应激活函数、最大池化等操作。


    卷积神经网络由多个卷积层构成，每个卷积层包含多个卷积核，用这些卷积核从左向右、从上往下依次扫描整个图像，得到称为特征图的输出数据。第一个卷积层会直接接收图像像素级的输入，每一个卷积操作只处理一小块图像，进行卷积变化后再传到后面的网络，每一'
