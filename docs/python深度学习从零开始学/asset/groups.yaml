    \ 函数可以在一定范围内生成一个从初值到终值等差排布的序列，它的相关值为 (stop-start)/(num-1)；调用 tf.range(start,limit,delta)\
    \ 函数可以从初值（默认值=0）开始生成一个数字序列，增量为 delta（默认值=1），直到终值（但不包括终值）；调用 tf.random_normal 函数可以创建一个具有一定均值（默认值=0.0）和标准差（默认值=1.0）、形状为\
    \ [M, N] 的正态分布随机数组。如图 5-7 所示。\n\n#### 5.3.2 变量\n\n当一个量在会话中的值需要更新时，使用变量来表示。例如，在神经网络中，权重需要在训练期间更新，这可以通过将权重声明为变量来实现。变量在使用前需要被显示初始化。另外需要注意的是，常量存储在计算图的定义中，每次加载图时都会加载相关变量，换句话说它们是占用内存的。此外，变量可以存储在磁盘上。\n\
    \n示例代码如下：\n\n```\n###############tensorflow_variables_demo.py###############\n\
    import tensorflow as tf\nx = tf.Variable([1, 2])\na = tf.constant([3, 3])\nsub\
    \ = tf.subtract(x, a)                     # 增加一个减法 op\nadd = tf.add(x, sub)  \
    \                      # 增加一个加法 op\n# 注意变量在使用之前要在 sess 中做初始化，但是下边这种初始化方法不会指定变量的初始化顺序\n\
    init = tf.global_variables_initializer()    # 全局变量初始化\nwith tf.Session() as sess:\n\
    \    sess.run(init)\n    print(sess.run(sub))\n    print(sess.run(add))\n# 创建一个名为\
    \ “counter” 的变量初始化为 0\nstate = tf.Variable(0, name='counter')\nnew_value = tf.add(state,\
    \ 1)               # 创建一个 op，作用是使 state 加 1\nupdate = tf.assign(state, new_value)\
    \       # 赋值 op，不能直接用等号赋值，作用是\nstate = new_value, 借助 tf.assign() 函数实现\n```\n\n\
    ![](img/470b883072d48f1f2917a784b39d4327_79_0.png)\n\nPython 深度学习从零开始学\n\n```\n\
    init = tf.global_variables_initializer()  # 全局变量初始化\nwith tf.Session() as sess:\n\
    \    sess.run(init)\n    print(sess.run(state))\n    for _ in range(5):      \
    \           # 循环 5 次\n        sess.run(update)\n        print(sess.run(state))\n\
    ###################################################\n```\n\n运行以上程序代码，结果如图5-8所示，所有变量在\
    \ session 使用前必须初始化，可以使用全局变量初始化语句 tf.global_variables_initializer() 在计算图的定义中通过声明初始化操作对象来实现，在\
    \ session 创建后，也需运行 init 进行初始化操作。当然每个变量也可以在运行图中单独使用 tf.Variable.initializer 来进行初始化。\n\
    \n在 TensorFlow 中，有专门的函数来定义和初始化变量，并且在会话中调用初始化变量的函数以后，变量才能被使用。使某个变量等于另一个变量，不能直接使用等号，而是使用\
    \ tf.assign() 函数使其相等。\n\n![](img/470b883072d48f1f2917a784b39d4327_80_0.png)\n\n\
    注意 变量通常在神经网络中表示权重和偏置。\n\n下面的示例代码中定义了三个变量：权重变量 weights 使用正态分布随机初始化，均值为 0，标准差为 2，权重大小为\
    \ 100×100；偏置变量 bias 由 100 个元素组成，每个元素初始化为 0，在这里也使用了可选参数名以便给计算图中定义的变量命名；指定一个变量来初始化另一个变量，用前面定义的权重变量\
    \ weights 来初始化变量 weight2。\n\n```\nweights=tf.Variable(tf.random_normal([100,100],stddev=2))\n\
    bias=tf.Variable(tf.zeros([100]),name='biases')\nweight2=tf.Variable(weights.initial_value(),name='w2')\n\
    ```\n\n将训练好的模型参数保存起来，以便以后进行验证或测试（这是我们经常要做的事情）。TensorFlow 里面提供模型保存的是 tf.train.Saver()\
    \ 模块，程序代码如下：\n\n```\n################tensorflow_save_variables.py################\n\
    import tensorflow as tf\nimport numpy as np\n# Create two variables.\nx_data =\
    \ np.float32([1,2,3,4,5,6,7,8,9,0])\nweights = tf.Variable(tf.random_normal([10,\
    \ 1], stddev=0.35), name=\"weights\")\nbiases = tf.Variable(tf.zeros([1]), name=\"\
    biases\")\ny = tf.matmul(x_data.reshape((1,-1)), weights)+biases\n# Add an op\
    \ to initialize the variables.\ninit_op = tf.global_variables_initializer()\n\
    saver = tf.train.Saver()\n```\n\n```\n# Later, when launching the model\nwith\
    \ tf.Session() as sess:\n    #Run the init operation.\n    sess.run(init_op)\n\
    \    y_ = sess.run(y)\n    print(y_)\n    save_path = saver.save(sess, \"./tmp/model.ckpt\"\
    )\n    print(\"Model saved in file: \", save_path)\n####################################################\n\
    ```\n\n程序运行结果如下：\n\n```\n[[-1.5675972]]\nModel saved in file:  ./tmp/model.ckpt\n\
    ```\n\n模型的恢复调用的是 restore() 函数，该函数需要两个参数 restore(sess, save_path)，其中 save_path\
    \ 指的是保存模型的路径，程序代码如下：\n\n```\n###################tensorflow_restore_variables.py###################\n\
    import tensorflow as tf\nimport numpy as np\nimport os\n# 设置 TensorFlow 日志输出级别，屏蔽警告信息\n\
    os.environ[\"TF_CPP_MIN_LOG_LEVEL\"] = \"2\"\n# Create two variables.\nx_data\
    \ = np.float32([1,2,3,4,5,6,7,8,9,0])\nweights = tf.Variable(tf.random_normal([10,\
    \ 1], stddev=0.35),\nname=\"weights\")\nbiases = tf.Variable(tf.zeros([1]), name=\"\
    biases\")\ny = tf.matmul(x_data.reshape((1,-1)), weights)+biases\nsaver = tf.train.Saver()\n\
    # Later, when launching the model\nwith tf.Session() as sess:\n    saver.restore(sess,\
    \ './tmp/model.ckpt')\n    y_ = sess.run(y)\n    print(y_)\n########################################################\n\
    ```\n\n#### 5.3.3 占位符\n\n占位符（Placeholder）用于在会话运行时动态提供输入数据。占位符相当于定义了一个位置，这个位置上的数据在程序运行时再指定。\n\
    \n在以后的编程中，我们可能会遇到这样的情况：在训练神经网络时，每次都需要提供一个批量的训练样本，如果每次迭代选取的数据要通过常量表示，那么 TensorFlow\
    \ 的计算图会非常大。因为每增加一个常量，TensorFlow 都会在计算图中增加一个节点，因而拥有几百万次迭代的神经网络会拥有极其庞大的计算图。占位符机制的出现就是为了解决这个问题，它\n"
  mdcn: "\n经检验，深度残差网络的确解决了退化问题，如图 4-33 所示，左图为普通网络，误差率网络层次深的（34层）比网络层次浅的（18层）的更高；右图为残差网络\
    \ ResNet，误差率网络层次深的（34层）比网络层次浅的（18层）更低。对比左、右两边 18 层和 34 层的网络效果，可以看到普通的网络出现退化现象，但是\
    \ ResNet 很好地解决了退化问题。\n\n![](img/470b883072d48f1f2917a784b39d4327_75_0.png)\n\n\
    图 4-33\n\n自从 AlexNet 在 LSVRC2012 分类比赛中取得胜利之后，ResNet 可以说成为过去几年在计算机视觉、深度学习领域中最具突破性的成果了。ResNet\
    \ 可以实现高达数百、甚至数千层的训练，且仍能获得超赞的性能。这种残差跳跃式的结构，打破了传统的神经网络第 n-1 层的输出只能给第 n 层作为输入的惯例，使某一层的输出可以直接跨过几层作为后面某一层的输入，其意义在于为叠加多层网络而使得整个学习模型的错误率不降反升的难题提供了新的方向。至此，神经网络的层数可以打破之前的限制，达到几十层、上百层甚至上千层，为高级语义特征的提取和分类提供了可行性。\n\
    \n## 第 5 章\n深度学习框架 TensorFlow 入门\n\n深度学习已经广泛应用于各个领域，这里抛砖引玉，简单介绍一下时下非常热门的深度学习开源框架\
    \ TensorFlow。TensorFlow 是 Google 开源的机器学习工具，在 2015 年 11 月实现正式开源，开源协议为 Apache 2.0。TensorFlow\
    \ 作为谷歌重要的开源项目，有非常火热的开源社区推动其发展。TensorFlow 中的实现代码可能跟通常的 Python 程序有点不一样，因为 TensorFlow\
    \ 有它自己的框架和体系，会用它自己更加适配的方式来描述过程。\n\n### 5.1 第一个 TensorFlow 的 “Hello world”\n\n\
    TensorFlow 是一个开源的、基于 Python 的机器学习框架，它由 Google 开发，并在图形分类、音频处理、推荐系统和自然语言处理等场景下有着丰富的应用，是目前最热门的机器学习框架之一。\n\
    \n在任何计算机语言中学习的第一个程序都是 Hello world，我们也将遵循这个惯例，从程序 Hello world 开始，如图 5-1 所示。\n\n\
    ```\nimport tensorflow as tf\nmessage=tf.constant('Hello, world')\nwith tf.Session()\
    \ as sess:\n    print(sess.run(message).decode())\n\nHello, world\n```\n\n对图 5-1\
    \ 中的代码分析如下：\n\n- （1）首先导入 TensorFlow，这将导入 TensorFlow 库，并允许使用其功能。\n- （2）由于要打印的信息是一个常量字符串，因此使用\
    \ tf.constant。\n- （3）为了执行计算图，利用 with 语句定义 Session 会话，并使用 run 来运行。\n- （4）最后是打印信息，这里的输出结果是一个字符串。\n\
    \n图 5-1\n\n### 5.2 TensorFlow 程序结构\n\nTensorFlow 与其他编程语言非常不同。TensorFlow 这个单词由两部分组成：Tensor\
    \ 代表张量，是数据模型；Flow 代表流，是计算模型。张量表示某种相同数据类型 的多维数组，因此，张量有两个重要属性：数据类型（如浮点数、整型、字符串）、数组形状（各个维度的大小）。\n\
    \nTensorFlow 中所有的输入和输出变量都是张量，而不是基本的 Int、Double 这样的类型，即使是一个整数1，也必须被包装成一个0维的、长度为1的张量。一个张量和一个矩阵差不多，可以被看作是一个多维的数组，从最基本的一维到\
    \ n 维都可以。即在 TensorFlow 中所有的数据都是一个 n 维的数组，只是我们给它起了个名字叫作张量。张量拥有阶、形状和数据类型。其中，形状可以理解为长度，例如，一个形状为\
    \ 2 的张量就是一个长度为 2 的一维数组；而阶可以理解为维数。\n\n对于任何深度学习框架，我们都要先了解张量的概念，张量可以看作是向量和矩阵的衍生。向量是一维的，矩阵是二维的，而张量可以是任何维度的。\n\
    \n直观来看 TensorFlow，就是张量的流动，是指保持计算节点（Nodes）不变，让数据进行流动。所有的 TensorFlow 程序都是先建立“计算图”，这是张量运算和数据处理的流程。\n\
    \n计算图就是一个具有“每一个节点都是计算图上的一个节点，而节点之间的边（Edges）描述了计算之间的依赖关系”性质的有向图。节点在图中表示数学操作，图中的边则表示在节点间相互联系的多维数据数组，即张量。\n\
    \n用一个简单的例子描述程序结构——通过定义并执行计算图来实现两个向量相加，使用会话对象来实现计算图的执行。会话对象封装了评估张量和操作对象的环境，这里真正实现了运算操作并将信息从网络的一层传递到另外一层。\n\
    \n具体操作步骤如下：\n\n步骤 01 假设两个向量 v_1 和 v_2 将作为输入提供给 Add 操作，建立的计算图如图 5-2 所示。\n\n步骤 02\
    \ 定义该图的相应代码，如图 5-3 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_77_0.png)\n\
    \n图 5-3\n\n```python\nimport tensorflow as tf\nv_1 = tf.constant([1, 2, 3, 4])\n\
    v_2 = tf.constant([2, 1, 5, 3])\nv_add=tf.add(v_1, v_2)\n```\n\n步骤 03 在会话中执行这个图，如图\
    \ 5-4 所示。\n\n步骤 04 图 5-4 所示的代码与图 5-5 所示的代码效果相同，而图 5-4 所示代码的优点是不必显式写出关闭会话的命令，每个会话都需要使用\
    \ close() 来明确关闭，而 with 格式可以在运行结束时隐式关闭会话。\n\n图 5-4\n\n```python\nwith tf.Session()\
    \ as sess:\n    print(sess.run(v_add))\n[3 3 8 7]\n```\n\n图 5-5\n\n```python\n\
    sess=tf.Session()\nprint(sess.run(v_add))\nsess.close()\n[3 3 8 7]\n```\n\n步骤\
    \ 05 运行结果是显示两个向量的和“{3 3 8 7}”。\n\n在本例中，计算图由三个节点组成，即 v_1、v_2 和 v_add，v_1 和 v_2\
    \ 表示两个向量，v_add 是要对这两个向量执行的操作。接下来，为了使计算图生效，首先需要使用 tf.Session() 定义一个会话对象 sess，然后使用\
    \ Session 类中定义的 run 方法来运行这个会话对象。总结来说，图只是定义了应该怎么做，而会话 Session 才是真正的执行者。\n\n###\
    \ 5.3 TensorFlow 常量、变量、占位符\n\n本节主要介绍在 TensorFlow 中如何表示常量、变量、占位符。\n\n#### 5.3.1\
    \ 常量\n\n常量用于存储一些不变的数值，一经创建就不会被改变。在 Python 中使用常量很简单，如 a=123、b='python'。TensorFlow\
    \ 表示常量稍微麻烦一点，需要使用 tf.constant 这个类，tf.constant 的语法格式如下：\n\n```\ntf.constant(value,\
    \ dtype=None, shape=None, name=\"Const\", verify_shape=False)\n```\n\n其中，value\
    \ 为常量或者列表，dtype 为返回的张量的类型，shape 为张量形状，name 为张量名称、verify_shape 为用于验证值的形状，默认为 False。\n\
    \n可以这样声明一个常量：\n\n```\na = tf.constant(2, name=\"a\")\nb = tf.constant(3, name=\"\
