  mdcn: "\n## Python 深度学习从零开始学\n\n通过使用其他人预训练的权重，我们很可能得到很好的性能，即使只有一个小的数据集。同时大大减少了训练时间，只需要针对全连接层进行训练，所需时间基本可以忽略。\n\
    \n在迁移学习中，这些预训练的网络对于 ImageNet 数据集外的图片也表现出了很好的泛化性能。通过使用之前在大数据集上经过训练的预训练模型，我们可以直接使用相应的结构和权重，将它们应用到我们正在面对的问题上，如图\
    \ 10-1 所示。因为预训练模型已经训练得很好，我们就不会在短时间内去修改过多的权重，在迁移学习中用到它的时候，往往只是进行微调。\n\n![](img/470b883072d48f1f2917a784b39d4327_174_0.png)\n\
    \n图 10-1\n\n但也要记住一点，在选择预训练模型的时候必须非常仔细，如果我们的问题与预训练模型训练情景有很大的出入，那么模型所得到的预测结果将会非常不准确。举例来说，把一个原本用于语音识别的模型用来做用户识别，那结果肯定是不理想的。\n\
    \n## 10.3 如何使用预训练模型\n\n采用预训练模型的结构，一种方法先将所有的权重随机化，然后依据自己的数据集进行训练；另一种方法使用预训练模型的方法对它进行部分训练。具体的做法是：模型起始的一些层的权重保持不变，重新训练后面的层，得到新的权重，在这个过程中，我们可以进行多次尝试，从而能够依据结果找到最佳搭配。\n\
    \n如何使用预训练模型，这是由数据集大小和新旧数据集（预训练的数据集和我们要解决的数据集）之间数据的相似度来决定的。\n\n### 1. 场景一：数据集小，数据相似度高\n\
    \n在这种情况下，因为数据与预训练模型的训练数据相似度很高，因此我们不需要重新训练模型。只需将输出层改建成符合问题情景下的结构就好。比如说使用在 ImageNet\
    \ 上训练的模型来辨认一组新照片中的猫和狗。这里，需要被辨认的图片与 ImageNet 库中的图片类似，但是我们的输出结果中只需要两项，即猫或者狗。在这个例子中，我们要做的就是把全连接层和最终\
    \ softmax 层的输出从 1000 个类别改为 2 个类别。\n\n### 2. 场景二：数据集小，数据相似度不高\n\n在这种情况下，我们可以冻结预训练模型中的前\
    \ k 个层中的权重，然后重新训练后面的 n-k 个层，当然最后一层也需要根据相应的输出格式来进行修改。因为数据的相似度不高，重新训练的过程就变得非常关键。而新数据集大小的不足，则是通过冻结预训练模型的前\
    \ k 层来进行弥补。\n\n### 3. 场景三：数据集大，数据相似度不高\n\n在这种情况下，因为我们有一个很大的数据集，所以神经网络的训练过程将会比较有效率。然而，因为实际数据与预训练模型的训练数据之间存在很大的差异，采用预训练模型将不会是一种高效的方式。因此，最好的方法还是将预训练模型中的权重全都初始化后在新数据集的基础上从头开始训练。\n\
    \n### 4. 场景四：数据集大，数据相似度高\n\n这是最理想的情况，采用预训练模型会变得非常高效。最好的运用方式是保持模型原有的结构和初始权重不变，随后在新数据集的基础上重新训练。\n\
    \n## 10.4 在狗狗识别的任务上使用迁移学习\n\n本节案例，我们将使用预训练的 VGG16 模型，并且使用它在 ImageNet 数据集上预训练过的权值。VGG16\
    \ 模型是一个简单而又被广泛使用的卷积神经网络架构，其结构如图 10-2 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_175_0.png)\n\
    \n图 10-2\n\nKeras 有一个标准的 VGG16 模型可以作为一个库来使用，预先计算好的权重也会被自动下载。首先导入要用的包，做好数据预处理，加载\
    \ ImageNet 数据集上预训练的 VGG16 模型，代码如图 10-3 所示。其中，参数 weights 使用预训练过的权值；参数 include_top\
    \ 指定模型最后是否包含网络的分类器，默认情况下这个分类器对应于 ImageNet 的 1000 个类别，因为我们打算使用自己的分类器（只有两个类别，cat\
