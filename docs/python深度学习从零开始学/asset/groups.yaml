    \ compile 方法对训练模型进行设置。如图 8-14 所示，设置 loss 为 categorical_crossentropy，设置 optimizer\
    \ 为 adam，设置 metrics 为 accuracy。\n\n```\n# 对训练模型进行设置\n#使用adam优化器，使用交叉熵作为损失函数\n\
    model.compile(loss='categorical_crossentropy', optimizer='adam', metrics=['accuracy'])\n\
