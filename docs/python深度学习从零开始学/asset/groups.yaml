    \n![](img/470b883072d48f1f2917a784b39d4327_97_0.png)\n\n图 5-18\n\n## 第 6 章\n深度学习框架\
    \ Keras 入门\n\nKeras 是一个极简的、高度模块化的神经网络库，采用 Python 开发，能够运行在 TensorFlow 平台，旨在完成深度学习的快速开发。Keras\
    \ 的开发重点是支持快速的实验，能够以最小的时延把我们的想法转换为实验结果，是做好神经网络研究工作的关键。\n\n### 6.1 Keras 架构简介\n\n\
    Keras 最初是作为 ONEIROS 项目（开放式神经电子智能机器人操作系统）研究工作的一部分而开发的。Keras 在希腊语中意为号角，是古希腊和拉丁文学中的一个文学形象，首次出现于《奥德赛》中，“梦神（Oneiroi，singular\
    \ Oneiros）从这两类人中分离出来：那些用虚幻的景象欺骗人类、通过象牙之门抵达地球之人，以及那些宣告未来即将到来、通过号角之门抵达地球之人”。\n\n\
    Keras 是一款使用纯 Python 语言编写的神经网络 API，使用 Keras 能够快速实现我们的深度学习方案，所以 Keras 有着“为快速试验而生”的美称。Keras\
    \ 以 TensorFlow、Theano、CNTK 为后端，即 Keras 的底层计算都是以这些框架为基础，这使得 Keras 能够专注于快速搭建神经网络模型。\n\
    \n众所周知，机器学习的三大要素是模型、策略、算法，如图 6-1 所示。模型是事先定义好的神经网络架构，深度学习的模型中一般有着上百万个权重，这些权重决定了输入数据\
    \ X 后模型会输出什么样的预测结果 Y，而所谓的“学习”就是寻找合适的权重，使得预测结果和真实目标尽可能接近。而说到接近就涉及了如何度量两个值的接近程度，这就是策略要做的事情，其实就是定义合适的目标函数（损失函数）。目标函数以真实目标\
    \ Y 和预测结果 Y' 作为输入，输出一个损失值作为反馈信号来更新权重以减少这个损失值，而具体实现这一步骤的就是算法，即图中的优化器，优化器的典型例子就是梯度下降及其各种变种。\n\
    \n图 6-1 清楚地描绘了神经网络的整个训练过程，开始时权重被初始化为一些随机值，所以其预测结果和真实目标 Y 相差较大，相应的损失值也会很大。随着优化器不断地更新权重，使得损失值也越来越小，最后当损失值不再减少时，我们就得到了一个训练好的神经网络。\n\
    \nKeras 的设计基本上也是按照这个思路，先定义整个网络，具体表现为添加各种各样的层，再指定相应的损失函数和优化器，之后就可以开始训练了。可以把层想象成深度学习的乐高积木。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_99_0.png)\n\n图 6-1\n\nKeras 的设计原则如下：\n\
    \n（1）模块性：模型可以理解为一个独立的序列或图，使用完全可配置的模块以最少的代价自由地组合在一起。具体而言，网络层、损失函数、优化器、初始化策略、激活函数、正则化方法等都是独立的模块，我们可以使用它们来构建自己的模型。\n\
    \n（2）极简主义：每个模块都应该尽量简洁。每一代码在初次阅读时都应该显得直观易懂，不能过于深奥难懂，否则它将给迭代和创新带来麻烦。\n\n（3）易扩展性：添加新模块是一个超级简单和容易的操作，只需要仿照现有的模块编写新的类或函数即可。由于\
    \ keras 在创建新模块方面的便利性使其更适合于研究工作。\n\nKeras 优先考虑开发人员的经验：\n\n- Keras 是为人而非机器设计的 API。Keras\
    \ 遵循减少认知困难这一准则，提供一致且简单的 API。\n- Keras 将常见案例所需的用户操作数量降至最低，并且在用户出现错误时提供清晰和可操作的反馈，这使\
    \ Keras 易于学习和使用。作为 Keras 用户，工作效率会更高，能够比竞争对手更快地尝试更多创意。\n- Keras 的易用性并不以降低灵活性为代价。因为\
    \ Keras 与底层深度学习语言（特别是 TensorFlow）集成在一起，可以让我们实现任何可以用基础语言编写的东西。特别是 tf.keras 作为 Keras\
    \ API 可以与 TensorFlow 工作流无缝集成。\n\n### 6.2 Keras 常用概念\n\nKeras 的核心数据结构是模型，也就是一种组织网络层的方式。在\
    \ Keras 中有两类主要的模型：Sequential（序列或序列）模型和使用函数式 API 的 Model 类模型。最主要的是 Sequential 模型，创建好一个模型后就可以调用\
    \ add() 方法向模型里面添加层。层就像是深度\n\n## Python深度学习从零开始学\n\n学习的乐高积木块，将相互兼容的、相同或者不同类型的多个层拼接在一起，建立起各种神经网络模型。模型搭建完毕后，需要使用\
    \ compile() 方法来编译模型，之后就可以开始训练和预测了。Sequential 的第一层需要接收一个关于输入数据 shape 的参数，而后面的各个层可以自动推导出中间数据的\
    \ shape，这个参数可以由 input_shape()、input_dim() 等方法传递。\n\n神经网络的基本数据结构就是层，常见的层简要说明如下：\n\
    \n- **Dense 层**：全连接层，全连接表示上一层的每一个神经元都和下一层的每一个神经元是相互连接的。卷积层和池化层的输出代表了输入图像的高级特征，全连接层的目的就是用这些特征将训练集进行分类。\n\
    - **Activatiion 层**：激活层，对一个层的输出使用激活函数。\n- **Dropout 层**：对输入数据使用 Dropout。Dropout\
    \ 将在训练过程的每次参数更新时按一定概率随机断开输入神经元。Dropout 层用于防止过拟合。\n- **Conv2D 层**：卷积层，它的很多参数使用与\
    \ Dense 类似。kernel_size 参数表示卷积核在高度和宽度上的大小，strides 参数表示卷积核在图像上移动的步长，padding 参数定义当过滤器落在边界外时，如何做边界填充。\n\
    - **Flatten 层**：用来将输入“压平”，即把多维的输入一维化，常用在从卷积层到全连接层的过渡。\n- **Reshape 层**：用来将输入 shape\
    \ 转换为特定的 shape。\n- **MaxPooling2D 层**：最大池化层，表示最大池化操作。\n- **GlobalAveragePooling2D\
    \ 层**：全局平均池化层。\n\n在深度学习中，输入数据一般都比较大，所以在训练模型时，一般采用批量数据而不是全部数据。深度学习的优化算法一般是梯度下降，通常需要把数据分为若干批，按批来更新参数，一个批中的一组数据共同决定本次梯度下降的方向，下降起来就不容易跑偏。Keras\
    \ 中的 batch 参数指的就是这个批，每个 batch 对应网络的一次更新。epochs 参数指的就是所有批次的单次训练迭代，也就是总数据的训练次数，每个\
    \ epoch 对应网络的一轮更新。\n\n构造好的模型需要进行编译，并且指定一些模型参数。compile() 方法用于编译模型，它接收三个参数：\n\n\
    - 优化器：已预定义的优化器名或一个 Optimizer 类对象，表示模型采用的优化方式。\n- 损失函数：已预定义的损失函数名或一个损失函数，表示模型试图最小化的目标函数。\n\
    - 评估指标（Metrics）：已预定义指标的名字或用户定制的函数，用于评估模型性能。\n\nfit() 方法用于训练模型，需要传入 NumPy 数组形式的输入数据和标签，可以指定\
    \ epochs（训练的轮数）和 batch_size（每个批包含的样本数）等参数。\n\n### 6.3 Keras 创建神经网络基本流程\n\n利用 Keras\
    \ 创建神经网络模型是非常快速和高效的，其模型实现的核心流程可以用五个步骤来概括，如图 6-2 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_101_0.png)\n\
    \n图 6-2\n\n假设我们建立一个神经网络模型，输入层有 784 个神经元，隐藏层有 256 个神经元，输出层有 10 个神经元，建立这样的模型很简单，只需将神经网络层一层一层地加上去即可。\n\
    \n## 1. 第一步：选择模型\n\nKeras 的核心数据结构是模型，一种组织网络层的方式。最简单的模型是 Sequential 模型，由多个网络层线性堆叠。对于更复杂的结构，我们应该使用\
    \ Keras 函数式 API，它允许构建任意的神经网络图。\n\n导入所需的模块，建立一个线性堆叠模型，即 Sequential 模型，代码如下：\n\n\
    ```\nfrom keras import models\nfrom keras import layers\nmodel = models.Sequential()\n\
    ```\n\n后续只需要使用 model.add() 方法将各个神经网络层加入模型即可。\n\n## 2. 第二步：构建网络层\n\n其实就是设计我们的网络结构，调用\
    \ Keras 神经网络的各个模块来组装我们的模型架构，通过 add 方法来叠加。这一步是最需要仔细考虑的地方，关乎我们的神经网络的复杂性和高效与否。Kearas\
    \ 已经内建各种神经网络层（例如 Dense 层、Conv2d 层），这里使用 moddel. add 方法加入 Dense 层。\n"
