    \ (Embedding) | (None, 380, 32) | 121600 |\n| dropout_1 (Dropout) | (None, 380,\
    \ 32) | 0 |\n| lstm_1 (LSTM) | (None, 32) | 8320 |\n| dense_1 (Dense) | (None,\
