    # 6.4.3 建立模型


    导入所需模块，建立 Keras Sequential 模型，后续只需要将各个神经网络层加入模型即可。这里使用 model.add 方法加入全连接层，建立多层感知器模型，采用经典的“输入层→中间层（隐藏层）→输出层”结构，如图
    6-11 所示。输入层有 9 个神经元（因为数据预处理后有 9 个特征字段）。隐藏层 1 有 80 个神经元，隐藏层 2 有 60 个神经元，隐藏层的激活函数用
    ReLU 函数。输出层只有 1 个神经元，激活函数选择 sigmoid 函数，sigmoid 函数特别适用于需要预测概率作为输出的模型，我们后续要预测乘客是否存活，概率只存在于
    0 到 1 之间，因此 sigmoid 函数是最适合我们这个模型选择。


