  mdcn: "\n## Python 深度学习从零开始\n\nLabel Encoder 就是把标签进行编码。比如标签是一串地名，无法直接输入到 sklearn\
    \ 的分类模型里作为训练标签，所以需要先把地名转换成数字。LabelEncoder 方法就是帮我们处理这个问题。\n\n示例代码如下：\n\n```\n######################\n\
    import numpy as np\nfrom sklearn.preprocessing import Imputer\nprint(\"##############\
    \ 缺失值补全 ##############\")\nimp = Imputer(missing_values='NaN', strategy='mean',\
    \ axis=0)\n# 训练模型，拟合出作为替换值的均值\nimp.fit([[1, 2], [np.nan, 3], [7, 6]])\nx = [[np.nan,\
    \ 2], [6, np.nan], [7, 6]]\nprint(x)\n# 处理需要补全的数据\nprint(imp.transform(x))\nprint(\"\
    ##LabelEncoder_标准化标签，将标签值统一转换成 range(标签值个数-1)范围内#\")\nfrom sklearn import preprocessing\n\
    data=[\"Japan\", \"china\", \"Japan\", \"Korea\",\"china\"]\nprint(data)\nle =\
    \ preprocessing.LabelEncoder()\nle.fit(data)\nprint(' 标签个数:%s' % le.classes_)\n\
    print(' 标签值标准化:%s' % le.transform(data))\ndata2=[\"Japan\", \"china\", \"china\"\
    , \"Korea\", \"Korea\"]\nprint(data2)\nprint(' 标签值标准化:%s' % le.transform(data2))\n\
    ##############################\n```\n\n运行代码，结果如图 7-7 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_122_0.png)\n\
    \n图 7-7\n\n上述代码中使用了 sklearn.preprocessing 库中的 Imputer 类，Imputer 中的参数解释如下：\n\n\
    - missing_values: 缺失值，可以为整数或 NaN，默认为 NaN。\n- strategy: 替换策略，默认用均值 “mean” 替换，还可以选择中位数\
    \ “median” 或众数 “most_frequent”。\n- axis: 指定轴数，默认 axis=0 代表列，axis=1 代表行。\n\n###\
    \ 7.2.3 数据预处理案例——独热编码\n\n在人工智能学习算法中，经常会遇到分类特征，例如，人的性别有男女，国家有中国、美国、法国等。这些特征值并不是连续的，而是离散的，无序的，通常需要对其进行特征数字化处理。其中一种可能的解决方法是采用独热编码。独热编码即\
    \ one-hot 编码，又称一位有效编码，其方法是使用 N 位状态寄存器来对 N 个状态进行编码，每个状态都有它独立的寄存器位，并且在任意时候，其中只有一位有效。可以这样理解，对于每一个特征，如果它有\
    \ m 个可能值，那么经过独热编码后，就变成了 m 个二元特征（如成绩这个特征有好、中、差，变成独热编码就是 100、010、001）。并且，这些特征互斥，每次只有一个被激活，因此，数据会变稀疏。\n\
    \n示例如下：\n\n```\n性别特征: [\"男\", \"女\"]\n国家特征: [\"中国\", \"美国\", \"法国\"]\n体育运动特征:\
    \ [\"足球\", \"篮球\", \"羽毛球\", \"乒乓球\"]\n```\n\n假如某个样本（某个人），她的特征是[\"女\",\"中国\",\"\
    羽毛球\"]，如何对这个样本进行特征数字化呢？即转化为数字表示后，样本要能直接用在分类器中，而分类器往往默认数据是连续的，并且是有序的。\n\n用独热编码解决上述问题，做法如下：\n\
    \n按照 N 位状态寄存器来对 N 个状态进行编码的原理进行处理后转换为，性别特征: [\"男\", \"女\"]（这里只有两个特征，所以 N=2）：\n\n\
    ```\n男  => 10\n女  => 01\n```\n\n国家特征: [\"中国\",\"美国\",\"法国\"]（N=3）转换为：\n\n```\n\
    中国  => 100\n美国  => 010\n法国  => 001\n```\n\n运动特征: [\"足球\",\"篮球\",\"羽毛球\",\"乒乓球\"\
    ]（N=4）转换为：\n\n```\n足球    => 1000\n篮球    => 0100\n羽毛球  => 0010\n乒乓球  => 0001\n\
    ```\n\n所以，当一个样本为[\"女\",\"中国\",\"羽毛球\"]的时候，其完整的特征数字化的结果为：\n\n```\n[0, 1, 1, 0,\
    \ 0, 0, 0, 1, 0]\n```\n\n程序代码如下：\n\n```\n#####################\nfrom sklearn import\
    \ preprocessing\n```\n## Python深度学习从零开始学\n\n```\nenc = preprocessing.OneHotEncoder()\n\
    data=[[0, 0, 3], [1, 1, 0], [0, 2, 1], [1, 0, 2]]\nprint('数据矩阵是4*3, 即4个数据, 3个特征维度:')\n\
    print(data)\nenc.fit(data)      # 使用 fit 来学习编码\nx=[[0, 1, 3]]\nprint('再来看要进行编码的参数:')\n\
    print(x)\nprint('onehot 编码的结果:')\nprint(enc.transform(x).toarray())\n################################\n\
    ```\n\n运行代码，结果如图 7-8 所示。数据矩阵是 4×3，即 4 个数据，3 个特征维度。观察数据矩阵，第一列为第一个特征维度，有两种取值 0/1，所以对应的编码方式为\
    \ 10、01。同理，第二列为第二个特征维度，有三种取值 0/1/2，所以对应编码方式为 100、010、001。同理，第三列为第三个特征维度，有四种取值\
    \ 0/1/2/3，所以对应编码方式为 1000、0100、0010、0001。再来看要进行编码的参数 [0, 1, 3]，0 作为第一个特征编码为 10，1\
    \ 作为第二个特征编码为 010，3 作为第三个特征编码为 0001，故此编码结果为 [1 0 0 1 0 0 0 0 1]。\n\n![](img/470b883072d48f1f2917a784b39d4327_124_0.png)\n\
    \n独热编码解决了分类器不好处理属性数据的问题，在一定程度上也起到了扩充特征的作用。它的值只有 0 和 1，不同的类型存储在垂直的空间。其缺点是当类别的数量很多时，特征空间会变得非常大。\n\
    \n独热编码用来解决类别型数据的离散值问题。将离散型特征进行独热编码是为了让距离计算更合理。但如果特征是离散的，并且不用独热编码就可以很合理地计算出距离，那么就没必要进行独热编码。例如，有些基于树的算法在处理变量时并不是基于向量空间度量，数值只是个类别符号，即没有偏序关系，所以不用进行独热编码。\n\
    \n### 7.2.4 通过数据预处理提高模型准确率\n\n数据预处理的意义究竟有多大？我们使用红酒的数据集来测试一下，这里使用多层神经网络模型（使用基于\
    \ Python 的 sklearn 机器学习算法库来构建多层神经网络模型），通过示例给读者一个数据预处理对模型的准确率的影响究竟有多大的理性认识。\n\n\
    程序代码和详细注释如下：\n\n```\n################################\n# 导入红酒数据集\nfrom sklearn.datasets\
    \ import load_wine\n# 导入 MLP 多层神经网络\nfrom sklearn.neural_network import MLPClassifier\n\
    # 导入数据拆分工具\n```\n```\nfrom sklearn.model_selection import train_test_split\n#\
    \ 红酒数据集\nwine = load_wine()\n# 把数据集拆分为训练集和数据集\nX_train, X_test, y_train, y_test\
    \ = train_test_split(wine.data,\n                                            \
    \        wine.target,\n                                                    random_state=62)\n\
    \nprint(X_train.shape, X_test.shape)\n# 设置神经网络的参数\n# MLP 的隐藏层为 2 个，每层有 100 个节点，最大迭代数为\
    \ 400\n# 指定 random_state 的数值为 62，为了重复使用模型，其训练的结果都是一致的\nmlp = MLPClassifier(hidden_layer_sizes=[100,100],max_iter=400,\n\
    \                    random_state=62)\n\n# 拟合数据训练模型\nmlp.fit(X_train, y_train)\n\
    # 输出模型得分\nprint('数据没有经过预处理模型得分:{:.2f}'.format(mlp.score(X_test, y_test)))\nfrom\
    \ sklearn.preprocessing import MinMaxScaler\nscaler = MinMaxScaler()\nscaler.fit(X_train)\n\
    X_train_pp = scaler.transform(X_train)\nX_test_pp = scaler.transform(X_test)\n\
    mlp.fit(X_train_pp, y_train)\nprint('数据预处理后的模型得分:{:.2f}'.format(mlp.score(X_test_pp,y_test)))\n\
    MinMaxScaler(feature_range=(0, 1), copy=True)\nMaxAbsScaler(copy=True)\n```\n\n\
    运行代码，结果如图 7-9 所示，训练集样本数目为 133，而测试集中样本数量为 45。我们用训练数据集来训练一个 MLP 多层神经网络（后面章节会详细介绍神经网络），在没有经过预处理的情况下，模型的得分只有\
    \ 0.24。当对数据集进行预处理后，模型的得分大幅提高，直接提升到了 1.00。\n\n![](img/470b883072d48f1f2917a784b39d4327_125_0.png)\n\
    \n### 7.3 常见的模型评估指标\n\n“没有测量，就没有科学。”这是科学家门捷列夫的名言。在计算机科学中，特别是在机器学习领域，对模型的测量和评估同样至关重要。只有选择与问题相匹配的评估方法，才能够快速发现在模型选择和训练过程中可能出现的问题，迭代地对模型进行优化。本节将总结机器学习、深度学习中最常见的模型评估指标，其中包括：\n\
    \n- Confusion Matrix（混淆矩阵）。\n- Precision。\n- Recall。\n- F1-score。\n- PRC（Precision\
    \ Recall Curve，精准率召回率曲线）。\n- ROC（Receiver Operating Characteristic，受试者工作特征）和 AUC（Area\
    \ Under Curve，曲线下方面积）。\n- IoU（Intersection over Union，交并比）。\n\n### 1. 混淆矩阵\n\n\
    看一看下面这个例子：假定水果批发商拉来一车苹果，我们用训练好的模型对这些苹果进行判别，显然可以使用错误率来衡量有多少比例的苹果被判别错误。但如果我们关心的是“挑出的苹果中有多少比例是优质的苹果”，或者“所有优质的苹果中有多少比例被挑出来了”，那么错误率显然就不够用了，这时我们需要引入新的评估指标，比如“精准率”“召回率”等更适合此类需求的性能度量。\n\
    \n在引入召回率和精准率之前，必须先理解什么是混淆矩阵，初学者很容易被这个矩阵搞得晕头转向。如图 7-10 所示，图（a）Confusion Matrix\
    \ 就是有名的混淆矩阵，而图（b）Definitions of metrics 则是由混淆矩阵推出的一些有名的评估指标。\n\n| | actual positive\
    \ | actual negative |\n|---|---|---|\n| predicted positive | TP | FP |\n| predicted\
    \ negative | FN | TN |\n\n(a) Confusion Matrix\n\nRecall = TP / (TP+FN)\nPrecision\
    \ = TP / (TP+FP)\nTrue Positive Rate = TP / (TP+FN)\nFalse Positive Rate = FP\
    \ / (FP+TN)\n\n(b) Definitions of metrics\n\n图 7-10\n\n首先解读一下混淆矩阵里的一些名词及其含义。根据混淆矩阵我们可以得到\
    \ TP、FN、FP、TN 四个值，显然 TP+FP+TN+FN= 样本总数。这四个值中都带两个字母，单纯记忆这四种情况是很难记得牢的，我们可以这样理解：第一个字母表示本次预测的正确性，T\
    \ 就是正确，F 就是错误；第二个字母则表示由分类器预测的类别，P 代表预测为正例，N 代表预测为反例。比如，TP 可以理解为分类器预测为正例（P），而且这次预测是对的（T）；FN\
    \ 可以理解为分类器的预测是反例（N），而且这次预测是错误的（F），正确结果是正例，即一个正样本被错误预测为负样本。我们使用以上的理解方式来记住 TP、FP、TN、FN\
    \ 的意思，应该就不再困难了。对混淆矩阵的四个值总结如下：\n\n- True Positive（TP，真正）：被模型预测为正的正样本。\n- True Negative（TN，\
    \ 真负）：被模型预测为负的负样本。\n- False Positive（FP，假正）：被模型预测为正的负样本。\n- False Negative（FN，假负）：被模型预测为负的正样本。\n\
    \n### 2. Precision、Recall、PRC、F1-score\n\nPrecision 即为精准率（或查准率），Recall 即为召回率（或查全率）。精准率\
    \ P 和召回率 R 的定义如图 7-11 所示。\n\n具体含义如下：\n\n- 精准率：是指在所有系统判定的“真”的样本中，确实是真的占比。\n- 召回率：是指在所有确实为真的样本中，被判定为“真”的占比。\n\
    \n而 Accuracy（准确率）的公式如图 7-12 所示。\n\nP = TP / (TP + FP)\nR = TP / (TP + FN)\n图 7-11\n\
    \naccuracy = (TP + TN) / (TP + FP + FN + TN)\n图 7-12\n\n精准率和准确率是不一样的。准确率针对所有样本；精准率针对部分样本，即正确的预测\
    \ / 总的正反例。\n\n精准率和召回率是一对矛盾的度量。一般而言，精准率高时，召回率往往偏低；而召回率高时，精准率往往偏低。从直观理解确实如此：我们如果希望优质的苹果尽可能多地被选出来，则可以通过增加选苹果的数量来实现；如果将所有苹果都选上了，那么所有优质苹果也必然被选上，但是这样精准率就会降低；若希望选出的苹果中优质的苹果的比例尽可能高，则只选最有把握的苹果，但这样难免会漏掉不少优质的苹果，导致召回率较低。通常只有在一些简单任务中，才可能使召回率和精准率都很高。\n\
    \n再来看 PRC，它是以精准率为 Y 轴、召回率为 X 轴作的曲线图，是综合评价整体结果的评估指标。哪种类型（正或者负）样本多，权重就大，也就是通常说的“对样本不均衡敏感”“容易被多的样品带走”。\n\
    \n如图 7-13 所示就是一幅 PrecisionRecall 表示图（简称 P-R 图），它能直观地显示出学习器在样本总体上的召回率和精准率，显然它是一条总体趋势递减的曲线。在进行比较时，若一个学习器的\
    \ PR 曲线被另一个学习器的 PR 曲线完全包住，则可断言后者的性能优于前者，比如图 7-13 中曲线 A 优于 C。但是 B 和 A 谁更好呢？因为 A、B\
    \ 两条曲线交叉了，所以很难比较，这时比较合理的判据就是比较 PR 曲线下的面积，该指标在一定程度上表征了学习器在精准率和召回率上取得相对“双高”的比例。因为这个值不容易估算，所以人们引入“平衡点”（BEP）来度量，它表示“精准率\
    \ = 召回率”时的取值，值越大表明分类器性能越好，以此来比较我们一下子就能判断出 A 较 B 好。\n\n![](img/470b883072d48f1f2917a784b39d4327_127_0.png)\n\
    \n## Python 深度学习从零开始学\n\n以 BEP 来度量有点过于简单了，更常用的是 F1-score 度量，其公式如图 7-14 所示。F1-score\
    \ 是一个综合考虑 Precision 和 Recall 的指标，比 BEP 更为常用。\n\n$F1 = \\frac{1}{\\frac{1}{P}+\\\
    frac{1}{R}} = \\frac{2 \\times P \\times R}{P+R}$\n\n图 7-14\n\n### 3. ROC 与 AUC\n\
    \nROC 全称是 Receiver Operating Characteristic（受试者工作特征）曲线，ROC 曲线以真正例率（True Positive\
    \ Rate，TPR）为 Y 轴，以假正例率（False Positive Rate，FPR）为 X 轴，对角线对应于随机猜测模型，而 (0, 1) 则对应理想模型，ROC\
    \ 形式如图 7-15 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_128_0.png)\n\n图 7-15\n\
    \nTPR 和 FPR 的定义如图 7-16 所示。\n\n从形式上看，TPR 就是之前提到的召回率 Recall，而 FPR 的含义就是所有确实为“假”的样本中被误判“真”的样本的比例。\n\
    \n$TPR = \\frac{TP}{TP+FN}$\n$FPR = \\frac{FP}{TN+FP}$\n\n图 7-16\n\n进行学习器比较时，ROC\
    \ 与 P-R 图相似，若一个学习器的 ROC 曲线被另一个学习器的 ROC 曲线包住，那么我们可以断言后者性能优于前者；若两个学习器的 ROC 曲线发生交叉，则可以比较\
    \ ROC 曲线下的面积，即 AUC，面积大的曲线对应的分类器性能更好。\n\nAUC 表示 ROC 曲线下方的面积，其值越接近 1 表示分类器越好，若分类器的性能极好，则\
    \ AUC 为 1。但现实生活中尤其是工业界不会有如此完美的模型，一般 AUC 的取值范围为 0.5 ~ 1。AUC 越高，模型的区分能力越好。\n\n图\
    \ 7-17 展现了三种 AUC 的值。\n"
