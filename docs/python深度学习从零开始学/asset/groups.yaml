    \n### 8.1 图像识别的基础知识\n\n人类是怎么识别图像的？当我们看到一个东西，大脑会迅速判断是不是见过这个东西或者与之类似的东西。这个过程有点像搜索，我们把看到的东西和记忆中相同或相类的东西进行匹配，从而识别它。机器的图像识别过程也是这样的，通过分类并提取重要特征并且排除多余的信息来识别图像，这就是图像识别的原理。\n\
    \n### 8.1.1 计算机是如何表示图像\n\n比如图像中有一只猫，但是计算机可以真正看到猫吗？答案是否定的，计算机看到的是数字矩阵。一般来说，我们可以将图像分类为灰度图像或彩色图像。先讨论灰度图像，计算机将灰度图像看作\
    \ 2D 矩阵。日常生活中我们说一幅画的大小是 1800×700 或 1300×700，这个大小表示的是画的宽度和高度。换句话说，如果图像的大小为 1300×700，则表示水平方向为\
    \ 1300 像素，垂直方向为 700 像素，总共有 910000（1300×700）像素，矩阵的维数将为（1300，700）。矩阵中的每个元素表示该像素中的亮度强度，取值范围为\
    \ 0～255，0 表示黑色，255 表示白色，数字越小，越接近黑色（数字大小决定黑色的强弱程度）。 例如，一幅大小为 18×18 的图像，对于其上的每一个像素，都可以用一个数字来描述它的灰度（或者亮度），通常灰度会用\
    \ 0-255 中的一个数字来表示，这样一幅图像就可以转化为一个矩阵，如图 8-1 所示。\n\n```\n[[ 9 1 29 70 114 76 0 8\
    \ 4 5 5 0 111 162 9 8 62 62]\n [ 3 0 33 61 102 186 34 0 0 0 0 49 182 150 1 12\
