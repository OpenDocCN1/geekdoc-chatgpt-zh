    \n图 6-24\n\n### 6.5.2 数据预处理\n\n在创建模型之前必须做数据预处理，主要从以下三个方面进行数据清洗工作：\n\n- （1）性别：这是一个二元类别的特征，需要转换为\
    \ 0/1 代码格式进行读取处理。\n- （2）城市：这是一个多元类别的特征，需要转换为多个二元类别的哑变量（Dummy Variable，又称虚拟变量、名义变量）。\n\
    - （3）姓名：这个字段对于客户流失与否的预测应该是完全不相关的，可以在进一步处理之前将其忽略。\n\n输出清洗之后的数据集的前五条数据，如图 6-25 所示。\n\
    \n```\n# 二元变量文本数字化\ndf_bank['Gender'].replace('Female',0,inplace = True)\ndf_bank['Gender'].replace('Male',1,inplace=True)\n\
    # 显示数字类别\nprint('Gender unique values',df_bank['Gender'].unique())\n# 多元变量独热编码为二元变量零数组，然后归回原始数据框\n\
    d_city = pd.get_dummies(df_bank['City'], prefix = 'City')\ndf_bank = pd.concat([df_bank,\
    \ d_city], axis=1)\n# 构建特征和标签集合\ny = df_bank['Exited']\nX = df_bank.drop(['Name',\
    \ 'Exited','City'], axis=1)\nX.head() # 显示前5行的特征集\n```\n\n|  | Gender | Age |\
