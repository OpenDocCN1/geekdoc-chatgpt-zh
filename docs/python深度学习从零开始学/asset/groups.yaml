    \ 的矩阵。\n- 在卷积层 1，采用 16 个由过滤器随机产生的 5×5 的零一矩阵和输入层的 28×28 的矩阵相乘后相加，变成 16 个 28×28\
    \ 的矩阵图像。卷积层的作用就是提取输入图像的特征，如边缘、线条和角。\n- 在池化层 1，将卷积层 1 输出的 16 个矩阵图像进行最大池化缩减采样，每\
    \ 4 个单元选出最大值进行缩减，变成 14×14 的矩阵图像，共 16 个。缩减采样可以减少所需处理的数据点，让图像位置差异变小，参数的数量和计算量下降。\n\
    - 在卷积层 2，将池化层 1 输入的 16 个 14×14 矩阵图像与采用 36 个由过滤器随机生成的 5×5 的零一矩阵相乘后相加，产生 36 个 14×14\
    \ 的矩阵图像。\n- 在池化层 2，将卷积层 2 产生的 36 个矩阵图像进行最大池化缩减采样，每 4 个单元选出最大值进行缩减，变成 7×7 的矩阵图像，共\
    \ 36 个。\n- 在平坦层，作为神经网络的输入部分，有 36×7×7=1764 个神经元。\n- 隐藏层有 128 个神经元。\n- 输出层有 10 个神经元。\n\
