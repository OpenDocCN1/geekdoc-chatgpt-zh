    # 前 言


    马克·库班（NBA 小牛队老板，亿万富翁）说过，“人工智能、深度学习和机器学习，不论你现在是否能够理解这些概念，你都应该学习。否则三年内，你就会像被灭绝的恐龙一样被社会淘汰。”


    马克·库班的这番话可能听起来挺吓人的，但道理是没毛病的！我们正经历一场大革命，这场革命就是由大数据和强大的电脑计算能力发起的。2016 年 3 月，震惊世界的
    AlphaGo 以 4:1 的成绩战胜李世石，让越来越多的人了解到人工智能的魅力，也让更多的人加入深度学习的研究。


    然而普通的程序员想要快速入门深度学习，就需要使用简单易懂的框架，自从 Google 公司开源了 TensorFlow 深度学习框架，深度学习这门技术便成为广大开发者最实用的技术。而
    Keras 框架使得编写神经网络模型更简单、更高效。


    深度学习如何高效入门可以说是 AI 领域老生常谈的一个问题了，一种路径是从传统的统计学习开始，然后跟着书上推公式学数学；另一种路径是从实验入手，毕竟深度学习是一门实验科学，可以通过学习深度学习框架
    TensorFlow 和 Keras 以及具体的图像识别的任务入手。对于想要快速出成果的同学来说，第一种方法是不推荐的，除非你的数学很强想去做一些偏理论的工作，对于大部分人来说还是从深度模型入手，以实验为主来学习比较合适。


    本书立足实践，以通俗易懂的方式详细介绍深度学习的基础理论以及相关的必要知识，同时以实际动手操作的方式来引导读者入门人工智能深度学习。


    # 示例源码、PPT 课件、数据集、开发环境与答疑服务


    本书提供示例源码、PPT 课件、数据集与开发环境，需用微信扫描右边的二维码，按扫描出来的页面提示填写自己的邮箱，把链接转发到邮箱中进行下载。欢迎读者发邮件和作者互动，作者答疑邮箱为
    booksaga@163.com，邮件主题为 “Python 深度学习从零开始学”。


