    \n![](img/470b883072d48f1f2917a784b39d4327_42_3.png)\n\n图 3-13\n\nSeries 的 index\
    \ 和 values 的元素之间虽然存在对应关系，但与字典的映射不同，index 和 values 实际仍为互相独立的 ndarray 数组。\n\n###\
