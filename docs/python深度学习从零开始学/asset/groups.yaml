    - 平坦层：将数据形状转为向量。\n- 全连接层（隐藏层）：维度为 128，即 128 个神经元，使用 ReLU 作为激活函数。\n- 加入 Dropout\
    \ 层避免过拟合，每次训练过程，会随机放弃一定数量神经元。\n- 全连接层（输出层）：维度为 10（共有 10 个神经元，对应 0~9 共 10 个数字），使用\
    \ softmax 作为激活函数，输出每个分类的概率。对于分类问题，最后一层往往会使用一个维度与类别数量相同、激活函数为 softmax 的层作为全连接层。\n\
    \n程序代码如图 8-12 所示，Keras 提供了非常方便的搭建卷积神经网络的方法，建立一个 Sequential 线性堆叠模型，后续只需要使用 model.add()\
    \ 方法将各个神经网络层加入模型即可。\n\n查看这个卷积神经网络模型摘要，显示结果如图 8-13 所示。这个卷积神经网络包含了输入层、卷积层 1、池化层\
    \ 1、卷积层 2、池化层 2、平坦层、全连接层（隐藏层）、全连接层（输出层），并且加入 Dropout 层来避免过拟合。\n\n## Python 深度学习从零开始学\n\
    \n```\n```python\nfrom keras.models import Sequential\nfrom keras.layers import\
