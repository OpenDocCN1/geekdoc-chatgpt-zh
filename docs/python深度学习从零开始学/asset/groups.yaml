    要说到深度学习图像分类的经典案例之一，那就是猫狗识别大战了。猫和狗在外观上的差别还是挺明显的，无论是体型、四肢、脸庞和毛发等，都是能通过肉眼很容易进行区分的。那如何让机器来识别猫和狗呢？这就需要用到卷积神经网络，具体实现可以使用
    Keras 框架。


