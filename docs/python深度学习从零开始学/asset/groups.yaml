    层卷积（也可以说是滤波器）都会提取数据中最有效的特征。这种方法可以提取到图像中最基础的特征，比如不同方向的边或者拐角，而后再进行组合和抽象形成更高阶的特征。网络前面的卷积层捕捉图像局部、细节信息，后面的卷积层的感受野逐层加大，用于捕获图像更复杂、更抽象的信息。经过多个卷积层的运算，最后得到图像在各个尺度的抽象表示。


    在图像处理领域，卷积也是一种常用的运算，不仅可用于图像去噪、增强、边缘检测等问题，还可以提取图像的特征。卷积运算用一个卷积核矩阵自上而下、自左向右地在图像上滑动，将卷积核矩阵的各个元素与它在图像上覆盖的对应位置的元素相乘，然后求和，得到输出像素值。


    通过卷积核作用于输入图像的所有位置，我们可以得到图像的边缘图。边缘图在边缘位置有更大的值，在非边缘处的值接近于0。如图8-3所示为对图像卷积的结果，左边为输入图像，右边为卷积后的结果。


