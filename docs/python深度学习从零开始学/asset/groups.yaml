    \n# 12.3 图像风格迁移总结\n\n图像的内容和风格是可以分离的，可以通过神经网络的方式将图像的风格进行自由交换。风格的迁移即可转化成这样一个问题：让生成图像的内容与内容来源图像尽可能相似，让图像的风格与风格来源图像尽可能相似。\n\
    \n那么如何才能将图像的风格提取出来呢？纹理能够描述一个图像的风格，也就是说只要提取出图像的纹理就可以了。那么如何提取出图像的纹理呢，VGG 卷积神经网络其实就相当于一堆局部特征识别器，在\
    \ VGG 网络的基础上套了一个格拉姆矩阵用来计算不同局部特征的相关性，把它变成一个统计模型，这样就完成了图像纹理的提取。\n\n直接把局部特征看作近似的图像内容，这样就得到了一个将图像内容与纹理分开的系统。而将内容与纹理合成的方法，就是\
