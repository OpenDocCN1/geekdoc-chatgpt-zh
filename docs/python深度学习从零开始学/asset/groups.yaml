    - (2) 不属于同一量纲即数据的规格不一样的数据，不能够放在一起比较。\n- (3) 对于某些定量数据，其包含的有效信息为区间划分，例如学习成绩，假如只关心“及格”或“不及格”，那么需要将定量的考分转换成“1”和“0”来表示及格和不及格。二值化可以解决这一问题。\n\
    - (4) 大部分人工智能学习算法要求输入的数据必须是数字，不能是字符串，因为大部分算法无法直接处理描述变量，因此需要将描述变量转化为数字型变量。\n- (5)\
    \ 某些算法对数据归一化敏感，标准化可大大提高模型的精度。标准化即将样本缩放至指定的范围，标准化可消除样本间不同量级带来的影响（大数量级的特征占据主导地位；量级的差异将导致迭代收敛速度减慢；所有依赖于样本距离的算法对数据的量级都非常敏感）。\n\
    - (6) 在数据集中，样本往往会有很多特征，并不是所有特征都有用，只有一些关键的特征对预测结果起决定性作用。\n\n## 7.2 数据预处理方法介绍\n\n\
    当我们对一批原始的数据进行预处理时，具体步骤如下：\n\n- 步骤01 首先要明确有多少特征，哪些是连续的，哪些是类别的。\n- 步骤02 检查有没有缺失值，对缺失的特征选择恰当方式进行填补，使数据完整。\n\
    - 步骤03 对连续的数值型特征进行标准化，使得均值为 0，方差为 1。\n- 步骤04 对类别型的特征进行独热编码。\n- 步骤05 将需要转换成为类别型数据的连续型数据进行二值化。\n\
    - 步骤06 为防止过拟合或者其他原因，选择是否要将数据进行正则化。\n\n数据预处理的工具有许多，比较常用的主要有两种：Pandas 库的数据预处理和 sklearn\
    \ 库中的 sklearn.preprocessing 数据预处理。本章主要介绍使用 sklearn.preprocessing 包进行数据预处理。\n\n\
    ## 7.2.1 数据预处理案例——标准化、归一化、二值化\n\n在人工智能学习算法实践中，我们往往有着将不同规格的数据转换到同一规格，或不同分布的数据转换到某个特定分布的需求，这种需求统称为将数据“无量纲化”。无量纲化的目的是为了消除各评价指标间量纲和数量级的差异，以保证结果的可靠性，这就需要对各指标的原始数据进行特征缩放（特征缩放即数据标准化、数据归一化的笼统说法）。\n\
    \n如图 7-1 所示，对于房屋面积 x1，其数值明显很大，若 x1 不做处理，那么当 x1=2104 和 x2=3 时，x2 就没意义了（x2 的值太小），因此要做特征缩放。\n\
    \n![](img/470b883072d48f1f2917a784b39d4327_119_0.png)\n\n图 7-1\n\n## Python 深度学习从零开始学\n\
    \n标准化是将数据按照比例缩放，使之放到一个特定区间中，标准化后的数据的均值为0，标准差为1。这里解释一下均值和标准差的概念。均值的概念很简单：所有数据之和除以数据点的个数，以此表示数据集的平均大小；其数学定义如图7-2所示。\n\
    \n说到标准差这个概念，我们先要了解一下方差的概念，方差的目的是为了表示数据集中数据点的离散程度，其数学定义如图7-3所示。\n\n标准差与方差一样，表示的也是数据点的离散程度，其在数学上定义为方差的平方根，如图7-4所示。\n\
    \nx̄ = (x₁ + x₂ + ⋯ + xₙ) / n\n图 7-2\ns²_N = 1/N Σᵢ₌₁^N (xᵢ - x̄)²\n图 7-3\ns_N\
    \ = √[1/N Σᵢ₌₁^N (xᵢ - x̄)²]\n图 7-4\n\n我们想要的是标准差，方差只是中间计算过程，方差单位和数据单位不一致，没法使用。标准差和衡量的数据单位一致，使用起来会很方便。\n\
    \n标准化的数据可正可负，只不过归一化将数据映射到了 [0,1] 这个区间中，如图 7-5 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_120_0.png)\n\
    \n图 7-5\n\n把数据缩放到给定的范围内，通常在 0 和 1 之间，或者使用每个特征的最大绝对值按比例缩放到单位大小。标准化后的数据是类似标准正态分布！标准化比归一化更加常用，因为归一化后数据会为\
    \ 0。\n\n在大多数算法中，会选择 sklearn.preprocessing.StandardScaler 函数来进行特征缩放，因为 MinMaxScaler\
    \ 函数对异常值非常敏感。在聚类、逻辑回归、神经网络这些算法中，StandardScaler 往往是最好的选择。MinMaxScaler 在不涉及距离度量、梯度、协方差计算以及数据需要被压缩到特定区间时使用广泛，比如数字图像处理中量化像素强度时，都会使用\
    \ MinMaxScaler 将数据压缩在 [0,1] 区间中。\n\n示例代码如下：\n\n```\n####################################\n\
    import numpy as np\ndata = np.array([[3,-1.7,3.5,-6],\n                [0,4,-0.3,2.5],\n\
    \                [1,3.5,-1.8,-4.5]])\nprint('原始数据: ')\nprint(data)\nfrom sklearn.preprocessing\
    \ import StandardScaler\ndata_standardscaler=StandardScaler().fit_transform(data)\n\
    print('原始数据使用 StandardScaler 进行数据标准化处理后:')\nprint(data_standardscaler)\nfrom sklearn.preprocessing\
    \ import MinMaxScaler\ndata_minmaxscaler=MinMaxScaler(feature_range=(0,1)).fit_transform(data)\n\
    print('原始数据使用 MinMaxScaler 进行归一化处理（范围缩放至[0-1]）后:')\nprint(data_minmaxscaler)\n\
    from sklearn.preprocessing import Binarizer\ndata_binarizer=Binarizer().fit_transform(data)\n\
    print('原始数据使用 binarizer 进行二值化处理后:')\nprint(data_binarizer)\n#####################################################\n\
    ```\n\n运行代码，结果如图 7-6 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_121_0.png)\n\
    \n图 7-6\n\nStandardScaler 标准化原理是将特征数据的分布调整成标准正态分布（也叫高斯分布），也就是使得数据的均值为 0，方差为 1，这样就可以确保数据的“大小”都是一致的，更有利于模型的训练。而\
    \ MinMaxScaler 把所有的数据缩放到 0 和 1 之间。除了对数据进行缩放之外，我们还可以使用 Binarizer 对数据进行二值化处理，将不同的数据全部处理为\
    \ 0 或 1 这两个数值。归一化其实就是标准化的一种方式，只不过归一化是将数据映射到了 [0,1] 这个区间中。\n\n## 7.2.2 数据预处理案例——缺失值补全、标签化\n\
