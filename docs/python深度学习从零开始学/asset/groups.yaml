    \    model.add(Dense(10, activation='softmax'))\n    return model\n# 建立模型\nmodel\
    \ = baseline_model()\nprint(model.summary())#查看模型概况\n```\n```\n\n图 8-12\n\n| Layer\
    \ (type) | Output Shape | Param # |\n|---|---|---|\n| conv2d_1 (Conv2D) | (None,\
