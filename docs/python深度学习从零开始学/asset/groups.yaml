    神经元数量：14×14×6。

    S2 中每个特征图的大小是 C1 中特征图大小的 1/4。


    ![](img/470b883072d48f1f2917a784b39d4327_68_0.png)


    第一次卷积之后紧接着就是池化运算，使用 2×2 池化核进行池化，于是得到了 S2，6 个 14×14 的特征图（28/2=14）。池化的大小，选择 2×2，也就是相当于对
    C1 层 28×28 的图片进行分块，每个块的大小为 2×2，这样我们就可以得到 14×14 个块，然后统计每个块中最大的值作为下采样的新像素，因此我们可以得到
    S2 结果为：14×14 大小的图片，共有 6 幅这样的图片，神经元个数 14×14×6=1176。S2 中每个特征图的大小是 C1 中特征图大小的 1/4。S2
    这个池化层是对 C1 中的 2×2 区域内的像素求和乘以一个权值系数再加上一个偏移，然后将这个结果再做一次映射。于是每个池化核有两个训练参数，所以共有 2×6=12
    个训练参数，但是有 5×14×14×6=5880 个连接。


    ### 4. C3——卷积层


    - 输入：S2 中所有 6 个或者几个特征图组合。

    - 卷积核大小：5×5。

    - 卷积核种类：16。

    - 输出特征图大小：10×10。


    ![](img/470b883072d48f1f2917a784b39d4327_68_1.png)


    第一次池化之后是第二次卷积，第二次卷积的输出是 C3，16 个 10×10 的特征图，卷积核大小是 5×5。我们知道 S2 有 6 个 14×14 的特征图，C3
    层比较特殊，在于它要将第一次卷积池化得到的 6 个特征图变成 16 个特征图，它通过将每个特征图连接到上层的 6 个或者几个特征图，而不是把 S2 中的所有特征图直接连接到每个
    C3 的特征图，从而来提取不同的特征。这样做的原因是不完全的连接机制可以使得连接数量保持在合理的范围内，另外可以保证 C3 中的特征图提取到不同的特征。


    ### 5. S4——池化层


    - 输入图片尺寸：10×10。

    - 输出特征图大小：5×5（10/2）。

    - 神经元数量：5×5×16=400。


    ![](img/470b883072d48f1f2917a784b39d4327_68_2.png)


    S4 是池化层，窗口大小仍然是 2×2，共计 16 个特征图，C3 层的 16 个 10×10 的图分别进行以 2×2 为单位的池化得到 16 个 5×5
    的特征图。这一层有 2×16=32 个训练参数，5×5×5×16=2000 个连接。连接的方式与 S2 层类似。


    ### 6. C5——卷积层


    - 输入：S4 层的全部 16 个单元特征图。

    - 卷积核大小：5×5。

    - 可训练参数 / 连接：120×(16×5×5+1)=48120。


    C5层是一个卷积层。我们继续用5×5的卷积核进行卷积，然后希望得到120个特征图。由于S4层的16个图的大小为5×5，与卷积核的大小相同，所以卷积后形成的图的大小为1×1。这里形成120个卷积结果，每个都与上一层的16个图相连，所以共有(5×5×16+1)×120=48120个参数，同样有48120个连接。


    ### 7. F6——全连接层


    输入：C5的120维向量。


    计算方式：计算输入向量和权重向量之间的点积，再加上一个偏置，结果通过sigmoid函数输出。


    可训练参数：84×(120+1)=10164。


    F6层有84个节点，对应于一个7×12的比特图，-1表示白色，1表示黑色，这样每个符号的比特图的黑白色就对应于一个编码。该层的训练参数和连接数是(120+1)×84=10164。


    ### 8. OUTPUT——输出层


    OUTPUT层也是全连接层，最后得到10个分类，对应数字0~9，共有10个节点，这10个节点分别代表着数字0~9。判断的标准是，如果某个节点输出为0（或越接近），那么该节点在本层中的位置就是网络识别得出的数字。


    总结一下，LeNet5是一个7层网络，包括两层卷积、两层池化、三层全连接，输出数据用softmax进行处理。LeNet5网络是这样预测单幅图片的：首先，将图片归一化下采样为28×28，之后进行卷积操作，将一幅28×28的图片卷积成6幅24×24的图片，在这一步中，图片的大小减少了，但深度增加了，直观理解就是“特征”更强了；之后进行最大池化，过滤掉相对不重要的像素，得到6幅12×12的图片；再进行一遍相似的卷积和池化操作，最终得到16幅4×4的图片；将这16幅图片拉成一个向量，进行全连接层操作，得到120→84→10的向量；再经过softmax层进行预测，得到预测结果。我们要训练的参数是卷积核，每一层的卷积核都是5×5的，通过对卷积核的参数值进行学习，最终会获得一组合适的卷积核，用它们进行卷积可以让网络的预测准确值稳定在98%左右。


    LeNet5虽然是一个只有7层的小网络，但却是当之无愧的开创性工作。卷积使得神经网络可以共享权值，一方面减少了参数，另一方面可以学习图像不同位置的局部特征。


    ## 4.3.2 AlexNet


    AlexNet在2012年被提交给ImageNet ILSVRC挑战赛，分类结果明显优于第二名。该网络使用更多层数，使用ReLU激活函数和0.5概率的Dropout来对抗过拟合。由于AlexNet相对简单的网络结构和较小的深度，使其在今天仍然被广泛使用。


    AlexNet是Hinton和他的学生Alex Krizhevsky设计的，是2012年ImageNet比赛的冠军，也是第一个基于卷积神经网络的ImageNet冠军，它的网络比LeNet5更深。


    AlexNet包含5个卷积层和3个全连接层，模型示意图如图4-25所示。


    ![](img/470b883072d48f1f2917a784b39d4327_70_0.png)


    图 4-25


    AlexNet 为 8 层结构，其中前 5 层为卷积层，后面 3 层为全连接层。引入 ReLU 激活函数，成功解决了 Sigmoid 函数在网络较深时的梯度弥散问题。使用最大值池化，避免平均池化的模糊化效果。并且，池化的步长小于核尺寸，这样使得池化层的输出之间会有重叠和覆盖，提升了特征的丰富性。


    另外，为提高运行速度和网络运行规模，AlexNet 采用 two-GPU 的设计模式，并且规定 GPU 只能在特定的层进行通信交流，其实就是每一个 GPU
    负责一半的运算处理。实验数据显示，two-GPU 方案会比只用 one-GPU 运行半个上面大小网络的方案，在准确度上提高了 1.7% 的 top-1 和
    1.2% 的 top-5。


    ## 4.3.3 VGGNet


    ILSVRC 2014 的第二名是 Karen Simonyan 和 Andrew Zisserman 实现的卷积神经网络，现在称其为 VGGNet。它的主要贡献是展示出网络的深度是算法优良性能的关键部分。


    VGGNet 网络结构如图 4-26 所示，A、A-LRN、B、C、D、E 这 6 种网络结构相似，都是由 5 层卷积层、3 层全连接层组成，其中区别在于每个卷积层的子层数量不同，从
    A 至 E 依次增加（子层数量从 1 到 4），总的网络深度从 11 层到 19 层（添加的层以粗体显示）。例如图中的 conv3-128，表示使用 3×3
    的卷积核，通道数为 128。网络结构 D 就是著名的 VGG16，网络结构 E 就是著名的 VGG19。VGG16 是一个 16 层的神经网络，不包括最大池化层和
    softmax 层，因此被称为 VGG16。而 VGG19 由 19 个层组成。


    这些网络都遵循一种通用的设计，输入到网络的是一个固定大小的 224×224 的 RGB 图像，所做的唯一预处理是从每个像素减去基于训练集的平均 RGB 值。图像通过一系列的卷积层时，全部使用
    3×3 大小的卷积核。每个网络配置都是 5 个最大池化层，最大池化层的窗口大小为 2×2，步长为 2。卷积层之后是三个完全连接层，前两层有 4096 个通道，第三层执行的是
    1000 路 ILSVRC 分类，因此包含 1000 个通道（每个类一个）。最后一层是 softmax 层。在 A~E 所有网络中，全连接层的配置是相同的。所有的隐藏层都用
    ReLU 方法进行校正。


