    ## 1.4.3 机器学习和深度学习的关系和对比


    Google 的 AlphaGo（阿尔法狗）与李世石九段进行了惊天动地的大战，AlphaGo 最终以绝对优势完胜李世石九段，击败棋圣李世石的 AlphaGo
    所用到的算法，实际上就是基于神经网络的深度学习算法。人工智能、机器学习、深度学习成为这几年计算机行业、互联网行业最火的技术名词。


    如图 1-2 所示，深度学习属于机器学习的子类。它的灵感来源于人类大脑的工作方式，是利用深度神经网络来解决特征表达的一种学习过程。深度神经网络本身并非一个全新的概念，可以理解为包含多个隐藏层的神经网络结构。为了提高深度神经网络的训练效果，人们对神经元的连接方法以及激活函数（Activation
    Function）等方面做出了调整。其目的在于建立模拟人脑进行分析学习的神经网络，模仿人脑的机制来解释或“理解”数据，如文本、图像、声音等。


    ![](img/470b883072d48f1f2917a784b39d4327_18_0.png)


    图 1-2


    如果是传统的机器学习的方法，我们会首先定义一些特征，比如有没有胡须、耳朵、鼻子、嘴巴的模样等。总之，我们首先要确定相应的“面部特征”作为机器学习的特征，以此来对我们的对象进行分类识别。


    现在，深度学习的方法则更进一步。深度学习会自动地找出这个分类问题所需要的重要特征！传统机器学习则需要我们人工地给出特征！


    那么，深度学习是如何做到这一点的呢？还是以识别猫和狗的例子来说明，按照以下步骤：


    - 步骤 01 首先确定出有哪些边和角与识别出猫和狗的关系最大。

    - 步骤 02 然后根据上一步找出的很多小元素（边、角等）构建层级网络，找出它们之间的各种组合。

    - 步骤 03 在构建层级网络之后，就 可以确定哪些组合可以识别出猫和狗。


    深度学习的“深”是因为它通常会有较多的隐藏层，正是因为有那么多隐藏层存在，深度学习网络才拥有表达更复杂函数的能力，也才能够识别更复杂的特征，继而完成更复杂的任务。有关机器学习与深度学习，我们从如下几个方面进行比较。


    ### 1. 数据依赖


    机器学习能够适应各种规模的数据量，特别是数据量较小的场景。如果数据量迅速增加，那么深度学习的效果将更加突出，如图 1-3 所示。这是因为深度学习算法需要大量数据才能完美理解。随着数据量的增加，二者的表现有很大区别。


    ![](img/470b883072d48f1f2917a784b39d4327_19_0.png)


    图 1-3


    从数据量对不同方法的影响来看，我们可以发现深度学习适合处理大数据，而数据量比较小的时候，用传统的机器学习的方法也许更合适，结果更好。为了实现高性能，深层网络需要非常大的数据集，之前提到的预先训练过的神经网络用了
    120 万幅图像进行训练。对于许多应用来说，这样的大数据集并不容易获得，并且花费昂贵且非常耗时。对于较小的数据集，传统的机器学习算法通常优于深度学习网络。


    ### 2. 硬件依赖


    深度学习十分地依赖高端硬件设施，因为计算量实在太大了！深度学习中涉及很多的矩阵运算，因此很多深度学习都要要求有 GPU 参与运算，因为 GPU 就是专门为矩阵运算而设计的。相反，机器学习随便给一台普通的计算机就可以运行，物美价廉。深度学习网络需要高端
    GPU 辅助大数据集的训练，这些 GPU 非常昂贵，但是深层网络的训练过程离不开高性能的 GPU，此外，还需要快速的 CPU、SSD 存储以及快速且大容量的
    RAM。


    传统的机器学习算法只需要一个“体面”的 CPU 就可以训练得很好，对硬件的要求不高。由于它们在计算上并不昂贵，可以更快地迭代，因此在更短的时间内可以尝试更多不同的技术。


    ### 3. 特征工程


    特征工程就是指我们在训练一个模型的时候，首先需要确定有哪些特征。在机器学习方法中，几乎所有的特征都需要通过行业专家来确定，然后手工对特征进行编码。而深度学习算法试图自己从数据中学习特征，这也是深度学习十分引人注目的一点，毕竟特征工程是一项十分烦琐、耗费很多人力物力的工程，深度学习的出现大大减少了发现特征的成本。


    经典的机器学习算法通常需要复杂的特征工程。首先在数据集上执行深度探索性数据分析，然后做一个简单的降低维数的处理，最后必须仔细选择最佳特征以传递给机器算法。当使用深度网络时，不需要这样做，因为只需将数据直接传递给网络，通常就可以实现良好的性能。这完全消除了原有的大型和具有挑战性的特征工程阶段。


    ### 4. 运行时间


    运行时间是指训练算法所需要的时间量。一般来说，深度学习算法需要花大量时间来进行训练，因为该算法包含有很多参数，因此训练时间更长。顶级的深度学习算法需要花几周的时间来完成训练。相对而言，普通机器学习算法的执行时间较短，一般几秒钟、最多几小时就可以训练好。不过，深度学习花费这么大力气训练出模型肯定不会白费力气的，其优势就在于模型一旦训练好，在预测任务上会运行得更快、更准确。


    ### 5. 可理解性


    最后一点，也是深度学习的一个缺点（其实也说不上是缺点），那就是在很多时候我们难以理解深度学习。一个深层的神经网络，每一层都代表一个特征，而层数多了，我们也许根本就不知道它们代表的是什么特征，也就没法把训练出来的模型用于对预测任务进行解释。例如，我们用深度学习方法来批改论文，也许训练出来的模型对论文评分都十分准确，但是我们无法理解模型到底是什么规则，于是那些拿了低分的同学找你质问“凭什么我的分数这么低啊？”你也哑口无言，因为深度学习模型太复杂，内部的规则很难理解。


    但是传统机器学习算法不一样，比如决策树算法，就可以明确地把规则列出来，每一个规则，每一个特征，我们都可以理解。此外，调整超参数并更改模型设计也很简单，因为我们对数据和底层算法都有了更全面的了解。相比较而言，深度学习网络是个“黑匣子”，研究人员无法完全了解深层网络的“内部”。


    ## 1.5 小白如何学深度学习


    很早之前，听雷军说过一句话：“站在风口上，猪都可以飞起来！”这句话用来形容现在的深度学习非常贴切。近几年来，深度学习的发展极其迅速，其影响力已经遍地开花，在医疗、自动驾驶、机器视觉、自然语言处理等各个方面大显身手。在深度学习这个世界级的大风口上，谁能抢先进入深度学习领域，学会运用深度学习技术，谁就能真正地在AI时代“飞”起来。


    对于每一个想要开始学习深度学习方法的大学生、程序员或者其他转行的人来说，最头疼也是最迫切的需求就是深度学习该如何入门呢？下面筆者谈一谈自己的看法。


    ## 1.5.1 关于两个“放弃”


    ### 1. 放弃海量资料


    没错，就是放弃海量资料！在我们想要入门深度学习的时候，往往会搜集很多资料，什么某某学院深度学习内部资源、深度学习从入门到进阶百GB资源、某某人工智能教程，等等。很多时候我们拿着十几GB、几百GB的学习资源，将其踏踏实实地存储在某云盘里，等着日后慢慢学习。殊不知，有90%的人仅仅只是搜集资料、保存资料而已，放在云盘里一年半载都忘了去学习。躺在云盘的资料很多时候只是大多数人“以后好好学习”的自我安慰和自我安全感而已。而且，面对海量的学习资料，很容易陷入一种迷茫的状态，最直接的感觉就是：天啊，有这么多东西要学！天啊，还有这么多东西没学！简单来说，就是选择越多，越容易让人陷入无从选择的困境。


    所以，第一步就是要放弃海量资料！转而选择一份真正适合自己的资料，好好研读下去、消化它！最终会发现，这样做收获很大。


    ### 2. 放弃从数学基础起步


    深度学习的初学者，总会在学习路径上遇到困惑。先是那一系列框架，就让我们不知道该从哪儿着手。一堆书籍，也让我们犹豫该如何选择。即便去咨询专业人士，他们也总会轻飘飘地告诉我们一句“先学好数学”。怎样算是学好？深度学习是一门融合概率论、线性代数、凸优化、计算机、神经科学等多方面的复杂技术。学好深度学习需要的理论知识很多，有些人可能基础不是特别扎实，就想着从最底层的知识开始学起，概率论、线性代数、凸优化公式推导，等等。但是这样做的坏处是比较耗时间，而且容易造成“懈怠学习”，打击了学习的积极性，直到自己彻底放弃学习。真要是按照他们的要求，按部就班去学，没有个几年时间，我们连数学和编程基础都学不完。可到那时候，许多“低垂的果实”还在吗？


    因为啃书本和推导公式相对来说比较枯燥，远不如直接搭建一个简单的神经网络更能激发自己学习的积极性。当然，不是说不需要钻研基础知识，只是说，在入门的时候，最好先从顶层框架上开始，有个系统的认识，然后再从实践到理论，有放矢地查漏补缺机器学习的知识点。从宏观到微观，从整体到细节，更有利于深度学习快速入门！而且从学习的积极性来说，也起到了“正反馈”的作用。


    ## 1.5.2 关于三个“必须”


    谈完了深度学习入门的两个“放弃”之后，我们来看下一步，深度学习究竟该如何快速入门？


    ### 1. 必须选择编程语言：Python


    俗话说“工欲善其事，必先利其器！”学习深度学习，掌握一门合适的编程语言非常重要！最佳的选择就是 Python。为什么人工智能、深度学习会选择 Python
    呢？一方面是因为 Python 作为一门解释型语言，入门简单、容易上手。另一方面是因为 Python 的开发效率高，Python 有很多库很方便用于人工智能算法，比如
    NumPy 做数值计算，Sklearn 做机器学习，Matplotlib 将数据可视化，等等。总的来说，Python 既容易上手，又是功能强大的编程语言。可以毫不夸张地说，Python
    可以支持从航空航天器系统的开发到小游戏开发的几乎所有领域。


    这里笔者要为 Python 疯狂打 call，因为 Python 作为万能的胶水语言，能做的事情实在太多了，并且它还异常容易上手。笔者大概花了 50 个小时学习了
    Python 的基础语法，然后就开始动手编写代码去爬小说、爬网易云音乐的评论等程序。


    总之，Python 是整个学习过程中并不耗费精力的环节，但是刚开始背记语法确实是很无聊、很无趣的，需要坚持一下。


    ## Python深度学习从零开始学


    ### 2. 必须选择一个或两个最好的深度学习框架


    对于业界的人工智能项目，一般的原则都是“不重复造轮子”：不会去从零开始编写一套机器学习的算法，往往是选择采用一些已有的算法库和算法框架。以前，我们可能会选用已有的各种算法来解决不同的机器学习问题。现在随着深度学习的流行，一套神经网络框架
    TensorFlow、Keras 等就可以解决几乎所有的机器学习问题，进一步降低了机器学习任务的开发难度。如果说 Python 是我们手中的利器，那么一个好的深度学习框架就无疑给了我们更多的资源和工具，方便我们实现庞大、高级、优秀的深度学习项目。


    奥卡姆剃刀定律（Occam''s Razor, Ockham''s Razor），又称为“奥康的剃刀”，它是由14世纪英格兰的逻辑学家、圣方济各会修士奥卡姆的威廉（William
    of Occam，约1285年至1349年）提出。这个原理称为“如无必要，勿增实体”，即“简单有效原理”。正如他在《箴言书注》2卷15题所说“切勿浪费较多东西去做事情，用较少的东西同样可以做好事情。”


    深度学习底层的结构实际很复杂。然而，作为应用者，我们只需要几行代码就能实现神经网络，加上数据读取和模型训练，也不过寥寥十来行左右的代码。感谢科技的进步，深度学习的用户接口，越来越像搭积木。只要我们投入适当的学习成本，就总能很快学会的。


    TensorFlow是可以把一个模型代码量大大减少的框架，Keras就是让模型代码量可以少到令人震惊的一种框架，当用Keras写完第一个模型后，笔者的心情真的是无比激动。


    本章介绍猫和狗分类的例子，如果这个分类器模型代码在Keras框架下实现，则只要寥寥几行代码就能把一个拥有着卷积层（Convolutional Layer，简称Conv
    Layer）、池化层（Pooling Layer，简称Pool Layer）和全连接层（Fully Connected Layer，简称FC Layer）并且使用Adam这个较高级优化方法的深度学习网络给编写出来。后续章节会让我们感受到在Keras框架下实现深度学习算法模型有多简单。


    ### 3. 必须坚持“唯有实践出真知”


    现在很多教程和课程往往忽视了实战的重要性，将大量的精力放在了理论介绍上。我们都知道纸上谈兵的典故，重理论、轻实战的做法是非常不可取的。就像上一小节说的第2个“放弃”一样，在具备基本的理论知识之后，最好就直接实践，编写代码解决实际问题。从学习的效率上讲，这样做的速度是最快的。


    作为毫无AI技术背景、只会Python编程语言、从零开始入门深度学习的同学们，不要犹豫，上车吧。深度学习入门可以很简单！


    ## 第 2 章 深度学习开发环境搭建


    “工欲善其事，必先利其器”，开发工具的准备是进行深度学习的第一步。Python 编程利器首选基于 Web 的交互环境 Jupyter Notebook，深度学习框架目前使用普遍的有
    TensorFlow、PyTorch、Keras 等。


    提示 如果不习惯使用 Jupyter Notebook 编辑器，也可以改用 PyCharm 社区版。


    ## 2.1 Jupyter Notebook 极速入门


    本节主要介绍什么是 Jupyter Notebook、如何快速安装和启动 Jupyter Notebook 以及 Jupyter Notebook 的基本使用方法。


    ## 2.1.1 什么是 Jupyter Notebook


    Jupyter Notebook（以下简称 Jupyter），简单来说，就是一种模块化的 Python 编辑器（现在也支持 R 等多种语言），即在 Jupyter
    中可以把大段的 Python 代码进行碎片化处理，每一段分开来运行。在软件开发中，Jupyter 可能显得没那么好用，这个模块化的功能会破坏掉程序的整体性。但是，当我们在做数据处理、分析、建模、观察结果等的时候，Jupyter
    模块化的功能不仅能提供更好的视觉体验，更能大大缩短运行代码及调试代码的时间，同时还能让整个处理和建模的过程变得异常清晰。


    熟悉 Python 的读者一定对 Python 的交互式功能感触颇深。当工作后有一次笔者和一个做嵌入式的好友聊 Python 时，好友表示他被 Python
    的易读性和交互性所震惊了。做嵌入式用的 C 和 C++ 每次都要经过编译，而且每一行的代码没有办法单独运行。与之不同的是，Python 的每一行代码都像是人类交流所用的文字一样，简单易懂且有交互性。所谓交互性，就是有问有答，我们输入一句，它便返回一句的结果。但在一般的
    IDE（如 PyCharm）中，Python 的这一交互功能被极大地限制了，通常我们会将程序整段编写之后一起运行。而在 Jupyter 中，我们可以每写几行或者每完成一个小的模块便运行一次。也许对于软件工程师们来说，这个功能并没有多大的吸引力，但是对于身为机器学习工程师的我们来说，这个功能可以说是我们的大救星。


