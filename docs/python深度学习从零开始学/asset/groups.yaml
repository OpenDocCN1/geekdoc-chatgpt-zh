    ```\n\n图 8-22\n\n下载的 CIFAR-10 数据文件如图 8-23 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_141_1.png)\n\
    \n图 8-23\n\n如图 8-24 所示，可以看到训练集中有 50000 个大小为 32×32 的三原色图，而测试集有 10000 个大小为 32×32\
    \ 的三原色图，数字 3 代表图像是一个 RGB 三原色图。\n\n## 8.3.2 数据预处理\n\n我们必须先做些数据预处理，才能使用卷积神经网络模型进行训练和预测。\n\
    首先，将图像的数字进行标准化，因为原本图像中每个像素的取值是一个0~255 的整数，当图片输入卷积神经网络模型时，一般要转化为 0~1 的数，因此将输入数据统一除以\
    \ 255，如图 8-25 所示。\n\n```\nprint(\"train data:\",'images:',x_img_train.shape,\n\
    \      \"labels:\",y_label_train.shape)\nprint(\"test data:\",'images:',x_img_test.shape\
