    0。


    TensorFlow 游乐场简洁明了地展示了使用神经网络解决分类问题的 4 个步骤：


    - 步骤 01 提取问题中实体的特征向量。

    - 步骤 02 定义神经网络的结构，定义如何从神经网络的输入到输出，设置隐藏层数和节点个数（前向传播）、激活函数等。

    - 步骤 03 通过训练数据来调整神经网络中参数的取值，也就是训练神经网络的过程（反向传播），利用反向传播算法不断优化权重的，使之达到最合理水平。

    - 步骤 04 使用训练好的神经网络来预测未知数据，这里训练好的网络就是其权重达到最优的情况。


