    从纹理到图片风格其实只差两步。第一步也是比较神奇的，Gatys 发现纹理能够描述一个图像的风格。严格来说纹理只是图片风格的一部分，但是不仔细研究纹理和风格之间的区别的话，乍一看给人感觉是差不多的。第二步是如何只提取图片内容而不包括图片风格。


    第一篇论文解决了从图片 B 中提取纹理的任务，但是还有一个关键点就是如何只提取图片内容，而不包括图片风格？这就是 Gatys 的第二篇论文做的事情：Gatys
    把物体识别模型再拿出来用了一遍，这次不使用格拉姆矩阵（Gram 矩阵）统计模型了，直接把局部特征看作近似的图片内容，这样就得到了一个把图片内容和图片风格（就是纹理）分开的系统，剩下的就是把一幅图片的内容和另一幅图片的风格合起来，即找到能让合适的特征提取神经元被激活的图片即可。


    基于神经网络的图像风格迁移，其背后的每一步都是前人研究的成果。Gatys 所做的改进是把两个不同领域的研究成果有机地结合起来，做出了令人惊艳的结果，其实最让人惊讶的是，纹理竟然能够和人们心目中认识到的图片风格在很大程度上相吻合。


    # 12.2 使用预训练的 VGG16 模型进行风格迁移


    本节主要介绍如何使用使用预训练的 VGG16 模型进行风格迁移。


    # 12.2.1 算法思想


    卷积是一个有效的局部特征抽取操作。深度学习之所以能“深”，原因之一就是前面的卷积层用少量的参数完成了高效的特征抽取。以图像识别为目的训练出来的卷积神经网络也可以用于图像风格迁移，因为为了完成图像识别的任务，卷积神经网络必须具有抽象和理解图像的能力，即从图像中提取特征。


    一般来说，卷积层的特征图蕴含这些特征，对特征图进行处理，就可以提取出图像的内容表示和风格表示，进而进行图像风格迁移。


    在卷积神经网络中，通常认为较低层的特征描述了图像的具体视觉特征（即纹理、颜色等），较高层的特征是较为抽象的图像内容描述。当需要比较两幅图像的内容相似性的时候，我们只要比较两幅图像在
    CNN 中高层特征的相似性即可。要比较两幅图像的风格相似性，我们需要比较它们在 CNN 中较低层特征的相似性。这意味着，对一幅图像来说，其内容和风格是可分的。


    2015 年，Gatys 等人展示了如何从一个预训练的用于图像识别的卷积神经网络模型 VGG 中提取出图像的内容表示和风格表示，并将不同图像的内容和风格融合在一起，生成一幅全新的图像。具体方法是，给定一幅风格图像
    a 和一幅普通图像 p，风格图像经过 VGG 的时候在每个卷积层会得到很多特征图，这些特征图组成一个集合 A。同样地，普通图像 p 通过 VGG 的时候也会得到很多特征图，这些特征图组成一个集合
    P，然后生成一幅随机噪声图像 x，随机噪声图像 x 通过 VGG 的时候也会生成很多特征图，这些特征图构成集合 G 和 F 分别对应集合 A 和 P，最终的优化函数是希望调整
    x，让随机噪声图像 x 最后看起来既保持普通图像 p 的内容，又有一定图像 a 的风格。'
