    # Python 深度学习从零开始学


    按理来说，深层网络的表现应该比浅层网络的好，一个 56 层的网络，只用前 20 层，后面 36 层不干活，最起码性能应该达到和一个 20 层网络的同等水平吧。所以，肯定有方法能使得更深层的网络达到或者超过浅层网络的效果。ResNet
    有如此多的层数，那它是如何解决这个问题呢？ResNet 采用了一种“短路”的结构，如图 4-31 所示。


    假定原来的网络结构需要学习得到函数 H(x)，那么不妨将原始信号 x 接到输出部分，并修改需要学习的函数为 F(x)=H(x)-x，便可得到同样的效果。


    通过这样的方式，原始信号可以跳过一部分网络层，直接在更深的网络层传递。从直觉上来看，深度神经网络之所以难以训练，就是因为原始信号 x 在网络层中传递时，越来越失真，而“短路”结构使得原始信号直接传入神经网络的深层，避免了信号失真，这样一来便极大地加快了神经网络训练时的效率。


    34 层的深度残差网络的结构如图 4-32 所示。通过“捷径连接（Shortcut Connections）”的方式，ResNet 相当于将学习目标改变了，不再是学习一个完整的输出，而是目标值
    H(X) 和 x 的差值，也就是所谓的残差: F(x)=H(x)-x。因此，后面的训练目标就是要将残差结果逼近于 0，使得随着网络加深，准确率不下降。


    图 4-32 中有一些捷径连接是实线，有一些是虚线，它们有什么区别呢？因为经过捷径连接后，H(x)=F(x)+x，如果 F(x) 和 x 的通道相同，则可直接相加，那么通道不同怎么相加呢？


    图中的实线、虚线就是为了区分这两种情况的：


    +   (1) 实线的连接部分表示通道相同，如图 4-32 中从上至下第 2 个矩形和第 4 个矩形，都是 3×3×64 的特征图，由于通道相同，所以采用计算方式为
    H(x)=F(x)+x。

    +   (2) 虚线的连接部分表示通道不同，如图 4-32 中从上至下第 8 个矩形和第 10 个矩形，分别是 3×3×64 和 3×3×128 的特征图，通道不同，采用的计算方式为
    H(x)=F(x)+Wx，其中 W 是卷积操作，用来调整 x 的维度。


    ![](img/470b883072d48f1f2917a784b39d4327_74_0.png)


    图 4-31


    ![](img/470b883072d48f1f2917a784b39d4327_74_1.png)


    图 4-32'
