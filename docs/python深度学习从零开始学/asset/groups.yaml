    \ softmax：\n\n```\nmodel.add(layers.Dense(units=10,kernel_initializer='normal',\n\
    \    activation='softmax'))\n```\n\n## 3. 第三步：编译模型\n\n将设计好模型进行编译，即使用 compile 方法对训练模型进行设置。compile\
    \ 方法需要设置以下三个基本参数：\n\n- 优化器：用于找到使损失函数最小的权重。Keras 实现了梯度下降的优化算法，称为随机梯度下降（SGD），此外还有两种更高级的优化算法，RMSprop\
    \ 和 Adam，三种算法中一般选用 Adam。优化器就是模型训练的指导教练，告诉模型该怎么调整权值，调整多大量，最终目标是将模型权值调整到最优。\n- 损失函数：使用\
    \ cross_entropy（交叉熵，一种用于计算多分类问题误差的函数）作为损失函数。\n- 评估指标：用于设置评估模型的方式，最为常用的分类评估指标是\
    \ accuracy（准确率），准确率就是正确的预测占全部数据的比重。\n\n编译模型的代码如下：\n\n```\nmodel.compile(optimizer='adam',\n\
    \    loss='categorical_crossentropy',\n    metrics=['accuracy'])\n```\n\n## 4.\
    \ 第四步：训练模型\n\n使用 model.fit 方法对训练数据进行拟合训练，代码如下：\n\n```\nmodel.fit(X_train,Y_train,\n\
    \    epochs=5,\n    batch_size=200,\n    validation_split=0.2,\n    verbose=2)\n\
    ```\n\n其中：\n\n- X_train,Y_train：表示用于训练的输入数据。\n- epochs：表示训练的轮次。\n- batch_size：用于指定数据批量，也就是每一次梯度下降更新参数时，所同时训练的样本数量。\n\
    - validation_split：表示训练数据和验证数据的比例，设置为 0.2 表示 80% 作为训练数据，20% 作为验证数据。\n- verbose=2：表示显示训练过程。\n\
