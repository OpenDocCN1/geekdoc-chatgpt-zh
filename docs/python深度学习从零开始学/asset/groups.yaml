  md: "\n从图中我们可以看到出现了过拟合的现象，训练准确率随着时间线性增加，而验证准确率则基本停留在 70%~72%，验证损失在 5 轮后就达到最小值，然后保持不变，而训练损失则一直线性下降，直到接近于\
    \ 0。\n\n因为训练样本相对来说比较少（3000 个），所以过拟合是一个十分重要的问题。过拟合的原因是学习样本太少，导致无法训练出能够泛化到新数据的模型。如果拥有大量的数据，那么模型就能观察到数据分布的所有内容，这样就不会出现过拟合。\n\
    \n## 8.4.6 进行预测\n\n调用训练的模型，对猫和狗的图片进行预测。预测时的图片大小需要统一为模型建立时训练集的大小，否则会因为输入图片不符合模型要求而出错。由于示例模型构建时样本大小统一为\
    \ 150×150，故在预测时对图片大小也做了相应调整。预测猫、狗图片的代码如下：\n\n```python\nimport os\nfrom keras.models\
    \ import load_model\nfrom keras.preprocessing import image\nimport matplotlib.pyplot\
    \ as plt\nimport numpy as np\nos.environ['TF_CPP_MIN_LOG_LEVEL'] = '2'\n# 单幅图片的识别\n\
    model = load_model('cats_and_dogs_cnn.h5')\nfilename='CatorDog.jpg'\nimg = image.load_img(filename,\
    \ target_size=(150, 150))\nplt.imshow(img)\nplt.show()\n# 将图片转化为 4d tensor 形式\n\
    x = image.img_to_array(img)\nprint(x.shape) #(224, 224, 3)\nx = np.expand_dims(x,\
    \ axis=0)\nprint(x.shape) #(1, 224, 224, 3)\npres = model.predict(x)\nprint(int(pres[0][0]))\n\
    if int(pres[0][0]) > 0.5:\n    print('识别的结果是狗')\nelse:\n    print('识别的结果是猫')\n\
    ########################################\n```\n\n运行代码，识别结果如图 8-56 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_154_0.png)\n\
    \n图 8-56\n\n## 8.4.7 模型的改进优化\n\n首先，在 3000 个训练样本上训练一个简单的小型卷积神经网络，不做任何正则化，此时主要的问题在于过拟合。我们改进优化方法，采用数据增强（Data\
    \ Augmentation）的方法来降低过拟合。数据增强是针对计算机视觉处理过拟合的新方法，在计算机视觉领域是一种非常强大的降低过拟合的技术，在深度学习处理图像时几乎都会用到。数据增强的原理是从现有的训练样本中生成更多的训练数据，其方法是利用多种能够生成可信图像的随机变换来增加样本，其目标是让模型在训练时不会两次查看完全相同的图像。这让模型能够观察到数据的更多内容，从而具有更好的泛化能力。\n\
    \n在 Keras 中，我们可以通过对 ImageDataGenerator 实例读取的图像执行多次随机变换，来实现数据增强。\n\n示例代码如下：\n\n\
    ```python\nfrom keras.preprocessing.image import ImageDataGenerator\n# 使用数据增强，对\
    \ ImageDataGenerator 实例读取的图像执行多次随机变换来实现\ntrain_datagen = ImageDataGenerator(\n\
    \    rescale=1./255,\n    rotation_range=40,\n    width_shift_range=0.2,\n   \
    \ height_shift_range=0.2,\n    shear_range=0.2,\n    zoom_range=0.2,\n    horizontal_flip=True,)\n\
    ```\n\nImageDataGenerator 中几个参数的含义如下：\n\n- rescale: 将像素值缩放，这里是将像素值（0~255）缩放到 [0,\
    \ 1] 区间。\n- rotation_range: 角度值（0~180），表示图像随机旋转的角度范围。\n- width_shift_range 和 height_shift_range:\
    \ 图像在水平或垂直方向上平移的范围（相对于总宽度或总高度的比例）。\n- shear_range: 随机错切变换的角度。\n- zoom_range: 图像随机缩放的范围。\n\
    - horizontal_flip: 随机将一半图像水平翻转。如果没有水平不对称的假设（比如真实世界的图像），这种做法是有意义的。\n\n完整的程序代码如下：\n\
    \n```python\n######################################\nimport os\nbase_dir = 'cat-and-dog'\n\
    # 构造路径存储训练数据、校验数据以及测试数据\ntrain_dir = os.path.join(base_dir, 'training_set')\n\
    os.makedirs(train_dir, exist_ok = True)\nvalidation_dir = os.path.join(base_dir,\
    \ 'validation_set')\nos.makedirs(validation_dir, exist_ok = True)\ntrain_cats_dir\
    \ = os.path.join(train_dir, 'cats')\ntrain_dogs_dir = os.path.join(train_dir,\
    \ 'dogs')\nvalidation_cats_dir = os.path.join(validation_dir, 'cats')\nvalidation_dogs_dir\
    \ = os.path.join(validation_dir, 'dogs')\n# 检查一下每个分组（训练 / 验证 ）中分别包含多少幅图像\nprint('total\
    \ training cat images: ', len(os.listdir(train_cats_dir)))\nprint('total training\
    \ dog images: ', len(os.listdir(train_dogs_dir)))\nprint('total validation cat\
    \ images: ', len(os.listdir(validation_cats_dir)))\nprint('total validation dog\
    \ images: ', len(os.listdir(validation_dogs_dir)))\nfrom keras import layers\n\
    from keras import models\nmodel = models.Sequential()\nmodel.add(layers.Conv2D(32,\
    \ (3, 3), activation='relu',\n                input_shape=(150, 150, 3)))\nmodel.add(layers.MaxPooling2D((2,\
    \ 2)))\nmodel.add(layers.Conv2D(64, (3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,\
    \ 2)))\nmodel.add(layers.Conv2D(128, (3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,\
    \ 2)))\nmodel.add(layers.Conv2D(128, (3, 3), activation='relu'))\nmodel.add(layers.MaxPooling2D((2,\
    \ 2)))\nmodel.add(layers.Flatten())\nmodel.add(layers.Dropout(0.5))\nmodel.add(layers.Dense(512,\
    \ activation='relu'))\nmodel.add(layers.Dense(1, activation='sigmoid'))\nprint(model.summary())\n\
    from keras import optimizers\nmodel.compile(loss='binary_crossentropy', optimizer=optimizers.RMSprop(lr=1e-4),\n\
    metrics=['acc'])\nfrom keras.preprocessing.image import ImageDataGenerator\ntrain_datagen\
    \ = ImageDataGenerator(\n    rescale=1./255,\n    rotation_range=40,\n    width_shift_range=0.2,\n\
    \    height_shift_range=0.2,\n    shear_range=0.2,\n    zoom_range=0.2,\n    horizontal_flip=True,)\n\
    #Note that the validation data should not be augmented! (注意不能增强验证数据)\ntest_datagen\
    \ = ImageDataGenerator(rescale = 1. / 255)\ntrain_generator = train_datagen.flow_from_directory(\n\
    \    train_dir, target_size=(150, 150), # 将所有图像大小调整为150*150\n    batch_size=20,\n\
    \    class_mode = 'binary')\nvalidation_generator = test_datagen.flow_from_directory(\n\
    \    validation_dir,target_size = (150, 150),batch_size = 20,\n    class_mode\
    \ = 'binary')\ntrain_history = model.fit_generator(train_generator,\n        \
    \                            steps_per_epoch = 150,\n                        \
    \            epochs = 30,\n                                    validation_data\
    \ = validation_generator,\n                                    verbose=2,\n  \
    \                                  validation_steps = 100)\ntry:\n    model.save('cats_and_dogs_cnn2.h5')\n\
    \    print('保存模型成功！')\nexcept:\n    print('保存模型失败！')\nimport matplotlib.pyplot\
    \ as plt\nacc = train_history.history['acc']\nval_acc = train_history.history['val_acc']\n\
    loss = train_history.history['loss']\nval_loss = train_history.history['val_loss']\n\
    epochs = range(1, len(acc) + 1)\n# 绘制模型对训练数据和校验数据判断的准确率\nplt.plot(epochs, acc,\
    \ 'bo', label = 'training acc')\nplt.plot(epochs, val_acc, 'b', label = 'validation\
    \ acc')\nplt.title('Training and validation accuracy')\nplt.legend()\nplt.show()\n\
    plt.figure()\n# 绘制模型对训练数据和校验数据判断的错误率\nplt.plot(epochs, loss, 'bo', label = 'Training\
