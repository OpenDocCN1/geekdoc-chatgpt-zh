    # 第 4 章

    深度学习基础


    深度学习的框架是神经网络模型，它研究的是多层隐藏层的深度神经网络。神经网络的重要特性是它能够从环境中进行学习。神经网络的学习是一个过程：在其所处环境的激励下，相继给网络输入一些样本模式，并按照一定的规则（学习算法）调整网络各层的权值矩阵，待网络各层权值都收敛到一定值后，学习过程结束。卷积神经网络（Convolutional
    Neural Networks，CNN）是深度学习的代表，解决了传统神经网络的不足，卷积神经网络的使用让计算机在图像识别领域取得了飞跃式的发展。


    # 4.1 神经网络原理阐述


    本节主要简述神经网络的工作原理。


    # 4.1.1 神经元和感知器


    人工神经网络也简称为神经网络，是一种模仿生物神经网络（动物的中枢神经系统，特别是大脑）的结构和功能的数学模型或计算模型。


    神经元是构成神经网络的基本单元，其主要是模拟生物神经元的结构和特性，接收一组输入信号并产生输出。1943 年，美国神经解剖学家 Warren McCulloch
    和数学家 Walter Pitts 将神经元描述为一个具备二进制输出的逻辑门：传入神经元的冲动经整合后使细胞膜电位提高，超过动作电位的阈值（threshold）时即为兴奋状态，产生神经冲动，由轴突经神经末梢传出；传入神经元的冲动经整合后使细胞膜电位降低，低于阈值时即为抑制状态，不产生神经冲动。


    我们来看一个神经元是如何工作的。神经元接收电信号，然后输出另一种电信号。如果输入电信号的强度不够大，那么神经元就不会做出任何反应；如果电信号的强度大于某个界限，那么神经元就会做出反应，向其他神经元传递电信号。想象我们把手指深入水中，如果水的温度不高，就不会感到疼痛；如果水的温度不断升高，当温度超过某个度数时，我们会神经反射般地把手指抽出来，然后才感觉到疼痛，这就是输入神经元的电信号强度超过预定阈值后，神经元做出反应的结果。'
  - '[PAGE 51]


    哲学告诉我们，世界上的万物都是相互联系的。生物学的神经元启发我们构造了最简单原始的“人造神经元”。人工神经网络的第一个里程碑就是感知器，感知器其实是对神经元最基本概念的模拟。纯粹从数学的角度上来看，感知器其实可以理解为一个黑盒函数，接收若干个输入，产生一个输出的结果，这个结果就代表了感知器所做出的决策！


    如图 4-1 所示，圆圈表示一个感知器，它可以接收多个输入，产出一个结果，结果只有两种情况，“是”与“否”。


    举一个简单的例子，假设我们需要判断小张同学是否接受一份工作，主要考虑以下三个因素：工作的环境、工作的内容、工作的薪酬。那么对于一份工作我们只需要将这三个因素量化出来，输入到感知器中，然后


    ![](img/470b883072d48f1f2917a784b39d4327_51_0.png)


    就能得到感知器给我们的决策结果。而感知器内部决策的原理，其实就是给不同的因素赋予不同的权重，因为对于小张来说不同的因素的重要性自然是不相同的；然后设置一个阈值，如果加权计算之后的结果大于等于这个阈值，就说明可以判断为接受，否则就是不接受！所以感知器本质上就是一个通过加权计算函数进行决策的工具！


    单层感知器是一个只有一层的神经元。感知器有多个二进制输入 x1、x2、…、xn，每个输入有对应的权值（或权重）w1、w2、…、wn，将每个输入值乘以对应的权值再求和（Σxjwj），然后与一个阈值比较，大于阈值则输出
    1，小于阈值则输出 0。写成公式，如图 4-2 所示。


    如果把公式写成矩阵形式，再用 b 来表示负数的阈值（即 b = -threshold），根据上面这个公式，我们可以进一步简化，如图 4-3 所示。


    ```

    output = { 0 if Σj wj xj ≤ threshold; 1 if Σj wj xj > threshold } 图4-2

    ```


    ```

    output = f(x) = { 0 if wx + b ≤ 0; 1 if wx + b > 0 } 图4-3

    ```


    完整的感知器模型如图 4-4 所示，感知器加权计算之后，再输入到激活函数中进行计算，得到一个输出。类比生物学上的神经元信号从人工神经网络中的上一个神经元传递到下一个神经元的过程，并不是任何强度的信号都可以传递下去，信号必须足够强，才能激发下一个神经元的动作电位，使其产生兴奋，激活函数的作用与之类似。


    单层感知器的激活函数为阶跃函数，以阈值 0（界限值）为界的，若小于等于 0，则输出 0，否则输出 1。它将输入值映射为输出值“0”或“1”，显然“1”对应于神经元兴奋，“0”对应于神经元抑制。


    单层感知器具有一定的局限，无法解决线性不可分的问题，所以这个模型只能用于二元分类，且无法学习比较复杂的非线性模型，因此实际应用中的感知器模型往往更加复杂。将多个单层感知器进行组合，得到一个多层感知器。


    如图 4-5 所示是一个多层感知器模型（Multi-Layer Perceptron，MLP）的示意图。网络的最左边的层被称为输入层，其中的神经元被称为输入神经元。最右边的输出层包含输出神经'
