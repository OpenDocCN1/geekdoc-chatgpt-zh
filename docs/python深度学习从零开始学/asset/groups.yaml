    Keras 的设计原则如下：


    （1）模块性：模型可以理解为一个独立的序列或图，使用完全可配置的模块以最少的代价自由地组合在一起。具体而言，网络层、损失函数、优化器、初始化策略、激活函数、正则化方法等都是独立的模块，我们可以使用它们来构建自己的模型。


    （2）极简主义：每个模块都应该尽量简洁。每一代码在初次阅读时都应该显得直观易懂，不能过于深奥难懂，否则它将给迭代和创新带来麻烦。


    （3）易扩展性：添加新模块是一个超级简单和容易的操作，只需要仿照现有的模块编写新的类或函数即可。由于 keras 在创建新模块方面的便利性使其更适合于研究工作。


    Keras 优先考虑开发人员的经验：


    +   - Keras 是为人而非机器设计的 API。Keras 遵循减少认知困难这一准则，提供一致且简单的 API。

    +   - Keras 将常见案例所需的用户操作数量降至最低，并且在用户出现错误时提供清晰和可操作的反馈，这使 Keras 易于学习和使用。作为 Keras
    用户，工作效率会更高，能够比竞争对手更快地尝试更多创意。

    +   - Keras 的易用性并不以降低灵活性为代价。因为 Keras 与底层深度学习语言（特别是 TensorFlow）集成在一起，可以让我们实现任何可以用基础语言编写的东西。特别是
    tf.keras 作为 Keras API 可以与 TensorFlow 工作流无缝集成。


    # 6.2 Keras 常用概念


    Keras 的核心数据结构是模型，也就是一种组织网络层的方式。在 Keras 中有两类主要的模型：Sequential（序列或序列）模型和使用函数式 API
    的 Model 类模型。最主要的是 Sequential 模型，创建好一个模型后就可以调用 add() 方法向模型里面添加层。层就像是深度'
