    App 可以通过用户上传的自拍图片来判断该用户的性别、年龄等特征，从而为用户有针对性地推荐一些可能感兴趣的人。


    在研究人脸识别过程中，经常看到 FDDB 和 LFW 这两个缩写简称，但很多人不知道它们到底指的是什么？


