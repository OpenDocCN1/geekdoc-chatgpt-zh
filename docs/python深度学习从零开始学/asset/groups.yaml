    CycleGAN 有许多有趣的应用。下面介绍五类具体的应用，以展示 CycleGAN 这一技术 的应用能力。


    # 1. 风格转换


    风格转换指学习一个领域的艺术风格并将该艺术风格应用到其他领域，一般是将绘画的 艺术风格迁移到照片上。图 13-5 展示了使用 CycleGAN 学习莫奈、梵高、塞尚、浮世绘的绘
    画风格，并将其迁移到风景照上的结果。


