    \ = \"./models/model-{}\".format(iter_cnt))\n```\n\n## 13.4.7 结果展示\n\n训练过程中主要用到\
    \ trainA 和 trainB 文件夹，其中，trainA 一共有 400 幅彩色图像，trainB 一共有 6287 幅彩色图像，所有图像的尺寸大小均为\
    \ 256×256，如图 13-12 所示。\n\n![](img/470b883072d48f1f2917a784b39d4327_229_0.png)\n\
    \ntrainA 文件夹中的梵高油画\ntrainB 中的现实风景\n\n图 13-12\n\n以梵高的画为 A 类图像，以真实的照片为 B 类图像进行训练。当训练第\
    \ 1 个 epoch 时，训练结果基本是噪声。当训练 5 个 epoch 时，已经能够生成具有简单色彩的影像。当训练 15 个 epoch 时，已经可以看到一些纹理，比如\
    \ 45° 的纹理线。当训练 30 个 epoch 时，能够生成更加浓郁的色彩。当训练 60 个 epoch 时，生成图像的效果更为细腻一些。当训练 100\
    \ 个 epoch 时，对比原作，我们会发现 AI 绘制出来的图像确实具有梵高的神韵。\n\n## 后记\n进一步深入学习\n\n看完了本书，恭喜大家进入了深度学习的大门。我们在入门学习的过程中一个重要方法就是学习别人的代码，通过把高手的代码\
    \ debug 一遍，就能真正弄懂一个技术的原理。更重要的一点是，我们入门这个领域肯定不会自己动手一步一步地去实现所有需要的技术代码，最直接的学习方法就是结合开源的框架，善用这些开源框架是我们入门学习的一个最基本手段。\n\
    \n接下来如何继续提升自己呢？笔者给大家几条建议：\n\n### 1. 打好线性代数及矩阵知识的高数基础\n\n高等数学是学习人工智能的基础，因为人工智能领域会涉及很多数据、算法的问题，而这些算法又是数学推导出来的，所以要理解算法，就需要先学习一部分高数知识。那为什么不建议一开始先学数学呢，主要是为了让我们保持兴趣和动力，不会一开始就被数学打击得没了学习\
    \ AI 的信心。当我们从案例实操中领悟了其背后运行的原理和真相后，再回头补一下高等数学的知识，这样信心能积累起来。深度学习是什么呢？它就是一个复杂的人工神经网络，这个神经网络的原理其实就包括了两部分：前向传播和反向传播。这两部分一个最核心的要点就是矩阵计算和梯度求导运算，所以说我们要能入门这个领域，线性代数及矩阵基础还是要有的。这样才会层层积累，避免没有逻辑性地看一块学一块。\n\
    \n### 2. 不断实战，增强自己的实际经验\n\n当我们掌握了基本的技术理论，就要开始多实践，不断验证自己学到的理论，更新自己的技术栈。找一个开源框架，自己多动手训练深度神经网络，多动手写写代码，多做一些与人工智能相关的项目。如果有条件的话，可以从一个项目的前期数据挖掘，到中间模型训练，并做出一个有意思的原型，把一整套的流程操作熟练。我们在学习过程中，可以经常去逛逛技术博客，看看有没有一些适合我们学习的项目可以拿来练手。\n\
    \n### 3. 找到自己的兴趣方向，专研下去\n\n人工智能有很多方向，比如自然语言处理、语音识别、计算机视觉等，生命有限，必须选一个方向深入地专研下去，这样才能成为人工智能领域的大牛，从而有所成就。有的读者可能会说我都想去研究个究竟，其实只要有时间这些都不是事。但是笔者觉得还是选择一个\n"
