    \ 3.3 数据分析处理库——Pandas\n\nPandas 是 Python 的一个数据分析包，提供了大量能使我们快速便捷地处理数据的函数和 方法。\n\
    \n### 3.3.1 Pandas 数据结构 Series\n\nSeries 是一种一维数据结构，每一个元素都带有一个索引，与一维数组的含义相似，其中索引可以为数字或字符串，如图\
    \ 3-12 所示。\n\nSeries 对象包含两个主要的属性：index 和 values，分别为图 3-12 中的索引列和数据列。因为传递构造器的是一个列表，所以\
    \ index 的值是从 0 开始递增的整数，如果传递的是一个类字典的键值对结构，就会生成与 index-value 对应的 Series；或者在初始化的时候，以关键字参数显式指定一个\
    \ index 对象。\n\n如图 3-13 所示，Series 类似一维数组，但 Series 最大的特点就是可以使用标签索引。ndarray 也有索引，但它是位置索引，Series\
