    # 本书适合的读者


    阅读本书的读者，需要具备 Python 语言基础知识。只要你想改变自己的现状，那么这本书就非常适合你。本书就是给那些非科班出身而想半路“杀进”人工智能领域的程序员们，提供快速上手的参考指南。


    # 致谢


    感谢我的妻子和女儿、你们是我心灵的港湾！

    感谢我的父母，你们一直在默默地支持者我！

    感谢我的朋友和同事，相互学习的同时彼此欣赏！

    感谢清华大学出版社的老师们帮助我出版了这本有意义的著作。


    万事开头难，只有打开了一扇窗户，才能发现一个全新的世界。这本书就能帮助新人打开深度学习的这扇门，让更多的人享受到人工智能时代到来的红利。


