  - "[PAGE 89]\n\n总结：我们用 TensorFlow 建立了多层感知器模型，识别 MNIST 数据集中的手写数字，并且尝试将模型加深（两个隐藏层），以提高准确率，准确率大约为\
    \ 0.96。不过，多层感知器有极限，如果还要进一步提升准确率，就必须使用卷积神经网络。\n\n# 5.4.3 TensorFlow 卷积神经网络识别手写数字Ⅰ\n\
    \n我们使用卷积神经网络来识别 MNIST 数据集的手写数字，卷积神经网络架构主要由输入层、卷积层、池化层、全连接层、输出层等组成。\n\n+   - 输入层：输入层是整个神经网络的输入，在处理图像的卷积神经网络中，它一般代表了一幅图片的像素矩阵。\n\
    +   - 卷积层：卷积层是一个卷积神经网络中最重要的部分。和传统全连接网络不同，卷积层中每一个节点的输入只是上一层神经网络的一小块，卷积层试图将神经网络中的每一小块进行更加深入的分析，从而得到抽象程度更高的特征。\n\
    +   - 池化层：池化层神经网络不会改变三维矩阵的深度，但是它可以缩小矩阵的大小。池化操作可以认为是将一幅分辨率较高的图片转化为分辨率较低的图片。通过池化层，可以进一步缩小最后全连接层中节点的个数，从而达到减少整个神经网络中参数的目的。\n\
    +   - 全连接层：经过多轮卷积层和池化层的处理之后，在卷积神经网络的最后一般会有全连接层来给出最后的分类结果。\n+   - 输出层：输出层用于将最终的结果输出，针对不同的问题，输出层的结构也不相同，例如\
    \ MNIST 数据集识别问题中，MNIST 数据集中数字是 0~9，要求实现多分类，需要使用 softmax 函数，输出层为有 10 个神经元的向量。\n\
    \n第一次卷积运算，输入数字图像的大小为 28×28，转换后会产生 16 幅图像，卷积运算不会改变图像的大小。第一次池化后缩减采样，将 16 幅 28×28\
    \ 的图像缩小为 16 幅 14×14 图像。\n\n第二次卷积运算，将原本 16 幅图像转换为 36 幅图像，图像大小仍然是 14×14；第 2 次池化缩减采样，将\
    \ 36 幅 14×14 的图像缩小为 36 幅 7×7 的图像。\n\n建立一个平坦层，可以将池化层 2 的 36 幅 7×7 的图像转换为一维的向量，长度是\
    \ 7×7×36=1764，也就是 1764 个浮点数作为神经元的输入。\n\n建立一个隐藏层，隐藏层有 128 个神经元，加入 Dropout 避免过拟合。\n\
    \n最后一个 softmax 输出层，共有 10 个神经元，对应数字 0~9。\n\n在 TensorFlow 中必须自行设计每一层的张量运算，完整代码如下：\n\
    \n```\n###########...3\nimport tensorflow as tf\nimport tensorflow.examples.tutorials.mnist.input_data\
    \ as input_data\nmnist = input_data.read_data_sets(\"MNIST_data/\", one_hot=True)\n\
    # 定义 weight 函数，用于建立权重张量\ndef weight(shape):\n    return tf.Variable(tf.truncated_normal(shape,\
    \ stddev=0.1),\n                       name='W')\n```"
