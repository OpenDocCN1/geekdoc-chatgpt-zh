    \ 139 205 93 211 70 0 23 78 72]\n [ 3 4 16 24 14 21 102 175 120 130 226 212 236\
    \ 75 0 25 78 72]\n [ 6 5 13 21 28 28 97 216 184 90 196 255 255 84 4 24 79 74]\n\
    \ [ 6 5 15 25 30 39 63 105 140 66 113 252 251 74 4 28 79 75]\n [ 5 5 16 32 38\
