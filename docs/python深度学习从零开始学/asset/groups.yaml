    图 7-17


    +   - AUC = 1，是完美分类器，采用这个预测模型时，不管设定什么阈值都能得出完美预测。绝大多数预测的场合，不存在完美分类器。

    +   - 0.5 < AUC < 1，优于随机猜测。这个分类器（模型）受善设定阈值的话，具有预测价值。

    +   - AUC = 0.5，跟随机猜测一样（例：去铜板），模型没有预测价值。

    +   - AUC<0.5，比随机猜测还差，但只要总是反预测而行，就能优于随机猜测，因此不存在 AUC<0.5 的情况。


    AUC 对于每一个做机器学习的人来说一定不陌生，它是衡量二分类模型优劣的一种评价指标，表示正例排在负例前面的概率。之前我们说过评估指标有精确率、召回率，而
    AUC 比这两者更为常用。因为一般在分类模型中，预测结果都是以概率的形式表现，如果要计算准确率，通常都会手动设置一个阈值来将对应的概率转化成类别，这个阈值在很大程度上影响了模型计算的准确率。


    不妨举一个极端的例子：一个二类分类问题一共 10 个样本，其中 9 个样本为正例，1 个样本为负例，在全部判正的情况下精确率将高达 90%，而这并不是我们希望的结果，尤其是在这个负例样本得分还是最高的情况下，模型的性能应极差，从精确率上看却截然相反。AUC
    能很好描述模型整体性能的高低，这种情况下，模型的 AUC 值将等于 0（当然，通过取反可以解决小于 50% 的情况，不过这就是另一回事了）。


    怎么选择评估指标？


    当然是具体问题具体分析，单纯地回答谁好谁坏没有意义，我们需要结合实际场景作出合适的选择。


    例如如下两个场景：


    （1）地震的预测。对于地震的预测，我们希望的是召回率非常高，也就是说每次地震我们都希望预测出来。这个时候可以牺牲精确率，情愿发出 1000 次警报，把 10
    次地震都预测正确了，也不要预测 100 次对了 8 次漏了 2 次。所以我们可以设定在合理的精确率下，最高的召回率作为最优点，找到这个对应的阈值。


    （2）嫌疑人定罪。基于不冤枉一个好人的原则，对于嫌疑人的定罪我们希望非常准确，没有证据就不能给嫌疑人定罪（召回率低）。


    ROC 和 PRC 在模型性能评估上效果都差不多，但需要注意的是，在正负样本分布得极不均匀（Highly Skewed Datasets）的情况下，PRC
    比 ROC 能更有效地反映分类器的好坏。在数据极度不平衡的情况下，譬如说 1 万封邮件中只有 1 封垃圾邮件，那么如果我们挑出 10 封、50 封、100
    封……垃圾邮件（假设我们每次挑出的 N 封邮件中都包含真正的那封垃圾邮件），'
