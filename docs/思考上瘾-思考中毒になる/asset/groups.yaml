    之外再找一个可以相互切磋的搭档。


    和这位搭档每天一起切磋琢磨，新的想法与创意就会源源不断地涌出。找到一位能一起进行创造性思考的搭档是培养思考力的最佳手段。


    ## 与自己内心的思考搭档辩论


    通过对谈提升思考力的另一种方法是“自我对话”。


    自己先提出某种主张，与此相对，再提出另一种主张，然后进行自我辩论、深入思考。


    我晚上经常梦见与别人辩论。每当我说出一种意见，就会出现一位超强的辩论对手，揪住我观点中的漏洞不放，等我早上醒来时，有时甚至会感到疲惫不堪。我给学生讲了这件事，有的学生说：“一定会特别累，因为梦中出现的辩论对手是斋藤老师本人。老师全力与自己辩论，一定会疲惫不堪的。”


    这样说来确实如此。


    与自己对话，指出自己观点的矛盾之处及逻辑不够严谨之处，并进行反复的自我辩论，这样，任何人提出的问题都会在意料之中。例如，在工作会议上提出自己的意见，即使上司反驳，也能以万全之策进行应对，沉着冷静地回答：“关于这一点我已经研究过了，这样就能解决。”


    实际上，我们在各种场合都能发现自我对话。看小说时，我们会看到男女主人公的对话。两人的对话究其根源是作者脑中虚构的声音与作者本人的对话，即内心世界的自我对话。


    借鉴这种形式，我们设定“店员”与“客人”这两种角色，让他们进行对话，就能编撰出完美的投诉处理指南。


    投诉处理指南若写得滑稽有趣，就会像相声台词一样。捧哏对逗哏所说的话不断吐槽，通过这种衬托、铺垫，两人一唱一和，就会让稀松平常的事情生动有趣起来。


    正是有了捧哏一针见血的吐槽，才能衬托出逗哏的表演生动有趣。我所参加的综艺节目《全力！脱力时间》，每一期搞笑艺人的吐槽中都有很多深入人心的经典台词。其中，漫才组合Untouchable的柴田英嗣每次都能马上找到吐槽点，令人惊叹不已。


    一般大家都不在意的事情，柴田英嗣也会逐一吐槽，精准到位。搭档山崎弘也有时也会信口说出脚本中原本没有的、异想天开的内容，柴田英嗣也能立刻一针见血地找到吐槽点。


    搞笑艺人的吐槽看起来是无意识地脱口而出，实际上他们的大脑正在快速运转，瞬间要想出三个词，进而再从中选出一个最合适的。


    思考和选择无论哪个环节出现差错，都不会产生笑点。由此可见，人气搞笑艺人拥有多么强大的思考力。


    并非为了搞笑，吐槽自己或辩驳自己这种自我对话非常有意义。仅仅是自己指出自己的矛盾和错误，就能不断进行思考。


    我还喜欢边读文学作品边吐槽，甚至想写本名为《吐槽世界文学》的书。


    ## 注释


    - [1]相当于中国的对口相声。——译者注


    ## 佐藤可士和：倾听与思考密不可分


    人们都会认为“倾听”与“讲述”不同，前者是一种被动行为。但实际上，主动倾听是提高思考力的有效手段。


    创意设计师佐藤可士和是我熟识的一位思考上瘾人士，他为优衣库、7-11便利店等知名企业设计了商标。


    我和佐藤可士和合著了《佐藤可士和：我的创意新规则》这本书，因此我们曾经深入交流过。当时，佐藤可士和说，人在面对某种麻烦和困难时就会高度紧张，新创意也会油然而生，这就是工作的乐趣。据说他有段时间沉迷于玩滑板，在博报堂广告公司踩着滑板四处转悠，在努力保持平衡的过程中体验到了思绪自由驰骋的快感。


    佐藤可士和说过，用心倾听客户说话最为重要，这句话至今让我记忆犹新。任何人在工作中都要听客户说话，佐藤可士和是“特别用心听”。据说他开始用心听客户说话是因为有过一次失败的经历。有一次，他大致了解客户的想法就开始着手做方案，方案做完交给客户，提交结果时才发现完全不是对方想要的，所有的工作都白做了。


    据说他当时特别后悔，“为什么没有认真听取客户的要求？”自此以后，他开始先用心听取客户的想法，之后再思考如何做。


    但是，也并非只要认真听取客户的想法就能交出让客户满意的作品。精髓在于以获得的信息为基础，最终将其体现在具体的作品中。


    像佐藤可士和这样擅长倾听的人不仅会从对方的表述中了解到对方的需求，还会从中获得灵感，在工作中有所创新。


    把对方的想法和自己的思考巧妙地融合在一起，有助于想出各种创意，进而从这些创意中最终选择一种最佳方案。


    ## 阅读理解能力欠缺是因为没有用心思考


    提升思考力的方法除了能提升语言表达能力外，还可以提升阅读理解能力，因为读取并理解信息这一行为本身就是思考行为。也可以说，“阅读理解能力强＝思考能力强”。


    2018年经济合作与发展组织（OECD）举办的国际学生评估项目的调查结果显示，日本人的“阅读能力”排名下降到第15名，而上一次（2015年）排名第8。这一结果一度引发热议。


    数学也好，社会学也罢，阅读是所有科目的学习基础。我们读不懂文章，就无法进行思考。


    虽说如此，我们也不能一味地谴责孩子们的阅读理解能力欠缺。很多成年人的阅读理解能力也令人质疑。


    比如，有的政治家在演说中能够成功赢得选民的支持，但在议会答辩中却答非所问。他的回答与提问的内容简直驴唇不对马嘴，貌似没有真正理解问题。这固然有可能是故意答非所问，避开尖锐的问题，但给我的感觉是“此人阅读理解能力很差”。


    被人提问时，对于不清楚的事情坦诚地回答“我不清楚”，在某种意义上也是权宜之计。而对于提问，反复做出不着边际的回答，会让全世界的人都认为“这个人的思考力差到极点”。


    在全球化时代，会英语、法语等外语固然非常重要，但更重要的是我们真正理解对方的想法，并能抓住核心要点进行回答。


    对外语只要翻译一下就能明白其意思，但理解力有所欠缺的话就无法进行交流。


    我有一次在北欧参加学术会议，当时在场的人接二连三地对我的发言提问。


    “您能谈谈日本能剧的呼吸法与西班牙吉卜赛歌舞的呼吸法有什么不同吗？”


    西班牙人能抛给我这么具体且有趣的问题，就说明他们完全理解了我的发言，并且简明扼要地概括了自己想要了解的内容。


    这时，我的回答如果不精准的话，就会给他们留下这样的印象：“这个人，无论问他什么都毫无意义。”“这个人没什么思考力。”反之，如果我的回答精准，就能够获得他们的认可。


    顺便说说我当时的回答：“我觉得在气息的保持方式上有所不同。能剧是在上半身的靠下部位保持气息，而吉卜赛歌舞是在靠上部位保持气息。”这个回答获得了提问者的认同。


    准确地理解对方的问题并做出精准的回答，通过日常的闲聊一般无法锻炼这种能力。因为只要有共鸣，就算逻辑上不严谨，也能进行日常的闲聊。但在工作和学术上需要我们做出逻辑严谨的回答。因此，提升会话理解力及阅读理解力非常重要。


    ## 思考上瘾始于阅读上瘾


    关于特定的事件及状况，只要具备理解并认清其本质的能力，就能想出具体的对策。


    “投诉者真正想要主张什么？”


    “用户想要的到底是什么？”


    具备认识这些问题本质的能力，就能完美地处理好工作。


    比如“大头贴”这种商品，表面上只是“照片十贴纸”，但究其根本是“想要用贴纸把与朋友在一起的瞬间定格下来，也想跟朋友交换这种美好的瞬间”。大头贴正是因为把这种内涵有形化了，才能唤起很多初高中生的共鸣。


    实际上，在做这种认识本质训练时，读文学作品是非常有效的手段。优秀的文学作品中蕴含着感情的真谛。读懂这种感情的真谛是阅读真正的乐趣所在。


    举一个例子。太宰治的短篇小说《眉山》的主人公原型应该是太宰治本人，舞台是主人公和他的小说家朋友们经常去的一家小酒馆，小酒馆中有位名叫“阿敏”的女服务员总是想要加入他们的谈话，这位女服务员有个外号“眉山”。


    一起喝酒的几个人背地里经常说她的坏话，但又总是经常来这家酒馆。最初通过主人公介绍来这家酒馆的人在不久之后也开始经常一个人光顾这家酒馆。


    主人公有一次因饮酒过量，伤到了身体，约有十天无法下床活动。当他再去这家酒馆时，得知阿敏因为肾结核回老家了，好像剩下的日子不多了。


    几位酒友此时都在回想关于阿敏的点点滴滴。


    “如今像阿敏那样脾气好的女孩子真是不多啊。一直以来，她都是随叫随到。我们睡在二楼，凌晨两三点醒来，只要下楼招呼一声‘阿敏，拿酒’，她马上就会答应，立即起床端着酒给我们送到二楼。明明那么冷，却不见她有丝毫不耐烦，这样的女孩子真的太少了。”


    他们几个人自那天之后再也没有去那家酒馆。


    虽然大家会跟阿敏斗嘴，笑话她，但大家都很喜欢她。


    表面来看，“他们几个明明之前那么看不起阿敏，但她突然离开了，大家竟然又都觉得伤感”。而作者真正想表达的是，几个人是因为都想见到阿敏，才去那家小酒馆的。综上所述，阅读细致描写人的内心情感的文学作品，认识事物的深度和角度也会发生变化。


    读书并对书的内容展开各种想象，会让人特别开心、激动不已。这种阅读可以直接提升思考力。因此，可以说“思考上瘾始于阅读上瘾”，也可以说“只要阅读上瘾，思考就停不下来”。


    ## 有在边读书边思考吗？


    例如，与不做任何事情、只是发呆不同，阅读夏目漱石的作品时是处于思考中的。因为仅仅是阅读文章并理解其内容，思考就会持续。


    但是，这时只是最低限度地发挥思考力。假如当你读完夏目漱石的《哥儿》，有人问你：“读完这本书，你有什么感想？”如果你的回答是“写的是一位鲁莽老师的故事”“总之很有节奏感，非常有趣，让人忍不住往下读”，则显然很难令人满意。


    > “这部作品最引人入胜的是对照性的人物设定。”

    >

    > “这部作品的开头部分颇有日本武士胜小吉的自传《梦醉独言》的感觉。”


    这样的回答说明阅读的时候动脑思考了。我认为，读书时不仅要思考，还要下功夫思考。


    > “这个要素这样写会怎样呢？”

    >

    > “我觉得这个问题的本质就在这一点上吧。”

    >

    > “加入这个内容会很有意思吧。”


    诸如此类正是思考的妙趣。


    比如19世纪作家赫尔曼·梅尔维尔的长篇小说《白鲸》，故事从年轻的主人公的视角和第一人称开始，后来又转换为第三人称。


    这种人称转换并非在小说中直接言明，所以有的读者发现了，而有的读者阅读时完全没有意识到这一点。能够意识到人称的转换，并且有“我觉得这种写法是为了达到这样的效果”一类想法的读者是真正下功夫思考了的。


    提到小说的人称，译者如果想以英文的人称习惯翻译川端康成的《雪国》，在开头的第一句就会卡住。


    > “穿过县界长长的隧道，便是雪国。”


    这句话的主语是“我”还是“男主人公岛村”？抑或是“火车”？无法确定是三者中的哪一个。我们（日本人）读到“穿过县界长长的隧道，便是雪国”这句话的原日文表达时对内容完全能理解，但细想一下就会发现整部小说的主语都很模糊。


    实际上，翻译这部作品的日本研究专家爱德华·赛登施蒂克也说过，在翻译中确定主语花费了很多时间。我也曾翻译过英文书籍，感觉翻译英文书时的思考力比写日文书时的思考力要高出好几倍，切身体验到了诸位翻译工作者的辛苦——他们需要一直坚持思考。


    大家做过翻译就会明白日本人没有明确区分主体和客体，就会觉得日本人也许是活在不分主体、客体的模糊世界。


    虽说如此，并非要求大家都去做翻译。即使不做翻译，只要下功夫思考，阅读水平和思考力也会有所提升。


    ## 思考源源不断的法宝——三色圆珠笔


    我在读书时，为了能深入思考，一直坚持“使用三色圆珠笔”。这三种颜色分别强调不同的内容。


    - 红色＝非常重要

    - 蓝色＝一般重要

    - 绿色＝感兴趣或有趣


    客观上觉得非常重要的内容可以用红色笔画出，红色是重要信息的代表色。阅读时，如果认为“这体现了作者的观点”，就用红色笔标记出来。最理想的标注，是日后只要重新读一下红色笔画出的部分就能理解作者的主张。红色笔不要乱用，一定要用来标注最重要的内容。


    然后是蓝色笔，用蓝色笔画出梗概。与红色笔不同，蓝色笔多用一些也没关系。


    最后是绿色笔。自己主观上觉得有趣的内容都可以用绿色笔标记。哪怕自始至终都只有自己觉得这部分“有趣”也没关系。


    按照自己的感觉，在意的内容都可以用绿色笔画出。红蓝两色可以重合，与主题无关，但自己觉得独特的部分或者只有自己喜欢的内容要用绿色笔标出来。甚至有时其他人都会问：“这篇文章哪部分最吸引你呢？”


    一开始就想准确地区分使用三种颜色的笔，也许反而导致无法集中精力理解书中的内容。建议大家不要过于在意，按照自己的感觉用不同颜色的笔来标记就可以了。


    可以暂且先按照“用红色和蓝色标出客观内容，用绿色标出主观内容”这个标准来边读边做记号。如果觉得这样也很困难，可以多用自由度高的绿色笔。哪怕只是用绿色笔来画线，我们也能体会到阅读的乐趣。


    用绿色笔画线，就能意识到自己的思维水平。


    换言之，这样阅读日后需要输出时会更容易，比如可以轻松地写文章、给别人讲述等。


    当然，开会以及自己独自思考时也可以活用三色圆珠笔。做笔记时，根据内容的重要性，可以用不同颜色的笔来记录。客观事实用红色笔和蓝色笔来标注，自己的主观感想用绿色笔来标注。这样记录的话，被人问及意见、感想时也能马上作答。


    我现在已经到了没有三色圆珠笔就无法思考的程度，看到某人阅读时不用三色圆珠笔写写画画就会觉得不可思议。


    使用三色圆珠笔进行标记，思考就会停不下来。掌握了使用的诀窍后，无论思考什么都会笔不离手。


    ## 思考的最高境界是动笔


    与“说”“读”相比，层次更高的思考是“写”。


    说话时，有的人谈吐风趣幽默，十分受人关注。把他们风趣幽默的表达转为文字的话，有时候会发现完全不知道他们要表达什么，表述的信息有时也会前后矛盾。


    “谈吐风趣幽默”是由说话人天生的幽默感、说话的节奏感以及语气等综合作用的结果。总而言之，不是他们所说的内容有趣，而是他们说话时的谈吐风趣幽默。


    当然，谈吐风趣幽默、有人格魅力也是非常宝贵的能力。在日常会话中，即使表述中前后略微矛盾也没关系，听者会自己补上相关信息。


    但是，仅仅是因为谈吐风趣幽默就下结论说“这个人脑子转得快”还是有些欠妥。能够进行话速得当的表述很重要，而有能力把富有内涵的信息以文字的形式展现出来同样非常重要。


    能把所想所思写成文章是思考的最佳证明。最理想的当然是“说”与“写”齐头并进、双管齐下。实际上，与“说”相比，“写”对思考力的要求更高。


    前文已经说过，OECD举办的国际学生评估项目的数据显示，日本人的“阅读能力”排名下降到了第15名。


    该项目发布的报告指出，日本的孩子主观论述题的能力较差。我认为，这并不是因为孩子们的基本学习能力差，而是因为写作练习少，大概是他们觉得把自己的思考写成文章太麻烦，或者只是思考得太少。


    培养语感、提升阅读能力最有效的方法就是读书。但最理想的还是读过之后还把自己的感想写下来，这样可以深入思考。


    实际上，东京大学社会学专业的入学考试有很多主观论述题。仅仅是看到卷面上的一大片空白，有的学生就会害怕，觉得自己答不出来。


    而法学部的入学考试直接给每位考生一沓崭新的稿纸，要求考生写小论文。法学部老师认为，在法学部学习仅仅只有阅读理解能力是完全不够的，因此还需要考查考生是否有把所思所想写成文章的能力。


    ## 巧妙运用SNS进行思考


    与单纯的阅读相比，坚持写作确实有助于进行深入思考。


    我养成写作习惯是受一位老师的影响。读小学一年级的时候，学校要求每天用绘画的形式记手账[1]。


    我每天把自己的手账交给老师，老师每次都会给我写评语。“非常棒！”“写得不错！”这些评语给了我很大的鼓励。


    我那时刚刚记熟平假名，只是把自己会的字词都写上了。就这样，我坚持记了一年手账，写满了好几本日记本。当年对于写日记、写作文没有任何烦恼，因此我至今都非常感激当年的老师。


    坚持记手账让我逐渐养成了写作的习惯，写读后感也不费劲。读完从学校图书馆借来的书，我会就其中的部分内容写下自己的感想。我记得当时教室里有写读后感的专用纸，规格是300字，还留有空白处可以绘画。


    与纯阅读相比，写读后感则是费时费力。阅读时，只要顺着作者的思路，被动地理解其内容就可以。而写读后感必须要自己动脑思考。动笔与动脑密切相关。将“阅读”和“写作”分开进行就会发现“写作”更累，这就充分说明写作的时候更需要动脑思考。


    “让孩子们写读后感，孩子们就会讨厌读书，所以不建议让孩子们写读后感。对于孩子们的阅读，只要他们觉得有趣就可以。”


    我常常听到上面这种观点。对于这种观点，我表示不赞同。写读后感的思考力都不培养，教育又将培养什么能力呢？


    不仅是孩子，大人也是如此。读书时不要止于“有趣”，最好在SNS（社交网络服务）上写书评，或者给家人、朋友说说自己阅读后的感想，提升自己的思考力。


    还可以每周看两部电影，并在SNS上发表自己的观后感。一部电影写1000字左右的影评。若每个月写十部电影的影评，就会动脑思考十次。信息时代的优势就是，自己发表的感想一定会有人浏览；如果能得到善意的评价，就会越来越有动力。


    我觉得，如果是电影爱好者，对最初的十部电影应该都坚持写观后感。写完十部电影的观后感后就会有小小的成就感，这种成就感会化为再写十部电影观后感的动力。


    这样一来，电影观赏方式本身也会有所改变。看电影时就会有这样的想法：“啊，关于那段必须写一下”“就这部分也想写一下”。这种状态绝不是休闲娱乐时看电影消遣一下，而是深层次地赏析且深入思考。


    我曾应邀参加电影的首映礼并发言，在这种场合需要比平时更认真地观看电影、更深入地思考。养成边看电影边思考的习惯后，写观后感也就不再觉得痛苦。


    即便如此，也还是觉得写文章很烦的话，我推荐最后一个法宝。


    观看电影时，先选出自己觉得经典的片段，看完后从中选出最经典的三个片段，这三个片段最好一个是开场部分的、一个是高潮部分的、一个是结局部分的。从选好的三个经典片段开始写，稍加评论就是一篇观后感。


    ## 注释


    - [1]手账源于日本，是集日程安排、生活感悟、读书心得、消费收支甚至百科大全为一体的超级手册，相当于记事本。——译者注


    ## 以“超级搜索力”深化知识


    下面，我们谈谈写作时如何活用互联网。


    互联网是创意之源，是百科知识宝库。只要能巧妙地活用互联网，将知识进行组合，就能提出新创意。


    我把与输出相关的互联网检索称为“超级搜索”。所谓超级搜索，就是针对某一主题连续进行5次甚至10次检索，不断深化学习知识的方法。


    简言之，超级搜索就是“在网上多查找相关信息”。但这么说没有新意，所以我就坚持使用了“培养超级搜索力”这种表述。


    大学课堂上，我会让学生们就某一个关键词上网搜索5分钟，看看能查出多少信息。


    四人一组相互配合，分头用智能手机反复检索。大家各自查完后将信息汇总并在课堂上呈现，小组之间的检索结果有时会有很大的差距。


    这样做可能会意外地发现，自己以前没有充分利用网络的搜索功能；整天从早到晚玩手机，却没有意识到手机也是思考的工具，忽略了手机的搜索功能。


    要问我为什么能够发现人们没有重视手机的搜索功能，是因为我曾多次在参加电视节目和书稿审定时指出其中的错误信息。


    明明上网检索四五次就会发现这些信息不正确，但有些人仍然理所当然地传递显而易见的错误信息，最后经常是我自己上网把所有信息重新查了一遍。


    网上的信息虽说真伪难辨，但只要多查查就能整理出相对精准的内容。比如网上有人说，拿破仑有句名言是“我的字典里没有‘不可能’这三个字”。其实，《拿破仑经典语录》中并没有这句话。

