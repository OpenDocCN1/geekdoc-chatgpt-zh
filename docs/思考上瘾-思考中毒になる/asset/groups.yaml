    # 凭借“假如”这种设想不断进行思考'
  md: '

    新。某些想法即使在这个领域被认为是失败的，换到其他领域也许就是了不起的大发现。如果可以更为灵活、宽泛地解读，我认为进行创新非常容易。但实际进行创新的人也不会仅仅是复制粘贴，破坏自己的形象。我想对这些人说：思考时再轻松点，你会发现创新非常简单。（摘自：NHK电视台专题纪录片）


    我对他这段话的解读就是“重组思维完全可以带来创新”。


    由此看来，世界上很多创新性发明源于重组。例如，“照片”与“贴纸”很久之前就有，但把二者结合在一起的“大头贴”却作为划时代的发明大受欢迎。仅仅把两种事物组合在一起，就可能创造出改变世界的价值。我觉得我们不应自卑地说“我只是进行了重组”，而应大胆追求重组；不是“重组也可以”，而是“最好是重组”。


    ## 改编原有信息并进行思考


    无论多么伟大的输出，都是源于“老素材”。


    比如，风靡全世界的电影《星球大战》最为重要的灵感就来自《千面英雄》这本书。这本书分析了神话故事的基本构成：概括来说就是，英雄千姿百态，但原型基本相似。


    好莱坞将黑泽明导演的《七武士》进行改编，拍摄了《豪勇七蛟龙》这部电影。有趣的是，黑泽明本人也以莎士比亚的戏剧作品《麦克白》为素材拍摄了《蜘蛛巢城》。


    《蜘蛛巢城》讲述的是日本武将的故事，故事情节虽与《麦克白》十分相似，但也是原创作品。


    顺带提一句，以《罗密欧与朱丽叶》《哈姆雷特》等莎士比亚作品为素材进行改编的艺术作品，古今中外都不乏其数。


    大获成功的作品大抵都是基于老素材。以古典作品、经典产品、大众服务为素材进行改编就是创意构思的基本方法之一。


    大受欢迎的漫画《鬼灭之刃》（我也买了全套）的基本内容就是“击退妖魔”。它可以说是在手冢治虫的《多罗罗》的情节上附加了变成鬼的原委始末等原创内容——简言之，就是新版的击退妖魔的故事。


    在没有任何素材的情况下进行构思的难度系数非常高，只要有素材，就能激发自己思考，从而接二连三地萌生出各种创意。


    在企业中，“将以前的热销产品改成现代风格的话，会是什么样的新产品呢？”这种讨论是非常有意义的。但这时也要限定时间，“大家请各自思考10分钟并发表自己的想法、意见”。这样一来，思考力就会大幅提升。


    ## 应用函数提出创意


    我认为将各种事物进行组合，提出创意的方法也是在应用函数。而且我认为在学到的数学知识中，函数是在日常生活中使用得最多的。我还记得我在中学的数学课上曾激动地说“这是划时代的思考方法”。


    函数用“y = f(x)”来表示，f代表运算法则，根据x的值可以推导出y的值。在思考新创意时，可以活用“某一项，通过一定的变换，就会产生某种新东西”这个原则。


    为了更清楚易懂，假设f是“厢式化”，x是“KTV”，就能推导出厢式化（KTV）=KTV包厢。


    我二十几岁时，说到“K歌”一般都是在快餐厅里或者旅游巴士上。这两个地方都需要当着陌生人的面唱歌。当时，去“K歌”的人很多，连续听陌生人唱歌有时会让人觉得有些无聊。


    但是，可以与家人、朋友一起“K歌”，还可以一个人“K歌”的KTV包厢问世之后，“K歌”一下子融入普通人的日常生活中。KTV包厢是一项创新发明。


    借用这个思路，我们将某种东西厢式化并进行思考。x如果是“居酒屋”，y就是居酒屋包间。x是棒球场地的话，y就是棒球馆。无论是哪个创意，现在都已在我们的生活中随处可见。


    有一次，我请大家就厢式化公式进行思考，没想到有人说：“x是宇宙，y是天文馆如何？”我觉得这个人想象力太丰富了！用这种厢式化思维重新观察我们身边的事物，脑海中就会不断浮现出“投币式寄存柜”“漫画吧”等成功案例。


    说到“运用这个厢式化公式思考新的商机”，很多人会提出有趣的创意。寿命长的电视节目大多都是f这个环节做得特别好，无论什么样的人参演都会有趣。


    我参加的综艺节目《全力！脱力时间》就是一个典型代表。这档节目以主持人有田哲平为首，参演嘉宾会提前看脚本。但每次担当吐槽者的搞笑艺人确实什么都不知道，现场对参演嘉宾的滑稽言行一一吐槽，非常有趣。


    在既有事物中找到f，活用f，改换x，这可以说是一旦掌握就会终身受益的基础思维模式。


    ## 凭借“假如”这种设想不断进行思考


    从其他视角进行全新构思时，运用“假如”也是一种方法。放飞自我，试想一下：“假如这个从世上消失，会如何呢？”“假如生活中有了这种事物，生活会有什么改变呢？”


    “假如能降落到月球上，我会做些什么呢？”


    “假如我变成深海鱼，能看到什么样的风景呢？”


    可以试想一下假如自己去了其他世界会如何，也可以尝试改变已有的故事情节，比如“假如这部小说的主人公不是大人而是小孩，会是什么情况呢？”“假如这部电视剧的背景设定不是证券公司而是小工厂，会怎样呢？”


    仅改变一个设定，故事就完全变了。由此可见，只要想象力丰富，创新力就会提升，就能一直坚持思考。


    青柳碧人的《很久很久以前，在某一个地方......》是将民间故事改编成推理小说。受其启发，我也曾要求大学生们以“××如果是杀人事件的话”为题，发表自己的创意。


    我至今仍然记得艺人武井壮刚开始在电视上露面时，以“假如”这个独特的段子赢得了很多粉丝。


    武井壮最初的介绍是“百兽之王”。说到“百兽之王”，绝大多数人会想到狮子，而自称百兽之王，这也体现了武井壮的别具一格。


    比如，假如与长颈鹿搏斗，他首先会跑到长颈鹿的背后，跳到长颈鹿背上，按住长颈鹿脖子上的穴位，这样就会使长颈鹿的血压下降，就地倒下。假如与狮子搏斗，为了不被狮子咬住脑袋，故意让狮子咬住自己的右手腕，手臂用力地堵住狮子的利牙，用拳头猛击狮子的鼻子，将其击倒。将这些写成文字，我都会忍俊不禁；若是加上实际动作表演出来，就更搞笑了。而凭借这些表演，他一举成为备受关注的人气艺人。


    从“假如......”开始思考，即使手边没有什么素材，一个人也能持续进行思考。


    就算是不现实的设想，能够持续思考也是重要的一环。坚持思考的人一定能想出某种办法，因此在现实生活中也能拿出成果。设想的力量不容小觑。


    设想即想象，想象即思考。


    ## 后记


    本书从各个角度浅谈了对思考上瘾的看法，但我最想告诉各位读者的是“享受思考”的重要性。


    工作中“只做分派给你的任务”，有人要求你说说自己的想法、创意，才会极不情愿地进行思考，这些绝对不是令人开心的工作方式。


