    ## 坚持预测未来走势


    我们养成“身临其境”地观察事物的习惯，就会具备预测事物未来走势的思考力。


    上中学时，我在社会实践中有过一次挑战“拆卸发动机”的机会。我当时是在三重县铃鹿市本田汽车的工厂里，和同班同学一起拆卸发动机。如今想来，那真是特别难得的体验。


    我们这组觉得做“拆卸”工作无比开心，好像比赛一样接二连三地把零部件都拆下来。最后拆卸完毕，成就感“爆棚”之时，本田技术人员的话却大大出乎我们所料。


    “好啦，大家都拆完了吗？那这次我们把拆下来的零部件重新组装起来吧。”包括我在内，所有组员都愣了好一会儿。大家之前都沉浸在拆卸的快乐之中，完全没有想到还有“组装”这项任务。


    回过神来，我们凭借记忆设法组装，试了好多次却没有成功。


    不经意间看了一下旁边，其他小组正在有条不紊地组装发动机。他们之前认真记录了拆卸零部件的顺序，好像倒放录像带一样，一步一步完美地按原样组装好。我至今都记得当时的懊悔情绪：“我们为什么没有仔细想想就把发动机全拆了？”


    拆完后重新组装并不难，只要冷静思考就会有大致的思路。而我们当时完全没有进行思考就拆了。


    这次失败的经历告诉我，“预判”是一项重要的思考。


    只要“身临其境”地去观察眼前发生的事，并预判其发展，就能较好地应对。


    “好像要下雨，带伞走。”


    “库存快没了，要抓紧订货。”


    继这些预判性思考之后，就会有“展望未来，决定作战方案”之类的原创性输出。


    “选择我们之前提到的A方式会是什么情况呢？ ”


    “避开A方式，选择B方式又会是什么情况呢？ ”


    基于这些假设来行动的人一定在认真思考。反之，漫不经心地听一听、看一看的人，绝对没有认真思考。


    ## 观察力和思考力保持一致


    只要有观察力，在任何工作中都能活用思考力。


    如前文所述，坚持用心思考的司机和完全不动脑思考的司机的驾驶水平完全不在同一个层次。


    餐厅里的客人举手说“请给我一份菜单”时，没有动脑思考的店员就只会拿着菜单过去，递给客人。


    而用心思考的店员会在客人提出请求前，将水和菜单一起拿给客人，在恰当的时候过去提供点餐服务。


    如果有可以把大脑活动可视化的装置，你会发现，用心思考的店员在以惊人的速度进行大量思考。


    “那桌的客人快吃完了，必须准备饮品。”


    “给这桌客人送水之前，要先给那一桌送菜单！”


    “对啦，那位客人不吃芥末，慎重起见，先跟厨房说一声。”


    现实中其实无须获得将大脑活动可视化的装置，只要看看优秀店员的一举一动，就能知道他们在用心思考。


    据我所知，优秀店员中有的人只是兼职人员，但他们仍然会记住客人的名字。


    如果被店员记住了名字，客人就会想着再去这家店。


    在列车上销售商品时，有的售货员会开动脑筋，用心思考。


    其中有些人很有销售天分，只在车厢内走一个来回，商品就被销售一空。听说有时在始发站准备的商品数量不够，中途停车时他们还要补货。


    销售的商品相同，乘客也基本相同，为什么在销售量上有这么大的差距呢？


    我乘坐新干线时，发现列车上出色的售货员在认真思考，他们会关注每一位乘客。这说明，观察力与思考力是紧密相关的。


    车厢里，乘客们会有所顾忌，说话时不由得都会尽量压低声音。


    曾经有个售货员在我低声说“咖啡……”的一瞬间，马上喊道“来啦”，然后立刻来到我身边。我想这位售货员的销售额一定非常高。


    出色的售货员在把咖啡倒入我的杯中、收钱找零时，都会自然地关注周围，观察有谁正看着他。正在犹豫是否要点咖啡的乘客与售货员目光相遇时，就会举手说“我也来杯咖啡”。


    这样一来，就会形成一种大家都想下单的氛围，坐在周围的人也都会点杯咖啡。


    老师也是一样，某位老师是否在动脑思考，只要看看他 / 她的目光就能大致清楚。真正的好老师在课堂上会跟全班同学对视好几十次。


    老师与学生对视，不仅能让学生的注意力更集中，还能看出有多少学生理解了上课内容、理解到什么程度。老师一边观察、一边随时调整讲解方式和进度，能让学生理解得更透彻。


    不仔细观察周围事物的人，与那些巧妙地把“所见”与“思考”结合起来的人，在工作方式上有天壤之别。


    ## 咖啡厅是最佳思考空间


    下面，我们来谈谈适合思考的环境。


    我一去图书馆，思考就会突然停止。我一到图书馆就会非常困，以至于我觉得那里弥漫着某种催眠气体。


    特别是东京大学的综合图书馆。上学时，我到那里刚一坐下，就觉得仿佛被睡神附体了。后来，我决定到学校对面的咖啡厅学习，没想到效率非常高。自此以后，一有机会我就去咖啡厅，在那里思考问题、写论文。


    这个习惯一直保持到现在。我甚至还写了一本书——《假如有15分钟就请去咖啡厅》，这种口吻的书名表明了我对咖啡厅的高度认可。


    现在如果去自助式咖啡厅，花200日元就能点一杯混合咖啡。花这点钱就可以有效利用碎片化的时间进行思考，性价比如此高的投资不多。


    变换地点有助于集中注意力进行思考。我在咖啡厅里一般会待30分钟至1个小时，因此咖啡厅可谓我在有限的时间里集中精力思考的最佳空间。


    而走出咖啡厅就暂且结束思考，去做其他的工作，张弛有度。因为是利用空闲时间进行思考，所以我经常会一天跑三家咖啡厅。


    我一进咖啡厅，思考的启动键就会马上按下。咖啡厅最大的魅力是，有适度的噪声。


    正是在这种周围有人、有声响且任何人都不关注自己的环境里，注意力才会高度集中。


    具体做法是，把思考时想到的内容直接记在智能手机的记事本中，之后再整理，使其条理清晰。或者在一张A4纸上把自己的想法都写下来。


    有某个时期，我在咖啡厅一直思考：“如何更好地提问？”“什么是优质的提问？”提问在交流过程中必不可少。我当时一直在想，能不能写一本关于高水平提问的书。


    当时，我的脑海中忽然浮现的词是“提问力”。如今“××力”已经是耳熟能详的表达了，但在当时大家对这个表达还不太熟悉。


    我直接以“提问力”为题出版了一本书，没想到成了畅销书。此后，我陆续出版了一系列以“××力”为题的著作。


    综上所述，咖啡厅于我而言是进行深入思考的最佳空间。在这里，注意力可以成倍提升。


    ## 向星巴克取经，使环境充满创意


    前文提到了咖啡厅，我想讲一个有关星巴克对思考空间的“名称”非常考究的小故事。


    NHK电视台的《去面试！GO！》这档节目是面向应届毕业生，介绍受欢迎的企业“面试空间”。这个节目有一期介绍了星巴克日本总部的接待室。面试候场的房间与星巴克门店的装修相同，面试的房间也具有星巴克的特色时尚风格。


    吸引我的是各个房间的名称。公司的接待室一般都是以第一接待室、第二接待室……或A接待室、B接待室、C接待室……来命名。


    而星巴克在这一点上，却创意十足。相信大家看到星巴克接待室的名称都会赞不绝口，异口同声地说“不愧是星巴克”。


    借此机会，也想请大家思考：假如你是星巴克的员工，你会给接待室起个什么样的名字呢？


    “（1号房间）（2号房间）太土了。”


    “怎样命名才能更好地体现出星巴克的‘特色’呢？”


    “蓝色和红色并非不可或缺......”


    大概在星巴克内部，也有过类似的讨论。


    最终，它以“坦桑尼亚”“卢旺达”这些咖啡原产地的名称来命名接待室。


    其他行业的公司如果在名为“坦桑尼亚”“卢旺达”的房间里面试求职者，会让求职者有强烈的违和感。但星巴克在以咖啡原产地命名的接待室里面试求职者，就会让求职者暗自赞叹：这是家很有创意的公司。


    虽然只是接待室的名称，但以咖啡原产地的名称来命名后，就会让人眼前一亮。同时，一个充满创意的环境，能激发人们思考。比如，在名为“坦桑尼亚”的房间里开会，坦桑尼亚的咖啡种植、洽谈会等画面就会浮现在与会者的脑海中。如此一来，他们的思路就会非常明晰。


    ## 持续进行思考的秘密武器是什么？


    下面从身体这个“硬件”方面，来谈谈如何提高思考的层次。


    身体的疲劳需要通过睡眠等来缓解。但受过训练的大脑与身体不同，即使进行高强度的思考也不易疲劳，而且只要吃点巧克力，摄取相应的能量，就会很快恢复。


    我从学生时代开始，就坚持随身携带巧克力。


    问我身边的人，他们大多会说：“喜欢吃巧克力，但不会随时携带。”如果问我是不是特别喜欢吃巧克力，我无法简单做出肯定的回答。


    仔细回想一下，我在看电视时并不会随手拿块巧克力来吃，也并非每天都想吃巧克力。大多都是工作日程排满、集中精力进行思考的时候，我会想到吃巧克力。


    综上所述，巧克力好比燃料，能给大脑补充能量。我随身携带巧克力，只是为了借助巧克力提升自己思考的效率和层次罢了。


    我看日本漫画之神手冢治虫的自传式漫画时，发现书中也有描写他吃蛋糕大量摄取糖分的场景。


    我现在看《三眼神童》《怪医黑杰克》等手冢治虫先生的作品，也会因作品的感染力和完成度赞叹不已。这些作品当时是在漫画周刊上连载，同时手冢治虫还发表了其他作品，对此我无比钦佩。


    漫画连载需要坚持每周拿出新创意。如果在三本周刊上连载，每周就需要拿出三倍的新创意。


    手冢治虫先生在短期内接连发表多部名作，正是坚持高层次思考的结果。


    手冢治虫先生应该是在每天的工作中锻炼自己的思考力，使自己的大脑处于不易疲劳的状态，并且通过吃蛋糕迅速缓解大脑疲劳，完成非同寻常的工作量。这大概是因为米饭中的淀粉转化为糖分需要时间，直接吃甜食能恢复得更快。


    以前没有思考习惯的人，也许稍做思考就会非常疲惫，这时如果吃一口口巧克力之类的甜食，也许立马就能缓解疲劳。当然，也要注意勿过量食用，以免有损健康。


    ## 进入忘我模式


    要想张弛有度地进行思考，需要将工作时间分为创造性工作时间和简单操作时间，不仅要提高简单操作的效率，还需尽可能地保持大脑清醒、不易疲劳。


    比如，贴信封时要以抄经、坐禅、冥想这样的状态来做，消耗最低限度的思考能量完美地完成工作。换言之就是“进入（精神高度集中的）忘我模式”。


    对我来说，做图书和杂志的校对工作时会进入“忘我模式”。出版过程中，定稿前需确认有无错字、漏字。错误如果没有校对出来，就会遗留到正式出版物上。


    说来惭愧，我曾有过这样的失败，样书送过来随意翻了几页就发现有错字、漏字（再版时立即更正了）。


    虽然校对了好几遍，但在放松状态下看稿，结果是不同的。换言之，因大脑所处的工作模式不同，工作效果也有很大的不同。


    “没有什么错误了吧？”“专业的校对人员都帮我看过了。”如果校对时这样想，就很难发现错误。反过来，校对时暗示自己：“一定还有错误。”“没人会帮我找出错误。”这样才能保持感官灵敏，能够发现错误。


    不过，一味地给大脑施压也是不正确的。在放松的状态下，让大脑处于只去“挑错”这一模式，就能发现错字、漏字。


    这是与写作等创造性工作完全不同的用脑方式。这是与“积极的创造力”相反的“保守”模式，打个比方，就是低速行驶。


    如此想来，坐禅看起来简单、枯燥，但能让人的头脑非常清醒。坐禅时，人通过冷静客观地审视自己来实现自我的提升。


    不带任何主观感情，客观地看待事物，叫作“静观”。总而言之，就是发现心中还有另一个自己，与焦躁、烦恼的自己保持一定的距离。


    冷静地审视正在简单操作的自己，这种训练在日常生活中也能进行。养成冷静、客观地观察自己的习惯，不仅有助于开心地进行简单且枯燥的操作，而且能张弛有度地进行积极或保守的思考。


    ## 第4章 坚持读、写、说，坚持思考


    ### 思考力体现在说话方式上


    人的思考层次首先体现在这个人的“说话方式”上。在工作中，“我想到答案了，但我无法用语言表达出来”这句话是说不通的。说不出什么具体内容就等同于没有在思考。


    无法把自己的想法用语言表达出来的人，在未来的社会也许寸步难行。工作中，比起会各种外语，首先要能用语言表达有意义的内容。


    能用语言表达的人擅长教别人。


    不要含糊其辞地说“大概就是这样，你做一下”“逐渐就习惯了，没问题的”，而要像指南一样，按顺序逐步讲解。“程序化人”缺乏思考力。但是，没有强大的思考力，无法归纳和制定出程序。


    今后，国际化进程将持续推进，国籍、出生地等背景不同的同事会大幅增多。与这些同事沟通、交流时，语言表达能力就会大显神威。


    对于认真思考的人，无论问什么，他 / 她都能给出令人满意的答复。通过采访中运动员回答记者的提问就能发现，一流运动员都有高度的思考力。


    比如，通过对西班牙皇家马略卡足球俱乐部的足球运动员久保建英的采访，可以看出他有高度的思考力，并且能用日语或西班牙语自如地回答记者的提问：


    > “观看足球比赛时，我发现失分基本上都不是技术问题，而是判断失误。足球比赛中无可挑剔的传奇射门暂且不论，大部分的得分都源于对方的防守判断失误。”


    一旦到了技术和体力势均力敌的专业对决，胜负则取决于思考力，这并非夸大其词。由于紧张和疲惫，一点点疏忽就会造成无可挽回的失败，因此不难想象思维水平会影响比赛时的判断。


    ## 注释


    [1]这里指按照程序机械行事的人。——译者注


    ## 思考速度与说话速度保持一致


    要求大家说说自己的感想时，支支吾吾地说“嗯……”“那个……”这类话的人很可能没有在思考。


    乒乓球运动员张本智和赛后面对记者的采访对答如流，完全没有“嗯……”“那个……”这样的表达。我认为，乒乓球运动员大多都有超强的思考力，因为乒乓球这项运动要求运动员必须瞬间做出判断并迅速应对。


    乒乓球常被誉为“仿佛是在以百米冲刺的速度下国际象棋的运动”。运动员根据乒乓球的行进方向、旋转角度、运行速度等，甚至可以判断出在这之后的两三个回合的球况，超快速地连续对打。


    乒乓球运动员通过平时的练习和比赛，不断进行这种思考训练，因此表达能力非常强，思路清晰、简洁明了。


    说话语速快的人通常思维敏捷。


    大脑高速运转的人，思考速度会超越说话速度，表达个人观点时语速必然很快。


    主持会议时，听到有些与会者的发言，我经常想对他们说：“您能以前三倍的话语速重新表述一下您的意见吗？”同样的内容，语速提升到之前的三倍，可以为大家节省很多时间。


    在大学授课时，我都会事先跟大家说：“我不接受语速过快这个投诉。”最初学生都觉得我语速快，不久他们就能逐渐适应并且跟上我的节奏。而且，不断进行思考训练之后，每位学生的语速也明显提高了。


    木然地进行思考的人无论思考多久，最终的思考结果都是有限的。要想多思考并思考上瘾，必须提高思考速度。


    最理想的是，反复进行提升思考速度的训练后，再延长思考时间。


    从我自身的经验来看，“思考速度=说话速度”，二者皆可通过训练提升。


    其中最有效的方法是，练习在短时间内把自己的想法干脆利落地表达清楚。这样也能了解自己在一定的时间内大概能有多少有效表达。


    ### 首先用15秒谈谈自己的感想


    建议没有养成思考习惯的人先从“15秒评论”开始练习。


    在学校的课堂上，老师经常会给学生思考的时间，如“下面请大家思考10分钟”，但这种思考时间大部分被浪费了。因为会解答的学生在1～2分钟之内就已经想出答案了，不会解答的学生在1～2分钟之内也就放弃了，不再思考。不论是哪类学生，剩下的8分钟都只是在消磨时间。之所以出现这种情况，是因为老师的时间设定不合理。


    很多人都没有长时间坚持思考的持久力。在这一点上，“思考”与“跑步”是相同的。平时坚持训练的马拉松运动员仅仅用2个多小时就能跑完全程42.195千米。同样，养成思考习惯的人连续思考2个小时也不会觉得痛苦。


    但是，如果突然对缺乏运动的人说“你去跑42.195千米的马拉松全程”，他怕是无法完成任务的。最可行的做法是，先从100米左右的慢跑开始，之后逐步延长距离，提升速度。


    思考也是如此，一开始很难进行长时间的连续思考。最初只需要“用15秒谈谈自己的感想”，这样逐步进入认真思考的状态。


    我作为一名教育工作者，一直在研究如何延长学生的思考时间。现在一些研究发现，思考与呼吸密切相关。


    简言之，吸气的瞬间思考会中断，因此持续思考则需要呼吸时尽量以呼气为主。


    我本人也在做呼吸训练，一分钟只进行一次或者两次吸气，说话就能持续不间断。因为看起来有些痛苦，所以学生会说：“您喘口气儿再说。”一般人说话时不吸气的话，最多能坚持15秒。


    因此，请先练习用15秒钟阐述自己的思考内容。


    ## 在雅虎跟帖区学到的评论能力


    我认为那些在跟帖区留下高情商评论的人都是“用心思考的人”。


    因此，在网络报道的跟帖区中，可以找到很多提高思考力的参考性表达。


    我在浏览雅虎新闻时也会大致看一下跟帖区，有时一天会看五六百条评论，发现很多意见一语中的，我每次都会暗自赞叹。


    2019年12月的拳击重量级冠军赛中，小安迪·鲁伊兹与安东尼·约书亚两位拳击选手进行了一场激烈的格斗，双方打满12回合，最终约书亚获得了压倒性胜利（但比赛中约书亚只是一味地采取防守策略，比赛毫无看点）。


    估计很多拳击爱好者观看这场比赛时都跟我一样郁郁不快。但在关于比赛结果的新闻报道的跟帖区中，都是对比赛情况的客观评价。


    其中令我印象最深的一条是，“希望维尔德能对其加以制裁”。


    关于这条评论，对拳击不了解的人，则完全不明其意。所说的维尔德的确就是重量级拳击手——世界拳击理事会当时的拳王德昂塔·维尔德。


    约书亚获得了三个组织的拳王金腰带，他与拥有其他金腰带的维尔德之间的对战令粉丝们非常期待。但从鲁伊兹与约书亚的对决来看，约书亚会被维尔德轻松击败。跟帖区中，大家的愿望都是“希望维尔德能以大比分击败约书亚”。


    我看到这条评论时，由衷佩服发帖人的语言表达能力——仅用一行文字就把拳击爱好者们心中的不快表现得淋漓尽致。爆笑之后，我不禁想高喊一声“奖励一个坐垫”。[1]


    我看到出彩的评论，就会特别开心，因为评论者真的用心思考了。有如此多的普通人肯开动脑筋，写下这么出彩的评论，仅凭这一点，就证明日本并非一无是处。


    浏览令人叫绝的跟帖区评论可以学习到很棒的思路。我特别推荐大家试试这个方法。闲谈之中的经典评论也同样值得我们学习借鉴。


    ## 注释


    [1]日本最“长寿”的综艺节目《笑点》以发放或没收坐垫来评判回答的优劣，答得好的奖励坐垫，冷场了则没收坐垫。——译者注


    ## 找个创意盟友


    将一个人的意见与另一个人的不同意见结合起来进行比较思考，也是很有启发性的。这就好比把两台计算机联机形成一台超级计算机。


    有史以来，对话一直被公认为思考的基本方式。古希腊哲学家苏格拉底通过与其弟子柏拉图对话，提出了自己的思想主张。柏拉图的著作几乎都是对话录的形式。由此看来，哲学原本就始于对话。


    “辩证法”原本也是由“对话法”发展而来的。苏格拉底是西方最早使用“辩证法”这个词的思想家，其弟子柏拉图则是辩证法的创始人，柏拉图的思辨辩证法为黑格尔辩证法所继承。辩证法看起来很高深，但简单总结一下就是“从某种主张开始（正），这种主张引起矛盾（反），调和矛盾推导出一个更高层次的结论”。


    换言之，就是可以与之切磋的伙伴的想法与自己的想法高速碰撞，双方能同时提升各自的思考层次，同时也能切身产生“思考停不下来”的感觉。


    我从中学时期开始，就有一位经常能一起切磋琢磨的朋友。一直以来，我都和这位朋友每天讨论2～3个小时。我与这位朋友考上了同一所大学，并一起读研，还住在同一条街道。我们一直坚持开展两人读书会。在读书会上，我们分别讲述自己所读的书和所看的电影，彼此提出疑问和意见，讲述人再针对这些疑问和意见阐述新的见解。


    探讨的话题每天都不一样，昨天是马克思，今天是尼采，明天就是黑格尔……因为每天坚持进行这种特殊的思考训练，所以我们两个人每天都会对谈论的事物产生新的创意。之后将其归纳总结成文，就是一篇小文章，就这样逐步进行深入思考。


    建议大家在工作中也找一位能一起切磋琢磨的搭档，每天在午饭时间对谈、一起探讨。


    与推心置腹的朋友轻松闲聊也可以，但我更推荐大家在闲聊的朋友

