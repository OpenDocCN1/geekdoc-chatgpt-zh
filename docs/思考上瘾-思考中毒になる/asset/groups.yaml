    ## 引 言\n\n“创新”这个词对于职场人士来说早就耳熟能详了。\n\n如今，无论是多么受欢迎的产品和服务，都有可能会过时，因此所有的行业及企业都需要不断创新。\n\
    \n在这样的时代，我们重新审视备受追捧的产品和服务，就会发现人类的睿智，并对此惊叹不已。\n\n比如，我们每天都在使用的iPhone等智能手机，不仅可以打电话、拍照，还有其他各种功能。每种功能都凝结了设计者的智慧和努力，我们每天享受着这些成果，过着舒适的生活。\n\
    \n那么，到底什么样的人会提出崭新的创意并能下功夫设计出创新型产品和服务呢？\n\n无疑，一定是“坚持思考的人”。\n\n- “提供什么样的服务，客人才会开心呢？”\n\
    - “如何才能开发出划时代的产品呢？”\n- “怎样才能进一步提升效率呢？”\n\n总是对这种想要进一步提升或者想要进一步突破的问题不断进行思考，就会有更好的输出。而改变社会的创新型产品及服务就会从这些输出中闪亮登场。\n\
    \n总能拿出某种成果的人一定是“忍不住思考的人”，即“思考上瘾的人”。\n\n说到思考上瘾，也许大家的脑海中会有这样一种印象，即：因某种空想着魔，非常痛苦。但事实恰恰相反。\n\
    \n就我自身来看，忍不住思考这种“思考上瘾”的状态会给人带来无与伦比的快感。并且，思考上瘾还能使得掌控人类思考判断力的大脑前额皮质更加活跃，使人身心健康。这与毒瘾、酒瘾有本质上的不同。\n\
    \n人一旦思考上瘾，就会活得非常开心、洒脱。\n\n将所有的产品、服务，甚至从文化到艺术都作为“思考的结晶”来审视，养成这种习惯，感应思考的“传感器”就会非常敏锐。\n\
    \n就算是吃便利店里的甜品，我们也会马上感受到甜品制作人在思考上的用心，感动和敬意也会油然而生，并且我们也会想把这种用心思考活用到自己的工作中。\n\n用心思考做出的产品，其销售额会增长，会受到业界人士的认可，我们自己的工资也会随之增长。思考上瘾可谓好事连连。\n\
    \n本书阐述的是，在“思考力”备受关注的现代，将思考习惯化、不断加以创新的有效途径。\n\n> “平时基本不思考，工作都是例行公事。”\n> “上网浏览一下社交网站，一天的时间不知不觉就没了。”\n\
    \n对于上述这类人来说，最初也许会觉得思考是件麻烦事儿。\n\n但是，如果他们掌握本书介绍的体系和诀窍，意识到思考的乐趣，就会成为能不断思考的人。\n\n\
    我们只要养成思考的习惯，就会觉得不进行思考就是虚度光阴，相反则会感受到生活的充实。在我看来，思考上瘾的人一定会有幸福的人生。\n\n衷心地希望诸位都能思考上瘾！衷心地祝愿诸位都有精彩的人生！\n\
    \n## 第1章 为何要思考上瘾？\n\n### 思考是一种创新\n\n我担任NHK电视台教育频道《边玩边学日语》这档儿童节目的总策划已有15年之久。节目组每年都会在特定的时间召开下个年度的策划会。这个会议的绝佳之处在于，会议伊始，参会者就会踊跃发言，不断地提出创意。\n\
    \n大家就新栏目的创办、已有栏目的升级、演出人员等，往往能提出几十个创意，虽然最后仅有极少数的几个会被采纳。\n\n我作为总策划，原本只是归纳总结大家的意见，但我还是会和大家一起思考，不断提出多个创意。\n\
    \n有人提出一个创意，其他人就针对这个创意进一步提出“这么做如何？”的问题，不断讨论，拿出最终方案。\n\n其实，这个会议还有“加场”。会议结束后，大家一起去吃饭时，在饭桌上，参会者还会不断提出创意。\n\
    \n最开始大家都是边吃饭边讨论，不知不觉就会忘记吃饭，情绪激昂地争论起来。\n\n想必在大家的工作单位，每天也会进行这种讨论吧？\n\n会上要求大家发表意见时，有人会阐述一般的观点。比如，在男士化妆品的开发会议上，有人说：“男士想要提升魅力的愿望原本就很强。”\n\
    \n这个发言貌似颇有道理，但这种人自始至终都是在阐述与己无关的抽象理论，不可能提出关键且具体的创意，换言之，就是“没思考”。\n\n也有另一种人，获得发言机会之后才开始思考。我特别想问他：“之前你到底在做什么？”这种人在开会前和开会时都没有做准备，一直是在假装思考。\n\
    \n我做过很多年的老师，哪怕是在上千人的课堂上，对任何一名学生是否在动脑思考我都了如指掌。不只是从学生讲述的内容、方式，我从他们的表情也能判断他们的思考层面。\n\
    \n根据我的经验，“看似认真思考”的人比较危险。这种人虽然摆出一副认真的样子，但让他说说自己的想法时，他大多讲不出具体内容。真正认真思考的表情与“看似认真思考”的表情是完全不同的。大多数时候，表情上看起来认真的人，实际上根本没有在思考。\n\
    \n他们如果真正认真的话，应该全力拿出自己的创意和意见。换言之，拿不出创意和意见的人仅是做出“认真的样子”而已，实际上是极其不认真的。\n\n真正动脑思考的人是能具体说出自己的创意和意见的人。\n\
    \n供职于策划部门的人只有提出策划方案，大家才会认为他“动脑思考”了。我们如果只是做做样子的话，根本不会有自己的想法。所以，在工作和学习中要想有所创新，最关键的是先要学会思考。\n\
    \n### 思考不包括“想事儿”\n\n在陀思妥耶夫斯基所著的世界名著《罪与罚》中，关于“动脑思考”有这样一个令人深思的场景。\n\n主人公拉斯柯尔尼科夫是一位贫穷的知识青年，因拖欠学费被迫辍学。他虽然头脑聪明，但不被社会接受。他虽然因周围人不认可自己而愤愤不平，却又整日窝在又破又小的房间里。\n\
    \n房东家年轻女佣娜斯塔西娅无法理解他的状态，两人之间有这样的对话：\n\n> “（前略）你最近为什么不做事呢？”\n> “我在做啊……”拉斯柯尔尼科夫支支吾吾且不耐烦地回答道。\n\
    > “你做什么了呢？”\n> “工作……”\n> “什么工作呢？”\n> “想事儿。”拉斯柯尔尼科夫稍做停顿之后严肃地回答。（摘自《罪与罚》）\n\n拉斯柯尔尼科夫认为“想事儿”是工作。而在娜斯塔西娅看来，他这是无所事事。\n\
    \n结果，他想出杀死放高利贷的老太婆的计划。他不断陷入一种思维怪圈，认为“只要杀死那个放高利贷的老太婆就可以解救债务缠身的人”“一种小的罪过可以由百种善举来抵偿”。\n\
    \n其实，所谓“想事儿”，根本没有动脑思考。我曾经与（日本）东北大学加龄医学研究所川岛隆太所长就此交谈过。\n\n川岛所长说，人在“想事儿”时，测一下他的大脑前额叶血流速度就会发现，血流速度并不是很快。相比而言，大声朗读日语、英语时，大脑前额叶的血流量更大，人们都觉得简单的朗读反而更能激活大脑。这一点已经由脑科学研究所证实。\n\
    \n“想事儿”大多是“为事情而担忧”。很多人会误以为因某件事情而烦恼、忧思的状态是“动脑思考”。\n\n“想事儿”的特征是反复进行同样的思考。没有丝毫进展，就是“来回兜圈子”。“想事儿”时，内心是迟疑不决的。\n\
    \n其实，我本人在读研究生时也有过这样的经历：只是整天东想西想，对论文完全没有动笔。\n\n当时，我暗下决心要创立一个像弗洛伊德的精神分析论那样伟大的理论，每天都在冥思苦想。但其间我有段时间也沉迷于看音乐剧，就这样虚度了一年的光阴，一篇论文也没有写。\n\
    \n学者只有完成论文，才能把思考的结果有形化。在没有写论文的那段日子，我以为自己在动脑思考，实际上却是什么都没思考。\n\n### 亦可忧思\n\n首先需要把“想事儿”与“动脑思考”区分开。不断减少“想事儿”的时间，尽可能地增加“动脑思考”的时间，以此为目标是关键。\n\
    \n“忧思”在古日语中用“远眺”这个词形容。\n\n忧思逢苦雨，人世叹徒然。\n\n春色无暇赏，奈何花己残。\n\n这是收录在《古今和歌集》与《百人一首》中的小野小町的佳作，诗歌的大意是“春日不绝的细雨中，樱花已凋零殆尽。我空虚度日、徒然伤感之时，容颜也已像忽苍老......”在诗中，小野小町将“连日降雨，花色褪去”的景象与“徒然伤感，虚度时光”的自己联系了起来。\n\
    \n像小野小町这样惆怅于过去是人之常情，也能引发现代人的共鸣。如果没有惆怅过去这样的情感表达，《百人一首》中恐怕会少三分之一的诗歌。\n\n当然，就算是现代人，我觉得也需要有忧思的时间。比如，初高中时期，对某个异性同学产生爱慕之情就会朝思暮想。否定了这种朝思暮想，人生就会有些枯燥无趣。\n\
    \n约会时及假期与家人待在一起时，我觉得最好只关注眼前人。但是，充分享受这种美好时光之后能够转换思维、持续思考的人才是社会所需的人才。\n\n### 人工智能时代需要最佳思考力\n\
    \n当今时代以惊人的速度在不断进步。身处江户时代（1603—1868年）的人如果看到现今我们的工作状态，应该会被我们的工作速度吓到。我们即便无法理解自己在做什么，也还在飞速工作着。对于这一点，他们应该也会受到巨大的冲击。\n\
    \n也许现代人理所当然地遵循历史上天才们的用脑方式。\n\n江户时代自不必说，与经济高速增长时期（1955—1972年）相比，如今的商务人士也需要更快的速度、更好的创意、更强的交流能力。\n\
    \n我的业余爱好是看体育比赛，经常会看国外足球比赛的实况转播。对比现在顶级的俱乐部与在1968年墨西哥城奥运会上斩获铜牌的日本队，就知道现在的运动员速度更快。十年前只有顶级运动员才能完成的技术动作，如今普通的运动员也能轻松完成。\n\
    \n对于任何运动项目，竞技水平都会不断提升。\n\n美国的吉姆·海因斯在1968年创造出男子100米9秒95的新世界纪录，在世界上首次突破了10秒大关。\n\
    \n但在那之后，多位运动员刷新纪录，目前男子100米纪录保持者是牙买加著名的短跑健将尤塞恩·博尔特。\n\n有趣的是，标准一旦提升，以前的最高标准就会成为现在的基本标准。\n\
    \n1972年慕尼黑奥运会日本体操运动员冢原光男首次完成了“月面空翻”这个超难动作，震惊世界。当时报纸上刊载了“月面空翻”的动作分解照片，人们都觉得冢原光男简直是超人。\n\
    \n但是如今，很多年龄特别小的运动员也可以完成“月面空翻”。时代在不断进步。\n\n能力日益提升的现代人每天都在辛苦地工作。虽然大家都有非凡的能力，但问题在不断增加，难度也在不断提升，如果不坚持思考的话就无法解决这些问题。\n\
    \n如今，社会上的产品和服务均处于饱和状态，“只要生产出来就有销路”的时代已经结束。业内竞争较之前更为激烈，信息的传播速度也比之前提升很多。因此，即使企业将令人耳目一新的产品及服务投入市场，也很快就会被对手赶上。企业不改进工作方式、不创新，就有可能被时代抛弃。\n\
    \n并且，最近各个领域都在加快引入人工智能（AI）的步伐。据估计，今后如果不断引入AI，机器人就会开始替代人类的各种工作。\n\n在杂志和网上经常能看到“因AI出现而将消失的职业”的专题报道。我们也经常听到有人说，随着自动驾驶汽车不断普及，出租车司机、公交车司机都会失业，AI将会取代诸多白领。\n\
    \n比如，以前人们公认的专业性强、收入高的律师这一职业，也不再是“铁饭碗”了。AI律师的业务能力可能会是人类可望而不可即的。\n\n### 人工智能无法取代人承担需要思考力的工作\n\
    \n在美国，AI律师已经开始承担律师助理的很多工作。在未来，仅有重视沟通交流、组织管理的工作需要人类来从事。\n\n中小学老师暂时还是会由人类来做。因为学校的职能不仅包括教授知识，还包括培养人格，而AI对孩子进行人格教育还是难以想象的。\n\
    \n除此之外，还有护理工作，这项工作不仅需要体力，还要求具备体贴入微的交流能力，这也是AI难以替代的。\n\n在职场中，事务性工作未来大多会逐步由机器人来承担，但并非连管理者也不需要了。\n\
    \n全面把握职场伙伴的脾气秉性，策划项目及研究战略战术是人类特有的能力。\n\n这是因为人类的理解有复杂且深邃的一面。能够做出综合判断的只有人类：这不仅包括数字化的信息，还包括隐性知识和自身认知。也就是说，我们今后想要维持生存并拿出成果，除了提高思考力之外别无他法。\n\
    \n福泽谕吉在《劝学篇》开篇这样写道：“上天不造人上之人。”他主张人类没有高低贵贱之分，同时也提出这样的观点：\n\n世间既有复杂的工作，也有简单的工作，据说做复杂工作的人地位高，做简单工作的人地位低。（摘自《劝学篇》）\n\
    \n“简单工作”是任何人都可以做的可替代性工作，在现代社会是指早晚会被AI所取代的工作。与此相反，“复杂工作”是指只有潜心钻研的人才能做的、难度系数较高的工作。\n\
    \n唯有坚持思考的人才能自如地完成难度系数高的复杂工作。从事难度系数高的工作，竞争对手少，也能获得相应的高报酬。\n\n动脑思考完成较为困难的工作，在平步青云的历史人物中首先让人想到的就是丰臣秀吉。\n\
    \n丰臣秀吉年轻时把织田信长的草鞋放在自己的怀中捂热之后再递过去，令人无比钦佩。也有人说这段佳话是后人杜撰的，但看看丰臣秀吉的丰功伟绩，我觉得也不乏真实性。\n\
    \n看看丰臣秀吉的功绩，就会知道他是一个无时无刻不在动脑思考的人。\n\n比如，他受织田信长之命，进军备中，攻打毛利军守备的高松城。他利用水攻包围高松城，但听说织田信长在本能寺战死，迅速和毛利军讲和，率领部队仅用10天从关西地区急行军回到京都，这是唯有丰臣秀吉才能完成的、载入史册的行军。\n\
    \n让士兵只配一把短刀，轻装上阵；让运粮部队先行一步，事先做好物资补给准备；通过奖赏提升士气，等等。在丰臣秀吉这些周密的战略部署下，“大返军”得以实现，即从关西地区迅速赶回京都。\n\
    \n通过这样不断动脑思考，持续执行新的作战策略，丰臣秀吉终于官居关白。\n\n如果我们问丰臣秀吉“此前的10分钟你在想什么？”，我想他绝对不会说“我在想事儿”，而是当即滔滔不绝地提出几个提案。\n\
    \n现在身居一线的经营者应该也会做出同样的回答。从事复杂工作的人一般会坚持动脑思考，这是古今中外公认的真理。\n\n### 思考之差即工作之别\n\n坚持思考的人会在工作中取得创造性成果。\n\
    \n例如，思考在开车等时候会清晰地体现出来，因为信号灯、堵车、车道数量、天气等道路状况会时刻发生变化。\n\n在不断变化的情况下，要想始终能选出安全且顺畅的行驶路线，需要相应的思考力。特别是专职司机，这种思考力的差距会直接体现在最终的选择结果上。\n\
    \n我打车时遇到过这样的司机，明明三条车道中有一条车道没有车，但他偏偏选择堵车的那条车道。\n\n这种时候，我虽然有些顾虑，但还是会尽可能语气平和地跟司机说：“请先走左边的车道，略微提速，到前面那个十字路口再回到右边的车道……”。\n\
    \n我之所以“越俎代庖”，是因为我对这条路了如指掌：每天都走，非常清楚怎么走不会堵车。这样一来，与自己什么都不做、全权交给司机相比，会提前到达目的地。\n\n\
    但是，其中也有完全不需要我出声、思考力特别强的司机。他们每时每刻都会选择最佳的车道，以最佳速度行驶，并且在确保安全的同时早早地把我送到目的地，着实令我惊叹。遇到这样的司机，不仅节省时间，车费也会比平时少好几百日元。\n\
    \n仔细想想，我就有一点不解：优秀的老司机提早驶达目的地的话，车费就便宜；明明告诉了新手司机怎么走，但还是到得晚且车费贵。如果出租车公司这样收费——对于不熟悉路况的新手司机，车费可享受8折优惠；对于优秀的老司机，乘客要多付10%的费用——我觉得选择该出租车公司的客人会增多吧。\n\
    \n现实情况却是，优秀的老司机没有获得相应的报酬。因此，我至少会对他们的职业素养加以称赞，诸如“您真的是在用心开车！”“您太专业了！令人钦佩！”。\n\n\
    最近，教育领域也开始重视这种动脑思考能力。\n\n日本文部科学省颁布的《平成29—30年改订学习指导要领》，把新时代的孩子必备的能力主要归纳为以下三类：\n\
    \n- 在人生及社会中活用所学知识的能力、素养；\n- 在社会与实际生活中生存、工作所需的知识和技能；\n- 应对未知状况的思考力、判断力、表达力等。\n\n\
    我认为，“思考力、判断力、表达力”这三种能力是不可分的。此前有一段时间，我认为能把书本内容像拍照一样一字不落地背下来的孩子是“好学生”。而现在看来，善于思考，有判断力，并且能很好地表达出来，才是核心能力。\n\
    \n我们在工作中同样需要这样的能力，因为开发新产品或者新服务时需要拿出创意并进行选择，再落实于生产。\n\n司机准确地变更行驶路线，把乘客尽早送到目的地，正是完美践行“思考力、判断力、表达力”的典型案例。\n\
    \n据我观察，在工作中能够坚持动脑思考的人占10%～20%。我们看看这些人的工作状态，应该就能了解工作中的思考具体指什么。\n\n尤其是动脑思考的人与没有动脑思考的人做同一工作时，两者之间的差距非常明显。思考力强的人出现失误马上就能分析原因，找到问题并快速改正。工作做得越多，反馈信息就越多，工作就越有效率。\n\
    \n因此，他们会比工作中完全不动脑思考的人能拿出更多的创新性成果。\n"
