    ## 有弱点才有创造力


    很多时候正是因为有了各种规则、限制条件才有趣。比如，足球比赛正是因为有守门员之外的人不许用手碰球这条规则，才会作为一项绚丽多彩的运动发展起来。硬性禁止使用日常生活中使用频率最高的双手，是足球这项运动最大的魅力。


    《灌篮高手》《浪客行》等人气漫画的作者井上雄彦被问及“角色创作技巧”时，做出的回答是“让这个角色有弱点”。这个回答令我印象深刻，这也体现了限制条件的重要性。


    弱点对于每个人来说都是一种限制。有弱点（限制），人物角色才会有魅力，故事也因此会妙趣横生。正因为如此，井上雄彦的创作特点是给人物角色强加弱点。除此之外，“没有预算”“预算有限”也是一种激发创造力的限制条件。“没有预算”通常被当成消极因素，但从另一个角度来理解，“没有预算”也会激发人们不断地去思考并实现“如何制作出优质产品”。


    意大利电影导演罗伯托·罗西里尼在第二次世界大战期间，通过募捐筹集资金，用手头的相机在路上、实际的建筑物中进行外景拍摄，起用业余演员，通过这样的方式留下了《罗马，不设防的城市》这部电影史上的杰作。


    最近也有一个类似的案例。预算仅有300万日元的电影《摄影机不要停！》在全日本公映，引起非常大的反响。


    关于提升思考力，我给大家的建议是，在日常生活中设置禁止事项与限制条件，并将其游戏化。比如，从离家最近的车站回家，我会设置“不许右拐”这样一个限制条件。想要右拐时，就连续左拐三次，绕一个大圈儿。


    或者，强行用左手来完成平时一直用右手来做的动作。平时用右手轻松就能完成的动作，换由左手来完成，我们一般会突然觉得异常困难。


    我不是左撇子，但有段时间故意练习用左手吃饭。父亲责备我说：“你要适可而止！用右手吃饭！”在爸爸的责骂声中，我仍坚持练习了大约一年。


    强迫自己用左手拿筷子本身几乎毫无意义。但是，之前能够轻松完成的平常之事突然变难了，人就会开始思考方法，这一点意义非凡。


    也许有人会觉得荒谬。但凡事都设定限制条件，我们会觉得跟游戏一样有趣。倘若养成了这样的习惯，我们在工作中受到各方约束和限制时也会觉得有趣，也能开始深入思考，寻求解决办法。


    ## 以截止日期来激发思考


    截止日期也是一种限制条件。并且在激发思考方面，截止日期的效果是非凡的。


    比如，工作中只要收到“一周之后提交策划方案”的指示，任何被通知人就都必须在截止日期前进行思考，并将自己的思考有形化。


    尤其是没有截止日期的时候，或者有充裕的时间进行思考时，建议大家自己设定截止日期。还要注意的是，一定要自己设定且尽量是较为切近的日期。


    思考的最佳时机是针对相应主题开始进行思考的时候。这正是所谓的趁热打铁。如果最终的截止日期设为一个月之后，通常是最后的两三天坐立不安地进行思考，而之前的二十多天没有进行任何思考。思考停滞的这二十多天完全是浪费，没有任何意义。


    因为难得确定一个主题并开始思考，所以我一般都在当天尽可能地思考更多，并在智能手机的备忘录上做好记录，或是总结成简短的文稿。


    别人拜托我做什么事情时，我都会尽量当场做出回应，立刻思考并尽量予以详尽的回复。对方经常会十分惊讶地说：“呀！这么快就好了？！”


    我在前文中说过，我原本是一个极度怕麻烦的人，以前也是那种8月31日通宵完成暑假作业的学生。走向社会开始工作后，我依旧有这种拖延症，但出版一类的相关工作增多后，我逐渐开始觉得“不可以再这样拖延了”。


    比如，为杂志撰稿，我大多是在年末（或是盂兰盆节、黄金周等长假之前）接到约稿请求，截止日期基本都是新年休假结束之后（或是盂兰盆节、黄金周等假期结束之后），如果七、八月份稿子赶到一起的话，长假的最后一天就会非常痛苦。最终，我意识到必须自己设定截止日期，分批完成。因此，我按照顺序，接到约稿请求马上就开始动笔，不只是在家坐在电脑前从容不迫地写稿，外出时也尽量用智能手机的备忘录见缝插针地写稿，写完一段发送一段，如此反复。这样一来，我就会以一定的节奏持续思考。


    村上春树和赤川次郎也在随笔中写道：“始终坚持在出版社规定的截止日期之前提交稿件。”我在心中暗自钦佩：不愧是畅销书作家。


    他们在自己设定截止日期之后，应该还会有持续进行高质量思考的方法。正因为如此，他们才能写出备受读者喜爱的畅销书。


    ## 限定时间，逐步思考


    以更小的时间单位来设定截止时间与细分规定时间是相通的。我一直将咖啡厅作为“思考空间”的目的，既是想要创建一个让人容易思考的空间，也是在设定思考时间。


    因为想要在有限的时间里得出思考成果，所以我就会集中精力构思、写稿。


    著名漫画家佐佐木伦子的某部作品中有这样一个场景：编辑和漫画家坐在公园的长椅上，异口同声地说：“一二三、一起思考！”短时间的思考之后，他们相互说出自己的想法、创意。


    如果一次没有想出好的创意，就会说“再来一次”，再次进入短暂的思考。


    这种将时间细分成一小段一小段进行思考的方法在提升注意力、激发创意方面非常有效。


    为了将时间细分为一小段一小段，我在大学的课堂上经常使用秒表。


    例如，我在课上会布置这样的任务：“请每个小组用1分钟的时间思考出一个创意。”对于在1分钟内没有想出创意的人，我会进一步施压：“没有想法等同于没有尽力去解决问题的意愿。”“如果在入职面试中说不出自己的想法，就会被淘汰，无法进入下一轮面试。”在极短的时间里要求大家必须说出自己的想法，任何人都会集中精力、用心思考。反复进行这种训练，100分钟的课程节奏就会非常快。


    工作中的很多时候，也需要大家在规定的时间内说出自己的意见。


    大家平时自己多做这样的思考训练，在关键的时候就能说出自己的创意。


    ## 没有分析就没有改善


    进行思考的方法之一是分析。分析是想出新创意的过程中非常重要的一个环节。


    比如，工作中出现什么问题时，只要弄清楚问题的原因，就能采取相应的对策。


    2005年，JR西日本福知山线发生脱轨事故，造成107人死亡、563人受伤。事故发生后，日本航空与铁路事故调查委员会对事故原因从各种角度展开了调查。


    这起事故的直接原因是列车高速进入弯道，没有彻底拐入弯道，就此脱轨。但是，专家通过调查发现，发生事故的列车在事故前一站停车时因为开过站，晚点1分20秒发车。因此，人们怀疑是因为列车司机想要追回延误的时间，一时心急，超速驶入弯道，或者是因为没有及时踩刹车。


    那么，司机为什么会那么着急呢？间接原因是来自JR西日本经营方面的压力——提高列车运行速度。


    另外，调查显示，当年乘务人员出现失误时，公司会对他们进行所谓的日勤教育。这与其说是教育，倒不如说是不讲理的私刑。晚点几十秒的司机也需接受这种惩罚性指导。想要避免这种惩罚，司机在心理上就会极端恐惧列车延误。


    JR西日本在发生脱轨事故的现场修建了纪念馆。我去过这家纪念馆，这家纪念馆在祭奠、追悼事故罹难者的同时，也公开了事故相关的记录，诸如事故发生时的情况与救援情况，以及事故原因、事故反思等。


    据说，其他铁路公司的工作人员也会到这家纪念馆针对事故进行学习。


    综上所述，不是以“偶然的变故”“个人的失误”来解释一个事故，而是进行彻底分析，这是汲取事故教训的重要环节。


    分析是将失误细分并进行周密研究的行为。细分之后按照时间线进行研究，重大问题也会因此迎刃而解。


    换言之，分析是思考的根本。问题发生时是否会陷入思考停止状态或者能否汲取教训，都取决于是否具备分析力。


    ## 比较会促进思考


    2006年的热映电影《达·芬奇密码》是改编自美国作家丹·布朗同名小说的悬疑惊悚电影。所有的解密密码都藏在《蒙娜丽莎》《最后的晚餐》等达·芬奇的名作之中，需要对这些密码逐一进行破解。


    > “基督旁边的人看起来好像有秘密吧？”

    > “为什么这把刀放在这里呢？原因是什么呢？”


    仅仅是一幅画，如果我们开动脑筋、用心思考的话，也会有10个、20个甚至更多的发现。但通常情况下，我们即使欣赏更多的美术作品也不会思考那么多。


    大家在美术馆欣赏一幅画，有多少时间用来思考呢？


    > “好漂亮的画！”

    > “这部作品与其他作品画风不同。”

    > “色彩调配很有趣。”


    哪怕仅仅是想到这些，思考也不会马上停止。面对同一幅画，有人会一直站在那里，但我觉得不等于他一直在思考。


    无法持续进行思考、无法提出创意时，方法之一就是比较。通过比较，我们可以更加轻松地认识事物。


    比如，具体来说就是将米开朗琪罗的雕塑作品与其他雕塑家的作品进行对比，并列举出不同之处，同时思考米开朗琪罗作品的卓越之处。


    这是连小朋友都能做到的极其初级的思考方式。我让小学一年级学生观察凡·高和皮埃尔·奥古斯特·雷诺阿的作品，并问他们：“这两幅画有什么不同呢？”他们也能指出几个不同点。如果给他们看的是凡·高和毕加索的作品，则能说出更多的不同之处。能发现不同，就证明能够进行思考。


    近代语言学之父、瑞士语言学家索绪尔认为，事物的意义源于差异。如果意义源于差异的话，找不到事物的意义时只需将其与其他事物进行对比研究。就算只有两条信息，对比一下就会有某种发现。


    > “这款产品与其他公司的产品有何不同呢？”

    > “我们的服务与大获成功的服务差距在哪里呢？”


    从这些方面的对比出发，就能轻松开始思考、坚持思考。此外，按时间进行对比也是一种方式。


    例如，将第一代iPhone与最新款的iPhone进行对比，并思考在哪些方面发生了变化、有什么样的改变。也许从这些改变中，我们可以获得能够应用于工作中的启发。


    我们还可以在便利店将两款新产品进行对比，看看哪款的销路更好，并对其进行定点观察，验证自己的判断是否准确。我们可以据此思考：假如开发新产品，什么样的产品会更合适呢？这就是通过对比进行思考的成果。


    ## 在其他领域寻找受热捧元素


    对比两个事物时，仅仅做出“A比较好”“不，B更好一些”这类评价的话，思考就会停止。在对比A和B的同时，要辩证地提出C创意。新的创意才是思考的结晶。


    讨论类电视节目中，有时会出现这种情况：两位有识之士彼此主张自己的观点，互不妥协，讨论异常激烈。


    这种激烈的讨论也许是出于追求娱乐效果，但我有时会觉得“明明可以进行更有建设性的思考，这太浪费时间了”。


    固执地坚持己见、不肯妥协就等同于思维过于僵化。我们身边如果有这种“死脑筋”的话，就需要注意。


    纵观历史我们会发现，对立与战争大多是因“仅此、唯一”这种主张上的冲突而起。宗教纷争是最有代表性的。


    若想自己的思考真正出成果，最理想的应该是根据彼此的意见，化解矛盾，得出建设性结论。并且，如果两位有识之士在节目开始前或结束后各自讲述一下自己的思考方式是如何发生变化的，我觉得思考的成果就会非常明确。通过跟思考方式与自己完全不同的人进行讨论，提升思维的灵活度，这是最理想的。


    回归正题，应用对比思考的方式可以“在看似完全不同的事物中找到相似之处”。


    据说轻型喷气式飞机“本田公务机”机头部分的灵感来自菲拉格慕的高跟鞋。


    有位学生在研究《源氏物语》时，将《源氏物语》中出场人物的自我意识与陀思妥耶夫斯基作品中的人物进行对比，找到他们的共通点并发表了论文。


    通过训练，将两个完全不同的事物进行关联的思维模式也会随之开启。比如，开创“控制论”这个新领域的数学家维纳主张将生物、机械控制、通信这三个方面统一起来进行研究。简单来说，就是将动物的存在方式与社会体系进行关联，这正是将完全不同领域的概念进行关联思考的代表性例子。


    在工作中，对比毫无关联的两个领域的人气产品或服务，从中找出共通点，可能很有趣。


    相反，大家都认为相似的两种事物，当发现它们细微的不同之处时也会激发思考。


    比如“看到蓝色”时，仔细观察一下会发现，“蓝色”可以细分成好几种。同理，“会员优惠”“多买优惠”初看是非常相似的促销手段，但区别在哪儿呢？仔细分析一下，我们就能找到它们各自的优缺点。


    同样是“削减连续工作时间”和“改革工作方式”，仔细对比A公司与B公司的具体措施，也许就会发现二者在目标的方向性及内容上有非常大的差别。


    > “看似完全不同，实则有相似之处。”

    > “好像非常相似，细看发现完全不同。”


    具备对比思考的思维模式，思绪会无限驰骋。


    我甚至认为，通过对比思考，可以思考所有事物。


    ## 诺贝尔奖获得者告诉我们要重组思维


    以某种材料为基础进行重组，并添加其他要素，会带来变革性输出。这种方法称为“重组思维”。


    2002年诺贝尔化学奖获得者田中耕一是就职于岛津制作所的一位公司职员，当时因作为上班族的励志典范备受瞩目。


    田中耕一获奖时43岁，应该是较年轻的诺贝尔奖获得者。


    田中耕一一说起，自己年纪轻轻就获得这份殊荣，可以说倍感压力，曾每天自问：“我配得上诺贝尔奖吗？”一般来说，人们获得诺贝尔奖之后，即使欣喜若狂也不奇怪。我们从这段小插曲可以看出田中耕一的人品。


    而且更令人钦佩的是，田中耕一为了再次证明自己真正配得上诺贝尔奖，提出新的目标并为之努力。


    他潜心研究的是以蛋白质分析技术为基础，“仅凭一滴血就能在早期诊断出疾病”这个难题。


    他不断研究、反复试验，最终从血样中成功提取出β-淀粉样蛋白标志物。β-淀粉样蛋白标志物是与阿尔茨海默病密切相关的物质，一直以来都被认为无法单独提取。田中耕一的成功震惊了世界。


    另外，在实验过程中，他还提取出另一种蛋白质。实际上，之后的科学发展证实了这种未知的蛋白质会提升阿尔茨海默病的发病率。


    田中耕一团队的研究使得阿尔茨海默病在患者发病的30年之前就能诊断出来。田中耕一再次作为世界级的研究者回到人们的视野中。


    关于创新，田中耕一做了如下阐述：


    > “创新”在日语语境下原本就是“新结合”“新的理解方式”“新解读”。各个领域的人聚在一起，进行新结合、新解读，应该就是创

