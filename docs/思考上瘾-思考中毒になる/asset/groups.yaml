    # 持续进行思考的秘密武器是什么？


    下面从身体这个“硬件”方面，来谈谈如何提高思考的层次。


    身体的疲劳需要通过睡眠等来缓解。但受过训练的大脑与身体不同，即使进行高强度的思考也不易疲劳，而且只要吃点巧克力，摄取相应的能量，就会很快恢复。


    我从学生时代开始，就坚持随身携带巧克力。


    问我身边的人，他们大多会说：“喜欢吃巧克力，但不会随时携带。”如果问我是不是特别喜欢吃巧克力，我无法简单做出肯定的回答。


    仔细回想一下，我在看电视时并不会随手拿块巧克力来吃，也并非每天都想吃巧克力。大多都是工作日程排满、集中精力进行思考的时候，我会想到吃巧克力。


    综上所述，巧克力好比燃料，能给大脑补充能量。我随身携带巧克力，只是为了借助巧克力提升自己思考的效率和层次罢了。


    我看日本漫画之神手冢治虫的自传式漫画时，发现书中也有描写他吃蛋糕大量摄取糖分的场景。


    我现在看《三眼神童》《怪医黑杰克》等手冢治虫先生的作品，也会因作品的感染力和完成度赞叹不已。这些作品当时是在漫画周刊上连载，同时手冢治虫还发表了其他作品，对此我无比钦佩。


    漫画连载需要坚持每周拿出新创意。如果在三本周刊上连载，每周就需要拿出三倍的新创意。


    手冢治虫先生在短期内接连发表多部名作，正是坚持高层次思考的结果。


    手冢治虫先生应该是在每天的工作中锻炼自己的思考力，使自己的'
  - '[PAGE 66]


    大脑处于不易疲劳的状态，并且通过吃蛋糕迅速缓解大脑疲劳，完成非同寻常的工作量。这大概是因为米饭中的淀粉转化为糖分需要时间，直接吃甜食能恢复得更快。


    以前没有思考习惯的人，也许稍做思考就会非常疲惫，这时如果吃一口口巧克力之类的甜食，也许立马就能缓解疲劳。当然，也要注意勿过量食用，以免有损健康。'
