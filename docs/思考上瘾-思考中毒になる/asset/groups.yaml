    # 咖啡厅是最佳思考空间


    下面，我们来谈谈适合思考的环境。


    我一去图书馆，思考就会突然停止。我一到图书馆就会非常困，以至于我觉得那里弥漫着某种催眠气体。


    特别是东京大学的综合图书馆。上学时，我到那里刚一坐下，就觉得仿佛被睡神附体了。后来，我决定到学校对面的咖啡厅学习，没想到效率非常高。自此以后，一有机会我就去咖啡厅，在那里思考问题、写论文。


    这个习惯一直保持到现在。我甚至还写了一本书——《假如有15分钟就请去咖啡厅》，这种口吻的书名表明了我对咖啡厅的高度认可。


    现在如果去自助式咖啡厅，花200日元就能点一杯混合咖啡。花这点钱就可以有效利用碎片化的时间进行思考，性价比如此高的投资不多。


    变换地点有助于集中注意力进行思考。我在咖啡厅里一般会待30分钟至1个小时，因此咖啡厅可谓我在有限的时间里集中精力思考的最佳空间。


    而走出咖啡厅就暂且结束思考，去做其他的工作，张弛有度。因为是利用空闲时间进行思考，所以我经常会一天跑三家咖啡厅。


    我一进咖啡厅，思考的启动键就会马上按下。咖啡厅最大的魅力是，有适度的噪声。


    正是在这种周围有人、有声响且任何人都不关注自己的环境里，注意力才会高度集中。


    具体做法是，把思考时想到的内容直接记在智能手机的记事本中，之后再整理，使其条理清晰。或者在一张A4纸上把自己的想法都写下'
  - '[PAGE 62]


    来。


    有某个时期，我在咖啡厅一直思考：“如何更好地提问？”“什么是优质的提问？”提问在交流过程中必不可少。我当时一直在想，能不能写一本关于高水平提问的书。


    当时，我的脑海中忽然浮现的词是“提问力”。如今“××力”已经是耳熟能详的表达了，但在当时大家对这个表达还不太熟悉。


    我直接以“提问力”为题出版了一本书，没想到成了畅销书。此后，我陆续出版了一系列以“××力”为题的著作。


    综上所述，咖啡厅于我而言是进行深入思考的最佳空间。在这里，注意力可以成倍提升。'
