    # # 改编原有信息并进行思考


    无论多么伟大的输出，都是源于“老素材”。


    比如，风靡全世界的电影《星球大战》最为重要的灵感就来自《千面英雄》这本书。这本书分析了神话故事的基本构成：概括来说就是，英雄千姿百态，但原型基本相似。


    好莱坞将黑泽明导演的《七武士》进行改编，拍摄了《豪勇七蛟龙》这部电影。有趣的是，黑泽明本人也以莎士比亚的戏剧作品《麦克白》为素材拍摄了《蜘蛛巢城》。


    《蜘蛛巢城》讲述的是日本武将的故事，故事情节虽与《麦克白》十分相似，但也是原创作品。


    顺带提一句，以《罗密欧与朱丽叶》《哈姆雷特》等莎士比亚作品为素材进行改编的艺术作品，古今中外都不乏其数。


    大获成功的作品大抵都是基于老素材。以古典作品、经典产品、大众服务为素材进行改编就是创意构思的基本方法之一。


    大受欢迎的漫画《鬼灭之刃》（我也买了全套）的基本内容就是“击退妖魔”。它可以说是在手冢治虫的《多罗罗》的情节上附加了变成鬼的原委始末等原创内容——简言之，就是新版的击退妖魔的故事。


    在没有任何素材的情况下进行构思的难度系数非常高，只要有素材，就能激发自己思考，从而接二连三地萌生出各种创意。


    在企业中，“将以前的热销产品改成现代风格的话，会是什么样的新产品呢？”这种讨论是非常有意义的。但这时也要限定时间，“大家请各自思考10分钟并发表自己的想法、意见”。这样一来，思考力就会大幅提升。'
