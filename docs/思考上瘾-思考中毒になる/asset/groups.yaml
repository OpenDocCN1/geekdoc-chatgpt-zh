  - '[PAGE 54]


    # 长期保持临战状态


    提供思考机会、下达任务的同时也不要忘记提升人们的参与感。


    开会时，主持人大致介绍完议题后，如果问“大家有什么意见吗”，并说“有疑问请一定说出来”，会场就会鸦雀无声。


    我不明白为什么会鸦雀无声。开会时问及创意、提案及疑问是不言自明的。按理说，所有参会人员都会准备两三个建议。


    在工作、学习中需要具备的本能反应与运动员需要具备的本能反应非常相似。在会议上不发言，就相当于打网球时不把对方打过来的球打回去。因此，我们必须做好准备随时应战。


    无法保持临战状态的理由之一是责任不明确。有十名参会者的话，每个人的责任感无形中就降到了十分之一，往往只是带着十分之一的参与感参会。


    这就像牛奶兑了50倍的水之后喝起来的感觉。没什么味道是理所当然的。因此，人们开会时应该保持一对一时的参与感，要时刻准备发言，并通过发言推进会议。


    我从小学开始，听课时都会对老师的提问一一作答。老师问我：“你有什么问题吗？”“你是怎么想的？”我从未回答过“我不清楚”“我还没想好”。


    被人提问时能否有所反应、立刻作答，与这个人是否优秀没有关系。只要保持临战状态，任何人都能马上作答。


    职业棒球选手、昔日超级明星巨人队的长岛茂雄曾说过，虽然自己在三垒的防守位置，但曾接过应该由二垒手来接的地滚球。


    三垒手去接应该由游击手来接的地滚球尚且可以想象，但去接应该由二垒手来接的地滚球是超出想象的。而长岛茂雄一直凭借着自己要把'
  - '[PAGE 55]


    打到内野的球全部接住这样的干劲参加比赛。


    离开校园走向社会的人都应该拥有这种“贪心”。摒弃“有十个人呢，自己不思考也没关系”这种想法，以“我的意见最后一定要被采纳”的决心参会的人才能提高思考的层次。'
  - '[PAGE 56]


    # 随时随地“身临其境”


    临战状态与观察力紧密相关。动脑思考的人对所有的事物都不会漫不经心地一扫而过，而是认真、仔细地观察。比如，在参加料理培训班时，动脑思考的学员会仔细观察老师的一举一动。[书ji分
    享V 信 shufoufou]


    他们觉得，只有这样，自己才能做出同样的料理。倘若漫不经心地听讲，学费也就白交了。


    可是，为什么学校里的大多数课堂上却不是这样呢？


    “请大家一字不落地复述一下老师刚才所讲的内容。”


    我觉得，如果这样跟大家说，大家都会认真听课。而实际上没有一位老师会这样说，所以很多学生听课时都是心不在焉的，中小学、大学的课堂都是如此。


    不仅仅是在学校里的课堂上，读书也好，看电影也罢，人们几乎都是被动地阅读或者观看。听音乐时也纯是为了娱乐，很不走心。如果被问及“这首曲子的某个乐章是由几种乐器演奏的”，大多数人会不知如何回答。而专业的指挥听同一首乐曲时，会在听的同时不断思考每一处细节。


    他会与自己指挥时做对比，同时关注其中的演奏技巧，能有很多新发现，并且会以这些新发现为基础，提升乐团的演奏水平。


    总而言之，勤于动脑思考的人对所见所闻都会“身临其境”。“换作我自己，我会怎么做呢？”我们总是做这样的思考，就会将所见所闻应用于方案、创意中。


    我们如果养成“身临其境”的习惯，那么就连看便利店里的货架、快餐店里的菜单、电视上的新闻时的感觉都会与之前大不相同，从中获得的新发现全部都可应用于工作中。'
  md: '

    如果你是出版社编辑，思考记录就应该是“书名”“封面设计”“新书的策划”“××书的章节安排”之类。


    在工作中进行思考，从某种意义上来说是理所当然的。因此，接下来的内容，才是我想要重点强调的。


    通勤途中，人们往往都是在发呆，如果把这些时间都用来思考的话，能做多少思考呢？思考记录本此时就会显现出威力。即使是单纯为了记录这些时候做了多少思考，也不会言过其实。这是第二个要点。


    因此，思考记录本上不要写自己的行动和工作内容，而要尽量记录“思考的痕迹”。


    如果思考记录本上有三天的空白，可能这三天没有进行思考。然而，没有记录也不一定意味着没有思考。但没有记录的话，思考的内容转眼间就会烟消云散。


    随身携带思考记录本就等同于随身携带确认思考过的工具。把思考的内容记录下来的话，头脑无疑会非常清晰。开始深入思考自己要弄清楚的问题，创意也会随之不断涌现。


    ### 手写会事半功倍


    说到底做记录，可以使用智能手机的记事本功能，也可以在Google日历等上面做记录。无论采用哪种记录方式，只要自己觉得方便就都可以。但是，建议没有习惯思考的人从手写开始。


    手写的好处在于，可以手脑并用。实际上，脑科学领域的研究表明，手写可以预防老年痴呆。


    由此可以推导出，手写可以加速大脑思考。


    工具让我们的工作和生活变得越来越方便，但我们在欢喜之余也应该担心思考能力退化。


    现在已经无须一个字一个字敲键盘输入，可以把语音直接转成文字。这既能节省时间，也非常方便。然而，一旦习惯这种便捷，就无法再像以前那样逐字逐句敲键盘输入文字了。


    我绝对不是提倡回到从前，过那种不方便的生活，但手写时会提笔忘字确实是记忆退化的征兆。


    我熟识的设计师中有几个人在工作中坚持用铅笔来画图。虽然人们最终也要把铅笔绘成的作品电子化，但最初的构思还是需要铅笔这种物理工具的。


    这与手写更容易激发创意有异曲同工之妙。


    动手的同时进行思考，手脑并用，有所启发，下一个思考就会随之而来。这个连锁反应会使思考得以持续。


    ### 记录有助于开发“潜意识”


    在此还需强调的一点是，在记事本上记录思考不仅对意识有所帮助，对潜意识也有不小的影响。


    我以前听朋友说，他有早上一起床就立即把晚上梦到的事情记录下来的习惯。


    人的梦虽然大都荒诞离奇，但大部分人在起床不久之后就会忘却，就好像什么都没有发生一样。


    做梦的频率虽然很高，但大都是这种感觉，“只记得自己做过一个有趣的梦，至于具体是什么呢，一般都想不起来”。因此，朋友在枕边放了笔和笔记本，一起床就把梦到的事情记录下来。


    据说这样坚持一段时间后，不可思议的是，他逐渐开始梦见有趣的事。听闻此事，我将信将疑，决定模仿他，测试一下是否真实有效。


    当时，我频繁梦到自己被坏人追赶，四处奔逃。被追赶的原因和逃往的方向都不太清楚，奔逃时仿佛一直在水中前行，身体莫名地沉重。


    我虽然心里不痛快，但第二天早上起床之后马上把被坏人追赶的梦境详细地记录下来。持续记录了几天，令我非常惊讶的是，梦的具体内容发生了变化。


    最初好像是一直在水中前行，不久发现有浮力，开始在水面上奔跑前行，再之后，突然意识到“有这么大的浮力，也许可以在空中飞翔”，不知不觉就开始梦到自己在天空中翱翔。最终，我开始做舒服且美妙的梦，梦见自己能自主操控，可以自由自在地在天空中翱翔。


    这一定是通过记录梦见的事情，对潜意识产生了某种影响。


    不论怎样，人类有种能力，即思考和行动的水准会因记录而提升。我们无法压制这种能力。


    不记录思考，我们就会呆呆地虚度光阴。与之相反，仅仅是做记录，思考和行动的水准就会有所提升。


    每天在记事本上记录思考，在最初的阶段也许会有压力，觉得很麻烦。


    但实际上看到自己的思考成果时会有成就感，积极性也会随之提升。越是思考上瘾，就越不想虚度光阴。


    ### 思考的“习惯”比思考的“质量”更重要


    我为了让学生养成思考的习惯，每周给他们布置一个任务，一周之后确认、反馈，之后再继续做一周。在这两周中，很多学生都会养成思考的习惯。


    例如，布置的任务如果是“就自己在报纸上剪下来的报道发表感想”，那么之前不读报的同学也会养成习惯，坚持读报并就所读报道附上自己的感想。之后就算不再剪报纸，他们对报纸的认识也会有所变化，会积极地读报并就所读内容进行思考。


    一旦进入这种状态，那么他们只要有一点时间，手边有报纸的话就会拿起来读一读。坚持一段时间后，思考和表达能力都会大大提升。


    换言之，最初的一两周能否坚持下来是在培养思考习惯的过程中最为关键的。


    能否迈出思考上瘾的第一步，其中一个基准是能否确保每天的思考时间，快的人需要一两周，一般人则需要一个月左右。


    在思考记录本上做记录暂且先坚持一周，再坚持一周，再坚持一个月，再坚持三个月，这样持续下去。


    能够坚持两周的话，放松一周也没关系。放松之后，重整旗鼓，再坚持两周，这时应该会意识到自己前一周放松的时候几乎没有在做任何思考。


    感受到这种“思考时”与“不思考时”之间的落差，体会到思考时的快乐是培养思考习惯的关键。


    之前有过失败经历，始终没有养成思考习惯的人不要放弃，请尝试在思考记录本上记录思考，放松、坚持，再放松、再坚持……


    另外，思考时无须“一定要想出正确答案”。


    重要的终究还是能否下功夫进行思考。我们回忆一下高考数学考试马上就会明白，同样是“失分”，一种人是“完全不会，只是在熬时间”，另一种人是“反复演算，但没有答对”。这两种人在思考方面做的努力截然不同。


    前者交白卷一定得零分，而后者只要在答题纸上写下解题思路，就有可能得一部分的分。


    即使不能马上得出正确答案、不能马上拿出全新创意，把进行思考所做出的努力及思考过程记录下来也非常重要。


    从全世界来看，日本人大多数时候过于重视结果。


    人们常常以“完全正确”或者“完全错误”进行判断，非常不喜欢清晰地给出评判依据。如果说“答错也没关系，请说一下解题思路”，人们马上就会面露难色。


    这是一个非常严重的问题，因为过于在意思考的结果就会有压力，从而导致无法进行结果不明的思考，从而陷入不爱思考的恶性循环。


    因此，在最初阶段无须拘泥于结果，只要认真思考，即便最终没有思考出什么也没关系。重要的是，首先要养成思考的习惯。


    养成勤思考的习惯，首先要让自己全神贯注。


    ### 营造有助于思考上瘾的环境


    过于在意“要思考”“要记录”，一整天都精神紧张，就会本末倒置。一天之中，一定得有时间用来进行原创性思考，同时也需要拿出一段时间来休息放松。


    我自己是在结束一天的工作后，泡澡放松时会反思自己的一天。泡澡时，副交感神经活跃，会有与白天不同的想法。我往往会在这时想出有趣的策划方案。


    家里的浴缸自不必说，如果去公共洗浴中心、桑拿中心，我会更加放松。


    桑拿房里毕竟温度过高，人很难进行深入思考。我们从桑拿房出来冲个澡，再进入浴池泡一下，反复几次就会神清气爽。


    据说这个过程反复两三次，身体就会“调整为最佳状态”。当然，也有人蒸完桑拿会头晕、摔倒或者脑梗死，所以一定要注意补充水分。实际上，我特别喜欢蒸桑拿，以前还纠结过要不要在家里装修一个桑拿房。但经常给我看病的医生告诉我，“桑拿蒸多了对身体不好”，我才作罢。


    结果是，我每天都去桑拿中心。


    如今则是习惯性地每天21点左右稍做运动，然后泡澡、蒸桑拿。前几天，在书上看到，“从交感神经活跃转为副交感神经活跃是在每天22点左右”，正好是我每天泡澡的时间，因此我格外赞同这个观点。


    蒸完桑拿回家，一直到凌晨3点都是我的娱乐时间。虽说人只要活着就不会停止思考，但娱乐时间我不做任何工作，不想任何劳神之事。


    这段时间，我基本不碰电脑、笔等工作中使用的东西，而是读书、看YouTube视频、看影片及电视节目等，尽情娱乐。


    我以前也有过一段时间总是努力工作到很晚。结果我发现，实际上，如果工作到深夜，无法做到张弛有度，白天也没法全力思考。所以，我索性就决定不再从早到晚一味地工作了。


    我一般是这样做的：晚上让大脑彻底放松，一天之中张弛有度，第二天上午做原创性工作时就会干劲十足。


    美国畅销书作家斯蒂芬·埃德温·金也在他的著作中说过，上午是自己的写作时间，下午一概不会动笔。即便是创作了那么多优秀作品的作家，也是张弛有度地进行思考。


    果然，一整天都全力思考是无法做到的。张弛有度，该思考时集中精力思考，才会产生新的创意。另外，张弛有度也有助于保持思考习惯。


    思考最大的阻碍是精神压力。精神压力除了紧张之外，还包括情绪低落、贪婪、嫉妒、被害妄想、自我厌恶等消极心理。内心压力过大就如同超载的车辆行驶缓慢一样，思考力也会大幅下降。


    在消极情绪下思考时、处于自我否定状态时，即使不断思考，也不会有所进展。


    这时最有效的方法是，用一种“仪式”暂且让思考告一段落。比如，双手在面前比画一下，假装抓住“棘手之事”，然后做一个将其扔出的动作，同时坚定地说，“这件事情已经结束”。


    这种仪式有不容小觑的效果，当你情绪低落时请一定试试这个方法。


    此外，大脑疲惫时，睡觉是最佳选择。睡20分钟就会让人感觉满血复活，暂且闭目养神5分钟也能让人得到休息。


    我在大脑疲惫时，一般会做“躺尸”这个动作。这是40年前我在瑜伽中学到的体式。“躺尸”是绝佳的放松方式。


    在放松的同时提高注意力的方法，我推荐数息观，即数出入之息、停止散乱心之观法。这是打坐冥想的秘法之一，是将注意力集中于“此刻此地”的最佳调节术，也是最好的“顿悟之法”。


    ## 第3章 提升思考的层次


    ### 判断思考是否会有结果


    养成一定的思考习惯之后，再有意识地提高思考的层次。


    要想提高思考的层次，则需尽可能地增加一天中用于思考的时间。


    在电视采访中经常会看到这样的场景：记者问东京大学医学部的学生“一天中有多少时间在学习”。


    我记得一位学生回答：“暑假里一天会学14～15个小时。”每天学习14～15个小时，意味着除去睡觉、吃饭及洗澡的时间都在学习。仅仅是每天坚持学习这么长的时间就是一种能力。


    采访中也有人回答“只学2～3个小时”，因为他们觉得把学习时间说少一点会更有面子。


    据我所知，被称为天才的人几乎无一例外都是勤奋努力之人。很多学生正因为每天坚持长时间地专注于学习，才能考上东京大学。


    并且，重要的不仅仅是每天坚持长时间地学习，更要能坚持长时间地高效学习更为要紧。


    在公共图书馆能看到即将考试的初高中生坐在书桌前拼命学习。我赞许他们的学习热情，但仔细看看会发现，有人1小时后书本也没有翻页。


    也许这个学生在解答超难的数学题，思考了一个小时也没有想出答案。他本人会觉得：虽然没有翻页，但我一直在思考、想答案。


    确实，数学家面对数学难题时也有可能冥思苦想几个小时。这无疑是进行思考的时间。


    而一般人如果就同一个问题思考一个小时，就等于没思考。大部分人都是处于这种状态，也就是最初的几分钟在认真思考，但没有找到解题思路，渐渐地就无法集中注意力，实际上只是木然地在同一个地方来回兜圈子。


    在应试方面出版过很多著作的心理医生和田秀树认为，做数学题时如果想了5分钟还没得出答案，再接着想下去也是浪费时间，先看答案解析效率会更高。


    和田秀树独创了“背题法”这种应试技巧，即熟记很多解题方法之后再解题。很多学生凭借这个方法考进东京大学，和田秀树也因此名声大振。


    有人说“不懂的问题即使持续思考也只是浪费时间”，确实如此。想要增加思考时间，就需要我们能较快判断出哪些是“该思考的问题”、哪些是“思考也无济于事的问题”，尽量不把时间浪费在后者上。


    如果自己认为想不出答案、不会有结果的话，就暂且不要去想了，转而去思考其他问题，或者从其他角度再考虑一下。这是进行高质量思考的关键。


    ### 负荷前行可促进思考


    人木然发呆时，即使有所见闻也不会进行深入思考。由此看来，想要提高思考的层次，就需要负荷前行。


    在我看来，全日本有很多初高中生只是呆呆地坐在教室里，对于老师课上所讲的内容充耳不闻。有的人是在激烈运动后一到教室就昏昏欲睡，也有的人则是沉浸在恋爱妄想中。大家好像都在做“白日梦”。


    上课发呆走神的学生有问题，而使这些学生发呆走神的授课老师也有问题。


    为了防止听众走神，我都会先抛出问题，再开始演讲。


    “我讲完之后会请大家两人一组来总结今天的内容，请大家注意听讲。”


    我知道这样做会增加听众的紧张感。而一旦想着要对演讲内容进行归纳总结，他们就会开动脑筋专心听讲。


    在大学课堂上，我一直使用的另一种方法，与演讲中采用的方法相比，会给学生带来更大的压力。我每讲完30分钟就请三位同学到讲台上，三人接力来总结我所讲的内容，每人一分钟。


    实际上，学生的总结如果做得好的话，课堂气氛会非常好，课堂体验也会成为学生心中的美好回忆。


    没有任何问题也能坚持思考的，只能是思考上瘾的人。人是一种没有目标就不肯动脑思考的生物。因此，在大学课堂上，我坚持“魔鬼教练”的人设，提出很多问题让学生思考，同时让他们轮流在大家面前发言。在反复的“问题
    → 思考 → 发言”过程中，闯过各种难关的学生的思考层次会显著提升。


    这样一来，有的学生很快就会思考上瘾，看到某个东西就会积极主动地进行思考，“这个可以作为标语吧？”“这个可以用作插图吧？”诸如此类。


    一年的课程结束时，有的学生会说“以后没有这么多思考和发言的机会了，有些失落”，也有学生说“最初特别讨厌这门课，多次想请假，后来渐渐爱上了它，觉得特别开心”。


    走向社会后，在工作单位如果无须发言、提不出什么新创意也能开展工作的话，也许很多人都会不做任何思考、漫无目的地过日子。


    对于这样的人，有意识地把他们逼入困境，多给他们创造一些思考的机会尤为重要。不断地让他们当众演示、演讲、发表意见，等他们逐渐习惯这些活动后，他们就能把自己的思考内容准确地表达出来。


    ### 心中须有“思考管理师”


    有些专业人士的职业注定他们要负荷思考，例如将棋手、围棋手。


    说到“当代思考大师”，绝不能不提将棋九段棋手羽生善治。羽生善治刷新了日本将棋界的多项历史记录，是第一位实现七冠王和永世七冠的棋手。他在日本将棋头衔战中共登场136回，获胜次数史上最多——99期，是家喻户晓的将棋棋圣。


    围棋和将棋等领域云集了众多思考上瘾的天才，因为棋手是绝对无法依靠父母找门路、投票选举、别人推荐等入职的职业。他们所在的领域实行段位制，获胜则升级，战败则降级，他们在比赛中总是全心投入、全力较量。


    即便是以前在头衔战中夺冠的名人，连续输掉比赛也只能引退。在这个残酷的领域中，连续获胜、改写日本将棋界多项历史的羽生善治可谓天才中的天才。


    我记得羽生善治在他的书中写过这样一段经历：他在小学时曾经盯着摆残局的将棋书，将其中的残局逐一破解。


    那不是一本简单的将棋书，而是江户时代将棋棋王的著作，解开一个残局何止要花一两个小时，有时甚至需要花好多天。据说羽生善治用了好几年，坚持不懈地把书中所记录的残局逐一破解。


    当代的天才小学生破解江户时代棋王出的难题，这事我们想想就觉得非常了不起。


    羽生善治说，小学时的那段经历使他在思考方面具有坚韧之心和持久力。


    综上所述，破解难题的确会提高思考层次。


    破解难题时最重要的是坚持不懈，切忌中途停止思考。想要确认自己是否在持续思考，心中须有“思考管理师”，时常问问自己：“现在是在认真思考吗？”


    “我觉得这一分钟的思考没有什么进展。”


    这样坚持自我确认，思考应该就会持续。


    “思考管理师”首先得明确需要确认的要点。以破解残局为例，“能否从想到的几种可能中做出恰当的选择”就是需要确认的要点。


    只需改正一步错棋，残局就会破解。改正一步错棋的时间等同于进行思考的时间。


    改正错棋的过程也可以称为“爱迪生式思考法”。爱迪生研制白炽灯泡灯丝时，为了找到最合适的材料，反复做了成百上千次试验，发现用炭化后的日本竹丝做灯丝效果最好，最终让电灯进入了寻常百姓家。


    据说职业棋手并非用排除法否定其余可能性，而是基于感觉对每种可能进行缜密的分析、验证。在这个过程中，思考力就会大幅提升。


    ### 长期保持临战状态


    提供思考机会、下达任务的同时也不要忘记提升人们的参与感。


    开会时，主持人大致介绍完议题后，如果问“大家有什么意见吗”，并说“有疑问请一定说出来”，会场就会鸦雀无声。


    我不明白为什么会鸦雀无声。开会时问及创意、提案及疑问是不言自明的。按理说，所有参会人员都会准备两三个建议。


    在工作、学习中需要具备的本能反应与运动员需要具备的本能反应非常相似。在会议上不发言，就相当于打网球时不把对方打过来的球打回去。因此，我们必须做好准备随时应战。


    无法保持临战状态的理由之一是责任不明确。有十名参会者的话，每个人的责任感无形中就降到了十分之一，往往只是带着十分之一的参与感参会。


    这就像牛奶兑了50倍的水之后喝起来的感觉。没什么味道是理所当然的。因此，人们开会时应该保持一对一时的参与感，要时刻准备发言，并通过发言推进会议。


    我从小学开始，听课时都会对老师的提问一一作答。老师问我：“你有什么问题吗？”“你是怎么想的？”我从未回答过“我不清楚”“我还没想好”。


    被人提问时能否有所反应、立刻作答，与这个人是否优秀没有关系。只要保持临战状态，任何人都能马上作答。


    职业棒球选手、昔日超级明星巨人队的长岛茂雄曾说过，虽然自己在三垒的防守位置，但曾接过应该由二垒手来接的地滚球。


    三垒手去接应该由游击手来接的地滚球尚且可以想象，但去接应该由二垒手来接的地滚球是超出想象的。而长岛茂雄一直凭借着自己要把打到内野的球全部接住这样的干劲参加比赛。


    离开校园走向社会的人都应该拥有这种“贪心”。摒弃“有十个人呢，自己不思考也没关系”这种想法，以“我的意见最后一定要被采纳”的决心参会的人才能提高思考的层次。


    ### 随时随地“身临其境”


    临战状态与观察力紧密相关。动脑思考的人对所有的事物都不会漫不经心地一扫而过，而是认真、仔细地观察。比如，在参加料理培训班时，动脑思考的学员会仔细观察老师的一举一动。


    他们觉得，只有这样，自己才能做出同样的料理。倘若漫不经心地听讲，学费也就白交了。


    可是，为什么学校里的大多数课堂上却不是这样呢？


    “请大家一字不落地复述一下老师刚才所讲的内容。”


    我觉得，如果这样跟大家说，大家都会认真听课。而实际上没有一位老师会这样说，所以很多学生听课时都是心不在焉的，中小学、大学的课堂都是如此。


    不仅仅是在学校里的课堂上，读书也好，看电影也罢，人们几乎都是被动地阅读或者观看。听音乐时也纯是为了娱乐，很不走心。如果被问及“这首曲子的某个乐章是由几种乐器演奏的”，大多数人会不知如何回答。而专业的指挥听同一首乐曲时，会在听的同时不断思考每一处细节。


    他会与自己指挥时做对比，同时关注其中的演奏技巧，能有很多新发现，并且会以这些新发现为基础，提升乐团的演奏水平。


    总而言之，勤于动脑思考的人对所见所闻都会“身临其境”。“换作我自己，我会怎么做呢？”我们总是做这样的思考，就会将所见所闻应用于方案、创意中。


    我们如果养成“身临其境”的习惯，那么就连看便利店里的货架、快餐店里的菜单、电视上的新闻时的感觉都会与之前大不相同，从中获得的新发现全部都可应用于工作中。

