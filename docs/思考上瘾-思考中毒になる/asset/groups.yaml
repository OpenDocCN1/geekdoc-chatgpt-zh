    # 做好思考记录


    明确主题后，养成思考习惯不可或缺的因素还包括，清楚“自己能够持续思考多久”。


    例如，据说减肥时每天测量体重比什么都重要。了解自己的体重情况就可以调整自己的减肥计划，“减少运动次数”“一概不吃零食”“暂且保持这个节奏”等。


    思考也是如此。


    如果没有弄清楚现状就思考的话，往往容易自我谴责：“再多思考一会儿！” “为什么自己的注意力这么不集中？”


    所以，首先应该分析自己的现状。


    要形成反馈或分析结果，必须充分把握现状，因为只有清楚现状，才能冷静应对。最有效的方法是把思考的内容写在记事本上。


    记得我上初三时，我爸爸建议道：“希望你每天把自己的所思所想写在本子上。”


    “今天做了什么”的日记，我从小学开始就一直在写。我爸爸所说的应该不是指写日记，也就是简单记录每天发生的事情，而是让我养成记录思考过程的习惯。


    如果坚持把思考过程写在记事本上，那么就能清楚地知道自己每天做了多少思考。


    此外，这样做也可以提醒自己，不对同一件事做无休止的重复思考。


    培养思考习惯应该放在首位，所以在记录的最初阶段无须在意思考的质量，而是要关注自己做了多少思考。'
  - '[PAGE 37]


    如果在坚持记录思考的同时也追求高层次的思考，就需要有每天帮助我们进行测评的教练。但现实中，很多人都是独立培养思考习惯，所以最好先把“坚持”放在首位。


    如果养成了思考的习惯，甚至是思考上瘾的话，思考的层次也会随之不断提升。因为为在同一层面不断思考，久而久之就会腻烦，自然而然地就会追求更高层面的思考。这就好比在运动领域，相同的动作反复做几千次甚至几万次，水平自然就会提升。'
  - '[PAGE 38]


    # 在记事本上记录思考


    一天之中到底有多少时间在思考，只要把思考的内容在纸上列出来，就会一目了然。能够列出的数量越多，证明思考得越多。


    我很多时候也会使用智能手机的记事本功能。但对于还没有习惯于记录思考过程的人，我推荐使用纸质记事本，并且可以把其命名为“思考记录本”。


    把思考的内容在思考记录本上粗略地列出来，即使中途被开会、吃饭、洽谈等打断了，看看思考记录本就可以继续思考。只要看看思考记录本，坐车时也能继续进行思考。


    在思考记录本上做记录时，希望大家尽可能地以30分钟为单位，记录每30分钟的思考内容。


    如果是竖排的本子，那么可以自上而下地记录，以30分钟或1个小时为单位列出一天的思考内容。可以暂且先写下30分钟内所想的事情。令人不可思议的是，这么做后马上就会产生这样一种想法——“必须找到下一个30分钟要写的内容”，因此就会按下思考的启动键。最重要的是能够保持“任何时候都有思考主题的状态”。


    实际上，记录还有这样一个好处：人们一般不是在思考之后才想要做记录，而是因为有了“必须要记录”的这个要求，所以才会开始思考。


    思考记录本说到底就是培养思考习惯的工具。无须干劲十足地说“必须是全新的创意”，把当前思考的内容用关键词串起来，逐条记录下来就可以。


    以销售人员为例，如果记录的是“在A公司洽谈”向B公司提交方案”，那么这只是记录自己的行为。思考记录需要这样写：“这个月的销售额想要再提升10%，需要怎么做？”“怎样才能与B公司签单呢？”诸如此类。'
  md: '

    ## 坚持思考就会心情愉悦


    一旦养成思考的习惯，不仅工作上会有所成就，而且不思考、发呆的时候会觉得不适，因此就会开始寻求思考点，促进自发思考。


    打棒球时，“砰，砰，砰”地把快球都打回去了，突然投过来一个慢球，或者投过来一个较难接住的球，人就会焦躁不安。在养成思考的习惯之后，我们不思考一般同样会焦躁不安。


    竞答节目就巧妙利用了人的思考欲望。长期受欢迎的竞答节目会有节奏感地、接连不断地抛出问题。这样一来，观众“我想回答”“我想知道答案”的欲望就会高涨，不会轻易换台。


    竞答节目中的很多题目都只是考察是否知晓的知识类题目，但其中也有考察想象力和创造力的问题。


    这类问题如果放在小学里，让孩子们来回答的话，他们通常会兴致勃勃，拼命思考答案，甚至会恳求道：“老师，再多出点题目吧！”


    综上所述，人生来就喜欢思考，因思考而快乐，只是在成长的过程中，不知不觉忘记了思考的快乐，回避思考。


    跑步也是同样的道理。很多人小时候特别喜欢在外面四处跑，但长大之后就会觉得跑步很麻烦，哪怕是运动不足也不愿意去跑。但只要练习一下，渐渐地能够跑起来，就会重新体会到跑步的乐趣。


    我朋友说，如果每天不跑10千米，就会极其不舒服。这位朋友是在市中心上班的商界精英，据说不绕着皇居跑两圈的话，就会觉得烦躁不安，无法安心回家。


    我觉得这与无法思考时的焦躁不安非常类似。


    “不要那么忙碌，活得轻松点如何？”也许会有人这么想。但我认为，生而为人，应该追求像坚持思考的笛卡儿和宫本武藏那样的人生，因为他们的人生绝对是无比充实且快乐的。


    思考力不是与生俱来的，而是在工作、学习有需要时，在不断思考的过程中产生并逐渐习惯化的。


    ## 任何人都会思考上瘾


    虽然在程度上有所差别，但人们应该都会有依赖的对象。


    例如，有人会在报纸的休刊日感到失落，烦躁不安。这种现象被称为“活字依存症”或“报纸依存症”。


    现如今，如果跟年轻人说“今天报纸休刊”，大部分人都不会在意，但听到“YouTube服务暂停”时应该会非常失落。这就是“YouTube依存症”。“无法忍受没有某个东西”就是“××依存症”或者“××上瘾”。


    在宫泽贤治的短篇小说《学者Aramharad眼中的和服》（The Robe Scholar Aramharad Saw）中，学者Aramharad给他的学生们讲授水、火及小鸟的特性之后，提出了下面的问题：


    小鸟会情不自禁地啼叫，鱼会情不自禁地游动，人会情不自禁地做什么呢？人无论如何都会忍不住做的事情是什么呢？大家想想看。


    有一个孩子回答：“人一定要走路说话。”Aramharad让其他同学也回答一下。另一个孩子回答：“与走路说话相比，人更会情不自禁地去做的是好事儿。”


    Aramharad刚要赞同这个意见，看到一个名叫“Celara-vird”的孩子想要回答，就让他说说自己的观点。Celara-vird是这样说的：


    我觉得，人会情不自禁地去思考真正的好事儿是什么。


    Aramharad听到这个答案之后非常震惊，不禁闭目不语。这恐怕是因为孩子们说出了比他自己事先准备的答案更棒的回答，他为之感动。虽然是描写毫无特别之处的教室里的日常，但这个场景深深地刻在我的脑海中。


    如果让我来回答，确实就像孩子们所说的那样。人是根本无法停止思考的生物。因此，稍做努力，“忍不住上网聊天”“忍不住玩网络游戏”应该就会转为“忍不住思考”。


    当然，玩游戏和上网聊天的某些方式有时也会促进思考，但如果到了上瘾的程度，就可能陷入思考停止的危险状态。酒瘾、毒瘾等都是思考停止最典型的例子。


    《乐园·味觉·理性》这本书中有这样一段独特的分析，以产业革命为契机，由喝红酒至酩酊大醉的状态转为喜欢喝咖啡、意识清醒的状态。


    不是通过酒精和毒品，而是通过思考获得快感的才是现代人。


    ## 思考上瘾就会开心


    如果让没有养成思考习惯的人在工作中“自己想一下”，他就会觉得压力大、疲惫不堪。


    与之相反，养成思考习惯的人会因思考而开心，从而能够解决问题，拿出成果。


    我给学生们留作业时会跟他们说：“你们未来会走两条不同的路：一条是认为思考是压力，想逃避；另一条是期待思考。大家想走哪条路呢？”


    懂得思考的快乐的人一生都会对事物有新鲜感，能够挑战各种事情。


    人如果觉得思考会令自己很快乐，就会进入“思考上瘾”的状态。一思考就会开心，就会干劲十足，停不下来。


    人的大脑的活动通过神经递质传递信息，并进行管理。这种神经递质之一是内啡肽。内啡肽就是“体内分泌出的类吗啡物质”，其镇痛效果是吗啡的6.5倍，这是公认的。


    特别是内啡肽中的β内啡肽在人获得快感时就会分泌得更多。心情愉快时，大脑就会分泌β内啡肽，我们就会有干劲。


    跟朋友开心地聊天时、享受美食时，大脑都会分泌β内啡肽。排除万难获得成功时，大脑分泌的β内啡肽是最多的。


    比如，人们在工作中被委以重任时、时间紧张时，或者与同事的意见对立时，等等，能够解决这些困难，取得创新性成果的话，就会获得很大的成就感，也会干劲十足。


    人们想要取得某种成果时，大多会进行思考。拿出成果固然要直面许多限制，遇到很多困难，但与凭借思考突破这些障碍时的成就感比起来就不算什么了。


    因此，希望大家能够热衷于思考、能够思考上瘾。本书旨在让大家达到这样一种状态，即思考特别有趣，忍不住去思考。


    ## 下决心进行思考


    19世纪法国著名作家巴尔扎克的故事，如债台高筑、食欲旺盛、生活奢侈、身边美女如云等，这些都是广为人知的。


    最终，巴尔扎克在离开人世的时候，还有巨额债务没还清。为了维持这种奢靡的生活，他不断创作新作品，速度之快简直令人难以置信。


    俄国大文豪陀思妥耶夫斯基也是债台高筑的作家之一。他本人也跟他的作品《赌徒》中的主人公相同，喜欢赌博，多次输光巨额赌资。他预支尚未动笔的作品的稿酬，甚至会在动笔之前把稿酬都用光了。


    陀思妥耶夫斯基同样是为了还债写了很多书，完成了《罪与罚》《卡拉马佐夫兄弟》等世界名著。


    当然，巴尔扎克和陀思妥耶夫斯基属于极端情况，并不能因此就轻易下结论说，债务缠身就能完成生产性工作。


    但在某种程度上，处于绝境会引发思考，从而完成创新性工作，这确实是事实。


    我们从太宰治的文章中能够感受到“只能坚持思考、写作的人”的决心。读太宰治的随笔就会发现，书里几乎都是一味地、自虐式地讲述自己的文章，我们从字里行间就能够感受到苦楚。


    > “我是个无用之人。”

    > “我未曾写过杰作。写不出杰作，在人生的各个阶段，只能写自己的失败，因为其他没有可写之事。”


    他经常会吐露这样的心声。


    随笔《散华》介绍的是已奔赴战场的朋友来信。


    你还好吗？


    来自远方的问候。


    我已平安到达。


    请为伟大的文学献出生命。


    我也会为战争献出自己的生命。


    太宰治读完这封信，写下了这样一句话：


    三田君所说的“献出生命”在我看来是无比崇高、极其可贵的，令我欣喜万分。


    因感动至极，太宰治在简短的作品中三次引用了这封信。我有时会根据太宰治的这部作品出下面的竞答题目。


    “太宰治收到在战场上牺牲之前的文学友人的来信。那么，‘为伟大的文学’之后的话是什么？”


    很多人的答案是“为伟大的文学继续坚持写作”“为伟大的文学写出旷世杰作”等，很难有人想到“献出生命”。


    在那个时代，自己的朋友在战场上牺牲是寻常之事。在那个时代背景下，人们所写的文学作品融入了很多超出现代人想象的情感。以这种认知重读《人间失格》等名作就会发现，太宰治在其所有的作品中都融入了“请为文学献出生命”的情感和思想。


    在进退维谷的绝境之中坚持思考、坚持工作的人能够取得世代传承的功绩，给后人留下宝贵的财富。不得不进行思考的人生一定会化作推动人们思考的巨大力量。


    ## 第2章 养成持续思考的习惯


    ## 做“不动脑就无法完成”的工作


    想要思考上瘾，首先“要对不需要动脑思考的工作疾首疚颐”，这一点非常重要。


    比如，在公司里有人吩咐你复印资料，当然这也是有意义的工作，而且不能拒绝。能够心情愉悦地做这种单调工作的人是能力出众的，晋升的可能性非常大。但是，要我来做这种只需动手的简单工作，我马上就会心生怨气。


    我会很想告诉对方：“我活着并不是为了做这种事情。”


    我读研究生时，每次被迫去复印的时候都会满腹牢骚。虽然当时是学生，复印几本书的时间还是有的，但因为复印时只需动手无须动脑，一种背叛自己的愧疚感就会涌上心头。


    我就连为自己的研究工作复印资料也会觉得麻烦，何况还是帮别人复印呢。我当时真是苦不堪言，因此就找了专门复印的商家，花钱让它们来做。总而言之，我这就是“花钱买时间”。


    当年，在东京大学赤门前的商家看来，我是它们的大客户，因为我会定期下单请它们帮忙复印。


    那当时的复印费从哪里来呢？——都是我在补习班打工赚的钱。


    也许有人会说：“你这不就是用自己打工赚的钱来支付别人的工时费吗？”想想确实是这样的，但对我来说，与复印资料相比，在补习班讲课会更有新意、更令我快乐。如果花钱能够搞定令我苦不堪言的复印工作，这正是我求之不得的好事。


    仔细想想，我人生中好像一直都是这样避开单调、枯燥无意义的工作，进而转向需要思考的工作。


    - “尽管工钱少，但复印工作更轻松，很不错。”

    - “工资相同的话，一定是工作轻松更好。”


    我知道有的人会有上述这种生活理念。


    “复印也是重要工作，也有其意义”这种说法作为反论也颇有道理。


    有的人不会对花费一天的时间去复印资料感到丝毫痛苦，有的人则会因自己浪费一天的时间去复印资料而感到懊恼。但是，我觉得这两种人的差别显而易见。


    我尤其反对让头脑灵活且精力充沛的年轻人做无聊的简单工作。一定要把有创造性的、需要思考的工作交给年轻人。


    简单的工作可以交给年纪稍大的人，因为他们有时难以找到自己的用武之地。


    要想不断地拿出创新性成果，就需要坚持思考。为了能够持续思考，就必须保持这份感性——“从事无须动脑思考的工作会感到不舒服，无法忍耐”。


    总之，希望大家都有这样的热情，即“更想做需要动脑思考的、难度系数高的工作”。


    ## 经常自问“我在思考什么”


    通过自问自答“我刚才在想什么”，就能明确自己是否在认真思考。


    比如，假设有位经营者在做项目策划书，他自问“我刚才在想什么”，自答“我在想策划书”。这样不走心地做出回答的人大多没在思考。


    真正在思考的人应该会明确地回答出自己思考的具体内容，“我在研究成本是否合适”“我在想实际的日程安排”等。


    我以前做过一段时间的网球教练，通过问学员“你在练习什么”这个问题，马上就能看出他们是否在用心思考。


    “我在练正手击球”，做出这种回答的学员几乎都没怎么思考，只是在做消极练习。练习也不会有进步。


    而回答“我在琢磨正手直接打回斜线球的时机，在练习提高击球落点的精准度”的学员则非常清楚自己要解决的问题。每打一个球，脑中都会思考解决问题的方法，不断寻找原因、不断调整，进步会非常快。


    运动、武术、工作等都有“套路”。人们一般都会认为同样的动作反复做100次、1000次、10000次，甚至更多次，就可以掌握“套路”。


    但是，同样是掌握“套路”，边思考边摸索的人和只是按照别人的吩咐做事、思考处于停滞状态的人，在技术方面有天壤之别。


    我曾问过被称为“棒球代打之神”的原阪神老虎队棒球选手八木裕：“为什么职业棒球选手有时也会无法击中水平外曲球？”他回答说：“因为他们练习时没有在思考。”这个回答给我留下了深刻的印象。


    据八木裕说，多次出现相同失误的人只是随意空抡球棒，因此总是无法击中水平外曲球。


    与之相反，一流的棒球选手在实战练习时会推测投手的投球方位和曲线后，再挥棒击球。


    八木裕也告诉我：“实际上，为了击中水平外曲球，也有相应的练习。”


    目的明确的人，也就是在不断动脑思考的人，无论做什么都会取得相应成果。因此，经常自问自答“现在所做的是为了什么”尤为重要。


    ## 确定主题则易于思考


    要想明确目标，就需要先确定主题。


    我认识的一位小学老师在对六年级学生进行实践指导时，让他们各自确定自己的研究主题，完成“毕业论文”。


    比如，“我想研究太空”“我想研究环境”“我想研究世界和平”之类，从设定主题开始，然后到图书馆查找需要的参考文献，把所学所想最终写成论文。


    最让我震惊的是，全班每人要完成100页共4万字的论文。这太了不起了，因为就算是大学生，写50页也会苦不堪言。并且，这并不是特别设立的私立小学的课程，就是普通的公立小学的课程。即使是小学生，不断思考和练习也会有能力完成这么困难的事情。


    小学生能够坚持思考，最终写出100页的论文，是因为有让他们不断思考的主题。


    走向社会的成年人明确工作中应该解决的问题和目标也是非常重要的。


    暂且不谈日常写策划书、负责产品开发等目标明确的人，在会计、行政等事务性工作中，也许有人会例行公事，导致主题不明确。


    这类人需要自己设定主题。


    “想要缩短工作时间，该怎么做才好呢？”


    “如何提高所有员工的士气呢？”


    诸如此类，自己定目标，挑战持续思考。


    无法明确主题的时候，积极地去一些有助于确定主题的地方看看，也是一个好方法。比如，连续三四天去听一听商业人士以创业为主题的集中讲座，对创业的关注一下子就提升了，关于创业的思考就会开启。


    参加研讨会、听讲座等，都能遇到对我们确定思考主题有帮助的人，也有助于我们进行思考，因此就会轻松帮助我们养成思考的习惯。


    哲学家埃德蒙德·胡塞尔指出，人类的意识与其说是意识这个抽象概念本身，不如说是在针对某个事物时一定有其特征。这就是“意识的意向性”。简言之，意识必须是“关于某物的意识”。


    一个人即便整日发呆，但只要有意识，其注意力也必定会如箭头一样集中于某对象。


    这样想来，只要意识的关注点能够促进思考，人就能不断地进行有意义的思考。因此，明确主题还是最重要的。


    ## 将喜欢的事物作为思考的主题


    虽然最近很少见到了，但以前会时常看到有中年大叔把雨伞当作高尔夫球杆，在车站的站台上练习挥杆。


    在站台上做挥杆练习是危险的，但对打高尔夫球心心念念、朝思暮想，从这个意义上来说，这些大叔可谓幸福之人。


    时刻惦记着打高尔夫球：“这样打行吗？”“那样挥杆也许能打出好成绩。”只要这样不断思索，球技进步是毋庸置疑的。关于打高尔夫球，这些大叔能够不停地思考，无非就是因为喜欢高尔夫球这项运动。也就是说，人就是这样一种生物，对于自己喜欢的，就会朝思暮想，无须他人要求或提醒。


    想要体验思考上瘾的感觉，有一种方法是，不断思考自己喜欢的东西。这样做会形成一个良性循环，即对于自己喜欢的东西，总是会“贪婪”地想要获取与之相关的知识，越是深入思考，就越是想要获取新的信息，这样就会越“陷”（陷入思考）越深。


    作家村上春树原本并非想当作家，而是在研读、翻译自己特别喜欢的美国作家弗朗西斯·斯科特·基·菲茨杰拉德、雷蒙·钱德勒等人的作品过程中，不知不觉开创了自己的写作风格。


    了解这些后，在村上春树的译作中能够找到他本人的写作风格与世界观，比如他所翻译的雷蒙·钱德勒的《漫长的告别》。


    “为什么自己这么喜欢呢？为什么会动心呢？”对自己所喜所爱进行细致的分析可以锻炼思考力。


    在分析自己所喜所爱的过程中，会诞生一些想法，比如“这种做法也许可以应用到工作中”“只要把这部分改变一下，也许在日本会大受欢迎”。如此一来，创意便油然而生。


    在大学或企业里做研究的人应该都是沉迷于某个特定领域的“职业宅”——正因为有自己迷恋的课题，才会不断研究，才能取得成果。


    没什么喜好的人可以暂且作为一个“临时粉丝”追随潮流，这也是一种方法。比如，橄榄球比赛热度高的话，就关注橄榄球比赛；对偶像组合ARASHI感兴趣的话，就做他们的粉丝。不要小看“临时粉丝”，激发自己主动、专注的态势才最为重要。


    喜欢偶像组合ARASHI与能在工作中取得成果的思考看似毫无关联，但未必真的毫无关联。至少有很多人喜欢、迷恋ARASHI这个偶像组合。因此，这个组合应该有其独特的魅力。我认为其受欢迎的原因一定可以应用到其他的产品和服务中。


    “MY BOOM”这个概念的最早提出者是三浦纯，他只是追求“自己喜欢的”，却最终在日本引发了“治愈系吉祥物”的热潮，成为成果非凡的策划人。


    即使是个人的讲究，有一个能够激发灵感的对象也意义非凡。


    ## 做好思考记录


    明确主题后，养成思考习惯不可或缺的因素还包括，清楚“自己能够持续思考多久”。


    例如，据说减肥时每天测量体重比什么都重要。了解自己的体重情况就可以调整自己的减肥计划，“减少运动次数”“一概不吃零食”“暂且保持这个节奏”等。


    思考也是如此。


    如果没有弄清楚现状就思考的话，往往容易自我谴责：“再多思考一会儿！” “为什么自己的注意力这么不集中？”


    所以，首先应该分析自己的现状。


    要形成反馈或分析结果，必须充分把握现状，因为只有清楚现状，才能冷静应对。最有效的方法是把思考的内容写在记事本上。


    记得我上初三时，我爸爸建议道：“希望你每天把自己的所思所想写在本子上。”


    “今天做了什么”的日记，我从小学开始就一直在写。我爸爸所说的应该不是指写日记，也就是简单记录每天发生的事情，而是让我养成记录思考过程的习惯。


    如果坚持把思考过程写在记事本上，那么就能清楚地知道自己每天做了多少思考。


    此外，这样做也可以提醒自己，不对同一件事做无休止的重复思考。


    培养思考习惯应该放在首位，所以在记录的最初阶段无须在意思考的质量，而是要关注自己做了多少思考。


    如果在坚持记录思考的同时也追求高层次的思考，就需要有每天帮助我们进行测评的教练。但现实中，很多人都是独立培养思考习惯，所以最好先把“坚持”放在首位。


    如果养成了思考的习惯，甚至是思考上瘾的话，思考的层次也会随之不断提升。因为为在同一层面不断思考，久而久之就会腻烦，自然而然地就会追求更高层面的思考。这就好比在运动领域，相同的动作反复做几千次甚至几万次，水平自然就会提升。


    ## 在记事本上记录思考


    一天之中到底有多少时间在思考，只要把思考的内容在纸上列出来，就会一目了然。能够列出的数量越多，证明思考得越多。


    我很多时候也会使用智能手机的记事本功能。但对于还没有习惯于记录思考过程的人，我推荐使用纸质记事本，并且可以把其命名为“思考记录本”。


    把思考的内容在思考记录本上粗略地列出来，即使中途被开会、吃饭、洽谈等打断了，看看思考记录本就可以继续思考。只要看看思考记录本，坐车时也能继续进行思考。


    在思考记录本上做记录时，希望大家尽可能地以30分钟为单位，记录每30分钟的思考内容。


    如果是竖排的本子，那么可以自上而下地记录，以30分钟或1个小时为单位列出一天的思考内容。可以暂且先写下30分钟内所想的事情。令人不可思议的是，这么做后马上就会产生这样一种想法——“必须找到下一个30分钟要写的内容”，因此就会按下思考的启动键。最重要的是能够保持“任何时候都有思考主题的状态”。


    实际上，记录还有这样一个好处：人们一般不是在思考之后才想要做记录，而是因为有了“必须要记录”的这个要求，所以才会开始思考。


    思考记录本说到底就是培养思考习惯的工具。无须干劲十足地说“必须是全新的创意”，把当前思考的内容用关键词串起来，逐条记录下来就可以。


    以销售人员为例，如果记录的是“在A公司洽谈”向B公司提交方案”，那么这只是记录自己的行为。思考记录需要这样写：“这个月的销售额想要再提升10%，需要怎么做？”“怎样才能与B公司签单呢？”诸如此类。

