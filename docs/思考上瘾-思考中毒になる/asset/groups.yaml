    # 坚持预测未来走势


    我们养成“身临其境”地观察事物的习惯，就会具备预测事物未来走势的思考力。


    上中学时，我在社会实践中有过一次挑战“拆卸发动机”的机会。我当时是在三重县铃鹿市本田汽车的工厂里，和同班同学一起拆卸发动机。如今想来，那真是特别难得的体验。


    我们这组觉得做“拆卸”工作无比开心，好像比赛一样接二连三地把零部件都拆下来。最后拆卸完毕，成就感“爆棚”之时，本田技术人员的话却大大出乎我们所料。


    “好啦，大家都拆完了吗？那这次我们把拆下来的零部件重新组装起来吧。”包括我在内，所有组员都愣了好一会儿。大家之前都沉浸在拆卸的快乐之中，完全没有想到还有“组装”这项任务。


    回过神来，我们凭借记忆设法组装，试了好多次却没有成功。


    不经意间看了一下旁边，其他小组正在有条不紊地组装发动机。他们之前认真记录了拆卸零部件的顺序，好像倒放录像带一样，一步一步完美地按原样组装好。我至今都记得当时的懊悔情绪：“我们为什么没有仔细想想就把发动机全拆了？”


    拆完后重新组装并不难，只要冷静思考就会有大致的思路。而我们当时完全没有进行思考就拆了。


    这次失败的经历告诉我，“预判”是一项重要的思考。


    只要“身临其境”地去观察眼前发生的事，并预判其发展，就能较好地应对。


    “好像要下雨，带伞走。”


    “库存快没了，要抓紧订货。”'
