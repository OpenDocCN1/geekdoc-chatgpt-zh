    # 第5章 孕育新创意的思考力'
  - '[PAGE 99]


    # 热销产品的背后定有思考上瘾之人


    经济学家彼得·德鲁克是现代管理学的开创者，被尊为“经营之神”。德鲁克将销售与市场营销进行了对比阐述。


    销售简单说来就是如何将某种已开发出的产品卖出去的措施。而与之相对，市场营销是指在产品还未开发的阶段去了解消费者需求的一系列举措。


    德鲁克在其著作中指出：“最为理想的市场营销是不再需要销售。”营销需使产品能够自行售罄。


    正如德鲁克所预测的那样，现代企业重视的不是销售而是营销。比如，在日本，到20世纪80年代前半叶，麒麟啤酒销售额在啤酒界一直居首位，排在其后的是札幌啤酒和朝日啤酒。朝日啤酒一度对业界第三的位置非常满意。


    但是，朝日啤酒公司于1987年大力投资的朝日超级干啤大受欢迎，令人刮目相看。它一气呵成完成大逆转，最终登上了业界老大的宝座。


    这种改写啤酒行业版图的巨大成功是如何取得的呢？


    实际上，是因为公司进行了大规模的喜好调查，在了解消费者口味的过程中发现，消费者对清爽且糖分低的啤酒需求更大。


    当市场调研人员把消费者的这种需求转告给技术人员时，技术人员毅然决然地说“那样会破坏啤酒的味道”。但最终为了生产出消费者需要的啤酒，技术人员也开始着手进行技术研发，最终开发出超级干啤。这必定是朝日啤酒公司产品开发负责人日夜思考的结果——他想要开发出能够满足消费者需求的啤酒。


    畅销产品的背后一定有很多思考。不是止步于“做出令自己满意的产品”，而是用心思考并不断摸索如何做出畅销产品，即让客户真正满意的产品，这是最为关键的一点。'
  - '[PAGE 100]


    看报纸时，我会觉得以前那种满篇小字、信息量大的报纸比较好，而现在这种报纸却成了大问题。


    报纸的开本和页数是固定不变的，所以如果文字变大，整体的信息量应该就会减少。总而言之，比起“信息量”，读者更重视“易读”。为了满足读者的需求，报纸上的字号变大了。综上所述，读者的想法会随时代的变化而不断改变，需要我们用心思考，制定正确的方案。'
  - '[PAGE 101]


    # 欲轻松须思考


    至今为止，我写了将近800本书，将自己脑中的各种想法、创意以文字的形式记录下来。说到这里，大家会认为我是在自我炫耀，但这些都缘于我怕麻烦且追求完美的性格。好不容易想到一个策划方案，如果不一气呵成写下来，就太可惜了，思考的功夫就白费了。想到如果现在不马上写出来，“之后还是要写”，就会觉得太麻烦了，索性想到什么就把它记录下来。


    回想一下，因为“想省时省力”，我一直在努力思考生活及工作的各种具体方式。


    比如，蒸桑拿脱衣服时，我会把背心、衬衫、毛衣里外三件同时脱掉。只要解开衬衫上面的两个扣子，就能一下子全脱掉了。裤子、袜子也会一起脱下来。只要用大拇指勾住裤腰，同时拽下袜子，先脱右腿，再脱左腿，两下就能把裤子和袜子同时脱下来。


    曾经有人看完我脱衣服之后说：“你真是动如脱兔啊！”这个点评实在是太经典了。


    我无法理解为什么非要一件一件地脱，费时费力。我总是会想，“明明里外的衣服可以同时脱下来”。我因为一心想要省时省力，就想出了这种脱衣服的方法。


    小学时大家都要背的“乘法口诀”，我也只记了一半。因为我觉得“4×7=28”和“7×4=28”是一样的，所以只要记住一个就可以了。不知道为什么有人能脱口说出“3×8=24”“4×7=28”，却不能脱口说出“8×3=24”“7×4=28”。小学时很多人也是全都背了，但当时我就在想“明明只记一半就可以了”。


    另外，我觉得乘法口诀表的第一列也毫无意义。第九列也只有“9×9 = 81”。我坚信，即使乘法口诀表中没有这两列，在日常生活中也很少会算错，甚至永远不会算错，所以这两列完全可以去掉。'
  - '[PAGE 102]


    为了能“省时省力”而不断开动脑筋这个习惯，定会带来许多提升效率的创意，是非常好的训练。为了省时省力，人们就会不断思考。


    因此，几项工作需要大家共同完成时，这样的想法瞬间就会冒出：“这项工作大家一起做会比较快。”“这项工作不需要两个人，一个人就能轻松搞定。”


    现今企业呼吁进行“工作方式改革”，推出减少无效工作时间、减少加班时间等相关措施。减少无效工作时间虽好，但现实情况却是，在减少工作时间的同时也裁减了员工，每个人的负担反而增大了。这并非真正意义上的改革。


    实际上，“只要工作量较少，就会更轻松”。


    如果朝着这个目标努力，就能提出新的创意。


    汽车和洗碗机的发明原本也是源于“省时省力”这个需求。


    活用这个原理是创意的根本。'
  - '[PAGE 103]


    # 将简单枯燥的工作趣味化


    仔细观察我们周围就会发现，“将枯燥之事趣味化”的产品和服务十分受消费者欢迎。


    比如，很多人都明白“为了健康要坚持运动”，但又很难落实到行动上。


    任天堂面向上述人士开发的游戏《健身环大冒险》人气爆棚。这款游戏需要人佩戴仪器，人体动作会和画面中的人物角色联动，让人在虚幻的世界冒险的同时也能健身。


    我身边的一些学生购买了这款游戏软件，我与他们一起挑战了一下这款健身游戏。在游戏中能够心情愉悦地进行运动，不得不说这是一款令人拍手称赞的产品。


    即使是持续做一段时间就会厌烦的单调动作，一旦设计成游戏，人也能开心地坚持做下去，游戏闯关成功时也会获得成就感。


    坚持“将枯燥之事趣味化”这个宗旨，有助于在日常的工作及生活中竭力思考并提出新创意。


    比如，“如果单位办公椅的舒适度提升了，可能就不再觉得工作枯燥乏味了”。人们想到这一点，就会下功夫调整坐垫的厚度和硬度。或者，人们思考并尝试提升敲键盘打字的速度。这样不断摸索，可以提升思考层次。


    早年刚有打字机时，我就抢先购入，是第一批打字机的使用者。当年因为还在读研究生，时间比较充裕，每天近10个小时都在敲键盘。我最初完全因为其方便快捷而折服，不久之后颈椎和肩膀就感到酸痛了。于是，我就开始琢磨：“有没有什么方法能缓解打字时的疲劳？”


    我做了各种尝试、摸索。有一天，我偶然拉开抽屉时突然想到，把胳膊放在拉开的抽屉上可以减轻肩膀和颈椎的负担。'
  - '[PAGE 104]


    能够舒适地敲键盘打字后，脑海中勾勒出的人物对话都以印刷字的形式呈现出来了。记得在想到这个好办法之前，我曾因为打字过多肩酸背痛，一度回归原始的记录方式——手写。


    言归正传，关于单调枯燥的琐事，我的思考目标一直都是：“怎样才能愉快地完成这些呢？”工作并非都是创造性的。细想一下，就连大学老师这个职业，其中的单调工作也占比非常大。为此，我会自己做好规划，比如“周一处理事务性工作”，而且会留心观察周一天解决烦琐之事的效率有多高。


    消耗最少的体能，高效完成非创造性工作，就能从中获得快感。


    假设需要完成这样一项工作，即“从一些信封中取出大量的资料，装入其他信封并写好地址，一封一封寄出去”。这时，如果能与一同工作的伙伴进行“分工”讨论，各自提出自己的意见并制订好具体计划，再着手开始做，就能快速完成任务，也能从中感受到快乐，不再觉得单调枯燥。


    雕刻家佐藤忠良等一流艺术家也曾说过，艺术创作中最重要的与其说是原创力，不如说是创作过程。揣摩如何高效且轻松地完成创作，将决定作品是否有新意。'
  - '[PAGE 105]


    # 能否简单且彻底地进行思考


    我们平时不经意间使用的各种产品和服务充满各种创意，平时没有留心注意的话，通常是不会发现这些内在创意的。但只要我们逐一剖析产品和服务，就能从中看出开发人员的思考层次。


    若想拿出非凡的创意，首先要坚持思考，知晓提出创意所需的思维深度。这一点非常重要。


    我本人特别关注的是设计简单的产品与服务，因为将思考凝结之后往往都是质朴之物。


    最有代表性的就是苹果手机。众所周知，苹果手机功能多样，但操作非常简单。


    在《简单致胜：看明智的领导者如何化繁为简》一书中，苹果公司前创意总监肯·西格尔详细介绍了史蒂夫·乔布斯坚持将苹果手机的按键简化为一个主键的原委。


    在苹果手机诞生之前，手机都有很多按键。按键多代表功能多，只要操作习惯确实很方便。


    但乔布斯追求的是一个按键的简约。无论是什么样的操作，只要按主键就能回到主页面的设计给使用者带来了无与伦比的简便和安心。对于潜心参禅悟道的乔布斯来说，简约就如同教义一样。


    “为何不能更简约一些呢？”


    “如何才能简约一些呢？”


    不断提出这样的问题，苹果公司的员工们才会不断尝试只有一个按键的智能手机。


    另外，“简约”终究是抽象的概念，将其作为具体的创意有形化这一过程是不可或缺的。'
  - '[PAGE 106]


    思考总体来说更容易抽象化，因此在具体化、有形化的过程中需要用心思考。在具象和抽象之间不断往复思考，就能把划时代的创意转化为实际的产品和服务。


    应乔布斯“简约到极致”这个抽象“订单”的要求，iPhone这款改变世界的具体产品问世了，与此同时，也让世人知晓了苹果公司的强大。


    再如，当年索尼公司研发的便携式音频播放器——“随身听”，也是将“随身携带播放音乐”这个抽象创意有形化，因此红极一时。


    众所周知，“随身听”源于索尼的创始人之一井深大的创意。当然，通过肩扛收录机也能实现物理意义上的“随身携带播放音乐”。但如何才能更为便捷、更为时尚地将“随身携带播放音乐”有形化呢？研究人员不断追求这个目标，最终研发出摒弃录音功能、只保留立体声播放功能的音频播放器。'
  - '[PAGE 107]


    # 思考的结晶即理念


    关于将抽象思维转为具象思维的方法，我推荐的是思考“理念”。


    职业棒球队经常会在锦标赛开赛时公布整个赛季的口号。


    同样，日本青山学院大学田径队的原晋教练每年在箱根驿传（长跑接力赛）即将开赛前都会公布一个名为“××大作战”的口号。其于2020年1月的箱根驿传提出的口号是“再创佳绩大作战”，青山学院队最终夺得冠军。


    此外，我至今记忆犹新的是，2019年橄榄球世界杯上日本队的口号“ONE TEAM”。


    在日本队首次跻身八强的同时，这个口号成为脍炙人口的佳句，并成为当年的流行语。


    假如不是“ONE TEAM”，而是其他的口号，也许日本队也能团结一心奋力拼搏，但日后细细想来，除了“ONE TEAM”也别无他选。


    这类口号就是一种理念。


    工作中也是如此。启动某个新项目或提出新方案时，以方向性为理念，并提出相应的口号，往往就会进展顺利。


    我曾读过关于日本橄榄球协会现任副会长清宫克幸在早稻田大学橄榄球部做教练时的采访报道，他在采访中说：“每次想口号都要花费很多精力。”


    口号是所有参与者的精神指引，必须简洁且具体。选出最恰当的表达应该相当费神。


    将“齐心协力、共创佳绩”作为工作中的团队理念虽说也可以，但听起来似乎更像心理准备而非理念。如果想要表达得更有特色一些，就应开始深入思考。综上所述，通过语言表达将理念有形化有助于培养思考'
  - '[PAGE 108]


    习惯。'
  - '[PAGE 109]


    # 偏见与常识会摧毁思考


    在提出创意的过程中，最大的障碍是偏见、常识等先入之见。诸如构思单一、提出的创意全无新意、思想守旧之人大多有一个共通点——“以先入之见审视事物”。


    “会议就应该在会议室举行。”固守这种想法的人，陷入僵局时很难转换思路。这时候，我一般会先到外面溜达一圈，返回会场后会提议变换模式，请与会者逐一发言，如此一来来有助于拿出崭新的创意。


    前文我们说过，在索尼公司开发出“随身听”之前，听音乐需要大的设备，且通常不好随身携带，这是大家公认的。如果始终固守这个常识，就不会有“随身携带播放音乐”这个变革性创意。


    想要突破偏见和常识的束缚，需要暂且把平时的视角收入大脑深处，之后再取出。“苹果真的是红色的吗？”“月亮真的是圆的吗？”对于我们身边的常识性认识，应该怀有类似的疑问。通过质疑，人们才会想要认真地审视对象。


    这也是奥地利哲学家胡塞尔所提倡的现象学的方法论——对以先入之见看待事物的人提出建议：“只有摒弃先入之见，你的意识和构思才会清晰。”这就是现象学。


    现象学兴盛一时，是因为人们容易受到先入之见的束缚。即便自以为客观地审视眼前的事物，但从严格意义上说，也并不准确且客观。


    如果有人把苹果摆在你面前说“你给苹果画幅画吧”，有人会画成漫画那样的抽象画。这种情况也是没真正观察眼前的苹果，而是屈从于自己心中已有的苹果形象。


    那么，如果有人对你说“请如实画出装冰水的玻璃杯”，就是我们平时经常看到的那种，我想大家都会仔细地观察杯子里的水和冰，很多人可能是第一次这样仔细观察。水和冰的颜色虽然大致相同，但我们从视觉上可以清楚分辨出它们的不同。而我们要想在画中体现出冰与水的不'
  - '[PAGE 110]


    同，则必须细心观察冰微妙的质感。


    如果画兑了水的威士忌，我们则需要思考如何画出威士忌溶入水中时产生的漩涡与色彩层次。


    即便平时对“兑水的威士忌”非常熟悉，仔细观察也会有全新的认识。


    抛开之前固有的认识，带着“这个东西本质是什么呢？”这样的疑问重新审视对象，思考就会从这一瞬间开启。


    换言之，抛开偏见与固有的认识，细心观察、倾听与用心思考密不可分。'
  - '[PAGE 111]


    # 相互说出自己的想法、相互表扬


    为了提升学生坚持思考、提出创意的能力，我有时会让他们做这样的练习，即四人一组，每人用15秒说出自己的想法、创意。一个班40人，一次只提问一位同学让其发言的话，其他39人很有可能在发呆。因此，课堂设计必须做到让全体同学都开口发言，这是最重要的。


    我用秒表计时，四个人每人15秒，大家说完一轮正好1分钟，第一轮结束马上进入第二轮，试试能连续进行几轮。另外，还需注意规则，即不可重复别人说过的想法。


    说到底，我的目的是让每位同学都能说出自己的想法。否则，每当讨论中让大家谈谈自己的想法时，就只是爱说话的人说个不停。需要注意的是，如果这个人所说的没有新意，那这个讨论时间就毫无意义。工作会议可能也是如此。


    每个人逐一说出自己的想法，反复进行几轮之后，难度系数就会提升，这时才是锻炼思考力的最佳时机。把他人提出的创意稍做改动，就能不断提出新的创意。


    在我的大学授课中，就“高效的教育方法”这一主题，大家轮流谈自己的意见，有一组同学曾创下21轮的纪录。通常10轮之后就会明显有智尽能索之感，对于在45秒之内提出一个想法也会感到困难。


    一名学生有点力不从心，说：“我没有意见了。”暂且先跳过这位同学，让其他同学继续说。没想到再次轮到刚才那位同学时，他竟然又“复活”了，说出了新的想法。不愧是明治大学的学生，不屈不挠。


    在这个训练中最重要的是开口说出自己的想法，就算不是最好的创意也没有关系。反复练习思考45秒，然后发表意见，不容许精神上有片刻的松懈，这样做效果非常好。


    采取这种方式，讨论现场瞬间会变成高端的创意大会。推荐大家在工作中与几个同事一起挑战一下。比如，就“减少加班的对策”这一主'
  - '[PAGE 112]


    题，几个人说说各自的想法，也许就能拿出崭新的改进方案。


    此外，在团队中让大家更愿意说出自己的想法。有一种催化剂是，对已经说出自己想法的人赞赏有加。一旦有人自愿表达自己的想法，就要及时表扬，说“你的想法很棒！”这样一来，大家提出的创意会越来越多。


    在工作中，年纪偏大的管理层往往很难提出创意。不仅如此，他们还会制造出一种莫名的严肃感，职场的整体氛围也会因此越发凝重。提不出什么创意的人，至少应该活跃一下现场的气氛。


    对于提出创意的人来说，赞赏是最棒的奖励。唯有一部分天才是只要体验了思考的过程并提出了创意，就会感到心满意足。而对于普通人来说，思考会伴有压力。正因为如此，他们更需要表扬、认可。


    这个道理也同样适用于小朋友。


    > “你刚才说的办法非常棒！”


    > “你这个想法是认真思考过的！”


    > “你确实开动脑筋用心思考了！”


    如果能够对小朋友做出上述表扬，他们就会不断地动脑思考。


    我有一次给鹿儿岛县的中学生讲爱因斯坦的引力波。讲解临近尾声时，我对在场的学生说：“有谁可以编一个关于引力波的小品并到前面来表演一下？”我平时总是对明治大学的学生提出这样的要求。


    当时，现场有近1 000名中学生。虽然我内心也觉得“这个要求对中学生来说有点过高”，但令我惊讶的是，有一男一女两位同学自告奋勇地走上了讲台。


    两位同学在听我讲解之前完全不了解引力波，只是听完我的讲解之后，即兴创作了一个小品，但他们的表演让全场人捧腹大笑。那名女同学在台上全身像波浪一样起伏，以此全力演绎引力波，我也笑得眼泪都出来了。在场所有人用热烈的掌声赞赏了她的勇气、幽默及知性。我对这位鼓起勇气表达自己创意的同学赞赏有加，她也备受鼓舞。这进而也唤起了大家的思考热情，进入一个良性循环。'
  - '[PAGE 113]


    # 随手写写画画，思考就会加速


    还有一个与分组轮流说出自己的创意近似的练习方式，即在笔记本或纸上列出3分钟能想到的所有创意，3分钟后发表自己的创意。


    每当出版社跟我说“希望您能给出书名”时，我经常会立即集中精力思考几分钟，然后在手机的备忘录里记下20多个题目并予以回复。


    我们可以在纸上写出自己的想法，也可以用智能手机的备忘录做记录。后者更方便，并且能在回复时直接复制自己写出的想法及创意发给对方。


    不论哪种方式，最重要的是把自己的想法及创意形成文字。众所周知，爱迪生、达·芬奇等伟大的发明家都是笔记狂人。


    关于笔记的作用，数学家藤原正彦在随笔中这样写道：我总是随身携带便笺，随时把自己的思考记录下来。据说数学家基本都有这个习惯。


    当然，如今很多工作都用电脑来做，但是随手写写画画，思考就会加速。影视剧中，我们都曾看过数学老师在黑板上写满数学算式，边写边讲解。而现实生活中的数学家也应该会在记事本上这样做。


    我自己也向那些帅气的数学家学习，跟出版社的编辑闲谈时会在手边的纸上写写关键词或者画个示意图，有时还会自言自语：“不是那样。”“也不是这样。”在做记录的过程中，关于“书名备选方案”“构成”“版面设计”等，我在头脑中会形成一个大致的思路。这样，一份出版策划书的初稿就形成了。把10张、20张手写记录一起交给编辑时，洽谈就结束了。之后，编辑将这些记录加以整理、润色，策划书就做好了。


    综上所述，做笔记是输出思考的绝技，因此外出时需随身携带思考记录本或有利于你随手记录的卡片，也可使用智能手机的备忘录功能。'
  md: '

    再如，“世上最幸福的事情莫过于有一份可从事一生的工作”这句话作为福泽谕吉的名言广为流传，但《福泽谕吉全集》中也没有这句话。


    假信息一传十、十传百，不知不觉就变成真的。这样的假信息多上网查查就能发现破绽。


    各位今后要多查证并传播真实准确的信息。并且，我们还需要具备“超级搜索力”这种最基础的思考力。


    ## 不断思考的人总会有新发现


    思考的时间不断增加，生活中的新发现也会不断增加。只要把自己的新发现以口述或文字的形式告诉大家，思考力就会提升，也就会激发新的创意。


    比如，参加研讨会或学习会后的感想只是“受益匪浅”“很多内容值得参考”，这就说明参与者的思考力有所欠缺。


    如果认真思考的话，应该会有更多发现，也应该能写出有见地的报告。认真思考的人听一个小时的研讨会，把自己想到的点一个一个详细列出来，可以写10页纸。


    文学家十分擅长以平平常常的经历为素材，接连不断地描写自己所意识到的点。


    太宰治有一部短篇小说《佐渡》，这篇小说就是以作家特有的文笔叙述了主人公游佐渡岛时平淡无奇的经历以及在岛上看到的种种风景。


    这篇小说简单概括就是：“一开始就知道佐渡什么也没有，但还是去了。去了之后发现果然什么都没有。”


    就是这么一个普通人只能说一句“什么也没有”的地方，太宰治以细腻的文笔写出了好多的新发现：


    船驶出新潟，马上就能看到一个小岛，好像那个小岛就是佐渡岛，船不知为什么没有驶向那个岛而是驶向别处。可是，从地图上看，新潟附近只有一个岛屿，所以那里一定是佐渡岛。我脑中有些混乱，想找个人问问“那个岛叫什么”，但如果真的是佐渡岛，人家一定会认为我是个“怪人”，所以想问也没法问。


    船驶过那座岛。看到大陆，我不禁问道：“那个岛真大，究竟是什么地方？”有人告诉我，那个岛就是佐渡岛。佐渡岛好像把“工”字横过来，最初看到的是群山，大的平原在山后，看起来像是两个岛。


    把这种些许的不安和新发现写成文字，小说就有了亮点。只是环游佐渡岛就能写出如此妙趣横生的文章，正是因为太宰治思考力强、文笔细腻。


    思考力强的人总是能在日常生活中有新的发现。因此，思考力强的人所写的文章中也会有很多新发现。


    能够把平淡无奇的日常写得妙趣横生，就说明思考力确实提升了。另外，提升思考力的最佳捷径是对思考上瘾。


    ## 第5章 孕育新创意的思考力


    ## 热销产品的背后定有思考上瘾之人


    经济学家彼得·德鲁克是现代管理学的开创者，被尊为“经营之神”。德鲁克将销售与市场营销进行了对比阐述。


    销售简单说来就是如何将某种已开发出的产品卖出去的措施。而与之相对，市场营销是指在产品还未开发的阶段去了解消费者需求的一系列举措。


    德鲁克在其著作中指出：“最为理想的市场营销是不再需要销售。”营销需使产品能够自行售罄。


    正如德鲁克所预测的那样，现代企业重视的不是销售而是营销。比如，在日本，到20世纪80年代前半叶，麒麟啤酒销售额在啤酒界一直居首位，排在其后的是札幌啤酒和朝日啤酒。朝日啤酒一度对业界第三的位置非常满意。


    但是，朝日啤酒公司于1987年大力投资的朝日超级干啤大受欢迎，令人刮目相看。它一气呵成完成大逆转，最终登上了业界老大的宝座。


    这种改写啤酒行业版图的巨大成功是如何取得的呢？


    实际上，是因为公司进行了大规模的喜好调查，在了解消费者口味的过程中发现，消费者对清爽且糖分低的啤酒需求更大。


    当市场调研人员把消费者的这种需求转告给技术人员时，技术人员毅然决然地说“那样会破坏啤酒的味道”。但最终为了生产出消费者需要的啤酒，技术人员也开始着手进行技术研发，最终开发出超级干啤。这必定是朝日啤酒公司产品开发负责人日夜思考的结果——他想要开发出能够满足消费者需求的啤酒。


    畅销产品的背后一定有很多思考。不是止步于“做出令自己满意的产品”，而是用心思考并不断摸索如何做出畅销产品，即让客户真正满意的产品，这是最为关键的一点。


    看报纸时，我会觉得以前那种满篇小字、信息量大的报纸比较好，而现在这种报纸却成了大问题。


    报纸的开本和页数是固定不变的，所以如果文字变大，整体的信息量应该就会减少。总而言之，比起“信息量”，读者更重视“易读”。为了满足读者的需求，报纸上的字号变大了。综上所述，读者的想法会随时代的变化而不断改变，需要我们用心思考，制定正确的方案。


    ## 欲轻松须思考


    至今为止，我写了将近800本书，将自己脑中的各种想法、创意以文字的形式记录下来。说到这里，大家会认为我是在自我炫耀，但这些都缘于我怕麻烦且追求完美的性格。好不容易想到一个策划方案，如果不一气呵成写下来，就太可惜了，思考的功夫就白费了。想到如果现在不马上写出来，“之后还是要写”，就会觉得太麻烦了，索性想到什么就把它记录下来。


    回想一下，因为“想省时省力”，我一直在努力思考生活及工作的各种具体方式。


    比如，蒸桑拿脱衣服时，我会把背心、衬衫、毛衣里外三件同时脱掉。只要解开衬衫上面的两个扣子，就能一下子全脱掉了。裤子、袜子也会一起脱下来。只要用大拇指勾住裤腰，同时拽下袜子，先脱右腿，再脱左腿，两下就能把裤子和袜子同时脱下来。


    曾经有人看完我脱衣服之后说：“你真是动如脱兔啊！”这个点评实在是太经典了。


    我无法理解为什么非要一件一件地脱，费时费力。我总是会想，“明明里外的衣服可以同时脱下来”。我因为一心想要省时省力，就想出了这种脱衣服的方法。


    小学时大家都要背的“乘法口诀”，我也只记了一半。因为我觉得“4×7=28”和“7×4=28”是一样的，所以只要记住一个就可以了。不知道为什么有人能脱口说出“3×8=24”“4×7=28”，却不能脱口说出“8×3=24”“7×4=28”。小学时很多人也是全都背了，但当时我就在想“明明只记一半就可以了”。


    另外，我觉得乘法口诀表的第一列也毫无意义。第九列也只有“9×9 = 81”。我坚信，即使乘法口诀表中没有这两列，在日常生活中也很少会算错，甚至永远不会算错，所以这两列完全可以去掉。


    为了能“省时省力”而不断开动脑筋这个习惯，定会带来许多提升效率的创意，是非常好的训练。为了省时省力，人们就会不断思考。


    因此，几项工作需要大家共同完成时，这样的想法瞬间就会冒出：“这项工作大家一起做会比较快。”“这项工作不需要两个人，一个人就能轻松搞定。”


    现今企业呼吁进行“工作方式改革”，推出减少无效工作时间、减少加班时间等相关措施。减少无效工作时间虽好，但现实情况却是，在减少工作时间的同时也裁减了员工，每个人的负担反而增大了。这并非真正意义上的改革。


    实际上，“只要工作量较少，就会更轻松”。


    如果朝着这个目标努力，就能提出新的创意。


    汽车和洗碗机的发明原本也是源于“省时省力”这个需求。


    活用这个原理是创意的根本。


    ## 将简单枯燥的工作趣味化


    仔细观察我们周围就会发现，“将枯燥之事趣味化”的产品和服务十分受消费者欢迎。


    比如，很多人都明白“为了健康要坚持运动”，但又很难落实到行动上。


    任天堂面向上述人士开发的游戏《健身环大冒险》人气爆棚。这款游戏需要人佩戴仪器，人体动作会和画面中的人物角色联动，让人在虚幻的世界冒险的同时也能健身。


    我身边的一些学生购买了这款游戏软件，我与他们一起挑战了一下这款健身游戏。在游戏中能够心情愉悦地进行运动，不得不说这是一款令人拍手称赞的产品。


    即使是持续做一段时间就会厌烦的单调动作，一旦设计成游戏，人也能开心地坚持做下去，游戏闯关成功时也会获得成就感。


    坚持“将枯燥之事趣味化”这个宗旨，有助于在日常的工作及生活中竭力思考并提出新创意。


    比如，“如果单位办公椅的舒适度提升了，可能就不再觉得工作枯燥乏味了”。人们想到这一点，就会下功夫调整坐垫的厚度和硬度。或者，人们思考并尝试提升敲键盘打字的速度。这样不断摸索，可以提升思考层次。


    早年刚有打字机时，我就抢先购入，是第一批打字机的使用者。当年因为还在读研究生，时间比较充裕，每天近10个小时都在敲键盘。我最初完全因为其方便快捷而折服，不久之后颈椎和肩膀就感到酸痛了。于是，我就开始琢磨：“有没有什么方法能缓解打字时的疲劳？”


    我做了各种尝试、摸索。有一天，我偶然拉开抽屉时突然想到，把胳膊放在拉开的抽屉上可以减轻肩膀和颈椎的负担。


    能够舒适地敲键盘打字后，脑海中勾勒出的人物对话都以印刷字的形式呈现出来了。记得在想到这个好办法之前，我曾因为打字过多肩酸背痛，一度回归原始的记录方式——手写。


    言归正传，关于单调枯燥的琐事，我的思考目标一直都是：“怎样才能愉快地完成这些呢？”工作并非都是创造性的。细想一下，就连大学老师这个职业，其中的单调工作也占比非常大。为此，我会自己做好规划，比如“周一处理事务性工作”，而且会留心观察周一天解决烦琐之事的效率有多高。


    消耗最少的体能，高效完成非创造性工作，就能从中获得快感。


    假设需要完成这样一项工作，即“从一些信封中取出大量的资料，装入其他信封并写好地址，一封一封寄出去”。这时，如果能与一同工作的伙伴进行“分工”讨论，各自提出自己的意见并制订好具体计划，再着手开始做，就能快速完成任务，也能从中感受到快乐，不再觉得单调枯燥。


    雕刻家佐藤忠良等一流艺术家也曾说过，艺术创作中最重要的与其说是原创力，不如说是创作过程。揣摩如何高效且轻松地完成创作，将决定作品是否有新意。


    ## 能否简单且彻底地进行思考


    我们平时不经意间使用的各种产品和服务充满各种创意，平时没有留心注意的话，通常是不会发现这些内在创意的。但只要我们逐一剖析产品和服务，就能从中看出开发人员的思考层次。


    若想拿出非凡的创意，首先要坚持思考，知晓提出创意所需的思维深度。这一点非常重要。


    我本人特别关注的是设计简单的产品与服务，因为将思考凝结之后往往都是质朴之物。


    最有代表性的就是苹果手机。众所周知，苹果手机功能多样，但操作非常简单。


    在《简单致胜：看明智的领导者如何化繁为简》一书中，苹果公司前创意总监肯·西格尔详细介绍了史蒂夫·乔布斯坚持将苹果手机的按键简化为一个主键的原委。


    在苹果手机诞生之前，手机都有很多按键。按键多代表功能多，只要操作习惯确实很方便。


    但乔布斯追求的是一个按键的简约。无论是什么样的操作，只要按主键就能回到主页面的设计给使用者带来了无与伦比的简便和安心。对于潜心参禅悟道的乔布斯来说，简约就如同教义一样。


    “为何不能更简约一些呢？”


    “如何才能简约一些呢？”


    不断提出这样的问题，苹果公司的员工们才会不断尝试只有一个按键的智能手机。


    另外，“简约”终究是抽象的概念，将其作为具体的创意有形化这一过程是不可或缺的。


    思考总体来说更容易抽象化，因此在具体化、有形化的过程中需要用心思考。在具象和抽象之间不断往复思考，就能把划时代的创意转化为实际的产品和服务。


    应乔布斯“简约到极致”这个抽象“订单”的要求，iPhone这款改变世界的具体产品问世了，与此同时，也让世人知晓了苹果公司的强大。


    再如，当年索尼公司研发的便携式音频播放器——“随身听”，也是将“随身携带播放音乐”这个抽象创意有形化，因此红极一时。


    众所周知，“随身听”源于索尼的创始人之一井深大的创意。当然，通过肩扛收录机也能实现物理意义上的“随身携带播放音乐”。但如何才能更为便捷、更为时尚地将“随身携带播放音乐”有形化呢？研究人员不断追求这个目标，最终研发出摒弃录音功能、只保留立体声播放功能的音频播放器。


    ## 思考的结晶即理念


    关于将抽象思维转为具象思维的方法，我推荐的是思考“理念”。


    职业棒球队经常会在锦标赛开赛时公布整个赛季的口号。


    同样，日本青山学院大学田径队的原晋教练每年在箱根驿传（长跑接力赛）即将开赛前都会公布一个名为“××大作战”的口号。其于2020年1月的箱根驿传提出的口号是“再创佳绩大作战”，青山学院队最终夺得冠军。


    此外，我至今记忆犹新的是，2019年橄榄球世界杯上日本队的口号“ONE TEAM”。


    在日本队首次跻身八强的同时，这个口号成为脍炙人口的佳句，并成为当年的流行语。


    假如不是“ONE TEAM”，而是其他的口号，也许日本队也能团结一心奋力拼搏，但日后细细想来，除了“ONE TEAM”也别无他选。


    这类口号就是一种理念。


    工作中也是如此。启动某个新项目或提出新方案时，以方向性为理念，并提出相应的口号，往往就会进展顺利。


    我曾读过关于日本橄榄球协会现任副会长清宫克幸在早稻田大学橄榄球部做教练时的采访报道，他在采访中说：“每次想口号都要花费很多精力。”


    口号是所有参与者的精神指引，必须简洁且具体。选出最恰当的表达应该相当费神。


    将“齐心协力、共创佳绩”作为工作中的团队理念虽说也可以，但听起来似乎更像心理准备而非理念。如果想要表达得更有特色一些，就应开始深入思考。综上所述，通过语言表达将理念有形化有助于培养思考习惯。


    ## 偏见与常识会摧毁思考


    在提出创意的过程中，最大的障碍是偏见、常识等先入之见。诸如构思单一、提出的创意全无新意、思想守旧之人大多有一个共通点——“以先入之见审视事物”。


    “会议就应该在会议室举行。”固守这种想法的人，陷入僵局时很难转换思路。这时候，我一般会先到外面溜达一圈，返回会场后会提议变换模式，请与会者逐一发言，如此一来来有助于拿出崭新的创意。


    前文我们说过，在索尼公司开发出“随身听”之前，听音乐需要大的设备，且通常不好随身携带，这是大家公认的。如果始终固守这个常识，就不会有“随身携带播放音乐”这个变革性创意。


    想要突破偏见和常识的束缚，需要暂且把平时的视角收入大脑深处，之后再取出。“苹果真的是红色的吗？”“月亮真的是圆的吗？”对于我们身边的常识性认识，应该怀有类似的疑问。通过质疑，人们才会想要认真地审视对象。


    这也是奥地利哲学家胡塞尔所提倡的现象学的方法论——对以先入之见看待事物的人提出建议：“只有摒弃先入之见，你的意识和构思才会清晰。”这就是现象学。


    现象学兴盛一时，是因为人们容易受到先入之见的束缚。即便自以为客观地审视眼前的事物，但从严格意义上说，也并不准确且客观。


    如果有人把苹果摆在你面前说“你给苹果画幅画吧”，有人会画成漫画那样的抽象画。这种情况也是没真正观察眼前的苹果，而是屈从于自己心中已有的苹果形象。


    那么，如果有人对你说“请如实画出装冰水的玻璃杯”，就是我们平时经常看到的那种，我想大家都会仔细地观察杯子里的水和冰，很多人可能是第一次这样仔细观察。水和冰的颜色虽然大致相同，但我们从视觉上可以清楚分辨出它们的不同。而我们要想在画中体现出冰与水的不同，则必须细心观察冰微妙的质感。


    如果画兑了水的威士忌，我们则需要思考如何画出威士忌溶入水中时产生的漩涡与色彩层次。


    即便平时对“兑水的威士忌”非常熟悉，仔细观察也会有全新的认识。


    抛开之前固有的认识，带着“这个东西本质是什么呢？”这样的疑问重新审视对象，思考就会从这一瞬间开启。


    换言之，抛开偏见与固有的认识，细心观察、倾听与用心思考密不可分。


    ## 相互说出自己的想法、相互表扬


    为了提升学生坚持思考、提出创意的能力，我有时会让他们做这样的练习，即四人一组，每人用15秒说出自己的想法、创意。一个班40人，一次只提问一位同学让其发言的话，其他39人很有可能在发呆。因此，课堂设计必须做到让全体同学都开口发言，这是最重要的。


    我用秒表计时，四个人每人15秒，大家说完一轮正好1分钟，第一轮结束马上进入第二轮，试试能连续进行几轮。另外，还需注意规则，即不可重复别人说过的想法。


    说到底，我的目的是让每位同学都能说出自己的想法。否则，每当讨论中让大家谈谈自己的想法时，就只是爱说话的人说个不停。需要注意的是，如果这个人所说的没有新意，那这个讨论时间就毫无意义。工作会议可能也是如此。


    每个人逐一说出自己的想法，反复进行几轮之后，难度系数就会提升，这时才是锻炼思考力的最佳时机。把他人提出的创意稍做改动，就能不断提出新的创意。


    在我的大学授课中，就“高效的教育方法”这一主题，大家轮流谈自己的意见，有一组同学曾创下21轮的纪录。通常10轮之后就会明显有智尽能索之感，对于在45秒之内提出一个想法也会感到困难。


    一名学生有点力不从心，说：“我没有意见了。”暂且先跳过这位同学，让其他同学继续说。没想到再次轮到刚才那位同学时，他竟然又“复活”了，说出了新的想法。不愧是明治大学的学生，不屈不挠。


    在这个训练中最重要的是开口说出自己的想法，就算不是最好的创意也没有关系。反复练习思考45秒，然后发表意见，不容许精神上有片刻的松懈，这样做效果非常好。


    采取这种方式，讨论现场瞬间会变成高端的创意大会。推荐大家在工作中与几个同事一起挑战一下。比如，就“减少加班的对策”这一主题，几个人说说各自的想法，也许就能拿出崭新的改进方案。


    此外，在团队中让大家更愿意说出自己的想法。有一种催化剂是，对已经说出自己想法的人赞赏有加。一旦有人自愿表达自己的想法，就要及时表扬，说“你的想法很棒！”这样一来，大家提出的创意会越来越多。


    在工作中，年纪偏大的管理层往往很难提出创意。不仅如此，他们还会制造出一种莫名的严肃感，职场的整体氛围也会因此越发凝重。提不出什么创意的人，至少应该活跃一下现场的气氛。


    对于提出创意的人来说，赞赏是最棒的奖励。唯有一部分天才是只要体验了思考的过程并提出了创意，就会感到心满意足。而对于普通人来说，思考会伴有压力。正因为如此，他们更需要表扬、认可。


    这个道理也同样适用于小朋友。


    > “你刚才说的办法非常棒！”


    > “你这个想法是认真思考过的！”


    > “你确实开动脑筋用心思考了！”


    如果能够对小朋友做出上述表扬，他们就会不断地动脑思考。


    我有一次给鹿儿岛县的中学生讲爱因斯坦的引力波。讲解临近尾声时，我对在场的学生说：“有谁可以编一个关于引力波的小品并到前面来表演一下？”我平时总是对明治大学的学生提出这样的要求。


    当时，现场有近1000名中学生。虽然我内心也觉得“这个要求对中学生来说有点过高”，但令我惊讶的是，有一男一女两位同学自告奋勇地走上了讲台。


    两位同学在听我讲解之前完全不了解引力波，只是听完我的讲解之后，即兴创作了一个小品，但他们的表演让全场人捧腹大笑。那名女同学在台上全身像波浪一样起伏，以此全力演绎引力波，我也笑得眼泪都出来了。在场所有人用热烈的掌声赞赏了她的勇气、幽默及知性。我对这位鼓起勇气表达自己创意的同学赞赏有加，她也备受鼓舞。这进而也唤起了大家的思考热情，进入一个良性循环。


    ## 随手写写画画，思考就会加速


    还有一个与分组轮流说出自己的创意近似的练习方式，即在笔记本或纸上列出3分钟能想到的所有创意，3分钟后发表自己的创意。


    每当出版社跟我说“希望您能给出书名”时，我经常会立即集中精力思考几分钟，然后在手机的备忘录里记下20多个题目并予以回复。


    我们可以在纸上写出自己的想法，也可以用智能手机的备忘录做记录。后者更方便，并且能在回复时直接复制自己写出的想法及创意发给对方。


    不论哪种方式，最重要的是把自己的想法及创意形成文字。众所周知，爱迪生、达·芬奇等伟大的发明家都是笔记狂人。


    关于笔记的作用，数学家藤原正彦在随笔中这样写道：我总是随身携带便笺，随时把自己的思考记录下来。据说数学家基本都有这个习惯。


    当然，如今很多工作都用电脑来做，但是随手写写画画，思考就会加速。影视剧中，我们都曾看过数学老师在黑板上写满数学算式，边写边讲解。而现实生活中的数学家也应该会在记事本上这样做。


    我自己也向那些帅气的数学家学习，跟出版社的编辑闲谈时会在手边的纸上写写关键词或者画个示意图，有时还会自言自语：“不是那样。”“也不是这样。”在做记录的过程中，关于“书名备选方案”“构成”“版面设计”等，我在头脑中会形成一个大致的思路。这样，一份出版策划书的初稿就形成了。把10张、20张手写记录一起交给编辑时，洽谈就结束了。之后，编辑将这些记录加以整理、润色，策划书就做好了。


    综上所述，做笔记是输出思考的绝技，因此外出时需随身携带思考记录本或有利于你随手记录的卡片，也可使用智能手机的备忘录功能。

