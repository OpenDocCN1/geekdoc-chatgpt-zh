    # 向星巴克取经，使环境充满创意


    前文提到了咖啡厅，我想讲一个有关星巴克对思考空间的“名称”非常考究的小故事。


    NHK电视台的《去面试！GO！》这档节目是面向应届毕业生，介绍受欢迎的企业“面试空间”。这个节目有一期介绍了星巴克日本总部的接待室。面试候场的房间与星巴克门店的装修相同，面试的房间也具有星巴克的特色时尚风格。


    吸引我的是各个房间的名称。公司的接待室一般都是以第一接待室、第二接待室……或A接待室、B接待室、C接待室……来命名。


    而星巴克在这一点上，却创意十足。相信大家看到星巴克接待室的名称都会赞不绝口，异口同声地说“不愧是星巴克”。


    借此机会，也想请大家思考：假如你是星巴克的员工，你会给接待室起个什么样的名字呢？


    “（1号房间）（2号房间）太土了。”


    “怎样命名才能更好地体现出星巴克的‘特色’呢？”


    “蓝色和红色并非不可或缺......”


    大概在星巴克内部，也有过类似的讨论。


    最终，它以“坦桑尼亚”“卢旺达”这些咖啡原产地的名称来命名接待室。


    其他行业的公司如果在名为“坦桑尼亚”“卢旺达”的房间里面试求职者，会让求职者有强烈的违和感。但星巴克在以咖啡原产地命名的接待室里面试求职者，就会让求职者暗自赞叹：这是家很有创意的公司。


    虽然只是接待室的名称，但以咖啡原产地的名称来命名后，就会让'
