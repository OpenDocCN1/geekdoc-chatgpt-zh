    # 观察力和思考力保持一致


    只要有观察力，在任何工作中都能活用思考力。


    如前文所述，坚持用心思考的司机和完全不动脑思考的司机的驾驶水平完全不在同一个层次。


    餐厅里的客人举手说“请给我一份菜单”时，没有动脑思考的店员就只会拿着菜单过去，递给客人。


    而用心思考的店员会在客人提出请求前，将水和菜单一起拿给客人，在恰当的时候过去提供点餐服务。


    如果有可以把大脑活动可视化的装置，你会发现，用心思考的店员在以惊人的速度进行大量思考。


    “那桌的客人快吃完了，必须准备饮品。”


    “给这桌客人送水之前，要先给那一桌送菜单！”


    “对啦，那位客人不吃芥末，慎重起见，先跟厨房说一声。”


    现实中其实无须获得将大脑活动可视化的装置，只要看看优秀店员的一举一动，就能知道他们在用心思考。


