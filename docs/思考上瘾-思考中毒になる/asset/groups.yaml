    # 与自己内心的思考搭档辩论


    通过对谈提升思考力的另一种方法是“自我对话”。


    自己先提出某种主张，与此相对，再提出另一种主张，然后进行自我辩论、深入思考。


    我晚上经常梦见与别人辩论。每当我说出一种意见，就会出现一位超强的辩论对手，揪住我观点中的漏洞不放，等我早上醒来时，有时甚至会感到疲惫不堪。我给学生讲了这件事，有的学生说：“一定会特别累，因为梦中出现的辩论对手是斋藤老师本人。老师全力与自己辩论，一定会疲惫不堪的。”


    这样说来确实如此。


    与自己对话，指出自己观点的矛盾之处及逻辑不够严谨之处，并进行反复的自我辩论，这样，任何人提出的问题都会在意料之中。例如，在工作会议上提出自己的意见，即使上司反驳，也能以万全之策进行应对，沉着冷静地回答：“关于这一点我已经研究过了，这样就能解决。”


    实际上，我们在各种场合都能发现自我对话。看小说时，我们会看到男女主人公的对话。两人的对话究其根源是作者脑中虚构的声音与作者本人的对话，即内心世界的自我对话。


    借鉴这种形式，我们设定“店员”与“客人”这两种角色，让他们进行对话，就能编撰出完美的投诉处理指南。


    投诉处理指南若写得滑稽有趣，就会像相声台词一样。捧哏对逗哏所说的话不断吐槽，通过这种衬托、铺垫，两人一唱一和，就会让稀松平常的事情生动有趣起来。


    正是有了捧哏一针见血的吐槽，才能衬托出逗哏的表演生动有趣。我所参加的综艺节目《全力！脱力时间》，每一期搞笑艺人的吐槽中都有很多深入人心的经典台词。其中，漫才组合Untouchable的柴田英嗣'
