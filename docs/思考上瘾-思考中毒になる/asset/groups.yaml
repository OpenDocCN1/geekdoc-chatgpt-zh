    # # 应用函数提出创意


    我认为将各种事物进行组合，提出创意的方法也是在应用函数。而且我认为在学到的数学知识中，函数是在日常生活中使用得最多的。我还记得我在中学的数学课上曾激动地说“这是划时代的思考方法”。


    函数用“y=f (x)”来表示，f代表运算法则，根据x的值可以推导出y的值。在思考新创意时，可以活用“某一项，通过一定的变换，就会产生某种新东西”这个原则。


    为了更清楚易懂，假设f是“厢式化”，x是“KTV”，就能推导出厢式化（KTV）=KTV包厢。


    我二十几岁时，说到“K歌”一般都是在快餐厅里或者旅游巴士上。这两个地方都需要当着陌生人的面唱歌。当时，去“K歌”的人很多，连续听陌生人唱歌有时会让人觉得有些无聊。


    但是，可以与家人、朋友一起“K歌”，还可以一个人“K歌”的KTV包厢问世之后，“K歌”一下子融入普通人的日常生活中。KTV包厢是一项创新发明。


    借用这个思路，我们将某种东西厢式化并进行思考。x如果是“居酒屋”，y就是居酒屋包间。x是棒球场地的话，y就是棒球馆。无论是哪个创意，现在都已在我们的生活中随处可见。


    有一次，我请大家就厢式化公式进行思考，没想到有人说：“x是宇宙，y是天文馆如何？”我觉得这个人想象力太丰富了！用这种厢式化思维重新观察我们身边的事物，脑海中就会不断浮现出“投币式寄存柜”“漫画吧”等成功案例。


    说到“运用这个厢式化公式思考新的商机”，很多人会提出有趣的创意。寿命长的电视节目大多都是f这个环节做得特别好，无论什么样的人参演都会有趣。'
