    # 凭借“假如”这种设想不断进行思考


    从其他视角进行全新构思时，运用“假如”也是一种方法。放飞自我，试想一下：“假如这个从世上消失，会如何呢？”“假如生活中有了这种事物，生活会有什么改变呢？”


    “假如能降落到月球上，我会做些什么呢？”


    “假如我变成深海鱼，能看到什么样的风景呢？”


    可以试想一下假如自己去了其他世界会如何，也可以尝试改变已有的故事情节，比如“假如这部小说的主人公不是大人而是小孩，会是什么情况呢？”“假如这部电视剧的背景设定不是证券公司而是小工厂，会怎样呢？”


    仅改变一个设定，故事就完全变了。由此可见，只要想象力丰富，创新力就会提升，就能一直坚持思考。


    青柳碧人的《很久很久以前，在某一个地方......》是将民间故事改编成推理小说。受其启发，我也曾要求大学生们以“××如果是杀人事件的话”为题，发表自己的创意。


    我至今仍然记得艺人武井壮刚开始在电视上露面时，以“假如”这个独特的段子赢得了很多粉丝。


    武井壮最初的介绍是“百兽之王”。说到“百兽之王”，绝大多数人会想到狮子，而自称百兽之王，这也体现了武井壮的别具一格。


    比如，假如与长颈鹿搏斗，他首先会跑到长颈鹿的背后，跳到长颈鹿背上，按住长颈鹿脖子上的穴位，这样就会使长颈鹿的血压下降，就地倒下。假如与狮子搏斗，为了不被狮子咬住脑袋，故意让狮子咬住自己的右手腕，手臂用力地堵住狮子的利牙，用拳头猛击狮子的鼻子，将其击倒。'
