  - '[PAGE 88]


    # 思考源源不断的法宝——三色圆珠笔


    我在读书时，为了能深入思考，一直坚持“使用三色圆珠笔”。这三种颜色分别强调不同的内容。


    +   - 红色＝非常重要

    +   - 蓝色＝一般重要

    +   - 绿色＝感兴趣或有趣


    客观上觉得非常重要的内容可以用红色笔画出，红色是重要信息的代表色。阅读时，如果认为“这体现了作者的观点”，就用红色笔标记出来。最理想的标注，是日后只要重新读一下红色笔画出的部分就能理解作者的主张。红色笔不要乱用，一定要用来标注最重要的内容。


    然后是蓝色笔，用蓝色笔画出梗概。与红色笔不同，蓝色笔多用一些也没关系。


    最后是绿色笔。自己主观上觉得有趣的内容都可以用绿色笔标记。哪怕自始至终都只有自己觉得这部分“有趣”也没关系。


    按照自己的感觉，在意的内容都可以用绿色笔画出。红蓝两色可以重合，与主题无关，但自己觉得独特的部分或者只有自己喜欢的内容要用绿色笔标出来。甚至有时其他人都会问：“这篇文章哪部分最吸引你呢？”


    一开始就想准确地区分使用三种颜色的笔，也许反而导致无法集中精力理解书中的内容。建议大家不要过于在意，按照自己的感觉用不同颜色的笔来标记就可以了。


    可以暂且先按照“用红色和蓝色标出客观内容，用绿色标出主观内容”这个标准来边读边做记号。如果觉得这样也很困难，可以多用自由度高的绿色笔。哪怕只是用绿色笔来画线，我们也能体会到阅读的乐'
  - '[PAGE 89]


    趣。


    用绿色笔画线，就能意识到自己的思维水平。


    换言之，这样阅读日后需要输出时会更容易，比如可以轻松地写文章、给别人讲述等。


    当然，开会以及自己独自思考时也可以活用三色圆珠笔。做笔记时，根据内容的重要性，可以用不同颜色的笔来记录。客观事实用红色笔和蓝色笔来标注，自己的主观感想用绿色笔来标注。这样记录的话，被人问及意见、感想时也能马上作答。


    我现在已经到了没有三色圆珠笔就无法思考的程度，看到某人阅读时不用三色圆珠笔写写画画就会觉得不可思议。


    使用三色圆珠笔进行标记，思考就会停不下来。掌握了使用的诀窍后，无论思考什么都会笔不离手。'
