    新。某些想法即使在这个领域被认为是失败的，换到其他领域也许就是了不起的大发现。如果可以更为灵活、宽泛地解读，我认为进行创新非常容易。但实际进行创新的人也不会仅仅是复制粘贴，破坏自己的形象。我想对这些人说：思考时再轻松点，你会发现创新非常简单。（摘自：NHK电视台专题纪录片）


    我对他这段话的解读就是“重组思维完全可以带来创新”。


    由此看来，世界上很多创新性发明源于重组。例如，“照片”与“贴纸”很久之前就有，但把二者结合在一起的“大头贴”却作为划时代的发明大受欢迎。仅仅把两种事物组合在一起，就可能创造出改变世界的价值。我觉得我们不应自卑地说“我只是进行了重组”，而应大胆追求重组；不是“重组也可以”，而是“最好是重组”。'
