    | TransE$^{[66]}$ | $\|h + r - t\|$ | $d(n_e + n_r)$ |

    | TransH$^{[479]}$ | $\|(h - w_r^T h w_r) + r - (t - w_r^T h w_r)\|$ | $d_e n_e
    + 2 d_r n_r$ |

    | TransR$^{[291]}$ | $\|M_r h + r - M_r t\|$ | $d_e n_e + (d_r + d_r)^{n_r}$ |

    | TransD$^{[228]}$ | $\|(h''^T r'' + I)h + r - (t''^T r'' + I)t\|$ | $2 d_e n_e
    + 2 d_r n_r$ |

    | TransM$^{[151]}$ | $w_r \|h + r - t\|$ | $d(n_e + n_r) + n_r$ |

    | TransA$^{[498]}$ | $(h + r - t)^T W_r (h + r - t)$ | $d_e n_e + (d_r + d_r)^{n_r}$
    |

    | TransG$^{[499]}$ | $\sum_{m=1}^{M_r} \pi_{r,m} e^{-\frac{\|u_h + u_{r,m} - u_t\|_2^2}{\sigma_h^2
    + \sigma_t^2}}$ | $2 d_e n_e$ |

    | KG2E$^{[203]}$ | $\frac12\{\mu^T \Sigma^{-1} \mu + \log \det \Sigma\}$, $\Sigma
    = \Sigma_h + \Sigma_t + \Sigma_r$ | $2 d_e n_e + 2 d_r n_r$ |

    | SparseTrans$^{[229]}$ | $\|h M(\theta_r^h)_r^h + r - t M(\theta_r^t)_r^t\|$
    | $d_e n_e + 2 + 2(1 - \theta)(d_r + 1)n_r n_e$ |


    体，不能很好地刻画头尾部实体间的联系。Unstructured 模型^{[64]} 是 Structured 模型的特例，它令 W = I，打分函数 f_r(h,t)
    为 −‖h−t‖₁。显然，该模型的缺点是没有考虑不同关系的影响。Semantic Matching Energy（SME）模型^{[64]} 为了克服参数过多的問題，将实体和关系都用向量表示，所有三元组共享
    SME 中的参数。SME 使用多维矩阵运算刻画实体和关系之间的联系，它首先对 h、r 进行线性运算得到向量 v_hr，然后再对 t、r 做线性运算得到向量
    v_tr，打分函数为 v_hr^T v_tr，其中线性运算的权重可以是矩阵，也可以是三维张量。SME 具有很强的学习能力，参数较少，但是计算量大，特别是使用三维张量的情况下，很难运用到大规模知识图谱中。


    Latent Factor（LF）模型^{[227, 454]} 将实体用向量表示，关系用矩阵表示。LF 把关系看作实体间的二阶关联，定义打分函数 f_r(h,t)
    = h^T W_r t（某种程度上等价于 RESCAL 模型）。这个模型使得实体和关系之间产生交互，实体和关系之间的联系得到充分的体现。Single Layer（SL）模型^{[434]}
    将实体用向量表示，关系用矩阵表示，为每个三元组定义一个单层非线性神经网络作为打分函数，以实体向量为输入层，关系矩阵为网络的权重参数。SL 模型是 NTN 模型的特例，当
    NTN 中三维张量均为 0 时，NTN 退化为 SL。Neural Tensor Network（NTN）模型^{[434]} 是受 LF 模型启发，在 SL
    中加入关系与实体的二阶非线性操作，增强实体与关系的交互性。NTN 是目前表达能力最强的模型，适合学习稠密的知识图谱。它的主要缺点是参数太多，计算量太大，不适合稀疏知识图谱。'
