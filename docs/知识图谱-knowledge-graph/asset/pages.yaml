  md: '识库，这个常识知识库以通用的概念为描述对象，建立并描述这些概念之间的关系，并认为不能依靠若干专家构建人类各行各业的知识，而应该先让知识工程师设计知识框架（即应该表示什么概念，概念之间有哪些关系）并建立基本的知识库原型，在此基础上再向专业性知识库延伸和发展。其中，专业性知识库或称领域知识库主要靠专业人员来完成，专业人员采用知识工程师的框架完成自己专业知识的编撰。


    # 2.1.3 框架


    框架表示法是由美国著名人工智能学者 Minsky 在 1975 年首先提出来的知识表示方法 [341]。从认知学的角度，框架理论继承了人类认识世界的方式，对现实世界中各种事物，人类都是以一种类似于框架的结构存储在记忆中。当面临一个新事物时，人就从记忆中找出一个合适的框架，并根据实际情况对框架中的具体值进行填充，填充的部分被称为槽（Slot），而框架以及槽的粒度则根据人类对事物认知程度而定。因此，理论上框架表示法是对世界知识的一种有效建模。


    框架将所有事物进行了抽象，并用来表示事物各方面的属性以及事物之间的类属关系。例如图 2.3 中展示了两个框架的例子。


    | 框架1: <教师> | 框架2: <灾难> |

    |---|---|

    | 槽1: <姓名> | 槽1: <时间> |

    | 槽2: <年龄> | 槽2: <地点> |

    | 槽3: <学校> | 槽3: <伤亡> |

    | 槽4: <院系> | 侧面3.1: <死亡人数> |

    | 槽5: <专业> | 侧面3.2: <失踪人数> |

    | 槽6: <职称> | 槽4: <损失> |

    | 槽7: <学位> | 侧面4.1: <直接经济损失> |

    | 槽8: <毕业院校> | 侧面4.2: <间接经济损失> |

    | 槽9: <参加工作时间> | 槽5: <救援> |

    |  | 侧面5.1: <救援部门> |

    |  | 侧面5.2: <相应时间> |

    |  | 侧面5.3: <捐赠情况> |

    |  | ... |


    图 2.3 框架示例


    教师和灾难是两个概念或类别，框架定义了这些概念的实例应该或可能具备的属性，这些属性被称为槽。例如对于框架 1：< 教师 > 包含九个槽，若存在一个教师的实体，就需要对教师框架中的槽或部分槽进行值的填充，例如
    < 教师实例 > { < 姓名 > {张三}，< 年龄 > {30}，< 学校 > {中国科学院大学}，'
