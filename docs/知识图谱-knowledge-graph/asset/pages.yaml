    \ . }\n```\n\n该语句返回的结果为“yes”；如果数据中没有“费米”的老师节点（即“玻恩”），则返回“no”。\n\nDESCRIBE 语句用于获取与给定资源相关的数据，其基本语法为\n\
    \n```\nDESCRIBE 资源或变量 [WHERE 图模式]\n```"
