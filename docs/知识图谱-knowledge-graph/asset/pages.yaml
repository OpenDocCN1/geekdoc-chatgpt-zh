- pgno: 134
  md: '# 第六章 关系抽取


    前面的章节已经介绍了实体识别和消歧的任务及其方法。而实体之间的关系是知识图谱中不可或缺的部分，不同的关系将独立的实体连接在一起编织成知识图谱。如何从结构化或者非结构化文本中识别出实体之间的关系是知识图谱构建的核心任务之一。同时，关系抽取也是文本内容理解的重要支撑技术之一，能够将文本分析从语言层面提升到内容层面，对于问答系统、智能客服、聊天机器人、语义搜索等应用都十分重要。因此，这一任务得到了学术界和工业界的广泛关注，正成为越来越热门的研究课题。本章首先介绍关系抽取的任务、分类及难点，然后介绍关系抽取的相关评测，最后以非结构化文本实体关系抽取为例介绍限定域关系抽取和开放域关系抽取的典型方法。


    # 6.1 任务概述


    # 6.1.1 任务定义


    关系定义为两个或多个实体①之间的某种联系，关系抽取就是自动识别实体之间具有的某种语义关系。根据参与实体的多少可以分为二元关系抽取和多元关系抽取[411]，其中二元关系指两个实体间的关系，多元关系指三个及以上实体间的关系。二元关系抽取是其他关系抽取研究的基础，因此本章主要介绍二元关系抽取，关注两个实体间的语义关系，得到
    (arg1, relation, arg2) 三元组，其中 arg1 和 arg2 表示两个实体，relation 表示实体间的语义关系。给定两个实体中国和北京，通过二元关系抽取得到它们之间的语义关系是首都，就能抽


    ① 本章所介绍的方法同时适用于命名实体或者名词性成分（nominals）之间的关系，下文不对这两个概念做区分，统称为实体关系抽取。'
