  md: '并为每个事件子类别制定了模板，方便事件元素的识别及事件角色的判定[105]。


    # 3. 相关评测和语料资源


    本节内容主要介绍事件抽取相关的评测会议和语料资源。


    # （1）MUC 评测会议


    消息理解会议（Message Understanding Conference, MUC）对于事件抽取相关的研究起到了非常大的推动作用。MUC-2 旨在从海军军事情报中抽取事件信息并填入预定义的模板中，这个模板可以看作是事件的框架。模板中包括了事件类型、地点、时间、参与者等
    10 个槽。MUC-3 针对拉丁美洲的恐怖袭击的报道进行事件抽取，模板的槽也增加到了 18 个。MUC-4 沿用了 MUC-3 的语料，不过模板的槽增加到了
    24 个。MUC-5 在对英文语料评测基础上还加入了对日文的评测。主要针对两类文本进行抽取：微电子技术领域中的芯片技术进展情况和金融领域中的公司合资情况。MUC
    系列会议一共举办了七次，在 1999 年时，由于资金问题，MUC 会议停办。


    # （2）TDT 评测会议


    1997 年，DARPA 以及 NIST 资助并主持了另外一个评测会议——话题识别与跟踪（Topic Detection and Tracking, TDT）[29]。TDT
    旨在以事件的形式组织新闻事件，对其进行研究和评测[28]。


    话题（topic）是 TDT 中的最基本的概念，一个话题是指由某种原因引起的，发生在特定时间点或者时间段，在某个地域范围内，并可能导致某些必然结果的一个事件。起初话题与事件具有相同的含义，后来话题的含义演变为包括一个核心事件以及与之直接相关的事件的集合。TDT
    主要包括五个子任务[274]：


    +   ① 新闻报道切分（story segmentation）

    +   ② 新事件识别（new event detection/fist story detection）

    +   ③ 报道关系识别（story link detection）

    +   ④ 话题识别（topic detection）

    +   ⑤ 话题跟踪（topic tracking）


    上述五个子任务都和事件抽取的研究息息相关。新事件识别就是从给定的大量文档中识别出首次报道或者以前没有识别出来的事件。对新闻报道的切分就是将大量的文档聚类成不同的类别，这其中涉及新事件识别、历史事件识别和报道关系识别。多个相关的事件就会形成话题。


    1998 年举行了首届 TDT，主要是针对中文和英文两种语料进行评测，评测任务有：新闻报道切分、话题识别和话题追踪，主要评价指标是错误识别代价，以后历届 TDT
    评测会议均采用这个指标进行评价。1999 年举行的第二届 TDT 相较于第一届 TDT 增加了新事件识别和报道关系识别两个子任务。随后'
