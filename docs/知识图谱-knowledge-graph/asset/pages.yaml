  md: "值的原子命题，并可以通过与 (∧)、或 (∨)、非 (¬)、蕴含 (⇒)、当且仅当 (⇔) 等逻辑连接符将多个原子命题组合成复合命题，而推理过程则根据逻辑连接词的真值表进行自动推导。一阶谓词逻辑又简称为一阶逻辑\
    \ (first-order logic)，它在命题逻辑基础上引入了全称量词 (∀) 和存在量词 (∃)，这使得一阶逻辑可以量化实体和概念。但是，一阶逻辑不能量化谓词或集合，而这些可以在高阶逻辑\
    \ (higher-order logic) 中得以实现。二阶逻辑可以量化集合，三阶逻辑可以量化集合的集合，依此类推。\n\n我们首先从最简单的命题逻辑开始，逐步介绍如何使用逻辑表示知识。命题逻辑的基础就是上面介绍过的五种逻辑连接词，它们可以将一些原子命题组合成现实中的复杂知识。为了避免运算的歧义，命题逻辑还定义了不同连接词和操作符的优先级关系，例如非\
    \ (¬) 具有最高优先级，因此 ¬A ∧ B 表示的含义是 (¬A) ∧ B 而不是 ¬(A ∧ B)。\n\n以下是使用命题逻辑来记录一个简单的分类知识。\n\
    \n+   - 如果鲸目中的一类背部有背鳍，那么它是海豚科。  \n+     $X_1 = $ 鲸鱼有背鳍      $X_2 = $ 这种鲸鱼属于海豚科\
    \  \n+     $Z_1 = (X_1 \\Rightarrow X_2)$\n+   - 虎鲸的背部有背鳍，那么虎鲸是海豚的一种。  \n+   \
    \  $Y_1 = $ 虎鲸有背鳍      $Y_2 = $ 虎鲸是一种海豚  \n+     $Z_2 = (Y_1 \\Rightarrow Y_2)$\n\
    \n命题逻辑把每一个命题看成是一个二值的逻辑变量，具有真 (true) 和假 (false) 两种可能。在经典的逻辑学中，一个命题要么是真要么是假，不会存在中间状态，但在概率逻辑中，会对这种假设进行松弛，使命题可以以不同的概率处于真和假之间的状态。逻辑连接符根据真值表运算组合命题的真假值，如表\
    \ 2.1 所示。\n\n表 2.1 命题逻辑关系真值表\n\n| X | Y | ¬X | X ∧ Y | X ∨ Y | X ⇒ Y | X ⇔ Y |\n\
    |---|---|----|-------|-------|-------|-------|\n| true | true | false | true |\
    \ true | true | true |\n| false | true | true | false | true | true | false |\n\
    | true | false | false | false | true | false | false |\n| false | false | true\
    \ | false | false | true | true |"
