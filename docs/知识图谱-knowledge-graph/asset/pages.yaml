  md: '到达站：上海


    类型：高铁


    自然语言理解模块如何把输入的文本数据转换成上述语义信息呢？这不是一个简单的任务，语言理解中的多种难点问题都体现在该任务中。首先，因为同样的意思有很多种不同的表达方式，对机器而言，理解每句话表达的意思不是简单的任务。例如，下面的三个问法都表示同样的意图，都表示想订购一张从北京到上海的高铁火车票。


    +   - Q1：从北京到上海的高铁有哪些？

    +   - Q2：可以帮我订购一张北京出发到上海的火车票吗？

    +   - Q3：我想要一张到上海的票。


    其次，自然语言的表示常常存在不确定性，相同语言表达在不同语境下的语义可能完全不同。最后，在自然语言中往往存在不规范、不流畅、重复、指代甚至是错误等情况。这些问题都给自然语言理解任务带来了很大的困难。目前，对话系统还难以解决上述所有问题。


    一些对话系统用模板的方式进行自然语言理解，抽取出其中的“槽”和对应的“值”。例如，可以通过设计如下模板理解用户意图：


    +   - P1：从＜出发站＞到＜到达站＞的＜类型＞有哪些？

    +   - P2：可以帮我订购一张＜出发站＞出发到＜到达站＞的火车票吗？

    +   - P3：我想要一张到＜到达站＞的票。


    其中，＜出发站＞、＜到达站＞、＜类型＞分别表示模板对应知识图谱中“槽”的信息。这种方法的好处是非常灵活，也容易实现，人们可以根据任务定义各种各样的模板。当然该方法的缺点也非常明显，就是复杂场景下需要很多模板，而这些模板几乎无法穷举。因此，基于模板的自然语言理解只适合相对简单的场景，方便快速地开发一个简单可用的语义理解模块。


    上述方法使用的是规则和模板，不能从历史数据中自动学习理解模型。目前，很多方法都是使用数据驱动的统计模型识别对话中的意图和抽取对话中的意图项（槽值抽取和填充）。对话意图识别可以描述为一个分类问题，通过从输入查询中提取的文本特征进行意图分类。槽值抽取可以描述为一个序列标注问题，通过对每个输入词的标注和分类找出各个槽对应的值。


    # 10.3.2.2 对话管理


    对话管理是对话系统中最重要的组成部分，也是体现其区别于问答系统的核心步骤。对话管理用于控制对话的框架和结构，维护对话状态，通过与任务管理器的交互生成相应的动作。目前常用的对话管理技术包括：基于有限状态'
