  md: '满足系统约定的“框架”约束下运用才能体现为“知识”，其中框架（Schema，或称“元知识”）就是对知识的描述和定义，知识框架和实例数据共同构成一个完整的知识系统。总之，在约定的框架下，对数据进行结构化，并与已有结构化数据进行关联，就形成了知识图谱。为了将其付诸实现，知识图谱往往需要将自身的框架结构映射到某种数据库系统所支持的框架定义上，必要时可以对数据库进行专门扩展。所以，知识是认知，图谱是载体，数据库是实现，知识图谱就是在数据库系统上利用图谱这种抽象载体表示知识这种认知内容。


    具体地，知识图谱以结构化三元组的形式存储现实世界中的实体以及实体之间的关系，表示为 G = (E, R, S)，其中 E = {e1, e2, …, e|E|}
    ① 表示实体集合，R = {r1, r2, …, r|R|} 表示关系集合，S ⊆ R × E × E 表示知识图谱中三元组的集合。三元组通常描述了一个特定领域中的事实，由头实体、尾实体和描述这两个实体之间的关系组成。例如被谷歌收购的知识图谱系统
    Freebase [资源 1-3] [61] 中的三元组 “/people/person/nationality (Jorge Amado, Brazil)”，它表示
    “Jorge Amado” 的国籍是 “Brazil”，其中 “Jorge Amado” 是头实体，“Brazil” 是尾实体，“/people/person/nationality”
    是关系名称。其中，有些 “关系” 也称为 “属性”，相应地，尾实体被称为属性值（属性值可以是实体对象，也可以是数字、日期、字符串等文字型对象，甚至可以是音频、视频等对象）。从图结构的角度看，实体是知识图谱中的节点，关系是连接两个节点的有向边，图
    1.1 展示了一个知识图谱的例子。目前，已知且公开的大规模知识图谱主要包括 Freebase，Wikidata [资源 1-4]，DBpedia [资源 1-5]
    [55]，YAGO [资源 1-6] [449]，NELL [78] 和 Knowledge Vault [133] 等。尽管目前大部分知识图谱都以三元组的形式表示各种类型的知识，但是实际上知识图谱的知识表示绝不仅仅体现在以二元关系为基础的三元组上，还体现在实体、类别、属性、关系等多颗粒度、多层次语义单元的关联之中，它以一种统一的方式体现知识定义（Schema）和知识实例（Instance）两个层次共同构成的知识系统。


    尽管上述定义较为被大众所接受，但是，知识图谱应该包含哪些知识目前还没有统一定论。从知识工程角度，知识框架一般包含三个层次的知识：① 概念知识：给出了知识的最基本内容；②
    事实知识：建立了概念之间的联系；③ 规则知识：建立了事实间的联系。对于知识图谱应不应该包含推理规则型的知识，不同领域的人有着完全不同的意见。有一些人认为，知识图谱仅仅是人工智能任务的重要基础设施，不应该包含推理等知识图谱的应用部分。他们认为：推


    +   - [资源1-3] Freebase

    +   - [资源1-4] Wikidata

    +   - [资源1-5] DBPedia

    +   - [资源1-6] YAGO'
