- pgno: 185
  md: '# 8.1.2.2 常用图数据库介绍


    图数据库的理论基础是图论，通过节点、边和属性对数据进行表示和存储。具体来说，图数据库基于有向图，其中，节点、边、属性是图数据库的核心概念。


    +   - **节点**：节点用于表示实体、事件等对象，可以类比于关系数据库中的记录或数据表中的行数据。例如人物、地点、电影等都可以作为图中的节点。\n-
    **边**：边是指图中连接节点的有向线条，用于表示不同节点之间的关系。例如人物节点之间的夫妻关系、同事关系等都可以作为图中的边。\n- **属性**：属性用于描述节点或者边的特性。例如人物（节点）的姓名、夫妻关系（边）的起止时间等都是属性。


    常见的图数据库存储系统有 Neo4j^[224]^、OrientDB^[303]^、InfoGrid^[436]^、HyperGraphDB^[437]^、InfiniteGraph^[225]^
    等，下面分别对其作简要介绍。


    +   - **Neo4j**：Neo4j 是一个开源的图数据库系统，它将结构化的数据存储在图上而不是表中。Neo4j 基于 Java 实现，它是一个具备完全事务特性的高性能数据库，具有成熟数据库的所有特性。Neo4j
    是一个本地数据库（又称基于文件的数据库）；这意味着不需要启动数据库服务器，应用程序不用通过网络访问数据库服务，而是直接在本地对其进行操作，因此访问速度快。因其开源、高性能、轻量级等优势，Neo4j
    受到越来越多的关注。\n- **OrientDB**：OrientDB 是一个开源文档-图数据库系统，兼具图数据库对数据强大的表示及组织能力以及文档数据库的灵活性和很好的可扩展性。OrientDB
    具有多种模式可选，包括全模式、无模式和混合模式。全模式要求数据库中的所有类别都必须有严格的模式，所有字段都强制约束；无模式则相反，不需要为类别定义模式，存储的数据记录可以有任意字段；混合模式则允许为类别定义若干字段，同时支持自定义字段。该数据库同样是本地的，支持许多数据库的高级特性，如事务、快速索引、SQL
    查询等。\n- **InfoGrid**：InfoGrid 是一个开源的互联网图数据库，提供了很多额外的组件，可以很方便地构建基于图结构的网络应用。InfoGrid
    实际上是一个基于 Java 语言的开源项目集，其中 InfoGrid 图数据库项目是其核心，其他的项目包括 InfoGrid 存储项目、InfoGrid 用户接口项目等。\n-
    **HyperGraphDB**：HyperGraphDB 同样是开源的存储系统，并依托于 BerkeleyDB 数据库。和上述图数据库相比，HyperGraphDB
    最大的特点在于“HyperGraph”，此处可以翻译为“超图”。从数学角度讲，有向图的一条边只能指向一个节点，而超图则可以指向多个节点。实际上，HyperGraphDB
    在超图的基础上更进一步，不仅允许一条边指向多个节点，还允许其指向其他边。如'
