- pgno: 130
  md: '度。例如，为了确定“美国媒体断言姚明必与休城续约，但是他很忠诚，只希望留在火箭”中指称项“火箭”的目标实体，主题一致性模型首先识别出上下文中包含的实体集
    {姚明、休城、美国媒体}，同时从指称项词典中获取“火箭”的目标实体为 {休斯敦火箭队，航天火箭}，考虑到“休斯敦火箭队”与上下文实体姚明、休城的一致性更高，实体链接系统最后将“火箭”指称项链接到实体“休斯敦火箭队”上。主题一致性模型通过利用主题一致性识别出一个实体指称项的目标实体：选择一个与指称项上下文中的实体具有最高一致性打分的实体作为指称项的目标实体。在计算一致性打分时，通常需要考虑如下两个因素：


    （1）上下文实体的重要性：在实体指称项上下文实体中，并不是所有的实体都提供了相同的上下文信息。其中有些实体提供了很少的上下文信息，如新闻报道中经常出现的实体
    sina、sohu 等媒体。由于这些实体在许多文档中都会出现，它们往往比其他的实体提供了更少的信息；另外一些实体只在与其主题相关的文档中出现，也就提供了更多的关于文档主题的信息，如上文中的实体姚明和休城。传统方法使用实体与文本内其他实体的语义关联的平均值作为其重要程度的打分：


    $$w(e, o)=\frac{\sum_{e_i\in O} sr(e, e_i)}{|O|}\tag{5.7}$$


    其中，O 是实体指称项上下文中所有实体的集合，sr(e, e_i) 是实体 e 和实体 e_i 之间的语义关联值，通常基于知识资源计算。


    （2）如何计算一致性：给定上下文中实体集合，如何计算目标实体与实体指称项上下文的一致性也是一个重要研究问题。目前，大部分计算方法使用目标实体与上下文中其他实体的加权语义关联平均作为其一致性打分，即：


    $$Coherence(e, o)=\frac{\sum_{e_i\in O} w(e, o)sr(e, e_i)}{\sum_{e_i\in O} w(e,
    o)}\tag{5.8}$$


    其中，o 是实体指称项，w(e, o) 是实体 e 的权重，而 sr(e, e_i) 是实体之间的语义关联度。


    # 3. 协同实体链接


    上述向量空间模型和主题一致性模型都只能处理单个实体指称项的链接问题，而忽略了单篇文档内所有实体指称项的目标实体之间的关系。考虑到文档的主题一致性，一篇文本内的所有实体指称项的目标实体也应该是相互关联的。'
  merge: -1
  img_proc: true
- pgno: 131
  md: "因此，对单篇文档内所有实体指称项进行协同链接有助于提升实体链接的性能。\n\nKulkarni 等[254] 提出了一种协同实体链接的方法，它把单篇文档的协同实体链接看成是一个优化任务，其优化任务的目标函数由如下公式决定：\n\
    \n$$\\frac{1}{\binom{|S_o|}{2}} \\sum_{s \neq s' \\in S_o} r(y_s, y_{s'}) + \\\
    frac{1}{|S_o|} w^T f_s(y_s) \tag{5.9}$$\n\n其中 y_s 指的是实体指称项 s 的目标实体，S_o 是单篇文档内所有实体指称项的集合，r(y_s,\
    \ y_{s'}) 是目标实体之间的语义关联，f_s(y_s) 是实体指称项 s 与其目标实体 y_s 的一致性打分。\n\n从上面的公式中可以看出，第一部分对单篇文档内所有实体指称项的目标实体之间的关系进行建模，第二部分对单篇文档内实体指称项与其目标实体之间的一致性进行建模。通过在优化任务的目标函数中同时考虑指称项目标实体之间的关系以及实体指称项与目标实体的一致性，协同实体链接能够获得更加准确的实体链接结果。Han\
    \ 等[192] 在 2011 年提出采用图的方法实现协同的实体链接，该方法可以全局考虑目标实体之间的语义关系。首先通过传统 VSM 模型得到指称项与实体之间的关系，然后再利用目标实体之间的链接关系计算实体之间的语义相关度，进而构建图，然后利用图算法实现实体协同链接。但是，协同实体链接方法的最大问题在于其算法的复杂度：寻找上述目标函数的最优解是一个\
    \ NP 问题，目前只能通过近似算法来求解。如何在高性能和高准确率之间寻找一个平衡的优化算法，也是一个值得研究的问题。\n\n# 4. 基于神经网络的实体消歧方法\n\
    \n无论是基于聚类的实体消歧方法还是基于实体链接的实体消歧方法，计算实体与实体、实体与文本、文本与文本之间的相似度都是核心问题。传统的计算方法主要是利用自然语言处理工具来抽取词性、依存句法等特征，尽管这些方法取得了不错的性能，但是特征可扩展性差，表示能力不足，容易造成误差传递。近年来很多工作利用深度学习的方法缓解上述问题，进一步提升实体消歧的性能。2013\
    \ 年，He 等[204] 首先将神经网络应用到实体消歧上，他们将整个文档作为输入，并利用层叠降噪自动编码器通过预训练得到文档和实体的初始语义表示，然后通过有监督的消歧语料进行网络参数和文档与实体表示的微调，进而完成实体消歧。Sun\
    \ 等[451] 在 2015 年提出利用卷积神经网络生成指称项、实体和实体上下文语义表示的方法，在文本表示时词向量拼接了位置特征，并且在语义合成阶段使用了一种神经张量网络，进而完成实体消歧的任务。Severyn\
    \ 等[423] 同样提出利用深度学习的模型进行实体消歧，他们在利用卷积网络建模句"
  merge: -1
  img_proc: true
