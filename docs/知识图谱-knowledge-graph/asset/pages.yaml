    数是 0，两个实体不属于同一个名词短语、动词短语或者介词短语。


    +   - 依存特征：实体“Jobs”依赖的单词“co-founder”的词性是 NN；实体“Apple”依赖单词“of”，其依赖单词“of”的词性为 IN。

    +   - 句法树特征：NNP-NP-S-VP-NP-PP-NP-NNP。


    在提取包含两个给定实体的文本特征以后，将它们传递给分类器进行关系分类即可。然而，就句法树特征而言，不同句子所产生的句法树以及不同词在不同上下文环境中的句法关系都不尽相同，所以这类特征的特征空间特别巨大，从而容易产生特征稀疏的问题。因此，后续很多工作尝试利用句法树核等方法解决这一问题。


    # 2. 基于核函数的方法


    不同于基于特征的方法，基于核函数的方法不需要构造固有的特征向量空间，能很好地弥补基于特征向量方法的不足。在关系抽取中，基于核函数的方法直接以结构树为处理对象，在计算关系之间距离的时候不再使用特征向量的内积而是用核函数。核函数可以在高维的特征空间中隐式地计算对象之间的距离，不用枚举所有的特征也可以计算向量的点积，表示实体关系很灵活，可以方便地利用多种不同的特征，使用支持核函数的分类器进行关系抽取。


    基于核函数的关系抽取最早由 Zelenko 等 [518] 提出，他们在文本的浅层句法树的基础上定义了树核函数，并设计了一个计算树核函数相似度的动态规划算'
  merge: -1
  img_proc: true
- pgno: 143
  md: '法，然后通过支持向量机（SVM）和表决感知器（Voted Perceptron）等[183]分类算法来抽取实体间语义关系，在200篇来自新闻机构（如美联社、华尔街日报等）的文本语料库中进行了两个简单任务的测试，取得了不错的结果。Culotta等[116]提出基于依存树核函数的关系抽取，他们使用一些依存规则（如主语依存于谓语、形容词依存于它所修饰的名词等）将包含实体对的成分句法树转换成依存句法树，并在树节点上依次增加词性、实体类型、词组块、WordNet上位词等特征，最后使用SVM分类器进行关系抽取。Bunescu和Mooney[75]进一步使用最短依存树核函数，该核函数计算在依存树中两个实体之间的最短路径上的相同节点的数目，要求对于具有相同关系的实体对，其对应的最短依存树具有相同的高度且到达根节点的路径相同。最短依存树核函数主要缺点是虽然系统的准确率有一定的提高，但是召回率却较低。为解决最短依存树核函数召回率较低的问题，Bunescu和Mooney[345]又提出基于字符串序列核函数的关系抽取，首先提取出两个实体之间和前后一定数量的单词组成字符串并将其作为关系实例的表达形式，规定子序列中允许包含间隔项，进而实现关系抽取。Zhang等[526]融合卷积树核函数（Convolution
    Tree Kernels, CTK）[101]和线性核函数，综合考虑了影响实体间语义关系的平面特征和结构化特征，利用卷积树核函数来计算包含实体对的句法树之间的相似度，使用线性核函数计算实体属性（如实体类型等）间的相似度。Zhou等[530]提出最短路径包含树核，将语义关系实例表示为上下文相关的最短路径包含树，能根据句法结构动态扩充与上下文相关的谓词部分，并采用上下文相关的核函数计算方法，即在比较子树相似度时也考虑根结点的祖先结点，将该核函数同基于特征的方法结合起来，充分考虑结构化信息和平面特征的互补性。


    # 3. 基于神经网络的方法


    尽管上述基于特征工程和核函数的统计学习方法面对关系抽取任务能够达到一定的效果，但是在模型可扩展性上仍然存在很大的问题，限制了这些方法的应用和推广：①上述人工设计的特征（词汇特征、实体特征、依存句法树特征等）的提取均依赖于自然语言处理工具，同时特征抽取的过程也是一个串联（Pipeline）的过程，前一步自然语言处理的结果作为后一步的输入，例如：在依存句法分析前需要分词、词性识别甚至是实体识别。然而，目前已有的自然语言抽取工具的性能并不是百分之百准确。因此，这些自然语言处理工具容易造成错误累积和传递，使得抽取到的特征不精准。②面对中文、英语等富资源的语种来说，我们可以有丰富的自然语言处理工具用以抽取特征。然而，面对一些小语种，特别是那些资源贫瘠的语种，当没有可用的自然语言处理工具时，就不能运用上述基于特征工程的关系抽取方法。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '因此，我们是否可以不依赖于自然语言抽取工具，而是直接从输入的文本中自动学习有效的特征表示？随着深度学习方法的兴起，越来越多的研究者开始利用神经网络方法（例如：卷积神经网络、循环神经网络等）进行文本特征的学习，并逐步将其应用到关系抽取任务中来。该类方法主要包括如下几个步骤：①
    特征表示：主要是将纯文本的特征表示为分布式特征信息，例如：将词表示为词向量。② 神经网络的构建与高层特征学习：主要是设计搭建神经网络模型并利用其将上一步得到的基本特征自动表示为高层特征。③
    模型训练：利用标注数据，优化网络参数，训练网络模型。④ 模型分类：利用训练的模型对新样本进行分类，进而完成关系抽取。下面以 Zeng 等[521] 在 2014
    年提出的基于卷积神经网络的关系抽取为例进行介绍。该模型主要包括 3 个部分：词表示（Word Representation）、特征抽取（Feature Extraction）和输出（Output）。整个模型的输入是一个句子以及给定的两个词（通常为名词、名词短语或实体），输出是这两个词在该句子中所属的预定义的语义关系类别。


    首先，输入的句子通过词向量表示，转化为向量的形式输入网络。然后，特征抽取部分进一步提取词汇级别特征和句子级别特征，接下来将这两种特征拼接起来作为最终的特征进行关系分类。词汇级别特征的抽取是将句子中某些词向量挑选出来，并将挑选出的向量拼接起来作为这部分特征抽取的结果。句子级别特征是对整个句子学习出一个向量表示，由于语言表达多样，不同的句子个数理论上是无限的，这样就不能像学习词向量一样，以句子为处理对象，通过统计句子的频率、共现等信息学习出句子的向量表示。然而，一句话的语义通常是由组成这句话的词的含义和这些词的组合方式决定。因此，Zeng
    等[521] 使用卷积神经网络学习句子语义的组合规律和方式，在以词向量作为输入的基础上，将句子中包含的词向量组合起来，进而得到句子级别特征表示。相对于传统特征表示方法，其优点是不再依赖于传统的自然语言处理工具（POS，NER
    等），完全通过卷积网络直接从具有冗余信息的词向量中自动学习、挑选出有用特征信息，进而学习得到高质量的特征。下面对该方法进行详细介绍：


    # （1）词向量输入


    由于自然语言的句子是基于符号表示的，而神经网络内部的运算是基于分布式表示的。因此需要在网络输入端，通过查询词向量（Word Embeddings）表，将句子中的每个词都使用词向量进行表示。众所周知，词向量基于分布式表示（Distributed
    Representatioin）[207]，根据词频、词的共现和搭配等语言知识，将文本中的词表示为低维空间中的稠密向量。词向量中每一个维度都表示某种隐式的语义[466]，当词映射到向量空间以后，词就是向量空间中的一个点，词与词之间的关系可以通过点与点之间的关系反映出来，例如近义词之间的欧'
  merge: -1
  img_proc: true
- pgno: 145
  md: '氏距离很小等。其优点在于，词的向量化表示既能以连续的方式表达离散的变量，又能够保持原词的语言属性，可以使用机器学习算法在海量自然标注文本数据中自动学习。当前主要的词向量模型有语言模型[48]、SENNA
    模型[103]、RNNLM 模型[332, 334] 和 Word2vec 模型 [资源 6-5] [333] 等。在 Zeng 等人 [521] 的方法中，使用
    Word2vec 预训练词向量。


    ![](img/9549a57f481f525254296dec39e94079_145_0.png)


    # （2）词汇级别特征


    首先介绍词汇级别特征抽取。对于关系抽取任务，词汇级别的特征是很重要的，在传统的特征抽取方法中也经常使用。传统方法抽取的词汇特征主要包括词本身、词性以及待分类的两个词之间的词等。在
    Zeng 等人 [521] 的方法中，不使用词、词性以及实体类别标签等作为特征，而是直接使用词向量作为词汇级别特征。词向量的优点在于表示后的向量空间里，如果两个词在句法或语义上相关性越大，那么这两个词在距离上越接近。他们选择给定的两个词及其上下文词语所对应的词向量作为词汇级别特征。主要包括
    5 种类型，如表 6.2 所示。其中，L5 表示待分类的两个词在 WordNet 中的一般语义分类（general semantic taxonomy），实验时使用
    SuperSenseTagger 工具得到，其中包含有 41 个与名词和动词相关的语义类别。


    # 表 6.2 词汇级别特征


    | 特征 | 备注 |

    |------|------|

    | L1 | 词 1 对应的词向量 |

    | L2 | 词 2 对应的词向量 |

    | L3 | 词 1 左右各一个词对应的词向量 |

    | L4 | 词 2 左右各一个词对应的词向量 |

    | L5 | 词 1 和词 2 在 WordNet 中的一般语义分类 |


    # （3）句子级别特征


    词表示将所有的词都表示为向量形式，这些词向量能很好地捕捉到词的相似度，用法相似且意义相近的词，其词向量间的距离也更近。这种单个词的模型取得了很好的效果（比如：法国
    – 巴黎 = 中国 – 北京），但是它们的局限性在于不能捕捉长距离的句子语义。在关系抽取中，一般根据整个句子的意义来判断两个词间的关系，为捕获这种特征，Zeng
    等人 [521] 提出使用卷积神经网络通过语义组合的方式自动学习句子级别的特征。句子级别特征抽取框图如图 6.3 所示，在输入的词被表示为向量后，系统首先通过开窗处理取得局部特征，然后'
  merge: -1
  img_proc: true
- pgno: 146
  md: '再通过卷积滤波捕获不同的特征，最后对卷积的结果进行非线性变换得到句子级别特征。特别地，为了让网络知道句子中哪两个词需要给定语义关系，Zeng 等使用位置特征对句子中需要给定语义关系的两个词进行建模。位置特征表示当前词到待分类的两个词之间的相对距离。


    ![](img/9549a57f481f525254296dec39e94079_146_0.png)


    图 6.3 句子级别特征抽取框图


    # （4）网络输出


    将词汇级别和句子级别特征拼接起来，可以得到最终的特征向量。为了得到网络的输出，将特征向量输入 Softmax 分类器，模型训练时为了得到最优的模型参数，他们使用随机梯度下降最大化对数似然函数。


    除上述模型以外，Santos 等[410] 在此基础上，为了克服人工标签 “NA” 的问题，提出了基于排序的损失函数。Wang 等[473] 使用两个关注机制（Attention）重点抽取上下文中能够表征关系类别的语义特征，进一步提升了模型的效
    果。除了卷积神经网络，也有工作使用循环神经网络或者递归神经网络进行关系抽取，如文献 [435, 531]。有兴趣的读者可以进一步阅读这些文章。


    # 6.2.2.2 弱监督的关系抽取方法


    传统的有监督关系抽取方法需要依赖人工标注的数据，这限制了该方法的适用领域，使得它难以成为关系抽取的核心方法。实际上，带有标注的文本通常是稀缺的资源，距离监督（Distant
    Supervision）正是在这种背景下提出的方法。当前，在学术界和企业界的共同努力下，已经构建了许多开放可用的知'
  merge: -1
