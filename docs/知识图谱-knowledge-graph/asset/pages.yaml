    ```

    UPDATE 表名 SET 列 1= 值 1, 列 2= 值 2, ... WHERE 条件

    ```


    其中“条件”用于指明需要修改的数据记录。如若不指定条件，会导致整个表的数据都被修改，因此需要特别留意。本例中，只需修改实体名为“费米”的“出生日期”所对应的值对象为“1901-09-29”，SQL
    语句为


