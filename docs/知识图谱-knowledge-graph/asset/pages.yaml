- pgno: 93
  md: '其他方法的预处理步骤，以消除冲突的属性。


    WordNet 是元素级匹配经常使用的语言学资源，为了突破 WordNet 的覆盖度限制，获取更有实用性的语义相似度，还可以引入词的表示学习技术，获得词向量。词向量的优点是，它可以将词表示为低维语义向量空间中的一个点，这样，词与词之间的语义相似度就可以用点之间的距离来衡量。由于获取词向量的语料来源广泛，且可自主选取，因此其覆盖度比
    WordNet 要大得多。和简单的字符表面相似度相比，词向量有更强的捕获词背后的真正语义的能力。另外，与 WordNet 相比，通过训练产生的词向量的覆盖度要大得多。因此，可以把词向量相似度和基于实体间编辑距离相似度结合在一起，用以对齐异构知识库。在公开的知识库对齐数据集（Ontology
    Alignment Evaluation Initiative, OAEI 2013[177]基准数据集和会议数据集）上，通过比较编辑距离相似度、WordNet
    相似度、隐式语义分析（LSA）[140]相似度以及所提出的词向量相似度和混合方法的性能，发现混合方法取得了最好的效果。有兴趣的读者可以参考文献[528]。


    # 2. 结构级匹配


    上述方法在匹配不同框架的元素时仅仅使用了元素的直接信息，实际上，不同元素的匹配之间会相互影响，例如，如果属性的定义域和值域（属性“出生地”的定义域和值域分别为“人”和“地点”）匹配程度高，那么属性的匹配程度也更高。因此，可以利用概念元素之间的关系进行匹配[275]，这类方法的基本思想是：相似的概念具有相似的概念结构。基于结构的匹配技术主要有三种：基于图的技术，基于分类体系的技术以及基于统计分析的技术。


    基于图的技术把将要匹配的本体看作一个已经标记的图结构[219]。基本思想是：对于两个本体中的节点，如果它们的邻居节点是相似的，那么它们也是相似的，反之亦然。基于图的技术是把本体看成多元关系图，其中，图中的节点是实体、边是关系。图中相似元素的发现与解决图的同态问题是类似的，这样就把本体匹配问题转化为发现最大公共子图的问题。完整的图匹配是一个复杂度很高的问题，计算量很大，在真实操作中，一般会用
    EM 算法、Label Propagation 等迭代算法近似求解。


    基于分类体系的技术是通过图的技术的一种扩展，一般情况下，这种技术只关注与匹配一些特殊关系。基于分类体系的主要思想是：如果两个术语连接的是“实例-类型”（is-a）或“子类-父类”（SubClassOf）关系，那么它们是相似的，其邻居结点也存在一定程度的相似关系。本体的结构信息在框架匹配中非常重要，它描述了元素的整体信息。类别体系（或称概念体系）在描述本体时至关重要，框架匹配应用最普遍的领域就是对不同知识图谱的分类体系进行对齐和匹配。'
