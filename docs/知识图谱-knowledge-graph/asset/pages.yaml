    21:     F 加入到候选集合 C_F 中

    22:   else

    23:     递归地修改 F，并将满足条件的 F 加入到集合 C_F 中

    24:   end if

    25: end for

    26: for F ∈ C_F do

    27:   if F 满足公式 8.1 then

