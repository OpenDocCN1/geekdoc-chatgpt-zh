  md: '年提出的模型。Ahn 提出在事件抽取的过程中同时使用 Timbl 和 MegaM 两种模型，并抽取候选词相关的词法特征、上下文特征、实体特征、句法特征和语言学特征（WordNet），进而完成事件抽取的任务，在事件触发词分类和事件元素分类两个阶段都取得了不错的效果。该方法将事件抽取看作一个两阶段的多分类问题，首先对句子中的每个词汇进行判断，判断其是否为事件触发词，如果为事件触发词，则进入第二个阶段事件元素分类，对句子中的每个候选事件元素进行判断，判断其是否是当前触发词触发的事件中包含的事件元素并判断其在当前事件中扮演的角色。下面详细介绍两阶段中该方法中使用的特征。


    # 事件触发词分类阶段的特征：


    +   - (1) 词汇级特征：当前词汇、当前词汇的小写形式、当前词汇的词干、当前词汇的词性标签、当前词汇相邻词的词汇特征（小写形式、词性标签）等。\n-
    (2) 句子级特征：依存路径的关系标签、依存的词汇、候选词在依存树中的深度、依存词汇的词性标签、句子中的相关实体的实体类型、最近距离范围内的实体类型等。\n-
    (3) 外部知识：如果候选词汇在语言学词典 WordNet 中，则将其对应的同义词集合的 ID 作为特征。


    # 事件元素分类阶段的特征：


    在事件元素分类阶段，将一个句子中的所有实体、值和时间表达当作候选事件元素，然后针对相应的事件触发词和这些候选事件元素提取特征，进而完成事件元素分类。主要利用的特征如下：


    +   - (1) 触发词特征：触发词、触发词的小写形式、触发词的词干、触发词的词性标签、触发词在依存树中的深度和触发词相邻词的词汇特征（小写形式、词性标签）等。\n-
    (2) 词汇特征：候选词语、候选词语的中心词、中心词的小写形式、中心词的词性标签、中心词的实体类型、候选词的实体类型等。\n- (3) 句子级特征：候选词和触发词之间的依存路径、候选词和触发词之间的词汇及其词性标签等。


    利用上述提取的特征，可以训练不同的分类模型，进而完成事件触发词分类和事件元素分类，Ahn 利用 Timbl 和 MegaM 两个模型进行了实验，并取得了不错的抽取效果。该类方法关键在于寻找更好的特征和更好的模型。


    Chieu 等[91] 在 2002 年将最大熵分类器应用到事件抽取中，他使用了 Uni-gram、Bigr am、命名实体等简单特征，在卡内基梅隆大学标注的语料上取得了
