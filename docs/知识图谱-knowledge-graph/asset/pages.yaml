    图 8.7 基于图结构的存储模型示例


    基于图结构的存储方法利用有向图对知识图谱的数据进行建模，因此无向关系需要转换为两条对称的有向关系。例如“费米”和“奥本海默”之间具有“搭档”关系，由于该关系是一种无向关系，因此在图中需要标注两条对称的边用于表征二者互为“搭档”关系。如图
    8.7 所示，基于图结构的存储另外一个显著的优点是不仅可以为节点定义属性，还可以为边定义属性。因此，这种存储方式可以细致地刻画实体之间的关系。


    上文介绍了知识图谱基于图结构的存储模型，数据的实际存储需要依赖具体的存储引擎。图数据库系统是实现上述存储方式的典型系统，下面对其作简要介绍。'
