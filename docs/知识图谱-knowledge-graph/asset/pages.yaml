  md: '参加。


    WePS 评测的人物搜索结果聚类任务定义如下：给定一个人名搜索结果（通常为搜索引擎的前 100 个或前 150 个搜索结果中的网页），实体消歧系统对这些网页进行聚类，使得聚类结果中的每一个类别对应到一个单独人物。


    目前，WePS 评测包含有三个不同的数据集。第一届评测的数据集由 49 个人名以及这些人名在搜索引擎中排名前 100 的网页组成。这个数据集一共含有 3489
    篇文档，最终被聚类成 527 个真实世界中的不同实体。第二届评测数据集含有 3432 篇文档，最终被聚类为 559 个真实世界中的不同实体。第三届的评测数据集由
    300 个人名以及关于这些人名在搜索引擎中排名前 200 的网页组成，评测数据一共含有 57 956 篇文档。


    第三届的 WePS 评测在传统人名消歧任务的基础上增加了一个任务，机构名消歧。给定 100 个公司的名称，组织者通过在 Twitter 中搜索包含该公司名的
    100 个 Twitter 作为测试数据。给定一个公司的名称，以及这个公司的主页地址 URL，参赛者的任务是需要判断出该 Twitter 中所指的公司是否为
    URL 中所指的公司。该任务与人名消歧任务相比，不需要对含有公司名的 Twitter 进行聚类，仅仅需要判断 Twitter 中的实体与 URL 中的实体是否为同一个。但是，由于产生该数据集的方法是搜索含有相同公司名的
    Twitter，该数据集所考虑的实体歧义问题只有一词多义问题，忽略了一义多词问题。


    WePS 的评测指标主要有 Purity（纯净度）、Inverse Purity（倒纯净度）和 F 值。假设 C = C1, C2, …, Cn 表示命名实体消歧系统生成的聚类结果，
    L = L1, L2, …, Lm 表示准确的聚类结果，则纯净度、倒纯净度和 F 值计算方式如下。


    Purity: 纯净度，主要用于评测聚类结果中每个类别的所有指称项是否都指向同一个实体，其计算公式为聚类结果类别的最大聚类准确率的加权平均


    Purity = Σ_i (|C_i| / n) max Precision(C_i, L_j)  (5.2)


    其中，单个聚类的准确率定义如下


    Precision(C_i, L_j) = |C_i ∩ L_j| / C_i  (5.3)


    Inverse Purity: 聚类的倒纯净度，主要用于评测聚类结果中的每个类别是否召回了足够多该类别下实体的指称项。其计算公式如下


    InversePurity = Σ_i (|L_i| / n) max_j Precision(L_i, C_j)  (5.4)'
