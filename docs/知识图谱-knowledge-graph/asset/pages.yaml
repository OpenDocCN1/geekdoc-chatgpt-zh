- pgno: 94
  md: '基于统计分析的技术基于已有部分样本挖掘其中蕴含的规律，并根据这些规律对概念、属性、实例、关系等对象进行分组，进而计算它们之间的距离。典型的技术有：形式概念分析、基于距离的分类、相关性分析以及频度分布[1]。


    # 3.2.2 实体对齐


    知识库对齐的目标是能够链接多个异构知识库，并从顶层创建一个大规模的统一的知识库，从而帮助机器理解底层数据[1]。通过对齐描述相同概念的实例，知识库之间的知识得以共享，也为人们利用多个知识库的资源带来了极大的方便。实体对齐也称为实体匹配，是判断相同或不同知识库中的两个实体是否表示同一物理对象的过程。例如，通过判断互动百科中的实体“刘洋（航天员）”和百度百科中的实体“刘洋（中国首位女航天员）”描述同一对象，对齐这两个实体。实体对齐在数据库、自然语言处理和语义
    Web 领域都有对应的任务，它们在数据集集成和知识融合中发挥着重要作用。


    实体对齐可分为成对实体对齐和协同实体对齐两类不同的算法。成对实体对齐表示独立地判断两实体是否对应同一物理对象，通过匹配实体属性等特征判断它们的对齐程度[152,
    356]。协同实体对齐认为不同实体间的对齐是相互影响的，通过协调不同对象间的匹配情况得以达到一个全局最优的对齐结果[53, 135]。


    最近，基于表示学习的方法被用于知识对齐[195]，通过知识库联合表示学习，将多个知识库表示在同一个语义向量空间中，把知识库实体对齐的过程转化为两个知识库中的实体相似度计算问题。借鉴知识库向量化的思想，通过基于知识资源的语义向量间的数值运算，获取两个知识库中资源的对应关系。但是，知识库向量化的模型通常都是针对单一知识库的，如果简单地把这种方法用在两个知识库上，这两个知识库的资源就会被表示在两个独立的向量空间上，无法直接用来做计算。为了将这两个知识库表示在同一个向量空间中，需要利用种子对齐，训练时在目标函数中加入约束，让这些种子对齐中的资源尽可能有相同的向量表示。这样，这些种子对齐就成为了连接两个知识库的桥梁，对于这些种子实体来说，两个知识库的结构信息都能对其表示产生影响，然后和这些种子实体有关的知识库资源表示也会受到影响。所以，利用这种方式学习得到的知识库向量就不再是独立的两个空间上的表示，而是在一个向量空间中的统一表示。


    在知识库向量化之后，将两个知识库中在统一向量空间中相近的实体视为相同实体，成为一个对齐，这种对齐方法被称为基于知识库向量联合学习的对齐方法。这种方法的优点是，不需要依赖任何人工设定的规则和特征，也无需'
