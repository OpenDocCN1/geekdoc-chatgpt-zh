    # 4.2 细粒度实体识别


    # 4.2.1 任务概述


    上面的章节已经介绍了抽取传统的三大类或者七小类命名实体的方法。但是传统的三大类、七小类远远不能满足应用需求。在知识图谱构建和很多自然语言处理任务中，细粒度的实体类别包含了更多的知识，有助于相应任务性能的提升。例如，产品名（如：华为
    Mate10）、会议名（如：“一带一路”国际合作高峰论坛）、疾病名（如：非典型肺炎）、赛事名（如：2018 年世界杯）等在商务、新闻、医疗和体育领域的各种应用任务中非常重要。因此，一些工作在传统的大类别命名实体之外，研究更加细粒度的实体类别。例如：人可以细分为艺人、运动员、教师、工程师等，艺人又可以分为相声演员、影视演员、歌手、主持人等。


    +   1. 典型的细粒度实体类别分类


    一些比较有代表性的细粒度实体类别体系如下：在自动内容抽取会议（Automatic Content Extraction，ACE）上，实体分为 7 大类（人名、地名、机构名、武器、交通工具、行政区、设备设施）和
    45 个小类。Sekine 和 Nobata 提出了 4 个级别共计 200 个小类别[418]。Lee 等提出了一个大约 150 个小类别的实体分类体系[265]。Ndae...
    Ling 和 Weld 则构建了一个具有 112 个类别的细粒度命名实体体系[293]。Yosef 构建了一个具有 5 大类、505 个小类的实体类别体系[512]。由卡内基梅隆大学开发的
    NELL 系统中有几百个人工预先定义好的实体类别[79]。Freebase 中的实体类别达到上千种，而且是动态增加的[61]。


    +   2. 细粒度实体类别的特点


    相较于传统的实体类型，细粒度实体类型的特点如下：


    （1）类别更多: 相较于传统的三大类或者七小类，细粒度实体类型更多，比如可能的类别包括：动物、植物、会议、赛事、药品、疾病和菜品等。而且随着时间的推移和社会的发展，经常会出现一些新的类别。


    （2）类别具有层次结构: 例如传统的机构名可以进一步细分为：学校、公'
