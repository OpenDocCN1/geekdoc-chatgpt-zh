- pgno: 224
  md: '# 9.4.2 基于能量函数的方法


    与张量分解方法不同，这种能量函数的目标并不是恢复出原始的关系矩阵和张量，而是根据任务的不同，自定义能量函数（或称为目标函数、损失函数），使得成立的事实三元组能量低，不成立的能量高，并通过能量函数的计算结果对事实是否成立进行推理。在学习中，最常见的方法是基于间隔的排序损失（margin-based
    pairwise ranking loss）。例如，在知识图谱的链接预测任务中，这类方法会自定义一个能量函数 f，并以此为每一个三元组 r(h,t) 计算一个能量得分
    f_{r(h,t)}，并认为存在于知识图谱中的三元组的得分应该高于不在知识图谱中的三元组，且至少高出间隔 γ 那么多，因此这种基于间隔的排序损失可以表示成如下的形式：


    ℒ = Σ_{r(h,t)∈KB} Σ_{r(h'',t'')∈KB''_{r(h,t)}} [f_{r(h'',t'')} + γ − f_{r(h,t)}]_+   (9.13)


    这一类方法的出发点与矩阵分解不同，它是期望在三元组的相似度得分下，寻求知识图谱中各个元素的关系。其中基于翻译的嵌入学习模型（TransE，也可称为基于平移的嵌入学习模型）是这一类方法的典型。TransE
    的思想来源于基于神经网络的词表示学习方法，特别是 word2vec 工具中使用的几种方法。word2vec 能够学习到具有以下线性关系的词表示，比如


    vec（‘巴黎’）-vec（‘法国’）≈ vec（‘罗马’）-vec（‘意大利’）

    vec（‘男人’）-vec（‘国王’）≈ vec（‘女人’）-vec（‘女王’）


    也就是说具有相同关系（上面的例子分别隐式地蕴涵了“首都”和“特例”的关系）的词向量之差比较接近。TransE 对这种关系进行了显式的建模，该方法把关系表示为从实体
    h 到实体 t 的翻译向量（或平移向量），基本假设是成立的事实三元组 (h,r,t) 应该满足等式 h + r = t。因此上面的例子可以改写成如下的形式：


    vec（‘法国’）+vec（‘首都’）≈ vec（‘巴黎’）

    vec（‘意大利’）+vec（‘首都’）≈ vec（‘罗马’）

    vec（‘男人’）+vec（‘特例’）≈ vec（‘国王’）

    vec（‘女人’）+vec（‘特例’）≈ vec（‘女王’）


    接下来我们直接给出 TransE 模型的二元组相似度函数：


    S_{r(h,t)} = -||E_h + E_r - E_t||_2^2   (9.14)


    其中 E_h, E_t, E_r 分别为头尾实体和关系的向量表示。TransE 是参数较少也较'
