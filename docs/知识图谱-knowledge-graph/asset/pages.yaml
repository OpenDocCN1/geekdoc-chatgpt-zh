  md: '要了解知识库的命名习惯。这使得这种方法适应性更强，可以容易地迁移到不同语言、不同领域的知识库对齐任务中。


    给定两个知识库，分别用 KB₁ 和 KB₂ 表示。知识库中的事实以三元组的形式表示。(h,r,t) 就是一个三元组，这里 h ∈ E 是头实体（E 是实体集合），t
    ∈ E 是尾实体，r ∈ R 是关系（R 是关系集合)。和以前的知识库向量化方法不同，这里提出的模型联合学习两个知识库的向量表示。具体地，首先利用简单的对齐方法，例如字符匹配，来产生初始的种子对齐，这些种子对齐要准确率非常高。如图
    3.9 所示，那些相同颜色的节点表示种子对齐。然后，采用 TransE 的方式，学习两个知识库的对齐。该模型的核心思想是，种子对齐中的两个实体的向量要在训练过程中尽可能相似。


