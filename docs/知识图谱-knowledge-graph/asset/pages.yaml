    # 5.2.3 基于社会化网络的实体指称项相似度计算


    除了实体指称项的上下文特征之外，实体的社会化关系也提供了相当多的 重要信息。例如在图 5.2 中，MJ1, MJ2, MJ3 和 MJ4 是 Michael
    Jordan 的 四个指称项，其他节点都是从 Wikipedia 中抽取出的实体，通过其社会化关系， 可以发现 MJ1 和 MJ2 有更大的概率描述相同的实体，因为它们的社会化关
    系更紧密。与基于表层特征和基于扩展特征的实体指称项相似度计算不同，基 于社会化网络的实体指称项相似度通常使用基于图的算法，能够充分利用社会 化关系的传递性，从而考虑隐藏的关系知识，在某些情况下（特别是结构化数
    据，如论文记录、电影记录等）能够取得更为准确的实体指称项相似度计算结 果。但是，基于社会化网络的相似度度量的缺点在于它只用到上下文中的实体 信息，不能完全利用实体指称项的其他上下文信息，因此通常不能在文本实体
    消歧领域取得有竞争力的性能。以下详细描述基于社会化网络的相似度计算。


