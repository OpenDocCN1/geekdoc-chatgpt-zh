    # 9.3.2.2 不确定性推理：马尔可夫逻辑网和概率软逻辑


    马尔可夫逻辑可以被看成一种通过为逻辑规则绑定权重的方式将一阶逻辑向概率逻辑进行扩展的方法。每个权重的大小反映了对应规则的相对强度或对于推理出假设的重要性。当将马尔可夫逻辑规则的权重调到无限大时，其退化为标准的一阶逻辑。按照
    [396] 中的定义，马尔可夫逻辑网的定义如下：


    定义 1: 马尔可夫逻辑网 L 是一个规则权重对 (f_i, w_i) 的集合，其中 f_i 是一条一阶逻辑中标准的规则，w_i 是一个实数。马尔可夫逻辑网
    L 与一个有限的常量集合 C = {c1, c2, ⋯, c|C|} 一起按照如下的方式定义了一个马尔可夫网 M_{L,C}:


    +   1. M_{L,C} 为每一个可能的原子事实在 L 中都创建了一个二值的节点。若节点的值为 1，这个原子事实是真的；若节点的值为 0，则原子事实是假的。

    +   2. M_{L,C} 为每一个可能的实例化规则 F_i 都在 L 中设计一维特征 f_i。若这一特征值为 1，这条规则 F_i 是真的；若特征值为
    0，则规则 F_i 是假的。特征的权重 w_i 被绑定在 L 中的规则 f_i 上。


    更形式化地，设 X 是所有原子事实的集合，F 是马尔可夫逻辑网中所有一阶逻辑规则的集合，w_i 是绑定在规则 f_i ∈ F 上的权重，G_{f_i} 是所有可能的利用
    X 中的原子事实去实例化 f_i 的集合。在这种马尔可夫逻辑网的定义下，可能世界 x 的概率可以定义为


    P_w(X = x) = 1/Z exp [ Σ_{f_i ∈ F} w_i Σ_{g ∈ G_{f_i}} g(x) ]'
