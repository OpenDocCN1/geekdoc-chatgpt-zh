    近年来，在知识图谱构建和应用的各个环节中，越来越多的任务采用深度神经网络建模，并取得了一定的效果（本书后面章节中介绍的各个任务都有大量的工作采用深度学习方法）。深度学习的本质是通过多层神经网络，自动学习处理对象的抽象表示，以便在具体任务中有更好的性能。而基于神经元的深度学习方法（如图
    1.16 右边所示）把处理对象表示为数值（标量/向量/矩阵），并通过数值计算（如数值相乘、开方、乘以非线性函数等）完成各种语义计算任务。


    虽然深度学习在特定任务上取得显著效果，但是，它也存在不少局限性，并且很多是根本性的问题。首先，当前的深度学习模型需要依赖大量的标注数据①；其次，这种纯粹的数据驱动学习方式不仅结果不可解释而且学习过程也不可调控；最后，端到端的学习过程很难加入先验知识，而大量应用任务中人类的先验知识非常重要。为了模拟人类的认知过程，进行更好的知识抽象和推理，人们定义了符号逻辑对知识进行表示和推理，其中知识图谱是典型代表之一。但是符号逻辑难以从历史数据中习得，目前大都还是采用人工编撰和校验的方式获得符号逻辑推理规则；而且尽管可以利用概率图模型等方法学习有限的知识推理规则，但是受限于模型复杂度还是难以扩展到大规模数据上。


