  md: '总体上看，基于模式匹配的事件抽取方法在特定领域中性能较好。然而，该类方法依赖于文本的具体形式（语言、领域和文档格式等），获取模板的过程费时费力，具有很强的专业性。而且，制定的模式很难覆盖所有的事件类型，当语料发生变化时，需要重新获取模式。


    # 7.2.2 基于机器学习的事件抽取方法


    基于模式匹配的方法可移植性差、召回率低，目前的研究重点逐渐转向基于机器学习的方法。其中最具代表性的是基于有监督学习方法的事件抽取。该类方法将事件抽取建模成一个多分类问题，提取特征向量后再使用有监督的分类器进行事件抽取，例如：支持向量机模型（Support
    Vector Machine, SVM）^[455]^、朴素贝叶斯模型（Naive Bayes Model, NBM）^[317]^、隐马尔可夫模型（Hidden
    Markov Model, HMM）^[141]^、最大熵模型（Maximum Entropy Model, ME）^[393]^、最大熵隐马尔可夫模型（Maximum
    Entropy Hidden Markov Model, MEMM）^[36]^等。根据所需监督数据的不同，基于机器学习的限定域事件抽取方法可以分为两种：①
    有监督事件抽取方法；② 弱监督事件抽取方法。以下分别介绍这两种方法。


    # 7.2.2.1 有监督事件抽取方法


    有监督事件抽取系统一般包括三个步骤：① 训练样本的表示，例如，基于特征向量方法中特征向量的抽取与构建；② 选择分类器并训练模型，优化模型参数；③ 利用训练好的模型从未标注数据中抽取事件实例。其重点在于挑选合适的特征和分类器使得分类结果更加准确。有监督事件抽取可以分为两类，一类是基于特征工程的方法，主要是在不同的分类器模型上尝试不同类别的特征；另一类是基于神经网络的方法，自动从纯文本中提取特征，避免使用传统自然语言处理工具带来的误差积累的问题。


    # 1. 基于特征工程的方法


    基于特征工程的方法特点是需要显式地将事件实例转换成分类器可以接受的特征向量，其研究重点在于怎样提取具有区分性的特征，总结而言，该方法共三个步骤：① 特征提取：提取词汇、句法和语义等特征，然后有效地集成起来，从而产生描述事件实例的各种局部和全局特征。②
    模型训练：利用提取的特征训练分类模型。③ 事件抽取：主要是利用训练好的模型对非结构化文本进行分类，进而完成事件抽取。


    在基于特征工程的事件抽取方法中，最具代表性的方法是 Ahn^[27]^ 在 2006'
