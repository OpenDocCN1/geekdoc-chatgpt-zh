- pgno: 147
  md: '识图谱，这些知识图谱以结构化三元组的形式存储实体和实体之间的关系，距离监督正是利用了这种结构化的数据，让知识图谱自动标注训练样本，由于标注过程不需要人工逐一标注，因此距离监督关系抽取也是弱监督关系抽取的一种。该方法启发式地对齐知识图谱和文本中的实体，然后根据这个对齐学习关系抽取器。该类方法主要基于如下的距离监督假设。


    如果两个实体之间存在某种关系，则所有包含这两个实体的句子都表达了这种关系[399]，这些句子的集合被称为一个“包”。这个假设允许研究者们从所有包含指定实体对的句子中抽取特征进行分类，Mintz
    等[342] 正是采用此方法，将 Freebase 和 Wikipedia 中的实体进行对齐，以 70% 的精度抽取了数以万计的关系实例。然而，Riedel
    等[399] 认为包含两个给定实体对的句子不一定表达了实体间的关系，有可能两个实体出现在同一个句子中只是因为和相同的主题相关，并不是具有所关注的实体关系。就两个具有
    nationality 关系的实体对而言，纽约时报中只有 38% 的句子真实表达了这种关系，Wikipedia 中甚至只有 20% 的句子真实表达了关系。图
    6.4 给出了一组例子，其中句子 S1 到 S4 都包含了实体 “Nevada” 和 “Las Vegas”，但是真实表达了关系 “location/location/contains”
    的句子只有 S1 和 S3，S2 和 S4 尽管也包含了这两个实体，但是并没有反映这种关系。针对这一问题，Riedel 等[399] 提出了 expressed-at-least-once
    假设，他们认为多示例包中可能并不是所有的示例都是有效的，但是至少有一个示例是有效的。尽管在理论上这个假设不一定成立，但是相对 Mintz 等[342] 提出的方法是一个很大的改善。在这个假设的基础上，Riedel
    等[399] 以及 Hoffmann 等[211] 使用概率图模型从包中选择有效的示例并对关系进行预测。Nguyen 和 Moschitti[360] 则利用关系的定义和
    Wikipedia 的文档对他们的系统进行改善。Surdeanu 等[453] 进一步认为，包中的多个示例可能表达了实体之间多个不同的关系，他们不但


