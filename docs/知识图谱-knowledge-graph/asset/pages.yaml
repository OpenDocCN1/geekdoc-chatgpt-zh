    关（(h,r,t) 和 (t,r,h) 的打分函数不一样)。Ji 等人提出了 TransD^{[228]}，通过让转换矩阵由相应的实体和关系共同决定，解决实体和关系多样性的问题。随后，他们又提出了
    SparseTrans^{[229]}，使用稀疏矩阵作为关系的转换矩阵，根据关系的复杂程度（链接头部实体和尾部实体的个数）调整稀疏矩阵的稀疏度，使得不同复杂度的关系由不同自由度的模型进行学习，以此解决数据不均衡问题。


    此外，TransE 模型忽略了关系的相同语义，例如以下的情况，关系“部分”（has part）具有两个潜在的语义：


    +   (1) 组成相关的语义，例如（桌子，部分，桌腿）

    +   (2) 位置相关的语义，例如（大西洋，部分，纽约湾）


    但由于 TransE 等模型采用基于平移的方法，只为同一个关系分配唯一一个平移向量，不能处理关系多语义的问题。对此，Xiao 等人提出贝叶斯非参数无限混合表示模型，利用特定关系的关系分量的混合来进行知识表示，每个分量代表一个特定的潜在语义，这种方法被称为
    TransG^{[199]}。


    自 2013 年 TransE 被提出以来，在这一框架下的方法层出不穷，以上是几个典型的改进算法的介绍，更多的方法在表 9.1 中进行了列举，介绍了这些方法的打分函数
    F_{r(h,t)}，并以模型的参数个数作为模型复杂度。


    除了上述方法，还有一些其他的自定义能量函数的基于表示学习的推理方法: Structured 模型^{[67]} 为每种关系定义两个矩阵 W_{rh} 和 W_{rt},
    打分函数 f_r(h,t) 为 −‖ W_{rh}h − W_{rt}t ‖_1。该模型使用了两个独立的矩阵操作头部实体和尾部实'
