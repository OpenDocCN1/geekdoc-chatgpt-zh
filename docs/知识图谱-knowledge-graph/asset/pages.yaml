  md: '# 5.1.2 任务分类


    按照不同的分类维度，实体消歧系统可以有多种分类方法，按照目标实体列表是否给定，实体消歧系统可以分为基于聚类的消歧系统和基于实体链接的消歧系统；按照实体消歧任务的领域不同，实体消歧系统还可以分为结构化文本实体消歧系统和非结构化文本实体消歧系统。以下首先介绍按第一种分类标准划分的两种消歧系统。


    （1）基于聚类的实体消歧系统。由于目标实体列表没有给定，基于聚类的命名实体消歧系统以聚类方式对实体指称项进行消歧。所有指向同一个目标实体的指称项被消歧系统聚在同一类别下，聚类结果中每一个类别对应一个目标实体。


    （2）基于实体链接的实体消歧系统。基于实体链接的命名实体消歧系统通过将实体指称项与目标实体列表中的对应实体进行链接实现消歧。由于目标实体列表中的实体是无歧义的，链接之后的指称项也就能够自动消除歧义。


    图 5.1 是基于聚类的命名实体消歧系统和基于实体链接的命名实体消歧系统的示例。其中 (a) 部分表示待消歧的实体指称项，(b) 部分表示基于聚类的命名实体消歧系统结果，(c)
    部分表示基于实体链接的命名实体消歧系统结果。


    按照命名实体消歧任务的领域不同，命名实体消歧系统还可以分为结构化文本实体消歧系统和非结构化文本实体消歧系统。这两种实体消歧系统的主要差别在于实体指称项的文本表示：在结构化文本命名实体消歧系统中，每一个实体指称项被表示为一个结构化的文本记录，如
    List 列表、知识库等；而在非结构化文本实体消歧系统中，每一个实体指称项被表示为一段非结构化文本。由于实体指称项表示的不一致，两个领域内消歧系统的技术路线也不一致：结构化文本的命名实体消歧由于缺少上下文，主要依赖于字符串比较和实体关系信息完成消歧；而非结构化文本实体消歧系统有大量上下文辅助消歧，因此主要利用指称项上下文和背景知识完成消歧。目前大多数的研究都集中在非结构化文本实体消歧上，本章首先介绍非结构化文本实体消歧中的两类方法：基于聚类的实体消歧和基于实体链接的实体消歧，然后在最后一个小节介绍结构化文本实体消歧的相关方法。'
