    # 9.3.1.2 归纳逻辑编程


    与频繁子图挖掘方法不同，归纳逻辑编程（ILP）更重视没有出现在知识图谱中的负三元组，它认为正例（E₊）+ 负例（E₋）+ 背景知识（B）⇒ 假设（h）。一个正确的假设
    h 是满足以下要求的命题：


    必要性： B ⊭ E₊

    充分性： B ∧ h ⊨ E₊

    弱一致性： B ∧ h ⊭ false

    强一致性： B ∧ h ∧ E₋ ⊭ false

    (9.3)


    其中，必要性是指在没有引入假设 h 作为约束时，仅使用背景知识 B 不能蕴含出正例 E₊；充分性指背景知识 B 以及假设 h 可以蕴含出正例 E₊，这个性质也就是被频繁子图挖掘方法使用的；弱一致性是指假设
    h 不能与背景知识 B 冲突；而强一致性是指在弱一致性的基础上不能与已出现的负例有冲突，因此在没有负例引入时强弱一致性是相同的。


    基于 ILP 的方法比仅利用图结构信息的频繁子图挖掘更具逻辑性，但也由于需要引入大量的负例而在计算规模上受到了制约，其典型工作有 ALEPH 和 Progol，它们都是典型的
    ILP 系统并使用反向蕴含算法^[347]；Sherloc^[413] 是一个非监督的 ILP 方法，并使用概率图模型在网络文本中进行规则的挖掘；QuickFOIL^[521]
    则基于自顶向下的贪心策略在 ILP 的约束下完成规则挖掘。


    # 9.3.1.3 结构学习方法


    概率逻辑推理模型的结构学习方法是一个统称，是指在一个整体的目标下，通过挑选使整体概率最大的逻辑规则加入到推理模型中。这一过程一般可以分为四个部分：① 定义目标函数；②
    创建逻辑规则结构；③ 搜索逻辑规则的策略；④ 提速方法。


    目标函数的定义取决于使用不同的概率逻辑推理模型，例如马尔可夫逻辑网以最大化世界概率为目标，这种方法一般也会被用于概率图模型的优化中，目标函数如下所示：


    log P_w(X = x) = Σ_{r∈R} c_r Σ_{k=1}^{g_r} log P_w[ X_{x,k} = x_{r,k} | MB_x(X_{r,k})
    ]  (9.4)


    其中 R 是一阶谓词集合，g_r 是一阶谓词 r 的实例计数，X_{r,k} 是第 k 个 r 实例的 0/1 真值，谓词的权重 c_r 由用户自己设置或学习获得。'
