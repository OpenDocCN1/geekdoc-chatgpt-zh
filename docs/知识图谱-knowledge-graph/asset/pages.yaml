  md: '# 8.1.1.3 关系数据库


    关系数据库通过属性对现实世界中的事物进行描述。每个属性的取值范围构成一个集合，称为对应属性的域。在关系数据库中，属性的取值只能是原子数据。所谓原子数据是指不能进一步拆分的数据，例如整数、字符串等；相反地，非原子数据则由多个原子数据构成，可以进一步拆分，例如集合、列表、元组等。关系数据库以二维表对数据进行组织和存储，表的每一列表示一个属性，每一行表示一条记录。每张数据表可以由任意数量的属性组成，这些属性按照各自的特点可以分为如下几类：


    +   - **候选键**：能够唯一标识一条记录的最少的属性集合称为其所在表的候选键。候选键具有如下两个特点：① 唯一性：候选键在整个表的范围内必须具有唯一的值，不同记录不能具有相同的候选键值；②
    最小性：候选键所包括的属性必须都是必不可少的，缺少其中的任何一个都不再具备唯一性。例如学生的学号、身份证号分别都可以作为候选键；但是（学号，身份证号）这一属性组不能作为候选键，因为去掉其中的任何一个属性剩下的属性仍然可以作为候选键，因此不满足最小性。\n-
    **主键**：一个数据表可以包含多个候选键，从中任意选取一个作为主键。虽然理论上所有的字段都可以作为主键，但是实际操作中一般选择单属性组成的候选键作为主键。\n-
    **外键**：如果数据表中的某个属性或属性组是其他表的候选键，那么称该属性或属性组是当前表的外键。外键能够保证不同数据表之间数据的一致性，图 8.6(b)
    中展示的不同表之间的引用就是通过外键实现的。\n- **主属性与非主属性**：包含在任何候选键中的属性称为主属性；相反地，不包含在任何候选键中的属性称为非主属性。


    常见的关系数据库存储系统有 DB2$^{[110]}$、Oracle$^{[112]}$、Microsoft SQL Server$^{[111]}$、PostgreSQL$^{[184]}$、MySQL$^{[32]}$
    等，它们都是比较成熟的系统，有大量公开的技术文档，可以用于知识图谱的存储。下面分别对其做简要介绍：


    +   - **DB2**: DB2 是 IBM 公司于 1983 年推出的数据库管理系统，能够运行于各种不同的操作系统平台上，如 Windows、Linux、VMS、OS/2
    等。该数据库的特色之处包括支持面向对象的编程、支持多媒体应用、支持分布式数据库的访问等。更多信息请参考 DB2 官网。\n- **Oracle**: Oracle
    是甲骨文公司于 1979 年推出的关系数据库管理系统，是目前最流行的数据库之一。该数据库遵循标准 SQL 语言，支持多种数据类型。和 DB2 相同，Oracle
    同样具有跨平台的特点，可以运行于不同的操作系统之'
  merge: -1
  img_proc: true
- pgno: 183
  md: '上。更多信息请参考 Oracle 官网。


    +   - **Microsoft SQL Server**: Microsoft SQL Server 是微软公司推出的应用于 Windows 操作系统的数据库产品，该数据库实际上是微软基于
    Sybase 公司提供的技术开发而成的，因此完全兼容 Sybase 数据库。更多信息请参考 Microsoft SQL Server 官网。\n- **PostgreSQL**:
    PostgreSQL 是一个自由软件系统，和上面几个数据库系统相比，该系统具有开源、免费的特点。由于 PostgreSQL 可以免费使用、修改和分发，因此具有非常完善的功能，不仅支持大部分的
    SQL 标准，还提供外键、复杂查询、触发器等特性。更多信息请参考 PostgreSQL 官网。\n- **MySQL**: MySQL 也是一个自由软件系统，最早是由瑞典的
    MySQL AB 公司开发的小型关系数据库管理系统，在 2008 年被 Sun 公司收购。该系统由于具有体积小、速度快、跨平台、开源等特点，是中小型网站最为青睐的数据库。更多信息请参考
    MySQL 官网。


    关系数据库通过 SQL 语言为用户提供一系列的操作接口，其核心功能包括插入、修改、删除、查询四种操作。其中插入操作在 SQL 语句中对应的关键词是 INSERT，用户通过该语句向数据库中插入新的记录；修改操作的关键词是
    UPDATE，为用户提供修改数据库中指定记录的接口；和插入语句相反，用户通过删除语句从数据库中删除已有记录，其对应的 SQL 关键词为 DELETE；查询功能是数据库中最重要也是最为复杂的操作，为用户提供多种获取数据库中满足给定条件的数据及其统计信息的功能，其对应的关键词为
    SELECT。如果选择关系数据库作为知识图谱的存储引擎，那么对知识图谱的所有操作都需要转换为 SQL 语句才能执行。


    # 8.1.2 基于图结构的存储


    将实体看作节点，关系看作带有标签的边，那么知识图谱的数据很自然地满足图模型结构。因此，基于图结构的存储方式能够直接准确地反映知识图谱的内部结构，有利于对知识的查询。另外，以图的方式对知识进行存储，还可以借鉴图论的相关算法，有利于对知识的深度挖掘及推理。


    # 8.1.2.1 基于图结构的存储模型


    基于图结构的存储模型用节点表示实体，用边表示实体之间的关系[33]。图 8.7 展示了一个基于图结构的存储模型示例。由图可见，节点可以定义属性，用于描述实体的特性。值得注意的是，和基于表结构的存储不同，基于图结构的'
