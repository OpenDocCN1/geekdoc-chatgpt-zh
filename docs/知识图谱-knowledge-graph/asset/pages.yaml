    # 3.2 知识融合


    随着互联网上知识数量的不断增长，多个垂直领域都形成了专业的领域知识库。例如，IMDb 知识库就是电影领域的知识库，MusicBrainz 是音乐领域的知识库。在这些知识库中，包含很多通用知识库没有的专业知识。例如，如图
    3.8 所示（左图为 Wikipedia 页面中的结构化数据，右图为 IMDb 页面的结构化数据），电影 “Mission: Impossible” 在 Wikipedia（DBpedia[267]
    来源于 Wikipedia 的结构化知识）中只有主演信息，而在 IMDb 知识库中，还有饰演角色等信息。只有将这些知识库联合起来应用，才能够满足用户跨领域的信息需求。


    另一方面，从融合的知识图谱类型看，知识融合包括：竖直方向的融合和水平方向的融合。竖直方向的融合是指融合（较）高层通用本体与（较）底层领域本体或实例数据，例如，YAGO
    是融合专家构建的高层语言知识图谱和网民协同构建的实体知识图谱。水平方向的融合是指融合相同层次的知识图谱，实现实例数据的互补，例如，BabelNet 融合不同语言的异构知识图谱，实现跨语'
