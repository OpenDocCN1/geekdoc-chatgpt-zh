    答案“李连杰出生在北京，他现在是一个新加坡公民。”，词语“李连杰”需要从源问句中拷贝得到，实体词“北京”“新加坡”需要从知识库中检索得到，而其他词如“出生”“在”“现在”等需要通过模型预测得到。因此，COREQA
    在标准的序列到序列 (sequence-to-sequence, Seq2Seq) 模型基础上，融合了三种词语（语义单元）获得模式（包括拷贝、检索和预测），用统一的模型对其建模，让各种模式之间相互竞争和影响，最终对复杂问题生成一个最好的自然答案。


    # 10.3.3 通用对话模型


    通用对话系统不针对特定的任务，它以通过图灵测试为主要目标。早期的方法大多基于模板进行对话的分析生成，随着近年来数据资源的丰富和机器学习方法的进步，越来越多的工作自动从数据中学习通用对话模型。


    # 10.3.3.1 基于模板的方法


    早期的对话系统主要是使用关键词和模式匹配的方法，处理和生成的句式都比较简单，也比较固定，能处理的领域有限，不能处理较复杂的对话，对话'
