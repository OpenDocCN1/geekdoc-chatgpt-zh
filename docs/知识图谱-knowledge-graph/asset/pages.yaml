  md: '（1）链接候选过滤（Blocking）：由于一个知识库中通常包含上百万个实体，在实际的实体链接任务中不可能计算一个指称项与所有实体之间进行链接的可能性。因此，实体链接需要首先根据规则或知识过滤掉大部分该指称项不可能指向的实体，仅保留少量链接实体候选。


    （2）实体链接（Linking）：给定指称项及其链接候选，实体链接的第二个步骤是确定该实体指称项最终指向的目标实体。


    目前，大部分实体链接研究的重点在于第二步，即如何根据实体指称项的上下文信息和知识库中实体的信息从链接候选中确定目标实体。


    # 5.3.1 链接候选过滤方法


    目前还缺少对链接候选过滤方法的系统化研究和量化分析，大部分工作都是基于实体指称项词典：通过在词典中记录一个指称项所有可能指向的目标实体来进行链接候选过滤。表
