- pgno: 225
  md: '简单的一个模型，但在多个知识图谱数据集上都取得了不错的效果，也是之后一系列模型的基础。TransE 在一对一类型的关系上很有效，但在处理一对多和多对一关系时存在一定的问题。例如，对于一对多关系
    $r_m$，由于其可能包括多个尾部实体 $t_i$ 并满足 $\boldsymbol{h}+\boldsymbol{r}_m \approx \boldsymbol{t}_i$，因此会造成
    $t_1 = t_2 = \cdots = t_m$ 的情况，不能有效地区分不同的实体。


    为了解决 TransE 中的问题，TransH$^{[479]}$ 和 TransR$^{[291]}$ 在计算事实得分的时候，将同样的实体在不同的关系上使用不同的表示参与计算，这样避免了直接计算所带来的表示趋向一致的问题。对于事实
    $(h, r, t)$，TransH 首先通过如下公式把实体表示 $(h/t)$ 映射到与关系相关的超平面上：$\boldsymbol{h}_\perp =
    \boldsymbol{h} - \boldsymbol{w}_r^T \boldsymbol{h} \boldsymbol{w}_r$ 和 $\boldsymbol{t}_\perp
    = \boldsymbol{t} - \boldsymbol{w}_r^T \boldsymbol{t} \boldsymbol{w}_r$，其中 $\boldsymbol{w}_r$
    是超平面的法向量。利用映射到超平面的向量，在关系 $r$ 的超平面上采用 TransE 的方式用 $L_1$ 或 $L_2$ 范数计算事实得分：$\|\boldsymbol{h}_\perp
    + \boldsymbol{r} - \boldsymbol{t}_\perp\|_{\ell_{1/2}}$。与 TransH 不同，TransR 把实体表示转换到关系
    $r$ 对应的子空间中，而不是超平面上：$\boldsymbol{h}_r = \boldsymbol{M}_r \boldsymbol{h}$ 和 $\boldsymbol{t}_r
    = \boldsymbol{M}_r \boldsymbol{t}$，其中 $\boldsymbol{M}_r$ 表示从实体空间到关系 $r$ 子空间的转换矩阵。从图
    9.4 可以看出上述三个模型的差别和联系。CTransR 模型$^{[291]}$ 是 TransR 的一个改进方法，它考虑同一种关系在不同实体对之间表示不同的含义，因此它将同一个关系的实体对聚类成若干子类别，在每一个类别中，单独学习一个关系的向量表示。该模型是对知识图谱中的知识进行分门别类处理的一个初步探索，在预测性能上有少量提升。不足之处是只考虑了关系的不同含义，没有考虑实体的多样性，不同类型的实体仍然共享同一个转换矩阵
    $\boldsymbol{M}_r$。


    TransH 和 TransR 只是部分地解决了 TransE 存在的问题。例如，当使用 TransR 解决一对多关系的时候，趋向于学习到 $\boldsymbol{M}_r
    \boldsymbol{t}_i = \boldsymbol{M}_r \boldsymbol{t}_j$, $\forall i, j \in \{1,
    \cdots, m\}$, $(h, r, t_i)$, $(h, r, t_j) \in$ 知识图谱，所以，$\boldsymbol{t}_i$ 和 $\boldsymbol{t}_j$
    的差异仅仅依赖于转换矩阵 $\boldsymbol{M}_r$ 特征值为 0 的个数$^{①}$。另外，因为对前部实体和后部实体使用同样的操作，加上采用对称式打分函数，现有方法对于自反关系不能学到有效的表示。例如，对于自反关系
    $r$（如“朋友”等），当事实 $(h, r, t)$ 和 $(t, r, h)$ 同时成立时，TransE、TransH 和 TransR 学到的表示趋向于得到
    $(\boldsymbol{h} \approx \boldsymbol{t})$ 和 $(\boldsymbol{r} \approx 0)$。其中，$\boldsymbol{h}$
    与 $\boldsymbol{t}$ 相等对于自反关系可能是一个好的性质，但是所有自反关系的表示都一样（都是 0）就不能有效区分不同关系了。实际上这是基于“点”嵌入方法的常见问题，基于“密度”的嵌入方法可以部分解决这个问题$^{[203]}$，特别是基于非对称的打分函数，事实的打分不仅与实体有关，还与它们的顺序有


    ① 对 $\boldsymbol{M}_r$ 进行奇异值分解：$\boldsymbol{M}_r(\boldsymbol{t}_i - \boldsymbol{t}_j)
    = \boldsymbol{S} \begin{pmatrix} \Sigma & 0 \\ 0 & 0 \end{pmatrix} \boldsymbol{D}(\boldsymbol{t}_i
    - \boldsymbol{t}_j) = \boldsymbol{0}$，因为，矩阵 $\boldsymbol{S}\Sigma\boldsymbol{D}$
    的特征值不可能等于 0，这就使得 $\boldsymbol{t}_i$ 和 $\boldsymbol{t}_j$ 的大部分维度的值相等。'
