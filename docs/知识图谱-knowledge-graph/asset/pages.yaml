  md: '后处理：将上面的标注结果进行后处理（例如：合并标签），得到最终的命名实体识别结果。


    基于特征的方法优点在于对语言的依赖性小，可移植性好。在现有基于特征的方法中，应用最广泛的方法是基于字标注的模型，该类模型将命名实体识别看作一个序列标注的任务。最具代表性的方法是基于条件随机场的模型，下面详细介绍基于条件随机场的命名实体识别。


    条件随机场（Conditional Random Field, CRF）是一种有效的计算联合概率分布的概率图模型，从本质上说 CRF 模型可以评估给定输入序列后所得到标注序列的条件概率。它在序列标注任务中通常具有良好的表现。在自然语言处理领域，很多问题或任务都可以归结为序列标注问题，例如：分词、词性标注、命名实体识别等。本节将介绍基于条件随机场模型的命名实体识别方法。首先将系统每个输入的观测值（中文文本以字为基本单元）可能对应的标注标签集合定义为
    F = B, I, O。B（Begin）表示一个命名实体的开始位置，I（Internal）表示一个命名实体的中间部分，O（Other）表示句子中的非命名实体部分。如果识别的命名实体类别是人名（PER）、地名（LOC）或机构名（ORG），还会加上相应的标签。


    例如：输入的观测序列是：x = {姚，明，效，力，于，休，斯，顿，火，箭，队}，那么我们期望识别出的理想标注序列是：y = {B-PER, I-PER, O,
    O, O, B-LOC, I-LOC, I-LOC, B-ORG, I-ORG, I-ORG}。


    条件随机场也被称为马尔可夫随机场，定义如下：假设无向图 G(V, E)，其中，V 是图上的顶点，E 是图上的边；X 是输入观察序列，Y 是输出标记序列，Y
    上的每个元素对应图中的一个节点，则条件随机场满足如下公式：


    P(Y_v|X,Y_w,w≠v) = P(Y_v|X,Y_w,w~v)  (4.1)


    在上述公式中，w ~ v 表示两个顶点之间有直接连接的边，在命名实体识别任务中一般可以看作线性的 CRF，因为输入和输出都是线性的。


    CRF 模型的数学表示：在条件随机场的输出序列上，线性链结构的条件随机场服从一阶的马尔可夫独立性假设。这时给定的待标注序列 X，标注序列 Y 的分布满足如下公式：


    P(Y|X,λ,μ) ∝ exp( Σ_{i=1}^n Σ_j λ_j t_j(y_{i-1}, y_i, x, i) + Σ_{i=1}^n Σ_k μ_k
    s_k(y_i, x, i) )  (4.2)


    在上述公式中，t_j(y_{i-1}, y_i, x, i) 和 s_k(y_i, x, i) 都表示特征函数，t_j(y_{i-1}, y_i, x, i)
    表示观察序列的标记序列位置 i-1 和 i 之间的转移特征函数，λ_j 为这个'
