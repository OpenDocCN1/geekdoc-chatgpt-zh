    # 4. 数据查询


    SPARQL 提供了丰富的数据查询功能，包括四种形式：SELECT、ASK、DESCRIBE 和 CONSTRUCT。其中，SELECT 是最为常用的查询语句，其功能和
    SQL 中的 SELECT 语句类似，从知识图谱中获取满足条件的数据；ASK 则用于测试知识图谱中是否存在满足给定条件的数据，如果存在则返回“yes”，否则返回“no”，该查询不会返回具体的匹配数据；DESCRIBE
    用于查询和指定资源相关的 RDF 数据，这些数据形成了对给定资源的详细描述；CONSTRUCT 则根据查询图的结果生成 RDF。下面分别对其用法进行简要介绍。


    SELECT 语句的基本语法为


    ```

    SELECT 变量 1 变量 2 ... WHERE 图模式 [修饰符]

    ```


    由此可见，SPARQL 的 SELECT 语句由三部分构成：SELECT 子句“SELECT 变量 1 变量 2 ...”、WHERE 子句“WHERE 图模式”以及修饰符。SELECT
    子句中的“变量 1 变量 2 ...”和 SQL 中的“列 1，列 2，...”的含义类似，表示要查询的目标；不同之处在于，由于 SQL 处理的数据存储于结构化的二维表中，语句中的“列
    1，列 2，...”和数据表中的列完全对应，因此查询的目标具有明确的语义；而 SPARQL 所处理的数据则具有更加灵活的存储结构，“变量 1 变量 2 ...”在知识图谱中没有直接的对应。WHERE
    子句用于为 SELECT'
