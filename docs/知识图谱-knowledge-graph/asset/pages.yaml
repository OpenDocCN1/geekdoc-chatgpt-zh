- pgno: 78
  md: '# 第三章 知识体系构建和知识融合


    知识图谱存储了结构化知识，其中的实体、属性、关系等数据都具有明确的语义。例如，通过查询知识图谱可以知道姚明是一名运动员，他出生于上海，除此之外还可以获得他的性别、出生日期、身高等信息。实际上，知识图谱不仅包含了具体的实例知识数据，还包括了对知识数据的描述和定义，这部分对数据进行描述和定义的“元”数据被称为知识体系（Schema）或者本体（Ontology）。能够以一种统一的形式（三元组格式）表示实例型数据和描述型数据是知识图谱得以广泛应用的重要特点。另外，不同组织按照自身需要构建相应的知识图谱，但是，与互联网上的其他资源一样，不同知识图谱关注领域和侧面不同，如何对它们进行综合利用是一个重要问题。知识融合通过框架匹配和实例对齐，把分散的知识资源联合起来，可以极大地增加知识图谱的覆盖领域和共享程度，是知识构建的重要组成部分。本章首先介绍知识体系的构建方法和技术，然后介绍不同层次的知识融合方法。


    # 3.1 知识体系构建


    知识体系主要包括三个方面的核心内容：对概念的分类、概念属性的描述以及概念之间相互关系的定义。知识体系的基本形态包括词汇（Terms）、概念（Concepts）、分类关系（Taxonomic
    Relations）、非分类关系（Non-Taxonomic Relations）和公理（Axioms）这五个不同层次[174]。完全自动地构建知识体系，虽然是人们的终极目标，但是实践证明目前还难以达到，特别是最后两个层次的知识体系[488]。


    图 3.1 是一个以实体为中心的知识体系示意图，图中每一行的开头是实体'
  merge: -1
