- pgno: 198
  md: '# 8.2.2 图检索技术


    由于知识图谱中的数据在逻辑上本身就是一种图结构，因此基于图结构的存储方式能够直观灵活地对知识进行表示和存储。然而利用图模型来建模知识图谱也有不可忽视的缺陷，标准的图查询算法复杂度较高，如何提高图查询的效率成为知识图谱研究的重要问题。


    图是数学中的概念，一个图 G 可以用二元组 (V,E) 表示，记 G = (V,E)。其中，V 是顶点的集合，E 是顶点之间边的集合。图查询的任务是在给定的图数据集中查找给定的查询图，其核心问题是判断查询图是否是图数据集的子图，因此也称为子图匹配问题。以下给出该问题的形式化定义：


    子图匹配问题是指在给定查询图 Q 和目标图集 D = {G_i} 的条件下，在 D 中找出所有与 Q 同构的子图。


    子图同构问题是图论中一个古老的难题，其数学上的定义如下：


    图 G1(V1,E1) 和图 G2(V2,E2) 的子图同构，当且仅当存在一个双射函数 f : V1 → V2，对于 G1 的任意一条边 e(v1,v2)
    ∈ E1，都有 e''(f(v1),f(v2)) ∈ E2。


    子图同构的问题已经被证明是一个 NP 完全问题[328]，目前尚不存在多项式时间复杂度内可解决的算法。和数学中标准的图结构不同，知识图谱中的图结构具有丰富的标签信息：①图中的节点有标签信息，例如实体类型信息；②图中的边同样包含标签信息，例如关系类型信息。虽然子图同构判定问题的算法复杂度很高，但是在实际应用中匹配算法的运行时间通常都在可承受范围之内[160]，主要由两方面的原因：一方面知识图谱中的图结构通常不会特别复杂，只有少数节点之间有边相连，因此并不会触发子图匹配算法的最坏情况；另一方面，利用知识图谱中丰富的标签信息可以有效降低算法的搜索空间。


    知识图谱是一张大图，其中包含了大量的连通分支与子图。在进行图匹配时，需要将查询图与每个子图逐一进行同构测试。为了减少匹配的次数，图数据库在进行子图匹配时会先按照一定条件对数据进行筛选，减少候选子图的个数。


    # 8.2.2.1 子图筛选


    图索引技术是实现子图筛选的有效方法。与信息检索中的索引机制类似，图索引是在数据预处理阶段进行的。其基本原理是首先根据图上的特征信息建立索引，在进行子图匹配时，根据查询图上的特征能够快速地从图数据库中检索得到满足条件的候选子图，避免在全部子图上进行匹配操作。基于路径的索'
  merge: -1
  img_proc: true
- pgno: 199
  md: '引和基于子图的索引是最常见的两种图索引方法。


    基于路径的索引方法将知识图谱中所有长度小于某特定值的路径收集起来，并根据这些路径为图数据库中的子图建立倒排索引[424]。在进行图匹配时，首先从匹配图中抽取具有代表性的路径，然后利用索引检索获得所有包含这些路径的候选子图，最后在候选子图上进行同构测试获得最终的结果。这种索引方式的优点是图的路径获取简单直接，因此构建索引比较方便。但是问题也比较明显，随着路径长度的增加，路径数目呈指数级增长，对于大规模知识图谱来说，需要索引的路径数目过于庞大，不仅耗费巨大的存储空间，也增加了检索的时间；另外，不同路径对于子图的区分性差异很大，区分性低的路径对于降低搜索空间的效果有限[504]。


    基于子图的索引方法则将子图作为索引的特征[88, 527, 529]，该方法的关键问题是如何在保证区分性的条件下减少索引的规模。常用的方法是在构建索引时，通过在知识图谱上挖掘出的频繁子图作为建立索引的依据。频繁度是衡量一个子图频繁程度的指标，通俗地讲，频繁度就是子图出现的次数。实践中，需要设置一个频繁度来控制需要被索引的子图规模。频繁度设置得过高，那么每个索引项都指向过多的子图，导致过滤效果不佳；频繁度过低则导致索引项太多，不仅导致索引的空间开销过大，也影响索引的检索效率。因此，频繁度的设置需要经过精心的挑选。


    # 8.2.2.2 子图同构判定


    子图同构是一个经典的 NP 难题，尚且不能确定是否存在多项式复杂度的解法[328]。Ullmann 算法[467] 是实践中常用的一种判定子图同构的算法，它能够枚举出所有的同构子图，因此也叫做枚举算法。


    设矩阵 M_A、M_B 分别是图 A 和图 B 的邻接矩阵表示；邻接矩阵中第 i 行第 j 列的值 M_(i,j) 指示了图中顶点 i 和顶点 j 之间是否有边相连，如果有边相连，其值为
    1，否则为 0；Ullmann 算法的目标是找到一个映射矩阵 F，使得其满足如下条件：


    ∀(i,j), M_A(i,j) = 1 ⟹ M_F(i,j) =* 1  (8.1)


    其中 M_F = F(F·M_B)^T。该算法包括三个基本步骤，首先初始化矩阵 F，若图 A 的顶点 i 和图 B 的顶点 j 具有相同的标签，并且图 A
    中顶点 i 的度不大于图 B 中顶点 j 的度，那么在 F 中记录 i 映射到 j；然后修改 F 中值为 1 的项，保证 F 的每行和每列最多只有一个 1，每一个满足条件的
    F 都是一个候选的映射矩阵；最后在得到的候选矩阵集中筛选满足公式 8.1 的矩阵作为最终的'
  merge: -1
  img_proc: true
