  md: '念被称作实体类型，例如“人物”“城市”等。在知识图谱中，实体除了具有类型信息，还具有丰富的属性信息（比如图中的蓝色部分），这些属性信息用于刻画实体的内在特性。不同类型的实体具有不同的属性，例如“人物”有出生地、出生日期、国籍等属性，而“城市”有面积、平均海拔、邮编等属性。知识图谱的目标是构建一个能够刻画现实世界的知识库，为自动问答、信息检索等应用提供支撑。因此，对知识的持久化存储并提供对知识数据的高效检索是一个知识图谱系统必须具备的基本功能。本章首先介绍知识图谱的存储技术，按照存储策略的不同可以分为基于表结构的存储和基于图结构的存储；然后基于现有的知识图谱存储技术，介绍常见的形式化查询语言；最后，简要介绍知识图谱中的图搜索技术。


    # 8.1 知识图谱的存储


    知识图谱中的知识是通过 RDF^{[244, 335]} 结构进行表示的，其基本构成单元是事实。每个事实是一个三元组（S，P，O），其中 S 是主语 Subject
    的简写，其取值可以是实体、事件或者概念中的任何一个；P 是谓语 Predicate 的简写，取值可以是关系或者属性；O 是宾语 Object 的简写，取值可以是实体、事件、概念或者普通的值（例如数字、字符串等）。图
    8.2 展示了知识图谱中知识表示的三元组列表。在实际系统中，按照存储方式的不同，知识图谱的存储可以分为基于表结构的存储和基于图结构的存储。


