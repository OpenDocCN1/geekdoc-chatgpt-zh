    # 5.3 基于实体链接的实体消歧方法


    基于实体链接的实体消歧方法，一般是将实体指称项链接到知识库中特定的实体，也称为实体链接。实体链接（通常称为 Entity Linking，与 Entity
    Grounding，Entity Resolution，Record Linkage 和 Entity Disambiguation 意义接近）指的是将一个命名实体的文本指称项（Textual
    Mention）链接到知识库中相应实体的过程（知识库中可能不包含待消歧指称项的对应实体，这时，将实体指称项链接到空实体 NIL）。


    通常，实体链接的输入包括两个部分。


    +   (1) 目标实体知识库：目前最常用的知识库为 Wikipedia，在其他一些任务中也可能是特定领域的知识库，如电影领域的 IMDB、科学研究领域的
    DBLP 等。知识库通常包含如下的一些信息：实体表、实体的文本描述、实体的结构化信息（如属性/属性值对）、实体的辅助性信息（如实体类别）；同时知识库也经常提供一些额外的结构化语义信息，如实体之间的关联。


    +   (2) 待消歧实体指称项及其上下文信息。


    实体链接任务通常需要两个步骤。'
