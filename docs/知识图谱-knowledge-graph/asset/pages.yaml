    # 10.3 知识对话


    知识问答系统中假设问题包含了提问者的所有信息需求。实际上，对于包含多个信息需求的问题，人们常常会以多个问题的方式表达出来，例如，“李连杰拍过哪些武打电影？”“李连杰是哪儿人？”，而不太会表述为“李连杰是哪儿人，他拍过哪些武打电影？”。另一方面，知识问答假设问题之间没有关系，实际上，多个问题之间常常共享信息，如上面的两个问题。再比如，我们常常会问“北京天气如何？”“那上海呢？”，实际上，后面的问题就利用了前面问题的部分信息（“天气如何”）。


    本节主要介绍知识服务的另一类主要形式：知识对话（也称对话系统）。对话系统是更自然友好的知识服务模式，它可以通过多轮人机交互满足用户的需求、完成具体任务等。一般对话系统常常通过语音进行交互，所以也常被称为口语对话系统（Spoken
    Dialogue System）、人机对话系统（Human-Machine Conversation System）等[301, 322, 379]。


    实际上，日常生活中处处都有对话，在生活和工作中我们每天都在通过对话来获取信息、表达观点、抒发情绪、完成任务等。相较于其他任务，特别是知识问答，对话系统有几个特征：①
    多角色切换：对话中通常有两个甚至多个角色，可以是提问者，也可以是问题回答者等，并且在对话过程中，各角色之间常常交替变化；② 连贯性：对话的前后内容是有关联的、有逻辑的，这点与'
