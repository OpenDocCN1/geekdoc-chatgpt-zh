    ![](img/9549a57f481f525254296dec39e94079_22_0.png)


    当然，也有 一部人认为，人类文明发展过程中，有意无意间总结和传承了很多规则，这些抽象的知识给人们带来了很大的便利，不仅可以节省知识存储和搜索空间，也让人能够发展出联想、推理、决策等更高层的认知能力。因此，在模拟高层认知能力的人工智能系统中应该建模这类知识，而知识图谱作为知识表示的基石，应该涵盖推理规则。


    综上，知识图谱以丰富的语义表示能力和灵活的结构构建了在计算机世界中表示认知世界和物理世界中信息和知识的有效载体（如图 1.2 所示），成为人工智能应用的重要基础设施。


