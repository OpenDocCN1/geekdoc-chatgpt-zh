    < $\lambda$表达式 > ::= < 变量名 >

    || < $\lambda$表达式 > < $\lambda$表达式 >

    || $\lambda$ < 变量名 > . < $\lambda$表达式 >

    || (< $\lambda$表达式 >)


    $\lambda$ 表达式具有两种形式：应用型和抽象型。没有显式 $\lambda$ 符号的表达式是应用型函数，标准形式为 $E_1E_2$，其中 $E_1$
    是函数定义，$E_2$ 是函数 $E_1$ 的实参。因此，以下都是合法的 $\lambda$ 表达式：


    +   - $xx$

    +   - $\lambda x.xy$

    +   - $x(\lambda y.xy)$

    +   - $\lambda x.\lambda y.x$


    对于 $\lambda$ 表达式的运算规律，应用型是从左到右运算，而抽象型则是由右向左运算，如下所示：


    $E_1E_2E_3 = [(E_1E_2)E_3]$

    $\lambda x_1.\lambda x_2\lambda x_3 = [\lambda x_1.(\lambda x_2\lambda x_3)]$


