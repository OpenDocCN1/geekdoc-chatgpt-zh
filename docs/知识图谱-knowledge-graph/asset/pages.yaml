  md: '子表示时引入了 Noisy Channel 来提升模型的性能。Huang 等[221] 利用神经网络的方法建模知识图谱中已有的实体表示，然后通过学习得到的表示辅助计算待消歧实体指称项上下文中的实体与候选知识库中实体的相似度，进而提升实体消歧的效果。Francislandau
    等[164] 提出利用不同粒度的卷积网络去捕获待消歧实体上下文和候选实体描述中不同粒度的语义，进而提升实体消歧的性能。近些年，基于神经网络的方法不需要人工设计复杂的特征，易于捕获深层语义，取得了比较好的性能并具有良好的扩展性，占据了实体消歧的主导地位。


    # 5.4 面向结构化文本的实体消歧方法


    前面已经介绍了非结构化文本中的实体消歧方法，在非结构化文本中待消歧实体指称项的上下文能提供消歧的关键信息。但是现实世界中有大量的结构化文本，如：实体知识库、网页中的列表数据或者网络百科页面中的
    Infobox 数据。很多结构化数据中存在大量的非结构化描述文本，这类结构化数据的消歧方法可以参照上文介绍过的方法。但是还有相当一部分结构化数据只有实体名或者很少的结构化信息。如表
    5.3 所示。


