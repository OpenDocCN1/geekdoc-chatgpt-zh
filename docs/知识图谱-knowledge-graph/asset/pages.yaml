  md: '知识问答区别明显；③ 多模态：真正的（人与人）对话中，常常涉及语音、文字、图片等多种模态的数据，这些数据都可以成为对话中传递信息的方式。本质上来讲，对话系统就是能与人进行连贯对话的计算机系统。目前，对话系统可以完成简单的任务，例如，人机聊天
    [资源 10-15]、订机票[206] 等。随着知识图谱资源的大规模增长和机器学习模型的快速进展，对话系统逐步从限定领域走向开放领域。以下首先介绍对话系统的基本模型，然后介绍两类最常用的对话系统——限定领域的任务导向型对话系统和开放领域的对话系统，最后对对话系统的评测进行讨论。


