    # 6.2.2 基于机器学习的关系抽取方法


    基于模板的关系抽取方法的最大问题在于其受限于模板的质量和覆盖度，可扩展性不强。因此，随着机器学习方法的发展，很多工作将关系抽取看成是一个分类问题（通常看成是一个有监督学习或者弱监督学习的问题），开始尝试利用较为成熟的机器学习算法解决这一问题。主要可以分为有监督的关系抽取方法和弱监督的关系抽取方法，下面依次介绍。'
