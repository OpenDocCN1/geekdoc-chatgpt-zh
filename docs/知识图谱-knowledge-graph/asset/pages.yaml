    \nCONSTRUCT 语句用于生成满足图模式的 RDF 图，其基本语法为\n\n# CONSTRUCT 图模板 WHERE 图模式\n\n其中，图模板确定了生成的\
    \ RDF 图所包含的三元组类型，它由一组三元组构成，每个三元组既可以是包含变量的三元组模板，也可以是不包含变量的事实三元组；图模式则和上述 SELECT\
    \ 等语句中介绍的相同，用于约束语句中的变量。该语句产生结果的基本流程为：首先执行 WHERE 子句，从知识图谱中获取所有满足图模式的变量取值；然后针对每一个变量取值，替换\
    \ RDF 图模板中的变量，生成一组三元组。例如，在图 8.13 所示的知识图谱上执行如下 SPARQL 语句：\n\n```\nCONSTRUCT {\n\
