  md: '# 8.1.1 基于表结构的存储


    基于表结构的存储利用二维的数据表对知识图谱中的数据进行存储[106, 121, 421]。根据不同的设计原则，知识图谱可以具有不同的表结构。下面以图 8.1
    所示的知识图谱为例，介绍几种常见的设计方法。


    # 8.1.1.1 三元组表


    知识图谱中的事实是一个个的三元组，一种简单直接的存储方式是设计一张三元组表用于存储知识图谱中所有的事实。实际上，目前已经有不少比较成熟的产品利用该形式存储知识图谱，包括
    Jena[486]、Oracle[94]、Sesame[73]、3store[197]、SOR[304]、Rstar[306] 和 Virtuoso[143]。图
    8.3 展示了知识图谱的三元组表存储示例。这种存储方式的优点是简单直接，易于理解；然而缺点也非常明显，主要有以下两点：


    |  |  |  |

    |---|---|---|

    | 费米 | 主要成就 | 93号元素 |

    | 费米 | 出生日期 | 1901/09/29 |

    | 费米 | 类型 | 物理学家 |

    | 费米 | 国籍 | 美国 |

    | 费米 | 出生地 | 罗马 |

    | 费米 | 老师 | 玻尔 |

    | 玻恩 | 主要成就 | 玻恩近似 |

    | 玻恩 | 类型 | 物理学家 |

    | 玻恩 | 类型 | 数学家 |

    | ... | ... | ... |


    图 8.3 知识图谱的三元组表存储示例


    +   - 整个知识图谱都存储在一张表中，导致单表的规模太大。对大表进行查询、插入、删除、修改等操作的开销很大，这将导致知识图谱的实用性大打折扣。\n- 复杂查询在这种存储结构上的开销巨大。由于数据表只包括三个字段，因此复杂的查询只能拆分成若干简单查询的复合操作，大大降低了查询的效率。例如，查询“费米的国籍和出生日期”需要拆分为“费米的国籍”和“费米的出生日期”。'
