  md: '排序后的候选实体列表，评估方法的效果也一般采用 P@N、AP（average precision）等指标。没有一种方法可以保证抽取结果的绝对正确，但实际应用中，需要维护的是一个全部由正确实体组成的列表，所以需要对抽取结果进行纠错。目前这一工作主要由人工进行，需要大量的人力物力。所以研究如何从最终结果中找出并排除错误候选实体也具有一定的实际意义。


    另一方面，很多实体扩展方法使用 Bootstrapping 策略，使用第 N 轮迭代中抽取出的置信度高的候选实体作为第 N+1 轮迭代的种子，这会使得抽取结果中的错误不断传播扩大，影响系统的最终结果。这种情况下如果能在每轮迭代过程中找出并排除错误候选实体就可以提升方法的最终效果。


    针对错误候选实体是如何产生的这一问题，Vyas 等人进行了深入研究并发现了以下两个现象 [471]：


    +   ① 错误候选主要是来自于种子的歧义性。例如：“苹果”有多种语义，可能指一家 IT 公司，也可能指一种水果。使用“苹果”做种子就很可能找到错误候选实体。

    +   ② 实体在某种语义上可能比较相似，但不会在其他语义上相似。比如“微软”可能与“苹果”作为 IT 公司时的语义相近，但不会与“苹果”作为水果时的语义相近。


    根据以上现象，Vyas 等人设计了一种结果过滤方法。在每轮迭代的过程中由人工找出一个错误候选，然后通过以下两种方法找出候选实体集合中与错误候选实体语义相似的候选实体并将其剔除：


    +   ① 计算所有候选实体与错误候选实体的相似度，并排除相似度超过某个人工指定阈值的候选实体。

    +   ② 找出错误候选实体的特征向量（由该候选的上下文组成），并将其对应的特征从种子集特征向量中剔除。


    以上方法可以减少最终结果中的错误，并减轻编辑的工作量，在实际工程领域有重要作用。但实际上，该任务可以视为抽取方法的一部分，即归入“打分排序”模块。


