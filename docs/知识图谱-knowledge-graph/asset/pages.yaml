  md: '```

    INSERT INTO 表名 VALUES (值 1, 值 2, ...) [, (值 1, 值 2, ...), ...]

    ```


    其中，值 1、值 2 … 分别对应数据表中的第一列、第二列 …。这种写法对 VALUES 对应的值的顺序和数量有着严格的要求，有些字段会有默认值，可能并不需要指定，此时这种写法就会遇到问题。VALUES
    后的中括号内为可选内容，可以加入多个值对，相当于一次插入多行数据到表中。插入数据也可以指明插入数据的列，其语法为


    ```

    INSERT INTO 表名 (列 1, 列 2, ...) VALUES (值 1, 值 2, ...) [, (值 1, 值 2, ...), ...]

    ```


    例如，需要插入的数据有 “玻恩” 实体的相关类型，以及 “费米” 与 “玻恩” 间的关系数据。在本例中，我们需新增 “玻恩” 实体及其相关属性，以及其他与
    “费米” 间的联系即 (S: 费米, P: 老师, O: 玻恩), SQL 语句为


    ```

    INSERT INTO Triples VALUES (''费米'', ''老师'', ''玻恩''), (''玻恩'', ''类型'', ''数学家''),
    (''玻恩'', ''类型'', ''物理学家'')

    ```


    指定插入的数据列的写法为


    ```

    INSERT INTO Triples (S, P, O) VALUES (''费米'', ''老师'', ''玻恩''), (''玻恩'', ''类型'',
    ''数学家''), (''玻恩'', ''类型'', ''物理学家'')

    ```


