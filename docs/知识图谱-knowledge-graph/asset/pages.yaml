  md: '经常使用，本书不进行详细的介绍。


    # 9.2.1.1 归纳推理


    归纳是从特殊到一般的过程，所谓归纳推理，就是根据部分对象所具有的性质，推出一类事物中所有对象都具有这类性质的推理方式。归纳推理并不局限在人工智能或自然语言处理领域，它本质上是人类的一种思维方式，在各个学科都有广泛应用。归纳推理一般具有三个步骤，分别是：①
    对部分资料进行观察、分析和归纳整理；② 得出规律性的结论，即猜想；③ 检验猜想。


    例如，蓝鲸可以喷射水柱，抹香鲸可以喷射水柱，座头鲸可以喷射水柱，可以归纳出，鲸鱼都可以喷射水柱。我们用如下示例解释该归纳过程如何进行。


    步骤 1：创造出实例化的数据。为此，我们先根据已知的信息，构建事实集合。


    +   - < 蓝鲸，可以喷射，水柱 >;

    +   - < 抹香鲸，可以喷射，水柱 >;

    +   - < 座头鲸，可以喷射，水柱 >。


    步骤 2：对有限的资料进行观察、分析、归纳整理。我们可以从以上列举的条目中发现一些规律：< XX 鲸，可以喷射，水柱 >。


    步骤 3：得出带有规律性的结论，即猜想。由以上发现的规律猜想，那就是：如果 < X，是一种，鲸鱼 >，那么 < X，可以喷射，水柱 >。


    步骤 4：检验猜想。我们可以找出其他的鲸鱼，例如，“齿鲸”，发现它也满足上述猜想，即：< 齿鲸，是一种，鲸鱼 > 并且 < 齿鲸，可以喷射，水柱 >。因此，验证了之前对规律性结论的猜想。


    以上的例子详细地介绍了人类使用归纳推理方法的流程。而计算机在归纳推理上的运用主要集中在通过事实或实例，使用数据挖掘等方法，总结出通用或局部通用的规则，这一部分内容在第
    9.2.2.2 节会详细介绍。


    # 9.2.1.2 演绎推理


    狭义地理解演绎推理，可以认为它是归纳推理的对立任务，是从一般到特殊的推导过程。更具体地，演绎推理就是从一般性的前提出发，通过推导即“演绎”，得出具体陈述或个别结论的过程。


    最经典的演绎推理是由古希腊的哲学家亚里士多德提出的三段论，它也是演绎推理中最简单的一种，包含：一个一般性的原则（大前提），一个附属于前面大前提的特殊化陈述（小前提），以及由此引申出的特殊化陈述符合一般性原则的结论。例如前序章节中列举过的关于鲸鱼的例子，写成三段论的形式如下：'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   - 大前提：

    +     虎鲸背部有背鳍。

    +   - 小前提：

    +     背部有背鳍的鲸鱼都属于海豚科。

    +   - 结论：

    +     虎鲸属于海豚科。


    当然，演绎推理不仅仅局限于三段论，也不是从一般到特殊的过程，它有着强烈的“演绎”特性，重在通过利用每一个证据，逐步地推导到目标或意外的结论。该推理类型被广泛应用于数学物理中的证明推导等任务。以下是一个演绎推理更为复杂的例子。


    莎士比亚在《威尼斯商人》中，写富家少女鲍西娅品貌双全，贵族子弟、公子王孙纷纷向她求婚。鲍西娅按照其父遗嘱，由求婚者猜盒订婚。鲍西娅有金、银、铅三个盒子，分别刻有三句话，其中只有一个盒子放有鲍西娅的肖像。求婚者中谁通过这三句话，最先猜中鲍西娅的肖像放在哪只盒子里，谁就可以娶到鲍西娅。


    金盒子上说：“肖像不在此盒中。”


    银盒子说：“肖像在铅盒中。”


    铅盒子上说：“肖像不在此盒中。”


    鲍西娅告诉求婚者，上述三句话中，最多只有一句话是真的。如果你是一位求婚者，如何尽快猜中鲍西娅的肖像究竟放在哪个盒子里？


    +   A、金盒子  B、银盒子

    +   C、铅盒子  D、不能确定


    这一道看似是脑筋急转弯的问题，其实是一道利用了演绎推理中矛盾关系的典型推理问题。演绎推理中的矛盾关系是指在同一世界中描述同一个问题，两个矛盾的语句或命题不能同时为真，也不能同时为假，即一个命题是真时，另一个必为假；反过来若我们知道一个命题为假，那么另一个则一定为真。例如，“虎鲸是海豚的一种”和“虎鲸不是海豚的一种”，这两个命题就是矛盾的。再一次看上面的例子，我们发现银盒子和铅盒子上的话是矛盾关系，必有一真一假。并且，在整个世界中具有一个重要的前提，三句话中最多只有一句话为真，所以金盒子上的话必为假，因此，可推出肖像在金盒子中，故正确答案是
    A。


    除了矛盾关系外，演绎推理还关注充分条件和必要条件，在自然语言中，充分条件对应着“如果……就……” “有……就有……” “若是（倘若）……就……” “哪里有……哪里就有……”
    “一旦……就……” “假若……则……” “只要……就……”。而必要条件一般与否定相关，在自然语言中对应着“没有……'
  merge: -1
  img_proc: true
- pgno: 207
  md: '就没有……”“不……不……” “除非……不……” “除非……才……” “除非……否则……” 。在演绎推理过程中，这种细微的描述可能会导致推理方向乃至推理结果的变化，例如“只有认错才能改正”和“只要认错就一定能改正”是两个完全不同的意思。


    与归纳推理类似，演绎推理也是一个庞大的体系，很难在有限的篇幅内穷尽所有演绎推理的特性，而在计算机或人工智能领域，演绎推理对应着使用已有的知识或规则推导出未知知识的过程。


    # 9.2.2 确定性推理与不确定性推理


    # 9.2.2.1 确定性逻辑推理


    确定性逻辑推理也简称为逻辑推理，它具有完备的推理过程和充分的表达能力，可以严格地按照专家预先定义好的规则准确地推导出最终的结论，也就是说在推理的起始点和规则集合固定的情况下，结论也是固定的，因此确定性逻辑推理并没有准确性的评价，如何快速自动地推导出结论是确定性逻辑推理主要的研究目标。


    确定性逻辑推理研究工作大都专注于对基于某种逻辑定义下的自动推理算法的研发。例如，基于可满足性的 GSAT[186] 和 WALKSAT[419] 算法用于求解命题逻辑推理；而以
    rete 算法[161] 为代表的基于前向链接的算法，以及被应用于 Prolog 的反向链接算法[104]，都被应用于一阶逻辑的推理。自 1879 年 Gottlob
    Frege 建立起首个基于完整一阶逻辑的推理系统开始，繁多的自动推理系统被建立起来，其中有面向某一特殊领域的专家推理系统，如用于数学定理证明的 VAMPIRE[395]，或与领域无关的推理架构，如
    SOAR[259]，以及可编程的通用逻辑语言设计工具 Prolog[98]，其中 Prolog 被广泛应用于多种逻辑自动推理器及专家系统的设计。


    在 21 世纪初期，随着 W3C 提出资源描述框架（Resource Description Framework, RDF[资源 9-1]）的标准，以及语义网（Semantic
    Web）[52] 和开放链接数据（Linked Open Data）等项目的出现与发展，基于 RDF 三元组的确定性逻辑推理技术得以进一步的发展。这些工作中具有影响力的有欧盟主导的知识计算平台
    LARKC（Large Knowledge Collider[资源 9-2]）（全名为大规模知识加速器），主要是构建分布式知识推理的平台，类似系统还有 WebPIE[469]——一个基于网络本体语言（Web
    Ontology Language, OWL）的大规模分布式推理系统。之后，为了权衡语义表达能力和


    ![](img/9549a57f481f525254296dec39e94079_207_0.png)'
