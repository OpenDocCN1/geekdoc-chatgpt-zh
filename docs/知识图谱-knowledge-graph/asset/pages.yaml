  md: '# 1.2 知识图谱发展历程


    知识图谱的发展可以从人工智能和语义网两个领域进行追溯。一方面，人工智能的研究目标是使计算机更智能，让计算机能够完成一些人脑才能完成的任务，例如推理、分析、预测、思考等高级思维活动。人们希望借助知识库完成该目标，即把人类的知识用计算机进行表示和组织，并设计相应算法完成推理、预测等任务。例如，专家系统就是利用知识库支撑人工智能的一种有效尝试。另一方面，随着互联网的发展，虽然存储和检索海量数据的能力日益提高，但是却没有推理、预测等完成复杂任务的功能，不能有效支持商业智能等决策任务。人们希望通过引入知识，使得原始数据能够支撑推理、问题求解等复杂任务（如多维数据分析），这个目标就是语义网（Semantic
    Web）。因此，知识库在人工智能和语义网领域的目标可以分别总结为知识的数据化（让计算机表示、组织和存储人类的知识，对应图 1.3 上半部分）和数据的知识化（让数据支持推理、预测等智能任务，对应图
    1.3 下半部分）。


    ![](img/9549a57f481f525254296dec39e94079_23_0.png)


    图 1.3 知识图谱发展历程


    纵观知识图谱的发展历史，知识图谱其实是伴随着人工智能技术的发展而发展。早在人工智能发展的第一个十年，研究者们看重的是如何构建一个推理模型进行问题的求解，而忽视了对于数据中蕴含的知识的加工和利用。1977
    年，图灵奖获得者、美国斯坦福大学荣誉退休教授爱德华·费根鲍姆（Edward Feigenbaum）最早提出了“知识工程”的概念，他认为：“知识中蕴藏着力量（In
    the'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'knowledge lies the power )”，通过实验和研究，费根鲍姆证明了实现智能行为的主要手段在于知识，在多数实际应用中是特定领域的知识。这对于人工智能技术以及相关研究的发展产生了巨大的影响，自“知识工程”概念的提出（有些工作甚至始于该概念正式提出之前），很多研究者开始投入到知识工程、专家系统的相关研究当中。研究界提出了一系列各具特点的知识表示方法，例如，20
    世纪 70 年代以一阶谓词逻辑为代表的逻辑表示方法（Logic），1974 年马文·闵斯基提出的框架表示法（Frames），1978 年心理学家塞尔文·汤姆金斯提出的可以建模场景、时间、状态变化并能描述行动过程的脚本表示语言（Script
    Theory），也包括 1987 年奎利恩受人脑记忆特征启发而提出的语义网络（Semantic Network，它的表示与知识图谱有异曲同工之处）。同时，人们也在试图基于这些知识表示方法构建知识库，例如，20
    世纪 80 年代以 Cyc 为典型代表的大型知识系统。尽管后续发展情况显示包括 Cyc 在内的很多知识库项目是失败的，但是不能否认的是，知识工程已经成为人工智能的重要组成部分，也是人工智能领域中取得实际成果最丰富、影响也最大的分支之一。


    从 20 世纪 90 年代开始，以统计机器学习为核心的人工智能技术逐步占据主流，“如何自动学习和利用知识进行推断和决策”逐渐成为人工智能的研究热点。进入新世纪，随着互联网的蓬勃发展，数据的规模呈现爆炸式增长的趋势，其类型也更加复杂多变，在大数据环境下，进行知识获取、知识管理和知识服务备受关注。然而，传统搜索引擎仍然基于关键词匹配，尽管这一模式一定程度上提升了用户获取信息的效率，但是由于其信息服务的模式仍然停留在字符层的匹配上，因此在信息服务的准确度上存在缺陷。随着搜索技术的发展，研究人员逐步意识到这些字符背后存在大量的知识，只有正确理解符号背后的语义，将文字转化为知识，才能真正提升信息服务的效果。


    为了解决语义理解的困难，Tim Berners-Lee 等于 2001 年提出了语义网（Semantic Web）的概念[52]，由此打开了世界范围内语义网研究的序幕。语义网使用能够被计算机理解的方式描述事物之间的联系，它的基本出发点是计算机能够自动识别并理解互联网上的内容，并对不同来源的内容进行融合，从而为人们更加快速地获取信息提供技术支撑。从概念的理解上，现有
    Web 上的内容只是简单的字符串，对于计算机而言，它们没有任何语义信息；语义网的目标就是对现有 Web 内容增加语义支持，使得计算机在一定程度上能够理解 Web
    上信息的含义，并通过分析用户查询的语义信息，提供快速和准确的信息服务。本质上，语义网的目标是以 Web 数据的内容和语义为核心，并以计算机能够理解和处理的方式链接起来的海量分布式数据库[14]，其理想是将整个万维网上的在线文档所构成的数据编辑成一个巨大可用的数据库[51]。这个愿景虽'
