- pgno: 82
  md: '# 4. 确定分类体系


    确定了相关要素之后，需要将其中表示概念的要素组织成层级结构的分类体系。构建过程中有两种方式可供选择，它们分别是自顶向下的方法和自底向上的方法。前者从最抽象的概念开始，逐层添加更为具体的概念；后者则相反，先从最具体的概念开始，逐层进行抽象。在构建的分类体系中，必须保证上层类别所表示的概念完全包含下层类别所表示的概念，也就是说所有下层类别的实例也必须是上层类别的实例。例如，“歌手”是“娱乐人物”的下层类别，即所有歌手都是娱乐人物。


    # 5. 定义属性及关系


    上一步定义了知识图谱的分类体系，需要为其中的每个类别定义属性及关系。属性用于描述概念的内在特征，例如人的姓名、出生日期等；关系则用于刻画不同概念之间的关系，例如夫妻关系、朋友关系等。属性的定义需要受分类体系的约束，下层类别必须继承所有上层类别的属性。例如所有“歌手”都应该具有“娱乐人物”所具有的所有属性。这一步经常和上一步交叉进行，因为在定义属性的过程中可能会发现原有分类体系的不足，需要对其进行修正。


    # 6. 定义约束


    不同的属性和关系具有不同的定义域和值域，例如“性别”“爱好”等属性只能用于描述人物相关的概念，并且“年龄”对应的值应该是正整数，并且不应该大于 150（假设人的寿命上限是
    150 岁）。这些约束可以保证数据的一致性，避免异常值的出现。


    # 3.1.2 自动构建方法


    人工构建知识体系是一个耗时、昂贵、高度技巧化的任务，并且构建的过程烦琐而枯燥，很容易出错。因此自动地从数据中学习知识体系具有重要的意义。在不同数据源上学习知识体系需要不同的技术，根据数据源结构化程度的不同，知识体系的学习技术可以分为三大类：基于非结构化数据的知识体系学习、基于结构化数据的知识体系学习和基于半结构化数据的知识体系学习。其中，后两类研究工作较少，它们大部分采用与人工构建结合的方式工作。


    # 1. 基于非结构化数据的知识体系学习


    非结构化数据通常指文本数据，例如新闻报道、电子邮件等。基于文本数据构建知识体系也称为基于文本的本体学习（ontology learning from text），这类方法的基本思想是：首先利用自然语言处理工具对文本进行分词、句法分析、命名实体识别等预处理操作，然后利用模板匹配、统计学习等手段从文本中抽'
  merge: -1
  img_proc: true
- pgno: 83
  md: "取重要信息，主要包括领域概念、实例以及概念之间的关系。2012 年的 RMIT 大学 WILSON WONG 教授等人的综述文章 “Ontology\
    \ Learning from Text: A Look Back and into the Future” [488] 对该任务进行了较详细的介绍。概括来说，基于非结构化文本的知识体系学习方法主要包括以下三个主要步骤：领域概念抽取、分类体系构建、概念属性及关系抽取。\n\
    \n# （1）领域概念抽取\n\n领域概念抽取的目标是从文本数据中抽取出构建知识体系所需的关键元素，包括实体类型名、属性名、关系名等，这些关键元素称为该领域的术语\
    \ [234, 316]。术语的抽取主要分为如下三步：\n\n+   ● 抽取候选术语：利用自然语言处理工具对文本进行词法、句法分析，然后利用语言学规则或者模板在文本中抽取特定的字符串，并将这些字符串当做领域术语的候选。该步骤的目的是尽可能多地将真正的术语包括进来，因此对抽取术语的质量没有严格的要求，但要尽量保证抽取术语的高覆盖度。\n\
    +   \n+   ● 术语过滤：上一步获得的候选术语噪声较大，准确率不高，因此需要进一步过滤掉其中低质量的术语 [324]。领域术语与普通词汇在语料中往往具有不同的统计特征，例如普通词汇无论在领域内还是领域外一般具有相似的分布，而领域术语在领域内外的分布会有显著的区别（领域术语在领域内出现的频率会显著高于在领域外出现的频率）。在实际操作中，可以利用互信息（MI）、词频逆文档频率（TF-IDF）、术语相关频率（RTF）等方法来定量刻画候选术语的统计特性，并基于这些值过滤掉低质量的候选术语。\n\
    +   \n+   ● 术语合并：术语并不等同于概念，概念是认知层面的处理单位，而术语是语言层面的单位 [163]。例如，上一步可能从文本中抽取出了“电脑”和“计算机”这两个术语，但是它表示的是相同的概念，语言学上称之为同义词。知识体系是对概念及其关系的描述，因此需要将上一步获得的术语转换为概念。具体的做法是将候选术语中表达相同概念的术语聚合到一起，转换的过程就是识别同义词的过程。同义词的识别是自然语言处理领域中一个传统的研究任务，有很多比较成熟的解决方法。其中最具代表的方法有基于词典的方法和基于统计的方法。基于词典的方法利用现有的词典资源获取词汇的同义情况，典型的资源有\
    \ WordNet、HowNet、同义词词林等。基于统计的方法则假设相同词义的词汇具有相似的上下文，基于该假设在大规模语料上进行词汇表示学习，并基于词汇的表示对词汇进行聚类，聚类的结果就是同义词识别的结果。\n\
    \n# （2）分类体系构建\n\n构建分类体系实际上是要获取不同概念之间的继承关系，语言学上称之为上下位关系 [282, 394, 409]。下位词是上位词概念的具体化，例如“犬科动物”是“哺"
  merge: -1
