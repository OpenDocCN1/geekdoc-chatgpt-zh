- pgno: 201
  md: '# 8.3 小结


    本章主要介绍了知识图谱的存储和检索技术，主要内容包括：① 知识图谱需要对现实中的知识数据进行持久化的存储。在实践中，知识图谱有两种主要的存储方式：基于表结构的存储和基于图结构的存储，本章分别在
    8.1.1 和 8.1.2 小节对它们进行了介绍。② 基于表结构的存储利用二维表对知识数据进行表示和存储。根据需求的不同，可以设计不同的表结构，例如三元组表、类型表等。在实践中可以使用关系数据库实现基于表结构的存储。③
    将实体看作节点，关系看做边，那么知识图谱的数据很自然地满足图模型结构。基于图结构的存储方式直接对知识图谱的这种图结构进行表示和存储，因此能够直接准确地反映知识图谱的内部结构。在实践中可以使用图数据库实现基于图结构的存储。④
    本章在 8.2.1 小结介绍了 SQL 语言和 SPARQL 语言，它们分别是关系数据库和图数据库的标准查询语言。⑤ 图的查询算法复杂度较高，为了提高效率，实践中一般将图的查询问题拆分为子图筛选和子图同构判定两个步骤。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# 第九章 知识推理


    前序章节对知识的表示方法以及知识的获取方法进行了介绍，本章介绍知识图谱的另一个重要任务：知识推理。本章将详细地描述知识图谱中的典型推理任务以及推理方法。


    # 9.1 知识图谱中的典型推理任务


    相对于无结构的数据形式，结构化知识图谱的一大优势就是能够支撑高效的推理。知识推理是人工智能应用迈向更高级认知智能的重要技术，其中，知识图谱的构建和应用中较为典型的推理任务包括知识补全和知识问答，下面对它们进行简要描述，然后详细介绍不同类型的知识推理策略和方法。


    # 9.1.1 知识补全


    知识补全，通常也被称为面向知识库或知识图谱的事实补全。虽然知识图谱中包含大量有价值的结构化数据，但是，它是非常不完备的，例如，知识图谱中包括了人物“A”及其“出生地”信息，但是没有包括他/她的“国籍”信息，虽然知识图谱中人物类概念定义了“国籍”属性，但是由于没有直接给出A的该属性值，也就是说，知识实例数据“国籍(A,?)”在知识图谱中是缺失的。形式化地描述就是，对于具有
    r(h,t) 形式的三元组知识图谱，若 h,r 或 t 是未知的，需要使用推理方法将缺失的实体或关系预测出来的（即用？表示的部分），这样的任务称为链接预测。在以关系三元组为基础的知识图谱上，链接预测是知识补全的重要技术手段。知识补全可以利用已有知识预测未知的隐含知识，它可以用于完善现有知识图谱，是知识图谱构建和应用的重要手段之'
