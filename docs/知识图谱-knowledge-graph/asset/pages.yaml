    # 9.2.3 符号推理和数值推理


    符号推理又可以看成是传统的逻辑推理，它的特点就是在知识图谱中的实体和关系符号上直接进行推理操作。与符号推理相对应的就是数值推理，数值推理就是使用数值，尤其是向量矩阵等数值计算的方法，捕捉知识图谱上隐式的关联，模拟推理的过程。本书后续的部分按照这种分类方式对知识图谱上的推理技术进行介绍。


