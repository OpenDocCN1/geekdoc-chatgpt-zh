    为了更好地进行知识的组织和管理，知识库系统通常需要支持描述性语言，这种语言主要用于知识检索和知识推理，例如，Freebase 提供的 MQL[资源 10-8]，W3C
    组织制定的 SPARQL[资源 10-9] 等。类似于结构化查询语言 SQL 在关系数据库中的作用，知识库的描述性语言不仅可以为用户提供统一的交互接口，还能更方便地描述


    抽象知识（如逻辑规则）和执行复杂查询。


