  md: '自动机的方法、基于框架的方法和基于概率模型的方法。


    基于有限状态自动机的方法：这是一种最简单的对话管理架构。如图 10.18 所示，它把任务完成过程中系统向用户询问的各个问题表示为状态，而整个对话可以表示为状态之间的转移。状态转移图可以用有限状态自动机进行描述，状态图中的节点表示系统询问用户各个“槽”值的提示语句，节点间的边表示用户状态的改变，节点间的转移控制着对话的进行。对话过程中，用户的输入对应着特定“槽”的信息，系统根据用户输入的信息从当前状态转移到下一个状态，当任务完成的时候，即完成了一次对话的交互。


    图 10.18 描述的是一个订购火车票的对话系统状态转移图。系统需要一步一步从用户的话语/回复中获取所需订购火车票的出发站、到达站、类型、出发时间、座位类型等信息，并通过确认信息最后完成订购任务。需要说明的是，整个规划流程都是事先预定好的，也就是说需要先提供“出发站”和“到达站”然后才能提供“座位类型”信息，它无法处理含有更多信息的对话。如果系统在咨询出发城市的时候，用户还提供了如“出发时间”等更多类型的数据，对话系统是无法识别这些信息的，它需要完全按照状态自动机中的状态转移过程重新询问这些信息。


    ![](img/9549a57f481f525254296dec39e94079_261_0.png)


    图 10.18 基于有限状态自动机的对话管理示意图'
