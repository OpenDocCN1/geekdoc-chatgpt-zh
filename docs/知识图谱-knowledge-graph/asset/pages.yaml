  md: '是，在知识图谱领域，从文本中识别实体不仅仅局限于命名实体，还包括其他类别的实体，特别是领域实体，例如：股票名、汽车品牌、餐馆名等。与实体识别相关的任务是实体抽取，其区别在于实体抽取的目标是在给定语料的情况下，构建一个实体列表，并不需要在每个句子中确定实体的边界，例如：构建一个歌曲名列表。


    （2）实体消歧：实体消歧任务的目标是消除指定实体的歧义。例如，对于“李娜于 2011 年获得法国网球公开赛的冠军”中的“李娜”，系统需要自动判别出这个实体指称项（Entity
    Meniton）“李娜”指的是打网球的“李娜”，而不是其他的“李娜”（叫“李娜”的人很多，有歌手“李娜”、跳水运动员“李娜”、体操运动员“李娜”等）。实体消歧对于知识图谱构建和应用有着重要的作用，也是建立语言表达和知识图谱联系的关键环节。从技术路线上划分，实体消歧任务可以分为实体链接和实体聚类两种类型。实体链接是将给定文本中的某一个实体指称项链接到已有知识图谱中的某一个实体上，因为在知识图谱中，每个实体具有唯一的编号，链接的结果就是消除了文本指称项的歧义。实体聚类的假设是已有知识图谱中并没有已经确定的实体，在给定一个语料库的前提下，通过聚类的方法消除语料中所有同一实体指称项的歧义，具有相同所指的实体指称项应该被聚为同一类别。


    （3）关系抽取：关系抽取的目标是获取两个实体之间的语义关系。语义关系可以是一元关系（例如实体的类型），也可以是二元关系（例如实体的属性）甚至是更高阶的关系。在现有的知识图谱中，所处理的语义关系通常指的是
    一元关系和二元关系。根据抽取目标的不同，已有关系抽取任务可以分为：关系分类、属性抽取、关系实例抽取等。关系分类任务是判别给定的一句话中两个指定实体之间的语义关系。例如：“姚明
    1981 年出生于上海”，假设我们已经识别出“姚明”和“上海”两个实体，关系分类的目标是判别出它们之间具有“出生地”的关系。属性抽取的任务是在给定一个实体以及一个预定义关系的条件下，抽取另外一个实体。例如：“姚明
    1981 年出生于上海”，假设我们已经识别出“姚明”，给定“出生地”这个关系，属性抽取的目标是从这句话中把表达姚明出生地的属性值抽取出来，即“上海”。关系实例抽取的任务包括判断实体间关系和抽取满足该关系的知识实例数据。例如，给定“姚明”和“上海”，基于现有知识图谱和文本数据抽取和判断他/它们之间的关系。在知识图谱中，包含多种类型的语义关系，例如：上下位关系、部分整体关系、属性关系等。关系抽取对于构建知识图谱非常重要，是图谱中确定两个节点之间边上语义信息的关键环节。然而关系抽取也十分困难，因为对于同一语义关系的自然语言表达多种多样、十分丰富。另外，根据标注数据以及运用场景的不同，已有关系'
