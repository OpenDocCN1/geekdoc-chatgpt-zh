- pgno: 36
  md: '# 1.4 知识图谱生命周期


    在构建和应用知识图谱的过程中有几个重要环节，主要包括知识体系构建、知识获取、知识融合、知识存储、知识推理和知识应用等，下面分别对它们进行简要介绍。


    # 1.4.1 知识体系构建


    知识体系构建，也称知识建模，是指采用什么样的方式表达知识，其核心是构建一个本体对目标知识进行描述。在这个本体中需要定义出知识的类别体系、每个类别下所属的概念和实体、某类概念和实体所具有的属性以及概念之间、实体之间的语义关系，同时也包括定义在这个本体上的一些推理规则。例如，Freebase
    定义了 2000 多个概念类型和近 4 万个属性。Freebase 对每个类型定义了若干关系，并制定关系的值域约束其取值（详细内容请参考第三章第 3.1.3
    节）。知识图谱是随着语义网的发展而出现的概念，在语义网出现之前，万维网上的文档通过超链接进行关联，浏览器通过分析 HTML 文档的语法显示文档的内容，这些内容并不能告诉计算机文档中的数据分别表示什么含义。语义网是万维网之父蒂姆·伯纳斯·李（Tim
    Berners-Lee）在 1998 年提出的概念，他呼吁和提倡使用资源描述框架 RDF 和本体语言 OWL 的形式化模型将万维网上文档的内容表达为计算机能够理解的语义。语义网的核心是让计算机能够理解文档中的数据，以及数据和数据之间的语义关联关系，从而使得计算机可以更加自动化、智能化地处理这些信息。语义网技术涉及面较广，本节只介绍与知识图谱数据建模紧密相关的核心概念——资源描述框架（RDF）。RDF
    的基本数据模型包括了三个对象类型：资源 (resource)、谓词 (predicate) 及陈述 (statements)。


    +   - **资源**：能够使用 RDF 表示的对象称之为资源，包括互联网上的实体、事件和概念等。

    +   - **谓词**：谓词主要描述资源本身的特征和资源之间的关系。每一个谓词可以定义元知识，例如，谓词的头尾部数据值的类型（如定义域和值域）、谓词与其他谓词的关系（如逆关系）。

    +   - **陈述**：一条陈述包含三个部分，通常称之为 RDF 三元组 < 主体 (subject)，谓词 (predicate)，宾语 (object)>。其中主体是被描述的资源，谓词可以表示主体的属性，也可以表示主体和宾语之间的关系。当表示属性时，宾语就是属'
  merge: -1
  img_proc: true
- pgno: 37
  md: '性值；当表示关系时，宾语也是一个资源。


    目前，知识图谱中的数据也采用 RDF 数据模型进行描述。在知识图谱中，上述的“资源”称为实体或者实体的属性值，“谓词”称为关系或者属性，“陈述”指的是 RDF
    三元组，一个三元组描述的是两个实体之间的关系或者一个实体的属性。如三元组“首都（中国，北京）”，其中“首都”是关系，“中国”是头实体，“北京”是尾实体；而在三元组“国籍（姚明，中国）”中，“国籍”表示属性，“姚明”表示头实体，“中国”表示属性值。


    # 1.4.2 知识获取


    知识获取的目标是从海量的文本数据中通过信息抽取的方式获取知识，其方法根据所处理数据源的不同而不同。这里介绍的数据源通常指百科知识图谱的数据源，垂直领域的数据源为各自领域的文本数据。


    知识图谱中数据的主要来源有各种形式的结构化数据、半结构化数据和非结构化文本数据（纯文本）。从结构化和半结构化的数据源中抽取知识是工业界常用的技术手段，这类数据源的信息抽取方法相对简单，而且数据噪声少，经过人工过滤后能够得到高质量的结构化三元组。学术界主要集中在非结构化文本中实体的识别和实体之间关系的抽取，它涉及自然语言分析和处理技术，难度较大。因为互联网上更多的信息都是以非结构化文本的形式存在，而非结构化文本的信息抽取能够为知识图谱提供大量较高质量的三元组事实，因此它是构建知识图谱的核心技术。


    # 1. 结构化数据


    结构化数据可以来自于各个企业内部数据库中的私有数据，也可以是网页中看到的表格数据。这一类数据普遍质量较高，而且长期存在，不易随时间的变化而改变。结构化数据的优点是置信度高，数据质量可靠；缺点是数据规模小，不容易获得。网络百科中的信息框是典型的结构化数据，其数据结构化程度很高，而且整个网站中信息框的结构样式统一，可以直接采用模板的方式提取实体相关的属性和属性值。图
    1.9 所示是关于实体姚明的属性信息框，其中的数据可以直接提取。除了网络百科类的结构化数据之外，网络中还存在大量结构化数据，例如：Linked Open Data（LOD）项目。目前，LOD
    不仅包含了大量高质量的通用语义数据集，如 DBpedia 和 YAGO 等，还包含了如 MusicBrainz 和 DrugBank 等特定领域的知识图谱。因此，可以通过整合提升知识图谱的知识覆盖率。除此以外，Web
    上也存在大量高质量的垂直领域站点，如电商网站和点评网站等，它们的数据中也保存了大量领域相关结构化数据并以 HTML'
