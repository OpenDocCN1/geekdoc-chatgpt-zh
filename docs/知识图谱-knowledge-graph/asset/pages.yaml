    WordNet 等。基于统计的方法通过词的上下文对当前词进行表示，并基于该表示对得到的领域术语进行层次聚类。聚类结果中，不同层次类别内的术语构成了上下位关系。


    # （3）概念属性及关系抽取


    以上步骤获得了知识体系涉及的概念及概念间的分类关系，还需要为概念定义属性及关系 [236, 494]。在实践中，一般将关系也视作概念的属性，采用统一的过程对它们进行抽取。属性和关系也可以看做是一种概念，因此属性及关系的抽取过程和概念的抽取过程类似。首先利用词法、句法分析等工具对文本进行预处理，并通过规则或模板的方法为给定的概念获取候选的属性集合。然后利用统计方法定量地评估每个候选属性的置信度，过滤掉低质量的属性。和概念抽取的任务类似，上一步获得的属性集合中同样存在同义词的情况，例如“出生地”和“故乡”表达了相同的含义，因此需要在候选属性集中进行同义词识别（识别方法和概念抽取中介绍的方法相同）。


    # 2. 基于结构化数据的知识体系学习


    结构化数据是指具有严格定义模式的数据，主要是指存储于关系数据库中的数据。关系数据库采用关系模型对现实世界中的信息进行建模，这种模型具有两个明显的优点：① 首先是关系模型的结构简单，便于理解。所有的对象在关系数据库中都通过二维表格进行表示及存储。②
    关系模型具有很强的理论基础，关系代数强有力地支持了关系模型，使得关系数据库能够得到广泛的应用。


    基于结构化数据的知识体系学习的主要任务是分析关系模型中蕴含的语义信息，并将其映射到知识体系的相应部分 [22]。在关系数据库中，实体及其关系都以二维表的形式进行表示及存储。因此无论是概念的抽取还是概念间关系的抽取，首先需要识别出数据库中哪些项描述实体，哪些项描述实体间关系。可以通过分析数据表的字段内容、主键、外键等信息实现上述目标。在进行关键信息的抽取时，可以从描述实体的表中抽取出实体的概念（即本体类型）及实体的属性，从描述关系的表中抽取出概念间的关系。基于以上获得的信息能够构建一个初步的知识体系，然后需要进一步对该知识体系进行评估和修正，生成最终的知识体系。


    # 3. 基于半结构化数据的知识体系学习


    半结构化数据和非结构化数据相比具有一定的模式，但这种模式并不严格，典型的半结构化数据有 XML 格式的数据、HTML 格式的网页数据以及它们遵'
