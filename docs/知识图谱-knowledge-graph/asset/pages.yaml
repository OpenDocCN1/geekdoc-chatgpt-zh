- pgno: 235
  md: '# 第十章 知识问答与对话


    近年来，知识图谱发展迅猛，它们不仅在数据规模和领域数量上快速增长，而且很多高质量数据可以免费获取。这些高质量的结构化知识数据在各个应用中发挥着重要作用，例如商品推荐、商业智能、决策支持等。作为一种描述自然知识和社会知识的重要载体，知识图谱最直接和最重要的任务是满足用户的精确信息需求，提供个性化知识服务。其中，致力于回答各种类型问题的问答和对话系统是最典型的任务之一。例如，人们经常希望计算机系统能自动回答如下问题：


    +   （1）屠呦呦是哪里人？

    +   （2）华为公司的创始人毕业于哪所大学？

    +   （3）被称为“六朝古都”的是中国哪座城市？

    +   （4）今天晚上有哪些从北京到上海的国航航班？


    如果没有知识图谱，我们也可以利用搜索引擎、导航网站等应用获得相关信息，如图 10.1 示例所示。搜索引擎对“哪些诺贝尔奖获得者的子女也得了该奖”的返回结果，它们只包含一些具体时效性的网页，而不能得到精准的答案。也就是说，这些信息获取方式只能返回相关的文档集合，用户需要自行阅读并分析这些文档进而获取精确信息。本章介绍问答和对话的相关技术并主要关注面向知识图谱的问答和对话。作为知识图谱的典型应用，问答和对话系统能够接受自然语言形式描述的问题，通过问句分析、知识抽取、知识推理等操作自动得到精确答案。例如，对于上述四个问题分别得到“宁波市”“重庆大学”“江苏省省会南京市”和“CA1858”的答案。诚然，目前的问答和对话系统大多只能回答事实型问题，不能很好地处理复杂问题，例如：“为什么天空是蓝色的？”“如何制作一盘精美的宫保鸡丁？”“如果殖民火星，哪些行业会最先发达？”等。本章主要关注问答和对话中能够回答事实型问题的相关技术。本章首先对整个自动问答的发展历史和不同的问答类型进行简要介绍，然后分别介'
  merge: -1
