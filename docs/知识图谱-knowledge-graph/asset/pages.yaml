  md: '以上是 Zettlemoyer 和 Collins$^{[522]}$ 提出的从“句子–逻辑表示式”对中构造初始辞典的基本方法。实际上，通过使用这些辞典项对训练集中的句子进行解析，可能产生一个或多个高得分的分析结果。从这些分析结果中抽取出产生高得分的辞典项加入原始辞典，一直重复该过程直到无法添加新辞典项为止。


    可以看出，上面的方法虽然容易实现，但是严重依赖人工设计的模板，不容易扩展到其他领域和其他语言中。为了解决这个问题，Kwiatkowski 等人$^{[256]}$提出了一种不依赖于模板和语言的方法，该方法依赖于逻辑学中的高阶合一操作（higher-order
    unification），把完整的逻辑形式切分成子逻辑形式的组合。这种方式可以有效地扩展辞典项，具有更好的泛化性能；此外，Wong 等人$^{[489]}$通过利用
    IBM 翻译模型学习自然语言句子（问句）与逻辑表示式之间符号的对齐关系解决这个问题。该方法的假设是逻辑表达式包含了与句子（问句）相同意思的不同语言表达，而机器翻译的对齐模型能够学习不同语言之间符号的对应关系，这种基于不同语言句子对齐的方式经常用于帮助获取初始辞典和估计初始参数$^{[522,
    524]}$。但是，包括参考文献 [256, 257, 522–524] 在内的传统方法通常只在某些限定领域和小规模知识库中达到较好的效果。当面对如 Freebase
    和 DBpedia 这样的大规模知识图谱的时候，这些依赖于人工编写规则和模板的辞典构造方式$^{[522]}$往往难以满足要求。因此，大规模知识库的问句解析中的一个重要任务就是扩展限定领域中的辞典。近年来有不少工作$^{[49,
    77]}$都尝试解决该问题，这些方法的主要思想是通过文本与知识库间的对齐关系，学习到文本与知识库中不同符号的关联程度。


    # 3. 组合消歧模型


    为了解决解析过程中遇到的歧义问题，人们提出了相应的概率模型，例如针对组合范畴语法（CCG）的概率化组合范畴语法模型（PCCG）。以下以 PCCG 为例，说明在解析过程中如何利用概率模型进行消歧。PCCG
    对于 CCG 的作用类似于在句法分析中的概率化上下文无关文法模型（PCFG）对上下文无关文法模型（CFG）的作用。PCCG 定义概率模型，计算句子 $S$
    最有可能转换成的逻辑表达式 $L$


    $$\arg\max_{L} P(L|S;\theta) = \arg\max_{L} \sum_{T} P(L,T|S,\theta) \tag{10.1}$$


    其中，一个逻辑表达式 $L$ 可能由多个解析树 $T$ 产生，生成逻辑表达式 $L$ 的概率由累加所有可以生成该结果的分析树产生，$\theta \in R^{d}$
    是概率模型的参数，其参数值（权重）需要通过学习得到。


    大多数方法都采用对数线性模型（log-linear model）建模这种结构化预测'
