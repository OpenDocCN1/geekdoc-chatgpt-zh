- pgno: 153
  md: '# 第七章 事件抽取


    前面的章节已经介绍了实体抽取和关系抽取的技术，本章主要对事件抽取技术进行介绍。事件抽取不仅是构建知识图谱的关键任务也是自然语言处理的难点和热点问题之一。从任务层面看，相较于实体抽取和关系抽取，事件抽取面临的挑战更大。因为事件抽取以命名实体为基础，命名实体抽取效果的好坏将直接影响事件抽取的结果。进一步，实体关系抽取需要识别出符合某种语义关系的实体对，一般只涉及到两个实体的语义关系，任务相对简单。而对事件抽取而言，首先要识别出文本中是否存在关心的事件，其次要识别出事件所涉及的元素（一般是实体），最后需要确定每个元素在事件中所扮演的角色。从自然语言分析技术层面看，事件抽取不仅需要底层的语言学知识，还需要更为深层的语义和篇章知识才能完成。本章首先介绍事件和事件抽取的定义，然后介绍事件抽取相关的评测和语料资源，最后介绍限定域事件抽取和开放域事件抽取中的典型方法以及事件关系抽取的任务和典型方法。


    # 7.1 任务概述


    # 1. 事件的定义


    事件（event）起源于认知科学，常常在哲学、语言学、计算机科学等领域被广泛讨论[82, 154, 175, 392, 465, 516, 533]。但遗憾的是目前对事件还没有统一的定义，在不同领域，不同的应用，不同的人对事件有不同的描述。


    从认知的角度，世界上发生的所有事情都被定义为事件，认知学家认为人们是通过认识事件以及事件之间的联系来观察和了解世界的[124]。从哲学角度，事件被定义为现实世界中事实的具体表现[392]。在语言学领域，Miller
    等[337] 在'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'WordNet 中将事件定义为在某个具体的时间和地点发生的事情。Chung 等[96]认为一个事件是一个包含三部分信息的术语：谓词、谓词发生的时间、谓词发生的环境或者条件。Timber
    等[462]认为事件是在一定条件下，发生在具体的时间和地点的，包含一个或者多个参与者的事情。在自动文摘领域，Filatova 等[156]认为所有的事件都能通过一句话概括表述，事件是一个动词及其涉及的行为动作的主要组成部分（参与者、时间和地点等）。Pustejovsky
    等[386]从语义理解的角度给出了事件的定义，认为事件就是动词及其涉及的相关语义元素所描述的语义信息。在本体模型研究领域，Liu 等[298]认为事件是发生在某个特定的时间和环境下，由若干角色参加，表现出若干动作特征的一件事情。在信息检索领域，事件被认为是细化了的用于检索的主题，话题检测与追踪（Topic
    Detection and Tracking, TDT）评测会议上将事件定义为由某些原因、条件引起，发生在特定时间、地点，涉及某些对象（人或物），并可能伴随某些必然结果的事情[29]。


    本书主要面向知识图谱领域，本章主要介绍构建知识图谱过程中事件知识的抽取方法。因此，同信息抽取领域中最具国际影响力的自动内容抽取（Automatic Content
    Extraction, ACE）评测会议中对事件的定义类似，本书认为：


    事件是发生在某个特定的时间点或时间段、某个特定的地域范围内，由一个或者多个角色参与的一个或者多个动作组成的事情或者状态的改变[131]。


    从上述定义中可以看出，事件中最重要的几个要素是事件发生的时间、地点、参与事件的角色以及与之相关的动作或者状态的改变。不同的动作或者状态的改变代表不同类型的事件，例如：出生和死亡是两个不同类型的事件，就任和辞职也是两个不同类型的事件。同一个类型的事件中不同的时间、地点和角色代表了不同的事件实例，例如：马克思的出生和恩格斯的出生是两个不同的出生事件实例。另外，在某些同一个类型的事件中不同粒度的事件中不同粒度的事件实例，例如：第二次世界大战、抗日战争和淞沪会战由于时间长短、地域大小和参战双方规模等事件元素不在同一个粒度，所以事件也是不同粒度的。不同的应用场景会定义不同类型、不同粒度的事件。


    # 2. 事件抽取定义


    事件抽取主要研究如何从描述事件信息的文本中抽取出用户感兴趣的事件信息并以结构化的形式呈现出来，如什么人，什么时候，在什么地方，做了什么事[27]。因为从结构化文本和半结构化文本中抽取事件相对简单，本章主要介绍如何从非结构化文本中抽取事件知识。该任务首先从非结构化文本中识别出事件及其类型，然后抽取出该事件所涉及的事件元素。例如下面几段自然语言文本分别描述了不同类型的事件：


    +   (1) 成龙和林凤娇于 1982 年 12 月 1 日在洛杉矶举行婚礼。'
