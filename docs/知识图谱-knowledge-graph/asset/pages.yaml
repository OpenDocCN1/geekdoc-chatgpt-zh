  md: '述信息利用。但是列表型的数据没有上下文描述信息，因此对消歧带来了很大的挑战。Shen 等[427] 假设在列表中出现的实体往往具有相同的概念类型，如都是运动员、影视作品或者畅销小说等。因此他们提出了利用实体流行度和上下文实体联合消歧的方法。在基于
    Wikipedia 和网络文本的数据集上能达到 90% 左右的正确率。另外，Vasilis 等[142] 提出基于检索的列表型实体消歧方法，主要是将待消歧的实体输入到搜索引擎中，然后根据检索得到的网页信息对实体类别进行判断，进而辅助实体消歧。除此之外，Xu
    等[501] 提出了一种基于特征的 infobox 实体链接方法，主要是抽取待消歧实体的七种特征，最后利用极大似然估计的方法训练七项特征的权重大小，得到最有效的特征是实体的流行度的结论，这一点与
    Shen 等[427] 的工作类似。总之，在结构化文本的实体消歧方法中主要是利用实体的类别信息、实体的流行度和列表中的其他信息进行消歧。


    # 5.5 小结


    实体消歧技术是构建知识图谱的关键技术，能用于解决文本信息中广泛存在的实体歧义问题。本章首先介绍了实体消歧的任务和相关评测，然后介绍了实体消歧的任务分类，最后对典型方法进行了介绍。目前针对任务领域的不同主要有面向结构化文本的实体消歧和面向非结构化文本的实体消歧，其中面向非结构化文本的实体消歧应用最为广泛，主流方法有基于聚类的实体消歧和基于链接的实体消歧，两类方法中的核心问题都是计算待消歧实体与候选实体的语义相似度。基于聚类的实体消歧方法包括基于表层特征的相似度计算方法、基于扩展特征的相似度计算方法和基于社会化网络的相似度计算方法。基于链接的实体消歧方法包括基于向量空间模型的相似度计算方法、基于主题一致性模型的相似度计算方法、基于协同实体链接模型的相似度计算方法以及基于神经网络的相似度计算方法。近些年基于神经网络的相似度计算方法占据了主导地位。'
