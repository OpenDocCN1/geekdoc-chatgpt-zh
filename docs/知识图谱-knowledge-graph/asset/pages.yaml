    # 算法 2 AMIE 算法


    ```

    输入： 知识库 K

    输出： 规则集合 q

    1: q = ⟨[]⟩

    2: while ¬q.isEmpty() do

    3:   r = q.dequeue()

    4:   if r is closed ∧ r is not pruned for output then

    5:     Output r

    6:   end if

    7: end while

    8: for all operators o do

    9:   for all rules r′ ∈ o(r) do

    10:    if r′ is not pruned then q.enqueue(r′)

    11:   end if

    12:  end for

    13: end for

    ▷ 并行执行

    ```


    算法 2 中描述了一个典型的规则挖掘算法的一般步骤，被称为 AMIE（Association Rule Mining Under Incomplete evidence）[168]
    算法。算法的一开始设立了一个路径的队列 q，并向其中插入一条长度为 0 的规则作为初始化；如果队列 q 是非空的，那么将弹出它队列头位置的路径 r，并将路径
    r 从队列中删除；首先判断规则 r 是否像上面规则实例一样是一个闭回路，如果是，那么把这条规则作为候选输出，如果不是，就向路径 r 上增加边。增加边可以根据边的不同类别分为如下三类操作：


    +   - 增加悬挂边（Dangling）：悬挂边是指边的一端是一个未出现过的变量，而另一端是在规则中出现过的。

    +   - 增加具体边（Instantiated）：具体边与悬挂边类似，边的一端也是在规则中出现过的，但另一端是未出现过的常量，也就是知识图谱中的实体。

    +   - 增加闭合边（Closing）：闭合边则是连接两个已经存在于路径中元素的边，它的加入没有为路径引入更多的元素，而是使路径成为一条闭合的回路。


    对于搜索获得的新的路径集合，算法对其进行剪枝操作，而留下来的路径则被加入到路径队列中，开始新一轮的循环，直到队列 q 为空为止。剪枝的算法可能是人为定义的规则，也可能是根据路径的统计量，例如上面介绍过的支'
