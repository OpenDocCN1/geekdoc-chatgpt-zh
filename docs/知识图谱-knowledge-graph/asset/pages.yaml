    # 3.1.1 人工构建方法


    知识体系具有很高的抽象性及概括性，目前高质量的知识体系只能通过人工构建。早期，人们比较直接地构建了关于概念（类型）、概念属性和概念之间关系的知识体系 [79,
    448]。但是，随着知识需求在不同领域和不同行业的增长，例如需要建模事实成立的时间和空间信息、需要建模复杂的且有关联的多事实组合信息等，人们逐步构建出能够描述时空、事件等信息的知识框架
    [61, 210]。例如，YAGO2 通过把 YAGO 中的三元组事实表示为五元组形式来记录事实成立的起止时间和空间信息，Freebase 通过定义组合数据类型（Compound
    Value Types，CVT）描述时空、事件信息，FrameBase 用语义框架的形式描述了 N 元关系 [408]。


    人工构建知识体系的过程可以分为如下六个主要阶段：确定领域及任务、体系复用、罗列要素、确定分类体系、定义属性及关系、定义约束。上述阶段在实践中并非严格的线性关系，有时需要回退到更早的阶段。下面分别对上述各个步骤及其做法进行详细介绍。'
  merge: -1
