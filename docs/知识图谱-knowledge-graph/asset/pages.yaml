    ```

    < 出生信息 135，人物，马克思·普朗克 >

    < 出生信息 135，时间，1858 年 >

    < 出生信息 135，地点，丹麦基尔 >

    ```


    同样地，马克思·普朗克 1919 年获得诺贝尔奖，也可以转化如下形式：


    ```

    < 获奖信息 87，人物，马克思·普朗克 >

    < 获奖信息 87，时间，1919 年 >

    < 获奖信息 87，名称，诺贝尔奖 >

    ```


    上述表示虽然是多元关系的无损转化，但引入的中间变量“出生信息 135”（或“获奖信息 87”）使得“出生”（或“获奖”）的论元不能直接相连，这样增加了表示的复杂性，也加大了后续处理的难度。为此，一些方法被用来改进这种表示，例如将三元组扩展为内容更丰富的六元组，包含主语、谓词、宾语、时间、地点、附加信息，但是，这种方式依然难以很好地覆盖所有谓词的信息。因此，如何更好地扩展
    RDF 的表达形式依然是一个开放的问题。


    上面介绍了 RDF 的知识表示方式，知识表示后，需要存取相关知识。RDF 也有自己的查询语言，研究者为 RDF 开发了一套类似于 SQL 语句中 select-from-where
    的查询方式，SPARQL 是这种查询方式的一种实现，有关 SPARQL 查询的具体操作会在第八章——知识存储和检索中详细介绍。


    与 XML 表示方式类似，标准的 RDF 同样是领域无关的。这既是 RDF 的优点，使其具有更大的自由度，但也成了它的缺点，使得同一领域中的不同知识内容难以交互和融合。为此，RDF
    Schema(RDFs) 被提出用来定义领域相关的知识。不同于 RDF，RDFs 是一种用于描述 RDF 的轻量级语言，主要关注类别和属性的层次结构以及继承关系等。


    例如，可以用如下描述词汇“rdfs: Class”把“人物”和“出生地”定义为两个类。


    ```

    < 人物, rdf:type, rdfs:Class>

    < 物理学家, rdf:type, rdfs:Class>

    ```'
