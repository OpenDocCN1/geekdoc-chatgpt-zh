  md: '问题。PCCG 对分析结果定义了如下的概率模型


    $$P(L,T|S,\theta)=\frac{e^{f(L,T,S)\cdot\theta}}{\sum_{(L,T)}e^{f(L,T,S)\cdot\theta}}\tag{10.2}$$


    其中，函数 $f$ 用于从 $(L,T,S)$ 中抽取属于 $R^d$ 的特征向量，每个特征表示了 $(L,T,S)$ 中的某个子结构，分母对满足语法的所有有效分析结果的得分进行求和。


    # 10.2.2.2 无监督方法


    问句解析是希望把自然语言转换成可以在知识库中直接查询的形式化语句（如对应 Semantic Web 中的 SPARQL 语句），有一些工作利用人类总结的经验指导这种转换，无需基于形如（自然语言问句，逻辑表达式）或（自然语言问句，答案）的监督数据训练解析模型。典型的转换过程包括：①
    问句分析：该步骤把自然语言问句转换成查询语义三元组的形式（query triplets）；② 资源映射：对 Query Triplet 中的每个短语，确定其在知识库中的对应资源；③
    形式化查询语句的生成：对不同类型的问题依据不同的模板生成 SPARQL 语句。PowerAqua 系统^{[299]} 是 AquaLog 系统^{[300]}
    的后续版本，通过融合多个异质知识库来回答问题。


    PowerAqua 是 Lopez 等人在 2011 年提出的系统，该系统可以定位和整合多个知识库中的语义资源。PowerAqua 使用流水线式框架，共有以下
    4 个步骤，如图 10.9 所示（图 10.9 引自参考文献 [299]）：


    +   1. 语言分析工具模块（linguistic component）：该模块分析自然语言问句中词语之间的关系，得到一系列三元组查询表示（subject,
    property, object），称为 Query-Triples。这样就把用户的信息需求表示成了基于三元组的形式化语言表示。\n2. 元素级匹配模块 PowerMap：该模块确定哪些和用户问句相关的语义资源应该被应用。这个工作是利用句法分析技术实现的，从各个知识库中找出
    Query-Triples 可能对应的资源。然后，语义验证模块用来消歧，确保同一个问题中的词不会有多种不同的解释。\n3. 三元组映射模块（triple similarity
    service, TSS）：该模块充分利用问句的上下文信息，以及上一步选择的实体周围的知识库信息，从整体上确定用户提出问句的最有可能的解释。在这个步骤中，抽取那些和已有
    Query-Triples 最匹配的知识库三元组，进而把已有的查询三元组 Query-Triples 映射到具体的各个知识库中的三元组上，得到 Onto-Triples。这一步骤用到了很多启发式规则来限制候选集合，避免计算复杂度过高。'
