  img_proc: true
- pgno: 203
  md: '一。知识补全包含两个常用评测任务，三元组分类和链接预测。


    （1）三元组分类：三元组分类是判断给定三元组 r(e1,e2) 正确与否（与事实是否相符合），例如“首都（北京，中国）”是正确的，而“首都（成都，中国）”是错误的，因此它是一个二分类问题。通过三元组分类来实现知识补全过程如下：在补全知识图谱缺失关系时，可以选一条边（“边”表示“关系”）连接任意两个实体，构成新的三元组，再判断该三元组是否正确。如果正确，则说明新增加的关系是合理的，意味着发现了一个缺失的关系，可以将其添加到知识图谱中；否则丢弃该条边。


    （2）链接预测：链接预测指的是预测一个三元组的头实体或者尾实体。对一个正确的三元组，移除它的头实体或者尾实体，检验模型能否预测出正确的头实体或者尾实体。链接预测实现知识补全过程如下：在知识图谱中选择一个实体和一个关系，该实体可以作为头实体也可以作为尾实体。当作为头实体时，对尾实体进行预测；当作为尾实体时，对头实体进行预测。如果模型能够准确预测头或者尾实体，则说明可以在选择的实体和预测出的实体之间添加关系，否则丢弃该关系。


    # 9.1.2 知识问答


    作为知识图谱的典型应用，基于知识的问答主要是通过对自然语言问句的分析，在语义理解的基础上从知识图谱中寻找答案的过程。问答中需要推理的本质原因同样是知识的缺失，问答过程中需要的知识可能在知识图谱中没有显式表达，需要通过推理才能获取隐含知识。本章根据知识缺失的形式，可以将需要推理的情景分为以下两类，关于知识问答的详细内容见后续章节。


    （1）简单推理问题：如何将问题转化成知识图谱上的一个查询三元组 r(h,?) 或查询三元组序列 r1(h,m1),r2(m1,m2),…,rn(mn-1,?)，并且存在知识图谱中缺失其中某个或某几个三元组的情况，需要使用推理方法将缺失的知识预测出来，我们将这一类问题划分为简单推理问题。例如，对于问题“唐朝的开国皇帝是谁？”，若开国皇帝（唐朝，李渊）在知识图谱中是缺失的，这时就需要推理将其预测出来，这一类问题很容易转化成前文的链接预测——开国皇帝（唐朝，X），使用知识图谱上的推理方法可以解决。类似地，对于问题“唐朝的开国皇帝的父亲是谁？”，可以分为两步：若开国皇帝（唐朝，李渊）缺失，则先对其进行推理，在获得这一知识后，再对父亲（李渊，X）在知识图谱上进行查询（知识图谱包含该实例）或继续推理（知识图谱不包含该实例）。


    （2）复杂推理问题：如果问题不能转化成一个知识图谱上的链接查询 r(h,t)，'
