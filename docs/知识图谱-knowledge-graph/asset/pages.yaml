  md: '基于框架的方法：任务型对话系统实质上是获取/填充任务对应表中各个“槽”的值，例如，订购火车票系统就是需要从用户获取值填充出发站、到达站、类型、出发时间、座位类型等“槽”信息。只要能通过用户提供的“槽”值确定记录（获取了所需的全部信息），就能够完成任务（如表
    10.2 所示）。由于使用任务常用框架进行表示，因此该方法被称为基于框架的方法，由于对话是填充任务记录各个槽值的过程，因此也常被称为基于槽填充的方法。基于框架的对话方法就是确定这些所需全部“槽”值的过程，并在对话过程中不断填充和修改对话状态（如用向量表示框架各个“槽”的填充情况）。对话管理系统根据各个“槽”的填充情况控制对话的过程。由于可以一次获取框架中的多个“槽”值，因此，不需要重新询问用户已经提供过的信息。另外，填写各个“槽”值的时候也不需要按照固定顺序进行。因此，相较于基于有限状态自动机的对话管理系统，这类系统更灵活，它能够适应更多的对话类型。由于它不需要预先确定所有对话流程，因此可以根据当前用户的意图与对话的上下文信息来决定下一步对话操作。


    # 表 10.2 任务的槽和对应的系统提问


    | 槽 | 系统提示问题 |

    |---|---|

    | 始发站 | “从哪出发？” |

    | 到达站 | “去哪？” |

    | 出发时间 | “您准备坐几点出发的车？” |

    | 类型 | “是选择什么类型的车？高铁、动车还是其他的？” |

    | 座位类型 | “请问您选择什么类型的座位？” |


    基于概率模型的方法：基于有限状态自动机和基于框架的对话系统都需要人工定义规则，非常耗费人力与时间，而且人工定义的规则集合难以保证列出所有规则，覆盖率不够。因此，人们提出了基于概率统计的对话管理方法，使用数据驱动的方法自动学习对话模型。对话过程是一个连续决策任务，一个好的决策应该是选择各种动作，这些动作集合的目标是最大化完成最终任务的回报（reward）和最小化损失（cost）。因此，可以利用马尔可夫决策过程（Markov
    Decision Process，MDP）进行建模。MDP 是一种可以应用在对话管理系统上的概率模型，通过分析对话数据学习到决策规则，在一定程度上克服了人工定义规则覆盖率不足的问题。使用该模型对对话系统建模，能够利用强化学习（Reinforcement
    Learning）技术基于特定回报/损失求解最优对话策略，学习对话管理模型。图 10.19 描述的是基于 MDP 模型的对话系统模型。'
