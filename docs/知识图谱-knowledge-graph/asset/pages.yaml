  img_proc: true
- pgno: 55
  md: '语义网络是一个通过语义关系连接的概念网络，它将知识表示为相互连接的点和边的模式，其中，节点表示实体、事件、值等，边表示对象之间的语义关系。也就是说，语义网络其实是一种有向图表示的知识系统，节点代表的是概念，而边则表示这些概念之间的语义关系。语义网络中最基本的语义单元称为语义基元，可以用三元组形式表示：<节点1,关系,节点2>，例如，<E1,R,E2>，其中，E1、E2分别表示两个节点，R表示E1和E2之间的某种语义联系，其对应的基本语义网络为：E1
    R > E2。比如，通过语义网络，可以把“珊瑚是一种动物”表示为如图2.1的形式。


    ![](img/9549a57f481f525254296dec39e94079_55_0.png)


    图 2.1 语义网络简单示例


    语义网络中的关系有很多类型，包括：


    +   1. 实例关系（ISA）：体现的是“具体与抽象”的概念，含义为“是一个”，表示一个事物是另一个事物的一个实例，如“小王是一个人”。

    +   2. 分类关系（AKO，a kind of 的缩写）：亦称泛化关系，体现的是“子类与超类”的概念，含义为“是一种”，表示一个事物是另一个事物的一种类型，如“篮球是一种球”。

    +   3. 成员关系（a-member-of）：体现的是“个体与集体”的关系，含义为“是一员”，表示一个事物是另一个事物的一个成员，如“小余是一位公务员”。

    +   4. 属性关系：指事物和其属性之间的关系。常用的属性关系有：Have，含义为“有”，表示一个节点具有另一个节点所描述的属性，如“狗有尾巴”；Can，含义为“能”“会”，表示一个节点能做另一个节点的事情，例如“鱼能游泳”；其他属性，例如人的“身高”“年龄”等。

    +   5. 聚合关系，亦称包含关系：指具有组织或结构特征的“部分与整体”之间的关系，例如“凳子是桌子的一部分”。

    +   6. 时间关系：指不同事件在其发生时间方面的先后次序关系。常用的时间关系有“在前（表示一个事件在另一个事件之前发生）”和“在后（表示一个事件在另一个事件之后发生）”，例如“2022
    北京冬奥会在 2008 北京夏季奥运会之后”。

    +   7. 位置关系：指不同事物在位置方面的关系。常用的位置关系有“在（表示某一物体所在的位置）”，“在上（表示某一物体在另一物体之上）”，“在下（表示某一物体在另一物体之下）”，“在内（表示某一物体在另一物体之内）”，“在外（表示某一物体在另一物体之外）”，例如“显示器在桌子上”。'
  merge: -1
