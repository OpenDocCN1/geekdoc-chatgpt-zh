    # 2.1.4 脚本


    脚本是一种与框架类似的知识表示方法，是由 Schank 等于二十世纪七十年代提出的[463]。脚本通过一系列的原子动作来表示事物的基本行为，按照时间顺序描述事物的发生，类似于电影剧本。脚本表示的知识有确定的时间或因果顺序，必须是前一个动作完成后才会触发下一个动作的开始。与框架相比，脚本是用来描述一个动态的过程而非静态知识的表示方法，与框架有着不同的目的。以下的例子是使用脚本的方法描述一般顾客去餐厅吃饭的过程或流程。


    例：顾客去餐厅吃饭脚本


    +   - 第一场：进入餐厅

    +   - 顾客走进餐厅

    +   - 顾客拿号等待

    +   - 顾客被叫号'
