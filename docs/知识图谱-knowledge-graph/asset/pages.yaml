- pgno: 264
  md: '+   1. 普通用户更乐于接受能够自成一体的答案形式，而不是局部的信息片段。

    +   2. 自然答案能够对回答问句的过程提供某种形式的解释，可以无形中增加用户对系统的接受程度。

    +   3. 自然答案能够提供与答案相关联的背景信息（如上述自然答案中的“印度诗人”）。

    +   4. 完整的自然语言句子可以更好地支撑答案验证、语音合成等后续任务。


    为了生成自然语言答案，端到端的自然问答系统 COREQA [202] 基于编码器-解码器（encoder-decoder）的深度学习模型，针对需要多个知识图谱中的事实才能回答的复杂问句，引入了拷贝和检索机制，利用拷贝、检索和预测等不同语义单元获取模式，从不同来源获得不同类型的词汇，从而生成复杂问句的自然答案（如图
    10.20 所示）。以下以“你知道李连杰来自哪里吗？”这个问题为例说明该系统的主要步骤（如图 10.21 所示）


    知识检索：首先识别问题中包含的实体词，这里需要识别出的实体词是：李连杰。然后根据实体词从知识图谱中检索出相关的三元组（主题，属性，对象）。针对“李连杰”这个实体，我们可以检索出（李连杰，性别，男）、（李连杰，出生地，北京）、（李连杰，国籍，新加坡）等三元组。


    编码器：为了生成答案，需要先将问句和检索到的知识实例分别编码成向量，以便后续深度生成模型利用。问句编码器使用典型的双向循环神经网络把词序列的问句转换为向量序列。知识实例编码器使用记忆网络（memory
    network）对知识检索阶段得到的知识三元组进行编码。


    解码器：这一步根据答案和知识的编码向量生成自然答案。自然答案虽然是词序列，但是不同的词可能需要通过不同途径获得。例如：对于上述问题的


