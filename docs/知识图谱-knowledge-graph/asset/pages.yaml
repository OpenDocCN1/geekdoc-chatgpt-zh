  md: '型问题[^475]；③ 提高垂直领域信息抽取的效果[^403, 422] 等。因此开放域实体抽取技术研究具有重要的学术价值。


    在工业领域，搜索引擎公司比如 Google、Yahoo、Bing 等都在后台维护大量的开放类别命名实体列表以提高用户体验。典型应用包括：① 知识图谱中同类实体的检索与推荐；②
    提高查询分析的准确率[^476]；③ 辅助文档分类[^485]；④ 辅助用户行为分析与广告精确投放[^471] 等。因此开放域命名实体抽取技术具有广泛的应用价值。


    有鉴于传统命名实体识别方法的局限性，越来越多的研究者开始研究针对多类别的、面向真实环境数据的实体扩展方法[^97, 144]。实体扩展任务的定义如下：对于某实体类别
    C，给定该类别的 M 个实体（称为“种子实体”），一个实体扩展系统需要找出同样属于类别 C 的其他实体。


    举例来说，给出“辽宁、江苏、山东”这三个实体，抽取系统应该找出“中国省份”这个实体类别所包含的其他实体诸如“浙江、广东、四川”。


    值得注意的是，实体类别本身是未知的，需要抽取系统分析种子实体，寻找其共性得到关于目标实体类别的知识，进而抽取出属于该类别的实体。比如上面例子中，对于抽取系统而言，“中国省份”这个类别标签是未知的。输入是“辽宁、江苏、山东”这三个实体，输出则应该是其他表示中国省份的实体。


    与传统命名实体识别任务相比，实体扩展任务具有以下三个特点[^2]：


    +   - (1) 目标实体类别开放：不再局限于传统的三大类（人名、地名、机构名），而是面向更多的开放类别（比如电影名、书籍名）。而且目标类别未知，需要在仅仅知道该类别的若干实体（称为“种子实体”）的条件下进行实体抽取。\n-
    (2) 目标数据领域开放：处理的数据不再限定于指定领域文本或者规范的新闻文本，而是不限定领域的、海量、冗余、不规范、有噪声的多源异构数据。\n- (3) 以“抽取”替代“识别”：相对于传统命名实体识别任务，实体扩展任务不再拘泥于从文本中精确识别目标实体的每次出现，而是充分利用网络数据海量、冗余的特性，以抽取的方式构建目标类别实体列表。


    针对实体扩展系统的评价指标主要包括 Precision 值（准确率），Recall 值（召回率），MAP（mean average precision）值，P@N
    值和 R-PREC 值等五种。'
