    # 10. NELL


    NELL 是卡内基梅隆大学基于 “Read the Web” 项目开发的一套永不停歇的语言学习（Never-Ending Language Learning）系统⁷⁸。
    NELL 本身是一套语言学习系统，每天不间断地执行两项任务：阅读和学习。阅读任务是从 Web 文本中获取知识，并添加到内部知识库；学习任务是使用机器学习算法获取新知识，巩固和扩展对知识的理解。如图
    1.8 所示，NELL 可以抽取大量的事实（实体关系三元组），并标注所抽取的迭代轮数、时间及系统置信度，可以供人工进行校验。系统从 2010 年开始学习，经过半年的学习和抽取，总共得到将近
    35 万的实体关系三元组，经过少量人工标注和矫正，在抽取更多事实的前提下，知识抽取的准确率可以达到 87%。 NELL 目前还需要进一步完善学习算法来消除错误信息，使其能够更加有效地完成对知识的学习、总结和归纳。


