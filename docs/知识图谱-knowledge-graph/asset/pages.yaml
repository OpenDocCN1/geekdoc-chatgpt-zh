- pgno: 8
  md: '# 序


    近几年来知识图谱无疑是一个火热的名字。从 2016 年秋天接受高等教育出版社的邀请着手撰写本书开始我一直在思考：什么是知识图谱？为什么它受到学术界和产业界如此的关注？带着这个疑问，书稿断断续续写了一年多，到今天十章全部起草修改完毕后，心中逐渐有了一个相对清晰的认识。


    狭义地讲，知识图谱是由谷歌公司首先提出，被互联网公司用来从语义角度组织网络数据，从而提供智能搜索服务的大型知识库。形式上，它是一个用图数据结构表示的知识载体，描述客观世界的事物及其关系，其中节点代表客观世界的事物，边代表事物之间的关系。在具体实现上，知识图谱用语义网（Semantic
    Web）中的资源描述框架（Resource Description Framework, RDF）对知识体系和实例数据两个层面的内容进行统一表示，共同构成一个完整的知识系统。扩展开来，知识描述、实例数据及其相关的配套标准、技术、工具及应用系统构成了广义的知识图谱。


    让我们从人工智能和语义网两个领域追溯知识图谱的发展轨迹。在人工智能发展的第一个十年，科学家们的目标集中在如何构建推理模型进行问题求解，后来逐渐认识到领域知识在问题求解过程中占有不可或缺的地位，于是在
    20 世纪六七十年代陆续提出了语义网络、框架、脚本等一系列知识描述理论，其中语义网络（Semantic Network）是一个通过语义关系连接的概念网络，节点代表概念，边则表示概念之间的语义关系。这种图结构知识表示方法与知识图谱一脉相承。基于这些知识描述理论，领域专家开始利用人工方法编写实例数据建立知识库（例如
    Cyc 项目），但是规模非常有限，只在某些很受限的领域取得成功。互联网时代，人类在与自然和社会的交互中产生了异常庞大的数据，它们以文字、图片、音频、视频等各种模态存在，如何让计算机自动阅读、分析、理解这些海量、繁杂乃至泛滥的数据，从中挖掘有价值的信息，为用户提供精准的信息服务，是构建下一代信息服务的核心目标之一。为了实现这一目标，万维网之父
    Tim Berners-Lee 于 2001 年提出了语义网（Semantic Web）的概念，其本质是：定义一种对客观世界进行描述的概念化规范（即本体），基于本体并通过一套统一的元数据规范对网络内容进行详细的语义标记，从而赋予万维网信息以含义，将网页互联的万维网转化为内容互联的语义网。维基百'
  merge: -1
  img_proc: true
- pgno: 9
  md: '科（Wikipedia）无疑是语义网的一种杀手级应用，它以一种亿万网民协同构建的方式建立百科全书，极大地促进了知识资源的快速成长，在知识类型、覆盖范围和规模上都达到前所未有的程度，为知识图谱的诞生起到了决定性作用并为它奠定了雄厚的资源基础。2012
    年 5 月，谷歌首次提出知识图谱的概念，很快互联网巨头们纷纷跟进，构建了自己的知识图谱，包括微软 Probase、百度知心、搜狗知立方等。各个行业也在探索建立垂直领域的知识图谱，以知识赋能提升金融、医疗、司法、教育、出版等各个行业业务的智能化水平。学术界则致力于研究各种知识图谱构建和应用的自动化方法。回顾知识图谱的发展过程，以语义网络为代表的知识表示理论研究的积淀，互联网智能化信息处理的迫切需求，语义网在标准、技术、工程和应用方面的实践，以及以
    Wikipedia（维基百科）为代表的网络协同构建知识资源的迅猛发展，共同推动知识图谱成为新一代人工智能的一个极具代表性的奠基性工作。


    总结而言，知识图谱之所以成为学术界和产业界共同关注的热点，主要是由于它的以下几个特点：


    （1）知识图谱是人工智能应用不可或缺的基础资源。知识图谱在语义搜索、问答系统、智能客服、个性化推荐等互联网应用中占有重要地位，在金融智能、商业智能、智慧医疗、智慧司法等领域具有广阔的应用前景。


    （2）语义表达能力丰富，能够支持很多知识服务应用任务。知识图谱源于语义网络，是一阶谓词逻辑的简化形式，并在实际应用中通过定义大量的概念和关系类型丰富了语义网络的内涵。它既能够描述概念、事实、规则等各个层次的认知知识，也能够有效组织和描述人类在自然环境和社会活动中形成的海量数据，从而为各类人工智能应用系统奠定了知识基础。


    （3）描述形式统一，便于不同类型知识的集成与融合。本体（Ontology）和分类系统（Taxonomy）是典型的知识体系载体，数据库是典型的实例数据载体，它们的描述形式截然不同。知识图谱以资源描述框架（RDF）的形式对知识体系和实例数据进行统一表示，并可以通过对齐、匹配等操作对异构知识进行集成和融合，从而支撑更丰富、更灵活的知识服务。


    （4）表示方法对人类友好，给以众包等方式编辑和构建知识提供了便利。传统知识表示方法和描述语言需要知识工程师具备一定的专业知识和技能，普通人群难以操作。知识图谱以实体和实体关系为基础的表示形式，无论是专家还是普通民众都能够接受，这给以众包等方式编辑和构建知识提供了便利，为大众参与大规模知识构建提供了低认知成本的保证。


    （5）二元关系为基础的描述形式，便于知识的自动获取。知识图谱对各种类型的知识采取统一的二元关系进行定义和描述，给基于自然语言处理和机器'
  merge: -1
