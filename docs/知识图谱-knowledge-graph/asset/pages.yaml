    除了上述方法外，Nguyen 等[358] 也在 2015 年提出利用卷积神经网络（Conventional Neural Networks, CNN）实现事件检测，该方法只做了事件抽取的第一步事件检测，没有做事件元素抽取的任务。Feng
    等[153] 在 2016 年提出利用循环神经网络（Recurrent Neural Networks, RNN）进行事件检测，该方法虽然取得了很好的性能，但是该方法仅仅尝试了事件抽取的一个阶段事件检测，没有探索循环神经网络在事件元素抽取阶段的性能。为了更好地考虑一个事件的内部结构和各个元素之间的关系，Nguyen
    等[359] 在 2016 年提出利用联合循环神经网络完成事件抽取，进一步提升系统性能。


    # 7.2.2.2 弱监督事件抽取方法


    有监督事件抽取需要大量的标注样本，而人工标注数据耗时费力、一致性差，尤其是面向海量异构的网络数据时，问题更加明显。无监督事件抽取虽然不需要人工标注语料，然而得到的事件信息没有规范的语义标签（事件类别、角色名称等），很难直接映射到现有的知识库中。为此，研究人员提出弱监督事件抽取。在弱监督事件抽取中，为了得到规范的语义标签，需要给出具有规范语义标签的标注训练数据，与有监督的方法需要大量人工标注的样本不同，在弱监督的方法中语料的获取有两种途径：①
    利用 Bootstrapping 的方法扩展语料，首先人工标注部分数据，然后自动扩展数据规模。② 利用 Distant Supervison 的方法自动生成大规模语料，主要利用结构化的事件知识回标非结构化文本，'
