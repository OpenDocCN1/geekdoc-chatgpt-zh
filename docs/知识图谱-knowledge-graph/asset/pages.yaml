    # 8.2.1 常见形式化查询语言


    知识图谱的知识实际上是通过数据库系统进行存储的，大部分数据库系统通过形式化的查询语言为用户提供访问数据的接口。关系数据库和图数据库分别支持不同的查询语言，前者的标准查询语言是
    SQL，后者则是 SPARQL。下面分别对其进行介绍。


    # 8.2.1.1 SQL 语言


    SQL 是 structured query language 的缩写，中文翻译为结构化查询语言。它是一种介于关系代数与关系演算之间的语言，用于管理关系数据库，主要功能包括对数据的插入、修改、删除、查询四种操作。SQL
    是一个通用的、表达能力很强的数据语言，目前已经成为关系数据库的标准语言。关系数据库利用二维表存储数据，为了叙述简便起见，假设本小节的示例知识图谱由三元组表进行存储，即只包括三个字段。表
