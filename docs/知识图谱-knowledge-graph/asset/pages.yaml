  md: '件指称之间的相似度，一般会利用两类特征：① 事件指称的文本语义相似度；② 事件类型和事件元素之间的相似度。Mayfield 等[315] 在 2009
    年第一次提出了事件共指关系抽取的任务，利用基于特征向量表示的语义分析方法判断事件的共指关系，主要是判断两句话的相似度，并且发布了一个手工标注的数据集 ECB（Event
    Coreference Bank）用于此任务评测，促进了事件共指关系识别的研究。Zhong[6] 等提出了一种事件影响因子的计算方法，通过建立事件关系图 ERM（Event
    Relationship Map）来进行事件关系的表示，并依据事件要素及其关系实现事件的共指消解，取得了良好的效果。Yang 等[3] 针对同一话题下事件关系抽取任务提出了一种基于触发词和事件元素推断的事件关系抽取方法，这种方法尤其对共指关系有很好的抽取效果。Choubey
    等[95] 利用事件之间的相互依赖关系和关系之间的传递性来实现事件的共指消解。


    # 7.4.2 事件因果关系抽取


    事件因果关系反映了事件间先后相继、由因及果的一种关系，例如：“汽车尾气的大量排放”导致“热岛效应”是一对因果关系。因果关系的抽取对文本的深层语义理解有着重要意义，有助于掌握事件演变的过程，从而为决策者提供重要的决策信息。然而，因果事件的抽取极其困难。首先，因果关系错综复杂，一个事件的发生可能有多个原因，一个事件也可能导致多个事件的发生。其次，事件具有隐含因果关系，很难单独判断两个事件的因果关系，必须同时考虑多个因果事件间的传递作用，例如：“睡前喝咖啡导致了失眠”，“失眠导致了上班迟到”，“迟到导致了被老板批评”是一个因果关系链。另外，在某些情况下，单独从文本中很难抽取出因果关系，需要背景知识的辅助推断。例如：事件“近日国家公布消息称在未来五年将继续加大对新能源汽车行业的扶持力度”和事件“今天比亚迪汽车的股价开盘
    10 分钟就涨停了”，从文本上看两个事件应该有关联，都是汽车相关的事件，但是单凭文本信息很难判断二者的关系。如果我们能结合知识图谱中存储的“比亚迪是一家中国新能源汽车制造厂商”的背景知识，那么就可以推断出上述两个事件是因果关系。为了准确地抽取出事件因果关系，Yang[8]
    等针对文本中的因果关系，基于事件元素的语义信息，构建事件以及事件元素间的语义关联性，对候选事件进行因果关系的识别。Gan 等[214] 提出了一种基于结构分析的事件因果关系抽取方法。Marcu
    等[313] 采用朴素贝叶斯模型，通过分析相邻句子间的词对概率来抽取因果关系。Sorgent 等[438] 首先通过定制的规则抽取事件因果关系，然后通过贝叶斯推理优化结果。Fu
    等[7] 提出一种基于层叠条件随机场模型的事件因果关系抽取方法，该方法将'
