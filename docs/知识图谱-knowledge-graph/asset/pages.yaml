- pgno: 92
  md: '# 3.2.1 框架匹配


    知识体系能够在认知和语义层次上对领域知识进行建模和表达，确定领域内共同认可的词汇，通过概念之间的关系来描述概念的语义，提供对领域知识的共同理解[93, 136]。由于知识体系自身的分散特性，不同的用户可以构造不同的知识体系，所以导致了在同一个或者重叠的领域产生了许多不同的知识体系。知识体系的不同导致不同的知识图谱难以联合使用。框架匹配可以解决知识体系之间的异构性，是知识融合的重要组成部分[134]。框架匹配也称为本体对齐[1,
    185]。


    知识框架主要包括概念（类型）、属性、关系和它们之间的约束。由于异构性，同样的知识在不同知识图谱中的描述可能差异很大，比如，对应“女性航天和航空员”的描述，可以通过定义概念“女航天员”完成，也可以通过定义概念“宇航员”并约束其性别为“女”完成。这类框架级的对齐极具挑战，因为其匹配空间会随类别、属性、关系和约束的增长呈指数增长。目前常用的框架匹配方法还停留在匹配不同知识库中的元素，比如，概念“宇航员”是否匹配概念“航天员”，属性“出生地”是否匹配属性“出生地点”，关系“妻子”是否匹配关系“配偶”。


    按照使用技术的不同，框架匹配可以分为元素级匹配和结构级匹配。元素级匹配独立判断两个知识图谱中的元素是否应该匹配，不考虑其他元素的匹配情况。结构级匹配不把各个元素作为孤立的资源，而利用知识图谱的结构，在元素匹配过程中考虑其他相关元素匹配情况的影响。


    # 1. 元素级匹配


    知识图谱的框架元素由符号表示，一般来讲，符号是对元素的描述，有非常强的语义指示作用。所以，最基本的方法可以基于字符串匹配的技术实现本体元素的匹配[144]。例如，可以将字符串看作字母的精确序列、字母集合、单词集合等。字符串越相似，它们越有可能表示相同的概念。在实际匹配系统中，广泛采用的匹配方法有：前缀距离、后缀距离、编辑距离和
    n 元语法距离等。基于字符串匹配的技术忽略了语言符号的多义性（一词多义和一义多词），基于语言学的技术将名称看作是自然语言中的词汇可以更好计算元素之间的关联性。元素相似度的判断可以充分利用元素描述文字之间的语言关系，如：同义词、反义词、形态变体、语法变体、同一词根上词汇形式和功能的变化、语法结构的变化等[31]。为了计算框架元素的匹配程度还可以利用元素的约束信息，例如属性的取值范围、关系的对称性等，这类元素匹配方法称为基于约束的匹配技术。例如，当两个类的属性集相似时，那么这两个类也很有可能相似。这种技术通常与其他元素级技术同时使用，目的是减少候选映射对的数量，同时也可以作为'
  merge: -1
