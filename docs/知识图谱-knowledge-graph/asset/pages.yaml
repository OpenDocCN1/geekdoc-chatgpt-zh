    # 3.2.3 冲突检测与消解


    在框架匹配和实体对齐的基础上，知识融合还需要解决不同实例之间的冲突，例如，不同知识库对实体“姚明”的属性“身高”描述不同，对于这种冲突的检测和消解是知识融合的重要步骤，是多个知识图谱形成一个一致结果的最后步骤[279]。


    如何检测冲突并进行消解是知识融合任务的主要研究问题。冲突识别最简单的方法就是发现对于同样的属性和关系有不同的实例（如上例所述），但是，对于某些属性，这种策略不一定有效。例如，不同知识图谱存储了某人的两段不同婚姻，其实这两部分信息都是正确的，不存在冲突，对于这种情况需要针对性地设计不同检测策略。


    对于冲突的处理，目前常见的策略分为以下三类：冲突忽略、冲突避免和冲突消解。冲突忽略不进行处理，而是把检测出来的冲突交给用户解决，舍弃'
  merge: -1
  img_proc: true
- pgno: 96
  md: '某些实例或是进行修改。冲突避免不解决冲突，而是使用规则或约束对数据来源进行过滤，例如，约束人的年龄范围，设计不同知识来源的可信优先级。冲突消解关注于如何利用知识图谱本身（框架和实例）的特征来消解冲突，这是目前的主要研究方向。


    冲突消解按照使用技术可以分为如下两类：基于投票的方法和基于质量估计的方法。基于投票的方法比较直接，例如，根据不同事实出现频率进行多数投票。基于质量的方法考虑不同知识来源的可信度，最终选择较高质量的结果，例如，可以根据
    HITS 或 PangRank 算法计算不同数据来源的可信度。对知识融合，特别是冲突检测与消解有兴趣的读者，可以参考文献 [137]。


    # 3.2.4 典型知识融合系统


    一般而言，相对于实例型知识，知识体系的规模较小，但是其结构更丰富，因此，一些复杂的结构级匹配方法多用在本体匹配上。而实体对齐更多使用一些简单的局部方法以保证对齐的运行时间在一个可以接受的范围内，特别是针对大规模知识图谱之间的知识融合。本小节将介绍几个有代表性的知识融合系统。在这些系统中，综合利用了上述的很多技术，并且取得了丰硕的成果。


    知识图谱之间一般包含两种融合类型，一种是融合较高层知识与较底层知识框架，即竖直方向的融合；另一种是融合相同层次的知识图谱，即水平方向的融合。虽然大部分知识融合系统关注后一种类型，例如，融合
    Wikidata 和 Freebase 两个通用知识图谱[377]。但是，前者也同样重要，例如，SUMO 和 Schema.org 作为通用知识体系，包含可交换的术语词汇和本体描述，各领域知识图谱可以通过与他们的挂载和融合构建语义更丰富的知识体系。YAGO
    和 BabelNet 就是第一类融合系统的典型代表。YAGO 将 Wikipedia 中的类别标签与 WordNet 中的同义词集进行关联，同时将 Wikipedia
    中的条目挂载到 WordNet 的体系框架下，它认为 WordNet 提供了较高层的框架描述，Wikipedia 提供了具体的实例信息。BabelNet 是一个多语言词汇级的语义网络和本体，它将
    Wikipedia 链接到最常用的英语计算词典 WordNet。与 YAGO 不同的是，BabelNet 加入了多语言支持。


    PROMPT[368] 是一个较早关于本体合并（Ontology Merging）和本体对齐（Ontology Alignment）的方法和工具。通过确定问题的具体细节，该方法提出了一个创新的解决方案[369]，结合人工和机器对齐两种方式，通过有效利用知识体系的结构信息和人类的辅助行为，构建一个实用的框架合并和对齐工作。值得一提的是，该方法和工具获得了
    2018 年度国际人工智能大会（AAAI）经典'
