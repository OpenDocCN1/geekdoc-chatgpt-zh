    Ahn[27] 提出了在国际公开会议上发表的最早的关于 ACE 事件抽取的研究工作，他把事件抽取划分为四个子任务：事件触发词识别、事件触发词分类、事件元素识别和事件元素分类。具体方法中他使用了
    K 最近邻（K-Nearest Neighborhood, KNN）以及最大熵（Maximum Entropy, ME）分类器。后续国内外的学者在 ACE
    的数据集上做了大量的研究工作，主要集中在三个方面：① 有效特征的挖掘；② 抽取模型的改进；③ 减少对标注语料的依赖。


