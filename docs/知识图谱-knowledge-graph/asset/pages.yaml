    的类型表中的存储情况，其中图（a）展示了人物相关的类别体系，图（b）展示了在该类别体系下设计的


    基于类型表的存储方式根据类型对数据进行组织和管理，克服了三元组表面临的单表过大和结构简单的问题，但是也有明显的不足之处：


    +   - 由于类型表的不同字段表示了不同的属性或者关系，因此在查询时必须指明属性或关系，无法做不确定属性或关系的查询。

    +   - 由于数据表是和具体类型对应的，不同类型的数据表具有不同的结构，因此在查询之前必须知道目标对象的类型才能确定查找的数据表。为了达到这一目的，系统需要维护一个“属性—类型”映射表，以便在进行属性查询时可以根据目标属性确定类型。

    +   - 当查询涉及不同类型的实体时，需要进行多表的链接，这一操作开销巨大，限制了知识图谱对复杂查询的处理能力[21]。

    +   - 知识图谱通常包含丰富的实体类型，因此需要创建大量的数据表，并且这些数据表之间又具有复杂的关系，这为数据的管理增加了很大的难度。


    基于表结构的存储还可以有其他的... 例如可以按照“属性”划分，为每个属性创建一张数据表[21]。不同的设计方式各有其优缺点，在实际应用中需要结合具体场景进行选择。


    上面介绍了基于表结构的不同存储设计方式，数据的最终存储需要依赖具体的存储系统。关系数据库是典型的表结构存储系统，下面对其进行简要介绍。'
