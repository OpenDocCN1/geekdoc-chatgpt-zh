    # 2. WordNet


    WordNet 是 1985 年由 Princeton 大学公布的一个英文电子词典和本体，采用人工标注的方法，将英文单词按照单词的语义组成一个大的概念网络。在
    WordNet 中，词语被聚类成同义词集（Synset），每个同义词集表示一个基本的词汇语义概念，词集之间的语义关系包括同义关系、反义关系、上位关系、下位关系、整体关系、部分关系、蕴含关系、因果关系、近似关系等。1991
    年，WordNet1.0 版本正式公布，目前 WordNet 包含 155287 个单词，117659 个同义词集。图 1.4 给出了 WordNet 中同义词集的组织结构，从这个示例中，我们可以看到概念间的关系以及每个概念所对应的单词，包括同义词和概念的解释。


    ![](img/9549a57f481f525254296dec39e94079_30_0.png)


    图 1.4 WordNet 组织结构示例


    # 3. 知网（HowNet）


    知网（英文名称为 HowNet）是由董振东教授主持开发的一个语言认知知识库/常识知识库，以概念为中心，基于义原描述了概念与概念之间以及概念所具有的属性之间的关系，每一个概念可以由多种语言的词汇进行描述（主要是中文和英语）。知网是一个知识系统，经过多年发展，目前知网总共包含了
    800 多个义原，11000 个词语。'
