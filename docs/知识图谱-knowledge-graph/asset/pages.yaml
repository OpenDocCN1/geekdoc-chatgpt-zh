- pgno: 129
  md: '构词法的模糊匹配方法也在 TAC 评测中被使用，如 Metaphone Algorithm 和 Soft TFIDF 算法。


    # 5.3.2 实体链接方法


    相比于链接候选过滤，实体链接方法是实体链接研究的重点，也是难点。给定一个指称项 m 及其链接候选 E = e1,e2,…,en，实体链接方法选择与指称项具有最高一致性打分的实体作为其目标实体：


    e = arg max_e Score(e, m) (5.6)


    因此，实体链接的关键在于如何计算实体指称项与目标实体之间的一致性打分 Score(e, m)。根据如何计算 Score(e, m)，现有的方法可以分为四种：向量空间模型、主题一致性模型、协同实体链接模型和基于神经网络的模型。以下分别概述这几种方法。


    # 1. 向量空间模型


    在向量空间模型中，实体指称项与目标实体的一致性打分主要基于实体指称项上下文与目标实体上下文中特征的共现信息来确定。在该模型中，实体概念和实体指称项都被表示为上下文中
    Term 组成的向量（Term 通常为词[329]，还可能包括概念、类别等[76,115,150]）。基于 Term 向量表示，向量空间模型通过计算两个向量之间的相似度对实体概念和指称项之间的一致性进行打分。


    目前，针对向量空间模型的研究集中在两个方面：


    +   (1) 如何抽取有效的特征表示：传统的向量空间模型仅仅使用上下文中的词作为实体指称项的特征，通常难以准确表示实体指称项的信息。近年来，从上下文中抽取概念和实体作为特征，或从知识源（如
    Wikipedia）中获取实体指称项的额外信息作为特征成为一个研究热点。


    +   (2) 如何更为有效地计算向量之间的相似度：目前，实体链接任务中对实体概念和指称项之间一致性的打分方法包括：Cosine 相似度、上下文词重合度以及利用分类器等学习算法进行打分。但是这些方法都有其不足之处，需要进行进一步的改进。


    # 2. 主题一致性模型


    在向量空间模型中，决定一致性打分的主要依据是实体概念的描述文本和实体指称项的上下文。与向量空间模型不同，Medelyan 等[323] 和 Milne 等[338]
    提出了主题一致性模型进行实体链接。在主题一致性模型中，决定一致性打分的是实体指称项的候选实体概念与指称项上下文中的其他实体概念的一致性程'
