- pgno: 100
  md: '# 第四章 实体识别和扩展


    实体（Entity）是知识图谱的基本单元，也是文本中承载信息的重要语言单位。实体识别和分析是支持知识图谱构建和应用的重要技术。按照国际公开评测 Automatic
    Content Extraction（ACE）的定义，在文本中对实体的引用（Entity Mention，也可称为指称项）可以有三种形式：命名性指称、名词性指称和代词性指称
    [资源 4-1]。例如在句子“[中国乒乓球男队主教练][刘国梁] 出席了会议，[他] 布置了备战世乒赛的具体安排”中，实体“刘国梁”的指称项有三个，其中“中国乒乓球男队主教练”是名词性指称，“刘国梁”是命名性指称，“他”是代词性指称。本章主要讨论与命名性指称（即命名实体）相关的研究。狭义地讲，命名实体指现实世界中具体或抽象的实体，如人（张三）、机构（中国中文信息学会、阿里巴巴网络技术有限公司）、地点（北京）等，通常用唯一的标识符（专有名称）表示，如人名、机构名、地名等。广义地讲，命名实体还可以包含时间（12：00）、日期（2017
    年 10 月 17 日）、数量表达式（100）、金钱（一亿美金）等。命名实体的确切含义，只能根据具体应用来确定。例如，在具体应用中，可能需要把产品名称、住址、电子信箱地址、电话号码、航班号、活动名称等作为命名实体。有关于命名实体的研究任务主要包括：实体识别、实体扩展、实体消歧、实体属性抽取、实体关系抽取等。本章介绍命名实体识别和扩展的任务及研究现状，实体消歧和实体关系抽取等任务将在后续章节介绍。


    ![](img/9549a57f481f525254296dec39e94079_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 4.1 实体识别


    # 4.1.1 任务概述


    命名实体识别任务是识别出文本中实体的命名性指称项，并标明其类别（例如人名、地名、机构名、产品名等）。一般来说，命名实体识别的任务就是识别出待处理文本中三大类（实体类、时间类和数字类）、七小类（人名、机构名、地名、时间、日期、货币和百分比）命名实体。不同任务对命名实体类别粒度的需求不同，例如在有些任务中只要识别出一个实体是人，有些任务则需要识别出一个实体是教师、学生或者医生。相对于传统的三大类或者七小类的实体识别，细粒度实体识别的难点主要是类别多、类别具有层次结构、标注成本高，所以也有很多工作研究细粒度实体识别[24,
    293, 370, 428]。本章第一小节主要以传统的七小类为例介绍实体识别的方法，第二小节介绍细粒度实体识别的方法，最后一个小节介绍实体扩展的任务及典型方法。


    # 1. 实体识别的难点


    本小节主要以七类实体为例介绍实体识别的方法，七类实体中时间、日期、货币和百分比的构成有比较明显的规律，识别起来相对容易，而人名、地名、机构名的用字灵活，识别的难度很大，因此本节内容中命名实体识别通常指的是人名、地名和机构名的识别。命名实体识别的过程通常包括两部分：①
    识别实体边界；② 确定实体类别（人名、地名、机构名等）。命名实体识别的主要难点在于：


    +   (1) 命名实体形式多变。命名实体的内部结构很复杂，对中文命名实体来说，情况尤其如此。


    人名：汉语人名一般包含姓氏（由一到两个字组成）和名（由若干个字组成）两部分，其中姓氏的用字是有限制的，而名的用字很灵活。人名还有很多其他形式，可以使用名来指代一个人，可以使用字、号等其他称呼，也可以使用姓加上前缀或后缀以及职务名来指代一个人。例如：“杜甫、杜子美、子美、杜工部”都是同一个人，“李杜”则是一个简称。


    地名：通常的形式是若干个字组成地名，可能包括作为后缀的关键字。也存在一些简称来指称地理位置。例如：“湖北、湖北省、鄂”均是指同一个地方，“广州、广州市、羊城”也是指同一个地方。


    机构名：机构名可以包含命名性成分、修饰性成分、表示地名的成分以及关键词成分等。例如：机构名“北京百富勤投资咨询公司”中，“北京”是表示'
  merge: -1
  img_proc: true
- pgno: 102
  md: '地名的成分，“百富勤”是命名性成分，“投资咨询”是修饰性成分，“公司”是关键词成分。机构名内部还可以嵌套子机构名，例如：机构名“北京大学附属小学”中嵌套了另一个机构名“北京大学”。机构名中还有很多简称形式，例如：“中国奥委会”“北师大二附中”等。


    # （2）命名实体的语言环境复杂。


    命名实体是语言中非常普遍的现象，因此可以出现在各种语言环境中。同样的汉字序列在不同语境下，可能具有不同的实体类型，或者在某些条件下是实体，在另外的条件就不是实体。例如：


    +   - 人名：“彩霞”在某些条件下是人名，而某些条件下就是一种自然现象；

    +   - 地名：“河南”在某些条件下是一个省名，在某些条件下是泛指；

    +   - 机构名：“新世界”在某些条件下是机构名，在某些条件下只是一个短语。


    英语中的命名实体具有比较明显的形式标志（即实体中每个词的第一个字母要大写），所以实体边界识别相对容易，重点是确定实体类别。和英语相比，汉语命名实体识别任务要复杂得多，主要表现在：


    # （1）汉语文本没有类似英语文本中空格之类的显式标示词边界的标示符，分词和命名实体识别会互相影响。


    （2）英语的命名实体往往是首字母大写的，例如：“Liu Chang Le is the founder of Phoenix TV”。而中文文本中没有这样的标示，例如：“凤凰卫视的创始人是刘长乐”。


    # 2. 相关评测


    从 20 世纪 80 年代末开始，随着消息理解系列会议（Message Understanding Conference, MUC）[资源 4-2] 的召开，信息抽取研究蓬勃开展起来，发展成为自然语言处理领域一个重要分支。


    ![](img/9549a57f481f525254296dec39e94079_102_0.png)


    MUC 是由美国政府支持的一个专门致力于真实新闻文本理解的系列会议，在信息提取技术的评测方面起着重要作用。MUC-6 和 MUC-7 设立的命名实体识别专项评测大大推动了英语命名实体识别技术的发展。此外，MUC-6
    和 MUC-7 还设立了多语言实体识别评测任务 MET (Multilingual Entity Task)，对日语、西班牙语、汉语等多种语言命名实体识别任务进行评测[92]。


    ![](img/9549a57f481f525254296dec39e94079_102_1.png)


    MUC 会议结束之后，美国国家标准技术研究所启动了自动内容抽取评测会议 [资源 4-3]（Automatic Content Extraction, ACE）。这项评测从
    1999 年 7 月开始酝酿，2000 年 12 月正式开始启动，旨在推动自动内容抽取技术的


    研究，以支持对三种不同来源（普通文本、由自动语音识别得到的文本、由光学字符识别得到的文本）的语言文本的自动处理，主要任务是自动抽取新'
  merge: -1
  img_proc: true
- pgno: 103
  md: '闻文本中出现的实体、关系和事件等内容。ACE 中的实体识别与追踪（Entity Detection and Tracking, EDT）任务就是针对命名实体识别的评测。但是
    ACE 中的实体与通常意义下的命名实体有一定的区别，它的类别更多，识别难度更大。2009 年 ACE 评测结束，由美国国家标准技术研究所组织的文本分析会议中的知识库生成子任务（text
    analysis conference knowledge base population, TAC-KBP）继续推动文本抽取和理解技术的发展，TAC 提供了大规模的测试集和测试平台，数据来源包括新闻和网络数据。TAC-KBP
    的主要目标是发展和评价知识库构建系统，这些系统可以从零开始建立知识库或是填充已有的知识库。TAC-KBP 中设有关于实体识别和链接的专项任务。


    为了推进中文命名实体识别技术的发展，SigHAN（the special interest group for chinese information processing
    of the association for computational linguistics）从 2003 年开始举办第一届中文分词评测 BAKEOFF（the
    first international chinese word segmentation BAKEOFF），2006 年和 2008 年举行的 BAKEOFF
    设立了命名实体识别专项评测[272]。截至 2017 年 SigHAN 已经成功举办了 9 届。


    除此之外，国内比较有影响的评测会议还有 863 计划中文信息处理与智能人机交互技术评测会议。2003 年，“中文信息处理与智能人机接口技术评测”设立了中文命名实体识别评测子任务，主要任务是识别人名、地名、机构名和其他专名。2004
    年命名实体识别任务作为一个独立的评测项目，识别任务有所扩大，在实体类型上包括了人名、地名、机构名、时间表达式和数值表达式，在语言方面，除了简体的识别还增加了繁体的识别。


    除了以上介绍的评测以外，在 CoNLL[资源 4-4]（Conference on Computational Natural Language Learning）等国际会议上也有相关的评测任务，这些评测对命名实体识别技术的发展起到了推动作用。


    ![](img/9549a57f481f525254296dec39e94079_103_0.png)


    # 4.1.2 基于规则的实体识别方法


    有关命名实体识别已有大量研究，大致有两种方法。第一种是基于规则的方法，第二种是基于机器学习的方法，也可以将两种方法结合起来使用。总的来说，基于规则的方法准确率比较高，接近人类的思考方式，表示直观，而且便于推理。但是这种方法成本昂贵，规则的制定依赖于语言学家和领域专家，很难移植到新领域。相比之下，基于机器学习的方法更加健壮和灵活，而且比较客观，不需要太多的人工干预和领域知识，但是需要人工标注数据，数据稀疏'
  merge: -1
  img_proc: true
- pgno: 104
  md: '问题比较严重。另外，有的方法搜索空间比较大，会导致巨大的空间开销，进而影响效率。本节内容主要介绍基于规则的方法，下节介绍基于机器学习的方法。


    在命名实体识别研究的早期阶段，基于规则的方法占主导地位[59, 181, 253]。在基于规则的命名实体识别方法中，一般是由语言学家制定规则。相较于英文，中文命名实体识别难度更大，因为英文的命名实体一般是以大写字母开头的，比如人名、地名等，都是以大写字母为首，因此英文命名实体识别更容易。基于规则的方法，首先可以制定一些简单的基本规则，然后在各种语料库中，通过对基于规则方法的实验结果进行错误分析，不断改进规则，最后直到识别出更多更准的命名实体为止。在大规模标注语料库缺少的情况下，基于规则的方法能够取得较好的效果。参加
    MUC-6 命名实体评测的系统几乎都是基于规则的系统，如：Proteus[70] 系统、Netowl[253] 系统、FACILE[59] 系统等。


    在基于规则的方法中，最具代表性的方法是基于命名实体词典的方法。基于词典的方法采用字符串完全匹配或部分匹配的方式，从文本中找到与词典中最相似的单词或短语完成实体识别。其主要优势在于规则简单。比较经典的方法有基于正向最大匹配的方法、基于逆向最大匹配的方法和基于最短路径的方法。但是这类方法的性能往往受命名实体词典规模和质量的影响。然而，命名实体是一个动态变化的集合，新的实体不断涌现，再加上实体命名的不规则性，导致实体名称纷繁多样，难以构建出一个完备的词典。


    针对词典中不存在的命名实体，需要通过其他规则办法进行识别。比较简单的中文命名实体构成规则举例如下：


    +   1. 中文人名的识别规则示例：<姓氏><名字>，例如：欧阳峰。

    +   2. 中文组织名的识别规则示例：{[人名][组织名][地名][核心名]}<指示词>，例如：中国中文信息学会。

    +   3. 中文地名的识别规则示例：<名字部分><指示词>，例如：北京市。


    上面的示例规则描述了命名实体内部的结构和规律，还可以从整个句子的角度设计规则，例如：


    +   1. <人名>加入了<组织名>，例如：小明加入了中国少年先锋队。

    +   2. <人名>挣了<多少>钱，例如：张三挣了一个亿。

    +   3. <组织名>的总部位于<地名>，例如：阿里巴巴的总部位于浙江杭州。


    基于规则的命名实体识别方法在特定领域的小规模语料上测试效果较好，速度快。但是，人为编写规则建立在语言专家对大量语言现象进行深入分析的基础上，对语言知识要求较高，需要大量的人力物力。另外，多个规则之间有可'
