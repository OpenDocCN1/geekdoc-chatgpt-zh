  md: '存储不按照类型来组织实体，而是从实体出发，不同实体对应的节点可以定义不同的属性。例如，“玻恩”既是“物理学家”又是“数学家”，在表结构的存储中，“物理学家”和“数学家”分别对应了一张表；而在图结构的方法中，只需要在“费米”的节点同时定义上述两种类型的属性即可。


