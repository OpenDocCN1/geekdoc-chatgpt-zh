  md: '所有的 TDT 评测（2000 年 – 2004 年）都包含上述五个子任务，而且将评测语言扩展到中文、英文和阿拉伯文。


    语言数据组织（Linguistics Data Consortium, LDC）为 TDT 的系列评测会议提供了 TDT-pilot、TDT-2、TDT-3、TDT-4
    和 TDT-5 共 5 种语料，其中 TDT-3 用于 1999、2000 以及 2001 的评测。由于 TDT 中话题的粒度比事件的粒度大，因此 TDT
    评测的语料标注方法与 ACE 等评测的标注方法完全不同。TDT-2 和 TDT-3 采用了 “YES” “BRIEF” 和 “NO” 三类标签分别表示当前报道的内容与话题绝对相关、部分相关和不相关。而
    TDT-4 和 TDT-5 则只采用了 “YES” 和 “NO” 两种标签[213]。


    # （3）ACE 评测会议


    自动内容抽取（Automatic Content Extraction, ACE）评测会议从 ACE 2004 和 ACE 2005 开始增加了对中文和英文事件抽取任务。事件抽取的语料中有英文
    599 篇，中文 633 篇。ACE 中的事件和 TDT 中的事件不同，ACE 中的事件是预定义类型的、句子级的事件，语料中会标注事件的类型、触发词、事件的元素及其在事件中扮演的角色。ACE
    2005 标注的事件语料是目前使用最广泛的事件抽取标注数据集。


    ACE 中将事件定义为一个动作的发生或者状态的改变。事件包含事件触发词和事件元素两部分。事件触发词是句子中最能表示事件发生的词，一般是动词或者动词性的名词，事件元素就是参与事件的实体、事件发生的时间和地点等描述一个事件的参与者，不同的事件元素在事件中扮演不同的角色，对于一个事件实例来说事件角色等价于对应的事件元素。ACE
    中定义了 8 大类 33 小类事件，详细类别见表 7.1，一般不同的事件类型有不同的事件元素角色，部分事件元素角色见表 7.2。


    ACE 语料的标注格式采用了可扩展标记语言（Extensible Markup Language, XML）的方式。每个事件都标注了事件触发词、事件类型、事件子类型、事件元素和事件元素扮演的角色信息，除此之外，ACE
    中还为每个事件标注了如下四种属性：


    +   ① 事件的极性（polarity），即表示肯定的事件或表示否定的事件。 ② 事件的时态（tense），包括过去发生的事件，现在正在发生的事件，将来即将发生的事件，以及无法确定时态的事件。
    ③ 事件的指属（genericity），包括特指（specific）事件和泛指（generic）事件。 ④ 事件的形态（modality），包括语气非常肯定（asserted）的事件和信念事件（believed
    event）、假设事件（hypothetical event）等。'
