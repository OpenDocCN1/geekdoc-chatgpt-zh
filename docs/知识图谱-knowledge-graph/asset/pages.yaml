    频繁子图规则挖掘恰好是一个相反的过程，它是搜集知识图谱的规则实例，再将规则实例中的实体替换成变量，同时设定一些约束，以快速地确定规则的实用性，并根据知识图谱中规则实例的支撑来快速评价挖掘到的规则。从知识图谱中搜集规则的实例是一个复杂的过程，并且其朴素的搜索算法具有指数的计算复杂度。更形式化地说，在图中一个确定的点向周围扩散以搜索环路的操作次数是路径上每一个节点出度的积，粗略地计算，这一问题的复杂度是
    O(nˡ)，其中 n 是节点平均出度，而 l 是路径的长度。接下来就是如何有效地从整个空间中搜索到这样的结构，基于图搜索的方法都可以用于这一任务，如深度优先搜索、广度优先搜索、启发式搜索等，也伴随着一些剪枝的策略。一般会有两个指标来评价一条逻辑规则的质量：支持度
    s 和置信度 c，关联规则挖掘中对两个指标的计算方法如下：


    s(X → Y) = σ(X ∪ Y) / N

    c(X → Y) = σ(X ∪ Y) / σ(X)

