    首先使用回归模型预测每个地区发布推特的数目，然后观测每个地区实际发布的推特数目，如果实际推特数目和预测数目相比超过一定阈值，那么就判定有事件发生，并使用文本摘要模型从这些推特文本中抽取能够描述该事件的文本。类似地，Cheng
    等[80] 同时从时间和空间两个维度对推特的发布数量进行异常分析。上述方法对文档整体的异常情况进行分析，和它们不同，Weng 等[483] 将每个词的词频当作原始信号，然后借用小波分析（wavelet
    analysis）的思想为每个词构建信号模型并基于该模型检测不同词汇在文本中对应词频的异常情况，最后他们将具有相似异常模式的词汇聚到一组用于表示特定的事件。


    开放域事件识别虽然可以自动发现新的事件，但其发现的事件往往缺乏语义信息，并且难以进行结构化。如果想要获得准确的语义信息，则需要通过人工标注的方式为每个类别簇赋予特定的语义标签。图
    7.5 展示了 Ritter 等[404] 在推特上进行事件识别的结果，其中事件的类别通过人工进行标注。上述缺点导致开放域事件识别的结果很难被应用到其他自然语言处理任务中。


    # 7.4 事件关系抽取


    以上对事件抽取的典型方法和评测语料进行了介绍。然而，现实世界中的事件并非独立存在，它们之间存在着千丝万缕的联系。从历史事件中发现规律、厘清事件间的关系有助于人们从全局了解事件，进而构建事件知识图谱，支撑各种事件相关的应用。事件关系抽取的核心任务是以事件为基本语义单元，实现事件逻辑关系的深层检测和抽取。目前对于事件关系还没有一个清晰统一的框架和定义，比较公认的有事件共指关系、事件因果关系、子事件关系和事件时序关系等，以下分别介绍。


    # 7.4.1 事件共指关系抽取


    当两个事件指称指向真实世界的同一个目标事件，则认为这两个事件具有共指关系，例如：事件指称“2014 年 10 月，联想集团正式完成对摩托罗拉移动的收购”和“联想集团以
    29.1 亿美元的价格收购了摩托罗拉移动”描述的是同一个事件。事件共指关系的发现，有助于在多源数据中发现相同事件，对事件信息的补全和验证有积极作用。事件共指关系抽取的核心问题是计算两个事'
  merge: -1
  img_proc: true
