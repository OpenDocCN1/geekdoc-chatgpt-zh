    （4）事件抽取：事件抽取任务的目标是从描述事件信息的文本中抽取出用户感兴趣的事件信息并以结构化的形式呈现出来。事件是发生在某个特定的时间点或时间段、某个特定的地域范围内，由一个或者多个角色参与的，一个或者多个动作组成的的事情或者状态的改变。例如：在句子“成龙和林凤娇于
    1982 年 12 月 1 日在洛杉矶举行婚礼”中，事件抽取的目标是识别出这个句子描述了一个“结婚”事件，“结婚的双方”是“成龙”和“林凤娇”，“结婚时间”是“1982
    年 12 月 1 日”，“结婚地点”是“洛杉矶”。现有知识图谱大多以实体和实体之间的关系为核心，缺乏事件知识。然而，很多认知科学家认为人们是以事件为单位来认识世界的，事件符合人们的正常认知规律。例如，对于一个足球迷，他可能最关心的是足球比赛相关的事件和球星相关的事件；对于一个股民，他可能最关心的是股票相关的事件；当发生自然灾害事件时，人们想快速地知道灾害发生的准确时间、地点、灾害等级、伤亡情况、救援情况等信息。因此，事件知识能弥补现有以实体和实体关系为核心的知识图谱知识表达能力不足的问题，是构建知识图谱不可或缺的技术。事件结构本身的复杂性以及自然语言表达的歧义性和灵活性，对事件抽取提出了很大的挑战。根据抽取方法的不同，已有的事件抽取方法可以分为基于模式匹配的事件抽取和基于机器学习事件抽取。


    # 1.4.3 知识融合


    知识融合是对不同来源、不同语言或不同结构的知识进行融合，从而对已有知识图谱进行补充、更新和去重。例如，YAGO 是对专家构建的高质量语言知识图谱 WordNet
    和网民协同构建的大规模实体知识图谱 Wikipedia 进行融合而形成的，从而实现质量和数量的互补；BabelNet 融合不同语言的知识图谱，实现跨语言的知识关联和共享。


    从融合的对象看，知识融合包括：知识体系的融合和实例的融合。知识体系的融合就是两个或多个异构知识体系进行融合，相同的类别、属性、关系进行映射。而实例级别的融合是对于两个不同知识图谱中的实例（实体实例、关系实例）进行融合，包括不同知识体系下的实例、不同语言的实例。知识融合的核心是计算两个知识图谱中两个节点或边之间的语义映射关系。从融合的知识图谱类型看，知识融合可以分为：竖直方向的融合和水平方向的融合。竖直方向的融合是指融合（较）高层通用本体与（较）底层领域本体或实例数据，例'
  merge: -1
  img_proc: true
- pgno: 42
  md: '如，融合 WordNet 和 Wikipedia。水平方向的融合是指融合同层次的知识图谱，实现实例数据的互补，例如，融合 Freebase 和 DBpedia。


    # 1.4.4 知识存储


    知识存储就是研究采用何种方式将已有知识图谱进行存储。因为目前知识图谱大多是基于图的数据结构，它的存储方式主要有两种形式：RDF 格式存储和图数据库（Graph
    Database）。RDF 格式存储就是以三元组的形式存储数据，如 Google 开放的 Freebase 知识图谱，就是以文本的形式逐行存储三元组 SPO（Subject,
    Predicate, Object），但是这种存储方式使得三元组的搜索效率低下，为了提升三元组的搜索效率，通常采用六重索引的方法。图数据库的方法比 RDF
    数据库更加通用，目前典型的开源图数据库是 Neo4j[资源1-18]，这种图数据库的优点是具有完善的图查询语言，支持大多数的图挖掘算法，它的缺点是数据更新慢，大节点的处理开销大。为了解决上述问题，子图筛选、子图同构判定等技术是目前图数据库的研究热点[15]。


    ![](img/9549a57f481f525254296dec39e94079_42_0.png)


    # 1.4.5 知识推理


    通过知识建模、知识获取和知识融合，我们基本可以构建一个可用的知识图谱。但是由于处理数据的不完备性，所构建的知识图谱中肯定存在知识缺失现象（包括实体缺失、关系缺失）。由于数据的稀疏性，我们也很难以利用抽取或者融合的方法对于缺失的知识进行补齐。因此，需要采用推理的手段发现已有知识中隐含的知识。目前知识推理的研究主要集中在针对知识图谱中缺失关系的补足，即挖掘两个实体之间隐含的语义关系。所采用的方法可以分为两种：①
    基于传统逻辑规则的方法进行推理，其研究热点在于如何自动学习推理规则，以及如何解决推理过程中的规则冲突问题；② 基于表示学习的推理，即采用学习的方式，将传统推理过程转化为基于分布式表示的语义向量相似度计算任务。这类方法优点是容错率高、可学习，缺点也显而易见，即不可解释，缺乏语义约束。

    当然，知识推理不仅仅能够应用于已有知识图谱的补全，也可以直接应用于相关应用任务，例如自动问答系统中往往也需要知识推理。关键问题在于如何将问题映射到知识图谱所支撑的结构表示中，在此基础上才能利用知识图谱中的上下文语义约束以及已有的推理规则，并结合常识等相关知识，得到正确'
