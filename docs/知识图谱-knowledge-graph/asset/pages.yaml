  md: '搜索引擎，爬取返回的 Snippet 作为语料，抽取符合特定规则的字符字作为候选实体。每个候选实体将作为新种子重复抽取过程，直至预定的迭代次数。抽取阶段的目标在于提升整个系统的召回率。接下来在打分阶段，作者使用加权图的方法为候选实体打分并重新排序，以提升系统的准确率。


    在基于模板的方法中，如何衡量模板质量是非常重要的问题，Qi 等[389] 提出通过考察 < 候选实体 - 模板 > 之间的抽取关系评估模板质量，进而更准确地度量候选实体与目标实体类别之间的语义相关度，得到了不错的效果。


    # 2. 基于统计的实体抽取


    针对实体扩展的任务，除了基于模板的抽取方法，另外一类应用比较广泛的策略是基于统计的抽取方法[405, 412]。这类方法通常使用相对粗糙的方式来获取候选，比如将语料中所有名词或名词短语都作为候选；之后通过分析整个语料的统计信息来得到候选的分布信息；最后计算候选实体与种子实体的分布相似度作为置信度并对候选实体进行排序。基于统计的方法可以分为基于上下文相似度的方法和融合模板与上下文相似度的方法。


    # （1）基于上下文相似度的方法


    由于绝大多数实体表现为名词或名词短语的形式，所以一个很自然的想法是找出语料中全部名词或名词短语，然后分别计算它们与种子实体的相似度并找出相似实体[25, 26,
    176]。最具代表性的是 Pantel 等提出的方法，他们设计了一种网络级别的上下文分布相似度模型，并使用该模型处理实体扩展任务[371]。


    基于上下文相似度的方法还具有以下两个重要特点；首先，语料规模非常重要。同等质量的语料，规模越大则抽取效果越好。Pantel 使用 400 亿词的普通网络数据作为语料的抽取效果比
    80 亿词作为语料的抽取效果提升了 34.8%，而使用 2000 亿词的普通网络数据作为语料的抽取效果比使用 400 亿词的抽取效果又提升了 13.5%，其他研究者的研究也发现了同样现象[39,
    190, 264]。其次，语料质量非常重要。同等规模的语料，质量越高则抽取效果越好。使用 Wikipedia 文本作为语料时，抽取效果比使用同等规模的普通网络数据的抽取效果高出
    19.3%[371]。


    # （2）融合模板与上下文相似度的方法


    除了基于上下文相似度的方法，有的科研者提出了联合使用模板和上下文相似度的方法。在使用上下文统计信息的基础上，加入基于模板的限制，以提高准确率[470]。这类方法在处理不同来源数据时效果更为明显。例如，网络表格或列表数据通常包含有大量的同类别实体，这些实体在该类数据中通常表现出相同的结构特征，所以针对这类数据使用基于模板的方法比较合适。这类数据的另一个特点是准确度高，但相应的覆盖度比较低，所以单纯使用这类数据效果不是特别理想[250]。而处理大规模非结构化文本数据时，其规模会使实体的统'
