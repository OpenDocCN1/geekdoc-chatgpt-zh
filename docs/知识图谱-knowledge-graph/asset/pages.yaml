    在通过上一节介绍的规则挖掘方法或者人工书写规则方法获得了逻辑规则集合之后，如何将这些规则应用于自动推理是这一节的主要内容，而运用规则推理出事实的过程，则可以认为是人工智能领域典型的演绎推理方法的应用。这一节分为两部分内容，首先以
    λ 演算为例介绍确定性推理的一般过程，再以概率软逻辑为例介绍不确定性推理的一般过程。


