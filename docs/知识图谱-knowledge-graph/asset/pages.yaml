  md: '率低的问题。对于三元组 r(e1, e2)，定义基于三元组的能量函数 f_r(e1, e2)。例如，TransE 模型[66] 中能量函数定义为 f_r(e1,
    e2) = ||e1 + r - e2||_{L1/2}，e_i 和 r 分别表示实体 e_i 和关系 r 的向量表示。记知识图谱中三元组的集合为 Δ，Δ''_r(e1,e2)
    表示由 r(e1,e2) 生成的负样本的集合（比如，随机替换 e1 或 e2），学习的目 标函数定义为


    L = Σ_{r(e1,e2)∈Δ} Σ_{r(e1'',e2'')∈Δ''_r(e1,e2)} [γ + f_r(e1, e2) - f_r(e1'',
    e2'')]_+


    其中 [x]_+ ≜ max(0, x)，γ > 0 是分离正样本和负样本的边界值。该目标函数的原理是使正样本的能量比负样本的能量低，通过惩罚负样本的能量值完成学习过程。在测试的过程中，每种关系都设置一个能量阈值，如果三元组的能量小于阈值，则是正确的，否则不正确。因此，推理过程即是计算三元组能量的过程，当三元组的能量值小于阈值时，该三元组为推断出的新三元组。不同能量模型的区别在于能量函数的构造不同。


    知识图谱的表示学习是一个前沿学术热点方向，近年来不断有新的理论和方法提出。并且，表示学习和知识推理是两个相互关联的任务，这方面的更多工作将在第九章详细介绍。


    # 2.5 小结


    本章主要介绍了知识的表示方法。首先，介绍了传统人工智能领域从认知角度提出的不同知识表示方法，主要包括逻辑、语义网络、框架和脚本等方法。然后，介绍了在互联网时代从数据出发提出的语义网以及语义网的背景和其知识描述体系，知识图谱的表示和存储等方法大量使用了语义网的标准和体系。知识图谱是传统知识表示方法和语义网技术在互联网应用中的体现，它广泛利用了上述两类知识表示方法的技术和结果。另外，随着深度学习的发展，数值化表示技术在各领域、各任务中发挥着越来越重要的作用，本章最后介绍了知识图谱的数值化表示方法这一前沿任务，并对该任务的主要方法和当前发展进行了介绍。通过对当前表示方法和技术分析，不难发现，在知识图谱及其应用中，符号化和数值化表示的融合和统一是一个值得期待的发展方向。'
