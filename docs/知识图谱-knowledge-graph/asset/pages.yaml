    | ... | ... |


    传统实体链接方法通常使用 Wikipedia 等知识资源来构建指称项词典，包括 Wikipedia Entity Name，Wikipedia Redirection
    Page，Wikipedia Disambiguation Page，Wikipedia Anchor Dictionary 以及 Wikipedia 第一段里面的粗体字（也包括一些别名信息）。为了匹配模糊的或拼错的指称项，一些基于'
