    100 种命名实体的识别和抽取上，并取得了不错的性能。


    # 4.3 实体扩展


    # 4.3.1 任务概述


    实体扩展是一种开放域实体抽取的方法，随着互联网的快速发展，信息越来越丰富，其中大部分内容是由成千上万的用户依照个人习惯和需求提供的，比如私人博客、主题论坛、网络百科全书等。这些信息汇集在一起，呈现出多源、异构、海量的特点，对信息抽取技术提出了新的要求。在这种情况下，传统命名实体识别技术仅仅面向纯文本数据，抽取三大类、七小类命名实体的技术特点，难以应对新情况的挑战。很多情况下，用户并不需要一个从文本抽取三大类或者七小类实体的工具，更需要的是提供一些种子实体，然后获得同类实体的工具（例如
    Google Sets 就是这样的工具，将中国、美国、日本等国家名字作为种子输入到 Google Sets 中，就可以获得更多的国家名字）。为适应实际应用的需求，越来越多的研究者开始研究实体扩展技术[44,
    138, 146-149]。其目标是从海量、冗余、异构、不规范的网络数据中大规模地抽取开放类别的命名实体，进而构建开放类别命名实体列表。


    实体扩展在学术界和工业界都有非常广泛的应用。其在学术领域的主要应用包括：① 知识图谱中的实体扩展；② 提高问答系统性能，尤其是处理 List'
