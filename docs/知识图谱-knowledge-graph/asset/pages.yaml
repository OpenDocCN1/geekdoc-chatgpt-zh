  md: '于它的以下几个特点：


    +   - 知识图谱是人工智能应用不可或缺的基础资源。知识图谱在语义搜索、问答系统、智能客服、个性化推荐等互联网应用中占有重要地位，在金融智能、商业智能、智慧医疗、智慧司法等领域具有广阔的应用前景。

    +   - 语义表达能力丰富，能够支持很多知识服务应用任务。知识图谱源于语义网络，是一阶谓词逻辑的简化形式，并在实际应用中通过定义大量的概念和关系类型丰富了语义网络的内涵。一方面，它能够描述概念、事实、规则等各个层次的认知知识；另一方面，它也能够有效组织和描述人类在自然环境和社会活动中形成的海量数据，从而为各类人工智能应用系统奠定知识基础。

    +   - 描述形式统一，便于不同类型知识的集成与融合。本体（Ontology）和分类系统（Taxonomy）是典型的知识体系载体，数据库是典型的实例数据载体，它们的描述形式截然不同。知识图谱以语义网的资源描述框架（Resource
    Description Framework, RDF）规范形式对知识体系和实例数据进行统一表示，并可以通过对齐、匹配等操作对异构知识进行集成和融合，从而支撑更丰富、更灵活的知识服务。

    +   - 表示方法对人类友好，给以众包等方式编辑和构建知识提供了便利。传统知识表示方法和描述语言需要知识工程师具备一定的专业知识和技能，普通人群难以操作。知识图谱以实体和实体关系为基础的简洁表示形式，无论是专家还是普通民众都容易接受，这给以众包等方式编辑和构建知识提供了便利，为大众参与大规模知识构建提供了低认知成本的保证。

    +   - 二元关系为基础的描述形式，便于知识的自动获取。知识图谱对各种类型知识采取统一的二元关系进行定义和描述，为基于自然语言处理和机器学习方法进行知识的自动获取提供便利，从而为大规模、跨领域、高覆盖的知识采集提供技术保障。

    +   - 表示方法对计算机友好，支持高效推理。推理是知识表示的重要目标，传统方法在进行知识推理时复杂度很高，难以快速有效地处理。知识图谱的表示形式以图结构为基础，结合图论相关算法的前沿技术，利用对节点和路径的遍历搜索，可以有效提高推理效率，极大降低计算机处理成本。

    +   - 基于图结构的数据格式，便于计算机系统的存储与检索。知识图谱以三元组为基础，使得在数据的标准化方面更容易推广，相应的工具更便于统一。结合图数据库技术以及语义网描述体系、标准和工具，为计算机系统对大规模知识系统的存储与检索提供技术保障。'
