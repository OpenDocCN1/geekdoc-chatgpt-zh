- pgno: 17
  md: '# 第一章 概述


    1977 年，在第五届国际人工智能会议上，美国斯坦福大学计算机科学家爱德华·费根鲍姆发表了特约文章《人工智能的艺术：知识工程课题及实例研究》①，系统地阐述了“专家系统”的思想，并提出了“知识工程”的概念，从此知识工程成为人工智能的一个重要研究方向。在随后的
    30 多年，研究人员提出一系列知识表示、构建和应用的理论和方法，基于人工构建知识库的专家系统在多个具体应用领域取得成功，稳步推动了知识工程学科方向的发展；另一方面，由于依赖人工构建知识库，知识工程也遇到知识瓶颈的严重挑战。2012
    年 5 月，谷歌发布了新一代知识搜索引擎，可以展示与关键词所描述的实体或概念相关的人物、地点和事件等信息 [资源 1-1]。例如：对于关键词“中科院自动化所”，知识搜索引擎将它理解成一个实体“中国科学院自动化研究所”，并展示成立时间、地理位置、主管部门等基本信息，以及“中国科学院计算技术研究所”“中国科学院软件研究所”“中国科学院信息工程研究所”等相关实体，从而让使用者更加便捷地发现新知识。支持这种知识搜索功能的是一个称为知识图谱（Knowledge
    Graph）的基础设施，它是从 Wikipedia（维基百科）抽取出来的、规模巨大的、以相互关联的实体及其属性为核心的知识网络。知识图谱丰富的语义表达能力和开放互联能力，为计算机理解万维网的内容以及万维网知识互联打下了坚实的基础。一时间互联网巨头们纷纷跟进，构建了自己的知识图谱，包括微软
    Probase、百度知心、搜狗知立方等，而学术界也倾力研究各种知识图谱构建和应用的方法，知识工程再次成为人工智能领域的研究热点。


    ![](img/9549a57f481f525254296dec39e94079_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.1 什么是知识图谱


    知识是什么？知识的多少如何衡量？如何才能掌握知识？怎样才叫掌握了知识？这些都是难以回答的哲学问题。虽然人们在日常生活中、社会活动中无时无刻不需要利用知识：出门需要了解天气情况，出行需要了解交通规章制度，出国需要明白别国的文化和风俗习惯，社交需要熟悉语言技巧。但是，对于知识的准确定义，目前还没有统一的表述，只能从不同角度加以理解。


    Plato 认为知识是永恒不变的且适用于世间万物的真理。


    Feigenbaum 认为知识是经过消减、塑造、解释和转换的信息，即知识就是经过加工的信息。


    Bernstein 认为知识是由特定领域的描述、关系和过程组成的。


    Hayes-Roth 认为知识是事实、信念和启发式规则。


    Davenportr 认为知识是与经验（experience）、背景（context）、解释（interpretation）和思考（reflection）结合在一起的信息，它是一种可以随时帮助人们决策与行动的高价值信息。


    Harris 认为知识是信息、文化脉络及经验的组合。


    Nonaka 认为显式的或者已编码的（codified）知识是指一种用正式、系统化的语言传输的知识；另一方面，他认为隐性知识拥有个性化的特征，这使得隐性知识很难进行形式化描述和分享。


    在新华词典中，知识的定义是：人类的认识成果。来自社会实践。其初级形态是经验知识，高级形态是系统科学理论。按其获得方式可分为直接知识和间接知识。按其内容可分为自然科学知识、社会科学知识和思维科学知识。知识的总体在社会实践的世代延续中不断积累和发展。


    虽然人类涉及的知识非常广泛，但总体上可以分为陈述性知识（或称描述性知识）和过程性知识（或称程序性知识）两大类。陈述性知识描述客观事物的性状等静态信息，主要分为事物、概念、命题三个层次。其中事物指特定的事或物，概念是对一类事物本质特性的反映，命题是对事物之间关系的陈述。命题又可分为非概括性命题和概括性命题两类，非概括性命题表示特定事物之间的关系，概括性命题描述概念之间的普遍关系。过程性知识描述问题如何求解等动态信息，分为规则和控制结构两种类型，其中规则描述事物的因果关系，控制结构描述问题的求解步骤。在对各种知识进行收集和整理的基础上，进行形式化表示，按照一定的方式进行存储，并提供相应的知识查询手段，从而使知识有序化，这是知识共享和应用的基础。知识的编码化和数字化形成了知'
  merge: -1
  img_proc: true
- pgno: 19
  md: '识库。


    知识蕴含在数据之中。互联网时代，人类在与自然和社会的交互中生产了异常庞大的数据，这些数据中包含了大量描述自然界和人类社会客观规律的有用信息，这些信息以图片、声音、文字、视频等各种载体表示和存储。如何让计算机自动阅读、分析、理解这些海量、繁杂乃至泛滥的数据，从中挖掘有价值的知识，向用户提供精准知识服务，是构建下一代信息服务，乃至人工智能技术的核心目标之一。


    计算机擅长处理结构化数据。然而，互联网中大量的信息以非结构化的形式存储和传播，为了让计算机能够处理这些信息，就需要理解这些非结构化形式数据蕴含的语义，分析其中的语义单元之间的关系，从而将其转换成结构化形式。图是一种能有效表示数据之间结构的表达形式，因此，人们考虑把数据中蕴含的知识用图的结构进行形式化表示。数据的结构化并和已有的结构化数据进行关联，就构成知识图谱。知识图谱对于知识服务有重要的支撑作用，能够将传统基于浅层语义分析的信息服务范式提升到基于深层语义的知识服务。因此，学术界和工业界都给予知识图谱高度关注，将其作为新一代人工智能的基础设施。


    知识图谱目前在学术界还没有统一的定义。按照 Wikipedia 的描述，知识图谱是谷歌公司用来支持从语义角度组织网络数据，从而提供智能搜索服务的知识库。从这个意义上讲，知识图谱是一种比较通用的语义知识的形式化描述框架，它用节点表示语义符号，用边表示符号之间的语义关系（如图
    1.1 所示）。


    ![](img/9549a57f481f525254296dec39e94079_19_0.png)


    图 1.1 知识图谱样例'
  merge: -1
  img_proc: true
- pgno: 20
  md: '在计算机世界中，节点和边的符号通过“符号具化（symbol grounding）”表征物理世界和认知世界中的对象，并作为不同个体对认知世界中信息和知识进行描述和交换的桥梁。这种使用统一形式描述的知识描述框架便于知识的分享与利用。


    在计算机科学技术领域，对知识和结构化数据的表示和存储具有不同的技术路线，最典型的包括本体（Ontology）和数据库（Database）两类。


    本体这个术语源于哲学，是一套对客观世界进行描述的共享概念化体系。在人工智能领域，本体是通过对象类型、属性类型以及关系类型对领域知识进行形式化描述的模型。本体强调的是抽象的概念表示，例如不同类型的人、他们之间具有什么类型的语义关系，而不关注具体的个体信息，例如某人是什么类型的人，某人和某人是什么关系。因此，本体[资源1-2]只对数据的定义进行了描述，而没有描述具体的实例数据。


    ![](img/9549a57f481f525254296dec39e94079_20_0.png)


    数据库是计算机科学家为了用电脑表示和存储计算机应用中需要的数据而设计开发的产品。尽管有不同类型的数据库（如关系数据库、面向对象数据库、非关系型数据库等），一般它主要用于存储数据，这些数据可以进行传递和交换。但是，对于数据的描述和定义，在传递和交换过程中，会假定参与方都已经明白和理解，例如在使用数据库中的学生信息表进行信息管理系统开发时，会假设开发者对表结构（如有什么属性、属性的数据类型是什么、是不是主键、对应的外键是什么等）了如指掌。数据库系统对数据描述和数据本身的操作提供了不同的描述语言，例如，创建数据库表结构用“Create
    Table**”，而插入数据到表中使用“Insert ** Values **”。因此，我们认为，数据库系统对数据描述和数据记录的表示和存储采用了不同的机制。


    实际上，人工智能应用中不仅需要具体的知识实例数据，数据的描述和定义也非常关键，例如概念上下位知识（‘大熊猫’是一种‘熊科动物’）、属性之间的关系（‘子女’与‘父母’是逆关系①）、属性的约束（一个‘人’的‘父母’只有‘2个’）等。知识图谱用统一的形式对知识实例数据的定义和具体知识数据进行描述，即用三元组形式（二元关系）对知识系统进行资源描述和存储。例如：Wikidata
    中不仅用 <Max Planck, instance of, human>、<Max Planck, occupation, physicist> 和 <Max
    Planck, place of birth, Kiel> 表达了具体的实例数据，也用 <physicist, subclass of, scientist>、<place
    of birth, value type constraint, geographical object> 和 <place of birth, subproperty
    of, location> 等三元组对相关知识结构进行了描述。各个具体实例数据只有在


    ① 也称“逆属性”（inverse property）。'
  merge: -1
