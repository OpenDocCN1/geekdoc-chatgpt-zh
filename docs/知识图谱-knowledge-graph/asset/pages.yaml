    等[505] 提出将信息检索的方法应用到事件抽取中。Yu 等[313] 提出了层次化的事件识别方法，取得了较好的效果。Huang 等[222] 提出联合抽取事件和事件结构信息的方法，该方法同时利用符号特征和分布式特征来表示事件的框架，并利用一个联合模型同时抽取事件的触发词、事件元素和事件元素扮演的角色。


