  md: '# 2. 候选答案特征抽取


    对于知识图谱中的每一个节点，我们都可以抽取出以下特征：该节点的所有关系（relation，记作 rel，如出生地、职业等），该节点的所有属性（property，记作
    prop，如类型、出生年月等），以及它们对应的值。对于知识问答，另一类特征非常重要，就是该节点与主题实体节点的关系/路径，例如“屠呦呦”与“宁波市”是“出生地”关系。如图
    10.12 所示，对于候选答案“宁波市”，可以提取“省份 = 浙江省”“国家 = 中国”“类型 = 地名”“与 topic 关系 = 出生地 −r”（R−r
    表示关系 R 的逆关系）等特征。


    ![](img/9549a57f481f525254296dec39e94079_252_0.png)


    图 10.12 候选答案特征图


    # 3. 问句-候选答案匹配


    单纯依靠问题中的特征和候选答案中的特征还不够，我们还需要知道“哪里人”和“与 topic 关系 = 出生地 −r”应该对齐，“哪里”与“类型 = 地名”应该对齐。因此，我们可以把问句中的特征和候选答案中的特征进行组合，希望一个关联度较高的问题-候选答案特征具有较高的权重。该权重的学习可以利用机器学习模型。例如，把从候选答案中找出正确答案的过程建模为一个二分类问题（判断每个候选答案是否为正确答案），可以使用形如（问题-答案）对的训练数据学习一个分类器来判别是否为正确答案，分类器的输入特征向量就是以上特征的组合。需要说明的是，当学习数据充分的时候，基于机器学习模型可以学习这种对齐关系。实际上，比较好的线下资源（如短语与关系的对齐数据）能够辅助问题-候选答案的匹配判断。


    # 10.2.3.2 基于表示学习的神经网络方法


    基于特征工程的方法还需要自行定义和抽取特征，并且，在计算问题和候选答案相关度的时候，需要对问句中的特征和候选答案中的特征进行笛卡尔积'
  merge: -1
  img_proc: true
- pgno: 253
  md: '运算，这可能使得特征维度扩大到难以处理。为了解决这类问题，可以使用基于表示学习的神经网络方法（即基于深度学习的方法）。近年来，随着深度神经网络技术的不断发展，有很多基于神经网络的知识问答方法通过学习的方式得到问句和候选答案的数值表示并以此训练匹配模型。具体地，通过表示学习方法，模型将用户用自然语言表示的问题转换为一个低维空间中的数值向量，同时把知识库中的实体、概念、类别以及它们之间的关系表示为同一语义空间中的数值向量。于是，知识问答任务（判断候选答案集合中哪些实体是正确答案）可以看成是问句的表示向量与候选答案的表示向量匹配程度计算的过程。


    Bordes 等人于 2014 年发表在 EMNLP 上的文章 “Question Answering with Subgraph Embeddings”
    是这类方法的奠基性工作 [63]，首次将神经网络的方法应用于知识库问答。首先将问句以及知识库中的候选实体（以及相关实体、关系和属性）都映射到低维空间中，然后计算问题和候选答案的匹配程度。在该模型中，问句由词向量的平均表示，候选答案的表示可以分成三种：①
    答案实体的向量表示；② 答案路径（该实体与主题实体的关联路径）的向量表示（符号向量直接相加）；③ 和答案直接相关的实体和关系子集的向量表示，称为子图向量表示（subgraph
    embedding）。


    具体地，问句和答案的相似度表示如下：


    S(q, a) = f(q)^T g(a)  (10.3)


    其中，问句表示为 f(q) = W^T φ(q)，和前面的工作一样；答案表示为 g(a) = V^T φ(a)。φ(a) 可以为上述三种不同的表示方式（其中
    2 和 3 是将相应的实体和关系的向量直接相加）。W 是向量表示矩阵，自然语言的词汇以及知识库中的实体和关系都在这个表示矩阵之中。通过设计基于边界的排序损失函数能够训练该模型，基于训练样本
    (q, a)，可以构造负例 (q, a'')（a'' 可以从候选答案实体集合中除正确答案之外的其他实体采样得到），该神经网络匹配模型的训练目标是使正样本的匹配得分大于负样本的匹配得分加上一个间隔值
    γ，即：


    ∀a'' ≠ a, f(q)^T g(a) > γ + f(q)^T g(a'')  (10.4)


    因此，可以采用如下损失函数训练模型：


    [γ − f(q)^T g(a) + f(q)^T g(a'')]₊  (10.5)


    其中，[x]₊ 表示 max(0, x)。根据梯度下降法可以不断更新模型参数 W 和 V。


    上述基本模型把问句和答案都表示为词袋模型，没有考虑词的顺序性，也没有考虑到答案不同类型属性的不同特性。近年来，不断有新的模型可以获取'
  merge: -1
  img_proc: true
- pgno: 254
  md: '更丰富的问题、答案语义表示以及它们之间的关联。为了获取更丰富的问句语义表示，Dong 等人提出了利用卷积神经网络模型获取问句组合语义¹³²，并且，针对答案实体类型、答案实体与主题实体的关联路径以及其他相关属性等三种不同的答案表示，利用了三套不同参数的卷积神经网络模型。Hao
    等人提出了基于交叉关注机制的神经网络模型¹⁹⁶，可以根据不同的答案及其不同侧面动态地表示问句的语义，同时动态地考虑它们之间的联系。具体地，不同答案的不同侧面对问句的关注点不同，而且决定了问句是怎样表示的；而问句又对不同答案侧面进行不同权重的关注。注意力的强弱程度在问句表示时被当作每个词的权重。这种基于关注机制的问答匹配模型能有效提升问答匹配效果。


    以上这些工作都是在知识库问答上利用神经网络模型的代表性工作，可以看到，这类方法已经可以在知识库问答上发挥作用。实际上，神经网络的方法是将知识库问答转化为在众多的答案候选中选择最相似的，并没有对自然语言问句进行语义解析。但是由于此类方法不需要人工设计规则和特征，对于自然语言处理工具依赖程度低，所以有更好的迁移性，更适用于互联网大规模的知识库问答应用。


