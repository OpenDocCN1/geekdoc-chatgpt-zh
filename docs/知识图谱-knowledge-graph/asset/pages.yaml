    \ Person 的一个实例；另一类是通过 FILTER 关键字给出的条件限制，这些条件包括数字大小的限制、字符串格式的限制等。最后的修饰符是可选的，用于对查询结果做一些特殊处理，例如常见的修饰符有用于表示排序的\
    \ ORDER 子句、用于限制结果数量的 LIMIT 子句等。例如，在图 8.13 所示的图中查询类型既是“数学家”也是“物理学家”的节点，其对应的 SPARQL\
    \ 语句为\n\n```\nprefix ns: <http://example.org/ns#>\nSELECT ?s\nWHERE {\n    ?s\
