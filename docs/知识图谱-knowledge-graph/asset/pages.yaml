  md: '例如，我们想知道“C 罗的国籍是什么？”，以下两条规则都可以用于此任务：

    父亲 (X,Y)∧ 国籍 (Y,Z) ⇒ 国籍 (X,Z)

    孩子 (X,Y)∧ 国籍 (Y,Z) ⇒ 国籍 (X,Z)


    这两条带有变量的规则就是马尔可夫逻辑网中的规则模板，它们分别表示“一个个人和其父亲拥有同样的国籍”以及“一个个人和其孩子拥有同样的国籍”，虽然在现实世界中两条规则大部分情况下都是正确的，但也不排除移民、母方国籍等因素，使得两条规则有着不同的成立概率。为此，马尔可夫逻辑网模型在每一个规则上绑定一个权重，并将不同逻辑规则对推理目标的贡献合并到统一的概率模型下，如下所示：


    P_w(X = x) = 1/Z exp[ Σ_{f_i ∈ F} w_i Σ_{g ∈ G_{f_i}} g(x) ]

    = 1/Z exp[ Σ_{f_i ∈ F} w_i n_i(x) ] (9.1)


    其中 g(x) = 1 时表示这一条实例化的规则是真的，反之是假的，而第二行中的 n(x) 则是 g(x) 为 1 的计数。F 为 Markov 网中所有谓词规则的集合，G_{f_i}
    是利用所有原子事实去实例化规则 f_i 后的集合。Z = Σ_{x'' ∈ X} exp[ Σ_{f_i ∈ F} w_i n_i(x) ] 是集合了所有可能世界的归一化参数。马尔可夫逻辑网等概率逻辑推理模型的研究围绕结构学习、参数学习和推理三个重要任务展开，并从中涌现出大批研究成果。


    结构学习又可以称为概率逻辑推理模型下的规则自动挖掘，其目的不仅仅是从实例级的数据中获得逻辑规则的样式，也要在获得的逻辑规则集合的作用下确保目标世界概率最大。Kok
    和 Domingos 结合归纳逻辑编程（Inductive logic Programing, ILP）和特征归纳的思想，尝试在结构学习的每个迭代步骤中，以自顶向下方式搜索具有最优加权伪似然的候选逻辑规则[245]，然而由于候选子句数目巨大，使得算法很容易陷入局部最优。为了有效缩减候选子句的个数，Mihalkova
    和 Mooney 采取自底向上的搜索策略直接构造有意义的候选子句集合，然后逐个添加到马尔可夫逻辑网中并对世界概率进行评估[330]，但由于这种方法需要在每一步时都对规则进行实例化操作，导致计算最优结构集合的效率明显降低。为了克服这一问题，有研究者提出使用迭代局部搜索的启发式策略代替全局搜索[339]，以实现高效率的结构学习，同时一些学者提出了判别式的结构学习方法，通过最大化伪条件似然来选择结构[223]。其他的结构学习方'
