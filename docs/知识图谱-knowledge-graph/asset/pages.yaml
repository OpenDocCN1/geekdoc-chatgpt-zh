  md: '有标注数据。开放域事件抽取主要是基于无监督的方法，该方法主要基于分布假设（Distributional Hypothesis）[198]理论，其核心思想是：如果两个词出现在相同上下文中且用法相似，那么这两个词就意思相近。相应地，在事件抽取中，如果候选事件触发词或者候选事件元素具有相似的语境，那么这些候选事件触发词倾向于触发相同类型的事件，相应的候选事件元素倾向于扮演相同的事件元素。基于此理论，无监督事件抽取将候选词的上下文作为表征事件语义的特征。在无监督的事件抽取方法中，按照所用方法的不同，开放域事件抽取又可以分为基于内容特征的事件抽取方法和基于异常检测的事件抽取方法。


    # 7.3.1 基于内容特征的事件抽取方法


    基于内容特征的事件抽取方法一般包含如下步骤：① 文本表示：对表示事件的句子、段落或者文档进行预处理，并表示为统一的特征形式，为后面的模块做准备。② 事件聚类与新事件发现：基于文本表示，利用无监督方法将同类事件表示聚类，并发现新事件。在基于无监督的事件抽取方法中，Yang
    等[508]1998年提出的组平均聚类方法最具代表性。主要思想如下：


    +   1. 文本表示：对每篇文档首先进行句子划分和去停用词等预处理操作，然后对篇章中的词计算 TF-IDF 并据此进行排序，利用 Top K 个词的 TF-IDF
    值组成的特征向量代表整个篇章。

    +   2. 事件聚类与新事件发现：组平均聚类算法（Group Average Clustering）

    +      （1）将待聚类文本按时间顺序排序，把每篇文档都当作一个类。因为，通过对数据的观察发现，新闻对事件的报道在时间上具有时效性和集中性，一般一个事件的报道周期在两个月左右，所以，在聚类的时候应该考虑到时间因素的影响。

    +      （2）将现有的结果划分成连续但是不重叠的固定个数的部分。

    +      （3）对每个部分利用聚类算法进行聚类，将底层的类聚类为高层的类。直到每个部分聚类为指定的规模。

    +      （4）取消部分的边界限制，对所有的类进行聚类，并更新第 2 步中的划分。

    +      （5）重复第 2 ～ 5 步，直到所有的类别到达指定的规模。


    有很多研究采用聚类的方法进行事件识别和抽取，Nallapati[350]提出使用余弦相似度计算新闻间的语义相似性，将时间跨度纳入新闻相似度衰减的考量中，最后利用层次聚类进行事件的抽取。Jia
    等[532]首先统计分析文档中的词汇，然后根据统计结果扩展相关词汇，最后使用聚类的方式抽取事件。Stokes 等[445]提出了一种基于文档多层表示的事件抽取方法，不仅基于文本内容对文档进行'
  merge: -1
