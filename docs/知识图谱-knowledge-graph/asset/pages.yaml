  md: '而是表示成由多个链接组成的非链式或有嵌套的复杂结构时，我们所查询的不再是一个原子的三元组事实，并且在知识图谱中缺乏这种结构的显式定义，这时需要使用推理的方法将结构预测出来。这种情况可能是由于缺失知识图谱中某种关系的明确定义，例如在
    Freebase 中没有“奶奶”的明确定义；还可能是由于问题的答案本身就是个复杂的结构，例如“桃树在开花后会结果，在此过程中开花的主要目的是什么？”，这一问题的答案是“吸引蜜蜂采蜜”，就是一个复杂的结构。我们将这一类问题划分为复杂推理问题。


    无论是知识图谱的补全任务，还是基于知识图谱的问答，都需要利用和发现未显式表达的知识实例数据，因此知识推理是知识图谱应用的重要技术。相对而言，知识补全任务在进行知识推理检测时更方便、更直接，后面介绍的各种知识推理方法都利用知识补全进行说明和验证。


    # 9.2 知识推理分类


    推理是逻辑学、哲学、心理学、人工智能等学科的重要概念，早在古希腊时期，著名思想家亚里士多德就提出了成为现代演绎推理基础的三段论。在计算机及人工智能领域，推理是一个从前提到结论的过程，一般认为，推理可以被分为三类，即演绎推理（deduction）、归纳推理（induction）、设证推理（abduction，也称为溯因推理）。这是一种从任务对推理进行的分类。


    从推理方法上看，推理主要可分为确定性逻辑推理、概率推理（不确定性推理）。传统的人工智能体系中，大多都包含逻辑推理或概率推理，并且对逻辑的研究往往伴随着自动推理技术的发展。


    近几年来，由于深度学习技术和符号数值化表示的发展，表示学习方法也被应用到知识图谱的推理任务中，此方法用于表示逻辑或者跳过逻辑直接对推理目标进行预测。因此，相比于传统的符号推理方法，这种表示学习的方法可以归结为数值推理。


    后续的三个小节中，我们分别具体地介绍归纳推理和演绎推理，确定性推理与不确定性推理，以及符号推理和数值推理的相关内容。


    # 9.2.1 归纳推理和演绎推理


    按照推理任务，推理可以被分为三类，即归纳推理 (induction)、演绎推理 (deduction)、设证推理 (abduction)，但由于设证推理具有一定的特殊性，且不'
