    # 7.4.3 子事件关系抽取


    子事件关系反映了事件之间的粒度和包含关系，例如：“地震事件”一般包含“伤亡”“救援”“捐款”和“重建”等子事件。随着互联网的普及和快速发展，一旦出现诸如“MH370航班失联”等的重大事件，大规模的涵盖各个方面（从失踪情况可能的原因到调查和搜寻）的新闻报道将对该事件进行连续报道。虽然许多网站会专门创建“专题”网页，用来组织相关的新闻，但是让用户通过阅读所有新闻文档来了解事件的来龙去脉和最新进展仍然是不可能的，动态地从新闻流中抽取出子事件知识，将极大地方便用户理解事件内容。研究人员为此做出了一些探索[28,
    30, 71, 166, 255, 260, 280, 309, 433, 507, 509]。在这一方面的代表性研究是 Hu 等提出的系列工作。Hu 等[216]
    首先提出基于先验的增量子事件学习模型，将以后相似事件的子事件知识作为先验，增强当前事件的子事件抽取。除此之外，为了充分利用现有的子事件关系知识（Wikipedia
    中的事件页面知识），从相似事件维基页面中学习一类事件的层次话题（子事件）知识，Hu 等[218] 提出了一个新的基于概率的贝叶斯网络结构学习方法，该方法有效缓解了不同事件维基页面的多样性问题，可以建模子事件的结构关系。在抽取子事件知识基础上，Hu
    等[217] 提出了一个端对端的上下文相关的层次 LSTM 模型，输入已观测的子事件描述文本，自动生成下一个可能的子事件描述文本。


    # 7.4.4 事件时序关系抽取


    ![](img/9549a57f481f525254296dec39e94079_175_0.png)


    事件时序关系是指事件在时间上的先后顺序，例如：“小明进入餐馆后马上点了菜”和“小明吃完饭后直接回家了”在时间上就具有先后顺序。事件时序关系不仅有助于厘清事件发生的先后顺序，还能辅助其他事件关系的发现，例如：一个事件的原因一定发生在这个事件之前，一个事件的子事件发生的时间一定与这个事件发生的时间重叠。目前，绝大多数事件时序关系的研究都集中在英文文本上。使用最广泛的语料库是
    TimeBank[资源 7-3]。目前主流方法是基于机器学习方法的事件时序关系抽取，该类方法一般将事件时序关系识别转化为一个多分类问题。TimeBank 的标注遵循
    TimeML 标注体系。TimeML 是一种标识新闻语料中事件、时间以及它们之间关系的标注体系，它将时序关'
