    算法[109]、Nauty 算法[320] 等。感兴趣的读者可以参考文献 “A Performance Comparison of Five Algorithms
    for Graph Isomorphism”[160]，该文献对常用的五种子图同构算法进行了详细的比较。


    # 算法 1 Ullmann 子图判定算法


    ```

    输入： 图 A、图 B 的邻接矩阵 M_A、M_B

    输出： 所有合法的映射矩阵集合 ANS

    1: ANS={} ▷ 合法的映射矩阵集合

