- pgno: 229
  md: '式表示，来对知识图谱中的关系路径或者逻辑规则的身体部分进行分布式的表示。这类方法将普通原子关系扩展到一个关系序列上，认为知识图谱中一个关系序列的向量表示可以用来预测两个实体间是否存在这个关系序列下的路径，而这正是马尔可夫逻辑网等概率推理模型进行规则实例化的目的，因此合并表示学习与逻辑推理的思路是可行的。由此，将逻辑规则表示成前提
    ⇒ 假设，按照 Horn 子句的定义，规则身体部分的前提应该是一条知识图谱上的路径。如公式 9.14，TransE 将关系表示成在实体分布式空间中的转移，并假设头实体和关系的向量之和应该在实体空间中接近尾实体，即
    $E_h + E_r = E_t$。若换一种方式思考，一个元组本身是长度为 1 的路径，也是长度为 1 的规则的身体部分，那么扩展 TransE 的思想，将长度为
    1 的路径 $r$ 推广成长度任意的路径，则可以得到当路径 $p(h,t)$ 存在于知识图谱中时有如下等式：


    $E_h + E_p = E_t$  (9.15)


    在扩展的 TransE 的假设下，再继续探索路径以及路径中关系类型之间的关联。例如，对于路径 $h \xrightarrow{r_1} x \xrightarrow{r_2}
    t$，根据 TransE 的假设可以得到：$E_h + E_{r_1} = E_x$ 和 $E_x + E_{r_2} = E_t$。之后重写第二个等式得到
    $E_x = E_t - E_{r_2}$，将重写后的等式代入到第一个等式中消掉中间变量则得到 $E_h + E_{r_1} + E_{r_2} = E_t$，对比之前的等式
    9.15，可以发现 $E_p = E_{r_1} + E_{r_2}$，也就是说在 TransE 的假设下路径的向量表示约等于路径中含有的关系向量之和，更普遍地有，


    $E_p = \sum_{r_i \in p} E_{r_i}$  (9.16)


    更进一步地推导，我们可以得到更有趣的结论。对于一个三元组 $r(h,t)$，有 $E_h + E_r = E_t$，若 $h$ 和 $t$ 之间存在一条路径
    $P$，有 $E_h + E_p = E_t$，则可以得到 $E_r = E_p$，也就是说若一个三元组中的两个实体间存在一条路径，那么这条路径的向量表示应该接近于三元组关系的向量表示。


    下面介绍两个对符号演算和数值计算进行了融合的具体工作。


    第一个工作是通过串行地合并知识图谱嵌入式表示和概率逻辑推理的方式$^{[481]}$，首先利用表示学习运算速度快的特點，过滤掉低概率的答案，并把答案缩小在一个较小的候选集内，如图
    9.5 中的 (a) 部分所示。这一步骤在很大程度上减小了计算复杂度，例如需要推理的问题是“谁是奥巴马的母亲？”，那么所有知识图谱中的人类实体都有可能是候选答案（这里我们不对性别做特殊限制，因为这需要人类某种规则化的先验知识，并不是所有的问题类型都含有这种先验）。'
