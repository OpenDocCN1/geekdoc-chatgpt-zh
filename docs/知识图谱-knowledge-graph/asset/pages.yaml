    减少了维数灾难问题：一些统计模型往往需要捕捉多个原子特征之间的联合分布，会令特征空间呈指数型增长，而特征经过向分布式空间映射后，对特征之间的复杂关系进行了解耦；②
    减少了数据稀疏性问题：在知识图谱、社交网络和推荐系统等稀疏图或稀疏矩阵数据中，稀疏性问题十分严重，而表示学习通过数值计算填充了稀疏矩阵，在一定程度上解决了数据稀疏性的问题；③
    使符号数据可直接参与运算且计算速度非常快：建立在分布式空间上的相似度函数或其他计算函数可以直接运用符号元素之间的分布式表示，而不必借用其计数、分布等统计量。知识图谱上的表示学习方法主要分为两大类：基于张量分解的方法和基于能量函数的方法。


    # 9.4.1 基于张量分解的方法


    矩阵（张量）分解的基本思想是用多个低维的矩阵或张量的积代替原始的关系矩阵，从而用少量的参数替代稀疏而大量的原始数据。Koren 等人最先将矩阵分解的方法应用到推荐系统中并赢得了
    Netflix 百万美元大奖，令矩阵分解技术的应用成为热点，上海交大 ACM 团队也在其基础上开发了基于特征的矩阵分解，并在 2012 年 KDD Cup
    中取得了冠军。但矩阵分解的方式只能捕捉两个元素之间的关系，并不适用于三元组知识图谱。


    首先分析二维矩阵的情况，以用户和商品的打分为例，图 9.2 列举了一个用户-商品打分矩阵 R。我们为每一个用户和商品都分配了一个 6 维的向量，称为分布式向量；用户的分布式向量组成用户矩阵，记为
    U；商品的分布式向量组成商品矩阵，记为 I；我们期望矩阵 U 和矩阵 I 的积尽可能地接近原有的用户-商品打分矩阵。为实现这一目的，使用数值优化的方式，设计出以下的损失函数：


    L = ||UI − R||

    = Σ_{u∈U} Σ_{i∈I} ||u·i − r_{ui}||

    (9.12)


    其中向量 u 是矩阵 U 的一行，向量 i 是矩阵 I 的一列，r_{ij} 表示第 i 个用户对第 j 个商品的打分值。通过反复地迭代，就可以看到各个用户和商品的分布式表示。'
