    # 6.1.2 任务分类


    根据处理数据源的不同，关系抽取可以分为以下三种：


    +   - 面向结构化文本的关系抽取。结构化文本包括表格数据、XML 文档以及数据库数据等，这类数据通常具有良好的布局结构，因此抽取比较容易，可针对特定网站编写特定模板进行抽取，抽取准确率也比较高。

    +   - 面向非结构化文本的关系抽取。非结构化文本指的就是纯文本，例如，从句子“姚明 1981 年出生于中国上海”这句话中，我们希望识别出姚明和上海之间是出生地这一语义关系。但是，由于自然语言表达的多样性、灵活性，实体关系在文本中一般找不到明确的标识，这使得从中抽取、识别语义关系非常困难，需要自然语言处理技术的支持。相对来说，从非结构化文本中抽取关系的准确率较低。

    +   - 面向半结构化文本的关系抽取。半结构化文本介于结构化和非结构化之间，数据的分布或布局具有一定的规律，但通常这种规律的类型是多样的，也是隐含的、或者说没有显式的标识，难以用人工的方法穷举各种类型的模板，需要对模板进行自动的学习。目前，针对模板相对连续的半结构文本，现有的技术也能达到较高的抽取准确率[35][113]。


    根据抽取文本的范围不同，关系抽取可以分为句子级关系抽取和语料（篇章）级关系抽取。


    +   - 句子级关系抽取，也称为句子级关系分类，即从一个句子中判别两个实体间是何种语义关系。如上面的例子所示，我们需要从当前的这句话中识别出'
