  md: '![](img/9549a57f481f525254296dec39e94079_91_0.png)


    图 3.8 电影 “Mission: Impossible”


    言的知识关联和共享。


    不同机构、不同个人都可以自由地构建所需知识图谱，各个知识图谱的数据来源非常广泛、质量也会参差不齐、关注领域也不尽相同。因此，导致知识图谱之间存在多样性，不同知识图谱存在异构性。知识融合通过对多个相关知识图谱的对齐、关联和合并，使其成为一个有机整体，是一种提供更全面知识共享的重要方法[4,
    136]。按照融合元素的对象的不同可以分为框架匹配和实体对齐：框架匹配指对概念、属性、关系等知识描述体系进行匹配和融合，实体对齐指通过对齐合并相同的实体完成知识融合。通过框架匹配和实例对齐可以把不同知识图谱关联在一起，但是，多个知识图谱中的实例知识常常有冲突，因此，如何检测多个知识图谱之间的冲突并进行消解也是知识融合的重要步骤。下面分别介绍框架匹配、实体对齐和冲突检测与消解。'
