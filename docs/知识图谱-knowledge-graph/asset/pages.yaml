    Nickel 最先将这种方法推广到三维张量空间中，以适应三元组知识图谱的结构，他提出了 RESCAL 模型^[363]^（如图 9.3 所示）。RESCAL
    的核心思想是将知识图谱看成一个三维张量 X，其中每个二维矩阵切片代表一种关系，如果两个实体存在某种关系，则将矩阵中对应的值标为 1，否则为 0；之后将张量
    X 分解为实体矩阵 A 和一个低阶三维张量 R 的乘积 X ≈ A R A^T，其中矩阵 A 的每一行代表一个实体的向量，张量 R 的每个切片 R_i 表示第
    i 种关系。随后，RESCAL 被应用到 YAGO 等知识图谱的表示学习中，以证明它的有效性。


