  md: '除了上述 MUC、ACE 和 TAC 三大国际评测会议外，另一个比较有影响力的国际评测会议是语义评测会议（SemEval）。SemEval 会议从 1998
    年举办，截止到 2018 年已经成功举办 11 届，影响力非常广泛，设有词语语义消歧、语义标注、时间识别和关系抽取等多项任务。在使用最为广泛的 SemEval
    2010 评测集中共定义了 9 类关系（工具-代理、原因-影响、内容-容器、产品-生产商、实体-出生、成分-整体、实体-目的地、成员-集体、消息-主题）和一个其他类。


    # 6.2 限定域关系抽取


    限定域关系抽取指在一个或者多个限定的领域内判别文本中所出现的实体指称之间是何种语义关系，且待判别的语义关系是预定义的。因此，已有研究常把这一任务看成是一个文本分类任务，即在输入一个句子以及标识句子中所出现的实体指称的条件下，系统将其分类到所属的语义类别上。早期针对这一任务的研究多是采用模板的方式对文本中实体间的语义关系进行判别，随着统计机器学习的发展，越来越多的研究者采用有监督学习的方法，即针对每个关系类别标注充足的训练数据，然后设计关系抽取模型，其研究多关注于如何抽取有效的特征。根据从句子中所提取表征语义关系特征的方式的不同，我们可以把已有方法分为传统基于特征工程的关系分类方法和基于深度学习的关系分类方法。但是，人工标注语料耗时费力，成本高，因此很多情况下很难获得足够的训练数据，因此有很多研究利用弱监督学习的方法抽取关系。下面对这些方法分别进行介绍。


    # 6.2.1 基于模板的关系抽取方法


    基于模板的关系抽取方法通过人工编辑或者学习得到的模板对文本中的实体关系进行抽取和判别。例如，假设 X 和 Y 表示公司类型，可以使用如下模板表示收购（ACQUISITION）关系。


    ```

    X is acquired by Y

    X is purchased by Y

    X is bought by Y

    ```


    当一个句子中所出现的实体指称的上下文文本满足上述模板时，就可以认为这'
