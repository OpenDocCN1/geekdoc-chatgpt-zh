    # 5.1.3 相关评测


    目前主流的命名实体消歧评测平台主要有两个：一个是 WePS（Web Person Search Clustering Task）评测[37, 38]，主要针对基于聚类的命名实体消歧系统进行评测；第二个是
    TAC KBP 的 Entity Linking 评测[321]，主要针对基于实体链接的命名实体消歧系统进行评测，下面分别介绍。


    # 1. WePS 评测


    WePS 主要针对 Web 人名搜索结果的消歧技术进行评测，其任务是通过对人名搜索结果进行聚类来消除歧义。该评测由 UNED 大学组织，一共进行了三届。第一届
    WePS 于 2007 年举办，作为 SemEval2007 的子任务进行，共有 15 家单位参加。第二届评测作为 WWW 2009 的子任务进行，共有 17
    家单位参加。第三届 WePS 作为 CLEF 会议的一个子任务进行，共有 34 家单位'
