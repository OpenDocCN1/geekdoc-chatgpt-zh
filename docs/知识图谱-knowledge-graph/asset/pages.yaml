- pgno: 99
  md: '章介绍了两种知识体系的构建方法：人工定义构建和自动学习构建。


    +   - 知识体系具有很高的抽象性及概括性，高质量的类别体系需要通过人工进行构建，构建的过程主要包括如下六个阶段：确定领域及目的、考虑复用、罗列要素、确定分类体系、定义属性及关系、定义约束。需要注意的是，上述几个阶段并非严格的线性关系，有时需退到更早的阶段。\n-
    知识体系也可以通过自动学习获得，根据学习的数据源不同，这类方法可以分为如下三类：基于非结构化数据的方法、基于结构化数据的方法和基于半结构化数据的方法，其中基于非结构化文本的方法是自动学习知识体系的主要方法。\n-
    知识表示的异构性导致不同的知识图谱难以被联合使用，因此融合不同知识图谱成为解决知识集成和共享的核心问题。根据对齐的知识元素类型可以分为框架匹配和实体对齐。'
