    # 1. Cyc


    Cyc 是一个通用的常识知识库 [269]，始建于 1984 年，其目的是将上百万条知识编码为机器可处理的形式，并在其基础上实现知识推理等智能信息处理任务。Cyc
    主要由人工构建，经过多年的发展，目前 Cyc 包含 50 万实体，接近 3 万个关系以及 500 万事实。Cyc 项目试图用表达能力受限的一阶谓词对自然语言表达的知识进行描述，由于自然语言本身的复杂性和歧义性，难以完整地对自然语言中蕴含的包括隐含关系在内的各种复杂知识进行表示。OpenCyc
    是 Cyc 项目开放出来免费供大众使用的一个子集，目前 OpenCyc 包含 24 万实体，200 万事实。Cyc 中不仅包含了大量实体和关系，还包含用于推理的常识规


