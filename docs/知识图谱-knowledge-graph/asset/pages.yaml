  md: '析会议（Text Analysis Conference, TAC）[资源 7-1] 的一个主流评测任务，主要研究从自然语言文本中抽取信息，并且链接到现有知识库的相关技术。对事件的研究是
    KBP 中的一个重要任务，KBP 中事件相关的任务是从 2014 年开始举办的，至今经历了 2014、2015、2016、2017 四届[343]。


    KBP 2014 的事件抽取任务，要求对指定事件中的事件元素（event argument）进行识别，同时要求识别出它们的事件角色（argument role）。本次任务中的事件类型和实体角色遵从
    ACE 2005 中的定义，每类子事件类型都定义了各自的事件元素。同 ACE 一样，KBP 2014 提供了 599 个标注文档，主要由新闻报道以及数据等构成，由人工过滤来确保每一种事件类型都有多个实例，并且针对长句子进行了截断。整个任务采用
    F₁ 值（F₁ value）作为评测指标。KBP 2014 的事件抽取任务仅仅提供了英语语料。


    2015 年的 KBP 事件抽取任务极大地丰富了 2014 年的事件抽取任务内容，并扩充为如下 5 个子任务，但是也是仅针对英文的评测任务。


    ① 事件识别（event nugget detection）。此任务目标在于识别文本中的事件指称（event mention），特别是触发词是多个词的情况（如：take
    away，go over 等），参与评测的系统需要准确识别出每个句子中的全部相关事件指称。其中关于事件指称的定义和标注遵从 ACE 标注标准。除此之外，此任务还要求识别出
    Actual、Generic、Other 这三种和事件相关的属性值。


    ② 事件识别和消歧（event nugget detection and coreference）。此任务不仅需要识别出事件指称，同时需要对事件进行共指消解。此任务并不需要考虑子事件的关联。


    ③ 事件消歧（event nugget coreference）。此任务需要识别出全部的事件共指，与事件识别和消歧任务不同，这个子任务提供已经标注好的事件指称，仅仅需要识别事件共指关系。


    ④ 事件元素抽取和链接（event argument extraction and linking）。此任务的目标是抽取事件元素及其扮演的角色，并将其链接到指定的事件或者实体上。


    ⑤ 事件元素的验证和链接（event argument verification and linking）。此任务主要对事件元素抽取和链接任务中生成的链接进行校验。


    2016 年的 KBP 事件抽取任务在 2015 年的事件抽取任务基础上增添了以文档为单位的识别。除此之外，每个任务都有英语、中文、西班牙语三种语言的评测。这次评测提供
    200 个标注的英文文档、200 000 个词的中文文档以及 120 000 个词的西班牙文文档。但是 KBP 2016 并未提供任务相关的训练数据。


