    等[340] 研究电子邮件数据中的实体消歧问题：首先基于邮件数据建立实体的社会化网络，然后利用随机步算法计算实体之间的相似度；Hassell 等[200]
    利用 DBLP 中人物的关系，通过给不同类别的关系设定不同的权重将研究领域内的人名与 DBLP 中的人物联系起来。Bekkerman 等[46] 基于具有社会关联关系的人物之间的网页链接结构进行人物消歧；Kalashnikov
