  md: '论文奖，认为该工作能够经受时代的检验。


    AgreementMaker^{[114]} 是一个集成系统，包括了很多自动对齐方法，是一个可扩展的对齐框架。该系统能够处理大规模的多领域知识库，例如地理领域和医药领域的知识库。该系统也能够处理各种表达格式的知识库，如
    XML^{[72]}、RDFs、OWL^{[45]} 和 N3，并且可以生成一对一、一对多、多对一和多对多的对齐。总体来说，对齐系统可以分为两个模块：即相似度计算模块和对齐选择模块，结合了三个层面的对齐方法：①
    第一层比较概念特征，例如标签、评论和实例等被表示为 TF-IDF 向量，用余弦相似度来衡量相似度，同时也利用了其他的相似度度量，例如编辑距离、最长公共字符串等；②
    第二层利用了知识库结构特征，包括了两个方面，分别是子孙节点相似度的继承以及兄弟节点相似度的贡献；③ 第三层是对前两层结果的线性加权求和，而且结果根据需求被进一步剪枝。


    Falcon^{[220]} 是一个采用分治法设计的对齐系统，它可以处理 RDFs 和 OWL 格式的大规模知识库。该方法分为三个阶段：① 分割知识库：首先利用基于结构的分割方法将每个知识库中的资源分成数个小集合，基于资源之间的相似程度进行分割；②
    块匹配：根据这些小集合构建块，不同的块是根据预先对齐的资源（使用字符串匹配技术获得）来进行对齐的，资源对齐越多，两个块就越相似，然后根据块相似度阈值来选择对齐的块；③
    挖掘对齐：利用 V-Doc^{[390]} 和 GMO^{[219]} 匹配器，对匹配的块中的资源做进一步的精细对齐，最终的对齐是根据贪婪算法获得的。


    RiMOM^{[275]} 是一个动态多策略的对齐框架，该框架通过最小化风险贝叶斯决策进行对齐，使用了两种基本的相似度度量：① 语言学相似度：如标签之间的编辑距离、向量距离等；②
    结构相似度：采用三种相似度传播策略，即概念到概念、关系到关系以及概念到关系。然后，策略选择模块使用知识库预处理得到的标签和结构相似度因子来决定偏重哪种相似度来进行对齐。具体地，策略选择模块动态地调节以下几个因素：语言学匹配的具体特征、各个相似度的组合权重以及具体的相似度传播策略。在相似度传播之后，系统会进行对齐精细调整来获取最终的对齐结果。


    ASMOV^{[226]} 是面向生物信息学知识库的自动对齐系统，该系统的输入是两个 OWL 格式表示的知识库和可选的已有对齐，最终返回多对多的资源对齐。总的来说，该系统可以分为两个步骤：①
    相似度计算：使用词汇和结构信息迭代地计算两个知识库的相似度，然后将这两种相似度做加权求和，在这个过程中，也使用了诸如 WordNet^{[336]} 和 UMLS^{[60]}
    等外部知识资源；② 语义验证：这个过程是检验语义一致性的过程，一致性检查采用基于模板的方法，系统并不'
  merge: -1
  img_proc: true
- pgno: 98
  md: '做整体检查，而是去识别那些可以导致不一致的对齐集合。语义验证过程一共检查五种一致性模板。


    Anchor-Flood$^{[416]}$ 能够高效率地解决大规模知识库的对齐问题，系统的输入是 RDFs 和 OWL 格式的知识库，输出为一对一的对齐。系统首先将两个知识库中一对相似的概念叫做一个锚（Anchor）。例如，所有能够精确匹配的标准概念都被视为锚。然后，系统分析锚的周边资源，例如，上层概念和下层概念以及兄弟节点，这样就可以构建一些知识库的片段进行对齐。这些片段的大小是动态改变的。由于系统是针对片段和片段的比较，所以没有对整个知识库进行考虑，否则性能可能有一些提升。最终，系统在连接的片段中输出对齐的资源，在这一步中，系统利用了术语和结构相似度度量，然后进一步将二者融合。最后，已经对齐的资源被当作新的锚，继续新一轮发现对齐的过程。这种机制不断重复，直到没有新的对齐产生。


    PARIS$^{[447]}$ 是一种新型的基于概率的全局知识库对齐算法，这种方法不需要任何参数调节，可以高效进行知识库之间资源的对齐。PARIS 是第一个基于全局概率的大规模对齐方法，可以在没有先验知识和参数调节的情况下完成对齐过程。


    SiGMa$^{[258]}$ 是大规模知识库实体对齐的算法，该方法设计初衷是为了对齐两个大规模的知识库：电影领域的 IMDb 和基于 Wikipedia
    的 YAGO。SiGMa 不仅能够充分利用组合结构信息，而且使用简单的实现方法以解决大规模对齐问题。SiGMa 共分为两个步骤：① 获取高质量的初始对齐；②
    使用结构信息和实体的属性信息来定义打分函数，实现对齐。算法可以视为对于一个全局目标函数的贪婪优化。目标函数考虑了两方面的信息：基于属性定义的两个实体间的相似度，以及实体的周围节点信息。该方法有以下几个特点：首先，使用已有的对齐来获取结构信息，所以可以合理地利用已有的信息；其次，利用知识库的结构信息来产生新的候选对齐；最后，使用简单的贪婪策略，使得该方法可以适用于大规模知识库对齐。


    # 3.3 小结


    本章主要介绍了知识体系构建和知识融合两个任务，主要内容包括：


    +   - 知识体系赋予知识图谱明确的语义信息。一般来说，知识体系主要包括三个方面的内容：对概念的分类、概念属性的描述以及概念之间关系的定义。本'
