    # 5.2 基于聚类的实体消歧方法


    在目标实体没有给定的情况下，目前绝大多数系统都采用聚类方法进行命名实体消歧。给定待消歧的实体指称项集合 O = o1, o2, …, ok，以聚类方式实现消歧的系统按如下步骤进行消歧。


    +   （1）对每一个实体指称项 o，抽取其特征（如上下文中的词、实体、概念），并将其表示成特征向量 o = w1, w2, …, wn。

    +   （2）计算实体指称项之间的相似度。

    +   （3）采用某种聚类算法对实体指称项聚类，使得聚类结果中每一个类别都对应到一个目标实体上。


    以聚类方式实现实体消歧的关键问题是计算指称项之间的相似度。按照实体指称项相似度计算方法的不同，基于聚类的实体消歧系统可以分为如下三类：① 基于表层特征的实体指称项相似度计算；②
    基于扩展特征的实体指称项相似度计算；③ 基于社会化网络的实体指称项相似度计算。


    # 5.2.1 基于表层特征的实体指称项相似度计算


    传统方法中大多数实体消歧系统都只利用指称项的表层特征来计算相似度。这些方法通常是词袋子（Bag of Words，BoW）模型的自然延伸，难以取得良好的实体消歧性能。给定一个实体指称项，基于词袋子模型的实体消歧系统首先将其表示为
    Term 向量的形式，其中每个 Term 的权重通常采用经典'
