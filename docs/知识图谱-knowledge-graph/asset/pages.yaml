- pgno: 228
  md: '这一类基于自定义能量函数的方法，相比于张量分解的方法，有更灵活的目标，可以根据推理任务的不同变换能量函数，因此它的能量函数更接近任务本身的目标，令其往往能获得优于张量分解的效果。更准确地说，这一类方法更像是矩阵分解方法的延续，有很多应用也都是使用矩阵分解的结果作为这种方法的初始化。


    基于数值计算的推理是目前学术界研究热点，每年都会不断涌现新的模型和方法。感兴趣的读者可以使用“Knowledge Graph Embedding”“Knowledge
    Embedding”等关键词搜索最新文献。


    # 9.5 符号演算和数值计算的融合推理


    在通过表示学习的方法获得知识图谱的分布式表示后，便可以通过数值计算的方法在知识图谱上进行推理了。这种方法有两个明显的优势：① 基于数值计算的推理速度非常快而且与知识图谱的规模无关（知识图谱的规模只影响其学习效率），往往比逻辑推理或概率推理方法的速度快出几个数量级。②
    可以缓解由于数据稀疏带来的“冷启动”问题，由于知识图谱中存在大量长尾实体[482]，对它们相关的知识进行推理时往往会因为不能搜集到足够的证据而使推理失败，表示学习方法通过反复的迭代可以令这些长尾实体获得一些隐式的语义，在一定程度上缓解数据稀疏的问题。但表示学习的方法也有弱点，主要体现在推理的精度相对较低。基于表示学习的推理可以把答案排到靠前的位置，但很难排到第一的位置，这主要是因为表示学习不能利用知识图谱中显式的长距离依赖（如逻辑规则），而这种信息往往对推理很有效。


    为利用表示学习的优势，并克服它的弱点，已有一些研究工作提出融合表示学习和逻辑推理方法。这类工作包括：Rocktäschel[406] 提出用实体和关系的表示计算元组的概率，并基于
    t-norm 理论计算出一条逻辑规则成立的概率；Wang[474] 则利用整数线性规划整合了知识的分布式表示与手写的规则，但规则的普适性却存在着一定的问题；Neelakantan[354]
    提出用循环神经网络（recurrent neural networks, RNN）在关系路径的分布式向量上进行循环表示，具有类似思路的还有 PTransE[290]，并且
    PTransE 还在遍历关系路径时，加入了类似 PRA 的启发式规则；Gu[188] 等人则在对关系路径表示后更进了一步，他们利用逻辑规则的分布式表示去预测两个实体之间是否存在类似的规则。


    以下以 PTransE 和 Gu 的方法为例介绍如何利用知识图谱中元素的分布'
