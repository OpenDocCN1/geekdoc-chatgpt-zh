- pgno: 80
  md: '# 1. 确定领域及任务


    知识图谱作为人工智能应用的基础设施，其构建过程不能不了解具体的应用任务，也不能抛开领域建立一个高大全的、无法被广泛使用的产品，Cyc 的教训我们需要吸取[270]。实际上，知识体系与具体的领域密切相关，例如金融领域和医学领域涉及的概念完全不同。因此在创建知识体系之前，首先应该确定知识图谱面向的领域。确定了领域也只是限定了知识体系应该包含的知识范围，在领域内还是可以构建出各种各样的知识体系。想要构建更为适合的体系，还需要回答如下问题：我们为什么要使用这个知识体系？这种知识体系能够帮助回答哪些类型的问题？谁会使用并维护这个知识体系？这些问题应该贯穿于知识体系构建的每个阶段，并且随着体系构建的推进，我们可能会对上述问题有更加深入的认知，原来的答案可能会被推翻，此时需要重新思考这些问题，并根据新的想法修正已经构建的知识体系。


    # 2. 体系复用


    知识体系具有很强的抽象性和概括性，从零开始构建不仅成本高昂，而且质量难以保证。实际上可以先构建一个轻量级的知识体系，然后尽可能基于它们进行扩展[488]。因此，真正进行构建之前，应该广泛调研现有的第三方知识体系（如
    Schema.org[资源 3-1]）或与之相关的资源，尽可能多地参考前人的已有成果[136]。这些资源主要包括以下几种。


    ![](img/9549a57f481f525254296dec39e94079_80_0.png)


    ![](img/9549a57f481f525254296dec39e94079_80_1.png)


    ![](img/9549a57f481f525254296dec39e94079_80_2.png)


    +   - 领域词典：一些领域的专家会编撰领域内的词典，这些词典在构建限定领域的知识体系时具有重要的参考价值。例如，医学领域的 CancerOntology[资源
    3-2]、文化领域的艺术与建筑词典 AAT[资源 3-3]、地理学领域的地理名称词典 TGN[资源 3-4]。

    +   - 语言学资源：在自然语言处理领域，有很多语言学资源可以用于帮助知识体系的构建。例如 WordNet 包含了 11 万个概念的定义，并定义了概念之间的上下位关系；FrameNet[资源
    3-5] 则定义了 1000 多个框架、10000 多个词法单元，并定义了框架之间的关系。

    +   - 开源知识图谱：现有的大规模开源知识图谱主要有 DBpedia、YAGO、Freebase、OpenCyc 等。这些知识图谱的知识体系都是由专家人工制定的，具有较高的质量，并且涵盖的领域非常广泛，对于制定新的知识体系具有很高的参考价值。表
    3.1 展示了上述知识图谱的数据规模。'
