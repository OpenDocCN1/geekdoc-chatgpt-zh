    化文本的形式存储，相比结构化和半结构化数据，非结构化文本数据要丰富很多。因此，如何从纯文本数据中进行知识获取受到工业界和学术界的广泛关注。这一任务被称为文本信息抽取。


    由于目前的知识表示大多以实体关系三元组（见第二章）为主，因此，信息抽取包括如下基本任务：实体识别、实体消歧、关系抽取以及事件抽取等。这一过程需要自然语言处理技术的支撑，由于自然语言表达方式变化多样，给信息抽取带来巨大挑战。目前主流的方法是基于统计机器学习的方法，下面对于所涉及的各个任务进行简单的介绍，详细介绍以及主流方法可参阅对应章节。


    （1）实体识别：实体识别任务的目标是从文本中识别实体信息。例如，对于“姚明 1981 年出生于上海”，我们需要从中识别出“姚明”“1981 年”“上海”三个实体。在这一过程中，不仅需要确定实体的前后边界，还需要确定实体的类别，例如“姚明”是一个人名、“1981
    年”是一个时间词、“上海”是一个地名。早期有关实体识别的研究主要是针对命名实体的识别。命名实体（Named Entity）指的是文本中具有特定意义的实体，一般包含三大类（实体类、时间类和数字类）、七小类（人名、地名、机构名、时间、日期、货币和百分比）。但'
