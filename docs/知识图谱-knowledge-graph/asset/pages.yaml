  md: '+   (4) 被动式动词 < 直接宾语 >，例如：被杀死的 < 受害者 >。

    +   (5) 主动式动词 < 直接宾语 >，例如：摧毁 < 目标 >。

    +   (6) 被动式动词 + 介词 + < 名词 >，例如：被用 < 工具 > 杀死了。


    如上面的例子所示，该类方法中除了要定义模式外，还要定义该模式允许的词汇词典，例如在模式 “< 主语 > 被动式动词” 中，在其所利用的 MUC-4 语料中，动词词典可能是谋杀和爆炸等。在人工标注的语料上进行模式提取实验，大大缩短了基于
    CIRCUS [268] 的领域词典的构建时间。


    Kim 和 Moldovan [242] 提出了用语义框架和短语模式结构来表示某个特定领域的模式，开发了基于这一模式的 PALKA（parallel automatic
    linguistic knowledge acquisition）模式抽取系统。为了增加普适性，这套系统融入了 WordNet 的语义信息。最终利用 MUC
    测评数据中和恐怖主义有关的标注语料进行训练以抽取该领域的事件表达模式，并取得良好的性能。


    # 7.2.1.2 弱监督的事件模式匹配


    这类方法不需要对语料进行完全标注，而只需要人工对语料进行一定的预分类或者制定少量种子模式，由机器根据预分类语料或者种子模式自动学习事件模式。这类方法一般有两个步骤：①
    语料的人工预分类或者种子模式的制定。② 模式的学习，主要是利用机器根据预分类语料或者种子模式自动地学习模式。针对人工标注语料耗时、费力、成本高昂和语料标注格式不统一等问题，Ellen
    等提出 AutoSlog-TS 系统 [402]。AutoSlog-TS 系统是典型的基于弱监督的模式匹配方法，它不需要对训练语料进行详细地标注，只需要在人工预分类的训练语料上进行训练。相较于
    AutoSlog 系统需要对每句话以及句子中的相应实体进行标注，AutoSlog-TS 只需要标注句子是否包含了对应的事件即可，然后根据预分类数据自动学习抽取事件的模式，进而完成事件抽取的任务。


    Yangarber 等 [242] 基于文本、模式和事件三者的相关性，设计了 ExDisco 系统。与之前的模式抽取系统相比，该系统只需要人工给出少量的模式种子，不需要对语料进行人工标注，大大减少了工作量。Jiang
    等 [233] 提出了一个事件模式抽取系统 GenPAM，GenPAM 主要利用了事件的语义模式、触发模式和抽取模式。最终在飞行事故文本上进行测试，结果显示该系统取得了较好的性能。欧洲委员会联合研究中心（Joint
    Research Centre of the european commission, JRC）的 Jakub Piskorski 和 Hristo Tanev
    等 [380, 460] 提出了事件抽取系统 NEXUS，用于抽取新闻报道中的灾难和暴力事件。该系统首先将新闻报道进行聚类，然后利用句法分析等自然语言处理工具对聚类文档中的事件进行匹配，再利用弱监督学习方法进一步扩展语料，完成事件抽取。'
