    Freebase 和 DBpedia 都是以 Wikipedia 的 Infobox 数据为基础构建而成的。其中，Freebase 更偏向于知识工程的技术路线，而
    DBpedia 更偏向于语义网的技术路线①。另外，真实的应用需求也是知识图谱发展的另一主要推动力（对应图 1.3 右半部分）。知识图谱这一领域的蓬勃发展是在
    Google 于 2012 年正式提出知识图谱（Knowledge Graph）这一概念之后。Google 试图通过知识图谱，对于网页中的文本内容，特别是客观类事实性文本内容中的语义信息进行刻画，从这些非结构化的文本内容中提取出实体以及实体关系，将其事实性的文本内容转化为相互连接的图谱结构，从而让计算机真正做到内容理解。知识图谱是语义网真正意义上的一款杀手级应用产品，极大地推动了语义网、自然语言处理、数据库等相关技术的发展，被看作是下一代人工智能技术的基础设施之一，受到工业界、学术界的极大关注。紧随
