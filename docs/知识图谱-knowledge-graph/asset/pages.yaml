  md: '（2）2017 年 1 月 20 日中午，特朗普在美国首都华盛顿就任美国第 45 任总统。


    （3）2015 年 11 月 24 日，俄罗斯一架苏 24 战机在土耳其与叙利亚边境被土耳其 F16 军机击落。


    上述三个句子描述了三个不同类型的事件。句子 1 描述了一个结婚事件，结婚的双方是成龙和林凤娇，结婚时间是 1982 年 12 月 1 日，结婚地点是洛杉矶。事件抽取的目的就是识别出句子
    1 描述了一个结婚类型的事件，并抽取出夫妻双方、地点和时间等描述结婚事件的元素。同样地，句子 2 和句子 3 分别描述了就职事件和攻击事件及其相关元素。为了方便对于本章的理解，我们先介绍以下几个事件抽取相关的概念。


    （1）事件指称（event mention）: 是指对一个客观发生的具体事件进行的自然语言形式的描述，通常是一个句子或者句群。同一个事件可以有很多不同的事件指称，可能分布在文档的不同位置，或分布在不同的文档中。


    （2）事件触发词（event trigger）: 是指一个事件指称中最能代表事件发生的词，是决定事件类别的重要特征。在 ACE 评测中事件触发词一般是动词或者名词。上述例句中的触发词分别为“结婚”“就任”和“击落”。


    （3）事件元素（event argument）: 是指事件中的参与者，是组成事件的核心部分，它与事件触发词构成了事件的整个框架。如句子 1 中的“成龙”“1982
    年 12 月 1 日”“林凤娇”和“洛杉矶”；句子 2 中的“2017 年 1 月 20 日中午”“特朗普”“美国首都华盛顿”和“美国第 45 任总统”；句子
    3 中的“2015 年 11 月 24 日”“俄罗斯一架苏 24 战机”、“土耳其与叙利亚边境”和“土耳其 F16 军机”都是事件元素。事件元素主要由实体、时间和属性值组成，这些短语可以作为表达完整语义的细粒度单位，因此可以较为恰当地表示事件参与者。但是并不是所有的实体、时间和属性值都是事件元素，要视具体上下文语义环境而定。


    （4）元素角色（argument role）: 是指事件元素与事件之间的语义关系，也就是事件元素在相应的事件中扮演什么角色。例如：句子 1 中“成龙”和“林凤娇”都是扮演的“夫妻”的角色；句子
    3 中“俄罗斯一架苏 24 战机”扮演的是“目标”的角色。某类事件的所有的角色共同构成这类事件的框架。


    （5）事件类别（event type）: 事件元素和触发词决定了事件的类别。根据 ACE 定义，句子 1 描述的事件类别和子类别分别为生命（life）和结婚（marry）；句子
    2 描述的事件类别和子类别分别为人事（personnel）和就任（start-position）；句子 3 描述的事件类别和子类别分别为冲突（conflict）和攻击（attack）。很多评测和任务都为事件制定了类别，每个类别下又定义了若干子类别，'
