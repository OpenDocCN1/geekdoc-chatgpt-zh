  md: '或属性，这被称为 XML 路径语言（XML path language，XPath），其作用是辅助 XML 解析器解析或者方便编程者处理。


    # 2.2.2.2 RDF


    XML 表示方法的优势在于其灵活性。一个系统中，系统设计者完全可以灵活地设计所需要的元素和属性的标签，通过分享各个标签的含义，系统使用者也可以管理和利用这些标签系统。这一特性使得
    XML 相比通用标签的 HTML 具有更强大的表达能力，但其通用性也受到了严重的限制。在一些情况下，例如系统的设计团队离职，或系统设计者没有提供足够详细的
    XML 解释文档，那么一些自定义、个性化标签的语义便难以知晓，这对系统的使用与更新都带来了一定的麻烦。在链接开放数据（linked open data，LOD[资源2-3]）项目出现后，开发于不同时期或属于不同组织的语义知识需要相互兼容，因此迫切需要统一且无歧义的语义定义方式，以促进语义网不同知识的相互链接。在此背景下，W3C
    又提出了资源描述框架 RDF。RDF 假定任何复杂的语义都可以通过若干个三元组的组合来表达，并定义这种三元组的形式为“对象-属性-值”或“主语-谓词-宾语”。其中，需要公开或通用的资源，都会绑定一个可识别的通用资源表示符（universal
    resource identifier，URI）。以下是 DBpedia 中使用 RDF 三元组表示的实例：


    ![](img/9549a57f481f525254296dec39e94079_65_0.png)


    ```

    <http://dbpedia.org/resource/Max_Planck> <http://xmlns.com/foaf/0.1/name> “Max
    Planck”@en.

    ```


    ```

    <http://dbpedia.org/resource/Max_Planck> <http://xmlns.com/foaf/0.1/surname> “Planck”@en.

    ```


    上面两个三元组都具有“对象-属性-值”的结构。其中，URI<http://dbpedia.org/resource/Max_Planck>直接定位到人物对象
    Max_Planck，URI<http://xmlns.com/foaf/0.1/name> 和 <http://xmlns.com/foaf/0.1/surname>
    则是属性（姓名和姓氏）在网络中公认共享的属性描述（如上述两个三元组描述了 Max_Planck “姓名”和“姓氏”的英文表示）。


    因此，可以用如下三元组表示“马克思·普朗克”的基本信息：


    +   - < 马克斯·普朗克， 国籍， 德国 >

    +   - < 马克斯·普朗克， 专业， 物理学家 >

    +   - < 物理学家， 父类， 科学家 >

    +   - < 科学家， 父类， 人 >

    +   - < 丹麦基尔， 位置， 德国 >'
