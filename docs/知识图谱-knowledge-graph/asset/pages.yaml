    基于 Bootstrapping 的方法还是需要人工标注少量数据，为了让数据完全自动生成，研究人员们提出了利用 Distant Supervison 的方法自动生成事件标注样本。该方法利用结构化的事件知识库直接在非结构化文本中回标训练样本，'
