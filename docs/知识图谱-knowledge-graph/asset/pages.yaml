- pgno: 161
  md: '等[325] 针对 200 篇国内外突发事件的中文新闻报道进行标注，构建了中文事件语料库（Chinese Event Corpus, CEC）[325]。Lin
    等[289] 提出了面向中文的 TIMEX2 标注系统，旨在自动标注事件的时间短语或者时间表达式。Yuan 等[515] 从 80 篇突发性事件语料中标注了地震、火灾、中毒和恐怖袭击
    4 类突发事件，每类事件都标注 20 篇文本。Ding 等[129] 从新浪网站 2008 年到 2009 年中的 6 个月的音乐类新闻中标注了 6000
    句音乐领域事件语料（如：举办演唱会、发行专辑）。Meng 等[326] 标注了 4000 句的金融领域的事件语料。


    总体上看，事件抽取的研究是在各个国际评测和公开语料的推动下展开的。不同的评测和语料关注不同领域、不同粒度的事件。但是由于事件结构的复杂性和自然语言表达的灵活性与多样性，导致事件框架的定义较难，目前还没有形成统一的事件框架体系。另外，目前的语料都是人工标注的，标注过程耗时、费力、成本高昂，导致事件类型较少、规模较小。而且，各个评测报告的结果显示，目前事件抽取的性能还比较低。为了满足面向海量数据的大规模事件知识图谱的构建需要，迫切需要更大规模的语料和相关评测。


    # 7.2 限定域事件抽取


    在事件抽取相关的国际评测和语料的推动下，事件抽取的研究得到了越来越多的关注，也取得了一系列的成果。这些研究按照确定事件类别方式的不同，可以分为限定域事件抽取和开放域事件抽取。限定域事件抽取是指，在进行抽取之前，预先定义好目标事件的类型及每种类型的具体结构（包含哪些具体的事件元素）。另外，除了事件类型和事件的结构，限定域事件抽取任务通常还会给出一定数量的标注数据。由于事件结构的复杂性，标注数据的规模普遍较小，但是可以保证每个预定义的事件类型都有若干标注样本与之对应。ACE
    的事件抽取评测是最受关注的限定域事件抽取任务，共定义了 8 大类事件，例如：business（商务事件）、conflict（冲突事件）、transaction（交易事件）等，这些事件又被细分为
    33 类子事件。


    限定域事件抽取是信息抽取和知识图谱构建的重要环节之一，受到了学术界的广泛关注，研究者针对该任务进行了大量的研究。根据抽取方法的不同，限定域事件抽取可以分为基于模式匹配的方法和基于机器学习的方法两大类。下面分别对这两类方法进行介绍。'
  merge: -1
