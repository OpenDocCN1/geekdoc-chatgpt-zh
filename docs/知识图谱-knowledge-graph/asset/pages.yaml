    另外，模板学习的另一个关键问题是不同的模板可能表示同一语义关系。因此，在抽取模板之后，需要对习得的模板进行聚类，将表示同一语义关系的模板聚在一起。Bollegala
    等人[62] 将实体对以及抽取的词法、句法模板表示成一个矩阵，如表 6.1 所示，其中 p_i 表示模板，⟨e_i, e''_i⟩ 表示实体对，矩阵的每一行表示实体对在模板空间上的分布，矩阵的每一列表示模板在实体对空间上的分布，分布的相似性用于识别表达同种语义关系的不同模式以及不同实体对之间存在的同种语义关系。Bollegala
    等人[62] 在模板矩阵的基础上，提出了序列联合聚类算法 (Sequential Co-clustering Algorithm)，对所抽取的模板和实体对进行联合聚类。在模板矩阵中，每一行都是实体对在不同词汇-语法模板中的分布，因此其行向量就是聚类的特征向量。每个聚类的类别看作一个类别的标签。另外，该算法能够识别特殊实体的不同字符串形式。例如
    Redmond software giant 和 Microsoft 均指向同一个实体，这样会使得实体对（Microsoft, Powerset）和（Redmond
