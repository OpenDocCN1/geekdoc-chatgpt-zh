    # 2. 半结构化数据


    半结构化数据是指那些不能够通过固定的模板直接获得的结构化数据。半结构化数据的样式结构相对于结构化数据较为松散，具有结构多变、模式不统一的特点。相关的结构化知识隐藏在一些隐式的列表或者表格中。如图
    1.10 所示，这是在百度百科上检索板蓝根的结果，是一个半结构化数据的例子，这里具有一定的层次和模式，但是其结构化的程度低于结构化数据。半结构化数据的优点是置信度高，规模比较大，个性化信息丰富而且形式多样；缺点是样式多变且含有噪声，很难通过人工编写模板的方式进行抽取。


    # 3. 非结构化文本数据


    非结构化文本数据指的就是纯文本，即自然语言文本数据。例如：“姚明 1981 年出生于上海”这句话中就隐含着两条结构化知识，即（姚明，出生地，上海）、（姚明，出生日期，1981
    年）。当前互联网上大多数的信息都以非结构'
