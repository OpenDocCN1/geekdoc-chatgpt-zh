  md: '受任何的专业训练。由于其广阔的应用前景，知识库问答在学术界和工业界都成为研究热点。例如，图 10.3 展示的是一个应用了知识问答技术的商业搜索引擎的基本形态。现在，在百度搜索中直接输入一个完整的自然语言问句（事实型问题），其返回的第一条搜索结果就是知识图谱中的答案。


    ![](img/9549a57f481f525254296dec39e94079_240_0.png)


    图 10.3 知识库问答商业应用实例


    知识图谱一般表示为相互关联的事实三元组集合，如图 10.4 右侧所示。针对用户使用自然语言提出的问题，问答系统通过与知识图谱进行交互，检索相关知识点（事实集），进而进行知识推理得出最终准确的答案。目前，面向知识图谱的问答系统按照技术方法可以分为以下两种类型：


    +   （1）语义解析类型：考虑到知识图谱可以使用其支持的查询语言检索信息（如 MQL、SPARQL 等），那么如果能够把自然语言问句自动地转换为结构化查询语句，就可以直接通过检索知识图谱得到精确答案。例如，我们可以把问句“屠呦呦是哪里人？”转换为对应知识图谱的查询语句
    “select ?o where {屠呦呦 出生地 ?o.}”，进行知识库检索能够得到答案“宁波市”。我们把这类模型称为基于语义解析的方法（图 10.4 中问答系统左侧模型）。


    +   （2）搜索排序类型：事实性问题一般都包含相关实体。通常来说，该问题的答案与相关实体在知识图谱中有比较紧密的联系，例如，它们之间可以通过一步或若干步关系路径关联。因此，首先可以通过搜索与相关实体有路径联系的实体作为候选答案，然后利用从问句和候选答案提取出来的特征进行比对，进而对候选答案进行排序得到最优答案。例如，利用问句中的实体“屠呦呦”在知识图谱中检索所有关系/路径，可以得到候选答案“宁波市”“中国”“诺贝尔医学奖”等候选实体，然后进行匹配和排序，选择最终答案。我们把这类模型称为基于搜索排序的方法（如图
    10.4 中问答系统右侧模型）。'
