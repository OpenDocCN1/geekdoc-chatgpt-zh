    # 3. 细粒度实体识别的难点


    相较于传统的实体识别，细粒度实体识别的难点如下：


    +   (1) 类别的制定：传统的实体识别类别比较少，细粒度实体识别的第一个难点就是类别的制定，如何能构建一个覆盖类别多而且具有层次结构的类别体系是类别制定时应当考虑的首要问题。\n(2)
    语料的标注：传统的实体识别大多数是基于有监督学习的方法，有监督学习需要大量高质量的人工标注语料，然而随着实体类别的增多，标注语料的难度和成本呈指数级增长。\n(3)
    实体识别的方法：相较于传统实体识别，细粒度实体识别中，更多的类别对实体识别方法也带来了极大的挑战。除此之外，因为标注语料很难获得，所以如何在无标注语料或者标注语料较少的情况下完成细粒度实体识别也是一个严峻的挑战。


    对于语料的标注，主要有两种方法，一种是人工标注，这种方法标注质量高，但是成本也高。另外一种比较便捷的方法就是利用回标的方法自动标注，这种方法标注速度快，可以自动获得标注数据，但是标注的数据中会有噪音。接下来详细介绍类别制定的方法和实体识别的方法。


    # 4. 细粒度实体类别的制定


    目前对于细粒度实体类别的制定，最直接的办法是人工制定，除此之外最具代表的工作是利用人工构建的词典知识资源作为类别的来源。例如现有的具有实体类别分类的知识资源有：WordNet[57]，Freebase
    等。


    Suchanek 等人结合了维基百科（Wikipedia）和 WordNet 两个资源，制定了 YAGO 的实体类别体系。他们将 Wikipedia 中的实体词条标签映射到
    WordNet 中，从而过滤掉 Wikipedia 中分类不恰当的标签，进而得到实体的完整类别。他们提出的方法准确率很高，在 95% 以上。Toral 等人提出了类似的方法，通过计算文本的相似度将
    Wikipedia 的类别映射到 WordNet 中，他们在映射过程中处理了多义词的消歧问题[34, 464]。Ling 等将 Freebase 中的类别进行过滤和合并，最终构建了一个包含
    112 个类别的体系[293]。


