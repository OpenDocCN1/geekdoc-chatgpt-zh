    # 10.2.2 基于语义解析的方法


    基于语义解析的问答方法是把问句转换为某种规范的形式化知识表示语句，其实质就是问句的语义解析（semantic parsing）。语义解析是指把一个自然语言句子映射为某种形式化的语义表示，语义表示形式会根据应用领域的不同而不同，典型的应用包括提供航空旅游信息服务接口的
    ATIS[384]、用于机器人足球赛的 CLang[83] 和美国地理知识问答系统中使用 的 GeoQuery[519] 等。


    具体来说，面向知识图谱的问句解析是指利用知识图谱中的资源项（实体、关系、类别等）表示自然语言问句的语义，并以逻辑公式等形式化语句进行语义表示的任务。例如，对于问句“有哪些城市靠近大上海？”，使用知识库中的符号（在知识库中，实体符号
    “Shanghai_City”、类别符号 “City”、关系符号 “next_to” 分别表示问句中“大上海”“城市”和“靠近”的含义）可以把它表示为如下的逻辑形式：λx.next_to(x,Shanghai_City)
    ∧ City(x)。实际上，这是一个挑战性非常大的任务。首先需要对问句中的词/短语与知识图谱中的资源项（词汇表）进行映射；然后对匹配到的资源项进行组合；最后还需要对匹配和组合过程中存在的歧义进行消解，选择最正确的组合结果。基本上，可以把语义解析的方法分为基于训练数据的有监督方法和基于规则（或先验知识）的无监督方法。'
