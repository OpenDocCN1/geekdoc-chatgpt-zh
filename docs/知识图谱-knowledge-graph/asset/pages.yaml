    # 2. 语义辞典构造


    为了自动学习自然语言文本到逻辑表达式之间的映射关系，大多数方法都需要如下这种“句子-逻辑表示式”对标注数据：


    句子： 哪些城市靠近大上海？


    逻辑表达式： λx.City(x) ∧ next_to(x, Shanghai_City)


    但是，从标注数据中只知道整个句子对应的整个逻辑表达式，而解析方法需要的是句子的片段（如词、短语等）和细粒度的逻辑表达式之间的匹配关系，例如，词语“靠近”对应
    λx.λy.next_to(x, Shanghai_City)，短语“哪些城市”对应 λx.City(x)。


    对于给定的句子“杭州靠近上海？”和逻辑表达式 next_to(Hangzhou_City, 上海_City)，我们希望得到如下辞典：


    +   - 杭州 := NP : Hangzhou_City

    +   - 上海 := NP : Shanghai_City

    +   - 靠近 := (S \ NP)/NP : λx.λy.next_to(x, y)'
