    +   - MJ1: Michael Jordan is an NBA player

    +   - MJ2: Michael Jordan wins NBA MVP


    其 Term 向量表示形式如表 5.1 所示。


    表 5.1 基于表层特征的实体指称项表示


    | 实体指称项 - 表层特征 | NBA | Player | MVP | Win | Is | a |

    |---|---|---|---|---|---|---|

    | MJ1 | 1.21 | 1.09 | 0 | 0 | 0.6 | 0.53 |

    | MJ2 | 1.60 | 0 | 1.81 | 1.46 | 0 | 0 |


    基于实体指称项的 Term 向量表示，实体消歧系统通常使用向量的 Cosine 相似度来计算实体指称项之间的相似度。例如表 5.1 的两个例子中 MJ1 和
    MJ2 的 Cosine 相似度为 0.38。


    目前已有许多实体消歧系统基于表层特征来计算实体指称项之间的相似度。Bagga 和 Baldwin [42] 使用上下文词语向量来表示每个实体指称项，如果两个指称项向量之间的
    Cosine 相似度高于某个阈值，则认为这两个指称项指称同一个实体。Pedersen 等 [375] 使用一些重要的 Bi-gram 表示一个实体的上下文特征；Chen
    和 Martin [84] 则尝试使用一些句法和语义特征；Fleischman 等 [159] 首先训练一个最大熵模型对两个指称项表示同一个实体的概率进行估计，然后把这个概率看作相似度并利用一个凝聚式合并聚类算法（Agglomerative
    Clustering Algorithm）对指称项进行聚类。以上这些方法都是基于指称项上下文中表层特征的关联来计算它们之间的相似度，没有考虑到上下文特征的内在关联，因此影响了聚类效果。


    # 5.2.2 基于扩展特征的实体指称项相似度计算


    为了克服基于表层特征指称项相似度的缺陷，一些研究工作开始使用知识资源来提升实体消歧的性能。其中，最直接的方法是使用知识资源来扩展实体指称项的特征表示。例如，除了传统的上下文词特征之外，Mann
    等 [312] 和 Chen 等 [366] 通过抽取人物的传记属性来扩展表示人物指称项，这些属性包括 birthday、birth year、occupation、birth
    place 等。这些抽取出来的属性信息通常有两个作用：① 作为实体指称项的扩展特征；② 由于这些属性信息提供了更准确的实体指称项信息，它们也能用来重构聚类结果，例如：如果两个聚类中的指称项使用同一个
    Email 地址，则不考虑其相似度，直接将聚类合并。扩展实体指称项特征的另外一个重要知识源是 Wikipedia。Cucerzan 等 [115] 基于 Wikipedia
