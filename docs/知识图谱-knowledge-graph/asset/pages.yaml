  md: '模的事件标注数据。


    Chen 等 2017^[84] 提出的方法虽然可以利用远距离监督方法自动生成大规模的句子级标注数据并进行句子级事件抽取，但是该方法无法自动生成篇章级标注数据并进行篇章级事件抽取。现实生活中有大量应用场景需要篇章级事件抽取。因为大多数情况下，一个事件会由篇章中的多个句子描述，一个事件的多个元素也会分布在多个句子中。以金融领域为例，金融事件可以帮助用户快速获取公司交易盈亏、人事变动、股权变动等信息，进而辅助用户做出正确的决策。


    ![](img/9549a57f481f525254296dec39e94079_170_0.png)


    公司通常通过公告的形式发布公司的重大事件，但公告内容一般都是一篇文章而不仅仅是一个独立的句子。因此，如何从篇章级的公告信息中抽取出重要的结构化金融事件信息具有重要价值和现实意义。Yang
    等 2018^[535] 在 Chen 等 2017^[534] 的工作基础上提出了基于自动标注数据的篇章级中文金融事件抽取系统 [资源 7-2]。针对人工标注语料耗时、费力、成本高昂的问题，该系统利用远距离监督方法，自动构建大量训练数据（包括句子级标注语料和篇章级标注语料）。针对篇章级的金融事件抽取问题，该系统首先利用神经标注模型联合抽取句子中的事件触发词和事件元素，然后利用卷积神经网络自动判断篇章中的事件描述主句，进而利用上下文来补齐篇章级事件信息。大量实验结果验证了该方法的有效性。


    限定域事件识别由于具有明确的目标事件类型和标注样本，因此基于模式匹配的方法和基于机器学习的方法是解决这一问题的主要手段。其中后者是目前主流的研究方法，该类方法将事件抽取建模为分类问题。早期的工作主要基于精心设计的传统符号特征进行事件抽取；随着近几年深度学习的快速发展，神经网络模型已经成为解决该问题的重要方法，全连接神经网络^[295]、卷积神经网络^[86,
    358] 和循环神经网络^[153, 359] 都已经被成功应用到事件抽取的任务中。除此之外，弱监督学习方法也被逐渐应用到事件抽取的任务中，旨在自动生成部分标注数据，缓解数据稀疏带来的性能影响。然而，限定领域事件远远不能满足大规模事件知识图谱的构建和其他大规模应用的需求。


