- pgno: 139
  md: '两个实体指称在这个句子中具有收购（ACQUISITION）的关系。然而，人工方法不可能针对多类关系穷举所有的模板，那么就需要采用自动的方法学习抽取模板。问题是：①
    如何学习用于抽取关系的模板？② 如何将学习到的模板进行聚类？


    针对上述问题，已有的方法多采用自提升（Bootstrapping）策略，对于实体和模板进行联合迭代式地交替抽取和学习。基本出发点：一种语义关系可以采用对偶的方式进行表示[62]，包括两种表示方式：外延性（Extensionally）表示和内涵性（Intensionally）表示。外延性表示指为表示某种语义关系，可以使用所有包含这种关系的实体对来表示。内涵性表示指为表示某种关系，可以使用所有能抽取出这种关系的模板来表示。用符号
    R 表示关系，E(R) 表示所有包含关系 R 的实体对，例如：要表示 ACQUISITION 这种关系，可以给出实体对（You Tube, Google）、（Powerset,
    Microsoft）和（Inktomi, YAHOO）等，这种表示方式就是外延性表示。同样，为表示两个实体间具有关系 R，可以使用所有能抽取出这种关系的模板
    P(R)，例如，X 和 Y 表示两个公司，可以使用 X is acquired by Y、X is purchased by Y 或者 X is bought
    by Y 等表示 ACQUISITION 这种关系，这种表示方式就是内涵性表示。E(R) 和 P(R) 都能表示关系 R。因此，我们可以利用实体对在文本中获取模板信息，再利用获取到的模板抽取更多的实体对。这是一个自提升的过程。


    其中关键步骤是抽取句子中的实体对之间表达关系的模板。模板可以是基于词汇的，也可以是基于句法或语义的。这一过程需要自然语言处理技术，包括句子边界探测、词性标注、名词词组块识别等。例如，我们可以首先使用句子边界探测工具[资源6-2]将给定的文本语料分割为句子，然后运行词性标注工具[资源6-3]获得单词的词性。为了探测句子中的实体，可以使用名词短语块识别工具[资源6-4]或命名实体识别工具提取合适的名词词组块和实体。然后在此基础上，分别抽取词汇级关系模板和句法级关系模板。下面是对一个句子进行处理和抽取的例子。


    [资源6-2]

    句子边界探测工具

    [资源6-3]

    词性标注工具

    [资源6-4]

    名词短语块识别工具


    句子：The crime took place in View Royal on Vancouver Island.


    词性标注：DT NN VBD NN IN NNP NNP IN NNP NNP .


    实体或词组块：The crime took place in [View Royal] on [Vancouver Island].


    变量替换：View Royal=X，Vancouver Island=Y


    字面形式：The crime took place in X on Y.


    词性序列：DT NN VBD NN IN X IN Y .'
