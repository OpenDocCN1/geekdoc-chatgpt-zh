- pgno: 58
  md: '< 院系 >{人工智能学院}, < 职称 >{讲师}}。类似地，对于一个灾难的实例，关联着一个特定时间发生在特定地点的事实，例如“5.12 汶川地震”。


    在原始的框架定义中，槽可以是任何形式的信息，包括原子值或值的集合；对于非原子的槽，还可以由多个侧面（facet）对槽的描述进行补充，如图 2.3 中灾难的框架，在伤亡、损失、救援的槽结构下都具有若干描述槽的某些方面属性的侧面定义。这样做的目的是更立体更准确地描述事物的属性与关系，但在一些基于框架的系统中，省略了侧面的定义而直接表示为平铺式的槽结构，如
    FrameNet^{[43]}。


    人类对事物的认识存在层级的特性，在日常生活中，人们也会有意或无意地对事物进行层级式的分类。最典型的例子是生物学家对物种建立起的完善而详细的层级信息，事物的层级式表示促进了人类对世界认识的不断深入与发展。框架的设计就引入了层级结构，并且根据类别之间的所属与细化，框架中的属性集合存在着继承的性质。例如，地震在真实世界中是灾难的一种，因此灾难框架的所有槽，在地震中都是存在的；而为了避免框架结构的重复定义，就有了框架之间的继承关系。但除了灾难的公共属性外，地震还有震级、震源深度等特有属性，这是需要在地震框架下单独定义的，因此我们可以得到地震框架的定义，如图
    2.4 所示。


    ![](img/9549a57f481f525254296dec39e94079_58_0.png)


    图 2.4 框架继承示例


    在实例化地震这种继承的框架时，除了填充地震框架本身的槽值，还要填充在灾难框架中的槽值，例如使用地震框架表示下面一段对汶川地震的报道，如图 2.5 所示，使用框架表示后的汶川地震实例不仅包括灾难框架下时间、地点、伤亡以及损失情况，还包括地震框架下的震级等信息。


    框架以强大的结构式表达能力和接近于人类思维过程的特性，被应用于多个领域专家系统的构建以及通用知识的表达，例如 FrameNet 就是基于框架表示的语义知识库。但框架表示法也有不可避免的缺陷，由于真实世界的多样性和复杂性，许多实际情况与框架原型存在较大的差异，在框架设计中难免引入错误或冲突。另外因为框架结构的复杂性，一方面，不同系统之间的框架很难对齐，另一方面，也给从非结构文本中抽取信息填充框架增加难度。'
