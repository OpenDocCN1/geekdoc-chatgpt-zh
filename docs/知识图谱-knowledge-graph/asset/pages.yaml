  md: '# 10.2.3.1 基于特征工程的方法


    一种直接的做法是对问句和候选答案定义特征，并使用特征工程的方法抽取它们，最后基于特征匹配的分类模型对问题-答案匹配程度进行建模。Yao Xuchen 等人于
    2014 年发表在 ACL 的文章 “Information Extraction over Structured Data: Question Answering
    with Freebase” 是这类方法的基础模型，下面对其进行简要介绍。主题词的提取、主题实体的链接与前面章节中的实体识别和链接没有区别，主要步骤包括从问句中提取特征，从候选答案中提取特征，并利用它们进行匹配程度的计算。


    # 1. 问句特征抽取


    为了更好地从问句中提取特征，首先对问句进行句法分析，得到其依存句法树（如图 10.11 左图所示）。问句的依存句法树中包含了丰富的特征信息，例如，通过 Dex（人，哪裡）可以知道答案应该是一个地点，并且是“人”的“哪裡”；更进一步地，通过
    Exp（是，屠呦呦）可以确定找到的“屠呦呦”对应实体的“哪裡人”信息。有了这些初步信息，我们可以进一步提取抽象特征，主要包括：① 问题词（question
    word, qword）：例如，谁、哪等，它是问句的一个明显特征；② 问句焦点词（question focus word, qfocus）：这个词暗示了答案的类型，例如：名字、时间、地点等，可以用非常简单的方法抽取焦点词，例如，直接将问题词
    qword 相关的那个名词抽取出来作为 qfocus；③ 主题词（question topic word, qtopic）：这个词能够帮助我们找到知识图谱中相关的知识点，需要注意的是，一个问题中可能存在多个主题词（可以随机选取一个作为主题实体）；④
    中心动词（question verb, qverb）：有时候，动词能够给我们提供很多和答案相关的信息，例如“参与”“战胜”，那么答案有可能是某场球赛或战争，可以通过词性标注来确定
    qverb。通过对问题提取问题词、焦点词、主题词和中心动词这四个问句特征，可以将该问题的依存句法树转化为问题特征图（question graph）（如图 10.11
    右图所示）。


    ![](img/9549a57f481f525254296dec39e94079_251_0.png)


