  md: '的自然度较差。


    MIT 在 1966 年设计开发了 ELIZA 对话系统。这个系统可以允许用户在一定的限制内进行对话，人与与其对话时不会察觉是在与机器交流。下面是典型的对话例子。


    ELIZA: Hello, I am Eliza.

    User: can you speak chinese?

    ELIZA: Perhaps you would like to be able to speak chinese?

    User: who is your mother?

    ELIZA: Are such questions on your mind often?

    User: can you see pictures

    ELIZA: Don’t you believe that I can see pictures?

    User: what’s the weather of Beijing

    ELIZA: I’m not sure I understand you fully.

    User: What year is this

    ELIZA: What is it that you really want to know?

    User: Which year you are developed

    ELIZA: Perhaps you would like to be developed?


    从上面的例子可以看出，ELIZA 只是使用模式匹配的方法，根据用户的输入，匹配出关键的部分（如例子中的蓝字部分），转换成符合语法的输出，达到与用户对话的目的。这是模式匹配方法在对话系统中的成功应用，但是整个对话过程比较生硬，不够自然，不是一个很好的对话系统。


    实际上，后来还有人延续这种方法设计通用对话系统，例如美国理查德华莱士博士设计了 Alice 聊天系统 [资源10-16]，它是第一个宣称通过图灵测试的系统，并且，该系统在
    2000 年和 2001 年连续两年获得洛伯纳奖①。国内也有不少这类聊天系统，例如小黄鸡 [资源10-17]。但是，包括 ELIZA 和 Alice 等在内的对话系统没有涉及任何的知识，因此，可以认为上述方法只是采取了技巧（trick）“引导”模型通过图灵测试，没有太多实用价值。


    ![](img/9549a57f481f525254296dec39e94079_266_0.png)'
