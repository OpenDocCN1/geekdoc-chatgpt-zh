    Alchemy^{[248]} 和 Tuffy^{[367]}，其中 Tuffy 运用数据库及存储过程等技术，是一个工业级的推理系统。


    对于参数学习，学习 MLN 参数的目的是为逻辑规则赋值合适的权重，权重越大，意味着满足该规则的世界越有可能发生。Domingos 等人基于投票感知器算法首次提出判别参数学习方法^{[429]}，之后又提出单权重学习并利用对角牛顿和标度共轭梯度的方法提高学习速率^{[302]}。


    在获得带有权重的规则集合后，对于使用规则进行推理的过程，一般会归约到概率图模型的推理问题上，再通过最大后验概率或基于可满足性的方法进行推理。Singla 和
    Domingos 在最大后验推理中成功地引入了加权可满足性求解器^{[429]}，但是由于实例化所有可能规则所消耗的内存空间呈指数级增长，极大地限制了该方法可适用的领域规模，因此他们又利用了关系类型之间关联较少的特性^{[430]}，从而大幅度降低内存开销。Poon
    和 Domingos 结合可满足性以及马尔可夫链蒙特卡洛思想提出 MC-SAT 推理方法^{[381]}，并在此基础上提出可降低内存开销的更为通用的推理框架^{[382]}。除此之外，还有基于提升网格的置信传播^{[431]}
    以及结构约简^{[425]} 等方法。


    除了马尔可夫逻辑网外，还有一些概率推理的模型，例如概率软逻辑（Probabilistic Soft Logic, PSL）^{[243]} 和随机逻辑编程（Stochastic
    Logic Programs, SLP）^{[348]}。概率软逻辑模型利用 t-norm 理论对知识图谱中事实的不确定性建模，这种实例级事实的不确定性是由知识来源以及知识获取方法中的错误导致的，如
    YAGO 中含有 5% 左右的错误知识^{[308]}。随机逻辑编程则是从归纳逻辑编程中发展出来的概率版本，ProPPR^{[477]} 等对其进行了扩展。


    # 3. 关联规则挖掘


    相比于概率图模型以及概率逻辑推理模型，基于关联规则挖掘的方法更像是在运行概率逻辑推理之前从数据中获取规则的一个步骤，这一类方法甚至并没有严格的逻辑定义，它们将逻辑规则作为具有结构的特征，利用数理统计的方式评估特征的支持度、置信度或其他预定义的统计量，再将统计数据作为特征值加入到最终的统计模型中进行推理。这一类方法的典型算法或系统有：路径排序算法（Path
    Ranking Algorithm, PRA）^{[262, 263]}、基于数据库连接查询模式的 WARMR 系统^{[127]}、基于归纳逻辑编程的 ALEPH
    系统、DL-Learner 系统^{[266]}、QuickFOIL^{[521]} 以及基于开放世界假设（Open-world assumption）的
    AMIE^{[168]}、AMIE+^{[167]} 系统等。路径排序算法是基于图上随机游走的启发式方法，它通过枚举或抽样图上两个节点（对应知识图谱中的两个实体）间的路径，递归地计算两点间的到达概率，对每一条路径进行打分，以此与权重一起加入到整体模'
