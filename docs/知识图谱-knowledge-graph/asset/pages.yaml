  md: '机器学习算法推广到新的领域中时，就可以省去大量专家在新领域上的分析和探索，加快应用的进程，使得系统更为智能。从人工智能的角度看，算法直接从原始的感知数据中自动分辨出有效的信息，是机器走向智能的重要一步。


    用特征、逻辑、框架等符号表示的知识便于人们理解，可解释性也更好，但是，大部分语义计算任务都是目标导向的，例如判断短语“中科院自动化所”是不是一个机构名，对于这类任务我们不需要知道计算的过程，只需要计算的结果。2006
    年 Hinton 提出的深度学习[208]，不仅可以避免人工特征的局限性，还能够从大规模无标注的数据中自动挖掘规律，得到有用的信息。近年来，以深度学习为代表的数值计算方法越来越受到人们的欢迎，其在图像、语音领域的多个任务上的效果显著优于传统方法，使得这类方法目前占据语义计算统治地位。


    # 2.4.2 文本的数值化表示


    本书关注的知识表示以文本处理和自然语言处理为核心，在自然语言处理领域，深度学习技术并没有产生类似图像和语音领域那样的突破。其中一个主要的原因是，在图像和语音领域；最基本的数据是信号数据，我们可以通过一些距离度量，判断信号是否相似。而文本是符号数据，两个词只要字面不同，就难以刻画它们之间的联系，即使是“麦克风”和“话筒”这样的同义词，从字面上也难以看出这两者意思相同（语义鸿沟现象）。正因为这样，在判断两幅图片是否相似时，只需通过观察图片本身就能给出回答；而判断两个词是否相似时，还需要更多的背景知识才能做出回答。我们希望计算机可以从大规模无标注的文本数据中自动学习得到文本表示，这种表示需要包含对应语言单元（词或文档）的语义信息，同时可以直接通过这种表示度量语言单元之间的语义相似度（如图
    2.10 所示）。


    词是知识表示的最基本的单元[16]（本节关注于面向数值计算的词表示，实体等更大语义单元的数值表示与词的表示类似），而传统用不同符号表示各个词的方式不包含任何语义信息。如何将语义融入到词表示中，Harris
    在 1954 年提出的分布假设（Distributional Hypothesis）为这一设想提供了理论基础：上下文相似的词，其语义也相似[199]。Firth
    在 1957 年对分布假设进行了进一步阐述和明确：词的语义由其上下文决定（a word is characterized by the company it
    keeps）[158]。20 世纪 90 年代初期，统计方法在自然语言处理中逐渐成为主流，分布假设也再次被人关注。Dagan 和 Schütze 等人总结完善了利用上下文分布表示词义的方法，并将这种表示用于词义消歧等任务[117,
    118, 414, 415]，这类方法在当'
