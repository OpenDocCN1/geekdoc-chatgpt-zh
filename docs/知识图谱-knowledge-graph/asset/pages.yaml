    # 10.1 自动问答概述


    自动问答技术可以追溯到计算机诞生初期的二十世纪五六十年代，其中，代表性的系统包括 Baseball[180] 和 Lunar[490]。Baseball 是最早的以“未来的人机交互将是以自然语言进行的交流方式”为目标构建的系统。Lunar
    系统是为了方便月球地质学家对美国阿波罗计划从月球带来的大量岩石和土壤数据进行查询、比较和分析而开发的问答系统。这些问答系统大多针对特定领域设计，一般处理的数据规模不大，并且只接受限定表达形式、限定领域的自然语言问题，不需要过多依赖自然语言处理技术，其性能与系统针对特定领域的定制程度有关。这类系统因为没有足够的知识资源而难以在实际环境中应用。


    随着互联网技术的发展，人们希望利用日益丰富的网络数据资源解决问答系统中的数据匮乏问题，特别是二十世纪九十年代中期在 TREC-QA[120] 评测任务推动下，检索式问答技术取得了显著的进展，这种系统的主要特点是：利用浅层自然语言处理技术分析问题，并利用信息检索等技术从大规模文本或网页库中抽取答案。但是，由于用户需求的多样性和自然语言的复杂性，这种浅层'
  merge: -1
  img_proc: true
- pgno: 237
  md: '语义分析技术难以准确理解用户查询意图进而提取出有用的信息①，因此，这类检索式问答技术也未能得到广泛应用。


    长期以来，问答技术发展的两大困难是缺乏高质量的知识资源和高效的自然语言分析技术。随着 Web 2.0 的兴起，包括 Wikipedia、Yelp [资源10-1]、大众点评
    [资源10-2] 等应用在内的众多基于用户（协同）生成内容（user generated content, UGC）的互联网服务产生了越来越多的高质量数据资源，以此为基础，大量的知识库以自动或半自动的方式构建了起来，如
    Freebase、YAGO、DBpedia 等。另外，随着近年来统计机器学习方法的兴起和发展，自然语言处理中的各个任务都取得了突飞猛进的发展，无论是基于语义分析的知识工程还是大规模开放域的问句理解都取得了长足的进步。可以说，科研人员正逐步攻克问答和对话系统中最核心的知识资源缺失问题和自然语言处理问题。


