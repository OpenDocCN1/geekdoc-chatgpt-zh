  md: '义网通过语义具化（Semantic Grounding），让每个概念（实体、类别、关系、事件等）都有一个唯一的标识符，这种唯一性使得知识共享在更大领域更大范围成为可能。


    # 2.3 知识图谱中的知识表示方法


    # 2.3.1 表示框架


    通常情况下，一个知识本体主要涵盖以下几个方面的内容：① 事物：客观世界中的实体或对象，例如“莫泊桑”“曼谷”“唐山大地震”；② 概念：具有相似本体特征的一类事物，也称类型，例如“作家”“城市”“地震”；③
    属性：事物或概念具有的特征和特性等，例如“国籍”“地理位置”“震级”；④ 关系：概念与实体之间的关联方式，例如“类–子类”关系、“类–实例”关系；⑤ 函数：事物或概念之间进行转化的形式表达，例如：国籍（莫泊桑）=
    “法国”中的“国籍（X）”则为函数；⑥ 约束：某项断言成立的限制条件的形式化描述，例如：属性“国籍”的值必须为“国家”类型的实体；⑦ 规则：依据某项断言得到逻辑推论的因果关系知识的形式化描述，通常具有“如果…那么…”的形式；⑧
    公理：永远为真的断言。实际上，目前大部分知识图谱主要是对前四部分内容（即事物、概念、属性和关系）进行建模，只有很少的知识图谱建模了简单的规则结构，这也反映了不同层次知识在表示上的复杂程度是不同的。


    知识图谱的概念最先出现于 Google 公司的知识图谱项目（knowledge graph），体现在使用 Google 搜索引擎时，出现在搜索结果右侧部分的相关知识展示，如图
    2.8 所示。但 Google 知识图谱本身，并不仅仅局限于这些知识。知识图谱用节点对应事物或概念，用边对应它们之间的关系。并且，知识图谱用统一的形式对知识定义和具体实例数据进行描述，各个具体实例数据只有在满足系统约定的“框架”约束下运用才能体现“知识”。知识图谱中的知识定义和实例数据及其相关的配套标准、技术、应用系统构成了广义的知识图谱。


    本节中描述的狭义知识图谱可以看成是知识库的图结构表示。除了 Google 知识图谱之外，Freebase、YAGO 等具有图结构的三元组知识库也是一种狭义的知识图谱。实际上，正如第一章概述描述的，知识用统一的三元组形式表示，不论是对人类操作的便捷性还是对计算机计算的高效性，都有非常大的优势。这一章描述的知识图谱局限在现存的具有图结构的三元组知识库上，泛指三元'
