  md: '参赛者可以自由使用三种语言的语料作为训练数据。2017 年的 KBP 事件抽取任务增加了文档级别的事件识别和事件时序识别任务。


    # （5）BioNLP 评测会议


    Ryan McDonald 等[319] 在 2005 年首次提出面向生物医学的事件抽取，目标是从生物医学文献中抽取出事件触发词、事件类型和事件元素等生物事件信息。目前，由东京大学组织的
    BioNLP 评测是面向生物医学事件抽取的最权威的会议，从 2009 年到 2013 年共举办三次：BioNLP 2009[239]、BioNLP 2011[240]
    和 BioNLP 2013[241]。BioNLP 包含了 3 个子任务，每个任务针对不同特异性级别的生物分子进行事件抽取。


    BioNLP 的举办极大地推动了生物医学事件抽取的发展，三届 BioNLP 的评测中出现了很多优秀的系统。提出的代表性方法与系统主要有两类：分阶段系统（图尔库大学提出的
    TEES 系统[56]、UTurku 系统[57]、EVEX 系统[189] 和 TEES-2.1 系统[58] 以及 Miwa 提出的 EventMine
    系统[344] 等）；联合系统（曼彻斯特大学提出的 UMass 系统[397] 和 FAUST[398] 系统等）。


    # （6）TimeBank 语料库


    TimeBank 语料[388] 最早是由面向问答系统的时间和事件的识别会议（Time and Event Recognition for Question
    Answering Systems, TERQAS）提供的。该会议由美国国家区域研究中心（National Regional Research Centre,
    NRRC）和美国高级研究发展学会（Advanced Research and Development Activity, ARDA）共同主办。TimeBank
    采用了 TIMEX3 格式的 XML 标签来标注时间，TIMEX3[387] 是 TIMEX2 的改进，可以精确地表达时间，增强了 XML 标签描述时间信息方面的能力。


    TimeBank 语料分别来源于 DUC、ACE 和 PropBank 中收集的新闻报道。TimeBank 中的事件通过事件类（event class）、事件时态（event
    tense）以及事件状态（event aspect）三个属性来描述。在 TimeBank 中，可标注为事件的词主要包括：时态动词（tensed verbs），静态形容词（stative
    adjectives）和事件名词（event nominal）。TimeBank 将事件划分为 Occurrence、Perception、Reporting、Aspectual、State、Intensional
    State、Intensional Action 和 Modal 等 8 种类型。TimeBank 主要识别和抽取事件的时间元素及事件之间的时序关系。TimeBank
    不关心时间之外的事件元素，其语料包含 300 篇新闻。TimeBank 语料推动了事件的时间元素和事件间时序关系的相关研究的发展。


