    # 2. 基于神经网络的方法


    基于特征工程的方法，在特征提取的过程中过分依赖词性标注器、句法分析器等传统的自然语言处理工具，会造成误差累积的问题，而且有很多语言没有自然语言处理工具。从
    2015 年开始，事件抽取研究主要集中在如何利用神经网络直接从文本中自动获取特征进而完成事件抽取。该类方法主要包括如下几个步骤：① 特征表示：主要是将纯文本表示为分布式特征信息，如将词表示为词向量。②
    神经网络的构建与高层特征学习：主要是设计搭建神经网络模型并基于基本特征自动捕获高层特征。③ 模型训练：利用标注数据，优化网络参数，训练网络模型。④ 模型分类：利用训练的模型对新样本进行分类，进而完成事件抽取。下面以
    Chen 等[86] 在 2015 年提出的动态多池化卷积神经模型为例进行介绍。与上述的基于特征工程的方法类似，该方法也将事件抽取当作一个二阶段的多分类问题，因为第二个阶段“元素抽取”较第一个阶段“触发词抽取”更复杂，因此，本小节以事件元素抽取（分类）阶段为例进行介绍。


    该方法主要由四个部分组成：① 词向量学习：这个模块主要是通过非监督学习的方式得到每个词的向量化表示；② 词汇级特征表示：这个模块主要是利用词向量来捕获词汇级语义；③
    句子级特征抽取：这个模块利用动态多池化卷积神经网络来学习句子内部的组合语义特征；④ 事件元素分类：这个模块主要是利用 Softmax 分类器为每个候选事件元素计算扮演不同角色的概率。其中，词向量学习模块、词汇级特征表示和句子级特征抽取模块中的句子级特征输入都属于上述四个步骤中的特征表示，句子级特征抽取模块属于高层特征自动捕'
