    # 2. TAC KBP 评测


    与 WePS 不同，TAC KBP 评测对实体链接（Entity Linking）任务进行评测。实体链接任务的目标是将文本中的实体指称项链接到目标实体知识库中的相应实体上，该任务假设目标知识库是不完备的，有些情况下目标知识库中可能没有待消歧的实体。在
    2009 年的 TAC KBP 评测中，知识库由 2008 年版本的 Wikipedia 中含有信息框（Infobox）的文章组建而成。知识库中的每一个实体节点对应
    Wikipedia 中的一篇文 章。在目标实体知识库中，每一个实体节点包含如下几方面信息。


    +   (1) 实体的名字。

    +   (2) 实体的类别：从 PER(人物)、GPE(地点)、ORG(机构) 和 UKN(未知类别) 等四个类别中选取。

    +   (3) 知识库 ID：给知识库中的每个实体提供一个独一无二的标识符。

    +   (4) 属性信息：提供一个实体属性信息的集合，主要从 Wikipedia 的 Infobox 中抽取。

    +   (5) 消歧文本：用于实体消歧的信息，是 Wikipedia 中该实体的描述文本。


    2009 年的测试数据由 3904 个查询组成。每一个查询包含一个命名实体指称项以及它所出现的文本。实体指称项指的就是需要系统链接到知识库中的实体。指称项所出现的文本内容来自于新闻文章，用来帮助实体链接系统在知识库中选择相对应的实体。


    2010 年与 2011 年的 KBP 评测采用与 2009 年相同的知识库，不同的地方在于查询不仅仅选用新闻语料，还包括了从互联网中获取的语料。在 2011
    年的评测中，首次提出了跨语言实体链接任务。跨语言实体链接指的是查询的语言与知识库所采用的语言不相同，需要将查询中的实体指称项链接到另外一种语言的知识库中。此后每年的任务都有所变化，在
    2017 年的 KBP 评测中，实体消歧任务和实体识别任务已经实行联合，目标是从不同语言（中文、英文和西班牙文）的文本中识别出实体，并将其链接到指定语言的知识库上，对于知识库中没有的实体需要进行聚类，将同一实体的不同指称项聚类到一起。


