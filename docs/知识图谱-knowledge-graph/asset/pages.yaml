    数据量十分巨大，且涉及的领域范围非常广泛，这就要求标记方法必须具备很强的扩展性。因此，如何自动地给 Web 上的网页内容添加合适的标签就成为关键问题之一，解决这一问题涉及的技术包括信息抽取、分类、关联等[10,
