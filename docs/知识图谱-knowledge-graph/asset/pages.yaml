    # 2.2.2 语义网知识描述体系


    本小节具体介绍使用语义网对知识进行表示的方法。目前，语义网知识表示体系主要包括如下三个层次：


    +   - XML：全称可扩展标记语言（eXtensible Markup Language）。作为最早的语义网表示语言，XML 是从网页标签式语言向语义表达语言的一次飞跃。XML
    以文档为单位进行表示，不能显式地定义标签的语义约束，它的扩展版本 XML Schema 定义了 XML 文档的结构，指出了 XML 文档元素的描述形式。\n-
    RDF：全称资源描述框架（Resource Description Framework）。RDF 可以看成 XML 的扩展或简化。相应地，RDF 资源的属性、类的描述，以及类别间一般到特殊的层次结构语义，一起由
    RDF Schema 进行定义。'
