- pgno: 56
  md: '（8）相近关系：指不同事物在形状、内容等方面相似或接近，例如“狮子和老虎在食物链的位置非常相近”。


    可以按照论元个数把关系分为一元关系、二元关系和多元关系。一元关系可以用一元谓词 P(x) 表示，P 可以表示实体/概念的性质、属性等，例如，“鸟有翅膀”，“鱼能游泳”可以分别表示为有翅膀（鸟）和能游泳（鱼）。二元关系可用二元谓词
    P(x, y) 表示。其中，x, y 为实体，P 为实体之间的关系，例如，“北京是中国首都”可以表示为首都（中国，北京）。一元关系和二元关系可以方便地用语义网络进行表示，但是，如何表示多元关系呢？例如，“2008年，奥运会北京举行”包含了举办地和举办时间两个二元关系。语义网络在表示多元关系时是把多元关系转化为多个二元关系的组合，然后利用合取把这种多元关系表示出来。例如，对于上述的事件信息，可以设计一个“奥运举办事件”节点，表示举办地和举办时间，如图
    2.2 所示。


    ![](img/9549a57f481f525254296dec39e94079_56_0.png)


    图 2.2 语义网络表示多元关系示例图


    语义网络与一阶谓词具有相同的表达能力，不同的是，它用最简单的一种统一形式描述所有知识，非常有利于计算机的存储和检索。语义网络的缺点是，它仅用节点及其关系描述知识，推理过程不像谓词逻辑表示方法那样明了，需要针对不同关系做不同处理，推理方法还不完善。


    建立于 1988 年的知网（HowNet）是一个典型的语义网络，它是一个以汉语和英语的词语代表的概念为描述对象，以揭示概念与概念之间以及概念属性之间的关系为基本内容的语言认知知识库/常识知识库。


    ![](img/9549a57f481f525254296dec39e94079_56_1.png)


