    +   - InfiniteGraph: InfiniteGraph 是一个基于 Java 语言开发的图数据库系统，它是一个分布式数据库系统。和 MySQL
    等传统关系数据库类似，InfiniteGraph 需要作为服务项目进行安装，应用程序只能通过访问数据库服务对数据库进行操作。InfiniteGraph 借鉴了面向对象的概念，将图中的每个节点及每条边都看作一个对象。具体来说，所有的节点都继承自基类
