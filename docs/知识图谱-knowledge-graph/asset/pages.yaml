    概率软逻辑模型（Probabilistic Soft Logic, PSL）是一种基于一阶逻辑谓词和马尔可夫逻辑网络的统计关系学习（Statistical
    Relational Learning）框架。PSL 使用加权的一阶谓词公式对无向概率图模型进行紧凑的表示。PSL 最大的优点是谓词可以在连续的 [0,1]
    区间内任意取值，而不像 MLNs 只能取 {0,1} 中的离散值。因此 PSL 可以方便地对具有连续值的特征（如相似度）进行建模。


    PSL 模型由一组带有权重的一阶逻辑谓词公式组成，其中每个公式编码了马尔可夫网络中一组共享同一权重的特征集合。上面已经提到，PSL 中的每个谓词实例 a 可以在
    [0,1] 的连续区间内进行取值，本章用 I(a) 表示谓词实例 a 的取值。PSL 使用松弛版本的合取（∧）、析取（∨）和取反（¬）操作进行逻辑推理，它们的计算规则如下：


    I(l₁ ∧ l₂) = max{0, I(l₁) + I(l₂) − 1.0}

    I(l₁ ∨ l₂) = min{I(l₁) + I(l₂), 1.0}

    I(¬l₁) = 1.0 − I(l₁)


