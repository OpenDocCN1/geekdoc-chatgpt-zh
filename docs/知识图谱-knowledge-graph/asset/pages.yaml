  md: '获取大规模训练样本后完成事件的抽取。


    # 1. 基于 Bootstrapping 的事件抽取


    在弱监督的事件抽取中，关键在于如何获得大规模的标注样本。基于 Bootstrapping 的方法利用少部分人工标注的数据自动生成大规模标注数据，进而完成事件抽取。图
    7.2 展示了基于 Bootstrapping 的事件抽取方法基本框架。


    ![](img/9549a57f481f525254296dec39e94079_168_0.png)


    图 7.2 基于 Bootstrapping 的事件抽取方法基本框架


    此类方法的核心思想是：首先利用小部分标注好的数据训练抽取模型，然后利用训练好的模型对未标注数据进行分类，从中选取高置信度的结果加入到训练数据中，再次训练分类器，上述过程反复迭代进而完成标注数据的自动扩充和事件的自动抽取。


    Chen 等[87] 在 2009 年提出利用一部分高质量的标注语料训练分类器，然后利用初步训练好的分类器判断未标注的数据，选取高置信度的分类样本作为训练样本，反复迭代，进而自动扩充训练样本。Liao
    等[287] 在 2010 年提出在相关文档中自训练（Self-Training）的半监督学习方法扩展标注语料，并提出利用全局推理的方法考虑样例的多样性进而完成事件抽取。Liao
    等[288] 在 2011 年提出同时针对词汇和句子两个粒度训练最大熵分类器，并用互训练（Co-training）的方法扩展标注数据，进而对分类器进行更充分的训练。为了解决训练样本过少的问题，Liu
    等[295] 在 2016 年提出利用 ACE 语料训练好的分类器去判定 FrameNet 中句子的事件类别，再利用全局推断将 FrameNet 中的语义框架和
    ACE 中的事件类别进行映射，进而利用 FrameNet 中人工标注的事件样例扩展训练数据，达到提升事件检测（event dection）性能的目的。目前基于弱监督的事件抽取方法还处于起步阶段，迫切需要能自动生成大规模的、高质量的标注数据的方法来提升事件抽取的性能。


