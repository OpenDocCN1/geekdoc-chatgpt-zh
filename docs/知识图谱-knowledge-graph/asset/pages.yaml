    # 9.3.1 归纳推理：学习推理规则


    在之前的章节中已经对归纳推理进行了介绍，也知道了归纳推理本身是人类头脑中思维的运行方式之一，但在这一章节中，我们主要关注使用归纳推理的思想，从现实的大规模网络知识图谱中自动地总结出逻辑规则，这一任务也被称为逻辑规则挖掘。目前要完成这一任务主要有三大类方法：频繁子图挖掘、归纳逻辑编程和结构学习方法，以下对这三类方法进行详细的介绍。


