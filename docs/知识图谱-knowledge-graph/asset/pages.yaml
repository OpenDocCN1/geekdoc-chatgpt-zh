  md: '# 7.2.1 基于模式匹配的事件抽取方法


    基于模式匹配的方法是指对某种类型事件的识别和抽取是在一些模式的指导下进行的，模式匹配的过程就是事件识别和抽取的过程。采用模式匹配的方法进行事件抽取的过程一般可以分为两个步骤：模式获取和模式匹配。图
    7.1 展示了基于模式匹配的事件抽取方法的基本流程。模式的加入是为了提高事件抽取的准确率。因此，模式准确性是影响整个方法性能的重要因素。按照模式构建过程中所需训练数据的来源，可以将基于模式的事件抽取方法分为两大类：有监督的事件模式匹配和弱监督的事件模式匹配。


    ![](img/9549a57f481f525254296dec39e94079_162_0.png)


    图 7.1 基于模式匹配的事件抽取方法的基本流程


    # 7.2.1.1 有监督的事件模式匹配


    在这类方法中，模式的获取完全基于人工标注的语料，这类方法需要人工预先对语料进行完全标注，模式的学习效果高度依赖于人工标注效果。该类方法一般包括如下步骤：①
    语料的人工标注，需要人工预先标注大量的语料。② 模式的学习，通过各种学习模型学习得到相应的抽取模式。③ 模式的匹配，利用学习得到的模式与待抽取文档进行匹配，进而完成事件的抽取。


    基于有监督模式匹配方法的代表性系统是 AutoSlog。Ellen [400] 等通过观察 MUC-4 测评会议的语料得出了“事件中角色之间的关系大部分可以通过从围绕某个短语的上下文内容中得到”的结论，并以此作为系统构建的出发点。为此他们基于“事件元素第一次被提及的地方就是该事件元素与事件之间关系确定的地方”和“事件元素周围的语句中包含了事件元素在事件中的角色描述”两个假设，在
    1993 年开发了事件模式抽取系统 AutoSlog。该系统定义了 13 个模式，例如：


    +   （1）< 主语 > 被动式动词，例如：< 受害者 > 被谋杀了。

    +   （2）< 主语 > 主动动词，例如：< 嫌犯 > 制造了爆炸。

    +   （3）< 主语 > 动词不定式，例如：< 嫌犯 > 试图杀死。'
