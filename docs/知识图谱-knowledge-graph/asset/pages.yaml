    # 1.6 小结


    本章首先讨论了知识图谱的定义，然后对其发展历史进行了梳理，从两条历史发展路线总结知识图谱的由来。接着，对知识图谱的发展脉络进行了梳理，知识图谱的发展经历了从人工标注到群体智能，到基于统计机器学习的自动构建的过程，也体现了从单一语言、单一领域到多语言、多领域的发展趋势。然后对知识的类型和知识图谱的类型进行了讨论，并对若干具有代表性的知识图谱进行了简要介绍。随后，对知识图谱的生命周期，也就是知识图谱在构建和应用中的几个重要环节进行了介绍。知识图谱本身是一种语义网络，但是相较传统的知识表示，现有的知识图谱以三元组为统一表示形式，不仅形式更加开放，更容易被人们接受，其存储、搜索和推理也更加高效。但是我们也应该注意到目前所定义的知识图谱只能表示事实性的知识，或者称之为以实体为核心的结构化知识。知识还有很多其他类型：情感知识、常识知识、场景知识等。这些知识的表示、构建与应用还在不断的探索和研究。本章最后分析了知识图谱与深度学习之间的关系，从中可以看出，以符号表示为基础的知识图谱和以数值计算为基础的深度学习在不同应用中各有优势，目前的趋势包括在深度学习方法中融合知识图谱和在知识图谱中应用深度学习技术。'
