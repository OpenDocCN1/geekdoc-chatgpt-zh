    有时候需要表示的参数超过两个，三元组不便直接表示这种情况，可以通过 RDF 定义的一组二元谓词（指该谓词有两个论元）来表示。下面通过具有三个论元的谓词：出生（X，Y，Z）为例来说明这种情况，出生（X，Y，Z）表示如下多元关系句子：马克思·普朗克
    1858 年出生在丹麦基尔。


