    \ XML、HTML 等格式的网页中的文本，可以采用面向非结构化数据的知识体系学习方法。另外，机器可读的知识词典也是一种特殊的半结构化数据。由于词典是一种专家通过人工方式构建并组织起来的领域知识资源，是一种非常好的知识体系学习资源。基于模板的方法是一种从词典中获取知识体系的有效方法。这种方法首先需要根据词典的特点设计一组词典语法模板，然后利用模板从词典中获取所需信息，例如词与词的上下位关系信息[187]。\n\
