    # 第五章 实体消歧


    # 5.1 任务概述


    上一章介绍了实体识别的任务和相关方法，但是实体具有歧义性，因此实体识别的结果很难直接存放到知识图谱中。一方面，同一实体在文本中会有不同的指称（如：飞人、帮主、老大和
    MJ 都是美国著名的篮球运动员迈克尔·乔丹的别名），这是指称的多样性（Name Variation）。另一方面，相同的实体指称在不同的上下文中可以指不同的实体（如：实体指称迈克尔·乔丹在不同的上下文中可以指不同的实体，如美国著名的篮球运动员、爱尔兰政治家等），这是指称的歧义性（Name
    Ambiguation）。因此必须对实体识别的结果进行消歧才能得到无歧义的实体信息。实体消歧是信息抽取和集成领域的一项关键技术，旨在解决文本信息中广泛存在的名字歧义问题，在知识图谱构建、信息检索和问答系统等领域具有广泛的应用价值。本章首先介绍实体消歧的任务及相关评测，然后以非结构化文本实体消歧技术为例介绍实体消歧中的两类方法：基于聚类的实体消歧和基于实体链接的消歧，最后介绍结构化文本中实体消歧的相关研究。


