    # 10.3.2.3 自然语言生成


    对话管理模块能够得到对话系统在输出时刻的系统状态，例如，某条列车车次信息。基于对话状态，自然语言生成模块需要得到具体的回复内容。自然语言生成技术包括两个部分：内容选择和内容描述，其中，内容选择是由对话管理模型决定，用户接收的描述内容则取决于自然语言生成模块。


    最简便直接的自然语言生成方法通过预先设定的模板，对系统状态（内容）进行一定的组织、选择和变换，将模板填充完整后输出[99]。该方法效率高，实现简单，但是生成的句子质量不高。模板难以维护或扩充，也难以创造新的语言表达。


    近年来，为了解决基于模板的自然语言生成模型难以维护和扩展的问题，研究人员提出端到端的自然语言生成模型，采用数据驱动的统计模型学习如何自动生成完整自然语言回复句子，其中自然问答就是其中一个典型代表[202,
    511]。


    传统知识问答都是针对用户（使用自然语言）提出的问句，提供精确的答案实体，例如：对于问句“泰戈尔的出生地在哪儿？”，返回“加尔各答”。但是，仅仅提供这种孤零零的答案实体并不是友好的交互方式，用户更希望接收到以自然语言句子表示的完整答案，如“印度诗人泰戈尔出生于加尔各答市”。自然答案可以广泛应用于智能客服等各种知识服务领域。知识问答中自然答案的生成具有非常明确的现实意义和巨大的应用背景。与返回答案实体相比，知识问答中返回自然答案有如下优势：'
