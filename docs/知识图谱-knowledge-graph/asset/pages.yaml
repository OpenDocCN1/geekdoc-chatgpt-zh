    # 4.1.3 基于机器学习的实体识别——基于特征的方法


    基于机器学习的方法主要是利用预先标注好的语料训练模型，使模型学习到某个字或词作为命名实体组成部分的概率，进而计算一个候选字段作为命名实体的概率值。若大于某一阈值，则识别为命名实体。与规则方法相比，基于机器学习的方法鲁棒性更好，而且模型的构建代价较小。基于机器学习的方法又可以分为基于特征的方法和基于神经网络的方法。基于特征的方法主要是利用传统的机器学习模型结合人工设计的大量特征进行实体识别，而基于神经网络的方法可以利用各种结构的神经网络自动捕获特征，进而完成实体识别。本小节主要介绍基于特征的方法，下一小节介绍基于神经网络的命名实体识别方法。


    目前，已经有多种机器学习模型被用于命名实体识别，包括语言模型[496, 497]、隐马尔可夫模型[54, 450, 525]、最大熵模型[69, 331]、错误驱动的学习方法[23]、决策树方法[417]、DL-CoTrain
    和 CoBoost[100, 102] 等。命名实体的内部构成和外部语言环境具有一定的特征[5, 11, 18]，例如：人名姓氏用字相对集中；地名前通常有“去”“在”等词语，并以“县”“街”“开发区”等词结尾；机构名通常以“部”“公司”等词结尾。实际上，基于特征的方法中，无论何种模型，都在试图充分发现和利用实体所在的上下文特征和实体的内部特征，包括词形、词性和角色级特征等。一般而言，基本步骤包括：


    特征选取：与一般的机器学习任务一样，在命名实体识别中，特征的选取有着重要的作用。例如：在英文的命名实体识别中，比较重要的特征有词性、大写、词缀信息等。


    模型学习：在这个步骤中，模型的选择非常重要，不同的机器学习模型有着不同的优缺点，要根据具体的任务和需求选择合适的模型。机器学习中的大部分模型都可以应用到命名实体识别的任务中。例如：支持向量机模型、最大熵模型、隐马尔可夫模型以及条件随机场模型等。除此之外，将多种机器学习模型联合使用也是一个不错的策略。


    样本预测：这个步骤主要是利用上一步训练好的模型，对输入样本进行标注预测，得到输入序列相对应的标注序列。'
