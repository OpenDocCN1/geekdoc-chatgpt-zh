    # 10.3.1 知识对话技术概述


    图 10.14 展示了对话系统的典型架构，虚线内是文本对话系统部分，它一般包含如下六个组成部分：① 语音识别：该模块主要负责接收用户的输入信息，把输入的语音数据转为计算机方便表示和处理的文字形式；②
    对话理解：该模块主要负责对用户的输入信息进行分析处理，获得对话的意图；③ 对话管理：该模块根据对话的意图做出合适的响应，控制整个对话过程，使用户与对话系统顺利交互，解决用户的问题，它是对话系统的核心步骤；④
    任务管理：该模块根据具体任务管理对话过程所涉及的实例型知识数据和领域知识（可能难以形式化描述）。⑤ 对话生成：该模块主要负责将对话管理系统决策信息转换为文本结构的自然语言；⑥
    语音合成：该模块主要负责将文本结构的信息转换为语音数据发送给用户。其中，本书主要关注对文本内容的处理，因此，我们将不介绍语音识别和合成部分的内容。实际上，除去语音识别和语音合成模块，就是文本对话系统的主要研究内容，也是对话系统的最核心内容。


