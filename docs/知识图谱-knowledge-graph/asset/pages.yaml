  md: '# 8.1.1.2 类型表


    为每种类型构建一张表，同一类型的实例存放在相同的表中。表的每一列表示该类实体的一个属性，每一行存储该类实体的一个实例[486, 487]。图 8.4 展示了知识图谱的类型表存储示例。这种存储方式虽然克服了三元组表的不足，但是带来了新的问题：①大量数据字段的冗余存储。假设知识图谱中既有“数学家”也有“物理学家”，那么同属于这两个类别的实例将会同时被存储在这两个表中，其中它们共有的属性会被重复存储。例如“玻恩”既是“数学家”，又是“物理学家”，在知识图谱中，该实例会被同时存储于上述两个表中。如图
