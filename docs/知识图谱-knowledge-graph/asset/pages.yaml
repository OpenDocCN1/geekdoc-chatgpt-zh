    # 第二章 知识表示


    知识应用的难点在于知识推理，知识推理的难点在于知识表示。因此，知识表示是基于知识的人工智能应用中的核心部分。对于什么是知识表示，MIT AI Lab 的 Randall
    Davis 教授等人于 1993 年在 AI Magazine 上发表了极具影响的文章 “What is a Knowledge Representation?”^[125]^。该文章指出，知识表示的五个主要角色是：①
    知识表示是一种代理，基于对事物的表示，我们无需实践而是通过思考和推理就可以得到有关外部世界的结论；② 知识表示是一组本体论约定的集合，说明我们以什么样的方式来思考世界；③
    知识表示是智能推理的组成部分：推理需要对知识进行表示，但知识表示不是推理的全部；④ 知识表示是高效计算的媒介：通过对知识进行有效组织，支持高效的推理；⑤ 知识表示是人类表达的媒介：基于通用表示框架，方便人们表达和分享对世界的认知。


    结合上述五个主要角色，本章从三个层次介绍各种知识的表示方法：首先简要介绍人工智能和知识工程中的经典知识表示理论，包括逻辑、语义网络、框架、脚本等；接着介绍语义网中的知识表示方法，并介绍语义网的知识描述体系；最后介绍知识图谱中的知识表示方法以及在大数据环境下面向具体应用的知识图谱的数值化知识表示方法。


    # 2.1 经典知识表示理论


    # 2.1.1 逻辑


    逻辑本身根据复杂性从简单到复杂分为：命题逻辑、一阶谓词逻辑、高阶逻辑。命题逻辑 (Propositional Logic) 具有最简单的语法，它定义了具有真假'
