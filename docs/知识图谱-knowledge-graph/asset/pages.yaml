- pgno: 208
  md: '推理效率，又出现了一些基于 OWL 子语言以及描述逻辑（Description Logic）的推理系统，如：ELK^[237]^、DLV^[271]^、Pellet^[432]^
    等。这类方法的好处是领域专家只需专注于专业知识，而推理规则由推理系统的设计者建立，并且目前已经存在大量定义在此理论下的数据、语言、计算框架、分布式框架等。


    确定性逻辑推理以准确性高、推理速度快等特点，直至目前也仍是一个非常活跃的研究方向。但面对真实世界中，尤其是存在于网络大规模知识图谱中的不确定甚至不正确的事实和知识，确定性逻辑推理很难对其进行处理。例如出生地
    (X,Y) ⇒ 国籍 (X,Y) 是一条置信度较高的逻辑规则，但也仍有少数的事情不满足它；大规模知识图谱 YAGO 也根据抽样统计宣布其中含有 5% 左右的错误事实。在这些情况下，需要通过加入统计或概率的方式，对确定性的逻辑推理规则进行软化，用以捕捉真实世界中的不确定性，由此研究者们提出概率推理方法。


    确定性推理技术也很难应用于充满不确定性的自然语言处理任务，如知识问答，主要有以下三个原因：① 现有的自然语言理解技术还很难准确地将自然语言表达成确定性的逻辑推理需求；②
    知识问答等自然语言处理任务中的各种“规则”很难由专家人工给出，而基于统计方法挖掘出来的规则带有一定的不确定性和概率性；③ 现实世界本身的不确定性，也从本质上决定了一些问题是无法使用确定性推理技术进行回答的。


    # 9.2.2.2 不确定性推理


    不确定性推理也被称为概率推理，是机器学习或统计学习中一项重要的分支，它并不是严格地按照规则进行推理，而是根据以往的经验和分析，结合专家先验知识构建概率模型，并利用统计计数、最大化后验概率等统计学习的手段对推理假设进行验证或推测。按照概率推理中特征的模式与来源，可以分为三类方法：概率图模型、概率逻辑推理和关联规则挖掘。


    # 1. 概率图模型


    概率推理与概率图模型有着密切的联系，早在 20 世纪早期，Sewall Wright 就利用网络来表示概率信息，用于对基因遗传和动物生长因素的多方面不确定性以及它们之间的关系进行分析^[491]^。而概率图模型则可根据图结构的不同，分为基于有向图的贝叶斯网络（Bayesian
    Network）以及基于无向图的马尔可夫网络（Markov Network）^[249]^。其中贝叶斯网络被广泛应用于各类专家系统中，如医疗^[383]^、电力^[139]^、计算机系统^[215]^
    等。这一类方法使用的最主要的推理目标就是条件下的概率查询 P(Y|E = e)，其中 Y 的值 y 上的后验概率分布取决于获得的证据 E = e，并通过最大后验概率（MAP）的方式进行求解。但是这种基'
