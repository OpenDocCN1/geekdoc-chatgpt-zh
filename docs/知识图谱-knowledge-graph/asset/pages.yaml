    Of Data）。LOD 为实现网络环境下的知识发布、互联、共享和服务提供了创新技术，为智能搜索、知识问答和语义集成提供了创新源动力。LOD 项目的目标是：以
    RDF 语义形式在 Web 上发布各种开放数据集，并在不同来源的数据项之间建立语义链接，从而增强 Web 上的数据共享，最终实现语义 Web 知识资源的开放共享。目前，LOD
    项目发布了 570 余个数据集，包含上千亿 RDF 三元组，并且随着链接数据的推广和 LOD 项目的发展，将有越来越多的数据以链接数据的形式发布在万维网上。'
