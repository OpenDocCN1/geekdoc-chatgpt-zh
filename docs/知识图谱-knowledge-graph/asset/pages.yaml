    # 2.4 知识图谱的数值化表示方法


    # 2.4.1 符号的数值化表示


    知识表示的一大重要目标就是进行语义计算，比如，从句子中识别出概念短语“中科院自动化所”并判断它是一个机构名、识别和预测“北京”和“中国”之间的关系等任务都涉及语义计算。很多知识表示方法（例如逻辑、语义网络、框架、脚本、知识图谱等）用符号显式表示概念及其关系，概念的种类和关系的类型都是人们总结的结果，其中难免存在有遗漏的情况，例如，DBpedia
    中对人物没有定义“性别”属性①、Freebase 中对人物没有定义“朋友”“爷爷”等关系，因此在语义计算过程中，仅仅依赖这类显式表示的知识，难以获取更全面的知识特征。


    另一方面，目前的大多数语义计算任务都采用基于数值计算的统计机器学习方法，而作为知识载体的数据表示是机器学习中的基础工作，数据表示的好坏直接影响到整个机器学习系统的性能[47]。因此，人们投入了大量精力去研究如何针对具体任务，设计一种合适的数据表示方法，以提升机器学习系统的性能，这一环节也被称为特征工程。特征工程是人类对特定任务智慧和灵感的体现。特征工程在传统机器学习算法中，有着不可替代的地位，但是由于需要大量人力和专业知识，也成为了机器学习系统性能提升的瓶颈。为了让机器学习算法有更好的扩展性，研究人员希望可以减少对特征工程的依赖。这样，当把'
