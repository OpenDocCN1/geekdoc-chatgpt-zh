- pgno: 64
  md: "● OWL：全称网络本体语言（Web Ontology Language）。OWL 是本体的语义表示语言，它建立在 RDF 和 RDF Schema\
    \ 的基础之上。OWL 能够表达本体知识和刻画属性之间关系（例如：逆关系、函数约束、有且仅有等）。为了更好地对逻辑和推理知识进行描述，OWL 吸收了描述逻辑等逻辑语言。\n\
    \n下面详细介绍这三种语义网知识表示方法。\n\n# 2.2.2.1 XML\n\nXML 并不是专为语义网而设计的，XML 的最初版本是二十世纪八十年代初被提出用来处理动态信息的显示问题，以及为了解决\
    \ HTML 在数据表示和描述方面混乱的问题而提出的技术标准。在网页内容传输过程中，HTML 只能利用预定义的标记集合，而 XML 作为标记语言，可以由相关人士自由决定标记集合，这样极大地提升了语言的可扩展性。1998\
    \ 年，XML 就有了明确的规范版本 XML 1.0。\n\n一个标准的 XML 文档需包含一个序言和若干具体的内容，也可以包含一个尾注。序言是对 XML\
    \ 的声明以及对外部文档的引用，下面两行是 XML 声明和引用的示例：\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE html SYSTEM \"url.dtd\">\n```\n\n第一行定义了所使用的 XML 版本和字符编码，<!DOCTYPE>\
    \ 标签则是标准通用标记语言的文档类型声明，表示引用外部文件来定义本地文档中出现的名字，url.dtd 标记了要引用文档的路径。\n\n接下来介绍 XML\
    \ 文档的内容。XML 的内容通过元素（如：人物、组织、事件等）来记录，元素都带有标签。元素的标签必须是字母、下划线或冒号，标签含有的内容可以是文本、数值、时间甚至为空。元素可以有嵌套结构，嵌套的深度不受限制。下面的例子描述了人物的基本信息：\n\
    \n```\n< 人物 >\n  < 名字 > 马克斯·普朗克 </名字 >\n  < 国籍 > 德国 </国籍 >\n  < 专业 > 物理学家 </专业\
    \ >\n  .....\n</人物 >\n```\n\n上例中，< 人物 > 元素拥有嵌套结构，因为它包含多个元素的内容，而 < 名字 > 元素包含一个文本描述内容。\n\
    \nXML 具有树状结构从根节点出发，总会找到一条路径可以到达某一元素"
