    # 2.4.3.1 基于张量分解的表示学习方法


    张量分解的方法以 Nickel 等提出的 RESCAL 系统[361-364] 为代表。图 2.12 是 RESCAL 系统的原理图。它的核心思想是将整个知识图谱编码为一个三维张量
    X̂，如果三元组 r(e1, e2) 存在于知识图谱中，则对应张量中的值 X̂ e1,r,e2 为 1，否则为 0。将张量 X̂ 分解为核心张量 R̂ 和因子矩阵
    A 的乘积形式 X̂ ≈ Aᵀ R̂ A，其中核心张量 R̂ 中每个二维矩阵切片代表一种关系的语义，因子矩阵 A 中每一列代表一个实体的向量。模型重构的结果
    Aᵀ R̂ A 中的每一个元素被看作对应三元组成立的概率，如果概率大于某个阈值，则对应三元组正确，否则不正确。这里重构的过程即是推理的过程，对于原张量 X̂
    中值为 0 的位置所对应的三元组，当重构后它的值大于概率阈值时，该三元组即为推断出的正确三元组。张量分解在编码实体和关系的过程中综合了整个知识图谱的信息，它的主要缺点是需要优化张量中所有位置的值，包括
    0 在内。因此，当关系数目较多时，张量的维度很高，分解过程计算量较大。


    ![](img/9549a57f481f525254296dec39e94079_76_1.png)


    图 2.12 RESCAL 系统原理图


