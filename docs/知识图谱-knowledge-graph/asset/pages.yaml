  md: '词的表示学习是基于深度学习的自然语言处理方法的基础步骤，其主要目标是把每个词符号表示为分布向量的形式（Distributional Representation），基于词的向量表示，句子、段落、篇章、对话等更大语言单元就可以通过语义组合模型（如卷积神经网络、循环神经网络等深度学习模型）得到，进而进行文本分类、问答匹配、机器翻译、对话生成等任务。词表示学习的理论基础是
    Harris 在 1954 年提出的分布假说（Distributional Hypothesis）：上下文相似的词，其语义也相似[198]。Firth 在
    1957 年对分布假说进行了进一步阐述和明确：词的语义由其上下文决定（A word is characterized by the company it keeps[157]）。尽管词表示学习在自然语言处理领域发挥着重要作用，但是这种完全数据驱动的方法存在一些明显的问题，比如，根据词的分布表示，不能区分两个词之间是“近义词”还是“反义词”的关系。为了让词的分布表示能蕴涵更多语义信息，特别是与人类认知一致的语义知识，有不少研究把句法分析结果[273]、语言知识图谱[514]、常识知识图谱[500]融入到词的表示学习过程中，以此提升词表示在深层语义理解任务中的效果[484]。


    知识图谱表示学习是将知识图谱中用符号表示的实体和关系投影到低维向量空间中，这种表示能够体现实体和关系的语义信息，可以高效地计算实体、关系及其之间的复杂语义关联[20]。这种方法在知识图谱的构建、推理和应用中具有重要作用。学习到的实体和关系向量表示反映了知识图谱中各个元素之间的关联，能够用于推断知识图谱中缺失的关系，补全知识图谱[434]。除此以外，随着深度学习方法的发展，它也很容易应用到问答系统[63,
    68, 132]等任务中。知识图谱表示学习在学习实体和关系的向量时，可以考虑到整个知识图谱的信息，因此，当用其推断知识图谱中缺失的关系时，可以用到更加全面的信息，从而提升预测性能，并且计算效率高，能够满足当前大规模知识图谱的需求。但是，相对于逻辑规则推理的方法，它的推理过程使用数值计算的方式表达，是一种隐含的表达方式，不易被理解，人工也难以干预推理过程和增加先验知识。


    神经符号机是一种将神经网络与符号推理相结合的技术，近年来开始被用于自然语言处理领域。神经符号机是利用神经网络对函数演算和图灵机等传统计算模型进行建模。根据抽象层次的不同，可以将其分为两类。一类抽象层次较高，每个推理步骤都是从设计好的操作集合里选择，再选择合适的操作数。操作集合往往根据不同任务来设计，少则三四个，多则数十个。通过依次执行多个操作，得到针对用户问题的最终答案。这样的思路在针对表格的问答[346,
    353]、基于知识库的问答[281]等任务上都有应用。另一类做法的抽象层次较低，代表工作如神经图灵机[178]、可微分神经计算机[179]等。它们从模拟计算机底层操作方式的角度抽象模型，设计出内存、CPU
    控制器等结构，并借鉴传统计算机操作系'
