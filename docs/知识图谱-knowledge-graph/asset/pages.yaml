- pgno: 148
  md: '使用概率图模型选择包中的有效示例，而且在系统里增加了多标签的学习方案。以上方法的共同点是在抽取文本特征时，都依赖于传统的自然语言处理工具，这些自然语言处理工具本身可能存在错误积累和传递的问题[41]，因此会对最终的结果产生不利影响。Zeng
    等[520] 使用分段卷积神经网络（Piecewise Convolution Neural Networks, PCNNs）抽取文本的特征，他们认为传统的最大池化（max-pooing）难以捕捉句子的结构信息，因为两个实体将示例分割为三段，中间是实体对之间的内部特征，而两端是外部特征，这种结构信息是示例的重要特征，因此需要分别对它们进行最大池化操作。除此之外，在模型的训练过程中，他们还利用了多示例学习（Multi
    Instance Learning, MIL）的算法缓解数据噪音问题。PCNNs-MIL 在由 Riedel 等[399] 发布的经典数据集上取得了很好的测试结果。下面主要介绍这种方法。


    # ● 训练数据产生


    弱监督关系抽取为自动产生训练数据，首先通过命名实体识别工具找出给定的非结构化文本中（纽约时报）的所有实体，根据弱监督假设，将标出的实体组合成实体对，然后在给定的知识库（Freebase）中查询，看实体对是否存在语义关系，若存在就挑选所在文本作为正样本，最后在没有语义关系的实体对所对应的文本中随机抽样产生负样本。


    # ● 任务建模


    由于语言表达的多样性，知识库中的实体对一般会在多个句子中出现，其中有些句子是噪声数据，在自动产生数据的过程中并不知道哪些句子有用。假设在出现的多个句子中至少有一个句子有用，所有回标出来的句子可以看作是一个包
    M = {m1, m2, …, mj}，其中每个句子 mj 是包中的示例，弱监督关系抽取的目标就是给未知的包指定语义标签，并不关心具体每个示例的标签，当包中每一个示例都是负样本时，表示实体间没有关系。


    # ● 分段卷积神经网络


    Zeng 等[520] 提出利用分段卷积神经网络，自动对每一个示例学习相关的特征，分段卷积神经网络是为了在关系抽取时保留句子中更多的信息，充分利用句子中的结构化信息而提出来的，是对卷积网络的改进，网络中特别设计了分段最大池化结构代替卷积神经网络中的最大池化层。


    # ● 多示例训练


    弱监督关系抽取输入的是包，要解决对包标签的预测，需要克服有噪声示例对实验结果的影响，因此，Zeng 等[520] 提出利用多示例学习进行模型的参数训练。多示例学习的最终目标是预测未知包而非示例的标签，传统的误差反向传播的目标函数定义在示例上，而多示例训练中把目标函数定义在包上，首先'
  merge: -1
  img_proc: true
- pgno: 149
  md: '对包中的每个示例分别预测，得到相应的关系概率，然后选取概率最大的示例标签作为包的标签，并利用包的标签更新网络的参数。该方法能有效克服弱监督关系抽取中存在的回标噪声问题。


    Zeng 等[520] 方法存在的问题是：只利用了包中的一个句子信息，忽略了很多有用的信息。因此，Lin 等[292] 和 Ji 等[230] 提出利用句子级别的关注机制来自动捕获包中不同句子的重要程度，自动获得有用的句子，过滤掉噪声句子。Jiang
    等人[232] 提出了跨句子池化和多标签的分类方法，旨在利用一个包中多个句子的信息并解决一个实体对有多个关系的情况。由于基于弱监督学习的关系抽取系统不需要人工标注数据，因此目前基于弱监督学习的关系抽取系统抽取的关系实例规模比较大，代表性的系统有：NELL
    和 Probase，分别介绍如下：


    # 1. NELL (Never-Ending Language Learner)


    NELL 系统是由卡内基梅隆大学（CMU）的 Mitchell 教授领导的团队开发的一套通过不断自我学习来阅读和理解 web 的系统。NELL 系统能够从非结构化的
    web 页面中抽取结构化的信息。目前，NELL 系统已经累计获取了涵盖 1186 个实体类别和关系类别的 3109311 个实例。


    NELL 系统的输入包括：① 一个预定义的实体类别体系（比如：person, sportsTeam, fruit, emotion 等）以及关系体系（比如：playsOnTeam（athlete,
    sportsTeam）, playsInstrument（musician, instrument））。② 每个实体类别和关系类别的 10 到 15 个样例。除了上述输入外，再加上一个包含了
    50 亿个 web 页面的集合并且通过搜索引擎 API 来获取剩余的 web 页面，如此这般，NELL 可以每天 24 小时不间断地进行以下两个任务：


    +   - 为各个实体类别和关系类别抽取新的实例。也就是说，从 web 页面中找到一些名词短语并且判断这些名词短语是否是某个类别的新实例（比如：“Barack
    Obama” 属于 person 和 politician 类别）；并且还要找到名词短语对，并判断它们是否是某个关系类别的新实例（比如：名词短语对 “Jason
    Giambi” 和 “Yankees” 是关系 playsOnTeam 的实例）。然后将这些新实例以及它们的置信度添加到知识库中。

    +   - 提升系统本身的抽取性能。NELL 将已经抽取的高质量实例作为监督信息不断地进行训练，以提升整体的抽取性能。这可以看作是一个弱监督的学习过程。


    # 2. Probase


    Probase 是由微软亚洲研究院 Wang 等[495] 开发的一套旨在让机器更好地理解人类交流的概念知识图谱，是微软 Concept Graph 的前身。目前，Probase
    已经包含了 2653872 个概念，20757545 个 isA 实体-概念、概念-概念对。它'
  merge: -1
  img_proc: true
- pgno: 150
  md: '可以从海量的 web 页面中自动抽取出 isA 关系和概念标签，并且用概率值来表示抽取的置信度。


    Probase 通过现有的知识来理解文本从而获取更多的知识，主要包括两个阶段：① 信息抽取；② 数据清洗和整合。具体来说，每次进行信息抽取的时候，Probase
    都会利用已经抽取的知识进行监督，进而抽取新知识，然后用更新后的知识再去抽取信息，这样就能在反复的迭代过程中抽取更多的知识。接着从抽取出的 isA 对中构建出分类体系，并计算出所构建的知识的概率，包括概念与概念之间的概率以及实例与概念之间的概率。


    # 6.3 开放域关系抽取


    上面我们介绍了限定域的关系抽取，限定域关系抽取需要预先定义关系的类别，然而很多情况下预先定义一个全面的关系类型体系是很困难的。开放域关系抽取不需要预先定义关系，而是使用实体对上下文中的一些词语来描述实体之间的关系。开放域关系抽取的任务可以形式化地表示为
    (arg₁, relationWords, arg₂)，其中 arg₁, arg₂ 是存在关系的实体对，relationWords 代表关系，就是上下文中描述关系的词或词序列。例如：“姚明出生于上海。”中，开放域关系抽取系统抽取的结果为（姚明，出生于，上海）。但是如果预定义关系抽取中定义了出生地的关系没有定义出生于的关系，则预定义关系抽取的结果是（姚明，出生地，上海）。


    华盛顿大学的人工智能研究组最早提出开放域信息抽取（Open Informaition Extraction, Open IE）的概念，在这方面做了大量代表性的工作，并且开发了一系列原型系统：TextRunner、Kylin、WOE、ReVerb
    等。Banko 等[144] 在 2007 年首先提出了开放域实体关系抽取并开发出一个完整的系统 TextRunner，它能够直接从网页纯文本中抽取实体关系。TextRunner
    通过一些简单的启发式规则自动从宾州树库里面获取实体关系三元组的正负样本，根据它们的一些浅层句法特征训练一个分类器来判断两个实体间是否存在语义关系；然后将网络文本进行一定的处理后作为候选句子，提取其浅层句法特征，利用分类器判断所抽取的关系三元组是否可信，最后利用网络数据的冗余信息，对初步认定可信的关系进行评估。对于关系名称的抽取，TextRunner
    把动词作为关系名称，通过动词链接两个论元，从而挖掘论元之间的关系，其抽取过程类似于语义角色标注。下面以 TextRunner 为例进行详细介绍：'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'TextRunner 是第一个开放域实体关系抽取系统，它使用启发式规则在宾州树库中自动标注语料，不需要人工预先定义关系类别体系，主要分为三个模块：语料的自动生成和分类器训练、大规模关系三元组的抽取、关系三元组可信度计算。


    # 1. 语料的自动生成和分类器训练


    语料的自动生成：主要是通过依存句法分析结合启发式规则自动生成语料。


    利用的启发式规则举例如下：


    +   - 两个实体的依存路径长度不能大于指定值。

    +   - 实体不能是代词。

    +   - 关系指示词是两个实体之间依存路径上的动词或动词短语。

    +   - 两个实体必须在同一个句子中。


    分类器的训练：TextRunner 利用朴素贝叶斯分类器进行训练，其使用的特征举例如下：


    +   - 关系指示词的词性

    +   - 关系指示词的长度

    +   - 实体的类型

    +   - 实体是否是专有名词

    +   - 左实体左边词语的词性

    +   - 右实体右边词语的词性


    # 2. 大规模关系三元组的抽取


    利用上一步训练好的关系抽取器，在大规模的 web 文本上进行关系三元组的抽取，并将抽取的大量三元组存储起来。


    # 3. 关系三元组可信度计算


    首先将存储起来的相似的三元组进行合并，例如 (arg₁, married, arg₂) 和 (arg₁, marries, arg₂) 是两个相同的三元组。然后根据网络数据的冗余性，计算合并后关系三元组在网络文本中出现的次数，进而计算相应关系三元组的可信度。


    在 TextRunner 之后，Wu 等[492] 在 2007 年提出了 Kylin 系统，该系统选取包含信息框（Infobox）的 Wikipedia
    页面，根据信息框中包含的条目属性及属性值回标产生训练数据，同时根据信息框中的属性名自动确定需要抽取的属性，不同的属性训练不同的 CRF 模型抽取属性值。Wu
    等[493] 在 2010 年提出了开放实体关系抽取系统 WOE，该系统也是利用 Wikipedia 页面信息框回标，通过一些规则挑选含有实体关系的高质量句子，然后使用依存句法分析树以及词性标注这样的浅层特征训练两个分类器，作为两个实体关系抽取器，'
  merge: -1
  img_proc: true
- pgno: 152
  md: '以此来获得大量的实体关系三元组模板。最后对网络文本的句子做浅层句法处理后，同抽取器获得的模板进行比对，来判断实体关系三元组的可靠性。通过上面的描述可以看到
    Kylin 和 WOE 的数据都是基于距离监督的方式产生的，但是由于它们将 Wikipedia 中的信息框作为距离监督中的结构化知识库，并利用其进行回标，而
    Wikipeida 中的信息框结构和内容是不断更新的，所以本书将 Kylin 和 WOE 与华盛顿大学在开放域关系抽取的系列工作放在一起进行介绍。2011
    年 Fader 等[149] 在对 TextRunner 和 WOE 的结果进行分析后，根据这两个系统中普遍存在的错误，提出了基于句法和词汇约束的实体关系识别器
    ReVerb，主要解决了以前系统抽取结果中普遍存在的三元组识别错误（ incoherent extractions ）和无信息三元组抽取（ un-informative
    extractions ）的问题。实验结果表明，ReVerb 大幅度提升了关系三元组抽取的准确率和召回率。


    由于传统的信息抽取方法的局限性，开放域信息抽取得到许多学者的关注。Talukdar 等[457] 研究了怎样在非结构化文本和搜索日志中进行开放域属性抽取，提出了采用
    Bootstrapping 的框架进行开放域属性抽取，该方法首先给定初始种子模板，然后通过多次迭代选取具有高置信度的三元组作为抽取结果。不同于 Talukdar
    等[457] 初始化时给定关系模板，Davidov 等[122][123] 初始时给定一些触发词作为种子，通过触发词找出候选的语料，根据候选语料得出元模板，多次迭代后得到最终的抽取模板。


    # 6.4 小结


    关系抽取是知识图谱构建过程中的关键环节，具有重要的研究意义和广阔的应用前景。本章主要针对实体关系抽取技术进行介绍，首先介绍了关系抽取的任务、分类及其难点，然后介绍了关系抽取相关的评测，最后介绍了限定域关系抽取和开放域关系抽取中的典型方法和系统。由于开放域关系抽取得到的关系无法直接映射到知识图谱中，限定域的关系抽取是目前研究的主流方向。传统的基于模板的关系抽取方法可扩展性差，基于机器学习的关系抽取方法是目前研究的热点。基于机器学习的关系抽取主流方法有基于有监督学习的关系抽取和基于弱监督学习的关系抽取。但是，基于有监督学习的关系抽取需要人工标注大量训练数据，耗时费力，目前基于弱监督学习的关系抽取方法得到了越来越多的关注。'
