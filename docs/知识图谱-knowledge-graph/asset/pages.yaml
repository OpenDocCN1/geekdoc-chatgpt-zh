    Horn 子句，例如以下的例子：


    父亲 (x, y) ∧ 母亲 (y, z) ⇒ 奶奶 (x, z)


    这条逻辑规则的含义是一个人 x 的父亲的母亲是这个人的奶奶。在知识图谱中存在大量的这种规则的实例，也就是将规则中的变量 x、y、z 替换成知识图谱中的实体，例如以下都是知识图谱中出现的规则的实例：


    +   - 父亲（王思聪，王健林）∧ 母亲（王健林，秦嘉兰）⇒ 奶奶（王思聪，秦嘉兰）

