    ● 语料（篇章）级关系抽取，该任务旨在判别两个实体之间是否具有某种语义关系，而不必限定两个目标实体所出现的上下文。也就是只需要判别姚明和上海之间有出生地的关系，而并不必关注具体是哪一个句子表达了这两个实体有这样的关系。这一任务对于知识图谱构建十分重要，因为在知识图谱构建过程中，我们需要分析图谱中两个节点（实体）之间边上的语义标签（关系），而并不用特别关注它们所出现的具体文本。


    另外，根据所抽取领域的划分，关系抽取又可以分为限定域关系抽取和开放域关系抽取：


    +   - 限定域关系抽取。是指在一个或者多个限定的领域内对实体间的语义关系进行抽取。通常情况下，由于是限定域，语义关系也是预设好的有限个类别。对于这一任务，可以采用基于监督学习的方法来处理，即针对每个关系类别标注充足的训练数据，然后设计关系抽取模型，进行模型训练，最后利用训练好的模型抽取关系。但是面对大规模知识图谱构建时，人工标注的训练语料远远不够，所以有很多工作利用弱监督学习解决训练语料的标注问题。\n-
    开放域关系抽取。与限定域关系抽取不同，开放域关系抽取并不限定关系的类别，依据模型对于自然语言句子理解的结果从中开放式抽取实体关系三元组。


    # 6.1.3 任务难点


    关系抽取是信息抽取中的一个关键环节和难点问题，相较于实体识别和实体消歧任务而言，关系抽取任务更加复杂，其难点表现在以下几个方面：


    +   1. 同一个关系可以具有多种不同的词汇表示方法。例如：句子“姚明出生于上海”和句子“姚明的出生地是上海”都表达了姚明和上海具有出生地关系。\n2.
    同一个短语或词可能表达不同的关系。例如：句子“李梅是我的姑娘”中的姑娘，在不同的上下文中代表了不同的关系，可以指“女朋友”也可以指“女儿”。\n3. 同一对实体之间可能存在不止一种关系。例如：姚明的出生地是上海，姚明的居住地也是上海。\n4.
    关系抽取不仅涉及到两个或两个以上的实体单元，还涉及实体周围的上下文，需要利用文本中的一些结构化的信息，使得问题复杂度成指数级增长。例如：“三国时期，蜀国有多位能征善战的将军，他们是：关羽、张飞、赵云、'
  merge: -1
  img_proc: true
- pgno: 137
  md: '黄忠和马忠。”


    （5）关系有时候在文本中找不到任何明确的标识，关系隐含在文本中。例如：蒂姆·库克与中国移动董事长奚国华会面商谈“合作事宜”，透露出了他将带领苹果公司进一步开拓中国市场的讯号。在这一段文本中，并没有直接给出蒂姆·库克和苹果公司的关系，但是从“带领苹果公司”的表达，我们可以推断出蒂姆·库克是苹果公司的首席执行官（CEO）。


    （6）关系抽取一般依赖于词法、句法分析等基本的自然语言处理工具，但是实际情况下，许多针对这些工作的自然语言处理工具性能并不高，低性能工具引入的错误反而会降低关系抽取系统的性能。


    # 6.1.4 相关评测


    针对这一任务，学术界组织了许多公开的技术评测，极大地推动了该领域的相关研究。其中，对关系抽取影响最大的是消息理解会议（Message Understanding
    Conference, MUC）。关系抽取的概念最早在 MUC-6[182]的模板元素（Template Element, TE）任务里出现，MUC-7 把命名实体之间潜在的关系从实体的属性值中分离出来，正式引入了模板关系（Template
    Relation, TR）任务，它要求识别实体之间的三种相互关系（即 location_of、employee_of 和 product_of）。MUC 评测会议有力地推动了关系抽取研究的发展。


    在 MUC-7 之后，MUC 由美国国家标准技术研究院（NIST）组织的自动内容抽取（Automatic Content Extraction Evaluation,
    ACE）评测所取代，继续推动着面向自然语言文本的自动内容抽取技术的研究。ACE 评测于 1999 年开始筹划，2000 年正式启动，其中关系识别和检测（Relation
    Detection and Recognition, RDR）任务定义了较为详细的关系类别体系，用于两个实体间的语义关系抽取。ACE-2008 包括了 Agent-Artifact、General-Affiliation、Metonymy、Organization-Affiliation、Part-Whole、Person-Social、Physical
    等 7 大类和 18 个子类的实体关系。


    从 2009 年开始，ACE 被归为文本分析会议（Text Analysis Conference, TAC），有关关系抽取的评测归为知识库构建评测（Knowledge
    Base Population, KBP）[资源 6-1] 的槽填充（Slot Filling）子任务中，主要研究如何从文本中抽取特定的实体属性信息与知识图谱构建密切关联。相较于
    ACE, TAC-KBP 抽取的关系类型更多，针对人物、组织和地理位置设置了将近 40 个关系类型。


