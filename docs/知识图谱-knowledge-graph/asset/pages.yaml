  md: "# 4.3.2 实体扩展方法\n\n由于实体扩展任务具有目标实体类别开放、目标数据领域开放和以“抽取”代替“识别”的三个特点，目前典型的实体扩展系统主要由以下三个模块组成：\n\
    \n+   (1) 种子处理模块：负责选取或生成高质量的种子。无论使用哪种抽取方法，种子对整个系统的性能都有很大影响，所以选择高质量的种子非常重要。该模块的输入是若干种子组成的初始种子集合，输出是高质量种子组成的集合。\
    \ \n+   (2) 实体抽取模块：负责从语料中抽取属于目标类别的实体。通常该模块包含“候选抽取”以及“打分排序”两个子模块。前者抽取候选实体，后者计算候选实体的置信度并对其排序。该模块的输入是种子集合，输出是排序后的候选实体列表。\
    \ \n+   (3) 结果过滤模块：对抽取出的实体集合进行过滤。该模块的目标是提高候选实体列表的准确率。实际上，这个模块也可以归并到第二个模块之中，将其作为实体抽取方法的一部分。此时，系统可以被划分为两个模块。\n\
    \n由于第一个模块种子处理模块和第三个模块结果过滤模块是通用模块，不同的实体扩展方法主要区别在于实体抽取模块。目前的实体扩展方法，大致可以分为基于模板的实体抽取和基于统计的实体抽取两大类（根据实体抽取模块所使用的方法划分）。下面对这两类方法进行分别介绍。\n\
    \n# 1. 基于模板的实体抽取\n\n基于模板的实体抽取基本思路是：如果目标实体与种子实体同属于某个语义类，则它们的上下文应该符合特定的模板。这里的模板可以是预先定义好的指示上下位关系的语义模板，如“such\
    \ as”“and other”等；也可以是通过分析种子实体所处的上下文得到模板，如窗口上下文模板。后者的基本思路是：如果目标实体与种子实体同属于某个语义类别，则它们的上下文分布应该是相似的，这里的上下文主要指名词或名词短语[459]。无论哪种类型的模板，都可以用来抽取候选实体，并以模板为特征，计算候选实体的置信度[458,\
    \ 459, 461]。\n\n在预定义模板的方法中，主要的假设是① 好的模板在语料中出现次数频繁；② 好的模板总是指示目标类别的实体；③ 好的模板可以在不需要其他知识的前提下在文本中被识别出来[205,\
    \ 372, 401]。\n\n由于使用预定义模板能找到的新实体数量有限，研究者提出了不同的改进方法。一种最具代表性的改进方法是基于 Bootstrapping\
    \ 策略，反复迭代，得到更多的模板[251, 373, 374]。例如在 Kozareva[251] 提出的方法中，在抽取阶段使用的模板为：“<Class\
    \ Name>such as<Member 1> and *”，其中“Class Name”是类别名，而“Member1”是初始种子。该方法使用上述模板构建查询并送到搜"
