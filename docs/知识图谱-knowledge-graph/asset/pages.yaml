    # 8.2.1.2 SPARQL 语言


    SPARQL [107, 385] 是由 W3C 为 RDF 数据开发的一种查询语言和数据获取协议，是被图数据库广泛支持的查询语言。和 SQL 语言类似，SPARQL
    也是一种结构化的查询语言，用于对数据的获取与管理，主要包括数据的插入、删除和查询操作。由于 RDF 数据是以三元组的形式进行表示的，因此三元组在 SPARQL
    语言中是一个非常重要的概念，几乎所有的 SPARQL 语句中都会包含三元组。本节使用图 8.8 给出的样例的知识图谱的子图作为演示。图 8.9 展示了该子图及对应的
    RDF 数据。本节将以图中虚线表示的实体和关系为例，展示如何使用 SPARQL 语言进行补全缺失数据、删除特定数据、修正错误数据以及数据查询等常用操作，来介绍
    SPARQL 语言的使用方法。'
