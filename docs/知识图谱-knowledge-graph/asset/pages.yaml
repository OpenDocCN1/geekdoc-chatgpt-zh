  md: '种基于概率图模型的无约束推理一般都是 NP 难问题，因此在最坏情况下需要指数级的推理时间，更严重的是对于这种推理的近似求解依然是一个 NP 难问题。对于具体的推理问题近似或归约的研究一直在继续着，并且是一个非常活跃的研究领域，包括来自于统计学、计算机科学和物理学的贡献。主要的工作有：①
    基于和积变量消除的方法[126]，它通过对一个变量求和，并与其他相关因子相乘以消除这一变量，从而令复杂的概率图结构尽可能地简单化；② 基于概率图结构的置信传播[165]或期望传播[339]的方法，将原有的推理问题转为图上的优化问题，并以优化的方式对设计好的能量函数或势函数求概率最大以达到近似推理的目的；③
    另一种截然不同的方式是从所有或部分变量的实例出发，通过对这些原子实例进行统计或采样以估计推理目标概率，包括著名的基于马尔可夫性的蒙特卡洛采样（MCMC）和
    Metropolis Hasting 算法[201,327]，以及针对无向图推理设计的 Gibbs 采样算法[171]。


    概率图模型具有较深的理论和研究基础，也具有很深的应用历史和背景，很难在本章节中进行穷尽，而且概率图模型的方法也不作为本书的重点进行展开，如果想了解概率图方法更具体的内容，请参考教科书《概率图模型：原理与技术》[19]。


    在单纯的概率图模型中，虽然对变量本身以及变量间的依赖关系进行了建模，但只是针对具有直接概率依赖的实例级元素，并没有对更高层次的语义框架进行抽象，缺少了真实世界中存在的规律和规则，导致这一类模型需要大量重复的概率评估，在应用于目前主流大规模网络知识图谱时，会因为海量知识之间存在的复杂的概率依赖关系，而需要大量计算。因此，单纯的概率图模型并不能很好地处理大规模知识推理任务。


    # 2. 概率逻辑推理


    概率逻辑推理是通过概率图模型对逻辑进行建模的一类方法，弥补了概率图模型中缺乏可复用规则的缺点。早期有大量的工作利用概率与逻辑的融合作为可能世界（possible
    world）的概率度量，如 Nilsson[365] 和 Bacchus[40] 分别对命题逻辑和一阶逻辑进行了概率化，并利用知识库中的每一条关系三元组对可能世界概率进行了约束。但由于知识图谱规模爆发性地增长，即使利用马尔可夫毯（Markov
    Blanket）等局部依赖假设，对知识图谱中所有知识实例进行建模也是不可行的。在这种情况下，开始出现了基于逻辑变量或逻辑规则模板的推理模型，其中最为著名的是合并了马尔可夫网和一阶逻辑的马尔可夫逻辑网（Markov
    Logic Network, MLN）[396]模型。马尔可夫逻辑网可以被看作一个构造马尔可夫网的模板，它维护一个基于一阶逻辑的规则库，并对每一个逻辑规则附上了权重，以此对可能世界进行软约束。'
