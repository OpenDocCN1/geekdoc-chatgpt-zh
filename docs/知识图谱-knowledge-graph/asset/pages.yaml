- pgno: 62
  md: '从脚本表示方法的例子和必要因素中可以看出，这种表示方法能力有限，不具备对于元素基本属性的描述能力，也难以描述多变的事件发展的可能方向。但在非常狭小的领域内，脚本表示方法却可以比其他方法更细致地刻画步骤和时序关系，例如作战计划、电影脚本等。因为脚本能够描述有一定时序关系的槽信息，其在人工智能以及自然语言处理的一些任务中得以应用，最具代表性的就是智能对话系统，如酒店预定、机票预订等。


    综上，经典知识表示理论中的语义网络、框架和脚本都属于基于槽的表示方法，有所区别的是槽是否具有层次、时序、控制关系。其中，语义网络是最简单的一种，它的每个三元组都可以看成一个槽结构。框架系统由一组相关的框架联结而成，其中每个框架是由若干节点和关系构成的网络，因此，框架可以看成是层次化的语义网络，是语义网络的一般化形式。脚本是按照一定的时间流程对事件的发展和变换控制进行的建模，因此，可以认为是定义了时间和控制条件的槽结构，与语义网络也没有本质区别。


    # 2.2 语义网中的知识表示方法


    # 2.2.1 语义网表示方法


    本节所提到的语义网（Semantic Web）与人工智能中提出的语义网络（Semantic Network）的概念有所不同，语义网的概念来源于万维网（World
    Wide Web），甚至语义网最初的目的就是为了对万维网的功能进行扩展以提高其智能程度，因此人们也将语义网称为 Web 3.0。语义网最初是由万维网联盟（W3C）发起的，万维网的创始人
    Tim Berners Lee 期望语义网可以更加有效地组织和检索信息，从而使计算机能够利用互联网丰富的资源完成智能化应用任务。


    目前互联网中大多数信息是依靠弱结构组织起来的，例如仅仅通过简单链接构建关联的文本、音视频、网络应用等，这样的组织形式在一定程度上阻碍了信息检索、信息抽取以及信息管理等方面操作的便捷性。与
    IPv6 等其他互联网革命相同，语义网革命并不是在科学上有革命性的突破，而大部分是工程上的挑战，其中标准化、规模化、系统开发与集成、用户交互等都是语义网技术面临的挑战。因此，语义网或
    Web 3.0 是一个极具野心的宏观概念，本书主要从自然语言处理的角度介绍人们是如何利用语义网来表示知识的。'
  merge: -1
  img_proc: true
