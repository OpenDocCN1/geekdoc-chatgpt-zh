- pgno: 141
  md: '# 6.2.2.1 有监督的关系抽取方法


    有监督关系抽取的主要工作在于如何抽取出表征实体指称间语义关系的有效特征。通常情况下，特征抽取主要是使用自然语言处理工具包，从句子中抽取出如词汇、句法和语义等特征，作为关系分类的证据。为了缓解句法特征的稀疏性，有很多研究集中于利用核函数的方法进行关系抽取。近些年来随着神经网络的发展，有很多研究开始利用神经网络自动从文本中提取表征关系的特征，进而完成关系的抽取。下面对基于特征工程的方法、基于核函数的方法和基于神经网络的方法进行分别介绍。


    # 1. 基于特征工程的方法


    基于特征的方法的特点是需要显式地将关系实例转换成分类器可以接受的特征向量，其研究重点在于怎样提取具有区分性的特征。总结而言，该方法共三个步骤：① 特征提取：提取词汇、句法和语义等特征，然后有效地集成起来，从而产生描述关系实例的各种局部和全局特征。②
    模型训练：利用提取的特征训练分类模型。③ 关系抽取：主要是利用训练好的模型对非结构化文本进行分类，进而完成关系抽取。常见的关系抽取特征举例如下：


    +   （1）词汇特征。这些特征包含实体本身的词语或者名词性词组块、两个实体（词组块）之间的词语和两个实体（词组块）两端的词语。

    +   （2）实体属性特征。这些特征包含实体或者名词性词组块的类型特征，包括人物（Person），组织（Organization）、位置（Location）、设施（Facility）和地缘政治实体（Geo-Political
    Entity）等。

    +   （3）重叠特征。这些特征包括两个实体或者词组块之间词语的个数、它们之间部分包含其他实体或者词组块的个数、两个实体或词组块是否在同一个名词短语、动词短语或者介词短语之中。

    +   （4）依存句法特征。这些特征包含两个实体（名词性词组块）的依存句法分析树中的依存标签和依存路径。

    +   （5）句法树特征。这些特征包含连接两个实体（名词性词组块）的句法路径，不包含重复的节点，并且将路径使用头词（head words）标注。


    例如，对于句子 “Jobs was the co-founder of Apple”，对它进行词性标注和句法分析，得到结果如图 6.1 和图 6.2 所示。


    因此，对于上述例句，它的特征主要表现如下：


    +   - 词汇特征：“Jobs”“Apple”“was the co-founder of”等。

    +   - 实体类型：PERSON（“Jobs”），ORGANIZATION（“Apple”）。

    +   - 重叠特征：两个实体之间的词语个数是 4，它们之间包含其他实体的个'
  merge: -1
  img_proc: true
