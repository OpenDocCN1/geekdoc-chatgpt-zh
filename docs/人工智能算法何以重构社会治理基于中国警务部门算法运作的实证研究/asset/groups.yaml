    # 人工智能算法何以重构社会治理？

    # ——基于中国警务部门算法运作的实证研究


    宋锘业 徐雅倩


    提要：人工智能算法重构社会治理是一项重大时代性议题。本文基于对警务部门、平台企业、风险算法工程师的参与式观察和深度访谈，分析算法重构社会治理的逻辑与影响。研究发现，警务部门通过算法构建组织外部的关系结构，同时通过算法集约化实现组织内部的权力边界重塑，还借助算法提高对风险的全面感知能力。这带来的深层影响是，一方面，警务部门特别是基层警察的隐性知识和能力容易被算法替代，警务算法取代了其他更广泛的解决社会问题的方法；另一方面，算法的全面扩展带来“信息过描”，这在实践中容易转化为各种形式的优先排序。


    关键词：人工智能 算法治理 警务部门 社会治理


    * 本文系国家社会科学基金青年项目“数字智能背景下中国政府平台组织的形成机理及功能机制研究”(23CGL052)的阶段性成果。感谢匿名评审专家富有建设性的修改意见。感谢受访者对田野过程的支持和帮助。文责自负。


    ① 新华社,2025,《中国共产党第二十届中央委员会第四次全体会议公报》,中国政府网(https://www.gov.cn/yaowen/liebiao/202510/content_7045444.htm)。


    ## 一、引言


    党的二十届四中全会提出，“走中国特色社会主义社会治理之路”，“完善社会治理体系”。①现阶段，国家和社会治理的各个领域越来越多地使用人工智能算法（下文简称“算法”）辅助决策。目前为止，国内外大量算法研究主要聚焦于平台经济和劳动过程领域，比如平台企业使用算法管理骑手，向用户推荐和匹配信息（Cameron,
    2024; Ernst, 2025; Starke et al.,2025；丁晓东,2020；赵璐,2022；刘河庆、梁玉成,2023；何晶、李瑛琦,2024），就此形成了深刻的理论洞察。但事实上，算法不仅重塑了商业市场和劳动秩序，也重构了社会治理（张吉骥,2024；江小涓,2025），然而当前少有关于算法重构社会治理的研究，甚至专门针对国家公共部门算法应用的研究亦较少（Wenzelburger
    et al.,2024）。


    这里的研究生长点在于，国家和政府部门对算法的使用逻辑与已有研究普遍关注的平台经济和劳动过程领域的算法逻辑不同，至少存在三个重要区别。一是无法退出性。在社会治理场景下，作为治理对象的公众往往无法拒绝或者选择退出算法，无法像市场领域那样通过退出平台的方式避免算法的影响（Wenzelburger
    et al.,2024）。二是普遍的权力嵌入性。算法进入国家强制和再分配权力的中心，对社会公众的生活进行实质性干预，其影响不断扩大（Vogl et al.,2020）。三是有限透明性。警务部门虽然在不妨碍犯罪治理的情况下，可以采取适当措施提高算法的透明度，但无法阐明模型的确切规则。譬如，警察不需要解释为什么他们被分配到特定路口或区域。这是算法重构社会治理的核心特征。①
    然而，专门针对政府部门算法应用逻辑的研究相对较少，经验作品比较匮乏。考虑到算法在政府部门占据着独特的地位，其特殊的使用目的使得政府场景中的算法研究特别具有吸引力。本文关注的现实问题是：在政府推动社会治理过程中，算法如何重构社会治理，以及算法如何推动公共部门组织内部的权力边界重塑和外部的关系结构重组。


    要解答这一重要的经验问题，必须找到恰当的切入点，警务部门正是这样一个“棱镜”。在公共部门的算法实践过程中，警务部门的算法使用更具特殊性和典型性，其无法退出性、权力嵌入性和有限透明性的特征鲜明。究其原因，警务是一种国家干预，警务算法对公众的复杂影响相比其他领域更为突出（Wenzelburger
    et al.,2024）。特别是随着快速的技术发展和犯罪形式的变化，警务部门需要努力跟上最新的技术，因此，警务部门一直是实施人工智能算法最早，也是应用算法最广泛的公共部门之一（Meijer
    et al.,2021）。尽管存在经典的警察民族志研究，但是自从算法成为警务行动的重要组成部分以来，警务部门的算法应用尚未得到充分关注。当前，我们对算法在警务部门社会治理实践中的运用知之甚少。基于此，本文将研究问题进一步聚焦，专注从警务部门的算法运作来深入理解算法，力图揭示警务部门如何基于算法重构社会治理。我们对多个警务部门和多家平台企业进行了比较深入的访谈和参与式观察，从而对既有研究形成三个方面的补充。


    首先，从警务部门这一国家强制机构的视角去观察国家如何借助算法重构社会治理和维持良好的社会治安秩序。目前，针对公共部门算法的研究聚焦于两个方面。一是突出这些算法的专有方面，批评公共部门算法的不透明性、不公平性，在此基础上分析如何设计有效的监管机制以实现算法问责（Wessels,2024；Petrovič
    et al.,2025；王祥州、张成福,2024；孙源等,2024；魏远山,2024）。二是主要聚焦于公共部门如何使用算法进行决策，了解公共部门的决策者如何与算法进行互动（Alon-Barkat
    & Busuioc,2023；Kronblad et al.,2024；谭海波等,2025）。这些研究无疑具有深刻的理论洞见，其分析特色在于主要关注算法的技术特性如何影响政府管理和运作流程（Cordella
    & Gualdi,2025）。不过，这些研究聚焦于算法的“形式特征”，并未细致分析算法在政府场景中“实质使用”的逻辑。同时，既有研究缺少对算法在不同主体间关系和权力运作的深入分析。本文将从警务场景中深入挖掘这些细节，从而拓展公共部门的算法研究。


    其次，本文特别关注从警察的视角分析算法重构社会治理的影响。受“算法赋能论”（Buffat,2015）影响，当前研究的共识是，包括警务部门在内的公共部门的现有专业判断将通过算法得到强化。在既有研究看来，警务部门使用算法带来的最重要影响是促使警察的犯罪打击更为精准和有效（Brayne
    & Christin,2021；Egbert & Esposito,2024；Donatz-Fest,2024；Kirby & Pythian,2025；张全涛,2025）。然而较少研究认识到，更没有以实质性的细节捕捉到算法对社会治理影响的广度和深度。实质上，警务部门使用算法的影响已经超出了警务本身专业性的强化。警务算法的应用折射出国家在数智时代如何与公众打交道，以及在数字社会犯罪形式发生巨大变化时如何对“社会”进行重新分类和治理（Brayne,
    2020：127 – 133）。更重要的是，警务部门以算法重构社会治理的过程还带来了非预期的复杂影响。这有助于我们理解算法在实践中形成何种张力，从而深化对算法重构社会治理的经验认知和学理想象。


    最后，就现实意义而言，我们特别呼吁拉近算法技术与具体治理过程之间的距离，也即考察“书本上的算法”和“行动中的算法”之间的复杂关系。我们不仅需要关注商业领域的推荐算法，也要关注和聚焦政府领域的治理算法。而政府领域算法研究面临的关键议题就是如何在新兴的网络空间中重构一个国家的数字安全网（Lehdonvirta,
    2022:206 – 216）。这需要我们对算法重构社会治理这一重要议题进行系统的探索。本文的研究结果可以为国家公共部门（尤其是警务部门）在数字社会治理中引入、使用和实施算法提供新见解。


    ## 二、数字社会治理挑战与算法重构社会治理


    艾罗尔迪（Massimo Airoldi）在《机器惯习：迈向算法社会学》（Machine Habitus： Toward a Sociology of Algorithms）中指出，算法是一个模糊术语，因应用领域不同而内容各异（Airoldi,
    2022：7 – 9）。算法在最广泛意义上的定义是基于特定的计算将“输入数据”转换成“期望输出”的编码过程。而在数字社会治理中，算法并不是简单的执行代码或计算公式，而是能够观察其所在环境、对大规模数据进行学习，并根据所获得的见解提出决策的系统。这里的算法是庞大的相互依赖的复杂网络（Roehl
    & Crompvoets, 2025），并能够与社会现实进行高频互动。


    尽管算法对社会治理产生了重要影响，但经验研究特别是以警务为对象的经验研究并不多见。此类研究之所以较为匮乏，有两方面原因。一方面，算法应用大规模集中于经济和商业领域，随着公共部门算法应用的增长，有关讨论才开始涉及政府场景，相关分析仍较为欠缺。另一方面，算法在政府公共部门的应用具有特殊性，研究者较难进入相关场景，特别是研究者较难获得警务部门日常工作的深入定性资料。对此，我们迫切需要建构完整的分析框架。这一分析框架的关键在于，研究需立足于中国数字社会治理情境和犯罪形式的巨大变化，分析数字社会治理面临的多重挑战（向静林、艾云，2023；李友梅，2025），进而分析警务部门如何借助算法应对这些复杂挑战。总体来看，当前数字社会治理面临三重挑战。


    首先，大批量/弱影响的网络犯罪加剧传统社会治理方式的失灵。随着数字社会发展，犯罪结构发生重大变化（Curtis & Oxburgh, 2023），抢劫、盗窃等传统犯罪数量持续下降，以电信网络诈骗为代表的新型网络犯罪已经成为影响当前社会治安和人民群众财产安全的突出犯罪类型。网络犯罪大批量/弱影响的特征（许多案件虽涉案金额小，单次影响相对较弱，但累积危害大）与当前警务部门的小批量/强影响的治理逻辑形成鲜明对比。警务部门打击网络犯罪方面的工作量正在急速上升。缺乏资源是警务部门打击网络犯罪时面临的核心挑战之一，中国警察比较缺乏也是共识（杨志云，2019）。面对压倒性的案件数量和有限的治理资源，警务部门需要在更广泛的安全网络中发展新的关系，而不局限于传统警务所发展的警察与社会全体的合作关系。对寻求解决这些问题的警务部门来说，算法提供了调节和重塑关系的机会和可能（König,2020）。


    其次，数字社会涌现的治安和犯罪问题，不再能够简单地用物理边界加以界定，也无法被任何单一警种（如技侦、刑侦、网安等）控制。犯罪时空的高度延展性危害着社会秩序（Ferguson,
    2017：34 – 61）。赫伯特（Steve Hebert）指出，警察通常是在物理和领土空间中打击犯罪（Herbert, 1997：3 – 10）。而电信网络诈骗利用网络技术手段，通过远程、非接触等方式诈骗财物，其跨区域、链条化特征明显。网络犯罪分子可以在任何地方进行活动，警务部门很难有效追踪。电子数据成为非地域性的媒介，辖区等地域性的概念已不再适用。这需要重新定义对不同层级警务部门的治理权和相应管辖权的理解。进一步而言，数字社会的犯罪治理既非单纯地应对物理空间的犯罪问题，也非只打击网络空间的犯罪问题，而是面临物理空间与网络空间犯罪问题的叠加（单勇，2022）。特别是网络空间中收集、使用数据的不确定性，使得跨域、跨层级和跨警种的犯罪打击成为难题。


    最后，警务部门通过新技术手段应对数字社会犯罪问题的压力不断增加。网络犯罪的现实特征是，颠覆性技术的影响与犯罪的交织，使得犯罪分子利用客观技术差距进行网络犯罪的损害范围更广，而且更加难以预防（Brayne，2020：51
    - 73；刘艳红，2025；张全涛，2025）。犯罪分子采用由先进技术支持的新手段开展各种类型的网络犯罪活动。例如，有犯罪分子利用网络交易平台将作案手段“升级换代”，衍生出虚假的投资理财平台或外汇交易平台等新型诈骗手段。他们借助虚拟货币的去中心化、追溯难等特点隐藏身份，掩饰犯罪活动（Lusthaus，2024）。同时，新的加密通信技术和虚拟专用网络的使用，使得网络犯罪分子能够匿名化地进行联系。快速的技术发展要求警务部门努力跟上并采用最新技术，以便在物理空间和网络空间中全面感知网络犯罪的动态线索和痕迹。


    面对数字社会治理的现实压力，本文尝试建构以下分析思路。数字社会发展带来了三重治理挑战，对警务部门基于物理空间、专业警种的社会治理方式构成前所未有的冲击。在此情境下，警务部门通过算法运作解决一系列数字社会发展所带来的突出的社会问题。基于这一分析思路，本文将完成以下工作：首先，在大批量/弱影响的网络犯罪形式加剧警务治理资源紧张的背景下，分析算法如何实现对警务组织外部关系结构的重组；其次，观察算法如何促进警务部门内部的权力逻辑变化，以适应大量跨域、跨层级、跨警种的犯罪问题的涌现；最后，针对新兴技术对网络犯罪形式的加持，讨论算法如何进一步强化警务能力，实现警务力量从物理空间向网络空间的延展。后续分析将紧扣上述三个层面展开，完整呈现算法重构社会治理的内在逻辑。


    ## 三、研究方法与数据


    本文的经验材料来自于笔者及课题团队 2019—2024 年在我国南部 N 省和中部 M 省警务部门的实地研究（见表 1）。我们对两省 S 市、J 市、M 市、G
    市、D 市、Z 市等地的 12 个警务部门展开会议座谈、深度访谈和参与式观察，对部分城市进行不止一轮调研（遵循研究伦理，文中地名、人名等信息已进行匿名化处理）。在长时段的观察中，我们发现随着时间的推移，各级警务部门使用的算法数量持续增多，这些算法对数据体量的要求也逐渐增加。同时，警务内部对算法的使用也有着严格的规范，算法的设计和应用成为警务工作的重要部分。在实地调研中，田耿收集的资料包括治安、交警、网络安全、网警、情报、科技信息、技术侦查、巡警等方面的访谈资料。需要说明的是，不同警种由于专业知识和需求差异，并不会在同一时间采用同一种类型的算法，这也成为本文的分析优势所在，有利于我们观察算法在警务部门应用方面的差异。当然，在实地调研过程中，警务部门的受访者不太能够解释算法的细节，也不太能够解释它为什么会起作用，但他们能够解释算法应用的过程，以此形成有启发性的回答。


    表 1 本文使用的访谈资料来源


    | 调研主体 | 主要调研对象（职位） | 主要调研时段 |

    |---|---|---|

    | 警务部门 | 公安局局长、公安局副局长、情报大队长、网警大队长、网安大队长、治安大队长、巡警大队长、技侦支队大队长、公安局指挥中心主任和副主任、公安局指挥中心教导员、公安局指挥中心调度室主任、派出所所长和副所长、公安局大数据中心主任、公安局联合情报作战中心科长、网警大队技术主管
    | 2019 年 3—8 月；2020 年 5—7 月；2024 年 5—6 月 |

    | 平台企业 | 警务部门合作的平台企业的中高层管理者以及项目团队成员，包括平台企业总经理、业务部门主管、技术部门主管、平台企业项目团队负责人和团队成员 |
    2019 年 3—5 月；2023 年 9—12 月；2024 年 5—6 月 |

    | 风险算法工程师 | 与警务部门合作的平台企业的风险算法工程师、风险算法专家 | 2020 年 11—12 月；2023 年 10 月；2024 年 6—7
    月 |


    我们还访谈了与警务部门合作的五家大中型平台企业，包括 QB 公司（专注于公共安全领域、人工智能研发决策的私营平台企业）、JA 公司（涉及智慧交通和平安城市的私营平台企业）、SG
    公司（涉及警务智能平台建设的国有平台企业）、TU 公司（涉及反诈平台建设的国有平台企业）和 HA 公司（涉及智慧公安与区域公安管理平台建设的私营平台企业）。


    在警务部门主导的算法实践中，平台企业亦扮演着重要角色。这些平台企业设计了警务算法或警务平台。我们还重点访谈了与警务部门合作的平台企业的算法工程师。在某种程度上，现有的警务算法是算法工程师设计的产物。他们在算法流程中承担了相当重要的工作，专注于需要解决的社会问题，以及基于算法优化人工判断的效率和精准度。此外，我们还在警务部门与平台企业的项目合作会议上进行观察交流，以了解犯罪和非犯罪活动的数据是如何在不同机构共享的。同时，我们还收集了丰富的二手资料，通过收集相关工作文档，与一手资料形成三角互证。


    ## 四、算法重构社会治理的多重逻辑


    ### (一) 算法的关系结构逻辑：算法重塑社会治理的综合治理格局


    数字社会涌现的大批量/弱影响的网络犯罪使治理资源的问题进一步凸显，这是警务部门推进社会治理面临的重要问题。面对这一难题，警务部门借助算法把数字社会涌现的复杂社会问题转化为不同主体集体协调和互动的结果，显著地缓解了治理资源的不足。已有研究也指出，算法可以塑造多主体间的协调与合作，以数据化、连接性、自动化的形式重新设计各个主体之间的关联（König,2020）。警务部门借助算法把社会治理过程中所需的多个行动主体的资源更好地汇聚起来，这有效缓解了单一治理力量无法有效应对复杂网络犯罪的压力。


    我们在 N 省调研时，省级警务部门与 H 公司建立联合创新中心，依托 K 平台企业的认知智能实验室开展自然语言的研究和识别。警务部门全面引进大型平台企业的成熟平台和技术，在云计算、“AI
    +”视频、警务移动应用、智能交通和“情报 + 指挥”等领域联合开展项目共建。通过协作建立“线上线下 + 警企协同”合成作战新机制，N 省整合警务部门和平台企业的人才和能力，整合人流、车流、物流、信息流和资金流的数据，开创互联网侦查、违法犯罪和群体事件预警、大型安保风险防控、网络电子证据鉴定等警务新模式，构建“数据合成、资源合成、能力合成”的全新社会治理形态。N
    省警务部门引入六家平台企业的先进算法为全省民警的巡逻防控、侦查办案等业务警种提供新工具和新手段，利用以动态人像识别为主，以对车辆、无线网络、门禁、手机等的识别为辅的感知和采集手段，实现精准的布控设防。N
    省还明确提出打造“市场化”的情报资源调节模式，警务部门与大型平台企业建立了紧密的资源合作关系。


    全省着力建立和打造“市场化”的情报资源调节模式，就是充分运用和体现“互利共赢”的理念……深化与互联网企业的合作、加强警企合作开发联合创新应用；与最具实力的科技企业建立联合创新中心，共建、共享、共治、共赢；把警务外部的智慧、技术和能力融入到警务模式变革中，构成新的“警务基因组”。（访谈资料
    21060701，N 省公安某业务警种主任）


    上述访谈提及重新打造“警务基因组”，其隐蔽逻辑在于，算法对社会治理过程中多主体之间关系的重塑。兰博（Melayna Kay Lamb）指出，秩序对警察如此重要，它的本质是处理关系（Lamb，2024：123
    - 125）。然而，算法塑造的社会治理关系结构呈现更复杂的面向。传统的社会治理着眼于调整警察和社会之间的关系，社区警务就是最典型的代表。警察立足社区，动员社区居民参与社区治安风险防范工作，促进社区居民、网格员、志愿者等群防群治力量的合作。直到当下，依靠群众就地化解矛盾的“枫桥经验”以及创建“枫桥式公安派出所”的举措均表明，警察与社会关系是中国社会治理的关键环节，警察与社会主体之间的互动和合作不断强化。上述措施也是警务部门缓解资源不足，促进社会治理的有效手段。但算法对社会治理的重构在于，它在警务部门和市场主体之间的关系方面持续做增量，警务部门与平台企业的关系成为新时期警察打击网络犯罪、维护社会秩序的焦点。


    引进平台企业的算法是为了给我们解决数据的问题。办公办案，我们都用算法，然后进行分析，做到所有个人身份信息、所有案件都可以关联起来。不光局限在这个方面，社会的各类数据都可以有效关联。（访谈资料
    24061303，S 市公安局治安大队大队长）

