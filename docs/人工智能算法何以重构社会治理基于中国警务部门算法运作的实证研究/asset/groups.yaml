    警务与平台企业的合作创造了一种可迭代和延展的权力动态。警务部门不仅使用平台企业收集的各类数据，还可能使用平台企业的系统来存储、共享和分析数据。打击网络犯罪的先进技术需求和数据需求会刺激警务部门与平台企业的紧密合作（Afzal
    & Panagiotopoulos，2025）。当警务部门提出需求后，平台企业具体设计警务算法、数据共享系统、情报分析软件、数据集成平台等，供警务部门使用。平台企业也拥有促进警务算法训练的重要资源，包括物理资源（大型图形处理单元集群）、认知资源（尖端研究人员群体）和信息资源（用于数据测试的系统）等。


    这一定程度上改变了社会治理的底层逻辑。数字社会治理不只是以科层组织的层级权威为中心，而是把数据和算法作为数字社会治理过程中资源配置的关键节点。大量平台企业因掌握大规模的数据和算法，也参与到数字社会治理中，并扮演着重要角色（吕鹏等，2022）。算法逐渐促成“警—企—社”多元主体参与的社会治理格局。


    ### (二) 算法的权力收缩逻辑：算法集约化模式下的社会治理


    跨地域、非物理媒介的网络犯罪的兴起使得跨越组织边界促进多机构对话成为中国社会治理的突出特征。警务专业化和多警种的局限是，各警种囿于自身职能，较难进行系统思考（Ferguson，2017：162
    – 165），使得警务部门缺乏对社会治安的整体感知。一些警种的业务系统大多反映某一类或几类治安情况。不同警种对复杂案例轻重缓急的判断形成了警务组织内部的张力，特别是随着新兴网络犯罪的涌现，警务内部的张力更为突出（Giacomantonio，2015：101
    – 105）。我们在调研中发现，警务部门的“情报研判人员疲于应对各警种、各专班、各作战室提请的研判需求，被动接案情况突出”（访谈资料 19083002，D
    市公安分局局长）。因此，警务机制一方面“迫切需要联动”（访谈资料 19071602，M 市公安分局情报中心主任），另一方面强调整合，“市里一直想办法，怎么整合交警、网安、刑侦系统等，拧成一股劲”（访谈资料
    19032501，J 市公安局治安队长）。


    在这种情况下，警务部门的“算法集约化”现象正在广泛兴起。在警务部门内部，算法的相关要素（数据、模型、算力）逐渐向上级集聚，上级警务部门通过与平台企业合作，设定和提供必要的边界资源、标准接口和格式等要素（如算法类型、数据标记约定等）。基层警务部门大多负责采集数据，向上传输给市级和省级警务部门，由省级警务部门统筹各警种的数据。省级警务部门基于算法的输出结果传输给下一级警务部门及相应警种。由此，算法集约化促进大量各式各样的警种在数字社会治理中的共同协作。


    丰富的经验材料也表明了算法集约化的普遍兴起。我们在南部 N 省和中部 M 省的调研发现，N 省的警务部门牵头处理技侦、网安等各警种数据，建设全省统一的算法治理和服务体系，实现了多种算法的共存融合。省级警务部门提供算法服务、模型服务、数据接口、工具引擎、知识图谱、标签服务、时空大数据服务、自然语言处理等。M
    省的警务部门尝试在全省编织全时空的“人、地、物、事、组织”治安要素感知网。2025 年 M 省下辖的 F 县警务部门在重点区域、重点部位、重点场所实现视频监控的全覆盖，新增重点视频监控点位近万个。可以发现，算法串起了所有的警务环节，形成“省厅搭台、警种唱戏”的社会治理生态。


    算法是上层整合……省厅开发的大数据、算法模型，一个是警务便民服务，一个是打击涉毒、涉诈等各种类型犯罪的。涉及犯罪的资源数据我们都需要，你（省级警务部门）帮我做好端口、平台等，我使用就行。省里不仅要设计好这些可移动的警务平台，而且要把数据目录提供给全警种，基层提出申请要用哪类数据，整个推动公安的一网化。（访谈资料
    19071603，M 市公安分局局长）


    视频侦察、情报研判、网上追逃、异常案件处理对算法有很大的需求，大数据工程、算法建模发挥的作用越来越重要。通过它的深度研判，串起来所有的警务环节，就有了无限可能，可以做到服务全警种，这也是省里面一个很重要的创新。（访谈资料
    19071501，G 市公安局大数据中心主任）


    算法集约的过程也蕴含了更深层次的功能。算法集约化让省、市一级警务部门在犯罪打击乃至社会治理中更具权威性，促使他们高效地统合不同层级的治理资源，警务部门的协作性得到显著提升。这在很大程度上解决了打击网络犯罪面对的跨层次、跨地域和跨警种的难题。这也有助于理解为什么省级警务部门关注算法的设计研判，以及为什么警务部门比一般政府部门更常使用算法。在复杂案件需要警务内部协作时，上级警务部门可借助算法将相关部门力量整合起来。


    公安的算法还是不是不一样的，它需要适应社会的发展变化来打击犯罪……治安防控最重要的是怎么整合资源，尤其现在每天要收集可能上千条、上亿条数据，用不了可能就会变成“死数据”。所以从中央、省、市到下面的县、镇、村，包括我们民间的力量，都要在这个网络当中。算法需要织出一个网状的模式，这样才能把从上到下的问题处理了，然后中间层的这些治理问题都能尝试解决。（访谈资料
    24061202, S 市公安局副局长）


    乍一看，这一趋势似乎与已有研究关于警察的自由裁量权向警务科层组织的底部（基层警务部门）下放的判断相悖（Ericson & Haggerty，1997：31
    – 37；Chan，2001）。早期的社区警务兴起说明基层警务部门在物理空间上获得了大量的资源和裁量权，在社会治理中发挥重要作用。当下，随着警务迈向算法集约化，这种趋势在网络空间发生了显著逆转，即警务部门的自由裁量权（实际控制权）向上集中（见图
    1）。


    ![](img/6154a8c61605aca164499316b9ee5eb3_11_0.png)


    图 1 社会治理过程中警务部门的算法集约化


    另一方面，“基层警务部门多是收集数据”（访谈资料 19052004，G 县公安某派出所负责人），另一方面，“算法的设计和研判向市级特别是省级公安部门集中”（访谈资料
    24061502，S 市公安局网安大队大队长）。即便基层警务部门也有自设的一些算法模型，但这类算法并不是严格的警务预测算法：“很多基层公安也有自己的算法，但这个算法是已经有的警务系统里可以设置的，是基于这个系统要让它实现什么功能从而自定一些模型，自定筛选一些指标、数据。这种模型有时候也说是算法，但这里的模型和真正意义的算法其实不是一个东西”（访谈资料
    24061302，S 市公安局治安大队大队长）。Z 市 L 派出所的受访者指出：“我们使用的警情统计算法，是从警综系统抽取当周的报警数据，然后按照警情发生的地点和警情分类建立维度”（访谈资料
    19082402，Z 市 L 派出所所长）。当涉及更为复杂和精准的算法和平台时，基层警务部门大多需要向上级寻求权限，这对其日常管理和运作带来深远影响。


    治安基础管控信息化平台，这个是从省级层面上解决问题。对我们来说，包括重点人，包括技术管控，包括研判这一块，应该是从我们省级层面发力，不需要县区一级在这个方面去发力。（访谈资料
    24061302，S 市公安局治安大队大队长）


    面对数字社会犯罪形式的变化，基层公安在社会治理中的职能、角色和工作逻辑的转变尤为突出。按照 N 省 Z 市警务部门的说法，“全省要把信息采集纳入工作考评强势推动，力促刑侦、治安、派出所等一线警种及时采集打击防范的工作信息”。①
    省市一级警务部门基于一线警种采集的大量数据，通过算法进行研判以及控制数据权限。大量的警务平台权限集中于省市一级，这一过程促使基层警务部门在社会治理过程中常常需要寻求上级警务部门的权限支持，并将采集的数据纳入上级警务平台预定义的各类标签。


    因此，警务部门的算法集约化在中国社会治理实践中取得了良好的治理效能。在这一过程中，算法在警务的实践具有分层次的特征，即其在省、市、县区警务部门的应用逻辑表现出明显的差异性（见表
    2）。


    | | 省级警务算法实践（一阶算法） | 市级警务算法实践（二阶算法） | 基层警务算法实践（三阶算法） |

    |---|---|---|---|

    | 总体特点 | 算法作为统筹全省警务活动的关键 | 算法作为整合力量打击犯罪的关键 | 算法作为收集信息构建感知网的关键 |

    | 自由裁量权的程度 | 省域范围内警务部门的最高实际控制权，数据和算法的权限相对较高 | 自由裁量权适中，寻求上级数据和算法支持，向下反馈算法结果 | 自由裁量权降低，主要寻求上级警务部门的数据权限和算法支持
    |

    | 警务部门算法运作的功能逻辑 | 整合全省相关数据，对算法进行整体设计、研判并向下输出结果 | 向下推动资源采集和标准化，向上汇聚全省共性需求数据 | 对物理和网络空间的多重风险，数据信息等进行规模化感知
    |

    | 警务部门算法使用的基本特点 | 通过修改符号或复制、粘贴、删除代码块，定义算法的工作目标 | 可修改复制，主要是将相关情况纳入上级预定义的各类标签 |
    采集的数据全部纳入上级标签，可筛选数据或主题打造特色的模型系统 |


    某算法工程师指出，“基层公安和省里所用的算法是分层次的，一些更复杂的算法达到的效果和所需要的算力是不一样的，所以省里的算法算力达到的效果也不一样”（访谈资料
    24061403，S 市警务部门合作平台企业算法工程师）。之所以产生这种现象，根源在于以往犯罪问题主要集中在物理空间，基层警务部门维持社会秩序时，往往需要行使较大的自由裁量权。随着数字社会犯罪形式的变化，上级警务部门需要在网络空间中促进和协调多警种之间的合作，省市警务部门对各类数据、算法、平台的实际控制权有了更迫切的需要。此外，上级警务部门需要足够体量的数据进行算法训练和工作，而基层警务没有足够的数据建立强大的算法（Ferguson，2017：82）。因此，当算法被引入警务部门时，不同层级警务部门对算法的需求和认知有相当大的差异。


    ### （三）算法的空间扩张逻辑:算法驱动下的社会治理力量倍增


    算法还进一步拓宽了警务部门侦查执法的范围，极大促进了警察社会治理半径的扩大。在当前的警务工作中，预测性警务算法给警务部门的案件侦查和警务执行工作带来巨大变革。算法作为核心要素，直接参与警务部门的侦查、分析、研判等业务过程。譬如，当案件发生时，算法自动化数据采集程序通过整合多源信息，构建案件全息图谱，并自动解析文本信息，精准提取关键要素。通过行为模式分析，该程序为警务部门的侦查办案提供了方向指引。算法对海量数据信息的深入挖掘，为警务部门提供了更加精准和有效的执法决策支持（王禄生，2024）。警务部门的执法模式从以“经验观察案件”为中心逐渐转变为以“算法研判数据”为中心。


    基于算法的数据收集和处理方式的转变，使得警务部门对更大范围的人、事、地、物进行治理成为可能。随着可用数据的规模、范围比以往任何时候都大，警务部门借助算法实现了对风险更全面的感知。这种转变可称为“警务的超级化”（Brayne,2020：13
    – 29），即从原来的对人、事、地、物等的重点防控，转变为“对所有风险、隐患、苗头和问题的全面防范”（访谈资料 19083001，D 市 H 分局副局长）。当然，这不意味着传统“重点防控”手段的消失。相反，重点防控借助算法变得更加精准。在我们的访谈中，算法工程师指出了治安算法的设计逻辑。


    治安算法的设计思路之一就是覆盖面要广，覆盖面要大。再一个就是人脸还有车辆的识别，需要清晰度高。很多摄像头识别的数据，我们只要求看到的范围广就行了。我们一些专业化采集人脸和车牌数据的，因为要求采集精度高，所以有些设备拍到的视角相对来说比较窄，不能像拍普通车辆那样范围比较大。（访谈资料
    24061402，S 市警务部门合作平台企业算法工程师 J 先生）


    警务部门合作平台企业的算法工程师进一步指出了为什么警务部门的治安预测算法需要通过大量数据来实现算法预测的精准化。


    说白了，算法的逻辑就是用量变推动质变，比如比对不是拍一张，你要多拍然后再进行比对，然后才能聚类，因为每个人每次走路都不一样，化妆打扮，戴个帽子，都不一定能拍到准确的脸，只有在不同地方、不同时段多拍……不同时间段阳光照在身上，出来的阴影都不一样。光线比较暗，比对准确性只有百分之
    X，拍的正面的，这个准确性能提高到百分之 Y。（访谈资料 24061403，S 市警务部门合作平台企业算法工程师 C 先生）


    治安算法的这种全面扩张的逻辑还体现在，警务部门基于特定算法将离散的、基于点的犯罪数据转换为更大的、基于网格的区域。根据各类数据分配警察资源和警务力量的地点可被称为“热点”（hotspot），即“特定尺度
    × 特定尺度”的不规则区域，在实践中表现为重点区域（由有经验的警察划定）或高风险区域（由算法根据既有数据划定）。一些算法的输出常常采用网格的形式，将大量数据输入转换为犯罪可能性较高的区域或是潜在风险较高的区域。这里出现的反常识问题在于，将基于点的犯罪数据转换为基于网格的概率分布，会导致犯罪预测分辨率（或精准度）的损失，而预测分辨率对警务部门的社会治理却相当重要。


    警务部门之所以采取这种做法，有两个重要原因。一方面，转换为基于网格的概率分布可以确保算法犯罪预测不必非常精确，然后辅之以警务部门的经验认识和直觉判断。如果算法将基于点的犯罪数据转换为基于点的犯罪预测，那么当犯罪事实没有发生在预测的点上时，算法的判断就可能出现故障。因此，分辨率的丧失虽然使算法预测的结果表面上显得不够精确，但这恰恰并不容易引起算法失灵（Brayne,
    2017）。另一方面，采用网格的形式输出算法结果也提升了警力与警情的匹配度。网格可以将物理空间的犯罪事件简化为网络空间上的“点”或“区域”，降低了相应犯罪事件的复杂性，提高了警务工作人员分配的效率。我们在
    M 省 S 市调研时就发现，情报指挥部门依托算法开展指挥调度，充分利用各类智能警务平台（警务算法是其运行核心），动态地研判治安形势，以保障将警力投放到重点区域、重点部位、重点场所和重点时段。


    实地调研发现，从“点”到“面”再到无数个面构成的“网格化”均体现了社会治理思维的变化。警务部门能够在数字社会更好地实现全面的犯罪控制，也是得益于算法所带来的可能性。不仅如此，警务力量还从地面扩展到空中，警用无人机使用的“地理信息算法”常被视为地面警务的“力量倍增器”。我们在中部
    S 市公安局调研时，治安大队的负责人就指出，警用地理信息算法有助于“实现空地一体、效能倍增，有效解决传统视角盲区”（访谈资料 24061202，S 市公安局治安大队大队长）。


    这类警务算法进一步赋予了警察“远程行动”的能力，使其能在远处行使警察权力。


    ### （四）小结：算法何以重构社会治理


    上述讨论总结了算法重构社会治理的经验逻辑。一方面，随着数字社会犯罪结构发生变化，算法在广泛的社会安全网中不断参与和发展新的关系，而不再仅仅局限于传统警务发展的社区、公众关系。警务部门与平台企业的合作也成为重构社会治理的焦点。另一方面，新兴的网络犯罪问题无法被任何单一警种治理。算法实现了对警务组织内部资源的统筹协调，数据算法资源向上级收拢，上、中、下层的警务力量得以实现整体性的权力重构和边界重组。此外，新技术的发展使得网络犯罪的危害更加突出，算法拓宽了警务部门可以追踪的范围，实现了对物理空间和网络空间中所有风险要素的感知，警务力量倍增。


    表 3 呈现了人工智能算法重构社会治理的基本逻辑。表中三重机制的内在关系在于，算法对关系结构的重塑注重在横向上调整多主体的关系，借助算法搭建的桥梁，为各主体构建共识、交换资源提供重要基础。


    但这一机制无法解决内部存在专业分工的警务部门在应对复杂网络犯罪问题时的无力问题。在此基础上，算法的权力收缩逻辑弥补了这关键的一环，在纵向上调整警务内部的多层级、多警种关系，缓解内部权力层次的碰撞。这样，通过关系结构和权力结构的调整，算法有效整合了多方主体和资源。在此情况下，算法的空间扩张逻辑进一步使得警务部门能够将这套治理方式从物理空间不断向网络空间延伸，使得警务部门对风险的感知能力迅速提升。在这三重机制的共同作用下，警务组织内外部的多主体之间形成了更强的信任意识和合作共识，通过改善警务部门与平台企业的关系、优化警务组织内部的权力架构、提高算法在多重空间的治理效力等途径，形成动态应对数字社会治理挑战的治理能力。


    表3 算法重构社会治理的基本逻辑


    | 数字社会治理的多重治理挑战 | 内在逻辑 | 主要表现 | 长远影响 |

    | --- | --- | --- | --- |

    | 大批量/弱影响的网络犯罪加剧治理资源的不足 | 算法的关系结构逻辑 改变横向的“警—企—社”关系结构 | 在警务部门外部促进市场主体在治理中发挥重要作用
    | 推动警务部门、平台企业的关系重塑 |

    | 跨地域、非物理媒介的网络犯罪兴起带来诸多跨界问题 | 算法的权力收缩逻辑 改变纵向的警务组织权力边界 | 在警务部门内部基于算法推动治理资源向上集中 |
    推动跨域、跨层级、跨警种的边界重塑 |

    | 颠覆性技术的出现使得数字社会治理压力不断增加 | 算法的空间扩张逻辑 促进警务力量在多重空间扩展 | 在警务部门内外部基于算法实现对风险的全面感知 |
    推动警务强化对风险的动态治理能力 |


    需要注意的是，这三重机制在不同警务部门的影响是不同的。在省市级警务部门中，算法的关系结构和权力收缩逻辑更为明显，而基层警务部门更着重于算法的空间扩张。一方面，算法发挥作用所需的大规模数据的特点决定了省级警务部门能够发挥关系和权力机制的作用。省级警务部门的层级较高且资源丰富，而基层警务部门层级较低，掌握的数据规模较小。基层警务部门算法所发挥的作用更多表现为算法驱动的空间扩展。另一方面，从实际治理需求来看，为应对数字社会治理挑战，中央和省级警务部门开始注重社会治理过程中的控制性和整合性（向静林、艾云，2023）。因此，省级警务部门也更多地借助算法来扩展关系结构和集中治理权力。正是从这个角度看，算法重构社会治理的过程更强调上级和基层之间、警务部门内部和外部之间的“协同用力”，而算法就是实现这种协同的重要支点。


    ## 五、算法重构社会治理的结果


    上述变化对警务部门的社会治理有何深层影响？我们认为，算法作为社会治理的关键驱动机制也存在着潜在风险，警务部门的算法运作会带来实施成本和非预期后果。


    ### （一）算法蕴含的“权力冲突”限制社会问题的解决范畴


    警务部门对算法的依赖与原有科层结构形成冲突。对基层警务部门而言，其应对和处理犯罪方面的经验感知和空间记忆能力逐渐被算法替代。基层警务部门的工作转变为收集数据和风险预防，并按照上级的算法输出结果开展警务活动。由于算法常常被视为一种权威和科学，基层警务部门的隐性知识和经验直觉在算法扩张中逐渐弱化。由此，警务部门实施的算法作为一种事实上的替代品，取代了其他更广泛的解决社会问题的方法（Kennedy
    et al., 2018: 19），限制或缩小了基层警务部门可以解决的社会问题类型（如网络诈骗案件或刑事犯罪案件侦查权的上移）和能够考虑的解决方案范畴（如大规模警务数据信息的处置权上移）。原有社会治理机制发挥作用的双重基础——警务部门的专业知识和问责制被削弱（Busuioc,
    2021）。基层警务部门花费相对较少的时间练习和发展他们的演绎推理技能，警察的经验知识也随之减少。我们在 D 市警务部门访谈时，市公安指挥中心的一位受访者指出：


    以前公安队伍对人的素质要求不是很高，破案办案更多是靠传帮带，就是老民警带新民警。这里的“带”主要体现在公安长期的经验推理能力……哪怕写材料水平低也不要紧，会办什么案，问的什么话，能推理出来才重要。但现在
    AI 算法、大数据的使用，需要的（警察）条件更高。掌握新技术的警察成了最稀缺的资源。过去处理案子可能十天、半个月、一个月、两个月，现在可能是三天、五天、八小时破案，这对警察的要求，特别是如何对大规模数据抽丝剥茧，要求很高。（访谈资料
    24051301，D 市公安局指挥中心负责人）


    对上述过程的进一步深究揭示出算法在数字社会治理中的一个不容忽略的问题：算法成为重构社会治理的关键，不仅重新规定了网络空间中的秩序，使得省市警务部门在数字社会治理中的权力得到提升，跨层级警务部门的协同性显著增强，还带来了不同层级警务部门的知识和权力结构冲突的潜在结果。西方语境下的“监控资本主义”理论指出，大规模数据的收集催生出一种新的工具主义的权力形式，它可能在不同主体间形

    '
  mdcn: '

    警务与平台企业的合作创造了一种可迭代和延展的权力动态。警务部门不仅使用平台企业收集的各类数据，还可能使用平台企业的系统来存储、共享和分析数据。打击网络犯罪的先进技术需求和数据需求会刺激警务部门与平台企业的紧密合作（Afzal
    & Panagiotopoulos，2025）。当警务部门提出需求后，平台企业具体设计警务算法、数据共享系统、情报分析软件、数据集成平台等，供警务部门使用。平台企业也拥有促进警务算法训练的重要资源，包括物理资源（大型图形处理单元集群）、认知资源（尖端研究人员群体）和信息资源（用于数据测试的系统）等。


    这一定程度上改变了社会治理的底层逻辑。数字社会治理不只是以科层组织的层级权威为中心，而是把数据和算法作为数字社会治理过程中资源配置的关键节点。大量平台企业因掌握大规模的数据和算法，也参与到数字社会治理中，并扮演着重要角色（吕鹏等，2022）。算法逐渐促成“警—企—社”多元主体参与的社会治理格局。


    ### (二) 算法的权力收缩逻辑：算法集约化模式下的社会治理


    跨地域、非物理媒介的网络犯罪的兴起使得跨越组织边界促进多机构对话成为中国社会治理的突出特征。警务专业化和多警种的局限是，各警种囿于自身职能，较难进行系统思考（Ferguson，2017：162
    – 165），使得警务部门缺乏对社会治安的整体感知。一些警种的业务系统大多反映某一类或几类治安情况。不同警种对复杂案例轻重缓急的判断形成了警务组织内部的张力，特别是随着新兴网络犯罪的涌现，警务内部的张力更为突出（Giacomantonio，2015：101
    – 105）。我们在调研中发现，警务部门的“情报研判人员疲于应对各警种、各专班、各作战室提请的研判需求，被动接案情况突出”（访谈资料 19083002，D
    市公安分局局长）。因此，警务机制一方面“迫切需要联动”（访谈资料 19071602，M 市公安分局情报中心主任），另一方面强调整合，“市里一直想办法，怎么整合交警、网安、刑侦系统等，拧成一股劲”（访谈资料
    19032501，J 市公安局治安队长）。


    在这种情况下，警务部门的“算法集约化”现象正在广泛兴起。在警务部门内部，算法的相关要素（数据、模型、算力）逐渐向上级集聚，上级警务部门通过与平台企业合作，设定和提供必要的边界资源、标准接口和格式等要素（如算法类型、数据标记约定等）。基层警务部门大多负责采集数据，向上传输给市级和省级警务部门，由省级警务部门统筹各警种的数据。省级警务部门基于算法的输出结果传输给下一级警务部门及相应警种。由此，算法集约化促进大量各式各样的警种在数字社会治理中的共同协作。


    丰富的经验材料也表明了算法集约化的普遍兴起。我们在南部 N 省和中部 M 省的调研发现，N 省的警务部门牵头处理技侦、网安等各警种数据，建设全省统一的算法治理和服务体系，实现了多种算法的共存融合。省级警务部门提供算法服务、模型服务、数据接口、工具引擎、知识图谱、标签服务、时空大数据服务、自然语言处理等。M
    省的警务部门尝试在全省编织全时空的“人、地、物、事、组织”治安要素感知网。2025 年 M 省下辖的 F 县警务部门在重点区域、重点部位、重点场所实现视频监控的全覆盖，新增重点视频监控点位近万个。可以发现，算法串起了所有的警务环节，形成“省厅搭台、警种唱戏”的社会治理生态。


    算法是上层整合……省厅开发的大数据、算法模型，一个是警务便民服务，一个是打击涉毒、涉诈等各种类型犯罪的。涉及犯罪的资源数据我们都需要，你（省级警务部门）帮我做好端口、平台等，我使用就行。省里不仅要设计好这些可移动的警务平台，而且要把数据目录提供给全警种，基层提出申请要用哪类数据，整个推动公安的一网化。（访谈资料
    19071603，M 市公安分局局长）


    视频侦察、情报研判、网上追逃、异常案件处理对算法有很大的需求，大数据工程、算法建模发挥的作用越来越重要。通过它的深度研判，串起来所有的警务环节，就有了无限可能，可以做到服务全警种，这也是省里面一个很重要的创新。（访谈资料
    19071501，G 市公安局大数据中心主任）


    算法集约的过程也蕴含了更深层次的功能。算法集约化让省、市一级警务部门在犯罪打击乃至社会治理中更具权威性，促使他们高效地统合不同层级的治理资源，警务部门的协作性得到显著提升。这在很大程度上解决了打击网络犯罪面对的跨层次、跨地域和跨警种的难题。这也有助于理解为什么省级警务部门关注算法的设计研判，以及为什么警务部门比一般政府部门更常使用算法。在复杂案件需要警务内部协作时，上级警务部门可借助算法将相关部门力量整合起来。


    公安的算法还是不是不一样的，它需要适应社会的发展变化来打击犯罪……治安防控最重要的是怎么整合资源，尤其现在每天要收集可能上千条、上亿条数据，用不了可能就会变成“死数据”。所以从中央、省、市到下面的县、镇、村，包括我们民间的力量，都要在这个网络当中。算法需要织出一个网状的模式，这样才能把从上到下的问题处理了，然后中间层的这些治理问题都能尝试解决。（访谈资料
    24061202, S 市公安局副局长）


    乍一看，这一趋势似乎与已有研究关于警察的自由裁量权向警务科层组织的底部（基层警务部门）下放的判断相悖（Ericson & Haggerty，1997：31
    – 37；Chan，2001）。早期的社区警务兴起说明基层警务部门在物理空间上获得了大量的资源和裁量权，在社会治理中发挥重要作用。当下，随着警务迈向算法集约化，这种趋势在网络空间发生了显著逆转，即警务部门的自由裁量权（实际控制权）向上集中（见图
    1）。


