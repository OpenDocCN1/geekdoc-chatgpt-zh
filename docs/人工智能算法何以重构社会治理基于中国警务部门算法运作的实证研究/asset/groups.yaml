    省里一直在做，但问题是就算想给省里改，也没办法改，而且有时候省里吃老本，不能及时给基层提供好的东西，比如新的算法应用……当时有科技公司来送的时候，我们想跟这些公司合作，想着省里做省里的，我做我的平台，然后再把数据反馈给省里，上边不同意。（访谈资料
    24061201，S 市公安局情报大队大队长）


    不仅如此，围绕算法的设计和应用，警务部门与平台企业之间也存在着知识与权力的冲突。平台企业及其算法工程师更关心他们设计的算法是否在某些时候被证明是正确的，是否足够好，而不是广泛的公共利益盲点问题。访谈中我们发现，警务部门的代表会向平台企业的代表询问他们的算法模型、平台系统如何帮助警方实现特定目标。但平台企业项目负责人表述的逻辑则不同，他们会演示其设计的平台算法在非警务环境中（譬如大数据部门、行政审批部门等）的使用，然后询问警务部门是否对在当地环境中使用类似算法模型感兴趣，以及该平台公司的算法相对于其他公司算法的优势。换言之，平台企业的主要目标不是填补警务部门发现的技术空白，而是销售利润丰厚的产品和系统。警务部门的受访者提出近似的观点。


    之前市局做的规划加起来有 278 万元，但这几年没感觉发挥什么特别好的、实际的作用……很多时候，我们在跟公司合作过程中发现，他们大都还是关注能挣多少钱之类的，却没有把事情做到实处。（访谈资料
    19032801，J 市公安局局长）


    ### (二)算法对社会问题的“信息过滤”转化为优先排序


    仔细审视算法塑造下的社会治理，可以发现，警务部门对算法性能的主要评估标准是“预测精度”，即预测犯罪的精准度。出于这一目的，警务部门需要更多数据来训练算法以提高预测的精准度。这与一般算法有明显的差异性。以网约车平台为例，商业领域算法的主要目的是帮助司机高效、便捷地抵达目的地，无助于达到这一目的的其他信息都可被淡化和隐去（徐婧、王婧涵，2024）。社会治理领域的算法恰恰相反——为了实现精准预测，所有数据和信息的收集成为警务工作的核心。N
    省《建设全省公安机关数据采集共享长效机制工作方案》就提出要组织各警种、各地市开展数据采集，并向各警种、各地市下达 79 项采集任务。多位受访者均指出警务部门对数据的高需求。


    > 公安精准度必须很高，不像普通算法的精度不需要那么高，公安办案的话，人的识别必须要精准，要是不精准的话，说白了就会做很多的无用功……比如有一个比对阈值，普通情况下这个阈值可以调到
    50%，只要有相似的，都可以看看，而这个系统基本上要达到 90%、95% 以上，这需要大量数据去喂。（访谈资料 24061401，S 市警务部门合作平台企业算法工程师
    J 先生）


    > 治安管理、犯罪打击这一块，公安应该考虑到方方面面，事前事后，越全面越细致越好。要达到这样的程度必须获得各种各样的数据信息。（访谈资料 24061302，S
    市公安局治安大队副队长）


    有研究指出，治安太复杂，警察无法也不能把治安简化为算法能够完美解决的事务（McDaniel & Pease, 2021: 24–25）。但为了获取精准的预测结果，警务部门需获取大量信息，这使其在社会治理过程中遭遇信息和数据过剩的困境。由此带来的问题是，算法在警务领域的扩展使现有的工作量在一定程度上超出了可管理的范围。例如，法医依赖犯罪现场提供的信息来处理犯罪案件，早期
    DNA 技术的出现使得法医过去可在八小时内完成的犯罪现场勘察后来需时一个星期以上，因为他们需要开展更多的犯罪细节和数据的勘察印证（Giacomantonio,
    2015: 75）。算法重构社会治理的逻辑也有近似的影响。我们在访谈中常常听到基层警务人员提到这样一个观点：他们的角色已经变成“数据录入人员”。


    这是我们搞警务智能化的基础，数据的采集这块，只靠人力是根本行不通的，动不动就发动基层干警去做信息采集的工作，那本职工作都做不了。（访谈资料 19032801，J
    市公安局局长）


    相较于以往警务部门社会治理依托的“苞壳法”（bud-shell method），即依靠警察的犯罪打击经验和直觉处理社会问题的模式（见图 2），算法驱动的警务使得基层警务人员除了完成日常任务外，还必须成为“数据输入专家”。对他们来说，可能有
    80% 的工作时间都要花在收集和整理数据上。规模化的数据收集使警察的工作变得比以往复杂得多。在数据增加和信息过剩的情况下，不受限制地使用警务算法不仅会加大警务部门的工作量，而且容易使算法转变为各种形式的优先排序和刻板印象。这些算法会与不起作用的干预措施联系在一起，使得警务部门的一些算法应用缺乏建设性和实用性。


    (a) 传统社会治理方式（苞壳法）    (b) 算法驱动的社会治理（算法集约化）


    ![](img/6154a8c61605aca164499316b9ee5eb3_21_0.png)


    注：白色柱表示不同警种，黑色柱表示警务自由裁量权的重心。


    图 2 警务部门社会治理方式的结构性转变


    我们在 N 省和 M 省警务部门调研时，基层警务部门的负责人就指出，有时候使用算法模型的价值在于提升他们与上级警务部门和公众打交道时的“形象”，即表明该局的警务工作对数字社会犯罪形式的适应和新技术的采用：“我们时间不多，可以先做几个数字派出所的试点，大数据算法模型，这些东西拿得出去，亮点就出来了”（访谈资料
    19032803，J 市公安局局长）。警务部门的犯罪打击成效被转化为拥有多大体量的数据和复杂程度不同的算法。一些数据及在此基础上的算法输出也具有较强的迟滞性。在
    N 省，省厅资源服务平台部分基础数据无法实现实时更新。全省警务地理信息系统的地图数据滞后于社会实际使用的地图数据两年以上。基于迟滞性的数据所开发的警务算法除了将人的行为和场所转化为粗糙的数据点之外，能发挥的作用有限，其在警务实践中容易转变成技术先进性的代名词。


    ## 六、结论与讨论


    在新的研究场景，立足警务部门算法实践，本文力图回应的问题是：算法的广泛应用给国家的社会治理带来何种新的可能？本文的整体判断是：相对于传统的社会治理方式，算法已经成为新的社会治理中枢，可以有效应对数字社会治理涌现的多重挑战。警务部门与平台企业的合作形成了“警察—平台企业—社会”的多元关系结构。省级警务部门通过构建算法集约化模式，建立起覆盖人、事、地、物，从地面到空中的算法综合治理体系，并越来越依靠算法实现警务力量从物理空间向网络空间的全面延伸。由此，警务部门基于算法的数字治理实践显示出了突出的治理效力。


    进一步而言，算法在警务部门的集约化过程本身是算法对治理权的集中控制。既有的“算法科层制”研究富有洞察力地指出，公共部门的算法应用表现出其对数字治理权的控制与集中（吴进进、何包钢，2023）。然而，本文对警务部门的细致经验研究在呼应这一观点的同时，也发现了不同之处。警务部门依托算法重构社会治理的过程中，产生了明显的“分层效应”，算法在不同层级警务部门中的使用及功能逻辑存在差异，这进一步影响了各级警务部门的权力运作逻辑。这些变化可能会产生意想不到的结果。在算法的使用逻辑方面，省级警务部门主要负责对算法进行整体设计和研判，将算法生成的结果向下反馈。市级警务部门主要基于算法对不同类型的犯罪问题展开“合成作战”，运用算法为案件侦查提供重要的资源和技术支持。基层警务部门则关注数据的收集、算法结果的执行以及风险的预防。这背后的权力差异在于，中央和省级警务部门更关注如何借助算法在警务内部实现治理权（包括数据权、算法权和平台权）的集中，以及在警务组织外部塑造分布式的治理权力（平台企业成为社会治理的重要一环）。基层警务部门在算法集约化过程中的治理权减少，基层隐性知识和“街头智慧”的地位降低（Brayne
    & Christin, 2021）。


    不仅如此，不同层级警务部门对算法使用的分层效应还有一个隐蔽的伴生变化，即算法对同一层级警务部门的不同警种也产生了差异化影响。掌握更丰富算法模型和更大规模数据的警种往往会成为警务部门运作的关键节点，更容易形成新的权力集中。并且，在算法的技术特性（比如及时性、可重复性等）的加持下，这些业务警种拥有的治理权力会变得越来越大。我们在
    N 省和 M 省调研时，受访者分别指出网络安全或科技信息等警种得益于其掌握的算法资源和规模化数据资源，在案件侦办、风险研判中扮演着重要角色。警务部门以算法破除不同警种之间的物理壁垒，最终形成以算法为中心、多警种配合的治理新生态。


    中国社会治理过程中涌现的这些现象并不仅仅局限于警务领域，因此，本文的发现在其他领域亦具有理论解释力。首先，算法在重构社会治理过程中形成的警察—平台企业—社会的多元治理结构，本质上是应对网络犯罪形式变化带来的治理资源短缺和协作能力不足的产物。我们可以在数字公共服务领域发现类似的现象。为回应社会需求的普遍增长，国家层面积极引导，形成政府—平台企业—社会共同构成的公共服务生态网络（宋锴业、徐雅倩，2025）。平台企业在公共服务和社会治理过程中都是重要的组成部分（吕鹏等，2022）。其次，鲁肯斯坦（Minna
    Ruckstein）指出，包括警务部门在内的国家行政系统的“视觉功能”（努力使其社会公众被解读）是自上而下的、整体的，而不是分布式的、灵活的（Ruckenstein,
    2023: 141）。算法的新颖之处在于，上级警务部门可以借助算法及其收集的大量数据，实时地对社会进行分布式观察，对影响社会秩序的风险源头进行全面观察和感知。这一过程在数据管理等部门的工作中亦是如此，只是数据管理部门更注重对公众需求的感知乃至“未诉先知”。


    “大平台”“大算法”和“大数据”的建设已经成为国家治理、社会治理过程中的新趋势。我们通过长期实地调查发现，这里的“大”已经远远超出了“规模”的范畴，而是内在蕴含着国家面对数字社会的巨大变化时，对警务部门的社会治理方式进行的具有前瞻性的调整。研究者对这种特殊而普遍的治理现象进行分析时，既要关注已经被大量研究强调的数据、算法、平台本身的透明度、公平性等技术议题，更要关注它们在警务部门等公共部门运行中涉及的更深层次的关系、权力和空间逻辑变化。更重要的是，从关系或权力维度观察警察的工作为我们打开一扇窗户，让我们看到反复出现的“问题/议题”是由算法这一尚未被深入认识的系统性力量造成的。算法等尖端科技不可阻挡的力量与社会治理之间的适配感或冲突感，往往会更多地出现在警务部门的工作中。沿着上述思路，未来的研究需要更多关注国家公共部门应用算法的差异化逻辑，这一议题值得进一步追问和思考。


