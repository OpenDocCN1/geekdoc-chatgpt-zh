    #### 2. LTE-V2X 技术的架构说明


    `LTE-V2X`的网络架构\[20-21\]如图 3.2 所示，`LTE-V2X`的网络架构接口说明如表 3.2\[22\]所示。在`LTE-V2X`网络架构中，主要功能实体如下。


    ![](img/txt003_4.jpg "pagenumber_ebook=66,pagenumber_book=56")


    图 3.2　`LTE-V2X`的网络架构\[20\]


    `V2X`应用服务器：位于蜂窝网之外的`V2X`管理实体，提供对全局`V2X`通信的策略和参数的管理功能，以及对`V2X`终端的签约信息和鉴权信息的管理功能。


    归属签约用户服务器（`Home Subscriber Server`，`HSS`）：是一个中央数据库，可用于存储`V2X`通信中与用户相关的信息以及与订阅相关的信息，实现移动性管理、会话建立、用户认证和访问授权等功能。


    移动性管理实体（`Mobility Management Entity`，`MME`）：主要负责`V2X`通信中的移动性管理和控制，具有用户的鉴权、寻呼、位置更新和切换等功能。


    服务网关（`Serving Gateway`，`SGW`）：主要负责`V2X`通信中上下文会话的管理和数据包的路由和转发，相当于数据中转站。


    数据网关（`Packet Data Network Gateway`，`PGW`）：主要负责连接到外部网络、会话管理和承载控制等功能。


    `V2X`控制功能（`V2X Control Function`，`VCF`）：对`UE`进行`PC5`/`LTE-Uu`的`V2X`传输参数的配制管理。


    `LTE`无线接入网：不同于核心网负责业务的处理，接入网主要负责用户的接入，对于所接入的业务提供承载能力。


    `UE`：根据获取的`V2X`通信的策略和参数配置信息，在`PC5`或者`Uu`接口上进行`V2X`通信。


