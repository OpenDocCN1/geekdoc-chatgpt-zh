    ## 激光雷达系统工作原理


    激光雷达发射系统主要负责向障碍物发射激光脉冲；接收系统主要负责接收经障碍物反射回来的激光信息，将其聚焦到光电探测器，并准确地测量光脉冲从发射到被反射回来的传播时间；信号采集处理系统主要负责处理接收回来的信号杆并使之能够符合下一级系统的要求，这是激光雷达系统最关键的环节，直接影响激光雷达系统的测量精度；控制系统的主要作用是提供信号并且对接收回来的信号进行数据处理，结合激光器的高度、扫描角度，位置和发射方向，可以准确地计算出每一个光斑的坐标`X`、`Y`、`Z`，通过脉冲激光不断地扫描目标，可得到全部目标点数据，进行图像处理后得到精确三维立体图像。以Velodyne的32线激光雷达为例，它把32个激光发射器垂直堆叠在一起，在旋转电机的带动下，使整个单元以秒为单位旋转多次。通过不断旋转激光发射器，将激光点变成线，并在竖直方向上排布多束激光发射器形成面，达到3D扫描并接收信息的目的。


    ## 4）激光雷达的应用


    ### ① 点云物体检测


    点云物体检测\[12\]。物体检测在深度学习没有快速发展之前常用聚类的方式，但是很难做动静态分离。要实现安全的自动驾驶，就必须检测到周围在移动的物体，并且准确地知道它们相对于车的距离。随着深度学习技术的发展，点云物体检测也更多地使用深度学习，甚至在室内机器人领域还有人做基于点云的实例分割。


    ### ② 即时定位与地图构建（Simultaneous Localization and Mapping，`SLAM`）


    `SLAM`和物体检测是激光雷达在自动驾驶领域很重要的两个应用，而`SLAM`的主要作用就是建图和定位，目前来看自动驾驶很难脱离高精地图工作，建图过程又涉及很多的点云拼接、动态补偿等工作，是建spare/dense还是多层次的图也值得考虑，定位过程又包括特征匹配等工作。`SLAM`主要分为视觉`SLAM`和激光`SLAM`，有时建图的过程同时包含了视觉和点云的特征。


    ## 2.2.4 视觉传感器


    视觉传感器分为前视摄像头和环视摄像头。前视摄像头有单目、双目和三目之分，主要应用于中远距离场景，能识别清晰的车道线、交通标志、障碍物、行人，而且需要复杂的算法支持，对处理器的要求也比较高；环视摄像头主要应用于短距离场景，可识别障碍物，技术成熟，价格低廉。视觉传感器一般对光照、天气等外在条件都很敏感。


    ### 1）视觉传感器的定义


    视觉传感器是指利用光学元件和成像装置获取外部环境图像信息的仪器。车载视觉传感器（摄像头）用来模拟人眼，通过对采集的图片或视频进行处理获得相应场景的三维信息，以此来解决物体的识别、物体形状与方位的确认、物体运动轨迹的判断等问题，进一步了解外界的环境和控制车辆自身的运动。通常用图像分辨率来描述视觉传感器的性能。视觉传感器的精度不仅与分辨率有关，还与被测物体的检测距离相关。被测物体的检测距离越远，其绝对的位置精度越差。


    车载视觉传感器按照镜头数目主要分为单目摄像头、双目摄像头、三目摄像头和环视摄像头。


    #### （1）单目摄像头


    如图2.8所示，单目摄像头一般只能获取二维图像，用于探测汽车前方环境，识别道路、车辆、行人等。由于单目摄像头的成像图是透视图，即越远的物体成像越小，同样大小的物体，在近处时需要用大量的像素点描述，在远处时可能只需要用几个像素点描述，因此对单目摄像头来说，物体越远，测距的精度越低。单目摄像头无法判断具有同样像素点数量物体的大小、远近关系，因此一般采用多目摄像头。同时单目摄像头无法识别没有明显轮廓的障碍物，其工作准确率与外部光线条件有关，并且受限于数据库，没有自学习功能。


    ![](images/txt002_9.jpg "pagenumber_ebook=40,pagenumber_book=30")


    图2.8　单目摄像头


    #### （2）双目摄像头


    如图2.9所示，双目摄像头通过对两幅图像视差的计算，直接对前方景物（图像所拍摄到的范围）进行距离测量，而无须判断前方出现的是什么类型的障碍物。其依靠两个平行布置的摄像头产生的视差，能够找到同一个物体所有的点；依赖三角测距等方法，能够算出摄像头与前方障碍物的距离，实现更高的识别精度和更远的探测范围。使用这种方案，需要两个摄像头有较高的同步率和采样率，因此技术难点在于双目标定及双目定位。相比单目摄像头，双目摄像头没有识别率的限制，无须先识别，可直接进行测量；直接利用视差计算距离，精度更高；无须维护样本数据库。但因为检测原理上的差异，相比于单目摄像头及毫米波雷达、激光雷达，双目摄像头在距离测算上的计算量级大幅增加。


    ![](images/txt002_10.jpg "pagenumber_ebook=41,pagenumber_book=31")


    图2.9　双目摄像头


    #### （3）三目摄像头


    相比于单目摄像头，三目摄像头增加了一个长焦摄像头（负责远距离探测）和一个鱼眼摄像头（负责增强近距离范围的探测能力），其视野更为广阔。图2.10所示为特斯拉安装的三目摄像头，根据焦距的不同，每个摄像头感知的范围也不相同。3个摄像头分别为前视窄视野摄像头（最远感知250m）、前视主视野摄像头（最远感知150m）、前视宽视野摄像头（最远感知60m）。


    ![](images/txt002_11.jpg "pagenumber_ebook=41,pagenumber_book=31")


    图2.10　三目摄像头


    #### （4）环视摄像头


    环视摄像头如图2.11所示。环视摄像头采用鱼眼镜头，其安装位置朝向地面。鱼眼镜头图像的畸变较大，其早起主要用于辅助，随着传感器融合技术的发展，也可以用于定位。为了扩大视野，环视摄像头一般至少包括4个摄像头，分别安装在汽车前侧、后侧、左侧、右侧，实现360°环境感知，如图2.11所示。


