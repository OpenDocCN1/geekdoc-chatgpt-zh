    智能网联驾驶感知技术


    智能网联驾驶的关键组成技术是环境感知技术和车辆控制技术，其中环境感知技术是智能网联汽车行驶的基础技术。本章主要介绍智能网联驾驶中的感知技术，车辆通过将各类硬件传感器（如相机、雷达等传感器）采集到的数据进行收集、融合处理，来实现对周边环境的感知。


    ## 2.1 环境感知的任务

    在日新月异的智能网联汽车领域，环境感知是智能网联汽车的核心技术之一，是智能网联汽车其他技术的数据基础，为智能决策和控制执行提供依据，更是智能网联汽车实现自动驾驶的第一步。智能网联汽车利用视觉传感器、超声波雷达（也称超声波传感器）、毫米波雷达、激光雷达等获取道路、车辆位置和障碍物的信息，各种传感器成为智能汽车的手、眼睛、耳朵、舌头、鼻子甚至大脑，收集汽车驾驶过程和环境中所有能被感受到的各种测量数据和信息，并将测量数据和信息分类处理分析后进行信息输出，来满足汽车驾驶智能化、自动化过程中对于环境感知的需要。


    智能网联驾驶环境感知的任务主要可以分为4个模块：动态物体检测（Dynamic Object Detection，DOD）、通行空间（Free Space，FS）、车道线检测（Lane
    Detection，LD）、静态物体检测（Static Object Detection）\[10\]。


    ### 1. 动态物体检测

    '
  trans: '


    基于车-车、车-路、车-云、车-移动终端通信，交通参与者、道路运营方之间进行一系列信息交互，并产生决策信息。决策信息进入接收方的智能驾驶系统，但接收方不一定需要按照接收到的决策信息行驶，融合后的决策信息由智能驾驶系统执行。配合不同应用场景，消息可通过广播、组播、单播发出。


    ### 4. 网联驾驶等级 3（融合控制）

    基于车-车、车-路、车-云、车-移动终端通信，特定交通参与者按照特定操作者的指示完成驾驶任务，包括控制指令或调度信息等。控制信息通过单播发出，进入自动驾驶系统，融合后的控制信息由自动驾驶系统或云控平台执行。


    表 1.3 进一步细化了网联驾驶各等级的具体要素。每个等级都从典型信息、信息融合主体两个维度分别进行描述。原则上，高级别网联化融合的等级对低级别网联化融合的等级具有包容性。


    ### 表 1.3 网联化融合技术等级

    ![](img/txt001_7.jpg "pagenumber_ebook=20,pagenumber_book=10")


    鉴于各国尚未形成成熟的智能化网联化融合发展路线，依据网联信息对汽车驾驶自动化等级的支撑作用，判定融合发展将经历 3 个发展阶段，即信息提醒和精确预警阶段、车路云一体化的辅助驾驶（Advanced
    Driving Assistance System，C-ADAS）阶段、车路云一体化的自动驾驶（Autonomous Driving，CAD）阶段。


    在信息提醒和精确预警阶段，网联信息或其与单车智能的感知、多传感器数据融合处理后的感知信息，以提醒、预警方式在人机交互界面显示，随着车道级定位和高精地图的应用和普及，预警内容逐步丰富。


    在车路云一体化的辅助驾驶（C-ADAS）阶段，符合相应信息安全、功能安全要求的网联信息进入智驾域，开始支撑车辆辅助驾驶。


    在车路云一体化的自动驾驶（CAD）阶段，符合相应信息安全、功能安全要求的网联信息开始支撑车辆自动驾驶。在道路基础设施建设和车载通信设施搭载均达到相当高的程度时，车路云一体化的自动驾驶逐步实现普及。


    为避免网联化融合技术的 4 个等级与融合发展的 3 个发展阶段的定义混淆，表 1.4 形成 4×3 的矩阵，梳理了各等级与各阶段的关系。表 1.4 分为横向、纵向两个视角：横向视角中，同一融合技术等级的消息内容的指标相同，但由于
    3 个发展阶段对于该消息内容的指标不同，最终的应用场景由左至右增强或新增；纵向视角中，由于各融合技术等级中消息内容的指标的不同，最终的应用场景由上至下增强或新增。


    状态共享等级包含未进入智驾域的网联状态信息，只能应用于信息提醒和精确预警阶段。


    融合感知等级中的消息内容可分别应用在信息提醒和精确预警、C-ADAS、CAD3 个阶段。由于自动驾驶系统在这 3 个阶段的功能安全、预期功能安全、信息安全的要求不同，因此其拆解至车载通信设备、路侧设备、云平台必须满足的安全要求也不同。


    融合决策等级中的消息内容可分别应用在 C-ADAS、CAD 两个阶段。因为网联导入的决策信息已经超越车内提醒预警的范畴，因此不包括信息提醒和精确预警阶段。


    网联融合控制等级中的消息内容只应用在 CAD 阶段。因为无法保证人类驾驶员参与协同，因此不包括 C-ADAS 阶段。


    ### 表 1.4 网联化融合技术等级与发展阶段关系

