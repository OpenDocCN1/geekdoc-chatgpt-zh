    # 第4章　智能网联驾驶交互消息


    ![](images/txt004_1.jpg "pagenumber_ebook=87,pagenumber_book=77")


    智能网联驾驶交互消息


    2017年9月，《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》`（T/CSAE53-2017）`\[32\]被发布，首次对于智能网联应用做出了标准定义，包含17个典型应用场景、支撑这些场景的应用层交互数据集，以及`API`（Application
    Programming Interface，应用程序编程接口）、`SPI`（Serial Peripheral Interface，串行外设接口）。该标准的发布在一定程度上打破了底层技术与通信频段的困局限制了车企们对于`V2X`上层应用的探索这一现状，让我国的`V2X`智慧道路和车辆真正拥有了统一而自主的“语言和文字”。


    为了增强应用落地的可实现性，《基于`LTE`的车联网无线通信技术消息层技术要求》\[33\]应运而生，该标准中规定了包括消息层数据集的架构以及具体的数据定义和编码方式在内的消息层技术要求，降低了应用落地的准入门槛。


    随着标准应用的深入和自动驾驶技术的发展，行业开始关注如何通过信息协同持续提升车辆的在途安全系数和效率以及为高等级的自动驾驶服务，在此基础上《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第二阶段）》`（T/CSAE157-2020）`\[34\]和《基于车路协同的高等级自动驾驶数据交互内容》`（T/CSAE158-2020）`\[35\]两标准的发布对此给予了回应。`T/CSAE157-2020`定义了第二阶段的应用场景，并对应用层交互数据集进行了兼容性的扩展与补充，`T/CSAE158-2020`则规定了基于车路协同的`L4`、`L5`级别下的典型应用和数据交互内容。


    至此行业里形成了较为完善的网联消息标准体系，且在实际落地应用中行业各家也都在持续地对网联消息的相关标准进行了完善与补充。


    ## 4.1　智能网联应用场景


    本节根据《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》和《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第二阶段）》对智能网联应用场景分两个阶段进行介绍。


    ### 4.1.1　第一阶段应用场景


    “鉴于我国有独特的交通环境和产业需求，我们需要制定自己的应用层标准”，2016年年初正是基于这样的业界呼声在中国汽车工程学会的指导下，星云互联、长安汽车、通用汽车和清华大学共同牵头，成立了标准编制组，其涉及汽车、交通和通信三大行业，凝聚了来自车企、高校以及通信、智能交通、测试检验、终端制造等多个领域机构的智慧，该标准编制组于2017年9月发布《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》且于2020年发布其修订版`（T/CSAE53-2020）`。


    在《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》中，该标准编制组依据技术的成熟度、应用价值以及可实现性准则选取并定义了17个`V2X`典型应用场景（这些场景分属于安全、效率、信息服务三大类），并对支撑这些场景的应用层交互数据集做了说明，如表4.1所示，这些场景及消息集的定义为`V2X`应用场景实现和落地提供了指导。


