    5.4　紧急刹车预警技术


    5.4.1　紧急刹车预警的定义


    紧急刹车预警（Emergency Brake Warning，EBW）是指主车（HV）行驶在道路上，与前方行驶的远车（RV）存在一定距离，当前方RV进行紧急制动时，其会将这一信息通过短程无线通信广播出来。HV检测到RV的紧急制动状态后，若判断该RV事件与HV相关，则对HV驾驶员进行预警。本应用适用于城市及郊区的普通道路及高速公路可能发生的制动追尾碰撞危险的预警。


    5.4.2　紧急刹车预警的主要场景


    EBW包括如下主要场景。


    场景一：H V行驶在道路上，RV发生紧急制动事件，如图5.9所示。EBW应用对H V驾驶员发出预警，提醒驾驶员前方紧急制动操作存在碰撞危险。预警时机需确保H
    V驾驶员收到预警后，能有足够的时间采取措施，避免与RV发生追尾碰撞。在此过程中，H V和RV需具备短程无线通信能力。


    ![](images/txt005_18.jpg "pagenumber_ebook=120,pagenumber_book=110")


    图5.9　同车道H V前方紧邻的RV紧急制动


    场景二：H V行驶在道路上，其前方非紧邻的RV-1发生紧急制动事件，H V的视线被紧邻的RV-2所遮挡，如图5.10所示。EBW应用对H V驾驶员发出预警，提醒驾驶员前方紧急制动操作存在碰撞危险。预警时机需确保H
    V驾驶员收到预警后，能有足够的时间采取措施，避免与RV-2和RV-1发生追尾碰撞。在此过程中，H V和RV-1、RV-2需具备V2X通信能力。


    ![](images/txt005_19.jpg "pagenumber_ebook=120,pagenumber_book=110")


    图5.10　同车道H V前方非紧邻的RV紧急制动


    5.4.3　紧急刹车预警的基本原理与算法实现


    在相同或者相邻车道上，RV发生紧急制动事件并对外广播，当H V通过行驶方向、距离、位置、速度等信息，判断该事件对H V具有潜在危险时，则对H V驾驶员进行预警。触发EBW功能的H
    V和RV的位置关系如图5.11所示。


    EBW的基本工作原理如下。


    ①RV出现紧急制动事件时，将这一信息对外进行广播；H V接收到的RV信息时，判断其是否包含紧急制动事件。


    ②H V将出现紧急制动事件的RV分类为前方相同车道和前方相邻车道。


    ③H V进一步根据车速、位置等信息判断该RV是否与H V相关，若存在潜在碰撞危险，则对H V驾驶员进行提醒。


    ![](images/txt005_20.jpg "pagenumber_ebook=121,pagenumber_book=111")


    图5.11　触发EBW功能的H V和RV的位置关系


    本书实现EB W算法的具体思路如下。


    ①定义一个函数doEB W，它接受两个参数——hvInfo和rvInfo，两个参数分别表示主车和远车的信息。


    ②函数内部首先初始化两个变量：warning\_flag和adviser。warning\_flag表示预警等级，其中0表示无须预警，2表示需要紧急停车预警。adviser表示建议类型，其中keep表示保持当前状态，emergency\_stop表示紧急停车。


    ③分别从hvInfo和rvInfo中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸、车辆类型和刹车状态，并将其赋值给相应的变量。


    ④调用my\_calc\_distance函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。


    ⑤判断主车到远车之间是否满足以下条件，若满足则将warning\_flag设为2，并将adviser设为emergency\_stop：纵向距离大于0（即远车在主车前方）、横向距离小于默认道路宽度的一半（即两车在同一条道上）、主车速度大于0.1（即主车不是静止状态）、主车无法在碰撞前停下来。


    ⑥最终返回warning\_flag和adviser作为函数输出。


