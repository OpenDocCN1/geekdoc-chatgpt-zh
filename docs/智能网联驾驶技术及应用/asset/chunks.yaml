    # 第 1 章 智能网联驾驶技术概述


    ![](img/txt001_1.jpg "pagenumber_ebook=11,pagenumber_book=1")


    ## 智能网联驾驶技术概述


    截至 2022 年年底，中国机动车保有量达 4.17 亿辆，机动车驾驶人数超 5 亿人\[1\]，中国机动车驾驶人数量逐年攀升。随着机动车保有量和机动车驾驶人数的增加，能源短缺、环境污染、交通拥堵等现象日益严重，成为汽车产业可持续健康发展的限制因素，其中交通拥堵已经成为城市迫切需要解决的难题之一。


    智能网联驾驶技术指有机联合车联网与智能车，搭载先进的车载传感器、控制器、执行器等装置，并融合现代通信与网络技术，实现车与人、车、路、平台等智能信息的交换共享，以及安全、舒适、节能、高效的行驶，并最终可替代人来操作的新一代汽车技术。智能网联驾驶技术是解决汽车社会面临的交通安全、道路拥堵、能源消耗、环境污染等问题的重要手段，代表着汽车工业未来的发展方向。近年来，智能网联驾驶技术发展迅速，相关理论和标准被提出，本章将介绍智能网联驾驶的基本概念、技术等级、发展趋势，以及智能网联驾驶认知台架实验。


    ## 1.1 智能网联驾驶的基本概念


    智能网联驾驶是指在单车智能的基础上借助于无线通信网络技术进行更加网联化的驾驶，旨在实现更加安全高效的无人驾驶\[2\]。从发展方向来看，智能网联驾驶经历了从单车智能驾驶和网联驾驶齐头并进发展，到二者深度融合成智能网联驾驶的过程，如图
    1.1 所示。本节将从单车智能驾驶、车联网和智能网联驾驶 3 个方面详细介绍。


    ### 1.1.1 单车智能驾驶

    '
  toc: []
- raw: '单车智能驾驶是通过搭载先进传感系统、决策系统、执行系统，运用信息通信、互联网、大数据、云计算、人工智能等新技术，具有部分或完全自动驾驶功能，由单纯的交通运输工具逐步向智能移动空间转变的新一代驾驶技术\[3\]，如图1.2所示。单车智能驾驶即通过车辆本身的传感器获取外界信息，通过算法进行处理，自主控制车辆行驶。单车智能驾驶主要通过以下3个部分实现：①通过环境感知解决在哪（定位）和周围有什么（感知）的问题；②通过预测规划解决周围的交通参与者要做什么（预测）和应该往哪走（规划）的问题；③通过车辆控制解决控制车辆行驶在规划的路线上（控制）的问题。


    ![](images/txt001_2.jpg "pagenumber_ebook=12,pagenumber_book=2")


    图1.1　智能网联驾驶的发展方向


    ![](images/txt001_3.jpg "pagenumber_ebook=12,pagenumber_book=2")


    图1.2　智能汽车的层次架构


    感知层的功能是感知和通信，即感知车辆、感知环境，以及告诉系统所处的位置，周围的环境是什么。目前，感知层主要是采用传感器技术，它是自动驾驶车的“眼睛”和“耳朵”，包含了激光雷达、毫米波雷达、摄像头、超声波传感器、高精度定位、高精度地图等技术。感知系统依赖来自传感器的大量数据，进而实现对车辆自身运动状态的感知、路面信息（比如车道线）的提取、对周围障碍物（比如行人、车辆等）的检测。这些各种各样的传感器包括摄像头、毫米波雷达、激光雷达、超声波雷达、红外夜视等。每种类型的感知技术都有自己的优势和劣势，它们相互进行充分的信息融合，最终形成全面可靠的感知数据供决策与控制系统使用。


    决策规划层就是在车辆获取感知数据后，会针对数据进行分析、决策和预测，解决系统该对环境做出什么反应、预测之后可能会发生什么情况的问题。自动驾驶汽车在进行决策规划时，会从环境感知模块中获取道路拓扑结构信息、实时交通信息、其他交通参与者（如行人、车辆、障碍物等）信息和主车自身的状态信息等内容。结合以上这些信息，决策规划系统会对当前环境做出分析，然后对底层控制执行模块下达指令，这一过程就是决策规划层的主要任务。


    车辆控制层是通过车辆的执行机构完成相应的制动、转向、驱动等操控动作。执行控制系统相当于人的手和脚，由制动踏板和加速踏板、电子稳定系统、电动助力转向、自动变速器等组成。可以说，这是自动驾驶汽车行驶的基础，车辆的各个操控系统需要通过总线与决策系统相连接，并能够按照决策系统发出的总线指令精确地控制加速程度、制动程度、转向幅度、灯光控制等驾驶动作，以实现车辆的自主驾驶。


    自动驾驶控制执行的核心技术主要包括车辆的纵向控制和横向控制技术。


    ①纵向控制，即车辆的驱动与制动控制，指通过对油门和制动的协调，实现对期望车速的精确控制。纵向控制系统对危险场景的反应速度快，避撞控制精确有效，可最大限度地“避免”交通事故的发生以及人员的伤亡。此外，纵向控制系统在保证行驶安全的前提下，还可缩短车间距离，有效提高道路通行率，减轻因堵车造成的环境污染。


    ②横向控制，指垂直于运动方向上的控制，也叫侧向控制或转向控制，即通过方向盘角度的调整以及轮胎力的控制，实现自动驾驶汽车的路径跟踪。横向控制系统目标是控制汽车自动保持期望的行车路线，并使汽车在不同的车速、载荷、风阻、路况下均有很好的乘坐舒适性和稳定性。


    目前，单车智能驾驶主要依靠车辆上加装的硬件设备与软件的协调，这样才能实现车辆的自动驾驶功能，因此单车智能驾驶对环境感知有更高的需求。为了使单车智能更加的安全，需要在车辆上加装足够多的硬件设备，从而消除单车智能车辆行驶过程中的感知盲区。但在现实中，即使在车辆上加装了车载视觉摄像头、超声波雷达、毫米波雷达等硬件设备，依旧会出现盲区或潜在的未识别障碍物，无法做到全方位识别。感知硬件设备对安装位置、视场角、数据吞吐、标定精度、时间同步的要求非常高，当单车智能车辆在复杂路口、恶劣天气、小物体感知识别、信号灯识别、逆光等特殊环境条件下行驶时，仍然难以彻底解决准确感知识别的问题。此外，车辆上搭载的车载视觉摄像头、超声波雷达、毫米波雷达的感知范围有限，当有其他车辆高速通过时，如果车辆没有做出及时的预判与控制，就会导致危险的发生。


    成本过高是阻碍单车智能发展的主要原因之一\[4\]。硬件设备的成本高，同时需要配备计算单元来处理硬件设备产生的数据，这就造成了更高的成本。除此以外，需要在车端部署相应的软件系统来操作这些设备，软件系统需要维护管理及更新，这也大大增加了自动驾驶车辆的维护成本。单车智能的发展离不开高精度地图，但高精度地图的采集是非常复杂且高成本的。一般来说，需要企业利用专业采集车和采集设备，由专业采集员驾驶车辆以较高的精度（10cm）对道路进行数据采集，且为保证数据准确性，需要专业采集员对同一条道路进行多次数据采集，这对设备和人员技术有极高要求。数据采集完成后，需要将大量人力投入地图的编译制作中。据相关机构测算，制作一个普通道路高精度地图每公里的费用为数千元。


    如果道路进行了整改或修缮，高精度地图就需要及时更新，考虑后期高频率的更新需求，采集高精度地图的企业还需要对数据采集、制图产线、数据管理与云服务等方面进行长期性战略投入，这就带来了极高的更新维护成本。在实际应用中，高精度地图具有分析数据量大与更新频率高的特点，在此过程中，大量道路和实时数据被在线采集，宽凳科技表示其云端每天的预处理数据量为600～800GB，Waymo地图测绘车一天内采集的数据量约为1TB，但这些数据主要是静态图层信息，并不包括实时交通参与者等动态图层信息。当单车智能自动驾驶的路线商用化后，高精度地图就需要以更高的更新频率随时根据道路情况进行更新。这些都增加了巨大的成本，使得单车智能驾驶的商用化变得更加困难。


    1.1.2　车联网


    车联网是指基于无线通信互联技术建立车与车、车与路、车与智能交通系统等服务中心的连接，甚至是车与住宅、办公室以及一些公共基础设施的连接，可以实现车内网络与车外网络之间的信息交互，全面解决人-车-外部环境之间的信息交互问题\[5\]。它是一个由车辆位置、速度、路线等信息组成的庞大的互动网络。


    车用无线通信技术（Vehicle-to-Everything，V2X）是将车辆与一切事物相连接的新一代信息通信技术，其中V代表车辆，X代表任何与车交互信息的对象，其具体信息模式包括车与车之间（Vehicle-to-Vehicle，V2V）、车与路侧基础设施（如红绿灯、交通摄像头和智能路牌等）之间（Vehicle-to-Infrastructure，V2I）、车与人之间（Vehicle-to-Pedestrian，V2P）、车与网络之间（Vehicle-to-Network，V2N）的交互。


    V2X通信技术目前有专用短程通信技术（Dedicated Short Range Communication，DSRC）\[6\]与基于蜂窝通信的车联网无线通信技术（Cellular
    Vehicle to Everything，C-V2X）\[7\]两大技术。V2X将“人”“车”“路”“云”等交通参与要素有机地联系在一起，不仅可以支撑车辆获得比单车感知更多的信息，促进自动驾驶技术的创新和应用，还可以有利于构建一个智慧的交通体系，促进汽车和交通服务的新模式新业态发展，对提高交通效率、节省资源、减少污染、降低事故发生率、改善交通拥堵状况具有重要意义。


    从车联网的组成来看，车联网包括车载子系统、出行者子系统、路侧子系统和中心子系统，如图1.3所示。


    ![](images/txt001_4.jpg "pagenumber_ebook=14,pagenumber_book=4")


    图1.3　车联网层次架构


    1.车载子系统


    车载系统包含车载操作系统及车载信息系统等，由多种智能传感器和车载通信单元组成，负责采集与获取车辆信息，通过这些传感器设备，车辆不仅可以实时了解自己及周围他车的位置、朝向、行驶距离、速度和加速度等信息，还可以通过各种传感器感知外界环境的信息，包括道路交通参与者、障碍物信息等。这不仅方便驾驶员及时了解车辆信息，还让驾驶员可以对外界变化做出及时的反应。此外，车载信息系统也是具有车内通信、车间通信、车网通信的泛在通信终端，让自车具备了与他车、路侧设施和云平台通信的能力。


    2.出行者子系统


    出行者子系统是车路协同系统中的一个重要组成部分，旨在提供个性化的出行体验和智能化的交通服务。该子系统主要面向行人，为出行者提供相关的信息和服务。出行者子系统通过与车辆、道路基础设施和交通管理中心等进行协同工作，为出行者提供智能化、个性化的交通服务。


    它能够提高出行效率、提高出行安全性，为出行者创造更舒适、更便捷的出行体验。同时，通过数据的采集和分析，出行者子系统也能够为交通管理部门提供有价值的交通统计和分析数据，支持交通决策，能够监测出行者的行驶状态，并能够通过与车辆上的传感器和驾驶辅助系统的交互，提供驾驶行为评估和安全提示。它能够警示出行者注意事故易发区域、避免超速行驶等，以提高出行者的安全意识和行驶安全性。


    3.路侧子系统


    路侧系统包括路侧通信单元（Road Side Unit，RSU）、路侧计算设施和路侧感知设备等。其中路侧通信单元部署在路侧的通信网关，它汇集路侧感知设备、智能交通基础设施以及周边车辆的信息，通过有线/无线的方式将其上传到V2X平台，并将周边交通信息下发至相关车辆。路侧计算设施可接入雷达、相机等多种交通感知设备，通过分析处理多源感知数据输出交通参与者、交通事件等结果，支持车路协同应用。车路协同采用有线或无线通信和新一代互联网等技术，在全时空动态交通信息采集与融合的基础上，全方位实现车-车、车-路动态实时数据交互及车辆主动安全控制和道路协同管理，实现提升交通安全、提高通行效率、改善出行体验、支持自动驾驶等目标。


    路侧感知设备则是利用激光雷达、毫米波雷达、相机等传感器，并结合路侧计算设施，瞬时感知路段的交通参与者及路况，为车辆提供更广域的感知范围，并通过路侧通信单元与车辆进行信息交互，实现车与路的信息共享。


    4.中心子系统


    中心子系统是连接车端和路端的枢纽，能够将车辆信息、路侧交通信息和管理信息以及高精地图等在云端进行整合，向车端、路端及行人提供信息服务及预警决策，具有数据存储、数据运维、大数据分析、云计算、信息安全等基础服务机制，是支持智能网联汽车实际应用需求的基础支撑平台，此外还能够支持部署和运行包括智能网联汽车协同感知、决策与控制，智能交通管控，公共出行服务，智能网联汽车测试等在内的多类行业应用，并进行应用过程管理、应用资源配置、应用生态拓展的智能网联汽车行业的专业管理与服务。


    1.1.3　智能网联驾驶


    智能网联驾驶作为智能交通发展新阶段的主流趋势，是交通领域车路协同系统的核心元素。智能网联驾驶是一种基于先进传感器、通信和控制算法的自动驾驶技术，其实现的关键在于环境感知、车辆控制及车路协同互联。


    智能网联驾驶是在现有单车智能自动驾驶的基础上，旨在通过车联网将“人-车-路-云-网-图”等交通参与要素有机地联系在一起。“智慧的路”通过路侧感知设备形成对交通状况的全面感知，路侧计算单元将感知数据分析计算结果，通过“可靠的网”下发给“聪明的车”和“实时的云”，同时更新“精确的图”，提供车路协同安全预警服务，为“聪明的车”提供感知及决策支撑，实现“车-路-云-网-图”的协同配合。


    在环境感知方面，智能网联驾驶需要多种类型的传感器来感知车辆周围环境，包括激光雷达、摄像头、毫米波雷达、GPS、惯性测量单元等，通过获取车辆周围环境数据，通过后续算法将其转化为车辆周围环境的几何结构和特征信息。在协同通信方面，智能网联驾驶主要基于车联网实现V2X网联通信，V2V通信可以让车辆之间相互传递信息，如路况、车速、转向等信息，以实现更加精准的自动驾驶控制；V2I通信则主要是通过基础设施（如交通信号灯、路况监控设施等）来获取交通信息，以便使自动驾驶车辆做出更为合理的决策；V2N通信能让车辆与云平台直接交互，获取超视距的交通信息，协助车辆提前做出更合理的全程路径规划。


    在业务场景上，智能网联驾驶在未来交通领域的应用将会非常广泛，例如，在公共交通领域，智能网联驾驶可以使公共交通更加高效、智能和安全。自动驾驶巴士可以在不需要司机的情况下，自主行驶在公共道路上，为市民提供更加便捷的出行服务；在物流配送领域，自动驾驶货车可以在不需要人工干预的情况下，将物品送到指定的目的地。此外，智能网联驾驶还可以让出租车服务更加便捷、高效和安全，如，通过该技术可以实现“一键呼叫、自动寻找、自动接送、自动支付”的完全自主化出租车服务模式。


    在落地应用上，智能网联驾驶可以通过高精度传感器和先进控制算法，实现对车辆周围环境的全面感知和实时决策，大大提高交通安全性，还可以通过协同通信实现车辆之间的无缝连接和自主协调，提高交通效率，在实现车辆自动驾驶的前提下，降低人力成本和运营成本。


    1.2　智能网联驾驶的技术等级


    智能网联驾驶作为智能化和网联化深度融合的产物，其技术等级取决于智能化等级和网联化等级。本节将从智能化和网联化等级两个方面展开介绍，逐一介绍国内外相关技术等级的划分方法。然而，智能化和网联化深度融合后呈现的智能网联驾驶的技术等级在现阶段尚未形成统一的划分思路。读者可以通过对智能化和网联化等级进行交叉理解，发掘智能网联驾驶技术等级的端倪。


    1.2.1　自动驾驶分级


    如前言，目前针对自动驾驶分级，并没有一个统一的分类方法，不同的国家及机构根据其自动驾驶发展的趋势和核心要素进行分级，但其关键的区分要素都是“自动驾驶对于人的解放程度”。


    1.美国工程汽车协会对汽车自动驾驶的分级


    美国汽车工程师协会（Society of Automotive Engineers，SAE）在美国国家公路安全交通管理局（National Highway
    Traffic Safety Administration，NHTSA）的自动驾驶汽车分级标准的基础上发布了SAE J3016标准\[8\]，将自动驾驶分为L0～L5总共6个级别，如表1.1所示。


    表1.1　SAE对汽车自动驾驶的分级


    ![](images/txt001_5.jpg "pagenumber_ebook=17,pagenumber_book=7")


    ①L0级别——无自动驾驶（No Driving Automation），该级别的自动驾驶就是人工驾驶，完全由驾驶员来进行操作驾驶汽车，包括制动、转向、踩油门以及动力传动。需要由驾驶员判断危险性。


    ②L1级别——驾驶辅助（Driver Assistance，DA），相比于完全依靠驾驶员自行操作车辆的L0级别，L1级别的自动驾驶能给驾驶员一些驾驶支援。比如，早期沃尔沃卡车、奔驰一类的进口车就具有自适应巡航（Adaptive
    Cruise Control，ACC）功能，即能够通过雷达探测与前车的实时距离自动控制加减速，从而保持与前车的安全距离。现阶段，该技术已经普及，在国内的很多商用车上都有应用。


    ③L2级别——部分自动驾驶（Partial Driving Automation，PA），特斯拉的车道保持功能就属于此级别，在驾驶过程中，系统除了能控制加减速，同时还能对方向盘进行控制，这种多项控制就是L2级别。驾驶员可以放弃主要控制权，但仍需要观察周围情况，并提供安全操作。


    ④L3级别——有条件自动驾驶（Conditional Driving Automation，CA），在L3级别的自动驾驶中，车辆能够在某个特定的驾驶交通环境下可独立完成所有的驾驶操作，而且系统可以自动检测环境的变化以判断是否需要返回驾驶员手动操作模式。在人工智能不能准确判断时，仍需人工操作。L3级别的自动驾驶仍需在限定的场景下运行。


    ⑤L4级别——高度自动驾驶（High Driving Automation，HA），只要在出发前输入出发地和目的地，就可以将车辆完全交给自动驾驶系统。比如，GoFun就运用L4级别的自动驾驶技术展现了自动取还车、自动编队巡航、自动避障等共享出行的真实场景，目前该技术方案已在大量车型上运用。


    ⑥L5级——完全自动驾驶（Full Driving Automation，FA），L5级别的自动驾驶汽车不需要驾驶员的注意——“动态驾驶任务”被取消了。L5级别的汽车甚至没有方向盘或加速/刹车踏板。这些汽车将摆脱地理围栏，能够去任何地方，做任何有经验的人类驾驶员能做的事情。完全自动驾驶汽车正在世界上的几个地区进行测试，但目前还没有任何一款完全自动驾驶汽车向公众开放。


    2.中国汽车工程学会对汽车自动驾驶的分级


    中国汽车工程学会基于驾驶自动化系统能够执行动态驾驶任务的程度，根据其在执行动态驾驶任务中的角色分配以及有无设计运行条件的限制，将驾驶自动化分为5级，如表1.2所示。


    表1.2　中国汽车工程学会对汽车自动驾驶的分级


    ![](images/txt001_6.jpg "pagenumber_ebook=18,pagenumber_book=8")


    ①1级驾驶自动化（应急辅助），驾驶自动化系统不能持续执行动态驾驶任务中的车辆横向或纵向运动控制，但具备持续执行动态驾驶任务中的部分目标和事件探测与响应的能力。


    ②2级驾驶自动化（部分驾驶辅助），驾驶自动化系统在其设计运行条件内持续地执行动态驾驶任务中的车辆横向或纵向运动控制，且具备与所执行的车辆横向或纵向运动控制相适应的部分目标和事件探测与响应的能力。


    ③3级驾驶自动化（组合驾驶辅助），驾驶自动化系统在其设计运行条件内持续地执行动态驾驶任务中的车辆横向和纵向运动控制，且具备与所执行的车辆横向和纵向运动控制相适应的部分目标和事件探测与响应的能力。


    ④4级驾驶自动化（有条件自动驾驶），驾驶自动化系统在其设计运行条件内持续地执行全部动态驾驶任务。


    ⑤5级驾驶自动化（高度自动驾驶），驾驶自动化系统在其设计运行条件内持续地执行全部动态驾驶任务，并执行动态驾驶任务接管。


    ⑥6级驾驶自动化（完全自动驾驶），驾驶自动化系统在任何可行驶条件下持续地执行全部动态驾驶任务，并执行动态驾驶任务接管。


    1.2.2　网联驾驶分级


    国家智能网联汽车创新中心的《基于C-V2X的智能化网联化融合发展路线图》将网联驾驶等级依据消息内容分为4级，包括状态共享、融合感知、融合决策、融合控制。


    1.网联驾驶等级0（状态共享）


    基于车-车、车-路、车-云、车-移动终端通信，发送方发送其交通环境感知信息以及发送方状态信息，供接收方使用，不要求信息进入接收方的智能驾驶系统，不要求所有接收方都有能力使用该信息。配合不同应用场景，信息可通过广播、单播发出。


    2.网联驾驶等级1（融合感知）


    基于车-车、车-路、车-云、车-移动终端通信，发送方发送其交通环境感知信息以及自身的状态和意图消息（未来状态），供接收方使用，发送过程可由接收方请求意图共享开启。感知信息进入接收方的智能驾驶系统，但接收方不一定需要按照共享的意图行事。配合不同应用场景，消息可通过广播、组播、单播发出。


    3.网联驾驶等级2（融合决策）'
  fmt: '

    ## 单车智能驾驶

    单车智能驾驶是通过搭载先进传感系统、决策系统、执行系统，运用信息通信、互联网、大数据、云计算、人工智能等新技术，具有部分或完全自动驾驶功能，由单纯的交通运输工具逐步向智能移动空间转变的新一代驾驶技术\[3\]，如图1.2所示。单车智能驾驶即通过车辆本身的传感器获取外界信息，通过算法进行处理，自主控制车辆行驶。单车智能驾驶主要通过以下3个部分实现：①通过环境感知解决在哪（定位）和周围有什么（感知）的问题；②通过预测规划解决周围的交通参与者要做什么（预测）和应该往哪走（规划）的问题；③通过车辆控制解决控制车辆行驶在规划的路线上（控制）的问题。


    ![](images/txt001_2.jpg "pagenumber_ebook=12,pagenumber_book=2")

    图1.1　智能网联驾驶的发展方向


    ![](images/txt001_3.jpg "pagenumber_ebook=12,pagenumber_book=2")

    图1.2　智能汽车的层次架构


    感知层的功能是感知和通信，即感知车辆、感知环境，以及告诉系统所处的位置，周围的环境是什么。目前，感知层主要是采用传感器技术，它是自动驾驶车的“眼睛”和“耳朵”，包含了激光雷达、毫米波雷达、摄像头、超声波传感器、高精度定位、高精度地图等技术。感知系统依赖来自传感器的大量数据，进而实现对车辆自身运动状态的感知、路面信息（比如车道线）的提取、对周围障碍物（比如行人、车辆等）的检测。这些各种各样的传感器包括摄像头、毫米波雷达、激光雷达、超声波雷达、红外夜视等。每种类型的感知技术都有自己的优势和劣势，它们相互进行充分的信息融合，最终形成全面可靠的感知数据供决策与控制系统使用。


    决策规划层就是在车辆获取感知数据后，会针对数据进行分析、决策和预测，解决系统该对环境做出什么反应、预测之后可能会发生什么情况的问题。自动驾驶汽车在进行决策规划时，会从环境感知模块中获取道路拓扑结构信息、实时交通信息、其他交通参与者（如行人、车辆、障碍物等）信息和主车自身的状态信息等内容。结合以上这些信息，决策规划系统会对当前环境做出分析，然后对底层控制执行模块下达指令，这一过程就是决策规划层的主要任务。


    车辆控制层是通过车辆的执行机构完成相应的制动、转向、驱动等操控动作。执行控制系统相当于人的手和脚，由制动踏板和加速踏板、电子稳定系统、电动助力转向、自动变速器等组成。可以说，这是自动驾驶汽车行驶的基础，车辆的各个操控系统需要通过总线与决策系统相连接，并能够按照决策系统发出的总线指令精确地控制加速程度、制动程度、转向幅度、灯光控制等驾驶动作，以实现车辆的自主驾驶。


    自动驾驶控制执行的核心技术主要包括车辆的纵向控制和横向控制技术。


    ①纵向控制，即车辆的驱动与制动控制，指通过对油门和制动的协调，实现对期望车速的精确控制。纵向控制系统对危险场景的反应速度快，避撞控制精确有效，可最大限度地“避免”交通事故的发生以及人员的伤亡。此外，纵向控制系统在保证行驶安全的前提下，还可缩短车间距离，有效提高道路通行率，减轻因堵车造成的环境污染。


    ②横向控制，指垂直于运动方向上的控制，也叫侧向控制或转向控制，即通过方向盘角度的调整以及轮胎力的控制，实现自动驾驶汽车的路径跟踪。横向控制系统目标是控制汽车自动保持期望的行车路线，并使汽车在不同的车速、载荷、风阻、路况下均有很好的乘坐舒适性和稳定性。


    目前，单车智能驾驶主要依靠车辆上加装的硬件设备与软件的协调，这样才能实现车辆的自动驾驶功能，因此单车智能驾驶对环境感知有更高的需求。为了使单车智能更加的安全，需要在车辆上加装足够多的硬件设备，从而消除单车智能车辆行驶过程中的感知盲区。但在现实中，即使在车辆上加装了车载视觉摄像头、超声波雷达、毫米波雷达等硬件设备，依旧会出现盲区或潜在的未识别障碍物，无法做到全方位识别。感知硬件设备对安装位置、视场角、数据吞吐、标定精度、时间同步的要求非常高，当单车智能车辆在复杂路口、恶劣天气、小物体感知识别、信号灯识别、逆光等特殊环境条件下行驶时，仍然难以彻底解决准确感知识别的问题。此外，车辆上搭载的车载视觉摄像头、超声波雷达、毫米波雷达的感知范围有限，当有其他车辆高速通过时，如果车辆没有做出及时的预判与控制，就会导致危险的发生。


    成本过高是阻碍单车智能发展的主要原因之一\[4\]。硬件设备的成本高，同时需要配备计算单元来处理硬件设备产生的数据，这就造成了更高的成本。除此以外，需要在车端部署相应的软件系统来操作这些设备，软件系统需要维护管理及更新，这也大大增加了自动驾驶车辆的维护成本。单车智能的发展离不开高精度地图，但高精度地图的采集是非常复杂且高成本的。一般来说，需要企业利用专业采集车和采集设备，由专业采集员驾驶车辆以较高的精度（10cm）对道路进行数据采集，且为保证数据准确性，需要专业采集员对同一条道路进行多次数据采集，这对设备和人员技术有极高要求。数据采集完成后，需要将大量人力投入地图的编译制作中。据相关机构测算，制作一个普通道路高精度地图每公里的费用为数千元。


    如果道路进行了整改或修缮，高精度地图就需要及时更新，考虑后期高频率的更新需求，采集高精度地图的企业还需要对数据采集、制图产线、数据管理与云服务等方面进行长期性战略投入，这就带来了极高的更新维护成本。在实际应用中，高精度地图具有分析数据量大与更新频率高的特点，在此过程中，大量道路和实时数据被在线采集，宽凳科技表示其云端每天的预处理数据量为600～800GB，Waymo地图测绘车一天内采集的数据量约为1TB，但这些数据主要是静态图层信息，并不包括实时交通参与者等动态图层信息。当单车智能自动驾驶的路线商用化后，高精度地图就需要以更高的更新频率随时根据道路情况进行更新。这些都增加了巨大的成本，使得单车智能驾驶的商用化变得更加困难。


    ## 车联网

    车联网是指基于无线通信互联技术建立车与车、车与路、车与智能交通系统等服务中心的连接，甚至是车与住宅、办公室以及一些公共基础设施的连接，可以实现车内网络与车外网络之间的信息交互，全面解决人-车-外部环境之间的信息交互问题\[5\]。它是一个由车辆位置、速度、路线等信息组成的庞大的互动网络。


    车用无线通信技术（Vehicle-to-Everything，V2X）是将车辆与一切事物相连接的新一代信息通信技术，其中V代表车辆，X代表任何与车交互信息的对象，其具体信息模式包括车与车之间（Vehicle-to-Vehicle，V2V）、车与路侧基础设施（如红绿灯、交通摄像头和智能路牌等）之间（Vehicle-to-Infrastructure，V2I）、车与人之间（Vehicle-to-Pedestrian，V2P）、车与网络之间（Vehicle-to-Network，V2N）的交互。


    V2X通信技术目前有专用短程通信技术（Dedicated Short Range Communication，DSRC）\[6\]与基于蜂窝通信的车联网无线通信技术（Cellular
    Vehicle to Everything，C-V2X）\[7\]两大技术。V2X将“人”“车”“路”“云”等交通参与要素有机地联系在一起，不仅可以支撑车辆获得比单车感知更多的信息，促进自动驾驶技术的创新和应用，还可以有利于构建一个智慧的交通体系，促进汽车和交通服务的新模式新业态发展，对提高交通效率、节省资源、减少污染、降低事故发生率、改善交通拥堵状况具有重要意义。


    从车联网的组成来看，车联网包括车载子系统、出行者子系统、路侧子系统和中心子系统，如图1.3所示。


    ![](images/txt001_4.jpg "pagenumber_ebook=14,pagenumber_book=4")

    图1.3　车联网层次架构


    ### 车载子系统

    车载系统包含车载操作系统及车载信息系统等，由多种智能传感器和车载通信单元组成，负责采集与获取车辆信息，通过这些传感器设备，车辆不仅可以实时了解自己及周围他车的位置、朝向、行驶距离、速度和加速度等信息，还可以通过各种传感器感知外界环境的信息，包括道路交通参与者、障碍物信息等。这不仅方便驾驶员及时了解车辆信息，还让驾驶员可以对外界变化做出及时的反应。此外，车载信息系统也是具有车内通信、车间通信、车网通信的泛在通信终端，让自车具备了与他车、路侧设施和云平台通信的能力。


    ### 出行者子系统

    出行者子系统是车路协同系统中的一个重要组成部分，旨在提供个性化的出行体验和智能化的交通服务。该子系统主要面向行人，为出行者提供相关的信息和服务。出行者子系统通过与车辆、道路基础设施和交通管理中心等进行协同工作，为出行者提供智能化、个性化的交通服务。


    它能够提高出行效率、提高出行安全性，为出行者创造更舒适、更便捷的出行体验。同时，通过数据的采集和分析，出行者子系统也能够为交通管理部门提供有价值的交通统计和分析数据，支持交通决策，能够监测出行者的行驶状态，并能够通过与车辆上的传感器和驾驶辅助系统的交互，提供驾驶行为评估和安全提示。它能够警示出行者注意事故易发区域、避免超速行驶等，以提高出行者的安全意识和行驶安全性。


    ### 路侧子系统

    路侧系统包括路侧通信单元（Road Side Unit，RSU）、路侧计算设施和路侧感知设备等。其中路侧通信单元部署在路侧的通信网关，它汇集路侧感知设备、智能交通基础设施以及周边车辆的信息，通过有线/无线的方式将其上传到V2X平台，并将周边交通信息下发至相关车辆。路侧计算设施可接入雷达、相机等多种交通感知设备，通过分析处理多源感知数据输出交通参与者、交通事件等结果，支持车路协同应用。车路协同采用有线或无线通信和新一代互联网等技术，在全时空动态交通信息采集与融合的基础上，全方位实现车-车、车-路动态实时数据交互及车辆主动安全控制和道路协同管理，实现提升交通安全、提高通行效率、改善出行体验、支持自动驾驶等目标。


    路侧感知设备则是利用激光雷达、毫米波雷达、相机等传感器，并结合路侧计算设施，瞬时感知路段的交通参与者及路况，为车辆提供更广域的感知范围，并通过路侧通信单元与车辆进行信息交互，实现车与路的信息共享。


    ### 中心子系统

    中心子系统是连接车端和路端的枢纽，能够将车辆信息、路侧交通信息和管理信息以及高精地图等在云端进行整合，向车端、路端及行人提供信息服务及预警决策，具有数据存储、数据运维、大数据分析、云计算、信息安全等基础服务机制，是支持智能网联汽车实际应用需求的基础支撑平台，此外还能够支持部署和运行包括智能网联汽车协同感知、决策与控制，智能交通管控，公共出行服务，智能网联汽车测试等在内的多类行业应用，并进行应用过程管理、应用资源配置、应用生态拓展的智能网联汽车行业的专业管理与服务。


    ## 智能网联驾驶

    智能网联驾驶作为智能交通发展新阶段的主流趋势，是交通领域车路协同系统的核心元素。智能网联驾驶是一种基于先进传感器、通信和控制算法的自动驾驶技术，其实现的关键在于环境感知、车辆控制及车路协同互联。


    智能网联驾驶是在现有单车智能自动驾驶的基础上，旨在通过车联网将“人-车-路-云-网-图”等交通参与要素有机地联系在一起。“智慧的路”通过路侧感知设备形成对交通状况的全面感知，路侧计算单元将感知数据分析计算结果，通过“可靠的网”下发给“聪明的车”和“实时的云”，同时更新“精确的图”，提供车路协同安全预警服务，为“聪明的车”提供感知及决策支撑，实现“车-路-云-网-图”的协同配合。


    在环境感知方面，智能网联驾驶需要多种类型的传感器来感知车辆周围环境，包括激光雷达、摄像头、毫米波雷达、GPS、惯性测量单元等，通过获取车辆周围环境数据，通过后续算法将其转化为车辆周围环境的几何结构和特征信息。在协同通信方面，智能网联驾驶主要基于车联网实现V2X网联通信，V2V通信可以让车辆之间相互传递信息，如路况、车速、转向等信息，以实现更加精准的自动驾驶控制；V2I通信则主要是通过基础设施（如交通信号灯、路况监控设施等）来获取交通信息，以便使自动驾驶车辆做出更为合理的决策；V2N通信能让车辆与云平台直接交互，获取超视距的交通信息，协助车辆提前做出更合理的全程路径规划。


    在业务场景上，智能网联驾驶在未来交通领域的应用将会非常广泛，例如，在公共交通领域，智能网联驾驶可以使公共交通更加高效、智能和安全。自动驾驶巴士可以在不需要司机的情况下，自主行驶在公共道路上，为市民提供更加便捷的出行服务；在物流配送领域，自动驾驶货车可以在不需要人工干预的情况下，将物品送到指定的目的地。此外，智能网联驾驶还可以让出租车服务更加便捷、高效和安全，如，通过该技术可以实现“一键呼叫、自动寻找、自动接送、自动支付”的完全自主化出租车服务模式。


    在落地应用上，智能网联驾驶可以通过高精度传感器和先进控制算法，实现对车辆周围环境的全面感知和实时决策，大大提高交通安全性，还可以通过协同通信实现车辆之间的无缝连接和自主协调，提高交通效率，在实现车辆自动驾驶的前提下，降低人力成本和运营成本。


    ## 智能网联驾驶的技术等级

    智能网联驾驶作为智能化和网联化深度融合的产物，其技术等级取决于智能化等级和网联化等级。本节将从智能化和网联化等级两个方面展开介绍，逐一介绍国内外相关技术等级的划分方法。然而，智能化和网联化深度融合后呈现的智能网联驾驶的技术等级在现阶段尚未形成统一的划分思路。读者可以通过对智能化和网联化等级进行交叉理解，发掘智能网联驾驶技术等级的端倪。


    ### 自动驾驶分级

    如前言，目前针对自动驾驶分级，并没有一个统一的分类方法，不同的国家及机构根据其自动驾驶发展的趋势和核心要素进行分级，但其关键的区分要素都是“自动驾驶对于人的解放程度”。


    #### 美国工程汽车协会对汽车自动驾驶的分级

    美国汽车工程师协会（Society of Automotive Engineers，SAE）在美国国家公路安全交通管理局（National Highway
    Traffic Safety Administration，NHTSA）的自动驾驶汽车分级标准的基础上发布了SAE J3016标准\[8\]，将自动驾驶分为L0～L5总共6个级别，如表1.1所示。


    ![](images/txt001_5.jpg "pagenumber_ebook=17,pagenumber_book=7")

    表1.1　SAE对汽车自动驾驶的分级


    ①L0级别——无自动驾驶（No Driving Automation），该级别的自动驾驶就是人工驾驶，完全由驾驶员来进行操作驾驶汽车，包括制动、转向、踩油门以及动力传动。需要由驾驶员判断危险性。


    ②L1级别——驾驶辅助（Driver Assistance，DA），相比于完全依靠驾驶员自行操作车辆的L0级别，L1级别的自动驾驶能给驾驶员一些驾驶支援。比如，早期沃尔沃卡车、奔驰一类的进口车就具有自适应巡航（Adaptive
    Cruise Control，ACC）功能，即能够通过雷达探测与前车的实时距离自动控制加减速，从而保持与前车的安全距离。现阶段，该技术已经普及，在国内的很多商用车上都有应用。


    ③L2级别——部分自动驾驶（Partial Driving Automation，PA），特斯拉的车道保持功能就属于此级别，在驾驶过程中，系统除了能控制加减速，同时还能对方向盘进行控制，这种多项控制就是L2级别。驾驶员可以放弃主要控制权，但仍需要观察周围情况，并提供安全操作。


    ④L3级别——有条件自动驾驶（Conditional Driving Automation，CA），在L3级别的自动驾驶中，车辆能够在某个特定的驾驶交通环境下可独立完成所有的驾驶操作，而且系统可以自动检测环境的变化以判断是否需要返回驾驶员手动操作模式。在人工智能不能准确判断时，仍需人工操作。L3级别的自动驾驶仍需在限定的场景下运行。


    ⑤L4级别——高度自动驾驶（High Driving Automation，HA），只要在出发前输入出发地和目的地，就可以将车辆完全交给自动驾驶系统。比如，GoFun就运用L4级别的自动驾驶技术展现了自动取还车、自动编队巡航、自动避障等共享出行的真实场景，目前该技术方案已在大量车型上运用。


    ⑥L5级——完全自动驾驶（Full Driving Automation，FA），L5级别的自动驾驶汽车不需要驾驶员的注意——“动态驾驶任务”被取消了。L5级别的汽车甚至没有方向盘或加速/刹车踏板。这些汽车将摆脱地理围栏，能够去任何地方，做任何有经验的人类驾驶员能做的事情。完全自动驾驶汽车正在世界上的几个地区进行测试，但目前还没有任何一款完全自动驾驶汽车向公众开放。


    #### 中国汽车工程学会对汽车自动驾驶的分级

    中国汽车工程学会基于驾驶自动化系统能够执行动态驾驶任务的程度，根据其在执行动态驾驶任务中的角色分配以及有无设计运行条件的限制，将驾驶自动化分为5级，如表1.2所示。


    ![](images/txt001_6.jpg "pagenumber_ebook=18,pagenumber_book=8")

    表1.2　中国汽车工程学会对汽车自动驾驶的分级


    ①1级驾驶自动化（应急辅助），驾驶自动化系统不能持续执行动态驾驶任务中的车辆横向或纵向运动控制，但具备持续执行动态驾驶任务中的部分目标和事件探测与响应的能力。


    ②2级驾驶自动化（部分驾驶辅助），驾驶自动化系统在其设计运行条件内持续地执行动态驾驶任务中的车辆横向或纵向运动控制，且具备与所执行的车辆横向或纵向运动控制相适应的部分目标和事件探测与响应的能力。


    ③3级驾驶自动化（组合驾驶辅助），驾驶自动化系统在其设计运行条件内持续地执行动态驾驶任务中的车辆横向和纵向运动控制，且具备与所执行的车辆横向和纵向运动控制相适应的部分目标和事件探测与响应的能力。


    ④4级驾驶自动化（有条件自动驾驶），驾驶自动化系统在其设计运行条件内持续地执行全部动态驾驶任务。


    ⑤5级驾驶自动化（高度自动驾驶），驾驶自动化系统在其设计运行条件内持续地执行全部动态驾驶任务，并执行动态驾驶任务接管。


    ⑥6级驾驶自动化（完全自动驾驶），驾驶自动化系统在任何可行驶条件下持续地执行全部动态驾驶任务，并执行动态驾驶任务接管。


    ### 网联驾驶分级

    国家智能网联汽车创新中心的《基于C-V2X的智能化网联化融合发展路线图》将网联驾驶等级依据消息内容分为4级，包括状态共享、融合感知、融合决策、融合控制。


    #### 网联驾驶等级0（状态共享）

    基于车-车、车-路、车-云、车-移动终端通信，发送方发送其交通环境感知信息以及发送方状态信息，供接收方使用，不要求信息进入接收方的智能驾驶系统，不要求所有接收方都有能力使用该信息。配合不同应用场景，信息可通过广播、单播发出。


    #### 网联驾驶等级1（融合感知）

    基于车-车、车-路、车-云、车-移动终端通信，发送方发送其交通环境感知信息以及自身的状态和意图消息（未来状态），供接收方使用，发送过程可由接收方请求意图共享开启。感知信息进入接收方的智能驾驶系统，但接收方不一定需要按照共享的意图行事。配合不同应用场景，消息可通过广播、组播、单播发出。


    #### 网联驾驶等级2（融合决策）

