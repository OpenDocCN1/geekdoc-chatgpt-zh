    \n\uFEFF\n\n第6章　智能网联驾驶信号灯路口场景应用\n\n![](images/txt006_1.jpg \"pagenumber_ebook=136,pagenumber_book=126\"\
    )\n\n智能网联驾驶信号灯路口场景应用\n\n6.1　信号灯路口场景介绍\n\n设置信号灯，是为了使得道路交通能够被有效管制，以便疏导交通流量，提升道路的通行能力，减少交通事故的发生。但由于城镇化和道路建设的飞速发展，城市内部的交叉路口越来越多，也越来越复杂，随之增设的信号灯大规模应用也显现出来一定的局限性。例如，车辆在通过有信号灯的路口时，驾驶员可能会因为前车遮挡或主观的判断失误出现闯红灯或开车车速不稳的情况，这不仅可能会带来额外的油耗，还可能导致无法顺利通过路口而造成拥堵或事故。\n\
    \n在实际驾车中经常存在“一路红灯”的情况，导致驾驶员需要频繁地在路口启停，不仅影响了驾乘人员的出行效率，而且增加了对环境的污染。部分灯态下并没有明确的驾驶指令，导致大家凭借主观经验判断，如当驾驶员接近道路交叉口且绿灯剩余时间不多或者信号灯为黄灯时，驾驶员到底是“走”还是“停”没有固定统一的标准，驾驶员只能根据自己经验来选择“走”或者“停”。例如，当遇到黄灯时，若车辆距离道路交叉口比较远，大部分驾驶员会选择停车；若车辆距离道路交叉口比较近，大部分驾驶员则会选择通过。驾驶员的驾驶经验、判断能力有限，当驾驶员遇到黄灯且黄灯的剩余时间已不能满足驾驶员通过道路交叉口时，一些驾驶员由于判断失误而选择通过，导致闯红灯事件的发生，继而引发交通事故。\n\
    \n因此在具备信号灯的路口下，如何有效地提升通行效率，减少停车等待时间和闯红灯事件的发生是城市交通参与者关注的焦点。\n\n绿波车速引导技术能够提示驾驶员当前路段合适的行驶速度，从而顺利通过红绿灯，大大减少了汽车停车的次数。在特定路段驾驶员按照引导车速驾驶可以畅通无阻地通过各个交叉口，信号灯对于到达此交叉口的驾驶员能够一直呈现绿色，这增加了车辆通行的连续性，缓解了交通拥堵。\n\
    \n闯红灯预警技术通过提前向司机下发当前路口的红绿灯灯态，让驾驶员能够排除视线受阻或极端天气对红绿灯观察的影响，超视距知晓路口情况，根据灯态提前采取减速、刹停的动作，当车辆存在不按信号灯规定行驶时，还能对驾驶员进行预警，避免在路口发生碰撞。\n\
    \n6.2　绿波车速引导技术\n\n6.2.1　绿波车速引导的定义\n\n绿波车速引导（Green Light Optimal Speed Advisory，GLOSA）是指，当OBU的HV驶向信号灯路口，并收到由RSU发送的道路数据及信号灯实时状态数据时，GLOSA应用将提供给驾驶员一个建议车速区间，以使车辆能够经济地、舒适地（不需要停车等待）通过信号灯路口。本应用适用于城市及郊区普通道路的信号灯路口。\n\
    \nGLOSA应用能辅助驾驶应用，提高车辆通过交叉路口的经济性和舒适性，提高交通系统效率。\n\n6.2.2　绿波车速引导的主要场景\n\nGLOSA的主要场景如图6.1所示，具体描述如下。\n\
    \n①HV从远处接近信号灯控制路口。\n\n②路侧通信设备发出局部道路数据信息及从路口信号机处获得信号灯数据信息和实时状态信息。\n\nGLOSA应用根据上述信息，给出HV前方信号灯的实时状态，并结合HV的定位和行驶状态信息，计算出通过路口的引导车速区间。\n\
    \n![](images/txt006_2.jpg \"pagenumber_ebook=137,pagenumber_book=127\")\n\n图6.1　绿波车速引导场景\n\
    \n6.2.3　绿波车速引导的基本工作原理与算法实现\n\nGLOSA的基本工作原理如下。\n\n①H V根据收到的道路数据，以及本车的定位和运行数据，判定本车在路网中所处的位置和运行方向。\n\
    \n②判断车辆前方路口是否有信号灯，提取信号灯对应相位的实时状态；若有信号灯信息，则可直接将其显示给驾驶员。\n\n③GLOSA应用根据本车的位置，以及信号灯对应相位的实时状态，计算本车能够在本次或下次绿灯期间不停车通过路口所需的最高行驶速度和最低行驶速度，并进行提示。\n\
    \n本书实现GLOSA算法的具体思路如下。\n\n①定义一个函数doGLOSA，它接受3个参数：hvInfo、spatInfo和mapInfo。hvInfo表示主车信息，spatInfo表示信号灯信息，mapInfo表示地图消息。\n\
    \n②函数内部首先初始化3个变量：warningFlag、adviser和max\\_spd。warningFlag表示预警等级，其中0表示无须预警，1表示一般预警，2表示紧急预警。adviser表示建议类型，其中keep表示保持当前状态，slow\\\
    _down表示减速行驶，speed\\_up表示加速行驶，avoid\\_redlight表示小心红灯。max\\_spd表示主车需要的最大速度。\n\n\
    ③从hvInfo中提取主车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。\n\n④从mapInfo中提取车道限速，从spatInfo中提取红绿灯信息，包括当前状态、剩余时间，以及红灯、绿灯、黄灯的持续时间，并将其赋值给相应的变量。\n\
    \n⑤判断主车是否静止（速度小于0.1），如果是，则直接返回warningFlag和adviser，即无须预警。\n\n⑥调用自定义函数my\\_calc\\\
    _distance，分别计算主车和信号灯路口之间的纵向、横向和直线距离。\n\n⑦计算主车以当前速度运动到路口的时间time\\_2\\_end和主车以当前速度在绿灯和黄灯持续时间内能够前进的距离pass\\\
    _time\\_dist。\n\n⑧若主车未通过路口，且与路口的距离不超过pass\\_time\\_dist，主车不是静止的，则将warningFlag设为1，并进行下一步判断。\n\
    \n⑨若当前为绿灯或黄灯，判断主车能否以当前速度通过路口，若可以，则将adviser设为keep；否则，计算主车能够通过路口所需的速度expectSpeed，不超过道路限速则将adviser设为speed\\\
    _up，将max\\_spd（当前主车速度）设为expectSpeed，若超过道路限速，则将adviser设为slow\\_down。进一步判断主车与信号灯路口距离是否小于10m，若满足则将warningFlag设为2，将adviser设为avoid\\\
    _redlight。\n\n⑩若当前为红灯，且在红灯剩余时间内，主车以当前速度不能到达信号灯路口，则将adviser设为keep；否则，将adviser设为slow\\\
    _down。此时max\\_spd即当前主车速度。进一步判断主车与信号灯路口距离是否小于10m，若满足则将warningFlag设为2，将adviser设为avoid\\\
    _redlight。\n\n⑪最终返回warningFlag、adviser和max\\_spd作为函数输出。\n\n下面给出了基于Python的GLOSA算法实现示例代码，供读者在学习时参考。\n\
    \n![](images/txt006_3.jpg \"pagenumber_ebook=138,pagenumber_book=128\")\n\n![](images/txt006_4.jpg\
    \ \"pagenumber_ebook=139,pagenumber_book=129\")\n\n![](images/txt006_5.jpg \"\
    pagenumber_ebook=139,pagenumber_book=129\")\n\n![](images/txt006_6.jpg \"pagenumber_ebook=139,pagenumber_book=129\"\
    )\n\n绿波车速引导算法代码\n\n![](images/txt006_7.jpg \"pagenumber_ebook=140,pagenumber_book=130\"\
    )\n\n![](images/txt006_8.jpg \"pagenumber_ebook=141,pagenumber_book=131\")\n\n\
    6.3　闯红灯预警技术\n\n6.3.1　闯红灯预警的定义\n\n闯红灯预警（Red Light Violation Warning，RLVW）是指，主车（HV）经过有信号控制的交叉口（车道），车辆存在不按信号灯规定或指示行驶的风险时，RLVW应用对驾驶员进行预警。本应用适用于城市、郊区道路及公路的交叉路口、环道出入口和可控车道、高速路入口和隧道等有信号控制的车道，闯红灯过程如图6.2所示。\n\
    \nRLVW应用可辅助驾驶员安全通过信号灯路口，提高信号灯路口的同行安全。\n\n![](images/txt006_9.jpg \"pagenumber_ebook=141,pagenumber_book=131\"\
    )\n\n图6.2　闯红灯过程\n\n6.3.2　闯红灯预警的主要场景\n\n当前方有大车遮挡视线（如图6.3所示）或恶劣天气影响视线，或其他原因，使HV无法对当前红灯或即将到来的红灯做出正确判断时，RLV\
    \ W应用检测H V当前所处位置和速度等，通过计算预测车头经过路口停止线时信号灯的状态，并向驾驶员进行预警。\n\n![](images/txt006_10.jpg\
    \ \"pagenumber_ebook=142,pagenumber_book=132\")\n\n图6.3　被大车遮挡信号灯\n\n6.3.3　闯红灯预警的基本原理与算法实现\n\
    \n当H V驶向具有信号灯控制的交叉路口（车道），遇信号灯即将变红灯或正处于红灯状态，但车辆未能停止在停止线内而继续前行时，RLVW应用将对该车驾驶员进行预警。触发RLVW功能的H\
    \ V与路口设施的位置关系如图6.4所示。\n\n![](images/txt006_11.jpg \"pagenumber_ebook=142,pagenumber_book=132\"\
    )\n\n图6.4　触发RLVW功能的H V与路口设施的位置关系\n\nRLVW的基本工作原理如下。\n\n①具有短程、远程通信能力的RSU定时发送路口地理位置信息和信号灯实时状态信息。\n\
    \n②H V依据本身GNSS地理信息，确定当前受管控信号的相位，并计算其与停止线的距离。\n\n③H V依据当前速度和其他交通参数预估到达路口的时间。\n\n\
    ④RLVW将这些信息与接收到的红灯切换时刻和红灯保留时长信息进行对比分析，决定是否预警。\n\n⑤当此时信号灯是红灯时，Trest·Vcur＜distend才会预警，其中Trest是当前灯的剩余时间，Vcur是H\
    \ V当前车速，distend是H V目前距离停车线的距离。如果H V距离停车线很近，则会进行停车预警。\n\n本书实现RLVW算法的具体思路如下：\n\n\
    ①定义一个函数doRLVW，它接受2个参数：hvInfo和spatInfo。hvInfo表示主车信息，spatInfo表示信号灯信息。\n\n②函数内部首先初始化两个变量：warning\\\
    _flag和adviser。warning\\_flag表示预警等级，其中0表示无须预警，1表示一般预警，2表示紧急预警。adviser表示建议类型，其中keep表示保持当前状态，slow\\\
    _down表示减速行驶，emergency\\_stop表示紧急停车。\n\n③从hvInfo中提取主车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。\n\
    \n④判断主车是否静止（速度小于0.1），如果是，则直接返回warning\\_flag和adviser，即无须预警。\n\n⑤从spatInfo中提取红绿灯信息，包括信号灯的当前状态及其剩余时间，以及红灯、绿灯、黄灯的持续时间。\n\
    \n⑥调用自定义函数my\\_calc\\_distance，分别计算主车和信号灯路口之间的纵向、横向和直线距离。\n\n⑦计算主车以当前速度在当前信号灯剩余时间内能够前进的距离。\n\
    \n⑧若当前为红灯，且在红灯剩余时间内，主车以当前速度能够到达信号灯路口，则将warning\\_flag设为1，将adviser设为slow\\_down；若红灯时主车距离路口小于5m，则将warning\\\
    _flag设为2，将adviser设为emergency\\_stop。\n\n⑨最终返回warning\\_flag和adviser作为函数输出。\n\n\
    下面给出了基于Python的RLVW算法实现示例代码，供读者在学习时参考。"
