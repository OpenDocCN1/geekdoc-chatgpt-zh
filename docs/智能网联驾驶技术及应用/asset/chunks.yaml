    为支撑中国方案智能网联汽车的创新发展，我国从技术研发、测试示范、产品管理、网络安全保障、地理信息安全、标准体系建设、跨界融合发展等多个方面搭建完善的支持政策体系，开展专项试点示范活动。工业和信息化部、科技技术部加大力度支持基础前沿技术与共性关键技术创新，相关部门加强合作协同，形成覆盖“研发、测试、示范、规模部署、商业化推广、融合发展、安全保障”的智能网联汽车创新与应用支撑体系。各地在国家统筹下，推动国家级测试示范区、交通强国试点、车联网先导区、双智试点、自动驾驶先导应用试点等建设。


    在有关部门和各方面的共同推动下，我国智能网联产业在产品落地、应用推广、关键技术攻关和基础设施部署等多个方面全面推进，取得了显著成果。2022 年 1—11
    月，我国具备 L2 级别智能驾驶辅助功能的乘用车销量超 800 万辆，其渗透率升至 33.6％。L4 级别自动驾驶示范落地加速推进，全国开放的各级测试公路超过
    7000 千米，实际道路测试里程超过 4000 万千米。


    一汽红旗、上汽、广汽、吉利、长城、蔚来、长安福特等车企业发布搭载 5G-V2X 技术的量产车型。多地加快部署 5G 通信、路侧联网设备等基础设施，截至 2022
    年 6 月，我国已部署的路侧基础通信设施超过 6200 台，并且我国加大交通设备数字化改造力度，开展车路协同试点，推动政策法规创新。


    预计到 2028 年，车端能够实现 C-V2X 终端新车装配的基本普及、C-ADAS 功能在 DA、PA 级智能网联汽车中的大规模应用、具备 CAD 功能的车辆的商业化应用；在路端，一、二线重点城市交叉口信号灯联网覆盖率达到
    100％，路侧感知和计算能力可支持 C-ADAS 和 CAD 在交叉口场景类的功能；高速公路分合流区及隧道路侧感知覆盖率达到 50％，且可支持部分 C-ADAS
    和 CAD 的高速场景类功能；具备自主泊车辅助（Automated Valet Parking，AVP）功能的停车场数量大于 2000。从更远的发展目标来说，车路云一体化的自动驾驶能够全面实现，包括通信网络、路侧基础设施、云控基础平台的新一代基础设施体系的全面建成。车路云一体化的新型产业生态体系逐步完善，满足人民不断增长的出行和运输需求。


    ## 1.4 智能网联驾驶系统认知台架实验

    ![](img/txt001_11.jpg "pagenumber_ebook=26,pagenumber_book=16")


    智能网联驾驶


    我们设计开发了一个名为“车路协同教学系统”的智能网联驾驶教系统认知台架实验学平台，这个平台可进行一系列的智能网联驾驶系统实验。由于这些实验内容与本书所介绍的内容具有较强的关联性，所以将实验一并编入书中以供参考。


    本章我们介绍教学平台上的第一个实验——智能网联驾驶系统认知台架实验。


    ### 1.4.1 实验目的

    本节通过对教学台架的整体结构和组件的介绍，并结合场景演示，可以让读者认识智能网联驾驶系统，了解智能网联驾驶教学台架的组成和各项功能并熟悉台架的操作方式。


