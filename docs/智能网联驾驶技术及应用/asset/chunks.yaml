    )\n\n5.交通灯相位与时序消息\n\n1）定义\n\n交通灯相位与时序消息（Signal Phase Timing Message，SPAT）包含了一个或多个路口信号灯的当前状态信息。结合MAP，可为车辆提供实时的前方信号灯相位信息。SPAT的使用场景如图4.10所示。\n\
    \n![](images/txt004_19.jpg \"pagenumber_ebook=101,pagenumber_book=91\")\n\n图4.10　SPAT消息使用场景\n\
    \n2）消息主体结构及说明\n\nSPAT同样包含消息ID、发送时间戳、字符串描述。SPAT的主体信息为信号灯状态集合，道路交通中的信号灯设在路口处，并主要指示信号灯的颜色及持续时间的信息。因此在SPAT中，需要定义路口ID、信号灯相位状态。其中的信号灯相位状态就是信号灯的颜色、剩余时间，可能也会包括信号灯的下一个相位状态。\n\
