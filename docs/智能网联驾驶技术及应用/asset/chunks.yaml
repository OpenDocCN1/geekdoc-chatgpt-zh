    ## 7.3 紧急车辆提醒技术


    ### 7.3.1 紧急车辆提醒的定义

    紧急车辆提醒（Emergency Vehicle Warning，EVW）是指，主车（HV）在行驶过程中，收到紧急车辆提醒，以对消防车、救护车、警车或其他紧急呼叫车辆进行让行。EVW应用使HV实现对消防车、救护车、警车或其他紧急呼叫车辆的让行。


    ### 7.3.2 紧急车辆提醒的主要场景

    当紧急车辆RV接近HV时，提示HV让行的典型场景如图7.2所示，具体描述如下。

    ①HV行驶中，紧急车辆RV接近HV。

    ②HV和紧急车辆RV需具备短程无线通信能力。

    ③HV收到紧急车辆RV提醒时，对其进行让行。

    ![](images/txt007_7.jpg "pagenumber_ebook=155,pagenumber_book=145")

    图7.2 当紧急车辆RV接近HV时，提示HV让行


    ### 7.3.3 紧急车辆提醒的基本工作原理与算法实现

    EVW的基本工作原理如下。

    ①分析接收到的紧急车辆RV的消息，筛选出位于HV受影响区域的紧急车辆RV。

    ②将处于一定范围内的紧急车辆RV作为优先让行紧急车辆。

    ③计算优先让行紧急车辆RV到达的时间和距离。

    本书实现EVW算法的具体思路如下。

    ①定义一个函数`doEVW()`，它接受两个参数：`hvInfo`和`rvInfo`。`hvInfo`和`rvInfo`分别表示主车和远车的信息。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中0表示无须预警，2表示需要变道预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`lane_change`表示进行变道。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，以及远车的刹车、灯光和abs状态，并将其赋值给相应的变量。

    ④调用`my_calc_distance()`自定义函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。

    ⑤若主车和远车同时满足以下3个条件，则将`warning_flag`设为1，并进行下一步判断：远车是紧急车辆、主车速度大于0.1且远车与主车后方的距离小于80m。

    ⑥若两车位于同一车道且远车位于主车后方20m范围内，则将`warning_flag`设为2，并将`adviser`设为`lane_change`。

    ⑦最终返回`warning_flag`和`adviser`作为函数输出。

