    \n\uFEFF\n\n第5章　智能网联驾驶碰撞预警应用\n\n5.1　碰撞预警场景介绍\n\n![](images/txt005_1.jpg \"pagenumber_ebook=110,pagenumber_book=100\"\
    )\n\n智能网联驾驶碰撞预警应用\n\n碰撞类交通事故在所有交通事故类型中有较高的占比，且碰撞类交通事故由于撞击会对车体造成比较大的破坏，一般会导致比较严重的后果，对车辆及乘客造成的伤害较其他类型的交通事故更为严重，因此如何持续有效减少碰撞类交通事故的发生及减小碰撞危害是交通从业者面临的难题。\n\
    \n从事故发生的原因来看，碰撞类交通事故不外乎是司机、车辆和环境三要素互相作用造成的，如驾驶员在行驶过程中由于接打电话、疲劳、环境影响造成注意力分散，或两车车距较近，前车急刹时来不及反应等容易导致追尾、剐蹭等事故的发生；在行车过程中车身、障碍物遮挡等极容易使驾驶员存在视野盲区，导致车辆在进行变道、途经复杂路口时由于观察不到视野盲区内的车辆、行人而造成碰撞事故的发生；恶劣或极端天气（如浓雾、暴雨）导致驾驶员的观察距离有限，刹车、制动效果受影响，也很容易造成碰撞事故的发生。\n\
    \n因此针对各种潜在的碰撞风险，提前有效的预警是必要的，通过提醒驾驶员未曾注意到的风险，避免事故发生或降低伤害程度。\n\n对V2X技术而言，搭载了智能车载终端的车辆能够相互之间通信，互相知晓其驾驶状态和意图，能有效减少车车之间的碰撞，如追尾、盲区剐蹭、交叉路口相撞，并能够通过车载HMI终端对驾驶员进行预警。\n\
    \n此外，对V2X技术的落地应用性而言，该技术还具有传统ADAS不可比拟的优势。V2X技术对于碰撞事件的预测主要基于高精度全球导航卫星系统（Global Navigation\
    \ Satellite System，GNSS）的采样频率、精准度以及预测算法精度，对于数据交互的频率及时延并没有极高的要求，只要能和GNSS采样大抵匹配即可，这样即可以降低预警预测对于时间同步的要求，也能够减少对设备计算性能的消耗。\n\
    \n5.2　前向碰撞预警技术\n\n5.2.1　前向碰撞预警的定义\n\n前向碰撞预警（Forward Collision Warning，FCW）是指主车（HV）在车道上行驶，与在正前方同一车道的远车（RV）存在追尾碰撞危险时，前向碰撞预警应用将对HV驾驶员进行预警。本应用适用于普通道路或高速公路等车辆追尾碰撞危险的预警。前向碰撞预警应用辅助驾驶员避免或减小前向碰撞危害，提高道路行驶的安全系数。\n\
    \n5.2.2　前向碰撞预警的主要场景\n\n根据功能定义描述可知，当HV（主车）与同车道RV（远车）之间的相对距离小于阈值时FCW功能触发。FCW包括如下4种主要场景。\n\
    \n场景一：HV（主车）正常行驶，RV（远车）在位于HV同一车道的正前方停止，如图5.1所示。HV行驶过程中在即将与RV发生碰撞时，FCW应用对HV驾驶员发出预警，提醒驾驶员与位于正前方的车辆RV存在碰撞危险；预警时机需确保HV驾驶员收到预警后，能有足够的时间采取措施，避免与RV发生追尾碰撞。在此过程中，HV和RV需具备短程无线通信（如LTE-V2X）能力。\n\
    \n![](images/txt005_2.jpg \"pagenumber_ebook=111,pagenumber_book=101\")\n\n图5.1　HV行驶，RV在同一车道的正前方停止\n\
    \n场景二：HV正常行驶，RV在位于HV相邻车道的前方停止，如图5.2所示。HV行驶过程中不会与RV发生碰撞，HV驾驶员不会收到FCW预警信息。在此过程中，HV和RV需具备短程无线通信能力。\n\
    \n场景三：HV正常行驶，RV位于HV同一车道的正前方慢速或减速行驶，如图5.3所示。HV行驶过程中在即将与RV发生碰撞时，FCW应用对HV驾驶员发出预警，提醒驾驶员与位于正前方的车辆RV存在碰撞危险；预警时机需确保HV驾驶员收到预警后，能有足够的时间采取措施，避免与RV发生追尾碰撞。在此过程中，HV和RV需具备短程无线通信能力。\n\
    \n![](images/txt005_3.jpg \"pagenumber_ebook=112,pagenumber_book=102\")\n\n图5.2　H\
    \ V行驶，RV在相邻车道的前方停止\n\n![](images/txt005_4.jpg \"pagenumber_ebook=112,pagenumber_book=102\"\
    )\n\n图5.3　H V行驶，RV在同一车道的正前方慢速或减速行驶\n\n场景四：H V跟随RV-2正常行驶，RV-1在同一车道上RV-2的正前方停止，H\
    \ V的视线被RV-2所遮挡，如图5.4所示。RV-2为了避开RV-1进行变道行驶；H V行驶过程中在即将与RV-1发生碰撞时，FCW应用对H V驾驶员发出预警，提醒驾驶员与位于正前方的RV-1存在碰撞危险；预警时机需确保H\
    \ V驾驶员收到预警后，能有足够的时间采取措施，避免与RV-1发生追尾碰撞。在此过程中，H V和RV-1需具备短程无线通信能力，RV-2是否具备短程无线通信能力不影响应用场景的有效性。\n\
    \n![](images/txt005_5.jpg \"pagenumber_ebook=112,pagenumber_book=102\")\n\n图5.4　H\
    \ V跟随RV-2正常行驶，RV-1在同一车道上RV-2的正前方停止\n\n5.2.3　前向碰撞预警的基本原理与算法实现"
