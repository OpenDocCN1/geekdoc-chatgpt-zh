    )\n\n为支撑中国方案智能网联汽车的创新发展，我国从技术研发、测试示范、产品管理、网络安全保障、地理信息安全、标准体系建设、跨界融合发展等多个方面搭建完善的支持政策体系，开展专项试点示范活动。工业和信息化部、科技技术部加大力度支持基础前沿技术与共性关键技术创新，相关部门加强合作协同，形成覆盖“研发、测试、示范、规模部署、商业化推广、融合发展、安全保障”的智能网联汽车创新与应用支撑体系。各地在国家统筹下，推动国家级测试示范区、交通强国试点、车联网先导区、双智试点、自动驾驶先导应用试点等建设。\n\
    \n在有关部门和各方面的共同推动下，我国智能网联产业在产品落地、应用推广、关键技术攻关和基础设施部署等多个方面全面推进，取得了显著成果。2022年1—11月，我国具备L2级别智能驾驶辅助功能的乘用车销量超800万辆，其渗透率升至33.6％。L4级别自动驾驶示范落地加速推进，全国开放的各级测试公路超过7000千米，实际道路测试里程超过4000万千米。\n\
    \n一汽红旗、上汽、广汽、吉利、长城、蔚来、长安福特等车企业发布搭载5G-V2X技术的量产车型。多地加快部署5G通信、路侧联网设备等基础设施，截至2022年6月，我国已部署的路侧基础通信设施超过6200台，并且我国加大交通设备数字化改造力度，开展车路协同试点，推动政策法规创新。\n\
    \n预计到2028年，车端能够实现C-V2X终端新车装配的基本普及、C-ADAS功能在DA、PA级智能网联汽车中的大规模应用、具备CAD功能的车辆的商业化应用；在路端，一、二线重点城市交叉口信号灯联网覆盖率达到100％，路侧感知和计算能力可支持C-ADAS和CAD在交叉口场景类的功能；高速公路分合流区及隧道路侧感知覆盖率达到50％，且可支持部分C-ADAS和CAD的高速场景类功能；具备自主泊车辅助（Automated\
    \ Valet Parking，AVP）功能的停车场数量大于2000。从更远的发展目标来说，车路云一体化的自动驾驶能够全面实现，包括通信网络、路侧基础设施、云控基础平台的新一代基础设施体系的全面建成。车路云一体化的新型产业生态体系逐步完善，满足人民不断增长的出行和运输需求。\n\
