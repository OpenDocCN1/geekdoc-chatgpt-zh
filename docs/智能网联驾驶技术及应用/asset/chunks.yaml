    ## 5.5 盲区预警/变道预警技术

    ### 5.5.1 盲区预警/变道预警的定义

    盲区预警/变道预警（`Blind Spot Warning/Lane Change Warning`，`BSW/LCW`）是指，当主车（`HV`）的相邻车道上有同向行驶的远车（`RV`）出现在`HV`盲区时，`BSW/LCW`应用对`HV`驾驶员进行预警；当主车（`HV`）准备实施变道操作（如激活转向灯等）时，若此时其相邻车道上有同向行驶的远车（`RV`）处于或即将进入`HV`盲区，`LCW`应用对`HV`驾驶员进行预警。本应用适用于普通道路或高速公路等车辆变道可能存在碰撞危险的预警。


    `BSW/LCW`应用避免车辆变道时，与相邻车道上的车辆发生侧向碰撞，提高变道安全。


    ### 5.5.2 盲区预警/变道预警的主要场景

    `BSW/LCW`包括如下主要场景。

    场景一：`HV`在本车道内行驶，`RV`在`HV`相邻车道内同向行驶，且`RV`处于`HV`盲区内，如图 5.12 所示。`BSW`应用提醒`HV`驾驶员其盲区内存在车辆`RV`。若此时检测到`HV`驾驶员有向`RV`所在车道变道的意图（如激活转向灯等），则`LCW`应用对`HV`驾驶员发出预警。预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与相邻车道上的`RV`发生碰撞。


    ![](img/txt005_25.jpg "pagenumber_ebook=123,pagenumber_book=113")

    图 5.12　`RV`在`HV`盲区内


    场景二：`HV`在本车道内行驶，`RV`在相邻车道上与`HV`同向行驶，且即将进入`HV`的盲区，如图 5.13 所示。`BSW`应用提醒`HV`驾驶员即将有车辆进入其盲区。若此时检测到`HV`驾驶员有向`RV`所在车道变道的意图（如激活转向灯），则`LCW`应用对`HV`驾驶员发出预警。预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与相邻车道上的`RV`发生碰撞。


    ![](img/txt005_26.jpg "pagenumber_ebook=124,pagenumber_book=114")

    图 5.13　`RV`即将进入`HV`盲区


    ### 5.5.3 盲区预警/变道预警的基本原理与算法实现

    当`HV`意图换道时，若检测到相邻车道上与`HV`同向行驶的车辆`RV`处于或即将进入`HV`盲区，则`BSW/LCW`应用会对`HV`驾驶员进行预警。触发`BSW/LCW`功能的`HV`和`RV`的位置关系如图
    5.14 所示。`BSW/LCW`应用适用于直道和弯道情形。


    ![](img/txt005_27.jpg "pagenumber_ebook=124,pagenumber_book=114")

    图 5.14　触发`BSW/LCW`功能的`HV`和`RV`的位置关系


    `BSW/LCW`的基本工作原理如下。

    ①从接收到的`RV`消息中，筛选出位于`HV`左后相邻车道和右后相邻车道的`RV`作为潜在威胁车辆。

    ②判断潜在威胁车辆是否处于或即将进入`HV`盲区。

    ③如果潜在威胁车辆处于或即将进入`HV`盲区，首先对`HV`驾驶员进行`BSW`提醒。

    ④如果潜在威胁车辆处于或即将进入`HV`盲区，而`HV`此时有变道操作，则对`HV`驾驶员进行`LCW`报警。

    ⑤系统通过`HMI`对`HV`驾驶员进行提醒或报警。


    本书实现`BSW`算法的具体思路如下：

    ①定义一个函数`doBSW`，它接受两个参数——`hvInfo`和`rvInfo`，这两个参数分别表示主车和远车的信息。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中 0 表示无须预警，1 表示需要变道预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`changelane`表示变道。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的 x 坐标和 y 坐标、速度、航向角、尺寸、车辆类型、刹车状态、灯光状态和`abs`状态，并将其赋值给相应的变量。

    ④调用`my_calc_distance`函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。

    ⑤判断主车到远车之间是否满足以下条件，若满足则将`warning_flag`设为 1，并将`adviser`设为`keep`：纵向距离绝对值小于 15、两车在相邻的车道上、主车速度减去远车速度小于或等于
    4（两车速度差不大）。

    ⑥最终返回`warning_flag`和`adviser`作为函数输出。


