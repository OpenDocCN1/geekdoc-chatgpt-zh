- raw: "车载单元会根据自身的定位与运行方向，以及消息本身提供的时效信息、关联区域/路段范围，来判定事件或标志的生效区域。\n\n![](images/txt004_13.jpg\
    \ \"pagenumber_ebook=96,pagenumber_book=86\")\n\n图4.6　RSI的使用场景\n\n2）消息主体结构及说明\n\
    \n路侧信息由RSU提供，RSU消息中包含消息序号以及发送时间，同时还包括RSU的ID，该ID用于区分不同的消息发送方。为方便RSI作用范围内的位置描述，提供本消息作用范围内的参考三维位置坐标，消息中所有的位置偏移量均基于该参考坐标计算，真实位置坐标等于偏移量加上参考坐标。\n\
    \n道路交通中的交通事件信息和交通标志信息也会由路侧信息来提供。交通事件（Road Traffic Event，RTE）可能包括多个，其信息从信息源、发生区域、时效、优先级、事件置信度以及影响区域等方面来描述，除使用事件编号ID来区分事件外，还可使用字符串文本描述来进一步定义该事件。区域大小定义为以中心点为圆心的某个半径大小的范围内。\n\
    \n交通标志信息（Road Traffic Sign，RTS）同样具备ID、文字描述的字段内容，根据实际道路交通中的标志，可定义路侧信息中关于交通标志的信息定义，包括标志的位置信息、类型、起止时间及置信度、优先级等。\n\
    \n交通事件信息和交通标志信息都可通过定义关联路径以及关联路段与MAP的配合，帮助车载单元判定事件和标志的影响区域。\n\n图4.7给出了RSI的主体结构，其中实线框为必有项，虚线框为可选项。\n\
    \n3）RSI应用\n\nRSI通常用于事件的下发，向周围车载单元发布交通事件信息以及交通标志信息。车载单元会根据自身的定位与运行方向，以及消息本身提供的区域范围，来判定消息的生效区域，而后向驾驶员推送。RSI传递的是与道路相关的一些预警或提示信息，不用于车辆的求救或其他安全应用。\n\
    \n在场景应用方面，结合车辆自身BSM和RSI中的位置和交通事件集合可进行道路危险状况提示，使得行经该路段的车辆根据信息及时采取避让措施，避免发生事故。RSI中的交通标志集合信息，与BSM中的车辆自身信息以及MAP中的路段和车道信息，可应用于车内标牌。\n\
    \n应用根据上述信息，计算出自车在路网中的位置，并判断前方是否有交通标识牌，如果有，则通过车内交通标牌对驾驶员进行提示，车内交通标牌会在消息有效的区域和时间段内亮起。同理，对地图中的道路交通拥堵状况可进行提示，进而帮助车辆重新规划路线，缓解交通压力，减少拥堵时间。\n\
    \n4）RSI的ASN.1代码\n\nRSI的ASN.1代码如下：\n\n![](images/txt004_14.jpg \"pagenumber_ebook=97,pagenumber_book=87\"\
    )\n\n![](images/txt004_15.jpg \"pagenumber_ebook=98,pagenumber_book=88\")\n\n\
    图4.7　RSI的主体结构\n\n4.路侧安全消息\n\n1）定义\n\n路侧安全消息（Road Safety Message，RSM）：路侧单元通过路侧本身拥有的相应感知识别手段，得到的其周边交通参与者（这里的交通参与者包括路侧单元本身、周围车辆、非机动车、行人等）的实时状态信息，并将这些信息整理成本消息体所定义的格式，将其作为这些交通参与者的基本安全状态信息（类似于BSM），广播给周边车辆，支持这些车辆的相关应用。\n\
    \nRSM的存在使得车辆对于周围环境的感知不仅仅依赖BSM。路侧单元基于路侧传感器，帮助车辆对其周围的环境进行了探测，并将实时信息通过RSM传递给车辆。\n\
    \nRSM的使用场景如图4.8所示。\n\n![](images/txt004_16.jpg \"pagenumber_ebook=99,pagenumber_book=89\"\
    )\n\n图4.8　RSM的使用场景\n\n2）消息主体结构及说明\n\nRSM具备消息的ID和不同消息发送方RSU的ID的字段。RSM中的位置信息字段用来提供本消息作用范围内的参考三维位置坐标，消息中所有的位置偏移量均基于该参考坐标计算，真实位置坐标等于偏移量加上参考坐标。\n\
    \nRSU获取路侧感知单元检测的所有或部分周边交通参与者的信息并将其组成RSM的参与者列表信息，这部分信息实际上相当于BSM中OBU广播的自身车辆信息，信息内容组成与BSM类似，只不过由RSU获取感知信息并发送给周边其他车辆，一些只能由车辆自身提供的信息（如刹车状态）则无法在RSM中体现。\n\
    \n当某参与者信息来源于RSU收到的BSM时，其中的车辆ID字段必须与BSM中的车辆ID字段一致。当消息中包含非机动车、行人等交通参与者时，RSM可减去属于机动车部分的信息字段。\n\
    \n图4.9给出了RSM的主体结构，其中实线框为必有项，虚线框为可选项。\n\n![](images/txt004_17.jpg \"pagenumber_ebook=100,pagenumber_book=90\"\
    )\n\n图4.9　RSM的主体结构\n\n3）RSM应用\n\nRSM主要对接路侧的感知设备和边缘计算设备，用于道路事件的识别，比如车辆发生事故、车辆异常、异物闯入等，通过路侧设备本身拥有的相应感知识别技术，得到其周边交通参与者的实时状态信息，并将这些信息整理成本消息体所定义的格式。RSM的存在使车辆对周围环境的感知不仅仅依赖BSM。路侧单元基于路侧传感器，帮助车辆对其周围的环境进行探测，获得超视距的感知。\n\
    \n在场景应用方面，RSM中包含的行人感知信息可用于弱势交通参与者碰撞预警场景，该场景可分为前车遮挡视野盲区内的行人碰撞和倒车视野盲区的行人碰撞，可通过RSM进行预警提醒。\n\
