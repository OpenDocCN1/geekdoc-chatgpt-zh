    3.3　5G-V2X技术


    3.3.1　5G-V2X技术的定义与架构


    1.5G-V2X技术的定义


    5G是第五代移动通信系统，是4G的延伸，是对现有无线接入技术（包括3G、4G和Wi-Fi）的技术演进，是一些新增的补充性无线接入技术集成后解决方案的总称。从某种程度上来讲，5G是一个真正意义上的融合网络，以融合和统一的标准，提供人与人、人与物及物与物之间高速、安全和自由的连通。除了要满足超高速的传输需求外，5G还需满足超大带宽、超高容量、超可靠性、随时随地可接入等要求。


    5G-V2X技术（又名NR-V2X技术），是在传统C-V2X的基础上，引入5G网络和边缘计算（Mobile Edge Computing），充分利用5G网络的高带宽、高可靠性和低时延等特性，挖掘边缘计算的潜能，助力智能网联驾驶。


    2.5G-V2X技术的架构


    5G-V2X的网络架构\[20，26\]如图3.5所示，5G-V2X的网络架构接口说明如表3.4所示。在5G-V2X网络架构中，主要功能实体如下。


    ![](images/txt003_9.jpg "pagenumber_ebook=72,pagenumber_book=62")


    图3.5　5G-V2X的网络架构\[20\]


    ①V2X应用服务器：位于蜂窝网之外的V2X管理实体，提供对全局V2X通信的策略和参数的管理功能，以及对V2X终端的签约信息和鉴权信息的管理功能。


    ②5G核心网：与V2X应用服务器连接，为蜂窝覆盖内的V2X终端提供对V2X通信的策略和参数配置及签约信息和鉴权信息的管理功能。与4G核心网不同，5G核心网采用了服务化架构，各个网络功能可以独立演进和扩展，相应的功能实体如下。


    ·统一数据存储库（Unified Data Repository，UDR）功能扩展，用于存储V2X通信所有参数配置的数据库，可以根据V2X应用服务器的数据进行更新。


    ·策略控制功能（Policy Control Function，PCF）扩展，用于V2X终端的鉴权信息管理，以及V2X通信（PC5和Uu）的策略和参数管理，其中PCF通过UDR实现参数更新。


    ·网络存储库功能（Network Repository Function，NRF）扩展，主要根据V2X终端能力上报的信息，选择和发现对应的PCF配置。


    ·统一数据管理（Unified Data Management，UDM）功能扩展，用于V2X终端PC5接口通信的签约信息管理。


    ·接入和移动性管理功能（Access and Mobility Management Function，AMF）扩展。一方面，根据PCF提供的V2X配置信息给终端提供PC5口通信的策略和参数配置信息；另一方面，根据PCF和UDM提供的信息，管理终端PC5口签约和授权状态的上下文信息。


    ③4G核心网：与V2X应用服务器连接，通过VCF为蜂窝覆盖内的V2X终端提供V2X通信的策略和参数配置，以及签约信息和鉴权信息的管理。


    ④5G接入网/4G接入网：不同于核心网负责业务的处理，接入网主要负责用户的接入，对于所接入的业务提供承载能力。


    ⑤UE：根据获取的V2X通信的策略和参数配置信息，在PC5或者Uu接口上进行V2X通信。


    表3.4　5G-V2X的网络架构接口说明


    ![](images/txt003_10.jpg "pagenumber_ebook=73,pagenumber_book=63")


    目前车路协同5G-V2X主要的研究方向包括安全（如碰撞、辅助、停车、逆行等）、效率（如交通拥堵等），以及服务信息等，其重点解决自动驾驶问题，让自动驾驶更加智能，并服务未来的车辆编队、高级驾驶、传感器扩展以及远程驾驶等。


    ①车辆编队。利用5G NR-V2X低时延和大带宽的基础特点，支持一组车辆组成车队行驶，所有编队行驶的车辆能够从头车获取信息，并实现这样一个传感器的信息共享，使得同步车辆可以保持密集的超短车距。


    ②高级驾驶。利用5G NR-V2X低时延和大带宽的基础特点，通过相邻车辆之间共享感知数据，共享本车的驾驶意图，实现驾驶策略的协调与同步功能。


    ③传感器扩展。要求交通参与者扩展传感器的感知范围，如在车与车、车与云、车与基础设施之间（即V2V、V2N、V2I）实现车载传感器的交互，以获得当前更全面的道路信息，补充目前单车智能超短视距以及非视距的感知情况。


    ④远程驾驶。针对无法驾驶的乘客或者处于危险环境中的车辆，包括远程车辆，通过5G通信、车路人协同、云计算以及自动控制等技术，实现远程的驾驶员对远端的车辆进行远程监控和远程操控。


    3.3.2　5G-V2X的关键技术


    为满足自动驾驶等车联网业务低时延、大带宽的需求，5G-V2X通信技术在车联网系统中发挥着至关重要的作用：一方面，Uu接口基于5G蜂窝网络技术大带宽、低时延、高可靠的特性，能够支持车辆、交通基础设施、人、云端平台之间信息的快速传输，并支持广域覆盖通信能力；另一方面，需要NR
    PC5提供车车和车路等近距离直连通信能力。此外，5G-V2X中允许Uu实现针对PC5接口的资源调度，以便合理地分配直连通信传输资源，在保障拥塞情况下NR PC5直连通信的可靠性满足自动驾驶安全可靠通信的需求。因此，5G-V2X中Uu蜂窝网络与NR
    PC5相互协作、融合，实现网络的无缝覆盖，将有效满足“车-路-云”之间的高速信息交互与传输的要求。


    作为C-V2X研究和标准化的第二阶段，5G-V2X主要通过通信模式管理、服务质量管理以及直通链路的HARQ反馈机制、同步机制等关键技术，满足增强车联网应用的通信需求。


    1）5G-V2X通信模式管理技术


    在5G-V2X设计中，一个重要的技术特征是支持直通链路上的单播、广播和多播等通信模式。5G-V2X通信模式管理主要是V2X应用层管理\[26\]。5G-V2X的策略和参数配置信息中包括V2X广播、多播和单播通信模式管理配置，主要包括如下方面。


    ·V2X应用的业务标识与V2X通信的广播、多播和单播通信模式的映射关系及配置策略。


    ·V2X应用的业务标识与层二目标标识的映射关系及配置策略。'
  fmt: '

    陈山枝博士及大唐研究团队在2013年5月17日（国际电信日）最早提出了`LTE-V2X`的概念与关键技术，确立了`C-V2X`的基本系统架构、技术原理和技术路线。作为蜂窝网络技术支持车联网通信的第一阶段，`LTE-V2X`首次有机结合了蜂窝通信技术和直通通信技术，以LTE系统为蓝本对系统架构进行了针对性优化和增强设计，相应的物理层信道结构、资源分配方法、同步机制等技术原理都成为满足低时延、高可靠的车联网通信需求的重要基础。


    ## 1. 通信模式


    结合了蜂窝通信技术与直通通信技术的`LTE-V2X`包含两种通信模式。


    ### 1）蜂窝网络模式（`LTE-V-cell`）


    蜂窝网络模式也称为集中式，该模式需要基站作为控制中心，其主要工作原理如下：终端和基站之间通过`Uu`接口通信，基站作为集中式的控制中心和数据信息转发中心，完成集中式无线资源调度、拥塞控制和干扰协调，如图3.3所示。


    该模式使用传统移动宽带许可频段，适用于长程业务（大于1千米），如前方事故等消息的发送。


    ![](images/txt003_6.jpg "pagenumber_ebook=67,pagenumber_book=57")


    图3.3　蜂窝网络模式


    ### 2）直通通信模式（`LTE-V-direct`）


    直通通信模式又称为分布式，该模式无须基站作为支撑。车、人、路之间通过`PC5`接口实现短距离直连通信，用于解决车联网中终端间低时延、高可靠传输的问题，如图3.4所示。


    该模式使用ITS频段（如ITS5.9GHz），可独立于蜂窝网络运作，适用于短程业务（小于1千米），如位置、速度等消息的分发。


    ![](images/txt003_7.jpg "pagenumber_ebook=68,pagenumber_book=58")


    图3.4　直连通信模式


    这两种通信模式共同支持车联网多样化的应用需求。蜂窝网络模式和直通通信模式的优势互补，通过合理分配系统负荷，自适应快速实现车联网业务高可靠和连续通信：`Uu`接口基于4G/5G频段支持时延不敏感业务（如地图下载、信息娱乐等业务）；`PC5`接口基于ITS专用频段支持低时延、高可靠业务（如`V2V`、`V2I`、`V2P`等道路安全业务）。


    另外，`LTE-V2X`技术通过增加V2X应用层与接入层间的适配层，实现了通信模式智能选择，支持业务分流控制、无线传输控制、业务质量管理、连接控制管理等功能。


    ## 2. 物理层关键技术


    `LTE-V2X`的物理层设计面临以下技术挑战和难题：V2X业务低时延、高可靠为严苛通信需求；V2X通信系统中较高的节点度和较大的业务量，要求尽量提升系统资源利用率；由于车辆高速移动带来的多普勒频移影响，现有的频偏估计方案不能满足要求；V2X工作的高载频带来的频偏对信道估计产生了巨大挑战；由于无线通信半双工的限制，任一时刻只能接收或发送，这对可靠性和系统容量等造成影响。在蜂窝通信系统中，终端和基站一对一进行上下行通信；而在V2X通信系统中，需要支持不同时刻和不同距离的多对多节点间通信，接收功率变化范围大（可达80dB），同时由于远近效应的影响，信号泄漏对邻频接收信号的干扰较大\[23\]。


    针对以上技术挑战和难题，为了加快技术标准的研究开发进度，`LTE-V2X`的物理层设计中，对于`LTE-Uu`口尽量复用LTE4G蜂窝网络的设计，只做必要的技术增强设计；而对于`LTE-V2X`最重要的终端间基于`PC5`口的直通通信、基于支持直通通信的LTE4G蜂窝通信技术进行优化设计，以便满足`LTE-V2X`
    `PC5`的直通通信需求。


    `LTE-V2X`直通链路物理层设计沿用支持直通通信的LTE4G蜂窝通信技术`PC5`口的物理层基本框架，主要体现在传输波形、时频资源定义以及传输信道处理流程等方面。针对V2X特点进行的物理层优化设计主要体现在解调参考信号（Demodulation
    Reference Signal，`DMRS`）设计、控制信道和设计数据信道复用方式，以及自动增益控制（Automatic Gain Control，`AGC`）设计上。


    ## 3. 资源分配方法


    由于`LTE-V2X` `PC5`系统中分布式节点间可能通过共享资源池中的无线资源进行传输，因此如何对有限的无线资源进行合理分配和有效管理，成为需要重点解决的问题，以便支持V2X应用性能，减少系统干扰，提升系统容量及达到联合的最佳状态。`LTE-V2X`的资源分配方法需要考虑以下因素\[24\]。


    业务需求：`LTE-V2X`面向基本道路安全应用，V2X业务具有低时延、高可靠的严苛通信需求。


    多对多广播通信：蜂窝通信的基本通信方式是终端和基站间的点对点通信，而`LTE-V2X`中是单点对多点和多点对多点的广播方式。多种因素影响多对多通信的可靠性和资源利用率，如车辆快速移动导致的网络拓扑变化快问题、无线通信半双工的影响，以及远近效应、邻频泄漏以及资源碰撞等带来的干扰影响等。


    集中式和分布式资源分配方法：与蜂窝通信基站的依赖关系会影响资源分配方法的设计，如需满足覆盖内必须支持集中式资源分配方法、覆盖外必须支持分布式资源分配方法，此外，集中式分配机制中还需进一步考虑终端和基站交互的信令开销、时延等因素。


    地理位置信息：`LTE-V2X`终端间需要周期性交互状态信息的消息（必须包括位置信息），而蜂窝网络的节点不一定能获得位置信息。利用车联网特有的位置信息进行资源管理，可减少干扰，提高资源利用率。


    手持终端（Pedestrian UE，`P-UE`）的节电需求：`P-UE`指行人、自行车等弱势交通参与者使用的终端，车载终端或路侧设备由于可获得持续供电，不需要考虑节电问题，而`P-UE`与蜂窝网络终端类似，需要考虑节电问题，并考虑与车载终端进行通信的兼容设计。


    基于终端的直通通信具有时延低、通信容量大和频谱利用率高等优点，是V2X安全类业务的基本工作方式。根据`PC5`口的资源分配方法和蜂窝通信基站的关系，资源分配方法可分为以下两种。


    模式4：`UE`自主资源选择（分布式资源分配方法）。自主资源选择机制不通过基站调度进行`UE`间直通通信，避免了基站调度的信令开销。`UE`与基站间是松耦合的关系，`UE`对蜂窝网络和基站的依赖性降低。车辆可能行驶在蜂窝网络覆盖内、蜂窝网络覆盖外等不同场景，需要保证V2X业务的连续性和可靠性。在蜂窝网络覆盖内时，可通过系统信息或`RRC`信令配置`UE`的收发资源池信息；在蜂窝网络覆盖外时，可利用预配置的资源池信息。在资源池中，`UE`自主选择适合V2X应用的时频资源进行发送。


    模式3：基站资源调度分配（集中式资源分配方法）。基站资源分配机制中，由于`UE`发送的资源是`eNB`集中调度的，因此可很好地避免资源冲突。进一步结合`UE`的地理位置信息，`eNB`可实现基于地理位置的资源分配。`eNB`可以获知比`UE`之间感知范围更广的资源占用信息，可较好解决隐藏节点的问题。通过`eNB`集中调度，可提高数据传输的可靠性和效率，模式3的`eNB`调度方式是`LTE-V2X`的重要组成部分。


    ## 4. 同步机制


    直通链路以LTE上行链路为基础进行设计，沿用了LTE同步系统的基本思路。在无线传输层面，系统内各个`UE`均需保持相同的时间、频率基准，这样才能正确实现频分复用操作；在资源池配置层面，统一的时间、频率基准也是系统内资源池配置的基础。`LTE-V2X`直通链路有4种基本的同步源：`GNSS`、基站、发送直通链路同步信号（Sidelink
    Synchronization Signal，`SLSS`）的终端以及终端内部的时钟。在蜂窝系统中，基站是唯一的同步源；而在`LTE-V2X`系统中，由于`UE`或者`RSU`配有`GNSS`模块，因此它们能够直接获得`GNSS`信号，其定时和频率精度都比较高，可以作为同步参考源为附近其他节点提供必要的同步信息。


    通常认为`GNSS`和基站的同步源具有最高的同步级别，系统根据终端是否直接从`GNSS`或者基站获取同步，形成一个同步优先级的层级关系，具体优先级别顺序如下\[20\]。


    `Level1`：系统（预）配置的`GNSS`或者基站。


    `Level2`：与`Level1`直接同步的参考终端。


    `Level3`：与`Level2`直接同步的参考终端，即与`Level1`间接同步。


    `Level4`：其他参考终端。


    ## 5. 服务质量管理


    `PC5`接口的`LTE-V2X`通信机制中的服务质量（Quality of Service，`QoS`）机制可以针对不同业务提供差异化的传输服务，`QoS`采用ProSe
    Per-Packet Priority（`PPPP`）机制，其特点在于以逐个数据分组的粒度定义其发送优先级。具体来说，`UE`将上层提供的V2X数据分组的消息优先级映射为接入层使用的发送优先级`PPPP`，并用于底层发送过程。`PPPP`取值为1～8（1代表最高优先级，8代表最低优先级）。在模式4下，`UE`内部发送依据数据分组的`PPPP`优先级，先高后低安排发送服务。不同的`PPPP`可以映射至不同的发送分组时延预算（Packet
    Delay Budget，`PDB`），原则上优先级越高对应的时延预算越小。在模式3下，发送`UE`将`PPPP`通知基站，基站依据`PPPP`和`UE`聚合最大速率，进行`UE`内部各数据间以及`UE`间数据的调度决策。


    ## 6. 拥塞控制


    在车联网应用环境下，在道路发生拥堵时，聚集的各个车辆持续对外广播V2X消息，很容易造成空口信道的拥塞。拥塞控制机制使车辆感知到信道的拥塞状态并自适应地减少发送需求（包括发送频度、发送资源、发送功率等）；而在信道非拥塞时，各个车辆逐步增加常规的发送需求。拥塞控制的核心是保证各个车辆之间传输资源占用的公平性，并且优先保证高优先级数据分组的发送。支持拥塞控制机制，可以提高系统资源利用率，减少系统干扰，提高消息接收的可靠性。


    `LTE-V2X`标准未规定具体的拥塞控制算法，仅定义了拥塞控制的基本框架，包括信道拥塞状态的衡量标准以及拥塞状态与发送参数之间的映射关系。信道拥塞程度的衡量标准为接收`UE`角度的资源池粒度的信道忙比例（Channel
    Busy Ratio，`CBR`）。


    ## 7. LTE-V2X对Uu接口的增强技术


    LTE `Uu`接口也可用于传输V2X业务，针对V2X业务的特点，`Uu`接口为支持V2X传输进行了增强设计。


    ①V2X业务质量指示。V2X业务对时延、可靠性等有较严苛的要求，通常对业务质量有明确的要求。在3GPP标准中，服务质量通常用服务质量分类标识（QoS Class
    Identifier，`QCI`）定义，`QCI`是一个数量等级，代表了系统应该为某项业务提供的业务质量特性\[25\]。`QCI`影响的是基站对`Uu`的调度行为，对`UE`无直接影响。


    ②上行链路半持续调度（Uplink Semi-Persistent Scheduling，`UL SPS`）增强。针对V2X消息的周期性特点，在上行链路需要进行半持续调度，从而降低基站信令开销。传统的上行链路半持续调度只有1个进程，为了支持V2X业务所呈现的多种周期性业务并发的现象，`LTE-V2X`标准引入了上行多`SPS`进程的设计，基站最多可配置8个不同参数的`SPS`配置，所有的`SPS`配置可同时被激活。


    ③下行广播周期优化。`Uu`接口支持V2X业务，为提升效率，可以使用广播模式。V2X消息分发的距离通常仅为几百米，为了降低广播区域范围，提升效率，可以由V2X应用服务器指定根据地理位置信息选择合适的目标标识，作为广播发送区域。


    ## 3.2.3 LTE-V2X与DSRC的对比


    `LTE-V2X`是基于长期演进的技术空口，将蜂窝通信和直通通信相结合的车联网通信技术，由3GPP主导制定规范，主要参与厂商包括华为、大唐、LG等；`DSRC`主要基于`IEEE802.11p`与`IEEE1609`系列标准，是一种专门用于V2V和V2I之间的通信标准，主要由美国、日本主导。


    `LTE-V2X`针对车辆应用定义了两种通信方式：蜂窝方式（`LTE-V-Cell`）和直通通信模式（`LTE-V-Direct`）。其中，`LTE-V-Cell`通过`Uu`接口承载传统的车联网远程信息处理业务，`LTE-V-Direct`通过`PC5`接口实现车、人、路之间的短距离直连通信，保证车联网中终端间的低时延、高可靠性，促进实现汽车安全驾驶。


    在`DSRC`架构中，路侧单元是其重要组成部分，并且通过有线光纤的方式连入互联网。汽车可实现安全业务和远程信息处理业务。车与车之间的信息交换通过路侧单元和车载设备之间的通信实现，远程信息处理业务通过`IEEE802.11p`＋路侧单元回程的方式实现。


    `LTE-V2X`技术和`DSRC`技术均需要路侧单元，但两种技术的路侧单元的承载能力不尽相同。两种技术中，路侧单元均会为汽车提供道路相关的信息（如红绿灯、限速等信息），在V2I的模式下将这些信息发送给汽车。


    `LTE-V2X`技术与`DSRC`技术的性能对比如表3.3所示。


    表3.3　`LTE-V2X`技术与`DSRC`技术的性能对比


