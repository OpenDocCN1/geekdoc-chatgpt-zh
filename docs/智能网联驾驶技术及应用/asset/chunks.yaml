    ## 7.3 紧急车辆提醒技术


    ### 7.3.1 紧急车辆提醒的定义

    紧急车辆提醒（Emergency Vehicle Warning，EVW）是指，主车（HV）在行驶过程中，收到紧急车辆提醒，以对消防车、救护车、警车或其他紧急呼叫车辆进行让行。EVW
    应用使 HV 实现对消防车、救护车、警车或其他紧急呼叫车辆的让行。


    ### 7.3.2 紧急车辆提醒的主要场景

    当紧急车辆 RV 接近 HV 时，提示 HV 让行的典型场景如图 7.2 所示，具体描述如下。

    ①HV 行驶中，紧急车辆 RV 接近 HV。

    ②HV 和紧急车辆 RV 需具备短程无线通信能力。

    ③HV 收到紧急车辆 RV 提醒时，对其进行让行。

    ![](img/txt007_7.jpg "pagenumber_ebook=155,pagenumber_book=145")

    图 7.2 当紧急车辆 RV 接近 HV 时，提示 HV 让行


    ### 7.3.3 紧急车辆提醒的基本工作原理与算法实现

    EVW 的基本工作原理如下。

    ①分析接收到的紧急车辆 RV 的消息，筛选出位于 HV 受影响区域的紧急车辆 RV。

    ②将处于一定范围内的紧急车辆 RV 作为优先让行紧急车辆。

    ③计算优先让行紧急车辆 RV 到达的时间和距离。

    本书实现 EVW 算法的具体思路如下。

    ①定义一个函数`doEVW()`，它接受两个参数：`hvInfo`和`rvInfo`。`hvInfo`和`rvInfo`分别表示主车和远车的信息。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中 0 表示无须预警，2 表示需要变道预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`lane_change`表示进行变道。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的 x 坐标和 y 坐标、速度、航向角、尺寸和车辆类型，以及远车的刹车、灯光和 abs 状态，并将其赋值给相应的变量。

    ④调用`my_calc_distance()`自定义函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。

    ⑤若主车和远车同时满足以下 3 个条件，则将`warning_flag`设为 1，并进行下一步判断：远车是紧急车辆、主车速度大于 0.1 且远车与主车后方的距离小于
    80m。

    ⑥若两车位于同一车道且远车位于主车后方 20m 范围内，则将`warning_flag`设为 2，并将`adviser`设为`lane_change`。

    ⑦最终返回`warning_flag`和`adviser`作为函数输出。

