    5.5　盲区预警/变道预警技术


    5.5.1　盲区预警/变道预警的定义


    盲区预警/变道预警（Blind Spot Warning/Lane Change Warning，BSW/LCW）是指，当主车（HV）的相邻车道上有同向行驶的远车（RV）出现在HV盲区时，BSW/LCW应用对HV驾驶员进行预警；当主车（HV）准备实施变道操作（如激活转向灯等）时，若此时其相邻车道上有同向行驶的远车（RV）处于或即将进入HV盲区，LCW应用对HV驾驶员进行预警。本应用适用于普通道路或高速公路等车辆变道可能存在碰撞危险的预警。


    BSW/LCW应用避免车辆变道时，与相邻车道上的车辆发生侧向碰撞，提高变道安全。


    5.5.2　盲区预警/变道预警的主要场景


    BSW/LCW包括如下主要场景。


    场景一：HV在本车道内行驶，RV在HV相邻车道内同向行驶，且RV处于HV盲区内，如图5.12所示。BSW应用提醒HV驾驶员其盲区内存在车辆RV。若此时检测到HV驾驶员有向RV所在车道变道的意图（如激活转向灯等），则LCW应用对HV驾驶员发出预警。预警时机需确保HV驾驶员收到预警后，能有足够的时间采取措施，避免与相邻车道上的RV发生碰撞。


    ![](images/txt005_25.jpg "pagenumber_ebook=123,pagenumber_book=113")


    图5.12　RV在HV盲区内


    场景二：H V在本车道内行驶，RV在相邻车道上与H V同向行驶，且即将进入H V的盲区，如图5.13所示。BSW应用提醒H V驾驶员即将有车辆进入其盲区。若此时检测到H
    V驾驶员有向RV所在车道变道的意图（如激活转向灯），则LCW应用对H V驾驶员发出预警。预警时机需确保H V驾驶员收到预警后，能有足够的时间采取措施，避免与相邻车道上的RV发生碰撞。


    ![](images/txt005_26.jpg "pagenumber_ebook=124,pagenumber_book=114")


    图5.13　RV即将进入HV盲区


    5.5.3　盲区预警/变道预警的基本原理与算法实现


    当H V意图换道时，若检测到相邻车道上与H V同向行驶的车辆RV处于或即将进入H V盲区，则BSW/LCW应用会对H V驾驶员进行预警。触发BSW/LCW功能的H
    V和RV的位置关系如图5.14所示。BSW/LCW应用适用于直道和弯道情形。


    ![](images/txt005_27.jpg "pagenumber_ebook=124,pagenumber_book=114")


    图5.14　触发BSW/LCW功能的H V和RV的位置关系


    BS W/LCW的基本工作原理如下。


    ①从接收到的RV消息中，筛选出位于H V左后相邻车道和右后相邻车道的RV作为潜在威胁车辆。


    ②判断潜在威胁车辆是否处于或即将进入H V盲区。


    ③如果潜在威胁车辆处于或即将进入H V盲区，首先对H V驾驶员进行BSW提醒。


    ④如果潜在威胁车辆处于或即将进入H V盲区，而H V此时有变道操作，则对H V驾驶员进行LCW报警。


    ⑤系统通过HMI对H V驾驶员进行提醒或报警。


    本书实现BSW算法的具体思路如下：


    ①定义一个函数doBSW，它接受两个参数——hvInfo和rvInfo，这两个参数分别表示主车和远车的信息。


    ②函数内部首先初始化两个变量：warning\_flag和adviser。warning\_flag表示预警等级，其中0表示无须预警，1表示需要变道预警。adviser表示建议类型，其中keep表示保持当前状态，changelane表示变道。


    ③分别从hvInfo和rvInfo中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸、车辆类型、刹车状态、灯光状态和abs状态，并将其赋值给相应的变量。


    ④调用my\_calc\_distance函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。


    ⑤判断主车到远车之间是否满足以下条件，若满足则将warning\_flag设为1，并将adviser设为keep：纵向距离绝对值小于15、两车在相邻的车道上、主车速度减去远车速度小于或等于4（两车速度差不大）。


    ⑥最终返回warning\_flag和adviser作为函数输出。


