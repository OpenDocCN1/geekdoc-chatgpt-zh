    #### 2.地图消息


    ##### 1）定义


    地图消息（`MAP`）由路侧单元广播，向车辆传递局部区域的地图信息，包括局部区域的路口信息、路段信息、车道信息，道路之间的连接关系等。单个地图消息可以包含多个路口或区域的地图数据。`MAP`的使用场景如图4.4所示。


    ![](images/txt004_10.jpg "pagenumber_ebook=94,pagenumber_book=84")


    图4.4　`MAP`的使用场景


    ##### 2）消息主体结构及说明


    同`BSM`一样，为了辨别广播中不同的消息，`MAP`也需要具备消息编号、发送时间。消息编号配合时间戳可以防止重放攻击，时间戳一般通过读取`GPS`中的时间戳，然后加入`MAP`中进行发送。另外，地图中包含的多个路段、车道、路口等，究其本源，均由一个个节点组成。因此，`MAP`的另一个组成字段为地图节点列表，节点是地图的最基本组成部分，可以是交叉路口，也可以是一个路段的起点或终点。


    为了区分不同节点，引入节点ID和节点名的字段。节点的位置信息是确认地图构成的必要信息，为了减少位置数据的大小，采用以地图中心节点为参考，其他节点的位置信息则使用中心节点位置坐标加上各自的偏移量。在地图上，顺序的两个节点可确定一条有向路段。路段的起点记为上游节点，终点记为下游节点，在定义地图路段时选择以下游节点为参考定义下游节点的上游路段列表，作为下游节点的字段信息。


    通常，某一路段中包含的信息包括路段名和车道信息。将其应用到消息格式中时，上游路段首先要包含上游节点ID以及路段名，确认路段的起始处和名字。路段中常常包含多条车道，应对车道列表中不同车道的宽度、限速信息、车道允许转向行为、车道属性、上游车道与下游车道的连接关系等信息进行定义。


    图4.5给出了`MAP`的主体结构，它是一个层层嵌套的形式，其中实线框为必有项，虚线框为可选项。


    ![](images/txt004_11.jpg "pagenumber_ebook=95,pagenumber_book=85")


    图4.5　`MAP`的主体结构


    ##### 3）MAP应用


    `MAP`用来描述道路信息，在智能网联应用中更多是个“服务者”的角色，给应用落地和预警触发提供明确的位置信息。例如，路侧设施可以将`MAP`下发给周边车辆，提升周边车辆对行车环境的感知，提升车辆的定位精度，并便于车辆规划合适的行车路线。`MAP`已成了应用落地不可或缺的重要支撑。


    此外`MAP`可与`SPAT`消息结合使用，为车辆提供实时的前方信号灯相位消息。在闯红灯预警场景中，当前方有大车遮挡视线或恶劣天气导致视线受到影响，使远车无法对当前红灯或即刻到来的红灯做出正确判断时，闯红灯预警应用会检测该车当前所处位置和速度等，通过计算预测车头经过路口停止线时信号灯的状态，并向驾驶员进行预警。这就使用到了`MAP`中路口始末点的位置信息和`SPAT`中路口信号灯相位状态的信息。


