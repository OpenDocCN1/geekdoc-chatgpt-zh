    # 5G-V2X直通链路与网联通信技术


    ## V2X应用层PC5链路信息管理


    `V2X`应用层通过3个信息管理`PC5`链路，具体为层二的源标识、层二的目标标识和通信模式（包括广播、多播或者单播）。层二的源标识是24bit的字符串指示链路层的地址，是`V2X`设备自己分配的`V2X`设备标识。层二的目标标识是`V2X`应用的业务标识相对应的链路层标识，用来区分不同的`V2X`应用，由运营商分配。这3个信息也被通知给接入层，便于接入层对`PC5`链路的管理。一个`V2X`终端可能存在多个层二的源标识和多个层二的目标标识，用于支持并发的`V2X`通信连接，其适用于不同的`V2X`业务以及不同的通信模式等。


    ## 5G-V2X业务服务质量管理机制


    在`LTE-V2X`中，根据直通链路每个数据分组的优先级（`PPPP`），以数据分组为粒度为不同的业务提供差异化的传输服务。而在`5G-V2X`中，需要支持更灵活的、差异更大的传输服务。在`5G-V2X`直通链路的`QoS`管理中，每个`V2X`应用都配置了一套默认的直通链路`QoS`参数，每一套`QoS`参数通过`QoS`流标识表征。相同`QoS`流标识的数据分组采用相同的调度策略、队列管理策略以及`SLRB`配置参数。


    用户发起`V2X`应用的通信，根据`V2X`应用与直通链路`QoS`参数的映射关系确定当前`V2X`应用对应的`QoS`流标识，然后根据`QoS`流标识确定对应的调度策略与调度队列，以及`SLRB`配置参数。接入层根据相应的配置参数建立直通链路的无线承载。`SDAP`层管理`QoS`流和直通链路的无线承载之间的映射关系。对于给定的`PC5`链路，其可能有多个无线承载，每个无线承载服务于不同`QoS`流对应的`V2X`应用。同时，当现有的无线承载可以支持新到达的`V2X`业务的`QoS`要求时，接入层也可以将多个`QoS`流对应的`V2X`应用映射到同一个无线承载。


    在`5G-V2X`中，新引入了通信距离的参数，该参数用于表示直通链路`QoS`参数使用的通信范围，即当接收`UE`位于规定的通信距离内时，需要满足相应的`QoS`要求。通信距离参数仅适用于面向无连接的多播通信。


    ## 5G-V2X直通链路的HARQ反馈机制


    与`LTE-V2X`相比，`5G-V2X`需要支持更高的可靠性和更低的传输时延，`5G-V2X`直通链路支持两种重传方式：盲重传和基于`HARQ`反馈的自适应重传。


    ### 盲重传方式


    终端根据自己的业务需求或者配置，预先确定重传的次数和重传的资源，应用于广播、单播和多播模式。在这种方式下不需要考虑`HARQ`反馈的时延，因此能降低传输时延。但是由于重传的次数是预先确定的，无论接收终端是否正确接收都需要按照预定的次数进行重传，对于已经提前接收成功的数据分组，会导致资源浪费，对于没有接收成功的数据分组，则会导致可靠性降低。


    ### 基于HARQ反馈的自适应重传方式


    根据`ACK/NACK`反馈的信息确定是否需要进行数据的重传，应用于单播和多播模式。这种方式能够提供更高的可靠性，同时当接收终端正确接收后，可以放弃后续的重传资源，从而降低资源的浪费。但是该方式会引入`HARQ`反馈的时延，与盲重传相比，会有更高的传输时延。在`5G-V2X`的设计中，不同的增强`V2X`业务有不同的可靠性要求（99.000％～99.999％），`5G-V2X`支持可变的重传次数（标准最终定义最大重传次数是一个基于资源池配置的参数，其上限为32次）。在`5G-V2X`的盲重传和基于`HARQ`反馈的自适应重传方式中，都需要包含层二的源标识、层二的目标标识、`HARQ`进程标识、冗余版本指示（`RV`）和新数据指示（`New
    Data Indicator`，`NDI`）信息，通过这些信息的组合来确定接收到的数据分组是不是之前传输的数据分组的重传。


    ## 5G-V2X直通链路的资源分配方法


    `5G-V2X`主要用于支持`V2X`增强应用业务，相比于`LTE-V2X`支持的基本道路安全业务，其对支持的业务的灵活性、可靠性和传输时延等方面有着更高的要求。相应地，`5G-V2X`直通链路的资源分配需要更多地考虑多种业务类型混合的场景，包括周期性业务、非周期业务共存的场景及`HARQ`重传的影响。


    考虑`5G-V2X`的部署场景，`5G-V2X`直通链路的资源分配方法中同样引入了两种与`LTE-V2X`类似的资源分配模式：一种是基于基站控制的资源分配模式，称为`模式1`（类似于`LTE-V2X`的`模式3`），其主要应用场景是`V2X`终端位于蜂窝网络覆盖内，通过基站调度`V2X`终端在直通链路的传输资源，这种资源分配模式中，终端不需要进行资源感知的操作；另一种是基于感知的终端自主资源选择方式，称为`模式2`（类似于`LTE-V2X`的`模式4`），其主要应用场景是`V2X`终端位于蜂窝网络覆盖外，或者`V2X`终端位于蜂窝网络覆盖内，在预配置或者蜂窝网配置的`模式2`资源池中进行自主的资源选择。


    ## 5G-V2X直通链路的同步机制


    `5G-V2X`本质上与`LTE-V2X`相同，都是一个同步的系统，系统内各个`UE`均需保持相同的时间、频率基准。终端根据时间基准确定相应的帧、子帧和时隙的定时。与`LTE-V2X`相同，`5G-V2X`在直通链路上也引入了完整的同步机制，支持不同的车联网部署场景，包括蜂窝网络覆盖内、蜂网络覆盖外、有`GNSS`信号或者无`GNSS`信号的区域。通过一些能够可靠获得蜂窝网络同步或者`GNSS`同步的终端，在直通链路上传输`S-SSB`信号，辅助位于蜂窝网络覆盖外或者无法可靠接收到`GNSS`信号的终端实现同步。


    ## 5G-V2X直通链路的功率控制技术


    功率控制是为了控制和降低干扰。对于直通链路来说，选择合适的发送功率十分重要，一方面能够保证直通链路传输信息的正确接收；另一方面可避免对其他直通链路造成不必要的干扰。在直通链路中需考虑蜂窝网络覆盖内和蜂窝网络覆盖外的场景，主要包含以下两种功率控制机制。


    ### 基于下行路径损耗的开环功率控制


    该控制机制可以用于广播、多播和单播的通信模式，发送终端必须位于蜂窝网络覆盖内，此时上行传输和直通链路传输共享同一个载波。


    ### 基于直通链路路径损耗的开环功率控制


    这种机制仅用于直通链路单播的通信模式，可以用于蜂窝网络覆盖内、蜂窝网络覆盖外的所有场景。


    结合上述两种功率控制方式，`V2X`终端可以配置为以下3种功率控制模式：仅支持基于下行路径损耗的开环功率控制模式、仅支持基于直通链路路径损耗的开环功率控制模式、同时支持基于下行路径损耗和基于直通链路路径损耗的开环功率控制模式。在第3种模式下，`V2X`终端在直通链路的发送功率是这两种功率控制计算结果的最小值。


    ## 5G-V2X拥塞控制机制


    拥塞控制的目的是提高资源池的利用率，并在系统发生拥塞时，合理调整用户不同优先级业务的发送参数以及资源占用的比例，从而减少拥塞对系统的影响。其一方面能够保证优先级比较高的用户能够得到可靠发送；另一方面可通过调整`UE`的发送参数和资源占用比例，减少系统内干扰，将拥塞控制在系统可以正常工作的范围内。


    在`LTE-V2X`中定义了一种接入层控制的拥塞控制机制，`5G-V2X`重用了`LTE-V2X`拥塞控制机制的基本原理，在`5G-V2X`设计中更关注如何应对非周期业务导致系统拥塞情况快速变化的问题。


    ## 5G-V2X跨无线接入技术调度机制


    从蜂窝网络部署和演进的角度考虑，在一定时间内，会出现一些地区部署了`5G`网络，而另外一些地区仅部署了`LTE4G`网络的情况。同样，在直通链路的部署和演进过程中，也会同时出现`LTE-V2X`和`5G-V2X`共存的情况。因此在`LTE
    Uu`控制`LTE`直通链路、`NR Uu`控制`NR`直通链路之外，`5G-V2X`还研究了`LTE Uu`控制`NR`直通链路的技术，以及`NR Uu`控制`LTE`直通链路的技术。


    ## 5G-V2X与LTE-V2X设备内共存


    为了保障车联网技术和产业的有序发展，`LTE-V2X`技术作为`C-V2X`技术的先导，支持基本安全业务；而`5G-V2X`是后来者，支持更高级的`V2X`业务。具备`5G-V2X`技术的设备作为后来者，为了实现与`LTE-V2X`技术直通链路的互联互通，需要设备内同时支持`LTE-V2X`和`5G-V2X`两种直通链路的技术。


    `5G-V2X`与`LTE-V2X`直通链路的设备内共存依赖两种直通链路部署的无线频段和带宽。当两种直通链路部署在频域间隔足够远的两个载波上时，每个直通链路有各自的射频链路，相互间不受影响，可以各自独立工作。当两种直通链路部署在频域间隔比较近的两个载波上时，在通常这种情况下两个直通链路共享同一套射频链路，相应地有如下约束。


    - 半双工的约束：当用户正在一个直通链路的载波上发送信息时，不能同时在另一个直通链路的载波上进行信息接收。

    - 最大发送功率受限：当用户同时在两个直通链路上进行信息发送时，由于共享相同的功率放大器，每个直通链路都不能以最大发送功率进行发送，从而影响直通链路的覆盖范围以及传输可靠性。


    对于两种直通链路部署在相同频段内的情况（如部署在`5.9GHz`的段内），为了消除半双工的约束和最大发送功率受限的影响，`5G-V2X`和`LTE-V2X`直通链路采用时分复用的方式进行共存，具体包含如下两种方式。


    - `LTE-V2X`和`5G-V2X`直通链路间半静态时分复用，也称为长期时分复用，`LTE-V2X`和`5G-V2X`直通链路配置了时域上互不重叠的资源池。这种方式实现简单，且两种直通链路之间不需要信息的交换和协调，但是不能根据不同的业务特点充分利用频谱资源。

    - `LTE-V2X`和`5G-V2X`直通链路间动态时分复用，也称为短期时分复用，当两个直通链路发送/发送或者发送/接收同时发生时，如果提前获知两个直通链路传输的业务优先级，则可以丢弃低优先级的直通链路传输。这种方式要求两种直通链路之间能够进行信息交互。当两个直通链路接收/接收同时发生时，通常用户可以同时接收同一频带内的两个直通链路，如果用户不支持同时接收两个直通链路，则取决于设备的具体实现，标准中没有明确规定。


    ## 5G-V2X与LTE-V2X的对比


    不同于`LTE-V2X`接入层仅支持广播传输，`5G-V2X`接入层可支持直连通信链路（`SL`）广播、单播和组播传输，可用于基站覆盖范围内、基站覆盖范围外以及基站部分覆盖场景中的`V2X`通信。一个特定的数据包采用单播、组播还是广播传输，是由高层决定的。


    `5G-V2X`引入直连通信链路单播、组播以及相应的反馈机制，主要是为了提高物理层传输的可靠性，相比于广播，在一定程度上也可以提升资源利用率。相比于`LTE-V`，`5G-V2X`在传输可靠性、传输速率等方面都有较大的提升，具体可见表3.5。


    表3.5 `5G-V2X`与`LTE-V2X`的对比


    ![](images/txt003_11.jpg "pagenumber_ebook=77,pagenumber_book=67")


    从应用场景来看，中国汽车工程学会于2017年提出了《合作式智能运输系统车用通信系统应用层及应用数据交互标准》，将安全、效率、信息服务三大类的17个典型应用作为一期应用。


    另外，如图3.6所示，`3GPP`定义了27个车路协同应用场景，其可以分为`V2X`的安全性服务和非安全性服务。安全服务类应用场景主要用于减少和避免交通事故的发生以及保护生命和财产的安全；非安全类应用场景作为补充服务，主要用于提高交通效率和环境性能。


    ![](images/txt003_12.jpg "pagenumber_ebook=78,pagenumber_book=68")


    图3.6 `3GPP`定义的典型车路协同应用场景


    `LTE-V2X`与`5G-V2X`能满足不同的业务场景需求。`LTE-V2X`位于`5G-V2X`前一个阶段，目前已经能够解决上述定义场景中的大部分基础安全预警和效率提升类应用需求，主要用于辅助驾驶。`5G-V2X`则主要是为了满足未来高等级自动驾驶应用场景的需求，目前主要围绕车辆编队、远程驾驶、高级驾驶、感知共享等场景，`5G-V2X`是`LTE-V2X`技术的增强和补充，两者将在未来长期协同共存，共同支撑车联网不同类型的应用服务。


    从基建设施投入角度来看，两者关系与移动通信基建设施投入类似，例如，`4G`网络虽然已普遍应用，但过去的`2G`、`3G`手机仍可使用，其通话、发短信等基础业务并不受影响。对于`C-V2X`技术也一样，其具备`LTE-V2X`和`5G-V2X`多模态通信方式，现在装载了`LTE-V2X`设备的车辆收发的信号，在未来装载了`5G-V2X`设备的车辆上仍可照常接收。


    而在基础设施投资问题上，从全国范围来看，`LTE-V2X`基础设施建设主要包括城市区域建设、高速公路建设两大部分。在城市区域方面，`LTE-V2X`基础设施建设投资主要包括交通路口路侧单元、部分特殊路段路侧单元部署；在高速公路方面，`LTE-V2X`基础设施建设投资主要为沿高速公路部署`RSU`，并补充建设部分数据传输线路。由此可以看出，投资主要分为路侧单元设备成本和工程建设费用，而路侧单元设备成本大约占据总投资的40％，工程建设费用大约占总投资的60％，待到未来`LTE-V2X`与`5G-V2X`共存时，`LTE-V2X`网络设施可以继续使用，工程建设大部分也可有效复用，仅需新增`5G-V2X`网络设施，因此现有投资不会浪费。


    ## 智能网联驾驶无线通信设备


    车路协同系统由车端、路端、云端等不同要素组成，要保证系统间的正常通信，以及应用场景的落地，就需要有不同的网联终端来做支持，本节则重点对基于`C-V2X`无线通信技术的网联终端进行介绍。


    ### 车载通信单元


    车载通信单元（`On Board Unit`，`OBU`）是一种车载终端设备，用于车路协同（`V2X`）通信系统中，使车辆能够与周围的交通基础设施、其他车辆和行人进行实时的双向通信和数据交换。


    `OBU`内部集成了`V2X`通信模块、处理器、无线电天线、传感器等关键组件。它能够接收来自`RSU`和其他车辆的信息，并将车辆的状态、位置、行驶意图等数据传输回云平台，以及与其他车辆共享这些信息。同时，`OBU`也能够接收来自云平台和其他车辆的指令和警示信息，并向驾驶员提供相关的提示和警告，这样可以提高驾驶安全性和交通效率。


    一般`OBU`需满足以下技术需求。


    ①运行基于`C-V2X`协议栈的应用，提供高级辅助驾驶、车路协同服务。


    ②支持多星座高精度卫星定位——支持`BeiDou/GPS/GLONASS`等；支持厘米级高精度定位——支持`RTK`、双频或三频。


    ③支持`LTE-V2X` `3GPP R14`或更高标准（`LTE-V2X`工作频段为`5905～5925MHz`，工作宽带为`10/20MHz`）。


    ④内置`HSM`模块，支持国密算法加密、验签、签名。


    ⑤支持链接车内`CAN`总线。


    ⑥支持`2G/3G/4G/5G`，以及后续各代移动通信服务，可实现`Uu`通信。


    ⑦支持`Wi-Fi`，通过`Wi-Fi`实现与车机、移动终端等设备的交互。


    ⑧具有网口、USB等数字通信接口。


    基于`OBU`的技术特点，一般`OBU`产品的架构如图3.7所示。


    ![](images/txt003_13.jpg "pagenumber_ebook=79,pagenumber_book=69")


    图3.7 `OBU`产品的架构


    目前`V2X`芯片的解决方案商国内有辰芯、华为，国外有高通、Autotalks。此外`OBU`设备中的高精定位模组也是核心功能之一，`V2X`很多场景需要厘米级的精度实现车道级定位。目前支持`RTK`（`Real
    Time Kinematic`，实时动态测量）高精定位的导航模组国外主要为`Ublox`，国内也有几家芯片供应商实现了`RTK`高精定位解决方案，如梦芯、华测、和芯等。


    ### 路侧通信单元


    路侧通信单元（`Road Side Unit`，`RSU`）是实现智能网联的路侧单元，可通过`LTE-V2X`技术与附近的`OBU`设备通信。`RSU`的主要功能为采集、发布当前道路的状况、交通状况等信息，`RSU`可以通过接收到的周边`OBU`设备信息实时统计、分析周边交通信息，也可以与路侧感知设备、交通信号灯、电子牌等交通信息终端通信，获取更丰富的周边交通信息，还可以通过云接收控制中心推送的信息。`RSU`通过与`OBU`及其他多种交通信息设备的互联互通，实现了交通信号的实时交互、辅助驾驶、引导通行、异常预警等，提高了交通效率和安全保障水平。


    一般`RSU`需满足以下技术需求。


    ①支持`LTE-V2X` `3GPP R14`或更高标准，工作频段为`5905～5925MHz`，工作宽带：`10/20MHz`。


    ②支持高精度卫星定位——支持`BeiDou/GPS/GLONASS`等；支持无`GNSS`场景下的`V2X`通信。


    ③内置`HSM`模块，支持国密算法加密、验签、签名。


    ④支持`2G/3G/4G/5G`，以及后续各代移动通信服务，可实现`Uu`通信。


    ⑤支持与感知设备、交通信号灯其他交通设备的互联互通。


    ⑥支持`POE`（`Power On Ethernet`）供电及网口通信。


    ⑦支持`IP65`或以上防护等级。


    ⑧具备防雷能力。


