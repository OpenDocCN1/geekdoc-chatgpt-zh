    #### 超声波雷达的应用

    超声波雷达多用于自动泊车、倒车辅助、障碍物预警等系统，通常安装在汽车的前、后保险杠上和汽车侧面，图 2.3 所示为一种典型的超声波雷达在车上的布置方式，前、后保险杠位置各布置
    4 个超声波雷达，在左、右侧面的前、后端各布置 1 个。在自动泊车系统中，利用超声波雷达探测空置的位置。在倒车辅助时，车辆挂入倒挡后，位于前、后保险杠位置的超声波雷达实时探测障碍物位置，并通过声音或图像等方式发出提示，以弥补倒车时驾驶员视线的不足。有些带有盲点监测或并线辅助系统的车型在行车时也会开启超声波雷达，其用于近距离障碍物的实时探测和预警，进一步在自动驾驶过程中联合其他系统可对车辆进行控制以提高行车安全性。


