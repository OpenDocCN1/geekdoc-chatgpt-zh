- raw: '·V2X应用层通过3个信息管理PC5链路，具体为层二的源标识、层二的目标标识和通信模式（包括广播、多播或者单播）。层二的源标识是24bit的字符串指示链路层的地址，是V2X设备自己分配的V2X设备标识。层二的目标标识是V2X应用的业务标识相对应的链路层标识，用来区分不同的V2X应用，由运营商分配。这3个信息也被通知给接入层，便于接入层对PC5链路的管理。一个V2X终端可能存在多个层二的源标识和多个层二的目标标识，用于支持并发的V2X通信连接，其适用于不同的V2X业务以及不同的通信模式等。


    2）5G-V2X业务服务质量管理机制


    在LTE-V2X中，根据直通链路每个数据分组的优先级（PPPP），以数据分组为粒度为不同的业务提供差异化的传输服务。而在5G-V2X中，需要支持更灵活的、差异更大的传输服务。在5G-V2X直通链路的QoS管理中，每个V2X应用都配置了一套默认的直通链路QoS参数，每一套QoS参数通过QoS流标识表征。相同QoS流标识的数据分组采用相同的调度策略、队列管理策略以及SLRB配置参数。


    用户发起V2X应用的通信，根据V2X应用与直通链路QoS参数的映射关系确定当前V2X应用对应的QoS流标识，然后根据QoS流标识确定对应的调度策略与调度队列，以及SLRB配置参数。接入层根据相应的配置参数建立直通链路的无线承载。SDAP层管理QoS流和直通链路的无线承载之间的映射关系。对于给定的PC5链路，其可能有多个无线承载，每个无线承载服务于不同QoS流对应的V2X应用。同时，当现有的无线承载可以支持新到达的V2X业务的QoS要求时，接入层也可以将多个QoS流对应的V2X应用映射到同一个无线承载。


    在5G-V2X中，新引入了通信距离的参数，该参数用于表示直通链路QoS参数使用的通信范围，即当接收UE位于规定的通信距离内时，需要满足相应的QoS要求。通信距离参数仅适用于面向无连接的多播通信。


    3）5G-V2X直通链路的HARQ反馈机制


    与LTE-V2X相比，5G-V2X需要支持更高的可靠性和更低的传输时延，5G-V2X直通链路支持两种重传方式\[27\]：盲重传和基于HARQ反馈的自适应重传。


    ·盲重传方式：终端根据自己的业务需求或者配置，预先确定重传的次数和重传的资源，应用于广播、单播和多播模式。在这种方式下不需要考虑HARQ反馈的时延，因此能降低传输时延。但是由于重传的次数是预先确定的，无论接收终端是否正确接收都需要按照预定的次数进行重传，对于已经提前接收成功的数据分组，会导致资源浪费，对于没有接收成功的数据分组，则会导致可靠性降低。


    ·基于HARQ反馈的自适应重传方式：根据ACK/NACK反馈的信息确定是否需要进行数据的重传，应用于单播和多播模式。这种方式能够提供更高的可靠性，同时当接收终端正确接收后，可以放弃后续的重传资源，从而降低资源的浪费。但是该方式会引入HARQ反馈的时延，与盲重传相比，会有更高的传输时延。在5G-V2X的设计中，不同的增强V2X业务有不同的可靠性要求（99.000％～99.999％），5G-V2X支持可变的重传次数（标准最终定义最大重传次数是一个基于资源池配置的参数，其上限为32次）。在5G-V2X的盲重传和基于HARQ反馈的自适应重传方式中，都需要包含层二的源标识、层二的目标标识、HARQ进程标识、冗余版本指示（RV）和新数据指示（New
    Data Indicator，NDI）信息，通过这些信息的组合来确定接收到的数据分组是不是之前传输的数据分组的重传。


    4）5G-V2X直通链路的资源分配方法


    5G-V2X主要用于支持V2X增强应用业务，相比于LTE-V2X支持的基本道路安全业务，其对支持的业务的灵活性、可靠性和传输时延等方面有着更高的要求。相应地，5G-V2X直通链路的资源分配需要更多地考虑多种业务类型混合的场景，包括周期性业务、非周期业务共存的场景及HARQ重传的影响。


    考虑5G-V2X的部署场景，5G-V2X直通链路的资源分配方法中同样引入了两种与LTE-V2X类似的资源分配模式：一种是基于基站控制的资源分配模式，称为模式1（类似于LTE-V2X的模式3），其主要应用场景是V2X终端位于蜂窝网络覆盖内，通过基站调度V2X终端在直通链路的传输资源，这种资源分配模式中，终端不需要进行资源感知的操作；另一种是基于感知的终端自主资源选择方式，称为模式2（类似于LTE-V2X的模式4），其主要应用场景是V2X终端位于蜂窝网络覆盖外，或者V2X终端位于蜂窝网络覆盖内，在预配置或者蜂窝网配置的模式2资源池中进行自主的资源选择。


    5）5G-V2X直通链路的同步机制


    5G-V2X本质上与LTE-V2X相同，都是一个同步的系统，系统内各个UE均需保持相同的时间、频率基准。终端根据时间基准确定相应的帧、子帧和时隙的定时。与LTE-V2X相同，5G-V2X在直通链路上也引入了完整的同步机制，支持不同的车联网部署场景，包括蜂窝网络覆盖内、蜂网络覆盖外、有GNSS信号或者无GNSS信号的区域。通过一些能够可靠获得蜂窝网络同步或者GNSS同步的终端，在直通链路上传输S-SSB信号，辅助位于蜂窝网络覆盖外或者无法可靠接收到GNSS信号的终端实现同步。


    6）5G-V2X直通链路的功率控制技术


    功率控制是为了控制和降低干扰。对于直通链路来说，选择合适的发送功率十分重要，一方面能够保证直通链路传输信息的正确接收；另一方面可避免对其他直通链路造成不必要的干扰。在直通链路中需考虑蜂窝网络覆盖内和蜂窝网络覆盖外的场景，主要包含以下两种功率控制机制\[28\]。


    ·基于下行路径损耗的开环功率控制。该控制机制可以用于广播、多播和单播的通信模式，发送终端必须位于蜂窝网络覆盖内，此时上行传输和直通链路传输共享同一个载波。


    ·基于直通链路路径损耗的开环功率控制。这种机制仅用于直通链路单播的通信模式，可以用于蜂窝网络覆盖内、蜂窝网络覆盖外的所有场景。


    结合上述两种功率控制方式，V2X终端可以配置为以下3种功率控制模式：仅支持基于下行路径损耗的开环功率控制模式、仅支持基于直通链路路径损耗的开环功率控制模式、同时支持基于下行路径损耗和基于直通链路路径损耗的开环功率控制模式。在第3种模式下，V2X终端在直通链路的发送功率是这两种功率控制计算结果的最小值。


    7）5G-V2X拥塞控制机制


    拥塞控制的目的是提高资源池的利用率，并在系统发生拥塞时，合理调整用户不同优先级业务的发送参数以及资源占用的比例，从而减少拥塞对系统的影响。其一方面能够保证优先级比较高的用户能够得到可靠发送；另一方面可通过调整UE的发送参数和资源占用比例，减少系统内干扰，将拥塞控制在系统可以正常工作的范围内。


    在LTE-V2X中定义了一种接入层控制的拥塞控制机制，5G-V2X重用了LTE-V2X拥塞控制机制的基本原理，在5G-V2X设计中更关注如何应对非周期业务导致系统拥塞情况快速变化的问题\[29\]。


    8）5G-V2X跨无线接入技术调度机制


    从蜂窝网络部署和演进的角度考虑，在一定时间内，会出现一些地区部署了5G网络，而另外一些地区仅部署了LTE4G网络的情况。同样，在直通链路的部署和演进过程中，也会同时出现LTE-V2X和5G-V2X共存的情况。因此在LTE
    Uu控制LTE直通链路、NR Uu控制NR直通链路之外，5G-V2X还研究了LTE Uu控制NR直通链路的技术，以及NR Uu控制LTE直通链路的技术。


    9）5G-V2X与LTE-V2X设备内共存


    为了保障车联网技术和产业的有序发展，LTE-V2X技术作为C-V2X技术的先导，支持基本安全业务；而5G-V2X是后来者，支持更高级的V2X业务。具备5G-V2X技术的设备作为后来者，为了实现与LTE-V2X技术直通链路的互联互通，需要设备内同时支持LTE-V2X和5G-V2X两种直通链路的技术。


    5G-V2X与LTE-V2X直通链路的设备内共存依赖两种直通链路部署的无线频段和带宽。当两种直通链路部署在频域间隔足够远的两个载波上时，每个直通链路有各自的射频链路，相互间不受影响，可以各自独立工作。当两种直通链路部署在频域间隔比较近的两个载波上时，在通常这种情况下两个直通链路共享同一套射频链路，相应地有如下约束。


    ·半双工的约束：当用户正在一个直通链路的载波上发送信息时，不能同时在另一个直通链路的载波上进行信息接收。


    ·最大发送功率受限：当用户同时在两个直通链路上进行信息发送时，由于共享相同的功率放大器，每个直通链路都不能以最大发送功率进行发送，从而影响直通链路的覆盖范围以及传输可靠性。


    对于两种直通链路部署在相同频段内的情况（如部署在5.9GHz的段内），为了消除半双工的约束和最大发送功率受限的影响，5G-V2X和LTE-V2X直通链路采用时分复用的方式进行共存，具体包含如下两种方式。


    ·LTE-V2X和5G-V2X直通链路间半静态时分复用，也称为长期时分复用，LTE-V2X和5G-V2X直通链路配置了时域上互不重叠的资源池。这种方式实现简单，且两种直通链路之间不需要信息的交换和协调，但是不能根据不同的业务特点充分利用频谱资源。


    ·LTE-V2X和5G-V2X直通链路间动态时分复用，也称为短期时分复用，当两个直通链路发送/发送或者发送/接收同时发生时，如果提前获知两个直通链路传输的业务优先级，则可以丢弃低优先级的直通链路传输。这种方式要求两种直通链路之间能够进行信息交互。当两个直通链路接收/接收同时发生时，通常用户可以同时接收同一频带内的两个直通链路，如果用户不支持同时接收两个直通链路，则取决于设备的具体实现，标准中没有明确规定。


    3.3.3　5G-V2X与LTE-V2X的对比


    不同于LTE-V2X接入层仅支持广播传输，5G-V2X接入层可支持直连通信链路（SL）广播、单播和组播传输，可用于基站覆盖范围内、基站覆盖范围外以及基站部分覆盖场景中的V2X通信。一个特定的数据包采用单播、组播还是广播传输，是由高层决定的。


    5G-V2X引入直连通信链路单播、组播以及相应的反馈机制，主要是为了提高物理层传输的可靠性，相比于广播，在一定程度上也可以提升资源利用率。相比于LTE-V，5G-V2X在传输可靠性、传输速率等方面都有较大的提升，具体可见表3.5。


    表3.5　5G-V2X与LTE-V2X的对比


    ![](images/txt003_11.jpg "pagenumber_ebook=77,pagenumber_book=67")


    从应用场景来看，中国汽车工程学会于2017年提出了《合作式智能运输系统车用通信系统应用层及应用数据交互标准》\[30\]，将安全、效率、信息服务三大类的17个典型应用作为一期应用。


    另外，如图3.6所示，3GPP定义了27个车路协同应用场景\[31\]，其可以分为V2X的安全性服务和非安全性服务。安全服务类应用场景主要用于减少和避免交通事故的发生以及保护生命和财产的安全；非安全类应用场景作为补充服务，主要用于提高交通效率和环境性能。


    ![](images/txt003_12.jpg "pagenumber_ebook=78,pagenumber_book=68")


    图3.6　3GPP定义的典型车路协同应用场景


    LTE-V2X与5G-V2X能满足不同的业务场景需求。LTE-V2X位于5G-V2X前一个阶段，目前已经能够解决上述定义场景中的大部分基础安全预警和效率提升类应用需求，主要用于辅助驾驶。5G-V2X则主要是为了满足未来高等级自动驾驶应用场景的需求，目前主要围绕车辆编队、远程驾驶、高级驾驶、感知共享等场景，5G-V2X是LTE-V2X技术的增强和补充，两者将在未来长期协同共存，共同支撑车联网不同类型的应用服务。


    从基建设施投入角度来看，两者关系与移动通信基建设施投入类似，例如，4G网络虽然已普遍应用，但过去的2G、3G手机仍可使用，其通话、发短信等基础业务并不受影响。对于C-V2X技术也一样，其具备LTE-V2X和5G-V2X多模态通信方式，现在装载了LTE-V2X设备的车辆收发的信号，在未来装载了5G-V2X设备的车辆上仍可照常接收。


    而在基础设施投资问题上，从全国范围来看，LTE-V2X基础设施建设主要包括城市区域建设、高速公路建设两大部分。在城市区域方面，LTE-V2X基础设施建设投资主要包括交通路口路侧单元、部分特殊路段路侧单元部署；在高速公路方面，LTE-V2X基础设施建设投资主要为沿高速公路部署RSU，并补充建设部分数据传输线路。由此可以看出，投资主要分为路侧单元设备成本和工程建设费用，而路侧单元设备成本大约占据总投资的40％，工程建设费用大约占总投资的60％，待到未来LTE-V2X与5G-V2X共存时，LTE-V2X网络设施可以继续使用，工程建设大部分也可有效复用，仅需新增5G-V2X网络设施，因此现有投资不会浪费。


    3.4　智能网联驾驶无线通信设备


    车路协同系统由车端、路端、云端等不同要素组成，要保证系统间的正常通信，以及应用场景的落地，就需要有不同的网联终端来做支持，本节则重点对基于C-V2X无线通信技术的网联终端进行介绍。


    3.4.1　车载通信单元


    车载通信单元（On Board Unit，OBU）是一种车载终端设备，用于车路协同（V2X）通信系统中，使车辆能够与周围的交通基础设施、其他车辆和行人进行实时的双向通信和数据交换。


    OBU内部集成了V2X通信模块、处理器、无线电天线、传感器等关键组件。它能够接收来自RSU和其他车辆的信息，并将车辆的状态、位置、行驶意图等数据传输回云平台，以及与其他车辆共享这些信息。同时，OBU也能够接收来自云平台和其他车辆的指令和警示信息，并向驾驶员提供相关的提示和警告，这样可以提高驾驶安全性和交通效率。


    一般OBU需满足以下技术需求。


    ①运行基于C-V2X协议栈的应用，提供高级辅助驾驶、车路协同服务。


    ②支持多星座高精度卫星定位——支持BeiDou/GPS/GLONASS等；支持厘米级高精度定位——支持RTK、双频或三频。


    ③支持LTE-V2X3GPP R14或更高标准（LTE-V2X工作频段为5905～5925MHz，工作宽带为10/20MHz）。


    ④内置HSM模块，支持国密算法加密、验签、签名。


    ⑤支持链接车内CAN总线。


    ⑥支持2G/3G/4G/5G，以及后续各代移动通信服务，可实现Uu通信。


    ⑦支持Wi-Fi，通过Wi-Fi实现与车机、移动终端等设备的交互。


    ⑧具有网口、USB等数字通信接口。


    基于OBU的技术特点，一般OBU产品的架构如图3.7所示。


    ![](images/txt003_13.jpg "pagenumber_ebook=79,pagenumber_book=69")


    图3.7　OBU产品的架构


    目前V2X芯片的解决方案商国内有辰芯、华为，国外有高通、Autotalks。此外OBU设备中的高精定位模组也是核心功能之一，V2X很多场景需要厘米级的精度实现车道级定位。目前支持RTK（Real
    Time Kinematic，实时动态测量）高精定位的导航模组国外主要为Ublox，国内也有几家芯片供应商实现了RTK高精定位解决方案，如梦芯、华测、和芯等。


    3.4.2　路侧通信单元


    路侧通信单元（Road Side Unit，RSU）是实现智能网联的路侧单元，可通过LTE-V2X技术与附近的OBU设备通信。RSU的主要功能为采集、发布当前道路的状况、交通状况等信息，RSU可以通过接收到的周边OBU设备信息实时统计、分析周边交通信息，也可以与路侧感知设备、交通信号灯、电子牌等交通信息终端通信，获取更丰富的周边交通信息，还可以通过云接收控制中心推送的信息。RSU通过与OBU及其他多种交通信息设备的互联互通，实现了交通信号的实时交互、辅助驾驶、引导通行、异常预警等，提高了交通效率和安全保障水平。


    一般RSU需满足以下技术需求。


    ①支持LTE-V2X3GPP R14或更高标准，工作频段为5905～5925MHz，工作宽带：10/20MHz。


    ②支持高精度卫星定位——支持BeiDou/GPS/GLONASS等；支持无GNSS场景下的V2X通信。


    ③内置HSM模块，支持国密算法加密、验签、签名。


    ④支持2G/3G/4G/5G，以及后续各代移动通信服务，可实现Uu通信。


    ⑤支持与感知设备、交通信号灯其他交通设备的互联互通。


    ⑥支持POE（Power On Ethernet）供电及网口通信。


    ⑦支持IP65或以上防护等级。


    ⑧具备防雷能力。


    基于RSU的技术特点，一般RSU产品的架构如图3.8所示。


    ![](images/txt003_14.jpg "pagenumber_ebook=80,pagenumber_book=70")


    图3.8　RSU产品的架构


    RSU作为车路协同通信系统的重要组成部分，通过与车辆和交通管理中心的通信，实现了车辆和道路基础设施之间的实时信息交换和协同。它在提高交通安全性、减少交通拥堵、优化交通信号等方面发挥着重要作用，并为未来智能交通系统的发展提供了基础。


