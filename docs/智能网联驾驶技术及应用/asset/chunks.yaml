    ## 5.2 前向碰撞预警技术

    若`HV`在行驶过程中与同一车道前方`RV`存在碰撞危险，那么`FCW`应用就会对`HV`驾驶员进行预警。触发`FCW`功能的`HV`和`RV`的位置关系如图5.5所示，其中`HV`和`RV`在同一车道，`RV`在`HV`的前方。


    `FCW`的基本工作原理如下。

    ①`HV`的车载通信单元接收`RV`发送的`BSM`，分析接收到的消息，筛选出位于同一车道前方（前方同车道）区域的`RV`，并进一步筛选出处于一定距离范围内的`RV`作为潜在威胁车辆。

    ②计算每一个潜在威胁车辆的碰撞时间（`Time-to-Collision`，`TTC`）或防撞距离（`Collision Avoidance Range`），筛选出与`HV`存在碰撞危险的威胁车辆。

    ③若有多个威胁车辆，则筛选出最紧急的威胁车辆。

    ④系统通过`HMI`对`HV`驾驶员进行相应的碰撞预警。


    ![](images/txt005_6.jpg "pagenumber_ebook=113,pagenumber_book=103")

    图5.5　触发`FCW`功能的`HV`和`RV`的位置关系


    本节实现`FCW`算法的具体思路如下。

    ①定义一个函数`doFCW`，它接受3个参数——`hvInfo`、`rvInfo`和`fcwTTC`，其中`hvInfo`和`rvInfo`表示主车和远车的信息，`fcwTTC`表示前向碰撞预警时间阈值。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中0表示无须预警，1表示需要减速预警，2表示需要紧急停车预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`slow_down`表示减速行驶，`emergency_stop`表示紧急停车。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。

    ④判断主车是否静止（速度小于0.1），如果是，则直接返回`warning_flag`和`adviser`，即无须预警。

    ⑤调用`my_gps2xyz_ver2`、`my_calc_distance`、`determineTCType`3个自定义函数，分别计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。

    ⑥判断远车是否在主车正前方，若是则进行前向碰撞预警判断。

    ⑦计算两车之间的碰撞时间，如果该时间小于`fcwTTC`，则将`warning_flag`设为1，并将`adviser`设为`slow_down`，然后计算两车之间除去各自长度一半后剩余的距离`d`（即有效距离），如果该距离小于10，则将`warning_flag`设为2，并将`adviser`设为`emergency_stop`。

