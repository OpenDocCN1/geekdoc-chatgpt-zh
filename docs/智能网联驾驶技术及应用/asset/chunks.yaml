    ## RSI


    车载单元会根据自身的定位与运行方向，以及消息本身提供的时效信息、关联区域/路段范围，来判定事件或标志的生效区域。


    ![](images/txt004_13.jpg "pagenumber_ebook=96,pagenumber_book=86")


    图4.6　`RSI`的使用场景


    ### 2. 消息主体结构及说明

    路侧信息由`RSU`提供，`RSU`消息中包含消息序号以及发送时间，同时还包括`RSU`的`ID`，该`ID`用于区分不同的消息发送方。为方便`RSI`作用范围内的位置描述，提供本消息作用范围内的参考三维位置坐标，消息中所有的位置偏移量均基于该参考坐标计算，真实位置坐标等于偏移量加上参考坐标。


    道路交通中的交通事件信息和交通标志信息也会由路侧信息来提供。交通事件（Road Traffic Event，`RTE`）可能包括多个，其信息从信息源、发生区域、时效、优先级、事件置信度以及影响区域等方面来描述，除使用事件编号`ID`来区分事件外，还可使用字符串文本描述来进一步定义该事件。区域大小定义为以中心点为圆心的某个半径大小的范围内。


    交通标志信息（Road Traffic Sign，`RTS`）同样具备`ID`、文字描述的字段内容，根据实际道路交通中的标志，可定义路侧信息中关于交通标志的信息定义，包括标志的位置信息、类型、起止时间及置信度、优先级等。


    交通事件信息和交通标志信息都可通过定义关联路径以及关联路段与`MAP`的配合，帮助车载单元判定事件和标志的影响区域。


    图4.7给出了`RSI`的主体结构，其中实线框为必有项，虚线框为可选项。


    ### 3. `RSI`应用

    `RSI`通常用于事件的下发，向周围车载单元发布交通事件信息以及交通标志信息。车载单元会根据自身的定位与运行方向，以及消息本身提供的区域范围，来判定消息的生效区域，而后向驾驶员推送。`RSI`传递的是与道路相关的一些预警或提示信息，不用于车辆的求救或其他安全应用。


    在场景应用方面，结合车辆自身`BSM`和`RSI`中的位置和交通事件集合可进行道路危险状况提示，使得行经该路段的车辆根据信息及时采取避让措施，避免发生事故。`RSI`中的交通标志集合信息，与`BSM`中的车辆自身信息以及`MAP`中的路段和车道信息，可应用于车内标牌。


    应用根据上述信息，计算出自车在路网中的位置，并判断前方是否有交通标识牌，如果有，则通过车内交通标牌对驾驶员进行提示，车内交通标牌会在消息有效的区域和时间段内亮起。同理，对地图中的道路交通拥堵状况可进行提示，进而帮助车辆重新规划路线，缓解交通压力，减少拥堵时间。


