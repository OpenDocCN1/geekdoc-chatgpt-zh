    \n1.3.2　国内智能网联驾驶的发展趋势\n\n在各方共同努力下，我国智能网联发展成效显著，已初步构建开放融合、创新引领、具有较强国际竞争力的产业生态，在关键技术、标准测试、基础设施、应用服务和安全保障方面取得了系统性进展。\n\
    \n一方面，我国确立了依托C-V2X发展车路云一体化融合的智能网联汽车中国方案，传统车企与互联网科技企业跨界合作，C-V2X快速发展，产业体系全球领先；另一方面，我国在环境感知、决策规划、云平台以及车载计算芯片等关键技术领域取得突破，在国内技术专利数量方面处于国际领先地位，我国产品的自主化比例提升。另外，通过深度参与3GPP国际标准组织的标准制定，我国持续提升我国车联网标准在国际领域的话语权，推动C-V2X网络层协议纳入3GPP国际规范，同时在ITU-T（International\
