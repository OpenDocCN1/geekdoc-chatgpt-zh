    ### 思考题


    1.总结交通事件场景应用的关键判定过程。

    2.请结合前面基本消息类型考虑交通事件场景应用需要哪些基本消息类型做支撑。

    3.除了本书介绍的几种交通事件场景，试列举出1到2种其他的交通事件场景，并简要阐述其基本原理。

    4.根据交通事件场景应用的工作原理和算法实现，分析它们与碰撞预警场景以及信号灯路口场景的异同。


