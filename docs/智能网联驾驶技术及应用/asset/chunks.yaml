    \n4）步骤四\n\n可以在实验选择界面多次进入不同实验以加深理解，或者结束实验后单击“×”返回主界面。\n\n思考题\n\n1.总结信号灯路口场景应用的关键判定过程。\n\
    \n2.与碰撞预警场景相比，信号灯路口场景是车与路协同场景的典型代表，请结合前面基本消息类型考虑这一类场景需要哪些基本消息类型做支撑。\n\n3.除了本书介绍的几种信号灯路口场景，试列举出1到2种其他的信号灯路口场景，并简要阐述其基本原理。\n\
    \n4.思考信号灯路口场景应用能够给现有交通带来哪些好处？\n\n\uFEFF\n\n第7章　智能网联驾驶交通事件场景应用\n\n7.1　交通事件场景介绍\n\
    \n![](images/txt007_1.jpg \"pagenumber_ebook=152,pagenumber_book=142\")\n\n智能网联驾驶交通事件场景应用\n\
    \n在当前的驾驶条件下，每辆车大部分都作为独立个体存在，驾驶员的决策依据多依赖其视野范围内所观察到的交通环境，驾驶员很难实现与其他交通参与者联动或提前知晓前方超远道路的交通态势，做出非常合理的驾驶决策。\n\
    \n在解决天候相关的交通安全方面，驾驶员很难感知到前方超远距离的天气环境或道路积水、湿滑等路况，导致其无法提前知晓前方潜在风险，无法提前采取规避手段，经常在遇到道路坑洼、积水时“手忙脚乱”地采取猛变道、急刹等驾驶行为，这极易导致车辆发生碰撞危险。当前方道路拥堵却不能及时知晓时，驾驶员就不能及时更改驾驶路线，影响出行。\n\
    \n在道路的应急管理方面，自车由于很难关注到后方路况，因此在遇到紧急车辆需要优先通行完成特种作业任务、警方行动需要借道行驶等情况时，很难及时完成规避或变换车道，这既不易让特种车及时通行，也容易在变道时造成交通拥堵，甚至交通事故。\n\
    \n因此如何让自车能够超视距、提前感知前方路况是关键，提前通过事件的下发提醒诱导驾驶员改变行程、提前变道规避或者协调道路通行，能有效地提升驾驶体验和道路通行效率。\n\
    \n在智能网联相关的场景应用能力上，限速提醒能提醒驾驶员当前道路的限速信息，减少违章、超速等危险驾驶行为的出现；道路危险情况的提前下发和前方拥堵提醒能让驾驶员提前知晓前方路况，从容采取驾驶决策；紧急车辆提醒能够对交通参与者进行协调，让其提前给紧急车辆让道，满足紧急车辆快速通行的需要并尽可能减小对当前交通的影响。\n\
    \n7.2　限速预警技术\n\n7.2.1　限速预警的定义\n\n限速预警（Speed Limit Warning，SLW）是指，主车（HV）行驶过程中，在超出限定速度的情况下，SLW应用对HV驾驶员进行预警，提醒驾驶员减速行驶。本应用适用于普通道路及高速公路等有限速的道路。SLW应用可辅助驾驶员避免超速行驶，消除安全隐患，减少交通事故的发生。\n\
    \n7.2.2　限速预警的主要场景\n\nHV和RSU需具备短程无线通信能力。HV行驶时，RSU周期性发送特定路段的限速信息。当HV判断自己在RSU指示的特定路段，且车速超过RSU的速度限值时，SLW应用对HV驾驶员发出预警，提醒驾驶员减速行驶，如图7.1所示。\n\
    \n![](images/txt007_2.jpg \"pagenumber_ebook=153,pagenumber_book=143\")\n\n图7.1　车速超过限速时进行预警\n\
    \n7.2.3　限速预警的基本工作原理与算法实现\n\nSLW的基本工作原理如下。\n\n①HV分析接收到的RSU消息。提取限速路段信息和具体限速大小。\n\
    \n②HV根据本身的定位和行驶方向，将自身定位到特定路段上。\n\n③如果HV检测到自己处在限速路段区域内，则判断自身是否在限速范围内；如果不满足限速要求，则触发超速报警。系统通过HMI对HV驾驶员进行相应的限速预警，提醒驾驶员减速。\n\
    \n本书实现SLW算法的具体思路如下。\n\n①定义一个函数doSLW，它接受3个参数：hvInfo和spdLmt。hvInfo表示主车的信息，spdLmt表示主车所在道路的限速。\n\
    \n②函数内部首先初始化两个变量：warningFlag和adviser。warningFlag表示预警等级，其中0表示无须预警，1表示需要减速预警。adviser表示建议类型，其中keep表示保持当前状态，slow\\\
    _down表示减速行驶。\n\n③从hvInfo中提取主车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。\n\n④判断主车速度是否大于道路限速spdLmt，如果是，则将warningFlag设为1，并将adviser设为slow\\\
    _down。\n\n⑤最终返回warningFlag和adviser作为函数输出。\n\n下面给出了基于Python的SLW算法实现示例代码，供读者在学习时参考。\n\
