    5.3　交叉路口碰撞预警技术


    5.3.1　交叉路口碰撞预警的定义


    交叉路口碰撞预警（Intersection Collision Warning，ICW）是指主车（HV）驶向交叉路口，与侧向行驶的远车（RV）存在碰撞危险时，ICW应用将对HV驾驶员进行预警。本应用适用于城市及郊区普通道路及公路的交叉路口、环道入口、高速路入口等碰撞危险的预警。


    ICW应用辅助驾驶员避免或减小侧向碰撞危害，提高交叉路口的通行安全系数。


    5.3.2　交叉路口碰撞预警的主要场景


    ICW包括如下主要场景。


    场景一：HV停止在路口，RV-1从HV左侧或右侧驶向路口，HV的视线可能被出现在路口的RV-2所遮挡，如图5.6所示。HV启动并准备进入路口时，ICW应用对HV驾驶员发出预警，提醒驾驶员与侧向来车RV-1存在碰撞危险。预警时机需确保HV驾驶员收到预警后，能有足够的时间采取措施，避免与RV-1发生碰撞。在此过程中，HV和RV-1需具备短程无线通信能力，RV-2是否具备短程无线通信能力不影响应用场景的有效性。


    ![](images/txt005_11.jpg "pagenumber_ebook=116,pagenumber_book=106")


    图5.6　H V在路口起步


    场景二：H V驶向路口，同时RV-1从H V左侧或右侧驶向路口，H V的视线可能被出现在路口的RV-2所遮挡，如图5.7所示。当H V驶近路口时，ICW应用对H
    V驾驶员发出预警，提醒驾驶员与侧向来车RV-1存在碰撞危险；预警时机需确保H V驾驶员收到预警后，能有足够的时间采取措施，避免与RV-1发生碰撞。在此过程中，H
    V和RV-1需具备短程无线通信能力，RV-2是否具备短程无线通信能力不影响应用场景的有效性。


    ![](images/txt005_12.jpg "pagenumber_ebook=116,pagenumber_book=106")


    图5.7　H V和RV同时驶向路口


    5.3.3　交叉路口碰撞预警的基本原理与算法实现


    若H V在驶向交叉路口时与任意一辆驶向同一路口的RV存在碰撞危险，ICW应用就会对H V驾驶员进行预警。触发ICW功能的H V和RV的位置关系如图5.8所示，其中H
    V和RV行驶方向不限于垂直交叉（90°），可为一定范围内的多角度交叉。


    ICW的基本工作原理如下。


    ![](images/txt005_13.jpg "pagenumber_ebook=117,pagenumber_book=107")


    图5.8　触发ICW功能的H V和RV的位置关系


    ①H V的OBU接收RV的BSM并分析接收到的消息，筛选出位于交叉路口左侧（Intersecting Left）或交叉路口右侧（Intersecting Right）区域的RV。RV消息可能由RV发出或从路侧单元获取。


    ②进一步筛出选处于一定距离范围内的RV作为潜在威胁车辆。


    ③计算每一个潜在威胁车辆到达路口的时间（Time-to-Intersection，TTI）和到达路口的距离（Distance-to-Intersection，DTI），筛选出与H
    V存在碰撞危险的威胁车辆。


    ④若有多个威胁车辆，则筛选出最紧急的威胁车辆。


    ⑤系统通过HMI对H V驾驶员进行相应的碰撞预警。


    本书实现ICW算法的具体思路如下。


    ①定义一个函数doICW，它接受3个参数：hvInfo、rvInfo和IcwTTC。hvInfo和rvInfo表示主车和远车的信息，IcwTTC表示交叉碰撞预警时间阈值。


    ②函数内部首先初始化两个变量：warning\_flag和adviser。warning\_flag表示预警等级，其中0表示无须预警，1表示需要减速预警，2表示需要紧急停车预警。adviser表示建议类型，其中keep表示保持当前状态，slow\_down表示减速行驶，emergency\_stop表示紧急停车。


    ③分别从hvInfo和rvInfo中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。


    ④调用my\_calc\_distance函数，分别计算主车和远车之间的纵向、横向和直线距离、相对位置关系以及两车与交叉路口的位置关系。


    ⑤计算两车之间的碰撞时间，如果该时间小于IcwTTC，则将warning\_flag设为1，并将adviser设为slow\_down；然后计算两车之间的有效距离，如果该距离小于10，则将warning\_flag设为2，并将adviser设为emergency\_stop。


    ⑥最终返回warning\_flag和adviser作为函数输出。


