    \n2.智能网联驾驶感知的传感器类型有哪些？不同感知传感器的特点以及各自的优缺点分别有哪些？\n\n3.感知融合有哪些类型？各自的区别及优缺点分别是什么？\n\
    \n\uFEFF\n\n第3章　智能网联驾驶无线通信技术\n\n![](images/txt003_1.jpg \"pagenumber_ebook=58,pagenumber_book=48\"\
    )\n\n智能网联驾驶无线通信技术\n\n在现代交通系统中，每辆智能网联汽车不再是独立封闭的个体，智能网联汽车之间，智能网联汽车与道路基础设施之间、行人以及云平台之间都有信息交互，用以保证交通参与者可以安全行驶，提高通行效率。\n\
    \n智能网联驾驶的“网联”主要是指通过通信技术实现车内、车-车、车-路、车-云之间的信息交互，本章主要讨论和关注智能网联驾驶无线通信技术。从历史脉络来看，智能网联驾驶无线通信技术经历了基于IEEE802.11的专用短程通信（Dedicated\
    \ Short Range Communication，DSRC）技术和基于蜂窝网络的车联网无线通信（Cellular Vehicle to Everything，C-V2X）技术两种主流技术。本章将主要对这两类技术进行介绍。\n\
    \n3.1　智能网联驾驶无线通信技术概述\n\n智能网联驾驶中的核心关键技术是无线通信技术。无线通信技术决定了车际网和车载移动互联网等之间大范围、大容量数据的交互、共享的实时性和有效性，是当前国内外技术演进的研究热点。\n\
    \n3.1.1　无线通信技术介绍\n\n如果车辆没有对外通信的能力，那么车辆在本质上就是一个孤岛。目前，用于智能网联驾驶无线通信的主流技术为DSRC技术和C-V2X技术。我国主导推动的是C-V2X技术，包括LTE-V2X（基于4G蜂窝网络的车联网无线通信技术）和5G-V2X（NR-V2X\\\
    [17\\]）（基于5G蜂窝网络的车联网无线通信技术）。\n\n1.DSRC技术\n\nDSRC系统由车载单元、路侧单元以及短程通信协议构成，基于IEEE802.11p通信标准，是一种高效的短距离，可应用于V2X的无线通信技术，有效覆盖区域为3～30m，主要实现车辆和道路的有机连接识别和负责在车路以及车辆之间建立信息的双向传输，实时传递语音、图像等数字信息。DSRC具有传输速度快、受干扰程度小、安全性好等优点，实现了小区域内车辆识别、驾驶员识别、出入管理、ETC（Electronic\
    \ Toll Collection，电子不停车收费）等，极大提升了人们的出行效率，其主要缺点在于通信覆盖距离短，需要针对基础设施进行大规模改造和投入，成本较大。\n\
    \n1）演进发展\n\n在智能交通的发展中，DSRC技术是ITS（Intelligent Transportation System，智能交通系统）的基础之一。随着智能交通的发展而不断发展，相关技术在20世纪90年代开始取得了突破性进展。1992年，美国材料试验学会（American\
    \ Society for Testing Materials，ASTM）主要针对ETC业务的开发最先提出DSRC技术的概念，该通信技术采用915MHz频段开展标准化工作\\\
    [18\\]。\n\n1995年，欧洲标准化委员会（CEN，ComitéEuropéen de Normalization）完成了欧洲DSRC标准的制定。1997年，日本TC204委员会制定了日本的DSRC标准。2003年，美国材料试验学会通过了将ASTM\
    \ E2213-03作为DSRC标准的提案。同年，IEEE协会成立WAVE研究工作组正式接手ASTM的工作，发展WAVE体系作为DSRC标准。2003年12月，在马德里召开的第十届ITS世界大会上，USDOT宣布在5.9GHz分配75MHz频谱进行DSRC研究，同时提出VII项目，目标是使V2V和V2I技术在小范围内应用测试。\n\
    \n2006年12月，USDOT与五大汽车厂商联合测试V2V和V2I在防碰撞系统中的作用，并确立新型以通信为基础的安全设施，主要包含路边网络（Roadside\
    \ Network）和车载设备（On-board Vehicle Equipment）。只有当道路上有足够多的车辆支持V2V通信，V2V的作用才能得到充分体现。2010年，WAVE工作组正式发布了IEEE802.11p车联网通信标准。该标准作为车载电子无线通信规范应用于ITS，成了DSRC标准下的底层协议。在2014年8月，NHTSA（National\
    \ Highway Traffic Safety Administration，美国高速公路安全管理局）和USDOT（United States Department\
    \ of Transportation，美国交通运输部）提出FMVSS No.150法案，该法案强制要求新生产的轻型汽车（载客和轻卡）支持V2V通信功能。2015年6月25日，美国众议院就此事举行听证会，NHTSA以及其他利益相关方再次就V2X案件进行辩护。\n\
    \nDSRC顶层协议栈是基于IEEE1609标准开发的，V2V信息交互是使用轻量WSMP〔WAVE Short Message Protocol，波短消息（协议）〕而不是WIFI使用的TCP/IP协议，TCP/IP协议用于V2I和V2N的信息交互。DSRC的底层、物理层和无线链路控制基于IEEE802.11p。使用IEEE802.11系列标准的初心是利用WIFI的生态系统，但是WIFI最初设计用于固定通信设备，后来制定的IEEE802.11p用于支持移动通信设备。\n\
    \nDSRC标准已经获得通用、丰田、雷诺、恩智浦、AutoTalks和Kapsch TrafficCom等的支持。通用已经有量产车凯迪拉克CTS，其搭载了DSRC（Aptiv提供系统，AutoTalks提供模块，恩智浦提供芯片）。丰田则在2016年就开始销售具备DSRC技术的皇冠和普锐斯（电装提供系统，瑞萨提供芯片）。"
  fmt: '

    高效、准确地感知复杂的交通环境是保证自动驾驶汽车安全至关重要的一环，智能网联协同环境感知方法可以分为两类：一是通过融合多种传感器数据实现的融合感知方法，二是通过多个交通参与者共享感知信息实现的联合感知方法。


    ## 2.4.1 融合感知的定义和分类


    实现自动驾驶，是一定需要由多个传感器相互配合共同构成汽车的感知系统的。不同传感器的原理、功能各不相同，在不同的使用场景里可以发挥各自优势。多个同类或不同类传感器分别获得不同局部和类别的信息，这些信息之间可以相互补充。对各传感器采集的信息进行单独、孤立地处理，不仅会导致信息处理工作量的增加，还会割断了各传感器信息间的内在联系，丢失了信息经有机组合后可能蕴含的有关环境特征，造成了信息资源的浪费，甚至可能导致决策失误。


    多传感器融合的优势主要包括如下4个方面。


    ①提高系统感知的准确度。多种传感器联合互补，可避免单一传感器的局限性，最大限度发挥各个（种）传感器的优势。


    ②增加系统的感知维度，提高系统的可靠性和鲁棒性。多传感器融合可带来一定的信息冗余度，即使某一个传感器出现故障，系统仍可在一定范围内继续正常工作。


    ③增强环境适应能力。应用多传感器融合技术采集的信息具有明显的特征互补性，对空间和时间的覆盖范围更广，弥补了单一传感器对空间的分辨率和环境的语义不确定性。


    ④有效减少成本。融合可以实现用多个价格低廉的传感器设备代替价格昂贵的传感器设备，在保证性能的基础上又可以降低成本预算。


    在多传感器融合中，区别于同类传感器融合，多类传感器融合又属于多模态信息融合，在智能网联驾驶领域主要分为以下3类。


    ### 1. 激光雷达与视觉传感器融合


    如图2.20所示，激光雷达和视觉传感器融合是一个经典方案。在无人驾驶应用中，视觉传感器价格便宜，但是受环境光的影响较大，可靠性相对较低；激光雷达探测距离远，对物体的运动判断精准，可靠性高，但价格高。视觉传感器可进行车道线检测、障碍物检测和交通标志识别；激光雷达可进行路沿检测、动态和静态物体识别、定位和地图创建。对于动态的物体，视觉传感器能判断出前、后两帧中物体或行人是不是同一物体或行人，而激光雷达则能在得到信息后测算前、后两帧间隔内的运动速度和运动位移。


    ![](images/txt002_22.jpg "pagenumber_ebook=49,pagenumber_book=39")


    图2.20　激光雷达和视觉传感器融合


    ### 2. 激光雷达与毫米波雷达融合


    激光雷达和毫米波雷达融合是新的流行方案，如图2.21所示。毫米波雷达已经成为ADAS（Advanced Driver Assistance System，先进驾驶辅助系统）的核心传感器，它具有体积小、重量轻和空间分辨率高的特点，而且穿透雾、烟、灰尘的能力强，弥补了激光雷达的不足。但毫米波雷达受制于波长，探测距离有限，也无法感知行人，并且对周边所有的障碍物无法进行精准的建模，而这恰恰是激光雷达的强项。激光雷达和毫米波雷达不仅可以在性能上实现互补，还可以大大降低使用成本，为无人驾驶的开发提供了一个新的选择。


    ![](images/txt002_23.jpg "pagenumber_ebook=49,pagenumber_book=39")


    图2.21　激光雷达和毫米波雷达融合


    ### 3. 视觉传感器与毫米波雷达融合


    如图2.22所示，将视觉传感器和毫米波雷达进行融合，两者相互配合共同构成智能网联汽车的感知系统，可取长补短，实现更稳定可靠的ADAS功能。视觉传感器与毫米波雷达融合后，信息互补，可信度提高，识别能力增强。


    ![](images/txt002_24.jpg "pagenumber_ebook=50,pagenumber_book=40")


    图2.22　视觉传感器和毫米波雷达融合


    ## 2.4.2 联合感知的定义和分类


    随着深度学习的发展，尽管单车感知系统的鲁棒性、准确性在语义分割和目标检测等任务中都有了显著提高，但由于其只能从自身视角感知环境，因此视野视距有限，视野容易受到遮挡且存在远距离感知结果稀疏等问题，难以处理复杂的动态交通环境。


    为了突破单车感知系统的限制，同时得益于通信基础设施的建设和V2X等技术的发展，研究人员提出了联合感知技术：通过一定范围内的智能网联汽车、路侧基础设施等共享感知信息，实现从多个视点感知环境，使得感知结果更加完整、准确。


    根据联合感知共享的信息类型和所处阶段，可以将联合感知划分为早期联合、后期联合和中期联合3类。


    ### 1. 早期联合


    早期联合又称数据级联合，它是在智能网联汽车和路侧基础设施之间共享原始感知数据，在输入空间进行协同，先得到一个整体视角，然后进行后续处理，从而得到感知结果，如图2.23所示。尽管原始感知数据信息丰富，数据联合后感知精度高，但由于数据量过大，数据实时性低，容易因大量数据负载而使通信网络拥塞，这阻碍了早期在大多数情况下的实际使用。


    ### 2. 后期联合


    后期联合又称决策级联合，它是在智能网联汽车和路侧基础设施之间共享感知结果，在输出空间中进行协同，如图2.24所示。尽管其感知结果的数据量小，耗费资源少，具有带宽经济性，但其丢失了大量细节信息，可处理性不足，且局部观测不完整，导致对车辆的定位误差非常敏感，估计误差和噪声较大。


    ![](images/txt002_25.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图2.23　早期联合流程图


    ![](images/txt002_26.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图2.24　后期联合流程图


    ### 3. 中期联合


    中期联合又称特征级联合，它是在智能网联汽车和路侧基础设施之间共享由每个个体的预测模型生成的中间特征，并在中间特征空间中进行协同，最终得到感知结果，如图2.25所示。中期联合与早期联合相比，可以获得更经济的通信带宽，与后期联合相比，可以升级感知能力，兼具其他两种方式的优点。目前针对中期联合的研究则尚显不足，主要有两个方面的挑战：一是如何从原始测量数据中选择最有利的特征进行传输；二是如何最高效地联合来自其他设备的特征来增强自身的感知能力。


    ![](images/txt002_27.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图2.25　中期联合流程图


    ## 2.4.3 协同感知的挑战


    在本节中，我们将讨论现有的智能网联协同环境感知方法面临的挑战，并给出一些潜在的发展方向。


    ### 1. 通信


    有效的智能网联协同环境感知依赖网联设施之间可靠的通信。然而，在实际应用中，通信存在以下问题：一是随着网络中车辆数量的增加，每辆车辆可用的通信带宽有限；二是由于不可避免的通信延迟，车辆难以接收到其他车辆的实时信息；三是存在丢包等情况，甚至发生通信中断；四是V2X通信可能遭受攻击，无法始终提供可靠服务。


    尽管通信技术在不断发展，通信服务质量也在不断提高，但上述问题仍将长期存在。然而，大多数现有工作都假设信息可以实时和无损地共享，基于理想通信条件进行研究，因此考虑这些通信约束并设计强大的协同感知系统对进一步的工作具有重要意义。


    ### 2. 多模态和数据异构


    目前大多数协同感知工作都聚焦于基于LIDAR点云的感知。然而，还有很多类型的数据对感知有着重要作用，如图像和毫米波雷达点，利用多模态感知数据是一种更有效合作的潜在方法。此外，不同的智能网联汽车之间以及智能网联汽车和路侧基础设施之间，由于传感器型号、安装位置和角度不同等原因，提供的信息质量不同，导致了数据异构问题。然而现有研究很少关注异构和多模态协同感知，如何在异构车辆网络中进行协同成为协同感知进一步实际应用的一个挑战。


    ### 3. 大规模数据集


    单车感知性能的提高离不开大规模数据集的增加和深度学习方法的发展。然而，现有的协同感知研究领域的数据集要么规模小，要么不公开，大规模开源数据集的缺乏阻碍了协同感知的进一步发展。此外，大部分数据集是基于仿真系统收集的，虽然仿真是一种经济、安全的验证算法的方法，但要将协同感知应用于实际，还需要真实的数据集。


