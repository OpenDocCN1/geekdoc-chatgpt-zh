    ## 3.3 5G-V2X技术


    ### 3.3.1 5G-V2X技术的定义与架构


    #### 1. 5G-V2X技术的定义


    5G是第五代移动通信系统，是4G的延伸，是对现有无线接入技术（包括3G、4G和Wi-Fi）的技术演进，是一些新增的补充性无线接入技术集成后解决方案的总称。从某种程度上来讲，5G是一个真正意义上的融合网络，以融合和统一的标准，提供人与人、人与物及物与物之间高速、安全和自由的连通。除了要满足超高速的传输需求外，5G还需满足超大带宽、超高容量、超可靠性、随时随地可接入等要求。


    `5G-V2X`技术（又名`NR-V2X`技术），是在传统`C-V2X`的基础上，引入5G网络和边缘计算（Mobile Edge Computing），充分利用5G网络的高带宽、高可靠性和低时延等特性，挖掘边缘计算的潜能，助力智能网联驾驶。


    #### 2. 5G-V2X技术的架构


    `5G-V2X`的网络架构\[20，26\]如图3.5所示，`5G-V2X`的网络架构接口说明如表3.4所示。在`5G-V2X`网络架构中，主要功能实体如下。


    ![](images/txt003_9.jpg "pagenumber_ebook=72,pagenumber_book=62")


    图3.5　`5G-V2X`的网络架构\[20\]


    ①V2X应用服务器：位于蜂窝网之外的V2X管理实体，提供对全局V2X通信的策略和参数的管理功能，以及对V2X终端的签约信息和鉴权信息的管理功能。


    ②5G核心网：与V2X应用服务器连接，为蜂窝覆盖内的V2X终端提供对V2X通信的策略和参数配置及签约信息和鉴权信息的管理功能。与4G核心网不同，5G核心网采用了服务化架构，各个网络功能可以独立演进和扩展，相应的功能实体如下。


    ·统一数据存储库（Unified Data Repository，`UDR`）功能扩展，用于存储V2X通信所有参数配置的数据库，可以根据V2X应用服务器的数据进行更新。


    ·策略控制功能（Policy Control Function，`PCF`）扩展，用于V2X终端的鉴权信息管理，以及V2X通信（`PC5`和`Uu`）的策略和参数管理，其中`PCF`通过`UDR`实现参数更新。


    ·网络存储库功能（Network Repository Function，`NRF`）扩展，主要根据V2X终端能力上报的信息，选择和发现对应的`PCF`配置。


    ·统一数据管理（Unified Data Management，`UDM`）功能扩展，用于V2X终端`PC5`接口通信的签约信息管理。


    ·接入和移动性管理功能（Access and Mobility Management Function，`AMF`）扩展。一方面，根据`PCF`提供的V2X配置信息给终端提供`PC5`口通信的策略和参数配置信息；另一方面，根据`PCF`和`UDM`提供的信息，管理终端`PC5`口签约和授权状态的上下文信息。


    ③4G核心网：与V2X应用服务器连接，通过`VCF`为蜂窝覆盖内的V2X终端提供V2X通信的策略和参数配置，以及签约信息和鉴权信息的管理。


    ④5G接入网/4G接入网：不同于核心网负责业务的处理，接入网主要负责用户的接入，对于所接入的业务提供承载能力。


    ⑤`UE`：根据获取的V2X通信的策略和参数配置信息，在`PC5`或者`Uu`接口上进行V2X通信。


    表3.4　`5G-V2X`的网络架构接口说明


    ![](images/txt003_10.jpg "pagenumber_ebook=73,pagenumber_book=63")


    目前车路协同`5G-V2X`主要的研究方向包括安全（如碰撞、辅助、停车、逆行等）、效率（如交通拥堵等），以及服务信息等，其重点解决自动驾驶问题，让自动驾驶更加智能，并服务未来的车辆编队、高级驾驶、传感器扩展以及远程驾驶等。


    ①车辆编队。利用5G `NR-V2X`低时延和大带宽的基础特点，支持一组车辆组成车队行驶，所有编队行驶的车辆能够从头车获取信息，并实现这样一个传感器的信息共享，使得同步车辆可以保持密集的超短车距。


    ②高级驾驶。利用5G `NR-V2X`低时延和大带宽的基础特点，通过相邻车辆之间共享感知数据，共享本车的驾驶意图，实现驾驶策略的协调与同步功能。


    ③传感器扩展。要求交通参与者扩展传感器的感知范围，如在车与车、车与云、车与基础设施之间（即`V2V`、`V2N`、`V2I`）实现车载传感器的交互，以获得当前更全面的道路信息，补充目前单车智能超短视距以及非视距的感知情况。


    ④远程驾驶。针对无法驾驶的乘客或者处于危险环境中的车辆，包括远程车辆，通过5G通信、车路人协同、云计算以及自动控制等技术，实现远程的驾驶员对远端的车辆进行远程监控和远程操控。


    ### 3.3.2 5G-V2X的关键技术


    为满足自动驾驶等车联网业务低时延、大带宽的需求，`5G-V2X`通信技术在车联网系统中发挥着至关重要的作用：一方面，`Uu`接口基于5G蜂窝网络技术大带宽、低时延、高可靠的特性，能够支持车辆、交通基础设施、人、云端平台之间信息的快速传输，并支持广域覆盖通信能力；另一方面，需要`NR
    PC5`提供车车和车路等近距离直连通信能力。此外，`5G-V2X`中允许`Uu`实现针对`PC5`接口的资源调度，以便合理地分配直连通信传输资源，在保障拥塞情况下`NR
    PC5`直连通信的可靠性满足自动驾驶安全可靠通信的需求。因此，`5G-V2X`中`Uu`蜂窝网络与`NR PC5`相互协作、融合，实现网络的无缝覆盖，将有效满足“车-路-云”之间的高速信息交互与传输的要求。


    作为`C-V2X`研究和标准化的第二阶段，`5G-V2X`主要通过通信模式管理、服务质量管理以及直通链路的`HARQ`反馈机制、同步机制等关键技术，满足增强车联网应用的通信需求。


    #### 1）5G-V2X通信模式管理技术


    在`5G-V2X`设计中，一个重要的技术特征是支持直通链路上的单播、广播和多播等通信模式。`5G-V2X`通信模式管理主要是V2X应用层管理\[26\]。`5G-V2X`的策略和参数配置信息中包括V2X广播、多播和单播通信模式管理配置，主要包括如下方面。


    ·V2X应用的业务标识与V2X通信的广播、多播和单播通信模式的映射关系及配置策略。


    ·V2X应用的业务标识与层二目标标识的映射关系及配置策略。

