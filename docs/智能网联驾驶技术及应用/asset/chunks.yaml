    ## 7.6 交通事件场景应用台架实验


    ### 7.6.1 实验目的


    ![](img/txt007_22.jpg "pagenumber_ebook=162,pagenumber_book=152")


    交通事件场景应用台架实验


    ①通过对交通事件场景进行实验操作，熟悉不同交通事件场景的关键指标参数。

    ②了解交通事件场景的算法配置。

    ③了解交通事件场景算法的代码实现，尝试对场景算法进行修改和设计。


    ### 7.6.2 实验原理


    本实验以道路施工预警、限速预警和紧急车辆预警为例对交通事件场景应用进行说明，前方拥堵提醒与道路施工预警较为类似，此处不再作介绍。


    #### (1) 道路施工预警


    场景介绍：主车支持通过 C-V2X 通信，获取路侧设备共享的信息。临近施工区域时，主车接收 RSU 广播的道路施工 RSI，获得 RSU 和施工区域的位置，判断是否进行道路施工预警，若存在发生事故风险，则对驾驶员进行预警，当主车通过施工区域后，道路施工预警信息取消。


    道路施工预警算法的原理如图 7.4 所示。


    ![](img/txt007_23.jpg "pagenumber_ebook=162,pagenumber_book=152")


    图 7.4 道路施工预警算法的原理


    其数据流程如图 7.5 所示。


    ![](img/txt007_24.jpg "pagenumber_ebook=163,pagenumber_book=153")


    图 7.5 道路施工预警算法的数据流程图


    #### (2) 限速预警


    场景介绍：主车支持通过 C-V2X 通信，获取路侧设备共享的信息。主车接收 RSU 广播的 MAP，获取地图数据以及道路限速。若主车位于地图数据中的某条道路，则判断主车是否超速；若超速，则对驾驶员进行预警。当主车速度低于限速后，预警信息取消。


    限速预警算法的原理如图 7.6 所示。


    其数据流程如图 7.7 所示。


    ![](img/txt007_25.jpg "pagenumber_ebook=164,pagenumber_book=154")


    图 7.6 限速预警算法的原理


    ![](img/txt007_26.jpg "pagenumber_ebook=164,pagenumber_book=154")


    图 7.7 限速预警算法的数据流程图


    #### (3) 紧急车辆预警


    场景介绍：主车和远车均支持通过 C-V2X 通信交互自身位置和运行状态信息。若远车是紧急车辆或特殊车辆，则判断远车是否位于主车同一车道后方且距离小于阈值；若存在影响紧急车辆前行的可能，则显示紧急车辆预警信息，提醒主车驾驶员对紧急车辆让行。


