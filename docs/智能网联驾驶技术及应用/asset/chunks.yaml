    ### 毫米波雷达

    毫米波雷达通过发射与接收高频电磁波来探测目标，通过信号处理模块对回波信号进行数据处理，计算出目标的距离、速度、角度等信息。常见的毫米波雷达有 24GHz 毫米波雷达和
    77GHz 毫米波雷达。


    #### 毫米波雷达的定义

    毫米波是指长度为 1～10mm 的电磁波，毫米波的频带频率高于射频，低于可见光和红外线，相应的频率范围为 30～300GHz。毫米波雷达是通过发射和接收毫米波段的电磁波来测量车辆与车辆之间的距离、角度和相对速度的装置。毫米波位于微波与远红外波相交叠的波长范围，所以毫米波兼有这两种波谱的优点，同时也有自己独特的性质。毫米波雷达主要用于先进驾驶辅助系统中的自动制动辅助系统、盲区监测预警系统等。


    #### 毫米波雷达的优缺点

    ##### 毫米波雷达的优点

    ①探测性能好。毫米波雷达探测不受颜色与温度的影响。

    ②响应速度快。毫米波的传播速度与光速一样，并且其调制简单，配合高速信号处理系统，可以快速地测量出目标的角度、距离、速度等信息。

    ③对环境的适应性强。毫米波具有很强的穿透能力，在雨、雪、大雾等恶劣天气下依然可以正常工作。由于其天线属于微波天线，因此相较于光波天线，它在大雨及轻微上霜的情况下依然可以正常工作。

    ④抗干扰能力强。毫米波雷达一般工作在高频段，而周围的噪声和干扰处于中低频区，基本上不会影响毫米波雷达的正常运行，因此，毫米波雷达具有抗低频干扰特性。


    ##### 毫米波雷达的缺点

    ①毫米波在空气中传播时会受到空气中的氧气和水蒸气的影响，这些气体的谐振会对毫米波频率产生选择性吸收和散射，导致其大气传播衰减严重。因此，实际应用中，应找到毫米波在大气中传播时，由气体分子谐振吸收所致衰减为极小值的频率。

    ②对目标反射率敏感。处理毫米波雷达数据是一项棘手的任务，部分原因是不同材料的非均匀反射率不同。金属可以放大雷达信号，方便对车辆的检测，但会增加道路上废弃罐等小物体的表观尺寸，而木材等其他材料在这种情况下几乎是透明的。这可能会导致检测到不存在的障碍物和未检测到实际障碍物的误报。

    ③分辨率和准确性。毫米波雷达非常精确地测量传感器与目标之间的距离和速度。然而，水平分辨率取决于发射光束的特性。数字波束形成系统中的原始角度分辨率在 2°到
    5°之间，可以使用先进的处理技术将其提高到 0.1°到 1°。使用这种角度分辨率，很难在 30m 的距离上将行人与附近的汽车分开（作为独立目标检测）。在 100m
    的距离内，不可能将相邻车道上的车辆分开，难以确定车辆是否在同一车道上，甚至不可能检测到道路上的车辆或桥梁。


    #### 毫米波雷达的结构与工作原理

    毫米波雷达如图 2.4 所示，其系统结构主要包括背板、毫米波基础电路、主体压铸板、收/发天线阵列和雷达整流罩。天线是汽车毫米波雷达有效运行的关键设计，以高频印刷电路板的方式集成在基板上。收发芯片通常使用一种特殊的半导体，如硅锗（SiGe）双极晶体管、互补金属氧化物半导体（Complementary
    Metal Oxide Semiconductor，CMOS）等。

    双极晶体管是早前应用比较广泛的毫米波雷达方案，但它占用大量集成电路板空间且成本较高。随着半导体技术的进步，CMOS 在数字电路中的应用越来越广泛，其成本相对较低，与双极晶体管相比，CMOS
    可以在低电压下工作，降低了功耗，目前在毫米波雷达领域得到了更为广泛的应用。


    ![](img/txt002_5.jpg "pagenumber_ebook=36,pagenumber_book=26")

    图 2.4　毫米波雷达


    车载毫米波雷达通过发射电磁波信号（毫米波波段）并接收回波信号来测定汽车车身周围的物理环境信息（如汽车与其他物体之间的相对距离、相对速度、角度、运动、运动方向等），然后根据所探知的物体信息进行目标追踪和识别分类，进而结合车身动态信息进行数据融合，完成合理决策，减少事故发生率。

    大多数现代汽车雷达基于调频连续波（Frequency Modulated Continuous Wave，FMCW）技术，并使用数字波束形成来控制发射波的方向。FMCW
    包括发射一个已知且稳定频率的信号，该信号由另一个频率上下变化的连续信号调制（常用的调频方式有三角波、锯齿波、编码调制或者噪频等）。当遇到障碍物体后，发射的电磁波被反射，产生与发射信号有一定频率差的回波，接收天线接收到雷达回波并调解后，雷达处理芯片对模拟信号进行数字采样，并进行响应的滤波，如图
    2.5 所示。进一步使用快速傅里叶变换算法将信号转换为频域，然后再寻找信号中的特定特征（如信号强度、频率变化等），获取目标的位置以及速度等测量信息，并对目标进行编号和跟踪。


    ![](img/txt002_6.jpg "pagenumber_ebook=37,pagenumber_book=27")

    图 2.5　毫米波雷达的工作过程


    #### 毫米波雷达的应用

    毫米波雷达因其硬件体积小，而且不受恶劣天气影响，被广泛应用在智能网联汽车先进驾驶辅助系统或无人驾驶汽车上。

    目前世界各国对车载毫米波雷达分配的频段各有不同，主要有 24GHz、60GHz、77GHz、79GHz4 个频段。现阶段各国对毫米波在智能汽车上的应用以 24GHz
    近距离雷达和 77GHz 远距离雷达组合的形式出现，24GHz 近距离雷达主要负责近距离探测，应用于盲点监测系统和后碰撞预警系统等，77GHz 远距离雷达主要负责中长距离探测，应用于自适应巡航系统、自动紧急制动系统和前碰撞预警系统等。


    ### 激光雷达

    #### 激光雷达的定义

    激光雷达利用激光器作为发射光源，主要通过光学方法来测量目标距离、速度和反射率等特征量。它是工作在光波频段的雷达，利用光波频段的电磁波先向目标发射探测信号，然后将其接收到的同波信号与发射信号相比较，从而获得目标的位置（距离、方位和高度）、运动状态（速度、姿态）等信息，实现对目标的探测、跟踪和识别。激光雷达能够确定物体的位置、大小、外部形貌等特征量，其采集到的物体信息呈现出一系列分散的、具有准确角度和距离信息的点，这些点被称为点云。点云指目标表面特性的海量点集合。当一束激光照射到物体表面时，所反射的激光会携带方位、距离等信息。若将激光束按照某种轨迹进行扫描，便会边扫描边记录到反射的激光点信息，由于扫描极为精细，则能够得到大量的激光点，因而就可形成激光点云。常见的激光雷达主要有机械式激光雷达、固态激光雷达和混合式固态激光雷达。从现有市场状况来看，机械式激光雷达最为常用；固态式激光雷达为未来业界大力发展的方向；混合式激光雷达是机械式激光雷达和纯固态式激光雷达的折中方案，是目前阶段量产装车的主流产品。


    ##### 机械式激光雷达

    机械旋转式激光雷达目前技术较为成熟，业界多采用此种方案。发射系统和接收系统存在物理意义上的转动，不断地旋转发射器，将激光点变成线，并在竖直方向上排布多束激光发射器形成面，实现
    3D 扫描的目标。但其内部结构复杂，主要包括激光器、扫描器、光电探测器以及位置和导航器件等。由于其通过复杂的机械结构实现高频准确的转动，硬件成本高，且很难保持长时间稳定运行，业界寿命多为
    2 万～3 万小时（正常使用的话寿命约为 2～3 年），因此目前固态式激光雷达成为很多公司的研究方向。


    ##### 固态式激光雷达

    泛光面阵式技术（快闪，原理类似相机）是目前全固态式激光雷达中较为成熟的技术，它可以短时间直接发出一大片覆盖探测区域的激光，以高灵敏度的接收器来完成周围环境的绘制，能快速记录整个场景，避免了扫描过程中雷达或目标的移动带来的麻烦。但是每次发射的光线会散布在整个视场内，这意味着只有小部分激光会投射到某些特定点，很难进行远距离探测。


    ##### 混合式激光雷达

    微机电系统（Micro-Electro-Mechanical System，MEMS）型激光雷达是一种混合式激光雷达，主要基于微振镜引导激光束射向不同方向，可以动态调整自己的扫描模式，以此来聚焦特殊物体，可以采集更远、更小物体的细节信息实现对其的识别。微振镜的出现极大地减小了激光雷达的体积且降低了成本，且其由于惯性力矩较小，可以实现快速移动，因此在中远测距方面有巨大潜力，但其稳定性方面有待商榷。


    #### 激光雷达的优缺点

    ##### 激光雷达的优点

    ①可全天候工作。激光雷达不受白天和黑夜的光照条件的限制。

    ②分辨率高。激光雷达方向性好，激光束发散角小，能量集中，有很好的分辨率和灵敏度，探测精度高。

    ③信息量丰富。激光雷达可以获得幅度、频率和相位等信息，并且多普勒频移大，可以探测从低速到高速的目标。

    ④抗干扰能力强，隐蔽性好，激光不受无线电波干扰，能穿透等离子鞘套，低仰角工作时，对地面的多路径效应不敏感。

    ⑤激光雷达具有三维建模功能，能够检测周围 360°范围内的所有物体。


    ##### 激光雷达的缺点

    ①成本高，上万美元的造价足以令很多车厂望而却步。机械旋转式激光雷达可以使激光束 360°无死角扫描，精度最高，但是成本也最高，难以实现车规量产，目前主要用在无人车上面。固态式激光雷达通过电子部件来控制激光的发射角度，所以成本相对低，体积更小，但稳定性比较差，目前也没有实现量产。混合式激光雷达为一种折中的方案，成本比较低，目前华为推出的混合式激光雷达仅售
    200 美元左右。

    ②垂直分辨率低。在通常不到 16 层的低成本模型中，垂直分辨率（连续层之间的间隔）下降到 2°。距离为 100m 时，垂直距离为 1.7m。高端机型将垂直距离降低到
    0.2°～0.4°，但成本要高得多。

    ③稀疏度不密集。商用设备 Velodyne HDL64 的两分散度为 0.11°，垂直分辨率为 0.42°。一般来说，在 50m 的距离处，层与层之间 0.3°的间隙相当于
    0.26m 高的盲条，但当探测距离为 200m 时，两个激光束之间的距离为 1.4m，也就是说，在 200m 之后，只能检测到高于 1.4m 的障碍物了。

    ④对暗色和镜面反射物体的探测能力差。黑色汽车在激光雷达下可能不可见，因为它结合了一个能吸收大部分辐射的颜色和一种不会将辐射散射回接收器的非朗伯材料。

    ⑤会受天气的影响。近红外激光束会受到雨和雾的影响，因为水滴会散射光，降低其工作范围，进而导致其在云层前方产生虚假测量。


    #### 激光雷达的结构与工作原理

    激光雷达如图 2.6 所示，是由发射系统、接收系统、信号采集处理系统、控制系统等组成的，其工作原理如图 2.7 所示。


    ![](img/txt002_7.jpg "pagenumber_ebook=39,pagenumber_book=29")

    图 2.6　激光雷达


    ![](img/txt002_8.jpg "pagenumber_ebook=39,pagenumber_book=29")

    图 2.7　激光雷达系统的工作原理


    激光雷达多采用光飞行时间法（Time of Flight，TOF），即通过发射和接受激光束，计算激光遇到障碍物的折返时间，分析得出目标与设备的相对距离，并测量得到障碍物的轮廓，这些信息经过处理能够获得
    3D 环境地图，且精度能够达到厘米级。


