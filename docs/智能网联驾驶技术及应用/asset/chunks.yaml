- raw: "基于车-车、车-路、车-云、车-移动终端通信，交通参与者、道路运营方之间进行一系列信息交互，并产生决策信息。决策信息进入接收方的智能驾驶系统，但接收方不一定需要按照接收到的决策信息行驶，融合后的决策信息由智能驾驶系统执行。配合不同应用场景，消息可通过广播、组播、单播发出。\n\
    \n4.网联驾驶等级3（融合控制）\n\n基于车-车、车-路、车-云、车-移动终端通信，特定交通参与者按照特定操作者的指示完成驾驶任务，包括控制指令或调度信息等。控制信息通过单播发出，进入自动驾驶系统，融合后的控制信息由自动驾驶系统或云控平台执行。\n\
    \n表1.3进一步细化了网联驾驶各等级的具体要素。每个等级都从典型信息、信息融合主体两个维度分别进行描述。原则上，高级别网联化融合的等级对低级别网联化融合的等级具有包容性。\n\
    \n表1.3　网联化融合技术等级\n\n![](images/txt001_7.jpg \"pagenumber_ebook=20,pagenumber_book=10\"\
    )\n\n鉴于各国尚未形成成熟的智能化网联化融合发展路线，依据网联信息对汽车驾驶自动化等级的支撑作用，判定融合发展将经历3个发展阶段，即信息提醒和精确预警阶段、车路云一体化的辅助驾驶（Advanced\
    \ Driving Assistance System，C-ADAS）阶段、车路云一体化的自动驾驶（Autonomous Driving，CAD）阶段。\n\
    \n在信息提醒和精确预警阶段，网联信息或其与单车智能的感知、多传感器数据融合处理后的感知信息，以提醒、预警方式在人机交互界面显示，随着车道级定位和高精地图的应用和普及，预警内容逐步丰富。\n\
    \n在车路云一体化的辅助驾驶（C-ADAS）阶段，符合相应信息安全、功能安全要求的网联信息进入智驾域，开始支撑车辆辅助驾驶。\n\n在车路云一体化的自动驾驶（CAD）阶段，符合相应信息安全、功能安全要求的网联信息开始支撑车辆自动驾驶。在道路基础设施建设和车载通信设施搭载均达到相当高的程度时，车路云一体化的自动驾驶逐步实现普及。\n\
    \n为避免网联化融合技术的4个等级与融合发展的3个发展阶段的定义混淆，表1.4形成4×3的矩阵，梳理了各等级与各阶段的关系。表1.4分为横向、纵向两个视角：横向视角中，同一融合技术等级的消息内容的指标相同，但由于3个发展阶段对于该消息内容的指标不同，最终的应用场景由左至右增强或新增；纵向视角中，由于各融合技术等级中消息内容的指标的不同，最终的应用场景由上至下增强或新增。\n\
    \n状态共享等级包含未进入智驾域的网联状态信息，只能应用于信息提醒和精确预警阶段。\n\n融合感知等级中的消息内容可分别应用在信息提醒和精确预警、C-ADAS、CAD3个阶段。由于自动驾驶系统在这3个阶段的功能安全、预期功能安全、信息安全的要求不同，因此其拆解至车载通信设备、路侧设备、云平台必须满足的安全要求也不同。\n\
    \n融合决策等级中的消息内容可分别应用在C-ADAS、CAD两个阶段。因为网联导入的决策信息已经超越车内提醒预警的范畴，因此不包括信息提醒和精确预警阶段。\n\
    \n网联融合控制等级中的消息内容只应用在CAD阶段。因为无法保证人类驾驶员参与协同，因此不包括C-ADAS阶段。\n\n表1.4　网联化融合技术等级与发展阶段关系\n\
    \n![](images/txt001_8.jpg \"pagenumber_ebook=21,pagenumber_book=11\")\n\n1.3　智能网联驾驶的发展趋势\n\
    \n当前，新一轮科技革命和产业变革蓬勃兴起，车联网、自动驾驶技术融合将带来汽车生态链的全局变革，智能化、互联化已经成为未来汽车技术的发展趋势；作为解决未来汽车社会面临的交通安全、道路拥堵、能源消耗、环境污染等问题的重要手段，智能网联驾驶作为汽车产业发展的战略方向已经成为全球共识，也是世界汽车强国争夺的战略高地。本节将从国外和国内智能网联驾驶的发展趋势两个角度进行梳理。\n\
    \n1.3.1　国外智能网联驾驶的发展趋势\n\n各国结合本地技术优势和产业基础，通过制定新的政策法规、探索发展路径、鼓励技术创新、开展测试示范、完善基础设施建设等方式，加强智能网联汽车创新发展。\n\
    \n美国强调技术中立，鼓励技术创新，在平衡创新与安全的基础上，总体呈现为监管持续弱化的特征，截至2022年相继发布了《自动驾驶汽车》系列政策、《智能交通系统战略规划2020～2025》《自动驾驶汽车综合计划》《自动驾驶乘员保护安全最终规则》等政策法规，对自动驾驶范围进行了延伸，确定了自动驾驶汽车研发和整合的联邦原则，描述了美国未来5年智能交通发展的重点任务和保障措施，提出了建设3类自动驾驶应用公共平台的任务，支持CARMA等平台的建设，明确了实现自动驾驶系统（Autonomous\
    \ Driving Solution，ADS）愿景的3个目标，明确了低速无人货车、低级别自动驾驶乘用车、高级别自动驾驶乘用车、高速公路自动驾驶货车、低速接驳车五大优先发展领域，完善了自动驾驶汽车制造商对全自动汽车碰撞测试的标准等。\n\
    \n同时，美国加强车路协同建设，密歇根州修建了首条专供网联汽车和自动驾驶汽车使用的40英里（1英里＝1.60千米）长的道路，美国计划将该道路用于支撑研究物理基础设施、数字基础设施、协同基础设施以及运营基础设施的建设和运营。\n\
    \n欧盟立足商业布局，率先开展自动驾驶保险、责任规则及伦理道德研究，相继发布了《通往自动化出行之路：欧盟未来出行战略》《网联式自动驾驶技术路线图》《自动驾驶汽车的豁免程序指南》《关于在网联车辆和出行相关应用程序中处理个人数据的指南》《可持续与智能交通战略》等政策法规，提出了协调国家对自动驾驶车辆的临时安全评估，并聚焦于网联车辆和出行相关应用场景下的个人数据处理问题，为保护用户隐私和数据安全风险提供了参考建议，开展了自动驾驶路线图的顶层规划，提出了网联式自动驾驶与支撑自动驾驶能力的基础设施级别分级（Infrastructure\
    \ Support levels for Automated Driving，ISAD），计划到2030年大规模部署自动驾驶出行服务并普及完全自动驾驶等。\n\
    \n德国的Ko-HAF项目、欧盟的C-ITS项目、大陆集团的e-Horizon项目都聚焦在智能驾驶和V2X领域，推动了智能网联驾驶行业的发展。同时，欧洲各国加快法律法规制的修订，支撑高级别智能网联汽车的商业化应用。德国制定《自动驾驶法》，支持特定场景L4级别的自动驾驶应用。英国、法国、德国等纷纷修订法律法规，支持自动车道保持功能（Automated\
    \ Lane Keeping Systems，ALKS）的商业化应用，其中德国已经为奔驰颁发L3级别的智能网联汽车型式认证。\n\n日本通过将智能交通、智慧城市深度融合来发展自动驾驶，在全国范围内部署大量的实路操作测试（Field\
    \ Operational Test，FOT），有效推动自动驾驶的测试验证与示范推广。2018年至2022年，日本相继发布了《自动驾驶汽车安全技术指南》《道路交通法（修正案）》，并持续更新发布了《官民ITS构想·路线图》《实现自动驾驶行动方针》等政策法规，列举了一系列自动驾驶汽车所应满足的安全条件，制定了L3级别的自动驾驶的相关章程，研讨并制定了自动驾驶路线图以推动相关国际标准协调工作，探讨了L4级别的自动驾驶的基础设施协同机制与商业模式等。\n\
    \nSIP-adus以构建世界最安全的交通体系并服务社会为目的，已经进入2.0阶段，计划到2025年，私家车、卡车运输实现高速公路L4级别的自动驾驶，在全国范围实现无人驾驶出行。此外，日本已经于2020年11月为本田Legend车型颁发全球首个L3级别的自动驾驶系统安全认证，该车型也已经面向共享出行市场公开发售。\n\
