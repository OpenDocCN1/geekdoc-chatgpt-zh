    ## 6.3 闯红灯预警技术


    ### 6.3.1 闯红灯预警的定义


    闯红灯预警（Red Light Violation Warning，`RLVW`）是指，主车（`HV`）经过有信号控制的交叉口（车道），车辆存在不按信号灯规定或指示行驶的风险时，`RLVW`应用对驾驶员进行预警。本应用适用于城市、郊区道路及公路的交叉路口、环道出入口和可控车道、高速路入口和隧道等有信号控制的车道，闯红灯过程如图
    6.2 所示。


    `RLVW`应用可辅助驾驶员安全通过信号灯路口，提高信号灯路口的同行安全。


    ![](img/txt006_9.jpg "pagenumber_ebook=141,pagenumber_book=131")


    图 6.2 闯红灯过程


    ### 6.3.2 闯红灯预警的主要场景


    当前方有大车遮挡视线（如图 6.3 所示）或恶劣天气影响视线，或其他原因，使`HV`无法对当前红灯或即将到来的红灯做出正确判断时，`RLVW`应用检测`HV`当前所处位置和速度等，通过计算预测车头经过路口停止线时信号灯的状态，并向驾驶员进行预警。


    ![](img/txt006_10.jpg "pagenumber_ebook=142,pagenumber_book=132")


    图 6.3 被大车遮挡信号灯


    ### 6.3.3 闯红灯预警的基本原理与算法实现


    当`HV`驶向具有信号灯控制的交叉路口（车道），遇信号灯即将变红灯或正处于红灯状态，但车辆未能停止在停止线内而继续前行时，`RLVW`应用将对该车驾驶员进行预警。触发`RLVW`功能的`HV`与路口设施的位置关系如图
    6.4 所示。


    ![](img/txt006_11.jpg "pagenumber_ebook=142,pagenumber_book=132")


    图 6.4 触发`RLVW`功能的`HV`与路口设施的位置关系


    `RLVW`的基本工作原理如下。


    ①具有短程、远程通信能力的`RSU`定时发送路口地理位置信息和信号灯实时状态信息。

    ②`HV`依据本身`GNSS`地理信息，确定当前受管控信号的相位，并计算其与停止线的距离。

    ③`HV`依据当前速度和其他交通参数预估到达路口的时间。

    ④`RLVW`将这些信息与接收到的红灯切换时刻和红灯保留时长信息进行对比分析，决定是否预警。

    ⑤当此时信号灯是红灯时，`Trest·Vcur＜distend`才会预警，其中`Trest`是当前灯的剩余时间，`Vcur`是`HV`当前车速，`distend`是`HV`目前距离停车线的距离。如果`HV`距离停车线很近，则会进行停车预警。


    本书实现`RLVW`算法的具体思路如下：


    ①定义一个函数`doRLVW()`，它接受 2 个参数：`hvInfo`和`spatInfo`。`hvInfo`表示主车信息，`spatInfo`表示信号灯信息。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中 0 表示无须预警，1 表示一般预警，2
    表示紧急预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`slow_down`表示减速行驶，`emergency_stop`表示紧急停车。

    ③从`hvInfo`中提取主车的 x 坐标和 y 坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。

    ④判断主车是否静止（速度小于 0.1），如果是，则直接返回`warning_flag`和`adviser`，即无须预警。

    ⑤从`spatInfo`中提取红绿灯信息，包括信号灯的当前状态及其剩余时间，以及红灯、绿灯、黄灯的持续时间。

    ⑥调用自定义函数`my_calc_distance()`，分别计算主车和信号灯路口之间的纵向、横向和直线距离。

    ⑦计算主车以当前速度在当前信号灯剩余时间内能够前进的距离。

    ⑧若当前为红灯，且在红灯剩余时间内，主车以当前速度能够到达信号灯路口，则将`warning_flag`设为 1，将`adviser`设为`slow_down`；若红灯时主车距离路口小于
    5m，则将`warning_flag`设为 2，将`adviser`设为`emergency_stop`。

    ⑨最终返回`warning_flag`和`adviser`作为函数输出。


