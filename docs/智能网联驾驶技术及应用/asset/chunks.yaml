    ## 7.4 道路危险状况提示技术


    ### 7.4.1 道路危险状况提示的定义

    道路危险状况提示（Hazardous Location Warning，HLW）是指，主车（HV）行驶到有潜在危险状况（如桥下存在较深积水、路面有深坑、道路湿滑、前方急转弯等）路段，存在发生事故风险时，HLW
    应用对 HV 驾驶员进行预警。HLW 应用适用于城市道路、郊区道路和高速公路等容易发生危险状况的路段以及临时性存在道路危险状况的路段。

    HLW 应用将道路危险状况及时通知周围车辆，便于驾驶员提前进行处置，提高车辆对危险路况的感知能力，降低驶入该危险区域的车辆发生事故的风险。


    ### 7.4.2 道路危险状况提示的主要场景

    当道路存在危险状况时，附近 RSU 或临时路侧设备对外广播道路危险状况提示信息，包括位置、危险类型、危险描述等，行经该路段的 HV 根据信息及时采取避让措施，避免发生事故，如图
    7.3 所示。

    ![](img/txt007_13.jpg "pagenumber_ebook=158,pagenumber_book=148")

    图 7.3 道路危险的主要场景


    ### 7.4.3 道路危险状况提示的基本工作原理与算法实现

    HLW 的基本工作原理如下。

    ①具备短程无线通信能力的 RSU 周期性对外广播道路危险状况提示信息。

    ②HV 依据自身位置信息和道路危险状况提示信息，计算自己与道路危险区域的距离。

    ③HV 依据当前速度计算自己到达道路危险区域的时间。

    ④系统通过 HMI 对驾驶员进行及时的预警。

    本书实现 HLW 算法的具体思路如下。

    ①定义一个函数`doHLW()`，它接受两个参数：`hvInfo`和`rteInfo`。`hvInfo`表示主车信息，`rteInfo`表示 RSI。

    ②函数内部首先初始化一个变量：`warning_flag`。`warning_flag`表示预警等级，其中 0 表示无须预警，1 表示需要道路危险状况提示预警。

    ③从`hvInfo`中提取主车的 x 坐标和 y 坐标、速度、航向角、尺寸和车辆类型，从`rteInfo`中提取危险路况或道路施工范围，并将其赋值给相应的变量。

    ④调用`distance()`函数，计算主车和危险路段之间的距离。

    ⑤若距离小于安全阈值，则将`warning_flag`设为 1。

    ⑥最终返回`warning_flag`作为函数输出。

