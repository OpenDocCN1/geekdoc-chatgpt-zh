    ## 5.3 交叉路口碰撞预警技术

    ### 5.3.1 交叉路口碰撞预警的定义

    交叉路口碰撞预警（`Intersection Collision Warning`，`ICW`）是指主车（`HV`）驶向交叉路口，与侧向行驶的远车（`RV`）存在碰撞危险时，`ICW`应用将对`HV`驾驶员进行预警。本应用适用于城市及郊区普通道路及公路的交叉路口、环道入口、高速路入口等碰撞危险的预警。


    `ICW`应用辅助驾驶员避免或减小侧向碰撞危害，提高交叉路口的通行安全系数。


    ### 5.3.2 交叉路口碰撞预警的主要场景

    `ICW`包括如下主要场景。

    场景一：`HV`停止在路口，`RV-1`从`HV`左侧或右侧驶向路口，`HV`的视线可能被出现在路口的`RV-2`所遮挡，如图5.6所示。`HV`启动并准备进入路口时，`ICW`应用对`HV`驾驶员发出预警，提醒驾驶员与侧向来车`RV-1`存在碰撞危险。预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV-1`发生碰撞。在此过程中，`HV`和`RV-1`需具备短程无线通信能力，`RV-2`是否具备短程无线通信能力不影响应用场景的有效性。


    ![](images/txt005_11.jpg "pagenumber_ebook=116,pagenumber_book=106")

    图5.6　`HV`在路口起步


    场景二：`HV`驶向路口，同时`RV-1`从`HV`左侧或右侧驶向路口，`HV`的视线可能被出现在路口的`RV-2`所遮挡，如图5.7所示。当`HV`驶近路口时，`ICW`应用对`HV`驾驶员发出预警，提醒驾驶员与侧向来车`RV-1`存在碰撞危险；预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV-1`发生碰撞。在此过程中，`HV`和`RV-1`需具备短程无线通信能力，`RV-2`是否具备短程无线通信能力不影响应用场景的有效性。


    ![](images/txt005_12.jpg "pagenumber_ebook=116,pagenumber_book=106")

    图5.7　`HV`和`RV`同时驶向路口


    ### 5.3.3 交叉路口碰撞预警的基本原理与算法实现

    若`HV`在驶向交叉路口时与任意一辆驶向同一路口的`RV`存在碰撞危险，`ICW`应用就会对`HV`驾驶员进行预警。触发`ICW`功能的`HV`和`RV`的位置关系如图5.8所示，其中`HV`和`RV`行驶方向不限于垂直交叉（90°），可为一定范围内的多角度交叉。


    ![](images/txt005_13.jpg "pagenumber_ebook=117,pagenumber_book=107")

    图5.8　触发`ICW`功能的`HV`和`RV`的位置关系


    `ICW`的基本工作原理如下。

    ①`HV`的`OBU`接收`RV`的`BSM`并分析接收到的消息，筛选出位于交叉路口左侧（`Intersecting Left`）或交叉路口右侧（`Intersecting
    Right`）区域的`RV`。`RV`消息可能由`RV`发出或从路侧单元获取。

    ②进一步筛出选处于一定距离范围内的`RV`作为潜在威胁车辆。

    ③计算每一个潜在威胁车辆到达路口的时间（`Time-to-Intersection`，`TTI`）和到达路口的距离（`Distance-to-Intersection`，`DTI`），筛选出与`HV`存在碰撞危险的威胁车辆。

    ④若有多个威胁车辆，则筛选出最紧急的威胁车辆。

    ⑤系统通过`HMI`对`HV`驾驶员进行相应的碰撞预警。


    本书实现`ICW`算法的具体思路如下。

    ①定义一个函数`doICW`，它接受3个参数：`hvInfo`、`rvInfo`和`IcwTTC`。`hvInfo`和`rvInfo`表示主车和远车的信息，`IcwTTC`表示交叉碰撞预警时间阈值。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中0表示无须预警，1表示需要减速预警，2表示需要紧急停车预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`slow_down`表示减速行驶，`emergency_stop`表示紧急停车。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的x坐标和y坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。

    ④调用`my_calc_distance`函数，分别计算主车和远车之间的纵向、横向和直线距离、相对位置关系以及两车与交叉路口的位置关系。

    ⑤计算两车之间的碰撞时间，如果该时间小于`IcwTTC`，则将`warning_flag`设为1，并将`adviser`设为`slow_down`；然后计算两车之间的有效距离，如果该距离小于10，则将`warning_flag`设为2，并将`adviser`设为`emergency_stop`。

    ⑥最终返回`warning_flag`和`adviser`作为函数输出。


