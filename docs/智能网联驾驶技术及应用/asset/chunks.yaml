    \n①在左侧进行参数配置：一是通信参数，包括发包大小、发包频率和发包数目；二是环境参数，包括通信距离和环境参数。\n\n②配置好相关参数后，单击“测试”开始实验，并显示实验进度，若发现问题，可单击“取消”停止实验。\n\
