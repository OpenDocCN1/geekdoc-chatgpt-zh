    )\n\n智能网联驾驶技术及应用\n\n朱孔林　张　琳　王易之　石　勇　编著\n\n![](images/bok001_2.jpg \"pagenumber_ebook=3,pagenumber_book=0\"\
    )\n\n\uFEFF\n\n内容简介\n\n本书顺应智能网联驾驶技术及应用的发展方向，从智能化和网联化两个维度对自动驾驶技术及其应用进行介绍和分析。本书从智能网联驾驶的概念及关键技术入手，对智能网联驾驶技术的定义和发展历程、车路协同的自动驾驶感知技术、车联网通信技术以及车路信息交互技术等开展了详细的分析与讨论。此外，本书还介绍了智能网联驾驶在碰撞预警、交叉路口预警和盲区预警等不同场景的应用及其算法。最后，本书将智能网联驾驶的关键技术和其在不同场景的应用以实验的形式介绍给读者，帮助读者理解和学习相关技术及应用。\n\
    \n本书既可以作为从事智能网联驾驶相关研究和开发人员的参考用书，也可以作为大专院校计算机、通信、人工智能、智能交通等相关专业的本科生和研究生教材。\n\n\
    智能网联驾驶是将智能驾驶和网联驾驶进行深度融合而形成的高等级无人驾驶技术。\n\n\uFEFF\n\n前言\n\n智能化和网联化互为补充，可实现更加安全高效的无人驾驶，在一定程度上解决单车自动驾驶在感知、决策和控制等方面的问题。智能网联驾驶作为高等级无人驾驶的必要手段，受到了学术界和工业界的广泛关注。然而，针对智能网联驾驶进行系统介绍、分析和实践的教学书籍较少。本书正是顺应智能网联驾驶技术及应用的发展方向，从智能网联驾驶的概念、发展历程以及感知、通信与信息交互等关键技术入手，系统介绍了智能网联驾驶在碰撞预警、交叉路口预警预警和盲区预警等不同场景的应用及其算法，并通过实验帮助读者理解和学习相关技术及应用。\n\
    \n全书共7章。本书的每一章都包含智能网联驾驶相关的原理和技术以及相应实践，在原理和技术方面具有一定的专业性和前瞻性，同时兼顾技术实践。第1章是智能网联驾驶技术概述，简要介绍了智能网联驾驶的基本概念、技术等级和发展趋势，以及智能网联驾驶系统认知台架实验。第2章是智能网联驾驶感知技术，重点阐述了智能网联驾驶中的环境感知任务、环境感知传感器、环境感知方法以及智能网联驾驶路侧感知实验。第3章是智能网联驾驶无线通信技术，主要介绍了智能网联驾驶无线通信技术、专用短程通信技术和基于蜂窝网络的车联网通信技术以及智能网联驾驶无线通信设备，以及智能网联驾驶无线通信台架实验。第4章是智能网联驾驶交互消息，重点针对智能网联应用场景和基础消息的定义与格式进行了介绍，并结合实验进行了智能网联消息应用实践。第5章是智能网联驾驶碰撞预警应用，主要介绍了前向碰撞预警等碰撞预警类应用的定义、主要场景、基本原理和算法实现，并结合碰撞预警实验对此类应用进行了实践。第6章是智能网联驾驶信号灯路口场景应用，重点介绍了绿波车速引导、闯红灯预警等路口类应用的定义、应用场景、基本原理和算法实现，并进行了路口类应用实验。第7章是智能网联驾驶交通事件场景应用，主要阐述了限速预警、紧急车辆提醒等交通事件场景类应用的定义、主要场景、基本原理和算法实现，并结合相应的交通事件场景实验对此类应用进行了实践。限于篇幅，本书未能对智能网联驾驶的相关技术和应用介绍得非常全面和详尽，有兴趣的读者可以通过查阅相关资料进一步进行学习。\n\
    \n本书由北京邮电大学联合北京星云互联科技有限公司共同完成，在编写过程中得到来自北京邮电大学的老师、学生和北京星云互联科技有限公司的多位专家的支持，包括张广岐、谷健、吴煊佴、王奇、任家旺、巨旭华、祁相龙、庄思远、张颖、汪佳兴等，作者谨在此向他们致以深深的谢意。\n\
    \n在本书编写过程中，作者参阅了大量的文献资料，从中得到了许多有益的启示和帮助，在此向这些文献的作者表示衷心的感谢。\n\n由于编写时间短，作者水平有限，本书难免有疏漏和不足之处，恳请各位同行和读者批评指正。\n\
