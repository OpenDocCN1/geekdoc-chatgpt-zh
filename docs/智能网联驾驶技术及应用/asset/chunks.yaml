    ## 5. 交通灯相位与时序消息


    ### 1. 定义

    交通灯相位与时序消息（Signal Phase Timing Message，`SPAT`）包含了一个或多个路口信号灯的当前状态信息。结合`MAP`，可为车辆提供实时的前方信号灯相位信息。`SPAT`的使用场景如图4.10所示。


    ![](images/txt004_19.jpg "pagenumber_ebook=101,pagenumber_book=91")


    图4.10　`SPAT`消息使用场景


    ### 2. 消息主体结构及说明

    `SPAT`同样包含消息`ID`、发送时间戳、字符串描述。`SPAT`的主体信息为信号灯状态集合，道路交通中的信号灯设在路口处，并主要指示信号灯的颜色及持续时间的信息。因此在`SPAT`中，需要定义路口`ID`、信号灯相位状态。其中的信号灯相位状态就是信号灯的颜色、剩余时间，可能也会包括信号灯的下一个相位状态。


    此外，`SPAT`中还包括信号灯的工作状态指示，以不用的数字代表不同的工作状态。`SPAT`也会对消息的产生以及存档的时间戳进行记录，根据需求可额外定义相应的时间可信度。


    图4.11给出了`SPAT`的主体结构，其中实线框为必有项，虚线框为可选项。


    ![](images/txt004_20.jpg "pagenumber_ebook=102,pagenumber_book=92")


    图4.11　`SPAT`的主体结构


    ### 3. `SPAT`应用

    `SPAT`通常由`RSU`集成信号机或者接入信号机采集终端来完成灯态的对接和下发，通常信号灯消息包含一个或多个路口信号灯的状态信息。


    在实际应用中`SPAT`多配合`MAP`使用，为车辆提供实时的信号灯相位消息及行车诱导。在另一阶段中主要的应用场景为闯红灯预警和绿波车速引导，即当车辆在行驶到路口之前提前为用户下发相关灯态，并根据车辆的行驶情况给用户播报对应的预警信息，让用户能够不停车通过路口或避免发生闯红灯事件。


