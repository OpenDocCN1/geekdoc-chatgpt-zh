    # 第 2 章 智能网联驾驶感知技术

    ![](img/txt002_1.jpg "pagenumber_ebook=31,pagenumber_book=21")


    智能网联驾驶感知技术


    智能网联驾驶的关键组成技术是环境感知技术和车辆控制技术，其中环境感知技术是智能网联汽车行驶的基础技术。本章主要介绍智能网联驾驶中的感知技术，车辆通过将各类硬件传感器（如相机、雷达等传感器）采集到的数据进行收集、融合处理，来实现对周边环境的感知。


    ## 2.1 环境感知的任务

    在日新月异的智能网联汽车领域，环境感知是智能网联汽车的核心技术之一，是智能网联汽车其他技术的数据基础，为智能决策和控制执行提供依据，更是智能网联汽车实现自动驾驶的第一步。智能网联汽车利用视觉传感器、超声波雷达（也称超声波传感器）、毫米波雷达、激光雷达等获取道路、车辆位置和障碍物的信息，各种传感器成为智能汽车的手、眼睛、耳朵、舌头、鼻子甚至大脑，收集汽车驾驶过程和环境中所有能被感受到的各种测量数据和信息，并将测量数据和信息分类处理分析后进行信息输出，来满足汽车驾驶智能化、自动化过程中对于环境感知的需要。


    智能网联驾驶环境感知的任务主要可以分为 4 个模块：动态物体检测（Dynamic Object Detection，DOD）、通行空间（Free Space，FS）、车道线检测（Lane
    Detection，LD）、静态物体检测（Static Object Detection）\[10\]。


    ### 1. 动态物体检测


    '
  toc: []
- raw: '动态物体检测是对车辆（轿车、卡车、电动车、自行车）、行人等动态物体进行识别。该检测的难点包括检测类别多、追踪目标多、测距精度要求高；外界环境因素复杂，遮挡情况多，朝向不一；行人、车辆类型种类众多，难以覆盖，容易误检；面临追踪、行人身份切换等众多挑战。


    2.通行空间


    通行空间是对车辆行驶的安全边界（可行驶区域）进行划分，主要针对车辆、普通路边沿、侧石边沿、没有障碍物可见的边界、未知边界等进行划分。


    该检测的难点包括在复杂环境场景下，边界形状复杂多样，泛化难度较大。除此以外，不同于其他有明确的单一的检测类型的检测（如对车辆、行人、交通灯的检测），通行空间需要准确划分行驶安全区域，以及对影响车辆前行的障碍物边界。但是在车辆加减速、路面颠簸、上下坡道时，相机俯仰角会发生变化，原有的相机标定参数不再准确，投影到世界坐标系后会出现较大的测距误差，通行空间边界会出现收缩或开放等问题。


    3.车道线检测


    车道线检测是对各类车道线（单侧/双侧车道线、实线、虚线、双线）进行检测，还包括对线型的颜色（白色/黄色/蓝色）以及特殊的车道线（汇流线、减速线等）等进行检测，目前在辅助驾驶领域有着较为成熟的应用。


    与此同时，车道线检测的难点也很多，如线型种类多，不规则路面检测难度大。例如，在地面积水、标识无效、修补路面、阴影等情况下，车道线易被误检、漏检。弯曲的车道线、远端的车道线、环岛的车道线等情况的拟合难度较大，检测结果易模糊不清等。


    4.静态物体检测


    静态物体检测是对交通红绿灯、交通标志等静态物体进行检测识别。这类物体是自动驾驶行驶过程中遇到最多的物体之一。


    该检测的难点主要有两点：其一是对红绿灯、交通标识的检测难度大，该类物体的检测属于小物体检测，其在图像中所占的像素比较少，尤其是对于远距离的路口，检测难度更大；其二是在强光照的情况下，有时人眼都难以辨别，而停在路口的斑马线前的汽车，需要对红绿灯进行正确地识别才能做下一步的判断。除此以外，交通标识种类众多，采集到的数据易出现数量不均匀的情况，导致检测模型训练不完善。


    对于如何使用传感器进行感知任务，业界主要分成两派：一个是纯视觉感知方案；另一个是多传感器融合感知方案。


    纯视觉感知方案仅依靠摄像头搜集环境信息，然后将图片传输到计算芯片进行分析，比较像人类驾驶车辆，先通过眼睛来捕捉周围的信息，再将信息传输给大脑做决策。当然，纯视觉＋AI的方案比人眼的视角更广，通过大量的图片信息让汽车内部的计算系统拥有以汽车为中心的“上帝视角”。纯视觉感知方案的优点主要是实现成本相对较低，更接近人类驾驶，通过高分辨率、高帧率的成像技术获取的环境信息更加丰富；缺点主要是摄像头捕捉环境信息容易受到环境光的干扰，且纯视觉感知方案对于图像的处理更依赖训练，难免出现环境认知的“死角”。目前，采用纯视觉感知方案实现自动驾驶的企业主要有特斯拉、百度和极氪等。


    多传感器融合感知方案则是通过摄像头、毫米波雷达、激光雷达等设备一起收集车辆的周边信息。且由于激光雷达是自发光并不受环境光影响，因此激光雷达能够获取更深度的空间信息，对于物体的位置、距离和大小感知更准确，不过，多传感器融合感知方案也有自己的局限性，如激光雷达容易受到雨雪雾天气的影响。由于激光雷达本身价值数千美元，成本高，加上多传感器融合往往对计算芯片有更高的算力要求，因此多传感器融合感知方案在成本上没有优势。目前，采用多传感器融合感知方案实现自动驾驶的企业主要有小鹏、蔚来、极狐等。


    2.2　环境感知传感器


    智能驾驶感知技术离不开各种传感器技术的支持。各种感知传感器服务于智能网联汽车，对道路、车辆、行人、障碍物等进行检测和识别，并将相关信息传输给控制中心，为智能网联汽车提供决策依据，保障智能网联汽车驾乘安全，确保智能网联汽车准确到达目的地。传感器类型一般包括超声波雷达、毫米波雷达、视觉传感器和激光雷达等\[11\]。对于不同的传感器，其优势与特征都是各不相同的，大多数自动驾驶都需要配备多种传感器，才能在复杂的世界中对外界物体进行尽可能全覆盖地感知。


    2.2.1　超声波雷达


    超声波雷达是利用超声波发生器产生超声波，发射超声波，然后通过接受探头接受障碍物反射的超声波，并根据超声波反射接收的时差计算出于障碍物的距离，从而实现对障碍物的探测。


    1）超声波雷达的定义


    频率高于人类听觉上限频率（约20kHz）的声波称为超声波。超声波雷达是利用超声波的特性研制而成的传感器，是在超声频率范围内将交变的电信号转化为声信号或将外界声场中的声信号转化为电信号的能量转换器件。


    按照超声波雷达工作时在水平方向和垂直方向探测角度范围的不同，其可以分为等方向性传感器和异方向性传感器。等方向性传感器在水平方向和垂直方向的探测范围相同，如在两个方向上均探测120°范围；异方向性传感器在水平方向和垂直方向的探测范围不同，如水平方向探测范围为120°，垂直方向探测范围为60°。等方向性传感器因在垂直方向的探测范围较大，容易探测到地面而无法探测较远的距离，故车辆多使用异方向性传感器。


    2）超声波雷达的优缺点


    （1）超声波雷达的优点


    ①超声波的传播速度仅为光波的百万分之一，并且指向性强，能量消耗缓慢，因此可以直接测量较近目标的距离，一般测量距离小于10m。


    ②超声波对色彩、光照度不敏感.可适用于识别透明、半透明及漫反射差的物体。


    ③超声波对外界光线和电磁场不敏感，可用于黑暗、有灰尘或烟雾、电磁干扰强、有毒等恶劣环境。


    ④超声波雷达结构简单，体积小，成本低，信息处理简单可靠，易于集成化，并且可以进行实时控制。


    （2）超声波雷达的缺点


    ①探测距离短。因为超声波的散射角比较大，波长比较长，对应的频率就会比较低，所以探测距离比较近，一般在3m左右。


    ②会受天气环境条件的影响。因为超声波不是光，在雨雾天气、炎热天气、高速场景下表现不是很好，所以超声波雷达广泛用来作为倒车以及泊车雷达。


    3）超声波雷达的结构与工作原理


    超声波雷达如图2.1所示。其结构组成可以分为超声波发生器、接收器和控制器。超声波发生器是核心部件。图2.2为超声波雷达测距工作示意图，由超声波发生器产生信号并向外发射，遇到障碍物后信号产生反射，反射的信号由超声波接收器接受并被送给控制器处理，由芯片记录声波的往返时间，计算出车辆与障碍物的距离。


    ![](images/txt002_2.jpg "pagenumber_ebook=34,pagenumber_book=24")


    图2.1　超声波雷达


    ![](images/txt002_3.jpg "pagenumber_ebook=34,pagenumber_book=24")


    图2.2　超声波雷达的测距原理


    4）超声波雷达的应用


    超声波雷达多用于自动泊车、倒车辅助、障碍物预警等系统，通常安装在汽车的前、后保险杠上和汽车侧面，图2.3所示为一种典型的超声波雷达在车上的布置方式，前、后保险杠位置各布置4个超声波雷达，在左、右侧面的前、后端各布置1个。在自动泊车系统中，利用超声波雷达探测空置的位置。在倒车辅助时，车辆挂入倒挡后，位于前、后保险杠位置的超声波雷达实时探测障碍物位置，并通过声音或图像等方式发出提示，以弥补倒车时驾驶员视线的不足。有些带有盲点监测或并线辅助系统的车型在行车时也会开启超声波雷达，其用于近距离障碍物的实时探测和预警，进一步在自动驾驶过程中联合其他系统可对车辆进行控制以提高行车安全性。


    ![](images/txt002_4.jpg "pagenumber_ebook=35,pagenumber_book=25")


    图2.3　超声波雷达的应用


    2.2.2　毫米波雷达


    毫米波雷达通过发射与接收高频电磁波来探测目标，通过信号处理模块对回波信号进行数据处理，计算出目标的距离、速度、角度等信息。常见的毫米波雷达有24GHz毫米波雷达和77GHz毫米波雷达。


    1）毫米波雷达的定义


    毫米波是指长度为1～10mm的电磁波，毫米波的频带频率高于射频，低于可见光和红外线，相应的频率范围为30～300GHz。毫米波雷达是通过发射和接收毫米波段的电磁波来测量车辆与车辆之间的距离、角度和相对速度的装置。毫米波位于微波与远红外波相交叠的波长范围，所以毫米波兼有这两种波谱的优点，同时也有自己独特的性质。毫米波雷达主要用于先进驾驶辅助系统中的自动制动辅助系统、盲区监测预警系统等。


    2）毫米波雷达的优缺点


    （1）毫米波雷达的优点


    ①探测性能好。毫米波雷达探测不受颜色与温度的影响。


    ②响应速度快。毫米波的传播速度与光速一样，并且其调制简单，配合高速信号处理系统，可以快速地测量出目标的角度、距离、速度等信息。


    ③对环境的适应性强。毫米波具有很强的穿透能力，在雨、雪、大雾等恶劣天气下依然可以正常工作。由于其天线属于微波天线，因此相较于光波天线，它在大雨及轻微上霜的情况下依然可以正常工作。


    ④抗干扰能力强。毫米波雷达一般工作在高频段，而周围的噪声和干扰处于中低频区，基本上不会影响毫米波雷达的正常运行，因此，毫米波雷达具有抗低频干扰特性。


    （2）毫米波雷达的缺点


    ①毫米波在空气中传播时会受到空气中的氧气和水蒸气的影响，这些气体的谐振会对毫米波频率产生选择性吸收和散射，导致其大气传播衰减严重。因此，实际应用中，应找到毫米波在大气中传播时，由气体分子谐振吸收所致衰减为极小值的频率。


    ②对目标反射率敏感。处理毫米波雷达数据是一项棘手的任务，部分原因是不同材料的非均匀反射率不同。金属可以放大雷达信号，方便对车辆的检测，但会增加道路上废弃罐等小物体的表观尺寸，而木材等其他材料在这种情况下几乎是透明的。这可能会导致检测到不存在的障碍物和未检测到实际障碍物的误报。


    ③分辨率和准确性。毫米波雷达非常精确地测量传感器与目标之间的距离和速度。然而，水平分辨率取决于发射光束的特性。数字波束形成系统中的原始角度分辨率在2°到5°之间，可以使用先进的处理技术将其提高到0.1°到1°。使用这种角度分辨率，很难在30m的距离上将行人与附近的汽车分开（作为独立目标检测）。在100m的距离内，不可能将相邻车道上的车辆分开，难以确定车辆是否在同一车道上，甚至不可能检测到道路上的车辆或桥梁。


    3）毫米波雷达的结构与工作原理


    毫米波雷达如图2.4所示，其系统结构主要包括背板、毫米波基础电路、主体压铸板、收/发天线阵列和雷达整流罩。天线是汽车毫米波雷达有效运行的关键设计，以高频印刷电路板的方式集成在基板上。收发芯片通常使用一种特殊的半导体，如硅锗（SiGe）双极晶体管、互补金属氧化物半导体（Complementary
    Metal Oxide Semiconductor，CMOS）等。


    双极晶体管是早前应用比较广泛的毫米波雷达方案，但它占用大量集成电路板空间且成本较高。随着半导体技术的进步，CMOS在数字电路中的应用越来越广泛，其成本相对较低，与双极晶体管相比，CMOS可以在低电压下工作，降低了功耗，目前在毫米波雷达领域得到了更为广泛的应用。


    ![](images/txt002_5.jpg "pagenumber_ebook=36,pagenumber_book=26")


    图2.4　毫米波雷达


    车载毫米波雷达通过发射电磁波信号（毫米波波段）并接收回波信号来测定汽车车身周围的物理环境信息（如汽车与其他物体之间的相对距离、相对速度、角度、运动、运动方向等），然后根据所探知的物体信息进行目标追踪和识别分类，进而结合车身动态信息进行数据融合，完成合理决策，减少事故发生率。


    大多数现代汽车雷达基于调频连续波（Frequency Modulated Continuous Wave，FMCW）技术，并使用数字波束形成来控制发射波的方向。FMCW包括发射一个已知且稳定频率的信号，该信号由另一个频率上下变化的连续信号调制（常用的调频方式有三角波、锯齿波、编码调制或者噪频等）。当遇到障碍物体后，发射的电磁波被反射，产生与发射信号有一定频率差的回波，接收天线接收到雷达回波并调解后，雷达处理芯片对模拟信号进行数字采样，并进行响应的滤波，如图2.5所示。进一步使用快速傅里叶变换算法将信号转换为频域，然后再寻找信号中的特定特征（如信号强度、频率变化等），获取目标的位置以及速度等测量信息，并对目标进行编号和跟踪。


    ![](images/txt002_6.jpg "pagenumber_ebook=37,pagenumber_book=27")


    图2.5　毫米波雷达的工作过程


    4）毫米波雷达的应用


    毫米波雷达因其硬件体积小，而且不受恶劣天气影响，被广泛应用在智能网联汽车先进驾驶辅助系统或无人驾驶汽车上。


    目前世界各国对车载毫米波雷达分配的频段各有不同，主要有24GHz、60GHz、77GHz、79GHz4个频段。现阶段各国对毫米波在智能汽车上的应用以24GHz近距离雷达和77GHz远距离雷达组合的形式出现，24GHz近距离雷达主要负责近距离探测，应用于盲点监测系统和后碰撞预警系统等，77GHz远距离雷达主要负责中长距离探测，应用于自适应巡航系统、自动紧急制动系统和前碰撞预警系统等。


    2.2.3　激光雷达


    1）激光雷达的定义


    激光雷达利用激光器作为发射光源，主要通过光学方法来测量目标距离、速度和反射率等特征量。它是工作在光波频段的雷达，利用光波频段的电磁波先向目标发射探测信号，然后将其接收到的同波信号与发射信号相比较，从而获得目标的位置（距离、方位和高度）、运动状态（速度、姿态）等信息，实现对目标的探测、跟踪和识别。激光雷达能够确定物体的位置、大小、外部形貌等特征量，其采集到的物体信息呈现出一系列分散的、具有准确角度和距离信息的点，这些点被称为点云。点云指目标表面特性的海量点集合。当一束激光照射到物体表面时，所反射的激光会携带方位、距离等信息。若将激光束按照某种轨迹进行扫描，便会边扫描边记录到反射的激光点信息，由于扫描极为精细，则能够得到大量的激光点，因而就可形成激光点云。常见的激光雷达主要有机械式激光雷达、固态激光雷达和混合式固态激光雷达。从现有市场状况来看，机械式激光雷达最为常用；固态式激光雷达为未来业界大力发展的方向；混合式激光雷达是机械式激光雷达和纯固态式激光雷达的折中方案，是目前阶段量产装车的主流产品。


    ①机械式激光雷达。机械旋转式激光雷达目前技术较为成熟，业界多采用此种方案。发射系统和接收系统存在物理意义上的转动，不断地旋转发射器，将激光点变成线，并在竖直方向上排布多束激光发射器形成面，实现3D扫描的目标。但其内部结构复杂，主要包括激光器、扫描器、光电探测器以及位置和导航器件等。由于其通过复杂的机械结构实现高频准确的转动，硬件成本高，且很难保持长时间稳定运行，业界寿命多为2万～3万小时（正常使用的话寿命约为2～3年），因此目前固态式激光雷达成为很多公司的研究方向。


    ②固态式激光雷达。泛光面阵式技术（快闪，原理类似相机）是目前全固态式激光雷达中较为成熟的技术，它可以短时间直接发出一大片覆盖探测区域的激光，以高灵敏度的接收器来完成周围环境的绘制，能快速记录整个场景，避免了扫描过程中雷达或目标的移动带来的麻烦。但是每次发射的光线会散布在整个视场内，这意味着只有小部分激光会投射到某些特定点，很难进行远距离探测。


    ③混合式激光雷达。微机电系统（Micro-Electro-Mechanical System，MEMS）型激光雷达是一种混合式激光雷达，主要基于微振镜引导激光束射向不同方向，可以动态调整自己的扫描模式，以此来聚焦特殊物体，可以采集更远、更小物体的细节信息实现对其的识别。微振镜的出现极大地减小了激光雷达的体积且降低了成本，且其由于惯性力矩较小，可以实现快速移动，因此在中远测距方面有巨大潜力，但其稳定性方面有待商榷。


    2）激光雷达的优缺点


    （1）激光雷达的优点


    ①可全天候工作。激光雷达不受白天和黑夜的光照条件的限制。


    ②分辨率高。激光雷达方向性好，激光束发散角小，能量集中，有很好的分辨率和灵敏度，探测精度高。


    ③信息量丰富。激光雷达可以获得幅度、频率和相位等信息，并且多普勒频移大，可以探测从低速到高速的目标。


    ④抗干扰能力强，隐蔽性好，激光不受无线电波干扰，能穿透等离子鞘套，低仰角工作时，对地面的多路径效应不敏感。


    ⑤激光雷达具有三维建模功能，能够检测周围360°范围内的所有物体。


    （2）激光雷达的缺点


    ①成本高，上万美元的造价足以令很多车厂望而却步。机械旋转式激光雷达可以使激光束360°无死角扫描，精度最高，但是成本也最高，难以实现车规量产，目前主要用在无人车上面。固态式激光雷达通过电子部件来控制激光的发射角度，所以成本相对低，体积更小，但稳定性比较差，目前也没有实现量产。混合式激光雷达为一种折中的方案，成本比较低，目前华为推出的混合式激光雷达仅售200美元左右。


    ②垂直分辨率低。在通常不到16层的低成本模型中，垂直分辨率（连续层之间的间隔）下降到2°。距离为100m时，垂直距离为1.7m。高端机型将垂直距离降低到0.2°～0.4°，但成本要高得多。


    ③稀疏度不密集。商用设备Velodyne HDL64的两分散度为0.11°，垂直分辨率为0.42°。一般来说，在50m的距离处，层与层之间0.3°的间隙相当于0.26m高的盲条，但当探测距离为200m时，两个激光束之间的距离为1.4m，也就是说，在200m之后，只能检测到高于1.4m的障碍物了。


    ④对暗色和镜面反射物体的探测能力差。黑色汽车在激光雷达下可能不可见，因为它结合了一个能吸收大部分辐射的颜色和一种不会将辐射散射回接收器的非朗伯材料。


    ⑤会受天气的影响。近红外激光束会受到雨和雾的影响，因为水滴会散射光，降低其工作范围，进而导致其在云层前方产生虚假测量。


    3）激光雷达的结构与工作原理


    激光雷达如图2.6所示，是由发射系统、接收系统、信号采集处理系统、控制系统等组成的，其工作原理如图2.7所示。


    ![](images/txt002_7.jpg "pagenumber_ebook=39,pagenumber_book=29")


    图2.6　激光雷达


    ![](images/txt002_8.jpg "pagenumber_ebook=39,pagenumber_book=29")


    图2.7　激光雷达系统的工作原理


    激光雷达多采用光飞行时间法（Time of Flight，TOF），即通过发射和接受激光束，计算激光遇到障碍物的折返时间，分析得出目标与设备的相对距离，并测量得到障碍物的轮廓，这些信息经过处理能够获得3D环境地图，且精度能够达到厘米级。'
  fmt: '

    ## 动态物体检测

    动态物体检测是对车辆（轿车、卡车、电动车、自行车）、行人等动态物体进行识别。该检测的难点包括检测类别多、追踪目标多、测距精度要求高；外界环境因素复杂，遮挡情况多，朝向不一；行人、车辆类型种类众多，难以覆盖，容易误检；面临追踪、行人身份切换等众多挑战。


    ## 通行空间

    通行空间是对车辆行驶的安全边界（可行驶区域）进行划分，主要针对车辆、普通路边沿、侧石边沿、没有障碍物可见的边界、未知边界等进行划分。

    该检测的难点包括在复杂环境场景下，边界形状复杂多样，泛化难度较大。除此以外，不同于其他有明确的单一的检测类型的检测（如对车辆、行人、交通灯的检测），通行空间需要准确划分行驶安全区域，以及对影响车辆前行的障碍物边界。但是在车辆加减速、路面颠簸、上下坡道时，相机俯仰角会发生变化，原有的相机标定参数不再准确，投影到世界坐标系后会出现较大的测距误差，通行空间边界会出现收缩或开放等问题。


    ## 车道线检测

    车道线检测是对各类车道线（单侧/双侧车道线、实线、虚线、双线）进行检测，还包括对线型的颜色（白色/黄色/蓝色）以及特殊的车道线（汇流线、减速线等）等进行检测，目前在辅助驾驶领域有着较为成熟的应用。

    与此同时，车道线检测的难点也很多，如线型种类多，不规则路面检测难度大。例如，在地面积水、标识无效、修补路面、阴影等情况下，车道线易被误检、漏检。弯曲的车道线、远端的车道线、环岛的车道线等情况的拟合难度较大，检测结果易模糊不清等。


    ## 静态物体检测

    静态物体检测是对交通红绿灯、交通标志等静态物体进行检测识别。这类物体是自动驾驶行驶过程中遇到最多的物体之一。

    该检测的难点主要有两点：其一是对红绿灯、交通标识的检测难度大，该类物体的检测属于小物体检测，其在图像中所占的像素比较少，尤其是对于远距离的路口，检测难度更大；其二是在强光照的情况下，有时人眼都难以辨别，而停在路口的斑马线前的汽车，需要对红绿灯进行正确地识别才能做下一步的判断。除此以外，交通标识种类众多，采集到的数据易出现数量不均匀的情况，导致检测模型训练不完善。


    ## 感知方案

    对于如何使用传感器进行感知任务，业界主要分成两派：一个是纯视觉感知方案；另一个是多传感器融合感知方案。


    ### 纯视觉感知方案

    纯视觉感知方案仅依靠摄像头搜集环境信息，然后将图片传输到计算芯片进行分析，比较像人类驾驶车辆，先通过眼睛来捕捉周围的信息，再将信息传输给大脑做决策。当然，纯视觉＋AI的方案比人眼的视角更广，通过大量的图片信息让汽车内部的计算系统拥有以汽车为中心的“上帝视角”。纯视觉感知方案的优点主要是实现成本相对较低，更接近人类驾驶，通过高分辨率、高帧率的成像技术获取的环境信息更加丰富；缺点主要是摄像头捕捉环境信息容易受到环境光的干扰，且纯视觉感知方案对于图像的处理更依赖训练，难免出现环境认知的“死角”。目前，采用纯视觉感知方案实现自动驾驶的企业主要有特斯拉、百度和极氪等。


    ### 多传感器融合感知方案

    多传感器融合感知方案则是通过摄像头、毫米波雷达、激光雷达等设备一起收集车辆的周边信息。且由于激光雷达是自发光并不受环境光影响，因此激光雷达能够获取更深度的空间信息，对于物体的位置、距离和大小感知更准确，不过，多传感器融合感知方案也有自己的局限性，如激光雷达容易受到雨雪雾天气的影响。由于激光雷达本身价值数千美元，成本高，加上多传感器融合往往对计算芯片有更高的算力要求，因此多传感器融合感知方案在成本上没有优势。目前，采用多传感器融合感知方案实现自动驾驶的企业主要有小鹏、蔚来、极狐等。


    ## 环境感知传感器

    智能驾驶感知技术离不开各种传感器技术的支持。各种感知传感器服务于智能网联汽车，对道路、车辆、行人、障碍物等进行检测和识别，并将相关信息传输给控制中心，为智能网联汽车提供决策依据，保障智能网联汽车驾乘安全，确保智能网联汽车准确到达目的地。传感器类型一般包括超声波雷达、毫米波雷达、视觉传感器和激光雷达等\[11\]。对于不同的传感器，其优势与特征都是各不相同的，大多数自动驾驶都需要配备多种传感器，才能在复杂的世界中对外界物体进行尽可能全覆盖地感知。


    ### 超声波雷达

    超声波雷达是利用超声波发生器产生超声波，发射超声波，然后通过接受探头接受障碍物反射的超声波，并根据超声波反射接收的时差计算出于障碍物的距离，从而实现对障碍物的探测。


    #### 超声波雷达的定义

    频率高于人类听觉上限频率（约20kHz）的声波称为超声波。超声波雷达是利用超声波的特性研制而成的传感器，是在超声频率范围内将交变的电信号转化为声信号或将外界声场中的声信号转化为电信号的能量转换器件。

    按照超声波雷达工作时在水平方向和垂直方向探测角度范围的不同，其可以分为等方向性传感器和异方向性传感器。等方向性传感器在水平方向和垂直方向的探测范围相同，如在两个方向上均探测120°范围；异方向性传感器在水平方向和垂直方向的探测范围不同，如水平方向探测范围为120°，垂直方向探测范围为60°。等方向性传感器因在垂直方向的探测范围较大，容易探测到地面而无法探测较远的距离，故车辆多使用异方向性传感器。


    #### 超声波雷达的优缺点

    ##### 超声波雷达的优点

    ①超声波的传播速度仅为光波的百万分之一，并且指向性强，能量消耗缓慢，因此可以直接测量较近目标的距离，一般测量距离小于10m。

    ②超声波对色彩、光照度不敏感.可适用于识别透明、半透明及漫反射差的物体。

    ③超声波对外界光线和电磁场不敏感，可用于黑暗、有灰尘或烟雾、电磁干扰强、有毒等恶劣环境。

    ④超声波雷达结构简单，体积小，成本低，信息处理简单可靠，易于集成化，并且可以进行实时控制。


    ##### 超声波雷达的缺点

    ①探测距离短。因为超声波的散射角比较大，波长比较长，对应的频率就会比较低，所以探测距离比较近，一般在3m左右。

    ②会受天气环境条件的影响。因为超声波不是光，在雨雾天气、炎热天气、高速场景下表现不是很好，所以超声波雷达广泛用来作为倒车以及泊车雷达。


    #### 超声波雷达的结构与工作原理

    超声波雷达如图2.1所示。其结构组成可以分为超声波发生器、接收器和控制器。超声波发生器是核心部件。图2.2为超声波雷达测距工作示意图，由超声波发生器产生信号并向外发射，遇到障碍物后信号产生反射，反射的信号由超声波接收器接受并被送给控制器处理，由芯片记录声波的往返时间，计算出车辆与障碍物的距离。


    ![](images/txt002_2.jpg "pagenumber_ebook=34,pagenumber_book=24")

    图2.1　超声波雷达


    ![](images/txt002_3.jpg "pagenumber_ebook=34,pagenumber_book=24")

    图2.2　超声波雷达的测距原理


    #### 超声波雷达的应用

    超声波雷达多用于自动泊车、倒车辅助、障碍物预警等系统，通常安装在汽车的前、后保险杠上和汽车侧面，图2.3所示为一种典型的超声波雷达在车上的布置方式，前、后保险杠位置各布置4个超声波雷达，在左、右侧面的前、后端各布置1个。在自动泊车系统中，利用超声波雷达探测空置的位置。在倒车辅助时，车辆挂入倒挡后，位于前、后保险杠位置的超声波雷达实时探测障碍物位置，并通过声音或图像等方式发出提示，以弥补倒车时驾驶员视线的不足。有些带有盲点监测或并线辅助系统的车型在行车时也会开启超声波雷达，其用于近距离障碍物的实时探测和预警，进一步在自动驾驶过程中联合其他系统可对车辆进行控制以提高行车安全性。


    ![](images/txt002_4.jpg "pagenumber_ebook=35,pagenumber_book=25")

    图2.3　超声波雷达的应用


    ### 毫米波雷达

    毫米波雷达通过发射与接收高频电磁波来探测目标，通过信号处理模块对回波信号进行数据处理，计算出目标的距离、速度、角度等信息。常见的毫米波雷达有24GHz毫米波雷达和77GHz毫米波雷达。


    #### 毫米波雷达的定义

    毫米波是指长度为1～10mm的电磁波，毫米波的频带频率高于射频，低于可见光和红外线，相应的频率范围为30～300GHz。毫米波雷达是通过发射和接收毫米波段的电磁波来测量车辆与车辆之间的距离、角度和相对速度的装置。毫米波位于微波与远红外波相交叠的波长范围，所以毫米波兼有这两种波谱的优点，同时也有自己独特的性质。毫米波雷达主要用于先进驾驶辅助系统中的自动制动辅助系统、盲区监测预警系统等。


    #### 毫米波雷达的优缺点

    ##### 毫米波雷达的优点

    ①探测性能好。毫米波雷达探测不受颜色与温度的影响。

    ②响应速度快。毫米波的传播速度与光速一样，并且其调制简单，配合高速信号处理系统，可以快速地测量出目标的角度、距离、速度等信息。

    ③对环境的适应性强。毫米波具有很强的穿透能力，在雨、雪、大雾等恶劣天气下依然可以正常工作。由于其天线属于微波天线，因此相较于光波天线，它在大雨及轻微上霜的情况下依然可以正常工作。

    ④抗干扰能力强。毫米波雷达一般工作在高频段，而周围的噪声和干扰处于中低频区，基本上不会影响毫米波雷达的正常运行，因此，毫米波雷达具有抗低频干扰特性。


    ##### 毫米波雷达的缺点

    ①毫米波在空气中传播时会受到空气中的氧气和水蒸气的影响，这些气体的谐振会对毫米波频率产生选择性吸收和散射，导致其大气传播衰减严重。因此，实际应用中，应找到毫米波在大气中传播时，由气体分子谐振吸收所致衰减为极小值的频率。

    ②对目标反射率敏感。处理毫米波雷达数据是一项棘手的任务，部分原因是不同材料的非均匀反射率不同。金属可以放大雷达信号，方便对车辆的检测，但会增加道路上废弃罐等小物体的表观尺寸，而木材等其他材料在这种情况下几乎是透明的。这可能会导致检测到不存在的障碍物和未检测到实际障碍物的误报。

    ③分辨率和准确性。毫米波雷达非常精确地测量传感器与目标之间的距离和速度。然而，水平分辨率取决于发射光束的特性。数字波束形成系统中的原始角度分辨率在2°到5°之间，可以使用先进的处理技术将其提高到0.1°到1°。使用这种角度分辨率，很难在30m的距离上将行人与附近的汽车分开（作为独立目标检测）。在100m的距离内，不可能将相邻车道上的车辆分开，难以确定车辆是否在同一车道上，甚至不可能检测到道路上的车辆或桥梁。


    #### 毫米波雷达的结构与工作原理

    毫米波雷达如图2.4所示，其系统结构主要包括背板、毫米波基础电路、主体压铸板、收/发天线阵列和雷达整流罩。天线是汽车毫米波雷达有效运行的关键设计，以高频印刷电路板的方式集成在基板上。收发芯片通常使用一种特殊的半导体，如硅锗（SiGe）双极晶体管、互补金属氧化物半导体（Complementary
    Metal Oxide Semiconductor，CMOS）等。

    双极晶体管是早前应用比较广泛的毫米波雷达方案，但它占用大量集成电路板空间且成本较高。随着半导体技术的进步，CMOS在数字电路中的应用越来越广泛，其成本相对较低，与双极晶体管相比，CMOS可以在低电压下工作，降低了功耗，目前在毫米波雷达领域得到了更为广泛的应用。


    ![](images/txt002_5.jpg "pagenumber_ebook=36,pagenumber_book=26")

    图2.4　毫米波雷达


    车载毫米波雷达通过发射电磁波信号（毫米波波段）并接收回波信号来测定汽车车身周围的物理环境信息（如汽车与其他物体之间的相对距离、相对速度、角度、运动、运动方向等），然后根据所探知的物体信息进行目标追踪和识别分类，进而结合车身动态信息进行数据融合，完成合理决策，减少事故发生率。

    大多数现代汽车雷达基于调频连续波（Frequency Modulated Continuous Wave，FMCW）技术，并使用数字波束形成来控制发射波的方向。FMCW包括发射一个已知且稳定频率的信号，该信号由另一个频率上下变化的连续信号调制（常用的调频方式有三角波、锯齿波、编码调制或者噪频等）。当遇到障碍物体后，发射的电磁波被反射，产生与发射信号有一定频率差的回波，接收天线接收到雷达回波并调解后，雷达处理芯片对模拟信号进行数字采样，并进行响应的滤波，如图2.5所示。进一步使用快速傅里叶变换算法将信号转换为频域，然后再寻找信号中的特定特征（如信号强度、频率变化等），获取目标的位置以及速度等测量信息，并对目标进行编号和跟踪。


    ![](images/txt002_6.jpg "pagenumber_ebook=37,pagenumber_book=27")

    图2.5　毫米波雷达的工作过程


    #### 毫米波雷达的应用

    毫米波雷达因其硬件体积小，而且不受恶劣天气影响，被广泛应用在智能网联汽车先进驾驶辅助系统或无人驾驶汽车上。

    目前世界各国对车载毫米波雷达分配的频段各有不同，主要有24GHz、60GHz、77GHz、79GHz4个频段。现阶段各国对毫米波在智能汽车上的应用以24GHz近距离雷达和77GHz远距离雷达组合的形式出现，24GHz近距离雷达主要负责近距离探测，应用于盲点监测系统和后碰撞预警系统等，77GHz远距离雷达主要负责中长距离探测，应用于自适应巡航系统、自动紧急制动系统和前碰撞预警系统等。


    ### 激光雷达

    #### 激光雷达的定义

    激光雷达利用激光器作为发射光源，主要通过光学方法来测量目标距离、速度和反射率等特征量。它是工作在光波频段的雷达，利用光波频段的电磁波先向目标发射探测信号，然后将其接收到的同波信号与发射信号相比较，从而获得目标的位置（距离、方位和高度）、运动状态（速度、姿态）等信息，实现对目标的探测、跟踪和识别。激光雷达能够确定物体的位置、大小、外部形貌等特征量，其采集到的物体信息呈现出一系列分散的、具有准确角度和距离信息的点，这些点被称为点云。点云指目标表面特性的海量点集合。当一束激光照射到物体表面时，所反射的激光会携带方位、距离等信息。若将激光束按照某种轨迹进行扫描，便会边扫描边记录到反射的激光点信息，由于扫描极为精细，则能够得到大量的激光点，因而就可形成激光点云。常见的激光雷达主要有机械式激光雷达、固态激光雷达和混合式固态激光雷达。从现有市场状况来看，机械式激光雷达最为常用；固态式激光雷达为未来业界大力发展的方向；混合式激光雷达是机械式激光雷达和纯固态式激光雷达的折中方案，是目前阶段量产装车的主流产品。


    ##### 机械式激光雷达

    机械旋转式激光雷达目前技术较为成熟，业界多采用此种方案。发射系统和接收系统存在物理意义上的转动，不断地旋转发射器，将激光点变成线，并在竖直方向上排布多束激光发射器形成面，实现3D扫描的目标。但其内部结构复杂，主要包括激光器、扫描器、光电探测器以及位置和导航器件等。由于其通过复杂的机械结构实现高频准确的转动，硬件成本高，且很难保持长时间稳定运行，业界寿命多为2万～3万小时（正常使用的话寿命约为2～3年），因此目前固态式激光雷达成为很多公司的研究方向。


    ##### 固态式激光雷达

    泛光面阵式技术（快闪，原理类似相机）是目前全固态式激光雷达中较为成熟的技术，它可以短时间直接发出一大片覆盖探测区域的激光，以高灵敏度的接收器来完成周围环境的绘制，能快速记录整个场景，避免了扫描过程中雷达或目标的移动带来的麻烦。但是每次发射的光线会散布在整个视场内，这意味着只有小部分激光会投射到某些特定点，很难进行远距离探测。


    ##### 混合式激光雷达

    微机电系统（Micro-Electro-Mechanical System，MEMS）型激光雷达是一种混合式激光雷达，主要基于微振镜引导激光束射向不同方向，可以动态调整自己的扫描模式，以此来聚焦特殊物体，可以采集更远、更小物体的细节信息实现对其的识别。微振镜的出现极大地减小了激光雷达的体积且降低了成本，且其由于惯性力矩较小，可以实现快速移动，因此在中远测距方面有巨大潜力，但其稳定性方面有待商榷。


    #### 激光雷达的优缺点

    ##### 激光雷达的优点

    ①可全天候工作。激光雷达不受白天和黑夜的光照条件的限制。

    ②分辨率高。激光雷达方向性好，激光束发散角小，能量集中，有很好的分辨率和灵敏度，探测精度高。

    ③信息量丰富。激光雷达可以获得幅度、频率和相位等信息，并且多普勒频移大，可以探测从低速到高速的目标。

    ④抗干扰能力强，隐蔽性好，激光不受无线电波干扰，能穿透等离子鞘套，低仰角工作时，对地面的多路径效应不敏感。

    ⑤激光雷达具有三维建模功能，能够检测周围360°范围内的所有物体。


    ##### 激光雷达的缺点

    ①成本高，上万美元的造价足以令很多车厂望而却步。机械旋转式激光雷达可以使激光束360°无死角扫描，精度最高，但是成本也最高，难以实现车规量产，目前主要用在无人车上面。固态式激光雷达通过电子部件来控制激光的发射角度，所以成本相对低，体积更小，但稳定性比较差，目前也没有实现量产。混合式激光雷达为一种折中的方案，成本比较低，目前华为推出的混合式激光雷达仅售200美元左右。

    ②垂直分辨率低。在通常不到16层的低成本模型中，垂直分辨率（连续层之间的间隔）下降到2°。距离为100m时，垂直距离为1.7m。高端机型将垂直距离降低到0.2°～0.4°，但成本要高得多。

    ③稀疏度不密集。商用设备Velodyne HDL64的两分散度为0.11°，垂直分辨率为0.42°。一般来说，在50m的距离处，层与层之间0.3°的间隙相当于0.26m高的盲条，但当探测距离为200m时，两个激光束之间的距离为1.4m，也就是说，在200m之后，只能检测到高于1.4m的障碍物了。

    ④对暗色和镜面反射物体的探测能力差。黑色汽车在激光雷达下可能不可见，因为它结合了一个能吸收大部分辐射的颜色和一种不会将辐射散射回接收器的非朗伯材料。

    ⑤会受天气的影响。近红外激光束会受到雨和雾的影响，因为水滴会散射光，降低其工作范围，进而导致其在云层前方产生虚假测量。


    #### 激光雷达的结构与工作原理

    激光雷达如图2.6所示，是由发射系统、接收系统、信号采集处理系统、控制系统等组成的，其工作原理如图2.7所示。


    ![](images/txt002_7.jpg "pagenumber_ebook=39,pagenumber_book=29")

    图2.6　激光雷达


    ![](images/txt002_8.jpg "pagenumber_ebook=39,pagenumber_book=29")

    图2.7　激光雷达系统的工作原理


    激光雷达多采用光飞行时间法（Time of Flight，TOF），即通过发射和接受激光束，计算激光遇到障碍物的折返时间，分析得出目标与设备的相对距离，并测量得到障碍物的轮廓，这些信息经过处理能够获得3D环境地图，且精度能够达到厘米级。

