    # 第 7 章 智能网联驾驶交通事件场景应用

    ![](img/txt007_1.jpg "pagenumber_ebook=152,pagenumber_book=142")

    智能网联驾驶交通事件场景应用

    在当前的驾驶条件下，每辆车大部分都作为独立个体存在，驾驶员的决策依据多依赖其视野范围内所观察到的交通环境，驾驶员很难实现与其他交通参与者联动或提前知晓前方超远道路的交通态势，做出非常合理的驾驶决策。

    在解决天候相关的交通安全方面，驾驶员很难感知到前方超远距离的天气环境或道路积水、湿滑等路况，导致其无法提前知晓前方潜在风险，无法提前采取规避手段，经常在遇到道路坑洼、积水时“手忙脚乱”地采取猛变道、急刹等驾驶行为，这极易导致车辆发生碰撞危险。当前方道路拥堵却不能及时知晓时，驾驶员就不能及时更改驾驶路线，影响出行。

    在道路的应急管理方面，自车由于很难关注到后方路况，因此在遇到紧急车辆需要优先通行完成特种作业任务、警方行动需要借道行驶等情况时，很难及时完成规避或变换车道，这既不易让特种车及时通行，也容易在变道时造成交通拥堵，甚至交通事故。

    因此如何让自车能够超视距、提前感知前方路况是关键，提前通过事件的下发提醒诱导驾驶员改变行程、提前变道规避或者协调道路通行，能有效地提升驾驶体验和道路通行效率。

    在智能网联相关的场景应用能力上，限速提醒能提醒驾驶员当前道路的限速信息，减少违章、超速等危险驾驶行为的出现；道路危险情况的提前下发和前方拥堵提醒能让驾驶员提前知晓前方路况，从容采取驾驶决策；紧急车辆提醒能够对交通参与者进行协调，让其提前给紧急车辆让道，满足紧急车辆快速通行的需要并尽可能减小对当前交通的影响。


    ## 7.1 交通事件场景介绍


    ## 7.2 限速预警技术


    ### 7.2.1 限速预警的定义

    限速预警（Speed Limit Warning，SLW）是指，主车（HV）行驶过程中，在超出限定速度的情况下，SLW 应用对 HV 驾驶员进行预警，提醒驾驶员减速行驶。本应用适用于普通道路及高速公路等有限速的道路。SLW
    应用可辅助驾驶员避免超速行驶，消除安全隐患，减少交通事故的发生。


    ### 7.2.2 限速预警的主要场景

    HV 和 RSU 需具备短程无线通信能力。HV 行驶时，RSU 周期性发送特定路段的限速信息。当 HV 判断自己在 RSU 指示的特定路段，且车速超过 RSU
    的速度限值时，SLW 应用对 HV 驾驶员发出预警，提醒驾驶员减速行驶，如图 7.1 所示。

    ![](img/txt007_2.jpg "pagenumber_ebook=153,pagenumber_book=143")

    图 7.1 车速超过限速时进行预警


    ### 7.2.3 限速预警的基本工作原理与算法实现

    SLW 的基本工作原理如下。

    ①HV 分析接收到的 RSU 消息。提取限速路段信息和具体限速大小。

    ②HV 根据本身的定位和行驶方向，将自身定位到特定路段上。

    ③如果 HV 检测到自己处在限速路段区域内，则判断自身是否在限速范围内；如果不满足限速要求，则触发超速报警。系统通过 HMI 对 HV 驾驶员进行相应的限速预警，提醒驾驶员减速。

    本书实现 SLW 算法的具体思路如下。

    ①定义一个函数`doSLW()`，它接受 3 个参数：`hvInfo`和`spdLmt`。`hvInfo`表示主车的信息，`spdLmt`表示主车所在道路的限速。

    ②函数内部首先初始化两个变量：`warningFlag`和`adviser`。`warningFlag`表示预警等级，其中 0 表示无须预警，1 表示需要减速预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`slow_down`表示减速行驶。

    ③从`hvInfo`中提取主车的 x 坐标和 y 坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。

    ④判断主车速度是否大于道路限速`spdLmt`，如果是，则将`warningFlag`设为 1，并将`adviser`设为`slow_down`。

    ⑤最终返回`warningFlag`和`adviser`作为函数输出。

