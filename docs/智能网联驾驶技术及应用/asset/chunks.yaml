  trans: '

    高效、准确地感知复杂的交通环境是保证自动驾驶汽车安全至关重要的一环，智能网联协同环境感知方法可以分为两类：一是通过融合多种传感器数据实现的融合感知方法，二是通过多个交通参与者共享感知信息实现的联合感知方法。


    ## 2.4.1 融合感知的定义和分类


    实现自动驾驶，是一定需要由多个传感器相互配合共同构成汽车的感知系统的。不同传感器的原理、功能各不相同，在不同的使用场景里可以发挥各自优势。多个同类或不同类传感器分别获得不同局部和类别的信息，这些信息之间可以相互补充。对各传感器采集的信息进行单独、孤立地处理，不仅会导致信息处理工作量的增加，还会割断了各传感器信息间的内在联系，丢失了信息经有机组合后可能蕴含的有关环境特征，造成了信息资源的浪费，甚至可能导致决策失误。


    多传感器融合的优势主要包括如下 4 个方面。


    ①提高系统感知的准确度。多种传感器联合互补，可避免单一传感器的局限性，最大限度发挥各个（种）传感器的优势。


    ②增加系统的感知维度，提高系统的可靠性和鲁棒性。多传感器融合可带来一定的信息冗余度，即使某一个传感器出现故障，系统仍可在一定范围内继续正常工作。


    ③增强环境适应能力。应用多传感器融合技术采集的信息具有明显的特征互补性，对空间和时间的覆盖范围更广，弥补了单一传感器对空间的分辨率和环境的语义不确定性。


    ④有效减少成本。融合可以实现用多个价格低廉的传感器设备代替价格昂贵的传感器设备，在保证性能的基础上又可以降低成本预算。


    在多传感器融合中，区别于同类传感器融合，多类传感器融合又属于多模态信息融合，在智能网联驾驶领域主要分为以下 3 类。


    ### 1. 激光雷达与视觉传感器融合


    如图 2.20 所示，激光雷达和视觉传感器融合是一个经典方案。在无人驾驶应用中，视觉传感器价格便宜，但是受环境光的影响较大，可靠性相对较低；激光雷达探测距离远，对物体的运动判断精准，可靠性高，但价格高。视觉传感器可进行车道线检测、障碍物检测和交通标志识别；激光雷达可进行路沿检测、动态和静态物体识别、定位和地图创建。对于动态的物体，视觉传感器能判断出前、后两帧中物体或行人是不是同一物体或行人，而激光雷达则能在得到信息后测算前、后两帧间隔内的运动速度和运动位移。


    ![](img/txt002_22.jpg "pagenumber_ebook=49,pagenumber_book=39")


    图 2.20　激光雷达和视觉传感器融合


    ### 2. 激光雷达与毫米波雷达融合


    激光雷达和毫米波雷达融合是新的流行方案，如图 2.21 所示。毫米波雷达已经成为 ADAS（Advanced Driver Assistance System，先进驾驶辅助系统）的核心传感器，它具有体积小、重量轻和空间分辨率高的特点，而且穿透雾、烟、灰尘的能力强，弥补了激光雷达的不足。但毫米波雷达受制于波长，探测距离有限，也无法感知行人，并且对周边所有的障碍物无法进行精准的建模，而这恰恰是激光雷达的强项。激光雷达和毫米波雷达不仅可以在性能上实现互补，还可以大大降低使用成本，为无人驾驶的开发提供了一个新的选择。


    ![](img/txt002_23.jpg "pagenumber_ebook=49,pagenumber_book=39")


    图 2.21　激光雷达和毫米波雷达融合


    ### 3. 视觉传感器与毫米波雷达融合


    如图 2.22 所示，将视觉传感器和毫米波雷达进行融合，两者相互配合共同构成智能网联汽车的感知系统，可取长补短，实现更稳定可靠的 ADAS 功能。视觉传感器与毫米波雷达融合后，信息互补，可信度提高，识别能力增强。


    ![](img/txt002_24.jpg "pagenumber_ebook=50,pagenumber_book=40")


    图 2.22　视觉传感器和毫米波雷达融合


    ## 2.4.2 联合感知的定义和分类


    随着深度学习的发展，尽管单车感知系统的鲁棒性、准确性在语义分割和目标检测等任务中都有了显著提高，但由于其只能从自身视角感知环境，因此视野视距有限，视野容易受到遮挡且存在远距离感知结果稀疏等问题，难以处理复杂的动态交通环境。


    为了突破单车感知系统的限制，同时得益于通信基础设施的建设和 V2X 等技术的发展，研究人员提出了联合感知技术：通过一定范围内的智能网联汽车、路侧基础设施等共享感知信息，实现从多个视点感知环境，使得感知结果更加完整、准确。


    根据联合感知共享的信息类型和所处阶段，可以将联合感知划分为早期联合、后期联合和中期联合 3 类。


    ### 1. 早期联合


    早期联合又称数据级联合，它是在智能网联汽车和路侧基础设施之间共享原始感知数据，在输入空间进行协同，先得到一个整体视角，然后进行后续处理，从而得到感知结果，如图
    2.23 所示。尽管原始感知数据信息丰富，数据联合后感知精度高，但由于数据量过大，数据实时性低，容易因大量数据负载而使通信网络拥塞，这阻碍了早期在大多数情况下的实际使用。


    ### 2. 后期联合


    后期联合又称决策级联合，它是在智能网联汽车和路侧基础设施之间共享感知结果，在输出空间中进行协同，如图 2.24 所示。尽管其感知结果的数据量小，耗费资源少，具有带宽经济性，但其丢失了大量细节信息，可处理性不足，且局部观测不完整，导致对车辆的定位误差非常敏感，估计误差和噪声较大。


    ![](img/txt002_25.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图 2.23　早期联合流程图


    ![](img/txt002_26.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图 2.24　后期联合流程图


    ### 3. 中期联合


    中期联合又称特征级联合，它是在智能网联汽车和路侧基础设施之间共享由每个个体的预测模型生成的中间特征，并在中间特征空间中进行协同，最终得到感知结果，如图 2.25
    所示。中期联合与早期联合相比，可以获得更经济的通信带宽，与后期联合相比，可以升级感知能力，兼具其他两种方式的优点。目前针对中期联合的研究则尚显不足，主要有两个方面的挑战：一是如何从原始测量数据中选择最有利的特征进行传输；二是如何最高效地联合来自其他设备的特征来增强自身的感知能力。


    ![](img/txt002_27.jpg "pagenumber_ebook=51,pagenumber_book=41")


    图 2.25　中期联合流程图


    ## 2.4.3 协同感知的挑战


    在本节中，我们将讨论现有的智能网联协同环境感知方法面临的挑战，并给出一些潜在的发展方向。


    ### 1. 通信


    有效的智能网联协同环境感知依赖网联设施之间可靠的通信。然而，在实际应用中，通信存在以下问题：一是随着网络中车辆数量的增加，每辆车辆可用的通信带宽有限；二是由于不可避免的通信延迟，车辆难以接收到其他车辆的实时信息；三是存在丢包等情况，甚至发生通信中断；四是
    V2X 通信可能遭受攻击，无法始终提供可靠服务。


    尽管通信技术在不断发展，通信服务质量也在不断提高，但上述问题仍将长期存在。然而，大多数现有工作都假设信息可以实时和无损地共享，基于理想通信条件进行研究，因此考虑这些通信约束并设计强大的协同感知系统对进一步的工作具有重要意义。


    ### 2. 多模态和数据异构


    目前大多数协同感知工作都聚焦于基于 LIDAR 点云的感知。然而，还有很多类型的数据对感知有着重要作用，如图像和毫米波雷达点，利用多模态感知数据是一种更有效合作的潜在方法。此外，不同的智能网联汽车之间以及智能网联汽车和路侧基础设施之间，由于传感器型号、安装位置和角度不同等原因，提供的信息质量不同，导致了数据异构问题。然而现有研究很少关注异构和多模态协同感知，如何在异构车辆网络中进行协同成为协同感知进一步实际应用的一个挑战。


    ### 3. 大规模数据集


    单车感知性能的提高离不开大规模数据集的增加和深度学习方法的发展。然而，现有的协同感知研究领域的数据集要么规模小，要么不公开，大规模开源数据集的缺乏阻碍了协同感知的进一步发展。此外，大部分数据集是基于仿真系统收集的，虽然仿真是一种经济、安全的验证算法的方法，但要将协同感知应用于实际，还需要真实的数据集。


    ## 2.5 智能网联驾驶路侧感知实验


    ### 2.5.1 实验目的路侧感知实验


