    # 第 3 章 智能网联驾驶无线通信技术


    ![](img/txt003_1.jpg "pagenumber_ebook=58,pagenumber_book=48")


    智能网联驾驶无线通信技术


    在现代交通系统中，每辆智能网联汽车不再是独立封闭的个体，智能网联汽车之间，智能网联汽车与道路基础设施之间、行人以及云平台之间都有信息交互，用以保证交通参与者可以安全行驶，提高通行效率。


    智能网联驾驶的“网联”主要是指通过通信技术实现车内、车-车、车-路、车-云之间的信息交互，本章主要讨论和关注智能网联驾驶无线通信技术。从历史脉络来看，智能网联驾驶无线通信技术经历了基于
    IEEE802.11 的专用短程通信（Dedicated Short Range Communication，DSRC）技术和基于蜂窝网络的车联网无线通信（Cellular
    Vehicle to Everything，C-V2X）技术两种主流技术。本章将主要对这两类技术进行介绍。


    ## 3.1 智能网联驾驶无线通信技术概述


    智能网联驾驶中的核心关键技术是无线通信技术。无线通信技术决定了车际网和车载移动互联网等之间大范围、大容量数据的交互、共享的实时性和有效性，是当前国内外技术演进的研究热点。


    ### 3.1.1 无线通信技术介绍


    如果车辆没有对外通信的能力，那么车辆在本质上就是一个孤岛。目前，用于智能网联驾驶无线通信的主流技术为 DSRC 技术和 C-V2X 技术。我国主导推动的是
    C-V2X 技术，包括 LTE-V2X（基于 4G 蜂窝网络的车联网无线通信技术）和 5G-V2X（NR-V2X\[17\]）（基于 5G 蜂窝网络的车联网无线通信技术）。


    #### 1. DSRC 技术


    DSRC 系统由车载单元、路侧单元以及短程通信协议构成，基于 IEEE802.11p 通信标准，是一种高效的短距离，可应用于 V2X 的无线通信技术，有效覆盖区域为
    3～30m，主要实现车辆和道路的有机连接识别和负责在车路以及车辆之间建立信息的双向传输，实时传递语音、图像等数字信息。DSRC 具有传输速度快、受干扰程度小、安全性好等优点，实现了小区域内车辆识别、驾驶员识别、出入管理、ETC（Electronic
    Toll Collection，电子不停车收费）等，极大提升了人们的出行效率，其主要缺点在于通信覆盖距离短，需要针对基础设施进行大规模改造和投入，成本较大。


    ##### 1）演进发展


    在智能交通的发展中，DSRC 技术是 ITS（Intelligent Transportation System，智能交通系统）的基础之一。随着智能交通的发展而不断发展，相关技术在
    20 世纪 90 年代开始取得了突破性进展。1992 年，美国材料试验学会（American Society for Testing Materials，ASTM）主要针对
    ETC 业务的开发最先提出 DSRC 技术的概念，该通信技术采用 915MHz 频段开展标准化工作\[18\]。


    1995 年，欧洲标准化委员会（CEN，ComitéEuropéen de Normalization）完成了欧洲 DSRC 标准的制定。1997 年，日本
    TC204 委员会制定了日本的 DSRC 标准。2003 年，美国材料试验学会通过了将 ASTM E2213-03 作为 DSRC 标准的提案。同年，IEEE
    协会成立 WAVE 研究工作组正式接手 ASTM 的工作，发展 WAVE 体系作为 DSRC 标准。2003 年 12 月，在马德里召开的第十届 ITS 世界大会上，USDOT
    宣布在 5.9GHz 分配 75MHz 频谱进行 DSRC 研究，同时提出 VII 项目，目标是使 V2V 和 V2I 技术在小范围内应用测试。


    2006 年 12 月，USDOT 与五大汽车厂商联合测试 V2V 和 V2I 在防碰撞系统中的作用，并确立新型以通信为基础的安全设施，主要包含路边网络（Roadside
    Network）和车载设备（On-board Vehicle Equipment）。只有当道路上有足够多的车辆支持 V2V 通信，V2V 的作用才能得到充分体现。2010
    年，WAVE 工作组正式发布了 IEEE802.11p 车联网通信标准。该标准作为车载电子无线通信规范应用于 ITS，成了 DSRC 标准下的底层协议。在
    2014 年 8 月，NHTSA（National Highway Traffic Safety Administration，美国高速公路安全管理局）和
    USDOT（United States Department of Transportation，美国交通运输部）提出 FMVSS No.150 法案，该法案强制要求新生产的轻型汽车（载客和轻卡）支持
    V2V 通信功能。2015 年 6 月 25 日，美国众议院就此事举行听证会，NHTSA 以及其他利益相关方再次就 V2X 案件进行辩护。


    DSRC 顶层协议栈是基于 IEEE1609 标准开发的，V2V 信息交互是使用轻量 WSMP〔WAVE Short Message Protocol，波短消息（协议）〕而不是
    WIFI 使用的 TCP/IP 协议，TCP/IP 协议用于 V2I 和 V2N 的信息交互。DSRC 的底层、物理层和无线链路控制基于 IEEE802.11p。使用
    IEEE802.11 系列标准的初心是利用 WIFI 的生态系统，但是 WIFI 最初设计用于固定通信设备，后来制定的 IEEE802.11p 用于支持移动通信设备。


    DSRC 标准已经获得通用、丰田、雷诺、恩智浦、AutoTalks 和 Kapsch TrafficCom 等的支持。通用已经有量产车凯迪拉克 CTS，其搭载了
    DSRC（Aptiv 提供系统，AutoTalks 提供模块，恩智浦提供芯片）。丰田则在 2016 年就开始销售具备 DSRC 技术的皇冠和普锐斯（电装提供系统，瑞萨提供芯片）。

