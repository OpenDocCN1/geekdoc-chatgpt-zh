    ### 表1.3 网联化融合技术等级

    ![](images/txt001_7.jpg "pagenumber_ebook=20,pagenumber_book=10")


    鉴于各国尚未形成成熟的智能化网联化融合发展路线，依据网联信息对汽车驾驶自动化等级的支撑作用，判定融合发展将经历3个发展阶段，即信息提醒和精确预警阶段、车路云一体化的辅助驾驶（Advanced
    Driving Assistance System，C-ADAS）阶段、车路云一体化的自动驾驶（Autonomous Driving，CAD）阶段。


    在信息提醒和精确预警阶段，网联信息或其与单车智能的感知、多传感器数据融合处理后的感知信息，以提醒、预警方式在人机交互界面显示，随着车道级定位和高精地图的应用和普及，预警内容逐步丰富。


    在车路云一体化的辅助驾驶（C-ADAS）阶段，符合相应信息安全、功能安全要求的网联信息进入智驾域，开始支撑车辆辅助驾驶。


    在车路云一体化的自动驾驶（CAD）阶段，符合相应信息安全、功能安全要求的网联信息开始支撑车辆自动驾驶。在道路基础设施建设和车载通信设施搭载均达到相当高的程度时，车路云一体化的自动驾驶逐步实现普及。


    为避免网联化融合技术的4个等级与融合发展的3个发展阶段的定义混淆，表1.4形成4×3的矩阵，梳理了各等级与各阶段的关系。表1.4分为横向、纵向两个视角：横向视角中，同一融合技术等级的消息内容的指标相同，但由于3个发展阶段对于该消息内容的指标不同，最终的应用场景由左至右增强或新增；纵向视角中，由于各融合技术等级中消息内容的指标的不同，最终的应用场景由上至下增强或新增。


    状态共享等级包含未进入智驾域的网联状态信息，只能应用于信息提醒和精确预警阶段。


    融合感知等级中的消息内容可分别应用在信息提醒和精确预警、C-ADAS、CAD3个阶段。由于自动驾驶系统在这3个阶段的功能安全、预期功能安全、信息安全的要求不同，因此其拆解至车载通信设备、路侧设备、云平台必须满足的安全要求也不同。


    融合决策等级中的消息内容可分别应用在C-ADAS、CAD两个阶段。因为网联导入的决策信息已经超越车内提醒预警的范畴，因此不包括信息提醒和精确预警阶段。


    网联融合控制等级中的消息内容只应用在CAD阶段。因为无法保证人类驾驶员参与协同，因此不包括C-ADAS阶段。


