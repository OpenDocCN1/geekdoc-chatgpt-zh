    ②通过对交通场景中目标的识别，了解感知单元的性能。


    ### 2.5.2 实验原理


    通过路侧毫米波雷达和网联摄像机进行感知，可以有效提高识别准确度和精度，同时配合 RSU，将感知数据（如交通参与者、道路物体等）全部通过路侧安全消息（Road
    Safety Message，RSM）、路侧消息（Road Side Information，RSI）广播到 V2X 网络中，向车辆广播，为机动车提供路口通行信息和交通安全信息提示。


    针对视觉传感器采集的视频或图像数据，本实验基于`YOLOv5`进行识别分类，感知结果主要包括目标框、目标类别以及置信度 3 部分，如图 2.26 所示。


