    \n3）步骤三\n\n完成所有实验后可以单击界面右上角的“×”或“返回”回到主界面，或进行多次实验以加深理解。\n\n思考题\n\n1.智能网联驾驶无线通信技术有哪些？为什么我国采用C-V2X技术作为智能网联驾驶无线通信技术？\n\
    \n2.比较DSRC和LTE-V2X在技术和应用层面的区别。\n\n3.LTE-V2X和5G-V2X的区别和联系有哪些？两者各自包含哪些关键技术？\n\n\
    4.比较车载通信设备和路侧通信设备的共同之处和不同之处，试着阐述其不同的原因是什么。\n\n\uFEFF\n\n第4章　智能网联驾驶交互消息\n\n![](images/txt004_1.jpg\
    \ \"pagenumber_ebook=87,pagenumber_book=77\")\n\n智能网联驾驶交互消息\n\n2017年9月，《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》（T/CSAE53-2017）\\\
    [32\\]被发布，首次对于智能网联应用做出了标准定义，包含17个典型应用场景、支撑这些场景的应用层交互数据集，以及API（Application Programming\
    \ Interface，应用程序编程接口）、SPI（Serial Peripheral Interface，串行外设接口）。该标准的发布在一定程度上打破了底层技术与通信频段的困局限制了车企们对于V2X上层应用的探索这一现状，让我国的V2X智慧道路和车辆真正拥有了统一而自主的“语言和文字”。\n\
    \n为了增强应用落地的可实现性，《基于LTE的车联网无线通信技术消息层技术要求》\\[33\\]应运而生，该标准中规定了包括消息层数据集的架构以及具体的数据定义和编码方式在内的消息层技术要求，降低了应用落地的准入门槛。\n\
    \n随着标准应用的深入和自动驾驶技术的发展，行业开始关注如何通过信息协同持续提升车辆的在途安全系数和效率以及为高等级的自动驾驶服务，在此基础上《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第二阶段）》（T/CSAE157-2020）\\\
    [34\\]和《基于车路协同的高等级自动驾驶数据交互内容》（T/CSAE158-2020）\\[35\\]两标准的发布对此给予了回应。T/CSAE157-2020定义了第二阶段的应用场景，并对应用层交互数据集进行了兼容性的扩展与补充，T/CSAE158-2020则规定了基于车路协同的L4、L5级别下的典型应用和数据交互内容。\n\
    \n至此行业里形成了较为完善的网联消息标准体系，且在实际落地应用中行业各家也都在持续地对网联消息的相关标准进行了完善与补充。\n\n4.1　智能网联应用场景\n\
    \n本节根据《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》和《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第二阶段）》对智能网联应用场景分两个阶段进行介绍。\n\
    \n4.1.1　第一阶段应用场景\n\n“鉴于我国有独特的交通环境和产业需求，我们需要制定自己的应用层标准”，2016年年初正是基于这样的业界呼声在中国汽车工程学会的指导下，星云互联、长安汽车、通用汽车和清华大学共同牵头，成立了标准编制组，其涉及汽车、交通和通信三大行业，凝聚了来自车企、高校以及通信、智能交通、测试检验、终端制造等多个领域机构的智慧，该标准编制组于2017年9月发布《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》且于2020年发布其修订版（T/CSAE53-2020）。\n\
    \n在《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第一阶段）》中，该标准编制组依据技术的成熟度、应用价值以及可实现性准则选取并定义了17个V2X典型应用场景（这些场景分属于安全、效率、信息服务三大类），并对支撑这些场景的应用层交互数据集做了说明，如表4.1所示，这些场景及消息集的定义为V2X应用场景实现和落地提供了指导。\n\
    \n表4.1　合作式智能运输系统第一阶段应用汇总表\n\n![](images/txt004_2.jpg \"pagenumber_ebook=88,pagenumber_book=78\"\
    )\n\n4.1.2　第二阶段应用场景\n\n为推进车联网（V2X）技术在提升汽车安全性、经济性及交通系统效率等方面的深度应用，进一步针对车用通信技术的演进和车路协同应用的新需求，上述标准编制组发布了《合作式智能运输系统车用通信系统应用层及应用数据交互标准（第二阶段）》。\n\
    \n该标准定义了第二阶段的应用场景12个，包括场景描述、流程定义、交互需求分析等；在第一阶段消息集的基础上，进行新消息的补充和兼容性扩展，实现对两个阶段应用的支持，如表4.2所示。\n\
    \n第二阶段的主要应用场景更偏向车路协同，其智能化水平较第一阶段更高，通过对车路协同场景的深度挖掘梳理，预计能满足未来较长时间对于智能网联车路协同场景应用的要求。\n\
    \n表4.2　合作式智能运输系统第二阶段应用汇总表\n\n![](images/txt004_3.jpg \"pagenumber_ebook=89,pagenumber_book=79\"\
    )\n\n4.1.3　基于车路协同的高等级自动驾驶应用\n\n《基于车路协同的高等级自动驾驶数据交互内容》标准诞生的契机正是车路协同技术（V2X）和自动驾驶技术的逐渐成熟和加速融合，行业意图依靠路侧的感知、处理能力和车路通信技术，实现车路协同的L4、L5级别的自动驾驶，增强自动驾驶车辆的感知、决策和控制能力，提升自动驾驶车辆的通行效率、安全性、环境适应性。\n\
    \n如表4.3所示，在标准场景方面，该标准定义了8个标准场景，规定了基于车路协同的L4、L5级别的高等级自动驾驶数据交互内容，重点涉及消息层数据集，具体是在YD/T\
    \ 3709-2020、T/CSAE53-2020标准规范所定义消息层数据集的基础上，对原有消息内容进行扩展或新增消息。\n\n表4.3　基于车路协同的高等级自动驾驶应用\n\
    \n![](images/txt004_4.jpg \"pagenumber_ebook=90,pagenumber_book=80\")\n\n在实际应用中，第一阶段的场景目前基本被实现，落地应用也较多，并被多次实地交付验证过，因此在后续的讨论中以第一阶段应用为主要讨论对象。\n\
    \n4.2　智能网联基础消息的定义与格式\n\n实现智能网联驾驶不同阶段的应用，其根本需要通过对智能网联基础消息进行定义和解析，从而满足应用中V2X交互需求。\n\
    \n4.2.1　消息层数据集的构成\n\n消息层数据集用ASN.1（Abstract Syntax Notation One，抽象语法标记）标准进行定义，遵循“消息帧-消息体-数据帧-数据元素”层层嵌套的逻辑进行制定。数据集交互的编解码方式遵循非对齐压缩编码规则（Unaligned\
    \ Packet Encoding Rules，UPER）。消息帧是单个应用层消息的统一打包格式，是数据编解码的唯一操作对象。消息帧由不同类别的消息体组成，并支持扩展；消息体为最基本的5种消息；数据帧由其他数据单元或数据类型组合而成，具有特定的实际意义，是消息体的组成部分；数据元素是消息体或数据单元的组成部分，它由基本数据类型定义产生，具有实际物理意义。\n\
    \n消息层数据集的构成如图4.1所示，主要由1个消息帧，5个最基本的消息体以及相应的数据帧和数据元素组成。\n\n![](images/txt004_5.jpg\
    \ \"pagenumber_ebook=90,pagenumber_book=80\")\n\n图4.1　消息层数据集的构成\n\n4.2.2　消息体种类\n\
    \n1.基本安全消息\n\n1）定义\n\n基本安全消息（Basic Safety Message，BSM）是使用最广泛的一个应用层消息，用来在车辆之间交换安全状态数据。车辆通过该消息的广播，将自身的实时状态告知周围车辆，以此支持一系列协同安全等应用，BSM的使用场景如图4.2所示。\n\
    \n![](images/txt004_6.jpg \"pagenumber_ebook=91,pagenumber_book=81\")\n\n图4.2　BSM的使用场景\n\
    \n2）消息主体结构及说明\n\nBSM作为在智能网联驾驶中各个网联汽车发送和广播的消息，需要包含对于不同车辆发送的不同消息的识别标志。因此BSM中包含的第一部分信息为消息编号、车辆编号和发送时间，以此来分类和识别消息。\n\
    \nBSM作为车辆基本安全消息，需要包含车辆的自身信息，车辆出厂时就具备车辆尺寸大小和车辆类型信息。其中车辆类型可从两方面来定义：一方面从车辆的基本类型进行定义，如小汽车、卡车等；另一方面从车辆的燃料动力类型进行定义。当车辆行驶时，车辆的实时状态也是BSM的组成部分，运动的实时状态可用3D位置、速度、航向来概括，从运动状态再延伸到车辆控制方面，进而涵盖了车辆挡位、方向盘转角、四轴加速度、刹车系统状态等信息。\n\
    \n其中，3D位置为车辆的经度、纬度和高程；挡位包括空挡、停止挡、前进挡和倒挡；四轴加速度为纵向加速度、横向加速度、垂直加速度、横摆角速度；刹车系统状态包括刹车踏板踩下情况、车辆车轮制动情况、牵引力控制系统作用情况、制动防抱死系统作用情况、车身稳定控制系统作用情况、刹车助力系统作用情况和辅助制动系统（一般指手刹）情况共7种状态。这些都会与车辆行驶的速度、航向角有着直接联系，因此在车辆基本安全消息中，包含这部分信息是很有必要的。\n\
    \n除包含上述必要的车辆自身基本信息外，一些其他信息的存在也有助于提高智能网联汽车的智能性，预测评估驾驶行为的风险，有效地提高行驶的安全，包括消息发送时间精度、实时位置精度、定位系统精度和由车速精度、航向精度、方向盘转角精度组成的运行状态精度等信息。这部分精度信息意味着智慧交通中根据消息内容和预先设定好的算法得出的交通参与者的实时信息的准确性，对于统筹规划和管理交通路线具有重要意义。\n\
    \n此外，BSM还包括车辆安全辅助信息集合和紧急车辆辅助信息集合。车辆安全辅助信息集合由车辆特殊事件状态、车辆历史轨迹、路线预测、车身灯光状态等组成。紧急车辆辅助信息集合向周围车辆告知本车在进行特殊作业的状态，如交通中的警车、消防车、救护车等需要周围车辆予以优先或避让。包括车辆特殊行驶状态、警笛和指示灯的使用等。\n\
    \n图4.3给出了BSM的主体结构，其中实线框为必有项，虚线框为可选项。\n\n![](images/txt004_7.jpg \"pagenumber_ebook=92,pagenumber_book=82\"\
    )\n\n图4.3　BSM的主体结构\n\n3）BSM应用\n\n在实际应用中，BSM更多是一个“广播员”的角色，通过不断地将自车状态广播给周边车辆，来达到交换安全状态数据的目的，并支持各类应用的实现。\n\
    \n例如，在前向碰撞预警、交叉路口碰撞预警、紧急制动预警等场景应用中，两车通过各自收发并解析BSM中的基本信息，如时间、位置、速度、航向角、车身大小等，即可完成碰撞预警的计算，在此基础上增加转向灯的判断即可实现盲区/变道预警的场景判断。\n\
    \n在BSM中除了基本信息外还包含车辆安全辅助信息及紧急车辆附加信息，涉及车辆特殊状态位、灯光信息及紧急车辆状态等内容，通过对上述信息的灵活应用可实现异常车辆预警，车辆失控预警、紧急车辆提醒等功能。\n\
    \n此外BSM还支持兼容性拓展，如T/CSAE158-2020就在TD/T3709-2020标准定义的BSM基础上，丰富了自动驾驶车辆的特有信息，这样能够提供更精准的车辆及行驶信息，支持路侧协同的车道级别通行等场景的实现。\n\
    \n4）BSM的ASN.1代码\n\n为方便实现，本书给出了BSM的ASN.1代码。具体的实现过程中，可通过将ASN.1代码转换为其他的编程语言，形成BSM结构体或对象供智能网联驾驶应用进行调用。\n\
    \n![](images/txt004_8.jpg \"pagenumber_ebook=93,pagenumber_book=83\")\n\n![](images/txt004_9.jpg\
    \ \"pagenumber_ebook=94,pagenumber_book=84\")\n\n2.地图消息\n\n1）定义\n\n地图消息（MAP）由路侧单元广播，向车辆传递局部区域的地图信息，包括局部区域的路口信息、路段信息、车道信息，道路之间的连接关系等。单个地图消息可以包含多个路口或区域的地图数据。MAP的使用场景如图4.4所示。\n\
    \n![](images/txt004_10.jpg \"pagenumber_ebook=94,pagenumber_book=84\")\n\n图4.4　MAP的使用场景\n\
    \n2）消息主体结构及说明\n\n同BSM一样，为了辨别广播中不同的消息，MAP也需要具备消息编号、发送时间。消息编号配合时间戳可以防止重放攻击，时间戳一般通过读取GPS中的时间戳，然后加入MAP中进行发送。另外，地图中包含的多个路段、车道、路口等，究其本源，均由一个个节点组成。因此，MAP的另一个组成字段为地图节点列表，节点是地图的最基本组成部分，可以是交叉路口，也可以是一个路段的起点或终点。\n\
    \n为了区分不同节点，引入节点ID和节点名的字段。节点的位置信息是确认地图构成的必要信息，为了减少位置数据的大小，采用以地图中心节点为参考，其他节点的位置信息则使用中心节点位置坐标加上各自的偏移量。在地图上，顺序的两个节点可确定一条有向路段。路段的起点记为上游节点，终点记为下游节点，在定义地图路段时选择以下游节点为参考定义下游节点的上游路段列表，作为下游节点的字段信息。\n\
    \n通常，某一路段中包含的信息包括路段名和车道信息。将其应用到消息格式中时，上游路段首先要包含上游节点ID以及路段名，确认路段的起始处和名字。路段中常常包含多条车道，应对车道列表中不同车道的宽度、限速信息、车道允许转向行为、车道属性、上游车道与下游车道的连接关系等信息进行定义。\n\
    \n图4.5给出了MAP的主体结构，它是一个层层嵌套的形式，其中实线框为必有项，虚线框为可选项。\n\n![](images/txt004_11.jpg \"\
    pagenumber_ebook=95,pagenumber_book=85\")\n\n图4.5　MAP的主体结构\n\n3）MAP应用\n\nMAP用来描述道路信息，在智能网联应用中更多是个“服务者”的角色，给应用落地和预警触发提供明确的位置信息。例如，路侧设施可以将MAP下发给周边车辆，提升周边车辆对行车环境的感知，提升车辆的定位精度，并便于车辆规划合适的行车路线。MAP已成了应用落地不可或缺的重要支撑。\n\
    \n此外MAP可与SPAT消息结合使用，为车辆提供实时的前方信号灯相位消息。在闯红灯预警场景中，当前方有大车遮挡视线或恶劣天气导致视线受到影响，使远车无法对当前红灯或即刻到来的红灯做出正确判断时，闯红灯预警应用会检测该车当前所处位置和速度等，通过计算预测车头经过路口停止线时信号灯的状态，并向驾驶员进行预警。这就使用到了MAP中路口始末点的位置信息和SPAT中路口信号灯相位状态的信息。\n\
