    ## 1.3 智能网联驾驶的发展趋势

    当前，新一轮科技革命和产业变革蓬勃兴起，车联网、自动驾驶技术融合将带来汽车生态链的全局变革，智能化、互联化已经成为未来汽车技术的发展趋势；作为解决未来汽车社会面临的交通安全、道路拥堵、能源消耗、环境污染等问题的重要手段，智能网联驾驶作为汽车产业发展的战略方向已经成为全球共识，也是世界汽车强国争夺的战略高地。本节将从国外和国内智能网联驾驶的发展趋势两个角度进行梳理。


    ### 1.3.1 国外智能网联驾驶的发展趋势

    各国结合本地技术优势和产业基础，通过制定新的政策法规、探索发展路径、鼓励技术创新、开展测试示范、完善基础设施建设等方式，加强智能网联汽车创新发展。


    美国强调技术中立，鼓励技术创新，在平衡创新与安全的基础上，总体呈现为监管持续弱化的特征，截至 2022 年相继发布了《自动驾驶汽车》系列政策、《智能交通系统战略规划
    2020～2025》《自动驾驶汽车综合计划》《自动驾驶乘员保护安全最终规则》等政策法规，对自动驾驶范围进行了延伸，确定了自动驾驶汽车研发和整合的联邦原则，描述了美国未来
    5 年智能交通发展的重点任务和保障措施，提出了建设 3 类自动驾驶应用公共平台的任务，支持 CARMA 等平台的建设，明确了实现自动驾驶系统（Autonomous
    Driving Solution，ADS）愿景的 3 个目标，明确了低速无人货车、低级别自动驾驶乘用车、高级别自动驾驶乘用车、高速公路自动驾驶货车、低速接驳车五大优先发展领域，完善了自动驾驶汽车制造商对全自动汽车碰撞测试的标准等。


    同时，美国加强车路协同建设，密歇根州修建了首条专供网联汽车和自动驾驶汽车使用的 40 英里（1 英里＝1.60 千米）长的道路，美国计划将该道路用于支撑研究物理基础设施、数字基础设施、协同基础设施以及运营基础设施的建设和运营。


    欧盟立足商业布局，率先开展自动驾驶保险、责任规则及伦理道德研究，相继发布了《通往自动化出行之路：欧盟未来出行战略》《网联式自动驾驶技术路线图》《自动驾驶汽车的豁免程序指南》《关于在网联车辆和出行相关应用程序中处理个人数据的指南》《可持续与智能交通战略》等政策法规，提出了协调国家对自动驾驶车辆的临时安全评估，并聚焦于网联车辆和出行相关应用场景下的个人数据处理问题，为保护用户隐私和数据安全风险提供了参考建议，开展了自动驾驶路线图的顶层规划，提出了网联式自动驾驶与支撑自动驾驶能力的基础设施级别分级（Infrastructure
    Support levels for Automated Driving，ISAD），计划到 2030 年大规模部署自动驾驶出行服务并普及完全自动驾驶等。


    德国的 Ko-HAF 项目、欧盟的 C-ITS 项目、大陆集团的 e-Horizon 项目都聚焦在智能驾驶和 V2X 领域，推动了智能网联驾驶行业的发展。同时，欧洲各国加快法律法规制的修订，支撑高级别智能网联汽车的商业化应用。德国制定《自动驾驶法》，支持特定场景
    L4 级别的自动驾驶应用。英国、法国、德国等纷纷修订法律法规，支持自动车道保持功能（Automated Lane Keeping Systems，ALKS）的商业化应用，其中德国已经为奔驰颁发
    L3 级别的智能网联汽车型式认证。


    日本通过将智能交通、智慧城市深度融合来发展自动驾驶，在全国范围内部署大量的实路操作测试（Field Operational Test，FOT），有效推动自动驾驶的测试验证与示范推广。2018
    年至 2022 年，日本相继发布了《自动驾驶汽车安全技术指南》《道路交通法（修正案）》，并持续更新发布了《官民 ITS 构想·路线图》《实现自动驾驶行动方针》等政策法规，列举了一系列自动驾驶汽车所应满足的安全条件，制定了
    L3 级别的自动驾驶的相关章程，研讨并制定了自动驾驶路线图以推动相关国际标准协调工作，探讨了 L4 级别的自动驾驶的基础设施协同机制与商业模式等。


    SIP-adus 以构建世界最安全的交通体系并服务社会为目的，已经进入 2.0 阶段，计划到 2025 年，私家车、卡车运输实现高速公路 L4 级别的自动驾驶，在全国范围实现无人驾驶出行。此外，日本已经于
    2020 年 11 月为本田 Legend 车型颁发全球首个 L3 级别的自动驾驶系统安全认证，该车型也已经面向共享出行市场公开发售。


    韩国发布《韩国自动驾驶战略规划》，计划 2027 年将韩国打造成全球第一个自动驾驶国家。2021 年韩国制定 L3 级别的自动驾驶安全标准，计划 2021
    年推出 L3 级别的自动驾驶汽车，2024 年将 L4 级别部分商用化、2027 年将 L4 级别全面商用化。为支撑 2027 年目标实现，2021 年 1
    月，韩国的产业通商资源部、科学技术信息通信部、国土交通部、警察厅 4 个部门联合宣布启动“自动驾驶技术开发创新项目”，将在 2027 年前向自动驾驶技术开发和相关基础设施建设项目投资
    1.1 万亿韩元（合 9.99 亿美元）。


    美欧日等的发展路径和经验表明，智能网联汽车是跨技术协同、跨产业融合的新生态，是复杂的系统型工程，需要加强政产学研协同，密切跨部门协同联动，结合本地产业的基础与优势，探索特色发展路径，从而支持智能网联汽车技术的研发和商业化应用。


    ### 1.3.2 国内智能网联驾驶的发展趋势

    在各方共同努力下，我国智能网联发展成效显著，已初步构建开放融合、创新引领、具有较强国际竞争力的产业生态，在关键技术、标准测试、基础设施、应用服务和安全保障方面取得了系统性进展。


    一方面，我国确立了依托 C-V2X 发展车路云一体化融合的智能网联汽车中国方案，传统车企与互联网科技企业跨界合作，C-V2X 快速发展，产业体系全球领先；另一方面，我国在环境感知、决策规划、云平台以及车载计算芯片等关键技术领域取得突破，在国内技术专利数量方面处于国际领先地位，我国产品的自主化比例提升。另外，通过深度参与
    3GPP 国际标准组织的标准制定，我国持续提升我国车联网标准在国际领域的话语权，推动 C-V2X 网络层协议纳入 3GPP 国际规范，同时在 ITU-T（International
    Telecommunication Union-Telecommunication Sector，国际电信联盟电信标准部）、ISO（International
    Organization for Standardization，国际标准化组织）、ETSI（European Telecommunications Standards
    Institute，欧洲电信标准化协会）等组织中贡献相关标准，中国方案逐步影响着国际标准的制定。


    我国从国家战略层面到地方政策方面，全面探索智能网联汽车产业发展，鼓励和推进示范建设。智能网联汽车中国方案的核心是车路云一体化，全国各地逐步开展以云控平台为主要形式的车路云一体化实践。通过实施中国方案凝聚行业共识，为指导、推动以车路云一体化为核心的智能网联汽车产业发展，我国各部委及相关行业组织先后发布了一系列相关政策文件。表
    1.5 汇总了我国近三年发布的部分推进智能网联汽车产业发展的相关文件\[9\]。


