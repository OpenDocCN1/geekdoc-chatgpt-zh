    \n在实际应用中SPAT多配合MAP使用，为车辆提供实时的信号灯相位消息及行车诱导。在另一阶段中主要的应用场景为闯红灯预警和绿波车速引导，即当车辆在行驶到路口之前提前为用户下发相关灯态，并根据车辆的行驶情况给用户播报对应的预警信息，让用户能够不停车通过路口或避免发生闯红灯事件。\n\
