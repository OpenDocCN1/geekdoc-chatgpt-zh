    \n3.5.3　实验内容\n\n1）步骤一\n\n如图3.13所示，在主菜单下单击“车路协同通信实验”进入本次实验，可以看到C-V2X车路协同通信实验的相关原理介绍，如图3.14所示，包括直连通信原理、C-V2X通信网络结构以及通信性能评价，充分了解相关原理后，可以通过单击右上角的“通信测试”进入实验选择界面。\n\
