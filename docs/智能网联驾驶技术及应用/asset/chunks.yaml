    # 第 6 章 智能网联驾驶信号灯路口场景应用


    ![](img/txt006_1.jpg "pagenumber_ebook=136,pagenumber_book=126")


    智能网联驾驶信号灯路口场景应用


    ## 6.1 信号灯路口场景介绍


    设置信号灯，是为了使得道路交通能够被有效管制，以便疏导交通流量，提升道路的通行能力，减少交通事故的发生。但由于城镇化和道路建设的飞速发展，城市内部的交叉路口越来越多，也越来越复杂，随之增设的信号灯大规模应用也显现出来一定的局限性。例如，车辆在通过有信号灯的路口时，驾驶员可能会因为前车遮挡或主观的判断失误出现闯红灯或开车车速不稳的情况，这不仅可能会带来额外的油耗，还可能导致无法顺利通过路口而造成拥堵或事故。


    在实际驾车中经常存在“一路红灯”的情况，导致驾驶员需要频繁地在路口启停，不仅影响了驾乘人员的出行效率，而且增加了对环境的污染。部分灯态下并没有明确的驾驶指令，导致大家凭借主观经验判断，如当驾驶员接近道路交叉口且绿灯剩余时间不多或者信号灯为黄灯时，驾驶员到底是“走”还是“停”没有固定统一的标准，驾驶员只能根据自己经验来选择“走”或者“停”。例如，当遇到黄灯时，若车辆距离道路交叉口比较远，大部分驾驶员会选择停车；若车辆距离道路交叉口比较近，大部分驾驶员则会选择通过。驾驶员的驾驶经验、判断能力有限，当驾驶员遇到黄灯且黄灯的剩余时间已不能满足驾驶员通过道路交叉口时，一些驾驶员由于判断失误而选择通过，导致闯红灯事件的发生，继而引发交通事故。


    因此在具备信号灯的路口下，如何有效地提升通行效率，减少停车等待时间和闯红灯事件的发生是城市交通参与者关注的焦点。


    绿波车速引导技术能够提示驾驶员当前路段合适的行驶速度，从而顺利通过红绿灯，大大减少了汽车停车的次数。在特定路段驾驶员按照引导车速驾驶可以畅通无阻地通过各个交叉口，信号灯对于到达此交叉口的驾驶员能够一直呈现绿色，这增加了车辆通行的连续性，缓解了交通拥堵。


    闯红灯预警技术通过提前向司机下发当前路口的红绿灯灯态，让驾驶员能够排除视线受阻或极端天气对红绿灯观察的影响，超视距知晓路口情况，根据灯态提前采取减速、刹停的动作，当车辆存在不按信号灯规定行驶时，还能对驾驶员进行预警，避免在路口发生碰撞。


    ## 6.2 绿波车速引导技术


    ### 6.2.1 绿波车速引导的定义


    绿波车速引导（Green Light Optimal Speed Advisory，`GLOSA`）是指，当`OBU`的`HV`驶向信号灯路口，并收到由`RSU`发送的道路数据及信号灯实时状态数据时，`GLOSA`应用将提供给驾驶员一个建议车速区间，以使车辆能够经济地、舒适地（不需要停车等待）通过信号灯路口。本应用适用于城市及郊区普通道路的信号灯路口。


    `GLOSA`应用能辅助驾驶应用，提高车辆通过交叉路口的经济性和舒适性，提高交通系统效率。


    ### 6.2.2 绿波车速引导的主要场景


    `GLOSA`的主要场景如图 6.1 所示，具体描述如下。


    ①`HV`从远处接近信号灯控制路口。

    ②路侧通信设备发出局部道路数据信息及从路口信号机处获得信号灯数据信息和实时状态信息。


    `GLOSA`应用根据上述信息，给出`HV`前方信号灯的实时状态，并结合`HV`的定位和行驶状态信息，计算出通过路口的引导车速区间。


    ![](img/txt006_2.jpg "pagenumber_ebook=137,pagenumber_book=127")


    图 6.1 绿波车速引导场景


    ### 6.2.3 绿波车速引导的基本工作原理与算法实现


    `GLOSA`的基本工作原理如下。


    ①`HV`根据收到的道路数据，以及本车的定位和运行数据，判定本车在路网中所处的位置和运行方向。

    ②判断车辆前方路口是否有信号灯，提取信号灯对应相位的实时状态；若有信号灯信息，则可直接将其显示给驾驶员。

    ③`GLOSA`应用根据本车的位置，以及信号灯对应相位的实时状态，计算本车能够在本次或下次绿灯期间不停车通过路口所需的最高行驶速度和最低行驶速度，并进行提示。


    本书实现`GLOSA`算法的具体思路如下。


    ①定义一个函数`doGLOSA()`，它接受 3 个参数：`hvInfo`、`spatInfo`和`mapInfo`。`hvInfo`表示主车信息，`spatInfo`表示信号灯信息，`mapInfo`表示地图消息。

    ②函数内部首先初始化 3 个变量：`warningFlag`、`adviser`和`max_spd`。`warningFlag`表示预警等级，其中 0 表示无须预警，1
    表示一般预警，2 表示紧急预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`slow_down`表示减速行驶，`speed_up`表示加速行驶，`avoid_redlight`表示小心红灯。`max_spd`表示主车需要的最大速度。

    ③从`hvInfo`中提取主车的 x 坐标和 y 坐标、速度、航向角、尺寸和车辆类型，并将其赋值给相应的变量。

    ④从`mapInfo`中提取车道限速，从`spatInfo`中提取红绿灯信息，包括当前状态、剩余时间，以及红灯、绿灯、黄灯的持续时间，并将其赋值给相应的变量。

    ⑤判断主车是否静止（速度小于 0.1），如果是，则直接返回`warningFlag`和`adviser`，即无须预警。

    ⑥调用自定义函数`my_calc_distance()`，分别计算主车和信号灯路口之间的纵向、横向和直线距离。

    ⑦计算主车以当前速度运动到路口的时间`time_2_end`和主车以当前速度在绿灯和黄灯持续时间内能够前进的距离`pass_time_dist`。

    ⑧若主车未通过路口，且与路口的距离不超过`pass_time_dist`，主车不是静止的，则将`warningFlag`设为 1，并进行下一步判断。

    ⑨若当前为绿灯或黄灯，判断主车能否以当前速度通过路口，若可以，则将`adviser`设为`keep`；否则，计算主车能够通过路口所需的速度`expectSpeed`，不超过道路限速则将`adviser`设为`speed_up`，将`max_spd`（当前主车速度）设为`expectSpeed`，若超过道路限速，则将`adviser`设为`slow_down`。进一步判断主车与信号灯路口距离是否小于
    10m，若满足则将`warningFlag`设为 2，将`adviser`设为`avoid_redlight`。

    ⑩若当前为红灯，且在红灯剩余时间内，主车以当前速度不能到达信号灯路口，则将`adviser`设为`keep`；否则，将`adviser`设为`slow_down`。此时`max_spd`即当前主车速度。进一步判断主车与信号灯路口距离是否小于
    10m，若满足则将`warningFlag`设为 2，将`adviser`设为`avoid_redlight`。

    ⑪最终返回`warningFlag`、`adviser`和`max_spd`作为函数输出。


