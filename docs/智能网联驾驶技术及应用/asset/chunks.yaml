    # 第 5 章 智能网联驾驶碰撞预警应用


    ![](img/txt005_1.jpg "pagenumber_ebook=110,pagenumber_book=100")


    智能网联驾驶碰撞预警应用


    碰撞类交通事故在所有交通事故类型中有较高的占比，且碰撞类交通事故由于撞击会对车体造成比较大的破坏，一般会导致比较严重的后果，对车辆及乘客造成的伤害较其他类型的交通事故更为严重，因此如何持续有效减少碰撞类交通事故的发生及减小碰撞危害是交通从业者面临的难题。


    从事故发生的原因来看，碰撞类交通事故不外乎是司机、车辆和环境三要素互相作用造成的，如驾驶员在行驶过程中由于接打电话、疲劳、环境影响造成注意力分散，或两车车距较近，前车急刹时来不及反应等容易导致追尾、剐蹭等事故的发生；在行车过程中车身、障碍物遮挡等极容易使驾驶员存在视野盲区，导致车辆在进行变道、途经复杂路口时由于观察不到视野盲区内的车辆、行人而造成碰撞事故的发生；恶劣或极端天气（如浓雾、暴雨）导致驾驶员的观察距离有限，刹车、制动效果受影响，也很容易造成碰撞事故的发生。


    因此针对各种潜在的碰撞风险，提前有效的预警是必要的，通过提醒驾驶员未曾注意到的风险，避免事故发生或降低伤害程度。


    对`V2X`技术而言，搭载了智能车载终端的车辆能够相互之间通信，互相知晓其驾驶状态和意图，能有效减少车车之间的碰撞，如追尾、盲区剐蹭、交叉路口相撞，并能够通过车载`HMI`终端对驾驶员进行预警。


    此外，对`V2X`技术的落地应用性而言，该技术还具有传统`ADAS`不可比拟的优势。`V2X`技术对于碰撞事件的预测主要基于高精度全球导航卫星系统（Global
    Navigation Satellite System，`GNSS`）的采样频率、精准度以及预测算法精度，对于数据交互的频率及时延并没有极高的要求，只要能和`GNSS`采样大抵匹配即可，这样即可以降低预警预测对于时间同步的要求，也能够减少对设备计算性能的消耗。


    ## 5.1 碰撞预警场景介绍


    ## 5.2 前向碰撞预警技术


    ### 5.2.1 前向碰撞预警的定义

    前向碰撞预警（Forward Collision Warning，`FCW`）是指主车（`HV`）在车道上行驶，与在正前方同一车道的远车（`RV`）存在追尾碰撞危险时，前向碰撞预警应用将对`HV`驾驶员进行预警。本应用适用于普通道路或高速公路等车辆追尾碰撞危险的预警。前向碰撞预警应用辅助驾驶员避免或减小前向碰撞危害，提高道路行驶的安全系数。


    ### 5.2.2 前向碰撞预警的主要场景

    根据功能定义描述可知，当`HV`（主车）与同车道`RV`（远车）之间的相对距离小于阈值时`FCW`功能触发。`FCW`包括如下 4 种主要场景。


    场景一：`HV`（主车）正常行驶，`RV`（远车）在位于`HV`同一车道的正前方停止，如图 5.1 所示。`HV`行驶过程中在即将与`RV`发生碰撞时，`FCW`应用对`HV`驾驶员发出预警，提醒驾驶员与位于正前方的车辆`RV`存在碰撞危险；预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV`发生追尾碰撞。在此过程中，`HV`和`RV`需具备短程无线通信（如`LTE-V2X`）能力。


    ![](img/txt005_2.jpg "pagenumber_ebook=111,pagenumber_book=101")


    图 5.1　`HV`行驶，`RV`在同一车道的正前方停止


    场景二：`HV`正常行驶，`RV`在位于`HV`相邻车道的前方停止，如图 5.2 所示。`HV`行驶过程中不会与`RV`发生碰撞，`HV`驾驶员不会收到`FCW`预警信息。在此过程中，`HV`和`RV`需具备短程无线通信能力。


    场景三：`HV`正常行驶，`RV`位于`HV`同一车道的正前方慢速或减速行驶，如图 5.3 所示。`HV`行驶过程中在即将与`RV`发生碰撞时，`FCW`应用对`HV`驾驶员发出预警，提醒驾驶员与位于正前方的车辆`RV`存在碰撞危险；预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV`发生追尾碰撞。在此过程中，`HV`和`RV`需具备短程无线通信能力。


    ![](img/txt005_3.jpg "pagenumber_ebook=112,pagenumber_book=102")


    图 5.2　`H V`行驶，`RV`在相邻车道的前方停止


