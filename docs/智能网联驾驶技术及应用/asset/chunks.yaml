    # 频谱调整与 DSRC 应用


    但在 2020 年 11 月，美国联邦通信委员会（Federal Communications Commission，`FCC`）正式决定 5.850～5.925GHz
    频段的划分：将低 45MHz（5.850～5.895GHz）分配给`Wi-Fi`免授权设备，将高 30MHz（5.895～5.925GHz）分配给`C-V2X`。这意味着曾经独享
    75MHz 频谱 20 年的`DSRC`被逐步放弃。


    ## DSRC 支持的业务


    `DSRC`作为一种无线通信方式，在`ETC`系统中，具有传输速度快（`1Mbit/s`）、受干扰程度小（专用通信频段`5.8GHz`）、安全性好（伪随机加密算法）等特点，可以灵活地将路边和车辆联系起来，实现路边和车辆信息的双向实时传输。


    基于这些特点，`DSRC`在`ITS`的许多子系统中得到应用，如公共运输系统（Advanced Public Transportation System，`APTS`）、商用车辆营运系统（Commercial
    Vehicle Operation Systems，`CVOS`）、交通信息系统（Advanced Traveler Information Systems，`ATIS`）和交通管理系统（Advanced
    Traffic Management Systems，`ATMS`）等。


    目前，`DSRC`系统已经被广泛地应用于`ITS`的各个方面，其作用如下。


    实现电子收费：利用微波或红外无线读写识别设备对通过`ETC`车道的车辆实行车辆自动识别和不停车自动收费，可减少停车时间，提高通信能力。


    提供道路交通信息：利用`DSRC`系统的双向交互功能，向交通信息中心提供各处的交通信息，中心对信息进行处理后，实时向驾驶员提供道路、交通及其他信息。


    具有车辆监管及防盗功能：对车辆的车主、车型以及牌照等相关信息进行登记记录，`DSRC`系统可以实现对车辆的实时管理。若在主要路口、收费站安装路边设备，则被盗车辆在通过这些路口时，就可以被`DSRC`系统发现。


    实现公共交通管理：采用`DI`（`Device Identifier`，产品标识）编码方式实现运营车辆定位，将车辆的位置数据传输到公交调度中心，实现运营车辆与指挥调度中心的实时通信，根据车辆运营状态的信息实现车辆的优化调度和管理；为乘客提供乘车线路、车票费、发车时间等信息，为驾驶员提供与公交有关的实时拥堵、可利用的停车空间等信息，提高公共交通的舒适性、安全性和通畅性，有效地管理公共交通并采集公交数据信息。


    支持安全行驶：路边设备可以探测出前方、后方及周围车辆，并将附近区域车辆的车速、方向等信息经管理中心处理后提供给驾驶员，防止交通事故的发生。


    实现特种车辆管理和紧急救援：通过对车辆属性的识别，实现对特种车辆（如警车、救护车、消防车等）的动态管理。当紧急情况发生后，可以依靠`DSRC`系统进行实时的交通信息和路况信息采集、处理，使紧急救援车辆以最快的速度在最短的时间到达事故发生地点。


    为城市规划、道路规划提供交通数据：在需要调查的路段安装路边单元后，`DSRC`系统就可以在不停车状况下对不同类型车辆进行实时定点通行记载和交通量统计工作。


    ## 2. C-V2X 技术


    `C-V2X`技术是指基于蜂窝网络的`V2X`技术，该技术在`DSRC`技术之后推出，也具备车辆之间进行直接无线通信的功能，包括`LTE-V2X`以及正在发展的`5G-V2X`技术，可提供蜂窝通信和直接通信两种工作模式，提供`Uu`（蜂窝网络-车载终端通信）接口和`PC5`（短距离直接通信）两种接口。


    `LTE-V2X`主要承载基本交通安全业务，`5G-V2X`主要承载自动驾驶相关业务。蜂窝通信借助于已有的`LTE`蜂窝网络，支持网络覆盖范围广、带宽需求大的通信连接；两个用户节点直接进行通信，这就是`D2D`（`Device
    to Device`）通信模式。`C-V2X`技术在通信覆盖范围、高容量、抗干扰性等方面的性能全面优于`DSRC`技术。


    ### 1）演进发展


    2015 年年初，`3GPP`正式启动基于`C-V2X`的技术需求和标准化研究，2015 年年初`3GPP`需求工作组开展`C-V2X`需求研究，于 2016
    年 3 月完成结项；2016 年年初`3GPP`架构工作组启动`C-V2X`架构研究，于 2016 年年底完成标准化。


    在国际标准方面，`C-V2X`技术标准的演进可以分为两个阶段——`LTE-V2X`和`5G-V2X`（`NR-V2X`），如图 3.1 所示。


    ![](img/txt003_2.jpg "pagenumber_ebook=61,pagenumber_book=51")


    图 3.1　`C-V2X`技术标准的演进


    `LTE-V2X`由`3GPP`的`Rel-14`和`Rel-15`技术规范定义。其中，`Rel-14`在蜂窝通信中引入了支持`V2X`短距离直通通信的`PC5`接口，支持面向基本道路安全业务的通信需求，主要实现辅助驾驶功能，已于
    2017 年 3 月完成，这标志着`3GPP`完成了`LTE-V`第一阶段的标准，即完成了基于终端直通（`D2D`）模式的车车通信（`V2V`）标准化，通过深入研究引入了更优化的物理层解调参考信号、资源调度、干扰协调等技术。`Rel-15`技术规范定义对`LTE-V2X`直通链路进行了增强，包括多载波操作、高阶调制（`64QAM`）、发送分集和时延缩减等新技术特性，已于
    2018 年 6 月完成。


    `5G-V2X`研究基于`5G`新空口的直通通信方式（`PC5`接口）和蜂窝通信方式（`Uu`接口）增强，主要用于支持车辆编队行驶、远程驾驶、传感器扩展等高级`V2X`业务需求。`3GPP`于
    2019 年 3 月完成了`Rel-16` `NR-V2X`的研究课题，于 2020 年 6 月完成了`Rel-16` `NR-V2X`标准化项目，后续将在`Rel-17`增强标准化工作中研究弱势道路参与者的应用场景。


    目前`5G` `eMBB` `Uu`已经实现了规模商用，`LTE-V2X`在全球产业界的共同努力下，也已经达到商用条件。虽然`NR-V2X`的关键技术还在实验过程中，但总体来说，`LTE-V2X`能满足当前的商业应用要求，即有人驾驶的辅助驾驶安全和中低速度的自动驾驶。针对高速的高级自动驾驶需要`NR-V2X`技术支撑，`NR-V2X`版本标准目前处于制定过程之中，基本标准版本于
    2020 年 6 月份完成，频率规划与分配等还没有达成共识。2022 年 6 月`Rel-17`版本宣布冻结，`Rel-17`带来一系列全新的直连通信增强特性，比如优化资源分配、节电和支持全新频段。


    ### 2）支持的业务


    `C-V2X`技术实现了车辆与车辆或者路侧基础设施之间的实时通信，也实现了超视距、低时延、高可靠的道路安全相关信息感知，从而实现了十字交叉路口碰撞预警、紧急刹车预警等车辆行驶安全应用。


    以十字交叉路口为例，美国、加拿大等的统计数据表明，高达近 50％的交通事故发生在交叉路口或与路口相关，其是道路安全中极具挑战性的场景。在十字交叉路口碰撞预警应用中，车辆广播基本安全消息，携带自身身份、定位、运行状态、轨迹等信息，交叉路口其他方向来车通过接收信息进行行驶决策。再如，山区高速公路弯道较多，特别是在上、下匝道区域，由于道路线型、山体遮挡的影响，车辆无法及时获取前方道路信息，一旦有突然停车、遗撒等异常情况发生，容易发生交通事故。


    路侧感知设备可以对弯道区域的交通参与者和路面情况进行探测与分析，并将异常情况通过`RSU`进行广播，对车辆进行盲区感知补充，有利于车辆驾驶者进行路径规划、避免交通事故。


    经过联网化改造的交通信号灯或电子标志标识等基础设施可将交通管理与指示信息通过`RSU`告知车辆，实现诱导通行、车速引导等出行效率提升应用。以诱导通行为例，交通灯信号机可通过`RSU`将灯色状态与配时等信息实时传递给周围的行驶车辆，为车辆驾驶决策是否通过路口以及对应的通行速度提供相应依据，并且可以在一定程度上避免闯红灯事故的发生。另外，车辆可以与交通基础设施互动，交通信号灯动态支持高优先路权车辆（救护、消防、公安等紧急车辆及满载的公交车辆等）的优先通行。


    随着自动驾驶智能化与网联化的协同发展，单独使用单车智能难以支撑自动驾驶，特别是在应对极端情况（`Corner Case`）和成本难题的时候。基于`C-V2X`提供的通信和连接能力实现了网联化，并协同单车的智能控制管理，支撑自动驾驶中所需要的信息实时共享与交互、协同感知和协同控制。前述用于辅助驾驶阶段的车车和车路协同基本功能在自动驾驶中仍然是必要的。对于自动驾驶阶段，基于`C-V2X`的车车和车路协同可产生的直接影响包括但不限于以下情景。


    （1）远程遥控驾驶


    借助于通信和远程监控，通过获取车辆的行驶状态和周边交通环境信息，实时发送指令控制远在几十米甚至几百千米之外的车辆，让车辆完成启动、加/减速、转向等真实驾驶操作，可避免极端事故的发生，以及实现自动驾驶发生事故发生后的远程接管和处理。


    （2）编队行驶


    区别于协同式自适应巡航控制，利用`C-V2X`通信的低时延、高可靠通信能力，编队车辆通过直通通信实现实时交互。编队成员车辆可以在最短时间内接收到头车/前车的驾驶策略与驾驶状态信息，进行同步加速、刹车等操作，从而保持预期的编队构型和编队的稳定性，可减少编队成员车辆的空气阻力，有效降低车辆燃油消耗。


    越来越多的智能网联汽车、智能化道路基础设施之间实现互联，将衍生出更多的应用服务类应用，如实时的交通诱导、实时的道路事故/工程提醒、实时的路段天气播报（如高速公路团雾等）、出行即服务（`Mobility
    as a Service`，`MaaS`）等，有助于推行商业模式创新和可持续的行业生态体系，以及通过车联网支撑汽车行业和交通行业的转型升级，提供低碳汽车产品及降低交通事故发生概率、提升交通效率等的应用，从而支撑我国“碳达峰”、“碳中和”战略目标的有效达成。


    ## 3.1.2 通信技术的指标和测试方法


    在智能网联驾驶无线通信技术中，最主要的指标包括通信距离、丢包率（`Loss Tolerance`或`Packet Loss Rate`）、通信时延、接收信号强度、信噪比、通信速率等。通信距离指两个节点之间不通过中继器能够实现的最远有效距离，是一个重要的性能指标，它影响着设备的可靠性和覆盖范围。步点测试是一种常用的评估`V2X`设备的通信距离的方法。步点测试是在实际的道路环境中进行的，主要包括以下步骤。


    ·环境准备：选择合适的测试场地，在不同的道路类型和条件下进行测试。确保测试环境没有干扰源或其他无线设备的干扰。


    ·设备设置：将待测试的`V2X`车辆终端（`OBU`）和路侧设备终端（`RSU`）安装在测试车辆和道路侧的合适位置。


    ·方案测试：制订测试方案，包括测试路线、速度、通信模式等参数。通常会进行不同距离的测试，如 10m、50m、100m 等，以覆盖不同的通信距离。


    ·数据采集：启动测试车辆，按照测试方案进行行驶。同时，记录通信距离、信号强度、通信成功率等关键数据。


    ·数据分析：根据采集的数据，进行数据分析和统计。评估通信距离的稳定性、通信质量和覆盖范围，并生成测试报告。


    在进行步点测试时，需要注意确保测试环境符合实际应用场景，考虑到道路类型、信号干扰、障碍物等因素对通信距离的影响；保持测试条件的一致性，如相同的天气条件、车辆速度、通信模式等，以便对结果进行准确比较和评估；使用合适的测试设备和工具，如信号强度计、数据采集设备等，确保数据的准确性和可靠性；进行多次测试，以获取更可靠的结果，并验证测试结果的一致性和稳定性。


    通过步点测试，可以评估`V2X`设备的通信距离性能，并为设备的部署和优化提供参考和依据。同时，测试结果也可以用于系统设计和改进，以提高车路协同通信的可靠性和扩大其覆盖范围。


    丢包率是指测试中所丢失数据包数量占所发送数据组的比率。丢包率与数据包长度以及包发送频率相关。具体测试方法说明见 3.5 节。


    通信时延我们一般指的是应用层到应用层的传输时延，可分为单侧测试时延和回环测试时延。具体测试方法说明见 3.5 节。接收信号强度指测试设备接收到`OBU`、`RSU`广播的`V2X`消息的信号强度大小。测试设备的接收信号强度可反映待测设备在其作用范围内辐射的信号强度。一般测试`V2X`设备接收到的信号强度的方法有
    3 个。


    ·使用无线信号强度计。使用专业的无线信号强度计来测量`V2X`设备接收到的信号强度。这种仪器可以精确地测量信号的功率水平，并提供以毫瓦分贝（`dBm`）为单位的结果。将无线信号强度计放置在`V2X`设备附近，记录并记录接收到的信号强度值。


    ·使用可编程测试设备，如软件定义无线电（`Software Defined Radio`，`SDR`）或专用的`V2X`测试设备。通过配置测试设备，将其设置为发送已知功率水平的`V2X`信号，然后在`V2X`设备的接收端测量信号强度。这种方法可以提供更准确和可控的测试结果。


    ·进行场地测试。也就是说，在真实的场地环境中进行测试。安装`V2X`设备，并在不同的位置和距离下测试接收到的信号强度。可以使用事先安装好的`V2X`路侧设备或移动的`V2X`测试设备作为信号源，发送`V2X`信号，然后测量`V2X`设备接收到的信号强度。记录测试点的位置和相应的信号强度值。


    在进行接收信号强度测试时，应需注意确保测试环境没有其他无线设备的干扰，以便准确测量`V2X`设备接收到的信号强度；测试时应覆盖不同的距离和位置，以获取全面的信号强度数据；进行多次测试以获取可靠的结果，并计算平均值或范围，以考虑环境变化和测量误差；在测试中记录相关的参数，如测试位置、发送功率、测试设备型号等，以便后续分析和比较。


    通过测试接收信号强度，可以评估`V2X`设备在不同位置和距离下的接收能力，为系统设计、设备部署和性能优化提供参考。这有助于确保`V2X`通信的可靠性和稳定性，提高车辆之间、车辆与基础设施之间的通信质量。


    信噪比是基本的通信性能参数，反映了设备的通信状态，直接影响`V2X`消息是否能够被解析，测试`V2X`信噪比的主流方法有 2 种。


    ·使用专业测试设备，如信号分析仪或频谱分析仪。将`V2X`设备连接到测试仪器，并将其设置为接收模式。然后，在测试环境中发送已知功率的信号，记录`V2X`设备接收到的信号强度和噪声水平。通过将信号强度与噪声水平相除，计算得到信噪比值。


    ·进行场地测试。也就是说，在真实的场地环境中进行测试。安装`V2X`设备，并在不同的位置和距离下进行测试。发送已知功率的`V2X`信号，记录`V2X`设备接收到的信号强度和噪声水平。将信号强度与噪声水平相除，计算得到信噪比值。


    在进行信噪比测试时，应确保测试环境没有其他无线设备的干扰，以便准确测量`V2X`设备的信号质量和噪声水平；测试时应覆盖不同的距离和位置，以获取全面的信噪比数据；进行多次测试以获取可靠的结果，并计算平均值或范围，以考虑环境变化和测量误差；在测试中记录相关的参数，如测试位置、发送功率、测试设备型号等，以便后续分析和比较。


    通过测试信噪比，可以评估`V2X`设备在不同位置和距离下的信号质量和噪声水平。这有助于确定设备的接收性能和干扰抵抗能力，为系统设计和优化提供参考，并可确保`V2X`通信的可靠性和稳定性，提高车辆之间、车辆与基础设施之间的通信质量。


    通信速率是指设备之间进行通信时传输数据的速率。它表示在单位时间内可以传输的数据量，通常以`Mbit/s`（兆比特每秒）为单位。


    要测试通信速率，可以采用以下方法。


    ·进行基准测试：使用专业的测试设备和工具进行基准测试。将`V2X`设备放置在测试环境中，通过配置保证其可在测试环境中正常通信。通过发送不同大小的数据包，并测量传输时间，可以计算出通信速率。测试工具通常会提供速率测量功能，可以直接获取传输速率的结果。


    ·进行实际场景测试。也就是说，在真实的道路环境中进行测试。安装`V2X`设备，并进行实际的通信场景模拟。通过发送不同大小的数据包，并记录传输时间，可以计算出通信速率。测试过程中需要考虑车辆移动的影响，以获取更真实的速率数据。


    在进行通信速率测试时，需要确保测试环境没有其他无线设备的干扰，以获得准确的速率测量结果；进行多次测试以获取可靠的结果，并计算平均速率，以考虑环境变化和测量误差；测试时应覆盖不同的数据包大小和通信距离，以获取全面的速率数据；在测试中记录相关的参数，如数据包大小、传输时间、测试位置等，以便后续分析和比较。


    通过测试通信速率，可以评估`V2X`设备之间的数据传输性能，为系统的设计和优化提供参考。这有助于确保`V2X`通信的实时性和可靠性，提高车辆之间、车辆与基础设施之间的通信效率。


    ## 3.2 LTE-V2X 技术


    ### 3.2.1 LTE-V2X 技术的定义及架构


    #### 1. LTE-V2X 技术的定义及标准体系


    `LTE-V2X`是指基于`LTE`移动通信技术演进形成的`V2X`车联网无线通信技术，是融合`LTE`网络的车辆通信解决方案，支持授权频段的信息传输。`LTE-V2X`包括蜂窝通信（`Uu`）和直接通信（`PC5`）两种工作模式\[19\]。针对车联网的跨行业属性，汽车、电子、信息通信、交通运输等行业联合出台了《国家车联网产业标准体系建设指南》，对产业急需的`LTE-V2X`全协议栈标准、基础设施建设标准等进行重点布局，完成了覆盖总体要求、接入层、网络层、消息层、应用功能等各个方面的技术标准规范的制定，有效支撑了跨行业企业的协同研发与产业化，具体标准详见表
    3.1。


    表 3.1　我国车联网`LTE-V2X`全协议栈标准


