    ## 7.5 前方拥堵提醒技术


    ### 7.5.1 前方拥堵提醒的定义

    前方拥堵提醒（Traffic Jam Warning，TJW）是指，主车（HV）行驶前方发生交通拥堵状况，RSU 将拥堵路段信息发送给 HV，TJW 应用将对驾驶员进行提醒。TJW
    应用适用于城市及郊区普通道路及高速公路拥堵路段的预警。

    TJW 应用提醒驾驶员前方路段拥堵，有助于驾驶员合理制订行车路线，提高道路通行效率。


    ### 7.5.2 前方拥堵提醒的主要场景

    TJW 的主要场景如下：HV 从远处接近相应的 RSU，RSU 周期性广播局部道路拥堵数据信息；TJW 应用根据上述信息，结合本车的定位和行驶状态，计算出本车在路网中的位置，并判断前方是否有拥堵，如果有，则对驾驶员进行前方拥堵的提示。


    ### 7.5.3 前方拥堵提醒的基本工作原理与算法实现

    TJW 的基本工作原理如下。

    ①HV 根据收到的道路数据，以及本车的定位和运行数据，判定本车在路网中所处的位置和运行方向。

    ②判断车辆前方道路是否有交通拥堵。若有，则直接提醒驾驶员。

