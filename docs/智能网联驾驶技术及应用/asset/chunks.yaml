    ## 5.4 紧急刹车预警技术

    ### 5.4.1 紧急刹车预警的定义

    紧急刹车预警（`Emergency Brake Warning`，`EBW`）是指主车（`HV`）行驶在道路上，与前方行驶的远车（`RV`）存在一定距离，当前方`RV`进行紧急制动时，其会将这一信息通过短程无线通信广播出来。`HV`检测到`RV`的紧急制动状态后，若判断该`RV`事件与`HV`相关，则对`HV`驾驶员进行预警。本应用适用于城市及郊区的普通道路及高速公路可能发生的制动追尾碰撞危险的预警。


    ### 5.4.2 紧急刹车预警的主要场景

    `EBW`包括如下主要场景。

    场景一：`HV`行驶在道路上，`RV`发生紧急制动事件，如图 5.9 所示。`EBW`应用对`HV`驾驶员发出预警，提醒驾驶员前方紧急制动操作存在碰撞危险。预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV`发生追尾碰撞。在此过程中，`HV`和`RV`需具备短程无线通信能力。


    ![](img/txt005_18.jpg "pagenumber_ebook=120,pagenumber_book=110")

    图 5.9　同车道`HV`前方紧邻的`RV`紧急制动


    场景二：`HV`行驶在道路上，其前方非紧邻的`RV-1`发生紧急制动事件，`HV`的视线被紧邻的`RV-2`所遮挡，如图 5.10 所示。`EBW`应用对`HV`驾驶员发出预警，提醒驾驶员前方紧急制动操作存在碰撞危险。预警时机需确保`HV`驾驶员收到预警后，能有足够的时间采取措施，避免与`RV-2`和`RV-1`发生追尾碰撞。在此过程中，`HV`和`RV-1`、`RV-2`需具备`V2X`通信能力。


    ![](img/txt005_19.jpg "pagenumber_ebook=120,pagenumber_book=110")

    图 5.10　同车道`HV`前方非紧邻的`RV`紧急制动


    ### 5.4.3 紧急刹车预警的基本原理与算法实现

    在相同或者相邻车道上，`RV`发生紧急制动事件并对外广播，当`HV`通过行驶方向、距离、位置、速度等信息，判断该事件对`HV`具有潜在危险时，则对`HV`驾驶员进行预警。触发`EBW`功能的`HV`和`RV`的位置关系如图
    5.11 所示。


    `EBW`的基本工作原理如下。

    ①`RV`出现紧急制动事件时，将这一信息对外进行广播；`HV`接收到的`RV`信息时，判断其是否包含紧急制动事件。

    ②`HV`将出现紧急制动事件的`RV`分类为前方相同车道和前方相邻车道。

    ③`HV`进一步根据车速、位置等信息判断该`RV`是否与`HV`相关，若存在潜在碰撞危险，则对`HV`驾驶员进行提醒。


    ![](img/txt005_20.jpg "pagenumber_ebook=121,pagenumber_book=111")

    图 5.11　触发`EBW`功能的`HV`和`RV`的位置关系


    本书实现`EBW`算法的具体思路如下。

    ①定义一个函数`doEBW`，它接受两个参数——`hvInfo`和`rvInfo`，两个参数分别表示主车和远车的信息。

    ②函数内部首先初始化两个变量：`warning_flag`和`adviser`。`warning_flag`表示预警等级，其中 0 表示无须预警，2 表示需要紧急停车预警。`adviser`表示建议类型，其中`keep`表示保持当前状态，`emergency_stop`表示紧急停车。

    ③分别从`hvInfo`和`rvInfo`中提取主车和远车的 x 坐标和 y 坐标、速度、航向角、尺寸、车辆类型和刹车状态，并将其赋值给相应的变量。

    ④调用`my_calc_distance`函数，计算主车和远车之间的纵向、横向和直线距离以及相对位置关系。

    ⑤判断主车到远车之间是否满足以下条件，若满足则将`warning_flag`设为 2，并将`adviser`设为`emergency_stop`：纵向距离大于
    0（即远车在主车前方）、横向距离小于默认道路宽度的一半（即两车在同一条道上）、主车速度大于 0.1（即主车不是静止状态）、主车无法在碰撞前停下来。

    ⑥最终返回`warning_flag`和`adviser`作为函数输出。


