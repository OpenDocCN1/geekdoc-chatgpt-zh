    )\n\n3.路侧消息\n\n1）定义\n\n路侧信息（Road Side Information，RSI）是指路侧单元向周围车载单元发布的交通事件信息以及交通标志信息。RSI的使用场景如图4.6所示。\n\
    \n其中，交通事件信息当前支持标准GB/T29100-2012；交通标志信息当前支持标准GB5768.2-2009。RSI能够打包一个或多个交通事件信息或者交通标志信息，同时包含发送该消息的路侧单元编号以及参考位置坐标。"
