    ## 前方拥堵提醒算法描述


    ①定义一个函数`doTJW()`，它接受两个参数：`hvInfo`和`rteInfo`。`hvInfo`表示主车信息，`rteInfo`表示`RSI`。

    ②函数内部首先初始化一个变量：`warning_flag`。`warning_flag`表示预警等级，其中 0 表示无须预警，1 表示前方拥堵提醒。

    ③从`hvInfo`中提取主车的 x 坐标和 y 坐标、速度、航向角、尺寸、车辆类型和所在车道，从`rteInfo`中提取道路拥堵状况和拥堵范围，并将其赋值给相应的变量。

    ④调用`distance()`函数，计算主车和拥堵路段之间的距离及相对位置关系。

    ⑤若距离小于所设阈值且主车位于拥堵路段所在车道，则将`warning_flag`设为 1。

    ⑥最终返回`warning_flag`作为函数输出。


    下面给出了基于 Python 的 TJW 算法实现示例代码，供读者在学习时参考。


