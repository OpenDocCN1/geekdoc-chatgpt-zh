    ## 4. 路侧安全消息


    ### 1. 定义

    路侧安全消息（Road Safety Message，`RSM`）：路侧单元通过路侧本身拥有的相应感知识别手段，得到的其周边交通参与者（这里的交通参与者包括路侧单元本身、周围车辆、非机动车、行人等）的实时状态信息，并将这些信息整理成本消息体所定义的格式，将其作为这些交通参与者的基本安全状态信息（类似于`BSM`），广播给周边车辆，支持这些车辆的相关应用。


    `RSM`的存在使得车辆对于周围环境的感知不仅仅依赖`BSM`。路侧单元基于路侧传感器，帮助车辆对其周围的环境进行了探测，并将实时信息通过`RSM`传递给车辆。


    `RSM`的使用场景如图4.8所示。


    ![](images/txt004_16.jpg "pagenumber_ebook=99,pagenumber_book=89")


    图4.8　`RSM`的使用场景


    ### 2. 消息主体结构及说明

    `RSM`具备消息的`ID`和不同消息发送方`RSU`的`ID`的字段。`RSM`中的位置信息字段用来提供本消息作用范围内的参考三维位置坐标，消息中所有的位置偏移量均基于该参考坐标计算，真实位置坐标等于偏移量加上参考坐标。


    `RSU`获取路侧感知单元检测的所有或部分周边交通参与者的信息并将其组成`RSM`的参与者列表信息，这部分信息实际上相当于`BSM`中`OBU`广播的自身车辆信息，信息内容组成与`BSM`类似，只不过由`RSU`获取感知信息并发送给周边其他车辆，一些只能由车辆自身提供的信息（如刹车状态）则无法在`RSM`中体现。


    当某参与者信息来源于`RSU`收到的`BSM`时，其中的车辆`ID`字段必须与`BSM`中的车辆`ID`字段一致。当消息中包含非机动车、行人等交通参与者时，`RSM`可减去属于机动车部分的信息字段。


    图4.9给出了`RSM`的主体结构，其中实线框为必有项，虚线框为可选项。


    ![](images/txt004_17.jpg "pagenumber_ebook=100,pagenumber_book=90")


    图4.9　`RSM`的主体结构


    ### 3. `RSM`应用

    `RSM`主要对接路侧的感知设备和边缘计算设备，用于道路事件的识别，比如车辆发生事故、车辆异常、异物闯入等，通过路侧设备本身拥有的相应感知识别技术，得到其周边交通参与者的实时状态信息，并将这些信息整理成本消息体所定义的格式。`RSM`的存在使车辆对周围环境的感知不仅仅依赖`BSM`。路侧单元基于路侧传感器，帮助车辆对其周围的环境进行探测，获得超视距的感知。


    在场景应用方面，`RSM`中包含的行人感知信息可用于弱势交通参与者碰撞预警场景，该场景可分为前车遮挡视野盲区内的行人碰撞和倒车视野盲区的行人碰撞，可通过`RSM`进行预警提醒。


