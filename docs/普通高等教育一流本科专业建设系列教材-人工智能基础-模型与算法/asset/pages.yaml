  md: '一般图搜索过程划分为如下两个阶段。


    1）初始化。建立只包含初始状态节点 \(S_0\) 的搜索图：


    ```

    G:={S_0}

    OPEN:={S_0}

    CLOSE:={}

    ```


    2）搜索循环。


    +   ① Move-First(OPEN)：取出 OPEN 表首的节点 n 作为扩展节点，同时将其移到 CLOSE 表。


