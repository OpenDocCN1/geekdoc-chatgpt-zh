- pgno: 185
  md: '# (1) 精英蚂蚁系统


    在传统的蚁群算法中，蚂蚁根据路线的长度释放信息素，信息素与路径长度成反比，路径越短信息素越多，对应路径被后续蚂蚁选择的概率也就越大。但是，当问题的规模较大时，问题的复杂度也将呈指数增长，仅仅依靠这样一个基础单一的信息素更新机制引导搜索偏向，搜索效率有瓶颈。如果能够找到一些强化优秀路径的措施，就可以让蚂蚁搜索的范围更大，让算法更加正确地收敛。


    精英蚂蚁系统（elitist ant system，EAS）是对基础蚂蚁系统（ant system，AS）的第一次改进，EAS 在 AS 的基础上改进了对最优路径的强化方法。它通过每轮信息素更新完毕后，令最后一只蚂蚁为最优路径添加额外信息素的方法进行强化。在
    EAS 中，城市 \( i \) 与城市 \( j \) 对应的边上信息素量 \( \tau(i, j) \) 的更新公式为


    ```

    \begin{cases} \tau(i, j) = (1 - \rho)\tau(i, j) + \sum_{k=1}^m \Delta \tau_k(i,
    j) + e \Delta_b(i, j) \\ \Delta \tau_k(i, j) = \begin{cases} (C_k)^{-1}, & (i,
    j) \in R^k \\ 0, & \text{其他} \end{cases} \\ \Delta \tau_b(i, j) = \begin{cases}
    (C_b)^{-1}, & (i, j) \text{在路径 } T_b \text{上} \\ 0, & \text{其他} \end{cases} \end{cases}
    (6.1)

    ```


    式中，\( m \) 为蚂蚁的个数；\( \Delta \tau_k(i, j) \) 为第 \( k \) 只蚂蚁经过城市 \( i \) 与城市 \(
    j \) 时释放的信息素量，它等于蚂蚁 \( k \) 本轮构建路径长度的倒数；\( C_k \) 为路径的长度；\( T_b \) 为搜索至今的最优路径；\(
    C_b \) 为算法开始至今最优路径的长度。


    可见，EAS 在每轮迭代中为属于 \( T_b \) 的边增加了额外的 \( e / C_b \) 的信息素量。增强某些路径的信息素含量，可以更好地引导蚂蚁搜索的偏向，使算法更快收敛。大量的实验表明，在一个合适的参数值
    \( e \) 的作用下，EAS 有着较 AS 更高的求解精度，同时 EAS 的进化速度也更快。


    # (2) 基于排列的蚂蚁系统


    人们总是追求功能和性能更加优秀的算法，在 EAS 被提出后，又会思考有没有一种更好的信息素更新方式，它在使 \( T_b \) 各边信息素浓度得到加强的同时，对其余边的信息素更新也能有所贡献。


    基于排列的蚂蚁系统（rank-based ant system，\( AS_{rank} \)）就是这样一种改进版本，它在 AS 的基础上给蚂蚁要释放的信息素量
    \( \Delta \tau_k(i, j) \) 加上了一个权值，进一步加大各边上信息素量的差异，以指导搜索。当一轮路径构建完成后，它们将按照所得路径的长短进行排名，只有生成了至今最优路径的蚂蚁和排名在前（\(
    \omega - 1 \)）的蚂蚁才被允许释放信息素，蚂蚁在边 \( (i, j) \) 上释放信息素 \( \Delta \tau_k(i, j) \)
    的权值由蚂蚁的排名决定。信息素更新规则为


    ```

    \begin{cases} \tau(i, j) = (1 - \rho)\tau(i, j) + \sum_{k=1}^{\omega-1} (\omega
    - k)\Delta \tau_k(i, j) + e \Delta_b(i, j) \\ \Delta \tau_k(i, j) = \begin{cases}
    (C_k)^{-1}, & (i, j) \in R^k \\ 0, & \text{其他} \end{cases} \\ \Delta \tau_b(i,
    j) = \begin{cases} (C_b)^{-1}, & (i, j) \text{在路径 } T_b \text{上} \\ 0, & \text{其他}
    \end{cases} \end{cases} (6.2)

    ```


    构建至今最优路径 \( T_b \) 的蚂蚁产生信息素的权值大小为 \( \omega \)，它将在 \( T_b \) 的各边上增加'
