    # ## 3. 按推理方式分类


    若按学习时所采用的推理方式进行分类，机器学习可分为基于演绎的学习和基于归纳的学习。


    基于演绎的学习是指以演绎推理为基础的学习。解释学习在其推理过程中主要使用的是演绎方法，因而可将它划入基于演绎的学习这一类。


    基于归纳的学习是指以归纳推理为基础的学习。示例学习、发现学习等在其学习过程中主要使用了归纳推理，因而可划入归纳学习这一类。


    早期的机器学习系统一般使用单一的推理方式，现在则趋于集成多种推理技术来支持学习。例如，类比学习就既用到了演绎推理又用到了归纳推理；解释学习也是这样，只是因其演绎部分所占的比例较大，所以把它归入基于演绎的学习。


    # ## 4. 按综合属性分类


    随着机器学习的发展及人们对其认识的提高，人们要求对机器学习进行更科学、更全面的分类。因此，近年来有人提出了按学习的综合属性进行分类，它综合考虑了学习的知识表示、推理方法、应用领域等多种因素，能比较全面地反映机器学习的实际情况。用这种方法进行分类，不仅可以把过去已有的学习方法都包括在内，而且反映了机器学习的最近发展。


    按照这种分类方法，机器学习可分为归纳学习、分析学习、连接学习及遗传算法与分类器系统等。其中，分析学习是基于演绎和分析的学习，学习时从一个或几个实例出'
