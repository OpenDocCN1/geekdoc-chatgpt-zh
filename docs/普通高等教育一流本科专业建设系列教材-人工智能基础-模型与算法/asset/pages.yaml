  md: '与某个蛋白质分子子配匹，则对应个体是非自体，那么免疫系统就会消灭它。1994 年，福雷斯（Forrest）根据上述原理提出了负选择算法。


    如图 6.12 所示，该算法分两步处理。第一步是初始化一个等长度的串集合 S 作为自体，接下来初始化串集合 R0，选择 R0 中与 S 不匹配的若干串作为新的串集合，即检测器
    R；第二步，让自体 S 随机进行某些片段的随机变异，用检测器 R 与 S 进行匹配，若 R 与 S 存在匹配的部分，那么自体检测器成功发现自体 S 被感染，反之则算法失败。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_193_0.png)


    图 6.12 负选择算法


    负选择算法的优点在于所有检测器相互独立，通过多个检测器可以覆盖非自体的各个不同部分，它在判断系统是否正常工作方面有十分显著的优势。负选择算法提供的思想可以融合到其他算法中发挥独特的作用。


    # (2) 克隆选择算法


    在免疫系统中，B 淋巴细胞表面有大量的抗体，抗体携带有检测器，若检测器与抗原匹配，就会诱导免疫系统复制出更多同类型的 B 淋巴细胞，进而产生更多的抗体。在抗体匹配抗原的过程中，与抗原部分匹配的抗体对应的
    B 淋巴细胞将会死亡，完美匹配的抗体则会大量繁殖来抵抗抗原。德·卡斯特罗（De Castro）根据上述原理提出了克隆选择算法。


    以图 6.13 为例，当生物体内出现图示的 4 种抗原时，B 细胞中的抗原决定簇会与抗体进行匹配，匹配成功的 B 细胞进行克隆，产生更多同类型的 B 细胞；匹配失败的
    B 细胞或者部分匹配的 B 细胞则会死亡。


    克隆选择算法由 6 部分组成，具体步骤如下。


    +   第 1 步，产生候选解集 P，它由记忆细胞子集 M 和剩余群体 Pr 组成。


    +   第 2 步，根据亲和度的计算，从 P 中找出 n 个最好的个体组成集合 Pn。


    +   第 3 步，克隆 Pn 中的所有个体，产生一个临时克隆群体 C，这个群体 C 的规模是抗原亲和度量度的递增函数。


    +   第 4 步，群体 C 经过与抗原亲和度成比例的高频变异，形成一个成熟的群体 C*。


    +   第 5 步，在 C* 中选择改进个体组成记忆集合。P 集合中的一些成员能够被 C* 的其他成员所取代。


    +   第 6 步，取代群体 P 中 d 个亲和度最低的抗体，维持多样性。


    # (3) 免疫遗传算法


    为了给基本遗传算法提供控制收敛方向、补充记忆功能等，免疫遗传算法（immune genetic algorithm, IGA）被提出。在此算法中把每个个体看成一个抗体，把抗原看成求解'
