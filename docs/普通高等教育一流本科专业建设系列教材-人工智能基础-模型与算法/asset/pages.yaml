    # 4. 第四阶段：大突破时期（1993 年至今）


    对于人工智能发展而言，大突破时期也是一个超越历史上任何一个阶段的、非凡的创造性时期。1993 年，美国作家兼计算机科学家弗诺·文奇（Vernor Vinge）在他发表的一篇文章中首次提到了人工智能的“奇点理论”。他认为未来某一天人工智能会超越人类，并且会终结人类社会，进而主宰人类世界。这个时间点被他称为“即将到来的技术奇点”。


    这一时期，模拟自然界鸟类飞行的粒子群算法和模拟蚂蚁群体行为的蚁群算法，以及用于求解函数优化等问题的各类算法相继出现，推动了从进化计算发展而来的计算智能、自然计算等人工智能分支的重要发展。


    如图 1.4 所示，1995 年，贝尔实验室丹麦科学家科琳娜·科尔特斯（Corinna Cortes）和俄罗斯统计学家、数学家弗拉基米尔·万普尼克（Vladimir
    Vapnik）提出了软边距的非线性支持向量机（support vector machines，SVM），并将其应用于手写数字识别问题。该成果在发表后得到了科学家广泛的关注和引用，其影响在当时远超人工神经网络，以支持向量机为代表的集成学习、稀疏学习、统计学习等多种机器学习方法开始占据主流舞台。在之后的
    10 年里，深层次的人工神经网络并未受到关注。


