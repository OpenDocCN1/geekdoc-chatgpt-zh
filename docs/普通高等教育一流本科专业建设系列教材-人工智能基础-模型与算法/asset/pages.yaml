    $$v_i(k+1)=\begin{cases} 1, & u_i(k) \geqslant 0 \\ -1, & u_i(k) < 0 \end{cases}$$
    (7.76)


    式中，


    $$u_i = \sum_{j=1, j \neq i}^N w_{ij} v_j(k) - \theta_i, 1 \leqslant i \leqslant
    N$$ (7.77)


    Hopfield 神经网络可以是同步工作方式，也可以是异步工作方式，即神经元的更新既可以同步（并行）进行，也可以异步（串行）进行。在同步进行时，神经网络中所有神经元的更新同时进行；在异步进行时，在同一时刻只有一个神经元更新，而且该神经元在网络中每个神经元都更新之前不会再次更新。在异步更新时，神经元的更新顺序可以是随机的。


    Hopfield 神经网络中的神经元相互作用，不断演化。如果神经网络在演化过程中，从某一时刻开始，神经网络中所有神经元的状态不再改变，则称该神经网络是稳定的。


    Hopfield 神经网络是高维非线性动力学系统，可能有若干个稳定状态。从任一初始状态开始运动，总可以达到某个稳定状态，这些稳定状态可以通过改变各个神经元之间的连接权值得到。也就是说，稳定性是
    Hopfield 神经网络最重要的特性。下面对 Hopfield 神经网络的稳定性进行分析。


    Hopfield 神经网络是一个多输入、多输出、带阈值的二态非线性动力学系统，所以类似于李雅普诺夫稳定性分析方法，在 Hopfield 神经网络中也可以构造一种李雅普诺夫函数（Lyapunov
    function），在满足一定的参数条件下，该函数值在网络运行过程中不断降低，最后趋于稳定的平衡状态。霍普菲尔德引入这种能量函数作为网络计算求解工具，被称为计算能量函数。


    离散型 Hopfield 神经网络的计算能量函数定义为


    $$E = -\frac{1}{2} \sum_{i=1}^N \sum_{j=1, j \neq i}^N w_{ij} v_i v_j + \sum_{i=0}^N
    \theta_i v_i$$ (7.78)


    式中，$v_i$、$v_j$ 为各个神经元的输出。


