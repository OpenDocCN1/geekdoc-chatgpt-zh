    # (5) 其他改进的遗传算法


    混合遗传算法（hybrid genetic algorithm，HGA）结合了多种优化算法，可以得到性能更优的算法，提高算法求解问题的能力。在局部搜索能力方面，遗传算法搜索效果偏弱，而其他搜索算法，如爬山法（hill-climbing
    algorithm）、最速下降法（steepest descent method）、局部搜索算法（local search algorithm）和模拟退火算法等，在局部搜索方面具有得天独厚的优势，将这些优化方法融入遗传算法可以成为改进遗传算法局部搜索能力的有效途径。虽然遗传算法对问题应用求解具有很强的普适性，但是应用于特定的专门领域问题时，遗传算法可能不是解决问题的最佳方法，并不能保证最佳的求解性能；而在遗传算法中加入专门领域特定知识时，遗传算法的性能可能会明显改善。


    CHC 算法是埃舍尔曼（Eshelman）于 1991 年提出的一种改进的遗传算法的缩称，第一个 C 代表跨世代精英选择（cross generational
    elitist selection）策略，H 代表异物种重组（heterogeneous recombination），第二个 C 代表突变（cataclysmic
    mutation）。不同于传统的遗传算法依据个体的适应度复制个体完成选择操作，CHC 遗传算法将上世代种群与通过新的交叉方法产生的个体群混合起来，从中按一定概率选择较优的个体，这一策略称为跨世代精英选择。此外，CHC
    算法对变异算子和交叉算子也进行了一些改进，使得 CHC 遗传算法具有更好的遗传多样性和健壮性。


    并行遗传算法在传统遗传算法的基础上引入了并行计算技术。并行遗传算法分为标准型并行算法和分解型并行算法两种。标准型并行算法没有改变传统遗传算法的串行计算结构，只是在适应值计算、选择算子、交叉算子、变异算子中使用了并行计算技术，在一定程度上提高了遗传算法的计算效率。分解型并行算法更加贴合自然界生物进化的过程，它是将种群分成几个部分，分别独立地使用原有的遗传算法进化。独立进化的各个生物群体面临的环境不同，它们所处的进化阶段也不尽相同。围绕并行遗传算法的信息交换操作，研究人员提出了岛屿模型（island
    model）、踏脚石模型（stepping-stone model）、邻居模型（neighborhood model）等，这些模型各有所长，大大提高了遗传算法的运行效率。


    # 4. 遗传算法的应用


    遗传算法的主要应用领域包括组合优化、函数优化、智能控制、机器人学、规划、设计、图像处理、信号处理、人工生命等，此外也出现了很多正在飞速发展的新领域、新问题。


    # (1) 组合优化


    组合优化是指在给定约束条件下，求解目标函数的最优值。实践证明，遗传算法已经在求解旅行商问题、背包问题、装箱问题、布局优化、网络路由等具有 NP 难度的组合优化问题上取得了成功的应用。通过遗传算法，可以在后台对这些问题进行建模，快速得到最佳线路规划。


    # (2) 函数优化


    工程上经常会遇到在多准则或多设计目标下设计与决策的问题，如果这些目标是相悖'
  merge: -1
  img_proc: true
- pgno: 183
  md: '的，则需要找到满足这些目标的最佳设计方案。通常的做法是根据某有效函数将多目标合成单一目标来进行优化。通过将遗传算法和函数优化的方法组合在一起，可以挑选出架构设计的弱点和可能出现的故障，从而可以在实际生产中避免这些问题。


    # (3) 智能控制


    智能控制涉及许多控制领域问题，考虑到系统优化、自适应、自组织和自学习等方面的要求，一般存在许多常规方法难以奏效的问题。例如，机器人技术需要人类的设计师和工程师通过尝试各种可能发生的事情，来创造出对人类有用的机器。每个机器人的设计取决于它要完成的工作，不同的工作有着不同的设计。通过遗传算法进行编程，可以针对每种特定用途，搜索计算出一系列最佳设计和组件，可以为计算机计算模拟出多种可能操作。


    # (4) 并行处理的遗传算法


    并行处理的遗传算法不仅是遗传算法本身的发展，而且对于新一代智能计算机体系结构的研究也十分重要，遗传算法在操作上具有高度的并行性，许多研究人员正在探索在并行机上高效执行遗传算法的策略。并行处理的遗传算法可分为两类：一类是粗粒度并行遗传算法，主要开发群体间的并行性；另一类是细粒度遗传算法，主要开发一个群体中的并行性。


    # (5) 遗传算法与人工生命的渗透


    人工生命是用计算机、机械等人工媒体模拟或构造出的具有自然生物系统特有行为的人造系统。人工生命与遗传算法有着密切的关系，基于遗传算法的进化模型是研究人工生命现象的重要理论基础。虽然人工生命的研究尚处于启蒙阶段，但遗传算法已在其进化模型、学习模型、行为模型、自组织模型等方面显示出了初步的应用能力，并且必将得到更为深入的应用和发展。人工生命与遗传算法相辅相成，遗传算法为人工生命的研究提供了一个有效的工具，人工生命的研究也必将促进遗传算法的进一步发展。


    # 6.2.2 蚁群优化算法


    观察过蚂蚁的人都会发现，经常有蚂蚁成群结队地搬运食物、雨前进行迁徙等。那么，蚁群运动的路线是如何确定的呢？是否存在一定的路径规划，或者已有路线的优化思想可供我们借鉴呢？事实上，很多蚂蚁没有发育完全的视觉感知系统，甚至很多种类完全没有视觉，那么它们是如何组织团队的呢？


    # 1. 蚁群优化算法的基本概念


    如图 6.8 所示，自然界蚂蚁群体在寻找食物时，需要从 A 点出发到达食物所在地 B 点，沿途有 3 条路线，蚂蚁通过一种被称为信息素的物质实现相互的间接通信，从而能够合作发现从蚁穴到食物源的最短路线是“路径
    2”。蚂蚁在寻找食物的过程中往往是随机选择路径的，但它们能感知当前地面上的信息素浓度，并倾向于向信息素浓度高的方向行进。信息素由蚂蚁自身释放，是实现蚁群内间接通信的物质。由于较短路径上蚂蚁的往返时间比较短，单位时间内经过该路径的蚂蚁较多，因此信息素的积累速度比较长路径快。因此，当后续蚂蚁在路口时就能感知先前蚂蚁留下的信息，并倾向于选择一条较短的路径前行。这种正反馈机制使得越来越多的蚂蚁在巢穴与食物之间的最短路径上行进。由于其他路径上的信息素会随着时间消失，因此最终所有的蚂蚁都会在最优路径上行进。'
