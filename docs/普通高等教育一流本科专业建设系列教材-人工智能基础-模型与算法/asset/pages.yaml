    第 2 步，计算变量对的关联性，关联系数用 $I(X_i, X_j)$ 计算，计算方法为


    $$I(X_i, X_j) = \sum_{a,b} P(X_i = a, X_j = b) \log \frac{P(X_i = a, X_j = b)}{P(X_i
    = a)P(X_j = b)}$$ (6.16)


    第 3 步，根据关联信息构建关联树。


    第 4 步，深度优先遍历关联树，产生新样本。


    高斯分布又称为正态分布，通常记为 $N(\mu, \sigma^2)$，其中 $\mu$ 为分布的均值，$\sigma$ 为分布的方差。高斯概率模型是实数编码分布估计算法的经典概率模型。种群增量学习（population-based
    incremental learning, PBIL）进化算法和单变量边缘分布算法（univariate marginal distribution algorithm,
    UMDA）对应的实数编码分布估计算法 PBILc 和 UMDAc 所采用的概率模型都是高斯概率模型。此外，多元高斯模型也是解决多变量相关的实数编码分布估计算法常采用的概率模型。本小节将以
    PBILc 为例介绍高斯概率模型解决连续空间的优化问题的流程。


    PBILc 对每个变量定义一个高斯分布，并根据每个高斯分布在整个定义域空间产生一个样本。构建概率模型的过程主要包括对应变量的均值和方差的确立，均值约束了样本的中心，而方差则控制着样本的多样性与离散性。随着种群的进化，均值将逐渐逼近全局最优解所在的位置，而方差将越来越小，从而使种群聚拢到全局最优解附近。具体地说
    PBILc 的求解过程由以下 4 步组成。


    +   1. 第 1 步，随机产生初始种群，计算个体适应度。

    +   2. 第 2 步，利用线性学习的方式更新高斯分布的均值。

    +   3. 第 3 步，计算高斯分布的方差。

    +   4. 第 4 步，更新高斯分布产生的样本。


    除上述两种模型外，还有贝叶斯网络概率模型。


    贝叶斯网络使用一个有向无环图来描述变量之间的概率依赖关系，图中的节点代表变量，边代表依赖关系。以图 6.15 为例，图中共有 5 个节点，不同节点之间存在依赖关系，


    ![](img/01b3dd63f105ee2f61ade787bae553f5_197_0.png)


    图 6.15 贝叶斯网络拓扑结构


    贝叶斯网络提供一种把联合分布概率分解为局部概率分布的方法。


    假设 $X = \{X_1, X_2, \dots, X_n\}$ 为随机变量集合，$x = \{x_1, x_2, \dots, x_n\}$ 为变量集合，则基于贝叶斯网络的联合概率为
    $P(X) = P(X_1 | X_2 \cdots X_n) P(X_2 | X_3 \cdots X_n) \cdots P(X_{n-1} | X_n)
    P(X_n)$ (6.17)


    由于贝叶斯网络可以很好地描述变量之间的复杂依赖关系，因此佩利坎（Pelikan）等于 1999 年提出基于贝叶斯网络模型的 EDA——贝叶斯优化算法（Bayesian
    optimization algorithm, BOA）。BOA 采用贝叶斯网络概率模型，采样时


    根据贝叶斯网络拓扑结构从父节点到子节点依次采样生成样本。其中，构建贝叶斯网络模型的过程包括网络结构的学习和参数的学习两个过程。佩利坎等的研究表明，BOA 在求解复杂优化问题时取得了很好的效果。'
