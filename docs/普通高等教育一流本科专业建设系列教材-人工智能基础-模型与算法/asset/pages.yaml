- pgno: 258
  md: '习比命题规则要复杂得多。


    # 2. 序贯覆盖


    规则学习的目标是产生一个能覆盖尽可能多的样例的规则集。其中，最直接的做法是序贯覆盖（sequential covering），即逐条归纳：在训练集上每学到一条规则，就将该规则所覆盖的训练样例去除，然后以剩下的训练样例组成训练集重复上述过程。由于每次只处理一部分数据，因此序贯覆盖也被称为分治（separate-and-conquer）策略。


    以命题规则学习为例考察序贯覆盖法。命题规则的规则体是对样例属性值进行评估的布尔函数，如“色泽 = 青绿”“含糖率 <= 0.2”等，规则头是样例类别。序贯覆盖法的关键是如何从训练集学出单条规则。显然，对规则学习目标
    \(\Theta\)，产生一条规则就是寻找最优的一组逻辑文字来构成规则体，这是一个搜索问题。形式化地说，给定正例集合与反例集合，学习任务就是基于候选文字集合
    \(\mathcal{F} = \{f_k\}\) 生成最优规则 \(r\)。在命题规则学习中，候选文字是形如 “\(R\)(属性\(_i\), 属性值\(_{i,j}\))”
    的布尔表达式，其中属性\(_i\) 表示样例第 \(i\) 个属性，属性值\(_{i,j}\) 表示属性\(_i\) 的第 \(j\) 个候选值，\(R(x,
    y)\) 则是判断 \(x\)、\(y\) 是否满足关系 \(R\) 的二元布尔函数。


    最简单的做法是从空规则 “\(\emptyset \leftarrow\)” 开始，将正例类别作为规则头，逐个遍历训练集中的每个属性及取值，尝试将其作为逻辑文字增加到规则体中。若能使当前规则体仅覆盖正例，则由此产生一条规则，然后去除已被覆盖的正例并基于剩余样本尝试生成下一条规则。


    以表 8.2 训练集为例，首先根据第 1 个样例生成文字“好瓜”和“色泽 = 青绿”，加入规则，得到：


    ```

    好瓜 ← (色泽 = 青绿)                                  (8.14)

    ```


    这条规则覆盖样例 1、6、10 和 17，其中有两个正例和两个反例，不符合“当前规则仅覆盖正例”的条件。于是，尝试将该命题替换为基于属性“色泽”形成的其他原子命题，如“色泽
    = 乌黑”。然而，在该数据集上，这样的操作不能产生符合条件的规则。于是回到“色泽 = 青绿”，尝试增加一个基于其他属性的原子命题，如“根蒂 = 蜷缩”，得到：


    ```

    好瓜 ← (色泽 = 青绿) ^ (根蒂 = 蜷缩)                  (8.15)

    ```


    该规则仍覆盖了反例 17。于是将第 2 个命题替换为基于该属性形成的其他原子命题，如“根蒂 = 稍蜷”，得到：


    ```

    好瓜 ← (色泽 = 青绿) ^ (根蒂 = 软蜷)                  (8.16)

    ```


    这条规则不覆盖任何反例，虽然它仅覆盖一个正例，但已满足“当前规则仅覆盖正例”的条件。因此，保留这条规则并去除它覆盖的样例 6，并将剩下的 9 个样例用作训练集。如此继续，将得到：


    +   - 规则 1      好瓜 ← (色泽 = 青绿) ^ (根蒂 = 软蜷)

    +   - 规则 2      好瓜 ← (色泽 = 青绿) ^ (敲声 = 浊响)           (8.17)

    +   - 规则 3      好瓜 ← (色泽 = 乌黑) ^ (根蒂 = 蜷缩)           (8.18)

    +   - 规则 4      好瓜 ← (色泽 = 乌黑) ^ (纹理 = 稍糊)           (8.19)


    该规则集覆盖了所有正例，未覆盖任何反例，这就是序贯覆盖法学得的结果。


    上面这种基于穷尽搜索的做法在属性和候选值较多时会由于组合爆炸而不可行。现实任务中一般有两种策略来产生规则：第一种策略是自顶向下，即从比较一般的规则开始，逐渐添加新文字以缩小规则覆盖范围，直到满足预定条件为止。其称为“生成-测试”（generate-then-test）法，是规则逐渐特化（specialization）的过程。第二种策略是自底向上'
