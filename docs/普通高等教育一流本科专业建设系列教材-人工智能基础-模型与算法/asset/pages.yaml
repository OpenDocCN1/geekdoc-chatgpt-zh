  md: '# 2. 图搜索的基本思想


    图搜索是一种在图中寻找路径的方法，从图中的初始节点开始，至目标节点为止。具体中，初始节点和目标节点分别代表产生式系统的初始数据库和满足终止条件的数据库。其方法是先把问题的初始状态作为当前状态，选择适用的运算符对其进行操作，生成一组子状态，检查目标状态是否在其中出现。若出现，则搜索成功，找到了问题的解；若不出现，则按某种搜索策略，从已生成的状态中再选一个状态作为当前状态。重复上述过程，直到目标状态出现或不再有可供操作的状态及运算符为止。


