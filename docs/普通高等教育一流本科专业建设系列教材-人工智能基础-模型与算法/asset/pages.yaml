  md: '# 前言


    # 1. 写书的动机


    人工智能的诞生与发展是 20 世纪伟大的科学成就之一，也是 21 世纪引领未来发展的主导学科之一。人工智能作为一门新理论、新方法、新技术、新思想不断涌现的前沿交叉学科，相关研究成果已经广泛应用到国防建设、工业生产、国民生活中的各个领域。在信息网络和知识经济时代，人工智能正在受到越来越广泛的重视，必将为推动科学技术的进步和产业的发展发挥更大的作用。面对这种形势，迫切需要编写适应当前发展要求的人工智能基础性读物，它既可以作为人工智能人才培养的基础性教材，也可以作为人工智能研究、开发、应用人员从事实际工作的辅导性读物，这就是作者编写本书的初衷。


    自 20 世纪 50 年代开始，人工智能这一科学领域诞生至今，多年过去，科学家们并未创造出像人一样智能的机器，人工智能的发展也是一波三折。但是，在人工智能的发展过程中，诞生了许多使机器能够拥有一定智能的理论、方法与技术。因此，本书阐述的不是如何创造像人一样的智能机器，而是人类创造智能机器所涉及的多种方法与技术，涉及机器学习、数据挖掘、计算机视觉、专家系统、自然语言理解、智能检索、模式识别和智能机器人等领域。人工智能的长期目标是建立与人类水平相当的机器智能。


    # 2. 本书的特色


    从目前市场上看，有关人工智能导论、人工智能原理等的书籍较多，并各有特色。在编写本书的过程中，作者结合了多年的教学经验。首先，作者注重本书的现代性，现在人工智能已进入第
    2 个发展阶段，并已形成“新一代人工智能”，这个时期人工智能的技术发展特点体现在以深度人工智能学习（特别是其中的卷积神经网络）为代表的机器学习方法的技术内容上；其次，注重本书的实用性，从人工智能发展的经验与教训来看，应用的受限一直是人工智能发展的主要瓶颈，每当人工智能应用受到阻碍时就出现了人工智能发展的低潮，要保持人工智能的发展就必须不断促使人们将人工智能的相关理论方法与实践操作结合起来，这样才能使人们对于人工智能未来的发展有明晰的理解，明确今后努力的方向；最后，要注重本书的引导性，本书是人工智能的基础性读物，它具有入门性与引导性的作用。人工智能是一门前沿交叉学科，其内容涉及从理论、开发到应用，从上游、中游到下游等多个方面，但它不是一本百科全书，在编写中必须坚持其入门性与引导性的原则，既要让读者对人工智能学科有一个全面、整体、系统的了解与认识，也要在全面阐述的基础上突出介绍具有新一代技术发展特点的机器学习内容，同时通过实例让读者能够进行实践性学习。


    人工智能是一门正在快速发展的新兴学科，新的理论、方法、技术及新的应用领域不断涌现，尽管作者对本书的撰写付出了很多努力，但由于视野和水平的限制，书中仍有不足之处，恳请专家、同行不吝赐教，也希望广大读者提出宝贵意见和建议。'
