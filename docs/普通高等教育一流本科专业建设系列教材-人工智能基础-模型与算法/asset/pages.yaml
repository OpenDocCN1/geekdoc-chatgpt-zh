    # 3.7.1 与/或图表示


    通过问题规约可以看到，对于一个复杂问题，常常需要将其分解成若干子问题。如果把每个子问题都解决了，整个问题也就解决了。如果子问题不容易解决，还可以将子问题再分成子子问题，直至所有的子问题都被解决，则这些子问题的解的组合就构成了整个问题的解。与/或图是用于表示此类求解过程的一种方法，是一种图或树的形式，是基于人们在求解问题时的一种思维方法。


    +   1) 分解：“与”树。一个复杂问题 P 分解为与之等价的一组简单的子问题 P₁, P₂, ..., Pₙ，子问题还可分为更小、更简单的子问题，如此下去。当这些子问题全都解决时，原问题
    P 也就解决了；任何一个子问题 Pᵢ(i=1,2,...,n) 无解，都将导致原问题 P 无解。这样的问题与这组子问题之间形成了“与”的逻辑关系。该分解过程可以用一个有向图来表示：问题和子问题都用相应的节点表示，从问题
    P 到每个子问题 P 都只用一个有向边连接，然后用一段弧将这些有向边连起来，以标明它们之间存在的“与”的关系。这种有向图称为“与”图或者“与”树。


    +   2) 等价变换：“或”树。把一个复杂的问题 P 经过等价变换转变为与之等价的一组简单的子问题 P₁, P₂, ..., Pₙ，而子问题还可再等价变换为若干更小、更简单的子问题，如此下去。当这些子问题中有任何一个子问题
    Pᵢ(i=1,2,...,n) 有解时，原问题 P 就解决了；只有当全部子问题无解时，原问题 P 才无解。这样，问题与这组子问题形成了“或”的关系。该等价变换同样可以用一个有向图来表示，这种有向图称为“或”图或者“或”树，其表示方法类似“与”图的表示，只是在“或”图中不用弧将有向边连起来。


    +   3) 与/或图。在实际问题求解过程中，常常是既有分解又有等价变换，因而常将两种图结合起来一同用于表示问题的求解过程。此时，所形成的图就称为“与/或图”或“与/或树”。


    可以把与/或图视为对一般图（或图）的扩展：或反之，把一般图视为与/或图的特例，即一般图不允许节点间具有“与”关系，因此又可把一般图称为或图。与一般图类似，与/或图也有根节点，用于指示初始状态。由于同父子节点间可以存在“与”关系，父、子节点间不能简单地以弧线关联，因此需要引入“超连接”概念。同样原因，在典型的与/或图中，解答路径往往不复存在，代之以广义的解路径——解图。图
    3.17 给出了一个抽象的与/或图简例，节点的状态描述不再显式给出。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_84_0.png)


    图 3.17 与/或图简例'
