    +   2）机制主义方法的技术实现是信息-知识-智能转换。

    +   3）通过机制主义方法，应当把人工智能的结构主义、功能主义和行为主义方法有机和谐地统一起来。

    +   4）通过机制主义方法可以发现与沟通意识、情感、智能的内在联系，从而打破人工智能与自然智能之间的壁垒。


    中国人工智能大会（China Conference on Artificial Intelligence，CCAI）由中国人工智能学会创办于 2015 年，每年举办一届。该会议是我国最早发起举办的人工智能大会，目前已经成为我国人工智能领域规格高、规模大、影响力强的会议之一。


