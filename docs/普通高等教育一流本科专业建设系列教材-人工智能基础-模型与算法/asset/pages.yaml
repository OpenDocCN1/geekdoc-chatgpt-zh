    规则 1 的长度为 2，它通过判断两个逻辑文字的赋值来对示例进行判别。符合该规则的样本（如表 8.2 中的样本 1）称为被该规则覆盖。需要注意的是，被规则
    1 覆盖的样本是好瓜，但没有被规则 1 覆盖的未必不是好瓜；只有被规则 2 这样以 “ ¬好瓜 ” 为头的规则覆盖的才不是好瓜。


    显然，规则集合中的每条规则都可看作一个子模型，规则集合是这些子模型的一个集成。当同一个示例被判别结果不同的多条规则覆盖时，称发生了冲突（conflict），解决冲突的办法称为冲突消解（conflict
    resolution）。常用的冲突消解策略有投票法、排序法、元规则法等。投票法是将判别相同的规则数最多的结果作为最终结果。排序法是在规则集合上定义一个顺序，在发生冲突时使用排序最前的规则；相应的规则学习过程称为带序规则（ordered
    rule）学习或优先级规则（priority rule）学习。元规则法是根据领域知识事先设定一些元规则（meta-rule），即关于规则的规则，如 “发生冲突时使用长度最小的规则”，并根据元规则的指导使用规则集。


    此外，从训练集学得的规则集合也许不能覆盖所有可能的未见示例，如前述规则集合 R 无法对 “根蒂=蜷缩”“脐部=稍凹” 且 “纹理=清晰” 的示例进行判别，这种情况在属性数目很多时经常出现。因此，规则学习算法通常会设置一条
    “默认规则”（default rule），由它来处理规则集合未覆盖的样本。例如，为 R 增加一条默认规则： “未被规则 1、2 覆盖的都不是好瓜。”


    从形式语言表达能力方面而言，规则可分为两类，即命题规则（propositional rule）和一阶规则（first-order rule）。前者是由原子命题（propositional
    atom）和逻辑联结词与（∧）、或（∨）、非（¬）和蕴涵（←）构成的简单陈述句。例如，规则集 R 就是一个命题规则集，“根蒂=蜷缩”“脐部=凹陷”都是原子命题。后者的基本成分是能描述事物的属性或关系的原子公式（atomic
    formula），如表述父子关系的谓词（predicate）“父亲（X,Y）”就是原子公式，再如表示加 1 操作 “σ(X) = X + 1” 的函数 “σ(X)”
    也是原子公式。如果进一步用谓词 “自然数（X）” 表示 X 是自然数，“∀X” 表示 “对于任意 X 成立”， “∃Y” 表示 “存在 Y 使之成立”，那么
    “所有自然数加 1 都是自然数” 就可写作 “∀X∃Y {自然数（Y）←自然数（X） ∧（Y = σ(X))}”，或更简洁的 “∀X {自然数（σ(X)）←自然数（X）}”。这样的规则就是一阶规则，其中
    X 和 Y 称为逻辑变量；“∀”“∃” 分别表示 “任意” 和 “存在”，用于限定变量的取值范围，称为量词（quantifier）。显然，一阶规则能表达复杂的关系，因此也被称为关系型规则（relational
    rule）。以西瓜数据为例，若简单地把属性当作谓词来定义例与属性值之间的关系，则命题规则集 R 可改写为如下一阶规则集 R′：


    +   1. 规则 1 好瓜(X) <- 根蒂(X, 蜷缩) ^ 脐部(X, 凹陷) (8.12)

    +   2. 规则 2 ¬好瓜(X) <- 纹理(X, 模糊) (8.13)


    显然，从形式语言系统的角度来看，命题规则是一阶规则的特例，因此一阶规则的学'
