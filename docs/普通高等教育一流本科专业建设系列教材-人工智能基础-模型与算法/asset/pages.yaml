  md: '进化规划首先产生 \( N \) 个初始个体，也就是突变；接着从 \( 2N \) 个个体 \(\{x_i\}\)、\(\{x''_i\}\) 中根据适应度挑选出
    \( N \) 个个体组成新种群。如此反复迭代，直至得到满意的结果。但应该指出，进化规划没有重组或交换这类算子，它的进化主要依赖突变。在标准进化规划中，这种突变十分简单，它只需参照个体适应度添加一个随机数即可。很明显，标准进化规划在进化过程中的自适应调整功能主要依靠适应度函数
    \( f(x) \) 来实现。


    设置非负的进化规划参数 \(\beta=1\)、\(\gamma=0\) 和 \(\{x_i\} (i \in [1, N])\) 为随机生成的初始种群。标准进化规划算法流程如下。


    第 1 步，计算初始种群中每个个体的适应度函数值 \( f(x) \)。


    第 2 步，对每个个体进行突变操作。对于个体 \( x_i (i \in [1, N])\)，生成随机向量 \( r \)，其中每个元素 \(\sim N(0,1)\)，因此
    \( x''_i \leftarrow x_i + r_i \sqrt{\beta f(x_i) + \gamma} \)。


    第 3 步，对原始种群和新生成子代种群中的所有个体进行选择操作。\(\{x_i, x''_i\}\) 中最好的 \( N \) 个个体。


    第 4 步，迭代执行第 2 步和第 3 步，直至满足终止条件，得出进化规划最优解。


    在进化规划中，选择操作可以通过不同的方案来实现，在标准进化操作中是以确定性的方式选择最好的 \( N \) 个个体。其实也可以通过概率来选择，如用 \( N
    \) 次轮盘赌选择或者锦标赛选择都是常用的选择方案。


    在进化规划中候选解进化的同时，变异方差也在进化，把这种进化规划称为元进化规划。在元进化规划中，为了增加进化规划在进化过程中的自适应调整功能，在突变中添加方差的概念。个体的表达式为


    ```

    $$

    \begin{cases}

    x''_i = x_i + r_{xi}\sqrt{v_i} \\

    v''_i = v_i + r_{vi}\sqrt{cv_i} \\

    v''_i = \max(v''_i, \varepsilon)

    \end{cases}

    \quad (6.21)$$

    ```


    可以看出，新个体 \( x''_i \) 是在旧个体 \( x_i \) 的基础上添加一个随机数，该添加量取决于个体的变异方差 \( v_i \)。方差在每次进化中自适应调整，设置变异方差
    \( v_i \) 的最小值为 \( \varepsilon \)，其值为用户自定义的可调参数。可以看到，在搜索变异方差最优解的过程中，变异方差也在不断进行变异选择操作。这种进化方式已成为进化规划的主要手段，因此在进化规划前冠以“元”这个术语以表示它为基本方法。元进化规划就是通过自适应调整变异方差，来改变搜索最优解的收敛速度。通常设置非负进化规划参数
    \( \varepsilon \ll 1, c = 1\)，\(\{x_i\} (i \in [1, N])\) 为随机生成的初始种群，\( v_i \)
    与 \( x_i \) 相关。元进化规划算法流程如下。


    第 1 步，计算初始种群中每个个体的适应度函数值 \( f(x_i) \)。


