    # ## 2.2.2 知识的谓词逻辑表示法


    谓词逻辑演算是对命题演算的进一步扩展，它能够深入研究一些更复杂的问题。一个谓词可分为个体和谓词名两个部分，个体表示独立存在的事物或某个抽象概念，谓词名则用来表示个体的性质、状态或个体之间的相互关系。例如，命题“李明是学生”，可用谓词表示为
    Student(LiMing)，这里 Li Ming 是个体，代表命题中的李明这个人；而 Student 是谓词名，反映了个体是学生这一特征。


    # ### 1. 谓词


    谓词是用来代替或者展示其客体性质、特征或者客体之间关系的词项。根据《现代汉语词典》的定义，汉语的体词包括名词、数词和量词，汉语的谓词可以包括一切例句。谓语是对主语的陈述或说明，指出“做什么”、“是什么”或“怎么样”。


    在计算机语言的环境下，谓词是指条件表达式的求值返回真或假的过程。


    # ### 2. 谓词公式


    谓词公式又称合式公式，是一种形式语言表达式，即形式系统中按一定规则构成的表达式。用谓词公式既可表示事物的状态、属性和概念等事实性的知识，也可表示事物间具有因果关系的规则性知识。谓词公式有时简称公式，如果一个公式
    \(\phi\) 中的自由变元都属于集合 \(\{x_1, x_2, \dots, x_n\}\)，则 \(\phi\) 也可以记为 \(\phi(x_1,
    x_2, \dots, x_n)\)。不含量词、自由变元的谓词公式分别称为开公式和闭公式，后者又称语句，如 \(R(x, y)\) 为开公式，\(\forall
    x R(x)\) 是一个语句。


    由下述规则可得到如下谓词公式。


    +   1）单个谓词和单个谓词的否定称为原子谓词公式（若 \(\{t_1, t_2, \dots, t_n\}\) 是项，\(P\) 是谓词，则称 \(P(t_1,
    t_2, \dots, t_n)\) 为原子谓词公式），原子谓词公式是谓词公式。


    +   2）若 \(A\) 是谓词公式，则 \(\neg A\) 也是谓词公式。


    +   3）若 \(A\)、\(B\) 都是谓词公式，则 \(A \lor B\)、\(A \land B\)、\(A \to B\) 也都是谓词公式。


    +   4）若 \(A\) 是谓词公式，\(x\) 是任一个体变元，则 \((\forall x)A\) 和 \((\exists x)A\) 也都是谓词公式。


    在谓词公式中，连词的优先级别依次为 \(\neg\)、\(\land\)、\(\lor\)、\(\to\)。


    在命题逻辑中，对命题公式中各个命题的一次真值指派称为命题公式的一个解释。一个谓词公式的解释可能有很多个，对于每一个解释，谓词公式都可求出一个真值（T 或 F）。


    下面是用谓词公式表示知识的步骤。


    +   1）定义谓词及个体，确定每个谓词及个体的确切含义。


    +   2）根据所要表达的事物或概念，为每个谓词中的变元赋予特定的值。


    +   3）根据所要表达的知识的语义，用适当的联结符号将各个谓词连接起来，形成谓词公式。'
