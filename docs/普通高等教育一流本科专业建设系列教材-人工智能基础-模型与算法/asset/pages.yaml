  md: '敛的作用。以图 6.16 中的粒子为例，粒子起初是无规律运动，在粒子不断更新位置和方向后，发现粒子群整齐排列方向向右时，群体具有更好的性能，故全局最优向量
    \( g_{Best} \) 为此时的 \( p_{Best} \)，从而成功实现寻找最优解的功能。


    粒子群优化算法和遗传算法相比，没有了选择算子、交配算子和变异算子，而仅仅是通过速度更新公式[式（6.18）]和位置更新公式[式（6.19）]不断地进化而到全局最优解。因此，粒子群优化算法的原理和机制更加简单，算法实现也相对容易，运行效率更高。粒子群优化算法的流程如图
    6.17 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_200_0.png)


    图 6.17 粒子群优化算法的流程（二）


    +   1. 第 1 步，初始化所有的个体（粒子），初始化它们的速度和位置，并且将个体的历史最优 \( p_{Best} \) 设为当前位置，而群体中最优的个体作为当前的
    \( g_{Best} \)。

    +   2. 第 2 步，在每一代的进化中，计算各个粒子的适应度函数值。

    +   3. 第 3 步，如果该粒子当前的适应度函数值比其历史最优值要好，那么历史最优将会被当前位置所替代。

    +   4. 第 4 步，如果该粒子的历史最优比全局最优要好，那么全局最优将会被该粒子的历史最优所替代。

    +   5. 第 5 步，对每个粒子 \( i \) 的第 \( d \) 维的速度和位置分别按照式（6.18）和式（6.19）进行更新。


    ```

    \( v_i^d = \omega \times v_i^d + c_1 \times rand_1^d \times (p_{Best_i}^d - x_i^d)
    + c_2 \times rand_2^d \times (g_{Best}^d - x_i^d) \) (6.18)

    ```


    式中，\( \omega \) 为惯量权重（inertia weight），一般初始化为 0.9，然后随着进化过程线性递减到 0.4；\( c_1 \) 和
    \( c_2 \) 为加速系数（acceleration coefficients，也称学习因子），传统上都是取固定值 2.0；\( rand_1^d \)
    和 \( rand_2^d \) 为两个 [0, 1] 区间上的随机数。


    ```

    \( x_i^d = x_i^d + v_i^d \) (6.19)

    ```


    第 6 步，若当前粒子的适应度值还没有达到问题结束的要求，则转到第 2 步；否则输出 \( g_{Best} \) 并结束。


    需要注意的是，在更新过程中，粒子群优化算法要求采用一个由用户设定的 \( V_{max} \) 来限制速度的范围，\( V_{max} \) 的每一维 \(
    V_{max}^d \) 一般可以取相应维度的取值范围的 10%～20%。另外，式（6.19）中的位置更新必须是合法的，所以在每次进行更新之后都要检查更新后的位置是否在问题空间之中，若不在，则必须进行修正，一般的修正方法可以重新随机设定或者限定在边界。


    # 6.2.6 进化规划


    进化规划是美国工程师劳伦斯·福格尔（Lawrence Fogel）于 20 世纪 60 年代提出的。福格尔将仿真进化方法用于由相互竞争的算法所构成的种群，在一系列研究中探索了进化规划的可能性。进化规划是一种模仿自然进化原理以求解参数优化问题的算法。进化规划'
