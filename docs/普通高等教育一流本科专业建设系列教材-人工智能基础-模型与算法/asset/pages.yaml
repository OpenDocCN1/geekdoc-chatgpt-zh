  md: '$$P(\neg H | E) = \frac{P(E|\neg H) \times P(\neg H)}{P(E)}$$


    式（5.27）除以式（5.28）得


    $$\frac{P(H|E)}{P(\neg H|E)} = \frac{P(E|H)}{P(E|\neg H)} \times \frac{P(H)}{P(\neg
    H)}$$


    由充分性度量 LS 和几率函数 O(E) 的定义可得


    $$O(H|E) = LS \times O(H)$$


    即


    $$P(H|E) = \frac{LS \times P(H)}{(LS-1) \times P(H) + 1}$$


    对于知识


    IF E THEN = (LS,LN) H[P(H)]


    当证据 E 肯定存在时，可以根据 LS 给出结论 H 的可信度 P(H|E)。


    当 LS>1 时，O(H|E) = LS × O(H) > O(H)，相应地有 P(H|E) > P(H)，表明由于证据 E 的存在，可增强 H 为真的程度（有利证据）；当
    LS=1 时，O(H|E) = LS × O(H) = O(H)，表明 E 与 H 无关（无关证据）；当 LS<1 时，O(H|E) = LS × O(H)
    < O(H)，表明由于证据 E 的存在，减小了 H 为真的程度（不利证据）；当 LS=0 时，O(H|E) = LS × O(H) = 0，表明由于证据 E
    的存在，导致 H 为假（否定性的证据）。


    2）证据肯定不存在。


    当证据肯定不存在时 P(E) = P(E|S) = 0, \( P(\neg E) = 1 \)。


    由贝叶斯公式得


    $$P(H|\neg E) = \frac{P(\neg E|H) \times P(H)}{P(\neg E)}$$


    $$P(\neg H|\neg E) = \frac{P(\neg E|\neg H) \times P(\neg H)}{P(\neg E)}$$


    式（5.31）除以式（5.32）得


    $$\frac{P(H|\neg E)}{P(\neg H|\neg E)} = \frac{P(\neg E|H)}{P(\neg E|\neg H)}
    \times \frac{P(H)}{P(\neg H)}$$


    根据必要性度量 LN 和几率函数 O(E) 的定义，可得


    $$O(H|\neg E) = LN \times O(H)$$


    即


    $$P(H|\neg E) = \frac{LN \times P(H)}{(LN-1) \times P(H) + 1}$$


    对于知识


    IF E THEN = (LS,LN) H[P(H)]


    当证据 E 肯定不存在时，可以根据 LN 给出结论 H 的可信度 P(H|\neg E)。


    当 LN < 1 时，O(H|\neg E) = LN × O(H) < O(H)，表明由于证据 E 不存在，减小了 H 为真的程度（\neg E 为不利证据），一般情况下
    LN < 1。


    当 LN = 0 时，O(H|\neg E) = LN × O(H) = 0，表明由于证据 E 不存在，导致 H 为假（表明了证据 E 的必要性）。


    当 LN = 1 时，O(H|\neg E) = LN × O(H) = O(H)，表明 \neg E 与 H 无关。'
