    OPEN 表中的该节点的 f 值更改为第①步计算出的 f 值，返回指针更改为 n。

    ④ If mi 已经存在于 CLOSE 表中 then 该节点同样也有多个父节点。在这种情况下，同样计算当前路径的 g 值和原来路径的 g 值。如果当前的
    g 值小于原来的 g 值，则将表中该节点的 g、f 值及返回指针进行类似第③步的修改，并考虑修改表中通过该节点的后继节点的 g、f 值及其返回指针。

    ⑤ 按 f 值从小到大的次序，对 OPEN 表中的节点进行重新排序。

    End If

    End Else

    End While

    End

