    # 7.5.2 连续型 Hopfield 神经网络


    离散型 Hopfield 神经网络中的神经元与生物神经元的差别较大，因为生物神经元的输入与输出是连续的，而且生物神经元存在时滞。1984 年，霍普菲尔德又提出一种连续时间神经网络模型，在这种网络中，神经元的状态可以取
    0~1 的任一实数值。


