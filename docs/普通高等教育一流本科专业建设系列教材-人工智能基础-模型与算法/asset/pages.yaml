    # ## 7.5.5 Hopfield 神经网络优化方法


    如果将网络的稳态作为一个优化问题的目标函数的极小点，那么初态朝稳态收敛的过程就是优化计算的过程。该优化计算是在网络演化过程中自动完成的。


    1985 年，霍普菲尔德和塔克（Tank）应用神经网络方法求解 TSP 这一著名的组合优化难题并获得成功，引起了世界各国学者的广泛关注。他们的工作不仅对研究神经网络理论具有重要意义，也为组合优化问题求解开辟了新的途径。


    # ### 1. 基本思想


    无论是离散型 Hopfield 还是连续型 Hopfield 神经网络模型，能量函数都表征了网络的动力学演化过程，并揭示了该演化过程与网络稳态之间的内在联系。因此，Hopfield
    能量函数极小化过程表示神经网络从初始状态到稳定状态的演化过程。通常，约束优化问题的求解过程实际上就是目标函数的极小化过程，选择合适的能量函数使其最小值对应问题的最优解。因此，目标函数达到局部极小或者全局最小，相应的解为约束优化问题的局部最优解或全局最优解。如果将目标函数与能量函数相联系，并通过能量函数将约束优化问题的解映射到神经网络的一个稳定状态上，那么就可以利用神经网络的演化过程实现优化计算。这就是应用神经网络解决优化问题的基本思想。


    用神经网络方法求解优化问题的关键是，如何把待求解的优化问题映射为一个神经网络。一般可以将求解的组合优化问题的每一个可行解用换位矩阵（permutation
    matrix）表示。


    另一个关键问题是构造能量函数，使其最小值对应问题的最优解，它决定了一个特定问题是否能够用神经网络方法求解。目前还没有直接将约束优化问题映射为神经网络的方法，通常采用优化理论中的拉格朗日（Lagrange）函数和乘子法，即利用优化问题的目标函数和约束条件构造相应的能量函数。一般使用在计算能量函数
    $E$ 中添加一些违反约束条件的惩罚项的简单方法，用惩罚函数法写出求解优化问题的能量函数，即


    $E = \sum_{i=1}^m C_i E_i + C_0 E_0 \quad (7.102)$


    式中，$E_i$ 为违背约束条件的惩罚函数。$E_0$ 为优化的目标函数。$C_i$ 和 $C_0$ 为平衡 $E_i$ 和 $E_0$ 在总能量函数中的作用的比例常数，且如果最小化
    $E_0$，则 $C_0 > 0$；如果最大化 $E_0$，则 $C_0 < 0$。'
