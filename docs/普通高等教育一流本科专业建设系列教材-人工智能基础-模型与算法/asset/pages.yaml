  md: '(lazy learning) 方式，先不进行任何训练，待收到预测请求时再根据当前数据集进行概率估值：若数据不断增加，则可在现有估值基础上，仅对新增样本的属性值所涉及的概率估值进行计数修正，即可实现增量学习。


    朴素贝叶斯的主要优点如下。


    +   1) 朴素贝叶斯模型有稳定的分类效率。


    +   2) 对小规模的数据表现很好，能处理多分类任务，适合增量式训练，尤其是数据量超出内存时，可以一批批地进行增量训练。


    +   3) 对缺失数据不太敏感，算法也比较简单，常用于文本分类。


    朴素贝叶斯的主要缺点如下。


    +   1) 理论上，朴素贝叶斯模型与其他分类方法相比具有最小的误差率。但是实际上并非总是如此，这是因为朴素贝叶斯模型给定输出分类的情况下，假设属性之间相互独立，该假设在实际应用中往往是不成立的，在属性个数比较多或者属性之间相关性较大时，分类效果不好；而在属性相关性较小时，朴素贝叶斯性能最为良好，对于这一点，半朴素贝叶斯之类的算法通过考虑部分关联性进行适度改进。


    +   2) 需要知道先验概率，且先验概率很多时候取决于假设，假设的模型可以有很多种，因此在某些时候会由于假设的先验模型的原因导致预测效果不佳。


    +   3) 由于是通过先验和数据来决定后验的概率从而决定分类，因此分类决策存在一定的错误率。


    +   4) 对输入数据的表达形式很敏感。


    # 本章小结


    机器学习是目前人工智能领域研究的核心热点之一。经过多年的发展，尤其是最近20 年与统计学及神经科学的交叉，机器学习带来了高效的网络搜索、实用的机器翻译、高精度的图像理解和识别，极大地改变了人们的生产生活方式。机器学习技术在人们日常生活中的应用已经非常普遍，从搜索引擎到指纹识别，从用户推荐到辅助驾驶，人们可能在毫无察觉的情况下每天使用不同的机器学习技术几十次之多。


    很多相关研究者认为，机器学习是人工智能取得进展的最有效途径之一。本章围绕机器学习的基础理论和基本概念，从基于规则的机器学习、基于数据统计的机器学习和基于深度神经网络的机器学习
    3 个角度介绍当前机器学习的主流方法，并简要介绍了不同方法的典型应用场景及不同方法在解决问题时的优势和缺点。由于篇幅所限，本章内容只能介绍机器学习领域的一些最基本的概念和方法，难免挂一漏万。


    作为目前人工智能中非常活跃的研究领域之一，机器学习领域的学习资料相对丰富，读者可以根据自身需要利用公开课程掌握机器学习的基本概念，可以通过阅读最新科研论文掌握机器学习的最新进展，也可以在开发者平台上和相关的研究者进行交流和实践。相信在不远的将来，机器学习必将更深刻地改变人们的生活。


