    通过大量的实验，人们发现 ASrank 与 AS、EAS 相比具有更好的寻优能力和更快的求解速度。


    # (3) 最大最小蚂蚁系统


    问题 1: 对于大规模的 TSP 问题，由于搜索蚂蚁的个数有限，而初始化时蚂蚁的分布是随机的，这会不会造成蚂蚁只搜索了所有路径中的小部分就以为找到了最好的路径，所有的蚂蚁都很快聚集在同一路径上，而真正优秀的路径并没有被搜索到？


    问题 2: 当所有蚂蚁都重复构建同一条路径时，意味着算法已经进入停滞状态。此时，不论是基本 AS、EAS 还是 ASrank，之后的迭代过程都不再可能有更优的路径出现。这些算法收敛的效果虽然是“单纯而快速的”，但“欲速则不达”，有没有办法利用算法停滞后的迭代过程进一步搜索，以保证找到更接近真实目标的解？


    为了解决上面两个问题，德国学者托马斯·斯图泽（Thomas Stutzle）等在 1997 年提出了最大最小蚂蚁系统（max-min ant system，MMAS）。MMAS
    在基本 AS 算法的基础上进行了下列 4 项改进。


    +   1) 只允许迭代本次迭代构建出最短路径的蚂蚁，或者至今最优的蚂蚁释放信息素。

    +   2) 信息素量大小的取值范围被限制在一个区间内。

    +   3) 信息素初始值为信息素取值区间的上限，并且伴随一个较小的信息素蒸发速率。

    +   4) 每当系统进入停滞状态时，重新初始化问题空间各边上的信息素量。


    改进的第 1 项借鉴了 EAS，但又有细微的不同。在 EAS 中，只允许至今最优的蚂蚁释放信息素；而在 MMAS 中，释放信息素的不仅有可能是至今最优的蚂蚁，还有可能是迭代最优的蚂蚁。实际上，迭代最优更新规则和至今最优更新规则在
    MMAS 中会被交替使用，这两种规则使用的相对频率将会影响算法的搜索效果。如果只使用至今最优更新规则进行信息素的更新，则搜索的导向性很强，算法会很快收敛到
    \(T_b\) 附近；反之，如果只使用迭代最优更新规则，则算法的搜索能力会得到增强，但收敛速度会下降。实验结果表明，对于小规模的 TSP 问题，仅仅使用迭代最优信息素更新方式即可。随着问题规模的增大，至今最优信息素规则的使用变得越来越重要。一种好的方式是，在算法迭代过程中，逐渐加大至今最优更新的概率。需要指出的是，计算智能领域的各个算法大多是不确定搜索，不能完全通过理论的分析就判断出一种方法是好还是不好，不论是对遗传算法、蚁群优化算法还是
    6.2.5 小节将要介绍的粒子群优化算法的研究与改进，往往都是一个“理论猜想→实验探索→理论分析总结”的过程。


    MMAS 为了避免某些边上的信息素浓度增长过快，算法出现早熟现象，提出了第 2 项改进措施。假设信息素量的大小被限定在一个取值范围 \([\tau_{min},
    \tau_{max}]\) 中，蚂蚁是依据启发式信息和信息素浓度选择下一个城市的，其中启发式信息为蚂蚁当前所在城市 \(i\) 到下一可能城市 \(j\)
    的距离 \(d_{ij}\) 的倒数。这里的 \(d_{ij}\) 是事先给定的，如果信息素浓度也被限制在一个区间内，则从城市 \(i\) 出发的蚂蚁 \(k\)
    选择城市 \(j\) 的概率 \(p_k(i, j)\) 也将被限制在一个区间内。不妨假设该区间为 \([p_{min}, p_{max}]\)，容易得出
    \(0 < p_{min} \leqslant p_k(i, j) \leqslant p_{max} \leqslant 1\)，则此算法有效地避免了陷入停滞'
