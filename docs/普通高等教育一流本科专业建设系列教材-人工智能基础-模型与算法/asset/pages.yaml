    框架之间就是一种横向联系。


    # 2.4.3 框架系统的推理


    框架系统没有固定的推理机制，遵循匹配和继承的原则。


    基于框架的推理方法是继承。继承即子框架可以拥有其父框架的槽及其槽值。实现继承的操作有匹配、搜索和填槽。匹配就是问题框架与知识库中的框架的模式匹配。问题框架就是在求解某个问题时，先把问题用一个框架表示出来，然后与知识库中的已有框架进行匹配。如果匹配成功，就可获得有关信息。搜索就是沿着框架间的纵向和横向联系，在框架网络中进行查找。搜索的目的是获得有关信息。例如，当问题框架与某一框架相匹配时，该框架的某一个槽空缺，那么就可以再找它的父框架，通过特性继承获得所需信息。填槽即为搜索并将信息填到空缺处的过程。


    问题求解系统由两部分构成：构成框架系统的知识库和求解问题的推理机。求解问题的匹配推理步骤如下。


    +   1）把待解决的问题用一个框架表示出来。

    +   2）与知识库中已有的框架进行匹配。找出一个或几个可匹配的预选框架作为初步架设，在初步架设的引导下收集进一步的信息。

    +   3）使用一种评价方法对预选框架进行评价，以便决定是否接受它。

    +   4）若可接受，则与问题框架空槽相匹配的事实就是问题的解。


    # 2.4.4 框架表示法的特点


    框架表示法具有以下优点。


    +   1）结构性：框架表示法最突出的特点是善于表示结构性知识，它能够把知识的内部结构关系及知识间的特殊联系表示出来。

    +   2）深层性：框架表示法不仅可以从多个方面、多重属性表示知识，而且还可以通过 ISA、AKO 槽等以嵌套结构分层地对知识进行表示，因此能用来表达事物间复杂的深层联系。

    +   3）继承性：在框架系统中，下位框架可以继承上位框架的槽值，也可以进行补充和修'
