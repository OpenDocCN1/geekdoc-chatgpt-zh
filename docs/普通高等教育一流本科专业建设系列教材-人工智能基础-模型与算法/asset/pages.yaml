    其中，$r_i(i=1,2,\cdots,15)$ 是规则的编号。初始综合数据库包含的事实有动物有暗斑点，有长脖子，有长腿，有奶，有蹄。


    解 该例题的部分推理网络如图 2.3 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_39_0.png)


    图 2.3 推理网络（部分）


    图 2.3 中最上层的节点称为假设或结论，中间节点称为中间假设，终节点称为证据或事实。每个结论都是本问题的一个目标，所有假设构成了本问题的目标集合。


    系统的推理过程如下。


    +   1）首先，从规则库中取出第一条规则 $r_1$，检查其前提是否可与综合数据库中的已知事实相匹配。$r_1$ 的前提是“有毛发”，但事实库中无此事实，故匹配失败。然后取
    $r_2$，该前提可与已知事实“有奶”相匹配，$r_2$ 被执行，并将其结论“该动物是哺乳动物”作为新的事实加入综合数据库中。此时，综合数据库的内容变为：动物有暗斑点，有长脖子，有长腿，有奶，有蹄，是哺乳动物。


    +   2）再从规则库中取 $r_3$、$r_4$、$r_5$、$r_6$ 进行匹配，均失败。接着取 $r_7$，该前提与已知事实“是哺乳动物”相匹配，$r_7$
    被执行，并将其结论“该动物是有蹄类动物”作为新的事实加入综合数据库中。此时，综合数据库的内容变为：动物有暗斑点，有长脖子，有长腿，有奶，有蹄，是哺乳动物，是有蹄类动物。


    +   3）此后，$r_8$、$r_9$、$r_{10}$ 均匹配失败。接着取 $r_{11}$，该前提“该动物是有蹄类动物 AND 有长脖子 AND 有长腿
    AND 身上有暗斑点”与已知事实相匹配，$r_{11}$ 被执行，并推出“该动物是长颈鹿”。由于“长颈鹿”已是目标集合中的一个结论，即已推出最终结果，因此问题求解过程结束。


    说明：上述规则仅是一种直接表示方式，用三元组 ($r_{i5}$) 表示如下。


    ```

    $r_{i5}$: IF（动物，类别，鸟）AND（动物，本领，善飞）THEN（动物，名称，信天翁）

    ```


    # 2.3.4 产生式表示法评价


    产生式表示格式固定，形式单一，规则（知识单位）间相互较为独立，没有直接关系使知识库的建立较为容易，处理较为简单的问题是可取的。另外，推理方式单纯，也没有复杂计算。特别是知识库与推理机是分离的，这种结构给知识的修改带来了方便，无须修改程序，对系统的推理路径也容易做出解释。所以，产生式表示知识常作为构造专家系统'
