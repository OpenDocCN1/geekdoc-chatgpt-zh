    4) 按照步骤 2) ~3) 建立大量的决策树，这样就构成了随机森林。


    # 3. 算法实践


    用随机森林算法实现对 Iris 数据集的分类。


    随机森林主要应用于回归和分类两种场景，侧重于分类。随机森林在对数据进行分类的同时，还可以给出各个变量的重要性评分，评估各个变量在分类中所起的作用。


    随机森林的构建：首先利用 Bootstrap 方法有放回地从原始训练集中随机抽取 n 个样本，并构建 n 个决策树；然后假设在训练样本数据中有 m 个特征，那么每次分裂时选择最好的特征进行分裂，每棵树都一直这样分裂下去，直到该节点的所有训练样例都属于同一类；接着让每棵决策树在不做任何修剪的前提下最大限度地生长；最后将生成的多棵分类树组成随机森林，用随机森林分类器对新的数据进行分类与回归。


    对于分类问题，按多棵树分类器投票决定最终分类结果；对于回归问题，则由多棵树预测值的均值决定最终预测结果。随机森林的结果如图 8.7 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_255_0.png)


    图 8.7 随机森林的结果


    # 4. 随机森林的优缺点


    +   (1) 随机森林的优点


    随机森林算法可以处理很高维度（特征很多）的数据，并且不用降维，无须做特征选择；特征方面，随机森林可以判断不同特征的重要程度及它们之间相互影响的程度，在大部分特征遗失的情况下仍可以维持一定的结果准确度；随机森林算法实现起来比较简单，训练速度比较快，不容易过拟合，容易做成并行方法；对于不平衡的数据集来说，随机森林可以平衡误差。


    +   (2) 随机森林的缺点


    随机森林已经被证实在某些噪声较大的分类或回归问题上会过拟合；另外，对于有不同取值的属性数据，取值划分较多的属性会对随机森林产生更大的影响，所以随机森林在这种数据上产出的属性权值是不可信的。'
