    $S_2$ 的不可满足性 $\\Leftrightarrow S$ 的不可满足性\n\n由此得到下列结论。\n\n+   1) 为证明子句集 $S$ 的不可满足性，只要对其中可进行归结的子句进行归结，并把归结式加入子句集\
    \ $S$ 中；或者用归结式代替它的亲本子句，并对新的子句集证明其不可满足性即可。\n\n+   2) 如果经归结得到空子句，根据空子句的不可满足性，即可得到原子句集\
    \ $S$ 是不可满足的结论。在命题逻辑中，对不可满足的子句集 $S$，其归结原理是完备的。这种不可满足性可用如下定理描述。\n\n**定理 4.3** 子句集\
    \ $S$ 是不可满足的，当且仅当存在一个从 $S$ 到空子句的归结过程。\n\n# (2) 命题逻辑的归结反演\n\n归结的原理是，假设 $F$ 为已知前提，$G$\
