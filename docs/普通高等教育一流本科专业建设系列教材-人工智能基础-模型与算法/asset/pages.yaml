- pgno: 247
  md: '# 8.2.1 决策树学习


    决策树学习是一种重要的归纳学习，其原理是用构造树形数据结构的方法从一批事实数据集中归纳总结出若干条分类、决策规则。


    # 1. 决策树


    决策树也称判定树，它是由对象的若干属性、属性值和有关决策组成的一棵树。其中，节点为属性（一般为语言变量），分枝为相应的属性值（一般为语言值）。从同一节点出发的各个分枝之间是逻辑“或”关系；根节点为对象的某一个属性；从根节点到每一个叶子节点的所有节点和边按顺序串连成一条分枝路径，位于同一条分枝路径上的各个“属性-值”对之间是逻辑“与”关系，叶子节点是这个与关系的对应结果，即决策。如图
    8.4 所示的决策树，A、B、C 代表属性，$a_i$、$b_j$、$c_k$ 代表属性值，$d_i$ 代表对应的决策。处于同一层的属性（如图 8.4 中的
    B、C 可能相同，也可能不相同），所有叶子节点（如图 8.4 中的 $d_i, i=1,2,\cdots,6$）所表示的决策中也可能有相同者。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_247_0.png)


    图 8.4 决策树


    由图 8.4 可以看出，一棵决策树上从根节点到每一个叶子节点的分枝路径上的诸“属性-值”对和对应叶子节点的决策刚好构成一个产生式规则，即所有“属性-值”对的合取构成规则的前提，叶子节点的决策就是规则的结论。例如，图
    8.4 中从根节点 A 到叶子节点 $d_2$ 的这一条分支路径就构成规则：


    $A = a_1 \land B = b_2 \Rightarrow d_2$ (8.1)


    不同分支路径所表示的规则之间为析取关系。


    这样，一棵决策树实际上就表示了一组产生式规则；反过来，一组特定的产生式规则也可以表示成一棵决策树。这就是说，决策树也是一种知识表示形式。由产生式规则的表达能力可知，决策树也可以描述分类、决策、预测、诊断、评判、控制、概念划定等性质的知识。下面再举几个决策树的例子。


    例如，图 8.5 所示为机场指挥台关于飞机起飞的简单决策树。


    # 2. 决策树构建过程


    决策树是一种知识表示形式，构造决策树可以由人来完成，也可以由机器从一些实例中总结、归纳出来，即由机器学习而得。机器学习决策树也就是所说的决策树学习。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/01b3dd63f105ee2f61ade787bae553f5_248_0.png)


    # 图 8.5 飞机起飞的简单决策树


    决策树学习是一种归纳学习。由于一棵决策树就表示了一组产生式规则，因此决策树学习也是一种规则学习。特别地，当规则是某概念的判定规则时，这种决策树学习也就是一种概念学习。


    决策树学习首先要有一个实例集。实例集中的实例都含有若干“属性-值”对和一个相应的决策、结果或结论。一个实例集中的实例要求应该是相容的，即相同的前提下不能有不同的结论（当然，不同的前提可以有相同的结论）。对实例集的另一个要求是，其中各实例的结论既不能完全相同也不能完全不同，否则该实例集无学习意义。


    决策树学习的基本方法和步骤如下。


    首先，选取一个属性，按该属性的不同取值对实例集进行分类；并以该属性作为根节点，以该属性的诸取值作为根节点的分枝，绘制树。


    然后，考察所得的每一个子类，看其中实例的结论是否完全相同。如果完全相同，则以这个相同的结论作为相应分枝路径末端的叶子节点；否则，选取一个非父节点的属性，按其不同取值对该子集进行分类，并以该属性作为节点，以该属性的诸取值作为节点的分枝，继续绘制树。如此继续，直到所分的子集全都满足：实例结论完全相同，而得到所有的叶子节点为止。这样，一棵决策树即被生成。下面进一步举例说明。


    表 8.1 所示的是某保险公司的汽车驾驶保险类别划分的部分事例。将这张表作为一个实例集，用决策树学习来归纳该保险公司的汽车驾驶保险类别划分规则。


