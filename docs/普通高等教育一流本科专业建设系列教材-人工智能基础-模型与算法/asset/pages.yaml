    v''_i \leftarrow v_i + r_{vi}\sqrt{cv_i} \)。


    第 3 步，对原始种群和新生成子代种群中的所有个体进行选择操作。选出 \(\{x_i, x''_i\}\) 中最好的 \( N \) 个个体并将变异方差 \(
    v_i \) 更新为 \(\{x_i\}\) 对应的方差。


    第 4 步，迭代执行第 2 步和第 3 步直至满足终止条件，得出进化规划最优解。


