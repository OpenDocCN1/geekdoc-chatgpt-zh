  md: '可以采用搜索方法求解博弈问题，下面介绍博弈最基本的两种搜索方法。


    # 3.8.1 极大极小过程


    极大极小（MINMAX，MM）过程是考虑双方博弈若干步后，从可能的走法中选一步相对好的走法来走，即在有限的搜索深度范围内进行求解。


    为此需要定义一个静态估价函数 _e_(_x_)，以便对棋局的态势做出评估。该函数可以根据棋局的态势特征进行定义。假定博弈双方分别为 MAX 和 MIN，其中
    _p_ 代表棋局。规定：有利于 MAX 方的态势，_e_(_p_)取正值；有利于 MIN 方的态势，_e_(_p_)取负值；态势均衡时，_e_(_p_)取零值。


    MM 基本思想如下。


    +   1）当轮到 MAX 走步时，MAX 应考虑最好的情况（_e_(_p_)取极大值）。


    +   2）当轮到 MIN 走步时，MIN 应考虑最坏的情况（_e_(_p_)取极小值）。


    +   3）评价往回倒推时，相当于两位棋手的对抗策略，交替使用 1）和 2）两种方法传递倒推值，直至求出初始节点的倒推值为止。


    由于我方站在 MAX 立场上，因此应选择具有最大倒推值的走步。这一过程称为极大极小过程。


    【例 3.5】图 3.24 是向前看两步共 4 层的博弈树，用■表示 MAX，用●表示 MIN，端节点旁的数字表示其对应的估价函数的值，在 MIN 处用圆弧连接。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_93_0.png)


    图 3.24 4 层博弈树


    图 3.24 中，节点处的数字在端节点是估价函数的值，称为静态值，在 MIN 处取最小值，在 MAX 处取最大值，最后 MAX 选择箭头方向的走步。


    【例 3.6】一字棋游戏。设有一个 3 行 3 列的棋盘，如图 3.25 所示，两个棋手轮流走步，每个棋手走步时往空格上摆一个自己的棋子，谁先使自己的棋子成三子一线为赢。设
    MAX 方的棋子用×标记，MIN 方的棋子用●标记，并规定 MAX 方先走步。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_93_1.png)


    图 3.25 一字棋棋盘


    解 为了不致生成太大的博弈树，假设每次仅扩展两层。估价函数定义如下：设棋局为 _p_，估价函数为 _e_(_p_)。


    +   1）若 _p_ 是 MAX 必胜的棋局，则 _e_(_p_)=+∞。


    +   2）若 _p_ 是 MIN 必胜的棋局，则 _e_(_p_)=-∞。'
