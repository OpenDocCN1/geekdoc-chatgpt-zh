  md: 'IGA 是由遗传算法和免疫系统结合产生的，具有两者的优点，既继承了遗传算法的健壮性、自适应性和并行计算性，又有免疫算法的记忆性、学习性和自体-非自体识别性，在工程和研究领域有更深远的应用。


    # ## 4. 免疫算法的应用


    20 世纪 90 年代后，随着免疫模型的建立，以及研究人员对免疫学原理了解的深入，免疫算法不再是一个单纯的理论模型，它以独特的学习性、记忆性和自体-非自体识别性等多种出色的性能，在工程应用领域发挥着日益重要的作用。


    # ### (1) 识别和分类应用


    早期的免疫系统模型是为了识别计算机病毒而设计出来的，由于免疫系统具有强大的识别功能，因此在识别问题上免疫算法得到了广泛的运用。最早的免疫克隆算法就用于字符识别问题，另外亨特和库克于
    1996 年提出的用于模式识别的骨髓模型也备受人们关注。免疫算法在识别和分类中的计算机安全、模式识别、分类聚类等领域均有应用。


    # ### (2) 优化应用


    调度和规划是一类密切影响人们日常生活的优化问题，如会议安排、公交车路线线规划、飞机调度等。这些实际的工程实践问题本质上可以规约成函数优化问题，或者本身就要求进行参数设计与优化，克隆选择算法（clone
    selection algorithm, CSA）、免疫遗传算法等免疫算法已经在众多的调度与规划问题上取得了非常成功的应用。


    # ### (3) 其他方面的应用


    免疫算法的应用领域非常广泛，目前已经在机器学习与训练、数据挖掘与分类等各个方面都取得了成功的应用。随着研究者对算法本身不断地改进和完善及对算法应用领域的不断探索，免疫算法将会在更多的实践领域中发挥重要的作用。


    # ## 6.2.4 分布估计算法


    # ### 1. 分布估计的来源


    分布估计算法（estimation of distribution algorithms, EDA）最先由穆伦宾（Muhlenbein）于 1994 年提出，该算法也称为基于概率模型的遗传算法。


    20 世纪 80 年代末，遗传算法在许多领域的应用都取得了空前的成功，但是人们对它的理论研究还相对薄弱，这限制了遗传算法的进一步推广。为了从理论上分析遗传算法的机理和收敛性，著名的模式定理和“积木块假设”被提出。按照“积木块假设”的观点，遗传算法的演化过程是对种群染色体中的大量“积木块”进行选择和重组操作，通过组合出更多好的“积木块”来逐步搜索出全局最优解的过程。实践证明，遗传算法在求解“积木块”紧密相连的问题时表现出了很好的性能，但是在求解“积木块”松散分布的问题时性能却很差。这是因为算法中的交叉操作经常会破坏“积木块”，从而导致算法趋于局部收敛或者早熟。


    为了解决遗传算法中“积木块”被破坏的问题，学者们提出了许多改进方案。这些方案可以分为两大类别：一类是通过学习解的结构，发现“积木块”并避免“积木块”的破坏，这类改进的遗传算法称为连链学习遗传算法（linkage
    learning genetic algorithm）；另一类则以一种带有“全局操控”性的操作模式，替换遗传算法中对“积木块”具有破坏作用'
  merge: -1
  img_proc: true
- pgno: 196
  md: '的遗传算子，即 EDA。与遗传算法的算法结构相比，EDA 没有交叉算子和变异算子，取而代之的是建立概率模型和采样两大操作。


    # 2. EDA 的流程


    EDA 是一种基于种群的随机优化算法，它首先需要生成一个初始种群，然后通过建立概率模型和采样等操作使种群得到不断的进化，直到达到结束条件。其中，建立概率模型和采样是
    EDA 的核心步骤，也是 EDA 与 GA 的最大不同之处。由于 EDA 没有“交叉”和“变异”操作，因此通常不用基因描述个体所包含的信息，取而代之的是用变量（variables）描述个体包含的信息。EDA
    通过分析较优群体所包含的变量，构建符合这些变量分布的概率模型，并基于该概率模型再产生新的种群。因为概率模型是由种群中优势群体建立起来的，所以基于该模型产生的新种群在整体质量上将优于原来的种群。由此推断，种群的整体质量经过多次迭代后将不断得到提高。EDA
    就是按照这种形式将当前最优解一步一步地逼近全局最优解的。


    EDA 的流程如图 6.14 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_196_0.png)


    图 6.14 EDA 的流程


    第 1 步，随机生成一个数量为 N 的初始种群，并评估此种群中所有个体的适应度。


    第 2 步，按照适应度递减的顺序对种群进行排序，选出适应度较高的 K 个个体。


    第 3 步，分析所选个体的信息，估计其联合概率分布：


    ```

    $p(x) = p(x|D^K) = \prod_{i=1}^n p(x_i)$ （6.15）

    ```


    式中，$p(x_i)$ 为每维变量的边缘分布概率；$n$ 为解的维数。


    第 4 步，从构建的概率模型 $p(x)$ 中采样，得到 $N$ 个新样本，构成新种群。此时，若达到算法终止条件则结束，否则执行第 2 步。


    # 3. EDA 的改进


    近年来，分布估计算法已经有了许多形式的改进，从变量无关的 EDA 到变量相关的 EDA、从单一的 EDA 到混合利用多种其他算法、从求解离散问题的 EDA
    到求解连续问题的 EDA，EDA 的机理及其收敛性的研究也逐渐开展了起来。


