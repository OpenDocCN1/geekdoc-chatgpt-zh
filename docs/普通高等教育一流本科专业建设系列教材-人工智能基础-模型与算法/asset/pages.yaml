    # 7.5.4 Hopfield 神经网络的应用


    Hopfield 神经网络的许多应用都是利用 Hopfield 神经网络能够收敛到一个稳定状态这一特性实现的。例如，利用 Hopfield 神经网络的稳定状态能够实现联想记忆、优化等应用。下面简单介绍基于
    Hopfield 神经网络的联想记忆与优化方法。


    如果将网络的一个稳态作为一个记忆样本，那么以后当给该网络一个适当的激励时，网络能够收敛到和输入模式最为相似的样本模式。初态期稳态的收敛过程便是寻找记忆样本的过程。初态可以认为是给定样本的部分信息，网络改变的过程可以认为是从部分信息找到全部信息，从而实现联想记忆的功能。


    Hopfield 神经网络联想记忆过程，就是非线性动力学系统朝某个稳定状态运行的过程。这就需要调整连接权值，使得所要记忆的样本作为 Hopfield 神经网络的能量局部极小点。Hopfield
    神经网络联想记忆过程分为学习和联想两个阶段。在给定样本的条件下，调整连接权值，使存储样本成为 Hopfield 神经网络的稳定状态，这就是学习阶段。联想是指在已经调整好权值的情况下，给出部分不全或者受了干扰的信息，按照动力学规则改变神经元的状态，使神经网络最终达到某个稳定状态。


    实现 Hopfield 神经网络联想记忆的关键是网络到达记忆样本能量函数极小点时，确定网络的神经元之间的连接权值 \(w_{ij}\) 和阈值 \(\theta_i\)
    等参数。下面介绍按照赫布学习规则设计 Hopfield 神经网络的连接权值。


    设给定 \(m\) 个样本 \(x^{(k)} (k=1, 2, \cdots, m)\)，\(x_i^{(k)}\) 表示第 \(k\) 个样本中的第 \(i\)
    个元素。记 \(w_{ij}\) 是神经元 \(i\) 到神经元 \(j\) 的权值。'
