  md: '5）在求解问题时，可以较快地得到一个近似解。

    但是，联结主义并不适合解决逻辑思维问题，而且结构固定和组成方案单一的系统也不适合多种知识的开发。


    # 3. 行为主义


    行为主义，又称为进化主义（evolutionism）或控制论学派（cybern-eticism），是基于控制论和“动作-感知”控制系统的人工智能学派。行为主义认为，人的本质能力是在动态环境中的行走能力、对外界事物的感知能力、维持生命和繁衍生息的能力，正是这些能力为智能的发展提供了基础。因此，智能行为只能在与环境的交互中表现出来。行为主义认为，机器是由蛋白质构成还是由各种半导体器件构成无关紧要，智能行为是由“亚符号处理”（即“信号处理”）而不是由“符号处理”产生的。例如，识别熟悉的人的面孔对人来说易如反掌，但是对机器来说很困难。最好的解释是，人类把图像或图像的各部分作为多维信号而不是符号来处理，因而不需要知识表示和知识推理。


    行为主义最早来源于 20 世纪初的一个心理学流派，认为行为是有机体为适应环境变化的各种身体反应的组合，其理论目标在于预见和控制行为。行为主义的代表性成果是布鲁克斯研制的机器虫。在
    1991 年和 1992 年，布鲁克斯提出了不需要知识表示的智能和不需要推理的智能。他认为，智能体在与环境的交互中不应采用集中模式，而需要具有不同的行为模块与环境进行交互，以此产生复杂的行为。他认为，任何一种表达方式都不能完善地代表客观世界中的真实概念，因而用符号串表示智能过程是不妥的。以这些观点为基础，布鲁克斯研制出了一种机器虫，用一些相对独立的功能单元，组成分层异步分布式网络，分别实现避让、前进、平衡等基本功能，取得了一定的成功，特别是为机器人的研究开创了一种新的方法。但是，行为主义的研究方法同样受到其他学派的怀疑和批判，他们认为行为主义最多只能创造出智能昆虫行为，而无法创造出人的智能行为。


    行为主义人工智能认为智能行为产生于主体与环境的交互过程中，复杂的行为可以通过分解成若干简单的行为加以研究。主体根据环境刺激产生相应的反应，同时通过特定的反应来陈述引起这种反应的情景或刺激，因此能以这种快速反馈替代传统人工智能中精确的数学模型，从而达到适应复杂、不确定和非结构化的客观环境的目的。


    目前，行为主义人工智能的研究已经迅速发展起来，并取得了许多令人瞩目的成果，它所采用的在结构上动作分解方法、分布并行的处理方法及由底至上的求解方法已成为人工智能领域中新的研究热点。


    行为主义的主要特征如下。


    +   1）智能取决于感知和行动，应直接利用机器对环境作用，以环境对作用的响应为原型。


    +   2）智能行为只能在现实世界中，通过与周围环境交互而表现出来。


    +   3）人工智能可以像人类智能一样逐步进化，分阶段发展并增强。


    目前，符号处理系统和神经网络模型的结合是一个重要的研究方向。例如，模糊神经网络系统是将模糊逻辑、神经网络等结合在一起，在理论、方法和应用上发挥各自的优势，设计出的具有一定学习能力、动态获取知识能力的系统。


    上述 3 种研究方法从不同侧面研究了人的自然智能，与人脑的思维模型有着对应的关系。原则上，可以认为符号主义研究抽象思维，联结主义研究形象思维，而行为主义研究'
