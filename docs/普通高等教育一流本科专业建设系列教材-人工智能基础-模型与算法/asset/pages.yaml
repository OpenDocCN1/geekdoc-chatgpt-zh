  md: '仿真主义可以说是符号主义（symbolism）、联结主义（connectionism）、行为主义（actionism）和统计主义（statisticism）之后的第
    5 个流派，其与前 4 个流派有着千丝万缕的联系，也是前 4 个流派通向强人工智能的关键一环。经典计算机是数理逻辑的开关电路实现，采用冯·诺依曼体系结构，可以作为逻辑推理等专用智能的实现载体。但要靠经典计算机不可能实现强人工智能。要按仿真主义的路线“仿脑”，就必须设计制造出全新的软硬件系统，这就是“类脑计算机”，或者更准确地称之为“仿脑机”。“仿脑机”是“仿真工程”的标志性成果，也是“仿真工程”通向强人工智能之路的重要里程碑。


    # 2. 人工智能的特征


    人工智能的特征如下。


    +   1）人工智能由人类设计，为人类服务，本质为计算，基础为数据。从根本上说，人工智能系统必须以人为本，这些系统是人类设计出的机器，按照人类设定的程序逻辑或软件算法，通过人类发明的芯片等硬件载体来运行或推理。人工智能的本质体现为计算，通过对数据的采集、加工、处理、分析和挖掘有价值的信息流和知识模型，提供延伸人类能力的服务，实现对人类期望的一些“智能行为”的模拟，在理想情况下必须体现服务人类的特点，而不应该伤害人类，特别是不应该有目的性地做出伤害人类的行为。


    +   2）人工智能能感知环境，能产生反应，能与人交互，能与人互补。人工智能系统应能够借助传感器等器件对外界环境（包括人类）产生感知，可以像人一样通过听觉、视觉、嗅觉、触觉等接收来自环境的各种信息，对外界输入产生文字、语音、表情、动作（控制执行机构）等反应，甚至影响到环境或人类。借助于按钮、键盘、鼠标、屏幕、手势、体态、表情、力反馈、虚拟现实/增强现实等方式，人与机器可以互动，使机器设备越来越“理解”人类乃至与人类共同协作、优势互补。这样，人工智能系统能够帮助人类做人类不擅长、不喜欢但机器能够完成的工作，人类则去做更需要创造性、洞察力、想象力、灵活性、多变性乃至用心领悟或感情支持性的工作。


    +   3）人工智能有适应特性，有学习能力，有演化迭代，有连接扩展。人工智能系统在理想情况下应具有一定的自适应特性和学习能力，即具有一定环境、数据或任务变化而自适应调节参数或更新优化模型的能力；另外，能够在此基础上通过与云、端、人、物越来越广泛、深入的数字化连接扩展，实现机器客体乃至人类主体的演化迭代，以使系统具有适应性、稳健性、灵活性、扩展性，从而应对不断变化的现实环境，并使人工智能系统在各行各业产生丰富的应用。


    +   4）人工智能是从聚焦个体智能到基于互联网和大数据的群体智能，可以把很多人的智能集聚融合起来变成群体智能。群体智能中的控制是分布式的，不存在中心控制，因而它更能适应当前网络环境下的工作状态，并且具有较强的鲁棒性，不会由于某一个或某几个个体出现故障而影响群体对整个问题的求解。群体智能中的每个个体都能够改变环境，这是个体之间间接通信的一种方式，这种方式称为激发机制。由于群体智能可以通过非直接通信的方法进行信息的传输与合作，因此随着个体数目的增加，通信开销的增幅较小，具有较好的可扩充性。群体中每个个体的能力或遵循的行为规则非常简单，因而群体智能的实现比较方便，具有简单性的特点。群体表现出来的复杂行为是通过简单个体的交互过程实现出来的智能——涌现智能（emergent
    intelligence）。因此，群体具有自组织性。群集智能可以在适当的进化机制引导下，通过个体交互以某种突现形式发挥作用。这是个体及'
