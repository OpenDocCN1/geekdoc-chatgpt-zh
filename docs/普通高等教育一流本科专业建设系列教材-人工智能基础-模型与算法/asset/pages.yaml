    # (2) AO*算法的可采纳性


    AO*算法的应用要求遵从以下约束：总能满足 \( h(n) \leq h^*(n) \)，且确保 \( h(n) \) 满足单调限制条件。只有遵从该约束，AO*算法才是可采纳的，即当某与/或图存在解图时，应用
    AO*算法一定能找出代价最小的解图。


    类似算法 A*，\( h^*(n) \) 是实际的代价最小解图找到时解图的代价，通常只能设计接近于 \( h^*(n) \) 的 \( h(n) \)。单调限制条件表示为


    ```

    \( h(n) \leq K + h(n_1) + h(n_2) + \cdots + h(n_k) \leq h^*(n) \) (3.26)

    ```


    式中，\( n_1, n_2, \cdots, n_k \) 是节点 \( n \) 通过 \( K \)-连接指向的子节点。


    若将 \( h(n) \) 的值视为粗略的估计，而 \( K + h(n_1) + h(n_2) + \cdots + h(n_k) \) 的值视为细致的计算，则单调限制可理解为粗略的估计总是不超过细致的计算。


    # (3) 搜索算法 AO* 与 A* 的比较


    +   1) AO*算法应用于与/或图搜索，且搜索的是解图；而 A*算法应用于一般图（或图）搜索，且搜索的是解容路径。


    +   2) AO*算法选择估算代价最小的局部解图加以优先扩展，而 A*算法选择估算代价最小的路径加以优先扩展。


    +   3) AO*算法不需要考虑评价函数 \( f(n) \) 的分量 \( g(n) \)，只需对新扩展出的节点 \( n \) 计算 \( h(n)
    \)，以用于修正 \( f(n_0) \)；而 A*算法需同时计算分量 \( g(n) \) 和 \( h(n) \)，以评价节点 \( n \) 是否在代价最小的路径上。


    +   4) AO*算法应用中的 LGS 存放候选的待扩展局部解图，并依据 \( f(n_0) \) 值排序；而 A*算法应用中的 OPEN 表和 CLOSE
    表分别存放待扩展节点和已扩展节点，并依据 \( f(n) \) 值排序。


    # (4) 解图代价的重复计算


    解图中某些子节点可能有多个父节点，或者说多个节点的外向连接符可能指向同一个子节点。依据前述解图代价的递归计算方式，显然这种子节点到终节点集合解图的代价在计算自根节点
    \( n_0 \) 出发的解图时被重复计算了。为了正确计算解图的代价，必须删除重复的累计。例如，图 3.21 中的解图节点 \( n_{10} \) 和 \(
    n_{11} \)，到终节点 \( n_6 \) 和 \( n_{17} \) 的解图代价被分别重复计'
