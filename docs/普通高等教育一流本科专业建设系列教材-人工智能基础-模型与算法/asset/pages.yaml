    # 2.5.3 脚本的推理


    脚本所描述的事件是发生在某个特定范围内的一件事情，就像电影剧本一样，一幕一幕地表示所发生的一系列事件（序列），是一个因果链。链头是一组开场条件，只有当这些开场条件满足时，该脚本中的事件才能开始；链尾是一组结果，只有当这一组结果满足时，该脚本中的事件才能结束，以后的事件或事件序列才能发生。在该因果链中，一个事件和其前后事件之间是相互联系的，前面的事件可使当前事件产生，当前事件又可能使后面的事件产生。一个脚本建立之后，如果已知该脚本适合于所给定的事件，则对一些在脚本中没有明显提出的事件，可以通过脚本进行预测；对那些在脚本中已明显提到的事件，可通过脚本给出它们之间的联系。


    一个脚本在使用之前必须预先将其激活，根据脚本的重要性，激活脚本的方法有以下两种。


    +   1) 对于不属于事件核心部分的脚本，只需要设置指向该脚本的指针即可，以便当它成为核心时能够启用。例如，对于前面讨论过的餐厅脚本，有以下事件：“何雨在去展览会的路上经过他喜欢的饭馆。他非常喜欢这次网络信息展览会。”那么应该采用这种方法，设置指向餐厅脚本的指针。


    +   2) 对于符合核心事件的脚本，则应使用在当前事件中涉及的具体对象和人物去填写脚本槽。脚本的前提、道具、角色和事件等常能起到激活脚本的指示器的作用。一旦脚本被激活，则可以用它来进行推理。其中，最重要的是利用脚本可以预测没有明确提及的事件的发生。


    例如，对于以下情节：“昨晚，何雨到了餐厅，他订了鱼香肉丝、米饭。当他要付款时发现没钱了。因为开始下雨了，所以他赶快回家了。”如果有人问：“昨晚，何雨吃饭了吗？”虽然在上面没有提到何雨吃没吃饭的问题，但借助餐厅脚本，可以回答：“他吃了。”这是因为启用了餐厅脚本，情节中的所有事件与脚本中所预测的事件序列相对应，可以推出整个事件正常进行时所得出的结果。


    但是，一旦一个典型的事件被中断，即给定情节中的某个事件与脚本中的事件不能对应，脚本便不能预测被中断以后的事件。例如，对于以下情节：“何雨走进餐厅，他被带到餐桌旁，订了一大盘鱼香肉丝和米饭之后，他坐在那里等了许久。于是，他生气地走了。”在该情节中，因为久等，所以何雨走了。这一事件改变了餐厅脚本中所预测的事件序列，'
