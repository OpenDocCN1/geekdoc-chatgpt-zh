    5) 人工智能是指从拟人化的机器人转向更加广阔的智能自主系统，如智能工厂、智能无人机系统等。自主系统是指可应对非程序化或非预设态势，具有一定自我管理和自我引导能力的系统。相比自动化设备与系统，自主性设备和自主系统能够应对更多样的环境，完成更复杂的操作和控制，具有更广阔的应用潜力。一般来说，自主化是指应用传感器和复杂软件，使设备或系统在较长时间内无须通信或只需有限通信，无须其他外部干预就能独立完成任务，能够在未知环境中自动进行系统调节，保持性能优良的过程。自主化可以被看作自动化的外延，是智能化和更高能力的自动化。


    # 1.2 人工智能的发展历史


    自从人类发明了第一台计算机以来，人工智能开始有了实质性发展，至今已超过半个世纪，其发展历程大致可以分为初创时期、形成时期、发展时期和大突破时期 4 个历史阶段。本节即介绍这
    4 段发展历程，以及每一个时期重要的理论及遭遇的困难。此外，本节还对中国的人工智能发展做了重点介绍。


    # 1. 第一阶段：初创时期（1936～1956 年）


    一般认为，人工智能始于 20 世纪 30～50 年代，如图 1.1 所示，这个时期有几项与人工智能相关的重要成果相继产生。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_11_0.png)


    图 1.1 初创时期人工智能发展历程


    1) 通用图灵机（universal Turing machine）。通用图灵机由图灵在 1936 年发明，是一种理论上的计算机模型。通用图灵机被设想成有一条无限长的纸带，纸带被划分成许多方格，有的方格中被画上斜线，代表
    1；有的方格中没有画任何线条，代表 0。它有一个读写头部件，可以从纸带上读出信息，也可以向空方格里写信息。该原型计算机仅有的功能是把纸带向右移动一格，并把
    1 变成 0；或者相反地，把 0 变成 1。通用图灵机是一种不考虑硬件状态的计算逻辑结构，是现代计算机的思想原型。


    2) 早期的计算机技术。1937～1941 年，美国爱荷华州立大学的约翰·文森特·阿塔纳索夫（John Vincent Atanasoff）教授和他的研究生克里夫·贝瑞（Cliff
    Berry）开发了阿塔纳索夫-贝瑞计算机（Atanasoff-Berry computer，ABC），为计算机科学和人工智能的研究奠定了基础。现代可编程数字电子计算机架构是由美国数学家、计算机科学家、物理学家约翰·冯·诺依曼（John
    von Neumann）提出的，它是受到通用图灵计算机思想的启'
