  md: '若 \( A_1, A_2, \cdots, A_n \) 是彼此独立的事件，对于事件 \( B \)，有


    \( P(A_i|B) = \frac{P(A)P(B|A)}{\sum_{j=1}^n P(A_j)P(B|A_j)}, \ i=1,2,\cdots,n
    \) (5.7)


    式中，\( P(A_i) \) 为事件 \( A_i \) 的先验概率；\( P(B|A_i) \) 为在事件 \( A_i \) 发生条件下事件 \( B
    \) 的条件概率。

    这是我们熟知的贝叶斯定理。


    对于一组产生式规则：


    IF \( E \) THEN \( H_i \)


    式中，\( H_i \) 为确定性程度，或规则的静态强度，同样有后验概率：


    \( P(H_i|E) = \frac{P(H_i)P(E|H_i)}{\sum_{j=1}^n P(H_j)P(E|H_j)}, \ i=1,2,\cdots,n
    \) (5.8)


    对于多个论据，后验概率为


    \( P(H_i|E_1, E_2, \cdots, E_m) = \frac{P(H_i)P(E_1|H_i)P(E_2|H_i)\cdots P(E_m|H_i)}{\sum_{j=1}^n
    P(H_j)P(E_1|H_j)P(E_2|H_j)\cdots P(E_m|H_j)}, \ i=1,2,\cdots,n \)


    (5.9)


    下面通过一个例子来说明逆概率方法的应用。只要知道 \( H_i \) 的先验条件 \( P(H_i) \) 和 \( H_i \) 成立时证据 \( E_1,
    E_2, \cdots, E_m \) 出现的条件概率，就可利用式（5.9）计算出在 \( E_1, E_2, \cdots, E_m \) 出现的情况下，\(
    H_i \) 的条件概率 \( P(H_i|E_1, E_2, \cdots, E_m) \)。


    【例 5.1】设 \( H_1, H_2, H_3 \) 分别是 3 个结论，\( E \) 是支持这些结论的证据。已知：


    \( P(H_1) = 0.3, \ P(H_2) = 0.4, \ P(H_3) = 0.5, \ \ P(E|H_1) = 0.5, \ P(E|H_2)
    = 0.3, \ P(E|H_3) = 0.4 \)


    求 \( P(H_1|E) \)、\( P(H_2|E) \) 及 \( P(H_3|E) \) 的值各是多少？


    解


    \( P(H_1|E) = \frac{P(H_1)P(E|H_1)}{P(H_1)P(E|H_1) + P(H_2)P(E|H_2) + P(H_3)P(E|H_3)}
    \)


    \( = \frac{0.15}{0.15 + 0.12 + 0.2} \)


    \( = 0.32 \)


    同理可得 \( P(H_2|E) = 0.26, \ P(H_3|E) = 0.43 \)，解毕。


    在上述例子中，对应的产生式规则为


    IF \( E \) THEN \( H_1 \)

    IF \( E \) THEN \( H_2 \)

    IF \( E \) THEN \( H_3 \)


    规则的静态强度为


    \( P(H_1|E) = 0.32 \)

    \( P(H_2|E) = 0.26 \)

    \( P(H_3|E) = 0.43 \)


    逆概率方法有较强的理论背景和良好的数学特性，当证据和结论彼此独立时，其计算的复杂度较低。但它要求给出结论 \( H_i \) 的先验概率 \( P(H_i)
    \) 及条件概率 \( P(E|H_i) \)，尽管逆概率相'
