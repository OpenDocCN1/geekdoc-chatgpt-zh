    # 2.4.2 常用的槽名


    用于表示对象间关系常用的槽名有 ISA（is A，是）槽、AKO（a kind of，属于）槽、Instance 槽和 Part-of 槽。


    ISA 槽用于指出对象间抽象概念上的类属关系，直观意义是“是一个”“是一种”“是一只”等。一般用 ISA 槽指出的联系具有继承性，即下位框架可继承上位框架所描述的属性及值。


    AKO 槽用于具体地指出对象间的类属关系，其直观意义是“是一种”。当用它作为某下位框架的槽时，就明确地指出了该下位框架所描述的事物是其上位框架所描述事物中的一种，下位框架可继承上位框架中的属性及值。


    Instance 槽用来表示 AKO 槽的逆关系。用 Instance 槽指出的联系都具有继承性，即下'
