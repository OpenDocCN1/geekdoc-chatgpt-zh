    量词是谓词逻辑中最重要的研究对象，谓词逻辑也因此称为量词逻辑。量词是表示被其约束的对象的数量的逻辑符号。依据它所指的是某对象类中的所有对象还是至少一个对象，量词可分为全称量词和存在量词。全称量词用
    ∀ 表示，自然语言中的“所有”“凡”“任一个”“每一个”“一切”等都表示全称量词，其准确含义是“对任一……来说”；存在量词用 ∃ 表示，自然语言中的“有些”“有的”“至少有些”等表示的都是存在量词，其准确含义是“至少存在一个……”。根据量词所约束的对象是个体词还是谓词，可以把量词分为一阶量词、二阶量词和高阶量词。一阶量词是只约束个体词的量词，即这种量词所限制的只是个体对象。一阶谓词逻辑只研究一阶量词。二阶量词所约束的是一阶谓词，三阶量词所约束的是二阶谓词，依此类推，它们都是高阶谓词逻辑的研究对象。


    # 4.2.3 自然演绎推理方法


    从一组已知为真的事实出发，运用经典逻辑中的推理规则推出结论的过程称为自然演绎推理，其推理规则包括 P 规则、T 规则、假言推理、拒取式和假言三段论。


    P 规则是指在推理的任何步骤中都可引入前提，继续进行推理。


    T 规则是指推理时，如果前面步骤中有一个或多个公式永真蕴涵公式 S，则可以把 S 引入推理过程中。


    假言推理是指由 P → Q 及 P 为真，可以推出 Q 为真，其一般形式为


    ```

    P,P→Q⇒Q (4.1)

    ```


    例如，由“如果今天下雨，那么今天要带伞”和“今天下雨”可以推导出“今天要带伞”的结论。


    拒取式表示由 P → Q 为真及 Q 为假，可以推出 P 为假，其一般形式为'
