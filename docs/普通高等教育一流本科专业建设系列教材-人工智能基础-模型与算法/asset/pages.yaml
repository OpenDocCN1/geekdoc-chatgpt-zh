    # 本章小结


    本章主要介绍了人工神经元模型、BP 神经网络和 Hopfield 神经网络的结构和学习算法。人工神经网络模型主要考虑网络连接的拓扑结构、神经元的特征、学习规则等。根据连接的拓扑结构，神经网络模型可以分为前馈网络和反馈网络。网络中各神经元接收前一级的输入，输出到下一级，网络内神经元之间没有反馈，则为前馈网络，如感知器、BP
    神经网络；网络内神经元之间有反馈，可以用一个无向的完备图表示，Hopfield 神经网络玻耳兹曼机属于这种类型。实际应用较多的是 BP 神经网络和 Hopfield
    神经网络。


    BP 神经网络的学习过程由信息的正向传播和误差的反向传播两个过程组成。输入层的各神经元负责接收来自外界的输入信息，并传递给中间层各神经元；中间层是内部信息处理层，负责信息变换；输出层向外界输出信息处理结果。当实际输出与期望输出不符时，进入误差的反向传播阶段。误差通过输出层，按梯度下降方式修正各层权值，向隐藏层、输入层逐层反传。周而复始的信息正向传播和误差反向传播过程，是各层权值不断调整的过程，也是
    BP 神经网络学习训练的过程，此过程一直进行到网络输出的误差减小到可以接受的程度或者预先设定的学习次数为止。


    Hopfield 神经网络是一种典型的反馈型神经网络模型，分为离散型和连续型两种。本章主要讨论了离散型 Hopfield 神经网络的结构和学习算法。当前，Hopfield
    神经网络广泛地应用于优化计算和联想记忆中，取得了很好的效果。


    人工神经网络是对大脑系统的简化、抽象和模拟，是由大量的简单处理单元经互连形成的一种网络系统，当前研究的主要是神经网络模型的结构、权值的调整和学习训练算法等。人们试图通过对它的研究最终揭开人脑的奥秘，使计算机能够像人脑那样进行高效的信息处理。


