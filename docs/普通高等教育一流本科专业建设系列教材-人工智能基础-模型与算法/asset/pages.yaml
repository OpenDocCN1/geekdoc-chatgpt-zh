  md: '# 内容简介


    理论和实践的紧密结合是人工智能领域的显著特点。为了降低初学者的学习门槛，引导初学者了解人工智能的基本概念，以实际应用促进感性认知，作者编写了本书。本书旨在打造一体体系完整、算法突出和教学资源丰富的人工智能教材，可帮助读者掌握人工智能知识的脉络体系，从算法和模型等方面了解人工智能具能、使能和赋能的原理。全书共
    8 章，书中附有习题和编程题目。


    本书紧跟人工智能技术动态，选取了人工智能中的典型应用案例，兼顾通识与技能，具有很强的可操作性和实用性。本书既可作为人工智能专业和计算机类相关专业本科生的基础导论课程教材，也可作为其他学科研究人员学习人工智能技术的参考用书。


