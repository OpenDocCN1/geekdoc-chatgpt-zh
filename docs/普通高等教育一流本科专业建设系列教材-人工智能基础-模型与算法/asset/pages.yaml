  md: '这次会议并没有解决有关人工智能及机器思维的任何具体问题，但它为后来人工智能的发展确立了研究目标，开启了人工智能发展的历史，至今仍有深远的影响。


    人工智能诞生之后的几十年，其发展大致有两条主线：一是从结构的角度模拟人类的智能，即利用人工神经网络模拟人脑神经网络以实现人工智能，由此发展形成了联结主义；二是从功能的角度模拟人类的智能，将智能看作大脑对各种符号进行处理的功能，由此发展形成了符号主义。


    # 2. 第二阶段：形成时期（1957~1969 年）


    符号主义的最初工作由西蒙和纽厄尔于 20 世纪 50 年代开始推动。在这一时期，研究者发展了众多原理和理论（“人工智能”概念也随之得以扩展），相继取得了一批显著的成果，如机器定理证明、跳棋程序、通用问题求解程序、表处理语言等。


    在十余年的时间里，早期的数字计算机被广泛应用于数学和自然语言领域，用于解决代数、几何和翻译问题。计算机的广泛使用让研究人员坚定了机器能够向人类智能趋近的信心。这一时期是人工智能发展的第一个高峰时期，研究人员表现出了极大的乐观态度，甚至预测当时之后的
    20 年内人们将会建成一台可完全模拟人类智能的机器。


    这一时期也奠定了人工智能符号主义学派的基础。该学派的核心思想为，智能或认知就是对有意义的表示符号进行推导计算，也是一种对人类认知的初级模拟形式。符号就是人类借以表达客观世界的模式。任何一个模式，只要能与其他模式相区别，就是一个符号。不同的英文字母、数学符号及汉字等都是不同的符号。


    1958 年，美国康奈尔大学的心理学家和计算机学家弗兰克·罗森布拉特（Frank Rosenblatt）继承控制论的联结主义方法之后，提出了“感知器（perceptron）”（也可以翻译为感知机）的概念，这在当时引发了一股研究热潮。后来，符号主义权威明斯基和西蒙通过对一种早期的人工神经网络模型——单层感知器进行分析，证明了当时的感知器模型不能实现异或操作，即不能解决非线性可分问题（一种数据分类问题），由此推断人工神经网络是没有未来的。


    20 世纪 60 年代，其他一些非主流的人工智能技术悄然而生。德国专家英戈·罗森伯格（Ingo Rechenberg）和汉斯·保罗·施韦费尔（Hans Paul
    Schwefel）出于实际工程设计问题的需要，提出了基于达尔文进化论的进化策略，这是一种纯粹的数值优化算法，用以解决工程优化问题。这一行为实际上开启了基于进化论思想的进化计算领域研究的先河。


    1965 年，来自美国加州大学伯克利分校的洛蒂夫·扎德（Lotif Zadeh）教授发表了著名的《模糊集》论文，奠定了模糊数学理论和模糊逻辑基础。到 20
    世纪 80 年代，研究人员基于该理论构建了成百上千个智能系统，它们被广泛应用于工业生产、家用电器、机器人等领域。


    总之，在 20 世纪 60 年代，为了模拟复杂的思考过程，早期的研究人员主要试图通过研究通用的方法来解决广泛的问题。这一阶段，许多伟大的科学家针对人工智能各个方面提出了创新性的基础理论，如在知识表达、学习算法、人工神经网络等诸多方面都有新的理论出现。但是，由于早期的计算机性能有限，很多理论并未得以实现，但它们却为几十年后人工智能的实际应用指明了方向。这一时期的主要特点是符号主义学派超越了联结主义学派，主导了人工智能领域的研究（直到
    20 世纪 90 年代中期）。'
