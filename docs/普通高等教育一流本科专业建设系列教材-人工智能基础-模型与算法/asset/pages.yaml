  md: '模拟退火算法由美国物理学家尼古拉斯·梅特罗波利斯（Nicholas Metropolis）等于 1953 年提出。1983 年，柯克帕特里克（Kirkpatrick）等成功将退火思想引入组合优化领域。模拟退火算法是一种基于概率的算法，原理是将固体加温至充分高，再让其徐徐冷却。加温时，固体内部粒子随温升为无序状，内能增大；而徐徐冷却时，粒子渐趋有序，在每个温度都达到平衡态，最后在常温时达到基态，内能减为最小。模拟退火算法可有效避免陷入局部极小的情况，该算法是最终趋于全局最优的算法。


    禁忌搜索是格洛弗于 1986 年提出的一种全局搜索算法。禁忌搜索也是模拟人类智能的一种优化算法，它模仿了人类的记忆功能，在求解问题的过程中采用了禁忌技术，对已经搜索过的局部最优解进行标记，并且在迭代中尽量避免重复相同的搜索，从而获得更广的搜索区间，有利于寻找到全局最优解。


    1990 年至今是计算智能的继续发展阶段，遗传算法、进化策略和进化规划算法也在不断地发展和完善。1992 年，多里戈（Dorigo）等提出了蚁群算法（ant
    colony optimization, ACO），为解决离散组合优化问题提供了重要的工具。1995 年，由埃伯哈特（Eberhart）和肯尼迪（Kennedy）提出的粒子群优化算法（particle
    swarm optimization, PSO）在连续优化问题上得到了广泛的应用。


    蚁群优化算法由多里戈等于 1991 年在第一届欧洲人工生命会议（European Conference on Artificial Intelligence,
    ECAL）上提出，是模拟自然界真实蚂蚁觅食过程的一种随机搜索算法。蚁群算法与遗传算法、粒子群优化算法、免疫算法等同属于仿生优化算法，具有鲁棒性强、全局搜索、并行分布式计算、易与其他方法结合等优点，在典型组合优化问题，如旅行商问题（traveling
    salesman problem, TSP）、车辆路径问题（vehicle routing problem, VRP）、车间作业调度问题（job-shop
    scheduling problem, JSP）和动态组合规划问题中均得到了成功的应用。


    现阶段计算智能的发展面临着严峻挑战，其中一个重要原因是计算智能目前缺乏扎实的数学基础，无法像物理、化学、天文学等学科一样使用数学工具来验证自己的计算。众多计算智能算法亟待数学方法去验证其有效性和效率。


    # 6.1.2 计算智能的特征与应用


    计算智能算法通常可以在工程所接受的时间范围内找到局部或全局最优解。它采用启发式的随机搜索策略，与传统优化算法相比，对待求解问题不需要严格的数学推导，具有很好的全局搜索能力，具有普遍的适应性和求解的健壮性，此外还具有智能性、并行性等特征。


    这里的智能性是指算法不依赖于问题本身的特点，计算智能算法具有并行性、可移植性、通用性、自适应性与自组织性等特点。算法的并行性是指算法在多核、多 CPU、群体运行环境下的运行状况，计算智能算法可以通过群体协作的方式对问题进行优化求解，在大规模并行环境中尤其具有优势。计算智能算法具有良好的容错性，对初始条件不敏感，可在不同条件下寻找最优解。由于具有以上优势，计算智能算法已经在优化计算、模式识别、图像处理、目标追踪、通信网络和分子生物学等多个领域取得了成功的应用，应用领域涉及科技、国防、工商业、农业、医疗等诸多方面。'
