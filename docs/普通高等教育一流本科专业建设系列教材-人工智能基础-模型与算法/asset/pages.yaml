    | 3 | 男 | <21 | 未 | C |

    | 4 | 男 | <21 | 已 | B |

    | 5 | 女 | ≥21 且 ≤25 | 未 | A |

    | 6 | 女 | ≥21 且 ≤25 | 已 | A |

    | 7 | 男 | ≥21 且 ≤25 | 未 | C |'
