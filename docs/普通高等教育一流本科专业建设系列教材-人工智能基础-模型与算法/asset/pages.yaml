  md: '发，于 1946 年在工程上实现的。冯·诺依曼计算机奠定了现代计算机的基础，也是测试和实现各种人工智能思想和技术的重要工具。


    3）人工神经元模型。1943 年，美国心理学家沃伦·麦卡洛克（Warren McCulloch）和数理逻辑学家瓦尔特·皮茨（Walter Pitts）合作提出人类历史上第一个人工神经元模型——麦卡洛克-皮茨模型（McCulloch-Pitts
    model），这是一种模拟人脑生物神经元的数学神经元模型，简称 MP 模型。该研究表明，由非常简单的单元连接在一起组成“网络”，可以对任何逻辑和算术函数进行计算，因为网络单元像简化后的神经元。由
    MP 模型发展而来的一种重要的人工智能技术是人工神经网络（artificial neural network，ANN）。由此可见，MP 模型是人工神经网络的最初起源。人工神经网络最开始并不是叫这个名字，而是叫“联结主义”，在当时人们并没有将这个概念和人工智能联系起来，因为
    1956 年以前还不存在“人工智能”这个概念。


    4）控制论。控制论是关于具有自调整、自适应、自校正功能的机器的理论，是由美国数学家、控制论的创始人诺伯特·维纳（Norbert Wiener）于 1948
    年提出的。控制论对人工智能的影响在于它将人和机器进行了深刻的对比：由于人类能够构建更好的计算机器，并且人类更了解自己的大脑，因此计算机器和人类大脑会变得越来越相似。可以说，控制论是从机器控制的角度，在机器、人与大脑之间建立起了一种联系。控制论关于人与机器关系的思想，又启发后来的学者开发了早期的人工智能技术。


    除了上述几项重要且关键的理论和思想外，还有信息论等相关理论和思想，也对人工智能的产生有着重要影响。在当时的各种关于人、大脑、神经及它们与机器关系的思想的启发下，图灵认为人的大脑应当被看作一台离散态机器，它与计算机在本质上并没有什么不同。图灵坚信，人工智能一定能以某种方式实现。图灵和其他学者关于计算本质的思想，建立了人类的逻辑推理能力与冯·诺依曼计算机之间的联系。


    1952 年，IBM 科学家亚瑟·塞缪尔（Arthur Samuel）开发了跳棋程序。该程序能够通过观察棋子的当前位置学习一个隐含的模型，为后续走棋步骤提供更好的指导。通过该程序，塞缪尔驳倒了普罗维登斯提出的机器无法超越人类，无法像人类一样写代码和学习的模式。他创造了“机器学习”（machine
    learning，ML）这一概念，并将其定义为可以提供计算机能力而无须显式编程的研究领域。


    在上述思想的影响下，1956 年，美国学者约翰·麦卡锡（John McCarthy）、美国科学家马文·明斯基（Marvin Minsky）及 IBM 的两位资深科学家克劳德·香农（Claude
    Shannon）和尼尔·罗切斯特（Nathan Rochester）组织了一次学会，即达特茅斯会议，邀请包括美国学者、计算机科学家和心理学家赫伯特·西蒙（Herbert
    Simon）和艾伦·纽厄尔在内的多位科学家对“机器是否会产生思维”这一问题进行了长达两个月的讨论。会议中给所有人留下最深印象的是纽厄尔和西蒙的报告，他们公布了一款程序——“逻辑理论家”（logic
    theorist）。这篇文章后来成为人工智能历史上极为重要的文章之一。会议中提出了一个观点，即“学习或者智能的任何特性都能被精确地加以描述，使得机器可以对其进行模拟”。麦卡锡在此次会议中首次提出“人工智能”的概念。在
    1956 年达特茅斯会议之前，“人工智能”这个词并非广泛地被研究者所接受。麦卡锡和明斯基的建议书里列出了他们计划研究的 7 个领域：①自动计算机，所谓“自动”指的是可编程；②程序语言；③神经网络；④计算规模的理论（theory
    of size of a calculation），指的是计算复杂性；⑤自我改进，即机器学习；⑥抽象；⑦随机性和创见性。'
