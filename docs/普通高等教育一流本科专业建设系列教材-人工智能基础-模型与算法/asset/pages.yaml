  md: '于训练数据 D 来估计先验 P(c) 和似然 P(c|x)。


    类先验概率 P(c) 表达了样本空间中各类样本本所占的比例。根据大数定律，当训练集包含充足的独立同分布样本时，P(c) 可通过各类样本出现的频率来进行估计。


    对类条件概率 P(c|x) 来说，由于它涉及关于 x 所有属性的联合概率，因此直接根据样本出现的频率来估计将会遇到严重的困难。例如，假设样本的 d 个属性都是二值的，则样本空间将有
    2^d 种可能的取值。在现实应用中，该值往往远大于训练样本数 m，即很多样本取值在训练集中根本没有出现，直接使用频率来估计 P(c|x) 显然不可行，因为“未被观测到”与“出现概率为零”通常是不同的。


    # 2. 极大似然估计


    估计类条件概率的一种常用策略是先假定其具有某种确定的概率分布形式，再基于训练样本对概率分布的参数进行估计。具体地，关于类别 c 的类条件概率记为 P(x|c)，假设
    P(x|c) 具有确定的形式并且被参数向量 θc 唯一确定，则我们的任务就是利用训练集 D 估计参数 θc。明显起见，可将 P(x|c) 记为 P(x|θc)。


    事实上，概率模型的训练过程就是参数估计（parameter estimation）过程。对于参数估计，统计学界的两个学派分别提供了不同的解决方案：频率主义学派认为参数虽然未知，但却是客观存在的固定值，因此可通过优化似然函数等准则确定参数值；贝叶斯学派则认为参数是未观察到的随机变量，其本身也可有分布，因此可假定参数服从一个先验分布，并基于观测到的数据计算参数的后验分布。本节介绍源自频率主义学派的极大似然估计（maximum
    likelihood estimation, MLE），这是根据数据采样估计概率分布参数的经典方法。


    令 Dc 表示训练集 D 中第 c 类样本组成的集合，假设这些样本是独立同分布的，则参数 θc 对于数据集 Dc 的似然为


    $$P(D_c|\theta_c) = \prod_{x \in D_c} P(x|\theta_c)$$ (8.67)


    对 θc 进行极大似然估计，就是寻找能最大化似然 P(Dc|θc) 的参数值 θ̂c。直观上看，极大似然估计是指试图在 θc 所有可能的取值中，找到一个能使数据出现的“可能性”最大的值。


    式 (8.67) 中的连乘操作易造成下溢，通常使用对数似然（log-likelihood, LL）：


    $$LL(\theta_c) = \log P(D_c|\theta_c) = \sum_{x \in D_c} \log P(x|\theta_c)$$
    (8.68)


    此时参数 θc 的极大似然估计 θ̂c 为


    $$\hat{\theta}_c = \arg\max_{\theta_c} LL(\theta_c)$$ (8.69)


    例如，在连续属性情形下，假设概率密度函数 P(x|c) ~ N(μc, σc^2)，则参数 μc 和 σc^2 的极大似然估计为


    $$\mu_c = \frac{1}{|D_c|} \sum_{x \in D_c} x$$ (8.70)


    $$\hat{\sigma}_c^2 = \frac{1}{|D_c|} \sum_{x \in D_c} (x - \hat{\mu}_c)(x - \hat{\mu}_c)^T$$
    (8.71)


    也就是说，通过极大似然法得到的正态分布均值就是样本均值，方差就是'
