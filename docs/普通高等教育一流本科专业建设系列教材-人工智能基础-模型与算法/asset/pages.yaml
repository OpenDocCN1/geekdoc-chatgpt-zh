- pgno: 176
  md: '中基因发生了突变，产生了一个新的表现特征，同时这个特征恰好适合当下的生存环境，那么控制这个表现特征的基因也会得以保留下来，这就说明种群得到了进化。变异是指父母个体的全部基因不能完好地传递给子代个体。在生物界中，辐射或者一些疾病都能够导致基因突变，如基因缺陷或基因因变。绝大多数变异是中性的，它可能只是改变了某一个特征表现，但这就会对变异的生物的适应度提出了要求。同时，适应度的大小也是评判变异性质的标准之一，在现实世界中大多数单基因突变往往是有害的，如人类单基因突变会导致不同程度的遗传病，致使影响人类寿命。但众多的变异中总会有一些变异是有益的，适应度极高，这就是有益的进化，变异后的基因得到保留并遗传下去。


    # 2. 遗传算法的流程


    遗传算法以一个种群中的所有个体为对象，并利用随机化技术指导对一个被编码的参数空间进行高效搜索。其中，选择、交叉和变异构成了遗传算法的遗传操作；参数编码、初始群体的设定、适应度函数的设计、遗传操作设计、控制参数设定
    5 个要素组成了遗传算法的核心内容。遗传算法的流程如图 6.4 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_176_0.png)


    图 6.4 遗传算法的流程


    第 1 步，种群初始化。假设初始化种群中个体数量为 N，利用随机数生成器产生 N 个满足条件的染色体，当前进化的代数 G = 0。第 2 步，设置适应度。根据算法要求编写适应度函数，对种群内的每一个个体计算适应度，保留适应度值最大的染色体
    A。


    第 3 步，选择染色体。依据适应度值选择父母，适应度值高的个体被选中的概率高，适应度值低的个体被淘汰。


    第 4 步，交叉。按照概率 R 从种群中选择染色体进行交配。每两个进行交配的父代染色体交换部分基因，产生两个新的子代染色体，子代染色体取代父代染色体进入新种群。没有进行交配的染色体直接复制进入新种群。


    第 5 步，变异。按照概率 F 对新种群中的染色体进行变异操作。发生变异的染色体以随机的方式改变基因后进入新种群，未发生变异的染色体直接进入新种群。


    第 6 步，更新适应度。重新计算种群的适应度，获得群体中适应度值最大的染色体 A1，比较 A 与 A1 的适应度值，若 A1 的适应度大于 A，则成为种群中适应度最大的染色体
    A1。


    第 7 步，算法结束。当前进化代数 G 自增 1，若 G 超过最大进化代数或者 A 达到应用误差要求，则算法结束；否则返回第 3 步重新选择染色体。'
