  md: '人工智能与计算智能之间存在重合部分，但计算智能是一个全新的学科领域，无论是生物智能还是机器智能，计算智能都是最核心的部分。在美国学者詹姆斯·C·贝兹德克（James
    C. Bezdek）给出的定义中，计算智能依靠生产者提供的数字数据材料进行加工处理，而不是依赖于知识的智能；人工智能则是对知识进行处理。计算智能是一种智力方式的低层认知，它与人工智能的区别在于认知层次从中层下降至低层。中层系统含有知识，低层系统则没有。


    6.1 节讨论一系列智能算法，这些计算智能算法的一个共同特征是，通过模仿人类智能的某些方面来模拟人类智能，实现将生物智慧、自然界的规律计算机程序化，设计最优化算法的目的。然而，计算智能在不同研究领域各有特点，虽然它们具有模仿人类和其他生物智能的共同点，但是在具体方法上存在一些不同点。例如，人工神经网络是模仿人脑的生理构造和信息处理的过程；模糊逻辑（模糊系统）是模仿人类语言和思维中的模糊性概念；进化计算是模仿生物进化过程和群体智能过程。


    当然，不同研究领域的智能计算算法各有千秋，在具体实现方法上也存在差异性。


    # 6.1 计算智能简介


    随着科技的进步，科学研究和工程实践中遇到的问题越来越复杂，采用传统的计算方法解决这些问题面临着计算复杂度高、计算时间长等问题。特别是对于一些 NP（non-deterministic
    polynomial）难题，传统的算法无法在可容忍的时间内找到精确解。因此，为了在求解时间和求解精度之间取得平衡，计算机科学家提出了许多具有启发式特征的计算智能算法。这些算法要么模仿生物世界的进化过程，要么模仿生物体的生理结构和生理功能，要么模仿动物的群体行为，要么模仿人类思维、语言和记忆过程的特点，要么模仿自然界的物理现象，希望通过模仿自然和人类的智慧来实现对问题的最优求解，在可接受的时间内解决问题。这些算法共同构成了计算智能优化算法。


    计算智能是受到大自然智慧和人类智慧的启发而设计出的一类算法的总称。计算智能以数据为基础，以计算为手段来建立功能上的联系（模型），从而进行问题的求解。它强调通过计算的方法来实现生物内在的智能行为。计算智能也是一种以计算模型、数学模型为基础，以分布、并行计算为特征的自然智能模拟方法。由于计算智能借助自然界规律设计出问题解决方案算法，因此物理学、化学、数学、生物学、心理学、生理学、神经科学和计算机科学等学科的现象与规律都可能成为计算智能算法的基础和思想来源。


    # 6.1.1 计算智能的发展与现状


    计算智能在 20 世纪 50 年代开始萌芽，经过多年的不断发展与完善，现已成为计算机学科，特别是人工智能领域的重要研究方向。计算智能的主要发展历程如图 6.3
    所示。早在 1932 年，美国生理学家沃尔特·坎农（Walter Cannon）就把自然进化想象为一个学习过程，通过对单个个体进行反复随机实验来进行研究，后继者在他的启发下研究出一系列智能算法。


    其中，1940 ~ 1969 年是计算智能的萌芽阶段，这一时期诸多经典算法诞生。感知器是弗兰克·罗森布拉特在 1957 年就职于 Cornell 航空实验室（Cornell
    Aeronautical Laboratory）时发明的一种人工神经网络。它可以被视为一种最简单形式的前馈式人工神经网络，是一'
