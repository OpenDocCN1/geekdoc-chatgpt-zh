    好孓 $\leftarrow$ (肺部 = 凹陷) $\wedge$ (根蒂 = 蜷缩) (8.22)


    由于序贯覆盖法简单有效，因此绝大多数的规则学习算法以它为基本框架。它能方便地推广到多分类问题上，只需将每类分别处理即可：当学习关于第 c 类的规则时，将所有属于类别
    c 的样本作为正例，其他类别的样本作为反例。


    # 3. 剪枝优化


    规则生成本质上是一个贪心搜索过程，需要一定的机制来缓解过拟合的风险，最常见的做法是剪枝（pruning）。与决策树相似，剪枝可发生在规则生长过程中，即预剪枝；也可发生在规则产生后，即后剪枝。通常是基于某种性能度量指标来评估增删逻辑文字前后的规则性能，或增删规则前后的规则集性能，从而判断是否要进行剪枝。


    剪枝还可借助统计显著性检验来进行。例如，CN2 算法在预剪枝时，假设用规则集进行预测必须显著优于直接基于训练样例集后验概率分布进行预测。为了便于计算，CN2
    使用了似然率统计量（likelihood ratio statistics，LRS）。令 m+、m- 分别表示训练样例集中的正、反例数目， m̂+、m̂-
    分别表示规则（集）覆盖的正、反例数目，则有


    LRS = 2 \left( \hat{m}_+ \text{lb} \frac{\hat{m}_+ / m_+}{(\hat{m}_+ + \hat{m}_-)
    / (m_+ + m_-)} + \hat{m}_- \text{lb} \frac{\hat{m}_- / m_-}{(\hat{m}_+ + \hat{m}_-)
    / (m_+ + m_-)} \right) (8.23)


    这实际上是一种信息量指标，衡量了规则（集）覆盖样例的分布与训练集经验分布的差别：似然率统计量越大，说明采用规则（集）进行预测与直接使用训练集正、反例比例进行猜测的差别越大；似然率统计量越小，说明规则（集）的效果越可能仅是偶然现象。在数据量比较大的现实任务中，通常设置为在似然率统计量很大（如
    0.99）时 CN2 算法才停止规则（集）生长。


    后剪枝最常用的策略是“减错剪枝”（reduced error pruning，REP），其基本做法是将样例集划分为训练集和验证集，首先从训练集上学得规则集
    R 后进行多轮剪枝，在每一轮穷举所有可能的剪枝操作，包括删除规则中某个文字、删除规则结尾文字、删除规则尾部多个文字、删除整条规则等；然后用验证集对剪枝产生的所有候选规则集进行评估，保留最好的规则集进行下一轮剪枝。如此继续，直到无法通过剪枝提高验证集中的性能为止。


    减错剪枝通常很有效，但其复杂度是 O(m^4)，m 为训练样例数目。渐进式减错剪枝（incremental reduced error pruning，IREP）将复杂度降到
    O(mlbm)，其做法是在生成每条规则前，先将当前样例集划分为训练集和验证集，在训练集上生成一条规则 r，立即在验证集上对其进行减错剪枝，得到规则 r''；将
    r'' 覆盖的样例去除，在更新后的样例集上重复上述过程。显然，减错剪枝是针对规则集进行剪枝，而渐进式减错剪枝仅对单条规则进行剪枝，因此后者比前者更高效。


    将剪枝机制与其他一些后处理手段结合起来对规则集进行优化，往往能获得更好的效果。以著名的规则学习算法——重复增量修剪减少误差（repeated incremental
    pruning to produce error reduction，RIPPER）为例，其泛化性能超过很多决策树算法，而且学习速度'
  merge: -1
  img_proc: true
- pgno: 261
  md: '也比大多数决策树算法更快，奥妙就在于将剪枝与后处理优化相结合。


    # 算法 8.1 RIPPER 算法。


    ```

    Procedure RIPPER

    Input

    训练样例集 D ;

    重复次数 k

    Begin

    R = IREP*(D);

    i = 0;

    Repeat

    R'' = PostOpt(R);

    D_i = NotCovered(R'', D);

    R_i = IREP*(D_i);

    R = R'' U R_i;

    i = i + 1;

    Until i = k

    Output

    规则集 R

    ```


    首先使用 IREP* 剪枝机制生成规则集 R 。 IREP* 是 IREP 的改进，主要是以 \frac{\hat{m}_+ + (m_- - \hat{m}_-)}{m_+
    + m_-} 取代了 REP 使用的准确率作为规则性能度量指标，在剪枝时删除规则尾部的多个文字，并在最终得到规则集之后再进行一次 IREP 剪枝。RIPPER
    中的后处理机制是为了在剪枝的基础上进一步提升性能。


    对 R 中的每条规则 r，RIPPER 会为其产生两个变体。基于 r_i 覆盖的样例，用 IREP* 重新生成一条规则 r''_i，该规则称为替换规则（replacement
    rule）；对 r_i 增加文字进行特化，并用 IREP* 剪枝生成一条规则 r''''_i，该规则称为修订规则（revised rule）。


    随后，把 r''_i 和 r''''_i 分别与 R 中除 r''_i 之外的规则放在一起，组成规则集 R'' 和 R''''，将它们一起进行比较，选择最优的规则集保留下来，这就是算法
    8.1 第 4 行所做的操作。


    为什么 RIPPER 的优化策略会有效呢？原因很简单：最初生成 R 时，规则是按序生成的，每条规则都没有对其后产生的规则加以考虑，这样的贪心算法本质常导致算法陷入局部最优；RIPPER
    的后处理优化过程将 R 中的所有规则放在一起重新加以优化，恰是通过全局的考虑来缓解贪心算法的局部性，从而能得到更好的效果。


