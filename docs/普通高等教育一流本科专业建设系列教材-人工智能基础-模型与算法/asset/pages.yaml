  md: '2) 连接机制表示法是用神经网络技术表示知识的一种方法，它把各种物理对象以不同的方式及次序连接起来，并在其间互相传递及加工各种包含具体意义的信息，以此表示相关的概念及知识。相对于符号表示法而言，连接机制表示法是一种隐式的知识表示方法，适用于表示各种形象性的知识。


    另外，按照控制性知识的组织方式进行分类，知识表示法可分为说明性表示法和过程性表示法。说明性表示法着重于知识的静态方面，如客体、事件、事实及其相互关系和状态等，其控制性知识包含在控制系统中；而过程性表示法强调的是对知识的利用，着重于知识的动态方面，其控制性知识全部嵌入对知识的描述中，且将知识包含在若干过程之中。


    不同的知识有不同的表示方法，研究知识的表示方法不单是解决如何将知识存储在计算机中的问题，更重要的是应该能够方便正确地使用知识。合理的知识表示可以使问题的求解变得容易，并且有较高的求解效率。一个好的知识表示系统应具备以下特点。


    +   1) 具有表示某个专门领域所需要的知识的能力，并保证知识库中的知识是相容的。


    +   2) 具有从已知知识推导出新知识的能力，容易建立表示新知识所需要的新结构。


    +   3) 便于新知识的获取，最简单的情况是能够由人直接输入知识到知识库中。


    +   4) 便于将启发式知识附加到知识结构中，以便把推理集中在最有希望的方向上。


    为实现以上目标，人们研究出了许多种知识表示方法，目前，用得较多的知识表示方法主要有一阶谓词逻辑表示法、产生式表示法、脚本表示法、过程表示法、框架表示法、语义网络表示法等。虽然目前已拥有多种知识表示方法，但知识表示还是一个没有完全解决的问题，因而仍然是人工智能研究的一个重要分支。


    # 3. 知识表示方法的衡量及特性


    首先，一种好的知识表示方法要求有较强的表达能力和足够的精细度；其次，知识推理的正确性与效率也应得到保证；另外，使用者常常希望知识表示能够满足可读性好、模块性好等要求。因此，从综合的角度来看，一个知识表示应具备完备性、一致性、正确性、灵活性、可扩充性、可理解性、可利用性、可维护性等特性。


    +   1) 完备性。知识表示应具有表达领域问题所需的各种知识的能力，即要求所采用的知识表示方法具有语法完备性和语义完备性，并便于知识库的检查与调试。目前，大多数知识表示方法很难满足这一要求。特别是对于领域知识库来说，由于其特点及建库方法等原因，如果不选择表示能力强的知识表示方法，就很难使知识库具有某些有关的甚至是很重要的知识，严重影响专家系统的问题求解能力。


    +   2) 一致性。知识库中的知识必须具有一致性，不能相互产生矛盾。几乎所有的专家系统的研制者在开发自己的系统时都在追求这个目标。由于专家的知识大多是启发性知识，具有不完全性和不确定性，因此所采用的知识表示必须便于系统进行一致性检查，以便在使用中完善知识库，以保证系统的求解质量。


    +   3) 正确性。知识表示必须能真实地反映知识的价值信息，不允许有偏差，只有这样才能保证系统得出正确结论和合理建议。


    +   4) 灵活性。针对不同的专业领域，应当根据具体知识的特点及其自然结构的制约选用不同的知识表示方法，或是用单一方法，或是用混合方法，甚至设计研究新的表示方法。知识表示方法的选用一定要具体问题具体分析，灵活运用，切忌生搬硬套。


    +   5) 可扩充性。高性能知识库应当不需要硬件或控制结构的修改就能对知识库进行扩'
