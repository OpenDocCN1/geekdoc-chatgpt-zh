    爬山法一般遇到以下 3 种情况。


    1）局部最大：由于爬山法每次选择 f 值最小的节点时都是从子节点范围内选择的，选择范围较窄，因此爬山法是一种局部择优的方法。局部最大一般比状态空间中全局最大要小，一旦到达了局部最大，算法就会停止，即便该答案可能并不能让人满意。


    2）平顶：平顶是状态空间中评估函数值基本不变的一个区域，也称为高地，在某一局部点周围 f(x)为常量。一旦搜索到达了一个平顶，搜索就无法确定要搜索的最佳方向，会产生随机走动，这使得搜索效率降低。


    3）山脊：山脊可能具有陡峭的斜面，所以搜索可以比较容易到达山脊顶部，但是山脊的顶部到山峰之间可能倾斜得很平缓。除非正好有合适的操作符直接沿着山脊的顶部移动，否则该搜索可能在山脊的两面来回震荡，搜索的前进步伐会很小。


    在每种情况中，算法都会到达一个点，之后无法再继续前进。如果出现这种情况，可以从另一个点重新启动该算法，这称为随机重启爬山法。爬山法是否成功与状态空间“表面”的形状有很大关系：如果只是很少的局部最大，随机重启爬山法会很快找到一个比较好的解答；如果该问题是
    NP 完全的，则该算法不可能好于指数时间，这是因为一定具有指数数量的局部最大值。然而，通常经过比较少的步骤，爬山法一般可以得到比较合理的解答。


    # 3.5.2 回溯策略


    回溯策略可以有效地克服爬山法面临的困难，其保存了每次扩展出的子节点，并按 h(x)值从小到大排列。如此，相当于爬山的过程中记住了途经的岔路口，只要当前路径搜索失败就回溯（退回）到时序上最近的岔路口，向另一路径方向搜索，从而可以确保最后到达最高峰（目标状态）。


    实现回溯策略的有效方式是应用递归过程支持搜索和回溯。令 PATH、SXL、x、x''为局部变量。其中，PATH 为节点列表，指示解答路径；SXL 为当前节点扩展的子节点列表；x、x''分别为当前考察和下一次考察的节点。Move-First(SXL)表示把
    SXL 表首的节点移出，将其作为下一次要扩展的节点。


    该递归过程的算法就取名为 BackTrack(x)，参数 x 为当前被扩展的节点，算法的初次调用式是 BackTrack(s)，s 即初始状态节点。


    BackTrack(x)算法过程如下。


    +   1) 若 x 是目标状态节点，则算法的本次调用成功结束，返回空表。

    +   2) 若 x 是失败状态，则算法的本次调用失败结束，返回''FAIL''。

    +   3) 扩展节点 x，将生成的子节点置于列表 SXL，并按评价函数 f(k)=h(k)的值升序排列（k 指示子节点）。

    +   4) 若 SXL 为空，则算法的本次调用失败结束，返回''FAIL''。

    +   5) x''=Move-First(SXL)。

    +   6) PATH=BackTrack(x'')。

    +   7) 若 PATH=''FAIL''，则返回步骤 4)。

    +   8) 将 x''加到 PATH 表首，算法的本次调用成功结束，返回 PATH。


