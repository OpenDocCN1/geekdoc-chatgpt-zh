    # ## 3.6 问题规约


    问题规约是求解问题时常用的策略，把复杂的问题变换为若干需要同时处理的较简单的子问题后，再分别求解。只有当这些子问题全部解决时，问题才算解决，问题的解答由子问题的解答联合构成。问题规约可以递归地进行，直到把问题变换为本原问题的集合。本原问题就是不可或不需再通过变换化简的“原子”问题。本原问题的解可以直接得到或通过一个“黑箱”操作得到。问题规约是一种广义的状态空间搜索技术，其状态空间可表示为三元组：


    ```

    SP = (S_0, O, P) （3.21）

    ```


    式中，S_0 为初始问题，即要求解的问题；P 为本原问题集，其中的问题都是不用证明的，自然成立的，如公理、已知事实等，或已证明过的问题；O 为操作算子集，是一组变换规则，通过一个操作算子把一个问题化成若干子问题。变换可区分为以下
    3 种情况。


    +   1）状态变迁：导致问题从上一状态变迁到下一状态，这就是一般图搜索技术中操作算子的作用。

    +   2）问题分解：将问题分解为需同时处理的子问题，但不改变问题状态。

    +   3）基于状态变迁的问题分解：先导致状态变迁，再实现问题分解，实际上是前两个操作的联合执行。


    作为问题规约的例子，观察下面的符号积分求解问题：初始状态为 ∫ f(x)dx ；目标状态为可直接求原函数和积分的本原问题，如 ∫ sin(x)dx 、 ∫
    cos(x)dx 等；操作算子就是积分变换规则。下面是一次典型的积分变换：


    ```

    \int (\sin 3x + \frac{x^4}{x^2+1}) dx = \int \sin 3x dx + \int (\frac{x^4}{x^2+1})
    dx

    = \frac{1}{3} \int \sin(3x) d(3x) + \int (\frac{x^4 - 1 + 1}{x^2+1}) dx

    = \frac{1}{3} \sin(3x) d(3x) + \int (x^2 - 1) dx + \int (\frac{1}{x^2+1}) dx

    = -\frac{1}{3} \cos 3x + \frac{x^3}{3} - x + \arctan x + c

    ```'
