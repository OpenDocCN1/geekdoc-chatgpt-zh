  md: '# (3) 聚类关系


    聚类关系也称包含关系，是指具有组织或结构特征的“部分与整体”之间的关系。Part-of 是常用的包含关系，其含义为“是一部分”，表示一个事物是另一个事物的一部分。例如，“胳膊是人体的一部分”的关系表示如图
    2.13 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_0.png)


    聚类关系与实例、分类、成员关系的主要区别是其一般不具备属性的继承性，如图 2.13 所示的例子，大脑不一定具有人体的各种属性。


    # (4) 时间关系


    时间关系是指不同事件在其发生时间方面的先后次序关系。常用的时间关系有 Before、After 等。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_1.png)


    Before 的含义为“在前”，表示一个事件在另一个事件之前发生；After 的含义为“在后”，表示一个事件在另一个事件之后发生。例如，“北京奥运会在悉尼奥运会之后”的关系表示如图
    2.14 所示。


    # (5) 位置关系


    位置关系是指不同事物在位置方面的关系。常用的位置关系如下：Located-on 的含义为“在上”，表示某一物体在另一物体之上；Located-at 的含义为“在”，表示某一物体所在的位置；Located-under
    的含义为“在下”，表示某一物体在另一物体之下；Located-inside 的含义为“在内”，表示某一物体在另一物体之内；Located-outside 的含义为“在外”，表示某一物体在另一物体之外。例如，“纸在桌子上”的关系表示如图
    2.15 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_2.png)


    # (6) 相近关系


    相近关系是指不同事物在形状、内容等方面相似或接近。常用的相近关系如下：


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_3.png)


    Similar-to 的含义为“相似”，表示某一事物与另一事物相似；Near-to 的含义为“接近”，表示某一事物与另一事物接近。例如，“猫似老虎”的表示如图
    2.16 所示。


    # (7) 因果关系


    因果关系是指某个事件的发生导致另一个事件的发生。常用的因果关系如下：IF-THEN 的含义为“如果……那么”。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_4.png)


    例如，“如果下雨，小明待在家里”的关系表示如图 2.17 所示。


    # (8) 组成关系


    ![](img/01b3dd63f105ee2f61ade787bae553f5_52_5.png)


    组成关系是一种一对多的联系，表示一个事物由其他一些事物构成，通常用 Composed-of 联系表示，其所连接的节点间不具备属性的继承性。例如，“整数由正整数、负整数和零组成”的关系表示如图
    2.18 所示。


    # 2.7.2 语义网络的推理过程


    用语义网络表示知识的问题求解系统主要由两大部分组成，一部分是由语义网络构成的知识库，另一部分是用于问题求解的推理机。语义网络的推理过程主要有两种，一种是'
