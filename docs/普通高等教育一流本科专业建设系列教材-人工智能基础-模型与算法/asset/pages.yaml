  md: '感知思维。人工智能的三大学派、3 条途径各有所长，需取长补短，综合集成。


    综上所述，符号主义认为只要实现指名功能就可以实现人工智能，联结主义认为只要实现指心功能就可以实现人工智能，行为主义认为只要实现指物功能就可以实现人工智能。人工智能的三大流派虽然取得了很大进展，但各自也面临着巨大挑战。简单地说，人工智能三大流派假设能够成立的前提是指名、指心、指物功能等价。


    可是这个前提成立吗？早期的人工智能研究使用经典概念，而经典概念至少具有以下 5 个假设。


    +   1）概念的外延表示可以用经典集合表示。


    +   2）概念的内涵表示存在命题表示。


    +   3）指称对象的外延表示与其内涵表示名称一致。


    +   4）概念表示唯一，即同一个概念的表示与个体无关，对于同一个概念，每个人的表示都是一样的。


    +   5）概念的内涵表示与外延表示在指称对象上功能等价。


    可以看出，在上述 5 个假设下，经典概念的指名、指心、指物功能是等价的，即指名意味着指物、指心。但是，日常生活中使用的概念一般并不满足经典概念的这 5 条假设，因此也不能保证其指名、指心、指物功能等价。《周易·系辞上》中也说，“书不尽言，言不尽意”，明确指出了指名、指心与指物不一定等价。下面给出两个例子，以说明日常生活中概念的指名、指物功能并不等价。


    业界曾经流传过一个著名段子：一个人说手头有一个亿，谁有项目时，一起投资。不然，再晚一点，就不干了。听的人以为其是指物，即真的有一个亿的资金。但实际上，这个人只是在手头上写了
    3 个字“一个亿”而已。在这儿纯粹指名，即“手头有一个亿”仅仅是符号“一个亿”而已。这个段子显然利用了概念的指名与指物不一定等价的性质。


    西方绘画史上有一幅著名的绘画，画面上画了一个烟斗，题字却说这不是烟斗。这显然是想说明符号与实物不同，即指名与指物不等价。在现实生活中，也可以发现指名与指心不等价的例子。


    因此，概念的指名、指心与指物功能在生活中中可能不等价，单独实现概念的功能并不能保证具有智能。因此，单独遵循一个学派不足以实现人工智能，现在的人工智能研究已经不再强调遵循人工智能的单一学派，很多时候会综合各个流派的技术。例如，从专家系统发展起来的知识图谱已经不再完全遵循符号主义的路线。在围棋上战胜人类顶尖棋手的
    AlphaGo 综合使用了 3 种学习算法——强化学习、蒙特卡罗树搜索和深度学习，而这 3 种学习算法分别属于 3 个人工智能流派（强化学习属于行为主义，蒙特卡罗树搜索属于符号主义，深度学习属于联结主义）。无人驾驶技术同样是突破了人工智能三大流派限制的综合技术。虽然人工智能发展至今，各个流派依然在发展，也都取得了很好的进展，但是各个流派进行融合已经是大势所趋，特别是在大数据和云计算的助力下，新一代人工智能将带来社会的第
    4 次技术革命。


    然而，目前的人工智能还有一定的缺陷，其使用的知识表示还是建立在经典概念的基础之上。图灵测试文章发表于 1950 年，当时人们对于经典概念的普适性还没有提出质疑，因此其使用的概念是基于经典概念的。在图灵测试中，较为重要的概念之一是人，包括提问者和回答者。但是什么样的人才是合适的提问者和回答者，是中国人还是英国人，是圣人还是智力障碍者或者装傻者，图灵测试并没有定义。如果人存在经典定义，在图灵'
