    7) 若存在 j(j>1)个外向 K-连接，则从 LGS 中删除 G''，并将 j 个新局部解图加进 LGS。


    8) 在 G''或取代 G'' 的 j 个新局部解图中，用公式 f(n) = K + h(n_1) + h(n_2) + ... + h(n_k) 的计算结果取代原来的
    f(n)，并将这种精化作用传递到 f_i(n_0)(i=1,2,...,j)；同时，将作为终节点的子节点标记为能解节点，并传递节点的能解性。


    9) 返回 3)。


    # 4. AO*算法


    # 算法 3.7 AO*算法。


    ```

    Procedure AO*

    Begin

    设 G 仅由代表开始状态的节点组成（称此节点为 Init），计算 h(Init);

    Repeat

    跟踪从 Init 开始的已带有标记的弧，如果存在，则挑选出现在此路径上但未扩展的节点之一进行扩展，称新挑选的节点为 Node；

    生成 Node 的后继节点：

    If Node 没有后继节点 Then 令 h(Node)=Futility，说明该节点不可解；

    Else 后继节点称为 Successor，对每个不是 Node 祖先的后继节点 do

    Begin

    把 Successor 加到图 G 中；

    若 Successor 是叶节点，那么将其标记为 Solved，并令 h(Successor)=0；

    若 Successor 不是叶节点，则计算它的 h 值；

    End

    将最新发现的信息向图的上部回传，具体做法为：设 S 为一节点集，S 包括已经做了 Solved 标记的节点，以及 h 已经做了改变、需要回传至其先驱节点的那些节点，初始
    S 只包含节点 Node；

    Repeat

    从 S 中挑选一个节点，该节点在 G 中的子节点均不在 S 中出现（换句话说，保证对于每个正在处理的节点，是在处理其任意祖先之前处理该节点的），称此节点为
    Current，并把它从 S 中去掉；

    计算始于 Current 的每条弧的耗费。每条弧的耗费等于在该弧末端每个节点的 h 值之和上加上该弧本身的耗费。从刚刚计算过的始于 Current 的所有弧的耗费中选出极小耗费，作为
    Current 的新 h 值；

    把在上一步计算出的带极小耗费的弧标记为始于 Current 的最佳路径；

    If 把经过新的带标记弧与 Current 连接的所有节点均标记为 Solved；

    Then 把 Current 标记为 Solved；

    If Current 已标记为 Solved，或 Current 的耗费刚才已经改变；

    Then 应把其新状态回传，因此，把 Current 的所有祖先加到 S 中；

    ```'
