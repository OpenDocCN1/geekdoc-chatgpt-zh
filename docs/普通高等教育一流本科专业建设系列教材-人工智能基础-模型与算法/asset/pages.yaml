    # (2) 子句集的应用


    在上述化简过程中，由于在消去存在量词时所用的 Skolem 函数可以不同，因此化简后的标准子句集是不唯一的。当原谓词公式为非永假时，它与其标准子句集并不等价；但当原谓词公式为永假（或不可满足）时，其标准子句集则一定是永假的，即
    Skolem 化并不影响原谓词公式的永假性。


    该结论很重要，是归结原理的主要依据，可用定理的形式来描述。


    # 定理 4.1 谓词公式不可满足的充分必要条件是其子句集不可满足。


    由此定理可知，要证明一个谓词公式是不可满足的，只要证明其相应的字句集是不可满足的即可。


    # 2. 鲁滨逊归结原理


    归结演绎推理是一种基于鲁滨逊归结原理的机器推理方法。鲁滨逊归结原理也称为消解原理，是鲁滨逊于 1965 年在海伯伦（Herbrand）理论的基础上提出的一种基于逻辑的“反证法”。专家学者在进行大量的探索后发现，对于前提
    P 推导至结论 Q 这一过程的永真证明可以采用反证法的思想，把关于永真性的证明转换为关于不可满足性的证明。这方面最有成效的工作就是鲁滨逊归结原理，它使定理证明的机械化成为可能。


    由谓词公式转换为子句集的方法可知，在子句集中子句之间是合取关系。其中，只要有一个子句为不可满足，则整个子句集就是不可满足的；另外，前面已经指出空子句是不可满足的。因此，一个子句集中如果包含有空子句，则此子句集就不可满足。


    鲁滨逊归结原理就是基于上述认识提出来的，其基本思想是：首先把欲证明问题的结论否定，并加入子句集，得到一个扩充的子句集 S''；然后设法检验子集 S''是否含有空子'
