    # 6.3.2 模拟退火算法


    1953 年 Metropolis 提出模拟退火算法，但是模拟退火算法真正为人们所接受是在 1983 年柯克帕特里克等将模拟退火算法用于求解组合优化问题上。自那时起模拟退火算法逐渐作为一种有效的算法在很多工程和科研领域得到广泛的应用。


    # 1. 模拟退火算法的定义


    在统计物理学和热力学研究中，物理退火的过程是先将固体加热到温度充分高，再让它慢慢冷却。加温时，物体内部的固体粒子会随着温度的升高逐渐变为无序状态，内能增大，温度降低时粒子逐渐趋于有序。如果降温速度足够慢，那么在任意一个温度下粒子都可以达到一个平衡状态，最终在常温时达到基态，内能减为最小。


    Metropolis 准则定义了物体在某一温度 \(T\) 下，从状态 \(i\) 转移到动态 \(j\) 的概率，如式（6.23）所示。由于粒子在某个温度
    \(T\) 下的状态具有随机性，因此该准则也决定了这些状态之间的转换能否实现。


    ```

    \(P_{ij}^T = \begin{cases} 1, & E(j) \leqslant E(i) \\ e^{-\frac{[E(j)-E(i)]}{KT}}
    = e^{-\left(\frac{\Delta E}{KT}\right)} & \text{其他} \end{cases} \quad (6.23)\)

    ```


    式中，\(E(i)\) 和 \(E(j)\) 分别为固体在状态 \(i\) 和 \(j\) 下的内能：\(\Delta E\) 为内能的增量，\(\Delta
    E = E(j) - E(i)\)；\(K\) 为玻尔兹曼常数（Boltzmann constant），\(K = 1.380649 \times 10 \text{
    J/K}\)；\(e\) 为自然对数。


    通过准则可以看出，在某个温度 \(T\) 下，系统处于某种状态，由于粒子的运动，系统的状态会发生变化，并且导致系统能量发生变化。如果变化是朝着减少系统能量的方向进行的，那么就接受该变化；否则以一定的概率接受这种变化。此外，从式（6.23）可以看出，在同一温度下，导致能量增加的增量
    \(\Delta E = E(j) - E(i)\) 越大，接受的概率越小；另外，随着温度 \(T\) 的降低，接受系统能量增加的变化的概率将会越小。当温度趋于
    0 时，系统接受其他使能量增加的状态的概率趋于 0，因此系统最终将以概率 1 处于一个具有最小能量的状态。


    模拟退火算法首先会生成一个解空间的随机解，对随机解进行扰动，模拟固体粒子在特殊温度下的状态转移。算法会将当前解与扰动后的解进行比较，并且根据 Metropolis
    准则进行替换。模拟退火算法还会在同一温度下进行多次扰动，用于模拟当前固体内的各种能量状态。此外，模拟退火算法用参数 \(T\) 代表温度，逐代减小，以此模拟温度下降的过程。在每一代中，算法根据当前温度下的
    Metropolis 转移准则对解进行扰动。不断在不同温度下重复上述操作，直到温度降低到某个阈值，这时将得到的解作为输出的最终解，即固体能量的最低状态。


    # 2. 模拟退火算法的流程


