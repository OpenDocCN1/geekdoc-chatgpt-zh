    # 2. 感知器学习算法的收敛性


    现在证明，对于线性可分数据集，感知器学习算法原始形式收敛，即经过有限次迭代，可以得到一个将训练数据集完全正确划分的分离超平面及感知器模型。


    为了便于叙述与推导，将偏置 $b$ 并入权重向量 $w$，记作 $\hat{w} = (w^T, b)^T$，同样也将输入向量加以扩充，加进常数 1，记作
    $\hat{x} = (x^T, 1)^T$。这样，$\hat{x} \in R^{n+1}, \hat{w} \in R^{n+1}$。显然，$\hat{w}x
    = wx + b$。


    定理 7.2 (Novikoff 定理) 设训练数据集 $T = \{(x_1, y_1), (x_2, y_2), \cdots, (x_N, y_N)\}$
    是线性可分的，其中 $x_i \in X = R^n, y_i \in Y = \{+1, -1\}, i = 1, 2, \cdots, N$，则：


    +   1) 存在满足条件 $\| \hat{w}_{opt} \| = 1$ 的超平面 $\hat{w}_{opt} \hat{x} = w_{opt}
    x + b_{opt} = 0$，将训练数据集完全正确分开；且存在 $\gamma > 0$，对所有的 $i = 1, 2, \cdots, N$，有 $y_i
    (\hat{w}_{opt} \hat{x}) = y_i (w_{opt} x + b_{opt}) \geqslant \gamma$ (7.36)


    +   2) 令 $R = \max_{1 \leqslant i \leqslant N} \| \hat{x}_i \|$，则感知器算法 7.1 在训练数据集上的误分类次数
    $k$ 满足不等式：

    +   $k \leqslant \left( \frac{R}{\gamma} \right)^2$ (7.37)


    证明 1) 由于训练数据集是线性可分的，按照定理 7.2，存在超平面可将训练数据集完全正确分开，取此超平面为 $\hat{w}_{opt} \hat{x}
    = w_{opt} x + b_{opt} = 0$，使 $\| \hat{w}_{opt} \| = 1$。由于对有限的 $i = 1, 2, \cdots,
    N$，均有

    $y_i (\hat{w}_{opt} \hat{x}) = y_i (w_{opt} x + b_{opt}) > 0$ (7.38)

    因此存在：

    \(\gamma = \min_i \{ y_i (w_{opt} x + b_{opt}) \}\) (7.39)

    使

    $y_i (\hat{w}_{opt} \hat{x}) = y_i (w_{opt} x + b_{opt}) \geqslant \gamma$ (7.40)


    +   2) 感知器算法从 $\hat{w}_0 = 0$ 开始，如果实例被误分类，则更新权重。令 $\hat{w}_{k-1}$ 是第 $k$ 个误分类实例之前的扩充权重向量，即

    +   \(\hat{w}_{k-1} = (w_{k-1}^T, b_{k-1})^T\) (7.41)'
