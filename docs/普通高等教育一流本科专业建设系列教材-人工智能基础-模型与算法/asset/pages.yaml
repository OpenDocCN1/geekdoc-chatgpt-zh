- pgno: 210
  md: '生化过程。生物神经元还包括树突和一条长的轴突。由细胞体向外伸出的最长的一条分支称为轴突，即神经纤维。轴突末端部分有许多分支，称为轴突末梢。典型的轴突长
    1cm，是细胞体直径的 100 倍。一个生物神经元通过轴突末梢与 10～10 万个其他生物神经元相连接。轴突是用来传递和输出信息的，其端部的轴突末梢为信号输出端子，将神经冲动传给其他生物神经元。由细胞体向外伸出的其他许多较短的分支称为树突。树突相当于细胞的输入端，树突的全长各点都能接收其他生物神经元的冲动。神经冲动只能由前一级生物神经元的轴突末梢传向下一级的生物神经元的树突或细胞体，不能反方向进行传递。


    生物神经元具有两种常规工作状态：兴奋与抑制，即满足“0-1”律。当传入的神经冲动使细胞膜电位升高超过阈值时，细胞进入兴奋状态，产生神经冲动并由轴突输出；当传入的冲动使细胞膜电位下降低于阈值时，细胞进入抑制状态，没有神经冲动输出。


    # 7.1.2 人工神经元数学模型


    +   1. MP 模型


    早在 1943 年，麦卡洛克和皮茨就提出了人工神经元的数学模型（MP 模型），如图 7.2 所示，从此开创了神经科学理论研究的时代。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_210_0.png)


    图 7.2 MP 模型


    MP 模型的基本思想简单直接，它仿照生物神经元接收多个输入信号，并在一定阈值的作用下产生输出信号。MP 模型与生物神经元的主要区别在于，该模型中添加了权值，可以为正值或负值，用于模拟神经元中的兴奋和抑制作用。所有输入信号在权值下累加求和。在图
    7.2 中，字母 w 称为权值（或权重、权数），是一个浮点数。人工神经元的每一个输入都与一个权值 w 相关，正是这些权值决定着神经元的整体活跃性。假设这些权值都被设置为(-1,1)之间的一个随机小数（因为权值可正可负，所以能对与它关联的输入施加不同的影响），如果权值为正，则会有激发作用，即神经元的输入与输出之间可以传输信号；如果权值为负，则会有抑制作用，即神经元的输入与输出之间没有传输信号。


    在 MP 模型中，来自第 i 个神经元的输入信号 \(x_i(i=1,2,\cdots, n)\) 进入神经元后，与第 i 个神经元的权值 \(w_i(i=1,2,\cdots,
    n)\) 相乘（加权），所有输入信号经加权求和后得到信号 u。\(f(\cdot)\) 是一个激活函数，利用激活函数的性质可以拟合神经元的非线性，决定神经元的信号输出。神经元是否被激活，取决于
    u 是否超过某一阈值电平 \(\theta\)。如果激活函数是一个阶跃函数，则当 \(u\) 超过 \(\theta\) 时，就会产生一个值为 1 的输出信号（被激活的神经元会输出脉冲）；否则，输出一个
    0（神经元没有被激活，没有信号输出）。除了阶跃函数外，激活函数也可以选用 Sigmoid 等其他函数，激活值是一个浮点数，可正可负。'
