    # ## 2.5 脚本表示法


    脚本表示法是一种简单但又普遍的启发式技术，常用于表示学科中的知识，通过脚本构建的系统能够描述非常全面的背景设定。


    # ### 2.5.1 概念依存理论


    在人类的各种知识中，常识性知识是数量最大、涉及面最宽、关系最复杂的知识，很难把它们形式化地表示出来交给计算机进行处理。面对这一难题，夏克（Schank）提出了概念依存理论，其基本思想是：把人类生活中各类故事情节的基本概念抽取出来，构成一组原子概念，确定这些原子概念间的相互依赖关系，并把所有故事情节都用这组原子概念及其依赖关系表示出来。


    夏克在其研制的脚本应用者机制（script applier mechanism，SAM）中对动作一类的概念进行了原子化，抽取了 11 种原子动作，并用其来表示槽的行为。这
    11 种原子动作如下。


    +   1) PROPEL：表示对某一对象施加外力，如推、拉、打等。

    +   2) GRASP：表示行为主体控制某一对象，如抓起某东西、扔掉某东西等。

    +   3) MOVE：表示行为主体变换自己身体的某一部位，如抬手、蹬脚、坐下等。

    +   4) ATRANS：表示某种抽象关系的转移，如当把某物交给另一人时，该物的所有关系就发生了转移。

    +   5) PTRANS：表示某一物理对象物理位置的改变，如某人从一处走到另一处，其物理位置发生了变化。

    +   6) ATTEND：表示用某个感觉器官获取信息，如用眼睛查看或用耳朵听某种声音等。

    +   7) INGEST：表示把某物放入体内，如吃饭、喝水等。

    +   8) EXPEL：表示把某物排出体外，如落泪、呕吐等。

    +   9) SPEAK：表示发出声音，如唱歌、喊叫、说话等。

    +   10) MTRANS：表示信息的转移，如看电视、窃听、交谈、读报等。

    +   11) MBUILD：表示由已有的信息形成新信息，如由图、文、声、像形成的多媒体信息。


    夏克利用这 11 种原子动作及其依赖关系把生活中的事件编制成脚本，每个脚本代表一类事件，并把事件的典型情节规范化。当接受一个故事时，就找出一个相应的脚本与之匹'
