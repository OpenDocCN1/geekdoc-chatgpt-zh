  md: "通常所说的“经典的人工智能”是在符号主义观点指导下开展研究的。经典的人工智能研究中又可以分为认知学派和逻辑学派。认知学派以西蒙、明斯基和纽厄尔等为代表，从人的思维活动出发，利用计算机进行宏观功能模拟。逻辑学派以麦卡锡和尼尔森等为代表，主张用逻辑研究人工智能，即用形式化的方法描述客观世界。\n\
    \n符号主义的主要特征如下。\n\n+   1）立足于逻辑运算和符号操作，适合模拟人的逻辑思维过程，可以解决需要逻辑推理的复杂问题。\n+   \n+  \
    \ 2）知识可用显式符号来表示，在已知基本规则的情况下，不需要输入大量的细节知识。\n+   \n+   3）便于模块化，当个别事实发生变化时，易于修改。\n\
    +   \n+   4）能与传统的符号数据库进行连接。\n+   \n+   5）可对推理结论进行解释，便于对各种可能性进行选择。\n\n符号主义的主要特点是可以解决逻辑思维难题，但对于形象思维难以模拟，信息在表示成符号后，在处理或转换过程中有丢失的情况。\n\
    \n# 2. 联结主义\n\n联结主义又称为仿生学派（bionicsism）或生理学派（physiology），是基于神经网络和网络间的连接机制与学习算法的学派。以网络连接为基础的联结主义是近年来研究比较多的一种方法，属于非符号处理范畴。联结主义主要研究能够进行非程序、可适应环境变化、类似人类大脑活动的信息处理方法的本质和能力。持这种观点的研究者认为，人的思维基元是神经元，而不是符号处理过程；对物理符号系统假设持反对意见的研究者认为，人脑不同于计算机，并提出了联结主义的大脑工作模式，用于取代符号操作的计算机工作模式。联结主义主张人工智能应注重结构模拟，即模拟人的生理神经网络结构，并且功能、结构与智能行为是密切相关的，不同的结构表现出不同的功能和行为。目前，研究人员已经提出了多种人工神经网络结构和众多的学习算法。\n\
    \n联结主义以分布式的方式存储信息，以并行的方式处理信息，具有自组织、自学习能力，适合于模拟人的形象思维，可以比较快地得到一个近似解。正是这些特点，使得神经网络为人们在利用机器加工处理信息方面提供了一个全新的方法和途径。但是这种方法不适合模拟人们的逻辑思维过程，并且已有的模型和算法存在一定的问题，理论上的研究也有一定的难度，因此单靠连接机制解决人工智能的全部问题并不现实。\n\
    \n联结主义的代表性成果是 MP 模型，并由此组成一种前馈网络。可以说，MP 模型是人工神经网络最初的模型，开创了神经计算的时代，为人工智能创造了一条用电子装置模拟人脑结构和功能的新途径。从\
    \ Hopfield 神经网格模型和 BP 算法开始，神经网络理论和技术研究不断发展，并在图像处理、模式识别等领域取得重要突破，为实现联结主义的智能模拟创造了条件。\n\
    \n联结主义的主要特征如下。\n\n+   1）通过神经元之间的并行协作实现信息处理，处理过程具有并行性、动态性和全局性。\n+   \n+   2）可以实现联想功能，便于对有噪声的信息进行处理。\n\
    +   \n+   3）可以通过对神经元之间连接强度的调整实现学习和分类等。\n+   \n+   4）适合模拟人类的形象思维过程。"
