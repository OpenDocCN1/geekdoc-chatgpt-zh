    +   如果金属分子距离加大，那么金属体积就会增大；

    +   所以，金属受热体积增大。


    归纳推理是人类思维活动中最基本、最常用的一种推理形式。归纳推理增加了知识，因此在机器学习中，归纳推理也称为归纳学习。


    归纳学习是符号学习中研究得最为广泛的一种方法，它能够获得新的概念，创立新的规则，发现新的理论。在机器学习领域，一般将归纳学习问题描述为使用训练实例以引导一般规则的搜索问题。全体的可能实例构成实例空间，全体可能的一般规则构成规则空间。基于规则空间和实例空间的学习就是在规则空间中搜索要求的规则，并从实例空间中选出一些实际的例子，以便解决规则空间中某些规则的二义性问题。学习的过程就是完成实例空间和规则空间之间协调的搜索，最终找到要求的规则。


    # (3) 默认推理


    默认推理又称缺省推理，是在知识不完全的情况下，假设某些条件已经具备所进行的推理。其通常的形式是，如果没有证据证明结论不成立，则认为结论是成立的。例如，在条件
    A 成立的情况下，如果没有足够的证据证明条件 B 不成立，则默认 B 是成立的，并在此默认的前提下进行推理。由于这种推理允许默认某些条件是成立的，因此摆脱了需要知道全部有关事实才能进行推理的约束，使得在知识不完全的情况下也能进行推理。在默认推理过程中，如果到某一时刻，人们发现原先所做的默认不正确，则要撤销所做的默认及由此默认推出的所有结论，按新情况重新进行推理。


    例如，默认推理的经典例子是“鸟通常会飞”。这个规则在标准逻辑中可以表达为'
