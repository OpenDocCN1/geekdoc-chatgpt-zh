  md: '# (2) 混合 EDA


    多种智能算法取长补短相互结合往往可以取得很好的实用效果。当前除 EDA 外，还有蚁群优化算法、粒子群优化算法和差分进化（differential evolution，DE）算法等，这些智能算法各有自己的独特之处，有的适合解决连续性问题，有的适合解决离散性问题，而有的具有较强的局部搜索能力。下面介绍几种取长补短的典型算法。


    +   1) EDA 与遗传算法结合。EDA 与遗传算法都是基于种群的进化算法，它们的不同之处在于生成种群的机制各异。为了验证哪一种算法的性能更优，洛扎诺等学者曾设计了多种问题进行测试，测试结果表明没有一个算法对解决所有问题都是最优的。基于该研究结论，佩南（peña）于
    2004 年提出一种简单有效的混合 EDA——GA-EDA。在 GA-EDA 中，新的种群由 GA 和 EDA 共同生成。具体地说，GA 和 EDA 是先在同一个种群的基础上按照各自的机制分别产生两个子种群，然后将这两个子种群组合成新的种群，如此完成一代的进化过程。仿真结果显示，这种简单的混合机制也能取得良好的效果。


    +   2) EDA 与差分进化算法结合。差分进化算法是一种基于种群的随机搜索算法，它利用当前种群之间的差异信息来引导搜索。随着进化代数的增加，个体之间的差异性将越来越小，而简单的差分进化算法缺乏有效的机制以有效利用和产生搜索空间中的全局信息，因而常常会收敛于局部最优解。另外，EDA
    利用种群的全局信息建立概率模型，从“宏观”上控制算法搜索。因此，结合差分进化算法和 EDA 可以有效地利用局部信息和全局信息，形成功能更加强大的混合算法。


    # 4. EDA 的应用


    EDA 从“宏观”的角度来引导算法进行搜索，这种全新的进化机制在实际应用中常常表现出比遗传算法更好的性能。尤其是在解决复杂的大规模优化问题时，EDA 能够以较快的速度收敛于全局最优解。因此，应用
    EDA 解决科学与工程中的复杂优化问题是当前的一个研究热点。EDA 目前已经成功应用于组合优化、机器学习、模式识别和生物信息等众多领域。


    +   (1) 函数优化


    面对目标函数比较复杂或不可导等情况，传统的数值优化方法如最速下降法、牛顿法无力解决，取而代之的是遗传算法等启发式进化算法。与其他启发式进化算法相比，EDA
    能够更有效地保护个体信息中的“积木块”，使之不被破坏，因而在求解高维的复杂函数优化问题时，往往能够以更快的速度收敛于全局最优解。此外，在具有先验知识的情况下，还可以有针对性地选择概率模型，设计出性能更加优越的
    EDA。


    +   (2) 组合优化


    组合优化问题是一类离散最优化问题。典型的组合优化问题有 TSP、作业调度问题和最大流问题等。传统的进化算法如遗传算法和模拟退火算法等已成功解决了大量复杂的组合优化问题。随着
    EDA 的兴起，其在组合优化领域的应用也逐步发展起来。


    # 6.2.5 粒子群优化算法


    粒子群优化算法是肯尼迪和埃伯哈特受人工生命研究结果的启发，通过模拟鸟群觅食过程中的迁徙和群聚行为而提出的一种基于群体智能的全局随机搜索算法。'
