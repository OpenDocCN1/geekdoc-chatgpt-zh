    由于 $0.052 > 6.80 \times 10^{-5}$，因此朴素贝叶斯分类器将测试样本“测 1”判别为“好瓜”。


    需注意的是，若某个属性值在训练集中没有与某个类同时出现过，则直接基于式（8.75）进行概率估计，再根据式（8.73）进行判别将出现问题。例如，在使用西瓜数据集训练朴素贝叶斯分类器时，对一个“敲声=清脆”的测试例，有
    $$P_{\text{清脆}} = P(\text{敲声=清脆 | 好瓜=是}) = \frac{0}{8} = 0$$


    由于式（8.73）的连乘式计算出的概率值为零，因此无论该样本的其他属性是什么，哪怕在其他属性上明显像好瓜，分类的结果都将是“好瓜=否”，这显然不太合理。


    为了避免其他属性携带的信息被训练集中未出现的属性值抹去，在估计概率值时通常要进行平滑（smoothing）处理，常用拉普拉斯修正（Laplacian correction）。具体来说，令
    $N$ 表示训练集 $D$ 中可能的类别数，$N_i$ 表示第 $i$ 个属性可能的取值数，则式（8.74）和式（8.75）分别修正为


    $$\hat{P}(c) = \frac{|D_c| + 1}{|D| + N} \quad \text{(8.77)}$$\n$$

    \hat{P}(x_i|c) = \frac{|D_{c, x_i}| + 1}{|D_c| + N_i} \quad \text{(8.78)}$$


    例如，在本节的例子中，类先验概率可估计为 $$\hat{P}(\text{好瓜=是}) = \frac{8+1}{17+2} \approx 0.474$$
    $$

    \hat{P}(\text{好瓜=否}) = \frac{9+1}{17+2} = 0.526$$


    类似地，$P_{\text{青绿|是}}$ 和 $P_{\text{青绿|否}}$ 可估计为 $$\hat{P}_{\text{青绿|是}} = \hat{P}(\text{色泽=青绿
    | 好瓜=是}) = \frac{3+1}{8+3} \approx 0.364$$ $$

    \hat{P}_{\text{青绿|否}} = \hat{P}(\text{色泽=青绿 | 好瓜=否}) = \frac{3+1}{9+3} \approx
    0.333$$


    同时，上文提到的概率 $P_{\text{清脆|是}}$ 可估计为 $$\hat{P}_{\text{清脆|是}} = \hat{P}(\text{敲声=清脆
    | 好瓜=是}) = \frac{0+1}{8+3} \approx 0.091$$


    显然，拉普拉斯修正避免了因训练集样本不充分而导致概率估值为零的问题，并且在训练集变大时，修正过程中所引入的先验的影响也会逐渐变得可忽略，使估值渐趋向于实际概率值。


    在现实任务中，朴素贝叶斯分类器有多种使用方式。例如，若任务对预测速度要求较高，则对给定训练集，可将朴素贝叶斯分类器涉及的所有概率估值事先计算好存储起来，这样在进行预测时只需“查表”即可进行判别；若任务数据更替频繁，则可采用懒惰学习'
