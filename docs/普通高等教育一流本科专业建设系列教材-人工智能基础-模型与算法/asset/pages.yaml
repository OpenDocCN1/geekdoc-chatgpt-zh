- pgno: 274
  md: '$(x - \hat{\mu}_c)(x - \hat{\mu}_c)^\text{T}$ 的均值，这显然是一个符合直觉的结果。在离散属性情形下，可通过类似的方式估计类条件概率。


    需要注意的是，这种参数化的方法虽然能使类条件概率估计变得相对简单，但估计结果的准确性严重依赖所假设的概率分布形式是否符合潜在的真实数据分布。在现实应用中，想要做出能较好地接近潜在真实分布的假设，往往需在一定程度上利用关于应用任务的经验知识，否则若仅凭“猜测”来假设概率分布形式，很可能产生误导性的结果。


    # 3. 朴素贝叶斯分类器


    不难发现，基于贝叶斯公式[式（8.66）]估计后验概率 $P(c|x)$ 的主要困难在于，类条件概率 $P(x|c)$ 是所有属性上的联合概率，难以从有限的训练样本直接估计而得。为避开这个障碍，朴素贝叶斯分类器（naive
    Bayes classifier）用了属性条件独立性假设（attribute conditional independence assumption），即对已知类别假设所有属性相互独立。换言之，假设每个属性独立地对分类结果产生影响。


    基于属性条件独立性假设，式（8.66）可重写为


    $P(c|x) = \frac{P(c)P(x|c)}{P(x)} = \frac{P(c)}{P(x)} \sum_{i=1}^d P(x_i|c)$ （8.72）


    式中，$d$ 为属性数目；$x_i$ 为 $x$ 在第 $i$ 个属性上的取值。


    由于对所有类别来说 $P(x)$ 相同，因此基于式（8.64）的贝叶斯判定准则有


    $h_{nb}(x) = \underset{c \in y}{\text{argmax}} P(c) \prod_{i=1}^d P(x_i|c)$ （8.73）


    这就是朴素贝叶斯分类器的表达式。


    显然，朴素贝叶斯分类器的训练过程就是基于训练集 $D$ 来估计类先验概率 $P(c)$，并为每个属性估计条件概率 $P(x_i|c)$。


    令 $D_c$ 表示训练集 $D$ 中第 $c$ 类样本组成的集合，若有充足的独立同分布样本，则可容易地估计出类先验概率：


    $P(c) = \frac{|D_c|}{|D|}$ （8.74）


    对离散属性而言，令 $D_{c, x_i}$ 表示 $D_c$ 中在第 $i$ 个属性上取值为 $x_i$ 的样本组成的集合，则条件概率 $P(x_i|c)$
    可估计为


    $P(x_i|c) = \frac{|D_{c, x_i}|}{D_c}$ （8.75）


    对连续属性可考虑概率密度函数，假定 $P(x_i|c) \sim N(\mu_{c,i}, \sigma_{c,i}^2)$，其中 $\mu_{c,i}$
    和 $\sigma_{c,i}^2$ 分别是第 $c$ 类样本在第 $i$ 个属性上取值的均值和方差，则有


    $P(x_i|c) = \frac{1}{\sqrt{2\pi}\sigma_{c,i}} \exp \left[ -\frac{(x_i - \mu_{c,i})^2}{2\sigma_{c,i}^2}
    \right]$ （8.76）


    下面用表 8.6 训练一个朴素贝叶斯分类器，对测试例“测 1”进行分类。


