- pgno: 75
  md: '算法就是可采纳的，只是其搜索效率不高。


    # 2. 启发式函数的强弱及其影响


    首先引入评价函数 f*：


    f*(x) = g*(x) + h*(x) (3.17)


    式中，f*(x)、g*(x)、h*(x) 分别为当经由节点 x 的最短（代价最小）解答路径找到时实际的路径代价（长度）、该路径前段（自初始状态节点到节点 x）代价和后段（自节点
    x 到目标状态节点）代价。


    在存在多个目标状态的情况下，h*(x) 取 h*(x, x_g) 中最小者 (i=1,2,...)。


    可以用 h(x) 接近 h*(x) 的程度衡量启发式函数的强弱。当 h(x) < h*(x) 且两者差距较大时，h(x) 过弱，从而导致 OPEN 表中节点排序的误差较大，易于产生较大的搜索图；反之，当
    h(x) < h*(x) 时，则 h(x) 过强，使 A* 算法失去可采纳性，从而不能确保找到最短解答路径。显然，设计恒等于 h*(x) 的 h(x) 是最理想的，可确保产生最小的搜索图（因为
    OPEN 表中节点的排序正确），且搜索到的解答路径是最短的。


    对于复杂的问题求解任务，设计恒等于 h*(x) 的 h(x) 是不可能的。为此，取消恒等约束，设计接近又总是不大于 h*(x) 的 h(x) 成为应用 A*
    算法搜索问题解答的关键，以压缩搜索图，提高搜索效率。可以证明，对于解决同一问题的两个算法 A1 和 A2，若总有 h1(x) <= h2(x) <= h*(x)，则
    t(A1) >= t(A2)。其中，h1、h2 分别为算法 A1 和 A2 的启发式函数，t 为相应算法达到目标状态时搜索图包含的节点总数。再以八数码游戏为例，因为
    w(x) <= p(x) <= h1(x) <= h2(x) <= h*(x)，所以采用 p(x) 扩展出的节点总数不会比采用 w(x) 时多。更明显的例子是采用宽度优先搜索解决八数码问题，其相当于
    h(x) = 0，则图 3.13 中的搜索树会变得比采用 w(x) 时庞大得多。


    # 3. 设计 h(x) 的实用考虑


    随着问题求解任务复杂程度的增加，即便是设计接近又总是不大于 h*(x) 的 h(x) 也变得更困难，而且往往会导致在 h(x) 上的繁重计算工作量。若 h(x)
    的计算开销过大，即使最短路径找到了，实际的搜索代价也会居高不下，因为路径选择代价随 h(x) 的计算开销而增大。删除 h(x) <= h*(x) 的约束，会使
    h(x) 的设计容易得多，却由此丢失了可采纳性（可能丢失最短解答路径）。不过在许多实用场合，人们并不要求找到最优解答（最短解答路径），通过牺牲可采纳性来换取
    h(x) 设计的简化和减少计算 h(x) 的工作量还是可行的。


    从评价函数 f(x) = g(x) + h(x) 可以看出，若 h(x) = 0，则意味着先进入 OPEN 表的节点会优先被考察和扩展，因为即使不以 d(x)
    作为 g(x)，通常先进入 OPEN 表的节点也具有较小的 g(x) 值，从而使搜索过程接近于宽度优先搜索策略；反之，若 g(x) = 0，则导致后进入 OPEN
    表的节点会优先被考察和扩展，因为后进入 OPEN 表的节点往往更接近目标状态，即 h(x) 值较小，从而使搜索过程接近于深度优先搜索策略。


    为了更有效地搜索解答，可使用评价函数 f(x) = g(x) + w h(x)，其中 w 用作加权。在搜索图的浅层（上部），可让 w 取较大值，以使 g(x)
    所占比例很小，从而突出启发式函数的作用，加速向纵深方向搜索；一旦搜索到较深的层次，又让 w 取较小值，以使 g(x) 所占比例很大，并确保 w h(x) <=
    h*(x)，从而引导搜索向横广方向发展，寻找到较短的解答路径。'
