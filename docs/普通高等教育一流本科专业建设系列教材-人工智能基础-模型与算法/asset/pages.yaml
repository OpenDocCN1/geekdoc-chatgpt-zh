- pgno: 136
  md: '进行不确定性的推理占有重要地位。在许多不确定性推理的数学方法中，目前常用的主要有基于概率的似然推理（plausible reasoning）、基于模糊数学的模糊推理（fuzzy
    reasoning）、可信度方法，以及使用人工神经网络算法、遗传算法的计算推理等。


    # 5.2 不确定性推理方法


    长期以来，概率论的有关理论和方法都被用作度量不确定性的重要手段，因为它不仅有完善的理论，而且还为不确定性的合成与传递提供了现成的公式，因而它被最早用于不确定性知识的表示与处理。像这样纯粹用概率模型表示和处理不确定性的方法称为纯概率方法或概率方法。


    纯概率方法虽然有严格的理论依据，但通常要求给出事件的先验概率和条件概率，而这些数据又不易获得，因此使其应用受到限制。人们又在概率论的基础上提出了一些新的理论和方法，主要有主观贝叶斯方法、可信度方法、证据理论（evidential
    theory）方法、模糊推理方法等，从而为不确定性的传递和合成提供了计算方法。本节主要介绍不确定性推理方法的概念和计算过程。


    # 5.2.1 概率方法


    概率方法通过计算和估计事件发生的可能性，为决策提供有用信息，以解决不确定性问题。经典概率方法和逆概率方法法是重要且常用的概率方法，它们在统计学、机器学习、人工智能等领域都有广泛的应用。


    +   1. 经典概率方法


    设有如下产生式规则：


    ```

    IF E THEN H

    ```


    式中，E 为前提条件；H 为结论。


    条件概率 P(H|E) 可以作为在证据 E 出现时结论 H 的确定性程度，即规则的静态强度。


    对于复合条件


    ```

    E = E1 AND E2 AND ... En

    ```


    当条件概率 P(H | E1, E2, ..., En) 已知时，它就可以作为在证据 E1, E2, ..., En 出现时结论 H 的确定性程度。先验概率
    P(H) 经计算后得到后验概率 P(H | E)。


    显然，这是一种简单的方法，只能用于简单的不确定性推理。由于它只考虑证据为“真”或“假”这两种极端情况，因此其应用受到了限制。


    +   2. 逆概率方法


    经典概率方法要求给出在证据 E 出现的情况下，结论 H 的条件概率 P(H | E)，这在实际应用中是相当困难的。逆概率方法是根据贝叶斯公式，用逆概率 P(E
    | H) 求原概率 P(H | E)。确定逆概率比确定原概率要容易。例如，若以 E 代表咳嗽，以 Hi 代表支气管炎，要得到条件概率 P(Hi | E)，就需要统计在咳嗽的人中有多少是患支气管炎的，统计工作量较大；而得到逆概率
    P(E | Hi) 相对容易，因为这时仅需要统计在患支气管炎的人中有多少人是咳嗽的，患支气管炎的人毕竟比咳嗽的人少很多。'
