    \ 的归结式，称 $C_1$ 和 $C_2$ 为 $C_{12}$ 的亲本子句。\n\n**例 4.8** 设 $C_1 = P \\lor Q \\lor\
    \ R$，$C_2 = \neg P \\lor S$，求 $C_1$ 和 $C_2$ 的归结式 $C_{12}$。\n\n**解** 这里 $L_1 =\
    \ P$，$L_2 = \neg P$，通过归结可以得到 $C_{12} = Q \\lor R \\lor S$。如果改变归结顺序，那么同样可以得到相同的结果，即其归结过程不是唯一的。\n\
    \n**定理 4.2** 归结式 $C_{12}$ 是亲本子句 $C_1$ 和 $C_2$ 的逻辑蕴含。\n\n该定理是归结原理中的一个重要定理，由它可以得到如下两个推论。\n\
    \n**推论 4.1** 设 $C_1$ 和 $C_2$ 是子句集 $S$ 中的两个子句，$C_{12}$ 是 $C_1$ 和 $C_2$ 的归结式，若用\
    \ $C_{12}$ 代替 $C_1$ 和 $C_2$ 后得到新的子句集 $S_1$，则由 $S_1$ 的不可满足性可以推出原子句集 $S$ 的不可满足性，即\n\
    $S_1$ 的不可满足性 $\\Rightarrow S$ 的不可满足性\n\n**推论 4.2** 设 $C_1$ 和 $C_2$ 是子句集 $S$ 中的两个子句，$C_{12}$\
