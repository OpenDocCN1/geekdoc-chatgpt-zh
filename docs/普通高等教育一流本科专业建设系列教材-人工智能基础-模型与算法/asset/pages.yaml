  md: '识，就要用知识库中的知识与数据库中的已知事实进行匹配，为此就需要确定匹配的方法。匹配通常难以做到完全一致，因此还需要解决怎样才算是匹配成功的问题。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_107_0.png)


    图 4.1 正向推理的推理过程


    # 2. 逆向推理


    逆向推理是以某个假设目标作为出发点的一种推理。


    逆向推理的基本思想是首先选定一个假设目标，然后寻找支持该假设的证据。若所需的证据都能找到，则说明原假设是成立的；若无论如何都找不到所需的证据，则说明原假设不成立，此时需要另做新的假设。逆向推理的推理过程如图
    4.2 所示。


    逆向推理过程算法描述如下。


    +   1）提出要求证明的目标（假设）。

    +   2）检查该目标是否已在数据库中，若在，则该目标成立，推出推理或者对下一个假设目标进行验证；否则，转下一步。

    +   3）判断该目标是否是证据，即其是否为应由用户证实的原始事实，若是，则询问用户；否则，转下一步。

    +   4）在知识库中找出所有能导出该目标的知识，形成适用的知识集，然后转下一步。

    +   5）从知识集中选出一条知识，并将该条知识的运用条件作为新的假设目标，然后转向 2)。


    与正向推理相比，逆向推理要更复杂一些。在验证一个运用条件时，需要把它当作新'
  merge: -1
  img_proc: true
- pgno: 108
  md: '的假设，并查找可导出该假设的知识，这样就会产生一组新的运用条件，形成一个树状结构。当到达叶节点时，还需要逐层向上返回，过程中有可能还要再下沉到叶节点。这样上下反复多次，才能得出原假设是否成立的结论。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_108_0.png)


    图 4.2 逆向推理的推理过程


    逆向推理的主要优点是不必使用与目标无关的知识，目的性强，同时它还有利于向用户提供解释；其主要缺点是目标的选择有盲目性，若不符合实际，就要多次提出假设，影响系统的效率。


    # 3. 混合推理


    正向推理具有盲目、效率低等缺点，推理过程中可能会推出许多与问题无关的子目标。在逆向推理中，若提出的假设目标不符合实际，也会降低系统的效率。为解决这些问题，可以把正向推理与逆向推理结合起来，使它们各自发挥自己的优势，取长补短。这种既有正向又有逆向的推理称为混合推理。另外，在下述几种情况下，通常也需要进行混合推理。


    +   (1) 已知的事实不充分


    当数据库中的已知事实不够充分时，若用这些事实与知识的运用条件相匹配进行正向推理，可能连一条运用知识都选不出来，这就使推理无法进行下去。此时，可通过正向推理先把其运用条件不能完全匹配的知识都找出来，并把这些知识可导出的结论作为假设；然后分别对这些假设进行逆向推理，由于在逆向推理中可以向用户询问有关证据，因此就有可能使推理进行下去。


    +   (2) 正向推理推出的结论可信度不高


    用正向推理进行推理时，虽然推出了结论，但可信度可能不高，达不到预定的要求。为了得到一个可信度符合要求的结论，可用这些结论作为假设，进行逆向推理，通过向用'
  merge: -1
  img_proc: true
- pgno: 109
  md: '户询问进一步的信息，有可能得到一个可信度较高的结论。


    # (3) 对于结论的需求增大


    在逆向推理过程中，由于要与用户进行对话，有针对性地向用户提出询问，因此就有可能获得一些原来没有掌握的有用信息。这些信息不仅可用于证实要证明的假设，同时还有助于推出一些其他结论。因此，在用逆向推理证实了某个假设之后，可以再用正向推理推出另外一些结论。例如，在医疗诊断系统中，先用逆向推理证实某病人患有某种病，然后利用逆向推理过程中获得的信息进行正向推理，就有可能推出该病人还患有别的什么病。


    由以上讨论可以看出，混合推理分为两种情况：一种是先进行正向推理，帮助选择某个目标，即从已知事实演绎出部分结果；然后用逆向推理证实该目标或提高其可信度。另一种情况是先假设一个目标进行逆向推理；然后利用逆向推理得到的信息进行正向推理，以推出更多的结论。


    # 4. 双向推理


    在定理的机器证明等问题中经常采用双向推理。双向推理是指正向推理与逆向推理同时进行，且在推理过程中的某一步骤上“碰头”的一种推理。其基本思想是，一方面根据已知事实进行正向推理，但并不推到最终目标；另一方面从某假设目标出发进行逆向推理，但并不推至原始事实，而是让它们在中途相遇，即由正向推理所得到的中间结论恰好是逆向推理此时所要求的证据，这时推理就可以结束，逆向推理时所做的假设就是推理的最终结论。


    双向推理的困难在于“碰头”判断。另外，如何权衡正向推理与逆向推理的比例，即如何确定“碰头”的时机也是一个难题。


    # 4.1.4 冲突消解策略


    在推理过程中，系统要不断地用当前已知的事实与知识库中的知识进行匹配。此时，可能发生以下 3 种情况。


    +   1) 已知事实恰好只与知识库中的一个知识匹配成功。

    +   2) 已知事实不能与知识库中的任何知识匹配成功。

    +   3) 已知事实可与知识库中的多个知识匹配成功。或者多个（组）已知事实都可与知识库中的某一个知识匹配成功，或者有多个（组）已知事实可与知识库中的多个知识匹配成功。


    已知事实与知识库中的知识匹配成功的含义，对正向推理而言，是指产生式规则的<前件>和已知事实匹配成功；对逆向推理而言，是指产生式规则的<后件>和假设匹配成功。


    对于第 1 种情况，由于匹配成功的知识只有一个，因此它就是可应用的知识，可直接把它应用于当前的推理。


    当第 2 种情况发生时，由于找不到可与当前已知事实匹配成功的知识，使得推理无法继续进行下去。这或者是由于知识库中缺少某些必要的知识，或者由于要求解的问题超出了系统功能范围等，此时可根据当前的实际情况做出相应的处理。


    第 3 种情况刚好与第 2 种情况相反，推理过程中不仅有知识匹配成功，而且有多个知识匹配成功，称为发生了冲突。按一定的策略从匹配成功的多个知识中挑出一个知识用于'
