  md: '# # 第 8 章 机器学习


    学习是人类获取知识的重要途径和人类智能的重要标志，机器学习是计算机获取知识的重要途径和人工智能的重要途径，知识获取一直是人工智能系统的一个“瓶颈”，解决这个问题的关键在于如何提高计算机的学习能力。


    # ## 8.1 机器学习的类型与应用


    随着人工智能的发展，越来越多的行业开始应用机器学习技术。那么机器学习有哪些类型？机器学习应用和研究的目标有哪些？


    # ### 8.1.1 机器学习的分类


    机器学习可从不同的角度，根据不同的方式进行分类。例如，若按系统的学习能力分类，机器学习可分为监督学习、强化学习和非监督学习（监督学习和非监督学习的主要区别是前者在学习时需要教师的示教或训练，而后者是用评价标准代替人的监督工作）；若按所学知识的表示方式分类，机器学习可分为逻辑表示法学习、产生式表示法学习、框架表示法学习等；若按机器学习的应用领域分类，机器学习可分为专家系统、自然语言处理、图像识别、博弈、数学、音乐等；若按学习方法是否为符号表示来分类，机器学习可分为符号学习与非符号学习。


    下面讨论几种当前常用的分类方法。


    +   1. 按学习方法分类


    正如人们有各种各样的学习方法一样，机器学习也有多种学习方法。若按学习时所用的方法进行分类，机器学习可分为机械式学习、指导式学习、示例学习、类比学习、解释学习等。这是温斯顿在
    1977 年提出的一种分类方法。


    +   2. 按学习能力分类


    +   (1) 监督学习


    监督学习（有教师学习）框图如图 8.1 所示。监督学习系统中根据“教师”提供的正确响应，调整学习系统的参数和结构。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_243_0.png)


    图 8.1 监督学习框图'
