  md: '是以信息熵（information entropy）为度量，用于决策树节点的属性选择，每次优先选取信息量最多的属性或者说能使熵值变成最小的属性，以构造一棵熵值下降最快的决策树，到叶子节点处的熵值为
    0。此时，每个叶子节点对应的实例集中的实例属于同一类。


    # （1）信息熵和条件熵


    ID3 算法将实例集视为一个离散的信息系统，用信息熵表示其信息量。将实例集中实例的结论视为随机事件，而将诸属性看作加入的信息源。


    设 $S$ 是一个实例集（$S$ 也可以是子实例集），$A$ 为 $S$ 中实例的一个属性。$H(S)$ 和 $H(S|A)$ 分别称为实例集 $S$ 的信息熵和条件熵，其计算公式如下：

    $H(S) = -\sum_{i=1}^n P(\mu_i) \text{lb}P(\mu_i)$ （8.5）


    式中，$\mu_i$ 为 $S$ 中各实例所有可能的结论；lb 为 $\text{log}_2$。

    $H(S|A) = \sum_{k=1}^m \frac{|S_{a_k}|}{|S|} H(S_{a_k})$ （8.6）


    式中，$a_k$ 为属性 $A$ 的取值；$S_{a_k}$ 为按属性 $A$ 对实例集 $S$ 进行分类时所得子类中与属性值 $a_k$ 对应的子类。


    # （2）基于条件熵的属性选择


    下面介绍 ID3 算法中用条件熵指导属性选择的具体做法。


    对于一个待分类的实例集 $S$，先分别计算各可取属性 $A_j (j=1,2,\cdots,l)$ 的条件熵 $H(S|A_j)$，然后取其中条件熵最小的属性
    $A_k$ 作为当前节点。


    例如，对于上例，当第一次对实例集 $S$ 进行分类时，可选取的属性有性别、年龄段和婚状。首先分别计算 $S$ 的条件熵。


    按性别划分，实例集 $S$ 被分为两个子类：

    $S_{男} = \{(3,C),(4,B),(7,C),(8,B),(11,B),(12,B)\}$ （8.7）

    $S_{女} = \{(1,C),(2,C),(5,A),(6,A),(9,A),(10,A)\}$ （8.8）


    从而，对于子集 $S_{男}$ 而言，有

    $P(A)=\frac{0}{6}=0, \quad P(B)=\frac{4}{6}, \quad P(C)=\frac{2}{6}$


    对子集 $S_{女}$ 而言，有

    $P(A)=\frac{4}{6}, \quad P(B)=\frac{0}{6}=0, \quad P(C)=\frac{2}{6}$


    于是，由式（8.5）有

    $H(S_{男}) = -[P(A)\text{lb}P(A) + P(B)\text{lb}P(B) + P(C)\text{lb}P(C)]$

    $= -[0 \times \text{lb}(\frac{0}{6}) + \frac{4}{6} \times \text{lb}(\frac{4}{6})
    + \frac{2}{6} \times \text{lb}(\frac{2}{6})]$

    $= -[0 + \frac{4}{6} \times (-0.5850) + \frac{2}{6} \times (-1.5850)]$

    $= -(-0.39 - 0.5283)$

    $= 0.9183$'
