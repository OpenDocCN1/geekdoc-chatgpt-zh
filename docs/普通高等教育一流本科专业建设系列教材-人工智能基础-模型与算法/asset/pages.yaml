    # 3. 模糊关系的合成


    对于任意两个元素，它们之间或存在关系，或不存在关系，没有第三种可能，这就是“清晰确定”的关系。但在实际情况下，有不少关系很难简单地用“有无”来衡量，必须引入一定的量来表示两元素之间具有这种关系的程度。例如，正常人的身高与体重之间是有'
