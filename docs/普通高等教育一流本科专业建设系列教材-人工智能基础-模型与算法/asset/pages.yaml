    图 3.6 八数码问题的一次搜索图


    搜索空间的压缩程度主要取决于搜索引擎采用的搜索算法。换言之，当问题有解时，使用不同的搜索策略找到解答路径时，搜索图的大小是有区别的。一般来说，对于状态空间很大的问题，设计搜索策略的关键考虑是解决组合爆炸问题。复杂的问题求解任务往往涉及许多解题因素，问题状态可以通过解题因素的特别组来加以表示（解题因素可设计为状态变量，如传教士和野人问题中的
    m，c 和 b）。组合爆炸意指解题因素多时，因素的可能组合个数会爆炸性（指数级）增长，引起状态空间的急剧膨胀。例如，某问题有 4 个因素，且每个因素有 3
    个可选值，则因素的组合（问题状态）有 34=81 个；若因素增加到 10 个，则组合的个数达 310 = 34 × 36 = 81 × 729，即状态空间扩大了
    729 倍。解决组合爆炸问题的方法实际上是选择好的搜索策略，使得只需要搜索状态空间的很小部分就能找到解答。


    # 3.2.3 一般图搜索过程


    一般图搜索过程是由尼尔森提出的一个著名的图搜索过程，是表达能力很强的一个搜索策略框架。在此过程中要用到 OPEN 表和 CLOSE 表。其中，OPEN 表用于待扩展的节点，节点进入
    OPEN 表中的排列顺序是由搜索策略决定的；CLOSE 表用于存放已经扩展的节点，当前节点进入 CLOSE 表的最后。

    为了给出一般图搜索过程，特做如下符号说明。


    +   S₀：初始状态节点。

    +   G：搜索图。

    +   OPEN：存放待扩展节点的表。

    +   CLOSE：存放已被扩展节点的表。

    +   Move-First(OPEN)：取 OPEN 表首的节点作为当前要扩展的节点 n，同时将节点 n 移至 CLOSE 表。'
