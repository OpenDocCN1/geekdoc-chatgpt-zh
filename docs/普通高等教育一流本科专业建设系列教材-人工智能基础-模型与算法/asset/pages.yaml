- pgno: 272
  md: '误分类为 \(c_i\) 所产生的损失。基于后验概率 \(P(c_i|x)\) 可获得将样本 \(x\) 分类为 \(c_i\) 所产生的期望损失（expected
    loss），即在样本 \(x\) 上的“条件风险”（conditional risk）。


    \(R(c_i|x) = \sum_{j=1}^N \lambda_{ij} P(c_j|x)\) (8.59)


    接下来的任务是寻找一个判定准则 \(h: X \rightarrow Y\)，以最小化总体风险：


    \(R(h) = E_x [R(h(x)|x)]\) (8.60)


    显然，对每个样本 \(x\)，若 \(h\) 能最小化条件风险 \(R[h(x)|x]\)，则总体风险 \(R(h)\) 也将被最小化。这就产生了贝叶斯判定准则（Bayes
    decision rule）：为最小化总体风险，只需在每个样本上选择能使条件风险 \(R(c|x)\) 最小的类别标记。


    用公式表示贝叶斯判定准则，即为


    \(h^*(x) = \arg \min_{c \in Y} R(c|x)\) (8.61)


    式中，\(h^*\) 为贝叶斯最优分类器（Bayes optimal classifier），与之对应的总体风险 \(R(h^*)\) 称为贝叶斯风险。


    1 - \(R(h^*)\) 反映了分类器所能达到的最好性能，即通过机器学习所能产生的模型精度的理论上限。


    具体来说，若目标是最小化分类错误率，则判别损失 \(\lambda_{ij}\) 可写为


    \(\lambda_{ij} = \begin{cases} 0, & i=j \\ 1, & \text{其他} \end{cases}\) (8.62)


    此时条件风险为


    \(R(c|x) = 1 - P(c|x)\) (8.63)


    于是，最小化分类错误率的贝叶斯最优分类器为


    \(h^*(x) = \arg \max_{c \in Y} P(c|x)\) (8.64)


    即对每个样本 \(x\)，选择能使后验概率 \(P(c|x)\) 最大的类别标记。


    不难看出，若使用贝叶斯判定准则最小化决策风险，首先要获得后验概率 \(P(c|x)\)。然而，在现实任务中后验概率通常难以直接获得。从这个角度来看，机器学习所要实现的是基于有限的训练样本集尽可能准确地估计出后验概率
    \(P(c|x)\)。大体来说，主要有两种策略：给定 \(x\)，可通过直接建模 \(P(c|x)\) 来预测 \(c\)，这样得到的是判别式模型（discriminative
    models）；也可以先对联合概率分布 \(P(x, c)\) 建模，然后由此获得 \(P(c|x)\)，这样得到的是生成式模型。显然，前面介绍的决策树、BP
    神经网络、支持向量机等都可归入判别式模型的范畴。对生成式模型来说，必然考虑


    \(P(c|x) = \frac{P(x, c)}{P(x)}\) (8.65)


    基于贝叶斯定理， \(P(c|x)\) 可写为


    \(P(c|x) = \frac{P(c)P(x|c)}{P(x)}\) (8.66)


    式中，\(P(c)\) 为类先验概率（class-prior probability）；\(P(c|x)\) 为样本 \(x\) 相对于类标记 \(c\)
    的类条件概率（class-conditional probability），或称为似然；\(P(x)\) 为用于归一化的证据（evidence）因子。


    对给定样本 \(x\)，证据因子 \(P(x)\) 与类标记无关，因此估计 \(P(c|x)\) 的问题就转化为如何基'
