    # 3）证据不确定。


    当 0 < P(E|S) < 1 时，可以证明


    P(H|S) = P(H|E) × P(E|S) + P(H|¬E) × P(¬E|S) (5.35)


    当 P(E|S) = 1 时，证据肯定存在，此时


    P(H|S) = P(H|E) (5.36)


    当 P(E|S) = 0 时，证据肯定不存在，此时


    P(H|S) = P(H|¬E) (5.37)


    当 P(E|S) = P(E) 时，证据 E 与观察 S 无关。由全概率公式得


    P(H|S) = P(H|E) × P(E) + P(H|¬E) × P(¬E) = P(H) (5.38)


    当 P(E|S) 为其他值时，通过分段线性插值计算 P(H|S)，即


    P(H|S) = \begin{cases} P(H|¬E) + \frac{P(H) - P(H|¬E)}{P(E)} × P(E|S), 0 \leqslant
    P(E|S) < P(E) \\ P(H) + \frac{P(H|E) - P(H)}{1 - P(E)} × [P(E|S) - P(E)], P(E)
    \leqslant P(E|S) \leqslant 1 \end{cases} (5.39)


    对于知识


    IF E THEN(LS,LN) H[P(H)]


    给定证据 E 的不确定性度量 P(E|S)，则结论的可信度可表示为


    P(H|S) = \begin{cases} P(H|¬E) + \frac{P(H) - P(H|¬E)}{P(E)} × P(E|S), 0 \leqslant
    P(E|S) < P(E) \\ P(H) + \frac{P(H|E) - P(H)}{1 - P(E)} × [P(E|S) - P(E)], P(E)
    \leqslant P(E|S) \leqslant 1 \end{cases} (5.40)


    该公式称为 EH 公式。用 C(E|S) 代替 P(E|S)，可得到等价的 CP 公式为


    P(H|S) = \begin{cases} P(H|¬E) + [P(H) - P(H|¬E)] × [\frac{1}{5} C(E|S) + 1],
    C(E|S) \leqslant 0 \\ P(H) + [P(H|E) - P(H)] × \frac{1}{5} C(E|S), C(E|S) > 0
    \end{cases} (5.41)


    # (5) 结论不确定性的合成算法


    若有 n 条知识都支持相同的结论，而且每条知识的前提条件所对应的证据 Ei(i = 1,2,...,n) 都有相应的观察 Ai 与之对应，此时只要先对每条知识分别求出几率函数
    O(H | Ai)，即可运用下述公式求出 O(H | A1 ∩ A2 ∩ ... ∩ An)。这就是多因一果时，计算一果的不确定度的方法：


    O(H | A1 ∩ A2 ∩ ... ∩ An) = \frac{O(H | A1)}{O(H)} × \frac{O(H | A2)}{O(H)} ×
    ... × \frac{O(H | An)}{O(H)} × O(H) (5.42)


    式中， A1 -> B, A2 -> B, ..., An -> B，且 A1, A2, ..., An 相互独立。


