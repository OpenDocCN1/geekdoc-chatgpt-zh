    以已知命题 $F$，证明命题 $G$ 为例，命题逻辑归结反演的过程如下。\n\n+   1) 否定目标公式 $G$，得 $\n+   eg G$。\n\n\
    +   2) 把 $\n+   eg G$ 并入公式集 $F$ 中，得到 $\\{F, \n+   eg G\\}$。\n\n+   3) 把 $\\{F,\
    \ \n+   eg G\\}$ 化为子句集 $S$。"
