    # 3.8 博弈


    广义的博弈涉及人类各方面的对策问题，如军事冲突、政治斗争、经济竞争等。博弈提供了一个可构造的任务领域，在该领域中具有明确的胜利和失败。同样，博弈问题对人工智能研究提出了严峻的挑战，例如，如何表示博弈问题的状态、博弈过程和博弈知识等。因此，在人工智能中，通过计算机下棋等研究博弈的规律、策略和方法是有实用意义的。


    机器博弈的研究广泛而深入。早在 20 世纪 50 年代就有人设想利用机器智能实现机器与人的博弈。国内外许多知名学者和科研机构都曾涉足这方面的研究，历经半个多世纪，到目前为止已经取得了许多惊人的成就。1997
    年，IBM 的“深蓝”战胜了国际象棋世界冠军卡斯帕罗夫，惊动了全世界。除此之外，加拿大阿尔伯塔大学的奥赛罗程序 Logistello 和西洋跳棋程序 Chinook
    也相继成为信息游戏世界冠军，而西洋双陆棋这样的存在非确定因素的棋类也有了 CMU 的西洋双陆棋程序 BKG 这样的世界冠军。对围棋、中国象棋、桥牌、扑克等多种游戏博弈的研究也正在进行中。


    这里讲的博弈是二人博弈，“二人零和、全信息、非偶然”博弈，博弈双方的利益是完全对立的。“二人零和”是指在博弈中只有敌、我两方，且双方的利益完全对立，其赢得函数之和为零，即


    ```

    \(\varphi_1 + \varphi_2 = 0\) （3.27）

    ```


    式中，\(\varphi_1\) 为我方赢得（利益）；\(\varphi_2\) 为敌方赢得（利益）。


    +   博弈的双方有 3 种结局。

    +   1) 我胜：\(\varphi_1 > 0\)；敌负：\(\varphi_2 = -\varphi_1 < 0\)。

    +   2) 我负：\(\varphi_1 = -\varphi_2 < 0\)；敌胜：\(\varphi_2 > 0\)。

    +   3) 平局：\(\varphi_1 = 0\)，\(\varphi_2 = 0\)。


    在博弈过程中，任何一方都希望自己胜利，双方都采用保险的博弈策略，在最不利的情况下，争取最有利的结果。因此，在某一方当有多个行动方案可供选择时，总是挑选对自己最为有利而对对方最为不利的行动方案。


    “全信息”是指博弈双方都了解当前的格局及过去的历史。


    “非偶然”是指博弈双方都可根据得失大小进行分析，选取我方赢得最大、敌方赢得最小的对策，而不是偶然的随机对策。


    另一种博弈是机遇性博弈，是指不可预测性的博弈，如掷硬币游戏等。这种博弈不在本节讨论的范围内。先来看一个例子，假设有 7 枚钱币，任一选手只能将已分好的一堆钱币分成两堆数量不等的钱币，两位选手轮流进行，直到每堆都只有一枚或两枚钱币，不能再分为止，哪个遇到不能再分的情况，则为输。


    用数字序列加上一个说明表示一个状态，其中数字表示不同堆中钱币的个数，说明表示下一步由谁来分，如(7, MIN)表示只有一个由 7 枚钱币组成的堆，由 MIN
    走，MIN 有 3 种可供选择的分法，即(6, 1, MAX)(5, 2, MAX)(4, 3, MAX)。MAX 表示另一对手走，不论哪一种方法，MAX
    都是在此基础上再进行符合要求的再分，整个过程如图 3.23 所示。'
