    = 1 - 0.3 = 0.7\)


    # 4. 组合规则


    有时对同样的证据会得到两个不同概率的分布函数，此时需要对它们进行组合。


    定义 5.4 设 \(M_1\) 和 \(M_2\) 是同一样本空间上的两个概率分配函数，则其正交和 \(M=M_1 \oplus M_2\) 为


    \(\left\{\begin{array}{l} M(\emptyset) = 0 \\ M(A) = K - \sum_{x \cap y = A} M_1(x)M_2(y)
    \\ K = 1 - \sum_{x \cap y = \emptyset} M_1(x)M_2(y) = \sum_{x \cap y \neq \emptyset}
    M_1(x)M_2(y) \end{array}\right.\) (5.64)


    如果 \(K \neq 0\)，则正交和 \(M\) 也是一个概率分配函数；如果 \(K=0\)，则不存在正交和 \(M\)，即没有可能存在概率函数，称 \(M\)
    与 \(M_2\) 矛盾。对于多个概率分配函数 \(M_1, M_2, \cdots, M_n\)，如果它们可以组合，也可通过正交和运算将它们组合为一个概率分配函数。


    例 5.7 设 \(\Omega = \{a, b\}\)，基于两组不同证据得到的基本概率分配函数为


    \(M_1(\{a\}) = 0.4, M_1(\{b\}) = 0.1, M_1(\{a, b\}) = 0.5\)


    \(M_2(\{a\}) = 0.6, M_2(\{b\}) = 0.2, M_2(\{a, b\}) = 0.2\)


    求 \(M(\{a\})\)、\(M(\{b\})\)、\(M(\{a, b\})\)。


    解


    \(K = 1 - \sum_{x \cap y = \emptyset} M_1(\{a\})M_2(\{b\})\)

    \(= 1 - [M_1(\{a\})M_2(\{b\}) + M_1(\{b\})M_2(\{a\})]\)

    \(= 1 - [0.4 \times 0.2 + 0.1 \times 0.6]\)

    \(= 0.86\)


    \(M(\{a\}) = K - \sum_{x \cap y = a} M_1(\{a\})M_2(\{b\})\)

    \(= \frac{1}{0.86}[M_1(\{a\})M_2(\{a\}) + M_1(\{a\})M_2(\{a, b\}) + M_1(\{a, b\})M_2(\{a\})]\)

    \(= 0.72\)


    同理，得


    \(M(\{b\}) = 0.16, M(\{a, b\}) = 0.12\)


    Dempster 规则的多证据组合和两个证据的组合是等效的，而且组合运算具有可交换性和可结合性。因此，多个证据的合成可通过递归运算得到，相关关系如图 5.3
    所示，其中图 5.3（a）为多证据组合结构，图 5.3（b）为两个证据组合结构。'
