- pgno: 246
  md: '技术术研究生生命现象和规律，而基因组计划的实施和基因药物的美好愿景让很多人投身其中。生物信息学研究涉及从“生命现象”到“规律发现”的整个过程，其间必然包括数据获取、数据管理、数据分析、仿真实验等环节，而“数据分析”恰好是机器学习技术的舞台，各种机器学习技术已经在这个舞台上大放异彩。


    机器学习已经与人类生活密切相关。例如，在天气预报、能源勘探、环境监测等方面，有效利用机器学习技术对卫星和传感器发回的数据进行分析，是提高预报和检测准确性的重要途径；在商业营销中，有效地利用机器学习技术对销售数据、客户信息进行分析，不仅可以帮助商家优化库存降低成本，还有助于针对用户群设计特殊营销策略等。


    众所周知，谷歌、百度等互联网搜索引擎叫嚣已开始改变人类的生活方式，如很多人已习惯于在出行前通过互联网搜索来了解目的地信息，寻找合适的酒店、餐馆等。美国《新闻周刊》曾对谷歌有一句话评论：“它使任何人离任何问题的答案间的距离变得只有点击一下鼠标这么远。”显然，互联网搜索是通过分析网络上的数据来找到用户所需的信息，在这个过程中，用户查询是输入，搜索结果是输出，而要建立输入与输出之间的联系，内核必然需要机器学习技术。到了今天，搜索的对象、内容日趋复杂，机器学习技术的影响更为明显，如在进行图片搜索时，无论谷歌还是百度，都在使用最新的机器学习技术。谷歌、百度、脸书、雅虎等公司纷纷成立专攻机器学习技术的研究团队，甚至直接以机器学习技术命名的研究院，充分体现出机器学习技术的发展和应用，甚至在一定程度上影响了互联网产业的走向。


    值得一提的是，机器学习备受瞩目当然是由于它已成为智能数据分析技术的创新源泉，但机器学习研究还有另一个不可忽视的意义，即通过建立一些关于学习的计算模型来促进人们理解“人类如何学习”。例如，芬兰裔美国神经科学家彭蒂·卡内尔瓦（Pentti
    Kanerva）在 20 世纪 80 年代中期提出稀疏分布式存储器（sparse distributed memory，SDM）模型时并没有刻意模仿脑生理结构，但后来神经科学的研究发现，稀疏分布式存储器的稀疏编码机制在视觉、听觉、嗅觉功能的脑皮层中广泛存在，从而为理解脑的某些功能提供了启发。自然科学研究的驱动力归结起来无外是人类对宇宙本源、万物本质、生命本性、自我本识的好奇，而“人类如何学习”是一个有关自我本识的重大问题。从这个意义上说，机器学习不仅在信息科学中占有重要地位，而且具有自然科学探索色彩。


    机器学习的研究目标有以下 3 点。


    +   1) 人类学习过程的认知模型：研究人类学习机理的认知模型，对人类的教育和对开发机器学习系统都有重要的意义。

    +   2) 通用学习算法：通过对人类学习过程的研究，探索各种可能的学习方法，开发具体应用领域的通用学习算法。

    +   3) 构造面向任务的专用学习系统：研究智能系统的构建，解决专门的实际问题，并开发完成这些专门任务的学习系统。


    # 8.2 基于规则的机器学习


    由于机器学习在解决模棱两可和具有挑战性的案例方面非常出色，因此只有在每种情况下都适用确定性规则并且模型不太大也不复杂的情况下，才可将确定性规则纳入模型中。基于规则的机器学习主要有决策树（decision
    tree）学习、随机森林及规则学习。'
