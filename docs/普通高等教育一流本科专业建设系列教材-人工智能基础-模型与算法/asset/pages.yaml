  md: '络，即当新情况发生时时，人们只要把新的数据加入该通用数据结构中便可形成一个具体的实体（类），这样的通用数据结构就称为框架。对于一个框架，当人们把观察或认识到的具体细节填入后，就得到了该框架的一个具体实例，框架的这种具体实例称为实例框架。在框架理论中，框架是知识的基本单位，把一组有关的框架联结起来便可形成一个框架系统。框架系统推理由框架之间的协调来完成。


    框架的最高层次是固定的，并且它描述对于假定情况总是正确的事物。在框架的较低层次上有许多终端，被称为槽（slots）。在槽中填入具体值，就可以得到一个描述具体事务的框架，每一个槽都可以有一些附加说明，被称为侧面（facet），其作用是指出槽的取值范围和求值方法等。一个框架中可以包含各种信息：描述事物的信息、如何使用框架的信息、关于下一步将发生什么情况的期望及如果期望的事件没有发生应该怎么办的信息等，这些信息包含在框架的各个槽或侧面中。


    一个具体事物可由槽中已填入的值来描述，具有不同槽值的框架可以反映某一类事物中的各个具体事物。相关的框架连接在一起形成了一个框架系统，框架系统中由一个框架到另一个框架的转换可以表示状态的变化、推理或其他活动。不同的框架可以共享同一个槽值，这种方法可以把不同角度搜集起来的信息较好地协调起来。


    顾名思义，框架就是一种结构，一种模式，其一般形式如下：


    ```

    <框架名>

    <槽名 1><槽值 1>|<侧面名 11><侧面值 111, 侧面值 112, ...>

    <侧面名 12><侧面值 121, 侧面值 122, ...>

    ...

    <槽名 2><槽值 2>|<侧面名 21><侧面值 211, 侧面值 212, ...>

    <侧面名 22><侧面值 221, 侧面值 222, ...>

    ...

    ...

    <槽名 k><槽值 k>|<侧面名 k1><侧面值 k11, 侧面值 k12, ...>

    |<侧面名 k2><侧面值 k21, 侧面值 k22, ...>

    ... ...

    ```


    也就是说，一个框架一般有若干个槽，一个槽有一个槽值或若干个侧面，而一个侧面又有若干个侧面值。其中，槽值和侧面值可以是数值、字符串、布尔值，也可以是一个动作或过程，甚至还可以是另一个框架的名字。


    # 例 2.5 下面是一个描述“教师”的框架。


    ```

    框架名：<教师>

    类属：<知识分子>

    工作：范围：（教学，科研）

    缺省：教学

    性别：（男，女）

    学历：（中师，高师）

    类型：（<小学教师>, <中学教师>, <大学教师>）

    ```


    可以看出，该框架的名字为“教师”，它含有 5 个槽，槽名分别是“类属”“工作”“性别”“学历”“类型”。这些槽名的右侧就是其值，如“<知识分子>”“男”“女”“中师”“高师”等。其中，“<知识分子>”又是一个框架名，“范围”“缺省”就是侧面名，其后是侧面值，如“教学”“科研”等。另外，用<>括起来的槽值也是框架名。


    # 例 2.6 下面是一个描述“大学教师”的框架。


    ```

    框架名：<大学教师>

    ```'
