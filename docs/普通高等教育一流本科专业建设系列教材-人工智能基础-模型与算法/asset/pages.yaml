    # 图 6.13 克隆选择算法


    的问题，把适应度看成抗体决定簇（抗体字符串）。IGA 算法流程如下。


    +   - 第 1 步，创建初始随机种群 \( A_1 \)。

    +   - 第 2 步，根据先验知识抽取疫苗。

    +   - 第 3 步，判断当前群体 \( A_k \) 是否包含最优个体，如果包含则停止算法，否则继续。

    +   - 第 4 步，对 \( A_k \) 执行交叉操作，形成临时群体 \( B_k \)。

    +   - 第 5 步，对 \( B_k \) 执行交叉操作，形成临时群体 \( C_k \)。

    +   - 第 6 步，对 \( C_k \) 注射疫苗，产生 \( D_k \)。

    +   - 第 7 步，在种群中进行免疫选择，得到成熟的下一代群体 \( A_k \)，然后返回第 3 步。


    IGA 与 GA 的不同之处如下。


    首先，注射疫苗。疫苗就是一个个体随机变异若干位得到的变异体，是根据先验知识得到的，有较高的概率得到更高的适应度。该算子有两个基本条件：①变异后的个体所有位置的字符均和最优解不同，那么变异成这个新个体的概率为
    0；②变异后的个体所有位置的字符均与最优解相同，那么变异成这个新个体的概率为 1。假定一个群体 \( C = \{x_1, x_2, \cdots, x_n\}\)，将有
    \( n^\times \) 个抗体被从群体里挑选出注射疫苗，其中 \( n^\times = n^* \alpha [\alpha \in (0, 1])\)。


    其次，免疫选择算子也分为两步：第一步称为免疫测试，如果新的个体适应度不如老的个体，则还是用老的个体参加后面的运算，否则就用新的个体；第二步称为退火选择，在当前的后代群体中根据式（6.14）用轮盘赌的思想选择一个个体
    \( x_i (i=1, 2, \cdots, n)\)，放入新的父种群 \( A_{k+1}\) 中。


    ```

    \( p(x_i) = \frac{e^{\frac{f(x_i)}{T_k}}}{\sum_{i=1}^n e^{\frac{f(x_i)}{T_k}}}
    \quad (6.14) \)

    ```


    式中，\( f(x_i) \) 为个体 \( x_i \) 的适应度值；\( T_k \) 为逐渐趋向于 0 的温度变量。'
