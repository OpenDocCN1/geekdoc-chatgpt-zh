  md: '在 BP 算法实现时，还要注意下列问题。


    +   1. 训练数据预处理


    预处理过程包含一系列的线性的特征比例变换，将所有的特征变换到[0,1]或者[-1,1]区间内，使得在每个训练集上，每个特征的均值为 0，并且具有相同的方差。预处理过程也称为尺度变换（scaling）或者规格化（normalization）。


    +   2. 后处理过程


    当应用神经网络进行分类操作时，通常将输出值编码为名义变量，具体的值对应类别标号。在一个两类分类问题中，可以仅使用一个输出，将其编码成一个二值变量（如 +1
    和 -1）。当具有更多的类别时，应当为每个类别分配一个代表类别决策的名义输出值。例如，对于一个三类分类问题，可以设置 3 个名义输出，每个名义输出取值为[+1,-1]，对应的各个类别决策为{+1,-1,-1}、{-1,+1,-1}、{-1,-1,+1}。利用阈值可以将神经网络的输出值变换成为合适的名义输出值。


    +   3. 初始权值的影响及设置


    与所有梯度下降算法一样，初始权值对 BP 神经网络的最终解有很大的影响。虽然将其全部设置为 0 更为自然，但从式（7.72）可以看出，这将导致很不理想的结果。如果输出层的权值全部为
    0，则反向传播误差也将为 0，输出层前面的权值将不会改变。因此，一般以均值为 0 的随机分布设置 BP 神经网络的初始权值。


    # 7.5 Hopfield 神经网络


    从 20 世纪 60 年代初到 80 年代初，神经网络的研究处于“冰河期”；到了 80 年代中期，霍普菲尔德在神经网络建模及应用方面的开创性成果在世界范围内重新掀起了神经网络的研究热潮。1982
    年和 1984 年，霍普菲尔德先后提出离散型 Hopfield 神经网络和连续型 Hopfield 神经网络，引入“计算能量函数”的概念，给出了网络稳定性判据，尤其是给出了
    Hopfield 神经网络的电子电路实现，为神经计算机的研究奠定了基础；同时，开拓了神经网络用于联想记忆和优化计算的新途径，从而有力地推动了神经网络的研究。这两种模型是目前极为重要的神经优化计算模型。


    # 7.5.1 离散型 Hopfield 神经网络


    Hopfield 神经网络是全互连反馈神经网络，它的每一个神经元都与其他神经元相连接。具有 N 个神经元的离散型 Hopfield 神经网络可由一个 N×N
    矩阵 w = [wij]N×N 和一个 N 维行向量 θ = [θ1, θ2, ⋯, θN]T 唯一确定，记为 HNN = (w, θ)。其中，wij 为从第
    j 个神经元的输出到第 i 个神经元的输入之间的连接权值，表示神经元 i 与 j 的连接强度，且 wji = wij，wii = 0； θi 为神经元 i
    的阈值。若用 vi(k) 表示 k 时刻神经元所处的状态，那么神经元 i 的状态随时间变化的规律（又称演化律）为


    ```

    v_i(k+1) = \begin{cases} 1, u_i(k) \geqq 0 \\ 0, u_i(k) < 0 \end{cases} \quad
    (7.75)

    ```'
