- pgno: 110
  md: '当前的推理的过程称为冲突消解。解决冲突时所用的策略称为冲突消解策略。对正向推理而言，它将决定选择哪一组已知事实来激活哪一条产生式规则，使它用于当前的推理，产生其<后件>指出的结论或执行相应的操作；对逆向推理而言，它将决定哪一个假设与哪一个产生式规则的<后件>进行匹配，从而推出相应的<前件>，作为新的假设。


    目前已有多种消解冲突的策略，其基本思想都是对知识进行排序。常用的有以下几种。


    # (1) 按规则的针对性排序


    该策略是优先选用针对性较强的产生式规则。如果 r2 中除了包括 r1 要求的全部条件外，还包括其他条件，则称 r2 比 r1 有更大的针对性，r1 比 r2
    有更大的通用性。因此，当 r2 与 r1 发生冲突时，优先选用 r2。因为它要求的条件较多，其结论一般更接近于目标，一旦得到满足，可缩短推理过程。


    # (2) 按已知事实的新鲜性排序


    在产生式系统的推理过程中，每应用一条产生式规则就会得到一个或多个结论，或者执行某个操作，数据库就会增加新的事实。另外，在推理时还会向用户询问有关的信息，也使得数据库的内容发生变化。一般把数据库中后生成的事实称为新鲜的事实，即后生成的事实要比先生成的事实具有较大的新鲜性。若一条规则被应用后生成了多个结论，则既可以认为这些结论有相同的新鲜性，也可以认为排在前面（或后面）的结论有较大的新鲜性，根据情况决定。


    设规则 r1 可与事实组 A 匹配成功，规则 r2 可与事实组 B 匹配成功，则 A 与 B 中哪一组较新鲜，与它匹配的产生式规则就先被应用。


    如何衡量 A 与 B 中哪一组事实更新鲜呢？常用的方法有以下 3 种。


    +   1) 逐个比较 A 与 B 中的事实的新鲜性，若 A 中包含的更新鲜的事实比 B 多，就认为 A 比 B 新鲜。例如，设 A 与 B 中各有 5 个事实，而
    A 中有 3 个事实比 B 中的事实更新鲜，则认为 A 比 B 新鲜。


    +   2) 以 A 中最新鲜的事实与 B 中最新鲜的事实相比较，哪一个更新鲜，就认为相应的事实组更新鲜。


    +   3) 以 A 中最不新鲜的事实与 B 中最不新鲜的事实相比较，哪一个更不新鲜，就认为相应的事实组有较小的新鲜性。


    # (3) 按匹配度排序


    在不确定性推理中，需要计算已知事实与知识的匹配度，当其匹配度达到某个预先规定的值时，就认为它们是可匹配的。若产生式规则 r1 与 r2 都可匹配成功，则优先选用匹配度较大的产生式规则。


    # (4) 按条件个数排序


    如果有多条产生式规则生成的结论相同，则优先应用条件少的产生式规则，因为条件少的规则匹配时花费的时间较少。


    在具体应用时，可对上述几种策略进行组合，尽量减少冲突的发生，使推理有较快的速度和较高的效率。


    # 4.1.5 推理系统


    推理系统是集成特定思维方法和理论知识的软件系统，能够使某种类型的逻辑或决策自动化生成。推理系统的使用场景多种多样，包括业务规则处理、复杂事件处理、入侵检'
  merge: -1
  img_proc: true
- pgno: 111
  md: '测、预测分析等，并广泛应用于计算机视觉、自然语言处理等人工智能领域。


    # 1. 专家系统


    知识是对于一个主题或者一个领域在理论或实践上的理解，专家是拥有某一部分知识的人，他们是所在组织中的重要人物。专家系统基于专家知识发展而来，是模仿人类专家的思维方式进行决策的人工智能算法，其算法核心是知识库和推理机，可以解决特定领域中复杂的问题。专家系统被定义为一种交互式可靠的基于计算机的决策系统，它使用事实和启发式方法解决复杂的决策问题，被认为是人类智慧和专业知识的最高水平。专家系统是计算机推理最具象征性的表现形式。


    例如，对于医疗诊断专家系统来说，从病人的症状及化验结果等初始事实出发，利用知识库中的知识及一定的控制策略，对病情做出诊断并开出医疗处方，这个过程便是推理。


    # (1) 专家系统的结构


    专家系统的结构是指专家系统各组成部分的构造方法和组织形式。尽管不同应用领域和不同类型的专家系统结构上会存在一些差异，但是它们的基本结构大同小异。通常，专家系统由知识库、综合数据库、知识获取、推理机、解释器和人工交互界面
    6 部分组成，如图 4.3 所示。


    图 4.3 专家系统的结构


    1）知识库是问题求解所需要的领域知识的集合，包括基本事实、规则和其他有关信息。知识的表示形式多种多样，包括框架、规则、语义网络等。知识库中的知识源于领域专家，是决定专家系统能力的关键，即知识库中知识的质量和数量决定着专家系统的质量水平。知识库是专家系统的核心组成部分。一般来说，专家系统中的知识库与专家系统程序是相互独立的，用户可以通过改变、完善知识库中的知识内容来提高专家系统的性能。


    2）推理机是实施问题求解的核心执行机构，它实际上是对知识进行解释的程序，根据知识的语义，对按一定策略找到的知识进行解释执行，并把结果记录到动态库的适当空间中。推理机的程序与知识库的具体内容无关，即推理机和知识库是分离的，这是专家系统的重要特征。它的优点是对知识库的修改无须改动推理机，但是纯粹的形式推理会降低


    ![](img/01b3dd63f105ee2f61ade787bae553f5_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '问题求解的效率。将推理机和知识库相结合也不失为一种可选方法。


    +   3) 综合数据库也称为动态库或工作存储器，是反映当前问题求解状态的集合，用于存放系统运行过程中产生的所有信息，以及需要的原始数据，包括用户输入的信息、推理的中间结果、推理过程的记录等。综合数据库中由各种事实、命题和关系组成的状态，既是推理机选用知识的依据，也是解释机制获得推理路径的来源。


    +   4) 知识获取负责建立、修改和扩充知识库，是专家系统中把问题求解的各种专门知识从人类专家的头脑中或其他知识源那里转换到知识库中的一个重要机构。知识获取可以是手工的，也可以采用半自动知识获取方法或自动知识获取方法。


    +   5) 解释器能够向用户解释专家系统的行为方法，包括解释推理结论的正确性和系统输出其他候选结果的原因等。人工智能中的知识表示形式有产生式、框架、语音网络等，在专家系统中运用的较为普通的知识是产生式规则。产生式规则以
    IF-THEN 形式出现，IF 后面是条件，THEN 后面是结论，条件和结论均可以通过逻辑运算 AND、OR、NOT 等进行复合。解释机制涉及程序的透明性，它让用户理解程序正在做什么和为什么这样做，向用户提供了关于系统的一个认识窗口。为了回答“为什么”得到某个结论的询问，系统通常需要反向跟踪动态库中保存的推理路径，并把它翻译成用户能接受的自然语言表达方式。


    +   6) 人机交互界面是实现用户和专家系统之间交流的途径，通过人机交互界面，用户输入基本信息、回答系统提出的相关问题，系统输出推理结果及相关的解释。


    现有的专家系统类型有很多，常用的有解释专家系统、预测专家系统、诊断专家系统等。根据用户需求，专家系统还可以进行设计规划、监视、控制、调试、修理甚至教学等工作。


    # (2) 专家系统的特点


    专家系统主要具有以下 3 个特点。


    +   1) 启发性。专家系统提供最高水平的专业知识，为解决特定领域的具体问题，除了需要一些公共的常识之外，还需要大量与所研究领域密切相关的知识，从而能够有效地给出准确性和富有想象力的问题解决方案。


    +   2) 透明性。专家系统必须有一个有效的机制来管理其中现有知识的汇编，并且它需要对自身的工作过程进行推理（自推理或解释）。


    +   3) 灵活性。保持灵活性对专家系统来说至关重要，如在解题过程中除了用演绎方法外，有时还要根据情况使用归纳方法和抽象方法。


    专家系统在当前及未来都将是人类值得信赖的高水平智能助手，是将人工智能技术运用到实际的重要手段。


    # (3) 经典专家系统类型


    基于规则的专家系统和基于框架的专家系统是两种经典的专家系统类型，在早期的研究和应用中起着非常重要的作用。自人工智能发展以来，有一种观点认为人工智能是对各种定性模型的获得、表达及使用的计算方法进行研究的学问，基于该观点人们又提出了基于模型的专家系统。


    +   1) 基于规则的专家系统包括 5 部分：知识库、推理引擎、解释子工具、用户接口和知识采集子系统，如图 4.4 所示。'
