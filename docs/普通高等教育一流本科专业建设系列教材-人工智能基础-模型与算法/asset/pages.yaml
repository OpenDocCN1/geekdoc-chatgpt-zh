    这一时期的一个重要特点就是人工智能研究者意识到必须对智能机器的问题范围进行充分限制。在对通用的、人类惯用的解决问题的方式进行仿真，以创造出“聪明”的搜索算法和推理方法等技术的探索失败后，研究人员意识到，可以使用大量推理步骤来解决狭'
