  md: '充，即要求知识表示模式与运用知识的推理机制相互独立，在专家系统中一般采用知识库与推理机分离的手段来实现。另外，专家往往不能很快地把领域问题的所有知识定义为一个完整的知识库，通常先定义一个子集，再不断通过增加、修改、删除来扩充和完善知识库。这种方法主张将专家系统的知识作为一个开放集来处理，并尽可能地模块化存储知识条目，便于知识库的扩充。


    +   6) 可理解性。知识表示的可理解性是指易于被人们理解的程度。易理解的表示模式的好处显而易见，它符合人们的思维习惯，便于知识库研发人员对专家的专门知识进行整理并形式化，也便于知识库的设计、实现和改进。


    +   7) 可利用性。知识表示的目的在于知识的利用，具体地说就是知识的检索和推理。知识的检索与推理是一种控制知识，在专家系统中，一旦知识表示模式被选定，它们也就相应地被确定下来。因此，所选择的知识表示方法应当便于对知识的复用，其数据结构应力求简单，并保持清晰一致。如果一种表示模式的数据结构过于复杂或者难以理解，使得推理不便于进行匹配、冲突消解及不确定性的计算等处理，势必影响专家系统的效率及其问题求解的能力。


    +   8) 可维护性。知识需要进行合理的组织，知识的组织是与其表示方法密切相关的，不同的表示方法对应于不同的组织方式。这就要求在设计和选择知识表示方法时，充分考虑对知识进行的组织方式。此外，知识还需要适当地增加、修改和删除，以保证知识的一致性和完整性，即需要进行知识的管理和维护。因此，在选择知识表示方法时还应当充分考虑到知识管理和维护的方便性。简而言之，在建造具体知识系统时，应当以有效地表示问题领域的专门知识、便于知识的获取、有利于运用知识进行推理的原则来选择知识表示方法。


    # ## 2.2 一阶谓词逻辑表示法


    一阶谓词逻辑是一种表达力很强的形式语言，这种语言很适合当前的数字计算机，因此成为知识表示的首选。一阶谓词逻辑表示不仅可以实现类似于人推理的自然演绎法自动推理，也可以实现不同于人的归结法自动推理。


    # ### 2.2.1 命题


    命题代表人们进行思维时的一种判断，或者是肯定，或者是否定。在现代哲学、逻辑学、语言学中，命题是指一个判断的语义，这个语义是可以被观察并定义的。


    # #### 1. 命题的定义


    命题是具有真假意义的语句。命题不是指陈述本身，而是指所表达的语义。当陈述具有相同语义时，它们表达相同的命题。例如，“雪是白的”(汉语)和“snow is white”(英语)都是陈述，但它们表达的命题是相同的。在同一种语言中，两个陈述也可能表达相同的命题。例如，上述命题也可陈述为“冰的小结晶是白的”。不过，之所以是相同的命题，是因为冰的小结晶可视为雪的有效定义。


    通常，命题是指闭判断，以区别于开判断，或谓词。在这种情况下，命题不是真的就是假的。哲学学派逻辑实证主义支持这一命题的概念。以下是一些命题。


    +   1) P: 太阳从东边升起。'
