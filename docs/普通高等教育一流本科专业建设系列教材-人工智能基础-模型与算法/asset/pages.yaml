    # 2. 一般步骤


    基于上述基本思想，用神经网络方法求解优化问题的一般步骤如下。


    +   1) 将求解的优化问题的每一个可行解用换位矩阵表示。


    +   2) 将换位矩阵与由 n 个神经元构成的神经网络相对应，其中每一个可行解所对应的换位矩阵的各元素与相应的神经元稳态输出相对应。


    +   3) 构造能量函数，使其最小值对应优化问题的最优解，并满足约束条件。


    +   4) 用罚函数法构造目标函数，与 Hopfield 神经网络的计算能量函数表达式相等，确定各连接权值 \( w_{ij} \) 和偏置参数 \( I_i
    \) 等。


    +   5) 给定网络初始状态和网络参数 \( A \, B \, C \, D \) 等，使网络（可以是计算机模拟）按动态方程运行，直到达到稳定状态，并将它解释为优化问题的解。


    Hopfield 神经网络模型与初始状态有关。例如，在 TSP 中，原则上可选 \( v_{xi}^0 = \frac{1}{n} \) 为每个神经元的初始值，因为它满足
    \( \sum_x \sum_i v_{xi}^0 = n \)，但相同长度的等价路径有 \( 2n \) 条，系统无法从中抉择，所以要加一定的噪声值 \(
    (\pm 0.1 v_{xi}^0) \) 来打破这种平衡。


    当在计算机上实现上述演化时，需要离散化。此时，\( \Delta t \) 的选择很重要，\( \Delta t \) 太大可能导致离散后的算法与原连续算法有很大差异，甚至不收敛；\(
    \Delta t \) 太小则迭代次数太多，计算时间长。可以证明，只要 \( \Delta t \) 选取得合理，上述算法一定收敛。如果不加其他条件，收敛到的解不一定对应有效的访问路径，可能是不可行解。虽然后续有一些相关改进方法被提出，但它们都存在着复杂化权系数表达式、降低收敛速度的问题。


    鉴于神经网络动力学性质的复杂性，神经网络优化计算方面仍有许多问题需要进一步深入研究。其目前存在的主要问题有计算结果的不稳定性；系数 \( A \, B \,
    C \, D \) 的确定性；能量函数存在大量局部极小值，求解结果不能保证为最优解等。


    # 3. Hopfield 神经网络优化方法求解 TSP


    TSP 或邮递员路径问题可以描述为：有 n 个城市，其相互间的距离或旅行成本为已知，求使每个城市都能被访问一次的最短合理总路径（或总成本）。


    TSP 是由美籍奥地利数学家、经济学家卡尔·门格尔（Karl Menger）在 19 世纪 20 年代首先提出来的，但直到 40 年代美国数学家梅里尔·弗勒德（Merrill
    Flood）开始和他在 RAND 公司的同事们讨论后，TSP 才开始普及起来。那时人们对组合问题很感兴趣。数学家们非常喜欢研究 TSP，这是因为 TSP 描述起来很简单，但要解却是非常困难的。当城市数目不断增加时，求解问题所需要的计算量呈指数级增长。TSP
    现在仍然被广泛用作新的组合优化方法的测试问题。


    对于 TSP，一条访问路径可以用一个换位矩阵表示。以 5 个城市为例，如表 7.4 所示，用换位矩阵表示访问 5 个城市的路径顺序为 \( C_3 \rightarrow
    C_1 \rightarrow C_5 \rightarrow C_2 \rightarrow C_4 \rightarrow C_3 \)，其路径总长度为

    \( l = d_{C_3 C_1} + d_{C_1 C_5} + d_{C_5 C_2} + d_{C_2 C_4} + d_{C_4 C_3} \quad
    (7.103) \)'
