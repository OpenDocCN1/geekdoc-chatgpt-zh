- pgno: 254
  md: '# (2) 决策树的缺点


    决策树难以预测连续性字段：对有时间顺序的数据，需要做很多预处理的工作；当数据类别太多时，错误可能就会增加得比较快；不善于处理特征关联性比较强的数据；对于各类别样本数量不一致的数据，信息增益偏向于那些有更多数值的特征。另外，决策树也有容易过拟合和忽略属性间相关性的问题。


    # 8.2.2 随机森林


    # 1. 算法概述


    随机森林是一个包含多个决策树的分类器，并且其输出的类别是由个别树输出的类别众数而定的。布雷曼和美国犹他州立大学数学和统计学教授阿黛尔·卡特勒（Adele Cutler）发展出随机森林算法，Random
    Forest 是他们的商标。这个术语是由贝尔实验室的何天琴所提出的随机决策森林（random decision forests）而来的。随机森林算法则是指将布雷曼的引导聚集算法（bootstrap
    aggregating）和何天琴的随机子空间法（random subspace method）结合起来以建造决策树的集合。


    随机森林是以决策树为基础的一种更高级的算法。像决策树一样，随机森林既可以用于回归，也可以用于分类。从名字中可以看出，随机森林是用随机方式构建的一个森林，而该森林由很多相互不关联的决策树组成。事实上，随机森林从本质上属于机器学习的一个重要分支，称为集成学习。集成学习通过建立几个模型组合解决单一预测问题。它的工作原理是生成多个分类器模型，各自独立地学习和做出预测。这些预测最后结合成组合预测，因此优于任何一个单分类预测结果。


    当进行分类任务时，新的输入样本进入，就让森林中的每一棵决策树分别进行判断和分类，每个决策树会得到一个自己的分类结果，决策树的分类结果中哪一个分类最多，那么随机森林就会把这个结果当作最终结果。


    随机森林是引导聚集算法的一个扩展变体。在以决策树为基学习器构建引导聚集算法集成的基础上，随机森林进一步在决策树的训练过程中引入了随机属性选择。具体来说，传统决策树在选择划分属性时是在当前节点的属性集合（假定有
    d 个属性）中选择一个最优属性；而在随机森林中，对基决策树的每个节点，先从该节点的属性集合中随机选择一个包含 k 个属性的子集，然后从该子集中选择一个最优属性用于划分。这里的参数
    k 控制了随机性的引入程度：若令 k = d，则基决策树的构建与传统决策树相同；若令 k = 1，则随机选择一个属性用于划分。一般情况下，推荐值 k = lb
    d 。


    # 2. 基本步骤


    构造随机森林的步骤如下。


    +   1）一个样本容量为 N 的样本有放回地抽取 N 次，每次抽取 1 个，最终形成 N 个样本。选择好的 N 个样本用来训练一个决策树，作为决策树根节点处的样本。


    +   2）当每个样本有 M 个属性时，在决策树的每个节点需要分裂时，随机从这 M 个属性中选取出 m 个属性，满足条件 m << M ，然后采用某种策略（如信息增益），从这
    m 个属性中选择一个属性作为该节点的分裂属性。


    +   3）在决策树形成过程中，每个节点都要按照步骤 2）来分裂（很容易理解，如果下一'
