    b-1 个未扩展的节点，总的内存需求量为 d(b-1)+1。所以，深度优先搜索的空间复杂度是 b 的线性函数 O(bd)。


    # 5. 深度优先搜索的优缺点


    深度优先搜索的优点是与宽度优先搜索相比需要较少的空间，只需要保存搜索树的一部分，由当前正在搜索的路径和该路径上还没有完全展开的节点标志所组成。因此，深度优先搜索的存储器要求是深度约束的线性函数。


    但是其主要问题是可能搜索到了错误的路径上。很多问题可能具有很深甚至无限的搜索树，如果不幸选择了一个错误的路径，则深度优先搜索会一直搜索下去，而不会回到正确的路径上。这样，对于这些问题，深度优先搜索要么陷入无限循环而不能给出一个答案；要么最后找到一个答案，但路径很长而且不是最优答案。也就是说，深度优先搜索既不是完备的，也不是最优的。


    # 3.3.3 有界深度搜索和迭代加深搜索


    # 1. 有界深度搜索


    对于深度 d 比较大的情况，深度优先搜索需要很长的运行时间，而且可能得不到解答。一种比较好的问题求解方法是对搜索树的深度进行控制，即有界深度优先搜索方法。有界深度优先搜索过程总体上按深度优先算法进行，但对搜索深度需要给出一个深度限制
    dm，当深度达到 dm 时，如果还没有找到解答，就停止对该分支的搜索，换到另一个分支进行搜索。


    有界深度优先搜索的搜索过程如下。


    +   1) 把初始状态节点 S0 放入 OPEN 表中，置 S0 的深度 d(S0) = 0。

    +   2) 若 OPEN 表为空，则问题无解，失败并退出。

    +   3) 把 OPEN 表中的第一个节点取出放入 CLOSE 表中，并按顺序冠以编号 n。

    +   4) 考察节点 n 是否为目标节点，若是，则求得了问题的解，成功并退出。

    +   5) 若节点 n 不可扩展或者深度 d(n) = dm，则转第 2) 步。

    +   6) 扩展节点 n，将其子节点放入 OPEN 表的首部，并为其配置指向父节点的指针，然后转第 2) 步。


    对于有界深度搜索策略，有以下几点需要说明。


    1) 深度限制 dm 很重要。当问题有解且解的路径长度不大于 dm 时，则搜索过程一定能够找到解。但是与深度优先搜索一样，其并不能保证最先找到的是最优解，即这时有界深度搜索是完备的但不是最优的。但是，当
    dm 取值太小，解的路径长度大于 dm 时，搜索过程中就找不到解，即这时搜索过程甚至是不完备的。


    2) 深度限制 dm 不能太大。当 dm 太大时，搜索过程会产生过多的无用节点，既浪费了计算资源，又降低了搜索效率。有界深度搜索的时间和空间复杂度与深度优先搜索类似，时间复杂度为
    O(b^dm)，空间复杂度为 O(bdm)。


    3) 有界深度搜索的主要问题是深度限制值 dm 的选取。该值也被称为状态空间的直'
