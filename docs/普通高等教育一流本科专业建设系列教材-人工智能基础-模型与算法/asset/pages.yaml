  md: '将与各种 AS 算法一样使用轮盘赌选择策略。


    式（6.4）是位于城市 i 的蚂蚁 k 选择城市 j 作为下一个访问对象的概率，这种算法执行方式称为偏向探索（biased exploration）。


    ```

    $$ p_k(i, j) = \begin{cases} \frac{[\tau(i, j)][\eta(i, j)]^\beta}{\sum_{u \in
    J_k(i)} [\tau(i, u)][\eta(i, u)]^\beta}, & j \leqslant J_k(i) \\ 0, & \text{其他}
    \end{cases} \quad (6.4) $$

    ```


    在 ACS 中，$q_0$ 表示当前最优移动方向的概率，同时蚂蚁以 $1-q_0$ 的概率偏向搜索各条边，因此可以通过 $q_0$ 调节“开发”与“探索”之间的平衡。


    +   2) 信息素全局更新规则。


    “至今最优蚂蚁”是指构建出了从算法开始到当前迭代中最短路径的蚂蚁，信息素的全局更新只允许“至今最优蚂蚁”释放信息素。当每次迭代中所有蚂蚁都完成路径构建后，按照下面的公式进行信息素的全局更新：


    ```

    $$ \tau(i, j) = (1 - \rho)\tau(i, j) + \rho \Delta \tau_b(i, j), \forall (i, j)
    \in T_b \quad (6.5) $$

    ```


    式中， $\Delta \tau_b(i, j) = \frac{1}{C_b}$。


    ACS 算法中信息素的蒸发和释放都只在属于至今最优路径的边上进行，所以 ACS 算法信息素更新计算复杂度为 $O(n)$，而 AS 算法的复杂度为 $O(n^2)$。在式（6.5）中，参数
    $\rho$ 代表信息素蒸发的速率，新增加的信息素 $\tau_b(i, j)$ 被控制在旧信息素量与新释放的信息素量之间，用一种隐含又更简单的方式实现了
    MMAS 算法对信息素量取值范围的限制。


    +   3) 信息素局部更新规则。


    除了全局信息素的改进外，ACS 还加入了信息素局部更新规则。在路径构建过程中，每当蚂蚁经过一条边时，这条边就按照下面的公式进行更新：


    ```

    $$ \tau(i, j) = (1 - \xi)\tau(i, j) + \xi \tau_0 \quad (6.6) $$

    ```


    式中， $\tau_0$ 为信息素的初始值； $\xi$ 为信息素局部挥发速率， $\xi \in (0,1)$ 。


    通过大量实验发现， $\xi$ 为 0.1，用 $n$ 表示城市个数，$C^{nn}$ 是由贪婪算法构造的路径长度， $\tau_0$ 取值为 $\frac{1}{nC^{nn}}$
    时，算法有比较好的性能。 $\tau_0 = \frac{1}{nC^{nn}} \leqslant \tau(i, j)$，不难看出式（6.6）计算出来的新的信息素比更新前的减少了。这种机制大大增加了算法的探索能力，后面的蚂蚁倾向于探索未被使用过的边，有效地避免了算法进入停滞状态。


    # 4. 蚁群优化算法的应用


    TSP 是一个很有代表性的优化问题。该问题的描述如下：一个商人要去若干个城市推销商品，该商人从一个城市出发，需要经过所有城市后回到出发地。应当如何选择路线，以使总的行程最短。该问题的实质是在一个带权完全无向图中，寻找一个最小的汉密尔顿回路。以图
    6.9 为例，一共有 5 个城市，不同城市之间的距离不同，旅行商最短的路线是 $1 \rightarrow 3 \rightarrow 5 \rightarrow
    4 \rightarrow 2 \rightarrow 1$。传统的解决方法有分支定界法、线性规划法、动态规划法等。但是，随着数据规模的扩大，传统的解决方法变得无能为力，蚁群优化算法开始展现出它独特的应用价值。'
