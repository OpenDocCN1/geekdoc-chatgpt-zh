    # 3. 状态空间搜索的基本思想


    状态空间搜索的基本思想就是通过搜索引擎寻找一个操作算子的调用序列，使问题从初始状态变迁到目标状态之一，而变迁过程中的状态序列或相应的操作算子调用序列称为从初始状态到目标状态的解答路径。


    通常，状态空间的解答路径有多条，但最短的只有一条或少数几条。上述渡河问题有无数条解答路径（因为划船操作可逆），但只有 4 条是最短的，都包含 11 个操作算子的调用。由于一个状态可以有多个可供选择的操作算子，导致了多个待搜索的解答路径。例如，图
    3.3 中初始状态节点有 3 个操作算子供选用。这种选择在逻辑上称为“或”关系，意指只要其中有一条路径通往目标状态，就能获得成功解答。由此，这样的有向图称为或图，常见的状态空间一般可表示为或图，因而也称为一般图。


    除了少数像渡河这样的简单问题外，描述状态空间的一般图很大，无法直观地画出，只能将其视为隐含图，在搜索解答路径的过程中只绘制搜索时直接涉及的节点和弧线，构成搜索图。


    作为一般图搜索的另一个例子，下面观察智力游戏八数码问题。


    八数码游戏在由 3 行和 3 列构成的九宫棋盘上进行，棋盘上放置数码为 1～8 的 8 个棋牌，剩下一个空格，游戏者只能通过棋牌向空格的移动来不断改变棋盘的布局。这种游戏求解的问题是：给定初始布局（初始状态）和目标布局（目标状态），如何移动棋牌才能从初始布局到达目标布局，如图
    3.4 所示。显然，解答路径实际上是一个合法的走步序列。


    为了用一般图搜索方法解决该问题，应先为问题状态的表示建立数据结构，再制定操作算子集。以 3×3 的矩阵表示问题状态，每个矩阵元素 \(s_{ij} \in
    \{0,1,2,\cdots,8\}\)，其中 \(j \leq i\)，\(j \leq 3\)，数字 0 指示空格，数字 1～8 指示数码。于是图 3.4
    中的八数码问题就可表示为矩阵形式，如图 3.5 所示。


    图 3.4 八数码游戏实例 图 3.5 八数码问题的矩阵形式


    定义操作算子的直观方法是为每个棋牌制定一套可能的走步：左、上、右、下 4 种移动，这样需要 32 个操作算子。简单易行的方法是仅为空格制定这 4 种走步，因为只有紧靠空格的棋牌才能移动。空格移动的唯一约束是不能移出棋盘。假设在搜索过程的每一步都能选择最合适的操作算子，则解决图
    3.4 中的八数码问题时，一次搜索过程涉及的状态所构成的搜索图（这里实际是搜索树）如图 3.6 所示。


    八数码游戏可能的棋盘布局（问题状态）共 9!=362880 个，由于棋盘的对称性，实际只有这个总数的一半。显然，无法直观地绘制整个状态空间的一般图，但搜索图小得多，可以图示。所以，尽管状态空间可以很大（如国际象棋），但只要确保搜索空间足够小，就能在合理的时间范围内搜索到问题解答。'
