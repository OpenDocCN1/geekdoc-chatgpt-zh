  md: '# 例 2.15 用语义网络表示下列命题。


    +   1) 树和草都是植物。

    +   2) 树和草是有根有叶的。

    +   3) 水草是草，且长在水中。

    +   4) 果树是树，且会结果。

    +   5) 桃树是果树中的一种，它结桃子。


    # 解


    对其进行解题分析。

    1) 问题涉及的对象有植物、树、草、水草、果树、桃树，共 6 个对象。各对象的属性分别如下。

    树和草的属性：有根、有叶；

    水草的属性：长在水中；

    果树的属性：会结果；

    桃树的属性：结桃子。


    2) 树和草与植物之间的关系是 AKO，水草和草之间的关系是 AKO，果树和树之间的关系是 AKO，桃树和果树之间的关系是 AKO。


    3) 根据信息继承性原则，各上层节点的属性下层都具有，在下层都不再标出，以避免属性信息重复。例如，草的属性是有根有叶，而水草也有根有叶，但这些属性不再在水草中标出；桃树是树的下层节点，树的属性有根有叶将不再在桃树中标出。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_54_0.png)


    4) 根据上面的分析，本题共涉及 6 个对象，各对象的属性及它们之间的关系已在上面指出，所以本题的语义网络应是由 6 个节点构成的有向图，弧上的标注及各节点的标注已在上面指出，其语义网络如图
    2.21 所示。


    # 2.7.3 语义网络表示法的特点


    语义网络表示法具有以下优点。


    +   1) 结构性：把事物的属性及事物间的各种语义联系显式地表示出来，是一种结构化的知识表示方法。在这种方法中，下层节点可以继承、新增、变异上层节点的属性。

    +   2) 联想性：本来是作为人类联想记忆模型提出来的，它着重强调事物间的语义联系，体现了人类的联想思维过程。

    +   3) 自索引性：把各节点之间的联系以明确、简洁的方式表示出来，通过与某一节点连接的弧可以很容易地找出与该节点有关的信息，而不必查找整个知识库。这种自索引能力有效地避免了搜索时遇到的组合爆炸问题。

    +   4) 自然性：这种带有标识的有向图可以比较直观地把知识表示出来，符合人们表达事物之间关系的习惯，并且与自然语言语义网络之间的转换也比较容易实现。


    语义网络表示法具有以下缺点。


    +   1) 非严格性：没有像谓词词那样严格的形式表示体系，一个给定语义网络的含义完全依'
