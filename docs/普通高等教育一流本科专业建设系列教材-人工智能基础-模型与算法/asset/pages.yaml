    \ P 为 Q 的前提，记为 P ⇒ Q。\n\n由上述介绍可知，可以用以合取符号（∧）和析取符号（∨）联结形成的谓词公式表示事实性知识，也可以用蕴涵符号（→）联结形成的谓词公式表示规则性知识。下面是用谓词公式表示知识的步骤。定义谓词及个体，确定每个谓词及个体的确切含义。根据所要表达的事物或概念，为每个谓词中的变元赋特定的值。根据所要表达知识的语义，用适当的联结符将各个谓词联结起来，形成谓词公式。\n\
    \n# 【例 2.2】 用谓词逻辑表示下列知识。\n\n武汉是一个美丽的城市，但她不是一个沿海城市。\n\n如果马亮是男孩，张红是女孩，则马亮比张红长得高。\n\
    \n解 对于上述知识，可按以下 3 步进行分析。\n\n+   第 1 步，定义谓词。\n+   BCity(x): x 是一个美丽的城市。\n+   HCity(x):\
    \ x 是一个沿海城市。\n+   Boy(x): x 是男孩。\n+   Girl(x): x 是女孩。\n+   High(x,y): x 比 y 长得高。\n\
    \n第 2 步，将个体代入谓词中，得到 BCity(wuhan)、HCity(wuhan)、Boy(mal)、Girl(zhangh)、High(mal,\
    \ zhangh)。\n\n第 3 步，根据语义，用逻辑联结符连接。\nBCity(wuhan) ∧ ¬HCity(wuhan)\n[Boy(mal) ∧\
    \ Girl(zhangh)] → High(mal,zhangh)\n\n# 【例 2.3】 用谓词公式表示下列知识。\n\n+   自然数是大于零的整数。\n\
    +   \n+   所有整数不是偶数就是奇数。\n+   \n+   偶数除以 2 是整数。"
