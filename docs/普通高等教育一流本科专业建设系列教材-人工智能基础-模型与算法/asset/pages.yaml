    图 7.6 前馈型和反馈型神经网络


    1) 前馈型。前馈型神经网络中，各神经元接收前一层的输入，并输出给下一层，没有反馈。前馈型神经网络分为不同的层，第 i 层只与第 i-1 层输出相连，输入与输出的神经元与外界相连。后面着重介绍的
    BP 神经网络就是一种前馈型神经网络。


    2) 反馈型。在反馈型神经网络中，存在一些神经元的输出经过若干个神经元后，再反馈到这些神经元的输入端的情况。最典型的反馈型神经网络是 Hopfield 神经网络，它是全互联神经网络，即每个神经元和其他神经元之间都是相连的。


    # 2. 神经网络的工作方式


    当满足兴奋条件时，神经网络中的神经元就会改变为兴奋状态；否则，它就会改变为抑制状态。如果神经网络中各个神经元同时改变状态，则称为同步（synchronous）工作方式；如果神经网络中神经元都独立改变工作状态，即当某个神经元改变状态时，其他神经元保持状态不变，则称为异步（asynchronous）工作方式。不同工作方式下的神经网络性能有所差异。


    # 7.2.4 神经网络的学习规则


    # 1. 联想式学习——赫布学习规则


    # (1) 赫布理论


    赫布理论（Hebbian theory）是一个神经科学理论，解释了在学习过程中脑中神经元所发生的变化。赫布理论描述了突触可塑性的基本原理，即突触前神经元向突触后神经元的持续重复的刺激，可以导致突触传递效能的增加。这一理论由加拿大心理学家唐纳德·赫布（Donald
    Hebb）于 1949 年提出，又被称为赫布定律（Hebb''s rule）、赫布假说（Hebb''s postulate）、细胞结集理论（cell assembly
    theory）等。他如此表述这一理论：“我们可以假定反射活动的持续与重复会导致神经元稳定性的持久性提升……当神经元 A 的轴突与神经元 B 很近并参与了对
    B 的重复持续的兴奋时，这两个神经元或其中一个便会发生某些生长过程或代谢变化，致使 A 作为能使 B 兴奋的细胞之一，它的效能增强了。”


    这一理论经常会被总结为一起激发的神经元连在一起。但是，这个解释并不完整，赫布强调说，神经元 A 必须对神经元 B 的激发“做出了一定贡献”，因此神经元 A
    的激发必须在神经元 B 之前，而不能同时激发。赫布理论中的这一部分研究后来被称为脉冲时序依'
