    # 本 章 小 结


    搜索是人工智能的一种问题求解方法，搜索策略决定着问题求解的一个推理步骤中知识被使用的优先关系。在搜索中，知识利用得越充分，求解问题的搜索空间就越小。研究者对这个问题的研究曾经十分活跃，至今仍不乏高水平的研究课题。正如知识表示一样，知识的搜索与推理也有众多的方法，同一问题可能采用不同的搜索策略，而其中有的比较有效，有的不适合具体问题。本章着重介绍了几种有效的搜索策略。


    本章首先介绍了基于状态空间图的搜索技术，给出了图搜索的基本概念，分析了状态空间搜索和一般图搜索算法。在应用盲目搜索进行求解过程中，一般是“盲目”穷举，即不运用特别信息。盲目搜索中最具代表的算法是宽度优先搜索和深度优先搜索。当状态空间较大时，由于宽度优先需要很大的存储空间，因此该方法是不合适的。在很多典型的人工智能问题中，深度优先有着很多应用。但深度优先不是一种完备的方法，而且人们常常不是要沿着某一分支不断地扩展下去，因此迭代加深搜索在这种情况下更适合。与
    A*算法结合，迭代加深搜索算法转化了 IDA*算法，该算法已经有了很多的研究，并且可在并行结构上实现。


    在本章给出的启发式搜索中，最流行的是 A*算法和 AO*算法。A*算法用于或图，AO*算法用于与/或图。A*算法用于在状态空间中寻找目标，以及寻找从起始节点到目标节点的最优路径问题；AO*算法用于确定实现目标的最优路径。最近，有人通过机器学习的方法增强状态空间中节点的启发式信息，对
    A*算法进行了扩展。


    本章最后介绍了博弈问题，这可以看作一种特殊的与/或搜索问题。极大极小方法和 α-β 剪枝在现在的博弈类软件中是必不可少的技术。


