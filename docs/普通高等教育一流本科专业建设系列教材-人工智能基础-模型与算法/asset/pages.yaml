    # 图 6.9 TSP 求解示例


    以蚁群优化算法求解 TSP 为例，假设蚁群优化算法中的每只蚂蚁是具有以下特征的简单智能体。每次周游，每只蚂蚁在其经过的支路 \( (i, j) \) 上都留下信息素。蚂蚁选择城市的概率与城市之间的距离和当前连接支路上所包含的信息素含量有关。为了强制蚂蚁进行合法的周游，直到一次周游完成后，才允许蚂蚁游走已访问过的城市（这可由禁忌表进行控制）。设
    \( b_i(t) \) 表示 \( t \) 时刻位于城市 \( i \) 的蚂蚁数，\( n \) 为城市规模，\( m \) 为蚂蚁总数，\( C \)
    为城市集合，\( R \) 为路径集合。\( T_{ij}(t) \) 为 \( t \) 时刻路径 \( (i, j) \) 上的信息素，\( d_{ij}
    \) 为城市 \( i \) 与城市 \( j \) 的距离，\( \eta_{ij}(t) \) 为 \( t \) 时刻路径 \( (i, j) \)
    上的权重函数，Tabu[k] 表示蚂蚁 \( k \) 走过的城市，Allow[k] 表示蚂蚁 \( k \) 下一步允许经过的城市，满足 Tabu[k]
    + Allow[k] = \( C \)。在初始化时，将 \( m \) 只蚂蚁随机放置在 \( n \) 个城市中，并令所有路上的信息量相等，即 \( T_{ij}(0)
    = \text{Const} \)。对于蚂蚁 \( k \)，若 \( t \) 时刻在城市 \( i \)，那么下一步转移到城市 \( j \) 的概率为


    \( P_{ij}^k(t) = \begin{cases} \frac{[T_{ij}(t)]^\alpha [\eta_{ij}(t)]^\beta}{\sum_{s
    \in \text{Allow}[k]} [T_{is}(t)]^\alpha [\eta_{is}(t)]^\beta}, & j \in \text{Allow}[k],
    s \notin \text{Tabu}[k] \\ 0, & \text{其他} \end{cases} \quad (6.7) \)


    式中，\( \alpha (> 0) \) 为信息启发因子，控制遗留在路径上的信息素的影响；\( \beta (> 1) \) 为路径权重因子，控制该路径的权重影响。


    当所有蚂蚁到达终点后，信息素浓度更新如下述公式所示：


    \( T_{ij}(t+1) = (1 - \rho)T_{ij}(t) + \rho \Delta T_{ij}(t) \quad (6.8) \)


    \( \Delta T_{ij}(t) = \frac{Q}{\sum d} \quad (6.9) \)


    式中，\( \Delta T_{ij}(t) \) 为本次循环中路径 \( (i, j) \) 上的信息素增量；\( \rho (0 < \rho < 1)
    \) 为信息素挥发系数；\( 1 - \rho \) 为信息素残留因子；\( Q \) 为信息素强度；\( d \) 为城市 \( i \) 和 \( j
    \) 的距离。


    蚁群优化算法在相关领域得到了广泛的应用，但是存在收敛速度慢、易陷入局部最优、早熟收敛等问题，分析得出有下述几点原因。


    +   1) 收敛速度慢。蚁群优化算法中的信息素初值相同，选择下一个节点时倾向于随机选择。虽然随机选择能搜索更大的任务空间，有助于找到潜在的全局最优解，但是需要较长时间才能发挥正反馈作用，导致算法初期收敛速度较慢。


    +   2) 局部最优问题。蚁群优化算法具有正反馈的特点，初始时刻环境中的信息素完全相同，蚂蚁几乎按随机方式完成解的构建，这些解必然会存在优劣之分。在信息素更新时，'
