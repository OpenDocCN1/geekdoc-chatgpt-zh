    # (2) 结构风险最小化


    通过 VC 理论，可以认识到期望风险（真实风险）R 与经验风险 R_emp 之间是有差别的，该差别项称为置信风险，它与训练样本个数和模型复杂度都有密切关系。用复杂度高的模型拟合小样本，往往会导致过拟合，因此需要给经验风险
