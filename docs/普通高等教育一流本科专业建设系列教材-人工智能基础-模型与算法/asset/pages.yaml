- pgno: 245
  md: '发，运用过去求解问题的经验，通过演绎对当前面临的问题进行求解，或者产生能更有效应用领域知识的控制性规则。分析学习的目标不是扩充概念描述的范围，而是提高系统的效率。


    # 8.1.2 机器学习的应用和研究目标


    +   1. 机器学习的应用


    研究表明，目前在众多涉及计算机处理的技术应用中，机器学习在许多领域都取得了很大的进步，如用于人工智能、数据挖掘、自然语言处理、汉字识别、机器翻译、专家系统、商业领域等。可以说，一个系统是否具有“学习”功能已成为其是否具有“智能”的重要标志。


    20 世纪 90 年代逐渐成熟的基于机器学习的文本分类方法更注重分类器的模型自动挖掘和生成及动态优化能力，在分类效果和灵活性上比之前基于知识工程和专家系统的文本分类模式有所突破，成为相关领域研究和应用的经典范例。


    近年来，机器学习与自然语言处理的结合越来越紧密，相应的自然语言学习技术的发展也越来越快。在自然语言处理及机器翻译方面，比较流行和传统的机器学习方法是基于实例的学习。这种方法给定一些有代表性的实例，从中总结出一些规律，使其具有代表性和高精确度，并把学习得到的这些特性作为系统，赋给另一个从未见过的新事物。其中，比较典型的应用有基于机器学习方法的自动文摘问题及用于智能中文关联词语识别、中文语句的生成和诊断系统等。


    机器学习方法在专家系统及智能决策系统方面的典型应用很普遍，包括机械设备智能诊断系统中的机器学习机制、故障诊断专家系统中的机器学习方法、基于机器学习理论的智能决策支持系统模型操纵方法、智能制造系统中机器学习方法的应用研究等。


    机器学习技术也应用于市场营销、金融、网络分析和电信领域。在市场营销领域，机器学习技术广泛应用于分类型任务和关联型任务；在金融领域，机器学习技术广泛地应用于预测型任务；在网络分析领域，机器学习技术应用广泛的是关联型任务；在电信领域，机器学习技术在分类、预测、侦查等方面均有广泛的应用。此外，机器学习通常应用于数据挖掘领域，有时与其他应用技术结合，比较典型的有基于机器学习的神经网络初始化方法、进化计算在机器学习中的应用研究、层次分类中的机器学习方法研究、基于
    Rough 集方法的数据约简与机器学习、预测支持系统中的人机界面 Agent 及其机器学习等。


    +   2. 机器学习的研究目标


    在过去 20 年中，人类收集、存储、传输、处理数据的能力取得了飞速提升，人类社会的各个角落都积累了大量数据，急需能有效地对数据进行分析利用的计算机算法，而机器学习恰好顺应了大时代的这个迫切需求，因此该学科领域很自然地取得巨大发展，受到广泛关注。今天，在计算机科学的诸多分支学科领域中，无论是多媒体、图形学，还是网络通信、软件工程，乃至体系结构、芯片设计，都能找到机器学习技术的应用，尤其是在计算机视觉、自然语言处理等计算机应用技术领域，机器学习已成为重要的技术进步源泉之一。


    机器学习还为许多交叉学科提供了重要的技术支撑。例如，生物信息学试图利用信息'
