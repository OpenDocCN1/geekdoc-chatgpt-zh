    一阶规则有强大的表达能力，能简洁地表达递归概念，如：


    更好(X,Y) ← 更好(X,Z) ∧ 更好(Z,Y) （8.25）


    一阶规则学习能容易地引入领域知识，这是它相对于命题规则学习的另一大优势。在命题规则学习乃至一般的统计学习中，若欲引入领域知识，通常有两种做法：在现有属性的基础上基于领域知识构造出新属性，或基于领域知识设计某种函数机制（如正则化）来对假设空间加以约束。然而，现实任务中并非所有的领域知识都能轻松通过属性重构和函数约束来表达。例如，假定获得了包含某未知元素的化合物
    X，通过试验发现它与已知化合物 Y 的反应方程式。可多次重复试验，测出每次结果中化合物的组分含量。虽然我们对反应中未知元素的性质一无所知，但知道一些普遍成立的化学原理，如金属原子一般产生离子键、氢原子之间一般是共价键等，并且也了解已知元素间可能发生的反应。有了这些领域知识，重复几次试验后就不难学出
    X 和 Y 的反应方程式，还可能推测出 X 的性质，甚至发现新的分子和元素。类似这样的领域知识充斥在日常生活与各类任务中，但应用在基于命题表示的学习中却非常困难。


    一阶归纳学习 FOIL（first-order inductive learner，FOIL）是著名的一阶规则学习算法，它遵循序贯覆盖框架且采用自顶向下的规则归纳策略，与命题规则学习过程很相似。但由于逻辑变量的存在，FOIL
    在规则生成时需要考虑不同的变量组合。例如，在西瓜数据集 2.0 上，对“更好(X,Y)”这个概念，最初的空规则为


    更好(X,Y) ← （8.26）


