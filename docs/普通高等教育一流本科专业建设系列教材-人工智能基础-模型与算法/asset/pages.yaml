  md: '# 3.4.4 A*算法


    # 1. A*算法的概念和过程


    为了考察启发式搜索 A 算法的可采纳性，将评价函数 f 与 f* 相比较，实际上，f(x)、g(x) 和 h(x) 分别是 f*(x)、g*(x) 和 h*(x)
    的近似值。在理想的情况下，设计评价函数 f 时可以让 g(x) = g*(x)，h(x) = h*(x)，则应用该评价函数的 A 算法能在搜索过程中，每次都正确地选择下一个从
    OPEN 表中取出加以扩展的节点，从而不会扩展任何无关节点，就可以顺利地获取解答路径。然而，g*(x) 和 h*(x) 在最短解答路径找到前是未知的，因此几乎不可能设计出这种理想的评价函数；而且对于复杂的应用领域，即使设计接近于
    f* 的 f，往往也是困难的。一般来说，g(x) 的值容易从已生成的搜索树中计算出来，不必专门定义计算公式。例如，以节点深度 d(x) 作为 g(x) 的值，并有
    g(x) >= g*(x)。然而，h(x) 的设计依赖于启发式知识的应用，所以如何挖掘贴切的启发式知识是设计评价函数乃至 A 算法的关键。


