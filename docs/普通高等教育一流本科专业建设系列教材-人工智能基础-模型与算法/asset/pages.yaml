    然后，对上面这条规则覆盖的样例进行第二轮评估可发现，将图 8.8 中的 5 个逻辑文字加入规则后都能达到 100% 准确率。将覆盖样例最多，且属性次序最靠前的逻辑文字“根蒂=蜷缩”加入规则，于是得到结果：

    好瓜 ←（色泽 = 乌黑）∧（根蒂 = 蜷缩） （8.21）


    在规则生成过程中，通常会有一个评估规则优劣的标准。上面的例子中使用的标准是：先考虑规则准确率，准确率相同时考虑覆盖样例数，再相同时考虑属性次序。现实应用中可根据具体体任务情况设计适当的标准。


    此外，在上面的例子中每次仅考虑一个“最优”文字，这通常过于贪心，易陷入局部最优。为了缓解这个问题，可采用一些相对温和的做法，如采用集束搜索（beam search），即每轮保留最优的
    b 个逻辑文字，在下一轮均用于构建候选集，再把候选集中最优的 b 个'
