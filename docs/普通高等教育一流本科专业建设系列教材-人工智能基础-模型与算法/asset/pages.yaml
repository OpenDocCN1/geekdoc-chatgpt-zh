    近年来，超级计算、大数据与深度学习技术的融合也是引发人工智能第三次高潮的重要原因。相比于历史上任何一个时期，现阶段是联结主义人工智能对符号主义人工智能的胜利，以人脑神经网络为原型的联结主义成为实现人工智能的有效途径，但从长远来看，这并不代表符号主义的研究没有价值。


    实际上，在联结主义迅猛发展的同时，传统的符号处理、知识表示、搜索技术及机器学习等强化学习技术也在不断发展。


    知识图谱是一种实现机器认知智能的知识库，是符号主义持续发展的产物。它从一开始就在知识表示、知识描述、知识计算与知识推理等方面不断发展。自 2015 年以来，知识图谱在诸如问答、金融、教育、银行、旅游、司法等领域中进行了大规模应用。从最初简单地对人类知识进行表示，到现在的大规模应用，符号主义经历多年的发展，已经成为发展以认知智能为目标的新一代人工智能的重要基础技术。


    在联结主义人工智能和符号主义人工智能各自不断发展的同时，人工智能领域出现了脑机接口、外骨骼、可穿戴等人机混合智能技术。随着核磁共振等物理观测和仪器技术的进步，脑科学和神经科学也在不断发展，人们对大脑和神经系统在物理微观层面的认识也越来越深入，以大脑生物和物理为基础的类脑计算技术得以发展，类脑芯片、智能芯片等新型硬件产品和技术不断涌现。


    # 5. 中国的人工智能发展（1978 年至今）


    中国的人工智能研究起步较晚，纳入国家计划的研究（智能模拟）始于 1978 年。1981 年起，相继成立了中国人工智能学会（Chinese Association
