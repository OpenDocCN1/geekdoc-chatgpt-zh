    # ### 3.3.4 搜索最优策略的比较


    宽度优先搜索、深度优先搜索和迭代加深搜索都可以用于生成和测试算法，然而宽度优先搜索需要指数数量的空间，深度优先搜索的空间复杂度与最大搜索深度呈线性关系。迭代加深搜索对一棵深度受控的树采用深度优先搜索，结合了宽度优先搜索和深度优先搜索的优点。与宽度优先搜索一样，它是最优的，也是完备的，但对空间要求和深度优先搜索一样是适中的。


    表 3.2 给出了这 4 种搜索策略的比较。


    # 表 3.2 4 种搜索策略的比较


    | 标准 | 宽度优先 | 深度优先 | 有界深度 | 迭代加深 |

    |---|---|---|---|---|

    | 时间 | \(b^d\) | \(b^d\) | \(b^{n_m}\) | \(b^d\) |

    | 空间 | \(b^d\) | \(bd\) | \(bd_m\) | \(bd\) |

    | 最优 | 是 | 否 | 否 | 是 |

    | 完备 | 是 | 否 | 如果 \(l > d\) , 则是 | 是 |


    注：其中，\(b\) 为分支系数，\(d\) 为解答的深度，\(m\) 为搜索树的最大深度，\(l\) 为深度限制。


    # ## 3.4 启发式搜索


    前述的各种搜索方法都是按事先规定的路线进行搜索的，没有采用问题本身的特征信息，具有较大的盲目性，产生的无用节点较多，搜索空间较大，效率不高。如果能够利用问题自身的一些特征信息来指导搜索过程，则可以缩小搜索范围，提高搜索效率。


    启发式搜索通常用于两种问题：正向推理和反向推理。正向推理一般用于状态空间的搜索，推理是从预先定义的初始状态出发向目标状态方向执行；反向推理一般用于问题规约中，推理是从给定的目标状态向初始状态执行的。使用启发式函数的正向推理搜索算法包括
    A*算法等，反向推理算法包括 AO*算法等。


    # ### 3.4.1 启发性信息和评估函数


    如果在选择节点时能充分利用与问题有关的特征信息，估计出节点的重要性，就能在搜索时选择重要性较高的节点，以利于求得最优解，这个过程称为启发式搜索。“启发式”实际上代表了“大拇指准则”（rule
    of thumb）：在大多数情况下是成功的，但不能保证一定成功。


    与被解问题的某些特征有关的控制信息（如解的出现规律、解的结构特征等）称为搜索的启发信息，反映在评估函数中。评估函数的作用是估计待扩展节点在问题求解中的价'
