  md: '根据如上推导，同理可得关于 LN 的公式：

    O(H|\neg E) = LN \times O(H)

    (5.20)


    式（5.20）称为贝叶斯公式的必要似然性形式。


    对于 LN 有以下几点说明。


    +   1) LN 表示 E 假（不存在）对 H 的影响程度。


    +   2) LN 称为必要似然因子。


    +   3) LN = 0 时，P(\neg H | E) = 0。


    +   4) 当 LN > 1 时，P(H|\neg E) > P(H)，即 \neg E 支持 H，\neg E 导致 H 为真的可能性增加；


    当 LN \to \infty 时，表示证据 \neg E 将致使 H 为真；当 LN = 1 时，表示 \neg E 对 H 没有影响，与 H 无关；当
    LN < 1 时，说明 \neg E 不支持 H，\neg E 导致 H 为真的可能性下降；当 LN = 0 时，\neg E 的存在使得 H 为假。


    对于 LS 和 LN 的关系，LN \geqslant 0，LS \geqslant 0，因为一个证据 E 及其否定 \neg E 不可能同时既支持又反对一个假设
    H，所以任一条规则 E \to H 的 LS、LN 只能是下列情况中的一种。


    +   1) LS > 1 且 LN < 1。


    +   2) LS < 1 且 LN > 1。


    +   3) LS = LN = 1。


    需要说明的是，一个事件的概率是在事实数据的基础上计算出来的，这通常需要大量的统计工作。为了避免这种情况，在主观贝叶斯方法中，一个命题的概率可以由领域专家根据经验直接给出，这种概率称为主观概率。推理网络中每个陈述
    H 的先验概率 P(H) 就是由专家直接给出的主观概率。同时，推理网络中每条规则的 LS、LN 也需由专家指定，不一定真的是按照公式计算的数值。所以，领域专家根据经验所提供的
    LS、LN 通常不满足这一理论上的限制，它们常常在承认 E 支持 H（LS > 1）的同时却否认 E 反对 H（LN < 1）。


    【例 5.2】 已知 PROSPECTOR 专家系统中的一条规则：


    R：如果有石英硫矿带，那么必有铀矿。


    对于这条规则来说，有 LS = 300，LN = 0.2。


    证明 因为 LS = 300 >> 1，观察到石英硫矿带非常有用，而若不能观察到石英硫矿带，则没有什么意义；因为 LN << 1，那么，缺乏硫矿带将强烈表明假设是错误的。


    # (2) 证据不确定性的表示


    在主观贝叶斯方法中，证据的不确定性也用概率表示。对于证据 E，由用户根据观察 S 给出 P(E|S)，即动态强度。用 P(E|S) 描述证据的不确定性（证据
    E 不是可以直接观测的）。


    由于主观给定 P(E|S) 有困难，因此实际中可以用可信度 C(E|S) 代替 P(E|S)。


    在探矿专家系统 PROSPECTOR 中，C(E|S) 取整数 {-5, \cdots, 5}，它们的关系如图 5.2 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_140_0.png)


    图 5.2 PROSPECTOR 中 C(E|S) 与 P(E|S) 的对应关系'
