    # 2. AO*搜索


    与一般图（或图）的搜索过程类似，引入应用领域的启发式知识引导搜索过程，可以显著提高搜索的有效性，加速搜索算法的收敛。考虑到与/或图中搜索的是解树，非由相邻节点间路径连接成解路径，所以估算评价函数
    f(n)的第 1 分量 g(n)没有意义，只需估算第 2 分量 h(n)。注意，h(n)也不是对最小路径代价的估计，而是对最小解图代价的估计。另外，由于与/或图中子节点或子节点组间可以存在“或”关系，因此在搜索过程中会同时出现多个候选的待扩展局部解图，应估计所有这些局部解图的可能代价，并从中选择一个可能代价最小的用于下一步搜索。解图以递归方式生成，解图的代价也以递归方式计算，所以一旦某父节点
    n 的由外向 K-连接指向的子节点 n1,n2,...,nk 都估算了其 h(n)(i=1,2,...,k) 的值，则从父节点 n 到终节点集合解图的可能代价
    f(n)可以用公式


    $f(n) = K + h(n_1) + h(n_2) + \cdots + h(n_k)$ (3.25)


    进行计算，并用于取代原先在扩展出节点 n 时直接基于 h(n)估算而得出的 f(n)值。显然，基于子节点 h(n) 算出的 f(n)更准确。如此递归，可以计算出更准确的
    f(n0)，即从初始状态节点到终节点集合的解图的可能代价。


    下面给出实现与/或图启发式搜索的 AO*算法，再讨论该算法应用的若干问题。


    # 3. AO*搜索过程


    设 G 为搜索图；G''为被选中的待扩展局部解图；LGS 为候选的待扩展局部解图集；n0 为根节点，即初始状态节点；n 为被选中的待扩展节点； f1(n0)
    为第 i 个候选的待扩展局部解图的可能代价。


    该 AO*搜索过程如下。


    +   1) G:=n0， LGS 为空集。

    +   2) 若 n0 是终节点，则标记 n0 为能解节点；否则计算 f(n0) = g(n0)，并把 G 作为 0 号候选局部解图加进 LGS。

    +   3) 若 n0 标记为能解节点，则算法成功返回。

    +   4) 若 LGS 为空集，则搜索失败返回，否则从 LGS 选择 fi(n0) 最小的待扩展局部解图作为 G''。

    +   5) G''中选择一个非终节点的外端节点（尚未用于扩展出子节点的节点）作为 n。'
