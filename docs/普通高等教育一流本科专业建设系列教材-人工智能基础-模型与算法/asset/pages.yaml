- pgno: 57
  md: '# # 第 3 章 搜索策略


    早期人工智能算法进行问题求解的过程就是在给定具体问题后，利用算法在问题所对应的解空间中进行搜索，得到与问题需求相对应的、满足一定约束条件的最佳答案，即寻找一条从初始状态到目标状态的最佳路径。


    按解决问题所需的领域特有知识的多少，问题求解系统可分为两大类：知识贫乏系统和知识丰富系统。前者必须依靠搜索技术解决问题，后者则求助于推理技术。目前，搜索技术渗透在各种人工智能系统中，如专家系统、自然语言理解、自动程序设计、模式识别、机器学习、信息检索和博弈等领域都广泛使用搜索技术。


    本章首先介绍搜索的有关概念，然后详述状态空间的知识表示和搜索策略，如一般图搜索、盲目搜索、启发式搜索、回溯搜索等，最后讨论博弈问题的智能搜索算法。


    # ## 3.1 搜索概述


    智能系统要解决的问题各式各样，其中大部分是结构不良或非结构化的问题，对这样的问题一般没有通用的算法可以求解，只能利用已有的知识逐步摸索。在此过程中存在着如何寻找可用知识的问题，即如何确定推理路线，使得问题能够得到较好的解决，同时付出的代价尽可能的少。例如，在推理中可能存在多条路线都可实现对问题的求解，这就存在按哪一条路线进行求解以获得较高的运行效率的问题。


    因此，对于给定的问题，智能系统的行为一般是找到能够达到所希望目标的动作序列，并使其付出的代价最小，性能最好。搜索就是找到智能系统动作序列的过程。


    在智能系统中，即使对于结构性能较好、理论上有算法可依的问题，由于问题本身的复杂性，以及计算机在时间、空间上的局限性，有时也需要通过搜索来求解。


    在人工智能中，搜索一般包括两个重要的问题：搜索什么、在哪里搜索。前者通常指的是搜索目标，后者通常指的是搜索空间。搜索空间通常是指一系列状态的汇集，因此也称为状态空间。与通常的搜索空间不同，人工智能中大多数问题的状态空间在问题求解之前不一定完全知道。所以，人工智能中的搜索可以分成两个阶段：状态空间的生成阶段和该状态空间中对所求问题状态的搜索阶段。


    根据在问题求解过程中是否运用启发性知识，搜索分为盲目搜索（又称为非启发式搜索）和启发式搜索。


    # ### 1. 盲目搜索


    盲目搜索是指在问题的求解过程中，不运用启发性知识，只按照一般的逻辑法则或控制性知识，在预定的控制策略下进行搜索，在搜索过程中获得的中间信息不用来改进控制策略。由于搜索总是按预先规定的路线进行，没有考虑到问题本身的特性，因此这种方法缺乏对求解问题的针对性，需要进行全方位的搜索，而没有选择最优的搜索途径。因此，这种搜索具有盲目性，效率较低，容易出现组合爆炸问题。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '典型的盲目搜索有深度优先搜索（depth-first search, DFS）和宽度优先搜索（breadth-first search, BFS）。


    # 2. 启发式搜索


    启发式搜索是指在问题的求解过程中，为了提高搜索效率，运用与问题有关的启发性知识，即解决问题的策略、技巧、窍门等实践经验和知识，来指导搜索朝着最有希望的方向前进，加速问题求解过程并找到最优解。典型的启发式搜索有
    A 算法和 A*算法。


    搜索问题中的主要工作是找到正确的搜索策略。搜索策略可以通过如下准则来评价。


    +   1）完备性：如果存在一个解答，该策略是否保证能够找到。

    +   2）时间复杂性：需要多长时间可以找到解答。

    +   3）空间复杂性：执行搜索需要多少存储空间。

    +   4）最优性：如果存在不同的解答，该策略是否可以发现最高质量的解答。


    搜索策略反映了状态空间或问题空间的扩展方法，也决定了状态或问题的访问顺序。

    根据搜索策略的不同，人工智能中搜索问题的命名也不同。例如，考虑一个问题的状态空间为一棵树的形式。如果根节点先扩展，再扩展根节点生成的所有节点，然后是这些节点的后继，如此反复，这就是宽度优先搜索。另一种方法是在树的最深一层的节点中扩展一个节点，只有当搜索遇到一个死亡节点（非目标节点且无法扩展）时，才返回上一次可选其他节点的位置继续进行搜索，这就是深度优先搜索。无论是宽度优先搜索还是深度优先搜索，节点遍历的顺序一般是固定的，即一旦搜索空间给定，节点遍历的顺序就固定了。

    这类遍历称为确定性的，即盲目搜索。对于启发式搜索，在计算每个节点的参数之前无法确定先选择哪个节点扩展，这种搜索一般被称为非确定性的。


    # 3.2 一般图搜索


    搜索适合设计基于一个操作算子集的问题求解任务，每个操作算子的执行均可使问题求解更接近于目标状态，搜索路径将由实际选用的操作算子的序列构成。本节将从状态空间这一概念入手，介绍一般图搜索算法，并讨论提高状态图搜索效率的方法。


    # 3.2.1 图搜索的基本概念


    # 1. 显式图和隐式图


    为了求解问题，需要把有关知识存储在计算机的知识库中，其存储方式有以下两种。


    +   1）显式存储（或显式图）：把与问题有关的全部状态空间图，即相应的有关知识（叙述性知识、过程性知识和控制性知识）全部直接存入知识库。

    +   2）隐式存储：只存储与问题求解有关的部分知识（部分状态空间）。在求解过程中，由初始状态出发，运用相应的知识，逐步生成所需的部分状态空间图，通过搜索推理，逐步转移到要求的目标状态，只需在知识库中存储局部状态空间图，这种图称为隐式图。


    为了节约计算机的存储容量，提高搜索推理效率，通常采用隐式存储方式，进行隐式图搜索推理。'
