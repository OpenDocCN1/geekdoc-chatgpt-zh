- pgno: 8
  md: '# 第 1 章 绪 论


    人工智能（artificial intelligence, AI）是当前科学技术迅速发展及新思想、新理论、新技术不断涌现的形势下产生的一个学科，也是一门涉及数学、计算机科学、哲学、认知心理学、信息论、控制论等的交叉学科。人工智能主要采用人工方法和技术，模仿、延伸和扩展人的智能，实现机器智能，其长期目标是实现人类水平的机器智能。本章主要介绍人工智能的基本概念、发展历史及其三大流派。


    # 1.1 人工智能的基本概念和特征


    # 1. 人工智能的基本概念


    人工智能作为一门前沿交叉学科，其定义一直有着不同的观点。维基百科中定义“人工智能就是机器展现出的智能”，即只要是某种机器，具有某种或某些“智能的特征或表现，就都应该算作‘人工智能’”。通常，人工智能的定义可分为如下
    4 类：类人行为方法、类人思维方法、理性思维方法和理性行为方法。下面将从不同的角度、不同的层面给出人工智能的定义。


    +   (1) 类人行为方法


    1950 年，被誉为计算机科学与人工智能之父的英国计算机科学家艾伦·图灵（Alan Turing）提出图灵测试，并将“计算”定义为：应用形式规则，对未加解释的符号进行操作。将一个人与一台机器置于一间房间中，而与另外一个人分隔开来，并把后一个人称为询问者。询问者仅根据收到的答案辨别出哪个是计算机，哪个是人。如果询问者不能区别出机器和人，那么根据图灵的理论，就可以认为该机器是智能的。


    图灵测试具有直观上的吸引力，成为许多现代人工智能系统评价的基础。如果一个系统已经在某个专业领域实现了智能，那么可以通过把它对一系列给定问题的反应与人类专家的反应相比较，从而对其进行评估。


    +   (2) 类人思维方法


    1978 年，动态规划的创始人美国应用数学家理查德·贝尔曼（Richard Bellman）提出，人工智能是那些与人的思维、决策、问题求解和学习等相关活动的自动化，其主要采用的是认知模型的方法——关于人类思维工作原理的可检测理论。


    1990 年，美国计算机科学和认知信息学领域的科学家艾伦·纽厄尔（Allen Newell）把来自人工智能的计算机模型与来自心理学的实验技术相结合，创立了一种精确且可检验的人类思维方式理论
    SOAR（state, operator and result，状态、算子和结果），并希望该理论能实现各种弱方法。SOAR 实现弱方法的基本原理是不断地用算子作用于状态，以得到新的结果。


    +   (3) 理性思维方法


    1985 年，美国布朗大学计算机科学和认知科学家尤金·查尔尼克（Eugene Charniak）教'
  merge: -1
