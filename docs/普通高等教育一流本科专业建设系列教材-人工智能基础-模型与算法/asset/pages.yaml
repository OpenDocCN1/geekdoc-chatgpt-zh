  md: '![](img/01b3dd63f105ee2f61ade787bae553f5_271_0.png)


    在该模型中，网络分为输入层、隐藏层和输出层。这是一个两层神经网络，通常把输入矩阵 $X$ 记为 $a^{(0)}$，把隐藏层输出记为 $a^{(1)}$。隐藏层对应的权重
    $W^{(1)}$、常数项 $b^{(1)}$，$W^{(1)}$ 的维度是 (4,3)。这里的 4 对应着隐藏层神经元的个数，3 对应着输入层特征向量 $x$
    包含元素的个数。常数项 $b^{(1)}$ 的维度是 (4,1)，这里的 4 同样对应着隐藏层神经元的个数。


    这就是基本的神经网络模型结构，每一个圆圈代表一个神经元，每一个神经元包含一个非线性激活函数。本模型中，可以用线性整流（rectified linear units,
    ReLU）函数作为激活函数。ReLU 函数的表达式如下：


    \(\sigma(z) = \max(0, z)\) (8.57)


    它会对上一层的输入进行加权求和和：


    \(z = w^\mathrm{T} x + b\) (8.58)


    式中，$w$ 和 $b$ 为模型需要学习的参数。


    将得到的值 $z$ 送入激活函数中，将最后得到的值作为该神经元的输出。第一部分根据输入和权重计算得到 $z$；第二部分在 $z$ 上施加激活函数，得到神经元的最终输出
    $a$。每个神经元的计算过程如图 8.13 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_271_1.png)


    图 8.13 每个神经元的计算过程


    浅层神经网络的中间层数量较少，但不可否认的是浅层神经网络比较大，参数数量很多。与浅层神经网络相比，深层神经网络可以用更少的参数更好地组装出很多的功能。


    # 8.3.3 贝叶斯分类器


    # 1. 贝叶斯决策论


    贝叶斯决策论（Bayesian decision theory）是概率框架下实施决策的基本方法。对分类任务来说，在所有相关概率都已知的理想情形下，贝叶斯决策论考虑如何基于这些概率和误判损失来选择最优的类别标记。下面以多分类任务为例来解释其基本原理。


    假设有 $N$ 种可能的类别标记，即 $y=\{c_1, c_2, \cdots, c_N\}$，$\lambda_{ij}$ 是将一个真实标记为 $c_j$
    的样本'
