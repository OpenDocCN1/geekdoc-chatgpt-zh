    # 2. 禁忌搜索算法的流程


    禁忌搜索算法初始化时，在搜索空间随机生成一个初始解 A，禁忌表 H 置空，当前解 A 记为历史最优解 S 并进入迭代的搜索过程。在每一次迭代中，都从当前的解
    A 出发，在当前禁忌表 H 的限制下，构造出解 A 的邻域 O，然后从 O 中选出适应度最好的解 B 来替换解 A，同时更新禁忌表。在解 B 替换解 A 之后，如果解
    A 的质量得到改善，那么历史最优的解 S 将被解 A 替换；否则，S 保持不变，即使解 A 虽然暂时变差，但是由于扩大了搜索空间，仍有利于跳出局部最优。得到了新的当前解
    A 之后，算法返回迭代的开始继续进行，直到找到最优解或者运行了一定的迭代次数等终止条件时结束。禁忌搜索算法的流程如图 6.19 所示。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_204_0.png)


    图 6.19 禁忌搜索算法的流程


    +   第 1 步，随机生成一个解 i，设置代数 k = 0，禁忌表 H 设为空，假设最优解 s = i。

    +   第 2 步，判断当前最优解是否满足终止条件，若不满足则跳转到第 3 步，若满足则算法结束。

    +   第 3 步，构造解 i 的邻域 A = N(i,H)。

    +   第 4 步，从邻域 A 中找出比当前解更优秀的解 j，令 i = j，并且更新 H 。

    +   第 5 步，判断 f (i) 是否小于 f (s)，若小于则进入下一步，若不小于则跳转到第 7 步。

    +   第 6 步，令 s = i。

    +   第 7 步，k = k + 1，跳转到第 2 步。


    就禁忌搜索算法而言，它通过邻域择优模仿了人类的记忆功能，通过禁忌表实现了算法的只进不退，避免了搜索过程中的循环操作，并且改进了爬山法中局部最优停止搜索的问题，它不以局部最优为停止准则，使找到全局最优的可能性大幅提升。


