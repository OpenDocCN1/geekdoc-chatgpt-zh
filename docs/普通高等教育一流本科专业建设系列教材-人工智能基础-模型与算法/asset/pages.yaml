- pgno: 9
  md: '授和美国耶鲁大学计算机科学家德鲁·麦克德蒙（Drew McDermott）教授提出人工智能是用计算模型研究智力能力，这是一种理性思维方法。一个系统如果能够在其所认知范围内正确行事，其就是理性的。古希腊哲学家亚里士多德（Aristotle）是首先试图严格定义“正确思维”的人之一，他将其定义为不能辩驳的推理过程。他的三段论方法给出了一种推理模式，当已知前提正确时总能产生正确的结论。例如，专家系统是推理系统，所有的推理系统都是智能系统，因此专家系统是智能系统。


    # (4) 理性行为方法


    美国计算机科学家尼尔斯·尼尔森（Nils Nilsson）认为人工智能关心的是人工制品中的智能行为。这种人工制品主要是指能够动作的智能体（agent）。行为上的理性指的是已知某些信念，执行某些动作以达到某个目标。智能体看作可以进行感知和执行动作的某个系统。在该方法中，研究人工智能可以认为就是研究和建造理性智能体。


    简而言之，人工智能可以定义为用人工的方法和技术，模仿、延伸和扩展人类智能和行为，实现机器智能。人工智能被认为是计算机科学的一个分支，随着智能科学的兴起，人工智能将是智能科学的一个重要支柱。


    人工智能的定义对人工智能学科的基本思想和内容做出了解释，即围绕智能活动而构造的人工系统。人工智能是知识的工程，是机器模仿人类利用知识完成一定行为的过程。根据人工智能是否能够真正实现推理、思考和解决问题，可以将人工智能分为弱人工智能和强人工智能。


    弱人工智能是指不能真正实现推理和解决问题的智能机器，这些机器从表面上看像是智能的，但是并不真正拥有智能，也不会有自主意识。迄今为止的人工智能系统都还是实现特定功能的专用智能，而不是像人类智能那样能够不断适应复杂的新环境并不断涌现出新的功能，因此基本上都是弱人工智能。目前的主流研究仍然集中在弱人工智能上，并取得了显著进步，如在语音识别、图像处理和物体分割、机器翻译等方面取得了重大突破，甚至可以接近或超越人类水平。


    强人工智能是指真正能思维的智能机器，并且认为这样的机器是具有知觉和自我意识的，这类机器可分为类人（机器的思考和推理类似人的思维）与非类人（机器产生了与人完全不一样的知觉和意识，使用与人完全不一样的推理方式）两大类。从一般意义上来说，达到人类水平的、能够自适应地应对外界环境挑战的、具有自我意识的人工智能称为强人工智能，也称为通用人工智能或类人智能。强人工智能不仅在哲学上存在巨大争论（涉及思维与意识等根本问题的讨论），在技术上的研究也具有极大的挑战性。强人工智能当前鲜有进展，美国私营部门的专家及国家科技委员会比较支持的观点是，至少在未来几十年内难以实现。其中一个主流看法是：即使有更高性能的计算平台和更大规模的大数据助力，其也还只是量变，不是质变，人类对自身智能的认识还处在初级阶段，在人类真正理解智能机理之前，不可能造出强人工智能。理解大脑产生智能的机理是脑科学的终极问题，大多数脑科学专家认为这是一个数百年乃至数千年甚至永远都解决不了的问题。


    通向强人工智能还有一条“新”路线，这里称其为“仿真主义”。这条新路线通过制造先进的大脑探测工具从结构上来解析大脑，再利用工程技术手段构造出模仿大脑神经网络基元及结构的仿脑装置，最后通过环境刺激和交互训练仿真大脑实现类人智能，简言之，即“先结构，后功能”。虽然这项工程也十分困难，但它是有可能在数十年内解决的工程技术问题，而不像“理解大脑”这个科学问题那样遥不可及。'
