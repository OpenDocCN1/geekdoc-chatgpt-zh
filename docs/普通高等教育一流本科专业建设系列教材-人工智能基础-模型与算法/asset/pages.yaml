  md: '![](img/01b3dd63f105ee2f61ade787bae553f5_113_0.png)


    图 4.4 基于规则的专家系统的结构


    基于规则的专家系统的主要部分是知识库和推理引擎。根据到目前为止的推理系统，知识库由谓词演算事实和有关谈论主题的规则构成；推理引擎由所有操纵知识库来演绎用户要求的信息的过程构成，如消解、前向链或反向链；用户接口可能包括某种自然语言处理系统，它允许用户用一个有限的自然语言形式与系统进行交互，也可以用带有菜单的图形接口界面与系统进行交互；解释子工具分析被系统执行的推理结构，并把它解释给用户。


    在实际应用中，这 4 部分构成了一个系统。在一个专家系统结构中，一个“知识工程师”（经常是一个训练过的人工智能科学家）与应用领域的一个专家（或几个专家）共同工作，以便把专家的相关知识表示成一种形式，并能被输入知识库中。这个过程经常由知识采集子系统协助完成。与其他情况一样，知识采集子系统检查正在增长的知识库的可能不一致和不完备信息，然后将它们表示给专家以做决定。


    +   2) 基于框架的专家系统建立在框架的基础之上，针对目标需求进行编程优化。在设计基于框架系统时，专家系统的设计者把目标称为框架。


    基于框架的专家系统是一个计算机程序，该程序使用一组包含在知识库内的框架对工作存储器内的具体问题特征进行处理，通过推理机推断出新的信息。它的主要设计步骤与基于规则的专家系统相似，主要差别在于如何看待和使用知识。在设计基于框架的专家系统时，把整个问题和每件事想象为编织起来的事物，在辨识事物之后，寻找把这些事物组织起来的方法。对于任何类型的专家系统，其设计都是高度交互的过程。


    +   3) 基于模型的专家系统以模型推理方法为基础。模型推理方法是根据反映事物客观规律的模型进行知识推理的，这里所说的模型可以是用于表示系统部分-整体关系的结构模型，也可以是用于表示各部分功能的功能模型，或是用于表示各部分功能因果关系的因果模型等。有模型可供使用的领域就可以使用基于模型的专家系统。


    如果将运用启发式规则的推理称为浅层推理，那么基于模型的推理可以称为深层推理。浅层推理根据专家经验，做出效率较高而问题解决能力较低的推理；深层推理在接触事物本质的条件下具有较强的问题解决能力，但是效率相对较差。所以，很多人将浅层推理和深层推理相结合，提出了第二代专家系统的概念。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '神经网络使用大量神经元的互连及对各连接权的分布来表示特定的概念或知识，在知识获取的过程中只要求专家提出范例及相应的解，就能通过特定的学习算法对样本进行学习。通过网络内部自适应算法不断修改连接权值分布达到要求，并把专家求解实际问题的启发式知识和经验分布到网络连接权值的分布上。在神经网络中，允许输入偏离学习样本，只要输入模式接近于某一学习样本的输入模式，输出也会接近于学习样本的输出模式，这种性质使得神经网络专家系统具有联想记忆的能力。图
    4.5 所示为一个基于人工神经网络的专家系统的基本结构。专家提供相应的解，通过输入/输出系统将其存入知识库，用特定的神经网络学习算法，通过对样本的学习，得到所需权值的分布。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_114_0.png)


    与传统专家系统相比，神经网络专家系统具有自身独特的性质：①神经元网络知识库体现在神经元之间的连接权值上，它是分布式存储的，适合于并行处理，一个节点的信息由多个与它连接的神经元的输入信息及连接权值合成；②推理机基于神经元的信息处理过程，它是以
    M-P（McCulloch-Pitts）模型为基础的，采用数值计算方法，这使实际问题的输入/输出都要转化为数值形式；③神经元网络有成熟的学习算法，学习算法与采用的模型有关，基本上是基于
    Hebb 规则，感知器采用 Delta 规则，通过反复的学习，逐步修正权值，使其适合于给定的样本。另外，神经网络专家系统容错性好，由于信息是分布式存储，即使个别单元出错或是丢失信息，单元的总体计算结果也可能不会改变。这与人在丢失部分信息后仍有对事物的正确分辨能力相类似。


    # (4) 专家系统的开发


    采用原型技术的专家系统开发过程可以分为设计初始知识库、原型系统开发与实验、知识库的改进与归纳 3 个主要步骤。


    # 1) 设计初始知识库。


    知识库是专家系统最重要的一个组成部分，知识库的设计与建立是专家系统开始开发中最重要的一项任务，如图 4.6 所示。其主要有以下几个工作需要完成。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_114_1.png)


    ① 问题的知识化：对要解决的领域问题，确定问题的定义方式、要完成的主要任务、包含的主要数据、子任务的分解等。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '② 知识的概念化：概括知识表示所需要的关键概念及其关系，如数据类型、初始条件、目标状态、控制策略等。


    ③ 概念的形式化：确定用来组织知识的数据结构形式，把概念化过程得到的有关概念用相应的知识表示方法表示出来。


    ④ 形式的规则化：把形式化的知识转变为由编程语言表示的可供计算机执行的程序。


    ⑤ 规则的合理化：确认规则化了的知识的合理性，检查规则的有效性。


    2) 原型系统开发与实验。当知识表示方式确定之后，即可建立原型系统，它包括整个模型的典型知识，而且只涉及与实验有关的简单的任务和推理过程。


    3) 知识库的改进和归纳。在原型系统的基础上，对知识库和推理机反复进行改进试验，归纳出更完善的结果。如此不断提高专家系统的水平，直到满意为止。


    # (5) 专家系统与传统程序


    专家系统的出现引发了人们对其与传统程序的对比思考。专家系统设计不同于传统的程序设计，因为其问题通常没有算法去求解，而是依靠推理获得一个合理的解决方法。算法是一种理想的解决方案，它会在有限的时间内给出答案。然而，传统算法设计有时会令问题的复杂程度增加，这时就需要使用人工智能算法，在没有任何可用的算法帮助获得最佳方法时，一个合理的方法就是最好的。


    专家系统依赖于推理，解释机用于解释这个过程，这个过程是可检查的。有些专家系统甚至允许系统通过规则归纳从例子中学习规则，在归纳时，系统从数据中生成规则。


    传统程序事实上是算法和数据结构的结合，关于问题求解的知识隐含于程序中。相比之下，专家系统是知识和推理的结合，知识单独组成知识库，与推理机分离。传统程序与专家系统的对比如表
    4.2 所示。


    # 表 4.2 传统程序与专家系统的对比


    | 传统程序 | 专家系统 |

    | :--- | :--- |

    | 知识和处理组合在一个单元中 | 知识库和处理机制是两个独立的组件 |

    | 涉及数值计算和数据处理 | 涉及对符号的处理 |

    | 不具有解释功能 | 具有解释功能 |

    | 程序不会出错（除非编程错误） | 专家系统可能会出错 |

    | 该系统仅在完全开发后才可运行 | 专家系统持续优化，可以使用少量规则后启动 |

    | 需要根据固定算法逐步执行 | 执行是按逻辑和启发式完成的 |

    | 需要完整的信息 | 可以在足够或不充分的信息下起作用 |


    # 2. Agent (智能体) 系统


    人工智能可以看作一个研究能够产生智能行为的计算 Agent 的综合与分析领域，其核心目标是设计和合成有用且智能的产品。


    # (1) Agent


    Agent 是指在具体环境中具有动作能力的对象，如一个人、一个机器人、一条狗、一阵风、重力、一盏灯或一个能购物和售货的计算机程序。


    有意图的 Agent 是具有偏好的，它会偏爱某种状态环境，并将采取行动来达到它最偏好的状态；无意图的 Agent 则会聚集在一起并被称为自然。建模时需设定一个
    Agent 是否有意图，这样的假定是否合适是由具体环境来决定的。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '如果一个 Agent 不具有偏好，由定义可知它不会关心其所处的环境状况，因此也不会关心自己做什么。设计此类 Agent 的唯一目的是逐步培养其偏好，使其更偏爱某种环境状态并尽力实现。Agent
    并非必须知道自己的偏好，如一个恒温器，它只需感知环境，并控制加热器开和关即可。但它通常会被嵌入一定的偏好，即让房间中的人员处在一个合适的温度中，尽管它并不知道自己具有此偏好。Agent
    的偏好一般就是设计者的偏好，但是有时在运行中也可赋予目标和偏好。


    Agent 通过传感器来接收信息，一个 Agent 的动作取决于通过传感器获取的信息，这些传感器有可能反映环境的真实状态。传感器可能是有噪声的、不可靠的、环掉的，甚至有时候传感器是可靠的，但是它传回的关于环境的信息却是模棱两可的，而
    Agent 却必须依靠其获取的信息进行决策。


    Agent 通过执行器进行动作。执行器同样可能是有噪声的、不可靠的、行动缓慢的或者是坏掉的。Agent 控制的是其发送给执行器的信息，经常会采取行动寻找更多的环境信息，如打开橱柜门查看物件或者对学生进行测试来测定他们的知识。


    # (2) Agent 系统的结构


    Agent 系统的结构如图 4.7 所示，该图展示了 Agent 与环境进行交互的一般过程。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_116_0.png)


    图 4.7 Agent 系统的结构


    一个 Agent 系统由 Agent 本身及其所处的环境构成。Agent 接收环境中的刺激，然后做出相应动作。


    一个 Agent 由主体（body）和控制器（controller）两部分组成。控制器从主体处接收感知，并将命令送给主体。主体包括传感器和执行器，传感器将外部刺激转换为感知，执行器将命令转换为动作。


    刺激包括光、声音、键盘上输入的单词、鼠标移动或者物理冲击，也包括从网页或者数据库中获取的信息。


    常见的传感器包括触摸传感器、相机、红外传感器、声呐、麦克风、键盘、鼠标或者通过网页抽取信息的 XML 阅读器。作为原型传感器，相机感知进入它的光束，将其转换成亮度数值的二维数组，称为像素。有时会使用多维像素数组来表示不同的颜色或者满足多镜头相机的需求，这些像素数组可被控制器感知。更多的时候，感知对象通常有着更高层的特征，如线、边或深层次的信息。通常来说，接收的都是特定信息，如明亮的橙色圆点的位置、学生关注的演出部分或者人们打出的手势信息等。


    动作一般包括转向、加速、移动关节、讲话、展示信息或者向某一网址发送邮件的命'
  merge: -1
  img_proc: true
- pgno: 117
  md: '令。命令又包括低级命令（如将发动机的电压设定为某个数值）和高级命令（如令一个机器人进行某些运动，如“启动”“到 s3 处标处”或者“匀速沿 S 形移动”等）。执行器与传感器类似，都包含噪声。例如，机器人在物理规则下运动，因此具备动量，且信息传递需要时间，接收到“匀速沿
    S 形移动”指令的机器人也许最终只是沿着大概的方向行进，而并非沿标准 S 形移动，且速度和方向都是不断波动的，甚至运动到某一指定位置的行为可能会由于各种原因而失败。


    为解决复杂问题的缓慢推理与 Agent 所需的针对高级目标的快速反应之间的矛盾，分层控制被提出。图 4.8 中所示为分层控制结构，每一层都将其下层看作一个可从中获取感知及发出命令的虚拟主体。越低层，反应速度越快，适用于那些需要快速反应的情况，且能将对环境更简单直白的感知传给高层，隐藏不重要的信息。总的来说，不同时间的状态之间会有大量的特征在层与层之间传递。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_117_0.png)


    图 4.8 分层控制结构


    对于每个时刻的每一层，存在如下 3 类输入。


    +   1) 来自信念状态的特征，指的是这些特征所记住的或以前的状态值。

    +   2) 从下层结构得到的感知的特征。

    +   3) 从上层结构得到的命令的特征。


    对于每个时刻的每一层，存在如下 3 类输出。


    +   1) 对应上层的更高等级的感知。

    +   2) 对应下层的低等级命令。

    +   3) 信念状态特征的下一个值。


    层级的实现方式决定了层的输出是如何由输入函数得出的。此函数的计算可以涉及任意计算，目的是使每层尽可能简单。


    为了实现控制器，层上的任何输入必须有确切的赋值来源，每个感知或者命令输入应该源自与其相连的其他层的输出。其他的输入来源于记住的信念。每层上的输出不必有相连对象，或者可与多个输入相连接。高级推理在高层上给出，一般是离散的、定性的；而底层中给出的低级推理则是连续的和定量的。一个可推理产生离散和连续两种值的控制器'
  merge: -1
  img_proc: true
- pgno: 118
  md: '称为混合系统。


    # （3）Agent 系统的分类


    牛津大学的计算机科学教授伍德里奇（Wooldridge）和詹宁斯（Jennings）等提出的 Agent 应具有自主性、反应性、社会能力和主动性 4 个基本属性，大多数研究者认为
    Agent 除了满足上述基本特性之外，还应具有移动性、适应性、学习性等特性。Agent 的特性使得它表现出类似人的特性，为解决企业复杂问题提供了新的思路。


    现有的 Agent 应用大都以某几个属性作为关键属性进行结构设计。Agent 结构大体上可以分为以下几类。


    # 1）思考型 Agent。


    思考型 Agent 被看作一种意识系统，它是一种特殊的知识系统，即通过符号 AI 的方法实现表示和推理。这种结构直接反映了 Agent 作为意识系统的理性本质，是支撑行为推理、思维判断等意识活动的关键，也是构造各类复合型
    Agent 个体的基础。图 4.9 给出了思考型 Agent 的基本结构。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_118_0.png)


    图 4.9 思考型 Agent 的基本结构


    选择什么样的意识态度来刻画 Agent 是构造思考型 Agent 首先要考虑的问题。根据理性的不同实现方式，有以下几种典型的思考型 Agent 结构。


    +   ① 基于经典逻辑的 Agent 结构以经典逻辑公式表述 Agent 的状态和行为，以在一定推理规则下演绎推理表述 Agent 的思维决策过程，将推理求得的结果公式作为输出动作。由于经典逻辑具有严密的语法和直观、简洁的语义，因此基于经典逻辑的
    Agent 结构也具有这些优点。但同时，由于经典逻辑本身的局限性，在问题复杂度增加的同时，推理过程的计算复杂度也呈指数上升，因此其在很多情况下失去了实用价值。另外，经典逻辑的表达能力有限，对复杂环境状态难以建立相应的逻辑式表达，更难以表示信念、意愿等反映思维意识的概念。


    +   ② 基于 BDI（belief-desire-intention，信念-愿望-意图）模型的思考型 Agent 结构反映了人们为了实现既定目标而采取一系列行动的过程，具有深刻的认知心理学和哲学基础。BDI
    模型中的信念是指 Agent 所掌握的关于当前世界状况及为达到某种效果可能采取的行为路线的估计，表示 Agent 对环境和自身的了解；愿望则描述了 Agent
    对未来实际状'
  merge: -1
  img_proc: true
- pgno: 119
  md: '况及可能采取的行为路线的喜好。Agent 可以是不相容的，也允许存在不可达的愿望，其中相容且可达的部分构成目标集。由于资源的有限性，Agent 不可能一次追求所有的目标，它选择目标集中的一部分形成意图。信念、愿望、意图等概念通过人们的日常生活可建立起一些非形式化的概念，同时为分布式环境中的
    Agent 交互打下基础。


    BDI 模型也存在一些问题。首先，通过逻辑描述的方法表达信念、愿望、意图等反映思维状态的概念并合理完成相应的推理转换有一定的难度；其次，BDI 模型实际上可以说是个体
    Agent 的思维属性，描述 Agent 之间的社会层面的交互存在一定的局限性。人们提出要使 Agent 具有社会层面的思维属性，但在实用化方面仍然有很多困难。


    ③ 基于决策理论的 Agent 结构认为，Agent 先观察外部环境再通过自身的预测、思考或规则匹配并输出行为的过程可看作 Agent 求解问题并追求效用最大化的过程。因此，Agent
    理性行为可以从描述理论出发，通过基于效用评价的决策过程来刻画。基于决策理论的 Agent 结构较好地反映了人们求解问题的实际过程，可以在决策理论的指导下，综合运用数学、逻辑、人工智能等多种技术加以实现。同时，可用对方案结果的估计来表示信念，用各个可能结果状态的效用反映愿望，可较好地实现
    Agent 的 BDI 框架结构。


    值得注意的是，由于决策 Agent 的资源有限性和客观世界无限性的矛盾，决策者不可能尝试所有的方案。因此，可从如下两个方面寻求解决途径：一是对真实环境的简化，用较小的问题空间代替实际的问题空间，形成以估算和最优为特征的经典决策理论方法；二是以满意替代最优，形成以搜索和满意为特征的现代决策理论方法。满意法则并不需要严格估计或计算后果的发生概率及相应的效用，只需要一个相对范围，整个决策过程是一个逐步细化的搜索过程。但如果过程控制不好，也可能导致过多开销。


    # 2) 反应型 Agent。


    反应型 Agent 结构更加强调交互行为本身对产生智能和理性行为的作用，Agent 的智能、理性行为不是在其所处的环境中单独存在的，只能在现实世界与周围环境的交互中表现出来。反应型
    Agent 不依赖于任何符号表示，直接根据感知输入反射行动。如图 4.10 所示，反应型 Agent 只是简单地对外部刺激发生反应，没有使用符号表示的世界模型，也没有复杂的符号推理。其在决定如何行动时并不参考历史信息，决策完全基于当前状态。


