    # 3.5 爬山法和回溯策略


    在 g(x) = 0 的情况下，若限制只用评价函数 f(x) = h(x) 排序新扩展出来的子节点，即局部排序，就可以实现较为简单的搜索策略：爬山法和回溯策略。由于简单易行，在不要求最优解答的问题求解任务中，回溯策略得到广泛的应用；爬山法则适用于能逐步求精的问题。


    # 3.5.1 爬山法


    爬山法是实现启发式搜索的最简单方法。人们在登山时总是设法快速登上顶峰，只要好爬，总是选取最陡处，以求快速登顶。爬山实际上是求函数极大值的问题，不过这里不是用数值解法，而是依赖于启发式知识，试探性地逐步向顶峰逼近（广义地，逐步求精），直到登上顶峰。


    在爬山法中，限制只能向山顶爬去，即向目标状态逼近，不准后退，从而简化了搜索算法；不需设置 OPEN 和 CLOSE 表，因为没有必要保存任何待扩展节点；仅从当前状态节点扩展出子节点（相当于找到上爬的路径），并将
    h(x) 最小的子节点（对应到顶峰的最近的上爬路径）作为下一次考察和扩展的节点，其余子节点全部丢弃。


    爬山法对于单一极值问题（登单一山峰）十分有效且简便，但对于具有多极值的问题无能为力，因为很可能因错登高峰而失败——不能到达最高峰。


    # 算法 3.6 爬山法。


    ```

    **Procedure Hill-Climbing**

    **Begin**

    确定可能的开始状态并测量它们和目标节点的距离(f);

    以 f 升序排列，把这些节点压入栈中;

    **Repeat**

    弹出栈顶元素;

    **If** 栈顶元素=goal, 返回并结束;

    **Else** 把该元素的子节点以 f 升序排列压入栈中;

    ```'
