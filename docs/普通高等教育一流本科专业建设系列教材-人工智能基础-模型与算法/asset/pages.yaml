    \n# 3.3.2 深度优先搜索\n\n# 1. 深度优先搜索的基本思想\n\n深度优先搜索是一种自上而下的搜索策略，从初始节点 S0 开始，按生成规则生成下一级各子节点，检查是否出现目标节点\
