  md: '测试里，就容易确定什么样的人可以作为提问者和回答者。可惜的是，人并不能用经典概念的定义来定义。


    经典概念的基本假设还是指名、指心与指物等价，过于简单化，与人类的日常生活经验不符。在人类的现实生活当中，概念的指名、指心、指物并不总是等价的。在基于经典概念的知识表示框架下，现在的机器表现有时显得不尽如人意，缺乏常识，缺乏理解能力，严重缺乏处理突发状况的能力。实际上，英籍奥地利哲学家路特维希·维特根斯坦（Ludwig
    Wittgenstein）在 1953 年出版的《哲学研究》中明确提出，日常生活中使用的概念（如人等）是没有经典概念定义的，这实际上给图灵测试带来了很大的不确定性。因此，在经典概念表示不成立的情形下，如何进行概念表示极具挑战性。


    # 本章小结


    本章首先讨论了人工智能的定义。人工智能是研究可以理性地进行思考和执行动作的计算模型的学科，它是人类智能在计算机上的模拟。人工智能作为一门学科，经历了 4 个时期：初创时期、形成时期、发展时期和大突破时期，目前还在不断发展。本章还重点介绍了中国的人工智能发展。目前，人工智能的主要研究学派有符号主义、联结主义和行为主义。通过学习本章，读者能够理解人工智能的相关基础概念与定义，为学习后续章节的内容奠定基础，并更好地理解各种人工智能技术及其应用与意义。


