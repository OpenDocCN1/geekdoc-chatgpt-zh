- pgno: 201
  md: '强调自然进化中群体级的行为变化，适用于解决目标函数或约束条件不可微的复杂非线性实值连续优化问题。进化规划最初是定义在离散域上的操作，但近年来多用于解决连续域上的问题，所以本小节将从连续进化规划和离散进化规划两方面介绍进化规划。


    在介绍算法之前，首先介绍进化规划的基本操作过程。


    如图 6.18 所示，进化规划的主要流程如下。


    第 1 步，产生初始种群。在进化规划中产生初始种群，随机选择 \(\mu\) 个个体作为进化计算的出发点。


    第 2 步，计算适应度。进化规划采用十进制实数表达问题，计算适应度比较简单直观。


    第 3 步，突变。突变是进化规划产生新种群的唯一方法，它不采用重组或交换算子。


    第 4 步，选择。在进化规划中，新种群的个体数目 \(\lambda\) 等于旧种群的个体数目 \(\mu\)，在这 \(2\mu\) 个个体中选择 \(\mu\)
    个个体组成新种群。


    第 5 步，终止。进化规划的终止条件：最大进化代次、最优个体与期望值的偏差、适应度的变化趋势、最优适应度与最差适应度之差。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_201_0.png)


    图 6.18 进化规划的主要流程


    # 1. 连续进化规划


    对适应度函数 \(f(x)\) 进行优化，其中 \(x\) 是一个 \(n\) 维向量。假设 \(x > 0\) ， \(f(x) > 0\) ，进化规划从一个随机生成的种群
    \(\{x_i\} (i \in [1, N])\) 开始，按照式 (6.20) 生成子代 \(\{x''_i\}\)。


    \(x''_i = x_i + r_i \sqrt{\beta f(x) + \gamma} , \quad i \in [1, N] \quad \text{(6.20)}\)


    式中，\(r_i\) 为随机 \(n\) 维向量，其中每个元素均服从均值为 0，方差为 1 的高斯分布；\(\beta\) 和 \(\gamma\) 为进化规划的可调参数。


    \(x_i\) 的变异方差为 \([\beta f(x) + \gamma]\)。若 \(\beta = 0\)，则所有个体的平均变异大小相同；若 \(\beta
    > 0\)，则适应度函数值低的个体变异较少，适应度函数值高的个体变异较多。因此，一般取 \(\beta = 1\)、 \(\gamma = 0\) 作为标准进化规划的默认参数值。


    在对适应度函数 \(f(x)\) 进行优化时，应该明确如下问题：首先应该让 \(f(x)\) 移位，保证 \(f(x)\) 总是非负值；其次，调试 \(\beta\)
    和 \(\gamma\) 是有必要的，一般默认 \(\beta = 1\)、 \(\gamma = 0\) ，但不能保证这种取值针对任意变异总是有效；最后，若
    \(\beta > 0\) 且所有适应度函数值都较高，则 \([\beta f(x) + \gamma]\) 对全部 \(x_i\) 近似为常数，对所有个体，无论其适应度函数值大小，预期的变异都近似为常数。'
