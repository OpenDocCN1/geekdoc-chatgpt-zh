- pgno: 256
  md: '# 8.2.3 规则学习


    # 1. 基本概念


    机器学习中的规则（rule）通常是指语义明确、能描述数据分布所隐含的客观规律或领域概念、可写成“若……，则……”形式的逻辑规则。规则学习（rule learning）是从训练数据中学习出一组能用于对未见示例进行判别的规则。


    形式化地看，一条规则形如


    ```

    \(\oplus \leftarrow f_1 \land f_2 \dots \land f_L\) (8.9)

    ```


    其中，逻辑蕴涵符号 “ ← ” 右边部分称为规则体（body），表示该条规则的前提；左边部分称为规则头（head），表示该条规则的结果。规则体是由逻辑文字（literal）\(f_k\)
    组成的合取式（conjunction），其中合取符号 “ \(\land\) ” 用来表示 “ 并且 ”。每个文字 \(f_k\) 都是对示例属性进行检验的布尔表达式，如
    “（色泽=白色）” 或 “ \(\neg\) （地质年代=侏罗纪）”。\(L\) 是规则体中逻辑文字的个数，称为规则的长度。规则头的 “ \(\oplus\)
    ” 同样是逻辑文字，一般用来表示规则所判定的目标类别或概念，如 “好瓜”。这样的逻辑规则也被称为 “ if-then 规则”。


    与神经网络、支持向量机等 “黑箱模型” 相比，规则学习具有更好的可解释性，能使用户更直观地对判别过程有所了解。另外，数理逻辑具有极强的表达能力，绝大多数人类知识能通过数理逻辑进行简洁的刻画和表达。例如，“父亲的父亲是爷爷”
    这样的知识不易用函数式描述，而用一阶逻辑规则可方便地写为 “ \(\forall x \forall y (\text{爷爷}(x, y) \leftarrow
    \text{父亲}(x, z) \land \text{父亲}(z, y))\) ”，因此规则学习能更自然地在学习过程中引入领域知识。此外，逻辑规则的抽象描述能力在处理一些高度复杂的人工智能任务时具有显著的优势，如在问答系统中有时可能遇到非常多，甚至无穷种可能的答案，此时若能基于逻辑规则进行抽象表述或者推理，则将带来极大的便利。


    假定从表 8.2 学得规则集合 R：


    +   规则 1 好瓜 ← (根蒂=蜷缩) \(\land\) (脐部=凹陷) (8.10)


    +   规则 2 \(\neg\) 好瓜 ← (纹理=模糊) (8.11)


    # 表 8.2 西瓜数据集 1.0


    | 编号 | 色泽 | 根蒂 | 敲声 | 纹理 | 脐部 | 触感 | 好瓜 |

