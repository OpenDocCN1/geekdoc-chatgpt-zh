    谓词是指称对象（在一阶谓词中是个体对象）所具有的性质或对象之间所具有的关系的符号。谓词可以分为谓词常元（或谓词常项）和谓词变元（或谓词变项）。表示某一确定论域中的特定的性质或关系的谓词称为谓词常元，如前例中的“是质数”“是美国人”“是锂电池”“是同学”“在……之间”。不表示某一确定论域中的特定性质或关系的谓词称为谓词变元。谓词变元一般用符号
