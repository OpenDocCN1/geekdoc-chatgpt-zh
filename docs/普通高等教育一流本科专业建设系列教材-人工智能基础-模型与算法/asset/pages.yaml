    # 7.4 BP 神经网络


    反向传播学习算法简称 BP 算法，采用 BP 算法的前馈型神经网络简称 BP 网络。作为一种前馈型神经网络计算模型，BP 网络与多层感知器没有本质区别。然而，有了
    BP 算法，BP 网络便有了强大的计算能力，可以表达各种复杂映射。BP 网络自出现以来一直是人工神经网络中最流行的模型，得到了极其广泛的应用。


    # 7.4.1 BP 神经网络的结构


    BP 神经网络是一个多层前馈型网络，其结构如图 7.9 所示。


    设 BP 神经网络有 \(m\) 层，第一层为输入层，最后一层为输出层，中间各层为隐藏层。标“+1”的圆圈为偏置节点，没有其他单元连向偏置单元，偏置单元没有输入，它的输出总是
    +1。输入层起缓冲存储器的作用，把数据源加到网络上，因此输入层神经元的输入与输出关系一般是线性函数。隐藏层中各个神经元的输入与输出关系一般为非线性函数。隐藏层
    \(k\) 与输出层中各个神经元的非线性输入与输出关系记为 \(f_k (k=2,3,\cdots,m)\)。由第 \(k-1\) 层中第 \(j\) 个神经元到第
    \(k\) 层的第 \(i\) 个神经元的连接权值为 \(w_{ij}^k\)。设第 \(k\) 层中第 \(i\) 个神经元输入的总和为 \(u_i^k\)，输出为
    \(y_i^k\)，则各变量之间的关系为


    ```

    \(y_i^k = f_k(u_i^k)\) (7.58)

    ```


    ```

    \(u_i^k = \sum_j w_{ij}^{k-1} y_j^{k-1}, k = 2, 3, \cdots, m\) (7.59)

    ```'
