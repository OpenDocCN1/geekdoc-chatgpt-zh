  md: '若取 $f_k(\cdot)$ 为 S 形函数，即


    $$y_i^k = f_k(u_i^k) = \frac{1}{1+e^{-u_i^k}}$$ (7.73)


    则


    $$\frac{\partial y_i^k}{\partial u_i^k} = f_k''(u_i^k) = \frac{e^{-u_i^k}}{[1+e^{-u_i^k}]^2}
    = y_i^k(1-y_i^k)$$ (7.74)


    则 BP 学习算法可以归纳为


    $$\Delta w_{ij}^{k-1} = -\epsilon d_i^k y_j^{k-1}$$ (7.70b)

    $$d_i^m = (y_i^m - y_{si}) f_m''(u_i^m)$$ (7.71b)

    $$d_i^k = y_i^k(1-y_i^k) \sum_l d_l^{k+1} w_{hl}^k, k = m-1, m-2, \cdots, 2$$
    (7.72b)


    从以上公式可以看出，求第 k 层的误差信号 $d_i^k$，需要上一层的 $d_i^{k+1}$。因此，误差函数的求取是一个始于输出层的反向传播的递归过程，所以称其为反向传播学习算法。通过多个样本的学习，修改权值，不断减少偏差，最后达到满意的结果。


    # 7.4.3 BP 神经网络的应用


    模式识别主要研究用计算机模拟生物、人的感知，对模式信息（如图像、文字、语音等）进行识别和分类。传统人工智能的研究部分显示了人脑的归纳、推理等智能，但是对于人类底层的智能，如视觉、听觉、触觉等，现代计算机系统的信息处理能力还较低。神经网络模型模拟了人脑神经系统的特点：处理单元的广泛连接，并行分布式信息存储、处理，自适应学习能力等，神经网络的研究为模式识别开辟了新的研究途径。与传统的模式识别方法相比，神经网络方法具有较强的容错能力、自适应学习能力和并行信息处理能力。BP
