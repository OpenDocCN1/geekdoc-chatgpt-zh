  md: '种二元线性分类器。尽管结构简单，但感知器能够学习并解决相当复杂的问题。感知器主要的本质缺陷是它不能处理线性不可分问题。


    ![](img/01b3dd63f105ee2f61ade787bae553f5_173_0.png)


    图 6.3 计算智能的主要发展历程


    遗传算法（genetic algorithm）最早由约翰·霍兰德于 1962 年提出，该算法是根据大自然中生物体进化规律而设计提出的，是模拟达尔文生物进化论的自然选择和遗传学机理的生物进化过程的计算模型，是一种通过模拟自然进化过程搜索最优解的方法。该算法通过数学的方式，利用计算机仿真运算，将问题的求解过程转换成类似生物进化中染色体基因的交叉、变异等过程。在求解较为复杂的组合优化问题时，相对一些常规的优化算法，遗传算法通常能够较快地获得较好的优化结果。遗传算法已被人们广泛地应用于组合优化、机器学习、信号处理、自适应控制和人工生命等领域。


    1963 年，德国的英戈·雷兴贝格（Ingo Rechenberg）和惠普·施韦费尔（Hans-Paul Schwefel）提出进化策略（evolutionary
    strategies, ES），这是一种求解参数优化问题的方法，通过模仿生物进化原理得到最优解。不同于遗传算法，进化策略中的自然选择是按照确定方式进行的，而遗传算法则是使用随机方式。


    20 世纪 60 年代，福格尔（Fogel）提出进化规划（evolutionary programming）。他将仿真进化方法用于由相互竞争的算法所构成的种群，在一系列研究中探索了进化规划的可能性。该算法的研究目的是促进人工智能的发展，成果显著。


    模糊理论（fuzzy logic）是在美国加州大学伯克利分校电气工程系的扎德教授于 1965 年创立的模糊集合理论的数学基础上发展起来的，主要包括模糊集合理论、模糊逻辑、模糊推理和模糊控制等内容。他认为所有的自然语言均是模糊的，如“红的”和“老的”等概念没有明确的内涵和外延，因而是不明确的和模糊的。可是，在特定的环境中，人们用这些概念来描述某个具体对象时却又能心领神会，很少引起误解和歧义。事实上，模糊理论应用最有效、最广泛的领域就是模糊控制，模糊控制在各领域都解决了一些传统控制理论无法解决的或难以解决的问题，取得了令人信服的成效。


    1970～1989 年是计算智能的发展阶段，这是传统智能算法的理论基础日益完善、算法之间的区别越来越不明显的时期，同时模拟退火（simulated annealing）算法、禁忌搜索（tabu
    search, TS）算法等一大批新的优化方法涌现出来，而霍普菲尔德前馈型神经网络结构、鲁梅尔哈特后向传播学习算法则将神经网络的研究推向一个新的高潮。


    全连接网络模型（fully connected neural network）由霍普菲尔德于 1982 年提出，该模型使人们对神经网络有了新的认识。霍普菲尔德将
    Lyapunov 函数引入神经网络，从理论上证明了网络可以达到稳定的离散和连续两种情况，为神经网络的研究开辟了一条崭新的道路，揭示了神经网络的研究存在无限的发展空间。此外，鲁梅尔哈特等于
    1986 年提出的反向传播算法使霍普菲尔德模型和多层前馈神经网络成为应用最广泛的神经网络模型，在语音识别、模式识别、图像处理和工业控制等领域颇有成效。'
