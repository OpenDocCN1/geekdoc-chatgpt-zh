- pgno: 146
  md: 'MD(H,E) = \begin{cases} 1, & \text{若}P(H)=0 \\ \frac{\min\{P(H|E),P(H)\} -
    P(H)}{-P(H)}, & \text{若}P(H) \neq 0 \end{cases} (5.45)


    它们的实际含义如下。

    MB: 因 E 而对 H 信任的增长/不相信 H 的概率。

    MD: 因 E 而对 H 信任的减少/相信 H 的概率。

    同时， \( 0 \leqslant \text{MB}(H,E) \leqslant 1, 0 \leqslant \text{MD}(H,E) \leqslant
    1 \)。

    也就是说，当 \(\text{MB}(H,E) > 0\) 时， \( P(H|E) > P(H) \)，由于 E 的证据的出现增加了对 H 的信任程度；当
    \(\text{MD}(H,E) > 0\) 时， \( P(H|E) < P(H) \)，由于 E 的证据的出现增加了对 H 的不信任程度。

    同一个证据不可能既增加对 H 的信任程度，又增加对 H 的不信任程度，所以 \(\text{MB}(H,E)\) 与 \(\text{MD}(H,E)\)
    是互斥的，即当 \(\text{MB}(H,E) > 0\) 时， \(\text{MD}(H,E) = 0\)；当 \(\text{MD}(H,E) >
    0\) 时， \(\text{MB}(H,E) = 0\)。


    根据 \(\text{CF}(H,E)\) 的定义及 \(\text{MB}(H,E)\) 和 \(\text{MD}(H,E)\) 的互斥性，可得到 \(\text{CF}(H,E)\)
    的计算公式：


    \(\text{CF}(H,E) = \begin{cases} \text{MB}(H,E) - 0 = \frac{P(H|E) - P(H)}{1 -
    P(H)}, & \text{若}P(H|E) > P(H) \\ 0, & \text{若}P(H|E) = P(H) \\ 0 - \text{MD}(H,E)
    = -\frac{P(H) - P(H|E)}{P(H)}, & \text{若}P(H|E) < P(H) \end{cases} (5.46)\)


    由 \(\text{CF}(H,E)\) 的计算公式可知其意义。若 \(\text{CF}(H,E) > 0\)，则 \( P(H|E) > P(H) \)，\(\text{CF}(H,E)\)
    越大 \( H \) 为真的可信度越大；若 \(\text{CF}(H,E) < 0\)，则 \( P(H|E) < P(H) \)，\(\text{CF}(H,E)\)
    越小 \( H \) 为假的可信度越大；若 \(\text{CF}(H,E) = 0\)，则 \( P(H|E) = P(H) \)，即 \( H \) 与
    \( E \) 独立，\( E \) 的证据的出现与否均对 \( H \) 没有影响。


    # 2. 证据不确定性的表示


    在 C-F 模型中，证据 E 的不确定性也用可信度因子表示，其取值范围同样是[-1,1]。例如， CF(E) = 0.5，表示 E 的可信度为 0.5。


    由前面所描述的证据的不确定性表示可知，证据可信度值的来源分两种情况：初始证据和推理证据。初始证据的值由用户给出；推理证据则由先前推出的结论作为当前推理的证据，其值通过传递算法计算得到。


    CF(E) 的值域及含义表示如下。


    +   1）当 CF(E) = -1 时，证据 E 肯定为假；

    +   2）当 -1 < CF(E) < 0 时，证据以某种程度为假；

    +   3）当 CF(E) = 0 时，无法知道证据的真假；

    +   4）当 0 < CF(E) < 1 时，证据以某种程度为真；

    +   5）当 CF(E) = 1 时，证据 E 肯定为真。


    CF(E) 描述的是证据的动态强度。尽管它和知识的静态强度在表示方法上类似，但所表示的意义却完全不同。知识的静态强度 CF(H,E) 表示规则的强度，即当
    E 所对应的证据为真时对 H 的影响程度；而动态强度 CF(E) 表示证据 E 当前的不确定性程度。'
