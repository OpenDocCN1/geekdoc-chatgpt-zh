  md: '的，即从比较特殊的规则开始，逐渐删除文字以扩大规则覆盖范围，直到满足条件为止。其称为数据驱动法，是规则逐渐泛化（generalization）的过程。第一种策略是根据覆盖范围从大到小搜索规则，第二种策略则相反。前者通常更容易产生泛化性能较好的规则，而后者则更适合于训练样本较少的情形，此外，前者对噪声的鲁棒性比后者要强得多。因此，在命题规则学习中通常使用第一种策略，而第二种策略在一阶规则学习这类假设空间非常复杂的任务中使用较多。


