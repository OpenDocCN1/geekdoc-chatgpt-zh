    # ## (3) 非监督学习


    非监督学习（无教师学习）框图如图 8.3 所示。非监督学习系统完全按照环境提供的数据的某些统计规律调节自身的参数或结构（自组织），以表示外部输入的某种固有特性，如聚类或者某种统计上的分布特征。


