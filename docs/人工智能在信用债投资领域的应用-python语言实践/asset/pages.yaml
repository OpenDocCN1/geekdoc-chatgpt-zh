    \ 允许把定义放入一个文件中,然后在其他程序和脚本中将其作为模块导入。要创建模块,可将相关的语句和定义放入与模块同名的文件中(注意,该文件的后缀必须是 .py)。\n\
    \n要在其他程序中使用该模块,需要使用 import 语句。import 语句创建了一个新的命名空间,并在该命名空间中执行与 .py 文件相关的所有语句。要在导入后访问该命名空间的内容,只要使用该模块的名称作为前缀即可。如果要使用不同的名称导入模块,只需要在\
    \ import 语句后加上 as 限定符即可。如果要将具体的定义导入到当前的命名空间中,需要使用 from 语句。\n\n与对象一样,使用 dir 函数也可以列出模块的内容。\n\
