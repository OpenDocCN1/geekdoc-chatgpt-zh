  md: '# 第 4 章


    # 中国债券市场概况


    目前，中国债券市场包括银行间市场、交易所市场和商业银行柜台交易市场。截至 2017 年 12 月 31 日，从存量债券余额来看，银行间市场存量债券余额占比约
    50%、沪深交易所市场占比约 43%、柜台市场占比约 7%。从存量债券余额情况来看，银行间市场和交易所市场基本处于“势均力敌”状态。


    # 4.1 债券交易场所


    由于历史的原因，中国的债券交易市场主要分为银行间市场和交易所市场两大交易场所。虽然目前这两大交易场所按存量债券余额统计计算基本各占“半壁江山”，但曾经的银行间市场占据了中国债券市场存量和交易量
    90%以上的份额。中国债券市场发展的历史基本可以分为五个阶段。


    第一阶段从 1981 年到 1987 年，是债券市场的萌芽阶段。1981 年，国债恢复发行，标志着中国债券市场的正式萌芽，1984 年开始出现企业债券，1985
    年国有商业银行也开始发行金融债券。但是，在这一阶段并没有合法成型的债券交易机制和交易场所，债券不能进行转让和交易，债券持有人只能选择持有到期。因此，可以说这一阶段的债券市场是非常原始的，是债券市场的萌芽阶段。


    第二阶段从 1988 年到 1996 年，是债券市场的起步和探索阶段。1988 年，财政部和中国人民银行开始筹划建立公开的国债流通市场，1990 年 12
    月，交易所债券市场正式成立，标志着中国债券市场的发展进入一个新的历史阶段。此后，债券发行开始试行市场化，从行政摊派向承购包销及招标方式转换，1995 年国债招标发行试点成功，是这一阶段债券市场发展的另一个重大突破。


    第三阶段从 1997 年到 2002 年。在这一阶段，银行间债券市场异军突起，中国债券市场的框架基本形成。1997 年 6 月，中国人民银行要求各商业银行全部退出交易所市场，同时建立了全国银行间债券市场，由外汇交易中心系统作为报价系统，由中央国债登记结算公司作为后台托管结算平台，并实行询价交易。此后，银行间债券市场逐渐发展成为所有类型机构均可参与的债券市场，并最终形成以银行间债券市场为主，交易所债券市场和商业银行柜台市场为辅的中国特色债券市场体系。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '第四阶段从 2003 年到 2015 年。在这一阶段，利率市场化加速进行，债券品种丰富发展，制度建设与市场监管逐渐发展并完善。最突出的是信用产品实现大发展，如短期融资券、中期票据、无担保企业债、分离交易可转债、公司债等品种，市场规模从小到大，迅速发展。此外，衍生产品也从无到有，实现了突破，如债券远期、利率互换等产品，均在这一阶段开始出现。


    第五阶段从 2015 年至今。这一阶段主要表现为公司债发行规模迅速增长，使得原来以银行间市场为绝对主导的中国债券市场，发展为现在银行间市场和交易所市场各占“半壁江山”的情况。这主要是因为
    2015 年 1 月 15 日证监会颁布了公司债发行新規，使得公司债的发行方式由原来的审批制，变为公开发行核准制、私募发行备案制，且将公司债的发行主体由原来的上市公司变为非上市公司也可发行，准入门槛降低。因此，该阶段使得交易所市场债券发行规模迅速增长，直到
    2017 年底存量债券的总规模跟银行间市场相比，基本相同。


    经过 30 多年的发展，时至今日，中国债券市场已经发展成为品种多样、市场多元、存量债券余额约 122 万亿元的多层次债券直接融资市场，各交易所所功能分类如表
    4.1 所示。


    # 表 4.1 中国债券市场各交易所所功能分类


    | 市场类型 | 银行间债券市场 | 交易所债券市场 | 银行柜台债券市场 |

    |---|---|---|---|

    | 市场性质 | 场外交易 | 场内交易 | 场外交易 |

    | 发行和交易券种 | 国债、金融债、短期融资券、定向工具、中期票据、企业债、政府支持机构债、资产支持证券、同业存单、项目收益票据、地方政府债 | 国债、地方政府债、金融债、政府支持机构债、企业债、公司债、资产支持证券、可交换债可转债
    | 国债、金融债、企业债、政府支持机构债 |

    | 衍生交易工具 | 远期利率协议、利率互换等 | 可分离交易可转债、普通可转债 |  |

    | 投资者类型 | 各类机构投资者 | 所有投资者（一部分商业银行除外） | 个人和企业投资者 |

    | 交易类型 | 现券交易、质押式回购、买断式回购、远期交易 | 现券交易、质押式回购 | 现券交易 |

    | 交易方式 | 一对一询价交易 | 一对一询价交易和自动撮合 | 银行柜台报价 |

    | 结算体制 | 逐笔全额结算 | 日终净额结算 | 逐笔全额结算 |

    | 结算时间 | T+0 或 T+1 | T+0 | T+0 |

    | 债券托管机构 | 中债登 | 中证登 | 商业银行 |'
