    > 企业可比喻为“生命体”：

    > - 不会突然“病入膏肓”，违约前一定有征兆。

    > - 财务可粉饰，但法信信息粉饰的难度较大，一旦立案即可查到。


    图 5.11 五洋债违约前的司法信息


    第二个是被认为不会发生违约的中央国有企业——中国中钢股份有限公司。同样，在中钢违约前 1 年左右的时间里，也没有披露任何财务信息。但通过查询跟中钢有关的司法信息，我们发现这家公司在违约前
    1 年左右的时间里，出现 3 次被银行起诉并冻结存款或申请诉前资产保全的案例，并在其子公司因欠款被起诉的案件，如图 5.12 所示。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_67_1.png)


    图 5.12 中钢债违约前的司法信息


    企业可以比较方便地粉饰自己的财报,但被起诉案件一旦受理,即可在中国裁判文书网(http://wenshu.court.gov.cn/)查到,且无法造假。如果被诉案件中涉及较多的赔偿信息,说明这家企业财务状况较差。


    由于国内债券市场的流动性较差,当一家企业被法院列为失信被执行人后'
