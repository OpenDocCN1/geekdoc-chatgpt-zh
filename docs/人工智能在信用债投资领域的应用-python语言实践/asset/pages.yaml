    # 5.2 解决方案


    根据 5.1 节的分析，在国内资本市场的现状下，评估信用债发行主体的真正价值，遇到很多客观存在且短期内无法解决的问题，我们总结如下。


    （1）企业可比喻为一个“生命体”，任何一个生命体都不会突然“病入膏肓”，就如同任何一个今天还非常健康的人，不可能明天就突然患癌症去世，在患癌症前肯定有一些征兆。企业违约也是同样的道理，任何一家今天现金流和盈利都良好的企业，也不可能明天就突然违约了。财务报表是一家企业是否良好的“体检表”，可是将这个“体检表”用于“体检”国内企业的“健康状况”时，经常会出现误判。这主要是因为目前国内企业粉饰财报的现象较常发生，用财务报表这张企业的“体检表”来判断企业的健康状况基本处于失灵状态，信用债投资者基本有这么一个共识，那就是财报中能发现问题的企业，早就不违约了；违约的企业基本都是财报中没有发现问题的。


    （2）财报披露不及时，很多企业的财报披露是为企业的发债融资服务的，融资成功后，财报披露意愿较差。


    由于这些客观存在的困难，传统的基于财务分析的企业信用风险评估方法，目前基本不能用于信用债投资分析。笔者经过近 10 年来对中国市场现状的深度研究，发现场外非财务数据更能真实反映企业自身的还款能力和财务水平。我们先举两个例子。


    第一个是五洋债，在其违约前 1 年左右的时间内，基本没有任何财务信息披露。此时，如果我们采用传统的基于企业财务数据的企业信用风险评估方法，则很难获得该企业的真实财务水平。但通过查询跟五洋建设集团相关的司法数据，我们在这未披露任何财务数据的
    1 年左右的时间里，发现这家公司因欠款被告了很多次，且在 2017 年初以来累计有超过 15 次被法院列为“失信被执行人”，'
  merge: -1
  img_proc: true
