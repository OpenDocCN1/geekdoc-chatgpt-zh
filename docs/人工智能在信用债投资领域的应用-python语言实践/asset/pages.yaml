  md: '我的学生崔玉征先生，拥有中科院模式识别（人工智能）和香港中文大学金融 MBA 两个专业的硕士学位，是典型的复合型人才。他一直致力于通过机器学习等人工智能方法，解决国内资本市场信用债投资时所面临的外部评级虚高、无法真实有效地反映融资主体的信用状况、无法用于融资成本定价等行业痛点。


    中国债券市场，自从 2014 年 3 月 5 日第一只信用债 “超日债” 违约以来，截至现在已经有 228 只信用债发生违约，并且违约事件的发生有明显加速的迹象。随着中国经济进入中低速、但高质量增长的新常态，及未来很长一段时间我国可能面临的严峻外部经济环境，可以预判中国债券市场违约事件会频发，违约进入新常态。


    美国著名经济学家、诺贝尔经济学奖得主保罗·克鲁格曼教授，提出了著名的 “三元悖论”，即开放经济下的政策选择只能同时满足：本国货币政策的独立性、汇率的稳定性和资本的完全流动性中的两个，而无法同时满足全部三个。改革开放
    40 年来，中国的宏观经济政策在货币政策相对独立、人民币汇率相对稳定的前提下，主要依靠人口红利、制度红利和资源红利等的不断释放，实现了快速的跨越式发展，发展中出现的问题被高速的经济增长所掩盖。但是，随着这些红利的不断消失，之前不断积累的问题也都已经慢慢地凸显出来了。在金融领域表现得最突出的问题是金融稳定、渐进性改革、定价体系缺失造成的套利机会并存，这三个矛盾构成了中国金融政策的
    “三元悖论”。也就是说，为了维护中国的金融稳定，政府机构选择了 “修修补补” 式的渐进性改革，而这种形式的渐进性改革并没有完全遵守金融具有全局性属性的基本原理，这就必然会对定价体系造成扭曲，从而产生大量的套利机会。大量套利机会的存在必然影响中国的金融稳定。因此，这是中国金融政策的
    “不可能三角”。


    问题的存在一直以来都是我们发展的动力，中国经济要想实现高质量的健康发展，需要不断化解中国金融政策面临的 “不可能三角”。伴随着人工智能、大数据和移动互联网等技术不断发展，金融科技不断推动着传统金融业的变革，我们逐渐地看到了解决中国金融政策
    “不可能三角” 的突破口。那就是，通过逐渐建立各层次、各类别资本市场的定价体系，来逐渐消除套利机会'
  merge: -1
  img_proc: true
- pgno: 5
  md: '并建设稳定的金融体系。目前，债券市场已经初步具备了建设合理定价体系的条件，这主要是因为随着债券市场违约事件的不断增多，信用利差在不断扩大，尤其是高收益债券的信用利差出现明显扩大的趋势，这就为债券发行主体的定价提供了有利的前提条件。债券市场合理定价的前提是有
    一个市场化的信用评级体系，该体系可真实有效地反映债券发行主体信用风险的高低。


    债券市场现有的外部评级体系，由于监管、财报粉饰普遍等原因，表现出了明显的“虚高”和评级调整严重滞后的弊端。我认为本书提出的基于场外实时数据并采用机器学习技术的量化评级方法可较好地解决外部评级的弊端。这些场外数据主要包括司法、招聘、股权出质、动产抵押、高管变动、对外投资、实际控制人风险等，完全可以从非财务的侧面反映一家公司真实的经营状况，剔除了由于财务粉饰给我们造成的噪声干扰，仅保留能够真实反映企业还款能力的信号。这在国内资本市场的信用评级领域是一个较大的创新。我期待着这种量化研究方法逐渐得到业内同仁的认可。


