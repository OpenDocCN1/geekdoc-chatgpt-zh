  md: '# 第 6 章


    # 资本市场信用债投资分析的中国特色


    本章将重点介绍中国资本市场信用债投资分析时，面临的现状及解决方案。在现阶段，信用债投资分析面临财务数据存在一定的粉饰现象、对违约前的征兆预测不显著等客观问题。本章将给出克服这些客观问题的解决方案，并给出财务粉饰的本福特法则统计识别方法。


    本章共分为四节，6.1 节重点介绍 MySQL 数据库配置和自动抓取建模所需数据的方法，6.2 节重点介绍使用统计方法检验财务数据对违约状态的影响是否显著，6.3
    节重点介绍使用统计方法检验非财务的场外数据对违约状况的影响是否显著，6.4 节重点介绍财务粉饰的本福特统计检验方法。


