  md: '# 第1章


    # 人工智能概述


    近年来，人工智能再次成为炙手可热的领域。这次人工智能的蓬勃发展，比以往历次爆发都有更加深远的影响，也产生了令人兴奋不已的结果。但并不是所有的领域都适用于人工智能。概况来说，领域界限清晰、有海量数据、数据可自动标注，能够同时满足这三个条件的细分行业，均适用于人工智能。


    例如，人机博弈领域中的棋牌类游戏。以围棋为例，在19×19的棋盘中，白子可用“1”表示，黑子可用“0”表示，再不受其他外界因素的影响，界限清晰，场景也非常简单；每次棋局理论上可产生约10的172次方的棋谱，数据量非常巨大；每次棋局均可产生赢、输、平三类结果中的一个，即目标可自动标注。因此，我们看到了AlphaGo战胜人类围棋顶级大师的惊艳战绩。


    再如，在信用债投资领域，同样满足适用人工智能的三个条件。信用债投资重点关注的是企业发行的债券能否按时还本付息，即重点关注的是企业的偿债能力，这个界限非常清晰；目前，资本市场存量债券有30000多只，且保持每年以10％以上的速度增长。每家企业均有大量的定量数据和定性数据，从这些数据中可反映企业的还款能力。显然，满足海量数据的要求；每只债券到期时，均可分为正常和违约两类，即这些海量数据是可自动标注的。因此，信用债投资分析领域也适用于人工智能。


    除此之外，还有非常多的细分领域适用于人工智能。本章重点介绍人工智能的基本概念、原理和实现人工智能的常用技术——机器学习的基本原理。在信用债投资领域中，实现人工智能的相关方法将会在本书的后面章节中详细介绍。


    # 1.1 图灵测试


    理解人工智能，必须首先了解什么是图灵测试。“图灵测试”一词来源于计算机科学和密码学的先驱阿兰·麦席森·图灵写于1950年的论文《计算机与智能》。在这篇论文中，图灵提出了一个用于判断计算机(或程序)是否具有智能的实验，如果计算机(或程序)通过了这个实验，则可以认为这个计算机或程序具备了智能。


    图灵测试的基本内容是，如果计算机能在5分钟内回答由人类测试者提出'
