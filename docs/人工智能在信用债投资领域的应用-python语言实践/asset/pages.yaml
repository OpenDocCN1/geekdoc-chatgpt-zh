    # 2.3 类别不均衡问题的解决方案及 Python 源代码


    本章前述的机器学习任务中都有一个共同的基本假设,即不同类别的训练样本数量相当。如果不同类别的训练样本数量差别不大,通常影响较小,但如果差别很大,则会对学习过程造成困扰。例如在1
    000个训练样本中,有998个正常,只有2个违约,那么学习方法只需返回一个永远将新样本预测为正常的学习器,就能达到99.8%的精度。然而,这样的学习器往往没有价值,因为它不能预测出任何违约样本。这种样本总体中类别差距较大的情况,称为类别不均衡问题。


    简单的线性分类器可很容易解释这种现象。在我们用 y = w^T x + b 分类模型对新样本 x 进行分类时,实际上是用预测出的 y 值与一个阈值进行比较,如通常在
    y > 0.5 时判别为违约样本,否则为正常样本。y 实际上表达了违约的可能性,比率 y/(1 - y) 则反映了违约可能性与正常可能性的比值,阈值设置为0.5恰表明分类器认为正常样本和违约样本的可能性相同,即分类器决策规则为

    如果 y/(1 - y) > 1,则预测为违约  (2.1)


    然而,当训练集中正常、违约的样本量不同时,我们令 m^+ 表示正常的样本量,m^- 表示违约的样本量,则观测比率为 m^- / m^+。由于我们通常假设训练集是样本总体的无偏估计,因此该观测比率就代表了真实比率。于是,只要分类器的预测概率大于观测比率就应该判定为违约,即

    如果 y/(1 - y) > m^- / m^+,则预测为违约  (2.2)


    但是,我们的分类器是基于式(2.1)进行决策的。因此,需要对其预测值进行调整,使其在基于式(2.1)决策时,实际是在执行式(2.2)的决策。要做到这一点很容易,只需令'
