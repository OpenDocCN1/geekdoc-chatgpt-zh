    图 A-1 Anaconda 官网


    进入 Anaconda 下载页面，选择 Windows 版本，并单击 Windows 图标，如图 A-2 所示。


    选择集成 Python3.6 版本的 Anaconda 下载，根据自身机器硬件的配置，可选择 64 位版本和 32 位版本。根据笔者自己电脑的硬件配置，本书选择集成
    32'
