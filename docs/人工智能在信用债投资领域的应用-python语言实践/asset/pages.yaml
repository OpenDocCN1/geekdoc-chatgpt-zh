    # 6.4 财务粉饰的本福特法则统计识别法及 Python 源代码


    本福特法则是由英国物理学家本福特因发现在一些自然数据源中各数字的首位数字出现的频率不满足均匀分布而闻名的。其基本内容是在自然数据源（如信用卡账单、采购记录、财务报表等）生成的数字中，约有
    30% 的数字的首位数字是 1；首位数字为 2 的数约有 18%；顺序递减，首位数字为 9 的数少于 5%。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '精确的数学表述为：在 b 进制中，以数 n 开头的数字出现的频率满足式(6.1)，数字1~9出现的理论频率如表6.1所示。


    F(n) = log_b(n + 1) − log_b(n)  (6.1)


    # 表6.1 数字1~9出现的理论频率


    | 数字 | 频率 | 数字 | 频率 | 数字 | 频率 |

    |---|---|---|---|---|---|

    | 1 | 0.301 | 4 | 0.097 | 7 | 0.058 |

    | 2 | 0.176 | 5 | 0.079 | 8 | 0.051 |

    | 3 | 0.125 | 6 | 0.067 | 9 | 0.046 |


    其实，本福特法则的理论统计结果，也可用我们日常生活中的例子解释，例如：


    +   1. 图书馆里大部分书的头几页通常比较脏。因为许多到图书馆看书的人大多只是看书的开头，不喜欢的话就不会再看下去了；把一本书完整看完的人比较少。

    +   2. 数学书后的对数表、化学书后的一些化学常数、财务课本后的终值、现值系数表等，我们查阅的数据大多在头几页里面。


    如果统计的数据足够多，我们会发现，开头是数字1的数据最多，大约占了所有数据的1/3；开头是数字2的数据居于其次；剩下的数字的数量依次递减。人口、死亡率、物理和化学常数、棒球统计表、半衰期放射性同位数、物理书中的答案、素数数字以及斐波纳契数列数字中均有这一定律的身影。换句话说，只要是由度量单位制获得的数据都符合本福特法则，因此本福特法则又称为“第一数字定律”。


    但有些情况不适用这个定律，这些数字大多是比较随意的，或者是任意指定的，是一些受限数据而不是由度量单位制获得的。例如彩票数字、电话号码、日期和一组人的体重或者身高数据。


    本福特法则在企业财报粉饰方面得到了良好的应用，可大概率识别出企业可能存在的财务造假现象。因为如果做假账的人更改了账本上真实的数据，就会使账本上数字出现的频率发生变化，从而偏离“本福特定律”。通常情况下，在那些假账中，数字5和6是最常见的开头数字，而不是符合定律的数字1，这就表明伪造者试图在账目中间“隐藏”数据。最为典型的就是美国安然公司“假账”事件。2001年曾是美国最大的能源交易商、年营业收入近千亿美元、股票市值700多亿美元、世界500强中排名第七的安然公司突然宣布破产，当时传出了该公司高层管理人员涉嫌做假账的丑闻。一时间，会计造假成了中外关注的焦点。事后人们发现安然公司在2001年度到2002年度所公布的财务数据不符合“本福特法则”，这些数字的使用频率与这一定律有较大的偏差，这证明了安然公司'
