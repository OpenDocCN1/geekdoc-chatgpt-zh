  md: '# 前言


    笔者硕士毕业于中国科学院自动化研究所，专业是模式识别与智能系统。因此，人工智能是笔者的专业！10年前笔者在自动化所读书时，人工智能这个专业还没有像今天这样火爆。随着
    AlphaGo 在人机博弈领域的围棋对弈中不断取得辉煌的成绩，人工智能再次走向辉煌，几乎被很多媒体描述成“无所不能”。


    其实，人工智能有强弱之分，即强人工智能和弱人工智能。强人工智能通常表现为在多个领域可用计算机来代替人类或者比人类做得更好，而弱人工智能通常是指在某一特定领域计算机比人类做得更好，如棋牌类游戏、量化投资等领域。目前，强人工智能还只是幻想，弱人工智能在某些特定领域已经取得了惊人的成绩。那么，人工智能可应用于哪些领域呢？通常地讲，能产生大量数据且这些数据可实现自动标注的领域，均适用于人工智能。例如金融行业，它每天都产生大量的数据，且这些数据都可实现自动标注，因为股票要么上涨、要么下跌，债券要么正常兑付、要么违约。因此，无场景不
    AI（人工智能）。


    深度学习技术的突破是这次人工智能浪潮的巨大推动力之一。深度学习的思想跟传统机器学习相比，是一个颠覆性创新，在思维方式上是完全不同的。传统机器学习一般是通过大量数据寻找因果关系，而深度学习一般是通过分层特征提取并通过激活函数寻找关联关系，这正是大数据方法的思维方式。


    本书重点介绍的是人工智能方法在信用债投资领域应用的实践方法，提供了大量的 Python 源代码，可供信用债投资者快速建立自己的信用债量化投资信用风险分析体系。随着国内债券市场的快速发展，目前存量债券已经超过
    35 000 只，如此多的投资标的，如果还是采用传统的、基于人工的主观判断和信息筛选，这个工作量是非常巨大的。自从 2014 年 3 月 5 日国内第一只债券“超日债”违约以来，截至现在已经有
    228 只债券发生违约，信用风险越来越受到投资者的重视，建设自己的、能够为投资决策提供有效支持的信用风险计量和管理体系，对广大金融机构来说已经非常迫切。


    但是，建设科学、实用的信用债投资分析体系，在国内资本市场的现状下面临很多无法解决的客观困难。例如，发债主体信息披露不及时、财务粉饰现象普遍存在、违约状态跟盈利状况正相关、违约样本极少，造成样本极不均衡、外部评级过度集中且区分能力很差等现状，作为普通的信用债投资者我们均无法'
  merge: -1
  img_proc: true
- pgno: 7
  md: '改变这些现状。我们只能从优化模型架构设计、获取可提供稳定场外数据源且实用的指标等角度入手，来建立自己的信用债投资量化风险分析体系。


    本书介绍的信用债投资量化风险分析体系是笔者近10年来经验的总结和升华，书中详细介绍了通过模型架构优化来缓解财务粉饰的模型开发方法，介绍了通过场外真实数据来开发模型的技术，还简单介绍了深度学习技术在信用债投资量化风险分析体系中的应用方法。这些方法既是笔者多年经验的结晶，也是市面上其他同类教材中从来没有介绍过的实用技术总结。


    由于财务粉饰现象的普遍存在，基于财务数据的企业信用风险评估经常出现误判，无法挖掘企业真正的投资价值。本书介绍的全部基于企业真实定性数据的信用风险评估方法已经得到了笔者团队的充分验证，效果是非常显著的。这种方法体系和实践方法在国内首屈一指，笔者坚信会给信用债投资分析者很大的启发。


    本书共分为八个章节，其中第1章、第2章重点介绍人工智能、机器学习、深度学习的基本理论和方法，也给出了国内资本市场最常见的类别不均衡问题的解决方案；第3章重点介绍基于TensorFlow后台的Keras深度学习架构，并给出实用案例；第4章重点介绍国内债券市场的发展历程和现状；第5章重点介绍国内信用债投资分析面临的困难，并给出了详细的解决方案；第6～8章是本书的开源技术部分，详细讲述了大量的核心技术，包括自动抓取数据、对全市场财务数据的统计检验和分析、对司法等场外数据的统计检验和分析、财务粉饰的本福特统计法则和评分实施方法、用有监督机器学习开发评级模型的方法、用深度学习技术开发评级模型的方法、缓解财务粉饰的评分卡模型架构设计和评分卡模型开发核心代码等，这三章是本书开源技术的核心部分。


    在本书的写作过程中，得到了家人、朋友和团队成员的大力支持，没有他们的支持和帮助，笔者不可能心无旁骛地构思本书的写作思路，在此对他们的贡献表示真诚的感谢。本书的前五章和附录部分由笔者完成，第6～8章中的部分Python源代码由团队成员刘志兴等完成初稿，并由笔者完成测试和剩余的逻辑分析部分。


