  md: '司法信息披露,但时间太短,基本无法交易。


    用同样的方法,我们获取 2015 年以前的数据,开发模型并预测 2015 年债券违约的情况,如图 5.16 所示。2015 年全年共计 23 只债券违约,其中
    15 只民营企业债券,3 只外资企业债券、5 只国有企业债券,这些债券共计 13 只私募债。与 2014 年相比,由于 2015 年违约的私募债占比减少,信息披露的完整性变好,如果仍以大于
    30% 的违约概率判定为违约,则预测准确率提升到 91.30%。


    2015 年的债券违约事件,也出现了特殊情况,那就是中央国有企业(天威集团)第一次出现违约,且该主体共计 4 只债券发生违约。根据主体性质的不同,我们通常将违约原因分为两类:
    ①个人主体发生违约,通常是“意愿”的问题。因为人的随意性很强,时常可能出现有钱但忘记或不愿还款的情况。②机构主体发生违约,通常是“能力”的问题。因为机构的主观性不强,且机构一旦发生违约或负面信息,会对公司的声誉造成很大影响,且会影响公司的正常经营。因此,机构主体发生的违约通常真的是由于其还款能力不足造成的。但
    2015 年出现的天威集团违约事件或今后可能出现的其他央企或国企子公司、城投债违约事件,大概率是央企或国企不愿意还款的“意愿”问题。因为在中国特色的社会主义国情下,央企或国企的还款能力是不容置疑的。


    2016 年全年共计 78 只债券违约,包括场内(银行间和沪深交易所)56 只和场外(区域股权交易中心)22 只;由于 2016 年非私募债违约占比增多且信息披露逐渐完善,模型的预测准确率也不断提升,如图
    5.17 所示。


    通过对上述测试结果的分析可知,由于私募债发债主体的信息披露非常不完整、不及时,造成关键数据的缺失,影响了判断准确率。在我们剔除私募债后,最近 3 年的回测结果均有明显提升,如图
    5.18 所示。这个测试结果给了我们很大的启示,那就是信息披露历史不完整的债券,不投资。


    2014 年,只有 1 只非私募债券违约,且是上市公司,信息披露较完善;违约概率阈值取 30% 时,100% 地识别出了违约事件。


    2015 年,有 9 只非私募债券违约,信息披露较完善;违约概率阈值取 50% 时,有 88.89%(8 只)的债券准确识别出了违约事件。只有 14 波鸿
    CP001 误判,主要由于关键信息(借款未还被起诉)滞后造成。


    2016 年,有 47 只非私募债券违约,信息披露较完善;违约概率阈值取 30% 时,有 97.87%(45 只)的债券识别出了违约事件。有 14 益优 02、15
    华昱 CP001 2 只债券由于信息披露不完整、不及时被误判。'
