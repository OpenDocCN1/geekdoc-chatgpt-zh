  md: '# 机器学习


    为了更好地了解机器学习，我们首先举个简单的例子，说明人的学习过程。夏天时，我们都去超市买过西瓜，通常通过观察、拍打等方法来找到成熟的甜瓜。观察主要是看西瓜外表的色泽和根蒂的形状，拍打主要是听声音。随着我们经验的不断积累，采用上述方法挑选出“好瓜”的概率越来越大。我们经验不断积累的过程，可用表
    2.1 所示的数据集表示。


    # 表 2.1 西瓜数据集


    | 序号 | 色泽 | 根蒂 | 声响 | 是否好瓜 |

    |---|---|---|---|---|

    | 1 | 青绿 | 干缩 | 浊响 | 是 |

    | 2 | 黑绿 | 干缩 | 浊响 | 是 |

    | 3 | 青绿 | 硬挺 | 清脆 | 否 |

    | 4 | 黑绿 | 硬挺 | 沉闷 | 否 |

    | ... | ..... | ..... | ..... | ..... |


    通过人脑的不断归纳、总结，我们可以得出“好瓜”的模型是“某种色泽、某种根蒂、某种声响的瓜”。人脑的归纳和总结，就是人的学习过程，这是一个非常复杂的、非线性的神经元学习网络。


    那么，机器的学习过程是怎样的呢？我们知道，计算机只能处理数字信号，且只能判断确定的规则，如大于、小于、不等于等。对于模糊的规则，如感知、感觉等则无法判断。举个简单的例子说明机器的学习过程，如下所示。


    +   - 问：1+4等于几？

    +   - 答：20。

    +   - 规则反馈：不对，多了。

    +   - 问：1+9等于几？

    +   - 答：13。

    +   - 规则反馈：不对，多了。

    +   - 问：3+4等于几？

    +   - 答：7。

    +   - 规则反馈：对了。'
