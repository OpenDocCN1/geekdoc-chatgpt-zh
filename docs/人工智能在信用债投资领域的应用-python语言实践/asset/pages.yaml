  md: '# 2.2 深度学习


    深度学习是机器学习的一个重要分支，其用到的核心技术是人工神经网络。当提到深度学习的概念时，很多初学者会问：一个机器学习模型中，使用几层神经网络才能视为深度学习模型呢？这个问题看似有道理，实际上并没有深入理解深度学习的基本原理，而是将深度学习看成神经网络层次的简单叠加。实际上，深度学习模型和一般神经网络模型相比在原理上有很大不同，这主要表现在特征提取和处理顺序与方式上。深度学习处理问题的顺序和方式跟人类思考问题的方式比较接近。例如，深度学习在图像分类问题中的一般流程是首先提取图片的基础特征——图片像素，然后将图片像素特征输入神经网络的第一层，并提取线条特征，紧接着将线条特征输入到神经网络的第二层，提取图片中物体的简单形状特征，然后将简单形状特征输入神经网络的第三层，提取图片中物体的复杂形状特征。然后再将提取的这些多层复杂特征进行权重学习，并将得到的模型用于图片分类预测。深度学习和传统机器学习方法处理问题的一般流程，如图
    2.6 所示。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_22_0.png)


    图 2.6 深度学习和传统机器学习方法处理问题的一般流程


    显然，图片分类问题深度学习的过程，和人类学习绘画的过程比较类似。幼儿学习绘画时，首先认识颜料，然后学习简笔画，最后学习复杂绘画并涂色。那么，什么是深度学习呢？简单地说，如果模型使用分层特征学习——首先识别较低级别的特征，然后建立在它们之上以识别更高级的特征（如通过卷积滤波器等），那么它就是一个深度学习模型。如果没有分层特征学习，那么无论你的模型有多少层，都不是真正的深度学习模型。即我们不是因为深度模型（多层神经网络模型）而将其称为深度学习，而是为了实现层次化学习，模型需要深度，深度是实现分层特征学习的副产品。因此，深度学习是使用多层神经网络技术来实现分层特征学习的一种算法。


    为了实现深度学习模型中的分层特征学习，我们需要用到神经网络的模型结构，神经网络最基本的结构单元称神经元，这是由生物学引出的一個概念。生物学中一个神经元通常具有多个树突，主要用来接收传入的信息；而轴突只有一条。轴突尾端有许多轴突末梢可以给其他多个神经元传递信息；轴突末梢和其他'
  merge: -1
  img_proc: true
- pgno: 23
  md: '神经元的树突产生连接，从而传递信息。为了模拟生物神经元的结构和信息传递方式，人工神经网络中的神经元结构也基本类似，如图 2.7 所示。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_23_0.png)


    图 2.7 生物神经元与人工神经网络结构对比图


    在如图 2.7 右侧所示的人工神经元中，输入为 x1, x2, …, xn，每个输入的权重为 w1, w2, …, wn，将这些输入的加权求和作为激活函数的输入，并计算后得到该神经元的输出，即该神经元的输出为
    y = f(w1 × x1 + w2 × x2 + … + wn × xn)。显然，各输入节点的加权求和是一个线性表达式，为处理非线性的分类问题，激活函数通常选择非线性函数，这样训练得到的深度学习模型就可以处理非线性分类问题了。训练深度学习模型的过程，就是计算每个人工神经元输入的权重过程。


    随着神经网络层次的增多和每个神经元激活函数的不同，训练得到的神经网络模型处理复杂问题的能力一般也会逐步提升，如图 2.8 所示。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_23_1.png)


    图 2.8 神经网络分类能力不断增强'
