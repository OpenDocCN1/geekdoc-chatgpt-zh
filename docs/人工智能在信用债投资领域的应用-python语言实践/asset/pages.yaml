    # 6.3 场外数据对违约状态影响强显著 及 Python 源代码


    由 5.2 节中介绍的应对企业财务数据粉饰的解决方案中的方法, 我们通过采用场外的司法、招聘、场外融资、存量债券的到期收益率等真实信息, 可有效预测企业的真实信用风险。


    由于这些场外真实信息的获取需要较强的 IT 技能, 如需要强大的爬虫团队来爬去司法、招聘和场外融资等的数据, 然后需要将这些爬取的非结构化数据通过大量的文本挖掘、算法处理等数据预处理技术来提取备选的人模指标,
    本书就不详述这些场外数据的抓取和预处理方式了。此处, 仅以少量作者实战模型开发中的样本作为测试样本, 来演示场外数据对违约状态影响的显著程度。样本总体共计
    119 个, 其中违约样本 20 个、非违约样本 99 个。


    ```

    ```python

    #载入显著性检验所需的 Python 包

    import pandas as pd

    import numpy as np

    import statsmodels.api as sm

    #读取数据

    data_set=pd.read_excel("company_data.xlsx")

    X=np.array(data_set.iloc[:,1:])

    y=np.array(data_set.Target)

    #计算 P-Value

    X2=sm.add_constant(X)

    est=sm.OLS(y, X2)

    est2=est.fit()

    print(est2.summary()) #输出统计结果检验概述,如图 6.37 所示

    list(est2.pvalues) # 输出各指标的 P-Value,如图 6.38 所示

    ```

