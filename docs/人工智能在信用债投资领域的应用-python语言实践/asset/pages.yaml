  md: '# 附录 A


    # Python 语言基础


    # 1. 安装和配置 Python 集成开发环境


    在众多的 Python 集成开发环境 (IDE) 中，Anaconda 无疑是应用最广泛、最受广大 Python 爱好者使用的 IDE 之一。Anaconda
    也是一个包含众多 Python 包的集合，安装 Anaconda 的同时就预先集成了如 Numpy、Scipy、Pandas、Scikit-learn 等
    180 多个在数据分析领域常用的包，这对于初学者来说是一个天大福音。


    除此之外，Anaconda 还有很多的优点，主要包括可以在安装 Anaconda 的同时自动配置环境变量，无须再为配置复杂的环境变量而苦恼，也可通过 Anaconda
    管理工具包、开发环境、Python 版本，从而大大简化工作流程。使用 Anaconda 不仅可以方便地安装、更新、卸载工具包，而且安装时能自动安装相应的依赖包，同时还能达到使用不同的虚拟环境隔离不同项目的要求。


    安装 Anaconda 时，首先访问 Anaconda 官网 (https://www.anaconda.com/)，用鼠标选择 Products，单击 Download，如图
    A-1 所示。


