    模型的定量评分由三部分构成, 分别是由最近 1 年财务数据得到的同行业评分、由最近 3 年财务数据得到的趋势评分和由最近 3 年财务数据得到的波动率评分。这样,我们强制入模指标的趋势和波动率进入模型,就可较大程度地降低仅仅采用财务数据本身时,由于财务数据修饰对模型造成的影响。


    模型定量的第一部分是同行业得分,如表 8.2 所示。该部分中每个指标的得分是通过查询表 8.3 所示的、通过统计同行业数据得到的评分表得到的。


