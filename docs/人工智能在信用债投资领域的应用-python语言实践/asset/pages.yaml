- pgno: 11
  md: '的一系列问题,且不能被辨别出其机器身份,则该计算机通过测试,说明该计算机具备智能。图灵测试的基本原型,如图 1.1 所示。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_11_0.png)


    图 1.1 图灵测试的基本原型


    在图 1.1 所示的图灵测试的基本原型中,C 代表人类,他通过一定的媒介向被测试者 A 或 B 提出一系列的问题,通过测试者对这些问题的回答,如果 C 无法辨别回答者是人还是机器,则说明被测试者具有智能。


    图灵还为这项测试拟定了几个示范性问题,如下所示。


    +   问：请给我写出有关“第四号桥”主题的十四行诗。

    +   答：不要问我这道题,我从来不会写诗。

    +   问：34 957 加 70 764 等于多少？

    +   答：（停 30 秒后）105 721。

    +   问：你会下国际象棋吗？

    +   答：是的。

    +   问：我在 K1 处有棋子 K; 你在 K6 处有棋子 K, 在 R1 处有棋子 R。轮到你走, 你应该下哪步棋？

    +   答：（停 15 秒钟后）棋子 R 走到 R8 处, 将军！


    由图灵测试的基本原型可知,在某一特定细分领域,即提问者 C 提出的问题仅限于某一特定的狭窄领域,此时通过大量的数据测试和模型训练,是难通过图灵测试的。这种应用于细分领域的人工智能通常被称为弱人工智能。红极一时的
    AlphaGo 就属于弱人工智能的典型应用,也就是说 AlphaGo 只能用于下围棋,不能直接用于其他领域。如果想将 AlphaGo 应用于其他领域,需要用该领域的数据做大量训练后,才有可能适用。


    如果提问者 C 提出的问题,不预设场景、可随意提问,被测试者仍能通过图灵测试,则这时通常被称为强人工智能。显然,强人工智能基本是不可能的。因'
  merge: -1
