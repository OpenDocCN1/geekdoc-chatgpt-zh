  md: '![](img/bef5d57039b9e3819bf07153f102e5b8_61_0.png)


    图 5.4 穆迪全球样本主体评级与违约情况变化曲线图


    生违约的情况跟投机级主体发生违约的情况强相关。


    通过以上分析，我们认为，被穆迪评为投资级的主体在正常市场情况下，基本不会发生违约，只有在极端市场情况下，如经济危机发生时，才可能发生违约。而被穆迪评为投机级的主体在正常市场情况下偶尔会发生违约，在极端市场情况下发生违约的主体快速增加。


    穆迪评级发生实际违约的情况，跟其评级符号所代表的含义基本一致，而国内外外部评级的评级符号跟其发生实际违约的情况非常不一致。例如，国内外外部评级机构将 AA
    主体的信用描述为“受评对象偿还债务的能力很强，受不利经济环境的影响较小，违约风险很低”。可是，实际违约事件 90% 发生在 AA（含 AA＋和 AA－）的受评主体中。


    最后，我们看下国内评级机构和穆迪的评级结果是否可用于信用风险定价。笔者通过彭博资讯（Bloomberg）导出所有的中国公司在美国市场发行过的美元债券，并获取它们被穆迪给予的评级结果和债券发行的票面利率。通过统计汇总相同信用等级发行债券票面利率的最小值、最大值、中位数和平均数，绘制如图
    5.5 所示的雷达图。可见，穆迪的评级结果跟反映信用风险定价的票面利率直接强相关，即被穆迪评为高信用等级（如投资级）的主体发行债券的票面利率比较低，而被穆迪评为低信用等级（如投机级）的主体发行债券的票面利率相对投资级来说比较高。表现出明显的分层特性，这也说明穆迪的评级结果可用于信用风险定价。


    用同样的方法，我们也统计了国内存量债券相同信用等级的发债主体，所发行债券票面利率的最小值、最大值、中位数和平均数，并绘制图 5.6 所示的雷达图。可见，图中的四个四边形无明显的分层特性，与图
    5.5 所示的雷达图有明显的区别。这充分说明了国内的外部评级是不能用作风险定价的，或者国内债券发行主体的融资成本跟评级结果关系不大。


    第二，财务数据对违约的影响不显著。传统的信用债投资分析是建立在主'
