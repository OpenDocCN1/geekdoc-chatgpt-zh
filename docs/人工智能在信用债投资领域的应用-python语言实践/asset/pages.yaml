    信用风险评级模型包括定量、定性和综合调整三部分，综合调整部分主要是为了缓解信用风险自身的滞后性所设计的。因为，模型开发所需的人模指标必须有稳定的数据源才行，而这些数据源的提供往往在很大程度上依赖于发债主体自身的披露。在目前国内资本市场信息披露机制不完善的情况下，企业经常选择性披露相关信息，对企业还款能力影响较大的信息，时常突发披露。


    因此，为了缓解这种影响较大的突发事件，我们设计了模型的综合调整部分，如表 8.10 所示。综合调整部分各指标的调整幅度，需要根据各行业的不同属性做不同的调整。


