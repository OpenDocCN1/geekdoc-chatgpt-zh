  md: '# 冯 俊 博士、原国联安基金管理有限公司固定收益类基金投资总监


    近年随着企业违约率的上升，传统的企业信用研究方法遇到巨大的挑战。买的没有卖的精，信息的不对称对企业债券市场发行、定价、风险控制提出了巨大的挑战。王征运用现代化的大数据收集和处理能力，建立了比较系统的信用债券量化研究方法和分析体系，是对传统信用研究方法有益的补充，为债券市场信用定价和风险控制提供了一个有效的决策工具。


    # 邵可弟 美国穆迪董事总经理


    在信用风险分析度量方面，经典量化模型多集中于财务指标的分析。在目前信用体系尚不完善、数据质量有待提高的环境下，经典量化的预测准确率并不尽如人意，实践中还需要大量人工介入，结果偏差也较为严重。王征创新性地结合非财务数据、多维度分析方法和基于深度学习的人工智能技术，建立了更为适用的信用风险分析体系，为信用风险管理效能提升做出了有益的探索实践。


