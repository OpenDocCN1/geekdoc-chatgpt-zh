- pgno: 68
  md: '距离问题爆发和债券违约的时间点，往往比较临近了。此时，即使作出了正确的预测也较难卖出持有的债券。根据国内法院关于处理涉及且需要赔偿的流程，如图 5.13
    所示，获取企业被告且需要赔偿时的涉诉信息，就可以比较及时地判断企业未来违约的趋势变化，并作出相应的判断。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_68_0.png)


    图 5.13 涉诉且赔偿流程


    除了司法相关的信息可用于提前判断企业的财务状况外，笔者研究发现存量债券到期收益率的异常波动，也是企业还款能力变差的一个明显信号，且该信号基本可在违约前 6
    个月以上出现，显然比较有价值。通过研究已经违约的 164 只债券，发现基本都在违约前 6 个月以上出现到期收益率异常的情况，如图 5.14 所示。出现这种信号的主要原因是在企业违约前，基本都会存在“市场灵通人士”提前获取这家公司现金流紧张、还款能力变差的信息，从而在市场上低价抛售这家公司的债券。


    除了上述场外定性数据以外，笔者还提取了如下的定性入模指标。


    +   - (1) 最近 1 年被诉且需要赔偿的次数占该主体所有同类案件的比重。\n- (2) 最近 2 年被诉且需要赔偿的次数占该主体所有同类案件的比重。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_68_1.png)


    图 5.14 部分违约债券违约前到期收益率的变化'
