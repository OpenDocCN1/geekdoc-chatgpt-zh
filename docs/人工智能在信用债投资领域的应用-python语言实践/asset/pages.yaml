    我们再来看下资本市场实际违约情况跟评级机构的评级预测是否一致。先看下国内市场,截至 2018 年 2 月底,国内资本市场有 164 只债券发生了实质性违约,其中有
    119 只债券是有评级的,这些有评级债券违约前 1 年主体评级分布情况,如图 5.3 所示。可见,违约债券的主体评级主要集中在 AA 等级(含 AA+和 AA-),约占所有违约债券的
