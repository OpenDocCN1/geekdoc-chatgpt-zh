- pgno: 33
  md: '$$\frac{y''}{1 - y''} = \frac{y}{1 - y} \times \frac{m^+}{m^-} \qquad (2.3)$$


    这就是处理类别不均衡学习的一个基本策略——“再缩放”(rescaling)，亦称“再平衡”(rebalance)。


    再缩放的思想虽简单，但实际操作却并不平凡，主要是因为“训练集是真实样本总体的无偏估计”这个假设不成立了，也就是说，我们未必能有效地基于训练集观测比率来推断出真实的正常与违约的比率。现有技术上大体有三类做法：第一类是直接对训练集中正常样本进行“欠采样”(undersampling)，即去除一些正常样本使得正常、违约样本数量接近，然后再进行机器学习；第二类是对训练集中的违约样本进行“过采样”(oversampling)，即增加一些违约样本使得正常、违约样本数量接近，然后再进行机器学习；第三类是直接基于原始训练集进行机器学习，但在用训练好的分类器进行预测时，将式(2.3)嵌入决策过程中，称为“阈值移动”(threshold-moving)。


    欠采样法的时间开销通常远小于过采样法，因为前者丢弃了很多正常的样本，使得分类器训练集远小于初始训练集；而过采样法增加了很多违约样本，其训练集大于初始训练集。需要注意的是，过采样法不能简单地对初始违约样本进行重复采样，否则会导致严重的过拟合。过采样法的代表性算法
    SMOTE 是通过对训练集中的违约样本进行插值来产生额外的违约样本。同样，欠采样法也不能随意丢弃正常样本，因为这样可能会丢失一些重要信息。欠采样法的代表性算法
    EasyEnsemble 是利用集成学习机制，将正常样本划分为若干个集合供不同学习器使用，这样对每个学习器都进行了欠采样，但在全局来看却不会丢失重要信息。


