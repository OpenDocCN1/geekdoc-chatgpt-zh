    这些数据都是无法粉饰和造假的。笔者使用上述指标并使用实质性违约样本作为违约标记，通过分别获取 2013 年,2014 年和 2015 年的历史数据,开发模型并预测下一年的违约分类情况,取得了很好的结果。此处,仅分析测试结果,详细的
    Python 代码和模型开发过程将在接下来的章节中详述。


    2014 年全年共计有 6 只债券违约,其中 4 只民营企业债券和 2 只外资企业债券。按资金募集方式分类,其中 5 只为私募债(无评级)、1 只为公司债(有评级)。并且
    2014 年发生的债券违约事件均为利息违约(因为债券到期日均在 2015 年以后)。通过获取 2014 年以前的数据开发模型,如果假定违约概率大于 30%内部判定为违约,则模型的准确率为
    83.33%,如图 5.15 所示。2014 年的债券违约出现了两个特殊情况,分别是:①13 华珠债,为私募债,违约前无任何异常信息披露(司法、财务等);②13
    中森债,为私募债,违约前 1 个月内,有异常'
