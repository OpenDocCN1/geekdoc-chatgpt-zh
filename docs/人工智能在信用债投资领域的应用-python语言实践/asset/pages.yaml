    模型定性部分开发的基本原理是 AHP 法（AHP 法的详细介绍，请见笔者另外一本书《基于 R 语言的证券公司信用风险计量和管理》中第五章第一节的内容）。在定性部分的层次设计中，我们通常分为两层，第一层是准则层，包括该行业的产业属性和公司属性两部分；第二层是指标层，分别将准则层中的两部分细化到不同的定性指标。模型定性部分的结构设计，如表
