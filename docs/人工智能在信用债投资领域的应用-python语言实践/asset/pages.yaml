    再看国际市场的情况,查阅穆迪官网我们可以找到所有被评机构历史发生违约情况变化曲线图,如图 5.4 所示。虽然该曲线只有 3 条,却代表多重深层次含义。


    其中,最下面那条曲线,代表曾经被穆迪评为投资级(BBB-及以上属于投资级)的主体发生违约的情况。可见,在正常市场情况下,被穆迪评为投资级的主体,基本没有发生过违约。只有在爆发全球性经济或金融危机时,投资级主体才会发生违约,如
    2002 年前后的美国高科技泡沫破灭和 2008 年发生的次贷危机均造成了投资级主体发生违约的情况。


    最上面那条曲线,代表曾经被穆迪评为投机级(BB+及以下属于投机级)的主体发生违约的情况。可见,在正常市场情况下,被穆迪评为投机级的主体,会偶尔发生违约。但在极端情况发生时,投机级主体发生违约的情况会快速增加。


    中间那条曲线代表的是所有被穆迪评级的主体发生违约的情况,可见其发'
