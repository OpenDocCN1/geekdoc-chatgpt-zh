  md: '# 附录 D


    # 常用机器学习算法之预测算法比较及 Python 源代码


    ```

    # 载入所需的包

    import numpy as np

    import matplotlib.pyplot as plt

    from sklearn.tree import DecisionTreeRegressor

    from sklearn.ensemble import AdaBoostRegressor

    from sklearn import linear_model

    from sklearn.svm import SVR


    # 创建数据集

    rng=np.random.RandomState(1)

    X=np.linspace(0, 6, 100)[:, np.newaxis]

    y=np.sin(X).ravel() + np.sin(6 * X).ravel() + rng.normal(0, 0.1, X.shape[0])


    # 构建回归模型

    regr_1=DecisionTreeRegressor(max_depth=4)

    regr_2=AdaBoostRegressor(DecisionTreeRegressor(max_depth=4), n_estimators=300,
    random_state=rng)

    regr_3=linear_model.SGDRegressor()

    regr_4=SVR(kernel=''rbf'', C=1e3, gamma=0.1)

    regr_5=linear_model.LinearRegression()

    # 拟合回归模型

    regr_1.fit(X, y)

    regr_2.fit(X, y)

    regr_3.fit(X, y)

    regr_4.fit(X, y)

    regr_5.fit(X, y)

    # 做预测

    y_1=regr_1.predict(X)

    y_2=regr_2.predict(X)

    y_3=regr_3.predict(X)

    y_4=regr_4.predict(X)

