- pgno: 58
  md: '# 第 5 章


    # 信用债投资面临的困难和解决方案


    中国市场进行信用债投资时，面临着许多客观实际的困难，如外部评级区分能力太差，对投资基本没有参考价值，财务粉饰现象比较常见、财务报表无法真实有效地反映企业真实的还款能力，财报披露不及时、财报披露为发债服务，发债成功后不再披露财务信息等，这些客观存在的实际困难都给信用债投资者带来很大的困难。本章重点分析这些困难，并给出相应的解决方案。


    # 5.1 信用债分析面临的主要困难


    由于我国市场经济体制建设起步较晚，全社会信用体系建设也不健全，上市公司财务欺诈现象时有发生。因此，我们在做信用债投资时不可避免地面临一些无法克服的实际困难，就笔者近
    10 年的研究分析来看，这些困难主要表现为以下几点。


    第一，外部评级区分能力太差，对信用债投资几乎没有参考价值。截至 2018 年 2 月底，资本市场存量有评级信用债约 17 000 只，这些债券的主体评级分布情况，如图
    5.1 所示。可见，外部评级非常集中在前四个等级，其中 AAA 占比约 29%，AA+ 占比约 22%，AA 占比约 37%，AA- 占比 9%。由于 +/-
    符号仅代表略高或略低于本等级，表示微调，并未表示较大等级间的差异，因此合并统计的情况下 AAA 占比约 29%，AA（含 AA+、AA-）占比约 68%，这两个等级合计占比约
    97%。


    作为对比，我们通过穆迪官网找出所有的穆迪全球样本主体评级数据，绘制如图 5.2 所示的分布图。和中国市场主体评级分布图对比，我们可以清晰地发现，穆迪全球样本的主体评级分布非常分散，非常类似于右偏的
    Beta 分布，且高信用等级（如 Aaa 和 Aa）的占比极少，其中 Aaa 和 Aa 两个最高信用等级的合计占比只有约 1.3%。


    那么，被评主体实际违约情况跟评级符号所代表的含义是否一致呢？我们先来看看国内评级机构对评级符号的定义，如表 5.1 所示。这个评级符号的定义，跟穆迪评级符号的定义基本一致。也可基本认为国内外部评级机构对信用等级符号的定义是从穆迪等国外评级机构翻译过来的。'
  merge: -1
  img_proc: true
