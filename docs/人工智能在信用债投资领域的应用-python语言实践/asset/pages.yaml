    \n# 3. Python 语法基础\n\n# 1) 变量和算术表达式\n\nPython 是一种动态类型的语言，在程序执行过程中，变量名称会被绑定到不同的值，而且这些值可以属于不同的类型。赋值运算符的作用仅仅是在名称和值之间创建一种关联，尽管每个值都有一个相关的类型，如\
    \ integer 或 string，但变量名称是无类型的。一个变量名称可以在执行过程中引用任意类型的数据。\n\nPython 的语法规则跟 R 语言有很大的不同，采用的是\
    \ Pascal 语法规则，即以空格调整的代码块作为基本的代码段或函数体。Python 不会指定所需缩进的量，只要在一个代码块中保持一致即可。然而，每个缩进层次使用\
