  md: '# 第 3 章

    基于 TensorFlow 用 Keras 做深度学习


    流行的深度学习框架很多,如 TensorFlow、Caffe 和 Theano 等。但这些框架都是面向深度学习开发的专业人士的,用这些框架做深度学习需要非常了解底层逻辑,且需要编写大量的代码才能实现。这对非计算机编程相关专业班级出身的金融从业人员来说,是个很大的挑战,且短时间内很难弥补。本书介绍的深度学习库
    Keras 是一个基于 TensorFlow 的 API,它能够使我们快速实现金融模型的思维,且易于编程实现。


    # 3.1 Keras 简介


    Keras 是由谷歌软件工程师 Francois Chollet 开发的、基于 TensorFlow 的深度学习库,具有较为直观的 API。目前,Keras
    库已经成为 TensorFlow 的默认 API。Keras 库强调极简主义——只需要几行代码就能构建一个神经网络,其设计原则如下。


    # 1. 用户友好


    Keras 是神经网络的高层 API,它充分考虑用户的使用体验,在极大减少用户工作量的前提下,使用户非常方便地构建不同层次深度的定制化神经网络模型。


    # 2. 模块化


    使用 Keras 构建深度学习模型时,可将该模型理解为一个多层的序列或数据的运算图,这些完全可配置的模块可以用最少的代价自由组合在一起。具体而言,网络层、损失函数、优化器、初始化策略、激活函数、正则化方法等都是独立的模块,可以使用它们来构建自己的模型。


    # 3. 易扩展性


    添加新模块(或网络层、神经元等)非常容易,只需要仿照现有的模块编写新的类或函数即可。创建新模块的便利性使得 Keras 更适合于先进的研究工作。为了说明使用
    Keras 进行深度学习模型开发的便利性,此处以一个简单的'
