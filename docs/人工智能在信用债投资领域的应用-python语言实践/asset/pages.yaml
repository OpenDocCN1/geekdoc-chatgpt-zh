  md: '# 第 8 章


    # 主体评级模型开发方法


    本书第 7 章中讲述的基于场外真实数据的评级模型开发方法的前提是获取这些场外数据,并提取相关的入模指标。但是,场外数据的获取和加工需要较强的 IT 技能,这对非计算机专业出身的量化投资研究人员来说是一个巨大的挑战。本章重点讲述通过模型结构的调整和优化来缓释财务粉饰造成影响的方法,这对无法获取场外真实数据的量化投资研究人员来说,也是非常实用的方法。


    # 8.1 基于财务数据的评分卡模型缓释财报粉饰的基本原理


    通常情况下,我们开发信用债发行主体的评级模型时,重点考虑的是发债主体最近 1 年中各季度财务变化的情况,及其对发行人还款能力的影响。但是,由于企业财报粉饰现象的普遍存在,这种仅仅考虑最近
    1 年财务数据的评分卡模型,时常会产生较大的误判情况。因此,本节详细讲述的是笔者多年研究的针对目前国内市场降低财务数据粉饰对企业信用评估影响的实用方法。


    笔者研究发现,已经被证实存在财务粉饰公司的财务指标一般表现为波动性大,为了缓释财务粉饰带来的负面影响,在模型结构设计时我们一般需要输入最近 3 年的财务数据,以便于衡量被评估主体的财务波动性情况。模型输入部分的结构设计,如表
    8.1 所示。


    表 8.1 输入 3 年企业财务数据


