    # 2.1.3 半监督机器学习


    有监督机器学习的样本需要有标注,且标注数据质量的好坏直接影响机器学习的效果(包括回归问题和分类问题)。无监督机器学习的样本不需要标注,但这类学习算法只能用于了解样本结构,而不能用于预测。在现实问题中,如果样本量过大,全部标注是件非常困难的事情。经常遇到只有部分标注样本,但需要处理回归或分类问题的情景,此时就需要用到半监督机器学习技术,图
    2.4 所示为半监督机器学习示意图。


    ![](img/bef5d57039b9e3819bf07153f102e5b8_20_0.png)


    图 2.4 半监督机器学习示意图


    所谓半监督机器学习技术,就是指让学习器不依赖外界交互、自动地利用未标注样本来提升学习性能的一类算法。在 sklearn.semi_supervised 包中实现了基于标注传播(Label
    Propagation)原理的半监督机器学习算法。此处,我们以简单的示例说明标注传播算法的使用方法。


    ```

