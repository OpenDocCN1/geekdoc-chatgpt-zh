- pgno: 155
  md: "行主体的财务数据，因为由第5、第6两章的统计数据和检验结果可见，财务数据无法真实有效地反映企业的真实还款能力和财务水平。\n\n例如，很多已经违约的公司，其现金流和还款能力均表现“良好”。如果直接对已经违约样本的财务数据进行“过采样”，就会模拟出很多财务状况良好但已经违约的样本。就笔者实际的统计检验结果来看，这种做法更使得财务数据对违约状况影响不显著，基本无法将任何财务指标进入模型。\n\
    \n此处，我们的解决方案是采用自定义技术性违约样本的方法来解决样本严重不均衡问题。笔者在在使用财务数据开发评分卡模型时，通常采用“现金到期债务比”“现金流量利息保障倍数”和“经营活动产生的现金流量净额/流动负债”三个指标来自定义技术性违约。我们首先在每个行业中均选择这三个指标排名最后20%的公司，然后取这些公司的交集，作为该行业的技术性违约样本。\n\
