- pgno: 76
  md: '# 天线智能设计


    在机器学习辅助优化 (MLAO) 的框架下，为了进一步降低计算量，多保真度机器学习方法被引入到天线等微波器件的设计优化中。低保真度模型可为经验公式、等效电路模型等。对于结构复杂的天线，低保真度模型一般为粗糙网格设置的全波仿真模型，这类模型的精度不够高，但与高保真度全波仿真模型相比，所需计算时间更短。多保真度机器学习算法能够挖掘不同保真度之间的关系，利用少量的高保真度数据和大量的低保真度数据建立代理模型，显著降低样本获取所需时间并保证代理模型的精度。在在线更新代理模型的迭代优化框架下，每轮优化过程的迭代后，都会将一定数量的全波仿真结果加入训练集，对代理模型进行更新，从而提升代理模型的精度。每次迭代中，新增样本点的选择是重要的，设计者需在局部的预测较好区间和全局的未知区间进行权衡。预测较好的区间是当前代理模型最接近优化目标的区域。未知的区间是指样本点稀疏的区域，由于对该区间缺乏探索，预测不准确。对未知区间的衡量可根据预测点和样本点的距离或代理模型提供的预测不确定信息。高斯过程回归的机器学习算法不仅能提供预测值，而且能够提供预测的不确定度，在天线优化领域得到广泛应用。多种依据预测值和预测不确定性的预筛选策略被应用到优化中，其中，置信下限
    (lower confidence bound, LCB) 预筛选策略对预测值和预测不确定度进行线性组合，将组合后的结果作为进化算法中的适应度函数值来平衡全局和局部搜索。


    本章首先介绍多精度电磁仿真方法、协作式机器学习辅助建模方法，然后对多路径机器学习方法的原理及主要步骤进行详细介绍，同时介绍置信下限预筛选策略以及多保真度机器学习算法，最后给出测试函数和实际天线的仿真结果对比。


    # 4.1 多精度电磁仿真


    低保真度模型是多保真度机器学习辅助优化的关键组成部分。在微波滤波器设计领域中，等效电路模型常被用作低保真度模型[34]。但对于结构复杂的天线，往往难以得到等效电路模型，低保真度模型一般为精度较低但计算速度较快的全波仿真模型[35]。低保真度全波仿真模型可通过如下
    4 种方法获得：


    +   (1) 减少网格密度，放松全波仿真的收敛条件；

    +   (2) 减小电磁仿真分析区域，如减小空气盒子；'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   (3) 用理想导体 (perfect electric conductor, PEC) 代替金属，并忽略金属厚度； (4) 忽略介质损耗和色散等。


    低保真度模型的选择十分重要，原因主要是两个方面：一方面，越粗糙的模型仿真越快，但精度不够高。这当然会影响多保真度代理模型的精度，可能需要大量迭代才能达到设计目标。而每一轮迭代都会对应一次昂贵的全波仿真，导致优化过程中的计算开销增大。另一方面，精细的模型计算成本更昂贵，但可能会在较少的迭代次数内优化到满足指标要求的设计[35]。一般高保真度模型的仿真时间为低保真度模型的
    10~50 倍[36]，同时低保真度模型的响应必须捕捉高保真度模型的重要特征[35]。


    # 4.2 协作式机器学习辅助建模


    本节详细介绍一种利用多级协作式机器学习的天线快速多目标建模方法[37]。该方法首先通过低保真度仿真获得大量样本点处的天线第一设计目标的响应数据集，通过高保真度仿真获得少量样本点处的天线第一设计目标、第二设计目标或其他设计目标的响应数据集；然后利用多种机器学习方法，学习不同保真度模型间及不同设计目标间的联系，并预测获得保真度较高的辅助数据集；最后利用得到的高保真度辅助数据集学习，建立天线设计参数和各设计目标之间的代理模型，实现对多目标天线设计的快速建模。该方法的流程如图
    4.1 所示。


    采用多级协作式机器学习建立代理模型的方法包括 4 个步骤：


    步骤 1. 构建训练数据集。利用第一种仿真方法获得第一类样本点处的天线第一设计目标的响应数据集 $D^1_{coarse}$；利用第二种仿真方法获得第二类样本点处的天线第一设计目标的响应数据集
    $D^1_{fine}$ 和第二设计目标的响应数据集 $D^2_{fine}$。其中第一种仿真方法的耗时少于第二种仿真方法，但得到的数据保真度低于第二种仿真方法，第二类样本点从第一类样本点中随机选取，并且第二类样本点数量少于第一类样本点数量。


    步骤 2. 利用不同保真度的数据集之间的关系，构建针对第一设计目标保真度较高的辅助数据集。利用机器学习方法学习针对天线第一设计目标保真度较高的响应数据集 $D^1_{fine}$
    与保真度较低的响应数据集 $D^1_{coarse}$ 之间的联系，得到第一代理模型 $R^1_{AMGP}$。此处的第一代理模型代表了不同保真度的数据集之间的关系。利用该代理模型，预测出步骤
    1 中使用的用于计算天线第一设计目标的保真度较低的响应数据集 $D^1_{coarse}$ 的样本点处预测的高保真度值 $D^1_{pre,fine}$。此处得到的辅助数据集
    $D^1_{pre,fine}$ 的保真度较高。


    步骤 3. 利用不同设计目标之间的关系，构建针对第二设计目标保真度较高的辅助数据集。利用机器学习方法学习步骤 1 得到的、针对天线第二设计目标的'
  merge: -1
  img_proc: true
