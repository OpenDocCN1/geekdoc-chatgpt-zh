    286 次全波仿真用以建立 ML 代理模型。对 ML 能够建立的代理模型而言，对计算资源的消耗和模型的精确度构成了一对天然的矛盾。另一方面，现有的数据驱动方法很难被拓展到更为实用的平面阵的综合问题中：相较于线阵的优化问题，平面阵中的天线单元所处的阵列电磁环境更为复杂；相对于线阵综合问题通常只需要考虑一个面的设计优化，面阵的阵列综合所需要考虑的角度数据将远远增长。


    考虑一种常用的平面阵列形式，其结构参数如图所示 5.1。天线阵元位于 xOy 平面上，天线阵列设计的目的即为优化阵元位置与激励，以实现定向波束、多波束、波束成型等。


