    # 7.1.2 可变螺旋电感的结构与特性


    电感是射频电路的重要组成部分，振荡器、混频器等电路都包含电感。而平面螺旋电感具有结构简单、易集成的优点，在集成电路中广泛应用。传统的平面螺旋电感结构如图 7.3
    所示，主体形状为正多边形，例如，正四边形、正六边形、正八边形等，描述传统平面螺旋电感的几何参数有线宽、线距、内径以及圈数等。根据电感拓扑结构是否对称，可分为单端螺旋电感和对称螺旋电感。此类平面螺旋电感结构简单，复杂度低，但在实际的电路设计中可用的面积往往并不是正多边形，因此规则的正多边形电感不利于空间分配，容易造成空间浪费。


    ![](img/cf98602880e9fcdd502be0d0247f6934_150_1.png)


    图 7.3 正多边形螺旋电感结构'
