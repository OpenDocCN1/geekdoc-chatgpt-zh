- pgno: 175
  md: '可以同时刻画了簇内 MPC 的紧致度和簇间隔离度。首先，在完成某一轮分簇后，得到共 \( K \) 个簇，第 \( k \) 个簇内的 MPC 构成子集
    \( \mathcal{C}_k \)，\( L_k = |\mathcal{C}_k| \) 表示簇内的子径数量。将第 \( k \) 个簇内的第 \(
    i \) 个子径 \( \boldsymbol{m}_i \) (\( \boldsymbol{m}_i \in \mathcal{C}_k \)) 与其他
    \( (L_k - 1) \) 个簇内子径的距离 \( b(i, k) \) 定义为


    \[ b(i, k) = \frac{1}{L_k - 1} \sum_{\substack{j \in \mathcal{C}_k \\ j \neq i}}
    \text{MCD}^2(\boldsymbol{m}_i, \boldsymbol{m}_j) \] (8.12)


    将第 \( k \) 个簇内的第 \( i \) 个子径与其他 \( (K - 1) \) 个簇内子径的距离 \( d(i, k) \) 定义为


    \[ d(i, k) = \min_{\substack{q \in [1, K] \\ q \neq k}} \frac{1}{L_q} \sum_{\substack{j
    \in \mathcal{C}_q \\ q \neq k}} \text{MCD}^2(\boldsymbol{m}_i, \boldsymbol{m}_j)
    \] (8.13)


    不难发现：\( b(i, k) \) 越小，表示子径 \( \boldsymbol{m}_i \) 与第 \( k \) 个簇其他子径越紧密，\( d(i,
    k) \) 越大，表示子径 \( \boldsymbol{m}_i \) 与其他 \( (K - 1) \) 个簇的间隔越大。因此，可以定义归一化检验系数
    \( Q(i, k) \)：


    \[ Q(i, k) = \frac{d(i, k) - b(i, k)}{\max\{b(i, k), d(i, k)\}} \] (8.14)


    此时，最佳分簇结果即为簇数 \( K_{\text{opt}} \) 时的分簇结果：


    \[ K_{\text{opt}} = \arg \max_K \sum_{k=1}^K \sum_{i=1}^{L_k} Q(i, k), \quad K
    \in [K_{\min}, K_{\max}] \] (8.15)


    从分簇准确性而言，通过二次分簇并调节分簇过程中的特征参数，可以从信道物理传播特性出发解决传统方法分簇结果边界模糊的问题。特别地，从孤立 MPC 识别和最优分簇结果判决等角度对传统算法进行优化，提高了分簇结果的准确性。从分簇算法计算复杂度而言，需要从初始簇心选取方面进行优化。当初始簇心越接近最终分簇结果的簇心时，可有效降低分簇过程中的迭代次数，进而降低算法的计算复杂度。从物理角度而言，簇心的特点包括具有较强的接收功率、簇心间的
    MCD 较大。因此，定义 MPC 的相异度矩阵 \( \boldsymbol{S} = (s_{ij})_{L \times L} \)，其中 \( s_{ij}
    \) 可以定义为


    \[ s_{ij} = \frac{p_i + p_j}{2 P_{\max}} \text{MCD}_{ij} \] (8.16)


    式中，\( i, j \in \{1, 2, \cdots, L\}\)；\( p_i \) 和 \( p_j \) 分别表示第 \( i \) 条和第 \(
    j \) 条 MPC 的接收功率或信道增益；\( P_{\max} \) 表示在 \( \{p_i\} \) 中的最大值。当 \( i = j \) 时，\(
    s_{ij} = 0 \)。当 \( s_{ij} \) 越大时，表示第 \( i \) 个和第 \( j \) 个 MPC 具有较大的接收功率并且两者间的
    MCD 较大，进而可以将这两个 MPC 选为初始簇心。初始簇心估计算法流程详见算法 8.1。以室内走廊场景测试结果为例，图 8.2 比较了一次分簇过程中采用本书所提出的初'
