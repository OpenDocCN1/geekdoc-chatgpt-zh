    # 6.2.3 最差情况分析


    在鲁棒设计的分层设计中，在给定 ITR 的前提下，WCA 扮演着评估设计点鲁棒性的重要角色。传统的 WCA 策略依赖于蒙特卡洛仿真或者随机搜索策略，无法保证得到高质量的
    WCP。文献 [94] 通过引入全局优化方法和一种容差范围缩减策略，实现了 100% 可靠的鲁棒优化。考虑到全局优化方法引入对计算代价的高昂需求，在算法的
    MITH 搜索过程中，对设计参数的容差值间的比例进行事先约定，从而缓解了整体鲁棒设计的计算复杂度。与本章所述的分层思想类似，文献 [94] 中的算法倾向于将
    WCA 搜索视为 MITH 搜索的基本单元。与之相对的是文献 [92] 中所提出的新型采样策略，通过一种集成化的算法步骤，直接对 MITH 的最优形状进行逼近，从而可以更自由地对不同
    MITH 形状比例的结果进行搜索。然而，这种不对 WCP 进行独立搜索的算法思想可能会带来 MITH 结果的可靠性的损失。'
