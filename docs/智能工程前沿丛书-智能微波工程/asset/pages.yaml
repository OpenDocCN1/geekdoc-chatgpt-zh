    # 7.2 片上可变形的螺旋电感自动综合


    # 7.2.1 结合先验知识的代理模型


    GPR 代理模型在射频电路设计中应用广泛，相较于其他代理模型，GPR 代理模型的输出不是一个确定值，而是高斯分布的概率函数，包含最佳估计值以及置信区间，这对后续的优化过程有极大帮助。同时，无源器件的样本获取通常来源于全波仿真，这会耗费大量的时间，因此如何用尽可能少的样本达到更好的性能也是需要考虑的问题，而在线更新的
    GPR 代理模型在小样本集下有着不错的性能和效率[3]。


    在无源器件的设计中，传统的 GPR 代理模型以频率为特征维度，代理模型需要学习每一个频点与电学参数之间的关系，因此模型训练所需的数据量与单个样本频点个数密切相关。在毫米波片上螺旋电感的设计中，电感的自谐振频率通常都是数十
    GHz。如此宽的频带范围通常包含非常多的样本数据，导致代理模型的训练和预测速度非常缓慢。


    一种解决办法是代理模型只学习目标频点的数据，例如需要设计一个工作在 40GHz 的电感，自谐振频率大于 60GHz，那么只用输入 40GHz 和 60GHz
    处的电感值与品质因数。但是这种方法并不稳健，图 7.8 展示了一条电感值随频率变'
