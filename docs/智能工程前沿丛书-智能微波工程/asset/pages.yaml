    \ | 75.2×64.1 |\n\n# 7.4 本章小结\n\n射频电路的频率逐年提升，螺旋电感作为射频集成电路的基本组成元件，如何高效地设计期望的电感是一大挑战。传统的片上螺旋电感往往并不满足实际需要，正多边形的形状对于电路布局也有一定的影响。针对于此问题，本章提出了"
