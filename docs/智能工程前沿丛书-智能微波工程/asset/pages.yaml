    )。\n\n# 3.3.3 差分进化算法\n\n差分进化 (differential evolution, DE) 算法是一种基于群体差异的启发式随机搜索算法[31,32]。差分进化算法原理简单，受控参数少，鲁棒性强，该算法在连续空间优化问题中，求解质量和收敛速度优于其他进化算法，应用广泛。与\
    \ GA 算法相比，在遗传突变中，DE 算法突变不是小的基因改变，而是通过个体的组合进行的。\n\n假设在 \\(D\\) 维空间中，有 \\(N_p\\\
    ) 个随机样本的数据集 \\(\\{\\boldsymbol{x}_i^t, i=1, \\cdots, N_p\\}\\)，DE 算法主要的操作步骤包括：\n\
    \n+   1) 变异\n+   \n+   对于每个目标向量 \\(\\boldsymbol{x}_i^t\\)，第 \\((t+1)\\) 代变异向量\
    \ \\(\\boldsymbol{v}_i^{t+1}\\) 表示为\n+   \n+   \\[\\boldsymbol{v}_i^{t+1} = \\\
    boldsymbol{x}_{p_1}^t + F(\\boldsymbol{x}_{p_2}^t - \\boldsymbol{x}_{p_3}^t) \\\
    quad (3.27)\\]\n+   \n+   式中，\\(\\boldsymbol{x}_{p_1}^t, \\boldsymbol{x}_{p_2}^t,\
    \ \\boldsymbol{x}_{p_3}^t\\) 是从 \\(t\\) 代种群中随机选择的 3 个互不相同的个体；\\(p_1, p_2, p_3\
    \ \\in \\{1, 2, \\cdots, N_p\\}\\)；\\(F\\) 为缩放比例因子。\n\n+   2) 交叉\n+   \n+   第\
    \ \\((t+1)\\) 代子个体 \\(\\boldsymbol{c}_i^{t+1}\\) 是由 \\((t+1)\\) 代变异个体 \\(\\boldsymbol{v}_i^{t+1}\\\
    ) 与上一代个体 \\(\\boldsymbol{x}_i^t\\) 交叉得到，交叉公式为\n+   \n+   \\[\\boldsymbol{c}_i^{t+1}\
    \ = [c_{i,1}^{t+1}, c_{i,2}^{t+1}, \\cdots, c_{i,n}^{t+1}] \\quad (3.28)\\]\n\
    +   \n+   \\[c_{i,j}^{t+1} = \\begin{cases} v_{i,j}^{t+1}, & \\text{rand}(j) \\\
    leqslant \\text{CR}, \\\\ x_{i,j}^t, & \\text{其他.} \\end{cases} \\quad (3.29)\\\
    ]\n+   \n+   式中，\\(i=1, 2, \\cdots, N_p\\); \\(j=1, 2, \\cdots, n\\); \\(\\text{rand}(\\\
    cdot)\\) 函数产生一个 0~1 之间的随机数，当其小于交叉概率 CR 时，\\(\\boldsymbol{c}_i^{t+1}\\) 中对应参数来自变异个体\
    \ \\(\\boldsymbol{v}_i^{t+1}\\)，否则该参数来自上一代个体 \\(\\boldsymbol{x}_i^t\\)。\n\n+ \
    \  3) 选择\n+   \n+   经过变异和交叉后的 \\((t+1)\\) 代子个体 \\(\\boldsymbol{c}_i^{t+1}\\) 与上一代个体\
    \ \\(\\boldsymbol{x}_i^t\\) 竞争，产生第 \\((t+1)\\) 代个体，\n+   \n+   \\[\\boldsymbol{x}_i^{t+1}\
    \ = \\begin{cases} \\boldsymbol{c}_i^{t+1}, & U(R(\\boldsymbol{c}_i^{t+1})) <\
    \ U(R(\\boldsymbol{x}_i^t)), \\\\ \\boldsymbol{x}_i^t, & \\text{其他} \\end{cases}\
    \ \\quad (3.30)\\]"
