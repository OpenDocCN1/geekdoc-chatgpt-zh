- pgno: 168
  md: '# 智能信道建模


    无线信道研究是无线通信系统设计和网络规划部署的基础之基础，只有充分了解电磁波的电波传播特性，才能建立更贴近真实传播环境的精确信道模型。从信道建模方法的角度出发，传统信道模型主要包括确定性建模（如射线追踪法和点云场景等）、基于物理的随机性建模（如几何随机模型和物理统计模型）和非物理性建模（如基于相关的信道模型和虚拟信道模型）。这几种信道建模方法在模型精确性、复杂度和适用范围上存在一定差异。目前，ITU、3GPP
    和 IEEE 等标准化组织主要采用基于几何随机信道模型，但这类模型普遍存在复杂度高、计算量大等缺点，不利于快速实现信道仿真，使系统设计迭代更新进程缓慢。此外，信道模型需要尽可能真实地还原实际物理传播信道，这就要求针对不同应用场景精细化调整信道模型参数，极大地降低了该类模型的通用性。因此，亟须推出新型的信道建模方法，在保证建模精确度的同时，提高模型应对不同场景的泛化能力。


    近年来，机器学习使能的信道建模方法被提出，并受到广泛关注。然而，目前纯数据驱动的智能化信道建模方法仅初步解决了信道特性随收发信机位置变化的预测性建模，即预测器的输入包含收发信机的位置信息，并且为了提高建模结果的准确性，需要大量信道数据集和更为复杂的预测器，同时缺乏对预测模型的物理解释和信道细节特征的表征。因此，有必要从信道的物理传播特征出发，探明信道特性随环境、频率和收发信机位置等因素变化的关系，利用机器学习算法对复杂信道参数进行预测性建模，构建具有更高准确性和通用性的智能信道模型。


    本章首先从基于几何随机模型的物理信道建模方法出发，介绍在传统信道建模过程中所关心的几类信道参数，并引入无监督机器学习算法，完成多径信道的分簇建模；随后，讨论了传统物理信道模型在建模准确性和模型对场景泛化能力上的不足，并从无线信道的客观物理传播规律出发，提出了知识和数据混合驱动的智能信道建模方法；最后，基于该模型的框架，以前向植被散射簇蕴内信道特性预测性建模为例，详细介绍利用该方法进行信道预测性建模时的主要步骤及相关研究结果，包括信道数据集建立、物理信道特征参数提取、人工神经网络模型训练以及模型预测结果分析和验证等。通过本章的介绍，以期为智能化信道建模研究提供新的思路和方法。'
  merge: -1
