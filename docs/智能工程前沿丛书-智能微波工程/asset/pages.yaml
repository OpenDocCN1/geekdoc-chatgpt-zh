  md: '综上所述，本书所提出的改进的两步 KPowerMeans 多径分簇算法的流程详见算法 8.2。图 8.3 给出采用该方法对原始估计的 MPC 进行二次分簇后得到的结果。比较发现采用一次分簇只能将所有有效
    MPC 分成 3 个子集，并且 G1 和 G4、G2 和 G5 被分为一个簇。经过二次分簇后可以将每一个子集剥离开，得到最终结果，并且 G6 因功率和有效径数较小被剔除。


    # 算法 8.2 改进的两步 KPowerMeans 多径分簇算法


    Input: $\mathcal{A} = \{ \mathbf{m}_l \}, l = 1, 2, \cdots, L, \mathbf{m}_l =
    [p_l, \tau_l, \theta_{\text{TX},l}, \phi_{\text{TX},l}, \theta_{\text{RX},l},
    \phi_{\text{RX},l}]$

    Output: 最佳簇数 \( K_{\text{opt}} \) 和分簇结果 \( \mathcal{R}_{\text{opt}} = \{ \mathcal{C}_k
    \}, k = 1, 2, \cdots, K_{\text{opt}} \)

    1: for \( k_1 = K_0 \) to \( K_1 \) do

    2: 初始化：根据算法 8.1 选取 \( k_1 \) 个初始簇心: \( \mathbf{c}_1^{(0)}, \mathbf{c}_2^{(0)},
    \cdots, \mathbf{c}_{k_1}^{(0)} \)

    3: repeat

    4: \( n + 1 \leftarrow n, n = 1, 2, \cdots, N_{\text{iteration}} \)

    5: 将 \( L \) 个 MPC 根据 \( \underset{k}{\text{arg min}}\{ p_l \cdot \text{MCD}(\mathbf{m}_l,
    \mathbf{c}_k^{(n-1)}) \}, k \in [1, k_1] \) 分配到 \( k_1 \) 个簇中

    6: 计算加权簇心并找出距离其最近的 MPC 作为新的簇心 \( \mathbf{c}_1^{(n)}, \mathbf{c}_2^{(n)}, \cdots,
    \mathbf{c}_{k_1}^{(n)} \)

    7: until \( \forall k = 1, 2, \cdots, k_1, \mathbf{c}_k^{(n)} = \mathbf{c}_k^{(n-1)}
    \)

    8: 记录第一次分簇结果 \( \mathcal{C}_1'', \mathcal{C}_2'', \cdots, \mathcal{C}_{k_1}''
    \)

    9: while \( (k = 1, 2, \cdots, k_1) \text{ and } (|\mathcal{C}_k| < L_{\text{th}})
    \) do

    10: 在 \( [1, K_2] \) 簇数范围内，根据式 (8.10) 并重复上述步骤对 \( \mathcal{C}_k'' \) 进行二次分簇

    11: 根据式 (8.15) 得到对 MPC 集合 \( \mathcal{C}_k'' \) 的最佳分簇结果

    12: end while

    13: 记录二次分簇结果 \( \{ \mathcal{C}_{k_i}^{(i)} \}, k_i = 1, 2, \cdots, K_i, K_i \in
    [K_{\text{min}}, K_{\text{max}}], i = 1, 2, \cdots, N_{\text{total}} \)

    14: end for

    15: for \( i = 1 \) to \( N_{\text{total}} \) do

    16: 根据式 (8.11)，剔除分簇结果 \( \{ \mathcal{C}_{k_i}^{(i)} \} \) 中的孤立簇或 MPC

