    在实际的阵列环境下，每个阵元的辐射特性将会受到包括周围阵元的互耦及平台效应等各种因素的影响，可以通过有源单元方向图 AEP 即 \( g_n(\theta,
    \phi) \) 进行定义，其代表在方位角 \( \phi \) 和俯仰角 \( \theta \) 处阵元的辐射场强，其中 \( n = 1, \cdots,
    N \) 代表不同阵元的序号。每个阵元所受到的激励可以由 \( \omega_n \) 表示。阵列远场的方向图可以被描述为


    ```

    \( f(u, v) = \sum_{n=1}^N g_n(u, v)\omega_n e^{j(u x_n + v y_n)} \quad (5.1) \)

    ```


    式中，\( u = 2\pi \sin \theta \cos \phi \)；\( v = 2\pi \sin \theta \sin \phi \)；而
    \( x_n \) 和 \( y_n \) 为由波长归一化后的阵元 \( n \) 的坐标。在实际的天线阵列设计中，如何在给定的设计参数下快速地获得可靠的阵列辐射响应
    \( f(u, v) \) 是问题的关键。由于阵元激励的变化不会对其 AEP 构成影响，上述问题可以转化为如何在给定的阵元位置分布下快速地获得可靠的 AEP。如图
