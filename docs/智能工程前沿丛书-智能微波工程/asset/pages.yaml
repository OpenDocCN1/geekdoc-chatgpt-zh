- pgno: 108
  md: '预测精度明显高于 ADM 方法。其原因在于 ABEM 算法将所有的阵元皆视为在不同输入特性下的 ABE，从而充分利用了全波仿真数据给出的信息。在训练集大小
    M = 30 时，ADM 方法对幅度和相位的学习平均花费时间分别为 80.85s 和 80.85s；而 ABEM 算法的平均花费时间分别为 86.57s 和
    77.02s。对 M = 40，ADM 方法对幅度和相位的学习平均花费时间分别为 93.63s 和 93.63s；而 ABEM 算法的平均花费时间分别为 87.19s
    和 95.16s。由此可见，ABEM 算法可以在相似的计算资源需求下，实现更优越的对潜在设计点的预测精度。


    # 5.2.2 结合先验知识的有源元单元建模


    在 5.2.1 节中，通过将所有的天线阵元视为具有不同输入及输出特征的 ABE，ABEM 算法获得要比传统的 ADM 方法更优越的性能，包括更高的设计自由度和更高的预测精度。然而，ABEM
    仍然存在一定的缺陷。首先，ABEM 的建模方法建立在对每个需要关注的辐射角度的辐射特性学习的基础上，随着优化过程中数据量的增大，ABEM 的建模及预测速度将会相应地迅速增长，从而严重影响算法的性能。更加重要的是，ABEM
    在二维面阵的设计及优化中的直接应用将会受到两个方面的限制：


    +   (1) 相较于线阵，二维面阵中 ABE 的输入参数的定义将会更加复杂，影响 ABE 的其他天线单元与 ABE 的相对位置，难以通过少量的参数进行量化。


    +   (2) 相较于线阵，二维面阵中的的 AEP 涉及更多的角度，线阵的阵列综合通常仅关注一个面上不同俯仰角处的辐射特性，而面阵则需要关注不同俯仰角和方位角上的辐射特性。对常用的机器学习方法如
    GPR，其计算复杂度为 O(n_d^3)，其中 n_d 代表训练集的维度。面阵相较于线阵更大的训练集将严重地制约算法的效率。


    为了解决 ABEM 算法存在的上述问题，引入包括平面耦合区域分割和平面虚拟子阵拟合在内的多种基于知识驱动的方法，将其与数据驱动的机器学习方法相结合，从而构建一种全新的知识和数据混合驱动
    (hybrid knowledge-guided and data-driven technology, HKDT) 建模方法对二维面阵下的有源元单元进行建模，从而在很大程度上解决了
    ABEM 所存在的一系列问题。如图 5.7 所示，对给定的天线阵列，通过引入平面耦合区域分割的方法对 ABE 进行定义；再通过平面虚拟子阵拟合方法，将 ABE
    的辐射信息的表征从以角度表征的辐射特性转换为平面虚拟子阵的激励信息，大大降低了对 ABE 的学习和预测所需要的计算复杂度。HKDT 将数据驱动的建模过程限制在
    ABE 的输入特征和平面虚拟子阵的激励信息之间，最大程度利用已有的电磁学知识和假设，由此带来非常有效地对计算复杂度的削减。下面将给出 HKDT 建模方法的具体步骤：'
