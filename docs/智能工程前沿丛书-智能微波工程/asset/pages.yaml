    20.57h。而 MB-MLAO 算法可以在 14.77h 获得与 \(\hat{\omega} = 1\) 的 SB-MLAO 算法相近的值，为 -16.14dB。对于传统的
    SB-MLAO 方法，LCB 变量的选择会影响算法的性能，在本例中，LCB 变量设为 2 的搜索性能明显优于设为 0 和 1 的情况。而且，MB-MLAO
    算法的优化结果与 SB-MLAO 算法的最好性能相近，这说明 MB-MLAO 算法有更强的收敛稳定性。


    # 4.6 本章 小结


    首先对多精度建模方法、多保真度机器学习方法以及置信下限预筛选策略进行介绍，随后详细介绍多级协作式机器学习方法和多路径机器学习方法的思想和主要步骤，并通过两个测试函数和三个天线的案例验证
    MB-MLAO 算法的优越性。MB-MLAO 算法能够平衡算法在局部和全局的搜索能力。在优化中，利用 LCB 变量实现多路径优化，在当前最优区域和稀疏采样区域进行权衡，并且利用多保真度机器学习方法降低计算时间。进一步，利用再训练再预测的策略，再预测后的精度有可能得到提升，并指导算法自适应地选择一组参数组合利用高保真度全波仿真模型进行验证。测试函数和天线的实验结果表明，对于不同特征、不同复杂度的问题，MB-MLAO
    算法具有好的优化效果且收敛稳定性强。'
