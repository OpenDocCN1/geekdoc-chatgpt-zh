- pgno: 110
  md: '在 HKDT 方法中，第一步是将所考虑的阵元作为 ABE，继而在其周围划分出一系列区域用以定义周围阵元的互耦对其 AEP 的影响。如图 5.8 所示，对所考虑的
    ABE，将其周围围半径为 \( R_c \) 的区域定义为会对 ABE 的 AEP 造成影响的互耦区域，继而将此区域根据方位角 \( \phi \) 划分成
    \( M \) 个区域。对每个区域，将于满足下列条件的相邻单元列入需要考虑的范围：


    ```

    \begin{cases} r_{m,1} < ... < r_{m,k-1} < r_{m,k} < R_c, k=1,2,\cdots,K \\ \phi_{m,k}
    \in [2(i_m-1)\pi/M, 2i_m\pi/M), i_m=1,2,\cdots,M \end{cases} (5.6)

    ```


    式中，\( i_m \) 代表所划分的耦合区域的序号，而 \( [r_{m,k}, \phi_{m,k}] \) 则定义相应的邻近单元在极坐标下与 ABE
    的相对位置，其中 \( k \) 代表该邻近单元与 ABE 在区域 \( m \) 中的欧氏距离为第 \( k \) 近。对那些耦合区域中，存在的相邻单元个数小于
    \( K \) 个的情况，采用虚拟的相对距离为无穷大的相邻单元对该区域进行补全。由此定义的 ABE 的输入参数为


    ```

    \( l_n = [x_n, 1/r_n]^T \) (5.7)

    ```


    式中，\( x_n \) 代表第 \( n \) 个 ABE 的绝对位置；而 \( r_n \) 代表其相对位置，可被表示为


    ```

    \( r_n = [r_{1,1,n}, \cdots, r_{1,k,n}, \cdots, r_{1,K,n}, \cdots, r_{m,k,n},
    \cdots, r_{M,K,n}]^T \) (5.8)

    ```


    与 ABEM 中的处理类似，式 (5.7) 对 \( r_n \) 的倒数处理确保相对位置参数的连续性，即将无限远处的相邻单元的相对位置参数视作 \( 1/r_n
    = 0 \)。通过恰当地设置包括 \( K \)、\( M \) 和 \( R_c \) 在内的设计参数，该平面耦合区域划分方法固定了 ABE 的输入参数的个数。


    ![](img/cf98602880e9fcdd502be0d0247f6934_110_0.png)


    图 5.8 一种典型的平面阵列形式，针对考虑的阵元，在其周围进行区域划分的示意图'
