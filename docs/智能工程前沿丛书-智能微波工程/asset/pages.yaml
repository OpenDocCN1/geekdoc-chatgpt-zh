  md: '后，将其作为初始簇心重复上述分簇过程，直到前后两次分簇结果的加权簇心位置不再改变时，停止迭代；最后，通过定义合理的标准判断 \( K \) 次分簇中的最优结果。传统的分簇算法单纯从数据分类的角度对
    MPC 进行聚类，忽视了物理信道的传播特征对提升聚类算法准确性和计算效率的影响。以毫米波信道为例，一方面，较大的传输带宽提高时延分辨率，进而可以观察到更多有效多径分量；另一方面，在富散射场景下不同多径分量可能具有较大的时延差，因此在分簇过程中对所有
    MPC 采用相同的时延统计参数 \( \Delta \tau_{\max} \) 和 \( \tau_{\text{std}} \) 将导致分簇结果无法快速收敛，甚至无法获得最佳分簇结果。


    因此，本节给出改进的两步 KPowerMeans 多径分簇算法，通过调节 \( \xi \) 等参数实现 MPC 在时间域和空间域上的分簇[147]。在第一次分簇过程中，可以选取较小的分簇范围
    \( [K_0, K_1] \) 以及较大的 \( \xi \)，保证在计算 MCD 时将角度作为主要因素，主要在角度域上实现 MPC 分离；基于第一次分簇结果，MPC
    被分到 \( k_1 \) 个子簇中，此时以每一个子簇内 MPC 的时延作为主要目标，通过调节 \( \xi \) 及分簇范围 \( [1, K_2] \)
    对每一个子簇进行二次分簇，主要在时延域将第一次粗分簇结果进行细化。在二次分簇中，\( \xi \) 可定义为


    \(\xi = \frac{\sqrt{\sum_{i=1}^{L_n} \sum_{j=1}^{L_n} \text{MCD}_{\tau_{ij}}^2}}{\sum_{i=1}^{L_n}
    \sum_{j=1}^{L_n} \left( \frac{|\tau_i - \tau_j|}{\Delta \tau_{\max}} \frac{\tau_{\text{std}}}{\Delta
    \tau_{\max}} \right)}\) (8.10)


    式中，\( L_n \) 表示在第 \( n \) 个子簇内 MPC 数量，并且满足 \( \sum_{n=1}^{K_1} L_n = L \)。在完成两次分簇后共获得
    \( K \) 个多径簇，随后需要对其中孤立的 MPC 进行剔除。此处主要包括两类孤立 MPC：第一类是簇内只包括少量功率非常弱的 MPC，因此可以直接将该簇进行剔除；第二类则表示
    MPC 远离簇心，并且子径的接收功率较低，这里 MPC 和簇心的偏离度可度量为


    \(\Delta_i = \frac{\text{MCD}_{i,g_k}}{\frac{1}{L_k} \sum_{j=1}^{L_k} \text{MCD}_{j,g_k}}\)
    (8.11)


    式中，分子表示第 \( k \) 个簇中第 \( i \) 个 MPC 与加权簇心 \( g_k \) 的 MCD；分母表示第 \( k \) 个簇内所有
    \( L_k \) 个 MPC 与加权簇心的平均 MCD。当 \( \Delta_i \) 大于某一门限，并且该 MPC 的接收功率较低时，可将该 MPC
    从第 \( k \) 个簇中剔除。


    经过两次分簇以及孤立簇或 MPC 剔除后，得到了选取不同初始簇数的分簇结果，进而需要判断最佳簇数和分簇效果。分簇效果的好坏一方面取决于簇内 MPC 是否紧密围绕加权簇心，即簇内紧致度，另一方面要求不同的簇之间在时间和空间上具有较大的“距离”，即簇间隔离度。因此，设计了一种联合验证系数，'
