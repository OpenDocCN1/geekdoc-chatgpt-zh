  md: '过放大、滤波，再混频到中频进行处理。在无线电子系统中，超外差接收机因其结构简单灵活，能够获得较大增益，且具有较好的频率选择性，在现代无线电子系统中应用极为广泛，但超外差接收机有其不可避免的缺点，如镜像频率干扰、邻信道干扰等。


    # 2. 镜像抑制接收机


    常见的镜像抑制接收机机结构与原理如图 2.3 所示，它首先将信号在本振端对某一路信号进行 90° 移相，混频后，在中频进行 90° 移相，使得镜像频率与本振混频后的两路信号相位差
    180°，而有用的射频信号与本振混频后两路信号相位一致，这样两路信号叠加后便可以抵消掉由镜像频率与本振混频得到的干扰信号。


    ![](img/cf98602880e9fcdd502be0d0247f6934_24_0.png)


    图 2.3 镜像抑制接收机原理框图


    # 3. 零中频接收机


    如图 2.4 所示，零中频接收机将射频信号与本振信号直接混频到基带，理论


    ![](img/cf98602880e9fcdd502be0d0247f6934_24_1.png)


    图 2.4 零中频接收机原理框图'
