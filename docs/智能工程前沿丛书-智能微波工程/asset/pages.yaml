    和 \(\boldsymbol{X}_L^2, \boldsymbol{X}_H^2\)。在图 4.7(g) ~ 图 4.7(i) 中，低保真度模型为 \(U_{L3}\)，初始样本为
    \(\boldsymbol{X}_L^1, \boldsymbol{X}_H^1, \boldsymbol{X}_H^L\)。如图 4.7(a) 所示，最优的优化结果为
