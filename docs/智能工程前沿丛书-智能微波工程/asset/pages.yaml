    # 5.4.4 采用凸优化算法的微带天线面阵设计


    与线阵的设计实例类似，微带天线的面阵设计亦可以采用 HKDT 与凸优化算法协同优化的方法实现相较于进化算法等更有效的设计优化。考虑固定数目 \(N=16\)
    的微带天线阵元，在算法每次外迭代中采用凸优化算法进行多次内迭代优化，第 \(i\) 次内迭代的优化可以表示为：


    ```

    \begin{aligned}

    \min_{\boldsymbol{\epsilon}_i, \boldsymbol{\delta}_i} \rho, \\

    \text{s.t.} \left\{\begin{array}{l}

    \max \left| f_{\boldsymbol{\epsilon}_i, \boldsymbol{\delta}_i}^i((\boldsymbol{U},
    \boldsymbol{V})_{\mathrm{SL}}) \right| \leqslant \rho \\

    |\boldsymbol{\epsilon}_i| \leqslant \mu, |\boldsymbol{\delta}_i| \leqslant \mu
    \\

    d_{\mathrm{dis}, i} \geqslant d_{\min}

    \end{array}\right.

    \end{aligned}

    \tag{5.21}

    ```


    式中，\(\boldsymbol{\epsilon}_i, \boldsymbol{\delta}_i\) 分别代表第 \(i\) 次凸优化过程中各阵元在
    \(x\) 方向和 \(y\) 方向移动的距离；\(\rho\) 代表在副瓣区域（sidelobe region, SL）内最大的 \(\mathrm{SLL}\)；\((\boldsymbol{U},
    \boldsymbol{V})_{\mathrm{SL}}\) 代表在 SL 区域内的 \((u, v)\) 值；\(f_{\boldsymbol{\epsilon}_i,
    \boldsymbol{\delta}_i}^i((\boldsymbol{U}, \boldsymbol{V})_{\mathrm{SL}})\) 代表在
    SL 区域内的辐射方向图信息；\(\mu\) 代表每次凸优化迭代时阵元移动最大步长；\(d_{\mathrm{dis}, i} \geqslant d_{\min}\)
    限定了阵元间的最小间距为 \(d_{\min}\)。


