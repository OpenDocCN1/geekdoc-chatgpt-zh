  md: '考虑到这一点点，可以赋予传统螺旋电感结构更多的维度从而改变它的形状。可变螺旋电感的结构如图 7.4 所示，相比于传统螺旋电感，螺旋电感的形状由 \(
    D_{inh} \) 和 \( D_{inw} \) 同时控制，定义伸缩率 \( \gamma \) 为


    \(\gamma = \frac{D_{inh}}{D_{inw}}\) (7.6)


    当 \( \gamma = 1 \) 时，此时螺旋电感退化为传统的正多边形电感；当 \( \gamma > 1 \) 时，此时螺旋电感处于拉伸状态，电感的面积与金属总长度均进一步增大，同时金属占整个面积的比重减小；当
    \( \gamma < 1 \) 时，此时螺旋电感处于压缩状态，电感的面积与金属总长度均进一步减小，同时金属占整个面积的比重增大。图 7.5 展示了处于拉伸状态的单端螺旋电感和处于压缩状态的对称螺旋电感。此外，文献
    [118] 发现当金属宽度由外向内依次缩减时，可以有效提升电感的品质因数，因此用可变线宽替代恒定线宽，线宽由 \( W_{max} \) 和 \( W_{min}
    \) 决定。


    ![](img/cf98602880e9fcdd502be0d0247f6934_151_0.png)


    图 7.4 可变螺旋电感结构以及其几何参数


    可变螺旋电感的形状由最大线宽、最小线宽、线距、圈数、内径宽度和伸缩率描述。通过调整螺旋电感的伸缩率就可以轻松改变它的形状从而使其可以适应任意矩形区域，这将为电路布局带来极大便利。图
    7.6 展示了 4 种不同的可变螺旋电感的直流电感 \( L_{DC} \) 与最大品质因数 \( Q \) 随着伸缩率 \( \gamma \) 的变化情况，它们的几何参数如表
