  md: '代染色体，在此期间也能够产生一些较好的染色体性状。


    (3) 变异，通过随机选择的方法改变染色体上的遗传基因。变异本身可以被视为随机算法，严格来说，是用于生成新个体的辅助算法。


    # 4) 算法终止条件


    算法终止一般指适应度函数值的变化趋于稳定或者满足迭代终止的公式要求，也可以是迭代到指定代数后停止进化。


    # 3.3.2 粒子群算法


    群智能优化算法也属于一种生物启发式方法，主要模拟动物群集行为，群体按照一种合作的方式寻找食物，群体中的每个成员通过学习其自身的经验和其他成员的经验来不断地改变搜索的方向。群智能优化算法的突出特点就是利用种群的群体智慧进行协同搜索，从而在解空间内找到最优解。以粒子群（particle
    swarm optimization，PSO）[29, 30] 算法为例，粒子在群中的运动是由其当前位置、记忆以及群的合作或社会共识决定的。


    将优化问题定义为在一个空间 \( S \) 中寻找一个向量 \( \boldsymbol{x} \)，使空间 \( S \) 中任意的向量 \( \boldsymbol{y}
    \) 都存在 \( f(\boldsymbol{x}) < f(\boldsymbol{y}) \)，其中 \( f(\cdot) \) 是目标函数，\(
    S \subseteq R^D \) 是待搜索的 \( D \) 维空间。搜索空间 \( S \) 定义为 \( \{ \boldsymbol{y} : l_i
    \leq y_k \leq u_i \} \)，其中，\( y_k \) 是向量 \( \boldsymbol{y} \) 的第 \( k \) 个元素，\(
    u_i \) 和 \( l_i \) 是这个元素的上下边界。


    假设有一个包含 \( K > 1 \) 个粒子的种群，每个粒子由 3 个 \( D \) 维的向量所定义：


    +   (1) \( \boldsymbol{x}_t^k \) 为位置向量，表示第 \( k \) 个粒子在第 \( t \) 次迭代时的位置，而粒子的质量由这个向量确定；


    +   (2) \( \boldsymbol{v}_t^k \) 为速度向量，表示第 \( k \) 个粒子在第 \( t \) 次迭代时的方向和运动长度；


    +   (3) \( \boldsymbol{p}_t^k \) 为个人最优向量，表示第 \( k \) 个粒子在第 \( t \) 次迭代时曾经到达的最佳位置。这个向量将存储当前所获得的最佳质量解。


    对于每个粒子，每次迭代将更新以上 3 个向量。对于第 \( k \) 个粒子，第 \( (t + 1) \) 次迭代后，这 3 个向量可表示为


    ```

    \(\boldsymbol{v}_{t+1}^k = \mu \left( \boldsymbol{x}_t^k, \boldsymbol{v}_t^k,
    N_t^k \right)\) (3.24)

    ```


    ```

    \(\boldsymbol{x}_{t+1}^k = \xi \left( \boldsymbol{x}_t^k, \boldsymbol{v}_{t+1}^k
    \right)\) (3.25)

    ```


    ```

    \(\boldsymbol{p}_{t+1}^k = \begin{cases} \boldsymbol{x}_{t+1}^k, f(\boldsymbol{x}_{t+1}^k)
    < f(\boldsymbol{p}_t^k) \text{ 且 } \boldsymbol{x}_{t+1}^k \in S, \\ \boldsymbol{p}_t^k,
    \text{ 其他} \end{cases}\) (3.26)

    ```


    在式 (3.24) 中，\( N_t^k \) 表示粒子 \( k \) 的相邻集合，是粒子处于最佳位置的子集，\( N_t^k = \{ \boldsymbol{p}_i^i
    | i \in \{ T_t^k \subseteq \{ 1, 2, \cdots, K \} \} \} \)，其中，\( T_t^k \) 是粒子 \(
    k \) 在第 \( t \) 次迭代的速度更新规则相关的粒子索引集合。显然，对于不同类型的 PSO 算法，确定 \( T_t^k \) 的策'
