    t) + \sqrt{\frac{K_{\text{R}}}{K_{\text{R}}+1}} \mathbf{H}_{u,s,1}^{\text{LOS}}(t)
    \delta(\tau - \tau_1) \quad (8.4)\)

    ```


    式中，\(K_{\text{R}}\) 表示莱斯（Rice）因子，LOS 路径的信道系数定义为


    ```

    \(\mathbf{H}_{u,s,1}^{\text{LOS}}(t) = \begin{bmatrix} F_{\text{RX},u,\theta}
    (\Omega_{\text{RX,LOS}}) \\ F_{\text{RX},u,\phi} (\Omega_{\text{RX,LOS}}) \end{bmatrix}^{\text{T}}
    \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix} \begin{bmatrix} F_{\text{TX},s,\theta}
    (\Omega_{\text{TX,LOS}}) \\ F_{\text{TX},s,\phi} (\Omega_{\text{TX,LOS}}) \end{bmatrix}
    \exp \left( -\mathrm{j} 2\pi \frac{d_{3\text{D}}}{\lambda_0} \right) \times \\

    \exp \left( \mathrm{j} 2\pi \frac{\mathbf{r}_{\text{RX,LOS}}^{\text{T}} \cdot
    \mathbf{d}_{\text{RX},u}}{\lambda_0} \right) \exp \left( \mathrm{j} 2\pi \frac{\mathbf{r}_{\text{TX,LOS}}^{\text{T}}
    \cdot \mathbf{d}_{\text{TX},s}}{\lambda_0} \right) \exp \left( \mathrm{j} 2\pi
    \frac{\mathbf{r}_{\text{RX,LOS}}^{\text{T}} \cdot \mathbf{v}}{\lambda_0} t \right)
    \quad (8.5)\)

    ```


    式中，LOS 路径的到达角和离去角分别为 \(\Omega_{\text{RX,LOS}} = [\theta_{\text{LOS,ZOA}}, \phi_{\text{LOS,AOA}}]\)
    和 \(\Omega_{\text{TX,LOS}} = [\theta_{\text{LOS,ZOD}}, \phi_{\text{LOS,AOD}}]\)。


    根据几何随机信道模型中信道冲激响应的表达式不难发现，其包含天线阵列响应和空中传播信道表征两部分。其中，天线阵列响应又包含因天线旋转导致极化状态变化的影响；而空中传播信道建模则是基于多径信道的分簇特性，利用不同时空信道参数及其统计特性来表征簇内和簇间信道传播特性，描述每一条传播路径的信道参数包括时延、到达角、离去角、交叉极化比以及在动态信道条件下的多普勒频移。为了获得适用于相应频段和场景的信道参数统计结果，需要开展大量信道实测活动以刻画在实际场景下的信道特性。此外，基于射线追踪的确定性建模方法也可用于信道数据获取，作为信道实测的补充，完成在复杂应用场景下的信道建模。


    根据信道实测或射线追踪仿真结果所建立的物理统计信道模型具有以下特点：


    +   (1) 模型参数具有明确物理意义。根据大量双定向信道测量和建模结果可以发现：有效接收信号主要分布在有限的时空单元内，呈现出在时间域和空间域的聚簇现象；同时结合环境映射结果，不难发现室内建筑墙壁以及室外建筑物和树木等较大散射体更容易导致信号反射和绕射。因此，传统的物理统计信道模型是'
