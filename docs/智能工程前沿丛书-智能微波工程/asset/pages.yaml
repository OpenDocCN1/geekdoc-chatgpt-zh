  md: '# 2) 方法 2. 适用于仿真数据


    由于在射线追踪仿真中便于移除植被遮挡区以获得自由空间传播损耗，因此植被穿透损耗可以表示为存在和不存在在植被遮挡时全向路径损耗间的差值，即


    $$L_{\text{omni,v}}^{\text{Sim}} = \text{PL}_{\text{omni}} - \widetilde{\text{PL}}_{\text{omni}}$$
    (8.20)


    式中，$\text{PL}_{\text{omni}}$ ($\widetilde{\text{PL}}_{\text{omni}}$) 表示存在（不存在）植被遮挡区射线追踪仿真得到的全向路径损耗。


    # 3) 方法 3. 适用于仿真数据


    当采用与方法 1 类似的方式对仿真数据的植被穿透损耗进行定义时，在相同的角度范围 $A_v$ 内计算存在和不存在在植被遮挡的路径损耗差：


    $$L_{\text{forward,v}}^{\text{Sim}} = -10 \log_{10} \left( \sum_{\Omega_i \in
    A_v} p_i - \sum_{\tilde{\Omega}_j \in A_v} \tilde{p}_j \right)$$ (8.21)


    式中，$p_i(\tilde{p}_j)$ 表示包括（不包括）植被遮挡区仿真结果中第 $i(j)$ 条传播路径的接收功率；$\Omega_i(\tilde{\Omega}_j)$
    表示该条路径的到达角。


    ITU-R P.833-10 标准建议书给出了两种植被穿透损耗模型[162]，分别适用于收发端均位于植被覆盖区内的情况和收发端仅有一个位于植被覆盖区的情况，结合本章的研究对象以及实际非均匀植被覆盖的情况，提出了修正的
    ITU-R 植被穿透损耗模型：


    $$L_v(s) = L_1 [1 - \exp(-d_v(s) \rho_v \gamma / L_1)]$$ (8.22)


    式中，$d_v(s)$ 表示在接收机 $s$ 处植被内的传播距离；$L_1$ 表示最大植被穿透损耗衰减值（上界），它与植被的类型和覆盖密度有关；$\rho_v$
    表示在植被覆盖区域内有效植被覆盖区所占的比例，也被称为非均匀植被覆盖密度（由于植被间存在间隙所造成的），其取值范围在 $[0, 1]$；$\gamma$ 表示在单位植被传播距离内的功率衰减值，dB/m。注意到
    $d_v$ 和 $\rho_v$ 实际表示收发端之间直线传播距离和树木等植被的交线长度。根据图 8.10 中的几何关系，在植被覆盖区内穿过树木的传播距离可以计算为：


    $$d_v = \begin{cases} \frac{h_F \sqrt{d_{2D}^2 + (h_T - h_R)^2}}{h_T - h_R}, &
    \text{情况 1 (接收机位于植被覆盖区域内)} \\ \frac{d_{2D} - d_w}{\cos \theta_{\text{LoS}}} -
    \frac{h_T - h_v}{\sin \theta_{\text{LoS}}}, & \text{情况 2 (接收机位于植被覆盖区域外)} \end{cases}$$
    (8.23)


    式中，$h_T$ 和 $h_R$ 分别表示发射和接收天线高度；$h_F$ 表示树冠的高度范围差；$d_w$ 表示接收机位置相对于植被覆盖区域边缘的距离；$h_v$
    表示植被的平均高度；$\theta_{\text{LoS}} = $'
