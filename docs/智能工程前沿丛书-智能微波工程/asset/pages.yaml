  md: '# 片上螺旋电感智能设计


    无线通信和雷达等无线电系统的迅猛发展，极大推进了射频电路的研究。射频集成电路（radio frequency integrated circuit，RFIC）是无线电系统中必不可少的部件。随着频率不断升高，对
    RFIC 的性能也有越来越高的要求。如何设计低成本、小尺寸、高性能、高可靠的 RFIC 一直是学术界和工业界研究的热点。无源器件是射频电路的重要组成部分，通常无源器件的拓扑结构不固定，几何参数与其电气性能的关系不明确，这给设计带来巨大的挑战。尤其是在毫米波电路中，寄生参数效应等问题越发显著，依赖等效电路的传统设计方法已经很难适用。作为片上无源器件必不可少的元件之一，螺旋电感在混频器、振荡器、变压器等电路中起着至关重要的作用，T
    形线圈（T-coil）还可以作为宽带匹配应用到放大器、静电防护（electrostatic discharge，ESD）等电路中。高性能的片上螺旋电感对于集成电路的性能有着显著提升[116]。


    为了设计性能更好的片上螺旋电感，RFIC 设计人员也在不断探索片上螺旋电感的新结构。文献 [117] 提出一种圆角矩形电感，它具有方形电感和圆形电感的共同优点。文献
    [118] 研究了螺旋电感的各段金属宽度和间距对于电感性能的影响，实现更高的品质因数。在文献 [119] 中，将正八边形电感的斜边与直边之比加入了优化过程，进一步提高螺旋电感的性能。文献
    [120] 研究了柔性表面下电感的性能变化，使螺旋电感的设计不再局限于平面。


    以上这些研究工作为螺旋电感的设计提供新的方向。然而，上述电感结构的研究都不能脱离正多边形范畴。作为模拟电路中最大的基本元件，螺旋电感的形状极大影响电路布局。在实际的芯片设计中，可供设计的面积往往不是正多边形，如果螺旋电感的形状是可变形的，可以适应任何矩形区域，那么这会给电路布局工作带来极大的便利，从而提高空间芯片的利用率。螺旋电感器通常由许多几何参数所定义，成千上万组几何参数能同时满足设计规范和要求的寥寥无几。这种与建模相反的工作被称为综合。螺旋电感的综合一直是无源器件设计中的一个重大挑战[121-123]。在毫米波电路中，螺旋电感尺寸和布局的综合是射频集成电路设计自动化的关键。


    近几十年来，业界已经提出许多优秀的方案来优化螺旋电感器的设计，其中，文献 [124, 125] 提出了适用于更高频率的新型螺旋电感等效电路模型，并取得良好的效果；在文献
    [125-128] 中，等效电路模型与全局优化算法的结合使得螺旋'
