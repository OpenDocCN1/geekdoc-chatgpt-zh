- pgno: 52
  md: '较高的优化效率和全波仿真较高的计算准确度。优化初期，首先采用全波仿真获得相对较小的数据样本集（初始样本集），然后利用机器学习方法在初始样本集基础上建立相对粗糙的代理模型，进一步通过优化算法得到初步的最优解，经全波仿真后将高保真度的仿真数据加入训练集，重新更新代理模型。随着验证迭代过程的进行，机器学习所需的数据样本集中的全波仿真数据增加，代理模型的准确度逐渐获得提升，从而获取更好的最优解。


    优化流程框图如图 3.1(a) 所示。其中，关键步骤包括：


    +   1) 初始化训练集


    利用拉丁超立方采样 (Latin hypercube sampling, LHS) 或其他随机采样方法在预先设定的参数空间 [Xmin, ⋯ , Xmax]^n
    中抽取的 a 个采样点，参数化建模将采样数据输出到已有的物理模型，根据参数调整物理模型，进行全波仿真并返回仿真结果。也可以选择是否提取特征维度以扩充用于训练的数据点数。图
    3.2(a) 给出初始化训练集模块的数据流图。


    ![](img/cf98602880e9fcdd502be0d0247f6934_52_0.png)'
