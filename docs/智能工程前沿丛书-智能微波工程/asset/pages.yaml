  md: '# 绪 论


    无线电频谱涵盖 3Hz~3THz，国际电信联盟 (ITU) 和国际电气电子工程师学会 (IEEE) 的频段分配如表 1.1 所示[1]。射频 (radio
    frequency, RF) 是指在无线电频谱中的交变电流信号。无线电波是频率处于在 RF 频率范围内的电磁波。微波的频率范围是 300MHz~300GHz，对应的电磁波波长为
    10cm~1mm，其中波长为毫米量级的无线电信号称为毫米波，对应的频率范围是 30GHz~300GHz*。无线移动通信、雷达等无线电系统的工作频率基本上都落在微波频段。微波工程是无线移动通信、雷达等无线电系统的核心关键技术，也是微波集成电路、高速数字集成电路的基础技术。它涵盖了微波的产生、变换、发射、传播、接收、处理等多个方面。


    # 表 1.1 无线电频谱分段表


    | ITU 频段分配 | IEEE 频段分配 | 频率范围 |

    |---|---|---|

    | 1 | 极低频 (extremely low frequency, ELF) | 3~30Hz |

    | 2 | 超低频 (super low frequency, SLF) | 30~300Hz |

    | 3 | 特低频 (ultra low frequency, ULF) | 300Hz~3kHz |

    | 4 | 甚低频 ( very low frequency, VLF) | 3kHz~30kHz |

    | 5 | 低频 ( low frequency, LF) | 30kHz~300kHz |

    | 6 | 中频 (medium frequency, MF) | 300kHz~3MHz |

    | 7 | 高频 (high frequency, HF) | 3MHz~30MHz |

    | 8 | 甚高频 (very high frequency, VHF) | 30MHz~300MHz |

    | 9 | 特高频 (ultra high frequency, UHF) | 300MHz~3GHz |

    | 10 | 超高频 (super high frequency, SHF) | 3GHz~30GHz |

    | 11 | 极高频 (extremely high frequency, EHF) | 30GHz~300GHz |

    | 12 | 超极高频 (tremendously high frequency, THF) | 300GHz~3THz |


    微波工程的理论基础是电磁学，而电磁学的核心毫无疑问是麦克斯韦方程组[2]。该方程组是由英国物理学家詹姆斯·麦克斯韦在 19 世纪建立的一组描述电场、磁场与电荷密度、电流密度之间关系的偏微分方程。它由
    4 个方程组成，分别是：描述电荷如何产生电场的高斯定律；论述磁单极子不存在的高斯磁定律；描述电流与时变电场怎样产生磁场的麦克斯韦-安培定律；描述时变磁场如何产生电场的法拉第感应定律。赫兹在
    1887 年至 1891 年期间进行的一系列实验证实了麦克斯韦的电磁波理论。


    * 2018 年, IEEE 更新了频率范围的定义和频段分配表，射频的频率范围涵盖整个无线电，微波是射频的其中一部分。'
