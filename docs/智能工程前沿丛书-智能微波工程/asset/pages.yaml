    # 图 7.10 ASSI-HKDT 算法的自动化框架


    图 7.11 展示了 ASSI-HKDT 算法的整个流程，下面分步阐述：


    步骤 1. 初始化。这一步需要设置所使用的芯片工艺、所用到的金属层。除此以外，还需要输入期望的电感性能以及电感的几何参数约束，包括最大外部宽度 $D_{outwm}$、最大外部高度
    $D_{outhm}$、最大线宽 $W_{max}$、最小线宽 $W_{min}$、最大间距 $S_{max}$、最小间距 $S_{min}$、最大圈数 $N_{max}$、最小圈数
    $N_{min}$、最大伸缩率 $\gamma_{max}$ 和最小伸缩率 $\gamma_{min}$。最后，还可以选择是否最大化品质因数、是否最小化面积等。


    步骤 2. 采集初始样本。在设置的约束范围内使用拉丁超立方采集一定数量的螺旋电感几何参数作为初始样本，包括 $W_{max}$、$W_{min}$、$S$、$N$、$\gamma$
    以及 $D_{inw}$，所采集的初始样本参数必须满足 $W_{max} > W_{min}$，$D_{outw} < D_{outwm}$，$D_{outh}
    < D_{outhm}$。除此之外，为了给全局优化更好的起始点，一部分初始样本还需满足拓展 Wheeler 公式约束，即


    ```

    $$\frac{|L_E - L_{goal}|}{L_{goal}} < \varepsilon$$ (7.16)

    ```


    式中，$L_E$ 为式 (7.10) 计算得到的直流电感值，由于计算的直流电感值并不精确，因此需要设置容差 $\varepsilon$。生成几何参数后会进行自动建模、自动仿真，最后返回初始样本的
    $Y$ 参数，由式 (7.17) 和式 (7.18) 分别计算样本的电感值和品质因数：


    ```

    $$L = \frac{\text{imag}\left(\frac{1}{Y_{11}}\right)}{\omega}$$ (7.17)

    ```'
