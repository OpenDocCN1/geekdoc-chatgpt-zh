  md: '始簇心选取方法和传统随机选取核心方法分簇迭代次数的差异。不难发现，由于考虑了簇心在功率、时延和角度上的特征，经过初始簇心选取后得到的结果与真实加权簇心的结果较为接近，相比随机簇心选取方法，在初始簇数较少（<6）时算法迭代收敛次数明显小于随机选取的方法，实现近似
    2 倍迭代次数的降低。当初始簇数较大（>6）时，随机选取的方法则会优于本节所提出的初始簇心选取方法，主要原因是当初始簇数较大并且超过真实簇数时，采用本节所提出的初始簇心选取方法估计得到的初始簇心将会在时间域或空间域重叠，相比随机选取方法其在时间和空间的隔离度会降低，进而需要更多的迭代次数才能实现分簇结果收敛。然而对毫米波信道而言，真实的物理可分辨多径簇数较少，并且需要经过两次分簇才能获得最佳分簇结果，因此每次分簇只需在较小的簇数范围内进行分簇性能比较，可以充分发挥算法
    8.1 的优势，相比传统随机簇心选取方法，初始簇心选取方法在保证分簇结果准确性的同时其分簇效率得到提升。


    # 算法 8.1 初始簇心 \(\mathcal{I} = \{ \mathbf{c}_n^{(0)} \}\) 选取算法


    ```

    Input: \(\mathcal{A} = \{ \mathbf{m}_l \}, l=1, 2, \cdots, L, \mathbf{m}_l = [p_l,
    \tau_l, \theta_{\text{TX},l}, \phi_{\text{TX},l}, \theta_{\text{RX},l}, \phi_{\text{RX},l}]\)

    Output: \(K\) 个初始簇心集合: \(\mathcal{I} = \{ \mathbf{c}_1^{(0)}, \mathbf{c}_2^{(0)},
    \cdots, \mathbf{c}_K^{(0)} \}\)

    1: 根据式 (8.16) 计算相异度矩阵 \(\mathbf{S}\)

    2: repeat

    3: 计算 \((x, y) = \arg \max_{i,j} s_{ij}, i, j \in [1, 2, \cdots, L]\)，其中 \(x\)
    和 \(y\) 表示最大的 \(s_{ij}\) 所对应的 MPC 编号

    4: if \(\mathbf{m}_q \notin \mathcal{I}, q = [x, y]\) then

    5: 将 \(\mathbf{m}_q\) 加入 \(\mathcal{I}\)，即 \(\mathbf{c}_n^{(0)} = \mathbf{m}_q\)

    6: \(n + 1 \leftarrow n\)

    7: end if

    8: until \(n = K\)

    ```


    ![](img/cf98602880e9fcdd502be0d0247f6934_176_0.png)


    # 图 8.2 采用不同初始簇心选取方法对分簇迭代次数的影响'
