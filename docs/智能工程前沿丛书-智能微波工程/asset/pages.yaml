- pgno: 172
  md: '建立在信道分簇传播特性基础上的，当电磁波与环境散射体发生相互作用后形成相应的多径散射簇，通过对簇间（全向）信道和簇内信道的子径进行参数化统计建模，可以表征其在空间和时间上的传播特性。


    (2) 模型对场景的泛化能力较弱。根据所建立的参数化物理统计信道模型生成信道冲激响应时，需要根据不同应用场景调整相应信道参数的统计结果。标准化信道模型中往往只针对某一类场景（如城市宏蜂窝和微蜂窝场景等）定义相应的参数，然而大量在同类场景不同传播环境下的信道建模结果表明，由于传播环境中散射体发生变化导致簇间和簇内信道参数呈现较大差异。因此，信道建模结果往往难以应用于多种复杂传播场景，泛化能力较弱。此外，不同类型的多径簇内信道特性差异较大，然而现有模型并未对不同多径簇的簇内信道参数进行区分（均采用统一的统计建模结果），进而无法准确刻画相应传播环境下的信道特性。


    (3) 模型对系统配置变化不敏感。系统配置包括收发天线高度、俯仰角以及收发信机位置等信息。传统物理统计信道模型只考虑系统配置对于大尺度路径损耗的影响，并未研究小尺度信道特性随收发信机和环境散射体相对位置间的变化关系。特别是对于复杂的室外和高速移动传播环境，随着接收机位置不断远离发射机，由于接收机周围的环境散射体发生明显变化，进而需要对位置相关的信道特性进行建模。然而，传统物理统计模型无法包含因收发信机和环境散射体相对位置发生变化导致的信道传播特性变化。


    (4) 模型的准确性与参数估计算法性能密切相关。物理统计模型需要从信道实测和仿真结果中提取有效信道参数，并完成多径分簇。信道多径分量的估计结果往往可以和原始测量结果直接进行比较验证，但多径分簇结果缺乏统一的评价标准。通常采用不同的分簇算法以及分簇结果评价指标，将导致分簇结果呈现巨大差异，其中簇数、\(K_R\)
    因子等簇间参数的建模结果差异不大，而簇内空时信道色散参数则与分簇算法的性能密切相关。因此，分簇算法的效果将会影响物理统计信道模型的准确性。


    综上所述，传统基于几何随机模型的物理信道模型在建模准确性、模型复杂度和场景通用性方面存在一定的缺陷。而未来 5G/6G 无线通信系统将呈现多频共存、网络致密化等特点，特别是毫米波、太赫兹通信其信号传播更容易受环境散射体的影响，传统的物理信道模型往往无法满足不同应用场景下系统设计和方案验证需求。考虑到机器学习算法与无线通信领域的结合将在未来移动通信研究中发挥巨大作用，因此，亟须建立统一的机器学习辅助信道建模框架。相比传统物理统计信道模型，机器学习辅助的信道模型可以表征信道特征随收发信机相对位置变化的关系，提高模型的通用性和对场景的泛化能力，加快信道仿真效率，服务于未来无线网络规划和设计。'
  merge: -1
