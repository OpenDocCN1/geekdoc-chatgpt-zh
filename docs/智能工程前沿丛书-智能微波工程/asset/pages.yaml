  md: '过随机算法生成 10 组微带天线阵列并进行全波仿真建立用以验证的数据集。采用 RMSE 来评估 ABEM 和 HKDT 算法所构建的机器学习模型的预测性能。可以很明显地看出，相比于
    ABEM，HKDT 在预测精度和算法效率上都具有明显的优势：与未经数据稀释的 ABEM 相比，HKDT 可以带来 100~1000 倍的训练和预测的速度优势；在此实例中，ABEM
    需要将数据稀释 50 倍以实现和 HKDT 类似的计算效率，但会因此带来明显的预测精度的恶化。更重要的是，即使与未经数据稀释的 ABEM 算法（即 ABEM
    算法的性能极限）相比，HKDT 仍然可以获得更优秀的预测精度表现。这意味着 HKDT 算法可以更好地学习不同 ABE 对应的 AEP 的辐射特征。


    相较于一维的线阵设计问题，二维的面阵设计更难直接采用 ABEM 进行解决。考虑一个如图 5.9(b) 所示的 10 阵元的平面微带天线阵列，首先通过随机算法生成
    100 组微带天线面阵，并利用全波仿真建立数据集。图 5.11 给出 100 个随机采样生成的 ABE 经平面虚拟子阵拟合 (\( P=Q=5 \)) 后得到的子阵的幅度和相位激励数据。可以看出，拟合后位于虚拟子阵的中心阵元（即与所关注的
