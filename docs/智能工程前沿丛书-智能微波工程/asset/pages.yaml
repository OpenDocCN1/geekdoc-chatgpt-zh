    # 6.2.2 超立方体搜索问题的数学表示


    考虑一系列自变量个数为 \( P \) 的函数 \( y_q(x) \)


    \( y_q(x) = y_q(x_1, x_2, \cdots, x_P), \quad q = 1, \cdots, Q \tag{6.1} \)


    在天线射频设计问题中，\( x \) 代表其设计参数，而 \( y_q(x) \) 代表相应的性能响应。定义设计参数的不确定性为天线射频设计的输入容差：


    \( \delta \equiv [\delta_1, \cdots, \delta_P]^\mathrm{T}, \quad \delta_p \geqslant
    0 \tag{6.2} \)


    可得自变量的输入容差范围为


    \( \omega_{x, \delta} \equiv \{t | (x_p - \delta_p \leqslant t_p \leqslant x_p
    + \delta_p, p \in \mathbb{P}) \} \tag{6.3} \)


    式中，\( t \) 代表潜在的设计参数值。定义 WCP 为响应与最优点处偏差最大的设计点 \( \hat{x} \) 处的响应值，即


    \( F_q(\hat{x}) \triangleq \max_{\hat{x} \in \omega_{x, \delta}} f_q(\hat{x})
    \tag{6.4} \)


    对于 \( Q > 1 \) 的情况，由于存在多个设计目标，因此在设计空间内可能存在多个 WCP 对应的设计点。将这些 WCP 值及其对应的设计点的集合定义为
    \( F(x) \)，用寻找 \( F(x) \) 的方法构成天线射频鲁棒性设计的基础。在给定输入容差范围 (input tolerance region,
    ITR) 的情况下，设计者通常需要引入某种全局优化方法，以期实现可靠的 WCP 搜索 [105]。


    对一个给定的设计点 \( x \)，其 ITR，即设计参数的不确定性可以被建模为一个超立方体 \( \delta(x) \)，其特征可以被定义为其不确定性的累积，即


    \( T_{\text{ITR,peak}}(x) = \prod_{p=1}^P \delta(x) \tag{6.5} \)


    或其不确定性的最小值，即


    \( T_{\text{ITR,min}}(x) = \min \delta(x) \tag{6.6} \)


    用以代表该设计点 \( x \) 的鲁棒性特征。对这两种定义而言，更大的 \( T_{\text{ITR}} \) 即意味着更优越的鲁棒特性。


    相对于 WCA，另一个在天线的鲁棒设计中的重要任务是在输出容差范围 (output tolerance region, OTR) 已知的情况下，确定给定设计点的最大的
    \( T_{\text{ITR}} \)，'
