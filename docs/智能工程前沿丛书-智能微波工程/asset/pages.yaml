    # 8.2 基于人工神经网络的预测性信道建模


    8.1 节介绍了受到标准化组织广泛关注的几何随机信道模型，有助于了解如何从真实物理传播信道抽象得到相应的数学表征模型。同时，考虑到传统物理信道模型的不足，考虑引入机器学习来提高信道模型的准确性和通用性。本节首先总结目前基于人工神经网络的预测性信道建模研究现状，讨论现有纯数据驱动的智能信道模型在模型可解释性和通用性方面所面临的需求和挑战，然后给出知识和数据混合驱动的智能信道建模框架。通过引入物理统计信道模型的先验知识，建立不同预测器和基于多径簇信道模型之间的映射关系，提高智能信道模型对不同场景信道特性预测结果的准确性。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 8.2.1 纯数据驱动的信道模型


    考虑到传统过于理想化的单斜率或双斜率分段路径损耗模型对实测路径损耗结果拟合效果较差[148-150]，路径损耗除了与收发信机之间的直线传播距离有关，还受到收发信机间相对位置和环境散射体变化的影响。因此，机器学习与无线信道建模研究相结合在早期主要应用于预测大尺度路径损耗[151-153]，并将预测结果用于链路预算和无线网络覆盖性能分析等。随着研究的不断深入，研究人员期望利用机器学习进一步预测无线信道的小尺度衰落特性，实现完整的信道预测和仿真建模。


    目前，机器学习在信道建模研究中的应用主要包括两类：信道回放和信道预测建模。信道回放主要用于重现信道实测数据，用于分析在真实信道条件下系统传输和覆盖性能。考虑到信道测量系统的构建成本较高，因此难以广泛开展信道实测，同时过于理想化的信道假设条件和随机化信道仿真结果容易造成在实际网络部署中系统无法满足应用需求。因此，需要重现信道实测数据，而较大的数据量和不同的数据接口使得其他研究人员难以直接应用相关结果。因此，文献
    [11] 提出了一种机器学习使能的信道回放模型，其沿用图 8.1 给出的信道生成流程，利用人工神经网络（artificial neural network，ANN）分别重构了毫米波信道的大尺度和小尺度信道参数，ANN
    的输入包括收发信机位置坐标和频率等，输出为信号接收功率和每一条子径的幅度、时延、角度信息等。模型输出结果与原始信道实测结果具有较好的一致性，并且相比于采用
    QuaDriGa 信道仿真器在同样信道统计参数情况下生成结果，更能客观反映实际传播环境下的信道响应。对于信道预测建模，由于信道实测需要消耗大量资金以及人工和时间成本，往往很难在关注的应用场景和频段开展信道测量，并建模相应信道参数的统计分布，因此期望通过机器学习从有限的信道实测数据中挖掘信道参数随频率、场景等因素的变化关系，进而预测不同场景和频率下的信道特性参数。文献
    [12] 中利用毫米波多频信道实测和射线追踪仿真数据训练 ANN，其输入包括收发信机位置坐标、传播距离和系统工作频率，输出则是全向信道的接收功率、时延扩展和角度扩展。利用训练好的神经网络可预测不同频段和收发信机位置的信道特征参数。文献
    [154] 是在文献 [12] 的基础上，使用卷积神经网络等更复杂的神经网络架构，以提高信道特性预测结果的准确性。然而，这些建模方法的缺点也较为显著，只适用于训练数据所对应的特定场景，并未对比在新场景（信道数据均未用于模型训练）下信道参数的预测结果，模型的通用性差且无法灵活迁移到多个场景；同时，由于缺乏对物理多径簇等精细化信道特性的建模，ANN
    预测结果往往只包含全向信道信息。


    综上所述，采用纯数据驱动的智能信道建模研究仍面临着如下挑战：'
  merge: -1
  img_proc: true
- pgno: 180
  md: '(1) 提高模型准确性需要大量数据集和复杂的预测器。为了保证所构建的模型能够应用于不同场景，需要在不同应用场景采集大量信道实测或仿真数据用于模型训练，由于不同场景的信道特性差异较大，为了保证数据驱动的模型训练结果具有较低的误差，需要采用复杂度更高、神经网络结构更复杂的预测器进行信道参数预测。


    (2) 缺乏对预测模型的物理解释和细节特征表征。目前的智能信道模型的输入信息包括收发信机的位置信息和传输距离，而输出信息包括相应的信道参数（路径损耗、全向信道时延扩展和角度扩展等）或子径特征信息（时延、幅度、到达角和离去角等），并不是从多径分簇物理信道模型的物理传播基础出发，而是单纯考虑输入和输出参数关系。


    因此，机器学习使能的信道建模研究需要从无线信道的物理传播特性出发，通过考虑实际物理信道的传播规律，引入物理统计信道模型的先验知识，再结合相关的机器学习算法，在提高建模结果准确性的同时提高模型对场景和频率等的泛化能力。


    # 8.2.2 知识和数据混合驱动的信道模型


    室内外环境无线信道测量和建模结果表明：不同环境下全向信道空时色散特性和多径簇数的差异主要由环境散射体的丰富程度决定，而簇内信道特性则和相对应的散射体和传播机制有关[155-157]。例如，在密集城区场景，除了直射径以外，主要以建筑物外表面反射、建筑屋顶或侧边绕射多径簇为主[147]；对于郊区植被覆盖区场景，植被散射簇占主要部分，少量来自周边低矮建筑物的反射簇[158]；对于室内场景，多径簇主要来自墙壁的反射[159]。根据基本的电波传播规律，在相同的系统配置下，同类型散射体对应的多径簇内信道将呈现相近的空时色散特性；而不同应用场景的物理信道则是将不同类型散射体所对应的多径簇进行排列组合得到。因此，基于电波传播的这个机理，我们在文献[13]中提出了知识和数据混合驱动的智能信道建模方法。


    图 8.4 给出机器学习辅助的智能信道建模框架。基于传统物理统计信道模型进行信道仿真时，首先根据大尺度路径损耗模型得到接收信号功率，然后生成每一个簇的簇心特征参数，最后根据簇内信道特性生成所有子径的信道信息。当收发链路间存在树木等低穿透损耗障碍物遮挡时，需要在以上步骤完成后，根据障碍物建模结果，再额外增加相应的步骤调整已生成的
    MPC 特征参数[143]。为了实现对不同类型簇内信道特性的区分，同时避免额外的障碍物建模等步骤，图 8.4 所示的建模方法中首先根据物理统计信道模型生成簇间信道参数，包括簇数和每一个簇的簇心特征参数，用来标识每一个簇的“位置”，同时需要指定每一个簇所对应的散射体类型及其相应的物理特征参数。针对不同类型的多径簇则调用相应的'
