    # 2.1.4 微波网络分析


    微波网络是由有限多个元件相互连接组成的一种结构，它包含有限个端口，可在端口处测量电压、电流，并能够将电磁能量输入或输出。网络元件包括诸如电阻、电容、电感、变压器等实际器件的理想化模型，而且服从诸如电压、电流等物理量的有关定律。端口概念的基本点是假设流进端口一个端子的瞬时电流与输出端口另一个端子的瞬时电流总是相等的。如图
    2.8 所示，有 N 个这种外接端口的网络称为 N 端口网络。该网络包含 N 个端口电压与 N 个端口电流，共计 2N 个变量。可以取任意 N 个变量作为激励，其余
    N 个作为响应。对于一个线性、时恒的 N 端口网络，其端口特性完全可以用端口电压与端口电流之间的关系来表征。根据激励变量和响应变量选择方式的不同，可以有各种矩阵描述方法，下面简要介绍阻抗矩阵、导纳矩阵、混合矩阵以及散射矩阵[16]。


    ![](img/cf98602880e9fcdd502be0d0247f6934_26_1.png)


    图 2.8 N 端口网络'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1. 阻抗矩阵


    假设端口电流是激励，端口电压为响应。于是，把端口电压 \(\boldsymbol{v}(t)\) 的拉普拉斯变换 \(\boldsymbol{V}(s)\)
    与端口电流 \(\boldsymbol{i}(t)\) 的拉普拉斯变换 \(\boldsymbol{I}(s)\) 联系起来的矩阵 \(\boldsymbol{Z}(s)\)
    就被称为 \(N\) 端口网络的开路阻抗矩阵，简称阻抗矩阵，即


    \(\boldsymbol{V}(s) = \boldsymbol{Z}(s)\boldsymbol{I}(s)\) (2.1)


    \(\boldsymbol{Z}(s)\) 的元素就是开路阻抗参数，其第 \(j\) 行，第 \(k\) 列元素 \(z_{jk}\) 可以解释为


    \(z_{jk} = \frac{V_j}{I_k} \Big|_{I_x=0, x \neq k}\) (2.2)


    式中，\(V_j\) 与 \(I_k\) 分别表示端口电压 \(v_j(t)\) 和端口电流 \(i_k(t)\) 的拉普拉斯变换。式 (2.2) 表示除第
    \(k\) 个端口外，所有端口都为开路时的转移阻抗。


    # 2. 导纳矩阵


    假设端口电压是激励，端口电流为响应，于是，把端口电流 \(\boldsymbol{i}(t)\) 的拉普拉斯变换 \(\boldsymbol{I}(s)\)
    与端口电压 \(\boldsymbol{v}(t)\) 的拉普拉斯变换 \(\boldsymbol{V}(s)\) 联系起来的矩阵 \(\boldsymbol{Y}(s)\)
    就被称为 \(N\) 端口网络的短路导纳矩阵，简称导纳矩阵，即


    \(\boldsymbol{I}(s) = \boldsymbol{Y}(s)\boldsymbol{V}(s)\) (2.3)


    \(\boldsymbol{Y}(s)\) 的元素就是短路导纳参数，其第 \(j\) 行，第 \(k\) 列元素 \(y_{jk}\) 可以解释为


    \(y_{jk} = \frac{I_j}{V_k} \Big|_{V_x=0, x \neq k}\) (2.4)


    式中，\(I_j\) 与 \(V_k\) 分别表示端口电流 \(i_j(t)\) 和端口电压 \(v_k(t)\) 的拉普拉斯变换。式 (2.4) 表示除第
    \(k\) 个端口外，所有端口都为短路时的转移导纳。显然，若 \(\boldsymbol{Z}(s)\) 为非奇异矩阵，则


    \(\boldsymbol{Y}(s) = \boldsymbol{Z}^{-1}(s)\) (2.5)


    # 3. 混合矩阵


    混合矩阵是阻抗矩阵和导纳矩阵的推广。激励变量既可以是端口电流，也可以是端口电压，响应则是其余端口的电压或电流。依据变量选择选取方式的不同，存在多种可能性，以二端口网络为例，则有以下关系


    \(\begin{bmatrix} V_1 \\ I_2 \end{bmatrix} = \begin{bmatrix} h_{11} & h_{12} \\
    h_{21} & h_{22} \end{bmatrix} \begin{bmatrix} I_1 \\ V_2 \end{bmatrix} = \boldsymbol{H}
    \begin{bmatrix} I_1 \\ V_2 \end{bmatrix}\) (2.6)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '该系数矩阵称为混合矩阵 \( H \)，其元素称为混合参数。同前面一样，混合参数可用以下关系决定：


    \[ h_{11} = \frac{V_1}{I_1}|_{V_2=0}, h_{12} = \frac{V_1}{V_2}|_{I_1=0}, \\ h_{21}
    = \frac{I_2}{I_1}|_{V_2=0}, h_{22} = \frac{I_2}{V_2}|_{I_1=0} \] (2.7)


    特别的，当混合变量为以下类型时


    \[ \begin{bmatrix} V_1 \\ I_1 \end{bmatrix} = \begin{bmatrix} A & B \\ C & D \end{bmatrix}
    \begin{bmatrix} V_2 \\ -I_2 \end{bmatrix} = T \begin{bmatrix} V_2 \\ -I_2 \end{bmatrix}
    \] (2.8)


    它的系数矩阵被称为传输矩阵 \( T \)，其元素为传输参数，又称为 \( ABCD \) 参数。


    # 4. 散射矩阵


    在微波频段，电压和电流已经失去明确的物理意义，难以直接测量，且开路和短路时在高频的情况下难以实现，导致 \( Z \) 和 \( Y \) 矩阵难以获得，因此，有必要引入散射参数。散射参数是由网络各端口的入射电压波
    \( a \) 和出射电压波 \( b \) 来描述网络特性的波矩阵，它的激励为各端口的归一化入射波 \( a_i \)，响应为各端口的归一化出射波 \(
    b_i \)，则线性 \( N \) 端口的微波网络散射矩阵方程为


    \[ b = Sa \] (2.9)


    \( S \) 的元素即为散射参数，其第 \( j \) 行，第 \( k \) 列元素 \( S_{jk} \) 可以解释为


    \[ S_{jk} = \frac{b_j}{a_k}|_{a_x=0, x \neq k} \] (2.10)


    式 (2.10) 表示除第 \( k \) 个端口外，所有端口入射波为 0 时的散射参数，它要求该端口无源且完全匹配。


    # 2.1.5 阻抗匹配


    # 1. 基本概念


    信号在传输过程中，为实现信号的无反射传输或最大功率传输，要求电路连接实现阻抗匹配。阻抗匹配关系着系统的整体性能，实现阻抗匹配可使系统性能达到最优。阻抗匹配应用范围广泛，常见于各级放大电路之间、放大电路与负载之间、信号与传输电路之间、微波电路与系统的设计中，无论是有源还是无源，都必须考虑阻抗匹配问题，根本原因是在低频电路中仅考虑电压与电流，而在高频'
  merge: -1
  img_proc: true
- pgno: 29
  md: '电路中信号是以波的形式传播，如果器件之间不匹配，就会产生严重的信号反射，导致仪器和设备损坏。


    阻抗匹配的通常做法是在信号源和负载之间插入一个无源网络，使负载阻抗与源阻抗共轭匹配，该网络则被称为匹配网络。阻抗匹配的主要作用有以下 5 个方面：


    +   (1) 从信号源到器件、从器件到负载或器件之间功率传输最大；


    +   (2) 提高接收机灵敏度（如低噪声放大器的前级匹配）；


    +   (3) 减小功率分配网络幅相不平衡度；


    +   (4) 获得放大器理想的增益、输出功率（功率放大器的输出匹配）、效率和动态范围；


    +   (5) 减小馈线中的功率损耗。


    在阻抗匹配的设计方法中，思路最简单的是解析法，即通过建立阻抗变换的关系式，最终求解所需要的电容和电感。这个方法的缺点是计算量较大，当匹配元件增多时，需要计算机辅助计算。使用谐振法设计阻抗匹配电路时，将输入阻抗（呈电感性）由串联电路转换为并联电路，再并联一个电容性元件和等效的并联电感产生谐振，然后交替用串联电感和并联电容形成低通滤波结构。通过这种方式，输入阻抗的实部逐步提高，直至变换到系统标准阻抗。在高频情况下，集总电感元件的寄生效应突出，分布参数不稳定，较少被使用。此时微带线以其特有的分布参数稳定、结构简单的特点，广泛应用在射频电路的设计中。根据微带线的特性阻抗和电长度可计算出实际微带线的长度和宽度。


    # 2. 宽带匹配


    宽带匹配问题是通信、雷达和其他电子系统中经常遇到的一个关于功率传输的基本问题。宽带匹配在网络综合，特别是在微波宽带晶体管与场效应管放大器的设计中得到广泛应用，它所需要解决的问题是设计信号源与负载之间的连接网络使信号源传给负载的功率在给定的频带内保持相对稳定，且尽可能达到最大。


    宽带匹配理论最早是由波特（Bode H W）在 1945 年提出 [17]，他当时研究的是一类很有用，且仅限于由电容和电阻并联组成的负载阻抗，应用环路积分方法解决了电阻和电容并联负载的宽带匹配问题，证明它总是小于或至多等于由负载时间常数所决定的一个常数，但他没有进一步研究对无耗匹配网络附加的限制条件。1950
    年，范罗（Fano R M）对这个问题进行更一般性的研究 [18]，解决了任意无源负载与电阻性信号源之间的阻抗匹配问题，不仅给出了在任意无源负载情况下的增益带宽极限，而且还推导出负载对匹配网络可实现性的一组带有适当加权函数的积分约束条件。范罗的方法在
    1961 年被菲尔德推广到信号源内阻是复数阻抗（只有虚轴传输零点）的情况。与此同时，电路理论获得重大进步，其中之一'
  merge: -1
  img_proc: true
- pgno: 30
  md: '便是将散射概念引入电路理论中，1963 年著名电路理论家尤拉（Youla D A）通过引入有界实散射参量的概念发展了范罗的研究成果[19]，创立了新的宽带匹配理论，尤拉的方法不仅将范罗方法中的积分约束方程简化为代数方程，而且能处理范罗方法难以处理的有源负载问题。这对当时解决隧道二极管放大器的设计问题起了重要作用。随后范罗与尤拉的方法得到发展和广泛应用。在
    20 世纪 70 年代又有不少的电路理论工作者对尤拉理论进行扩充，其中包括美国伊利诺大学著名电路理论家陈惠开教授，他不仅对许多特定的负载推导出匹配网络元件的解析式（包括低通型和带通匹配网络），而且还在
    1976 年出版了第一部关于宽带匹配网络理论的专著[16]，系统阐述这一理论和方法，并论述了该理论对有源负载的应用。


    基于尤拉方法的宽带匹配的解析理论对增益带宽约束有严谨和明晰的表达，能够对一般不是很复杂的负载得出闭合形式的解。但是，这种理论和方法在实际应用上还存在一些不足。首先，该理论需要预先假定一个功率增益函数，但是对于某一特定的问题，如何保证所假设的增益函数是最优的这个问题尚未完全解决，因此根据所假定的功率增益函数设计出的系统，有可能难以取得最佳的功率传输特性。其次，终端（源和负载）的特性需要用解析的形式给出，但在工程应用中，特别是在微波波段的宽带匹配问题中则不易实现，因而仍需采用逼近方法根据测量数据求得解析式。此外，负载函数和功率增益函数都需要以一种较为复杂的方式加以处理，例如，负载函数在每个传输零点处作洛朗级数（Laurent
    series）展开，反射系统的最小相位分解等，这种处理计算工作量大，若采用计算机则需要较多的人工干预。特别是当负载函数较为复杂和双匹配问题时尤其如此。最后，匹配网络的综合往往含有如理想变压器、达林顿晶体管[20]这类互感元件，在实现时尚需进一步逼近。


    针对上述问题，在 20 世纪 60 年代中期，宽带匹配的数值方法得到发展。与解析理论相比，宽带匹配的数值方法更切合实际应用，它不仅能直接用于宽带匹配网络的计算机辅助设计，而且能解决解析方法中遇到的难题。目前宽带匹配的数值方法获得实际应用的主要有
    3 种：


    +   1) 直接优化法


    该方法在预设的网络拓扑中将增益直接表示为元件值的函数进行优化，网络拓扑的假定需要由设计者根据其经验确定，因而不可避免地带有盲目性，同时可能使所求得的设计是局部最优的，这也是直接优化法最主要的缺点。


    +   2) 实频数据法


    该方法是由美国康奈尔大学著名电路理论家卡林（Carlin）教授针对直接优化法的缺陷而提出的[21]。在实频数据法中，待设计的匹配网络先用其转移函数（阻抗或导纳，视具体终端特性而定）表示，而整个系统的实频数据则以简单的函数形式显示。对这个未知的转移函数优化增益，便可得出相应于最优功率增益特性'
  merge: -1
  img_proc: true
- pgno: 31
  md: '的设计。在综合匹配网络时，采用某种选定的结构不再构成一种对搜索最优设计的约束，因此可以选择便于工程实现的网络拓扑。1983 年卡林在单匹配的基础上，又提出双匹配解析理论和实频数据法[22]。


    +   3) 预定增益倾斜补偿法


    该方法实质上就是上述两种方法的一种组合，主要用于有源的宽带匹配。


    # 2.2 天线与阵列


    德国卡尔斯鲁厄理工学院的赫兹 (Hertz) 教授于 1886 建立了第一个天线系统。自此之后，天线作为无线电系统最重要的组成部分之一，在国防、生产、生活中的应用广泛，重要程度与日俱增。以无线移动通信为例，在通信链路的一端，发射天线将传输线上的信号转换为电磁波，并将其发射到自由空间中；而在通信链路的另一端，接收天线收集入射到它上面的电磁波并将其重新转换为传输线上的信号。严格地说，天线可以被定义为一种附有导行波与自由空间波相互转换区域的结构。


    天线的工作机理是基于由加 (或减) 速电荷产生辐射，其基本方程为


    ```

    \(\dot{I}L = Q\dot{v}\) (2.11)

    ```


    式中，\(\dot{I}\) 为时变电流；\(L\) 为电流元的长度；\(Q\) 为电荷；\(\dot{v}\) 为速度的时间变化率。


    研究天线的观点可以分为频域和时域两种。频域观点采用没有特定起止时间的正弦波作为激励分析天线的工作过程，得到的是天线的“时间平均特性”；时域观点则采用具有特定起止时间、持续时间有限的瞬态信号来激励天线，得到的是天线的“时变工作特性”。本节将主要介绍天线的基本概念，包括其在不同场合下的定义以及用以表征其特性的参数；在此基础上，还将描述天线阵列的定义，为后续引入人工智能优化算法，实现天线及阵列的高效设计与快速优化提供理论基础。


    # 2.2.1 天线


    经典的观点是将天线视为一个传输线与电磁波之间的转换器，并采用包括增益、辐射波瓣图、极化方式、带宽、色散、匹配等特性参数向其他的射频前端设备 (发射机或接收机)
    描述天线的特性。其中，天线的辐射波瓣图被用来描述天线的辐射场或功率 (正比于辐射场的平方) 作为球坐标 (\(\theta\) 和 \(\phi\)) 函数的三维量。通常将辐射波瓣图中最大辐射方向上的波瓣称为主瓣，其相反方向上的波瓣称为后瓣，其他波瓣称为旁瓣。通常采用两组参数以完整表示天线的辐射波瓣图，即
    (1) 电场的 \(\theta\) 分量和 \(\phi\) 分量分别作为角度 \(\theta\) 和 \(\phi\) 的函数：\(E_\theta(\theta,
    \phi)\) 和 \(E_\phi(\theta, \phi)\);'
  merge: -1
  img_proc: true
- pgno: 32
  md: '(2) 这些场分量的相位也是角度 \(\theta\) 和 \(\phi\) 的函数： \(\delta_\theta(\theta,\phi)\)
    和 \(\delta_\phi(\theta,\phi)\)。


    在天线辐射波瓣图特性的基础上，通过一系列包括半功率波束宽度、波束范围、定向性、增益及有效口径等在内的标量值表示天线的辐射特性。其中，定向性 \(D\) 和增益
    \(G\) 是天线最重要的参数。天线的定向性 \(D\) 是指在远场区的某一球面上的最大辐射功率密度 \(P(\theta,\phi)_{\max}\) 与其平均值
    \(P(\theta,\phi)_{\text{av}}\) 之比，即


    \( D = \frac{P(\theta,\phi)_{\max}}{P(\theta,\phi)_{\text{av}}} \) (2.12)


    理想化的各向同性天线具有最低可能的定向性 \(D=1\)，而所有实际天线的定向性都大于 1。相较于定向性，天线增益是一个实际的参数：其在定向性的基础上还考虑了天线及天线罩的欧姆损耗。天线馈电结构的损耗和失配会降低增益。增益与定向性之比为天线的效率因子。对设计良好的天线而言，其效率因子可以接近于
    1。


    天线的输入阻抗是反映天线电路特性的电参数，其定义为天线在输入端所呈现的阻抗。天线输入阻抗即是其馈线的负载阻抗，它决定馈线的驻波状态。通常使用馈线终端 (天线输入端)
    的电压反射系数 \(\Gamma\) 或其分贝表示的反射损失 (return loss) \(L_R\) 作为相应指标：


    \( L_R = 20 \log_{10} |\Gamma| \) (2.13)


    或使用电压驻波比 (voltage standing wave ratio, VSWR) \(S_{VSWR}\)，即传输线上相邻的波腹电压振幅与波节电压振幅之比，即


    \( S_{VSWR} = \frac{|U|_{\max}}{|U|_{\min}} = \frac{1+|\Gamma|}{1-|\Gamma|} \)
    (2.14)


    实际应用中所期望的通常为无反射波的状态，即匹配状态，对应为 \(S_{VSWR} = 1\) 或 \(L_R = -\infty\text{dB}\)。此时，全部入射功率都传输给天线，如天线的损耗可忽略不计则完全转换成辐射功率；另一方面，匹配状态时不会有反射波反射回振荡源，从而不会影响振荡源的输出频率和输出功率。因此，电压驻波比或反射损失是天线的主要指标之一，一般要求
    \(S_{VSWR} \leqslant 2\) 或 \(L_R \leqslant -10\text{dB}\)。


    围绕着天线的电磁场被划分为两个主要的区域：接近天线的区域被称为近场区或菲涅耳 (Fresnel) 区；距离天线较远的区域被称为远场区或夫琅禾费 (Fraunhofer)
    区。一种经典的两区分界是取其半径为


    \( R = \frac{2L^2}{\lambda} \) (2.15)'
