- pgno: 4
  md: '# | “智能工程前沿丛书” 序 |


    按照联合国教科文组织的定义，工程就是解决问题的知识与实践。通信、电子、建筑、土木、交通、自动化、电力、机器人等工程技术通过长期深入研究，已经在人民生活、经济发展、社会治理、国家管理、军事国防等多个领域得到了广泛而全面的应用。智能工程可定义为工程技术领域引入人工智能来解决问题的知识与实践。工程技术和人工智能交叉融合后诞生的智能工程无疑是近年来工科领域最为活跃的研究方向，同时也代表了当代技术科学综合、交叉融合、创新发展的全新态势。


    自 20 世纪 70 年代以来，计算机技术飞速发展，在工程技术的相关领域发挥越来越重要的作用，使得工程技术不断创新，持续取得突破，新产品层出不穷。在计算机辅助下，传统的工程技术虽然已经获得了长足进步，但是仍然难以满足或适应这些新场景和新需求。一方面，产品的应用场景越来越复杂，功能的诉求越来越综合，性能指标的要求越来越高；另一方面，大规模产品的“零缺陷”要求显著提升，从设计到上市的时间窗口越来越短，产品研发生产和使用向高能效、低能耗和低碳排放转变。进入
    21 世纪，工程技术领域的研究人员通过引入人工智能，采用学科综合、交叉融合的方式来尝试解决工程技术所面临的种种难题，诞生了智能工程这个新兴的前沿研究方向。


    近期，东南大学在原有的“强势工科、优势理科、精品文科、特色医科”学科布局基础上，新增了“提升新兴、强化交叉”，在交叉中探索人才培养、学科建设、科学研究新的着力点与生长点。在这一重要思想指导下，“智能工程前沿丛书”旨在展示东南大学在智能工程领域的最新的前沿研究成果和创新技术，促进多学科、多领域的交叉融合，推动国内外的学术交流与合作，提升工程技术及相关学科的学术水平。相信在智能工程领域广大专家学者的积极参与和全力支持下，通过丛书全体编委的共同努力，“智能工程前沿丛书”将为发展智能工程相关技术科学，推广智能工程的前沿技术，增强企业创新创造能力以及提升社会治理等方面做出应有的贡献。


    最后，衷心感谢所有关心支持本书丛书，并为丛书顺利出版做出重要贡献的各位专家，感谢科学出版社以及有关学术机构的大力支持和资助。我们期待广大读者的热情支持和真诚批评。'
