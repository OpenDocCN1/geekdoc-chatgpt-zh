  md: "# 7.3.3 案例 3：面积最小化\n\n大部分情况下，用于设计螺旋电感的面积都是有限的，尤其是在芯片中，设计者被要求用最小的面积实现所需的电气性能。在这个案例中，螺旋电感的尺寸估计方式为\n\
    \n```\nA = D_{outh} \\times D_{outw} \\tag{7.22}\n```\n\nASSI-HKDT 算法不会追求螺旋电感的极致性能，而是在满足各项目标时尽量实现最小化面积。例如，设计一个\
    \ \\( F_{goal} = 40\\text{GHz}, Q_{goal} > 10, L_{goal} = 0.5\\text{nH}, F_{SRF}\
    \ > 60\\text{GHz} \\) 的可伸缩电感，它满足表 7.4 所示的几何约束。本案例与案例 1 有着基本相同的目标及约束，为了更好地进行对比，除了目标被设定为最小化面积之外，伸缩率被设置得更小以允许更大程度地压缩。ASSI-HKDT\
    \ 算法需要解决的问题为：\n\n```\nmin(A)\ns.t. {\n    几何尺寸约束\n    \\frac{|L_{40\\text{GHz}}\
    \ - L_{goal}|}{L_{goal}} < 0.05\n    Q_{40\\text{GHz}} > 10\n    Q_{60\\text{GHz}}\
    \ > 0\n}\n```\n\n该案例综合时间为 6.5h，表 7.5 的第四列展示了案例 3 中 ASSI-HKDIS 输出的最优几何参数。图 7.14(c)\
    \ 和表 7.8 展示了案例 1 与案例 3 的结果对比。与案例 1 相比，案例 3 在品质因数不太重要的场合，最小化面积可以使得螺旋电感的面积减小 63%，并且仍然满足设定的品质因数、电感值与自谐振频率要求。\n\
