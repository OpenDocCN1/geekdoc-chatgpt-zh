  md: "# ## 附录 A 带通滤波器程序源代码 *\n\n本程序所依赖的软件为：Matlab 和 ANSYS Electronics Desktop 2020\
    \ R1。主要的源代码如下：\n\n步骤 1. 运行 “main_step_1_sample” 函数，在该函数中设置优化变量、优化目标并完成初始样本采集。\n\
    \n```\n%% 初始设置\ndata.input_name = [\"l1_1\", \"12_1\", \"13_1\", \"14_1\", \"\
    112_y\", \"123_y\", \"134_y\"];\n% 设计变量名，与Hfss工程文件中的名称保持一致\ndata.dim_input = 7;\
    \ % 设计变量维度\ndata.bounds = [[1.6*ones(1, 4) 0.2 0.26 0.26];[1.9*ones(1, 4) 0.22\
    \ 0.3 0.33]];\n% 设计变量范围\ndata.alph_train = 35; % 初始样本个数\ndata.input_value = (lhsdesign(data.alph_train,\
    \ data.dim_input)-0.5)*2; % 拉丁超立方采样\ndata.output_name = [\"S11\", \"S21\"]; %\
    \ 设置优化目标，与Hfss结果文件命名保持一致\ndata.dim_output = 2; % 优化目标个数\ndata.input_unit = [\"\
    in\", \"in\", \"in\", \"in\", \"in\", \"in\", \"in\"]; % 设计变量单位\ndata.goalPrjFile\
    \ = 'D:/Filter.aedt'; % 输入Hfss待优化项目的绝对路径，本例中为 “Filter.aedt” 文件的绝对路径\ndata.tmpDataFiledeg\
    \ = 'D:/temp_sample/'; % 输入临时文件保存路径，本例中为 “temp_sample” 文件夹的绝对路径\ndata.filename\
    \ = 'Filter'; % 输入Hfss工程文件名\ndata.modelname = 'HFSSDesign'; % 输入Hfss文件模型名\n%%\
    \ 调用Hfss进行采样\ntic\nfunction_hfss(data);\ntime_sample = toc;\n% 读取结果文件\nfor i =\
    \ 1:data.alph_train\n    temp = importdata([data.tmpDataFiledeg, char(data.output_name(1)),\
    \ '_',\n    num2str(i), '.tab']);\n    data.fre = temp.data(:, 1);\n    data.S11_abs(:,\
    \ i) = temp.data(:, 2);\n    temp = importdata([data.tmpDataFiledeg, char(data.output_name(2)),\
    \ '_',\n    num2str(i), '.tab']);\n    data.S21_abs(:, i) = temp.data(:, 2);\n\
    end\n%% 保存\nsave('workspace_data_initial.mat')\n```\n\n* 请访问科学在线 www.sciencereading.cn.\
