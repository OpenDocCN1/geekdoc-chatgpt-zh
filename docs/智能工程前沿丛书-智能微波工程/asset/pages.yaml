  md: '可变螺旋电感，它可以适应任意的矩形区域，同时给出拓展 Wheeler 公式用于粗略估计其直流电感值。经验证，该公式有着良好的准确度。


    如何实现片上螺旋电感的自动综合一直是 RFIC 设计者关心的问题。传统的设计方法在频率较低时表现良好，但在高频时尤其是毫米波频段就难以满足需要。近年来，机器学习被大量引入电路设计中，并取得良好的效果。相比于传统的基于知识的方法，机器学习辅助的方法有着更好的适应性和准确度。但如果同时结合知识和机器学习，即
    HKDT 算法，就可以在保持不错效率的同时实现较好的设计。本章提出的结合知识的 GPR 代理模型就结合了电感曲线和品质因数曲线原本的特性，从而相比于传统的
    GPR 代理模型实现更高的效率与准确度。基于结合知识的 GPR 代理模型，本章提出了 ASSI-HKDT 算法，它实现了毫米波频段片上螺旋电感的自动综合，并给出一些案例来证明其高效、强大的特点，为片上螺旋电感的设计提供新的方向及灵活性。在机器学习和人工智能的辅助下，低功耗、小型化、高品质的
    RFIC 将会越来越容易实现。'
