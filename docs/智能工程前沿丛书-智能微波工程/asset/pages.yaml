  md: '的时间变化或位置变化信道。为了克服这些缺点，华北电力大学的赵雄文教授等提出一种基于 ANN 的信道建模和仿真框架用于对实测信道进行回放[11]，并采用他们提出的方法对中国青岛高铁站的
    28GHz 信道实测数据进行信道回放验证。通过对比实测信道以及 ANN 和 GBSM (geometry-based stochastic model, 基于几何的随机信道模型)
    仿真信道的大尺度和小尺度参数，证实了所提方法的有效性。结果表明，基于 ANN 的方法可以更精确地回放实测信道，而基于 GBSM 的仿真信道有较大的偏差。这项研究成果为
    5G 及 B5G (超 5G) 系统研究和工程应用所需的信道回放提供了有效的解决方案。如果具有大量的信道实测数据，也能应用于未来的信道预测。


    移动通信正在呈现出随着智能手机大量使用，通信场景越来越复杂，载波频率越来越高，mMIMO 中存在大量天线阵元，以及高密度微蜂窝等趋势，大数据集正在产生，5G
    已迈入大数据时代。文献 [12] 提出了大数据和机器学习使能的无线信道模型框架。所提出的信道模型基于 ANN，包括前馈神经网络 (feed-forward
    neural network, FNN) 和径向基函数神经网络 (radial basis function neural network, RBF-NN)。输入参数包括发射机和接收机的坐标、收发距离和载波频率，输出参数是信道统计特性，包括接收功率、均方根时延扩展、均方根角度扩展。用于训练和测试
    ANN 的数据集来自于信道测量和 GBSM 仿真。仿真结果表明所提方法的优异性能，这也说明机器学习算法是未来基于测量的无线信道建模的强有力分析工具。


    为了克服传统物理统计信道模型在准确性和场景通用性方面存在的不足，本书作者所在课题组提出了采用知识和数据混合驱动的智能信道建模方法，并针对前向植被散射簇内信道特性完成预测性建模和模型验证[13]。所提出的智能信道建模方法利用传统基于几何分布的随机信道模型得到多径簇间的信道参数，针对不同类型的多径散射簇，调用相应的
    ANN 模型预测簇内信道特性。根据信道实测数据和射线追踪仿真结果，建立了前向植被散射簇内信道特性的物理统计信道模型，揭示了系统配置和环境变化对植被穿透损耗、时延扩展和角度扩展等信道特性的影响。将信道实测和仿真获得的数据用于
    ANN 训练，并通过增加环境特征标记降低 ANN 训练的复杂度，提升计算效率。在不同传播环境下，基于 ANN 的前向植被散射簇内信道特性预测器的性能得到了验证。与传统物理统计信道建模方法相比，所提方法的预测值具有更小的均方根误差，智能信道建模的准确性和通用性得到极大提升。


