    # 8.4 本章小结


    本章主要介绍知识和数据混合驱动的智能信道建模方法，从信道分簇传播特性出发，利用传统物理统计模型生成簇间信道参数，然后针对不同类型多径散射簇调用相应的机器学习辅助簇内信道参数预测器并生成子径信道参数。因此，其核心问题转化为构建适用于不同散射体的簇内信道参数预测器，并通过包含系统配置和环境因素等信息提高预测器的通用性。本章以前向植被散射簇簇内信道特性预测性建模为例进行研究。首先，在植被覆盖的街道峡谷地带开展信道实测和射线追踪仿真，实测和仿真数据一致性较好，可进一步用于人工神经网络训练。其次，分别研究了前向植被散射簇对应的树木穿透损耗、时延扩展和角度扩展，提出了考虑发射天线下倾角的分段植被衰减模型，同时研究了环境特征和接收机相对位置变化对信道色散参数的影响。将收发信机三维坐标、系统配置信息和环境特征同时作为
    ANN 的输入参数，输出参数包括树木穿透损耗、时延扩展和角度扩展。模型训练结果表明，通过增加环境特征来标记训练数据可有效降低 ANN 复杂度和训练迭代次数，提高模型的准确度。与传统物理统计模型预测结果相比，知识和数据混合模型预测的
    RMSE 更小，并且可以刻画收发信机相对位置变化对信道特性的影响。最后，为验证模型的通用性，在不同场景（例如校园广场）开展了射线追踪仿真，已训练模型预测得到的结果与仿真结果总体保持一致，并且相比物理统计模型具有更小的
    RMSE，表明模型在不同场景下的通用性较好。为进一步提高模型的泛化能力，可增加树木的生物特征（如植被密度、类型）和频率'
