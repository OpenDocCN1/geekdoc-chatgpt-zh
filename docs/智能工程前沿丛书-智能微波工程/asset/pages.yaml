    # 5.2 有源元单元建模


    本节将首先描述基于有源元单元建模（ABE modeling, ABEM）方法，并将其与传统的基于阵元分布的建模方法进行比较，展示了该方法的有效性。继而引入包括平面耦合区域分割和平面虚拟阵列拟合等基于知识驱动方法，将其与数据驱动方法相结合，即通过知识和数据混合驱动方法对
    ABE 进行建模，并与前述的 ABEM 进行比较，进一步提升建模的精度、效率和适用范围。


    # 5.2.1 基于有源元单元的建模


    考虑到传统的基于 MLAO 和 AEP 的阵列综合方法均局限于线阵的情况，这里以线阵为例，阐述 ABEM 所使用的 ABE 的思想与传统方法的区别。如图 5.3
    所示，传统的基于阵元分布的建模（array distribution modeling, ADM）方式将阵元的位置排布视作一个整体作为数据驱动方法的输入，而将包括各阵元
    AEP 及有源 S 参数等信息作为对应阵元位置下的数据驱动方法的输出。这种方法存在两个方面的限制：


    +   (1) 由于训练集中阵元的个数是固定的，代理模型只能对与训练集中阵元个数相同的阵列的性能进行预测。


    +   (2) 由于处在同一阵列中不同位置的阵元的信息无法共享，代理模型实际上并未获得足够的信息，从而导致其预测性能的瓶颈。在全波仿真次数受限的情况下，代理模型的预测精度无法得到保证。'
