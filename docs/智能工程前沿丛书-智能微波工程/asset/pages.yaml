    # ## 2.3.2 无线通信中的电波传播


    无线通信系统中，无线传播信道是收发端之间的物理传输媒介，信号在传播过程中与信道中所存在的丰富散射体发生相互作用，进而在接收端形成由直射、反射、绕射和散射等多路径信号相叠加的接收信号。随着传播环境的变化，无线信号的传播路径将会发生明显变化，因此亟须探明不同环境散射体对信号传播特性的影响，并通过数学形式加以抽象，构建相应的信道模型。此外，无线通信系统的传输性能也受限于相应的信道条件，需要针对相应的信道统计特征分析系统容量的上界；同时，无线信道决定了无线传输方案设计，为实现低复杂度解决方案提供理论基础。


    接收信号功率随传播距离的变化由大尺度信道模型刻画。在设计和部署任何无线通信系统之初，需要进行链路预算，确定无线网络中的射频系统配置、系统覆盖范围并对基站站址位置进行初步选取和优化。大尺度信道模型包括路径损耗、阴影衰落和遮挡效应建模，精确的大尺度信道模型能够保证网络规划和设计的准确性，在提高无线网络覆盖性能的同时降低网络部署成本。由于存在在收发端和环境散射体的移动以及多径传播，接收信号在短期内的快速波动形成小尺度衰落。无'
