  md: '模型的计算成本昂贵。为了解决这个问题，首先，需要建立一个从粗糙离散化的全波仿真（低保真度全波仿真模型 \( R_c \)）收集的训练数据训练得到辅助
    BSVR 模型 \( R_{s.aux} \)，\( R_{s.aux} \) 的训练集包括由 \( n \) 个输入变量 \( x_i \) 组成的向量和相关的目标标量
    \( y_i = R_c(u_i) \)，其中，\( (u_i) \) 包括几何参量和一个频率值，\( y_i \) 是相对应的仿真结果 \( |S_{11}|\)
    或 \( |S_{21}|\)。从辅助 BSVR 模型 \( R_{s.aux} \) 中得到的支持向量 SV 将被应用于高网格密度模型 \( R_f \)
    的仿真，为 \( R_s \) 提供简化的高保真度训练集。


    根据实验结果，粗糙仿真结果 \( R_c \) 和精细仿真结果 \( R_f \) 具有相关性，在输入空间中粗糙模型响应表面出现重要变化的区域，在精细模型响应表面也会具有相同的特征，因此，粗糙模型的支持向量在精细数据集中很大程度抓取重要的特征变化，以及相关联的目标值的变化，从而支撑训练集的简化。


    以上讨论针对的是多目标全局优化模型，能够在整个输入空间做出精确的预测。对于在局部（输入空间的特定区域）定义的 BSVR 代理模型，可以使用与空间映射相结合的方法，其中
    BSVR 用于建立器件结构的低保真度模型。首先，找到一个近似最优粗糙模型 \( R_{cd} \)（低保真度全波仿真模型），然后建立 BSVR 代理模型 \(
    R_c \)，仅使用在最优解附近相对密集分布的训练数据，进一步提高计算效率。一旦建立 BSVR 代理模型，\( R_c \) 作为空间映射算法迭代优化的基础，不再涉及全波仿真求解器。高保真度的计算用于优化结果的评估验证。为了改善局部的收敛性能，这种方法在置信域架构下实施，新的设计方案仅在现有方案周围一定的区域内寻找，不能改善误差的方案将被筛除。


    以上讨论用于微波元器件结构优化的贝叶斯支持向量回归，以及在训练模型所需要的数据计算成本较高时如何简化数据集。BSVR 的一个值得关注的优点是，它只有一个需要用户设置的参数
    \(\beta\)。


    # 3.3 最优化算法


    各类智能优化算法（例如，进化类算法、群智能算法等）因其应用范围广，不要求优化问题的连续、可微、单峰等约束[26]，以及具有较强的搜索能力，已被广泛应用于各类天线、元器件的优化设计、阵列综合以及瓣形波束等电磁优化问题中。代理模型的建立可以缓解单纯依靠全波仿真设计优化带来的计算压力，在此基础上智能化、自动化寻找符合优化目标的设计方案还需要结合各类智能优化算法。本节介绍比较常用的遗传算法、粒子群算法和差分进化算法[27]。


    # 3.3.1 遗传算法


    遗传算法（genetic algorithm, GA）是模仿自然界生物进化机制发展的元启发式算法，属于进化类算法的一种[28]。遗传算法通常利用选择、交叉、变异等生物启发算子，其算法流程如图
    3.5 所示。'
