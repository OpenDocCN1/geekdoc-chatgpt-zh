  md: '# 2) 天线单元在空间中的分布


    直线形的阵列分布将影响一个面的辐射性能，而平面阵将在两个维度影响阵列的辐射性能。在实际应用中，亦有共形阵的设计需求，要求天线单元在三维空间中以一定的相对位置构建天线阵列。


    # 3) 天线单元的激励分布


    激励分布包括相位分布和幅度分布，可以单独或共同使用以构成相应的天线阵列辐射方向图。


    与阵列的分析相反，阵列综合则是在给定辐射特性的情况下求解阵列的空间分布、激励分布参数及天线单元的结构设计参数，使阵列的某些辐射特性满足给定的要求（如低副瓣电平阵列设计），或使阵列的方向图尽可能地逼近预定的方向图（如赋形波束阵列设计）。


    # 2.3 电波传播机制与信道建模


    电波传播是所有无线电收发系统（包括自然源辐射的被动检测系统）之间信息传输的基础。电磁波在具有不同物理特性和时空结构的环境介质中传播，一方面实现信号远距离传播，另一方面则因存在衰减、扰动等对信号传播产生阻碍作用。因此，在任何无线电系统设计之初，首先需要研究不同频段的电波在不同传播环境下的传播特性，使系统工作性能与空中无线信道特性达到良好匹配。麦克斯韦方程组是描述自然界电磁现象的数学基础，也是推导波动方程、求解在给定边界条件和初始条件下电磁波的基础，而关于电磁场与电磁波的理论知识已有大量参考书进行详细讲解。因此，本节主要介绍电波传播的基本概念，并不涉及复杂的数学公式推导；同时针对移动通信中的电波传播，介绍信道衰落特性以及如何进行测量和表征建模。通过介绍有关电波传播方面的知识，为后续引入人工智能算法实现电波传播特性预测和信道建模提供理论和实验基础。


    # 2.3.1 电波传播的理论基础


    自由空间中的电波传播是研究复杂传播环境下无线信道特性的基本参考，可用于评估传输路径的性能。同时，电磁波在传播过程中与散射体发生相互作用，不同电波传播机制将导致经过不同路径传输的信号在接收端的叠加，形成多径效应。


    # 1. 自由空间电波传播


    自由空间是指充满均匀、线性、无损耗、各向同性理想介质的无限大空间。在自由空间中，电磁波沿直线传播（传播速度约等于光速），不会出现反射、折射、散射和吸收等现象，传播损耗仅仅考虑因电波扩散而引起的损耗。通常在实际研究'
