    # 1. 大尺度信道衰落特性


    随着传播距离的增加，电磁波的强度不断衰减。为了预测平均信号场强随长距离变化的关系，需要建立相应的大尺度信道模型。通常，大尺度信道模型包括路径损耗、阴影衰落、交叉极化鉴别
    (cross-polarization discrimination, XPD) 以及雨衰、大气损耗、穿透损耗等附加损耗。之所以称之为大尺度，是因为当接收机的移动范围大于几十个波长时，路径损耗、阴影衰落等占据主导地位，信号的场强均值随时间、地点以及移动速度有比较平缓变化。因此，在进行链路预算时，首先需要针对不同环境和场景、频率建立相应的大尺度信道模型，然后再确定系统的覆盖范围和配置信息。


    根据自由空间中电波传播分析结果可知，路径损耗描述了信号从发射端到接收端传播过程中所经历的功率衰减。对于自由空间而言，这种衰减是由于传输距离增加导致球面波扩散效应，使得接收天线在单位面积上接收到的功率逐渐减小。而对于实际的传播环境，电波在传播过程中会与空气、水气等发生相互作用，经过反射、折射和吸收等产生传输损耗。通常只有在远大于电波波长的距离上，这种衰减才可以被观测到发生显著的变化，因此路径损耗被认为是大尺度衰落的典型特征。将式
    (2.23) 中接收功率随收发信机之间的距离 d 下降的指数常数定义为路径损耗指数 (path loss exponent, PLE)。不难发现，在自由空间中路径损耗指数为
    2，即接收信号的功率随着收发间距离平方的增大而减小。此外，路径损耗还与信号的载波频率有关，即在同样的传播距离下，随着载波频率的升高，路径损耗不断增大。在实际传播环境下，路径损耗的预测模型通常是基于信道实测数据构建的，并且具有不同的适用场景和频段。图
    2.11 给出了几种典型的室内和室外无线通信电波传播场景。针对不同类型场景，通过对传播环境特征进行抽象，前人已经提出了很多经典的路径损耗模型，例如，Okumura-Hata
    模型、Cost231-Hata 模型、ITU-R 模型、Walfish-Ikegami 模型、Lee 模型、对数距离模型、Ericsson 多重断点模型等。为了提高模型对路径损耗预测的准确性，上述模型中除了刻画路径损耗随频率和传播距离的变化外，还包含天线高度、环境
    (城区和郊区)、道路条件 (宽度和走向)、建筑特点 (屋顶和建筑物高度) 等因素的影响。上述经典的路'
