- pgno: 224
  md: '# 附录 E 片上可变螺旋电感自动综合程序源代码 *


    电感综合演示程序基于 Matlab 开发，共包含 15 个函数，其中 AI_Inductor__Synthesis 为主函数。本程序的执行包含以下步骤：


    +   步骤 1. 设定目标，用户需在此设定所需电感的电感值、工作频率与最小自谐振频率，程序会寻找满足这些条件的最大品质因数电感 layout。

    +   步骤 2. 设定约束，用户需要在此设定螺旋电感的几何约束，包含面积、线宽、线距与圈数。

    +   步骤 3. 设置工艺，用户需要在此设定需要使用的工艺，需要声明工艺名称、金属层名称、约束组名称，确保以上名称与 VIRTUOSO 中的名称一致，此外，还需要输入包含工艺
    PDK 路径的 cds.lib 文件、EMX 仿真所需的 proc 文件以及工艺对应的 layermap 文件。

    +   步骤 4. 初始化，程序会校验用户输入是否有误并创建工程目录。

    +   步骤 5. 收集初始样本，程序会根据目标自动收集一定数量的样本。

    +   步骤 6. 多路径全局优化，程序会自动进行迭代优化。

    +   步骤 7. 最优样本输出，程序会自动输出最优样本至指定目录。


    本程序仅支持在 Linux 平台下运行，建议的 Linux 发行版本包括但不限于 RHEL6（6.5+）、RHEL7（7.4+）、SLES11、SLES12、CentOS6（6.5+）以及
    CentOS7（7.4+），详情请参见 Cadence Virtuoso 支持的 Linux 发行版。本程序依赖的软件如下：


    +   1. Cadence Virtuoso: 版本要求为 Cadence Virtuoso 6.18，请将 <VirtuosoPath>/bin 目录加入环境变量；

    +   2. EMX: 版本要求为 5.4 及以上，不支持 EMX 6，请将 <EMXPath> 加入环境变量；

    +   3. Matlab: 版本要求为 2018b 及以上。


    以下为电感综合演示程序中部分重要的源代码及说明。主函数 AI_Inductor__Synthesis 中需要设定指标与工艺，其代码如下：


    ```

    % Set target inductance value, nH

    Param.targetL = 0.3;

    ```'
