    # 2.3.4 信道建模


    本节前部分介绍了电波传播理论基础以及无线通信中所关注的信道衰落特性，为了尽可能准确地刻画无线信道的传播特性，需要构建与之相适应的信道模型。通常信道建模的目的包括无线传输技术设计和参数优化，并提供仿真验证平台用于评估相关技术的性能，同时作为无线网络规划和覆盖优化的理论和实验基础，推动系统的商用部署。因此，任何无线通信系统在设计和部署之初需要建立相应的信道模型。对于大尺度路径损耗预测建模通常包括经验模型和确定性模型两类，其中
    2.3.2 节中介绍的几种建立在实测数据基础上的路径损耗模型均属于前者，而确定性模型则是基于射线追踪方法精确计算得到每一个接收机位置处接收信号的场强。对小尺度衰落特性进行建模，主要目的是为了准确、有效地生成具有所需信道特征的信道冲激响应。对于
    MIMO 信道建模，一种常见的信道模型分类方法是将其分为确定性信道模型和随机信道模型。确定性信道模型主要是基于电磁场和几何光学理论，得到适用于特定场景的信道矩阵，例如，射线追踪和传播图论等。此外，根据在特定场景信道实测数据进行存储、回放也属于确定性信道建模。随机信道模型进一步又分为物理模型和分析模型，其中物理模型是基于双向信道物理传播规律建立的，并且根据是否假设环境散射体以及收发信机的空间几何分布情况分为几何和非几何随机信道模型。值得注意的，物理模型中所需要的相关信道参数的统计分布情况需要通过信道实测或确定性信道仿真获得。而分析模型则是从纯数学的角度建模收发信机之间的信道冲激响应，并将其融合于
    MIMO 信道矩阵表达式中。分析模型主要用于传输方案设计和信道容量分析。常用的分析信道模型包括基于相关的模型（如 Kronecker 模型、Weichselberger
    模型）和传播特征模型（如有限散射体模型、虚拟信道表征模型）。下面将主要介绍常用的确定性信道模型和物理随机信道模型。


    # 1. 确定性信道模型


    确定性建模方法是建立在对地理环境信息已知的基础上，根据传播环境的具体地理和形态信息，依据几何光学理论预测所有可能存在的电波路径，并利用电磁波理论进行所有路径的电磁参数计算，从而得出对应的信道模型。确定性建模方法是从物理学中电磁波传播的角度建立对信道的认知，不依赖于实测活动，只需要了解传播环境的具体信息就可以对信号传播特性做出比较准确的预测，因此具有简单直观且容易理解的优势。确定性信道模型主要包括时域有限差分（finite-difference
    time-domain, FDTD）法、射线追踪法、传播图论法和存储式信道回放法。


    FDTD 是一种电磁数值计算方法，从麦克斯韦方程组出发求解差分方程，将连续的电磁问题转化为离散数值问题，并得到相应的电磁参数，这种方法易于编'
  merge: -1
  img_proc: true
- pgno: 48
  md: '程实现、预测结果精度高，但计算量大、过程复杂，在实际中应用较少。


    射线追踪法是基于几何光学和一致性散射理论的建模方法，虽然目前在一定程度上受限于普通仿真计算机的计算水平和存储能力，但随着计算机硬件水平的提升和优化算法的深入研究，利用射线追踪技术进行无线信道建模已成为除传统信道测量之外的有力补充。射线追踪法基于几何光学
    (geometric optics, GO) 理论，通过模拟射线 (光) 的传播路径来确定反射、折射等。射线追踪法是估算高频电磁场的一种很容易应用的近似方法，它假设传播的电磁波波长趋于零，因此电磁波的能量可以认为通过直径为无限小的细管（常称之为射线）向外辐射。在几何光学中，只考虑直射、反射和折射射线。对于障碍物的绕射，通过引入绕射射线来补充
    GO 理论，即几何绕射理论 (geometric theory of diffraction, GTD) 和一致性绕射理论 (uniform theory
    of diffraction, UTD)。此外，用于预测复杂结构的 3D 建筑环境内电磁场的射线追踪方法主要有镜像法、入射及反弹射线法 (shooting
    and bouncing ray, SBR)、射线管法以及入射及反弹射线法/镜像方法 (SBR/image)。


    传播图论法是一种确定性建模与统计建模相结合的方法。对应选定的信道传播场景，传播图论法根据已知的收发天线位置与环境中典型散射体的分布，将场景的数字地图转化为由节点和边构成的传播图。传播图中的点代表收发天线和散射体，可见的节点连接成边，对应于环境中的实际传播路径。信号从发射天线到达散射体，经过散射体间的若干次反射，最终到达接收天线，构成一条完整的传播路径，其中的每一条边都可以根据电磁传播特性表达为频率和传播距离的函数。运用传播图论法搜索环境中所有可能存在的传播路径，结合随机矩阵的运算得到一个场景中只与天线位置有关的信道传递函数，即所需构建的传播信道模型。


    存储式信道回放法主要是在特定的应用场景开展信道实测，记录相关的信道测量系统配置信息，将采集得到的数据按照一定的格式要求进行存储。在应用相应的模型数据时，将信道的空-时-频域内信道传播信息进行回放。确定性建模方法的优点是在保证环境抽象模型精确性的基础上，可以准确得到相应的传播路径，实现成本较低，但是其建模结果只适用于特定场景，为构建新场景的信道模型需要重新建立相应场景的仿真模型，并且建模准确性与环境建筑材料的结构电参数密切相关。因此，发展出用于构建环境抽象模型点云场景方法，同时需要开展针对不同类型建筑材料的材料特性测量与建模研究。


    # 2. 物理随机信道模型


    物理随机信道模型是在电波传播的物理传播规律基础上提出的，基于物理随机信道模型可以明确得到电波传播参数的样本实现，例如每一条传播路径的复振'
