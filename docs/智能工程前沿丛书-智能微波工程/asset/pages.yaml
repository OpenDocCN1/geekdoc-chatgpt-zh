    # 5.5 本章 小 结


    本章探讨一种知识和数据混合驱动的天线阵列设计方法——HKDT。相较于传统的纯知识驱动的阵列综合方法，HKDT 方法可以在阵列设计中考虑到包括阵元间互耦和平台效应等在内的影响因素对阵元方向图乃至阵列方向图的影响，从而实现更好的阵列性能；相较于传统的纯数据驱动的阵列综合方法，HKDT
    实现了对阵元 AEP 的快速建模，从而大大提升了阵列设计的效率。通过引入先验的物理知识和假设，并在理论模型无法提供精确且快速响应处引入数据驱动方法进行协同，从而最大程度实现了精确且高效的天线阵列设计。首先，HKDT
    方法将天线阵列视为单独的 ABE 构成的整体，将处在不同阵列位置、不同电磁环境下的天线单元统一，大大提升了机器学习方法对阵元特征的感知能力；其次，HKDT
    方法引入包括平面耦合区域分割和平面虚拟子阵拟合在内的物理知识及假设，大大缓解了数据驱动方法在阵列设计，特别是二维阵面设计中对计算资源的需求；最后，将 HKDT
    方法与经典的 MLAO 方法协同，对一系列线阵及面阵的实际设计任务进行建模与设计，验证了 HKDT 算法的有效性及优势。'
