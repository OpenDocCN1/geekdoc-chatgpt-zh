  md: '# # 机器学习辅助优化


    近年来，机器学习已广泛应用于图像处理、语音识别、无人驾驶、市场预测分析等领域。利用采集到的数据搭建智能化的代理模型，有助于处理相应的问题。不同的代理模型根据其原理有不同的特点及最佳的适用场景。例如，人工神经网络在处理大规模数据时有较好的表现，当样本不足时容易出现过拟合现象，高斯过程回归在预测时可以返回预测的方差以便对预测的不确定性做出评估，由于其核函数能计算样本之间的相关性，当样本规模较大时，训练代理模型所需的时间会大幅度增加。


    在微波器件设计领域，参数优化是重要的设计环节，特别是在毫米波及更高的频段，频率越高意味着波长越短，器件的结构尺寸越小，也就意味着需要更为精密的加工工艺。另外，随着器件的工作频率升高，特别是到了毫米波及更高的频段，严重的寄生效应大大影响了等效电路的精度。与此同时，当需要进行敏感性分析和多目标协同优化时，计算的成本和复杂度更是大幅度提高。然而，基于矩量法
    (method of moment, MoM)、有限元法 (finite-element method, FEM) 或时域有限差分 (finite-difference
    time-domain, FDTD) 法等电磁学计算方法的全波仿真求解器虽然非常精确，但所需的计算资源和计算时间成本极高。


    为此，在微波工程领域引入机器学习用以辅助进行优化设计，并根据不同模型预测的表现进行算法辅助及模型改进。根据仿真数据建立的机器学习代理模型预测时间与一次全波仿真的时间相比几乎可以忽略不计，计算成本主要集中在样本集的建立和结果验证。在微波器件设计的应用场景，训练数据往往来自于全化仿真，为了节约计算成本，样本集较小，而复杂的器件或者大规模阵列需要优化设计的敏感参数较多。因此，如何在高维、小样本情况下建立可靠的代理模型，并配合优化算法，通过较少的迭代次数达到预先设定的设计指标是研究的关键点。


    本章将对机器学习以及常用的进化类优化算法进行介绍，同时针对具体应用进行举例阐述。


    # ## 3.1 基本框架


    代理模型的预测准确性随着样本量的增大而逐渐提高，因此结合代理模型在线更新的方法，对整体联合优化流程进行介绍。代理模型在线更新的思想平衡了'
