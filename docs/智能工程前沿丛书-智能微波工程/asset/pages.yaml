  md: '电波传播特性时，只要媒质和障碍物对电波传播的影响可以忽略，就近似认为电波是在自由空间中传播。


    对于点对点传播链路，可以计算各向同性天线之间的自由空间衰减，即自由空间路径损耗，记为 \( L_{\text{bf}} \)。设在自由空间中，各向同性发射和接收天线的辐射和接收功率分别为
    \( P_t \) 和 \( P_r \)，其比值即为 \( L_{\text{bf}} \)，则


    \( L_{\text{bf}} = \frac{P_t}{P_r} \) (2.16)


    电波在自由空间中经过传播距离 \( d \) 后到达接收天线，此时对于各向同性接收天线，\( P_r \) 等于接收点处辐射场的功率密度 \( S \) 乘以天线的有效面积
    \( A_e \)，即


    \( P_r = S A_e \) (2.17)


    根据天线理论和互易性定理可以得到天线增益 \( G \) 与有效面积 \( A_e \) 之间的关系


    \( G = \frac{4\pi}{\lambda^2} A_e \) (2.18)


    式中，\( \lambda \) 表示波长。同时，假设距离发射天线 \( d \) 处的辐射场的功率密度为


    \( S = \frac{P_t}{4\pi d^2} \) (2.19)


    式中，\( S \) 为功率密度，单位为 \( \text{W/m}^2 \)。对于理想的各向同性接收天线，\( G=1 \)，将式 (2.18) 和式 (2.19)
    代入式 (2.17) 可得


    \( P_r = \frac{P_t}{4\pi d^2} \left( \frac{\lambda^2}{4\pi} \right) \) (2.20)


    式中，\( P_r \) 为接收功率，单位为 \( \text{W} \)。此时，自由空间传输损耗为


    \( L_{\text{bf}} = \left( \frac{4\pi d}{\lambda} \right)^2 \) (2.21)


    传输损耗用分贝数表示为 \( L_{\text{bf}} = 20 \log_{10} \frac{4\pi d}{\lambda} (\text{dB})
    \)。类似地，当发射天线和接收天线均为有向天线，其方向性系数（增益）分别为 \( G_t \) 和 \( G_r \) 时，则接收功率为


    \( P_r = \frac{P_t}{4\pi d^2} \left( \frac{\lambda^2}{4\pi} \right) G_t G_r \)
    (2.22)'
