    根据多径分量和环境散射体的映射关系可以得出，无线信道呈现分簇特性，其中散射体簇表示一组具有相同长时特性但未必紧挨的散射体集合。当信号在传播过程中遇到散射体簇时，会以相近的时延和传播方向继续向后传播，其幅度呈现局部的衰落特性。此外，为了避免多次散射时时延和角度特征参数的互耦，在建模过程中通常只考虑第一次和最后一次散射而忽略中间的传播过程。图
    2.14 给出小尺度多径衰落信道分簇建模示意图。从信道冲激响应的强度来看，一方面，簇心与 LOS 路径的信号强度随相对传播时延增加而逐渐减小；另一方面，簇内各子径信号的强度则按照另一规律衰减。即就是，通常将其建模为随相对传播时延变化的指数分布，进一步从整体上看每条路径的信号强度衰减服从
    Rayleigh 分布。图 2.14 为一种理想化结果，即各不同簇之间是相互独立的，而更一般的情况是它们之间存在重叠，因此还需要研究簇和径的到达率，以反映不同簇和子径间的关系，通常被建模为泊松分布。此外，随着收发端天线阵列规模的不断增大以及信道带宽的不断增加，时间和空间分辨率则不断提高，进一步提升对信道中多径分量观测和分辨能力。


