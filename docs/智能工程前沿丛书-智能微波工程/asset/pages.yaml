- pgno: 170
  md: '信道冲激响应应包括大尺度衰落和小尺度衰落两部分，其中信道的大尺度衰落主要与传播距离、系统工作频率和传播场景有关，而信道的小尺度衰落则主要受传播环境变化的影响。在
    3GPP TR38.901 信道模型中，NLOS 部分的信道冲激响应可以表示为


    \(\boldsymbol{H}_{u,s}^{\text{NLOS}}(\tau, t) = \sum_{n=1}^{2} \sum_{i=1}^{3}
    \sum_{m \in R_i} \boldsymbol{H}_{u,s,n,m}^{\text{NLOS}}(t) \delta(\tau - \tau_{n,i})
    + \sum_{n=3}^{N} \boldsymbol{H}_{u,s,n}^{\text{NLOS}}(t) \delta(\tau - \tau_n)\)


    (8.1)


    式中，\(\delta(\cdot)\) 表示 Dirac 函数；\(R_i(i=1,2,3)\) 表示子簇 \(i\) 内所包含子径编号集合；\(\tau_{n,i}\)
    表示子簇的时延；\(\tau_n\) 表示簇的时延。式 (8.1) 右侧第一部分表示具有最强接收功率的两个簇所对应的信道冲激响应，第二部分表示其余 \((N-2)\)
    个接收功率较弱的簇所对应的信道冲激响应，\(N\) 表示可观察多径散射簇的个数。第 \(s\) 个发送天线与第 \(u\) 个接收天线之间第 \(n\) 个簇的信道系数
    \(\boldsymbol{H}_{u,s,n}^{\text{NLOS}}(t)\) 可表示为


    \(\boldsymbol{H}_{u,s,n}^{\text{NLOS}}(t)\)

    \(=\sqrt{\frac{P_n}{M}} \sum_{m=1}^{M} \begin{bmatrix} F_{\text{RX},u,\theta}
    (\Omega_{\text{RX},n,m}) \\ F_{\text{RX},u,\phi} (\Omega_{\text{RX},n,m}) \end{bmatrix}^{\text{T}}
    \begin{bmatrix} \exp(\mathsf{j}\Phi_{n,m}^{\theta\theta}) & \sqrt{\kappa_{n,m}^{-1}}
    \exp(\mathsf{j}\Phi_{n,m}^{\theta\phi}) \\ \sqrt{\kappa_{n,m}^{-1}} \exp(\mathsf{j}\Phi_{n,m}^{\phi\theta})
    & \exp(\mathsf{j}\Phi_{n,m}^{\phi\phi}) \end{bmatrix} \times\)

    \(\begin{bmatrix} F_{\text{TX},s,\theta} (\Omega_{\text{TX},n,m}) \\ F_{\text{TX},s,\phi}
    (\Omega_{\text{TX},n,m}) \end{bmatrix} \exp\left(\mathsf{j}2\pi \frac{\boldsymbol{r}_{\text{RX},n,m}^{\text{T}}
    \cdot \boldsymbol{d}_{\text{RX},u}}{\lambda_0}\right) \exp\left(\mathsf{j}2\pi
    \frac{\boldsymbol{r}_{\text{TX},n,m}^{\text{T}} \cdot \boldsymbol{d}_{\text{TX},s}}{\lambda_0}\right)
    \times\)

    \(\exp\left(\mathsf{j}2\pi \frac{\boldsymbol{r}_{\text{RX},n,m}^{\text{T}} \cdot
    \boldsymbol{v}}{\lambda_0} t\right)\)


    (8.2)


    式中，\(P_n\) 表示第 \(n\) 个簇的功率；\(M\) 表示每一个簇内所包含的子径数；\(F_{\text{RX},u,\theta}\) 和 \(F_{\text{RX},u,\phi}\)
    分别表示第 \(u\) 个接收天线单元的辐射方向图；\(F_{\text{TX},s,\theta}\) 和 \(F_{\text{TX},s,\phi}\)
    分别表示第 \(s\) 个发射天线单元的辐射方向图；\(\Phi_{n,m}\) 表示第 \(n\) 个簇内第 \(m\) 个子径在 \(\theta\)
    和 \(\phi\) 两种不同的极化组合状态下的初始相位；第 \(n\) 个簇内第 \(m\) 个子径的三维到达角和离去角分别表示为 \(\Omega_{\text{RX},n,m}
    = [\theta_{n,m,\text{ZOA}}, \phi_{n,m,\text{AOA}}]\) 和 \(\Omega_{\text{TX},n,m}
    = [\theta_{n,m,\text{ZOD}}, \phi_{n,m,\text{AOD}}]\)；\(\theta\) 和 \(\phi\) 分别表示俯仰角和水平角；\(\boldsymbol{r}_{\text{RX},n,m}\)
    表示接收端球单位矢量；\(\boldsymbol{d}_{\text{RX},u}\) 表示第 \(u\) 个接收天线单元的位置矢量，类似地也可以对发射端的相关参数
    \(\boldsymbol{r}_{\text{TX},n,m}\) 和 \(\boldsymbol{d}_{\text{TX},s}\) 进行定义；\(\kappa_{n,m}\)
    表示信道的交叉极化比；\(\lambda_0\) 表示波长；\(\bar{\boldsymbol{v}}\) 表示接收端移动速度矢量。式 (8.1) 中 \(\boldsymbol{H}_{u,s,n,m}^{\text{NLOS}}(t)\)
    可定义为


    \(\boldsymbol{H}_{u,s,n,m}^{\text{NLOS}}(t)\)

    \(=\sqrt{\frac{P_n}{M}} \begin{bmatrix} F_{\text{RX},u,\theta} (\Omega_{\text{RX},n,m})
    \\ F_{\text{RX},u,\phi} (\Omega_{\text{RX},n,m}) \end{bmatrix}^{\text{T}} \begin{bmatrix}
    \exp(\mathsf{j}\Phi_{n,m}^{\theta\theta}) & \sqrt{\kappa_{n,m}^{-1}} \exp(\mathsf{j}\Phi_{n,m}^{\theta\phi})
    \\ \sqrt{\kappa_{n,m}^{-1}} \exp(\mathsf{j}\Phi_{n,m}^{\phi\theta}) & \exp(\mathsf{j}\Phi_{n,m}^{\phi\phi})
    \end{bmatrix} \times\)'
