    # 4.3.3 多路径机器学习辅助优化


    本节介绍多路径机器学习辅助优化 (MB-MLAO) 算法。该算法利用多保真度机器学习算法降低计算时间，利用自适应 LCB 变量、再训练和再预测的策略来平衡算法进行局部和全局搜索的能力。该算法的流程图如图
    4.2 所示，具体包括以下步骤：


    步骤 1. 初始化设置。定义设计变量，优化目标，优化空间 $[a,b]^K$，高、低保真度样本的数量分别为 \(N_{\mathrm{H}}\) 和 \(N_{\mathrm{L}}\)，以及
    LCB 常数的个数 \(M\) 和对应值 \(\boldsymbol{\omega} = \{\omega_i, i = 1, 2, \cdots, M\}\)。利用拉丁超立方采样在优化空间中采样得到
    \(N_{\mathrm{L}}\) 个样本点，记为 \(\boldsymbol{X}_{\mathrm{L}}\)。


    步骤 2. 初始样本获取。利用低保真度全波仿真模型对 \(\boldsymbol{X}_{\mathrm{L}}\) 进行仿真，得到低保真度响应 \(\boldsymbol{R}_{\mathrm{L}}
    = U_{\mathrm{L}}(\boldsymbol{X}_{\mathrm{L}})\)；从 \(\boldsymbol{X}_{\mathrm{L}}\)
    随机抽取 \(N_{\mathrm{H}}\) 个样本，记为 \(\boldsymbol{X}_{\mathrm{H}}\)，并利用高保真度全波仿真模型对
    \(\boldsymbol{X}_{\mathrm{H}}\) 进行仿真得到高保真度响应 \(\boldsymbol{R}_{\mathrm{H}} = U_{\mathrm{H}}(\boldsymbol{X}_{\mathrm{H}})\)。


    步骤 3. 代理模型训练。利用上一节中介绍的非线性信息融合的多保真度高斯过程回归算法对样本进行训练，得到廉价的代理模型 \(U_{\mathrm{S}}\)。


    步骤 4. 基于代理模型进行优化。利用如遗传算法等全局优化算法对步骤 3 中构建的代理模型进行优化，适应度函数设置为


    \(F(\boldsymbol{x}_i) = \min_{\boldsymbol{x}_i} \{ \tilde{y}(\boldsymbol{x}_i)
    - \omega_i \hat{s}(\boldsymbol{x}_i) \}, i = 1, 2, \cdots, M\) (4.21)


    得到 \(M\) 组不同路径下适应度函数最优值对应的参数组合 \(\boldsymbol{X}_{\mathrm{S}} = \{\boldsymbol{x}_i
    | i = 1, \cdots, M\}\)。


    步骤 5. 低保真度全波仿真并再训练。为了降低计算开销，先利用低保真度全波仿真模型对步骤 4 中得到的 \(M\) 组参数组合 \(\boldsymbol{X}_{\mathrm{S}}\)
    进行全波仿真，再把这 \(M\) 组数据加入到样本集中并进行再训练，从而得到新的代理模型。'
