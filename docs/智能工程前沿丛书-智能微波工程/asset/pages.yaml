    使用各向同性的高斯核的 SVR 广泛应用于微波元器件建模。研究发现，使用具有自动相关性判定 (automatic relevance determination,
    ARD) 高斯核的贝叶斯支持向量回归 (Bayesian SVR, BSVR)，在对基于频率的反射系数建模中，表现远胜于传统的支持向量回归。BSVR 本质上是高斯过程回归
    (GPR) 的一个版本；贝叶斯框架通过最小化给定超参数数据的负对数概率，实现对 ARD 核多个超参数的有效训练。在标准 SVR 下，这种多超参数的训练是非常棘手的，为此，标准
    SVR 采用网格搜索/交叉验证的方法。BSVR 除了具有基于贝叶斯的优点外，还具有标准 SVR 的优点，如二次规划和解的稀疏性，即其解完全由训练集的子集 SV
    集合表征。


    对于 BSVR 框架，与高斯过程类似，贝叶斯原理给出基于训练集 \(\boldsymbol{D}\) 的 \(\breve{f}\) 后验概率为


    ```

    p(\breve{f}|\boldsymbol{D}) = \frac{p(\boldsymbol{D}|\breve{f})p(\breve{f})}{p(\boldsymbol{D})}
    \tag{3.17}

    ```


    式中，\(p(\breve{f})\) 是 \(\breve{f}\) 的先验概率；\(p(\boldsymbol{D}|\breve{f})\) 是似然；\(p(\boldsymbol{D})\)
    是依据。似然可表示为


    ```

    p(\boldsymbol{D}|\breve{f}) = \prod_{i=1}^n p(\delta_i) \tag{3.18}

    ```


    式中，\(p(\delta_i) \propto \exp[-\zeta L(\delta_i)]\)，\(L(\delta_i)\) 是损失函数，\(\zeta\)
    是一个常数。在标准的 GPR 中，损失函数是二次的，在贝叶斯支持向量回归中，特殊点在于使用一个新的损失函数，这个函数结合了标准 SVR 中的损失函数和可微
    Huber 损失函数的优点，损失函数定义为


    ```

    L_{\varepsilon,\beta}(\delta) = \begin{cases} -\delta - \varepsilon, & \delta
    \in (-\infty, -(1+\beta)\varepsilon), \\ \frac{(\delta + (1-\beta)\varepsilon)^2}{4\beta\varepsilon},
    & \delta \in [-(1+\beta)\varepsilon, -(1-\beta)\varepsilon], \\ 0, & \delta \in
    [-(1-\beta)\varepsilon, (1-\beta)\varepsilon], \\ \frac{(\delta - (1-\beta)\varepsilon)^2}{4\beta\varepsilon},
    & \delta \in [(1-\beta)\varepsilon, (1+\beta)\varepsilon], \\ \delta - \varepsilon,
    & \delta \in ((1+\beta)\varepsilon, \infty). \end{cases} \tag{3.19}

    ```'
