    # 图 5.4 带有不规则形状地板结构的微带天线阵列模型


    首先，研究参数 \( K \) 对算法建模能力的影响。参数 \( K \) 代表模型需考虑的与 ABE 相邻的在一侧的天线单元个数，即在模型建立中考虑与 ABE
    最近的 2\( K \) 个天线单元的互耦对单元 AEP 的影响。在研究中，将其他相关参数设置为 \( M_{\text{sample}} = 5 \) 及
    \( N = 6, 7, \cdots, 16 \)，对设计范围内的阵列结构进行随机采样构建数据集，并将其中的 \( r_t = 80\% \) 设置为训练集，\(
    r_v = 20\% \) 设置为验证集。需要注意的是，在训练集和验证集中，天线阵列中的阵元个数皆是可变的。采用 GPR 方法对天线单元的 AEP 和 \(
    S \) 参数进行建模，并采用 5/2 Martin 函数作为核函数。使用均方根误差 (root mean square error, RMSE) 评估代理模型的预测与验证值间的差距。表
    5.1 给出 ABEM 算法在不同的 \( K \) 值下采用 RMSE 描述的预测能力的比较，而图 5.5 给出 ABEM 算法的预测值与验证值的对比。可以看到，当
    \( K=0 \)，即不考虑周围单元的互耦影响时，机器学习所建立的代理模型无法对所考虑的 ABE 的 AEP 进行很好预测；而当 \( K \) 从 0 增大至
