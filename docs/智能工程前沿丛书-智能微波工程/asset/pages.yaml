    RMS 角度扩展计算方法为


    ```

    \(\tau_{\text{RMS}} = \sqrt{\frac{\sum_i \tau_i^2 p_i}{\sum_i p_i} - \left( \frac{\sum_i
    \tau_i p_i}{\sum_i p_i} \right)^2}\) (8.26)

