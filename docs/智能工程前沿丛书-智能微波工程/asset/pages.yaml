  md: '径损耗模型往往只适用于 6GHz 以下的中低频段，而随着 5G/6G 无线通信系统工作频率向毫米波或太赫兹等更高频段演进，高频信号对环境散射体的变化更敏感，需要提出与传输架构和环境特征相适应的路径损耗模型。例如，在毫米波/太赫兹频段，发射信号往往通过畸形波束实现定向传输以弥补较大的路径损耗，而传统的路径损耗模型主要针对全向信道，亟须建立适用于定向传输的定向信道路径损耗模型。


    狭义的路径损耗模型表示在给定传播距离情况下，路径损耗或传播损耗恒定。然而，在实际的传播条件下，由于存在随机的障碍物遮挡（建筑物、人体和树木等因素），造成在给定传播距离的接收功率发生随机变化。通常将这种效应所引起的衰落称为阴影衰落。大量实验结果表明，可以使用符合对数正态分布的随机变量建模阴影衰落。因此，广义的路径损耗模型通常包括因传播距离变化产生的路径损耗和阴影衰落。


    导致电波传播经历较大路径损耗的因素还包括建筑物穿透损耗、植被穿透损耗、人体遮挡损耗等。以建筑物穿透损耗为例，通常包括室外到室内穿透损耗、室内到室内（多墙）穿透损耗等，其损耗建模结果与建筑物材料电参数和物理几何尺寸有关。对于室外存在多栋建筑物的情况，还需要考虑屋顶和街道之间的衍射和散射损耗以及建筑物群的多屏绕射损耗。此外，由于收发端极化失配会导致不同极化组合信道之间的路径损耗差异，全向信道可以将其建模为交叉极化鉴别。而对于每一条传播路径，极化失配导致的路径损耗差异定义为交叉极化比（cross-polarization
    ratio，XPR）。


    # 2. 小尺度信道衰落特性


    由于地形起伏以及环境中存在丰富的散射体，除了从发射端到接收端无任何遮挡的视距直射路径外，电波经过反射、绕射和（或）散射后沿着非视距路径到达接收端。此时，沿着不同传播路径（方向）的电波在接收端进行相干叠加，进而造成天线接收到的电场矢量在幅度和相位上随时间急剧变化，使得信号很不稳定，将这种现象称为小尺度衰落。小尺度衰落描述在一小段时间内或与波长相比较小的一段传播距离内信号在幅度、相位或多径时延和空间角度上的快速波动，它取决于场强时间和空间分布、电波的相对传播时间、传输信号的带宽和空间角度分辨率。在远场条件下，沿着不同传播路径到达接收端的平面波具有随机分布的幅度、相位和到达角。


    根据图 2.11 中所描述的场景不难看出：LOS 场景包含视距和非视距路径，OLOS 场景包含了沿着视距传播方向的遮挡视距和非视距路径，NLOS 场景只包括非视距路径。电波的多径传播造成了小尺度衰落效应，其影响主要体现在：


    +   (1) 在较短的传播时间或传播距离内信号强度的快速变化；'
