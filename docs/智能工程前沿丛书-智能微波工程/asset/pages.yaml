  md: '存在的物理内涵的探索、分析，可以被归类为基于物理知识的阵列天线设计方法。传统的天线阵列综合理论可以有效地解决规则阵的低副瓣或波束成型问题，但在不规则阵的设计中效率不高。启发式优化方法最大的优势是其灵活性，可以在任意的限制条件和设计任务下工作，然而，其相对较慢的收敛速度制约了它在更大的天线阵列综合任务中的适用度。近年来，一些研究通过将特定的天线阵列综合问题转化为凸优化问题进行快速求解。凸优化方法收敛速度快，但其灵活性和扩展性存疑。


    大多数基于物理知识的天线阵列设计和优化方法都忽略阵元间互耦和平台效应对阵列性能的影响。然而，对现代无线通信及雷达中的阵列设计而言，上述效应会严重影响天线阵列的波束质量。全波电磁仿真可以在考虑到上述效应的前提下，提供对现实状况的精确模拟，其代价是高昂的计算复杂度。近年来涌现了一系列将全波电磁仿真与基于物理知识的阵列天线优化和设计方法相结合的混合方法，以期实现更优越的阵列性能[60-73]。其中，对于单元位置固定的阵列综合问题，可以采用基于有源单元方向图（active
    element pattern, AEP）的设计方法处理阵元间互耦和平台效应下的阵列设计问题。文献 [68, 73] 中提出了一种针对线阵的迭代式快速傅里叶变换方法，通过采用最小二乘
    AEP 展开方法，实现了高效的单元位置固定下的阵列综合。文献 [60, 63, 69] 采用迭代式的响应纠正方法，将后续的阵列设计中的单元的 AEP 近似视为已采用全波仿真计算得到的单元中与其最近的单元的
    AEP，从而实现了对线阵和面阵的激励和单元位置的同时优化。总而言之，在考虑阵元间互耦和平台效应的前提下，现有的阵列设计算法仍然难以对阵元的位置及激励进行“自由”地调控以实现设计目标：该过程依赖于对阵元在不同位置、不同电磁环境下的
    AEP 进行快速且精确的预测。


    近年来，机器学习（machine learning, ML）在电磁领域得到广泛研究和应用，并常被用来加速设计和优化流程[66,74-81]。这类 MLAO
    方法采用 ML 电磁仿真数据，试图在设计变量和设计目标之间建立计算复杂度低的代理模型，从而加速设计收敛，可被视为一种数据驱动的方法。电磁领域常用的机器学习方法包括
    ANN[82]、GPR[8,83] 和 SVM[84] 等。利用上述的机器学习方法，基于机器学习建立的代理模型，MLAO 对优化算法中潜在的采样点所对应的响应进行相对可靠的预测。


    在天线阵列的设计和优化中，引入 ML，用来建立阵列位置参数和激励与阵列性能间的联系[7,62,67,70,79,85-89]，从而获得相较于传统方法更优的系统性能或更高的设计效率。在前期的研究中，机器学习直接学习阵列设计参数和互耦效应下的阵列性能间的联系[7]，这种思路可以被看作为纯数据驱动。近期的研究倾向于将天线单元的
    AEP 而非阵列的辐射特性作为机器学习模型的输出，同时利用单元的 AEP 与阵列辐射特性间存在的先验的阵列综合知识，从而降低对计算资源的需求[62,67,70]。文献
    [62] 采用 ANN 对可变阵元位置下的天线单元的 AEP 进行'
