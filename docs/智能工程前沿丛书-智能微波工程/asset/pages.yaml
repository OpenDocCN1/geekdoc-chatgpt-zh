  md: '# # 微波工程简介


    微波工程是无线移动通信、雷达、广播、射电天文等无线电系统以及高速数字电路的基础技术。本章将对微波工程进行简要介绍，共分为以下 3 个部分：微波电路与系统；天线与阵列；电波传播机制与信道建模。


    # ## 2.1 微波电路与系统


    从 20 世纪 20 年代至今，微波电路与系统已形成了一套完整、系统的理论体系和设计方法。本节将对微波电路的基本组件与常用电路进行介绍，为后续引入人工智能技术设计微波器件奠定基础。


    # ### 2.1.1 微波传输线


    微波传输线是用以传输微波信息和能量的各种形式的传输系统的总称，它的作用是引导电磁波沿一定方向传输，因此又被称为导波系统，其所引导的电磁波被称为导行波，图 2.1
    给出几种常用的微波传输线，下面对其分别介绍。


    ![](img/cf98602880e9fcdd502be0d0247f6934_19_0.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1. 双线传输线


    由两根平行的导电金属线（一般为铜、钢或铝线）组成，传送横电磁（trans-verse electro-magnetic, TEM）波的传输线。双线传输线按结构又分为对称型和同轴型两类。我国广泛使用的架空明线、各种对绞电缆和星绞电缆，都属于对称型双线传输线。随着频率的提高，双线传输线的金属损耗和介质损耗都迅速增加，而且传输线的横向尺寸与波长相比已经不能忽略，对设备的制造工艺和维护标准都提出更为严格的要求。特别是对称型双线传输线开放式的电磁场，回路间的耦合也愈为严重，因此传输频率较低。


    # 2. 同轴型传输线


    同轴型传输线 (又称同轴电缆或同轴线) 是一种电线和信号传输线，一般是由共轴线的实心圆柱导体和空心圆柱金属管构成的双导体传输线。同轴电缆主要用于传输横电磁场（TEM）波，也可传输横电（TE）波和横磁（TM）波。根据外导体形状，同轴电缆又分为直壁同轴电缆和波纹同轴电缆。由于波纹同轴电缆具有比较好的灵活与可靠性，弯曲半径性能相比直壁同轴电缆更好，因此，工程应用主要采用波纹管外导体同轴电缆。根据传输性质，同轴电缆又可分为传输电缆和泄漏电缆。传输电缆即为普通馈线，主要用于射频信号传输，而泄漏电缆，其外部导体上有成百上千个小孔（或槽），这些孔对应众多的射频发射点，使得射频功率沿电缆实现多点辐射。泄漏电缆将信号传输、发射与接收集成于一体，具有同轴电缆传输和天线辐射的双重作用，专用于一些公共建筑、隧道、矿井等无线信号难以覆盖的区域。


    # 3. 微带传输线


    微带传输线是用于微波波段的一种不对称传输线，传输准 TEM 波，简称为微带线。其结构形式较多，性能用途也不相同。标准微带线的结构是在较宽的接地金属带上方紧贴一层介质基片，基片的另一侧贴附一条较窄的金属长条。标准微带线是微波集成电路中常用的一种传输线。


    # 4. 波导管传输线


    波导管传输线是由空心导电金属管构成的一种非 TEM 波传输线。波导管常用紫铜、黄铜等良导体制成，内壁常镀有一层导电性能优良的银，使管壁具有很高的电导率。波导管的形状主要有圆形、矩形和椭圆形等。波导管由于管壁导电面积大，电导率高，因而金属热损耗比较小，也没有辐射损耗（场是封闭的）和介质损耗（管内没有固体介质）。波导管传输线一般用于微波波段中厘米波和毫米波频段。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 5. 共面波导传输线


    共面波导传输线的结构类似于微带线，是在微带线的金属导线两侧加上接地板，而在介质基片的底面没有接地。共面波导传输线作为一种性能优越、加工方便的微波平面传输线，在单片微波集成电路
    (monolithic microwave integrated circuit, MMIC) 发挥越来越大的作用，尤其在毫米波频段，共面波导传输线拥有微带线所不可比拟的性能优势。与常规的微带线相比，共面波导传输线具有易于制作，易于实现无源、有源器件在微波电路中的串联和并联
    (无须在基片上打孔)，易于提高电路的密度等优点。


    # 6. 光纤传输线


    光纤传输线是用光导纤维作传输媒质，引导光线在光纤内沿光纤规定的途径传输的传输线。光纤传输线根据传输模式的不同，可分为单模光纤与多模光纤两类。光纤传输线因具有通信容量大、传输距离远、不受电磁干扰、抗腐蚀能力强、质量轻等优点，是
    20 世纪 70 年代出现的一种受到广泛欢迎的微波传输线。


    # 2.1.2 微波器件


    微波器件是指工作在微波波段 (频率为 300MHz~300GHz) 的器件，通过电路设计，可将这些器件组合成各种有特定功能的微波电路。例如，利用这些器件组装成发射机、接收机、天线系统等，用于雷达、电子战系统和通信系统等电子装备。下面将列举一些常用的微波器件。


    # 1. 基本元件


    电阻、电容、电感均为基本元件。频率较低时，集总元件尺寸与波长相差较大，因此依旧可以在低频微波电路中使用；频率较高时，波长与元件尺寸可比拟的情况下，集总元件就失去原有的特性，此时常利用传输线构造所需的元件。但随着超大规模集成电路的发展，片上器件的尺寸越来越小，因此在高频情况下也可以使用集总元件，例如片上螺旋电感、片上电容等。


    # 2. 滤波器


    滤波器是一种选频装置，可以使信号中特定的频率成分通过，且能极大地衰减其他频率成分。利用滤波器的这种选频性能，可以滤除干扰噪声或进行频谱分析。滤波器分为无源滤波器和有源滤波器。无源滤波器是利用电阻、电抗器和电容器等元器件构成的滤波电路，按通过信号的频段又分为低通、高通、带通、带阻和全通
    5 种滤波器。有源滤波器不仅能动态追踪并抑制谐波，而且可以补偿电路中较低的无功分量，根据储能元件的不同，有源滤波器又分为电压型有源滤波器和电流型有源滤波器。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 3. 天线


    天线是一种变换器，它把传输线上传播的导行波变换成在无界媒介（通常是自由空间）中传播的电磁波，或者进行相反的变换。在无线电设备中，天线是被用来发射或接收电磁波的器件。无线通信、广播、电视、雷达、导航、电子对抗、遥感、射电天文等系统，凡是利用电磁波传递信息的，都需要依靠天线进行工作。此外，在用电磁波传输能量方面，非信号的能量辐射也需要天线。一般天线都具有可逆性，即同一副天线既可用作发射天线，也可用作接收天线。天线将在
    2.2 节中详细介绍。


    # 4. 功率分配器（功分器）


    功率分配器是一种将一路输入信号能量分成两路或多路输出相等或不相等能量的器件，也可反过来将多路信号能量合成一路输出，此时也可称为合路器。一个功率分配器的输出端口之间应保证一定的隔离度。功率分配器也叫过流分配器，分为有源、无源两种，可平均分配一路信号为多路输出，一般每分一路都有几分贝（dB）的衰减，信号频率不同，分配器衰减也不同。


    # 5. 混频器


    混频器是输出信号频率等于两路输入信号频率之和、差或为两者其他组合的电路。混频器通常由非线性元件和选频回路构成。混频器根据工作性质可分为加法混频器和减法混频器；根据电路元件可分为三极管混频器和二极管混频器；根据电路工作方式可分为有源混频器和无源混频器。混频器的设计通常需要考虑转换增益、线性度、噪声系数、端口之间的隔离度以及功耗等性能指标。


    # 6. 放大器


    放大器可看成是微波系统中的正反馈系统，一般位于收发链路上。以无线移动通信为例，由于考虑无线传输的链路衰减，发射端需要辐射足够大的功率才能获得比较远的通信距离，因此发射链路上的射频功率放大器主要负责将功率放大到足够大后馈送到天线辐射出去。而信号在经过长距离传输后，到达接收端时可能已经非常微弱，需要利用低噪放大器将其增强从而进行下一步处理。放大器是无线电系统的核心器件。


    # 7. 变压器


    变压器广泛应用于小功率电子线路中，用于实现阻抗匹配、直流隔离、共态抑制、平衡与不平衡变换等。一般射频变压器通过磁耦合的两组线圈构成。当在射频变压器的初级线圈上施加一个交流电压时，就会产生一个变化的磁通（磁通的大小依赖于所加的激励电压和初级线圈的匝数），此磁通在次级产生一个电压，'
  merge: -1
  img_proc: true
- pgno: 23
  md: '其大小由次级线圈的匝数决定，通过设计初、次级的匝数比，便可获得所需要的电压比。简单的磁耦合可以通过空气来完成，但更有效的磁耦合是通过比空气磁导率更高的铁心或铁氧体来实现的。


    # 8. 衰减器


    衰减器是一种提供能量衰减的微波器件，广泛应用于电子设备中，其主要用途：调整电路中信号的大小；在比较法测量电路中，可用来直接读取被测网络的衰减值；也可用于改善阻抗匹配，若某些电路要求有一个比较稳定的负载阻抗时，则可在此电路与实际负载阻抗之间加入一个衰减器，以缓冲阻抗的变化。


    # 9. 振荡器


    振荡器是用来产生重复电子信号（通常是正弦波或方波）的电子元件，其构成的电路叫振荡电路。它能将直流电转换为具有一定频率的交流电信号输出。振荡器按振荡激励方式可分为自激振荡器、他激振荡器；按电路结构可分为阻容振荡器、电感电容振荡器、晶体振荡器、音叉振荡器等；按输出波形可分为正弦波振荡器、方波振荡器、锯齿波振荡器等。


    # 10. 移相器


    移相器是一种能够调整电磁波相位的微波器件。电磁波在任何介质中传导过程都会产生相移，早期模拟移相器就是基于该现象实现的；现代电子技术发展后利用模数变换器和数模变换器实现数字移相，顾名思义，数字移相器是一种不连续的移相技术，其主要优点是移相精度高。


    # 2.1.3 微波电路


    微波电路是工作在微波波段，由无源器件、有源器件、传输线和互连线集成在一起，具有某种功能的电路。以下列举一些常用的微波电路。


    # 1. 超外差接收机


    图 2.2 给出典型的超外差接收机原理图，超外差接收机将天线接收的信号通过


    ![](img/cf98602880e9fcdd502be0d0247f6934_23_0.png)


    图 2.2 超外差接收机原理框图'
