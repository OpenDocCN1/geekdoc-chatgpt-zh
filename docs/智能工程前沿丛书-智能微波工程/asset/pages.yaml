    图 3.4 多层前馈神经网络


    如果训练复杂的多层神经网络，还需要强大的学习算法。常用的 ANN 训练优化机制包括玻尔兹曼机算法、误差逆传播（backpropagation，BP）算法、模拟退火算法、马尔可夫算法等。在射频和微波工程领域，训练
    ANN 通常使用拟牛顿法或量化共轭梯度法等。


    +   传统的基于 ANN 的设计方法有三个主要的缺陷：

    +   (1) 产生足够的训练和测试样本需要可观的时间成本；

    +   (2) 最优解落在训练域外时，变得不可靠；

    +   (3) “维数诅咒”，拟合一个函数所需要的学习样本随着维数和它的平滑度之间的比值呈指数增长。


    基于 ANN 的优化设计方法的主要缺陷可以通过在神经网络训练架构中加入与模型相关的信息来缓和，通常是根据经验主义函数或等效电路模型获得的一个粗糙模型，主要有以下四种优化策略：


    +   1) EM-ANN 综合法

    +   EM-ANN 综合法也叫差分法，是训练相关的神经网络近似粗糙模型和精细模型响应之间的差值，模型建成后将综合粗糙模型和 ANN 进行快速的优化设计。

    +   2) 先验输入方法

    +   粗糙模型响应、设计参数和独立变量一起作为 ANN 的输入，训练后的神经网络更接近精细模型响应，与最初的粗糙模型相比，优化的计算成本更低，相比于 EM-ANN
    综合法，这种方法得到的 ANN 模型更复杂，准确度得到提高。'
