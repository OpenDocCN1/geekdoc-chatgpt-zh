- pgno: 132
  md: '步骤 3. ITR 所对应的 WCP 计算。对所采样得到的 ITR 向量 $\boldsymbol{\omega}_i$，采用前一节所述的 WCA 方法，搜索其所对应的
    WCP 性能 $\boldsymbol{w}_i$，从而构建机器学习所需的数据集。$Q$ 个给定的设计目标，对一个 ITR 向量的 WCA 需要进行 $Q$
    次。因此，可能存在数目 $N_{\text{WCP}}$ ($N_{\text{WCP}} \leqslant Q$) 个 WCP 设计点 $\boldsymbol{x}_{\text{WCP}}$。


    步骤 4. 代理模型训练。考虑到数据集的大小，采用包括单输出 GPR(SOGPR) 或 ANN 等在内的机器学习方法，使用步骤 3 构建的数据集来建立机器学习代理模型。采样得到的
    ITR 向量 $\boldsymbol{\omega}_i$ 被视作机器学习模型的输入参数 $\boldsymbol{X}$，而相对应的 WCP 响应 $\boldsymbol{w}_i$
    被视作输出 $\boldsymbol{y}$。若使用单输出的机器学习方法（如 SOGPR），则需要建立 $Q$ 个相应的代理模型。


    步骤 5. 基于代理模型进行优化。在 MITH 搜索的过程中，通常采用启发式的全局优化方法实现质量更高的优化效果。此处给出一种新的适应度函数 $f_{\text{MITH}}$
    的定义方式：


    $f_{\text{MITH}} = \begin{cases} D(\boldsymbol{F}(\boldsymbol{x}), \Omega_{\mathbf{s},
    \Delta}), & \boldsymbol{F}(\boldsymbol{x}) \notin \Omega_{\mathbf{s}, \Delta}
    \\ -T_{\text{ITH}}(\boldsymbol{x}), & \boldsymbol{F}(\boldsymbol{x}) \in \Omega_{\mathbf{s},
    \Delta} \end{cases} \quad (6.10)$


    式中，$D(\boldsymbol{F}(\boldsymbol{x}), \Omega_{\mathbf{s}, \Delta})$ 代表此处需要用到的
    WCP 和 OTR 间的“距离”的概念：


    $D(\boldsymbol{F}(\boldsymbol{x}), \Omega_{\mathbf{s}, \Delta}) = \sum_{q=1}^{Q}
    \max\{\min\{|\max\{f_q(\boldsymbol{t})\} - (y_q + \Delta_q)|, |\max\{f_q(\boldsymbol{t})\}
    - (y_q - \Delta_q)|\}, 0\} \quad (6.11)$


    当 $\boldsymbol{F}(\boldsymbol{x}) \notin \Omega_{\mathbf{s}, \Delta}$，即 WCP 不在
    OTR 中的情况下，$f_{\text{MITH}}$ 为正值；当所得到的 WCP 逼近 OTR 时，$f_{\text{MITH}}$ 则会逐渐下降。当
    $\boldsymbol{F}(\boldsymbol{x}) \in \Omega_{\mathbf{s}, \Delta}$，即 WCP 进入 OTR
    中后，$f_{\text{MITH}}$ 变为负值，且随着 $T_{\text{ITH}}$ 的增大而继续减小。此处构造的适应度函数可以很好地提供连续的优化空间：在
    WCP 不满足 OTR 的情形下，优化算法会倾向于寻找更合适的 ITR 向量设计点，使 WCP 朝向满足 OTR 的情形演化；在 WCP 满足 OTR 的情形下，优化算法会倾向于寻找
    $T_{\text{ITH}}$ 更大的 ITR 向量设计点，从而可以更有效地对 MITH 进行搜索。


    步骤 6. ITR 验证。由步骤 5 优化得到的 ITR 向量设计点通过实际的 WCP 搜索步骤进行验证，并检查终止标准是否被满足。终止标准通常被设定为最大的迭代次数
    $N_{\text{iter}}$，或最大的有效结果的个数 $N_{\text{num}}$ 等。如果满足终止条件，算法即可对所得到的最优 ITR 向量设计点及其所对应的
    WCP 结果及 $f_{\text{MITH}}$ 进行输出；若终止条件未满足，则返回步骤 4。通过这样的迭代过程，算法对满足 OTR 的 ITR 向量设计点构成的集合进行搜索，找到其中
    MITH 最大的设计点。


    本节中所给出的基于 MLAO 的 MITH 搜索方法是一种嵌套循环的结构，也就是使用 WCP 搜索过程作为 MITH 搜索过程的高精度仿真及验证的过程。文'
