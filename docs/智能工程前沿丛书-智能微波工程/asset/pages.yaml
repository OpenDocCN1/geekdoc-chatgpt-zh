- pgno: 54
  md: '# ## 3.2 机器学习技术简介


    # ### 3.2.1 监督学习


    监督学习是根据已有数据集，知道输入和输出结果之间的关系，然后根据这种已知关系训练得到一个最优模型。也就是说，在监督学习中，训练数据应该既有特征又有标签，然后通过训练，使得机器能找到特征和标签之间的联系，然后在面对没有标签的数据时可以判断出标签。在监督学习的范畴中，又可以划分为回归和分类。常见的监督学习算法有以下几种：


    +   1) k 近邻算法


    k 近邻算法 (k-nearest-neighbor, KNN) 是一种分类算法，如果一个样本能在样本的特征空间中找到 k 个最相似 (特征空间中最邻近)
    的样本且这些样本大多属于同一种类别，那么该样本也属于这个类别。一般来说，k 是不大于 20 的整数，且在计算过程选择最邻近的样本均为已经正确分类的对象。


    +   2) 决策树


    决策树是一个树状结构，树中每个节点代表一个特征属性，非叶节点代表一个特征属性上的测试，分支路径代表某种特征属性在某个值域上的输出。决策树的决策过程就是不断分隔训练数据，使得分隔得到的各个子集尽可能纯净，即各个子集中的数据实例标签尽可能一致。在实际构成决策树的过程中，需要剪枝来规避过分拟合。


    +   3) 朴素贝叶斯


    朴素贝叶斯是应用较为广泛的分类算法之一，它是基于贝叶斯定理，因此朴素贝叶斯假设给定目标值时，假设不同类别之间没有相关性，即完全独立。在预测分类时朴素贝叶斯算法计算未知样本分到每个类别的概率，从中挑选概率最大的一种作为分类预测结果。


    +   4) 逻辑回归


    逻辑回归也是一种分类算法，主要应用于二分类问题。逻辑回归与线性回归相似，都是根据已知数据集求函数，然后要求尽可能拟合数据使损失函数最小。


    # ### 3.2.2 无监督学习


    无监督学习和监督学习最大的不同是监督学习中数据是带有一系列标签。在无监督学习中，需要采用某种算法训练无标签的训练集从而能找到这组数据的潜在结构。无监督学习大致可以分为聚类和降维两大类。


    +   1) k 均值聚类


    k 均值聚类 (k-means) 就是将数据聚类分成不同的组。首先选择 k 个随机点作为聚类中心；接着对于数据集中的每一个数据，按照距离 k 个中心点的距离，'
  merge: -1
  img_proc: true
- pgno: 55
  md: '将各个数据与距离最近的中心点关联起来，与同一个中心点关联的所有点聚成一类；然后再计算每一个组的平均值，将该组所关联的中心点移动到平均值的位置。再以移动后的中心点作为聚类中心进行迭代，直到收敛。尽管
    k 均值聚类是一个简单高效的聚类算法，但其仍然存在一些缺点：不能保证定位到聚类中心的最佳方案；k 均值无法指出使用多少个类别。


    # 2) BIRCH 聚类


    BIRCH (balanced iterative reducing and clustering using hierarchies，利用层次方法的平衡迭代规约和聚类)
    是属于树状结构的层次聚类算法的一种，这个树状结构类似于平衡 B+ 树，一般称之为聚类特征树，这棵树的每个节点是由若干个聚类特征 (clustering feature，CF)
    组成。简单说，BIRCH 聚类算法的主要过程就是将所有的训练集样本建立聚类特征树，然后对应的输出就是若干个 CF 节点，每个节点的样本点就是一个聚类的簇。一般来说，BIRCH
    聚类适用于样本量较大的情况，并且除了聚类，BIRCH 聚类也可以额外做一些异常点检测和数据初步按类别规约的预处理。


    # 3) 高斯混合模型


    高斯混合模型 (gaussian mixture model，GMM) 是单一高斯概率密度函数的延伸，它能够平滑地近似任意形状的密度分布。GMM 使用多个高斯分布的组合来刻画数据分布，因为
    GMM 含有隐变量，所以要用含有隐变量模型参数的极大似然估计法。然而，因为直接求解极大似然函数极值对应的参数比较困难，所以高斯混合模型也像 k 均值聚类那样使用迭代算法进行计算，最终收敛到局部最优。


    # 4) 主成分分析


    主成分分析 (principal component analysis，PCA) 是最为常用的降维算法，是通过线性变换将原始数据变换为一组各维度线性无关的表示，可以用于提取数据的主要特征分量。该算法大致步骤是：先将数据进行中心化处理，计算出训练集中的所有样本的均值，再将训练集中的每个样本减去均值得到新的数据集；接着求新数据集的协方差矩阵、该协方差矩阵的特征值以及对应的特征向量；然后将特征值由大到小的顺序排列，选取前
    k 个特征值并将这些选取的特征值分别作为列向量组成特征向量矩阵；最后将样本点投影到目标空间上。PCA 技术特点是完全没有参数限制。在 PCA 的计算过程中完全不需要人为的设定参数或是根据任何经验模型对计算进行干预，最后的结果只与数据相关。


