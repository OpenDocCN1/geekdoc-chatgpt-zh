    t 分布邻域嵌入式算法 (t-distributed stochastic neighbor embedding, t-SNE) 作为一种非线性降维算法，非常适用于高维数据降到
    2~3 维，进行可视化。除了在图像领域应用较多外，在自然语言处理 (natural language processing, NLP)、基'
