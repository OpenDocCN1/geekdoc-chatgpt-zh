    步骤 6. 对优化结果进行验证。对优化得到的设计参数及对应的由代理模型预测的 MITH 结果，采用基于 MLAO 的 MITH 搜索方法进行验证，而其电磁特性利用全波仿真方法进行验证。满足终止条件时，输出鲁棒优化结果，不满足则将验证的数据加入数据集中，回到步骤
    4 继续迭代过程。终止条件可以设置为最大的迭代次数或最大的最优值未改变的迭代次数。


    在本节所述的鲁棒优化过程中，利用基于 MLAO 的 MITH 搜索确保优化结果的精度及鲁棒性。图 6.3 给出所提出的 ML-MLAO 的核心思想，即利用机器学习方法对天线的性能、WCP
    和 MITH 建立代理模型，从而将 MLAO 引入鲁棒设计的多个层级，加速设计收敛。利用在设计参数和天线响应间建立的代理模型 \(R_{s1}\)，计算不同设计点的
    WCP 值，并由此建立设计参数和 WCP 间的代理模型 \(R_{s2}\)。基于以上两种代理模型，可以通过基于 MLAO 的 MITH 搜索方法对一系列的设计点搜索其
    MITH，并由此建立天线参数和其对应的 MITH 之间的代理模型 \(R_{s3}\)。本章所提出的 ML-MLAO 的算法思想提供了一种高效的建立代理模型、对新的设计点进行预测、对代理模型进行在线更新的方法。第
    7 章将通过一系列天线与阵列的设计实例，讨论 ML-MLAO 的有效性和效率。


