    # 6.3.4 串馈天线的鲁棒设计


    与上述的阵列综合问题不同，对天线的优化设计和鲁棒性设计依赖于机器学习方法所建立的代理模型的预测精度。对设计参数变化范围较大的天线设计问题，在计算时间有限的情况下，通常难以在整个设计范围内获得较为精确的代理模型。因此，通常考虑在可能的最优设计点附近进行采样，建立局部的代理模型，并在设计优化过程中通过在线更新的方式提升代理模型的精度。此处，将天线的鲁棒设计分为优化设计和鲁棒优化两个步骤进行。


    在优化步骤中，可以将经典的 MLAO 方法与包含禁止区域的优化策略相结合，从而尽可能多得到局部最优点。通过多次 MLAO 优化，并在每次优化时，将之前所得到的最优点周围设立禁止区域，增强优化算法对全部设计空间的搜索能力。在优化步骤结束后，可将已获得的数据集用来建立鲁棒设计步骤所需的代理模型，同时，将所优化得到的一系列设计点作为鲁棒设计的初始设计点，从而尽可能地在计算复杂度和算法的探索之间获得平衡。


    在鲁棒优化步骤中，采用 ML-MLAO 在优化步骤所获得的初始设计点附近寻找更为鲁棒的设计点。对同时考虑天线性能及天线鲁棒性的多目标优化任务而言，算法对帕累托前沿
    \( P_{\text{pre},i,j} \) 和相对应的最差情况 \( w_{i,j} \) 进行预测，其中 \( i \) 和 \( j \) 分别表示外层迭代和内层迭代的序号。在内层迭代中，基于目前所有的代理模型，使用
    ML-MLAO 对帕累托前沿进行预测。在外层迭代中，通过在帕累托前沿对'
