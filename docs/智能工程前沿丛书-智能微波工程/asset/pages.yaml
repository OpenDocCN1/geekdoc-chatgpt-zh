  md: '额外的能量损耗，造成在接收端具有不同幅度、相位和时延的多径信号矢量叠加。而随机的幅度和相位导致小尺度衰落和信号失真，并且较大的时间色散容易造成码间干扰。同时，环境散射体的相对移动造成多径分量的时变多普勒频移。


    +   2) 收发信机配置


    随着空间分集或空间复用技术的引入，通过采用大规模天线阵列可以提高 EIRP，实现远距离稳定传输。因此，随着天线阵列规模的增大，提高了系统对来自不同方向多径信号的空间角度分辨能力。同时，收发信机之间的相对移动导致多普勒频移引起的随机频率调制。


    +   3) 传输信号带宽


    如果传输信号带宽大于无线信道带宽，此时接收信号将产生失真。但接收信号的场强在本区域内不会产生衰落，即小尺度衰落不明显。其中信道带宽为相干带宽（coherence
    bandwidth），表示信号在幅度上强相关时的频率之差。当传输信号的带宽小于信道带宽时，信号的幅度将会发生快速变化，但信号在时间上不会失真。


    无线信道的小尺度衰落特性与信道参数（如时延和角度色散参数、多普勒频移）和信号参数（如带宽、符号周期）有关。根据多径分量在时延域、多普勒频移以及空间角度域的分布情况，可以推导得到信道在空-时-频域上的选择性特征。这里的信道选择性特征指的是信道的增益系数的幅度随着不同的时间观测点、频率观测点和空间位置观测点的改变而发生变化。基于多径时延的色散特性，可以将小尺度衰落分为平坦衰落和频率选择性衰落。当无线信道具有固定的增益和线性相位且相干带宽大于传输信号带宽时，接收信号将发生平坦衰落。在平坦衰落信道中，传输信号带宽的倒数远大于多径信道的时延色散。如果无线信道具有固定增益和线性相位且相干带宽小于信号带宽，则接收信号将发生频率选择性衰落。此时，信道冲激响应的多径时间色散将大于传输信号带宽的倒数，进而导致接收信号为多个具有一定时延的衰减信号的叠加，并将引起接收信号的失真。对于频率选择性衰落，发射信号的带宽大于信道的相干带宽，因此其又被认为是宽带信道。根据传输的基带信号相对于信道变化率的快慢变化，小尺度衰落又分为快衰落和慢衰落。在快衰落信道中，信道的冲激响应在码字持续时间内快速变化，即信道的相干时间小于传输信号的码字周期。这将会由于多普勒效应而引起时间选择性衰落，从而导致信号失真。多普勒扩展越严重，由于快衰落引起的失真就越严重。在慢衰落信道中，信道冲激响应的变化要比所传输的基带信号慢得多，可以假定信道在一个或几个带宽倒数的时间间隔内是静止的。信号的快衰落或慢衰落是由于收发信机和环境散射体相对移动速度和基带信号所决定的。


    小尺度衰落的统计特性可以采用不同的分布进行表征和建模。当传播环境中不存在信道增益明显高于其他传播路径的 LOS 或 NLOS 路径时，通常用瑞利（Rayleigh）分布来描述衰落包络的随机变化特征。当传播环境中存在稳定的
    LOS'
