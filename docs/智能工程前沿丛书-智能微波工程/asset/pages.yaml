  md: "应的设计点附近进行随机采样，并利用全波仿真对其响应进行计算，从而对所有\n代理模型进行更新。在每次多目标优化之前，都对所有优化目标进行单目标优化，\n\
    并将其结果作为多目标优化的初始点，以此提高多目标优化的效率[115]。\n\n在内层迭代中，通过全波仿真验证算法预测得到的天线性能响应 \\( P_{pre,i,j}\
    \ \\)，继\n而更新针对天线性能的代理模型。在此之后，更新 \\( P_{pre,i,j} \\) 所对应的 MITH，并将\n更新后的帕累托前沿命名为\
    \ \\( P_{vall,i,j} \\)。内层循环的终止条件可以设置为最大的内层\n迭代次数 \\( J \\) 等。当内层循环的终止条件满足时，算法将切换到外层迭代，并在帕累\n\
    托前沿 \\( P_{vall,i,j} \\) 上每个设计点的周围进行随机采样 \\( N_s \\) 次，并使用全波仿真对其响\n应进行计算。可以将随机采样的范围设置为以设计点和\
    \ WCP 点的中点为中心，以\n\\( k_s \\times D_s \\) 为半径的区域内，其中 \\( D_s \\) 为设计点与中点间的距离，\\\
    ( k_s \\) 为系数。在此基\n础上，对天线响应、WCP 和 MITH 的代理模型进行在线更新，重新计算 \\( P_{vall,i,j} \\)\n\
    上的设计点所对应的值，并将其命名为 \\( P_{val2,i} \\)。通常选取比 1 稍大的 \\( k_{sam} \\) 系数，\n从而在设计点所预测的\
    \ ITR 周围建立精度更高的代理模型。\n\n基于经过验证的天线响应和设计参数容差，对帕累托前沿进行最终更新并将\n其命名为 \\( P_{upd,i}\
    \ \\)，并将其视为外层迭代的最终高精度结果。相较于 \\( P_{val2,i} \\)，\\( P_{upd,i} \\)\n避免了预测精度带来的不可避免的损失。外层迭代的终止条件可设置为最大的外\n\
    层迭代次数 \\( I \\)，或设计允许的最大计算时间等。本节中的 ML-MLAO 采用一种 2\n层的嵌套式迭代结构，从而可在算法过程中不断提升代理模型的预测精度。\n\
