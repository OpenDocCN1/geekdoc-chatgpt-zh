- pgno: 183
  md: '间直射路径方向，但毫米波信号经过植被遮挡后会明显增大簇内信道的时延和角度扩展，并且毫米波穿透树木会造成额外的穿透损耗。同时，由于毫米波对环境散射体敏感，随着收发信机以及植被遮挡间相对位置的变化，相应的簇内信道特性也呈现一定变化。然而，传统的物理统计信道模型中无法刻画簇内信道特性随收发位置变化的情况，现有的纯数据驱动智能信道模型并未充分考虑环境特征的影响。因此，为了利用
    8.2.2 节中提出的知识和数据混合建模方法准确刻画这一特性，首先需要在特定场景开展定向信道测量，消除其他环境散射体对信道的影响；同时，针对在前向植被散射方向上接收信号的空时传播特性开展研究，避免了因多径分簇算法引入的结果不确定性。此外，由于实测信道数据获取困难，需要在相同场景开展射线追踪信道仿真以保证足够的数据集用于
    ANN 模型训练，同时需要对信道实测和仿真数据的一致性进行验证评估。对于植被散射簇需要关注树木穿透损耗和簇内信道时延和角度扩展。此时，在生成 CIR 时植被遮挡效应被直接考虑在内，而无须像
    3GPP 模型中额外增加步骤考虑障碍物的影响。根据不同系统配置和接收机与散射体相对位置，可以探明其对信道特性的影响，并作为 ANN 的输入标记相应的数据点。根据标记数据集进行
    ANN 模型训练，其中包括训练数据集、测试数据集和验证数据集。模型训练结果需要在其他场景完成验证，以保证其在多场景信道预测中通用性。


