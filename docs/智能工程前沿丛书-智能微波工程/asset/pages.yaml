  md: '献 [5] 利用 ANN 建立了微带天线主模的设计谐振频率，以及介质基板的介电常数、厚度与贴片天线长度之间的映射关系。2019 年，东南大学的崔铁军教授课题组利用多层卷积神经网络建立了超材料结构的反射相位及其结构参数之间的关系，预测精度达到了
    90.05%，并成功应用于圆极化反射阵的设计[6]。然而，在很多场合，天线智能设计所需的数据获取困难，即使有办法获得数据但其成本极其高昂，这就造成了小样本集的场景，选用
    ANN 作为机器学习方法容易带来过拟合的问题。与其相比，支持向量机（support vector machine, SVM）方法在小样本集条件下拥有更优秀的泛化性能。2007
    年，西班牙的研究者将 SVM 应用于阵列综合中，直接建立由天线单元的幅相信息与最终的全波仿真得到的方向图之间的联系，从而在阵列综合中将天线单元间的互耦纳入考量[7]。近几年，高斯过程回归机器学习（GPR
    machine learning, GPR-ML）在电磁领域受到广泛的关注和青睐。相比于 SVM，GPR-ML 具有同时得到预测点处的响应和不确定性的特性，因此可以更有效地寻找到全局最优点。2013
    年，将 GPR-ML 和差分进化算法（differential evolution algorithm, DEA）相结合，文献 [8] 提出了一种代理模型辅助的差分进化法（surrogate
    model assisted differential evolution for antenna synthesis, SADEA），可以有效解决包括天线的反射系数、互耦、增益等的优化设计问题。冰岛雷克雅未克大学的
    Koziel 教授及其课题组在应用 GPR-ML 进行天线设计的领域做了大量卓有成效的研究工作，包括利用多精度的全波仿真数据，快速得到天线的单目标[9] 和多目标设计结果[10]
    等。相较于传统方法，人工智能方法的引入可以大大降低对计算资源和时间的需求，从而突破传统方法下性能和设计效率的瓶颈，并将天线与阵列的设计与优化推广到更多参数、更高结构复杂度和更多目标的范畴。


    # 1.1.3 电波测量与信道建模


    无线移动通信持续快速发展，载波频率不断升高，毫米波无线移动通信已经开始大规模部署应用。无线移动通信的电波传播场景越来越复杂，而且随着大规模多输入多输出（massive
    multi-input and multi-output, mMIMO）技术的应用，移动通信基站装备的天线数目越来越多，终端设备也已装备多天线。以上这些情况导致电波传播相关的参数估计和信道建模的难度和复杂度不断攀升。传统方法难以解决这类复杂的问题。相关的研究结果表明，人工智能等新技术有望被用来突破这类复杂问题中的瓶颈[11-15]。文献
    [14,15] 是由两部分组成，其中第一部分是对机器学习使能的信道特性和天线-信道优化的综述[14]；第二部分回顾了场景识别和通道建模的研究现状[15]，也给出基于人工智能或机器学习的信道数据处理技术所面临的挑战。


    已有的研究结果表明，基于几何的随机建模和仿真方法很难预测实际场景中'
