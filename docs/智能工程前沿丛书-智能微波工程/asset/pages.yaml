    # 图 4.6 超宽带平面偶极子天线在全波仿真软件 CST [45] 中的仿真结果


    首先通过拉丁超立方采样 \(N_L = 40\) 个低保真度初始样本 \(\boldsymbol{X}_L\)，然后从 \(\boldsymbol{X}_L\)
    中选择 \(N_H = 5\) 个样本，作为高保真度样本。将初始样本代入全波仿真得到对应的反射系数，并将频带内反射系数的最大值作为代理模型的输出，对代理模型进行训练。优化算法中的适应度函数为


    ```

    \(f(\boldsymbol{x}_i) = \min_{\boldsymbol{x}_i} \{ \tilde{R}_S(\boldsymbol{x}_i)
    - \omega_i R_S^c(\boldsymbol{x}_i) \}, \quad i = 1, 2, \cdots, M \quad (4.27)\)

    ```


    式中，\(\tilde{R}_S(\boldsymbol{x}_i)\) 为预测值；\(R_S^c(\boldsymbol{x}_i)\) 为预测的不确定度。优化终止条件为达到优化目标或者进行
    50 次迭代。


