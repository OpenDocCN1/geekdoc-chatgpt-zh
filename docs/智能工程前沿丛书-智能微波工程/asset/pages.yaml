- pgno: 161
  md: '值，还可以返回置信区间。因此，为了避免算法陷入局部最优，置信下界（lower confidence bound, LCB）方法在优化中被广泛采用，然而
    LCB 常数的选择往往依赖于设计者的经验。LCB 常数选取不当，会降低收敛的速度和算法的性能。对于最小值优化问题利用置信下界方法将适应度函数设置为：


    \(R(x) = \min\{y(x) - \alpha s(x)\}\) (7.19)


    式中，\(\alpha\) 为 LCB 值；\(y(x)\) 为预测均值；\(s(x)\) 为预测标准差。当 LCB 值设置较小时，算法会倾向于寻找均值的最小值而忽略方差的影响，而实际上最优值往往并不会恰好出现在均值上，较大的
    LCB 值可以增加算法的探索性从而找到更好的目标，但可能会导致算法无法收敛。文献 [142] 提出一种多路径优化方法，通过设置多个 LCB 值来避免因 LCB
    常数设置不当而导致的算法收敛过慢或陷入局部最优，从而确保算法的有效性和鲁棒性。然而，多 LCB 值会导致额外的计算开销，因此 ASSI-HKDT 算法中 LCB
    的个数与 LCB 值都随着迭代次数的增加而减少，使得该算法在优化初期有着良好的探索性，而后期逐渐趋于稳定。


    除了几何参数上的约束，优化过程加入拓展 Wheeler 公式约束也可以使设计的电感曲线更平稳。如图 7.12 所示，两条曲线都满足在 40GHz 处 1nH
    的电感指标，显然曲线 2 更不平稳，在带宽要求更宽时表现更差，因为它的直流电感值较低故不满足约束式 (7.16)。


    ![](img/cf98602880e9fcdd502be0d0247f6934_161_0.png)


    # 图 7.12 平稳的电感曲线与不平稳的曲线对比


    步骤 5. 验证与输出。对步骤 4 中不同路径下的最优几何参数分别建模和仿真，将所有路径的优化结果都加入样本集，并判断是否有样本满足设计要求，如果没有，则返回步骤
    3 重新训练代理模型，否则输出满足目标的几何参数与模型。该算法不仅有着出色的效率，还保持着较好的收敛稳定性，接下来通过仿真实验来展示该算法的能力。片上可变螺旋电感自动综合程序源代码参见附录
    E。'
