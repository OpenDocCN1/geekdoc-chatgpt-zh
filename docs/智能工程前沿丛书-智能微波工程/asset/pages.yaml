  md: '即 MITH 搜索。在可靠的 WCA 的基础上，MITH 搜索被视为更高一层的优化问题。与 ITR 类似，OTR 可以被定义为


    \(\Delta \equiv [\Delta_1, \cdots, \Delta_Q]^T, \Delta_q \geqslant 0\) (6.7)


    在此基础上，输出容差的范围可以被表示为


    \(\Omega_{s,\Delta} \equiv \{y | (y_q - \Delta_q \leqslant s_q \leqslant y_q +
    \Delta_q, q \in \mathbb{Q}) \}\) (6.8)


    式中，\(s = [s_1, s_2, \cdots, s_Q]^T\)。由此，MITH 搜索可以被表示为


    \(\max T_{ITR}(x), \text{s.t. } F(x) \in \Omega_{s,\Delta}\) (6.9)


