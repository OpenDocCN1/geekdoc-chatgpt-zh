    # 6.1.2 鲁棒设计的分层策略


    多数鲁棒设计、敏感性分析及容差分析的方法用于解决两类不同的问题：一是在已知输入容差的前提下，如何寻找设计的输出容差；二是在限定输出容差的前提下，如何确定设计的输入容差。对于第一类问题，研究者倾向于所设计的结构参数在给定的输入容差范围内变化时，天线射频等器件性能的表现，包括蒙特卡洛仿真（Monte
    Carlo simulations）[93,102]或搜索策略[99,103]等在内的方法常用于解决该类问题。一个常用的策略是在给定的设计点的输入容差范围内，寻找可能出现的最差情况性能（worst-case
    performance, WCP），这类方法通常被称为 WCA[99,105]。然而，传统的蒙特卡洛仿真或搜索策略通常需要数量巨大的仿真次数，而全波仿真算法单次仿真就需要不小的计算资源。为了缓解这种矛盾，一些传统的
    WCA 方法倾向于假定天线设计的最差情况仅出现在输入容差构成的不确定集合的边界上[102]；而另一些方法利用包括随机采样等在内的策略来表示给定的设计的 WCP
    特性[92,101]。然而，大多数上述的策略都无法保证获得 WCP 的质量，主要原因是 WCP 所对应的设计点有相当大的概率在所考虑到的边界或采样点之外。因此，包括遗传算法（genetic
    algorithm, GA）[106]和粒子群算法（particle swarm optimization, PSO）[99]等在内的进化类算法（evolutionary
    algorithms, EAs）常用于设计空间内搜索，从而获取质量更高的 WCP。尽管如此，这类启发式的算法通常面临一个严重的问题，也就是说它们通常都需要大量的对适应度函数的计算，以确保优化结果的性能，而为了获得天线设计的高精度响应所必需的全波仿真方法通常意味着非常大的计算资源消耗。


    如图 6.1 所示，针对第一类问题的 WCA 方法构成天线与射频鲁棒设计的基础。针对第二类问题的研究构成天线鲁棒设计的中间过程。一种常用的解决第二类问题的方法是定义一个代表输入容差的超立方体（hypervolume），继而在给定的输入容差的限制下，寻找可能的
