    # 8.3.3 人工神经网络结构与训练


    人工神经网络主要由一系列相互连接的神经元构成，指定了网络中的神经元连接权重、神经元激励值等变量，以及神经元之间的拓扑关系。可以将 ANN 看作一种适用于非线性统计性数据的建模工具，通过训练样本的校正，对每一个神经元各个突触的权值进行学习或校正，进而创建相应的模型。一种最简单的前馈多层神经网络包括输入层、隐藏层和输出层，其中输入层、输出层神经元数目由已知参数以及预测参数决定，隐藏层的层数和神经元数目越多，模型的非线性和普适性越强，相应的模型训练开销越大，同时过大的隐藏层神经元数会导致过拟合，因此，需要选择合适的隐藏层神经元数在保证模型拟合误差的同时降低模型结构复杂度和训练精度。


    基于信道实测和仿真数据，以及通过物理统计信道模型所研究得到影响植被散射簇内信道特性的系统配置和环境因素，神经网络的输入参数包括收发信机的几何位置、植被内传播距离、发射天线下倾角以及用于数据标记的环境特征，神经网络的输出参数包括植被穿透损耗、簇内时延扩展和角度扩展。此时，神经网络的输入参数向量
    \( x \) 和输出信道参数向量 \( y \) 满足关系：'
