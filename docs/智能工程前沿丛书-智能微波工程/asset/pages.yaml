- pgno: 133
  md: '献 [92] 介绍了一种高效的基于采样策略 (sampling strategy, SS) 的 MITH 搜索方法，并采用代理模型来预测天线的性能响应，其核心思想是：首先基于随机的采样方法对
    MITH 的形状及参数进行估计，继而通过迭代步骤对所估计得到的 MITH 周围的采样点进一步采样，从而在多次迭代之后，得到有效的 MITH 结果。对于天线应用，推荐使用
    Niter = 6 为迭代次数，每次迭代中进行 Ns = 7500 次采样。采用更多的采样点和迭代次数可以提升 MITH 结果的质量，但会带来更大的计算资源的消耗。然而，一方面，在实际应用中，天线的结构参数通常有相当大的设计范围，考虑到设计者通常无法获取关于
    MITH 形状的先验知识，因此选择较小的采样点数来提升算法速度的代价则是存在 MITH 无法被寻找到的风险；另一方面，考虑到采样策略天生的缺陷，实际的 WCP
    点有可能不在采样点集合中，从而带来 MITH 结构可靠性的下降。相比于基于 SS 的 MITH 搜索方法，本节中所给出的基于 MLAO 的 MITH 搜索方法通过引入全局优化方法来提升计算的可靠性和设计自由度，并且通过将
    MITH 搜索视作一个受限制的优化问题引入 MLAO 方法，缓解了全局优化方法带来的计算复杂度的压力。采用 MLAO 进行 MITH 搜索的程序源代码参见附录
    D。


    # 6.2.5 鲁棒优化


    上述的 WCA 和 MITH 搜索方法可用于实现天线及阵列的鲁棒优化。基于经典的 MLAO 架构，鲁棒设计将 MITH 搜索过程作为其对给定的输入进行精确计算的核心环节。具体的算法步骤如下：


    步骤 1. 初始化。鲁棒优化的初始点可以被设置为已知的 Nini 个设计最优点的集合，后者可以通过经典的 MLAO 方法优化得到。在初始化阶段，设计者还需要根据先验知识和设计要求，设定恰当的设计参数空间、OTR
    和设计约束。


    步骤 2. 对设计点采样。实际的天线设计问题通常需要在多个较优的设计点附近寻找最为鲁棒的设计点[94]。一个较为合理的假设是最为鲁棒的设计点通常都出现在较优的设计点周围。基于此，在此步骤中，对每个较优的设计点，都在其附近利用拉丁超立方体采样（Latin
    hypercube sampling, LHS）方法随机采样 kd 个采样点。


    步骤 3. 计算 MITH。在给定 OTR 的前提下，对每个采样设计点及初始设计点，可以通过基于 MLAO 的 MITH 搜索方法计算其对应的 MITH 特征。


    步骤 4. 代理模型建立或更新。利用上述步骤建立的采样设计点及其对应的 MITH 所共同构成的数据集，设计者可以通过引入机器学习方法构建代理模型。此处代理模型的输入参数
    X 为天线或阵列的设计参数 xi，其输出参数 y 为相对应的 MITH 响应 ωi。


    步骤 5. 基于代理模型进行优化。对不同的应用场景，可以采用不同的优化方法和适应度函数对代理模型进行优化。如果只需考虑对初始目标附近的鲁棒设'
