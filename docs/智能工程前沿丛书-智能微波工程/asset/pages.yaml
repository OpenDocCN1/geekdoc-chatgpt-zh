  md: '上不存在镜像频率干扰，由于其系统架构的优越性，使得系统不需要额外集成体积较大的滤波器，进而使得系统易于集成，但容易导致 I 路和 Q 路之间的幅度相位失配使得镜像抑制恶化和直流失调。


    # 4. 超外差发射机


    如图 2.5 所示，与超外差接收机类似，超外差发射机先将基带信号通过上变频模块混频到中频，再混频到射频，然后通过功率放大器将射频信号推送至天线。超外差发射机的功能是将电路中的信号变换后，发射到自由空间中。


    ![](img/cf98602880e9fcdd502be0d0247f6934_25_0.png)


    # 5. 直接变频发射机


    如图 2.6 所示，与零中频接收机类似，直接变频发射机先将基带信号通过上变频模块直接混频到射频，然后通过功率放大器推送至天线，将电路 I 路和 Q 路的基带信号变换，发射到自由空间中。


    ![](img/cf98602880e9fcdd502be0d0247f6934_25_1.png)


    # 6. 锁相环


    锁相环原理框图如图 2.7 所示，锁相环可以保持输入和输出相位处于锁定状态。最简单的电路是由反馈环路中的变频振荡器和鉴相器组成的电子电路，振荡器产生一个周期信号，并且鉴相器将该信号的相位与输入周期信号的相位进行比'
