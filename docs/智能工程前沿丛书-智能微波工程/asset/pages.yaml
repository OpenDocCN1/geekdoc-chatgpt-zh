  md: '预测器完成簇内信道参数的生成。因此，相应建模方法的研究核心则转化为构建适用于不同类型多径散射簇的预测器。


    ![](img/cf98602880e9fcdd502be0d0247f6934_181_0.png)


    对 8.1 节中所给出的信道模型进行简化，可以将多径分簇信道模型的信道冲激响应表示为 K 个多径簇以及 $\sum_{k=1}^K L_k$ 个子径的叠加[160]：


    ```

    $$ h(t, \Phi, \Omega) = \sum_{k=1}^K \sum_{l=1}^{L_k} \alpha_{k,l} e^{j\varphi_{k,l}}
    \delta(t - \tau_k - \tau_{k,l}) \delta(\Phi - \Phi_k - \Phi_{k,l}) \delta(\Omega
    - \Omega_k - \Omega_{k,l}) $$ (8.17)

    ```


    式中，\(\Phi\) 和 \(\Omega\) 分别表示离去角和到达角（包括俯仰和水平二维）；\(L_k\) 表示第 \(k\) 个簇内子径的数量；\(\alpha_{k,l}\)
    和 \(\varphi_{k,l}\) 分别表示第 \(k\) 个簇内第 \(l\) 个子径的幅度和相位；\(\tau_k\)、\(\Phi_k\) 和 \(\Omega_k\)
    分别表示簇心的时延、离去角和到达角；\(\tau_{k,l}\)、\(\Phi_{k,l}\) 和 \(\Omega_{k,l}\) 分别表示第 \(l\)
    个子径相对于簇心的时延、离去角和到达角。


