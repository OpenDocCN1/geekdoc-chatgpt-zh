  md: '# 3) 基于优化结构信息的 ANN(KBNN)


    KBNN 最大的特点是改变 ANN 内在结构，不再是完全连接的结构，而是留有一层或几层分配给一维或多维向量函数形式的微波电路信息。通过在神经网络结构中加入微波电路经验公式，使其影响训练过程。KBNN
    的结构、训练方式、所需训练参数都不同于传统的 ANN。


    # 4) 神经空间映射法


    神经空间映射法的基本思想是结合 ANN，建立粗糙模型和精细模型之间的映射，结合 ANN 的性能建模处理高维、高非线性的问题，得到在一定参数范围内性能都较好的粗糙模型，映射过程可以在输入或输出端实施。


    此外，在处理高维小样本时，人工神经网络可能会存在过度拟合和梯度方差大的问题。在基于后验概率的神经网络 (posteriori probability neural
    network, PPNN) 中，使用支持向量机得到数据的后验概率，并产生新的训练样本，解决因样本集较小引起的样本之间差异性较大的问题。在深度神经追踪 (deep
    neural pursuit, DNP) 中，选择特征和学习分类同时缓和，因高维度引起的严重过度拟合，在前向训练和逆向传播时随机地丢弃一些神经元和特征，在包含剩余神经元的子网络计算梯度有利于解决因样本集较小引起的梯度方差大的问题。


    # 3.2.4 高斯过程回归


    本质上，高斯过程 (Gaussian process, GP) 是多元高斯分布的延伸。不同于大多数其他形式的回归模型，对于一个任意给定的 x，返回一个清晰的值
    f(x)，一个高斯过程返回的是一个高斯概率分布。因此，高斯过程是函数的高斯分布。高斯过程回归 (GP regression, GPR) 的主要优点在于：具有统计学原理基础
    (贝叶斯)，能自动返回预测值的置信区间。


    在形式上，高斯过程生成的数据位于某个域内，使得范围内的任何有限子集都遵循多元高斯分布。假定在一个任意数据集内的 N 个观测点 y = [y1, y2, ⋯,
    yN]，总可以被认为是单个点从多元高斯分布中的采样。因此，反向考虑，这个数据集就可以对应一个高斯过程。一个高斯过程可以被均值函数和协方差函数共同决定。均值函数决定的是样本出现整体位置，即基准线。通常情况下，均值被直接设定为零，非零均值函数如果与样本切合，在远离训练样本密集区域，可以大幅降低预测的不确定性，但同时加大了超参数训练的压力，特别是在训练样本维数较高的情况下。对数据进行一些预处理
    (如去趋势、归零均值) 之后，零均值函数是性价比较高的选择。而协方差矩阵就是高斯过程机器学习中的核，它捕捉了输入点之间的关系，并反映在之后样本的位置上，利用点与点之间的关系，从输入点训练数据预测未知点的值。这里的协方差矩阵必须是半正定的。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '核函数有很多具体的形式。高斯过程中最常见的核是平方指数核，


    \( k(x, x'') = \sigma_f^2 \exp \left( \frac{-(x-x'')^2}{2l^2} \right) \) (3.1)


    最大容许协方差被定义为 \(\sigma_f^2\) ，考虑数据噪声后，


    \( k(x, x'') = \sigma_f^2 \exp \left( \frac{-(x-x'')^2}{2l^2} \right) + \sigma_n^2
    \delta(x, x'') \) (3.2)


    使用高斯过程回归作回归预测，首先需要计算一个协方差矩阵，


    \( \boldsymbol{K} = \begin{bmatrix} k(x_1, x_1) & k(x_1, x_2) & \dots & k(x_1,
    x_N) \\ k(x_2, x_1) & k(x_2, x_2) & \dots & k(x_2, x_N) \\ \vdots & \vdots & \ddots
    & \vdots \\ k(x_N, x_1) & k(x_N, x_2) & \dots & k(x_N, x_N) \end{bmatrix} \) (3.3)


    \( \boldsymbol{K}_* = \left[ k(x_*, x_1) \quad k(x_*, x_2) \quad \dots \quad k(x_*,
    x_N) \right] \) (3.4)


    \( \boldsymbol{K}_{**} = k(x_*, x_*) \) (3.5)


    由于数据可以表示来自多元高斯分布的样本，所以有


    \( \begin{bmatrix} \boldsymbol{y} \\ \boldsymbol{y}_* \end{bmatrix} \sim \mathcal{N}
    \left( \boldsymbol{0}, \begin{bmatrix} \boldsymbol{K} & \boldsymbol{K}_*^T \\
    \boldsymbol{K}_* & \boldsymbol{K}_{**} \end{bmatrix} \right) \) (3.6)


    式中，条件概率 \(p(\boldsymbol{y}_*|\boldsymbol{y})\) 服从高斯分布， \(\boldsymbol{y}_*|\boldsymbol{y}
    \sim \mathcal{N}(\boldsymbol{K}_*\boldsymbol{K}^{-1}\boldsymbol{y}, \boldsymbol{K}_{**}
    - \boldsymbol{K}_*\boldsymbol{K}^{-1}\boldsymbol{K}_*^T)\) 。对于 \(\boldsymbol{y}_*\)
    的最佳估计为 \(\bar{\boldsymbol{y}}_* = \boldsymbol{K}_*\boldsymbol{K}^{-1}\boldsymbol{y}\)
    ，方差为 \(\text{var}(\boldsymbol{y}_*) = \boldsymbol{K}_{**} - \boldsymbol{K}_*\boldsymbol{K}^{-1}\boldsymbol{K}_*^T\)。


    # 3.2.5 支持向量回归


    传统的支持向量回归 (supporting vector regression, SVR) 是指，在给定训练样本 \(\boldsymbol{D} = [(\boldsymbol{x}_1,
    y_1), (\boldsymbol{x}_2, y_2), \cdots, (\boldsymbol{x}_m, y_m)], y_i \in \mathbb{R}\)，学得一个形如
    \(f(\boldsymbol{x}) = \boldsymbol{w}^T \boldsymbol{x} + b\) 的回归模型，使 \(f(\boldsymbol{x})\)
    和 \(\boldsymbol{y}\) 尽可能接近，\(\boldsymbol{w}\) 和 \(b\) 是待确定参数。假设 \(f(\boldsymbol{x})\)
    和 \(\boldsymbol{y}\) 之间最多存在偏差 \(\varepsilon\)，当 \(f(\boldsymbol{x})\) 和 \(\boldsymbol{y}\)
    之间偏差的绝对值大于 \(\varepsilon\) 时计算损失，相当于以 \(f(\boldsymbol{x})\) 为中心，构建了宽度为 \(2\varepsilon\)
    的间隔带。考虑间隔带两侧松弛程度可能不同，引入松弛变量 \(\xi_i\) 和 \(\hat{\xi}_i\)。SVR 问题即可形式化为


    \( \min_{\boldsymbol{w}, b, \xi_i, \hat{\xi}_i} \left( \frac{1}{2} ||\boldsymbol{w}||^2
    + C \sum_{i=1}^m (\xi_i + \hat{\xi}_i) \right) \) (3.7)'
