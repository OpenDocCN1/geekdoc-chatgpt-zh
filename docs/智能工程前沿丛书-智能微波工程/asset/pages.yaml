    # 5.3 知识和数据混合驱动的天线阵列设计


    上一节所述的 HKDT 建模方法用于指导考虑互耦和平台效应下的线阵和平面阵的阵列天线设计。算法遵循经典的 MLAO 架构，并通过 HKDT 来实现其核心的建模步骤，具体的步骤如下：


    步骤 1. 初始化。包括对参数和数据的准备工作。在给定的设计限制和优化目标下，算法通过全波仿真方法建立 AEP 和 S 参数的初始训练集 $D_i = (u_i,
    y_i)$。初始训练集可以通过随机采样方法或采用理想单元辐射方向图先进行优化得到的阵列排布，继而经过全波仿真得到。理想单元辐射方向图被规定为全向方向图，PEP
    或在前序设计中得到的 AEP 的平均值。


    步骤 2. 建模。利用步骤 1 所得到的初始训练集，通过 HKDT 方法对包括 AEP 和 S 参数在内的辐射和反射特征进行建模，得到代理模型 $R_{s,i}(u)$。考虑到
    HKDT 所使用的较小的训练集，可以采用 GPR 对初始训练集进行训练。


    步骤 3. 优化。利用步骤 2 所得到的代理模型 $R_{s,i}(u)$，在给定的限制条件下，针对给定的设计目标进行优化，以获得优化后的阵列分布和激励 $u_{opt,i}$，以及由代理模型给出的
    AEP 的预测值 $y_{opt,pre,i}$。此处的优化方法可以采用经典的进化类的算法或凸优化方法等。


    步骤 4. 验证。对优化得到的阵列分布和激励结果 $u_{opt,i}$ 采用全波仿真方法进行验证，从而得到验证后的结果 $y_{opt,val,i}$，并将其加入训练集中，得到更新后的训练集
    $D''_i = (u''_i, y''_i)$。通过检验训练集中的最优结果是否满足算法终止条件进行判定，若不满足，则回到步骤 2，重新利用 HKDT 对代理模型进行在线更新，迭代次数增量
    $i = i + 1$。若满足终止条件，则对结果进行输出。


