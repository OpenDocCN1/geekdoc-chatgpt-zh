  md: '![](img/cf98602880e9fcdd502be0d0247f6934_53_0.png)


    # 2) 模型训练


    基于已经整理好的训练集，采用机器学习方法，建立合适的代理模型。


    # 3) 最优化


    可以选择利用预筛选方法修正适应度函数，基于训练好的代理模型，进化类的最优化算法通过迭代寻找最优解，优化算法中每一轮迭代的响应经由代理模型来预测获得。图 3.2(b)
    给出优化算法模块的数据流图。


    # 4) 全波仿真验证


    优化算法中得到的最优点，仍采用参数化建模的方法调用已有模型，得到最优参数组合对应的全波仿真数据。


    # 5) 终止条件判断


    终止条件一般设定为达到预先设定的优化目标或达到了最大的迭代次数，如果满足，则输出数据库中的最好结果；如果不满足，算法继续。


    # 6) 更新训练集


    将增加特征维度后的最优点的全波仿真数据更新到训练集中，使重新训练。如图 3.2(a) 所示，与传统优化方法的流程（图 3.1(b)）相比，代理模型在线更新的机器学习辅助优化存在明显的区别，共有内外两层循环。基于机器学习获得的代理模型，内层循环在优化算法的迭代求解中进行，子代数据皆由代理模型预测得出，当达到算法的终止条件则跳出内层循环，进入外层循环中的全波仿真验证，当全波仿真输出的结果符合预设的设计要求，则跳出外层循环，结束整个优化进程。'
