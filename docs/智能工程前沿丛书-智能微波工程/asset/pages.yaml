    # 7.2.2 片上可变螺旋电感自动综合


    所提出的基于知识和数据混合驱动技术的电感自动综合（automatic spiral synthesis inductor utilizing HKDT, ASSI-HKDT）算法是一种机器学习辅助的片上螺旋电感自动综合算法，具有低成本、高效率、能力强等优点，尤其适用于毫米波频段和宽频带场景。在
    ASSI-HKDT 算法中，结合先验知识的代理模型用于评估电感的电气性能，结合全局优化算法寻找最优值。该算法的输入为片上螺旋电感的性能指标，包括工作频率 \(
    F_{\text{goal}} \)、电感值 \( L_{\text{goal}} \)、目标品质因数 \( Q_{\text{goal}} \) 以及最小自谐振频率
    \( F_{\text{SRF}} \)，而输出为满足这些指标的电感几何参数以及其模型。


    图 7.10 给出 ASSI-HKDT 算法的自动化框架。该框架是以 Matlab 的 M 脚本编写应用软件，Matlab 与 Cadence Virtuoso
    之间的通信使用 Skill 脚本实现，并且通过系统调用的方式实现与 Cadence EMX 之间的通信。整个框架实现了自动建模、自动仿真以及数据存取等操作，可以极大提升设计和优化的效率。事实上，也可以采用其他编程工具如
    Python 编写应用软件，通过 API 接口调用其他电子设计自动化软件和电磁场全波仿真软件来实现 ASSI-HKDT 算法。'
