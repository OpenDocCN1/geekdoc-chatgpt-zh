    # 2.3.3 电波传播测量


    无线信道研究是任何无线通信系统设计和网络规划部署的基础之基础，只有充分了解电磁波的电波传播特性，才能建立更贴近真实传播环境的精确信道模型。通常信道研究包含三部分内容：信道测量、信道传播特性分析和信道建模与仿真。首先需要构建高性能灵活的信道测量系统，在典型频段和场景下开展信道测量，采集统计意义上足够遍历的信道实测数据，同时设计高性能信道参数估计算法，获得空-时-频域内等多维信道参数。基于信道实测结果，进一步分析信道的大尺度和小尺度信道特性。


    从信道测量系统的基本原理出发，主要包括两种测量方法：


    # 1. 频域信道测量方法


    如图 2.12 所示，频域信道测量系统的核心设备是矢量网络分析仪（vector network analyzer, VNA），通过扫频在一定的频率范围内以一定的步长进行频率扫描。VNA
    的测量结果是其两个端口信号增益的比值，即准静态信道的频率响应，再经过傅里叶逆变换最终获得信道冲激响应（channel impulse response, CIR）数据。对于每一个频点的发送信号可以表示为
    \( e_i(t) = E e^{j\omega_i t} \)。假设无线信道为线性时不变网络，此时接收信号可以表示为


    ```

    \( r_i(t) = H(j\omega_i) \cdot E e^{j\omega_i t} = E |H(j\omega_i)| e^{j[\omega_i
    t + \angle H(j\omega_i)]} \)

    ```


    式中，\( |H(j\omega_i)|\) 和 \( \angle H(j\omega_i)\) 分别表示信道的幅频响应和相频响应。将端口 A 与端口 B
    的结果作比较系统的 S 参数，即


    ```

    \( S_{21}(\omega_i) = H(j\omega_i) = |H(j\omega_i)| e^{j\angle H(j\omega_i)} \)

    ```


    在带通模式下，角频率 \( \omega_i \) 在 \( [\omega_1, \omega_2] \) 区间内按照一定的步长变化，可以直接得到通带内的信道频率响应，再通过傅里叶逆变换得到
    \( S_{21}(\omega) \) 的时域表示，即


    ```

    \( h(t) = FT^{-1}\{S_{21}(\omega)\} \)

    ```


    对于离散时间系统而言，\( S_{21}(\omega) \) 可以表示为 \( S_{21}[k]\)，\( h(t) \) 可以表示为 \( h[n]\)，两者构成离散傅里叶变换对，即


    ```

    \( S_{21}[k] = \sum_{n=0}^{N-1} \exp \left( -j \frac{2\pi}{N} nk \right) h[n]
    \)

    ```'
