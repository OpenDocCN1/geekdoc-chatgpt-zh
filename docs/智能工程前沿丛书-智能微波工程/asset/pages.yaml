  md: 's.t. \begin{cases} f(\boldsymbol{x}_i) - y_i \leqslant \varepsilon + \xi_i,
    \quad \xi_i \geqslant 0, \\ y_i - f(\boldsymbol{x}_i) \leqslant \varepsilon +
    \hat{\xi}_i, \quad \hat{\xi}_i \geqslant 0, \\ i = 1, 2, \cdots, m \end{cases}


    引入拉格朗日乘子后，由拉格朗日乘子法得到拉格朗日函数：


    L(\boldsymbol{w}, b, \boldsymbol{\alpha}, \boldsymbol{\xi}, \hat{\boldsymbol{\xi}},
    \boldsymbol{\mu}, \hat{\boldsymbol{\mu}}) = \frac{1}{2} ||\boldsymbol{w}||^2 +
    C \sum_{i=1}^m (\xi_i + \hat{\xi}_i) - \sum_{i=1}^m \mu_i \xi_i - \sum_{i=1}^m
    \hat{\mu}_i \hat{\xi}_i + \sum_{i=1}^m \alpha_i (f(\boldsymbol{x}_i) - y_i - \varepsilon
    - \xi_i) + \sum_{i=1}^m \hat{\alpha}_i (y_i - f(\boldsymbol{x}_i) - \varepsilon
    - \hat{\xi}_i) \tag{3.8}


    对 \boldsymbol{w}, b, \xi_i, \hat{\xi}_i 的偏导设为零后，可得


    \boldsymbol{w} = \sum_{i=1}^m (\hat{\alpha}_i - \alpha_i) \boldsymbol{x}_i \tag{3.9}
    \\ 0 = \sum_{i=1}^m (\hat{\alpha}_i - \alpha_i) \tag{3.10} \\ C = \alpha_i + \mu_i
    \tag{3.11} \\ \hat{C} = \hat{\alpha}_i + \hat{\mu}_i \tag{3.12}


    将式 (3.9)~式 (3.12) 代入式 (3.7)，可得 SVR 的对偶问题：


    \max_{\boldsymbol{\alpha}, \hat{\boldsymbol{\alpha}}} \left( \sum_{i=1}^m y_i
    (\hat{\alpha}_i + \alpha_i) - \frac{1}{2} \sum_{i=1}^m \sum_{j=1}^m (\hat{\alpha}_i
    - \alpha_i)(\hat{\alpha}_j - \alpha_j) \boldsymbol{x}_i^{\mathrm{T}} \boldsymbol{x}_j
    \right) \tag{3.13} \\ \text{s.t.} \begin{cases} \sum_{i=1}^m (\hat{\alpha}_i -
    \alpha_i) = 0 \\ 0 \leqslant \alpha_i, \quad \hat{\alpha}_i \leqslant C \end{cases}


    上式满足以下条件：


    \begin{cases} \alpha_i (f(\boldsymbol{x}_i) - y_i - \varepsilon - \xi_i) = 0 \\
    \hat{\alpha}_i (y_i - f(\boldsymbol{x}_i) - \varepsilon - \hat{\xi}_i) = 0 \\
    \alpha_i \hat{\alpha}_i = 0, \xi_i \hat{\xi}_i = 0 \\ (C - \alpha_i) \xi_i = 0,
    (C - \hat{\alpha}_i) \hat{\xi}_i = 0 \end{cases} \tag{3.14}


