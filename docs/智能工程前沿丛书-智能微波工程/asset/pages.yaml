- pgno: 136
  md: '图 6.4 可以反映两种策略的性能差异。首先，在 SS 策略下，如果采样点数选取过少，则可能导致该策略在寻找 MITH 中失败；其次，在多数情况下，采用
    SS 策略找到的 MITH，其 WCP 实际上都存在于 OTR 之外，这意味着在 SS 策略找到的 WCP 的质量较低；最后，随着输入参数的增多，传统的 SS
    策略找到可靠的 MITH 的可能性逐渐受到限制。与 SS 策略相比，基于 MLAO 的 MITH 搜索策略寻找到的 MITH，其 WCP 被严格限制在 OTR
    中，并且尽可能地接近 OTR。总结而言，基于 MLAO 的 MITH 搜索策略在可靠性和有效性的实现相较于传统 SS 策略有明显的性能提升。下面将通过几种典型的情况来具体分析传统
    SS 策略与基于 MLAO 的 MITH 搜索策略的差异。


    首先，考虑 $K = 2, N_s = 100, N_{\text{iter}} = 10$ 的情况（第一种情况）。设计点 $\boldsymbol{x}_0
    = (1, 1), g(\boldsymbol{x}_0) = 2.637$，其 OTR 为 $1.637 \sim 3.637$。如图 6.5(a) 所示，在第一次采样中，利用
    LHS 在设计点 $\boldsymbol{x}_0$ 附近采样 100 个设计点，并且通过计算函数值获取其性能。图中深灰色的区域代表属于 OTR 中的区域
    ($g(\boldsymbol{x}) \in g(\boldsymbol{x}_0) \pm 1$)，而浅灰色区域代表 OTR 外的区域 ($g(\boldsymbol{x})
    \notin g(\boldsymbol{x}_0) \pm 1$)。在所采样的 100 个设计点中，其函数值落在 OTR 中的被标识为黑色，而落在 OTR
    之外的被标识为灰色。在 SS 策略中，每一个采样点都将被视为一个潜在的顶点，从而构建一个容差超体积。通过评估该容差超体积内是否存在落在 OTR 外的采样点来判断该输出容差超体积是否合适被作为合格的输出容差超体积
    ITH。选择合格的 ITH 中具有最大的容差超体积的 ITH，作为当前迭代中的 MITH。


    ![](img/cf98602880e9fcdd502be0d0247f6934_136_0.png)


    (a) 基于SS的第一次采样过程'
