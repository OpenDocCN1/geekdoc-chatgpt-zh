  md: "# 附录 D 采用 MLAO 进行 MITH 搜索的程序源代码 *\n\n采用 MLAO 进行 MITH 的搜索分为四步，其核心是构建不同的输入容差超体积及其对应的最差情况组成的初始训练集，及利用以机器学习建模、优化和验证为基础的\
    \ MLAO 迭代过程对 MITH 进行搜索。具体步骤如下：\n\n+   步骤 1. 对相关的系数进行初始化。\n\n```\nfunction function_MITH_Searching_MLAO\n\
    \    global Cha;\n    X_for_test = Cha.Dimensions;\n    Lower_Bound = Cha.Bound(1,\
    \ :);\n    Upper_Bound = Cha.Bound(2, :);\n    Tolerance = Cha.Tolerance;\n  \
    \  d_x = Cha.N_function;\n    m_SAMPLE = Cha.m_SAMPLE;\n    iterations = Cha.iterations_DLMLAO;\n\
    \    Distance_Lower=X_for_test-Lower_Bound;Distance_Upper=Upper_Bound-X_for_test;\n\
    \    Distance0 = [Distance_Lower; Distance_Upper];\n    Distance = min(Distance0,\
    \ [], 1);\n    e0 = find(Distance == 0);\n    fitness10 = function4(X_for_test);\n\
    \    fit_Tol = fitness10+Tolerance;\n    Cha.fit_Tol = fit_Tol;\n    divide =\
    \ 1/m_SAMPLE;\n    Hypervalue_sample0_2 = repmat((divide:divide:1)', [1, d_x]);\n\
    \    Hypervalue_sample0 = lhsdesign(m_SAMPLE, d_x);\n    Hypervalue_sample0 =\
    \ [Hypervalue_sample0; Hypervalue_sample0_2];\n    Hypervalue_sample = Hypervalue_sample0.*Distance;\n\
    \    Up_bound = X_for_test+Hypervalue_sample;\n    Lp_bound = X_for_test-Hypervalue_sample;\n\
    ```\n\n+   步骤 2. 构建不同的输入容差超体积及其对应的最差情况组成的初始训练集。\n\n```\nfor j = 1:m_SAMPLE*2\n\
