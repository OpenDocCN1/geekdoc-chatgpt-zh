  md: '训练中没有出现观点的区域误差较大，神经网络模型的泛化能力可以通过在训练过程中使用分散的测试数据集，以及对精细模型的评估获得。如何设置隐藏层神经元的个数仍是个未解问题，实际应用中通常依靠“试错法”调整。


