  md: '设计等方面的应用。


    # 1.1.2 天线与阵列


    天线是天线通信、广播、导航、雷达、测控、遥感、射电天文和电子对抗等多种民用和军用无线电系统中必不可少的部件之一。1887 年，赫兹完成了证明电磁波存在的实验，这已经成为无线电发展历史的里程碑式的事件。该实验使用了电偶极子谐振器天线。自此至今，天线的设计和优化已经历了
    100 多年的历史。在早期的实验性无线电系统中，天线主要包括电偶极子天线和环形天线等。随着 20 世纪初电子管的发明和发展，涌现了一系列包括菱形天线（rhombic
    antenna）、鱼骨天线（fish bone antenna）、对称天线（symmetrical antenna）和八木天线（Yagi antenna）等在内的线天线（wire
    antenna）。与此同时，也出现了一系列如感应电动势法和对偶原理等对天线天线的分析、设计方法及理论。


    20 世纪 40 年代的第二次世界大战催生了微波雷达的发展，包括抛物面天线（parabolic antenna）、喇叭天线（horn antenna）等在内的口径天线大量涌现。同时，也出现了波导缝隙阵天线、螺旋天线等新的天线结构。二战之后，微波中继通信、广播和射电天文的应用也促进了天线和口径天线的进一步发展。其中包括几何光学法、口径场法和电流分步法等在内的口径天线分析方法被提出，天线测试技术和天线阵列综合技术也相应出现。20
    世纪 60 年代开始，天线设计进入全面发展阶段。电子计算机、微电子技术和现代材料的发展为天线理论和设计的发展提供了必要的基础。包括高增益、快速扫描、宽频带、低旁瓣等在内的多样化天线设计需求层出不穷。这一时期出现了单脉冲天线、相控阵天线、波纹喇叭、多波束天线、非频变天线、微带天线、共形阵天线、介质谐振器天线、分形天线、可重构天线等高性能的新型天线。同时，矩量法、时域有限差分法等分析方法被成功应用于天线设计领域，并发展出商业化的软件，从而极大地提升了天线设计的效率并拓展了天线创新的边界。


    近年来，随着无线移动通信及雷达技术等快速发展，天线领域正在经历快速发展与革新。一方面，基片集成技术、超材料技术、电磁偶极子技术、封装天线技术等新的天线设计技术不断涌现，为高集成度、多设计目标、高频段、复杂电磁环境、强设计制约、高良率（production
    yield）需求等多种要求下的天线设计带来更丰富的选择；另一方面，包括进化算法、机器学习算法、特征模算法等在内的新型分析及优化算法的引入，以及与经典计算电磁方法和商业全波仿真软件的结合极大地促进新型天线的出现。天线性能和设计效率的提升成为研究热点之一，而且天线的性能边界研究也进入新阶段。


    人工神经网络（artificial neural network, ANN）作为最早被引入电磁和微波工程领域的机器学习方法之一，近十几年得到长足的发展和应用。1998
    年，文'
