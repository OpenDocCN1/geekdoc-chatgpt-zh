  md: '# ### 8.1.2 无监督学习的多径分簇算法


    在传统基于多径簇物理信道模型的框架下，无监督学习算法已在信道建模研究中应用多年，主要包括两方面研究内容：一是根据估计得到的多径分量（multipath component，MPC），结合多径分簇算法在时间和空间上呈现一定相似特性的
    MPC 进行聚类，进而获得信道簇间和簇内的电波传播特性，基于分簇结果可进一步分析多径散射簇和物理散射体间的映射关系[144,145]；二是针对动态信道，基于不同快拍下信道分簇结果，刻画或追踪因散射体或接收机移动导致多径簇在时间或空间上的变化。本节主要以静态信道为例，介绍考虑物理信道传播特征情况下的多径分簇算法设计和优化，以期改进基于无监督学习的多径分簇算法的准确性和计算复杂度。


    每一个 MPC 由其功率 \(p_i\)、时延 \(\tau_i\)、水平离去角（azimuth angle of departure，AOD）\(\phi_{\text{TX},i}\)、俯仰离去角（elevation
    angle of departure，EOD）\(\theta_{\text{TX},i}\)、水平到达角（azimuth angle of arrival，AOA）\(\phi_{\text{RX},i}\)
    和俯仰到达角（elevation angle of arrival，EOA）\(\theta_{\text{RX},i}\) 表征。因此，多径分簇算法的性能首先依赖于
    MPC 之间的度量标准，目前最为广泛采用的就是多径分量距离（multipath component distance，MCD）[146]，它表征了第 \(i\)
    和第 \(j(i, j \in \{1, 2, \cdots, L\}, i \neq j)\) 个 MPC 之间的距离，即


    \(\text{MCD}_{ij} = \sqrt{\text{MCD}_{\phi_{\text{TX},ij}}^2 + \text{MCD}_{\phi_{\text{RX},ij}}^2
    + \text{MCD}_{\tau_{ij}}^2} \quad (8.6)\)


    式中，\(L\) 表示所估计得到的 MPC 总数。关于到达角的 MCD 定义为


    \(\text{MCD}_{\phi_{\text{RX},ij}} = \frac{1}{2} \|\phi_{\text{RX},i} - \phi_{\text{RX},j}\|_2
    \quad (8.7)\)


    式中，\(\phi_{\text{RX},i} = [\sin \theta_{\text{RX},i} \cos \phi_{\text{RX},i},
    \sin \theta_{\text{RX},i} \sin \phi_{\text{RX},i}, \cos \theta_{\text{RX},i}]^T\)。类似地，可以对离去角
    \(\text{MCD}_{\phi_{\text{TX},ij}}\) 进行定义。时延的 MCD 定义为


    \(\text{MCD}_{\tau_{ij}} = \xi \frac{|\tau_i - \tau_j|}{\Delta \tau_{\max}} \frac{\tau_{\text{std}}}{\Delta
    \tau_{\max}} \quad (8.8)\)


    式中，\(\xi\) 表示时延尺度变换因子；\(\tau_{\text{std}}\) 表示所有 MPC 时延的标准差；\(\Delta \tau_{\max}\)
    表示在 \(L\) 个 MPC 中任意两个 MPC 间最大的时延差，即


    \(\Delta \tau_{\max} = \max_{\forall i, j \in [1, L], i \neq j} |\tau_i - \tau_j|
    \quad (8.9)\)


    传统的 KPowerMeans 分簇算法需要指定簇数搜索范围 \([K_0, K]\)，并且在第 \(k\) 次分簇过程，首先随机选取 \(k\) 个 MPC
    作为初始簇心，并将剩余 \((L - k)\) 个 MPC 根据 MCD 聚类到 \(k\) 个簇心；找到最靠近第一次分簇结果加权簇心的 MPC'
