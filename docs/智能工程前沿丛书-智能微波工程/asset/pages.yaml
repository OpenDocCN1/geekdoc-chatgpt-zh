- pgno: 33
  md: '式中，L 为天线的最大尺寸；λ 为天线工作频率对应的波长。在远场区，场分量均处在辐射方向的横截面内，所有的功率流都是沿径向向外的；而在近场区，电场有显著的径向分量，其功率流并不完全是径向的，天线的场波瓣图通常随远场区距离变化。


    天线的极化方式是由其所辐射的电磁波在远场区的平面波的极化方式确定的。考虑沿z方向行进的平面波，若其电场始终沿x方向，则称其是x方向线极化的。在更一般的情况下，沿z方向行进的平面波的电场同时具有x分量和y分量，且分量之间存在相位差，这种波被称为椭圆极化的。在确定的z点处电场矢量作为时间的函数旋转，其矢量所描出的椭圆被称为极化椭圆，其长轴和短轴之比称为轴比（axial
    ratio, AR）。椭圆极化的两种极端情况为：AR = 1的圆极化和AR = ∞的线极化。在确定的z点处，按电磁波朝纸面外传播的观点，电场矢量按顺时针旋转时，对应左旋圆极化波，相反旋向的情况对应右旋圆极化波。


    天线几乎所有的电参数都会随着频率的变化而改变。无线电系统通常会对这些恶化有一个容许范围。定义这些电参数在容许范围之内的频率范围为天线的带宽。绝对带宽B为带宽内的最高频率fh和最低频率f1的差值，即B
    = fh - f1，而相对带宽Br = B/f0 × 100%。需要注意的是，对天线增益、波束宽度、旁瓣电平、电压驻波比和轴比等不同的电参数，它们各自在其容许值内的频率范围是不同的。天线的综合带宽通常由这些电参数完全重合的一个值来确定。


    # 2.2.2 阵列


    天线阵列由多个单元天线组成，通常简称为阵列。在实际应用中，单一的天线通常具有方向性不强、增益不高等缺点，而阵列则可以弥补这些不足。常见的阵列设计目标有：


    +   (1) 实现窄波束，提升天线的方向性和增益；

    +   (2) 实现畸形波束和多波束；

    +   (3) 实现波束扫描；

    +   (4) 实现具有低侧瓣电平的方向图。


    天线阵列的分析依赖于一系列参数以确定天线阵列的辐射特性，包括天线阵列的方向图、增益、效率等。


    # 1) 天线单元的结构


    天线单元的结构决定天线单元的方向图。在规模较小的阵列中，天线单元的方向图将对阵列的方向图构成较为重要的影响。需要注意的是，与单独使用的天线单元的方向图不同，阵列环境中天线单元的方向图将受到单元间互耦及所处平台效应的影响，进而影响天线阵列整体的辐射性能。'
