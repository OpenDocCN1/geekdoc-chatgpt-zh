- pgno: 169
  md: '# 8.1 基于几何随机模型的物理信道建模


    本节主要以适用于 0.5GHz~100GHz 频率范围的 3GPP TR38.901 信道模型为例[143]，介绍传统基于几何随机模型的物理信道模型以及在信道建模过程中主要关心的几类信道参数，并比较说明导致传统物理信道模型在建模准确性和场景通用性变差的原因。特别地，对于传统小尺度多径分簇信道建模，需要对具有相近时延和角度信息的多径分量完成聚类分析。因此，本书还将重点介绍无监督机器学习算法在分簇信道模型中的应用，结合信道多径分量在时间和空间维度的物理分布特征，提出了两步
    KPowerMeans 多径分簇算法，并在初始簇心选取、孤立多径分量剔除和最佳分簇结果选取等方面进行优化，在改善分簇效果的同时有效减少了计算迭代次数。


    # 8.1.1 信道模型和信道参数


    目前，3GPP TR38.901 标准信道模型广泛应用于 5G 中低频和毫米波系统无线传输性能评估及无线网络规划，其信道冲激响应生成的流程如图 8.1 所示[143]。在信道生成过程中，首先需要根据大尺度路径损耗建模结果和全向信道色散参数的统计建模结果得到大尺度信道参数；然后针对小尺度多径分簇信道，根据簇内和簇间信道参数的统计建模结果得到包含每一个簇及簇内子径信息的小尺度信道参数；最后考虑遮挡效应、空间一致性、大气吸收衰减等附加信道特性，以提高对真实信道建模结果的准确性。


    ![](img/cf98602880e9fcdd502be0d0247f6934_169_0.png)


    图 8.1 根据 3GPP TR38.901 信道模型定义，考虑遮挡效应的信道冲激响应生成流程'
  merge: -1
