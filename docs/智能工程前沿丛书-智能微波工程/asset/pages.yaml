- pgno: 135
  md: '# 6.3 应用 实例


    在本章中，先针对测试函数及贴片天线的实例，讨论基于 MLAO 的 MITH 搜索相较于传统方法的优势，继而针对包括阵列综合及天线设计的鲁棒优化的应用实例进行讨论。


    # 6.3.1 测试函数的 MITH 搜索


    考虑一个 \( K \) 维、非凸、不可分的测试函数，其表达式为


    \( g(\boldsymbol{x}) = \sum_{k=1}^{K-1} \left( \exp(-0.2) \sqrt{x_k^2 + x_{k+1}^2}
    + 3 \left( \cos(2x_k) + \sin(2x_{k+1}) \right) \right) \quad (6.12)\)


    设计点为 \( x_k = 1; k = 1, \cdots, K \); OTR 为 \( g(\boldsymbol{x}) \) 附近的 \( [-1,1]
    \) 范围。图 6.4 给出对该测试函数进行 MITH 搜索时，基于 SS 和 MLAO 的 MITH 搜索策略的性能对比。在不同的函数维度及不同的 SS
    采样点数 \( N_s \) 的情况下，采用两种方法进行 MITH 搜索后，利用 GA 在计算得到的 MITH 内进行搜索获得 WCP，进而将其与事先给定的
    OTR 进行比较。计算搜索得到的 WCP 与 OTR 的上下界间的差值，并在图中通过色块的颜色深浅和大小表示：圆心位于交叉点处的灰色圆点表示在相应的条件下，该策略未能找到
    MITH；圆心不在交叉点处的圆点表示能够找到 MITH，其中，深色的圆点表示经检验得到的 WCP 是在 OTR 中的，而浅色的圆点表示经检验得到的 WCP
    在 OTR 之外。圆点越大，代表 WCP 与 OTR 间的距离越小。


    ![](img/cf98602880e9fcdd502be0d0247f6934_135_0.png)


    图 6.4 基于 SS 和 MLAO 的 MITH 搜索策略的性能对比'
