    \( Q \) 先上升后下降。


    # 7.1.3 直流电感值近似计算


    修正 Wheeler 公式可以极为方便地根据螺旋电感的几何参数估计其直流电感值[138],


    ```

    L_M = K_1 \mu_0 \frac{N^2 D_{avg}}{1 + K_2 \rho}

    ```


    式中, \( \mu_0 \) 为真空中的磁导率;


    ```

    D_{avg} = \frac{(D_{out} + D_{in})}{2}

    ```


    ```

    \rho = \frac{(D_{out} - D_{in})}{(D_{out} + D_{in})}

    ```


    \( K_1 \) 和 \( K_2 \) 为随电感形状变化化的常数项, 其取值如表 7.2 所示。


    | 常数 | 四边形电感 | 六边形电感 | 八边形电感 |

    |---|---|---|---|

    | \( K_1 \) | 2.34 | 2.33 | 2.25 |

    | \( K_2 \) | 2.75 | 3.82 | 3.55 |


    原始的修正 Wheeler 公式仅用于计算单端结构螺旋的直流电感值, 而可变螺旋电感只是将传统的螺旋电感进行拉伸和压缩, 因此对修正 Wheeler 公式经过简单的修改后即可用于计算可变螺旋电感的电感值,
    拓展的 Wheeler 公式为


    ```

    L_E = K_1 K_3 \mu_0 \frac{N^2 D''_{avg}}{1 + K_2 \rho''}

    ```


    式中,


    ```

    D''_{avg} = \frac{\sqrt{(D_{outw} + D_{outh})(D_{inw} + D_{inh})}}{2}

    ```


    ```

    \rho'' = \frac{\sqrt{D_{outw}D_{outh}} - \sqrt{D_{inw}D_{inh}}}{\sqrt{D_{outw}D_{outh}}
    + \sqrt{D_{inw}D_{inh}}}

    ```'
