- pgno: 5
  md: '# 前 言


    微波工程是无线移动通信、雷达等无线电系统以及高速数字电路的基础技术。一方面，无线电系统的载波工作频率正走向毫米波乃至太赫兹频段。随着无线移动通信的高速发展，中低频段越来越拥挤，载波频率不断提升，第五代移动通信（5G）已经开始在毫米波部署，第六代移动通信（6G）正在讨论将太赫兹作为候选频段之一。类似地，雷达的工作频率也在不断攀升，77GHz
    车载毫米波雷达已经大规模应用，94GHz 雷达正得到广泛研究并逐步应用，用于气象云量观测的太赫兹雷达得到深入研究。另一方面，高速数字电路特别是输入输出端口的数据传输速率不断攀升。例如，用于高速数字芯片间互联的串行器/解串器（SerDes）不断刷新数据传输速率的纪录，单对差分信号的数据速率已经突破
    100Gb/s。无线电系统和高速数字电路的工作频率已进入毫米波乃至太赫兹频段，传统微波理论和技术的局限性逐渐显现，急需引入新理论和新技术应对新挑战。正值中国无线电产业和高速数字电路产业快速发展之际，在东南大学黄如院士的有力组织下，基于国家重点研发计划、国家自然科学基金等项目的研究成果，作者结合二十多年的微波工程研究经验撰写本书。


    本书主要阐述智能微波工程涉及的关键技术及其应用。第 1 章绪论，主要介绍研究背景和进展，以及本书主要内容。第 2 章是微波工程的基础内容，论述微波电路与系统的基础和设计技术、微波天线与阵列的基础和设计技术、电波传播与信道建模技术。第
    3 章介绍机器学习辅助优化技术的基本框架、机器学习的主要方法、最优化算法和典型应用实例。第 4 章详细介绍多路径机器学习辅助优化技术及其在天线设计中的应用。第
    5 章主要介绍知识和数据混合驱动的天线阵列智能设计技术。第 6 章介绍多层机器学习辅助优化技术及其在天线射频智能鲁棒设计中的应用。第 7 章详细论述毫米波片上螺旋电感的智能设计技术。第
    8 章介绍知识和数据混合驱动的智能信道建模技术及其在前向植被散射簇信道建模中的应用。第 4 章至第 8 章涉及内容均是我们研究团队的最新研究成果，已经在 IEEE
    Transactions on Antennas and Propagation 等国内外学术期刊和学术会议上发表对应的论文。


    全书共 8 章，每章自成系统，同时相互联系。本书主要内容是作者近年来在智能微波工程方面研究工作的汇聚。这些研究工作的合作者还包括东南大学毫米波国家重点实验室洪伟教授、新加坡国立大学陈志宁教授等。王海明负责撰写、统稿和最后定稿。特别感谢博士生张沛泽、陈炜琦等，以及硕士生曹逸、魏家豪、弓雅杰、王苏斌、师曼、谢家豪等提供的撰写帮助。此外，我们研究团队的研究生'
