- pgno: 156
  md: '化的曲线，它可以分为平稳段和振荡段，如果采集的所有样本在目标频点均处于平稳段，即样本的自谐振频率足够高，则这种方法可以工作。


    ![](img/cf98602880e9fcdd502be0d0247f6934_156_0.png)


    然而，由于样本数据采集是随机的，无法保证所有样本都有足够高的自谐振频率，因此可能会有样本在目标频点正好处于振荡段，电感值的振荡是难以预知的，这部分样本会极大干扰代理模型预测的准确性。在文献
    [139] 中，自谐振频率不够高的样本不会参与建模过程，这虽然使得代理模型的准确度更高，但是会大幅增加需要采集的样本数量，因为样本会在哪里产生振荡只有全波仿真后才能够确定。


    另外一种解决方法是变换代理模型需要学习的维度。这种方法不会直接学习频点与目标值之间的关系，而是采用某种数学变换（例如，离散余弦变换（discrete cosine
    transformation，DCT）或者函数拟合等）将频域变换为其他域[107,140]，变换后需要学习的数据量更少且能够较好地还原到频域。为了能够训练出预测更高精度的代理模型，用于变换的函数最好能满足以下要求：


    +   (1) 用于拟合的函数应尽可能简单。简单的函数往往只有少量的系数，因此训练模型的数据量也会更少。函数的选取最好是单项式，项数越多对预测的容差就越小。


    +   (2) 拟合越精准的不一定越好。用高阶多项式、傅里叶级数等拟合尽管可以获得精确的拟合效果，但是是实际学习时，有的曲线用较少的阶数就可以拟合，有的曲线则需要用高阶拟合，这造成了不同阶系数差异过大，不利于后续建模。


    +   (3) 拟合出来的系数尽量在相近的数量级。系数的差异过大意味着 GPR 代理模型具有较大的方差，只有方差越小才会获得更好的预测效果。


    使用函数拟合的方法可以大幅减少需要学习的数据量，同时如果用于拟合的函数的系数隐含着一定的物理意义，这个物理意义不需要太明确，机器学习挖掘系数背后的物理意义并建立每一个系数与物理之间的联系，进而训练出性能更好的代理模型。此外，用于拟合的函数需能够较好地把握原始曲线的特征，对于电'
