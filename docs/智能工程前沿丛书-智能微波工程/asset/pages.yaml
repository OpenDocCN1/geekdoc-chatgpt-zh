  md: '因组数据和语音处理领域也应用广泛。在高维问题中，t-SNE 为高维样本构建了一个概率分布，相似的样本被选中的可能性很高，而不同的样本被选中的可能性极小。t-SNE
    为低维嵌入中的样本定义了相似的分布。t-SNE 的本质是最小化两个分布之间关于嵌入点位置的库尔贝克-莱布勒 (Kullback-Leibler, KL) 散度。


    # 3.2.3 人工神经网络


    人工神经网络 (artificial neural network, ANN)，简称神经网络 (neural network, NN)，在机器学习和认知科学领域，该网络是一种模拟生物神经网络
    (动物的中枢神经系统，特别是大脑) 的结构和功能的数学模型或计算模型，用于对函数进行估计或近似。一般在机器学习中讨论的神经网络指的是“神经网络学习”，或者是机器学习与神经网络这两个学科领域的交叉部分，它模拟了生物神经系统对真实世界物体做出的交互反应。


    图 3.3 是一个基本的 MP 神经元模型，来自 n 个其他神经元的输入信号 \(x_i\), \(i = 1, 2, \cdots, n\), 通过带连接权重的连接传递到当前神经元，神经元将接收到的总输入值与神经元阈值进行比较，然后通过“激活函数”处理以产生神经元的输出。将多个类似的神经元按照一定层次连接起来就得到神经网络。


    ![](img/cf98602880e9fcdd502be0d0247f6934_56_0.png)


    # 图 3.3 MP 神经元模型


    感知机是由两层神经网络组成，通过设定合适的连接权重与阈值可以处理一些线性可分问题，即可用线性超平面划分的问题。由于感知机只拥有一层功能神经元，其学习能力有限，遇到非线性可分问题，如“异或”时，学习过程将会振荡，参数无法稳定地确定。通常需要在输入层与输出层之间增加一层或多层神经元来解决复杂的非线性可分问题。常见的层级结构神经网络如图
    3.4 所示，每层神经元与下一层全互连，不存在同层或跨层连接，这样的神经网络结构被称为“多层前馈神经网络”，输入层仅接收外界输入，隐藏层与输出层对信号进行加工，并由输出层输出。


    神经网络学习的过程就是根据训练数据来调整神经元之间的“连接权”以及功能神经元之间的阈值。针对不同问题需要选择复杂度合适的神经网络，足够的复杂度可以减小学习误差，而复杂度过高会影响网络的泛化能力，后者表现为在'
