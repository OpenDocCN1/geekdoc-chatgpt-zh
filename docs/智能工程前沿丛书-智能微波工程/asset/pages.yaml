  md: '# ## 7.3.2 案例 2: 宽频带优化


    除了最大化品质因数 \( Q \) 外，某些场景的电感值需要在宽频带范围内尽量保持恒定，并且仍旧能够保持不错的品质因数，这样的电感通常被应用于宽带电路中。

    此类问题通常的做法是约束频带内的每一个频点接近目标值，从而达到较好的效果。但是，对于超宽带而言，这样做会严重降低优化效率，因为有大量的频点需要评估。


    如果考虑电感曲线和品质因数曲线本身的特性，那么问题就会简单很多。对于电感曲线而言，只需要关注频带内的最大偏离点就足够了。除此之外，由于品质因数曲线的正值部分总是上凸函数，因此只要频带两端的品质因数满足目标，整个频带的品质因数也会满足目标。综上所述，设计一个目标带宽
    \( B_{\text{goal}} = 30\text{GHz} \sim 50\text{GHz} \)，\( Q_{\text{goal}} > 10
    \)，\( L_{\text{goal}} = 0.2\text{nH} \)，\( F_{\text{SRF}} > 70\text{GHz} \) 的可变电感，它满足表
    7.4 所示的几何约束，令 \( \delta_{\text{fluc}} \) 为工作频带内的电感值波动，则


    \(\delta_{\text{fluc}} = \frac{\max(|L_{\text{B}} - L_{\text{goal}}|)}{L_{\text{goal}}}\)
    (7.21)


    式中，\( L_{\text{B}} \) 是关注频带内的电感值。则 ASSI-HKDT 算法需要解决的问题是


    \(\min(\delta_{\text{fluc}})\)

    \(\text{s.t.}\left\{\begin{aligned} &\text{几何尺寸约束} \\ &Q_{30\text{GHz}} > 10 \\
    &Q_{50\text{GHz}} > 10 \\ &Q_{70\text{GHz}} > 0 \end{aligned}\right.\)


    该案例综合时间为 3.4h，表 7.5 的第三列展示了案例 2 中最优螺旋电感的几何参数。使用另一个单频点最大化品质因数的例子作为对比，该例子除了 \( F_{\text{goal}}
    \) 由 \( 20\text{GHz} \sim 50\text{GHz} \) 变为 \( 40\text{GHz} \)，目标变为最大化品质因数外，其他均保持不变，它们的结果对比如图
    7.14(b) 和表 7.7 所示。可以看出相比于最大化品质因数，宽带优化的电感值波动从 18.1% 下降到 4.2%，且仍旧满足设置的其他目标。


