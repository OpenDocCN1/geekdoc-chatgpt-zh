- pgno: 148
  md: '电感的性能进一步提升：在文献 [129–132] 中，螺旋电感的性能采用近似的解析表达式表示，并在全局优化算法的迭代中不断寻找最优解。这些利用等效电路和解析公式的方法都是基于物理原理的，因此可以归类为基于知识的螺旋电感综合方法。该方法通常专注于把握结构的一般特征，因此难免会忽略一些细节，从而获得粗糙的代理模型以加快仿真速度，这种方法在低频段大量应用。然而，随着频率的提高，金属与金属、金属与衬底之间的寄生关系将变得更加复杂，甚至不可预见，以至于工艺与拓扑结构稍有变化，这种基于知识的模型就不再适用且需要修正。


    为了解决该类问题，MLAO 方法已经逐渐应用于螺旋电感的综合。与基于知识的方法不同，MLAO 方法根据数据学习输入和输出之间的映射关系，不需要过多的物理机理。一般来说，该方法需要利用全波仿真软件获取一定数量的样本，然后通过
    ANN[82,110,133,134]、GPR [3,110,135,136]、SVM 或任何其他机器学习算法训练以获得代理模型。文献 [123,133]
    建立了基于人工神经网络的代理模型，实现了螺旋电感在低频下的自动合成。文献 [3] 提出了一种基于 GPR 的在线更新代理模型，它可以在迭代过程中逐步提升其预测的准确度，直到满足迭代终止条件。与基于知识的代理模型相比，如果训练得当，纯数据驱动的代理模型具有更好的适用性和更高的准确性。但是，纯数据驱动的模型训练需要大量样本，而且样本通常需要通过全波仿真获取，这会耗费大量时间，同时模型训练和预测也需要很长的时间。


    综上所述，基于知识的模型具有可解释的物理机理，可以提供更好的优化方向来提高综合效率，而数据驱动的模型可以把握一些等效电路或解析公式无法感知的细节，从而提供更好的预测结果。如图
    5.2 所示，采用 HKDT [66,137] 来平衡片上螺旋电感的综合与精度，从而实现毫米波乃至更高频段的片上螺旋电感自动综合。


    # 7.1 可变形的螺旋电感


    # 7.1.1 任意多边形螺旋电感绘制


    为了实现电感的自动化综合，首先提出一种任意多边形螺旋电感的绘制方法，利用该方法可以完成螺旋电感的自动建模过程。螺旋电感的基本形状由其最内圈的多边形所决定，在确定好螺旋电感的基本形状后，从内向外绘制线圈。已知最内圈多边形的顶点坐标为
    \(\boldsymbol{a}_1 = [x_1, y_1], \boldsymbol{a}_2 = [x_2, y_2], \cdots, \boldsymbol{a}_n
    = [x_n, y_n]\), \(n\) 为多边形边数。以下给出该方法的具体步骤：


    +   步骤 1. 在已知内圈多边形顶点坐标后，可求解内圈多边形各边的直线方程，


    ```

    \(k_1x + k_2y + k_3 = 0\) (7.1)

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: '式中，$k_1 = y_i - y_{i-1}$； $k_2 = x_i - x_{i-1}$； $k_3 = x_i y_{i-1} - x_{i-1}
    y_i$。也可求得各边的单位方向矢量，


    $$e_i = \frac{a_i - a_{i-1}}{||a_i - a_{i-1}||} \tag{7.2}$$


    将单位方向矢量 $e_i$ 乘以顺时针 $90^{\circ}$ 旋转矩阵 $T$ 后可得各边法向单位方向矢量，


    $$t_i = e_i T \tag{7.3}$$


    式中，


    $$T = \begin{bmatrix} \cos(-\pi/2) & -\sin(-\pi/2) \\ \sin(-\pi/2) & -\cos(-\pi/2)
    \end{bmatrix} \tag{7.4}$$


    以四边形为例，单位方向矢量 $e_i$ 和法向单位方向矢量 $t_i$ 如图 7.1 所示。


    ![](img/cf98602880e9fcdd502be0d0247f6934_149_0.png)


    图 7.1 单位方向矢量与法向单位方向矢量


    步骤 2. 在求得最内圈多边形的各项参数后，由于螺旋电感的各边均与最内圈多边形平行，且螺旋电感的线宽与线距是已知的，因此将最内圈多边形的各条边依次沿着法向向外平移。例如，将直线沿向量
    $\boldsymbol{p} = [m, n]$ 平移，其中 $\boldsymbol{p}$ 代表沿法向平移所需的距离，则可以得到新的直线方程，


    $$k_1(x - m) + k_2(y - n) + k_3 = 0 \tag{7.5}$$


    步骤 3. 如图 7.2 所示，螺旋电感的各顶点由直线两两相交得到。'
