  md: '引入 MLAO 方法，在给定 ITR 的情况下，对 WCP 进行搜索。利用全局优化方法，对计算复杂度低的代理模型或理论模型进行优化搜索。在天线设计的应用中，有别于传统的
    MLAO 架构，此处的 WCP 搜索既不对优化结果进行全波仿真验证，亦不对机器学习代理模型进行在线更新；在阵列综合的应用中，可以直接使用阵列综合理论模型对阵列响应进行求解。在上述两种策略下，单次
    WCP 搜索的时间被控制在数秒钟之内，从而为后续的数据集建立的过程提供了实现的可能性。WCA 的具体步骤如下：


    +   步骤 1. 采样。在给定的 ITR 中对设计参数组成的向量进行采样，利用高精度仿真计算获得所采样的向量集合对应的响应集合来作为训练集。


    +   步骤 2. 建立代理模型。利用机器学习方法建立每个设计目标的代理模型。


    +   步骤 3. 基于代理模型进行优化。采用全局优化方法对 WCP 进行搜索，其中适应度函数的计算基于代理模型的预测。


    # 6.2.4 最大输入容差超体积搜索


    一旦对任意给定的设计点和相应的 ITR 获取精确的 WCP，MITH 搜索过程即可被简化为一个受限条件下的优化问题。对于给定的设计点，优化算法的目标可被视为在所有满足
    OTR 的可能的 ITR 中，找到 MITH 所对应的 ITR。在大多数实际问题中，潜在的最优的 ITR(即 MITH 对应的 ITR) 的各参数维度间的比例无法被事先获知。在此情况下，相较于基于梯度信息的局部优化方法而言，一些启发式的全局优化方法更有可能获得鲁棒的全局最优解。然而，这种全局优化方法通常需要相当多的对适应度函数的计算，因此需要采用
    MLAO 降低 MITH 搜索对计算资源的需求。下面给出采用 MLAO 的 MITH 搜索算法的具体步骤：


    +   步骤 1. 初始化。对给定的设计点、OTR 和计算模型，需要在考虑所有可能的加工误差等条件的基础上，定义合理的设计范围。基于与传统的优化过程的差异，该设计范围可能需要被设定为大于传统的优化过程的设计范围，可以考虑到分布在传统设计范围的边界上的设计点的情况。对天线设计而言，OTR
    通常被设置为在工作带宽内所能容众的最差的回波损耗、副瓣、增益等特性。同时，需要约定后续步骤所采用的，计算适应度函数所使用的模型：模拟计算复杂度高的全波仿真模型的、由机器学习等方法建立的代理模型，或一些计算复杂度低的基于物理知识的理论模型。


    +   步骤 2. ITR 向量采样。同时采用随机采样策略，如拉丁超立方采样 (Latin hypercube sampling, LHS) 和均匀采样，在事先给定的设计范围内，分别采样得到
    \( N_r \) 和 \( N_u \) 个 ITR 向量集合。上述联合采样的策略可以同时考虑不同设计参数的参数敏感性差异及效率。基于所使用的实际场景，设计者亦可以根据已知的理论知识，引入其他可能的采样策略，以提升采样点所能提供的信息密度。'
