  md: '感值曲线而言，平稳段的电感值、振荡段尖锐程度以及零点位置是比较重要的，而对于品质因数曲线，曲线的峰值点和零点是比较重要的，同时以上曲线的负值部分都不在关注范围内。


    结合电感值曲线和品质因数曲线本身的形状及以上内容，提出一种新的用于拟合电感值的函数，


    ```

    L(f) = \hat{L}_{smooth} \sin \left( \frac{\pi}{f - \hat{F}_{SRF} + \frac{\hat{L}_{max}}{f
    - \hat{F}_{SRF}}} \right) + \hat{L}_{bias} \quad (7.14)

    ```


    式中，带尖号的参数为需要拟合的系数； \(\hat{L}_{smooth}, \hat{L}_{bias}\) 为控制电感值曲线平稳段的电感值； \(\hat{F}_{SRF}\)
    为控制零点位置，即自谐振频率； \(\hat{L}_{max}\) 为控制谐振部分的峰值点。大多数情况下，品质因数的正值部分是一段光滑的圆弧曲线，如图 7.9
    所示，因此用于拟合品质因数正值部分的函数为


    ```

    Q(f) = \widetilde{Q}_{max} \exp \left( - \left( \frac{f - \widetilde{F}_{Qmax}}{\widetilde{F}_{SRF}}
    \right)^2 \right) + \widetilde{Q}_{bias} \quad (7.15)

    ```


    式中，带波浪号的为需要拟合的系数； \(\widetilde{Q}_{max}, \widetilde{Q}_{bias}\) 为控制品质因数的峰值，即最大品质因数；
    \(\widetilde{F}_{Qmax}\) 为控制极值点出现的位置； \(\widetilde{F}_{SRF}\) 为控制品质因数曲线的宽度，即自谐振频率大小。该函数可以提取品质因数大于
    0 时的特征，包括品质因数峰值点和零点，品质因数负值部分往往并不重要，保持为负即可。


    ![](img/cf98602880e9fcdd502be0d0247f6934_157_0.png)


