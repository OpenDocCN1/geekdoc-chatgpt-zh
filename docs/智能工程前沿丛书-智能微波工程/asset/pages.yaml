    在具体的实施方式中，所述的设计目标可以为天线的 S 参数、增益、天线方向图的 3dB 增益波瓣宽度、天线方向性、圆极化天线的轴比或圆极化增益等。在具体的实施方法中，步骤
    1 中的第一种仿真方法可采用低保真度全波仿真、经验或理论公式，或者电路模型仿真等；第二种仿真方法可采用高保真度全波仿真；样本点在天线参数的设计区间内随机取样得到。在具体的实施方式中，在步骤
    2 中可采用非对称的多目标高斯过程回归 (MOGPR) 机器学习或人工神经网络方法学习数据集 $D^1_{fine}$ 与 $D^1_{coarse}$ 之间的联系，并预测得到
    $D^1_{pre,fine}$；在步骤 3 中采用对称的多目标高斯过程回归机器学习方法或人工神经网络方法学习数据集 $D^2_{fine}$ 和 $D^1_{pre,fine}$
    之间的联系，并预测得到 $D^2_{pre,fine}$；在步骤 4 中利用单目标高斯过程回归机器学习方法或人工神经网络方法学习得到数据集 $D^1_{pre,fine}$
    和 $D^2_{pre,fine}$ 学习天线设计参数和设计目标之间的关系。


    与现有的机器学习相比，多级协作式机器学习具有如下优点：


    +   (1) 由于高保真度训练数据集的建立需要占用大量的计算和时间，多级协作式机器学习通过建立不同保真度的数据集之间和不同设计目标之间的关系，大大减少了所需的高保真度训练数据集的个数，快速建立足够高保真度的代理模型。


    +   (2) 分别建立不同保真度的数据集之间和不同设计目标之间的关系，由此得到较为高保真度的辅助数据集，利用得到的辅助数据集，建立天线设计参数和设计目标之间的代理模型，实现对天线不同设计目标的精准预测。


    # 4.3 多路径机器学习辅助优化


    # 4.3.1 置信下限预筛选


    由于初始代理模型是通过少量样本建立的，难以在优化时得到高精度的代理模型，需要通过迭代的方式新增样本点来得到或逼近优化目标。这类序贯加点的优化方式通常采用数据预筛选技术，指导迭代中样本点的新增区域。其中置信下限
