    式中,要求收发天线的极化匹配,否则会引入额外的极化损耗.特别地,定义 $32.45 + 20 \log_{10} f + 20 \log_{10} d$ 为自由空间路径损耗。显然,
    在自由空间中, 电波的能量并没有损失, 即传播中的均匀平面波是等振幅波。其传播损耗是由于点源发射的球面波在传播过程中随传播距离的增加而导致球面波扩散, 进而使得接收点处的功率密度减小,
