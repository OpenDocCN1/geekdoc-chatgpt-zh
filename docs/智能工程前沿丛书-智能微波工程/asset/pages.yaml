    \ AEP。考虑具体的线阵情况，ABEM 的输入即为阵元的绝对位置、与周边阵元的相对位置及平台参数，其输出为 AEP 的幅度、相位以及有源 S 参数。在线阵中，单元的绝对位置\
    \ $x_a$ 和平台的参数 $x_p$ 可以直接作为模型的输入，而单元的相对位置可以通过下式表示：\n\n```\n\\(x_{r,k} = \\begin{cases}\
    \ 1/l_{r,k}, & \\text{如相邻的第 } k \\text{ 个单元存在} \\\\ 0, & \\text{如上述单元不存在} \\end{cases}\\\
