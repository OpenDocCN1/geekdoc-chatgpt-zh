    # 8.3.2 物理统计信道模型


    结合图 8.9 及郊区植被覆盖区场景信道建模结果，可以发现存在树木遮挡将会造成额外的植被穿透损耗，提高相应信道的时延和角度扩展。为了探明接收机、树木相对位置变化以及其他系统配置对信道特性的影响，首先需要构建相应的物理统计信道模型，并将影响信道特性的主要环境特征和系统配置作为神经网络输入，提高
    ANN 训练的效率和准确性。同时，构建的物理统计模型也与 ANN 模型预测结果比较，证明智能信道模型的优越性。


    +   1. 植被穿透损耗


    根据 ITU-R P.833-10 中关于植被穿透或附加损耗的定义[162]，植被穿透损耗表示由于存在树木遮挡导致相对于其他任何传播机制（自由空间传播、反射和绕射等）产生附加传输损耗。因此，针对实测和仿真数据植被穿透损耗的计算方法包括：


    +   1) 方法 1. 适用于实测数据


    由于需要对前向植被散射簇内信道进行建模，因此只考虑前向植被散射方向的有效接收信号。同时，在收发信机直射路径方向只存在经过树木的多径散射信号，而不存在环境反射信号，此时植被穿透损耗可以定义为相对于自由空间路径损耗的附加损耗，表示为


    ```

    \( L^{\text{Meas}}_{\text{forward, v}} = \text{EIRP} + G_R + G_S - 10 \log_{10}
    \left( \sum_{\Omega \in A_v} P(\Omega) \right) - \text{PL}_0(d) \) (8.19)

    ```


    式中，EIRP 表示包含发射功率、发射天线增益在内的等效全向辐射功率；\( G_R \) 表示接收天线增益；\( G_S \) 表示通过系统校准获得的测量系统增益；\(
    P(\Omega) = P(\theta, \phi) \) 表示三维 APS；\( \theta \) 和 \( \phi \) 分别表示俯仰和水平到达角；\(
    A_v \) 表示经过植被散射空间的角度范围。自由空间路径损耗表示为 \( \text{PL}_0(d) [\text{dB}] = 20 \log_{10}(4\pi
    d/c f)\)，\( c \) 和 \( f \) 分别表示自由空间光速和频率。此时，前向植被散射空间瓣通过相对于 APS 峰值功率 20dB 的功率检测门限估计得到。'
