    \( K \)、\( \tau_k \)、\( \Phi_k \)、\( \Omega_k \)）；再将簇的类型以及相应的系统配置和环境信息作为输入，调用相应的神经网络生成簇内信道参数（如
    \( \alpha_{k,l} \)、\( \varphi_{k,l} \)、\( \tau_{k,l} \)、\( \Phi_{k,l} \)、\( \Omega_{k,l}
    \)）。重复此步骤直到生成得到所有的多径簇。


    ![](img/cf98602880e9fcdd502be0d0247f6934_182_0.png)


    图 8.5 知识和数据混合驱动的智能信道建模流程


    在生成簇内信道参数时，需要调用离线训练得到的神经网络预测相应的簇内信道参数。在构建相应的簇内信道预测器时，首先需要通过信道实测、射线追踪仿真和（或）信道仿真器等途径获取信道数据并提取有效的信道参数，然后从物理统计模型出发，探明不同系统配置和环境特征对簇内信道特性的影响，最后在模型训练时加入相应的特征参数用于标记信道数据，以保证预测器可以灵活适用于不同传播环境。本章后续将会以前向植被散射簇为例，详细介绍如何应用人工神经网络完成知识和数据混合驱动的簇内信道建模。


    # 8.3 应用实例：前向植被散射簇的智能建模


    以郊区植被覆盖区毫米波信道实测结果为例，图 8.6 比较了具有相近传播距离的 LOS 和遮挡视距路径（obstacle-LOS, OLOS）接收机位置处的功率时延角度谱（power
    delay angular profile, PDAP）。不难发现接收信号主要来自于收发端'
