- pgno: 14
  md: '在微波工程中，如果要分析或设计元器件、部件、子系统或系统，可以直接从三维电磁场的麦克斯韦方程组及求解出发。这种方法通常被称为电磁场全波求解。但是，麦克斯韦方程组包含作为空间坐标函数的向量表示场量的向量微分或积分运算，求解这些方程将带来非常复杂的数学运算。在很多实际应用场合，即使现代高性能计算机的计算力也远远跟不上电磁场全波求解所需的超高复杂度计算需求。为此，微波工程的目标之一是试图将这个复杂的场求解问题简化为可用更简单的电路理论来求解。


    # 1.1 主要研究进展及发展趋势


    # 1.1.1 微波电路与系统


    20 世纪初，无线电技术的快速发展主要发生在高频（HF）到甚高频（VHF）的范围内。20 世纪 40 年代的第二次世界大战中，雷达的出现和应用使得微波理论和技术被广泛重视。以雷达为主要应用目标，美国麻省理工学院辐射实验室的科学家们对微波理论进行了一系列深入研究，将微波理论推向了一个崭新的高度，这些理论包括波导理论、微波天线理论、小孔耦合理论和微波网络理论等。


    如今，微波电路与系统广泛存在于包括通信、雷达、遥感和医学等多个领域，成为现代文明最重要的基石之一。20 世纪 70 年代首次提出了蜂窝移动电话系统，其诞生正是得益于对微波电路和系统的研究，其从
    1G 到 5G 爆发式的发展，反之又大大促进微波电路与系统的研究与发展。随着现代无线移动通信和雷达等无线电系统的迅猛发展，设计满足低成本、小尺寸、高质量、高集成度等要求的微波电路与系统成为国民经济发展与国防建设中的关键环节。微波电路与系统通常由相当多的元部件组成，而这些元部件又由多个设计参数定义，然而这些成千上万个参数的组合中只有极少数组合能同时满足设计规范和指标要求。


    人工智能的引入能够以多种途径显著加速微波电路与系统的设计收敛[3,4]。文献 [3] 提出了一种基于机器学习的高效差分进化算法，并将其应用于线性射频放大器的综合设计，该方法利用在线更新的高斯过程回归（Gaussian
    process regression, GPR）代理模型来评估放大器的性能，相比于离线的代理模型，在线更新代理模型可以在迭代中逐步提升预测精度，结合全局优化算法寻找全局最优解。例如，设计一个工作在
    100GHz 的放大器，要求其增益尽可能高，相比于没有应用机器学习仅仅利用全局优化和全波仿真的方法，该方法优化得到的放大器有着不可比拟的性能，带宽都超过了
    20GHz，且增益超过了 10dB，而且应用机器学习的方法在时间上缩短至 1/9，大幅度提升设计效率。文献 [4] 利用基于加权期望改进的贝叶斯优化方法结合多起点局部搜索等策略，研究了人工智能方法在变压器'
