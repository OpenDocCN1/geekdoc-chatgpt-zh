  md: 等信息作为 ANN 的输入以满足不同应用需求。此外，对于不同类型的多径散射簇内信道特性建模，可以不单纯局限于使用 ANN 等模型进行建模。例如建筑或墙面反射簇，由于电磁波在不同类型材料表面上的反射特性遵循反射定律，因此可以结合几何光学方法和一致性几何绕射方法的先验物理传播知识，进一步提高机器学习辅助智能信道模型的准确性。
