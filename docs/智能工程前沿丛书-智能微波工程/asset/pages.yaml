    # 2) 绕射


    绕射使得电磁波能够绕过障碍物在其阴影区内传播。尽管障碍物的遮挡使得电磁波在接收点处的场强迅速衰减，但绕射场依然存在并且常常具有较强的场强。通常绕射现象可以用惠更斯原理进行解释。惠更斯原理认为所有的波前点都可以作为产生次级波的源，这些次级波叠加起来形成传播方向上新的波前。绕射由次级波传播进入障碍物的阴影区而形成。在围绕障碍物的空间中，阴影区绕射波场强是所有次级波电场部分的矢量和。目前，在移动通信中主要研究边缘绕射模型、单峰和多峰楔形绕射模型，并对其绕射损耗进行估计和建模。


    # 3) 散射


    反射是电磁波遇到物理尺寸远大于其波长的物体时所发生的物理现象，而当电磁波遇到物理尺寸小于其波长的物体时，将会发生散射。散射是在粗糙表面上发生的反射，其能量散布在各个方向，如图
    2.10 所示。在散射理论中，通常假设粗糙表面是随机的，然而在实际的建模过程中该表面可能是一种确定的或周期性的结构，主要涉及基尔霍夫（Kirchhoff）理论和摄动理论。


