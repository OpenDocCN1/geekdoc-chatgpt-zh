- raw: '然而，全球化在存在论上改变了世界的概念。在传统的世界概念里，任何实体之间的合作都没有达到可能利益的极限，在理论上总是存在更好的机会，而全球化把利益最大化的空间尺度推到了世界尺度，为利益最大化建立了极限标准，于是占有世界市场就成为利益最大化的最大尺度，因为不存在另一个世界。世界是博弈策略的存在论界限。在此可以看到存在论如何限制了逻辑：逻辑无穷大，在“逻辑时间”里存在着无穷多可能性，但那些无穷多的可能性并不真实存在，而一旦进入真实存在，可能性就受制于特定的存在状态，只剩下“多乎哉”的寥寥选项了。这意味着，想要无穷性，就只能不存在；想要存在，就只能屈服于有限性。200年来全球化的“存在论”后果是把全球化变成了谋求利益最大化的“占优策略”。由此来看，全球化的博弈会出现冲突或策略性的倒退，如前面所分析的可能性，由“分工的全球化”转向“竞争的全球化”，一旦竞争激化就可能造成无利可图的进退两难状况，因此，从中长时段来看，世界可能会谋求全球化的升级以谋取稳定的利益。目前的全球化是低水平的全球化，是在无政府状态的世界中进行的粗放运动，有动力、有能量，但是无秩序、无制度，就是说，低水平的全球化尚未具有稳定的全球性（globality）。按照古希腊人的说法，无秩序的混沌整体（chaos）尚未变成有秩序的整体世界（cosmos）。可以说，新型冠状病毒大流行未必是预告全球化终结的句号，或许是以一个感叹号提示了还存在一个全球性的建构问题。


    任何存在的改变都需要概念层次上的改变，否则只是表面化的变形。因此，形而下的严重问题就会引出形而上的问题。新型冠状病毒给人类的提醒是，如果要修正当代社会形而下系统的脆弱性，恐怕就需要修正其形而上的观念假设和思维方式。哲学并非纯粹观念，而是隐藏着的病毒。马库斯·加布里埃尔相信，在新型冠状病毒大流行过后，人类需要“一场形而上的大流行”。这是一个富有想象力的建议，我们的确需要一场像流行病一样有力量的形而上反思，让思想获得集体免疫，这需要找到一个突破性的“升维”条件，即发现或创造比现代思维空间高出一个维度的思想空间，才能够摆脱现代思维空间的限制。如果没有思想维度的突破，对现代思想的反思会因为受限于现有空间内部而奔波在解释学循环中，即使其解释角度越来越丰富深入，但因为只是内部循环，就不足以摆脱现代思想的向心力，也就不可能超越现状。


    加布里埃尔很正确地批评了现代的科学压倒了道德，可是他呼唤的人文道德仍然属于现代性内部的观念，比如平等和同情。这里有个难以摆脱的困境：如果现代科学压倒了道德，那么就证明了目前的道德观念明显弱于现代科学，也就没有能量定义生活、社会和规则。可以发现，真正需要被反思的对象正是“我们的”道德观念系统。我们更需要的是一种维特根斯坦式的“无情”反思，从伦理学的外部来反思伦理学，否则其结果无非是自我肯定，即事先肯定了我们希望肯定的价值观。


    现代的主流思维模式强调并且追求普遍必然性，它象征着完美性和力量。后现代思想虽然对此多有批判，但没有触动现代在存在论上的结构，只要一个问题超出了话语而落实到实践，就仍然只有现代方案而没有后现代方案。现代性如此根深蒂固，根本在于它塑造了最受欢迎的人的神话。人类试图掌握自己的命运，试图按照人的价值观来建立普遍必然性（普遍必然性的荣耀本来归于神或宇宙），这是现代人为自己创造的形而上神话。后现代在批判现代性时尤其批判了科学的神话，其实，现代神话不是科学，而是人的人文概念。人的神话假设了人的完美概念，抄袭了许多属于神的性质，包括人要成为自然的主人，人要成为按照自己的意志创立规则的主权者，每个人要成为自由的主权者，以至“人”的概念几乎变成了神的缩影。然而，人的神话缺乏存在论的基础，人并无能力以主体性定义普遍必然性，也无能力把“应然”必然地变成“实然”。现代人确实试图借助科学来为人的世界建立普遍必然性，但这是一个人文信念，而并非科学本身的意图。事实上，科学从来都承认偶然性和复杂性，始终在思考动态变量（从函数到微积分到相对论和量子力学），反而是人文信念在想象普遍价值、绝不改变的规范或神圣不可侵犯的权利。不能忽视的是，这不是一个知识论的信念，而是一个政治信念。莱布尼茨早就证明了，要具备定义普遍必然性或无条件性的能力，就需要能够“全览”逻辑上的所有可能世界，相当于无穷大的能力。人显然不具备这种能力。


    无论选取哪些价值观作为一个社会的基本原则，如果设定为“无条件的”或在任何情况下普遍有效，就会缺乏应变性和弹性，在实际情景中容易导致悖论。一成不变不是任何一种可能生活的特征。假如规则是死的，人就死了。如果允许给出一个“数学式的”描述，我愿意说，生活形式都具有“拓扑”性质，其好的本质可以维持不变，类似于拓扑的连续性，而其具体表现则如同拓扑的可塑性，根据具体情况和具体需要而被塑形。虽然黑格尔的命题“现实的就是合理的”容易被误解，但问题是，如果一个观念在现实中不可行，那只能说明这个观念是可疑的，而不能证明这个现实不应该存在。休谟认为，不可能从事实推论价值，这在大多数情况下是正确的。另一方面，似乎还可以说，从价值推论事实恐怕更加困难。


    哲学苦苦寻求的普遍必然性在生活世界里难有见证，它只存在于数学世界中。这是因为数学的世界是由数学系统定义并建构出来的，并非现实世界的镜像。数学系统中的存在物，或因定义而存在，或因“能行构造”而存在，所谓“存在就是被构造”（直觉主义数学的表述），所以数学中的存在物是数学系统的一个内部事实，因此能够依照逻辑而建立普遍必然性。与之对比，人文观念要解释的问题和事物都具有外在性，由不可控制的事物、实践和变化组成，人文观念只能在变化的世界中去寻找合适的落脚点。如同容易受到环境影响而易挥发、易溶解或易氧化的物质一样，用于解释生活的概念也缺乏稳定性。在平静无事的时段里，人文观念也平静无事，但在多事之秋，人文观念就会被问题化。


    大多数的人文观念都有自圆其说的道理，所以很少见到在辩论中被驳倒的人文观念或者“主义”（除非被禁止表达）。然而，人文观念却很容易被现实驳倒，所以概念最怕具体化或情境化，因为一旦具体化就会问题化，一旦问题化就会被现实解构，尤其是那些宏大概念，比如幸福、自由、平等、双赢、人民、共同体等。德里达用了很大力气去解构宏大概念、权威和中心，其实那些宏大概念在变化难测和自相矛盾的实践中从未完美地存在过。


    人类缺乏与大自然相匹配的无穷多维智力，尽管人类能够抽象地理解多维的世界，并且鄙视一维或线性的思维方式，但实践能力的局限性迫使人只能一维地做事，于是实践所要求的“排序”问题就难倒了人——尽管看起来只相当于小学一年级的算术难度。一方面，事情是复杂而动态的，所以生活需要多种并列重要而且不可互相还原的价值才得以解释；另一方面，实践迫使我们对价值做出排序，即优先选择。只要存在着排序难题，人们就很难在生活所需的多种事物或多种价值之间维持平衡，而失去平衡就等于每种事物或价值观都失去自身的稳定性，也失去互相支撑、互相作保的系统性，只要遇到严重危机，价值观和制度就陷入两难困境。这是秩序或制度从来没有能够解决的问题。这表明了，不仅人造的社会系统有着脆弱性，指挥着行为的思想或价值观系统同样有着脆弱性，这正是文明的深层危机。


    如果说，形而下的危机来自现实的“锐问题”，那么形而下的危机所触动的“深问题”就构成了形而上的危机。新冠肺炎疫情就是一个触动了“深问题”的“锐问题”。其中一个问题就是，现代所理解的政治概念本身就是一种隐藏的自杀性病毒，它在破坏政治的概念。无论政府还是媒体或者新型权力，如果一种政治势力有权力指定价值观，那就是专制。价值观只能是人在长期实践中自然形成的集体选择。显然，人有着众多的群体，因此有着多种集体选择，也就存在着分歧和冲突。有能力保护文明的政治不是斗争，而是在文明冲突的丰富性和复杂性之中建立平衡的结构性艺术。如果政治只是斗争，就无非重复和强化了现实中已经存在的冲突，在斗争之上再加斗争，不是多余的就是加倍有害的。斗争是本能，不是政治。政治是创造合作的艺术——假如政治不能创造合作，又有何用？


    因此，人类需要反思的形而上问题不是应该赞成和支持哪一种价值观——这只是形而下的斗争，而是作为人类共享资源的思想系统是否合理，是否足以应对生活遇到的可能性。换句话说，思想观念的有效性和合理性的基础是什么？什么事情人可以说了算？什么事情人说了不算？什么事情可以听从理想？什么事情必须尊重事实？在新冠肺炎疫情情境中，问题更为具体：什么事情必须听从科学？什么事情可以听人的？什么事情要听病毒的？


    ### 危机：生存之道和游戏规则


    理论之所以在自身的空间里可以自圆其说，而进入实际案例就有可能崩塌，是因为理论和现实是两个空间。理论空间的法则是逻辑，而现实空间的法则是规律，两者不可互相还原，所以现实不听从理论。尽管理论可以部分地“映射”现实（通常说“反映”现实，但这个镜像比喻不准确），然而建构方式完全不同。只有当现实处于稳定、平静、确定的状态时，理论对现实的映射才是部分确定的，而只要现实进入动荡的“测不准”状态，理论概念就互相冲撞、互相妨碍乃至失灵。理论不怕认真，只怕现实的危机。既然现实不会自己走近理论，那么理论就需要走近现实。


    如果说，当代性的一个主要特征是预支未来，那么当代性的另一个相关特征就是危机状态，事实上大量的危机正是预支未来所致。当代几乎所有系统都处于“紧绷神经”的状态，而危机形成了思想困境的临界条件。一个典型情况是，危机往往导致伦理学悖论，最常见的伦理学悖论就是优先拯救的困境（比如“有轨电车两难”）。新型冠状病毒大流行为优先救治难题提供了实例。医疗能力有着充分余量的国家，当然不存在这个困境，每个人都可以获得救治的机会。但在呼吸机不足的那些国家，优先救治就成为难题。现实条件排除了理想的选择，而延迟选择也是罪。在此，想象力受到了挑战。实际上的可能选项大概只有如下几种。


    第一，按照先来后到，这是平等标准。第二，按照轻重缓急，这是医疗标准。第三，按照支付能力，这是商业标准。第四，优先妇女儿童，这是一种伦理标准。第五，优先年轻人，无论男女，也是一种伦理标准。其中，除了第三项是可疑的，其他标准都有各自在理性上竞争的理由。如果考虑知识论的理由，那么第二项最有道理；如果考虑伦理学理由，那么第四项和第五项都更有道理。假设有的地方优先救治更有机会存活的年轻人（纯属假设），这个选择会受到质疑，可是这种选择已经是相对最优选择之一，与第二项并列相对最优。没有一种选择是严格最优的，都有某种缺陷。也许第二项的“负罪感”相对最低。尽管人们都希望一种能够拯救每个人的最优伦理，然而超出实践能力的最优理念只存在于图书馆。康德早就发现：“应该”不能超过“能够”。


    我们千万不能把这种分析误解为反对最优的伦理设想。关键是，最优的伦理设想未必是一个最优理论。一个最优理论必须具有覆盖所有可能世界的充分理论能力：一方面要把“最好可能世界”考虑在内，否则就没有理想的尺度去检查有缺陷的现实；另一方面要把“最差可能世界”考虑在内，否则就没有能力防止或应付严重危机。如果一种伦理学或政治哲学不考虑“最差可能世界”，而假设了优越的社会条件，就是一种缺乏足够适应度而经受不住危机的脆弱理论。新型冠状病毒大流行迫使许多地方实行的“隔离”就成为一个争论焦点。其实，比起战争、大洪水、大饥荒或社会暴乱，隔离状态算不上最差情况。


    “隔离”成为哲学争论焦点与阿甘本有关。阿甘本认为，以“无端的紧急状态”为借口的隔离是滥用权力，而滥用权力的诱惑很可能会导致通过剥夺人民的自由以证明政府权力的“例外状态”变成常态。这个论点提醒人们的是，权力在本性上倾向于专制，只是平时缺少机会和借口。这是个重要问题。但隔离的目的是否真的是政治性的，或是否没有比政治更紧要的考虑，这也是问题。人类生活的各种需求就其严重程度而有着存在论的顺序，生存通常位列第一。但阿甘本提问：“一个仅仅相信幸存，除此以外不再相信一切的社会又会怎样呢？”这是个更深入的问题。假如活命只不过是苟活，那可能不如去死。然而，这些问题似乎把新冠肺炎疫情的语境无节制地升级，从而导致了问题错位，为应对新冠肺炎疫情而采取的隔离是否达到了“不自由毋宁死”或“好死不如赖活”的极端抉择？阿甘本对因新冠肺炎疫情隔离的理解未免“人性，太人性了”（尼采语）。以反对隔离来捍卫自由，这暗示了其反面意见似乎就是支持滥用权力，但这是一个陷阱。与阿甘本真正相反的观点其实是，人只能承认生活有着无法回避的悖论。人类享有的自由、平等和物质生活是文明的成就，这些文明成就的立足基础是数万年的艰苦卓绝甚至残酷的经验，而这些文明成就并非一劳永逸地享有，要捍卫文明就仍然会经常有吃苦的经验。正如经济学永远不可能清除“成本”的概念，任何文明成就也永远不可能排除“代价”的概念。代价是一个存在论概念，是存在得以存在的条件。


    有一个需要澄清的相关问题是：这隔离不是那隔离。对传染病实行隔离法是一个古老经验。秦汉时期已有局部隔离法，被称为“疠所”，即麻风病隔离所。古罗马在查士丁尼大帝（527—565年在位）时期也发明了麻风病隔离法。现代的“检疫隔离”（quarantine）概念来自中世纪对黑死病的隔离，意思是40天隔离。检疫隔离有别于“社会隔离”（isolation）。社会隔离通常具有政治性和歧视性，比如历史上欧洲对犹太人的隔离或美国对黑人的隔离。混同检疫隔离和社会隔离会误导对问题性质的判断。为应对新冠肺炎疫情而实施的隔离显然属于检疫隔离，却不是社会隔离。虽然不能完全排除检疫隔离被权力利用从而变成社会隔离的可能性，但就其主要性质而言并非政治性的。假定阿甘本仍然坚持对检疫隔离的政治化理解，把它归入当权者乐于使用的“例外状态”，那么还可以追问一个侦探式的问题：谁是检疫隔离的受益者？不难看出，危急时刻检疫隔离的受益者是全民。既然受益者是全民，检疫隔离就很难归入政治性的例外状态，而应该属于社会性的应急状态。除了全民的安全，检疫隔离还有效地保护了医疗系统的能力。如果医疗系统因无法承载超大压力而崩溃，则全民的安全保障也随之崩溃，而如果社会秩序、医疗系统和经济一起崩溃，个人权利就只是无处兑现的废币，虽有票面价值，但失去了使用价值，个人权利就变成不受保护的赤裸权利，而赤裸权利肯定无力拯救阿甘本关心的“赤裸生命”，到那个时候恐怕就真的变成政治问题了。


    这个政治问题就是：到底是什么在保护个人权利？首先，宪法和法律是制度上的保证。进而，任何事情都必须落实为实践才真正生效，权利也必须落实为实践才真正兑现。实践涉及的变量太多，几乎涉及生活中的所有变量，已经超出了任何一个学科的分析能力，只能在一种超学科的概念里去理解。实践问题等价于维特根斯坦的游戏问题，因此可以借用维特根斯坦的游戏的一般分析模型。按照维特根斯坦的游戏概念，一个游戏需要共同承认才生效，同时，游戏参加者也就承认了游戏的规则，这一点已经默认了游戏的一个元规则，即任何一个游戏参加者都没有破坏规则的特权，或者说都不是拥有特权的“例外者”，比如说没有作弊耍赖或要求特殊对待的特权。游戏概念有助于说明，如果社会是一个游戏，那么个人权利并不是一种私人权利，也就是说，个人权利是游戏所确定的平等权利，并不是一种由私人意愿所定义的特权。于是，在游戏中只有合法的（相当于合乎规则的）个人行为，但没有合法的私人行为。按照自己的自由意志做出的私人行为只在私人时空里有效，如果私人行为入侵了游戏的公共时空或他人的私人时空，就不再合法了。其实这正是法律的基础。比如，一个人在自己房间里饮弹自尽，这是私人行为，但如果一个人在公共空间里引爆炸弹自尽而伤及他人，就不再是私人行为，而是破坏游戏规则的个人行为，即违法行为。同理可知，在检疫隔离的行为中，如果一个人把可能伤害他人的行为理解为私人说了算的自由权利，就是把人权错误地理解为个人特权。就像不存在一个人自己有效的私人语言（维特根斯坦定理），也不存在一种只属于自己的私人政治。政治和语言一样，都是公共有效的系统。如果把个人权利定义为绝对和无条件有效的，就有着私人化的隐患，不仅在理论上会陷入自相矛盾，在现实中也必定会因遇到同样绝对无条件的他人权利而陷入自相矛盾。


    但是，当代的一个思想景观是，观念已经不怕逻辑矛盾，也不怕科学，转而凭借政治性而获得权力。福柯的知识考古学发现，这种现象早就发生了，知识和权力的互动关系产生了“知识—权力”结构，其结果是，在社会知识领域，知识的立足根据不再是知识本身的理由，而变成了政治理由。这可以解释观念是如何变成意识形态的。当观念试图以政治身份支配现实时，就变成了意识形态，或支配性的“话语”。意识形态正是当代“后真相时代”的一个基础，其另一个基础是全民发言的技术平台。在社会视域里，理论、理性分析和对话被边缘化甚至消失，几乎只剩下政治挂帅的大批判。并非真相消失了，而是“眼睛”和“耳朵”没有能力走出后真相话语。后真相话语形成的意识壁垒又反过来加强了意识形态。在后真相时代，并非所有话语都是意识形态，而是每一种能够流行的话语都是意识形态。意识形态化是话语的在场条件，否则在话语平台上没有在场的机会。后真相话语的叙事助力有可能把突发的暂时性危机变成长期危机。病毒只是自然危机，而关于病毒的叙事却可能成为次生灾害。


    ### 苦难的本源性


    新型冠状病毒大流行在哲学上唤醒了“苦难”问题。这是一个长久被遗忘的问题，可是苦难一直存在。


    人的神话以及现代化的巨大成就促成了当代观念的傲慢。尽管激进思想家们一直在批判现代性，但仍然没有能力改变当代支配性的“知识型”（episteme）。当代社会倾向于以“好运”的概念替代“命运”的概念，为“失败”而焦虑，而不愿意面对古希腊所发现的“悲剧”。突出“积极性”而拒绝承认“消极性”的进步论导致了思想失衡。其实平衡或对称不仅是数学现象，而且是生存的存在论条件。当代思维发明了一种不平衡的逻辑，只专注于成功和幸福的故事，幻想福利可以无条件供给，权利可以无条件享有，自然可以无限被剥削，如此等等，这种幻想基于一个伦理学的理想化“应然”要求：成本或代价应该趋于无穷小而收益应该趋于无穷大。这种逻辑挑战了我们从亚里士多德、弗雷格和罗素那里学到的逻辑，也挑战了物理学，比如能量守恒定理或热力学第二定理。


    就广泛流行的当代哲学而言（以传媒、教育体系和大流量网络平台的接受倾向为参照），尽管各种哲学的目标话题各有不同，如以福柯的知识考古学方法加以观察，则可发现，众多流行哲学有着一个共通的“知识型”，即“幸福论”。最大限度地扩大每个人的幸福和福利，是幸福论的共同底色。幸福论倾向于主张每个人的主体性有着绝对“主权”，以便能够最大限度地扩大个人自由并将个人的私人偏好合法化，个人可以自主合法地定义自己的身份、性别、价值和生活方式，乃至在极端化的语境中，“个人的”有可能被等同于“私人的”并且等价于正确。自我检讨地说，我在1994年出版的《论可能生活》也是一种幸福论。'
  fmt: '

    # 全球化、危机与形而上反思


    然而，全球化在存在论上改变了世界的概念。在传统的世界概念里，任何实体之间的合作都没有达到可能利益的极限，在理论上总是存在更好的机会，而全球化把利益最大化的空间尺度推到了世界尺度，为利益最大化建立了极限标准，于是占有世界市场就成为利益最大化的最大尺度，因为不存在另一个世界。世界是博弈策略的存在论界限。在此可以看到存在论如何限制了逻辑：逻辑无穷大，在“逻辑时间”里存在着无穷多可能性，但那些无穷多的可能性并不真实存在，而一旦进入真实存在，可能性就受制于特定的存在状态，只剩下“多乎哉”的寥寥选项了。这意味着，想要无穷性，就只能不存在；想要存在，就只能屈服于有限性。200年来全球化的“存在论”后果是把全球化变成了谋求利益最大化的“占优策略”。由此来看，全球化的博弈会出现冲突或策略性的倒退，如前面所分析的可能性，由“分工的全球化”转向“竞争的全球化”，一旦竞争激化就可能造成无利可图的进退两难状况，因此，从中长时段来看，世界可能会谋求全球化的升级以谋取稳定的利益。目前的全球化是低水平的全球化，是在无政府状态的世界中进行的粗放运动，有动力、有能量，但是无秩序、无制度，就是说，低水平的全球化尚未具有稳定的全球性（globality）。按照古希腊人的说法，无秩序的混沌整体（chaos）尚未变成有秩序的整体世界（cosmos）。可以说，新型冠状病毒大流行未必是预告全球化终结的句号，或许是以一个感叹号提示了还存在一个全球性的建构问题。


    任何存在的改变都需要概念层次上的改变，否则只是表面化的变形。因此，形而下的严重问题就会引出形而上的问题。新型冠状病毒给人类的提醒是，如果要修正当代社会形而下系统的脆弱性，恐怕就需要修正其形而上的观念假设和思维方式。哲学并非纯粹观念，而是隐藏着的病毒。马库斯·加布里埃尔相信，在新型冠状病毒大流行过后，人类需要“一场形而上的大流行”。这是一个富有想象力的建议，我们的确需要一场像流行病一样有力量的形而上反思，让思想获得集体免疫，这需要找到一个突破性的“升维”条件，即发现或创造比现代思维空间高出一个维度的思想空间，才能够摆脱现代思维空间的限制。如果没有思想维度的突破，对现代思想的反思会因为受限于现有空间内部而奔波在解释学循环中，即使其解释角度越来越丰富深入，但因为只是内部循环，就不足以摆脱现代思想的向心力，也就不可能超越现状。


    加布里埃尔很正确地批评了现代的科学压倒了道德，可是他呼唤的人文道德仍然属于现代性内部的观念，比如平等和同情。这里有个难以摆脱的困境：如果现代科学压倒了道德，那么就证明了目前的道德观念明显弱于现代科学，也就没有能量定义生活、社会和规则。可以发现，真正需要被反思的对象正是“我们的”道德观念系统。我们更需要的是一种维特根斯坦式的“无情”反思，从伦理学的外部来反思伦理学，否则其结果无非是自我肯定，即事先肯定了我们希望肯定的价值观。


    现代的主流思维模式强调并且追求普遍必然性，它象征着完美性和力量。后现代思想虽然对此多有批判，但没有触动现代在存在论上的结构，只要一个问题超出了话语而落实到实践，就仍然只有现代方案而没有后现代方案。现代性如此根深蒂固，根本在于它塑造了最受欢迎的人的神话。人类试图掌握自己的命运，试图按照人的价值观来建立普遍必然性（普遍必然性的荣耀本来归于神或宇宙），这是现代人为自己创造的形而上神话。后现代在批判现代性时尤其批判了科学的神话，其实，现代神话不是科学，而是人的人文概念。人的神话假设了人的完美概念，抄袭了许多属于神的性质，包括人要成为自然的主人，人要成为按照自己的意志创立规则的主权者，每个人要成为自由的主权者，以至“人”的概念几乎变成了神的缩影。然而，人的神话缺乏存在论的基础，人并无能力以主体性定义普遍必然性，也无能力把“应然”必然地变成“实然”。现代人确实试图借助科学来为人的世界建立普遍必然性，但这是一个人文信念，而并非科学本身的意图。事实上，科学从来都承认偶然性和复杂性，始终在思考动态变量（从函数到微积分到相对论和量子力学），反而是人文信念在想象普遍价值、绝不改变的规范或神圣不可侵犯的权利。不能忽视的是，这不是一个知识论的信念，而是一个政治信念。莱布尼茨早就证明了，要具备定义普遍必然性或无条件性的能力，就需要能够“全览”逻辑上的所有可能世界，相当于无穷大的能力。人显然不具备这种能力。


    无论选取哪些价值观作为一个社会的基本原则，如果设定为“无条件的”或在任何情况下普遍有效，就会缺乏应变性和弹性，在实际情景中容易导致悖论。一成不变不是任何一种可能生活的特征。假如规则是死的，人就死了。如果允许给出一个“数学式的”描述，我愿意说，生活形式都具有“拓扑”性质，其好的本质可以维持不变，类似于拓扑的连续性，而其具体表现则如同拓扑的可塑性，根据具体情况和具体需要而被塑形。虽然黑格尔的命题“现实的就是合理的”容易被误解，但问题是，如果一个观念在现实中不可行，那只能说明这个观念是可疑的，而不能证明这个现实不应该存在。休谟认为，不可能从事实推论价值，这在大多数情况下是正确的。另一方面，似乎还可以说，从价值推论事实恐怕更加困难。


    哲学苦苦寻求的普遍必然性在生活世界里难有见证，它只存在于数学世界中。这是因为数学的世界是由数学系统定义并建构出来的，并非现实世界的镜像。数学系统中的存在物，或因定义而存在，或因“能行构造”而存在，所谓“存在就是被构造”（直觉主义数学的表述），所以数学中的存在物是数学系统的一个内部事实，因此能够依照逻辑而建立普遍必然性。与之对比，人文观念要解释的问题和事物都具有外在性，由不可控制的事物、实践和变化组成，人文观念只能在变化的世界中去寻找合适的落脚点。如同容易受到环境影响而易挥发、易溶解或易氧化的物质一样，用于解释生活的概念也缺乏稳定性。在平静无事的时段里，人文观念也平静无事，但在多事之秋，人文观念就会被问题化。


    大多数的人文观念都有自圆其说的道理，所以很少见到在辩论中被驳倒的人文观念或者“主义”（除非被禁止表达）。然而，人文观念却很容易被现实驳倒，所以概念最怕具体化或情境化，因为一旦具体化就会问题化，一旦问题化就会被现实解构，尤其是那些宏大概念，比如幸福、自由、平等、双赢、人民、共同体等。德里达用了很大力气去解构宏大概念、权威和中心，其实那些宏大概念在变化难测和自相矛盾的实践中从未完美地存在过。


    人类缺乏与大自然相匹配的无穷多维智力，尽管人类能够抽象地理解多维的世界，并且鄙视一维或线性的思维方式，但实践能力的局限性迫使人只能一维地做事，于是实践所要求的“排序”问题就难倒了人——尽管看起来只相当于小学一年级的算术难度。一方面，事情是复杂而动态的，所以生活需要多种并列重要而且不可互相还原的价值才得以解释；另一方面，实践迫使我们对价值做出排序，即优先选择。只要存在着排序难题，人们就很难在生活所需的多种事物或多种价值之间维持平衡，而失去平衡就等于每种事物或价值观都失去自身的稳定性，也失去互相支撑、互相作保的系统性，只要遇到严重危机，价值观和制度就陷入两难困境。这是秩序或制度从来没有能够解决的问题。这表明了，不仅人造的社会系统有着脆弱性，指挥着行为的思想或价值观系统同样有着脆弱性，这正是文明的深层危机。


    如果说，形而下的危机来自现实的“锐问题”，那么形而下的危机所触动的“深问题”就构成了形而上的危机。新冠肺炎疫情就是一个触动了“深问题”的“锐问题”。其中一个问题就是，现代所理解的政治概念本身就是一种隐藏的自杀性病毒，它在破坏政治的概念。无论政府还是媒体或者新型权力，如果一种政治势力有权力指定价值观，那就是专制。价值观只能是人在长期实践中自然形成的集体选择。显然，人有着众多的群体，因此有着多种集体选择，也就存在着分歧和冲突。有能力保护文明的政治不是斗争，而是在文明冲突的丰富性和复杂性之中建立平衡的结构性艺术。如果政治只是斗争，就无非重复和强化了现实中已经存在的冲突，在斗争之上再加斗争，不是多余的就是加倍有害的。斗争是本能，不是政治。政治是创造合作的艺术——假如政治不能创造合作，又有何用？


    因此，人类需要反思的形而上问题不是应该赞成和支持哪一种价值观——这只是形而下的斗争，而是作为人类共享资源的思想系统是否合理，是否足以应对生活遇到的可能性。换句话说，思想观念的有效性和合理性的基础是什么？什么事情人可以说了算？什么事情人说了不算？什么事情可以听从理想？什么事情必须尊重事实？在新冠肺炎疫情情境中，问题更为具体：什么事情必须听从科学？什么事情可以听人的？什么事情要听病毒的？


    ## 危机：生存之道和游戏规则


    理论之所以在自身的空间里可以自圆其说，而进入实际案例就有可能崩塌，是因为理论和现实是两个空间。理论空间的法则是逻辑，而现实空间的法则是规律，两者不可互相还原，所以现实不听从理论。尽管理论可以部分地“映射”现实（通常说“反映”现实，但这个镜像比喻不准确），然而建构方式完全不同。只有当现实处于稳定、平静、确定的状态时，理论对现实的映射才是部分确定的，而只要现实进入动荡的“测不准”状态，理论概念就互相冲撞、互相妨碍乃至失灵。理论不怕认真，只怕现实的危机。既然现实不会自己走近理论，那么理论就需要走近现实。


    如果说，当代性的一个主要特征是预支未来，那么当代性的另一个相关特征就是危机状态，事实上大量的危机正是预支未来所致。当代几乎所有系统都处于“紧绷神经”的状态，而危机形成了思想困境的临界条件。一个典型情况是，危机往往导致伦理学悖论，最常见的伦理学悖论就是优先拯救的困境（比如“有轨电车两难”）。新型冠状病毒大流行为优先救治难题提供了实例。医疗能力有着充分余量的国家，当然不存在这个困境，每个人都可以获得救治的机会。但在呼吸机不足的那些国家，优先救治就成为难题。现实条件排除了理想的选择，而延迟选择也是罪。在此，想象力受到了挑战。实际上的可能选项大概只有如下几种。


    第一，按照先来后到，这是平等标准。第二，按照轻重缓急，这是医疗标准。第三，按照支付能力，这是商业标准。第四，优先妇女儿童，这是一种伦理标准。第五，优先年轻人，无论男女，也是一种伦理标准。其中，除了第三项是可疑的，其他标准都有各自在理性上竞争的理由。如果考虑知识论的理由，那么第二项最有道理；如果考虑伦理学理由，那么第四项和第五项都更有道理。假设有的地方优先救治更有机会存活的年轻人（纯属假设），这个选择会受到质疑，可是这种选择已经是相对最优选择之一，与第二项并列相对最优。没有一种选择是严格最优的，都有某种缺陷。也许第二项的“负罪感”相对最低。尽管人们都希望一种能够拯救每个人的最优伦理，然而超出实践能力的最优理念只存在于图书馆。康德早就发现：“应该”不能超过“能够”。


    我们千万不能把这种分析误解为反对最优的伦理设想。关键是，最优的伦理设想未必是一个最优理论。一个最优理论必须具有覆盖所有可能世界的充分理论能力：一方面要把“最好可能世界”考虑在内，否则就没有理想的尺度去检查有缺陷的现实；另一方面要把“最差可能世界”考虑在内，否则就没有能力防止或应付严重危机。如果一种伦理学或政治哲学不考虑“最差可能世界”，而假设了优越的社会条件，就是一种缺乏足够适应度而经受不住危机的脆弱理论。新型冠状病毒大流行迫使许多地方实行的“隔离”就成为一个争论焦点。其实，比起战争、大洪水、大饥荒或社会暴乱，隔离状态算不上最差情况。


    “隔离”成为哲学争论焦点与阿甘本有关。阿甘本认为，以“无端的紧急状态”为借口的隔离是滥用权力，而滥用权力的诱惑很可能会导致通过剥夺人民的自由以证明政府权力的“例外状态”变成常态。这个论点提醒人们的是，权力在本性上倾向于专制，只是平时缺少机会和借口。这是个重要问题。但隔离的目的是否真的是政治性的，或是否没有比政治更紧要的考虑，这也是问题。人类生活的各种需求就其严重程度而有着存在论的顺序，生存通常位列第一。但阿甘本提问：“一个仅仅相信幸存，除此以外不再相信一切的社会又会怎样呢？”这是个更深入的问题。假如活命只不过是苟活，那可能不如去死。然而，这些问题似乎把新冠肺炎疫情的语境无节制地升级，从而导致了问题错位，为应对新冠肺炎疫情而采取的隔离是否达到了“不自由毋宁死”或“好死不如赖活”的极端抉择？阿甘本对因新冠肺炎疫情隔离的理解未免“人性，太人性了”（尼采语）。以反对隔离来捍卫自由，这暗示了其反面意见似乎就是支持滥用权力，但这是一个陷阱。与阿甘本真正相反的观点其实是，人只能承认生活有着无法回避的悖论。人类享有的自由、平等和物质生活是文明的成就，这些文明成就的立足基础是数万年的艰苦卓绝甚至残酷的经验，而这些文明成就并非一劳永逸地享有，要捍卫文明就仍然会经常有吃苦的经验。正如经济学永远不可能清除“成本”的概念，任何文明成就也永远不可能排除“代价”的概念。代价是一个存在论概念，是存在得以存在的条件。


    有一个需要澄清的相关问题是：这隔离不是那隔离。对传染病实行隔离法是一个古老经验。秦汉时期已有局部隔离法，被称为“疠所”，即麻风病隔离所。古罗马在查士丁尼大帝（527—565年在位）时期也发明了麻风病隔离法。现代的“检疫隔离”（quarantine）概念来自中世纪对黑死病的隔离，意思是40天隔离。检疫隔离有别于“社会隔离”（isolation）。社会隔离通常具有政治性和歧视性，比如历史上欧洲对犹太人的隔离或美国对黑人的隔离。混同检疫隔离和社会隔离会误导对问题性质的判断。为应对新冠肺炎疫情而实施的隔离显然属于检疫隔离，却不是社会隔离。虽然不能完全排除检疫隔离被权力利用从而变成社会隔离的可能性，但就其主要性质而言并非政治性的。假定阿甘本仍然坚持对检疫隔离的政治化理解，把它归入当权者乐于使用的“例外状态”，那么还可以追问一个侦探式的问题：谁是检疫隔离的受益者？不难看出，危急时刻检疫隔离的受益者是全民。既然受益者是全民，检疫隔离就很难归入政治性的例外状态，而应该属于社会性的应急状态。除了全民的安全，检疫隔离还有效地保护了医疗系统的能力。如果医疗系统因无法承载超大压力而崩溃，则全民的安全保障也随之崩溃，而如果社会秩序、医疗系统和经济一起崩溃，个人权利就只是无处兑现的废币，虽有票面价值，但失去了使用价值，个人权利就变成不受保护的赤裸权利，而赤裸权利肯定无力拯救阿甘本关心的“赤裸生命”，到那个时候恐怕就真的变成政治问题了。


    这个政治问题就是：到底是什么在保护个人权利？首先，宪法和法律是制度上的保证。进而，任何事情都必须落实为实践才真正生效，权利也必须落实为实践才真正兑现。实践涉及的变量太多，几乎涉及生活中的所有变量，已经超出了任何一个学科的分析能力，只能在一种超学科的概念里去理解。实践问题等价于维特根斯坦的游戏问题，因此可以借用维特根斯坦的游戏的一般分析模型。按照维特根斯坦的游戏概念，一个游戏需要共同承认才生效，同时，游戏参加者也就承认了游戏的规则，这一点已经默认了游戏的一个元规则，即任何一个游戏参加者都没有破坏规则的特权，或者说都不是拥有特权的“例外者”，比如说没有作弊耍赖或要求特殊对待的特权。游戏概念有助于说明，如果社会是一个游戏，那么个人权利并不是一种私人权利，也就是说，个人权利是游戏所确定的平等权利，并不是一种由私人意愿所定义的特权。于是，在游戏中只有合法的（相当于合乎规则的）个人行为，但没有合法的私人行为。按照自己的自由意志做出的私人行为只在私人时空里有效，如果私人行为入侵了游戏的公共时空或他人的私人时空，就不再合法了。其实这正是法律的基础。比如，一个人在自己房间里饮弹自尽，这是私人行为，但如果一个人在公共空间里引爆炸弹自尽而伤及他人，就不再是私人行为，而是破坏游戏规则的个人行为，即违法行为。同理可知，在检疫隔离的行为中，如果一个人把可能伤害他人的行为理解为私人说了算的自由权利，就是把人权错误地理解为个人特权。就像不存在一个人自己有效的私人语言（维特根斯坦定理），也不存在一种只属于自己的私人政治。政治和语言一样，都是公共有效的系统。如果把个人权利定义为绝对和无条件有效的，就有着私人化的隐患，不仅在理论上会陷入自相矛盾，在现实中也必定会因遇到同样绝对无条件的他人权利而陷入自相矛盾。


    但是，当代的一个思想景观是，观念已经不怕逻辑矛盾，也不怕科学，转而凭借政治性而获得权力。福柯的知识考古学发现，这种现象早就发生了，知识和权力的互动关系产生了“知识—权力”结构，其结果是，在社会知识领域，知识的立足根据不再是知识本身的理由，而变成了政治理由。这可以解释观念是如何变成意识形态的。当观念试图以政治身份支配现实时，就变成了意识形态，或支配性的“话语”。意识形态正是当代“后真相时代”的一个基础，其另一个基础是全民发言的技术平台。在社会视域里，理论、理性分析和对话被边缘化甚至消失，几乎只剩下政治挂帅的大批判。并非真相消失了，而是“眼睛”和“耳朵”没有能力走出后真相话语。后真相话语形成的意识壁垒又反过来加强了意识形态。在后真相时代，并非所有话语都是意识形态，而是每一种能够流行的话语都是意识形态。意识形态化是话语的在场条件，否则在话语平台上没有在场的机会。后真相话语的叙事助力有可能把突发的暂时性危机变成长期危机。病毒只是自然危机，而关于病毒的叙事却可能成为次生灾害。


    ## 苦难的本源性


    新型冠状病毒大流行在哲学上唤醒了“苦难”问题。这是一个长久被遗忘的问题，可是苦难一直存在。


    人的神话以及现代化的巨大成就促成了当代观念的傲慢。尽管激进思想家们一直在批判现代性，但仍然没有能力改变当代支配性的“知识型”（episteme）。当代社会倾向于以“好运”的概念替代“命运”的概念，为“失败”而焦虑，而不愿意面对古希腊所发现的“悲剧”。突出“积极性”而拒绝承认“消极性”的进步论导致了思想失衡。其实平衡或对称不仅是数学现象，而且是生存的存在论条件。当代思维发明了一种不平衡的逻辑，只专注于成功和幸福的故事，幻想福利可以无条件供给，权利可以无条件享有，自然可以无限被剥削，如此等等，这种幻想基于一个伦理学的理想化“应然”要求：成本或代价应该趋于无穷小而收益应该趋于无穷大。这种逻辑挑战了我们从亚里士多德、弗雷格和罗素那里学到的逻辑，也挑战了物理学，比如能量守恒定理或热力学第二定理。


    就广泛流行的当代哲学而言（以传媒、教育体系和大流量网络平台的接受倾向为参照），尽管各种哲学的目标话题各有不同，如以福柯的知识考古学方法加以观察，则可发现，众多流行哲学有着一个共通的“知识型”，即“幸福论”。最大限度地扩大每个人的幸福和福利，是幸福论的共同底色。幸福论倾向于主张每个人的主体性有着绝对“主权”，以便能够最大限度地扩大个人自由并将个人的私人偏好合法化，个人可以自主合法地定义自己的身份、性别、价值和生活方式，乃至在极端化的语境中，“个人的”有可能被等同于“私人的”并且等价于正确。自我检讨地说，我在1994年出版的《论可能生活》也是一种幸福论。

