    _forward\\_6323478.他写道：“目前中国疾控的直报系统非常强大，……比世界上大多数国家都厉害。但这个系统经受不起大量垃圾信息的摧毁。比如说，每年各地都报了大量的病毒性肺炎，一个冬季，每个城市至少数万例吧，你说这个系统还过来帮你一一鉴别，最后告诉你是流感、疱疹病毒、呼吸道合胞病毒、腺病毒……，这是不现实的。”\n\
