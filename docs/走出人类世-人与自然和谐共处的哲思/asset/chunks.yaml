    # 07


    “冠状病毒经”：佛教反思大流行病中另有合理的人类生活之道


    贾森·沃思


    ![](images/00018.jpeg) ![p184](images/00002.jpeg)


    > 美国另有人生道，

    >

    > 不富不醉不吸毒。[![](images/00007.png)](#part0009.html#note90n)


    沃伦曾在京都的街头和寺庙里冥思，在这样一个毁于帝国冲突，又盛行禅文化和灵性精进的都市里，他也曾烦恼重重——为尼克松治下的美国，为生态和灵性的双重退化，为越南战争。在一个为富人所有并为富人服务的强取豪夺的国家里，一个选择就是加入富人的行列，尽管这个选择几乎不可能成功，尽管这种解决问题的尝试不过是为虎作伥。还有一种可能就是“出离”，用毒品和酒精来淹灭自己的思维（这是许多人的选择）。难道就没有一条“中道”吗？“另有”这个词直指人类烦恼的核心。沃伦对于“另有”的灵性渴求，不仅仍然符合人们当下的需求，其广度已显现为全球性的。在大流行病及其显示的隐含性现实中，我们人类的追问可以用这么一句话来表述：在我们的全球世界里，或许另有某种合理的人类生活之道吧……


    对于沃伦来说，这个“另有”就是他的人生切实地为我们的人生所立的公案。


    就此而言，人必须对全球局势予以咀嚼和反刍。或者换个比喻，那就是：人要把握机缘，把这全球新型冠状病毒的大流行当成一本经书来研读。正如日本镰仓的永平道元大师在他的札记《看经》（Kankin）里说的：“经是从整我来的经。这样说是因为你的我即是诸佛祖的我，亦是诸经的我。”不过，道元警告我们说：“然而遇经却不容易。”[![](images/00007.png)](#part0009.html#note91n)


    在下面的佛教禅思里，我将尝试“遇经”，我在此把这部经称作“冠状病毒经”。作为一部经，“冠状病毒经”也是“整我之经”，这部经揭示了我们的真相，那就是我们不是互不相干的个体，而是所有人类的我，不，一切有情众生的我。本文旨在遇见、直面“另有”的合理的人类生活之道。


    ## 第一问，我怎样才能幸福？


    新型冠状病毒大流行已颠覆了这个世界，消除了“这世界基本还算正常”的假象。现在，我们更容易看见在“正常”生活中为我们所忽视的种种不平等现象，或者说，我们至少更难做到对其视而不见了。席卷美国、扩展至全世界的“黑人的命也是命”运动要求系统性的改变，因为人们从中认识到了这些不平等现象从本质上讲是系统性的。大流行病的祸根失衡地落在了由于历史原因而被边缘化的人群身上，虽然我们可能假装“所有人同舟共济”，但这并不诚恳。是的，新型冠状病毒并不区分富人与穷人、强权者和弱势者，但显而易见的是，有的人能够承受将自己接触病毒的概率降到最低所要付出的代价，而有的人则不能。以美国为例，没有身份的农业工人就陷于奇异的双重困境中：一方面，他们没有身份，因此有可能被突然强制驱逐出境；另一方面，由于美国的食品供应链大多都依赖这些薪酬微薄的工人，他们又被列为必要、必须坚持工作的人群。

    '
  trans: '

    It is worth noting that when a person encounters unavoidable circumstances, they
    are capable of responding with methods and strategies. The True Person (Zhenren)
    does not stagnate in circumstances but adapts to them and responds flexibly to
    change. This is the virtue of the True Person.


    Precisely for this reason, later Daoist practitioners upheld the creed "My life
    is up to me, not up to Heaven." It is precisely this Daoist resilience that gives
    people the psychological and spiritual strength to cope with hardships. This resilience
    is a reservoir of spiritual energy; when people encounter difficulties, they can
    draw strength from it, thereby supporting them through crises, preventing them
    from losing their way or collapsing.


    However, this is not merely a psychological and spiritual strength; more importantly,
    it must be put into action in the daily trivialities of life day after day. For
    Zhuangzi, in "unavoidable" circumstances, a person can still follow natural laws;
    this is precisely "entrusting the unavoidable to nurture the center (yang zhong)."
    ![](img/#part0008.html#note85n)


    The concept of "nurturing the center" has various implementation methods: nurturing
    the heart-mind (yang xin), nurturing qi (yang qi), and nurturing the governing
    vessel (yang du). ![](img/#part0008.html#note86n) These are all protective measures
    taken to struggle against the inescapable circumstances of life, expressing the
    multifaceted characteristics of resilience.


    The character "Yang" (nurture/cultivate) is a key Daoist concept, occupying a
    special position in Chinese thought. Philosophical works, self-cultivation manuals,
    medical classics, metaphysical writings, and Daoist scriptures all value this
    concept and the related practices. It emphasizes the principles of nurturing life,
    nurturing form, nurturing nature, nurturing the body, nurturing the will, nurturing
    the heart-mind, and nurturing the spirit. Yang emphasizes the process of nurturing;
    it also includes diverse health regimens. It views health as a quantifiable goal
    that can be stored in the body, a gradual goal rather than a conceptual one. It
    encompasses a daily lifestyle regulated by psycho-spiritual-emotional hygiene
    standards.


    The first aspect of nurturing the center is nurturing the heart-mind, which enables
    the heart-mind to achieve stillness, peace, stability, correctness, governance,
    and concentration (jing, an, ding, zheng, zhi, tuan). This spiritual realm is
    realized through "sitting in oblivion" (zuowang) and "fasting of the heart-mind"
    (xinzhai). ![](img/#part0008.html#note87n) In Chapter Two, the *Zhuangzi* describes
    sitting in oblivion and fasting of the heart-mind in detail; both can achieve
    the inhibition of habitual tendencies, i.e., what psychology today calls emotional
    management. From the perspective of neuropsychiatry, this is the core of sitting
    in oblivion. In other words, this practice is not about dissolving consciousness,
    but about reconstructing consciousness and improving the overall psychological
    state.


    One form of sitting in oblivion allows the inner consciousness to open a tranquil
    space for free meditation, ultimately experiencing healing, purification, and
    spiritual transcendence. The breathing techniques it teaches, through concentrated
    intention, allow entry into the most subtle level of human consciousness. This
    exercise aims to eliminate all sensory awareness and conscious evaluation, focusing
    on the primacy of the present moment in attitude and lifestyle. This is an internal
    focusing of attention achievable only in a certain state of consciousness, in
    which self-centered worries and criticisms are temporarily set aside, achieving
    liberation, and perceiving a deeper, more subtle flow of consciousness. By guiding
    consciousness to let the brain rest, thoughts attain silence, and mindful perception
    is cultivated: thereby achieving inner peace, clarity of consciousness, and trust
    in oneself and the world.


    The second aspect of nurturing the center is nurturing qi. Zhuangzi mentions an
    important term for regulating qi: *tuna* (exhaling and inhaling), or more precisely,
    *tu gu na xin* (expelling the old, taking in the new). Regarding the flow of vital
    energy—namely, the guidance and purification of qi in the human body—this separates
    body and mind from "turbid movement" and enters the realm of "clear stillness."
    ![](img/#part0008.html#note88n) Thus, a person achieves unity with nature, embodying
    the Dao by letting the body obtain the qi that fills the universe. The *Zhuangzi*
    tells the story of the qi master Huluzi: he merged his qi with the rhythm of the
    earth, then merged with the rhythm of heaven, and finally returned to the Dao,
    achieving complete liberation. Another chapter of the *Zhuangzi* says: "Blowing
    and breathing, expelling the old and taking in the new, bear hanging and bird
    stretching—this is merely for longevity. This is what the practitioners of guiding
    and pulling (daoyin), those who nurture the form, and those like Pengzu who enjoyed
    longevity, favor."


    Such practices of nurturing qi dissolve the lingering mind-body dualism, liberating
    the body—the living incarnation of our flesh and blood—allowing it to choose,
    think, and possess its own wisdom.


    The third aspect of nurturing the center is nurturing the governing vessel (du).
    In the chapter "The Master of Nurturing Life" (*Zhuangzi: Yangsheng Zhu*), Zhuangzi
    mentions the *du*, stating that humans extend their lives through "preserving
    the body," "keeping life whole," "nurturing parents," and "exhausting the natural
    years." What Zhuangzi pursues is, through the practice of prolonging life, transforming
    the fleeting appearance of clarity and stillness into a persistent daily lifestyle.
    This involves experiencing the world from our all-dimensional existence, not merely
    from the level of consciousness; letting the body be nourished by reality, rather
    than remaining only in conceptual understanding and debate.


    Typically, early Daoist scriptures all discuss this transformation of the body,
    and the body''s energy is expressed rhetorically through terms like "longevity"
    (shou) or "immortality" (changsheng). These terms refer to the ability to transform
    the body so that it can endure change and the vicissitudes of time without dissipating
    bodily energy. This expression reveals that longevity was never an isolated, life-preserving
    goal disregarding everything else. On the contrary, longevity lies in daily life
    practice, even a way of life. Only a body full of vitality can embody the Dao,
    and a vibrant body gives people far more than mere longevity. This cycle of nurturing
    the body and rejuvenation is detailed in the *Huangdi Neijing* (Yellow Emperor''s
    Inner Canon). When asked why people die young, Qibo replied that only those who
    know the "Dao" can enjoy a long life of a hundred years, because they "model themselves
    on Yin and Yang, harmonize with the arts of calculation, eat and drink with moderation,
    have regular routines, do not exert themselves recklessly, so that form and spirit
    are preserved together."


    The most common methods for dealing with daily affairs and making routine decisions
    involve following the calendar and adhering to behavioral norms and guidelines.
    These requirements clearly demonstrate the value of simple daily rhythms like
    proper diet and sufficient sleep, while other calendars regulate people''s life
    procedures by conforming to the natural order. These methods also involve the
    interaction and interdependence between the order of the four seasons in nature
    and the rhythms of human life, serving to help people decide how to choose in
    the day-to-day flow of years. However, calendars do not account for unpredictable
    sudden (non-cyclical, non-regular) changes, nor do they explain the causes of
    fate''s turns such as sudden death, illness, misfortune, and disaster. Zhuangzi''s
    program of nurturing the center, however, is designed to cope with change, fate,
    and those unpredictable events, to seize emerging opportunities, and to make the
    best choices.


    ## Conclusion


    In these days when the world is changing in an instant, although many things remain
    ambiguous, one thing is clear: the COVID-19 pandemic is a "Great Accelerator,"
    suddenly pushing us out of old inertia into a new era. A common definition of
    the Uncertainty Principle is: "The Uncertainty Principle (regarding position and
    momentum) holds that the values of a physical system''s position and momentum
    cannot be determined simultaneously. On the contrary, these quantities can only
    be ascertained with a certain typical ''uncertainty,'' and these ''uncertainties''
    cannot be made arbitrarily small simultaneously." ![](img/#part0008.html#note89n)
    This article regards this moment of change as a sudden opportunity for enlightenment
    (wu dao) that should be seized. The pandemic has brought the world into a moment
    of the Dao, in which we can learn the Dao, appreciate the Dao, and practice the
    Dao. This article proposes three foundations for creating a new trajectory, to
    illustrate the effectiveness and feasibility of the Zhuangzian Dao in responding
    to the affairs of an impermanent world.


    We all hope that global scientists and world political leaders can unite to find
    the most effective methods and paths to deal with this global pandemic. Meanwhile,
    we cannot just sit and wait. We should face the world''s challenges with a degree
    of self-vigilance, which is what Zhuangzi calls "being cautious in solitude" (shen
    qi du). The pandemic forces us, in the process of figuring out how to get by,
    to struggle with simplified matters of survival: cooking for ourselves, cleaning
    our own rooms, cutting our own hair. This is the simplicity of life! This pause
    is constructive; it allows us to take this opportunity to clearly and lucidly
    reflect on what are the most plain and simple things in our lives and existence.
    More importantly, it summons us to live a simple, joyful life. May our character
    be as tough as a football: kicked and rolling all day, yet still full and round
    by night. This is the "Pivot of the Dao" (Dao Shu) spoken of by Zhuangzi.


    Zhuangzi''s epistemological stance is to see the unitary truth through dualities,
    to see the subtle through appearances, to see the unity (he) through the multiplicity
    (duo), accomplished by "approaching substance through emptiness" (yue xu jiu shi).
    For example, if someone believes wearing lipstick makes her more confident in
    public, then wearing a face mask in public gives her the opportunity to find confidence
    from other channels. What Zhuangzi cultivates is precisely this ability: to transform
    obvious misfortunes into fertile soil for planting the fruit of a new life.


    In Daoist teachings, mere understanding, or merely possessing a proper perspective,
    is still incomplete, or insufficient. One must achieve "nurturing the body" and
    "nurturing the heart-mind"; the direction of this nurturing is to follow a method
    of self-cultivation, because this is a life of practicing the Dao. Zhuangzi has
    a perfect expression for this: "Knowing why it is so, but not knowing that it
    is so." This gradual approach toward knowing is reflected throughout Daoist theory
    and practice.


    The scope of the COVID-19 pandemic crisis is so vast that it affects everyone
    on Earth; this will inevitably bring changes to people''s lives. People all over
    the world must weigh between past and future, choose among contending interests
    and concepts. Let us conclude this article with Zhuangzi''s advice: "Let your
    mind wander in simplicity, blend your qi with the vastness, follow things naturally,
    without any selfishness—then the world will be well-governed." (*Zhuangzi: Ying
    Di Wang, Chapter Seven*) This guides the unforeseeable and unavoidable "unavoidable"
    to become the conditions for the emergence of new world possibilities, the conditions
    for the emergence of new dimensions of existence. Reality—the reality of the existence
    of all things and the reality of how all things evolve—determines how we respond;
    adapting flexibly and making use of it always surpasses being limited by it and
    mired in it. Sima Chengzhen in his *Essay on Sitting in Oblivion* (Zuowang Lun)
    says: "Therefore, that which has no use for life must be discarded; that which
    has surplus use for life must also be abandoned. ... How much more so for those
    who turn their backs on the Dao and virtue, neglect their nature and destiny,
    and pursue the non-essential, thereby cutting themselves down?"


    (Translated by Pan Zijing)


