    # "Shengsheng" Thought and Symbiotic Philosophy: Modern Echoes of Traditional
    Chinese Wisdom


    "Shengsheng" (生生, continuous generation/life begetting life) thought has profoundly
    influenced the Chinese view of life. This finds its most powerful expression in
    Confucianism. Confucianism does not emphasize the independent existence of the
    individual. Rather, the individual is seen as a continuation of the life and bloodline
    originating from ancestors. People have an obligation to perpetuate the bloodline,
    passing it down from generation to generation. In other words, an individual''s
    life is but a link in an interconnected chain of lives, and the spirit of *shengsheng*
    manifests precisely in this continuous succession of vital force and generational
    inheritance. This concept also rationalizes the Chinese traditions and social
    practices we are familiar with, such as ancestor worship, filial piety, and the
    anxiety and high expectations parents hold regarding their children''s education
    and career development. The renowned modern thinker Liang Shuming pointed out
    that Confucius uttered many praises of "sheng" (life/generation), such as "The
    great virtue of heaven and earth is called *sheng*," "What does heaven say? The
    four seasons pursue their courses, and all things are continually being produced;
    what does heaven say?", and "Only he who is absolutely sincere can fully develop
    his nature... can form a triad with heaven and earth." He believed that understanding
    "sheng" allows one to grasp the entirety of the Confucian doctrine.[⁵³]


    The core doctrines of Confucianism are rooted in interpersonal relationships;
    it extols the power of generation, affirming life and daily existence. The influence
    of "sheng" is ubiquitous. The outstanding contemporary Chinese philosopher Li
    Zehou termed this life-affirming cultural attitude a "culture of joyous feeling"
    (legans wenhua), whose focus lies in the family relationships of this world (this
    shore), emphasizing human initiative and endowing humans with the ontological
    status of creativity capable of influencing surrounding nature.[⁵⁴] This attitude
    towards life has influenced the Chinese to cultivate a mentality of continuous
    self-renewal, optimism, and positivity. When comparing the similarities and differences
    between Chinese and Western philosophy, Zhao Lingling, a master of Sinology who
    has engaged in comparative analysis of Chinese and Western philosophy for many
    years, pointed out that the starting point and main theme of Chinese philosophy
    is "seeking life" (qiusheng)—how humans preserve life, live well, and achieve
    longevity—forming a stark contrast with Western philosophy''s "seeking knowledge"
    (qiuzhi) originating from curiosity; consequently, different value systems and
    attitudes towards life were derived.


    Although Confucianism and the Chinese generally emphasize an attitude towards
    life that values survival, life, and the continuation of life, this does not mean
    turning a blind eye to death. People often say "xiang si er sheng" (向死而生, living
    towards death / facing death to live). This reflects an attitude that, compared
    to indulging in discussions about the inevitable event (death), it more actively
    encourages people to proactively face the manageable present life, to learn, self-cultivate,
    and strive unceasingly, achieving "looking up without shame before heaven, looking
    down without remorse before men." This attitude prompts people to actively engage
    in and appreciate secular life.[⁵⁵] Death should not render life empty and devoid
    of splendor. On the contrary, precisely because death is inevitable, life becomes
    more abundant and richer. Perhaps the public does not know that "xiang si er sheng"
    is also an important philosophical concept of the German philosopher Martin Heidegger
    (1889–1976). However, the Chinese understanding of "xiang si er sheng," while
    also emphasizing the importance of humans choosing a meaningful or fulfilling
    life, does not contain the existentialist connotations of "loneliness," "anxiety,"
    or "rupture" found in Heidegger''s philosophy.[⁵⁶]


    Compared to Confucianism''s rare discussion of death and its attitude of "not
    knowing life, how can one know death?", the Daoist view of life and death is vastly
    different. Daoist thought is rooted in a cosmology where the Dao gives birth to
    all things and nature is supreme, believing that life and death are the natural
    laws of the Dao. Therefore, human existence or survival relies on humans taking
    nature as their model, upholding restraint, compliance, and softness, rather than
    relying on aggression, tyranny, and stubborn inflexibility. The former leads to
    survival, continuity, and prosperity; the latter leads to rupture, premature death,
    and destruction. Zhuangzi, even more so, discusses life and death with a transcendent,
    challenging, and even humorous attitude. He believed that when *qi* (vital energy)
    coalesces, there is life; when it disperses, there is death. Life and death follow
    each other in succession; they are one. Death is merely the transformation of
    the human life form into another life form; it is natural creation—what is there
    to worry about? From another perspective, death is like the changing of the four
    seasons, a manifestation of the natural ebb and flow. Thus, when Zhuangzi''s wife
    died, he "sat with legs spread out, beating a basin and singing," sighing at how
    life forms operate like the changing seasons and the constant flux of nature.


    On the one hand, Daoist philosophers represented by Zhuangzi hold a transcendent
    attitude towards the life and death of humans and all things in nature. On the
    other hand, Daoism—a religion inspired by Daoist philosophy and combined with
    folk customs and beliefs—is a religion that values and reveres life. Through the
    cultivation of inner alchemy (neidan) and outer alchemy (waidan), it developed
    a powerful tradition of maintaining the physical body and seeking immortality.
    This also aligns with the masses'' desire for vibrant life and the spirit of "sheng."
    The core principle of Daoism is "sheng" (life); the unity of the Dao and life,
    i.e., the oneness of life and the Dao. Living out one''s allotted lifespan without
    premature death, and even achieving immortality, are the goals pursued by Daoism.
    Therefore, Daoism developed a dazzling array of cultivation methods, including
    soul-summoning techniques and divination, aimed at promoting personal health,
    longevity, and even eternal life. Outer alchemy has had a mixed reputation historically,
    because many people not only failed to prolong their lives but lost their lives
    due to various mineral and metal drugs. Inner alchemy, with its unique meditation
    and health-preserving longevity methods (such as Kung Fu, quiet sitting, and Tai
    Chi), remains extremely popular in Chinese culture to this day. The culture of
    "sheng" is an important component of the Chinese spirit and popular beliefs. Discussing
    and practicing "yangsheng" (nourishing life) has also become a national pastime
    that the Chinese enjoy endlessly.


    In summary, "shengsheng" is a pillar concept of Chinese philosophy, deeply rooted
    in the Chinese philosophical system, permeating the Chinese view of life, modes
    of thinking, and the overall value system. On the one hand, Chinese culture retains
    a powerful gene for seeking survival, the joy of worldly life, and the pursuit
    of longevity and the continuation of life; on the other hand, influenced by Daoism,
    the Chinese are able to view the inevitable fact of human death with equanimity
    as a natural phenomenon of transformation into other life forms. This concept
    of seeking life on the one hand, and believing in the cycle of life and death
    on the other, has forged the Chinese people''s strong spirit of survival, resilience,
    and optimism in the face of adversity.


    ## New Enlightenment from Biological Symbiosis Theory for Humanity


    The philosopher and anthropologist Toby Kiers (transliterated as 托比·李思 based on
    context, likely referring to a specific scholar cited in the source text, possibly
    Toby Kiers or similar name; here translated phonetically as Toby Le Si) drew inspiration
    from the impact of the COVID-19 pandemic on humanity, advocating for the repositioning
    of humans by placing them back into nature. He argues that we do not live in the
    Anthropocene, but have actually always lived in the "Microbiocene": the COVID-19
    pandemic reminds us that from the virus''s perspective, we are no different from
    other hosts. Kiers believes the COVID-19 pandemic is a large-scale "indiscriminate
    event" that challenges the "ontology of modernity."[⁵⁷] The premise of the "ontology
    of modernity" is that humans, as the only beings in nature with rational thinking
    capacity, possess a supreme status. At this moment, we humans should rethink ourselves
    from the perspective of the non-human world, from the perspective of humans as
    part of nature, and strive to form a concept of "us" that is "Earth-centered rather
    than race- or species-centered."[⁵⁸]


    The practice of humans drawing inspiration from assumptions about nature and natural
    laws to formulate social policies has a long history. One cannot help but mention
    a shameful page in modern history: Darwin''s theory of natural selection was utilized
    to provide a "reasonable" and "scientific" basis for racism, eugenics, and colonialism
    in modern history. Although social Darwinism became infamous after WWII, the competitive
    ideas of "survival of the fittest" and "zero-sum game" remain mainstream views
    in today''s global politics. However, the COVID-19 pandemic reminds us of an obvious
    fact: viruses treat different races, ethnicities, beliefs, ideologies, and nation-states
    indiscriminately; different human groups are interdependent, and we need to watch
    over and help each other in discovering, containing, and resolving global crises.


    In fact, for millions of years, humans and viruses have existed in a relationship
    of interdependence. On the one hand, viruses need us as hosts to survive, replicate,
    and spread. On the other hand, viruses have played a driving role in human evolutionary
    history; they will forever accompany the continuation, survival, and advancement
    of the human species. Unfortunately, although we have become effective viral hosts
    due to our love of gregariousness, socializing, and global travel, we are obviously
    not their only hosts; humans depend on nature far more than nature depends on
    us. The only unique feature of humans may be our innate, exquisite cognitive abilities.
    We can reflect on our weaknesses, learn lessons from experience and nature, and
    make predictions and adjustments for our future survival and prosperity.


    So, how should we change our thinking? Instead of drawing lessons from Darwin''s
    theory of evolution, perhaps we should seek inspiration from the ubiquitous phenomenon
    of symbiosis in the biological world. In 1879, inspired by Greek, the German microbiologist
    and mycologist Heinrich Anton de Bary coined the term "symbiosis" (共生) to describe
    the biological phenomenon of "two or more different organisms living together
    in relationships of mutualism, parasitism, and commensalism."[⁵⁹] In the early
    20th century, while Western Europe was still immersed in Darwin''s theory of evolution,
    Russian biologists further developed the concept of symbiosis and proposed the
    symbiogenesis theory: the combination of two or more organisms in a symbiotic
    relationship may give rise to new organisms.[⁶⁰] The scientific mainstream long
    viewed symbiosis with a skeptical eye. However, over the past few decades, biologists
    have found increasing evidence proving the universal existence of symbiotic coexistence
    phenomena involving mutual exchange of nutrients and energy among different organisms.
    One of the strongest supporters of the theory of symbiogenesis is Lynn Margulis.
    Her research shows that "from the symbiotic relationship between prokaryotes and
    prokaryotes, eukaryotes emerged. From the symbiotic relationship between prokaryotes
    and eukaryotes, more competitive eukaryotes were produced. In the symbiotic relationship
    between eukaryotes and eukaryotes, multicellular life emerged."[⁶¹] In recent
    years, the research of botanist Suzanne Simard on forests and trees has also overturned
    the forest ecology hypothesis based on individual competition for survival. Her
    research indicates that fungi in the forest connect all plant species, and carbon,
    water, nutrients, plant warning signals, and hormones are transmitted through
    this ubiquitous underground fungal network. Simard believes that a mature forest
    is an ancient, vast, and sophisticated society, not a cold, aloof ecosystem surviving
    by scrambling for resources. In this society, there are conflicts, but more interdependence,
    trade-offs, and connections, communication, and even "altruistic" behaviors.[⁶²]


    In summary, so far, most scientists believe that symbiosis is a universal phenomenon
    in nature, and some even believe that symbiosis has played a crucial role in the
    evolutionary innovation of new species. Darwin''s theory of evolution emphasizes
    struggle, opposition, zero-sum competition, and survival of the fittest, while
    the core of the symbiosis hypothesis is mutual dependence, interconnection, trade-offs,
    coexistence, and coevolution. Margulis speculated in her 1998 book, "I suspect
    that in the not-too-distant future, humans as a species will need to reposition
    themselves, achieving integration with the partners in the Earth''s microcosm
    who preceded us in existence."[⁶³] Indeed, in fact, we are not only increasingly
    recognizing this integration; in recent decades, symbiosis theory has also provided
    theoretical support and cognitive inspiration for human health, ecology, and environmental
    protection movements.


    The laws of coexistence, mutual embedding, mutual dependence, competition, and
    integration revealed by biological symbiosis and symbiogenesis theory have also
    evoked resonance and echoes in Eastern societies. These resonances and echoes
    have awakened people''s re-understanding of philosophical thoughts spanning thousands
    of years, proposing symbiotic thoughts widely applicable to human social and political
    life.


    ## "Symbiosis" Thought, "Shengsheng" View, and Oneness Theory


    When "symbiosis" (共生) began to be widely used in China''s social and political
    life is untraceable. But in contemporary China, the term "symbiosis" is known
    to everyone, even becoming somewhat cliché. Whether discussing international politics,
    ecological civilization, business competition trends, or even office politics,
    "symbiosis" is often on people''s lips. In China, since 2000, some schools have
    even introduced symbiotic thought into general education and social curricula.[⁶⁴]
    International relations scholars are also attempting to develop a symbiotic international
    system theory, emphasizing that countries should understand each other, exercise
    restraint, actively participate in international affairs, engage in mutual benefit
    and reciprocity, learn from each other, and pursue common prosperity.[⁶⁵]


    In Japan, symbiosis (*tomo-iki*) is also a frequently used word and concept. In
    the context of East Asian culture, symbiosis seems to have long been a concern
    of ordinary people. Although it is in daily use, we may not necessarily know the
    source of this concept in traditional thought. I believe that the symbiotic thought
    in East Asian culture originates from the "shengsheng" wisdom and the theory of
    oneness (一体论) in traditional philosophy. First, as mentioned earlier, "shengsheng"
    implies birth, regeneration, sustainable development, and change. This worldview
    obviously has a wonderful fit and resonance with the phenomenon of symbiotic coexistence
    among different organisms. The philosopher Fang Dongmei expounded the principle
    of life (sheng) as: "Life embraces all categories, connects the Great Dao, transforms
    and tailors, begins at the origin and ends at the terminus, cultivates benevolence
    and preserves love, continues goodness to complete nature; it has no fixed form
    or body, is both hard and soft, responds to the times and manifests utility, is
    both dynamic and static." He further pointed out that the cosmic vitality represented
    by "sheng" contains five meanings: "the meaning of nurturing species and completing
    nature, the meaning of opening things and completing affairs, the meaning of creative
    progress without cease, the meaning of change and penetration of subtlety, and
    the meaning of continuous long-lasting existence." The *Book of Changes* calls
    this "shengsheng." It is a cosmic vital force universally present in all things,
    inherent in humans, animals, plants, and all things.[⁶⁶]


    Savoring the vitality of life in daily life, empathizing with nature, holds a
    strong aesthetic and poetic charm for Chinese literati. The Song Dynasty Neo-Confucian
    Zhou Dunyi has a widely circulated story. A friend asked him why he didn''t remove
    the grass in front of his window. Zhou Dunyi replied: "It is the same as my own
    intention," and also "to observe the vitality of heaven and earth''s creation."
    Zhou Dunyi realized that both humans and the grass are created and transformed
    by heaven and earth, appreciating the tenacious, vigorous vitality embodied in
    this humble life form, immersing himself in the joy of life displayed by the oneness
    of all things and great nature. Such aesthetic and poetic feelings towards other
    life forms and the pursuit of oneness with nature are ubiquitous in Chinese literati
    painting and poetry. Even today, amidst tension and busyness, in the effort to
    find moments of inner peace and self-reflection, this unique literati sentiment
    is still cherished by the Chinese. These concepts of viewing nature as organic
    life and believing that nature and humans are one naturally provide cognitive
    inspiration for reflecting on the relationship between humans and nature and ecological
    ethics today.


    For Chinese thinkers, the universe is not merely natural phenomena or a material
    environment. It also contains moral enlightenment, inspiring humans to contemplate
    appropriate social norms and governance frameworks, and evoking profound aesthetic
    resonance in human emotions. Since the vital force governing all life forms including
    humans is the pursuit of survival, continuation, and prosperity, the human social
    value system should be fundamentally rooted in the "shengsheng" view. From this
    concept, it inevitably follows that all human lives, non-human lives, and even
    non-living things should be accorded due reverence, respect, and care.


    The "shengsheng" concept emphasizes co-creation and coexistence, but this does
    not mean there are no differences, competition, or tensions between different
    life forms. Like the ecological world, evolution is a "complementary process of
    divergence and integration."[⁶⁷] Symbiosis is essentially the fusion and mutual
    embedding of different organisms. This is a process with creative tension, involving
    competition, mutual dependence, and adaptation. The end game of symbiosis is not
    the annihilation of the "other" by the "self," but a process of continuous blending,
    mutual embedding, adaptation, change, and fusion, moving towards the diversification
    and co-creation of new species.


    The concept of "shengsheng" aptly describes this vibrant vitality and creative
    tension. The first "sheng" refers to living, surviving, continuing to live. The
    second "sheng" refers to giving and bestowing life. This is why some philosophers
    translate "shengsheng" into the English "Live and let live." [⁶⁸] If other life
    forms can symbiosis, survive, and continue based merely on instinct, then we humans,
    possessing complex cognitive abilities, should be able to consciously reflect
    on and apply these concepts, transforming the creative tension of symbiosis into
    good social and political relations, thereby achieving mutual respect, self-restraint,
    perspective-taking, and acceptance of differences. Clearly, the "shengsheng" view
    complements modern symbiotic thought.


    The second source of contemporary East Asian symbiotic thought is the "oneness"
    (一体) theory running through Eastern philosophy. Daoist philosophy holds that all
    things in the universe are derived from and governed by the "Dao." As Zhuangzi
    said: "Heaven and earth are born alongside me, and all things are one with me."
    Thus, viewed from the Dao, all things have no hierarchy or distinction of nobility.
    Among Confucian thinkers, Zhang Zai first proposed the thought of the oneness
    of all things. In his *Western Inscription* (西铭), he said: "Qian (Heaven) is called
    father, Kun (Earth) is called mother. I, so small, dwell intimately in their midst.
    Therefore, that which fills heaven and earth is my body; that which directs heaven
    and earth is my nature. The people are my siblings; things are my companions."
    Wang Fuzhi commented: "Father and mother embody the virtue of Qian and Kun to
    give birth and form; that is the vital energy of heaven and earth''s operation,
    the heart of creating things is therein, and my physical form and heavenly nature
    are no different from my parents, that is, no different from heaven and earth."[⁶⁹]


    If Daoism and Confucianism emphasize the "I" being born alongside others and all
    things in heaven and earth, growing together between heaven and earth, Buddhist
    thought emphasizes the oneness of all things, mutual causality, mutual embedding,
    and fusion on multiple levels. The Buddha inspired and guided ignorant sentient
    beings towards awakening through numerous expedient means (fangbian famen), including
    the theory of karmic causality and reincarnation. According to this theory, all
    things in the world are governed by causal relationships, all arise due to the
    mutual dependence of various conditions, and these causal links interlock to form
    a chain of continuous causality, "born from old age and death, cycling endlessly
    without end."[⁷⁰] Thus, all existences in the world, including humans, plants,
    animals, and minerals, not only exist but are also given the conditions and support
    for life and continuation by other existences. In this sense, the oneness of all
    things implies a relationship of mutual causality, mutual embedding, and fusion.
    In the most fundamental sense, the Dharma (Buddhist law) or Great Wisdom''s understanding
    of "the oneness of all things" is established on the recognition of the "Buddha-nature"
    (佛性) or "Self-nature" (自性) of the ultimate origin. All sentient beings possess
    Buddha-nature or Self-nature. What is Self-nature? Self-nature is "the fundamental
    basis upon which all dharmas depend." It "manifests all worldly and unworldly
    dharmas; the five aggregates, six sense bases, eighteen elements, and even precepts,
    concentration, and wisdom all arise from the function of Self-nature."[⁷¹] That
    is to say, Self-nature possesses the nature and function of containing, manifesting,
    and changing all things. All things in the universe, including animals, plants,
    humans, and non-living things, are the result of the function of Self-nature.
    In this sense, are not all things in the universe "born of the same root" and
    one?


    In summary, the "shengsheng" view and the idea of the oneness of heaven, earth,
    and humans nourish, shape, and enrich contemporary symbiotic thought.


    Over the past twenty years, Japanese and Chinese scholars, when discussing the
    future of humanity, have advocated symbiotic thought and applied it to artistic
    creation and architectural design, as well as to education, society, politics,
    and geopolitical theory.[⁷²] Kisho Kurokawa is the founder of the influential
    architectural "Metabolism" movement and one of the most creative thinkers in contemporary
    Japanese architecture. During his lifetime, he vigorously advocated symbiotic
    philosophy, attracting widespread attention in Japan and China. He opposed strict
    binary oppositions and divisions such as interior/exterior, human/technology,
    and rural/urbanization, attempting to express in his architectural design works
    the insights he gained from biology and Buddhism.


    Based on the doctrine of "the oneness of all things," Master Hsing Yun, the abbot
    of Fo Guang Shan in Taiwan, has long advocated the thought of "tongti gongsheng"
    (同体共生, same-body symbiosis/coexistence), believing this to be the essence of the
    universe, and advocating the establishment of a "Great Harmony" (Datong) world
    based on this, by enhancing social cohesion and building political consensus.
    Master Hsing Yun believes that "tongti" (same-body) contains the meaning of "equality
    and inclusiveness," while "gongsheng" (symbiosis) implies "compassion and fusion."[⁷³]
    The thought of "tongti gongsheng" is not only about how humans should relate to
    each other, but also about including nature and other forms of existence. It transcends
    the mainstream binary methodology, discards the life-and-death struggle, and opposes
    the linear view of development and evolution. It affirms holistic thinking, value
    pluralism, and the diversification of forms of existence.


    In recent years, many European and American public intellectuals have also actively
    advocated *convivialism*, which is translated into Chinese as "Gongshengzhuyi"
    (共生主义, Symbioticism/Convivialism). In 2013, they issued a "Declaration of Interdependence,"
    deliberately contrasting it with the *Declaration of Independence* which proclaims
    American individualism. This "Declaration of Interdependence" proclaims that relationality
    is the essence of human and natural survival; it affirms the interconnectedness
    of all living beings and attempts to elucidate a philosophy by which all beings
    can survive together. In 2018, they issued a second declaration, proclaiming that
    neoliberalism has gone bankrupt, extreme individualism, rent-seeking, and speculative
    capitalism have a disgraceful track record, and that symbioticism should replace
    them as the unified political philosophy of the post-neoliberal era.[⁷⁴] The symbioticism
    advocated by European and American public intellectuals differs in intellectual
    origins, theoretical foundations, and context from the symbiotic thought advocated
    by Chinese and Japanese scholars, but the similarities are obvious: both remind
    people to pay attention to the relationality and interconnectedness between humans
    and nature, and between humans; both call for the abandonment of unbridled individualism
    and the capitalist spirit of maximizing profit; both emphasize mutual responsibility,
    constraints of coexistence, and self-restraint. Perhaps the challenges and setbacks
    brought by modernity and globalization have finally narrowed the gap between Eastern
    and Western intellectual circles; perhaps we can finally find a consensus on a
    common philosophy that fits heaven, earth, and humanity. Fei Xiaotong''s elegant
    words—"Appreciate one''s own beauty, appreciate the beauty of others, share beauty
    together, and the world will be in great harmony"—depict an ideal symbiotic world
    built on mutual connection, mutual respect, and common prosperity.


