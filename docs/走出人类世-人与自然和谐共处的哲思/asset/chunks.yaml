    \ Association, Volume Ⅱ , Issue 2.\n\n# 05  \n\n病毒时刻：无处幸免和苦难之问\n\n赵汀阳\n\n![](images/00008.jpeg)![p130](images/00012.jpeg)\n\
    \n### 突然的无处幸免\n\n2020年的新型冠状病毒全球大流行迅速使病毒时刻成为政治时刻、社会时刻、经济时刻和历史时刻，甚至被认为可能会成为历史的分水岭。托马斯·弗里德曼认为历史可被分为“新冠前”和“新冠后”，见惯兴衰的基辛格也认为病毒“带来的政治与经济剧变可能持续几代人”甚至“永远改变世界秩序”。此类预测流露了一种真实心情的预感，即世界要变天。罗伯特·席勒的看法另有一种历史社会学的视角：“我将疫情视为一个故事、一种叙事。新型冠状病毒自身可以作为一个故事传播”，“叙事也会像病毒一样具有传染性。如果一个故事主导舆论场好几年，就会像一场流行病一样改变许多东西”。\n\
    \n但病毒时刻尚未见分晓，仍在不确定性中演化，因为病毒时刻是否真的会成为划时代的时刻，取决于世界的后继行动和态度。答案一半在病毒手里，另一半在人类手里，而病毒和人类行动都是难以预定的“无理数”。在这里，我们暂且不追问答案，也无能力预知答案，还是先来分析病毒时刻提出的问题。\n\
    \n认为病毒时刻是“史诗级”巨变或“历史分水岭”，这些富有文学性的形容需要明确的参照系才能够明辨。假如以最少争议的划时代事件作为参考尺度，或可进行量级比较。历史上最重大的事情无过于改变生活、生产或思想能力的发明，比如文字、车轮、农业、工业、逻辑、微积分、相对论、量子力学、疫苗、抗生素、互联网、基因技术、人工智能等；或者精神的发明，比如大型宗教、希腊哲学、先秦思想等；或者政治革命，如法国大革命和十月革命；或者大规模战争，如二战；或者经济巨变，如地理大发现、资本主义、全球化市场和美元体系。按照这个粗略的参照系来比较，除非后续出现始料未及的政治或精神巨变，否则新型冠状病毒事件本身并不具备如此巨变的能量，但据经济学家的估计，或许足以造成类似1929—1933年那样的经济大萧条。\n\
    \n我们还可以换个分析框架或历史标准来看病毒时刻。布罗代尔的三个时段标准是一个有说明力的选项。“事件”有着暂时性，相当于历史时间之流的短时段波浪。那么，什么样的波涛能够波及在历史时间中足以形成“大势”的中时段，甚至触及稳定“结构”的长时段深水层？几乎可以肯定，新型冠状病毒大流行的影响力超过了短时段事件，或有可能形成某种中时段的大势。如果它真的能够决定数十年的大势，那就很惊悚了。假如新型冠状病毒大流行只是造成经济大萧条级别的后果，似乎仍然属于事件的范畴，尽管是特大事件，但还不足以形成大势；假如它导致了政治格局的改变，那就是大势了。这个大势的可能性虽然风雷隐隐，但尚未形成充分必然的出现理由，我们还需要考虑到来自长时段既定“结构”的阻力。文明、社会和思想的深层结构具有抵抗变化的稳定惰性。\n\
    \n从历史经验来看，意外事件冲击过后往往出现反弹，大多数事情会寻根式地恢复其路径依赖，从而恢复原样，正所谓“好了伤疤忘了疼”。这种反弹不仅是心理性的，而且是理性的，特别是在成本计算上是理性的。长时期形成的“结构”凝聚了大量成本，不仅有时间成本、经济成本和技术成本，还有文化、思想和心理成本，这些成本的叠加形成了不值得改变的稳定性。破坏“结构”等于釜底抽薪，是危及存在条件的冒险，所以革命是极高成本的变革。成功的革命总是发生在旧结构已经完全失灵的时候，即旧结构失去精神活力，无法保证社会安全和秩序，无法维持经济水平。可以注意到的是，1968年以来的世界发生了大量连续的“解构”运动，但主要是拆解了文明的一些表层结构，比如艺术的概念、性别的概念、社会身份和自我认同等，尚未动摇经济、政治制度和思维方法论等深层结构。那些最激进的“解构”几乎只存在于文本里，难以化为现实。解构运动的历史力度相当于对结构的“装修”：既然没有能力建造新房子，就只能以多种方式来装修。如果尚无能力在新维度上生成新结构的设想，尚无具备“建构力”的理念、原则和社会能量，“解构”就终究不可能化为革命，解构的行为反倒在不长的时间里就被吸收进旧的体制，成为旧结构的老树新花。\n\
    \n按照布罗代尔的理解，地理结构、经济结构、社会结构、思想结构或精神结构这些属于长时段的深层结构，具有超强的稳定性，因而难以改变。正因如此，千年不遇的大变局一旦发生，比如现代性的形成，或资本主义的形成，就成了200年来被不断反思的大问题，而百思未解的现代性却已在等待结构的“时代升维”了。不过新型冠状病毒大流行是否能够触发一种新的结构，这仍是个未定问题。关于新型冠状病毒大流行的结果，有一个颇有人气的最严重预测是全球化的终结。如果出现这个结果，就无疑达到了中时段的大势变局，甚至触及长时段的结构。\n\
    \n全球化是资本主义的一个结果，只要资本主义存在，资本就很难拒绝全球市场的诱惑。目前的全球化模式只是初级全球化，就经济层面而言，是“分工的全球化”。在分工链条中，参与其中的国家都在不同程度上受益。“分工的全球化”有可能被终结，但各地仍然需要全球市场来保证经济增长，而技术化和信息化的经济更需要最大程度的扩张。因此，全球化的终结在经济上、技术上和信息上都不是一个非常积极的理性激励。当然，不排除出现政治性的全球化终结，政治自有政治的动力。无论如何，追求自主安全和排他利益的最大化确实将成为未来的一个突出问题，因此有可能出现全球化的转型——由“分工的全球化”转向“竞争的全球化”。如此的话，那就至少形成了中时段的大变局。\n\
    \n“竞争的全球化”意味着，全球市场继续存在，经济、技术和信息的全球化继续进行，但全球化的游戏性质发生了改变，原先全球化中的“合作博弈”比例大大减少，而“不合作博弈”的比例大大增加，甚至可能会形成“不合作博弈”明显压倒“合作博弈”的局面。其中的危险性在于，竞争的全球化有可能激化从而导致全球化的租值消散，进而使全球化本身演化成一个进退两难的困境，退出就无利可图，不退出也无利可图。当然，这是一种极端可能性，而更大概率的可能性是，当不合作博弈导致无利可图的时候，合作博弈就会重新具备吸引力——至少按照艾克斯罗德的演化博弈模型来看是这样的。历史经验也表明，人类总是陷入困境，但也总能够想出办法脱困。\n\
    \n新型冠状病毒大流行的“问题链”会有多远、多深，是否会触及并动摇人类思想的深层概念，即哲学层次的概念，这一点将决定新冠肺炎疫情是否有着长时段的影响力。我们不可能穿越到未来提前查看病毒大流行的结果，但目前可以看见“提醒物”。提醒物未必指示结果，但暗示问题。\n\
    \n在提醒物中，我们首先看到的是在长时间欢乐中被遗忘的“无处幸免状态”。世界许多地区在经常性并且无处不在的“嘉年华状态”中遗忘了灾难的无处幸免状态。假日旅游、演唱会、体育比赛、产品发布会、首映式、电视节目、公司年会、销售活动、购物中心、艺术展览，都可以做成嘉年华，以至嘉年华不仅占据了时间，而且变成了空间本身。时间性的存在占有空间的时间足够长，就改变了空间的性质，即使时间性的活动结束了，空间也已经感染了难以消退的嘉年华性质。终于，无论是生活空间（外空间）还是心理空间（内空间）都感染了嘉年华的性质。\n\
    \n以事实说话，新型冠状病毒高强度的传染性使得世界无处幸免，压倒了嘉年华的感染力。本来，作为极端可能性的“无处幸免状态”从未在理论中缺席，可是理论却缺席了，欢乐不需要理论，因此理论被遗忘了。“无处幸免状态”并非抽象的可能性，它有着许多具体意象，比如全球核大战、星体撞击地球、不友好的外星文明入侵等，此类可能性据说概率很低，而且一旦发生就意味着人类的终结，也就不值得思考了。因此，“无处幸免状态”不被认为是一个问题，而是一个结论，或者是问题的终结。“无处幸免状态”在问题清单上消失了，转而在心理上被识别为恐怖传说或科幻故事，与现实有着安全距离，因此可以安全地受虐，大毁灭的故事反倒具有了娱乐性和超现实感。然而，“无处幸免状态”并非没有历史先例，恐龙灭绝虽然是恐龙的灾难，但所蕴含的可能性对于人类同样有效；各地历史都流传着灭绝性的大洪水故事，中世纪的黑死病，1918年大流感，冷战期间险些发生的核大战，如此等等。但这些历史都已化为被时间隔开了的老故事，从而遮蔽了问题。新型冠状病毒未必有以上历史事例那么具有毁灭性，却因现代交通和全球化而形成迅雷效果，直接使“无处幸免状态”变成现实，从而暴露了需要面对的相关问题，也把原本不成问题的事情重新变成了问题。这种“问题化”是创造性的，意味着原本可信任的社会系统、制度和观念在意外条件下可以突变为问题。人类的社会系统经得起慢慢变化从而形成巨变，但经不起突变。严重的不只是病毒的大肆传播，还有病毒传播时所处的时刻——全球化的流通能量超过了每个地方承受风险能力的当代时刻。\n\
    \n大规模传染病并非全球化的独特现象，而是一个古老的问题。在全球化之前，病毒通过“慢慢地”传播，最终也能传遍世界，假如不是由于某种运气被终结在某处的话。虽说太阳底下无新事，但新型冠状病毒把老问题推至新的条件下，就转化成了新问题。新型冠状病毒在当代交往与交通条件下的高速传播形成了类似“闪电战”的效果，使各地的医疗系统、社会管理系统、经济运作和相关物质资源系统猝不及防，陷入困境，使传染病由单纯的疾病问题变成了社会、政治和经济互相叠加的总体问题，直接造成了两个结果：一个问题即所有问题，这是政治最棘手的情况；一个地方即所有地方，这是社会最难应对的情况。这种连锁反应如不可控制地溃堤，就会穿透脆弱的社会系统而叩问人类生活的基本结构和基本概念，如果因此部分地改变了文明的基本概念，新冠肺炎疫情就可能具有长时段的意义。\n\
    \n### 形而下问题暴露了形而上问题\n\n新型冠状病毒大流行粗鲁而直接地提出了一个形而下的问题，即现代社会系统的脆弱性，或按照博弈论的说法，现代系统缺乏“鲁棒性”（robustness）。现代社会结构的所有方面都几乎完成了系统化。环环相扣的系统化意味着高效率，也意味着脆弱性。现代系统不断追求最小成本与最大收益，因此通常缺乏缓冲余量，从而加重了系统的脆弱性。为了达到利益最大化，现代社会的资金、物资、装备、生产、运输、供应系统都环环相扣且全马力运行，不仅在能力上缺乏余量，甚至预支了未来，总是处于能力透支的临界点，事实上很多系统都处于赤字状态，所以难以应对突变事件。塔勒布早就以其“黑天鹅”理论解释了现代系统的脆弱性。现代社会中唯一有着庞大余量的系统恐怕只有军备，比如可以毁灭全球若干次的核武器，而最大程度预支了未来的大概是金融体系。金融是现代社会运行的基础，因此，“预支未来”就成为当代性的一个主要特征。当代系统的基本意向是厌恶不确定性，可是不确定性却无法避免。就事实状态而言，或就存在论而言，不确定性才是真实事态，而“确定性”其实是一个概念，是逻辑和数学的发明，并不存在于现实之中。\n\
    \n新型冠状病毒大流行对于现代系统是正中要害的精准打击，这个要害就是人，或者说生命。现代系统本身的脆弱性只是隐患，在大多数情况下，即使遇到不确定性甚至严重挑战，往往最终仍然能够脱困，原因在于，系统的关键因素是人，是人在解决问题。人是具有灵活性的生命，人的思维和行动能力都具有天然的“鲁棒性”，所以，有人的系统就有活力。可是，新型冠状病毒打击的对象就是人，当人的生命普遍受到威胁时，现代系统能够指望什么力量使其脱困？\n\
    \n能够使现代系统瘫痪的致命打击，或直接威胁人的生命，或威胁人类生存的基本需要（例如粮食）从而危及生命。无论当代技术多么发达，乃至人们很多时间都生活在科幻效果或虚拟世界里，但只要人类仍然是碳基生命，那么，就存在论的顺序而言，人类的生命需要就优先于政治需要、经济需要、价值需要、享乐需要和文化需要。更准确地说，生命的基本需要就是最大的政治、经济和社会问题。虽然未能肯定新型冠状病毒是不是一个“史诗级”的挑战，但它肯定是一个范例式的挑战，它准确地踩在现代体系的神经上：生命问题。这是现代系统的阿喀琉斯之踵。\n\
    \n长时间以来，关于世界性危机的讨论更多聚焦于金融泡沫、气候变暖、大数据和人工智能对自由的威胁、动物保护或冰川融化等议题。这些危机固然严重，但远非新型冠状病毒这样覆巢之卵的危机。甚至其中有些议题，比如气候变暖，在科学界尚有争议。但这不是要点，关键问题是，那些议题被中产阶级化之后，掩盖了更致命的危机，使人们忘记了农民、工人和医生才是生存的依靠。新型冠状病毒大流行之所以如此触动人们神经，就在于它是一个突然出现的提醒物，再次提醒了人类集体的安全问题，再次提醒了“活着还是死去”（to\
    \ be or not to be）的问题永远有着现实性。\n\n危机总是从形而下的脆弱性开始。对于许多经济学家而言，新型冠状病毒大流行意味着正在发生百年不遇的经济灾难——实体经济的萧条加上金融体系的崩溃。这比金融泡沫所致的金融危机要深重得多，因为实体经济大萧条必定加重金融危机，而金融危机又会反过来打击实体经济的复苏，这样就会形成一种循环的衰退。与此相关，政治学家更关心“新冠经济危机”可能导致的政治后果。有政治学家认为（不知是担心还是庆幸），全球化会因新型冠状病毒大流行而终结。终结某种运动（包括全球化）有可能是新的开始，也可能会自陷困境，这取决于是否存在更好的出路。对某种事情不满意不等于能自动产生更好的选项。全球化从来不是一个皆大欢喜的合作运动，任何合作都会遇到如何分利的难题，完美的合作只存在于哲学理论中，就像“完全自由市场”从来只存在于经济学文本里。正如荀子在2\
    \ 000多年前就发现的，哪里有合作，哪里就有不平和不满，哪里就有冲突和斗争。我们甚至可以说，合作总是会埋下冲突的种子，总会创造出合作的破坏者。"
  fmt: '

    总之，近现代以来人类一直以零和竞争的心态，不遗余力地追求“进步”和“突破”，并最大限度地创造财富和追求地缘政治优势，在带来物质和文明极大发展的同时，无节制性的最大化思维方式也将我们导入了今天这般环境日益恶化、社会纽带断裂、国际体系日益分崩离析并日趋对抗的世界。我们人类是时候从自然和古代东方哲学中学习并实践这种基于共生关系的思想了。


