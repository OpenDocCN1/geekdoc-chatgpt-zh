    在死亡问题上，如果说儒家“避重就轻”，秉持“未知生，焉知死”的态度，道家对生与死的看法则意趣迥然。道家思想根植于道生万物、自然至上的宇宙观，认为生死乃道之自然法则。庄子则更是以超然、挑战乃至幽默的态度大谈生死。他认为，气聚则生，气散则死，生死相继，生死一体，死亡只是人类生命向另一种生命形态的转变，乃自然造化，有何堪忧？


    总之，“生生”的观念对中国本土哲学的特质、中国人的价值取向和思维方式产生了深远影响。一方面，中国文化中留存了求生、寻求此岸生活乐趣、长寿和生命延续的强大基因。另一方面，中国人又受道家的影响，能够达观地将人类不可避免地走向死亡这一事实视为转化成其他生命形态的自然现象。这种一方面求生而另一方面相信生死循环的观念造就了中国人强大的生存精神、韧性和面对逆境时的乐观主义。


    然而，对生死的达观并不等于了脱生死。在此，星云大师的一段话或许对我们有所裨益。星云认为，了脱生死的意义在于，“生，不为生的苦所束缚、困扰，而能突破生的困难、挑战；死，也不为死亡而伤心难过不已，而能了知有个不死的佛性”[![](images/00007.png)](#part0002.html#note7n)。


    ## 我们需要什么样的哲学和“形而上”升维？


    综观各位作者在疫情期间的思考，我总结出以下两条主线。


    ### 第一主线：纠正人的“错位”，重新思考适用于人与其他存在形式的思想体系


    在认识上要摆正人的位置，甚至转变对“人”的认识。在自我认知、反思的基础上发挥主观能动作用或许是人类得天独厚的禀赋，但这种认知和能力不应该让我们自以为超越了自然和生命系统的基本规律，甚至自恃其能，肆意奴役、掠夺其他自然万物，将自己的利益最大化。恰恰相反，无论是科学家对物种演化、生命系统基本机制的发现和观察，还是哲学家、宗教家的因缘法、万物一体论，我们的认识都指向宇宙万物（包括人类）的同源性、一体性以及相互依赖与共生共存的秉性。由于人类强大的认知能力与主观能动性，人类之于宇宙万物应有“乱可治、绝可续、死可生”的责任与担当。


    基于对人归位后的认识，我们应该建立什么样的有广泛适用性的思想体系呢？白书农认为，既然人是生物，那么终极而言人类的生存与发展不得不服从生命系统的基本规律，而这些规律在人类出现之前就已经形成，并生生不息。他把这种以生命系统的基本规律作为人类行为规范是非标准的终极依据的思路称为“生本”观念，与过往的“神本”“人本”体系相对。这个“生本”体系最基本的特征就是“活”。


    这不免让我想起近年来生物学界热议的共生与共生演化理论。20世纪中期以来，越来越多的动植物学家认为，共生是生物界普遍存在的现象，不同生物以互利共生、寄生和共栖等关系生活在一起。有些科学家进一步认为，与达尔文进化论的自然选择假设不同，“共生”在新物种的演化创新中发挥了至关重要的作用。达尔文进化论强调斗争、对立、零和竞争和适者生存，而共生假说的核心是相互依赖、相互关联、权衡取舍、共存和共同演化。


    受到东方哲学、宗教传统与当代生物学的启发，中日学者近年来提倡“共生思想”，肯定整体性思维、价值多元和存在形式的多样化。中国固有哲学思想中“生生”的古老智慧也给共生思想提供滋养与启发。“生生”意味着出生、再生、永续发展、变化。“生生”也有“自己活，也让别人活”的意涵，恰似英文中“Live
    and let live”的表达。这种世界观显然与生物界的共生现象有异曲同工之妙。统摄包括人在内的所有生命形式的就是这种生命力，以及这份生存、延续和繁荣的力量。总之，从“生生”与共生的理念出发，我们必然得出结论：所有人类的生命、非人类的生命甚至非生命的事物相互纠缠而生存，又因彼此而改变、发展和延续，不同的生命形式理应得到相应的尊重和关照。


    ### 第二主线：新冠病毒暴露了人类本身才是最大的问题


    各位作者的共识是，新冠病毒的全球大流行所暴露的不仅仅是发生在人类身上的问题，更重要的是，它暴露了人类本身才是最大的问题。我们亟须思想转向和“升维”，甚至寻找从根本上解决人类困境与烦恼的方法和道路。


    那么，我们应该如何解构、重组甚至颠覆近几百年以来固化的概念、思维方式以及生命实践，来面对当下和未来将不断上演的生死存亡危机呢？白书农认为，疫情为人类反思以往的“神本”“人本”文化提供了机缘，人类意识是时候转向对一般生命系统演化规律的探索，并塑造“生本”的思想体系。赵汀阳认为，“疫情触动了形而上的问题”。王蓉蓉和沃思则分别认为，疫情是“道”的时刻，是体悟疫情“病毒经”的时刻。在人类陷入四面楚歌之际，我们或许应该回到哲学原点，重新思考诸如“幸福”“痛苦”“自由”“生死”这类伴随我们生生世世而又时常被遗忘的理念和相应的生命实践。张祥龙则认为，疫情给高歌猛进的高科技狂热打了一针镇静剂，或许“适生”科技才能给人带来长久的安康幸福。沃思沿用佛教教义，规劝人类发“四无量心”——慈、悲、喜、舍，发扬人类存续的中道。


    总之，各位参与写作的科学家和哲学家都认为，当下是人类思想应该转向和“升维”的时刻。


    如果说从伦理学的外部来反思伦理学是维特根斯坦式的“无情”反思，那么从人类惯用的意识、思维、概念、名相之外部来“观”自己，通过“悟”抵达真实，这或许是对自我、对人类历史和现状的最“无情”反思，或许也是帮助人类“升维”的努力。


    沃思以为，或许疫情这个“突然经历的苦”可以打破我们的体验之根底里“那带着粪便味儿、蒙着灰尘的常识”，而让我们渴求道元法师所说的“大觉醒”。沃思语重心长地呼吁道：“这是大事，是一等一的大事，如果对此置之不理，那么我们无论付出多少努力都将徒劳无功。”


    的确，从大觉醒和大智慧角度来看，迷惑的人类遇到危机可以转换意识，从以前的人类世、人类中心主义到当下的微生物世、非人类中心主义，或许可以解决一时一际的问题，但那大抵类似瘾君子自我开方，解一时燃眉之急、缓解症状而已！那么要彻底反思和颠覆对当下人类境况的认识，仅仅对我们感知的客体事物或对象化的事物重新定位或更换视角似乎还意犹未尽，我们应该进一步反躬自问：观察、思考的主体的“我”又是什么？“我”的本质是什么？这个“我”与我们惯常的对象化的宇宙万物之间又是什么关系？我在此把这一千年大哉问留给读者吧。


    总而言之，新冠肺炎疫情给人类带来灾难、恐慌。但是如果人们把握住这个机缘而真有所思、有所悟，在根本层面上重新思考被人类社会奉为圭臬的生命观、人生观和世界观，着手深刻地自省与自觉，这或许才是这场新冠肺炎疫情之于人类的最大意义。


