- raw: '可见，康德的回答尽管很有启发，但也有重大疏漏。说得更具体些就是，断定西式数学是感性直观的纯形式的唯一表达，以及牛顿物理学是对物理因果关系的唯一表达，就失之独断。比如，他以欧几里得几何作为空间纯形式的唯一呈现，对于他虽然是自明的，就像那时说“过直线外一点只能做一条平行线”是自明的一样，但后来非欧几何的发现表明，几何可以不止一种，过直线外一点可能做出不止一条平行线。虽然这种疏漏似乎只是在西式数学和科学之内，但这种根底处的反例（结合库恩的“范式”说）还是显示出，康德所谓的“先天”有效范式，或人认知世界总会带有的“必要偏见”，并非一元化的，也不必是形式化数学的。只要能形成“研究范式”[![](images/00007.png)](#part0005.html#note28n)，具有某种形态的推衍力，那么就有伸展出理论预设从而引导实验的能力。比如，数学可以不那么形式化，就如中国的《九章算术》所显示的，甚至《易》象数也是一种有某种先天推衍力的架构。而且，“范式”包括但不同于具体的研究方式，它的规范形式是自涉的和全方位的，即它本身就包含着对范式的规范，并没有一个标准能衡量所有范式的优劣。可见，不同的研究范式有不同的长处和短处。高科技研究范式的长处是数理形式化、精准对象化、强力化、竞争化，推崇这些长处的标准（比如“更高、更快、更强”）也属于此范式，因此以往另有一些范式，比如儒家的、道家的、佛家的、泛神论的，甚至亚里士多德的，并不赞同这样的标准。


    由此可知，“先天”[![](images/00007.png)](#part0005.html#note29n)并不等于“唯一”。人并不是神，并无超越其生存方式——生理结构、所用语言、所处环境、所承文化、所临挑战的完全透明的认知方式，总有本能和际遇造成的先天前提或先天色调。科学家也是活在其境况或“生活形式”（维特根斯坦）中的人，因此任何科学研究也必有其先天预设或研究范式。但如上所析，构成此先天预设的时空间的纯形式或纯象，是非对象化的，因此绝不会纯粹到只有一种表达形式的地步。“先验想象力”构造的“纯象”（reines
    Bild, pure image）[![](images/00007.png)](#part0005.html#note30n)或“图式”（Schema）超出了可对象化（包括观念对象化）的形式，就像纯三角形超出了任何具体的三角形（但还不是概念），也超出了欧氏几何乃至任何几何范式所规定的抽象三角形。我们甚至可以问：难道三角形只能是二维、三维，而不能是四维和五维的吗？“再生的想象力”达不到超三维者，但“先验的、发生性的想象力”就有可能。


    高科技崇拜完全盲目于科技研究范式的多样性，将高科技吹捧为科技中的唯一真理，打压其他科技，将高科技带有的天然的甚至从某个角度看是合理的偏执，加以意识形态化和观念固化，从而阻断从其他角度研究自然的合理可能。


    高科技成果对于人类来说，有时是危险的，甚至是极度危险的，比如一些化工产品（塑料、杀虫剂、毒气等），以及废气排放、热核炸弹、各种污染垃圾（包括核废料）、纳米材料、基因改造、超级人工智能（还有待实现）等，这一事实目前在有反省力的知识界几乎已是尽人皆闻的常识了。其他科技范式，比如中国古代科技、古埃及科技、印第安科技，虽然也能大致满足当时的生存需要，但不会带来这种危险。而且，随着高科技的“总要更高”本性的驱使，它未来的产品会更加具有改造世界基本结构的力量，也就更加危险。但高科技崇拜让人看不清楚这种危险的紧迫性和致命性，或者让人相信，这种危险即便有，也只能靠更高的科技来解决，绝无用其他科技来替代或部分替代以解决问题的可能。这就相当于说，一拨官僚犯了贪污和滥用职权罪，但只能靠他们自己或他们所属的机构来改正。简言之，高科技崇拜压抑了人们的先验想象力，将其束缚于现代性和高科技范式所创造的形象和价值结构之中。甚至可以说，这是一种闷裹住人的本源思想自由的新宗教裁判所。


    ### 新冠肺炎疫情中的高科技及高科技崇拜


    这次新冠肺炎疫情暴露出高科技的一些局限，特别是高科技崇拜的一些漏洞。首先，在“非典”出现仅仅十几年后，与之类似的病毒再次引发大规模疫情，这说明高科技面对威胁人群的新疫病，还缺少有效的预防措施和治疗办法。对于疫情，高科技事先没有提供明确的预警，即便在新冠肺炎疫情出现后，除了行政上的颟顸霸道使防控不力之外，高科技本身也有问题，比如一些国家的高科技专家在疫情初期还自信地宣布“可防可控”，或者宣称“戴口罩作用不大”。但疫情很快就失控，导致封城、封区、断航、停工、停学等一系列特别强力措施的实施。而且，高科技目前还不能提供可直接消灭该病毒的特效药和针对性疫苗。不久的将来，疫苗或应对药物可能会被开发出来，但已经错过了有效防控疫情的最佳时机。在许多情况下，这并非科技人员无能，而是由高科技的特点决定的。精确对象化的研究方式要求对象出现后，而且是被仔细（比如基因层次上的）辨认后才能研究，但传染病的病源不是完全可对象实体化的。你可以用疫苗控制甚至消灭天花，较有效地应对霍乱、疟疾和血吸虫病，但病原体是活物，它们中的一些会随时间推移而变异，适应新的医药、人体环境，产生所谓的耐药性，所以我们在高科技的视野中还看不到消灭所有疫病的可能，甚至看不到有效预测和防控重大疫情的办法。


    关于这次疫情的起源，至今也没有确切的说法。从表面上看，它先在中国的一个省份暴发，又在其他不少国家出现，但一些追溯性的研究显示，导致疫情的病毒在更早时段就已经存于世间。这种扑朔迷离的状况说明，高科技并非万能，它在对付不那么充分对象化的生命体时，就会捉襟见肘。我们常听到这样的声音：“这是个该让专家解决的问题。”但问题是，专家们对这样的问题常常也莫衷一是，以致一些别有用心的政客可以利用其中的某一说法来翻云覆雨。而且，高科技制造出的快捷运输工具和由此带来的全球化流动，不仅助长了疫病传播的速度，而且使追溯病毒来源更加困难。


    其次，曾经有过这样的传言，即引起这次疫情的新型冠状病毒是人工合成的。至于是由谁合成的，目的何在，则有不同的版本。本文作者曾经看到、听到过一些报道和音视频资料，由一些不乏声望的科学家、病毒专家出面，看似证据确凿地论证这样的断言。后来又有28位科学家联名写信，否认了这一论断。无论此传言是真是假（我个人一直倾向于后者），都表明了一个现实：现在的高科技有能力，起码很有可能制造出新型冠状病毒甚至更加可怕的病毒。那些专家做肯定或否定的论证时，只是在争论新型冠状病毒是不是人工合成的，而不是在争论现有高科技是否能够造出它来。这就又说明一个问题：高科技有能力制造出可以大大伤害人类的东西，却没有能力有效及时地克制它（见上面的讨论）。这就非常危险！而且，这种不对称的情况看来是广泛存在的。20世纪以来，人类能够制造原子弹，但一直没有找到消除核战争的生态恶果和处理核废料的持续可行的有效手段。人类能够开发像石油这样的化学燃料，能够制造千百种化工产品，比如天文数字的塑料袋，却没有多少科技能力来消除温室效应、石油海上泄漏和化工产品对人类、土地、水和空气所造成的长期的、不可逆的污染恶果。此外，高科技将有能力改变人类的基因，却不知如何处理这种高科技超人与正常人类的关系，更不知如何让超人活得幸福。高科技将可能造出能力强大的人工智能，却不知如何让它只造福人类而非致祸于人类。“机器人三定律”（出自阿西莫夫）一类的规则，其本身就可能自相矛盾，加上更多的辅助定律，则会让情况变得更复杂难测。一句话，高科技有能力制造天使和恶魔，却没有能力把恶魔关到瓶子里去。


    再次，由于高科技医学对于人体充分对象化的研究角度，它的治疗方案绝大多数是针对病原体和发病器官的，采取的是直接对抗，即“上帝对抗魔鬼”的策略，也就是杀灭病原体（或激发抗体以杀灭之）和切除患病部位等“战争化”策略。这种策略在一些情况下是必要的，也很有效，但注定存在重大缺陷，因为充分对象化的应对方式跟不上生命时间的流变，比如上面提及的病原体变异以及形成耐药性，就是高科技医学无法测度和有效对治的。而且，这种治疗方式还会产生两个不良后果——辨识疾病，尤其是流行性传染病越来越困难，以及用药和手术的毒副作用。总会有新的病原体及其变异体出现，所以辨别眼前的疾疫现象到底属于哪种病会越来越烦琐、专业和困难，需要经过长期培训的专业人员和高端设备。尤其是传染病流行期间，如冬春季之于流感、“非典”和新冠肺炎，在蜂拥而来的患者体征中有把握地区别出它们，及时发现新出现者或有重大威胁者，以便行政部门能够采取决断措施，这是相当困难的。这次新冠肺炎疫情刚出现时，（比如在美国）就曾被视为流感而忽视，后来被某些敏感者发现异状，“吹哨”示警，但因仓促间视之为“非典”而遭到忽视。即便有医生，如张继先医生辨识出这是一种新疫情并且上报（2019年12月27日），但因无法马上判断出关于这种病的确切（充分对象化）信息，以致并没有能够突破各种病情噪声，也就没能决定性地影响专业权威和行政决策，导致疫情在三周内急剧扩大。张文宏医生在最近的一篇文章中谈及这种困境，[![](images/00007.png)](#part0005.html#note31n)但他所提出的改进建议只是要按国际标准建立感染科和临床微生物科，让我们已经很强大的疾控直报系统更加强大，“把敌人阻断在第一线，而不是全城暴发后才让疾控来收拾”。如果国家财力雄厚，建立这些科室，加强有关人员的培训，的确可以增强拉警报的能力；再配合以对疫情暴发点的严格管控，的确是一种有效的临时应对办法。[![](images/00007.png)](#part0005.html#note32n)但这是否能从根本上解决以上所谈及的那些对象化研究和治疗的痼疾？基本上不可能的，至少是存疑的。


    至于高科技医学的另一个问题，即用药和手术的毒副作用，也是触目惊心的。比如，癌症手术及术后的化疗会破坏人体免疫力。一些病需要患者终生服药，这样也容易使副作用积累成患。虽然包括中药在内的各种药物几乎都有副作用，但由于高科技药物大多针对专门的病源对象，更加难以考虑整个身体的需求，所以副作用应该更大、更强。对于人体这种有灵性的活体而言，“只赚不赔”的买卖并不存在。中医药强调要关注人的身心整体活性（阴阳相交而产生的元气），诊断和用药的时机性强，对象性弱，方剂讲究药物之间“君臣佐使”的互补搭配效果，还重视“治未病”——治疗或预防那些还未对象化的疾病，所以总体而言毒副作用应该小很多。中成药的应用如果只是像西药那样刻板，有些的确会产生不容忽视的毒副作用，但它们在中医的原本范式中是可以避免或弱化的。


    这次新冠肺炎疫情中的高科技崇拜体现得也很明显。首先，防控系统基本上，甚至可以说完全是高科技化的，比如以上所引张文宏的文章所反映出的情况——虽然此系统屡有差池，但人们还是坚持高科技体系的一家独大，在关键问题或判断上不容其他科技插手。网上流传一段视频，显示在2019年6月27日中国中医科学院组织的一次会议上，中医医生和学者王永炎院士在正式发言中预测：“下半年特别是在冬至前后，也就是连续到明年的春季，要有温疫发生。”[![](images/00007.png)](#part0005.html#note33n)2019年冬至是12月22日，根据现有信息，武汉疫情第一例病例出现于2019年12月初（冬至近前），正式暴发于2020年1月（紧接冬至后）。现在看来，这一在事情发生半年前做出的预测，起码就瘟疫暴发的时间而言，是基本准确的。关于瘟疫持续的时间（“到明年的春季”），现在看大致也是不错的。如果此次疫情在中国持续到了夏季甚至秋季，此点预测就有纰漏[![](images/00007.png)](#part0005.html#note34n)。


    对此，《新京报》等立马发出了严重置疑的声音[![](images/00007.png)](#part0005.html#note35n)，称其为“神预测”或“神秘学的预测”，与“科学预测”完全不同。《新京报》的刊文中提出了区别两者的标准：“这种科学预测，是基于明确掌握的规律，通过系统整理总结和进一步研究给出预言，科学家们会写成论文，从最基础的数据、知识梳理成体系，按照逻辑过程展示给同行看，对其中的难点要点还会反复解释和讨论。而且，这些都是可以质疑、检验的。”[![](images/00007.png)](#part0005.html#note36n)但这些标准并不能完全否定王永炎院士的预测，因为根据网上另一篇文章[![](images/00007.png)](#part0005.html#note37n)所说的，王永炎院士的预测也是基于明确掌握的、有数据支持的规律，只是它不是高科技的规律，而是中医学的阴阳五行和五运六气的运行规律，有其证据和知识，也可以被质疑和检验（上面的陈述中也已含有）。至于反复解释、讨论和写成论文，中医学内部当然可以进行，也应该进行。可惜的是，王院士这个预测似乎没有配以详细的相关研究和论证，这也是它受到忽视的一个原因。不过，即便如此，也并不能说明中医的研究范式不能做出科学预测，只能说明目前中医研究力量的缺乏。如果王院士的预测受到它理应得到的关注，那么就不但会在中医学界中，还可在跨范式的学者间得到认真的研究和检测。


    《新京报》的那篇文章便代表了目前极为流行的高科技崇拜的基本特点，即以科学的名义来垄断科学的解释权，从而败坏了科学最终要向经验事实开放的性质；对于与自己异质的“他者”或非高科技的科技，一概以杀伤力很强的“神秘”甚至“原始神话、宗教故事到民俗传说”来混淆。它对王永炎院士的预测进行了如下的排斥：“相反，神秘学的预测，不会明确告诉你规律是什么，也不会把基本原理掰开揉碎了给你看，只有事后你自己尽可能朝向已经发生的事情靠拢解释。所以神秘学预言对未来无任何意义。”我在前面已经论说，王永炎院士的预测对未来（我们正处在这未来之中）是有重大意义的，如果它受到了理应受到的合理关注，还会有更重大的意义。但让人痛心的是，无数这类本来具有或会具有意义的观测和发明，都以如此堂皇和蛮横的理由被排挤和扼杀了。只是由于这次疫情影响巨大，高科技的应对到目前为止又不很得力，所以王永炎院士的预测才进入了公众视野。


    此外，鉴于之前应对“非典”的经验，这次中医比较早就介入了新冠肺炎疫情的诊断、治疗和预防，至今看来起到了与高科技不同但不容忽视的积极作用。[![](images/00007.png)](#part0005.html#note38n)例如，据一篇报道所述，北京地坛医院的“中医药治疗方案不仅对轻型、普通型新冠肺炎患者有效，而且对重症患者也取得了一定疗效。经初步分析，单用中药对症治疗有效率为87.5%，中西医结合有效率为92.3%”[![](images/00007.png)](#part0005.html#note39n)。其他多家医院和多个地区也报道了类似的或明显的成效，如广东、浙江、四川、山西、云南。在湖北武汉亦如此。在武汉参加抗疫的中医专家张伯礼院士于2020年2月28日接受采访时说道：“现在不但所有方舱医院都在用中西医结合治疗，包括金银潭医院、武汉肺科医院、武汉协和医院重症病人也开始中西医联合会诊，较多患者使用了中药。目前在武汉，中药使用率由2月初的30%上升到超过80%。”[![](images/00007.png)](#part0005.html#note40n)又比如，黄璐琦院士在武汉通过一线临床观察发现：“通过中西医结合，轻症患者胸闷等不适症状消失较快，重症患者治疗周期缩短，中西医结合的平均住院时间小于西医治疗时间。”[![](images/00007.png)](#part0005.html#note41n)根据较近期（2020年6月初）的报道，从总体上看，“新冠肺炎患者确诊病例中，超90%使用了中医药。临床疗效观察，中医药总有效率90%以上”[![](images/00007.png)](#part0005.html#note42n)。


    张伯礼院士如此解释中医药的抗疫机制：“现代药理学研究表明，不少中药具有解热、抗炎作用，可改善患者发热症状，控制肺部炎症扩散，促进炎症吸收，起到多方面、多途径、多靶点的作用。此外，在抗病毒的同时，中医药干预的优势还在于可调节人体免疫功能，激发机体自身防御能力。”[![](images/00007.png)](#part0005.html#note43n)他这是在用高科技的术语甚至思路来解释中医抗疫的效果，体现了“中西医结合”。如果这种“结合”没有像过去的某段时间那样，以牺牲中医的研究范式、降低中医为辅助性的医药库为代价的话，那么在被高科技崇拜打压的处境中，这也不妨是中医这种另类医学为了生存而采取的一种策略。但中医学理解和治疗这类疫情有自己的独特范式，也就是有自己的一整套理论、思路、术语、诊断、用药和检测方式，与高科技有质的不同。比如，中医师刘力红谈及他在武汉抗疫的体会时，就完全从中医的研究范式来辨证和表述了。他从舌苔征象判断病体属“湿症”，从脉象上判断此疫病以“肺上的痰浊”为共性，又通过张仲景《伤寒论》中“合病及两感”的思路来理解，等等，然后得出治疗方案，比如“四逆法”“附子”“针刺”。[![](images/00007.png)](#part0005.html#note44n)简单说来，高科技医学对待疫病的方法类似于现在流行的对付夏季洪水的思路，即建大坝、水泥堤岸、排水管道，旨在堵截和排掉；中医则近乎对于江河湖沼的亲水性调节，或俞孔坚教授等人讲的“大脚革命”（指放开束缚河沼的“裹小脚”策略）或“海绵城市”的致思方向，当然中医有更长久和独立得多的历史和更丰富的内涵。从目前的现实情况看，两种乃至多种思路和应对策略都是必要的。


    总之，异质于高科技的中医在这次疫病的预测、诊断、治疗和预防中，都有独特的不俗表现，在一些方面（比如预测方面）起到了高科技起不到的作用，在其他各方面也有着不可替代的独特功能。中医之所以能够取得这些成绩，与中医理论和实践中含有的非对象化、阴阳时机化的维度密不可分。比如，王永炎院士做预测所依据的“五运六气学说”[![](images/00007.png)](#part0005.html#note45n)，就是基于阴阳五行观的、含有生命时间的非对象化向度的理论。又比如，刘力红建议的针刺或针灸法，也以经络这样的不可充分对象化（解剖化）的存在预设为前提。至于中医的切脉、方剂等，也是充满了时机性、身体的当场感受性的疗法。当然，它们也都有对象化的向度，也就是在适当的时机和场合实现为症状辨别、药物运用和治疗效果评估等具体对象的事项。所以中医不止于“治未病”，对于已然形成的疾病乃至重症（比如这次疫情中的重症病人）也有应对之策。如果能够充分尊重中医自身的研究范式和历史传承，那么在目前的状况下，有机的、灵活的和相互平等的“中西医结合”，再加上藏医、蒙医等各种医书的多元结合，的确是一条比单个的西医或中医应对方式更佳的防控疫病的路线。可见，医学领域中高科技崇拜的主张——唯有高科技医学掌握了关于人体的真理，中医等另类医术根本不是科学，甚至是有害的江湖邪术——是错误的，坚持它们带来的只是危险和灾祸，而不是繁荣和强大，更不是和谐与久远的美好生存。'
