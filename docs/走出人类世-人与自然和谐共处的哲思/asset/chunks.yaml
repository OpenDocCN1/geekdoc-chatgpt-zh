    ## Reflecting on High-Tech Worship from the COVID-19 Pandemic


    **Zhang Xianglong**


    ![](img/00013.jpeg) ![p076](img/00001.jpeg)


    Since the outbreak of the COVID-19 pandemic, the author, like hundreds of millions
    of compatriots, has been anxious day and night, longing for the arrival of the
    "turning point" and praying for the pandemic to subside. In 2003, we experienced
    "SARS," which shook the whole country. But this pandemic appears even more ferocious;
    the virus is more intractable and more infectious. At this moment, besides taking
    preventive measures within one''s capacity, the author, secluded at home, cannot
    help but reflect on the warnings given to us by the repeated occurrence of such
    plagues. As of the time of writing this article![](img/#part0005.html#note20n),
    the author has seen many related commentaries with various leanings, but few,
    it seems, have linked this plague phenomenon to high-tech worship.


    First, we must acknowledge two facts: First, pestilence is a disaster that frequently
    appears in human history; Second, Western-originated high technology, especially
    high technology in the fields of medicine and pharmacy, has been a sharp weapon
    in modern times for resisting certain diseases that threaten humans, such as penicillin
    for inflammatory infections, various vaccines for infectious diseases, surgery
    for cataracts, appendicitis, dental diseases, trauma, dystocia, and so on. Generally
    speaking, the high technology of modern medicine and its related cognition (such
    as cognition regarding the sources of diseases and the necessity of public health)
    have powerfully promoted the extension of human lifespan![](img/#part0005.html#note21n),
    which is undeniably a major achievement of humanity. However, there is another
    side to the matter. If these high technologies are revered as the sole truth in
    their relevant fields, excluding other technologies![](img/#part0005.html#note22n)
    and knowledge, one will fall into high-tech worship, and such worship is unfavorable,
    even dangerous, to the survival of the Chinese nation and even humanity. This
    article intends to argue this judgment in light of the current COVID-19 pandemic.


    Based on the above, readers should already understand that the author does not
    oppose high technology itself, and gives high praise to the positive achievements
    of this high technology. The author believes that what needs to be criticized
    and discarded is merely the *worship* of high technology. Next, the author will
    mainly answer the following questions: What is "high-tech worship"? Why can high
    technology achieve such outstanding results? What are the limitations of high
    technology? What dangers has high-tech worship brought or may potentially bring?
    How are these limitations and worship manifested in this COVID-19 pandemic? How
    can the state of high-tech monopoly be transformed into the widespread application
    of appropriate technology?


    ### What is High-Tech Worship?


    First, what is high technology? Literally, high technology is high-end, advanced,
    cutting-edge science and technology. But in terms of its substantive content,
    high technology is science and technology that has been fully objectified, can
    produce novel effects relatively quickly—new productive forces, commercial profits,
    Nobel Prizes, enhance the reputation of the "tech wizards," thereby enhancing
    the holder''s control and influence over nature and others. The more precisely
    a technological product is objectified, that is, quantified and systematized in
    form, the more easily it becomes a force and means of transforming natural things
    and interpersonal relationships. The difference between Traditional Chinese Medicine
    (TCM) and Western medicine can illustrate this problem well. To this day, Western
    medicine''s view of the human body and disease has become quite objectified. Western
    medicine understands the human body mainly through anatomy, thereby gaining knowledge
    of the operation of human tissues, organs, body fluids, and neural networks; later
    it discovered finer objects such as cells, bacteria, viruses, and genes, and uses
    them to explain the formation of the human body and the causes and treatments
    of diseases. In particular, the discovery of genes is regarded as humanity having
    obtained the "key" to understanding and transforming living bodies (including
    the human body). In contrast, and even opposite in some respects, TCM, although
    it has its own effective research methods, based on theories and hypotheses such
    as Yin-Yang Five Elements and Five Movements Six Qi, is full of temporal or opportunistic
    understanding, but its cognition of the human body is not precisely objectified
    or physically spatially localized. TCM''s cognition of the "Five Viscera and Six
    Bowels" is not equivalent to the viscera in the anatomical sense (this once became
    one of the reasons TCM was attacked as unscientific), but is more of a functional,
    overlapping, or holistic cognition. Meridians are basically non-objectified, yet
    they are a real human bodily existence; reducing them to some physical object,
    such as the "cell-gap-connective tissue-blood vessel-lymph-body fluid (endocrine-immunity)-neural
    pluralistic system," even if helpful, cannot replace the intuitively self-evident
    understanding of meridians in TCM''s original paradigm. TCM knows the physical
    condition and illness through pulse diagnosis, which cannot be reasonably explained
    by objectified causal relationships either. As for the Five Movements Six Qi and
    other temporal doctrines, they are even further removed from objectified thinking.
    Therefore, TCM is not high technology.


    For another example, ancient Chinese invented black powder composed of sulfur,
    saltpeter, and charcoal. This seems to be the result of objectified research,
    but the actual situation is not entirely so; it is very different from the Western
    invention and application of gunpowder. The ancient Chinese used sulfur and saltpeter
    to treat diseases very early (hence called "medicine"); later, Taoists, in pursuit
    of longevity, used these medicines for alchemy, and in this process randomly discovered
    black powder. Afterward, black powder in China was used to make smoke and fire
    effects for acrobatics and circuses, or firecrackers and fireworks for exorcism
    and celebrations. Only later did black powder begin to be used for military purposes,
    but due to the lack of fully objectified research, its power was small, and it
    was difficult to be precisely applied to rapid firing and intense explosions of
    weapons. This situation did not attract strong attention from the court and the
    public, so this gunpowder in China also failed to dominate subsequent military
    development. Ancient China had many inventions, all disappearing inadvertently
    as objects like this; this was caused by the thinking patterns and values of the
    ancient Chinese, who had an instinctive and rational vigilance and neglect toward
    fully objectified technology, whether Confucian or Taoist. Black powder was transmitted
    to the West via Arabs, influencing Westerners'' empirical feelings. But Westerners,
    in a more precisely objectified way, created modern gunpowder. It originated in
    1771 with picric acid synthesized by P. Wolfe of England, a yellow crystal, hence
    the name "yellow gunpowder." Over more than 100 years, gunpowder was improved
    many times by Nobel and others, becoming increasingly precisely objectified, and
    in the interconnected system of modern technology, evolved into modern gunpowder
    usable in machine guns, automatic rifles, explosive shells, and rockets, capable
    of killing like hemp and blasting holes through mountains.


    It must be admitted that, so far, high technology originates from the West, that
    is, Europe and North America. The method of high technology is to objectify the
    object of study precisely and systematically, and to discover new breakthroughs
    through the combination of pre-constructed hypotheses and experimental testing.
    Therefore, its ideal research paradigm is the mathematics pioneered by ancient
    Greece, such as *Elements*, which possesses both formal precision and calculable
    deducibility and verifiability. Of course, to extend its tentacles into the material
    natural world, it needs repeated experiments, but these empirical practices serve
    the mathematized and theoretical-modelized research framework, thereby distinguishing
    it from the "empirical" technologies produced in other civilizations (this judgment
    is not entirely accurate, and will be discussed below).


    Second, what is high-tech worship? It is a tendency of thought and ideology that
    regards high technology as the sole truth in every field and matter, to be unconditionally
    promoted worldwide, while viewing other research or practice methods in the same
    field and matter as heresies, at least as non-truths, which must be excluded and
    overthrown for peace of mind. The historical source or source of this mode of
    thinking of such worship mainly lies in the Western religious worship of the one
    supreme God. This religion firmly believes it is the sole truth about this world
    and life, and believers have the responsibility to spread it worldwide; at the
    same time, it vigorously excludes other religions, including internal opponents,
    regarding them as heresies instigated by the devil. When Western modern science,
    such as Copernican astronomy, appeared, it was once severely persecuted by the
    Catholic Church, and Bruno was even burned at the stake for it; but when this
    science and technology attained the ruling position of the Catholic Church in
    those days, certain people, especially some philosophers and even politicians,
    played the roles of church priests or inquisitors, proclaiming the monopoly of
    high technology on truth, and the inferiority, falsity (pseudoscience), and harmfulness
    of those alternative technologies different from it. In the words of the *Old
    Testament*, they defend "a jealous God" (*Old Testament, Exodus*, 20:5), who will
    absolutely not tolerate believers simultaneously believing in other gods or substitutes.
    In short, although the specific propositions of these high-tech worshippers differ
    from or even oppose those of the Catholic Church, their mode of thinking is consistent:
    both are self-exclusive, binary, and fight to the death. Some historians of science
    have also argued with evidence that there is some intrinsic relationship between
    the emergence of Western modern science and Western religion.![](img/#part0005.html#note23n)


    Some may say that the essence of science and religion is different; science can
    be empirically verified, thereby benefiting humanity, but religion cannot. Religion
    might retort: scientific discoveries are only (temporarily) verified as effective
    in certain fields, but in those matters concerning the great issues of life, such
    as the acquisition of life''s meaning, the value basis for making major decisions,
    the reconstruction of confidence after repeated setbacks, scientific doctrines
    are ineffective, while the truth of religion has been verified by countless life
    experiences.


    The history of science shows that the scientific truth of one era may be corrected
    by new discoveries of a later era, or even overturned in certain key aspects,
    such as Newtonian mechanics being corrected by relativity, the setting of flat
    space being overturned. Certain discoveries of quantum mechanics even subverted
    multiple previous scientific truths, which even Einstein could not accept at the
    time. This shows that the so-called truth grasped through high technology is not
    truth in the absolute sense (if that means complete conformity with reality and
    thus bringing happiness to life), but merely some knowledge and techniques that
    enhance the power of the holder of high technology. Therefore, what high-tech
    worship truly worships is not truth, but power, and moreover ever-increasing power,
    because high technology is actually technology that is never high enough and must
    always be higher.


    ### Why Can High Technology Achieve Such Outstanding Results?


    According to currently prevailing standards of measurement, relative to the technologies
    of other civilizations and cultures, high technology has achieved more remarkable
    achievements. What is the reason? As mentioned earlier, high technology operates
    through the combination of scientific hypotheses and experimental testing, and
    the spirit of Western formalized mathematics permeates the scientific hypotheses.
    The so-called experimental testing in experience, and even scientific hypotheses
    in a certain sense, are implemented and proposed by all kinds of technologies;
    only the "Western mathematical factor" in the hypotheses is unique to high technology.
    The "mathematical factor"![](img/#part0005.html#note24n) refers to the structure
    of a formalized game that allows one to play with oneself (there are always new
    combinatorial possibilities, and wins and losses can be adjudicated). Therefore,
    it possesses an inferential capability inherent in the form, allowing scientific
    hypotheses to extend preset tentacles beyond experience, such as conjecturing
    and calculating that there might be a planet in a certain place based on a certain
    gravitational anomaly, or deducing that light passing through a strong gravitational
    field will produce a certain angle of deflection based on certain theoretical
    presets. In this way, even if the results of later experiments are mostly not
    affirmative, overall, once the experiments guided by such hypotheses fit, the
    novelty and the depth of random triggering they achieve are unmatched by other
    types of experiments and empirical attempts. This mathematical factor profoundly
    influences the entire process of high-tech exploration; even in certain disciplines,
    such as biology and medicine in the 18th and 19th centuries, which could not yet
    fully embody mathematical form at the time. This is the pattern Kant spoke of:
    "man legislates for nature." Through the supposedly a priori valid mathematical
    forms and conceptualized causal reasoning, humans form scientific theories and
    experimental designs that can question nature with precise objectification; in
    repeated testing, theoretical correction, and even revolution, they rigorously
    cross-examine nature, forcing it to divulge secrets that would otherwise remain
    hidden in other circumstances. Therefore, scientific exploration and technological
    development in this research paradigm are not merely observation, induction, digestion,
    association, extraction, and even slow comprehension of experience (as in generalized
    natural history), but active and cruel (think of those experiments done on living
    animals) positioning and interrogation. Consequently, the results it obtains—whether
    positive or negative—are more prominent, fully objectified, endless (there is
    absolutely no saying of "resting in the highest good"), and astonishing (if not
    terrifying).


    ### The Limitations of High Technology and the Sleight of Hand of High-Tech Worship


    The above discussion lets us see that the terrifying innovative power of high
    technology is built upon its obsession. The mathematical factor is both ingenious
    and obsessive; it lets people see only the existence and value of that which stands
    out in form, and tends toward an `A∨￢A` (either A or not-A) binary selection architecture.
    Interrogating nature with scientific hypotheses plus radicalized experiments,
    and actually managing to extract answers, is of course a remarkable achievement,
    yet it violates common sense; the key here is still the mathematical factor. Mathematics,
    this seemingly narcissistic—intuitively self-evident purely formalized chess game—can
    reveal some key information about the vast universe and the myriad world; for
    the vision of daily experience, it is truly an inconceivable matter. The ancient
    Greek Pythagoras proposed "number is the origin of all things," but did not state
    a very pertinent reason. Kant gave a reason for this in the *Critique of Pure
    Reason*![](img/#part0005.html#note25n): mathematics is the expression of the pure
    forms of human sensible intuition (space and time), and humans can only cope with
    the world through this form, just like you are forever wearing a pair of tinted
    glasses. If there is a kind of knowledge, namely mathematics, that can display
    the internal structural mechanism of these glasses (first and foremost the lenses),
    then it will certainly be of great help for you to understand the secrets of the
    world, at least able to give important hints. Furthermore, this pure form of intuition,
    by combining the transcendental imagination![](img/#part0005.html#note26n) with
    concepts of the understanding, is more conducive to forming a priori anticipations
    or presentiments of the world. Unfortunately, Kant later felt that the central
    position of this transcendental imagination posed a threat to the formation of
    the doctrine of conceptualized reason or apperception, so he greatly lowered its
    status, to the point of blocking people''s in-depth discussion of it.![](img/#part0005.html#note27n)


