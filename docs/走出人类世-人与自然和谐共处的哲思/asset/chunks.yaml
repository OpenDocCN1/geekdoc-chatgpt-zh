    值得指出的是，一个人在遇到不得已的境况时，是能够感而应之以方法和策略的。真人不会滞于境遇，而会随遇而安，随机应变。这就是真人之德。[![](images/00007.png)](#part0008.html#note84n)


    也正因如此，后世的道家修行者奉守“我命由我不由天”的信条。恰是道家这种柔韧，给人以应对艰难困苦的心理和精神力量。这种柔韧是精神能量库，人们在遇到困难时能够从中汲取力量，从而支撑他们度过危机，不致迷路和崩溃。


    然而，这并不仅仅是一种心理和精神力量，更是要在日复一日的生活烦琐中将其付诸行动。对于庄子而言，在“不得已”的境况下，人仍然能够顺应自然规律，这正是“托不得已以养中”。[![](images/00007.png)](#part0008.html#note85n)


    “养中”这个概念有着多种不同的实施方法：养心、养气、养督。[![](images/00007.png)](#part0008.html#note86n)这些都是为了与无以逃避的生活境遇相斗争而采取的保护性措施，以表达柔韧的多面性特征。


    “养”这个字是一个关键性的道家观念，在中国思想中占有特殊的地位。哲学著作、自修手册、医学典籍、玄学著述、道家经书，全都重视这个观念以及与之相关的修为。它强调养生、养形、养性、养身、养志、养心和养神的原则。养，重在养的过程，它也包括多种多样的健康准则。它把健康视为一个可以储存在身体里的可量化目标，一个循序渐进的目标而不是一个概念性的目标。它包含着一种由心理—精神—情感等卫生标准规范过的日常生活方式。


    养中的第一方面是养心，是让心达到静、安、定、正、治、抟。这种心灵的境界是通过坐忘和心斋来实现的。[![](images/00007.png)](#part0008.html#note87n)在第二章里，《庄子》细致地描述了坐忘和心斋，两者都能达到抑制习性，即今天心理学所说的情感管理。从心理神经病学的角度来看，这乃是坐忘的核心之处。换句话说，这种修行不是消解意识，而是重建意识和改善心理的全面状态。


    坐忘的一种形式是让内在意识开拓一个平静的空间去尽情地冥想，从而最终体验到被治愈、被净化，达到灵性上的超越。它教导的呼吸法，是通过集中意念，以进入人最微妙的意识层面。这种锻炼是为了消除所有的感官觉知和意识评价，专注于态度和生活方式上的重在当下。这是在某种意识境界中才能达到的一种注意力的内在聚焦，在这样的境界中以自我为中心的忧虑和批判都被暂时放下，解脱了，以觉知到一种更深层、更微妙的意识流动。通过意识的引导让大脑进入休息，思想得到了寂静，正念的感觉得到了培植：从而达到了内在的和平、意识的清静和对自身、对世界的信任。


    养中的第二个方面是养气。庄子提到了一个重要的梳理气的术语，吐纳，或者更确切地说，是吐故纳新。对于生命能量之流动——即气在人体组织中的这种导引和提纯，将身与意从“动浊”中抽离出来，进入“静清”的境界[![](images/00007.png)](#part0008.html#note88n)。这样，人就达到了与自然合一，即通过让身体获得充满宇宙之气而体现道。《庄子》中讲到导气大师壶子的故事：他将自己的气融于地之律动，然后又合于天之律动，最终归于道，从而达到全然的解脱。《庄子》另一章中说：“吹响呼吸，吐故纳新，熊经鸟申，为寿而已矣。此导引之士，养形之人，彭祖寿考者之所好也。”


    这类养气的修行消解了弥留的身心二元观，解放了身体——我们血肉之躯的活化身，从而让它能够选择、思考、拥有自己的智慧。


    养中的第三个方面是养督。在《庄子·养生主》一篇中，庄子提到了督，提到人类扩展自己的生命是通过“保身”“全生”“养亲”“尽年”。庄子所追求的，是经由延年益寿的修炼，将短暂出现的清净转化成持之以恒的日常生活方式。这就涉及从我们全方位的存在去体验世界，而不只是从意识层面去体验世界，让身体从现实中得到滋养，而不仅仅停留在概念上的理解和争辩。


    颇为典型的是，早期道家经文都在讨论这种身的转化，而身体的能量是用“寿”或“长生”这样的修辞来表达的，这些词语所指的都是转化身体的能力，使身体能够承受变化和时间之变迁而不消散身体之能量。这种表述揭示出长寿从来不是孤立的、只顾保命而不顾其他的目标。相反，长寿在于日常生活实践，乃至一种生活方式。只有那活力充盈的身体才能够体现道，而生机勃勃的身体给予人的，绝不仅仅是长寿而已。这种保养身体并返老还童的循环在《黄帝内经》里得到详述。当被问及人为何短寿时，岐伯说，只有那些知“道”者才能得享长命百岁，因为他们能够“法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱”。


    应对日常事务和平时做出决定的最常见方法都涉及遵循历法和遵守行为规范和准则。这些要求都清楚表明了饮食得当、睡眠充足等简单日常规律的价值，而其他的历法则用顺应自然秩序来规范人们的生活程序。这些方法也都涉及自然四季的秩序和人类生活规律之间的互动和依赖性，其作用是帮助人决定日复一日的岁月流转中怎样去选择。不过，历法对于不可预测的突发性（非循环性、非规律性）变化不予解释，亦不对突如其来的死亡、疾病、不幸和灾难等命运之转变说明原因。庄子的养中程序，却是为了应对变化、命运，以及那些莫不可测之事，把握新出现的机遇，做出最佳的选择。


    ## 结语


    在这些天下瞬息万变的日子里，尽管许多事仍然暧昧不明，但是有一点很清楚：新冠肺炎疫情是“大加速器”，它突然将我们从旧惯性中推进到了新纪元。关于不确定性原理的常见定义是：“（对于位置和动量而言的）不确定性原理认为，一个物理系统的位置和动量的数值不可同时被确定。相反，这些数量只能带着某种典型的‘不确定性’来予以认定，而这些‘不确定性’是不能随机地同时变小的。”[![](images/00007.png)](#part0008.html#note89n)本文将当下这变化时刻视为一个突然发生的、应该抓住的悟道之机。疫情将这世界带入了一个道的时刻，在这个时刻，我们能够学习道、欣赏道和践行道。本文提出了创建新轨道的三大基础，以此来说明应对无常之世事的庄子之道的有效性和可行性。


    我们都希望全球的科学家和全世界的政治领袖能团结一心，找到最有效的方法和途径应对这次全球疫情。与此同时，我们不能只是坐等其变。我们应该带着一定量的自我警觉面对这世界的挑战，也就是庄子所说的“慎其独”。疫情逼迫着我们在想方设法把日子过下去的过程中，与删繁就简的生存之事做斗争，自己做饭，自己打扫居室，自己给自己理发。这就是生命之简约吧！这种暂停是建设性的，它让我们以此为契机，明察而清晰地反思我们的生命和存在中最平实和最简单的事情是什么。更重要的是，它召唤我们过一种简单的、喜乐的生活。愿我们的品格像足球一样皮实：白天它被踢得翻来滚去，晚上依旧能够圆满充盈。这就是庄子所说的道枢。


    庄子的认识论立场是透过二元对立洞察一元本真，透过表象看见精微，透过“多”看见“合”，他是通过越虚就实完成的。例如，如果有人认为涂口红会让她在公共场合更有自信的话，那么在公共场合戴遮面的口罩会让她有机会从其他渠道找到自信。庄子所培养的是这样一种能力：把显而易见的不幸境况转化为种植一种新的生命果实的沃土。


    在道家的教谕中，仅有理解，或者说仅拥有一种恰当的视角，尚不完善，或者说尚有不足。一定要达到“养身”和“养心”才行，这种养的指向是要遵循一种修身之法，因为这才是一种践行道的生活。庄子对此有着完美的表述：“知其所以然而不知其然。”这种循序渐进地趋向于知，体现在整个道家的理论与实践中。


    新冠肺炎疫情危机的波及范围如此之大，它影响了地球上的每个人，这必然将给人们的生活带来改变。全世界的人都要在过去和未来之间进行权衡，在种种相争互斗的利益和观念之间取舍。让我们以庄子的建议作为此文的结语吧：“汝游心于淡，合气于漠，顺物自然，而无容私焉，而天下治矣。”（《庄子·应帝王第七》）这引导着那无可预见亦无可避免的不得以变成这世界新可能性出现的条件，变成存在之新维度出现的条件。现实——万物存在和万物何以演化的现实，在决定我们如何予以应对，而随机应变、为我所用，总是胜过为其所限、陷于其中。司马承祯在其《坐忘论》中称：“是故于生无所要用者，并须去之；于生之用有余者，亦须舍之。……况背道德，忽性命，而从非要，以自促伐者乎？”


    （本文由潘紫径翻译）


