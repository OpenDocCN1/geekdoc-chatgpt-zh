- raw: "### 高科技如何能转变为适度科技？[![](images/00007.png)](#part0005.html#note46n)\n\n什么是“适度科技”（appropriate\
    \ science-technology）？从根本上说来，适度科技就是最适于地方社团乃至整个人类的总体生存的科技。讲得更清楚一些就是，从时间角度看，这种科技让人们可以最佳地结合当下急需和长远未来的利益；从方法上看，它既可以是对象化的，又可以是非对象化的；从它促成的生活质量上看，它使人们能够将安全与舒适、物质（生理）与精神、保守与进取（或传统与创新）、简朴与丰富、自然与人为等，最大限度地相互嵌入和糅合起来，从而体验到一种美好的生活。比如，造就都江堰水利工程的思想和技术，就是适度科技；《农政全书》《天工开物》《黄帝内经》《伤寒论》《本草纲目》中的许多技术和知识，如果结合地方实际情况运用，也是适度科技。从以上的讨论可知，高科技本身并不是适度科技，它并不能给我们带来这样的生活，反而由于它的某些特点，尤其是高科技崇拜，会让我们丧失这种生活的可能性。\n\
    \n以上还讲到，高科技有其强大之处，但也有其无能和危险之处，如果能够善用之，则会参与适度技术的构成，造福于人。但要善用它，首先就要破除高科技崇拜，让别的科技平等地参与进来，这样才能弥补它的缺失，克制它的毒性，就像中医方剂让不同性质的药材（有的单用时有毒）相互生克，从而达到最佳效果。然而，“平等”这一条，在高科技崇拜流行的时代是很难实现的。这次疫情防控中，无论是国际还是国内，对于中医的怀疑、误解、否定和抹黑一直大量存在。只是由于中医这20年来在抗疫中的出色表现，这次中医更多地介入了主流诊治。但按张伯礼的已经很温和的判断，相比于“非典”，“中医药介入（虽）已明显提前，但提前量仍有不足（以上一条引文言及，2月初中药使用率只有30%）。同时，虽然有了中医定点医院，但数量及床位仍较少，缺乏系统全面的中医诊疗体系”[![](images/00007.png)](#part0005.html#note47n)。要知道，中医在近现代遭受了深重的歧视和来自知识界主流的抹黑，险些像它在日本的命运那样，被完全取缔，[![](images/00007.png)](#part0005.html#note48n)后来又被迫进行“一边倒”的中西医结合，由此导致了中医药总体上更趋于弱势。中医在国家医疗事业中占有的资源和比重，乃至享有的容错空间，与高科技医学相比，差距极大。造成这种不公正也不科学的状况的主要原因之一，就是高科技崇拜。所以，要恢复中医乃至各种当代还有益的传统科技，比如传统的天文学、数学、农学、绿色耕作法、传统手艺、食品加工、纺织布艺、金属冶炼及加工的元气，让它在未来发挥更大作用，就必须首先深刻反省这种崇拜的谬误，去除高科技及其意识形态一家独霸和排斥异己的恶习，让“和而不同”的思想和实践不打折扣地进入科技界。\n\
    \n当然，这些传统科技的复兴不只是复旧，而是要相互借鉴，包括适度地吸收高科技的某些方法和技术，以创造出特别能适应当下和未来的适度技术。中医要选择性地汲取西医的某些东西，如对人体的解剖知识和药材的微观认识，技术上更是可借鉴许多（如手术、治牙、注射、生命支持术等），但这绝不等于20世纪推行的“中医科学化”“中药有效成分化”，因为那样会使中医和类似的传统科技丧失自己的思想生命。“适度地吸收”意味着既要向高科技开放，又绝不能开放得被打散、被收编，而是要保持自己的研究范式，也就是自身的哲理、理论、话语、方法、实验的完整独立性，由此而具有自主选择权，也就是由自己来决定吸收什么，不吸收什么，乃至抵制什么，绝不能“被吸收”，即被强迫着吸收那些足以扼杀自身范式的东西，比如用高科技的组织解剖化人体理论来代替阴阳五行、运气经络的理论，用CT（电子计算机断层扫描）等对象化诊断方式来顶替望闻问切的传统方式，完全用西式大学和西式医学界的方式来教育、培训和鉴定中医师。\n\
    \n而且，一个社团或一个国家乃至人类共同体，要有选择使用何种科技或何项具体科技的能力和权利。它们不能被高科技崇拜绑架，不能一看到能提高人对自然和他人控制力的高科技新产品，就觉得采用它们是硬道理，就像电脑、手机、应用软件和网络的不断升级似乎是逼迫人接受的硬道理一样。要设立“科技反垄断法”，消除和避免某一种科技独霸所有研究资源和思想空间的状况，其中要包括旨在阻断部分科技研究与商业利益串通一气的条款。人们要通过这种以及相关的一系列措施，逐步改变社会和政治单位的科技态度，也就是从高科技崇拜转变到科技多元和适度科技的生存策略和发展道路上来。\n\
    \n在建立有科技选择力的社团方面，北美洲的阿米什人迈出了可贵的一步。[![](images/00007.png)](#part0005.html#note49n)他们为了维护自己的信仰和家庭完整性，毅然拒绝许多高科技，比如汽车、电话、电视、电网、拖拉机等，至今还身着古式服装，驾马车出行，用畜力拉犁，手工制造服装、布艺和木器，由此而保障自己社团的互助互爱，赢得了社团中年轻人的心。所以，与几乎所有20世纪以来研究者的预言相左，这种“逆高科技崇拜的历史潮流而动”的阿米什人的社团不但没有消亡，反而有了可观的发展。比如，其人数从20世纪初的数千人扩展到这些年的近30万人。而且，他们并不是完全拒绝新科技，而是接受其中少许于己无害的科技，比如有机农业、依次分块牧养牲畜、温室培育等，或将一些利大于弊的科技，如低级电脑，经过改造（不允许电脑上网和玩电子游戏）后为我所用；在必要时，如某种加工需要时，使用非电网的自产电力。不过，由于他们缺少自己的比较成熟的科技范式，所以选择、改造和创造新技术的能力和信心还不够强。在笔者看来，他们拒绝的高科技似乎多了些，改造的方式少了些。如果他们有自己的科研机构和科技人员团体，各个居住区之间多一些联系，则在抵御高科技崇拜、驯化某些高科技和创造自己的合用科技方面，会更有成就。这样就更有可能赢得稳定的适度科技，也就更利于自家社团的长治久安。\n\
    \n总而言之，高科技可以被改造为适度科技，前提是要打破高科技崇拜，调整我们的经济和社团的运作方式，乃至主流价值观，不再将争夺强力当作头等大事，而是将真实的——全生态的、伦理的和生活意义的可持续生存摆在首位。这样一来，其他的科技，特别是那些有着悠久文明传承的、被证明利于长久生存的绿色宜人的科技，就能够获得它们应有的地位和存在空间。这次还在进行之中的新冠肺炎疫情进一步提醒我们，科技的多元化和适度化，对于中华民族乃至人类的长远生存，是必要的和急需的。\n\
    \n1.  本文初稿写于2020年3月。同年7月下旬及2021年3月做了少量修改。此文与笔者的另一篇文章《适生科技与高科技》有部分内容重合。\n\n2. \
    \ 使现代人类，尤其是经济发达国家民众的平均寿命延长的原因，除了高科技医学外还有许多，比如生活条件（食品、住房、环境、教育）的改善，闲暇时间增多，养生知识和实践在一定程度上被普及，战争减少。\n\
    \n3.  非西方文明或文化中产生的关于自然的知识，比如中医、藏医、古巴比伦和古埃及的天文学，是否可被称为“科学”，这是个有争议的问题。本文为了行文方便，也基于作者的相关认识，对此问题持肯定的答案和态度。所以，我们可以说“古代中国的科技”“印第安人的科技”等。当然，它们有别于“高科技”。\n\
