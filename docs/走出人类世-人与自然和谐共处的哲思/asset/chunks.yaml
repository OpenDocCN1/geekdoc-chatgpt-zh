- raw: "虽然这听起来很恐怖，很令人畏惧，但是借着空法，我们觉悟到我们与万物之间那动态进化的相互依存，这空法确是令人解脱的。在《心经》里，我们得到的教导是“无挂碍故，无有恐怖”，所以我们不必害怕。恐惧和创伤把我们挤压到最小，把我们封锁到一个局促的、固定的、静止的自我中，但是空性能打开我们，让我们向所有人和所有事物开放。\n\
    \n从某种意义上讲，这是要在世界形势凸显出我们的渺小的当下，唤醒我们的伟大。但是，伟大的意思，并非是指自我膨胀。我们的意思不是虚荣，不是认为有些人比其他人更好，或我们人类比其他物种更有价值。我们的意思确实是让你自己变得更大、更强。我们的意思不是增长所谓的“伟人”遗风。自我的伟大与否完全在于清空了什么，随着幻觉的消失，意的障碍也就消除了。其目的是要克服那分裂的、好斗的、不断为自己争取幸福和愚蠢的权利的自我所产生的虚妄。其目的是要唤醒那个伟大的、使我们和万物相互依存的自我。\n\
    \n道元禅师在对典座（寺院炊事僧）的宣讲中，遵循传统（包含道家），说到了大心或妙心的培养，说大心“如大山大海，无偏颇争斗意”。它大过我们对幸福的执着，包括我们对个人的伟大的执迷。道元建议大家学习“大”这个字，其形象好像一个伸出手臂拥抱的人。相比之下，“小”这个字就像一个双臂下垂、不再拥抱外界的人。“你们应知晓从前的伟大导师都学习过大字，现在都自在地发出大声，解说大意，澄清大事，引导大人，成就大业。”[![](images/00007.png)](#part0009.html#note93n)\n\
    \n我们现在正面临一种意义上的大危机：我们的挑战是巨大的，令人望而生畏的。但这同时也是机遇，让我们用更深层意义上的“大”来做出反应：去拥抱我们与一切众生相互依存的完满性。我们不需借金钱的力量左右他人和世界，使其服从我们的意志，我们也不需要“抽离”，人为地麻木我们的意识，否则便无法应对这不可忍受的世界。敞开自己，拥抱“另有”的合理的人类生活之道，就是觉悟到我们的“大”。\n\
    \n（本文由潘紫径翻译）\n\n1.  WHALEN P. Scenes of Life at the Capital［M］. Bolinas, CA: Grey\
    \ Fox Press, 1971: 9.\n\n2.  TANAHASHI K, ed. Treasury of the True Dharma Eye［M］.\
    \ Boston and London: Shambhala, 2010: 222.\n\n3.  DOSTOEVSKY F. Notes from Underground［M］.\
    \ PEVEAR R,VOLOKHONSKY L, trans. New York: Alfred A. Knopf, 1993: 24.\n\n4.  LEIGHTON\
    \ T D, ed. Dōgen’s Pure Standards for the Zen Community:A Translation of Eihei\
    \ Shingi［M］. LEIGHTON T D, OKUMURA S,trans. Albany: State University of New York\
    \ Press, 1996: 49.\n\n# 致谢\n\n2020年3月初，新冠肺炎疫情刚开始在美国全面暴发，我的同事托比·李思找到我，希望就疫情这个机缘，组织几位中西学者、思想者写写疫情引发的深层次思考，有份杂志会感兴趣刊载。我们一拍即合，马上开始组织安排。后来和那份杂志的合作生了些变故，但我觉得还是有必要把这件有意义的事情做下去。之后，我和挚友史旻、中信出版社出版人刘丹妮、加利福尼亚州洛杉矶罗耀拉大学哲学系教授王蓉蓉老师进行了多次讨论，编辑这本书的想法就此成形。在此，对于各位师友给予的启发、呼应和鼓励，我表示由衷的感谢。\n\
    \n这虽然是一本“应景”的小书，但参与写作的老师们挑战了许多我们习以为常或奉为圭臬的理念和实践，提出了令人深思甚至颠覆性的问题和思考。或许我们以前听过、看过其中很多观点和论述，但往往把它们当作知识理解了以后就束之高阁，并没有把这些问题、思考与我们的生命、生活关联和贯穿起来。全球新冠肺炎疫情或许是个“梦醒时分”。参与写作的老师们为世人“敲更鸣钟”，他们的高识远见、责任与担当让我敬佩并心怀感激。\n\
    \n我在此还要特别感谢龚隽、张祥龙、蒋劲松、潘涛几位老师在审稿方面给予的支持和建议。中信出版社的编辑更是不辞辛苦，反复审稿，提出了许多宝贵而又有创意的想法。赵汀阳老师充满趣味和睿智的漫画在给读者带来深思或会心一笑的同时，也给我们这本小书添色增彩。\n\
    \n最后，这本书得以成形还离不开北京大学博古睿研究中心同事们的帮助和耐心。尤其感谢田馨媛同学，她勤勤恳恳、极富耐心地做了所有初期的编辑、协调、脚注查找工作。\n\
    \n当然，一切错误和肤浅之处都是因为我的疏漏与才学粗浅，望读者海涵！\n\n宋冰  \n\n2021年4月于北京上第摩码园"
