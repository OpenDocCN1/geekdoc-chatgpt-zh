    \n9.  陈徽 .庄子的“不得已”之说及其思想的入世性［J］. 复旦学报（社会科学版），2019，3：3—9.《庚桑楚》云：“动以不得已之谓德。”此之所谓“不得已”，曰不得止，即不得不行也，事物之来，应感而发，不可以已；应而自然，无有勉强，亦无有造作。此义之“不得已”乃真人德（即“体”）之发用，只有修得真人之德，方能在应事接物中表现为“不得已”之功。圣人与真人未尝为二：真人以德言，圣人以功论。有此德方能致此功，有此功亦方能彰此德。故《大宗师》合真人、圣人于一体。\n\
