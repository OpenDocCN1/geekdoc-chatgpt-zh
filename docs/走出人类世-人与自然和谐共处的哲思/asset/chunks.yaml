    \n     原话是这样说的：“要观天地之象，观万物生灵之象，观疾病健康之象，所以今年大江以南，暴雨成灾，厥阴风木司天已经描述了太虚元象，上半年是比较和缓的，下半年特别是在冬至前后，也就是连续到明年的春季，要有温疫发生。”\n\
