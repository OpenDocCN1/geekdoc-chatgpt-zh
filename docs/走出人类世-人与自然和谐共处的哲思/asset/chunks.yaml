    # Viruses, Nature, and Politics: Viewing the Microbial World from COVID-19


    This is not a one-off event. It happens again and again.


    Viruses possess enormous power to drive change. Due to their ability to spread,
    mutate, and recombine across species, and to pick up and transfer genetic material
    between cells, they have made extraordinary contributions to the evolution of
    cellular life. Without viruses, mammals could not have evolved; without viral
    DNA in our genome, the human organism could not develop, and our organs could
    not possess their current functions.


    If the zoonotic level shows that we are animals among animals, thereby eliminating
    the difference between us and nature, then the genetic level regards us as accidental
    products of cellular evolution in the viral world, thereby eliminating the difference
    between us and nature. The 8% viral DNA we possess clearly shows that the history
    of our genome predates the history of the human species by hundreds of millions
    of years. And the COVID-19 pandemic clearly shows that this evolution is happening
    right now.


    The third level is to view us as one ecosystem among many. When individual eukaryotic
    cells evolved into the earliest multicellular organisms through fusion, they existed
    in a sea of microbes. These early multicellular organisms were extremely dependent
    on surrounding bacteria and viruses. In fact, they integrated bacteria and viruses
    into their own cellular components and tasked them with overseeing cellular self-maintenance.
    Bacteria provided metabolic functions, while viruses regulated resident bacteria
    by killing off populations that might overgrow and become superfluous.


    Time hasn''t changed things much. Every known existing organism harbors microbes
    (bacteria, archaea, fungi, and viruses) within its body. Without them, organisms
    cannot survive, nor maintain normal functions. We humans are no exception. Every
    organ system in the human body relies on bacterial metabolites—our health depends
    entirely on the viruses that regulate these flora.


    Surprisingly, this regulatory role of viruses is not unique to humans. In all
    known ecosystems, one can observe viruses maintaining ecosystem function and regulating
    biodiversity by killing off excess populations. In fact, humans first discovered
    and began studying this regulatory role of viruses in ponds; later, this role
    was confirmed in studies of the human gut.


    Let us consider: for a virus, the human gut is one pond among many. Some ponds
    are located in tropical rainforests, grasslands, or city centers, but the human
    pond is located within *Homo sapiens*. Viruses make us understand that we humans
    are merely one multi-species ecosystem among many—one pond among many. All systems
    are regulated by viruses.


    There are many other levels; perhaps the most thought-provoking is how viruses
    regulating the carbon cycle eliminate the difference between us and the biosphere.
    But let us stop here and summarize the basic features of the world manifested
    in COVID-19.


    > 1. All life exists in viral clouds inside and outside cells.

    >

    > 2. We humans have a long shared history with viruses (and other microbes). They
    shaped us, are part of our bodies, and we cannot be distinguished from them.

    >

    > 3. We are microbes—members of a multi-species assemblage in the viral world.
    We interweave and permeate each other, inseparable.


    The difference in the understanding of the world implicit in the modern political
    configuration could not be more obvious. In fact, the movement of the virus—likely
    from bats to pangolins to humans—renders the modern political view (and its clear
    distinction between human affairs, natural affairs, and technical or artificial
    affairs) incredible and untenable.


    Faced with this situation, what should we do?


    ## Humans, Nature, Technology


    Let us begin by redefining the concepts of humans, nature, and technology.


    For Hobbes and his modern followers, nature is the "outside world," i.e., the
    non-human world, the world of animals. Animals are considered beasts. They are
    said to lack reason, dominated by unconstrained self-interest and immediate physical
    passions (hunger, sex, etc.). Therefore, nature is thought to be in a constant
    state of war, a realm full of fear, distrust, loneliness, and death.


    Hobbes and his followers occasionally describe animals as automata acting mechanically,
    implying they are living machines with instincts but essentially no intelligence.
    Especially after the emergence of the philosophy of history, they also describe
    nature as an origin to which we once belonged but have since become alienated.
    They lament the lost primitive wisdom with romantic sentiment.


    Nature derived from viruses is clearly not like this. First, nature is no longer
    that "outside" non-human world. On the contrary, it encompasses everything. Nothing
    can be above, transcend, or lie outside nature. All things, including human affairs,
    are part of it. Since nature is no longer that "outside" world, the difference
    between humans and animals disappears.


    For viruses, the first important feature of nature is interconnectedness. All
    organisms are inextricably interwoven with each other and with the biosphere.
    In fact, it is difficult to draw a clear boundary between an organism and the
    ecosystem it inhabits, as if the organism''s outline is blurred, as if they permeate
    the ecosystem. Thus, there is no difference between the organic individual and
    the ecosystem—they employ the same rules of self-maintenance.


    The second important feature of nature is the close relationship between collaboration
    and change. All life forms are (to varying degrees) multi-species collaborations
    linked by deep evolutionary history: collaboration between organisms, bacteria,
    and viruses; between different kinds of cellular and non-cellular life. Organisms
    provide habitats for bacteria and viruses; bacteria provide metabolic functions
    for organisms; and viruses are the regulators of the entire collaborative arrangement.
    This is a world of stable collaboration, and a world of change. In fact, change
    is a key factor of collaboration. Through inter-cellular gene exchange and inserting
    themselves into genomes, viruses enable specific multi-species organisms to adapt
    to new environments, thereby continuing to co-evolve. The idea that there is no
    competition in nature is, of course, naive. But surprisingly, the evolution of
    life seems to originate from collaboration—symbiosis—rather than struggle or competition.


    From COVID-19, we can see the third and final important feature of nature: it
    suddenly becomes a realm filled with pure infinite possibilities. At all times,
    nature''s possibilities are far richer than reality. Possible life forms far outnumber
    currently existing ones—any known life form is always and perhaps forever transient,
    a speck of dust in the river of time.


    The view of nature derived from COVID-19 renders the philosophy of history indefensible—history
    is viewed as strictly human events, progressing in a process of strict separation
    from nature. Humans themselves—separated from nature, independent, living in their
    own non-natural (artificial) environment—cannot self-maintain. No one can do without
    the bacteria, fungi, and viruses living in and on the human body. If nature is
    no longer that "outside" origin, then the concept of the primitive opposed to
    the modern disappears, and the logic of colonialism ceases to exist.


    In fact, the patterns linking the human organism—various molecular mechanisms—predate
    human evolution by hundreds of millions of years. For example, the invention of
    some signal transduction pathways between different species that we rely on was
    inspired by early multicellular organisms living in primordial oceans. Talking
    about humans like modernists is like putting wild organisms in a petri dish, adding
    bleach and antibiotics until more than half die, then celebrating the barely surviving
    part as "human". To put it sharply, humans are a sterile abstraction, a fantasized
    state of harmony.


    The challenge arising here is to understand that humans exist *within* nature,
    not outside it. Take reason, for example. If reason cannot be separated from the
    brain or neurons, and if brains and neurons could not have evolved and developed
    without viruses and our 8% viral DNA, what does it mean to possess reason? If
    the mind cannot be separated from neurotransmitters (produced by bacteria in our
    gut), what does it mean to have a mind? This gut flora in turn depends on what
    food we eat, and where and how that food is produced.


    Or take technology, for example. Hobbes and his followers conceptualize technology
    as artificial things that do not exist in nature. The implicit assumption here
    is that nature is stable and lacks innovation. However, when viewing nature from
    an evolutionary perspective, what becomes of innovation? That is, when nature
    is no longer that stable "outside" background but appears before humans as evolutionary
    innovations of new mechanisms, forms, and processes, what becomes of innovation?
    Seen this way, human technological innovation seems merely a form of biological
    organisms adapting to or modifying their environment, on a planet where various
    constantly evolving biological organisms exist. In principle, there is no difference
    between technological innovation and biological innovation.


    We can go further: once we recognize that some of the most advanced technologies,
    such as antibiotics, plasmids, or gene editing technologies, are actually inventions
    of microbes, not humans, what becomes of technology?


    COVID-19 allows us to view humans as a subject from the perspective of nature—a
    nature radically different from the view of nature at the core of modern society.


    This challenge is attractive because there are so many concepts that need rethinking.


    Then, how should we view modern politics?


    ## The Limitations of Modern Politics


    From the perspective opened up by COVID-19, modern politics appears to be a tool
    invented to defend the illusion that "humans possess independence." Essentially,
    modern politics has become a "machine for distinguishing (humans)."


    Through current reactions to COVID-19, we can understand this machine in operation.
    Politicians, policymakers, and media agree that this virus is a threat from nature,
    from that "outside world."


    Once the boundary between nature and humans blurs, danger can appear at any moment.
    Humans exposed to nature face the risk of blurred outlines, merging with nature
    (indifferentiation), falling into a "state of war" (the state described by Hobbes
    as full of "fear, poverty, nastiness, solitude, brutishness, ignorance, cruelty").


    A key factor in this practice of dividing humans and nature into two distinct
    realms (called the echo of the philosophy of history) is that people view those
    whose lifestyles remain close to animals with suspicion or even disdain, believing
    they have "not yet" successfully escaped nature, and thus belong more to that
    "outside world" than to "this world," as if they remain stuck in a past that civilized
    humans or states have long left behind.


    Modern political practice needs to protect humans from nature''s encroachment.
    The forms taken so far are, on one hand, shelter-in-place policies, requiring
    people to stay home and not "go out"; on the other hand, closing borders to keep
    out nature''s invaders—viruses, outsiders, animals. Usually, the latter implies
    that the national society is a quasi-organism. It blurs the biological language
    of the 1930s with political language, as if the basis of political self-construction
    is the act of separating the non-self from the self.


    From the perspective of the view of nature derived from COVID-19, distinguishing
    humans from nature, or separating non-self from self, appears to be an act of
    arbitrary violence. If nature encompasses everything, if human independence is
    an illusion, then neither the claim that the virus is in that "outside world"
    nor the accusation against those retaining primitive lifestyles makes any sense.
    Thus, the immunopolitics of the nation-state becomes fundamentally untenable.
    Its basis is a misunderstanding of the organism and the immune system. Its basis
    is also a misunderstanding of the organism, assuming the organism is an independent
    and discrete object—bacteria and viruses as a non-self, not belonging to the organism.
    Its basis is a misunderstanding of the immune system, implying it is a self/non-self
    recognition system, hence a war machine constantly busy separating non-self from
    self.


    In fact, no organism can completely separate from nature as this notion implies.
    The so-called non-self of the past—bacteria and viruses—are indispensable parts
    of the self. In fact, contemporary immunologists describe the immune system as
    the joint management system of this multi-species assemblage of ours.


    Let me clarify: I am not advocating herd immunity or premature lifting of shelter-in-place
    orders, nor am I opposed to science and technology. On the contrary, I believe
    the more technology, the better.


    What I want to say is that, by practicing a politics of differentiation based
    on maintaining and defending an illusory view of humans, we have damaged the Earth
    (and ourselves as an inseparable part of it). I believe we have no choice but
    to propose a new human essence, lifestyle, technological practice, and political
    practice.


    ## The Microbial World: Politics from a Non-Human Perspective


    Currently, two competing strategies respond to this challenge.


    The first response suggests extending the political view to nature. I consider
    this response the most failed. It merely extends human responsibility for the
    human realm to the natural realm, rather than rethinking the concept of the human
    from the perspective of multi-species nature. It fundamentally adheres to the
    modern view that humans are above or beyond nature, still separating humans and
    nature, because technology is understood as artificial things. It holds that nature
    will only become part of the human realm, a situation called the decline of the
    external world, the complete humanization of nature and Earth.


    The second response adopts an inversion, stemming from the flaw implicit in the
    term Anthropocene. The Anthropocene refers to a new geological epoch characterized
    by human impact on Earth and its feedback systems. The term Anthropocene implies
    a moral condemnation: human impact on all Earth''s ecosystems is so great that
    human activity can be seen in geochemistry; this is shameful. Arguably, the normative
    implication of this discourse is that humans and nature should be completely separated.
    Therefore, the appropriate response is to protect nature as that "outside world,"
    protecting the non-human from human harm.


    Conceptually, both responses are childish; they still adhere to the Hobbesian
    modern view of humans and nature, thus merely redescribing the problems they need
    to solve.


    Exploring viruses from philosophical and poetic perspectives yields a completely
    different answer. I call it the politics of the Microbiocene.


    What does the Microbiocene mean here? It refers to viewing the world from the
    perspective of viruses.


    For billions of years, bacteria, viruses, fungi, and archaea were the only living
    inhabitants of Earth. They occupied every ocean, river, and lake, every inch of
    land and air. They drove the chemical reactions that created the biosphere, thereby
    creating conditions for the evolution of multicellular life. Bacteria produced
    the oxygen we breathe, the soil we cultivate, and the food webs that sustain the
    oceans. Viruses periodically kill vast numbers of bacteria, thereby regulating
    the biogeochemical cycles on which all life depends. Microbes invented the feedback
    systems supporting all life on Earth, creating all past and present life forms.
    All organisms in history originate from bacteria and viruses: all organisms, including
    us humans, are inextricably intertwined with and dependent on them.


    From this perspective, we absolutely do not live in the Anthropocene, but in the
    Microbiocene; it is not that the boundary between humans and nature becomes blurred
    as the term Anthropocene implies. Sadly, we humans have still not learned to think
    of ourselves from the perspective of the microbial (i.e., viral) world, even though
    we are precisely a part of this world.


    If politics is the study of forms of symbiosis, especially the effort to find
    a good form of symbiosis, then we have much work to do. We must compare various
    forms of symbiosis—prokaryotes and eukaryotes, organisms and viruses, mycelia
    and trees, in ponds and guts, in caves and forests, in lungs and rivers. Then,
    based on these studies, we must find political forms that can achieve the flourishing
    of both humans and non-humans.


    ## Action Plan


    If we formalize the history of the view of humans appearing in this text, we can
    derive the following summary.


    In the longest period of history, we humans lived in a God-given or sacred natural
    cosmos; we were a part among parts. A profound and far-reaching transformation
    in the early 17th century made us leave that cosmos and enter the Human Age: we
    distinguished ourselves from nature, calling nature the "outside world," the realm
    of animals and irrationality; we tried to technologically widen the distance between
    ourselves and animals.


    Today, we face the challenge of leaving the Human Age and learning how to survive
    in the Microbiocene. Each age has its unique political system, unique mode of
    production, and unique view of technology.


    How can we learn to shed the modern notion that humans are more important than
    nature, and learn to clearly articulate from the perspective of the microbial
    planet we inhabit (of which we are a part) what humans are, how humans should
    live, practice technology, and practice politics? That is, how should we view
    the above issues from the perspective of the Microbiocene?


    Can we humans rethink ourselves from the perspective of the non-human world, because
    we are part of this world and inseparable from it? To do this, we must learn to
    objectify ourselves from the perspective of the Microbiocene; that is, strive
    to realize a concept of "we" centered on the Earth, not on race or species.


    In my view, this is a challenge, and the problem the Berggruen Institute''s Human
    Transformation Project aims to solve. We—we are inter-species connections—must
    invent new vocabulary to clarify what humans in nature are, learn to articulate
    and practice a global politics, find a path from the industrialization of nature
    (resource extraction) to the biologization of industry, and create the possibility
    of replacing artificial technology with biotechnology.


    If we succeed, then configurations like what we call COVID-19—possible configurations
    composed of viruses, bats, pangolins, and humans—will no longer be phenomena that
    irrationally deviate from the boundary between humans and nature. Such boundaries
    will cease to exist. We will become part of the "outside world."


    (Translated by Zhuge Wen)


    ---


    # After the Epidemic, Where Does Human Society Go?


    **Bai Shunong**


    ![](img/00017.jpeg) ![p052](img/00005.jpeg)


    Since January 23, 2020, when Chinese official media announced the implementation
    of the Wuhan "lockdown" measures to respond to the COVID-19 epidemic, human society
    has faced what is claimed to be the first "truly globalized" crisis in history.![](img/#part0004.html#note8n)
    As of the time of writing, statistics show that the global death toll from this
    epidemic has exceeded 580,000, and the economy has suffered a severe shock. Accompanying
    the epidemic, domestic contradictions in various countries have erupted frequently,
    such as the "Black Lives Matter" movement in the US; international relations,
    such as Sino-US relations and the relationship between the US and the WHO, have
    also undergone unexpected drastic changes. The entertainment industry, emblematic
    of social prosperity, has fallen into an unprecedented depression; personnel exchanges
    have sharply decreased; schools at all levels have closed campuses and switched
    to online teaching; large numbers of people have become unemployed. In addition,
    due to medical resources being crowded out by the epidemic and the implementation
    of isolation measures, many chronic patients face many extra difficulties in receiving
    necessary routine treatment. Some famous scholars and media figures lament that
    the world can never return to the pre-epidemic state.![](img/#part0004.html#note9n)


    This sudden upheaval has disrupted everyone''s lives. The familiar life order
    people once knew has been replaced by huge uncertain disorderly turmoil. No one
    knows what will happen tomorrow. People inevitably ask: why did all this happen?
    When will the epidemic and the social turmoil it triggered or accompanied finally
    end? If the world cannot return to the past after the epidemic ends, what will
    the world become?


    In fact, looking back at history, when has humanity ever truly lived in a state
    as calm as still water? Experience shows that the only constant in this world
    is "change." If we speak only of "change," the changes brought by the novel coronavirus
    are just another "change." Obviously, while admitting "change" is the only constant,
    people actually have certain expectations about the source, impact, and degree
    of "change." People hope "change" arises from human goodwill, brings more convenience
    to human life, and occurs at a level acceptable to the public.


    But this is merely human wishful thinking. The reality is that "change" can come
    not only from human goodwill, but also from any human motive beyond "goodwill,"
    and of course from changes in any entity existing elements![](img/#part0004.html#note10n)
    beyond human motives. Although the source of the novel coronavirus is still inconclusive,
    it is most likely a change in natural entity elements beyond any human motive.
    After all, humans seem powerful, capable of reaching the sky and entering the
    earth, omnipotent, but in the entire Earth''s biosphere, the variables humans
    can control, apart from machines they design themselves, are actually very limited—often
    they cannot even control their own will, nor explain how their will arises.


    From a biological perspective, humans are essentially and still a subsystem in
    the Earth''s biosphere. Based on the various experimental evidence we currently
    possess, the most fundamental difference between humans and other life subsystems,
    besides reproductive isolation from other species, is probably humans'' unique
    cognitive ability.


    Reproductive isolation is the universal boundary distinguishing species in the
    Earth''s biosphere. In other words, the ultimate criterion for distinguishing
    different species lies in whether reproductive isolation exists between different
    populations. Those with reproductive isolation are considered two species. This
    is a widely recognized criterion in animal taxonomy. Therefore, the distinction
    between humans and other organisms due to reproductive isolation is not unique
    to humans. However, the distinction between human cognitive ability and other
    organisms is, as far as we know, absent among other organisms. Without this cognitive
    ability, humans might still be surviving today like the other cousins left behind
    by their ancestors in Africa, as a link in the middle level of that region''s
    food network![](img/#part0004.html#note11n).


    However, for reasons still unknown, likely due to the emergence of new genes![](img/#part0004.html#note12n),
    humans acquired unique cognitive abilities. This ability not only helped humans
    walk out of Africa and traverse the world, but also helped humans independently
    form survival modes completely different from their cousins who stayed in Africa,
    through interactions with different local species—transitioning from the gathering-fishing-hunting
    mode once shared with other animals to an agricultural-pastoral mode.


    No one can clearly explain why humans transitioned from the gathering-fishing-hunting
    mode formed over hundreds of millions of years of evolution in the animal world
    to an agricultural-pastoral mode. But from what is currently observed in tribes
    retaining the foraging-hunting mode, such as the custom of taking pride in capturing
    strong leader animals, the transition to the agricultural-pastoral mode was likely
    a negative effect of humans improving hunting efficiency due to cognitive development:
    improved cognitive ability enhanced communication and tool use among population
    members, thereby changing the hunting mode—namely, by capturing strong leader
    animals to cause chaos in the prey population, thereby gaining more harvest.


