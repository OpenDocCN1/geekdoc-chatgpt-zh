    15.  摘自Stanford Encyclopedia in Philosophy。\n\n# 07  \n\n“冠状病毒经”：佛教反思大流行病中另有合理的人类生活之道\n\
    \n贾森·沃思\n\n![](images/00018.jpeg)![p184](images/00002.jpeg)\n\n眼看着我自己的国家处于应对大流行病的混乱之中，眼看着这一过程所暴露出来的诸多隐含性不公正和不平等——这是大多数国家都在某种程度上面临的状况，我发觉我的思绪转向了西海岸诗人和曹洞宗禅师菲利普·沃伦鸿篇巨制的长诗《京华浮生录》中看似简单的一句：\n\
    \n> 美国另有人生道，\n\n> \n\n> 不富不醉不吸毒。[![](images/00007.png)](#part0009.html#note90n)\n\
    \n沃伦曾在京都的街头和寺庙里冥思，在这样一个毁于帝国冲突，又盛行禅文化和灵性精进的都市里，他也曾烦恼重重——为尼克松治下的美国，为生态和灵性的双重退化，为越南战争。在一个为富人所有并为富人服务的强取豪夺的国家里，一个选择就是加入富人的行列，尽管这个选择几乎不可能成功，尽管这种解决问题的尝试不过是为虎作伥。还有一种可能就是“出离”，用毒品和酒精来淹灭自己的思维（这是许多人的选择）。难道就没有一条“中道”吗？“另有”这个词直指人类烦恼的核心。沃伦对于“另有”的灵性渴求，不仅仍然符合人们当下的需求，其广度已显现为全球性的。在大流行病及其显示的隐含性现实中，我们人类的追问可以用这么一句话来表述：在我们的全球世界里，或许另有某种合理的人类生活之道吧……\n\
    \n对于沃伦来说，这个“另有”就是他的人生切实地为我们的人生所立的公案。\n\n就此而言，人必须对全球局势予以咀嚼和反刍。或者换个比喻，那就是：人要把握机缘，把这全球新型冠状病毒的大流行当成一本经书来研读。正如日本镰仓的永平道元大师在他的札记《看经》（Kankin）里说的：“经是从整我来的经。这样说是因为你的我即是诸佛祖的我，亦是诸经的我。”不过，道元警告我们说：“然而遇经却不容易。”[![](images/00007.png)](#part0009.html#note91n)\n\
    \n在下面的佛教禅思里，我将尝试“遇经”，我在此把这部经称作“冠状病毒经”。作为一部经，“冠状病毒经”也是“整我之经”，这部经揭示了我们的真相，那就是我们不是互不相干的个体，而是所有人类的我，不，一切有情众生的我。本文旨在遇见、直面“另有”的合理的人类生活之道。\n\
    \n### 第一问，我怎样才能幸福？\n\n新型冠状病毒大流行已颠覆了这个世界，消除了“这世界基本还算正常”的假象。现在，我们更容易看见在“正常”生活中为我们所忽视的种种不平等现象，或者说，我们至少更难做到对其视而不见了。席卷美国、扩展至全世界的“黑人的命也是命”运动要求系统性的改变，因为人们从中认识到了这些不平等现象从本质上讲是系统性的。大流行病的祸根失衡地落在了由于历史原因而被边缘化的人群身上，虽然我们可能假装“所有人同舟共济”，但这并不诚恳。是的，新型冠状病毒并不区分富人与穷人、强权者和弱势者，但显而易见的是，有的人能够承受将自己接触病毒的概率降到最低所要付出的代价，而有的人则不能。以美国为例，没有身份的农业工人就陷于奇异的双重困境中：一方面，他们没有身份，因此有可能被突然强制驱逐出境；另一方面，由于美国的食品供应链大多都依赖这些薪酬微薄的工人，他们又被列为必要、必须坚持工作的人群。"
