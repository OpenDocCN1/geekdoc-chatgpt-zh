    \ Shingi［M］. LEIGHTON T D, OKUMURA S, trans. Albany: State University of New York\
    \ Press, 1996: 49.\n\n## 致谢\n\n2020年3月初，新冠肺炎疫情刚开始在美国全面暴发，我的同事托比·李思找到我，希望就疫情这个机缘，组织几位中西学者、思想者写写疫情引发的深层次思考，有份杂志会感兴趣刊载。我们一拍即合，马上开始组织安排。后来和那份杂志的合作生了些变故，但我觉得还是有必要把这件有意义的事情做下去。之后，我和挚友史旻、中信出版社出版人刘丹妮、加利福尼亚州洛杉矶罗耀拉大学哲学系教授王蓉蓉老师进行了多次讨论，编辑这本书的想法就此成形。在此，对于各位师友给予的启发、呼应和鼓励，我表示由衷的感谢。\n\
    \n这虽然是一本“应景”的小书，但参与写作的老师们挑战了许多我们习以为常或奉为圭臬的理念和实践，提出了令人深思甚至颠覆性的问题和思考。或许我们以前听过、看过其中很多观点和论述，但往往把它们当作知识理解了以后就束之高阁，并没有把这些问题、思考与我们的生命、生活关联和贯穿起来。全球新冠肺炎疫情或许是个“梦醒时分”。参与写作的老师们为世人“敲更鸣钟”，他们的高识远见、责任与担当让我敬佩并心怀感激。\n\
    \n我在此还要特别感谢龚隽、张祥龙、蒋劲松、潘涛几位老师在审稿方面给予的支持和建议。中信出版社的编辑更是不辞辛苦，反复审稿，提出了许多宝贵而又有创意的想法。赵汀阳老师充满趣味和睿智的漫画在给读者带来深思或会心一笑的同时，也给我们这本小书添色增彩。\n\
    \n最后，这本书得以成形还离不开北京大学博古睿研究中心同事们的帮助和耐心。尤其感谢田馨媛同学，她勤勤恳恳、极富耐心地做了所有初期的编辑、协调、脚注查找工作。\n\
    \n当然，一切错误和肤浅之处都是因为我的疏漏与才学粗浅，望读者海涵！\n\n宋冰  \n\n2021年4月于北京上第摩码园\n"
  trans: "\nAlthough this sounds terrifying and daunting, through the Dharma of Emptiness,\
    \ we awaken to the dynamic, evolving interdependence between ourselves and all\
    \ things; this Dharma of Emptiness is indeed liberating. In the *Heart Sutra*,\
    \ the teaching is \"Because there is no obstruction, there is no fear,\" so we\
    \ need not be afraid. Fear and trauma compress us into the smallest version of\
    \ ourselves, locking us into a narrow, fixed, static self, but Emptiness can open\
    \ us up, opening us to all beings and all things.\n\nIn a sense, this is about\
    \ awakening our greatness at a moment when the world situation highlights our\
    \ insignificance. However, \"greatness\" does not mean ego inflation. We do not\
    \ mean vanity, nor the idea that some people are better than others, or that humans\
    \ are more valuable than other species. We mean truly making yourself larger,\
    \ stronger. We do not mean fostering the so-called \"great man\" legacy. The greatness\
    \ of the self depends entirely on what has been emptied out; as illusions disappear,\
    \ the obstacles of the mind are also removed. The aim is to overcome the falsity\
    \ produced by that divided, aggressive self that constantly fights for its own\
    \ happiness and the \"right\" to be foolish. The aim is to awaken that great self\
    \ which makes us interdependent with all things.\n\nIn his instruction to the\
    \ Tenzo (the monastery cook), Master Dogen, following tradition (including Daoism),\
    \ spoke of the cultivation of the \"Great Mind\" or \"Wondrous Mind,\" saying\
    \ the Great Mind is \"like the great mountains and oceans, without partiality\
    \ or contentiousness.\" It is greater than our attachment to happiness, including\
    \ our obsession with personal greatness. Dogen advises everyone to study the character\
    \ \"Great\" (大), whose form resembles a person stretching out their arms to embrace.\
    \ In contrast, the character \"Small\" (小) resembles a person with arms hanging\
    \ down, no longer embracing the world. \"You should know that the great masters\
    \ of the past all studied the character 'Great'; now they all freely emit great\
    \ sounds, explain the great meaning, clarify great matters, guide great persons,\
    \ and accomplish great undertakings.\"![](img/#part0009.html#note93n)\n\nWe are\
    \ now facing a great crisis in a sense: our challenges are enormous, daunting.\
    \ But this is also an opportunity, allowing us to respond with a deeper sense\
    \ of the \"Great\": to embrace the perfection of our interdependence with all\
    \ sentient beings. We do not need to use the power of money to manipulate others\
    \ and the world into submitting to our will; nor do we need to \"withdraw,\" artificially\
    \ numbing our consciousness, otherwise we cannot cope with this unbearable world.\
    \ Opening ourselves, embracing the \"alternative\" rational way of human life,\
    \ is precisely awakening to our \"Greatness.\"\n\n(Translated by Pan Zijing)\n\
    \n1. WHALEN P. Scenes of Life at the Capital［M］. Bolinas, CA: Grey Fox Press,\
    \ 1971: 9.\n\n2. TANAHASHI K, ed. Treasury of the True Dharma Eye［M］. Boston and\
    \ London: Shambhala, 2010: 222.\n\n3. DOSTOEVSKY F. Notes from Underground［M］.\
    \ PEVEAR R, VOLOKHONSKY L, trans. New York: Alfred A. Knopf, 1993: 24.\n\n4. LEIGHTON\
    \ T D, ed. Dōgen's Pure Standards for the Zen Community: A Translation of Eihei\
    \ Shingi［M］. LEIGHTON T D, OKUMURA S, trans. Albany: State University of New York\
    \ Press, 1996: 49.\n\n## Acknowledgements\n\nIn early March 2020, just as the\
    \ COVID-19 pandemic began to break out fully in the United States, my colleague\
    \ Toby Lee approached me, hoping to take this opportunity to organize several\
    \ Chinese and Western scholars and thinkers to write deep reflections provoked\
    \ by the pandemic, for a magazine interested in publishing them. We hit it off\
    \ immediately and began organizing right away. Later, the collaboration with that\
    \ magazine ran into some changes, but I felt it was still necessary to continue\
    \ this meaningful project. Afterwards, through multiple discussions with my close\
    \ friend Shi Min, CITIC Press publisher Liu Dani, and Professor Wang Rongrong\
    \ of the Philosophy Department at Loyola Marymount University in Los Angeles,\
    \ California, the idea of editing this book took shape. Here, I express my sincere\
    \ gratitude to all these teachers and friends for their inspiration, resonance,\
    \ and encouragement.\n\nAlthough this is a \"topical\" small book, the contributing\
    \ teachers challenged many ideas and practices we take for granted or revere as\
    \ dogma, raising thought-provoking and even subversive questions and reflections.\
    \ Perhaps we have heard or seen many of these views and arguments before, but\
    \ often after understanding them as knowledge, we shelved them, failing to connect\
    \ and integrate these questions and reflections with our lives and living. The\
    \ global COVID-19 pandemic may be a \"moment of awakening from a dream.\" The\
    \ contributing teachers \"sound the alarm\" for the world; their profound vision,\
    \ responsibility, and commitment inspire my admiration and gratitude.\n\nI would\
    \ also like to especially thank Professors Gong Jun, Zhang Xianglong, Jiang Jinsong,\
    \ and Pan Tao for their support and suggestions in reviewing the manuscript. The\
    \ editors at CITIC Press worked tirelessly, reviewing repeatedly, and offered\
    \ many valuable and creative ideas. Professor Zhao Tingyang's witty and wise cartoons,\
    \ while bringing readers deep thought or a knowing smile, also added color and\
    \ brilliance to our small book.\n\nFinally, the formation of this book would not\
    \ have been possible without the help and patience of colleagues at the Peking\
    \ University Berggruen Research Center. Special thanks to student Tian Xinyuan,\
    \ who diligently and patiently handled all the initial editing, coordination,\
    \ and footnote research work.\n\nNaturally, all errors and superficialities are\
    \ due to my own negligence and shallow learning; I ask readers for their forbearance!\n\
    \nSong Bing  \n\nApril 2021, at Shangdi Moka Garden, Beijing\n"
