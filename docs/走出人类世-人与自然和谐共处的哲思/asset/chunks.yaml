- raw: '“生生”思想对中国人的生命观产生了深远影响。这一点在儒家思想中可以找到最强有力的表达。儒家思想不强调个体的独立存在。相反，个体被视为源于祖先的生命与血脉延续。人们有义务永续血脉，代代相传。换句话说，个体的生命只是相互联系的生命链条中的一环，而生生的精神就体现在这绵延的命脉相续与世代承继之中。这种理念也合理化了我们熟知的中国人的传统与社会实践，如祖先崇拜、孝道以及父母对子女教育和职业发展的焦虑与高企的期望值。现代著名思想家梁漱溟就指出，孔子赞叹“生”的话很多，如“天地之大德曰生”“天何言哉？四时行焉，百物生焉，天何言哉”“唯天下至诚，为能尽其性；能尽其性，则能尽人之性；能尽人之性，则能尽物之性；能尽物之性，则可以参天地之化育；可以参天地之化育，则可以与天地参矣”。他认为，理解了“生”就可以领会孔家的全部学说。[![](images/00007.png)](#part0006.html#note53n)


    儒家思想的核心教义植根于人与人之间的关系，它歌颂生发的力量，肯定生命和日常存在。“生”的影响无处不在。中国当代杰出的哲学家李泽厚将这种肯定生命的文化态度称为“乐感文化”，它的着重点是这个世界（此岸）的家庭关系，强调人的积极性，并赋予人类影响周遭自然的本体论地位的创造力。[![](images/00007.png)](#part0006.html#note54n)这种生活态度影响中国人养成不断自我更新、乐观积极的心态。在对比中西哲学异同之时，国学大师、浸淫中西哲学比较分析多年的赵玲玲指出，中国哲学的出发点和主要议题是“求生”，即人如何保生、善生、长生久视，与西方哲学源于好奇心的“求知”形成鲜明对比，因此演绎出了不同的价值观体系和对生命的态度。


    虽然儒家及中国人普遍强调生存、生命和生命延续的人生态度，但这并不意味着对死亡视而不见。人们常常说“向死而生”。这表明了一种态度，即与耽染于不可避免的事件（死亡）的讨论相比，它更加鼓励人们积极主动地面对力所能及的当下生活，学习、自修、自强不息，做到“仰不负于天，俯不怍于人”。这种态度促使人们积极投入和欣赏世俗生活。[![](images/00007.png)](#part0006.html#note55n)死亡不应让生命变得空虚从而失去精彩。相反，正因为不可避免的死亡，生命才变得更充沛、更丰富。或许大众并不知道“向死而生”也是德国哲学家马丁·海德格尔（Martin
    Heidegger，1889—1976）的重要哲学概念。然而，中国人对“向死而生”的理解，虽然也强调人类选择有意义或充实的生活的重要性，但并没有海德格尔哲学所包含的存在主义的“孤独”、“焦虑”或“断裂”之义。[![](images/00007.png)](#part0006.html#note56n)


    与儒家鲜有讨论死亡以及“不知生，焉知死”的态度相比，道家对生与死的看法意趣迥然。道家思想根植于道生万物、自然至上的宇宙观，认为生死乃道之自然法则。因此，人类的存在或生存有赖于人类取法自然，秉持克制、顺应和柔弱，而不是依靠攻击、霸蛮和不死不休的固执。前者通向生存、接续和繁荣，后者则导致断裂、夭折与毁灭。庄子则更是以超然、挑战乃至幽默的态度大谈生死。他认为，气聚则生，气散则死，生死相继，生死一体，死亡只是人类生命形态向另一种生命形态的转变，乃自然造化，有何堪忧？换一个角度看，死亡就像四季更迭，是自然消长的体现。于是，庄子在其妻去世时，“箕踞鼓盆而歌”，慨叹生命形式如季节转换般运行以及大自然的变动不居。


    一方面，以庄子为代表的道家哲学家对人与自然万物的生死持超然的态度。另一方面，受到道家哲学思想启发、结合了民间习俗和信仰的道教又是一个贵生、崇生的宗教，通过练就内丹、外丹，发展出保养人身机体，寻求长生不老的强大传统。这也契合了大众对活泼生命的渴望和“生”的精神。道教的核心原则就是“生”，道与生的统一，即生道合一。终其天年而不夭，甚至长生不老是道教追求的目标。因此，道教发展了令人眼花缭乱的修行方法，包括招魂术、占卜等，旨在促进个人的健康、长寿甚至永生。外丹术在历史上毁誉不一，因为很多人非但不能因此延年益寿，反而还因各种金石药物丧命。内丹则以它特有的冥想和摄生益寿法（如功夫、静坐和太极），在中华文化中至今仍然非常受欢迎。“生”的文化是中国人精神和大众信仰的重要组成部分。讨论与实践“养生”也成为中国人乐此不疲的全民消遣娱乐活动。


    总之，“生生”是中国哲学的支柱性概念，它深深植根于中国的哲学体系，沁入中国人的生命观、思维方式和整体价值观体系。一方面，中国文化中留存了寻求生存、此岸生活的乐趣和追求长寿与生命延续的强大基因；另一方面，中国人又受道家的影响，能够达观地将人类不可避免地走向死亡这一事实视为转化为其他生命形式的自然现象。这种一方面求生，另一方面相信生死循环的观念造就了中国人强大的生存精神、韧性和面对逆境时的乐观主义。


    ### 生物共生理论给人类的新启示


    哲学家和人类学家托比·李思从新冠肺炎疫情对人类的影响中得到启发，主张对人的重新定位在于把人放回自然之中。他认为，我们并非生活在人类世，而其实一直生活在微生物世：新冠肺炎疫情提醒我们，从病毒的角度来看，我们与其他宿主没有什么不同。李思认为新冠肺炎疫情是一个大型“无差别事件”，它对“现代性的本体论”提出质疑。[![](images/00007.png)](#part0006.html#note57n)“现代性的本体论”的前提就是人类作为自然界中唯一有理性思维能力的存在，具有至高无上的地位。此时此刻，我们人类应从非人类世界的角度，从人类作为自然一部分的角度，重新思考自己，努力形成“以地球而非种族或物种为中心的‘我们’的观念”[![](images/00007.png)](#part0006.html#note58n)。


    人类从对自然的假设和自然规律中汲取灵感、制定社会政策的做法由来已久。在此不得不提近现代史上令人汗颜的一页，即达尔文的自然选择进化论被利用，为近现代史上的种族主义、优生学和殖民主义提供“合理”的“科学”的依据。虽然社会达尔文主义在二战后声名狼藉，但“适者生存”和“零和博弈”的竞争思想在今天的全球政治当中仍然是主流观点。然而，新冠肺炎疫情提醒我们注意一个显而易见的事实：病毒无差别地对待不同种族、民族、信仰、意识形态及民族国家；人类不同族群之间相互依存，我们需要在发现、遏制和解决全球危机方面相互守望、帮助。


    其实，数百万年来，人类和病毒一直存在依存关系。一方面，病毒需要以我们为宿主，从而生存、复制与传播。另一方面，病毒在人类进化史上起到了推动作用，它们将永远伴随人类物种延续、生存与推进。不幸的是，尽管我们因为热爱群居、社交、全球旅行而成为有效的病毒宿主，但是我们显然不是它们唯一的宿主，人类对大自然的依赖远甚于大自然对我们的依赖。人类唯一的特殊之处或许是，我们拥有得天独厚的、精妙的认知能力。我们能够反思自己的弱点，并从经验和大自然中吸取教训，为我们未来的生存和繁荣做出预测与调整。


    那么，我们应该如何改变我们的思维呢？与其从达尔文进化论中吸取教训，我们或许更应该从普遍存在的生物界的共生现象中寻找灵感。德国微生物学家和真菌学家海因里希·安东·德巴利（Heinrich
    Anton DeBary）受希腊语启发，于1879年创造了“symbiosis”（共生）一词，用于描述“两种或多种不同生物以互利共生、寄生和共栖等关系生活在一起”的生物现象。[![](images/00007.png)](#part0006.html#note59n)在20世纪初，当西欧仍然沉迷于达尔文的进化论时，俄国生物学家则进一步发展了共生的概念，并提出共生起源理论：两种或多种生物以共生关系结合，有可能产生新的生物。[![](images/00007.png)](#part0006.html#note60n)科学界主流长期以一种异样的眼光看待共生学。然而，过去几十年，生物学家找到了越来越多的证据，证明不同生物之间普遍存在着相互交换养分和能量的共生共存现象。共生演化理论最有力支持者之一是林恩·马古利斯（Lynn
    Margulis）。她的研究表明，“从原核生物与原核生物的共生关系中，出现了真核生物。从原核生物与真核生物的共生关系中，产生了更具竞争力的真核生物。在真核生物和真核生物的共生关系中，又产生了多细胞生命”[![](images/00007.png)](#part0006.html#note61n)。近年来，植物学家苏珊·西马德（Susan
    Simard）对森林和树木的研究也推翻了以个体竞争求生存的森林生态论假设。她的研究表明，森林里的真菌联结了所有植物种类，碳、水、养分、植物预警信号以及激素通过这种遍布地下的真菌网络传输。西马德认为，一个成熟林是个古老、巨大与精细的社会，而不是冷峻、孤傲、以抢夺资源而求生的生态系统。在这个社会中，有冲突，但更多的是相互依存、取舍，充满联结、沟通甚至“利他”的行为。[![](images/00007.png)](#part0006.html#note62n)


    总之，到目前为止，大多科学家都认为共生是自然界普遍存在的现象，有些甚至认为共生在新物种的进化创新中发挥了至关重要的作用。达尔文进化论强调斗争、对立、零和竞争和适者生存，而共生假说的核心是相互依赖、相互关联、权衡取舍、共存和共同演化。马古利斯在她1998年出版的一书中就推测，“我怀疑，在不久的将来，人类作为一个物种，需要重新定位，与在地球微观世界中先于我们存在的伙伴实现融合”。[![](images/00007.png)](#part0006.html#note63n)的确，事实上我们不仅越来越认识到这种融合，近几十年来，共生理论也为人类健康、生态和环保运动提供了理论支持和认识上的启发。


    生物共生与共生演化理论揭示的共存、相互嵌入、相互依赖、竞争与交融的规律在东方社会也引发了回响与共鸣。这些回响与共鸣唤醒了人们对几千年哲学思想的重新认识，提出了广泛应用于人类社会与政治生活的共生思想。


    ### “共生”思想、“生生”观与一体论


    “共生”何时开始广泛用于中国的社会与政治生活已无从可考。但是“共生”一词在当代中国已是妇孺皆知，甚至有些陈词滥调了。无论是讨论国际政治、生态文明，还是商业竞争态势，甚至办公室政治，“共生”常常被挂在人们嘴边。在中国，自2000年以来，一些学校甚至已经将共生思想引入通识和社会课程。[![](images/00007.png)](#part0006.html#note64n)国际关系学家也在尝试发展共生国际体系理论，强调各国应相互理解、保持克制，积极参与国际事务，互惠互利，相互学习，追求共同繁荣。[![](images/00007.png)](#part0006.html#note65n)


    在日本，共生（tomo-iki）也是个使用频率很高的词和理念。在东亚文化的语境中，共生似乎早已是平常百姓的关切。虽然已是百姓日用，但我们未必知道这个理念在传统思想中的来源。我认为，东亚文化中的共生思想来自传统哲学中的“生生”智慧与一体论。首先，如前所述，“生生”意味着出生、再生、永续发展和变化。这种世界观显然与不同生物之间的共生共存现象有奇妙的契合与呼应。哲学家方东美阐述生之理为“生命包容万类，绵络大道，变通化裁，原始要终，敦仁存爱，继善成性，无方无体，亦刚亦柔，趣时显用，亦动亦静”。他进一步指出，“生”代表的宇宙生命力蕴含五种意义，即“育种成性义、开物成务义、创进不息义、变化通几义以及绵延长存义”，《易经》称之为“生生”。它是一种宇宙普遍存在的生命力，内在于人类、动物和植物等所有事物中。[![](images/00007.png)](#part0006.html#note66n)


    在日常生活中品味生命的活力，与自然界感同身受，对中国文人来说有着强烈的审美和诗性魅力。宋代新儒家周敦颐有一段广为流传的佳话。朋友问他为什么不除窗前草。周敦颐回答说：“与自家意思一般”，也是为了“观天地生物气象”。周敦颐体悟到人与小草皆为天地化生，欣赏这种谦卑生命形式体现出来的顽强、蓬勃生气，涵泳于万物一体、大自然所展示的生命之乐。这种对其他生命形式的审美和诗意的情感以及与自然融为一体的诉求在中国文人绘画与诗歌中比比皆是。即使在今天，在紧张与忙碌之余，在努力寻找内心清静和反求诸己的片刻，这别具一格的文人情怀仍然备受中国人的珍视。这些将自然视为有机生命并认为自然与人为一体的观念也顺理成章地为今天反思人与自然的关系和生态伦理提供了认识上的启发。


    对中国思想家来说，宇宙不仅仅是自然现象或物质环境。它还蕴含道德启示，启发人类思考应有的社会规范与治理框架，并在人类情感中唤起深刻的美学共鸣。既然统摄所有包括人在内的各种生命形式的是生命力，以及对生存、延续和繁荣的追求，那么人类社会价值观体系就应该以“生生”观为根本。从这一观念出发，必然得出以下结论：所有人类的生命、非人类的生命甚至非生命的事物都应该得到相应的推崇、尊重和关照。


    “生生”理念强调共同创造和共存，但这并不意味着不同生命形式之间没有差异、竞争或紧张关系。就像生态世界一样，演化是一个“分歧与整合的互补过程”。[![](images/00007.png)](#part0006.html#note67n)共生本质上是不同有机体的融合和相互嵌入。这是一个具有创造性张力的过程，这里有竞争、相互依赖和调适。共生的最终游戏不是“我者”消灭“他者”，而是不断杂糅、相互嵌入、适应、改变和融合以及走向新物种的多样化和共同创造的过程。


    “生生”的概念恰如其分地描述了这种生机勃勃的生命力和创造性张力。第一个“生”指生活，生存下来，继续生活。第二个“生”指给予和赋予生命。这就是为什么有些哲学家把“生生”翻译成英文的“Live
    and let live”（“自己活，也让别人活”）。[![](images/00007.png)](#part0006.html#note68n)其他形式的生命仅仅基于本能尚能共生、存活与绵延，那么我们这些拥有复杂认知能力的人类，应该可以有意识地反思和应用这些观念，将共生的创造性张力转化为良善的社会和政治关系，从而让我们做到相互尊重、自我约束、从他人角度思考问题以及接受差异。可见，生生观与现代共生思想相得益彰。


    当代东亚共生思想的第二个来源就是贯穿东方哲学的“一体”论。道家哲学认为，宇宙万物都由“道”衍生并主宰，正如庄子所说：“天地与我并生，万物与我为一。”于是，以道观之，万物并无高低贵贱。在儒家思想家中，张载首先提出万物一体的思想，在他的《西铭》中说道：“乾称父，坤称母。予兹藐焉，乃混然中处。故天地之塞，吾其体，天地之帅，吾其性。民，吾同胞，物，吾与也。”王夫之注释说：“父母载乾坤之德以生成，即天地运行之气，生物之心在是，而吾形色天性，与父母无二，即与天地无二也。”[![](images/00007.png)](#part0006.html#note69n)


    如果说，道家、儒家更加强调的是“我”与他人、天地万物并生于道，共同成长于天地之间，佛家思想则在多个层面上强调万物一体，互为因果，相互嵌入和融合。佛陀通过众多方便法门启发、引导无明众生走向醒悟，其中就包括因果轮回论。根据这个理论，世间一切事物都是由因果关系支配，都是因为各种条件的相互依存而产生的，并且这些因果环环相扣，组成因果相续的链条而“生生于老死，轮回周无穷”。[![](images/00007.png)](#part0006.html#note70n)于是，世界万物包括人类、植物、动物和矿物在内的所有存在，不仅存活着，同时也在被其他的存在赋予生命和存续的条件和支持。在这种意义上，万物一体蕴含着互为因果，相互嵌入、融合的关系。在最根本的意义上，佛法或大智慧对“万物一体”的理解是建立在对终极本源的“佛性”或“自性”的认识上。众生皆有佛性或自性，而何谓自性呢？自性为“万法所依之根本”，它“显现为世间出世间一切法，五蕴、六入、十八界乃至戒定慧，皆从自性起用”[![](images/00007.png)](#part0006.html#note71n)。也就是说，自性具有含藏、显示、变化万事万物的性质与功能。宇宙万物，包括动植物、人类、非生物，都是自性作用的结果。在这个意义上，宇宙万物何尝不是“同根生”而一体呢？


    总之，生生观与天地人一体的理念滋养、塑造并丰富了当代的共生思想。


    近二十几年来，日本和中国学者在讨论人类未来时，倡导共生思想，并将其应用于艺术创造和建筑设计当中，也应用于教育、社会、政治和地缘政治理论之中。[![](images/00007.png)](#part0006.html#note72n)黑川纪章是个有影响力的建筑界“新陈代谢论”的创始人，也是当代日本建筑界最具创造力的思想家之一。他在有生之年大力倡导共生哲学，在日本和中国引起广泛的关注。他反对进行严格的内部
    /外部、人类 /技术以及农村 /城市化二元概念的对立与划分，试图在其建筑设计作品中表现他从生物学和佛教中得到的体悟。


    在“万物一体”教义的基础上，中国台湾佛光山寺住持星云大师长期以来一直倡导“同体共生”的思想，认为这才是宇宙的本质，并主张以此为基础，增进社会凝聚力和建立政治共识，来建立一个大同世界。星云大师认为，“同体”含有“平等和包容”的意思，而“共生”有慈悲、融合之意。[![](images/00007.png)](#part0006.html#note73n)“同体共生”思想不仅是关于人类应该如何相互关联，而且要把自然和其他形式的存在包括进来。它超越了主流的二元方法论，摒弃了你死我活的争斗，反对线性的发展和演化观。它肯定整体性思维、价值多元和存在形式的多样化。


    近年来，许多欧美公共知识分子也在积极倡导convivia lism，它在中国被翻译成“共生主义”。2013年，他们发布了一份《相互依存宣言》，有意与宣示美国个人主义的《独立宣言》对照起来。这份《相互依存宣言》宣称，关系性（relationality）才是人类和自然生存的本质，它肯定所有生物之间的相互联系，并试图阐明一种所有生物能够共同生存的哲学。2018年，他们发出第二次宣言，宣称新自由主义已经破产，极端个人主义、食利与投机资本主义已经劣迹斑斑，共生主义应该取而代之成为后新自由主义的统一政治哲学。[![](images/00007.png)](#part0006.html#note74n)欧美公共知识分子倡导的共生主义与中日学者主张的共生思想在思想源头、理论基础和脉络上存在不少差异，但相似之处显而易见：二者都提醒人们关注人与自然，人与人之间的关系性、互通性，呼吁摒弃无节制的个人主义与追求利益最大化的资本主义精神，强调互相的责任、共处的约束和自我节制等。也许现代性和全球化带来的挑战和挫败终于缩小了东西方思想界之间的鸿沟，或许我们终于可以找到一个契合天地人的共同哲学的共识。费孝通的“各美其美，美人之美，美美与共，天下大同”的优雅文字正描绘了一个建立在相互联系、相互尊重和共同繁荣之上的共生理想世界。'
  fmt: '

    # “生生”思想与共生哲学：中国传统智慧的现代回响


    “生生”思想对中国人的生命观产生了深远影响。这一点在儒家思想中可以找到最强有力的表达。儒家思想不强调个体的独立存在。相反，个体被视为源于祖先的生命与血脉延续。人们有义务永续血脉，代代相传。换句话说，个体的生命只是相互联系的生命链条中的一环，而生生的精神就体现在这绵延的命脉相续与世代承继之中。这种理念也合理化了我们熟知的中国人的传统与社会实践，如祖先崇拜、孝道以及父母对子女教育和职业发展的焦虑与高企的期望值。现代著名思想家梁漱溟就指出，孔子赞叹“生”的话很多，如“天地之大德曰生”“天何言哉？四时行焉，百物生焉，天何言哉”“唯天下至诚，为能尽其性；能尽其性，则能尽人之性；能尽人之性，则能尽物之性；能尽物之性，则可以参天地之化育；可以参天地之化育，则可以与天地参矣”。他认为，理解了“生”就可以领会孔家的全部学说。[^53]


    儒家思想的核心教义植根于人与人之间的关系，它歌颂生发的力量，肯定生命和日常存在。“生”的影响无处不在。中国当代杰出的哲学家李泽厚将这种肯定生命的文化态度称为“乐感文化”，它的着重点是这个世界（此岸）的家庭关系，强调人的积极性，并赋予人类影响周遭自然的本体论地位的创造力。[^54]这种生活态度影响中国人养成不断自我更新、乐观积极的心态。在对比中西哲学异同之时，国学大师、浸淫中西哲学比较分析多年的赵玲玲指出，中国哲学的出发点和主要议题是“求生”，即人如何保生、善生、长生久视，与西方哲学源于好奇心的“求知”形成鲜明对比，因此演绎出了不同的价值观体系和对生命的态度。


    虽然儒家及中国人普遍强调生存、生命和生命延续的人生态度，但这并不意味着对死亡视而不见。人们常常说“向死而生”。这表明了一种态度，即与耽染于不可避免的事件（死亡）的讨论相比，它更加鼓励人们积极主动地面对力所能及的当下生活，学习、自修、自强不息，做到“仰不负于天，俯不怍于人”。这种态度促使人们积极投入和欣赏世俗生活。[^55]死亡不应让生命变得空虚从而失去精彩。相反，正因为不可避免的死亡，生命才变得更充沛、更丰富。或许大众并不知道“向死而生”也是德国哲学家马丁·海德格尔（Martin
    Heidegger，1889—1976）的重要哲学概念。然而，中国人对“向死而生”的理解，虽然也强调人类选择有意义或充实的生活的重要性，但并没有海德格尔哲学所包含的存在主义的“孤独”、“焦虑”或“断裂”之义。[^56]


    与儒家鲜有讨论死亡以及“不知生，焉知死”的态度相比，道家对生与死的看法意趣迥然。道家思想根植于道生万物、自然至上的宇宙观，认为生死乃道之自然法则。因此，人类的存在或生存有赖于人类取法自然，秉持克制、顺应和柔弱，而不是依靠攻击、霸蛮和不死不休的固执。前者通向生存、接续和繁荣，后者则导致断裂、夭折与毁灭。庄子则更是以超然、挑战乃至幽默的态度大谈生死。他认为，气聚则生，气散则死，生死相继，生死一体，死亡只是人类生命形态向另一种生命形态的转变，乃自然造化，有何堪忧？换一个角度看，死亡就像四季更迭，是自然消长的体现。于是，庄子在其妻去世时，“箕踞鼓盆而歌”，慨叹生命形式如季节转换般运行以及大自然的变动不居。


    一方面，以庄子为代表的道家哲学家对人与自然万物的生死持超然的态度。另一方面，受到道家哲学思想启发、结合了民间习俗和信仰的道教又是一个贵生、崇生的宗教，通过练就内丹、外丹，发展出保养人身机体，寻求长生不老的强大传统。这也契合了大众对活泼生命的渴望和“生”的精神。道教的核心原则就是“生”，道与生的统一，即生道合一。终其天年而不夭，甚至长生不老是道教追求的目标。因此，道教发展了令人眼花缭乱的修行方法，包括招魂术、占卜等，旨在促进个人的健康、长寿甚至永生。外丹术在历史上毁誉不一，因为很多人非但不能因此延年益寿，反而还因各种金石药物丧命。内丹则以它特有的冥想和摄生益寿法（如功夫、静坐和太极），在中华文化中至今仍然非常受欢迎。“生”的文化是中国人精神和大众信仰的重要组成部分。讨论与实践“养生”也成为中国人乐此不疲的全民消遣娱乐活动。


    总之，“生生”是中国哲学的支柱性概念，它深深植根于中国的哲学体系，沁入中国人的生命观、思维方式和整体价值观体系。一方面，中国文化中留存了寻求生存、此岸生活的乐趣和追求长寿与生命延续的强大基因；另一方面，中国人又受道家的影响，能够达观地将人类不可避免地走向死亡这一事实视为转化为其他生命形式的自然现象。这种一方面求生，另一方面相信生死循环的观念造就了中国人强大的生存精神、韧性和面对逆境时的乐观主义。


    ## 生物共生理论给人类的新启示


    哲学家和人类学家托比·李思从新冠肺炎疫情对人类的影响中得到启发，主张对人的重新定位在于把人放回自然之中。他认为，我们并非生活在人类世，而其实一直生活在微生物世：新冠肺炎疫情提醒我们，从病毒的角度来看，我们与其他宿主没有什么不同。李思认为新冠肺炎疫情是一个大型“无差别事件”，它对“现代性的本体论”提出质疑。[^57]“现代性的本体论”的前提就是人类作为自然界中唯一有理性思维能力的存在，具有至高无上的地位。此时此刻，我们人类应从非人类世界的角度，从人类作为自然一部分的角度，重新思考自己，努力形成“以地球而非种族或物种为中心的‘我们’的观念”。[^58]


    人类从对自然的假设和自然规律中汲取灵感、制定社会政策的做法由来已久。在此不得不提近现代史上令人汗颜的一页，即达尔文的自然选择进化论被利用，为近现代史上的种族主义、优生学和殖民主义提供“合理”的“科学”的依据。虽然社会达尔文主义在二战后声名狼藉，但“适者生存”和“零和博弈”的竞争思想在今天的全球政治当中仍然是主流观点。然而，新冠肺炎疫情提醒我们注意一个显而易见的事实：病毒无差别地对待不同种族、民族、信仰、意识形态及民族国家；人类不同族群之间相互依存，我们需要在发现、遏制和解决全球危机方面相互守望、帮助。


    其实，数百万年来，人类和病毒一直存在依存关系。一方面，病毒需要以我们为宿主，从而生存、复制与传播。另一方面，病毒在人类进化史上起到了推动作用，它们将永远伴随人类物种延续、生存与推进。不幸的是，尽管我们因为热爱群居、社交、全球旅行而成为有效的病毒宿主，但是我们显然不是它们唯一的宿主，人类对大自然的依赖远甚于大自然对我们的依赖。人类唯一的特殊之处或许是，我们拥有得天独厚的、精妙的认知能力。我们能够反思自己的弱点，并从经验和大自然中吸取教训，为我们未来的生存和繁荣做出预测与调整。


    那么，我们应该如何改变我们的思维呢？与其从达尔文进化论中吸取教训，我们或许更应该从普遍存在的生物界的共生现象中寻找灵感。德国微生物学家和真菌学家海因里希·安东·德巴利（Heinrich
    Anton DeBary）受希腊语启发，于1879年创造了“symbiosis”（共生）一词，用于描述“两种或多种不同生物以互利共生、寄生和共栖等关系生活在一起”的生物现象。[^59]在20世纪初，当西欧仍然沉迷于达尔文的进化论时，俄国生物学家则进一步发展了共生的概念，并提出共生起源理论：两种或多种生物以共生关系结合，有可能产生新的生物。[^60]科学界主流长期以一种异样的眼光看待共生学。然而，过去几十年，生物学家找到了越来越多的证据，证明不同生物之间普遍存在着相互交换养分和能量的共生共存现象。共生演化理论最有力支持者之一是林恩·马古利斯（Lynn
    Margulis）。她的研究表明，“从原核生物与原核生物的共生关系中，出现了真核生物。从原核生物与真核生物的共生关系中，产生了更具竞争力的真核生物。在真核生物和真核生物的共生关系中，又产生了多细胞生命”。[^61]近年来，植物学家苏珊·西马德（Susan
    Simard）对森林和树木的研究也推翻了以个体竞争求生存的森林生态论假设。她的研究表明，森林里的真菌联结了所有植物种类，碳、水、养分、植物预警信号以及激素通过这种遍布地下的真菌网络传输。西马德认为，一个成熟林是个古老、巨大与精细的社会，而不是冷峻、孤傲、以抢夺资源而求生的生态系统。在这个社会中，有冲突，但更多的是相互依存、取舍，充满联结、沟通甚至“利他”的行为。[^62]


    总之，到目前为止，大多科学家都认为共生是自然界普遍存在的现象，有些甚至认为共生在新物种的进化创新中发挥了至关重要的作用。达尔文进化论强调斗争、对立、零和竞争和适者生存，而共生假说的核心是相互依赖、相互关联、权衡取舍、共存和共同演化。马古利斯在她1998年出版的一书中就推测，“我怀疑，在不久的将来，人类作为一个物种，需要重新定位，与在地球微观世界中先于我们存在的伙伴实现融合”。[^63]的确，事实上我们不仅越来越认识到这种融合，近几十年来，共生理论也为人类健康、生态和环保运动提供了理论支持和认识上的启发。


    生物共生与共生演化理论揭示的共存、相互嵌入、相互依赖、竞争与交融的规律在东方社会也引发了回响与共鸣。这些回响与共鸣唤醒了人们对几千年哲学思想的重新认识，提出了广泛应用于人类社会与政治生活的共生思想。


    ## “共生”思想、“生生”观与一体论


    “共生”何时开始广泛用于中国的社会与政治生活已无从可考。但是“共生”一词在当代中国已是妇孺皆知，甚至有些陈词滥调了。无论是讨论国际政治、生态文明，还是商业竞争态势，甚至办公室政治，“共生”常常被挂在人们嘴边。在中国，自2000年以来，一些学校甚至已经将共生思想引入通识和社会课程。[^64]国际关系学家也在尝试发展共生国际体系理论，强调各国应相互理解、保持克制，积极参与国际事务，互惠互利，相互学习，追求共同繁荣。[^65]


    在日本，共生（tomo-iki）也是个使用频率很高的词和理念。在东亚文化的语境中，共生似乎早已是平常百姓的关切。虽然已是百姓日用，但我们未必知道这个理念在传统思想中的来源。我认为，东亚文化中的共生思想来自传统哲学中的“生生”智慧与一体论。首先，如前所述，“生生”意味着出生、再生、永续发展和变化。这种世界观显然与不同生物之间的共生共存现象有奇妙的契合与呼应。哲学家方东美阐述生之理为“生命包容万类，绵络大道，变通化裁，原始要终，敦仁存爱，继善成性，无方无体，亦刚亦柔，趣时显用，亦动亦静”。他进一步指出，“生”代表的宇宙生命力蕴含五种意义，即“育种成性义、开物成务义、创进不息义、变化通几义以及绵延长存义”，《易经》称之为“生生”。它是一种宇宙普遍存在的生命力，内在于人类、动物和植物等所有事物中。[^66]


    在日常生活中品味生命的活力，与自然界感同身受，对中国文人来说有着强烈的审美和诗性魅力。宋代新儒家周敦颐有一段广为流传的佳话。朋友问他为什么不除窗前草。周敦颐回答说：“与自家意思一般”，也是为了“观天地生物气象”。周敦颐体悟到人与小草皆为天地化生，欣赏这种谦卑生命形式体现出来的顽强、蓬勃生气，涵泳于万物一体、大自然所展示的生命之乐。这种对其他生命形式的审美和诗意的情感以及与自然融为一体的诉求在中国文人绘画与诗歌中比比皆是。即使在今天，在紧张与忙碌之余，在努力寻找内心清静和反求诸己的片刻，这别具一格的文人情怀仍然备受中国人的珍视。这些将自然视为有机生命并认为自然与人为一体的观念也顺理成章地为今天反思人与自然的关系和生态伦理提供了认识上的启发。


    对中国思想家来说，宇宙不仅仅是自然现象或物质环境。它还蕴含道德启示，启发人类思考应有的社会规范与治理框架，并在人类情感中唤起深刻的美学共鸣。既然统摄所有包括人在内的各种生命形式的是生命力，以及对生存、延续和繁荣的追求，那么人类社会价值观体系就应该以“生生”观为根本。从这一观念出发，必然得出以下结论：所有人类的生命、非人类的生命甚至非生命的事物都应该得到相应的推崇、尊重和关照。


    “生生”理念强调共同创造和共存，但这并不意味着不同生命形式之间没有差异、竞争或紧张关系。就像生态世界一样，演化是一个“分歧与整合的互补过程”。[^67]共生本质上是不同有机体的融合和相互嵌入。这是一个具有创造性张力的过程，这里有竞争、相互依赖和调适。共生的最终游戏不是“我者”消灭“他者”，而是不断杂糅、相互嵌入、适应、改变和融合以及走向新物种的多样化和共同创造的过程。


    “生生”的概念恰如其分地描述了这种生机勃勃的生命力和创造性张力。第一个“生”指生活，生存下来，继续生活。第二个“生”指给予和赋予生命。这就是为什么有些哲学家把“生生”翻译成英文的“Live
    and let live”（“自己活，也让别人活”）。[^68]其他形式的生命仅仅基于本能尚能共生、存活与绵延，那么我们这些拥有复杂认知能力的人类，应该可以有意识地反思和应用这些观念，将共生的创造性张力转化为良善的社会和政治关系，从而让我们做到相互尊重、自我约束、从他人角度思考问题以及接受差异。可见，生生观与现代共生思想相得益彰。


    当代东亚共生思想的第二个来源就是贯穿东方哲学的“一体”论。道家哲学认为，宇宙万物都由“道”衍生并主宰，正如庄子所说：“天地与我并生，万物与我为一。”于是，以道观之，万物并无高低贵贱。在儒家思想家中，张载首先提出万物一体的思想，在他的《西铭》中说道：“乾称父，坤称母。予兹藐焉，乃混然中处。故天地之塞，吾其体，天地之帅，吾其性。民，吾同胞，物，吾与也。”王夫之注释说：“父母载乾坤之德以生成，即天地运行之气，生物之心在是，而吾形色天性，与父母无二，即与天地无二也。”[^69]


    如果说，道家、儒家更加强调的是“我”与他人、天地万物并生于道，共同成长于天地之间，佛家思想则在多个层面上强调万物一体，互为因果，相互嵌入和融合。佛陀通过众多方便法门启发、引导无明众生走向醒悟，其中就包括因果轮回论。根据这个理论，世间一切事物都是由因果关系支配，都是因为各种条件的相互依存而产生的，并且这些因果环环相扣，组成因果相续的链条而“生生于老死，轮回周无穷”。[^70]于是，世界万物包括人类、植物、动物和矿物在内的所有存在，不仅存活着，同时也在被其他的存在赋予生命和存续的条件和支持。在这种意义上，万物一体蕴含着互为因果，相互嵌入、融合的关系。在最根本的意义上，佛法或大智慧对“万物一体”的理解是建立在对终极本源的“佛性”或“自性”的认识上。众生皆有佛性或自性，而何谓自性呢？自性为“万法所依之根本”，它“显现为世间出世间一切法，五蕴、六入、十八界乃至戒定慧，皆从自性起用”。[^71]也就是说，自性具有含藏、显示、变化万事万物的性质与功能。宇宙万物，包括动植物、人类、非生物，都是自性作用的结果。在这个意义上，宇宙万物何尝不是“同根生”而一体呢？


    总之，生生观与天地人一体的理念滋养、塑造并丰富了当代的共生思想。


    近二十几年来，日本和中国学者在讨论人类未来时，倡导共生思想，并将其应用于艺术创造和建筑设计当中，也应用于教育、社会、政治和地缘政治理论之中。[^72]黑川纪章是个有影响力的建筑界“新陈代谢论”的创始人，也是当代日本建筑界最具创造力的思想家之一。他在有生之年大力倡导共生哲学，在日本和中国引起广泛的关注。他反对进行严格的内部/外部、人类/技术以及农村/城市化二元概念的对立与划分，试图在其建筑设计作品中表现他从生物学和佛教中得到的体悟。


    在“万物一体”教义的基础上，中国台湾佛光山寺住持星云大师长期以来一直倡导“同体共生”的思想，认为这才是宇宙的本质，并主张以此为基础，增进社会凝聚力和建立政治共识，来建立一个大同世界。星云大师认为，“同体”含有“平等和包容”的意思，而“共生”有慈悲、融合之意。[^73]“同体共生”思想不仅是关于人类应该如何相互关联，而且要把自然和其他形式的存在包括进来。它超越了主流的二元方法论，摒弃了你死我活的争斗，反对线性的发展和演化观。它肯定整体性思维、价值多元和存在形式的多样化。


    近年来，许多欧美公共知识分子也在积极倡导convivialism，它在中国被翻译成“共生主义”。2013年，他们发布了一份《相互依存宣言》，有意与宣示美国个人主义的《独立宣言》对照起来。这份《相互依存宣言》宣称，关系性（relationality）才是人类和自然生存的本质，它肯定所有生物之间的相互联系，并试图阐明一种所有生物能够共同生存的哲学。2018年，他们发出第二次宣言，宣称新自由主义已经破产，极端个人主义、食利与投机资本主义已经劣迹斑斑，共生主义应该取而代之成为后新自由主义的统一政治哲学。[^74]欧美公共知识分子倡导的共生主义与中日学者主张的共生思想在思想源头、理论基础和脉络上存在不少差异，但相似之处显而易见：二者都提醒人们关注人与自然、人与人之间的关系性、互通性，呼吁摒弃无节制的个人主义与追求利益最大化的资本主义精神，强调互相的责任、共处的约束和自我节制等。也许现代性和全球化带来的挑战和挫败终于缩小了东西方思想界之间的鸿沟，或许我们终于可以找到一个契合天地人的共同哲学的共识。费孝通的“各美其美，美人之美，美美与共，天下大同”的优雅文字正描绘了一个建立在相互联系、相互尊重和共同繁荣之上的共生理想世界。


