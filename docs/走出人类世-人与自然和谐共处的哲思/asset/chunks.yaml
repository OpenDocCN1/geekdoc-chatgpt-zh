- raw: '尽管损失的分布是失衡的、不公的，我们仍然能够理解全世界大都在悲痛中，一损俱损，一哀俱哀。许多人，即便是那些有幸避过了危机的致命打击的人，也仍在忐忑他们是否能够重新快乐起来。这危机也可能加剧我们原有的不快乐，使我们更加怀疑个人幸福是否可能实现，除了少数幸运的富有者之外。这将我们引回了此种反思之核心的第一个问题：从佛法的角度来看，我怎样才能快乐，无论是在新型冠状病毒大流行期间，还是在更广阔的时间里？


    这个问题负载着一些不言而喻的假定。在英语中，happiness（幸福、快乐）一词的词根是hap，即好运或幸运，从这个角度来说，就很容易理解它跟happen（发生，即应运而生）或happenstance（偶然发生，即因运而生）这样的词是有关联的。在我想要幸福的时候，我希望骰子掷出让我成为赢家的点数，希望得到更多我想要的东西。我希望事情按照我希望它们发生的方式来发生。在某种程度上，这是不可避免的。比如，如果我们想要呼吸，我们应该想要空气适宜呼吸，并且愿意为保障空气适宜呼吸而做出努力。但无论如何，我们应该承认，幸福，即我们希望事情按照我们想要的方式发生，是与另一种假定捆绑在一起的：幸福是我想要什么，对运气的索求是由我主导的。幸福是要得到我想要的世界。


    这种索求有很多问题，而这些问题是众所周知的，也是道德伦理一直试图改善的。倘若我想要的，妨碍了你想要的，又该如何？道德伦理和法律被纳入进来，以裁决这类必然发生的冲突。但是，当我们索求世界屈从于我的意志、给我所想要的一切，我们也能够看见这个世界在我们眼前呈现出两个更深的层面。第一，这种索求制造了冲突，既与我试图制服的世界相冲突，又与其他人相冲突——他们的幸福索求妨碍了我的幸福索求。第二，这种渴望不仅可能是侵略性的、好斗的，它也证明着一种隐含的境况，即我是不幸福的，我所接受的这个世界是匮乏的、残缺的，我遇事很不自在。


    由此我们能够看出，“我怎样才能幸福”这个问题本身的提出也许就是佛所说的“苦”的一种症状——释迦牟尼佛将“苦”诊断为人生第一真相，它是一种持续的无常，一种遇事的不自在与不平衡。我越是想要幸福，就越是加重了这个根源性问题——这个根源性问题就是“我”，是早就对自己和自己所在的世界之事感觉不自在的“我”。这个问题无可避免的讽刺性恰在于此：“我”越是索求幸福，就越是深陷在我隐含的不幸之中。


    正因如此，许多佛法训导都强调某种觉醒，即某种从梦游中醒来的办法——在这种梦游中，我越是想方设法要逃离，我就越是在加重我的痛苦。酒精或毒品成瘾者会擅自给自己开药，以缓解自己在思想或生活上的痛苦，但是这类做法并未触及痛苦的根源，而只是在麻痹自我。追求巨额财富看起来确像一种改善自己处境的办法，但是很快这种追求本身就会变成目的，而我却沦为其奴隶。因为我无法看到这症状的根源是“我追求痛苦，仿佛痛苦的解药就是痛苦”，所以这种追求就持续存在，毫无消减。


    这种盲目就是“三毒”（即三种祸根）的核心所在，即无知，或无明。后者是指没有能力看见，不过从广义上讲，我也看不见我看不见。我的盲目使我看不见我的盲目，或者说我的幻象使我只看见我的幻象。就仿佛我的意识是一面蒙尘的镜子，对于未蒙尘的时候了无记忆。这镜子无论照什么，都是灰蒙蒙的。哪怕在这镜子前放置更闪耀或更昂贵的东西，也依然解决不了这个问题；必须先想办法擦去镜子上的灰尘，而要做到这一点，就必须意识到自己的意识之镜一直是蒙着灰尘的——这绝非易事，因为镜子蒙尘太多，根本不知道自己蒙尘了。或者说，这就像我鼻子上挂着一块屎：无论你给我闻什么，我都只闻到臭味。要想闻到禅里的宇宙的无限芬芳，我必须先觉醒，觉知到我有一只臭鼻子的事实，然后想办法把鼻子擦干净。否则，我就会把那臭味归罪于世界，而不是归咎于我自己的鼻子。但是，如果我只知道自己的鼻子是一个器官，我是通过它来体验这连绵不绝的、被我认定是由我的生活和世界引起的臭味，那么我又是怎么忽然之间突发奇想，梦想着嗅到宇宙无穷无尽的芬芳呢？历苦，即体验失衡的生活所带来的烦恼，不是老生常谈的“所有人、所有物”都要承受痛苦。突然经历的苦乃是一种顿悟，它打破了我们的体验之根底里那带着臭味、蒙着灰尘的常识。渴求修行，即擦亮镜子，擦净鼻子——这本身就是道元告诉我们的大觉醒。


    最能说明这个问题的，莫过于蒙尘之意识的渴望——它所渴求的竟然是灵性之富足，甚至是净土或其他法门所谓的天堂。确实，经书中充满了珍宝的意象和净土的承诺，这在很多地方都能够看到，包括正统的净土宗佛法。但是，如果原本的问题是我们自己无力看见“我们对幸福的执意追求恰恰在持续和加重我们的不幸福”的讽刺性，那么我们就无法认识到那引导我们看见自己不幸之根源的教义的真实性。我们无力洞见问题的根源，这本身就是我们的问题的根源。这个问题在《法华经》里被提到过，被称为“方便”问题。在与佛著名的火龙意象遥相呼应的火宅喻里，佛要舍利弗想象一个富贵长者的宅子着了火，他知道自己很容易就能逃出去，可是他的孩子仍在宅子里，沉迷于游戏（贪恋和成瘾），全然没有觉察到火焰从四面漫卷而来。这位父亲想方设法警告孩子们危险就在眼前，可是他们听不懂他在说些什么。他们甚至不知道宅子是什么。当然了，在他们眼中，钱财、名声、权力就是最有价值、最实在的东西了！除此之外，哪有什么要紧的东西？于是，这位父亲就想出了一个应急的、权宜的、虚构的办法——这是一服巧妙的解药，炮制这样一服解药就是为了穿透他的孩子们因无知而生的种种幻象。他必须说迷醉的、沉睡的、痴狂的孩子们所能听懂的语言，所以他向孩子们许诺说，他会给他们一切他们想要的东西——针对他们眼下的状况，他向他们许诺说，宅子外面有更奇妙、更华美的玩具在等着他们。孩子们的心就跟着了火一样，他们纷纷跑出了宅子。


    佛问舍利弗，这位父亲是否犯了说谎的罪。而舍利弗已经懂了，这位父亲将他的孩子们领上了觉知之路，尽管他们尚不理解。佛的教导，并非直截了当的主张，强求他人认同。佛的教导是良药，是解脱之法，是悄悄地把一颗宝珠缝在我们衣底一般偷偷地把觉醒带给我们。我们忽然间明白了，佛在所有地方、所有事物中，甚至在那火宅里。也就是说，火宅（第一真相乃是苦）促使我们驱向佛法，可是佛法本身呈现在一切存在中，甚至是那最初看起来与佛法全然相反的火宅中。所以，问题不是火宅本身，而是我们自己无力突破自身蒙尘之镜和挂屎之鼻的障碍。火宅恰是我们自己的无明。


    尽管净土宗佛法从我们对净土的向往入手，其教导却强调我们根本无法凭着自己的力量或凭着自己的努力到达净土。只有当我们意识到了自己确是愚人，我们的自我才不再阻碍我们抵达净土，而那净土本来早就在那里了。就此而言，针对那渴求进天堂（即终于逃到一个我们能够得到自己想要的一切的地方）的热望，可以再给个提示：只有那被蒙蔽的自我才想进天堂，所以既可以巧妙地运用天堂的教导去反驳天堂本身（用我对极乐的渴望来反攻那执着于天堂的自我，从而以动制动，克服自身），亦可以任由它——这根本问题的表面症状，继续恶化。


    从觉醒的角度来看，如果真有天堂和地狱，那么我们渴望的是去地狱。最初，这貌似与我们最基本的幸福渴望背道而驰。实际上，也确实如此。但是，这貌似最基本的渴望在阻止我们实现菩提萨埵（简称菩萨）的理想：只要众生之中哪怕有一个仍在受苦而不得解脱，那么我就不为自己求觉悟和解脱。这正是四弘誓愿的第一誓愿（众生无边誓愿度）。鉴于此誓愿不可能产生效应——苦是永远都存在的，那么我就意识到我之所以修行，不是为我，而是为他人。或者说，我之所以修行，是将我作为许多个他人中的一个他人，而不是将我作为同他人区分开来的一个自己。那个愿意得乐的我，是为了他人而在菩萨的境界中醒来。或者用地狱的说法：菩萨的志向是去地狱，因为那里有需要他帮助的众生。唯有“自我”想去天堂，具有讽刺意味的是，这意味着“自我”其实已在自己的地狱里了。


    意欲得乐的我，总是用我得乐的成功度来称量幸福。那是因为我的出发点是虚幻的、割裂的自己。释迦牟尼佛则谈到一种不同的发心，一种不同的居心（精舍），有时候他把这种居心称作“四无量”，这与我对幸福的斤斤计较的称量方式（我需要得到我自己的幸福，我祝福别人，只要他们不妨碍我）形成了鲜明的对比。


    四无量，常被称作“四无量心”。精舍就是精神的居所或处所。它是一个人的根基所在，是人的来处，是我们的“意”的落脚处。虽然佛是生他、养他的婆罗门文化的叛教者，比如他认为婆罗门种姓独霸了本应为众生所共有的灵性生活，但是他仍然沿用了婆罗门的许多主题，并借用了婆罗门的许多名称。这算是婆罗门精舍，但这不过是个名字而已；倘若超越一切名，它实际上来自四无量意的精舍——四无量意，即“意”经历尘世的四种方法，从尘世本身的无量地和我们自身的无量地。


    有四种禅观，即四种佛果。第一个或许最为人所知，即所谓的慈心，也就是平常所说的慈爱，积极主动地去疗愈、施救、援助、善待他人。第二个是悲心，悲心与慈心的联结在于，悲心不把他人的痛苦视为他人的问题，而是感同身受，如同自己的问题。观世音菩萨，即中国人所说的观音，听闻尘世众生的所有哭喊。菩萨的理想就是：只要这世界上还有苦痛，那就放弃一己的觉醒。那么，既然苦痛永远存在，菩萨也就从来不受自利心的驱使。菩萨弃绝居高临下的怜悯，如同弃绝恶意与残忍。


    第三个就是喜心，懂得并分得他人的欢喜。喜心是根植于前两种心的，它格外强调的是这四种居心的无量地。喜心是自我克服尼采那著名的“无名怨愤”，即因为你的幸福和成功像镜子一样映照出我自己的痛苦、悲伤和失败感，所以我对你产生的恶意。喜心不受自尊心的掺杂和污染，将他人的成功视为与我自己的幸福紧密相关的事情（如同我的孩子在学校得了好成绩，或我支持的运动队得了冠军）。他人的幸福不但不会养成我的无名怨愤，甚或我的忌妒心，反而会给我欢喜。我以他人的欢喜为欢喜。这种喜心甚至超越了亚里士多德在《尼各马可伦理学》中所提及的一种美德：亚里士多德提出的这种美德是义愤，即对他人不劳而获的幸福产生正义的愤慨，它介于对他人理所应得的幸福的公然忌妒（即满怀敌意和羡慕）和最黑暗的另一极端幸灾乐祸之间。在佛法里，悲心排除了恶意，而喜心清除了忌妒。不过，亚里士多德认为对于他人不劳而获的幸福产生义愤是正当的。我们觉得不快的是他人仅仅因为幸运而兴旺发达。从喜心的角度来看，这也是染上了义愤。我帮助你不是因为你配得帮助。我帮助你是因为你在承受痛苦。可是说到底，谁的幸福真是当之无愧的呢？无论如何，喜心只是为他人的幸福而欢喜。


    第四个居心是舍心，即安详和镇静之心。舍心是不同于喜心的，因为喜心还是在滋生贪执，即对欢喜和幸运上瘾，甚至对觉悟的极乐上瘾。不要把这个舍心混同为冷漠，包括对他人的困境感到漠然和冷淡，仿佛认真对待他人的痛苦会把我太深地拖进人类世界那污泥浊水般的糊涂账里。舍心消解的是贪执心，但并不弃世，并不推卸对世界的责任。舍心是以和平的态度给予世界照顾，并关心一切众生。尽管全球性的大流行病令人难过，但不应该把它错认为是一种对我的幸福的威胁，而是一种对我们共有的集体自我的深层关怀的唤醒。


    ### 第二，不要害怕


    一眼看去，四无量心是纸上读来样样好，落实起来处处难吧！这简直就像一个诱人的童话，但是在全球新型冠状病毒大流行期间，我们难道不需要变得更务实些吗？何况与即将到来的生态性危机和全球性不公所引发的种种烦恼挣扎相比，新型冠状病毒的全球大流行不过是小巫见大巫！


    这样的抗议，哪怕是出于好意，也是不合时宜的。首先，这些危机所暴露出来的是我们的道德想象力的匮乏。我们原本已经太务实了，竟然希望世界人口中的大多数会停止抱怨，学习热爱他们所承受的不平等，毫不介意我们人类种族为财富向顶层的百分位数持续转移所付出的代价——那就是不仅大部分人类深陷不稳定和痛苦，地球本身也深陷不稳定和痛苦。我们对世界秩序的委曲求全，预计将造成超过100万种生命形式的灭绝，我们早晚必将承受它所带来的种种恶果。而这不过是我们为人类自身的灭绝所缴纳的首付款。激进与不切实际的，不是四无量心，而是我们对“一切照常”的奴性。


    我们自己的务实主义不仅是一种妨碍我们正视自身既无能力又无志气之现实的自欺；它还斥责四无量心有所缺欠，而这种反应来自一套假设中的一个假设——我们想象自己必须向内求得四无量心，才能做到有备无患，应对自如。然而，这种自我的匮乏感不仅令人发指地无用，而且恰恰是问题的根源所在。比如，我们对病毒的迅速传播感到惊讶，甚至震惊。然而，科学家已经年复一年地发出警告，毁灭性的大流行病即将发生，这世界却令人痛心地毫无准备。我们原以为会发生什么呢？既然各国都在赌病毒会“神奇地”消失，经济事务会一如既往，那我们为什么还要对这场不顾后果的赌局的下场感到惊讶呢？而这不过是冰山一角。我们知道在接下来的几年中，全球气温平均将提升2摄氏度，这将是“灾难性的”。《巴黎气候协议》虽然代表着我们向正确的方向迈了一步，可普遍看来，就连它那不足以逆转危机的要求，我们也未能切实做到。简而言之，气候告急只是全球生态危机的一个方面，除此之外我们还面临生物区的毁灭、空气污染和水污染、居住地锐减、不可持续的人口增长等问题。另外，全球经济秩序建立在经济不断增长的预期之上，但是我们已经看到这种增长前景存在很大的局限。比如，全球经济都依赖化石燃料，但是继续燃烧化石燃料的生态代价是我们无法承受的，而且化石燃料也在迅速耗尽。还有，全球经济若是保持现有轨道，不仅会导致灾难性的气候变化，而且地球的资源根本不足以支撑我们实现全球财富持续增长的诺言。大流行病所暴露的不是发生在我们身上的问题，而是我们就是问题。


    如果我们就是问题，那么对那些尽力让我们认清问题的本质并提供了更加深刻的、截然不同的出发点的法门予以斥责就没什么道理了。比如，四无量心不是基于人类的自利心，而是基于万物（包括我们人类在内）的无量地。理解当下问题的一个方法是去思考陀思妥耶夫斯基在其早期小说《地下室手记》（1864年）中提出的开创性洞见。它的叙述者几乎在所有他接触的人类面前都是隐形的，可是他无意改变自身所处的困境，而是要拼命争取一个更公正、更平等的世界。更有甚者，他主张他拥有愚蠢的权利。他愤懑地坚持他自己的自由，坚持他想做什么就做什么的权利。在我的国家，这类坚持包括：人类的自由给了我们在大流行病期间不戴口罩的权利，哪怕不戴口罩会将他人的生命置于危险之中。你竟敢妨碍我的自由！我主张我的自由！然而，人类的自由就是我们想做什么就做什么的权利吗？就是反抗“某些精确计算、详细规范、令世界再无任何行动和历险之余地的善意提示”吗？[![](images/00007.png)](#part0009.html#note92n)


    这个地下室人坚称，他有权力宣布2+2=5。这并非一种戏剧化的存在宣言，宣称我们的自由实乃荒谬，那不过是某些读者草率做出的时髦臆测。它实际上是将自由归为人类的自我中所固有的东西，并主张拥有向一切妨碍这自由的事物开战的权利。正是我们认定自己拥有向地球开战的自由引发了生态危机。正是我们对动物权利的忽视（这表现为工厂化养殖和动物栖息地被毁灭），在加速从畜到人疾病的传播，包括新型冠状病毒。然而，我们却继续在这个问题上加大赌注，仿佛解决之道就是以种种新形式的人类霸权来解决人类霸权所造成的恶果，包括将气候变化想象成“不过是”另一个工程问题。我们主张自己拥有为所欲为的权利，为了让这种主张合情合理，我们找到了各种技术，来证明2+2=5。我们试图征服地球，迫使地球臣服于我们的自由，而不是与地球合作。所以，我们所追求的自由，不是蕴含于自然的自由之中（如佛法和道家所说的），而是存在于我们任性的战斗中，战斗的目的就是将我们的自我凌驾于自然之上。


    虽然这个全球神话现在极为盛行，但它是建立在扭曲了我们与自然之关系的自欺之上的。在我们将自身与自然对立起来的自我宣言中，我们忘记了我们的存在本身完全依赖于自然。我们是地球生物，我们一路进化而来的结果是只有在这种极其独特的恒温恒湿膜里才能生存和繁衍。因此，人类生命的存在，不仅要依赖地球，而且要依赖这种极其独特的气候环境，这种气候环境一旦失去则意味着地球仍将继续，生命仍将进化，而我们却要自我灭绝了，因为地球的各种生物区无法再支持人类生命。此外，在这个恒温恒湿膜内，我们还依赖清洁的饮用水、可食用的食物、可耕种的健康土壤、可呼吸的清洁空气。就此而言，自由是基于动态进化的因，和生命与生存的缘。自由的危险在于它在自我中的错位，使我们毁灭性地背离我们的因与缘。我们存在着，仅仅是因为这独一无二的、极度敏感的、可生可灭的地球时刻存在着。


    由于我们的这种任性，我们在有意或无意间，成了我们自身痛苦的帮凶——为了调教这种任性，佛法倡导空，而空法是展示一切事物（包括我们自己在内）都没有所谓的“自在”，即独立的、同一的、自主的、自立的存在。从常规上讲，我们总是想象自己首先是以自我的形式独立自主存在的，但是这只是一种抽离的认识，在这种认识里我们忽略了我们与其他众生动态共享的、隐含的因与缘。例如，如果我只是我，我并非水、食物、氧气、教育、语言、家教、适宜的生存条件，那么我们完全可以把所有这些隐含的相互依存因素都拿掉，而我依然是我。但是，如果真的将那些因素都拿掉，我就会消失，因为我是所有那些因素的动态性的相互关联。这是理解佛有关存在的论说的一种方法。存在不是所有独立存在的事物的集合，而是更加实在，更加亲密的无我、无常、空和缘起。


    自然不是原子式的众生的集合，人类也并非原子式的众生的集合，尽管人类出于自毁的习气总是声称自己不过是原子的集合而已。道家和东亚佛学所说的自然，从本质上说是自然的、自发的，不是虚妄的自我动因的强求，而是互相提升的生命之间的动态的相互依存，每一生命皆存在于其他生命之中，并通过其他生命而存在。目前，世界在大流行病期间所遭受的痛苦来得莫名其妙（尽管其中很多痛苦早有预言，且可预防），这恰好暴露出我们这自我毁灭的危险道路的某些特征。可是，哪怕我们继续在自我毁灭的危险道路上一意孤行，作为缘起的自然仍然不会止歇。自然永不止歇。当下的境况更清楚地暴露了缘起的两个方面的真相：第一，我们可以理解自然本身是“一个自由度系统”，这是用伟大的19世纪德国哲学观来表述的。自然就跟道一样，从根本上说是既不可道又无穷尽的，但是从万物的层面来说，它又是相互依存，因而系统地逐渐展现出来的；第二，尽管自然永远是一个系统的问题，系统却并非自然而然就健康。生物区可能崩溃并陷入“失控”。新型冠状病毒暴露了系统的腐败，包括种族歧视、性别歧视、阶级歧视，以及我们的经济与政治生态的失衡。从更广泛的意义上讲，我们被赋予了另一个机会，去直面我们所现身的自然系统和我们所生活的经济、政治系统之间的不平衡和不友善。


    因此，四无量心意味着我们能够从“我们有权愚蠢”的迷幻中觉醒，并意识到我们就像那构成我们自身的动态相关的种种关系一样健康和良善。在那小气而吝啬的自私之自我的想象里，四无量心是可望而不可即的，可是那种想象不过是一个我们必须从中苏醒的噩梦，是一个我们必须挺身担当起相应的护理与责任的系统警报。这是大事，是一等一的大事，如果对此置之不理，那么我们无论付出多少努力都将徒劳无功。'
  fmt: '

    尽管损失的分布是失衡的、不公的，我们仍然能够理解全世界大都在悲痛中，一损俱损，一哀俱哀。许多人，即便是那些有幸避过了危机的致命打击的人，也仍在忐忑他们是否能够重新快乐起来。这危机也可能加剧我们原有的不快乐，使我们更加怀疑个人幸福是否可能实现，除了少数幸运的富有者之外。这将我们引回了此种反思之核心的第一个问题：从佛法的角度来看，我怎样才能快乐，无论是在新型冠状病毒大流行期间，还是在更广阔的时间里？


    这个问题负载着一些不言而喻的假定。在英语中，happiness（幸福、快乐）一词的词根是hap，即好运或幸运，从这个角度来说，就很容易理解它跟happen（发生，即应运而生）或happenstance（偶然发生，即因运而生）这样的词是有关联的。在我想要幸福的时候，我希望骰子掷出让我成为赢家的点数，希望得到更多我想要的东西。我希望事情按照我希望它们发生的方式来发生。在某种程度上，这是不可避免的。比如，如果我们想要呼吸，我们应该想要空气适宜呼吸，并且愿意为保障空气适宜呼吸而做出努力。但无论如何，我们应该承认，幸福，即我们希望事情按照我们想要的方式发生，是与另一种假定捆绑在一起的：幸福是我想要什么，对运气的索求是由我主导的。幸福是要得到我想要的世界。


    这种索求有很多问题，而这些问题是众所周知的，也是道德伦理一直试图改善的。倘若我想要的，妨碍了你想要的，又该如何？道德伦理和法律被纳入进来，以裁决这类必然发生的冲突。但是，当我们索求世界屈从于我的意志、给我所想要的一切，我们也能够看见这个世界在我们眼前呈现出两个更深的层面。第一，这种索求制造了冲突，既与我试图制服的世界相冲突，又与其他人相冲突——他们的幸福索求妨碍了我的幸福索求。第二，这种渴望不仅可能是侵略性的、好斗的，它也证明着一种隐含的境况，即我是不幸福的，我所接受的这个世界是匮乏的、残缺的，我遇事很不自在。


    由此我们能够看出，“我怎样才能幸福”这个问题本身的提出也许就是佛所说的“苦”的一种症状——释迦牟尼佛将“苦”诊断为人生第一真相，它是一种持续的无常，一种遇事的不自在与不平衡。我越是想要幸福，就越是加重了这个根源性问题——这个根源性问题就是“我”，是早就对自己和自己所在的世界之事感觉不自在的“我”。这个问题无可避免的讽刺性恰在于此：“我”越是索求幸福，就越是深陷在我隐含的不幸之中。


    正因如此，许多佛法训导都强调某种觉醒，即某种从梦游中醒来的办法——在这种梦游中，我越是想方设法要逃离，我就越是在加重我的痛苦。酒精或毒品成瘾者会擅自给自己开药，以缓解自己在思想或生活上的痛苦，但是这类做法并未触及痛苦的根源，而只是在麻痹自我。追求巨额财富看起来确像一种改善自己处境的办法，但是很快这种追求本身就会变成目的，而我却沦为其奴隶。因为我无法看到这症状的根源是“我追求痛苦，仿佛痛苦的解药就是痛苦”，所以这种追求就持续存在，毫无消减。


    这种盲目就是“三毒”（即三种祸根）的核心所在，即无知，或无明。后者是指没有能力看见，不过从广义上讲，我也看不见我看不见。我的盲目使我看不见我的盲目，或者说我的幻象使我只看见我的幻象。就仿佛我的意识是一面蒙尘的镜子，对于未蒙尘的时候了无记忆。这镜子无论照什么，都是灰蒙蒙的。哪怕在这镜子前放置更闪耀或更昂贵的东西，也依然解决不了这个问题；必须先想办法擦去镜子上的灰尘，而要做到这一点，就必须意识到自己的意识之镜一直是蒙着灰尘的——这绝非易事，因为镜子蒙尘太多，根本不知道自己蒙尘了。或者说，这就像我鼻子上挂着一块屎：无论你给我闻什么，我都只闻到臭味。要想闻到禅里的宇宙的无限芬芳，我必须先觉醒，觉知到我有一只臭鼻子的事实，然后想办法把鼻子擦干净。否则，我就会把那臭味归罪于世界，而不是归咎于我自己的鼻子。但是，如果我只知道自己的鼻子是一个器官，我是通过它来体验这连绵不绝的、被我认定是由我的生活和世界引起的臭味，那么我又是怎么忽然之间突发奇想，梦想着嗅到宇宙无穷无尽的芬芳呢？历苦，即体验失衡的生活所带来的烦恼，不是老生常谈的“所有人、所有物”都要承受痛苦。突然经历的苦乃是一种顿悟，它打破了我们的体验之根底里那带着臭味、蒙着灰尘的常识。渴求修行，即擦亮镜子，擦净鼻子——这本身就是道元告诉我们的大觉醒。


    最能说明这个问题的，莫过于蒙尘之意识的渴望——它所渴求的竟然是灵性之富足，甚至是净土或其他法门所谓的天堂。确实，经书中充满了珍宝的意象和净土的承诺，这在很多地方都能够看到，包括正统的净土宗佛法。但是，如果原本的问题是我们自己无力看见“我们对幸福的执意追求恰恰在持续和加重我们的不幸福”的讽刺性，那么我们就无法认识到那引导我们看见自己不幸之根源的教义的真实性。我们无力洞见问题的根源，这本身就是我们的问题的根源。这个问题在《法华经》里被提到过，被称为“方便”问题。在与佛著名的火龙意象遥相呼应的火宅喻里，佛要舍利弗想象一个富贵长者的宅子着了火，他知道自己很容易就能逃出去，可是他的孩子仍在宅子里，沉迷于游戏（贪恋和成瘾），全然没有觉察到火焰从四面漫卷而来。这位父亲想方设法警告孩子们危险就在眼前，可是他们听不懂他在说些什么。他们甚至不知道宅子是什么。当然了，在他们眼中，钱财、名声、权力就是最有价值、最实在的东西了！除此之外，哪有什么要紧的东西？于是，这位父亲就想出了一个应急的、权宜的、虚构的办法——这是一服巧妙的解药，炮制这样一服解药就是为了穿透他的孩子们因无知而生的种种幻象。他必须说迷醉的、沉睡的、痴狂的孩子们所能听懂的语言，所以他向孩子们许诺说，他会给他们一切他们想要的东西——针对他们眼下的状况，他向他们许诺说，宅子外面有更奇妙、更华美的玩具在等着他们。孩子们的心就跟着了火一样，他们纷纷跑出了宅子。


    佛问舍利弗，这位父亲是否犯了说谎的罪。而舍利弗已经懂了，这位父亲将他的孩子们领上了觉知之路，尽管他们尚不理解。佛的教导，并非直截了当的主张，强求他人认同。佛的教导是良药，是解脱之法，是悄悄地把一颗宝珠缝在我们衣底一般偷偷地把觉醒带给我们。我们忽然间明白了，佛在所有地方、所有事物中，甚至在那火宅里。也就是说，火宅（第一真相乃是苦）促使我们驱向佛法，可是佛法本身呈现在一切存在中，甚至是那最初看起来与佛法全然相反的火宅中。所以，问题不是火宅本身，而是我们自己无力突破自身蒙尘之镜和挂屎之鼻的障碍。火宅恰是我们自己的无明。


    尽管净土宗佛法从我们对净土的向往入手，其教导却强调我们根本无法凭着自己的力量或凭着自己的努力到达净土。只有当我们意识到了自己确是愚人，我们的自我才不再阻碍我们抵达净土，而那净土本来早就在那里了。就此而言，针对那渴求进天堂（即终于逃到一个我们能够得到自己想要的一切的地方）的热望，可以再给个提示：只有那被蒙蔽的自我才想进天堂，所以既可以巧妙地运用天堂的教导去反驳天堂本身（用我对极乐的渴望来反攻那执着于天堂的自我，从而以动制动，克服自身），亦可以任由它——这根本问题的表面症状，继续恶化。


    从觉醒的角度来看，如果真有天堂和地狱，那么我们渴望的是去地狱。最初，这貌似与我们最基本的幸福渴望背道而驰。实际上，也确实如此。但是，这貌似最基本的渴望在阻止我们实现菩提萨埵（简称菩萨）的理想：只要众生之中哪怕有一个仍在受苦而不得解脱，那么我就不为自己求觉悟和解脱。这正是四弘誓愿的第一誓愿（众生无边誓愿度）。鉴于此誓愿不可能产生效应——苦是永远都存在的，那么我就意识到我之所以修行，不是为我，而是为他人。或者说，我之所以修行，是将我作为许多个他人中的一个他人，而不是将我作为同他人区分开来的一个自己。那个愿意得乐的我，是为了他人而在菩萨的境界中醒来。或者用地狱的说法：菩萨的志向是去地狱，因为那里有需要他帮助的众生。唯有“自我”想去天堂，具有讽刺意味的是，这意味着“自我”其实已在自己的地狱里了。


    意欲得乐的我，总是用我得乐的成功度来称量幸福。那是因为我的出发点是虚幻的、割裂的自己。释迦牟尼佛则谈到一种不同的发心，一种不同的居心（精舍），有时候他把这种居心称作“四无量”，这与我对幸福的斤斤计较的称量方式（我需要得到我自己的幸福，我祝福别人，只要他们不妨碍我）形成了鲜明的对比。


    四无量，常被称作“四无量心”。精舍就是精神的居所或处所。它是一个人的根基所在，是人的来处，是我们的“意”的落脚处。虽然佛是生他、养他的婆罗门文化的叛教者，比如他认为婆罗门种姓独霸了本应为众生所共有的灵性生活，但是他仍然沿用了婆罗门的许多主题，并借用了婆罗门的许多名称。这算是婆罗门精舍，但这不过是个名字而已；倘若超越一切名，它实际上来自四无量意的精舍——四无量意，即“意”经历尘世的四种方法，从尘世本身的无量地和我们自身的无量地。


    有四种禅观，即四种佛果。第一个或许最为人所知，即所谓的慈心，也就是平常所说的慈爱，积极主动地去疗愈、施救、援助、善待他人。第二个是悲心，悲心与慈心的联结在于，悲心不把他人的痛苦视为他人的问题，而是感同身受，如同自己的问题。观世音菩萨，即中国人所说的观音，听闻尘世众生的所有哭喊。菩萨的理想就是：只要这世界上还有苦痛，那就放弃一己的觉醒。那么，既然苦痛永远存在，菩萨也就从来不受自利心的驱使。菩萨弃绝居高临下的怜悯，如同弃绝恶意与残忍。


    第三个就是喜心，懂得并分得他人的欢喜。喜心是根植于前两种心的，它格外强调的是这四种居心的无量地。喜心是自我克服尼采那著名的“无名怨愤”，即因为你的幸福和成功像镜子一样映照出我自己的痛苦、悲伤和失败感，所以我对你产生的恶意。喜心不受自尊心的掺杂和污染，将他人的成功视为与我自己的幸福紧密相关的事情（如同我的孩子在学校得了好成绩，或我支持的运动队得了冠军）。他人的幸福不但不会养成我的无名怨愤，甚或我的忌妒心，反而会给我欢喜。我以他人的欢喜为欢喜。这种喜心甚至超越了亚里士多德在《尼各马可伦理学》中所提及的一种美德：亚里士多德提出的这种美德是义愤，即对他人不劳而获的幸福产生正义的愤慨，它介于对他人理所应得的幸福的公然忌妒（即满怀敌意和羡慕）和最黑暗的另一极端幸灾乐祸之间。在佛法里，悲心排除了恶意，而喜心清除了忌妒。不过，亚里士多德认为对于他人不劳而获的幸福产生义愤是正当的。我们觉得不快的是他人仅仅因为幸运而兴旺发达。从喜心的角度来看，这也是染上了义愤。我帮助你不是因为你配得帮助。我帮助你是因为你在承受痛苦。可是说到底，谁的幸福真是当之无愧的呢？无论如何，喜心只是为他人的幸福而欢喜。


    第四个居心是舍心，即安详和镇静之心。舍心是不同于喜心的，因为喜心还是在滋生贪执，即对欢喜和幸运上瘾，甚至对觉悟的极乐上瘾。不要把这个舍心混同为冷漠，包括对他人的困境感到漠然和冷淡，仿佛认真对待他人的痛苦会把我太深地拖进人类世界那污泥浊水般的糊涂账里。舍心消解的是贪执心，但并不弃世，并不推卸对世界的责任。舍心是以和平的态度给予世界照顾，并关心一切众生。尽管全球性的大流行病令人难过，但不应该把它错认为是一种对我的幸福的威胁，而是一种对我们共有的集体自我的深层关怀的唤醒。


    ### 第二，不要害怕


    一眼看去，四无量心是纸上读来样样好，落实起来处处难吧！这简直就像一个诱人的童话，但是在全球新型冠状病毒大流行期间，我们难道不需要变得更务实些吗？何况与即将到来的生态性危机和全球性不公所引发的种种烦恼挣扎相比，新型冠状病毒的全球大流行不过是小巫见大巫！


    这样的抗议，哪怕是出于好意，也是不合时宜的。首先，这些危机所暴露出来的是我们的道德想象力的匮乏。我们原本已经太务实了，竟然希望世界人口中的大多数会停止抱怨，学习热爱他们所承受的不平等，毫不介意我们人类种族为财富向顶层的百分位数持续转移所付出的代价——那就是不仅大部分人类深陷不稳定和痛苦，地球本身也深陷不稳定和痛苦。我们对世界秩序的委曲求全，预计将造成超过100万种生命形式的灭绝，我们早晚必将承受它所带来的种种恶果。而这不过是我们为人类自身的灭绝所缴纳的首付款。激进与不切实际的，不是四无量心，而是我们对“一切照常”的奴性。


    我们自己的务实主义不仅是一种妨碍我们正视自身既无能力又无志气之现实的自欺；它还斥责四无量心有所缺欠，而这种反应来自一套假设中的一个假设——我们想象自己必须向内求得四无量心，才能做到有备无患，应对自如。然而，这种自我的匮乏感不仅令人发指地无用，而且恰恰是问题的根源所在。比如，我们对病毒的迅速传播感到惊讶，甚至震惊。然而，科学家已经年复一年地发出警告，毁灭性的大流行病即将发生，这世界却令人痛心地毫无准备。我们原以为会发生什么呢？既然各国都在赌病毒会“神奇地”消失，经济事务会一如既往，那我们为什么还要对这场不顾后果的赌局的下场感到惊讶呢？而这不过是冰山一角。我们知道在接下来的几年中，全球气温平均将提升2摄氏度，这将是“灾难性的"。《巴黎气候协议》虽然代表着我们向正确的方向迈了一步，可普遍看来，就连它那不足以逆转危机的要求，我们也未能切实做到。简而言之，气候告急只是全球生态危机的一个方面，除此之外我们还面临生物区的毁灭、空气污染和水污染、居住地锐减、不可持续的人口增长等问题。另外，全球经济秩序建立在经济不断增长的预期之上，但是我们已经看到这种增长前景存在很大的局限。比如，全球经济都依赖化石燃料，但是继续燃烧化石燃料的生态代价是我们无法承受的，而且化石燃料也在迅速耗尽。还有，全球经济若是保持现有轨道，不仅会导致灾难性的气候变化，而且地球的资源根本不足以支撑我们实现全球财富持续增长的诺言。大流行病所暴露的不是发生在我们身上的问题，而是我们就是问题。


    如果我们就是问题，那么对那些尽力让我们认清问题的本质并提供了更加深刻的、截然不同的出发点的法门予以斥责就没什么道理了。比如，四无量心不是基于人类的自利心，而是基于万物（包括我们人类在内）的无量地。理解当下问题的一个方法是去思考陀思妥耶夫斯基在其早期小说《地下室手记》（1864年）中提出的开创性洞见。它的叙述者几乎在所有他接触的人类面前都是隐形的，可是他无意改变自身所处的困境，而是要拼命争取一个更公正、更平等的世界。更有甚者，他主张他拥有愚蠢的权利。他愤懑地坚持他自己的自由，坚持他想做什么就做什么的权利。在我的国家，这类坚持包括：人类的自由给了我们在大流行病期间不戴口罩的权利，哪怕不戴口罩会将他人的生命置于危险之中。你竟敢妨碍我的自由！我主张我的自由！然而，人类的自由就是我们想做什么就做什么的权利吗？就是反抗“某些精确计算、详细规范、令世界再无任何行动和历险之余地的善意提示”吗？[![](
    `images/00007.png` )]( `#part0009.html#note92n` )


    这个地下室人坚称，他有权力宣布`2+2=5`。这并非一种戏剧化的存在宣言，宣称我们的自由实乃荒谬，那不过是某些读者草率做出的时髦臆测。它实际上是将自由归为人类的自我中所固有的东西，并主张拥有向一切妨碍这自由的事物开战的权利。正是我们认定自己拥有向地球开战的自由引发了生态危机。正是我们对动物权利的忽视（这表现为工厂化养殖和动物栖息地被毁灭），在加速从畜到人疾病的传播，包括新型冠状病毒。然而，我们却继续在这个问题上加大赌注，仿佛解决之道就是以种种新形式的人类霸权来解决人类霸权所造成的恶果，包括将气候变化想象成“不过是”另一个工程问题。我们主张自己拥有为所欲为的权利，为了让这种主张合情合理，我们找到了各种技术，来证明`2+2=5`。我们试图征服地球，迫使地球臣服于我们的自由，而不是与地球合作。所以，我们所追求的自由，不是蕴含于自然的自由之中（如佛法和道家所说的），而是存在于我们任性的战斗中，战斗的目的就是将我们的自我凌驾于自然之上。


    虽然这个全球神话现在极为盛行，但它是建立在扭曲了我们与自然之关系的自欺之上的。在我们将自身与自然对立起来的自我宣言中，我们忘记了我们的存在本身完全依赖于自然。我们是地球生物，我们一路进化而来的结果是只有在这种极其独特的恒温恒湿膜里才能生存和繁衍。因此，人类生命的存在，不仅要依赖地球，而且要依赖这种极其独特的气候环境，这种气候环境一旦失去则意味着地球仍将继续，生命仍将进化，而我们却要自我灭绝了，因为地球的各种生物区无法再支持人类生命。此外，在这个恒温恒湿膜内，我们还依赖清洁的饮用水、可食用的食物、可耕种的健康土壤、可呼吸的清洁空气。就此而言，自由是基于动态进化的因，和生命与生存的缘。自由的危险在于它在自我中的错位，使我们毁灭性地背离我们的因与缘。我们存在着，仅仅是因为这独一无二的、极度敏感的、可生可灭的地球时刻存在着。


    由于我们的这种任性，我们在有意或无意间，成了我们自身痛苦的帮凶——为了调教这种任性，佛法倡导空，而空法是展示一切事物（包括我们自己在内）都没有所谓的“自在”，即独立的、同一的、自主的、自立的存在。从常规上讲，我们总是想象自己首先是以自我的形式独立自主存在的，但是这只是一种抽离的认识，在这种认识里我们忽略了我们与其他众生动态共享的、隐含的因与缘。例如，如果我只是我，我并非水、食物、氧气、教育、语言、家教、适宜的生存条件，那么我们完全可以把所有这些隐含的相互依存因素都拿掉，而我依然是我。但是，如果真的将那些因素都拿掉，我就会消失，因为我是所有那些因素的动态性的相互关联。这是理解佛有关存在的论说的一种方法。存在不是所有独立存在的事物的集合，而是更加实在，更加亲密的无我、无常、空和缘起。


    自然不是原子式的众生的集合，人类也并非原子式的众生的集合，尽管人类出于自毁的习气总是声称自己不过是原子的集合而已。道家和东亚佛学所说的自然，从本质上说是自然的、自发的，不是虚妄的自我动因的强求，而是互相提升的生命之间的动态的相互依存，每一生命皆存在于其他生命之中，并通过其他生命而存在。目前，世界在大流行病期间所遭受的痛苦来得莫名其妙（尽管其中很多痛苦早有预言，且可预防），这恰好暴露出我们这自我毁灭的危险道路的某些特征。可是，哪怕我们继续在自我毁灭的危险道路上一意孤行，作为缘起的自然仍然不会止歇。自然永不止歇。当下的境况更清楚地暴露了缘起的两个方面的真相：第一，我们可以理解自然本身是“一个自由度系统”，这是用伟大的19世纪德国哲学观来表述的。自然就跟道一样，从根本上说是既不可道又无穷尽的，但是从万物的层面来说，它又是相互依存，因而系统地逐渐展现出来的；第二，尽管自然永远是一个系统的问题，系统却并非自然而然就健康。生物区可能崩溃并陷入“失控”。新型冠状病毒暴露了系统的腐败，包括种族歧视、性别歧视、阶级歧视，以及我们的经济与政治生态的失衡。从更广泛的意义上讲，我们被赋予了另一个机会，去直面我们所现身的自然系统和我们所生活的经济、政治系统之间的不平衡和不友善。


    因此，四无量心意味着我们能够从“我们有权愚蠢”的迷幻中觉醒，并意识到我们就像那构成我们自身的动态相关的种种关系一样健康和良善。在那小气而吝啬的自私之自我的想象里，四无量心是可望而不可即的，可是那种想象不过是一个我们必须从中苏醒的噩梦，是一个我们必须挺身担当起相应的护理与责任的系统警报。这是大事，是一等一的大事，如果对此置之不理，那么我们无论付出多少努力都将徒劳无功。

    '
  trans: '

    Although the distribution of loss is skewed and unjust, we can still understand
    that the whole world is in grief—one suffers, all suffer; one mourns, all mourn.
    Many people, even those fortunate enough to have escaped the crisis''s lethal
    blow, still anxiously wonder if they will ever be happy again. This crisis may
    also exacerbate our pre-existing unhappiness, making us more doubtful that personal
    happiness is attainable, except for a few lucky wealthy people. This brings us
    back to the first question at the core of this reflection: from the perspective
    of the Buddhadharma, how can I be happy, whether during the novel coronavirus
    pandemic or in the broader expanse of time?


    This question carries some unspoken assumptions. In English, the root of *happiness*
    is *hap*, meaning luck or fortune; from this angle, it is easy to understand its
    connection to words like *happen* (to occur, to come to pass) or *happenstance*
    (chance occurrence, born of luck). When I want happiness, I hope the dice roll
    the numbers that make me a winner, that I get more of what I want. I want things
    to happen the way I want them to happen. To some extent, this is unavoidable.
    For instance, if we want to breathe, we should want the air to be breathable,
    and be willing to strive to ensure it is. But in any case, we should acknowledge
    that happiness—wanting things to happen our way—is bound up with another assumption:
    happiness is *me* getting what *I* want; the appeal to luck is led by *me*. Happiness
    is getting the world I want.


    There are many problems with this appeal, problems well-known and which ethics
    have always sought to ameliorate. What if what I want hinders what you want? Ethics
    and law are brought in to adjudicate such inevitable conflicts. But when we demand
    the world submit to my will and give me everything I want, we can also see the
    world presenting two deeper levels before our eyes. First, this demand creates
    conflict—both with the world I try to subdue and with others—whose demands for
    happiness obstruct my demand for happiness. Second, this craving is not only potentially
    aggressive and combative; it also betrays an implicit condition: *I am unhappy*,
    the world I inhabit is deficient, incomplete, and I am ill at ease in it.


    Thus we can see that the very posing of the question "How can I be happy?" may
    itself be a symptom of what the Buddha called *dukkha* (suffering/unsatisfactoriness)—Shakyamuni
    Buddha diagnosed *dukkha* as the First Noble Truth of life; it is a persistent
    impermanence, an ill-at-ease-ness and imbalance in encountering events. The more
    I want happiness, the more I aggravate this root problem—and this root problem
    is the "I," the "I" that has long felt ill at ease with itself and the affairs
    of its world. The unavoidable irony lies precisely here: the more "I" seek happiness,
    the deeper I sink into my implicit unhappiness.


    It is for this reason that many Dharma teachings emphasize a kind of awakening—a
    way to wake from sleepwalking—in which the more I try to escape, the more I aggravate
    my suffering. Alcoholics or drug addicts self-medicate to relieve the pain of
    their thoughts or lives, but such measures do not touch the root of suffering;
    they only numb the self. Pursuing vast wealth certainly looks like a way to improve
    one''s situation, but soon the pursuit itself becomes the end, and I become its
    slave. Because I cannot see that the root of the symptom is "I pursue suffering
    as if suffering were the cure for suffering," this pursuit persists, unabated.


    This blindness is the core of the "Three Poisons" (the three kleshas), namely
    ignorance, or *avidya* (ignorance/nescience). The latter refers to the inability
    to see; broadly speaking, I also cannot see *that* I cannot see. My blindness
    prevents me from seeing my blindness; or my illusion makes me see only my illusion.
    It is as if my consciousness were a dusty mirror, with no memory of when it was
    undusty. Whatever this mirror reflects is gray and dim. Even placing more dazzling
    or expensive things before this mirror does not solve the problem; one must first
    find a way to wipe the dust from the mirror, and to do that, one must realize
    that one''s mirror of consciousness *has always been dusty*—this is no easy task,
    because the mirror is too dusty to know it is dusty. Or, it is like having a piece
    of excrement hanging on my nose: whatever you let me smell, I only smell the stench.
    To smell the infinite fragrance of the universe in Zen, I must first awaken, become
    aware of the fact that I have a stinking nose, and then find a way to wipe my
    nose clean. Otherwise, I will blame the world for the stench, rather than my own
    nose. But if I only know my nose is an organ through which I experience this continuous
    stench—deemed by me to be caused by my life and world—how do I suddenly get the
    whimsical idea to dream of smelling the universe''s boundless fragrance? *Dukkha*—experiencing
    the vexation brought by an imbalanced life—is not the platitude that "all beings,
    all things" must suffer. Sudden *dukkha* is a realization; it shatters the stench-laden,
    dust-covered common sense at the bottom of our experience. The aspiration to practice—polishing
    the mirror, wiping the nose—is itself the Great Awakening Dogen speaks of.


    Nothing illustrates this problem better than the craving of the dusty consciousness—what
    it craves is spiritual abundance, even the Pure Land or the heavens spoken of
    in other gates. Indeed, scriptures are full of jewel imagery and promises of the
    Pure Land, visible in many places, including orthodox Pure Land Buddhism. But
    if the original problem is our inability to see the irony that "our insistence
    on pursuing happiness precisely perpetuates and aggravates our unhappiness," then
    we cannot recognize the truth of the teachings that guide us to see the root of
    our unhappiness. Our powerlessness to see the root of the problem *is* the root
    of our problem. This problem is mentioned in the *Lotus Sutra*, called the issue
    of "expedient means" (*upaya*). In the Parable of the Burning House, which resonates
    with the Buddha''s famous Fire Sermon imagery, the Buddha asks Shariputra to imagine
    a wealthy elder''s house catching fire. He knows he can easily escape, but his
    children remain inside, absorbed in play (craving and addiction), utterly unaware
    of flames closing in from all sides. The father tries every way to warn the children
    of the imminent danger, but they do not understand what he is saying. They do
    not even know what a house is. Naturally, in their eyes, money, fame, and power
    are the most valuable, most real things! What else could matter besides these?
    So the father devises an emergency, expedient, fictional method—this is a clever
    antidote, concocted to penetrate his children''s various illusions born of ignorance.
    He must speak a language the intoxicated, sleeping, delirious children can understand,
    so he promises them everything they want—given their current state, he promises
    that outside the house are even more wonderful, more magnificent toys waiting
    for them. The children''s hearts ignite like fire; they all run out of the house.


    The Buddha asks Shariputra: is this father guilty of lying? Shariputra already
    understands: the father has led his children onto the path of awareness, though
    they do not yet comprehend. The Buddha''s teachings are not straightforward assertions
    demanding agreement. The Buddha''s teachings are good medicine, methods of liberation,
    secretly bringing awakening to us like sewing a jewel into the hem of our robe.
    We suddenly realize the Buddha is in all places, all things, even in that burning
    house. That is, the burning house (the First Noble Truth is *dukkha*) drives us
    toward the Dharma, but the Dharma itself manifests in all existence, even in the
    burning house that initially appears entirely opposite to the Dharma. So the problem
    is not the burning house itself, but our own inability to break through the obstacles
    of our dusty mirror and excrement-hanging nose. The burning house *is* our own
    ignorance.


    Although Pure Land Buddhism starts from our longing for the Pure Land, its teachings
    emphasize that we fundamentally cannot reach the Pure Land by our own power or
    effort. Only when we realize we are indeed foolish beings does our self cease
    to obstruct our arrival at the Pure Land—which was there all along. In this regard,
    a further hint can be given regarding the craving for heaven (finally escaping
    to a place where we can get everything we want): only the deluded self wants to
    enter heaven; therefore, one can skillfully use the teaching of heaven to refute
    heaven itself (using my longing for bliss to counter the self attached to heaven,
    overcoming self with motion), or simply let it—this surface symptom of the root
    problem—continue to worsen.


    From the perspective of awakening, if there truly are heaven and hell, then what
    we should aspire to is hell. At first glance, this seems contrary to our most
    basic desire for happiness. Indeed, it is. But this seemingly most basic desire
    prevents us from realizing the Bodhisattva ideal: as long as even one sentient
    being remains suffering without liberation, I will not seek enlightenment and
    liberation for myself. This is the first of the Four Great Vows (Sentient beings
    are numberless; I vow to save them all). Given that this vow can never be fulfilled—suffering
    exists forever—I realize I practice not for myself, but for others. Or rather,
    I practice taking myself as one "other" among many others, not as a "self" distinguished
    from others. That "I" who is willing to attain joy awakens in the Bodhisattva
    realm for the sake of others. Or in the language of hell: the Bodhisattva''s aspiration
    is to go to hell, because there are beings there who need help. Only the "self"
    wants to go to heaven; ironically, this means the "self" is already in its own
    hell.


    The "I" that desires happiness always measures happiness by the degree of *my*
    success in obtaining it. That is because my starting point is an illusory, separate
    self. Shakyamuni Buddha speaks of a different *bodhicitta* (aspiration), a different
    *vihara* (abiding/mental dwelling), sometimes calling this abiding the "Four Immeasurables"
    (*Brahmaviharas*), which stands in stark contrast to my calculating, stingy way
    of measuring happiness (I need to get my own happiness; I bless others, provided
    they don''t hinder me).


    The Four Immeasurables are often called the "Four Immeasurable Minds." *Vihara*
    is the abode or locus of the spirit. It is where a person''s foundation lies,
    where they come from, where our "mind" (*citta/manas*) rests. Although the Buddha
    was a rebel against the Brahmin culture that birthed and raised him—for instance,
    he believed the Brahmin caste monopolized the spiritual life that should belong
    to all beings—he still adopted many Brahmin themes and borrowed many Brahmin names.
    This is called the "Brahmin Vihara," but that is just a name; if one transcends
    all names, it actually comes from the Vihara of the Four Immeasurable Mind—the
    Four Immeasurable Minds, the four ways the "mind" traverses the world, from the
    world''s own boundlessness and our own boundlessness.


    There are four meditative absorptions (*dhyana*), the four fruits of the Buddhist
    path. The first is perhaps the best known: the so-called *Maitri* (Loving-kindness),
    commonly called benevolence—actively healing, saving, helping, treating others
    well. The second is *Karuna* (Compassion). Compassion connects with loving-kindness
    in that it does not regard others'' suffering as their problem, but feels it as
    one''s own. Avalokiteshvara Bodhisattva (Guanyin in Chinese) hears the cries of
    all beings in the world. The Bodhisattva ideal is: as long as there is suffering
    in this world, abandon one''s own awakening. Since suffering exists forever, the
    Bodhisattva is never driven by self-interest. The Bodhisattva renounces condescending
    pity, just as they renounce malice and cruelty.


    The third is *Mudita* (Sympathetic Joy)—understanding and sharing in others''
    joy. Sympathetic joy is rooted in the first two minds; it especially emphasizes
    the boundlessness of these four abodes. Sympathetic joy overcomes Nietzsche''s
    famous *ressentiment*—the malice toward you because your happiness and success
    mirror my own pain, sadness, and sense of failure like a mirror. Sympathetic joy,
    unpolluted by the admixture of self-esteem, regards others'' success as intimately
    related to my own happiness (like my child getting good grades, or my team winning
    a championship). Others'' happiness not only fails to breed my *ressentiment*,
    let alone my jealousy, but gives me joy. I take joy in others'' joy. This sympathetic
    joy even surpasses a virtue mentioned by Aristotle in the *Nicomachean Ethics*:
    Aristotle''s virtue is *nemesis* (righteous indignation)—righteous anger at others''
    unearned happiness—situated between open jealousy of others'' deserved happiness
    (full of hostility and envy) and the darkest extreme, *schadenfreude*. In the
    Dharma, compassion excludes malice, while sympathetic joy clears away jealousy.
    However, Aristotle considers righteous indignation at others'' unearned happiness
    justified. We are displeased that others prosper merely by luck. From the view
    of sympathetic joy, this too is tainted by *nemesis*. I help you not because you
    deserve help. I help you because you are suffering. But in the end, whose happiness
    is truly deserved? In any case, sympathetic joy simply rejoices in others'' happiness.


    The fourth abode is *Upekkha* (Equanimity)—a mind of serenity and calm. Equanimity
    differs from sympathetic joy because sympathetic joy still breeds attachment—addiction
    to joy and good fortune, even addiction to the bliss of enlightenment. Do not
    confuse this equanimity with indifference—including apathy and coldness toward
    others'' plights, as if taking others'' suffering seriously would drag me too
    deep into the muddy, turbid accounts of the human world. Equanimity dissolves
    the attaching mind, but does not renounce the world, does not shirk responsibility
    for the world. Equanimity gives care to the world with a peaceful attitude and
    concerns itself with all beings. Although the global pandemic is saddening, it
    should not be mistaken for a threat to my happiness, but as an awakening of deep
    care for our shared collective self.


    ### Second, Do Not Be Afraid


    At first glance, the Four Immeasurables seem like a fairy tale—beautiful on paper,
    impossible in practice! This is simply an alluring fable, but during a global
    novel coronavirus pandemic, don''t we need to be more practical? Moreover, compared
    to the vexations and struggles triggered by the impending ecological crisis and
    global injustice, the global pandemic is but a minor spectacle!


    Such protest, even if well-intentioned, is untimely. First, what these crises
    expose is the poverty of our moral imagination. We have already been too practical,
    hoping the majority of the world''s population would stop complaining, learn to
    love the inequality they endure, and not mind the price the human race pays for
    the continuous transfer of wealth to the top percentile—that is, not only the
    vast majority of humanity mired in instability and suffering, but the Earth itself
    mired in instability and suffering. Our complacent accommodation of the world
    order is projected to cause the extinction of over a million species; we will
    sooner or later suffer the consequences. And this is but the down payment for
    our own extinction. It is not the Four Immeasurables that are radical and impractical,
    but our servility to "business as usual."


    Our own pragmatism is not only a self-deception that prevents us from facing the
    reality of our own incapacity and unwillingness; it also denounces the Four Immeasurables
    as deficient, a reaction stemming from one assumption in a set of assumptions—we
    imagine we must cultivate the Four Immeasurables inwardly to be prepared and cope
    with ease. Yet this sense of self-lack is not only hideously useless; it is precisely
    the root of the problem. For instance, we are surprised, even shocked, by the
    virus''s rapid spread. Yet scientists have warned year after year that a devastating
    pandemic was imminent, and the world was heartbreakingly unprepared. What did
    we think would happen? Since nations were betting the virus would "miraculously"
    disappear and economic affairs would continue as usual, why are we surprised by
    the outcome of this reckless gamble? And this is just the tip of the iceberg.
    We know that in the coming years, global average temperatures will rise by 2 degrees
    Celsius, which will be "catastrophic." The *Paris Agreement* represents a step
    in the right direction, but it is generally acknowledged that even its insufficient
    requirements have not been met. In short, the climate emergency is only one aspect
    of the global ecological crisis; beyond that we face bioregional destruction,
    air and water pollution, sharp habitat reduction, unsustainable population growth,
    and so on. Furthermore, the global economic order is built on the expectation
    of endless growth, but we have seen the severe limits of this growth. For instance,
    the global economy depends on fossil fuels, but the ecological cost of continuing
    to burn them is unaffordable, and fossil fuels are rapidly depleting. Also, if
    the global economy stays on its current track, it will not only lead to catastrophic
    climate change, but the Earth''s resources are simply insufficient to support
    the promise of continuous global wealth growth. The pandemic exposes not a problem
    happening *to* us, but that *we* are the problem.


    If we are the problem, then it makes no sense to denounce the gates that strive
    to make us recognize the nature of the problem and offer a deeper, radically different
    starting point. For example, the Four Immeasurables are based not on human self-interest,
    but on the boundlessness of all things (including us humans). One way to understand
    the current predicament is to consider the pioneering insight Dostoevsky offers
    in his early novel *Notes from Underground* (1864). Its narrator is virtually
    invisible before almost everyone he encounters, yet he has no intention of changing
    his predicament; rather, he fights desperately for a more just, more equal world.
    Worse, he insists on his right to be stupid. He stubbornly insists on his own
    freedom, on his right to do whatever he wants. In my country, such insistence
    includes: human freedom gives us the right not to wear masks during a pandemic,
    even if not wearing masks endangers others'' lives. How dare you impede my freedom!
    I claim my freedom! But is human freedom the right to do whatever we want? Is
    it rebellion against "certain precise calculations, detailed specifications, well-meaning
    hints that leave no room for action or adventure in the world"? ![](img/ `#part0009.html#note92n`
    )


    This Underground Man insists he has the right to declare `2+2=5`. This is not
    a dramatized existential declaration proclaiming our freedom is absurd—that is
    merely a fashionable conjecture some readers hastily make. It actually reduces
    freedom to something inherent in the human self, and asserts the right to wage
    war against everything that hinders this freedom. It is precisely our assertion
    of the freedom to war against the Earth that has triggered the ecological crisis.
    It is precisely our disregard for animal rights (manifested in factory farming
    and destruction of animal habitats) that accelerates the spread of zoonotic diseases,
    including the novel coronavirus. Yet we continue to double down on this problem,
    as if the solution to the consequences of human supremacy is human supremacy in
    new forms, including imagining climate change as "merely" another engineering
    problem. We claim the right to do as we please, and to make this claim seem reasonable,
    we find various technologies to prove `2+2=5`. We try to conquer the Earth, force
    it to submit to our freedom, rather than cooperate with it. So the freedom we
    pursue is not the freedom inherent in nature (as spoken of in the Dharma and Daoism),
    but exists in our willful battle, a battle to elevate our self above nature.


    Although this global myth is now rampant, it is built on self-deception that distorts
    our relationship with nature. In our self-declaration opposing ourselves to nature,
    we forget that our very existence depends entirely on nature. We are Earthlings;
    the result of our evolution is that we can only survive and reproduce within this
    extremely unique homeostatic membrane. Therefore, the existence of human life
    depends not only on the Earth, but on this extremely unique climate environment;
    once lost, it means the Earth will continue, life will evolve, but we will have
    self-extincted, because the Earth''s bioregions can no longer support human life.
    Moreover, within this homeostatic membrane, we depend on clean drinking water,
    edible food, healthy cultivable soil, breathable clean air. In this regard, freedom
    is based on the dynamic causes of evolution and the conditions of life and survival.
    The danger of freedom lies in its misplacement within the self, causing us to
    destructively deviate from our causes and conditions. We exist only because this
    unique, extremely sensitive, viable-yet-perishable Earth exists moment by moment.


    Due to this willfulness, we have intentionally or unintentionally become accomplices
    to our own suffering—to discipline this willfulness, the Dharma advocates Emptiness
    (*Sunyata*), and the Dharma of Emptiness demonstrates that all things (including
    ourselves) lack so-called "self-existence" (*svabhava*)—independent, identical,
    autonomous, self-sustaining existence. Conventionally, we always imagine we exist
    first as an independent self, but this is only an abstracted cognition, in which
    we ignore the dynamic, implicit causes and conditions we share with other beings.
    For example, if I am just me, and not water, food, oxygen, education, language,
    upbringing, habitable conditions, then we could completely remove all these implicit
    interdependent factors, and I would still be me. But if those factors were truly
    removed, I would vanish, because I am the dynamic interrelation of all those factors.
    This is one way to understand the Buddha''s discourse on existence. Existence
    is not a collection of independently existing things, but something more real,
    more intimate: *anatta* (non-self), *anicca* (impermanence), *sunyata* (emptiness),
    and *pratityasamutpada* (dependent origination).


    Nature is not a collection of atomistic beings; humans are not a collection of
    atomistic beings, although humans, out of self-destructive habit, always claim
    to be merely a collection of atoms. Nature as spoken of in Daoism and East Asian
    Buddhism is, essentially, natural and spontaneous—not the forced striving of the
    false self, but the dynamic interdependence of mutually enhancing lives, each
    life existing within others and through others. Currently, the suffering the world
    endures during the pandemic arrives bafflingly (though much was prophesied and
    preventable); this just exposes certain features of our self-destructive dangerous
    path. Yet even if we persist willfully on this dangerous path of self-destruction,
    nature as dependent origination will not cease. Nature never ceases. The present
    situation more clearly exposes two aspects of the truth of dependent origination:
    first, we can understand nature itself as a "system with one degree of freedom,"
    expressed in the view of great 19th-century German philosophy. Nature, like the
    Dao, is fundamentally both ineffable and inexhaustible, but from the level of
    all things, it is interdependent, thus systematically unfolding; second, although
    nature is forever a systemic problem, the system is not automatically healthy.
    Bioregions can collapse into "runaway" states. The novel coronavirus exposes systemic
    corruption, including racism, sexism, classism, and the imbalances of our economic
    and political ecology. In a broader sense, we are given another opportunity to
    confront the imbalance and hostility between the natural system we manifest and
    the economic and political systems we inhabit.


    Therefore, the Four Immeasurables mean we can awaken from the delusion that "we
    have the right to be stupid," and realize we are as healthy and wholesome as the
    dynamic interrelations that constitute us. In the imagination of that petty, stingy
    selfish self, the Four Immeasurables are unattainable, but that imagination is
    merely a nightmare we must wake from, a system alarm we must rise to meet with
    corresponding care and responsibility. This is a great matter, a matter of the
    highest order; if ignored, all our efforts will be in vain.


    '
