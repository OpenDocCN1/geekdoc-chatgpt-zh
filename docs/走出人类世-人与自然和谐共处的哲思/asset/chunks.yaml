    ## 从新冠肺炎疫情反思高科技崇拜


    **张祥龙**


    ![](images/00013.jpeg) ![p076](images/00001.jpeg)


    自新冠肺炎疫情暴发以来，笔者与亿万国人一样，终日忧心忡忡，盼望“拐点”到来，祈祷疫情消退。2003年，我们经历了“非典”，举国震荡。但这次的疫情看来更加凶猛，病毒更加难驯，传染性也更强。值此时刻，除了做些力所能及的预防举措之外，笔者深居宅中，却不能不思考这类疫情一再出现给予我们的某种警示。截至本文写作时[![](images/00007.png)](#part0005.html#note20n)，笔者看到了不少带有各种倾向的相关评议，但将这种瘟疫现象与高科技崇拜关联起来的，似乎还未见到。


    首先，我们要承认两个事实：第一，疫病是人类历史上经常出现的灾害；第二，源于西方的高科技，尤其是医学和药学领域的高科技，在近现代是抵御威胁人类的某些疾病的一种利器，比如青霉素之于炎症感染，各种疫苗之于传染病，手术之于白内障、阑尾炎、牙疾、外伤、难产，等等。总的来说，现代医学的高科技及其相关认知（比如有关疾病来源和公共卫生必要性的认知）有力促进了人类寿命的延长[![](images/00007.png)](#part0005.html#note21n)，毋庸置疑是人类取得的重大成就。但是，事情还有另外一面。如果将这些高科技奉为相关领域的唯一真理，排斥其他科技[![](images/00007.png)](#part0005.html#note22n)和知识，则会陷入高科技崇拜，而这种崇拜对于中华民族乃至人类的生存是不利的，甚至是危险的。本文想结合这次新冠肺炎疫情来论述这一判断。


    基于上述所言，读者应该已经明了，笔者并不反对高科技本身，对这种高科技的积极成果也给予了高度评价。笔者认为，需要批评和抛弃的，仅仅是对高科技的崇拜。接下来，笔者将主要回答这样一些问题：什么是“高科技崇拜”？高科技为什么能取得如此出色的成果？高科技的局限在哪里？高科技崇拜带来了或将可能带来什么危险？这种局限和崇拜在这次新冠肺炎疫情中有什么表现？高科技独大的状态如何能够转变为适度科技的广泛运用？


    ### 什么是高科技崇拜？


    首先，什么是高科技？从字面上讲，高科技就是高端的、先进的、前沿的科学和技术。但从其实质内容上讲，高科技是被充分对象化的、能较快地产生新奇效果——新的生产力、商业利润、诺贝尔奖项，提高科技“异人”的名声，从而提升持有者对自然、对他人的控制力和影响力的新科技。一项科技产品，越是被精确地对象化，也就是数量化和系统形式化，就越容易成为一种具有改造自然事物和人际关系的力量和手段。中医与西医的差异就能很好地说明这个问题。时至今日，西医对于人体和疾病的看法已经相当对象化了。西医认识人的身体主要通过解剖学，由此而得知人体组织、器官、体液和神经网络运行的知识；后来又发现了细胞、细菌、病毒和基因这些更精细的对象，并通过它们来解释人体的形成和疾病的成因及治疗。特别是基因的发现，被视为人类获得了理解和改造生命体（包括人体）的“钥匙”。与之不同，甚至在某些方面相反的是，中医虽然也有自己的有效研究方式，基于阴阳五行、五运六气等理论和假说，充满了时间化或时机化的理解，但它对人体的认知不是精确地对象化或物理空间定位化的。中医对“五脏六腑”的认知，也不等同于解剖学意义上的脏器（这曾成为中医被攻击不科学的理由之一），更多的是功能性的、交叠式的或全局意义上的认知。经络基本上是非对象化的，但又是真实的人体存在，将它还原到某种身体对象上，比如“细胞—缝隙—结缔组织—血管—淋巴—体液（内分泌—免疫）—神经多元系统”，即便有所帮助，也替代不了中医原本范式中直观自明的经络理解。中医通过脉象知晓身体状况和病情，也不是对象化的因果关系可以合理解释的。至于五运六气等时间化的学说，就更与对象化思维挨不着边儿了。所以，中医不是高科技。


    又比如，古代中国人发明了由硫、硝和炭组成的黑火药，这看似是一种对象化研究的成果，但实际情况也不尽如此，它与西方人对火药的发明和运用很不同。华夏古人很早就用硫和硝来治病（故称之为“药”），后来道士为追求长生，使用这些药材炼丹，在这一过程中随机发现了黑火药。之后，黑火药在中国被用于制造杂耍和马戏中的烟火效应，或辟邪和庆典用的爆仗烟花。再后来，黑火药才开始被用于军事，但因未得到充分对象化的研究，其威力不大，很难被精确运用于武器的快速发射和强烈爆炸中。这一情况并未得到朝野的强烈关注，所以这种火药在中国也没能主宰后来的军事发展。中国古代有过许多发明，都是这样不经意地任其作为对象消失了，这是华夏古人的思维方式和价值观所导致的，他们对充分对象化的科技有某种本能的和理性的警惕及忽视，无论儒家还是道家，皆是如此。黑火药经阿拉伯人传到西方，影响了西方人的经验感受。但西方人以更加精准对象化的方式，创造了现代火药。它起源于1771年英国的P.沃尔夫所合成的苦味酸，这是一种黄色结晶体，“黄色火药”的名称便由此而来。在100多年中，火药经诺贝尔等人多次改进，越来越可精确对象化，在现代科技的互联系统中，演化成能够用于机枪、自动步枪、开花炮弹、火箭弹的现代火药，可杀生如麻、炸洞削山。


    毋庸讳言，到目前为止，高科技源于西方，也就是欧洲和北美洲。高科技的方法就是将被研究者加以精密地、系统地对象化，通过预构的假说和实验检测的结合来发现新的突破点。所以，它的理想研究范式是古希腊开创的数学，比如《几何原本》，既有形式化的精确性，又有可计算的推演性和可核查性。当然，为了能够将触角伸向物质自然界，它需要反复实验，但这些经验实践服从于数理化和理论模型化的研究框架，并以此区别于其他文明中产生的“经验性的”科技（这种判断并不准确，下面将论及）。


    其次，什么是高科技崇拜？它是这样一种思想倾向和意识形态，即将高科技当作每个领域、事项的唯一真理，要向全世界无条件地推行，同时将在同一领域和事项中的其他研究或实践方式视为异端邪说，起码是非真理，一定要排斥、打倒而后快和心安。这种崇拜的历史来源或思想方式的来源，主要是西方宗教对于唯一至上神的崇拜。这种宗教坚信自己是关于这个世界和人生的唯一真理，信仰者有责任将其向全世界传播；同时全力排斥其他宗教，包括它们内部的对手，视之为魔鬼唆使的异端邪说。当西方近代科学，比如哥白尼的天文学出现时，他曾遭到天主教教会的严酷迫害，布鲁诺还为此被烧死，但当这种科学和技术取得当年天主教教会的统治地位时，某些人，尤其是一些哲学家乃至政治家就扮演起了教会神父或宗教裁判的角色，宣称高科技的真理垄断权，以及那些不同于它的另类科技的低劣性、虚假性（伪科学性）及有害性。用《旧约》中的话来讲，他们捍卫的是“一个嫉妒的神”（《旧约·出埃及记》，20：5），绝不会容忍信徒们还同时信奉其他的神或替代品。简言之，虽然这些崇拜高科技的人的具体主张与天主教会的主张不同甚至对立，但两者的思想方式是一致的，都是唯我独尊、非此即彼，要争个你死我活。有些科学史家还有根有据地做了这样的论证，即西方近现代科学的出现与西方宗教之间有某种内在关系。[![](images/00007.png)](#part0005.html#note23n)


    有的人会说，科学与宗教的本质是不同的，科学可以被经验证实，从而造福人类，但宗教不能。宗教也许会反唇相讥：科学发现只在某些领域被（暂时）证实有效，但在那些关乎人生大节的事项上，比如人生意义的获得、做出重大抉择的价值依据、屡遭挫折时的信心重建等，科学的学说是无效的，而宗教的真理性却被无数的人生经验证实。


    科学史表明，一个时代的科学真理，可能被后来时代的新发现修正，甚至在某些要点上被推翻，比如牛顿力学被相对论修正，平直空间的设定被推翻。量子力学的某些发现，更是颠覆了以往的多个科学真理，连爱因斯坦当时也接受不了。这表明，所谓通过高科技掌握的真理，并不是绝对意义上的真理（如果那意味着完全符合实际并因此能给人生带来幸福的话），而只是一些会给掌握高科技者增强力量的知识和技术。所以，高科技崇拜所真正崇拜的并非真理，而是力量，而且是不断增强的力量，因为高科技实际上是永远还不够高、总要更高的科技。


    ### 高科技为什么能取得如此出色的成果？


    按照目前通行的衡量标准，相对于其他文明和文化的科技，高科技取得了更令人瞩目的成就。其原因何在？前面讲到，高科技通过科学假说和实验检测的结合来运作，而科学假说中浸透了西方形式化数学的精神。所谓经验中的实验检测，甚至某种意义上的科学假说，是各种科技都会实施和提出的，只有假说中的“西方数学因素”为高科技所独有。“数学因素”[![](images/00007.png)](#part0005.html#note24n)，是指让人能做一种自己与自己玩（总有新的组合可能，可判定输赢成败）的形式化游戏的结构。因此，它具有一种内在于形式的推衍能力，让科学假说可以探伸出超经验的预设触角，比如根据某种引力异常推想并计算出某个地方可能有一颗行星，根据某些理论预设推衍出光线穿过大引力场会产生某个角度的偏斜。这样一来，即便后来实验的结果大多不是肯定性的，但从整体上看，这种假说引导下进行的实验一旦应合，其所达到的新奇和随机引发的深度，是其他类型的实验和经验尝试无法抗衡的。这种数学因素深刻影响了整个高科技探索的进程，即便某些学科，比如18—19世纪时的生物学和医学，当时还不能充分体现数学形式。这就是康德讲的“人为自然立法”的格局。人通过所谓先天有效的数学形式和概念化因果推理，形成能够对自然进行精确对象化发问的科学理论和实验设计，在反复的检测和理论修正乃至革新中，严刑拷问自然，逼它吐露出在别的情况下本会隐藏的秘密。所以，科学探索和技术发展在这种研究范式中就不只是对经验的观察、归纳、消化、联想、提炼乃至慢慢体会（如广义的博物学），而是主动的和残忍的（想想那些在动物活体上所做的实验吧）定位逼问。因此，它获得的成果——不论是正面的还是反面的，都是更加突出的、充分对象化的、总无止境的（绝无“止于至善”这一说）和惊人的（如果不是令人惊恐的话）。


    ### 高科技的局限和高科技崇拜的障眼术


    上面的讨论让我们看到，高科技的可怕创新力量建立在它的偏执之上。数学因素既能出奇，又体现出偏执，它让人只看到形式突出者的存在和价值，而且倾向于`A∨￢A`（不是甲就是非甲）的二选一架构。以科学假说加极端化的实验来拷问自然，居然就能拷问出来，本身当然是了不起的成就，却违背了人们的常识，这其中的关键还是数学因素。数学这种似乎是自恋的——直观自明的纯形式化棋艺游戏，却可以透露出茫茫宇宙和大千世界的某种关键信息，对于日常经验的视野而言，实乃不可思议之事。古希腊的毕达哥拉斯提出“数是万物的本原”，却没有讲出很中肯的原因。康德在《纯粹理性批判》[![](images/00007.png)](#part0005.html#note25n)中对此给出的理由是：数学是人类感性直观的纯形式（空间和时间）表达，而人类只能透过这种形式应对世界，就像你永远戴着一副有色眼镜。如果有一种知识，也就是数学，它能展示这副眼镜（首先是镜片）的内在构成机理，那么对你了解世界的秘密肯定大有帮助，起码能够给出重要提示。再者，这种直观纯形式通过将先验的想象力[![](images/00007.png)](#part0005.html#note26n)与知性概念结合，更有助于形成对世界的先天预想或预感。可惜的是，康德后来感到这种先验想象力的中心地位对于观念化理性或统觉的学说形成威胁，就大大压低了它，以至于堵塞了人们对它的深入探讨。[![](images/00007.png)](#part0005.html#note27n)

