    # Reflections on Pandemic, Civilization, and High-Tech Worship


    ## Pandemic and the Absence of the "Third Pole": Reconstructing Civilizational
    Order from a "Life-Based" Perspective


    In the history of humans as a biological species, various pandemics have always
    occurred, but they also always pass. Every pandemic, when it strikes, brings shock
    to the society of that time. However, some pandemics, after passing, leave the
    original society disintegrated, such as the European plague in the 16th century
    that led to the demise of the Aztec Empire; some pandemics, after passing, bring
    earth-shattering changes to society, such as the Black Death in 14th-century Europe
    that triggered the Renaissance; and still others, after passing, see society continue
    to operate in its inherent mode. Judging by the technological capabilities humanity
    currently possesses, the current COVID-19 pandemic will eventually pass.


    But will the contradictions and conflicts mentioned above—those that exist due
    to the absence of the "Third Pole" and cannot be resolved within the existing
    "anthropocentric" or "theocentric" frameworks—disappear with the passing of the
    pandemic? Absolutely not. So what should we do? For those who care about the common
    destiny of humanity, instead of falling into needless anxiety over the pandemic,
    it is better to think seriously about and discuss where to find the "ultimate
    basis for the standards of right and wrong that govern behavior" that can transcend
    the "anthropocentric" or "theocentric" frameworks and serve globalized human society,
    or, in other words, where to reconstruct the "Third Pole" of a three-component
    system with a virtuous cycle that defines "order" and constrains "power." In my
    view, since humans are organisms, and the source of cognition is also the special
    attribute that arises from humans as living systems, human survival and development
    ultimately must obey the basic laws of living systems.


    We know that cellular living systems, including the emergence of eukaryotic cells,
    have a history of 10⁹ years (1 billion years), while human civilization has a
    history only on the order of 10³ years (millennia). The Earth''s biosphere had
    been operating for two to three billion years before humans appeared. The basic
    laws that maintain the continuity of living systems and made the emergence of
    humans possible should provide insights that cannot be ignored for humanity''s
    search for the "Third Pole." A living system is not a specific material molecule,
    nor is it an abstract concept; it is a special mode of material existence. This
    special mode of material existence of living systems relies on the interaction
    of intermolecular forces; it is a relatively stable intermediate state, identifiable
    by humans, within a dynamic process of constant separation and combination. This
    system of thought, which takes the basic laws of living systems as the "ultimate
    basis for the standards of right and wrong that govern human behavior," can be
    called "Biocentrism" (or "Life-Based Philosophy"). How "Biocentrism" should be
    specifically articulated at the level of behavioral norms and standards of right
    and wrong exceeds the scope allowed by the length of this article. But it provides
    a completely new approach for us to define the "order" of human society and constrain
    the "power" that maintains order. Perhaps this will not only help resolve current
    contradictions and conflicts but also help humanity, as a responsible member of
    the Earth''s biosphere, create a brand-new, sustainably developing civilization.


