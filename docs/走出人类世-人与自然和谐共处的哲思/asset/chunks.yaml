    # 病毒、自然与政治：从新冠肺炎看微生物世


    这并不是一次性事件。它一次又一次地发生。


    病毒具有促进变革的巨大力量。由于它们具有在物种间传播、变异和重组，在细胞间拾取和转移遗传物质的能力，它们对细胞生命的进化做出了非凡的贡献。如果没有病毒，哺乳动物就不可能进化；如果我们的基因组中没有病毒的DNA，人类有机体就不可能发育，我们的器官也不可能具备现在的功能。


    如果说人畜共患层面表明我们是动物中的动物，从而消除了我们与自然界之间的差别，那么基因层面则将我们视作病毒世界中细胞演化的偶然产物，从而消除了我们与自然的差别。我们具有的8%的病毒DNA清楚地表明，我们基因组的历史比人类物种的历史早数亿年。而新冠肺炎疫情则清楚地表明，这种演化正在发生。


    第三个层面是将我们视为众多生态系统中的一个生态系统。当单个的真核细胞通过融合进化为最早的多细胞有机体时，它们所处的是微生物的海洋。这些早期的多细胞有机体极其依赖周围的细菌和病毒。事实上，它们将细菌和病毒融合到自己的细胞成分中，并让它们负责监督细胞的自我维护。细菌使其具备了新陈代谢的功能，而病毒则通过杀死那些有可能过度增长而多余的菌群来调节常驻细菌。


    时间并未造成多大改变。现存的每一种已知有机体的体内都有微生物（细菌、古生菌、真菌和病毒）。离开了它们，有机体无法存活，也不可能维持正常机能。我们人类也不例外。人体的每一个器官系统都依赖于细菌代谢物——我们的健康完全依赖于调节这些菌群的病毒。


    令人惊讶的是，病毒的这种调节作用并不是人类所特有的。在所有已知的生态系统中，都可以观察到病毒通过杀死过剩菌群，以维持生态系统良好运转、调节生物多样性的现象。事实上，人类最早是在池塘中发现并着手研究病毒的这种调节作用的，后来该项作用在对人类肠道的研究中也得到了证实。


    让我们稍加思考：对病毒来说，人类的肠道是众多池塘中的一个池塘。有的池塘位于热带雨林、大草原或某个城市的市中心，但人类的池塘位于智人体内。病毒让我们明白，我们人类其实不过是多物种生态系统中的一个而已——众多池塘中的一个池塘。所有系统均由病毒调节。


    还有许多其他层面，也许最耐人寻味的是，调节碳循环的病毒是如何消除我们与生物圈之间的差别的。不过，让我们就此打住，来总结一下新冠肺炎中体现的世界的基本特征。


    > 1. 所有生命都存在于细胞内外的病毒云中。

    >

    > 2. 我们人类与病毒（以及其他微生物）有着悠久的共同历史。它们塑造了我们，是我们身体中的一部分，我们无法与它们区分开来。

    >

    > 3. 我们是微生物——病毒世界中多物种集合体中的一员。我们与它们相互交织、相互渗透，密不可分。


    现代政治构型中隐含的对世界的理解差异再明显不过了。事实上，病毒的运动——可能是从蝙蝠到穿山甲再到人类，使得现代政治观（及其对人类事物、自然事物和技术或人工事物的明确区分）变得不可信，而且站不住脚。


    面对这一情况，我们该怎么办？


    ## 人类、自然界、技术


    让我们从重新定义人类、自然界和技术的概念开始。


    对于霍布斯及其现代追随者来说，自然界是“外面的世界”，即非人类的世界、动物的世界。动物被认为是野兽。据说它们缺乏理性，被不受约束的私利和直接的生理激情（饥饿、性等）支配。因此，人们认为自然界处于战争的恒定状态，是一个充满恐惧、不信任、孤独和死亡的国度。


    霍布斯及其追随者偶尔也会把动物描述成机械行事的自动机，暗示它们是拥有本能但本质上没有智慧的活机器。尤其是在历史哲学出现之后，他们也会将自然界描述为我们曾经属于却已经与之疏远的起源地。他们怀着浪漫情怀哀叹失去的原始智慧。


    源自病毒的自然界显然并非如此。首先，自然界不再是“外面那个”非人类的世界。相反，它囊括了一切事物。没有什么事物可以高于、超越或超出自然界。所有事物，包括人类事物，都是它的一部分。由于自然界不再是“外面那个”世界，人与动物之间的差异也就消失不见了。


    对病毒而言，自然界的第一个重要特征是相互联系。所有有机体都密不可分地相互交织在一起，并且与生物圈交织在一起。事实上，很难在有机体与其所处的生态系统之间划出清晰的界限，就好像有机体的轮廓模糊不清，好像它们渗入了生态系统中一样。这样一来，有机个体与生态系统之间就不存在任何区别——它们采用的自我维护的规则是一样的。


    自然界的第二个重要特征是协作与变化之间的密切关系。所有的生命形式都是（在不同程度上）由深层进化史联系在一起的多物种协作：有机体、细菌和病毒之间的协作，不同种类的细胞和非细胞生命之间的协作。


    有机体为细菌和病毒提供了栖息地，细菌为有机体提供代谢功能，而病毒则是整个协作安排的调节者。这是一个稳定协作的世界，也是一个变化的世界。事实上，变化是协作的一个关键因素。通过细胞间的基因交换以及将自身插入基因组，病毒使特定的多物种有机体能够适应新的环境，从而继续共同进化。认为自然界中不存在竞争的想法当然过于天真。但令人惊异的是，生命演化似乎源自协作——共生，而不是斗争或竞争。


    从新冠肺炎中可以看到，自然界的第三个也是最后一个重要特征是，它突然变成一个充满纯粹的无限可能的领域。无论何时，自然界的可能性都比现实丰富得多。可能存在的生命形式比目前存在的生命形式多得多——任何已知的生命形式总是而且可能永远是短暂的，是时间长河中的一粒尘埃。


    源自新冠肺炎的自然观使得历史哲学变得不堪一击——历史被视为严格意义上的人类事件，在与自然严格分离的过程中不断向前发展。人类自身——与自然界分离、独立、生活在自己的非自然（人工）环境中，无法自我维持。没有任何人离得开生活在人体内和人体表面的细菌、真菌和病毒。如果自然界不再是“外面那个”起源地，那么与现代相对的原始的概念就会消失，殖民主义的逻辑也将不复存在。


    事实上，将人类有机体联结在一起的模式，即各种不同的分子机制，比人类的进化早了数亿年。例如，我们所依赖的不同物种之间的一些信号转导途径的发明就是从生活在原始海洋中的早期多细胞有机体上找到的灵感。像现代主义者那样谈论人类，就像是把野生生物放入培养皿，再加入漂白剂和抗生素，直到里面半数以上的生物都死亡了，然后庆祝勉强存活下来的部分成为“人类”。说得尖锐一些，人类是无菌的抽象概念，是一种幻想的和谐状态。


    这里出现的挑战是，了解人类存在于自然界之中而非之外。以理性为例。如果无法将理性从大脑或神经元中分离出来，如果离开了病毒和我们那8%的病毒DNA，大脑和神经元就不可能进化和发育，那么拥有理性意味着什么？如果无法将头脑与神经递质（由我们肠道中的细菌产生）分离开来，那么有头脑又意味着什么？这种肠道菌群又取决于我们吃了什么食物，以及这些食物是在哪里以及如何生产的。


    或者以技术为例。霍布斯及其追随者将技术概念化为自然界中不存在的人工事物。这里隐含的假设是，自然界是稳定且没有创新的。然而，从进化的角度来看待自然界时，创新会变成什么呢？也就是说，当自然界不再是“外面那个”稳定的背景，而是以新机制、新形式和新过程的进化创新出现在人类面前时，创新会变成什么呢？这样看来，人类的技术创新似乎只是一种生物有机体适应或改造环境的一种形式，而在人类所生活的星球上，存在着各种不断进化的生物有机体。从原则上来说，技术创新和生物创新之间就不存在区别了。


    我们还可以更进一步：一旦我们认识到一些最先进的技术，比如抗生素、质粒或基因编辑技术，实际上是微生物而非人类的发明，技术会变成什么？


    新冠肺炎让我们能够从自然界的角度出发，将人类视作一个课题——这里所说的自然界与处于现代社会核心的自然观截然不同。


    这项挑战很吸引人，因为需要重新思考的概念非常多。


    那么，我们又应如何看待现代政治呢？


    ## 现代政治的局限性


    从新冠肺炎开辟的角度来看，现代政治似乎是一种为捍卫“人类具有独立性”这一幻觉而发明的工具。从本质上来说，现代政治已是一台“区分（人）的机器”。


    通过目前人们对新冠肺炎的反应可以了解这部处于运作之中的机器。政治家、政策制定者和媒体一致认为这种病毒是来自自然界、来自“外面那个”世界的威胁。


    一旦自然与人类之间的界限变得模糊，危险就可能随时出现。暴露在自然界中的人类面临着轮廓模糊、融入自然（无差别化）、陷入“战争状态”（即霍布斯所描述的充满“恐惧、贫穷、邋遢、孤独、野蛮、无知、残酷”的状态）的风险。


    这种将人类与自然界划分为两个截然不同的领域的做法（被称为历史哲学的回声）的一个关键因素是，人们用怀疑甚至是不屑的眼光看待那些生活方式仍与动物相近的人，认为他们“还没有”成功地摆脱自然界，因此更多地属于“外面那个”世界，而不是“这里的”世界，就好像他们依然停留在文明人类或国家早已抛到身后的某种过去。


    现代政治实践需要保护人类免受自然界的侵害。迄今所采取的形式，一方面是就地避难政策（shelter-in-place policy），即要求人们待在家里，不要“外出”；另一方面是关闭边境，将自然界的入侵者——病毒、外来者、动物拒之门外。通常，后者的含义是，民族社会是准有机体。它模糊了20世纪30年代的生物学语言与政治语言，仿佛政治的自我建构的基础是将非自我从自我中分离出去的行为。


    从源自新冠肺炎的自然观的角度来看，将人类与自然界区分开来，或是将非自我从自我中分离出来的做法似乎是一种随意的暴力行为。如果自然界囊括一切，如果人类的独立性是一种幻觉，那么无论是病毒在“外面那个”世界的说法，还是对保留原始生活方式的人的指责，都没有任何意义。这样一来，民族国家的免疫政治学变得根本站不住脚。它的基础是对有机体和免疫系统的错误理解。它的基础也是对有机体的错误理解，即假定有机体是独立且离散的物体——细菌和病毒作为一种非自我，不属于有机体。它的基础是对免疫系统的错误理解，即暗示免疫系统是自我/非自我识别系统，因此是不断忙于将非自我从自我中分离出去的战争机器。


    事实上，没有任何有机体可以像这种观念所暗示的那样，彻底从自然界分离。过去所谓的非自我，即细菌和病毒，是自我不可或缺的组成部分。事实上，当代免疫学家将免疫系统描述为我们这个多物种集合体的联合管理系统。


    我先明确一点：我并不是支持群体免疫或过早解除就地避难的命令，也不是反对科学技术。恰恰相反，我认为技术越多越好。


    我要说的是，由于践行了以维持和捍卫虚幻的人类观为基础的差异化政治，我们已经对地球（以及作为地球不可分割的一部分的我们自己）造成了破坏。我认为，除了提出新的人类本质、生活方式、技术实践方式和政治实践方式之外，我们别无选择。


    ## 微生物世：从非人类角度来看政治


    目前，有两种互为竞争的策略对这一挑战做出了回应。


    第一种回应建议将政治观延伸到自然界。我认为这种回应最为失败。它只是将人类对人类领域的责任延伸到自然领域，而不是从多物种自然界的角度重新思考人类的概念。它从根本上坚持人类高于或超过自然界的现代观，仍然将人类和自然界分割开来，因为技术被理解为人工事物。它认为自然只会成为人类领域的一部分，这种情况被称为外部世界失势，自然界和地球的完全人类化。


    第二种回应采用了反演法，源自人类世这个术语所隐含的缺陷。人类世指的是一个以人类对地球及其反馈系统的影响为特征的新地质时代。人类世一词隐含着一种道德谴责：人类对地球上的所有生态系统造成的影响如此之大，以至于在地球化学中都有可能看到人类的活动，这是可耻的。可以说，该话语的规范含义是，人类与自然界应该完全分开。因此，适当的回应是将自然界作为“外面那个世界”加以保护，保护非人类免受人类的伤害。


    从观念上来说，上述两种回应都很幼稚，它们依然坚持霍布斯式的现代人类观和自然观，因此仅仅是重新描述了他们需要着手解决的问题。


    从哲学和诗学的角度探索病毒可以得到一个完全不同的答案。我称之为微生物世的政治。这里所说的微生物世是什么意思？它指的是从病毒的角度看待世界。


    数十亿年来，细菌、病毒、真菌和古生菌是地球上唯一有生命的居民。它们占据了每一片海洋、河流与湖泊，每一寸土地和空气。它们推动了创造生物圈的化学反应，从而为多细胞生命的进化创造了条件。


    细菌制造了我们呼吸的氧气、耕种的土壤和维持海洋的食物网。病毒定期杀死大量细菌，从而调节所有生命赖以生存的生物地球化学循环。微生物发明了支撑地球上所有生命的反馈系统，创造了过去和现在所有的生命形式。有史以来的一切有机体都源自细菌和病毒：一切有机体，包括我们人类，都与它们不可分割地交织在一起，并依赖它们。


    从这个角度来看，我们绝对不是生活在人类世，而是生活在微生物世，它并不像人类世这个术语所暗示的那样，人类与自然之间的界限变得模糊不清。可悲的是，我们人类仍然没有学会从微生物（即病毒）世界的角度来思考自己，而我们恰恰是这个世界的一部分。


    如果说政治是对共生形式的研究，尤其是寻找一种良好的共生形式的努力，那么我们还有很多工作要做。我们必须比较各种共生形式——原核生物与真核生物、有机体与病毒、菌丝体与树木，在池塘与肠道中，在洞穴和森林里，在肺与河流内。然后，我们必须在这些研究的基础上找到能够实现人类和非人类共同繁荣的政治形式。


    ## 行动计划


    如果把本文中出现的人类观历史加以形式化，就可以得出以下提要。在最长的一段历史中，我们人类生活在上帝赐予的或神圣的自然宇宙中，我们是各部分中的一部分。17世纪初发生的一场深刻而深远的变革使我们离开那个宇宙，进入了人类时代：我们把自己与自然区分开来，将自然称作“外面的世界”，即动物和非理性的领域，我们试图在技术上拉大自己与动物之间的距离。今天，我们面临着离开人类时代，学习如何在微生物世生存的挑战。每个时代都有其独特的政治制度、独特的生产方式和独特的技术观。


    怎样才能学会摆脱人类比自然界更重要的现代观念，学会从我们所处的微生物星球（我们也是其中的一部分）的角度清楚阐述什么是人类，人类应如何生活、如何实践技术、如何践行政治？也就是说，我们应如何从微生物世的角度看待上述问题？


    我们人类能不能从非人类世界的角度重新思考我们自己，因为我们是这个世界的一部分，而且与其密不可分？要做到这一点，我们必须学会从微生物世的角度将自己客观化，也就是说，努力实现以地球而非种族或物种为中心的“我们”的观念。


    在我看来，这是一个挑战，也是博古睿研究院人类变革项目旨在解决的问题。我们——我们是物种间的联系，必须发明新的词汇来阐明什么是自然界中的人类，学会阐明和实践一种全球政治，找到从自然工业化（资源开采）到工业生物化的途径，创造用生物技术取代人工技术的可能性。


    如果我们成功了，那么像我们称之为新冠肺炎这样的构型——由病毒、蝙蝠、穿山甲和人类组成的可能构型，将不再是不合理地偏离人类与自然界边界的现象。这样的边界将不复存在。我们将成为“外面的世界”的一部分。


    （本文由诸葛雯翻译）


