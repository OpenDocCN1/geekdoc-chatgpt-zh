    \n---\n\n# 04 “生生”观与共生思想：契合天地人的哲学？\n\n**宋冰**\n\n新冠肺炎疫情发展至今已夺去450多万人的生命。这场病毒全球大流行加深了已然存在的全球性挑战，如治理体系失灵、经济增长放缓、社会撕裂和地缘政治纷争等，也深刻改变了我们对这些问题的思考和研判。这场病毒大流行还会在更深层次的哲学意义上，改变我们对人类生存境况的认识吗？\n\
    \n博古睿研究院在2020年发刊的思想性杂志Noema上指出，人们回溯历史，会将新冠肺炎疫情视为一场“伟大的加速运动”和“认识论上的临界点”，它“从根本上撼动了所有固有的观念”。[^50]德国哲学家马库斯·加布里埃尔指出，“新冠肺炎疫情揭示了21世纪主导意识形态的系统性弱点，即我们一直坚信只依赖科技进步即可推动人类和道德进步”。他呼吁来一场“形而上学大流行”，以唤起人类社会对全球意识的全新认识。[^51]在未来的几十年，我们势必遇到更多的全球性危机，对构建新的全球意识的需求只会更加迫切。这些危机可能源于新的病毒袭击、气候变化、核危机以及其他无法预见的人为或自然灾难。\n\
    \n温斯顿·丘吉尔的一句名言，“永远不要浪费一场好危机”，近年来已成为陈词滥调。从“危机”一词，我们可以窥见，面临危机，思考险境带来的机遇和突破深深植根于中国文化基因之中。鉴于此，对人类基本价值观进行更深入的思考正当其时，这种思考既可以激励我们迎接当下的挑战，又可以迫使我们前瞻并思考如何为人类和星球上其他生命形式带来可持续的繁荣。\n\
    \n在这篇文章中，我从对中国本土哲学的精神特质有决定性影响的“生生”观和万物一体的理念中寻求灵感，并指出它们是如何支持和塑造了近几十年来中日学界热议的共生思想。在我们思考人类未来愿景时，共生思想或许才是契合天地人的哲学。\n\
    \n## “生生”与生死\n\n“人命关天”“活着就是硬道理”“好死不如赖活”等是中国人日常生活中常见的表达。它们在抗疫期间的日常交谈和社交媒体上一而再，再而三地出现。这种强烈的生存欲望的文化根源是什么？它从哪些方面揭示了中国人的生死观？从理念上来说，这种强烈的生存欲望的来源无疑是中国哲学的智慧源泉——《易经》中的“生生”观。创作《易经》的圣人仰观天象、俯察地理，近取诸身、远取诸物，洞察自然力量的消长和人事的变迁，得出“生生”（即持续的生发和永恒的变化）是宇宙万物的基本属性。天地是自然生命力的最崇高和最伟大的力量，给予并维持万物的生发与繁衍，即所谓“天地之大德曰生”[^52]。\n\
    \n中国本土哲学流派从大自然源源不断的创造力和“生生”的观念中汲取了治理人类社会的灵感。儒家规劝人们效法“天”（乾）去不断成长和创造，追求理想的模范人格，即君子。道家则重视“地”（坤），因其具有不朽、滋养万物和无私的品质。效法“地”可以培养出支持和滋养生命、与自然合一的品格。简而言之，“生生”颂扬生命、生存、创造、给予、繁荣、延续和共存。\n\
    \n[^47]: 注释47的内容\n[^48]: 注释48的内容\n[^49]: 注释49的内容\n[^50]: 注释50的内容\n[^51]: 注释51的内容\n\
    [^52]: 注释52的内容\n"
  trans: "\n### How Can High Technology Be Transformed into Appropriate Technology?\n\
    \nWhat is \"appropriate technology\" (appropriate science-technology)? Fundamentally\
    \ speaking, appropriate technology is the technology most conducive to the overall\
    \ survival of local communities and even humanity as a whole. To put it more clearly:\
    \ from a temporal perspective, this technology allows people to optimally combine\
    \ immediate urgent needs with long-term future interests; from a methodological\
    \ perspective, it can be both objectifying and non-objectifying; from the perspective\
    \ of the quality of life it fosters, it enables people to embed and blend safety\
    \ with comfort, the material (physiological) with the spiritual, the conservative\
    \ with the enterprising (or tradition with innovation), the simple with the rich,\
    \ the natural with the artificial, to the maximum extent, thereby experiencing\
    \ a beautiful life. For instance, the thought and technology that created the\
    \ Dujiangyan Irrigation System are appropriate technology; many techniques and\
    \ knowledge in *The Complete Book of Agricultural Administration* (*Nongzheng\
    \ Quanshu*), *The Exploitation of the Works of Nature* (*Tiangong Kaiwu*), *The\
    \ Yellow Emperor's Inner Canon* (*Huangdi Neijing*), *Treatise on Cold Damage\
    \ Disorders* (*Shanghan Lun*), and *Compendium of Materia Medica* (*Bencao Gangmu*),\
    \ if applied in conjunction with local conditions, are also appropriate technology.\
    \ From the above discussion, it can be seen that high technology itself is not\
    \ appropriate technology; it cannot bring us such a life. On the contrary, due\
    \ to some of its characteristics, especially the worship of high technology, it\
    \ may cause us to lose the possibility of such a life.\n\nThe above also mentions\
    \ that high technology has its strengths, but also its impotence and dangers.\
    \ If used well, it can participate in the constitution of appropriate technology\
    \ and benefit humanity. But to use it well, we must first break the worship of\
    \ high technology and allow other technologies to participate on an equal footing.\
    \ Only then can we compensate for its deficiencies and restrain its toxicity,\
    \ just as a Traditional Chinese Medicine prescription allows medicinal materials\
    \ of different natures (some toxic when used alone) to mutually restrict and complement\
    \ each other, thereby achieving the best effect. However, this condition of \"\
    equality\" is difficult to realize in an era where the worship of high technology\
    \ prevails. During this epidemic prevention and control, whether internationally\
    \ or domestically, skepticism, misunderstanding, denial, and smearing of Traditional\
    \ Chinese Medicine (TCM) have existed in large numbers. It was only due to TCM's\
    \ outstanding performance in epidemic fighting over the past 20 years that TCM\
    \ intervened more in mainstream diagnosis and treatment this time. But according\
    \ to Zhang Boli's already quite moderate judgment, compared to SARS, \"TCM intervention\
    \ (though) has been significantly earlier, but the lead time is still insufficient\
    \ (as mentioned in the previous citation, the usage rate of Chinese medicine was\
    \ only 30% in early February). At the same time, although there were designated\
    \ TCM hospitals, their number and beds were still relatively few, lacking a systematic\
    \ and comprehensive TCM diagnosis and treatment system\" [⁴⁷]. One must know that\
    \ TCM suffered severe discrimination and smearing from the mainstream intellectual\
    \ circles in modern times, nearly suffering the same fate as in Japan—being completely\
    \ banned [⁴⁸], and later forced into a \"one-sided\" integration of Chinese and\
    \ Western medicine, leading to an overall further weakening of TCM. The resources,\
    \ proportion, and even the margin of error tolerance enjoyed by TCM in the national\
    \ medical undertaking have an enormous gap compared to high-tech medicine. One\
    \ of the main reasons for this unjust and unscientific situation is the worship\
    \ of high technology. Therefore, to restore the vitality of TCM and even various\
    \ traditional technologies still beneficial today—such as traditional astronomy,\
    \ mathematics, agronomy, green farming methods, traditional crafts, food processing,\
    \ textile arts, metallurgy and metal processing—so that they can play a greater\
    \ role in the future, we must first deeply reflect on the fallacy of this worship,\
    \ eliminate the bad habit of high technology and its ideology monopolizing the\
    \ field and excluding dissidents, and allow the thought and practice of \"harmony\
    \ in diversity\" (he er bu tong) to enter the technological world without discount.\n\
    \nOf course, the revival of these traditional technologies is not mere restoration,\
    \ but requires mutual learning, including the appropriate absorption of certain\
    \ methods and technologies of high technology, to create appropriate technologies\
    \ particularly adaptable to the present and the future. TCM needs to selectively\
    \ absorb certain things from Western medicine, such as anatomical knowledge of\
    \ the human body and microscopic understanding of medicinal materials; technologically,\
    \ even more can be borrowed (such as surgery, dentistry, injection, life support\
    \ techniques, etc.), but this absolutely does not equal the 20th-century promotion\
    \ of \"scientification of TCM\" and \"isolating active ingredients of Chinese\
    \ medicine,\" because that would cause TCM and similar traditional technologies\
    \ to lose their own intellectual life. \"Appropriate absorption\" means being\
    \ open to high technology on the one hand, but absolutely not opening up to the\
    \ point of being shattered or co-opted; rather, it means maintaining one's own\
    \ research paradigm—that is, the complete independence of one's own philosophy,\
    \ theory, discourse, methods, and experiments—thereby possessing autonomous choice,\
    \ i.e., deciding for oneself what to absorb, what not to absorb, and even what\
    \ to resist. One must absolutely not \"be absorbed,\" i.e., be forced to absorb\
    \ things sufficient to kill one's own paradigm, such as replacing the theory of\
    \ Yin-Yang, Five Phases, Yun-Qi, and Meridians with high technology's anatomical\
    \ theory of the human body, replacing the traditional diagnostic methods of inspection,\
    \ auscultation/olfaction, inquiry, and palpation with objectifying diagnostic\
    \ methods like `CT` (Computed Tomography), or completely using Western-style universities\
    \ and Western medical circles' methods to educate, train, and certify TCM practitioners.\n\
    \nMoreover, a community, a country, or even the human community must have the\
    \ ability and right to choose which technology or specific technology to use.\
    \ They cannot be hijacked by the worship of high technology, nor can they feel\
    \ that adopting every new high-tech product that enhances human control over nature\
    \ and others is a hard truth, just as the continuous upgrades of computers, mobile\
    \ phones, application software, and networks seem to be hard truths forcing people\
    \ to accept them. We must establish an \"Anti-Monopoly Law for Technology,\" eliminating\
    \ and avoiding the situation where a certain technology monopolizes all research\
    \ resources and ideological space, including clauses aimed at blocking the collusion\
    \ between certain technological research and commercial interests. Through this\
    \ and a series of related measures, people must gradually change the technological\
    \ attitude of social and political units, that is, shift from the worship of high\
    \ technology to the survival strategy and development path of technological pluralism\
    \ and appropriate technology.\n\nIn terms of establishing communities with the\
    \ power of technological choice, the Amish of North America have taken a precious\
    \ step [⁴⁹]. To safeguard their faith and family integrity, they resolutely refuse\
    \ many high technologies, such as automobiles, telephones, televisions, power\
    \ grids, tractors, etc. To this day, they still wear traditional clothing, travel\
    \ by horse-drawn carriage, use animal power to plow, and handcraft clothing, textiles,\
    \ and woodenware, thereby guaranteeing mutual aid and love within their community\
    \ and winning the hearts of the young people in the community. Therefore, contrary\
    \ to the prophecies of almost all researchers since the 20th century, this Amish\
    \ community, which \"moves against the historical trend of high technology worship,\"\
    \ has not died out but has developed considerably. For example, their population\
    \ has expanded from a few thousand in the early 20th century to nearly 300,000\
    \ in recent years. And they do not completely reject new technologies; rather,\
    \ they accept a few that are harmless to them, such as organic farming, rotational\
    \ grazing, greenhouse cultivation, or technologies where benefits outweigh harms,\
    \ like low-end computers, which they modify for their own use (not allowing computers\
    \ to connect to the internet or play video games); when necessary, such as for\
    \ certain processing needs, they use self-generated off-grid electricity. However,\
    \ because they lack their own relatively mature technological paradigm, their\
    \ ability and confidence to select, modify, and create new technologies are not\
    \ strong enough. In the author's view, they seem to reject too many high technologies\
    \ and modify too few. If they had their own research institutions and groups of\
    \ technical personnel, and more connections between their various settlements,\
    \ they would achieve more in resisting high technology worship, domesticating\
    \ certain high technologies, and creating their own suitable technologies. This\
    \ would make it more possible to win stable appropriate technology, which would\
    \ be more conducive to the long-term stability of their own community.\n\nIn summary,\
    \ high technology can be transformed into appropriate technology. The prerequisite\
    \ is to break the worship of high technology, adjust the operation modes of our\
    \ economy and communities, and even mainstream values, no longer regarding the\
    \ struggle for power as the top priority, but placing true—holistically ecological,\
    \ ethical, and life-meaningful—sustainable survival first. In this way, other\
    \ technologies, especially those with long civilizational inheritance, proven\
    \ to be beneficial for long-term survival, green and congenial technologies, can\
    \ obtain their due status and living space. The ongoing COVID-19 pandemic further\
    \ reminds us that the diversification and appropriation of technology are necessary\
    \ and urgently needed for the long-term survival of the Chinese nation and even\
    \ humanity.\n\n#### Notes\n\n1.  The first draft of this article was written in\
    \ March 2020. Minor revisions were made in late July of the same year and March\
    \ 2021. This article overlaps in part with another article by the author, \"Life-Sustaining\
    \ Technology and High Technology.\"\n\n2.  Besides high-tech medicine, there are\
    \ many reasons for the extended average life expectancy of modern humans, especially\
    \ people in economically developed countries, such as improvements in living conditions\
    \ (food, housing, environment, education), increased leisure time, the popularization\
    \ of health preservation knowledge and practice to a certain extent, and fewer\
    \ wars.\n\n3.  Whether knowledge about nature produced in non-Western civilizations\
    \ or cultures—such as TCM, Tibetan medicine, ancient Babylonian and Egyptian astronomy—can\
    \ be called \"science\" is a controversial issue. For the convenience of writing\
    \ and based on the author's relevant understanding, this article takes an affirmative\
    \ answer and attitude on this issue. Therefore, we can say \"ancient Chinese technology,\"\
    \ \"Native American technology,\" etc. Of course, they are distinct from \"high\
    \ technology.\"\n\n4.  Peter Harrison, *The Territories of Science and Religion*\
    \ [M]. Trans. Zhang Butian. Beijing: The Commercial Press, 2016; Peter Harrison,\
    \ *The Bible, Protestantism, and the Rise of Natural Science* [M]. Trans. Zhang\
    \ Butian. Beijing: The Commercial Press, 2019; Michael Allen Gillespie, *The Theological\
    \ Origins of Modernity* [M]. Trans. Zhang Butian. Changsha: Hunan Science and\
    \ Technology Press, 2012.\n\n5.  Heidegger proposed the concept of the \"mathematical\"\
    \ (das Mathematische) in \"Modern Science, Metaphysics, and Mathematics.\" Heidegger,\
    \ *Selected Works of Heidegger* [M]. Ed. & Trans. Sun Zhouxing. Shanghai: Shanghai\
    \ Joint Publishing, 1996: 847–884.\n\n6.  Kant, *Critique of Pure Reason* [M].\
    \ Trans. Deng Xiaomang, Proofread by Yang Zutao. Beijing: People's Publishing\
    \ House, 2004. Especially the first part and the first book of the second part\
    \ of the \"Transcendental Analytic.\"\n\n7.  Kant, *Critique of Pure Reason* [M].\
    \ Trans. Deng Xiaomang, Proofread by Yang Zutao. Beijing: People's Publishing\
    \ House, 2004. Especially the first part and the first book of the second part\
    \ of the \"Transcendental Analytic,\" A78, A101–102, A118.\n\n8.  Heidegger, *Kant\
