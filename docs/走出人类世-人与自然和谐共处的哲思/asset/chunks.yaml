    # Transformation of Survival Modes and the Essence of Life Systems


    ## From Foraging to Farming/Pastoralism: A Forced Transformation of Survival Mode


    However, this highly efficient hunting mode broke the self-renewal capacity of
    prey populations, ultimately leaving humans with no prey to hunt and forcing them
    into the predicament of "eating grass"—that is, being forced to settle down and
    obtain survival resources through arduous cultivation or by raising animals and
    following water and grass. Although arduous farming ultimately provided humans
    with a more efficient mode of acquiring survival resources compared to foraging,
    the initial occurrence of this transformation was most likely a helpless choice.
    What insights can this "change" in survival mode—from foraging to farming and
    pastoralism—offer for understanding the "change" we face today?


    ## The Dual Connotation of Life Systems: "Living" and "Iteration"


    In a lecture titled "Humans are Biological Beings—The Starting Point of Human
    Transformation" delivered for the first "Bogu Rui Lecture" of the Bogu Rui Research
    Institute China Center in March 2019, I proposed a view on the essence of life
    systems: the essence of a "life system" is not a special kind of matter, but a
    special mode of material existence. In this view, the concept of "life" actually
    contains two connotations. One is "living" (活), namely the "special interaction
    of special components under the participation of special environmental factors"
    (referred to as the "three specials" ![](img/#part0004.html#note13n)) manifested
    in the form of "exchanging structure for energy" in obedience to the Second Law
    of Thermodynamics.


    ### "Living": The Cycle of Exchanging Structure for Energy


    Among these, "special components" mainly refer to carbon-skeleton ![](img/#part0004.html#note14n)
    molecules; "special environmental factors" refer to the Earth''s temperature,
    pressure, relationship with the sun, geochemical composition (such as water and
    other molecules in different forms), etc.; "special interaction" mainly refers
    to interactions linked by intermolecular forces with relatively low energy states,
    such as hydrogen bonds and hydrophobic bonds. This process of "living" is a process
    that can form spontaneously: as long as the energy state of the complex formed
    by intermolecular forces from the encounter of carbon-skeleton components is lower
    than the energy state when the components exist independently, then according
    to the Second Law of Thermodynamics, independently existing carbon-skeleton components
    can spontaneously form complexes ![](img/#part0004.html#note15n). However, since
    the complex is formed with intermolecular forces as links, changes in external
    environmental factors may break these forces, causing the complex to disintegrate
    and the components to return to an independent state.


    Under suitable conditions, these two independently occurring processes can be
    coupled via the complex as a node, forming a "cycle of exchanging structure for
    energy" (where "structure" refers to the complex, and "energy" refers to the difference
    in energy states between the carbon-skeleton components existing independently
    and existing as a complex, as well as the energy related to the environmental
    factor disturbance required to break the intermolecular forces). In this dynamic
    "cycle of exchanging structure for energy (living)," complexes continuously form
    spontaneously and disintegrate due to disturbance. The probability of existence
    of complexes formed between different components will differ. Ultimately, the
    processes coupled by complexes with higher probabilities of existence (moderate/adaptive)
    will appear with greater probability, i.e., "the moderate survive." This "cycle
    of exchanging structure for energy" of "living" is the starting point of life
    systems.


    ### "Iteration": Complexification Evolution Based on Covalent Bonds


    The other connotation of the concept "life" is "iteration," namely the process
    of complexification of various elements related to the "three specials," starting
    from the spontaneous generation of covalent bonds, based on the complexes that
    serve as coupling nodes of the aforementioned "cycle of exchanging structure for
    energy" ![](img/#part0004.html#note16n). Since various "iterations" of different
    degrees of complexity have reached the level of trait changes in multicellular
    eukaryotes, this is essentially what Darwin called "evolution"; for ease of understanding,
    we can also call this "iteration" traced back to physical and chemical changes
    at the molecular level "evolution."


    ### The Formula of Life: Life = Living + Evolution/Iteration


    The two connotations of the "life" concept above, if expressed in a formula, are:
    **Life = Living + Evolution/Iteration**.


    From this perspective, any "life" process must contain the connotation of "living,"
    and "living" is essentially an open, special interaction that takes environmental
    factors as indispensable constituent elements. A life system is essentially a
    hierarchical network built by connecting many "three specials." The different
    forms presented by life systems are essentially the external manifestations of
    different network structures formed by different "connections" and their association
    methods.


    ## Survival Mode Transformation from the Perspective of Life Systems


    ### Fundamental Change in Resource Integration Mode


    If the above interpretation of life systems holds, then the transformation of
    human survival mode from foraging to farming and pastoralism is essentially nothing
    more than a change in the way this biological species, humans, integrates relevant
    surrounding elements during the operation of its "three specials." Specifically,
    this change in "integration mode" is mainly a change in the source and acquisition
    form of the basic resources required for human survival: in the foraging era,
    people directly obtained usable parts from surrounding self-generating and self-perishing
    animals and plants as survival resources; they turned to domesticating and planting
    animals and plants, taking the proliferative part of animal and plant resources
    during the domestication and planting process (such as "one seed sown, ten thousand
    grains harvested" in farming) as survival resources. Human food was no longer
    the "one seed" used as seed, but the "ten thousand grains" proliferated after
    the seed grew.


    ### Non-Autonomy of Change and "Tinkering" Evolution


    Regardless of the source of the changes occurring in the relevant elements of
    the "three specials," the appearance of these changes is often not what humans
    hope for or can control. If our explanation above for the human survival mode
    transformation from foraging to farming/pastoralism reflects the actual situation,
    then whether the transformation occurred due to the proximate cause of prey exhaustion
    or the ultimate cause of the development of human cognitive abilities, they were
    not what humans hoped for or could control, let alone the result of efforts to
    achieve a pre-set goal of farming/pastoralism. The appearance of change merely
    broke the original survival mode and prepared conditions for the emergence of
    a new survival mode. Whether farming or pastoralism ultimately emerged was actually
    the result of humans in different regions having no choice but to emerge based
    on their different ways of utilizing different relevant elements in their respective
    spaces of existence—because if it were not so, these populations would not have
    survived to today. This is just like the "tinkering" described by the French Jewish
    biologist François Jacob in his 1977 article "Evolution and Tinkering": whatever
    materials are used, as long as the hole in the pot is patched ![](img/#part0004.html#note17n).


    ## Facing the COVID-19 Pandemic: Network Reconstruction of Life Systems


    ### Severance of "Connections" Under Pandemic Impact


    If the inducements and results of changes that have a major impact on human survival
    are as described in the survival mode transformation from foraging to farming/pastoralism
    above, then what we can probably learn is that the key to the existence and sustainable
    development of a life system lies not in tracing the causes of changes in surrounding
    relevant elements, but in focusing on which of the various relevant elements currently
    in existence can form moderate interactions that maintain system operation, thereby
    turning these "possible" interactions into "reality."


    Just as when prey disappeared back then (regardless of why they disappeared),
    people could not sit and wait for the natural recovery of prey populations but
    had to seek new modes of acquiring survival resources. Those fortunate ancestors
    who survived probably never imagined that their forced "eating grass" would enable
    humans to largely break free from the constraints of the food web and become a
    dominant species in the Earth''s biosphere.


    From this angle, in the pandemic brought by the novel coronavirus, which elements
    related to the operation of the human life system have changed, and which have
    not? First, a change in this life system is the addition of a new virus. Because
    of its unexpected arrival, many people lost loved ones, and some lost their lives.
    This made everyone feel fear more acutely—fear born of ignorance and helplessness.
    Due to fear, the "connections" originally indispensable in the network structure
    of the human society life system—between people, especially between people and
    their workplaces—were artificially severed, such as various forms and scales of
    city/school lockdowns, and sharp reductions in interpersonal contact. This changed
    the network structure and operation mode of the human society life system.


    ### "Restoring the Old" or "Reconstructing the Network"


    No one knows the future trajectory of the COVID-19 pandemic, so no one knows how
    long the fear generated by the pandemic can and should last. Whether the novel
    coronavirus will disappear inexplicably like SARS, or "settle down" in human society
    like influenza, in the social life system network structure where connections
    have been artificially severed due to fear, when "connections" between different
    nodes can be re-associated, should people "restore the old as it was" like repairing
    ancient buildings—i.e., restore the good old days—or re-establish new connections,
    construct a new network system, and let the social life system operate in a new
    form, just as humans transformed from foraging to farming/pastoralism? Helplessly,
    the uncertainty brought by the novel coronavirus makes it impossible for people
    to effectively assess this.


    ### Deep Roots of Contradictions and Conflicts


    When people sigh that "we can never go back to the past," one might actually ask:
    Was the "past" "good"? If the answer is not affirmative, one can further ask:
    Was the "bad" of the "past" caused by the novel coronavirus? Obviously, those
    various contradictions and conflicts seemingly triggered by the novel coronavirus
    actually existed long ago. It''s just that under the impact of the virus on the
    existing social operation mode, those artificially severed "connections" produced
    new connections at related nodes, or "connections" that originally existed but
    were masked or suppressed by former social roles surfaced, giving these long-existing
    contradictions and conflicts an opportunity to erupt.


    ### Building a New Network Structure with Greater Resilience


    From this perspective, these problems causing contradictions and conflicts neither
    arose because of the novel coronavirus nor will they disappear with it. The fundamental
    reason the novel coronavirus has caused such a huge impact on human society is
    that human society, as a life system, has developed various problems in its network
    structure and operation mode; many "connections" and their association methods
    can no longer operate effectively. For the general public beyond biomedical experts,
    besides paying attention to practical issues like infection numbers and vaccine
    development, they should pay more attention to the problems that erupted during
    the pandemic, including those that haven''t erupted but actually exist: exactly
    which interactive relationships have become unsuitable, and then see how to build
    new "connections" between different nodes, thereby constructing a new network
    structure and operation mode with greater resilience.


    ## Cognitive Ability and the Special Path of Human Evolution: From "Three Components"
    to "Two Components"


    ### The Starting Point of Curiosity: Diversity and Civilizational Conflict


    People can list a long inventory to sort out the various problems existing in
    human society before the COVID-19 pandemic. Among these problems, which are the
    most fundamental and can be adjusted through human effort? The answer to this
    question relates to my curiosity and observation of a phenomenon sustained for
    nearly 30 years.


    In 1991, when I just arrived at UC Berkeley for postdoctoral research, I noticed
    many people discussing "diversity" (multiculturalism). This was quite impactful
    for me at the time. My first reaction was: if "diversity" becomes the dominant
    concept in a society, how should conflicts of interest between people with different
    concepts be resolved? Friends who endorsed "diversity" said they could rely on
    the law. But isn''t the legal principle on which the law is based also a concept?
    The discussion could not proceed further. Three years later, as I was about to
    leave the US, I heard people discussing Samuel P. Huntington''s "Clash of Civilizations."
    Due to a lack of necessary historical knowledge, I completely failed to understand
    why people were discussing this issue at the time.


    It wasn''t until 1998, after I started working at Peking University, that I became
    curious about "why they want to pursue graduate studies" through interactions
    with graduate students, and began to pay attention to the issue of human behavioral
    motivation. Later, influenced by some friends, I started reading books outside
    my plant biology major. All this culminated in the "humans are biological beings"
    concept I introduced in that 2019 "Bogu Rui Lecture." As mentioned earlier in
    this article, this concept holds that the biggest difference between humans and
    other organisms lies in cognitive ability. This difference led human evolution
    onto a completely new path distinct from other organisms: "cognition determines
    survival." If this analysis reflects the characteristics of human evolution, where
    exactly does the importance of "cognition" manifest in the various problems existing
    in human society and their adjustment?


    ### The "Three-Component System" of Animal Populations


    We must return to life systems outside humans, especially taking the evolutionary
    characteristics of animal systems as a reference frame, to give an explanation
    with objective rationality. Regarding the evolutionary mechanism of life systems,
    by the eukaryotic cell stage, all eukaryotes had to exist in the form of "two
    subjects." One subject is the single cell (e.g., a yeast cell) or a single multicellular
    organism (e.g., a cat or an elephant). These individuals are the basic units that
    integrate relevant surrounding elements of the "three specials" and maintain their
    own existence; they are the "behavioral subjects." The other subject is a population
    composed of many conspecific cells (e.g., many yeast cells in a fermenting dough)
    or a group of cats or elephants. Individuals in these populations can share a
    gene pool, maintain DNA sequence diversity through sharing the gene pool, and
    thereby cope with unpredictable changes in surrounding relevant elements.


    Therefore, it is the population, not the individual, that is the basic unit of
    species survival, the "survival subject" of a species. The two are linked by sexual
    reproduction. Because eukaryotes possess two subjectivities (the behavioral subject
    is the individual, the survival subject is the population), for animals—as one
    of the three major categories of multicellular eukaryotes (the other two being
    plants and fungi) that realize the integration of "three specials" relevant elements
    through feeding—an inevitable dilemma arises: how can individuals as behavioral
    subjects effectively associate with each other to form a sustainably surviving
    population? Through past research results on animal behavior patterns, I found
    that the self-maintenance mechanism of animal populations can be summarized as
    a "three-component system": order, power, and food web constraints.


    #### Order, Power, and Food Web Constraints


    The "order" in the three-component system of animal population self-maintenance
    refers to the need for individual behavior patterns to follow certain rules. Although
    individuals as behavioral subjects theoretically possess infinite degrees of freedom,
    for a specific species, if every individual acts willfully without common rules
    to follow, then population members cannot effectively associate, and the population
    cannot exist. "Power" refers to the fact that in a population, a leader usually
    manages individual behavior, i.e., maintains the population''s order, thereby
    maintaining the population''s integrity. Since the leader bears the responsibility
    of maintaining population order beyond their own survival, only the physically
    strong can handle it. Physical strength implies that the genes they carry have
    stronger survival capabilities. Therefore, the leader, by virtue of physical strength,
    occupies mating priority, which can accelerate the spread of excellent genes within
    the population, benefiting population survival. "Food web constraints" refer to
    the fact that a population, as a member of the food web, forms its individual
    behavior and population order through interaction with other members of the population
    and other populations during evolution; therefore, it is inevitably constrained
    by the food web. The existence of the food web, on the one hand, defines the "order"
    of a specific species/population as its node (e.g., individual behavior patterns),
    and on the other hand, constrains the "power" of the ruler in the population.
    These three elements form a virtuous cycle, maintaining the self-maintenance and
    evolution of different animal populations in the Earth''s biosphere.


    ### Humans Breaking Food Web Constraints


    Humans took a different path. As mentioned earlier, cognitive ability helped population
    members communicate better and change hunting methods. The result was that increased
    hunting efficiency simultaneously caused prey disappearance, forcing humans onto
    the path of farming and pastoralism. With the development of human cognitive ability,
    the relationships among the three components in the three-component system of
    animal population self-maintenance and evolution gradually changed in human populations.
    In the relationship between humans and other organisms in the food web, humans
    shifted from relying on the self-renewal of other organisms to obtain survival
    resources, to having the ability based on cognition to intervene in the self-renewal
    process of other organisms, and obtaining survival resources by adding value to
    their self-renewal. Humans can even transform items worthless to other animals
    into resources usable for improving their own survival conditions, such as using
    soil to make tools. In this process, humans gradually broke the constraints of
    the food web (mutual dependence based on the self-renewal of different species)
    on their own self-maintenance and evolution. This breakthrough, while expanding
    the range of survival resources, turned the original three-component system that
    could effectively maintain sustainable population development in the animal world
    into a two-component system, leaving only "order" and "power."


    ### Side Effects of Cognitive Ability


    Besides breaking food web constraints and turning the original three-component
    system essential for maintaining animal population survival and development into
    a two-component system, the development of cognitive ability produced other effects.
    For example, cognitive ability, as a form of imagination, continuously changes
    individual behavior patterns, thereby impacting the population''s existing "order."
    Another example: the virtual nature of cognitive ability itself changes the relationship
    between the ruler ![](img/#part0004.html#note18n) and other population members.
    In the animal world, the "might makes right" principle shaped by the ruler maintaining
    order benefits the optimization of the gene pool shared by the population as the
    survival subject, ultimately benefiting population survival. After humans developed
    to a certain stage, possessing power was no longer the exclusive privilege of
    the physically strong.


    According to Professor An Lezhe (Roger Ames) of the Philosophy Department of Peking
    University, the characteristic of a "sage" (圣人) is strong communication ability.
    The traditional Chinese character "聖" (sage) is composed of "耳" (ear), "口" (mouth),
    and "王" (king), meaning that a person with strong communication ability can become
    king, or a qualified king should possess efficient communication ability ![](img/#part0004.html#note19n).
    However, communication ability is not "written" into the genome for inheritance.
    Therefore, the ruler''s communication ability and the extra survival resources
    occupied in the name of maintaining order may not bring positive effects to population
    survival. Moreover, struggles related to the ruler''s rise to power are no longer
    always positively correlated with their ability to maintain order, as in the animal
    world. Furthermore, after rising to power, the ruler uses the extra survival resources
    originally granted for maintaining order to seek private gains for themselves
    and their family; in reality, there is hardly any force within or outside the
    population that can constrain them.


    Therefore, although the breakthrough of food web constraints brought by cognitive
    ability development can have the positive effect of expanding the range of survival
    resources, it simultaneously produces side effects that break the virtuous cycle
    of the original three-component system that could effectively maintain population
    survival and development in the animal world. However, humans, as multicellular
    eukaryotes, have not changed their two subjectivities due to the development of
    cognitive ability. After the three-component system maintaining sustainable population
    development is broken, in the two-component system composed only of the "order"
    necessary for the population and the "power" necessary for maintaining order,
    how "order" should be defined, how "power" should be constrained, or how the relationship
    between individuals and populations, and between populations and other surrounding
    species should be handled, becomes a major issue that human survival and development
    cannot avoid and must solve.


    ## Seeking the "Third Pole": The Axial Age of Human Civilization and Ultimate
    Grounds


    ### The Long Gap from Agricultural Civilization to the Axial Age


    Do humans need a reference frame to define order and constrain power? Where to
    find such a reference frame?


    From the human history we currently know, farming appeared 13,000 years ago; in
    other words, human society should have entered the two-component system since
    then. However, truly systematic "human civilization" marked by Jaspers'' "Axial
    Age" only appeared 2,500 years ago. Why did systematic human civilization marked
    by the "Axial Age" only appear more than ten thousand years after the beginning
    of agricultural civilization? From an empirical or theoretical perspective, the
    operation of a two-component system can only produce two modes: either turbulent
    like a sine wave, or stagnant like a straight line. From this angle, a possible
    explanation for why the "Axial Age" appeared so long after the start of agricultural
    civilization is that people suffered enough from turbulence or stagnation under
    the two-component system and had no choice but to seek a credible basis for the
    definition of "order" necessary for population survival and the constraint of
    "power" maintaining order, for the sake of their own survival, i.e., population
    survival.


    ### Early Attempts: Codes and Divination


    Obviously, the scale of human populations that had broken food web constraints
    no longer allowed them to retreat to the status of a node in the middle of the
    Earth''s biosphere food web, using food web constraints as the third component
    to define order and constrain power. They could only use their own cognitive ability
    to make new attempts.


    From historical records visible now, different societies made different attempts.
    The *Code of Hammurabi* shows that ancient Babylon attempted to have the ruler
    formulate behavioral norms. But rulers always die; if subsequent rulers change
    these regulations, who can stop them? On what basis do they change them? China''s
    oracle bones show that the Chinese in the Shang Dynasty attempted to seek behavioral
    grounds through divination. This attempt also ended in failure with King Zhou
    of Shang being overthrown by King Wu of Zhou. Probably just as only those groups
    that chose farming/pastoralism—i.e., "eating grass"—survived after prey were wiped
    out, those populations that survived after experiencing the turbulence or stagnation
    of the two-component system were those that sought a third force (which can be
    called "seeking the third pole") beyond the current "order" and "power" dual components
    to define order and constrain power. Thus came Jaspers'' so-called "Axial Age."
    This seemingly "brilliant" miracle in human history was most likely, like the
    origin of farming/pastoralism, merely a helpless contingency.


    ### Two Types of Civilization: Anthropocentric and Theocentric


    Then, did human civilization marked by the "Axial Age" find the third force to
    define order and constrain power? From Jaspers'' analysis of the "Axial Age" or
    Toynbee''s civilization typology analysis, it can be seen that different civilization
    types are essentially distinguished by their choice of the ultimate ground for
    the right/wrong standards of behavioral norms. If these different types are analyzed
    and compared, it can be found that there are actually only two major categories
    of civilizations in human history: one seeks the "ultimate ground for the right/wrong
    standards of behavioral norms" from ancestors, which can be called "ancestor worship"
    or "anthropocentric" civilization; the other seeks it from God, which can be called
    "God worship" or "theocentric" civilization. Both types of civilization have played
    positive roles in human survival and development; otherwise, human history would
    likely be completely different from what it is now.


    ### Absence of the "Third Pole" in the Context of Globalization


    Regardless of whether these two major categories of civilization each achieved
    the goal of "seeking the third pole," an unavoidable reality is: the expansion
    of survival space accompanying the development of human cognitive ability led
    to the encounter of civilization types that originally formed spontaneously in
    different regions. Before the problem of rebuilding the three-component system
    within their respective societies was fully resolved, people of different civilization
    types faced the problem of how to coexist between the "anthropocentric" and "theocentric"
    civilization systems with completely different "ultimate grounds for the right/wrong
    standards of behavioral norms." This problem actually appeared very early.


    Leaving aside Kant''s idea of "Perpetual Peace," the Baha''i Faith emerging in
    the mid-19th century and the "global ethics" advocated by Küng and others in the
    mid-to-late 20th century all attempted to provide "right/wrong standards" for
    human "behavioral norms" in the context of globalization from the ethical level
    commonly revered by existing different civilizations. However, at the level of
    "ultimate grounds," they actually still refuse to yield to each other. To this
    day, in the era of rapid globalization caused by the popularization of the Internet,
    if humans, as the same biological species, do not seek a universal, objectively
    rational "ultimate ground for the right/wrong standards of behavioral norms" for
    themselves—that is, provide an objectively rational "third pole" for the definition
    of order and the constraint of power—the contradictions and conflicts exposed
    in the response strategies and effects to the COVID-19 pandemic, including those
    exposed within respective civilization systems, cannot be truly resolved. In this
    sense, the discussions on "diversity" and "clash of civilizations" rising in the
    1990s probably cannot help resolve current social contradictions and conflicts.


