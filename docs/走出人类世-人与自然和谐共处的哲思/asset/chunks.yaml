    # Copyright Information


    -   Title: *Exiting the Anthropocene: Philosophical Reflections on Harmonious
    Coexistence between Humans and Nature*

    -   Compiled/Authored by: Song Bing

    -   Illustrations: Zhao Tingyang

    -   Publication Date: 2021-11-01

    -   ISBN: `9787521734447`

    -   Produced and distributed by CITIC Publishing Group

    -   All rights reserved · Infringement will be prosecuted


    ![](img/00015.jpeg)


    # Preface: Exiting Human Misalignment and Delusion


    **Song Bing**


    Since the end of 2019, the Novel Coronavirus Pneumonia (referred to as "COVID-19")
    epidemic has continued to spread and mutate globally, resurging in waves. Although
    some countries and regions have temporarily brought the epidemic under control
    due to early adoption of strong anti-epidemic measures, and people''s lives and
    economic operations have slowly recovered, the "scenery is uniquely good here"
    situation remains fragile. From a global perspective, the deepening social divisions,
    political disputes, economic recessions, and escalating geopolitical conflicts
    exacerbated by the COVID-19 pandemic are still fermenting and deteriorating, with
    global social turmoil intensifying.


    Comparisons, analyses, and reflections on different political ideas, governance
    frameworks, social and cultural psychologies, and corresponding public health
    crisis management flood major media and academic and policy journals. However,
    at this critical moment of crisis, should we not examine the human condition more
    deeply, as well as the ideas and systems that have formed and propelled this condition?
    The COVID-19 pandemic is only one of the many global challenges and disasters
    humanity has faced in recent years. With the ecological environment deteriorating,
    climate change accelerating, and geopolitical conflicts continuously escalating,
    more natural and man-made global crises will continue to unfold. So, should we
    take this opportunity to profoundly reflect on the value systems and perceptions
    we regard as orthodoxy, and even return to the origins of philosophical inquiry
    to rethink a series of fundamental questions? German philosopher Markus Gabriel
    points out that "the COVID-19 pandemic has revealed the systemic weaknesses of
    the dominant ideology of the 21st century, namely our steadfast belief that technological
    progress alone can drive human and moral progress," and he calls for a "metaphysical
    pandemic" to awaken a new understanding of global consciousness in human society.![](img/#part0002.html#note1n)


    Philosopher Zhao Tingyang responds positively, arguing that humanity needs a metaphysical
    reflection as powerful as a pandemic, "to give thought collective immunity." He
    calls for humanity to break through the dimension of modern thought, to discover
    or create a higher space of thought than modern to these calls, we invited several
    philosophers and biologists to discuss the following questions: What is the essence
    of humans and other life forms? How do we connect with nature and other forms
    of existence? What are the laws of life evolution and variation? What do freedom,
    happiness, suffering, life, and death mean? Can the rapidly advancing high-tech
    culture and its mindset enable humanity to escape the deepening predicament? What
    is the most urgent shift ins and arguments of the participating authors to the
    above questions.


    ## What is Life? What is Human Nature? The Relationship between Humans and Viruses


    Biologist Bai Shunong reviews his decades of research and thinking in the field
    of biology, breaking the static, single-material-form view of life, and advocating
    understanding life from the perspective of a "life system." He believes that "Life
    = Living + Evolution (Iteration). ''Living'' is the **special** interaction (i.e.,
    carbon-skeleton molecules) involving **special** environmental factors, bonded
    by intermolecular forces, i.e., structural energy transduction cycles. ''Evolution''
    is the spontaneous increase in complexity of the above three **special** interrelated
    elements."![](img/#part0002.html#note2n) By this definition, a life system is
    a special mode of material existence; it relies on intermolecular force interactions
    and "is a relatively stable intermediate state recognizable by humans in a dynamic
    process of constant separation and combination."![](img/#part0002.html#note3n)


    Then what is a human? What role do humans play in this complex biosphere? Bai
    Shunong believes that from a biological perspective, humans are essentially a
    subsystem of the Earth''s biosphere. The difference between humans and other life
    subsystems lies first in reproductive isolation from other species, but more importantly
    in humans'' unique cognitive abilities. This cognitive ability allows humans to
    break free from the constraints of the food web on their own maintenance and evolution,
    thereby embarking on an evolutionary path different from other organisms. When
    examining whether the elements of human operation as a life subsystem have changed
    due to the impact of the novel coronavirus, Bai Shunong believes that the various
    problems highlighted by the COVID-19 outbreak are actually chronic ailments long
    accumulated by the human life subsystem itself; the virus is merely the fuse triggering
    these deep-seated problems. Therefore, instead of falling into unnecessary anxiety
    over the epidemic, we should seriously reflect on the long-held "anthropocentric"
    or "theocentric" ideas. In Bai Shunong''s view, "since humans are organisms, human
    survival and development ultimately must obey the basic laws of life systems."
    These laws were formed before the Earth''s biosphere appeared and have continued
    incessantly.


    German anthropologist and philosopher Tobias Leis profoundly recognizes the symbiotic
    relationship between microorganisms and humans, but shamefully, we humans almost
    never think about ourselves from the perspective of the microbial world (e.g.,
    viruses). In fact, "for the novel coronavirus, there is nothing particularly different
    about humans compared to animals. On the contrary, for the novel coronavirus (as
    for any other zoonotic virus), we humans are just one animal among animals. We
    are just another multicellular organism, another habitat suitable for reproduction."
    We do not actually live in the Anthropocene, but have always lived in the "Microbiocene."
    Leis calls for humans to discard the bad habits of the Anthropocene at the level
    of thought and consciousness, and learn to understand and judge this planet and
    human society from the perspective of viruses. Indeed, the human body has about
    50 trillion cells, while the microorganisms we carry exceed 10 times the number
    of cells. These microorganisms are diverse, including viruses, bacteria, and fungi;
    they combine to form the human microbiome. They coexist symbiotically with us.
    If we judge "heroes" by quantity and vitality, microorganisms are the true kings
    of this planet! We are merely a tiny group among thousands of mammals. Compared
    to bacteria and viruses, we are just "newcomers" on this earth who run amok.


    So, what is a virus? What position does it occupy in this lively discussion of
    life? Is it life? What is its relationship with humans? Viruses have existed on
    this planet for billions of years; from the day *Homo sapiens* appeared, viruses
    have coexisted with us. Viruses are not independent life; they must rely on host
    cells to carry out their life activities and evolution. Thus, viruses and humans
    have formed a situation of symbiotic coexistence. Leis points out: "Viruses possess
    a tremendous power to promote change. Due to their ability to spread, mutate,
    and recombine between species, and to pick up and transfer genetic material between
    cells, they have made extraordinary contributions to the evolution of cellular
    life. Without viruses, mammals would not have evolved; without viral `DNA` (deoxyribonucleic
    acid) in our genome, the human organism could not develop, and our organs could
    not possess their current functions."


    Scientists have discovered that, like other mammals, humans originally evolved
    into placental mammals with the help of viral proteins, thus enabling human gestation
    and further evolution. Virologists and anthropologists agree that viruses are
    the most powerful driving force of human evolution. We may be very effective hosts
    for viruses because we love gregariousness, socializing, and global travel, but
    we must not be complacent because of this. We are obviously not their only hosts.
    They do not need us—without humans, viruses would remain as they are, "living
    forever." This is also a forgotten lesson reminded to humanity by this global
    viral pandemic—humanity needs nature, but nature does not necessarily need humanity.
    This may also be a re-manifestation of the truth Laozi pointed out 2,500 years
    ago: "Heaven and Earth are not benevolent; they treat all things as straw dogs."


    Then how should we correct humanity''s position in nature? The COVID-19 pandemic
    may be the last straw that breaks the camel''s back of anthropocentrism. One of
    the cornerstones of modern social ideology is anthropocentrism. Since modern times,
    humans have imagined they escaped the "low-level interests" of animals, stepped
    out of the natural world, and achieved control over nature and transcendence of
    species. The value of the natural world lies in whether it can be utilized and
    developed by humans. As the noblest form of existence, humans naturally utilize,
    develop, and transform all things in nature around their own interests. In modern
    society, human subjectivity has further reached its peak, ascending to the altar.
    The combination of human quasi-divine subjectivity with the logic of capital,
    the maximization of profit and wealth, aided by the wings of technology, has created
    the current human arbitrariness, which Zhao Tingyang calls the ubiquitous "carnival
    state." "Happiness theory" floods public philosophy; everyone possesses absolute
    "sovereignty," able to maximize personal freedom and legitimize and rationalize,
    even moralize, personal private preferences. Although there have been occasional
    "moments of awakening" before, humans are quickly attracted by new scientific
    and technological inventions, brand-new lifestyles and social modes, and so once
    again, and again, they put on their "masks" and return to the "carnival" dance
    floor. This global COVID-19 pandemic may finally shatter the human dream of becoming
    gods.


    ## From "Carnival" to the Abyss of Suffering: What is Human Happiness and Suffering?


    The COVID-19 pandemic has suddenly intensified the fear, suffering, and loss of
    billions of people globally, plunging them into what Zhao Tingyang calls the "state
    of no escape." Regardless of which corner of the world, regardless of race, skin
    color, wealth gap, status, nationality, or political stance, the virus treats
    all equally, sweeping across humanity with lightning speed from outbreak to spread,
    catching people off guard. This is actually the state humans face when confronting
    survival-level risk events. This is also why the famous thinker and writer Jared
    Diamond believes that this COVID-19 pandemic is the first time all of humanity
    has encountered a truly global crisis.![](img/#part0002.html#note4n)


    In addition to the "misalignment" of modern human consciousness mentioned earlier,
    which we need to face directly and discard anthropocentrism, the authors of this
    book also advocate further reflection on other concepts constituting the foundation
    of modern society, such as happiness, suffering, and freedom. Zhao Tingyang says:
    "What we need more is a Wittgensteinian ''ruthless'' reflection, reflecting on
    ethics from the outside of ethics, otherwise the result is nothing but self-affirmation,
    i.e., affirming in advance the values we hope to affirm." He believes that in
    the human "carnival" state, human society is immersed in the pursuit of constantly
    creating and enjoying happiness. But in a coordinate system explaining life, "happiness
    is only one coordinate; at least suffering is needed as another coordinate to
    form a positioning of life." The "happiness" brought by modern society lacks the
    ability to withstand suffering. Zhao Tingyang believes suffering is a problem
    humanity cannot avoid and for which there is no "antidote." He says: "The problem
    of suffering cannot be omitted or evaded because suffering falls outside the capacity
    of subjectivity, possessing absolute externality like the thing-in-itself; therefore,
    suffering is an absolute metaphysical problem." Precisely because suffering is
    a fundamental yet unsolvable problem, Zhao Tingyang believes the problem of suffering
    may be a good choice for the "metaphysical pandemic."


    Then how does Buddhist philosopher and Japanese ordained Zen priest Jason Wirth
    view happiness and suffering? He points out that in today''s world, happiness
    is "we want things to happen the way we want them to," and this is bundled with
    "another assumption: happiness is getting what I want, the demand for luck is
    dominated by me. Happiness is getting the world I want." Drawing on Buddhist teachings,
    he points out that the very posing of the question "How can I be happy" is a symptom
    of "suffering" (`duhkha`) as spoken by the Buddha—Shakyamuni Buddha diagnosed
    "suffering" as the first noble truth of life, "it is a continuous impermanence,
    a discomfort and imbalance in encountering events." Wirth points out: "The more
    I want happiness, the more I aggravate this root problem—this root problem is
    the ''I'', the ''I'' that has long felt uncomfortable with itself and the things
    of the world it inhabits." Thus, ironically, the more I pursue happiness, the
    deeper I sink into the misfortune implied by the "I." This is the paradox of happiness—suffering
    and the relentless pursuit of happiness are two sides of the same coin, "our insistence
    on pursuing happiness precisely sustains and aggravates our unhappiness." This
    cannot help but remind one of the ringing words of the American Founding Fathers
    in the *Declaration of Independence*: the pursuit of happiness is an inalienable
    right, a self-evident truth. They certainly did not realize the irony therein.![](img/#part0002.html#note5n)
    However, perhaps they also never imagined that the modern concept of happiness
    is built upon self-inflation, plundering nature, overconsumption, and an ever-deepening
    wealth gap. This global viral pandemic may perhaps prompt people to slow down,
    reflect on certain seemingly plausible but false self-evident truths of modern
    society, and promote a shift and transformation of consciousness—this is the common
    aspiration of all authors of this book.


    ## Can High Technology Lead Humanity Out of the Predicament?


    During this pandemic, technology has demonstrated powerful strength and efficacy
    in all aspects of epidemic control: from virus gene isolation and sequencing,
    case detection and diagnosis, to drug and vaccine development, to information
    collection and classification, and large-scale population tracking, temperature
    measurement, identification, and analysis, technology has rightfully assumed its
    role, being omnipresent and becoming an indispensable tool and means for humanity
    to fight the epidemic. After the outbreak, empowered by technology, people basically
    restored normal life through online work, online business, and online education.
    Indeed, technology has given us the confidence, backbone, and means to treat the
    virus. However, interestingly, in this anti-epidemic process, "alternative technology"—Traditional
    Chinese Medicine (TCM)—showed great prowess in epidemic prediction, disease prevention,
    mild case treatment, and patient recovery, attracting the attention, skepticism,
    or admiration of people already domesticated by high technology.


    Philosopher Zhang Xianglong precisely starts from the fluctuating fortunes of
    TCM in the epidemic to launch his questioning of the widespread worship of high
    technology today. Technology is certainly important, but if technology is turned
    into a supreme ideology, humanity has embarked on a road of self-enclosure. Zhang
    Xianglong points out that high technology "is fully objectified, able to produce
    novel effects relatively quickly—new productivity, commercial profits, Nobel Prizes,
    enhancing the reputation of the ''extraordinary persons'' of technology, thereby
    enhancing the holder''s control and influence over nature and others." Technology
    has undoubtedly played a powerful driving role in human evolutionary history,
    playing a huge role in improving human survival conditions, extending human life,
    and improving the quality of human life. However, if this advocacy and encouragement
    of technology develops into a monopolistic, black-and-white mode of thinking,
    it solidifies into a thought tendency and ideology, "treating high technology
    as the only truth in every field and matter, to be unconditionally promoted worldwide,
    while regarding other research or practical methods in the same field and matter
    as heresy, at least as non-truth, which must be excluded and knocked down before
    one feels satisfied." This thought tendency and ideology is called "high technology
    worship" by Zhang Xianglong. This worship excludes other ideas and practices adhering
    to different methodologies. What it truly worships is "not truth, but power."


    Zhang Xianglong points out that the limitation of fully objectified high-tech
    thinking lies in its inability to "keep up with the flow of life time." The "understanding
    full of temporalization or opportunization," relying on "functionalization" and
    "interpenetration," possessing holistic cognition—TCM thinking does not reject
    objectified analysis, but emphasizes grasping the human body and mind in the whole,
    preventing diseases that have not yet been objectified (the so-called "treating
    the undiseased"), opportunely adjusting treatment methods, and actively cooperating
    with food, lifestyle, and body-mind conditioning plans. Based on TCM''s outstanding
    performance in the epidemic, Zhang Xianglong calls for humanity to open up thinking,
    and to judge, think, and analyze the human condition of existence in a diversified
    way, fully integrating the non-objectified, yin-yang opportunistic dimension of
    thought.


    Zhang Xianglong further proposes the concept of "appropriate technology," which
    is "technology most suitable for the overall survival of local communities and
    even all humanity." He further explains: "From the perspective of time, this technology
    allows people to optimally combine current urgent needs and long-term future interests;
    methodologically, it can be both objectified and non-objectified; in terms of
    the quality of life it promotes, it enables people to embed and blend safety and
    comfort, material (physiological) and spiritual, conservative and enterprising
    (or tradition and innovation), simplicity and richness, nature and artifice to
    the maximum extent, thereby experiencing a beautiful life."


    ## How Can Humans Be Free?


    In this global pandemic, another concept that has attracted widespread attention
    and discussion is freedom. After confirming the high infectivity of the novel
    coronavirus, the Chinese government immediately announced a city lockdown in Wuhan,
    the initial outbreak epicenter in China. As the epidemic spread to other Chinese
    cities, measures such as city lockdowns, community closures, stay-at-home orders,
    mandatory social distancing, contact tracing, and cancellation of public transportation
    services like flights and trains spread nationwide. These restrictive measures
    played a role in curbing the spread of the epidemic and alleviating pressure on
    the medical system. However, initially these measures were widely criticized and
    condemned internationally.


    The famous Italian thinker Agamben, in the early stages of the Italian epidemic,
    voiced the strongest opposition to the Italian government''s policies restricting
    personal freedom, triggering a major debate in global intellectual circles. Agamben
    believed those emergency measures were irrational and panic-driven, a manifestation
    of contemporary governments exaggerating crises to seize and abuse power; he worried
    about the normalization of this "state of exception." He believed one should not
    sacrifice "life" (qualitative life/bios) for "bare life" (survival/zoe); living
    in a wretched way is worse than dying.![](img/#part0002.html#note6n) Zhao Tingyang
    believes Agamben "unrestrainedly upgrades the context of the COVID-19 pandemic,
    thereby leading to a misplacement of the problem." He further points out that
    giving up freedom under certain conditions is similar to the "cost" in economics
    that can never be shaken off; this trade-off is one of the conditions for the
    sustainability of all happy lives. Obviously, Zhao Tingyang''s criticism of Agamben
    is very restrained here. In my view, although the issues raised by Agamben are
    not entirely groundless, at that time and place when the situation was urgent
    and the source and spread of the virus were not fully understood, elevating the
    risk of "abuse of power" possibly brought by measures restricting rights and freedom
    to the extreme, and assuming the measures restricting freedom were immutable,
    and then refuting them, seems somewhat affected—turning a real problem into a
    classroom thought game, drilling into a dead end of thought.


    Inspired by Zhuangzi, Wang Rongrong uses the Daoist discourse system to think
    through a set of theoretical and practical physical and mental coping mechanisms
    applicable to humans in a "nothing can be done" situation (during lockdown). She
    focuses on three aspects proposed by Zhuangzi: "riding things" (cheng wu), "wandering
    mind" (you xin), and "nurturing the center" (yang zhong), "clarifying what ''riding
    things'' means by contemplating ''helplessness,'' recognizing ''wandering mind''
    by exploring the ultimate source of joy, and giving ultimate meaning to life by
    interpreting ''nurturing the center''." Zhuangzi''s "riding things" reveals that
    life is full of unforeseen changes, and the range and ability of human control
    are limited. Thus, "being at peace with the times and dwelling in 顺" (an shi er
    chu shun), cultivating virtue, and responding to impermanence are especially important.
    "Wandering" (you) is Zhuangzi''s concept and attitude for dealing with change
    and events. Wang Rongrong points out that "wandering" originates from three realms:
    external wandering, internal wandering, and Dao wandering. External wandering
    is the realm of sightseeing and "five colors blind the eyes" that people today
    are obsessed with, which is obviously inapplicable when the world is locking down
    cities and confining people due to the epidemic. Internal wandering and Dao wandering
    are what the "Moment of the Dao" should focus on. Wang Rongrong believes internal
    wandering is rooted in the ability of self-observation. "Wandering in the mind
    or intent relies neither on external things, external stimuli, nor sensory input.
    This wandering is the wandering of one''s own mind and intent, a self-sufficient
    closed loop." Dao wandering is a step higher, wandering in the Dao, wandering
    in the infinite, independent of external things and circumstances, "following
    heaven and according to the Dao," "utmost beauty, utmost joy." The ultimate state
    of "wandering" should be "nothing unsuitable, nothing unreached, nothing unobserved"
    wandering. Obviously, this "wandering" is vastly different from the "freedom"
    understood in modern society; the former is introspection, self-questioning, and
    elevation of consciousness, while the latter is an ideology that guides people
    to strengthen the distinction between self and other, seek externally, and struggle.


    "Nurturing the center" is the expedient method to achieve internal wandering and
    Dao wandering. Wang Rongrong points out that Zhuangzi''s nurturing the center
    includes three aspects: nurturing the heart, nurturing qi (vital energy), and
    nurturing the governing vessel (du mai), which are practical methods for "responding
    to changes, destiny, and those unfathomable events, grasping newly emerging opportunities,
    and making the best choices."


    Then how do Buddhist philosophers view freedom? Wirth lashes out at the view of
    freedom and rights prevalent among some Americans today. These views hold that
    anything hindering one''s doing whatever one wants is an infringement of personal
    rights and a trampling of personal freedom. Thus, they oppose mandatory masks,
    resist social distancing, and refuse contact tracing measures. Wirth calls this
    claim for freedom and rights that disregards the safety of others and oneself
    the claim of the "right to stupidity," in other words, humans claiming the right
    and freedom to "act" recklessly. It is precisely this view and practice of freedom
    that has triggered the ecological crisis, causing us to ignore animals'' natural
    habitats and living space, accelerating the spread of diseases from animals to
    humans. Wirth believes the freedom pursued by people in modern society "is not
    contained within natural freedom (as spoken of in Dharma and Daoism), but exists
    in our willful struggles, the purpose of which is to place our self above nature."


    ## What is Life and Death? Liberation from Life and Death


    "Life is paramount," "Survival is the hard truth," "Better to live badly than
    die well"—such folk appeals and expressions have had extremely high "screen time"
    in daily conversations and social media during the epidemic. The mutual cooperation,
    watching over, and support among Chinese people during the lockdown period also
    reached a peak.


    Ideologically, I believe this strong desire for survival originates from the "Sheng
    Sheng" (Generating Life) in the *I Ching* (Book of Changes). According to the
    "Sheng Sheng" view, continuous growth and eternal change are the fundamental attributes
    of all things in the universe. Heaven and Earth are the most supreme life forces
    in nature, giving and maintaining the generation, continuation, and prosperity
    of all things, the so-called "The great virtue of Heaven and Earth is called Life."
    Chinese indigenous philosophical schools drew inspiration for governing human
    society from the endless creativity of nature. Confucianism urges people to emulate
    "Heaven" (Qian) to continuously grow and create, pursuing the ideal model personality,
    the Junzi (Superior Person). Daoism values "Earth" (Kun) for its qualities of
    immortality, nurturing all things, and selflessness. Emulating "Earth" can cultivate
    a character that supports and nurtures life and unites with nature. In short,
    "Sheng Sheng" praises life, survival, creation, giving, prosperity, continuity,
    and coexistence. This attitude towards life influences Chinese people to develop
    a mentality of continuous self-renewal, optimism, and positivity. When comparing
    the similarities and differences between Chinese and Western philosophy, master
    of Sinology and philosopher Zhao Lingling, who has been immersed in comparative
    Chinese and Western philosophy for many years, points out that the starting point
    and main issue of Chinese philosophy is "seeking life" (qiu sheng), i.e., how
    to preserve life, live well, and live long, forming a sharp contrast with Western
    philosophy''s "seeking knowledge" (qiu zhi) originating from curiosity, thus deriving
    different value systems and attitudes towards life.


