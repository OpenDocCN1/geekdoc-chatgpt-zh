    # 07


    **"The Coronavirus Sutra": A Buddhist Reflection on the Pandemic Reveals Another
    Reasonable Way of Human Life**


    **Jason Worth**


    ![](img/00018.jpeg) ![p184](img/00002.jpeg)


    > America has another way of life,

    >

    > Neither rich, nor drunk, nor on drugs. ![](img/#part0009.html#note90n)


    Warren once meditated on the streets and in the temples of Kyoto, in a city ruined
    by imperial conflict yet flourishing with Zen culture and spiritual cultivation;
    he was also deeply troubled—for Nixon''s America, for the dual degradation of
    ecology and spirituality, for the Vietnam War. In a predatory nation owned by
    and serving the rich, one choice was to join the ranks of the rich, though this
    choice was almost impossible to succeed, and such an attempt at problem-solving
    was merely aiding a tyrant. Another possibility was "renunciation," drowning one''s
    thoughts with drugs and alcohol (the choice of many). Was there no "Middle Way"?
    The word "another" (ling you) points directly to the core of human suffering.
    Warren''s spiritual longing for "another" not only still meets people''s current
    needs, but its breadth has manifested as global. In the pandemic and the implicit
    realities it reveals, humanity''s questioning can be expressed in this sentence:
    In our global world, perhaps there is another reasonable way of human life...


    For Warren, this "another" is the koan his life concretely sets for our lives.


    In this regard, one must chew over and ruminate on the global situation. Or to
    change the metaphor: one must seize the opportunity, and treat this global novel
    coronavirus pandemic as a sutra to be studied. Just as Master Dogen of Eiheiji
    in Kamakura, Japan, said in his notes *Kankin* (Reading Sutras): "The sutra is
    the sutra from the whole self. This is said because your self is the self of all
    Buddhas and Ancestors, and also the self of all sutras." However, Dogen warns
    us: "Yet encountering a sutra is not easy." ![](img/#part0009.html#note91n)


    In the following Buddhist Zen contemplation, I will attempt to "encounter the
    sutra"; I hereby call this sutra the "Coronavirus Sutra." As a sutra, the "Coronavirus
    Sutra" is also the "Sutra of the Whole Self"; this sutra reveals our truth: that
    we are not disconnected individuals, but the self of all humanity—no, the self
    of all sentient beings. This article aims to encounter and directly face "another"
    reasonable way of human life.


    ## Question One: How Can I Be Happy?


    The novel coronavirus pandemic has subverted the world, eliminating the illusion
    that "the world is basically still normal." Now, we can more easily see the various
    inequalities ignored in "normal" life, or at least find it harder to turn a blind
    eye to them. The "Black Lives Matter" movement sweeping the US and expanding globally
    demands systemic change because people recognize from it that these inequalities
    are systemic in nature. The roots of the pandemic''s disaster fall disproportionately
    on historically marginalized groups; although we may pretend "we are all in the
    same boat," this is insincere. Yes, the novel coronavirus does not distinguish
    between rich and poor, powerful and vulnerable, but it is obvious that some can
    afford the cost of minimizing their probability of exposure to the virus, while
    others cannot. Taking the US as an example, undocumented agricultural workers
    are caught in a bizarre double bind: on one hand, they lack status and face sudden
    forced deportation; on the other hand, since the US food supply chain largely
    relies on these low-paid workers, they are listed as essential personnel who must
    continue working.


