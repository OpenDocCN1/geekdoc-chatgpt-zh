    # 05 The Viral Moment: Inescapability and the Question of Suffering


    Zhao Tingyang


    ![](img/00008.jpeg) ![p130](img/00012.jpeg)


    ## The Sudden Inescapability


    The 2020 COVID-19 global pandemic rapidly turned the viral moment into a political
    moment, a social moment, an economic moment, and a historical moment, even considered
    a potential historical watershed. Thomas Friedman believes history can be divided
    into "BC" (Before Corona) and "AC" (After Corona). Kissinger, who has seen the
    rise and fall of nations, also believes the "political and economic upheaval brought
    by the virus may last for generations" and even "forever change the world order."
    Such predictions reveal a genuine premonition: the world is about to change. Robert
    Shiller offers a different historical-sociological perspective: "I view the pandemic
    as a story, a narrative. The novel coronavirus itself can spread as a story,"
    "narratives can also be contagious like viruses. If a story dominates the public
    sphere for several years, it will change many things like an epidemic."


    But the verdict on the viral moment is still out; it is evolving in uncertainty.
    Whether the viral moment truly becomes an epochal moment depends on the world''s
    subsequent actions and attitudes. Half the answer lies with the virus, the other
    half with humanity, and both the virus and human actions are unpredictable "irrational
    numbers." Here, we will not pursue the answer for now, nor do we have the capacity
    to foresee it; let us first analyze the problems raised by the viral moment.


    Viewing the viral moment as an "epic" upheaval or "historical watershed"—these
    literary descriptions require a clear frame of reference to be discerned. If we
    take the least controversial epochal events as a reference scale, we might make
    a magnitude comparison. The most significant events in history are none other
    than inventions that changed life, production, or cognitive abilities, such as
    writing, the wheel, agriculture, industry, logic, calculus, relativity, quantum
    mechanics, vaccines, antibiotics, the internet, genetic technology, artificial
    intelligence, etc.; or inventions of the spirit, such as major religions, Greek
    philosophy, Pre-Qin thought, etc.; or political revolutions, such as the French
    Revolution and the October Revolution; or large-scale wars, such as WWII; or economic
    upheavals, such as the Age of Discovery, capitalism, the globalized market, and
    the dollar system. Comparing against this rough frame of reference, unless subsequent
    unforeseen political or spiritual upheavals occur, the COVID-19 event itself does
    not possess the energy for such a massive upheaval, but according to economists''
    estimates, it may suffice to cause a Great Depression similar to 1929–1933.


    We can also examine the viral moment through a different analytical framework
    or historical standard. Braudel''s three durations (temps) are an explanatory
    option. "Events" have temporariness, equivalent to the short-term waves in the
    stream of historical time. Then, what kind of waves can reach the medium-term
    *conjoncture* (conjuncture/trend) sufficient to form a "major trend" in historical
    time, or even touch the deep waters of the long-term *structure*? It is almost
    certain that the influence of the COVID-19 pandemic exceeds short-term events,
    and it may form a certain medium-term trend. If it truly determines the trend
    for decades, that would be terrifying. If the COVID-19 pandemic only causes consequences
    at the level of the Great Depression, it seemingly still belongs to the category
    of events—albeit a major event—but not enough to form a major trend; if it leads
    to a change in the political landscape, that constitutes a major trend. The possibility
    of this major trend looms with thunder, but a sufficient and necessary reason
    for its emergence has not yet formed; we must also consider the resistance from
    the established long-term "structure." The deep structures of civilization, society,
    and thought possess a stable inertia that resists change.


    Historically, after the shock of an accident, a rebound often occurs; most things
    seek their roots and restore their path dependence, thereby returning to their
    original state—"forgetting the pain once the wound heals." This rebound is not
    only psychological but also rational, especially in terms of cost calculation.
    The "structure" formed over a long period has condensed massive costs: not only
    time costs, economic costs, and technical costs, but also cultural, ideological,
    and psychological costs. The superposition of these costs forms a stability not
    worth changing. Destroying the "structure" is "removing the firewood from under
    the cauldron," a risky venture endangering conditions of existence; hence, revolution
    is an extremely high-cost change. Successful revolutions always occur when the
    old structure has completely failed—when the old structure loses spiritual vitality,
    can no longer guarantee social security and order, and cannot maintain economic
    levels. It can be noted that since 1968, the world has seen a large number of
    continuous "deconstruction" movements, but they mainly dismantled some surface
    structures of civilization, such as the concept of art, the concept of gender,
    social identity, and self-identity, etc., without yet shaking deep structures
    like economic and political systems and thinking methodologies. The most radical
    "deconstructions" exist almost only in texts, difficult to materialize. The historical
    force of the deconstruction movement is equivalent to the "renovation" of the
    structure: since there is no ability to build a new house, one can only renovate
    in various ways. If there is still no ability to conceive a new structural design
    in a new dimension, and no ideas, principles, and social energy with "constructive
    power," "deconstruction" will ultimately be impossible to turn into revolution;
    deconstructive behavior will instead be absorbed into the old system in a not-too-long
    time, becoming new flowers on the old tree of the old structure.


    According to Braudel''s understanding, geographical structures, economic structures,
    social structures, ideological structures, or spiritual structures—these deep
    structures belonging to the long term—possess super-strong stability and are thus
    difficult to change. Precisely because of this, once a millennium-scale transformation
    occurs, such as the formation of modernity or capitalism, it becomes a major problem
    reflected upon for 200 years, while the unsolved modernity has already awaited
    the "epochal upgrade" of the structure. However, whether the COVID-19 pandemic
    can trigger a new structure remains an open question. Regarding the outcome of
    the COVID-19 pandemic, a rather popular and most severe prediction is the end
    of globalization. If this result occurs, it undoubtedly reaches a medium-term
    trend change, and even touches the long-term structure.


    Globalization is a result of capitalism; as long as capitalism exists, capital
    can hardly resist the temptation of the global market. The current globalization
    model is only primary globalization; in economic terms, it is the "globalization
    of division of labor." In the division of labor chain, participating countries
    benefit to varying degrees. The "globalization of division of labor" may be terminated,
    but various places still need the global market to guarantee economic growth,
    and technologized and informatized economies need maximum expansion even more.
    Therefore, the end of globalization is not a very positive rational incentive
    economically, technologically, and informationally. Of course, a political end
    to globalization is not excluded; politics has its own dynamics. In any case,
    the pursuit of maximized autonomous security and exclusive interests will become
    a prominent issue in the future; therefore, a transformation of globalization
    may occur—from "globalization of division of labor" to "competitive globalization."
    If so, that at least forms a medium-term major change.


    "Competitive globalization" means the global market continues to exist, and economic,
    technological, and informational globalization continues, but the nature of the
    globalization game changes: the proportion of "cooperative games" in the original
    globalization greatly decreases, while the proportion of "non-cooperative games"
    greatly increases, and a situation where "non-cooperative games" clearly overwhelm
    "cooperative games" may even form. The danger lies in that competitive globalization
    may intensify, leading to the dissipation of globalization''s rent value, causing
    globalization itself to evolve into a dilemma where exiting is unprofitable and
    staying is also unprofitable. Of course, this is an extreme possibility; the higher
    probability is that when non-cooperative games lead to unprofitability, cooperative
    games will regain attractiveness—at least according to Axelrod''s evolutionary
    game model. Historical experience also shows that humanity always falls into dilemmas
    but always manages to find ways to escape.


    How far and deep will the "chain of problems" of the COVID-19 pandemic go? Will
    it touch and shake the deep concepts of human thought, i.e., philosophical concepts?
    This will determine whether the COVID-19 pandemic has long-term influence. We
    cannot travel to the future to preview the pandemic''s results, but we can currently
    see "wake-up calls" (reminders). Wake-up calls do not necessarily indicate results,
    but they imply problems.


    Among the wake-up calls, we first see the "state of inescapability" forgotten
    in prolonged revelry. Many regions of the world, in a frequent and ubiquitous
    "carnival state," forgot the state of inescapability of disaster. Holiday tourism,
    concerts, sports events, product launches, premieres, TV programs, corporate annual
    meetings, sales events, shopping malls, art exhibitions—all can be turned into
    carnivals, to the extent that the carnival not only occupies time but becomes
    space itself. When temporal existence occupies the time of space long enough,
    it changes the nature of space; even when temporal activities end, the space has
    been infected with a carnival nature that is difficult to fade. Finally, both
    living space (outer space) and psychological space (inner space) were infected
    with the carnival nature.


    Speaking with facts, the high-intensity infectivity of COVID-19 made the world
    inescapable, overwhelming the infectivity of the carnival. Originally, the "state
    of inescapability" as an extreme possibility was never absent in theory, but theory
    was absent—revelry does not need theory, so theory was forgotten. The "state of
    inescapability" is not an abstract possibility; it has many concrete images, such
    as global nuclear war, asteroid impact on Earth, hostile alien civilization invasion,
    etc. The probability of such possibilities is said to be very low, and once they
    occur, they mean the end of humanity, so they are not worth thinking about. Therefore,
    the "state of inescapability" is not considered a problem, but a conclusion, or
    the termination of the problem. The "state of inescapability" disappeared from
    the problem list, turning psychologically into horror legends or sci-fi stories,
    maintaining a safe distance from reality, so they can be safely enjoyed masochistically;
    stories of great destruction even possess entertainment and surrealism. However,
    the "state of inescapability" is not without historical precedent. The extinction
    of dinosaurs, though a disaster for dinosaurs, contained possibilities equally
    valid for humans; histories everywhere transmit stories of extinction-level great
    floods, the Black Death in the Middle Ages, the 1918 Great Influenza, the nuclear
    war that nearly happened during the Cold War, and so on. But these histories have
    all turned into old stories separated by time, thereby obscuring the problem.
    COVID-19 may not be as destructive as the above historical cases, but due to modern
    transportation and globalization, it formed a "blitzkrieg" effect, directly turning
    the "state of inescapability" into reality, thereby exposing the relevant problems
    that need to be faced, and turning things that were originally non-problems back
    into problems. This "problematization" is creative, meaning that originally trustworthy
    social systems, institutions, and concepts can mutate into problems under accidental
    conditions. Human social systems can withstand slow changes that accumulate into
    huge changes, but cannot withstand sudden mutations. What is serious is not only
    the rampant spread of the virus, but also the moment of the virus''s spread—the
    contemporary moment when the circulation energy of globalization exceeds the risk-bearing
    capacity of every locality.


    Large-scale epidemics are not unique to globalization; they are an ancient problem.
    Before globalization, viruses spread "slowly" and could eventually spread worldwide,
    unless terminated somewhere by some luck. Although there is nothing new under
    the sun, the novel coronavirus pushed the old problem into new conditions, transforming
    it into a new problem. The high-speed spread of the novel coronavirus under contemporary
    interaction and transportation conditions formed a "blitzkrieg"-like effect, leaving
    medical systems, social management systems, economic operations, and relevant
    material resource systems in various places caught off guard and in distress.
    This turned the infectious disease from a pure disease problem into a comprehensive
    problem where social, political, and economic issues overlap, directly causing
    two results: one problem equals all problems—this is the most intractable situation
    for politics; one place equals all places—this is the most difficult situation
    for society to cope with. If this chain reaction breaches the dike uncontrollably,
    it will penetrate fragile social systems and knock on the door of the basic structures
    and concepts of human life; if it thereby partially changes the basic concepts
    of civilization, the COVID-19 pandemic may possess long-term significance.


    ## Physical Problems Expose Metaphysical Problems


    The COVID-19 pandemic rudely and directly raises a physical problem: the fragility
    of modern social systems, or in game theory terms, the lack of **"robustness"**
    in modern systems. Almost all aspects of modern social structure have achieved
    systematization. Interlocking systematization means high efficiency, but also
    means fragility. Modern systems constantly pursue minimum cost and maximum benefit;
    therefore, they usually lack buffer margins, exacerbating system fragility. To
    achieve benefit maximization, modern society''s capital, materials, equipment,
    production, transportation, and supply systems are all interlocking and running
    at full capacity—not only lacking margins in capacity but even pre-drawing on
    the future, always at the critical point of capacity overdraft. In fact, many
    systems are in a deficit state, making it difficult to cope with sudden mutations.
    Taleb long ago explained the fragility of modern systems with his "black swan"
    theory. The only system in modern society with huge margins is probably the military,
    such as nuclear weapons capable of destroying the world many times over; the financial
    system probably pre-draws on the future to the maximum extent. Finance is the
    basis of modern society''s operation; therefore, "pre-drawing on the future" has
    become a main characteristic of contemporaneity. The basic intention of contemporary
    systems is to hate uncertainty, but uncertainty is unavoidable. In terms of factual
    status, or ontologically, uncertainty is the real state of affairs, while "certainty"
    is actually a concept, an invention of logic and mathematics, and does not exist
    in reality.


    The COVID-19 pandemic is a precise strike on the vital point of modern systems,
    and this vital point is people, or life. The fragility of the modern system itself
    is only a hidden danger; in most cases, even when encountering uncertainty or
    even severe challenges, it can often ultimately escape, because the key factor
    of the system is people—people solve problems. People are flexible life; human
    thinking and action capabilities possess natural **"robustness"**; therefore,
    a system with people has vitality. However, the target of the novel coronavirus
    strike is precisely people; when human life is universally threatened, what force
    can the modern system rely on to escape?


    A fatal blow that can paralyze the modern system either directly threatens human
    life or threatens the basic needs of human survival (e.g., food), thereby endangering
    life. No matter how developed contemporary technology is, even if people live
    much of the time in sci-fi effects or virtual worlds, as long as humans remain
    carbon-based life, in the order of ontology, human life needs take priority over
    political needs, economic needs, value needs, hedonic needs, and cultural needs.
    More precisely, the basic needs of life are the greatest political, economic,
    and social problems. Although we cannot affirm whether COVID-19 is an "epic" challenge,
    it is certainly a paradigmatic challenge; it accurately steps on the nerve of
    the modern system: the life problem. This is the **Achilles'' heel** of the modern
    system.


    For a long time, discussions on global crises have focused more on financial bubbles,
    global warming, threats of big data and AI to freedom, animal protection, or glacier
    melting. These crises are certainly serious, but far from the "no egg stays intact
    under an overturned nest" crisis like COVID-19. Even some of these issues, such
    as global warming, still have controversies in the scientific community. But that
    is not the point; the key problem is that after these issues became "middle-class-ified,"
    they covered up more fatal crises, making people forget that farmers, workers,
    and doctors are the reliance for survival. The reason the COVID-19 pandemic touches
    the nerves so deeply is that it is a suddenly appearing wake-up call, once again
    reminding humanity of the collective security problem, once again reminding that
    the problem of "to be or not to be" forever has reality.


    Crises always start from physical fragility. For many economists, the COVID-19
    pandemic means a once-in-a-century economic disaster is occurring—depression of
    the real economy coupled with the collapse of the financial system. This is much
    deeper than the financial crisis caused by financial bubbles, because the real
    economy''s great depression will inevitably aggravate the financial crisis, and
    the financial crisis will in turn hit the recovery of the real economy, thus forming
    a cycle of decline. Relatedly, political scientists are more concerned about the
    political consequences that the "COVID economic crisis" may lead to. Some political
    scientists believe (whether worried or rejoicing) that globalization will end
    due to the COVID-19 pandemic. The termination of a movement (including globalization)
    may be a new beginning, or it may trap itself in a dilemma, depending on whether
    there is a better way out. Dissatisfaction with something does not automatically
    generate better options. Globalization was never a win-win cooperative movement;
    any cooperation encounters the difficult problem of how to distribute benefits;
    perfect cooperation exists only in philosophical theory, just as the "perfectly
    free market" has only ever existed in economics textbooks. As Xunzi discovered
    over 2000 years ago, where there is cooperation, there is inequality and dissatisfaction,
    where there is conflict and struggle. We can even say that cooperation always
    sows the seeds of conflict and always creates the destroyers of cooperation.


    '
