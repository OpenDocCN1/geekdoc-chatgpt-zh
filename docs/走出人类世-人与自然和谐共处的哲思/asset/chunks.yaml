    In summary, since modern times, humanity has persistently pursued "progress" and
    "breakthroughs" with a zero-sum competitive mindset, maximizing wealth creation
    and geopolitical advantage. While bringing tremendous material and civilizational
    development, this unbridled maximization mindset has also led us into today''s
    world of deteriorating environment, severed social bonds, and an increasingly
    fragmented and confrontational international system. It is time for humanity to
    learn and practice this symbiosis-based thinking from nature and ancient Eastern
