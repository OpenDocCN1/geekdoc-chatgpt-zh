    \n26. The \"Five Phases and Six Qi\" entry in \"Baidu Encyclopedia\" states: \"\
    The central content of Yun-Qi theory. The Ten Heavenly Stems: Jia and Ji combine\
    \ as Earth Phase, Yi and Geng as Metal Phase, Bing and Xin as Water Phase, Ding\
    \ and Ren as Wood Phase, Wu and Gui as Fire Phase, collectively called the Five\
    \ Phases; the Twelve Earthly Branches: Si and Hai combine as Jueyin Wind Wood,\
    \ Zi and Wu as Shaoyin Monarch Fire, Yin and Shen as Shaoyang Minister Fire, Chou\
    \ and Wei as Taiyin Damp Earth, Mao and You as Yangming Dry Metal, Chen and Xu\
    \ as Taiyang Cold Water, called the Six Qi. Calculating the Five Phases from the\
    \ Year Stem, the Six Qi from the Year Branch, and observing the generating/controlling\
    \ and conforming/restraining relationships between Yun and Qi to judge the climate\
    \ changes and disease occurrence of that year. This is the basic content of Five\
    \ Phases and Six Qi.\"\n\n27. For discussion on this topic, see also the author's\
    \ article: Technology, Dao-Shu, and Home—The Significance and Limits of Heidegger's\
    \ Critique of the Essence of Modern Technology [J]. *Modern Philosophy*, 2016\
    \ (5): 56–65. Especially the fifth and sixth parts of that article.\n\n28. Jing\
    \ Wenna. Fighting the Epidemic, TCM Bravely Serves as Vanguard [N/OL]. *China\
    \ Economic Herald*, 2020-03-05 (6). http://www.ceh.com.cn/epaper/uniflows/html/2020/03/05/06/06_39.htm.\n\
    \n29. Deng Tietao, Liu Xiaobin. *Modern History of TCM* [M]. Guangzhou: Guangdong\
    \ Higher Education Press, 1999.\n\n30. Zhang Xianglong. The New Form of Confucianism's\
    \ \"Tong San Tong\" and the Community Life of the North American Amish—An Alternative\
    \ Pursuit of Life Different from Modernity [M]// *Religion and Philosophy* (Vol.\
    \ 5). Jin Ze, Zhao Guangming, eds. Beijing: Social Sciences Academic Press, 2016:\
    \ 237–251.\n\n---\n\n# 04 The \"Shengsheng\" (Continuous Generation) View and\
    \ Symbiosis Thought: A Philosophy Fitting Heaven, Earth, and Human?\n\n**Song\
    \ Bing**\n\nThe COVID-19 pandemic has claimed over 4.5 million lives to date.\
    \ This global viral pandemic has deepened existing global challenges, such as\
    \ governance failure, slowing economic growth, social fragmentation, and geopolitical\
    \ disputes, and has profoundly changed our thinking and judgment on these issues.\
    \ Will this pandemic, in a deeper philosophical sense, change our understanding\
    \ of the human condition of survival?\n\nThe Berggruen Institute pointed out in\
    \ the intellectual magazine *Noema*, launched in 2020, that looking back at history,\
    \ people will regard the COVID-19 pandemic as a \"Great Acceleration\" and an\
    \ \"epistemological tipping point\" that \"fundamentally shook all established\
    \ ideas.\" [⁵⁰] German philosopher Markus Gabriel pointed out that \"the COVID-19\
    \ pandemic has revealed the systemic weaknesses of the dominant ideology of the\
    \ 21st century, namely our steadfast belief that human and moral progress can\
    \ be driven by technological progress alone.\" He called for a \"metaphysical\
    \ pandemic\" to awaken a brand-new understanding of global consciousness in human\
    \ society. [⁵¹] In the coming decades, we are bound to encounter more global crises,\
    \ and the need to construct a new global consciousness will only become more urgent.\
    \ These crises may stem from new virus attacks, climate change, nuclear crises,\
    \ and other unforeseeable man-made or natural disasters.\n\nWinston Churchill's\
    \ famous saying, \"Never waste a good crisis,\" has become a cliché in recent\
    \ years. From the word \"crisis\" (危机 *weiji*), we can glimpse that facing crises,\
    \ contemplating the opportunities and breakthroughs brought by peril is deeply\
    \ rooted in the cultural genes of China. In view of this, it is timely to conduct\
    \ a deeper reflection on the basic values of humanity. Such reflection can both\
    \ inspire us to meet current challenges and compel us to look forward and think\
    \ about how to bring sustainable prosperity to humanity and other life forms on\
    \ the planet.\n\nIn this article, I seek inspiration from the \"Shengsheng\" (Continuous\
    \ Generation) view and the idea of the unity of all things, which have a decisive\
    \ influence on the spiritual characteristics of indigenous Chinese philosophy,\
    \ and point out how they have supported and shaped the symbiosis thought hotly\
    \ discussed in Chinese and Japanese academic circles in recent decades. When we\
    \ contemplate the future vision of humanity, symbiosis thought may be the philosophy\
    \ that fits heaven, earth, and human.\n\n## \"Shengsheng\" and Life and Death\n\
    \n\"Life is paramount\" (人命关天), \"Survival is the hard truth\" (活着就是硬道理), \"Better\
    \ to live badly than die well\" (好死不如赖活)—these are common expressions in the daily\
    \ life of Chinese people. They appeared again and again in daily conversations\
    \ and on social media during the epidemic fight. What is the cultural root of\
    \ this strong desire for survival? What aspects of the Chinese view of life and\
    \ death does it reveal? Conceptually speaking, the source of this strong desire\
    \ for survival is undoubtedly the wellspring of Chinese philosophical wisdom—the\
    \ \"Shengsheng\" view in the *I Ching* (*Book of Changes*). The sages who created\
    \ the *I Ching* observed celestial phenomena above, examined geography below,\
    \ took examples from the body near at hand, and from things afar; they insightfully\
    \ perceived the waxing and waning of natural forces and the vicissitudes of human\
    \ affairs, concluding that \"Shengsheng\" (i.e., continuous generation and eternal\
    \ change) is the fundamental attribute of all things in the universe. Heaven and\
    \ Earth are the most sublime and greatest forces of natural vitality, giving and\
    \ sustaining the generation and propagation of all things, the so-called \"The\
    \ great virtue of Heaven and Earth is called Life (Sheng)\" [⁵²].\n\nIndigenous\
    \ Chinese philosophical schools drew inspiration for governing human society from\
    \ the inexhaustible creativity of nature and the concept of \"Shengsheng.\" Confucianism\
    \ urges people to emulate \"Heaven\" (Qian) to continuously grow and create, pursuing\
    \ the ideal model personality, the *Junzi* (Exemplary Person). Daoism values \"\
    Earth\" (Kun) for its qualities of immortality, nurturing all things, and selflessness.\
    \ Emulating \"Earth\" can cultivate a character that supports and nurtures life\
    \ and unites with nature. In short, \"Shengsheng\" extols life, survival, creation,\
    \ giving, prosperity, continuity, and coexistence.\n\n[⁴⁷]: Content of Note 47\n\
    [⁴⁸]: Content of Note 48\n[⁴⁹]: Content of Note 49\n[⁵⁰]: Content of Note 50\n\
    [⁵¹]: Content of Note 51\n[⁵²]: Content of Note 52\n\n"
