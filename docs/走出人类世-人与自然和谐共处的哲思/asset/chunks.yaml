    In short, the concept of "shengsheng" (unceasing generation/life generating life)
    has had a profound impact on the characteristics of indigenous Chinese philosophy,
    the value orientations of the Chinese people, and their modes of. The decisive
    act of constituting and maintaining a nation is the continuous separation of the
    non-self from the self, where the non-self is the pathogen or outsider still close
    to nature, and thus more animal than human.


    Now let''s talk about COVID-19.


    ## A Large-Scale "Indiscriminate" Event


    What impact does this exponentially growing configuration between human and non-human
    things, triggered by a virus, have on the modern political form?


    I gradually realized that COVID-19 is a large-scale "indiscriminate" event. By
    this I mean that COVID-19 step by step eliminates the distinction between humans
    and nature that first appeared in early modernity and has since been taken for
    granted. This indiscrimination occurs at many different levels. Here are three.


    The first level is perhaps the most obvious, stemming from the zoonotic nature
    of the virus. Bats, pangolins, humans: to the novel coronavirus, there is nothing
    special distinguishing humans from animals. On the contrary, to the novel coronavirus
    (as to any other zoonotic virus), we humans are animals among animals; we are
    just another multicellular organism, another habitat suitable for viral replication.


    In the past, we have had opportunities to learn this fact of our animality. In
    recent years, humans have been infected with avian flu, SARS, swine flu, MERS,
    HIV, and other viruses, originating from birds, bats, pigs, camels, and chimpanzees
    respectively. We have also been infected by hybrid viruses from birds and pigs.
    Every time a zoonotic disease occurs, the indiscrimination between human animals
    and non-human animals appears.


    The second level is our genetic makeup, 8% of which originates from viruses. This
    8% is the result of another zoonotic disease. About 500 million years ago, when
    the first multicellular organisms evolved from bacteria, viruses did what they
    do—infected multicellular organisms, and in some cases, inserted themselves into
    the multicellular genome, thereby altering the developmental processes and behavioral
    patterns of these organisms.


