    # 序言：走出人类的错位与迷惑


    **宋冰**


    自2019年底以来，新型冠状病毒肺炎（简称“新冠肺炎”）疫情持续在全球蔓延、病变，呈波浪式回潮、反复。虽然有些国家和地区因为早期采取了强力的抗疫措施，暂时控制住了疫情，人们的生活与经济运转慢慢复苏，但“风景独好”的形势依然脆弱。从全球范围来看，因新冠肺炎疫情而加深的社会撕裂、政治纷争、经济衰退和地缘政治冲突升级还在发酵、恶化，全球社会动荡加剧。


    不同政治理念、治理框架和社会文化心理以及相应的公共卫生危机管理之间的比较、分析和反思充斥各大媒体和学术、政策期刊。然而，值此危机来袭之际，我们是否应该更深层次地审视人类的生存状态，以及形成和助推这种生存状态的理念和制度？新冠肺炎疫情只是近年来人类面临的众多全球性挑战和灾难之一。在生态日益恶化、气候变化加速、地缘政治冲突不断升级的情况下，更多自然的与人为的全球性危机会不断上演。那么，我们是否应该借此机缘深刻反思我们奉为圭臬的价值观体系和认识，甚至回到哲学探索的原点，重新思考一系列根本性问题呢？德国哲学家马库斯·加布里埃尔指出，“新冠肺炎疫情揭示了21世纪主导意识形态的系统性弱点，即我们一直坚信只依赖科技进步即可推动人类和道德进步”，他呼吁来一场“形而上学大流行”，以唤起人类社会对全球意识的全新认识。[![](images/00007.png)](#part0002.html#note1n)


    哲学家赵汀阳积极回应，认为人类需要一场像流行病一样有力量的形而上反思，“让思想获得集体免疫”，他呼吁人类要突破现代思想的维度，发现或创造比现代思维更高的思想空间，在更高的维度或者说在更根本的层面上“摆脱现代思想的向心力”，重新思考深层哲学概念。旅美道家哲学家王蓉蓉将这场全球新冠大流行称作“道”的时刻。西雅图大学佛学家、日本禅宗受戒法师贾森·沃思认为，全球新冠肺炎疫情或许就是日本镰仓时代永平道元大师所说的“遇经”时刻，人类要把握这个机缘，把这场全球性新型冠状病毒的大流行当成一本经书来研读。


    为回应这些呼吁，我们邀请了一些哲学家和生物学家讨论以下问题：人类和其他生命形式的本质是什么？我们如何与自然及其他存在形式联结？生命演化、变异的规律是什么？自由、幸福、苦难、生与死又意味着什么？高歌猛进的高科技文化及其思维方式是否可以使人类摆脱日益深化的困境？人类当下最紧要的思维转向应该是什么？这本书所汇集的思考与论述或许会改变、逆转甚至颠覆我们习以为常的现代社会基础的观念和思维。这或许可以成为让人类获得“集体思想免疫”探讨的起点。


    为了使读者对本书有整体的把握，我在此简要梳理参与本书写作的各位作者对以上问题的回应与论述。


    ## 生命是什么？人的本质是什么？人类和病毒的关系


    生物学家白书农梳理他几十年来在生物学领域的研究与思考，打破静态、单一物质形态的生命观，主张从“生命系统”这个视角去理解生命。他认为，“生命=活+演化（迭代）。其中活是**特殊**组分（即碳骨架分子）在**特殊**环境因子参与下的，以分子间力为纽带的**特殊**相互作用，即结构换能量循环。而‘演化’是上述三个特殊相关要素的复杂性自发增加”。[![](images/00007.png)](#part0002.html#note2n)以此定义，生命系统是一种特殊的物质存在方式，它依赖于分子间力的相互作用，“是在不断分分合合的动态过程中的一种可被人类辨识的、相对稳定的中间状态”。[![](images/00007.png)](#part0002.html#note3n)


    那人又是什么呢？人在这个复杂的生物系统圈中扮演着什么角色呢？白书农认为，从生物学的视角看，人类本质上就是地球生物圈中的一个子系统。人类与其他生命子系统的区别首先在于人类与其他物种的生殖隔离，但更重要的是人类独特的认知能力。这种认知能力使人类可以突破食物网络对自身维持与演化的制约，从而走出一条与其他生物不同的演化道路。在审视人类作为生命子系统运行的要素是否因受到新型冠状病毒的冲击而有所改变时，白书农认为，新冠肺炎疫情暴发所凸显的各种问题其实是人类这个生命子系统自身长期积累下来的毛病，病毒只不过是触发这些深层次问题的导火索。所以，与其为疫情而陷入无谓的焦虑，不如认真反思我们长期以来的“人本”或“神本”理念。在白书农看来，既然人是生物，“那么人类的生存与发展终极而言不得不服从生命系统的基本规律”。这些规律在地球生物圈出现之前就已经形成，并生生不息。


    德国人类学家、哲学家托比·李思深刻认识到微生物与人类同呼吸、共命运的关系，但令人汗颜的是，我们人类几乎不会从微生物世界（比方说病毒）的角度来思考自己。其实，“对新型冠状病毒来说，人类没有什么不同于动物的特别之处。相反，对新型冠状病毒而言（对任何其他人畜共患病毒均是如此），我们人类只是动物中的一种动物而已。我们只是另一种多细胞有机体，另一个适合繁殖的栖息地”。我们其实不是生活在人类世，而是一直生活在微生物世。李思呼吁人类在思想意识层面摒弃人类世的陋习，学会从病毒的视角来理解、研判这个星球和人类社会。的确，我们人体有约50万亿个细胞，而我们携带的微生物则超过细胞数的10倍。这些微生物种类繁多，包括病毒、细菌、真菌，这些微生物组合在一起形成人类微生物群系。它们与我们共生共存。如果以数量和生命力论“英雄”，微生物才是这个星球的王者！我们只不过是几千种哺乳动物中一个渺小的群体。和细菌与病毒相比，我们只是这个地球上“初来乍到”却横冲直撞的家伙。


    那么，病毒又是什么？它在这场热闹的生命讨论中又占有什么地位呢？它是生命吗？它与人类的关系是怎样的？病毒存在于这个星球已经有数十亿年时间，从智人出现那天起，病毒就与我们相生相伴。病毒不是独立的生命，必须要借助宿主细胞才能开展自己的生命活动和演化。于是病毒与人类形成了共生共存的局面。李思指出：“病毒具有促进变革的巨大力量。由于它们具有在物种间传播、变异和重组，以及在细胞间拾取和转移遗传物质的能力，它们对细胞生命的进化做出了非凡的贡献。如果没有病毒，哺乳动物就不可能进化；如果我们的基因组中没有病毒的`DNA`（脱氧核糖核酸），人类有机体就不可能发育，我们的器官也不可能具备现在的功能。”


    科学家发现，和其他哺乳动物一样，人类借助病毒蛋白质才最初演化成有胎盘类哺乳动物，于是才有了人类的孕育和进一步演化。病毒学家与人类学家一致认为，病毒是人类演化最有力的驱动力。我们或许是病毒十分有效的宿主，因为我们热爱群居、社交、全球旅行，但是我们切不可因此而得意。我们显然不是它们唯一的宿主。它们不需要我们——没有人类，病毒依然故我，“长生久视”。这也是此次全球病毒大流行提醒人类的一个被遗忘的道理——人类需要大自然，但大自然未必需要人类。这或许也是老子在2
    500年前就指出的“天地不仁，以万物为刍狗”的真理的再次示现。


    那我们又应如何摆正人在自然中的地位呢？新冠肺炎疫情或许是压倒人类中心主义的最后一根稻草。现代社会的理念基石之一就是人类中心主义。近现代以来，人自以为脱离了动物的“低级趣味”，迈出了自然界，实现了对自然的控制和种属的超越，自然界的价值在于它能否被人利用和开发。作为最尊贵的存在形式，人围绕自己的利益对自然万物进行利用、开发和改造，理所当然。近现代社会中，人的主体性进一步登峰造极，迈向神坛。人的类神主体性与资本的逻辑、利润和财富最大化理念相结合，再辅以科技的翅膀，造就了当下人类的为所欲为，赵汀阳称之为无处不在的“嘉年华状态”。公众哲学中“幸福论”泛滥，每个人都拥有绝对“主权”，能够最大限度地扩大个人自由并将个人的私人偏好合法合理化，甚至道德化。虽然此前也偶尔有“梦醒”之时，但是很快人类就被新的科学技术发明、崭新的生活与社交方式吸引，于是一而再，再而三地戴着“面具”重返“嘉年华”舞场。这场全球新冠肺炎疫情或许终于可以击碎人追求成为神的梦想。


    ## 从“嘉年华”到痛苦深渊：什么是人的幸福和痛苦？


    新冠肺炎疫情陡然加剧了全球几十亿人的恐惧、痛苦和失落，让人们坠入赵汀阳所说的“无处幸免状态”。无论在世界的哪个角落，也无论人种肤色、贫富悬殊、地位高低、国籍与政治立场之别，病毒一视同仁，从暴发到蔓延，以迅雷不及掩耳之势，横扫全人类，令人猝不及防。这其实就是人类面临生存级别风险事件时所处的状态。这也是为什么著名思想家、作家贾雷德·戴蒙德认为，这场新冠肺炎疫情才是全人类第一次遭遇真正意义上的全球危机。[![](images/00007.png)](#part0002.html#note4n)


    除了前文提到的，我们需要直面近现代人类意识上的“错位”，摒弃人类中心主义，本书的作者也主张进一步反思构成现代社会基础的其他观念，比方说幸福、痛苦与自由。赵汀阳说：“我们更需要的是一种维特根斯坦式的‘无情’反思，从伦理学的外部来反思伦理学，否则其结果无非是自我肯定，即事先肯定了我们希望肯定的价值观。”他认为，在人类的“嘉年华”状态中，人类社会沉浸于不断创造和享受幸福的追求中。但是在一个解释生活的坐标系中，“幸福只是其中一个坐标，至少还需要苦难作为另一个坐标，才能够形成对生活的定位”。现当代社会带来的“幸福”没有抵挡苦难的能力。赵汀阳认为，苦难是人类无法避免，也无法给出“解药”的难题。他说：“苦难问题之所以无法省略也无法回避，因为苦难落在主体性的能力之外，就像物自体那样具有绝对的外在性，所以苦难是一个绝对的形而上学问题。”正因为苦难是个本源性问题而又无解，赵汀阳认为苦难问题可能是“形而上学大流行”的一个好选择。


    那么，佛教哲学家、日本受戒禅宗法师贾森·沃思又是怎么看待幸福与痛苦的呢？他指出，在当今世界，幸福就是“我们希望事情按照我们想要的方式发生”，而这又与“另一种假定捆绑在一起：幸福是我想要什么，对运气的索求是由我主导的。幸福是要得到我想要的世界”。他借用佛教教义，指出“我怎样才能幸福”这个问题本身的提出就是佛所说的“苦”（`duhkha`）的一种症状——释迦牟尼佛将“苦”诊断为人生第一真相，“它是一种持续的无常，一种遇事的不自在与不平衡”。沃思指出：“我越是想要幸福，就越是加重了这个根源性问题——这个根源性问题就是‘我’，是早就对自己和自己所在的世界之事感觉不自在的‘我’。”于是，反讽的是，我越是追求幸福，就越是深陷在“我”隐含的不幸之中。这就是幸福的悖论——痛苦和对幸福的不懈追求其实是一体两面，“我们对幸福的执意追求恰恰在持续和加重我们的不幸福”。这不由得让人想起美国国父们在《独立宣言》中的豪言壮语：追求幸福是天赋人权，是不言而喻的真理。他们当然没有意识到其中的反讽。[![](images/00007.png)](#part0002.html#note5n)不过，他们或许也不曾想到现代社会的幸福观是建立在自我膨胀、掠夺自然、过度消费和日益加深的贫富差距之上的。这次全球病毒大流行或许可以促使人们慢下脚步，反思现代社会某些似是而非的自明之理，促进意识转向与转化，这也正是本书各位作者共同的心声。


    ## 高科技可以引领人类脱离困境吗？


    在这次疫情当中，科技在抗疫的各个环节展现了强大力量与功效：从病毒基因隔离与测序、病例检测与诊断，到药物、疫苗研发，再到信息搜集与分类，以及大规模人群跟踪、测温、识别与分析，科技当仁不让，无处不在，成为人类抗疫不可或缺的工具与手段。疫情暴发之后，得益于科技赋能，人们通过在线办公、在线商业和在线教育基本恢复了正常生活。的确，科技给了我们抗疫的底气、信心和对治病毒的手段。然而，有趣的是，在这次抗疫过程中，“另类科技”——中医在疫情预测、疫病预防、轻症治疗、患者康复等方面大显身手，引起已被高科技驯化的人们的关注、质疑或赞叹。


    哲学家张祥龙正是从中医在疫情中起伏的境遇，展开了他对当下广泛存在的高科技崇拜的质疑。科技固然重要，但如果把科技变成至高无上的意识形态，那么人类就走上了故步自封的道路。张祥龙指出，高科技“是被充分对象化的、能较快地产生新奇效果——新的生产力、商业利润、诺贝尔奖，提高科技‘异人’的名声，从而提升持有者对自然、对他人的控制力和影响力的新科技”。科技无疑在人类演化历史上起到了强大的推动作用，在改善人类生存境遇、延长人的生命、提高人类生活质量等方面一直起着巨大的作用。但是，这种对科技的崇尚和鼓励如果发展成唯我独尊、黑白对立的思维方式，它就固化成了一种思想倾向和意识形态，“即将高科技当作每个领域、事项的唯一真理，要向全世界无条件地推行，同时将在同一领域和事项中的其他研究或实践方式视为异端邪说，起码是非真理，一定要排斥、打倒而后快和心安”。这种思想倾向和意识形态被张祥龙称为“高科技崇拜”。这种崇拜排斥其他秉持不同方法论的理念和实践。它真正崇拜的“不是真理，而是力量”。


    张祥龙指出，充分对象化的高科技思维的局限性在于，它“跟不上生命时间的流变”。而“充满时间化或时机化的理解”、倚重“功能化”与“交叠化”、具全局认知的中医思维并不摒弃对象化的分析，但中医强调在全局中把握人的身心，针对尚未对象化的疾病予以预防（即常说的“治未病”），适时调整对治手段和方法，积极配合食物、生活方式、身心调理的方案。张祥龙基于中医在疫情中的出色表现，呼吁人类开拓思维，多元化地判断、思考、分析人类自身生存的状况，充分融入非对象化、阴阳时机化的思想维度。


    张祥龙还进一步提出了“适度科技”的概念，也就是“最适于地方团体乃至整个人类的总体生存的科技”。他进一步解释道：“从时间角度看，这种科技让人们可以最佳地结合当下急需和长远未来的利益；从方法上看，它既可以是对象化的，又可以是非对象化的；从它促成的生活质量上看，它使人们能够将安全与舒适、物质（生理）与精神、保守与进取（或传统与创新）、简朴与丰富、自然与人为等，最大限度地相互嵌入和糅合起来，从而体验到一种美好的生活。”


    ## 人怎样才能自由？


    在这场全球疫情中，另一个引起广泛关注与讨论的概念就是自由。在确认新型冠状病毒的高度传染性后，中国政府马上在国内疫情初始暴发地武汉宣布实施封城措施，随着疫情蔓延到中国其他城市，封城、封社区、禁足、强制性社交隔离、接触追踪、取消航空与火车等公共交通服务的措施在全国扩散开来。这些限制措施起到了遏制疫情蔓延、缓解医疗系统压力的作用。但是，初期这些措施在国际上遭到了广泛的批评和指摘。


    意大利著名思想家阿甘本在意大利疫情初期，对意大利政府实施的限制个人自由的政策发出了最强烈的反对声音，引发了全球思想界的一场大辩论。阿甘本认为，那些紧急措施是非理性、恐慌性的，是当代政府夸大危机从而趁机揽权、滥权的表现，他担心这种“例外状态”的常规化。他认为，不应该为了“活着”而牺牲“生活”，苟活不如去死。[![](images/00007.png)](#part0002.html#note6n)赵汀阳认为，阿甘本“把新冠肺炎疫情的语境无节制地升级，从而导致了问题错位”。他进一步指出，某些条件下放弃自由就类似于经济学中永远摆脱不掉的“成本”，这种取舍是所有幸福生活可以持续的条件之一。显然，赵汀阳在此对阿甘本的批评十分克制。在我看来，虽然阿甘本提出的问题不是完全的无稽之谈，但在形势紧急、对病毒来源与扩散缺乏充分了解的彼时彼地，把对限制权利、自由的措施可能带来的“滥权”风险上升到极致并且假定限制自由的措施是一成不变的，然后进行批驳，实有矫情之嫌——活生生地把一个现实问题变成课堂上的一个思想游戏，一头钻进了思想的死胡同。


    王蓉蓉受到庄子的启发，用道家的话语体系思考了一套适用于人类在“无可奈何”情形下（禁足时期）的身心应对机制的理论与实践。她聚焦庄子提出的“乘物”“游心”“养中”三个方面，“通过观照‘无奈’澄清何谓‘乘物’，通过探索乐的终极源头来认识‘游心’，通过诠释‘养中’来赋予人生的最终意义”。庄子的“乘物”揭示了生命充满不测之变，而人能控制的范围和能力是有限的。于是，“安时而处顺”，涵养德行，应对无常，尤其重要。“游”则是庄子处变、处事的观念与态度。王蓉蓉指出，“游”源于三种境界：外游、内游与道游。外游是当下人们醉心的游山逛水、“五色令人目盲”的境界，在全球因疫情而封国、封城、禁足的时候显然不适用。内游和道游才是“道”的时刻应该关注的。王蓉蓉认为，内游根植于自身内观之能力。“游于心或游于意，乃是不依赖外在事物、外来刺激或感观输入的。这种游是自己的心与意之游，是自给自足的闭环。”道游则更上一个台阶，游于道，游于无穷，与外物外境无待，“顺天循道”，“至美至乐”。终极状态的“游”应该是“无所不适”“无所不至”“无所不观”的“游”。显然，这个“游”与现代社会认识的“自由”大相异趣，前者是内省、自我的叩问和意识的提升，而后者是引导人们加强人我之别、向外索求、抗争的理念。“养中”是达到内游与道游的方便法门。王蓉蓉指出，庄子的养中包括了养心、养气和养督三个方面，是在“应对变化、命运，以及那些莫不可测之事，把握新出现的机遇，做出最佳的选择”之时的实用方法。


    那么，佛教哲学家又是怎么看待自由的呢？沃思鞭挞了在当下一部分美国人中十分流行的自由观、权利观。这些观点认为，一切妨碍自己为所欲为的就是侵犯个人权利、践踏人身自由。于是，他们反对强制戴口罩，抗拒维持社交距离，拒绝接受接触追踪等措施。沃思把这种置他人、自己的安危于不顾的对自由与权利的诉求称作主张“愚蠢的权利”，换句话说，就是人类在主张有“作”的权利与自由。正是这种自由观和实践引发了生态危机，让我们无视动物天然的栖息地与生存空间，加速了疾病从畜到人的传播。沃思认为，现代社会人们追求的自由，“不是蕴含于自然的自由之中（如佛法和道家所说的），而是存在于我们任性的战斗中，战斗的目的就是将我们的自我凌驾于自然之上”。


    ## 什么是生死？生死的了脱


    “人命关天”“活着就是硬道理”“好死不如赖活”等种种民间早已有的诉求和表达在疫情期间的日常交谈和社交媒体中“出镜率”极高。国人在封城、禁足期间的相互配合、守望与提携也达到了高峰。


    在理念上，我认为这种强烈生存的欲望源于《易经》中的“生生”。根据“生生”观，持续生长和永恒变化是宇宙万物的根本属性。天地是自然界最崇高的生命力量，给予并维持万物的生发、存续与繁荣，即所谓“天地之大德曰生”。中国本土哲学流派从大自然源源不断的创造力中汲取了治理人类社会的灵感。儒家规劝人们效法“天”（乾）去不断成长和创造，追求理想的模范人格，即君子。道家则重视“地”（坤），因其具有不朽、滋养万物和无私的品质。效法“地”可以培养出支持和滋养生命、与自然合一的品格。简而言之，“生生”颂扬生命、生存、创造、给予、繁荣、延续和共存。这种生活态度影响着中国人养成不断自我更新、乐观积极的心态。在对比中西哲学异同之时，国学大师、浸淫中西比较哲学多年的哲学家赵玲玲指出，中国哲学的出发点和主要议题是“求生”，即人如何保生、善生、长生久视，与西方哲学源于好奇心的“求知”形成鲜明对比，因此演绎出了不同的价值观体系和生命态度。

