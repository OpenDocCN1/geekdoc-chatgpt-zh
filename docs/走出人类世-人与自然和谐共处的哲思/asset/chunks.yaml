    \n但上面提到的因为“第三极”的缺失而存在的、在原有“人本”或“神本”框架下所无法解决的矛盾和冲突会因疫情的过去而消失吗？没有可能。那我们应该怎么办？对于关心人类共同命运的人而言，与其为疫情陷入无谓的焦虑，不如认真思考与探讨从哪里去寻找超越“人本”或“神本”框架、可以为全球化的人类社会提供“行为规范的是非标准的终极依据”，或者说是为界定“秩序”、制约“权力”而重构具有良性循环的三组分系统的“第三极”。在我看来，既然人是生物，认知的源头也是人类作为生命系统所出现的特殊属性，那么人类的生存与发展终极而言不得不服从生命系统的基本规律。\n\
    \n我们知道，细胞化生命系统包括真核细胞出现至今已经有109年（10亿年）的历史，而人类文明才103年（千年）级别的历史。地球生物圈在人类出现之前已经运行了二三十亿年，维持生命系统生生不息、使得人类得以出现的基本规律，应该可以为人类寻找“第三极”提供不应忽略的启示。生命系统不是一种特定的物质分子，更不是一种抽象的观念，而是一种特殊的物质存在方式。生命系统这种特殊的物质存在方式依赖于分子间力的相互作用，是在不断分分合合的动态过程中的一种可被人类辨识、相对稳定的中间状态。这种以生命系统的基本规律作为人类“行为规范的是非标准的终极依据”的观念体系可以被称为“生本”。“生本”具体到行为规范和是非标准层面上该如何表述，这超出了本文篇幅所允许的范围。但它为我们界定人类社会的“秩序”、制约维系秩序的“权力”提供了一种全新的思路。或许这将不仅有助于解决当下的矛盾与冲突，还能帮助人类作为地球生物圈一个负责任的成员来创造一种全新的可持续发展的文明。\n\
