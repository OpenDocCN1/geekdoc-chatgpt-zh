  trans: '

    # Globalization, Crisis, and Metaphysical Reflection


    However, globalization has ontologically altered the concept of the world. In
    the traditional concept of the world, cooperation between any entities had not
    reached the limit of possible interests; theoretically, better opportunities always
    existed. Globalization, however, has pushed the spatial scale of interest maximization
    to a global scale, establishing an ultimate standard for interest maximization.
    Consequently, possessing the world market becomes the maximum scale of interest
    maximization, because there is no other world. The world is the ontological boundary
    of game strategies. Here one can see how ontology restricts logic: logic is infinite,
    and in "logical time" there exist infinite possibilities. But those infinite possibilities
    do not truly exist; once they enter real existence, possibilities are constrained
    by specific states of being, leaving only a sparse few options. This means that
    to have infinity, one can only not exist; to exist, one must submit to finitude.
    The "ontological" consequence of 200 years of globalization is the transformation
    of globalization into a "dominant strategy" for seeking interest maximization.
    From this perspective, the game of globalization will see conflicts or strategic
    regressions, as analyzed previously—the possibility of a shift from "globalization
    of division of labor" to "globalization of competition." Once competition intensifies,
    it may lead to a dilemma of no profit, advance or retreat. Therefore, from a medium-to-long-term
    perspective, the world may seek an upgrade of globalization to secure stable interests.
    Current globalization is low-level globalization, an extensive movement in an
    anarchic world—it has drive and energy, but lacks order and institutions. That
    is to say, low-level globalization does not yet possess a stable globality. In
    the words of the ancient Greeks, the chaotic whole without order (chaos) has not
    yet become the ordered whole world (cosmos). It can be said that the COVID-19
    pandemic is not necessarily a period signaling the end of globalization; perhaps
    it is an exclamation point indicating that a problem of constructing globality
    still exists.


    Any change in existence requires a change at the conceptual level; otherwise,
    it is merely a superficial metamorphosis. Therefore, severe infra-physical (metaphysical/substantial)
    problems lead to metaphysical problems. The reminder COVID-19 gives to humanity
    is that if we are to correct the fragility of the infra-physical systems of contemporary
    society, we likely need to correct its metaphysical conceptual presuppositions
    and modes of thinking. Philosophy is not pure concept; it is a hidden virus. Markus
    Gabriel believes that after the COVID-19 pandemic, humanity needs a "metaphysical
    pandemic." This is an imaginative proposal; we indeed need a metaphysical reflection
    as powerful as a pandemic, allowing thought to acquire collective immunity. This
    requires finding a breakthrough "dimensional upgrade" condition—discovering or
    creating a space of thought one dimension higher than the modern space of thought—to
    escape the limitations of the modern space of thought. Without a breakthrough
    in the dimension of thought, reflection on modern thought, confined within the
    existing space, will wander in a hermeneutic circle. Even if its interpretive
    angles become increasingly rich and profound, because it is merely an internal
    cycle, it is insufficient to escape the centripetal force of modern thought, and
    thus impossible to transcend the status quo.


    Gabriel correctly criticizes modern science for overwhelming morality, yet the
    humanistic morality he calls for still belongs to concepts within modernity, such
    as equality and sympathy. Here lies a dilemma difficult to escape: if modern science
    has overwhelmed morality, it proves that current moral concepts are clearly weaker
    than modern science, and thus lack the energy to define life, society, and rules.
    One can discover that the object truly needing reflection is precisely "our" moral
    concept system. What we need more is a Wittgensteinian "ruthless" reflection—reflecting
    on ethics from the outside of ethics; otherwise, the result is nothing but self-affirmation,
    i.e., presupposing the affirmation of the values we wish to affirm.


    The mainstream modern mode of thinking emphasizes and pursues universal necessity;
    it symbolizes perfection and power. Although postmodern thought has much criticism
    of this, it has not touched the ontological structure of modernity. As long as
    a problem exceeds discourse and falls into practice, there are still only modern
    solutions, no postmodern solutions. Modernity is so deeply rooted because it has
    shaped the most popular myth of man. Humanity attempts to master its own destiny,
    to establish universal necessity according to human values (the glory of universal
    necessity originally belonged to God or the universe)—this is the metaphysical
    myth modern man created for himself. Postmodernity, in criticizing modernity,
    especially criticized the myth of science; in fact, the modern myth is not science,
    but the humanistic concept of man. The myth of man presupposes a perfect concept
    of man, plagiarizing many properties belonging to God: man must become the master
    of nature, the sovereign who establishes rules according to his own will, every
    individual must become a free sovereign, to the point where the concept of "man"
    almost becomes a miniature of God. However, the myth of man lacks an ontological
    foundation; man has no capacity to define universal necessity through subjectivity,
    nor the capacity to necessarily turn "ought" into "is." Modern man indeed attempted
    to use science to establish universal necessity for the human world, but this
    is a humanistic belief, not the intention of science itself. In fact, science
    has always acknowledged contingency and complexity, always thinking in dynamic
    variables (from functions to calculus to relativity and quantum mechanics); rather,
    it is humanistic belief that imagines universal values, unchanging norms, or sacred
    and inviolable rights. It cannot be ignored that this is not an epistemological
    belief, but a political belief. Leibniz long ago proved that to possess the ability
    to define universal necessity or unconditionality, one must be able to "survey"
    all logically possible worlds, equivalent to infinite capacity. Man obviously
    does not possess this capacity.


    Whatever values are chosen as the basic principles of a society, if set as "unconditional"
    or universally valid in any circumstance, they will lack adaptability and resilience,
    easily leading to paradoxes in actual scenarios. Immutability is not a characteristic
    of any possible life. If rules are dead, man dies. If allowed a "mathematical"
    description, I would say life forms possess "topological" properties: their good
    essence can remain unchanged, similar to topological continuity, while their specific
    manifestations are like topological plasticity, shaped according to specific situations
    and needs. Although Hegel''s proposition "the actual is the rational" is easily
    misunderstood, the problem is: if a concept is unworkable in reality, that only
    shows the concept is suspect, not that reality should not exist. Hume believed
    one cannot infer values from facts; this is correct in most cases. On the other
    hand, it seems one can also say that inferring facts from values is perhaps even
    more difficult.


    The universal necessity painstakingly sought by philosophy finds little witness
    in the lifeworld; it exists only in the mathematical world. This is because the
    mathematical world is defined and constructed by mathematical systems, not a mirror
    of the real world. Entities in a mathematical system exist either by definition
    or by "effective construction" ("to be is to be constructed"—the intuitionist
    formulation). Thus, entities in mathematics are an internal fact of the mathematical
    system, and therefore universal necessity can be established according to logic.
    By contrast, the problems and things humanistic concepts explain all possess externality,
    composed of uncontrollable things, practices, and changes. Humanistic concepts
    can only seek a suitable foothold in a changing world. Like substances easily
    affected by the environment—volatile, soluble, or oxidizable—concepts used to
    explain life also lack stability. In quiet, uneventful periods, humanistic concepts
    are also quiet and uneventful; but in troubled times, humanistic concepts become
    problematic.


    Most humanistic concepts have self-justifying reasons, so it is rare to see humanistic
    concepts or "isms" refuted in debate (unless expression is prohibited). However,
    humanistic concepts are easily refuted by reality; hence concepts fear concretization
    or contextualization most, because once concretized they become problematic, once
    problematic they are deconstructed by reality—especially those grand concepts,
    such as happiness, freedom, equality, win-win, people, community, etc. Derrida
    exerted great effort to deconstruct grand concepts, authority, and centers; in
    fact, those grand concepts have never existed perfectly in unpredictable, self-contradictory
    practice.


    Humanity lacks the infinite multidimensional intelligence matching nature. Although
    humanity can abstractly understand a multidimensional world and despise one-dimensional
    or linear thinking, the limitation of practical capacity forces man to act only
    one-dimensionally. Thus, the problem of "ordering" required by practice baffles
    man—though it appears only equivalent to first-grade arithmetic difficulty. On
    the one hand, things are complex and dynamic, so life requires multiple, equally
    important, and mutually irreducible values to be explained; on the other hand,
    practice forces us to order values, i.e., prioritize. As long as the ordering
    problem exists, it is difficult for people to maintain balance among the various
    things or values needed for life, and losing balance means every thing or value
    loses its own stability, as well as the systemicity of mutual support and guarantee.
    Once a severe crisis hits, values and institutions fall into dilemma. This is
    a problem that order or systems have never been able to solve. This indicates
    that not only do man-made social systems have fragility, but the systems of thought
    or values directing behavior also have fragility—this is the deep crisis of civilization.


    If the infra-physical crisis comes from the "acute problems" of reality, then
    the "deep problems" touched by the infra-physical crisis constitute the metaphysical
    crisis. The COVID-19 pandemic is an "acute problem" that has touched "deep problems."
    One such problem is that the political concept as understood by modernity is itself
    a hidden suicidal virus, destroying the concept of politics. Whether government,
    media, or new powers, if a political force has the power to designate values,
    that is tyranny. Values can only be the collective choices naturally formed by
    people in long-term practice. Obviously, people have many groups, therefore multiple
    collective choices, and thus divergences and conflicts exist. Politics capable
    of protecting civilization is not struggle, but the structural art of establishing
    balance amidst the richness and complexity of civilizational conflicts. If politics
    is only struggle, it merely repeats and reinforces conflicts already existing
    in reality—adding struggle upon struggle, either superfluous or doubly harmful.
    Struggle is instinct, not politics. Politics is the art of creating cooperation—if
    politics cannot create cooperation, what use is it?


    Therefore, the metaphysical problem humanity needs to reflect on is not which
    value to support and endorse—that is merely infra-physical struggle—but whether
    the thought system, as a shared human resource, is rational and sufficient to
    cope with the possibilities encountered in life. In other words, what is the basis
    of the validity and rationality of ideological concepts? What can man decide?
    What can man not decide? What can follow ideals? What must respect facts? In the
    context of the COVID-19 pandemic, the problem is more specific: what must listen
    to science? What can listen to people? What must listen to the virus?


    ## Crisis: The Way of Survival and the Rules of the Game


    Theory can be self-consistent in its own space but may collapse when entering
    actual cases because theory and reality are two spaces. The law of theoretical
    space is logic; the law of real space is regularity (law/pattern). The two are
    mutually irreducible, so reality does not obey theory. Although theory can partially
    "map" reality (usually said to "reflect" reality, but this mirror metaphor is
    inaccurate), their modes of construction are completely different. Only when reality
    is in a stable, calm, certain state is theory''s mapping of reality partially
    determinate. Once reality enters a turbulent "indeterminate" state, theoretical
    concepts collide, hinder each other, and even fail. Theory does not fear seriousness;
    it fears the crisis of reality. Since reality will not approach theory on its
    own, theory must approach reality.


    If one major characteristic of contemporaneity is anticipating the future, then
    another related characteristic is the state of crisis; in fact, a large number
    of crises are precisely caused by anticipating the future. Almost all contemporary
    systems are in a state of "high tension," and crisis forms the critical condition
    of ideological predicament. A typical situation is that crises often lead to ethical
    paradoxes, the most common being the dilemma of priority rescue (e.g., the "trolley
    problem"). The COVID-19 pandemic provided instances of the triage dilemma. Countries
    with ample medical capacity surplus naturally do not have this dilemma; everyone
    can get a chance for treatment. But in countries lacking ventilators, priority
    rescue becomes a dilemma. Real conditions exclude ideal choices, and delayed choice
    is also a sin. Here, imagination is challenged. The actual possible options are
    probably only the following.


    First, first-come, first-served—this is the standard of equality. Second, according
    to severity and urgency—this is the medical standard. Third, according to ability
    to pay—this is the commercial standard. Fourth, priority to women and children—this
    is an ethical standard. Fifth, priority to the young, regardless of gender—this
    is also an ethical standard. Among these, except for the third which is questionable,
    the other standards all have their own reasons competing in rationality. If considering
    epistemological reasons, the second makes the most sense; if considering ethical
    reasons, the fourth and fifth both make more sense. Suppose some places prioritize
    rescuing young people with a higher chance of survival (purely hypothetical);
    this choice would be questioned, yet this choice is already one of the relatively
    optimal choices, on par with the second. No choice is strictly optimal; all have
    some defect. Perhaps the second has the relatively lowest "sense of guilt." Although
    everyone hopes for an optimal ethic that can save everyone, the optimal ideal
    beyond practical capacity exists only in libraries. Kant long ago discovered:
    "Ought" cannot exceed "can."


    We must never misunderstand this analysis as opposing the optimal ethical ideal.
    The key is that the optimal ethical ideal is not necessarily an optimal theory.
    An optimal theory must possess sufficient theoretical capacity to cover all possible
    worlds: on the one hand, it must consider the "best possible world," otherwise
    there is no ideal scale to examine defective reality; on the other hand, it must
    consider the "worst possible world," otherwise it lacks the capacity to prevent
    or cope with severe crises. If an ethics or political philosophy does not consider
    the "worst possible world" and assumes superior social conditions, it is a fragile
    theory lacking sufficient adaptability to withstand crises. The "lockdowns" (quarantine/isolation)
    implemented in many places forced by the COVID-19 pandemic became a focus of controversy.
    In fact, compared to war, great floods, great famines, or social riots, the state
    of isolation does not count as the worst situation.


    "Isolation" becoming a philosophical focus of controversy is related to Agamben.
    Agamben believes that isolation under the pretext of "groundless state of emergency"
    is an abuse of power, and the temptation to abuse power may well lead to the "state
    of exception"—proving government power by depriving people of freedom—becoming
    the norm. This argument reminds people that power tends toward tyranny by nature,
    usually just lacking opportunity and pretext. This is an important question. But
    whether the purpose of isolation is truly political, or whether there are considerations
    more urgent than politics, is also a question. The various needs of human life
    have an ontological order of severity; survival usually ranks first. But Agamben
    asks: "What about a society that believes in nothing but survival?" This is a
    deeper question. If living is merely dragging out an ignoble existence, it might
    be better to die. However, these questions seem to upgrade the context of the
    COVID-19 pandemic without restraint, leading to a misplacement of the problem.
    Does the isolation adopted to respond to the COVID-19 pandemic reach the extreme
    choice of "give me liberty or give me death" or "better to live badly than die
    well"? Agamben''s understanding of isolation due to the COVID-19 pandemic is perhaps
    "human, all too human" (Nietzsche''s phrase). Defending freedom by opposing isolation
    implies the opposite view seems to support abuse of power, but this is a trap.
    The view truly opposite to Agamben is that man can only acknowledge life has unavoidable
    paradoxes. The freedom, equality, and material life enjoyed by humanity are achievements
    of civilization; the foundation of these civilizational achievements is tens of
    thousands of years of arduous, even cruel experience. These civilizational achievements
    are not enjoyed once and for all; to defend civilization still requires frequent
    experiences of suffering. Just as economics can never eliminate the concept of
    "cost," no civilizational achievement can ever exclude the concept of "price."
    Price is an ontological concept, the condition for existence to exist.


    There is a related issue needing clarification: this isolation is not that isolation.
    Implementing isolation laws for infectious diseases is an ancient experience.
    The Qin and Han dynasties had partial isolation laws, called "Lisuo" (leprosaria),
    i.e., leprosy isolation stations. Ancient Rome also invented leprosy isolation
    laws during the reign of Justinian I (527–565 AD). The modern concept of "quarantine"
    comes from the medieval 40-day isolation for the Black Death. Quarantine differs
    from "social isolation." Social isolation usually has political and discriminatory
    characteristics, such as the historical isolation of Jews in Europe or Blacks
    in America. Conflating quarantine and social isolation misleads judgment on the
    nature of the problem. The isolation implemented to respond to COVID-19 obviously
    belongs to quarantine, not social isolation. Although one cannot completely rule
    out the possibility of quarantine being utilized by power to become social isolation,
    in its primary nature it is not political. Assuming Agamben still insists on a
    politicized understanding of quarantine, classifying it into the "state of exception"
    rulers love to use, one can further ask a detective-style question: who benefits
    from quarantine? It is not difficult to see that the beneficiaries of quarantine
    in critical moments are the whole people. Since the beneficiaries are the whole
    people, quarantine can hardly be classified as a political state of exception,
    but should belong to a social state of emergency. Besides the safety of the whole
    people, quarantine effectively protects the capacity of the medical system. If
    the medical system collapses under super-large pressure it cannot bear, the safety
    guarantee for the whole people collapses with it. And if social order, the medical
    system, and the economy collapse together, individual rights become waste currency
    with no place to cash in—though having face value, they lose use value; individual
    rights become unprotected bare rights, and bare rights certainly cannot save the
    "bare life" Agamben cares about. At that time, it would probably truly become
    a political problem.


    This political problem is: what exactly protects individual rights? First, the
    constitution and laws are institutional guarantees. Further, everything must be
    implemented in practice to truly take effect; rights must also be implemented
    in practice to be truly realized. Practice involves too many variables, almost
    all variables in life, exceeding the analytical capacity of any single discipline,
    understandable only in a trans-disciplinary concept. Practical problems are equivalent
    to Wittgenstein''s game problems; therefore, Wittgenstein''s general analytical
    model of games can be borrowed. According to Wittgenstein''s game concept, a game
    requires common acknowledgment to take effect; simultaneously, game participants
    thereby acknowledge the rules of the game. This has already defaulted to a meta-rule
    of the game: no game participant has the privilege to destroy the rules, or is
    a privileged "exception-maker"—for example, no privilege to cheat, renege, or
    demand special treatment. The game concept helps explain: if society is a game,
    then individual rights are not a kind of private right. That is, individual rights
    are equal rights determined by the game, not a privilege defined by private will.
    Thus, in the game there are only legal (rule-compliant) individual behaviors,
    but no legal private behaviors. Private behaviors carried out according to one''s
    own free will are only effective in private spacetime; if private behavior invades
    the game''s public spacetime or another''s private spacetime, it is no longer
    legal. This is precisely the foundation of law. For example, a person committing
    suicide by shooting themselves in their own room is private behavior; but if a
    person detonates a bomb in public space to commit suicide and injures others,
    it is no longer private behavior, but individual behavior destroying game rules—i.e.,
    illegal behavior. Similarly, in quarantine behavior, if a person understands behavior
    that may harm others as a private right to decide freely, it is misunderstanding
    human rights as individual privilege. Just as there is no private language valid
    for one person alone (Wittgenstein''s theorem), there is no politics belonging
    only to oneself. Politics and language are both publicly valid systems. If individual
    rights are defined as absolutely and unconditionally valid, there is a hidden
    danger of privatization—not only falling into self-contradiction in theory, but
    in reality inevitably falling into self-contradiction upon encountering the equally
    absolute and unconditional rights of others.


    However, a contemporary ideological landscape is that concepts no longer fear
    logical contradictions, nor science, but gain power through political character.
    Foucault''s archaeology of knowledge discovered this phenomenon long ago; the
    interactive relationship between knowledge and power produced a "knowledge-power"
    structure, the result being that in the social knowledge field, the basis of knowledge
    is no longer knowledge''s own reasons, but political reasons. This explains how
    concepts become ideologies. When concepts attempt to dominate reality with a political
    identity, they become ideologies, or dominating "discourses." Ideology is precisely
    one foundation of the contemporary "post-truth era"; its other foundation is the
    technological platform for universal speech. In the social field of vision, theory,
    rational analysis, and dialogue are marginalized or even disappear, leaving almost
    only grand critique with politics in command. It is not that truth has disappeared,
    but that "eyes" and "ears" lack the ability to walk out of post-truth discourse.
    The ideological barriers formed by post-truth discourse in turn reinforce ideology.
    In the post-truth era, not all discourses are ideologies, but every discourse
    that can become popular is ideology. Ideologization is the condition of presence
    for discourse; otherwise, there is no chance of presence on the discourse platform.
    The narrative boost of post-truth discourse may turn an acute, temporary crisis
    into a long-term crisis. The virus is only a natural crisis, but the narrative
    about the virus may become a secondary disaster.


    ## The Originariness of Suffering


    The COVID-19 pandemic has philosophically awakened the "problem of suffering."
    This is a long-forgotten problem, yet suffering has always existed.


    The myth of man and the tremendous achievements of modernity have fostered the
    arrogance of contemporary concepts. Although radical thinkers have continuously
    criticized modernity, they have still been unable to change the dominant contemporary
    "episteme." Contemporary society tends to replace the concept of "fate" with "luck,"
    anxieties over "failure," and is unwilling to face the "tragedy" discovered by
    the ancient Greeks. Progressivism, highlighting "positivity" and refusing to acknowledge
    "negativity," has led to ideological imbalance. In fact, balance or symmetry is
    not only a mathematical phenomenon but also an ontological condition of survival.
    Contemporary thinking has invented an imbalanced logic, focusing only on stories
    of success and happiness, fantasizing that welfare can be supplied unconditionally,
    rights enjoyed unconditionally, nature exploited infinitely, and so on. This fantasy
    is based on an idealized ethical "ought" requirement: costs or prices should tend
    toward infinitesimal while benefits should tend toward infinite. This logic challenges
    the logic we learned from Aristotle, Frege, and Russell, and also challenges physics,
    such as the law of conservation of energy or the second law of thermodynamics.


    Regarding widely prevalent contemporary philosophy (referencing the acceptance
    tendencies of media, education systems, and high-traffic online platforms), although
    various philosophies have different target topics, if observed with Foucault''s
    archaeological method of knowledge, one can discover that many popular philosophies
    share a common "episteme": "eudaimonism" (happiness-ism). Maximizing the happiness
    and welfare of every individual is the common background of eudaimonism. Eudaimonism
    tends to advocate that each individual''s subjectivity possesses absolute "sovereignty,"
    in order to maximize individual freedom and legitimize individual private preferences.
    Individuals can autonomously and legitimately define their own identity, gender,
    values, and lifestyle; even in radicalized contexts, the "personal" may be equated
    with the "private" and equated with the correct. In self-criticism, my *On Possible
    Life* published in 1994 is also a form of eudaimonism.

