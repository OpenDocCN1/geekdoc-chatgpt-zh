    # Kant''s Oversight and Reflections on High-Tech Worship


    ## Kant''s Oversight and the Non-Monolithic Nature of the "A Priori" Paradigm


    It is evident that although Kant''s answer is highly enlightening, it also contains
    a major oversight. To be more specific, it is dogmatic to assert that Western
    mathematics is the sole expression of the pure forms of sensible intuition, and
    that Newtonian physics is the sole expression of physical causality. For instance,
    his taking Euclidean geometry as the unique manifestation of the pure form of
    space was self-evident to him, just as the statement "through a point outside
    a line, only one parallel line can be drawn" was self-evident at that time. However,
    the subsequent discovery of non-Euclidean geometry demonstrated that there can
    be more than one geometry; through a point outside a line, more than one parallel
    line may be drawn. Although this oversight seems to lie only within Western mathematics
    and science, this counterexample at the foundation (combined with Kuhn''s theory
    of "paradigms") still shows that the so-called "a priori" valid paradigms, or
    the "necessary prejudices" that human cognition of the world inevitably carries,
    are not monolithic, nor must they be formalized mathematical ones. As long as
    a "research paradigm" ![](img/#part0005.html#note28n) can be formed, possessing
    a certain derivational force of a certain morphology, it has the ability to extend
    theoretical presuppositions and thereby guide experiments. For example, mathematics
    need not be so formalized, as demonstrated by China''s *The Nine Chapters on the
    Mathematical Art*; even the numerical and symbolic system of the *Book of Changes
    (Yi Jing)* is an architecture with a certain a priori derivational force. Moreover,
    a "paradigm" includes but differs from specific research methods; its normative
    form is self-referential and all-encompassing—that is, it itself contains the
    norms for the paradigm, and there is no single standard capable of measuring the
    merits of all paradigms. It is thus clear that different research paradigms have
    different strengths and weaknesses. The strengths of the high-tech research paradigm
    lie in mathematical formalization, precise objectification, empowerment, and competitiveness;
    the standards that advocate these strengths (such as "higher, faster, stronger")
    also belong to this paradigm. Therefore, other paradigms in the past—Confucian,
    Daoist, Buddhist, pantheistic, even Aristotelian—did not agree with such standards.


    From this we can know that the "a priori" ![](img/#part0005.html#note29n) does
    not equal the "unique." Humans are not gods and possess no completely transparent
    cognitive mode that transcends their mode of existence—physiological structure,
    language used, environment inhabited, culture borne, challenges faced. There are
    always a priori premises or a priori colorations caused by instinct and circumstance.
    Scientists are also people living in their situations or "forms of life" (Wittgenstein);
    therefore, any scientific research must have its a priori presuppositions or research
    paradigms. However, as analyzed above, the pure forms or pure symbols of space
    and time that constitute these a priori presuppositions are non-objectifiable;
    therefore, they would never be so pure as to have only one form of expression.
    The "pure image" (reines Bild) or "schema" constructed by the "transcendental
    imagination" ![](img/#part0005.html#note30n) exceeds objectifiable forms (including
    the objectification of concepts), just as the pure triangle exceeds any concrete
    triangle (but is not yet a concept), and also exceeds the abstract triangle prescribed
    by Euclidean geometry or any geometric paradigm. We may even ask: must a triangle
    be only two-dimensional or three-dimensional, and not four-dimensional or five-dimensional?
    "Reproductive imagination" cannot reach beyond three dimensions, but "transcendental,
    productive imagination" possibly can.


    ## The Danger and Asymmetry of High-Tech Worship


    High-tech worship is completely blind to the diversity of technological research
    paradigms; it touts high technology as the sole truth within technology, suppresses
    other technologies, and ideologically rigidifies the inherent—even from a certain
    angle reasonable—bias carried by high technology, thereby blocking the reasonable
    possibilities of studying nature from other angles.


    High-tech achievements are sometimes dangerous to humanity, even extremely dangerous.
    Examples include certain chemical products (plastics, pesticides, poison gases,
    etc.), exhaust emissions, thermonuclear bombs, various pollutants and waste (including
    nuclear waste), nanomaterials, genetic modification, and super artificial intelligence
    (yet to be realized). This fact is currently almost common knowledge among intellectuals
    with reflective capacity. Other technological paradigms, such as ancient Chinese
    technology, ancient Egyptian technology, or Indigenous American technologies,
    although they could generally meet the survival needs of their times, did not
    bring such dangers. Furthermore, driven by the "must go higher" nature of high
    technology, its future products will possess even greater power to transform the
    basic structure of the world, and thus will be even more dangerous. But high-tech
    worship prevents people from seeing the urgency and lethality of this danger clearly,
    or makes people believe that even if such danger exists, it can only be solved
    by even higher technology, with absolutely no possibility of solving the problem
    by replacing or partially replacing it with other technologies. This is tantamount
    to saying that a group of bureaucrats committed corruption and abuse of power,
    but only they themselves or their own institutions can correct it. In short, high-tech
    worship suppresses people''s transcendental imagination, confining it within the
    images and value structures created by modernity and the high-tech paradigm. One
    might even say this is a new Inquisition that stifles the freedom of humanity''s
    fundamental thought.


    ### High Technology and High-Tech Worship in the COVID-19 Pandemic


    This COVID-19 pandemic has exposed some limitations of high technology, particularly
    the loopholes of high-tech worship. First, merely a dozen years after the appearance
    of SARS, a similar virus has once again triggered a large-scale epidemic. This
    shows that high technology still lacks effective preventive measures and treatments
    for new epidemic diseases threatening populations. Regarding the epidemic, high
    technology provided no clear early warning beforehand; even after the COVID-19
    outbreak, besides administrative negligence and arbitrariness hampering prevention
    and control, high technology itself had problems. For instance, high-tech experts
    in some countries confidently declared in the early stages of the epidemic that
    it was "preventable and controllable," or claimed that "wearing masks is of little
    use." But the epidemic soon spun out of control, leading to the implementation
    of a series of exceptionally strong measures such as city lockdowns, area closures,
    flight suspensions, work stoppages, and school closures. Moreover, high technology
    currently cannot provide specific drugs that directly eliminate the virus or targeted
    vaccines. In the near future, vaccines or response drugs may be developed, but
    the optimal window for effective prevention and control of the epidemic has already
    been missed. In many cases, this is not due to the incompetence of technical personnel,
    but is determined by the characteristics of high technology. The research method
    of precise objectification requires the object to appear, and to be carefully
    identified (e.g., at the genetic level), before it can be studied. But the pathogens
    of infectious diseases are not fully objectifiable entities. You can use vaccines
    to control or even eradicate smallpox, and respond relatively effectively to cholera,
    malaria, and schistosomiasis. But pathogens are living things; some of them mutate
    over time, adapt to new drugs and human environments, and develop so-called drug
    resistance. So within the horizon of high technology, we still cannot see the
    possibility of eradicating all epidemics, nor even see effective methods for predicting
    and controlling major epidemics.


    Regarding the origin of this pandemic, there is still no definitive conclusion.
    On the surface, it first broke out in a province in China and then appeared in
    many other countries. But some retrospective studies show that the virus causing
    the pandemic already existed in the world at an earlier time. This puzzling situation
    shows that high technology is not omnipotent; it is at a loss when dealing with
    life forms that are not so fully objectifiable. We often hear voices saying: "This
    is a problem for experts to solve." But the problem is that experts often disagree
    on such issues, to the extent that certain ill-intentioned politicians can exploit
    one of the views to manipulate the situation. Moreover, the rapid transport tools
    created by high technology and the resulting globalized flow have not only accelerated
    the speed of epidemic spread but also made tracing the virus source more difficult.


    Second, there was once a rumor that the novel coronavirus causing this pandemic
    was artificially synthesized. As for who synthesized it and for what purpose,
    there were different versions. The author of this article once saw and heard some
    reports and audio-visual materials, presented by some reputable scientists and
    virus experts, seemingly proving this assertion with conclusive evidence. Later,
    28 scientists signed a joint letter refuting this conclusion. Regardless of whether
    this rumor is true or false (I personally have always leaned towards the latter),
    it indicates a reality: current high technology has the capability, or at least
    a high probability, of manufacturing the novel coronavirus or even more terrifying
    viruses. When those experts argued for affirmation or negation, they were only
    debating whether the novel coronavirus *was* artificially synthesized, not whether
    existing high technology *could* manufacture it. This illustrates another problem:
    high technology has the capability to create things that can greatly harm humanity,
    yet lacks the capability to effectively and timely control them (see the discussion
    above). This is extremely dangerous! Moreover, this asymmetry appears to be widespread.
    Since the 20th century, humans have been able to manufacture atomic bombs, but
    have never found effective, sustainable, and feasible means to eliminate the ecological
    consequences of nuclear war or handle nuclear waste. Humans have been able to
    develop chemical fuels like petroleum and manufacture thousands of chemical products,
    such as astronomical numbers of plastic bags, yet have little technological capability
    to eliminate the greenhouse effect, offshore oil spills, and the long-term, irreversible
    pollution damage caused by chemical products to humans, land, water, and air.
    Furthermore, high technology will have the capability to alter human genes, yet
    does not know how to handle the relationship between such high-tech superhumans
    and normal humans, let alone how to make superhumans live happily. High technology
    may create powerful artificial intelligence, yet does not know how to ensure it
    only benefits humanity rather than harming it. Rules like the "Three Laws of Robotics"
    (from Asimov) may be self-contradictory in themselves; adding more auxiliary laws
    only makes the situation more complex and unpredictable. In a word, high technology
    has the capability to create both angels and demons, but lacks the capability
    to put the demons back into the bottle.


    Third, due to the high-tech medical research angle of fully objectifying the human
    body, the vast majority of its treatment protocols target pathogens and affected
    organs, adopting direct confrontation—a "God versus Devil" strategy, that is,
    a "militarized" strategy of killing pathogens (or stimulating antibodies to kill
    them) and removing diseased parts. This strategy is necessary and very effective
    in some cases, but is destined to have major defects, because the fully objectified
    response mode cannot keep pace with the flow of life time. For instance, the mutation
    of pathogens and the development of drug resistance mentioned above are immeasurable
    and untreatable by high-tech medicine. Moreover, this treatment mode produces
    two adverse consequences—increasing difficulty in identifying diseases, especially
    epidemic infectious diseases, and the toxic side effects of drugs and surgery.
    New pathogens and their variants will always appear, so distinguishing which disease
    the current epidemic phenomena belong to will become increasingly tedious, specialized,
    and difficult, requiring long-term trained professionals and high-end equipment.
    Especially during epidemics, such as winter and spring for influenza, SARS, and
    COVID-19, it is considerably difficult to reliably distinguish them among the
    signs of the swarming patients, promptly detect new or highly threatening ones,
    so that administrative departments can take decisive measures. When the COVID-19
    pandemic first appeared (e.g., in the US), it was once regarded as flu and ignored;
    later, some sensitive individuals discovered anomalies and "blew the whistle"
    to warn, but were ignored because they were hastily viewed as "SARS." Even when
    doctors like Dr. Zhang Jixian identified it as a new epidemic and reported it
    (December 27, 2019), because they could not immediately determine the exact (fully
    objectified) information about the disease, they failed to break through the various
    noises of the epidemic situation, and thus could not decisively influence professional
    authorities and administrative decisions, leading to the explosive expansion of
    the epidemic within three weeks. Dr. Zhang Wenhong discussed this dilemma in a
    recent article ![](img/#part0005.html#note31n), but his proposed improvements
    only call for establishing departments of infectious diseases and clinical microbiology
    according to international standards, making our already powerful CDC direct reporting
    system even stronger, "blocking the enemy at the first line, rather than waiting
    for the CDC to clean up after a city-wide outbreak." ![](img/#part0005.html#note32n)
    If the state has strong financial resources, establishing these departments and
    strengthening relevant personnel training can indeed enhance early warning capabilities;
    combined with strict control of epidemic outbreak points, it is indeed an effective
    temporary response measure. But can this fundamentally solve the chronic ills
    of objectified research and treatment discussed above? Basically impossible, or
    at least doubtful.


    As for the other problem of high-tech medicine—the toxic side effects of drugs
    and surgery—it is also alarming. For example, cancer surgery and postoperative
    chemotherapy destroy the body''s immunity. Some diseases require patients to take
    medication for life, which easily leads to the accumulation of side effects into
    new ailments. Although almost all drugs, including Chinese medicine, have side
    effects, because high-tech drugs mostly target specific pathogenic objects, they
    find it even harder to consider the needs of the whole body, so the side effects
    should be greater and stronger. For the human body, a spiritual living organism,
    there is no "profit without loss" business. Chinese medicine emphasizes attention
    to the overall vitality of the human body and mind (the primordial qi generated
    by the interaction of Yin and Yang); diagnosis and medication are strongly time-dependent
    and weakly object-dependent; prescriptions emphasize the complementary matching
    effects of "Monarch, Minister, Assistant, and Courier" (Jun-Chen-Zuo-Shi) among
    drugs; and they value "treating the undiseased"—treating or preventing diseases
    that have not yet been objectified. Therefore, overall, the toxic side effects
    should be much smaller. If the application of patent Chinese medicines is as rigid
    as Western drugs, some indeed produce non-negligible toxic side effects, but in
    the original paradigm of Chinese medicine, these can be avoided or weakened.


    High-tech worship in this COVID-19 pandemic has also manifested very clearly.
    First, the prevention and control system is basically, even completely, high-tech-based.
    For instance, the situation reflected in Dr. Zhang Wenhong''s article cited above—although
    this system has repeatedly erred, people still insist on the monopoly of the high-tech
    system, refusing to let other technologies intervene in key issues or judgments.
    A video circulated online showing that at a meeting organized by the China Academy
    of Chinese Medical Sciences on June 27, 2019, TCM doctor and scholar Academician
    Wang Yongyan predicted in a formal speech: "In the second half of the year, especially
    around the Winter Solstice, continuing into the spring of next year, there will
    be a warm epidemic (Wen Yi) outbreak." ![](img/#part0005.html#note33n) The Winter
    Solstice in 2019 was December 22. According to existing information, the first
    case of the Wuhan epidemic appeared in early December 2019 (just before the Winter
    Solstice), and the formal outbreak occurred in January 2020 (just after the Winter
    Solstice). In retrospect, this prediction made half a year before the event was
    at least basically accurate regarding the timing of the epidemic outbreak. Regarding
    the duration of the epidemic ("into the spring of next year"), it also appears
    roughly correct. If the epidemic in China had continued into summer or even autumn,
    this prediction would have been flawed ![](img/#part0005.html#note34n).


    In response, the *New Beijing Daily* and others immediately voiced serious skepticism
    ![](img/#part00005.html#note35n), calling it a "divine prediction" or "mystical
    prediction," completely different from "scientific prediction." An article in
    the *New Beijing Daily* proposed standards for distinguishing the two: "This kind
    of scientific prediction is based on clearly grasped laws, through systematic
    collation, summary, and further research to give a prophecy. Scientists write
    it into papers, organize the most basic data and knowledge into a system, display
    it to peers according to logical processes, and repeatedly explain and discuss
    the difficult and key points. Moreover, all these can be questioned and tested."
    ![](img/#part0005.html#note36n) But these standards cannot completely negate Academician
    Wang Yongyan''s prediction, because, as another online article ![](img/#part0005.html#note37n)
    states, Academician Wang''s prediction was also based on clearly grasped, data-supported
    laws; it''s just that they are not high-tech laws, but the laws of the operation
    of Yin-Yang, Five Elements, and Five Movements and Six Qi (Wu Yun Liu Qi) in Chinese
    medicine, which have their evidence and knowledge, and can also be questioned
    and tested (the above statement already implies this). As for repeated explanation,
    discussion, and writing papers, the Chinese medicine community certainly can and
    should do so. It is a pity that Academician Wang''s prediction seems not to have
    been accompanied by detailed relevant research and argumentation, which is one
    reason it was ignored. However, even so, it does not mean that the Chinese medicine
    research paradigm cannot make scientific predictions; it only shows the current
    lack of Chinese medicine research strength. If Academician Wang''s prediction
    had received the attention it deserved, it would not only have received serious
    study and testing within the Chinese medicine community, but also among cross-paradigm
    scholars.


    That article in the *New Beijing Daily* represents the basic characteristics of
    the currently prevalent high-tech worship: monopolizing the right to interpret
    science in the name of science, thereby corrupting the nature of science which
    must ultimately be open to empirical facts; for "others" or non-high-tech technologies
    that are heterogeneous to it, it uniformly confuses them with the highly lethal
    labels of "mysticism" or even "primitive myths, religious stories to folk legends."
    It rejected Academician Wang''s prediction as follows: "On the contrary, mystical
    prediction will not clearly tell you what the law is, nor will it break down the
    basic principles for you to see. Only after the fact do you try to explain by
    leaning towards what has already happened. So mystical prophecy has no significance
    for the future." I have argued above that Academician Wang''s prediction is of
    major significance for the future (which we are currently in), and if it had received
    the reasonable attention it deserved, it would have had even greater significance.
    But what is heartbreaking is that countless such observations and inventions that
    originally possessed or would have possessed significance have been excluded and
    strangled with such high-sounding and overbearing reasons. It is only because
    this epidemic has had a huge impact and high technology''s response has not been
    very effective so far that Academician Wang''s prediction entered the public view.


    In addition, in light of the experience of responding to SARS previously, this
    time Chinese medicine intervened relatively early in the diagnosis, treatment,
    and prevention of COVID-19, and to date has played a positive role that is different
    from but not to be ignored compared to high technology. ![](img/#part0005.html#note38n)
    For example, according to a report, the "Chinese medicine treatment plan at Beijing
    Ditan Hospital was not only effective for mild and moderate COVID-19 patients,
    but also achieved certain efficacy for severe patients. Preliminary analysis showed
    that the effective rate of symptomatic treatment with Chinese medicine alone was
    87.5%, and the effective rate of integrated Chinese and Western medicine was 92.3%."
    ![](img/#part0005.html#note39n) Many other hospitals and regions reported similar
    or significant effects, such as Guangdong, Zhejiang, Sichuan, Shanxi, and Yunnan.
    The same was true in Hubei, Wuhan. Academician Zhang Boli, a TCM expert participating
    in the anti-epidemic effort in Wuhan, said in an interview on February 28, 2020:
    "Now not only are all Fangcang shelter hospitals using integrated Chinese and
    Western medicine treatment, but severe patients in Jinyintan Hospital, Wuhan Pulmonary
    Hospital, and Wuhan Union Hospital have also begun joint Chinese-Western medicine
    consultations, with quite a few patients using Chinese medicine. Currently in
    Wuhan, the usage rate of Chinese medicine has risen from 30% in early February
    to over 80%." ![](img/#part0005.html#note40n) Another example: Academician Huang
    Luqi discovered through frontline clinical observation in Wuhan: "Through integrated
    Chinese and Western medicine, mild patients'' discomfort symptoms such as chest
    tightness disappeared faster, the treatment cycle for severe patients was shortened,
    and the average hospital stay for integrated treatment was less than that for
    Western medicine treatment alone." ![](img/#part0005.html#note41n) According to
    more recent reports (early June 2020), overall, "over 90% of confirmed COVID-19
    cases used Chinese medicine. Clinical efficacy observation showed a total effective
    rate of Chinese medicine over 90%." ![](img/#part0005.html#note42n)


    Academician Zhang Boli explained the anti-epidemic mechanism of Chinese medicine
    as follows: "Modern pharmacological research shows that many Chinese medicines
    have antipyretic and anti-inflammatory effects, can improve patients'' fever symptoms,
    control the spread of lung inflammation, promote inflammation absorption, and
    play a role through multiple aspects, pathways, and targets. In addition, while
    antiviral, the advantage of Chinese medicine intervention also lies in its ability
    to regulate human immune function and stimulate the body''s own defense capabilities."
    ![](img/#part0005.html#note43n) He is explaining the effects of Chinese medicine
    anti-epidemic efforts using high-tech terminology and even strategies are necessary.


    In summary, Chinese medicine, heterogeneous to high technology, has shown unique
    and remarkable performance in the prediction, diagnosis, treatment, and prevention
    of this epidemic. In some aspects (such as prediction), it played a role that
    high technology could not; in other aspects, it also has irreplaceable unique
    functions. The reason Chinese medicine could achieve these results is inseparable
    from the non-objectified, Yin-Yang time-dependent dimensions contained in Chinese
    medicine theory and practice. For example, the "Five Movements and Six Qi Theory"
    ![](img/#part0005.html#note45n) on which Academician Wang based his prediction
    is a theory based on the Yin-Yang Five Elements view, containing a non-objectified
    dimension of life time. Another example: the acupuncture suggested by Liu Lihong
    is premised on the presupposition of the existence of meridians, which cannot
    be fully objectified (anatomized). As for Chinese medicine''s pulse diagnosis,
    prescriptions, etc., they are also therapies full of time-dependence and the body''s
    on-site sensibility. Of course, they all have objectified dimensions—that is,
    they are realized as specific objective matters such as symptom differentiation,
    drug application, and treatment effect assessment at appropriate times and occasions.
    So Chinese medicine does not stop at "treating the undiseased"; it also has strategies
    for already formed diseases and even severe cases (such as severe patients in
    this epidemic). If the Chinese medicine research paradigm and historical heritage
    can be fully respected, then under current conditions, organic, flexible, and
    mutually equal "integration of Chinese and Western medicine," plus the pluralistic
    integration of various medical books such as Tibetan medicine and Mongolian medicine,
    is indeed a better line for epidemic prevention and control than a single Western
    medicine or Chinese medicine response mode. It is thus clear that the claim of
    high-tech worship in the medical field—that only high-tech medicine has grasped
    the truth about the human body, and that Chinese medicine and other alternative
    medical arts are not science at all, or even harmful quackery—is erroneous. Persisting
    in them brings only danger and disaster, not prosperity and strength, let alone
    harmonious and long-lasting beautiful survival.


