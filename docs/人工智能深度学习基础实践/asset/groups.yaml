    # 第1篇


    # 人工智能产品研发


    人工智能（Artificial Intelligence，AI）是一门涉及多学科、多领域知识的学科，其主要研究的是利用人工的方法和技术，模仿、延伸甚至拓展人的智能，实现机器的智能。人工智能自诞生以来，取得了很多举世瞩目的成果，其在许多领域都有所应用。本篇将主要介绍人工智能产品的需求管理、产品设计和开发平台应用，使读者逐步了解人工智能产品的研发流程。'
  - '[PAGE 10]


    # 项目 1


    # 人工智能需求管理


    人工智能自1956年诞生至今，历经了起起落落的60多年。在这期间，人工智能领域产生了不少科研成果。但这些成果有的只是“昙花一现”，有的则经过不断的优化、改善，成为今天人们喜闻乐见的人工智能产品，如智能机器人和无人车等。如今，成功商业化的人工智能产品有不少，这些产品出现在人们的日常生活中，可帮助人们排忧解难。


    +   (1) 了解人工智能产品需求的定义。

    +   (2) 了解人工智能产品需求管理的过程。

    +   (3) 熟悉需求文档的撰写方法。

    +   (4) 掌握5W2H分析法。

    +   (5) 能够针对实际场景撰写需求文档。


    # 项目描述


    人工智能产品的诞生，是以解决人们生活中遇到的实际问题为基础的，而这些实际问题就可作为人工智能产品的需求。在本项目中，我们将首先介绍需求的定义，接着介绍需求管理的过程，并通过商品检测项目介绍需求文档的撰写，帮助读者掌握人工智能产品的需求分析方法和需求文档的撰写方法，为读者将来设计人工智能产品时提供产品需求基础知识。


    # 知识准备


    # 1.1 需求的定义


    “需求”一直是人工智能产品开发过程中较为模糊的词之一，其定义并不统一。不同背景的人从不同角度来理解需求会有不同的看法。“需求”一词通常可以从商业运用和技术开发两个角度进'
  - '[PAGE 11]


    行理解。


    从商业运用的角度理解，需求指的是某产品或服务能够满足用户的某些需要的集合，通常可分为业务需求、用户需求和系统需求 3 种。以下是对这 3 种需求的具体介绍。


    +   - 业务需求描述的是用户所期待的需求，其主要从宏观层面描述产品可解决市场上的哪些痛点和问题。


    +   - 用户需求描述的是用户要求产品必须完成的任务以及完成任务的方法。用户需求通常可在问题定义的基础上进行用户访谈、调查，然后通过对用户使用产品的场景进行整理而得到。


    +   - 系统需求则是进一步拆分用户需求，用于完成功能列表的输出。这一级的需求可以添加到研发中。


    以自动驾驶汽车产品为例，其商业运用角度下的需求描述如表 1-1 所示。


    表1-1 自动驾驶汽车产品在商业运用角度下的需求


    | 需求类型 | 需求内容 |

    | :--- | :--- |

    | 业务需求 | 减少驾驶员的操作任务量 |

    | 用户需求 | 自动并且安全地行驶到目的地 |

    | 系统需求 | 首先感知道路环境并获取车辆位置信息，然后根据道路环境和车辆位置信息规划行驶路径，最后执行车辆控制，实现自动驾驶 |


    从技术开发的角度理解，常使用电气电子工程师学会（Institute of Electrical and Electronics Engineers，IEEE）对于产品需求的定义来解释需求，即系统或系统部件为了满足用户要求、合同、标准、规范或其他正式文档所规定的要求而需要具备的条件或能力的文档化表述。该定义强调了“需求”的两个不可分割的方面，一是需求是以用户为中心的，是与问题相联系的；二是需求要被清晰、明确地写在文档里。


    # # 1.2 需求管理的过程


    我们已经了解了人工智能产品的需求的定义，接下来介绍人工智能产品需求管理的过程。对于人工智能产品来说，需求管理的工作目标是搭建用户与开发者之间有效沟通的“桥梁”，将用户对于产品的需求真实且有效地转换为开发者所设计的产品功能，从而保证产品的价值和可行性。从实现流程的角度来看，需求管理的过程可以分为需求获取、需求分析、需求表述以及需求验证
    4 个环节。接下来进一步介绍这 4 个环节。


    # # 1.2.1 需求获取


    人工智能产品的需求获取，指的是从使用者、企业、市场等方面获取用户对产品的需求。其主要目标是获得用户对于人工智能产品完整的需求，避免需求遗漏造成产品重要功能的“丢失”。常见的需求获取方法包括用户访谈法、问卷调查法、使用测试法和数据分析法
    4 种。以下是 4 种方法的具体介绍。


