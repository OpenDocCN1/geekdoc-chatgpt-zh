    # 表7-2 随机森林参数说明


    | 参数 | 说明 |

    | :--- | :--- |

    | n_estimators | 森林中树的棵数。该参数是典型的模型表现与模型效率成反比的影响因子 |

    | criterion | 度量分裂的标准。可选值有 mse (均方误差) 和 mae (平均绝对值误差) |

    | max_features | 寻找最佳分裂点时考虑的特征数目。这一参数是针对单棵树来设置的, 通常来讲, 这个值越大, 单棵树可以考虑的特征越多, 则模型的表现就越好
    |

    | max_depth | 树的最大深度 |

    | min_samples_split | 分裂内部节点需要的最少样例数 |

    | min_samples_leaf | 叶节点上应有的最少样例数 |

    | max_leaf_nodes | 以 "最优先先方式" 生成最大叶节点的树, 最优节点定义为纯度相对减少, 如果值为 None 则不限制叶节点个数 |

    | bootstrap | 构建树时是否采用有放回样本的方式 |


    调整参数时, scikit-learn 库中的 GridSearchCV() 函数是可用于调参的交叉验证函数, 使用这个函数可以便捷地找出模型的最优参数。所谓交叉验证,
    可以简单理解为对模型评估更加准确的测试集。对某一分类器, 确定想要调参的名称和数值, 将其作为一个字典传入这个函数, 然后该函数会返回最佳的参数组合。代码实现如下。


    ```

    clf = GridSearchCV(estimator=rfc,param_grid=tuned_parameters, cv=5, n_jobs=1)

    ```


    调用该函数后, 即可输出使训练模型效果最佳的参数。


