    # # 前言


    # P R E F A C E


    随着互联网、大数据、云计算、物联网、5G 通信技术的快速发展以及以深度学习为代表的人工智能技术的突破，人工智能领域的产业化成熟度越来越高。人工智能正在与各行各业快速融合，助力传统行业转型升级、提质增效，在全球范围内引发了全新的产业发展浪潮。艾瑞咨询公司提供的数据显示，超过
    77% 的人工智能企业属于应用层级企业，这意味着大多数人工智能相关企业需要的人才并非都是底层开发人才，更多的是技术应用型人才，这样的企业适合职业院校和应用型本科院校学生就业。并且，许多人工智能头部企业开放了成熟的工程工具和开发平台，可促进人工智能技术广泛应用于智慧城市、智慧农业、智能制造、无人驾驶、智能终端、智能家居、移动支付等领域并实现商业化。


    为积极响应《国家职业教育改革实施方案》，贯彻落实《国务院办公厅关于深化产教融合的若干意见》和《新一代人工智能发展规划》的相关要求，应对新一轮“科技革命”和“产业变革”的挑战，促进人才培养供给侧和产业需求侧结构要素的全方位融合，深化产教融合、校企合作，健全多元化办学体制，完善职业教育和培训体系，培养高素质劳动者和技能人才，北京百度网讯科技有限公司联合广州万维视景科技有限公司以满足企业用人需求为导向，以岗位技能和综合素质培养为核心，组织高职院校的学术带头人和企业工程师共同编写本书。本书是“1+X”证书制度试点工作中的人工智能深度学习工程应用职业技能等级证书（中级）指定教材，采用“教、学、做一体化”的教学方法，可为培养高端应用型人才提供适当的教学与训练。本书以实际项目转化的案例为主线，按“理实一体化”的指导思想，从“鱼”到“渔”，培养读者的知识迁移能力，使读者做到学以致用。


    本书主要特点如下。


    # ## 1. 引入百度人工智能工具平台技术和产业实际案例，深化产教融合


    本书以产学研结合作为教材开发的基本方式，依托行业、头部企业的人工智能技术研究和业务应用，开展人工智能开放平台的教学与应用实践，发挥行业企业在教学过程中无可替代的关键作用，提高教学内容与产业发展的匹配度，深化产教融合。通过本书，读者能够依托如百度公司的
    EasyData 智能数据服务平台、EasyDL 零门槛 AI 开发平台等工具平台，高效地进行学习和创新实践，掌握与行业企业要求匹配的专业技术。'
  - '[PAGE 4]


    # # 前言 PREFACE


    # ## 2. 以“岗课赛证”融通为设计思路，培养高素质技术技能型人才


    本书基于人工智能训练师国家职业技能标准的技能要求和知识要求进行设计，介绍完成职业任务所应具备的专业技术能力，依据“1+X”人工智能深度学习工程应用职业技能等级证书考核要求，并将“中国软件杯大学生软件设计大赛芯片质检赛道——基于百度飞桨
    EasyDL 平台的芯片质检系统”等竞赛中的新技术、新标准、新规范融入课程设计，将大赛训练与实践教学环节相结合，实施“岗课赛证”综合育人，培养学生综合创新实践能力。


    # ## 3. 理论与实践紧密结合，注重动手能力的培养


    本书采用任务驱动式项目化体例，每个项目均配有实训案例。在全面、系统介绍各项目知识准备内容的基础上，介绍可以整合“知识准备”的案例，通过丰富的案例使理论教学与实践教学交互进行，强化对读者动手能力的培养。


    本书为融媒体教材，配套视频、源代码、PPT、电子教案等资源，读者可扫码免费观看视频，登录人邮教育社区（www.yjiaoyou.com）下载相关资源。本教材还提供在线学习平台——Turing
    AI 人工智能交互式在线学习和教学管理系统，以方便读者在线编译代码及交互式学习深度学习框架开发应用等技能。如需体验该系统，或获取案例源代码，读者可扫描二维码关注公众号，联系客服获取试用账号。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_4_0.png)


    ![](img/54d7dd15f0857a11a3f298484cc566c5_4_1.png)


    本书编者拥有多年的实际项目开发经验，并拥有丰富的教育教学经验，完成过多轮次、多类型的教育教学改革与研究工作。本教材由张健、常城任主编，孟思明、郭春锋、邱焕耀任副主编，广州万维视景科技有限公司李伟昌、庄晓辉等工程师也参加了图书编写。


    由于编者水平有限，书中不妥或疏漏之处在所难免，殷切希望广大读者批评指正。同时，恳请读者发现不妥或疏漏之处后，能于百忙之中及时与编者联系，编者将不胜感激，E-mail：veryvision@tringai.com。'
