    \ 10-1 数据概览\n\n其中，油耗量 “consume” 用作数据集的标签，而其他的特征用作输入的特征。\n\n（3）划分训练集和测试集，通过以下代码定义数据集划分函数\
    \ train_test_split()。\n\n```python\ndef train_test_split(data_split, train_size_rate=0.7):\n\
    \    assert train_size_rate < 1 and train_size_rate > 0, 'train_size_rate should\
    \ be greater than 0 and smaller than 1'\n    data_split = data_split.sample(frac=1).reset_index(drop=True)\
    \ # 通过随机采样打乱数据\n    train_data = data_split.iloc[:int(len(data_split) * train_size_rate),\
    \ :] # 划分训练集\n    test_data = data_split.iloc[int(len(data_split) * train_size_rate):,\
    \ :] # 划分测试集\n    return train_data, test_data\n```\n\n这里默认训练集和测试集的数据比例为 7:3，可以通过控制\
    \ train_size_rate 参数的大小来调整比例。需要注意的是，传入的参数的值应该为 (0,1) 的值。\n\n以下代码表示调用数据集划分函数 train_test_split()。\n\
    \n```python\ndata_train, data_test = train_test_split(data)\n```\n\n（4）将数据封装成数据集。\n\
    \n调用前文介绍过的数据封装方法 load_data() 进行封装。对于不同的任务，只需要传入 DataFrame 格式的数据集，即可完成封装以供深度学习模型使用，其中\
    \ DataFrame 是 pandas 库用来处理数据的一种特殊的格式。示例代码如下。\n\n```python\ndef load_data(data_load,\
    \ labels_name, batch_size):\n\n    data_load = data_load.sample(frac=1).reset_index(drop=True)\
    \ # 打乱传入的数据集\n\n    labels = data_load[labels_name] # 取出标签列\n    data_ready_to_load\
    \ = data_load.drop(labels_name, axis = 1) # 丢弃标签列\n\n    assert len(data_ready_to_load)\
    \ == len(labels), \\\\\n    \"length of train_imgs() should be the same as train_labels()\"\
    .format(\n        len(data_clean), len(labels))\n\n    def data_generator():\n\
    \n        data_list = []\n        labels_list = []\n\n        for i in list(data_ready_to_load.index):\n\
    \            data = np.array(data_ready_to_load.iloc[i, :]).astype('float32')\
    \  # 取出一条数据进行格式的转换\n\n            label = np.array(labels[i]).astype('float32')\n\
    \            label = np.reshape(labels[i], [1]) # 取出一条数据的标签进行格式的转换\n\n       \
    \     data_list.append(data)\n            labels_list.append(label)\n\n      \
    \  if len(data_list) == batch_size:\n            yield np.array(data_list), np.array(labels_list)\
    \ # 生成一个批次的数据\n\n            data_list = []\n            labels_list = []\n\n\
    \        if len(data_list) > 0: # 最后一个批次的数量可能不足一个 batch_size\n            yield\
    \ np.array(data_list), np.array(labels_list)\n\n    return data_generator # 返回一个数据迭代器\n\
    ```\n\n### 步骤 4：训练设置\n\n接下来进行模型的训练设置。首先定义模型评估函数，用于模型每轮训练后的模型评估，接着定义模型训练函数并配置相关参数，具体步骤如下。\n\
    \n(1) 在本项目中，使用均方误差来评估模型的效果，代码如下。\n\n```python\ndef evaluate_mse(data_iter, net):\n\
    \    mse_sum, n = 0.0, 0\n    with paddle.no_grad(): # 在评估模型效果期间，需要关闭模型的梯度追踪功能\n\
    \        for batch_id, data in enumerate(data_iter()):\n            X, y = data\
    \ # 读取一条数据\n            X = paddle.to_tensor(X)\n            y = paddle.to_tensor(y)\n\
    \            net.eval() # 评估模式，这会关闭丢弃层\n            predicts = net(X) # 通过前向传播过程得到预测值\n\
    \            mse = F.square_error_cost(predicts.astype('float32'), y.astype('float32')).sum()\n\
    \            mse_sum += mse\n            net.train() # 改回训练模式\n            n +=\
    \ 1\n    return mse_sum / n\n```\n\n这样，便可以通过均方误差来评估模型的效果。注意，这里均方误差既是损失函数，也是评估模型效果的指标。\n\
    \n(2) 接着将上述介绍的导入相关库、模型设计、数据准备和训练设置的操作步骤串联起来，并设置优化器等参数，具体代码如下。\n\n```python\ndef\
    \ train(model, train_data, test_data, labels_name, batch_size, lr):\n    paddle.set_device('cpu')\n\
    \    model.train()\n    # 调用加载数据的函数\n    train_loader = load_data(train_data,\
    \ labels_name, batch_size)\n    test_loader = load_data(test_data, labels_name,\
    \ batch_size)\n    # 使用 SGD 优化器\n    opt = paddle.optimizer.SGD(learning_rate=lr,\
    \ parameters=model.parameters())\n    # 训练 200 轮\n    EPOCH_NUM = 200\n    for\
    \ epoch_id in range(EPOCH_NUM):\n        train_acc_sum, n = 0.0, 0\n        for\
    \ batch_id, data in enumerate(train_loader()):\n            # 准备数据\n         \
    \   images, labels = data\n            images = paddle.to_tensor(images)\n   \
    \         labels = paddle.to_tensor(labels)\n\n            # 前向计算的过程\n       \
    \     predicts = model(images)\n\n            # 计算损失，取一个批次样本损失的平均值\n         \
    \   loss = F.square_error_cost(predicts.astype('float32'), labels.astype('float32'))\n\
    \            avg_loss = paddle.mean(loss)\n\n            n += labels.shape[0]\n\
    \n            mse_test = evaluate_mse(test_loader, model)\n\n            # 每训练\
    \ 10 个批次的数据，输出当前损失的情况\n            if batch_id % 10 == 0:\n                print(\"\
    epoch: {}, batch: {}, loss is: {}, test mse is: {}\".format(epoch_id,\n      \
    \          batch_id, avg_loss.numpy(), mse_test.numpy()))\n\n            # 后向传播，更新参数的过程\n\
    \            avg_loss.backward()\n            # 最小化损失，更新参数\n            opt.step()\n\
    \            # 清除梯度\n            opt.clear_grad()\n\n        # 保存模型参数\n      \
    \  paddle.save(model.state_dict(), 'mnist.pdparams')\n```\n\n### 步骤 5：模型训练\n\n\
    接下来通过以下代码，运行设计好的深度学习线性回归模型。\n\n```python\nmodel = Regressor(10)\ntrain(model,\
    \ data_train, data_test, 'consume', 16, 1e-3)\n```\n\n输出结果如下。\n\n```\nepoch: 0,\
    \ batch: 0, loss is: [3.1374726], test mse is: [60.88098]\nepoch: 0, batch: 10,\
    \ loss is: [3.6692462], test mse is: [57.84583]\nepoch: 1, batch: 0, loss is:\
    \ [2.8525157], test mse is: [56.027958]\n...\nepoch: 199, batch: 10, loss is:\
    \ [0.02932842], test mse is: [0.8605465]\n```\n\n从输出结果可以看到，最后结束训练时，训练集上的损失值 loss\
    \ 只有 0.02932842，而测试集上的误差值 mse 为 0.8605465，可见经过训练得到的模型效果十分优良。\n\n## 知识拓展\n\n在 10.2\
    \ 节中介绍了 3 种非常基础的优化器。现在，将介绍一种引入动量的效果更佳的优化器——Momentum。所谓动量是模拟物理中的概念，一个物体的动量指的是该物体在其运动方向上保持运动的趋势，是该物体的质量和速度的乘积。Momentum\
    \ 引入了指数衰减平均和指数加权平均这两个概念。在了解 Momentum 前，先了解指数衰减和指数加权平均。\n\n指数衰减即指某一个变量在 t 时刻的值是\
    \ t+1 时刻的值的 \\(\\frac{1}{\\alpha}\\) 的变化现象。其中 \\(\\alpha\\) 是衰减因子，用于控制每次衰减的幅度。假设\
    \ t 时刻有一个变量 A，则 t+1 时刻的变量 A 的值如下。\n\n\\(A_{t+1}=\\alpha \\times A_t\\)\n\n指数加权平均即指某一个变量在\
    \ t 时刻的值，可以由 t-1 时刻的变量的值和 t-2 时刻之前累计变量的值加权得到。假设 t 时刻有一个变量 A，则 t-1 时刻的变量 A 的值为\
    \ \\(v_{t-1}\\)。设 \\(\\beta\\) 为超参数，即可以人为指定的参数，\\(\\theta\\) 为某一时刻的累计梯度，则变量 A\
    \ 在 t 时刻及 t-1 时刻的值如下。\n\n\\(v_t = \\beta v_{t-1} + (1-\\beta)\\theta_t\\)  \n\\\
    (v_{t-1} = \\beta v_{t-2} + (1-\\beta)\\theta_{t-1}\\)\n\nMomentum 优化器是将指数衰减和指数加权平均两种思想结合，将先前累计的梯度和当前的对损失求偏导数得到的梯度进行加权得到当前的动量，其数学公式如下。\n\
    \n\\(v_{dw} = \\beta v_{dw} + (1-\\beta) \\frac{\\partial L}{\\partial \\theta}\\\
    )  \n\\(\\theta_{t+1} = \\theta_t - \\alpha v_{dw}\\)\n\n其中 \\(\\alpha\\) 也是一个超参数。\n\
    \nMomentum 优化器可以解决模型参数更新时优化幅度摆动大的问题，同时可以使模型损失收敛速度更快。可以将 \\(v_{dw}\\) 分解成负梯度的方向，即另一个与之垂直的方向。由于梯度进行累加时，与负梯度垂直的方向的正负值会相互抵消，因此可减小优化过程中的振荡程度。而负梯度方向的值会累加，从而使得模型收敛的速度加快。\n\
    \n了解完 Momentum 优化器的相关知识后，接下来介绍在 PaddlePaddle 中调用 Momentum 优化器进行优化的方法。\n\n在 PaddlePaddle\
    \ 中调用 Momentum 只需要一行代码便可以实现。\n\n```python\npaddle.optimizer.Momentum(learning_rate=0.001,\
    \ momentum=0.9, parameters=None,\nuse_nesterov=False, weight_decay=0.01, grad_clip=None,\
    \ name=None)\n```\n\npaddle.optimizer.Momentum() 函数中可选的参数的说明如下。\n\n- learning_rate\
    \ : 学习率，用于参数更新的计算。\n- momentum : 可选，动量因子。\n"
