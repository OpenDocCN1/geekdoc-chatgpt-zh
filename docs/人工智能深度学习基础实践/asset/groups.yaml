    \n```\nlr = LinearRegression() # 调用传统机器学习的线性回归模型\nlr.fit(X, y) # 利用线性回归模型训练数据\n\
    ```\n\n### 步骤 5：预测数据\n\n构建好模型以后，利用模型对数据进行预测。由于数据量不大，直接采取原训练数据作为测试集。在实际生产中，通常需要将额外的标签数据作为测试集。\n\
    \n```\ny_pred=lr.predict(X) # 利用训练的模型对数据进行预测\n```\n\n完成回归任务后，需要对效果进行评价。评价线性回归效果的指标有\
