    \n## 知识拓展\n\n人工智能的基础是数据的应用，而在人工智能领域中的深度学习分支中，数据的质量及数量会直接影响模型的性能发挥，这也是需要做好数据采集的原因。但在利用数据训练模型的过程中，数据采集只是第一步，接着还有数据处理、数据标注及数据存储等关键技术。本篇的项目\
    \ 5 和项目 6 将详细讲解数据处理以及数据标注的流程，在此不赘述，下面将简单介绍数据存储。\n\n人工智能可以帮助企业利用其核心数字资产创造竞争优势，随着企业积累的数据越来越多、越来越好，其模型算法也会得到完善和改进，这意味着很少的数据会被丢弃，数据随着时间的推移逐渐积累并重新被处理，因此必须考虑数据存储的问题。在选择人工智能数据存储平台之前，企业应该从费用、可扩展性、性能\
    \ 3 个方面来综合考虑数据存储的方法。\n\n- (1) 费用。人工智能数据存储平台的性价比是企业考虑的关键因素。管理层的目标一般包括使数据存储尽可能地具备成本效益。通常情况下，费用这一因素将影响企业的产品选择和策略。\n\
    - (2) 可扩展性。企业通常需要收集、存储和处理大量数据用以创建人工智能模型。创建并训练准确率高的人工智能模型可能需要 TB 甚至更大容量的数据，随着企业存储的数据越来越多，人工智能数据存储平台的可扩展性也变得越来越重要。\n\
    - (3) 性能。人工智能数据的存储性能分析关乎数据存储的安全及处理速度，如存储器的延迟可能会限制每个输入 / 输出（Input/Output，I/O）请求的处理速度，也就是说，降低延迟能够直接影响创建机器学习或深度学习模型所需的时间。另外则是吞吐量，吞吐量指的是在人工智能数据存储平台单位时间内写入或读取数据的速度。吞吐量对于人工智能模型的训练很重要，因为在训练过程中往往会处理大量数据集，通常会反复读取数据以确保准确开发模型。\n\
