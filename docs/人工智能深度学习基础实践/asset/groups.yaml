    \ = tree.DecisionTreeRegressor()  \nD. rgs = RandomForestRegressor()\n\n## 项目\
    \ 8\n\n### 深度学习框架应用开发\n\n随着深度学习技术的逐步成熟和日益普及，模块化、标准化的流程工具成为开发者的普遍诉求，深度学习框架应运而生。深度学习框架提供多种具备基础功能的算法库，能帮助开发者将有限精力专注于更高层级的创新突破，实现“在巨人肩膀上的创新”。\n\
    \n### 项目目标\n\n- (1) 了解深度学习框架的作用。\n- (2) 熟悉常用的深度学习框架。\n- (3) 能够部署深度学习框架的环境。\n\n\
    ### 项目描述\n\n深度学习框架能够集训练和推理框架、开发套件、基础模型库、工具组件于一体，提供由高级语言封装的多样化接口，实现快速、便捷的关键模型构建、训练和调用，可利用工具化、平台化的方式帮助广大开发者和企业进一步降低深度学习技术的应用门槛，加速行业智能化转型。\n\
    \n本项目主要介绍目前行业内常用的深度学习框架，包括 PaddlePaddle、TensorFlow、Keras、Caffe、PyTorch 等，在实操部分将通过\
    \ pip 方式安装 PaddlePaddle，使读者掌握不同系统下深度学习框架的环境的部署方法。\n\n## 知识准备\n\n### 8.1 深度学习框架的作用\n\
    \n深度学习框架可类比为“人工智能时代的操作系统”，其能够显著降低人工智能技术的应用门槛。操作系统作为在“移动互联网时代”中连接底层硬件架构、上层软件系统与用户交互界面的控制中枢，是微软、苹果、谷歌等企业掌控产业生态主导权的核心抓手。\n\
    \n如图 8-1 所示，在“人工智能时代”，深度学习框架同样起到承上启下的连接作用，上承语义理解、图像分类、文字识别、语音合成等各类应用；下接 ASIC（Application\
    \ Specific Integrated Circuit，专用集成电路）、FPGA（Field Programmable Gate Array，现场可编程门阵列）、GPU（Graphics\
    \ Processing Unit，图形处理单元）、CPU（Central Processing Unit，中央处理器）等智能计算芯片，为不同生产环境中的人工智能应用提供强劲算力。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_105_0.png)\n\n图 8-1 深度学习框架的作用\n\n主流深度学习框架普遍提供丰富的模型组件及便捷的网络组网方式来吸引开发者，并围绕视觉、语音、语义等基础应用任务提供已训练完成的成熟模型接口，支持用户直接调用，能够快速使用户具备部署能力。\n\
    \n## 8.2 常用的深度学习框架\n\n深度学习框架的出现，使各类算法高效研发、迭代和大规模应用部署成为可能，奠定了深度学习繁荣发展的基础。目前常用的深度学习框架包括\
    \ PaddlePaddle、TensorFlow、Keras、Caffe 和 PyTorch 等，这些框架各有优势。这些深度学习框架被应用于计算机视觉、语音识别、自然语言处理与生物信息学等领域，并取得了较好的效果。以下介绍这\
    \ 5 种常用的深度学习框架。\n\n### 8.2.1 PaddlePaddle\n\nPaddlePaddle（飞桨）以百度公司多年的深度学习技术研究和业务应用为基础，集深度学习核心框架、基础模型库、端到端开发套件、丰富的工具组件于一体，是我国首个自主研发、功能完备、开源开放的产业级深度学习平台。图\
    \ 8-2 所示为 PaddlePaddle 平台的功能全景图。\n"
