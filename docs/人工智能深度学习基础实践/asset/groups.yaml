    # # 项目 2 设计人工智能产品


    随着人工智能技术的进步，人工智能产品逐步从简单地合成数据、提供有用的见解发展到能够独立行动、自主学习新任务。人工智能产品的更新和进步正在逐渐接近人们目前对于人工智能产品的期望的上限。如今对于人工智能产品的设计，不仅需要确保产品功能确实可行，还需要确保产品功能符合用户需求，可解决用户的实际问题。


    +   (1) 了解人工智能产品发展趋势。

    +   (2) 熟悉人工智能产品设计流程。

    +   (3) 掌握人工智能产品功能结构图的绘制方法。

    +   (4) 能够根据业务需求完成产品功能设计。


    # ## 项目描述


    本项目将以人工智能产品的特性作为切入点，介绍人工智能产品的设计流程。人工智能产品的设计流程包括需求管理、功能设计、原型设计、研发实施 4 个阶段。本项目将重点介绍功能设计阶段中功能结构图的绘制方法，最后通过商品检测项目帮助读者掌握人工智能产品的功能设计方法。


    # ## 知识准备


    # ## 2.1 人工智能产品的特性


    在进行人工智能产品设计之前，首先需要了解人工智能产品的特性。传统的产品是指能够在行业市场中，被人们使用、消费并且能满足人们需求的任何事物，包括有形的物品和无形的服务。'
  - '[PAGE 20]


    传统产品的特性包括以下 3 点。


    +   (1) 商业性：即产品需要提供给市场，以服务用户。


    +   (2) 功能性：即产品能够被使用和消费，满足人们的某种需求。


    +   (3) 稳定性：即产品具有可量产、可复制的特性。


    而人工智能产品是指使用人工智能技术开发，同时具备感知、学习、分析、决策和执行能力的产品。人工智能产品除了具备传统产品的 3 点特性外，还具备智能性，即基于人工智能技术，人工智能产品能自主处理信息并做出决策，实现相应功能以满足用户需求。


    # 2.2 人工智能产品设计流程


    了解了人工智能产品的特性后，我们该如何进行人工智能产品的设计呢？接下来介绍人工智能产品设计流程。


    人工智能产品设计是指针对人工智能产品的架构和实施等过程进行设计，是产品实现商业化之前的一系列准备步骤。人工智能产品设计流程通常包括需求管理、功能设计、原型设计以及研发实施
    4 个阶段。


    # 2.2.1 需求管理


    需求管理通常被称为产品设计的“零阶段”，需求指的是该产品的设计目的。这个阶段是对产品的应用情况进行判断，包括技术发展和市场目标评估。该阶段通常包含需求获取、需求分析、需求表述和需求验证
    4 个工作任务。


    # 2.2.2 功能设计


    功能设计介于需求管理和原型设计之间，其输出结果是产品概念与产品功能结构的定义。功能设计阶段需要明确产品功能的类型，罗列并分解产品功能，最后将产品功能有机结合，形成功能结构图。


    产品功能的类型一般可以按照用户的使用需求，分为基础功能、亮点功能、发展功能和非需求功能 4 种。


    # 1. 基础功能


    基础功能指的是产品为了满足用户主要需求而必须拥有的功能。例如，搜索引擎类型的产品，其基础功能是搜索功能；博客类型的产品，其基础功能是消息发布功能。


    # 2. 亮点功能


    亮点功能指的是在基础功能的基础上，侧重于满足用户的体验需求，给用户带来独特的体验感，让产品在众多竞品中脱颖而出的功能。例如，在搜索引擎类型的产品中，百度公司的搜索引擎使用基于字词结合的信息处理方式，解决了计算机对于中文信息的理解问题。'
  md: "\n微信等方式获取用户的需求。\n\n- 问卷调查法是一种能够在短时间内收集大量用户需求信息的需求获取方法。该方法主要通过互联网渠道，设计、发布需求问卷并让用户填写，然后通过统计用户反馈信息、量化数据等方式获取用户需求。\n\
    \n- 使用测试法是指在用户使用产品的过程中，通过观察用户遇到的问题，根据用户实际使用产品的行为来获取用户的实际使用需求。相比于用户访谈法与问卷调查法，使用测试法的操作难度更高，但获取到的需求更贴近用户的真实想法。\n\
    \n- 数据分析法指的是通过分析大量用户的真实数据，发现数据的特点，挖掘数据背后的用户需求的方法。如分析大量用户所欣赏的电影的数据，挖掘得到用户对于电影类型、时长等方面的偏好和需求。\n\
    \n### 1.2.2 需求分析\n\n需求分析主要是将获取到的大量信息进行简化和筛选，目的是获取用户真实的需求。\n人工智能产品的需求分析方法，继承与发展了传统产品的需求分析方法。但从本质上来说，其分析方法同传统产品的并无二致，都是为了不断提升用户体验及效率。目前，人工智能产品在某些细分领域的功能与作用日益凸显，但在更加复杂的社会环境中，人工智能产品即便拥有再强大的功能，也可能无法独当一面。因此，在面对复杂场景的情况下，只有通过正确的方法积极探索并分析需求，研发人员才能发现更有利的切入点，所研发的产品才能产生更大的效益。\n\
    \n### 1.2.3 需求表述\n\n人工智能产品需求分析的结果可以视作用户对于产品较为真实的需求，而这些需求需要以可视化的形式进行表述，进而传达给人工智能产品的开发者，用以进行产品的设计和开发、制作。\n\
    常见的需求表述形式以文档为主。如图 1-1 所示，从商业运用的角度来看，需求文档可分为产品前景文档、用户需求文档和产品规格说明文档 3 种类型。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_12_0.png)\n\
    \n图 1-1 需求文档的类型\n\n其中，产品前景文档主要围绕业务需求展开，其内容涉及市场分析、销售策略、盈利预测等。\n产品前景文档通常是供决策层讨论的演示文档，一般比较简短、精炼，没有产品细节。\n\
    用户需求文档主要围绕用户需求展开，主要描述在理想情形下，产品的使用方式以及需要提供给用户的界面。\n产品规格说明文档主要围绕系统需求展开，该文档在用户需求文档的基础上，增加了用户对产品的非功能性需求描述。非功能性需求对产品的设计和实现提出了限制，非功能性需求如产品的性能、质量、外观等。\n\
    \n### 1.2.4 需求验证\n\n需求验证的目的是尽可能地保证需求文档真实、有效地描述需求，以及能够有效地将需求传达给开发者。需求文档需要按照以下两个标准进行质量验证。\n\
    \n- 文档内的每条需求都真实、准确地反映了用户的意图。文档记录的需求集在整体上具有完整性和一致性。\n- 文档的内容具有可读性和可修改性。\n\n为了保证满足以上两个标准，在将需求文档传递给相关人员之前，需要对其进行严格的验证，保证其真实且准确。\n\
    \n## 1.3 需求文档的撰写\n\n需求文档是产品需求主要的直观表述形式。在撰写需求文档的过程中，需要结合实际产品的类型、用户的意愿以及文档撰写人员的分析角度等因素对需求文档进行调整，因此需求文档的内容和格式并没有统一标准。但无论是以哪个角度进行分析，在需求文档中都应有\
    \ 3 点核心内容，分别为产品需求、产品目标和产品功能。接下来进一步介绍这 3 点核心内容。\n\n### 1.3.1 产品需求\n\n在人工智能产品的需求分析过程中，常用\
    \ 5W2H 分析法进行需求分析。\n\n5W2H 分析法也叫七何分析法，是一种帮助产品开发人员更好地理解用户需求的思维方法。如图 1-2 所示，5W2H\
    \ 分析法表示 5 个以 W 开头的英文单词和 2 个以 H 开头的英文单词和词组。5W 是指 Who（人员）、When（时间）、Where（地点）、Why（原因）和\
    \ What（对象），2H 是指 How（方法）和 How much（成本）。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_13_0.png)\n\
    \n图 1-2 5W2H 分析法示意\n\n5W2H 分析法主要从 7 个方向对产品需求进行设问，继而发现解决问题的线索，寻求创新和开发项目的思路，并进一步构思、设计产品，其具体的思考方向及思考内容如表\
    \ 1-2 所示。\n\n表 1-2 5W2H分析法的思考方向及思考内容\n\n| 思考方向 | 思考内容 |\n|---|---|\n| 原因（ Why\
    \ ） | 主要目的：了解为什么需要完成目标 常见问题：为何在这个时候？为何是这个问题？为何必须在这个时间、日期才能解决问题？...... |\n| 对象（\
    \ What ） | 主要目的：了解需要完成哪些事情 常见问题：什么是解决问题的必要条件？什么是解决问题的助力或者阻力？什么是解决问题的挑战？......\
    \ |\n| 人员（ Who ） | 主要目的：说明整个业务流程中所有涉及的相关人员 常见问题：谁与此问题最相关？谁可能解决此问题？...... |\n|\
    \ 时间（ When ） | 主要目的：说明会在什么时间完成目标 常见问题：问题发生的时间、时段、期限是什么？解决问题的时间、时段、期限是什么？......\
    \ |\n| 地点（ Where ） | 主要目的：说明会在什么地点完成目标 常见问题：问题发生在哪个地点？问题覆盖的范畴有多大？解决问题的着力点在何处？......\
    \ |\n| 方法（ How ） | 主要目的：说明如何完成目标 常见问题：事情发生的经过是什么？事情发生的频率是什么？环境改变，事情本身如何变化？花多少时间才能解决问题？......\
    \ |\n| 成本（ How much ） | 主要目的：说明完成目标所需要花费的成本 常见问题：指标是什么？成本是多少？销售量是多少？...... |\n\
    \n如果现行的做法或产品已经经过这 7 个方向的审核和验证，便可认为这一做法或产品可取。如果对这 7 个方向的思考不能得到令人满意的答案，则表示该做法或产品还有改进余地。\n\
    \n### 1.3.2 产品目标\n\n人工智能产品的需求分析活动会产生针对需求的产品目标，它指定人工智能产品开发需要完成的任务。\n\n人工智能产品的主要目标是解决实际生活场景中的问题。明确人工智能产品的目标能够为产品开发人员提供清晰的设计和开发方向。\n\
    \n产品目标主要用于将产品的特点、应用场景和工作任务等信息告知开发人员。因此，需要针对产品需求进行提炼和总结，形成产品目标。产品目标的描述可参考以下思路：一种具有什么特点、能够用于什么场景的产品，其目标是处理什么任务。\n\
    \n### 1.3.3 产品功能\n\n基于产品需求和产品目标，可以对产品功能的实现流程进行初步设计。需求文档中的产品功能部分主要结合产品的目标和需求，概括性地提出设想的产品主要功能和开发思路。产品功能的描述可参考以下思路：基于什么目标，首先完成哪些工作步骤，然后完成哪些工作步骤，最后完成哪些工作步骤，以实现该目标。\n\
    \n将产品需求、产品目标、产品功能 3 个部分的内容整合在一起，即需求文档的核心内容。\n\n因为产品的开发是通过一个个的项目完成的，所以在实际描述产品功能时，也常常将产品分割为项目进行描述。因此，产品需求文档撰写过程中涉及的需求分析、目标明确、功能描述的方法，也同样适用于项目需求文档的撰写。\n\
    \n## 1.4 实施思路\n\n基于项目描述与知识准备内容的学习，我们已经基本了解了人工智能产品的需求分析。下面结合实际需求，使用 5W2H 分析法对“新零售”场景下的商品检测项目进行需求分析，并撰写该项目的需求文档，使读者进一步掌握具体的人工智能产品的需求分析方法。以下是本项目实施的步骤。\n\
    \n- （1）使用 5W2H 分析法分析需求。\n- （2）明确产品目标。\n- （3）描述产品功能。\n\n## 1.5 实施步骤\n\n### 步骤 1：使用\
    \ 5W2H 分析法分析需求\n\n接下来将使用 5W2H 分析法对商品检测项目进行具体的需求分析，明确本项目的开发需求。\n\n- （1）首先需要回答原因（\
    \ Why ）方面的问题，为什么要研发这个项目？为什么要解决这个问题？\n\n客户的选择对于零售业来说是非常重要的，要想商品获得足够的关注，就要使商品在货架上得到充分的曝光。因此，商品检测就成了解决这个问题的关键。\n\
    \n- （2）接下来从对象（ What ）、时间（ When ），地点（ Where ）3 个方面开展设问，对商品检测项目进行需求分析，具体的分析如下。\n\
    \n- ① 什么是商品检测？\n\n商品检测指的是通过某种方法或技术，实现对百货公司、大卖场、商超等销售场所的各类商品进行识别、检测，协助工作人员完善商品管理和销售的一种方式。一般情况下，一个商品检测模型，可支持识别商品基本信息，如陈列顺序、层数、场景，统计排面数量和占比，根据项目需求的不同，商品检测模型的对应功能也有所不同。\n\
    \n- ② 什么时候需要商品检测？\n\n零售业的商家需要及时应对市场需求的变化，可通过将商品充分陈列以提高用户的购买率和体验感。而商品检测是解决货架商品缺失、摆放错位等问题的重要方法，因此商品检测需要频繁且规律地进行。\n\
    \n- ③ 哪里要用到商品检测？\n\n如图 1-3 所示，商品检测适用于普通货架 / 货柜、无人货柜、智能结算台、地堆商品陈列等场景的商品陈列规范核查，也适用于堆箱、堆头、地龙等场景的商品陈列规范核查。其支持识别商品基本信息，支持可视化商品的数量和估算商品占地面积。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_16_0.png)\n![](img/54d7dd15f0857a11a3f298484cc566c5_16_1.png)\n\
    ![](img/54d7dd15f0857a11a3f298484cc566c5_16_2.png)\n![](img/54d7dd15f0857a11a3f298484cc566c5_16_3.png)\n\
    \n图 1-3 商品检测应用场景一览\n\n- （3）最后从人员（Who）、方法（How）以及成本（How much）3 个方面入手，探讨商品检测项目的可行性，具体分析如下。\n\
    \n- ① 对于人员（Who）问题，可以从项目涉及的使用人员和开发人员两个方面进行分析。商品检测产品的使用人员为商铺员工，货架巡检工作往往是穿插在商铺员工的主要工作中进行的。因此商品检测产品除了需要具备一定的识别准确性，还需要具备操作简便、易使用的特点，降低商铺员工的使用门槛。商品检测产品具备物体识别的功能，因此需要开发人员具备人工智能算法知识。在没有人工智能算法工程师的情况下，可以通过开放的人工智能开发平台（该平台可以提供大量的训练数据）调用对应的模型进行训练，从而得到能够准确识别物体的模型。\n\
    \n- ② 商品检测产品可以基于物体检测任务的方法（How）找出所有图像中的目标，即商品的类别与位置，实现对货架上的商品进行检测的任务。\n\n- ③ 至于成本（How\
    \ much）的问题，也是开发者和商家考虑的重要因素之一。在使用商品检测产品进行商品检测时，只需要使用手机、货架等设备的摄像头对商品的陈列位置进行拍摄，即可识别货架摆放情况，节省人工成本的同时，避免了货架信息收集难和反馈时间过长的问题。根据以上分析，即可整理出商品检测产品的需求思考方向和思考内容，如表\
    \ 1-3 所示。\n\n表 1-3 商品检测产品的需求思考方向和思考内容\n\n| 思考方向 | 思考内容 |\n|---|---|\n| 原因（Why）\
    \ | 客户的选择对于零售业来说是非常重要的，要想商品获得足够的关注，就要使商品在货架上得到充分的曝光。因此，商品检测就成了解决这个问题的关键 |\n| 对象（What）\
    \ | 商品检测产品需要能够识别商品基本信息，如陈列顺序、层数、场景，统计排面数量和占比 |\n| 时间（When） | 零售业的商家需要及时应对市场需求的变化，可通过将商品充分陈列以提高用户的购买率和体验感。而商品检测是解决货架商品缺失、摆放错位等问题的重要方法，因此商品检测需要频繁且规律地进行\
    \ |\n| 地点（Where） | 商品检测适用于普通货架 / 货柜、无人货柜、智能结算台、地堆商品陈列等场景的商品陈列规范核查，也适用于堆箱、堆头、地龙等场景的商品陈列规范核查。其支持识别商品基本信息，支持可视化商品数量和估算商品占地面积\
    \ |\n| 人员（Who） | 项目涉及的使用人员为商铺员工，涉及的开发人员需要具备人工智能算法知识。在没有人工智能算法工程师的情况下，可以通过开放的人工智能开发平台（该平台可以提供大量的训练数据）调用对应的模型进行训练，从而得到能够准确识别物体的模型\
    \ |\n| 方法（How） | 商品检测产品可以找出图像中目标的信息，包括商品的类别与位置，实现对货架上的商品进行检测的任务 |\n| 成本（How much）\
    \ | 在使用商品检测产品进行商品检测时，只需要使用手机、货柜等设备的摄像头对商品的陈列位置进行拍摄，即可识别货架摆放情况，节省人工成本的同时，避免了货架信息收集难和反馈时间过长的问题\
    \ |\n\n### 步骤 2：明确产品目标\n\n根据使用 5W2H 分析法所得到的需求，可以提炼出产品目标。产品目标的描述主要是回答文档查阅者关于产品“有什么特点？在什么场景下能处理什么问题？”的疑问。商品检测产品的目标是以一种脱离人工的、高度智能化的、准确度高并且有实用价值的方法在零售场景下对商品进行自动检测，以规范货架、货柜、智能结算台等场景的商品陈列方式。\n\
    \n### 步骤 3：描述产品功能\n\n基于需求和产品目标，可以对商品检测产品功能的实现流程进行初步设计。\n\n产品功能的描述，主要是针对文档查阅者关于产品“怎么实现”的疑问，提出初步的解决思路。商品检测产品的主要功能是基于物体检测任务识别商品：首先准备大量的实际货架图像数据，接着通过算法工程师或者人工智能开发平台，如百度\
    \ EasyDL 零门槛 AI 开发平台，训练得到一个识别精准度较高的商品检测模型，最后使用手机或货柜等设备的摄像头对商品的陈列位置进行拍摄，找出图像中我们感兴趣的所有目标商品，确定它们的类别和位置，实现对货架上商品的检测。\n\
    \n将步骤 1 的产品需求、步骤 2 的产品目标和步骤 3 的产品功能进行整合，即得到需求文档的核心内容。\n\n## 知识拓展\n\n知识准备部分已经详细介绍了\
    \ 5W2H 分析法，接下来介绍另一种在企业管理和技术开发活动中广泛应用的需求分析方法——6W2H 分析法。\n\n6W2H 分析法又叫八何分析法，是在 5W2H\
    \ 分析法的基础上增加了一项 Which（选择某件事或某一个方案）。\n\n6W2H 分析法对于设定有效的目标、分析客户需求、制订工作计划等非常实用，还能用于提高效率，使工作有效进行。该方法包含选择（Which）、原因（Why）、对象（What）、人员（Who）、时间（When）、地点（Where）、方法（How）和成本（How\
    \ much）共 8 部分，如图 1-4 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_18_0.png)\n\
    \n图 1-4 6W2H 分析法示意\n\n无论是 5W2H 分析法还是 6W2H 分析法，都是通用的需求分析方法，这些方法被广泛应用于企业管理和技术开发活动中。虽然分析方法的类型有许多，但究其本质，都是为工作或决策提供思考框架或路线，有助于提高工作效率、提高工作的条理性。\n\
    \n## 课后实训\n\n- (1) 从商业运用的角度理解，需求不包括以下哪一项？（  ）【单选题】\n  - A. 业务需求\n  - B. 功能需求\n\
    \  - C. 用户需求\n  - D. 系统需求\n\n- (2) 需求获取的方法不包括以下哪一项？（  ）【多选题】\n  - A. 用户访谈法\n \
    \ - B. 问卷调查法\n  - C. 数据分析法\n  - D. 5W2H 分析法\n\n- (3) 以下哪一项不属于需求管理的过程？（  ）【单选题】\n\
    \  - A. 需求获取\n  - B. 需求分析\n  - C. 需求表述\n  - D. 需求原型设计\n\n- (4) 需求验证的标准不包括以下哪一项？（\
    \  ）【单选题】\n  - A. 准确性\n  - B. 非功能性\n  - C. 可读性\n  - D. 完整性\n\n- (5) 5W2H 分析法不包括以下哪一项要素？（\
    \  ）【单选题】\n  - A. 原因（Why）\n  - B. 对象（What）\n  - C. 选择（Which）\n  - D. 方法（How）\n\
    \n## 项目 2 设计人工智能产品\n\n随着人工智能技术的进步，人工智能产品逐步从简单地合成数据、提供有用的见解发展到能够独立行动、自主学习新任务。人工智能产品的更新和进步正在逐渐接近人们目前对于人工智能产品的期望的上限。如今对于人工智能产品的设计，不仅需要确保产品功能确实可行，还需要确保产品功能符合用户需求，可解决用户的实际问题。\n\
    \n- (1) 了解人工智能产品发展趋势。\n- (2) 熟悉人工智能产品设计流程。\n- (3) 掌握人工智能产品功能结构图的绘制方法。\n- (4) 能够根据业务需求完成产品功能设计。\n\
    \n### 项目描述\n\n本项目将以人工智能产品的特性作为切入点，介绍人工智能产品的设计流程。人工智能产品的设计流程包括需求管理、功能设计、原型设计、研发实施\
    \ 4 个阶段。本项目将重点介绍功能设计阶段中功能结构图的绘制方法，最后通过商品检测项目帮助读者掌握人工智能产品的功能设计方法。\n\n### 知识准备\n\
    \n### 2.1 人工智能产品的特性\n\n在进行人工智能产品设计之前，首先需要了解人工智能产品的特性。传统的产品是指能够在行业市场中，被人们使用、消费并且能满足人们需求的任何事物，包括有形的物品和无形的服务。\n\
    传统产品的特性包括以下 3 点。\n\n- (1) 商业性：即产品需要提供给市场，以服务用户。\n\n- (2) 功能性：即产品能够被使用和消费，满足人们的某种需求。\n\
    \n- (3) 稳定性：即产品具有可量产、可复制的特性。\n\n而人工智能产品是指使用人工智能技术开发，同时具备感知、学习、分析、决策和执行能力的产品。人工智能产品除了具备传统产品的\
    \ 3 点特性外，还具备智能性，即基于人工智能技术，人工智能产品能自主处理信息并做出决策，实现相应功能以满足用户需求。\n\n### 2.2 人工智能产品设计流程\n\
    \n了解了人工智能产品的特性后，我们该如何进行人工智能产品的设计呢？接下来介绍人工智能产品设计流程。\n\n人工智能产品设计是指针对人工智能产品的架构和实施等过程进行设计，是产品实现商业化之前的一系列准备步骤。人工智能产品设计流程通常包括需求管理、功能设计、原型设计以及研发实施\
    \ 4 个阶段。\n\n### 2.2.1 需求管理\n\n需求管理通常被称为产品设计的“零阶段”，需求指的是该产品的设计目的。这个阶段是对产品的应用情况进行判断，包括技术发展和市场目标评估。该阶段通常包含需求获取、需求分析、需求表述和需求验证\
    \ 4 个工作任务。\n\n### 2.2.2 功能设计\n\n功能设计介于需求管理和原型设计之间，其输出结果是产品概念与产品功能结构的定义。功能设计阶段需要明确产品功能的类型，罗列并分解产品功能，最后将产品功能有机结合，形成功能结构图。\n\
    \n产品功能的类型一般可以按照用户的使用需求，分为基础功能、亮点功能、发展功能和非需求功能 4 种。\n\n- 1. 基础功能\n\n基础功能指的是产品为了满足用户主要需求而必须拥有的功能。例如，搜索引擎类型的产品，其基础功能是搜索功能；博客类型的产品，其基础功能是消息发布功能。\n\
    \n- 2. 亮点功能\n\n亮点功能指的是在基础功能的基础上，侧重于满足用户的体验需求，给用户带来独特的体验感，让产品在众多竞品中脱颖而出的功能。例如，在搜索引擎类型的产品中，百度公司的搜索引擎使用基于字词结合的信息处理方式，解决了计算机对于中文信息的理解问题。\n"
  mdcn: "\n微信等方式获取用户的需求。\n\n- 问卷调查法是一种能够在短时间内收集大量用户需求信息的需求获取方法。该方法主要通过互联网渠道，设计、发布需求问卷并让用户填写，然后通过统计用户反馈信息、量化数据等方式获取用户需求。\n\
    \n- 使用测试法是指在用户使用产品的过程中，通过观察用户遇到的问题，根据用户实际使用产品的行为来获取用户的实际使用需求。相比于用户访谈法与问卷调查法，使用测试法的操作难度更高，但获取到的需求更贴近用户的真实想法。\n\
    \n- 数据分析法指的是通过分析大量用户的真实数据，发现数据的特点，挖掘数据背后的用户需求的方法。如分析大量用户所欣赏的电影的数据，挖掘得到用户对于电影类型、时长等方面的偏好和需求。\n\
    \n### 1.2.2 需求分析\n\n需求分析主要是将获取到的大量信息进行简化和筛选，目的是获取用户真实的需求。\n人工智能产品的需求分析方法，继承与发展了传统产品的需求分析方法。但从本质上来说，其分析方法同传统产品的并无二致，都是为了不断提升用户体验及效率。目前，人工智能产品在某些细分领域的功能与作用日益凸显，但在更加复杂的社会环境中，人工智能产品即便拥有再强大的功能，也可能无法独当一面。因此，在面对复杂场景的情况下，只有通过正确的方法积极探索并分析需求，研发人员才能发现更有利的切入点，所研发的产品才能产生更大的效益。\n\
    \n### 1.2.3 需求表述\n\n人工智能产品需求分析的结果可以视作用户对于产品较为真实的需求，而这些需求需要以可视化的形式进行表述，进而传达给人工智能产品的开发者，用以进行产品的设计和开发、制作。\n\
    常见的需求表述形式以文档为主。如图 1-1 所示，从商业运用的角度来看，需求文档可分为产品前景文档、用户需求文档和产品规格说明文档 3 种类型。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_12_0.png)\n\
    \n图 1-1 需求文档的类型\n\n其中，产品前景文档主要围绕业务需求展开，其内容涉及市场分析、销售策略、盈利预测等。\n产品前景文档通常是供决策层讨论的演示文档，一般比较简短、精炼，没有产品细节。\n\
    用户需求文档主要围绕用户需求展开，主要描述在理想情形下，产品的使用方式以及需要提供给用户的界面。\n产品规格说明文档主要围绕系统需求展开，该文档在用户需求文档的基础上，增加了用户对产品的非功能性需求描述。非功能性需求对产品的设计和实现提出了限制，非功能性需求如产品的性能、质量、外观等。\n\
    \n### 1.2.4 需求验证\n\n需求验证的目的是尽可能地保证需求文档真实、有效地描述需求，以及能够有效地将需求传达给开发者。需求文档需要按照以下两个标准进行质量验证。\n\
    \n- 文档内的每条需求都真实、准确地反映了用户的意图。文档记录的需求集在整体上具有完整性和一致性。\n- 文档的内容具有可读性和可修改性。\n\n为了保证满足以上两个标准，在将需求文档传递给相关人员之前，需要对其进行严格的验证，保证其真实且准确。\n\
    \n## 1.3 需求文档的撰写\n\n需求文档是产品需求主要的直观表述形式。在撰写需求文档的过程中，需要结合实际产品的类型、用户的意愿以及文档撰写人员的分析角度等因素对需求文档进行调整，因此需求文档的内容和格式并没有统一标准。但无论是以哪个角度进行分析，在需求文档中都应有\
    \ 3 点核心内容，分别为产品需求、产品目标和产品功能。接下来进一步介绍这 3 点核心内容。\n\n### 1.3.1 产品需求\n\n在人工智能产品的需求分析过程中，常用\
    \ 5W2H 分析法进行需求分析。\n\n5W2H 分析法也叫七何分析法，是一种帮助产品开发人员更好地理解用户需求的思维方法。如图 1-2 所示，5W2H\
    \ 分析法表示 5 个以 W 开头的英文单词和 2 个以 H 开头的英文单词和词组。5W 是指 Who（人员）、When（时间）、Where（地点）、Why（原因）和\
    \ What（对象），2H 是指 How（方法）和 How much（成本）。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_13_0.png)\n\
    \n图 1-2 5W2H 分析法示意\n\n5W2H 分析法主要从 7 个方向对产品需求进行设问，继而发现解决问题的线索，寻求创新和开发项目的思路，并进一步构思、设计产品，其具体的思考方向及思考内容如表\
    \ 1-2 所示。\n\n表 1-2 5W2H分析法的思考方向及思考内容\n\n| 思考方向 | 思考内容 |\n|---|---|\n| 原因（ Why\
    \ ） | 主要目的：了解为什么需要完成目标 常见问题：为何在这个时候？为何是这个问题？为何必须在这个时间、日期才能解决问题？...... |\n| 对象（\
    \ What ） | 主要目的：了解需要完成哪些事情 常见问题：什么是解决问题的必要条件？什么是解决问题的助力或者阻力？什么是解决问题的挑战？......\
    \ |\n| 人员（ Who ） | 主要目的：说明整个业务流程中所有涉及的相关人员 常见问题：谁与此问题最相关？谁可能解决此问题？...... |\n|\
    \ 时间（ When ） | 主要目的：说明会在什么时间完成目标 常见问题：问题发生的时间、时段、期限是什么？解决问题的时间、时段、期限是什么？......\
    \ |\n| 地点（ Where ） | 主要目的：说明会在什么地点完成目标 常见问题：问题发生在哪个地点？问题覆盖的范畴有多大？解决问题的着力点在何处？......\
    \ |\n| 方法（ How ） | 主要目的：说明如何完成目标 常见问题：事情发生的经过是什么？事情发生的频率是什么？环境改变，事情本身如何变化？花多少时间才能解决问题？......\
    \ |\n| 成本（ How much ） | 主要目的：说明完成目标所需要花费的成本 常见问题：指标是什么？成本是多少？销售量是多少？...... |\n\
    \n如果现行的做法或产品已经经过这 7 个方向的审核和验证，便可认为这一做法或产品可取。如果对这 7 个方向的思考不能得到令人满意的答案，则表示该做法或产品还有改进余地。\n\
    \n### 1.3.2 产品目标\n\n人工智能产品的需求分析活动会产生针对需求的产品目标，它指定人工智能产品开发需要完成的任务。\n\n人工智能产品的主要目标是解决实际生活场景中的问题。明确人工智能产品的目标能够为产品开发人员提供清晰的设计和开发方向。\n\
    \n产品目标主要用于将产品的特点、应用场景和工作任务等信息告知开发人员。因此，需要针对产品需求进行提炼和总结，形成产品目标。产品目标的描述可参考以下思路：一种具有什么特点、能够用于什么场景的产品，其目标是处理什么任务。\n\
    \n### 1.3.3 产品功能\n\n基于产品需求和产品目标，可以对产品功能的实现流程进行初步设计。需求文档中的产品功能部分主要结合产品的目标和需求，概括性地提出设想的产品主要功能和开发思路。产品功能的描述可参考以下思路：基于什么目标，首先完成哪些工作步骤，然后完成哪些工作步骤，最后完成哪些工作步骤，以实现该目标。\n\
    \n将产品需求、产品目标、产品功能 3 个部分的内容整合在一起，即需求文档的核心内容。\n\n因为产品的开发是通过一个个的项目完成的，所以在实际描述产品功能时，也常常将产品分割为项目进行描述。因此，产品需求文档撰写过程中涉及的需求分析、目标明确、功能描述的方法，也同样适用于项目需求文档的撰写。\n\
    \n## 1.4 实施思路\n\n基于项目描述与知识准备内容的学习，我们已经基本了解了人工智能产品的需求分析。下面结合实际需求，使用 5W2H 分析法对“新零售”场景下的商品检测项目进行需求分析，并撰写该项目的需求文档，使读者进一步掌握具体的人工智能产品的需求分析方法。以下是本项目实施的步骤。\n\
    \n- （1）使用 5W2H 分析法分析需求。\n- （2）明确产品目标。\n- （3）描述产品功能。\n\n## 1.5 实施步骤\n\n### 步骤 1：使用\
    \ 5W2H 分析法分析需求\n\n接下来将使用 5W2H 分析法对商品检测项目进行具体的需求分析，明确本项目的开发需求。\n\n- （1）首先需要回答原因（\
    \ Why ）方面的问题，为什么要研发这个项目？为什么要解决这个问题？\n\n客户的选择对于零售业来说是非常重要的，要想商品获得足够的关注，就要使商品在货架上得到充分的曝光。因此，商品检测就成了解决这个问题的关键。\n\
    \n- （2）接下来从对象（ What ）、时间（ When ），地点（ Where ）3 个方面开展设问，对商品检测项目进行需求分析，具体的分析如下。\n\
    \n- ① 什么是商品检测？\n\n商品检测指的是通过某种方法或技术，实现对百货公司、大卖场、商超等销售场所的各类商品进行识别、检测，协助工作人员完善商品管理和销售的一种方式。一般情况下，一个商品检测模型，可支持识别商品基本信息，如陈列顺序、层数、场景，统计排面数量和占比，根据项目需求的不同，商品检测模型的对应功能也有所不同。\n\
    \n- ② 什么时候需要商品检测？\n\n零售业的商家需要及时应对市场需求的变化，可通过将商品充分陈列以提高用户的购买率和体验感。而商品检测是解决货架商品缺失、摆放错位等问题的重要方法，因此商品检测需要频繁且规律地进行。\n\
    \n- ③ 哪里要用到商品检测？\n\n如图 1-3 所示，商品检测适用于普通货架 / 货柜、无人货柜、智能结算台、地堆商品陈列等场景的商品陈列规范核查，也适用于堆箱、堆头、地龙等场景的商品陈列规范核查。其支持识别商品基本信息，支持可视化商品的数量和估算商品占地面积。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_16_0.png)\n![](img/54d7dd15f0857a11a3f298484cc566c5_16_1.png)\n\
    ![](img/54d7dd15f0857a11a3f298484cc566c5_16_2.png)\n![](img/54d7dd15f0857a11a3f298484cc566c5_16_3.png)\n\
    \n图 1-3 商品检测应用场景一览\n\n- （3）最后从人员（Who）、方法（How）以及成本（How much）3 个方面入手，探讨商品检测项目的可行性，具体分析如下。\n\
    \n- ① 对于人员（Who）问题，可以从项目涉及的使用人员和开发人员两个方面进行分析。商品检测产品的使用人员为商铺员工，货架巡检工作往往是穿插在商铺员工的主要工作中进行的。因此商品检测产品除了需要具备一定的识别准确性，还需要具备操作简便、易使用的特点，降低商铺员工的使用门槛。商品检测产品具备物体识别的功能，因此需要开发人员具备人工智能算法知识。在没有人工智能算法工程师的情况下，可以通过开放的人工智能开发平台（该平台可以提供大量的训练数据）调用对应的模型进行训练，从而得到能够准确识别物体的模型。\n\
    \n- ② 商品检测产品可以基于物体检测任务的方法（How）找出所有图像中的目标，即商品的类别与位置，实现对货架上的商品进行检测的任务。\n\n- ③ 至于成本（How\
    \ much）的问题，也是开发者和商家考虑的重要因素之一。在使用商品检测产品进行商品检测时，只需要使用手机、货架等设备的摄像头对商品的陈列位置进行拍摄，即可识别货架摆放情况，节省人工成本的同时，避免了货架信息收集难和反馈时间过长的问题。根据以上分析，即可整理出商品检测产品的需求思考方向和思考内容，如表\
    \ 1-3 所示。\n\n表 1-3 商品检测产品的需求思考方向和思考内容\n\n| 思考方向 | 思考内容 |\n|---|---|\n| 原因（Why）\
    \ | 客户的选择对于零售业来说是非常重要的，要想商品获得足够的关注，就要使商品在货架上得到充分的曝光。因此，商品检测就成了解决这个问题的关键 |\n| 对象（What）\
    \ | 商品检测产品需要能够识别商品基本信息，如陈列顺序、层数、场景，统计排面数量和占比 |\n| 时间（When） | 零售业的商家需要及时应对市场需求的变化，可通过将商品充分陈列以提高用户的购买率和体验感。而商品检测是解决货架商品缺失、摆放错位等问题的重要方法，因此商品检测需要频繁且规律地进行\
    \ |\n| 地点（Where） | 商品检测适用于普通货架 / 货柜、无人货柜、智能结算台、地堆商品陈列等场景的商品陈列规范核查，也适用于堆箱、堆头、地龙等场景的商品陈列规范核查。其支持识别商品基本信息，支持可视化商品数量和估算商品占地面积\
    \ |\n| 人员（Who） | 项目涉及的使用人员为商铺员工，涉及的开发人员需要具备人工智能算法知识。在没有人工智能算法工程师的情况下，可以通过开放的人工智能开发平台（该平台可以提供大量的训练数据）调用对应的模型进行训练，从而得到能够准确识别物体的模型\
    \ |\n| 方法（How） | 商品检测产品可以找出图像中目标的信息，包括商品的类别与位置，实现对货架上的商品进行检测的任务 |\n| 成本（How much）\
    \ | 在使用商品检测产品进行商品检测时，只需要使用手机、货柜等设备的摄像头对商品的陈列位置进行拍摄，即可识别货架摆放情况，节省人工成本的同时，避免了货架信息收集难和反馈时间过长的问题\
    \ |\n\n### 步骤 2：明确产品目标\n\n根据使用 5W2H 分析法所得到的需求，可以提炼出产品目标。产品目标的描述主要是回答文档查阅者关于产品“有什么特点？在什么场景下能处理什么问题？”的疑问。商品检测产品的目标是以一种脱离人工的、高度智能化的、准确度高并且有实用价值的方法在零售场景下对商品进行自动检测，以规范货架、货柜、智能结算台等场景的商品陈列方式。\n\
    \n### 步骤 3：描述产品功能\n\n基于需求和产品目标，可以对商品检测产品功能的实现流程进行初步设计。\n\n产品功能的描述，主要是针对文档查阅者关于产品“怎么实现”的疑问，提出初步的解决思路。商品检测产品的主要功能是基于物体检测任务识别商品：首先准备大量的实际货架图像数据，接着通过算法工程师或者人工智能开发平台，如百度\
    \ EasyDL 零门槛 AI 开发平台，训练得到一个识别精准度较高的商品检测模型，最后使用手机或货柜等设备的摄像头对商品的陈列位置进行拍摄，找出图像中我们感兴趣的所有目标商品，确定它们的类别和位置，实现对货架上商品的检测。\n\
    \n将步骤 1 的产品需求、步骤 2 的产品目标和步骤 3 的产品功能进行整合，即得到需求文档的核心内容。\n\n## 知识拓展\n\n知识准备部分已经详细介绍了\
    \ 5W2H 分析法，接下来介绍另一种在企业管理和技术开发活动中广泛应用的需求分析方法——6W2H 分析法。\n\n6W2H 分析法又叫八何分析法，是在 5W2H\
    \ 分析法的基础上增加了一项 Which（选择某件事或某一个方案）。\n\n6W2H 分析法对于设定有效的目标、分析客户需求、制订工作计划等非常实用，还能用于提高效率，使工作有效进行。该方法包含选择（Which）、原因（Why）、对象（What）、人员（Who）、时间（When）、地点（Where）、方法（How）和成本（How\
    \ much）共 8 部分，如图 1-4 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_18_0.png)\n\
    \n图 1-4 6W2H 分析法示意\n\n无论是 5W2H 分析法还是 6W2H 分析法，都是通用的需求分析方法，这些方法被广泛应用于企业管理和技术开发活动中。虽然分析方法的类型有许多，但究其本质，都是为工作或决策提供思考框架或路线，有助于提高工作效率、提高工作的条理性。\n\
    \n## 课后实训\n\n- (1) 从商业运用的角度理解，需求不包括以下哪一项？（  ）【单选题】\n  - A. 业务需求\n  - B. 功能需求\n\
    \  - C. 用户需求\n  - D. 系统需求\n\n- (2) 需求获取的方法不包括以下哪一项？（  ）【多选题】\n  - A. 用户访谈法\n \
    \ - B. 问卷调查法\n  - C. 数据分析法\n  - D. 5W2H 分析法\n\n- (3) 以下哪一项不属于需求管理的过程？（  ）【单选题】\n\
    \  - A. 需求获取\n  - B. 需求分析\n  - C. 需求表述\n  - D. 需求原型设计\n\n- (4) 需求验证的标准不包括以下哪一项？（\
    \  ）【单选题】\n  - A. 准确性\n  - B. 非功能性\n  - C. 可读性\n  - D. 完整性\n\n- (5) 5W2H 分析法不包括以下哪一项要素？（\
    \  ）【单选题】\n  - A. 原因（Why）\n  - B. 对象（What）\n  - C. 选择（Which）\n  - D. 方法（How）\n\
    \n## 项目 2 设计人工智能产品\n\n随着人工智能技术的进步，人工智能产品逐步从简单地合成数据、提供有用的见解发展到能够独立行动、自主学习新任务。人工智能产品的更新和进步正在逐渐接近人们目前对于人工智能产品的期望的上限。如今对于人工智能产品的设计，不仅需要确保产品功能确实可行，还需要确保产品功能符合用户需求，可解决用户的实际问题。\n\
    \n- (1) 了解人工智能产品发展趋势。\n- (2) 熟悉人工智能产品设计流程。\n- (3) 掌握人工智能产品功能结构图的绘制方法。\n- (4) 能够根据业务需求完成产品功能设计。\n\
    \n### 项目描述\n\n本项目将以人工智能产品的特性作为切入点，介绍人工智能产品的设计流程。人工智能产品的设计流程包括需求管理、功能设计、原型设计、研发实施\
    \ 4 个阶段。本项目将重点介绍功能设计阶段中功能结构图的绘制方法，最后通过商品检测项目帮助读者掌握人工智能产品的功能设计方法。\n\n### 知识准备\n\
    \n### 2.1 人工智能产品的特性\n\n在进行人工智能产品设计之前，首先需要了解人工智能产品的特性。传统的产品是指能够在行业市场中，被人们使用、消费并且能满足人们需求的任何事物，包括有形的物品和无形的服务。\n\
    传统产品的特性包括以下 3 点。\n\n- (1) 商业性：即产品需要提供给市场，以服务用户。\n\n- (2) 功能性：即产品能够被使用和消费，满足人们的某种需求。\n\
    \n- (3) 稳定性：即产品具有可量产、可复制的特性。\n\n而人工智能产品是指使用人工智能技术开发，同时具备感知、学习、分析、决策和执行能力的产品。人工智能产品除了具备传统产品的\
    \ 3 点特性外，还具备智能性，即基于人工智能技术，人工智能产品能自主处理信息并做出决策，实现相应功能以满足用户需求。\n\n### 2.2 人工智能产品设计流程\n\
    \n了解了人工智能产品的特性后，我们该如何进行人工智能产品的设计呢？接下来介绍人工智能产品设计流程。\n\n人工智能产品设计是指针对人工智能产品的架构和实施等过程进行设计，是产品实现商业化之前的一系列准备步骤。人工智能产品设计流程通常包括需求管理、功能设计、原型设计以及研发实施\
    \ 4 个阶段。\n\n### 2.2.1 需求管理\n\n需求管理通常被称为产品设计的“零阶段”，需求指的是该产品的设计目的。这个阶段是对产品的应用情况进行判断，包括技术发展和市场目标评估。该阶段通常包含需求获取、需求分析、需求表述和需求验证\
    \ 4 个工作任务。\n\n### 2.2.2 功能设计\n\n功能设计介于需求管理和原型设计之间，其输出结果是产品概念与产品功能结构的定义。功能设计阶段需要明确产品功能的类型，罗列并分解产品功能，最后将产品功能有机结合，形成功能结构图。\n\
    \n产品功能的类型一般可以按照用户的使用需求，分为基础功能、亮点功能、发展功能和非需求功能 4 种。\n\n- 1. 基础功能\n\n基础功能指的是产品为了满足用户主要需求而必须拥有的功能。例如，搜索引擎类型的产品，其基础功能是搜索功能；博客类型的产品，其基础功能是消息发布功能。\n\
    \n- 2. 亮点功能\n\n亮点功能指的是在基础功能的基础上，侧重于满足用户的体验需求，给用户带来独特的体验感，让产品在众多竞品中脱颖而出的功能。例如，在搜索引擎类型的产品中，百度公司的搜索引擎使用基于字词结合的信息处理方式，解决了计算机对于中文信息的理解问题。\n"
