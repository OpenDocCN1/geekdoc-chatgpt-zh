    \ pip 安装、conda 安装、Docker 安装，通过源码编译安装 4 种方式中的任意一种方式。\n\n本项目使用 pip 方式在 Windows 系统和\
    \ Linux 的 Ubuntu 系统上安装 PaddlePaddle。pip 是 Python 中的标准库管理器，其允许用户安装和管理不属于 Python\
