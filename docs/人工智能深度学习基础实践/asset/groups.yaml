    ① 误标注。

    上述所提及的相似 SKU 常出现误标注的情况，尤其是同款商品不同规格、不同口味、不同包装的相似 SKU，经常被错误地标注为同一类商品。


    ② 漏标注。


    a. 商品出现不同角度时导致的漏标注。


    如图 3-13 所示，出现其他角度的商品时，也应该对其进行标注，不应只标注正面的商品。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_41_0.png)


    图 3-13 不同角度的商品漏标注示例


    b. 粗心导致的漏标注。


    如图 3-14 所示，需认真观察实景图中出现的所有商品，避免因粗心漏掉对目标商品的标注。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_41_1.png)


    图 3-14 粗心导致的漏标注示例


    c. 对遮挡情况判断错误导致的漏标注。


    因对被标注物被遮挡时的标注方法不熟悉或者判断失误，常常会导致漏标注。图 3-15 所示为对遮挡判断错误而导致的漏标注示例，图中虽有部分商品被遮挡，但是仍然保留了该商品的识别特征，因此应该对该商品进行标注。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_41_2.png)


    图 3-15 对遮挡情况判断错误导致的漏标注示例'
