    \n- （1）了解常用数据标注工具与平台。\n- （2）熟悉常见领域数据标注的常见任务。\n- （3）能够针对应用场景进行数据标注。\n\n### 项目描述\n\
    \n数据标注的准确性决定了人工智能算法的有效性，因此，数据标注工作的开展不仅是选择技术、工具和平台，更需要有质量标准的保障。本项目将简单介绍常见的数据标注工具与平台，并带领读者熟悉数据标注的格式与质量标准，最后基于\
    \ EasyData 开展图像分类、物体检测、图像分割、文本分类和短文本相似度数据集的标注实操，以帮助读者掌握数据标注的方法。\n\n### 知识准备\n\n\
    ### 6.1 数据标注工具与平台\n\n简单易用、灵活高效的标注工具，能够帮助数据标注人员更好地开展工作，那么数据标注工具与平台的选择，自然是进行数据标注的第一步。接下来将简单介绍图像数据、文本数据以及音频数据的标注工具，并介绍一些常用的数据标注平台。\n\
    \n#### 6.1.1 图像数据标注工具\n\n“工欲善其事，必先利其器”，合适的图像数据标注工具能够帮助数据标注人员更好地进行图像标注。以下为一些常见的图像数据标注工具。\n\
    \n- 1. EasyData\n\nEasyData 是百度公司提供的一种优秀的数据处理工具，其使用门槛低并且操作方便。EasyData 支持对图像、文本、音频和视频等多种类型的数据进行标注。在图像方面，它支持图像分类、物体检测、语义分割\
    \ 3 类数据标注。\n\n- 2. LabelImg\n\nLabelImg 是一种可视化的图像数据标注工具，主要用于物体检测。LabelImg 采用 Python\
    \ 编写而成，并配置有图形化界面。LabelImg 支持两种标注格式，即 VOC 格式和 YOLO 格式。若使用 VOC 格式，则其标注信息存储于 XML\
    \ 文件中；若使用 YOLO 格式，则其标注信息存储于 TXT 文件中。\n\n- 3. LabelMe\n\nLabelMe 是一种用于在线图像数据标注的标注工具，主要用于物体检测和语义分割。LabelMe\
    \ 支持将数据导出为 VOC 格式与 COCO 格式。另外，LabelMe 支持通过矩形框、多边形、圆、线、点等组件进行图像标注，同时也支持视频标注。\n\n\
    - 4. CVAT\n\nCVAT 是一种支持图像与视频数据标注的计算机视觉标注工具，它支持图像分类、物体检测、语义分割、实例分割 4 类数据标注。\n\n\
    - 5. VoTT\n\nVoTT 是微软公司发布的视觉数据标注工具。它支持图像与视频数据标注，同时支持导出用于 CNTK、TensorFlow 和 YOLO\
    \ 等进行训练的标注数据。\n\n在计算机视觉领域，除了以上 5 种图像数据标注工具外，还有许多优秀的开源数据标注工具，包括 IAT、Yolo_mark、PixelAnnotationTool\
    \ 等。本项目将采用百度公司的 EasyData 完成各项标注任务。\n\n#### 6.1.2 文本数据标注工具\n\n用于文本数据标注的工具主要有 BRAT、DeepDive、IEPY\
    \ 等，以下是这 3 种文本数据标注工具的介绍。\n\n- 1. BRAT\n\nBRAT 是一种基于 Web 的文本数据标注工具，主要用于对文本进行结构化标注，其主要的特点是在标注实体的同时可以进行关系的标注。用\
    \ BRAT 生成的标注结果能够对无结构的原始文本进行结构化，以供计算机处理。\n"
