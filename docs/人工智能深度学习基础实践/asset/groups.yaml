    京东众智是京东公司旗下的人工智能领域的数据服务平台，该平台致力于为业界提供领先的人工智能数据采集和标注的多元化解决方案，如图 4-2 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_63_0.png)


    图 4-2 京东众智


    在数据采集方面，京东众智可精确、高效地采集图像、语音、文本等数据，适用于各种复杂场景，可为客户提供高质量的源数据。除此之外，京东众智还是人工智能数据标注处理平台，可以完成数据清洗、提取以及特殊信息标注等操作。


    ### 4.2 PaddlePaddle 内置数据集


    百度 PaddlePaddle（飞桨）数据库中内置了许多用于计算机视觉模型和自然语言处理模型训练的数据集，同时为开发者提供了方便、快捷的调用接口。这些数据集中的数据已经经过清洗，开发者只需要通过调用相关接口，就可以快速实现数据集的训练集和测试集的加载并将其用于模型训练。目前在
    PaddlePaddle 数据库中内置的数据集共有 15 个。


    其中用于计算机视觉领域的数据集有 “DatasetFolder” “ImageFolder” “MNIST” “FashionMNIST” “Flowers”
    “Cifar10” “Cifar100” 以及 “VOC2012”，共 8 个数据集；用于自然语言处理领域的数据集有 “Conll05st” “Imdb”
    “Imikolov” “Movielens” “UCIHousing” “WMT14” “WMT16”，共 7 个数据集。通过调用相关接口，即可快速实现数据集的加载和调用。同时可调用数据处理方法，对数据进行处理应用。


    接下来介绍本项目实施中将用到的 MNIST 数据集和 UCIHousing 数据集。


    在本项目的开源数据集部分已经介绍过，MNIST 数据集是由 250 个不同的人从 0 到 9 的手写数字整合而成的图像数据集，而 PaddlePaddle
    中内置的 MNIST 数据集是经过处理后得到的，PaddlePaddle 提供的数据集有 “train” 和 “test” 两种模式，分别对应加载训练集和加载测试集。在本项目实施中，主要加载
    MNIST 的训练集，通过调用 PaddlePaddle 中集成的相关接口即可实现数据集的加载。加载完成的数据集可直接用于深度学习模型的训练，最终实现输入手写数字图像并返回预测结果的功能。


    UCIHousing 数据集是用于预测波士顿房价的数据集，常作为深度学习初学者在入门自然语言处理时进行房价预测使用的数据集。原始数据集中包含 13 个影响房价的因素数据和对应房屋的价格数据，在自然语言处理的模型中，需要将文本数据进行优化处理后才能输入模型进行训练。而内置在
    PaddlePaddle 中的数据集都已经过了处理，因此不需要再进行数据处理等操作。


