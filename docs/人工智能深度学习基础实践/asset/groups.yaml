    \ 单品图”一栏中的“上传图片”按钮，然后选择所采集的单品图上传进行补充即可。确认信息无误后，单击“创建 SKU”按钮即可创建 SKU。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_46_1.png)\n\
