    \ - C. 可用交互进行关联\n  - D. 能够展示产品功能、界面元素、使用流程\n\n## 项目 3 人工智能开发平台应用\n\n人工智能开发的基本流程通常包括需求分析、数据准备、模型训练、模型应用\
