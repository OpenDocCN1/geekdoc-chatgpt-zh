    ## 2. DeepDive


    DeepDive 是一种从暗数据（ dark data ）中提取有价值信息的系统，暗数据指的是隐藏在文本、表格、图形和图像中的大量数据，由于这类数据缺乏相应结构，现有软件基本无法处理这些数据。DeepDive
    能够从非结构化信息（文本文档）中创建结构化数据（ SQL 表），并将这些数据与现有的结构化数据库集成。DeepDive 可用于提取实体之间复杂的关系，并可对涉及这些实体的事实进行推断。


    ## 3. IEPY


    IEPY 是一种开源的信息提取工具，在 GitHub 可以下载其 Python 开发源码。IEPY 的优点是可对大型数据集进行关于关系提取的语料标注操作。


