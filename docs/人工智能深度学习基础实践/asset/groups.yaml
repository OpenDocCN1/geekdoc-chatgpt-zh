    百度 AI 文本审核和图像审核技术基于深度学习的智能内容审核方案，能够准确过滤图像和视频中的政治敏感、恶意推广、不良场景等违规内容，也能从美观、清晰等维度对图像进行筛选，紧贴业务需求，从而可释放审核人力资源。


