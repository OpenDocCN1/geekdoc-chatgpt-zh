    # 4. 数据分割


    为了使构建的模型能够训练新的数据，需要对可用的数据进行数据分割操作，将其分割为训练集和测试集。


    # 7.2.2 模型构建


    在完成数据操作后，便可以进行模型的构建。可根据目标变量的数据类型建立机器学习模型。首先选取合适的机器学习算法，随后需要对机器学习算法的参数进行调优。算法参数将直接影响学习过程和预测性能。


    # 7.2.3 机器学习任务实现


    完成模型构建以后，就可以使用模型完成机器学习任务了。常见的机器学习任务包括分类任务和回归任务。


    分类任务针对的是离散数值型的样本，在输入给定样本后可以输出所属的类别。分类任务是机器学习任务中一类常见的任务，常见的分类任务有垃圾邮件检测、手写数字识别和花卉分类等。


    回归任务针对的是连续数值型的样本，使用回归，可以在给定一个输入时预测出一个数值。在一元线性回归分析中，包括一个自变量和一个因变量，且二者的关系可用一条直线近似表示。如果回归分析中包括两个或两个以上的自变量，且因变量和自变量之间是线性关系，则称为多元线性回归分析。


    输出预测的结果后，使用相关指标进行算法性能的评判，便完成了一个完整的机器学习训练流程。


    # 7.3 常用算法


    在了解完机器学习的训练流程后，我们对如何搭建机器学习模型所需要的步骤已经有所了解。接下来将更加深入地介绍机器学习中一些常用的算法。


    # 7.3.1 线性回归


    线性回归是利用称为线性回归方程的最小二乘函数，对一个或多个自变量和因变量之间的关系进行建模的一种回归分析。线性回归的假设函数 $h_\theta$ 计算公式如下。


    $h_\theta(x)=\theta_0+\theta_1x$


    其中 $x$ 是自变量或者输入变量，线性回归的目标是选择出一组最小化损失函数的模型参数 $\theta_0$ 和 $\theta_1$。


    在实际应用中，通常不会从零开始实现机器学习算法，而是调用各种已经成熟、完备的机器学习库的函数来实现。常用的机器学习库有 scikit-learn。


    在 scikit-learn 库中可以直接调用封装好的函数实现线性回归，代码如下。'
  - '[PAGE 99]


    ```

    from sklearn.linear_model import LinearRegression # 导入相关库

    lr = LinearRegression() # 调用线性回归模型

    lr.fit(X, y) # 训练模型

    ```


    线性回归的优点是结果易于理解，计算不复杂；缺点则是对非线性的数据拟合效果不好，且当特征冗余，即如果存在多重共线性，线性回归结果趋于不稳定。


    # 7.3.2 逻辑回归


    逻辑回归其实是引入了非线性变化的线性回归模型，常被用于分类问题。逻辑回归是一种对数概率模型。逻辑回归是用来计算实例属于类别 1 和属于类别 0 的概率的。当因变量属于二元变量时，应该使用逻辑回归。逻辑回归的假设函数如下。


    $$h_{\theta}(x) = g(\theta^T X)$$


    其中 \( X \) 代表特征向量，\( g \) 代表 Sigmoid 函数 \( g(z) = \frac{1}{1+e^{-z}} \)。


    \( h_{\theta}(x) \) 的作用是给定输入变量，根据选择的参数计算输出变量属于类别 1 的概率。调用 scikit-learn 库中封装的函数实现逻辑回归的代码如下。


    ```

    from sklearn.linear_model import LogisticRegression # 导入库

    lr = LogisticRegression() # 调用逻辑回归模型

    lr.fit(X, y) # 训练模型

    ```


    逻辑回归的优点是使用较为容易，但当特征空间较大时，其性能开始下降。


    # 7.3.3 决策树


    决策树是一种监督学习算法，可以用于分类和回归。决策树是一种树形结构，其中每个内部节点表示模型对一条数据的一个属性归属于哪个类别的判断，每个分支代表一个判断结果的输出，每个叶节点代表一种分类结果。调用
    scikit-learn 库中封装的函数实现决策树的代码如下。


    ```

    from sklearn import tree # 导入库

    clf = tree.DecisionTreeRegressor() # 调用决策树模型

    clf.fit(X, y) # 训练模型

    ```


    决策树的优点在于计算简单、易于理解、可解释性强，能够处理不相关的特征。


    # 7.3.4 随机森林


    随机森林是一种由很多棵决策树构成的集成算法，决策树之间没有关系。当执行一个分类任务时，输入一个新的样本，森林中的每棵决策树都会对样本进行单独的判断和分类，每棵决策树都会得到自己的分类结果。当随机森林采用投票法时，会在决策树给出的分类中选取被预测最多的一类作为随机森林的输出结果。调用
    scikit-learn 库中封装的函数实现随机森林的代码如下。'
