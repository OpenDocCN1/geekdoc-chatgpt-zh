    \ SKU 的详细信息；单击“编辑”按钮，即可补充上传 SKU 包装图和 SKU 单品图。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_47_0.png)\n\
    \n图 3-26 所创建的 SKU 列表\n\n(12) 按照上述步骤，创建其他所需的 SKU，即“可乐细长罐__可口可乐__330mL”和“可乐__可口可乐__680mL”，如图\
    \ 3-27 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_47_1.png)\n\n图 3-27 SKU创建完成后的列表\n\
    \n## 步骤 2：上传数据并标注\n\n商品检测模型和所需的 SKU 都创建完成后，接下来可以按照以下步骤上传实景图并进行标注。\n\n（1）如图 3-28\
    \ 所示，单击左侧导航栏的“实景图集库”标签，接着单击“创建实景图集”按钮，进入信息填写界面。\n\n（2）如图 3-29 所示，新建实景图集需要填写以下两项。\n\
    \n- 实景图集名称：可适当填入 SKU 细节，如原味可乐、番茄味薯片、奥运版纯牛奶等，此处输入“可乐”。\n- 选择类型：即选择实景图集的类型，需要与创建模型时选择的应用场景保持一致，上传时只上传与选择类型相同的实景图。可选项为“普通货架\
    \ / 货柜”“智能结算台”“无人零售柜”“其他”，此处选择“普通货架 / 货柜”选项。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_47_2.png)\n\
