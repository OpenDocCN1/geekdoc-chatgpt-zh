    # 6.2 数据标注常见任务


    了解完常用的数据标注工具与平台后，接下来介绍常见的数据标注任务。常见的数据标注任务包括分类标注、标框标注、区域标注、描点标注 4 种。


    # 6.2.1 分类标注


    分类标注是指从任务中的标签中选取一个或者多个并将其赋给一条数据的任务。分类标注的应用十分广泛，可以应用于计算机视觉、自然语言处理和推荐系统中。在计算机视觉数据标注任务中，取决于任务的不同，一个图像可以被标注上一个或者多个任务的标签。如图
    6-2 所示，在自然语言处理中，可以标注出语句的情感或者语句中词的词性等。此外，自然语言处理任务存在曲谱生成等音乐领域的应用，此时数据的标签类别还可能是音符等。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_85_0.png)


    # 图 6-2 文本标注中的分类标注


    # 6.2.2 标框标注


    标框标注是指在图像中选取要标注的实体，并使用方框描述其所在位置的任务。标框标注任务中包含分类标注，因为标框标注任务不仅需要标注人员找出标注实体所属的类别，更要使用方框描述实体所在的位置。标框标注一般应用于计算机视觉领域，其中常见的任务有自动驾驶、智能视频监控、工业瑕疵检测等。标框标注除了使用方框进行标注之外，还可以使用多边形框进行标注，使用多边形框一般比使用方框标注的精度更高。其中，使用多边形框进行标注时，除可能会分配一个或者多个标签之外，还有可能会涉及物体遮挡的逻辑关系，从而需要实现细线条的种类识别。标框标注示例如图
    6-3 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_85_1.png)


    # 图 6-3 标框标注'
