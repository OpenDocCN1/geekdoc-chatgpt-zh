    \n    ![](img/54d7dd15f0857a11a3f298484cc566c5_41_2.png)\n\n    图 3-15 对遮挡情况判断错误导致的漏标注示例\n\
    \n### 3.2.3 模型训练\n\n数据准备完成后，即可进行模型训练。此步骤可通过 EasyDL 深度学习模型定制平台进行。 EasyDL 平台中，所有与模型训练相关的操作都可以在网页上进行，无须编程，仅需\
    \ 5 步即可部署定制化人工智能模型，可大幅降低线下搭建训练环境、自主编写算法代码的相关成本。 EasyDL 平台提供大量免费的图形处理单元（Graphics\
    \ Processing Unit，GPU）训练资源，用于模型迭代和效果验证，可有效降低项目开发和测试成本。同时，平台可以针对零售场景专项算法进行调试和优化（简称调优），结合图像合成与增强技术提升模型泛化能力，模型准确率可达\
    \ 97% 以上，确保模型在生产环境中具有高可用性。平台还支持数据加密与隔离，为客户的数据和模型提供企业级安全保障。\n\n### 3.2.4 模型应用\n\
    \n模型训练完成后，即可进行模型应用，完成人工智能开发的最后一步。百度 EasyDL 平台提供模型效果评估报告，通过评估报告我们可以直观了解商品识别模型的\
    \ F1-score 的分布。F1-score 是商品识别模型中 SKU 的精确率和召回率的调和平均数，可以作为判断模型中各 SKU 识别效果的指标。通常情况下，当\
    \ F1-score 的值大于 85% 时，表示可满足商品计数需求；当 F1-score 的值大于 60% 时，表示可满足统计商品分销需求。\n\n若模型效果不佳，则需要进行模型优化。EasyDL\
    \ 零售行业版已专门根据零售业务场景中的数据调优了模型算法。所以优化 EasyDL 零售行业版所训练的模型时，不需要理解和调优模型算法中的各种参数，仅需要优化训练数据即可。优化\
    \ EasyDL 零售行业版的商品检测模型前，需要正确采集实景图和 SKU 单品图，并正确标注实景图，接着可以按照以下 5 个步骤优化商品检测模型。\n\n\
    - (1) 补充实景图：使用 EasyDL 零售行业版提供的模型优化工具回流补充实景图。\n- (2) 补充 SKU 单品图：上传识别得不好的 SKU 单品图的补充图。\n\
    - (3) 重新训练模型：补充好数据后用新旧数据一起重新训练模型。\n- (4) 重新发布模型：将新训练的模型版本发布为 API 后测试模型效果。\n- (5)\
    \ 重复优化：根据测试结果重复步骤（1）～（4），直到模型可商用。\n\n得到能够满足业务常见需求的模型后，即可进行模型部署，可以将模型部署至生产环境中。通过深度学习模型定制平台，我们可以调用云服务\
    \ API 获取商品检测功能，还能够将模型云服务 API 快速集成进 H5 页面中来体验模型效果。图 3-16 所示为商品检测 H5 体验界面及相关配置。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_42_0.png)\n\n图 3-16 商品检测 H5 体验界面及相关配置\n\
    \n## 3.3 实施思路\n\n基于对项目描述与知识准备内容的学习，在了解了典型人工智能开发平台的功能和业务操作流程后，我们现在应用 EasyDL 平台，尝试开发商品检测项目，以帮助读者掌握\
    \ EasyDL 零售行业版的业务操作方法。以下是本项目实施的步骤。\n\n- (1) 创建模型和 SKU。\n- （2）上传数据并标注。\n- （3）训练模型并校验。\n\
    \n## 3.4 实施步骤\n\n## 步骤 1：创建模型和 SKU\n\n在开始一个项目时，需要先通过以下步骤创建模型，确定模型名称，记录模型的功能，并初步创建\
    \ SKU。\n\n（1）登录人工智能交互式在线实训及算法校验系统，进入本项目的实验环境，如图 3-17 所示。单击“控制台”中“AI 平台实验”EasyDL\
    \ 平台的“启动”按钮，进入 EasyDL 平台。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_43_0.png)\n\
    \n图 3-17 人工智能交互式在线实训及算法校验系统界面\n\n(2) 单击“立即使用”按钮，在弹出的“选择模型类型”对话框中选择“零售行业版”选项，如图\
    \ 3-18 所示。进入登录界面，输入账号和密码。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_44_0.png)\n\
    \n图 3-18 “选择模型类型” 对话框\n\n(3) 进入零售行业版管理界面后，在左侧的导航栏中单击“我的模型”标签，再单击“创建模型”按钮，进入信息填写界面，如图\
    \ 3-19 所示。\n\n(4) 如图 3-20 所示，在“模型名称”一栏输入模型的名称。本项目主要是进行普通货架上饮料商品的检测，因此可以在“模型名称”一栏输入“饮料检测”。然后在“模型归属”一栏选择“个人”选项，在“应用场景”一栏选择“普通货架\
    \ / 货柜”选项。输入个人的邮箱地址和联系方式之后，在“功能描述”一栏输入该模型的功能，该栏需要输入多于 10 个字符但不能超过 500 个字符的内容。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_44_1.png)\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_44_2.png)\n\
    \n图 3-19 单击“我的模型”标签\n\n图 3-20 创建模型界面\n\n（5）信息填写完成后，单击“下一步”按钮即可成功创建模型。单击左侧导航栏“我的模型”标签即可查看创建的模型列表，如图\
    \ 3-21 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_45_0.png)\n\n（6）单击图 3-21\
    \ 所示界面中的“创建 SKU”，即可进入 SKU 创建界面。\n\n（7）按照提示填写信息。此处需注意，在 SKU 识别结果中，SKU 的名称是以“SKU\
    \ 名称_ 品牌名称_规格参数”的形式返回的，在填写 SKU 名称、品牌名称和规格参数时需避免这 3 项内容重复。以下是需要填写的项目。\n- SKU 名称：可适当填入\
    \ SKU 细节，如原味可乐、番茄味薯片、奥运版纯牛奶等。\n- 品牌名称：SKU 的品牌名称，如可口可乐、乐事、伊利等。\n- 规格参数：SKU 的规格，如\
    \ 330mL、500g、20 片等。\n- 商品品类：可选项为“饮品”“药品”“零食”“调味品”“日用品”和“其他”。\n- 包装类型：可选项为“瓶装”“罐装”“袋装”“盒装”和“其他”。\n\
    - 商品编号：如果自身的业务系统中有现成的 SKU 对应的商品编码，例如商品条形码，可以将其填在该文本框中，之后模型接口将支持返回该内容，用于快速匹配 SKU。\n\
    - SKU 单品图：用于商品增强合成，以改善模型效果。\n- SKU 包装图：用于标注时查看 SKU 包装，方便根据包装对相似商品进行区分，避免误标注和漏标注。图\
    \ 3-22 所示为盒装和罐装的 SKU 包装图示例。\n\n（8）因为平台上已经预置了近千个 SKU，所以绝大多数情况下用户无须再自行上传单品图。本项目可直接创建平台已预置的\
    \ SKU。如图 3-23 所示，在“SKU 名称”一栏输入“可乐”，在弹出的下拉列表中选择“可乐_ 可口可乐_330mL”选项。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_45_1.png)\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_45_2.png)\n\n（9）在弹出的“确认匹配”对话框中查看详细的商品图片，确认该\
    \ SKU 是否与需求匹配。单击“确定”按钮确认匹配，如图 3-24 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_46_0.png)\n\
