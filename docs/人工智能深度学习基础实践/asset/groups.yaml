    # 3. 发展功能


    发展功能并不是指满足用户直接需求的功能，而是指针对预测出的用户需求来设计、实现的功能。


    # 4. 非需求功能


    非需求功能的主要特征是，这类功能在需求分析和产品设计时并未涉及，而是在产品发布后逐渐完善产品功能的过程中添加的。这类功能需要及时实现和上线，才能让用户满意。


    产品总体的功能或用途称为产品的总功能，而产品的总功能往往可以分解为许多分功能，以支撑总功能的实现。同样，各分功能又可进一步分解为若干二级分功能，如此继续，直至产品总功能被分解为不可再分解的功能单元。如人脸识别门锁产品中，人脸识别开锁为产品的总功能，该总功能可分解为人脸识别功能和开锁功能。进一步地，人脸识别功能又可分解为人脸图像采集、人脸特征提取和人脸识别对比等二级分功能。


    即使已经被分解为功能单元，产品的分功能和功能单元之间也还是存在相互关联的。在人工智能产品设计中，用来描述产品的分功能和功能单元之间的相互关系的图，被称为功能结构图。


    产品的功能结构图能够直观地呈现出产品的所有功能，以及功能与功能之间的关系。如表 2-1 所示，产品的功能结构图中的元素主要包括 3 种。


    +   (1) 功能，即产品使用过程中涉及的功能，常用矩形表示。


    +   (2) 功能间关系，即功能与功能之间的逻辑关系，常用单向箭头表示。


    +   (3) 判断条件，即触发产品功能的前置条件，常用菱形表示。


    表2-1 功能结构图中的元素


    | 元素 | 图形 | 命名规范 |

    | --- | --- | --- |

    | 功能 | 灰色矩形 | 名词或动宾短语 |

    | 功能间关系 | 单向箭头 | — |

    | 判断条件 | 菱形加箭头 | “是” 或 “否” 的判断 |


    产品功能结构图的绘制可分为以下 3 步。


    # 1. 罗列产品的所有功能


    在功能设计阶段，需要先用线框标识出产品涉及的功能。从初次使用产品开始，产品的功能使用会有多种“走向”，所涉及的功能都需要标识出来。图 2-1 所示为证件审核产品的所有功能，其功能主要涉及证件申请发布、证件申请待审和拒绝证件申请
    3 种证件申请情况，以及机器图像审核和人工图像审核 2 种证件审核方式。'
  - '[PAGE 22]


    ![](img/54d7dd15f0857a11a3f298484cc566c5_22_0.png)


    # ## 2. 用有向箭头进行关联


    罗列出产品的所有功能之后，需要按照产品功能间的逻辑关系，使用有向箭头将产品的功能联系起来，以此表示产品各功能之间的关系，如图 2-2 所示。图 2-2 中箭头的方向表示产品功能的使用步骤。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_22_1.png)


    # ## 3. 增加判断条件


    在人工智能产品中，很多功能并不会在刚开始就被触发，这部分功能的触发存在前置条件。因此需要增加判断条件，使用有向箭头并辅以文字的形式表示触发这部分功能的前置条件。


    常见的判断条件有选择、循环两种逻辑结构，如图 2-3 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_22_2.png)


    # ## 2.2.3 原型设计


    构建完产品功能结构图之后，接下来需要按照功能结构图进行产品原型设计。


    产品原型设计阶段的本质是针对使用场景，结合产品功能，输出产品原型图和对应的场景解决方案。其中，产品原型图一般是一些简单的图形，能够表达产品最基本的使用方法，并能模拟产品的使用场景。根据产品原型图对于产品细节和功能的还原程度的不同，可以将产品原型图分为低保真原型图和高保真原型图。'
  - '[PAGE 23]


    # 1. 低保真原型图


    低保真原型图能够将产品的设计概念转换为直观的图形进行表示，通过模拟产品的使用流程来展现产品的特点和系统功能。


    低保真原型图大部分是绘制在白纸上的手绘草稿或简单的线框图，如图 2-4 所示。低保真原型图的优势在于能够快速地进行设计、制作，并且设计成本低，能够结合需求的更新随时进行修改。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_23_0.png)


    图 2-4 低保真原型图


    # 2. 高保真原型图


    与低保真原型图相比，高保真原型图则强调功能性与互动性，能够充分展示产品的功能、界面和使用流程。目前普遍流行使用墨刀、Axure RP 等产品原型设计工具来进行高保真原型图的制作。


    如图 2-5 所示，高保真原型图中的模块、按钮、标签，甚至是文案等设计元素，都将使用在真实的产品中。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_23_1.png)


    图 2-5 高保真原型图


    相比于低保真原型图，高保真原型图更逼近真实的产品，其能够与测试的参与者进行交互，有利于获取接近真实产品的使用感受和意见反馈。但高保真原型图的制作时间更长，设计成本也更高。'
