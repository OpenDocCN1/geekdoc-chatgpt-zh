    # 知识拓展


    在前面的学习中,我们已经了解了在开发商品检测项目时,需要在人工智能开发平台上创建 SKU。那么 SKU 到底是什么呢? 在了解 SKU 之前,需要先了解 SPU。


    标准化产品单元（Standard Product Unit，SPU）是商品信息聚合的最小单位，是一组可复用、易检索的标准化信息的集合，该集合描述了一个商品的特性。


    存货单位（ SKU ）即库存进出计量的基本单元。买家购买、商家进货、供应商备货、工厂生产都是依据 SKU 进行的。


    例如,要买一部手机,那就需要先确定手机的品牌,之后还需要确定手机的型号,是买第几代? 买 Pro 还是 Pro Max ? 确定了品牌和型号之后,就可以确定所要购买的商品,这就是
    SPU。但是同一款商品还会有其他属性上的区别,比如不同的外观、不同的存储容量等, SPU 再加上这些属性,就是 SKU。所以,我们可以知道 SKU 是从属于
    SPU 的,即一个 SPU 可以有多个 SKU。示例关系如图 3-63 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_57_1.png)


    # 图 3-63 SKU 与 SPU 的关系


    由上面的例子可以知道,单凭手机的品牌和型号,是无法确认该商品的库存情况的。要确定该商品的库存情况,必须通过 SKU。也就是说,只有确定了“品牌 + 型号 +
    外观 + 存储容量”,商家才知道应该补充哪种外观、哪种存储容量的手机。因此, SKU 才被称为库存进出计量的基本单元。'
