    # 知识拓展


    在先前设计模型时，在深度学习模型的搭建环节使用了两种不同的搭建方式。一种是使用 PaddlePaddle 封装成类的接口 nn.xxx，另一种是调用函数形式的
    nn.functional.xxx。下面对这两种方式进行说明。


    # 1. 两者的相同之处


    nn.xxx 和 nn.functional.xxx 的实际功能是相同的。以全连接层来说，nn.Linear 和 nn.functional.linear
    实现的功能都是一样的，只不过 nn.Linear 被封装成了类，而 nn.functional.linear 被封装成了函数。


    # 2. 两者的差别之处


    # (1) 两者的调用方式不同。


    nn.Linear 首先需要实例化 nn.Linear 类并传入构造模型所需要的参数，然后以函数调用的方式调用实例化对象并传入输入数据，这里输入的数据是网络的输入
    x。参考代码如下。


    ```

    import paddle


    linear = paddle.nn.Linear(2, 4)

    x = paddle.randn((3, 2), dtype="float32")

    y = linear(x)

    ```


    nn.functional.linear 则不需要实例化，但是要初始化权重参数。参考代码如下。


    ```

    import paddle


    x = paddle.randn((3, 2), dtype="float32")

    weight = paddle.full(shape=[2, 4], fill_value="0.5", dtype="float32", name="weight")
    # 初始化模型的权重参数

    bias = paddle.ones(shape=[4], dtype="float32", name="bias") # 初始化模型的偏置参数

    y = paddle.nn.functional.linear(x, weight, bias)

    ```


    因此，在具有需要被学习的参数的层中，如 Linear、Conv2d 等，建议采用 nn.xxx 方式；在没有需要被学习的参数的层中，如最大池化层、ReLU
    和 Sigmoid 等，可使用 nn.functional.xxx 或者 nn.xxx 方式。


    (2) nn.xxx 继承于 layers.Layer，能够和 nn.Sequential 一起使用，同时也继承有 layers.Layer 类的方法，如
    eval()、train() 等。而 nn.functional.xxx 无法和 nn.Sequential 一起使用，也没有 eval()、train()
    等方法。'
