    # 8.2.2 TensorFlow


    TensorFlow 是由谷歌公司推出的一个端到端的开源机器学习平台，其拥有全面而灵活的生态系统，其中包含各种工具、库和社区资源。TensorFlow 主要用于机器学习的研究，能够使开发者轻松地构建和部署机器学习的应用。


    TensorFlow 支持通过多种语言创建深度学习模型，如 Python、C 语言等。TensorFlow 可部署于各类服务器、PC（Personal Computer，个人计算机）终端和网页，支持多
    GPU 运行，并且代码编译效率较高，能够生成显示网络结构和性能的可视化图。


    作为当前较为流行的深度学习框架，TensorFlow 获得了极大的成功，但是 TensorFlow 也并非完美，还是会存在一定的缺陷，具体如下。


    # 1. 大量的底层代码


    TensorFlow 的代码比较底层，需要开发者编写大量的代码，还需要开发者仔细考虑神经网络的结构，并正确评估输入和输出数据的维度和容量，这导致开发者编写代码的效率较低。


    # 2. 频繁变动的接口


    TensorFlow 的接口一直处于快速迭代之中，并且没有很好地考虑向后兼容性。所谓向后兼容性，即指某一版本的接口是否在以后的版本中能够继续使用。这导致现在许多开源代码已经无法在新版的
    TensorFlow 上运行，同时也间接导致了许多基于 TensorFlow 的第三方框架出现错误。


    # 8.2.3 Keras


    Keras 是基于 Python 的开源人工神经网络库，可以在 TensorFlow 上运行，并且可用于深度学习模型的设计、调试、评估、应用和可视化。Keras
    提供统一、简洁的 API，极大程度地减少了用户的工作量，其在多数深度学习框架中是属于比较容易上手的。同时，Keras 提供清晰、实用的错误反馈，有助于深度学习初学者正确理解复杂的模型，能极大地减少用户的操作并使模型易于理解。


    Keras 是深度学习开发端用户较为关注的工具之一，在 2018 年的一份测评中，Keras 的普及率仅次于 TensorFlow。不过，Keras 也并非完美，其封装过度，所以灵活性比较差。Keras
    提供了一致的接口来屏蔽后端的差异，并且逐层进行了封装，但这使得用户难以自定义操作或获取底层数据信息。


    # 8.2.4 Caffe


    Caffe 是一个以 C++ 为核心的深度学习框架，拥有命令行、Python 和 MATLAB 接口，可以在 CPU 和 GPU 上运行。


    Caffe 的优点是操作简洁、快速，其凭借易用、简洁明了的源码、出众的性能和高效的原型设计获得了众多用户的青睐，在计算机视觉研究领域应用颇为广泛。但是 Caffe
    也存在灵活性差的缺点，与 Keras 因过度封装而灵活性较差不同，Caffe 缺乏灵活性的原因主要在于模型设计的方式。在 Caffe 中主要的对象是层，每实现一个新的层，必须要定义完整的神经网络前后向传播过程。'
  - '[PAGE 108]


    # 8.2.5 PyTorch


    PyTorch 是由元宇宙（Meta）公司人工智能研究院推出的一个开源的深度学习框架，是一个以 Python 优先的深度学习框架，不仅能够实现强大的 GPU
    加速，还支持动态神经网络，且拥有先进的自动寻求系统，是目前较受欢迎的动态图框架。


    PyTorch 追求封装简单，其简洁的设计使得代码易于理解。PyTorch 的源码量只有 TensorFlow 的十分之一左右，这种特性使得 PyTorch
    的源码阅读体验更佳。同时，PyTorch 不仅使用灵活，而且在模型设计方面更加快速。


    但是，2017 年推出的 PyTorch 还不够成熟，不够商业化，没有提供任何用于在网络上直接部署模型的框架，因此无法直接用于生产部署。


