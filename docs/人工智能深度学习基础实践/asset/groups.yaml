    # 6.3 数据标注质量标准


    数据标注的质量标准反映在两个方面：标注的数量以及标注的质量。要想获得标注质量高的数据，除了要选用优秀的数据标注工具，还要掌握各种数据标注的质量标准。以下是图像、文本以及音频的标注质量标准。


    # 1. 图像标注的质量标准


    图像标注的质量好坏取决于像素点判定的准确性高低。标注像素点越接近被标注物的边缘像素点，标注的质量就越高，标注的难度也越大。如果图像标注要求的准确率为 100%，标注像素点与被标注物的边缘像素点的误差应该在
    1 个像素以内。


    # 2. 文本标注的质量标准


    文本标注中涉及的任务较多，不同任务的质量标准是不同的。例如分词标注的质量标准是标注好的分词与词典中的词语一致，且不存在歧义；情感标注的质量标准则是对被标注句子的情感分类级别是否正确。


    # 3. 音频标注的质量标准


    进行音频标注时，语音数据发音的时间轴与标注区域的音标需保持同步，标注于发音时间轴的误差要控制在 1 个语音帧以内。若误差大于 1 个语音帧，则很容易标注到下一个发音，造成噪声数据。


