    # 6.1.1 图像数据标注工具


    “工欲善其事，必先利其器”，合适的图像数据标注工具能够帮助数据标注人员更好地进行图像标注。以下为一些常见的图像数据标注工具。


    +   1. EasyData


    EasyData 是百度公司提供的一种优秀的数据处理工具，其使用门槛低并且操作方便。EasyData 支持对图像、文本、音频和视频等多种类型的数据进行标注。在图像方面，它支持图像分类、物体检测、语义分割
    3 类数据标注。


    +   2. LabelImg


    LabelImg 是一种可视化的图像数据标注工具，主要用于物体检测。LabelImg 采用 Python 编写而成，并配置有图形化界面。LabelImg 支持两种标注格式，即
    VOC 格式和 YOLO 格式。若使用 VOC 格式，则其标注信息存储于 XML 文件中；若使用 YOLO 格式，则其标注信息存储于 TXT 文件中。


    +   3. LabelMe


    LabelMe 是一种用于在线图像数据标注的标注工具，主要用于物体检测和语义分割。LabelMe 支持将数据导出为 VOC 格式与 COCO 格式。另外，LabelMe
    支持通过矩形框、多边形、圆、线、点等组件进行图像标注，同时也支持视频标注。


    +   4. CVAT


    CVAT 是一种支持图像与视频数据标注的计算机视觉标注工具，它支持图像分类、物体检测、语义分割、实例分割 4 类数据标注。


    +   5. VoTT


    VoTT 是微软公司发布的视觉数据标注工具。它支持图像与视频数据标注，同时支持导出用于 CNTK、TensorFlow 和 YOLO 等进行训练的标注数据。


    在计算机视觉领域，除了以上 5 种图像数据标注工具外，还有许多优秀的开源数据标注工具，包括 IAT、Yolo_mark、PixelAnnotationTool
    等。本项目将采用百度公司的 EasyData 完成各项标注任务。


    # 6.1.2 文本数据标注工具


    用于文本数据标注的工具主要有 BRAT、DeepDive、IEPY 等，以下是这 3 种文本数据标注工具的介绍。


    +   1. BRAT


    BRAT 是一种基于 Web 的文本数据标注工具，主要用于对文本进行结构化标注，其主要的特点是在标注实体的同时可以进行关系的标注。用 BRAT 生成的标注结果能够对无结构的原始文本进行结构化，以供计算机处理。'
