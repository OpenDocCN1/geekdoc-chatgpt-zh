    # 表3-2 各个业务场景的图像分辨率建议


    | 场景 | 推荐图像分辨率 |

    | :--- | :--- |

    | 普通货架/货柜审核 | 1920 像素×1440 像素以上 |

    | 无人零售货柜 | 1280 像素×720 像素以上 |

    | 智能结算台 | 1280 像素×720 像素以上 |

    | 地堆商品审核 | 1920 像素×1440 像素以上 |


    +   ③ 采集设备。

    +   采集设备推荐与实际业务中拍摄图像的设备一致。比如，在普通货架 / 货柜审核、地堆商品审核业务场景中，采集设备推荐为手机；在无人零售货柜业务场景中，采集设备推荐为货柜；在智能结算台业务场景中，采集设备推荐为结算台。


    +   ④ 拍摄角度。

    +   在保证清晰度的前提下，采集实景图时的拍摄角度建议与实际检测时的保持一致。在普通货架 / 货柜审核场景中需要注意，应尽量从正面拍摄图像，拍摄角度可以稍微倾斜，但不要倾斜过多，否则会增加商品识别的难度，如图
    3-7 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_38_0.png)


    图 3-7 实景图的拍摄角度示例


    +   ⑤ 数据量。

    +   在第一次训练时，建议每个商品至少有 20 张实景图。上传至平台的实景图中，只有标注过的图像才能用于训练模型。在所有标注过的图像中，系统会随机抽取 70%
    的图像作为训练集，将剩余的图像作为测试集。如果标注的训练数据不足，可能会导致某个商品识别的精确度远低于其他商品识别的精确度，或是训练结果出现 mAP ( mean
    Average Precision，平均精度 )、精确率、召回率全都为 0 的情况。


    # 2. 数据处理


    数据采集完成后，需要对数据进行处理，以确保数据符合平台要求。以下为 EasyDL 零售行业版对数据的要求。


    +   * 支持的图像格式为 PNG、JPG、BMP、JPEG，图像大小限制在 4MB 以内。

    +   * 图像长宽比限制在 3 : 1 以内，其中最长边小于 4096 像素，最短边大于 30 像素。

    +   * 压缩包仅支持 ZIP 格式，大小限制在 5GB 以内。'
  - '[PAGE 39]


    # 3. 数据标注


    数据标注的质量会直接影响模型的质量，因此数据标注在整个流程中是非重要的。在平台上只需为商品上传各个角度的 SKU 单品图，无须进行任何标注；实景图则需要标注。接下来介绍实景图应该如何标注，即数据标注规范。


    # (1) 标注框的要求


    标注框是标注时的最小单位，其应为能够完全覆盖目标 SKU 的最小矩形框。图 3-8 所示为标注框标注示例。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_39_0.png)


    图 3-8 标注框标注示例


    # (2) 被标注物被遮挡时的标注方法


    当商品被遮挡时，在普通货架 / 货柜审核业务场景中，建议只标注露出部分超过 70% 且具备识别特征的 SKU；在无人零售货柜和智能结算台业务场景中，建议只标注商品露出来的部分。被标注物被遮挡时的标注示例如图
    3-9 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_39_1.png)


    图 3-9 被标注物被遮挡时的标注示例'
  - '[PAGE 40]


    # ( 3 ) 相似商品需分别标注


    在普通货架 / 货柜审核场景中，实景图上容易出现与目标商品很相似的商品，建议对它们通过创建各自对应的商品信息来分别进行标注。切勿将它们标注为同一类，这能够降低模型将这些相似的商品识别为目标商品的可能性。相似商品分为以下
    3 种情况。


    +   ① 同品牌不同系列、口味、包装。


    如图 3-10 所示，与要识别的商品同属一个品牌，但是属于不同系列、口味或者包装的商品，建议分别进行标注。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_40_0.png)


    图 3-10 同品牌不同口味的 SKU 标注示例


    +   ② 不同规格的同款商品。


    如图 3-11 所示，与要识别的商品规格不同的同款商品，如 300mL 与 500mL 规格，这种情况下，建议分别进行标注。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_40_1.png)


    图 3-11 不同规格的同款商品标注示例


    +   ③ 过于相似的竞品。


    如图 3-12 所示，与要识别的商品的特征，包括商品的颜色、规格、包装、材质等，都非常相似的竞品，建议分别进行标注。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_40_2.png)


    图 3-12 过于相似的竞品标注示例


    # ( 4 ) 避免误标注和漏标注


    误标注，即：将非目标 SKU 标注为目标 SKU ；漏标注，即：实景图上的目标 SKU 没有被全部标注出来。标注的时候应尽量避免这些情况发生，较多的误标注和漏标注会严重影响模型效果。以下简单列举常见的误标注和漏标注情况。'
  md: "\n### (2) 通过云服务数据回流采集数据\n\n人工智能模型训练后可能需要持续迭代和优化模型效果，可以通过调用 EasyDL 云服务接口并开通该采集服务，将实际业务数据及识别结果可视化，根据识别结果准确度有效挖掘难例，获取对模型优化更有助益的高质量数据。\n\
    \n## 2. 数据清洗\n\n在图像数据处理方面，EasyData 平台支持以下 4 种数据清洗策略。\n\n- 图像去模糊：过滤清晰度较低的图像，保证数据质量。\n\
    - 图像去重：过滤大量重复的图像，提高关键图像处理效率。\n- 图像批量裁剪：批量裁剪图像中的无关元素，提升数据质量。\n- 图像旋转：校正采集图像的角度，方便进行下一步的处理。\n\
    \n在文本数据处理方面，EasyData 平台支持以下 3 种数据清洗策略。\n\n- 去除表情符号：去掉清洗前文本中的表情等符号。\n- 去除 URL（Uniform\
    \ Resource Locator，统一资源定位符）：去除文本数据中的网页链接。\n- 繁体转简体：将文本中的繁体字转为简体字，通常情况下使用简体字可以取得更好的模型效果。\n\
    \n## 3. 数据标注\n\n目前，EasyData 平台支持图像、文本、音频、视频 4 类基础数据的标注，还支持智能标注、多人标注等方式，可提高标注效率。以下是\
    \ EasyData 平台的数据标注功能的详细介绍。\n\n### (1) 预置丰富的标注模板\n\n- 图像：图像分类、物体检测、图像分割。\n- 文本：文本分类、短文本相似度分析、情感倾向分析、文本实体抽取。\n\
    - 音频：音频分类。\n- 视频：视频分类。\n\n### (2) 支持智能标注\n\n智能标注支持人机交互协作标注，最多可降低 90% 的标注成本。目前智能标注已支持物体检测、图像分割、文本分类等。\n\
    \n### (3) 支持多人标注\n\n多人标注通过团队协作完成标注任务，可提高标注效率。目前多人标注已支持图像、文本、音频、视频等数据类型。\n\n###\
    \ (4) 提供数据标注服务\n\nEasyData 平台已全面对接百度人工智能市场中的优质数据服务商，企业可以通过 EasyData 平台面向服务商提交详细的标注需求。\n\
    \n## 3.1.2 深度学习模型定制平台\n\nEasyDL 深度学习模型定制平台是百度大脑推出的零门槛人工智能开发平台，面向各行各业有定制人工智能应用的需求、零算法基础或者追求高效率开发人工智能应用的企业用户。它支持包括数据管理、模型构建、模型部署与应用在内的一站式人工智能应用开发流程。原始图像、文本、音频、视频等数据，经过\
    \ EasyDL 平台加工、学习、部署，可通过公有云应用程序接口（Application Programming Interface，API）调用，或部署在本地服务器、小型设备、软硬一体方案的专项适配硬件上，通过软件开发工具包（Software\
    \ Development Kit，SDK）或 API 进行进一步集成。图 3-3 所示为 EasyDL 平台一站式开发流程。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_33_0.png)\n\
    \n图 3-3  EasyDL 平台一站式开发流程\n\nEasyDL 平台根据不同目标客户的应用场景及深度学习的技术方向，开发了以下 7 个模型类型。\n\
    \n### 1. EasyDL 图像\n\nEasyDL 图像可定制基于图像进行多样化分析的人工智能模型，实现图像内内容理解分类、图中物体检测定位等，适用于图像内容检索、安防监控、工业质检等场景。\n\
    \n目前，EasyDL 图像共支持训练以下 3 种不同应用场景的模型。\n\n- 图像分类：该模型可以识别图中的主体是否属于某类物体、状态或场景，适用于识别图像中主体单一的场景。\n\
    - 物体检测：在一张图包含多个物体的情况下，可定制该模型用于识别图像中每个物体的位置、数量、名称，适用于识别图像中有多个主体的场景。\n- 图像分割：对比物体检测，该模型支持用多边形标注训练数据，可像素级识别目标，适用于图中有多个主体、需识别其位置或轮廓的场景。\n\
    \n### 2. EasyDL 文本\n\nEasyDL 文本基于百度文心领先的语义理解技术，提供一整套自然语言处理定制与应用功能，可广泛应用于各种自然语言处理场景。\n\
    \n目前，EasyDL 文本共支持训练以下 5 种不同应用场景的模型。\n\n- 文本分类 - 单标签：定制分类标签实现文本内容的自动分类，每个文本仅属于一种标签类型。\n\
    - 文本分类 - 多标签：定制分类标签实现文本内容的自动分类，每个文本可同时属于多个分类标签。\n- 短文本相似度：可以将两个短文本进行语义对比计算，从而获得两个短文本的相似度值。\n\
    - 文本实体抽取：可实现从文本中抽取内容，并将抽取内容识别为自定义的类别标签。\n- 情感倾向分析：对包含主观信息的文本进行情感极性判断，情感极性分为积极、消极、中性。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_33_1.png)\n\n### 3. EasyDL 语音\n\nEasyDL\
    \ 语音可以定制语音识别模型，可精准识别业务专有名词，适用于数据采集和录入、呼叫中心等场景；还可以定制声音分类模型，用于区分不同声音类别。\n\n目前，EasyDL\
    \ 语音共支持训练以下 2 种应用场景的模型。\n\n- 语音识别：支持零代码自助训练，上传与业务场景相关的文本训练语料即可自助训练语音识别模型，支持词汇、长文本等多种训练方式。\n\
    - 声音分类：可以通过定制模型区分出不同物种发出的声音，支持对最长时长为 15 秒的音频进行处理。\n\n### 4. EasyDL OCR\n\nEasyDL\
    \ OCR 可以定制训练文字识别模型，结构化输出关键字段内容，满足个性化卡、证、票据识别需求，适用于证照电子化审批、财税报销电子化等场景。\n\n### 5.\
    \ EasyDL 视频\n\nEasyDL 视频是针对视频内容识别推出的一个定制化训练模型，适用于视频内容审核、人流或车流统计、养殖场牲畜移动轨迹分析等场景。\n\
    \n目前，EasyDL 视频共支持训练以下 2 种应用场景的模型。\n\n- 视频分类：可以用于分析短视频的内容，识别出视频内人物做的是什么动作，视频中的物体或环境发生了什么变化等。\n\
    - 目标跟踪：对视频流中的特定运动对象进行检测识别，获取目标的运动参数，从而实现对后续视频帧中该对象的运动预测（轨迹、速度等的预测），实现对运动目标的行为理解。\n\
    \n### 6. EasyDL 结构化数据\n\nEasyDL 结构化数据可以挖掘数据中隐藏的模式，解决二分类、多分类、回归等方面的问题，适用于客户流失预测、欺诈检测、价格预测等场景。\n\
    \n目前，EasyDL 结构化数据共支持训练以下 2 种应用场景的模型。\n\n- 表格数据预测：通过机器学习技术从表格化数据中发现潜在规律，从而创建机器学习模型，并基于机器学习模型处理新的数据，为业务应用生成预测结果。\n\
    - 时序预测：通过机器学习技术从历史数据中发现潜在规律，从而对未来的变化趋势进行预测。\n\n### 7. EasyDL 零售行业版\n\nEasyDL 零售行业版是\
    \ EasyDL 针对零售场景推出的行业版模型，专门面向零售场景的零售行业服务商等企业用户，提供针对商品识别场景的人工智能服务获取方案，支持面向货架巡检、自助结算台、无人零售柜等商品检测场景。\n\
    \n目前，EasyDL 零售行业版提供以下 4 种服务。\n\n- 定制商品检测服务：支持 4 种功能，包括商品基本信息识别、商品陈列层数识别、商品陈列场景识别和商品排面占比统计。定制商品检测服务适用于识别货架中的商品信息、商品数量和陈列顺序等，可用于辅助货架商品陈列合规检查，如检查铺货率、陈列情况等。\n\
    - 标准商品检测服务：目前已支持检测 5 个饮料品牌共计 122 种饮料类商品，其他品类和数量还在持续扩充中，适用于货架合规性检查场景。该服务接口会返回商品的名称及商品在图像中的位置。\n\
    - 货架拼接服务：基于百度 EasyDL 深度学习算法，支持将多个货架局部图像组合成为完整货架图像。同时，支持输出在完整货架图像中的商品检测结果，包含存货单位（Stock\
    \ Keeping Unit，SKU）的名称和数量，适用于需要在长货架进行商品检测的业务场景。\n- 翻拍识别服务：能够识别出通过手机翻拍的商品陈列图像，例如商品货架陈列图像和地堆商品陈列图像，可降低人工审核的人力成本，并能高效审核零售业务中通过翻拍原有图像来造假的图像。\n\
    \n## 3.2 人工智能开发流程\n\n人工智能开发的基本流程通常可以归纳为 4 个步骤，即需求分析、数据准备、模型训练和模型应用。在这几个步骤中，开发者都可以使用人工智能开发平台进行快速开发。接下来以商品检测项目为例，详细解析人工智能开发平台的业务操作方法。\n\
    \n### 3.2.1 需求分析\n\n在项目需求方面，为了在庞大的线下终端中赢得消费者的选择，明确如何通过货架陈列“争夺”商品在货架上展示的位置和比例，使商品的视觉呈现效果更能吸引消费者购买商品，成为快消企业终端竞争的重中之重。然而，在门店实际进行生动化陈列的过程中，经常会出现执行不到位的情况，如缺少必销品或重点商品、新品陈列没有占据醒目位置，排面靠后或被竞品“压制”、摆放不整齐、生动化物料没有展示出来等情况屡见不鲜。当货架缺货的情况发生时，品牌商可能会失去约\
    \ 46% 的购买者，而零售商可能会失去约 30% 的购买者。因此，要实现线下终端的高效管控，可以从人工智能技术入手，利用人工智能商品识别技术辅助人工完成商品的陈列审查，优化货架陈列执行效果和提高效率。\n\
    \n在项目任务方面，通过对需求的分析，我们需要基于目标检测任务找出图像中我们感兴趣的所有目标（商品），确定它们的类别和位置，实现对货架上的商品进行检测。因此，基于对智能数据服务平台和深度学习模型定制平台的了解，我们可以直接采用\
    \ EasyDL 零售行业版，零编程定制人工智能模型，实现商品检测项目。\n\n### 3.2.2 数据准备\n\n数据准备主要是指收集和预处理数据的过程，这是人工智能开发的基础。通过上述分析确定业务需求后，数据准备阶段需要有目的地收集、整合相关数据。在本项目中，需要收集对应的\
    \ SKU 单品图和实景图。\n\nSKU 单品图指的是单个商品的图像，不是模型训练必需的数据。SKU 单品图的作用是合成实景图，连同手工标注的实景图一起用于训练，降低实景图（训练数据）的采集和标注成本。为了让模型能够完整地识别一个商品，需要在训练的图像中出现这个商品各个角度的图像。这意味着需要从实际业务场景中采集大量的图像，并且进行大量的标注工作。为了降低这部分工作的成本，可通过数据合成和增强技术，为商品上传各个角度的\
    \ SKU 单品图，且无须对其进行任何标注，即可让模型学习到这个商品各个角度的图像。如果不上传 SKU 单品图，将会导致模型的识别效果变差。\n\n实景图是模型训练需要用到的训练数据，需要开发者从真实的业务场景中采集。\n\
    \n以下详细介绍如何按照数据采集、数据处理和数据标注 3 个步骤进行数据准备。\n\n### 1. 数据采集\n\n采集单品图数据时，需要注意对于图像内容、清晰度、拍摄角度和数据量的要求。采集实景图数据时，除了需要注意对于图像内容、清晰度、拍摄角度和数据量的要求，还需要注意对于采集设备的要求。接下来详细介绍单品图和实景图的采集要求。\n\
    \n### (1) 单品图\n\n深度学习模型定制平台上预置了 100 余种饮品类商品及 2100 余种日化类商品的图像，每个预置的商品已匹配 50 张左右的各角度的\
    \ SKU 单品图，绝大多数情况下用户无须再自行上传 SKU 单品图，可根据训练结果补齐识别效果不好的 SKU 单品图。SKU 单品图的具体图像内容要求如下。\n\
    \n- ① 图像内容。\n  - 商品数量：图像上仅可出现一个商品。\n  - 光照：需覆盖到实际检测场景中商品可能出现的差异性较大的光照条件，如灯光的颜色。\n\
    \  - 背景：背景为纯色，且背景颜色与商品主体的颜色有区别，如图 3-4 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_36_0.png)\n\
    \n图 3-4 SKU 单品图采集示例\n\n- ② 清晰度。\n  图像分辨率建议达到 1920 像素 × 1080 像素以上，拍摄相机的像素建议达到 200\
    \ 万以上，以保证图像上的 SKU 足够清晰。\n\n- ③ 拍摄角度。\n  当业务场景是货架陈列审核，且货架上的商品无确定的展示面时，SKU 单品图的角度需要覆盖商品可能在货架上出现的所有差异性较大的角度。考虑到拍摄角度，SKU\
    \ 单品图需要覆盖水平视角、俯视视角和仰视视角，如图 3-5 所示。\n\n- ④ 数据量。\n  数据量的基本要求是覆盖实际业务场景可能出现的各种情况，可以根据实际业务场景的情况灵活调整\
    \ SKU 单品图的拍摄角度和数据量。表 3-1 所示为各个业务场景下的推荐拍摄角度和数据量。\n\n表 3-1 各个业务场景下的推荐拍摄角度和数据量\n\n\
    | 场景 | 推荐拍摄角度 | 推荐数据量 |\n| --- | --- | --- |\n| 普通货架 / 货柜审核 | 水平视角、俯视视角和仰视视角 |\
    \ 每个角度各 10 张 |\n| 无人零售货柜 | 俯视视角 | 每个角度各 10 张 |\n| 智能结算台 | 水平视角、俯视视角，可根据实际情况增加仰视视角\
    \ | 每个角度各 10 张 |\n| 地堆商品审核 | 可尽量在实景图中覆盖需要检测的角度 | 每个角度各 10 张 |\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_37_0.png)\n\
    \n图 3-5 单品图的拍摄角度示例\n\n### (2) 实景图\n\n- ① 图像内容。\n  对于实景图的图像内容，需要确保数据与实际业务检测图像来源一致。例如，在货架商品陈列审核业务中，采集的数据是业务员巡店时拍摄的图像；在智能结算台业务中，采集的数据是结算台日常结算时拍摄的图像。\n\
    \n- ② 清晰度。\n  实景图需能够清晰显示每一个要识别的商品，即肉眼要能够看清每个商品及商品的特征，如图 3-6 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_37_1.png)\n\
    \n图 3-6 实景图的清晰度示例\n\n表 3-2 各个业务场景的图像分辨率建议\n\n| 场景 | 推荐图像分辨率 |\n| :--- | :--- |\n\
    | 普通货架/货柜审核 | 1920 像素×1440 像素以上 |\n| 无人零售货柜 | 1280 像素×720 像素以上 |\n| 智能结算台 | 1280\
    \ 像素×720 像素以上 |\n| 地堆商品审核 | 1920 像素×1440 像素以上 |\n\n- ③ 采集设备。\n  采集设备推荐与实际业务中拍摄图像的设备一致。比如，在普通货架\
    \ / 货柜审核、地堆商品审核业务场景中，采集设备推荐为手机；在无人零售货柜业务场景中，采集设备推荐为货柜；在智能结算台业务场景中，采集设备推荐为结算台。\n\
    \n- ④ 拍摄角度。\n  在保证清晰度的前提下，采集实景图时的拍摄角度建议与实际检测时的保持一致。在普通货架 / 货柜审核场景中需要注意，应尽量从正面拍摄图像，拍摄角度可以稍微倾斜，但不要倾斜过多，否则会增加商品识别的难度，如图\
    \ 3-7 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_38_0.png)\n\n图 3-7 实景图的拍摄角度示例\n\
    \n- ⑤ 数据量。\n  在第一次训练时，建议每个商品至少有 20 张实景图。上传至平台的实景图中，只有标注过的图像才能用于训练模型。在所有标注过的图像中，系统会随机抽取\
    \ 70% 的图像作为训练集，将剩余的图像作为测试集。如果标注的训练数据不足，可能会导致某个商品识别的精确度远低于其他商品识别的精确度，或是训练结果出现 mAP\
    \ (mean Average Precision，平均精度)、精确率、召回率全都为 0 的情况。\n\n### 2. 数据处理\n\n数据采集完成后，需要对数据进行处理，以确保数据符合平台要求。以下为\
    \ EasyDL 零售行业版对数据的要求。\n\n- 支持的图像格式为 PNG、JPG、BMP、JPEG，图像大小限制在 4MB 以内。\n- 图像长宽比限制在\
    \ 3 : 1 以内，其中最长边小于 4096 像素，最短边大于 30 像素。\n- 压缩包仅支持 ZIP 格式，大小限制在 5GB 以内。\n\n###\
    \ 3. 数据标注\n\n数据标注的质量会直接影响模型的质量，因此数据标注在整个流程中是非常重要的。在平台上只需为商品上传各个角度的 SKU 单品图，无须进行任何标注；实景图则需要标注。接下来介绍实景图应该如何标注，即数据标注规范。\n\
    \n### (1) 标注框的要求\n\n标注框是标注时的最小单位，其应为能够完全覆盖目标 SKU 的最小矩形框。图 3-8 所示为标注框标注示例。\n\n\
    ![](img/54d7dd15f0857a11a3f298484cc566c5_39_0.png)\n\n图 3-8 标注框标注示例\n\n### (2)\
    \ 被标注物被遮挡时的标注方法\n\n当商品被遮挡时，在普通货架 / 货柜审核业务场景中，建议只标注露出部分超过 70% 且具备识别特征的 SKU；在无人零售货柜和智能结算台业务场景中，建议只标注商品露出来的部分。被标注物被遮挡时的标注示例如图\
    \ 3-9 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_39_1.png)\n\n图 3-9 被标注物被遮挡时的标注示例\n\
    \n### (3) 相似商品需分别标注\n\n在普通货架 / 货柜审核场景中，实景图上容易出现与目标商品很相似的商品，建议对它们通过创建各自对应的商品信息来分别进行标注。切勿将它们标注为同一类，这能够降低模型将这些相似的商品识别为目标商品的可能性。相似商品分为以下\
    \ 3 种情况。\n\n- ① 同品牌不同系列、口味、包装。\n  如图 3-10 所示，与要识别的商品同属一个品牌，但是属于不同系列、口味或者包装的商品，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_0.png)\n\n图 3-10 同品牌不同口味的 SKU 标注示例\n\
    \n- ② 不同规格的同款商品。\n  如图 3-11 所示，与要识别的商品规格不同的同款商品，如 300mL 与 500mL 规格，这种情况下，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_1.png)\n\n图 3-11 不同规格的同款商品标注示例\n\
    \n- ③ 过于相似的竞品。\n  如图 3-12 所示，与要识别的商品的特征，包括商品的颜色、规格、包装、材质等，都非常相似的竞品，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_2.png)\n\n图 3-12 过于相似的竞品标注示例\n\n\
    ### (4) 避免误标注和漏标注\n\n误标注，即：将非目标 SKU 标注为目标 SKU ；漏标注，即：实景图上的目标 SKU 没有被全部标注出来。标注的时候应尽量避免这些情况发生，较多的误标注和漏标注会严重影响模型效果。以下简单列举常见的误标注和漏标注情况。\n"
  mdcn: "\n### (2) 通过云服务数据回流采集数据\n\n人工智能模型训练后可能需要持续迭代和优化模型效果，可以通过调用 EasyDL 云服务接口并开通该采集服务，将实际业务数据及识别结果可视化，根据识别结果准确度有效挖掘难例，获取对模型优化更有助益的高质量数据。\n\
    \n## 2. 数据清洗\n\n在图像数据处理方面，EasyData 平台支持以下 4 种数据清洗策略。\n\n- 图像去模糊：过滤清晰度较低的图像，保证数据质量。\n\
    - 图像去重：过滤大量重复的图像，提高关键图像处理效率。\n- 图像批量裁剪：批量裁剪图像中的无关元素，提升数据质量。\n- 图像旋转：校正采集图像的角度，方便进行下一步的处理。\n\
    \n在文本数据处理方面，EasyData 平台支持以下 3 种数据清洗策略。\n\n- 去除表情符号：去掉清洗前文本中的表情等符号。\n- 去除 URL（Uniform\
    \ Resource Locator，统一资源定位符）：去除文本数据中的网页链接。\n- 繁体转简体：将文本中的繁体字转为简体字，通常情况下使用简体字可以取得更好的模型效果。\n\
    \n## 3. 数据标注\n\n目前，EasyData 平台支持图像、文本、音频、视频 4 类基础数据的标注，还支持智能标注、多人标注等方式，可提高标注效率。以下是\
    \ EasyData 平台的数据标注功能的详细介绍。\n\n### (1) 预置丰富的标注模板\n\n- 图像：图像分类、物体检测、图像分割。\n- 文本：文本分类、短文本相似度分析、情感倾向分析、文本实体抽取。\n\
    - 音频：音频分类。\n- 视频：视频分类。\n\n### (2) 支持智能标注\n\n智能标注支持人机交互协作标注，最多可降低 90% 的标注成本。目前智能标注已支持物体检测、图像分割、文本分类等。\n\
    \n### (3) 支持多人标注\n\n多人标注通过团队协作完成标注任务，可提高标注效率。目前多人标注已支持图像、文本、音频、视频等数据类型。\n\n###\
    \ (4) 提供数据标注服务\n\nEasyData 平台已全面对接百度人工智能市场中的优质数据服务商，企业可以通过 EasyData 平台面向服务商提交详细的标注需求。\n\
    \n## 3.1.2 深度学习模型定制平台\n\nEasyDL 深度学习模型定制平台是百度大脑推出的零门槛人工智能开发平台，面向各行各业有定制人工智能应用的需求、零算法基础或者追求高效率开发人工智能应用的企业用户。它支持包括数据管理、模型构建、模型部署与应用在内的一站式人工智能应用开发流程。原始图像、文本、音频、视频等数据，经过\
    \ EasyDL 平台加工、学习、部署，可通过公有云应用程序接口（Application Programming Interface，API）调用，或部署在本地服务器、小型设备、软硬一体方案的专项适配硬件上，通过软件开发工具包（Software\
    \ Development Kit，SDK）或 API 进行进一步集成。图 3-3 所示为 EasyDL 平台一站式开发流程。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_33_0.png)\n\
    \n图 3-3  EasyDL 平台一站式开发流程\n\nEasyDL 平台根据不同目标客户的应用场景及深度学习的技术方向，开发了以下 7 个模型类型。\n\
    \n### 1. EasyDL 图像\n\nEasyDL 图像可定制基于图像进行多样化分析的人工智能模型，实现图像内内容理解分类、图中物体检测定位等，适用于图像内容检索、安防监控、工业质检等场景。\n\
    \n目前，EasyDL 图像共支持训练以下 3 种不同应用场景的模型。\n\n- 图像分类：该模型可以识别图中的主体是否属于某类物体、状态或场景，适用于识别图像中主体单一的场景。\n\
    - 物体检测：在一张图包含多个物体的情况下，可定制该模型用于识别图像中每个物体的位置、数量、名称，适用于识别图像中有多个主体的场景。\n- 图像分割：对比物体检测，该模型支持用多边形标注训练数据，可像素级识别目标，适用于图中有多个主体、需识别其位置或轮廓的场景。\n\
    \n### 2. EasyDL 文本\n\nEasyDL 文本基于百度文心领先的语义理解技术，提供一整套自然语言处理定制与应用功能，可广泛应用于各种自然语言处理场景。\n\
    \n目前，EasyDL 文本共支持训练以下 5 种不同应用场景的模型。\n\n- 文本分类 - 单标签：定制分类标签实现文本内容的自动分类，每个文本仅属于一种标签类型。\n\
    - 文本分类 - 多标签：定制分类标签实现文本内容的自动分类，每个文本可同时属于多个分类标签。\n- 短文本相似度：可以将两个短文本进行语义对比计算，从而获得两个短文本的相似度值。\n\
    - 文本实体抽取：可实现从文本中抽取内容，并将抽取内容识别为自定义的类别标签。\n- 情感倾向分析：对包含主观信息的文本进行情感极性判断，情感极性分为积极、消极、中性。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_33_1.png)\n\n### 3. EasyDL 语音\n\nEasyDL\
    \ 语音可以定制语音识别模型，可精准识别业务专有名词，适用于数据采集和录入、呼叫中心等场景；还可以定制声音分类模型，用于区分不同声音类别。\n\n目前，EasyDL\
    \ 语音共支持训练以下 2 种应用场景的模型。\n\n- 语音识别：支持零代码自助训练，上传与业务场景相关的文本训练语料即可自助训练语音识别模型，支持词汇、长文本等多种训练方式。\n\
    - 声音分类：可以通过定制模型区分出不同物种发出的声音，支持对最长时长为 15 秒的音频进行处理。\n\n### 4. EasyDL OCR\n\nEasyDL\
    \ OCR 可以定制训练文字识别模型，结构化输出关键字段内容，满足个性化卡、证、票据识别需求，适用于证照电子化审批、财税报销电子化等场景。\n\n### 5.\
    \ EasyDL 视频\n\nEasyDL 视频是针对视频内容识别推出的一个定制化训练模型，适用于视频内容审核、人流或车流统计、养殖场牲畜移动轨迹分析等场景。\n\
    \n目前，EasyDL 视频共支持训练以下 2 种应用场景的模型。\n\n- 视频分类：可以用于分析短视频的内容，识别出视频内人物做的是什么动作，视频中的物体或环境发生了什么变化等。\n\
    - 目标跟踪：对视频流中的特定运动对象进行检测识别，获取目标的运动参数，从而实现对后续视频帧中该对象的运动预测（轨迹、速度等的预测），实现对运动目标的行为理解。\n\
    \n### 6. EasyDL 结构化数据\n\nEasyDL 结构化数据可以挖掘数据中隐藏的模式，解决二分类、多分类、回归等方面的问题，适用于客户流失预测、欺诈检测、价格预测等场景。\n\
    \n目前，EasyDL 结构化数据共支持训练以下 2 种应用场景的模型。\n\n- 表格数据预测：通过机器学习技术从表格化数据中发现潜在规律，从而创建机器学习模型，并基于机器学习模型处理新的数据，为业务应用生成预测结果。\n\
    - 时序预测：通过机器学习技术从历史数据中发现潜在规律，从而对未来的变化趋势进行预测。\n\n### 7. EasyDL 零售行业版\n\nEasyDL 零售行业版是\
    \ EasyDL 针对零售场景推出的行业版模型，专门面向零售场景的零售行业服务商等企业用户，提供针对商品识别场景的人工智能服务获取方案，支持面向货架巡检、自助结算台、无人零售柜等商品检测场景。\n\
    \n目前，EasyDL 零售行业版提供以下 4 种服务。\n\n- 定制商品检测服务：支持 4 种功能，包括商品基本信息识别、商品陈列层数识别、商品陈列场景识别和商品排面占比统计。定制商品检测服务适用于识别货架中的商品信息、商品数量和陈列顺序等，可用于辅助货架商品陈列合规检查，如检查铺货率、陈列情况等。\n\
    - 标准商品检测服务：目前已支持检测 5 个饮料品牌共计 122 种饮料类商品，其他品类和数量还在持续扩充中，适用于货架合规性检查场景。该服务接口会返回商品的名称及商品在图像中的位置。\n\
    - 货架拼接服务：基于百度 EasyDL 深度学习算法，支持将多个货架局部图像组合成为完整货架图像。同时，支持输出在完整货架图像中的商品检测结果，包含存货单位（Stock\
    \ Keeping Unit，SKU）的名称和数量，适用于需要在长货架进行商品检测的业务场景。\n- 翻拍识别服务：能够识别出通过手机翻拍的商品陈列图像，例如商品货架陈列图像和地堆商品陈列图像，可降低人工审核的人力成本，并能高效审核零售业务中通过翻拍原有图像来造假的图像。\n\
    \n## 3.2 人工智能开发流程\n\n人工智能开发的基本流程通常可以归纳为 4 个步骤，即需求分析、数据准备、模型训练和模型应用。在这几个步骤中，开发者都可以使用人工智能开发平台进行快速开发。接下来以商品检测项目为例，详细解析人工智能开发平台的业务操作方法。\n\
    \n### 3.2.1 需求分析\n\n在项目需求方面，为了在庞大的线下终端中赢得消费者的选择，明确如何通过货架陈列“争夺”商品在货架上展示的位置和比例，使商品的视觉呈现效果更能吸引消费者购买商品，成为快消企业终端竞争的重中之重。然而，在门店实际进行生动化陈列的过程中，经常会出现执行不到位的情况，如缺少必销品或重点商品、新品陈列没有占据醒目位置，排面靠后或被竞品“压制”、摆放不整齐、生动化物料没有展示出来等情况屡见不鲜。当货架缺货的情况发生时，品牌商可能会失去约\
    \ 46% 的购买者，而零售商可能会失去约 30% 的购买者。因此，要实现线下终端的高效管控，可以从人工智能技术入手，利用人工智能商品识别技术辅助人工完成商品的陈列审查，优化货架陈列执行效果和提高效率。\n\
    \n在项目任务方面，通过对需求的分析，我们需要基于目标检测任务找出图像中我们感兴趣的所有目标（商品），确定它们的类别和位置，实现对货架上的商品进行检测。因此，基于对智能数据服务平台和深度学习模型定制平台的了解，我们可以直接采用\
    \ EasyDL 零售行业版，零编程定制人工智能模型，实现商品检测项目。\n\n### 3.2.2 数据准备\n\n数据准备主要是指收集和预处理数据的过程，这是人工智能开发的基础。通过上述分析确定业务需求后，数据准备阶段需要有目的地收集、整合相关数据。在本项目中，需要收集对应的\
    \ SKU 单品图和实景图。\n\nSKU 单品图指的是单个商品的图像，不是模型训练必需的数据。SKU 单品图的作用是合成实景图，连同手工标注的实景图一起用于训练，降低实景图（训练数据）的采集和标注成本。为了让模型能够完整地识别一个商品，需要在训练的图像中出现这个商品各个角度的图像。这意味着需要从实际业务场景中采集大量的图像，并且进行大量的标注工作。为了降低这部分工作的成本，可通过数据合成和增强技术，为商品上传各个角度的\
    \ SKU 单品图，且无须对其进行任何标注，即可让模型学习到这个商品各个角度的图像。如果不上传 SKU 单品图，将会导致模型的识别效果变差。\n\n实景图是模型训练需要用到的训练数据，需要开发者从真实的业务场景中采集。\n\
    \n以下详细介绍如何按照数据采集、数据处理和数据标注 3 个步骤进行数据准备。\n\n### 1. 数据采集\n\n采集单品图数据时，需要注意对于图像内容、清晰度、拍摄角度和数据量的要求。采集实景图数据时，除了需要注意对于图像内容、清晰度、拍摄角度和数据量的要求，还需要注意对于采集设备的要求。接下来详细介绍单品图和实景图的采集要求。\n\
    \n### (1) 单品图\n\n深度学习模型定制平台上预置了 100 余种饮品类商品及 2100 余种日化类商品的图像，每个预置的商品已匹配 50 张左右的各角度的\
    \ SKU 单品图，绝大多数情况下用户无须再自行上传 SKU 单品图，可根据训练结果补齐识别效果不好的 SKU 单品图。SKU 单品图的具体图像内容要求如下。\n\
    \n- ① 图像内容。\n  - 商品数量：图像上仅可出现一个商品。\n  - 光照：需覆盖到实际检测场景中商品可能出现的差异性较大的光照条件，如灯光的颜色。\n\
    \  - 背景：背景为纯色，且背景颜色与商品主体的颜色有区别，如图 3-4 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_36_0.png)\n\
    \n图 3-4 SKU 单品图采集示例\n\n- ② 清晰度。\n  图像分辨率建议达到 1920 像素 × 1080 像素以上，拍摄相机的像素建议达到 200\
    \ 万以上，以保证图像上的 SKU 足够清晰。\n\n- ③ 拍摄角度。\n  当业务场景是货架陈列审核，且货架上的商品无确定的展示面时，SKU 单品图的角度需要覆盖商品可能在货架上出现的所有差异性较大的角度。考虑到拍摄角度，SKU\
    \ 单品图需要覆盖水平视角、俯视视角和仰视视角，如图 3-5 所示。\n\n- ④ 数据量。\n  数据量的基本要求是覆盖实际业务场景可能出现的各种情况，可以根据实际业务场景的情况灵活调整\
    \ SKU 单品图的拍摄角度和数据量。表 3-1 所示为各个业务场景下的推荐拍摄角度和数据量。\n\n表 3-1 各个业务场景下的推荐拍摄角度和数据量\n\n\
    | 场景 | 推荐拍摄角度 | 推荐数据量 |\n| --- | --- | --- |\n| 普通货架 / 货柜审核 | 水平视角、俯视视角和仰视视角 |\
    \ 每个角度各 10 张 |\n| 无人零售货柜 | 俯视视角 | 每个角度各 10 张 |\n| 智能结算台 | 水平视角、俯视视角，可根据实际情况增加仰视视角\
    \ | 每个角度各 10 张 |\n| 地堆商品审核 | 可尽量在实景图中覆盖需要检测的角度 | 每个角度各 10 张 |\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_37_0.png)\n\
    \n图 3-5 单品图的拍摄角度示例\n\n### (2) 实景图\n\n- ① 图像内容。\n  对于实景图的图像内容，需要确保数据与实际业务检测图像来源一致。例如，在货架商品陈列审核业务中，采集的数据是业务员巡店时拍摄的图像；在智能结算台业务中，采集的数据是结算台日常结算时拍摄的图像。\n\
    \n- ② 清晰度。\n  实景图需能够清晰显示每一个要识别的商品，即肉眼要能够看清每个商品及商品的特征，如图 3-6 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_37_1.png)\n\
    \n图 3-6 实景图的清晰度示例\n\n表 3-2 各个业务场景的图像分辨率建议\n\n| 场景 | 推荐图像分辨率 |\n| :--- | :--- |\n\
    | 普通货架/货柜审核 | 1920 像素×1440 像素以上 |\n| 无人零售货柜 | 1280 像素×720 像素以上 |\n| 智能结算台 | 1280\
    \ 像素×720 像素以上 |\n| 地堆商品审核 | 1920 像素×1440 像素以上 |\n\n- ③ 采集设备。\n  采集设备推荐与实际业务中拍摄图像的设备一致。比如，在普通货架\
    \ / 货柜审核、地堆商品审核业务场景中，采集设备推荐为手机；在无人零售货柜业务场景中，采集设备推荐为货柜；在智能结算台业务场景中，采集设备推荐为结算台。\n\
    \n- ④ 拍摄角度。\n  在保证清晰度的前提下，采集实景图时的拍摄角度建议与实际检测时的保持一致。在普通货架 / 货柜审核场景中需要注意，应尽量从正面拍摄图像，拍摄角度可以稍微倾斜，但不要倾斜过多，否则会增加商品识别的难度，如图\
    \ 3-7 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_38_0.png)\n\n图 3-7 实景图的拍摄角度示例\n\
    \n- ⑤ 数据量。\n  在第一次训练时，建议每个商品至少有 20 张实景图。上传至平台的实景图中，只有标注过的图像才能用于训练模型。在所有标注过的图像中，系统会随机抽取\
    \ 70% 的图像作为训练集，将剩余的图像作为测试集。如果标注的训练数据不足，可能会导致某个商品识别的精确度远低于其他商品识别的精确度，或是训练结果出现 mAP\
    \ (mean Average Precision，平均精度)、精确率、召回率全都为 0 的情况。\n\n### 2. 数据处理\n\n数据采集完成后，需要对数据进行处理，以确保数据符合平台要求。以下为\
    \ EasyDL 零售行业版对数据的要求。\n\n- 支持的图像格式为 PNG、JPG、BMP、JPEG，图像大小限制在 4MB 以内。\n- 图像长宽比限制在\
    \ 3 : 1 以内，其中最长边小于 4096 像素，最短边大于 30 像素。\n- 压缩包仅支持 ZIP 格式，大小限制在 5GB 以内。\n\n###\
    \ 3. 数据标注\n\n数据标注的质量会直接影响模型的质量，因此数据标注在整个流程中是非常重要的。在平台上只需为商品上传各个角度的 SKU 单品图，无须进行任何标注；实景图则需要标注。接下来介绍实景图应该如何标注，即数据标注规范。\n\
    \n### (1) 标注框的要求\n\n标注框是标注时的最小单位，其应为能够完全覆盖目标 SKU 的最小矩形框。图 3-8 所示为标注框标注示例。\n\n\
    ![](img/54d7dd15f0857a11a3f298484cc566c5_39_0.png)\n\n图 3-8 标注框标注示例\n\n### (2)\
    \ 被标注物被遮挡时的标注方法\n\n当商品被遮挡时，在普通货架 / 货柜审核业务场景中，建议只标注露出部分超过 70% 且具备识别特征的 SKU；在无人零售货柜和智能结算台业务场景中，建议只标注商品露出来的部分。被标注物被遮挡时的标注示例如图\
    \ 3-9 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_39_1.png)\n\n图 3-9 被标注物被遮挡时的标注示例\n\
    \n### (3) 相似商品需分别标注\n\n在普通货架 / 货柜审核场景中，实景图上容易出现与目标商品很相似的商品，建议对它们通过创建各自对应的商品信息来分别进行标注。切勿将它们标注为同一类，这能够降低模型将这些相似的商品识别为目标商品的可能性。相似商品分为以下\
    \ 3 种情况。\n\n- ① 同品牌不同系列、口味、包装。\n  如图 3-10 所示，与要识别的商品同属一个品牌，但是属于不同系列、口味或者包装的商品，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_0.png)\n\n图 3-10 同品牌不同口味的 SKU 标注示例\n\
    \n- ② 不同规格的同款商品。\n  如图 3-11 所示，与要识别的商品规格不同的同款商品，如 300mL 与 500mL 规格，这种情况下，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_1.png)\n\n图 3-11 不同规格的同款商品标注示例\n\
    \n- ③ 过于相似的竞品。\n  如图 3-12 所示，与要识别的商品的特征，包括商品的颜色、规格、包装、材质等，都非常相似的竞品，建议分别进行标注。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_40_2.png)\n\n图 3-12 过于相似的竞品标注示例\n\n\
    ### (4) 避免误标注和漏标注\n\n误标注，即：将非目标 SKU 标注为目标 SKU ；漏标注，即：实景图上的目标 SKU 没有被全部标注出来。标注的时候应尽量避免这些情况发生，较多的误标注和漏标注会严重影响模型效果。以下简单列举常见的误标注和漏标注情况。\n"
