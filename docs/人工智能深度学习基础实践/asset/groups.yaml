  md: "\n## 3. 发展功能\n\n发展功能并不是指满足用户直接需求的功能，而是指针对预测出的用户需求来设计、实现的功能。\n\n## 4. 非需求功能\n\
    \n非需求功能的主要特征是，这类功能在需求分析和产品设计时并未涉及，而是在产品发布后逐渐完善产品功能的过程中添加的。这类功能需要及时实现和上线，才能让用户满意。\n\
    \n产品总体的功能或用途称为产品的总功能，而产品的总功能往往可以分解为许多分功能，以支撑总功能的实现。同样，各分功能又可进一步分解为若干二级分功能，如此继续，直至产品总功能被分解为不可再分解的功能单元。如人脸识别门锁产品中，人脸识别开锁为产品的总功能，该总功能可分解为人脸识别功能和开锁功能。进一步地，人脸识别功能又可分解为人脸图像采集、人脸特征提取和人脸识别对比等二级分功能。\n\
    \n即使已经被分解为功能单元，产品的分功能和功能单元之间也还是存在相互关联的。在人工智能产品设计中，用来描述产品的分功能和功能单元之间的相互关系的图，被称为功能结构图。\n\
    \n产品的功能结构图能够直观地呈现出产品的所有功能，以及功能与功能之间的关系。如表 2-1 所示，产品的功能结构图中的元素主要包括 3 种。\n\n- (1)\
    \ 功能，即产品使用过程中涉及的功能，常用矩形表示。\n- (2) 功能间关系，即功能与功能之间的逻辑关系，常用单向箭头表示。\n- (3) 判断条件，即触发产品功能的前置条件，常用菱形表示。\n\
    \n表 2-1 功能结构图中的元素\n\n| 元素 | 图形 | 命名规范 |\n| --- | --- | --- |\n| 功能 | 灰色矩形 | 名词或动宾短语\
    \ |\n| 功能间关系 | 单向箭头 | — |\n| 判断条件 | 菱形加箭头 | “是” 或 “否” 的判断 |\n\n产品功能结构图的绘制可分为以下\
    \ 3 步。\n\n### 1. 罗列产品的所有功能\n\n在功能设计阶段，需要先用线框标识出产品涉及的功能。从初次使用产品开始，产品的功能使用会有多种“走向”，所涉及的功能都需要标识出来。图\
    \ 2-1 所示为证件审核产品的所有功能，其功能主要涉及证件申请发布、证件申请待审和拒绝证件申请 3 种证件申请情况，以及机器图像审核和人工图像审核 2 种证件审核方式。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_22_0.png)\n\n### 2. 用有向箭头进行关联\n\n罗列出产品的所有功能之后，需要按照产品功能间的逻辑关系，使用有向箭头将产品的功能联系起来，以此表示产品各功能之间的关系，如图\
    \ 2-2 所示。图 2-2 中箭头的方向表示产品功能的使用步骤。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_22_1.png)\n\
    \n### 3. 增加判断条件\n\n在人工智能产品中，很多功能并不会在刚开始就被触发，这部分功能的触发存在前置条件。因此需要增加判断条件，使用有向箭头并辅以文字的形式表示触发这部分功能的前置条件。\n\
    \n常见的判断条件有选择、循环两种逻辑结构，如图 2-3 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_22_2.png)\n\
    \n## 2.2.3 原型设计\n\n构建完产品功能结构图之后，接下来需要按照功能结构图进行产品原型设计。\n\n产品原型设计阶段的本质是针对使用场景，结合产品功能，输出产品原型图和对应的场景解决方案。其中，产品原型图一般是一些简单的图形，能够表达产品最基本的使用方法，并能模拟产品的使用场景。根据产品原型图对于产品细节和功能的还原程度的不同，可以将产品原型图分为低保真原型图和高保真原型图。\n\
    \n### 1. 低保真原型图\n\n低保真原型图能够将产品的设计概念转换为直观的图形进行表示，通过模拟产品的使用流程来展现产品的特点和系统功能。\n\n\
    低保真原型图大部分是绘制在白纸上的手绘草稿或简单的线框图，如图 2-4 所示。低保真原型图的优势在于能够快速地进行设计、制作，并且设计成本低，能够结合需求的更新随时进行修改。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_23_0.png)\n\n图 2-4 低保真原型图\n\n### 2.\
    \ 高保真原型图\n\n与低保真原型图相比，高保真原型图则强调功能性与互动性，能够充分展示产品的功能、界面和使用流程。目前普遍流行使用墨刀、Axure RP\
    \ 等产品原型设计工具来进行高保真原型图的制作。\n\n如图 2-5 所示，高保真原型图中的模块、按钮、标签，甚至是文案等设计元素，都将使用在真实的产品中。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_23_1.png)\n\n图 2-5 高保真原型图\n\n相比于低保真原型图，高保真原型图更逼近真实的产品，其能够与测试的参与者进行交互，有利于获取接近真实产品的使用感受和意见反馈。但高保真原型图的制作时间更长，设计成本也更高。\n\
    \n## 2.2.4 研发实施\n\n研发实施是产品的制作和测试阶段。该阶段需要产品负责人的持续跟进，以确保产品解决方案的质量。研发实施阶段中的人工智能模型的开发流程与方法将在项目\
    \ 3 中详细讲解。\n\n## 2.3 人工智能产品的发展趋势\n\n我们已经了解了人工智能产品的设计流程，接下来介绍当前人工智能产品设计的缺陷，以及人工智能产品设计的发展趋势，以便读者能更好地设计出符合用户需求和行业发展趋势的人工智能产品。\n\
    \n## 2.3.1 当前人工智能产品设计的缺陷\n\n当前人工智能产品设计的缺陷主要包括以下 3 个方面。\n\n- 1. 产品功能单一\n\n  当前人工智能产品在设计阶段，主要针对用户的某一特定需求提出功能方案，导致产品无法满足用户日常场景中的其他需求。产品与产品之间缺乏联动性，导致用户在日常生活中需要频繁切换使用不同产品。\n\
    \n- 2. 使用门槛高\n\n  目前市场上的人工智能产品设计较为复杂，导致产品的使用门槛较高；对部分用户而言，学习成本较高。例如，当前的人工智能产品主要通过手机等设备中的应用程序对其进行控制。但是对于老年人来说，学习人工智能产品和应用程序的使用方法存在一定的困难，因此这部分用户可能无法使用该产品。\n\
    \n- 3. 产品功能有待优化\n\n  当前人工智能产品在自助服务、决策执行等方面的功能还有待优化。例如，在智能家居场景中，可以实现通过语音控制窗帘的开关。但依然存在在人类参与操作的环节，产品无法自主提供服务；在家庭安防系统中，一些智能检测设备只能检测到门窗的开关情况并进行反馈，却不具备安防领域中重要的危机处理和规避功能。\n\
    \n## 2.3.2 人工智能产品设计的发展趋势\n\n在人工智能产品设计的过程中，除了要避免常见的人工智能产品设计缺陷，还要使产品符合人工智能产品设计的发展趋势。人工智能产品设计的发展趋势包括以下\
    \ 2 个方向。\n\n- 1. 产品使用门槛降低\n\n  降低人工智能产品的使用门槛，能够降低人工智能产品使用过程中人类的参与程度。如自动驾驶汽车能够自主完成启动、停止、避让和通行等工作，可基本完成驾驶员的工作任务。\n\
    \n- 2. 多技术融合\n\n  随着新的信息科学技术的不断兴起和发展，人工智能产品并不仅仅局限于机器学习、计算机视觉和自然语言处理等人工智能技术。将 5G、大数据、云计算和区块链等新技术与人工智能技术进行融合，设计出的新产品往往能够给用户带来惊喜。例如，5G\
    \ 和人工智能技术的融合，为自动驾驶场景提供了稳定、可靠的解决方案；通过 5G 技术实时收集和共享道路、环境以及其他车辆的数据，通过人工智能技术进行分析和决策，帮助汽车识别周边环境并做出反应。人工智能技术的应用赋予了自动驾驶汽车适应突发情况的能力，极大地提高了自动驾驶汽车的安全性。\n\
    \n## 项目实施 商品检测项目设计\n\n## 2.4 实施思路\n\n基于对项目描述与知识准备内容的学习，我们已经基本了解了人工智能产品设计的基本流程。下面以商品检测项目为例，通过百度公司的\
    \ EasyDL 平台辅助项目开发，解析该项目的功能设计流程，绘制功能结构图。以下是本项目实施的步骤。\n\n- (1) 分析商品检测需求。\n- (2)\
    \ 罗列项目所有功能。\n- (3) 关联项目相关功能。\n- (4) 添加判断条件。\n\n## 2.5 实施步骤\n\n### 步骤 1：分析商品检测需求\n\
    \n对于快消行业的品牌商而言，线下门店的销量是商品总销量的重要组成部分。因此，品牌商需要不断优化策略以提高线下门店的产品销量。其中，洞察和优化商品在线下门店的陈列表现成了提高销量的重要手段之一。\n\
    \n在衡量商品陈列表现时，对于不同位置和不同品类的商品有不同的衡量维度和侧重点。例如，对于货架陈列而言，商品排面数量、货架占比和陈列位置是常见的衡量要素；对于冰柜陈列而言，冰柜的纯净度和饱和度则非常重要。\n\
    \n然而面对精细化的指标和越来越丰富的商品品类，传统人工稽查的方式速度慢、准确率低，难以满足行业日益增长的需求。同时会导致商品稽核的成本增高。\n\n针对这一诉求，百度\
    \ EasyDL 平台推出了 EasyDL 零售行业版，可帮助品牌商快速实现在终端运行所需的 AI 模型。\n\n因此商品检测项目需要能够依据快消品品牌商开展的陈列活动的要求，搜集图像样本，使用百度公司提供的定制化图像识别模型、多种算法组件及训练模板，实现用少量样本数据训练出精准模型，以快速、准确地识别目标图像是否合格，解决目前传统稽核方式的高成本及低准确率问题。\n\
    \n### 步骤 2：罗列项目所有功能\n\n了解了商品检测项目的需求后，接下来需要进行功能设计。首先需要罗列项目的所有功能。在商品检测项目中，首先终端用户能够通过移动应用端上传商品陈列视频，然后平台把视频文件切片为图像文件，最后用户调用百度\
    \ AI 定制化图像识别接口（简称百度 AI 接口）来识别目标图像是否满足要求。\n\n因此这个项目需要具备以下 4 个功能。\n\n- （1）能够将移动应用端录制的商品陈列视频上传至百度\
    \ EasyDL 平台。\n- （2）能够进行视频文件切片和图像预处理，即将录制的商品陈列视频数据处理成高质量的计算机能识别的图像数据。\n- （3）能够稳定调用百度\
    \ AI 定制化图像识别接口。\n- （4）能够识别图像内容信息并返回识别结果。\n\n项目主要功能如图 2-6 所示。其中，图像识别的功能并不是固定不变的，可以根据实际需求对其进行定制化模型设计。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_26_0.png)\n\n图 2-6 商品检测项目主要功能\n\n图像识别功能可以拆解为以下\
    \ 5 个二级分功能，如图 2-7 所示。\n\n- （1）能够根据品牌商开展的陈列活动的要求来集样本。其中，样本可分为正样本（属于检测类别的样本，在本项目中指货架上的商品）和负样本（不属于检测类别的样本，在本项目中指货架上的销售标签等）。\n\
    - （2）能够将样本上传至百度 EasyDL 平台。\n- （3）能够在百度定制识别模型中进行样本训练。\n- （4）因为百度 EasyDL 平台要求模型需要上线才能调用，所以需要将训练好的商品检测模型在百度\
    \ EasyDL 平台中上线。\n- （5）初次用来训练模型的数据量往往不足以满足变化万千的实际需求。因此设计的项目需要能够将识别过的图像进行分类，并将图像自动加入正、负样本库，不断补充到定制模型中，持续提高项目的精准度。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_26_1.png)\n\n图 2-7 图像识别功能拆解\n\n###\
    \ 步骤 3：关联项目相关功能\n\n分析完项目所需要的功能后，接下来将这些功能进行有机关联。\n\n商品检测项目的功能关联如图 2-8 所示。用户可以通过移动应用端将商品陈列的情况以视频的形式进行上传，然后在百度\
    \ EasyDL 平台进行视频文件切片和图像预处理工作，得到商品陈列的图像数据，接着调用百度 AI 定制化图像识别接口识别商品陈列情况，最终识别图像内容信息并返回识别结果。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_27_0.png)\n\n图 2-8 项目功能关联\n\n对于商品检测来说，因为识别的结果也将被重新引入样本的训练数据中，所以整个功能的流程应该是一个闭环。如图\
    \ 2-9 所示，首先将初次采集的样本按检测需求进行正、负样本分类，然后将分类好的样本数据上传至百度 EasyDL 平台中。接着在百度 EasyDL 平台中用这些正、负样本数据进行样本训练，最后将具有一定准确性的模型上线，以便在商品识别检测时通过接口调用此模型以识别图像内容信息，并根据识别结果将样本添加到对应的正、负样本库中，形成功能闭环。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_27_1.png)\n\n图 2-9 闭环的项目功能关联\n\n###\
    \ 步骤 4：添加判断条件\n\n关联好项目相关功能后，还需要梳理清楚功能触发前的判断条件，才能绘制正确的项目功能结构图。在商品检测项目的样本训练和识别中，因为识别过的图像数据将被重新归入样本数据集，并补充到定制模型中，所以需要将识别过的图像数据进行分类。而将这些图像数据分类的触发条件是判断识别过的图像属于正样本还是负样本，因此需要添加具备判断功能的选择结构进行条件判断。最终得到的定制化图像识别功能结构图如图\
    \ 2-10 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_27_2.png)\n\n图 2-10 定制化图像识别功能结构图\n\
    \n## 知识拓展\n\n我们在知识准备中已经了解到，产品原型设计阶段的本质是针对性地进行探索和提出有效的解决方案。但根据所用技术不同，解决方案会随之变化。其中深度学习技术是人工智能行业的热门技术，它通过赋予机器类似于人类的分析和学习能力，可为许多行业提供智能且高效的解决方案。接下来，我们将从社交应用行业进行切入，了解深度学习技术如何为社交应用行业中的内容审核提供解决方案。\n\
    \n在社交应用行业中，内容审核是该行业的一个痛点。低俗信息、恶意广告等不良信息的出现会导致产品的用户体验变差。国内某社交应用（以下简称为 A 应用）拥有千万级数量的注册用户，为了保障良好的用户体验，提升内容审核的工作效率，A\
    \ 应用对审核技术的诉求如下。\n\n- (1) 针对文本的审核要能够对政治敏感、恶意推广、低俗辱骂等方面的文本进行快速处理，准确率需要达到 95% 以上。\n\
    - (2) 针对聊天过程中的图像进行审核，尤其是针对广告的检测准确率需要达到 95% 以上。\n- (3) 图像审核技术需要支持自定义，让审核标准更贴合 A\
    \ 应用的实际业务场景。\n\n百度 AI 文本审核和图像审核技术基于深度学习的智能内容审核方案，能够准确过滤图像和视频中的政治敏感、恶意推广、不良场景等违规内容，也能从美观、清晰等维度对图像进行筛选，紧贴业务需求，从而可释放审核人力资源。\n\
    \n如图 2-11 所示，接入百度 AI 文本审核和图像审核接口后，A 应用可对用户上传的头像图像，以及用户在聊天互动中产生的文本进行高效审核，准确地将违规的政治敏感、恶意推广等内容进行过滤，避免不良信息的传播。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_28_0.png)\n\n图 2-11 内容审核功能关联\n\n通过使用百度\
    \ AI 文本审核和图像审核技术，A 应用将内容审核的效率提高了 90%，节省了大量人力成本和时间成本。此外，A 应用通过图像审核技术实现了百万张头像图像的检测审核，并且\
    \ A 应用中的广告检测准确率高达 99%，为用户提供了健康的网络社交环境，优化了用户体验。\n\n## 课后实训\n\n- (1) 按照用户的使用需求进行分类，人工智能产品功能的类型不包括以下哪种？（\
    \ ）【单选题】\n  - A. 基础功能\n  - B. 亮点功能\n  - C. 发展功能\n  - D. 总功能\n\n- (2) 人工智能产品的设计流程不包括以下哪一项？（\
    \ ）【单选题】\n  - A. 需求管理\n  - B. 功能设计\n  - C. 系统设计\n  - D. 原型设计\n\n- (3) 人工智能产品的功能结构图的主要元素不包括（\
    \ ）。【单选题】\n  - A. 功能\n  - B. 功能间关系\n  - C. 判断条件\n  - D. 使用效果\n\n- (4) 人工智能产品功能结构图的绘制方法不包括（\
    \ ）。【单选题】\n  - A. 罗列所有功能\n  - B. 拆解所有功能\n  - C. 用有向箭头进行关联\n  - D. 添加判断条件\n\n-\
    \ (5) 关于高保真原型图的描述，以下哪项是错误的？（ ）。【单选题】\n  - A. 设计周期短，成本较低\n  - B. 设计内容逼近真实产品\n \
    \ - C. 可用交互进行关联\n  - D. 能够展示产品功能、界面元素、使用流程\n\n## 项目 3 人工智能开发平台应用\n\n人工智能开发的基本流程通常包括需求分析、数据准备、模型训练、模型应用\
    \ 4 个步骤。而模型构建与训练对于部分有定制模型需求的企业来说较难以实现，因为大部分中小企业并不具备专业的算法开发能力，真正懂人工智能、拥有丰富模型训练经验的人才寥寥无几。针对上述情况，部分拥有顶尖人工智能技术的头部企业开放技术框架、工程工具、平台、接口等，通过开放简易的人工智能开发工具或平台等方式，将技术公开给企业或个人开发者使用，从而降低了人工智能的入门门槛。\n\
    \n- (1) 了解相关的人工智能开发平台的功能。\n- (2) 掌握人工智能开发平台的应用流程。\n- (3) 掌握深度学习模型定制平台的业务操作方法。\n\
    - (4) 能够针对业务需求配置合适的人工智能开发平台。\n\n## 项目描述\n\n本项目首先介绍人工智能开发平台中的智能数据服务平台和深度学习模型定制平台，接着介绍通过人工智能开发平台开发应用的方法，最后介绍通过\
    \ EasyDL 平台开展商品检测，帮助读者掌握人工智能开发平台的业务操作方法。\n\n## 知识准备\n\n## 3.1 人工智能开发平台简介\n\n目前，市面上的人工智能开发平台较多，其中包括百度\
    \ AI 开放平台、讯飞开放平台等。其中百度 AI 开放平台是较为典型的人工智能开发平台。接下来以百度 AI 开放平台中的智能数据服务平台和深度学习模型定制平台为例，介绍平台的相关功能。\n\
    \n### 3.1.1 智能数据服务平台\n\nEasyData 平台是百度大脑推出的智能数据服务平台，面向各行各业有人工智能开发需求的企业用户及开发者提供一站式数据服务工具。该平台主要围绕人工智能开发过程中所需要的数据采集、数据清洗、数据标注等业务需求提供完整的数据服务。目前\
    \ EasyData 平台已经支持图像、文本、音频、视频 4 类基础数据的标注，也初步支持机器学习数据的存储。同时，EasyData 平台已与 EasyDL\
    \ 平台打通，可以将 EasyData 平台处理的数据应用于 EasyDL 平台的模型训练。图 3-1 所示为 EasyData 智能数据服务平台界面。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_31_0.png)\n\n图 3-1 EasyData 智能数据服务平台界面\n\
    \nEasyData 智能数据服务平台主要提供数据采集、数据清洗、数据标注等数据服务，以下简要介绍这 3 个服务。\n\n### 1. 数据采集\n\n目前，EasyData\
    \ 平台可提供两种数据采集方案，如图 3-2 所示，第一种是通过摄像头采集图像数据；第二种是通过云服务数据回流采集数据。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_31_1.png)\n\
    \n图 3-2 数据采集方案\n\n#### (1) 通过摄像头采集图像数据\n\n该方案需使用本地采集设备，支持定时拍照、视频抽帧（支持自定义抽帧规则）等多种采集方式，并将图像即时同步到\
    \ EasyData 平台进行管理。\n"
  mdcn: "\n## 3. 发展功能\n\n发展功能并不是指满足用户直接需求的功能，而是指针对预测出的用户需求来设计、实现的功能。\n\n## 4. 非需求功能\n\
    \n非需求功能的主要特征是，这类功能在需求分析和产品设计时并未涉及，而是在产品发布后逐渐完善产品功能的过程中添加的。这类功能需要及时实现和上线，才能让用户满意。\n\
    \n产品总体的功能或用途称为产品的总功能，而产品的总功能往往可以分解为许多分功能，以支撑总功能的实现。同样，各分功能又可进一步分解为若干二级分功能，如此继续，直至产品总功能被分解为不可再分解的功能单元。如人脸识别门锁产品中，人脸识别开锁为产品的总功能，该总功能可分解为人脸识别功能和开锁功能。进一步地，人脸识别功能又可分解为人脸图像采集、人脸特征提取和人脸识别对比等二级分功能。\n\
    \n即使已经被分解为功能单元，产品的分功能和功能单元之间也还是存在相互关联的。在人工智能产品设计中，用来描述产品的分功能和功能单元之间的相互关系的图，被称为功能结构图。\n\
    \n产品的功能结构图能够直观地呈现出产品的所有功能，以及功能与功能之间的关系。如表 2-1 所示，产品的功能结构图中的元素主要包括 3 种。\n\n- (1)\
    \ 功能，即产品使用过程中涉及的功能，常用矩形表示。\n- (2) 功能间关系，即功能与功能之间的逻辑关系，常用单向箭头表示。\n- (3) 判断条件，即触发产品功能的前置条件，常用菱形表示。\n\
    \n表 2-1 功能结构图中的元素\n\n| 元素 | 图形 | 命名规范 |\n| --- | --- | --- |\n| 功能 | 灰色矩形 | 名词或动宾短语\
    \ |\n| 功能间关系 | 单向箭头 | — |\n| 判断条件 | 菱形加箭头 | “是” 或 “否” 的判断 |\n\n产品功能结构图的绘制可分为以下\
    \ 3 步。\n\n### 1. 罗列产品的所有功能\n\n在功能设计阶段，需要先用线框标识出产品涉及的功能。从初次使用产品开始，产品的功能使用会有多种“走向”，所涉及的功能都需要标识出来。图\
    \ 2-1 所示为证件审核产品的所有功能，其功能主要涉及证件申请发布、证件申请待审和拒绝证件申请 3 种证件申请情况，以及机器图像审核和人工图像审核 2 种证件审核方式。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_22_0.png)\n\n### 2. 用有向箭头进行关联\n\n罗列出产品的所有功能之后，需要按照产品功能间的逻辑关系，使用有向箭头将产品的功能联系起来，以此表示产品各功能之间的关系，如图\
    \ 2-2 所示。图 2-2 中箭头的方向表示产品功能的使用步骤。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_22_1.png)\n\
    \n### 3. 增加判断条件\n\n在人工智能产品中，很多功能并不会在刚开始就被触发，这部分功能的触发存在前置条件。因此需要增加判断条件，使用有向箭头并辅以文字的形式表示触发这部分功能的前置条件。\n\
    \n常见的判断条件有选择、循环两种逻辑结构，如图 2-3 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_22_2.png)\n\
    \n## 2.2.3 原型设计\n\n构建完产品功能结构图之后，接下来需要按照功能结构图进行产品原型设计。\n\n产品原型设计阶段的本质是针对使用场景，结合产品功能，输出产品原型图和对应的场景解决方案。其中，产品原型图一般是一些简单的图形，能够表达产品最基本的使用方法，并能模拟产品的使用场景。根据产品原型图对于产品细节和功能的还原程度的不同，可以将产品原型图分为低保真原型图和高保真原型图。\n\
    \n### 1. 低保真原型图\n\n低保真原型图能够将产品的设计概念转换为直观的图形进行表示，通过模拟产品的使用流程来展现产品的特点和系统功能。\n\n\
    低保真原型图大部分是绘制在白纸上的手绘草稿或简单的线框图，如图 2-4 所示。低保真原型图的优势在于能够快速地进行设计、制作，并且设计成本低，能够结合需求的更新随时进行修改。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_23_0.png)\n\n图 2-4 低保真原型图\n\n### 2.\
    \ 高保真原型图\n\n与低保真原型图相比，高保真原型图则强调功能性与互动性，能够充分展示产品的功能、界面和使用流程。目前普遍流行使用墨刀、Axure RP\
    \ 等产品原型设计工具来进行高保真原型图的制作。\n\n如图 2-5 所示，高保真原型图中的模块、按钮、标签，甚至是文案等设计元素，都将使用在真实的产品中。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_23_1.png)\n\n图 2-5 高保真原型图\n\n相比于低保真原型图，高保真原型图更逼近真实的产品，其能够与测试的参与者进行交互，有利于获取接近真实产品的使用感受和意见反馈。但高保真原型图的制作时间更长，设计成本也更高。\n\
    \n## 2.2.4 研发实施\n\n研发实施是产品的制作和测试阶段。该阶段需要产品负责人的持续跟进，以确保产品解决方案的质量。研发实施阶段中的人工智能模型的开发流程与方法将在项目\
    \ 3 中详细讲解。\n\n## 2.3 人工智能产品的发展趋势\n\n我们已经了解了人工智能产品的设计流程，接下来介绍当前人工智能产品设计的缺陷，以及人工智能产品设计的发展趋势，以便读者能更好地设计出符合用户需求和行业发展趋势的人工智能产品。\n\
    \n## 2.3.1 当前人工智能产品设计的缺陷\n\n当前人工智能产品设计的缺陷主要包括以下 3 个方面。\n\n- 1. 产品功能单一\n\n  当前人工智能产品在设计阶段，主要针对用户的某一特定需求提出功能方案，导致产品无法满足用户日常场景中的其他需求。产品与产品之间缺乏联动性，导致用户在日常生活中需要频繁切换使用不同产品。\n\
    \n- 2. 使用门槛高\n\n  目前市场上的人工智能产品设计较为复杂，导致产品的使用门槛较高；对部分用户而言，学习成本较高。例如，当前的人工智能产品主要通过手机等设备中的应用程序对其进行控制。但是对于老年人来说，学习人工智能产品和应用程序的使用方法存在一定的困难，因此这部分用户可能无法使用该产品。\n\
    \n- 3. 产品功能有待优化\n\n  当前人工智能产品在自助服务、决策执行等方面的功能还有待优化。例如，在智能家居场景中，可以实现通过语音控制窗帘的开关。但依然存在在人类参与操作的环节，产品无法自主提供服务；在家庭安防系统中，一些智能检测设备只能检测到门窗的开关情况并进行反馈，却不具备安防领域中重要的危机处理和规避功能。\n\
    \n## 2.3.2 人工智能产品设计的发展趋势\n\n在人工智能产品设计的过程中，除了要避免常见的人工智能产品设计缺陷，还要使产品符合人工智能产品设计的发展趋势。人工智能产品设计的发展趋势包括以下\
    \ 2 个方向。\n\n- 1. 产品使用门槛降低\n\n  降低人工智能产品的使用门槛，能够降低人工智能产品使用过程中人类的参与程度。如自动驾驶汽车能够自主完成启动、停止、避让和通行等工作，可基本完成驾驶员的工作任务。\n\
    \n- 2. 多技术融合\n\n  随着新的信息科学技术的不断兴起和发展，人工智能产品并不仅仅局限于机器学习、计算机视觉和自然语言处理等人工智能技术。将 5G、大数据、云计算和区块链等新技术与人工智能技术进行融合，设计出的新产品往往能够给用户带来惊喜。例如，5G\
    \ 和人工智能技术的融合，为自动驾驶场景提供了稳定、可靠的解决方案；通过 5G 技术实时收集和共享道路、环境以及其他车辆的数据，通过人工智能技术进行分析和决策，帮助汽车识别周边环境并做出反应。人工智能技术的应用赋予了自动驾驶汽车适应突发情况的能力，极大地提高了自动驾驶汽车的安全性。\n\
    \n## 项目实施 商品检测项目设计\n\n## 2.4 实施思路\n\n基于对项目描述与知识准备内容的学习，我们已经基本了解了人工智能产品设计的基本流程。下面以商品检测项目为例，通过百度公司的\
    \ EasyDL 平台辅助项目开发，解析该项目的功能设计流程，绘制功能结构图。以下是本项目实施的步骤。\n\n- (1) 分析商品检测需求。\n- (2)\
    \ 罗列项目所有功能。\n- (3) 关联项目相关功能。\n- (4) 添加判断条件。\n\n## 2.5 实施步骤\n\n### 步骤 1：分析商品检测需求\n\
    \n对于快消行业的品牌商而言，线下门店的销量是商品总销量的重要组成部分。因此，品牌商需要不断优化策略以提高线下门店的产品销量。其中，洞察和优化商品在线下门店的陈列表现成了提高销量的重要手段之一。\n\
    \n在衡量商品陈列表现时，对于不同位置和不同品类的商品有不同的衡量维度和侧重点。例如，对于货架陈列而言，商品排面数量、货架占比和陈列位置是常见的衡量要素；对于冰柜陈列而言，冰柜的纯净度和饱和度则非常重要。\n\
    \n然而面对精细化的指标和越来越丰富的商品品类，传统人工稽查的方式速度慢、准确率低，难以满足行业日益增长的需求。同时会导致商品稽核的成本增高。\n\n针对这一诉求，百度\
    \ EasyDL 平台推出了 EasyDL 零售行业版，可帮助品牌商快速实现在终端运行所需的 AI 模型。\n\n因此商品检测项目需要能够依据快消品品牌商开展的陈列活动的要求，搜集图像样本，使用百度公司提供的定制化图像识别模型、多种算法组件及训练模板，实现用少量样本数据训练出精准模型，以快速、准确地识别目标图像是否合格，解决目前传统稽核方式的高成本及低准确率问题。\n\
    \n### 步骤 2：罗列项目所有功能\n\n了解了商品检测项目的需求后，接下来需要进行功能设计。首先需要罗列项目的所有功能。在商品检测项目中，首先终端用户能够通过移动应用端上传商品陈列视频，然后平台把视频文件切片为图像文件，最后用户调用百度\
    \ AI 定制化图像识别接口（简称百度 AI 接口）来识别目标图像是否满足要求。\n\n因此这个项目需要具备以下 4 个功能。\n\n- （1）能够将移动应用端录制的商品陈列视频上传至百度\
    \ EasyDL 平台。\n- （2）能够进行视频文件切片和图像预处理，即将录制的商品陈列视频数据处理成高质量的计算机能识别的图像数据。\n- （3）能够稳定调用百度\
    \ AI 定制化图像识别接口。\n- （4）能够识别图像内容信息并返回识别结果。\n\n项目主要功能如图 2-6 所示。其中，图像识别的功能并不是固定不变的，可以根据实际需求对其进行定制化模型设计。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_26_0.png)\n\n图 2-6 商品检测项目主要功能\n\n图像识别功能可以拆解为以下\
    \ 5 个二级分功能，如图 2-7 所示。\n\n- （1）能够根据品牌商开展的陈列活动的要求来集样本。其中，样本可分为正样本（属于检测类别的样本，在本项目中指货架上的商品）和负样本（不属于检测类别的样本，在本项目中指货架上的销售标签等）。\n\
    - （2）能够将样本上传至百度 EasyDL 平台。\n- （3）能够在百度定制识别模型中进行样本训练。\n- （4）因为百度 EasyDL 平台要求模型需要上线才能调用，所以需要将训练好的商品检测模型在百度\
    \ EasyDL 平台中上线。\n- （5）初次用来训练模型的数据量往往不足以满足变化万千的实际需求。因此设计的项目需要能够将识别过的图像进行分类，并将图像自动加入正、负样本库，不断补充到定制模型中，持续提高项目的精准度。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_26_1.png)\n\n图 2-7 图像识别功能拆解\n\n###\
    \ 步骤 3：关联项目相关功能\n\n分析完项目所需要的功能后，接下来将这些功能进行有机关联。\n\n商品检测项目的功能关联如图 2-8 所示。用户可以通过移动应用端将商品陈列的情况以视频的形式进行上传，然后在百度\
    \ EasyDL 平台进行视频文件切片和图像预处理工作，得到商品陈列的图像数据，接着调用百度 AI 定制化图像识别接口识别商品陈列情况，最终识别图像内容信息并返回识别结果。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_27_0.png)\n\n图 2-8 项目功能关联\n\n对于商品检测来说，因为识别的结果也将被重新引入样本的训练数据中，所以整个功能的流程应该是一个闭环。如图\
    \ 2-9 所示，首先将初次采集的样本按检测需求进行正、负样本分类，然后将分类好的样本数据上传至百度 EasyDL 平台中。接着在百度 EasyDL 平台中用这些正、负样本数据进行样本训练，最后将具有一定准确性的模型上线，以便在商品识别检测时通过接口调用此模型以识别图像内容信息，并根据识别结果将样本添加到对应的正、负样本库中，形成功能闭环。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_27_1.png)\n\n图 2-9 闭环的项目功能关联\n\n###\
    \ 步骤 4：添加判断条件\n\n关联好项目相关功能后，还需要梳理清楚功能触发前的判断条件，才能绘制正确的项目功能结构图。在商品检测项目的样本训练和识别中，因为识别过的图像数据将被重新归入样本数据集，并补充到定制模型中，所以需要将识别过的图像数据进行分类。而将这些图像数据分类的触发条件是判断识别过的图像属于正样本还是负样本，因此需要添加具备判断功能的选择结构进行条件判断。最终得到的定制化图像识别功能结构图如图\
    \ 2-10 所示。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_27_2.png)\n\n图 2-10 定制化图像识别功能结构图\n\
    \n## 知识拓展\n\n我们在知识准备中已经了解到，产品原型设计阶段的本质是针对性地进行探索和提出有效的解决方案。但根据所用技术不同，解决方案会随之变化。其中深度学习技术是人工智能行业的热门技术，它通过赋予机器类似于人类的分析和学习能力，可为许多行业提供智能且高效的解决方案。接下来，我们将从社交应用行业进行切入，了解深度学习技术如何为社交应用行业中的内容审核提供解决方案。\n\
    \n在社交应用行业中，内容审核是该行业的一个痛点。低俗信息、恶意广告等不良信息的出现会导致产品的用户体验变差。国内某社交应用（以下简称为 A 应用）拥有千万级数量的注册用户，为了保障良好的用户体验，提升内容审核的工作效率，A\
    \ 应用对审核技术的诉求如下。\n\n- (1) 针对文本的审核要能够对政治敏感、恶意推广、低俗辱骂等方面的文本进行快速处理，准确率需要达到 95% 以上。\n\
    - (2) 针对聊天过程中的图像进行审核，尤其是针对广告的检测准确率需要达到 95% 以上。\n- (3) 图像审核技术需要支持自定义，让审核标准更贴合 A\
    \ 应用的实际业务场景。\n\n百度 AI 文本审核和图像审核技术基于深度学习的智能内容审核方案，能够准确过滤图像和视频中的政治敏感、恶意推广、不良场景等违规内容，也能从美观、清晰等维度对图像进行筛选，紧贴业务需求，从而可释放审核人力资源。\n\
    \n如图 2-11 所示，接入百度 AI 文本审核和图像审核接口后，A 应用可对用户上传的头像图像，以及用户在聊天互动中产生的文本进行高效审核，准确地将违规的政治敏感、恶意推广等内容进行过滤，避免不良信息的传播。\n\
    \n![](img/54d7dd15f0857a11a3f298484cc566c5_28_0.png)\n\n图 2-11 内容审核功能关联\n\n通过使用百度\
    \ AI 文本审核和图像审核技术，A 应用将内容审核的效率提高了 90%，节省了大量人力成本和时间成本。此外，A 应用通过图像审核技术实现了百万张头像图像的检测审核，并且\
    \ A 应用中的广告检测准确率高达 99%，为用户提供了健康的网络社交环境，优化了用户体验。\n\n## 课后实训\n\n- (1) 按照用户的使用需求进行分类，人工智能产品功能的类型不包括以下哪种？（\
