    \n使用 \\( R^2 \\) 对预测数据进行评分的代码如下。\n\n```\nfrom sklearn.metrics import r2_score\
    \ # 导入 r2_score 评分库\nr2_score(y, y_pred) # 对预测的数据进行评分\n```\n\n输出结果如下。\n\n```\n\
    0.21252628431\n```\n\n$R^2$ 指标取值范围为 [0,1], 指标的值越大, 模型越精确, 回归效果越显著。$R^2$ 的值介于 0\
    \ ~ 1, 越接近 1, 回归拟合效果越好, 一般认为该值超过 0.8 的模型拟合精度比较高。线性回归是基础的回归算法, 由结果可以看出, 采用线性回归模型完成本项目的实施效果并不好。因为各特征与目标变量的相关性并不是很强,\
    \ 因此采用线性回归模型并不能达到十分理想的效果。至此, 已经利用线性回归模型完成回归任务。\n\n## 知识拓展\n\n在知识准备中的 7.3 节可了解到,\
    \ 随机森林算法参数设置对回归结果影响较大。接下来具体介绍随机森林的参数设置及调优, 调用随机森林模型的代码如下。\n\n```\nfrom sklearn.ensemble\
    \ import RandomForestClassifier\n\nclf = RandomForestClassifier(n_estimators=10,\
    \ max_depth=2, random_state=0)\n```\n\n随机森林算法可选的参数如表 7-2 所示。\n\n## 表 7-2 随机森林参数说明\n\
    \n| 参数 | 说明 |\n|:---|:---|\n| n_estimators | 森林中树的棵数。该参数是典型的模型表现与模型效率成反比的影响因子\
    \ |\n| criterion | 度量分裂的标准。可选值有 mse (均方误差) 和 mae (平均绝对值误差) |\n| max_features |\
    \ 寻找最佳分裂点时考虑的特征数目。这一参数是针对单棵树来设置的, 通常来讲, 这个值越大, 单棵树可以考虑的特征越多, 则模型的表现就越好 |\n| max_depth\
    \ | 树的最大深度 |\n| min_samples_split | 分裂内部节点需要的最少样例数 |\n| min_samples_leaf | 叶节点上应有的最少样例数\
    \ |\n| max_leaf_nodes | 以 \"最优先先方式\" 生成最大叶节点的树, 最优节点定义为纯度相对减少, 如果值为 None 则不限制叶节点个数\
    \ |\n| bootstrap | 构建树时是否采用有放回样本的方式 |\n\n调整参数时, scikit-learn 库中的 GridSearchCV()\
    \ 函数是可用于调参的交叉验证函数, 使用这个函数可以便捷地找出模型的最优参数。所谓交叉验证, 可以简单理解为对模型评估更加准确的测试集。对某一分类器, 确定想要调参的名称和数值,\
    \ 将其作为一个字典传入这个函数, 然后该函数会返回最佳的参数组合。代码实现如下。\n\n```\nclf = GridSearchCV(estimator=rfc,\
    \ param_grid=tuned_parameters, cv=5, n_jobs=1)\n```\n\n调用该函数后, 即可输出使训练模型效果最佳的参数。\n\
    \n## 课后实训\n\n(1) 假设你正在做天气预报, 并使用算法预测明天的温度, 这是一个什么问题？ ( ) 【单选题】\n\nA. 分类      \
