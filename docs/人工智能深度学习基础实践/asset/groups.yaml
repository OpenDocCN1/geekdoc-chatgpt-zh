    ## 第2篇 深度学习数据应用


    在第1篇“人工智能产品研发”中，我们已经了解了人工智能需求管理、产品设计和平台应用方面的知识，熟悉了人工智能产品设计流程，并且针对不同的应用场景进行业务需求分析，完成产品设计方案并配置了合适的人工智能开发平台。


    在本篇中，我们将学习数据采集、数据处理以及数据标注的工程应用，了解图像类和文本类的数据处理方法，常用的数据标注工具与平台，最终根据业务需求完成对数据的应用。


    ## 项目 4 数据采集工程应用


    在互联网高速发展的今天，数据已经渗透到各个行业和业务职能领域，成为重要的生产要素，数据采集则是将这一生产要素收集起来。因此，数据采集工作为越来越多的行业所重视。


    - (1) 了解常见数据集和数据服务市场。

    - (2) 熟悉行业数据采集质量要求。

    - (3) 能够根据业务需求对数据集库进行管理操作。


    ### 项目描述


    在数据采集的过程中，如果不熟悉数据的来源、采集规范以及采集质量的要求，则可能导致采集到的数据不能满足开发需要。


    本项目就常见开源数据集和数据服务市场进行简单介绍，并详细解析行业数据采集的规范及采集质量的要求。最后通过介绍管理，操作 PaddlePaddle 数据集库的方法，分别查看数据集库中应用于计算机视觉领域和自然语言处理领域的相关数据集，并对其进行加载，使读者掌握加载
    PaddlePaddle 内置数据集的方法以便用于后续的模型训练。


    ### 知识准备


    ### 4.1 常见数据集和数据服务市场


    数据是人工智能应用的基础，而如何获取数据通常是人工智能入门者遇到的第一个问题。为此，科学家们整理出了大量数据集并开源发布，方便大家研究。接下来将简单介绍常见的开源数据集、行业数据集和数据服务市场。


    ### 4.1.1 开源数据集


    人工智能模型的训练需要大量的数据才能进行。对于缺乏数据采集经验的开发者而言，必然会花费大量的精力和时间去获取优质的数据集。开源数据集则能够帮助开发者解决这些问题，为人工智能的研究与发展提供助力。接下来将介绍图像类、文本类及音频类数据集中常见的开源数据集。


    - 1. MNIST


    MNIST 数据集是美国国家标准与技术研究院收集、整理的大型手写数字图像数据集。该数据集包含用于训练集的 60000 个示例图像以及用于测试集的 10000
    个示例图像。


    - 2. CIFAR-10


    CIFAR-10 数据集由 60000 个 32 像素 × 32 像素的彩色 RGB 图像组成，共包含 10 个不同的种类，每类有 6000 个图像。CIFAR-10
    数据集包括 50000 个训练图像和 10000 个测试图像。


    - 3. Spambase


    Spambase 数据集是来自大学的经典垃圾电子邮件数据集，由 5574 条英文垃圾短信组成，属于文本类数据集。


    - 4. SQuAD


    SQuAD 数据集（Stanford Question Answering Dataset）是于 2016 年推出的一个用于自然语言处理的数据集。此数据集的所有文章选自维基百科，数据集中一共有
    107785 个问题，以及配套的 536 篇文章。


    - 5. AudioSet


    AudioSet 数据集是谷歌公司于 2017 年开放的大规模的音频类数据集。该数据集包含 632 种音频类别，以及 2084320 条人工标记的每段时长为
    10 秒的声音剪辑片段，包括 527 个标签，该数据集的音频片段来自 YouTube。该数据集的内容涉及范围较广，包括人类与动物的声音、乐器与不同流派音乐的声音、日常的环境声音等内容。


    ### 4.1.2 行业数据集


    行业数据集作为行业内的重要生产要素，其价值不可小觑。随着信息化发展的逐步推进，数据共享使得行业数据集实现快速增值、增效，为行业的发展“添砖加瓦”。下面将介绍两个行业数据集的获取渠道。


    - 1. 百度 AI 公开数据集计划——BROAD


    百度公司于 2017 年推出百度 AI 公开数据集计划（Baidu Research Open-Access Dataset，BROAD），该数据集中的数据都是百度公司人工智能生态的真实数据。作为全球主要的中文搜索引擎公司，百度公司积累了数量与质量兼备的真实数据，通过将数据集开源的形式，为人工智能技术提供了发展动力。


    - 2. 阿里云天池


    阿里云天池除了面向国内开发者组织大数据竞赛、免费开放人工智能学习内容和提供开发者讨论、问答的技术社区等，近几年还开放了数以千计的数据集。作为阿里系唯一对外开放的数据分享平台，阿里云天池拥有独家的电商商品数据和用户行为数据、优酷视频的视频数据、饿了么和全球速卖通的物流数据等。另外，它还拥有天池大赛的比赛数据，如骨科数据、天文数据和问题生成数据等。


    ### 4.1.3 数据服务市场


    获取数据集的方式有多种，除了在网络上自行下载开源数据集和行业数据集，开发者也可以通过数据服务市场发布需求，通过第三方获取所需数据集。所谓数据服务是指提供数据采集、数据传输、数据存储、数据处理等数据各种形态演变的信息技术驱动的服务。随着各行各业对数据的重视程度越来越高，数据服务的市场规模也越来越大。目前，国内的数据服务厂商如雨后春笋般涌现，接下来将介绍国内常见的数据服务市场。


    - 1. 百度数据众包平台


    百度数据众包平台依托百度公司的产品体系、技术能力与行业经验积累，打造集数据采集及数据标注于一体的产品体系，助力数据资产化与数据要素流通的市场有序发展。其服务流程包括定制专属数据方案、执行数据解决方案、百度自动质检算法审核及人工
    4 轮审核等，确保客户获得高质量的数据。图 4-1 所示为百度数据众包平台官网界面。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_62_0.png)


    图 4-1 百度数据众包平台官网界面


    - 2. 京东众智


    京东众智是京东公司旗下的人工智能领域的数据服务平台，该平台致力于为业界提供领先的人工智能数据采集和标注的多元化解决方案，如图 4-2 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_63_0.png)


    图 4-2 京东众智


    在数据采集方面，京东众智可精确、高效地采集图像、语音、文本等数据，适用于各种复杂场景，可为客户提供高质量的源数据。除此之外，京东众智还是人工智能数据标注处理平台，可以完成数据清洗、提取以及特殊信息标注等操作。


    ### 4.2 PaddlePaddle 内置数据集


    百度 PaddlePaddle（飞桨）数据库中内置了许多用于计算机视觉模型和自然语言处理模型训练的数据集，同时为开发者提供了方便、快捷的调用接口。这些数据集中的数据已经经过清洗，开发者只需要通过调用相关接口，就可以快速实现数据集的训练集和测试集的加载并将其用于模型训练。目前在
    PaddlePaddle 数据库中内置的数据集共有 15 个。


    其中用于计算机视觉领域的数据集有 “DatasetFolder” “ImageFolder” “MNIST” “FashionMNIST” “Flowers”
