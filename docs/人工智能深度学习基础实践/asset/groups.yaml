    # 6.2.3 区域标注


    区域标注是针对图像的像素级别的分类标注。在一个图像中，每一个像素都会有其对应的标签，标注的结果是将图像调整为带有语义信息的色块，每个色块的类别一般只有一种。区域标注常常被用在计算机视觉领域中的语义分割中充当数据处理的手段。区域标注主要的应用场景包括自动驾驶中的道路识别和地图识别等。区域标注示例如图
