    # 3.3 实施思路


    基于对项目描述与知识准备内容的学习，在了解了典型人工智能开发平台的功能和业务操作流程后，我们现在应用 EasyDL 平台，尝试开发商品检测项目，以帮助读者掌握
    EasyDL 零售行业版的业务操作方法。以下是本项目实施的步骤。


    +   (1) 创建模型和 SKU。

    +   （2）上传数据并标注。

    +   （3）训练模型并校验。


