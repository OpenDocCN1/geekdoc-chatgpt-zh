    - C. 执行数据清洗规则\n- D. 清洗结果验证\n- (5) 数据质量评价方法包括以下哪两项？（ ）【多选题】\n- A. 定性评价法\n- B. 绝对评价法\n\
    - C. 定量评价法\n- D. 相对评价法\n\n## 项目 5 数据处理工程应用\n\n在机器学习和深度学习领域，通过数据处理选取合适的数据特征，往往能够带来更简单的模型和更好的结果。算法通常只能逼近人工智能模型应用效果的上限，而数据处理直接决定了人工智能模型应用效果的上限。\n\
    \n- (1) 了解常见应用场景的数据特征。\n- (2) 掌握数据预处理的方法。\n- (3) 掌握数据特征可视化的方法。\n- (4) 掌握数据特征挖掘的方法。\n\
    \n### 项目描述\n\n本项目将深入介绍数据特征的概念，以及通过数据处理挖掘数据特征的方法，并且通过对汽车油耗量数据集进行数据预处理、特征挖掘等实操步骤来帮助读者巩固相关知识。\n\
    \n### 知识准备\n\n### 5.1 数据特征\n\n在进行数据特征的挖掘前应先了解什么是数据特征。数据有着相应的特征，如在本项目中所使用的汽车油耗量数据集中，数据特征包括外部温度、汽油种类和天气状况等，但并非所有的特征都可以用于建模。区分特征是否可用的关键是看其对解决问题有没有意义。数据特征可以理解为对于建模任务有意义的特征。以下介绍\
    \ 3 个常见场景下的数据特征。\n\n#### 1. 物体检测\n\n物体检测是计算机视觉领域的一个热门方向。传统物体检测有两个非常重要的步骤——特征提取和机器学习，其中特征提取的步骤较为复杂，需要人为选取特征并进行特征处理。特征的质量对于识别的精确度起着至关重要的作用。图像数据的特征种类非常多，主要包括颜色特征、纹理特征、区域特征、边缘特征等。\n\
    \n#### 2. 销量预测\n\n对商品的特征进行挖掘和分析，可以帮助开发者建立更准确的商品销售预测模型，有助于商家对商品进行合理进货和布局。商品销量预测数据的特征一般包含商店名称、商品类型、商品价格、商品销量等。\n\
    \n#### 3. 语音交互\n\n语音交互包含语音识别、语音处理以及语音合成。人类语音中的词汇内容需要转换为模型可读的数据进行输入。语音的特征包括阅读的速度、声调和内容等。\n\
    \n### 5.2 特征工程\n\n特征工程指的是利用数据所在领域的相关知识来构建特征，将这些特征运用到预测模型中，以提高模型的预测精度。特征工程的目的在于发现对预测结果有明显影响的重要特征，其常见步骤包括数据预处理、数据特征可视化和数据特征挖掘。\n\
    \n#### 5.2.1 数据预处理\n\n数据预处理是特征工程的第一步。数据预处理一般包括数据清洗和数据分析等步骤。\n\n由于在真实的数据采集过程中，用作分析的数据集不可避免地会存在许多缺失值、异常值等，因此需要进行数据清洗。在数据清洗的过程中需要注意流程的规范，以保证清洗后的数据质量。\n\
    \n数据分析需要根据实际的任务需求来进行，没有十分固定的分析流程。在正式分析之前，更重要的是明确分析的意义，厘清分析思路之后再进行数据处理和分析，这样做往往会事半功倍。\n\
    \n#### 5.2.2 数据特征可视化\n\n为了更好地对数据特征进行分析，挖掘重要的特征，需要进行数据特征可视化。进行数据特征可视化能够更加直观地体现数据的特征，而要实现数据特征可视化一般离不开\
    \ Matplotlib 库和 seaborn 库。相比于 Matplotlib 库，seaborn 库可以提供更高层次的接口，能够用更少的参数进行数据可视化。利用\
    \ seaborn 库进行数据特征可视化的主要代码说明如表 5-1 所示。\n\n| 代码 | 功能 |\n| :--- | :--- |\n| import\
    \ seaborn as sns | 导入 seaborn 库 |\n| sns.stripplot(x,y,data,jitter,hue) | 分类散点图\
    \ x : x 轴数据 y : y 轴数据 data : 用于绘制的数据集 jitter : 用于分开重合的数据点 hue : 进行内部分类 以下相同参数用法相同\
    \ |\n| swarmplot(x,y,data,jitter,hue) | 分类散点图（防止点重叠） |\n| sns.boxplot(x,y,data,jitter,hue)\
    \ | 分类分布图（箱线图） |\n| sns.violinplot(x,y,data,jitter,hue) | 分类分布图（小提琴图） |\n| sns.pointplot(x,y,data,jitter,hue)\
    \ | 分类估计图（点线图） |\n| sns.barplot(x,y,data,jitter,hue) | 分类估计图（条形图） |\n| sns.countplot(x,y,data,jitter,hue)\
    \ | 分类估计图（计数条形图） |\n| sns.catplot(x,y,kind,data,jitter,hue) | 默认散点图 kind=swarm\
    \ : 散点图 kind=box : 箱线图 kind=violin : 小提琴图 kind=point : 点线图 kind=bar : 条形图 kind=count\
    \ : 计数条形图 |\n| plt.title(name,fontsize) | 设置图像名称 name : 标题名称 fontsize : 标题尺寸 |\n\
    | plt.xlabel(name,fontsize) plt.ylabel(name,fontsize) | 设置 x 轴 / y 轴 name : 坐标轴名称\
    \ fontsize : 坐标轴尺寸 |\n| plt.show() | 展示图片 |\n\n#### 5.2.3 数据特征挖掘\n\n对数据的特征有一定了解后，需要从大量的特征中选择少量的可用特征。特征并不都是“平等”的，与问题不相关的特征需要被删除。还有些特征与其他重要特征相比是冗余的。而特征选择就是自动选择对于问题最重要的特征的一个子集，其目的在于简化模型、缩短模型训练时间、提高模型通用性等。本项目所使用的数据集数据量不大，可以通过相关性分析来进行数据特征挖掘。\n\
    \n相关性分析一般使用皮尔逊相关系数进行计算。皮尔逊相关系数用于度量两个变量之间的线性相关程度。其取值范围为 `[-1.0, 1.0]`。如表 5-2 所示，通常情况下，可以通过皮尔逊相关系数的取值范围判断变量的相关性。\n"
