    # ### 4.3.3 数据质量评价方法


    对于所采集到的数据，《智慧城市 数据融合 第 3 部分：数据采集规范》文件中给出了相应的标准以供评价，数据质量评价方法具体可分为定性评价法和定量评价法。


    （1）定性评价法可根据事先确定的评价指标，对数据的安全性、目的、用途、日志以及用户自定义项目进行评价。


    （2）定量评价法可采用数据质量检测软件检查数据质量，也可通过辅助工具结合人工识别分析方法进行人工检查。一般可分为全数检查和抽样检查。全数检查是针对国家强制要求、特殊要求、其他可能导致严重影响的数据质量项目进行所有数据的逐一检查；抽样检查则是针对质量比较稳定、数据量较大、检查费用与时间有限的情况，抽取部分数据作为样本进行检查。


