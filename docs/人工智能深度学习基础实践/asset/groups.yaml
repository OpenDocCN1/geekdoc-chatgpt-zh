    ## 内容提要


    本书较为全面地介绍深度学习应用场景下的人工智能产品研发、深度学习数据应用、深度学习基础应用等内容。全书共10个项目，包括人工智能需求管理、设计人工智能产品、人工智能开发平台应用、数据采集工程应用、数据处理工程应用、数据标注工程应用、机器学习模型训练、深度学习框架应用开发、深度学习框架基础功能应用、深度学习线性回归模型应用等。本书以满足企业用人需求为导向，以岗位技能和综合素质培养为核心，通过理论与实战相结合的方式，培养能够根据深度学习项目需求，完成数据的采集、标注、处理等工作，以及机器学习模型训练、深度学习模型训练等工作的人才。


    本书适用于“1+X”证书制度试点工作中的人工智能深度学习工程应用职业技能等级证书（中级）的教学和培训，也适合作为中等职业学校、高等职业学校、应用型本科院校人工智能相关专业的教材，还适合作为需充实深度学习应用开发知识的技术人员的参考书。


