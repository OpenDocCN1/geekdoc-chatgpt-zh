    ## 2. DeepDive


    DeepDive 是一种从暗数据（ dark data ）中提取有价值信息的系统，暗数据指的是隐藏在文本、表格、图形和图像中的大量数据，由于这类数据缺乏相应结构，现有软件基本无法处理这些数据。DeepDive
    能够从非结构化信息（文本文档）中创建结构化数据（ SQL 表），并将这些数据与现有的结构化数据库集成。DeepDive 可用于提取实体之间复杂的关系，并可对涉及这些实体的事实进行推断。


    ## 3. IEPY


    IEPY 是一种开源的信息提取工具，在 GitHub 可以下载其 Python 开发源码。IEPY 的优点是可对大型数据集进行关于关系提取的语料标注操作。


    ## 6.1.3 音频数据标注工具


    用于音频数据标注的工具主要是 Praat 语音学软件，这是一款跨平台的多功能语音学专业软件，其主要用于对数字化的语音信号进行分析、标注、处理及合成等操作，同时可生成各种报表。图
    6-1 所示为 Praat 音频数据标注示例。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_84_0.png)


    图 6-1 Praat 音频数据标注示例


    ## 6.1.4 数据标注平台


    上文中所提到的标注工具，大多是针对某种类型的数据而开发的，而接下来介绍的是能够对多种不同类型数据进行标注的数据标注平台。近年来，相关平台如雨后春笋般涌现，国内的一些互联网公司、大数据公司和人工智能公司纷纷推出了自己的数据标注众包平台和商用标注工具，如百度众测、阿里众包、京东微工等，这些商用的数据标注平台基本都能对图像、视频、文本和音频等数据进行标注。


    除了以上所提到的商用标注平台之外，还有百度大脑推出的智能数据服务平台 EasyData。本项目将基于该平台实施。该平台为具有 AI 开发需求的企业及个人开发者提供一站式数据处理服务。EasyData
    支持图像、文本、音频、视频等多种类型数据的处理，以及机器学习数据的存储，该平台的数据标注功能如表 6-1 所示。


    ## 表6-1 EasyData的数据标注功能


    | 功能 | 描述 |

    | --- | --- |

    | 丰富的标注模板 | 支持图像分类、物体检测、图像分割、文本分类、短文本相似度分析、音频分类、视频分类等 |

    | 智能标注 | 提供人机交互协作标注服务，最高可降低 90% 的标注成本。目前智能标注已支持物体检测、图像分割等 |

    | 百度众测及数据服务商标注支持 | EasyData 已全面对接百度众测及 AI 市场中的优质数据服务商，数据服务商可以通过 EasyData 平台面向百度众测提交详细的标注需求
    |


    ## 6.2 数据标注常见任务


    了解完常用的数据标注工具与平台后，接下来介绍常见的数据标注任务。常见的数据标注任务包括分类标注、标框标注、区域标注、描点标注 4 种。


    ## 6.2.1 分类标注


    分类标注是指从任务中的标签中选取一个或者多个并将其赋给一条数据的任务。分类标注的应用十分广泛，可以应用于计算机视觉、自然语言处理和推荐系统中。在计算机视觉数据标注任务中，取决于任务的不同，一个图像可以被标注上一个或者多个任务的标签。如图
    6-2 所示，在自然语言处理中，可以标注出语句的情感或者语句中词的词性等。此外，自然语言处理任务存在曲谱生成等音乐领域的应用，此时数据的标签类别还可能是音符等。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_85_0.png)


    图 6-2 文本标注中的分类标注


    ## 6.2.2 标框标注


    标框标注是指在图像中选取要标注的实体，并使用方框描述其所在位置的任务。标框标注任务中包含分类标注，因为标框标注任务不仅需要标注人员找出标注实体所属的类别，更要使用方框描述实体所在的位置。标框标注一般应用于计算机视觉领域，其中常见的任务有自动驾驶、智能视频监控、工业瑕疵检测等。标框标注除了使用方框进行标注之外，还可以使用多边形框进行标注，使用多边形框一般比使用方框标注的精度更高。其中，使用多边形框进行标注时，除可能会分配一个或者多个标签之外，还有可能会涉及物体遮挡的逻辑关系，从而需要实现细线条的种类识别。标框标注示例如图
    6-3 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_85_1.png)


    图 6-3 标框标注


    ## 6.2.3 区域标注


    区域标注是针对图像的像素级别的分类标注。在一个图像中，每一个像素都会有其对应的标签，标注的结果是将图像调整为带有语义信息的色块，每个色块的类别一般只有一种。区域标注常常被用在计算机视觉领域中的语义分割中充当数据处理的手段。区域标注主要的应用场景包括自动驾驶中的道路识别和地图识别等。区域标注示例如图
    6-4 所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_86_0.png)


    图 6-4 车道线可行驶区域标注示例


    ## 6.2.4 描点标注


    描点标注指将需要标注的实体，按照任务要求在特定位置进行点位标注，实现特定位置的点位识别。其一般用在姿态估计、姿态跟踪和机器人学中。描点标注示例如图 6-5
    所示。


    ![](img/54d7dd15f0857a11a3f298484cc566c5_86_1.png)


    图 6-5 对人物的关节进行描点标注示例


    ## 6.3 数据标注质量标准


    数据标注的质量标准反映在两个方面：标注的数量以及标注的质量。要想获得标注质量高的数据，除了要选用优秀的数据标注工具，还要掌握各种数据标注的质量标准。以下是图像、文本以及音频的标注质量标准。


    ### 1. 图像标注的质量标准


    图像标注的质量好坏取决于像素点判定的准确性高低。标注像素点越接近被标注物的边缘像素点，标注的质量就越高，标注的难度也越大。如果图像标注要求的准确率为 100%，标注像素点与被标注物的边缘像素点的误差应该在
    1 个像素以内。


    ### 2. 文本标注的质量标准


    文本标注中涉及的任务较多，不同任务的质量标准是不同的。例如分词标注的质量标准是标注好的分词与词典中的词语一致，且不存在歧义；情感标注的质量标准则是对被标注句子的情感分类级别是否正确。


    ### 3. 音频标注的质量标准


    进行音频标注时，语音数据发音的时间轴与标注区域的音标需保持同步，标注于发音时间轴的误差要控制在 1 个语音帧以内。若误差大于 1 个语音帧，则很容易标注到下一个发音，造成噪声数据。


