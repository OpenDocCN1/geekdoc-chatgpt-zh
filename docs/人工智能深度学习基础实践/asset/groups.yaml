    # # 项目 3

    人工智能开发平台应用


    人工智能开发的基本流程通常包括需求分析、数据准备、模型训练、模型应用4个步骤。而模型构建与训练对于部分有定制模型需求的企业来说较难以实现，因为大部分中小企业并不具备专业的算法开发能力，真正懂人工智能、拥有丰富模型训练经验的人才寥寥无几。针对上述情况，部分拥有顶尖人工智能技术的头部企业开放技术框架、工程工具、平台、接口等，通过开放简易的人工智能开发工具或平台等方式，将技术公开给企业或个人开发者使用，从而降低了人工智能的入门门槛。


    +   (1) 了解相关的人工智能开发平台的功能。

    +   (2) 掌握人工智能开发平台的应用流程。

    +   (3) 掌握深度学习模型定制平台的业务操作方法。

    +   (4) 能够针对业务需求配置合适的人工智能开发平台。


    # 项目描述


