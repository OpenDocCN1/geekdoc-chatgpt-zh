    (14) 如图 3-41 所示，辅助标注功能分为两种模型，分别为“通用检测模型”和“通用检测模型 + 自训练定制模型”。以下对这两种模型进行简单说明。\n\n\
    - 通用检测模型：为图中的商品标上橙色无标签标注框 A，之后标注数据时只需要为目标 SKU 的所有橙色辅助标注框附上标签，其他不需要识别的无须处理，不会影响训练。\n\
    - 通用检测模型 + 自训练定制模型：为图中自训练模型可识别的商品标上蓝色有标签标注框 B，支持选择 2019 年 9 月 1 日后完成训练的模型版本，建议选择\
    \ mAP 数值高的模型版本。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_51_0.png)\n\n图 3-41\
    \ 查看两种辅助标注模型\n\n(15) 辅助标注功能还可以实现选择标注范围，以下进行简单说明。\n\n- 前 100 张图片：低于 100 张则标注全部图片，可在\
    \ 5 分钟左右完成。如果是第一次尝试标注不同包装类型的商品，如瓶装、袋装、盒装等，建议选择此项。如果需要立即开始标注图片，也建议选择此项，因为此项用时较短，可迅速完成辅助标注。\n\
    - 全部图片：未标注的图片量很大，可以等待数小时后再进行标注的，建议选择此项。未标注图片量和完成所需时间的关系大致为：完成所需时间 = 未标注图片量 / 100\
    \ x 5（分钟）。\n\n(16) 此处选择“通用检测模型”选项，在“选择标注范围”一栏选择“前 100 张图片”选项，单击“启动”按钮，启动辅助标注功能。此时会跳转至图\
    \ 3-42 所示的界面，等待 5 分钟左右即可完成标注。如果需要取消辅助标注或者更换标注模型，可以单击“终止”按钮。\n\n![](img/54d7dd15f0857a11a3f298484cc566c5_51_1.png)\n\
