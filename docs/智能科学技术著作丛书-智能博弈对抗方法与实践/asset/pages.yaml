    24 帧/s 的频率改变。若以环境改变 8 帧玩家进行一个动作的平均水平来看，玩家仍需要以每秒 3 个动作的频率进行博弈。不仅如此，玩家输出的动作有一定的持续性，需要在一定的时间持续执行，而非棋类游戏玩家的动作是间断的、突发的、瞬时的。


