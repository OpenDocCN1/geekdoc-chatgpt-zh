  md: '# # 1.2 智能博弈对抗内涵与意义


    # ## 1.2.1 智能博弈对抗


    广义上的智能概念涵盖了人工智能、机器智能、混合智能和群体智能。本节的智能概念特指认知智能中机器的自主决策能力，即机器智能，表现为机器模拟人类的行为、思考方式，通过摄像头、话筒等传感器接收外界数据，与存储器里的数据对比、识别，从而进行判断、分析、推理、决策。机器智能的智能水平可分为若干层次，从最简单的应激反射算法，到较为基础的控制模式生成算法，再到复杂神经网络和深度学习算法。博弈与对抗是人类演化进程中的重要交互活动，是人类智能和人类思维方式的重要体现。这种交互活动广泛存在于个体与个体、个体与群体、群体与群体之间。


    智能博弈对抗主要围绕“如何使用新的人工智能范式设计先进智能体”，并通过人机对抗、机机对抗和人机协同对抗等方式研究计算机博弈领域的相关问题。其本质就是通过博弈学习方法探索人类认知决策智能形成过程，研究人工智能程序升级进化并战胜人类智能的内在生成机理和技术途径，为类人智能研究走上强人工智能之路提供支撑。


    智能博弈对抗问题的研究包含“环境、人、人工智能程序”三要素。其中，“环境”，即博弈对抗空间，具有巨复杂、高动态、不确定、强对抗等特性。“人”是人类智能的载体，以人机对抗等形式直观地衡量人工智能程序的智能水平，在人工智能程序学习中也起到“引导”的作用。“人工智能程序”是机器智能的载体，人工智能程序在初级阶段通过与人交互，学习人类认知决策方法，模仿人类智能，并战胜人类玩家；中级阶段通过种群进化成更加鲁棒的人工智能程序并战胜群体获得高阶段位；最终阶段是获得类人智能走上强人工智能之路，走上人机协同、人机融合和人机共生的道路，为提升人类认知决策服务。总之，智能博弈对抗是以智能体对抗为基本途径，以多智能体动态博弈学习为核心技术，实现人工智能程序迅速进化、提升认知决策智能的研究过程，为实现强人工智能提供重要支撑。


    智能博弈对抗逐渐成为研究认知智能的一种新范式，智能博弈对抗系统为探索人工智能程序认知决策能力提供了有效的验证环境，基于深度强化学习和计算博弈理论的多智能体学习方法为智能博弈对抗提供了关键技术支撑。得益于云计算、大数据及多智能体学习等关键技术的助力，智能博弈对抗更具通用性。


    # ## 1.2.2 相关概念


    智能博弈对抗与计算机博弈、人机对抗等概念，在研究内容上有交叉点。本'
