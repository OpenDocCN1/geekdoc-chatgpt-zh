    # 2. 学习目标多维


    学习目标支配着多智能体学习的整个过程，为学习方法的评估提供了依据。Powers 等[51]在 2004 年将多智能体学习的学习目标归类为理性、收敛性、安全性、一致性、相容性、目标最优性等。Busoniu
    等[12]将学习的目标归纳为稳定性(包括收敛性、均衡学习、可预测、对手无关等)和适应性(包括理性、无悔、目标最优性、安全性、对手感知等)。Diovanni
    等[52]将帕累托有效性也看成多智能体学习目标。如表 2.3 所示，稳定性表征了学习到一个平稳策略的能力，收敛到某个均衡解，可学习近似模型用于预测推理，学习到的平稳策略与对手无关。适应性表征了智能体能够根据所处环境，感知对手状态，理性分析对手模型，做出最佳响应，在线博弈时可以学习一个奖励不差于平稳策略的无悔响应；目标最优性、相容性与帕累托有效性、安全性表征了其他智能体可能采用固定策略、自对弈学习方法时，当前智能体仍能适应对手，达到目标最优的适应性要求。


    # 表 2.3 多智能体学习的目标


    | 稳定性 | 适应性 |

    | --- | --- |

    | 均衡学习 (equilibrium learning)[53] | 最佳响应 (best response)[53] |

    | 收敛性 (convergence)[54] | 理性 (rationality)[54] |

    | 可预测 (prediction)[55] | 无悔 (no-regret)[56] |

    | 对手无关 (opponent agnostic)[57] | 对手感知 (opponent aware)[58] |

    | | 目标最优性、相容性与帕累托有效性、安全性[49-52] |


    # 3. 环境(对手)非平稳


    多智能体学习过程中，环境状态和奖励都是由所有智能体的动作共同决定的；各智能体的策略都根据奖励同时优化；每个智能体只能控制自身策略。基于这三个特点，非平稳性成为影响多智能体学习求解最优联合策略的阻碍，并发学习的非平稳性包括策略非平稳性和个体策略学习环境非平稳性。当某个智能体根'
