    当前，多智能体强化学习方法得到了广泛研究，但此类方法的学习目标是博弈最佳响应。如表 2.5 所示，当前多智能体强化学习方法根据训练和执行方式可分为四类：完全分散式、完全集中式、集中式训练分散式执行和联网分散式训练。


    (1) 对于完全分散式学习方法，研究者在独立 Q (Independent-Q) 学习方法[72]的基础上进行了价值函数更新方式的改进。分布式 Q (Distributed-Q)
    学习方法[61]将智能体的个体动作价值函数视为联合动作价值函数的乐观映射，设置价值函数只有在智能体与环境和其他智能体的交互使对应动作的价值函数增大时才更新。迟滞
    Q (Hysteretic-Q) 学习方法[73]通过启发式信息区分“奖励”和“惩罚”两种情况，分别设置两个差别较大的学习率克服随机变化的环境状态和多最优联合策略情况。频率最大
    Q 值 (frequency maximum Q, FMQ) 方法[74]引入最大奖励频率这一启发信息，使智能体在进行动作选择时倾向曾经导致最大奖励的动作，鼓励智能体的个体策略函数通过在探索时倾向曾经频繁获得最大奖励的策略，提高与其他智能体策略协调的可能性。容忍式
    MARL (Lenient MARL) 方法[75]采用忽略低奖励行为的宽容式学习方法。分布式容忍 Q (Distributed Lenient Q) 学习[76]采用分布式的方法组织容忍值函数的学习。


    (2) 对于完全集中式学习方法，交流神经网络 (communication neural net, CommNet) 方法[77]是一种基于中心化的多智能体协同决策方法，所有的智能体模块网络会进行参数共享，将奖励平均分配给每个智能体。CommNet
    方法接收所有智能体的局部观察作为输入，然后输出所有智能体的决策，因此输入数据维度过大会给方法训练造成困难。双向协调网络 (bidirectionally-coordinated
    nets, BiCNet) 方法[78]通过一个基于双向循环神经网络 (recurrent neural network, RNN) 的确定性 Actor-Critic
    结构来学习多智能体之间的通信协议，在无监督情况下，可以学习各种类型的高级协调策略。'
