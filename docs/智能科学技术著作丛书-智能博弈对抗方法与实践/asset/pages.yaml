    # 6.3.2 德州扑克智能博弈系统


    与其他智能博弈系统的框架类似，基础的德州扑克智能博弈系统通常由服务端(引擎)、客户端(扑克 AI)以及通信协议构成。为满足“数据加载”“资源管理”“人机对战”等需求，扩展的德州扑克智能博弈系统框架如图
    6.5 所示，增加了人机交互界面(用于人机对战界面显示)、扑克算法库(用于人机对战 AI 的加载)、数据库(用户管理、存储及加载样本数据、CFR 值等)、协议转换(连接其他不同协议的平台)等模块。为提高算法学习训练效率，可进一步部署分布式训练框架，支持基于种群的强化学习算法等。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_172_0.png)


    图 6.5 扩展的德州扑克智能博弈系统框架


    服务端：主要实现建立房间控制对抗过程、调用扑克引擎、消息传输、管理调用本地 AI 玩家等功能。从引擎层面看，可以根据不同需求定制传输的信息内容与数据格式。现有使用广泛的德州扑克引擎有
    ACPC 服务端、RLCard 等。从消息传输层面看，扑克智能博弈系统服务器分为“监听”和“接收”两个部分。监听通过套接字 (socket) 方式完成前端玩家与各个
    AI 进行消息传递，接收通过使用消息总线的方式与智能体进行通信。具体通信逻辑详见图 6.6。


    客户端：主要用于部署测试 AI 算法。客户端 AI 接收到服务端预备消息后，进入房间，在对抗过程中不断接收服务端的对抗状态信息，生成决策动作后，按既定数据格式向服务端发送。'
