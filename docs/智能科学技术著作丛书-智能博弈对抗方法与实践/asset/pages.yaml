  md: '# 2.5.2 在线博弈策略学习方法


    由离线学习得到的博弈策略通常被称为蓝图策略。在线对抗过程中，可完全依托离线策略，如依据情境元博弈选择对抗策略，但难以对抗非平稳对手的策略动态切换、故意隐藏与欺骗。在线博弈过程中通常需要及时根据对手表现和所处情境进行适应性调整，其本质是一个对手意图识别与对抗策略选择问题。当前在线博弈策略学习包括在线无悔学习方法[159]、对手建模与利用方法[160]、智能体的匹配及协作学习[161]。


    # 1. 在线无悔学习方法


    在线决策过程的建模方法主要有在线 MDP[162]、对抗 MDP[163]、未知部分可观 MDP[164]、未知马尔可夫博弈[165]等。无悔学习作为一种在线凸优化方法是在线博弈策略学习的重点研究方向。其中无悔本是指随着交互时长趋近无穷大，期望后悔值趋近于
    0。Kash 等[166]将无悔学习与 Q 值函数结合设计了新的后悔匹配方法。其中比较典型的无悔学习方法有 Hedge[95]和 MWU[96]等。Dinh
    等[113]利用 Hedge 方法，证明了受策略的支撑集数量约束的在线动态后悔值的界。Lin 等[167]和 Lee 等[168]对无悔学习的有限时间未次迭代
    (last-iterate) 收敛问题展开了研究。Daskalakis 等[169]研究了几类面向一般和博弈的近似最优无悔学习方法的后悔界。此外，事后理性[170]作为一个与后悔值等效的替代目标，描述如何在线学习与其他智能体最佳关联策略。


    # 2. 对手建模与利用方法


    通过对手建模可以合理预测对手的行动、发掘对手的弱点以备利用。当前对手建模方法主要分为与博弈领域知识关联比较密切的显式建模方法和面向策略的隐式建模方法。面向在线策略学习的对手利用方法需要面对不可预测的环境与非平稳对手，利用少量历史交互信息在线生成对手模型。Wu
    等[151]利用元学习生成难被剥削对手和多样性对手模型池来指引在线博弈策略学习。Kim 等[171]利用对手建模与元学习设计了面向多智能体的元策略优化方法。Foerster
    等[58]设计的对手感知学习方法是一类考虑将对手纳入己方策略学习过程中的学习方法。da Silva 等[172]提出的在线自对弈课程方法通过在线构建对抗课程引导博弈策略学习。


    # 3. 智能体的匹配及协作学习


    多智能体博弈通常是在多角色协调配合下完成的，各类智能体的临时组队可以看成机制设计问题。Wang 等[173]设计了面向多类角色的多智能体强化学习方法。Gong
    等[174]利用协同与压制关系图嵌入的方式研究了多智能体匹配在线规划问'
  merge: -1
