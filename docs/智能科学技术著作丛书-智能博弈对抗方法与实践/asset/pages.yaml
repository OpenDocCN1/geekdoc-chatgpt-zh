- pgno: 246
  md: '节点的方式来瓦解网络，主要有高度数自适应方法[36]。②基于最优破环的方法是用最少的节点移除网络中所有的环，这样网络会被瓦解成小的模块，主要有三阶 Min-Sum
    方法[37]。③基于图分割的方法主要思想是用最少的点将图分成大小相等的两块或多块，然后用相同的方法继续分解，最终将图完全分割，主要有 Hagen 等[38]提出的“比率割”方法。④基于元启发式方法将网络瓦解问题看成不同目标函数和约束条件的组合优化问题，主要有基于禁忌搜索的最优瓦解策略[39]。⑤基于网络重构的方法通过链路预测方法对网络进行恢复，然后采用网络瓦解方法对其进行瓦解，例如，谭素怡[40]使用链接预测恢复一些缺失的网络信息以建立网络瓦解模型。


    # 3. 复杂网络防御


    与复杂网络瓦解问题相对，日益频繁的突发事故以及蓄意的攻击对于关键基础设施网络、社交网络等有益网络的安全运行提出了严峻的挑战。如何才能提高网络的防御能力是我们迫切需要解决的问题。针对这一问题，当前复杂网络防御主要从以下四个方面展开研究：①基于博弈的方法。对于防守方如何根据攻击方的不同攻击策略来取最优的防御部署，可以采用博弈论框架解决这一问题，如基于施塔克尔贝格博弈的非对称信息下主动欺骗防御动态博弈模型[41]。②基于网络修复的方法。主要思想是利用资源对被攻击节点进行修复，例如，Majdandzic
    等[42]提出从结构功能角度出发对复杂网络进行修复的方法。③基于优化网络结构鲁棒性的方法。许多学者尝试通过优化网络结构提高鲁棒性，增强复杂网络的防御能力，例如，以色列巴伊兰大学的
    Yehezkel 等[43]提出增加链接的防御方法。④基于隐藏欺骗的方法。在现实世界中，攻击者能够获得的网络信息是不完全的。隐藏欺骗方法是利用不完全信息特点改变“攻防不对称”劣势的创新思路，成为当前网络防御研究的重要研究方向之一，如任保安[44]基于观测信息伪装的攻击迁移模型提出的主动欺骗观测网络生成方法。


    # 10.4 平均场博弈与无人机集群对抗


