    # 1.3.2 序贯策略类对抗


    # 1. 围棋


    围棋(图 1.8)是一种完全信息下的两人动态博弈，也是人工智能领域的典型代表问题。虽然围棋棋盘仅有 19×19 = 361 个交叉的落子点，但其策略空间巨大，以至于无法直接求得必胜策略的解析解。计算机围棋通过遍历搜索博弈树(约含
    b^d 个落子情况序列，b 是搜索宽度，d 是搜索深度)上的最优值函数来评估棋局和选择落子位置。与象棋等具有有限搜索空间的棋类不同，围棋的计算复杂度约为 250^150。'
