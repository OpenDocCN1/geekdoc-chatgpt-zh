    # 3.3.2 基于值函数的方法


    基于值函数的方法是强化学习的基础，但是其研究的状态和动作对象大都是离散的。因此，基于值函数的方法一度被梯度优化方法取代。基于值函数的方法关注的是在某个状态下执行某个动作的具体量化标准。因此，它讨论的最重要的概念就是奖励和值函数。由于在回合制问题中，强化学习的目标是优化长期奖励。假设某一个回合在第
    T 步达到终止，那么可以定义在第 t 步之后的累计奖励：


    \( G_t = R_{t+1} + R_{t+2} + \cdots + R_T \) (3.32)


    通过这样的定义可以规定长期的累计奖励。但是不难看出，这样的定义会导致长期累计奖励最终趋向于无穷大。


    为了解决这个问题，基于值函数的方法引入了折扣因子的概念。折扣因子通常用 \(\gamma\) 表示。引入 \(\gamma\) 后，累计奖励可以改写成：


    \( G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \cdots = \sum_{k=0}^{\infty}
    \gamma^k R_{t+k+1} \) (3.33)


    通过式 (3.33) 就可以表示长期动作奖励。但在实际应用中，使用这样求和的方法实现就显得非常复杂。同时，在行动执行时，并不知道后面即将执行的动作和结果。因此，这样做也是不现实的。这时候需要用到另一个重要的定义“值”。在描述
    MDP 时，定义交互序列 \(\tau\) 。根据策略和状态转移概率得到的序列，那么“值”的公式定义就可用数学期望的形式表示：


    \( v_\pi(s_t) = E_{s,a \sim \pi} \left[ \sum_{k=0}^{\infty} \gamma^k r_{t+k+1}
    \right] \) (3.34)


    实际上根据 MDP 建模的强化学习方法将值函数分为两种：状态值函数和动作值函数。这两者互相区分又有着密不可分的联系。


    +   (1) 状态值函数 \(v_\pi(s_t)\) 表示在当前状态 \(s\) 下，以某种策略选择动作并产生后续的长期奖励值。


    +   (2) 动作值函数，有时也称状态-动作值函数。顾名思义，就是已知当前的状态和在此状态下采取的动作，并按照某种策略产生的长期奖励值。


    实际上，在强化学习中使用这种形式的定义仍然很困难。我们的目标是依照'
