- pgno: 55
  md: '引入可以观察全局的 Critic 来指导训练，而测试阶段便不再有任何通信交流，只使用有局部观测的 Actor 采取行动。因此，MADDPG 方法可以同时解决协作环境、竞争环境以及混合环境下的多智能体问题。值分解网络
    (value-decomposition networks, VDN) [81]、QMIX [82]、多智能体变分探索网络 (multi-agent variational
    exploration networks, MAVEN) [83]、Q 变换分解 (Q factorize with transformation, QTRAN)
    [84] 等方法采用值函数分解的思想，按照智能体对环境的联合奖励的贡献大小分解全局 Q 值函数，很好地解决了信度分配问题，但是现有分解机制缺乏普适性。VDN
    方法采用深度并发 Q 网络 (deep recurrent Q network, DPQN)，中心化地训练一个由所有智能体局部的 Q 网络加和得到联合的 Q
    网络，训练完毕后每个智能体拥有基于自身局部观察的 Q 网络，可以实现去中心化执行。该方法不仅处理了由环境非平稳带来的问题，解耦了智能体之间复杂的关系，还解决了由部分可观察导致的伪奖励和懒惰智能体问题。采用
    VDN 方法求解联合价值函数时只是通过对单智能体的价值函数简单求和得到，使得学习到的局部 Q 值函数表达能力有限，无法表征智能体之间更复杂的相互关系。QMIX
    对从单智能体价值函数到团队价值函数的映射关系进行了改进，在映射的过程中将原来的线性映射变换为非线性映射，并通过超网络的引入将额外状态信息加入到映射过程，提高了模型性能。MAVEN
    采用了增加互信息变分探索的方法，通过引入一个面向层次控制的隐层空间来混合基于值和策略的学习方法。QTRAN 是一种更加泛化的值分解方法，可成功分解任何可分解的任务，但是并未涉及无法分解的协作任务的问题。


    (4) 联网分散式训练方法是一类利用时变通信网络的多智能体学习方法，其决策过程可建模成时空马尔可夫决策过程，智能体位于时变通信网络的节点上。每个智能体基于其本地观测和连接的邻近智能体提供的信息来学习分散的控制策略，智能体会得到当地奖励。多智能体演员-评论家
    (multi-agent actor-critic, MAAC) [85] 方法是基于 Actor-Critic 方法提出来的，每个智能体都有自己独立的 Actor
    网络和 Critic 网络，每个智能体都可以独立决策并接收当地奖励，同时在网络上与邻近智能体交换信息以得到最佳的全网络平均奖励，该方法提供了收敛性的保证。多智能带来的维数诅咒和解的概念计算困难等问题，使得其很具有挑战性。可扩展演员-评论家
    (scalable actor-critic, SAC) [86] 方法，可以学习一种近似最优的局部策略来优化平均奖励，其复杂性随局部智能体 (而不是整个网络)
    的状态-动作空间大小而变化。神经网络交流 (neural communication, NeurComm) 方法 [87] 通过设计一种可分解通信协议，可以自适应地共享系统状态和智能体动作的信息，该方法的提出是为了减少学习中的信息损失和解决非平稳性问题，为设计自适应和高效的通信学习方法提供了支撑。近似多智能体拟合
    Q 迭代 (approximate multi-agent fitted Q iteration, AMAFQI) [88] 是一种多智能体批强化学习的有效逼近方法，采用迭代策略搜索方式，根据集中式标准
    Q 函数的多个近似生成贪婪策略。'
