  md: '# 4.3.3 混合对抗规划


    由于策略对抗规划通常会牺牲短期的战术表现来获得更好的长期策略决策。战术对抗规划方法则相反。近年来，国内外学者还提出了很多混合对抗规划方法，主要是通过将两大类方法集成到一种方法中来执行两种类型的规划。这种混合方式很好地模仿了人类进行策略和战术规划的方式。


    +   1. 规划知识引导


    一些基于领域知识的策略规划方法采用由专家提供的各种编码知识。分层任务网络(hierarchical task networks, HTN)是即时策略博弈中最常用的领域可配置规划器。HTN
    是一种分层结构，由一个目标节点和多个子节点组成，这些子节点代表原始任务或非原始任务，智能体可以立即执行基本任务，而对于非基本任务必须使用某种方法将其分解成基本任务。Ontanón
    等[51]首次提出了结合 HTN 规划和博弈树搜索的对抗性分层任务网络(adversarial HTN, AHTN)规划算法，即为博弈对抗各方均构造一个 HTN，采用极大极小搜索方法，在每次迭代中，相应玩家的
    HTN 被扩展，并且原始动作被执行，AHTN 适用于持续性和同时性动作，性能优于 μRTS (μ real time strategy) 中的内置智能体。如图
    4.8 所示，AHTN 算法采用 Alpha-Beta 剪枝方法为每个分支加入一个评估，利用递归函数对未来行动进行预估。


    由于 AHTN 没有考虑任务失败的概率，忽略了任务之间的关系。Sun 等[52]在 AHTN-R (adversarial hiarachical task
    network-repair, 带修复的对抗性分层任务网络) 中解决了这些问题，提出了一种任务修复机制，可以检测失败的任务并进行重规划，从预定义的列表中选择一个替代任务。Sun
    等[53]在 AHTN (adversarial hiarachical task network, 对抗性分层任务网络) 中采用对手策略来模拟对手行为生成博弈树的
    Min 节点。Neufeld 等[54]提出了一种基于 HTN 与 MCTS 的混合规划算法。利用 HTN 进行策略规划，利用 MCTS 进行战术规划。每个
    HTN 基元任务都用一个评估函数来表示，该函数被传递给补素 MCTS。每个评估函数旨在引导补素 MCTS 生成特定任务。其中函数的权重是手动调整的。实验结果表明，相对于
    AHTN 和补素 MCTS，这种混合规划方法性能有了很大提高。


    +   2. 行动语法识别


    组合分类语法(combinatory categorial grammar, CCG)是一种高效的、语言表达的语法形式主义，用于自然语言处理中生成和识别自然语言句子。CCG
    把特定语言的结构(词汇)从语法中分离出来。由于其识别性和生成性，CCG 恰好非常适'
