    Churchill 等[30]提出的基于爬山算法的组合贪婪搜索(portfolio greedy search, PGS)方法，不是为了优化每个单元选择采取哪种行动，而是为每个单元选择最优的脚本来控制单元动作。与其他搜索算法相比，这些算法在大中型单元战斗中的性能明显优于纯脚本玩家，并且显示出了巨大的控制效率。如图
    4.5 所示，初始脚本动作默认为 NOK-AV，统一迭代阶段采取一方固定不变的情况优化另一方，采用 Playout 方法进行效果评估，直到决策时间结束，输出局部最优解。


