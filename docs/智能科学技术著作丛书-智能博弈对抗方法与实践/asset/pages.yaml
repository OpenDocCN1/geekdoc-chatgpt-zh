    Alpha-Beta(Alpha-Beta consider duration, ABCD)方法[29]和考虑时长的 UCT 方法[30]。其中 ABCD
    方法解决了即时策略博弈对抗过程中存在的动作同时执行以及动作持续执行两个问题。


    # 2. 蒙特卡罗树搜索


    MCTS 本质上是一种基于最佳优先搜索和蒙特卡罗估值的前向树搜索算法。通过随机采样方式来获得相关数据，构建博弈树模型以用于搜索，基于统计结果得出最终决策。针对即时策略游戏中环境动态变化的问题，MCTS
    以实时搜索的方式产生在线决策。基本的 MCTS 算法包括在预先设置的计算资源内（一般指迭代次数或者运行时间）迭代地构建一棵非对称的搜索树，然后停止搜索并返回根节点上的最优动作。搜索树中的每个节点表示状态，指向子节点的定向链接表示导'
