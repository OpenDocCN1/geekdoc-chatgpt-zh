  md: '其中状态主要是离散和充分观察。因此，大多数强化作业都是基于无模型的方法。无模型强化学习可以通过大量样本估计智能体的状态、值函数和奖励函数，以优化动作策略，旨在通过执行状态中的动作获得更多的奖励。由于其简单的实现和丰富的开放资源，无模型强化学习吸引越来越多的学者进行进一步的研究。


    # 1. 基于 Q 网络的方法


    深度 Q 网络(deep Q-network，DQN)是深度强化学习的典型代表，使用卷积神经网络(convolutional neural network，CNN)作为模型，并使用
    Q 学习的变体进行训练。DQN 使用最大 Q 值作为低维动作输出来解决高维状态输入(如游戏图像中的原始像素)的表示。此外，DQN 将加成值和误差项降低到一个有限的区间，从而减轻了非线性网络所表示的值函数的不稳定性。与
    Q 学习方法不同，DQN 同步学习过程和训练过程，主要改进如下：①采用经验重放缓冲区来减少样本之间的关联；②采用深度神经网络用于动作值函数逼近。当解决各种基于视觉感知的深度强化学习任务时，DQN
    使用相同的网络模型、参数设置和训练方法，证明该方法具有高适应性和通用性。在 2015 年，谷歌旗下的 DeepMind 公司提出的 DQN 取得成功后又掀起了对值函数强化学习方法研究的热潮。DQN
    方法在经典的雅达利平台 49 个游戏的测试中取得了极大的成功[14]，再一次掀起了人工智能的浪潮。


    自 DQN 成功以来，大量的改进方法相继提出。受传统体系结构(如卷积神经网络、长短期存储器或自动编码器)的限制，DQN 方法还存在一些缺点，如缺乏长期内存能力。Hausknecht
    等[15]通过用递归长短期记忆(long short term memory，LSTM)网络替换第一个卷积后完全连接层，研究了在 DQN 中添加递归的影响。Wang
    等[16]基于决斗架构的 DQN 扩展，通过单独表示状态值和动作优势来帮助跨动作进行泛化。异步优势演员-评论家(asynchronous advantage
    actor critic，A3C)[17]通过多步目标引导来平衡偏差与方差。噪声 DQN 方法[18]使用随机网络层进行探索。分布式 Q 方法[19]学习奖励的分类分布，而不是估计平均值。由于上述
    DQN 的独立改进基于一个共享框架，Rainbow 方法[20]可以合理地将它们结合起来。实验结果表明，该组合在雅达利 2600 基准上提供了最优的数据效率和性能。从对
    Rainbow 的研究来看，确定优先级对智能体的性能是最重要的。Ape-X 方法[21]利用大规模深度强化学习的分布式架构，使用数百名 Actor 收集数据并通过不同
    Actor 获得大量具有不同优先级的重放缓冲区，实验表明，Ape-X 在训练时间内性能几乎比 Rainbow 所提方法提高了一倍。


