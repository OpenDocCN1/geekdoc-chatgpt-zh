  md: "前的博弈过程是固定的。但其缺点是非安全子博弈解缺乏理论支持，在很多情况下效果不佳，因为它对历史信息的假设过于绝对，也就导致其实用性较差。尽管如此，在一些简单的博弈环境下，还是可以使用它去求解简单的博弈问题。\n\
    \n+   2) 子博弈重新求解\n+   \n+   子博弈重新求解需要明确对手的可选动作范围，以及在上一轮条件下，对手选择各个动作能产生的收益值。子博弈重新求解可以重建一个策略，且只用于博弈的剩余部分。在子博弈重建求解过程中，每个对手会生成上一局态势下选择各动作的得分向量，向量中的每一个元素对应采取某一动作的收益值。该策略最大的好处在于增加了博弈主干的边界和子博弈可用的资源。然而，如果主博弈的策略是固定的，选择子博弈的最优解便不一定是全局最优的，因为对手选择的动作永远是固定的，计算其他动作的收益值没有意义。另外，多个动作的收益值相同也会使得策略效果不佳。\n\
    \n+   3) 最大边际求解\n+   \n+   基于子博弈重新求解的最大边际求解[1]技术能够优化子博弈策略，它定义了每个信息集的子博弈边际，进入子博弈树将得到一个惩罚值。最大边际能够强化子博弈找到一个纳什均衡策略。强化子博弈能够通过最大化最小边际求解，使用的迭代算法包括过间隙技术（excessive\
    \ gap technique，EGT）[12]和 CFR 等。最大边际求解是比较保险的，但该策略所求出的解往往过拟合于假设的模型，所以其效果与子博弈重新求解的效果类似。\n\
    \n# ## 6.3 德州扑克智能博弈 AI 构建\n\n# ### 6.3.1 德州扑克 AI 研究历程\n\n在驱动计算机扑克 AI 能力不断提升的过程中，阿尔伯塔大学、卡内基梅隆大学等具有十分突出的贡献。\n\
    \n+   1. 阿尔伯塔大学扑克 AI 研究历程\n\n加拿大阿尔伯塔大学计算机扑克研究组为人工智能领域输出了大批学术和应用成果，在德州扑克方面的研究更是取得重大突破，相关研究成果如表\
    \ 6.3 所示。阿尔伯塔大学计算机扑克研究组使用基于规则的方法开发出第一个扑克程序，根据给定的博弈状态，输出特定的动作，能够击败较弱玩家。在此后的几年里，扑克程序中陆续出现了对手建模和神经网络建模等技术，计算机博弈水平显著提高。\n\
    \n2003 年，Billings 等[13]针对两人有限注德州扑克问题，提出了最优策略理论，虽然没有考虑对手的相关信息，但构建的智能体表现出了较高的博弈水平。"
