  md: '# 6.3.4 多人无限注德州扑克 AI 实现


    # 1. 实验设置


    本节主要设计实现六人无限注德州扑克 AI。每局开局有效筹码为 20000，小盲注为 50。采用 Yuan 等[31]提出的方法 (MuCFVnet) 构建多人德州扑克
    AI，加速最佳响应求解计算，在硬件配置为 80 核 CPU、4 块 TITAN RTX GPU、128GB 内存的服务器上运行。其他五个对手分别为：松凶型对手
    (rule based loose aggressive, RB-LA) (起手牌范围很宽，风格激进，经常会在翻牌前和翻牌后加注或者诈唬)、紧凶型对手 (rule
    based tight aggressive, RB-TA) (与松凶型玩家不同的是，紧凶型对手攻守兼备，起手牌范围较窄，相对胜率较高)、MCCFR-OM
    (MCCFR opponent modelling) 对手 (决策方法结合 MCCFR 与对手建模)、MCCFR-OM-RB 对手 (决策方法结合 MCCFR、对手建模和规则)
    和集成投票型对手 (EV) (基础投票模型为 MCCFR、对手建模模型和近端策略优化模型)。


    # 2. 结果分析


    实验结果如图 6.11 和图 6.12 所示，在 1000 局对战中，MuCFVnet 赢得总筹码数量最大，胜率最大，性能优于 MCCFR 的变体算法。其次，集成投票的方法表现欠佳，甚至不如基于规则的算法。最后，值得注意的是基于规则的松凶型总筹码数量位居第一，说明了紧凶型打法效果十分显著，现实扑克游戏中也是如此。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_177_0.png)


    图 6.11 多人德州扑克对战总筹码统计'
