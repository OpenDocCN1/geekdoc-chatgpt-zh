    COMA 策略梯度一般难以推广到大规模智能体环境中。


    # 2. VDN 算法


    同 COMA 策略梯度算法一样，多智能体学习的 VDN 算法[2]也是考虑协作任务的多智能体强化学习算法，即所有的智能体共享同一个奖励值(即团队奖励)。与
    COMA 策略梯度算法不同，VDN 算法是一种基于值函数的方法。


    多智能体强化学习任务中，值函数分解的思想来源于“集中式行为值函数”和“独立单智能体强化学习”的结合。一方面，目前普遍的基于值函数的多智能体强化学习算法，主要采用集中式的行为值函数来指导策略网络训练，这类算法虽然一定程度上解决了置信分配问题，但难以应用到实际的大规模多智能体任务中。因为集中式的行为值函数没有考虑多智能体本身的特点，很难收敛和训练。另一方面，如果将每个智能体视为单独个体，每个个体分别利用单智体强化学习方法进行训练，忽略了环境的动态性，也难以学到最优解。因此，产生了介于两种方法之间的值函数分解思想。


    在值函数分解思想中，每个智能体都有自己的个体行为值函数，中心式的行为值函数可以分解为每个行为值函数的某种组合。为了区分行为值函数，这里称个体行为值函数为效用函数。行为值函数的分解可以表示为每个智能体效用函数的组合。效用函数有以下几个作用：①细化了值函数的结构形式，使得联合行为值函数的训练更方便和更有针对性；②该分解式的结构可以用于集中式训练，因此克服了多智能体中动态环境的问题；③效用函数用于从集中式值函数中构造和提取每个智能体的局部策略，从而使得该算法用于大规模多智能体系统中。


    VDN 算法在值函数可分解的假设上又做了一个更强的线性假设，即假设联合行为值函数是每个智能体效用函数的线性和。该网络可以学会将团队价值函数分解为单个智能体的价值函数之和，并且在一系列部分可观测的多智能体领域中进行的实验表明，学习此类价值分解会带来更好的结果。


    VDN 算法可以在仅有全局奖励的情况下学习不同智能体自己的动作价值函数，从而解决由部分可观察导致的伪奖励(spurious reward)和懒惰智能体(lazy
    agent)问题。伪奖励和懒惰智能体本质上是多智能体信用分配问题。伪奖励指在独立式学习的方法中从单个智能体的角度来看，环境是部分观察的，所以智能体可能会收到来自队友(未观察到的)动作的伪奖励信号。懒惰智能体指假设只有两个智能体，在集中式学习的方法中可能会导致只有一个智能体是活跃的，另一个'
  merge: -1
