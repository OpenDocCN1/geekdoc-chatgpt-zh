  md: '# 2. 在线蒙特卡罗持续重解


    在线蒙特卡罗持续重解类方法主要试图针对在线对抗过程中双方状态进行分离，构造领域无关的小型博弈，进而运行蒙特卡罗采样方法重新求解在线反制策略。Šustr 等[80]基于在线结果采样法和信息集蒙特卡罗采样提出了蒙特卡罗重解法。此外，Brown
    等[81]提出在对手建模时要平衡安全与可利用性，基于安全嵌套有限深度搜索的方法可以生成安全对手剥削的反制策略。


    # 3. 值函数有限深度搜索


    值函数有限深度搜索类方法试图利用神经网络估计最优值函数辅助在有限深度搜索生成反制策略。Brown 等[82]提出了基于深度强化学习的值函数方法。Kovařík
    等[83]给出了当前三种博弈模型中的值函数（可达最优值函数、反事实最优值函数和全局最优值函数）。Milec 等[84]基于值函数，利用有限深度最佳响应，限定纳什响应方法生成反制策略。如图
    4.14 所示，DeepStack 采用的就是基于反事实值函数的在线重解方法[85]。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_127_0.png)


    # 4.4.4 未来研究重点


    # 1. 有限理性与欺骗建模


    有限理性是指介于完全理性和非完全理性之间的在一定限制下的理性。通常情况下，博弈局中人被认为是绝对理性的，然而在现实的场景中人类参与者往往无法做出最佳策略，其行为可能偏离博弈中的均衡解。在棋牌类博弈过程中，高水平的参与者逐渐适应对手的打法后，试图“操控”博弈过程时也会表现出非理'
  merge: -1
  img_proc: true
- pgno: 128
  md: '性行为。例如，通过设计巧妙的“陷阱”，暂时放弃短期的最优收益，诱使对手做出错误的决策，以获得长期收益。欺骗与反欺骗是一种广泛存在的对抗形式，在棋牌类领域更是屡见不鲜，欺骗是一类典型的偏离理性假设的行为。在不完全信息博弈中，由于信息的不对称性，欺骗十分普遍，参与者可以通过采用“诈唬”的手段混淆对手的认知，欺骗对手从而达到赢得对局的目的。欺骗方法研究是博弈学习中的难点，如何有效地利用欺骗手段并识别对手的欺骗，如何通过模拟欺骗性交互来实施欺骗和检测欺骗，如何分析欺骗性自主智能体的建模推理和行为机制均有待深入研究。


    # 2. 多样的策略学习方法


    基于异构模型的对抗集成学习，即当对手模型由不同方法学习得到时，获得的是参数不一致的异构模型，此时可以采用集成学习方法组织博弈对抗训练。基于同构模型的神经演化学习，即对手模型由相同的方法学习得到时，获得的是参数模型一致的同构模型，此时可以采用神经演化学习方法组织博弈对抗训练。基于种群演化的多样性课程学习，即当面对复杂的任务时，智能体需要掌握多种不同技能，此时可以采用分阶段课程学习或多样性自主课程学习，通过种群课程训练和演化选择学习技能。面向未知对手模型的元学习，即当对手模型未知时，智能体需要与未知对手进行对抗，可以利用元学习方法，通过学习历史交互信息，在线生成难以被利用对手和多样性对手模型来指导博弈对抗训练。基于模型的在线无悔学习，即当面向可能随意变换风格的对手，对手模型的在线利用主要采用在线无悔学习方法，通过分析交互过程中的动态后悔值来指导博弈对抗训练。


    # 3. 递变无悔反制策略生成


    如何应对多种风格的对手一直是智能体策略应对的难点，此前的一些研究将着力点放在了多目标博弈对手建模方法的研究上，最新的一些研究重点为策略的无悔性，这是一类在安全保底的博弈理念驱动下，寻找安全策略的方法。


