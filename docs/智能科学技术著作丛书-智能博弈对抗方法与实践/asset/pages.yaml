    异步线程明确参数数 \( t \leftarrow t+1, T \leftarrow T+1 \)

    \( t_{\text{start}} = t \)

    获取状态 \( s_t \)

    **Repeat**

    根据策略 \( \pi(a_i | s_i; \theta'') \) 执行动作 \( a_i \)

    获取奖励 \( r_t \) 和状态 \( s_{t+1} \)

    \( t \leftarrow t+1, T \leftarrow T+1 \)

    **Until** 到达终止状态 \( s_T \) 或者 \( t - t_{\text{start}} == t_{\text{max}} \)

    \( R = \begin{cases} 0, & s_i \in s_T \\ V(s_i, \theta''_v), & s_i \notin s_T
    \end{cases} \)

    **For** \( i \in \{t-1, \cdots, t_{\text{start}}\} \) do

    \( R \leftarrow r_i + \gamma R \)

    \( \text{d}\theta \leftarrow \text{d}\theta + \nabla_\theta \log \pi(a_i | s_i;
    \theta'')(R - V(s_i, \theta''_v)) \)

    \( \text{d}\theta_v \leftarrow \text{d}\theta_v + \delta(R - V(s_i, \theta''_v))^2
    / \partial \theta''_v \)

