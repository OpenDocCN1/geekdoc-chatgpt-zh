  md: '![](img/cabd2c20e917d014f37d4e65ac1e41e0_23_0.png)


    图 1.8 AlphaGo 对战围棋世界冠军李世石


    对于围棋问题，如果使用暴力搜索方式，即使使用现有的算力也无法解决。在早期的研究中，通常采用专家系统和模糊匹配结合，缩小搜索空间，减小计算强度。但受限于当时计算资源和硬件能力，实际效果并不理想。随着计算能力的大幅提升，2016
    年，DeepMind 团队利用深度强化学习与蒙特卡罗树搜索（Monte Carlo tree search，MCTS）算法实现了人工智能围棋策略系统 AlphaGo[8]。


    AlphaGo 之后，DeepMind 团队相继推出 Alpha 系列技术（图 1.9），包括 AlphaGo Zero、AlphaZero、MuZero，逐步扩展应用至日本将棋和国际象棋中，开始脱离人类知识从零开始学习，学到很多人类围棋选手无法理解的定式，并在人机对抗中取得压倒性的优势。2016
    年末，在中国围棋类网站上以 Master 为注册账号与中日韩数十位围棋高手进行快棋对决，连续 60 局无一败绩；2017 年 5 月，在中国乌镇·围棋峰会上，Master
    与排名世界第一的世界围棋冠军柯洁对战，以 3:0 的总比分获胜。2017 年 10 月，DeepMind 团队公布了最强版 AlphaGo，代号 AlphaGo
    Zero[9]，其能力有了更大提升。最大的区别是 AlphaGo Zero 不再需要人类数据。也就是说，它一开始就没有接触过人类棋谱。研发团队只是让它自由随意地在棋盘上下棋，然后进行自我博弈。并且，在神经网络的数量上，AlphaGo
    Zero 仅用了单一的神经网络算法。在此之前的版本中，AlphaGo 用到了策略网络来选择下一步棋的走法，以及使用价值网络来预测每一步棋后的赢家。而在新的版本中，这两个神经网络合二为一，从而让它能得到更高效的训练和评估。不同于
    AlphaGo 用快速走子方法来预测哪个玩家会从当前的局面中赢得比赛，AlphaGo Zero 并不使用快速、随机的走子方法。相反，AlphaGo Zero
    依靠高质量的神经网络来评估下棋的局势。'
