    根据对多智能体学习问题的分类描述，可以区分不同的研究视角与方法。Jan''t Hoen 等[10]从合作与竞争两个角度对多智能体学习问题进行了区分。Panait
    等[11]对合作型多智能体学习方法进行了概述：团队学习(team learning)，指多智能体以公共的、唯一的学习机制集中学习最优联合策略；并发学习(concurrent
    learning)，指单个智能体以相同或不同的个体学习机制，并发学习最优个体策略。后来研究者直接利用多智能体强化学习(multi-agent reinforcement
    learning, MARL)方法开展研究。Busoniu 等[12]从完全合作、完全竞争和混合型这三类任务的角度对多智能体强化学习方法进行了分类总结。Hernandez-Leal
    等[13]总结了传统多智能体系统研究中的经典思想(如涌现性行为、学会通信交流和对手建模)是如何融入多智能体深度强化学习领域的，并在此基础上对深度强化学习进行了分类。OroojlooyJadid
    等[14]从独立学习器、全可观评价、值函数分解、一致性和学会通信协调五个方面对合作多智能体强化学习方法进行了全面回顾分析。Zhang 等[15]对具有理论收敛性保证和复杂性分析的多智能体强化学习方法进行了选择性分析，并首次对联网智能体分散式、平均场博弈和随机势博弈多智能体强化学习方法进行综述分析。Gronauer
