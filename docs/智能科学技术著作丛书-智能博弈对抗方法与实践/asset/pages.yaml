  md: '# # 第 9 章 智能博弈对抗元理论


    # ## 9.1 引 言


    本章主要从元宇宙、元博弈、元认知和元学习四个视角对智能博弈对抗策略的学习相关元理论进行简要介绍和分析。9.2 节主要介绍 DeepMind 关于游戏元宇宙的相关知识；9.3
    节主要介绍元博弈相关理论；9.4 节主要介绍元认知相关理论；9.5 节主要介绍元学习方法。


    # ## 9.2 元宇宙：开放式学习环境


    元宇宙概念始于 1992 年尼尔·斯蒂芬森的科幻小说《雪崩》提出的 metaverse，它由 meta 和 verse 两个词根组成，meta 表示“超越”“元”，verse
    表示“宇宙”（universe），意在构造一个高度仿真的数字世界。电影《头号玩家》和《失控玩家》等均被贴上元宇宙标签。Facebook、微软和英伟达等公司纷纷布局元宇宙业务，国内字节跳动、腾讯等公司也聚焦此类任务。


    在人工智能博弈对抗领域，DeepMind 研究人员创建了一个巨大的游戏环境，称为 XLand[1]。DeepMind 为 AI 打造的这个“元宇宙”，宣称通过强化学习训练的
    AI 能玩全宇宙的游戏。这个“元宇宙”的创建是为了让智能体在不断扩展、升级的开放世界中学习，AI 的新任务（训练数据）是基于旧任务不断生成的。如图 9.1
    所示，XLand 包含数十亿个任务，跨越不同的游戏、世界和玩家。从简单到复杂的游戏，AI 智能体在学习过程中不断完善训练任务。简单的如“靠近紫色立方体”，复杂一点的如“靠近紫色立方体或将黄色球体放在红色地板上”。这些智能体甚至还可以和其他智能体玩耍，如捉迷藏和夺取旗帜。每个小游戏正如宇宙中的颗粒繁星，拼成了一个庞大的物理模拟世界。


    这个世界的任务由三个要素构成，即任务=游戏+世界+玩家。根据三个要素的不同关系，来决定任务的复杂度。现有以下四个维度：竞争性、平衡性、可选择性、探索困难性。基于这四个维度，一个任务空间的、超大规模的“元宇宙”XLand
    就诞生了，而几何地球也只是这个元宇宙的一个小角落，只是这四维空间的一个点。XLand 解决了 AI 训练的数据问题，研究人员发现，目标注意网络（GOAT）可以学习更通用的策略。在如此广阔的环境下，动态任务生成允许智能体的训练任务的分布不断变化，生成的每个任务既不太难也不太容易，但正好适'
