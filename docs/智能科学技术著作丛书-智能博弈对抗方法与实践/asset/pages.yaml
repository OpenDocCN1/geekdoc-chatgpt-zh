    # # 3.5 分层强化学习


    在强化学习研究领域，分层强化学习使用分层抽象技术求解 MDP 问题。分层强化学习的核心思想是将一个大型复杂问题分解成多个小的子组件，并对多个子组件分别求解，而各个子组件的解决方法合并后可以形成对原始问题的近似最优解，从而扩大强化学习适用问题的规模。并且，各个子组件之间可以实现共享和重复使用，从而提高问题解决的效率。分层强化学习有效缓解了问题复杂度随状态变量呈指数级增长这一“维数灾”问题。根据层次结构的形式化表示方式，现有的分层强化学习大致可以分为基于
    Option 的分层强化学习、基于 MAXQ 的分层强化学习和基于 HAM 的分层强化学习。此外，近年来神经网络快速发展，尤其在图像识别领域取得了很多成果。许多相关研究尝试通过结合神经网络和分层强化学习提高问题的解决效率。


    # ## 1. 基于 Option 的分层强化学习


    Sutton 等[4]通过引入时序扩展动作，即 Option，把分层强化学习建模成 SMDP。通过自动学习或手工编写的方式，每个 Option 都被附以一个单独的内部策略。Option
    可以形式化表示为一个三元组 \(<I, \pi, \beta>\)。其中，\(I\) 表示所有初始状态集，\(\pi\) 表示内部策略，\(\beta\)
    表示终止函数，即 Option 在某个状态上的终止概率。Option 探索时序抽象，在时序抽象中不需要在每个时间步做出决策，更精确地说就是调用时序扩展动作，这些动作内部的执行遵循已有策略。


    Option 是分层强化学习中最有弹性的方法论之一，它可以被迁移到任何有共享表示的问题领域。但是在高维和抽象状态空间中由于问题复杂度等因素，手动设计 Option
    是不可行的，所以最近的研究重点转移到了自动学习行为层次结构，即 Option 发现。目前许多研究工作提出了相关的学习技术，包括使用描述长度来权衡值[22]、识别转移状态[23]、从示例中进行推理[24]、迭代地扩展可解初始状态集[25]、使用信息约束交换值[26]、主动学习[27]、值函数近似[28]、寻找子目标瓶颈或标志性状态[29]，以及寻找共同的行为轨迹或区域策略[30]等。


    早期的相关研究包括：Digney[31]提出在问题解决时发现宏动作；Mcgovern[32]通过检测智能体成功访问某区域的频率创建 Option，并学习 Option
    的策略，同时调用这些 Option 来学习更高层的策略来解决整个问题；Hengst[33]提出了 HEXQ 方法，利用状态变量的因子化表示，将状态变量排序到一个有序列表中，根据改变最频繁的变量来发现
    Option；Konidaris 等[34]提出了概率 Option 方法，即定义在缩减了的状态空间（称为智能体空间）上的抽象动作。'
