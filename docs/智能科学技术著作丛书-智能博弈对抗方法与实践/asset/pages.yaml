  md: '确的决策，但是当这类数据信息在对抗环境下采用欺骗的方法，容易对认知产生干扰，导致做出错误的决策。


    在欺骗与反欺骗的对抗中，各种真实数据为生成欺骗数据提供了基础的素材，通过伪造数据方法可以产生各种伪造欺骗数据；通过对伪装目标检测结果评估伪装效果，可以促进伪装材料的设计和迷彩的改进。大量欺骗数据又为欺骗检测方法提供了训练数据，使得欺骗检测的效果不断提高，两者相互影响相互促进。在欺骗与反欺骗对抗过程中，欺骗生成与检测方法发挥着核心作用。各种侦察手段的大量应用将获取大量目标图像和视频等视觉目标数据，一方面，欺骗性质的视觉数据使得目标分析人员对目标分析的速度和质量下降；另一方面，视觉欺骗数据容易造成分析人员数据分析错误，进而干扰决策者的认知并做出错误决策。


    # 10.3 攻防博弈与复杂网络攻防


    # 10.3.1 攻防博弈


    对抗环境下的决策主要体现在博弈双方的交互式对抗上，其中攻防建模是军事和安全领域一个长期而关键的问题，现实当中很多包含对抗和竞争的问题可以用攻防对抗进行建模。博弈模型已然成为复杂对抗领域中问题建模的一种标准方法，可以很好地表示攻防对抗中两个参与方在策略上的交互，根据不同类型的参与方与环境设置，攻防对抗模型可分为：①马尔可夫/随机博弈，其中博弈双方可同时采取行为；②贝叶斯博弈，其中防御方需要应对多种类型的攻击方；③施塔克尔贝格博弈（Stackelberg
    game）[22]，其中博弈双方分别为领导方（leader）与追随方（follower），防守方充当领导方角色，首先采取行动，攻击方充当追随方角色，针对领导方的行动做出最佳响应。


    不同的博弈对抗场景结合，呈现出不同的博弈对抗形态，相关的博弈模型有：①阻断博弈（interdiction game）[23]，即博弈双方为阻断方（interdicter）和逃避方（evader）；②追逃博弈（pursuit-evasion
    game）[24]，即博弈双方为追捕方（pursuer）和逃避方；③搜索博弈（search game）[25]，即博弈双方为搜索方（searcher）和隐藏方（hinder）；④埋伏博弈（ambush
    game）[26]，即博弈双方为警戒方（guard）和逃避方；⑤渗透博弈（infiltration game）[27]，即博弈双方为警戒方和逃避方；⑥巡逻博弈（patrolling
    game）[28]，即博弈双方为攻击方（attacker）和巡逻方/防御方（patroller/defender）。


    此外，近年来基于施塔克尔贝格博弈模型的安全博弈（security game）模型应用范围极为广泛[29]，在现代社会中，保护各种关键公共基础设施和目标是各国安全机构面临的一项非常有挑战性的任务。一些社会安全问题（如偷猎物、合作抓捕、走私）也常常被建立成多智能体博弈问题。面对这些恐怖袭击和安全威胁，在人群'
