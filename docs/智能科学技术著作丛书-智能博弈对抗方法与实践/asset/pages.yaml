  md: '# # 第 5 章 协作式即时策略博弈对抗决策智能体设计


    # ## 5.1 引言


    复杂环境下，智能体在多人即时策略 (real-time strategy, RTS) 博弈中掌握策略、理解战术以及进行团队协作是人工智能研究领域的重大挑战。相比于序贯博弈对抗，协作式即时策略博弈的整个对抗过程即时进行，强调多智能体之间紧密协作，不断通过学习探索、利用经验提升自身性能。协作式即时策略博弈所研究的内容与大量的现实系统紧密关联，能为解决未来实现世界协同对抗问题提供新的有效途径。其中，典型应用包括各类即时策略游戏、机器人足球、多机器人灾难救援、自动驾驶和无人集群对抗等。近年来，随着深度学习和强化学习的深度融合发展，协作式即时策略博弈对抗决策方法在机器博弈领域取得了长足进步，面向《星际争霸》、《王者荣耀》、《刀塔
    2》等即时策略博弈验证平台，研发的各类 AI 程序在比赛中获得较好名次，或在人机对抗比赛中战胜了人类顶级选手。本章围绕《星际争霸》展开：5.2 节简要介绍《星际争霸》游戏基础，将《星际争霸》问题抽象成协作式即时策略对抗问题，分析其状态空间复杂度，总结该问题的研究挑战，有针对性地总结应对这些挑战的关键技术；5.3
    节介绍《星际争霸》AI 的构建工作，包括《星际争霸》AI 研究历程、AI 环境、AI 实现，并基于 SMAC 平台给出算法实验案例。


    # ## 5.2 面向《星际争霸》的即时策略博弈对抗决策


    # ### 5.2.1 《星际争霸》游戏基础


    《星际争霸》是一款即时战略游戏(图 5.1)，与围棋相比，这款游戏虽然也属于零和博弈，但具有不完全信息、输入输出状态空间庞大、存在海量先验信息、游戏预测困难等特点。《星际争霸
    2》① 的基本要素可分为经济、生产力、部队、科技、侦察和地图，玩家可以选择人族、虫族、神族等不同种族势力。每个种族均包括多种生命角色、战斗装备、功能建筑等多类型单元。


    ① 《星际争霸》的一个常用版本，将在 5.3.2 节详细介绍。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/cabd2c20e917d014f37d4e65ac1e41e0_136_0.png)


    《星际争霸》游戏可以划分为战略层、战术层和微管理/微操作层等三个层面。(1) 战略层：负责收集资源、建造单位和提升实力等战略要素。战略层包含基础建设、技术树管理(构建顺序)和资源管理等与游戏经济相关的任务。高层战略决策还包括军队构成和高层次的进攻时机。一般来说，拥有更好的宏观管理的玩家将拥有一支更强大的军队，以及更稳固的防守方案。


    (2) 战术层：主要涉及不同数量的单位之间的协调。因此，在考虑地图地形的同时，还要考虑军队的定位和分队的行动。而分队行动涉及各小组之间的协调。相比之下，战略层的决策涉及长期规划。此外，侦察是一种跨战术层与战略层的任务，即发现对手的基地、军队构成和单元行动。例如，战争迷雾造成信息不完整，这种效应隐藏了地图上不靠近玩家单位或建筑物的所有区域。这使得侦察对于战略决策以及战术单位移动是至关重要的，可以有效避免突然袭击。


    (3) 微管理/微操作层：微管理/微操作也是《星际争霸》的一个重要方面，具有高技能上限，需要专业玩家单独练习。在《星际争霸》的常规完整游戏中，通常是多个人类玩家相互竞争，或人类玩家与内置游戏
    AI 竞争。每个玩家都需要收集资源，建造建筑物，并成立部队，通过征服其他玩家的领土和摧毁其基地来击败对手。在战斗中，适当的微操作可以最大化对敌人造成的伤害，同时最小化自己所受到的伤害，这需要一系列的高技能操作。例如，一个有效的操作方式是“集中火力”，即命令单位联合攻击，并杀死一个又一个敌人单位。又如“放风筝”，即根据装甲类型将单位组合成队形，让敌人单位在追逐的同时保持足够的距离，这样就能承受很少或几乎不受伤害，协调单位的走位从不同方向攻击，或利用地形优势击败敌人。


    # 《星际争霸》具有以下特点。


    +   (1) 属于多智能体问题。多个参与者争夺领土和资源。


    +   (2) 注重多智能体之间的协作。每个玩家控制数百个单位，需要协作以达成一个共同的目标。'
