    # 6.2.2 问题复杂度分析


    德州扑克是继围棋之后最受关注的人工智能领域难题之一，也是大规模不完全信息动态博弈算法测试的基准之一。本节从状态空间、信息集数量和信息集下动作数量三个方面分析德州扑克问题的复杂度，为读者深入了解德州扑克问题提供支撑。


    # 1. 状态空间


    两人无限注德州扑克中，在 pre-flop 轮，所有玩家的私有手牌组合数为 C_{52}^2 C_{50}^2，在 flop 轮组合数为 C_{52}^2
    C_{50}^2 C_{48}^3，各阶段的组合数以此类推。如表 6.1 所示，分别比较了从单个玩家和两个玩家以及同构 (同构代表使用手牌同构的无损抽象算法)
    后的状态数。


    # 表 6.1 两人无限注德州扑克各阶段状态数


    | 阶段 | 两人状态数 | 单人状态数 | 同构后状态数 |

    |---|---|---|---|

    | pre-flop | 1624350 | 1326 | 169 |

    | flop | 28094757600 | 25989600 | 1286792 |

    | turn | 1264264092000 | 1221511200 | 55190538 |

    | river | 556276200480000 | 56189515200 | 2428287420 |


    每个阶段的下注动作 (包括 fold、call 和 raise) 独立于可能的状态数，因此 raise 的区间决定了两人德州扑克博弈树的“宽度”，影响下一轮的状态数。德州扑克玩家无论持有什么样的底牌，可以选择的行为组合相同，所以在计算状态空间复杂度时，可以用可能的底牌组合数与可选择行为数相乘，状态空间约为
    3.162×10^{17}。


    # 2. 信息集数量


    假设每阶段只允许加注四次，在枚举可继续到下一阶段的动作序列时，玩家不弃牌。-、r、c、f 分别代表该阶段首次决策、raise、call 和 fold。在 pre-flop
    轮，决策点有-、c、cr、crr、crrr、r、rr、rrr 共 8 个，可以进行到下一阶段的动作连续序列为 cc、crc、crrc、crrrc、rc、rrc、rrrc
    共 7 个，终止在该阶段的序列为 f、rf、rrf、rrrf、crf、crrf、crrrf 共 7 个，以此类推可得各阶段的序列个数[1]'
