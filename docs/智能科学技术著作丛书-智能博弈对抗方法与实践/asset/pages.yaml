  md: '# 第 7 章 混合式序贯博弈对抗决策智能体设计


    # 7.1 引 言


    第 6 章主要详细介绍了在不完全信息序贯博弈中，以德州扑克为代表的多智能体竞争式序贯博弈对抗决策方法。在不完全信息序贯博弈中，还存在着多智能体竞争和协作同时存在的场景。以桥牌、斗地主为代表的多智能体混合式序贯博弈对抗问题，博弈环境更加复杂，智能体之间既有合作又有竞争，每个智能体不但要发挥自主角色个体技能，还能通过合作策略发挥集体力量。在合作的同时，不仅需要估计对手的信息，还需要估计队友的信息。如何快速有效地求解合作条件下信息状态集大规模的不完全信息博弈问题，已成为人工智能领域的重要挑战之一。纵观多智能体混合式序贯博弈发展现状，短时间内人工智能很难在竞技上与人类抗衡。本章将分别以斗地主和桥牌为例展开：7.2
    节介绍斗地主的游戏规则，分析问题复杂度以及关键技术；7.3 分析斗地主 AI 研究历程，介绍 AI 的开发过程；7.4 节介绍桥牌的规则，分析问题复杂度及关键技术；7.5
    节介绍桥牌 AI 的研究现状以及叫牌 AI 的实现。


    # 7.2 面向斗地主的序贯博弈对抗决策


    # 7.2.1 斗地主规则


    斗地主是国内流行的三人扑克牌游戏（图 7.1）。三人分别扮演地主和两个农民的角色，两个农民可以合作压制地主，但不能交流和观察其他玩家的手牌。斗地主分为发牌、叫牌和出牌三个阶段。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_181_0.png)


    图 7.1 斗地主界面①'
  merge: -1
  img_proc: true
