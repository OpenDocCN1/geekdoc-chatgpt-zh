- pgno: 57
  md: '(CFR with sampling, CFR-S) 和基于联合策略重构的 CFR 最小化 (CFR with joint reconstruction,
    CFR-Jr)[106]等。基于后悔值的方法，其收敛速度一般为 O(T^-1/2)，一些研究借助在线凸优化技术将收敛速度提升到 O(T^-3/4)，这类优化方法，特别是一些加速一阶优化方法，理论上可以比后悔值方法更快收敛，但实际应用中效果并不理想。


    在求解大规模非完全信息两人零和扩展博弈问题中，算法博弈论方法与深度强化学习方法成效显著，形成以 Pluribus、DeepStack 等为代表的高水平德州扑克
    AI，在人机对抗中超越人类职业选手水平，其中，CFR 方法通过计算累计后悔值并依据后悔值匹配方法更新策略。深度强化学习类方法通过学习信息集上的值函数来更新博弈策略并收敛于近似纳什均衡。近年来，一些研究利用
    Blackwell 近似理论，构建起了在线凸优化类方法与后悔值类方法之间的桥梁，Farina 等[107]证明了 RM 及其变体 RM+分别与跟随正则化领先者
    (follow the regularized leader, FTRL) 和在线镜像下降 (online mirror descent, OMD) 为等价关系，收敛速度为
    O(T)。此外，一些研究表明后悔值与强化学习中的优势函数为等价关系[108,109]，现有强化学习方法通过引入“后悔值”概念，或者后悔值匹配更新方法，形成不同强化学习类方法，在提高收敛速率的同时，使得
    CFR 方法的泛化性更强。三大类方法的紧密联系为求解大规模两人零和非完美信息博弈提供了新方向和新思路。


    对于多人博弈，一类针对对抗合作博弈[110,111]的模型得到了广泛研究，其中团队最大最小均衡 (team-maxmin equilibrium, TME)
    描述了一个拥有相同效用的团队与一个对手博弈对抗的解概念。针对智能体之间有无通信、有无事先通信、可否事中通信情形，近年来的一些研究探索了相关解概念，如相关 TME
    (correlated team-maxmin equilibrium, CTME)、带协同设备的 TME (team-maxmin equilibrium
    with coordination device, TMECor)、带通信设备的 TME (team-maxmin equilibrium with communication
    device, TMECom)；相关均衡求解方法，如增量策略生成[112]，其本质是一类双预言机方法，Zhang[60]结合网络阻断应用场景设计了多种对抗合作博弈求解方法。此外，合作对手博弈[113]模型也被用来建模多对一的博弈情形。


    # 3. 基于元博弈的策略学习方法


    对于多智能体博弈策略均衡学习问题，近年来一些通用的框架相继被提出，其中关于元博弈理论的学习框架为多智能体博弈策略的学习提供了指引。由于问题的复杂性，多智能体博弈策略学习表现出基础策略可以通过强化学习等方法很快生成，而较优策略依靠在已生成的策略池中缓慢迭代产生。当前由强化学习支撑的策略快速生成“内环学习器”和演化博弈理论支撑的策略缓慢迭代“外环学习器”组合成的“快与慢”双环优化方法，为多智能体博弈策略学习提供了基本'
  merge: -1
  img_proc: true
- pgno: 58
  md: '参考框架。Lanctot 等[114]提出了面向多智能体强化学习的策略空间响应预言机(policy space response oracle, PSRO)统一博弈学习框架，成功将双预言机(double
    oracle, DO)这类迭代增量式策略生成方法扩展成满足元博弈种群策略学习方法，其过程本质上由“挑战对手”和“响应对手”两个步骤组成。为了应对一般和博弈，Muller
    等[115]提出了基于 \(\alpha\)-rank 和 PSRO 的通用学习方法框架。Sun 等[116]提出了满足竞争自对弈多智能体强化学习的分布式联赛学习框架
    TLeague。Zhou 等[117]基于群集多智能体强化学习提出了融合策略评估的 MALib 并行学习框架。如图 2.9 所示，当前多智能体博弈策略学习主要是通过方法驱动仿真器快速生成博弈对抗样本，得到收益张量
    \(M\)，元博弈求解器计算策略分布，进而辅助挑战下一轮对手(末轮单个、最强 \(k\) 个、均匀采样等)，预言机主要负责生成最佳响应，为智能体的策略空间增加新策略。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_58_0.png)


    # 1)策略评估方法


    多智能体博弈对抗过程中，由基础“内环学习器”快速生成的智能体模型池各类模型的能力水平各不相同，如何评估其能力用于外层的最优博弈策略模型探索可以看成一个多智能体交互机制设计问题，即如何按能力挑选智能体用于“外环学习器”策略的探索。当前，衡量博弈策略模型绝对能力的评估方法主要有可利用性[118]和方差[119]等。衡量相对能力的评估方法已经成为当前的主流。由于博弈策略类型的不同，评估方法的适用场景也不尽相同。传递压制博弈策略的评估方法主要有
    Elo[120]、Glicko[121]、TrueSkill[122]等，非传递压制博弈策略的评估方法主要有 mElo2k[123]、纳什平均(Nash averaging)[123]、\(\alpha\)
    排序(\(\alpha\)-rank)[124]、\(\alpha^\varphi\) 排序(\(\alpha^\varphi\)-'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'rank] [125]、响应图上置信界 (response graph upper confidence bound, RG-UCB) [126]、信息增益
    (information gain, InfoGain) α-rank [127]、最优评估 (optimal evaluation, OptEval) [128]。与此同时，一些研究人员对智能体与任务的适配度、游戏难度、选手排名、方法的性能、在线评估、大规模评估、团队聚合技能评估等问题展开了探索。


    # 2)策略提升方法


    在“内环学习器”完成智能体博弈策略评估的基础上，“外环学习器”需要通过与不同段位的智能体进行对抗，提升策略水平。传统自对弈的方法对非传递压制性博弈的策略探索作用不明显。由于问题的复杂性，多智能体博弈策略的迭代提升需要一些新的方法模型，特别是需要满足策略提升的种群训练方法。如图
    2.10 所示，博弈策略提升的主要方法有自对弈 (self-play)、协同对弈 (co-play)、虚拟自对弈 (fictitious self-play)
    和种群对弈 (population play) 等方法 [42]，但各类方法的适用有所区分，研究表明仅当策略探索至种群数量足够多、多样性满足条件后，这类迭代式学习过程才能产生相变，传统的自对弈方法只有当策略的“传递压制维”上升到一定水平后才可能有作用，否则可能陷入循环压制策略轮替生成。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_59_0.png)


    图 2.10 策略提升方法 [42]


    自对弈类方法主要有朴素自对弈方法 [129]、δ 均匀自对弈方法 [130]、非对称自对弈方法 [131]、双预言机 [113]、极小极大后悔鲁棒预言机 [132]
    等，这类方法主要利用与自身的历史版本对抗生成训练样本，对样本的质量要求高，适用范围最小。虚拟自对弈类方法主要有虚拟对弈 (fictitious play,
    FP) 方法 [133]、扩展虚拟对弈 (extensive fictitious play, XFP) 方法 [134]、平滑虚拟对弈方法 [135]、随机虚拟对弈方法
    [136]、团队虚拟对弈方法 [137]、神经虚拟自对弈 (neural fictitious self-play, NFSP) 方法 [138]、蒙特卡罗神经虚拟自对弈
    (Monte Carlo neural fictitious self-play, MC-NFSP)'
