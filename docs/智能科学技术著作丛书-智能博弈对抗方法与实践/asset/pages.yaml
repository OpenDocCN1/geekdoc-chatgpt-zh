    # 3. 组合多臂赌博机


    UCT 采用 UCB1[41]作为树策略，用以平衡探索和利用，是目前最著名的 MCTS 实现方法之一。在 UCT 算法中，它将每个子节点的选择看成多臂赌博机问题，子节点的值是蒙特卡罗仿真得到的近似期望奖励，因此这些奖励是分布未知的随机变量。如果多个子节点具有相同的最大值，通常会进行随机选择。针对分支因子变得非常大，UCT
    的性能下降问题，Ontañón[42]提出将选择阶段建模成组合多臂赌博机 (combinatorial multi-armed bandits, CMAB)
    问题，比较适合即时策略博弈的组合决策空间。在 CMAB 中，智能体必须在每个周期中激活一个赌博臂，希望组合臂获得最大的预期奖励。


