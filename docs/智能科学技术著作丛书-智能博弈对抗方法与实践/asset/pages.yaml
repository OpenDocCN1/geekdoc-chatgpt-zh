- pgno: 50
  md: '据其他智能体的策略调整自身策略以求达到更好的协作效果时，其他智能体也相应地为了适应该智能体的策略调整了自身策略，这就导致该智能体调整策略的依据已经“过时”，从而无法达到良好的协调效果。从优化的角度看，其他智能体策略的非平稳性导致智能体自身策略的优化目标是动态的，从而造成各智能体策略相互适应的滞后性。非平稳性作为多智能体问题面临的最大挑战，如图
    2.7 所示，当前的处理方法主要有五类[59]：无视，即假设环境（对手）是平稳的；遗忘，即采用无模型方法，忘记过去的信息同时更新最新的观测；标定对手模型，即针对预定义对手进行己方策略优化；学习对手模型，即采用基于模型的学习方法学习对手行动策略；基于心智理论（theory
    of mind, ToM）的递归推理，即智能体采用认知层次理论递归推理对手及己方策略。面对有限理性或欺骗型对手，对手建模（也称智能体建模）已然成为智能体博弈对抗时必须拥有的能力，它同集中式训练分散式执行、元学习、多智能体通信建模一起为非平稳问题的处理提供了技术支撑。


