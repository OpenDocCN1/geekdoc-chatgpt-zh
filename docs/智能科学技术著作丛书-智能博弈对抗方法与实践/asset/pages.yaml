    # 4. 学习引导搜索


    Yang 等[61]提出一种决策树集成的 MCTS 算法。首先利用历史数据学习基于决策树的策略，然后上层采用 Bagging 和随机森林等集成学习的方法引导下层搜索。训练后的模型可通过朴素采样预测每个单位的合法行为概率，其工作方式与
    AlphaGo 非常相似，其采用的朴素采样可很好地应对即时策略博弈的多分支因子。Tavares 等[62]提出了基于抽象的强化学习方法。Lu 等[63]提出了基于
    MAXQ 引导的分层蒙特卡罗在线规划方法，通过在 MCTS 算法中引入 MAXQ 分层任务结构，减少搜索空间并指导搜索过程，从而显著减少计算开销，而计算开销的减少使得
    MCTS 能够在有限的时间执行更深入的搜索以找到更优的规划策略。


    # 4.3.4 未来研究重点


    当前，即时策略博弈对抗规划方法研究已经取得了一些进展。围绕其对抗推理和应对规划两个子过程，未来可以利用对手及玩家建模方法，分析对手的行动特点，推理对手可能采取的行动；借助人机协同方法，组织人在回路的在线临机规划；充分发挥数据驱动的学习范式的优势辅助对抗规划生成。


    # 1. 对手及玩家建模


    对手建模的目标是学习对手的模型，这个模型可以利用博弈对抗数据集进行离线学习，或者在博弈对抗过程中进行在线学习。通过对手建模，可以获得对手池，方便训练出更高阶的智能体。其中在线对手建模和有限理性对手建模仍是大难题。玩家建模主要是学习玩家多种不同的可能模型，如博弈风格、博弈行为、性格特征、博弈技能表现等。


    # 2. 人机协同在线临机规划


    人机协同规划是人工智能实用化的必然要求，同时人工智能为人机协同提供了强大支撑。传统的规划按照不同的时机可以划分为两个阶段，三种规划，即博弈对抗前的预先规划、临战规划和博弈对抗时的临机规划。其中临机规划直面瞬息万变的博弈对抗态势，相关成果直接影响战局发展，凭借简单的方法难以有效支撑高层决策，因而成为当前规划中亟待解决的瓶颈问题。采用人机协同的方式可以提升智能体的规划能力，打通人与智能体之间的知识循环。最新的一些研究探索了人与单智能体协同、人与多智能体组队博弈对抗问题。此外，研究如何利用自然语言指令引导博弈对抗，或许也能催生出更懂人类口头或书面指令的博弈智能体。'
  merge: -1
