- pgno: 200
  md: '算法，该合作学习框架通过不断地在合作两方之间交换改进策略从而优化它们的选择策略。该算法使用一组桥牌手牌数据进行了经验性质的评估，结果显示该算法使得 AI
    水平有了明显提升。但是基于蒙特卡罗原理的算法需要将确定性问题转化为不确定性问题进行模拟，而实战中通常时间有限，模拟的精度很难保障稳定性和一致性，使得 AI
    水平的稳定性受到影响。2007 年，Delooz 针对叫牌中的无将定约，提出一种特殊的自组织无监督神经网络结构[13]。自组织无监督神经网络使用大量的人类玩家叫牌数据作为模型输入，根据边界特征可以有效模拟出叫牌过程中的模糊性和不确定性。他们将两个自组织神经网络结合在一起，模拟队友之间的叫牌过程，寻找无将定约最佳策略。自组织无监督神经网络只针对无将叫牌的特点，因而无法运用于实际当中。2015
    年，Ho 等[14]提出一种不使用已有叫牌体系规则和知识的面向无争叫牌的学习算法。该学习算法将叫牌过程设计为一个学习过程树，使用上限置信区间算法用于动作探索。2018
    年，Yeh 等[8]提出一种面向无争叫牌的深度强化学习算法深度 Q 学习模型。该模型使用深度学习提取复杂特征，并根据原始的手牌数据和叫牌序列数据进行叫牌，最后根据叫牌产生的数据强化模型。2017
    年 8 月，中国的桥牌人工智能系统“新睿桥牌”[15]在第 21 届世界计算机桥牌锦标赛中获得亚军。新睿桥牌与赛事冠军 Wbridge 均使用蒙特卡罗采样克服非完备信息难点，机器每决定一步，通常需要进行大量的抽样来模拟叫牌过程，最后根据专家经验对模拟结果进行评估；在面对较为明显和常见的叫牌局面，则直接使用专家经验选择相应动作。2019
    年，Gong 等[16]通过纯粹的自博弈(无人类经验知识)来训练桥牌 AI，性能超过 Wbridge5。


