    分层学习通过分层分解技术可以将原始 MDP 问题分解成一系列较小的子目标或者子任务，这些较小的问题可以分别求解，解的组合可以形成原始 MDP 问题的解，从而缓解大规模不确定环境中的维数灾难问题。目前，有三种常用方法定义
    MDP 分层分解中的分层结构：Option 根据研究人员提供的固定策略（或在某个单独的过程中学习到的策略）定义每个子任务[4]；MAXQ 根据终止谓词和本地奖励函数定义每个子任务[5]；层次抽象机
