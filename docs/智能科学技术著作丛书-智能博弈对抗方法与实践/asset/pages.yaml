  md: '显著的成绩。


    在非完美信息博弈中，求解子博弈的过程被定义为近似解逼近过程，或通过求解不相交的子博弈来改进当前的结果[7]。在完全信息中，可将博弈分解为独立的子博弈求解。但在非完美信息博弈中，因为子博弈的最佳策略可能取决于其他未知子博弈的策略和输出，所以完全信息博弈中的分解方法不适用。因此，必须在传统子博弈技术的基础上加以改进。以下是一些针对非完美信息博弈的改进子博弈的解决方案。


    # 2. 基础 CFR 算法


    非完美信息博弈模拟了在只包含部分信息的情况下多智能体之间的策略交互，其中最成功的算法簇是 CFR 算法及其变体。CFR 是目前最先进的能够在大型非完美信息博弈中生成高效策略的技术之一，是一种在两人零和博弈中收敛到纳什均衡的迭代算法，保证在两人零和博弈中计算出近似纳什均衡策略。


    后悔值最小化 (regret minimization) 算法是 CFR 的前身，2000 年，由 Hart 等[8]将其应用到计算机博弈领域，并在正则博弈对抗中取得了不错的效果。后悔是一个在线学习概念，引发了一系列性能强大的学习算法。博弈对抗中后悔值的作用是根据对过去对抗中行为动作的后悔程度来调整将来的动作选择策略。


    定义 6.1 (平均整体后悔值) 玩家 i 在第 t 回合的对抗中所采取的策略为 $\sigma_i^t$，则玩家 i 在 T 次对抗中的平均整体后悔值为


    \(R_i^T = \frac{1}{T} \max_{\sigma_i^* \in \Sigma_i} \sum_{t=1}^T [u_i(\sigma_i^*,
    \sigma_{-i}^t) - u_i(\sigma^t)]\) (6.1)


    $R_i^T$ 是平均意义下每局玩家所选择的策略在与 T 轮迭代中奖励最大策略的奖励差值。如果产生某一玩家的策略使得当 \(T \to \infty\) 时，\(R_i^{T,+}
    / T \to 0\) (其中 \(R_i^{T,+} / T = \max\{R_i^T, 0\}\)，表示后悔值都为非负)，就称这个策略是后悔值最小的。


    定义 6.2 (平均策略) $\overline{\sigma_i}^t$ 为玩家 i 从第 1 次到第 T 次过程的博弈对抗，\(\pi_i^{\sigma''}\)
    为玩家 i 第 t 次博弈所采用的策略。特别地，对于每个信息集 \(I \in L_i\)，每个动作 \(A \in A(I)\)，有


    \(\overline{\sigma_i}^t(I)(a) = \frac{\sum_{t=1}^T \pi_i^{\sigma''}(I) \sigma^t(I)(a)}{\sum_{t=1}^T
    \pi_i^{\sigma''}(I)}\) (6.2)


    在两人零和博弈中，若两个玩家的平均整体后悔值小于 \(\varepsilon\)，则平均策略遵循 \(2\varepsilon\) 均衡。若两个玩家重复多次对抗并不断调整策略，使得他们的平均整体后悔值'
