    raise 动作表示下注的总筹码量在增加到与上一个玩家相同的基础上再额外下注。当一个玩家进行 raise 动作后，下一个玩家可以接着进行 raise 动作，但是一轮对抗中双方玩家的合计
    raise 动作次数最多为 4。每一次的额外下注金额数，最小为 100 (也就是大盲注)，且应该大于等于该轮中的最大额外下注筹码量。另外，下注的筹码量不能超过剩下的筹码量。如果下注的筹码量等于剩下的筹码量，则该次动作被称为
    all-in (全压) 动作。


    fold 动作表示放弃加注，结束这场对抗，直接认为是输掉了这场比赛，失去了已经下注的所有筹码。


    当双方玩家均执行 call 动作后，或者在一方玩家执行 raise 动作、另一方玩家执行 call 动作后，结束本轮操作。当一方玩家执行 fold 动作后，结束本场对抗。当一方玩家执行
    all-in 动作且另一方玩家执行 call 动作后，立刻发完剩下的牌，进行最后的牌型比较。


    完成 4 轮的发牌和下注后，双方玩家根据自己的两张底牌和 5 张公共牌，组合出最大牌型进行比较，具有较大牌型的人获得所有的下注量，若双方打平则平分下注量。对于相同的牌型，首先依次比较参与牌型计算的扑克牌数字，数字大者获胜，若均相同再比较剩下的扑克牌数字。花色之间不进行比较。


    在进行牌型比较时，双方玩家需要亮出自己的底牌。如果一方玩家执行 fold 动作，则不需要亮出自己的底牌。


