- pgno: 140
  md: '决多智能体信度分配问题，COMA 策略梯度使用了一个反事实①基线，即边缘化单个智能体的行为，同时保持其他智能体的行为不变。COMA 策略梯度还使用了一种评价表示法，允许在一次向前传递中有效地计算反事实基线。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_140_0.png)


    对于智能体 a，用 u^a 表示其动作，τ^a 表示其历史观测-动作序列，π^a 表示其策略。u 表示所有智能体的联合动作，u^a 表示智能体 a 采用的任一动作，u^{-a}
    表示所有其他智能体 (除智能体 a 外) 的联合动作，s 表示系统全局状态，则智能体 a 的反事实基线可由式 (5.1) 计算：


    ```

    A^a(s,u) = Q(s,u) - \sum_{u''^a} \pi^a(u''^a|\tau^a)Q(s,(u^{-a},u''^a))

    ```


    等式右边第二项实际上是在计算关于 Q 的期望值，需要遍历智能体 a 动作空间里的所有动作，而保持其他智能体动作 u^{-a} 不变。该式计算的 A^a(s,u)
    能够根据每个智能体的策略有所区分，即为单个策略对整体策略贡献度大小的评价。


    有了目标函数，下一步计算梯度并优化更新。COMA 策略梯度计算公式如下：


    ```

    g_k = E_{\pi} \left[ \sum_a \nabla_{\theta_k} \log \pi^a(u^a|\tau^a)A^a(s,u) \right]

    ```


    其中，k 表示迭代次数；θ_k 表示第 k 次迭代时的参数。


    此外，A^a(s,u) 的更新采用 TD(λ) 算法，并使用周期性更新参数的目标网络来计算目标值。COMA 策略梯度算法如算法 5.1 所示。'
