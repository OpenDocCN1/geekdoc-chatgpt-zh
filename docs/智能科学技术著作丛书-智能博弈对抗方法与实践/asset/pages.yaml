    call (跟注)、check (过牌)、raise (加注)、fold (弃牌)。


    call 动作表示下注的总筹码量增加到与上一个玩家相同。在执行 call 动作时，如果该动作是本轮第一个执行的动作或者上一个玩家没有加注，该动作被称为 check
    (不需要向底池中加入筹码)。'
