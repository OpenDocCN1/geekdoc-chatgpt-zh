    本节主要研究《星际争霸》中的博弈对抗决策方法，应用在《星际争霸》中的主流强化学习方法有 COMA 策略梯度算法、VDN 算法、QMIX 算法、QTRAN 算法，下面着重介绍这几种算法的核心思想与流程，对其他相关算法及理论证明感兴趣的读者请阅读论文原文。


    # 1. COMA 策略梯度算法


    许多现实世界中的问题被建模为协作多智能体系统（如自动驾驶车辆的协调），非常需要新的有效的强化学习方法学习系统的分散策略。为此，牛津大学的 Foerster
    等[1]提出了一种基于策略梯度的多智能体强化学习算法，即 COMA 策略梯度。COMA 策略梯度采用集中式训练分布式执行（centralized training
    and decentralized execution, CTDE）框架，适用于多智能体协作任务，如图 5.3 所示。其中，集中式部分是联合行为值函数网络，即集中式网络在各个智能体之间共享。分布式部分是策略网络，即所有智能体的
    Actor 网络共享参数。训练过程是利用集中式的行为值函数来指导策略网络的训练。在协作环境中，联合动作通常只会返回全局性的收益，这使得每个智能体很难推断出自己对团队成功的贡献度。利用团队奖励拟合出的值函数不能评价每个智能体的策略对整体的贡献度，为了解'
