- pgno: 19
  md: '等各个领域。智能博弈对抗理论主要是以多智能体学习理论为基础，包括非完全信息动态博弈（可用于序贯交互式多方博弈过程的建模）和多智能体马尔可夫博弈（可用于同时行动多智能体协同对抗过程的建模）。


    在理论研究上，智能博弈对抗技术在围棋、德州扑克、《星际争霸》等博弈问题上取得巨大突破，颠覆了传统博弈论对于均衡的过分关注。人工智能技术的飞速发展使博弈论如虎添翼，早期被认为难以求解的大量复杂博弈问题正逐渐被层出不穷的新方法攻克。强化学习、元学习、集成学习、迁移学习等新方法的引入，高效搜索、安全剪枝、并行优化、子博弈求解、自博弈等技术的发展，为解决复杂环境、超大规模、不完全不确定条件下的智能决策问题提供了有力的支撑。


    在实际应用上，智能博弈对抗技术目前已涉足民用领域中的自动驾驶、芯片设计、电子商务、内容推送、金融风控、广告竞价和机器人控制等，以及军用领域的智能态势感知、战术辅助决策和训练分析系统。在经济社会领域，智能博弈对抗在处理社会治理安全、数字金融、拍卖机制设计等子领域提供解决方案。在军事作战领域，智能博弈对抗是通过模拟战场环境进行战争推演、战争预测和战争学习的重要方法，可为指挥控制智能化设计、跨域无人集群协同对抗、多域协同防空、海上舰船对抗等问题提供解决方案。


    # 1.3 智能博弈对抗相关研究应用


    随着第三次人工智能浪潮的到来，智能博弈对抗方法的研究已然成为各院校、研究机构的重点方向。国外的阿尔伯塔大学、卡内基梅隆大学、美国国防部高级研究计划局(Defense
    Advanced Research Projects Agency, DARPA)、纽约大学、伦敦大学、DeepMind、OpenAI、Facebook等研究单位已开展了深入研究。国内的清华大学、北京大学、阿里巴巴、腾讯、南京大学、中国科学院自动化研究所、国防科技大学、哈尔滨工业大学等也各自从不同的角度进行了探索。典型的智能博弈对抗相关研究应用包括即时策略类对抗、序贯策略类对抗、军事仿真类对抗三大类。


    # 1.3.1 即时策略类对抗


