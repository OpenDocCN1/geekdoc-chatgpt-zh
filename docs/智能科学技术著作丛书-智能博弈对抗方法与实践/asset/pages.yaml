    纯”增加了输入的特征数量，博弈树变得更加庞大，使用 MCCFR 类似的算法依

    然可以获得一个可行解。从 Pluribus 的实践效果来看，的确能取得不错的效果。

    然而，理论上这种纯粹的扩展方法并没有强有力的保证。


