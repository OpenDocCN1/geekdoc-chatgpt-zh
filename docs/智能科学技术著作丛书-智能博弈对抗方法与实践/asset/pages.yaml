  md: '理对手和队友的手牌范围，挑选确定节点扩展可以加快算法的效率。对于任意给定状态 s（属于 S），其先验概率表示为 p(s)，其历史可表示为 H(s) =
    a1, a2, ..., ak。对于状态 {s1, s2, ..., sk}，后验概率 p(s|H) 可以采用贝叶斯推理方式计算：


    ```

    p(s|H) = \frac{p(s)p(s|H)}{\sum_{s''\in S} p(s'')p(H|Hs'')} \quad (7.2)

    ```


    ```

    p(a_1, a_2, \cdots, a_k|s) = \prod_{s^j, p(s^j)_s > x} Pr(a_j|s_j) \quad (7.3)

    ```


    然而，随之而来的难题是动作空间大导致的 p(s|H) 难计算问题，当对手为非理性时，推理结果不合理。文献[1]设计了一种两阶段推理算法应对以上难题。在第一阶段，大量确定性节点是随机生成的，根据分数过滤保留一小部分生成的节点。分数是由一个
    6 层的一维卷积神经网络给出的，该神经网络是通过自博弈训练而来的。在第二阶段，采用贝叶斯方法和策略值网络计算第一阶段生成样本的近似后验概率。


    # 3) 自博弈训练


    训练分为两个阶段。在第一阶段，先使用一种手工编码的启发式算法来引导训练过程。启发式算法进行 20 万场自对弈，然后利用游戏结果作为监督学习数据，更新策略值网络参数，获得一个自博弈的初始化策略。在第二阶段，开始自博弈过程，当任何玩家的手牌数量少于
    15 张时，应用贝叶斯推理估计对手手牌。


    # 2. 自博弈强化学习


    MCTS 方法的实质在于随机模拟，即通过不断地重复实验来估计真实价值。在强化学习领域，MCTS 方法存在两个显著缺点：①不能处理不完整的状态序列；②采样导致方差大，采样效率很低。然而，MCTS
    方法应用于斗地主这类典型的多智能体合作序贯博弈具有以下优点。


    +   (1) 斗地主可以很容易产生完整的对局，保证状态序列的完整性。


    +   (2) 很容易对动作进行编码。斗地主的动作与动作之间是有内在联系的。以三带一为例，如果智能体打出 KKK 带 3，并因为带牌带得好得到了奖励，那么其他牌型的价值，如
    JJJ 带 3，也能得到一定的提高。这是由于神经网络对相似的输入会预测出相似的输出。动作编码对处理斗地主庞大而复杂的动作空间非常有帮助。智能体即使没有见过某个动作，也能通过其他动作对价值做出估计。


    +   (3) 不受过度估计的影响。最常用的基于价值的强化学习方法是 DQN。众所周知，DQN 会受过度估计的影响，即 DQN 会倾向于将价值估计得偏高，并且这'
