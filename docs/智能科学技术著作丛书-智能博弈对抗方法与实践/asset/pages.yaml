  md: "化学习和计算博弈理论方法是通用博弈策略学习方法的基础学习器，面对元博弈的种群演化自主学习方法与分布式计算框架的结合，Muller 等[115]提出 \\\
    (\\alpha\\)-rank 和 PSRO 学习方法。此外，一些支持并行分布式计算的演化策略学习方法[188]为开展无导数的博弈策略学习提供了参考。面向连续博弈的策略优化方法为多智能体博弈策略学习提供了基于策略梯度的解决方法。此外，由于非平稳性，智能体需要连续适应变化，需要具备持续学习的能力。\n\
