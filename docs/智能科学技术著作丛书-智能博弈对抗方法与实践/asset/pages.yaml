  md: '# # 第 6 章 竞争式序贯博弈对抗决策智能体设计


    # ## 6.1 引言


    博弈论作为研究军事、政治、社会、经济等各领域中竞争与合作的理论，其思想几乎无处不在。近年来，人工智能技术的飞速发展使博弈论“如虎添翼”——早期被认为难以求解的大量复杂博弈问题正逐渐被层出不穷的新人工智能算法攻克。其中，高效搜索、安全剪枝、并行优化、子博弈求解、自博弈等技术的发展，为解决复杂环境、超大规模、不完全不确定条件下的智能决策问题提供有力的支撑。德州扑克是当前竞争式序贯博弈对抗中极具挑战性的问题，也是大规模不完全信息动态博弈算法测试的基准之一，是继围棋之后最受关注的人工智能领域难题之一。2018
    年，美国陆军签订了高达千万美元的合同，以赞助德州扑克求解技术的研究工作。本章以德州扑克为研究对象展开：6.2 节介绍德州扑克基础知识，分析德州扑克问题复杂度，剖析关键技术；6.3
    节总结德州扑克 AI 研究历程，介绍德州扑克智能博弈系统，从两人无限注和多人无限注德州扑克开展实验验证。


    # ## 6.2 面向德州扑克的序贯博弈对抗决策


    # ### 6.2.1 无限注德州扑克规则


    针对计算机博弈，以下分别介绍两人无限注和多人无限注德州扑克博弈规则①。


    +   1. 两人无限注德州扑克博弈规则


    在每局对抗开始前，每个玩家拥有的筹码量均为 20000，双方玩家根据位置分为“小盲注”位 (P1)和“大盲注”位 (P2)。小盲注位需要强制先下注 50，大盲注位需要强制先下注
    100。在每局对抗结束后，玩家的筹码重新设置为 20000 (因此每局对抗之间都是独立的，便于算法的开发和测试)，并交换双方玩家的位置 (减小位置优势)。一局德州扑克中有
    52 张除掉大小王的扑克牌，由 pre-flop (翻牌前)、flop (翻


    ① 为便于算法的开发和测试，计算机博弈领域的德州扑克规则与实际游戏规则稍有差异。'
