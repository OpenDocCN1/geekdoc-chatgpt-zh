  md: '# 8.2.3 关键技术分析


    在计算机博弈中，知识驱动的方法通常是研究初期的首选路线，兵棋 AI 的开发也进行了类似的尝试。通过理解兵棋设计者或指挥员的知识和经验，抽取作战规则、条令条例等非结构化信息，建立结构化数据库，让
    AI 按照确定性规则或依照某一概率分布进行推理决策，能够实现初步的自主决策。知识库的完备程度越高，自主决策能力越强。在解决决策规则表示和专家样本生成问题的前提下，基于规则推理、案例推理、模糊推理、集成推理等推理机的指挥决策模型，应用在以局部战斗为特点的小型推演中，可以基本满足作战仿真对抗的指挥决策需求。但知识驱动的方法缺点十分明显，即使不计知识提取的艰难过程和其中的各项成本，仅靠机械、教条的规则，难以归纳指挥决策的复杂思维规律，也无法应对规则之外的情形。再者，知识驱动推理型
    AI 的上限是指挥员（领域专家）的个人经验，难以超越人类的智力水平，缺点是容易被对手发现利用。因此，知识驱动的兵棋 AI 往往成为 AI 水平测试的比较对象。


    随着机器学习、大数据的发展，兵棋研究也从以知识和推理为重点，转向以学习为重点。机器学习模拟指挥员的学习工作方式，依靠算法和强大的算力，从海量数据中学习知识。不仅灵活性高，数据学习型
    AI 可以通过不断优化学习，探索未知战术战法，展示出一定的智能性。


    数据学习型兵棋 AI 是基于大量数据及与环境的交互，通过深度学习、强化学习等方式不断学习训练得到的决策模型。因此，数据生成、采集和存储尤其关键。秉着可重用、可扩展、高性能、完备性、再获取易用性和安全性的仿真数据采集原则，按照上游、下游、中游、主动、被动、同步、异步等多种采集模式，需要合理的采集机制，才能在大型兵棋推演系统中，既保证足够的数据而又不给系统带来过多的性能压力[4]。在获得高质量数据的基础上，融合多模态数据，充分挖掘数据背后的潜在规律，立足多源数据的层次化态势理解，推动对抗决策与行动规划。通过无监督学习、有监督学习和半监督学习等方式处理数据，为解决数据智能中的“感-知”环节提供支撑。对手意图的识别与本书第
    6 章相关方法类似，此处不再赘述。


    借鉴作战指挥结构天然的层次性特点，面对兵棋推演中超长视野的复杂决策和众多智能体分工协作，兵棋对抗决策方法分为宏观动作（多任务协作）和微观动作（战术机动决策）。宏观动作和预设的硬编码规则（行为树）有效避免了学习算法陷入微观决策中，同时压缩了动作空间，使强化学习产生高层对抗策略成为可能。如图
