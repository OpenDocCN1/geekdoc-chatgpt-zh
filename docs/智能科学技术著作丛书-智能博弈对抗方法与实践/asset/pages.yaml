  md: '随后，DeepMind 设计的 AlphaZero 将 AlphaGo Zero 的策略从围棋扩展到国际象棋和日本将棋等其他完全信息棋类博弈。2019
    年 11 月，DeepMind 团队推出了最后一个版本的围棋 AI MuZero[10]。MuZero 的技术特点在于：在不具备任何规则知识的情况下，也没有尝试为整个环境建模，而只是对
    AI 的决策过程重要的方面进行建模。MuZero 虽然无法访问完美的规则集，甚至对规则一无所知，但可以将这个规则集替换成用于搜索树状态转换建模的学习型神经网络。MuZero
    强大的学习和规划方法，为应对机器人技术、工业系统以及其他博弈规则尚不为人知的混乱现实环境提供技术支撑。


