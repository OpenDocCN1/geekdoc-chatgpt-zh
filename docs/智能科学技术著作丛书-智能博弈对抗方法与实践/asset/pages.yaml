  md: '分析循环压制环的长度。Sanjaya 等[11]利用真实的国际象棋比赛数据度量了人类玩家策略的非传递性。


    # 9.3.2 开放式学习框架


    基于元博弈理论，Lanctot 等[12]最早提出了面向多智能体强化学习的策略空间响应预言机(policy space response oracle, PSRO)统一博弈学习框架。Tuyls
    等[13]面向多人常和博弈，提出了基于 α-Rank 和 PSRO 的通用学习方法框架，但这些框架仍是迭代式同步策略更新框架。为了与分布式强化学习等框架配合使用，一些新型的并行化框架相继被提出。如图
    9.4 所示，Stephen 等[14]提出要采用并行化 PSRO 的方法来加快策略分层与提升。此外，Zhou 等[15]设计了满足种群多智能体强化学习的
    MALib 并行学习框架，并提出了有效的 PSRO 方法[16]。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_230_0.png)


    图 9.4 并行化策略迭代学习


    # 9.4 元认知：认知行为框架


    # 9.4.1 快与慢


    Kahneman[17]指出，人类的决策通常由两种系统合作完成：系统 1 可以做直觉、不精确、快速且通常是无意识的决定（“快思考”），系统 2 可以处理复杂情况，需要逻辑和理性思考（“慢思考”），如图
    9.5 所示。系统 1 主要由直觉引导而不是深思熟虑，可以快速给出简单问题的答案，但由于无意识的偏见、依赖于启发式或其他捷径，这样的答案有时是错误的。同时，由系统
    1 建立的世界模型可以通过因果推理填补知识空白，使得我们能够合理应对日常生活中的许多刺激。当问题过于复杂时，系统 2 可以访问额外的计算资源，进行复杂的逻辑推理来解决'
  merge: -1
  img_proc: true
- pgno: 231
  md: '它。想要解决复杂的算术计算或多准则优化问题，人类能够认识到问题超出了认知容易度的阈值，需要激活更全面和准确的推理机制，在这个过程中，元认知（metacognition）是必不可少的。当一个新且难的问题出现时，通常由系统
    2 处理。然而，随着时间的推移，某些问题的求解可以直接传给系统 1，这是由于系统 2 用于寻找此类问题的解决方案的过程知识被系统 1 积累下来，以后可以毫不费力地使用这类经验。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_231_0.png)


    # 图 9.5 基于快与慢的对偶学习框架


    # 9.4.2 元认知


    在漫长的人类进化过程中，人类拥有概括、适应、因果分析、抽象、常识推理、伦理推理，以及由隐性和显性知识支持的学习和推理能力。对人类拥有这些能力的机制进行更好的研究，可以帮助我们理解如何给人工智能系统赋予这些能力。根据
    Kahneman 的“快与慢”思维理论，Ganapini 等[18]提出了一种多智能体 AI 元认知框架，如图 9.6 所示，其中传入的问题由系统 1 智能体解决，这些智能体仅利用过去的经验做出反应，或者由系统
    2 智能体做出反应，当需要推理和搜索超出系统 1 智能体预期的最佳解决方案时，这些智能体被故意激活。这两种智能体都有一个包含环境领域知识的世界模型和一个包含系统过去行为和解决者技能信息的“自我”模型支持。考虑到需要在这两种类型的解决者之间进行选择，使用了一个元认知智能体，执行自省和仲裁角色，并通过考虑资源限制、解决者的能力、过去的经验和正确解决给定问题的预期奖励来评估使用系统
    2 解决者的需求。为了以一种有资源意识的方式实现这种平衡，元认知智能体包括两个连续的阶段，第一个阶段更快、更接近，第二个阶段（如果需要）更仔细。'
  merge: -1
