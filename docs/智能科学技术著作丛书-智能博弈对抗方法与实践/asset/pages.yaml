  md: '式部分可观马尔可夫决策过程 (interactive-POMDP, I-POMDP) 模型是博弈论与决策论的结合。早在 20 世纪 50 年代由 Shapley
    提出的随机博弈 (stochastic game, SG)[30]，也称马尔可夫博弈 (Markov game, MG)[31]，常被用来描述多智能体学习。当前的一些研究将决策论与博弈论统合起来，认为两类模型都属于部分可观随机博弈
    (partially observable stochastic game, POSG) 模型[32]。


    如图 2.3 所示，从博弈论视角来分析，多智能体博弈模型主要分两大类：随机博弈和扩展式博弈 (extensive-form game, EFG)。最新的一些研究将扩展式博弈模型重构成因子可观随机博弈模型[31]，这两大类模型都可以看成随机博弈模型。


