- pgno: 38
  md: '博弈。在动态博弈中，若局中人完全了解自己行动之前的整个博弈过程，称局中人具有完美信息，否则称局中人具有不完美信息，所有局中人都具有完美信息的博弈称为完美信息博弈，至少一个局中人具有不完美信息的博弈称为不完美信息博弈。


    # 3. 静态博弈和动态博弈


    若博弈过程中，所有的局中人都只有一次行为机会并且他们在信息意义下同时行为，则称此博弈为静态博弈。若博弈过程中，有些局中人有不止一次行为机会，或有些局中人在行为前能够预测到一些其他局中人的行为，则称该博弈为动态博弈。根据局中人对信息的掌握情况可分为完全信息静态博弈、完全信息动态博弈、不完全信息静态博弈、不完全信息动态博弈。


    # 4. 零和、常和与变和博弈


    根据收益之和的不同，博弈可以分为零和博弈、常和博弈和变和博弈。其中零和博弈是指一方的收益（获得）与另一方的支付（损失）对应，即对任务策略组合，各局中人的收益之和为零。常和博弈是指对任务策略组合，各局中人的收益之和为一固定的常数。变和博弈是随着策略组合的不同，各局中人的收益之和也发生变化的情形。


    # 5. 其他分类


    根据局中人数量的多少，可以将博弈分为两人博弈、三人博弈、多人博弈。根据局中人策略集中元素的个数，可以将博弈分为有限博弈和无限博弈。根据同类博弈进行的次数，可以将博弈分为单次博弈和重复博弈。此外还有一些其他类型的博弈，如不确定博弈、演化博弈、微分博弈、网络博弈、算法博弈、有限理性博弈、行为博弈和博弈学习理论等。


    # 2.2.3 博弈论相关概念


    # 1. 一般解概念


    非合作博弈：纳什均衡、颤抖手均衡、行为策略的序贯均衡、行为策略的贝叶斯均衡、行为策略完美贝叶斯均衡和子博弈完美均衡等均衡概念。


    合作博弈：核心、内核、核仁、沙普利值、稳定集、谈判集、班扎夫权力指数、欧文值、舒比克权力指数等均衡解概念。


    # 2. 有限理性与欺骗


    现实生活中理性假设设定要求太高，因此有限理性假设得到了广泛的关注。'
