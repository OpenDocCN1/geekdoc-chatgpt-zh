    # 4.3.2 策略对抗规划


    对于策略对抗规划方法的研究，一些工作引入了抽象机制[43]，包括动作抽象和状态抽象，将原始动作替换为脚本动作，例如，Justesen 等[44]提出的 Script-UCT
