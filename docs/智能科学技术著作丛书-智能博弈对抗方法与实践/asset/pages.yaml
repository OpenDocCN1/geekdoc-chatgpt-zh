  img_proc: true
- pgno: 137
  md: '(3) 典型的不完全信息游戏。地图只能通过本地摄像头部分观察到游戏信息，为了让玩家整合信息，必须主动移动摄像头；此外，战争迷雾的存在，使玩家无法观察地图上未被访问的区域，有必要积极探索地图以确定对手的状态。


    (4) 动作空间巨大。玩家通过点击鼠标界面，在大约 10^8 种可能性的组合空间中选择动作。并且动作空间是动态的，即随着游戏的进行，合法行为的集合也会发生变化。


    (5) 游戏通常持续成千上万的框架和动作，玩家很早之前决定的后果可能无法被及时体现，导致在游戏信息度分配中存在丰富的挑战和探索。


    # 5.2.2 问题复杂度分析


    以一个典型的 128×128 像素地图为例，在任何时候，地图上有 50~400 个单元，每个单元都可能存在一个复杂的内在状态(剩余的能量和击打值、待输出动作等)，这些因素将导致可能的状态空间极其庞大。即便是仅仅考虑每个单元在该地图上可能的位置，400
    个单元就有共计 (128×128)^400 = 16384^400 ≈ 10^1685 种可能。


    如果按分支因子 b 和游戏深度 d 来分析《星际争霸》的复杂度，整个游戏的复杂度用 b^d 来计算。对比其他游戏，国际象棋中 b ≈ 35、d ≈ 80，围棋中
    b = 30~300、d = 150~200。在《星际争霸》中，假定一个玩家控制 50~200 个单元，分支因子 b 的范围是 u^50 ~ u^200 (u
    是每个单元可以执行动作的平均数)。为进一步估算 u 值，假设：①一个友军单位的射程内最多有 16 个敌人；②当 AI 在玩《星际争霸》时，只需要考虑每个单位在
    8 个基本方向上的移动(而不是在任何时间点向地图上的任何地方发出移动命令)；③关于建造动作，人族的工人单位只在他们当前的位置建造(如果他们需要移动，则认为这是首先发出移动动作，然后建造)；④只考虑人族。基于这些假设，《星际争霸》中的单位可以执行
