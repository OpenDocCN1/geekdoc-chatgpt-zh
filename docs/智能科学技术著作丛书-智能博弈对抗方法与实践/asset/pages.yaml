- pgno: 232
  md: '![](img/cabd2c20e917d014f37d4e65ac1e41e0_232_0.png)


    图 9.6 多智能体 AI 元认知框架[18]


    许多现实生活中的场景存在序贯决策问题。根据系统 1 和/或系统 2 求解器的可用性，它们可以处理单个决策或一系列决策，这种多智能体 AI 体系结构在每个决策中使用元认知智能体，或者对整个序列只使用一次。第一种模式提供了额外的灵活性，因为元认知智能体的每次调用可以选择不同的求解器来做出下一个决定，而第二种模式允许在求解器中利用额外的领域知识。


    # 9.4.3 认知行为建模


    智能体认知行为建模是构建通用智能体的基础，是人工智能由计算智能、感知智能向认知智能演化的重要研究方向。如何在感知能力和计算能力已经超越人类的情况下，进一步赋予智能体学习和推理的认知能力，是推动人工智能技术发展的关键。根据
    Kotsерuba 等[19]的调研分析，截止到 2020 年，可通过公开文献及学术信息源确认的认知框架有近 195 种，根据研究目标的不同，这些认知框架可以分为人脑认知建模、智能体行为建模以及人类行为建模三类。如图
    9.7 所示，卡内基梅隆大学的 Anderson 等[20]提出了人类联想记忆理论和自适应思维控制(adaptive control of thought,
    ACT)理论，Laird[21]提出的 Soar 框架是在密歇根大学领导的团队维护开发的，可用于问题求解、规划、决策和自然语言处理等问题的研究。'
