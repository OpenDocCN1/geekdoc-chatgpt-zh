    \(C^\pi(i, s, j)\)，表示为


    ```

    $C^\pi(i, s, j) = \sum_{s'', k} P(s'', k|s, j) \gamma^k V(i, s'')$

    ```


    根据完成函数的定义，动作值函数 $Q^\pi(i, s, j)$ 可重新表述为


    ```

    $Q^\pi(i, s, j) = V^\pi(j, s) + C^\pi(i, s, j)$

    ```'
