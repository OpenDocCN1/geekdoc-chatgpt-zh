    # 2.4.3 多智能体博弈学习的挑战


    # 1. 复杂博弈环境难评估


    复杂博弈环境验证评估主要体现在三个方面：①信息不完全。环境中的不完全信息因素提高了博弈决策的难度。考虑战争迷雾造成的不完全信息问题中，关于其他智能体的任何关键信息（如偏好、类型、数量等）的缺失，都将直接影响智能体对世界状态的感知，并间接增加态势节点评估的复杂性。不仅如此，考虑不完全信息带来的“欺骗”（如隐真、示假等）行为，将进一步扩展问题的维度。②不确定性。不确定性引入了系统风险，任何前期积累的“优势”都可能因为环境因子的负作用而“落空”。如何综合评估当前态势进行“风险投资”，以获得最大期望奖励，成为研究的另一个难点。在策略评估与演化过程中，如何去除不确定因素带来的干扰，成为“准确评价策略的好坏、寻找优化的方向”的难点。③对抗空间大规模。在一些复杂博弈环境中，状态空间和动作空间的规模巨大，如表
    2.2 所示，搜索遍历整个对抗空间无论是时间约束上还是存储空间约束上都难以满足要求。模型抽象的方法在一定程度上可以减小问题的规模，但缺乏理论保证，往往以牺牲解的质量为代价。即使以求解次优策略为目标，部分优化方法仍旧难以直接应用到抽象后的模型。蒙特卡罗采样可以有效地加快方法的速率，但在复杂环境下，如何与其他方法结合，并降低搜索中的方差依旧是研究的难点。'
