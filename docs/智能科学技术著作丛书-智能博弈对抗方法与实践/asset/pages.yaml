  md: '一些新的模型考虑各类博弈模型的局中人模型与环境设置，如针对有限理性局中人有随机最优响应均衡模型、前景理论模型、Level-K 模型与认知层次模型、心智理论模型。同时，对抗双方的欺骗也得到了广泛关注，如基于多目标优化的有限欺骗模型、面向行动轨迹分析的多模态欺骗策略模型等。当前对相关欺骗的研究主要集中在信息网络空间上的欺骗。


    # 3. 博弈与决策


    博弈论在运筹学领域也称对策论。运筹学包含最优化理论和博弈论两大方向的理论，其中最优化理论主要研究单方面决策，追求最优或次优解；博弈论主要研究多方交互决策，通常追求稳定最优解。决策理论曾经有四个分支：一是最优化决策，即单个个体如何在各种条件状态下进行效果最优的决策；二是不确定性决策，即局中人对一项活动最终到底会发生的结果不确定，同时也无法确定每一种结果发生的概率；三是风险型决策，即局中人对一项活动最终到底会发生什么结果不确定，但局中人知道共有几种可能的结果，以及这些结果的概率分布，而且局中人有着不一样的风险偏好，如风险厌恶型、风险中立型、风险热爱型；四是冲突型决策，即博弈论可以采用前三种类型相关的最优化决策、不确定性决策和风险型决策来求解博弈解。


    # 2.3 多智能体学习简介


    多智能体系统(multi-agent system, MAS)是由多个独立的智能体组成的分布式系统，每个智能体均受到独立控制，但需在同一个环境中与其他智能体交互。Shoham
    等[1]将多智能体系统定义为：包含多个自治实体的系统，这些实体要么有不同的信息，要么有不同的兴趣，或两者兼有。Müller 等[2]对由多智能体系统技术驱动的各个领域的
    152 个真实应用进行了分类总结和分析。多智能体系统是分布式人工智能(distributed artificial intelligence, DAI)的一个重要分支，主要研究智能体之间的交互通信、协调合作、冲突消解等方面的内容，强调多个智能体之间的紧密群体合作，而非个体能力的自治和发挥。智能体之间可能存在对抗、竞争或合作关系，单个智能体可通过信息交互与友方进行协调配合，一同对抗敌对智能体。由于每个智能体均能够自主学习，多智能体系统通常表现出涌现性能力。当前，多智能体系统模型常用于描述共享环境下多个具有感知、计算、推理和行动能力的自主个体组成的集合，典型应用包括各类机器博弈、拍卖、在线平台交易、资源分配(包括路由、服务器分配)、机器人足球、无线网络、多方协商、多机器人灾难救援、自动驾驶和无人集群对抗等。其中，基于机器博弈(计算机博弈)的人机对抗，作为图灵测试的典型范式，是人工智能领域的'
  merge: -1
  img_proc: true
- pgno: 40
  md: '“果蝇”。多智能体系统被广泛用于解决分布式决策优化问题，其成功的关键是高效的多智能体学习（multi-agent learning, MAL）方法。多智能体学习主要研究由多个自主个体组成的多智能体系统如何通过学习探索、利用经验提升自身性能的过程。如何通过博弈策略学习提高多智能体系统的自主推理与决策能力是人工智能和博弈论领域面临的前沿挑战。近年来，伴随着深度学习（感知领域）和强化学习（决策领域）的深度融合发展，多智能体学习方法在机器博弈领域取得了长足进步。


    # 2.3.1 多智能体学习系统组成


    多智能体学习是人工智能研究的前沿热点。从第三次人工智能浪潮至今，社会各界对多智能体学习产生了极大的兴趣。多智能体学习在人工智能、博弈论、机器人和心理学领域得到了广泛研究。面对参与实体数量多、状态空间规模大、实时决策巨复杂等现实问题，多智能体建模变得更加困难，手工设计的智能体交互行为迁移性比较弱。相反，基于认知行为建模的智能体能够从与环境及其他智能体的交互经验中学会有效地提升自身行为，在学习过程中，智能体可以学会如何与其他智能体进行协调，如何选择自身行为，学习其他智能体如何进行行为选择以及它们的目标、计划和信念等。


    多智能体系统模型包含四大模块：环境、智能体、交互机制和学习。当前针对多智能体学习的相关研究主要围绕这四部分展开，如图 2.1 所示。


