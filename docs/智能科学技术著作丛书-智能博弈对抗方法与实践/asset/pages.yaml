    1 对 1 空中格斗中驾驶模拟 F-16 战斗机。随后，冠军 AI 在模拟器中与一名经验丰富的 F-16 战斗机飞行员进行了 5 次模拟“狗斗”，最终以 5:0
    击败了人类。


    2021 年 3 月 18 日，DARPA 取得若干关键阶段性成果：进行视距内与视距外多飞机场景的人工智能虚拟空中格斗；进行人机共生飞行试验，以观测飞行员生理状况以及对人工智能的信任程度；对有载全尺寸教练机的初步修改，支持项目第三阶段的人工智能“飞行员”上机。


    # 4. “雅典娜”


    目前美军作战训练数据库中已有的数据并不支持机器学习和其他人工智能方法。美海军陆战队正在研制“雅典娜”（Athena）[22]，一款专门用于训练、测试未来人工智能应用的推演平台，获取用于测试军事决策的人工智能应用程序的大量数据。它提供了一系列战争游戏，用于收集玩家数据，优化人工智能应用程序。一旦有足够的数据量，“雅典娜”就可以自行模拟现代军事行动，并提出新型战术。分析认为，博弈实验平台已成为训练和测试人工智能应用程序的一种有效方法途径。正是因为面临缺数据的瓶颈问题，同时看到了这一新途径，美军推出了上述一系列举措。这些举措可以视为美军在为发展指挥控制智能化探路、打基础。


    # 5. “指南针”


    2018 年 3 月，DARPA 战略技术办公室发布了一项名为“指南针”（COMPASS）[23]的项目，旨在帮助作战人员通过衡量对手对各种刺激手段的反应来弄清对手的意图。目前采用的观察—调整—决策—行动（observe-orient-decide-act,
    OODA）环不适合于“灰色地带”作战，因为这种环境中的信息通常不够丰富，无法得出结论，且对手经常故意植入某些信息来掩盖真实目的。该项目试图从两个角度来解决问题：首先试图确定对手的行动和意图，然后确定对手如何执行这些计划，如地点、时机、具体执行人等。但在确定这些之前必须分析数据，了解数据的不同含义，为对手的行动路径建立模型，这就是博弈论的切入点。然后在重复的博弈论过程中使用人工智能技术在对手真实意图的基础上试图确定最有效的行动选项。


