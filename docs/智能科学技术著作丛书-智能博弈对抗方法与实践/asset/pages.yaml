  md: "在给定最优状态值函数 $V^*(s)$ 的情况下，可以根据以下规则选择最优动作，即\n\n$$\n\\pi^*(s) = \\arg \\max_{a\
    \ \\in A} V^*(s)\n$$ \n(3.7)\n\n类似地，在给定最优状态-动作值函数 $Q^*$ 的情况下，最优动作选择根据以下规则进行，即\n\
    \n$$\n\\pi^*(s) = \\arg \\max_{a \\in A} Q^*(s, a)\n$$ \n(3.8)\n\n这种策略称为贪婪策略。精确求解式\
    \ (3.7) 或者式 (3.8) 就可以找到 MDP 问题的最优解，但是在很多情况下，由于计算复杂度问题，精确求解往往是行不通的。\n\n# 3.2.2\
    \ 马尔可夫决策过程求解方法\n\n本章所描述的 MDP 问题，可以采用状态空间描述，最优策略刚好对应最优决策路径。主要求解方法包括策略迭代、值迭代和蒙特卡罗树搜索等。\n\
    \n+   1. 策略迭代\n\n策略迭代方法循环进行策略评估和策略改进，直到收敛。策略评估用以计算当前策略下的值函数。策略改进阶段通过最大化值函数改进当前策略。策略评估阶段的第一步是计算固定策略\
    \ $\\pi$ 的值函数 $V^\\pi$。对于任意 $s \\in S$，均有\n\n$$\nV^\\pi(s) = \\sum_{s' \\in S}\
    \ P(s, \\pi(s), s') [R(s, \\pi(s), s') + \\gamma V^\\pi(s')]\n$$ \n(3.9)\n\n接着，值函数更新规则通过向前多看一步的策略，将当前值函数\
    \ $V^{\\pi_k}$ 更新到 $V^{\\pi_{k+1}}$，即\n\n$$\nV^{\\pi_{k+1}}(s) = \\sum_{s' \\\
    in S} P(s, \\pi(s), s') [R(s, \\pi(s), s') + \\gamma V^{\\pi_k}(s')]\n$$ \n(3.10)\n\
    \n策略改进是指在给定原策略 $\\pi$ 的值函数 $V^\\pi$ 的情况下，不断改进当前策略，从而获得一个更好的策略 $\\pi'$。贪婪策略是最常用的改进策略，即\n\
    \n$$\n\\pi'(s) = \\arg \\max_a Q^\\pi(s, a) = \\arg \\max_{s'} \\sum_{s'} P(s,\
    \ a, s') [R(s, a, s') + \\gamma V^\\pi(s')]\n$$ \n(3.11)\n\n其中，$Q^\\pi$ 是策略 $\\\
    pi$ 的动作值函数。对于所有 $s \\in S$，均满足 $V^{\\pi'}(s) \\geqslant V^\\pi(s)$。\n\n总体来说，策略迭代从任意初始策略\
    \ $\\pi_0$ 开始，交替进行策略评估以及策略改"
