    # 7.2.2 问题复杂度分析


    本节主要分析斗地主打牌阶段（地主视角下）的复杂度。


    斗地主信息集数量为 10^83，信息集平均大小高达 10^23，且几乎无法进行信息抽象，因为每一张卡片都很重要。例如，在历史动作中 “牌 2” (不区分花色)
    数量是至关重要的，因为玩家需要决定他们的纸牌是否会被其他 “牌 2” 的玩家所压制。因此，状态之间的微小差异对结果会产生巨大影响。学习一种有效的策略是非常具有挑战性的，因为智能体需要准确区分不同的状态。


    斗地主的动作空间十分庞大，有 27472 种牌型(表 7.1)，多于麻将和德州扑克，且不易抽象表示。例如，对于动作类型 “3 带 1”，错误地选择被带的单牌可能会直接造成损失，因为挑选错误的单牌可能会破坏
    “顺子”。因此，动作空间很难抽象，直面巨大的动作空间也给研究带来很大的挑战。


