  md: '9 个研究团队开展研究。Gamebreaker 项目致力于开发并将人工智能应用到现有的开放世界视频游戏中，以定量评估博弈均衡，确定显著有助于均衡的基本参数，并探索对博弈最不稳定的新功能、战术和规则修改。平衡游戏通常更具娱乐性，而市场压力有助于推动游戏的发展，因此商业游戏业对保持游戏平衡有着长期的兴趣。在未来的冲突中，DARPA
    的投资旨在最大化不平衡，以创造优势，或在对手寻求优势时寻求平衡。


    Gamebreaker 项目的目标不是从头开始，而是利用游戏行业在这些领域的重要人工智能发展，并在这些领域的基础上为 DARPA 独有的目的而发展。被选中的每个团队都提出了两场他们将试图打破规则的游戏。用来打破第一场游戏规则的人工智能将在第二场游戏中进行测试。


    # 1.4 主要内容及章节安排


    本书编撰的目的是帮助智能博弈对抗领域的初学者快速入门并掌握基本方法，为未来的研究和应用夯实基础。本书为深入研究智能博弈对抗问题提供全局视野、基本理论和实践方法，为后续研究奠定良好的基础。


    本书按照“理论方法、应用实践、前沿展望”的纵向逻辑进行编撰，整体遵循“什么”——介绍智能博弈对抗，“为什么”——为什么要研究智能博弈对抗，“怎么办”——如何进行智能博弈对抗研究。其中“什么”主要瞄准智能博弈对抗理论基础，相关概念是一切研究的前提；“为什么”主要阐述当前研究智能博弈对抗的必要性和紧迫性；“怎么办”是研究重点，占据两大篇章，主要分为理论方法和应用实践，力求最大限度地方便初学者。本书的各章节独立性比较强，因此，初学者不必从头开始阅读，直接阅读自己需要的或者自己感兴趣的部分即可。本书各章节的主要内容如图
    1.16 所示。


    第 1 章介绍智能博弈对抗的基本概念，重点讨论智能博弈对抗的内涵、意义，从即时策略类对抗、序贯策略类对抗和军事仿真类对抗三个方面认真梳理智能博弈对抗相关研究应用。


    第 2 章～第 4 章是理论方法，主要介绍智能博弈对抗的理论、相关基础方法。第 2 章基于博弈论相关基础知识介绍多智能体学习方法。第 3 章首先简要介绍马尔可夫决策过程，其次基于马尔可夫决策理论分别介绍强化学习方法、深度强化学习方法、分层强化学习方法，最后简要介绍满足分布式学习的三种分布式强化学习框架。第
    4 章首先对手建模方法展开介绍，分析对手建模面临的挑战，对两大类对手建模方法（显式和隐式）进行简要细分类；其次围绕即时策略类对抗中对抗规划问题进行梳理，指出未来研究重点；最后围绕序贯策略类对抗中的对手剥削方法进行梳理，指出未来研究重点。'
