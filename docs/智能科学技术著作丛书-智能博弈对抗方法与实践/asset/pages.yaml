  md: '# # 第1章 绪论


    # ## 1.1 引言


    在人类社会的经济、政治、金融和生活等民用领域，不同形式的对抗、竞争和合作广泛存在。其中，对抗是人类文明发展的最强劲推动力——个体与个体、个体与群体、群体与群体之间复杂的动态对抗演化，不断促进人类智能升级换代。尤其在军事领域，对抗的主题更加鲜明突出。军事对抗中的智能认知与决策问题需要面对“高复杂环境、不完全信息、强对抗博弈、高动态响应、自主无人化、多域跨域”等众多挑战。各国军方都在加快军事智能化建设，急需将最新的理论、方法和技术应用于军事对抗领域，这种需求极大地促进了人工智能技术的快速发展。人工智能支撑的智能化作战体系将具备自适应、自学习、自对抗、自修复、自演进等能力，认知对抗辅助决策导引下的智能无人集群自主对抗能力将大幅度提升。这类智能博弈对抗技术“集成到智能化指挥控制系统中与人类进行对抗，并通过不断进化升级最终超越人类决策水平”，正成为验证人工智能技术军事应用潜力的重要突破方向。


    人工智能技术的发展经历了计算智能、感知智能两个阶段，当前，云计算、大数据、互联网等技术的发展正助力人工智能技术第三阶段“认知智能”的飞跃发展。近年来，以非完全信息动态博弈和多智能体深度强化学习为代表的认知决策技术取得了很大的突破，以围棋
    AI 程序 AlphaGo、德州扑克 AI 程序 Pluribus、《星际争霸》AI 程序 AlphaStar 等为代表的人工智能程序在人机对抗比赛中战胜了人类顶级职业选手。这类智能博弈对抗技术为人工智能由计算智能、感知智能研究迈向认知智能研究提供了新范式。认知智能面向的理解、推理、思考和决策等主要任务，主要表现为会进行自主态势理解、理性做出深度慎思决策，是未来强人工智能的必经之路，此类瞄准超越人类智能水平的技术应用前景广阔，影响深远。


    本书以智能博弈对抗理论为基础，探寻博弈强对抗环境中不完全信息动态博弈面临的各类问题及求解方法，为目前各类智能博弈对抗技术应用于 AI 开发设计提供实践指导。'
  merge: -1
