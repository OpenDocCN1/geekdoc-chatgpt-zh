  md: '题。Hu 等[175]提出了智能体首次合作的零样本协调 (zero-shot coordination, ZSC) 问题。它对弈 (other play)
    [176] 方法为无预先沟通的多智能体协调学习提供了有效支撑。此外，关于人与 AI 组队，Lucero 等[177]利用《星际争霸》平台研究了人机组队问题，Waytowich
    等[178]研究如何运用自然语言指令驱动智能体学习，Siu 等[179]对各类人与 AI 组队方法进行了评估分析。


    # 2.6 前沿研究重点及方向


    # 2.6.1 前沿研究重点


    # 1. 拥抱新解概念：多智能体一般和博弈


    博弈论提供了博弈问题的理论分析工具，侧重讨论解概念的特征 (存在性、稳定性、安全性)、均衡精炼、收敛速率等。虽然博弈论提供了易于处理的解决方案概念来描述多智能体系统的学习结果，但是纳什均衡是一个仅基于不动点的静态解概念，在描述多主体系统的动态特性，如循环集、周期轨道和极限环方面有局限性。寻求具有更多优良特性的新多人博弈解概念将是博弈视角下求解多智能体博弈问题的新突破口。


    # 2. 提升可解释性：可解释性强化学习


    强化学习通过试错机制自主学习，结合深度神经网络，能够有效解决大规模的序列决策问题。人类难以理解其学习过程，“只知其然”而“不知其所以然”。尽管强化学习的效能和通用性不断提高，但它的不可解释性降低了它的实用性。不可理解的决策虽然是有效的，但有效性并不意味着它不可能是错误的。在空战等对抗场景中，决策的可解释性、可信任性、安全性是首要考虑因素。因此，需要在强化学习的效能与可解释性之间做出权衡。可解释性强化学习方法成为智能博弈未来发展的新目标。


    # 3. 融合新范式：对手建模与剥削


    对抗胜负的本质是超越对手的相对优势，决策的制定必须以对手的行动或策略为前提。纳什均衡是应对未知通用对手时最小化最坏可能性，用最“保险”的策略应对，但并不是寻求最优策略。现实世界中，对手通常是不完全理性的，这与纳什均衡解概念的前提假设不符。一些新的解概念被提出，结合显式对手建模和均衡近似，平衡利用性与剥削性，实现多目标优化，为融合对手建模的博弈学习提供参考。此外，在一些更加复杂的对抗场景中，如认知嵌套
    (建模对手的同时，对手也在建模利用己方)、欺骗、对手具有学习意识等，最大熵多智能体强化学习'
  merge: -1
  img_proc: true
- pgno: 63
  md: '成为研究如何进行博弈均衡对抗策略选择的新趋势。不仅如此，反对手建模方法也在同步发展。复杂博弈对抗场景中，如何基于对手模型安全利用对手，以及如何保全自我反对手建模成为新的探索性研究。


    # 4. 迈向通用 AI：多任务场景泛化


    学习模型如何更好地泛化到差异很大的新领域中，是一种更加高效和智能的学习方法。元学习逐渐发展成为让机器学会学习的重要方法。元学习是通用人工智能的分支，通过发现不同任务之间的普适规律，推广这种普适规律来解决未知难题。元学习的输入是一个任务集合，目的是对每个任务的特性和任务集合的共性建模，发现任务之前的共性和内在规律，以追求在差异较大任务之间的迁移，且不发生较大的精度损失。目前，元学习已经扩展到元强化学习、元模仿学习、元迁移学习、在线元学习、无监督元学习等。如何结合博弈理论和强化学习优势，构建高效、可解释性强、具有收敛性保障的元学习框架，将是未来智能博弈技术发展的巨大推动力之一。


    # 2.6.2 前沿研究方向


    # 1. 分布式博弈策略学习框架


    策略学习框架的设计需要协同考虑程序方法与分布式计算调度。当前双层优化方法[180]，特别是元学习、自主课程学习[157]和元演化学习[181]等方法为策略学习程序设计提供了指引。此外，Ray[182]、MAVA[183]和
    MALib[117]等分布式并行学习框架为基于元博弈的种群演化策略学习提供了底层计算调度支撑。


    # 2. 智能体认知行为建模与协同


    构建认知行为模型为一般性问题提供求解方法是获得通用人工智能的一种探索。各类认知行为模型框架[184]为智能体获取知识提供了接口。对抗环境下，智能体的认知能力主要包含对抗推理与反制规划[185]。认知行为建模可为分析对手思维过程、决策行动的动态演化、欺骗与反欺骗等认知对抗问题提供支撑。同时，合作条件下，认知行为建模可为智能人机交互、机器推理、协同规划、人类感知的智能系统[186]等问题求解提供指引。


    # 3. 通用博弈策略学习方法


    随着智能体数量的增加，动作和状态空间将呈指数级增长，从而在很大程度上限制了多智能体学习方法的可扩展性。在智能体数目大于 2 时，纳什均衡通常很难计算。Yang
    等[187]根据平均场思想提出的平均场 Q 学习方法和平均场 Actor-Critic 方法，为解决大规模智能体学习问题提供了参考。传统的多智能体强'
