  md: '例[3]，具体分析连级兵棋的复杂度，如图 8.3 所示。城镇居民地想定的六角格地图大小为 66×51。红蓝双方各有 2 个坦克算子、2 个战车算子和
    2 个人员算子。每个算子的属性包括当前位置、班组数、机动力、是否射击、是否压制、是否掩蔽等。完整连级想定共包含 5 个推演回合，每个回合 4 个阶段。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_207_0.png)


    # 图 8.3 连级兵棋想定


    对于状态空间复杂度，暂且考虑地图大小(66×51)、机动力 (6)、班组数 (3)、射击 (2)、压制 (2)、隐蔽 (2)、行军 (2)、夺控等要素 (以两个夺控点为例的夺控状态。0
    代表当前夺控点未被占领，1 代表当前夺控点被红方占领，2 代表当前夺控点被蓝方占领，两个夺控点 9 个状态分别为 00、01、02、10、20、11、22、12、21)：


    (66×51×6×3×2×2×2×2)^12 × 9 ≈ 6.2×10^72


    对于博弈树复杂度，为计算简单，我们只考虑机动动作空间，忽略射击、夺控等动作。在每个决策点，单个棋子每机动 1 格有 6 个方向，最多有 6 个可机动棋子，最少有
    1 个可机动棋子，为计算简单，平均候选动作个数按 (6×6+6)/2 = 21 计算。决策点的个数按 (6+6+3)×2×20 = 600 计算，其中 6、6、3
    分别表示坦克、战车、人员的最大机动力，2 表示各棋子类型的个数，20 表示可机动阶段数。因此，连级兵棋的博弈树复杂度为


    21^((6+6+3)×2×20) ≈ 10^793


    粗略地将兵棋问题的信息集数目等价于博弈树复杂度空间。对于兵棋问题的信息集平均大小，我们考虑位置、机动力等，不考虑随机因素：


    (66×51×6×3×2×2×2×2)^6 ≈ 8×10^35


    其中，指数 6 表示敌方不可见算子总数，最多为 6 个。'
