  md: '环境模块由状态空间、动作空间、转移函数和奖励函数构成。状态空间指定单个智能体在任何给定时间可以处于的一组状态；动作空间是单个智能体在任何给定时间可用的一组动作；转移函数（或环境动力学）指定了环境在给定状态下执行动作的每个智能体（或智能体的子集）改变的（可能是随机的）方式；奖励函数根据状态-行动转换结果给出奖励信号。智能体模块需要定义它们与环境的通信关系，用于获取观测状态和输出指定动作、智能体之间的行为通信方式，它们的效用函数可以表征环境状态偏好以及选择行动的策略。学习模块由学习实体、学习目标、学习经验数据和学习更新组成。学习实体需要指定是单智能体还是多智能体级别；学习目标描述了正在学习的任务目标，通常表现为评价函数；学习经验数据描述了学习实体可以获得哪些信息作为学习的基础；学习更新定义了在学习过程中学习实体的更新规则。交互机制模块定义了智能体交互多长时间，与哪些其他智能体交互，以及它们对其他智能体的观察。交互机制还规定了任何给定智能体之间交互的频率（或数量），以及它们的动作是同时选择还是顺序选择（动作选择的定时）。


    # 2.3.2 多智能体学习概述


    多智能体学习需要研究的问题是指导和开展研究的指南。Stone 等[3]在 2000 年从机器学习的角度综述分析了多智能体系统，主要考虑智能体是同质还是异质、是否可以通信等四种情形。早期相关综述文章采用公开辩论的方法分别从不同的角度对多智能体学习问题进行剖析，总结出多智能体学习的四个明确定义问题，即问题描述、分布式人工智能、博弈均衡和智能体建模[4]。Shoham
    等[5]从强化学习和博弈论视角自省式地提出了“如果多智能体学习是答案，那么问题是什么？”，由于没有找到一个单一的答案，他们提出了未来人工智能研究主要围绕的四个主题，即计算性、描述性、规范性、规定性。其中规定性又分为分布式、均衡和智能体，此三项如今正指引着多智能体学习的研究。Stone[6]试图回答
    Shoham 等提出的问题，但看法刚好相反，强调多智能体学习应包含博弈论，如何应用多智能体学习技术仍然是一个开放问题，没有一个标准的答案。Tošić 等[7]在
    2010 年提出了面向多智能体的强化学习、协同学习和元学习统一框架。Tuyls 等[8]在 2017 年分析了多智能体学习需要研究的五种方法：面向个人收益的在线强化学习、面向社会福利的在线强化学习、协同演化方法、群体智能和自适应机制设计。Tuyls
    等[9]指出应将群体智能、协同演化、迁移学习、非平稳性、智能体建模等纳入多智能体学习方法框架中研究。如图 2.2 所示，多智能体学习的主流方法主要包括强化学习、演化学习和元学习。其中，S、A、R
    分别表示状态空间、动作空间、奖励函数。'
