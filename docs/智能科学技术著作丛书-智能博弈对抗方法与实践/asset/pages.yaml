    # 3.4.2 基于模型的强化学习


    事实上，在知道动力学模型 \(p(s_{t+1}|s_t, a_t)\) 后，学习变得更容易。基于模型的方法是学习过渡动力学的方法，这些方法决定下一个状态
    \(s_{t+1}\)，即在当前状态 \(s_t\) 中执行操作后将是哪个状态。总之，采用这种方法学习系统动力学模型，并利用最优控制来选择动作。基于模型的强化学习方法是从最优控制领域发展起来的。通常，特定的问题是由高斯过程和贝叶斯网络等模型产生的，然后通过机器学习方法或最优控制方法来解决，如模型预测控制、线性二次调节器和线性二次高斯控制。与无模型强化学习方法相比，基于模型的强化学习方法以一种数据效率高的方式学习值函数或策略，不需要与环境进行连续交互。然而，它可能会受到模型识别问题的影响，并导致对实际环境的不准确描述。本节将基于模型的强化学习方法分为如下三种，并系统地分析它们的优缺点。


    +   1. 全局和局部模型


    对于基于模型的方法，第一个问题是，如果动力学未知，应该拟合全局动力学模型还是局部动力学模型，尽管全局动力学模型方法在运行时具备计算便宜等优点，但在数值稳定性方面效果较差，特别是在随机域，因为它们使用模型预测控制（model
    predictive control, MPC）迭代地收集数据，并直接将它们反向传播到策略中。引导策略搜索（guided policy search, GPS）方法利用轨迹优化来指导策略学习，避免局部优化不良。对
    MuJoCo (multi-joint dynamics with contact) 运动任务的结果表明，该方法具有良好的样本效率，可以加快高速基准任务的无模型学习速度。

    在大多数状态空间中，要获得一个合适的模型通常比学习一个策略要困难得多，尤其是在环境难以描述时。因此，人们越来越多地关注具有约束条件的局部模型。本地模型需要找出执行了哪个控制器来获得正确的数据，以及如何确保整个模型不会出现可怕的分歧。这里列出了一些典型的方法。一个基于模型的迭代'
