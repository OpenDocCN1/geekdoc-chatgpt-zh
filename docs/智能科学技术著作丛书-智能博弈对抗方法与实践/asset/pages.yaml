  md: '需要的迭代次数最多是博弈状态规模的二次方，这成为原始 CFR 算法的瓶颈。


    # 3. CFR 变体


    第 2 章简要介绍非完美信息博弈方法时对 CFR 变体已有概括性介绍，本节对 CFR 中的表格式变体、采样类变体和网络类变体进一步介绍，综述其发展历程。


    +   1) 典型 CFR 变体


    采用 CFR+的德州扑克 AI“仙王座”（Cepheus）首次破解两人有限注意德州扑克的决胜方法，具有计算量少、适合大规模并行化等特点。CFR+的核心改进为在每个信息集上使用后悔匹配的变体，其后悔值被限制为非负数。表现“差”的动作在被证明有用之后，将被立即再次选中（而不是等待多轮迭代后其后悔值变成正值）。选用
    \(Q^t(I, a)\) 来替代反事实后悔值，更新过程如式 (6.10)～式 (6.12) 所示：


    \(Q^0(I, a) = 0\)


    \(Q^t(I, a) = [Q^{t-1}(I, a) + R^t(I, a) - R^{t-1}(I, a)]^+\)


    策略更新过程为


    \(\sigma_i^{t+1}(a|D) = \begin{cases} \frac{Q_i^t(I, a)}{\sum_{a'' \in A} Q_i^t(I,
    a'')}, & \sum_{a'' \in A} Q_i^t(I, a'') > 0 \\ \frac{1}{|A|}, & \text{其他} \end{cases}\)


    当当前策略可利用性趋近零时，平均策略可以作为最终输出策略。


    CFR+从每一局的概率上来说虽然还是会输，但从长远来看可以取得统计学上显著的胜利。CFR+算法在较弱意义上破解了两人有限注意德州扑克的决胜方法，这是非完美信息博弈中的里程碑事件。


    CFR 算法的改进都是针对基础 CFR 算法每个阶段的不同“算子”操作展开的，例如，CFR+改进了后悔值匹配“算子”。权重衰减 CFR 算法的改进则是针对累计后悔值的计算。权重衰减
    CFR 算法定义了三个因子 \(\alpha\)、\(\beta\)、\(\gamma\)。针对累计正后悔值，加以权重 \(\frac{t^\alpha}{t^\alpha
    + 1}\)，针对累计负后悔值，加以权重 \(\frac{t^\beta}{t^\beta + 1}\)。并且每次迭代给平均策略加以权重 \(\frac{t}{t+1}
    \gamma\)。新的后悔值定义如下：'
