- pgno: 163
  md: '趋近于 0，则他们的平均策略就收敛到纳什均衡策略。因此，后悔值最小化算法可以作为一种计算近似纳什均衡的方法。


    在正则博弈中的后悔值匹配 (regret matching) 是使后悔值最小化的简单迭代算法。后悔值匹配依据一个正比于正后悔值的动作概率分布，用随机的方式选择动作。对于可选动作集
    \(A_i\) 中的每一个动作 \(a\)，存储该动作的每轮迭代计算得到的后悔值，在接下来的第 \(T+1\) 轮迭代中，更新策略的计算公式为


    \(\sigma_i^{T+1}(a) = \frac{R_i^{T,+}(a)}{\sum_{b \in A_i} R_i^{T,+}(b)} \tag{6.3}\)


    从式 (6.3) 中可以看出，动作 \(a\) 的后悔值表示在过去 \(T\) 轮对抗中，玩家没有采取该动作而产生的累加后悔值。在理想化的情况下，可以通过使用正比于正后悔值的策略来减少之后博弈的后悔值。但注意到若对手也理解后悔值匹配算法并在对局过程中察觉到了我方策略的某种概率性偏向，则可以利用这种偏向针对性地选择动作。因此，后悔值匹配算法采用自训练的方式，通过自我博弈，反复迭代直到后悔值最小化。


    传统上，后悔值最小化算法主要解决的是正则博弈问题。尽管在概念上可以将任何有限的扩展式博弈转换为等价的正则博弈，但表示大小的指数增长使得对转换后的博弈使用后悔值最小算法不切实际。例如，最简单的两人限制性德州扑克扩展式博弈，都有多达
    \(10^{17}\) 种博弈状态。在如此大规模的博弈树中计算整体最小后悔值是不切实际的。而且德州扑克是序贯博弈，即博弈双方的动作有先后顺序，后行动者在观察到先行动者动作的基础上进行决策，因而后悔值最小化方法不能立即得到下一动作的可选策略。


    对于德州扑克这种大型扩展式博弈，要计算并最小化平均整体后悔值 \(R_i^T\) 是不现实的。CFR 算法的基本思想是将整体后悔值分解为一组可独立最小化的后悔值，并在每个独立的信息集上引入虚拟后悔值的概念，通过不断迭代最小化每个信息集上的反事实后悔值从而最小化平均整体后悔值，此时得到的平均策略达到近似纳什均衡。首先考虑一个指定信息集
    \(I \in L_i\) 和玩家 \(i\) 在该信息集上的选择，定义 \(u_i(\sigma, h)\) 为所有玩家遵循策略 \(\sigma\) 进行对抗并到达了动作序列时的期望效益值。


    定义 6.3 (反事实效益值) 在除了玩家 \(i\) 以外的所有玩家 \(-i\) 都遵循策略 \(\sigma\)，而玩家 \(i\) 的策略为在到达信息集
    \(I\) 的情况下，进行对抗至博弈树叶子节点 \(Z\) 时的期望。 \(\pi^\sigma(h, h'')\) 是在策略组下，从动作序列 \(h\)
    到 \(h''\) 的转移概率，则反事实效益值为


    \(u_i(\sigma, I) = \frac{\sum_{h \in I, h'' \in Z} \pi_{-i}^\sigma(h) \pi^\sigma(h,
    h'') u_i(h'')}{\pi_{-i}^\sigma(I)} \tag{6.4}\)'
