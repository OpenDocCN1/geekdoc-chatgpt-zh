  md: '# 第 3 章 智能博弈对抗策略学习方法基础


    # 3.1 引言


    本章主要介绍当前智能博弈对抗策略学习的基础方法。3.2 节主要介绍 MDP 理论；3.3 节主要对强化学习进行简要介绍；3.4 节梳理当前深度强化学习的主要方法；3.5
    节主要对比分析分层强化学习方法；3.6 节主要介绍三种分布式强化学习框架。


    # 3.2 马尔可夫决策过程


    # 3.2.1 马尔可夫决策模型


    在人工智能领域中，不确定环境下的学习问题通常可以形式化描述为 MDP。 该模型为解决不确定性环境下的学习问题提供了坚实的数学基础和统一的理论框架。概括来说，MDP
    模型包括以下几个部分：环境状态集合、智能体动作集合、 一个状态转移函数和一个奖励函数。


    定义 3.1 (马尔可夫决策过程) MDP 可以被定义成一个四元组 \((S, A, P, R)\)， 其中 \(S\) 为包含所有环境状态的有限集合，\(A\)
    为智能体的所有动作集合，\(P\) 为状态转移函数：\(P(s''|s, a) \rightarrow [0, 1]\) 表示在状态 \(s\) 下执行动作
    \(a\) 转移到状态 \(s''\) 的概率，\(R\) 是奖励函数：\(R(s''|s, a) \in \mathbb{R}\) 表示在状态 \(s\)
    下执行动作 \(a\) 转移到状态 \(s''\) 所获得的奖励。


    有限状态空间和动作空间的大小分别为 \(|S| = K\) 和 \(|A| = N\)，因此可以使用 \(\{s^1, s^2, \cdots, s^K\}\)
    表示有限状态集合，\(\{a^1, a^2, \cdots, a^N\}\) 表示有限动作集合。状态空间和动作空间可以是离散的，也可以是连续的，本章主要考虑具有离散状态空间和动作空间的
    MDP 问题。


    MDP 中状态的转移只和当前状态以及在当前状态上执行的动作有关，即


    \(P(s''|s_t, a_t, s_{t-1}, a_{t-1}, \cdots) = P(s''|s_t, a_t) \quad (3.1)\)


    这是 MDP 模型和其他更一般的模型之间最典型的区别。奖励函数定义了问题学 习的目标，最大化其收到的总奖励，是 MDP 中最重要的部分。


    一个 MDP 策略可以看成一个映射，也就是状态空间中的每个状态到动作空 间上动作选择概率之间的映射。广义的 MDP 策略是随机性策略，即在同一状态'
