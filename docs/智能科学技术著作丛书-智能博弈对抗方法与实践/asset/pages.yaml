    skills, adaptive partitions, ASAP)框架，可以学习技能/子任务，学习在哪里使用技能/子任务，并可以通过适当改变学习到的技能/子任务，解决新的任务，并通过实验证明
    ASAP 框架的能力；Vigorito[37]提出了一种在 MDP 模型下的技能学习方法，并且展示了在复杂环境下该方法解决整个任务的优势，并进一步将 MDP
    模型转换为分解 MDP (factored MDP) 模型表示，研究在连续 MDP 领域增量技能学习方法；Bacon 等[38]将策略梯度应用到 Option
    学习和 Option 的策略学习中；Machado 等[39]通过隐式定义原型值函数来解决 Option 发现问题。

    最近，一些研究将 Option 发现作为一个优化问题，与值函数近似兼容。Daniel 等[40]通过将终止函数当成隐变量来学习返回优化后的 Option，并使用期望最大化方法来学习；Vezhnevets
    等[41]将 Option 学习问题当成开环内部 Option 策略，也称为宏动作；大部分关于 Option 的论文都是为了学习 Option 来加快学习或者规划速度；Mankowitz
    等在文献[42]中学习 Option 主要是为了修复有限状态表示而引发的错误指定问题。


    # 2. 基于 MAXQ 的分层强化学习


    Dietterich[5]提出了基于 MAXQ 的值函数分层分解技术。基于 MAXQ 的分层强化学习方法把原始 MDP 问题分解成一系列子任务 {M0, M1,
    ..., Mn}，每个子任务实质上就是一个子 SMDP 问题。Li 等[43]改进了 MAXQ 方法，提出了一个新的框架，即情境敏感强化学习 (context-sensitive
    reinforcement learning, CSRL) 框架。Ponce 等[44]将基于 MAXQ 的分层强化学习方法应用于非玩家角色游戏中，增加用户的自然体验。


    # 3. 基于 HAM 的分层强化学习


    Parr 等[6]提出了 HAM 方法，该方法通过引入有限状态机概念，用于表达 MDP 状态空间中的区域策略，将任务分层过程转换为在 MDP 策略空间上构造有限状态机的过程。HAM
    方法与 Option 方法的相同之处在于它们两个都将 MDP 模型显式地规约到 SMDP 模型上来。因此，Option 方法与 HAM 方法在理论上都是直接基于
    SMDP 模型的。Bai 等[45]提出了 HAMQ-INT 方法，自动发现使用 HAM 时的内部转换，并递归缩短计算 Q 值的时间。


    # 4. 基于神经网络的分层强化学习


    Bacon 等[38]提出了 Option-Critic 架构，旨在通过神经网络强大的学习能力，模糊 Option 发现和 Option 学习之间的界限，直接通过神经网络一起训练。该方'
