    # 10.3.2 复杂网络攻防


    复杂网络上攻防博弈对抗呈现出多种形态，其中网络信息流阻断、复杂网络瓦解和复杂网络防御是当前的研究前沖方向。


    +   1. 网络信息流阻断


    阻断是指对抗和停止某种活动的行为。阻断模型可以提供策略和对策来阻止依托于一定系统运行的对手的活动。尤其是当相关系统可以由网络建模，面临网络本身的预期用户与想要干扰该用途的另一个参与方之间的竞争时，网络阻断更是适当的。网络阻断问题是网络攻防对抗博弈的典型应用，尤其适合竞争和对抗性强的领域。网络阻断领域的最基本模型是“K
    段最重要弧”问题，由于攻击方的行为可以采用网络信息流模型进行建模，根据采用的流模型，可以将网络阻断问题的研究划分为以下三类：最大流网络阻断、网络监控阻断与最短路网络阻断。过去几十年来，网络阻断问题的研究发展迅速，可广泛地用于军事、国家安全、反恐行动、安全执法、计算机安全、商业计划和疾病控制等领域。当前阻断被广泛运用到各个领域：①网络阻断，主要用于阻断各类依托复杂网络结构的信息流、行为流博弈对抗中[30]；②规划阻断，主要用于阻断对方规划方案[31]；③决策阻断，主要采用阻断对方的马尔可夫决策过程[32]。近年来，一些研究者从“计划行动与意图识别”
    [33]范式出发，通过“行为识别与动态网络阻断” [34]这个模块，成功地将 OODA 指挥循环中的观察与规划连接起来，为基于行为识别的预先决策提供了研究指引，如基于实时目的识别的动态最短路径网络阻断模型[35]。


    +   2. 复杂网络瓦解


    网络瓦解问题的核心就在于找到一个最优的关键节点集合。研究证明网络瓦解问题属于典型的 NP 难问题，如果网络包含的节点数较大，直接探讨当前网络的最优瓦解策略会极其困难。目前复杂网络瓦解的研究主要集中在同质网络中，根据方法原理的不同可以分为五种：①基于节点中心性的方法利用节点的中心性排序来求解网络瓦解策略，即首先定义各种节点的中心性指标，接着根据中心性指标的排序来挖掘当前网络中的关键节点，最后按照优先移除这些高中心性指标'
