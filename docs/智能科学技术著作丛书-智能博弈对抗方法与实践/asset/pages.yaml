- pgno: 60
  md: '方法[139]、多样性虚拟对抗方法[140]、优先级虚拟自对策方法[141]等，这类方法是自对策方法的升级版本，由于样本空间大，通常会与采样或神经网络学习类方法结合使用，可用于扩展式博弈、合作博弈等场景。协同对策方法主要有协同演化[142]、协同学习[7]等，这类方法主要依赖多个策略协同演化生成下一世代的优化策略。种群对策方法主要有种群训练自对策[143]、双预言机-实证博弈分析[144]、混合预言机/混合对手[145]、PSRO[114]、联合
    PSRO[146]、行列式点过程 PSRO[140]、管线 PSRO[147]、在线 PSRO[113]、自主 PSRO[148]、任意时间最优 PSRO[149]等方法，这类方法与分布式框架的组合为当前绝大部分多智能体博弈问题提供了通用解决方案，其关键在于如何提高探索样本效率，确保快速的内环能有效生成策略样本，进而加快慢外环的优化迭代。


    # 3) 自主学习方法


    近年来，一些研究试图从方法框架与分布式计算框架进行创新，借助元学习方法，试图将策略评估与策略提升方法融合起来。这类方法试图利用多样性[150]策略来加速探索。Wu
    等[151]利用元学习生成难被剥削和多样性对手，引导探索策略提升。质量多样性 (quality diversity) [152]作为一类帕累托框架，因其同时确保了对结果空间的广泛覆盖和有效的回报，为平衡处理“探索与利用”提供了目标导向。当前对多样性的研究主要区分三大类：行为多样性[153]、策略多样性[154]、环境多样性[153]。如表
    2.7 所示，一些研究拟采用矩阵范数 (如 L11 范数[40]、F 范数和谱范数[40]、行列式值[155])、有效测度 (effective measure)[155]、最大平均差异
    (maximum mean discrepancy)[156]、交互图[157]、占据测度 (occupancy measure)[154]、期望基数 (expected
    cardinality)[140]、凸胞扩张 (convex hull enlargement)[154]等衡量多样性。其中行为多样性可引导智能体更倾向于采取多样化的行动，策略多样性可引导智能体生成差异化的策略、扩大种群规模、提高探索效率，环境多样性可引导智能体适应更多不同的场景，增强智能体的适变能力。同时，Leibo
    等[158]研究指出自主课程学习是研究多智能体智能的可行方法，课程可由外生和内生挑战自主生成。Yang 等[159]指出多样性自主课程学习对现实世界里的多智能体学习系统非常关键。Feng
    等[148]基于元博弈理论、利用元学习方法探索了多样性感知的自主课程学习方法，通过自主发掘多样性课程用于难被利用策略的探索。


    | 分类 | 度量方法 |

    | :--- | :--- |

    | 行为多样性 | 期望基数[140]、质量多样性[152]、期望行为变化[153]、占据测度[154] |

    | 策略多样性 | 响应多样性[154]、有效多样性[155]、最大平均差异[156]、交互图[157] |

    | 环境多样性 | 泛化界[153] |'
