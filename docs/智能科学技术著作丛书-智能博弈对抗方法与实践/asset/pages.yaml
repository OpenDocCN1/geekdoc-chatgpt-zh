  md: '的研究人员合作设计了一种新型的扑克 AI 程序 DeepStack，在两人无限注德州扑克上击败职业扑克玩家。DeepStack 结合了递归推理来处理不对称性信息，利用持续求解技术将计算集中到相关的决策上，并设计深度神经网络拟合后悔值，这是一种可用于非完美信息扩展博弈的通用算法。DeepStack[20]通用算法使用了深度学习自博弈，学习策略战胜人类玩家。DeepStack
    使用神经网络拟合评估函数、近似反事实后悔值。该深度反事实价值网络（deep counterfactual value network）以当前迭代的公开状态和范围、池底大小等手牌筹码作为输入特征经过
    7 层全连接的隐层输出后进行归一化处理，从而保证该值满足零和约束，最后映射为两个玩家的反事实后悔值。在比赛之前，通过生成随机扑克场景（底池大小、台面上的牌和范围）来训练深度反事实价值网络。该方法在理论上有两人零和博弈的收敛性证明作为支撑，并且在实践中也能得出比之前的方法更低的可利用性。


    2019 年 5 月，DeepMind 和阿尔伯塔大学的研究人员提出可利用性下降新算法[1]，通过针对最坏情况对手的直接策略优化，计算两人零和非完美信息扩展博弈中的近似均衡。当遵循这种优化时，玩家策略的可利用性渐近地收敛为零，因此当两个参与者都采用这种优化时，联合策略会收敛到纳什均衡。与虚拟自对弈（fictitious
    self-play）和 CFR 不同，该收敛结果与优化的策略有关，而不是平均策略。


    总体来说，阿尔伯塔大学计算机扑克研究组最早关注计算机扑克智能博弈研究，输出了大批学术与应用成果，形成了以 Cepheus、DeepStack 为代表的顶尖扑克
    AI，不断刷新博弈对抗纪录，拉开了新一轮人机大战的序幕。


    # 2. 卡内基梅隆大学扑克 AI 研究历程


    除了阿尔伯塔大学计算机扑克研究组，近年来国际上也出现了一些研究智能博弈的组织和个人，在攻克德州扑克的新型图灵测试中成果丰硕。其中，卡内基梅隆大学的研究特别引人注目。


    2017 年，Sandholm 教授的团队针对德州扑克的不完美信息博弈的特点，提出了一种在理论上和实践上都超越之前方法的子博弈求解技术，研发的德州扑克 AI
    Libratus[21]在两人无限注德州扑克中击败人类顶级职业选手，引起学术界和社会各界的轰动。Libratus 主要由三个主要模块组成：①预先对博弈进行动作抽象和手牌抽象，计算蓝图策略（blueprint
    strategy）。由于直接对两人无限注德州扑克的不同决策点计算策略不可行，Libratus 针对大规模博弈树进行抽象压缩，然后使用了 CFR 的变体 MCCFR
    算法来计算蓝图策略。同时，Libratus 通过一种基于遗憾值修剪法的采样方式改进了 MCCFR，允许修剪掉在博弈树中“失败”的分支，以便加快 MCCFR
    算法的收敛。②嵌套子博弈求解算法，基于构建的更细粒度的抽象并进行实时求解。求解子博弈的目的是在子博弈中改变策略来提升蓝图策略。'
