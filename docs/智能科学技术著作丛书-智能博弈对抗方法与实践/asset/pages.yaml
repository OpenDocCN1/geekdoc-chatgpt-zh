    # 3. HAM


    HAM (hierarchical abstract machines)\(^[9]\)的主要思想是将智能体的部分策略编码为具有未指定选择状态的一组分层有限状态机，并将有限状态机的状态和当前状态结合考虑，选择不同的策略。


