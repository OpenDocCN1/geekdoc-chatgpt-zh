    DouZero 网络编码如图 7.4 所示。DouZero 提取了多个这样的矩阵来表示状态，包括当前手牌、其他玩家手牌之和等。同时，DouZero 提取了一些
    0 或 1 向量来编码其他玩家手牌的数量，以及当前打出的炸弹数量。动作可以用同样的方式进行编码。


    # 2) 神经网络


    如图 7.5 所示，地主、地主上家和地主下家三个位置分别使用三个价值神经网络模型。其输入是状态和动作，输出是价值。首先，过去的出牌采用 LSTM 神经网络进行历史出牌序列编码，然后
    LSTM 神经网络的输出以及其他的表征被送'
