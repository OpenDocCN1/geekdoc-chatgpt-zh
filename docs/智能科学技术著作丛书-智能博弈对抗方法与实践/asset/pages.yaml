    # 3)基于 MAXQ 分层强化学习的行为树多节点优化


    在作战行动中，分层的行为树往往代表了任务计划的分层组织，领域专家通过层次任务的抽象完成了对复杂大规模问题空间的分割。在行为树表示的任务策略优化中，往往可能存在多个需要学习优化的选择节点任务，这些任务之间存在一定的交互耦合。如果将每一个选择节点任务作为单独的强化学习任务，多个任务同时学习，会导致以下两个问题：一是具有层次或时序依赖关系的多个学习任务同时学习，每个学习任务都在进行随机选择采样，导致学习环境始终处于动态变化中，学习收敛困难；二是由于作战环境的复杂多样，为每个选择节点任务设计单独的子目标奖励信号往往比较困难，加之作战行动效果延迟奖励的影响，需要从整个任务的决策策略出发寻找最优解。


    标准 MDP 要求动作的执行时间必须在一个时间步内完成，而实际应用中，被选择动作可能在可变的多个时间步内完成，这需要将 MDP 扩展描述为 SMDP。在 SMDP
    中，令 \(\tau\) 表示状态 \(s\) 下执行动作 \(a\) 需要的可变的时间步。那么状态转移函数 \(P\) 将被扩展成 \(\tau\) 个时间步后到达
    \(s''\) 的联合概率分布 \(P(s'', \tau | s, a)\)，同样，奖励函数将扩展成 \(R(s'', \tau | s, a)\)。因此，最优的
    \(V\) 值和 \(Q\) 值分别为


    ```

    \(V^*(s) = \max_a \sum_{s'',\tau} P(s'', \tau | s, a)[R(s'', \tau | s, a) + \gamma^\tau
    V^*(s'')] \quad (8.7)\)

    ```


    ```

    \(Q^*(s, a) = \sum_{s'',\tau} P(s'', \tau | s, a)[R(s'', \tau | s, a) + \gamma^\tau
    \max_{a''} Q^*(s'', a'')] \quad (8.8)\)

    ```


    基于 SMDP 框架，已有部分分层强化学习方法用来处理多层次强化学习问题，如 Option、MAXQ 及 HAM 等。MAXQ 是其中被广泛使用的分层强化学习方法之一。与其他学习方法不同，MAXQ
    通过构建分层的任务图，将整个学习问题分解为层次化的子问题，通过调用子问题的解来求解整个问题，依次递推，直到子问题可以通过原子动作或原子任务来直接解决，该过程允许多个子问题进行同时学习。例如，分层强化学习问题中经典的出租车载客问题，载客任务的子任务包含接客和送客，接客由动作上车和导航子任务构成，导航子任务由四个方向的机动动作组成。那么对要求解的整体载客任务
    \(M\) ，有一个任务图的层次分解 \(\{M_0, M_1, \cdots, M_n\}\)，其中 \(M_0\) 代表整体任务 \(M\) 本身，后续的
    \(M_i (i=1, 2, \cdots, n)\) 为按照宽度优先顺序对任务的层次分解，即接客、送客、上车、导航、下车、向上、向下、向左、向右等一系列子任务，每个子任务有对应的任务层次。对应该层次分解有一个分层策略
    \(\pi = \{\pi_0, \pi_1, \cdots, \pi_n\}\)，其中为 \(\pi_i\) 对应子任务 \(M_i\) 的动作选择策略，如子任务的策略决定了如何在不同的状态选择上车和导航子任务。根据效应决策理论，令
    \(V^\pi(i, s)\) 表示在状态 \(s\) 处按照策略 \(\pi_i\) 完成子任务 \(M_i\) 的累计奖励值，'
  merge: -1
  img_proc: true
- pgno: 216
  md: '那么 \( V^\pi(i, s) \) 可以定义为


    \[ V^\pi(i, s) = \begin{cases} \sum_{s''} P(s''|s,a)R(s''|s, i), & M_i \in \text{Primitive}
    \\ Q^\pi(i, s, \pi_i(s)), & M_i \in \text{Composite} \end{cases} \quad (8.9) \]


    当 \( M_i \) 为原子动作（即 \( M_i \in \text{Primitive} \)）时，\( V^\pi(i, s) \) 为状态 \(
    s \) 处执行动作 \( M_i \) 的期望奖励值；否则（即 \( M_i \in \text{Composite} \)），\( V^\pi(i, s)
    \) 为子任务 \( M_i \) 在状态 \( s \) 处按照策略 \( \pi_i \) 执行动作 \( M_{\pi_i(s)} \)，并按照该策略执行至子任务
    \( M_i \) 结束的期望奖励。


    子任务之间的值函数数效应评估同样可以采用值函数分解的方法来处理：


    \[ Q^\pi(i, s, \pi_i(s)) = V^\pi(\pi_i(s), s) + C^\pi(i, s, \pi_i(s)) \quad (8.10)
    \]


    装饰节点是一类特殊的控制流节点。根据使用需要，按照自己预定目标进行设置，自定义相关规则以及相应子节点的返回值：


    \[ C^\pi(i, s, \pi_i(s)) = \sum_{s'', \tau} P_i^\pi(s'', \tau|s, \pi_i(s)) \gamma^\tau
    V^\pi(i, s'') \quad (8.11) \]


    \( P_i \) 是任务 \( M_i \) 按照策略 \( \pi'' \) 执行的转移函数。按照式 (8.9) ~ 式 (8.11)，可以按照层次递归的方式计算每一个子任务的值函数。任务
    \( M_i \) 根据值函数 \( Q^\pi(i, s, a) \) 的最优策略即


    \[ M_i : \pi_i^*(s) = \arg \max_a Q(i, s, a) \quad (8.12) \]


    # 4) 行为树与 MAXQ 任务图的关系及转换


    根据 MAXQ 方法的基本原理，本节介绍所提出的 MAXQ-BT 方法，将行为树与分层强化学习方法 MAXQ 结合，支持多节点同时优化。首先，论证 MAXQ
    任务图与行为树之间的关系。基于对比的认识，将改进 MAXQ 的学习规则使其适应于可定制约束的行为树的分层学习。


    一个行为树可以被认为是一个有着固定层次策略的 MAXQ 任务图。对行为树策略的优化，本质是改变已有选择节点从左向右的优先级决策规则，而采用强化学习所得的马尔可夫决策模型的状态动作映射关系进行新的决策。具体来说，我们需要求解状态动作映射对的具体评估值，在每一状态时，选择最大化评估值的动作。为了应用
    MAXQ 学习方法进行多个行为树节点的分层学习，对于每一类节点，可以采用 MAXQ 的学习规则进行效应评估。


    在行为学习中，主要目标是改进选择节点的决策策略，因此对于需要学习的选择节点任务，我们将改变已有的按照从左至右优先级的选择规则，而根据新的'
  merge: -1
  img_proc: true
- pgno: 217
  md: '选择策略进行学习采样，如 \(\epsilon\) 贪婪。当然，如果设计者不需要该选择节点进行学习，则按照选择节点原始的传播规则进行选择；对于其他节点如序列节点，其传播规则不变。


    那么对于需要学习的行为树选择节点，其评估的值函数和完成函数需满足


    \( V(i,s) = \max_{c_j} Q(i,s,c_j) \quad (8.13) \)


    \( C(i,s,c_j) = [1 - \alpha(i)]C(i,s,c_j) + \alpha(i)\gamma^r V(i,s'') \quad (8.14)
    \)


    对于无须学习的选择节点或序列节点，默认的行为策略是按照从左向右方式执行。无论返回状态是成功还是失败，选择节点所表示的任务都将在最后一个节点执行完成后结束：


    \( V^\pi(i,s) = Q(i,s,c_1) \quad (8.15) \)


    最后一个节点点的完成函数值总是 0，其他节点的完成函数值基于式(8.16)按照从左到右的序贯选择策略计算所得，即


    \( C(i,s,c_j) = [1 - \alpha(i)]C(i,s,c_j) + \alpha(i)\gamma^r V(i,s'',c_{j+1})
    \quad (8.16) \)


    对于并发节点，假设其子任务的执行和奖励值评估是独立的，则每一个子任务的完成函数值均为 0，状态 s 处的评估值为


    \( V(i,s) = \sum_{j=1}^m V(c_j,s) \quad (8.17) \)


    对于动作节点，可以看成是原子任务，其子节点集为空。该原子任务总是在行为树动作节点执行后结束。因此，其完成函数值为 0，对其的期望值函数评估可以通过公式累计获得


    \( V = [1 - \alpha(i)]V(i,s) + \alpha(i)R(s'',\tau|s,c_j) \quad (8.18) \)


    其中，\( R \) 是 \(\tau\) 时间内执行该动作内累计的折扣奖励。


    # 5) 行为树拓扑结构重组


    通过学习将获得以下知识：反映任务中各层次动作选择效益的值函数 \( Q \) 表和 \( V \) 表。对于每一个非叶子节点，相应的 \( Q \) 表存储每一种环境状态下，执行某一子节点的决策效应值。\(
    V \) 表存储每一环境状态时，一个节点的综合评估效应值。


    \( Q \) 表存储了选择节点任务中每一状态下的最优策略，因此可以根据 \( Q \) 表来重组初始的行为树。对于一个学习选择节点，可以获得一个 \( Q
    \) 表存储每一状态动作对的期望评估值。


    那么对于 \( Q \) 表中的每一个状态，可以选择得到最高 \( Q \) 值的子节点，构建一个最优状态列表。每个状态列表将会被添加作为相应的动作子节点的'
  merge: -1
  img_proc: true
- pgno: 218
  md: '条件节点。最后，根据所形成条件节点状态列表的状态数目大小，从多到少重新调整选择节点的优先级顺序。至此，学习选择节点按照重组后的优先级选择节点来执行。


    如果学习任务的评估函数不变，那么对于内部结构不变的行为子树，该子树所代表的子任务的评估是不变的且可以重用的。这样，基于已有的子树组合生成新的行为树时，可以快速进行知识的转移学习。


    # 8.3 墨子兵棋 AI 构建


    # 8.3.1 兵棋 AI 研究历程


    国外多年来一直注重计算机兵棋推演及其系统的应用，各类兵棋系统的建设呈现多样化发展趋势，在推演方法和系统设计等方面进行了各种探索和尝试。2020年美国兰德公司发布了《思维机器时代的威慑》报告[8]，讨论的核心问题是兵棋推演中人工智能和自主技术如何随着事件的发展影响局势升级和威慑方式。2020年，美国国防高级研究计划局战略技术办公室提出“兵棋突破者”项目[9]，旨在开发人工智能并将其应用于现有的即时策略兵棋之中，以打破复杂的模型所造成的不平衡。欧洲防务局开展的一项为期1年的研究，将AI和大数据应用于训练和模拟中，专门利用数据挖掘和兵棋推演来分析如何解决如混合战这样的复杂想定，以满足快速发展的军事情报需求。同年，美国空军大学举办的“未来能力推演”也采用了多专业人员联合推演方法，来自国防部、美国政府机构、同盟国军队成员和高端智库的多专业人员出席了该推演活动。2021年美国与英国、澳大利亚等合作在兵棋推演生态建设方面开布局，开展了面向智能化兵棋推演的“自主性战略挑战赛”和“联盟战争计划”，以打造更加完善和贴合真实情况的推演生态，为智能认知决策技术的发展提供试验田。美国陆军战争学院(U.S.
    Army War College)和海军陆战队战争学院(Marine Corps War College)等高级工程院校都在其课程中扩展了基于游戏的学习，包括教育性的兵棋。


    国内兵棋系统起步较晚，但兵棋活动逐渐活跃，研赛结合，通过借鉴国外成熟的兵棋技术并与我军实际相结合，在兵棋系统研发与运用方面也取得了较快的发展。2017年，在国内举办首届全国兵棋推演大赛。中国科学院自动化研究所的CASIA-先知1.0系统，在人机对抗中击败了军队和地方选手，获得了7:1的胜利[10]。随后中国科学院自动化研究所又相继推出分队级AI“Alphawar
    V1.0”以及群队级AI“紫冬智剑 V1.0”，一直在探索如何将人工智能技术应用于复杂场景下不完全信息博弈的兵棋推演领域[11]。2019年，由指挥学会和华戎防务共同推出的专业级兵棋“智戎-未来指挥官”[12]，作为墨子联合作战兵棋推演系统的'
