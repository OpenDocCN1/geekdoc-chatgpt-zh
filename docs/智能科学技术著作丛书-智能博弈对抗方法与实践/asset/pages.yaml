  md: '组成，通过无人机间的局部交互实现机群整体行为从而完成全局性协作任务。无人机集群与单架无人机相比，具有更高的容错性和鲁棒性，可以提高集群整体的载荷、感知和执行能力。并且，无人机集群系统将功能高度集中、造价高昂的武器系统分解为若干低成本的无人飞行器，具有更高的经济可承受性，可以实现更大的经济效益。随着无人机集群技术的快速发展，其灵活、规模可扩展等优势越发突出明显，运用越来越频繁广泛。无人机集群系统在近几场局部战争中频频亮相，取得了令人震惊的作战效能，并且战场上应用无人机可以避免人员伤亡、迅速布防兵力、减少战争支出，世界各军事强国均致力于开展无人机集群的作战研究。其中，美军开展了诸多工作，研究如何将无人机集群技术应用于实际作战，取得了极大成果。美军典型的无人机集群作战研究项目如图
    10.5 和表 10.3 所示。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_248_0.png)


    # 图 10.5 无人机集群作战研究项目


