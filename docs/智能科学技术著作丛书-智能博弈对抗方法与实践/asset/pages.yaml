    核年 |


    注：M-L 表示多人有限注；2-L 表示两人有限注；2-NL 表示两人无限注；3-L 表示三人有限注。


    2006 年，Sturtevant 等[14]进一步深入研究两人有限注德州扑克问题，将对手建模与博弈树搜索技术相结合，在合理的时间实现深度优先搜索。


    2007 年，基于纳什均衡的著名扑克 AI 程序 Polaris 先在人机对战的扑克冠军赛中击败了人类玩家[15]，又在当年的 ACPC 中夺冠，为扑克研究带来了又一次新的突破。传统上，线性规划是解决扩展式博弈的先进技术之一，但线性规划难以应对指数级状态数量的博弈。


    2007 年，Zinkevich 等[16]提出 CFR 算法，这是一种迭代算法，将整体最小后悔值分解到各个独立的信息集中计算局部最小后悔值，能成功解决多达
    10^12 个状态的博弈问题。并且，在信息集大规模的两人零和博弈中，使用该方法收敛到纳什均衡解具有理论保证。随后，Risk 等[17]将 CFR 算法应用到扑克智能体上，并以显著性的优势获得了
    ACPC 三人有限注德州扑克的冠军。


    2015 年，Bowling 等[18]改进基础 CFR 算法，提出新变体 CFR+算法，并应用其开发的程序“仙王座”(Cepheus)首次破解了两人有限注德州扑克的决胜方法[19]，Cepheus
    从每一局的概率上来说显然还是会输，但从长远来看可以取得统计学上显著的胜利。基础的 CFR 算法及其一些变体，在处理大规模博弈上会面临两个挑战：内存和计算。Cepheus
    采用定点计算和压缩的方式解决存储问题，结合剪枝和省略对平均策略的计算突破 CFR 算法在计算规模上的限制；跳过计算和存储平均策略的步骤，使用玩家的当前策略作为
    CFR+算法的初始解。


    2017 年，加拿大的阿尔伯塔大学、捷克的查理大学、布拉格的捷克技术大学'
