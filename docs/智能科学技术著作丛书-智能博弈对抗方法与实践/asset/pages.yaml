- pgno: 122
  md: '# 3. 基于学习的规划方法


    规划和学习是人工智能的两个著名范式和子领域。规划注重设计行动序列以实现指定的目标或一组目标，而学习侧重于交互提升。虽然这两种范式在博弈对抗领域都取得了巨大成功，但它们都存在一些缺点。规划方法需要环境模型以及规划任务的准确描述，这在更复杂的环境中可能不容易获得。对于学习方法，当处理更复杂的环境时，如果没有提供任何指导，智能体可能会花费很多时间探索次优行为。然而，这两种范式可以相互补充，从某种意义上说，每个范式都可以用来弥补另一个范式的不足。尽管目前关于搜索方法的研究成果众多，但即时策略博弈战术层对抗规划的实时性要求极强，在战斗单位数量众多时，抽象机制的存在也仅能保证搜索有限的动作空间，导致搜索所得解的最优性不足。可以借鉴Muzero
    的算法思路，将学习到的模型融入在线搜索过程，由学习模型引导搜索过程[64]。未来可以采用分层、分布式、并行技术和机器学习的方法提升 MCTS 方法的性能，采用深度学习方法评估博弈对抗态势，学习博弈态势表示；采用监督学习、战术搜索与强化学习方法学习行动策略；采用多样性对手建模与强化学习的方法学习全局行动策略。


    # 4.4 面向序贯策略类对抗的对手剥削


    在线博弈对抗过程中，可以用两种方式生成己方策略，第一种是从悲观视角出发的博弈最优(game theory optimal, GTO)，即采用离线蓝图策略进行对抗，第二种是从乐观视角出发的剥削式对策，即在线发掘对手可能的弱点，以最大化己方收益的方式剥削对手。对手剥削是棋牌类博弈领域的挑战性问题，在线博弈对抗过程中，发现对手弱点并充分利用已认知优势剥削对手。在纳什均衡解概念中，双方都采用均衡策略，任何偏离均衡策略的一方所获得的收益将减小。对于非完全理性的对手，其策略和纳什均衡策略之间的“距离”，为其他均衡策略玩家创造了可利用性。在求解(近似)纳什均衡解时，可利用性是均衡策略质量的衡量标准，指该策略在预期中相对于最坏情况下的对手策略所达到的少于博弈价值的量，通常也将这个差值称为一个策略的可利用度，其衡量了对手采用纳什均衡策略获利的程度，也即因未采用纳什均衡策略，对手用强有力的应对策略对其做出惩罚的程度，这是对策略最坏情况下质量的度量，故其常被用来评估各种策略学习方法。由于大规模非完美信息博弈中的均衡策略难以求解，均衡策略是一种基于对手完美理性假设的静态策略，它在面对不同对手时缺乏动态策略调整的能力，尤其是在面对次优对手时无法取得更大收益，均衡策略在多智能体环境中的有效'
  merge: -1
  img_proc: true
- pgno: 123
  md: '性缺少理论保证。对手剥削方法则强调根据对手实际行为调整己方策略，它不追求在整个博弈解空间中寻找一个最优的“不动点”，而是希望将问题分解至与不同对手对抗的子博弈空间中寻找可行解，因此在对手策略非完美理性（或者说可利用度大于零）的假设前提下，采用对手剥削方法是更加直接有效、轻量灵活的选择。对手剥削可划分为两个相互影响的部分：博弈推理和反制策略生成，主要表现在博弈对抗过程中，推理对手的状态和可能采取的行动，搜索己方反制对手剥削的策略。当前关于棋牌类博弈中在线对手剥削方法的研究主要分为对手建模式适变、对手感知式学习和对手生成式搜索。以下以德州扑克为例，介绍对手剥削方法。


    # 4.4.1 对手建模式适变


    对手建模式适变类方法依赖于对手的显式或隐式模型，通过对手模型分析生成适应对手变化的适变反制策略。


    +   1. 推理、预测与估计


    推理、预测与估计类方法主要试图推理对手可能的状态进而补全不完全可观的信息，预测对手可能采取的行动进而找到应对措施，估计对手可能的手牌牌力和赢牌潜力进而分析己方的赢率等。这类方法包括采用聚类方法推理对手的博弈风格类型，采用频率统计类方法预测对手的动作偏好，采用神经网络类方法预测对手可以采取的行动，评估对手的状态值和己方的赢率等。如图
    4.10 所示，Li 等[65]提出使用模式识别树和 LSTM 网络估计器显式地进行对手建模，其中底层的常规模式识别树用于在线对抗中进行对手行为模式的识别，每轮博弈结束后保存至默认模式识别树中，上层的摊牌赢率估计器和对手弃牌率估计器分别用于估计己方赢率和对手弃牌率，然后基于决策算法给出最终反制策略。


    +   2. 机会发掘与欺骗


    机会发掘与欺骗类方法主要试图分析博弈对抗态势下对手策略是否暴露弱点、是否“有机可乘”，进而已方可以极大化地剥削对手，或者己方牌力差时采用“诈唬”的方法吓退强劲对手，己方牌力强时采用“慢打”的方法引诱对手下更多注等。Ganzfried[66]从安全的角度研究了重复零和博弈的对手剥削问题，给出了安全策略的完整特性，在线实时对抗过程中，通过利用对手模型预测对手状态及可能采取的行动并发掘可以剥削对手的机会，开发了一种剥削次优策略对手并保证安全的方法。如图
    4.11 所示，通过观测计算对手模型，发掘可以安全剥削对手的机会，反制策略的生成变成了安全策略选择问题。'
