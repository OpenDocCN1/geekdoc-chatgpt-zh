    # 图 6.1 德州扑克四个阶段


    决定参与者胜负的方法是：比较每个玩家的底牌与公共牌所能组成的最大牌型，牌型较大者获胜。各个牌型大小顺序依次为皇家同花顺、同花顺、四条(金刚)、葫芦、同花、顺子、三条、两对、对子和高牌，如图
