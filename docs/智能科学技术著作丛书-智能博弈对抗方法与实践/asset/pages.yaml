    # 3. 策略空间探索优化


    策略空间探索优化类方法主要试图在博弈策略空间上探索剥削对手可能性的方法。Ganzfried 等[67]提出基于先验知识，利用贝叶斯优化模型获得对手模型的后验分布，辅助剥削对手的反制策略生成。此外还有一些方法利用先验分布，模拟与对手的对抗交互过程并得出博弈收益结果，利用博弈策略分析方法分离出策略之间的传递压制和循环压制关系，通过预先计算出多个可行对抗策略，然后利用'
  merge: -1
