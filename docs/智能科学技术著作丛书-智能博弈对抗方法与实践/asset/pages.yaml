  md: '对抗人类智能一直是人工智能程序智能发展水平的衡量标准，其核心是以人机对抗的方式研究机器认知智能战胜人类智能的内在智能生成机理和技术支撑原理，这必将成为认知智能研究的核心方向。就如人与自然环境的协同进化，人工智能程序与人的对抗也将使得人工智能程序的智能水平不断发展进化，但人机对抗仅仅是智能博弈对抗的一种表现形式，当前智能博弈对抗领域人工智能程序智能水平的提升已经完全突破了原始的人机对抗模式，机机对抗、人机协同对抗为人工智能程序智能水平进化提供了途径。


    # 3. 智能博弈对抗


    本书研究的智能博弈对抗问题是更为广泛的计算机博弈对抗问题，其主要对抗形式包括人机对抗、机机对抗、人机协同对抗等(图 1.3)，其目的是为认知决策智能走上强人工智能之路找到新方法途径。智能博弈对抗最初的表现形式是利用博弈学习技术学习人、智能体和环境之间的交互过程，并积累知识，通过种群自博弈等方式进化升级，试图在某一特定领域战胜人类高级位选手(或顶级人机混合团队)，确保受控于人类，并运用于人机协同、人机融合乃至人机共生等场景中。智能博弈对抗的新型研究模式必将以计算机博弈问题为导向，充分利用新的多智能体学习范式，将人工智能程序的技能水平从匹螺状态策略空间①的底部提升至顶部。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_18_0.png)


    图 1.3 智能博弈过程建模和关键技术[3]


    # 1.2.3 研究的意义


    智能博弈对抗是人工智能领域中的一个重要研究分支，研究方法涵盖博弈论、强化学习、机器学习等多种理论，研究人员分布于国土安防、网络安全、机器人


    ① 策略提升时，策略进化的方向 (将在本书第 2 章介绍)。'
