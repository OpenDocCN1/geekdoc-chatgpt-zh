    # 2.4.2 均衡解概念与博弈动力学


    # 1. 均衡解概念


    从博弈论视角分析多智能体学习需要对其中的博弈均衡解概念做细致分析。如图 2.6 所示，许多博弈没有纯纳什均衡，但一定存在混合纳什均衡，比较而言，相关均衡 (correlated
    equilibrium, CE) 容易计算，粗相关均衡 (coarse correlated equilibrium, CCE) 非常容易计算[43]。'
