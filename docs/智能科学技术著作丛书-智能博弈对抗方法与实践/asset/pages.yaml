    # 8.3.2 兵棋智能博弈系统


    墨子联合作战兵棋推演系统(以下简称墨子子系统)①为兵棋推演提供了一个良好的实验环境。墨子系统平台包括墨子系统服务端、墨子人工智能软件开发包、通信与控制接口及相关支持软件，目前主要支持
    Python 及 Lua 两种开发语言，其中 Python 语言适配目前几种主要的人工智能开发框架；Lua 语言人工智能则是基于墨子 Lua 子系统的直接二次开发，主要适合基于规则的人工智能应用开发，如决策树、行为树等。支持用户开展深度学习、机器学习、对抗博弈、多智能体、行为树等多种模式的人工智能研究，以期在战术战法研究、效能评估、智能蓝军、规则学习与策略更新等多个应用领域产生突破性的成果。


    完整的墨子人工智能平台主要包含服务端(MoziServer)、Python 人工智能客户端(Python Client)以及服务器智能体(ServerAgent)。这三部分之间存在两类接口组件，即墨子
    Python API 和 gRPC 及 WebSocket 通信接口。平台组件调用关系如图 8.8 所示。


