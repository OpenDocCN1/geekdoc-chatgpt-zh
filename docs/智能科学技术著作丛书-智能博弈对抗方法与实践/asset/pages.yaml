    # 5.2.4 关键技术分析


    在分析关键技术之前，本节介绍状态和观察量表示、动作表示和奖励函数的基本设计方法。


    (1) 状态和观察量表示。智能体局部的观察包括视线范围内的盟军和敌方部队的信息，如距离、相对坐标 x 和 y、能量、盾、单位类型等。此外，智能体可以访问视野中盟军单位的上一个动作，还可以观察周围的地形特征（特别是地形是否可通行和地形高度）。在训练期间，地图上所有单位的附加状态信息也可以使用，并允许以集中的方式训练分散的策略，包括：观察中的单位特征，以及与地图中心相对的所有智能体的坐标、冷却/能量、所有智能体的最后行动。全局状态仅允许在训练期间使用，不得在执行期间使用。


