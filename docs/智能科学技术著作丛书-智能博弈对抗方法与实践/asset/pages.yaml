  md: '某个策略遍历所有经过这个状态的路径并对其求期望：


    \( v_\pi(s_t) = E_\tau \left[ \sum_{k=0}^\infty \gamma^k r_{t+k+1} \right] = \sum_\tau
    p(\tau) \sum_{k=0}^\infty \gamma^k r_{t+k+1} \) (3.35)


    这里的 \(\tau\) 表示从状态 \(s_t\) 开始的某一条遍历结果。由 MDP 的定义可知：


    \( v_\pi(s_t) = \sum_{(s_t, a_t, \cdots)} \pi(a_t|s_t) p(s_{t+1}|s_t, a_t) \cdots
    \sum_{k=0}^\infty \gamma^k r_{t+k+1} \) (3.36)


    使用换元法，可得


    \( v_\pi(s_t) = \sum_{(s_t, a_t, \cdots)} \pi(a_t|s_t) p(s_{t+1}|s_t, a_t) \cdots
    \sum_{k=0}^\infty \gamma^k r_{t+k+1} \)

