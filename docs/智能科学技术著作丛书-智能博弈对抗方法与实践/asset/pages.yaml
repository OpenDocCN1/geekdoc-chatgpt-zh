    # 1.3.3 军事仿真类对抗


    模拟仿真技术的研究，开始只是为了方法验证，如今可以迁移到现实世界中，尤其是迁移到具有鲜明对抗特征的军事仿真类对抗场景中。以美国为代表的世界军事强国提早预见了人工智能技术在军事领域的广阔应用前景，已提前布局了“深绿”（DeepGreen）、“洞察”（Insight）、可视化数据分析（visual
    data analysis, XDATA）、深度学习、文本深度挖掘与过滤（deep exploration and filtering of text, DEFT）、高级机器学习概率编程（probabilistic
    programming for advanced machine learning, PPAML）、“心灵之眼”（Mind''s Eye）、指挥官虚拟参谋（commander''s
    virtual staff, CVS）、“阿尔法”（Alpha）、“狗斗”（Dogfight）、“雅典娜”（Athena）、“指南针”（COMPASS）等研究计划，力求在智能化上与潜在对手拉开代差。


    +   1. “深绿”


    2007 年，美军启动了一项面向美国陆军、旅级的指挥控制领域的研究计划，取名“深绿”（源于 IBM 的“深蓝”），旨在运用计算机仿真技术，推演预测未来态势发展的多种可能，帮助指挥员提前进行思考是否需要调整计划，并协助指挥员生成新的替代方案。其包括“指挥官助手”“闪电战”“水晶球”三部分。“指挥官助手”支持用户以手绘草图结合语音的方式快速制定方案。“闪电战”快速对作战计划及战场态势进行仿真推演，生成一系列未来可能结果。“水晶球”收集各种计划方案，更新战场当前态势，控制快速仿真推演。胡晓峰等[19]以“深绿”计划'
