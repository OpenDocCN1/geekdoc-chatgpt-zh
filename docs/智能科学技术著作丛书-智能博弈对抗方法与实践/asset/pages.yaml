    # 7.4 面向桥牌的序贯博弈对抗决策


    # 7.4.1 桥牌规则


    桥牌 (bridge) 是一种扑克游戏 (图 7.8)，其牌张由去掉大小王两张扑克之后剩下的 52 张扑克牌组成，共分为梅花 (C)、方块 (D)、红心 (H)
    和黑桃 (S) 四个花色，每个花色共 13 张牌。该游戏由 4 个人参与，每个人平均分配 13 张牌，分为东、西、南、北四个方位，其中东西为一队，南北为一队。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_192_0.png)


    图 7.8 桥牌游戏界面


    桥牌分为叫牌和打牌两个阶段。首先由发牌者根据自己的牌力和牌型进行叫牌，也可不叫牌，之后每家轮流叫牌，如果四家都不叫牌，则此轮作废。下一局由庄家的下家重新发牌。当开叫之后，任何一个玩家可在更高花色或更高阶数上争叫。花色从低到高为梅花
    (C)、方块 (D)、红心 (H)、黑桃 (S) 和无将 (NT)，阶数从 1~7，符号表示为 dC、dD、dH、dS、dNT，其中 0≤d≤7。定约是指叫牌过程中最后三个“过”之前的叫品。定约方的目的是达到定约中承诺的墩数，而防守方的目的是击垮定约方的定约，使其打不成承诺的墩数而丢分。定约又分为'
  merge: -1
  img_proc: true
- pgno: 193
  md: '有将定约和无将定约，其中有将定约是指花色定约，即确定 C、D、H、S 中的一门花色为将牌，将牌大于其他任意花色的牌，可以“吃”其他花色的牌。无将定约是指不确定任何花色为将牌，即没有将牌的定约，其只根据该轮第一家出牌的花色中牌的大小来决定该轮次的输赢，出牌者如果没有该花色，则可出别的花色的牌，那么无论牌大小都不能赢，称为垫牌。定约方称为庄家，自己的搭档称为同伴，自己的左手边称为下家，自己的右手边称为上家。


    叫牌过程结束后，定约就建立了，由庄家的下家打出第一张牌，称为首攻。首攻后，明手，即庄家同伴的牌将全部摊开，庄家负责出自己和明手的牌。首攻后依次出牌，四家都出一张牌，称为一墩牌。每家必须同该轮首出者出同花色的牌，如果没有则可出将牌（即为非无将定约的定约花色的牌），或“垫牌”（即不是将牌的其他花色的牌）。这一轮中出最大的将牌或者该花色最大牌的玩家赢得这一墩。下一轮由上一轮赢的人首出，依次轮流出牌，直至玩家手中的
    13 张牌均出完为止。


