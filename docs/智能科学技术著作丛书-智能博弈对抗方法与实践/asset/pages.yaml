    无悔学习方法：如果对于任意 \( \varepsilon > 0\) ，都存在一个充分大的时间域 \( T = T(\varepsilon) \) 使得对于在线决策方法
    \( M \) 的任意对手，决策者的后悔值最多为 \( \varepsilon \) ，那么称方法 \( M \) 为无悔学习方法。


