  md: '方式对整体值函数进行分解，因此网络的函数表达能力受到很大限制，难以拟合出真实的整体 Q 值。如果直接使用普通的神经网络对整体 Q 值进行分解，提升网络的函数表达能力的同时会遇到非单调性问题，导致
    VDN 算法难以保证分布式策略的最优性。单调性是指通过分布式策略计算出来的动作和通过全局 Q 函数计算出来的动作，在“性能最优”上需要保持一致。记 \( Q_{\text{tot}}
    \) 为团队整体值函数，\( Q_i \) 为单个智能体值函数，值函数分解的单调性需要满足如下条件：


    \(\frac{\partial Q_{\text{tot}}}{\partial Q_i} > 0, \quad i=1,2,\cdots,n \tag{5.5}\)


    QMIX 算法的思想是设计一个神经网络，如图 5.6 所示的混合网络，输入为 \( Q_i(\tau^i, u^i) \)，输出为 \( Q_{\text{tot}}(\tau,
    u) \)，使其满足单调性约束，增强网络的函数拟合能力，从而弥补 VDN 算法的不足。QMIX 在 VDN 算法的基础上，对从单智能体值函数到团队值函数之间的映射关系进行了改进，在映射过程中将原来的线性映射转换为非线性映射，并通过超网络的引入将额外状态信息加入到映射过程，值函数的表达能力进一步增强，提高了模型性能。QMIX
    算法在混合网络中考虑了联合行为值函数对效用函数的约束，因此无法适用于不可分解的任务，以及满足分解条件但不满足单调性的任务。


