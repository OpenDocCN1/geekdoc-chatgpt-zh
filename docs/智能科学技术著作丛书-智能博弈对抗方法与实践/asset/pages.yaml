    # 图 6.3 大规模博弈抽象简化均衡求解过程


    抽象算法能对当前的博弈进行描述，产生一个更小但策略上相似的博弈，甚至产生完全类似的抽象博弈。常见的抽象技术包括以下两种[3]。


    +   1) 动作抽象


    在有大型或无限动作空间的博弈中，由于动作行为的复杂性，博弈求解难度大大增加。此时，有效的动作抽象有助于减少搜索降低问题的复杂度。例如，在德州扑克中，在 100
    元大盲注设置下，下注 2000～2999 元的行为差别不大。在动作抽象的过程中，可以将差距较小的动作抽象为同一动作，以此将动作空间离散化。动作抽象存在的问题是，玩家会执行一些在已抽象模型外的动作。针对这一情况，需要定义一个动作映射函数，将动作映射到建模好的动作抽象上，相关的映射方法有随机算法映射、确定性几何映射、随机几何映射和伪谐波映射等，但对离线决策没有较大影响。


    +   2) 信息抽象


    信息抽象是将相似状态信息合并为相同的类或桶。信息抽象分为无损信息抽象和有损信息抽象。常见的无损信息抽象算法，如 GameShrink 算法[4]是一个自下而上的动态算法，可以合并所有有序博弈的同构节点。GameShrink
    存在抽象不准确、无法确定抽象类数量，以及计算量大等问题，Gilpin 等[5]针对这些问题，对 GameShrink 算法进行了优化。当抽象层次较高时，会发生信息丢失。求解该抽象问题的方法是使用有损信息抽象算法，如
    GameShrink 算法的有损版本。有损信息抽象对无损信息抽象的有序同构节点进行了扩展，如将兄弟节点的子节点也视为有序同构节点。总之，信息抽象依赖相似信息，如果节点之间的相似度高，将大幅减少搜索空间，但是，如果相似度定义不准确，也会导致不良的结果。Brown
    等[6]在 2014 年计算机扑克大赛 (Annual Computer Poker Competition, ACPC)中，使用了有损抽象，借助分层抽象以及蒙特卡罗反事实后悔值最小化
    (Monte Carlo counter factual regret minimization, MCCFR)算法，在两人无限注德州扑克中取得了'
