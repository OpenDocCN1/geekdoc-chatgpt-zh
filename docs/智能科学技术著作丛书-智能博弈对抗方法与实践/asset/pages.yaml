- pgno: 186
  md: '个问题在动作空间很大时尤为明显。不同于 DQN，MCTS 方法可以直接估计价值，不受过度估计影响。这一点在斗地主庞大的动作空间中非常适用。


    (4) MCTS 方法在稀疏奖励的情况下可能具备一定优势。在斗地主中，奖励是稀疏的，玩家需要打完整场游戏才能知道输赢。DQN 方法通过下一个状态的价值估计当前状态的价值。这意味着奖励需要从最后一个状态逐渐向前传播，这可能导致
    DQN 收敛更慢。与之相反，MCTS 方法直接预测最后一个状态的奖励，不受稀疏奖励的影响。


    (5) DouZero 算法的目标是学习一个价值网络。价值网络的输入是当前状态和一个动作，输出是在当前状态做这个动作的期望收益（如胜率）。价值网络在每一步计算出哪种牌型赢的概率最大，然后选择最有可能赢的牌型。


    MCTS 方法不断重复以下步骤来优化价值网络。


    +   (1) 用价值网络生成一场对局。

    +   (2) 记录下该对局中所有的状态、动作和最后的收益（胜率）。

    +   (3) 将每一对状态和动作作为网络输入，收益作为网络输出，采用梯度下降策略对价值网络进行一次更新。


    DouZero 系统的实现并不复杂，主要包含动作/状态编码、神经网络和并行训练三个部分。


    # 1) 动作/状态编码


    如图 7.3 所示，DouZero 将所有的牌型编码成 15×4 的由 0 或 1 组成的矩阵。其中每一列代表一种牌，每一行代表对应牌的数量。这种编码方式可适用于斗地主中所有的牌型。


