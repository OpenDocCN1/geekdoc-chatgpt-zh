- pgno: 51
  md: '# 4. 均衡难解且易变


    由于状态和数量的增加，多智能体学习问题的计算复杂度比较大。计算两人零和博弈的纳什均衡解是 P 问题，两人一般和博弈的纳什均衡解是 PPAD (polynomial
    parity arguments on directed graphs, 有向图的多项式校验参数) 难问题，纳什均衡的存在性判定问题是 NP 难问题，随机博弈的纯纳什均衡存在性判定问题是
    PSPACE (polynomial space, 多项式空间) 难问题。多人博弈更是面临纳什均衡存在性、计算复杂度高、均衡选择难等挑战。


    对于多智能体场景，如果每个智能体都独立地计算纳什均衡策略，那么它们的策略组合可能也不是全体的纳什均衡，并且智能体可能具有偏离到不同策略的动机。如图 2.8
    所示的柠檬水站位博弈[60]，每个智能体需要在圆环中找到一个位置，使自己与其他所有智能体的距离总和最远（图 2.8 (a)），则纳什均衡就是所有智能体沿环均匀分布，并有无限多的方法可以实现这一点，因此有无限多的纳什均衡，原问题变成了“均衡选择问题”
    [60]，但如果每个人都独立计算自己的纳什均衡策略，那么最终可能不会有整体的纳什均衡出现（图 2.8 (b)）。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_51_0.png)


    图 2.8 柠檬水站位博弈[60]


    正是由于多维目标、非平稳环境、大规模状态行为空间、不完全信息与不确定性因素等影响，高度复杂的多智能体学习问题面临诸多挑战，已然十分难以求解。


    # 2.5 多智能体博弈策略学习方法


    根据多智能体博弈对抗场景(离线和在线)的不同，可以将多智能体博弈策略学习方法分为离线博弈策略学习方法与在线博弈策略学习方法等。'
