  md: '神经网络间的连接机制与学习方法。③行为主义，又称为进化主义或控制论学派，其原理为控制论及感知-动作型控制系统。不同的学派中面临的主要问题不同，且处理方式也不尽相同。相比于符号主义学派，行为主义学派已经在研究领域中产生了一些很好的效果且设计比符号主义更好，但是由于没有特别的指导理论，难以产生复杂且高级的智能行为。连接主义是今天的深度学习系统的前身，但是这种方法也面临着一些难以解决的问题。


    # 3.3.1 强化学习简介


    与传统的人工智能研究逻辑和语义的思想不完全相同，强化学习方法以 MDP 为模型并以贝尔曼最优方程为求解方法。其目的就是最大化累计奖励的同时最小化估计值函数与真实值函数之间的差距。基于这个初衷，强化学习方法不断改进智能体在不同状态下选择动作的策略来达到这样的目的。强化学习能够在具备部分感知环境的情况下做出合理的决策。近年来，深度强化学习已然成为人工智能领域解决问题的一个重要方法。强化学习方法的灵感源自心理学和人工智能中的行为主义。在环境给予奖励值或者惩罚值时，做出合理的决策来积累正向奖励而避免负向奖励，从而逐渐形成对环境的反应，即策略。这种策略最终能够指导智能体做出获得最大利益的行为。作为机器学习除“监督学习”和“无监督学习”之外延伸出的一个重要分支，基于
    MDP 模型的“强化学习”受到了研究者的广泛关注。强化学习与生物学习有着类似的过程。当人们思考学习的本质时，首先想到的是通过与环境交互来学习。当一个婴儿玩耍、挥动手臂或环顾四周时，他没有明确的老师，但他确实通过直接的感觉与环境联系。他可以通过这种联系获得大量关于因果关系、动作的结果以及如何实现目标的信息。在人们的生活中，这种交互无疑是环境和自身知识的主要来源。无论是学习汽车驾驶还是与他人进行交谈，人们都敏锐地意识到交互的环境如何响应自己的行为，并试图通过行为来影响所发生的事情。从交互中学习是几乎所有学习和智能理论的基本思想。其主要过程可以被归结，如图
    3.3 所示。


    强化学习最早由 Thorndike[10]在 1898 年提出。术语“最优控制”在 20 世纪 50 年代后期开始使用，用于描述设计控制器以最小化或最大化动态系统随时间变化的行为问题。解决这个问题的方法之一是由贝尔曼等在
    20 世纪 50 年代中期提出的。该方法使用动态系统的状态和值函数或“最优返回函数”的概念来定义函数方程，现在通常称为贝尔曼方程。通过求解该方程来解决最优控制问题的方法称为动态规划[11]。Bellman[12]还引入了称为
    MDP 最优控制问题的离散随机版本。1992 年，Watkins 等[13]将控制优化领域的理论方法，如贝尔曼方程、MDP 与时序差分方法相结合，提出了强化学习领域最经典的方法，即
    Q 学习。典型的强化学习问题需要满足三个条件：①不同的动作产生不同的奖励；②奖励在时间上具有'
