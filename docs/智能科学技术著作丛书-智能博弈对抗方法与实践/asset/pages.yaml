  md: '结合，使得 Pluribus 能用比 Libratus 更强的处理能力和更少的内存来进行训练。

    Pluribus 策略的核心是通过自博弈来计算的。在自博弈中，AI 对自己的副本进行

    博弈，而不需要任何人类或先前的人工智能博弈的数据作为输入。从零开始随机

    采取动作，并随着它确定哪些动作以及这些动作的概率分布而逐渐改进，从而相

    对于早期版本的策略产生更好的结果。Pluribus 改进的 MCCFR 进行自博弈，通过

    自博弈为整个离线博弈生成蓝图策略。人工智能从完全随机播放开始，但通过学

    习击败自己的早期版本而逐渐改进。整个博弈的蓝图策略必然是粗粒度的。当决

    策点的数量足够少时，Pluribus 会进行实时搜索，以确定针对当前情况更好、更细

    粒度的策略。德州扑克是一种特殊的多方非合作博弈。在六人德州扑克对抗中，

    “强牌入彩池”的基本原理会让对抗自发退化成两人博弈问题。从大量牌局统计

    的结果来看，六人德州扑克在最后阶段往往成为一个两人零和博弈。这为两人博

