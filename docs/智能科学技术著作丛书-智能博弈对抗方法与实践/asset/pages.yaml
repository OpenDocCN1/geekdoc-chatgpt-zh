  md: '进。在策略迭代过程中，策略评估通过迭代地使用式（3.10）计算 \( V^{\pi_k} \)，策略改进利用 \( V^{\pi_k} \) 计算 \(
    \pi_{k+1} \)。如果对于所有的状态 \( s \in S \)，均满足 \( \pi_{k+1}(s) = \pi_k(s) \)，则策略稳定，迭代停止。最终的收敛策略就是最优策略，即


    \(\pi_0 \xrightarrow{\text{PE}} V^{\pi_0} \xrightarrow{\text{PI}} \pi_1 \xrightarrow{\text{PE}}
    V^{\pi_1} \xrightarrow{\text{PI}} \pi_2 \rightarrow \cdots \rightarrow \pi_* \xrightarrow{\text{PE}}
    V^*\) (3.12)


    其中，\(\xrightarrow{\text{PE}}\) 表示策略评估操作；\(\xrightarrow{\text{PI}}\) 表示策略改进操作。每次迭代操作后得到的新策略
    \( \pi_{k+1} \) 总是优于前一个策略 \( \pi_k \)。


    对于有限 MDP 来说，总策略数为 \( |S|^{|A|}\)，所以策略迭代方法可以在有限的步骤内找到最优值函数和最优策略。该方法以一个足够小正数 \(
    \varepsilon \) 和一个完整的 MDP 模型作为输入，并任意初始化一个初始策略 \( \pi \)，接着迭代地进行策略评估以及策略改进，直到策略收敛，最后输出收敛后的策略。


    # 2. 值迭代


    策略迭代方法将评估阶段和改进阶段完全分离。在评估阶段，每次迭代需要花费额外的时间等待值函数收敛。而值迭代方法通过提前截断评估过程（即在对每个状态进行一次更新后停止策略评估），并根据当前评估结果改进策略，这种方法通常比简单地应用策略迭代方法具有更快的收敛速度。实际上，值迭代方法通过将策略改进步骤融合到迭代中，从而只专注于评估值函数。在每个迭代周期内，值迭代方法对所有状态
    \( s \in S \) 进行备份操作。值迭代方法的本质是将贝尔曼最优方程转换成更新规则，迭代计算值函数：


    \( V_{t+1}(s) = \max_{a \in A} \left\{ R(s,a) + \lambda \sum_{s'' \in S} P(s''|s,a)
    V_t(s'') \right\} = \max_{a \in A} Q_{t+1}(s,a) \) (3.13)


    其中，\( V_t \) 是第 \( t \) 次迭代后的值函数。


    根据式（3.13），从初始值函数 \( V_0 \) 开始，值迭代方法将产生以下的值函数序列，即


    \( V_0 \rightarrow V_1 \rightarrow V_2 \rightarrow V_3 \rightarrow V_4 \rightarrow
    V_5 \rightarrow V_6 \rightarrow V_7 \rightarrow \cdots \rightarrow V^* \) (3.14)


    实际上，在计算过程中它也产生了中间的 \( Q \) 值函数，使得序列列变为


    \( V_0 \rightarrow Q_1 \rightarrow V_1 \rightarrow Q_2 \rightarrow V_2 \rightarrow
    Q_3 \rightarrow V_3 \rightarrow Q_4 \rightarrow V_4 \rightarrow \cdots \rightarrow
    V^* \) (3.15)


    可以证明，对于任意的 \( V_0 \)，在最优值函数 \( V^* \) 存在的条件下，值迭代方法保证收敛于 \( V^* \)，即对于所有状态 \( s
    \in S \) 来说，均满足贝尔曼最优方程。'
