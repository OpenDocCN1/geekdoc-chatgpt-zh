    attentive writer)，可以以端到端的方式隐式地学习时序抽象宏动作和基于宏动作的策略，仅依赖环境的奖励信号，不依赖伪奖励或者手动设定的子目标，在雅达利游戏中需要时序扩展规划和探索策略的挑战中，取得了比现有技术更好的成果，并且可以在通用序列预测中学习时序抽象。Vezhnevets
    等[46]提出了 Manager-Worker 架构，Manager 负责给 Worker 一个子目标，而 Worker 根据子目标和当前所处的状态给出具体执行的动作。在这个方法中，Manager
    和 Worker 分别是两个不同的神经网络，并且用各自的梯度分别进行优化，在实验中也取得了较好的效果。Florensa 等[47]在任务预训练之前，使用一个随机的神经网络学习技能，并通过最大化信道容量训练技能，解决之前未解决的连续控制任务。Léon
    等[48]提出了一种新的强化学习框架 POMDP (partially observable MDP, 部分可观 MDP)，并提出一种新的学习模型 BONN
    (budgeted option neural network, 预算选项神经网络)，可以在 POMDP 设定下学习 Option。Kulkarni 等[49]采用深度学习方法学习子目标，设计一个具有两个层次的神经网络，顶层用于决策，确定下一步的目标，底层基于内部动机实现具体行为。该方法的缺点是需要人工给定子目标，不具通用性，并且由于内部动机设计原则不清楚，在复杂问题中很难实现。


    # 3.6 分布式强化学习


    深度强化学习领域的研究重点已经转向更复杂的主体-环境相互作用。因此，拥有可靠且可重复使用的深度强化学习智能体参考实现已成为推动学术和生产环境新发展的一个关键方面。下面首先介绍三类典型的分布式环境：面向研究的
    Dopamine、面向端到端的 Horizon 和聚焦于分布式学习的 Ray RLlib。


    +   1. Dopamine


    Dopamine 框架代表了面向研究的深度强化学习解决方案系列。该领域中不同的研究目标要求研究软件具有各种级别的复杂性。例如，框架研究集中在如扩展分布式训练之类的工程问题上，并且可能需要高度优化的模块化框架。相反，深度强化学习领域的方法研究受益于支持新思想快速原型制作的简单解决方案。这个基于
    TensorFlow 的框架主要受以下原则驱动。


    (1) 独立紧凑原则。Dopamine 通过将框架的所有核心逻辑保存在少量文件中，为深度强化学习领域的新人提供了一个易于理解的平台。智能体与环境交互的所有方面(如发送动作和接收观察)都由
    Runner 类管理。为了确保在失败和将来重复使用所学策略的情况下进行恢复，检查指针组件定期保存实验状态。对实验进度'
  merge: -1
  img_proc: true
- pgno: 101
  md: '的额外监控由 Logger 组件完成，该组件创建 TensorBoard 事件文件，用于对收集的统计数据进行可视化分析。


    (2)可靠且可重复原则。确保实验结果的一致性和可重复性是深度强化学习领域的关键挑战之一。虽然由于环境和智能体人的随机性质，结果的可变性是不可避免的，但某些不一致可以通过更严格的报告标准和可共享的评估设置来避免。


    # 2. Horizon


    与前面讨论的 Dopamine 框架相反，Horizon 将自己定位为解决生产强化学习问题的第一个端到端平台，考虑到这种方法可能会转变为如何构建自动系统。Horizon
    处理包含数百万个观察值的数据集，包括模拟器不能用于评估策略的情况，学习必须小心进行，以保持已建立的生产系统和用户经验。Horizon 框架主要包括以下主要功能。


    (1)数据预处理。传统的深度强化学习智能体在包含当前状态、所选动作、连续状态和奖励的 MDP 转换上进行训练。由于像 OpenAI Gym 这样的传统基准使使用模拟器来提供反馈，这样的转换可以立即创建并存储在经验缓冲区中以供学习。然而，在生产环境中，反馈循环很慢，所有的观察结果都被立即记录下来，这可能需要几个小时甚至几天的时间来获得对所选操作的奖励。因此，Horizon
    提供了 Apache Spark 数据预处理管道（称为时间轴管道），该管道分析生产日志并创建强化学习智能体使用的转换。


    (2)特征归一化。生产数据经常是稀疏的、有噪声的和任意分布的。因为已经表明，当在正态分布特征上训练时，神经网络学习得更好，特征标准化工作流对于端到端深度强化学习系统是至关重要的。因此，Horizon
    分析训练数据，并为每个特征导出一个归一化函数。Horizon 没有重新生成整个数据集，而是将该归一化函数集成到 PyTorch 神经网络中，该网络将在前向传递过程中对每个数据样本进行归一化。


    (3)数据理解工具。将深度强化学习方法应用于不良环境可能会使评估指标倒退，并推动开发过程调整不相关的因素。Horizon 建议从收集的生产日志中学习一个环境模型，并使用模型和启发式方法的组合来检查问题的有效性，并确定环境构建的重要特征。


    (4)深度强化学习智能体实现。为了支持具有 (非常大的) 离散和连续操作空间的环境，Horizon 提供了几个基于价值和基于策略的智能体的实现。对于具有可管理数量的动作的离散动作域，Horizon
    提供了传统的深度问答网络和部分 Rainbow 智能体。为了处理可能包含短暂动作的非常大的离散动作域，Horizon 引入了参数动作 DQN，这是 DQN
    智能体的变体，可以基于一组特征过滤无效动作。对于连续的动作空间，Horizon 实现了深度确定性策略梯度和 SAC 智能体，这两种智能'
  merge: -1
  img_proc: true
- pgno: 102
  md: '体都简单而有效。


    (5)生产环境训练。一旦输入数据经过预处理和规范化，Horizon 就可以利用 PyTorch 的多图形处理器(graphics processing unit,
    GPU)功能，在非常大的数据样本上高效地执行分布式训练。与模拟环境相比，从一开始就在线训练强化学习智能体可能是不可取的。应用到生产系统的初始随机策略可能会让用户接触未经测试的实验策略，或者在安全关键系统的情况下，对系统产生不可逆的影响。因此，Horizon
    建议对当前非强化学习生产策略收集的数据进行离线学习初始策略。


    (6) 反事实策略评估。与前面提出的观点类似，由于行为的不可预测性，无法在生产环境中直接评估正在训练的策略。因此，Horizon 使用反事实策略评估(counterfactual
    policy evaluation, CPE)方法，该方法能够基于历史数据估计策略的质量，而无须将其应用到生产系统中。在训练过程中，Horizon 执行以下
    CPE 估计器之一：分步直接法估计器、分步重要性抽样估计器、分步双稳健估计器、顺序双稳健估计器、顺序加权双稳健估计器或 MAGIC 估计器。这些技术的一般思想是学习对环境奖励函数的估计，以预测没有观察到但可能发生的奖励。关于每种方法的更多细节，感兴趣的读者可以参考相关文献。


    (7)优化模型服务。在实际应用中，生产环境可以在包含数千台机器的集群中运行，确保模型的高效和稳健服务非常重要。Horizon 通过使用 PyTorch 和
    ONNX 格式来创建一个包含智能体配置的可移植包来应对这一挑战。应用到许多机器上的策略将把新的经验收集到生产日志中，这些经验可以被馈送到时间线预处理管道，并在学习过程的下一次迭代中使用。


    # 3. Ray RLlib


    如前所述，深度强化学习工作流通常包括经验收集和策略优化两个阶段。理论上，人们可以通过将特定的分布式系统应用于每个阶段并将它们拼接在一起来实现并行性。然而，在实践中，由于组件之间的紧密耦合和系统之间的高通信成本，这种方法是不合理的。因此，当前的深度强化学习库倾向于将深度强化学习智能体实现为单个强连接的过程，并将并行方法应用于整个过程，而不是单个模块。不幸的是，这种策略使得这种实现很难扩展、组合和重用。研究表明，尽管深度强化学习智能体的设计看起来有很大的差异，但在大多数智能体设计中都包含了如策略评估和基于梯度的优化等几部分内容。因此，显然需要一种实现高效抽象可组合并行组件的解决方案。该框架必须解决的一个关键问题是在深度强化学习智能体工作流的不同阶段充分处理高度不规则的计算模式。首先，方法任务的持续时间可以从毫秒(如采取行动)到数小时甚至数天(如接收来自环境的反馈)。其次，不同阶段的训练需要异构硬件(例如，经验采样通常在多个中央处理器(central
    processing unit, CPU)上运行，而策略优化在 GPU 上运行)。最后，深度'
