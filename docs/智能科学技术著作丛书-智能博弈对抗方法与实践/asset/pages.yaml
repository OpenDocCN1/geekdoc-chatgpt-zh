    # 2. 分布式近端策略优化算法


    分布式近端策略优化(distribution proximal policy optimization, DPPO)算法是一种同步并行的近端策略优化算法，这里先简要介绍
    PPO 算法。PPO 是一种策略梯度算法，借鉴自置信域策略优化(trust region policy optimization, TRPO)算法，使用一阶优化，在采样效率、算法的表现上，以及实现和调试的复杂度之间取得新的平衡。PPO
    算法会在每一次迭代中尝试计算新的策略，以使损失函数最小化，并且控制每一次新计算出的策略和原策略的“距离”。PPO 算法包含三个网络：一个评价网络，两个策略网络。参数更新过程与策略梯度类似，不同的是评价网络和策略网络会对采样一个批次的数据进行多次学习。策略网络的损失值如式
    (8.1) 所示：


    ```

    \( L^{\text{CLIP}}(\theta) = \hat{E}_t \left[ \min \left( r_i(\theta) \hat{A}_t,
    \text{clip}(r_i(\theta), 1-\varepsilon\epsilon, 1+\varepsilon\epsilon) \right)
    \right] \) (8.1)

    ```


    其中，\( \hat{E}_t \) 为期望；\( r_i(\theta) \) 为比例函数；\( \hat{A}_t \) 为优势值函数；\( \text{clip}(\cdot)
    \) 为截断函数；\( \varepsilon, \epsilon \) 为参数。'
