    # 4.4.2 对手感知式学习


    对手感知式学习方法主要通过假设对手也在学习己方模型，与对手共同学习演化是其主要思路，其中假设对手也在学习，故在对手建模过程中要考虑到这一层推理关系。


    # 1. 认知建模与推理


    认知建模的方法主要试图从认知行为学的角度，采用心智理论分析对手的行动，进而得出已方策略[69]。基于心智理论的推理方法得到了广泛研究[70]，其中递归推理[71]方法对嵌套信念进行建模（例如，“我相信你相信我相信……”），并模拟对手的推理过程来预测他们的行动，递归持续推理对手的可能模型，预测行为的可能性，基于层次推理与无悔学习的方法可以很好地为在线对抗学习提供支撑。


    # 2. 学习意识稳定塑造


    相比传统对手模型学习方法，学习意识稳定塑造类方法通过引入一个包含对手值函数的二(高)阶项来考虑对手策略的变化。Foerster 等[72]提出对手具有学习意识的学习
    (learning with opponent learning aware, LOLA)算法，假定对手也具有学习能力，该算法需要在与对手交互学习的环境下学习对手模型，此外，Letcher
    等[73]将前瞻搜索与 LOLA 算法结合，提出了用于微分博弈中对手建模的稳定对手塑造方法。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 3. 协同演化与集成


    协同演化与集成类方法主要采用与对手协同交互的方式学习克制对手的模型。协同演化方法利用对手模型和演化学习方法生成对抗策略池[74]。集成方法采用多个已训练好的专家策略，对未知对手行为预测的准确率比单个分类器的结果更高，可以为基于已有异构分类模型快速构造通用的对手模型提供支撑，提高对未知对手的预测性能，提高模型泛化能力[75]。


    # 4.4.3 对手生成式搜索


    对手生成式搜索类方法不需要利用确切的对手模型，但需要将对手行动纳入反制策略的生成过程中，分析对手可能采取的行动。


    # 1. 受限博弈响应生成


    受限博弈响应生成类方法主要试图分析对手的可能性倾向和可能不会采取的行动，在原有的纳什均衡最优策略基础上生成限定的反制策略。其中博弈最佳响应方法，通过观察对手的动作频率，并结合近似均衡策略的信息与观察值以构建对手模型，根据对手模型计算并生成最佳响应，不断进行实时更新[76]。例如，为了生成鲁棒的反制策略，可以使用统计数据分析和挖掘方法分析对手的倾向性策略，基于专家知识，利用剪枝生成行动受限的纳什响应策略等。此外，局部最佳响应、统计数据偏差响应[77]、有限理性定量响应和安全最佳响应[78]也常用于针对对手的反制策略制定。Ponsen
    等[79]提出利用 MCTS 与受限纳什响应生成鲁棒的反制策略，如图 4.13 所示，其中参数 p 表示模型的信任度。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_126_0.png)'
