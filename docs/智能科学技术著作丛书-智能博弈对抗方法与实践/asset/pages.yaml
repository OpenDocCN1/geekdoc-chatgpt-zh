    # 图 2.6 博弈均衡解概念


    由于学习场景和目标的差别，一些新的均衡解概念也被采纳，如面向安全攻防博弈的斯塔克尔伯格均衡、面向有限理性的量化响应均衡、面向演化博弈的演化稳定策略、面向策略空间博弈的元博弈均衡、稳定对抗干扰的鲁棒均衡（也称颤抖手均衡）、处理非完备信息的贝叶斯均衡、处理在线决策的无悔或最小后悔值、描述智能体在没有使其他智能体情况变坏的前提下使得自身策略变好的帕累托最优等。近年来，一些研究采用团队最大最小均衡[44,45]来描述零和博弈场景下组队智能体对抗单个智能体，其本质是一类对抗合作博弈模型，可用于解决网络阻断类问题、多人扑克问题和桥牌问题。同样，一些基于“相关均衡”[46]解概念的新模型相继被提出，应用于元博弈、扩展式博弈、一般和博弈、零和同时行动随机博弈等。正是由于均衡解的计算复杂度比较高，当前一些近似均衡的解概念得到了广泛运用，如最佳响应[47]和预言机[48]等。


    # 2. 博弈动力学


    博弈原本就是描述个体之间的动态交互过程。对于一般的势博弈，从任意一个局势开始，最佳响应动力学可确保收敛到一个纯纳什均衡。最佳响应动力学过程十分直接，每个智能体可以通过连续性的单方策略改变来搜索博弈的纯纳什均衡。


    最佳响应动力学：只要当前的局势 s 不是一个纯纳什均衡，任意选择一个智能体 i 以及一个有利的策略改变 s''_i，然后更新局势为 (s''_i, s_{-i})。


    最佳响应动力学只能收敛到一个纯纳什均衡且与势博弈紧密相关，但在任意有限博弈中，无悔学习动力学可确保收敛到粗相关均衡。对任意时间点 t = 1, 2, ...,
    T，假定每个智能体 i 获得的收益向量为 c''_i，给定其他智能体的混合策略 \sigma''_{-i} = \prod_{j \neq i} p''_j
    ,


    每个智能体 j 使用无悔学习方法独立地选择一个混合策略 p''_j，则智能体选择纯策'
