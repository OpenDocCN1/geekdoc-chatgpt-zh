  md: '# 第 8 章 兵棋智能博弈对抗决策智能体设计


    # 8.1 引 言


    人工智能技术在围棋、德州扑克、桥牌、《星际争霸》等边界确定、规则固定的对抗博弈领域不断取得突破，为求解多智能体对抗博弈问题带来了曙光。但不同于普通的即时策略对抗游戏，兵棋推演问题是直接对战争的模拟，其推演和博弈过程有着极大的不确定性和未知性，多兵种协同与环境耦合的问题凸显，且战争系统具有强非线性和高动态等复杂特性，解析计算和随机逼近最佳策略都存在巨大挑战。本章围绕智能兵棋博弈对抗决策展开：8.2
    节介绍兵棋推演基础，在读者对兵棋有一定了解的基础上，举例分析兵棋问题的复杂度，介绍解决兵棋问题的关键技术；8.3 节介绍兵棋 AI 研究历程和兵棋智能博弈系统的构成，在墨子联合作战兵棋推演系统上演示完整的兵棋
    AI 开发过程。


    # 8.2 面向智能兵棋的多智能体对抗决策方法


    # 8.2.1 兵棋推演基础


    人工智能第三次浪潮推动了智能化战争的进程，未来战争到底怎么打，人工智能提供何种程度的辅助决策，不能凭空想象。当前最常用的辅助筹划和决策工具是兵棋，兵棋推演是一种利用兵棋进行战争预实践的平台，也是研究、应对、设计和实践未来智能化战争的有效手段，受到各主要军事强国的高度重视。指挥员在内嵌规则的智能兵棋系统中根据想定设计参与对手并模拟推演，开发作战概念和作战样式，评估作战方案，提高指挥训练能力[1]。


    兵棋系统伴随着信息技术的不断进步发展。1811 年，手工兵棋开始出现，主要利用指挥员总结的经验和规律进行推演分析，是作战推演早期简单的推演工具。随后逐步衍生出第一代兵棋系统(图
    8.1(a))，其形式主要表现为棋盘、棋子和规则，固定的作战地域，以陆、海、空为主的作战行动，对阵双方通过“回合制”完成全部推演过程，并通过规则表和骰子来决定推演的走向及结果；二战结束后，计算机的出现，使得兵棋推演平台发生了变化，第二代兵棋系统，即计算机兵棋开始出现(图
    8.1(b))，依托计算机强大的计算能力和基础数据，以“数学模型+程序计算”[2]为核心，基本实现对作战全要素和全过程的模拟；经过几十年的发'
