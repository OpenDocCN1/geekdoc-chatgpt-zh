  md: '# 9.5 元学习：双层优化方法


    元学习 (meta learning)，直译即为学会学习 (learning to learn)，是一种“能力习得”途径。它是由 Schmidthuber
    于 1987 年提出的[22]，他认为智能体与环境之间的相互作用可以促进智能体自我完善，使其能够快速、准确地适应动态环境条件。元学习模拟了人类的学习方式。早期的元学习研究从解释人们学习新概念过程的认知科学实验中获得灵感和动机。当前关于元学习方法的相关研究主要有度量学习方法、分层优化方法、贝叶斯方法等。


    # 9.5.1 度量学习方法


    度量学习方法的核心思想类似于最近邻等聚类方法，依靠相似性度量来分析新任务与最相关的已知模型的相关性，寻找模型训练经验参考，如图 9.8 所示。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_234_0.png)


    图 9.8 基于度量的元学习框架


    简单神经注意力学习 (simple neural attentive learning, SNAIL)[23]方法包括一个注意块，它从记忆中识别出最相关的项目。使用软注意功能的注意块用于从过去的经验中识别关键特征并对其进行分类。注意机制被嵌入神经网络中，以识别最相关的先前状态来计算当前状态。注意块通常由两部分组成，即特征提取神经网络和深度度量神经网络，用于测量任务相似度。元参数在特征提取块中，利用监督深度度量学习训练度量参数。


    关系网络 (relation network, RN)[24]方法包含特征提取神经网络中的元参数和距离度量中的元参数。使用受监督的深度度量学习来训练高维输入的提取特征之间的相似性度量。对特征提取模型和距离测度进行联合调整，以表示任务之间的相似度。


    原型网络 (prototypical network)[25]方法用一个嵌入函数把每个输入编码为一个特征向量，然后分析特征嵌入与不同类别质心之间的距离，取所有集合样本的特征向量的平均值作为类的原型特征。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# ## 9.5.2 分层优化方法


    分层优化方法由不同泛化能力的基础学习器和元学习器组成。如图 9.9 所示，基础学习器包含两部分参数：特定任务参数和元参数。基础学习者更新特定于任务的参数以适应不同的任务。元学习器从多个任务中积累经验，挖掘它们的共享特征，最小化验证数据的损失函数以最小化泛化误差，并更新基础学习器中的元参数。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_235_0.png)


    图 9.9 分层优化元学习框架


    模型无关元学习（model-agnostic meta learning, MAML）[26]方法是一种基于梯度的元学习方法。元参数是每个任务特定参数的初始值。元学习器中的元参数通过最小化验证数据的损失函数来更新。通过最小化训练数据的损失函数，在基础学习器中更新特定任务参数。MAML
    在基础学习器和元学习器中都包含了随机梯度下降更新，因此引入了损失函数的二阶导数，消耗了计算时间。


    元长短期记忆（meta-LSTM）网络[27]方法使用长短期记忆网络作为元学习器，也兼容任何依托随机梯度下降优化的学习器。由于 LSTM 网络包含记忆细胞、自连接递归神经元、乘法门和遗忘门，确保梯度在反向传播时不会爆炸或消失，并且可以解释序列数据中的长期依赖性。记忆细胞包含重要的过去模型训练经验和遗忘门，以确保记忆不爆炸。LSTM
    网络可以对任意复杂的任务相似性进行建模，自连接递归神经元可以在元训练过程中进行自我完善。


    岭回归微分判别器（ridge regression differentiable discriminator, R2-D2）和逻辑回归微分判别器（logistic
    regression differentiable discriminator, LR-D2）方法[28]考虑使用广泛适用的基础学习器，如岭回归和逻辑回归。这些基础学习器不像深度模型那么复杂，但它们也被广泛应用于现实生活中。元学习器是一种对任意复杂任'
  merge: -1
  img_proc: true
