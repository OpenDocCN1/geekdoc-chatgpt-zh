  md: '# 定义 3.3 (MAXQ) 一个无参数子任务 $M_i$ 可以表示为一个三元组 $\langle T_i, A_i, \tilde{R}_i \rangle$，其中：


    +   (1) $T_i$ 表示子任务 $M_i$ 的终止条件。$T_i$ 将整个状态空间 $S$ 区分为活动状态 $S_i$ 和终止状态 $G_i$。只有当当前状态
    \(s \in S_i\) 时，子任务 $M_i$ 是可执行的。如果当前状态 \(s \in G_i\)，则子任务 $M_i$ 终止。


    +   (2) $A_i$ 是子任务 $M_i$ 的动作集合，既包括原子子作业，也包括其他子任务。


    +   (3) $\tilde{R}_i$ 是子任务 $M_i$ 的内部伪奖励函数，给出从活动状态 $s$ 转移到终止状态 $G_i$ 的奖励。


    子任务 $M_i$ 的目标是将环境状态转移到满足终止条件 $T_i$ 的状态中。给定原任务的分层结构，分层策略表示为 $\pi = \{ \pi_0, \cdots,
