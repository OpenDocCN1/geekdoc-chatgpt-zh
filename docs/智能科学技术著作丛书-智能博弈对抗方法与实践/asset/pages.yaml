  md: '# 第 2 章 博弈论视角下的多智能体学习


    # 2.1 引 言


    随着深度学习和深度强化学习而来的人工智能新浪潮，为智能体从感知输入到行动决策输出提供了“端到端”解决方案。多智能体学习是研究智能博弈对抗的前沿课题，面临着对抗性环境、非平稳对手、不完全信息和不确定行动等诸多难题与挑战。本章从博弈论视角入手，2.2
    节简要介绍博弈论基础；2.3 节给出多智能体学习系统组成、多智能体学习概述、多智能体学习研究方法分类；2.4 节围绕多智能体博弈学习框架，分析多智能体博弈基础模型及元博弈、均衡解概念和博弈动力学、多智能体博弈学习的挑战；2.5
    节全面梳理多智能体博弈策略学习方法，包括离线博弈策略学习方法，如随机博弈策略学习方法、扩展式博弈策略学习方法、基于元博弈的策略学习方法，在线博弈策略学习方法，如无悔学习、在线元学习、事后理性学习、对手感知学习、匹配及协作学习；2.6
    节展望多智能体学习的前沿研究重点及方向。


    # 2.2 博弈论基础


    博弈论译自英文 game theory，直译就是“游戏理论”。博弈论是研究依据效用以及理性“局中人”(player)①之间策略交互的一门科学。在策略交互过程中局中人信息不对称，利益相互冲突，行为相互影响，理性局中人通常会最大化自身的利益。传统的非合作博弈强调的是个人理性，追求个人最优决策策略，但在策略相互交互时，局中人不能达成一个有约束力的协议，局中人没有实质性的约束力，其结果可能是无效率、损人不利己的。而合作博弈强调的是集体主义、团体理性、平等和公平。20
    世纪，博弈论领域产生了很多巨人。50 年代，由 Nash 创造性提出的纳什均衡(Nash equilibrium, NE)概念，更是推动了博弈论的发展。纳什均衡作为一个一致性解概念，深刻揭示了局中人无法单方面改变自己的收益，相对于其他个体，其策略已是最佳响应。Shapley
    提出了合作博弈的两个解概念，即核仁、沙普利值，兰德公司的数学家 Issac 提出了微分博弈，以色列数学家'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Aumann 提出了严格(强)纳什均衡。60 年代，Selten 将纳什均衡的概念引入动态博弈，提出“精炼纳什均衡”的概念；Harsanyi 把不完全信息引入博弈论的研究，提出“贝叶斯纳什均衡”，证明不完全信息博弈可以通过
    Harsanyi 转换成完全但不完美信息博弈。70 年代的典型成果有 Smith 的演化博弈论，Aumann 的知识模型与共同知识。80 年代，Kreps
    和 Wilson 将不完全信息引入动态博弈中，提出“精炼贝叶斯纳什均衡”。90 年代的典型成果有 Tirol 等的完美贝叶斯均衡。其实从 90 年代以来，已有十余位博弈论专家获得诺贝尔经济学奖，数位算法博弈论专家获得图灵奖。后纳什均衡时代的博弈论研究主要针对博弈的假设条件和前提条件进行重新修改与扩展。目前吸引广大博弈理论研究者注意力的是动态博弈和不完全信息博弈，这也是本书研究的重点。


    # 2.2.1 博弈五要素


    博弈论是指一些个人、团队或其他组织，面对一定的环境条件，在一定的约束条件下，依靠所掌握的信息，同时或先后、一次或多次从各自可能的行为或策略集合中进行选择并实施，各自从中取得结果或收益的过程。博弈论是研究具有理性和智能的决策者之间竞争与合作的交互式决策理论，其追求的是稳定的最大利益。


    # 1. 局中人


    局中人是指在博弈中独自参与决策并承担结果的决策者，也称博弈方。局中人可以是单个的人，也可以是一个团队(如组织、企业、国家、联盟)，其决策会影响到其他局中人。有时将“自然”作为虚拟局中人，用于在博弈的特定时节上以特定的概率随机选择行动。博弈论中，一般有局中人是理性的基本假设，但理性人不等于自私，理性人可能是利己主义者，也可能是利他主义者。这种理性可以分为完全理性(不会犯错)和有限理性(可能会失误)，个体理性(追求个体利益最大化)和集体理性(追求团体利益最大化)。由于博弈过程中策略的交互与相互依存关系，博弈问题的复杂性与局中人的数量有直接的关联，其中两人博弈最简单，三人及三人以上博弈比较复杂，博弈结果也更难预测。


    # 2. 行动


    行动(action)是局中人在某个决策点(某个时间点或某个时刻)的决策变量。行动的顺序对博弈的结果至关重要，根据行动的顺序可以分为静态博弈(局中人同时选择行动)与动态博弈(局中人不同时选择行动)。如斯塔克尔伯格博弈模型就是典型的动态博弈模型。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 3. 信息


    信息 (information) 是局中人有关博弈的知识，包括博弈的环境、局中人的理性程度、局中人的行动、局中人的策略、“自然”的选择等知识。信息与收益 (支付)
    关系密切。博弈论中关于“共同知识”的假设是指“所有局中人知道，所有局中人知道所有局中人知道，所有局中人知道所有局中人知道所有局中人知道……”的知识。层次嵌套式的“共同知识”表述一般用于描述所有局中人对某个事实都“知道”的关系。如果局中人对所有历史行动信息掌握得非常充分，这类博弈称为完美信息博弈，否则称为不完美信息博弈，如果每个局中人都拥有所有其他局中人的特征、策略及支付函数等方面的准确信息，这类博弈称为完全信息博弈，否则称为不完全信息博弈。


    # 4. 策略


    策略 (strategy) 也称计谋，是局中人相继决策的完整行动规则，它规定了局中人在相应信息下选择什么行动计划，是行动的规则。单个局中人的所有策略的全体称为这个局中人的策略集。


    # 5. 收益


    收益 (payoff) 是指在根据特定的局中人策略组合得出博弈结果后各局中人所获得的收益或支付，用以描述博弈过程中局中人追求的主要目标，也是行动和策略选择的主要依据。收益可以用确定的数表示，利用“效用理论”相关知识进行表征，而不能用数字表示的安全感、荣誉感等，可以根据偏好关系进行比较。


    # 2.2.2 博弈论分类


    # 1. 非合作与合作博弈


    非合作博弈，追求自己稳定的最大利益；合作博弈，追求集体和个人利益的统一。其中非合作博弈通常可分为完全信息静态博弈、完全信息动态博弈、不完全信息静态博弈、不完全信息动态博弈等。合作博弈可分为可支付合作博弈、非支付合作博弈、策略型合作博弈等类型。


    # 2. 完全 (完美) 与不完全 (不完美) 博弈


    如果局中人完全了解所有局中人各种情况下的利益 (支付)，称此局中人具有完全信息，否则称局中人具有不完全信息。所有局中人均具有完全信息的博弈称为完全信息博弈，至少有一个局中人具有不完全信息的博弈称为不完全信息'
