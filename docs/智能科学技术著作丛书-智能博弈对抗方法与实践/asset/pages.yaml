    # 3. 分层策略选择


    Lelis[47]提出了分层策略选择（stratified strategy selection，SSS）方法，该方法使用类型系统将玩家的单位划分为不同类型，并假定相同类型的单位必须遵循相同的策略。将一个脚本分配给一组被判断为属于同一类型的单元。一个类型系统决定如何使用属性来划分单位，如当前的生命值、攻击范围和武器伤害，类型数量越多，策略越精细；反之，数量越少，策略越粗糙。SSS+是一个变体，使用自适应类型系统和元推理方法来平衡搜索之间的策略粒度。如图
    4.7 所示，SSS 算法采用类型系统，SSS+采用自适应类型系统，初始设定默认均为 NOK-AV，依据类型进行种群划分，然后进行逐群体迭代交替至决策时间结束。'
