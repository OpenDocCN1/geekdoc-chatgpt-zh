  md: '# 前 言


    人类社会的经济、政治、金融和生活中存在着各种形式的对抗、竞争和合作，其中对抗一直是人类文明发展的最强劲推动力。个体与个体、个体与群体、群体与群体之间复杂的动态对抗演化，不断促进人类智能的升级换代。对抗是人类社会发展与演进的主旋律，广泛存在于人与自然、人与人、人与机器之间，是人类思维活动特别是人类智能的重要体现。


    人工智能(AI)技术的发展经历了计算智能、感知智能阶段，云计算、大数据、互联网等技术的发展正助力认知智能的飞跃发展。特别是近年来，以 AlphaGo (围棋
    AI 程序)、Pluribus (德州扑克 AI 程序)、AlphaStar (《星际争霸》AI 程序)、Suphx (麻将 AI 程序) 等为代表的人工智能技术在人机对抗比赛中已经战胜了人类顶级职业选手，这类对抗人类认知决策智能的智能博弈对抗技术为人工智能由计算智能、感知智能研究迈向认知智能研究提供了新范式。


    未来军事领域的对抗需要面对高复杂环境、不完全信息、强对抗博弈、高动态响应、自主无人化等众多新课题。多域、跨域强对抗环境给智能认知与决策带来了新挑战。人工智能支撑的智能化作战体系将具备自适应、自学习、自对抗、自修复、自演进等能力，在认知对抗辅助决策导引下的智能无人集群自主对抗能力更强。各国军方都在加快军事智能化建设，亟须将最新的理论、方法和技术应用于军事对抗领域，这种需求极大地促进了人工智能技术的快速发展。将智能博弈对抗技术集成到智能化指挥控制系统中，并通过不断进化升级最终超越人类决策水平，正成为验证人工智能技术军事应用潜力的重要突破方向。


    本书共 10 章，主要内容介绍如下。


    第 1 章介绍智能博弈对抗的基本概念，重点讨论智能博弈对抗的内涵、意义，从即时策略类对抗、序贯策略类对抗和军事仿真类对抗三个方面认真梳理智能博弈对抗相关的研究应用。


    第 2 章～第 4 章是理论方法，主要介绍智能博弈对抗的理论及相关基础方法。第 2 章基于博弈论相关基础知识介绍多智能体学习方法。第 3 章首先简要介绍马尔可夫决策过程，其次基于马尔可夫决策过程分别介绍强化学习方法、深度强化学习方法、分层强化学习方法，最后简要介绍三种分布式强化学习框架。第
    4 章首先对对手建模方法展开介绍，分析对手建模面临的挑战，对两大类对手建模方法(显式和隐式)进行简要细分类；其次围绕即时策略类对抗中的对抗规划问题进'
  merge: -1
  img_proc: true
- pgno: 7
  md: '行梳理，指出未来研究重点；最后围绕序贯策略类对抗中的对手剥削方法进行梳理，指出未来研究重点。


    第 5 章～第 8 章是应用实践，为三大类智能博弈对抗系统平台提出智能体设计思路及实践。第 5 章以《星际争霸》游戏为研究对象，首先将《星际争霸》问题抽象成即时策略对抗问题，分析其问题状态空间复杂度，总结该问题的研究挑战，有针对性地总结应对这些挑战的关键技术；其次介绍《星际争霸》的
    AI 构建工作，包括《星际争霸》AI 研究历程、AI 环境；最后基于《星际争霸》多智能体挑战平台开展实验验证。第 6 章以德州扑克为研究对象，首先介绍德州扑克基础知识，分析德州扑克问题复杂度，剖析关键技术；其次总结德州扑克
    AI 研究历程，介绍德州扑克智能博弈系统；最后围绕两人无限注和多人无限注德州扑克开展智能体实验验证。第 7 章将分别以斗地主和桥牌为例，首先介绍游戏规则，分析问题复杂度以及关键技术；其次分析各类智能体的研究历程；最后在斗地主和桥牌游戏平台上开展智能体实验验证。第
    8 章首先介绍兵棋基础，分析兵棋问题的复杂度，介绍解决兵棋问题的关键技术；其次介绍兵棋 AI 研究历程和兵棋智能博弈系统的构成；最后利用盘子兵棋推演系统演示兵棋
    AI 开发过程。


    第 9 章和第 10 章是前沿展望，紧跟智能博弈新方向，介绍智能博弈对抗的相关元理论和典型前沿应用。第 9 章简要介绍元宇宙、元博弈、元认知及元学习等最新前沿博弈对抗相关理论。第
    10 章从三种博弈模型（微分博弈、攻防博弈和平均场博弈）出发，分析视觉欺骗目标检测、复杂网络攻防和无人机集群对抗三个典型应用场景。


    本书各章节独立性较强，读者可阅读自己感兴趣的章节，并可查询相关参考文献获取前沿研究内容。


    本书的编撰过程中参考了很多国内外论文、论著和资料，书中的插图有一些来源于相关论文，感谢这些文献作者的优秀研究成果。正是无数科研工作者日日夜夜奋斗的成果，为我们指明了道路，在此对这些文献作者表示诚挚的谢意。同时感谢陆丽娜、魏婷婷、李阳阳、陈诗凯、詹俊、姚箴、王尧等在资料收集、文字处理、格式排版和文稿校对等方面给予的支持。


    感谢国家自然科学基金(61806212)、湖南省研究生科研创新项目(CX20210011)对本书的资助。


    由于作者水平有限，书中难免存在不妥之处，敬请各位专家、读者批评指正。'
