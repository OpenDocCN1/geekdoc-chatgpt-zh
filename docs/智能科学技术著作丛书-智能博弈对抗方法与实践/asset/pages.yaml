    R_{i, dis}^T(I, a) = \begin{cases} \sum_{t=1}^T \left( \frac{t^\alpha}{t^\alpha
    + 1} r_i^t(I, a) \right), & r_i^t(I, a) > 0 \\ \sum_{t=1}^T \left( \frac{t^\beta}{t^\beta
    + 1} r_i^t(I, a) \right), & r_i^t(I, a) < 0 \end{cases}

