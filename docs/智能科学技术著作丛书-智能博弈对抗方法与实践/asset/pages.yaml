  md: '# 第 4 章 智能博弈对抗对手建模方法


    # 4.1 引 言


    多智能博弈对抗环境是一类典型的竞合（竞争-合作）环境，从博弈理论的视角分析，合理预测对手行为并安全利用对手弱点，可为己方决策提供有效依据。要解决博弈中非完全信息的问题，最直接的做法就是采取信息补充全等手段将其近似转化为完全信息博弈模型。其中，对手建模（opponent
    modelling，OM）主要是指利用交互信息对对手行为进行建模，然后推理预测对手行为、推理发掘对手弱点并予以利用。本章主要围绕对手建模方法展开；4.2 节简要介绍对手建模面临的挑战、显式对手建模方法及隐式对手建模方法；4.3
    节围绕即时策略类对抗中的在线对抗规划问题，从战术对抗规划、策略对抗规划和混合对抗规划三个方面展开介绍，并指出对抗规划的未来研究重点；4.4 节围绕序贯策略类对抗中的对手剥削问题，从对手建模式适变、对手感知式学习和对手生成式搜索三个方面展开介绍，并指出对手剥削的未来研究重点。


    # 4.2 对手建模基础


    从狭义上讲，对手建模作为一种典型的认知行为建模方法，主要研究的是如何对除自己以外的其他智能者进行行为建模，获得智能的行为模型，基于模型进行预测。对手建模也是一种典型的行为预测技术。当前，借助大数据及超强的计算能力，行为预测方法的研究呈现出专家知识驱动、数据驱动和混合驱动三种范式。从广义上看，对手建模主要是指对除智能体自身以外其他智能体建模，其中其他智能体可能是合作队友（合作博弈视角）、敌对敌人（对抗博弈视角）和自身的孪生版本（元博弈视角）。


    # 4.2.1 对手建模简介


    +   1. 对手建模的基本内涵


    对手建模的相关研究由来已久，早期的一些工作主要采用博弈论框架进行，许多对手建模的方法受到博弈理论的启发而提出。博弈论是在现实世界竞争中人类行为模式的基石，研究理性参与者决策的相互作用及其均衡问题，使得个体通过'
  merge: -1
  img_proc: true
- pgno: 108
  md: '过竞争与合作实现自身利益最大化。在博弈论中，纳什均衡是博弈的最优解，可利用性衡量的是一个策略与纳什均衡策略之间的距离，其大小表征了纳什策略可利用性的强弱。建立对手模型的目的是使智能体能够适应对手并利用其弱点来提高决策能力，即使已知均衡解，利用准确的对手模型仍有可能获得更高的奖励。

    对手建模过程如图 4.1 所示，将可观测的历史数据作为输入，可以得到关于智能体某些属性的预测。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_108_0.png)


    图 4.1 对手建模过程


    # 2. 对手建模面临的挑战


    多智能体博弈对抗面临信息不完全、动作不确定、对抗空间大规模和多方博弈难求解等挑战，在博弈对抗过程中，每个智能体的策略随着时间在不断变化，因此每个智能体所感知到的转移概率分布和奖励函数也在发生变化，故其动作策略是非平稳的。


    根据智能体所处环境特性的不同，进行对手建模时所考虑的条件以及建模的方式也不同。现有的一些研究工作将其他智能体看成是环境的一部分，不考虑由智能体主体参与引起的非平稳，忽略其他智能体的影响，优化策略的同时假设了一个平稳的环境，将非平稳问题视为随机波动进行处理。在对手策略固定的情况下，将对手也视为平稳环境的一部分是一种有效的简化方法，然而，在对手策略是学习型缓慢变化或动态切换变化的情况下，需要充分考虑环境的非平稳性。在多智能体场景下，将智能体视为非平稳环境的一部分并不合理，因此，考虑环境的非平稳性，针对能够自主学习的对手，有必要进行对手建模，以预测对手的行为和评估对手的能力。非平稳问题主要采用在线学习、强化学习和博弈论理论进行建模。


    从环境可观测性和对手行为变化程度两个维度对对手建模方法进行分析，目前应对“对手”的主要方法分为五类[1]：①忽略，即假设平稳环境；②遗忘，即采用无模型方法，忘记过去的信息同时更新最新的观测；③目标对手最佳响应，即针对预定义对手进行优化；④学习对手模型，即采用基于模型的学习方法学习对手动作策略；⑤心智理论循环推理，即智能体与对手之间存在递归推理。博弈对抗环境根据可观测性按递增顺序分为局部奖励、对手动作、对手动作与奖励、完善先验知识四类。环境的部分可观察性给智能体学习带来了很大的不确定性，'
  merge: -1
  img_proc: true
- pgno: 109
  md: '如存在欺骗利用的环境中，有些奖励可能是虚假的。此外，在对抗交互中，对手也在不断地适应和学习，因此对手改变其行为的能力也是需要重要考虑的方面，按其行为变化剧烈程度由低到高分为固定策略、缓慢改变、剧烈变化。不同的方法均对对手进行类似的假设，有些方法假设对手策略固定，那么在非平稳环境无法适用。面对拥有适应[2]、动态切换[3]的非平稳策略的对手[4]，对手建模已然成为智能体博弈对抗时必须拥有的能力，并结合集中式训练分散式执行、元学习、多智能体通信建模等为非平稳问题的处理提供了技术支撑[5]。由环境可观测性、对手行为变化程度和智能体应对对手的主要方法组成的博弈对抗空间复杂性如图
    4.2 所示。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_109_0.png)


    # 3. 对手建模方法的分类


    目前的大部分研究将对手建模方法分为隐式对手建模和显式对手建模。如图 4.3 所示，显式对手建模通常直接根据观测到的对手历史行为为数据进行推理优化，通过模型拟合对手行为策略，掌握对手意图，降低对手信息缺失带来的影响，并且对其他方法的适配兼容效果更好。隐式对手建模则直接将对手信息作为自身博弈模型的一部分处理对手信息缺失的问题，通过最大化智能体期望奖励的方式将对手的决策行为为隐式引进自身模型，构成隐式对手建模方法。显式对手建模提供了一种直接的方式来表示智能体的行为，但在没有一定先验知识的情况下，建立精确的模型需要大量的样本。对于不完美信息领域，对手信息的缺乏，使得显式对手建模难以实现。隐式对手建模则是编码智能体某些方面的行为特征，而不做出明确的预测。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/cabd2c20e917d014f37d4e65ac1e41e0_110_0.png)


    图 4.3 显式对手建模与隐式对手建模


    # 4.2.2 显式对手建模方法


    常用的显式对手建模方法分为计划行动意图识别方法、行为分类与类型推理方法、策略重构方法、概率推理方法[6]。


    # 1. 计划行动意图识别


    计划行动意图识别(plan activity and intention recognition, PAIR) [7]方法是一类典型符号主义的人工智能方法，主要采用层次化计划库或畴理论，预测对手的意图和可能的计划，丰富的计划库有助于识别复杂的行为模式。根据智能体之间的竞合关系，意图识别可以分为面向非对抗非合作的无关识别[8]和面向合作的有意识识别[9]。智能体有意通过隐式通信的方式将自己的行为告知其他合作队友，面向对抗的对抗识别[10]，智能体采用欺骗的方式防止敌对敌人识别。


    # 2. 行为分类与类型推理


    行为分类方法根据不同信息源，运用机器学习的方法学习选定模型的参数，根据预测模型的多种属性预测风格类别，然后将风格类别标签（如攻击型/中立型/防御型、松凶型/紧凶型/松弱型/紧弱型）分配给对手[11]。类型推理方法[12]是假设对手是几种已知类型中的一种，并使用在实时交互过程中获得的新观察来更新信念，其中对手“类型”有可能是“黑盒”。


    # 3. 策略重构


    策略重构方法通过建立模型对对手的行动做出明确的预测来重建对手的决策'
  merge: -1
  img_proc: true
- pgno: 111
  md: '过程。假设模型有固定的结构，可根据被观察对手的行为，预测其行为概率，学习满足条件的任意模型结构。这类方法包括有条件行为概率模型方法[13]、案例推理方法[14]、紧致模型表示方法[15]和效用重构方法[16]。


    # 4. 概率推理


    概率推理方法包括基于图模型的贝叶斯概率推理方法和对抗推理方法。基于图模型的贝叶斯概率推理方法[17]，使用各种图模型对对手的决策过程及偏好进行建模，预测对手的可能行为，采用图形化表示有助于提高计算效率，但无法扩展至序贯决策。对抗推理是一种认知推理方法，可用于意图识别与欺骗推理[18]。


    # 4.2.3 隐式对手建模方法


    通常显式对手建模主要试图通过观察对手在不同情况下的行为来推断对手的策略，通过为对手建立一个模型来实现。隐式对手建模[19]试图找到一个好的对抗策略而不需要直接识别对手。因此，与显式对手建模不同的是，并没有对对手的行动从当前状态中分离出来进行分析。另外，显式对手建模需要对手在线对局的数据进行模型的实时估计和策略制定，而隐式对手建模采用的方法是首先离线计算出若干策略组合，然后通过对对手的对局数据来评估这些策略组合的效用，从而避免了在线对手建模存在的计算量大、响应慢等问题。然而隐式对手建模也需要克服探索与利用之间的矛盾，虽然其在在线博弈之前已经预先准备好若干种不同对手模型的对抗策略，但在比赛中找到其中的最优策略需要花费一定的代价，因此平衡探索与利用之间的矛盾，即何时开始与停止探索寻优是隐式对手建模方法中最大的问题。总体来看，隐式对手建模方法是一类策略表征学习方法。


    +   1. 强化学习


    基于深度值网络的深度强化学习对手网络方法[20]包含一个预测状态值的策略学习模块和一个推断对手策略的对手学习模块，根据过去的观察隐式地预测对手的属性，在此基础上还使用了混合专家网络改进值估计的方法。深度策略推理方法和引入循环神经网络的深度循环策略推理方法[21]，通过制定辅助手段来额外学习这些策略特征，直接从其他智能体的原始观察中进行学习。


    +   2. 元学习


    基于元学习的隐式对手建模方法主要通过与对手进行有限的交互，生成对手用于训练，从而获得利用不同对手的能力。Wu 等[22]设计的学会割削框架采用元学习的方法进行隐式对手建模，提出了一个多样性正则化的策略生成算法，可以自动'
  merge: -1
  img_proc: true
- pgno: 112
  md: '产生难被利用的和多样化的对手，提高了算法的鲁棒性和泛化能力。AI-Shedival 等[23]提出了一种模型无关的连续自适应对手的元学习方法。针对多智能体的情况，Kim
    等[24]设计了一种多智能体策略梯度优化元学习方法。


    # 3. 在线学习


    在线对抗过程中，通常一开始很难进行对手建模，对抗过程中对手可能会随机切换风格，导致建立的单个对手模型不确定性很高。当前面向在线对抗的隐式对手建模方法主要分两种：一种是多臂机组合在线凸优化方法，其主要利用已经获得的对手模型信息进行在线动态对手建模与优化[25]；另一种是在线无悔学习方法，其将在线序贯决策过程构建成在线/对抗马尔可夫决策过程模型[26]，通过采样生成多个策略，采用多臂机在线凸优化控制动态后悔值[27]。


    # 4.3 面向即时策略类对抗的对抗规划


    规划是指决定行动序列以完成给定目标的过程。根据目标的不同，规划可以分为三类：①对抗规划[28]，规划的目标是攻击和摧毁敌人，并阻止敌人实现其目标；②中立规划，规划的目标并不影响其他规划的目标，或者影响可以被忽略；③友好规划，规划的目标是提升环境状态或者帮助其他规划实现目标。对抗规划是即时策略博弈领域的挑战性问题，在线博弈对抗过程中，智能体面临不确定性威胁环境和非平稳性对手，它需要在有限时间内根据博弈对抗态势推理对方的行动，在具有巨大的状态空间和动作空间中快速做出己方行动规划。规划领域的主流研究集中在单个智能体的中立规划任务，并不考虑对抗性的存在；实际中很多领域都有对抗性的存在，对手会积极主动地阻断我方完成目标，同时试图完成自身的目标，而这些目标往往是针锋相对和冲突的。除了对手之外，由于实时条件和隐藏信息约束的存在，规划过程变得更加复杂。对抗规划可划分为两个相互影响的部分，即对抗推理和反制规划，主要表示在一个对抗环境中一方通过计算求解对手的确定性状态、意图和行为，制定反制计划的动态规划过程。当前即时策略博弈中在线对抗规划方法的研究主要可分为战术对抗规划、策略对抗规划和混合对抗规划。


    # 4.3.1 战术对抗规划


    +   1. 极大极小树搜索


    极大极小树搜索算法通过将敌我双方的行为都以树状结构进行表示，枚举每'
