  md: '与完美信息博弈中的子博弈求解技术不同，在不完美信息博弈中的子博弈求解方面存在一个主要挑战：一个玩家在子博弈中的最优策略可能依赖博弈其他部分的策略和结果。因此，不能只用子博弈的信息来解决子博弈。现有的使用实时子博弈求解方案需要假定对手按照蓝图策略进行博弈来解决这个问题。然而，对手可以通过简单地切换到不同的策略来利用这个基本假设。所以，该技术也被称为“不安全”的子博弈求解。不安全的子博弈求解缺乏理论上的求解质量保证，而且在许多情况下，效果不佳。因为不安全子博弈求解技术无法确保得到策略的可利用性一定比蓝图策略低。Libratus
    利用安全子博弈求解技术确保了策略的可利用性不高于蓝图策略，保证了无论对手使用何种策略，Libratus 都能通过确保子博弈策略符合原始抽象的蓝图策略来实现这一点。③自我改进提升模块，随着时间的推移不断改进蓝图策略，利用所发现的对手策略中的潜在漏洞部分，计算出更接近纳什均衡的策略。


    2018 年，Brown 等[22]提出了一种在非完美信息博弈中进行有限深度优先搜索的方法，允许对手在有限深度下为其余部分选择多种策略，并仅使用普通笔记本电脑上的计算资源（4
    核的 CPU 和 16GB 内存）生成大师级的两人无限注德州扑克 AI “轻元”（Modicum），并击败了两个以前版本的顶级德州扑克 AI。


    2019 年 2 月，Brown 等[23]又提出了基于神经网络的 CFR 变体，即 DCFR，用神经网络拟合累计后悔值和平均策略，打破表格式 CFR 的局限性，为大规模非完美信息动态博弈提供了新的解决思路。


    2019 年 7 月，Brown 在 Science 上发表的多人德州扑克最新研究成果备受瞩目——多人无限注德州扑克 AI “聚联”（Pluribus）[24]在六人无限注德州扑克中战胜了人类职业选手。该算法的核心是采用自博弈方法不断学习和调整策略，并提高胜率，类似于
    AlphaGo Zero，不需要任何的人类先验知识。Pluribus 的系统是在 Libratus 的基础上改进的。但与 Libratus 不同的是：①Pluribus
    为多人扑克开发一个超人的人工智能是这一领域公认的里程碑。但 Pluribus 的目标不是一个具体的博弈论解概念，而是从实验层面解决多人扑克问题。从另一方面看，Pluribus
    的成功表明，尽管它在对多人博弈中缺乏已知的强有力的理论保证，但在非完美信息下的、大规模的、复杂的多人博弈环境中，通过精心构造自博弈搜索算法仍然可以产生超越人类的策略。②Pluribus
    采用了一个新的在线搜索算法，可以通过搜索前面的几个博弈步骤，来评估自己下一步可选的策略。在许多完美的信息博弈中，包括双陆棋、国际象棋和围棋，实时搜索对于获得超过人类的性能是必不可少的。因此，Pluribus
    在与对手的实际比赛中，采取了非完美信息博弈中的深度限制搜索，通过实时搜索在比赛中发现更好策略。将自博弈形式与搜索形式相结合，已经在完全信息下的两人零和博弈中取得了令人瞩目的成功。③Pluribus
    还拥有比 Libratus 更快的自我博弈算法。在线搜索算法和自我博弈算法的更新与'
