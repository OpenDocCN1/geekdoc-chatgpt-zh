    # 4. 桥牌


    桥牌 (图 1.12) 桥弈对抗分为叫牌阶段和打牌阶段。其技术水平主要体现在叫牌 (叫到最准确的定约) 和打牌的准确性上 (对牌分布的判断以及在给定判断下的最佳打法)。由于桥牌有相对繁复的博弈规则，而逐渐成为人工智能研究者跃跃欲试的对象。桥牌是混合条件下的多人不完全信息博弈，其最大特点是在竞争与合作的混合条件下，敌方与友方的信息都是部分可观的，不仅不知道对手的牌，也不知道对家
    (友方) 的牌。桥牌的难点在于 “信息” 的传递和对 “行为” 的分析，拥有更多的 “社会性”，更像是在对抗环境下寻求与敌友合作一起对抗敌方。


    1997 年，Bridge Baron 赢得了第一届世界计算机桥牌大赛。1998 年，该比赛的冠军被俄勒冈大学开发的 GIB[15] 获得，该 AI 被邀请参加了世界桥牌大赛，最终在
    35 位参赛者中获得了第 12 名的成绩。在之后的十多年里，基于蒙特卡罗方法的人工智能程序 Jack[16] 和 WBridge5[17] 轮番取得了该比赛的冠军。2015
