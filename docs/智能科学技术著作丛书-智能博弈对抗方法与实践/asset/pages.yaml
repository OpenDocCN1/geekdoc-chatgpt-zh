    Morares 等[45]发现了 PGS 方法中的不一致问题，由于在快速推理中依赖脚本化的对手模型，可能无法返回可能的最佳动作，他们提出了一种嵌套贪婪搜索(nest
    greedy search, NGS)方法，其工作方式与 PGS 方法相同，不同之处在于 NGS 方法处理对手建模的方式。NGS 方法贪婪地寻找对手对每个单位/动作组合的最佳反应，并计算针对该反应的最佳动作。


