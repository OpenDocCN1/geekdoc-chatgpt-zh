  md: '节将通过对比三个不同的概念，突出本书所研究的智能博弈对抗问题的特性。


    # 1. 计算机博弈


    相对于真实世界问题，游戏世界的问题更易于形式化表达，因此便于进行相关人工智能技术的研究。DeepMind 公司创始人 Hassabis 曾言：“游戏是测试人工智能的完美平台。”计算机博弈译自英文
    “computer games”，也称机器博弈[1]，起初的计算机博弈研究只包括棋牌类游戏，从事计算机棋牌竞技研究的学者最早将计算机博弈定义为让计算机能够像人一样思考和决策，能够自主下棋或出牌。近年来的一些视频游戏、即时策略游戏的研究也被纳入计算机博弈的范畴。计算机博弈是人工智能领域的一个重要研究方向，被誉为人工智能学科的“果蝇”[2]，是开展机器智能、兵棋推演、智能决策系统等人工智能领域课题研究的重要科研基础，近年来已经取得了长足的进步。计算机博弈通过人工智能程序的博弈对抗过程来理解智能的实质，是认知对抗决策智能的前沿研究着力点，是研究人类思维和实现机器思维最好的实验载体。近年来，人们对计算机博弈的研究衍生了大量的研究成果，这些成果（图
    1.1）在人工智能领域产生了广泛的影响。


    计算机博弈技术的研究早期开始于跳棋，然后到国际象棋，在初期的探索中都取得了一定的成果。1982 年，日本开始了为期 10 年的“第五代计算机的研制计划”，即“知识信息处理计算机系统”，总共投资
    4.5 亿美元，推动了世界各国的追赶浪潮。然而，这些大型计划执行到 20 世纪 80 年代中期就开始面临重重困难，人工智能的一些根本性问题很难得到解决。于是人们转向了人工智能基础问题的研究。1997
    年，人工智能在棋类研究中发生了一件具有标志性意义的事件——国际商业机器公司 (International Business Machines Corporation,
    IBM) 的“深蓝”在国际象棋中战胜了世界冠军。之后，人工智能持续推进。2016 年，基于深度学习技术的 AlphaGo 在围棋比赛中正式战胜了人类冠军。2017
    年，一对一无限注德州扑克中的 DeepStack、Libratus 等人工智能程序在对战中完胜人类高手。与围棋不同，德州扑克体现了“非完整信息博弈”的场景，这些技术对于处理真实场景中的“战争迷雾”具有十分重要的意义。2019
    年，由卡内基梅隆大学开发的德州扑克 AI Pluribus 在多人德州扑克比赛中获胜，相关研究成果发表在 Science 杂志上，虽然在技术上解决了多人德州扑克对应的决策问题，但理论上缺乏证明。之后，《星际争霸》和麻将等即时策略游戏
    AI 相继出现，不断战胜人类玩家，计算机博弈研究成果丰硕。


    # 2. 人机对抗


    人机对抗[3]是指在强对抗博弈环境中，研究和探寻机器博弈问题中人工智能程序战胜人类玩家的方法。人机对抗 (图 1.2) 是人工智能的炼金石，从图灵测试开始，'
