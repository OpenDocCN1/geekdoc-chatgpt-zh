    \(Q^*(s) = \sum_{s'', \tau} P(s'', \tau | s, a) [R(s'', \tau | s, a) + \gamma^\tau
    V^*(s'')]\) (3.22)


    其中，\(V^*(s'') = Q^* \max_{a''} (s'', a'')\) 。


    SMDP 模型下的分层策略为处理大时间尺度下的规划提供了更合理的方式。例如，人类做长远规划时，不会且没有必要考虑每一秒钟应该执行的动作，而是只规划好几个阶段——也就是分层策略中的子任务，每个阶段可以具有不同的时间，并且每个阶段内的子策略也可能相对独立，如图
