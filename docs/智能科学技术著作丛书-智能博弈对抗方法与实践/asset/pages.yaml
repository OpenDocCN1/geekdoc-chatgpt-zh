    | | CE-Q[66] | 基于相关均衡的值函数学习 |

    | | Asymmetric-Q[67] | 非对称值函数学习 |

    | | FFQ[68] | 区分敌和友的值函数学习 |

    | | WoLF[53] | 取胜或快乐式变学习率学习 |

    | | IGA[69] | 无穷小梯度上升 |

