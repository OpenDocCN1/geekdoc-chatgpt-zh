  md: '智能体是懒惰的，当一个智能体学习了有用的策略，不鼓励第二个智能体学习时，就会发生这种情况，因为其探索会阻碍第一个智能体并导致较差的团队奖励。


    假设 \( Q((h^1, h^2, \cdots, h^d),(a^1, a^2, \cdots, a^d)) \) 是多智能体团队的整体 Q 函数。其中，\(
    d \) 是智能体个数，\( h^i \) 是智能体 \( i \) 的历史序列信息，\( a^i \) 是其动作。该 \( Q \) 函数的输入集中了所有智能体的观测和动作，可通过团队奖励
    \( r \) 来迭代拟合。为了得到各个智能体的值函数，做出如下假设：


    \( Q(h^1, h^2, \cdots, h^d), (a^1, a^2, \cdots, a^d)) \approx \sum_{i=1}^d \tilde{Q}_i(h^i,
    a^i) \) (5.3)


    该假设表明团队的 Q 函数可以通过求和的方式近似分解成 d 个 Q 子函数，分别对应 d 个不同的智能体，且每个 Q 子函数的输入为该对应智能体的局部观测序列和动作，互相不受影响，如图
    5.4 所示。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_143_0.png)


    图 5.4 独立强化学习与 VDN 算法对比


    这样，每个智能体就有了自己的值函数，那么就可以根据自己的局部值函数来进行决策：


    \( a^i = \arg \max_{a''^i} \tilde{Q}_i(h^i, a''^i) \) (5.4)


    这里的 \( \tilde{Q}_i(h^i, a''^i) \) 并不是任何严格意义上的 \( Q \) 函数。因为并没有理论依据表明一定存在一个奖励函数，使得该
    \( \tilde{Q}_i \) 满足贝尔曼方程。


    为了减少训练参数同时避免懒惰智能体的出现，将智能体的参数进行共享，给出了 “智能体不变性” 的定义。


    定义 5.1 (智能体不变性) 对智能体序号的任意排列 \( p: \{1, \cdots, d\} \rightarrow \{1, \cdots, d\}
    \)，有 \( \pi(p(\bar{h})) = p(\pi(\bar{h})) \) 成立，称 \( \pi \) 具有智能体不变性。'
