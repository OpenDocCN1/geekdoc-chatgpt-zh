  md: '对于所有的 $a \in A(I)$，定义 $\sigma|_{I \to a}$ 为除了在信息集 $I$ 上总是选择动作 $a$ 以外，其余与 $\sigma$
    完全相同的策略，则即时反事实后悔值（immediate counterfactual regret）为


    $$ R_{i,imm}^T(I) = \frac{1}{T} \max_{a \in A(I)} \sum_{t=1}^T \pi_{-i}^{\sigma^t}(I)
    \left[ u_i(\sigma^t|_{I \to a}, I) - u_i(\sigma^t, I) \right] \quad (6.5) $$


    直观上，这是玩家 $i$ 在信息集 $I$ 上所做决策的后悔值，由动作 $a$ 的反事实效益值与信息集 $I$ 的反事实效益值之间的差值，再乘上一个表示玩家
    $i$ 试图到达信息集 $I$ 的反事实概率作为加权项。


    寻找博弈中近似纳什均衡的关键点就是如何最小化每个信息集上的即时反事实后悔值。即时反事实后悔值的关键特征是可以通过仅控制 $\sigma_i(I)$ 来进行最小化，对于所有的
    $I \in L_i$ 和 $a \in A(I)$ 有


    $$ R_i^T(I, a) = \frac{1}{T} \sum_{t=1}^T \pi_{-i}^{\sigma^t}(I) \left[ u_i(\sigma^t|_{I
    \to a}, I) - u_i(\sigma^t, I) \right] \quad (6.6) $$


    然后，有 $T+1$ 轮的策略为


    $$ \sigma_i^{T+1}(a) = \begin{cases} \frac{R_i^{T,+}(I, a)}{\sum_{a \in A(I)}
    R_i^{T,+}(I, a)}, & \sum_{a \in A(I)} R_i^{T,+}(I, a) > 0 \\ \frac{1}{|A(I)|},
    & \text{其他} \end{cases} \quad (6.7) $$


    式 (6.7) 揭示了反事实后悔值与更新下一轮策略中的动作概率分布之间的关系，即每种动作被选择的概率与其在过去已经进行的多轮博弈中没被选择而产生的累加的正后悔值成正比，若不存在正后悔值，则给每个动作分配均等的概率。


    CFR 算法在现有条件下只能解决 $10^{12}$ 规模的博弈问题，局限在于玩家 $i$ 根据式 (6.7) 选择动作，则即时后悔值的上界为


    $$ R_{i,imm}^T(I) \leqslant \Delta_{i,u} \sqrt{|A_i|} / \sqrt{T} \quad (6.8) $$


    从而有


    $$ R_i^T(I) \leqslant \Delta_{i,u} |L_i| \sqrt{|A_i|} / \sqrt{T} \quad (6.9) $$


    其中， $|A_i| = \max_{h:p(h)=i} |A(h)|$ 。


    这一结果表明，平均整体后悔值的上界与信息集的数量呈线性关系，CFR 算法'
