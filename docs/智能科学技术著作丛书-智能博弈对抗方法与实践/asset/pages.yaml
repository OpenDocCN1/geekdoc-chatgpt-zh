  md: '策略的强化学习方法不仅避免了由值函数错误引起的策略退化，而且更容易应用于连续动作空间问题。具体来说，基于值函数的方法，如 Q 学习和 SARSA，需要一步操作来计算最大值，这在连续空间或高维空间中很难找到。此外，基于值函数的方法学习隐式策略，但基于策略梯度的方法可以学习随机策略，也就是说，在基于值函数的方法中，通过策略改进获得的策略都是确定性策略，并且会遇到一些任务中无法解决的问题。基于策略梯度的方法也有一些共同的缺点：数据效率或样本利用率低，方差大，难以收敛。


    # 3. 基于 Actor-Critic 的方法


    基于 Actor-Critic 的方法可以克服基于策略梯度方法的常见缺点，基于 Actor-Critic 的方法可以同时学习策略和状态值函数。状态值函数用于引导，即从后续估计中更新状态，以减少方差并加速学习。然而，将基于
    Actor-Critic 的方法简单而有效的设计稳定地应用于连续和离散动作空间一直是强化学习领域的一个长期障碍。通过扩展 DQN 和确定性策略梯度(deterministic
    policy gradient, DPG)，DDPG 方法可以使用基于相同超参数和网络结构的低维观测来学习任务的竞争策略。此外，双延迟 DDPG 方法作为一种确定性方法，比
    DDPG 有显著的改进。然而，DDPG 的策略是确定性的，它特别不适合用于带有噪声干扰的复杂环境，因为该策略通常需要随机执行。另一个问题是，许多常用的无模型强化学习方法，如信任区域策略优化(trust
    region policy optimization, TRPO)方法、近端策略优化(proximal policy optimization, PPO)方法或
    A3C 方法，每个梯度步骤需要大量新的样本。由于这一严格的要求，样本效率非常低，而且随着任务复杂性的增加，情况会变得更糟。SAC 是解决这些问题的有效方法，该方法结合了异策略更新与一个稳定的随机
    Actor-Critic 公式，并使用一个最大熵框架来增强标准的最大奖励强化学习目标。基于最大熵的强化学习方法具有几个特殊的优点，因此比异策略和异策略优先方法在性能和采样效率上有了实质性的改进：用于更复杂的特定任务的初始化，最大熵学习的策略可以作为更复杂的特定任务的初始化，并学习解决任务的方法；更强的探索能力，很明显，最大熵使得在多模态奖励下更容易找到更好的模式；较高的鲁棒性和更强的泛化性，最大熵需要从不同的方式探索各种最佳的可能性，并使其在面对干扰时更容易调整。


