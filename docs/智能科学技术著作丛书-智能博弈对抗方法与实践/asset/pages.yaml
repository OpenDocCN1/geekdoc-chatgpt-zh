    2011 年被中止。


    # 2. 指挥官虚拟参谋


    美陆军着手打造的智能助手重要项目 CVS[20]是继“深绿”后美军发展指挥控制智能化的又一重要举措。CVS 借鉴 Siri、Watson 等产品理念，扮演类似参谋或助手的角色，旨在综合应用认知计算、人工智能和计算机自动化等智能化技术，来应对海量数据源及复杂的战场态势，提供主动建议、高级分析及针对个人需求和偏好量身剪裁的自然人机交互，从而为陆军指挥官及其参谋制定战术决策提供从规划、准备、执行到行动回顾，全过程的决策支持。


    # 3. “阿尔法”与“狗斗”


    2015 年，美国辛辛那提大学和空军实验室合作研发了一款智能空战人工智能程序“阿尔法”（图 1.13）[21]，在空战仿真环境中战胜人类退役的飞行员。在模拟多机空战中，机器(红方)控制
    4 架战斗机，与 2 名人类飞行员(蓝方)分别控制的 2 架战斗机之间进行对抗，获得了全胜。蓝方有预警机支持，且在导弹性能和数量上占优。红方则凭借巧妙配合和超过人类
    250 倍的反应速度反败为胜。对战中，蓝方施展出了钳形攻击等战术配合，以及在躲避红方导弹的同时抢占有利阵位的技巧。“阿尔法”可以通过类人的模糊逻辑思维，生成超视距空战中主动攻击、机动规避等攻防态势下的飞机航路规划、导弹攻击、武器选择等战术策略。“阿尔法”可以视为战术编队指挥控制，相对简单。但和围棋相比，战斗机控制起来要复杂得多，实时性要求也高得多。项目团队经过多年研究，尝试了众多方法，迭代了很多版本之后才达到这样的水平，虽然对于实用还有较大距离，但为指挥控制


