    # 3. 信息集下动作数量


    根据 Ganzfried[1]给出的方法来计算，信息集下动作的数量为 \(3.598 \times 10^{13}\)，规模庞大。即使使用目前先进的均衡求解算法，即
    CFR 算法，每个信息集下的动作采用双精度浮点型存储，也需要约 500TB 随机存取存储器（random access memory, RAM）用于存储行为策略。针对两人无限注德州扑克的状态数、信息集数和信息集下动作数规模庞大的问题，本章将在
    6.2.3 节中介绍基于抽象的 CFR 算法，压缩博弈问题规模，求解博弈问题的近似纳什均衡解。


    # 6.2.3 关键技术分析


    # 1. 博弈抽象方法


    与完全信息博弈不同，非完美信息博弈难以分解为可独立求解的子博弈问题，因为非完美信息博弈分解得到的子博弈的最优策略可能依赖其他子博弈的策略与输出。德州扑克状态空间过于庞大，无法遍历所有的状态以寻求最优解。通常采用抽象的方法，对此类状态空间庞大的博弈进行求解。对于非完美信息博弈领域问题的求解，通常将问题抽象简化为一个相对简单的问题，得到一个简化解，之后通过增加约束，逐渐逼近完全信息博弈所对应抽象问题的解。目前，现有的比赛扑克
    AI 往往使用抽象算法，生成更小的博弈，之后使用自定义均衡搜索算法来解决抽象出后的博弈问题。针对德州扑克，由于其状态空间过于庞大，不可能通过遍历所有的状态求最优解。为此，通过抽象的方法对德州扑克的博弈模型进行简化求解。通常简化求解过程分为以下三步[2]，如图
    6.3 所示。


    +   (1) 在保留原始模型策略结构的前提下，将其抽象为较小的博弈模型。'
