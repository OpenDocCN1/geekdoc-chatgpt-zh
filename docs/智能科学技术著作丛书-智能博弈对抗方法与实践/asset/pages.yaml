- pgno: 52
  md: '# 2.5.1 离线博弈策略学习方法


    # 1. 随机博弈策略学习方法


    当前，直接面向博弈均衡的学习方法主要为一类基于值函数的策略学习。根据博弈类型（合作博弈、零和博弈和一般和博弈）的不同均衡学习方法主要分为三大类，如表 2.4
    所示。其中，团队 Q (Team-Q) 学习[57]是一种直接学习联合策略的方法；分布式 Q (Distributed-Q) 学习[61]采用乐观方式单调更新本地策略，可收敛到最优联合策略；联合动作学习
    (joint action learner, JAL) [62]方法通过将强化学习与均衡学习方法相结合来学习自己的动作与其他智能体的动作值函数；最优自适应学习
    (optimal adaptive learning, OAL) [63]是一种最优自适应学习方法，通过构建弱非循环博弈 (week acyclic game)
    来学习博弈结构，消除所有次优联合动作，被证明可以收敛至最优联合策略；分散式 Q (Decentralized-Q) 学习[64]是一类基于 OAL 的非中心化方法，被证明可渐近收敛至最优联合策略。极小极大
    Q 学习 (Minimax-Q) 方法[57]应用于两人零和随机博弈。纳什 Q (Nash Q) 学习方法[65]将 Minimax-Q 方法从零和博弈扩展到多人一般和博弈；相关均衡
    Q (CE-Q) 学习[66]是一类围绕相关均衡的多智能体 Q 学习方法；非对称 Q (Asymmetric-Q) 学习[67]是一类围绕斯塔克尔伯格均衡的多智能体
    Q 学习方法；敌-友 Q (friend-or-foe Q, FFQ) 学习方法[68]将其他所有智能体分为两组，一组为朋友，可帮助一起最大化奖励，另一组为敌人，试图降低奖励；取胜或快学
    (win or learn fast, WoLF) 方法[53]通过设置有利和不利两种情况下的策略更新步长学习最优策略。此外这类方法还有无穷小梯度上升 (infinitesimal
    gradient ascent, IGA) [69]、通用无穷小梯度上升 (generalized infinitesimal gradient ascent,
    GIGA) [70]、平衡适变或转向均衡 (adapt when everybody is stationary, otherwise move to equilibrium,
    AWESOME) [71]等。


    # 表 2.4 随机博弈均衡学习方法


    | 博弈类型 | 方法示例 | 特点 |

    |---|---|---|

    | 合作博弈 | Team-Q[57] | 团队联合值函数学习 |

    | | Distributed-Q[61] | 分布式值函数学习 |

    | | JAL[62] | 联合动作学习 |

    | | OAL[63] | 最优自适应学习 |

    | | Decentralized-Q[64] | 分散式值函数学习 |

    | 零和博弈 | Minimax-Q[57] | 极小极大式值函数学习 |'
