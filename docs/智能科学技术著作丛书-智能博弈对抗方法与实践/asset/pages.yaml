  md: '之前描述的策略迭代方法和值迭代方法都需要对整个状态集进行遍历，当状态集非常大时，代价是十分昂贵的。而异步动态规划方法不需要系统遍历状态集，它通过原地备份操作进行迭代。它是值迭代方法的一个简单改进版本。


    异步迭代方法具有更灵活的状态值更新选择，它可以以任意顺序来更新状态值，例如，可以优先更新那些还没有收敛的状态空间区域，或者在某些状态值更新前，另一些状态值已经更新多次。但是，为了正确收敛，任何一个状态都不能被忽略。


    # 3. 蒙特卡罗树搜索


    MCTS[1]在蒙特卡罗仿真的基础上结合最优优先搜索，解决最优决策问题。MCTS 的核心思想是通过累计蒙特卡罗仿真的价值估计来评估搜索树上的状态节点，并不断扩展具有较高评估值的节点。MCTS
    结合了树搜索的准确性和随机抽样的普遍性，在 MDP 在线规划领域取得了重大的成功。


    基本的 MCTS 方法包括在预先设置的计算资源内（一般指迭代次数或者运行时间）迭代地构建一棵非对称的搜索树，然后停止搜索并返回根节点上的最优动作。搜索树中的每个节点表示状态，指向子节点的定向链接表示导致后续状态的动作。


    对于每次方法迭代，MCTS 主要执行四个步骤。


    +   (1) 选择。从根节点开始，递归运用子节点选择策略（不同的实现方法具有不同的选择规则），直到到达最紧急的可扩展节点。如果一个节点表示非终止状态并且具有未访问（即未扩展）的子节点，则该节点是可扩展的。


    +   (2) 扩展。根据当前节点可用动作集，添加一个（或多个）子节点扩展搜索树。


    +   (3) 仿真。从新节点开始，运行默认的仿真策略，最简单的是随机策略，直到结束，产生仿真结果。


    +   (4) 回溯。通过反向传播更新路径上每个节点的统计信息，用以将来的策略决策。


    MCTS 主要包括两个不同的策略，即树策略和默认策略。


    +   (1)树策略。从搜索树中已经包含的节点中选择或创建叶节点，也就是节点选择和扩展策略[2]。


    +   (2)默认策略。从一个给定的非终止状态开始预演生成价值估计，也就是仿真策略。


    MCTS 的成功主要取决于树策略，上置信区间树 (upper confidence bound for trees, UCT) 搜索方法采用 UCB1 作为树策略，用以平衡探索和利用，是目前最著名的
    MCTS 实现方法之一[3]。在 UCT 搜索方法中，将每个子节点的选择看成多臂赌博机 (multi-armed bandit, MAB) 问题，子节点的值是蒙特卡罗仿真得到的近似'
