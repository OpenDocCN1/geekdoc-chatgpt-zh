  md: '信。其原因一是对数据缺乏信任可能导致决策不及时，或在需要决策时无法做出决策，二是当获取的数据不可信时，可能导致错误的决策进而造成不可估量的损失。美国陆军于
    2021 年开发出深度伪造检测技术 DefakeHop[17]，大幅领先业界先进水平，解决了数个面部生物识别难题，基于此的 Geo-DefakeHop 技术[18]，被用于地理空间目标数据伪造图像检测。


    随着科技的不断发展，智能化和信息化程度也越来越高，各种侦察装备与方法也不断改进。深度伪造技术已经发展为包括视频伪造、声音伪造、文本伪造和微表情合成等多模态视频欺骗技术，由最初的操纵单模态媒体(包括音频、图像、视频和文本)向操纵多模态媒体转变。与此同时，军用欺骗技术随着科技发展也不断提高，军用迷彩设计的水平不断改进，迷彩伪装效果日益增强。目标分析人员对大量目标数据进行快速准确的分析，有利于指挥员做出正确决策，然而，对抗环境下，大量目标数据中可能存在多种欺骗，多种模态数据以及真假目标掺杂在一起，都给目标分析人员进行大量目标数据分析带来了一定的挑战。


    # 2. 欺骗基本形态


    《孙子兵法》曰：“兵者，诡道也。”其中诡道十二法，即“故能而示之不能，用而示之不用，近而示之远……”。可以看出，军事斗争中诡诈是一种常见的方式，目的是通过多种欺骗方法，干扰敌方的认知，使敌方在获取错误的信息后做出错误的决策，使战场态势朝着有利于己方的方向发展。《现代汉语词典》中，对欺骗的解释为：用虚假的言语或行动来掩盖事实真相，使人上当。Bell[19]认为“欺骗是一种错误认知”，Barton[20]给出了一个通用的欺骗理论，将欺骗定义为为了追求利益而故意扭曲目标的感知，或者更简单地说，对感知现实的扭曲。所有的欺骗都是“隐真”或“示假”的某种组合。


    军事对抗既是孕育欺骗的温床，又是欺骗施展身手的舞台。在对抗中，任何一方要达到自己的目的，都需要人为地制造出许多假象，以掩盖真实的意图。军事上的欺骗自古有之，如“明修栈道，暗度陈仓”、美国的“星球大战”计划等。示形、用佯、诡诈、诳骗之类的活动贯穿于对抗的全过程，使诡道逻辑成为对抗普遍适用的法则。典型的天基、空基地面目标信息分析中，欺骗目标分析不管是对人眼、信息采样设备，还是人工智能程序都充满挑战，典型欺骗目标检测过程及效果如图
    10.1 所示。


    其实，欺骗策略在军事、经济、网络安全等诸多领域都有研究，可以分为信息对抗和策略对抗两个层面。典型的信息对抗，如电磁信号欺骗与反欺骗，涉及雷达与雷达对抗等专业，体现在空地对抗等不同的作战样式中。典型的策略对抗，如网络安全中的主动欺骗防御，相比被动的攻击侦测，主动的蜜罐欺骗防御策略明显具有更高的防御效能。Heckman
    等[21]根据欺骗的对象(事实与谎言)，将网络'
