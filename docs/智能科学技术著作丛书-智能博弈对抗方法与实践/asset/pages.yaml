    DeltaDou 是首个达到人类玩家专家水平的斗地主 AI，算法主要基于自博弈蒙特卡罗树搜索 (fictitious self-play MCTS, FPMCTS)
    和贝叶斯推理。


    1) 自博弈蒙特卡罗树搜索


    FPMCTS 在选择动作上使用策略：


    ```

    \(\pi_{tree}(u^i) = \arg \max_{a \in A(u^i)} \left[ Q(u^i, a) + \pi^i(u^i, a)
    \sqrt{\frac{\ln N(u^i)}{1 + N(u^i, a)}} \right]\) (7.1)

    ```


    其中，\( A(u^i) \) 是 \( u^i \) 处采取的动作集合；\( Q(u^i, a) \) 是策略 \( Q \) 值；\( N(u^i) \)
    是 \( u^i \) 被访问的次数；\( N(u^i, a) \) 是动作 \( a \) 被执行的次数。节点的价值用函数 \( v^j \) 估计。


