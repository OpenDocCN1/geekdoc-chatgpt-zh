    # 图 7.10 桥牌叫牌 Q 网络框架


    其他 Q 网络与第一个 Q 网络相比，其他叫牌方有一个额外的 36 维手牌数据显示了双方的叫品历史。两个参与者中任何一个的出价值为 1，其他的为 0。Q 网络的损失函数是基于非线性
    Q 函数定义的。


    探索是强化学习达到最优化的关键因素之一。其中如何平衡探索与利用是一个难题。这里将桥牌叫牌问题与上下文赌博机 (contextual bandit) 问题联系起来。假设每一个可能的叫牌都是一个赌博机，上下文是一个人手中的牌和之前的叫牌。每次叫品的奖励由贯穿贝尔曼方程
    (penetrative Bellman''s equation) 计算，即


    ```

    Q^{(i)*}(s, a)=Q^{(i+t)*}(s^{*(t)}, a^{*(t)}|s, a)

    ```


    其中，\( s^{*(t)} \) 和 \( a^{*(t)} \) 表示给定 \( s^{*(t-1)} \) 和 \( a^{*(t-1)} \) 下最可能的动作。通常情况下，两名玩家之间的桥牌叫牌游戏中叫品次数少于
    6，因此贯穿贝尔曼方程相对于原始变量来说是相当有效的，而每个动作的成本更准确。


    然而，在动作价值方面可能存在不确定性，特别是对于很少使用的叫品。常见的上下文赌博机算法，如上界置信 (upper confidence bound, UCB)
    算法，使用不确定项来平衡探索与利用问题。这里使用 UCB 的变体 UCB1[9]选择动作，如式 (7.9) 所示：


    ```

    a^{(t)} = \max_{a(t)} \left[ Q(s^{(t)}, a^{(t)}; \theta) + \alpha \sqrt{\frac{2
    \ln T}{T_a}} \right]

    ```'
