    # 2.4 多智能体博弈学习框架


    博弈论可用于多智能体之间的策略交互建模，近年来，基于博弈论的学习方法被广泛嵌入多智能体的相关研究中，多智能体博弈学习已然成为当前一种新的研究范式。Matignon
    等[23]对合作马尔可夫博弈的独立强化学习方法做了综述分析。Nowé 等[24]从无状态博弈、合作马尔可夫博弈和一般马尔可夫博弈三类场景对多智能体独立学习和联合学习方法进行了分类总结。Lu
    等[25]从强化学习和博弈论的整体视角出发对多智能体博弈的解概念、虚拟自对弈 (fictitious self-play, FSP) 类方法和反事实后悔值
    (counterfactual regret, CFR) 类方法进行了全面综述分析。Yang 等[26]对同等利益博弈、零和博弈、一般和博弈和平均场博弈中的学习方法进行了分类总结。Bloembergen
    等[27]利用演化博弈学习方法分析了各类多智能体强化学习方法的博弈动态，并揭示了演化博弈论和多智能体强化学习方法之间的深刻联系。此外，Wong 等[28]从多智能体深度强化学习面临的四大挑战出发，指出未来需要研究深化学习等类人学习的方法。


    # 2.4.1 多智能体博弈基础模型及元博弈


    +   1. 多智能体博弈基础模型


    马尔可夫决策过程 (Markov decision process, MDP) 常用于人工智能领域单智能体决策过程建模。基于决策论的多智能体模型主要有分散式马尔可夫决策过程
    (decentralized MDP, Dec-MDP) 及多智能体马尔可夫决策过程 (multi-agent MDP, MMDP)[23]。其中 Dec-MDP
    模型中，每个智能体有独立的、关于世界状态的观察，智能体根据观察的局部信息选择动作；MMDP 模型中，不区分每个智能体可利用的、私有的信息和全局状态信息，而由系统统一制定出集中式的策略，再分配给每个智能体去执行。分散式部分可观马尔可夫决策过程
    (Dec-POMDP) 关注动作和观察中存在不确定性情况下多智能体的协调问题。Dec-POMDP 模型中智能体的决策是分散式的，每个智能体根据自身所获得的局部观察信息独立地做出决策。利用递归建模方法对其他智能体的行为进行显式的建模，Doshi
    等[29]提出的交互'
