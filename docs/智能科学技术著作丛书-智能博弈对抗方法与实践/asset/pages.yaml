  md: '# 9.3 元博弈：博弈的博弈理论


    # 9.3.1 元博弈理论


    根据决策者的偏好刻画，博弈论分析方法分为：①基于基数偏好（cardinal preference）的定量博弈，如正则式博弈、扩展式博弈、合作博弈等；②基于序数偏好（ordinal
    preference）的非定量博弈，如元博弈（偏对策、亚对策）、超博弈（超对策、误对策）、软博弈（软对策）等。其中元博弈即博弈的博弈。在人工智能领域，Pell[2]早在
    1993 年就提出运用元博弈方法设计对称的棋类（国际象棋、跳棋、中国象棋和日本将棋等）对抗 AI，元博弈是一种实证博弈理论分析工具[3]，围绕元博弈理论的博弈对抗策略学习框架，采用迭代式的策略学习方法（策略评估与策略提升）为多智能体博弈对抗策略的学习提供了通用训练途径[4]。元博弈可应用于博弈对抗策略选择[5]、博弈策略动态分析[6]和在线对手剥削[7]等领域。Tuyls
    等[6]证明了元博弈的纳什均衡是原始博弈的 2ε 纳什均衡，并利用 Hoeffding 给出了批处理单独采样和均匀采样两种情况下的均衡概率收敛的有效样本需求界。Viqueria
    等[8]利用 Hoeffding 界和 Rademacher 复杂性分析了元博弈，得出基于仿真学习到的博弈均衡以高概率保证是元博弈的近似均衡，同时元博弈的近似均衡是仿真博弈的近似均衡。Balduzzi
    等[9]研究提出任何一个泛函式博弈可以做直和分解成传递压制博弈和循环压制博弈两部分，如图 2.5 所示。此外，通过分析 40 个智能体种群的博弈对抗策略空间，如图
    9.3 所示，根据元博弈收益矩阵及其舒尔（Shur）分解的前两维投影可知，近乎传递压制策略对角线两侧颜色分明，Shur 分解投影近似为一条直线，近乎循环压制的策略彼此循环压制，Shur
    分解投影为椭圆形。


    ![](img/cabd2c20e917d014f37d4e65ac1e41e0_229_0.png)


    图 9.3 博弈策略收益矩阵及其舒尔分解影响[9]


    至于如何度量博弈策略的非传递性，Czarnecki 等[10]指出可以采用计算策略集邻接矩阵 A 的对角线元素个数的方式 dia(A^3)、纳什聚类（Nash
    clustering）的方法'
  merge: -1
