  md: '# 3. 可信任机器学习


    可信任 (trustworthy) 机器学习的研究范畴主要包括可解释、鲁棒、安全、对抗等机器学习范式[5]，其中对抗 (adversarial) 机器学习的研究主要围绕对抗样本的生成与检测方法的展开。目前在对抗样本的各种模态中，对抗补丁
    (adversarial patch) 的出现使得很多对抗分类器无法正确分类。由于对抗补丁在媒体素材的面积占比小，多种类型的分类器无法兼顾这种尺度的对抗攻击，对抗样本可能用于军事上对分类器进行攻击，使得对方做出错误决策。目前一些研究已将此类技术运用于飞机隐形补丁、舰船舷号隐形补丁的相关研究，故关于对抗补丁的检测方法值得深入研究。


    # 10.2.2 视觉欺骗


    # 1. 欺骗基础理论


    人工智能技术的发展经历了计算智能、感知智能和认知智能三个阶段[6]，对抗以各种不同的形态贯穿其中。马金生[7]在《军事欺骗》一书中指出，在军事对抗中，任何一方要达成己方的目的，可能使用各种欺骗方法。欺骗分为蒙蔽式、迷惑式和诱导式，欺骗方法主要包括隐式法、示形法和诈骗法。视觉欺骗作为一类典型的视觉图灵测试方式[8,9]，是感知领域认知对抗的前沿范式。在人工智能领域，我们经常听到关于对抗性攻击的消息，如自动驾驶汽车将停车标志识别成限速标志，大熊猫被识别成长臂猿，通过视频、音频和图像的深度伪造
    (deepfake) 来操纵众人的感知与信念等。一些主要的人工智能会议也开设了讨论人工智能欺骗的主题。随着人工智能技术的发展，人工智能智能体可能会自行学会欺骗，我们十分需要开展防御技术的研究[10]。


    近年来，DARPA 等国外研究机构陆续展开了针对数据欺骗的相关项目探索研究。美国国防部于 2017 年成立方法跨职能小组[11]，推动美国国防部加速运用跨媒体等智能关键技术，旨在从海量数据中快速获取、精准提炼有用的战略目标信息。美国海军于
    2018 年开启“利用恶意样本欺骗计算视觉分类器”项目[12]，旨在更好地理解欺骗计算机视觉分类的机制，以预测和对抗敌人对己方分类器的伪装和误导。DARPA
    从 2019 年陆续开展了“媒体取证”[13]和“语义取证”[14]项目，旨在开发应对虚假媒体信息操纵的识别技术，开发新一代防御对抗欺骗机器学习模型的确保人工智能抵御欺骗的鲁棒性”[15]项目。2021
    年，该项目从三个方面推进：一是开发一个通用框架，用于对机器学习进行欺骗相关攻击，量化机器学习方法自适应欺骗的脆弱性；二是开发采用多传感器数据源的防御系统，降低对欺骗攻击的脆弱性；三是扩展评估框架，用于测试并实现基于多传感器的机器学习反欺骗技术。2020
    年，美国国防部发布首份《数据战略》[16]，目标是确保数据可'
