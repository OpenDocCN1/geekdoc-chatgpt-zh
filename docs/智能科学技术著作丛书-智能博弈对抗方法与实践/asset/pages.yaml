    MCTS 相比，I2A 通过缓解模型不规范的问题，显示了在数据效率和鲁棒性方面的改进。


    # 2. 不确定感知模型


    纯模型方法和无模型方法之间存在性能差距。与需要 10 天的无模型方法相比，基于模型的方法只允许使用 10 分钟的完整训练过程。然而，无模型方法可以获得更好的性能，最多有三个数量级的差异，主要原因是过度拟合。不确定感知模型是解决这一问题的有效方法。基于不确定性的表示，我们将其划分为两种不同的类别，即偶然不确定性(固有系统随机性)和认知不确定性(由于数据有限而产生的主观不确定性)。应对不确定性有两种主要方式，即估计模式不确定性和使用输出熵建立不确定感知模型。


    通过学习概率动态模型，并将模型不确定性明确地纳入长期规划，学习控制概率推理(probabilistic inference for learning control,
    PILCO)只在少数试验中可以处理很少的数据，Blundell 等使用变分贝叶斯学习来估计神经网络中的不确定性。与前馈神经网络相比，使用变分贝叶斯的方法不仅减少了过度拟合的问题，而且正确地评估了训练数据中的不确定性。


    # 3. 复杂观测的模型


    基于模型的强化学习方法已被证明是一种高效的学习控制任务的方法，但在具有复杂观测的部分可观测 MDP 中很难使用。这是因为智能体必须根据观察而不是环境的准确状态来做出决定。空间自动编码器体系结构是为了在潜在空间中学习和自主学习图像的低维嵌入。然而，有一个不可避免的问题，即自动编码器可能无法恢复正确的表示，并且不适合基于模型的强化学习。为了解决这一难题，嵌入控制(embed
    to control, E2C)方法将具有 iLQR 的变分自动编码器应用于潜在空间，并将高维非线性系统中的局部最优控制问题转化为低维潜在状态空间。


    将深度动作条件视频预测模型与模型预测控制相结合的方法是第一个直接在观察空间学习的机器人操作实例。它使用完全未标记的数据训练智能体，并计划将环境中用户指定的对象移动到用户定义的位置的操作，这两个位置都有助于推广到新的、以前看不见的对象。视频预测模型也可以通过结合时间跳过连接来跟'
