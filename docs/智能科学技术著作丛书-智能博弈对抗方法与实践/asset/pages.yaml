    # 5.3.1 《星际争霸》AI 研究历程


    在《星际争霸》中，玩家需要根据即时游戏状态执行任务，并击败敌人。《星际争霸》AI 的设计面临多智能体协作、空间和时间推理、对手规划和对手建模等挑战。


    近年来，微观管理作为《星际争霸》AI 设计的基础问题得到了广泛关注与研究。Usunier 等[5]引入带有情景零阶优化算法的贪婪 MDP 来处理微观管理场景，其性能优于
    DQN 和策略梯度。BiCNet[6]是一种用于《星际争霸》的多智能体深度强化学习方法，以 Actor-Critic 强化学习为基础，利用双向神经网络学习协作。BiCNet
    成功地学习了一些合作策略，并能适应各种任务。在上述工作中，研究者主要开发集中式方法来发挥微观管理的作用。Foerster 等[7]关注微观管理的分散控制，提出了一种多智能体的
    Actor-Critic 算法。为了稳定经验重放和解决非平稳性问题，采用了指纹（fingerprints）和重要采样，提高了最终性能。Shao 等[8]遵循分散式微观管理任务，提出参数共享多智能体梯度下降
    SARSA($\lambda$) 算法。为了恢复'
