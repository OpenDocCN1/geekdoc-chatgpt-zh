    (3)集中式训练分散式执行为解决多智能体问题提供了一种比较通用的框架。

    反事实多智能体（counterfactual multi-agent，COMA）策略梯度方法[79]为了解决

    Dec-POMDP 问题中的多智能体信度分配问题，即在合作环境中，联合动作通常

    只会产生全局性的奖励，这使得每个智能体很难推断出自己对团队成功的贡献。

    该方法采用反事实思维，使用一个反事实基线，将单个智能体的行为边缘化，同

    时保持其他智能体的行为固定，COMA 基于 Actor-Critic 实现了集中式训练分散

    式执行，适用于合作型任务。多智能体深度确定性策略梯度（multi-agent deep

    deterministic policy gradient，MADDPG）方法[80]是对确定性策略梯度（deterministic

    policy gradient，DDPG）方法为适应多智能体环境进行的改进，最核心的部分就是

    每个智能体拥有自己独立的 Actor-Critic 网络和独立的奖励函数，Critic 部分能够获

    取其余所有智能体的动作信息，进行中心化训练和非中心化执行，即在训练的时候，'
