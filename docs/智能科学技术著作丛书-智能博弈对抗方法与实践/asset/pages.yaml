    # 7.4.3 关键技术分析


    在零和游戏中，桥牌是人工智能还没有超越人类专业玩家的游戏之一。桥牌的主要难点在于叫牌阶段，需要在部分信息条件下进行合作决策。叫牌阶段以一系列叫牌过程确定定约，即一队给出叫牌级数协定，另一队认同这个协定，前者成为定约方，最终目的是完成定约，后者则是要阻止对方完成定约。当一队牌力较强时通过叫牌协商，最大限度地达成可以完成的高阶定约，从而获得更多奖励分数；当一队牌力较弱时，可以最大限度地干扰对方达成合适定约。


    +   1. Q 强化学习


    创建桥牌叫牌 AI 的困难在于，在游戏阶段结束之前，无法对叫品(单个叫牌动作)行为进行评估。即使引入了双明牌分析，到叫牌阶段完成前仍然无法知道可获得的分数。因此，在开始叫牌和最后叫牌之间，很难进行评价。最合适的做法是，根据最后一个叫品获得的最佳分数对中间叫品进行评分。基于此，文献[8]提出了一种自动桥牌叫牌系统——基于深度强化学习的不依赖领域知识的叫牌系统，使用原始手牌数据自动学习叫牌。利用所提出的强化学习框架(图
    7.10)，可以自动学习复杂的叫牌规则。


    总框架包含 I 个独立的 Q 网络(I 是叫牌的总长度)。第一个 Q 网络的输入是首叫方(发牌完成后，发牌方将作为第一个叫品的玩家，称为首叫方，然后以顺时针的顺序依次叫牌)的
    52 维原始手牌数据，进行 one-hot 编码后输入 3 层全连接层，每层 128 个节点。输出是每次的叫品成本，用一个 36 维向量表示。'
