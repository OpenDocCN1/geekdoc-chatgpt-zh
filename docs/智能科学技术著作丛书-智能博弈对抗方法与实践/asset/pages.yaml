  md: '# 7.3 斗地主智能博弈 AI 构建


    # 7.3.1 斗地主 AI 研究历程


    尽管很多深度强化学习方法在围棋等完全信息博弈问题中已经实现了近似最优解，但是当应用场景扩展到一些不完全信息博弈问题时，深度强化学习方法的应用还不够成熟。而作为国内熟知度较高的斗地主游戏，由于策略复杂，并且存在多玩家对战和配合的规则，造就了游戏中不同玩家之间的信息不对称，加大了深度强化学习在这类不完全信息博弈游戏中的应用难度，使得应用深度强化学习进行此类问题的研究显得更加充满趣味和挑战。高水平的斗地主
    AI 出现时间较晚，其关键技术主要结合了 MCTS 和自博弈算法。


    MCTS 的发展：借鉴求解大规模机器博弈——围棋 AlphaGo 的成功经验，MCTS 成为攻克复杂机器博弈问题的第一备选算法。MCTS 通过在决策空间中随机采样构建博弈树，以此寻找最优决策。其变体已经扩展适用于多智能体、不完美信息和及时策略博弈等场景。完全信息博弈中，完美信息蒙特卡罗（perfect
    information Monte Carlo, PIMC）树搜索是求解围棋问题的经典算法。近二十年，各大人工智能顶级会议上一直有相关文章发表，但 PIMC
    树搜索依然面临策略混淆和非局部性等问题。应用到不美信息博弈中，由于信息的不对称或部分客观性，构建单一的扩展博弈树成为难点。随后，为将 MCTS 算法迁移到不完美信息博弈中，一些有针对性的改进不断提出。2012
    年，信息集 MCTS (information set MCTS, ISMCTS)[2]在每个玩家的信息集上构建统一的博弈树，但仍然存在信息泄露问题。


    自博弈方法的发展：借鉴求解大规模机器博弈——围棋 AlphaGo Zero 的成功经验，自博弈类方法不依赖领域知识，具有很强的可迁移性。自博弈方法不断地成功应用于各类大规模的复杂博弈，包括多智能体、序贯策略、即时策略、不完美条件等场景。2015
    年，Heinrich 等[3]提出自博弈 MCTS (self-play MCTS, SPMCTS)，在每个玩家各自的信息集上构建博弈树。尽管 SPMCTS
    中的节点包含一个信息集，但算法难以收敛。Smooth-UCT 引入光滑动作选择机制 (smoother action choosing scheme) 获得良好的收敛特性。文献[4]和文献[5]尝试引入深度强化学习方法求解。在神经虚拟自博弈
    (neural fictitious self-play, NFSP) 框架中，针对假定的对手策略求解最佳响应，再采用深度强化学习方法更新该既定策略。


    文献[6]观察到 ISMCTS 很难求解斗地主问题。2019 年，文献[1]实现了能战胜人类专家的 AI DeltDou.DeltDou 结合 SPMCTS
    和 NFSP，提出新算法 FPMCTS。采用神经网络拟合策略，用 FPMCTS 计算最佳响应。2021 年，Zha 等在斗地主上取得了突破——DouZero[7]击败人类冠军选手。在数百局对弈中，性能超越'
