    B 打败了之前的策略 A，接下来学习到的策略 C 打败了策略 B，最后又重新学习到了策略 A 发现它能打败策略 C。如果仅仅采用自博弈来学习，学习到的策略可能无法有效对抗人类策略。2018
    年，DeepMind 开发了《星际争霸》AI 程序 AlphaStar[4]，技术成果发表在 Nature 杂志上。AlphaStar 使用神族，以 5：0
