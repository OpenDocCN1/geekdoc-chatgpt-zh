  md: '务相似度具有较高表征能力的神经网络模型。利用低复杂度的基础学习器和高复杂度的元学习器是构建分层元学习模型的有效途径。基础学习器快速训练每个少量的任务，元学习器慢慢发现所有任务的共享特征并更新元参数。


    # 9.5.3 贝叶斯方法


    从概率的角度来看，元学习可以利用贝叶斯推理框架。贝叶斯推理提供了对少量元预测中不确定性的有效估计，并扩展了方法学以使其应用更广泛。


    神经统计学家(neural statistician, NS)[29]方法应用变分自编码器来近似特定任务情境的后验分布。给定后验分布，最大后验概率对应的情境是输入数据的预测标签。通过后验分布，还可以得到输入数据上未知标签的置信区间。


    轻量拉普拉斯近似元适配(lightweight Laplace approximation for meta-adaption, LLAMA)[30]方法将
    MAML 重新定义为分层贝叶斯模型中的概率推理。对于对数似然函数中的高斯分布，采用一阶和二阶拉普拉斯近似。对于其他数据分布，如多模态分布、高偏态分布或长尾分布，拉普拉斯近似并不适用。


    贝叶斯模型无关元学习(Bayesian MAML, BMAML)[31]方法使用 Stein 变分梯度下降法代替 MAML 中的随机梯度下降法，其中 Stein
    变分梯度下降法是马尔可夫链蒙特卡罗和变分推理相结合的一种高效贝叶斯推理方法。该方法利用 Stein 变分梯度下降和贝叶斯快速自适应方法更新任务特定参数。


