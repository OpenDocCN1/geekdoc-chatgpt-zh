    # 3. 基于 MAXQ 分层强化学习的行为树多节点优化算法


    # 1)行为树


    在任务规划中，传统的有限状态机（finite state machine, FSM）最为经典，但需要转换连接状态，失去了模块性。而行为树作为替代有限状态机的方式具有可重复性和可适应性，完美地替代了有限状态机的不可重复性和开发的不便捷性，成为当前机器人软件开发的主流方式。行为树是一棵具有层级结构的树，主要用来控制智能体的决策，树的末端（动作节点）就是智能体实际要去做的事情。连接叶子节点的每一个树枝（组合节点），决定了一个行为树如何从根节点连到某一个动作节点，并执行相应的命令操作。


    # 2)基于 Q 学习的行为树选择节点优化


    行为树的选择节点本质上描述了一组针对节点所对应任务的决策规则，即按照从左到右的优先级执行可选择动作。其中所隐含的专家经验是，在大多数状态空间下，优先级越高的动作具有越高的效应值。学习中考虑更详细的不确定战场环境态势，刻画不同战场态势和可选择动作之间的决策映射关系，且决策过程通常考虑执行动作后的长远效益。该学习任务是一个典型的强化学习任务，通常被'
  merge: -1
  img_proc: true
- pgno: 214
  md: '描述为 MDP。


    在 MDP 中，智能体的目标是学习最优策略 \(\pi\)，使得在任意系统状态 \(s\) 下，按照最优策略 \(\pi\) 执行动作所获得的期望的折扣奖励值最大化：


    \(V^\pi(s) = E_\pi \left\{ \sum_{t=0}^\infty \gamma^t R(s_{t+1} | s_t, \pi(s_t)
    | s_0 = s) \right\}\) (8.2)


    其中，\(\pi: S \times A \to [0,1]\) 表示一个智能体的决策策略；\(E_\pi\) 表示在策略 \(\pi\) 下的期望累计奖励；\(\gamma
    \in (0,1]\) 表示折扣因子，用来刻画未来奖励对当前动作选择的重要性；\(s_t\) 表示在时刻 \(t\) 时智能体所处的系统状态。


    对于固定的策略 \(\pi\)，上述值函数满足贝尔曼方程：


    \(V^\pi(s) = \sum_{s''} P(s''|s, \pi(s)) \left[R(s''|s, \pi(s)) + \gamma V^\pi(s'')\right]\)
    (8.3)


    那么对于最优策略 \(\pi^*\)，其值函数可以表示为


    \(V^*(s) = \max_a \sum_{s''} P(s''|s, a) \left[R(s''|s, a) + \gamma V^*(s'')\right]\)
    (8.4)


    如果通过显式地存储每一状态动作对的期望折扣累计奖励来反映上述目标，则式 (8.4) 可以等价地表示为


    \(Q^*(s, a) = \sum_{s''} P(s''|s, a) \left[R(s''|s, a) + \gamma \max_{a''} Q^*(s'',
    a'')\right]\) (8.5)


    广泛使用的最经典的模型无强化学习方法是 Q 学习，它采用下面的时序差分更新规则对上述最优 Q 值进行迭代逼近：


    \(Q_{t+1}(s, a) = (1 - \alpha_t) Q_t(s, a) + \alpha_t \left[R(s''|s, a) + \gamma
    \max_{a''} Q^*(s'', a'')\right]\) (8.6)


    其中，\(\alpha_t\) 是 \(t\) 时刻的学习率。


    显然，将一个行为树选择节点优化问题描述为强化学习任务，则可以通过模型无关强化学习方法 Q 学习进行问题求解。首先采用 MDP 对子任务建模，其状态包括与决策子任务相关的计算机生成兵力(computer-generated
    force, CGF)状态和感知到的战场环境状态等变量，通常对相关变量进行离散化处理；动作空间为选择节点下的子节点，奖励函数为根据子任务目标所设定的稀疏奖励值。那么，当该行为树控制节点激活时，根据从环境所获取的当前状态，按照一定随机策略选择某一子节点作为动作，若
    \(\varepsilon\) 贪婪，获得即时奖励值，则收集到样本 \(\langle s, a, s'', r \rangle\)。通过大量的交互，按照公式递推更新，获得在该选择节点时最优策略的状态动作'
