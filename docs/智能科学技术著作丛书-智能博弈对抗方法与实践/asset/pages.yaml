    r_{t+k+1} \)

    \( = \sum_{a_t} \pi(a_t|s_t) \sum_{s_{t+1}} p(s_{t+1}|s_t, a_t) \sum_{(s_{t+1},
    a_{t+1}, \cdots) \neg \tau''} \pi(a_{t+1}|s_{t+1}) \cdots \left( r_{t+1} + \sum_{k=1}^\infty
    \gamma^k r_{t+k+1} \right) \)

    \( = \sum_{a_t} \pi(a_t|s_t) \sum_{s_{t+1}} p(s_{t+1}|s_t, a_t) \left[ r_{t+1}
