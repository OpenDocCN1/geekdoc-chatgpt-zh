    # 3. 视觉欺骗对抗


    视觉欺骗一直是战争传统而重要的工具，视觉上的欺骗能够给人直观的感受，使人们更愿意相信所见“欺骗”是“真实”的。视觉欺骗中通常会有针对性地改变外观、行为等并让对方察觉，以期望达到欺骗目的，因此，在有针对性的对抗环境中，眼见不一定为实。视觉欺骗包含伪造、伪装、对抗补丁等欺骗方法，其中伪造（示假）和伪装（隐真）的方法主要是欺骗人的视觉，对抗补丁主要是对人工智能检测方法进行攻击。如图
    10.3 所示，在重要的目标分析领域中，欺骗与反欺骗对抗广泛存在于大量文本、音频、图像和视频等目标数据中，其中部分目标信息中存在有价值的信息，如果能够对其进行正确处理分析，则能对相关问题做出正


