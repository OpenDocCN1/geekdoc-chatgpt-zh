    # 3. 单调值函数分解网络


    在现实世界中，一组智能体必须协调它们的行为，同时以一种分散的方式行动。通常实验中都是采用集中式框架训练智能体。在这种环境中，全局状态信息是可用的，通信限制被解除。在拥有额外全局信息的条件下，学习联合动作值是一种极具吸引力的集中式学习方式，但提取分散执行策略的最佳策略还难以确定，因此就出现了用于深度多智能体强化学习的单调值函数分解网络——QMIX[3]。它是一种新颖的基于值函数的算法，可以以集中的端到端方式训练去中心化的策略。QMIX
    算法使用一个网络来估计联合动作值，它是每个智能体动作值的复杂非线性组合，并且仅以局部观测为条件。QMIX 算法在结构上强调联合动作价值在每个智能体动作值中是单调的，这允许在非策略学习中，联合动作值易于处理的最大化，并保证集中和分散策略之间的一致性。它就是使全局
    Q 值最大的联合动作的每一个分量，也能使局部 Q 值最大(单调性)，所以在集中训练过程中得到的最优联合动作，在分散执行时每个动作也是最优的(一致性)。VDN
    算法以简单的求和'
