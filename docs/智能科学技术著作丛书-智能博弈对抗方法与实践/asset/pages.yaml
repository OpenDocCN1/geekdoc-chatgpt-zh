  md: "期望奖励，因此这些奖励是分布未知的随机变量。在当前节点下后续动作根据 UCB 策略进行选择，即\n\n\\[ UCT(n,a) = Q(n,a) +\
    \ c \\sqrt{\\frac{\\ln N(n)}{N(n,a)}} \\] \n(3.16)\n\n其中，\\( Q(n,a) \\) 为在节点 \\\
    ( n \\) 上执行动作 \\( a \\) 的平均累计奖励值；\\( N(n,a) \\) 为在节点 \\( n \\) 上选择动作 \\( a \\\
    ) 的次数；\\( N(n) = \\sum_{a \\in A} N(n,a) \\) 表示节点 \\( n\\) 被访问的总次数；\\( c > 0 \\\
    ) 是一个常数，用以平衡探索和利用。\n\n# ### 3.2.3 半马尔可夫决策过程\n\n精确求解 MDP 问题的方法受限于问题复杂度和问题求解能力，无法有效应用于状态空间和动作空间大、任务周期长、环境动态变化的问题。而分层结构的引入为求解上述问题提供了更自然的解决方式。\n\
    \n半马尔可夫决策过程（semi-Markov decision process, SMDP）是 MDP 模型的扩展，为分层学习和规划提供了基本的理论支持。MDP\
    \ 模型只关注动作执行的顺序，而不关注动作执行需要的时间。MDP 假设每个动作都可以在一个决策周期内执行完毕。SMDP 模型允许每个动作需要的执行时间不同，甚至可以服从某一概率分布。\n\
    \n令随机变量 \\(\\tau\\) 表示状态 \\( s \\) 下执行动作 \\( a \\) 需要的时间，SMDP 模型下的状态转移函数 \\( P(s',\\\
    tau|s,a) \\) 给出状态 \\( s \\) 下执行动作 \\( a \\) 经过时间 \\(\\tau\\) 后转移到状态 \\( s'\\)\
    \ 的联合概率，即\n\n\\[ P(s',\\tau|s,a) = \\text{Pr}\\{s_{t+\\tau} = s' | s_t = s, a_t\
    \ = a\\} \\] \n(3.17)\n\n同样，期望奖励函数 \\( R(s',\\tau|s,a) \\) 给出状态 \\( s \\) 下执行动作\
    \ \\( a \\) ，经过 \\(\\tau\\) 个时间步之后终止在状态 \\( s'\\) 的期望折扣奖励之和，即\n\n\\[ R(s,a,s',\\\
    tau) = E \\left[ \\sum_{n=0}^{\\tau-1} \\gamma^n r_{t+n} | s_t = s, a_t = a, s_{t+\\\
    tau} = s' \\right] \\] \n(3.18)\n\n类似地，3.2.2 节中描述的关于 MDP 模型中的值函数和贝尔曼方程也可以应用到 SMDP\
    \ 模型中。根据值函数的表达方式（式（3.2）），如果在状态 \\( s \\) 下执行的动作 \\(\\pi(s)\\) 需要 \\(\\tau\\) 个时间步完成，则值函数可以描述成\
    \ \\(\\tau\\) 个时间步的累计奖励与剩余时间步的累计奖励之和，即\n\n\\[ V^\\pi(s) = E_\\pi \\left[ (r_t\
    \ + \\gamma r_{t+1} + \\dots + \\gamma^{\\tau-1} r_{t+\\tau-1}) + (\\gamma^\\\
    tau r_{t+\\tau} + \\dots) | s_t = s \\right] \\] \n(3.19)"
