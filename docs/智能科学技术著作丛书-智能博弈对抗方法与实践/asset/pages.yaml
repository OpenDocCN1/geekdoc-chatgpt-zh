    (3) 服务器智能体：是一个自启动的后台服务，用于在一个(组)硬件平台上，控制多个服务端的启动、初始化及关闭，用于硬件资源负载均衡、支持并行训练以及监控服务端运行状态。在每个操作系统上，可以运行一个服务器智能体，每个服务器智能体可以控制
    1~N 个服务端。


    (4) 墨子 Python API：该 API 是一组由 Python 脚本组成的开发包，它提供三方面功能：①实现对墨子系统的对象类及其方法的封装；②利用
    Python 语言转发函数调用墨子系统 Lua 子系统扩展函数；③利用 gRPC 实现通信交互控制。


