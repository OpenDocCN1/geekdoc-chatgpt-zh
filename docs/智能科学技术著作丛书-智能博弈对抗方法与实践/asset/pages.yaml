  md: '“山鹊”项目：美军战略能力办公室（Strategic Capabilities Office，SCO）支持的一个试验项目，用于开发能够自主执行空中监视任务的微型无人机群。该项目由商用货架组件建造，对于一次性无人机来说足够便宜，可以在不改变硬件的情况下升级机载软件。安装在战斗机机上的一个特殊容器被释放到空中，通过降落伞减速，机翼被展开以自主飞行。一群“山鹊”通过数据链路
    AD hoc 组网，形成了一个去中心化的蜂群，共享一个分布式的集体“大脑”，依靠群体智能技术进行集体决策、自适应编队和自主修正，集体决定是否完成任务，比地面遥控反应更快。体积小可以轻松避免普通的火力攻击，机队可以适应无人机数量的变化。“山鹊”机群可以在低空扫描特定区域，使用人工智能/面部识别技术识别敌方战斗人员和高价值目标，并要求指挥从附近武器平台发射的导弹进行攻击。“山鹊”机群还具有防御能力，可以作为诱饵保护战斗机，或在步兵遭到伏击时监视地面。


    低成本无人机集群技术项目：为了实现快速释放无人机，通过自组网以及协同技术形成无人机集群，异构无人机携带多种载荷，以数量的压倒性优势取得战争胜利，美国海军研究办公室（Office
    of Naval Research，ONR）主持了低成本无人机集群技术（low-cost UAV swarming technology，LOCUST）项目。项目完成了小型无人机的快速连续发射试验，验证了无人机集群的协同机动能力。集群中部分无人机具备吸引敌方火力的能力，其他无人机可以有效执行其他任务，保证了作战人员的安全。


    “小精灵”项目：美国国防高级研究计划局（Defense Advanced Research Projects Agency，DARPA）主持了“小精灵”项目[18]，项目的主要研究内容是小型无人机发射与回收装置的开发，在空中能够实现无人机的发射与回收，以便快速部署廉价、可重复使用的无人机集群。目前，项目已经通过实验验证了自主编队飞行以及保障飞行安全方面的技术，成功将一架
    X-61“小精灵”无人机回收到运输机，这对项目研究具有重要意义。


    “进攻性蜂群战术”项目：目的是开发验证空中机器人与地面机器人共同协同的蜂群战术，同时研究设计无人机与无人车，希望大量单个无人系统间实现信息共享，共同完成各项任务，尤其是可以满足城市作战环境的需求。在该项目最新的野外实验中设置了交互式城市突袭场景，无人系统蜂群可以从设施建筑物中找到多个感兴趣的模拟物品。


    # 2. 集群对抗关键技术


    近年来，越来越多的无人系统被投入军事作战实践中。由异构平台构建的无人系统可以在强对抗、高动态与多威胁的条件下，执行枯燥、恶劣、危险和纵深的任务。对抗环境中多无人系统协同作战面临诸多挑战，主要表现在针对对抗环境的平台故障、平台受损、链路时延突变、通信链路中断，针对多无人系统的异'
  merge: -1
  img_proc: true
- pgno: 250
  md: '构多平台协同、传感器异构信息融合、多任务同步及协同、通信拓扑与路由管理等。主要技术难点在于问题建模与计算复杂性，信息不确定性与不一致性，平台/任务组合多样性，对抗决策规划时间的紧迫性，作战效能评估及时性、多任务协调管理、任务重分配与规划时效性等。在未来战争中，利用大量具有自主作战能力且成本低廉的无人系统集群突破敌方防御体系，对目标实施饱和打击以及对入侵机群进行空中拦截是无人集群作战的重要手段。无人系统集群对抗需要研究的关键技术问题主要包括：①无人集群探测与识别；②无人集群对抗态势感知与评估；③集群协同决策与对抗自主决策；④无人集群智能控制与编队控制；⑤无人集群通信技术等。


    # 3. 集群对抗方法区分


    无人机集群对抗可拆解为协同搜索和饱和攻击两个阶段。无人机集群系统中的每架无人机在作战过程中对未知区域进行搜索，定位、监视敌方无人机，为后续任务的有效推进做准备。当无人机集群发现敌方目标时，就可以通过恰当的作战单位分配来实现对敌方高价值目标的精确打击。


    无人机集群协同搜索：无人机集群在执行任务过程中，首先进行未知区域搜索、定位敌方目标。现有协同搜索方法一般基于全局搜索图，采用中心化或分布式方法，对集群中所有无人机的航线进行规划，同时还要考虑无人机实时避障、防撞等。此外，对于未知环境，可以采用同步定位与构图方法构建三维动态地图，进而搜索已方可行搜索路径。


    无人机集群饱和攻击：无人机集群发现敌方目标后，即可开展饱和攻击准备，其关键在于任务分配。通常，在一定约束下合理地将多个攻击任务分配给任务子群，就可实现高效的目标精确打击。


