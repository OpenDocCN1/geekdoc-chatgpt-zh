    # 4. 非对称抽象采样


    由于分支数变得非常高，基于 MCTS 的规划方法不能很好地扩展到更大的即时策略博弈场景， Moraes 等[48]提出要利用行动抽象方法提升朴素 MCTS
    的扩展性并设计了两种方法。在第一种方法 A1N 中，从一组脚本中进行朴素采样，而不是从一组低层级动作导出的抽象动作子集中采样。在第二种方法 A2N 中，单位动作是从两组不同的脚本中采样的。这些依赖于动作抽象方法的主要缺点是它们依赖硬编码的策略，将智能体的行为限制在脚本动作的集合中，而且对对手策略的动态适应探索不够，使智能体容易被对手利用。


    # 5. 投票式策略创建


    Silva 等[49]提出通过投票式策略创建 (strategy creation via voting, SCV) 试图解决以上两个缺点，该方法包括一个新颖的策略生成机制，该机制建立在一组硬编码脚本的基础上，通过投票机制生成新的策略。此外，SCV
    实施了一种策略适应技术，使用从不同策略之间的匹配数据集训练的逻辑回归模型，在每一个固定数量的决策周期后，它会检测对手采用的策略，并相应地调整自己的策略。


    为了找到一个最优的抽象可以显著提高智能体的策略水平，Mariño 等[50]使用进化算法来进化一组由脚本诱导的抽象，并找到最佳抽象，与 SCV 类似，通过改变每个策略的参数，从一个较小的集合中产生一个较大的策略库。在诱导抽象空间中，使用
    PGS 或 SSS 作为搜索算法，通过与所有其他个体进行一组即时策略博弈对抗来评估个体。'
