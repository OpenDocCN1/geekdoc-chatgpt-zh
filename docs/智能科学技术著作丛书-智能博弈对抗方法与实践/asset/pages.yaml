  md: '# 2. 扩展式博弈策略学习方法


    对于完美信息的扩展式博弈可以通过线性规划等组合优化方法来求解。近年来，由于计算博弈论在非完美信息博弈领域取得的突破，基于后悔值的方法得到广泛关注。当前，面向纳什均衡（NE）、相关均衡（correlated
    equilibrium, CE）、粗相关均衡（coarse correlated equilibrium, CCE）、扩展形形式相关均衡（extensive
    form correlated equilibrium, EFCE）的相关求解方法如表 2.6 所示。其中面向两人零和博弈的组合优化方法主要有线性规划[89]、过大间隙技术（excessive
    gap technique, EGT）[90]、镜像梯度优化[91]、投影次梯度下降（projected subgradient descent）[92]、可利用度下降（exploitability
    descent）[33]等方法；后悔值最小化（regret minimization, RM）方法主要有后悔值匹配（regret matching）[93]、反事实后悔值（counterfactual
    regret, CFR）最小化[94]、Hedge[95]、乘性权重更新（multiplicative weight update, MWU）[96]、Hart
    后悔值匹配[97]等方法。面向两人一般和博弈的组合优化方法主要有 Lemke-Howson[98]、支撑集枚举混合整数线性规划（mixed integer
    linear programming）[99]、混合方法（hybrid method）[100]、列生成[101]和线性规划方法；后悔值最小化方法主要有缩放延拓后悔值最小化（scaled
    extension regret minimizer）[102]。面向多人一般和博弈的组合优化方法主要有反希望椭球法（ellipsoid against hope）[103]和列生成方法[104]；后悔值最小化方法主要有后悔值测试方法[105]、基于采样的
    CFR 最小化


    表 2.6 扩展式博弈均衡求解方法


    | | 优化方法 | 后悔值最小化方法 |

    |---|---|---|

    | 两人零和博弈 | 线性规划（NE、CE、CCE）[89] | 后悔值匹配（NE、CCE）[93] |

    | | 过大间隙技术（NE）[90] | 反事实后悔值最小化（NE）[94] |

    | | 镜像梯度优化（NE）[91] | Hedge（NE）[95] |

    | | 投影次梯度下降（NE）[92] | 乘性权重更新（CE）[96] |

    | | 可利用度下降（NE）[33] | Hart 后悔值匹配（CE）[97] |

    | 两人一般和博弈 | Lemke-Howson（NE）[98] | |

    | | 支撑集枚举混合整数线性规划（mixed integer linear programming）[99] | |

    | | 混合方法（NE）[100] | 缩放延拓后悔值最小化（EFCE）[102] |

    | | 列生成（CCE）[101] | |

    | | 线性规划（EFCE）[100] | |

    | 多人一般和博弈 | 反希望椭球法（CE、EFCE）[103] | 后悔值测试方法（NE）[105] |

    | | 列生成（CCE）[104] | 基于采样的 CFR 最小化（CCE）[106] |

    | | | 基于联合策略重构的 CFR 最小化（CCE）[106] |'
