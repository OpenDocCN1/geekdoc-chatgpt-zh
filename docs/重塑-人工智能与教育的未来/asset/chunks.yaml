    [一、《北京共识——人工智能与教育》](#txt012.html#txt012_2)\n\n[二、教育的革命：大数据与个性化教育探讨](#txt012.html#txt012_3)\n\
    \n\uFEFF\n\n第一章 趋势使然：人工智能与教育的革命\n\n拥抱智能：人类进入人工智能时代\n\n赋能教育：人工智能催生教育革命\n\n追问意义：智能时代教育革命之目的\n\
    \n教育革命：本书的目的、内容与结构\n\n随着互联网、物联网、云计算、大数据与人工智能技术的不断发展,人工智能革命浪潮席卷全球。特别是继阿尔法狗(AlphaGo)打败人类围棋界的世界冠军之后,人工智能“名声大噪”。目前,人工智能技术已得到前所未有的发展与完善。关于人工智能技术的发展与应用,正在经历由浅入深、由简单到复杂的智能转化。人工智能时代,“智化万物”和“万物智化”成为这个新时代的显著特征。人工智能对教育的影响是广泛和深远的,在智能技术的催生下,教育革命悄然而至。\n\
    \n一、拥抱智能：人类进入人工智能时代\n\n2019年8月28日,联合国教科文组织正式发布《北京共识——人工智能与教育》。这是联合国教科文组织首个为利用人工智能技术实现2030年教育议程提供指导和建议的重要文件,文件中提出：“各国要引领实施适当的政策应对策略,通过人工智能与教育的系统融合,全面创新教育、教学和学习方式,并利用人工智能加快建设开放灵活的教育体系,确保全民享有公平、适合每个人且优质的终身学习机会,从而推动可持续发展目标和人类命运共同体的实现。”《北京共识——人工智能与教育》把人工智能对教育的价值以及人工智能与教育系统融合的重要性,提到了前所未有的高度。\n\
    \n从技术角度看,人工智能(Artificial Intelligence,AI)是指人类通过技术手段,赋予机器以特定的人类智慧和能力的技术总称,是对人类智能的模仿、增强与延伸,它在操作性技能领域具有远超人类智能本身的价值属性,其发展具有广泛的影响和深远的意义。\n\
    \n人工智能的发展,自1956年达特茅斯会议开幕,至今仅有63年的历史。回顾人工智能这短短几十年的发展史,可以认为它是一部“三起二落”的技术曲折史,也可以认为它是一部“螺旋上升”的技术成长史。它代表着一个新时代——智能时代的来临,引发着一浪高过一浪的热议,孕育着人类的无限希望。\n\
    \n人工智能的发展走向大致可概括为“理论初探——概念完型——技术成熟——场景应用”等四个基本阶段。随着互联网、物联网、大数据、云计算等新兴技术的不断发展,人工智能的技术谱系渐趋成熟,与之相关的专家系统、视觉识别、自然语言处理、深度学习等基础智能技术走向完善,人工智能技术逐渐在众多的应用场景中落地生根,人类社会正大踏步迈向智能新时代。\n\
    \n人工智能的快速发展和广泛应用标志着人类运用科学技术进入新一轮的巅峰,它直接将人类带上了一个新的时代高度,人们看待世界的角度发生了新的变化,改造世界的能力大大提升。从人类起源至今,大致经历过石器时代、青铜时代、铁器时代、蒸汽时代、电力时代与信息时代六个时代。如今,人类又开启了新的时代模式,正张开双臂,迎接着智能时代的到来。人类进入21世纪的三个关键时间点,相继出现了三个互相联系又略有区别的新时代,即网络社会时代、大数据时代和智能机器时代,三者共同构成了新的社会时代——人工智能时代^([\\\
    [1\\]](#txt001.html#footnote_content_txt001_1))。\n\n进入人工智能时代,同以往存在的所有技术时代一样,人类的生产方式、生活方式、思维活动与学习形态,都将迎来新的机遇与挑战。“迎其而上”与“敬其远之”注定是两种不同的故事结局,这是所有新技术时代都存在的社会特征。\n\
    \n人工智能对社会最大的影响在于颠覆与重构,它让人们深切地体验到——一切正在变得智能。借助智能技术,人类开启了自我突破和超越的时代之旅。\n\n人工智能的现实魅力也在于颠覆与重构,它让以往各自独立的行业相互渗透与融合,在行业形态、社会分工、组织形式、思维方式、活动边界等方面带来新的变化。特别是与社会公众密切相关的领域,如医疗、教育、就业、制造、交通、政务、公共服务等,都将一一进入智能化模式,从原有的“万物互联”走向“万物智能”。在这个万物智能化的时代趋势下,嗅觉最为灵敏的商业领域潮起澎湃,各大企业纷纷投身智能行当,布局智能化产业,使人工智能产业规模迅速飞升。\n\
    \n从全球来看,根据《2018年全球及中国人工智能行业市场规模预测》^([\\[2\\]](#txt001.html#footnote_content_txt001_2))统计数据显示(如图1-1所示)：2015年,全球人工智能市场规模已突破1\
    \ 684亿元人民币;2015—2018年,保持平均17%的年增长率,规模迅速扩张到2018年的2 700亿元人民币。初步预算,2019年的全球人工智能市场,规模将达到4\
    \ 285亿元人民币,年增长率为58.7%,2020年的全球人工智能市场规模将达到6 800亿元人民币,年增长率为58.7%,相较于2018年前的增长速度,2018—2019年出现跨越式增长,发展势头迅猛。\n\
    \n![](images/txt001_1.jpg \"pagenumber_ebook=15,pagenumber_book=5\")\n\n图1-1 2015—2020年全球人工智能市场规模及增长率\n\
    \n从国内来看,据前瞻产业研究院发布的《中国人工智能行业市场前瞻与投资战略规划分析报告》^([\\[3\\]](#txt001.html#footnote_content_txt001_3))统计数据显示(如图1-2所示)：2015年,中国人工智能市场规模已突破100亿元人民币,2016年其规模达到141.9亿元人民币,同比增长26.3%。截至2017年,中国人工智能市场规模增至216.9亿元人民币,同比增长52.8%。2018年,中国人工智能市场规模达339亿元人民币,比2017年增长56.3%,远高于全球17%的增速水平。并预测在2019年和2020年,中国人工智能市场规模将分别达500亿元人民币和710亿元人民币。2015—2020年,中国人工智能市场规模复合年均增长率为44.5%,未来市场前景广阔,大片人工智能“新蓝海”等待开发。\n\
    \n![](images/txt001_2.jpg \"pagenumber_ebook=16,pagenumber_book=6\")\n\n图1-2 2015—2020年中国人工智能市场规模及增长情况\n\
    \n无论是全球人工智能产业,还是国内人工智能产业,目前都在迎风而上实现整体规模的迅速膨胀,总体上反映出,在全世界范围内的人工智能技术,嵌套社会结构的程度之深、影响之切,已超出人们原初的想象。\n\
    \n教育,这是一个事关人的发展和国家前途的大事业,也是一个对科技发展极为敏感的行业。在这个科技飞速发展的智能时代,探讨人工智能技术对教育已经带来的和可能带来的革命性影响,可谓意义深远。未来已来,但未来是现在的延续。今天,充分把握人工智能技术对教育的颠覆与重塑,超前认识智能化的未来教育新模式,其价值是无论怎样强调也不过分的。\n\
    \n二、赋能教育：人工智能催生教育革命\n\n革命是指对某事物进行的大变革与大调整,经过系列的催化活动引发事物从量变到质变的飞跃过程。古往今来,人们每每论及革命,多是与政治相关。但除了政治领域的革命之外,众多其他领域同样会发生革命。譬如,科技革命、工业革命、农业革命、商业革命、智能革命、学习革命等,革命的表现形式丰富多样。无论何种情况,革命的产生都是多重因素共同作用的结果,涵盖经济基础、矛盾冲突、技术革新与革命领导力量四个基本要素。\n\
    \n在任何领域,只要事物受到“内外”因素的影响,或深或浅的变革都会发生,有的在形式上发生,有的则是在本质上发生,后者可以进一步理解为不可逆转的大变革与大调整,我们便可将之命名为该领域的一次革命性变革。随着人类进入智能时代的程度越深,与之相应,人们被迫卷入其中的程度也就越深,此时人们对人工智能技术的依赖性也就越强,包括人们的“吃、穿、住、行、用”等方方面面,无一例外。换言之,人工智能技术对人类的革命性影响是多方面的,几乎涵盖了人类生活的所有领域,其中包括本书与你一起分享教育领域——教育的革命和教育的未来都与人工智能密切相关。\n\
    \n有关教育革命,历史上共发生过四次。“四次教育革命”,最早是由英国教育家埃里克·阿什比(Eric Ashby,Baron Ashby,1904—1992)提出的。他认为,当教育的职责由家庭转移到基督教会或犹太会堂时,第一次教育革命出现;第二次教育革命是人类采用书写作为教育工具;第三次教育革命是印刷术的发明;第四次教育革命是微电子技术的应用^([\\\
    [4\\]](#txt001.html#footnote_content_txt001_4))。以上述革命发生的四要素为依据,在经济日益发展的社会中,对已发生的教育革命进行技术性解释：第一次教育革命得益于专职教师的出现,第二次教育革命得益于文字的出现,第三次教育革命得益于书籍的出现,第四次教育革命得益于信息化技术的出现。"
  fmt: "\n# 前言\n\n2019年5月16日，联合国教科文组织、中华人民共和国教育部和中国联合国教科文组织联合举办的“国际人工智能与教育大会”在京举行。会议开幕式上，习近平总书记向大会致贺信时指出：“中国高度重视人工智能对教育的深刻影响，积极推动人工智能和教育深度融合，促进教育变革创新，充分发挥人工智能优势，加快发展伴随每个人一生的教育、平等面向每个人的教育、适合每个人的教育、更加开放灵活的教育……推动人类社会迎来人机协同、跨界融合、共创分享的智能时代。把握全球人工智能发展态势，找准突破口和主攻方向，培养大批具有创新能力和合作精神的人工智能高端人才，是教育的重要使命。”\n\
    \n习近平总书记的贺信，深刻地阐述了人工智能技术对教育领域的颠覆性影响和中国对人工智能与教育深度融合的高度重视。会议期间，参会的100多个国家、10余个国际组织约300名国际代表，集体参观了包括清华大学在内的数所北京的学校，集中对其人工智能与教育融合发展情况进行详细了解，最终形成了国际社会对智能时代教育发展的共同愿景——《北京共识》。2019年8月28日，联合国教科文组织发布《北京共识——人工智能与教育》，成为全球首个为利用人工智能技术实现2030年教育议程提供指导和建议的重要文件，向全世界庄严宣告：人工智能教育的新时代已经到来！\n\
    \n人工智能教育新时代，谱写人类教育新篇章。人工智能赋能教育，导致教育正在发生一场翻天覆地的革命：教育的质量问题、公平问题、歧视问题与伦理问题等难题得到进一步攻克；“因材施教”得以从理论走向实践，终身教育体系得以构建，教育的边界得以突破和超越；教育重心发生重大转向，“应试教育”正在向“素质教育”转变；教育正在回归本质，人类的创造思维与创造力正在被唤醒，人类的价值与尊严正在被认可，人类的全面发展正在被实现。\n\
    \n之所以命名本书为《重塑：人工智能与教育的未来》，正是源于以上时代背景与人工智能对教育的重塑价值。这样的时代大背景，正是探讨人工智能与教育革命的最佳时机。2018年8月，全球首个人工智能公民索菲亚被全球在线教育集团i\
    \ Tutor Group聘请为集团的AI教师，标志着全球首个人工智能教师诞生。自此，人工智能教师与人类教师的“竞争与合作”关系已经开始，至于教师会不会被替代，或者怎样被替代，是一个需要进一步深入探讨的问题。\n\
    \n教育是对技术比较敏感的领域之一，人工智能技术正导致教育产生革命性的变化。本书对智能新时代教育的发展趋势、新兴教育、智慧校园、时空超越、人机关系、教育基石、通才教育、创新教育、创客教育、创业教育、审美教育以及教育的未来等，进行了多维度研究和人文价值反思，探讨了智能新时代教育场景中教育者、教育中介和受教育者的技术化形态，分析了因智能技术对教育方方面面的渗透、碰撞与融合所产生的新理念、新思想、新方法和新未来。\n\
    \n在本书的编写过程中，作者参考了大量国内外文献，在此特向有关研究者和作者致以最真诚的感谢。\n\n由于作者知识和水平有限，书中难免存在不足之处和错误，敬请读者批评指正。\n\
