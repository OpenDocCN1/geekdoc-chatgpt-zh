    **Teacher-Centered Approach: Causing the "Empty Seats, Absent Minds" Phenomenon
    in Education**


    **Rapid Knowledge Update: Education Disconnected from Social Development**


    **The "Needham Question" and "Qian Xuesen''s Question": Rethinking Our Education**


    Where there are problems, there are needs; problems are unmet needs. Today, traditional
    education, represented by exam-oriented education, has fallen into "disrepute"
    amid the clamor for quality-oriented education. However, traditional education
    has neither directly transformed into quality-oriented education nor announced
    its exit from the historical stage. Instead, it has formed an educational structure
    in reality where "quality-oriented education is supplementary, exam-oriented education
    is primary." It is evident that the actual force of traditional education still
    dominates the educational orientation of the entire society and has not stagnated
    due to the development of quality-oriented education. But it is undeniable that
    in the process of developing quality-oriented education, the drawbacks of traditional
    education have become increasingly prominent.


    ### 1. Shortage of Educational Resources: Prominent Issues of Educational Equity


    The so-called shortage of educational resources refers to the insufficient supply
    in the acquisition of resources and enjoyment of rights by the objects of education,
    or the realistic gap in the perceived abundance of resources when comparing supply
    and demand, due to limitations imposed by the resource conditions of the subjects
    and objects of education. The so-called issue of educational equity refers to
    the problem of unbalanced resource allocation in "static" or "dynamic" fields,
    including issues of equality of opportunity, process, and outcome, caused by specific
    resistances (such as social resistance, family resistance, and policy resistance)
    encountered by the objects of education in the fair possession of educational
    opportunities.


    Shortage of educational resources and issues of educational equity seem unrelated,
    but in reality, when the problem of resource shortage develops into a regional
    issue, the problem of educational equity arises accordingly. Equity issues evolving
    from regional disparities ultimately lead to uneven resource allocation among
    educational individuals. Generally speaking, educational equity issues directly
    manifest as equality of educational opportunity, and the wealth gap is the direct
    cause leading to inequality of educational opportunity. Therefore, the essence
    of educational equity issues is the problem of uneven resource allocation caused
    by the wealth gap of the educational objects themselves.


    Since the Reform and Opening Up, China''s urbanization process has advanced rapidly,
    with cities and rural areas developing quickly. However, some social problems
    have emerged alongside, among which the urban-rural gap has gradually attracted
    social attention. For a long time in the past, the dream of building a great industrial
    power once led the whole society to sacrifice the countryside and the environment,
    focusing on developing urban industry. In this process, while urban economic development
    achieved remarkable results, it also left "sequelae" for social development. The
    urban-rural gap in education is a result of these "sequelae." The development
    of urban education and rural education were originally two lines that would intersect;
    moving towards "integrated urban-rural education" is the ideal goal, but due to
    various limiting factors (such as resources, policies, culture, etc.), the gap
    between them has widened.


    China''s urban-rural education gap manifests as unbalanced development: in relatively
    developed large and medium-sized cities, educational resources are rich and diverse,
    with a large gap compared to suburbs; in the slower-developing western regions,
    the urban-rural education gap is relatively small; but if coastal urban education
    is compared with rural education in western mountainous areas, the gap is even
    more severe.


    Today, in the poor mountainous areas of the west, the focus of education is still
    on intellectual development; "literacy" is the most basic constituent element
    of educational activities. In contrast, in the eastern coastal cities, educational
    development serves the all-round development of the person; while cultivating
    students'' intellect, more emphasis is placed on the comprehensive development
    of students'' "moral, intellectual, physical, aesthetic, and labor" qualities.
    It is not difficult to see from this that in recent years'' National College Entrance
    Examinations (Gaokao), there is a reason why students from poor mountainous areas
    account for a very small proportion of the total enrollment in key universities
    like "Tsinghua, Peking, Fudan, Jiao Tong" [1].


    The urban-rural education gap deserves further deep reflection. In the development
    environment of the urban-rural dual structure, a series of educational problems
    continue to extend, and the subtle gaps can be felt from family, school, to society.
    In terms of the family level, comparing rural families with urban families, their
    concepts of educating children are obviously different. Even if the degree of
    importance attached is the same, rural families are limited by factors such as
    fewer cultural and educational resources, low parental education levels (intergenerational
    transmission of knowledge), and narrow parental social networks, making it difficult
    to compete with urban families. Moreover, the most prone to the disconnect between
    learning and practice are rural families, because the mainstream culture of society
    is in the towns; the alienation between the living environment and the learning
    environment easily causes students'' maladjustment. Of course, even among different
    families within the city, such problems exist, but the relative gap is smaller.


    In terms of the school and social levels, the inequality of urban-rural educational
    resources is also prominent. Looking solely at educational hardware facilities,
    the educational hardware facilities in eastern coastal cities are several grades
    better than rural educational infrastructure, whether comparing cities with rural
    areas, or eastern, central, and western regions. In cities where industrialization
    and informatization develop complementarily, the improvement and upgrading of
    educational infrastructure are rapid. This is related to the city''s educational
    demand, supported by economy and technology, guided by the market, and the city''s
    educational infrastructure quickly reached the national modernization level. However,
    the situation is different in rural and remote western areas. Even today, students
    in information technology classes still need to share a computer among several
    people; many experimental classes still remain at the theoretical level, and platforms
    to support students in doing experiments have not yet been built.


    The problem of educational resource shortage is, at its root, a historical legacy
    of the urban-rural dual structure. Its adverse social reactions will lead to the
    emergence of educational unfairness. In this process, groups possessing "favorable
    timing, geographical advantage, and human harmony" can preferentially enjoy limited
    educational resources. This enjoyment of limited resources will eventually evolve
    into unfair competition in education, deviating to a certain extent from the original
    intention and mission of education.


    It can be seen that the causes of educational resource shortage and educational
    unfairness are diverse, but mainly due to regional differences in economic development.
    Other issues such as biased regional resource allocation, insufficient national
    fiscal investment, and unreasonable educational policies only cause regional educational
    resource shortages to a certain extent. For this reason, all sectors of society
    have been exploring relief approaches for the shortage of educational resources,
    adopting multiple measures such as universal compulsory education, teaching support
    in mountainous areas, charitable donations, and building schools. But to this
    day, the problem of educational resource shortage remains severe.


    Therefore, it requires all people from all walks of life who care about education
    to re-examine the existence of this problem. Is there truly a new path that can
    further resolve this inequality in resources and opportunities, even if it is
    just a small step forward, its value is nationwide benefit.


    ### 2. "Teaching Students in Accordance with Their Aptitude": A Principle Stranded
    in Theory


    "Teaching students in accordance with their aptitude" (Yincai Shijiao) is a very
    core teaching principle, referring to the teacher conducting teaching based on
    the individual characteristics of students in the process of educating them. There
    are no two identical leaves under the sun, and no two identical people in the
    world. Every student is unique; a social group composed of countless unique individuals
    will be colorful and richly diverse. Even in the same family environment, even
    twins, their development will have significant differences. From the perspective
    of pedagogy, heredity, environment, school education, and subjective initiative
    are the four major factors influencing individual student development. Because
    each student is affected by different elements and intensities, they show obvious
    individualized differences in knowledge, emotion, ability, personality, interest,
    moral cultivation, willpower, and other aspects.


    In other words, adopting the same educational method to proceed "mechanically,"
    ignoring the differences in each student''s learning ability, can largely only
    be regarded as completing the educational task; in reality, it has not entered
    the students'' hearts, nor has it realized the value and purpose of education.
    Therefore, if the "teaching students in accordance with their aptitude" can be
    truly realized, it is of extraordinary significance to students and a remarkable
    achievement for teachers.


    As early as 2,500 years ago, Confucius had already recognized the importance of
    teaching students in accordance with their aptitude and put it into educational
    practice. Looking at it now, what a great pioneering work it is, with astonishing
    penetrating power through history. People often say education is a specialized
    profession, where universality and particularity coexist. It is called universal
    because its existence shares commonality with tens of thousands of other professions;
    it can be understood as a means of making a living, or a means of teaching people
    to make a living. It is called special because the object it serves is special;
    it is a job of "teaching people how to be human." Everyone is a member of society,
    so theoretically, educational workers cannot selectively give up on students,
    but need to selectively educate each student.


    Regarding teaching students in accordance with their aptitude, in *The Analects*
    - *Book 11: Advanced Disciples*, there is a story that reflects this vividly.
    One day, after Confucius finished class and returned to the "rest room," while
    the student Gongxi Hua was pouring water for Confucius, Zilu (Zhong You) and Ran
    You arrived separately and asked Confucius the exact same question, but Confucius
    gave different answers. Gongxi Hua was very puzzled and asked the teacher why.
    The specific details are as follows:


    > Zilu asked: "Should one act immediately upon hearing (the Way)?" The Master
    said: "With your father and elder brothers still alive, how dare you act immediately
    upon hearing it?"

    >

    > Ran You asked: "Should one act immediately upon hearing (the Way)?" The Master
    said: "Act immediately upon hearing it."

    >

    > Gongxi Hua said: "Zilu asked ''Should one act immediately upon hearing?'' and
    you said ''With your father and elder brothers still alive''; Ran You asked ''Should
    one act immediately upon hearing?'' and you said ''Act immediately upon hearing.''
    I am confused; may I ask why?" The Master said: "Ran You is retiring and hesitant,
    so I urge him forward; Zilu has the energy of two men, so I hold him back."


    Analyzing carefully, the dialogue between Confucius and the three disciples Zilu,
    Ran You, and Gongxi Hua is full of flashes of wisdom. For the same question, the
    answers obtained were different. In the contrast between Gongxi Hua''s doubt and
    Confucius''s wise explanation, it reflects that Confucius was very familiar with
    his students; knowing their strengths and advantages, he also knew their weaknesses
    and shortcomings, thus he could teach them in accordance with their aptitude.
    After hearing the explanation, the student Gongxi Hua suddenly understood.


    Changing the context: if the "two students" had asked Gongxi Hua this question
    at that time, the answer would probably have difficulty reflecting the wisdom
    of teaching students in accordance with their aptitude. Therefore, reflecting
    on the implementation context of teaching students in accordance with their aptitude,
    it is inevitably fraught with difficulties. With the development of the education
    undertaking to this day, the education system, teaching methods, teaching scenarios,
    and teaching methods have become somewhat fixed. The school, as the main place
    of education, shows obvious insufficient adaptability. The continuous changes
    in students'' ages and learning abilities present a characteristic of fluidity
    in the development process. From kindergarten, primary school, junior high, secondary
    vocational school, high school, junior college, vocational college, university,
    to graduate school, the teachers and environments encountered at each stage are
    different. Education presents characteristics of scale and fixation. Teachers
    find it difficult to balance teaching quality and teaching efficiency simultaneously,
    and can only use "scores" as the most direct evaluation indicator, pursuing the
    rise of collective scores. For the individual, it is difficult to achieve personalized
    care. In essence, this is due to the conflict between fluidity and fixation.


    The school teaching scenario is basically the large-class teaching system. The
    relationship between teachers and students is "one-to-many." Time is tight, tasks
    are heavy. Apart from completing teaching tasks, there is rarely time to pay attention
    to each student''s special situation. Coupled with the very obvious and highly
    variable individualized differences among students, this further increases the
    difficulty for teachers to implement teaching students in accordance with their
    aptitude. Over the long span of education, the relationship between teachers and
    students also shows instability. Teachers naturally change at different teaching
    stages, because it is unrealistic to have a middle school teacher teach graduate
    students. Looking back at the educational context of Confucius teaching students
    in accordance with their aptitude: "Confucius had three thousand disciples, seventy-two
    of whom were accomplished," and most of these students followed Confucius for
    life. This is a very stable teacher-student relationship, so the teacher could
    naturally easily grasp the students'' personalities and tempers, but today''s
    environment does not allow it.


    Regarding teaching students in accordance with their aptitude itself, due to factors
    such as teacher literacy, exam-oriented education indicators, and the unequal
    status of teachers and students, the implementation process is complicated. The
    teacher''s judgment of the student''s "cai" (aptitude/material) is limited to
    the teacher''s experience and imagination. Rigidly teaching students in accordance
    with their aptitude, students easily become "the person the teacher wants to cultivate."
    But such a person is not an innovative person, nor the person the student wants
    to become. Because the implication of teaching students in accordance with their
    aptitude contains the unequal relationship between students and teachers. The
    teacher is the pre-awakened one, the master of knowledge and truth; truth needs
    to be taught by the teacher to the student. Transcending teaching students in
    accordance with their aptitude recognizes that students are gradually developing;
    even if the teacher is older and more experienced, the teacher is also developing,
    and the teacher does not completely master the truth [2].


    Thus, the implementation of teaching students in accordance with their aptitude
    seems too difficult, because it involves too many influencing factors, fundamentally
    relating to the comprehensive consideration of educational theory, educational
    methods, educational means, and student reality. If the unity of theory and practice
    in historical and realistic logic cannot be achieved, then the implementation
    of teaching students in accordance with their aptitude will not conform to the
    laws of students'' physical and mental development and the laws of implementing
    education on students.


    It cannot be denied that over the past many years, the education model of exam-oriented
    education, class teaching system, score-only theory, and "following the class"
    has cultivated countless professional talents for China''s economic take-off and
    made huge contributions. At least as of now, it seems to be more beneficial than
    harmful. But if in the new intelligent era, we can reduce the harm of the "drawbacks"
    to a lower level, and our schools and teachers can strive to achieve teaching
    students in accordance with their aptitude with the help of some technical means
    and methods, then why don''t we do this in advance?


    The essence of "teaching students in accordance with their aptitude" is "knowing
    people well to teach them well, letting everyone exert their talents." Although
    its forms have varied in the long river of history, evolving to today, we can
    call it personalized education, customized education, flexible education, etc.
    Despite myriad changes, the principle remains the same. Teaching students in accordance
    with their aptitude mainly emphasizes that education should vary from student
    to student, "prescribing the right medicine for the illness." It focuses on guiding
    students to go out, and return to their own hearts, to explore and discover that
    different self in a specific context. Only those who find their true selves can
    reconcile with their own world, reach a consensus with the outside world, form
    critical and innovative spirits in the pursuit, and thus move towards a better
    future.


    ### 3. Teacher-Centered Approach: Causing the "Empty Seats, Absent Minds" Phenomenon
    in Education


    A teacher-centered approach is a significant feature of traditional education,
    with specific historical origins. China is a large agricultural country. The traditional
    agricultural society was an "acquaintance society" that "valued agriculture and
    suppressed commerce," and the idea of "being content with one''s native land and
    reluctant to move" was deeply rooted in people''s hearts. The acquaintance society
    relied on blood and geographical ties to maintain relationships among group members;
    interpersonal interactions did not require much professional background knowledge.
    Educational activities among people mostly revolved around agricultural production
    experience, such as mastering climate changes of the four seasons, imparting skills
    of "spring plowing, summer planting, autumn harvest, winter storage," etc., constituting
    the basic content of educational activities in agricultural society.


    If defined in a narrow sense of education, in the traditional agricultural society,
    most people had not received education, and those who truly received education
    were only the upper class or scholarly families. In such an era background, generally
    speaking, people held awe for those wisdoms that restricted them but which they
    could not deeply understand. Therefore, from the perspective of the common people,
    the awe for cultural knowledge stemmed precisely from their deep restriction by
    upper-class intellectuals, giving rise to a thought—as long as one can master
    knowledge, one can also become an upper-class person. With the development of
    social productivity, social production labor became increasingly complex. On the
    premise of the continuous expansion of the national ruling team, the channels
    for the lower society to leap to the upper society gradually opened up. Seeking
    fame and fortune through reading, changing social strata, was a supreme strategy.


    Since one wanted to change one''s destiny, one first had to apprentice to a master
    to learn a skill; "those who understand without a teacher" were few and far between.
    Thus, the teacher, as a professional representative, stepped onto the historical
    stage. "The teacher is one who transmits the Way, imparts knowledge, and resolves
    doubts." The teacher is the one who understands the Way, the one with extensive
    knowledge, the wise man who is well-educated and reasonable. Comparatively speaking,
    they have more angles to view the world than the ignorant. So, it is only natural
    that they receive special esteem and respect from society. This is the source
    of the traditional "dignity of the teacher''s way," and also the reason for the
    early culture of "teacher-centered" formation in educational activities. During
    this period, the students'' ignorance indeed required a "teacher-centered" approach
    to facilitate their learning of more knowledge and wisdom. In the early and middle
    stages of the formation of this educational feature, "teacher-centered" indeed
    played an important role in the cultivation of social talents.


    However, with the continuous development of education and the continuous improvement
    of educational levels, the concept of "teacher-centered" has continuously attracted
    criticism and has been proposed as an object of reform in recent years'' radical
    educational reform thoughts. It calls for re-recognizing this problem and letting
    students return to the teaching activities—calling for "student-centered."


    "Teacher-centered" reflects an authority culture, including teacher authority,
    knowledge authority, textbook authority, etc. In a specific sequence, it originates
    from people''s respect and awe for knowledge, leading to the recognition of textbook
    authority, which then evolves into teacher authority.


    Therefore, the criticism of teacher authority in the education circle in recent
    years, in essence, is the criticism of knowledge authority. Due to the diversity
    of knowledge acquisition channels, the difficulty of knowledge value realization,
    or the influence of some "uselessness of reading" thoughts, the authority of knowledge
    and the situation of teachers'' monopoly on knowledge have been gradually broken,
    and naturally, the authority of teachers has begun to be questioned.


    At a deeper level, the teacher-centered approach easily causes the "empty seats,
    absent minds" phenomenon in education (Ren Xue Kong Chang)—this is the fundamental
    reason it suffers criticism. As for teacher authority, its value is self-evident,
    but when its existence begins to hinder student development, making students dislike
    the classroom, the phenomenon of "students physically present but minds absent"
    forms. In such a classroom, students may have begun to sprout the idea of "muddling
    through, getting the diploma and leaving." As for exploring and constructing new
    knowledge, that has nothing to do with them. This may be the greatest misfortune
    existing in educational activities.


    When people''s educational thoughts gradually develop and mature, they increasingly
    understand that the value of education lies in guiding students to conduct self-education.
    In the process of self-education, students hope to construct a person capable
    of self-reflection and self-growth with an independent personality. Therefore,
    a view opposing "teacher-centered," the "student-centered" view, has received
    deep attention. At this time, the teacher must inevitably undergo some role transformation,
    needing to reappear before students with a new image. Of course, this is difficult
    to achieve in a short time; it requires a period of adaptation.


    In summary, under the new era background, teacher-centered, textbook-centered,
    students can only passively accept knowledge, and the social nerves are averse
    to it. "Knowledge-only education" and "score-only education" will only further
    obliterate students'' creativity and critical thinking. Cultivating students with
    "independent spirit and free thought" lacks scientific basis in this model.


    Historically, the educational selection function of "excelling in learning leads
    to officialdom" required students to master rigid historical classics to be valued
    by the government. But looking at now, society''s requirements for students are
    not this, but focus on examining a student''s ability to discover, analyze, and
    solve problems in a specific environment. Therefore, today''s educational reform
    must care about the return of students'' subject status, correct the unequal teacher-student
    relationship, let students become the subject of learning, and let teachers become
    the planners, designers, and guides of teaching activities.


    Change is the goal; how to change is the means. In the intelligent era, how to
    conduct educational reform to keep pace with the times is an issue that needs
    further exploration.


    ### 4. Rapid Knowledge Update: Education Disconnected from Social Development


    We live in an era of knowledge explosion. The speed of knowledge update is astonishing,
    the boundaries of knowledge continue to expand outward, the structure of knowledge
    continues to undergo new fission, and the half-life of knowledge is shortening
    day by day.


    The half-life of knowledge refers to the process of change of a new knowledge
    from useful to useless, from brand new to obsolete, within a certain period. It
    reflects the effect of the value of certain knowledge decreasing with the passage
    of time. The Law of Knowledge Depreciation believes that if you do not study for
    a year, 80% of all the knowledge you possess will depreciate. More data shows
    that "updating knowledge and ideas at a rate of 6%–10% per year is necessary to
    adapt to the needs of future society," which is not alarmist [3].


    Research shows that after humanity entered the 19th century, the speed of knowledge
    update doubled every 50 years; entering the early 20th century, it doubled every
    10 years; entering the late 1980s, it doubled every 3 years; entering the early
    21st century, it doubled every year, or even faster... The era of knowledge explosion
    is also an era of knowledge economy. Those who can quickly keep up with the speed
    of knowledge update can better adapt to social development and changes. From the
    above comparison, it can be known that the knowledge accumulation of the past
    hundreds of years may not be as much as the accumulation in just one year or a
    few months at present. Knowledge is updating and iterating every day; everyone
    is a creator, sharer, and beneficiary of knowledge.


    *The Book of Rites: The Great Learning* says: "If you can renew yourself one day,
    renew yourself every day, and renew yourself again the next day." This means that
    for one''s own knowledge, if one can update it for one day, one should keep updating
    it daily, and on the basis of updating, continue to update. The ancients were
    like this; in today''s intelligent era, people should do so even more.


    Generally speaking, the speed of knowledge update is the most critical knowledge
    element in the education system. Then, can our education system quickly adapt
    to this fast-paced change? This question is very worthy of deep thought, because
    it directly relates to the quality and effect of education.


    The fast-paced culture of society—fast food, takeout, express delivery, coffee
    shops, Didi express cars, etc.—all reflect the "fast attribute," "fast life,"
    and "fast culture" of the social rhythm. The formation of the fast culture atmosphere
    is the result of everyone jointly accelerating the rhythm of life, work, and study.
    Therefore, to respond to the "fast culture," the education system must also keep
    up with the rhythm, but from the current critical attitudes of people, it is not
    difficult to know that the progress of reform seems unsatisfactory.


    Society is a complex giant system. Its complexity determines the diversity and
    systematicity of talent cultivation. Unilateral knowledge education far from meets
    this requirement. Those who have truly worked hard on all-round development will
    inevitably have more opportunities to win first in social competition with others.
    The reason is simple: under the same conditions, they can create more social value
    and personal value in a shorter time. This should be the goal that "fast-paced"
    educational reform aims to achieve.


