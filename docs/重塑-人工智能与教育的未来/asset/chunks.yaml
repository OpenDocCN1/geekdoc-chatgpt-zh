    # Technical Applications and Development of Smart Campus


    ## (III) Artificial Intelligence and Campus Smart Lighting System


    The integration of artificial intelligence technology with campus lighting systems
    has given birth to the campus smart lighting system. The campus smart lighting
    system refers to the application of technologies such as big data, cloud computing,
    and artificial intelligence in the management, service, and operation & maintenance
    processes of campus lighting systems, comprehensively improving the utilization
    efficiency of lighting resources and the control capability of lighting systems,
    thereby constructing an intelligent platform for the smart campus lighting system
    that integrates functions such as data collection, data storage, data analysis,
    data optimization, precise decision-making, and resource prediction.


    The campus smart lighting system is a new generation of lighting systems developed
    on the basis of traditional campus lighting systems. Before intelligent technology
    was integrated with the campus lighting system, there were relatively obvious
    resource waste problems. Traditional campus lighting systems either designated
    a campus-wide lights-out time or designated that lights stay on all night; the
    result was low resource utilization efficiency, causing serious waste of lighting
    resources, or the lighting needs of teachers and students not being effectively
    met. "Lights on when people leave" and "lights off when people come" are common
    issues in traditional campus lighting systems. To solve these "two major problems"
    existing in campus lighting systems, the unmanned and intelligent lighting concept
    supported by artificial intelligence technology has undoubtedly become a focus
    of smart campus construction.


    After the smart campus lighting system nests artificial intelligence technology,
    the campus lighting network begins to become intelligent. At that time, the campus
    lighting system can be controlled omnidirectionally through intelligent terminals,
    achieving "one-key multi-control," saving the labor cost of manually executing
    light-switching tasks. Moreover, the smart campus lighting system based on algorithm
    models enables the brightness of each lamp to change with the surrounding environment.
    It can adjust the overall brightness of the lights according to the ambient light
    brightness and adjust the lights in occupied areas to the most suitable brightness.
    Through the application of intelligent sensing technology and edge computing technology,
    when daytime arrives, some lights of the lighting system will turn off; for the
    interlayers between densely populated floors, due to weak peripheral light, the
    lighting system remains operational. As long as teachers or students pass by,
    it can achieve the goal of "lights on when people come, lights off when people
    leave" with the help of intelligent sensing technology. Therefore, the smart campus
    lighting system has relatively outstanding value in three dimensions: energy saving,
    environmental protection, and comfort.


    The smart campus lighting system can also realize functions such as remote meter
    reading, intelligent fault detection, power grid danger location, illegal electricity
    use warning, and current control. The work that previously required manual meter
    reading is now entirely handled by the backend processor of the smart lighting
    system. For example, with the help of specific algorithm models, the system can
    calculate fees based on the actual lighting power consumption data of each dormitory,
    and inform students of the results via the smart campus lighting system platform
    and SMS. Students can pay remotely on the smart lighting platform, which not only
    provides convenience for students'' lives but also saves a lot of time and energy
    for the staff of the campus lighting consumption system, overall reducing the
    operating costs of the lighting system.


    With the help of the campus smart lighting system, the smart campus becomes more
    comfortable and pleasant. In summary, the value of the campus smart lighting system
    is reflected in two aspects: On the one hand, it creates an intelligent light-sensing
    environment for all teachers and students. Supported by a series of energy-saving
    and environmental protection technologies, the entire lighting system can fully
    utilize peripheral natural light to achieve energy-saving purposes, improving
    the overall living environment of teachers and students, which is conducive to
    improving their work and study efficiency. On the other hand, it improves the
    overall management level of the campus lighting system, realizing the transformation
    from "manual" to "intelligent." Many management ideas and concepts can be implemented
    therein, while greatly reducing the operation and maintenance costs of the school
    lighting system and saving overall campus expenditure.


    ## (IV) Artificial Intelligence and Smart Teaching Management System


    The smart teaching management system refers to the process by which schools fully
    utilize new management means and methods to enhance the "presence" state of teachers
    and students. Supported by multi-source heterogeneous teaching big data, teaching
    management algorithm models, 5G rapid transmission technology, cloud storage,
    and ultra-high-speed computing, people have begun to discuss the advantages and
    disadvantages of traditional teaching management models.


    In traditional campus teaching management, due to imperfect campus supervision
    mechanisms, limited numbers of supervision staff, and supervision technology limited
    by software and hardware levels, there are many limitations in teaching management.
    High-quality management activities originate from high-quality decision support,
    and high-quality decisions originate from comprehensive mastery of decision data.
    Only by fully utilizing objective and comprehensive teaching big data can managers
    make correct decisions. Teaching management generally includes methods such as
    planning, organizing, coordinating, and controlling, but confined by the fragmentation
    and single-dimensionality of traditional managers'' data collection, even the
    most scientific management strategies are to no avail.


    Traditional teaching managers make management decisions based on partial data.
    For teachers and students in teaching activities, teachers are in a managed position,
    and students are in a dominated position. Teaching management activities cannot
    fully reflect the will of teachers and students. Therefore, teaching management
    activities become the privilege of managers; the participation rights and rights
    to know of teachers and students are separated; the "two-way feedback" mechanism
    of teaching management is immature; the subject status of students is restricted;
    teachers lose the initiative in planning teaching activities and become listeners
    and executors. It can be seen that the school''s traditional teaching management
    is actually the manager''s business, not the common business of all teachers,
    students, and administrative staff, thereby restricting the scientific process
    of school teaching management and also constraining the formation of critical
    thinking environments and innovative thinking environments.


    To solve the drawbacks existing in traditional teaching management, introducing
    emerging technologies to assist in expanding the "two-way feedback" channels and
    platforms of teaching management has become an important link in the intellectualization
    and intelligence of teaching management. The construction of smart teaching management
    is divided into three dimensions: first, a learning management system oriented
    towards students; second, a teacher management system oriented towards teachers;
    third, an academic affairs system oriented towards managers. The first two systems
    are interactive, and the teacher management system can efficiently mobilize learning
    data from the learning system and control the learning system''s operation interface
    through specific algorithms. The learning management system can feed back learning
    data to the teacher management system in a timely manner, and the teacher system
    is directly connected to the academic affairs system.


    ### Learning Management System


    Specific functional modules include student information management, student online
    learning management, student academic performance management, student learning
    situation statistical analysis, student learning course progress management, learning
    process recording and tracking, online interactive learning platform, student
    learning feedback management, etc. In this system, besides teachers being able
    to quickly mobilize their data, students can also shuttle through it relatively
    freely. For example, querying grades, viewing their own learning progress, freely
    selecting video learning resources in the system, downloading course files they
    want to study in depth, etc. It can be seen that this system provides very convenient
    channels for students'' learning, while also providing technical support for teachers
    to deeply understand students.


    ### Teacher Management System


    Specific functional modules include teacher information management, teacher performance
    management, teacher teaching progress management, teacher homework correction
    system, teacher question-setting platform, teacher information feedback platform,
    student learning situation docking ports, etc. In this system, teachers complete
    login authentication through faculty identity authentication codes and can run
    all functions in the system. For example, teachers can use the teacher system
    to achieve one-click access to the specific teaching progress of a certain subject
    in a certain class recently, understand the specific learning performance of students
    in the course, and conduct pre- and post-learning performance tests for students,
    thereby timely improving teaching progress and teaching methods, promoting the
    adaptation of educational teaching work to the student learning process and individual
    student learning situations.


    ### Academic Affairs Management System


    School managers can use this system to understand students'' learning situations
    and teachers'' teaching situations, as well as teachers'' teaching progress and
    effectiveness, students'' learning situations and effectiveness, teachers'' overall
    professional quality and professional image, students'' evaluations and feedback
    on teachers, and teacher and student satisfaction with school management work,
    etc. From the perspective of systems theory, the student learning system is the
    core and key of the entire smart teaching management system, while the teacher
    teaching system and the school academic affairs management system serve directly
    for student learning. The construction concept of the entire smart teaching management
    system is "student-centered, majors serving students, achieving students'' future,"
    highlighting the educational value of "cultivating virtue and nurturing people."


    From the perspective of management science, students, teachers, and schools achieve
    connection in a "virtual field," filling the "understanding gaps" between the
    three caused by distance and time, thereby constructing a smart ecological management
    system where the virtual and the real "reflect wisdom into each other" in the
    smart campus, undoubtedly achieving the goal of "dual leap" in management efficiency
    and management quality.


    The entire smart teaching management system forms a "student-centered" intelligent
    management framework, and its greatest value is naturally reflected in students''
    learning effects.


    First, it can provide students with learning materials such as multimedia courseware
    and learning resources. Students can select learning content on demand according
    to their own situations and reasonably arrange study plans. This is conducive
    to cultivating students'' good habits of independent learning and lifelong learning.
    At the same time, the intelligent teaching management system can also provide
    students with space to store learning achievements and record learning feelings,
    forming student growth portfolios, allowing teachers to better conduct process
    evaluations of students'' learning activities[⁷].


    Second, it can save students time spent searching for learning resources, formulating
    study plans, and summarizing knowledge blind spots. While reducing students''
    learning tasks, it also provides free time for students'' free development.


    Finally, in the learning process, students can receive personalized emotional
    attention from teachers and intelligent learning recommendations from the intelligent
    learning system, reflecting students'' personal value and teachers'' humanistic
    care for students. Teachers'' love for students no longer stays at "empty talk."
    From the perspective of cognitive behaviorism, teachers can let students know
    the specific reasons for each reward or punishment, making the shaping of students''
    behavior more rule-based.


    The value of the smart teaching management system is not limited to this; it can
    also reduce teachers'' workload and provide school managers with a mobile office
    platform, etc. All these highlight the "wisdom" of the Campus 3.0 era. In the
    intelligent era, although artificial intelligence will not completely replace
    humans in managing campus teaching work, schools that do not use artificial intelligence
    technology in teaching management activities are destined to be at a disadvantage
    in the competitive education system. Therefore, the upgrading of the smart campus
    teaching management system should actively introduce new-generation information
    technology and new-generation artificial intelligence technology and take them
    as the foundation to comprehensively improve the quality of teaching management,
    thereby enhancing the overall educational quality of the school.


    ## (V) "Campus One Card" Moving Towards "Campus One Face"


    In 1999, Fuzhou Yinda Company took the lead in launching the Bank-School One Card
    system, which was the earliest campus one card system. After perfecting its payment
    function, it was soon promoted to campuses across the country, bringing a lot
    of convenience to school management and service work. Based on this, many companies
    also began to enter this field, continuously improving and enriching the technical
    architecture and platform service areas of the campus one card. Today, domestic
    campus one cards have basically achieved full coverage.


    The campus one card is a comprehensive application tool supported by technologies
    such as the Internet, Internet of Things, and computers. It has functions such
    as identity authentication, campus consumption, teaching attendance, school medical
    treatment, and activity sign-in. It is an essential activity credential for every
    student in the Campus 3.0 era. It integrates the categorized applications of traditional
    campus students'' "one person, multiple cards," realizing the campus application
    goal of "one card for all uses." In terms of its concept itself, the campus one
    card features multi-card integration, digital identity, and human-computer interaction
    credentials.


    Campus one cards can be divided into student cards oriented towards students,
    faculty cards oriented towards faculty and staff, and temporary cards oriented
    towards personnel active on campus for short periods. These three types of cards
    are all processed using real-name identity authentication methods, serving as
    independent credentials for personal campus activities. However, if the campus
    card expires or a fake campus card is processed, activity behaviors in the school
    will be restricted. In other words, this is the very purpose of the existence
    of the campus one card: to facilitate the management and service of an "open and
    complex" campus system.


    Different campus eras, from the "paper hanging 牌" campus cards ("one life, multiple
    cards") to "digital machine-readable" campus cards, the evolution of students''
    campus identity authentication methods all reflect the history of campus development
    and are closely related to the entire social environment. Then, in the era of
    artificial intelligence, during the construction of the smart campus, what face
    will the campus one card appear with?


    On June 27, 2018, the official WeChat account of Beijing Normal University released
    a message stating that the school would use facial recognition access control
    systems in all dormitory buildings, meaning that Beijing Normal University would
    enter the comprehensive "brush face" era. This also means that, as a top normal
    university in China, taking the lead in implementing the management and application
    of artificial intelligence technology entering the campus will open a new era
    of "Campus One Card" applications, and the "Campus One Card" begins to move towards
    "Campus One Face."


    Since the transformation from "Campus One Card" to "Campus One Face," its application
    has begun to spread continuously. On July 27, 2018, Peking University began operating
    "Campus One Face" at the Southwest Gate. In its access control system, breaking
    through the drawbacks of traditional 1:1 facial recognition technology, it adopted
    1:n real-time facial recognition technology, supported by a database of 100,000
    photos. Every time a student enters the school, it only takes one second to achieve
    precise matching of facial features, thus passing the campus access control system.


    On December 3, 2018, Shimen Middle School in Foshan City, Guangdong Province,
    fully launched the facial recognition intelligent system. The school main gate
    and dormitory area gates all use "brush face" for entry and exit. This "brush
    face" system also records student leave, late arrival, and other attendance situations.
    Foshan schools have ushered in the "brush face" era. It can be seen that "brush
    face" will become the new normal of future smart campuses, and students will no
    longer be troubled by issues such as "card loss, forgetting, wear and tear, replacement,
    card replacement, theft."


    Today, with the continuous improvement of intelligent facial recognition technology,
    the application of "Campus One Face" has begun to become popular, attracting the
    interest of relevant researchers. "Campus One Face" is an upgraded version of
    "Campus One Card." It is an intelligent application system based on new-generation
    information technologies such as the Internet of Things, big data, cloud computing,
    and artificial intelligence. Its specific application systems include: facial
    recognition access control system, facial recognition dormitory management system,
    facial recognition campus payment system, facial recognition campus security system,
    facial recognition campus registration system, facial recognition teacher attendance
    system, facial recognition library system, facial recognition class management
    system, etc. The application of "Campus One Face" plays an important role in promoting
    the intellectualization process of the smart campus, allowing teachers and students
    to truly experience the real existence of the smart campus from the application
    level.


    The reaction speed of artificial intelligence recognition technology is extremely
    fast, making the construction and layout quality of "Campus One Face" in smart
    campus construction better and office efficiency higher. For example, if a stranger
    appears on campus, in the traditional "Campus One Card" system, the access control
    system is manually guarded, inevitably leading to work errors due to fatigue and
    exhaustion. However, after introducing the "Campus One Face" system, the campus
    access control system is online 24 hours a day. As long as a stranger visits,
    registration information can be realized immediately, overall improving the security
    level of the smart campus. In addition, artificial intelligence recognition technology
    can randomly check student attendance and learning situations at any time. For
    example, if academic affairs personnel want to understand a student''s learning
    situation, they can directly use the "Campus One Face" intelligent recognition
    system to understand whether the student''s time for eating in the cafeteria is
    regular, the number of times the student goes to the library, whether the student
    returns to the dormitory to punch in at the designated time, etc. These can all
    reflect the student''s learning situation and recent behavior habits and activity
    range from the side. Based on these data, combined with the student''s academic
    performance, the reasons for abnormal fluctuations in the student''s grades can
    be analyzed in detail, so as to take corresponding intervention measures.


    From the value dimension, the intelligent "Campus One Face" not only helps to
    enhance campus security work and intelligently identify students'' learning situations
    but also facilitates student entry registration. However, everything has two sides.
    The normal operation of "Campus One Face" requires prior facial data collection
    and storage, and then data comparison based on the database. That is to say, for
    "Campus One Face" to operate normally in a school, it must accurately collect
    and store the facial information of all teachers and students in the school, thereby
    forming big data about "Campus One Face." Therefore, the privacy protection issue
    of all teachers and students has become the biggest headache for the school. Because
    this data relates to the personal safety and property safety of teachers and students,
    if the campus database is attacked by criminals, or if the campus database''s
    own confidentiality work is not done well, the negative impact on teachers and
    students is huge. In addition, the information collected by "Campus One Face"
    facial data has limitations. When dealing with changes in teachers'' and students''
    clothing, hairstyles, facial expressions, and other factors in the later stage,
    recognition errors will occur, sometimes becoming obstacles to teachers'' and
    students'' work and study.


    Therefore, to address the privacy protection issues and recognition error issues
    brought by the "Campus One Face" system, schools should strengthen cooperation
    and communication with service outsourcing parties, improve the accountability
    mechanism for problems, clarify possible dangerous vulnerabilities, and prepare
    relevant technical remedial plans in advance; they should strictly encrypt and
    store the campus facial database, introduce "hacker" technology, block possible
    intrusion channels for hackers, and embed intelligent early warning mechanisms
    on various intrusion channels to pop up early warning prompts when invaded, so
    that the school can close data flow channels in time to ensure the security of
    school big data; finally, schools should cultivate and introduce intelligent composite
    talents to provide the necessary talent foundation for the smart "Campus One Face"
    system.


    # Three, The Future Classroom: Conceptions on the Smart Classroom


    ## (I) The Relationship Between Classroom and Class


    For traditional education, the classroom becomes everyone''s first impression.
    The song "Childhood" sings like this: "The teacher''s chalk on the blackboard,
    still writing non-stop desperately... Always have to wait until before sleep to
    know that only a little homework was done, always have to wait until after the
    exam to know that the books that should have been read were not read..." From
    the lyrics, we can quickly outline a picture of the classroom: the teacher explaining
    important knowledge points; a group of children gathered into a class, writing
    furiously. In this picture, teachers, classrooms, class, teaching materials, and
    students complement each other; the classroom and class merge into one. Therefore,
    whenever people mention the relationship between the classroom and class, they
    are very confused and find it difficult to effectively distinguish the two. So,
    what exactly is the relationship between the classroom and class?


    In traditional education, "teachers," "teaching materials," and "class" constitute
    the "three centers" of teaching. The teacher holding a teaching material teaching
    students in the classroom is the most intuitive impression the traditional class
    gives people, and this is also the common experience of students'' student careers
    in the past. During this period, the classroom and class coexisted, and everyone''s
    understanding of the two was only coexisting in a memory. Some even directly equated
    the two, believing that the classroom and class are synonyms, both referring to
    the place where teachers engage in educational activities and students engage
    in learning activities. However, with the development of education, people gradually
    discovered that the existence of the class is not limited to the classroom but
    exists in places with teaching activities. Therefore, the view that the classroom
    and class are equivalent has been challenged.


    The understanding of the essence of things becomes more and more real in the evolution
    of history, and the dialectical relationship between the classroom and class is
    the same. In the era of artificial intelligence, the emergence of emerging technologies
    has impacted the traditional forms of the classroom and class. People gradually
    realize that both the classroom and class are activity places for teaching activities.
    Because before the emergence of emerging technologies, classes basically all took
    place inside the classroom, so it was difficult for people to distinguish the
    relationship between the two.


    In the intelligent era, the concepts of class and classroom have also changed.
    Both the class and the classroom are places for teaching activities, but the former
    has a wider scope, not only referring to teaching activities in the classroom
    but also including various teacher-student interactions, student-student interactions,
    and other activities; the class is a combination of physical attributes and virtual
    attributes. The classroom refers to a room specially used for teaching activities,
    a physical space; the classroom is closely combined with the class only when teaching
    activities are taking place.


    Therefore, strictly speaking, the class is ubiquitous. It is an abstract concept.
    As long as one wants to learn, any time, any place, any scene can be a class,
    while the classroom is a physical place that people can truly see. In terms of
    origin, the class existed earlier than the classroom. Only when specialized private
    school education and school education appeared did the classroom come into being.
    In terms of connection, the moment when the classroom and class combine most closely
    is manifested in the teaching activities of the class-teaching system form.


    With the development of artificial intelligence technology, the debate about the
    classroom and class has appeared again. The question of how the classroom and
    class should combine has become a problem of concern to people in the new era.
    In the intelligent era, human-computer interaction technology is maturing day
    by day. The artificial intelligence education revolution catalyzed by intelligent
    technology requires the construction of the smart campus to be implemented in
    every corner of the school. Teachers'' teaching thinking, the school''s basic
    education software and hardware facilities, students'' learning thinking, etc.,
    all need to undergo an innovation. As the main place for teaching activities in
    the smart campus, the intelligent transformation of the classroom will be an important
    task in the construction of the smart campus.


    ## (II) Construction and Application of Smart Classroom


    The construction of the smart campus, the technological transformation of teaching
    activity places such as classrooms, and the upgrading of software and hardware
    service platforms have enabled the emergence of the smart classroom. The smart
    classroom refers to the process of promoting the intellectualization and intelligence
    of teaching activity places and education channels based on emerging technologies
    such as the Internet of Things, big data, cloud computing, and artificial intelligence.
    From the perspective of specific classroom forms, answers still need to be found
    in corresponding applications. For example, when Pingdu City, Shandong Province
    launched the synchronous classroom (smart classroom) project, it pointed out that,
    supported by campus software and hardware facilities, it would further carry out
    smart classroom construction work, specifically introducing and practicing aspects
    such as classroom software and hardware facilities, course recording, and remote
    interaction, pointing out three dimensions of smart classroom construction, requiring
    both attention to the recording of real data and attention to the smooth flow
    of interaction channels between teachers and students. In terms of smart campus
    construction, the main realization place for the three dimensions of the smart
    classroom still needs to be centered on the smart classroom. The smart classroom
    is shown in Figure 8-2.


