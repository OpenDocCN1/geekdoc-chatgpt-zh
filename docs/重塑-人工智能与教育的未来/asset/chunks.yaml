  trans: '

    # Evolution and Development of Teacher Roles in the Intelligent Era


    The teacher role represents the expectations and requirements of society regarding
    teachers'' capabilities and status; it is a concentrated manifestation of teacher
    identity. Because teachers'' labor possesses characteristics such as complexity,
    creativity, long-term impact, and exemplarity, the enactment of teacher roles
    carries multiple attributes. Good teacher roles hold significant importance for
    the growth and development of students.


    The evolution and development of teacher roles are deeply imprinted with the marks
    of the times. From a deeper perspective, the teacher''s role is bestowed by society;
    it is a re-manifestation of social expectations and requirements within the teacher''s
    identity. Therefore, a good teacher role must be one that integrates with the
    overall educational environment and is inextricably linked to student development.
    Consequently, the evaluation of teacher roles must be measured within a specific
    historical context, rendering the distinction between "traditional" and "modern"
    meaningless. However, history is an organic whole; the division of history into
    specific time-space segments inevitably has limitations. The spatiotemporal evolution
    of teacher roles—"historical legacies" and "disconnection from the times"—arouses
    our concern for the "traditional."


    With the continuous development of the intelligent era, the anachronism of traditional
    teacher roles has intensified. In the intelligent era, educational development
    presents characteristics of intelligence and boundlessness. Educational activities
    and issues in the fields of educational resources, methods, content, and evaluation
    will all become intelligent and boundless, bringing tremendous impact to the entire
    human education system. Naturally, teacher roles adapted to traditional educational
    models will face corresponding challenges. The traditional teacher role, people''s
    initial impression of which is "imparting knowledge, teaching skills, and resolving
    doubts" (传道授业解惑), retains its value even today.


    People''s understanding of the "Dao" (Way/Truth) in "imparting the Dao" is a microcosm
    of the traditional teacher role. In the past, people believed that the "Dao" meant
    principles and knowledge, and the teacher''s role was to explain knowledge and
    principles to students and supervise the rigid completion of learning tasks. In
    the teaching process, students were viewed by teachers as "students" or "learners
    to be perfected," conceptually forming an unequal status between teachers and
    students, with teachers becoming controllers rather than participants in the traditional
    classroom. This not only made students passive recipients of knowledge in teaching
    activities but also reduced them to objects of knowledge and principle instillation,
    hindering the process of students'' individualized development and restricting
    the cultivation of critical and creative thinking abilities.


    Education is an activity that cultivates people; it should focus on developing
    students'' abilities to discover, pose, and solve problems. However, in the process
    of traditional teacher role enactment, "teachers pose problems, students solve
    teachers'' problems" became the main content of teacher-student interaction. In
    the AI era, social problems are innumerable, and students'' problem awareness
    is constantly increasing. Merely learning to solve problems posed by teachers
    makes it difficult for students to form independent thinking abilities, particularly
    the abilities for self-questioning and self-seeking of truth. From this perspective,
    the AI-era classroom cannot merely be a place where teachers propose a series
    of problems for students to solve; rather, it requires teachers to guide students
    to pose their own problems and then solve them, because posing a problem is more
    important than solving it^([\[1\]](#txt005.html#footnote_content_txt005_1)).


    In the new intelligent era, the drawbacks of traditional teacher roles are increasingly
    manifest. In this state, teacher role images such as "gardener," "engineer," and
    "candle" gradually transform, and teacher roles begin to show a new return—a return
    to the "ordinary" role. In the AI era, the evolution and development of teacher
    roles, based on the inheritance of excellent traditional roles, respond to society''s
    new demands and expectations for teachers. Correspondingly, a major shift in teacher
    roles has emerged as the times require.


    In the process of empowering education, intelligent technology liberates educators
    and educational administrators from complex educational activities, such as assigning
    homework, grading homework, setting exam questions, and semester evaluations.
    All these activities will, with the support of intelligent technology, greatly
    save teachers'' time and energy, giving them more time and space for exploratory
    teaching work. Today, in the intelligent social environment, "co-learners," "resource
    integrators," "teachers of fishing methods" (those who teach how to learn), and
    "personalized instructional planners" are becoming the latest synonyms for teacher
    roles.


    ## Co-learner


    In the AI era, the return of the teacher role from "sage" to "ordinary person"
    enables the effective establishment of an equal relationship between teachers
    and students. As Paulo stated: "The most surprising consequence of the technological
    revolution is its challenge to the authority of experts. Because it can break
    through any man-made constraints^([\[2\]](#txt005.html#footnote_content_txt005_2))."
    That is to say, the fifth educational revolution triggered by AI technology directly
    impacts the authority of traditional teachers. The traditional teacher authority
    as the controller of "knowledge" and "principles" gradually transforms, and teachers
    and students begin to move toward a new model of cooperative learning, with teachers
    appearing in teaching situations as co-learners. Teachers become guides and interactors
    in cooperative learning. In the traditional "one-way instillation" teaching situation,
    given the explosive growth of knowledge and the enhanced fluidity of teaching
    tasks, the "one-to-many" relationship between teachers and students indirectly
    increases the teaching burden on teachers. Undeniably, in exploring new knowledge
    in the new era, an individual teacher''s strength cannot compare with the collective
    learning wisdom of the student group. Therefore, in the AI era, to maximize the
    realization of educational goals, teachers must integrate themselves into the
    student group, learn together with students, understand students'' needs, grasp
    students'' characteristics, learn students'' social languages, and accompany students
    in constructing new cognition.


    ## Resource Integrator


    In AI-era education, the construction of intelligent education system platforms
    provides convenient channels for teachers and students to access educational resources.
    Traditional teachers, when conducting teaching activities, mainly used textbooks
    as teaching resources; other supplementary materials basically did not require
    teachers to integrate them themselves but were purchased directly according to
    the established syllabus. Therefore, the teacher''s role as a resource integrator
    was not prominent. However, in the AI era, due to the integration of educational
    big data, educational resources present "4V" characteristics (Volume, Velocity,
    Variety, Veracity), so much traditional curriculum and textbook content has become
    obviously outdated. Coupled with the needs of the times for students, teachers
    must handle the relationship between textbooks and new curriculum resources well,
    and comprehensively use intelligent technology to explore diversified educational
    resources to meet the practical needs of society and students. With the continuous
    emergence of diversified educational resources, educational resource big data
    grows daily. Under such era conditions, teachers urgently need to cultivate their
    own resource integration capabilities in order to quickly excavate educational
    resources beneficial to student growth from the "mixed bag" of educational resources.
    Thus, the role of the teacher as a resource integrator in the intelligent era
    is forged.


    ## Teacher of Fishing Methods (Empowerer)


    With the continuous development of the intelligent society, the phenomenon of
    cross-disciplinary integration is becoming increasingly common. Humanities and
    natural sciences penetrate each other, and massive amounts of knowledge pour into
    the education field, undergoing new iterations and updates in an extremely short
    time. As the saying goes: "Give a man a fish and you feed him for a day; teach
    a man to fish and you feed him for a lifetime." In other words, teaching students
    learning methods is more meaningful than simply letting them master existing theoretical
    knowledge in textbooks, because only those who master scientific learning methods
    suitable for themselves can adapt to a rapidly changing society through continuous
    learning. Therefore, when a contradiction arises between students'' learning and
    knowledge iteration, teachers need to "take the lead," act as guides in learning,
    guide students starting from learning methods, and help students improve their
    learning abilities, rather than letting students exhaust themselves "cramming"
    new knowledge. In the intelligent era, the teacher''s role is the person who teaches
    students *how* to learn—the true "teacher of fishing methods."


    ## Personalized Instructional Planner


    Since ancient times, the concept of personalized teaching (teaching students in
    accordance with their aptitude) has been deeply rooted in people''s hearts, but
    constrained by realistic conditions, true personalized teaching has not been realized.
    However, with the continuous development of new-generation technologies such as
    the Internet of Things, big data, and artificial intelligence, teaching platforms
    supported by emerging technologies have emerged. On this basis, students'' learning
    status data will achieve visualization, and students'' learning patterns and development
    patterns will be clear at a glance. In this case, if teachers want to understand
    an individual student''s learning situation, they only need to open the corresponding
    data platform on a mobile terminal to view the student''s personalized learning
    status data at any time. Based on this, the formulation of teachers'' teaching
    plans can, on the original basis, execute two sets of teaching plans: one is a
    public teaching plan for all students, and the other is a personalized teaching
    plan for individual students relying on the intelligent learning platform. In
    the future, with the continuous transformation of educational concepts, the "facing
    all" teacher role begins to fade, while the "facing the individual" teacher role
    gradually takes center stage on the historical stage, becoming the main component
    of the teacher role.


    AI empowers human teachers; emerging roles such as co-learner, resource integrator,
    teacher of fishing methods, and personalized instructional planner converge on
    human teachers, enriching and developing teacher roles unprecedentedly. As teacher
    roles continue to enrich, people''s understanding of "imparting knowledge, teaching
    skills, and resolving doubts" deepens, entering the true connotation of "imparting
    the Dao" as spoken of by Han Yu. Han Yu said in "On Teachers": "Those who receive
    the book and practice its sentences and readings are not what I call transmitting
    the Dao and resolving doubts." In the AI era, the enactment of teacher roles is
    by no means the simple understanding of lecturing "knowledge" and imparting "principles"
    as traditionally understood, but rather, with the support of intelligent technology,
    teachers'' comprehensive recognition and mastery of educational laws, returning
    to a firm grasp of the "Dao."


    The enrichment and development of teacher roles in the AI era hold significant
    significance for establishing "teacher authority," improving "teacher-student
    relationships," and promoting the comprehensive development of students. Jaspers
    believed there are two types of authority: one is inner authority, the other is
    outer authority. Inner authority mainly comes from the power of personality and
    spirit, while outer authority mainly relies on power^([\[3\]](#txt005.html#footnote_content_txt005_3)).
    The evolution of teacher roles in intelligent education is precisely a trajectory
    of combined inner and outer authority, a transformation of teacher authority from
    "outer authority" to "inner authority." In this transformation process, students
    may not even perceive the existence of teacher authority. Because the authority
    accompanying the teacher''s professional literacy ultimately transfers from the
    educator to the educatee, manifested by the student''s disciplinary literacy representing
    the teacher''s authority, thereby breaking the students'' dependence on teachers
    caused by information asymmetry in traditional education. The teacher-student
    relationship achieves equality in this "transformation" of authority.


    The enrichment and development of teacher roles help promote student development.
    The transformation of teacher roles is an inevitable product of adapting to the
    development of the times, and also a gradual victory of the educational philosophy
    that focuses on student development. In the new intelligent era, promoting the
    comprehensive development of students is the top priority, and fostering virtue
    through education is the fundamental task of education in the new era. The transformation
    of teacher roles precisely adapts to the requirements of educational purposes
    and tasks, rhythmically conforming to the development laws of the new intelligent
    era, gradually changing traditional teacher roles, making teachers and students
    "blend together" and "knead into one," thereby giving greater play to the teacher''s
    exemplary leading role and setting a model for students'' healthy growth and comprehensive
    development. Therefore, the transformation of teacher roles achieves equality
    in teacher-student relationships through the "transformation" of authority, then
    facilitates the integration of teachers and students, and ultimately promotes
    the healthy growth and comprehensive development of students.


    # 2. Preparing for a Rainy Day: Will Human Teachers Be Replaced?


    With the continuous development of the Internet, big data, and artificial intelligence,
    systems formed by technological integration have begun to mature, making the emergence
    of AI teachers possible. Historically, it was difficult for people to imagine
    robots becoming teachers, let alone imagining their existence threatening the
    jobs of human teachers. However, in the intelligent era, those past "impossibilities"
    of imagination have turned from "unthought of" into reality.


    The advent of AI teachers can be traced back to the birth of "Expert Systems."
    An expert system is an intelligent computer program system containing a large
    amount of knowledge and experience at the level of domain experts, capable of
    using human experts'' knowledge and problem-solving methods to handle problems
    in that field. Expert systems are essentially storage systems for knowledge and
    experience; massive knowledge and rich human practical experience gathered in
    intelligent computer systems constituted the earliest expert systems. When the
    system is running, any visitor accessing the system will receive a specific answer,
    or methods and strategies to solve the problem. Therefore, as a branch of AI technology,
    the development of "expert systems" not only demonstrates the trend of AI theory
    "landing in application" but also reflects the "unmanned" and "intelligent" trends
    in the teaching profession.


    The fundamental driving force behind the birth of AI teachers lies in the inherent
    limitations of human beings themselves. In the process of manufacturing and using
    tools, humans, dominated by their own "inertia," naturally have the desire and
    emotional tendency to rely on tools; the application of AI technology in the field
    of education is no exception.


    The birth of AI teachers stems on one hand from the maturity of technological
    development, and on the other from human "inertia." The maturity of intelligent
    technology is the foundation for AI teachers to stand up, but human "inertia,"
    or the inherent limitations of human beings, has become the historical root and
    powerful force driving the birth of AI teachers, compelling people to continuously
    use intelligent technology to endow intelligent machines with the professional
    literacy and capabilities of human teachers.


    In August 2018, Sophia, the world''s first AI robot with human citizenship, was
    hired as an AI teacher by the global leading online education group iTutor Group.
    Thus, Sophia became the first AI teacher in human history. iTutor Group''s hiring
    of the AI robot Sophia was not sudden. According to news from Yiou Network in
    late February 2018, as early as the "New Era, New Education, Create the Future"
    conference in Shanghai in 2018, iTutor Group had already reached a strategic cooperation
    agreement with the AI robot Sophia. To date, Sophia can basically undertake online
    teaching tasks and handle some relatively complex educational and teaching problems.
    On the one hand, leveraging its powerful memory capacity, it can provide personalized
    teaching services for students in a targeted manner, reaching the level of a human
    teaching assistant overall; on the other hand, appearing in human form, it can
    better communicate and interact with students, playing an important role in accompanying
    student growth.


    The hiring of an AI robot (citizen) as a teacher sparked heated social discussion.
    When the AI Sophia appeared before people in the identity of a teacher, while
    people celebrated, they also worried about the future and fate of human teachers:
    Will AI teachers replace human teachers? Under such an era crisis, what preparations
    should human teachers make to avoid being replaced by AI teachers? The impact
    of AI robots on various human professions possesses an inherent subversive power;
    while people ponder the replacement of teachers, people in other fields are also
    pondering this question.


    In October 2017, the British Broadcasting Corporation (BBC), based on the data
    system of Cambridge University researchers Michael Osborne and Carl Frey, analyzed
    the probability of 365 global professions being eliminated in future society.
    The specific data is shown in Table 5-1^([\[4\]](#txt005.html#footnote_content_txt005_4)).
    From the data in the table, the top five professions most likely to be eliminated
    by AI robots in the future are: telemarketers (99.0% probability of elimination),
    typists (98.5%), accountants (97.6%), insurance agents (97.0%), and bank clerks
    (96.8%), followed by government clerks, switchboard operators, receptionists,
    customer service, HR, real estate agents, chefs, etc.


    According to BBC statistics, the replacement of human professions by AI robots
    will penetrate all areas of human life. Israeli writer Yuval Noah Harari believes
    that the future division of labor will become increasingly specialized, and human
    society will give birth to a class unprecedented in history that is useless to
    both the economy and the military—the "useless class"^([\[5\]](#txt005.html#footnote_content_txt005_5)).
    However, returning to the field of education, we cannot help but ask: Will human
    teachers really be reduced to the "useless class"? Will they really be completely
    replaced by AI teachers?


    ![iTutor Group Founder, Chairman and CEO Yang Zhengda with the World''s First
    AI Teacher Sophia](img/txt005_1.jpg "pagenumber_ebook=75,pagenumber_book=65")


    Figure 5-1 iTutor Group Founder, Chairman and CEO Yang Zhengda with the World''s
    First AI Teacher Sophia^([\[6\]](#txt005.html#footnote_content_txt005_6))


    Table 5-1 Probability of Various Professions Being Eliminated in the Future①


    ![Table 5-1 Part 1](img/txt005_2.jpg "pagenumber_ebook=75,pagenumber_book=65")


    Continued Table


    ![Table 5-1 Part 2](img/txt005_3.jpg "pagenumber_ebook=76,pagenumber_book=66")


    The answer to the question "Will AI teachers replace human teachers?" can actually
    be found in the BBC statistical data—**the probability of human teachers being
    replaced by AI robots is only 0.4%.** However, it is worth noting: in the AI era,
    if teachers do not know how to apply AI technology, the probability of being replaced
    by AI teachers will increase significantly.


    In 1996, UNESCO pointed out in the *Recommendation Concerning the Status of Teachers*
    that teaching work should be regarded as a "profession." The implication is that
    teaching is a specialized occupation; they must possess educational capabilities
    and sound character, be able to accurately grasp the characteristics of their
    service objects, and master a whole set of matching educational theories and methods.
    In other words, teachers'' professional skills and literacy originate from professional
    talent cultivation channels and are difficult to replace in professional aspects.


    Before discussing whether AI teachers will replace human teachers, it is necessary
    to first carefully analyze what AI robots are good at and what they are not good
    at; this is the key to future human teachers not being replaced. From the BBC
    statistical data, it can be seen that in future social development, professions
    easily eliminated by AI technology share common characteristics. Take educational
    customer service as an example: all professions that can provide convenient services
    to learners can be called educational customer service. Their inherent value orientation
    is to provide convenient services to learners, so why does this job have a 91%
    probability of being replaced by AI?


    This question is not difficult to answer, because AI customer service can tell
    you the answer. Intelligent educational customer service is a customer service
    system based on AI semantic recognition technology. In long-term service, it can
    actively construct problems and generate countermeasures for specific contexts,
    just like a customer opening the Taobao shopping interface to seek help from customer
    service. When you start typing a question, the intelligent educational customer
    service has already predicted the various questions you might raise regarding
    a certain learning module based on its deep learning experience, and provides
    routine answers. At the same time, it can rely on intelligent recommendation system
    functions to push relevant learning product links to you.


    However, observant people will find that on the same intelligent customer service
    human-machine interface, the same question basically only gets the same answer.
    This shows that the foundation of intelligent educational customer service is
    actually a problem-solving system. In other words, the existence of intelligent
    educational customer service is a big data comprehensive summary of the real educational
    customer service problem domain; specific problems in specific contexts have different
    answering methods but basically consistent content. This "routine" nature of work
    gives AI customer service systems obvious advantages in comparison with human
    customer service: they are tireless, can be online 24/7, and can answer various
    "tricky" questions raised by different types of users. Therefore, the replacement
    of the educational customer service profession is worth deep reflection. Similarly,
    the work of typists can now basically replace typists by relying on intelligent
    voice input, intelligent image text recognition, intelligent visual recognition,
    and other technologies. In smartphone social software (WeChat, QQ, etc.), everyone
    can enable the voice-to-text function to easily realize text input.


    As mentioned above, whether it is customer service, typists, accountants, or bank
    clerks, these jobs are all simple and repetitive labor; the staff in them do not
    need to think too much, they only need to master business skills proficiently.


    However, why do professions such as architects, public relations, psychologists,
    and hotel managers have a probability of being replaced by AI robots that does
    not exceed 2%? Comprehensive comparative research finds that these major professions
    involve too many emotional and wisdom factors, involving complex interpersonal
    networks, humanistic value care, and understanding of life. Their professional
    operation modes require wise minds more than fixed business models.


    Therefore, overall, the reason the emergence of AI triggers "collective anxiety"
    in specific professional fields is that AI possesses unparalleled advantages over
    humans at the operational skill level. However, at the wisdom skill level, AI''s
    weaknesses begin to be exposed. "Knowledge, Emotion, Will, Action" (知、情、意、行) constitute
    the four basic capabilities of human teachers, but because AI teachers are the
    embodiment of machines, they themselves do not possess life attributes, so they
    have significant defects in emotional and volitional capabilities. Teaching, as
    a professional occupation, not only requires business operational skills but also
    requires mastery of specialized wisdom skills. The lack of wisdom skills in AI
    teachers reveals the intrinsic reason for the low probability of human teachers
    being replaced—AI teachers are rigid, lack emotion, and lack innovative spirit.


    AI teachers are intelligent systems based on AI technology, specifically engaged
    in teaching work in virtual and real environments; their essence is non-living
    entities. Judging from the current development process of AI technology, due to
    the limitations of intelligent technology itself, the existence of AI teachers
    can only "follow routine" to complete "instructional" teaching tasks, including
    the AI teacher Sophia. Due to the lack of independent consciousness, absolutely
    obedient AI teacher systems are precise executions of human educational standards.


    For example, when AI teachers grade homework, the uniqueness of the judgment criteria
    for objective questions gives them great "freedom" to perform, and both grading
    efficiency and quality far exceed human teachers. However, for subjective questions
    without unique judgment criteria, AI teachers appear somewhat at a loss. Even
    if given certain standards through technical means, the judgment system composed
    of "standards" still cannot effectively perceive the examinee''s emotional attitudes
    and tendencies. Therefore, in the process of AI teachers grading homework, it
    is very easy to cause originally brilliant essays to fail the AI teacher''s judgment
    system.


