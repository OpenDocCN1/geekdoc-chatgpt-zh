    ## Big Data Worship and Student Impact


    ### First


    Big data worship exacerbates the risk of "potential discrimination" by educators.
    Michael Schrage pointed out in the *Harvard Business Review* that, in theory and
    practice, big data digitizes cultural assertions and stereotypes into empirically
    verifiable datasets^([\[9\]](#txt012.html#footnote_content_txt012_9)). Data analysis
    technologies are enhancing database relevance with increasingly powerful statistical
    algorithms, but inferences about personal character and behavior predicted from
    data analysis may be misleading; that is, "big data will rule us in a mixed-results
    way"^([\[10\]](#txt012.html#footnote_content_txt012_10)).


    ### Second


    Big data also has adverse effects on students. Because big data never forgets,
    digital footprints, digital identities, and digital labels conversely become factors
    restricting student progress, growth, and change; students are invisibly hindered
    and constrained in their pursuit of personal growth. Therefore, if educators indulge
    in or get lost in massive personal data, they will ultimately make partial, rigid,
    and unjust judgments, affecting the healthy physical and mental development of
    students.


    ## 4. Poor Teaching Effectiveness


    With the increasing demand for personalized education, advances in information
    technology and artificial intelligence have led to explosive growth in data from
    personalized education systems. However, currently available personalized online
    teaching platforms have significant deficiencies and limitations, challenging
    learners'' learning and cognitive abilities, and easily leading to poor teaching
    effectiveness.


    ### First


    Due to the lack of interaction in traditional classrooms, differences in learning
    methods and cognitive abilities lead to an increasingly prominent gap in student
    learning progress. If online teaching platforms merely move traditional offline
    education models onto the internet, this education model lacking real-time interaction
    and personalization remains "cramming-style" education. When personalized teaching
    content cannot be effectively implemented, high dropout rates will occur.


    ### Second


    Fragmented, explosive massive information occupies students'' limited time and
    energy, leading to dilemmas in their learning and cognition. Fragmented learning
    methods affect the maintenance of students'' concentration, while massive information
    resources cause brain fatigue; cognitive overload frustrates students'' confidence
    and motivation to learn. Nicholas Carr mentions in *The Shallows* that when we
    offload memory tasks to external databases, thereby bypassing the internal process
    of memory consolidation, we face the risk of emptying our brain''s treasure trove,
    thereby endangering the depth and unique personality of the individual and the
    depth and unique personality of our shared culture^([\[11\]](#txt012.html#footnote_content_txt012_11)).


    ### Third


    Lack of effective management and supervision. Some students, especially primary
    and secondary school students, due to poor self-control, if lacking effective
    management and supervision from teachers, are easily distracted by social software,
    video entertainment, online games, etc., during learning, resulting in poor learning
    effectiveness.


    ## 5. Outdated Educational Concepts


    Facing a student body with individual differences, the education system is still
    filled with assembly-line, cramming-style education models, outdated thinking
    patterns and educational concepts, and rigid teaching schedules, ultimately producing
    batch after batch of homogeneous student groups unable to adapt to the transformation
    of talent demands in the era of big data and artificial intelligence.


    ### First


    The impact of big data on thinking patterns emphasizes correlation and ignores
    causality. British big data expert Viktor Mayer-Schönberger believes that one
    of the most important changes in the big data era is the shift from causality
    to correlation; there is no longer a need to seek causes from facts, but to find
    some correlation from seemingly unrelated data. However, overemphasizing correlation
    while ignoring causality is insufficient to solve the root of problems. Education
    takes cultivating people as its fundamental purpose; it must not only "know the
    fact" but also "know the reason why." Only by insight into the essential causes
    of educational problems can we fundamentally seek solutions^([\[12\]](#txt012.html#footnote_content_txt012_12)).


    ### Second


    The impact of big data on educational views. Some experts overestimate the impact
    of big data on talent cultivation. In fact, big data provides a good tool and
    path for personalized education and talent cultivation. However, the educational
    concepts of personalized education and teaching students according to their aptitude
    depend not only on schools; families and society play a pivotal role in talent
    cultivation. Personal development and growth are the result of the comprehensive
    interaction of multiple factors including family, school, and society.


    ### Third


    The big data era challenges traditional educational methods. The era of knowledge
    fission has brought about a significant transformation in the inherent system
    of knowledge acquisition. Today, the fundamental reason for the decline of education
    is that educators often ignore the changes in knowledge acquisition caused by
    changes in student cognition; digital immigrant teachers are teaching a group
    of students who speak a brand-new language using an outdated language (pre-digital
    era language)^([\[13\]](#txt012.html#footnote_content_txt012_13)).


    ### Fourth


    Facing the new educational context, isolated educational management models are
    restricting the development of personalized education. In addition, research on
    personalized education is often limited to international educational institutions
    or organizations, lacking research and implementation based on the national level
    or interdisciplinary collaboration, causing personalized education to often remain
    formalistic and difficult to put into practice.


    ## 6. Privacy and Security Challenges


    While big data open sharing enhances personalized education, it also falls into
    the nightmare of educational data leakage, raising ethical issues in big data
    collection. Data privacy, security, and ownership issues pose additional challenges
    to personalized education. A French business school in Paris planned to use an
    "emotion recognition system" to measure students'' attention in classrooms and
    on learning websites; this helps improve student performance in massive open online
    courses and improve teachers'' teaching effectiveness. However, it also raised
    doubts among more and more people about how student data is handled, and even
    demonstrations appeared on the Paris campus^([\[14\]](#txt012.html#footnote_content_txt012_14)).
    Besides this, the convenience brought by big data makes people ignore its harm
    to student privacy and security. The US education big data company InBloom shut
    down after operating for 15 months, mainly due to negligence in privacy measures
    during the opening of educational data, leading to security issues. Reuters reported
    that this $100 million database continuously tracked students'' interests, learning
    disabilities, test scores, and even homework completion, including collecting
    student data generated on adaptive children''s math learning site DreamBox and
    learning sites like Khan Academy. Federal law allows it to "share portions of
    its database with private companies selling educational products and services,"
    resulting in the leakage of names, addresses, social security numbers, and learning
    information of millions of children. The program eventually collapsed in 2014^([\[15\]](#txt012.html#footnote_content_txt012_15)).
    It is evident that in education, big data is a valuable educational asset, but
    if not properly protected, it will bring serious security and social problems.


    ## (III) New Paths to Promote Personalized Education Using Big Data


    Analyzing the impact and problems brought by big data on personalized education
    helps us rationally view and reasonably apply the role of new-generation information
    technologies and artificial intelligence technologies, including big data, in
    promoting educational modernization, seize opportunities, promote the development
    of personalized education, and cultivate well-rounded talents needed in the new
    era.


    ### 1. Maintain Rational Thinking


    While the enthusiasm for big data-based personalized education continues to rise,
    it is necessary to maintain rational thinking and overcome technological dependence
    and data worship. To maintain rational thinking in the big data era, one needs
    to choose learning methods suitable for oneself and learn to master new learning
    methods. Sugata Mitra believes that in the future big data era, there are only
    three most basic abilities that adolescents need and must learn: first, reading;
    second, searching; third, discerning truth from falsehood^([\[16\]](#txt012.html#footnote_content_txt012_16)).
    That is, the ability to absorb and acquire knowledge, the cultivation of values,
    and the formation of critical thinking are more important today. First is to cultivate
    the habit of persistent reading. Good reading habits and methods should be cultivated
    in the screen-reading era, combining paper reading with digital reading to enhance
    the breadth and depth of reading. Second is to improve information search and
    decision-making abilities. To prevent the degradation of personal ability to explore
    and link resources caused by convenient big data links, one should consciously
    explore and enhance one''s own search and logical decision-making abilities, letting
    new technology become a tool to liberate personal abilities and talents, learning
    to search and discern truth from falsehood in the ocean of data, and selectively
    drawing on and absorbing. Finally, fully utilize the convenience of information
    technology, proactively adapt to the learning characteristics and methods of the
    big data era, and learn mobile learning, entertainment-based learning, and social
    learning, etc.


    ### 2. Innovate Educational Thinking


    Facing these new, explosively growing new-generation information technologies
    and artificial intelligence technologies, the most important aspect of big data
    for personalized education is the transformation of thinking. Educators should
    seek change on demand and continuously, focus on continuous learning to narrow
    the gap with digital natives, embrace big data and intelligent machines, and truly
    achieve innovation in educational concepts.


    #### First


    Education must be student-centered and respect students'' subjectivity. Respecting
    students'' subjectivity and being student-centered does not exclude the guiding
    role of teachers; rather, it requires teachers to understand and grasp the changes
    in students'' current thinking patterns, under the guidance of relevant thinking,
    subjective-objective thinking, process thinking, and empirical thinking, focus
    on mastering, integrating, processing, mining, and utilizing big data to adapt
    to the new educational development context, take student development as the foundation,
    and fully tap students'' potential.


    #### Second


    Attach importance to cultivating innovative spirit and all-round personality development.
    Students are the most active and knowledge-intensive group. In the big data environment,
    students'' ideas, thinking patterns, and behavioral patterns have been profoundly
    influenced. It is necessary to establish a personalized education concept oriented
    towards innovative talent cultivation and continuously innovate educational models.
    Fully respect students'' individual differences, understand students'' personality
    traits to adopt scientific and reasonable educational concepts and teaching methods,
    cultivate students'' divergent thinking and lateral thinking, and overcome mental
    sets.


    #### Third


    Form a concept of lifelong learning. With the advent of the big data and artificial
    intelligence era, the full coverage of computer, network, and communication technologies,
    and the generation of massive information data, if people refuse to accept new
    ideas, new perspectives, and new technologies, they will likely fall behind and
    be abandoned by society. Therefore, we should transform learning and educational
    thinking, improve data literacy, and proactively embrace new tools and technologies
    such as big data and intelligent machines. How people can better carry out personalized
    education work in the information environment requires continuous learning, updating
    concepts, and further exploration and practice.


    ### 3. Develop Big Data Technology


    Under the big data trend, exploring the path of personalized education must first
    develop big data technology.


    #### First


    We must follow top-level design, establish and improve industry standards and
    norms for educational big data to ensure the standardization of educational big
    data collection, storage, application, sharing, etc., standardize data indicators
    of all educational data management platforms to facilitate effective docking of
    data between platforms, realize the integration and sharing of data from various
    platforms, and prepare for in-depth mining and analysis later.


    #### Second


    The real revolution in the big data era lies in how to use data. Therefore, we
    must further enhance the ability to integrate educational data, improve the ability
    to explore the value behind data and make educational decisions based on data.
    Draw on international experience in educational big data application to promote
    the in-depth development of educational big data application in China; refine
    and summarize valuable educational big data application models and cases to guide
    educational administrative departments, schools, and educational training institutions
    across the country to reasonably apply educational big data; through analysis
    of educational big data, understand the shortcomings and realistic needs in educational
    development, and formulate educational policies and strategies.


    #### Third


    Promote the construction of personalized education service platforms, use big
    data to build platforms meeting the educational resource needs of teachers and
    students, create personalized digital resources, organically combine digital resources
    and personalized teaching resources, design a tool platform conducive to searching
    to ensure students can effectively acquire knowledge, and realize autonomous learning
    and personalized learning.


    ### 4. Strengthen Talent Cultivation


    In the big data era, educational reform and the development of personalized education
    require not only advanced big data technology but also the keen insight and professional
    capabilities of big data researchers and practitioners. Therefore, strengthening
    talent cultivation is the top priority.


    First, establishing a professional and information-based teaching staff is the
    guarantee for realizing personalized education. This requires educators to adapt
    to the requirements of the times, strengthen information technology skill cultivation,
    innovate teaching concepts and educational methods, rely on big data technology,
    understand students'' learning situations and needs, thereby tailor personalized
    education plans for students, and achieve students'' all-round development.


    Second, promoting the application and development of big data technology requires
    cultivating a group of talents who understand big data, possess big data collection,
    analysis, and processing technical capabilities, and are good at researching and
    mining big data, and combining advanced technologies such as data mining, data
    analysis, artificial intelligence, and visualization with practical educational
    problems. Therefore, interdisciplinary expert teams should collaboratively design
    and implement research in educational data mining, learning analytics, and visual
    analytics; higher education institutions should establish new interdisciplinary
    graduate programs to cultivate data scientists in this professional field^([\[17\]](#txt012.html#footnote_content_txt012_17)).


    In addition, researchers from multiple disciplines such as pedagogy, management,
    computer science, and statistics should be organized to establish specialized
    educational big data research institutes, concentrate advantageous forces to solve
    problems existing in the application process of educational big data, and simultaneously
    conduct strategic research combined with educational development, making them
    an intellectual treasure house for national educational big data development.


    ### 5. Emphasize Multi-party Collaboration


    The education community should innovate thinking, combine conventional educational
    data mining with new learning analytics, emphasize multi-party collaboration,
    and promote the creation of a personalized education ecosystem.


    #### First


    Inject humanistic care. In the process of using big data technology to drive personalized
    education, increase investment in education regarding students'' emotional value
    and cognition. Education targets students'' whole lives, not only including the
    learning of skills and knowledge but also including values, character building,
    and civic participation; people should be allowed to truly participate in education
    and benefit from it for life. Inject humanistic care into big data development,
    handle the relationships between people and data, people and intelligent machines,
    value rationality and instrumental rationality well, and highlight the temperature
    of data.


    #### Second


    Strengthen "home-school" cooperation mechanisms. Personal growth and success are
    the results of the joint action of family, school, society, and other factors;
    the realization of personalized education also requires the joint participation
    and cooperation of family, school, and society. First, broaden communication channels,
    use online platforms to improve communication efficiency, achieve effective two-way
    communication, and understand students'' real situations; second, transform parents''
    concept of overemphasizing grades, increase attention to students'' mental health,
    physical fitness, interests, and innovative abilities, changing exam-oriented
    education into quality education and innovative education; finally, parents should
    increase their attention to schools, understand the various measures schools take
    to promote student development, and improve the effect of "home-school" co-education.


    ### 6. Attach Importance to Data Privacy


    Privacy violation has become a barrier to the development of personalized education
    driven by big data. Therefore, educators and data developers must treat student
    data with caution and highly value the important role of data privacy in the long-term
    development of big data and personalized education.


    First, attach importance to personal data privacy and security.


    ##### First


    Hold data privacy protection activities. As early as 2009, the Office for Intellectual
    Freedom of the American Library Association began holding Choose Privacy Week
    (CPW) activities; the purpose of "Choose Privacy Week" is to encourage dialogue
    and raise awareness of the growing privacy issues in the big data era^([\[18\]](#txt012.html#footnote_content_txt012_18)).


    ##### Second


    Establish a sense of responsibility and strengthen data moral cultivation. Everyone
    is a member of social construction; while enjoying the convenience brought by
    data openness and sharing, we must also consciously assume the responsibility
    of data protection, enhance our own data moral cultivation, respect others'' data,
    protect others'' data, insist on using big data technology under the constraints
    of moral norms, improve data security and reliability, and make big data better
    serve humanity.


    Second, use technical means to protect privacy. In the big data era, whether it
    is notice and consent, obfuscation, or anonymization, these three major privacy
    protection strategies have all failed^([\[19\]](#txt012.html#footnote_content_txt012_19)).
    Therefore, strengthening privacy protection technology is particularly important.


    ##### First


    Higher education institutions should be committed to creating software such as
    data recovery software, firewalls, encryption, and anti-virus to reduce the risk
    of loss or manipulation of big data.


    ##### Second


    Use two-way monitoring technology. That is, from data collection to use, two-way
    informed consent is required; data collectors and users (voyeurs are also a special
    type of data user) must also be monitored equally^([\[20\]](#txt012.html#footnote_content_txt012_20)).
    Strengthen data monitoring and protect information security.


    Finally, formulate relevant laws and regulations. To better protect data privacy
    and security, the US proposed in the *Family Educational Rights and Privacy Act*
    to protect the security and privacy of student educational data; the UK enacted
    the *Data Protection Act* to strengthen the protection of personal data rights.
    Although China also protects data privacy and security through laws and regulations
    such as the *Cybersecurity Law*, *E-Commerce Law*, and *Decision on Strengthening
    Network Information Protection*, compared with advanced Western countries, China''s
    relevant regulations on personal data privacy are still not perfect, with problems
    such as unclear legal norms, incomplete punishment systems, and unclear and unspecific
    content; moreover, research on privacy protection issues in the education field
    is very limited. Therefore, relevant departments must realize that the application
    of educational big data will face the dual challenges of ethics and trust, and
    formulate relevant laws and regulations to punish units or individuals who illegally
    apply data, violate user privacy and national security, and effectively guarantee
    the educational data security of individuals, institutions, and the state.


