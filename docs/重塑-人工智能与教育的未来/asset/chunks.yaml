- raw: "人工智能教师的存在,是对标准的绝对执行。人工智能教师发展至今,其实还是没有逃离“专家系统”的“遗传基因”的影响,这既决定了它们在解决问题方面的惊人能力,也突出了它们不会从事育人工作的局限性。当学生向人工智能教师求助时,有求必解,但却不是从更智慧的层面引导学生自己建构解决问题的策略。久而久之,学生将会形成对人工智能教师的依赖。“捆绑式”的学生成长模式,不利于学生的批判思维、创造思维的生成,极端情况下还容易毁掉学生的前程,最后沦为人工智能教师教学情境下的牺牲品。\n\
    \n人工智能教师的局限性,似乎成为人类教师不可被其替代的最有力证据。而人类教师的优势所在,正好是人工智能教师所不能弥补的、无法被其替代的地方。但人类教师也不得不注意,如果他们不能掌握人工智能教师所不能掌握的技能,那么人类教师极有可能被人工智能教师所淘汰。正如雷·克利福德所言：“科技不能取代教师,但是使用科技的教师却能取代不使用科技的教师^([\\\
    [7\\]](#txt005.html#footnote_content_txt005_7))。”教师无远虑,必有近忧。既然已经找到人类教师可能会被人工智能教师取代的可能性,对其进行提前防备便是人类教师的当下之紧要。\n\
    \n2017年11月,由习近平总书记亲自主持召开的十九届中央全面深化改革领导小组第一次会议审核通过的《关于全面深化新时代教师队伍建设改革的意见》中提到,到2035年,我国要基本实现教师管理体制机制科学高效,实现教师队伍治理体系和治理能力现代化。教师要主动适应信息化、人工智能等新技术变革,积极有效开展教育教学。人工智能时代,“职业智能化”和“智能化职业”交替发展,人类教师的智能化发展与人工智能教师的职业化发展并行不悖。当人工智能教师的职业化发展如履平地之时,人类教师的智能化发展也应迅速推进,积极主动地适应好智能社会的大调整与大变革。\n\
    \n人类教师的智能化发展,是他们在未来的教师行业不被人工智能教师取代的重中之重,也是人类教师与人工智能教师走向融合的必然选择。任何一个科技大发展的时代,人们都无法选择与世界大趋势抗衡,唯有勇立潮头敢担当,装上前沿科技的铠甲,才能看得更高,走得更远。智能时代的教师也是如此,要想不被淘汰,他们别无选择,不得不加入智能化的行列,跟随潮流而进,走“人机”融合之路。\n\
    \n三、“人机共教”：从对立走向统一\n\n人工智能教师与人类教师之间的论争,从整个教育的发展视角来看,无论谁胜谁负,都将不利于教育的高质量发展——辩证的发展与融合才是最佳的选择。1983年国庆,邓小平同志为北京景山学校题词：“教育要面向现代化,面向世界,面向未来。”2019年2月,中共中央办公厅、国务院办公厅印发了《加快推进教育现代化实施方案(2018—2022年)》,该《方案》指出,在社会发展的新时代,要推进教育治理体系和治理能力现代化,稳步促成教育的高质量发展。所以,人工智能时代,教育的发展应该聚集各方力量,努力形成教育合力,在化解人工智能教师与人类教师矛盾的同时,促进教育的整体结构更加合理化。\n\
    \n人机共教,是指人类教师与人工智能教师的共同教学,两者既对立又统一,相辅相成,共同发展。“百年之计,教育为本,教育大计,教师为本”。无论是人工智能教师,还是人类教师,都是挑起教育大梁的担当者,合则两利,分则两伤。可见,人机共教是当下两类教师的最佳发展之路,也是防控人类教师被代替的最佳选择。如图5-2所示,“教师智能化”与“智能化教师”,是化解当下人机教师矛盾冲突的两大智能化走向,是人机实现对立统一的总体架构。\n\
    \n![](images/txt005_4.jpg \"pagenumber_ebook=80,pagenumber_book=70\")\n\n图5-2\
    \ 人机融合\n\n在前一节的论述中提到,人工智能教师的教学活动是简单且重复的,但是在特定的教学情境中,它具有执行效率高、标准落实精准的优势,而人类教师却是不具备的,或者说是远远比不上人工智能教师。但不容忽视的是,人类教师无疑在批判思维、创新思维和价值判断等方面具有超越价值,为了突破人机相互竞争与淘汰的循环,为了实现人机融合与发展,务必要从技术、思维与结构三个视角进行融合创新,从而突出未来教师的“非传统属性”。\n\
    \n人工智能教师与人类教师的融合与超越,技术手段是融合发展的现实基础,思维层面的融合是方向保证,结构融合是人机共教的着力点。技术的融合要解决的核心问题是两者之间的鸿沟问题,包括人类教师的“技术盲点”与人工智能教师的“价值盲点”两大子问题。思维的融合,主要是人工智能的机械思维与人类的辩证思维的融合。结构的融合,主要是指人类教师与人工智能教师的各方面素养的结构性契合。\n\
    \n根据5-2的人机融合结构图可知,在整个人机融合的过程中,将会促成技术与价值有机融合的未来教师的诞生。在人机共教的整体智能化走向中,未来教师将会形成以人类肉身为载体,技术性知识与技能为护身符,生命关怀与人文价值为灵魂的全能型教学人才或者是教育家,教师的面貌将被彻底颠覆。\n\
    \n因此,从当下做起,在借助人工智能技术教育学生时,需要认识到人工智能教师作为知识传授的强者的事实,也需要引导相关人类教师的教学,要从面向知识体系的传授,转向面向人文底蕴、责任担当、国家认同、跨文化交流等核心素养的培养。学生的创造能力、审美能力、协作能力、知识的情境化运用能力是人类教师所应关注的核心和重点^([\\\
    [8\\]](#txt005.html#footnote_content_txt005_8)),在人类教师与人工智能教师的分工协作中走向统一。\n\n人工智能时代,未来教育人才队伍的培养任务艰巨,其中尤以全能型教师教学能力的培养为关键难点。但无论如何,走人机共教的未来教师之路是必然的选择,也是人类教师真正不被人工智能教师淘汰最为有效的途径。未来教师的出现,需要新的教育方式、教育制度、教育资源与教育结构的支持。若要想尽早发挥未来教师的价值,当前就应该积极开展理论创新与实践落地工作,敞开闭塞的门窗,呼吸新世界的新鲜空气,突破和超越传统教育的藩篱,加速推进教育治理体系与治理能力现代化进程。\n\
    \n【注释】  \n\n[\\[1\\]](#txt005.html#footnote_quote_txt005_1)邓银珍.谁动了我的讲台——人工智能时代背景下教师角色的转变\\\
    [J\\].中小学信息技术教育,2018(06)：86-89.\n\n[\\[2\\]](#txt005.html#footnote_quote_txt005_2)张青.教师的权威者角色在网络教育中的变化及其社会学原因\\\
    [J\\].湖南师范大学教育科学学报,2010,9(05)：63-65.\n\n[\\[3\\]](#txt005.html#footnote_quote_txt005_3)任民,李迎春.半部《论语》做良师：《论语》给教师的启示\\\
    [M\\].北京：中国轻工业出版社,2014：195.\n\n[\\[4\\]](#txt005.html#footnote_quote_txt005_4)搜狐网.德林社：365个职业,未来最不可能被人工智能替代的竟然是……\\\
    [OL\\]\\[2017-10-17\\].https：//www.sohu.com/a/205327096\\_157944.\n\n[\\[5\\]](#txt005.html#footnote_quote_txt005_5)王德林,李成彬.教师会沦为“无用阶级”吗?——人工智能的视角\\\
    [J\\].教育与教学研究,2018,32(10)：60-65+125.\n\n[\\[6\\]](#txt005.html#footnote_quote_txt005_6)图片来源：中国娱乐新闻网.和索菲亚sophia一起学,vipJr开启智能教育新时代\\\
    [OL\\].\\[2019-3-6\\].http：//www.sohu.com/a/298464284\\_344165.\n\n[\\[7\\]](#txt005.html#footnote_quote_txt005_7)余胜泉.人机协作：人工智能时代教师角色与思维的转变\\\
    [J\\].中小学数字化教学,2018(03)：24-26.\n\n[\\[8\\]](#txt005.html#footnote_quote_txt005_8)余胜泉.人机协作：人工智能时代教师角色与思维的转变\\\
    [J\\].中小学数字化教学,2018(03)：24-26.\n\n\uFEFF\n\n第六章 教育基石：智能时代的师生关系与教师素养\n\n“移民”与“原住民”：智能时代师生之间的代际鸿沟\n\
    \n社会化与反向社会化：智能时代教师向学生学习\n\n智能素养：智能时代教师新素养的提升\n\n“00后”与前几代人不一样,因为他们是“智能原住民”——他们生于智能时代,长于智能时代,他们的一切都与智能密切相关。他们的诞生,反映的是一个时代的发展,体现的是一个时代对人的塑造。\n\
    \n在智能原住民的生活中,与之相对应的是“智能移民”,从根本上考量,两者之间存在着明显的差异,正是由于这种差异的过于显著,最终演化成了两代人之间的代际鸿沟。这种代际鸿沟映射到教育领域,教师与学生之间也必然存在着代际鸿沟。但通过教师向学生的反向学习和教师智能素养的提升,一定能在这条“鸿沟”之上搭建起沟通的桥梁。\n\
    \n一、“移民”与“原住民”：智能时代师生之间的代际鸿沟\n\n智能新时代,由人工智能技术催生的智能机器在不断地代替人类自身工作的同时,也在不断地创造很多便捷的条件塑造人类本身。这不仅让人们有更多的时间思考未来的问题,还让人们与智能机器的合作成为一种生活常态。\n\
    \n通常情况下,一个极富变革意义的时代,最先能够适应环境的,并不是在某个独立领域已被深度职业定型的群体,恰好相反,他们是年轻一代。人工智能时代正是如此,突飞猛进的智能化趋势,正在以“迅雷不及掩耳之势”渗透人们的生产、生活与思维的各个领域。由于人们对智能技术的认知能力、适应能力、应用能力等方面的差异,在技术层面将人们划分成两种截然不同的身份——“智能原住民”与“智能移民”。\n\
    \n不同的时代背景下,由于技术阈值的差异化,导致技术层面引起的两种身份的划分具有不同的表达方式。互联网时代,人们的两种身份已经生成——“网络原住民”和“网络移民”。归功于互联网技术的发展与演进,它在技术领域架起一座促进人们互相沟通的桥梁,原子化社会逐渐被打破。信息时代,“数字原住民”和“数字移民”是社会成员的基本构成部分,在新兴数字技术面前,两种身份的社会成员对这个时代的世界观和方法论有着显著的差异。大数据和人工智能时代,社会群体的两种身份也在生成——“智能原住民”和“智能移民”。这两种社会身份的存在,集中表达了当今时代整个人类社会中存在的两种不同的文化现象与身份属性。\n\
    \n“智能原住民”,是指人工智能时代的原生代公民,由于他们本身“生于智能,长于智能”,是在人工智能技术和智能文化环境的熏陶下成长起来的一代人,具有非常强的社会适应能力。简单来说,好像他们一出生,就学会了操作智能手机,对于很多电子产品,都是观摩几次,自己就学会了,基本是“无师自通”。例如,智能游戏,原住民群体在其中来去自如,如果不是有身份认证的关卡,在虚拟的游戏世界里,人们根本判断不出对手是几岁的孩子!\n\
    \n与此同时,他们所接受的教育,也与“其他群体”存在显著差异。智能时代的原生代公民,机器人编程成为重点课程,与之相关的教育机构应运而生,纷纷开设类似的课程体系。如今,不需要亲临教育现场,只需要在浏览器的检索窗口输入“儿童编程教育”,成百上千条信息映入眼帘,品类齐全,无不反映当下儿童编程教育的热门程度。机器人编程课程,对于“智能移民”是一项挑战,但在智能原住民的印象中,它却是一种生活常态。因为他们从学习中找到了“乐趣”,也在学习中将自己无拘无束的想象力充分表达出来。从目前来看,智能原住民具备三大特征。\n\
    \n一是低龄化。智能原住民诞生的时间与人工智能的“第三次崛起”的时间差不多。所以,现如今的智能原住民具有普遍的低龄化特征。\n\n二是生活智能化。生活智能化是智能原住民最显著的特征,也是智能原住民与“智能移民”存在最大差距的地方。生活智能化是智能技术普遍改变生活的结果,在生活智能化的环境中,出生的低龄儿童,由于本身所处的发展阶段的可塑性和适应能力极强,所以很快就融入智能生活中,成为其中的一部分。\n\
    \n三是智能生活化。这是智能原住民更高一级的特征,它不仅是智能原住民与“智能移民”的差别所在,也是横向区分智能原住民群体的智能化程度的重要依据。从与“智能移民”的差别维度看,智能生活化反映的是智能原住民一种新的生活方式——无智能,不生活。从横向维度看,智能生活化的程度越高,代表原住民适应智能社会的程度越高,意味着他们在将来的社会竞争中将会有更大的竞争优势。\n\
    \n“智能移民”,是指在人工智能时代被动适应社会的人,由于在他们的生长环境中缺乏智能产品的陪伴和智能文化的熏陶,所以无论是在心理上还是社会文化上,他们对人工智能时代的陌生感都非常强烈。对于他们而言,正所谓“一切都是新的”。此外,根据智能移民的态度,又可将之划分为处于逃避状态的智能旁观者和智能难民,以及处于积极投身适应智能新时代的智能顺民。\n\
    \n从智能移民的概念可知,他们属于从其他时代“迁徙”到智能时代的一代人。因为生活环境的剧烈变化,曾经在他们身上显现的“原住民”优势,已经逐渐被新一代的“原住民”所取代。在他们身上,很容易发现与智能时代格格不入的东西,如他们唾弃智能技术,对智能机器人充满焦虑,对智能原住民的智能生活化表示强烈的不满等,无不都是在反映他们身上固有的时代特征。\n\
    \n值得庆幸的是,部分智能移民注意到了这一点,他们开始寻求改变的方法,开始积极学习如何适应人工智能时代,成为智能时代的“顺民”。在智能顺民之中,有的人带领智能原住民创造了很多奇迹,有的人化身智能原住民的导师,将他们从智能时代的危险边缘拉回时代的中心,有的人数年苦心研究人工智能与智能哲学,甘为人师,奉献智能社会。\n\
    \n人工智能时代,智能原住民与智能移民已普遍存在,关于他们之间的争论此起彼伏。由于政治、经济、文化等因素的不同,贯穿于两者之间的鸿沟毅然扎根时代,成为限制时代发展的局限性因素,进而演化成为人工智能时代的“代际鸿沟”,横亘于两代人之间。由此看来,智能原住民与智能移民之间,势必存在着复杂的关系,而冲突、和谐、竞争则是构成这种关系的基本成分。假设抛弃绝对的时空界限,人们可以进一步解释两者现存关系的形成渊源。从根本上看,智能原住民与智能移民之间的“代际鸿沟”,是源于两代社会成员的角色失衡,所以对角色的重塑需要两代人的共同努力。\n\
    \n在大多数人看来,两者之间的关系是影响时代发展的重要因素,对各个领域均有一定的影响,尤其是专注于“培养人”和“塑造人”的教育领域更是如此。如今,人工智能时代的原住民,“00后”是一个分界点,“00后”以后的人们(包括“00后”)将成为智能原住民的主要代表。当你看到不满10岁的孩子用智能手机玩游戏或用智能手机查找高清动画片时,当你看到如今的孩子娴熟地穿行于智能产品的各种应用中时,作为教师的你,是否能够敏锐地察觉孩子的需求?或者说,你是否能够理解他们的所作所为?关于这个问题的回答,或许就构成了智能原住民与智能移民在时代中的冲突、和谐与竞争的现实性诠释。\n\
    \n现如今,在义务教育阶段,教师与学生的关系,正好映射智能移民与智能原住民的对应关系——教师是智能移民,学生是智能原住民。可见,教师与学生之间的代际鸿沟是客观存在的。\n\
    \n人工智能时代,教师与学生之间的代际鸿沟,在本质上反映的是传统教育与现代教育的冲突与隔绝。回顾教师生长的年代,悠闲自在的童年无不令今天的孩子羡慕——悠闲“自”在。“00后”的孩子则不同,因为他们将绝大多数的时间投身于学习之中,由于智能文化的全面浸染,智能已然成为他们生活的一部分——悠闲“智”在。\n\
    \n由此可见,概括而言,今日之教师与学生间鸿沟的形成,核心在于他们感知世界的方式不同,教师是用“五官”感受世界,从而形成对世界的总的观点和看法。学生则是通过智能终端感受世界,他们的世界观更像是间接的世界观(智能原住民如是说),凡事都习惯借助智能终端作为中介,似乎智能才是他们的感官。常言道：“有什么样的世界观,就有什么样的方法论。”因此,教师与学生之间世界观的不同,决定了教师与学生之间看待问题的角度和解决问题的方法的不同。\n\
    \n可见,教师与学生之间的代际鸿沟,是影响教学活动效果的重要因素,而问题的解决关键在教师。人工智能时代,教师的角色需要重塑,教师的素养需要重新培养。教师,需要站在时代前沿,要面向学生进行广泛思考,积极向学生学习,积极投身于提升自身素养的行列中,方能“破茧成蝶”,化身学生发展的智慧引路人。\n\
    \n二、社会化与反向社会化：智能时代教师向学生学习\n\n人工智能时代,智能原住民与智能移民的冲突回归到教育领域,表现为教师与学生之间的代际鸿沟,反映的是传统教育与智能教育的不兼容性。师生之间代际鸿沟的存在,除了源于他们世界观的不同,还因为教师与学生接受新事物的能力的差异、智能技术的快速发展、国家教育政策的引导,以及民主、平等、法制等社会主题的时代性关注。\n\
    \n在传统教育中,学生的社会经验主要来自父辈、老师、长者、权威人物等。年长一代充当教育的实施者,社会化的方向是单向的——自上而下的社会化。但在智能时代,孩子、学生、年幼者不仅是社会化的对象,还是社会化的实施者。有时,父辈、教师、长者、权威人物也要受到孩子、学生、年幼者、下属的教育和指引。因此,人的社会化具有双向性,而非传统意义上的单向社会化。这就产生了反向社会化概念。\n\
    \n反向社会化又称为“文化反养”,是指年轻一代将文化知识传递给年长一代,或者说是传统的受教育者对施教者反回去施加影响,向他们传授社会变化的知识。在传统农业社会里,人们生活在封闭、保守的生活环境中,社会经验的获得方式比较单一,因此儿童的社会化主要受年长一辈的教化。\n\
    \n反向社会化是现代工业社会的产物,尤其是信息社会和智能社会的产物。美国人类学家玛格丽特·米德在其《文化与承诺》一书中提出,当今世界,代与代之间的矛盾与冲突,既不能归咎于社会和政治方面的差异,更不能归咎于生物学方面的差异,而主要是源于文化传递方面的差异。她把人类社会自古至今的文化分为三种基本形式：前喻文化、并喻文化和后喻文化。\n\
    \n“前喻文化,是指晚辈主要向长辈学习;并喻文化,是指晚辈和长辈的学习都发生在同辈人之间;而后喻文化则是指长辈反过来向晚辈学习^([\\[1\\]](#txt006.html#footnote_content_txt006_1))。”在后喻文化中,原先处于被教化者地位的晚辈能够“反客为主”,充当教化者的角色。米德所描述的这种现象,在人工智能时代表现得更为突出。现实中,大家可以经常看到,许多教师都是从自己的学生那里学会了操作计算机、制作课件、使用PS软件、智能数据库检索、电子书下载、智能购物、正确使用微信等,这正是后喻文化的现象表征。\n\
    \n(一)反向社会化的成因\n\n米德认为,在后喻文化中,原先处于被教化者地位的晚辈之所以能够充当教化者的角色,是因为古往今来没有任何一代能够像他们一样经历如此巨大而急速的变化,也没有任何一代能够像他们这样“了解、经历和吸收在他们眼前发生的如此迅猛的社会变革”。具体说来,在人工智能时代,之所以产生反向社会化,其主要原因有如下几个方面："
  fmt: '

    # 人工智能时代的教师角色与师生关系


    ## 人工智能教师的局限与人类教师的应对


    人工智能教师的存在，是对标准的绝对执行。人工智能教师发展至今，其实还是没有逃离“专家系统”的“遗传基因”的影响，这既决定了它们在解决问题方面的惊人能力，也突出了它们不会从事育人工作的局限性。当学生向人工智能教师求助时，有求必解，但却不是从更智慧的层面引导学生自己建构解决问题的策略。久而久之，学生将会形成对人工智能教师的依赖。“捆绑式”的学生成长模式，不利于学生的批判思维、创造思维的生成，极端情况下还容易毁掉学生的前程，最后沦为人工智能教师教学情境下的牺牲品。


    人工智能教师的局限性，似乎成为人类教师不可被其替代的最有力证据。而人类教师的优势所在，正好是人工智能教师所不能弥补的、无法被其替代的地方。但人类教师也不得不注意，如果他们不能掌握人工智能教师所不能掌握的技能，那么人类教师极有可能被人工智能教师所淘汰。正如雷·克利福德所言：“科技不能取代教师，但是使用科技的教师却能取代不使用科技的教师^[[7]](#txt005.html#footnote_content_txt005_7)。”教师无远虑，必有近忧。既然已经找到人类教师可能会被人工智能教师取代的可能性，对其进行提前防备便是人类教师的当下之紧要。


    2017年11月，由习近平总书记亲自主持召开的十九届中央全面深化改革领导小组第一次会议审核通过的《关于全面深化新时代教师队伍建设改革的意见》中提到，到2035年，我国要基本实现教师管理体制机制科学高效，实现教师队伍治理体系和治理能力现代化。教师要主动适应信息化、人工智能等新技术变革，积极有效开展教育教学。人工智能时代，“职业智能化”和“智能化职业”交替发展，人类教师的智能化发展与人工智能教师的职业化发展并行不悖。当人工智能教师的职业化发展如履平地之时，人类教师的智能化发展也应迅速推进，积极主动地适应好智能社会的大调整与大变革。


    人类教师的智能化发展，是他们在未来的教师行业不被人工智能教师取代的重中之重，也是人类教师与人工智能教师走向融合的必然选择。任何一个科技大发展的时代，人们都无法选择与世界大趋势抗衡，唯有勇立潮头敢担当，装上前沿科技的铠甲，才能看得更高，走得更远。智能时代的教师也是如此，要想不被淘汰，他们别无选择，不得不加入智能化的行列，跟随潮流而进，走“人机”融合之路。


    ## 三、“人机共教”：从对立走向统一


    人工智能教师与人类教师之间的论争，从整个教育的发展视角来看，无论谁胜谁负，都将不利于教育的高质量发展——辩证的发展与融合才是最佳的选择。1983年国庆，邓小平同志为北京景山学校题词：“教育要面向现代化，面向世界，面向未来。”2019年2月，中共中央办公厅、国务院办公厅印发了《加快推进教育现代化实施方案(2018—2022年)》，该《方案》指出，在社会发展的新时代，要推进教育治理体系和治理能力现代化，稳步促成教育的高质量发展。所以，人工智能时代，教育的发展应该聚集各方力量，努力形成教育合力，在化解人工智能教师与人类教师矛盾的同时，促进教育的整体结构更加合理化。


    人机共教，是指人类教师与人工智能教师的共同教学，两者既对立又统一，相辅相成，共同发展。“百年之计，教育为本，教育大计，教师为本”。无论是人工智能教师，还是人类教师，都是挑起教育大梁的担当者，合则两利，分则两伤。可见，人机共教是当下两类教师的最佳发展之路，也是防控人类教师被代替的最佳选择。如图5-2所示，“教师智能化”与“智能化教师”，是化解当下人机教师矛盾冲突的两大智能化走向，是人机实现对立统一的总体架构。


    ![](images/txt005_4.jpg "pagenumber_ebook=80,pagenumber_book=70")


    图5-2 人机融合


    在前一节的论述中提到，人工智能教师的教学活动是简单且重复的，但是在特定的教学情境中，它具有执行效率高、标准落实精准的优势，而人类教师却是不具备的，或者说是远远比不上人工智能教师。但不容忽视的是，人类教师无疑在批判思维、创新思维和价值判断等方面具有超越价值，为了突破人机相互竞争与淘汰的循环，为了实现人机融合与发展，务必要从技术、思维与结构三个视角进行融合创新，从而突出未来教师的“非传统属性”。


    人工智能教师与人类教师的融合与超越，技术手段是融合发展的现实基础，思维层面的融合是方向保证，结构融合是人机共教的着力点。技术的融合要解决的核心问题是两者之间的鸿沟问题，包括人类教师的“技术盲点”与人工智能教师的“价值盲点”两大子问题。思维的融合，主要是人工智能的机械思维与人类的辩证思维的融合。结构的融合，主要是指人类教师与人工智能教师的各方面素养的结构性契合。


    根据5-2的人机融合结构图可知，在整个人机融合的过程中，将会促成技术与价值有机融合的未来教师的诞生。在人机共教的整体智能化走向中，未来教师将会形成以人类肉身为载体，技术性知识与技能为护身符，生命关怀与人文价值为灵魂的全能型教学人才或者是教育家，教师的面貌将被彻底颠覆。


    因此，从当下做起，在借助人工智能技术教育学生时，需要认识到人工智能教师作为知识传授的强者的事实，也需要引导相关人类教师的教学，要从面向知识体系的传授，转向面向人文底蕴、责任担当、国家认同、跨文化交流等核心素养的培养。学生的创造能力、审美能力、协作能力、知识的情境化运用能力是人类教师所应关注的核心和重点^[[8]](#txt005.html#footnote_content_txt005_8)，在人类教师与人工智能教师的分工协作中走向统一。


    人工智能时代，未来教育人才队伍的培养任务艰巨，其中尤以全能型教师教学能力的培养为关键难点。但无论如何，走人机共教的未来教师之路是必然的选择，也是人类教师真正不被人工智能教师淘汰最为有效的途径。未来教师的出现，需要新的教育方式、教育制度、教育资源与教育结构的支持。若要想尽早发挥未来教师的价值，当前就应该积极开展理论创新与实践落地工作，敞开闭塞的门窗，呼吸新世界的新鲜空气，突破和超越传统教育的藩篱，加速推进教育治理体系与治理能力现代化进程。


