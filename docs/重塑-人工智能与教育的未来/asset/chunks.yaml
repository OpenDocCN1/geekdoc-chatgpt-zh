    # 第四章 时空超越：新的教育在场方式


    ## 一、自由支配的学习时间：延伸学生自由发展的可能


    时间是人存在的形式。马克思认为：“时间实际上是人的积极存在，它不仅是人的生命的尺度，而且是人的发展空间^[\[1\]](#txt004.html#footnote_content_txt004_1)。”换言之，时间是以生命的衡量尺度和人的发展空间两个维度进行表征。人的历史、现在与未来都将被时间统摄无遗；人的一切活动，都将与之密切相关；人类的工作、学习与生活，都将在时间的流淌中刻下深深的痕迹，从而在历史的积淀中塑造成一个立体的人物形象。


    时间具有一维性和不可逆性。在以往的人类印象中，流淌着的时间，是一去不复返的“昨天与今天”的反复，没有人可以凌驾于它之上。因此，人类在时间面前，只有两种选择，一是与时间赛跑；一是被时间“牵着鼻子走”。人类的教育活动与学习活动也不例外，都将受到时间的约束，没有时间的存在，发展的可能性也就无从谈起。


    时间是构成学习活动的重要元素，有效地利用学习时间，对于学生学习效果有明显的影响。在传统教育中，教育的中心是课堂、教师与教材，固定的授课时间、固定的授课教师、固定的作息时间、固定的运动时间等，学生的自由也是被固定好的。这样一来，学校的每项活动，都从整体上反映出教育模式的封闭性特征，使学生成为“固定性”的一部分，学生自由学习的时间很少，一般都是按照既定的学习计划进行。在这种状态下，学生有效利用学习时间是被动的。所以，学生在学习的过程中，容易出现浪费学习时间、学习效率低、时间管理不当、有效学习时间短等问题。但在智能新时代，这些问题正在被突破和超越。


    ### 学习时间尺度的留存性


    智能时代的教育，在学习时间尺度上具有留存性。学习时间尺度上的留存性，是指学习过程的留痕与数据化，可以填补传统教育在学习数据领域的空白。譬如，学生在视频网站上进行学习，可以及时在视频下方的评论区进行在线反馈，或者在弹幕中发表自己学习的想法和观点，所有这些学习过程中积累起来的数据，最终都可以通过运用人工智能数据挖掘技术，对其进行历史复原与可视化整合，实现在既往形态上的学习时间封存。在深度学习领域，“长短期记忆网络技术”与“深度递归网络技术”，恰好能够有效助力模式识别，使不同尺度的数据信息在不同的时间维度上流动，它将为学生后期管理学习时间提供必要的帮助。更有甚者，它可以直接从中反映出学生学习的规律，或者学习的弊端，进而辅助学生养成良好的学习习惯，提高学生自主学习的能力。


    ### 学习时间尺度的聚合性


    学习时间尺度上的聚合性，是指在同频时间尺度上发生的多空间学习活动的聚合，依托人工神经网络技术，能够促进多空间泛在的学习活动的有机连接，实现在多向度的时间中整合零散的学习成果，从总体上节约学生学习的时间。从理论上讲，每个人的学习时间都是相同的，在同一时间范围内，如果将所有的学习者进行的学习活动看作是一个巨型网络，那么每个人的学习活动只能算作是一个时间节点。学习空间中的每一个时间节点的集合，则构成整个人类的学习时间，这个过程中所产出的所有学习成果，最终以智能共享的方式反馈到每个时间节点上。所以，时间的聚合性，为每个学生的学习奠定了思想共鸣的基础，以及学习成果共享的条件。


    从学习结果的角度来讲，由于有共享作为前提，学生要想达到节约学习时间的目的，势必要从整个学习时间流中寻找学习资源的连接技术。此时，不得不提及以人工智能技术为基础的在线学习系统。多个学习者同时在此系统中学习，其学习成果的平台化汇总与知识图谱的数据建模，数据的平台化共享与学习过程的交流互动，能够有效以群体之优势，促进实现个人迅速获取较为全面的学习资源的目的，这无疑给每个学生节约了较多花费在寻找学习资源的过程中的时间和精力。这正如马克思所指出的：“每个人的自由发展是一切人的自由发展的条件^[\[2\]](#txt004.html#footnote_content_txt004_2)。”只有当足够数量的学习者参与到智能在线学习系统，它的用户的受益程度就高。


    人工智能时代的教育，在学习时间尺度上具有留存性和聚合性特征。留存性的存在，是基于智能技术在教育领域的强大存储能力和运算能力，它对教师与学生、学生与网站、学生与学生、学生与智能机器的互动过程进行全方位、多层次的记录和运算。在传统教育中，随着学生学习时间的流逝，本来已经不能再继续拥有的时间，现如今却能借助人工智能技术，有效地将之转换为教育大数据，从而填补了学生学习的“过去式”在时间上的空白。


    聚合性的存在，是基于人工智能技术在学习效率上的赋能。在智能机器的优势转化中，它有效地将教师的备课、授课、考评、学情分析、教学资料的收集；学生的学习、考试、复习、拓展资料的获取；学校的管理、学校文化建设等方面的工作，进行系统整合。在智能技术的优势不断转入教育领域的同时，人们正在将传统教育活动中存在的“必要的琐碎时间”转化为“可自由支配的学习时间”，为“以学生为中心”的学习活动提供更多的空闲时间。


    人工智能时代的教育，教师的“教”和学生的“学”都需要时间，借助人工智能技术，能有效填补教育活动的“过去式”在时间上的空白，有利于促成“历史教育、当下教育与未来教育”在时间维度上的有机融合。人工智能技术在效率上赋能教育，本质上是对已发生的特定教育活动和教育现象进行时间控制的过程，是从“琐碎”走向“必要”的智能化选择，学生学习的主动状态正酝酿于其中，学生的学习主动性、积极性将迎来改变。


    哪一刻，学生会真正感受到时间的存在？自然是学生认识到学习时间价值的那一刻。从学生层面而言，自由时间意味着自由发展的空间，学生的发展又多了一份可能性。马克思在《经济学手稿(1857—1858)》中指出：“自由时间”就是指人“可以自由支配的时间”，是人的“闲暇时间”，是人可用来“从事较高级活动的时间”，是“人能够直接用于发展自身各种本质力量的时间，是使‘个人得到充分发展的时间’^[\[3\]](#txt004.html#footnote_content_txt004_3)。”如今，在智能技术的帮助下，学习资源的易得、学习效率的提升、学习规律的掌握、学习弊端的显现，都在将学生从“被遮蔽”的学习空间中解放出来，还给学生更多“可直接用于发展自身本质力量的时间”。所以，时间的存在，只有在失去的那一刻，才能给予学生感悟到它存在的意义，只有在自由获取时间的那一刻，学生才能感悟出它的塑造价值。


    总而言之，人工智能时代，存在着可自由支配的学习时间，能够延伸学生自由发展的可能。对于一个学生而言，存在可自由支配的学习时间，意义非凡。自由时间的获得，可以有效促进学生的充分发展，学生的能力发展空间、精神发展空间和社交关系空间将会得到延伸，直至学生因此而获得自由发展。


    ## 二、多维教育空间并存：从“割离”到“聚合”的空间转向


    空间，是由长、宽、高等基本元素按照一定的方式组成的结构形态，是度量事物位置差异的一个物理量，“大小”与“虚实”是其直接的呈现方式。空间的类型多种多样，包括物理空间、虚拟空间、思想空间、活动空间等。空间，是人类生存的现实条件，是人类一切活动的载体，也是所有人类技术的应用载体，空间的割离必定会致使人类活动与应用在实践上的终结。


    教育空间，是指由教育活动和教育现象共同组成的结构形态，是空间与教育在实践上的结合。教育空间的智能化，则是智能时代背景下的人工智能技术在教育空间中的探索性应用，其应用的形态包括认识教育空间、改造教育空间与创造教育空间三个维度。在智能时代，人工智能技术对教育空间的赋能，目的就是要实现多维教育空间的并存与一体化发展。人工智能技术与空间概念的融合，催生新的空间科学、空间技术与空间应用，共同构成“技术+空间”的框架与蓝图，对智能教育空间的塑造具有重要意义。

