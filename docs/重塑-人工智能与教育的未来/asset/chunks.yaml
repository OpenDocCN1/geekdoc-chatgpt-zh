    # Chapter 9 Three Creations Education: Cultivation of Innovative Thinking Ability


    - Limitation Analysis: Factors Hindering Innovation in the Intelligent Era

    - Innovation Education: Cultivating Mass Innovation in the Intelligent Era

    - Maker Education: Growth of Makers in the Intelligent Era

    - Entrepreneurship Education: Incubating Mass Entrepreneurship in the Intelligent
    Era

    - Coordinated Efforts: Cultivating Innovative Thinking in the Intelligent Era


    In recent years, innovation education, maker education, and entrepreneurship education
    (Three Creations Education) have attracted widespread attention from educators
    and all sectors of society. On the one hand, this stems from the value of Three
    Creations Education; on the other hand, it is because Three Creations Education
    serves as a powerful response to the rapid development of technology in the intelligent
    era and its transformation into real productive forces. Since the state and society
    vigorously promoted the culture of Three Creations Education, the creative passion
    buried in people''s hearts, long restricted by industrial culture and not well
    released for many years, was instantly ignited. This fundamentally triggered people
    to rethink current education, especially the essence, purpose, practice, and application
    of Three Creations Education, and how to cultivate students'' innovative thinking
    ability in the new intelligent era.


    ## I. Limitation Analysis: Factors Hindering Innovation in the Intelligent Era


    Innovative thinking refers to a way of thinking that breaks conventions and mental
    sets, thinks about, solves problems, and creates new things outside the original
    boundaries of thought; essentially, it is creation and innovation. Innovative
    thinking also refers to a scientific thinking that adapts to the times, advances
    despite difficulties, and pioneers innovation^([\[1\]](#txt009.html#footnote_content_txt009_1)).


    Historically, innovative thinking bears distinct imprints of the times. In the
    traditional agricultural and industrial eras, innovative thinking mainly revolved
    around agriculture and industry; in the big data era, it mainly proceeded from
    the perspective of digitization and datafication; in the artificial intelligence
    era, it mainly revolves around intelligence. For example, innovative thinking
    in the AI era is primarily a cross-disciplinary thinking, integrative thinking,
    and correlational thinking. The origin and development of this mode of thinking
    benefit from the social culture extended by the development concepts of big data
    and AI technology themselves, subtly achieving an era''s innovation culture, thereby
    giving rise to innovation education and promoting the study of innovative thinking.


    In the AI era, the whole and the part begin to present a harmonious relationship
    of organic unity; various perspectives move from "fragmentation" to "integration";
    people''s behavioral modes shift from "single-dimensional" to "multiple intelligences";
    and the technological field also begins to move from individual "technological
    isolates" to "technological complexes." Today, this trend of "holism," "diversification,"
    and "integration" has become inevitable. The intelligent machines invented by
    people are not only expected to replace humans in various repetitive labors but
    are even hoped to alleviate human burdens in the realm of thinking modes. To this
    end, people must first create complex machines that integrate "thinking, behavior,
    and emotion." Therefore, objectively, only those with innovative thinking and
    innovative ability can better adapt to the needs of this era''s development.


    In January 2019, General Secretary Xi Jinping emphasized at the opening ceremony
    of a special seminar for leading officials at the provincial and ministerial levels
    on adhering to bottom-line thinking to prevent and defuse major risks, the need
    to enhance capabilities in strategic thinking, historical thinking, dialectical
    thinking, innovative thinking, rule-of-law thinking, and bottom-line thinking,
    particularly stressing the importance of innovative thinking. General Secretary
    Xi pointed out: "Innovation is the soul of a nation''s progress, the inexhaustible
    driving force for a country''s prosperity, and the deepest national endowment
    of the Chinese nation." In General Secretary Xi''s view, "In fierce international
    competition, only innovators advance, only innovators grow strong, only innovators
    win." In today''s era, grasping innovation means grasping the "bull''s nose" (crucial
    link) that moves the overall situation of economic and social development. Practice
    proves that whether it is a large country or a small locality or enterprise, "innovation
    is the primary driving force leading development." Therefore, General Secretary
    Xi has always required that "innovation must be placed at the core of the overall
    national development, and scientific and technological innovation must be placed
    in a more important position"^([\[2\]](#txt009.html#footnote_content_txt009_2)).
    It can be seen that innovative thinking and innovative ability concern both the
    future and destiny of the Party and the country, and the future of enterprises
    and the long-term development of individuals; truly, "grasping innovation is grasping
    development, planning innovation is planning the future."


    Innovative thinking is the foundation of innovative ability. A person without
    innovative thinking cannot fundamentally possess innovative wisdom no matter what
    method is used. The core of innovative thinking is divergent thinking, associative
    thinking, and integrative thinking. If one cannot master the core and essence
    of innovative thinking, it is difficult to exert the charm of innovative thinking.
    Thus, it can be seen that innovative thinking is the sum of a series of new ways
    of thinking about problems.

