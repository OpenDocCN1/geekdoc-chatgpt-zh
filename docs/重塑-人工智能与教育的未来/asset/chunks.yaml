    # Launch of the "Six Excellences and One Top" Plan 2.0 in 2018 and the Development
    of New Liberal Arts Education


    On April 29, 2018, the Ministry of Education (MOE), together with 13 other departments
    including the Ministry of Science and Technology (MOST), the Ministry of Industry
    and Information Technology (MIIT), and the Ministry of Finance (MOF), jointly
    convened the Launch Conference for the "Six Excellences and One Top" Plan 2.0
    in Tianjin. The conference emphasized the comprehensive implementation of the
    "Six Excellences and One Top" Plan 2.0, the development of New Engineering, New
    Medical Sciences, New Agricultural Sciences, and New Liberal Arts, promoting a
    "Quality Revolution" across universities nationwide, forming a "Quality China"
    brand covering all fields of higher education, and winning the tough battle for
    the comprehensive revitalization of undergraduate education^([\[11\]](#txt007.html#footnote_content_txt007_11)).


    ## Introduction and Strategic Layout of New Liberal Arts Education


    The introduction and strategic layout of New Liberal Arts Education have ushered
    in a new wave of development for domestic liberal arts education; the argument
    of "Liberal Arts Uselessness" has collapsed on its own, causing related research
    to receive high attention.


    Universities such as Renmin University of China, Zhengzhou University, Xi''an
    Jiaotong University, and East China Normal University have opened new channels
    for liberal arts development.


    Even Tsinghua University, long known as "China''s Highest Institute of Technology,"
    is promoting the construction and development of New Liberal Arts, striving to
    elevate its New Liberal Arts education to a new level.


    The rise of domestic New Liberal Arts Education represents a return of liberal
    arts education after decades of neglect.


    The "New" in New Liberal Arts Education is reflected in "comprehensive interdisciplinary
    learning," signifying that the traditional categorized "isolated" disciplinary
    teaching model is changing.


    ## Dilemmas Facing the Development of New Liberal Arts Education


    The development of New Liberal Arts Education, due to its highly comprehensive
    and interdisciplinary nature, also faces new difficulties.


    Professional New Liberal Arts faculty teams need to be cultivated; professional
    New Liberal Arts teaching resources need to be explored; professional New Liberal
    Arts teaching evaluation systems need to be established.


    All of the above will become obstructive factors in the development of New Liberal
    Arts Education, urgently requiring new tools and means to address the new problems
    existing in New Liberal Arts Education.


    Considering the comprehensiveness and interdisciplinary nature of New Liberal
    Arts, it can be foreseen that the development process of New Liberal Arts Education
    will inevitably feature an interplay of "complexity" and "massive complexity."


    ## Opportunities for New Liberal Arts Education in the Artificial Intelligence
    Era


    In the AI era, intelligent education systems possess both high-speed computing
    capabilities and the advantage of computational models that "simplify complexity."
    Coupled with the massive multi-source heterogeneous data accumulated throughout
    the history of liberal arts education, AI technology has unique capabilities precisely
    in handling issues of "complexity" and "massive complexity."


    Meanwhile, the MOE''s 2018 "Notice on the Action Plan for Artificial Intelligence
    Innovation in Higher Education Institutions" pointed out the need to strengthen
    the cross-disciplinary integration of AI with computer science, control science,
    quantum science, neuroscience and cognitive science, as well as mathematics, psychology,
    economics, law, sociology, and other related disciplines^([\[12\]](#txt007.html#footnote_content_txt007_12)).


    It is evident that, whether at the technical level or the policy level, the bottlenecks
    encountered in the development of New Liberal Arts Education in the AI era will
    find new solutions in the field of AI technology.


    ## Artificial Intelligence and the Cultivation of New Liberal Arts Faculty Teams


    The cultivation of New Liberal Arts faculty teams is critical to the success or
    failure of New Liberal Arts construction and development.


    During the New Liberal Arts construction process, Dean Cao Shenggao of the School
    of Chinese Classics at Shaanxi Normal University frankly stated: "Whether liberal
    arts can be done well depends crucially on the teachers."


    Therefore, introducing AI technology into **New Engineering Education** should
    first focus on cultivating a batch of high-quality New Liberal Arts faculty teams
    to ensure the sustainable development of New Liberal Arts Education.


    In New Liberal Arts Education of the intelligent era, the educational activity
    process naturally centers on intelligent education. This includes the use of intelligent
    teaching equipment, cultivation of teachers'' intelligent teaching literacy, transformation
    of intelligent teaching concepts, formation of comprehensive liberal arts teaching
    literacy, and forging of teachers'' intelligent innovation literacy. All these
    require leveraging the value and advantages of AI technology to cultivate interdisciplinary
    talents with a comprehensive New Liberal Arts educational background, thereby
    building a top-tier New Liberal Arts faculty team.


    First, higher education institutions should take the lead in reforming teaching
    materials for **New Engineering** faculty cultivation, bridge the fragmentation
    of teacher quality caused by disciplinary teaching in the upstream education stage,
    focus on New Engineering basic theoretical education, enrich educational practice
    curricula, and forge new-type New Engineering talents.


    Second, higher education institutions should construct a sound incentive policy,
    actively encourage disciplinary teachers to undergo re-education and further learning,
    provide financial assistance for teachers'' re-education, improve teachers'' professional
    levels and literacy, so as to better engage in the cultivation and teaching of
    New Engineering talents^([\[13\]](#txt007.html#footnote_content_txt007_13)).


    Third, higher education institutions should actively recruit AI interdisciplinary
    talents. **New Engineering** faculty teams are scarce, and higher education institutions
    cultivating **New Engineering** faculty teams still lack educational talents.


    Therefore, higher education institutions should focus on recruiting and cultivating
    school-based **New Engineering** educational talents, and on this basis, derive
    a **New Engineering** educational talent team.


    Finally, higher education institutions should create dedicated **New Engineering**
    education platforms, assign specific personnel to promote **New Engineering**
    education work, improve relevant educational systems and reward mechanisms, strengthen
    **New Engineering** education research, ensure the connection between **New Engineering**
    education theory and practice, promote the platform-based development of **New
    Engineering** education, and achieve batch output of **New Engineering** education
    talent teams.


    ## Emphasizing Artificial Intelligence and New Liberal Arts Teaching Resource
    Mining


    In the era of Big Data and AI, the richness and diversity of teaching resources
    provide a good resource foundation for the development of New Liberal Arts Education.


    With the aggregation of New Liberal Arts teaching resource big data—including
    media current affairs materials, open courses in cyberspace, online question banks,
    online resource databases, and New Liberal Arts teaching resources shared by major
    universities—the convenience for teachers and students to access teaching resources
    will increase, but simultaneously the difficulty of screening data for them will
    also increase.


    An important pillar of AI is **Data Mining** technology (`Data Mining`).


    Data mining technology is a scientific method for extracting hidden predictive
    information from large-scale databases or data warehouses; it enables people to
    ultimately recognize the true value of data, i.e., the potential usable information
    and knowledge within the data^([\[14\]](#txt007.html#footnote_content_txt007_14)).


    By applying data mining technology, New Liberal Arts educators and educatees can
    be helped to efficiently acquire teaching resources, avoid the dilemma of educational
    resource screening, and improve the efficiency and quality of New Liberal Arts
    education and teaching.


    ## Artificial Intelligence and New Liberal Arts Teaching Evaluation


    New Liberal Arts teaching evaluation refers to evaluation activities that make
    value judgments and future decision-making behaviors on the process and results
    of New Liberal Arts education based on New Liberal Arts teaching objectives.


    The objects of New Liberal Arts teaching evaluation will include students, teachers,
    teaching environment, teaching methods, teaching content, teaching management,
    etc.


    Since the evaluation objects possess dynamic changing characteristics, the establishment
    of the New Liberal Arts education teaching evaluation system needs the assistance
    of AI technology to mine educational big data from the process and results of
    New Liberal Arts education, conduct teaching evaluation modeling based on data,
    and establish a professional AI teaching evaluation platform.


    In the evaluation system, comprehensive teaching evaluation content and objects
    should be included, a standardized teaching evaluation index system established,
    and the value and advantages of AI technology''s deep learning, intelligent perception,
    and intelligent intervention fully leveraged.


    In terms of evaluation methods, an evaluation pattern integrating formative evaluation,
    diagnostic evaluation, and summative evaluation should be facilitated, highlighting
    the combination of formative evaluation with the dynamic characteristics of the
    teaching process, achieving the unity of value and scientificity in New Liberal
    Arts teaching evaluation.


    # V. Scientific Integration: An Important Path for University Talent Cultivation
    in the Intelligent Era


    Modern science is both highly differentiated and highly integrated.


    On the one hand, differentiation becomes increasingly finer, disciplines increasingly
    numerous, and the degree of specialization increasingly higher.


    On the other hand, various interdisciplinary, transdisciplinary, and marginal
    disciplines continue to emerge, and the speed of integration becomes increasingly
    higher.


    It can be said that scientific differentiation is actually another form of expression
    of scientific integration.


    Therefore, integration occupies the dominant trend of scientific development.


    This trend is specifically manifested as:


    ## Specific Manifestations of the Trend of Modern Scientific Integration


    ### First, Multi-level and Multi-dimensional Intersection and Penetration of Disciplines


    Modern science has changed the past situation of mutual isolation and disconnection;
    on the basis of high differentiation, disciplines mutually penetrate, widely "hybridize,"
    are intricately intertwined, and serve as foundations for each other, developing
    into thousands in quantity; the gaps between disciplines are gradually being filled,
    and horizontal connections between knowledge are becoming increasingly close.


    As Nobel Foundation Chairman Sune Bergström profoundly pointed out: "From the
    selection of Nobel laureates in recent years, it can be clearly seen that the
    old academic boundaries between physics and chemistry have been broken through
    in various aspects. They not only intersect with each other but also form continuous
    zones without clear boundaries; even in other sciences such as biology and medicine,
    the same relationship has occurred."


    ### Second, The Emergence of Transdisciplinary Disciplines


    Systems science formed by the cross-penetration of disciplines such as electronic
    computers, communication technology, biology, physics, and mathematics—including
    systems theory, information theory, and cybernetics formed after WWII, and dissipative
    structure theory, synergetics, catastrophe theory, hypercycle theory, and chaos
    theory flourishing since the 1960s—with their fruitful systems methods and in-depth
    exploration of complexity, profoundly reveal the connections and developmental
    laws between various levels of nature.


    The emergence of this large batch of emerging transdisciplinary disciplines constitutes
    the new discipline category of systems science, forming the basic theory of modern
    artificial intelligence.


    ### Third, The Emergence of Comprehensive Disciplines


    The widespread application of science and technology has greatly accelerated the
    pace of human social development, while also making today''s socio-economic systems
    more complex, confronting humanity with a series of major issues, such as global
    problems like environmental, ecological, and energy issues, as well as national
    development strategies and social management issues.


    To properly solve these problems, natural sciences, social sciences, and humanities,
    which previously conducted research independently, must cooperate well, break
    the traditional scientific system of segmented blocks and lack of communication,
    and replace it with a comprehensive system integrating the requirements of various
    disciplines.


    Environmental science, management science, and cognitive science are all highly
    comprehensive disciplines, embodying the convergence of natural sciences, social
    sciences, and humanities.


    ### Fourth, The Mathematization of Science


    Mathematics, which in the past was only closely linked to part of natural sciences,
    has now penetrated into all scientific research.


    Disciplines such as biology, psychology, economics, and sociology are increasingly
    widely applying mathematical language, models, and methods for quantitative research.


    The rise of systems science and the widespread application of computers have further
    promoted the process of scientific mathematization.


    By the 1980s, a series of economic models, social models, and psychological models
    had been established, and mathematical methods were extensively borrowed for the
    argumentation of social science theories and the prediction and decision-making
    of social operations.


    Data analysis has become an important feature of modern economics and management.


    ## Five Implications for University Talent Cultivation


    The trend of modern scientific integration provides an important implication for
    university talent cultivation—in university talent cultivation, one must be good
    at grasping this characteristic, pay attention to "generalist" education, and
    cultivate high-quality talents.


    ### First, Guide Students to Comprehensively Master Knowledge and Form a Rational
    Knowledge Structure


    Learning knowledge and skills is a primary task that university students must
    strive to complete during their schooling.


    Regarding knowledge, British philosopher Bacon long ago said: "Knowledge is power,"
    emphasizing the important role of knowledge, which has become even more prominent
    in the intelligent economy era, because knowledge is an important basis for assisting
    students in forming innovative thinking.


    In fact, in the intelligent economy era, the connotation/extension of the concept
    of **knowledge** (`knowledge`) is also gradually expanding.


    The "Organisation for Economic Co-operation and Development" (OECD), headquartered
    in Paris with developed countries as its main members, in its report "The Knowledge-Based
    Economy," cited the Western "4W" concept of knowledge-seeking since the 1960s,
    dividing all knowledge created by humanity so far into four major forms:


    **`know-what`** (know what, factual knowledge), **`know-why`** (know why, principle
    knowledge), **`know-how`** (know how, skill knowledge), **`know-who`** (know who,
    human capital knowledge).


    Dr. Wu Jisong of China added three more forms in his monograph "Knowledge Economy":
    **`know-when`** (know when, time knowledge), **`know-where`** (know where, location
    knowledge), **`know-quantity`** (know how much, quantitative knowledge).


    The importance of knowledge itself and the diversity of knowledge forms give university
    teachers in the new era a very important implication—in the university teaching
    process, students should be guided to make full use of limited time to learn as
    much knowledge as possible, paying special attention to the following aspects:


    1. Professional knowledge and its latest progress and dynamics that must be learned
    as a "**professional**."

    2. Knowledge that should be possessed as a "**cultured person**," e.g., natural
    science students should learn some humanities and social science knowledge, humanities
    and social science students should learn some natural sciences, especially modern
    science and technology knowledge.

    3. Knowledge needed to expand as a "**social person**" to enhance one''s social
    competitiveness after graduation, e.g., students learning Chinese and foreign
    languages had better learn more about finance, banking, law, and modern management.

    4. "Instrumental" knowledge that must be mastered for learning knowledge, such
    as philosophy and logic as thinking tools; mathematics, computers, and AI as quantitative
    and computational tools; mother tongue and foreign languages as language tools.
    To adapt to the needs of scientific mathematization and international communication,
    special attention should be paid to the learning of mathematics and foreign languages.


    Through diligent study in the above aspects, students will gradually become people
    with a rational "knowledge structure," adapting to the requirements of modern
    science and technology and the intelligent economy for talents.


    ### Second, Require Students to Combine "Specialization" and "Breadth" in the
    Learning Process


    The relationship between "generalists" and "specialists" is an issue worthy of
    serious thought and resolution for today''s university teachers.


    Since the 1950s, the growth of human knowledge has been geometric, i.e., growing
    at a rate of multiples or tens of multiples.


    By the 21st century, human knowledge has been expanding in a three-dimensional,
    cross-intersecting manner—exponential growth, the so-called "knowledge explosion."


    For example, human scientific knowledge doubled every 50 years in the 19th century;
    every decade or so in the mid-20th century; now, every 5-6 years; some predict
    that by the mid-21st century, it will double every 1-2 years, or even faster.


    This requires new-century university students to have both a broad and solid knowledge
    foundation, and to be able to engage in specialized or special study and research
    with limited time and energy, track the frontiers of disciplinary development,
    and correctly handle the relationship between the two.


    Here, attention should be paid to the following four points:


    1. "**Breadth**" is the foundation of "**Specialization**." Through extensive
    learning and continuous accumulation, master broad knowledge to lay a solid foundation
    for study and research.

    2. Dialectically understand "**Breadth**." "Breadth" is not without limits; extensive
    reading also requires selection. Aimless, purposeless, unselective, and constantly
    shifting "breadth" is harmful rather than beneficial. One should proceed from
    near to far, from shallow to deep, continuously enrich and update knowledge; persist
    in using various means for knowledge accumulation, and consolidate and deepen
    learned knowledge in study.

    3. Handle the relationship between major and non-major well. To organically combine
    "specialization" and "breadth," one must consider the relationship between major
    and non-major. The major should be "specialized and profound," non-major "broad
    and extensive," with non-major serving the major. In major study, one should strive
    to master new disciplines, new knowledge, new insights, and new dynamics. When
    encountering difficulties in major study, one should check if it is due to reasons
    of knowledge foundation and breadth.

    4. Establish a rational knowledge structure in the unity of "breadth" and "specialization."
    Learning is like an old fisherman casting a net to catch fish; at the beginning,
    the net should be cast as wide as possible, then slowly contracted, finally concentrating
    on one point. In handling the relationship between "breadth" and "specialization,"
    students should be guided to make their knowledge continuously "sequenced," "refined,"
    and "evolved," forming a rational knowledge structure.


    ### Third, Let Students Pay Attention to Transdisciplinary Transfer of Knowledge


    In chemistry, there are many difficult problems in calculating solution concentration,
    but using the method of setting up equations from mathematics solves them easily;
    in biology, the mechanisms of photosynthesis and respiration are very complex,
    but representing their processes with chemical reaction equations makes them clear
    at a glance; in geography, the speed of Earth''s revolution is difficult to understand,
    but using Kepler''s laws from physics to design a calculation problem makes it
    suddenly clear... Such examples are innumerable.


    In fact, science and knowledge are originally a unified organic whole interwoven
    with each other; the reason people divide them into different disciplines like
    mathematics, physics, chemistry, astronomy, geography, biology, etc., is only
    for the convenience of research and study.


    As the famous physicist Planck pointed out: "Science is an internal unity; its
    decomposition into separate departments is not due to the nature of things, but
    due to the limitations of human cognitive ability. In fact, there exists a continuous
    chain from physics to chemistry, through biology and anthropology to social sciences;
    this is a chain that cannot be broken at any point."


    In the teaching process, we must intentionally enable students to grasp the interconnections
    between knowledge of different disciplines, paying attention to transferring knowledge
    from one discipline laterally to another.


    This not only helps consolidate old knowledge and smoothly accept new knowledge
    but also enhances memory, improving the ability to analyze problems, solve problems,
    and think dialectically.


    Over time, students can form their own knowledge network, establish a rational
    thinking structure, more effectively understand the whole of things, which is
    also very important for students'' re-learning and application after graduation,
    and helps students form the concept of lifelong learning.


    ### Fourth, Enable Students to Learn the Transplantation of Methods


    So-called "transplantation" is the application of concepts, categories, and research
    methods of one or several disciplines to other disciplines.


    Among various transplantations, the transplantation of methods is more important.


    In the teaching process, we must not only make students pay attention to the lateral
    transfer of knowledge but also make them pay attention to the mutual transplantation
    of methods; we must help students learn some transdisciplinary knowledge, such
    as systems theory, information theory, cybernetics, etc. They reveal the essential
    connections and laws of motion of the objective material world from different
    aspects, providing new ideas for the development of modern science and technology;
    following relativity and quantum mechanics, they have once again completely changed
    the world''s scientific picture and scientists'' thinking modes.


    The methods they provide, such as systems methods, information methods, functional
    simulation methods, etc., have greater universality, making the transplantation
    between methods more realistic.


    At the same time, students should also pay attention to the mutual transplantation
    between natural science methods and social science methods; although natural sciences
    and social sciences follow different laws, their research methods are mutually
    referable.


    Natural science methods, such as mathematical and logical methods, observation
    and experimental methods, simulation and analogy methods, have been transplanted
    in large numbers and widely into social science research since the early 20th
    century, achieving great success.


    Since the mid-20th century, some relatively universal and mature social science
    methods, such as value analysis methods, ethical norm methods, teleological hypothesis
    methods, historicism methods, intuitive extrapolation methods, fuzzy thinking
    methods, etc., also began to be introduced and applied to natural science research.


    Transplanting natural science methods into social sciences helps increase the
    precision and persuasiveness of understanding social phenomena and laws; transplanting
    social science methods into natural sciences helps enhance the applicability of
    research on natural phenomena and laws, and enables researchers to grasp their
    own value orientations.


    ### Fifth, Guide Students to Be Good at Reclaiming the "Virgin Land of Science"


    Each discipline has its own specific research scope and boundaries, while the
    "blank areas" between disciplinary boundaries are often those that no discipline
    has ever explored.


    With the continuous deepening of scientific understanding, these "blank areas"
    gradually become objects of scientific research, and are often the places where
    results are most easily achieved.


    American scientist Wiener said: "The field where the greatest harvest can be obtained
    in scientific development is the no-man''s land neglected between various established
    departments... to conduct appropriate surveys in these blank areas on the map
    of science. This can only be undertaken by such a group of scientists, each of
    whom is an expert in their own field, but each of whom has very correct and proficient
    knowledge of their field."


    Wiener likened these "neglected no-man''s lands" to uncultivated "virgin land
    of science."


    And later disciplines such as cybernetics, information theory, and electronic
    computers bloomed brilliant flowers on these "uncultivated virgin lands."


    A large number of facts prove that results are more easily achieved in the marginal
    areas of disciplinary intersection and penetration; teachers must cultivate students''
    innovation consciousness and exploration spirit, guide and encourage students
    to explore the "no-man''s land" between disciplinary boundaries.


