    # 第三章 难言之隐：传统教育的诉说


    ## 参考文献


    [8] 丁艳杰.“以人为本”的人性化教育[J].产业与科技论坛,2009,8(05)：179-180.


    [9] Jiuyu Xiang.Values of Ideological and Political Education and People[J].Teaching
    and Research,2002(12)：55-59.


    [10] 新华网.习近平报道专辑.习近平向国际人工智能与教育大会致贺信.http://www.xinhuanet.com/politics/leaders/2019-05/16/c_1124502111.htm.


    [11] 百度百科.国民素质[OL].(2019-9-26)[2019-10-9]https://baike.baidu.com/item/%E5%9B%BD%E6%B0%91%E7%B4%A0%E8%B4%A8/8589150?fr=aladdin.


    ## 教育资源短缺：教育公平问题突出


    “因材施教”：一个停留在理论层面的原则


    以教师为中心：造成教育的“人学空场”


    知识更新速度快：教育与社会发展脱节


    “李约瑟难题”与“钱学森之问”：重思我们的教育


    哪里有问题,哪里就有需求,问题就是需求的不满足。如今,以应试教育为代表的传统教育,在素质教育的呼声中“声名扫地”。然而,传统教育并没有就此直接向素质教育转型,也没有宣告退出历史舞台,而是在现实中形成了“以素质教育为辅,以应试教育为主”的教育结构。可见,传统教育的实际力量仍然在主导着整个社会的教育走向,并没有因为素质教育的发展而停滞。但不可否认的是,在素质教育的发展过程中,传统教育的弊端已越来越凸显。


    ### 一、教育资源短缺：教育公平问题突出


    所谓教育资源短缺,是指由于受到教育主客体资源条件的限制,教育对象在资源的获取与权利的享有中出现供给不足,或是在供给与需求的对比中感受到的资源丰富程度的现实差距。所谓教育公平问题,是指教育对象在教育机会的公平占有中遇到特定阻力(如社会阻力、家庭阻力和政策阻力等),导致在“静态”领域或“动态”领域中的资源分配出现不均衡的问题,包括机会公平问题、过程公平问题、结果公平问题等。


    教育资源短缺与教育公平问题看似没有联系,实则当教育资源短缺问题发展为局部地区问题时,教育的公平问题也就随之产生,并且由地域演化而来的公平问题,最终会导致教育个体之间的资源分配不均。一般来讲,教育的公平问题直接表现为教育的机会公平问题,而贫富差距问题又是直接导致教育机会不公平的直接原因。因此,教育的公平问题,其本质上是由于教育对象本身的贫富差距问题而引起的资源分配不均的问题。


    改革开放以来,中国的城市化进程快速推进,城市和农村迅速发展。但也随之出现一些社会问题,其中城乡差距问题逐渐引起社会关注。在过去很长一段时间,建设工业大国、工业强国的梦想,一度引领全社会牺牲农村、牺牲环境,重点发展城市工业。在此过程中,城镇经济发展成效显著,但也给社会的发展留下了“后遗症”,教育的城乡差距问题,便是受该“后遗症”的影响所致。城市教育和乡村教育的发展,本来是两条会相交的线,在发展的过程中走向“城乡教育一体化”是理想的目标,但因受限于各种因素(如资源、政策、文化等因素),拉开了彼此的差距。


    我国教育的城乡差距问题,表现为发展不平衡问题：在较为发达的大中型城市,其教育资源丰富多元,与城郊的差距较大;在发展较为缓慢的西部地区,城乡教育的差距相对较小;但若是将沿海的城市教育与西部山区的农村教育相比,差距问题则更加严峻。


    如今,在西部贫困山区,教育的重点仍然是抓智育,“识文断字”是教育活动中最基本的构成要素。而与之相对应的东部沿海城市,教育的发展是为人的全面发展服务的,在培养学生智力的同时,更加强调学生“德智体美劳”的全面发展。这就不难看出,在近年的高考中,像“清北复交”[1]这样的重点大学的招生总体人数中,贫困山区的学生占比数据很小是有原因的。


    教育的城乡差距问题,值得进一步深思。在城乡二元结构的发展环境中,一系列的教育问题不断延展,从家庭、学校到社会,都能体会其间的微妙差距。就家庭层面而言,在农村家庭与城镇家庭的对比中,他们教育孩子的理念显然是不一样的,即使重视程度一样,农村家庭也会受到文化教育资源少、家长的文化程度低(知识的代际传递)、家长的社会关系网络狭窄等因素的限制,很难与城镇家庭相竞争。而且最容易造成学习与实践相脱节的,还要数农村家庭,因为社会的主流文化在城镇,生活环境与学习环境的疏离,易于引起学生的不适应。当然,即便是城镇内的不同家庭,也存在如此问题,但其相对差距较小。


    就学校与社会层面而言,城乡教育资源的不对等问题也较为突出。单从教育硬件设施这个方面看,城市与农村,东部、中部与西部地区,特别是东部沿海城市的教育硬件设施,就远比农村教育基础设施要好上几个等级。工业化与信息化互补发展的城市,教育基础设施改进与提升迅速,这与城市的教育需求不无关系,有经济与技术作为支撑,有市场作为导向,城市的教育基础设施很快就达到了国家教育的现代化水平。但是,农村与偏远的西部地区,情况有所不同,即便是今日,学生上信息技术课还需要多人共享一台电脑设备,实验课很多还停留在理论层面,用以支撑学生做实验的平台尚未建成。


    教育的资源短缺问题,在根源上是城乡二元结构的历史遗留问题,其不良的社会反应,将导致教育不公平问题的出现。其间,具备“天时地利人和”的人群,可以优先享有有限的教育资源。这种有限资源的享有,最终会演变为教育的不公平竞争,与教育的初衷和使命有一定的偏差。


    可见,造成教育资源短缺与教育不公的原因是多样化的,但主要是由于经济的地域发展差异所致,其余如地区资源的配置偏向、国家财政的投入不足、教育政策的不尽合理等问题,都只是在一定程度上造成区域性教育资源短缺。为此,社会各界一直在探讨教育资源短缺问题的救济路线,全面普及义务教育、山区支教、慈善捐赠、修建学校等多维并举。但发展至今,教育资源短缺问题依然严峻。


    因此,需要所有关心教育的各界人士,重新审视该问题的存在。是否真正存在一条新的路子,可以进一步化解这种资源与机会上的不平等问题,哪怕是再进步一小步,其价值亦是全国性的受惠。


    ### 二、“因材施教”：一个停留在理论层面的原则


    “因材施教”是一个非常核心的教学原则,是指教师在教育学生的过程中,要根据学生的个性特征进行教学。太阳下没有两片完全相同的树叶,世界上没有两个完全相同的人。每个学生都是唯一的,无数个唯一构成的社会群体,才会是多姿多彩的、丰富多样的。即便是同样的家庭环境,即便是双胞胎,其发展亦会存在很大差异。从教育学维度看,遗传因素、环境因素、学校教育与主观能动性等因素,是影响学生个人发展的四大重要因素。由于每个学生受到各个要素的作用与力度不同,因而在知识、情感、能力、性格、爱好、道德修养、意志水平等方面表现出明显的个体化差异。


    换言之,采用同样的教育方式“按部就班”地走下去,忽视每个学生学习能力的差异性,很大程度上只能算作是完成教育任务,实则没有走进学生心里,也没有实现教育的价值与教育目的。因此,若能真正实现教育的“因材施教”,于学生而言,意义非凡;于教师而言,功勋卓著。


    早在2500年前,孔子就已经认识到因材施教的重要性,并将之付诸教育实践。现在看来,这是一个多么伟大的创举,有着贯穿历史的惊人穿透力。人们常说,教育是一项专门的职业,普遍性与特殊性共存。说它普遍,是因为它的存在,与其他千万种职业存在共性,都可以理解为某种谋生的手段,或者是教人谋生的手段。说它特殊,是源于它所服务的对象具有特殊性,是一项“教人做人”的工作。每个人都是社会的一员,所以从事教育事业的工作者,在理论上不能对学生进行有选择的放弃,而是需要对每个学生进行有选择的教育。


    关于因材施教,在《论语》之《先进篇》中,有这么一段佳话,将其反映得淋漓尽致。有一天,孔子上课结束回到“休息室”,当学生公西华正给孔子盛水时,子路(仲由)与冉有分别而至,都问了孔子同样的问题,但是孔子给的答案各异,公西华非常困惑,便问老师这是何故,具体细节如下文：


    > 子路问：“闻斯行诸?”子曰：“有父兄在,如之何其闻斯行之?”

    >

    > 冉有问：“闻斯行诸?”子曰：“闻斯行之。”

    >

    > 公西华曰：“由也问闻斯行诸,子曰,‘有父兄在’,求也问闻斯行诸,子曰,‘闻斯行之’。赤也惑,敢问。”子曰：“求也退,故进之;由也兼人,故退之。”


    仔细分析,孔子与子路、冉有、公西华师徒四人的对话充满了智慧的闪光点。同样的问题,所得到的答案却是不同的。在公西华的疑问与孔子的智慧解答的对比中,反映出孔子对于学生是非常熟悉的,知道学生的优点与长处的同时,也知道学生的弱项与不足,故能因材而施教。听完讲解,学生公西华恍然大悟。


    语境变换,如若当时“两个学生”先问公西华这个问题,恐怕答案就很难体现出因材施教的智慧。因此,反思因材施教的执行语境实施起来难免困难重重。教育事业发展到如今,教育体制、授课方式、教学场景、教学方法都有所固定。学校作为教育的主要场所,其适应性明显不足。学生年龄与学习能力的不断变化,发展过程呈现出流动性的特征,幼儿园、小学、初中、中专、高中、大专、职业学院、大学、研究生等,每个阶段遇到的教师不同、环境不同,且教育呈现规模化和固定化特征,教师很难同时兼顾教学质量和教学效率,只能以“分数”作为最直接的评价指标,讲求集体分数的上涨,对于个体而言,很难做到个性化关照。本质上,这是流动性与固定性的冲突所致。


    学校的授课场景,基本是大班式班级授课制,教师与学生之间是“一对多”的关系,时间紧,任务重,在完成教学任务之余,很少有时间去留意每个学生的特殊境遇。再加上学生的个性化差异非常明显,且极具变化,更是加重了教师实施因材施教的难度。在长时间的教育跨度中,教师与学生的关系也表现出不稳定性,不同教学阶段的老师自然要更换,因为让中学老师给研究生上课,这本身也是不现实的。回看孔子因材施教的教育语境,“孔子弟子三千,达者七十二人”,且这些学生多数是终生追随孔子,这是一种非常稳固的师生关系,教师自然很容易掌握学生的个性与脾气,但是现如今的环境则不允许。


    就因材施教本身而言,由于关涉教师素养、应试教育指标、师生的不平等地位等因素,实施过程纷繁复杂。教师对学生之“材”的判断局限于教师的经验与想象力,刻板地因材施教,学生很容易成为“教师想要培养的人”。但这样的人不是创新的人,也不是学生想要成为的人。因为因材施教蕴含着的潜台词是学生和教师的不平等关系,教师是先行的觉悟者、知识和真理的掌握者,真理需要教师教给学生。超越因材施教则认识到学生在逐渐发展,教师即使年纪较大、经验丰富,但教师也在发展中,教师并不完全掌握真理[2]。


    如此看来,因材施教的落地实施未免太难,因为涉及的影响因素过多,从根本上关系到教育理论、教育方法、教育手段与学生实际的综合考量。如果不能做到理论与实践在历史与现实逻辑上的统一,那么因材施教的实施便会与学生的身心发展规律、对学生实施教育的规律不相符合。


    不能否认的是,在过去这么多年里,应试教育、班级授课制、唯分数论、“跟班走”的这种教育模式,为我国的经济腾飞培养出无数的职业人才,做出过巨大贡献,至少截至目前来看,它是利大于弊的。但如果在智能新时代,可以将“弊端”的危害降到更低,我们的学校,我们的教师,可以借助一些技术化的手段和方法尽量做到因材施教,那么我们为什么不提前去做到这一点呢?


    “因材施教”的本质是“知人善教,各尽其才”,虽在历史的长河中形态各异,但演化到今天,我们可称其为个性化教育、定制化教育、柔性化教育等。万变不离其宗,因材施教主要还是强调教育要因学生而异,“对症下药”。因材施教,讲究引导学生走出去,又要返回自己的内心,去探寻与发现具体情境中那个不一样的自我,只有找到真实的自己的人,才能与自己的世界和解,才能与外面的世界达成共识,才能在追寻中形成批判与创新精神,从而走向更好的未来。


    ### 三、以教师为中心：造成教育的“人学空场”


    以教师为中心,是传统教育的显著特征,有其特定的历史渊源。中国是一个农业大国,传统的农业社会,是一个“重农抑商”的熟人社会,“安土重迁”的思想观念深入人心。熟人社会,依靠血缘和地缘维系着一个群体成员之间的关系,人与人之间的交往无须过多的专业背景知识。人们之间的教育活动多数是围绕农业生产经验而展开的,如对一年四季的气候变化的掌握,对“春耕、夏种、秋收与冬藏”技能的经验传授等,构成农业社会教育活动的基本内容。


    若要从狭义的教育来界定,在传统的农业社会,大部分人都没有接受过教育,而真正接受过教育的人,只是上层阶级的人,或者是书香门第。在这样的时代背景下,通常来讲,人们对于那些制约着自己而又无法对其进行深入了解的智慧心存敬畏。因此,从平民百姓的角度来看,对文化知识的敬畏感,正是源于他们深受来自上层知识分子的制约,让他们产生一种思想——只要能够掌握知识,自己也能成为上层人士。随着社会生产力的发展,社会生产劳动日趋复杂,在国家统治队伍不断壮大的前提下,下层社会向上层社会跃升的渠道也日渐开放,通过读书求取功名利禄,改变社会阶层,不失为上上策。


    既然要改变命运,那首先就要拜师学艺,“无师自通者”少之又少。所以,教师作为一个专业代表登上历史舞台。“师者,所以传道授业解惑也。”教师是明白道理的人,是有渊博知识的人,是知书达理的智者。相比较而言,他们比无知者多了更多看世界的角度。所以,他们能够得到社会的特别推崇和敬重,就变得理所当然。这就是传统“师道尊严”的来源,也是教育活动形成“以教师为中心”的早期文化的原因。在这段时间里,学生的无知,确实需要“以教师为中心”,才有利于他们学到更多的知识与智慧。在该教育特征形成的早期和中期,“以教师为中心”确实对社会人才的培养发挥过重要作用。


    然而,随着教育的不断发展和教育水平的不断提高,“以教师为中心”的观念不断招致批判,并在近年来的激进教育改革思想中被作为改革对象提出,要重新认识该问题,要让学生在教学活动中回归——呼吁“以学生为中心”。


    “以教师为中心”反映的是一种权威文化,包括教师权威、知识权威、教材权威等,按特定序列,是源于人们对知识的尊重和敬畏,产生了对教材的权威性的认可,进而演化出教师权威。


    因此,近年来教育界对教师权威的批判,其本质是对知识权威的批判。由于知识获取渠道的多元性、知识的价值变现困难,又或是受到某些“读书无用论”思想的影响,知识的权威性、知识的教师独占性局面逐渐被打破,自然而然,教师的权威性也就开始遭到质疑。


    更深层面,以教师为中心,容易造成教育的“人学空场”——这是其遭受批判的根本原因。对于教师的权威而言,它的价值不言而喻,但是当它的存在开始阻碍学生发展时,让学生不喜欢课堂之后,学生人到心未到的“人学空场”就形成了。在这样的课堂上,学生可能已经开始萌生“混日子、拿文凭走人”的想法,对于探索与建构新知识,那都与自己无关,这也许将是教育活动中存在的最大不幸。


    当人们的教育思想逐渐发展完善之时,便越发明白教育的价值在于引导学生进行自我教育。学生在自我教育的过程中,希冀建构一个能够进行自我反思与自我成长拥有独立人格的人。因此,与“以教师为中心”相对立的一个观点,“以学生为中心”的观点,深受关注。此时,教师势必要进行某种角色的转换,需要以一种新的形象重新出现在学生面前。当然,这在短时间内是很难做到的,要等上一段适应的时间才行。


    总而言之,在新的时代背景下,以教师为中心,以教材为中心,学生只能被动地接受知识,社会神经是反感的。“唯知教育”“唯分数教育”,只会进一步磨灭学生的创造性和批判性思维,要培养学生兼具“独立之精神,自由之思想”,是缺乏科学性的。


    历史上,“学而优则仕”的教育选拔功能,要求学生能够掌握死板的史书典籍,才会受到官府重用。但放眼现在,社会对学生的要求却不在于此,而是集中于考察一个学生在特定的环境中发现问题、分析问题和解决问题的能力。所以,今日之教育改革,势必要关切学生的主体地位的回归,不平等的师生关系需要纠正,让学生成为学习的主体,让教师成为教学活动的规划者、设计者和引导者。


    改,是目标;怎么改,是手段。智能时代,教育改革怎样进行,才能跟上时代发展的脚步,更是需要探讨的问题。


    ### 四、知识更新速度快,教育与社会发展脱节


    我们生活在一个知识大爆炸时代,知识的更新速度惊人,知识的边界不断向外扩展,知识的结构不断出现新的裂变,知识的半衰期正在日渐缩短。


    知识半衰期是指一个新知识,在某个时间段内,由有用到无用,由崭新到陈旧的变化过程,它反映的是某些知识的价值随时间的推移而递减的效应。知识折旧定律认为,如果你一年不学习,你所拥有的全部知识会折旧80%。更有资料显示,“以每年6%～10%的速度更新知识、更新思路,才能适应未来社会的需要”,这并不是危言耸听[3]。


    有研究表明,人类进入19世纪后,知识的更新速度是50年翻一番;进入20世纪初期,知识的更新速度是10年翻一番;进入20世纪80年代末期,知识的更新速度是3年翻一番;进入21世纪初期,知识的更新速度是一年一番,甚至更快……知识大爆炸时代,也是一个知识经济时代,能够迅速跟上知识更新速度的人,更能适应社会的发展变化。从上述对比中得知,过去数百年的知识积累,可能不及当下短短一年或者几个月时间的积累量多。知识每天都在更新与迭代,人人都是知识的创造者、分享者和受益者。


    《礼记·大学》中说：“苟日新,日日新,又日新。”意思是说,对于自己的知识,如果能够更新一天,就应该天天保持更新,在更新的基础上,还要继续更新。古人尚且如此,如今的智能时代,人们更应该如此。


    总的来讲,知识更新速度,是教育系统中最为关键的知识要素。那么,我们的教育系统,是否能够快速适应这个快节奏的变化呢?这个问题非常值得深思,因为它直接关系到教育的质量与效果。


    社会的快节奏文化,快餐、外卖、快递、咖啡厅、滴滴快车等,无不都在体现社会节奏的“快属性”“快生活”“快文化”。快文化氛围的形成,是每个人共同加快生活、工作与学习节奏的结果。因此,为了回应“快文化”,教育体系也要跟上节奏,但从目前人们的批判态度中,不难得知改革的进展似乎不尽人意。


    社会是一个复杂巨系统,它的复杂性决定了人才培养的多样性与系统性,单方面的知识教育远不能达到此要求,而真正在全面发展方面下过功夫的人,在与他人的社会竞争中,注定会有更多的机会优先胜出。原因很简单,在相同的条件下,他们能够在更短的时间内创造更多的社会价值与个人价值,这应该才是“快节奏”教育改革所要达到的目标。

