- raw: "智慧课堂的基础,是智能技术入驻教学活动场所,形成智慧课堂的教育空间(智慧教室)。针对这个方面,锐捷普教智慧课堂建设方案给出答案：硬件设备方面,在升级教室的过程中,要备足用于线下课堂的电脑、反馈器、接收器、投影仪、摄影机、数据存储平台、交互智能平板等资源,确保学生可以参与课堂的同时,还要确保学生的学习过程与学习痕迹能够被保存和分析;软件设施方面,智能手机App、智能授课端软件、课堂学情系统等,成为整个智慧课堂的智慧之源。智慧课堂的建设,智能软件与智能硬件都不可缺少,两者共同组成智慧课堂的基本成分。\n\
    \n智慧课堂的教学全流程智能化。智慧课堂的全流程智能化,是指在课堂软硬件升级的基础上,进一步实现课堂各个教学环节的智能化与智慧化。智慧课堂包括课堂前的准备、课堂中的互动、课堂后的总结与考评等活动。从流程上来说,主要涵盖“教、学、考、评、管”五方面。因此,智慧课堂的建成,将会融合学生的各种课堂学习场景,实现基于动态场景的智慧化课堂教学模式,有机地推进线下课堂与线上课堂的融合与发展。\n\
    \n为实现智慧课堂的教学全流程智能化,需要构建一个智慧课堂的平台,这是在软硬件设备升级后需要及时推进的工作。对于平台的建设,百度智慧课堂教育大平台(如图8-3所示)的构建经验,值得推广学习。\n\
    \n![](images/txt008_4.jpg \"pagenumber_ebook=137,pagenumber_book=127\")\n\n图8-3\
    \ 百度智慧课堂教育大平台^([\\[9\\]](#txt008.html#footnote_content_txt008_9))\n\n百度智慧课堂教育大平台,从技术优势、产品矩阵、场景覆盖、外部产品四个方面进行平台布局。百度本身作为资深的互联网大数据公司,兼具丰富的平台数据资源与人才优势,在大数据、人工智能与云计算等技术领域具有领头优势。因此,在推动智慧课堂教育大平台建设的过程中,直接依托自身的技术优势,用技术赋能智慧课堂,迅速实现课堂的技术智能化。在产品服务方面,从其平台中可见,平台已经覆盖同步课堂、热点专题、精品题库空间、教学空间、生涯规划空间、智能教育实验室、虚拟教室、智能考评空间等不同的服务领域,不仅涉及课堂内的教学服务,还能提供课堂外的管理与应用服务,对于改善课堂内外的智慧环境具有重要作用。从整体上看,百度智慧课堂教育大平台已经覆盖课堂的整个场景,“教、学、考、评、管”一应俱全,面向学生的个性化课堂、面向教师的精准化课堂、面向学校的科学化课堂管理与考评都有所涵盖。\n\
    \n智慧课堂的基础服务能力的升级与迭代,以及智慧课堂平台的搭建,最终需要落到应用层面。关于智慧课堂的实际运行,在具体的实践案例中能够突出其特色。例如,重庆交通大学“智慧课堂教学模式改革”实践,就反映了智慧课堂的运行规则。在智慧课堂的教学工具系统集成后,其就以此为依托,广泛开展关于智慧课堂教学工具的“使用方法和使用流程”的教育活动,积极引导教师、学生和学校行政人员投入模拟使用的环节,随着参与智慧课堂中的人数越来越多,一场关于学生的“学”与教师的“教”的新的连接方式正在形成,通过运用智慧课堂教学平台,教师、学生与学校这三者统一于同一个虚拟教育系统中。在这个平台上,教学资料的上传、数据资料的统计分析与可视化导出、课堂教学效果的评价与反馈、学生个性化课堂学习方案的制定,都将经过人机互动的方式完成。\n\
    \n地处安徽省阜南县的亲情学校与科大讯飞联合,智慧课堂已落地实施。通过其2018年11月开展的智慧课堂研讨会成果显示,目前,在阜南县的亲情学校,教师已经在智慧课堂教育平台实现了与学生的实时互动交流。课堂上,教师可以利用智慧课堂平台向学生推送习题,学生通过专属的身份认证入口进入,在平台上答题。学生在答题的过程中,教师能够马上看到关于某个题目的正确率和错误率,从而掌握学生当堂课的学习效果,并以此为依据,进一步改进智慧课堂的教学方法。\n\
    \n此外,101教育集团与山东诸城一中慈海学校的智慧课堂的开课场景,也受到人们的关注。诸城一中在打造智慧课堂的过程中,已经实现智慧课堂的“双师模式”,学生不仅拥有线下课堂的教师与他们共同成长,而且还可以借助智慧课堂的资源库,深挖同类教学课程,从而进行全面而多维的学习。当智慧课堂开课时,教师可以通过智慧课堂教育系统操作学生的学习平台,甚至锁定学生的考试界面,从而规避学生对资源数据库的依赖,培养学生自主思维能力和独立批判能力。\n\
    \n总之,智慧课堂的建设与运营,是在技术条件、需求环境与顶层设计共同作用下的结果,在其投入正常运行的过程中,其价值是显而易见的。经过以上案例分析,可以得出在智慧课堂中存在的优势。无论是重庆交通大学,还是百度智慧课堂方案,都反映出智慧课堂便于管理的优势。只要智慧课堂开始运行,其数据就会留下痕迹,便可借此进行管理与服务工作,特别是对于上课不思考、不积极参与课堂讨论的学生或者迟到的学生,管理者一目了然。学校对智慧课堂的管理,已经实现由传统课堂的“管人”,转向智慧课堂的“管数据”,在管理的任务难易程度和时间长短上,都存在明显的改善。\n\
    \n智慧课堂管理的科学化转向,为智慧课堂的个性化教学模式带来契机。传统的班级授课是“千人一面”的模板课堂,学生的“在场”程度很难衡量,也很难知道学生是否真正在学习。因此,学生缺乏有效的课堂参与感,每堂课下来,也只有少数学生所能感受到的被关注的感觉。然而,智慧课堂规范化与规模化的发展意味着将会给全体学生充分的独立思考的机会,直接从源头上激发学生参与课堂的积极性和主动性。这样的课堂上,每个学生都是课堂的参与者,每个学生的个性化需求都能得到精准化的数据统计和及时反馈,个性化学习与个性化教学得以实现。\n\
    \n智慧课堂的个性化教育价值,还潜在地告诉大家应该熟知丰富多样的课堂资源与数据传输渠道,使学生的个性化学习需求得以满足。诸城一中的“双师模式”与阜南县亲情学校的个性化习题推送,都是课堂教学资源丰富以及资源传输渠道多元且定向所带来的优势价值的体现。\n\
    \n此外,智慧课堂的互动模式效果显著。智慧课堂平台上,学生端的学习工具与教师端的教学工具保持紧密的联系。从严格意义上来说,平台上的这种联系是一种互动学习的虚拟空间,学生在老师的统一指导下,可以进行自主预习、作业、自测、拓展、讨论、答疑、协作探究等活动。教师也可以通过智慧课堂,迅速掌握学生的学习情况,做到具有针对性地教学互动,提醒学生应该如何规划下一步的学习。\n\
    \n归纳起来,智慧课堂的价值主要包括管理价值、个性化价值、互动价值、资源价值等方面。智慧课堂的价值显著,“增能减负”的效果较为突出,已经发展成一套较为固定的模式,因此颇受学校欢迎。目前全国已经有数千所学校开展智慧课堂建设工作。\n\
    \n智慧课堂的建设与运行,能够将智能教室与智慧课堂有机统一起来。智能教室的转型升级,为智慧线下课堂的开展与实施提供现实物理空间,弥补线上智慧课堂的缺陷与不足,切实提高学生的课堂体验感和参与感,以及同学之间的合作感和师生共同的情感体验。与此同时,智慧课堂的建成有利于形成“五位一体”的课堂模式(如表8-2所示),教师、学生、学校、家长与社群五个元素将形成教育合力,分别从不同的方面共同致力于学生学习的改变。\n\
    \n表8-2 “五位一体”的智慧课堂\n\n![](images/txt008_5.jpg \"pagenumber_ebook=139,pagenumber_book=129\"\
    )\n\n传统的课堂,教师关注的点更多的集中在“怎么教”的问题上。但是,在智慧课堂中,教师的角色需要进行重大改变,教师更多的是教给学生学习的方法,让学生学会学习,帮助学生提高学习的能力。现在的智慧课堂,教师在黑板上写字的场景减少了,学生在舞台上表演的机会增加了,学生成为课堂的主角,教师成为课堂的引导者和设计者。从传统课堂到智慧课堂的转变,反映的是学生学习主体地位的时代性回归,突出了智能新时代学生学习的特点与趋势,也给传统课堂模式下成长起来的教师上了生动一课——“我们应该改变了”。\n\
    \n智慧课堂,是智慧校园的核心,是连接教师和学生的智能媒介,是教师与学生的活动场所、学习场所和生活场所,更是他们共同的精神家园。从固定的课堂到流动的课堂,代表着智能时代学生成长环境的改变,需要教育实施者切实根据学生的个性化学习需求,实时进行有选择性的教育教学活动,让学生的学习也成为有选择性的学习活动,让学生充分拥有学习的主动权和选择权,让学生成为真正的学习的控制者和执行者。建设智慧课堂,正是充分培养学生自主控制与自主选择能力的关键课堂,需要全社会的共同参与。\n\
    \n四、离散到系统：智慧校园的建构策略\n\n无论是智慧校园中的智慧课堂、安全管理系统、智慧教学管理系统、智慧一卡通系统,还是智慧图书馆系统、校园照明系统,都是借助于新一代信息技术和新一代人工智能技术实现的智慧化与智能化的服务转型与管理升级的应用过程。\n\
    \n人工智能时代,智慧校园各个子系统的改造与升级,无不都在为促进教育公平、提高教育质量、培养创新型人才而服务。其整个更新换代的过程,基本都遵循技术、理念与应用三个维度进行,都围绕“以学生为中心”进行管理,实现教学效率与质量的双重提升。因此,智慧校园的最终建成意味着校园管理理念将实现从“管理”到“服务”,再到“成就”的转型,学校的教学将实现从“教师中心”走向“学生中心”,学校教育成为个性化教育的中心。\n\
    \n随着物联网、大数据、云计算、边缘计算、5G技术、人工智能技术的不断发展,万物智能化的倾向越发显著,智能化产业也不断增多,社会的智能化水平进一步提高,社会的整体发展将进入深度智能化阶段。因此,人工智能教育的发展,也必将跟随社会发展潮流,走向深度智能化阶段。与此同时,智慧校园作为教育的“三大场所”之一,深度智能化发展趋势必然要与教育发展总方向“同向同行”。所以,继续推进智慧校园建设工作不容迟缓。\n\
    \n就目前发展现状来看,智慧校园的建设已经取得一定成效。校园的各个管理与服务领域已基本实现智能,且开始朝着融合的方向发展。但是,总体上还需要在系统智慧化方面下功夫,完善具有“排斥性”的独立应用系统,从技术与需求两个方面着手,优化人机交互的舒适度与便捷度,提升智慧校园活动对象的智能感知体验度。\n\
    \n从长远来看,智慧校园建设应从四个方面继续开展工作：首先,从顶层规划视域,制定科学的智慧校园建设蓝图,在指导思想层面和政策帮扶层面引领智慧校园建设的规范化、系统化与深度智能化发展,同时又要给予智慧校园建设方充分自主权,让其在建校过程中突出地方特色与区域特色,彰显创新魅力与人文色彩。\n\
    \n其次,应该建立健全智慧校园建设监管机制,预防智慧校园的“越轨”发展。监管机制应该覆盖智慧校园的运营、管理与资金等方面,确保新时代教育思想、社会价值观、人本价值观与智慧校园生命的深度融合。在高效透明的校园监管机制的支撑下,让智慧校园真正成为“立德树人”的场所,而不是成为“不公平、贪污腐败、非正义”的发源地。\n\
    \n再次,加强理论研究。理论是关于事物的知识和陈述,科学的理论能够在实践中转化为物质力量,也可以在实践中指导实践的发展方向。智慧校园建设还处在发展阶段,相关的理论研究尚未成熟。因此,有必要专门对此问题进行集中探讨,形成关于智慧校园建设的理论与哲学观,进而科学地指导智慧校园建设工作。智慧校园的理论研究包含了两个层面：一是有没有能指导智慧校园设计和建设的理论,二是智慧校园建设能否催生新的理论。智慧校园还是较新的事物,为可能的理论构建提供了机遇,在比较分析诸多理论的基础上,构建智慧校园自身的设计和建设理论^([\\\
    [10\\]](#txt008.html#footnote_content_txt008_10))。\n\n最后,加强建设资源保障。国家财政要加大对智慧校园建设的投入力度,校方要积极统筹学校与社区资源,保障智慧校园建设的运维资金充裕。积极开展人才引进工作,培育全能型校园智能人才,为智慧校园的发展提供必要的人才基础。\n\
    \n智能新时代的智慧校园建设,其本质在于借助新一代信息技术和新一代人工智能技术,为培养新时代创新人才与时代领军人物提供必要的支撑与技术保障。所以,国家层面应该做好智慧校园建设的顶层规划与政策指引,社会层面应该给予资金支持与必要的物质保障,学校层面应该紧跟时代潮流,加强智慧校园建设的理论研究工作,积极融合“校内”与“校外”两种资源,全力提升校园的智慧化水平。\n\
