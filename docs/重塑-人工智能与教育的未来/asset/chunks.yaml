- raw: "第三,培养良好的学习习惯。良好的学习习惯是提高创造力的重点之一,是成功之母,不良的甚至坏的习惯是通向失败的敞开之门。因此,我们要注意培养学生良好的学习习惯,包括勤学、好问、细察、多想、常记、实干等。\n\
    \n第四,克服思维定式的干扰。在条件不变的情况下,思维定式可以简化人们的思维程序,有利于问题的迅速解决。但在条件变化的情况下,它又可能成为一种僵化的思维模式,使人误入歧途,从而妨碍问题的解决。所以,要注意引导学生克服思维定式的干扰,尤其要使学生看问题时抓住事物的本质,仔细研究问题各方面的要求,而不是一碰到问题,就匆忙套用脑子中已形成的模式。\n\
    \n第五,培养学生发散思维。对一个问题用多种方法来解答,即对一个问题从多个角度、多个方向、多个侧面、多个层次想办法解决,这就是发散思维。发散思维能使我们思考问题和解决问题时不停留于一般水平上,而是力求向更高、更新的方向迈进,使问题得到更好、更彻底地解决。当前学校教育中,不少学生思路狭窄单一,思维迟钝呆板,解题只会按例题硬套或照搬教师讲过的方法,不知道根据已知条件假设几种可能的解决方法,题目稍有变化,更是束手无策。各学科知识之间不会迁移、变通,缺乏思维灵活性和创造性。究其原因,可以说是多方面的,但重要的一点就是学生发散思维能力较差。\n\
    \n第六,让学生学会横向思维。横向思维是相对于垂直的、向纵深发展、呈直线式的纵向思维而言的。如果把纵向思考作为正面的话,那么横向思维就是从问题的侧面去考虑。从思维创新的角度出发,应将思维从“线”向“面”,甚至向“体”的方向发展。横向思维就是鼓励人们沿原有的思维方向,向四面八方做多角度的延伸,以求获得更多认识和启发的一种思维方式。要培养学生在解决问题时,有意识地暂时放下原来占据主导的思想,去寻找原来不被重视或注意的另一条思路。\n\
    \n第七,开发学生的右脑。人的大脑分为左脑和右脑,它们各司其职,相互配合。在当前教育中,主要是开发和利用了左脑,右脑的开发较少,而右脑在创造性思维中又占据着重要的地位。因此,开发右脑是非常重要且迫切的事情。\n\
    \n第八,加强艺术教育。艺术教育能开发右脑潜能并使左右脑平衡发展,有助于产生创造性设想,激发创新动机,为创新提供方法论原则。培养直觉力、想象力并诱发创造灵感,对创新活动和培养创新人才具有重要作用。当前,应加强艺术教育,培育创新人才,提高我国的科技创新能力。\n\
    \n【注释】  \n\n[\\[1\\]](#txt009.html#footnote_quote_txt009_1)中新网.习近平为何一直重视“创新性思维”\\\
    [OL\\].http：//www.chinanews.com/gn/2019/01-29/8741840.shtml.\n\n[\\[2\\]](#txt009.html#footnote_quote_txt009_2)中新网.习近平为何一直重视“创新性思维”\\\
    [OL\\].http：//www.chinanews.com/gn/2019/01-29/8741840.shtml.\n\n[\\[3\\]](#txt009.html#footnote_quote_txt009_3)百度百科.思维定式\\\
    [OL\\].https：//baike.baidu.com/item/%E6%80%9D%E7%BB%B4%E5%AE%9A%E5%8A%BF/9263375?fr=aladdin.\n\
    \n[\\[4\\]](#txt009.html#footnote_quote_txt009_4)“清、北、复、交、浙”是指清华大学、北京大学、复旦大学、上海交通大学、浙江大学。\n\
    \n[\\[5\\]](#txt009.html#footnote_quote_txt009_5)赵晓声,司晓宏.创客教育：信息时代催生创新的教育新形态\\\
    [J\\].电化教育研究,2016,37(04)：11-17.\n\n[\\[6\\]](#txt009.html#footnote_quote_txt009_6)杨现民,李冀虹.创客教育的价值潜能及争议\\\
    [J\\].现代远程教育研究,2015,(2)：23-34.\n\n[\\[7\\]](#txt009.html#footnote_quote_txt009_7)张茂聪,刘信阳,张晨莹等.创客教育：本质、功能及现实反思\\\
    [J\\].现代教育技术,2016,26(02)：14-19.\n\n[\\[8\\]](#txt009.html#footnote_quote_txt009_8)祝智庭,单俊豪,闫寒冰.面向人工智能创客教育的国际考察和发展策略\\\
    [J\\].开放教育研究,2019,25(01)：47-54.\n\n[\\[9\\]](#txt009.html#footnote_quote_txt009_9)京师书院.方兴未艾的美国“创客教育”.\\\
    [OL\\].http：//www.sohu.com/a/238343517\\_381106.\n\n[\\[10\\]](#txt009.html#footnote_quote_txt009_10)转引自：谭斯琴.创业教育视域下人工智能课程建设及其发展方向研究\\\
    [J\\].创新创业理论研究与实践,2018,1(12)：47-48.\n\n[\\[11\\]](#txt009.html#footnote_quote_txt009_11)浙江新浪网.创新创业教育：拥抱新智能探寻新路径\\\
    [OL\\].http：//zj.sina.com.cn/edu/2018-11-22/detail-ihmutuec2666200.shtml?qq-pf-to=pcqq.c2c.\n\
    \n\uFEFF\n\n第十章 审美教育：培育创新人才不可忽视的环节\n\n性质界定：陶冶性情、净化心灵的情感教育\n\n价值发现：塑造身心健康的和谐发展的人\n\
    \n艺术教育：激发人的想象力和创造力\n\n现存局限：束缚人的审美能力和创造能力\n\n超越路径：家庭、学校与社会的合力\n\n促进人的全面发展,始终是教育的“初心”,也是教育的最终目的。然而,在教育实践中,由于长期受应试教育的影响,包括人的“德、智、体、美、劳”等各方面在内的全面发展的教育,除了“智育”课程,其他课程的重视程度相对要低得多。尤其是中小学的美育,音乐课、艺术课、舞蹈课等,基本都让位于中考和高考的相关科目。人工智能时代,是一个创新的时代,美育与创新密切相关。可以说,美育是智能新时代培养创新人才不可忽视的重要一环,需要家庭、学校和社会高度关注,合力推进。\n\
    \n一、性质界定：陶冶性情、净化心灵的情感教育\n\n美育是情感教育,它具有感性形象、方式自由、潜移默化和注重实践的特点。理解美育的性质和特点,对转变教育理念和进行美育实践,具有重要意义。\n\
    \n(一)美育的性质\n\n美育,从理论上讲,从属于美学;从实践上讲,从属于教育。作为审美与教育的融合,美育是在一定的美学思想和教育思想的指导下,以美的事物为材料和工具,通过审美活动来激发和强化人们的情感体验,以造就全面与和谐发展的新人。\n\
    \n关于美育的性质,国内外历来有不同的看法,主要有四种观点：其一认为美育是美学理论的教育;其二认为美育是艺术教育;其三认为美育是关于美的价值的教育;其四认为美育是情感教育。在这几种观点中,把美育看作是“情感教育”较为恰当。\n\
    \n这主要是因为：首先,从美育的实现手段看。美育与智育和德育不同,它不靠推理论证,不采用规范手段,而是在对象化的活动中通过直观具体事物或形象而实现的。它始终以情感活动为中介,把对象与主体联结起来,融为一体,并通过情感的体验、选择、取舍而实现教育目的。同时,在这个过程中,主体是在享受中接受教育的,没有来自外部或内部的压力,完全出自内在的自由选择,经过潜移默化而达到教育目的。\n\
    \n其次,从美感的性质看。审美活动是人在与现实的审美关系中所展开的一种精神活动或情感活动。黑格尔指出：“审美带有令人解放的性质,它让对象保持它的自由和无限,不把它作为有利于有限需要和意图的工具而起占有欲和加以利用。所以美的对象既不显得受我们人的压抑和逼迫,又不显得受其他外在事物的侵袭和征服^([\\\
    [1\\]](#txt010.html#footnote_content_txt010_1))。”实际上,美感是多种心理功能综合交错、共同活动的结果。审美全过程的最后成果是审美情感。人的审美情感不是天生就有的,也不是完全靠人在审美活动中自发产生的,而是需要进行有意识的训练和培养,即通过审美教育的途径来达到。通过审美教育,提高感官的审美能力,使单纯感觉的器官成为能欣赏“音乐的耳朵”和感受“形式美的眼睛”。在这个过程中,也使人的心灵得到陶冶和塑造,使人的情感理性化,使个体的、感性的、直观的东西成为社会的、理性的、历史的东西,从而使人的自由直观、自由感受能力得到提高。所以,审美教育是一种情感教育,其过程是人的情感理性化的过程,其最终目的是要建立一种“新感性”,塑造完美的审美心理结构,培养全面发展的人。\n\
    \n再次,从美育在教育体系中的地位看。我们不妨先看看图10-1所示的内容。\n\n![](images/txt010_1.jpg \"pagenumber_ebook=168,pagenumber_book=158\"\
    )\n\n图10-1 美育在教育体系中的位置\n\n从上图可以形象地看出,客观世界有真、善、美三个方面,人的精神活动具有知、情、意三个部分,人类的知识体系中有科学、伦理学、美学,教育实践中依次也就有智育、德育、美育。其中,智育是通过科学来传授知识,开发智能,以把握“真”;德育是通过伦理学来加强意志,提高品德,以把握“善”;美育是通过美学来陶冶性情,净化心灵,以把握“美”。而要学习和研究科学、伦理学、美学等,发展知、意、情,追求真、善、美,还必须有一个强健的体魄,这就需要体育。在这四育中,虽然智育、德育、体育之中都包含一定的情感因素,但却不是主要的,只有美育才主要是培养人的美感情操。因此,美育的本质是以美感人,以情动人。美育在情感教育领域的地位,是其他任何教育所无法替代的。\n\
    \n最后,从美育思想发展的历史看。在美学史和教育史上,许多美学家和教育家,如柏拉图、亚里士多德、席勒等,都把美育看作是陶冶性情、净化心灵的情感教育。我国美育的积极倡导者蔡元培明确指出：“美育者,应用美学之理论于教育,以陶养感情为目的者也^([\\\
    [2\\]](#txt010.html#footnote_content_txt010_2))。”我国当代著名美学家朱光潜也认为：“美感教育是一种情感教育”“美感教育的功用在怡情养性”^([\\\
    [3\\]](#txt010.html#footnote_content_txt010_3))。\n\n(二)美育的特征\n\n由美育的性质,可以看出,美育具有以下主要特点：第一,美育是感性形象的教育。美育同传授科学知识的智育和传播伦理道德的德育不同,其主要手段既不是运用概念、判断和推理进行抽象概括,也不是运用伦理观念进行理性说教,而是通过美的事物的具体的、可感知的形象来感染人、触动人的情感以达到教育的目的。正如杜勃罗留波夫所说：“我们的感情总是被生动的形象所引起的,而不是被一般的观念所引起的^([\\\
    [4\\]](#txt010.html#footnote_content_txt010_4))。”以形感人、以情动人是美育最显著的特点。正是美育的这一特点,使这种教育形式适合于各种年龄、各个阶层和各种文化水平的对象。\n\
    \n第二,美育是自由方式的教育。美育是使人获得更多自由的教育,这在客观上也就决定了美育所采用的方式是自由的。它对受教育者不需要做理性的说服动员,更不用强迫命令,而是靠美本身的魅力来吸引人,以轻松愉快的方式把美的对象显示给受教育者,使受教育者在接受审美教育时,完全处于自觉自愿之中,凭着本人的心理需要和兴趣爱好,渴求和向往美,其精神始终处于一种“自由的状态”。在这种倾心欣赏、轻松愉快的美感享受之中,受到美感教育。\n\
    \n第三,美育是潜移默化的教育。审美教育是一种潜移默化的教育,它的效果是深刻而久远的,它将在人的一生中长期发挥作用。梁启超曾谈到小说支配人道的四种力量——“熏”“浸”“刺”“提”。“熏也者,如入云烟中而为其所烘,如近墨朱处而为其所染”“浸也者,入而与之俱化者也”。他还指出,“人之读一小说也,不知不觉之间,而眼识为之迷漾,而脑筋为之摇扬,而神经为之营注;今日变一二焉,明日变一二焉;刹那刹那,相断相续;久之而此小说之境界,遂入其灵台而拒之,成为一特别之原质之种子。有此种子故,他日又更有所触所受者,旦旦而熏之,种子愈盛,而又以之熏他人,故此种子遂可以遍世界”。\n\
    \n梁启超还以读《红楼梦》和《水浒》为例说明小说的浸染作用,“读《红楼》竟者必有余恋有余悲,读《水浒》竟者必有余快有余怒。何也?浸之力使然也”^([\\[5\\\
    ]](#txt010.html#footnote_content_txt010_5))。其实,不惟小说,所有的文学艺术,在利用美的形象进行审美教育时,都是一个逐步熏陶、潜移默化的过程,是一个“随风潜入夜,润物细无声”的过程。在这个过程中,情感就会以一种“输入之而不自觉”的方式渗透于人的潜意识之中,形成一种完美的心理结构和心理定向,并具有较大的稳定性,对人的全部精神生活产生重大而深远的影响。\n\
    \n第四,美育是注重实践的教育。人类在实践活动中创造了美,在实践活动中进行审美欣赏和得到审美愉悦,同时也在实践活动中受到审美教育。因此,美、美感、美育是同一实践过程的不同方面,都具有实践性。要实现美育的目的,离不开审美实践,每一项美育本身就是一次实践活动。马克思说：“在我的生产中物化了我的个性和我的个性的特点,因此,我既在活动时享受了个人的生命表现,又在对产品的直观中由于认识到我的个性是物质的,可以直观地感知的因而是毫无疑问的权利而感受到个人的乐趣。”又说：“正是在改造对象世界中,人才真正地证明自己是类存在物。这种生产是人的能动的类生活。通过这种生产,自然界才表现为他的作品和他的现实。因此,劳动的对象是人的类生活的对象化;人不仅像在意识中那样理智地复现自己,而且能动地、现实地复现自己,从而在他所创造的世界中直观自身。^([\\\
    [6\\]](#txt010.html#footnote_content_txt010_6))”所以,在进行美育活动中,既要注意美学理论的指导,又要注重具体实践,在审美实践中感受、体验、领悟美,在审美实践中提高审美修养和审美能力,在审美实践中创造和追求美。\n\
    \n二、价值发现：塑造身心健康的、和谐发展的人\n\n创新是智能时代人才的主导素质,美育对新时代培养创新人才具有十分重要的价值。美育不仅对塑造身心健康、精神充实、人格高尚、个性完善的全面而又和谐发展的人具有不可低估意义,而且对智能时代培养创新人才具有十分重要的价值。\n\
    \n(一)创新是智能经济时代人才的主导素质\n\n一部人类社会的发展史,既是一部生产力和经济发展的历史,也是一部人类自身逐渐完善和素质不断提高的历史。在不同的时代,由于经济和社会环境不同,对人才的主导素质的要求也不同,如表10-1所示。\n\
    \n表10-1 不同经济时代的人才主导素质\n\n![](images/txt010_2.jpg \"pagenumber_ebook=171,pagenumber_book=161\"\
    )\n\n从上表中可以看出,人类社会在摆脱了原始状态之后,已经历了农业经济时代和工业经济时代,现在正朝着智能经济时代迈进。在农业经济时代,生产过程是人的体力和智力的简单结合,生产力主要依靠人的体力支出,对人才的文化素质的要求相对较低。因此,农业经济时代人才的主导素质是体力素质。近代科学技术的发展以及随之而来的产业革命把人类社会由农业经济时代推进到工业经济时代。从纺织机和蒸汽机到工业的电气化和自动化,机器代替了人的部分劳动,生产力发展对劳动者的要求已由主要是体力型转变到主要是技能型,社会需要大量实际操作能力强的应用型人才。因此,工业经济时代人才的主导素质是技能素质。\n\
    \n随着现代科学技术和社会经济的飞速发展,工业经济正在被智能经济所取代,并必将成为新世纪的主导型经济。智能经济是以数据、算法与运算力的生产、分配和使用为基础,以创造性人力资源为依托,以智能高科技产业为支柱的经济。在智能经济时代,知识、信息与数据代替资本和能源成为社会经济发展的根本动力,数据生产力已成为社会生产力、国家竞争力和经济成就的关键因素,科学技术作为第一生产力,已由工业经济中的生产力“乘数倍增器”转变为智能中的“指数倍增器”。因此,创新是智能时代的灵魂,创新素质是智能时代人才的主导素质。\n\
    \n可以说,21世纪是人类创新的世纪,是一个需要创新人才而又不断涌现创新人才的世纪。在这个世纪里,一个国家创新水平的高低与创新能力的大小,将对这个国家在激烈的世界经济和科技竞争中起着至关重要的作用。人的创新能力的高低不仅受智力因素的影响,而且也受非智力因素的影响。它要求我们的教育应从“应试教育”的怪圈中走出来,全面实施素质教育和创新教育。在这里,对学生实施美育,培养他们的审美素质,提高他们的审美能力,进而提高他们的创新能力,是素质教育和创新教育的一个重要举措。\n\
    \n(二)美育在创新人才培养中的作用\n\n在科学发展的历史上,越是杰出的科学家,在艺术宝库中汲取的美学营养就越多。哥白尼不仅留下了作为近代科学开端的《天体运行论》这样的巨著,创立了新的世界体系和新的世界观,而且他本人也是一位卓越的画家,其“日心说”为全世界提供了一幅简洁和谐的宇宙图像,可以说是数学审美观在科学史上的一次伟大胜利。爱因斯坦不仅留下了作为现代科学开端的相对论,开创了新的时空观,而且他也是一位毫不逊色的小提琴家。他认为,我们的这个世界“可以由音乐的音符组成,也可以由数学的公式组成”^([\\\
    [7\\]](#txt010.html#footnote_content_txt010_7))。音乐演奏的轻松气氛有助于科学问题的思考。这些例子既充分说明了具有艺术修养的科学家在科学研究中更容易有所创新,又说明了以艺术为主要手段的美育在培养创新人才上的作用。\n\
    \n从美育的目的上看。席勒曾经说：美的欣赏是一种“无为而为”的“自由的欣赏”,在审美王国中,人卸下了一切关系的枷锁,并且使他摆脱了一切不论是身体的强制还是道德的强制。“通过自由去给予自由,这就是审美王国的基本法律”^([\\\
    [8\\]](#txt010.html#footnote_content_txt010_8))。美育的目标是使人获得更多的自由,成为完美的全面发展的自由的人。这种完美的全面发展的自由的人也就是智能时代所需要的具有创新能力的人。\n\
    \n从创新过程上看。创造过程一般包括准备、酝酿、产生创造性设想、验证等四个阶段。其中,在酝酿和产生创造性设想这两个重要阶段,右脑都起着主导作用。这两个阶段是新思想、新观念、新方法产生的时期,因而也是创造性思维活动中最关键的时期。换个角度来看,所谓创新,就是把头脑中那些被认为毫无关系的情报信息进行联结,重新组合,作强制性联想。要进行这些联想,一要靠信息量,而右脑的信息量最大;二要靠形象思维、直觉思维和灵感,它们主要也是由右脑掌管的。由于传统教育的影响,学生在学校主要是受到逻辑思维的教育和训练,思考严密,讲求规范,按部就班等,应该说是也有好的一面。"
  fmt: "\n### 第三、培养良好的学习习惯\n\n良好的学习习惯是提高创造力的重点之一，是成功之母，不良的甚至坏的习惯是通向失败的敞开之门。因此，我们要注意培养学生良好的学习习惯，包括勤学、好问、细察、多想、常记、实干等。\n\
    \n### 第四、克服思维定式的干扰\n\n在条件不变的情况下，思维定式可以简化人们的思维程序，有利于问题的迅速解决。但在条件变化的情况下，它又可能成为一种僵化的思维模式，使人误入歧途，从而妨碍问题的解决。所以，要注意引导学生克服思维定式的干扰，尤其要使学生看问题时抓住事物的本质，仔细研究问题各方面的要求，而不是一碰到问题，就匆忙套用脑子中已形成的模式。\n\
    \n### 第五、培养学生发散思维\n\n对一个问题用多种方法来解答，即对一个问题从多个角度、多个方向、多个侧面、多个层次想办法解决，这就是发散思维。发散思维能使我们思考问题和解决问题时不停留于一般水平上，而是力求向更高、更新的方向迈进，使问题得到更好、更彻底地解决。当前学校教育中，不少学生思路狭窄单一，思维迟钝呆板，解题只会按例题硬套或照搬教师讲过的方法，不知道根据已知条件假设几种可能的解决方法，题目稍有变化，更是束手无策。各学科知识之间不会迁移、变通，缺乏思维灵活性和创造性。究其原因，可以说是多方面的，但重要的一点就是学生发散思维能力较差。\n\
    \n### 第六、让学生学会横向思维\n\n横向思维是相对于垂直的、向纵深发展、呈直线式的纵向思维而言的。如果把纵向思考作为正面的话，那么横向思维就是从问题的侧面去考虑。从思维创新的角度出发，应将思维从“线”向“面”，甚至向“体”的方向发展。横向思维就是鼓励人们沿原有的思维方向，向四面八方做多角度的延伸，以求获得更多认识和启发的一种思维方式。要培养学生在解决问题时，有意识地暂时放下原来占据主导的思想，去寻找原来不被重视或注意的另一条思路。\n\
    \n### 第七、开发学生的右脑\n\n人的大脑分为左脑和右脑，它们各司其职，相互配合。在当前教育中，主要是开发和利用了左脑，右脑的开发较少，而右脑在创造性思维中又占据着重要的地位。因此，开发右脑是非常重要且迫切的事情。\n\
    \n### 第八、加强艺术教育\n\n艺术教育能开发右脑潜能并使左右脑平衡发展，有助于产生创造性设想，激发创新动机，为创新提供方法论原则。培养直觉力、想象力并诱发创造灵感，对创新活动和培养创新人才具有重要作用。当前，应加强艺术教育，培育创新人才，提高我国的科技创新能力。\n\
    \n## 注释\n\n[^1]: 中新网.习近平为何一直重视“创新性思维”[OL]. http：//www.chinanews.com/gn/2019/01-29/8741840.shtml.\n\
    [^2]: 中新网.习近平为何一直重视“创新性思维”[OL]. http：//www.chinanews.com/gn/2019/01-29/8741840.shtml.\n\
    [^3]: 百度百科.思维定式[OL]. https：//baike.baidu.com/item/%E6%80%9D%E7%BB%B4%E5%AE%9A%E5%8A%BF/9263375?fr=aladdin.\n\
    [^4]: “清、北、复、交、浙”是指清华大学、北京大学、复旦大学、上海交通大学、浙江大学。\n[^5]: 赵晓声,司晓宏.创客教育：信息时代催生创新的教育新形态[J].电化教育研究,2016,37(04)：11-17.\n\
    [^6]: 杨现民,李冀虹.创客教育的价值潜能及争议[J].现代远程教育研究,2015,(2)：23-34.\n[^7]: 张茂聪,刘信阳,张晨莹等.创客教育：本质、功能及现实反思[J].现代教育技术,2016,26(02)：14-19.\n\
    [^8]: 祝智庭,单俊豪,闫寒冰.面向人工智能创客教育的国际考察和发展策略[J].开放教育研究,2019,25(01)：47-54.\n[^9]: 京师书院.方兴未艾的美国“创客教育”.[OL].\
    \ http：//www.sohu.com/a/238343517_381106.\n[^10]: 转引自：谭斯琴.创业教育视域下人工智能课程建设及其发展方向研究[J].创新创业理论研究与实践,2018,1(12)：47-48.\n\
    [^11]: 浙江新浪网.创新创业教育：拥抱新智能探寻新路径[OL]. http：//zj.sina.com.cn/edu/2018-11-22/detail-ihmutuec2666200.shtml?qq-pf-to=pcqq.c2c.\n\
    \n# 第十章 审美教育：培育创新人才不可忽视的环节\n\n**性质界定**：陶冶性情、净化心灵的情感教育  \n**价值发现**：塑造身心健康的和谐发展的人\
    \  \n**艺术教育**：激发人的想象力和创造力  \n**现存局限**：束缚人的审美能力和创造能力  \n**超越路径**：家庭、学校与社会的合力\n\n\
    促进人的全面发展，始终是教育的“初心”，也是教育的最终目的。然而，在教育实践中，由于长期受应试教育的影响，包括人的“德、智、体、美、劳”等各方面在内的全面发展的教育，除了“智育”课程，其他课程的重视程度相对要低得多。尤其是中小学的美育，音乐课、艺术课、舞蹈课等，基本都让位于中考和高考的相关科目。人工智能时代，是一个创新的时代，美育与创新密切相关。可以说，美育是智能新时代培养创新人才不可忽视的重要一环，需要家庭、学校和社会高度关注，合力推进。\n\
    \n## 一、性质界定：陶冶性情、净化心灵的情感教育\n\n美育是情感教育，它具有感性形象、方式自由、潜移默化和注重实践的特点。理解美育的性质和特点，对转变教育理念和进行美育实践，具有重要意义。\n\
    \n### （一）美育的性质\n\n美育，从理论上讲，从属于美学；从实践上讲，从属于教育。作为审美与教育的融合，美育是在一定的美学思想和教育思想的指导下，以美的事物为材料和工具，通过审美活动来激发和强化人们的情感体验，以造就全面与和谐发展的新人。\n\
    \n关于美育的性质，国内外历来有不同的看法，主要有四种观点：其一认为美育是美学理论的教育；其二认为美育是艺术教育；其三认为美育是关于美的价值的教育；其四认为美育是情感教育。在这几种观点中，把美育看作是“情感教育”较为恰当。\n\
    \n这主要是因为：首先，从美育的实现手段看。美育与智育和德育不同，它不靠推理论证，不采用规范手段，而是在对象化的活动中通过直观具体事物或形象而实现的。它始终以情感活动为中介，把对象与主体联结起来，融为一体，并通过情感的体验、选择、取舍而实现教育目的。同时，在这个过程中，主体是在享受中接受教育的，没有来自外部或内部的压力，完全出自内在的自由选择，经过潜移默化而达到教育目的。\n\
    \n其次，从美感的性质看。审美活动是人在与现实的审美关系中所展开的一种精神活动或情感活动。黑格尔指出：“审美带有令人解放的性质，它让对象保持它的自由和无限，不把它作为有利于有限需要和意图的工具而起占有欲和加以利用。所以美的对象既不显得受我们人的压抑和逼迫，又不显得受其他外在事物的侵袭和征服[^10-1]。”实际上，美感是多种心理功能综合交错、共同活动的结果。审美全过程的最后成果是审美情感。人的审美情感不是天生就有的，也不是完全靠人在审美活动中自发产生的，而是需要进行有意识的训练和培养，即通过审美教育的途径来达到。通过审美教育，提高感官的审美能力，使单纯感觉的器官成为能欣赏“音乐的耳朵”和感受“形式美的眼睛”。在这个过程中，也使人的心灵得到陶冶和塑造，使人的情感理性化，使个体的、感性的、直观的东西成为社会的、理性的、历史的东西，从而使人的自由直观、自由感受能力得到提高。所以，审美教育是一种情感教育，其过程是人的情感理性化的过程，其最终目的是要建立一种“新感性”，塑造完美的审美心理结构，培养全面发展的人。\n\
    \n再次，从美育在教育体系中的地位看。我们不妨先看看图10-1所示的内容。\n\n![图10-1 美育在教育体系中的位置](images/txt010_1.jpg\
    \ \"pagenumber_ebook=168,pagenumber_book=158\")\n\n从上图可以形象地看出，客观世界有真、善、美三个方面，人的精神活动具有知、情、意三个部分，人类的知识体系中有科学、伦理学、美学，教育实践中依次也就有智育、德育、美育。其中，智育是通过科学来传授知识，开发智能，以把握“真”；德育是通过伦理学来加强意志，提高品德，以把握“善”；美育是通过美学来陶冶性情，净化心灵，以把握“美”。而要学习和研究科学、伦理学、美学等，发展知、意、情，追求真、善、美，还必须有一个强健的体魄，这就需要体育。在这四育中，虽然智育、德育、体育之中都包含一定的情感因素，但却不是主要的，只有美育才主要是培养人的美感情操。因此，美育的本质是以美感人，以情动人。美育在情感教育领域的地位，是其他任何教育所无法替代的。\n\
    \n最后，从美育思想发展的历史看。在美学史和教育史上，许多美学家和教育家，如柏拉图、亚里士多德、席勒等，都把美育看作是陶冶性情、净化心灵的情感教育。我国美育的积极倡导者蔡元培明确指出：“美育者，应用美学之理论于教育，以陶养感情为目的者也[^10-2]。”我国当代著名美学家朱光潜也认为：“美感教育是一种情感教育”“美感教育的功用在怡情养性”[^10-3]。\n\
    \n### （二）美育的特征\n\n由美育的性质，可以看出，美育具有以下主要特点：\n\n1. **美育是感性形象的教育**。美育同传授科学知识的智育和传播伦理道德的德育不同，其主要手段既不是运用概念、判断和推理进行抽象概括，也不是运用伦理观念进行理性说教，而是通过美的事物的具体的、可感知的形象来感染人、触动人的情感以达到教育的目的。正如杜勃罗留波夫所说：“我们的感情总是被生动的形象所引起的，而不是被一般的观念所引起的[^10-4]。”以形感人、以情动人是美育最显著的特点。正是美育的这一特点，使这种教育形式适合于各种年龄、各个阶层和各种文化水平的对象。\n\
    \n2. **美育是自由方式的教育**。美育是使人获得更多自由的教育，这在客观上也就决定了美育所采用的方式是自由的。它对受教育者不需要做理性的说服动员，更不用强迫命令，而是靠美本身的魅力来吸引人，以轻松愉快的方式把美的对象显示给受教育者，使受教育者在接受审美教育时，完全处于自觉自愿之中，凭着本人的心理需要和兴趣爱好，渴求和向往美，其精神始终处于一种“自由的状态”。在这种倾心欣赏、轻松愉快的美感享受之中，受到美感教育。\n\
    \n3. **美育是潜移默化的教育**。审美教育是一种潜移默化的教育，它的效果是深刻而久远的，它将在人的一生中长期发挥作用。梁启超曾谈到小说支配人道的四种力量——“熏”“浸”“刺”“提”。“熏也者，如入云烟中而为其所烘，如近墨朱处而为其所染”“浸也者，入而与之俱化者也”。他还指出，“人之读一小说也，不知不觉之间，而眼识为之迷漾，而脑筋为之摇扬，而神经为之营注；今日变一二焉，明日变一二焉；刹那刹那，相断相续；久之而此小说之境界，遂入其灵台而拒之，成为一特别之原质之种子。有此种子故，他日又更有所触所受者，旦旦而熏之，种子愈盛，而又以之熏他人，故此种子遂可以遍世界”。\n\
    \n   梁启超还以读《红楼梦》和《水浒》为例说明小说的浸染作用，“读《红楼》竟者必有余恋有余悲，读《水浒》竟者必有余快有余怒。何也？浸之力使然也”[^10-5]。其实，不惟小说，所有的文学艺术，在利用美的形象进行审美教育时，都是一个逐步熏陶、潜移默化的过程，是一个“随风潜入夜，润物细无声”的过程。在这个过程中，情感就会以一种“输入之而不自觉”的方式渗透于人的潜意识之中，形成一种完美的心理结构和心理定向，并具有较大的稳定性，对人的全部精神生活产生重大而深远的影响。\n\
    \n4. **美育是注重实践的教育**。人类在实践活动中创造了美，在实践活动中进行审美欣赏和得到审美愉悦，同时也在实践活动中受到审美教育。因此，美、美感、美育是同一实践过程的不同方面，都具有实践性。要实现美育的目的，离不开审美实践，每一项美育本身就是一次实践活动。马克思说：“在我的生产中物化了我的个性和我的个性的特点，因此，我既在活动时享受了个人的生命表现，又在对产品的直观中由于认识到我的个性是物质的，可以直观地感知的因而是毫无疑问的权利而感受到个人的乐趣。”又说：“正是在改造对象世界中，人才真正地证明自己是类存在物。这种生产是人的能动的类生活。通过这种生产，自然界才表现为他的作品和他的现实。因此，劳动的对象是人的类生活的对象化；人不仅像在意识中那样理智地复现自己，而且能动地、现实地复现自己，从而在他所创造的世界中直观自身[^10-6]。”所以，在进行美育活动中，既要注意美学理论的指导，又要注重具体实践，在审美实践中感受、体验、领悟美，在审美实践中提高审美修养和审美能力，在审美实践中创造和追求美。\n\
    \n## 二、价值发现：塑造身心健康的、和谐发展的人\n\n创新是智能时代人才的主导素质，美育对新时代培养创新人才具有十分重要的价值。美育不仅对塑造身心健康、精神充实、人格高尚、个性完善的全面而又和谐发展的人具有不可低估意义，而且对智能时代培养创新人才具有十分重要的价值。\n\
    \n### （一）创新是智能经济时代人才的主导素质\n\n一部人类社会的发展史，既是一部生产力和经济发展的历史，也是一部人类自身逐渐完善和素质不断提高的历史。在不同的时代，由于经济和社会环境不同，对人才的主导素质的要求也不同，如表10-1所示。\n\
    \n**表10-1 不同经济时代的人才主导素质**\n\n![表10-1 不同经济时代的人才主导素质](images/txt010_2.jpg \"pagenumber_ebook=171,pagenumber_book=161\"\
    )\n\n从上表中可以看出，人类社会在摆脱了原始状态之后，已经历了农业经济时代和工业经济时代，现在正朝着智能经济时代迈进。在农业经济时代，生产过程是人的体力和智力的简单结合，生产力主要依靠人的体力支出，对人才的文化素质的要求相对较低。因此，农业经济时代人才的主导素质是体力素质。近代科学技术的发展以及随之而来的产业革命把人类社会由农业经济时代推进到工业经济时代。从纺织机和蒸汽机到工业的电气化和自动化，机器代替了人的部分劳动，生产力发展对劳动者的要求已由主要是体力型转变到主要是技能型，社会需要大量实际操作能力强的应用型人才。因此，工业经济时代人才的主导素质是技能素质。\n\
    \n随着现代科学技术和社会经济的飞速发展，工业经济正在被智能经济所取代，并必将成为新世纪的主导型经济。智能经济是以数据、算法与运算力的生产、分配和使用为基础，以创造性人力资源为依托，以智能高科技产业为支柱的经济。在智能经济时代，知识、信息与数据代替资本和能源成为社会经济发展的根本动力，数据生产力已成为社会生产力、国家竞争力和经济成就的关键因素，科学技术作为第一生产力，已由工业经济中的生产力“乘数倍增器”转变为智能中的“指数倍增器”。因此，创新是智能时代的灵魂，创新素质是智能时代人才的主导素质。\n\
    \n可以说，21世纪是人类创新的世纪，是一个需要创新人才而又不断涌现创新人才的世纪。在这个世纪里，一个国家创新水平的高低与创新能力的大小，将对这个国家在激烈的世界经济和科技竞争中起着至关重要的作用。人的创新能力的高低不仅受智力因素的影响，而且也受非智力因素的影响。它要求我们的教育应从“应试教育”的怪圈中走出来，全面实施素质教育和创新教育。在这里，对学生实施美育，培养他们的审美素质，提高他们的审美能力，进而提高他们的创新能力，是素质教育和创新教育的一个重要举措。\n\
    \n### （二）美育在创新人才培养中的作用\n\n在科学发展的历史上，越是杰出的科学家，在艺术宝库中汲取的美学营养就越多。哥白尼不仅留下了作为近代科学开端的《天体运行论》这样的巨著，创立了新的世界体系和新的世界观，而且他本人也是一位卓越的画家，其“日心说”为全世界提供了一幅简洁和谐的宇宙图像，可以说是数学审美观在科学史上的一次伟大胜利。爱因斯坦不仅留下了作为现代科学开端的相对论，开创了新的时空观，而且他也是一位毫不逊色的小提琴家。他认为，我们的这个世界“可以由音乐的音符组成，也可以由数学的公式组成”[^10-7]。音乐演奏的轻松气氛有助于科学问题的思考。这些例子既充分说明了具有艺术修养的科学家在科学研究中更容易有所创新，又说明了以艺术为主要手段的美育在培养创新人才上的作用。\n\
    \n从美育的目的上看。席勒曾经说：美的欣赏是一种“无为而为”的“自由的欣赏”，在审美王国中，人卸下了一切关系的枷锁，并且使他摆脱了一切不论是身体的强制还是道德的强制。“通过自由去给予自由，这就是审美王国的基本法律”[^10-8]。美育的目标是使人获得更多的自由，成为完美的全面发展的自由的人。这种完美的全面发展的自由的人也就是智能时代所需要的具有创新能力的人。\n\
    \n从创新过程上看。创造过程一般包括准备、酝酿、产生创造性设想、验证等四个阶段。其中，在酝酿和产生创造性设想这两个重要阶段，右脑都起着主导作用。这两个阶段是新思想、新观念、新方法产生的时期，因而也是创造性思维活动中最关键的时期。换个角度来看，所谓创新，就是把头脑中那些被认为毫无关系的情报信息进行联结，重新组合，作强制性联想。要进行这些联想，一要靠信息量，而右脑的信息量最大；二要靠形象思维、直觉思维和灵感，它们主要也是由右脑掌管的。由于传统教育的影响，学生在学校主要是受到逻辑思维的教育和训练，思考严密，讲求规范，按部就班等，应该说是也有好的一面。\n\
    \n[^10-1]: 黑格尔.美学[M].北京:人民出版社,1979.\n[^10-2]: 蔡元培.蔡元培美育论集[M].北京:人民教育出版社,1992.\n\
    [^10-3]: 朱光潜.谈美[M].北京:华夏出版社,1997.\n[^10-4]: 杜勃罗留波夫.文学论文集[M].北京:人民出版社,1958.\n[^10-5]:\
    \ 梁启超.饮冰室合集[M].北京:中华书局,1989.\n[^10-6]: 马克思.1844年经济学哲学手稿[M].北京:人民出版社,1963.\n[^10-7]:\
    \ 爱因斯坦.我的世界观[M].北京:商务印书馆,1979.\n[^10-8]: 席勒.美育书简[M].北京:商务印书馆,1985.\n"
  trans: "\n\n### Third, Cultivate Good Study Habits\n\nGood study habits are one\
    \ of the keys to enhancing creativity; they are the mother of success, while poor\
    \ or bad habits are an open door to failure. Therefore, we must focus on cultivating\
    \ good study habits in students, including diligence in learning, willingness\
    \ to ask questions, careful observation, critical thinking, consistent note-taking,\
    \ and practical application.\n\n### Fourth, Overcome the Interference of Mental\
    \ Set\n\nUnder unchanged conditions, mental set can simplify people's thinking\
    \ processes, facilitating the rapid resolution of problems. However, when conditions\
    \ change, it can become a rigid thinking pattern, leading people astray and thus\
    \ hindering problem-solving. Therefore, attention must be paid to guiding students\
    \ to overcome the interference of mental set. In particular, students should be\
    \ taught to grasp the essence of things when viewing problems and to carefully\
    \ study the requirements of all aspects of a problem, rather than hastily applying\
    \ pre-existing mental patterns the moment they encounter a problem.\n\n### Fifth,\
    \ Cultivate Students' Divergent Thinking\n\nUsing multiple methods to solve a\
    \ single problem—that is, seeking solutions from multiple angles, directions,\
    \ aspects, and levels—is divergent thinking. Divergent thinking enables us not\
    \ to remain at a general level when thinking about and solving problems, but to\
    \ strive to advance in higher and newer directions, so that problems can be solved\
    \ better and more thoroughly. In current school education, many students have\
    \ narrow and single-track thinking; their thinking is sluggish and rigid. They\
    \ only know how to mechanically apply examples or copy methods taught by teachers,\
    \ unable to hypothesize several possible solutions based on given conditions.\
    \ When a problem changes slightly, they are at a complete loss. They cannot transfer\
    \ or adapt knowledge across disciplines, lacking flexibility and creativity in\
    \ thinking. The reasons are multifaceted, but an important one is students' poor\
    \ divergent thinking ability.\n\n### Sixth, Teach Students Lateral Thinking\n\n\
    Lateral thinking is relative to vertical thinking, which develops in depth in\
    \ a straight line. If vertical thinking is considered the \"front,\" then lateral\
    \ thinking considers the problem from the \"side.\" From the perspective of thinking\
    \ innovation, thinking should develop from \"line\" to \"surface,\" and even to\
    \ \"body.\" Lateral thinking encourages people to extend in all directions along\
    \ the original line of thought to gain more understanding and inspiration. Students\
    \ should be cultivated to consciously set aside the originally dominant idea when\
    \ solving problems, to seek another line of thought that was previously not valued\
    \ or noticed.\n\n### Seventh, Develop Students' Right Brain\n\nThe human brain\
    \ is divided into the left and right hemispheres; they perform their respective\
    \ duties and cooperate with each other. In current education, the left brain is\
    \ mainly developed and utilized, while the right brain is developed less, even\
    \ though the right brain occupies an important position in creative thinking.\
    \ Therefore, developing the right brain is a very important and urgent task.\n\
    \n### Eighth, Strengthen Art Education\n\nArt education can develop the potential\
    \ of the right brain and promote the balanced development of the left and right\
    \ brains, helping to generate creative ideas, stimulate innovative motivation,\
    \ and provide methodological principles for innovation. Cultivating intuition\
    \ and imagination and inducing creative inspiration play an important role in\
    \ innovative activities and cultivating innovative talents. Currently, art education\
    \ should be strengthened to nurture innovative talents and enhance our country's\
    \ scientific and technological innovation capabilities.\n\n## Notes\n\n[¹]: China\
    \ News Service. Why Xi Jinping Has Always Attached Importance to \"Innovative\
