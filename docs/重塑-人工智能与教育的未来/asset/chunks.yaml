    ## 智能教育：在变与不变中透析本质


    立足当下, 展望未来, 人工智能时代, 离不开对未来教育的畅想。人工智能与教育的结合, 催生人工智能教育。教育包含“教”和“育”两个方面。教是教知识和教技能;
    育是育人, 立德树人。从古至今, 教育的发展从未像今天这样, 能够同时兼顾“教”和“育”两个维度, 能够同时兼顾教师和学生的需求。可见, 人工智能时代的教育,
    已经迎来了教育的真正回归——回归到人最本质的关怀——人的价值、尊严和全面发展。


    未来教育, 必将走向与智能技术深度融合的时代, 智能教师与人类教师并存。智能教师主攻知识教育与技能教育, 帮助教育对象深刻把握操作性知识, 并助力培育教育对象的智慧性知识和技能。而人类教师,
    核心的任务则与现在有较大的差距, 人类教师已经从原有的知识与技能教育, 转向情感教育与道德教育, 集中于培育教育对象“立德树人、学以成人、生而为人”的品质,
    真正践行人类教师的育人价值。


    21世纪前20年, 人工智能与教育的结合还处在初级阶段, 人工智能技术在教育中的应用主要集中于助教阶段, 表现为人类专业教师借助人工智能教师系统, 以辅助完成教学管理、制订教学计划、完善教学过程、优化教学考核、规范教学评价等较为广泛的领域。但是,
    整体的智能教育理论、智能教育方法论、智能教育实践等, 还有待进行理论概括, 教育的细分、微分领域, 仍然需要进行智能技术的深入契合。所以, 未来的教育, 一定是在拓荒中前进的发展模式,
    整体实践进路是由宏观迈向中观和微观领域, 理论延展方向则是从具体实践中诞生系统且开放的教育理论体系。


    未来的教育, 人机并存成为普遍存在的事实。智能机器人开始以现有的教师的角色出现, 人类教师的角色也将发生巨大改变。取而代之的是, 人类教师从知识与技能的教育中解放出来,
    将更多的时间投身于学生的德育和情感教育中, 学生德才兼备, 科学精神与人文精神集于一身。


    未来的教育, 在教育的过程中, 人工智能教育系统能够根据学生的学习进度、学习强度、学习效率、学习薄弱点、学习专注程度、学习注意力、学习兴趣等数据内容, 进行智能化施教和个性化施教。教育对于人的态度,
    彻底由需要强制改造的对象, 转换为需要根据教育对象的需求和社会的需求进行改造的对象。


    由此可见, 前面论及的人工智能教育的发展方向, 也是人工智能教育需要改变的方向, 也是最为凸显人工智能给教育带来的转变的领域。但是, 这些变化的现象, 最终反映的都只是人工智能赋能教育,
    给教育本身所带来的变化, 而隐藏在变化的背后的不变的东西, 仍然需要挖掘, 如教育的目的等。


    2018年11月, 新东方创始人俞敏洪在浙江乌镇接受澎湃新闻专访时强调：“任何技术的改变都只是工具利用上的改变, 不能改变教育本质, 任何一种技术的改进,
    都不能与培养一个人的本质去相提并论。”“从教育方面来说, 教育的核心要素就是培养一个全面成长的人, 培养一个身心健康的人, 培养一个对知识的追求充满好奇心和探索精神的人,
    这些都是不可能改变的。^([1](#txt011.html#footnote_content_txt011_1))”同理, 从俞敏洪的谈话中可知, 人工智能赋能教育,
    也始终是以工具的形式出现的。工具对人的教育, 由于工具的人本属性, 使得教育活动中最根本的连接方式——人与人的教育模式没有改变, 教育本身是培养人的这个目的没有改变。也就是说,
    教育的本质没有变。


    人工智能时代, 教育的智能化与智能化的教育, 教育的形式在不断地变化, 教育的工具在不断地变化, 教育的模式也在不断地变化, 且其变化的趋势会随着智能技术的更新与迭代而革新。但是,
    在教育的变化中, 始终保持不变的就是培养全面发展的人的目的不变。无论智能技术何等发达, 教育都是要培养全面发展的人, 培养德才兼备的人, 培养具有创新思维、创新能力、想象力、同情心的人。


    不变的本质, 价值蕴藏其中。未来的教育, 教育充分展现其经济价值、政治价值与文化价值。特别是对于传承文化、创造知识、培养智能人才方面价值更为突出, 对于提高人们的整体生活质量和生命质量具有重要意义。


    ## 终身教育：从理念兴起到实践落地


    19世纪中期, 以美国为首的资本主义国家在全球掀起第二次工业革命浪潮, 电气化的生产方式, 极大地提高了社会生产力水平, 使人类进入了“电气时代”。在第二次工业革命的影响下,
    飞速旋转的电力机器无休止地塑造着整个人类世界, 人类社会的生产方式、生活方式以及思维习惯, 都在被无限制地改变着。正是工业革命期间的技术力量, 以其惊人的能量迅速地颠覆着传统社会,
    社会的政治命运、经济形态以及社会结构无一例外, 最终世界逐渐从一个分散的世界变成一个整体的世界。


    一切都在无穷的变化之中。由于社会的加速变化, 人们开始思考如何应对这种变化、如何在其中更好地生存、如何更好地彰显个人的价值与尊严。正是在这样大的社会背景下,
    终身教育得以诞生。


    终身教育, 最早是由联合国教科文组织成人教育局局长法国的保罗·朗格朗(Paul Lengrand)在1965年正式提出的。保罗·朗格朗指出, 终身教育不是某个具体的实践,
    也不是某个具体的教育阶段, 而是泛指一种教育思想。终身教育是指在人的一生中接受的所有教育的总和, 涵盖人们所接受的各种教育类型和各个年龄段所接受的教育。终身教育自提出至今,
    已成为世界各国制定教育方针、教育政策的重要思想依据, 深受各国重视。


    从其诞生的背景来看, 终身教育旨在帮助人们时刻处于“清醒状态”, 要求人们在一个加速变革的时代, 应该清楚地认识到终身教育与终身学习的重要性, 因为它直接与人们的生存和发展密切相关。换言之,
    终身教育理念是一种引导人们适应变革社会的思想熔炉, 只要遵循它的义理, 至少会比完全弃之不顾的人生存得更好。


    然而, 技术的局限性和教育时空的局限性, 限制了终身教育的实践落地。工业时代和信息时代, 这种教育思想理念, 注定只能在小范围进行试点, 而无法推广至全球。其主要原因在于,
    在那样的时代, 个人的发展很少以他人的发展为前提, 每个相对独立的个体之间, 存在着必然的时空界限, 使终身教育的思想落地受到限制。尤其是人们想要从一般的教育实践中找到终身教育的规律,
    以及将终身教育落到具体的个人时, 原始的数据壁垒、信息鸿沟和阶段性教育部门的孤立状态, 阻断了终身教育的“终身”性质的塑形。譬如, 当代大学生, 要构建其终身教育体系,
    对于他们的未来是可行的, 但是要整合他们的学前教育、小学教育与中学教育, 恐怕只能获取到零碎的阶段性学习成果, 对于学习的过程数据, 估计教育对象本人, 也已经忘得“一干二净”。因为对于现如今已经在校的这代大学生而言,
    他们的过去已经成为只有结果没有过程的“零星记忆”。试想, 该种状态如何推进实现终身教育理念?


    然而, 大数据和人工智能时代, 这种教育现状正在改变。终身教育理念迎来发展的黄金时期——从理念兴起到实践落地。在大数据和人工智能技术的支撑下, 教育者对教育对象施行的所有教育影响,
    以及教育对象本身主动学习的过程数据, 都将以教育大数据的方式储存下来。各种教育类型的大数据之间, 经过国家终身教育的顶层规划设计, 实现教育大数据的跨界共享与集中关联,
    从而形成了关于个人与集体的教育大数据集群。当教育大数据集成后, 以人工智能技术为基础的终身教育体系正在生成, 教育对象的个人教育活动与学习活动, 全面映射于终身教育平台上,
    针对个人的教育规律, 以及面向全体的教育规律得以“去遮蔽”。


    人工智能时代的教育, 正如比尔·盖茨在《未来之路》中所指出的那样,“教育的最终目标会改变, 不是为了一纸文凭, 而是为了终身受到教育。^([2](#txt011.html#footnote_content_txt011_2))”人的一生中,
    他们所从事的一切, 都与他们的教育有关, 而他们的一切教育活动, 也将反作用于教育对象的现世的生存与发展。终身教育平台、终身学习平台、智能开放大学、终身教育公共服务体系逐渐建成,
    推动终身教育实践落地。未来的教育, 将更为直接地服务于人的生存与发展, 实现人的价值、尊严和全面发展。


    ### 推行终身学习政策


    2019年8月2日, 联合国教科文组织“终身学习政策国际咨询会议”在成都成功举办(如图11-1所示)^([3](#txt011.html#footnote_content_txt011_3)),
    该会议主要对《终身学习的准则和关键政策解读的联合报告》与《终身学习手册：政策与实践》两份出版物进行出版前咨询、论证和评审。《终身学习的准则和关键政策解读的联合报告》旨在通过一系列案例研究和终身学习政策的比较分析,
    探讨“终身学习”的政策含义, 分析在国家经验、人权和发展框架的基础上, 决策者和其他利益攸关方应具备的知识、证据、核心原则, 以便能够制定和执行终身学习的相关政策。《终身学习手册：政策与实践》则阐述了终身学习的概念,
    并探讨如何通过国家、地方及院校层面的实践方法, 推行终身学习。终身学习是终身教育的核心构成部分, 终身学习政策推行, 必然会直接或者间接地推动终身教育的发展与完善。


