  trans: '

    # IV. Staying True to Our Original Aspiration: Education Promotes the All-Round
    Development of Human Beings


    Human intelligence is the foundation of artificial intelligence; the development
    of human intelligence plays a decisive role in the development of artificial intelligence.
    In the stage of weak artificial intelligence, AI is the imitation, extension,
    and enhancement of human intelligence. This nature determines its "subordinate"
    status and indirectly reflects the passive attribute of AI. Only in an era of
    highly developed human intelligence can the development of AI reach new heights.
    The "three booms and two busts" (three rises and two falls) of AI illustrate this
    point.


    The development of AI stems from the integration and fusion of technologies, thereby
    systematically reproducing human intelligence on a relatively three-dimensional
    level (not on a single dimension). However, once AI has completed the work of
    imitation, extension, and enhancement, it completely separates from the matrix
    of human intelligence compared to human intelligence, becoming an independent
    AI entity possessing the relative independence of AI.


    The development of AI, with its relative independence, triggers the awakening
    of human ontological consciousness. Historically, there have been three major
    schools of AI development: Connectionism, which imitates human neural transmission;
    Symbolism, which imitates human logic and language; and Behaviorism, which imitates
    human behavior patterns. Different schools imitate different objects, but all
    imitate the complex forms of human beings themselves and the essence of human
    life in different ways.


    The evolution of the imitation paradigm has undergone a process from simple to
    complex, from single to systemic. AI''s imitation of human intelligence is only
    the basic stage of its development; the stages of extension and enhancement mark
    the beginning of AI''s declaration of independence. At that time, conflicts between
    human intelligence and AI will be triggered, commonly known as human-machine conflicts.
    To resolve the human-machine contradiction, humans have sought several solutions:
    one is anarchism, letting it develop freely; two is technological terrorism, strictly
    restricting its development; three is scientific controlism, seeking advantages
    and avoiding harm. Obviously, the third solution implies human compromise and
    tolerance, highlighting the complementary relationship between human intelligence
    and AI.


    The complementary relationship between human intelligence and AI means there exists
    a "shared destiny" attribute between the two. Today, AI''s imitation, extension,
    and enhancement of human intelligence have reached a very high level, particularly
    in the aspect of behavioral imitation, which is relatively mature. Generally speaking,
    so far, the rethinking of human-machine relations triggered by AlphaGo, the anxiety
    over "technological unemployment" caused by the large-scale implementation of
    the "machine replacing humans" strategy, all reflect that AI machines have begun
    to reversely urge the development of humans themselves, and have prescribed a
    strict developmental order for humans in the process of intelligence development.
    Only by developing in an all-round way can humans better face the issues of survival,
    life, and development in the future human-machine symbiotic society.


    Therefore, the high development of AI directly or indirectly forces the development
    of humans. Strictly speaking, it promotes the all-round development of humans.
    Because in the fields of "no brain, no emotion" (mechanical/repetitive tasks),
    AI has far surpassed human intelligence, and due to objective constraints, humans
    will never surpass AI in this field. Therefore, "the all-round development of
    humans" has become the main direction of human development in the AI era and the
    core purpose of AI education.


    "The all-round development of humans" refers to the complete development of human
    "morality, intelligence, physique, aesthetics, and labor" (the "five educations").
    In the AI era, unlike the industrial era and the information era, the emphasis
    on all-round development has shifted its focus from "intellectual education" to
    "simultaneous development of the five educations." This major shift originates
    mainly from the awakening of human consciousness in the human-machine conflict.
    The historical process from ancient "ontology" to modern "epistemology," and then
    to contemporary "existentialism," is the result of the continuous awakening of
    human self-consciousness, the continuous improvement of individual consciousness,
    and the consequent continuous change ins, comprehensively innovating education,
    teaching, and learning methods through the systemic integration of AI and education,
    and utilizing AI to accelerate the building of open and flexible education systems,
    ensuring that all enjoy equitable, inclusive, and quality lifelong learning opportunities,
    thereby advancing the realization of the Sustainable Development Goals and a Community
    with a Shared Future for Mankind.


    3. We recalled the *Qingdao Declaration* adopted in 2015 on leveraging Information
    and Communication Technologies (ICT) to achieve SDG 4, which stated the necessity
    of leveraging emerging technologies to strengthen education systems, expand learning
    opportunities for all, improve learning quality and outcomes, and enhance equitable
    and more efficient education service delivery. As we enter an era of widespread
    AI application, we recognize the urgent need to reaffirm and update this commitment.


    4. We examined the latest trends in the evolution of AI and its profound impact
    on human society, economy, and labor markets, as well as on education and lifelong
    learning systems. We reviewed the potential impact of AI on the future of work
    and skills development, and explored its potential in reshaping the core foundations
    of education, teaching, and learning.


    5. We recognized the complexity and rapid pace of development in the field of
    AI, the diverse understandings of AI, its broad scope, and various significantly
    different definitions, as well as its diversified applications in different scenarios
    and the ethical challenges they raise.


    6. We also recognized the uniqueness of human intelligence. Recalling the principles
    established in the *Universal Declaration of Human Rights*, we reaffirmed UNESCO''s
    humanistic approach to the use of AI, aiming to protect human rights and ensure
    that all possess the corresponding values and skills required for effective human-machine
    collaboration in life, learning, and work, as well as for sustainable development.


    7. We also declare that the development of AI should be human-controlled and human-centered;
    the deployment of AI should serve humans and aim to enhance human capabilities;
    the design of AI should be ethical, non-discriminatory, fair, transparent, and
    auditable; and the impact of AI on humans and society should be monitored and
    evaluated throughout the entire value chain lifecycle.


    8. Recognizing the multidisciplinary nature of AI and its impact; ensuring the
    organic coordination of AI in education with public policy, particularly education
    policy; adopting a whole-of-government, cross-sectoral, and multi-stakeholder
    approach to planning and governing AI in education policies; determining strategic
    priority areas for policy based on local challenges encountered in achieving SDG
    4 and its specific targets, as well as other SDGs. Planning and formulating a
    system-wide AI in education strategy that aligns and coordinates organically with
    education policy from a lifelong learning perspective.


    9. Aware of the huge investment needs for implementing AI in education policies
    and projects. Prudently prioritizing among different education policy focuses,
    identifying diverse funding channels, including national funds (public and private),
    international funds, and innovative financing mechanisms. Also considering the
    potential of AI in merging and analyzing multiple data sources to improve decision-making
    efficiency.


    10. Aware of breakthroughs in applying data to transform evidence-based policy
    planning. Considering integrating or developing suitable AI technologies and tools
    to upgrade Education Management Information Systems (EMIS) to strengthen data
    collection and processing, making education management and delivery more equitable,
    inclusive, open, and personalized.


    11. Also considering introducing new education and training delivery models enabled
    by AI in different learning institutions and scenarios, to serve different actors
    such as students, faculty, parents, and communities.


    12. Noting that while AI provides opportunities to support teachers in fulfilling
    their educational and teaching responsibilities, human interaction and collaboration
    between teachers and students should be ensured as the core of education. Aware
    that teachers cannot be replaced by machines, their rights and working conditions
    should be protected.


    13. Dynamically reviewing and defining the roles of teachers and their required
    competencies within the teacher policy framework, strengthening teacher training
    institutions, and formulating appropriate capacity-building programs to support
    teachers in preparing for effective work in AI-rich educational environments.


    14. Recognizing the development trends of AI in supporting learning and learning
    assessment potential, evaluating and adjusting curricula to promote the deep integration
    of AI with the transformation of learning methods. In areas where the benefits
    of using AI clearly outweigh its risks, considering applying existing AI tools
    or developing innovative AI solutions to assist clearly defined learning tasks
    in different subject areas, and providing support for AI tools required for developing
    interdisciplinary skills and competencies.


    15. Supporting the adoption of a whole-school approach to pilot testing around
    the use of AI to promote teaching and learning innovation, drawing lessons from
    successful cases, and scaling up evidence-based practice models.


    16. Applying or developing AI tools to support dynamic adaptive learning processes;
    tapping data potential to support multi-dimensional assessment of students'' comprehensive
    competencies; supporting large-scale remote assessment.


    #### Cultivating Values and Skills for Life and Work in the AI Era


    17. Noting the systemic and long-term transformations in the labor market caused
    by the adoption of AI, including dynamics in gender equality. Updating and developing
    effective mechanisms and tools to anticipate and identify current and future skill
    demands triggered by AI development, to ensure curricula adapt to the changing
    economy, labor market, and society. Integrating AI-related skills into primary
    and secondary school curricula, Technical and Vocational Education and Training
    (TVET), and higher education qualification systems, while considering ethical
    dimensions and related humanities infiltration.


    18. Recognizing that effective human-machine collaboration requires a range of
    AI literacies, while not neglecting the need for basic skills such as literacy
    and numeracy. Taking institutionalized actions to improve the basic AI literacies
    required at all levels of society.


    19. Formulating medium- and long-term plans and taking urgent actions to support
    higher education and research institutions in developing or strengthening curricula
    and research programs to cultivate local high-end AI talents, with a view to establishing
    a large local pool of AI professionals capable of AI system design, programming,
    and development.


    20. Reaffirming that lifelong learning is the guiding principle for achieving
    SDG 4, including formal, non-formal, and informal learning. Adopting key technologies
    such as AI platforms and data-driven learning analytics to build a comprehensive
    lifelong learning system that supports learning for all, everywhere, anytime,
    while respecting learner agency. Developing the potential of AI in promoting flexible
    lifelong learning pathways and the accumulation, recognition, certification, and
    transfer of learning outcomes.


    21. Aware of the need to give appropriate attention to the needs of older persons,
    especially older women, at the policy level, and to equip them with the values
    and skills needed for life in the AI era, so as to remove barriers to digital
    life. Planning and implementing adequately funded programs to enable older workers
    to acquire skills and choices to maintain their economic activity and social integration
    as they wish.


    22. Reaffirming that ensuring inclusion and equity in education and through education,
    and providing lifelong learning opportunities for all, is the cornerstone of achieving
    SDG 4 — Education 2030. Reaffirming that technological breakthroughs in AI in
    education should be seen as an opportunity to improve access to education for
    the most vulnerable groups.


    23. Ensuring that AI promotes quality education and learning opportunities for
    all, regardless of gender, disability, social status, wealth, ethnic or cultural
    background, or geographical location. The development and use of AI in education
    should not deepen the digital divide, nor show bias against any minority or vulnerable
    group.


    24. Ensuring that AI tools in teaching and learning can effectively include students
    with learning disabilities or impairments, as well as students learning in a non-native
    language.


    #### Gender-Equitable AI and Using AI to Promote Gender Equality


    25. Emphasizing that the gender gap in digital skills is one of the reasons for
    the low proportion of women in AI professions, further exacerbating existing gender
    inequalities.


    26. Declaring our commitment to developing gender-unbiased AI applications in
    education and ensuring that data used for AI development is gender-sensitive.
    Meanwhile, AI applications should contribute to promoting gender equality.


