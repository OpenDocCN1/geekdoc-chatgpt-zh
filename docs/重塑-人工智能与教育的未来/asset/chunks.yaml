- raw: "社会知识更新速度快,教育系统知识更新速度慢,造成的教育与社会发展脱节,最终也需要教育工作者认真反思。从教育发展进程来看,其始终是社会发展的一个缩影,在时间向度上确实有一定的滞后性,因为教育受限于社会的生产力水平、社会的经济政治制度。因此,教育的这种脱节问题,在核心层面,其实是“农业文明与工业文明的冲突,工业文明与智能文明的冲突”在教育环境中的表现,其诱因是极其复杂的,涵盖理论与实践的关系问题、人与自然的和谐问题、人与人的平等问题。\n\
    \n学校教育,始终离不开“学校”两个字。相较于社会而言,学校更像是一个象牙塔,所谓的“学、知、行”的观念,大部分也只是适合于“学校”。学校教育,重知识教育与理论教育,但实践课程却很少,这是教育环境中理论与实践脱节的重要原因。学生学到了知识,但对于如何将知识进行情景化应用、如何结合已学到的知识进行创新,这却是一个经常被忽视的问题。譬如,目前很多高校明显存在着教育内容与企业人才需求脱节、与社会人才需求脱节的痛点,特别是那些在学校单纯热衷于理论学习的学生,由于缺乏社会实践经验,毕业后很难适应社会的要求。\n\
    \n此外,目前的教育课程体系还不够健全。传统教育所倡导的“以人为本”的教育价值理念,重点是以培养学生的“智商”为本,至于学生的“情商”,在学校没有得到很好的培养。自然而然,学校的教育课程,其重心当然是围绕培养学生的“智商”而设置的。本来,在教育的课程中,包含“政史地、物化生、语数英”等课程之余,还应该包括人格教育、精神教育、人生意义教育、社会技能教育、家庭观念教育、婚姻教育、社会关系教育、伦理道德教育,以及对“求富有道即合德”的财富观教育等,但事实并非如此。现有的教育课程体系,并没有将学生看作是一个整体、一个拥有完善人格的人,而是把学生看作一个需要割裂开来的改造对象。\n\
    \n关于“脱节”,还要谈及教师的专业素养、教学资源的筛选与学生的学习能力。科学技术突飞猛进地发展,催生日新月异的社会需求,要求学生知识结构的更新要严格符合社会标准,这才有益于克服“脱节”问题。但事实上,行动起来非常困难。智能时代,很多教师长期与学校外面的社会分离,本身的教学思维与教学内容很容易受到学校环境的限制,囿于如此局限,这样的教师自然很难培养出优秀的学生。邓小平同志曾指出：“一个学校能否为社会主义建设培养合格的人才,培养德智体全面发展、有社会主义觉悟的、有文化的劳动者,关键在教师^([\\\
    [4\\]](#txt003.html#footnote_content_txt003_4))。”事实就是如此,一个好老师,确实能够带出好学生,这就是为什么现如今要提倡“四有好老师”的缘故。\n\
    \n另外,在教育资源方面,也存在较大筛选难度。仅教材的编撰工作,就已非常耗时费神,从编撰到出版,再到教材的修订与选为教学用书,需要很长一段时间。但在这段时间,其实有些课程很多的教材内容已经过时。如此一来,就需要教师在上课的过程中,重新花费大量的时间和精力去修正和查找相关的最新信息。\n\
    \n最后,学生学习能力遭到侵害,跟不上时代步伐。特别是当众多知识大量集聚时,信息的参差不齐、数据的交叉互现、知识的碎片化、学科藩篱、智能产品的消极价值等因素,对学生学习的积极性和主动性影响很大。以智能手机为例,关于智能手机与学生学习能力的关系问题,值得大家深思。在智能技术飞速发展的时代,智能手机的功能“五花八门”,学生深陷其中不亦乐乎,对学生的学习产生重大影响。更为重要的是,当手机与学生相关联时,人们就会主动联想到“玩游戏”,而不是想到学习。可见,在智能时代,智能元素嵌套进入教育活动,带来便捷之时,也在消耗学生的学习精力,减弱学生的学习能力,急需正确的价值引领。\n\
    \n如果有一天,教育知识的更新速度跟上时代的步伐,学校教育与社会教育不再严重地脱节,社会将是怎样的?学生又将是怎样的?这样的未来富有魅力,时刻吸引着我们在智能新时代共同去探索未来教育之路。\n\
    \n五、“李约瑟难题”与“钱学森之问”：重思我们的教育\n\n20世纪30年代,英国著名学者李约瑟在研究中国科技史时,在其皇皇巨著《中国科学技术史》中提出“李约瑟难题”。问题一经提出,便在全世界范围内引发了激烈讨论。2005年,国务院总理温家宝在看望著名科学家钱学森时,钱老发问：“为什么我们的学校总是培养不出杰出的人才?”钱老的这一发问被称之为“钱学森之问”,同样引发了广泛的社会热议。\n\
    \n无论是“李约瑟难题”,还是“钱学森之问”,虽然他们看问题的立足点不同,但都涉及中国近现代以来的科技、教育、人才培养等问题。问题的提出能够引发巨大的社会反响,一方面是基于两位学者的社会影响力,另一方面也是因为这两个问题正好命中我国科技、教育、人才培养等方面的要害。因此,能够引发社会各界的强烈共鸣也在情理之中。\n\
    \n仔细考察这两个问题,它们的核心都关系到人才匮乏的问题。深度回归本质,与之最为相关的还是教育领域。百年大计,教育为本,没有好的教育,就不可能培养出高质量的人才,国家的“硬实力”和“软实力”都会受到影响。人才是第一资源,国家的发展靠人才,科学技术的发展靠人才,经济社会的发展靠人才,而人才的培养靠教育。因此,“李约瑟难题”,其本质是在问：“近代中国为什么没有出现顶尖的科技人才?”\n\
    \n对于“李约瑟难题”,李约瑟在卷帙浩繁的《中国科学技术史》中有过一些解答,可大致将其归结为三点：第一,中国社会是农业社会,过于注重经验和实用;第二,中国没有具备宜于科学成长的自然观;第三,科举制扼杀了中国人对探索自然奥秘的浓厚兴趣。\n\
    \n而对于“钱学森之问”,钱老虽然没有给出自己的答案,但他的问题却留在全国人民的心中。无数人对于这个问题的追问与解答,众多学术团体对此乐此不疲的关注,国家教育工作者对此数年的沉思等,都将垒成人们关于该问题的独到见解的一部分。\n\
    \n目前,这方面的研究成果很多,理论思路也很完备,但总的来说,人们目前主要还是站在理想层面进行的。在实践层面,执行力和行动力却是不足的。批判只有与实践相结合,这样的批判才会被认为更有价值。\n\
    \n理想是美好的,前途是光明的,但道路却是曲折的。对“李约瑟难题”与“钱学森之问”这两大世界难题来说,我们都期待的是,在未来的教育中,这两个问题彻底成为历史!\n\
    \n回归教育领域,人才的培养关键靠教育,教育的基本着力点在学校。学校教育是狭义教育的代名词,但也从根本上反映一个国家的教育水平。那么,对于我们的教育,发展水平到底有多高,我们从一组诺贝尔奖颁奖统计数据中便可得知答案。\n\
    \n根据全球诺贝尔奖获得者最多的30所大学^([\\[5\\]](#txt003.html#footnote_content_txt003_5))统计数据显示,美国的哈佛大学总计获得诺贝尔奖158次,稳居世界第一。英国的剑桥大学总计获得诺贝尔奖118次,稳居世界第二。世界第三、第四、第五名分别是美国的加州大学伯克利分校(获得诺贝尔奖107次)、芝加哥大学(获得诺贝尔奖98次)、哥伦比亚大学(获得诺贝尔奖96次)。从全球诺贝尔奖获得者最多的30所大学的排名来看,美国、英国与德国的大学,科研实力与研究水平处于世界前沿(如表3-1所示)。值得注意的是,根据教育部最新数据统计,截至2019年6月15日,教育部公布的全国高等学校共计2\
    \ 956所,但没有一所大学进榜。\n\n表3-1 全球诺贝尔奖获得者最多的30所大学(1901—2018年,只展示前30名)\n\n![](images/txt003_1.jpg\
    \ \"pagenumber_ebook=50,pagenumber_book=40\")\n\n续表\n\n![](images/txt003_2.jpg\
    \ \"pagenumber_ebook=51,pagenumber_book=41\")\n\n根据各国各项诺贝尔奖奖项得主人数的世界前5强^([\\[6\\\
    ]](#txt003.html#footnote_content_txt003_6))统计数据显示,美国以绝对优势稳居世界第一,其他的诺贝尔奖得主包括英国、德国、法国、俄罗斯、日本、以色列、瑞典、西班牙、瑞士、荷兰、挪威等。可见,诺贝尔奖得主的世界前五强中并没有出现中国的身影。\n\
    \n图3-1所示的数据已经从一个侧面反映出中国与世界的差距不是毫厘之差,而是相差甚远。从世界人口的分布情况来看,按照常理,中国的诺贝尔奖获得数据应该是处于世界前列。但从近代至今,上述现象确实令人诧异,“李约瑟难题”与“钱学森之问”诞生于中国,一定与这种“反常”有关。\n\
    \n从世界视野看中国教育,重思我们的教育势在必行。在智能时代,中国的教育应该改变这种现状,世界顶尖创新人才、大科学家、大哲学家等,也应该在中国的土壤中生根发芽,并能够在新时代教育环境的支持下,实现茁壮成长。\n\
    \n在智能新时代,我们的教育,理应知难而上,迎头赶上。\n\n【注释】  \n\n[\\[1\\]](#txt003.html#footnote_quote_txt003_1)“清北复交”：清华大学、北京大学、复旦大学、上海交通大学。\n\
