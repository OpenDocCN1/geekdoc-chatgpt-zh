    [2019-9-13\\].https：//www.jjl.cn/article/142266.html.\n\n\uFEFF\n\n第四章 时空超越：新的教育在场方式\n\
    \n自由支配的学习时间：延伸学生自由发展的可能\n\n多维教育空间并存：从“割离”到“聚合”的空间转向\n\n时空限制的解体：无边界教育的智能建构\n\n\
    无边界学习：“想学”就能实现“在场”\n\n时空是人存在和发展的自然条件。从人与时空的关系来看,有什么样的时空形态,就会反映出什么样的人的存在和发展状态。封闭僵化的时空,人的存在和发展自然会深受其“害”;而自由开放的时空,人的存在和发展自然会深得其“利”。人工智能赋能教育,突破传统教育的时空界限,赋予学生更多自由学习的时间和更广阔的学习空间,从“有界”向“无界”的演变,宣告无边界教育与无边界学习新时代的到来。\n\
    \n一、自由支配的学习时间：延伸学生自由发展的可能\n\n时间是人存在的形式。马克思认为：“时间实际上是人的积极存在,它不仅是人的生命的尺度,而且是人的发展空间^([\\\
    [1\\]](#txt004.html#footnote_content_txt004_1))。”换言之,时间是以生命的衡量尺度和人的发展空间两个维度进行表征。人的历史、现在与未来都将被时间统摄无遗;人的一切活动,都将与之密切相关;人类的工作、学习与生活,都将在时间的流淌中刻下深深的痕迹,从而在历史的积淀中塑造成一个立体的人物形象。\n\
    \n时间具有一维性和不可逆性。在以往的人类印象中,流淌着的时间,是一去不复返的“昨天与今天”的反复,没有人可以凌驾于它之上。因此,人类在时间面前,只有两种选择,一是与时间赛跑;一是被时间“牵着鼻子走”。人类的教育活动与学习活动也不例外,都将受到时间的约束,没有时间的存在,发展的可能性也就无从谈起。\n\
    \n时间是构成学习活动的重要元素,有效地利用学习时间,对于学生学习效果有明显的影响。在传统教育中,教育的中心是课堂、教师与教材,固定的授课时间、固定的授课教师、固定的作息时间、固定的运动时间等,学生的自由也是被固定好的。这样一来,学校的每项活动,都从整体上反映出教育模式的封闭性特征,使学生成为“固定性”的一部分,学生自由学习的时间很少,一般都是按照既定的学习计划进行。在这种状态下,学生有效利用学习时间是被动的。所以,学生在学习的过程中,容易出现浪费学习时间、学习效率低、时间管理不当、有效学习时间短等问题。但在智能新时代,这些问题正在被突破和超越。\n\
    \n智能时代的教育,在学习时间尺度上具有留存性。学习时间尺度上的留存性,是指学习过程的留痕与数据化,可以填补传统教育在学习数据领域的空白。譬如,学生在视频网站上进行学习,可以及时在视频下方的评论区进行在线反馈,或者在弹幕中发表自己学习的想法和观点,所有这些学习过程中积累起来的数据,最终都可以通过运用人工智能数据挖掘技术,对其进行历史复原与可视化整合,实现在既往形态上的学习时间封存。在深度学习领域,“长短期记忆网络技术”与“深度递归网络技术”,恰好能够有效助力模式识别,使不同尺度的数据信息在不同的时间维度上流动,它将为学生后期管理学习时间提供必要的帮助。更有甚者,它可以直接从中反映出学生学习的规律,或者学习的弊端,进而辅助学生养成良好的学习习惯,提高学生自主学习的能力。\n\
    \n学习时间尺度上的聚合性,是指在同频时间尺度上发生的多空间学习活动的聚合,依托人工神经网络技术,能够促进多空间泛在的学习活动的有机连接,实现在多向度的时间中整合零散的学习成果,从总体上节约学生学习的时间。从理论上讲,每个人的学习时间都是相同的,在同一时间范围内,如果将所有的学习者进行的学习活动看作是一个巨型网络,那么每个人的学习活动只能算作是一个时间节点。学习空间中的每一个时间节点的集合,则构成整个人类的学习时间,这个过程中所产出的所有学习成果,最终以智能共享的方式反馈到每个时间节点上。所以,时间的聚合性,为每个学生的学习奠定了思想共鸣的基础,以及学习成果共享的条件。\n\
    \n从学习结果的角度来讲,由于有共享作为前提,学生要想达到节约学习时间的目的,势必要从整个学习时间流中寻找学习资源的连接技术。此时,不得不提及以人工智能技术为基础的在线学习系统。多个学习者同时在此系统中学习,其学习成果的平台化汇总与知识图谱的数据建模,数据的平台化共享与学习过程的交流互动,能够有效以群体之优势,促进实现个人迅速获取较为全面的学习资源的目的,这无疑给每个学生节约了较多花费在寻找学习资源的过程中的时间和精力。这正如马克思所指出的：“每个人的自由发展是一切人的自由发展的条件^([\\\
    [2\\]](#txt004.html#footnote_content_txt004_2))。”只有当足够数量的学习者参与到智能在线学习系统,它的用户的受益程度就高。\n\
    \n人工智能时代的教育,在学习时间尺度上具有留存性和聚合性特征。留存性的存在,是基于智能技术在教育领域的强大存储能力和运算能力,它对教师与学生、学生与网站、学生与学生、学生与智能机器的互动过程进行全方位、多层次的记录和运算。在传统教育中,随着学生学习时间的流逝,本来已经不能再继续拥有的时间,现如今却能借助人工智能技术,有效地将之转换为教育大数据,从而填补了学生学习的“过去式”在时间上的空白。\n\
    \n聚合性的存在,是基于人工智能技术在学习效率上的赋能。在智能机器的优势转化中,它有效地将教师的备课、授课、考评、学情分析、教学资料的收集;学生的学习、考试、复习、拓展资料的获取;学校的管理、学校文化建设等方面的工作,进行系统整合。在智能技术的优势不断转入教育领域的同时,人们正在将传统教育活动中存在的“必要的琐碎时间”转化为“可自由支配的学习时间”,为“以学生为中心”的学习活动提供更多的空闲时间。\n\
    \n人工智能时代的教育,教师的“教”和学生的“学”都需要时间,借助人工智能技术,能有效填补教育活动的“过去式”在时间上的空白,有利于促成“历史教育、当下教育与未来教育”在时间维度上的有机融合。人工智能技术在效率上赋能教育,本质上是对已发生的特定教育活动和教育现象进行时间控制的过程,是从“琐碎”走向“必要”的智能化选择,学生学习的主动状态正酝酿于其中,学生的学习主动性、积极性将迎来改变。\n\
    \n哪一刻,学生会真正感受到时间的存在?自然是学生认识到学习时间价值的那一刻。从学生层面而言,自由时间意味着自由发展的空间,学生的发展又多了一份可能性。马克思在《经济学手稿(1857—1858)》中指出：“自由时间”就是指人“可以自由支配的时间”,是人的“闲暇时间”,是人可用来“从事较高级活动的时间”,是“人能够直接用于发展自身各种本质力量的时间,是使‘个人得到充分发展的时间’^([\\\
    [3\\]](#txt004.html#footnote_content_txt004_3))。”如今,在智能技术的帮助下,学习资源的易得、学习效率的提升、学习规律的掌握、学习弊端的显现,都在将学生从“被遮蔽”的学习空间中解放出来,还给学生更多“可直接用于发展自身本质力量的时间”。所以,时间的存在,只有在失去的那一刻,才能给予学生感悟到它存在的意义,只有在自由获取时间的那一刻,学生才能感悟出它的塑造价值。\n\
    \n总而言之,人工智能时代,存在着可自由支配的学习时间,能够延伸学生自由发展的可能。对于一个学生而言,存在可自由支配的学习时间,意义非凡。自由时间的获得,可以有效促进学生的充分发展,学生的能力发展空间、精神发展空间和社交关系空间将会得到延伸,直至学生因此而获得自由发展。\n\
    \n二、多维教育空间并存：从“割离”到“聚合”的空间转向\n\n空间,是由长、宽、高等基本元素按照一定的方式组成的结构形态,是度量事物位置差异的一个物理量,“大小”与“虚实”是其直接的呈现方式。空间的类型多种多样,包括物理空间、虚拟空间、思想空间、活动空间等。空间,是人类生存的现实条件,是人类一切活动的载体,也是所有人类技术的应用载体,空间的割离必定会致使人类活动与应用在实践上的终结。\n\
    \n教育空间,是指由教育活动和教育现象共同组成的结构形态,是空间与教育在实践上的结合。教育空间的智能化,则是智能时代背景下的人工智能技术在教育空间中的探索性应用,其应用的形态包括认识教育空间、改造教育空间与创造教育空间三个维度。在智能时代,人工智能技术对教育空间的赋能,目的就是要实现多维教育空间的并存与一体化发展。人工智能技术与空间概念的融合,催生新的空间科学、空间技术与空间应用,共同构成“技术+空间”的框架与蓝图,对智能教育空间的塑造具有重要意义。"
  fmt: '

    # 社会知识更新与教育脱节的深层原因


    社会知识更新速度快，教育系统知识更新速度慢，造成的教育与社会发展脱节，最终也需要教育工作者认真反思。从教育发展进程来看，其始终是社会发展的一个缩影，在时间向度上确实有一定的滞后性，因为教育受限于社会的生产力水平、社会的经济政治制度。因此，教育的这种脱节问题，在核心层面，其实是“农业文明与工业文明的冲突，工业文明与智能文明的冲突”在教育环境中的表现，其诱因是极其复杂的，涵盖理论与实践的关系问题、人与自然的和谐问题、人与人的平等问题。


    ## 学校教育的局限性


    学校教育，始终离不开“学校”两个字。相较于社会而言，学校更像是一个象牙塔，所谓的“学、知、行”的观念，大部分也只是适合于“学校”。学校教育，重知识教育与理论教育，但实践课程却很少，这是教育环境中理论与实践脱节的重要原因。学生学到了知识，但对于如何将知识进行情景化应用、如何结合已学到的知识进行创新，这却是一个经常被忽视的问题。譬如，目前很多高校明显存在着教育内容与企业人才需求脱节、与社会人才需求脱节的痛点，特别是那些在学校单纯热衷于理论学习的学生，由于缺乏社会实践经验，毕业后很难适应社会的要求。


    ## 教育课程体系的不健全


    此外，目前的教育课程体系还不够健全。传统教育所倡导的“以人为本”的教育价值理念，重点是以培养学生的“智商”为本，至于学生的“情商”，在学校没有得到很好的培养。自然而然，学校的教育课程，其重心当然是围绕培养学生的“智商”而设置的。本来，在教育的课程中，包含“政史地、物化生、语数英”等课程之余，还应该包括人格教育、精神教育、人生意义教育、社会技能教育、家庭观念教育、婚姻教育、社会关系教育、伦理道德教育，以及对“求富有道即合德”的财富观教育等，但事实并非如此。现有的教育课程体系，并没有将学生看作是一个整体、一个拥有完善人格的人，而是把学生看作一个需要割裂开来的改造对象。


    ## 教师专业素养与教学资源的挑战


    关于“脱节”，还要谈及教师的专业素养、教学资源的筛选与学生的学习能力。科学技术突飞猛进地发展，催生日新月异的社会需求，要求学生知识结构的更新要严格符合社会标准，这才有益于克服“脱节”问题。但事实上，行动起来非常困难。智能时代，很多教师长期与学校外面的社会分离，本身的教学思维与教学内容很容易受到学校环境的限制，囿于如此局限，这样的教师自然很难培养出优秀的学生。邓小平同志曾指出：“一个学校能否为社会主义建设培养合格的人才，培养德智体全面发展、有社会主义觉悟的、有文化的劳动者，关键在教师^[\[4\]](#txt003.html#footnote_content_txt003_4)。”事实就是如此，一个好老师，确实能够带出好学生，这就是为什么现如今要提倡“四有好老师”的缘故。


    另外，在教育资源方面，也存在较大筛选难度。仅教材的编撰工作，就已非常耗时费神，从编撰到出版，再到教材的修订与选为教学用书，需要很长一段时间。但在这段时间，其实有些课程很多的教材内容已经过时。如此一来，就需要教师在上课的过程中，重新花费大量的时间和精力去修正和查找相关的最新信息。


    ## 学生学习能力的侵蚀


    最后，学生学习能力遭到侵害，跟不上时代步伐。特别是当众多知识大量集聚时，信息的参差不齐、数据的交叉互现、知识的碎片化、学科藩篱、智能产品的消极价值等因素，对学生学习的积极性和主动性影响很大。以智能手机为例，关于智能手机与学生学习能力的关系问题，值得大家深思。在智能技术飞速发展的时代，智能手机的功能“五花八门”，学生深陷其中不亦乐乎，对学生的学习产生重大影响。更为重要的是，当手机与学生相关联时，人们就会主动联想到“玩游戏”，而不是想到学习。可见，在智能时代，智能元素嵌套进入教育活动，带来便捷之时，也在消耗学生的学习精力，减弱学生的学习能力，急需正确的价值引领。


    如果有一天，教育知识的更新速度跟上时代的步伐，学校教育与社会教育不再严重地脱节，社会将是怎样的？学生又将是怎样的？这样的未来富有魅力，时刻吸引着我们在智能新时代共同去探索未来教育之路。


    # 五、“李约瑟难题”与“钱学森之问”：重思我们的教育


    20世纪30年代，英国著名学者李约瑟在研究中国科技史时，在其皇皇巨著《中国科学技术史》中提出“李约瑟难题”。问题一经提出，便在全世界范围内引发了激烈讨论。2005年，国务院总理温家宝在看望著名科学家钱学森时，钱老发问：“为什么我们的学校总是培养不出杰出的人才？”钱老的这一发问被称之为“钱学森之问”，同样引发了广泛的社会热议。


    无论是“李约瑟难题”，还是“钱学森之问”，虽然他们看问题的立足点不同，但都涉及中国近现代以来的科技、教育、人才培养等问题。问题的提出能够引发巨大的社会反响，一方面是基于两位学者的社会影响力，另一方面也是因为这两个问题正好命中我国科技、教育、人才培养等方面的要害。因此，能够引发社会各界的强烈共鸣也在情理之中。


    仔细考察这两个问题，它们的核心都关系到人才匮乏的问题。深度回归本质，与之最为相关的还是教育领域。百年大计，教育为本，没有好的教育，就不可能培养出高质量的人才，国家的“硬实力”和“软实力”都会受到影响。人才是第一资源，国家的发展靠人才，科学技术的发展靠人才，经济社会的发展靠人才，而人才的培养靠教育。因此，“李约瑟难题”，其本质是在问：“近代中国为什么没有出现顶尖的科技人才？”


    对于“李约瑟难题”，李约瑟在卷帙浩繁的《中国科学技术史》中有过一些解答，可大致将其归结为三点：第一，中国社会是农业社会，过于注重经验和实用；第二，中国没有具备宜于科学成长的自然观；第三，科举制扼杀了中国人对探索自然奥秘的浓厚兴趣。


    而对于“钱学森之问”，钱老虽然没有给出自己的答案，但他的问题却留在全国人民的心中。无数人对于这个问题的追问与解答，众多学术团体对此乐此不疲的关注，国家教育工作者对此数年的沉思等，都将垒成人们关于该问题的独到见解的一部分。


    目前，这方面的研究成果很多，理论思路也很完备，但总的来说，人们目前主要还是站在理想层面进行的。在实践层面，执行力和行动力却是不足的。批判只有与实践相结合，这样的批判才会被认为更有价值。


    理想是美好的，前途是光明的，但道路却是曲折的。对“李约瑟难题”与“钱学森之问”这两大世界难题来说，我们都期待的是，在未来的教育中，这两个问题彻底成为历史！


    ## 诺贝尔奖数据折射的教育现状


    回归教育领域，人才的培养关键靠教育，教育的基本着力点在学校。学校教育是狭义教育的代名词，但也从根本上反映一个国家的教育水平。那么，对于我们的教育，发展水平到底有多高，我们从一组诺贝尔奖颁奖统计数据中便可得知答案。


    根据全球诺贝尔奖获得者最多的30所大学^[\[5\]](#txt003.html#footnote_content_txt003_5)统计数据显示，美国的哈佛大学总计获得诺贝尔奖158次，稳居世界第一。英国的剑桥大学总计获得诺贝尔奖118次，稳居世界第二。世界第三、第四、第五名分别是美国的加州大学伯克利分校（获得诺贝尔奖107次）、芝加哥大学（获得诺贝尔奖98次）、哥伦比亚大学（获得诺贝尔奖96次）。从全球诺贝尔奖获得者最多的30所大学的排名来看，美国、英国与德国的大学，科研实力与研究水平处于世界前沿（如表3-1所示）。值得注意的是，根据教育部最新数据统计，截至2019年6月15日，教育部公布的全国高等学校共计2
    956所，但没有一所大学进榜。


