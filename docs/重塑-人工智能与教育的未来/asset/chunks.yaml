- raw: "2018年4月29日,教育部联合科技部、工业与信息化部、财政部等13个部门在天津联合召开“六卓越一拔尖”计划2.0启动大会,会议强调要全面实施“六卓越一拔尖”计划2.0,发展新工科、新医科、新农科、新文科,推动全国高校掀起一场“质量革命”,形成覆盖高等教育全领域的“质量中国”品牌,打赢全面振兴本科教育攻坚战^([\\\
    [11\\]](#txt007.html#footnote_content_txt007_11))。\n\n新文科教育的引进与战略布局,国内文科教育的发展迎来新一轮热潮,“文科无用论”的论题不推自倒,使得相关研究引起了高度重视。中国人民大学、郑州大学、西安交通大学、华东师范大学等高校开通文科发展新通道。就连素有“中国最高工科学府”的清华大学,也在助推新文科的建设与发展,力争学校新文科教育再上新台阶。国内新文科教育的兴起,是文科教育数十年遭受冷落后的一次回归。新文科教育的“新”,体现在“综合性的跨学科学习”,意味着传统的分门别类的“孤立式”学科教学模式正在改变。\n\
    \n新文科教育的发展,由于其大综合与交叉性质的存在,也会出现新的困难。专业的新文科教师队伍有待培养,专业的新文科教学资源有待挖掘,专业的新文科教学评价体系有待建立。如此等等,都将在新文科教育的发展过程中成为阻碍性因素,急需借助新工具和新手段应对新文科教育中存在的新问题。考虑到新文科的综合性与交叉性质,可以预见新文科教育的发展过程必定是“复杂性”与“庞杂性”交错出现。\n\
    \n人工智能时代,智能教育系统兼具高速的运算能力和“化繁为简”的运算模型优势,加之文科教育发展历史中累积起来的庞大的多源异构数据,人工智能技术正是在处理“复杂性”与“庞杂性”问题方面有着独特的能力。同时,教育部也在2018年的《高等学校人工智能创新行动计划的通知》指出,要加强人工智能与计算机、控制、量子、神经和认知科学以及数学、心理学、经济学、法学、社会学等相关学科的交叉融合^([\\\
    [12\\]](#txt007.html#footnote_content_txt007_12))。可见,无论在技术层面,还是在政策层面,人工智能时代的新文科教育,在发展过程中所遇到的瓶颈将在人工智能技术领域找到新的出路。\n\
    \n人工智能与新文科教师队伍培养。新文科教师队伍的培养,关涉新文科建设与发展的成败,至为关键。在新文科建设过程中,陕西师范大学国学研究院院长曹胜高就曾坦言：“文科能否做得好,关键看教师”。所以,将人工智能技术引入新工科教育,应首先着手培养一批优质的新文科教师队伍,以保证新文科教育的可持续发展。智能时代的新文科教育,教育活动过程自然要以智能教育为主,包括智能教学设备的使用、教师的智能教学素养的培养、智能教学观念的转变、文科综合教学素养的形成、教师智能创新素养的锻造等,都需要借助人工智能技术的价值与优势,以培养兼具新文科综合教育背景的复合型人才,打造王牌新文科教师队伍。\n\
    \n首先,高等教育机构应该优先带头改革新工科教师队伍培养的教材,弥补教育上游阶段的分科教学导致的教师素质的分裂,狠抓新工科基础理论教育,丰富教育实践课程,锻造新工科新型人才。\n\
    \n其次,高等教育机构应该构建完善的激励政策,积极鼓励学科教师进行再教育、再学习,并为学科教师的再教育给予资金帮助,提高教师的专业水平和素养,以便更好地从事新工科人才的培养教学工作^([\\\
    [13\\]](#txt007.html#footnote_content_txt007_13))。\n\n再次,高等教育机构应该积极引进人工智能复合型人才。新工科教师队伍匮乏,且培养新工科教师队伍的高等教育机构仍然缺乏教育人才。所以,高等教育学校应该重点引进和培育校本化的新工科教育人才,在此基础上衍生新工科教育的人才队伍。\n\
    \n最后,高等教育机构应该创建专门的新工科教育平台,指定专人负责推进新工科教育工作,完善相关的教育制度和奖励机制,加强新工科教育科研工作,确保新工科教育的理论与实际相联系,促进新工科教育的平台化发展,实现新工科教育人才队伍的批量输出。\n\
    \n重视人工智能与新文科教学资源挖掘。大数据和人工智能时代,教学资源的丰富性与多样性,给新文科教育的发展提供了良好的资源基础。随着新文科教学资源大数据的集聚,包括媒体时政素材、网络空间公开课、网络题库、网络资源数据库、各大高校共享的新文科教学资源等,将提高教师和学生获取教学资源的方便程度,但同时也加大了他们筛选数据的难度。人工智能的一个重要支柱是数据挖掘技术(Data\
    \ Mining)。数据挖掘技术,是一种从大规模数据库或数据仓库中提取隐藏的预测性信息的科学方法,它让人们有能力最终认识数据的真正价值,即数据中潜在的可用信息和知识^([\\\
    [14\\]](#txt007.html#footnote_content_txt007_14))。通过运用数据挖掘技术,可以帮助新文科教育者与教育对象高效获取教学资源,避开教育资源筛选难题,提高新文科教育教学的效率和质量。\n\
    \n人工智能与新文科教学评价。新文科教学评价是指依据新文科教学目标,对新文科教育的过程及其结果进行价值判断和未来决策行为的评价活动。新文科教学评价的对象将包括学生、教师、教学环境、教学方法、教学内容、教学管理等。由于评价的对象具有动态变化特征,新文科教育教学评价体系的建立,需要借助于人工智能技术,从新文科教育的过程与结果中挖掘教育大数据,以数据为基础进行教学评价建模,建立专业的人工智能教学评价平台。在评价体系中,纳入完善的教学评价内容与评价对象,建立规范的教学评价指标体系,充分发挥人工智能技术的深度学习、智能感知与智能干预的价值与优势。在评价的方法上,促成形成性评价、诊断性评价与结果性评价有机结合的评价格局,突出形成性评价与教学过程的动态性特征相结合,实现新文科教学评价的价值性与科学性相统一。\n\
    \n五、科学综合化：智能时代大学人才培养的重要路径\n\n现代科学既高度分化又高度综合。一方面,分化愈来愈细,学科愈来愈多,专业化程度愈来愈高。另一方面,各种交叉学科、横断学科和边缘学科不断涌现,综合化速度愈来愈高。可以说,科学的分化实际上是科学综合的另一表现形式。因此,综合占据科学发展的主导趋势。这种趋势具体表现为：\n\
    \n第一,学科的多层次、多维度交叉与渗透。现代科学改变了过去彼此隔绝、互不联系的状况,各学科在高度分化的基础上,相互渗透、广泛“杂交”、盘根错节、互为基础,在数量上已发展到几千种,学科间的鸿沟逐渐被填补,知识间的横向联系愈来愈紧密。正如诺贝尔基金会主席絮内贝里斯特隆所深刻指出：“从近几年诺贝尔奖获得者的人选可以明显看到,物理学和化学旧的学术界限已在不同方面被突破。它们不仅相互交叉,而且形成了没有鲜明界限的连续区,甚至在生物学和医学等其他科学方面也发生了同样的关系。”\n\
    \n第二,横断学科的出现。由电子计算机、通信技术、生物学、物理学和数学等学科相互交叉渗透而形成的系统科学——包括第二次世界大战后形成的系统论、信息论和控制论以及20世纪60年代以来蓬勃发展起来的耗散结构论、协同学、突变论、超循环论和混沌理论等,以其富有成效的系统方法和关于复杂性的深入探索,深刻地揭示了自然界各个层次之间的联系和发展规律。这一大批新兴横断学科的出现组成了系统科学这一新的学科门类,构成了现代人工智能的基础理论。\n\
    \n第三,综合性学科的涌现。科学技术的广泛应用,大大加快了人类社会的发展步伐,同时也使当今社会经济系统变得更加复杂,使人类面临着一系列重大问题,如环境问题、生态问题、能源问题等全球问题,以及各国发展战略和社会管理问题。要想合理解决这些问题,就要使以往各自独立开展研究的自然科学、社会科学和人文科学进行很好的合作,打破过去条块分割、互不通气的传统科学体系,代之以综合各学科要求的综合性体系。环境科学、管理科学和思维科学等都是高度综合的学科,体现了自然科学、社会科学和人文科学的汇流。\n\
    \n第四,科学的数学化。过去仅与部分自然科学联系紧密的数学,如今已深入各门科学研究中。如生物学、心理学、经济学、社会学等越来越多的学科,都在广泛应用数学的语言、模型和方法进行定量研究。系统科学的兴起和计算机的广泛应用,进一步推动了科学的数学化进程。到20世纪80年代,建立了一系列的经济模型、社会模型和心理模型,并大量借用数学方法进行社会科学理论的论证和社会运行的预测与决策。数据分析已成为现代经济学和管理学的重要特征。\n\
    \n现代科学的综合化趋势给大学人才培养提供了一个重要启示——在大学人才培养中,要善于抓住这种特点,注意“通才”教育,培养高素质的人才。\n\n第一,指导学生全面掌握知识并形成合理的知识结构。学习知识与技能是大学生在校期间要努力完成的一项主要任务。关于知识,英国哲学家培根早就说过：“知识就是力量”,他强调了知识的重要作用,而这种作用在智能经济时代变得更加突出,因为知识是辅助学生形成创新思维的重要基础。实际上,在智能经济时代,知识(knowledge)这一概念的外延也在逐步扩大。总部设在巴黎,以发达国家为主要成员国的“经济合作与发展组织”在其《以知识为基础的经济》的报告中,引用了西方自20世纪60年代以来关于求知的“4w”概念,把人类迄今创造的所有知识分为四大形态：know-what(知道是什么,事实知识)、knowwhy(知道为什么,原理知识)、know-how(知道怎么做,技能知识)、knowwho(知道谁,人力知识)。我国吴季松博士在其《知识经济》的专著中,又增加了know-when(知道什么时间,时间知识)、know-where(知道什么地点、地点知识)、know-quantity(知道是多少,数量知识)等三种形态。知识本身的重要性和知识形态的多样性给新时代的大学教师一个很重要的启示——在大学教学过程中,要指导学生充分利用有限时间,尽可能多地学习知识,尤其是注意以下这些方面：①作为“专业人”必须学习的专业知识及其最新进展和动态。②作为“文化人”而应该具备的知识,如自然科学学生应该学习一些人文社会科学知识,人文社会科学的学生应该学习一些自然科学,尤其是现代科技方面的知识。③作为“社会人”为将来毕业后提高自己的社会竞争力而需要扩展的知识,如学习中文和外语的学生最好多学一些财经、金融、法律和现代管理方面的知识。④为学习知识而必须掌握的“工具性”知识,如作为思维工具的哲学和逻辑学等,作为数量和计算工具的数学、计算机和人工智能等,作为语言工具的母语和外语等。适应科学数学化和国际交流的需要,要特别重视数学和外语的学习。通过以上几方面的努力学习,就会使学生逐渐成为有合理“知识结构”的人,以适应现代科技和智能经济对人才的要求。\n\
    \n第二,要求学生在学习过程中做到“专”“博”结合。“通才”与“专才”的关系问题,对今天的大学教师来说,是一个值得认真思考和解决的问题。进入20世纪50年代以来,人类知识的增长是以几何级数式的,即以几倍几十倍的速度增长。到21世纪,人类知识是呈立体交叉般膨胀式地增式——指数级增长,即所谓“知识爆炸”。例如,人类的科学知识在19世纪每五十年增长一倍;20世纪中叶每十几年增长一倍;现在,每五六年增长一倍;有人预计,到21世纪中叶,将一两年增长一倍,甚至更快。这就要求新世纪的大学生既要有广博、坚实的知识基础,又要能以有限的时间和精力从事专业或专门的学习和研究,追踪学科发展的前沿,且正确处理二者的关系。在这里,要注意如下四点：①“博”是“专”的基础。要通过广泛的学习和不断的积累,掌握广博的知识,为学习和研究打下坚实的基础。②辩证地理解“博”。“博”不是无所限制,广泛阅读亦有所选择。漫无边际、毫无目的、缺乏选择和不断转换方向的“博”是有害而无益的。要由近及远,由浅入深,不断充实和更新知识;要坚持不懈地运用多种手段进行知识积累,并在学习中巩固和深化所学的知识。③处理好专业与非专业之间的关系。把“专”与“博”有机结合起来,就要考虑专业与非专业的关系。专业要“专精”,非专业要“广博”,非专业为专业服务。在专业学习中要尽可能掌握新学科、新知识、新见解、新动态。当专业学习遇到困难时,要注意查找是否是因为知识基础和知识面的原因。④在“博”与“专”的统一中建立合理的知识结构。学习如同老渔翁撒网捕鱼,开始时,网要尽可能撒得开,然后慢慢收缩,最后集中在一点上。在处理“博”与“专”关系问题时,要指导学生使其知识不断地“序化”“精化”和“演化”,形成合理的知识结构。\n\
    \n第三,让学生注意知识的横断转移。化学中,关于溶液浓度的计算有很多难题,但若用数学中列方程的方法就会迎刃而解;生物学中,光合作用和呼吸作用的机制十分复杂,但若用化学反应方程式表示其过程,则一目了然;地理学中,有关地球公转的速度较难理解,但若用物理中的开普勒定律,设计一道计算题,就会茅塞顿开……这样的例子不胜枚举。实际上,科学和知识本来就是一个相互交织的统一有机整体,人们之所以将其分成数、理、化、天、地、生等不同学科,只是为了研究和学习方便。正如著名物理学家普朗克指出：“科学是内在的统一体,它所分解为单独的部门不是由于事物的本质,而是由于人类认识能力的局限性。实际上存在着从物理学到化学,通过生物学和人类学到社会科学的连续的链条,这是一个任何一处都不能打断的链条。”在教学过程中,我们要有意地使学生掌握不同学科知识间的相互联系,注意把一门学科的知识横向转移到另一门学科中去。这样,不仅有利于巩固旧知识、顺利接受新知识,而且能增强记忆力,提高分析问题、解决问题和辩证思维的能力。久而久之,就能形成自己的知识网络,建立合理的思维结构,更有效地认识事物的整体,这对学生毕业后再学习和应用也是非常重要的,也有利于学生形成终身学习的思想理念。\n\
    \n第四,使学生学会方法的移植。所谓“移植”,就是把一门学科或几门学科的概念、范畴、研究方法运用到其他学科中。在各种移植中,方法的移植更重要。在教学过程中,我们不仅要使学生注意知识间的横向转移,更要使他们注意方法间的相互移植,要帮助学生学习一点横断学科的知识,如系统论、信息论、控制论等,它们从不同的侧面揭示了客观物质世界的本质联系和运动规律,为现代科学技术的发展提供了崭新的思路,继相对论和量子力学之后,又一次彻底改变了世界的科学图景和科学家的思维方式。它们所提供的方法,如系统方法、信息方法、功能模拟方法等,则具有更大的普适性,使方法间的移植具有更大的现实性。同时,还要让学生注意自然科学方法和社会科学方法间的相互移植,自然科学和社会科学虽然遵循不同的规律,但在研究方法上却有可借鉴性。自然科学方法,如数学与逻辑方法、观察与实验方法、模拟与类比方法等自20世纪初便被大量、广泛地移植到社会科学的研究中,并取得了巨大的成就。从12世纪中叶以来,一些比较通用和成熟的社会科学方法,如价值分析方法、伦理规范方法、目的假设方法、历史主义方法、直观外推方法、模糊思维方法等,也开始被引入运用到自然科学的研究中。把自然科学方法移植到社会科学中去,有助于增加对社会现象和规律认识的精确性和说服力;把社会科学方法移植到自然科学中去,则有助于增强对自然现象和规律研究的应用性,并使研究者把握好自己的价值取向。\n\
    \n第五,指导学生善于开垦“科学的处女地”。各门学科都有自己特定的研究范围和边界,而学科边界之间的“空白处”往往是各门学科不曾问津的。随着科学认识的不断深化,这些“空白处”逐渐成为科学研究的对象,而且常常是最易出成果的地方。美国科学家维纳说：“在科学发展上可以得到最大的收获领域,是各种已经建立起来的部门之间被人忽视的无人区……到科学地图上的这些空白地区去做适当的查勘工作。只能由这样一群科学家来担任,他们每人都是自己领域的专家,但是每人对他的领域都有十分正确与熟练的知识。”维纳把这些“被人忽视的无人区”比喻为未开垦的“科学处女地”。而以后的控制论、信息论、电子计算机等学科正在这些“未开垦的处女地”上绽开一朵朵光彩夺目的鲜花。大量事实证明,在学科交叉、渗透的边缘地带较容易出成果,教师要培养学生的创新意识和探索精神,指导和鼓励学生到学科边界之间的“无人区”进行探索。\n\
    \n【注释】  \n\n[\\[1\\]](#txt007.html#footnote_quote_txt007_1)中共中央编译局.马克思恩格斯选集(第1卷)\\\
