    ### 搭建终身教育平台


    终身教育平台的搭建, 是人工智能时代有效联结与整合教育对象终身教育数据与终身学习数据的平台基础。所以, 有必要紧密围绕教育对象的生活环境, 进行广泛的教育平台“覆盖性应用型”建设,
    从整体上覆盖教育对象的各个教育阶段与各种教育类型, 借助大数据人工智能终身教育平台, 形成“家庭—学校—社会”为一体的综合性教育平台。据新华网报道, 早在2012年,
    面向全民的国家开放大学就已建成, 国家开放大学一直致力于促进全民终身学习, 在开放大学中, 网络自主学习、远程支持与面授辅导相结合的学习模式, 为不同类型(不同年龄、不同职业等)的人群提供丰富多样的教育课程,
    大力推动了全民终身教育实践的落地。


    ### 构建终身教育体系


    联合国教科文组织在发布的《北京共识——人工智能与教育》中指出, 人工智能时代的教育, 应该“通过人工智能与教育的系统融合, 全面创新教育、教学和学习方式,
    利用人工智能加快建设开放灵活的教育体系, 确保全民享有公平、有质量、适合每个人的终身学习机会。”“要采用人工智能平台和基于数据的学习分析等关键技术, 构建人人皆学、处处能学、时时可学的综合型终身学习体系。^([4](#txt011.html#footnote_content_txt011_4))”“综合型终身学习体系”的构建,
    正在推动终身教育体系的结构成型。人工智能时代, 教育的边界正在被打破, 教育对象不再被固定在指定的领域进行学习或者接受教育, 而是在任意时间和地点都可以进行学习与建构知识。未来,
    将在深度学习、自然语言处理、机器模式识别等关键技术的帮助下, 建构出“群智共享、人机协同、跨界关联、融会贯通”的终身教育体系, 助力终身教育的实践落地与创新发展。


    人类社会已经开始迈入“后人类社会”, 以智能技术为代表的新兴技术的崛起, 挑战了原始的人类中心主义的世界观、人生观与价值观,“被挤压”成为这个时代的人类所共有的显著标志。因此,
    人工智能教育的发展, 势必要带领整个后人类社会, 摆脱后工业社会的“智能束缚”, 投身于人工智能终身教育体系的怀抱之中。未来教育, 并不是所有的后人类都会被人工智能“挤压”,
    只有那些对终身学习与终身教育“不屑一顾”的后人类, 最终难免是要吃人工智能的“苦头”。


    ## 面向未来：教育为学生的未来做准备


    教育的变, 变的是形式; 教育的不变, 不变的是本质。教育的形式丰富多彩, 但教育的本质总是围绕培养人而进行的。无论任何时代, 教育的本质属性都不会变, 这是由社会的本质属性所决定的,
    反映在教育的相对独立性之中。教育的存在, 其起源就不是源于其他领域, 而是源于人的生产劳动。就此而言, 教育的本质不会变, 由其本质所决定的目的和任务也就不会变。值得注意的是,
    教育的本质不会变, 但教育的内容却会不断地扩充, 教育的目的和任务也在不断地扩充——与时俱进, 教育的质的规定性在多元技术的支撑下,“培养什么样的人, 怎样培养人”的问题受到越来越多的关注。然而,
    最有权力回答此问题的人, 应该是教育对象本身, 他们最清楚“自己想要成为怎样的人”, 而不是“教育者想要他们成为怎样的人”。


    如此说来, 教育的本质的内容, 目前已经扩充到教育对象领域, 包含两层含义：一层是教育者的期盼, 在一定意义上代表社会的发展要求, 为迷惘的教育对象指明发展方向;
    另一层是教育对象的迫切要求, 它直接支撑教育对象一直走向未来, 而不让教育对象止于某个阶段。换言之, 教育对象自己知道未来的自己要活成什么样子。所以, 他们从现在开始就已经思考这件事,
    因为他们始终相信, 跟着自己的内心走, 一直不停止思考, 总会活成自己想要成为的样子, 生活也会成为自己想要的样子, 这大概就是所谓的“皮格马利翁效应”。


    与此不同的是, 过往的教育, 重点强调的是眼前的短期利益, 可以是为了中考考入一个好学校, 也可以是为了高考考入一个好大学。但是, 当这些目标实现之后, 迷茫与困惑却成为生活的主题,
    很多学生就在这样的状态中度过了自己的大学时光。


    教育对象是一个有机整体。作为教育者, 不应该人为地将之割裂成碎片, 然后进行拼装, 这样的短期效果固然好。但是, 在教育对象身上形成的碎片间的裂纹, 将会成为教育对象一生的残缺印记。然而,
    以更为发达的人工智能技术为基础的未来教育, 必然是早就规避了如上之局限, 着眼于未来的教育, 这将成为未来教育的普遍共性。总的来说, 未来教育, 是为学生的未来做准备的。这种教育,
    它不是忽视学生的过往, 也不是完全不看眼前的实际, 而是在过往的教育大数据与学习大数据的支撑下, 充分赋予学生众多未来的可能性。


    教育为学生的未来做准备。人类教育史上, 有很多教育家提到过教育与生活的关系：有人提出教育为宗教生活做准备, 有人认为教育就是生活的, 也有人认为教育就是为休闲生活做准备等。但是,
    最为人称赞的观点, 还是教育“为未来生活做准备”的教育思想。早在19世纪末期, 英国著名的教育思想家赫伯特·斯宾塞就已提出, 教育的目的是为“未来的圆满生活做准备”的。确实如此,
    在物质充盈与思想自由的年代, 这一教育思想蕴藏着战略眼光——学生的学习是面向未来的学习。


    在欧几里得的《几何原本》中, 有个弟子曾经问他学习几何能够得到什么好处, 这个功利性的想法很快就遭到了他的批判, 面对这样的问题, 欧几里得对身边的侍从说,“给他三个硬币,
    因为他想在学习中获取实利。^([5](#txt011.html#footnote_content_txt011_5))”这样看来, 无论今人还是古人, 在教育的理念上,
    都有惊人的相似之处——强调教育的未来价值。


    为学生的未来生活做准备, 不仅是一些教育家的重要理念, 也是一些教育机构的发展愿景。国际学生教育评估项目(PISA教育)便是如此, 它旨在从开发测评工具、结果报告呈现、学生表现因素分析、教育质量和教育公平协调发展等角度,
    提高教育的质量和学生的整体能力。PISA教育指出, 教育的发展应该重点关注学生的知识建构能力, 而不是知识的记忆能力。记忆能力的背后, 是一整套的应试教育体系,
    讲求的是死记硬背, 使很多学生失去了思维能力和创新能力, 陷入灌输的无限循环之中。而知识的建构能力, 则是培养学生创造知识的能力。在引导学生创造知识的过程中,
    PISA教育还在考核内容中加入了素养考核。PISA定义的素养与其他教育形态强调的素养不同, 它强调的素养是学生通过学校教育和生活教育, 主动将已经学到的知识和技能应用于实际生活中,
    以便于学生提升总体的生活能力和生活水平, 从而适应将来的极具变化色彩的生活, 确保能够拥有在不同情境中具备解释问题和解决问题的能力。

