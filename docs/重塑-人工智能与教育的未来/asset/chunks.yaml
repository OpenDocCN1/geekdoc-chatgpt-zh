    # 智慧校园的技术应用与发展


    ## (三) 人工智能与校园智慧照明系统


    人工智能技术与校园照明系统的结合,催生校园智慧照明系统的诞生。校园智慧照明系统,是指将大数据、云计算、人工智能等技术运用于校园照明系统的管理、服务与运维过程中,全面提升照明资源利用效率和照明系统管控能力,从而构建面向智慧校园照明系统智能化平台,兼具数据采集、数据存储、数据分析、数据优化、精准决策和资源预测等功能。


    校园智慧照明系统,是在传统校园照明系统的基础上发展起来的新一代照明系统。智能技术尚未与校园照明系统相结合时,存在较为明显的资源浪费问题。传统的校园照明系统,要么是指定全校关灯时间,要么是指定晚上不关灯,这样做的结果就是：资源利用效率不高,造成照明资源的严重浪费,或者师生的照明需求得不到有效满足。“人走灯不灭”与“人来灯不亮”是传统校园照明系统的通病,为了解决校园照明系统中存在的这“两大问题”,人工智能技术支撑下的无人化与智能化照明理念,无疑成为智慧校园建设关注的重点。


    智慧校园照明系统在嵌套人工智能技术之后,校园照明网络开始变得智能。届时,校园照明系统可以通过智能终端进行全方位的控制,实现“一键多控”,节约人工执行开关灯任务的成本。而且,以算法模型为基础的智慧校园照明系统,每一盏灯的亮度都能够实现随着外围环境的改变而改变,能根据环境的光线亮度调整灯光的整体亮度,并将有人区域的灯光调至最合适的亮度。通过运用智能感知技术与边缘计算技术,当白天到来时,照明系统的部分灯光将会关闭;对于较为密集的楼层的夹层之间,由于外围光线太弱,照明系统依旧处于工作状态,只要有师生经过,它就能在智能感知技术的帮助下,实现“人来灯亮”与“人走灯灭”的目标。所以,智慧校园照明系统在节能、环保与舒适三个维度上具有较为突出的价值。


    智慧校园照明系统,还能实现远程抄表、智能检测问题症结、电网危险定位、违规用电预警、电流控制等功能。以往需要人工手动抄表的工作,如今全部交予智慧照明系统的后台处理器完成。如学生宿舍的照明用电消费数据,系统在特定的算法模型的帮助下,能够根据每个宿舍的照明用电实际消费数据进行费用计算,并将结果通过智慧校园照明系统平台和手机短信告知学生,学生可以在智慧照明平台上进行远程缴费,既给学生的生活提供便捷,也给校园照明消费系统的工作人员节约了大量的时间和精力,总体上节约了照明系统的运营成本。


    在校园智慧照明系统的帮助下,智慧校园变得更加舒适宜人。概括而言,校园智慧照明系统的价值体现在两个方面：一方面,它为全校师生营造了一个智能的光感环境,在系列节能与环保技术的支撑下,整个照明系统能够充分利用外围自然光照实现节能的目的,改善了师生整体生活环境,有利于提高师生的工作学习效率;另一方面,提高校园照明系统的整体管理水平,实现从“人工”向“智能”的转变,很多管理思想与理念得以运行其中,同时大大减少学校照明系统的运行与维护费用,节省校园整体开支。


    ## (四) 人工智能与智慧教学管理系统


    智慧教学管理系统是指学校充分运用新的管理手段和方法,提升教师与学生的“在场”状态的过程。在多源异构的教学大数据、教学管理的算法模型、5G快速传输技术、云存储与超速运算等条件的支持下,人们开始探讨传统的教学管理模式的优势与弊端。


    在传统的校园教学管理中,由于校园监管机制不健全、监管工作人员数量有限、监管技术受到软硬件水平的限制等原因,教学管理存在较多局限。高质量的管理活动,源于高质量的决策支持,高质量的决策又源于对决策数据的全面掌握。只有充分利用客观且全面的教学大数据,管理者才能做出正确的决策。教学管理一般包括计划、组织、协调、控制等方法,但囿于传统管理者数据收集的片面化与单维化,再科学的管理策略也无济于事。


    传统的教学管理者,是基于局部数据而作出的管理决策,对于教学活动中的教师和学生而言,教师处于被管理的地位,学生处于被支配的地位,教学管理活动并不能充分反映师生民意。因此,教学管理活动成为管理者的特权,教师和学生的参与权与知情权分离,教学管理的“双向反馈”机制不成熟,学生的主体地位受到限制,教师丧失教学活动策划的主动权,成为听从者和执行者。由此可见,学校的传统教学管理实则是管理者的事情,而不是全校师生与行政人员共同的事情,从而限制了学校教学管理的科学化进程,也束缚了批判性思维环境与创新性思维环境的形成。


    为解决传统教学管理中存在的弊端,引入新兴技术辅助扩建教学管理的“双向反馈”渠道与平台,成为教学管理智慧化与智能化的重要一环。智慧教学管理分为三个维度进行构建：一是面向学生的学习管理系统,二是面向教师的教师管理系统,三是面向管理者的教务系统。前两个系统呈互动关系,且教师管理系统能够高效调集学习系统的学习数据,并能够通过特定算法控制学习系统的操作界面,学习管理系统则能够及时向教师管理系统反馈学习数据,教师系统又直接与教务系统相连接。


    ### 学习管理系统


    具体的功能模块包括学生信息管理、学生在线学习管理、学生学习成绩管理、学生学情统计分析、学生学习课程进度管理、学习过程记录与追踪、线上互动交流学习平台、学生学习反馈管理等。在该系统中,除了教师能够迅速调集其数据外,学生也可以较为自由地穿梭于其中。譬如,进行成绩查询、查看自己的学习进度、在系统中自由的选择学习的视频资源、下载想要深入研究的课程文件等。可见,该系统为学生的学习提供了非常便捷的渠道,同时也为教师深入了解学生提供了技术支持。


    ### 教师管理系统


    具体的功能模块包括教师信息管理、教师绩效管理、教师教学进度管理、教师作业批改系统、教师出题平台、教师信息反馈平台、学生学情对接端口等。在该系统中,教师通过教职工身份认证编码完成登录认证,就可以运行系统中的全部功能。譬如,教师可以通过使用教师系统,实现一键获取近期某班某科教学进度的具体情况,也可以了解该课程中学生的具体学习表现,以及进行学生学习的前后的成绩测试,据此及时改进教学进度与教学方法,促进教育教学工作与学生学习过程、学生的个体学习情况相适应。


    ### 教务管理系统


    学校管理者可以通过该系统了解学生的学习情况和教师的教学情况,还可以了解教师的教学进度和教学效果、学生的学习情况和学习效果、教师整体的专业素质与专业形象、学生对教师的评价与反馈、教师与学生对学校管理工作的满意度等。从系统论的角度来说,学生的学习系统是整个智慧教学管理系统的核心和关键,而教师教学系统和学校教务管理系统是直接为学生的学习而服务的。整个智慧教学管理系统的构建理念是“以学生为中心、专业为学生服务、成就学生的未来”,突出教育“立德树人”的价值。


    从管理科学视角看,学生、教师与学校在一个“虚拟场域”中实现连接,填补了三者之间因为距离和时间而导致的“理解空白”,从而在智慧校园中建构出一个虚拟与现实“相映成智”的智慧型生态管理系统,无疑在管理效率和管理质量上达到“双重跃升”的目标。


    整个智慧教学管理系统形成“以学生为中心”的智能管理框架,其最大的价值自然体现于学生的学习效果之中。


    首先,它可以为学生提供多媒体课件、学习资源等学习材料,学生可以根据自身情况按需选择学习内容,合理安排学习计划。有利于学生培养自主学习和终身学习的良好习惯。同时,智慧化教学管理系统还可以为学生提供存储学习成果、记录学习感受的空间,形成学生成长档案,教师可以更好地对学生的学习活动进行过程性评价[^7]。


    其次,它能够节约学生查找学习资源的时间、自己制订学习计划的时间、自己总结知识点盲区的时间,在减轻学生学习任务的同时,也给学生自由发展提供了空闲时间。


    最后,在学习的过程中,能够得到来自教师的个性化情感关注和智能学习系统的智能学习推荐,体现学生的个人价值与教师对学生的人文关怀。教师对学生的爱不再停留于“空话”。从认知行为主义的角度来讲,教师能让学生知道每一次奖励或者惩罚的具体原因,使学生的行为塑造更加有章可循。


    智慧教学管理系统的价值不止于此,它还能减轻教师的工作负担,也可以为学校管理者提供移动式办公平台等。所有这些,无不都在突出校园3.0时代的“智慧”。智能时代,虽然人工智能不会全权代替人类管理校园的教学工作,但如果不将人工智能技术用于教学管理活动的学校,注定要在具有竞争关系的教育系统中处于劣势地位。因此,智慧校园教学管理系统的升级换代,应该积极引入新一代信息技术和新一代人工智能技术,并将其作为基础,以便从整体上提高教学管理质量,从而提升学校的整体教育质量。


    ## (五) “校园一卡通”迈向“校园一脸通”


    1999年,福州银达公司率先推出银校一卡通系统,这是最早的校园一卡通系统。在完善其支付功能后,不久便开始推向全国各地的校园,给学校管理与服务工作带来了很多便捷之处。基于此,很多公司也开始涉足该领域,不断地完善和充实校园一卡通的技术架构与平台服务领域。如今,国内校园一卡通已基本实现了全覆盖。


    校园一卡通是以互联网、物联网、计算机等技术为支撑的综合应用工具,具有身份认证、校园消费、教学打卡、学校就医、活动签到等功能,是校园3.0时代的学生人手必备的活动凭证。它将传统校园学生“一人多证”的分类应用进行综合,实现“一证通用”的校园应用目标。就其概念本身而言,校园一卡通具有多证合一、数字身份、人机交互凭证等特征。


    校园一卡通可分为面向学生的学生卡、面向教职工的教工卡,以及面向短时间在校活动人员的临时卡。这三种卡,均采用实名身份认证的方式办理,以此作为个人校园活动的独立凭证,但如果校园卡过期或者办理假校园卡,在学校的活动行为都将受到限制。换言之,这本身就是校园一卡通存在之目的,方便管理与服务“开放且复杂”的校园系统。


    不同的校园时代,从“纸质挂牌”的校园卡(“一生多卡”)到“数字化机读”的校园卡,学生的校园身份认证方式的演变无不体现校园发展的历程,也与整个社会大环境紧密相关。那么,人工智能时代,在智慧校园的建设过程中,校园一卡通又将以怎样的面孔问世呢?


    2018年6月27日,北京师范大学官微发布消息称,学校将会在全部宿舍楼使用人脸识别门禁系统,意味着北京师范大学将会步入全面“刷脸”时代。这也意味着,作为国内顶尖师范院校,带头开展实施人工智能技术进校园的管理与应用,将开启“校园一卡通”应用的新时代,“校园一卡通”开始迈向“校园一脸通”。


    自“校园一卡通”向“校园一脸通”转型以来,其应用开始不断铺开。2018年7月27日,北京大学开始在西南门运行“校园一脸通”,在其门禁系统中,突破传统的人脸1∶1识别技术的弊端,采用1∶n实时人脸识别技术,有10万张照片底库的支持,每次学生进校,只需要一秒钟的时间,便能实现人脸特征精准匹配,从而通过校园门禁系统。


    2018年12月3日,广东省佛山市石门中学已全面启用人脸识别智能系统,学校正门、宿舍区大门都以“刷脸”的方式进出。该“刷脸”系统还将记录学生请假、迟到等考勤情况,佛山学校已迎来“刷脸”时代。可见,“刷脸”将成为未来智慧校园的新常态,学生不再为“卡片丢失、忘带、磨损、补卡、换卡、盗刷”等问题而烦恼。


    如今,随着智能人脸识别技术的不断完善,“校园一脸通”的应用开始普及,引起相关研究者的兴趣。“校园一脸通”是“校园一卡通”的升级版,它是基于物联网、大数据、云计算与人工智能等新一代信息技术的智能应用系统,其具体的应用系统包括：人脸识别门禁系统、人脸识别宿舍管理系统、人脸识别校园支付系统、人脸识别校园安全系统、人脸识别校园登记系统、人脸识别教师考勤系统、人脸识别图书馆系统、人脸识别班级管理系统等。“校园一脸通”的应用,对于智慧校园的智慧化进程具有重要的推动作用,从应用层面切实让师生体会到智慧校园的真实存在。


    人工智能识别技术的反应速度极快,使得智慧校园建设中的“校园一脸通”的建设与布局质量更好,办公效率更高。譬如,如果校园中出现陌生人,在传统的“校园一卡通”系统中,门禁系统是由人工值守,难免出现疲乏与困顿导致工作失误。但是,引入“校园一脸通”系统之后,校园的门禁系统为24小时在线,只要有陌生人拜访,可立即实现登记信息,整体上提升了智慧校园的安全级别。另外,人工智能识别技术可以随时抽查学生考勤情况、学习情况。譬如,教务人员要想了解一个学生的学习情况,他可以直接通过“校园一脸通”智能识别系统,了解学生去食堂吃饭的时间是否规律,了解学生去图书馆的次数,了解学生是否在指定的时间回到宿舍打卡等。这些都能从侧面反映出学生的学习情况,以及近期的行为习惯与活动范围。在这些数据的基础上,再结合学生的学习成绩,便能细致地分析出学生成绩出现异常波动的原因,以便采取相应的干预措施。


    从价值维度看,智能“校园一脸通”不仅利于增强校园的安保工作和智能识别学生的学习情况,还能便于学生入校登记。但是,凡事都有两面性。“校园一脸通”的正常运行,需要前期进行人脸数据采集与存储,然后基于数据库的数据比对。也就说,“校园一脸通”要想在一所学校正常运行,就不得不将全校师生的面部信息进行精准采集与存储,从而形成关于“校园一脸通”的大数据。因此,全校师生的隐私保护问题,成为校方最头疼的问题。因为这些数据关系到师生的人身安全与财产安全,如果被不法分子袭击了校园的数据库,或者是校园数据库本身的保密工作没做好,对师生而言,负面影响是巨大的。另外,“校园一脸通”人脸数据采集的信息具有局限性,在应对后期的师生服饰、发型、面部表情等因素的变化时,会出现识别误差,有时候会成为师生工作和学习的阻碍。


    因此,为应对“校园一脸通”系统带来的隐私保护问题与识别误差的问题,学校应该加强与服务外包方的合作交流,完善问题的问责机制,明确可能发生的危险漏洞,提前做好相关技术补救方案;应该对校园人脸数据库进行严格加密保存,引进“黑客”技术,阻断黑客可能入侵的渠道,并在各大入侵渠道上嵌入智能预警机制,在受到入侵时弹出预警提示,以便于校方及时关闭数据流动渠道,确保学校大数据的安全;最后,学校要培育和引进智能复合型人才,为智慧“校园一脸通”系统提供必要的人才基础。


    # 三、未来的教室：关于智慧课堂的构想


    ## (一) 教室与课堂的关系


    对于传统的教育,课堂成为大家最初的印象。《童年》这首歌是这样唱的：“黑板上老师的粉笔,还在拼命唧唧喳喳写个不停……总是要等到睡觉前,才知道功课只做了一点点,总是要等到考试以后,才知道该念的书都没有念……”。从歌词中,我们很快就能勾勒出一幅关于课堂的图景：老师讲解重要的知识点;一群孩子聚集成一个班级,正在奋笔疾书。在这幅图景中,教师、课堂、教室、教材与学生相辅相成,教室与课堂融为一体。因此,每当人们提及教室与课堂的关系时,都很困惑,很难将两者进行有效的区分。那么,教室与课堂究竟是何种关系呢?


    传统的教育,“教师”“教材”“课堂”构成教学的“三中心”,教师拿着一本教材在教室给学生授课,是传统课堂给予人们最直观的印象,这也是以前学生求学生涯的共同经历。这个时期,教室与课堂是共同存在的,大家对于两者的认识也只是共存于一个记忆之中,更有甚者,直接将两者等同起来,认为教室与课堂是同义词,都是指教师从事教育活动、学生从事学习活动的地方。但是,随着教育的发展,人们逐渐发现,课堂的存在并不仅限于教室,而是存在于具有教学活动的地方。所以,教室与课堂等同的观点遭到了质疑。


    对事物本质的认识,会在历史的演进中越来越真实,教室与课堂的辩证关系也是如此。人工智能时代,新兴技术的出现冲击了传统教室与课堂形态,人们逐渐认识到,其实教室与课堂都是教学活动的活动场所。由于在新兴技术出现之前,课堂基本都是发生在教室内,所以人们很难辨别两者之间的关系。


    智能时代,课堂与教室的概念也发生了变化。课堂与教室都是教学活动的场所,但前者的范围更广,不仅指教室的教学活动,还包括各种各样的师生互动、生生互动的活动等;课堂是物理属性与虚拟属性的结合物。教室是指专门用于开展教学活动的房间,是一个物理空间;教室只有在进行教学活动时,才与课堂之间才得以紧密结合。


    因此,从严格意义上讲,课堂是无处不在的,它是一个抽象的概念,只要想学习,任何时间、任何地点、任何场景都可以是课堂,而教室是人们真正能够看得见的物理场所。从起源上讲,课堂要早于教室的存在,等到专门的私塾教育和学校教育出现以后,教室才得以产生。从联系上看,教室与课堂结合最为紧密的时刻表现在班级授课形式的教学活动中。


    随着人工智能技术的发展,关于教室与课堂的论争再次出现。教室与课堂应该怎样结合的问题,成为新时代人们关注的问题。智能时代,人机交互技术日渐成熟,由智能技术催生的人工智能教育革命要求智慧校园的建设落实到学校的各个角落,教师的教学思维、学校的基础教育软硬件设施、学生的学习思维等都需要进行一次革新。教室作为智慧校园中教学活动的主要场所,对其进行智能化改造,将是智慧校园建设的重要任务。


    ## (二) 智慧课堂的建设与应用


    建设智慧校园,对教室等教学活动场所进行技术化改造,以及软硬件服务平台的升级换代,使智慧课堂得以出现。智慧课堂是指基于物联网、大数据、云计算和人工智能技术等新兴技术,促进教学活动场所与育人渠道的智慧化与智能化过程。从具体的课堂形态上看,还需要在相应的应用中寻找答案。譬如,山东省平度市在推出同步课堂(智慧课堂)项目时指出,在校园软硬件设施的支撑下,将进一步开展智慧课堂建设工作,专门针对课堂的软硬件设施、课程录制、远程互动等方面进行介绍与实操,点明了智慧课堂建设的三个维度,要求既要注重现实数据的记录,也要关注师生之间的互动渠道的畅通。就智慧校园建设而言,智慧课堂三个维度的主要实现场所还是要以智慧教室为核心场所。智慧教室如图8-2所示。


