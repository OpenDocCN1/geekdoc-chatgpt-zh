    **Footnotes**


    [1] See original book notes for references.


    [2] *2018 Global and China AI Industry Market Scale Forecast*.


    [3] *China AI Industry Market Outlook and Investment Strategic Planning Analysis
    Report*.


    [4] Eric Ashby, *The Four Educational Revolutions*.


