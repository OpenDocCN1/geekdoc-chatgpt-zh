    # Chapter Four Transcending Time and Space: New Ways of Educational Presence


    ## One, Freely Disposable Learning Time: Extending the Possibilities of Students''
    Free Development


    Time is the form of human existence. Marx believed: "Time is actually the positive
    existence of man; it is not only the measure of human life, but also the space
    for human development^[\[1\]](#txt004.html#footnote_content_txt004_1)." In other
    words, time is represented in two dimensions: the measure of life and the space
    for human development. Human history, present, and future will all be governed
    by time without exception; all human activities will be closely related to it;
    human work, study, and life will leave deep traces in the flow of time, thereby
    shaping a three-dimensional human image in the accumulation of history.


    Time has one-dimensionality and irreversibility. In past human impressions, flowing
    time is the unrepeatable repetition of "yesterday and today," and no one can rise
    above it. Therefore, facing time, humans have only two choices: race against time,
    or be "led by the nose" by time. Human educational and learning activities are
    no exception; they are all constrained by time. Without the existence of time,
    the possibility of development cannot be discussed.


    Time is an important element constituting learning activities. Effective use of
    learning time has a significant impact on learning outcomes. In traditional education,
    the center of education is the classroom, the teacher, and the textbook. Fixed
    class times, fixed teachers, fixed schedules, fixed exercise times, etc., mean
    students'' freedom is also fixed. In this way, every activity of the school reflects
    the closed characteristics of the educational model as a whole, making students
    a part of "fixity." Students have little free learning time and generally follow
    established study plans. In this state, students'' effective use of learning time
    is passive. Therefore, in the learning process, students are prone to wasting
    study time, low learning efficiency, improper time management, and short effective
    study time. But in the new intelligent era, these problems are being broken through
    and transcended.


    ### Retentivity of Learning Time Scale


    Intelligent era education possesses retentivity on the learning time scale. Retentivity
    on the learning time scale refers to the trace-keeping and datafication of the
    learning process, which can fill the gap in the field of learning data in traditional
    education. For example, when students study on video websites, they can give timely
    online feedback in the comment section below the video, or express their learning
    thoughts and opinions in the bullet comments (danmaku). All these data accumulated
    during the learning process can ultimately be historically restored and visually
    integrated through the application of AI data mining technology, achieving the
    sealing of learning time in its previous form. In the field of deep learning,
    "Long Short-Term Memory network technology" and "Deep Recursive Network technology"
    happen to effectively assist pattern recognition, allowing data information of
    different scales to flow on different time dimensions. This will provide necessary
    help for students'' later management of learning time. Even more, it can directly
    reflect students'' learning patterns or learning drawbacks, thereby assisting
    students in developing good study habits and improving their autonomous learning
    abilities.


    ### Aggregation of Learning Time Scale


    Aggregation on the learning time scale refers to the aggregation of multi-spatial
    learning activities occurring on the same frequency time scale. Relying on artificial
    neural network technology, it can promote the organic connection of ubiquitous
    learning activities in multiple spaces, realize the integration of scattered learning
    achievements in multi-dimensional time, and save students'' learning time overall.
    Theoretically, everyone''s learning time is the same. Within the same time range,
    if the learning activities of all learners are regarded as a giant network, then
    each person''s learning activity is only a time node. The collection of every
    time node in the learning space constitutes the learning time of all humanity.
    All learning achievements produced in this process are ultimately fed back to
    each time node in the form of intelligent sharing. Therefore, the aggregation
    of time lays the foundation for ideological resonance and conditions for sharing
    learning achievements for each student''s learning.


    From the perspective of learning results, since sharing is a prerequisite, if
    students want to achieve the goal of saving learning time, they must seek connection
    technologies for learning resources from the entire learning time stream. At this
    point, one must mention the online learning system based on AI technology. Multiple
    learners study simultaneously in this system. The platform-based aggregation of
    learning achievements and data modeling of knowledge graphs, the platform-based
    sharing of data and interactive communication of the learning process, can effectively
    use the advantage of the group to promote the realization of the goal of individuals
    quickly obtaining more comprehensive learning resources. This undoubtedly saves
    each student a lot of time and energy spent on finding learning resources. This
    is exactly as Marx pointed out: "The free development of each is the condition
    for the free development of all^[\[2\]](#txt004.html#footnote_content_txt004_2)."
    Only when a sufficient number of learners participate in the intelligent online
    learning system will the benefit to its users be high.


    AI-era education possesses retentivity and aggregation characteristics on the
    learning time scale. The existence of retentivity is based on the powerful storage
    and computing capabilities of intelligent technology in the educational field.
    It comprehensively and multi-dimensionally records and computes the interaction
    processes between teachers and students, students and websites, students and students,
    and students and intelligent machines. In traditional education, as students''
    learning time passes, time that could no longer be possessed can now be effectively
    converted into educational big data with the help of AI technology, thereby filling
    the gap in the "past tense" of student learning on the time axis.


    The existence of aggregation is based on the empowerment of intelligent technology
    on learning efficiency. In the conversion of intelligent machine advantages, it
    effectively integrates the work of teachers'' lesson preparation, teaching, evaluation,
    learning situation analysis, and teaching material collection; students'' learning,
    examination, review, and acquisition of extended materials; school management,
    school culture construction, and other aspects. With the continuous transfer of
    intelligent technology advantages into the educational field, people are transforming
    the "necessary trivial time" existing in traditional educational activities into
    "freely disposable learning time," providing more free time for "student-centered"
    learning activities.


    In AI-era education, both teachers'' "teaching" and students'' "learning" require
    time. With the help of AI technology, the gap in the "past tense" of educational
    activities on the time axis can be effectively filled, which is conducive to promoting
    the organic integration of "historical education, current education, and future
    education" on the time dimension. The empowerment of education by AI technology
    in efficiency is essentially a process of time control over specific educational
    activities and phenomena that have occurred. It is an intelligent choice from
    "trivial" to "necessary," and students'' active learning state is brewing within
    it. Students'' learning initiative and positivity will usher in change.


    At what moment will students truly feel the existence of time? Naturally, it is
    the moment when students realize the value of learning time. From the student''s
    perspective, free time means the space for free development, and the student''s
    development gains another possibility. Marx pointed out in *Economic Manuscripts
    (1857—1858)*: "Free time" refers to the time "that man can freely dispose of,"
    it is man''s "leisure time," the time "used for higher activities," the time "in
    which man can directly develop his various essential forces, the time ''for the
    full development of the individual''^[[3]](#txt004.html#footnote_content_txt004_3)."
    Today, with the help of intelligent technology, the easy access to learning resources,
    the improvement of learning efficiency, the mastery of learning patterns, and
    the revelation of learning drawbacks are all liberating students from the "veiled"
    learning space, returning more "time that can be directly used to develop one''s
    own essential forces" to students. Therefore, the existence of time can only give
    students the perception of its significance at the moment of loss, and only at
    the moment of freely acquiring time can students perceive its shaping value.


    In summary, in the AI era, there exists freely disposable learning time, which
    can extend the possibilities of students'' free development. For a student, the
    existence of freely disposable learning time is of extraordinary significance.
    The acquisition of free time can effectively promote the full development of students.
    The space for students'' ability development, spiritual development, and social
    relations will be extended until students thereby achieve free development.


    ## Two, Coexistence of Multi-dimensional Educational Spaces: Spatial Shift from
    "Separation" to "Aggregation"


    Space is a structural form composed of basic elements such as length, width, and
    height in a certain way. It is a physical quantity measuring the positional difference
    of things. "Size" and "virtuality/reality" are its direct manifestations. There
    are many types of space, including physical space, virtual space, ideological
    space, activity space, etc. Space is the realistic condition for human survival,
    the carrier of all human activities, and the application carrier of all human
    technologies. The separation of space will inevitably lead to the termination
    of human activities and applications in practice.


    Educational space refers to a structural form jointly composed of educational
    activities and educational phenomena. It is the practical combination of space
    and education. The intellectualization of educational space is the exploratory
    application of AI technology in educational space under the background of the
    intelligent era. Its application forms include three dimensions: understanding
    educational space, transforming educational space, and creating educational space.
    In the intelligent era, the purpose of AI technology empowering educational space
    is to realize the coexistence and integrated development of multi-dimensional
    educational spaces. The fusion of AI technology and space concepts gives birth
    to new space science, space technology, and space applications, jointly constituting
    the framework and blueprint of "technology + space," which has important significance
    for shaping intelligent educational spaces.


