    # Deep-seated Reasons for the Disconnection Between Social Knowledge Updates and
    Education


    Social knowledge updates rapidly, while the education system updates slowly, causing
    a disconnect between education and social development. This ultimately requires
    serious reflection from educators. From the perspective of educational development,
    it has always been a microcosm of social development and indeed has a certain
    lag in the time dimension, because education is constrained by the level of social
    productive forces and the socio-economic and political systems. Therefore, at
    its core, this disconnect in education is actually a manifestation in the educational
    environment of the "conflict between agricultural and industrial civilizations,
    and the conflict between industrial and intelligent civilizations." Its causes
    are extremely complex, encompassing issues of the relationship between theory
    and practice, harmony between humans and nature, and equality among humans.


    ## Limitations of School Education


    School education is always inseparable from the word "school." Compared to society,
    schools are more like ivory towers. The so-called concepts of "learning, knowing,
    and doing" are mostly only suitable for "schools." School education emphasizes
    knowledge education and theoretical education, but practical courses are scarce.
    This is a major reason for the disconnect between theory and practice in the educational
    environment. Students acquire knowledge, but how to apply knowledge contextually
    and how to innovate by combining acquired knowledge is a frequently overlooked
    issue. For example, many universities currently clearly suffer from the pain point
    of a disconnect between educational content and corporate talent needs, and between
    educational content and social talent needs. In particular, students who purely
    indulge in theoretical learning in school, due to a lack of social practice experience,
    find it difficult to adapt to social requirements after graduation.


    ## Imperfections in the Educational Curriculum System


    Furthermore, the current educational curriculum system is not yet sound. The "people-oriented"
    educational value concept advocated by traditional education focuses on cultivating
    students'' "IQ." As for students'' "EQ," it has not been well cultivated in schools.
    Naturally, the focus of school curricula is set around cultivating students''
    "IQ." Originally, in addition to courses such as "Politics, History, Geography,
    Physics, Chemistry, Biology, Chinese, Math, English," the educational curriculum
    should also include personality education, spiritual education, life meaning education,
    social skills education, family values education, marriage education, social relations
    education, ethical and moral education, and wealth concept education of "seeking
    wealth with principles and virtue." But the reality is not so. The existing curriculum
    system does not view students as a whole, as individuals with sound personalities,
    but rather as objects to be dissected and reformed.


    ## Challenges of Teacher Professionalism and Teaching Resources


    Regarding the "disconnect," we must also discuss teachers'' professional competence,
    the screening of teaching resources, and students'' learning abilities. The rapid
    development of science and technology gives rise to rapidly changing social demands,
    requiring students'' knowledge structures to be updated in strict accordance with
    social standards; this is the only way to help overcome the "disconnect" problem.
    But in fact, action is extremely difficult. In the intelligent era, many teachers
    are long separated from society outside the school; their own teaching thinking
    and content are easily restricted by the school environment. Confined by such
    limitations, these teachers naturally find it difficult to cultivate outstanding
    students. Comrade Deng Xiaoping once pointed out: "Whether a school can cultivate
    qualified talents for socialist construction, cultivate laborers with socialist
    consciousness and culture who are well-developed morally, intellectually, and
    physically, the key lies in the teachers^[\[4\]](#txt003.html#footnote_content_txt003_4)."
    The fact is exactly so; a good teacher can indeed produce good students. This
    is why the "four-have good teacher" (having ideals, moral integrity, solid knowledge,
    and a loving heart) is advocated today.


    In addition, in terms of educational resources, there are also great screening
    difficulties. The compilation of textbooks alone is extremely time-consuming and
    laborious. From compilation to publication, and then to revision and selection
    as teaching materials, a very long time is required. But during this period, much
    of the textbook content for many courses has already become outdated. Consequently,
    teachers need to spend a lot of time and energy in class correcting and searching
    for the latest relevant information.


    ## Erosion of Students'' Learning Abilities


    Finally, students'' learning abilities are eroded, making them unable to keep
    pace with the times. Especially when vast amounts of knowledge aggregate, factors
    such as uneven information quality, intersecting data, fragmented knowledge, disciplinary
    barriers, and the negative value of intelligent products greatly affect students''
    learning enthusiasm and initiative. Take smartphones as an example; the relationship
    between smartphones and students'' learning abilities is worthy of deep reflection.
    In the era of rapid intelligent technology development, smartphone functions are
    "dazzling and diverse," and students are deeply immersed in them, which has a
    significant impact on their learning. More importantly, when phones are associated
    with students, people actively associate them with "playing games" rather than
    learning. It can be seen that in the intelligent era, while intelligent elements
    embedded in educational activities bring convenience, they also consume students''
    learning energy and weaken their learning abilities, urgently requiring correct
    value guidance.


    If one day, the update speed of educational knowledge catches up with the pace
    of the times, and school education and social education are no longer seriously
    disconnected, what would society be like? What would students be like? Such a
    future is full of charm, constantly attracting us to explore the path of future
    education together in the new intelligent era.


    # Five, "The Needham Question" and "The Qian Xuesen Question": Rethinking Our
    Education


    In the 1930s, the famous British scholar Joseph Needham, while researching the
    history of Chinese science and technology, proposed the "Needham Question" in
    his monumental work *Science and Civilisation in China*. Once raised, the question
    sparked intense discussion worldwide. In 2005, Premier Wen Jiabao visited the
    famous scientist Qian Xuesen, who asked: "Why are our schools always unable to
    cultivate outstanding talents?" This question from Qian was termed the "Qian Xuesen
    Question," which also triggered widespread social debate.


    Whether it is the "Needham Question" or the "Qian Xuesen Question," although their
    perspectives differ, both involve issues of science and technology, education,
    and talent cultivation in China since modern times. The huge social resonance
    triggered by these questions stems, on the one hand, from the social influence
    of the two scholars, and on the other hand, because these two questions precisely
    hit the vital points of China''s science and technology, education, and talent
    cultivation. Therefore, it is only natural that they evoke strong resonance across
    society.


    A close examination of these two questions reveals that their cores both relate
    to the issue of talent scarcity. Tracing back to the essence, the most relevant
    field is still education. A century''s plan hinges on education; without good
    education, it is impossible to cultivate high-quality talents, and the country''s
    "hard power" and "soft power" will be affected. Talent is the primary resource;
    national development relies on talent, scientific and technological development
    relies on talent, economic and social development relies on talent, and talent
    cultivation relies on education. Therefore, the "Needham Question" essentially
    asks: "Why did no top-tier scientific and technological talents emerge in modern
    China?"


    Regarding the "Needham Question," Needham provided some answers in his voluminous
    *Science and Civilisation in China*, which can be roughly summarized into three
    points: First, Chinese society was an agricultural society, overly emphasizing
    experience and utility; Second, China lacked a worldview conducive to the growth
    of science; Third, the imperial examination system stifled the Chinese people''s
    strong interest in exploring the mysteries of nature.


    As for the "Qian Xuesen Question," although Qian did not give his own answer,
    his question remains in the hearts of the people nationwide. Countless people''s
    pursuit and answers to this question, the keen attention of numerous academic
    groups, and years of contemplation by national educators will all form part of
    the unique insights into this question.


    Currently, there are many research results in this area, and theoretical thinking
    is quite complete. But overall, people are still mainly standing on the ideal
    level. In the practical level, execution and action are insufficient. Criticism
    combined with practice is the only criticism considered more valuable.


    Ideals are beautiful, the future is bright, but the road is tortuous. For these
    two world-class problems—the "Needham Question" and the "Qian Xuesen Question"—what
    we expect is that in future education, these two questions will completely become
    history!


    ## Nobel Prize Data Reflecting the Current State of Education


    Returning to the field of education, the key to talent cultivation lies in education,
    and the basic focus of education is in schools. School education is the synonym
    for narrow-sense education, but it fundamentally reflects a country''s educational
    level. So, how high is the development level of our education? We can know the
    answer from a set of statistical data on Nobel Prize awards.


    According to statistics from the top 30 universities with the most Nobel laureates
    globally^[\[5\]](#txt003.html#footnote_content_txt003_5), Harvard University in
    the US has won a total of 158 Nobel Prizes, firmly ranking first in the world.
    The University of Cambridge in the UK has won 118, firmly ranking second. The
    third, fourth, and fifth places are the University of California, Berkeley (107),
    the University of Chicago (98), and Columbia University (96) in the US. From the
    ranking of the top 30 universities globally by Nobel laureates, universities in
    the US, UK, and Germany have scientific research strength and research levels
    at the world forefront (as shown in Table 3-1). Notably, according to the latest
    data from the Ministry of Education, as of June 15, 2019, the Ministry announced
    a total of 2,956 higher education institutions nationwide, but not a single university
    made the list.


    **Table 3-1 Top 30 Universities with the Most Nobel Laureates Globally (1901—2018,
    only top 30 shown)**


