    ## 三、追问意义：智能时代教育革命之目的


    正如马克思所言：“人类奋斗所争取的一切，都与他们的利益有关^([\[6\]](#txt001.html#footnote_content_txt001_6))。”在人工智能时代，人们致力于教育事业的改革创新，无疑也是与他们的利益息息相关。从人工智能赋能教育的方式来看，人们可能易于误解教育改革所要追求的仅仅是效率、成本和质量，这就大大错解了我们的初衷——误将教育所要服务的对象看作一件“商品”。


    需要强调的是，人工智能赋能教育，只是赋能教育事业的运作层面和管理层面，具体是在教学的过程中服务于教师，为学生提供优质的教学，促进学生的健康成长与全面发展——这才是智能时代教育改革之初衷与目标。该目标的实现，人工智能教育带来的价值，将关系学生和整个社会的未来。


    首先，促进学生“主体地位的回归”。人们一心推动教育事业的发展，目的就是要让学生在学习活动中“回归主体地位”，让培养社会主义的建设者和接班人成为学生和教师的共同发展目标。在人工智能时代，教师借助智能技术，能更高效地开拓新的课程，更好地回应学生的学习需求；学生借助人工智能技术，能更好地巩固自己的专业知识。说到底，与教育相关的一切目的，都将围绕促进学生的全面发展而展开，依据马克思关于人的全面发展理论，积极推动“五育并重”，培养全面发展的时代新人，是教育的时代使命。


    其次，突出教师的使命与意义。教育，要坚信每个学生都身怀绝技、天赋异禀，也要坚信每个教师都是铸造灵魂的工程师。“用生命影响生命，用生命塑造生命，用生命引导生命，”教育注定能够给教育对象带来与众不同的人生。唯有如此，国家的集体荣誉感、民族复兴的使命感、繁荣富强的责任感才能深入学生心中，嵌入学生骨髓与灵魂。教育改革，它需要成为实现社会价值与个人价值的桥梁和纽带，它需要服务于国家、社会和个人的蜕变与发展。


    再次，利于个人价值与社会价值的实现。社会是由个人构成的社会，在每个人的身上，都肩负着使命与荣光，我们都应该成为独立自强的奋斗者和国家繁荣复兴的奉献者，“我们都是追梦人”。教育的质的规定性要求我们，必须要明确“教育为谁培养人”“培养什么样的人”以及“怎样培养人”的问题。教育的重大意义不在于教育本身，而在于它是否真正发挥好“立德树人，铸人铸魂”的功能与效用。


    最后，办好人民满意的教育。百年大计，教育为本，要办好人民满意的教育，教育必须摆在优先发展的位置。国家要坚定不移走教育创新之路，各级有关部门要积极开展教育创新的实践活动，坚持走“从实践来到实践中去”的路子。在教育改革的路上，始终坚持党的领导，进一步提高对教育改革的思想认识，积极深入群众、深入教育对象群体中去做好教育工作，扎实推进教育改革走进民心、走向学生、走向未来。


    智能时代教育革命之目的，是要突出教育在促进“人的全面发展”的过程中的价值与意义。从人工智能赋能教育的优势中汲取智慧，将智能元素浇筑于人类教育的全过程，让教育具备特定的智慧和能力，促使教育革命的发生。届时，教育生态系统与教育结构的优化重组，智能时代教育革命之目的的兑现，其价值是显而易见的——它有利于学生主体地位的回归、个人价值与社会价值的实现、突出教师的使命与意义，总体上能够促进教育的健康快速发展。总之，人工智能技术与教育的交叉融合，便于国家更好地办好人民满意的教育。


    ## 四、教育革命：本书的目的、内容与结构


    魏源在其《海国图志·叙》中指出：“是书何以作？曰：‘为以夷攻夷而作，为以夷款夷而作，为师夷长技以制夷而作。’”那么，我们在编写本书之前，也在思考同样的问题，“本书何以作？”曰：“本书为教育目的而作，为教育对象而作，为每个教育活动的参与者找寻自我而作！”


    在人工智能时代大背景下，探讨教育的改革与创新，希冀借助于人工智能技术手段，找到一条通向未来的教育之路。


    本书对人工智能时代教育的主要方面，如智能教育的概念和特征、传统教育的弊端、教育方式、教育管理、教育的在场方式、教师角色、教师教学能力培养、三创教育、通才教育、素质教育、智慧校园、教育的未来发展趋势等方面，进行了初步研究和人文反思，探讨了在人工智能时代的教育场景中，教育者、教育中介、受教育者等要素的技术化形态。本书结构如图1-3所示。


    ![](images/txt001_3.jpg "pagenumber_ebook=21,pagenumber_book=11")


    图1-3 本书结构图


    受人工智能影响后的教育，其“变与不变”的区别与联系，是我们着重思考人工智能教育的起点。教育的变，变在方式、方法、管理与评价等方面。但是最根本的、本质的东西，却是永远不变的，教育的本质，无论加入什么技术元素，它还是要为“培养社会需要的人才”服务，为促进人的全面发展服务。


    本书在写作的大方向上，关注技术发展，尤其是互联网、大数据和人工智能技术对教育的影响，特别是强调具有时代性的教育变革。教育要更加符合时代发展的要求，要更加响应明天和未来。人工智能时代的教育，始终是围绕教育的“三个面向”而进行的，人工智能教育也必将实现“面向现代化、面向世界和面向未来”。


    本书还将与广大读者一起感受——改变是社会的常态，教育就在我们身边，我们需要用新的教育理念、新的教育习惯、新的教育方式和新的教育者角色在智能时代站位。“处处皆可教，处处都可学”是人工智能教育的显著特征。很显然，这是“传统教育”所不具备的。


    人工智能对教育的影响，是“全方位、多层次、宽领域”的革命性影响，它所要变革的是整个传统教育领域。人工智能赋能教育，对“传统”的颠覆与重构是驱使传统教育走向未来教育的实践基础，它让教育的整个生态系统的“骨骼”与“血液”得以更换，让教育者、教育对象与教育介体的角色与地位得以“按需回归”。


    在智能时代，人工智能技术的突飞猛进，使人工智能与教育融合发展的未来充满无限可能性。人工智能赋能教育，在无限可能性中寻找某种确定的未来，是教育领域的一场革命性的变革和一次完美的跳跃。无论是在教育的思维层面还是理念层面，抑或是在实践操作层面，具有科学性、前瞻性和可操作性的研究都具有重要价值。本书作为一本“软学术”著作，希冀与读者一起分享智能时代教育革命的曙光，完成这次通向教育未来的“跳跃”之旅。


