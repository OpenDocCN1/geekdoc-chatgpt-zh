- raw: '教育要跟得上科学技术发展的步伐。教育的发展形态,在科学技术的影响下存在演变的可能,智能教育技术的诞生,便是科学技术在教育领域演变的结果。就课堂而言,“粉笔”与“黑板”是传统课堂的知识展示媒介,但智能技术的出现,这种知识展示媒介逐渐远离了学生,取而代之的是一种新的知识展示媒介。譬如,新媒体课件、投影仪、大数据人工智能平台、微信公众号等,不仅适应学生的生活环境,还能在技术层面进行学习过程的数据化记录和可视化分析。科学技术的发展,很大程度上改变了学生知识获取的媒介和方式,改变了学生学习过程的审美感与体验感。教育的发展,势必要跟上已被新兴技术塑造的这种新型社会形态。


    教育要跟得上社会文化发展的步伐。如今,人工智能技术正在从根本上改变社会文化的生产、传播与价值变现的过程,智能元素在社会文化环境中的价值逐渐提升。教育相较于社会文化而言,其本身也是一种文化的生产、传播与筛选的工具,希望通过创新教育的方式,推动每个社会成员的自由灵魂都能在更大的文化框架内得到表达。现实生活中,每个人发现生活意义的方式都与此人生活于其中的文化环境密切相关^([\[3\]](#txt007.html#footnote_content_txt007_3))。那么,既然人们已经生活在一个智能文化空间中,教育能为发展该种社会文化提供人才,为传播社会文化提供渠道,为创新社会文化提供方法论。教育的发展,要能在社会文化的结构系统中找到重合点。


    社会的发展反推经济、技术与文化的发展,也对教育提出新的发展要求。因此,人工智能时代的教育需要形成什么样的教育格局才能满足智能时代的社会发展要求,这是一个值得深思的问题。


    为了能够满足社会发展对教育提出的要求,教育系统本身的属性应该是一个开放且包容的教育体系(如图7-1所示)。在这个教育系统中,应当包括各种形态的教育,如网络课堂、职业教育、基础教育、高等教育、社会职业培训、学前教育、家庭教育、学校教育、社会教育、全纳教育等,最终形成一个形态多样、结构多元、教育方式多维的人工智能教育巨系统,以期从广域的教育领域回应社会总体需求。同时,为了能够实现教育为未来生活做准备,如今的教育还应该着眼于“通才教育”领域,积极借助人工智能技术,开展人工智能时代的新文科教育与新工科教育,在立足于现实生活的前提下,超前布局未来人才市场。


    ![](images/txt007_1.jpg "pagenumber_ebook=101,pagenumber_book=91")


    图7-1 开放且包容的教育体系


    开放且包容的教育体系,本身就包含着教育者对分科式、专业式教育模式的反思,它并不排斥现存的这种分科教育,但是对此进行反思的结果值得人们思考。因为在通才教育到来之前,对文理分科教育的缺陷的探讨,相关的成果定能在通才教育体系的构建中发挥现实的作用与价值。


    二、制度审思：文理分科教育的局限


    文理分科是指从高一进入高二时,制度性地将“语数英、政史地、物化生”的综合性学科,统一分为文科(语数英、政史地)和理科(语数英、物化生),学生可根据自身基础和兴趣爱好,选择其中的一科进行继续学习。高中阶段的文理分科对于求学之人而言,仿佛是整个人生的分水岭,不同的选择代表了不同的思维方式、学习方式和今后的生活方式,从一开始就选择文科的人,很少再有机会与理科搭上很深的关系。当然,选择理科的学生若在高考后想转学文科,相比较而言,要比文科生转学理科容易些。这应该是与两种学科之间存在的藩篱有很大关系。


    正是两科之间藩篱的存在,加之两种选择最后接触到的教育资源也是天差地别,社会开始思考这种“藩篱”与“差异”的存在,是否会转变为文科生与理科生之间的价值“藩篱”与“差异”,这是站在教育的宏观角度作出的理性思考,确实值得深思。


    近几年,呼吁取消高中文理分科,进而实施通才教育的改革措施引发社会广泛热议。概括起来,对热议的态度总体可分为两种：一种认为需要“分”,另一种认为需要“合”。既然观点不统一,那就说明文理分科教学“利弊共存”,或者说它在某段时间确实发生着不可替代的作用。当社会的不同呼声逐渐增强时,又反映出该种制度弊端也逐渐明显。


    从历史视野上看,我国的文理分科教育模式是源于苏联(1991年前)教育模式。这种教育模式有一个优势,就是能够在较短的时间内迅速培养出从事各行各业的专门人才。换言之,分科教育模式很适合为社会的工业化大生产提供专门服务,这与当时的苏联和中国国情都很贴近。


    但历经几十年的工业化发展,同样是工业领域,人们也开始追逐“智能制造”“无人工厂”这样的深度科技化生产方式,社会对人才的要求,已经从单个领域的专门人才转向多学科融合的复合型人才。社会对人才需求的变化,自然会迅速通过市场机制反馈到教育系统中,所以才引发了全社会都在关注的问题：文理到底应不应该分科?


    要想回答这个问题,难免需要关注文理科的“分”与“合”的利与弊。前文对于分科的优势已经论述过,归结起来主要为两点：第一,它可以短时间培养更多的专门人才,并迅速投身于国家的工业化建设中去创造价值;第二,学生可以根据自己的兴趣爱好进行选择性学习,能够减轻学生的学习负担,体现教育制度的人性化。


    然而,对于长期从事教育工作的人来说,可能并不这样认为,因为该制度本身确实存在一些弊端。它制度性地直接将人的发展进行了二元划分,并且在文理分科完成之后,各科的学生都将出现知识根基不稳的问题。1948年,建筑大师梁思成专门对文理分科的教学模式进行了一次演讲——《半个人时代》,他在演讲中强调,科技和人文的分离,必然会导致出现两种畸形人——只懂技术而灵魂苍白的空心人和不懂科技而喜谈人文的边缘人。为此,他在现场呼吁大家,需要共同致力于走出“半个人时代”^([\[4\]](#txt007.html#footnote_content_txt007_4))。


    此外,从学生的长远发展来看,文理分科的教育价值取向存在的主要问题是不能有效促进学生的全面发展。文理分科教育的出现,是源于教育的功利主义倾向。教育知识选择被功利熏染,越来越朝功利主义方向发展。人们对待教育知识,总是希望它时时处处与今后的生活和职业挂钩,而往往忽视了教育知识促进人的精神和人格发展的价值^([\[5\]](#txt007.html#footnote_content_txt007_5))。


    可见,文理分科确实引人深思,特别是近期很多大学开始走新工科与新文科发展之路后,分科教育走向综合教育的社会倾向更为明显。总而言之,当下的分科教育应该是国家的某种发展形态在教育上的呈现,分科教育只是一种过渡形式,应该要随着国家和社会的发展而作出相应的调整。当分科教育开始违背教育宗旨、教育目的与教育规律时,不符合教育促进人的全面发展的要求时,这种调整就更有必要。对于“文理到底应不应该分科”的问题,人们心中自然有了答案——通才教育,走文理大综合的教育路线,新文科教育与新工科教育孕育而生。


    任何新事物的诞生,都不是简单的“偶然因素作用的结果”,其中不乏必然性的支配。新工科教育的诞生,便是社会发展的必然性支配力量在教育体系中的现身。新工科教育与新文科教育共同构成了通才教育的两个方面,分别从两个不同的视野环顾通才教育的全局性问题,为培养通用人才、复合型人才开拓新路径。“广博”与“专精”是培养通用人才的两大标准,必须要齐头并进,共同发展,通用型人才方可塑成。


    三、新工科教育：人工智能赋能新工科教育


    人工智能时代,经济全球化、政治多极化、文化多样化趋势明显。兼具工具性与价值性的人工智能技术,已成为各国在全球高端领域竞争的核心竞争力,超前布局人工智能战略,是大势所趋。随着人工智能第三次浪潮滚滚袭来,人工智能与实体经济的融合程度不断加深,关于人工智能的应用以及问题解决方案更是炙手可热,人工智能在各领域的价值开始从“冰山一角”的粗糙运用,逐渐过渡到“水面以下”的整个价值体系的结构性赋能,“人工智能+”的应用进入社会常态化阶段。


    为主动适应全球化发展趋势、全球化的竞争环境、国家的新发展战略,专门用于支撑理论创新与产业技术变革的新工科教育进入公众视野。随着新兴技术的崛起,新产业、新经济、新社会、新生活由远及近,正在抵达人们生活的此岸,一股技术化浪潮正席卷社会各个角落,各种产业模式的发展,都在呼唤新时代的人才,呼唤具有交叉学科背景的复合型新工科人才。为此,工科人才的培养就要走一条变革之路,一条有别于传统工科教育的新路。


    新工科教育,顾名思义,就是在传统工科教育基础上的新一轮创新型教育,是一种工科教育的新理念、新结构、新模式、新实践。


    相较于传统工科教育,新工科教育的“新”,主要体现在“需求、课程与方法之新”上。在一定的时间跨度中,“传统”与“新”没有绝对的区别与联系。所谓的“新”,是相较于“传统”基础上的时代性呈现。从社会需求层面来讲,能够适应社会发展需求的教育就可谓之“新教育”。所以,新工科教育的“新”需要从传统工科教育的缺陷说起。换言之,就是传统工科教育所培养的人才数量和质量,与社会发展需求之间存在供需矛盾。根据《光明日报》报道,到2020年,我国新一代信息技术产业、电力装备、高档数控机床和机器人、新材料将成为人才缺口最大的几个专业,其中新一代信息技术产业人才缺口将会达到750万人。到2025年,新一代信息技术产业人才缺口将达到950万人,电力装备的人才缺口也将达到900多万人^([\[6\]](#txt007.html#footnote_content_txt007_6))。


    高质量人才的缺乏,对于经济社会的飞速发展而言,存在着潜在人才危机。纵观整个教育系统,传统工科人才培养的规模并未压缩,且在经济持续发展的当代,其规模仍然有扩张趋势,教育系统产出的工科人才并未减少。但是,为何新一代信息技术产业的人才缺口会持续扩大?这是源于新兴产业的发展,社会对人才培养的规格提出了新要求,传统工科教育产出的人才不能有效适应现实需要。随着新兴技术的不断发展,物联网、大数据、云计算、人工智能、数字孪生、5G网络等技术迅速走向应用与实践阶段,与之相关的新兴产业领域,对人才的需求出现重大变化,需要兼具社会前沿领域的技术背景和时代价值观两方面的条件,才能更好地满足就业岗位的需要,满足就业单位对人才的特殊要求。


    教育是最好的投资,但通常情况下,就业单位不会为人才成长的长期过程买单,他们只关注教育的结果,即人才的成型价值。所以,新技术催生的新产业,在人才市场的拉动作用下,人才的匮乏迅速引起教育系统的响应,为新产业培养新人才成为新工科教育与传统工科教育相区别的重要方面。


    新工科教育的“新”,还体现在教育课程的新。新工科教育,在继承传统工科教育优势的基础上,开设了与社会发展相适应的新一代课程体系。2018年,教育部办公厅发布《关于公布首批“新工科”研究与实践项目的通知(教高厅函〔2018〕17号)》指出,要加快形成一批可推广、可复制的改革成果,在新兴工科的课程体系、新形态教材和教学内容、在线开放课程、工程教育师资队伍和实践基地等方面实现突破^([\[7\]](#txt007.html#footnote_content_txt007_7));并在《通知》中进一步公示来自全国高校的612个新工科研究项目,涉及的改革类课程范围具体如表7-1所示。前五项课程改革集中在大数据和人工智能技术领域,与之相关的独立课程应运而生,如数据科学与数据技术、物联网工程、机器人工程、智能科学与技术、智能电网信息工程、光电信息科学与工程、大数据与人工智能、软件工程、人工智能等专业课程。


    表7-1 新工科课程改革体系涉及范围


    ![](images/txt007_2.jpg "pagenumber_ebook=106,pagenumber_book=96")


    与教育部新工科课程改革与实践相呼应,地方高等院校的课程体系开始驻足新领域,大数据、人工智能、虚拟现实、云计算等专业纷纷进入大学。截至目前,全国已有40余所大学开设人工智能学院。仅在2019年上半年,就有北京大学、中国人民大学、西安交通大学、东南大学等在学校内开设人工智能学院。预计在2025年前后,大数据人工智能学院与专业的开设将迅速扩及全国各级各类学校,受益学生呈现全面覆盖的特征。


    2019年10月下旬,全球第一所人工智能大学——穆罕默德·本·扎耶德人工智能大学(MBZUAI)在阿联酋阿布扎比宣布成立,旨在“为人工智能领域引入学术和研究的新模式,向学生和教师提供全球最先进的人工智能系统,释放人工智能在促进经济和社会发展方面的潜能。”从人工智能学院,到人工智能研究院,再到人工智能大学,关于人工智能的课程开发,已经实现了较为全面的覆盖。


    新工科教育的“新”,还将体现在教育方法上的“新”。大数据和人工智能时代,新工科教育与大数据人工智能技术将“难舍难分”,智能化、人文化、协同化、多元化与个性化教育将成为新工科教育的基本特征。


    大数据人工智能技术将进一步渗透整个新工科教育体系,新工科教育的各大专业课程将在大数据人工智能技术的支撑下,更加凸显个性化教育的价值。基于数据的人工智能教育算法模型的构建,新工科教育对象的知识、行为和情感等方面都能得到个性化表达。基于学生、教师与学校的透明化与数据化,教育的方式方法逐渐发生变化,从传统的填鸭式、灌输式教学走向个性化、启发式和参与式教学,最终实现新工科教育领域的人本主义教育方法论的大转换,在方法论上实现新工科价值与人文价值的统一。


    “人工智能+”的应用进入社会常态化阶段,引发传统工科教育的变革,一系列工科教育新特征显现,新工科教育走在教育发展的前沿。人工智能技术的渗透力量如此之大,对工科教育的价值较为突出,人们开始探寻人工智能教育在新工科教育领域的应用与解决方案,进一步推进智能元素与新工科教育的融合。


    2016年,教育部将新工科建设提上日程。2017年被称为人工智能应用元年,人工智能的应用与新工科建设同生共长,两者之间的融合有章可循。应用,是指适应需要,以提供使用的意思。人工智能应用,是指人工智能技术适应社会发展需要,以技术本身供社会各领域使用。在人工智能时代,人工智能应用与新工科教育的融合,主要是把人工智能技术融入新工科教育全过程,实现新工科教育的现代化发展。


    面向学生的个性化学习。人工智能技术运用于新工科教育,有利于通过人工智能系统平台,构建面向学生的个性化学习系统,结合新工科教育的特征与教育规律,针对学生开展个性化教学。以学生个人学习过程中累积的数据为基础,构建专属于特定学生的学习模型,在智能模型的帮助下,学生的学习盲区能够得到迅速填补,学习误区能够得到迅速矫正,学生情感能够得到迅速识别,学习的需求能够得到及时有效的个性化反馈,学习方案的制定与学习资源的获取都将呈现为个性化。人工智能技术融入新工科教育,推动新工科教育个性化的实现,有利于学生借助新工科的跨学科学习系统,突破学科藩篱带来的学习困境,在启发式、参与式的个性化学习系统中,培养出具备“12种思维能力^([\[8\]](#txt007.html#footnote_content_txt007_8))”的新工科人才。


    面向教师的精准化教学。教师精准化教学的实现,需要对接新工科教育对象的需求,两者实现精准衔接。随着人工智能技术应用于新工科教育领域的逐渐深入,兼具语音识别、视觉识别、自然语言处理与深度学习能力的人工智能教育系统,能够及时有效地考察学生的学习情况,即智能化的学情分析。能够以学生的学习大数据为基础,迅速识别学生的学习特征、学习方法、学习效果、学习兴趣、学习成绩,并在此基础上进行学情模型建构,在学生学习模型泛化的过程中,能够有效地洞察学生学习过程中存在的症结。譬如,学生在工业设计、增材制造、虚拟现实理论等方面存在知识漏洞,系统便会输出关于此知识漏洞的学情数据,指导教师改进教学方案或方法,并为有特殊需求的学生提供个性化教学。


    面向学校的科学化管理。学校管理的科学化,是人工智能技术在新工科教育领域的重要应用,它将有效提高学校管理效率和管理质量,促进整个学校管理体系的服务转型升级。运用人工智能识别技术,积极挖掘学校管理领域的大数据,可视化与透明化管理系统的物理属性,形成“用数据说话、用数据决策、用数据管理、用数据创新”的学校教育管理系统格局,促进学校安全管理、教学管理、资源管理、评价管理等方面的科学化、制度化与常态化。突破传统院系利益格局,鼓励各院系之间的融合,推进新工科办学资源的共享和分配合理化;考核机制突破传统评价模式,鼓励教师跨专业融合,促进对未知科技的探索,突破传统管理机制,促进跨部门跨院系的协同发展,促进跨专业选课与个性化培养计划的实现^([\[9\]](#txt007.html#footnote_content_txt007_9))。


    四、新文科教育：人工智能赋能新文科教育


    文科教育是人文科学和社会科学教育的总称,与自然科学的教育存在较大差距。长期以来,相较于工科教育,文科教育都处于较为弱势的地位,“重文轻武”的文科黄金时代,已稍显没落;“学好数理化,走遍天下都不怕”,成为理工科学生最顺口的“口头禅”,从侧面反映了文科的没落与边缘化。


    文科教育的边缘化,是目前学校教育中的一种特殊现象,与学生就业、社会人才需求以及本身科目的难易程度相关。传统的工科教育,奉行的是学习“一技之长”的发展之路,学生毕业后,可以依靠自己的专业技能获得一份稳定的工作,且他们的就业与择业的选择面相对较广。因为在一个传统工业与新型技术产业的交替发展的社会,人才需求也较为偏向于引进工科人才,再加上工科教育更加强调逻辑思维和抽象思维,大部分倾向于感性思维的学生,自然地走向文科的怀抱。经比较研究,世界顶级的学术期刊,绝大多数都是工科教育的期刊(如《PANS》《Cell》《Nature》《Science》等),关于文科的世界级期刊少之又少,这对于文科学生而言,科研成果的影响力和影响范围势必会受到限制。


    虽然如此,文科教育仍然是不能忽视的,因为人文社科的衰落也意味着工科教育的残缺。武汉大学人文社科资深教授马费成解释说：“从总体上看,各门类学科甚至整个科学都是在高度分化的同时,不断走向综合。”文科与工科教育的发展,虽然在前期走向了两条差异巨大的路,但按照马费成教授的说法,分化的程度越深,也就说明其发展的水平越高,两个科目的异向发展,实则是在从更广泛的领域走向教育的大综合。因此,文科的落后,只能算作是教育发展的阶段性“异象”,其后来的演变应该从新文科教育说起。


    2017年10月,在美国希拉姆学院,新文科的教育理念首次被提出。学者指出：新文科是指相对于传统文科进行学科重组文理交叉,即把新技术融入哲学、文学、语言等诸如此类的课程中,为学生提供综合性的跨学科学习^([\[10\]](#txt007.html#footnote_content_txt007_10))。随着新文科教育理念的普及,国内的教育研究部门首先注意到这个新的教育现象。国家在全面振兴本科教育的社会大背景下,专门针对文科的未来发展,将新文科教育理念引入国内。'
  fmt: '

    # 人工智能时代的教育变革与通才教育探索


    ## 一、教育发展需跟上时代步伐


    ### 教育要跟得上科学技术发展的步伐


    教育的发展形态，在科学技术的影响下存在演变的可能，智能教育技术的诞生，便是科学技术在教育领域演变的结果。就课堂而言，“粉笔”与“黑板”是传统课堂的知识展示媒介，但智能技术的出现，使这种知识展示媒介逐渐远离了学生，取而代之的是一种新的知识展示媒介。譬如，新媒体课件、投影仪、大数据人工智能平台、微信公众号等，不仅适应学生的生活环境，还能在技术层面进行学习过程的数据化记录和可视化分析。科学技术的发展，很大程度上改变了学生知识获取的媒介和方式，改变了学生学习过程的审美感与体验感。教育的发展，势必要跟上已被新兴技术塑造的这种新型社会形态。


    ### 教育要跟得上社会文化发展的步伐


    如今，人工智能技术正在从根本上改变社会文化的生产、传播与价值变现的过程，智能元素在社会文化环境中的价值逐渐提升。教育相较于社会文化而言，其本身也是一种文化的生产、传播与筛选的工具，希望通过创新教育的方式，推动每个社会成员的自由灵魂都能在更大的文化框架内得到表达。现实生活中，每个人发现生活意义的方式都与此人生活于其中的文化环境密切相关^([\[3\]](#txt007.html#footnote_content_txt007_3))。那么，既然人们已经生活在一个智能文化空间中，教育能为发展该种社会文化提供人才，为传播社会文化提供渠道，为创新社会文化提供方法论。教育的发展，要能在社会文化的结构系统中找到重合点。


    ### 社会发展对教育提出新要求


    社会的发展反推经济、技术与文化的发展，也对教育提出新的发展要求。因此，人工智能时代的教育需要形成什么样的教育格局才能满足智能时代的社会发展要求，这是一个值得深思的问题。


    ## 开放且包容的教育体系


    为了能够满足社会发展对教育提出的要求，教育系统本身的属性应该是一个开放且包容的教育体系（如图7-1所示）。在这个教育系统中，应当包括各种形态的教育，如网络课堂、职业教育、基础教育、高等教育、社会职业培训、学前教育、家庭教育、学校教育、社会教育、全纳教育等，最终形成一个形态多样、结构多元、教育方式多维的人工智能教育巨系统，以期从广域的教育领域回应社会总体需求。同时，为了能够实现教育为未来生活做准备，如今的教育还应该着眼于“通才教育”领域，积极借助人工智能技术，开展人工智能时代的新文科教育与新工科教育，在立足于现实生活的前提下，超前布局未来人才市场。


    ![](images/txt007_1.jpg "pagenumber_ebook=101,pagenumber_book=91")


    **图7-1 开放且包容的教育体系**


    开放且包容的教育体系，本身就包含着教育者对分科式、专业式教育模式的反思，它并不排斥现存的这种分科教育，但是对此进行反思的结果值得人们思考。因为在通才教育到来之前，对文理分科教育的缺陷的探讨，相关的成果定能在通才教育体系的构建中发挥现实的作用与价值。


    ## 二、制度审思：文理分科教育的局限


    文理分科是指从高一进入高二时，制度性地将“语数英、政史地、物化生”的综合性学科，统一分为文科（语数英、政史地）和理科（语数英、物化生），学生可根据自身基础和兴趣爱好，选择其中的一科进行继续学习。高中阶段的文理分科对于求学之人而言，仿佛是整个人生的分水岭，不同的选择代表了不同的思维方式、学习方式和今后的生活方式，从一开始就选择文科的人，很少再有机会与理科搭上很深的关系。当然，选择理科的学生若在高考后想转学文科，相比较而言，要比文科生转学理科容易些。这应该是与两种学科之间存在的藩篱有很大关系。


    正是两科之间藩篱的存在，加之两种选择最后接触到的教育资源也是天差地别，社会开始思考这种“藩篱”与“差异”的存在，是否会转变为文科生与理科生之间的价值“藩篱”与“差异”，这是站在教育的宏观角度作出的理性思考，确实值得深思。


    ### 文理分科改革的社会热议


    近几年，呼吁取消高中文理分科，进而实施通才教育的改革措施引发社会广泛热议。概括起来，对热议的态度总体可分为两种：一种认为需要“分”，另一种认为需要“合”。既然观点不统一，那就说明文理分科教学“利弊共存”，或者说它在某段时间确实发生着不可替代的作用。当社会的不同呼声逐渐增强时，又反映出该种制度弊端也逐渐明显。


    ### 文理分科教育的历史渊源与优势


    从历史视野上看，我国的文理分科教育模式是源于苏联（1991年前）教育模式。这种教育模式有一个优势，就是能够在较短的时间内迅速培养出从事各行各业的专门人才。换言之，分科教育模式很适合为社会的工业化大生产提供专门服务，这与当时的苏联和中国国情都很贴近。


    但历经几十年的工业化发展，同样是工业领域，人们也开始追逐“智能制造”“无人工厂”这样的深度科技化生产方式，社会对人才的要求，已经从单个领域的专门人才转向多学科融合的复合型人才。社会对人才需求的变化，自然会迅速通过市场机制反馈到教育系统中，所以才引发了全社会都在关注的问题：文理到底应不应该分科？


    ### 文理分科的利与弊分析


    要想回答这个问题，难免需要关注文理科的“分”与“合”的利与弊。前文对于分科的优势已经论述过，归结起来主要为两点：第一，它可以短时间培养更多的专门人才，并迅速投身于国家的工业化建设中去创造价值；第二，学生可以根据自己的兴趣爱好进行选择性学习，能够减轻学生的学习负担，体现教育制度的人性化。


    然而，对于长期从事教育工作的人来说，可能并不这样认为，因为该制度本身确实存在一些弊端。它制度性地直接将人的发展进行了二元划分，并且在文理分科完成之后，各科的学生都将出现知识根基不稳的问题。1948年，建筑大师梁思成专门对文理分科的教学模式进行了一次演讲——《半个人时代》，他在演讲中强调，科技和人文的分离，必然会导致出现两种畸形人——只懂技术而灵魂苍白的空心人和不懂科技而喜谈人文的边缘人。为此，他在现场呼吁大家，需要共同致力于走出“半个人时代”^([\[4\]](#txt007.html#footnote_content_txt007_4))。


    此外，从学生的长远发展来看，文理分科的教育价值取向存在的主要问题是不能有效促进学生的全面发展。文理分科教育的出现，是源于教育的功利主义倾向。教育知识选择被功利熏染，越来越朝功利主义方向发展。人们对待教育知识，总是希望它时时处处与今后的生活和职业挂钩，而往往忽视了教育知识促进人的精神和人格发展的价值^([\[5\]](#txt007.html#footnote_content_txt007_5))。


    ### 走向通才教育的必然趋势


    可见，文理分科确实引人深思，特别是近期很多大学开始走新工科与新文科发展之路后，分科教育走向综合教育的社会倾向更为明显。总而言之，当下的分科教育应该是国家的某种发展形态在教育上的呈现，分科教育只是一种过渡形式，应该要随着国家和社会的发展而作出相应的调整。当分科教育开始违背教育宗旨、教育目的与教育规律时，不符合教育促进人的全面发展的要求时，这种调整就更有必要。对于“文理到底应不应该分科”的问题，人们心中自然有了答案——通才教育，走文理大综合的教育路线，新文科教育与新工科教育孕育而生。


    任何新事物的诞生，都不是简单的“偶然因素作用的结果”，其中不乏必然性的支配。新工科教育的诞生，便是社会发展的必然性支配力量在教育体系中的现身。新工科教育与新文科教育共同构成了通才教育的两个方面，分别从两个不同的视野环顾通才教育的全局性问题，为培养通用人才、复合型人才开拓新路径。“广博”与“专精”是培养通用人才的两大标准，必须要齐头并进，共同发展，通用型人才方可塑成。


    ## 三、新工科教育：人工智能赋能新工科教育


    ### 时代背景与战略需求


    人工智能时代，经济全球化、政治多极化、文化多样化趋势明显。兼具工具性与价值性的人工智能技术，已成为各国在全球高端领域竞争的核心竞争力，超前布局人工智能战略，是大势所趋。随着人工智能第三次浪潮滚滚袭来，人工智能与实体经济的融合程度不断加深，关于人工智能的应用以及问题解决方案更是炙手可热，人工智能在各领域的价值开始从“冰山一角”的粗糙运用，逐渐过渡到“水面以下”的整个价值体系的结构性赋能，“人工智能+”的应用进入社会常态化阶段。


    为主动适应全球化发展趋势、全球化的竞争环境、国家的新发展战略，专门用于支撑理论创新与产业技术变革的新工科教育进入公众视野。随着新兴技术的崛起，新产业、新经济、新社会、新生活由远及近，正在抵达人们生活的此岸，一股技术化浪潮正席卷社会各个角落，各种产业模式的发展，都在呼唤新时代的人才，呼唤具有交叉学科背景的复合型新工科人才。为此，工科人才的培养就要走一条变革之路，一条有别于传统工科教育的新路。


    ### 新工科教育的内涵与特征


    新工科教育，顾名思义，就是在传统工科教育基础上的新一轮创新型教育，是一种工科教育的新理念、新结构、新模式、新实践。


    相较于传统工科教育，新工科教育的“新”，主要体现在“需求、课程与方法之新”上。在一定的时间跨度中，“传统”与“新”没有绝对的区别与联系。所谓的“新”，是相较于“传统”基础上的时代性呈现。从社会需求层面来讲，能够适应社会发展需求的教育就可谓之“新教育”。所以，新工科教育的“新”需要从传统工科教育的缺陷说起。换言之，就是传统工科教育所培养的人才数量和质量，与社会发展需求之间存在供需矛盾。根据《光明日报》报道，到2020年，我国新一代信息技术产业、电力装备、高档数控机床和机器人、新材料将成为人才缺口最大的几个专业，其中新一代信息技术产业人才缺口将会达到750万人。到2025年，新一代信息技术产业人才缺口将达到950万人，电力装备的人才缺口也将达到900多万人^([\[6\]](#txt007.html#footnote_content_txt007_6))。


    高质量人才的缺乏，对于经济社会的飞速发展而言，存在着潜在人才危机。纵观整个教育系统，传统工科人才培养的规模并未压缩，且在经济持续发展的当代，其规模仍然有扩张趋势，教育系统产出的工科人才并未减少。但是，为何新一代信息技术产业的人才缺口会持续扩大？这是源于新兴产业的发展，社会对人才培养的规格提出了新要求，传统工科教育产出的人才不能有效适应现实需要。随着新兴技术的不断发展，物联网、大数据、云计算、人工智能、数字孪生、5G网络等技术迅速走向应用与实践阶段，与之相关的新兴产业领域，对人才的需求出现重大变化，需要兼具社会前沿领域的技术背景和时代价值观两方面的条件，才能更好地满足就业岗位的需要，满足就业单位对人才的特殊要求。


    教育是最好的投资，但通常情况下，就业单位不会为人才成长的长期过程买单，他们只关注教育的结果，即人才的成型价值。所以，新技术催生的新产业，在人才市场的拉动作用下，人才的匮乏迅速引起教育系统的响应，为新产业培养新人才成为新工科教育与传统工科教育相区别的重要方面。


    ### 课程体系的创新


    新工科教育的“新”，还体现在教育课程的新。新工科教育，在继承传统工科教育优势的基础上，开设了与社会发展相适应的新一代课程体系。2018年，教育部办公厅发布《关于公布首批“新工科”研究与实践项目的通知(教高厅函〔2018〕17号)》指出，要加快形成一批可推广、可复制的改革成果，在新兴工科的课程体系、新形态教材和教学内容、在线开放课程、工程教育师资队伍和实践基地等方面实现突破^([\[7\]](#txt007.html#footnote_content_txt007_7))；并在《通知》中进一步公示来自全国高校的612个新工科研究项目，涉及的改革类课程范围具体如表7-1所示。前五项课程改革集中在大数据和人工智能技术领域，与之相关的独立课程应运而生，如数据科学与数据技术、物联网工程、机器人工程、智能科学与技术、智能电网信息工程、光电信息科学与工程、大数据与人工智能、软件工程、人工智能等专业课程。


    **表7-1 新工科课程改革体系涉及范围**


    ![](images/txt007_2.jpg "pagenumber_ebook=106,pagenumber_book=96")


    与教育部新工科课程改革与实践相呼应，地方高等院校的课程体系开始驻足新领域，大数据、人工智能、虚拟现实、云计算等专业纷纷进入大学。截至目前，全国已有40余所大学开设人工智能学院。仅在2019年上半年，就有北京大学、中国人民大学、西安交通大学、东南大学等在学校内开设人工智能学院。预计在2025年前后，大数据人工智能学院与专业的开设将迅速扩及全国各级各类学校，受益学生呈现全面覆盖的特征。


    2019年10月下旬，全球第一所人工智能大学——穆罕默德·本·扎耶德人工智能大学（MBZUAI）在阿联酋阿布扎比宣布成立，旨在“为人工智能领域引入学术和研究的新模式，向学生和教师提供全球最先进的人工智能系统，释放人工智能在促进经济和社会发展方面的潜能。”从人工智能学院，到人工智能研究院，再到人工智能大学，关于人工智能的课程开发，已经实现了较为全面的覆盖。


    ### 教育方法的变革


    新工科教育的“新”，还将体现在教育方法上的“新”。大数据和人工智能时代，新工科教育与大数据人工智能技术将“难舍难分”，智能化、人文化、协同化、多元化与个性化教育将成为新工科教育的基本特征。


    大数据人工智能技术将进一步渗透整个新工科教育体系，新工科教育的各大专业课程将在大数据人工智能技术的支撑下，更加凸显个性化教育的价值。基于数据的人工智能教育算法模型的构建，新工科教育对象的知识、行为和情感等方面都能得到个性化表达。基于学生、教师与学校的透明化与数据化，教育的方式方法逐渐发生变化，从传统的填鸭式、灌输式教学走向个性化、启发式和参与式教学，最终实现新工科教育领域的人本主义教育方法论的大转换，在方法论上实现新工科价值与人文价值的统一。


    “人工智能+”的应用进入社会常态化阶段，引发传统工科教育的变革，一系列工科教育新特征显现，新工科教育走在教育发展的前沿。人工智能技术的渗透力量如此之大，对工科教育的价值较为突出，人们开始探寻人工智能教育在新工科教育领域的应用与解决方案，进一步推进智能元素与新工科教育的融合。


    2016年，教育部将新工科建设提上日程。2017年被称为人工智能应用元年，人工智能的应用与新工科建设同生共长，两者之间的融合有章可循。应用，是指适应需要，以提供使用的意思。人工智能应用，是指人工智能技术适应社会发展需要，以技术本身供社会各领域使用。在人工智能时代，人工智能应用与新工科教育的融合，主要是把人工智能技术融入新工科教育全过程，实现新工科教育的现代化发展。


    #### 面向学生的个性化学习


    人工智能技术运用于新工科教育，有利于通过人工智能系统平台，构建面向学生的个性化学习系统，结合新工科教育的特征与教育规律，针对学生开展个性化教学。以学生个人学习过程中累积的数据为基础，构建专属于特定学生的学习模型，在智能模型的帮助下，学生的学习盲区能够得到迅速填补，学习误区能够得到迅速矫正，学生情感能够得到迅速识别，学习的需求能够得到及时有效的个性化反馈，学习方案的制定与学习资源的获取都将呈现为个性化。人工智能技术融入新工科教育，推动新工科教育个性化的实现，有利于学生借助新工科的跨学科学习系统，突破学科藩篱带来的学习困境，在启发式、参与式的个性化学习系统中，培养出具备“12种思维能力”^([\[8\]](#txt007.html#footnote_content_txt007_8))的新工科人才。


    #### 面向教师的精准化教学


    教师精准化教学的实现，需要对接新工科教育对象的需求，两者实现精准衔接。随着人工智能技术应用于新工科教育领域的逐渐深入，兼具语音识别、视觉识别、自然语言处理与深度学习能力的人工智能教育系统，能够及时有效地考察学生的学习情况，即智能化的学情分析。能够以学生的学习大数据为基础，迅速识别学生的学习特征、学习方法、学习效果、学习兴趣、学习成绩，并在此基础上进行学情模型建构，在学生学习模型泛化的过程中，能够有效地洞察学生学习过程中存在的症结。譬如，学生在工业设计、增材制造、虚拟现实理论等方面存在知识漏洞，系统便会输出关于此知识漏洞的学情数据，指导教师改进教学方案或方法，并为有特殊需求的学生提供个性化教学。


    #### 面向学校的科学化管理


    学校管理的科学化，是人工智能技术在新工科教育领域的重要应用，它将有效提高学校管理效率和管理质量，促进整个学校管理体系的服务转型升级。运用人工智能识别技术，积极挖掘学校管理领域的大数据，可视化与透明化管理系统的物理属性，形成“用数据说话、用数据决策、用数据管理、用数据创新”的学校教育管理系统格局，促进学校安全管理、教学管理、资源管理、评价管理等方面的科学化、制度化与常态化。突破传统院系利益格局，鼓励各院系之间的融合，推进新工科办学资源的共享和分配合理化；考核机制突破传统评价模式，鼓励教师跨专业融合，促进对未知科技的探索，突破传统管理机制，促进跨部门跨院系的协同发展，促进跨专业选课与个性化培养计划的实现^([\[9\]](#txt007.html#footnote_content_txt007_9))。


    ## 四、新文科教育：人工智能赋能新文科教育


    文科教育是人文科学和社会科学教育的总称，与自然科学的教育存在较大差距。长期以来，相较于工科教育，文科教育都处于较为弱势的地位，“重文轻武”的文科黄金时代，已稍显没落；“学好数理化，走遍天下都不怕”，成为理工科学生最顺口的“口头禅”，从侧面反映了文科的没落与边缘化。


    ### 文科教育边缘化的成因


    文科教育的边缘化，是目前学校教育中的一种特殊现象，与学生就业、社会人才需求以及本身科目的难易程度相关。传统的工科教育，奉行的是学习“一技之长”的发展之路，学生毕业后，可以依靠自己的专业技能获得一份稳定的工作，且他们的就业与择业的选择面相对较广。因为在一个传统工业与新型技术产业的交替发展的社会，人才需求也较为偏向于引进工科人才，再加上工科教育更加强调逻辑思维和抽象思维，大部分倾向于感性思维的学生，自然地走向文科的怀抱。经比较研究，世界顶级的学术期刊，绝大多数都是工科教育的期刊（如《PANS》《Cell》《Nature》《Science》等），关于文科的世界级期刊少之又少，这对于文科学生而言，科研成果的影响力和影响范围势必会受到限制。


    ### 文科教育的不可或缺性与新文科教育的萌芽


    虽然如此，文科教育仍然是不能忽视的，因为人文社科的衰落也意味着工科教育的残缺。武汉大学人文社科资深教授马费成解释说：“从总体上看，各门类学科甚至整个科学都是在高度分化的同时，不断走向综合。”文科与工科教育的发展，虽然在前期走向了两条差异巨大的路，但按照马费成教授的说法，分化的程度越深，也就说明其发展的水平越高，两个科目的异向发展，实则是在从更广泛的领域走向教育的大综合。因此，文科的落后，只能算作是教育发展的阶段性“异象”，其后来的演变应该从新文科教育说起。


    2017年10月，在美国希拉姆学院，新文科的教育理念首次被提出。学者指出：新文科是指相对于传统文科进行学科重组文理交叉，即把新技术融入哲学、文学、语言等诸如此类的课程中，为学生提供综合性的跨学科学习^([\[10\]](#txt007.html#footnote_content_txt007_10))。随着新文科教育理念的普及，国内的教育研究部门首先注意到这个新的教育现象。国家在全面振兴本科教育的社会大背景下，专门针对文科的未来发展，将新文科教育理念引入国内。

