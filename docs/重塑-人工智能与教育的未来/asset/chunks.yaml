- raw: "从PISA教育理念中,反映出两个值得关注的点：一是教育与未来生活的关系,二是PISA素养的培养。PISA教育中所提出的素养,就是要通过特定的方式引导学生形成“不断生成中的恒定能力”,以便于学生能够更好地应对多变的生活。其实,PISA教育与未来生活的关系,本质上反映的是人工智能时代的人们对未来生活的期许,以及从这种期许中延伸出来的现实准备,隐含着教育者与教育对象的不断思考和实践价值,包括他们应该如何提前做好未来生活准备的问题。\n\
    \n未来生活,与今天有很大的不同之处。随着人工智能技术的不断发展,它与人类生活的融合越来越紧密。具体的未来生活细节现在无法猜测,但唯一可以肯定的是,在未来生活中,人们将彻底地解放自己的双手,在家有机器人管家(包揽洗衣做饭等杂活),在工作岗位上有机器工人,出行有无人驾驶……应有尽有。这听起来有些科幻色彩,但这确实就在不远的将来。届时,人类将彻底进入深度智能革命时代,社会生产力将迅速飞升,人类的工作时间将大大缩短,并且与现在相比,未来的工作生活都是充满着奇幻色彩的,因为人们可以随意选择一个自己喜欢的地方,坐下来就可以开始工作。\n\
    \n自然而然,你便会问,这样的时代,人们应该做什么?这个问题不难回答,那就是驱动人工智能机器去帮助你实现你的梦想。人工智能时代,教育要为未来生活做好准备,务必掌握这种驱动力,暂且命名为“机器驱动能力”。要具备这种能力,要求学生要提前做好准备,要在未来生活到来之前就要做好准备,而不是等未来生活到来之时才做准备。否则,难免会面临被社会淘汰的风险。\n\
    \n因此,未来生活到来之前,在今天的大数据和人工智能技术的支撑下,掌握提升自己的机器驱动能力,将成为学生的主要学习方向。围绕这个方向,进行系列的配套训练与创造思维活动,在实践中拉近与智能机器之间的距离,是非常有必要的尝试。在如今,这种为未来生活做准备的教育,应该是可视化的教育,应该是在VR、AR、MR技术的帮助下实现未来情景呈现的教育,学生的过去、现在以及未来,将在人机融合中走向统一。未来教育,成就学生一生的教育,迎来终身教育从理念兴起到实践落实的崭新时代。\n\
    \n四、不忘初心：教育促进人的全面发展\n\n人类智能是人工智能的基础,人类智能的发展对于人工智能的发展具有决定性作用。弱人工智能阶段,人工智能是人类智能的模仿、延伸与增强,这一性质决定了它的“从属”地位,也间接地反映了人工智能的被动属性,只有在人类智能高度发展的时代,人工智能的发展才能达到新的高度。人工智能的“三起两落”正说明了这一点。\n\
    \n人工智能的发展,源于技术的糅合与交融,从而在一个较为立体的层面(不是在一个单维度的层面),系统地再现人类智能。然而,当人工智能在完成模仿、延伸与增强的工作之后,它相较于人类智能,就完全从人类智能的母体中分离出去,成为独立的人工智能个体,具备了人工智能的相对独立性。\n\
    \n人工智能的发展,它的相对独立性触发人类本体意识的觉醒。人工智能的发展,在历史上存在三大流派,分别是模仿人类神经传导的联结主义、模仿人类逻辑语言的符号主义和模仿人类行为模式的行为主义。不同的流派模仿的对象有别,但都是在以不同的方式模仿着人类本身的复杂形态,以及人类的生命本质。\n\
    \n模仿的范式进化,经历了从简单到复杂、从单一到系统的过程。人工智能对人类智能的模仿,只是其发展的基本阶段;而延伸和增强阶段,却是人工智能开始宣告独立的开始。届时,引发人类智能与人工智能的冲突,俗称人机冲突。人类为了解决人机矛盾,寻求过几种消解办法,一是无政府主义,任其发展;二是技术恐怖主义,严格限制其发展;三是科学控制主义,趋利避害。显然,第三种消解办法暗含着人类本身的妥协与包容,凸显人类智能与人工智能的相辅相成关系。\n\
    \n人类智能与人工智能的相辅相成关系,意味着在两者之间存在着“共进退”的属性。如今,人工智能对于人类智能的模仿、延伸与增强已达到很高的层次,特别是在行为模仿层面,模仿较为成熟。总的来说,到目前为止,由阿尔法狗引发的人机关系的再思考,大规模的“机器换人”战略的实施引发的“技术性失业”的焦虑等,都反映了人工智能机器已开始反向督促人类自身的发展问题,并在智能发展的过程中给人类的发展规定了严格的发展秩序。人类只有全面发展,才能更好地面对未来的人机共生社会中的生存、生活与发展的问题。\n\
    \n因此,人工智能的高度发展,直接或间接地倒逼人类的发展。严格意义上来说,是促进人的全面发展。因为“不动脑、不动情”的领域,人工智能已远超人类智能,而且由于人类受到客观条件的限制,在这个领域永远不可能超越人工智能。所以,“人的全面发展”成为人工智能时代人的发展的主攻方向,也是人工智能教育的核心目的。\n\
    \n“人的全面发展”,是指人的“德、智、体、美、劳”的完整发展。人工智能时代,有别于工业时代和信息时代,人们强调的全面发展,重心已经从“智育”转变为“五育并举”。这个重大的转向,主要源于人机冲突中的人类意识的觉醒。从古代的“本体论”到近代的“认识论”,再到现、当代的“存在论”的发展历程,就是由于人的自我意识的不断觉醒、个体意识不断提高而导致思维方式不断变化的结果^([\\\
    [6\\]](#txt011.html#footnote_content_txt011_6))。人工智能时代的教育要促进人的全面发展亦是如此。\n\n物联网、大数据与人工智能技术的相互糅合,塑造了人类历史上迄今为止出现过的最为卓越的时代,也引发了技术思维与人本价值的矛盾冲突。技术思维的胜出,是整个人类遭受灾难的危险时刻。历史的惨痛教训,让智能时代的人们明白,人工智能技术的发展,需要大力弘扬人本价值,力争促进技术思维与人本价值的协同与有机统一,才能促进人的本体地位的时代性回归,才能使人走向存在主义的“人学立场”,人的全面价值才能受到社会的广泛关注。这就是说,是人,而不是技术,必须成为价值的最终根源;是人的最优发展,而不是生产的最大化,成为所有计划的标准^([\\\
    [7\\]](#txt011.html#footnote_content_txt011_7))。\n\n考察人工智能时代的人的全面发展,存在两个分析维度：一是技术维度,二是物质资料维度。技术恐怖主义者认为,人工智能的发展,只会给人类带来毁灭性的灾难——技术性失业、机器换人、单维度的人、无用阶级等,不一而足。不难看出,他们一致看到的仅是人工智能技术对人类的冲击,也仅看到人工智能时代的技术维度,而没有看到物质资料维度。人工智能时代的物质资料的生产,正在进入一个全新的生产时代,由智能机器代替人类而进行的精准化工业生产模式,人类赖以生存的物质资料得到极大的满足,人类进入智能生产过剩的经济时代,人类对自然与物质的依赖程度降到历史最低。\n\
    \n马克思指出,“人的依赖关系(起初完全是自然发生的),是最初的社会形式。在这种形式下,人的生产能力只是在狭小的范围内和孤立的地点上发展着。以物的依赖性为基础的人的独立性,是第二大形式。在这种形式下,才形成普遍的社会物质变换、全面的关系、多方面的需要以及全面的能力体系。建立在个人全面发展和他们共同的、社会的生产能力成为从属于他们的社会财富这一基础上的自由个性,是第三个阶段。第二个阶段为第三个阶段创造条件。^([\\\
    [8\\]](#txt011.html#footnote_content_txt011_8))”按照马克思的说法,人工智能时代的智能机器大生产模式,充盈的物质资料已经为“以物的依赖性为基础的人的独立性”创造了条件,“第二个阶段”已经为“第三个阶段”创造条件。在这个需要全面的能力体系作为支撑的社会维度,人们不再只是“为生存而战”,而是将更多的时间消费在“为发展而战”之中,从而直接为人的全面发展提供了可能。\n\
    \n共同体的全面发展,为人工智能时代个人的全面发展提供手段。2015年,习近平总书记在亚洲博鳌论坛上提出推动建设“人类命运共同体”的思想,深得世界各国赞许与支持。在这一思想的指引下,一个人的命运、一个社会的命运、一个国家的命运、一个民族的命运,都紧紧地与全人类的命运联系在一起,成为一个不可分割的“命运共同体”。由此可见,人工智能时代的教育,在促进人的全面发展的过程中,还得益于人类命运共同体提供必要的思想指引。马克思指出,“只有在共同体中,个人才能获得全面发展其才能的手段,也就是说,只有在共同体中才可能有个人自由。^([\\\
    [9\\]](#txt011.html#footnote_content_txt011_9))”换言之,就是马克思所说的“每个人的自由发展是一切人的自由发展的条件。^([\\\
    [10\\]](#txt011.html#footnote_content_txt011_10))”\n\n人工智能时代的教育,得益于技术维度与物质维度的多元价值,为教育对象的发展提供了必要的发展条件、发展时空和发展手段,人的全面发展的道路已“天堑变通路”,人的本体论价值与存在主义人学立场,正在所有人的全面发展中得到实现。人工智能时代的教育,促进人的全面的发展的目的,源于人工智能的相对独立性带来的人类整体意识觉醒,并在共同体的全面发展中实现了个人的全面发展。\n\
