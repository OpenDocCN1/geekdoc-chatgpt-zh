    ## Personalization


    Personalization is the most important characteristic of AI education; it highlights
    the educational value of AI education in the practical operational phase. In the
    AI era, intelligent data mining, data analysis, data classification and aggregation,
    construction of data knowledge graphs, student data profiling, teacher AI assistants,
    virtual schools, and hidden curricula are all "specialties" of AI technology.
    AI education, through the application of AI platforms, effectively captures learners''
    learning record data, including learning habits, thinking patterns, subject preferences,
    knowledge structures, emotional tendencies, economic conditions, and other data
    (as shown in Figure 2-1), covering the learning preparation stage, learning process
    stage, and learning outcome stage. Finally, coupled with the entire historical
    learning data on the horizontal time axis, the learner''s personal learning situation
    will become transparent and visible under the support of intelligent visualization
    technology, promoting the formation and continuous improvement of the learner''s
    personal learning knowledge graph.


    ![](img/txt002_1.jpg "pagenumber_ebook=29,pagenumber_book=19")


    Figure 2-1 Learner Data Knowledge Graph


    The personalized characteristic of AI education is highly beneficial for enhancing
    learners'' learning enthusiasm and initiative; for teachers, it facilitates personalized
    teaching and refined teaching program design; for school administrators, it facilitates
    precise student management. The personalization of AI education relates to the
    construction of personalized learning for individual learners and the lifelong
    education system.


    ### 3. Humanization


    In the AI era, the humanistic characteristic of education is significant. Education
    has always been an activity of shaping people, a purposeful activity of cultivating
    people. The object of education is a living individual; therefore, no matter the
    era, education cannot depart from humanistic development. However, comparatively
    speaking, the humanistic characteristic of education in the AI era is more prominent.


    AI education, with the help of a series of intelligent technologies, liberates
    teachers from complex and repetitive teaching activities. Knowledge-based instruction
    in intellectual education can be handed over to the AI education system to complete.
    Teachers will have more time and energy to engage in "EQ" teaching work, enhance
    emotional resonance with students, thereby facilitating the formation of good
    teacher-student relationships, and facilitating the serious implementation of
    educational concepts such as understanding, respect, support, sincerity, sympathy,
    resonance, and personalization.


    Liberating teachers from complex and repetitive teaching activities will place
    greater emphasis on "emotional investment" in education, moving people with emotion,
    so that students feel warmth and regard the learning space as their "home," thus
    forming a "family-style" organization that is warm and where everyone "loves the
    home" and "serves the home." In such a space, in such an atmosphere, students
    are more likely to accept the teacher''s education^([\[8\]](#txt002.html#footnote_content_txt002_8)).
    Education in the AI era tends toward participation and socialization in the educational
    activity process, which helps improve relationships among students and enhance
    emotional exchange and value interaction among them.


    ### 4. Collaboration


    Due to factors such as information barriers, data divides, interest disputes,
    and rights conflicts, the traditional "siloed" development model of education
    is more common. Communication between education departments and across departments
    is difficult, seriously hindering the development process of education. However,
    the birth of AI education has made a targeted transcendence of the drawbacks of
    traditional education, and based on AI technology, integrates real education and
    virtual education into an organic "macro-education" system. Education managers,
    teaching implementers, and education objects shuttle flexibly within it, featuring
    a high degree of collaboration.


    The collaboration of AI education manifests as the synergistic development of
    the trinity of "education management, education decision-making, and education
    teaching"; it manifests as the synergistic development linking "individuals, families,
    schools, and society"; and it also manifests as a collaborative intelligent education
    innovation platform integrating "government, industry, academia, research, and
    application." In summary, the collaboration of AI education fundamentally manifests
    as human-machine collaboration; human-machine collaboration is the core characteristic
    of AI education.


    ### 5. Boundlessness


    AI education is a multi-spatial ubiquitous education model, possessing both inclusivity
    and openness. In the intelligent education environment, the boundaries of education
    have broken through the campus "walls," moving toward an open education time-space
    of "society as school" and "life as education." Due to the development of intelligent
    space technology, information space gradually becomes curriculum space and teaching
    space, while physical space gradually becomes activity space and practice space.
    The entire process of educational teaching activities has broken through the limitations
    of time and space, moving toward a boundless existence transcending time and space;
    education is everywhere and always present.


    ## III. The Value Chain of AI Education: An Increasingly Value-Added Closed Loop


    AI education is the result of AI empowering education at the technical, thinking,
    and structural levels. Viewed from the overall attributes of AI education, the
    characteristics of intelligence, personalization, humanization, collaboration,
    and boundlessness are significant. Viewed from the value attributes of AI education,
    the social value and individual value embedded in the concepts and characteristics
    of AI education constitute two aspects of the same whole, reflecting the general
    direction of AI education adapting to social development and individual development.


    When discussing the value of AI education, it is necessary to first understand
    its meaning. The value of AI education refers to the function and significance
    of its existence measured by the yardstick of people or society. In other words,
    it is the benefit relationship of AI education to human needs. Usually speaking,
    people''s pursuit of the value of AI education is actually the pursuit of their
    own value, and the entire process of AI education is actually a process of increasingly
    value-added^([\[9\]](#txt002.html#footnote_content_txt002_9)). This "value-added"
    process is precisely the process of the value chain of AI education gradually
    closing the loop.


    The value chain of AI education (as shown in Figure 2-2) covers the total value
    and partial values of AI education. Total value is also called macro value, referring
    to the value of AI education at the entire social level. It is not limited to
    the description of a specific region but is a total value consideration for the
    entire education service object. It concerns both the empowerment of education
    links and the improvement of education quality, as well as the promotion of educational
    equity and the improvement of the overall quality of the nation. Partial value
    is also called micro value, which can be divided according to a specific sequence
    into value for students, value for teachers, and value for schools.


    ![](img/txt002_2.jpg "pagenumber_ebook=31,pagenumber_book=21")


    Figure 2-2 Closed Loop of AI Education Value


    The transition of AI education value from partial value to total value is the
    result of value deepening and social extension triggered by the transfer of overall
    AI technical advantages to education sub-fields. Therefore, the exploration and
    truth-seeking of AI education value need to go through a process from micro to
    macro.


    ### (I) Micro Value of AI Education


    The micro value of AI education includes value for students, value for teachers,
    value for families, and value for schools.


    #### 1. Value of AI Education for Students


    The value of AI education for students is nurtured within its personalized characteristics.
    The key to the personalized characteristics of AI education is the specialized
    data profiling and visualized presentation of knowledge graphs for individual
    students. AI education modeling based on data is based on real-time analysis and
    dynamic monitoring of students'' dynamic data, which can effectively, timely,
    and rapidly perceive and feedback students'' personalized needs, including knowledge
    needs, emotional needs, and ability needs. The AI education system will also recommend
    personalized learning tasks, cultivate personalized learning methods, and formulate
    personalized learning plans based on students'' needs data. The content will organically
    cover the comprehensive cultivation of students'' operational skills and intelligent
    skills, specifically including skills and wisdom in moral, intellectual, physical,
    aesthetic, and labor education.


    In the intelligent era of knowledge explosion, for individual students, what is
    most lacking is the ability to actively construct knowledge and the ability to
    learn creatively. The emergence of AI education will greatly reduce the pressure
    on individual students to master knowledge, while also facilitating students to
    use more free time to learn how to develop themselves, and more conducive to students
    developing into composite talents to better adapt to the needs of intelligent
    social development in the future.


    #### 2. Value of AI Education for Teachers


    With the continuous development of AI technology, the "genetic effect" of powerful
    tech genes has blossomed everywhere in the education field and borne fruitful
    results. The value of AI education for teachers is manifested in the genetic inheritance
    of AI technical advantages, bringing huge changes to teacher roles, authority,
    and work content. Especially in the field of teachers'' work, in traditional education,
    teachers'' work is complex and repetitive work occupies a large amount of teachers''
    trivial time. Although exhausted, they have no choice but to do it. However, the
    education revolution in the AI era has changed the previous work model. Nowadays,
    teachers'' lesson preparation, teaching, homework grading, learning situation
    analysis, personalized program formulation, and teaching resource mining can all
    be handed over to the AI education system for one-click easy resolution. Teachers
    will have more time and energy to devote to value judgment, emotional guidance,
    and ideological leadership.


    For teachers, AI education not only liberates them to a certain extent but also
    gives them more free space for flexible handling in teaching vision and teaching
    methods, allowing the core value of teachers to be exerted. In the AI era, the
    development of intelligent education makes most of the educational work existing
    in traditional education gradually replaced by AI, but this replacement is not
    in the complete sense; rather, it replaces teachers from the complex work of knowledge
    imparting.


    For hundreds of years, teachers'' responsibilities have been "teaching" and "educating"
    simultaneously. However, teachers are also flesh and blood, and they also get
    exhausted. Practice has proved that in traditional education, the vast majority
    of teachers'' teaching time is consumed by "teaching," while the true value of
    "educating" has been divided up by "scores" and "indicators." Therefore, in the
    past, teachers'' educational value has not been fully exerted; even if exerted,
    it could only face a very small number of students.


    The development of AI education has enabled the "educating" value orientation
    of teachers to be gradually realized in the rapidly developing intelligent technology.
    The arrival of AI education, the existence of AI expert systems, AI teachers,
    and AI education robots, although giving human teachers a certain professional
    impact and challenge, this impact is not harmful; on the contrary, it is AI reminding
    people in a new way that contemporary education should change the previous educational
    form, should return to the essence of education, and should put the educational
    value of "educating people" first.


    The essence of education is to cultivate people, to cultivate people who meet
    the needs of social development and personal development. In the AI era, the work
    of "educating people" has finally returned to the hands of teachers, and is no
    longer like before, taking the social punishment system as the ultimate means
    of education.


    The educational value of teachers in the AI era mainly takes guiding students
    to realize life value as the judgment standard, and promoting student growth and
    living out individuality as the main theme of education. In the process of education,
    teachers can use intelligent technology tools to discover students'' traits, adopt
    targeted educational methods, help students explore their own advantages and values,
    liberate students'' personalities, and let every student "become an adult through
    learning" in "teaching according to aptitude."


    When teachers turn in educational value, the educational content facing students
    also undergoes huge changes, beginning to transform from the traditional "imparting
    knowledge" to cultivating students'' structural thinking ability, innovative thinking
    ability, critical thinking ability, collaboration ability, ability to discover
    and appreciate beauty, and ability to apply theory to practice, etc. By cultivating
    students'' series of abilities, enhance students'' comprehensive ability to discover,
    analyze, and solve problems. At that time, students will be able to think independently,
    quickly acquire knowledge, perceive emotions, construct new cognition, transfer
    and apply knowledge in various complex environments, thereby becoming a "well-rounded
    person in moral, intellectual, physical, aesthetic, and labor aspects," a "complete
    person" in the strict sense.


    From the current stage of AI education development, the intelligence level of
    AI education is still relatively low, insufficient to support AI teachers completely
    replacing human teachers in the field of "teaching," but rather serving as assistants
    initially. Therefore, the value of AI education for teachers is also reflected
    in helping human teachers achieve precise teaching by intelligently analyzing
    learning situations and students'' personalized data.


    AI education can also help human teachers improve their overall scientific research
    level. In the era of big data and AI, the accumulation of data provides the necessary
    premise for empirical research, thereby triggering a new round of research boom
    in the education field, further promoting the dual combination of quantitative
    assessment and qualitative analysis in the field of educational research, effectively
    helping human teachers mine more valuable data information. Today, the selection
    of excellent teachers has begun to favor teachers who can use AI, and even more
    so those who are proficient in using AI.


    #### 3. Value of AI Education for Families


    From the family perspective, education in the AI era has its most important value
    embodied in the value of "companionship." Since the post-90s generation was born,
    the pace of the entire social life environment has become very fast. The time
    for parents and children to get along and accompany each other has significantly
    decreased. Children in the process of growth eagerly expect companionship from
    parents, but due to objective condition constraints, or after children enter school,
    the connection and companionship between them become less and less. This dilemma
    eventually evolves into the problem of missing family education.


    However, since mankind entered the AI era, with the development of AI education,
    the dilemma of family education has gradually found a way out. AI education assists
    family education, achieved through two channels: children''s family education
    robots and school intelligent education parent terminals.


    Children''s education robots enter the family, mainly accompanying children''s
    growth and development through dialogue. On the one hand, children''s education
    robots based on AI technology can provide necessary intelligent dialogue, interesting
    interaction, collaborative games, simultaneous interpretation, etc., according
    to children''s developmental stages, allowing children who fear loneliness most
    to obtain warm companionship and high-quality family education at any time during
    growth. On the other hand, introducing AI education robots into family education
    can liberate parents from the work of tutoring children''s homework, giving them
    more time and energy to care for children''s physical and mental health development,
    and more time to accompany children.


    From the perspective of the school intelligent education parent terminal, AI education
    actually uses AI technical means to break through the emotional isolation between
    students and parents caused by students entering campus. Parents can use the AI
    education parent terminal to more comprehensively understand students'' learning
    dynamics, ideological tendencies, and behavioral habits, thereby promoting effective
    communication between parents and students. For example, iFLYTEK''s Xiaoxuewang
    parent terminal, with its powerful data statistics and data visualization advantages,
    can arouse parents'' active attention to their children''s school life, thereby
    enhancing parents'' emphasis on family education, and also helping parents understand
    their children''s true needs in learning.


    #### 4. Value of AI Education for Schools


    Schools introducing AI technology to transform and upgrade the entire education
    system is of great significance to the school''s educational teaching activities.
    The most critical value lies in promoting the scientization of school management.
    The core of management lies in precise decision-making, and the key to precise
    decision-making lies in the "structural rationality" of decision-making data.
    The reason why AI technology can empower education is because of the solid foundation
    of education informatization. In April 2018, the Ministry of Education officially
    issued the "Education Informatization 2.0 Action Plan." The country has started
    a new round of strategic layout for the development of education informatization.
    At that time, effective improvements will be made in education data structure,
    education data sharing mechanisms, education data confidentiality agreements,
    education teaching intellectual property rights, and other aspects, bringing great
    convenience to the school''s education teaching management.


    Up to now, under the guidance of education informatization policies, schools of
    all levels and types across the country have gradually implemented the intelligent
    transformation of education on the basis of informatization. The pattern of "smart
    campus" is forming, and the perception ability of the school''s AI education system
    can also be rapidly upgraded. In the near future, when AI technology covers all
    corners of the school, the school''s management work will become very intelligent.
    The school''s teaching management, safety management, student status management,
    learning situation analysis management, and other activities will all achieve
    intelligent control, ultimately realizing the modernization of school education
    management.


    ### (II) Macro Value of AI Education


    From a macro perspective, the value of AI education concerns both the empowerment
    of education links and the improvement of education quality, as well as the promotion
    of educational equity and the improvement of the overall quality of the nation.


    #### 1. Empowering Education Links


    AI education''s most significant manifestation of its overall intelligent characteristic
    lies in the empowerment of education links. Various types of education, from a
    teaching perspective, can be summarized into generally five links: lesson preparation,
    teaching, assigning and grading homework, extracurricular tutoring, and academic
    assessment and feedback. AI technology empowering education links is actually
    making these "five" basic teaching links intelligent. For example, in the lesson
    preparation link, teachers'' teaching plans, curriculum plans, courseware production,
    and other work can all be based on intelligent mining technology to collect relevant
    shared materials from major websites and databases. This not only saves production
    time but also gives teachers a large amount of time to perfect lesson preparation
    content, making the quality of lesson preparation higher and higher. Another example
    is the assigning and grading homework link; whether subjective or objective questions,
    intelligent grading can be realized. Theorem proving, intelligent learning games,
    solving calculus, intelligent behavior demonstration, intelligent shorthand, intelligent
    translation, speech synthesis, intelligent writing, etc., are all mastered.


    #### 2. Improving Education Quality


    Education quality is a measurement indicator of educational effects, the sum of
    effects produced by various educational factors acting on educational objects.
    The amount of knowledge of the educational object is a concentrated embodiment
    of education quality. Education links, education methods, education management,
    education systems, education content, education environment, etc., are all factors
    that affect education quality. These factors conducive to improving student learning
    effects will all achieve intelligent transformation under the action of AI technology.
    The introduction of AI technology can effectively identify factors restricting
    the improvement of education quality and conduct intelligent control and regulation
    on them. On the basis of improving education efficiency, it promotes the "high-quality
    development" of education.


    #### 3. Promoting Educational Equity


    In a congratulatory letter to the 2019 International Conference on Artificial
    Intelligence and Education, General Secretary Xi Jinping pointed out: "China attaches
    great importance to the profound impact of AI on education, actively promotes
    the deep integration of AI and education, promotes educational reform and innovation,
    gives full play to the advantages of AI, and accelerates the development of education
    that accompanies everyone for life, education that faces everyone equally, education
    that suits everyone, and more open and flexible education. China is willing to
    work with all countries in the world to focus on frontier issues of AI development,
    deeply explore ideas and measures for educational development and innovation under
    the conditions of rapid AI development, build consensus, deepen cooperation, expand
    sharing, and jointly promote the building of a community with a shared future
    for mankind^([\[10\]](#txt002.html#footnote_content_txt002_10))." It can be seen
    that AI empowering education is of great significance for promoting educational
    equity, and is related to the construction process of a "community with a shared
    future for mankind." The core idea of the educational equity value hidden in AI
    education is to "teach all valuable knowledge to all people." In the AI era, practices
    to solve educational equity problems have begun. From the transformation from
    "single-teacher mode" to "dual-teacher mode," and then breaking through to "multi-teacher
    mode," high-quality teaching courses have been provided to students across the
    country. The completion of the national "Three Connections and Two Platforms"
    construction is a typical case of AI technology promoting the fair radiation of
    educational resources nationwide. AI technology promotes the development of educational
    equity and realizes value realization.


    #### 4. Improving National Quality


    National quality is a comprehensive concept, including many aspects, specifically
    divided into "three categories and eight types": three categories of quality refer
    to natural quality, psychological quality, and social quality; eight types of
    quality refer to political quality, ideological quality, moral quality, professional
    quality, aesthetic quality, labor quality, physical quality, and psychological
    quality^([\[11\]](#txt002.html#footnote_content_txt002_11)). In summary, national
    quality includes individual quality and collective quality. Education is the basic
    channel for the formation of national quality. With the continuous development
    of AI education, its practice and application are becoming increasingly mature,
    meaning that the value of AI technology in empowering education links, improving
    teaching quality, and promoting educational equity is greater. Overall, AI technology
    entering the education field will build education into an open and inclusive giant
    education system. A learning society will be constructed, a lifelong education
    system will be formed, education content will cover all aspects of national quality
    education, a sound personality will be shaped, and the possibility of "all-round
    development" of educational objects will be greatly improved. At the same time,
    patriotic education, collectivist education, and ethical and moral education will
    also be developed. Ultimately, the internal structural trend of AI education and
    national quality will move towards harmony, organically unifying individual quality
    and collective quality from the overall perspective, and national quality will
    be greatly improved.


