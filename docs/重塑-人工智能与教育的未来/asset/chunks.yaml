    ## 3. Questioning the Significance: The Purpose of the Educational Revolution
    in the Intelligent Era


    As Marx said: "Everything humanity strives for is related to their interests^([\[6\]](#txt001.html#footnote_content_txt001_6))."
    In the era of artificial intelligence, people''s dedication to the reform and
    innovation of the education undertaking is undoubtedly closely related to their
    interests. From the perspective of how AI empowers education, people may easily
    misunderstand that the pursuit of educational reform is merely **efficiency, cost,
    and quality**. This greatly misinterprets our original intention—mistaking the
    object education serves as a **"commodity"**.


    What needs to be emphasized is that AI empowering education only empowers the
    operational and management levels of the education undertaking. Specifically,
    it serves teachers in the teaching process, provides quality teaching for students,
    and promotes students'' healthy growth and all-round development—**this is the
    original intention and goal of educational reform in the intelligent era**. The
    realization of this goal, the value brought by AI education, will concern the
    future of students and the entire society.


    **First, promote the "return of students'' subject status".** People wholeheartedly
    promote the development of the education undertaking, the purpose of which is
    to let students **"return to subject status"** in learning activities, making
    the cultivation of socialist builders and successors the common development goal
    of students and teachers. In the AI era, teachers assisted by intelligent technology
    can develop new courses more efficiently and better respond to students'' learning
    needs; students assisted by AI technology can better consolidate their professional
    knowledge. After all, all purposes related to education will revolve around promoting
    the all-round development of students. According to Marx''s theory of all-round
    human development, actively promoting the **"balanced development of the five
    educations" (moral, intellectual, physical, aesthetic, and labor education)**,
    and cultivating well-rounded new people of the era, is the mission of education
    in this era.


    **Second, highlight the mission and significance of teachers.** Education must
    firmly believe that every student possesses unique skills and talents, and also
    firmly believe that every teacher is an **engineer of the human soul**. "**Use
    life to influence life, use life to shape life, use life to guide life**," education
    is destined to bring a different life to the educated. Only in this way can the
    nation''s collective sense of honor, the sense of mission for national rejuvenation,
    and the sense of responsibility for prosperity and strength penetrate the hearts
    of students, embedding themselves in their marrow and souls. Educational reform
    needs to become a bridge and link for realizing social value and personal value;
    it needs to serve the transformation and development of the country, society,
    and individuals.


    **Third, conducive to the realization of personal value and social value.** Society
    is a society composed of individuals; on each person rests mission and glory.
    We should all become independent, self-reliant strivers and contributors to the
    nation''s prosperity and rejuvenation—"**we are all dream chasers**." The qualitative
    determinacy of education requires us to clearly answer the questions of "**for
    whom to cultivate people,** **what kind of people to cultivate,** and **how to
    cultivate people**." The great significance of education lies not in education
    itself, but in whether it truly fulfills the function and utility of **"fostering
    virtue through education, shaping people and souls."**


    **Finally, run education that satisfies the people.** A century''s plan, education
    is the foundation. To run education that satisfies the people, education must
    be placed in a position of priority development. The country must unswervingly
    take the road of educational innovation; relevant departments at all levels must
    actively carry out practical activities of educational innovation, adhering to
    the path of **"from practice, to practice."** On the road of educational reform,
    we must always adhere to the leadership of the Party, further enhance ideological
    understanding of educational reform, actively go deep into the masses and the
    groups of educated objects to do a good job in education, and solidly promote
    educational reform into the hearts of the people, towards students, and towards
    the future.


    The purpose of the educational revolution in the intelligent era is to highlight
    the value and significance of education in the process of promoting **"the all-round
    development of human beings."** Draw wisdom from the advantages of AI empowering
    education, cast intelligent elements into the entire process of human education,
    endow education with specific wisdom and capabilities, and promote the occurrence
    of the educational revolution. At that time, the optimization and reorganization
    of the educational ecosystem and structure, the fulfillment of the purpose of
    the educational revolution in the intelligent era, its value is obvious—it is
    conducive to the return of students'' subject status, the realization of personal
    and social value, highlighting the mission and significance of teachers, and overall
    promoting the healthy and rapid development of education. In short, the cross-integration
    of AI technology and education facilitates the country in better running education
    that satisfies the people.


    ## 4. Educational Revolution: The Purpose, Content, and Structure of This Book


    Wei Yuan pointed out in the *Preface to the Illustrated Gazetteer of the Maritime
    Countries*: "**Why was this book written? It says: Written to use barbarians to
    attack barbarians, written to use barbarians to negotiate with barbarians, written
    to learn the superior techniques of barbarians to control barbarians.**" Then,
    before writing this book, we were also to this trend and a forward-looking prospect
    for the development of intelligent education.


    Under the strategic guidance of the state, the intellectualization development
    of the education field is in full swing. Conceptual discussions on the integration
    of AI and education are also deeply favored by the academic community. The parallel
    development of AI and education has given birth to AI education. After experiencing
    policy guidance and market pull, the practice and application of AI education
    have prompted people to discuss the concept of AI education. As of now, discussions
    on the concept of AI education mainly exist at the application level, teaching
    link level, and educational structure intellectualization level.


    At the application level, Xu Peng believes that the application fields of AI education
    are mainly concentrated in intelligent teaching systems, intelligent agents, intelligent
    Q&A systems, and intelligent education decision support systems ^([\[2\]](#txt002.html#footnote_content_txt002_2)).
    Liang Yingli believes that the application fields of AI education are mainly concentrated
    in intelligent tutor systems, automated assessment systems, educational games,
    educational robots, etc. ^([\[3\]](#txt002.html#footnote_content_txt002_3)).


    At the teaching link level, Baidu Encyclopedia believes that AI education is the
    process of using computer technology to provide assistance, guidance, consultation,
    help, or decision-making for instructional designers and other teaching product
    developers during the instructional design and teaching product development process
    ^([\[4\]](#txt002.html#footnote_content_txt002_4)). The Ministry of Science and
    Technology of the PRC pointed out in the *Report on the Development of Innovative
    Applications of Intelligent Education* that AI education is based on new-generation
    information technologies such as deep learning, big data, and virtual reality,
    constructing an intelligent education environment centered on learners, running
    through all links of the education process **"lesson preparation-teaching-practice-examination-evaluation-management,"**
    realizing a new education model of more diversified, precise, and personalized
    talent cultivation ^([\[5\]](#txt002.html#footnote_content_txt002_5)).


    At the educational structure intellectualization level, Zhong Xiaoliu et al. believe
    that AI education is a new type of ubiquitous, perceptive, integrated, and intelligent
    education ecosystem built on new-generation information technology ^([\[6\]](#txt002.html#footnote_content_txt002_6)).
    Xu Lifang believes that AI education refers to the intellectualization of the
    education and teaching process, and is the AI education and teaching ideological
    enlightenment for personnel engaged in education work ^([\[7\]](#txt002.html#footnote_content_txt002_7)).


    Through conceptual discussion and analysis at the intellectualization levels of
    application, teaching links, and educational structure, the concept of AI education
    has gradually become clear. AI education includes two aspects: **education intellectualization
    and intellectualized education**. In terms of the intellectualization level of
    education, it mainly focuses on the intellectualization of the education process
    and education links, specifically manifested in various application forms and
    execution links of education. It aims to improve the state of existence of educators,
    educational media, and the educated. It is a **"bottom-up"** educational reform,
    involving specific application scenarios of AI technology in the education field,
    such as intelligent tutor systems, teaching management, teaching evaluation, educational
    consulting, etc. In terms of the intellectualized education level, the concept
    of AI education originates from **"top-down"** humanistic care and the transcendence
    of institutional boundaries, aiming to seek overall ideological enlightenment
    for education and teaching from the spiritual realm of human education, thereby
    bringing ecologicalization and wisdom to the entire human education system.


    In summary, AI education refers to the process of social ubiquity in the technological
    space of intellectualized education and education intellectualization based on
    AI technology. From the perspective of the integration of technology and education,
    AI education is a composite of real education and virtual education, a new education
    architecture centered on the **"object of education."** The whole process and
    whole structure of education will achieve three-dimensional integration with intelligent
    technology, highlighting the true value and purpose of education, and centrally
    demonstrating the educational charm of the new era.


    ## 2. Education in the New Intelligent Era: Coexistence of Personalization and
    Humanization


    AI education is an organic combination of technology, education, and humanities.
    It represents the new forms of educators, the educated, and educational media
    in educational activities and problems through technical means, and reflects the
    value and function of the core new characteristics of AI empowering education
    in the technological space. It allows the subject status of learners in teaching
    activities to return, highlighting the new connotation of **"learning to master
    things"** and **"learning to become a person"** in education in the new intelligent
    era. Further clear definition of the characteristics of AI education is an important
    basis for discussing the value, function, and application of AI education.


    ### 1. Intelligentization


    Intelligentization is the general characteristic of AI education. The intelligentization
    characteristic of AI education refers to the tendency to actively satisfy the
    needs of educators and learners under the support of intelligent technology. Data,
    algorithms, and computing power are the core driving forces of AI education. Whether
    it is intelligent teacher systems, intelligent expert systems, or intelligent
    personalized recommendation learning systems, they are all based on intelligent
    modeling of massive educational big data. In the process of model generalization,
    the functional modules of the AI education system are continuously improved.


    AI education is a functional system that rapidly mines potential value from massive
    educational big data. Leveraging the trial-and-error advantage of AI technology,
    it can improve the educational environment and enhance the quality of educational
    resources without affecting student learning, bringing rich emotional experiences
    to school teaching work.


    ### 2. Personalization


