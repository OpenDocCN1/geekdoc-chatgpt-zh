- raw: "在2016年的全国两院院士大会上,习近平总书记强调：“空间技术深刻改变了人类对宇宙的认知,为人类社会进步提供了重要动力,同时浩瀚的天空还有许多未知的奥秘有待探索,必须推动空间科学、空间技术、空间应用全面发展。^([\\\
    [4\\]](#txt004.html#footnote_content_txt004_4))”当然,习近平总书记在这里强调的是与航天有关的空间技术的重要性。但对当下的教育发展依然具有重要的启示意义,对于人工智能时代的教育,习近平总书记的讲话启发大家,要推动多维教育空间的并存与一体化发展,就要推动教育空间的无边界化发展与应用,激发教育者与教育对象保持对于生命的敏感性,要不断地加强智能空间科学、空间技术、空间应用与教育领域的全面渗透与糅合。\n\
    \n历史地看,人类教育空间的演变共经历四个阶段：第一阶段是经验传授、耕读相继的“田野空间”;第二阶段是以班级授课制为基础的“课堂空间”;第三阶段是以信息技术为基础的“网络空间”和“现实空间”;第四阶段是以智能技术为基础的“混合空间”。教育空间的历史演化,是从简单到复杂、从非制度化向制度化的进路不断发展。\n\
    \n由于受到电子计算机技术和互联网信息技术的冲击,第一、二阶段的教育空间开始发生转向,走向“网络空间”和“现实空间”并存的二元划分状态。随着这种状态的反复上演,以及智能技术的掺杂,第三阶段的二元性教育空间属性逐渐被突破,多元空间并存的混合属性渐渐呈现。\n\
    \n教育空间的转向,多元空间并存的叠加态,去边界化与再边界化、去行政化与再行政化、去中心化与再中心化、去本土化与再本土化交叠,看起来已经达到历史难以逾越的高度。但这并不意味着传统意义上的教育时间、教育空间与教育范围的终结。相反,反倒是为人们铺开了一条关于教育时空与教育想象的通道——新的教育边界、新的教育中心与新的教育本土化,应该要以什么样的形态出现?可能需要从教育的本质中寻找答案。\n\
    \n教育多元空间并存,源于教育需求的扩张,以及社会教育的发展。随着社会生产力的发展和社会分工的不断细化,社会对多元化人才的需求与日俱增,正面刺激教育领域的广泛发展,兴趣班、学科辅导班、社会职业培训、考证班、托管教育、网络MOOC、智能教育App、智能在线教育系统等,各种新型教育形式不断涌现,极大丰富和扩展了传统教育空间的范围和内容,为教育的发展提供了无限的空间想象力。\n\
    \n人工智能时代的教育,新的教育空间不断产生,新空间与旧空间的交叉融合程度不断加深,传统教育空间中存在的“人、事、物、场、时”,以及它们之间的关系,都正在被重新定义。阿科米星建筑设计事务所创始人庄慎老师在2018年的《AI与智能空间产业论坛》上说：“在这个时代,通过物联网、大数据和智能化技术,空间将进行真正变革,实现新的智能化空间,改变人和物理时间、改变人与人之间的关系。^([\\\
    [5\\]](#txt004.html#footnote_content_txt004_5))”新的智能化空间的衍生,新的教育空间特征逐渐明显,包容性、多样性、层次性和结构性蕴藏其中。智能时代的教育“混合空间”正在实现由“封闭空间”向“开放空间”和“自由空间”的转向,智能教育空间从分离走向统一,从混合走向有机结合。因此,打造一个有活力且灵活的教育空间,将成为实现“多维教育空间并存与一体化发展”的关键步骤,也是决定该空间是否能够实现的关键。\n\
    \n人工智能时代,要打造一个有活力且灵活的教育空间,势必要在智能技术的基础上,遵循学生发展规律和教育教学规律,融合家庭、学校、社区、企业等四个物理教育空间,结合人工智能技术,构建物理教育空间的数字孪生空间,形成“学生与空间”动态融合的开放性教育空间结构,并采用人工智能数字孪生技术的空间干预优势,实现不同教育空间的功能互补的有机转换。\n\
    \n在教育教学活动中,教师与学生可以根据发展需求,在物理教育空间、虚拟教育空间、数字孪生空间中找到发展的契合点,促成多维教育空间在教育活动中的同时在场,实现空间优势互补与功能覆盖,并开放空间出入口,学生可以灵活自由地出入其中。同时,教师与学生要积极进行教育时空观念的转化与更新,充分认识智能教育多维时空并存的价值与意义,以及与之相关的应用技巧和注意事项,并积极学习新兴教育空间技术,推动教育制度朝着对“多维教育空间”的包容性方向发展,舒展有活力且灵活的教育空间的价值与现实魅力。\n\
    \n人工智能时代,多维教育空间并存与一体化发展,是教育空间在智能技术的辅助下从“割离”到“聚合”的重大成果,意味着在未来的教育大环境中,学生的学习将突破学校的藩篱,走向无边界的学习空间中去,无边界教育正在诞生与发展。\n\
    \n三、时空限制的解体：无边界教育的智能建构\n\n在漫长的人类教育发展史上,教育的发展与社会需求的变化密切相关。随着新一代人工智能技术的发展,人们在新的环境中逐渐意识到,局限于特定时间与空间中的传统教育,如固定的教学场景、教学场地、教学环境、教育工作者、教育方法与教育理念,已在学生的心里筑下一道厚厚的“围墙”,明显地阻碍和束缚学生的社会适应能力的生成,导致学生不能很好地适应社会发展的需要。所以,社会的发展不断地驱使人们从时间和空间中探寻教育发展的新空间,对“无界”的向往和对教育边界的突破和超越,对于拓展学生的“心理边界”和“认知边界”具有重要价值。\n\
    \n人工智能赋能教育,教育时间由“必要的琐碎时间”走向“可自由支配的学习时间”,教育空间由“单维空间”走向“多维教育空间”并存,为教育发展提供了新的时空契机。可以肯定的是,以学生拥有自由可支配的学习时间为条件,很容易促成学生个体与多维教育空间的融合,从而超越传统教育时间与教育空间对学生发展的限制,突破教育的现实边界,通往无边界教育的大门。\n\
    \n1998年,澳大利亚学者斯图尔特·卡宁汉姆(Stuart Cunningham)在其出版的专著《新媒体与无边界教育》一书中,第一次将“无边界教育”(Borderless\
    \ Education)作为学术术语置入研究者的视野^([\\[6\\]](#txt004.html#footnote_content_txt004_6))。随着教育的不断发展,教育的空间与边界逐渐模糊,教育主体的多元化参与,多种教育形态并行不悖,不断地瓦解传统教育固化的“藩篱”。\n\
    \n无边界教育,是指教育活动和教育现象的无边界发生,具体包括教育时间无边界、教育空间无边界、教学内容无边界、教学形式无边界、受教育对象无边界、学科融合无边界与教学课堂无边界等^([\\\
    [7\\]](#txt004.html#footnote_content_txt004_7))。无边界教育的诞生,在整个教育系统中提出一次革命性的变革路线图,它将传统的封闭式教育空间作为“劲敌”,在精神层面打破传统教育的边界,在实践层面颠覆传统教育的“正统权威”。因此,无边界教育理念,在其发展过程中颇受教育界和商业界的青睐,一批无边界教育学术成果、一批无边界教育咨询有限公司、无边界教育科技有限公司、无边界教育培训有限公司应运而生,助推无边界教育的社会化发展。\n\
    \n智能时代,无边界教育是家庭教育、学校教育与社会教育的界限被打破的产物,与人们的生活紧密相关。无边界教育,教育无处不在,在智能配套技术的支撑下,无边界教育的发展呈现出智能化、广覆盖、沉浸式等三个重要特征。教育与生活相互渗透,正所谓：“教育即生活”“生活即教育”。无边界教育,无论是在现实空间还是虚拟空间,都是人的“本真”在社会化场景中的回归,在新的“无边界”架构中,潜伏于传统教育中的深层矛盾逐渐被认识和被解决,传统教育与现代化教育在历史演进中不断走向统一。进一步推动无边界教育的社会合理化发展,智能建构“有网而无界”的大教育生态系统,是实现无边界教育在场的重要举措。\n\
    \n教育对象无边界。智能时代的教育,是以物联网、大数据、图像识别、自然语言处理、语音识别为基础的智能化教育。在智能建构无界教育生态体系时,教育者应首先着手研究教育的“无界”特征,在厘清不同的教育对象与智能教育系统的连接方式的基础上,实现不同教育对象的个性化需求与智能教育系统的个性化供给的有效对接。教育对象的无边界属性,主要表现为教育对象的多样性,要想实现“教育对象无边界”,还需要建设面对儿童、青少年、中年人、老年人的全生命周期教育对象的覆盖系统,在技术层面实现“家庭、学校、社区”的一体化教育。\n\
    \n教育资源无边界。要实现教育资源无边界,可以从共享理念出发,在智能保密技术的支撑下,促进教育资源数据的跨域共享。建立相关的利益协调机制,协调解决关于教育数据主权引发的利益纷争问题,为“多源异构”的教育资源数据的共享提供现实前提。最后,还需要优化教育资源库,加强教育资源基础库建设。教学资源数据库是资源共享机制构建的物质基础,是教育无边界资源的有机构成。数据库建设应立足课程资源的流动性,通过诸如专家库等信息构建方式,实现人力资源的自由流动,对实现无边界教育意义重大^([\\\
    [8\\]](#txt004.html#footnote_content_txt004_8))。\n\n教育场所无边界。无边界教育,对于人们而言,最大的便捷之处在于,“想学”就能实现“在场”。因此,要运用智能技术构建无边界教育生态系统,首先,要积极开展关于教育场所无边界的普及与宣传教育活动,转变学生对教育场所的认识,以便于学生在学习需求出现时,能够实现在最短的时间内找到相应的学习场所。其次,以“智能学习场所”的智能化、精准化衔接为理念,结合个性化智能推送服务技术,将教育场所的在场状态与学生的在场状态进行实时匹配,学生可以根据自己的学习空间环境,适当地选择对应的学习系统。最后,推动教育制度的变革。如今,传统教育场所的藩篱并未完全消失,需要以“制度改革”促进“空间转向”的方式,在文化观念、风俗习惯、社会规约等方面突破教育场所的边界性限制,实现“教育场所无边界”的制度化转型。\n\
    \n时空限制的解体,无边界教育的智能化构建,是智能技术在教育领域引发的一次重大的“教育时空”革命,它将无边界教育的发展推向极致,也将人们的心理边界的发展推向极致。在这样的教育时空中,教育的意义逐渐凸显,学习自由与学习权利在教育中逐渐得到承认,“教育的在场”走向“学习的在场”,无边界学习正在到来,“想学”就能实现“在场”。\n\
    \n四、无边界学习：“想学”就能实现“在场”\n\n智能时代,在智能技术的多维赋能条件下,教育的“多空间泛在”属性明显增强,教育的边界逐渐模糊与被突破,传统教育逐渐发生范式转换——教育对象、教育资源、教育场所、教育形式、教育内容等等领域,都将发生一场关于“有界”和“无界”的教育变革之争,无边界教育正大踏步地向我们走来,无边界学习正孕育其中。\n\
    \n随着无边界教育制度、教育组织、教育管理体系的发展成型,与之相伴相生的“无边界学习”渐渐走进人们的视野。在大数据、物联网、图像识别、语音识别、自然语言处理、数字孪生、边缘计算等智能技术的支撑下,无边界学习从无边界教育之中独立出来。无边界学习的概念,最早是由英国教育界首先提出,是指利用所有学习平台,给学习者提供一个可以在任何地点、任何时间,使用手边任何可以获取的学习机会进行学习活动的学习环境。具体而言,无边界学习包括学习内容无边界、学习方式无边界、学习场域无边界、学习资源无边界等^([\\\
    [9\\]](#txt004.html#footnote_content_txt004_9))。\n\n随着无边界学习的内涵与外延的不断扩大,由“课堂随处可在”到“学习无处不在”的范式转换,无边界学习将关注点从教育者转向教育对象,并将之置于教育教学活动的研究中心,进一步倡导在任何时间(Anytime)、任何地点(Anywhere)的任何人(Anyone)可以就任何内容(Any\
    \ Content)进行任何形式(Any Format)的学习形态,从而使得面向每个个体的个性化、定制化教育得以可能^([\\[10\\]](#txt004.html#footnote_content_txt004_10))。\n\
    \n无边界学习,是无边界教育在学生立场上的社会化延伸,是教育者实施因材施教的良机,是学生争取学习主动权的一次“普遍性胜利”。根据无边界学习的概念可知,由于学生学习环境不再受学习时间、学习地点、学习内容、学习方式等因素的限制,学习活动与学习现象的“无处不在”与“无时不有”。无边界学习,学习无处不在,具有超时空、人机合一、个性化三大核心特征。\n\
    \n无边界学习的超时空特征。智能技术的优越性与新的形塑价值,携手学生学习形态的发展走向超越时空限制的自由学习形态,学生依托智能学习终端、智能穿戴设备(AR/VR等)、智能学习平台,可以及时有效地获取不同时间跨度和空间跨度的学习资源,对其进行学习与知识建构,并以新的学习者身份融入其中,通过运用智能终端设备,实现学习的“历史—现实—未来”三位一体的跨界式融合。时空作为学习活动和学习现象的现实载体,时空的超越,意味着学习者的“边缘性”地位的复归,多时空泛在的学习形态,凸显无边界学习的“无界”属性。\n\
    \n无边界学习的人机合一特征。智能时代,是一个技术赋能“万事万物”的时代。一切事物的智能化特征,衍生出学习载体的智能化特征。无边界学习社会到来之前,学习载体(智能学习机器)与学习者的分离,人与学习工具的藩篱的存在,限制了学生获取学习资源的效率和渠道。但是,随着无边界学习理念的社会化与落地,人们学习的过程主要是人与智能学习设备的交互过程。从学生的角度来说,智能学习机器已成为学生学习活动的重要构成部分,载体的无边界、学习机器承载的价值的无边界与学生学习的无边界的融合,决定了无边界学习的人机合一特征的存在。\n\
    \n无边界学习的个性化特征。无边界学习的缘起,本质上是源于人们的差异化需求在学习层面上的个性化诉求。智能时代,智能化和社会化的无边界学习形态,能够基于相关智能技术有效回应学生的个性化学习需求,智能数据挖掘、智能特征提取、智能推荐算法与智能精准模式识别等技术的成熟与技术整合,智能无边界学习生态系统已在无边界教育系统的构建中逐渐形成。届时,无边界学习系统将遵循学生的个性化发展需要,以学生的个性化发展为中心,彰显智能时代的个性化定制学习的魅力。\n\
    \n智能时代,教育时空的超越,迎来教育与学习的无边界化发展,无边界学习的个性化、超时空与人机协同的特征,将无边界教育与无边界学习推向发展的极致——教育无处不在,课堂无处不在,学习无处不在。在“无处不在”的教育与学习环境中,学习的客观条件已经具备——“学习资源极大丰富,学习时间极度自由,学习场所随处可见”。\n\
    \n从大的社会历史背景来看,随着社会科技化的程度不断加深,社会分工开始从“精细化”不断地走向“综合”,社会对人才的能力素养的要求不断提高,总体的人才需求趋势呈现从“技能工”向“复合型工”的转变,数据素养、信息素养、智能素养等素养要一应俱全。在这样的时代背景下,身处于其中的个体需要时刻保持求学进取的心态与行动。因此,智能时代,教育与学习的客观条件的满足,已为广大学习者的学习奠定了客观基础,学习者的主观意愿在社会文化的熏陶下,应该充分关注自身的发展,而不是被技术奴役。\n\
    \n智能时代,是一个教育与学习无边界的时代,学习者的被动地位被改变,主体地位得到回归。同时,学习者也要承担相应的责任。在一个日新月异的时代,他们必须要对自己的未来发展负责,主动肩负“认识自己、发展自己、改造自己”的重大使命。在智能时代,学习的主观与客观的统一,使“想学就有条件学”。只要学生真正开始思考自己,学习的“在场”便会发生;只要学生想学,就能实现学习的在场。\n\
