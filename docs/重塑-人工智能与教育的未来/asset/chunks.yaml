    # The Fifth Human-Machine Relationship: AI Teachers and Human Teachers


    ## Intelligent Empowerment: The Transformation of the Teacher''s Role


    ## Preparing for the Future: Will Human Teachers Be Replaced?


    ## Human-Machine Co-teaching: From Opposition to Unity


    ### I. Intelligent Empowerment: The Transformation of the Teacher''s Role


    Since the beginning of the 21st century, Artificial Intelligence (AI) has continuously
    disrupted various fields with its tremendous energy, constantly changing people''s
    understanding of the "traditional." In the field of education, no one anticipated
    that the emergence of AI would challenge the existence of human teachers. However,
    facts have proven that AI has indeed brought "surprises," or perhaps "panic,"
    to human teachers. In August 2018, Sophia, the world''s first AI citizen, was
    hired as the first AI teacher in human history, marking the official entry of
    AI into the education industry. The emergence of AI teachers has triggered a rethinking
    of human-machine conflict—will human teachers be replaced by AI teachers? In the
    AI era, what role should human teachers play, and how should they coexist with
    AI teachers? These are all new issues worthy of in-depth exploration in the new
    intelligent era.


    ## III. Disintegration of Spatiotemporal Constraints: Intelligent Construction
    of Borderless Education


    Throughout the long history of human education development, the evolution of education
    has been closely related to changes in social needs. With the development of the
    new generation of AI technology, people in the new environment have gradually
    realized that traditional education confined to specific time and space—such as
    fixed teaching scenarios, venues, environments, educators, methods, and concepts—has
    built a thick "wall" in the hearts of students, significantly hindering and restricting
    the generation of students'' social adaptability, resulting in students'' inability
    to adapt well to the needs of social development. Therefore, social development
    continuously drives people to explore new spaces for educational development from
    within time and space. The yearning for the "boundless" and the breaking and transcending
    of educational boundaries hold significant value for expanding students'' "psychological
    boundaries" and "cognitive boundaries."


    AI empowers education; educational time shifts from "necessary fragmented time"
    to "freely disposable learning time," and educational space shifts from "single-dimensional
    space" to the coexistence of "multi-dimensional educational spaces," providing
    new spatiotemporal opportunities for educational development. It can be affirmed
    that, conditioned on students possessing freely disposable learning time, it is
    easy to facilitate the integration of individual students with multi-dimensional
    educational spaces, thereby transcending the limitations of traditional educational
    time and space on student development, breaking the realistic boundaries of education,
    and opening the door to borderless education.


    In 1998, Australian scholar Stuart Cunningham, in his monograph *New Media and
    Borderless Education*, first introduced "Borderless Education" as an academic
    term into the researchers'' vision. With the continuous development of education,
    the spaces and boundaries of education have gradually blurred. The diversified
    participation of educational subjects and the parallel coexistence of multiple
    educational forms have continuously dismantled the solidified "barriers" of traditional
    education.


    Borderless education refers to the borderless occurrence of educational activities
    and phenomena, specifically including borderless educational time, borderless
    educational space, borderless teaching content, borderless teaching forms, borderless
    educational objects, borderless interdisciplinary integration, and borderless
    teaching classrooms, etc. The birth of borderless education has proposed a revolutionary
    roadmap for transformation within the entire education system. It takes the traditional
    closed educational space as a "formidable opponent," breaking the boundaries of
    traditional education at the spiritual level and subverting the "orthodox authority"
    of traditional education at the practical level. Therefore, the concept of borderless
    education has been highly favored by both the educational and business communities
    during its development. A batch of borderless education academic achievements,
    consulting companies, technology companies, and training companies have emerged,
    promoting the socialized development of borderless education.


    In the intelligent era, borderless education is the product of the breaking of
    boundaries between family education, school education, and social education, and
    is closely related to people''s lives. In borderless education, education is everywhere.
    Supported by intelligent supporting technologies, the development of borderless
    education presents three important characteristics: intelligence, extensive coverage,
    and immersion. Education and life permeate each other; as the saying goes: "Education
    is life," "Life is education." Borderless education, whether in real space or
    virtual space, is the return of the human "authentic self" in socialization scenarios.
    In the new "borderless" architecture, the deep-seated contradictions latent in
    traditional education are gradually recognized and resolved, and traditional education
    and modernized education continue to move toward unity in historical evolution.
    Further promoting the rational social development of borderless education, the
    intelligent construction of a "connected yet boundless" grand education ecosystem
    is an important measure for realizing the presence of borderless education.


    ### Borderless Educational Objects


    Education in the intelligent era is intelligent education based on the Internet
    of Things, Big Data, Image Recognition, Natural Language Processing, and Speech
    Recognition. In the intelligent construction of a borderless education ecosystem,
    educators should first study the "borderless" characteristics of education. On
    the basis of clarifying the connection methods between different educational objects
    and the intelligent education system, they should achieve effective docking between
    the personalized needs of different educational objects and the personalized supply
    of the intelligent education system. The borderless attribute of educational objects
    is mainly manifested in the diversity of educational objects. To achieve "borderless
    educational objects," it is also necessary to build a coverage system for educational
    objects facing children, adolescents, middle-aged people, and the elderly throughout
    the entire life cycle, realizing the integrated education of "family, school,
    and community" at the technical level.


    ### Borderless Educational Resources


    To achieve borderless educational resources, one can start from the concept of
    sharing. Supported by intelligent security technologies, promote cross-domain
    sharing of educational resource data. Establish relevant interest coordination
    mechanisms to coordinate and resolve interest disputes arising from educational
    data sovereignty, providing a realistic premise for the sharing of "multi-source
    heterogeneous" educational resource data. Finally, it is necessary to optimize
    educational resource banks and strengthen the construction of basic educational
    resource banks. The teaching resource database is the material basis for the construction
    of the resource sharing mechanism and the organic composition of borderless educational
    resources. Database construction should be based on the fluidity of curriculum
    resources, realizing the free flow of human resources through information construction
    methods such as expert databases, which is of great significance for realizing
    borderless education.


    ### Borderless Educational Venues


    For people, the greatest convenience of borderless education lies in the fact
    that the "desire to learn" can realize "presence." Therefore, to use intelligent
    technology to construct a borderless education ecosystem, first, it is necessary
    to actively carry out popularization and publicity education activities on borderless
    educational venues, transforming students'' understanding of educational venues
    so that when learning needs arise, students can find corresponding learning venues
    in the shortest time. Second, based on the concept of intelligent and precise
    connection of "intelligent learning venues," combined with personalized intelligent
    push service technology, match the presence status of educational venues with
    the presence status of students in real-time. Students can appropriately select
    corresponding learning systems according to their own learning space environment.
    Third, promote the reform of the educational system. Currently, the barriers of
    traditional educational venues have not completely disappeared. It is necessary
    to promote "spatial turn" through "system reform," breaking the boundary restrictions
    of educational venues in terms of cultural concepts, customs, and social norms,
    and achieving the institutionalized transformation of "borderless educational
    venues."


    The disintegration of spatiotemporal constraints and the intelligent construction
    of borderless education constitute a major "educational spatiotemporal" revolution
    triggered by intelligent technology in the field of education. It pushes the development
    of borderless education to the extreme and also pushes the development of people''s
    psychological boundaries to the extreme. In such an educational spatiotemporal
    context, the meaning of education gradually becomes prominent. Learning freedom
    and learning rights are gradually recognized in education. "Presence of education"
    moves toward "presence of learning." Borderless learning is arriving; the "desire
    to learn" can realize "presence."


    ## IV. Borderless Learning: "Desire to Learn" Realizes "Presence"


    In the intelligent era, under the conditions of multi-dimensional empowerment
    by intelligent technology, the "ubiquitous multi-space" attribute of education
    is significantly enhanced. The boundaries of education are gradually blurred and
    broken through. Traditional education gradually undergoes a paradigm shift—fields
    such as educational objects, educational resources, educational venues, educational
    forms, and educational content will all witness a battle of educational reform
    between "bounded" and "borderless." Borderless education is striding toward us,
    and borderless learning is gestating within it.


    With the development and finalization of borderless education systems, educational
    organizations, and educational management systems, the accompanying "borderless
    learning" has gradually entered people''s vision. Supported by intelligent technologies
    such as Big Data, the Internet of Things, Image Recognition, Speech Recognition,
    Natural Language Processing, Digital Twins, and Edge Computing, borderless learning
    has emerged independently from borderless education. The concept of borderless
    learning was first proposed by the British educational community. It refers to
    utilizing all learning platforms to provide learners with a learning environment
    where they can engage in learning activities at any location, any time, using
    any learning opportunities available at hand. Specifically, borderless learning
    includes borderless learning content, borderless learning methods, borderless
    learning fields, borderless learning resources, etc.


    With the continuous expansion of the connotation and extension of borderless learning,
    a paradigm shift has occurred from "classroom everywhere" to "learning everywhere."
    Borderless learning shifts the focus from educators to educational objects and
    places them at the center of research on educational activities. It further advocates
    a learning form where anyone (Anyone) can learn any content (Any Content) in any
    form (Any Format) at any time (Anytime) and any place (Anywhere), thereby making
    personalized, customized education oriented toward every individual possible.


    Borderless learning is the socialized extension of borderless education from the
    students'' standpoint, an excellent opportunity for educators to implement teaching
    students in accordance with their aptitude, and a "universal victory" for students
    in their struggle for the initiative in learning. According to the concept of
    borderless learning, since the student learning environment is no longer limited
    by factors such as learning time, location, content, and methods, learning activities
    and phenomena become "ubiquitous" and "omnipresent." Borderless learning means
    learning is everywhere, possessing three core characteristics: trans-spatiotemporal,
    human-machine integration, and personalization.


    ### Trans-spatiotemporal Characteristic of Borderless Learning


    The superiority of intelligent technology and its new shaping value, hand in hand
    with the development trend of student learning forms toward free learning forms
    that transcend spatiotemporal constraints, enable students to rely on intelligent
    learning terminals, smart wearable devices (AR/VR, etc.), and intelligent learning
    platforms to timely and effectively acquire learning resources across different
    time spans and spatial spans. They conduct learning and knowledge construction
    and integrate into them with a new learner identity. Through the use of intelligent
    terminal devices, they achieve a trinity of cross-border integration of "history—reality—future."
    Time and space, as the realistic carriers of learning activities and phenomena,
    their transcendence means the return of the learner''s "marginal" status. The
    ubiquitous multi-spatiotemporal learning form highlights the "borderless" attribute
    of borderless learning.


    ### Human-Machine Integration Characteristic of Borderless Learning


    The intelligent era is an era where technology empowers "all things." The intelligent
    characteristics of all things derive the intelligent characteristics of learning
    carriers. Before the arrival of the borderless learning society, the separation
    of learning carriers (intelligent learning machines) from learners, and the existence
    of barriers between humans and learning tools, limited the efficiency and channels
    for students to acquire learning resources. However, with the socialization and
    implementation of the borderless learning concept, the human learning process
    is mainly a process of interaction between humans and intelligent learning devices.
    From the student''s perspective, intelligent learning machines have become an
    important component of student learning activities. The integration of the carrier''s
    borderlessness, the borderlessness of the value carried by the learning machine,
    and the borderlessness of student learning determines the existence of the human-machine
    integration characteristic of borderless learning.


    ### Personalized Characteristic of Borderless Learning


    The origin of borderless learning essentially stems from the personalized appeal
    of people''s differentiated needs at the learning level. In the intelligent era,
    the intelligent and socialized borderless learning form can effectively respond
    to students'' personalized learning needs based on relevant intelligent technologies.
    With the maturity and integration of technologies such as intelligent data mining,
    intelligent feature extraction, intelligent recommendation algorithms, and intelligent
    precision pattern recognition, the intelligent borderless learning ecosystem has
    gradually formed within the construction of the borderless education system. At
    that time, the borderless learning system will follow the personalized development
    needs of students, centering on the personalized development of students, demonstrating
    the charm of personalized customized learning in the intelligent era.


    In the intelligent era, the transcendence of educational spatiotemporal boundaries
    welcomes the borderless development of education and learning. The personalized,
    trans-spatiotemporal, and human-machine collaborative characteristics of borderless
    learning push borderless education and borderless learning to the extreme of development—education
    is everywhere, classrooms are everywhere, learning is everywhere. In the "ubiquitous"
    education and learning environment, the objective conditions for learning have
    been met—"learning resources are extremely rich, learning time is extremely free,
    learning venues are visible everywhere."


    From a broad socio-historical background, as the degree of social technologization
    continues to deepen, social division of labor has begun to shift continuously
    from "refinement" to "integration." Social requirements for talent competency
    and literacy continue to rise. The overall talent demand trend shows a shift from
    "skilled workers" to "composite talents." Literacies such as data literacy, information
    literacy, and AI literacy must all be possessed. Against such an era background,
    individuals situated within it need to maintain an enterprising attitude and action
    towards learning at all times. Therefore, in the intelligent era, the satisfaction
    of the objective conditions of education and learning has laid an objective foundation
    for the learning of the vast majority of learners. The subjective willingness
    of learners, under the edification of social culture, should pay full attention
    to their own development, rather than being enslaved by technology.


    The intelligent era is an era of borderless education and learning. The passive
    status of learners is changed, and their subject status returns. At the same time,
    learners must also bear corresponding responsibilities. In a rapidly changing
    era, they must be responsible for their own future development and actively shoulder
    the major mission of "knowing oneself, developing oneself, transforming oneself."
    In the intelligent era, the unity of the subjective and objective aspects of learning
    makes "learning possible whenever one wants to learn." As long as students truly
    begin to think about themselves, the "presence" of learning will occur; as long
    as students want to learn, they can realize the presence of learning.


    ## References


    [1] Central Compilation and Translation Bureau. *Marx Engels Collected Works*
    (Vol. 47) [M]. Beijing: People''s Publishing House, 1979: 532.


    [2] Central Compilation and Translation Bureau. *Marx Engels Selected Works* (Vol.
    1) [M]. Beijing: People''s Publishing House, 1995: 294.


    [3] Central Compilation and Translation Bureau. *Marx Engels Collected Works*
    (Vol. 46) (Part 1) [M]. Beijing: People''s Publishing House, 1980: 221-226.


    [4] China Academy of Space Technology. Xi Jinping Promotes Comprehensive Development
    of Space Science, Space Technology, and Space Applications [OL]. [2016-06-01]
    http://www.cast.cn/Item/Show.asp?m=1&d=4472.


    [5] Shanghai Observer. AI Empowers Future Space: How Great is the Imagination
    of Intelligent Space Industrialization? [OL]. [2018-11-07] https://www.jfdaily.com/news/detail?id=115061.


    [6] Wu Tinglin. Boundary Dissolution and Multi-party Cooperation: Path Selection
    for Resource Allocation in Higher Vocational Education [J]. *Jiangsu Higher Education*,
    2018(01): 104-107.


    [7] Changchun Education Online. Yishiyan Galaxy''s Borderless Education: Creating
    Infinite Possibilities for Children''s Future! [OL]. (2018-11-25) http://www.sohu.com/a/277700567_700972.


    [8] Gong Le, Chen Shuo. Construction of Higher Education Resource Sharing Mechanism
    from the Perspective of Borderless Education Theory [J]. *Chinese Adult Education*,
    2017(17): 23-25.


    [9] Jianshu. Interdisciplinary? STEAM? Perhaps You Need to Understand Borderless
