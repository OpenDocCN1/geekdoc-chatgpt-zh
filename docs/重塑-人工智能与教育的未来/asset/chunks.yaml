    ![](img/txt003_1.jpg "pagenumber_ebook=50,pagenumber_book=40")

    ```


    Continued Table


    ```

    ![](img/txt003_2.jpg "pagenumber_ebook=51,pagenumber_book=41")

    ```


    According to statistics on the top 5 countries by number of Nobel laureates per
    category^[\[6\]](#txt003.html#footnote_content_txt003_6), the US ranks first with
    an absolute advantage. Other Nobel laureates come from the UK, Germany, France,
    Russia, Japan, Israel, Sweden, Spain, Switzerland, the Netherlands, Norway, etc.
    It is evident that China does not appear in the world''s top five for Nobel laureates.


    The data shown in Figure 3-1 reflects from one aspect that the gap between China
    and the world is not a tiny margin, but a huge distance. From the perspective
    of world population distribution, logically, China''s Nobel Prize data should
    be among the world''s top. But from modern times to the present, the above phenomenon
    is indeed surprising. The birth of the "Needham Question" and the "Qian Xuesen
    Question" in China must be related to this "anomaly."


    Viewing Chinese education from a global perspective, rethinking our education
    is imperative. In the intelligent era, China''s education should change this status
    quo. World-class innovative talents, great scientists, great philosophers, etc.,
    should also take root and sprout in China''s soil, and be able to grow vigorously
    with the support of the new era''s educational environment.


    In the new intelligent era, our education should rise to the challenge and catch
    up.


