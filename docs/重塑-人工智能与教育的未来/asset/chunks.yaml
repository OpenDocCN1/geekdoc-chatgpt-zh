- raw: "第一,大数据崇拜加剧教育者产生“潜在歧视”的风险。迈克尔·施拉格在哈佛商业评论的文章中指出,在理论和实践中,大数据将文化陈述和刻板印象数字化为经验可验证的数据集^([\\\
    [9\\]](#txt012.html#footnote_content_txt012_9))。数据分析技术正使用越来越强大的统计算法增强数据库的相关性,而从数据分析预测的关于个人品格与行为的推论可能存在着误导性,即“大数据将以良莠参半的方式统治我们”^([\\\
    [10\\]](#txt012.html#footnote_content_txt012_10))。第二,大数据也会对学生产生不良影响。由于大数据不会遗忘,数字足迹、数字身份、数字标签反过来成为限制学生进步、成长和改变的因素,学生在寻求个人的成长中无形会受到阻碍和束缚。因此,如果教育者沉溺或迷失于海量的个人数据,最终将产生片面、固化及不公正的判断,影响学生身心健康的发展。\n\
    \n4.教学效果较差\n\n随着个性化教育的需求不断增加,信息技术和人工智能的进步使个性化教育系统的数据呈现爆炸式增长。然而,目前可用的个性化在线教学平台存在较大的不足和局限性,挑战着学习者的学习与认知能力,易导致教学效果较差的问题。\n\
    \n第一,由于缺乏传统课堂的互动,学习方法和认知能力之间的差异导致学生学习进度的差距日益凸显。如果在线教学平台只是将传统线下的教育模式搬上互联网,那么这种缺少实时互动、个性化的教育模式仍然是“填鸭式”教育。当个性化教学内容不能有效进行,则会出现高辍学率。第二,碎片化、爆炸式的海量信息占据学生有限的时间与精力,会导致其学习与认知的困境。碎片式的学习方式影响着学生专注度的保持,而海量的信息资源则使得学生的大脑疲劳,认知的超负荷则会挫败学生学习的信心与动力。尼古拉斯·卡尔在《浅薄》中提到,当我们把记忆任务推卸给外部数据库,从而绕过巩固记忆的内部过程时,我们就会面临掏空大脑宝藏的风险,进而危及个体的深度和独特个性和我们共享的社会文化的深度和独特个性^([\\\
    [11\\]](#txt012.html#footnote_content_txt012_11))。第三,缺少有效管理和监督。一些学生,尤其是中小学生,由于自制力较差,如果没有老师的有效管理和监督,在学习中易受社交软件、视频娱乐、网络游戏等影响而分心,导致学习效果不佳。\n\
    \n5.教育观念滞后\n\n面对具有个体差异性的学生群体,教育体系仍充斥着流水线式、填鸭式的教育模式、过时的思维方式和教育观念以及固化的教学进度,最终产出一批批同质的学生群体,无法适应大数据和人工智能时代对于人才需求的转变。\n\
    \n第一,大数据对思维方式的影响,强调相关关系,忽略因果关系。英国大数据专家维克托·迈尔·舍恩伯格认为,大数据时代的一个最重要变化是从因果关系变向相关关系,再也不需要从事实中寻找缘由,而是要从看似无关的数据中找到某种相关关系。然而,过度强调相关关系,忽略因果关系,不足以解决问题的根本。教育以培养人为根本目的,不仅要“知其然”,更要“知其所以然”。唯有洞察到教育问题产生的本质原因,才可能从根本上寻求解决之道^([\\\
    [12\\]](#txt012.html#footnote_content_txt012_12))。第二,大数据对教育观的影响。部分专家过高地估计大数据对人才培养的影响,事实上,大数据为个性化教育、人才培养提供了一个良好的工具、途径。但是个性化教育、因材施教的教育观念不仅仅取决于学校,家庭和社会在人才培养方面扮演着举足轻重的角色。个人的发展、成长是家庭、学校和社会等多方面因素综合作用的结果。第三,大数据时代对传统的教育方式提出了挑战。知识裂变的时代使获取知识的固有体系发生了重要转变。如今,教育衰落的根本原因是教育者往往忽视了学生认知改变所导致的知识获取的变化,数字移民教师正以过时的语言(前数字时代的语言)去教授一群说全新语言的学生^([\\\
    [13\\]](#txt012.html#footnote_content_txt012_13))。第四,面对新的教育背景,孤立的教育管理模式正在制约个性化教育的发展。此外,对于个性化教育的研究往往局限于国际教育机构或者教育组织,缺乏基于国家层面或者跨学科协作的研究与实施,导致个性化教育往往流于形式,难以付诸实践。\n\
    \n6.隐私安全挑战\n\n大数据开放共享在增强个性化教育的同时,也陷入教育数据泄露噩梦中,引发了大数据收集的伦理问题。数据隐私、安全和所有权问题正对个性化教育提出额外的挑战。法国巴黎商学院将计划使用“情感识别系统”来衡量学生在课堂与学习网站的注意力,这有助于提高大量开放在线课程中学生表现并改善教师的教学效果。但也使越来越多的人开始对学生数据的处理方式提出疑虑,巴黎校园内更出现了示威活动^([\\\
    [14\\]](#txt012.html#footnote_content_txt012_14))。除此以外,大数据所带来便利之处使人们忽视其对学生隐私与安全带来的危害。美国的教育大数据公司InBloom运行了15个月便关闭,主要原因是其在教育数据开放过程中对隐私措施的疏忽,致使安全问题的发生。路透社报道说,这个1亿美元的数据库不断跟踪学生的兴趣、学习障碍、考试成绩甚至是家庭作业的完成情况,包括收集从适应性少儿数学学习网站Dreambox和可汗学院等学习网站上所产生的学生数据。联邦法律允许其“与销售教育产品和服务的私人公司共享其数据库部分档案”,导致数百万名儿童的姓名、地址、社会安全号码以及学习信息被泄露。最终该计划在2014年趋于崩溃^([\\\
    [15\\]](#txt012.html#footnote_content_txt012_15))。可见,在教育方面,大数据虽是一笔宝贵的教育财富,但是如果保护不当则会带来严重的安全问题和社会问题。\n\
    \n(三)利用大数据推进个性化教育的新路径\n\n分析大数据对个性化教育带来影响和问题,有助于我们理性看待和合理应用包括大数据在内的新一代信息技术和人工智能技术对推进教育现代化的作用,抢抓机遇,推进个性化教育发展,培养新时代需要的全面发展的人才。\n\
    \n1.保持理性思考\n\n基于大数据的个性化教育热度在持续上升的同时,需要保持理性思考,克服技术依赖与数据崇拜。为在大数据时代保持理性思考,需选择适应于个人的学习方式,学会掌握新的学习方法。苏伽特·米特拉认为在今后的大数据时代,只有三种最基本的能力是青少年用得到和必须学的：一是阅读,二是搜索,三是辨别真伪^([\\\
    [16\\]](#txt012.html#footnote_content_txt012_16))。也就是说,汲取、获得知识的能力、价值观的培养以及批判性思维的形成在当今更为重要。首先是要培养保持阅读的习惯。应在屏读时代培养良好的阅读习惯和方式,把纸质阅读与数字化阅读相结合,提升阅读的广博与深度。其次要提高信息搜索能力与决策能力。为防备便利的大数据链接使个人探索资源、链接资源能力的退化问题,应有意识地发掘与提升自身的搜索和逻辑决策能力,让新技术成为解放个人能力与天分的工具,学会在数据海洋中搜索与辨别真伪的能力,有选择地借鉴与吸收。最后是充分利用信息技术的便利性,主动适应大数据时代的学习特点、学习方式,学会移动式学习、娱乐式学习与社交式学习等。\n\
    \n2.创新教育思维\n\n面对这种新的、爆炸性增长的新一代信息技术和人工智能技术,大数据之于个性化教育更为重要的是思维的转变。教育者应按需且不断寻变,注重持续学习以缩小与数字土著民的鸿沟,拥抱大数据与智能机器,真正实现教育理念之革新。\n\
    \n第一,教育要以学生为本,尊重学生的主体性。尊重学生的主体性,以生为本并不排斥教师的导向作用,而是需要教师了解和掌握目前学生思维方式的变化,在相关思维、主客观思维、过程思维和经验思维的指导下,注重掌握、整合、处理、挖掘与利用大数据以适应新的教育发展背景,以学生发展为本,充分发挥学生潜能。\n\
    \n第二,重视培养创新精神和全面个性发展。学生是最活跃、知识最密集的群体,在大数据环境下,学生的思想观念、思维方式和行为方式受到了深刻的影响,需要树立以创新人才培育为导向的个性化教育理念,不断创新教育模式。充分尊重学生的个体差异,了解学生的个性特点以采用科学合理的教育观念、教学方法,培养学生发散思维、横向思维,克服思维定式。第三,形成终身学习的观念。随着大数据和人工智能时代的来临,计算机、网络和通信技术的全面覆盖,大量的信息数据生成,人们若是拒绝接受新思想、新观点、新技术,将很可能落后,被社会所抛弃。因此,应转变学习与教育思维,提高数据素养,主动拥抱大数据与智能机器等新工具、新技术。人们如何在信息环境中更好地开展个性化教育工作,还需要不断学习、更新理念、进一步探索和实践。\n\
    \n3.发展大数据技术\n\n在大数据浪潮下,探寻个性化教育路径首先要发展大数据技术。第一,要遵循顶层设计,建立健全教育大数据行业标准与规范,以保障教育大数据采集、存储、应用、共享等的规范性,规范所有教育数据管理平台的数据指标,以便各平台对数据的有效对接,实现各平台数据的融合共享,为后期深度挖掘与分析做好准备。第二,大数据时代真正的革命在于如何运用数据。因此,要进一步增强整合教育数据的能力,提升探索数据背后的价值和根据数据作教育决策的能力。借鉴国际上教育大数据应用方面的经验以此推进我国教育大数据应用的深入发展;提炼总结有价值的教育大数据运用模式与案例,指导全国各地教育行政部门、学校、教育培训机构等合理应用教育大数据;通过对教育大数据的分析,了解教育发展中的不足和现实需求,并制定教育政策和教育策略。第三,要推动教育服务个性化平台建设,利用大数据搭建满足师生所需要教育资源的平台,创建个性化的数字化资源,将数字化资源和个性化教学资源有机结合起来,设计一个利于搜索的工具平台以保证学生能有效获取知识,实现自主学习和个性化学习。\n\
    \n4.加强人才培养\n\n大数据时代下,教育的改革和个性化教育的发展,不仅需要先进的大数据技术,还需要大数据研究者与实践者敏锐的洞察力和专业能力。因此,加强人才培养是当务之急。首先,建立一支专业化、信息化的师资队伍是实现个性化教育的保障。这就要求教育者要适应时代发展的要求,加强信息化技能培养,创新教学理念和教育方法,依托大数据技术,了解学生的学习情况和学习需求,从而为学生量身打造个性化教育方案,实现学生的全面发展。其次,推动大数据技术的应用和发展,需要培养一批懂大数据、具备大数据采集、分析、处理技术能力,并且善于研究大数据、挖掘大数据的人才,并将数据挖掘、数据分析、人工智能、可视化等先进技术与教育现实问题相结合。因此,跨学科的专家团队在教育数据挖掘、学习分析和视觉分析应该协作设计和实施研究,高等教育机构应建立新的跨学科研究生课程,以培养此专业领域的数据科学家^([\\\
    [17\\]](#txt012.html#footnote_content_txt012_17))。另外,还应组织教育学、管理学、计算机科学、统计学等多学科的研究人员建立专门的教育大数据研究所,集中优势力量解决教育大数据应用过程中存在的问题,同时结合教育发展开展战略性研究,使其成为国家教育大数据发展的智力宝库。\n\
    \n5.注重多方协作\n\n教育界应创新思维,把常规的教育数据挖掘和新的学习分析结合在一起,注重多方协作,推动个性化教育生态系统的创建。第一,注入人文关怀。在利用大数据技术驱动个性化教育的过程中,增加对学生情感价值、认知方面教育的投入。教育针对的是学生的一生,不只是包含技能和知识的学习,还包含价值观、性格塑造以及公民参与,应让人们真正参与到教育之中并且从中受益终生。把人文关怀注入大数据发展中,处理好人与数据、人与智能机器、价值理性与工具理性之间的关系,彰显数据的温度。第二,加强“家校”合作机制。个人的成长、成才是家庭、学校、社会等多方面因素共同作用的成果,个性化教育的实现也需要家庭、学校和社会的共同参与和配合。首先要扩宽沟通渠道,利用网络平台提高沟通效率,实现有效的双向沟通,了解学生的真实情况;其次,转变家长过分重视成绩的观念,增加对学生心理健康、身体素质、兴趣爱好和创新能力的关注,变应试教育为素质教育和创新教育;最后,家长要提高对学校的关注度,了解学校对促进学生发展的各项措施,提高“家校”合作共育的效果。\n\
    \n6.重视数据隐私\n\n隐私受侵犯已成为大数据驱动个性化教育发展之壁垒。因此,教育工作者和数据开发人员必须谨慎对待学生数据,高度重视数据隐私在大数据与个性化教育长期发展中的重要作用。\n\
    \n首先,重视个人数据隐私与安全。第一,举办保护数据隐私活动。早在2009年,美国图书馆协会知识自由办公室便开始举办选择隐私周(CPW)活动,“选择隐私周”的目的是鼓励对话,提高人们对大数据时代隐私问题正日益增长的认识^([\\\
    [18\\]](#txt012.html#footnote_content_txt012_18))。第二,树立责任意识,加强数据道德修养。每个人都是社会建设的一员,在数据的开放共享带给我们便利的同时,我们也要自觉承担数据保护的责任,提升自身的数据道德修养,尊重他人数据、保护他人数据,坚持在道德规范的约束下运用大数据技术,提高数据的安全性和可靠性,使大数据更好地为人类办事、服务。\n\
    \n其次,利用技术手段保护隐私。在大数据时代,不管是告知与许可、模糊化还是匿名化,这三大隐私保护策略都失效了^([\\[19\\]](#txt012.html#footnote_content_txt012_19))。因此,加强保护隐私的技术显得特别重要。第一,高等教育机构应致力于创建诸如数据恢复软件、防火墙、加密和防病毒等软件以减少丢失或大数据被操控的风险。第二,利用双向监控技术。即数据从采集到使用都需要双向知情,数据的采集者与使用者(偷窥者也是一种特殊的数据使用者)也需同样被监控^([\\\
    [20\\]](#txt012.html#footnote_content_txt012_20))。加强数据监控,保护信息安全。\n\n最后,制定相关的法律法规。为了更好地保护数据隐私安全,美国在《家庭教育权利与隐私法案》中提出要保护学生的教育数据安全和信息隐私;英国颁布了《数据保护法案》,加强对个人数据权利的保护。尽管我国也通过《网络安全法》《电子商务法》《关于加强网络信息保护的决定》等法律法规来保护数据隐私安全,但与西方先进国家相比,我国关于个人数据隐私的相关法规还不完善,存在着法律规范不明确、惩罚制度不完备、内容不清晰具体等问题,而且对教育领域隐私保护问题的研究也十分有限。因此,相关部门必须意识到教育大数据的应用会面临道德和信任的双重挑战,并制定相关的法律法规,对不法应用、侵犯用户隐私与国家安全的单位或个人进行惩罚,切实保障个体、机构、国家的教育数据安全。\n\
