    # 第八章 智慧校园：教学与管理的智能化


    - 缘起与思路：智慧校园的历史与未来

    - 应用与服务：智慧校园无处不智能

    - 未来的教室：关于智慧课堂的构想

    - 离散到系统：智慧校园的建构策略


    自20世纪70年代至今,智慧校园建设历经工业时代、信息时代与人工智能时代等。不同的时代,由于新兴技术的塑造力量的差异,塑造了形态各异的智慧校园。校园是社会的缩影,智慧校园是智慧社会的缩影。人工智能时代,智能技术不会全权代替校园管理工作,但相较于不使用人工智能的学校而言,使用人工智能技术于教学管理活动的学校注定能够在未来的教育系统中为培养人才作出更大的贡献。


    ## 一、缘起与思路：智慧校园的历史与未来


    20世纪70年代,美国麻省理工学院结合当时的时代背景,提出了“电子化校园”计划,成为“智慧校园”的雏形。到20世纪80年代,受国外“智慧校园”建设的影响,我国也启动了校园信息化建设工作。1990年,美国克莱蒙特大学教授Kenneth首次提出“数字校园”的概念,受到极大关注,成为世界上许多国家进行校园升级改造的核心理念。截至目前,校园的技术化转型升级大致经历三个阶段：电子化阶段、数字化阶段和智慧化阶段。


    2010年,在我国信息化“十二五”规划中,浙江大学提出要建设一个“令人激动”的“智慧校园”^([\[1\]](#txt008.html#footnote_content_txt008_1))。2017年,《国家教育事业发展“十三五”规划》指出：“要支持各级各类学校建设‘智慧校园’,综合利用互联网、大数据、人工智能和虚拟现实技术探索未来教育教学新模式。^([\[2\]](#txt008.html#footnote_content_txt008_2))”2018年,《智慧校园总体框架》国家标准发布,专门对我国的“智慧校园”建设进行了框架建构和政策指引。


    “智慧校园”是指综合运用局域网、移动互联网、物联网、大数据、云计算、人工智能等新兴技术,全面智能感知、协调、控制与智能服务于学校的教学活动与管理活动,改善学校的行政办公与教学形态的基础,从整体上提升校园的智能化与智慧化程度,在智能技术的支撑下,使校园的整体运行模式呈现灵活性、精准性与高效性等特征。


    智慧校园是传统校园的延伸和发展,它在物理空间上延伸了传统校园的陈设和布局,两者在硬件设施方面有较大的相似性。但从发展层面而言,智慧校园与传统校园最大的不同在于软件设施建设方面。软件设施是校园中“智慧”的真正来源,它在原本的校园物理运行空间中取代部分工作人员的工作,甚至是取代工作人员的智慧,并在运行效率和运行质量上具有显著的超越价值,从而带动各级各类学校进行改革,智慧化与智能化成为校园转型升级的主导方向。


    那么,人们为什么要进行全社会的校园智慧化建设与改革呢?究其原因,不仅在于智慧校园本身的价值,而且在于传统校园的局限性,因为传统教育本身存在限制人才发展的因素。


    校园,没有固定的模式,在不同的时代背景下表现为不同的形式。校园1.0时代,代表着最为传统的教育形态,人与人之间的教育活动主要通过“口口相传”的形式进行,那时的校园没有固定的时空限制,或者说不称其为“校园”。


    随着社会生产力的发展,国家的统治和社会工业化都需要大批的专业技术人才,而在传统的校园1.0时代成长起来的人,不能迅速适应工业时代的发展需求,因此导致了校园2.0时代的迅猛发展。这个时期的校园,规模不断扩大,可谓是“集天下英才而教之”的典型场所,为社会的发展培育了众多的专业技术人才。


    在校园2.0时代,教育教学模式讲求的是能够快速为社会的发展培养出足够多的人才。所以,班级授课制得以盛行,但也造成了学生与学生之间的差别很小,相同的教育模式,同样的教育标准,不同的学生成为一个模子出来的“成品”,创新精神和批判精神成为校园2.0时代培育出来的学生所匮乏的东西。


    人工智能时代是一个创新发展的时代。“创新是一个民族进步的灵魂,是一个国家兴旺发达的不竭动力。”青年学生作为国家未来的建设者和接班人,校园2.0模式已然不能适应社会对创新人才的需求,缺乏创新精神和批判精神的校园,其本身的存在就是不合理的。


    在这样的时代背景下,智能元素不断渗透进校园,并与校园建设工作进行结构嵌套,产生了校园3.0时代。在校园3.0时代,校园中的学生成为整个校园的中心,校园的软件设施和硬件设施都将集中考虑学生的个性化需求。所以,智能化与智慧化的校园转型升级工作势在必行。


    建设智慧校园,缘起于社会发展的需要和学生个性化发展的需求。由于传统校园的发展不能继续有效地满足时代的“双重需要”,人们就开始将发展的眼光投向智慧校园,从而掀起了智能时代的智慧校园建设的热潮。


    在需求的拉动和政策的推动下,智慧校园建设如火如荼。如今,智慧校园的发展已经进入广泛应用阶段,形成了多元化、精细化与泛在化的发展格局。发展的过程正在经历“由点到线,由线到面”的迅速转化,其应用与服务已基本实现校园全覆盖,包括校园安全、教学管理、图书馆管理与学生成绩管理等场景。


    人工智能时代,未来智慧校园建设,需要对其发展进行超前布局,提前做好发展的战略规划,不断促进智慧校园建设的规范化与个性化同步发展,不断促进智慧校园管理科学化与服务精准化并驾齐驱,精准定位智慧校园建设的工具性价值与思想性价值。得益于智能技术的赋能,智慧校园获得“智慧”。作为学生成长的重要场所,智慧校园应该成为启发学生智慧的场所、促进学生人格完善的场所、成就学生的场所,是学生生命中的“成长乐园”。


    ## 二、应用与服务：智慧校园无处不智能


    智慧校园的全场景应用与全场景服务,是指校园内各项现实的组织机构与服务活动在智慧校园系统平台上的虚拟映射。“集中管理”与“统一领导”成为应用过程的指导思想,它旨在将现实校园中的所有教学与管理活动都搬到平台上进行。最直接的表现就是,校园中所具有的活动实体,智慧校园中就有与之相对应的数据与场所。


    智慧校园的全场景应用与服务,包括校园安全管理、图书馆管理、教学管理、教师团队管理、社团管理、校园照明、校园一卡通等。目前,智慧校园的应用已经实现校园全覆盖,基本的校园配套服务都与新兴技术相联系,在“智慧”层面展现巨大张力,其具体的典型应用场景如下。


    ### (一) 人工智能与校园安全管理


    社会公共安全的重要性不言而喻。2019年5月,习近平总书记在全国公安工作会议上讲话时指出,“要确保公安工作坚定正确政治方向,坚持改革创新,坚持全面从严管党治警,按照对党忠诚、服务人民、执法公正、纪律严明的总要求,锻造一支让党中央放心、人民群众满意的高素质过硬公安队伍……从严治警一刻都不能放松。要坚持政治建警、全面从严治警,着力锻造一支有铁一般的理想信念、铁一般的责任担当、铁一般的过硬本领、铁一般的纪律作风的公安铁军^([\[3\]](#txt008.html#footnote_content_txt008_3))。”从党和国家对安全问题的关注角度来看,他们对社会公共安全问题高度重视,并要坚持打造“一支让党中央放心、人民群众满意的高素质过硬公安队伍”,这无疑突出社会公共安全问题的紧迫性与突发性特征,党和国家时刻准备着应对安全问题。安全问题具体包括食品安全、卫生安全、生产安全、经济安全、心理安全与社会治安等。


    校园安全是社会公共安全的重要组成部分,关系到千家万户的安全与幸福。根据2018年、2019年“中国平安小康指数”调查数据显示,校园安全问题已被列入“最让公众担忧的十大安全问题”排行榜(如表8-1所示),2018年、2019年分别位列第5位和第7位。


    **表8-1 “最让公众担忧的十大安全问题”排行榜**


    ![](images/txt008_1.jpg "pagenumber_ebook=122,pagenumber_book=112")


    (资料来源：中国小康网.2018年、2019年中国平安小康指数：最让公众担忧的十大安全问题\[OL\].http：//www.sohu.com/a/239248333_426502;http：//mini.eastday.com/a/190709153848239.html)


    近两年,公众对校园安全的担忧并不是无中生有,而是事出有因。如今,有些地方的校园,一些“调皮捣蛋”的学生或“街头混混”,在校园里带头煽动部分学生闹事,并打砸拆卸校园门窗、报亭等设施的现象依然存在。更为恶劣的是,一些邪恶分子还将矛头对准弱小的学生,对这个群体进行暴力袭击,由于性质极其恶劣,从而升级为校园暴力事件。


    校园安全问题,不止于校园暴力隐患一个方面,校园欺凌事件也不容忽视。2019年4月9日,一个40秒的“女初中生打架”的视频在网上“疯传”。视频显示,一个人烟稀少的小巷,两名身穿校服的女初中生正在互殴,更准确地说,是其中的一个女生疯狂欺负另外一个女生,还不时用污秽的语言侮辱对方。并且旁边拍摄视频的学生,还不时传来嬉笑的声音。可见,校园欺凌的事态较为严重。


    校园安全事件,不仅包括校园暴力、校园欺凌事件,还包括校园交通安全事件、校园食品安全、校园火灾、校园不安全设施等。这些事件的存在都有一个共同点,它们都会对学生造成不同程度的伤害。这种校园安全事件如果得不到及时消除,就会很快影响到整体的校园安全环境。譬如,正在发生的校园欺凌事件,如果学校和家庭不及时出面化解矛盾,很容易演变为校园的群体性事件,学生“拉帮结派”进行互殴,其后果是难以想象的。


    校园安全是指全体师生在校期间,不会受到来自环境和他人的威胁和危害,全体师生也不会成为威胁和危害他人的人,从而保持一种相对安全的状态。智慧校园建设,校园的安全建设应该摆在首位。因此,建设智慧校园,应遵循“安全第一”的原则,全面开展校园的安全治理工作,以保证全校师生最基本的生存需要与安全需要能够得到满足,而不让师生时刻处在不安全的恐慌之中。


    为了给校园全体师生一个和谐、安全的环境,有必要思考在推动构建智慧校园的过程中,有效利用大数据、人工智能等新一代科学技术辅助校园安全管理工作。人工智能技术是一个技术集成系统,是技术高度综合化的表现,其中包含多种多样的子技术,视频识别技术便是其中之一。智能时代,在智慧校园内安装覆盖全校的摄像头,是校园安全的重要保障。安装全覆盖的摄像头,其目的不在于监控,而在于让可能出现的“黑暗”暴露于阳光之下,呈现给管理者,从而让校园的各个角落成为可视化的视频数据集合,揭露“隐蔽”的校园安全问题。校园摄像头录像,安装于电梯、出入车辆、厕所附近、校园建筑楼顶,以及各种行人经过的地方,目的就在于提高校园的安全性。


    引进智能视频识别技术之前,很多学校已经建立起最基本的监控网络,为后继智能技术的引入奠定基础。在传统的校园监控网络中,所收集到的只是庞杂的监控数据,还需要投入大量的员工人为分析数据,而不是系统自动分析数据。也就是说,原有的监控系统并不具备智能识别、预警、视频摘要等功能,这就需要对安保监控网络进行升级,引入智能视频监控云系统,在安保监控视频的基础上增加智能识别功能(如车牌识别、人脸识别、异常行为识别等),并把视频摘要推送到云端以供搜索^([\[4\]](#txt008.html#footnote_content_txt008_4))。这样,发生在校园内的异常行为数据,就能够在第一时间实现预警和控制。


    人工智能视频识别技术是基于人工智能机器的自动化与智能化的辨别与标识技术,与传统的视频监控技术相比,具有视频内容审核效率高、音频有害信息发现快等优势。因此,校园智能视频监控云系统的存在,无疑将有利于提升智慧校园整体的安防系统能级,进一步切实保障校园安全。


    谈及校园安全问题,不得不谈校园流感引发的学生健康问题。校园是大量人群集结的地方,流感一旦爆发,传播速度极快,辐射能力很强,对此应该重点把控。根据谷歌流感预测模型可知,引入人工智能技术,有利于提前预警校园流感发展趋势。2017年,中国平安与重庆疾病中心联合成功研发全球首个人工智能流感预测模型。经实践检验,该模型能够提前一个星期预测到流感的发展趋势,极大提高了流感预测的效率与预警的应对能力。流感和手足口病预测模型的准确率均达到86%以上,高发季预测准确率可达到90%以上;应用慢阻肺智能筛查模型,可大幅减少筛查成本,提高筛查效率。目前,该模型的准确率已经达到92%。可见,若是在智慧校园建设过程中,嵌套人工智能流感预测模型,势必能够进一步提高校园流感预测的能力,实现流感的校园监测和提前备案,并启动应对方案,学校、家庭、疾病防控中心协同联手,共同还给孩子们一个健康的学习环境。


    人工智能技术运用于校园安全管理,其高效而精准的工作不仅可以提前识别校园异常行为,而且还能及时发现校园危险情景,并实现智能提醒与提前预警,实现从源头消除校园安全隐患。不管是智能流感预测模型,还是校园智能监控识别系统,都是人工智能技术在校园安全中的应用形态,切实关系校园安全与全校师生的身心健康。


    从目前来看,人工智能技术嵌入智慧校园还应注意几个方面的协调工作。一方面,要注重人工智能专业人才队伍的培养,校园安全系统的模型优化需要很高的智能技术水准,并非一般的技术工人能够胜任。另一方面,校园的智能化、智慧化升级是一个系统工程,需要单独升级校园安全预警的智能能级,这会牵涉诸多不确定性的因素,需要做好相关的协调工作。在协调的过程中,已经不仅仅限于校园安全管理部门,而是涉及整个软硬件设施的升级改造。因此,需要建立“上下联动”“左右协调”的部门协调机制。


    ### (二) 人工智能与图书馆管理


    如今的大学校园,图书馆已成为学习场所的代名词：去图书馆“借书看书”“找资料写论文”“课题讨论”等,构成大学生的一项必备活动。新时代的校园图书馆的技术化管理——智慧图书馆,确实给学生提供了一个极佳的学习环境,既便于查找纸质图书资料,又便于查找电子资料。与传统图书馆相比,优势明显。


    传统的图书馆,全部图书资源皆以纸质版为主,书籍文献体积巨大,占用的空间很多,且开放图书馆时图书的摆放位置、书籍的搬运、排序等工作都需要大量的人工。此外,学生出入图书馆需要人工进行身份验证,借阅书籍需要手动输入图书借书登记,服务质量很容易受到人为因素的影响(图书馆的工作人员的情绪,很容易影响到学生对图书馆的印象)。另外,传统图书馆的馆藏资源的检索较为困难,资源获取的速度很慢,很容易影响学生的学习兴趣。


    为改变这种状况,在智慧校园建设的过程中,就要重新塑造图书馆形态。如何应用新兴技术改善图书馆的服务质量、提高学生对图书馆的美好体验,成为智慧校园建设的重要问题。


    2018年3月中旬,第29届北京教育装备展示会在京举行,会议通过专家论坛、企业案例分享、校园案例分享等方式各展风采,信昇达教育就“智慧图书馆方案”进行汇报,提出《RFID图书馆方案》,方案蕴含丰富的智慧图书馆建设智慧。通过运用RFID技术,实现书架、标签、图书与位置的绑定,全面实现对图书馆目录、检索、统计、书籍的查阅与流通等整体信息的智能化管理与服务。智能书架、智能点检车、馆员工作站、自动借还书机、移动还书柜、智能办证机、RFID安全门禁、OPAC查询机、高频层架标签、智能导航系统、RFID图书标签、监控摄像头、智能书架等技术,覆盖整个图书馆应用场景,给图书馆的运营带来了高效管理、便捷实用、数据可视化、个性化定制图书等价值。


    智慧图书馆是传统图书馆的延伸和发展,它从根本上延伸了图书馆的服务时间和空间,从观念上重新定义了图书馆的存在,甚至已经延伸到基于智能技术的共享领域。近年来,“共享文化”在社会上空前盛行,共享单车、共享汽车、共享充电宝、共享平台、共享数据等横空出世。正是如此,“共享”一词成功入选“2017年度中国媒体十大流行语”。共享文化的社会渗透,并未只停留在以上领域,而是继续横向发展,图书馆的发展也受其影响——共享图书馆应运而生。2018年6月,长沙首家共享图书馆诞生,该图书馆旨在倡导“图书共享、全民阅读、共同参与”的文化氛围,将图书馆打造成集阅读、培训、展览、举办论坛等多功能于一体的综合性图书馆,市民朋友在此可免费阅读、休闲,企事业单位也可在此举办培训、展览等公益性活动。


    与此同时,“微信小程序+IC借阅卡+指纹识别+人脸识别开柜借阅+消毒系统+捐书系统”等配套服务功能,助力智能共享图书柜的产生。根据洛唐科技研发的智能书柜可知,智能共享图书柜本质上是一种无人共享书柜,是一种通过智能柜来实现自助借还图书的共享书柜。读者不仅可以通过智能书柜自助借还图书,还可以通过微信预约借书,十分方便快捷^([\[5\]](#txt008.html#footnote_content_txt008_5))。


    由此可见,人工智能技术在智慧图书馆中的运用如火如荼,应用的形式较为多样,有智慧图书馆、智能共享书柜、智能共享图书馆、智慧档案馆等;在具体的技术结合方面,包括智能书架、智能导航、智能标签等。人工智能技术与图书馆结合,催生图书馆的新形态,使图书馆在批判继承传统图书馆的过程中,逐渐走向信息化与现代化。


    在人工智能与图书馆相结合的应用案例中,智慧图书馆的概念逐渐明朗。智慧图书馆是指将互联网、物联网、大数据、人工智能等新一代信息技术运用于图书馆的管理、规划与建设中,使革新后的图书馆成为管理与服务高度智能化的图书资源集结地。从时空观的角度来看,因为得到智能技术的赋能,很多“7+24图书馆”得以正常运行。可见,智慧图书馆是一个不受时间和空间限制的场所,一旦建成,用户可以随时随地进入图书馆进行资料检索与下载,非常方便。


    从目前的发展趋势来看,智慧图书馆的价值主要表现在这几个方面：首先,智慧图书馆可以在最大程度上实现图书资源的循环利用,信息阻塞导致的图书资源浪费问题减少;其次,智慧图书馆可以减少管理与服务的人工成本,节省建设和维护的费用,从整体上提高图书馆的服务质量,提高用户的积极体验度;最后,图书馆的图书资源丰富、资源密度大、物理体积小,占用的图书馆空间资源少,有利于将更多的空间用于布局学习场景。

