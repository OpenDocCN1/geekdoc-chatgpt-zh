    ## Clauses 27-44


    27. Promote gender equality in the development of AI tools, support AI skills
    training and application empowerment for girls and women, and advance gender equality
    in the AI labor market and among employers.


    28. Recognize that AI applications may carry various types of biases, which are
    inherent in the data used and input for training AI technologies, as well as in
    the construction and use of processes and algorithms. Recognize the dilemma between
    open access to data and data privacy protection. Note legal issues and ethical
    risks related to data ownership, data privacy, and data availability serving the
    public interest. Note the importance of adopting ethical, privacy-respecting,
    and safety-by-design principles.


    29. Test and adopt emerging AI technologies and tools to ensure data privacy protection
    and data security for teachers and learners. Support sound, long-term research
    on profound ethical issues in the field of AI to ensure the beneficial use of
    AI and prevent harmful applications. Formulate comprehensive data protection regulations
    and regulatory frameworks to guarantee the ethical, non-discriminatory, fair,
    transparent, and auditable use and reuse of learner data.


    30. Adjust existing regulatory frameworks or adopt new ones to ensure the responsible
    development and use of AI tools for education and learning. Promote public debate
    on issues related to AI ethics, data privacy and security, and the negative impacts
    of AI on human rights and gender equality.


    31. Note the lack of systematic research on the impact of AI applied to education.
    Support research, innovation, and analysis on the impact of AI on learning practices,
    learning outcomes, and the emergence and validation of new forms of learning.
    Adopt interdisciplinary approaches to research AI applications in education. Encourage
    transnational comparative research and cooperation.


    32. Consider developing monitoring and evaluation mechanisms to measure the impact
    of AI on education, teaching, and learning, in order to provide a reliable and
    solid evidence base for decision-making.


    33. Based on data voluntarily submitted by countries, monitor and evaluate the
    AI divide and imbalances between countries, and note the risk of polarization
    between countries that can access, use, and develop AI and those that cannot.
    Reaffirm the importance of addressing these concerns, and give particular priority
    to Africa, Least Developed Countries, Small Island Developing States, and countries
    affected by conflict and disaster.


    34. Within the framework of the global and regional "Education 2030" architecture,
    coordinate collective action to promote the equitable use of AI in education through
    means such as sharing AI technologies, capacity-building programs, and resources,
    while giving due respect to human rights and gender equality.


    35. Support forward-looking research on cutting-edge issues related to the impact
    of emerging AI developments, and promote the exploration of effective strategies
    and practical models for leveraging AI to drive educational innovation, with a
    view to building an international community sharing a common vision on AI and
    education.


    36. Ensure that international cooperation organically aligns with the needs of
    countries in the development and use of AI in education and cross-sectoral cooperation,
    so as to strengthen the autonomy of AI professionals in AI technology development.
    Enhance information sharing and exchange of promising application models, as well
    as coordination and complementary collaboration among countries.


    37. Through mechanisms such as UNESCO Mobile Learning Week and with the assistance
    of other UN agencies, provide appropriate platforms for countries to exchange
    regulatory frameworks, normative texts, and regulatory approaches in the field
    of AI in education, thereby supporting and benefiting from South-South and North-South
    cooperation in harnessing the potential of AI for Sustainable Development Goal
    4.


    38. Establish multi-stakeholder partnerships and mobilize resources to narrow
    the AI divide and increase investment in the field of AI in education.


    39. Establish an "AI for Education" platform to serve as an information exchange
    hub for open-source AI curricula, AI tools, AI in education policy examples, regulatory
    frameworks, and best practices, with a view to promoting the use of AI for Sustainable
    Development Goal 4, supporting debate on the future of education and learning,
    and making open-source AI resources and curricula accessible to all.


    40. Develop AI in education guidelines and resources based on consultations with
    Member States, to support Member States in formulating policies and strategies
    that promote the effective and equitable application of AI in education. Support
    relevant capacity building for education policymakers.


    41. Strengthen UNESCO''s leading role in the field of AI in education by strengthening
    relevant sectors and units and mobilizing UNESCO''s institutes and networks.


    42. Support the integration of AI skills into the ICT Competency Framework for
    Teachers, and support countries in training teaching staff on how to work in AI-rich
    educational environments.


    43. In the field of AI in education, further expand UNESCO''s cooperation with
    relevant UN agencies and multilateral partners, regional development banks and
    organizations, and the private sector.


    44. Following this Conference, take appropriate regional and international follow-up
    actions, in cooperation with development partners active in this field, to consolidate
    and expand the impact of this Consensus.


    ## II. The Revolution in Education: Exploring Big Data and Personalized Education


    ### Abstract


    Relying on big data to record student behavioral data, understand personalized
    student needs, recommend personalized learning content, understand teacher teaching
    behaviors, and improve educational evaluation enables personalized education,
    thereby leading to a revolutionary transformation in education. While big data
    technology drives personalized education, it also faces challenges such as technical
    resource issues, lack of professional talent, risks of educational discrimination,
    poor teaching effects, outdated educational concepts, and privacy and security
    challenges. Exploring new paths for personalized education in the big data era
    requires maintaining rational thinking, innovating educational thinking, developing
    big data technology, strengthening talent cultivation, emphasizing multi-party
    collaboration, and attaching importance to data privacy protection.


    ### Keywords


    Education; Personalized Education; Big Data


    Education is a major national plan, the cornerstone of national rejuvenation and
    social progress, and the fundamental path to the comprehensive development of
    the individual. In different eras, education has had vastly different connotations
    and forms. From the private tutoring model of the agricultural era to the factory-style
    class-based education model of the industrial era, and then to the scientific,
    intelligent, and personalized education model supported by data and catalyzed
    by new-generation information technology and AI technology in the information
    and intelligent era, the connotation of education continues to expand, and the
    form of education continues to change—personalized education, which better conforms
    to human nature and the needs of comprehensive human development, is returning
    to a higher level after experiencing the negation of the negation. Today, big
    data has set off a wave of educational reform, promoting the vigorous development
    of personalized education. However, while the big data education boom triggers
    the development of personalized education, it also produces a series of new challenges.
    Therefore, it is necessary to analyze the new trends and challenges of education
    in the big data era, explore new paths for the development of personalized education
    in the big data era, and enable big data to better serve the promotion of educational
    reform and development.


    ### (I) Big Data Drives the Development of Personalized Education


    The *National Medium- and Long-Term Educational Reform and Development Plan Outline
    (2010–2020)* released by the Chinese government in 2010 mentions: "Pay attention
    to the different characteristics and individual differences of students, and develop
    the potential strengths of every student." "Care for every student, promote the
    active, lively, and vivid development of every student, respect the laws of education
    and the physical and mental development of students, and provide suitable education
    for every student.^([\[2\]](#txt012.html#footnote_content_txt012_2))" It can be
    seen that the state strongly emphasizes and values personalized education in its
    educational planning. In fact, the general direction of educational development
    in the new era is personalized education, which is also the general trend for
    education to adapt to technological progress and big data development in the AI
    era. Personalized education follows students'' individual differences, growth
    patterns, and educational laws, providing students with rich and colorful curriculum
    content and practical activities, cultivating students'' autonomous learning abilities
    and abilities to adapt to the needs of the times, tapping into individual life
    potential, and enabling students to develop in the direction of comprehensiveness,
    individuality, freedom, and health. All of this is consistent with the direction
    of the development and utilization of educational big data. Utilizing big data
    technology can record student behavioral data, understand personalized student
    needs, recommend personalized learning content, understand teacher teaching behaviors,
    improve educational evaluation, and promote the development of personalized education.


    #### 1. Recording Student Behavioral Data


    The arrival of a big data era where "everything is recorded, everything is analyzed"
    provides the possibility and reality for the development of personalized education.
    When students learn online, they leave a series of "digital footprints." These
    "digital footprints" include behavioral data from the learning process, evaluation
    data from learning outcomes, and social network relationship data formed through
    online learning. In big data scenarios, each student''s course entry assessment,
    discussion board inputs, blog entries, or wiki activities can be immediately recorded
    and added to the database^([\[3\]](#txt012.html#footnote_content_txt012_3)). By
    recording student behavioral data such as the number of web page clicks, search
    footprints, selection of course materials, video viewing time, frequency of repeated
    viewing, number of pauses, number of jumps, and time points of video clicks, as
    well as evaluation data on learning outcomes such as homework completion, test
    results, and quality of Q&A, on the one hand, the quality and effectiveness of
    learning resources can be accurately analyzed, thereby optimizing learning resources;
    on the other hand, students can analyze and summarize their learning situation
    during this period, determine the most suitable personalized learning strategies
    for themselves, and further optimize their learning behaviors in the future.


    With the development of new-generation information technology and AI technology
    and their extensive application in education, big data''s collection, recording,
    analysis, and mining of student behavioral data enable the new era of education
    to move from the macro group to the micro individual with the aid of advanced
    technology development, track the behavioral footprints of every learner, and
    lay the technical conditions for realizing personalized education.


    #### 2. Understanding Students'' Personalized Needs


    By recording, analyzing, and mining student behavioral data, students'' personalized
    needs can be understood. Howard Gardner''s Theory of Multiple Intelligences posits
    that each individual is composed of eight basic intelligences (linguistic, logical-mathematical,
    musical, bodily-kinesthetic, spatial, interpersonal, intrapersonal, and naturalistic)
    combined to varying degrees, and it is these different combinations of the eight
    intelligences that produce individual differences^([\[4\]](#txt012.html#footnote_content_txt012_4)).
    In reality, individual differences are manifested not only physiologically but
    also in personality traits, cognitive styles, learning experiences, learning preferences,
    learning needs and abilities, and social backgrounds. Significant differences
    exist between different individuals; even for the same individual, development
    in different aspects changes over time. In the learning process, individual differences
    directly or indirectly affect the healthy physical and mental development of students.
    Therefore, educators must acknowledge students'' individual differences, respect
    their uniqueness, understand their personalized needs, and teach students in accordance
    with their aptitude based on their different characteristics such as interests,
    hobbies, aspirations, talents, and specialties.


    In the big data era, through the recording of student behavioral data, the personalized
    learning needs of each student can be understood, and suitable learning resources
    and learning systems can be found through big data technology, thereby realizing
    truly personalized education. Students leave "digital footprints" of their learning
    process online; through the analysis and mining of these data, the learning progress,
    learning methods, and interests of each student can be understood. Differences
    in students'' knowledge levels, ability levels, future plans, interests, hobbies,
    strengths, and weaknesses affect their choices of learning content and methods.
    Big data enables us to understand the various learning needs of learners of different
    ages, regions, and identities, and thereby develop rich and diverse learning resources,
    providing learners with multiple choices and personalized learning guidance.


    #### 3. Recommending Personalized Learning Content


    Renowned British big data expert Viktor Mayer-Schönberger points out that the
    combination of big data and education will transcend those past "feeble innovations"
    and create real transformation. He summarizes three core elements of big data
    improving learning and education: feedback, personalization, and probabilistic
    prediction^([\[5\]](#txt012.html#footnote_content_txt012_5)). In the big data
    era, fully applying the probabilistic prediction, personalization, and feedback
    functions of big data technology, integrating behavioral data into effective information,
    and recommending different learning content and methods according to students''
    needs and abilities, providing the most suitable teaching materials for each student,
    allowing students to autonomously select required learning resources, formulate
    suitable learning plans, and freely arrange learning time and place, thereby achieving
    the goals of self-learning, active learning, and personalized learning.


    Big data technology can also obtain the knowledge required for a certain type
    of talent from the learning of a large number of students. If a student persistently
    studies several courses, big data technology can collect, record, analyze, and
    mine the student''s learning needs and recommend other courses they might need
    to study, which are then finalized through the student''s autonomous selection.
    Because in the information age, the speed of knowledge growth accelerates, and
    the massive, fragmented, and explosive educational resources on the internet lead
    to information clutter, making it difficult for students to obtain the best resources
    for personalized learning. Since students do not know all the knowledge required
    for a certain type of talent, they cannot choose subsequent courses for study,
    let alone select corresponding high-quality courses. This challenges students''
    learning ability, information processing ability, and cognitive ability, easily
    leading to problems such as lack of confidence and low efficiency. However, big
    data technology can easily achieve this; through big data collection and analysis,
    learning content will be changed and adjusted based on analysis results, knowledge
    transfer receives personalized processing, thereby enabling students to efficiently
    complete learning goals and plans, and subsequently achieve personalized development.


    Based on the application of big data technology, some internet-based online education,
    such as flipped classrooms and MOOCs, through the immediate, comprehensive, efficient,
    and detailed collection, recording, and storage of massive data on students''
    learning abilities, learning methods, and learning processes, analyze and draw
    conclusions on students'' learning interests, learning characteristics, and learning
    efficiency, can develop educational products and systems suitable for student
    needs in combination with the learning needs and abilities of different types
    of students, helping students with autonomous and personalized learning.


    #### 4. Understanding Teachers'' Teaching Behaviors


    In the big data era, besides recording student learning behavioral data, understanding
    student learning needs, and recommending personalized learning content, teachers''
    teaching behaviors can also be understood and improved through the analysis and
    study of educational big data.


    The traditional school education model is the Prussian education model, adopting
    a large-class teaching system divided by age/grade. Teaching is executed according
    to pre-set teaching plans; teachers must complete designated teaching tasks in
    each class, and limited time and energy make it difficult to attend to the personalized
    development of every student. Moreover, in traditional education, the teacher''s
    role is irreplaceable; students passively accept knowledge under the teacher''s
    lead, mechanically memorize the lectured content, and over time develop laziness
    and dependency, unwilling to think independently, losing the ability for autonomous
    learning and self-planning, with innovation ability also being affected.


    Big data analysis technology discovers valuable information and knowledge hidden
    behind the data by mining data from various aspects of students. After the learning
    analytics system processes the collected data, it can extract a series of information;
    a significant feature of this information is its predictability, and utilizing
    this information can bring strong pertinence to teaching^([\[6\]](#txt012.html#footnote_content_txt012_6)).
    The analysis, statistics, and feedback functions of big data can help teachers
    understand in detail students'' learning behaviors, learning abilities, learning
    habits, learning needs, etc., understand their own teaching behaviors and teaching
    effects, and what teaching methods are most effective for student learning, so
    as to adjust teaching plans according to students'' learning development situations.
    Teaching arrangements no longer adhere to the same fixed sequence, and knowledge
    transfer receives personalized and flexible processing.


    In addition to improving teachers'' teaching behaviors, the role of teachers will
    also undergo tremendous changes. They will no longer act merely as transmitters
    of textbook knowledge, instilling knowledge into students, but will pay more attention
    in teaching to cultivating students'' thinking abilities, knowledge comprehension
    and application abilities, information collection and discrimination abilities,
    etc., stimulating students'' creative thinking. In their relationship with students,
    they become both teachers and friends, understanding, comprehending, and respecting
    students'' personalities more, and promoting students'' personalized development.
    Furthermore, big data technology can be used to comprehensively assess teachers,
    track their teaching processes, help teachers analyze teaching effects, and enable
    teachers to adjust teaching methods in a timely manner to improve teaching quality.


    #### 5. Promoting Comprehensive and Objective Educational Evaluation


    Educational evaluation is a value judgment activity on the degree to which educational
    activities meet the needs of educational subjects, based on certain educational
    values or goals, using effective evaluation techniques and means, through systematic
    collection, analysis, and collation of information^([\[7\]](#txt012.html#footnote_content_txt012_7)).
    Educational evaluation under big data is based on the analysis of data generated
    during the educational process; to form scientific, objective, and comprehensive
    educational evaluation, the effective way is to "let the data speak" and make
    data an important basis for educational evaluation.


    Big data enables education to form an evaluation mechanism that is all-round,
    multi-level, multi-field, and multi-angle. First, expand evaluation indicators.
    Under exam-oriented education, traditional learning evaluation indicators are
    test scores and rankings, which not only fail to comprehensively evaluate students''
    learning situations but the one-sided pursuit of scores also neglects students''
    physical and mental health development, affecting students'' initiative, enthusiasm,
    and creativity in learning. Big data will reshape the educational evaluation system,
    transforming traditional single result-oriented evaluation into process-oriented
    evaluation, growth evaluation, comprehensive evaluation, etc., based on big data,
    emphasizing students'' learning process, learning experience, learning effects,
    quality improvement, and teacher-student interaction.


    Second, form multi-angle, multi-field, and multi-subject evaluation. The objects
    of educational evaluation are not limited to students but should also include
    courses, teachers, schools, etc. Big data''s data reserves and technical concepts
    make it possible to realize a comprehensive evaluation model covering numerous
    evaluation objects such as student evaluation, teacher evaluation, school evaluation,
    regional education development evaluation, and course evaluation^([\[8\]](#txt012.html#footnote_content_txt012_8)).
    Traditional evaluation of morality, intelligence, physique, aesthetics, and labor
    no longer adapts to the development requirements of quality education and personalized
    education in the new era; importance should be attached to cultivating students''
    innovation ability, and the comprehensive development evaluation of students should
    be extended to aspects such as ideological and moral character, knowledge and
    skills, interpersonal relationships, innovative thinking, practical ability, and
    physical fitness.


    Third, transform evaluation functions. The evaluation of students is not to distinguish
    between superior and inferior, but through data collection and analysis, to understand
    students'' abilities and provide constructive opinions and guidance based on students''
    situations, so as to fully exert their potential. Schools can establish a comprehensive
    student quality evaluation system through big data, the internet, and cloud services,
    where all student data and information are comprehensively collected and recorded.
    Through these data, students'' changes and development can be well observed, and
    personalized evaluation and guidance can be provided to students based on data
    analysis. Replacing the current evaluation system based solely on scores with
    a comprehensive and objective evaluation mechanism that is multi-angle, all-round,
    multi-type, multi-specification, and multi-level is both a requirement of the
    "4V" characteristics of big data (Volume, Variety, Velocity, Veracity) and the
    pursuit of personalized education in the era of big data and AI.


    ### (II) Problems in Big Data Driving Personalized Education


    Big data driving personalized education is a complex systemic project, involving
    numerous aspects such as technology, economy, society, and education, as well
    as many factors such as concepts, actions, ethics, and policies. Currently, the
    following important problems exist.


    #### 1. Technical Resource Issues


    On the one hand, big data promotes the change of traditional education methods
    and drives the development of personalized education; on the other hand, China''s
    current big data technical resources are relatively weak, posing challenges to
    the development of personalized education. First, limitations of technical support.
    Education is a long-term and complex process; restricted by realistic conditions,
    current technical means cannot universally achieve the collection, processing,
    and analysis of massive educational data in a short time. There are many types
    of educational big data, such as teaching data, management data, scientific research
    data, and service data, and data processing capabilities are still insufficient
    for unstructured data such as video, audio, images, text, and lesson plans. Second,
    lack of technical standards. Vertical industry construction constitutes "data
    silos" and "data chimneys" separated by blocks between different industries or
    even different departments within the same industry. Massive data is distributed
    in various forms in various departments of the education industry, with problems
    such as repeated collection of similar data and inconsistent data standards, bringing
    great challenges to the development of personalized education driven by big data.
    Third, widening of the data divide. Due to economic, technological, and educational
    reasons, the distribution of big data technical resources is uneven among countries,
    regions, and industries, and many schools lack the necessary construction of big
    data infrastructure. In addition, some regions, schools, and educational institutions
    have relatively closed educational concepts and are unwilling to open and share
    their educational resources and data, leading to a trend of widening data divide.


    #### 2. Lack of Professional Talent


    To meet the requirements of the development of the times and promote personalized
    education, a group of big data researchers and practitioners is needed, as well
    as a group of comprehensive talents who understand both education and master big
    data technology and management. However, China currently lacks professional talents
    in educational big data; therefore, cultivating outstanding professional talents
    is urgent. In the big data era, various data information floods educational activities,
    which requires professional talents to maintain a high degree of sensitivity to
    massive data to exert the value functions of big data. Therefore, the Ministry
    of Education, to implement the national big data strategy, has successively added
    the "Data Science and Big Data Technology" major to cultivate big data talents.
    Many universities have also established big data research institutes and offered
    big data-related courses. Although some universities have established big data
    majors, they are still in the initial exploration stage in terms of supporting
    curriculum system construction and talent cultivation models, and it is difficult
    to cultivate a large number of outstanding educational big data practitioners
    in the short term; therefore, there is a lack of professional talents and comprehensive
    talents.


    #### 3. Risk of Educational Discrimination


    With the rise of the big data craze, the concept of using data as a criterion
    for judgment has become prevalent, and big data has become a tool for educators
    to make educational decisions. The worship of big data causes "potential discrimination"
    to lurk deeply in the process of personalized education, increasing the risk of
    misjudgment and discrimination by educators, which is more likely to affect the
    healthy physical and mental development of students in educational practice.


