- raw: "个性化是人工智能教育最重要的特征,它集中突出人工智能教育在实践操作环节的教育价值。人工智能时代,智能数据挖掘、数据分析、数据分类汇总、数据知识图谱的构建、学生数据画像、教师AI助手、虚拟学校、隐性课程等都是人工智能技术的“拿手好戏”。人工智能教育,通过运用人工智能平台,有效抓取学习者的学习记录数据,包括学习者的学习习惯、思维方式、学科偏好、知识结构、情感倾向、经济状况等数据(如图2-1所示),覆盖学生的学习预备阶段、学习过程阶段与学习结果阶段。最后,再加上横向时间轴上的整个历史学习数据,学习者个人的学习情况将会在智能可视化技术的支撑下变得透明可见,促使学习者个人的学情知识图谱的成形与不断完善。\n\
    \n![](images/txt002_1.jpg \"pagenumber_ebook=29,pagenumber_book=19\")\n\n图2-1\
    \ 学习者数据知识图谱\n\n人工智能教育的个性化特征,对于学习者个人而言,非常有利于提高其学习的积极性和主动性;对于教师而言,有利于教师开展个性化教学与精细化教学方案设计;对于学校管理者而言,有利于实现精准化学生管理。人工智能教育的个性化,关系学习者个人的个性化学习与终身教育体系的构建。\n\
    \n3.人性化\n\n人工智能时代,教育的人性化特征显著。教育,从来都是塑造人的活动,是有目的地培养人的活动。教育的对象是一个个鲜活的人,所以无论是哪个时代的教育,都不能离开教育的人性化发展。但相较而言,人工智能时代的教育的人性化特征更为明显。\n\
    \n人工智能教育,在系列智能技术的帮助下,将教师从繁杂且重复的教学活动中解放出来,智力教育方面的知识性传授可以交给人工智能教育系统去完成,教师将会有更多的时间和精力从事“EQ”方面的教学工作,增强与学生之间的情感共鸣,进而有利于师生之间形成良好的师生关系,有利于理解、尊重、支持、真诚、同情、共鸣、个性化等教育观念得以认真贯彻落实。\n\
    \n将教师从繁杂且重复的教学活动中解放出来,就会更加重视教育的“感情投资”,以情感人,使学生因感到温暖而把学习空间当作自己的“家”,从而形成一个温情脉脉、人人“爱家”“报家”的“家庭式”组织。在这样的空间中,在这样的氛围下,学生更容易接受老师的教育^([\\\
    [8\\]](#txt002.html#footnote_content_txt002_8))。人工智能时代的教育,教育活动过程倾向于参与化与社交化,有利于改善学生之间的关系,增进学生之间的情感交流与价值互动。\n\
    \n4.协同化\n\n由于受到信息壁垒、数据鸿沟、利益纠纷、权利冲突等因素影响,传统教育的“各自为政”的发展模式较为普遍,教育部门之间、跨部门之间的沟通困难,严重阻碍了教育的发展进程。但是,人工智能教育的诞生,对传统教育的弊端进行了针对性的超越,并基于人工智能技术,将现实的教育与虚拟的教育融为一个有机的“大教育”系统,教育的管理者、教学执行人员、教育对象灵活穿梭其间,具有高度协同化的特征。\n\
    \n人工智能教育的协同化,表现为“教育管理、教育决策、教育教学”三位一体的协同发展,表现为“个人、家庭、学校和社会”贯通的协同发展,也表现为“政、产、学、研、用”为一体的协同智能教育创新平台。总而言之,人工智能教育的协同化,从根本上表现为人与机器的协同化,人机协同是人工智能教育的核心特征。\n\
    \n5.无边界化\n\n人工智能教育,是一种多空间泛在的教育模式,兼具包容性和开放性两种属性。在智能教育环境中,教育的边界已经突破校园的“围墙”,走向“社会即学校”“生活即教育”的开放型教育时空。由于智能空间技术的发展,信息空间逐渐成为课程空间、教学空间,物理空间逐渐成为活动空间、实践空间,教育教学的整个活动过程,已经突破时间和空间的限制,走向超越时间和空间的无边界化存在,教育无处不在、无时不有。\n\
    \n三、人工智能教育的价值链条：一个日益增值的价值闭环\n\n人工智能教育,是人工智能在技术、思维与结构层面赋能教育的结果。从人工智能教育的整体属性来看,智能化、个性化、人性化、协同化与无边界化特征显著。从人工智能教育的价值属性来看,蕴藏于人工智能教育的概念和特征中的社会性价值与个体性价值构成了同一整体的两个方面,反映了人工智能教育与社会发展和个体发展相适应的总方向。\n\
    \n谈及人工智能教育的价值,有必要先理解其含义。人工智能教育的价值,是指以人或社会为尺度来衡量它的存在所具有的功能与意义。换言之,是人工智能教育对人类需求的效益关系。通常意义上讲,人们对人工智能教育价值的追求,实际上是对自身价值的追求,而整个人工智能教育的过程,实际上就是一个价值日益增值的过程^([\\\
    [9\\]](#txt002.html#footnote_content_txt002_9))。而这个“增值”的过程,正是人工智能教育的价值链条逐渐闭环的过程。\n\
    \n人工智能教育的价值链条(如图2-2所示),涵盖人工智能教育的总价值和分价值。总价值也称为宏观价值,是指人工智能教育在整个社会层面上的价值,它不止于某个特定区域的描述,而是对整个教育服务对象的总的价值思考,既关涉教育环节的赋能与教育质量的提升,又关涉促进教育公平与提高国民总体素质。分价值又称为微观价值,按照特定的序列可分为对学生的价值、对教师的价值和对学校的价值。\n\
    \n![](images/txt002_2.jpg \"pagenumber_ebook=31,pagenumber_book=21\")\n\n图2-2\
    \ 人工智能教育的价值闭环\n\n人工智能教育的价值,从分价值到总价值的过渡,是由整个人工智能技术优势转移到教育细分领域而引发的价值深化与社会性延伸的结果。因此,人工智能教育的价值探索与求真,需要历经从微观到宏观的过程。\n\
    \n(一)人工智能教育的微观价值\n\n人工智能教育的微观价值,包括对学生的价值、对教师的价值、对家庭的价值和对学校的价值等。\n\n1.人工智能教育对学生的价值\n\
    \n人工智能教育对学生的价值,孕育于它的个性化特征之中。人工智能教育的个性化特征的关键,是专门针对学生个人进行数据画像和知识图谱的可视化呈现。以数据为基础的人工智能教育建模,是基于学生动态数据的实时分析和动态监测,能够有效、及时、迅速地感知和反馈学生的个性化需求,包括知识需求、情感需求和能力需求等。人工智能教育系统还将会根据学生的需求数据,进行个性化学习任务的推荐、个性化学习方法的培养,以及个性化学习计划的制定,内容将会有机涵盖学生个人的操作性技能与智能性技能的综合培养,具体包括德育、智育、体育、美育和劳育等方面的技能和智慧。\n\
    \n知识大爆炸的智能时代,对于学生个人而言,最缺的就是主动建构知识的能力、进行创造性学习的能力。人工智能教育的出现,将会极大地减轻学生个人掌握知识的压力,同时还有利于学生将更多的自由时间用于学习如何发展自身,也更有利于学生发展成为复合型人才,以便在未来能够更好地适应智能社会发展的需要。\n\
    \n2.人工智能教育对教师的价值\n\n随着人工智能技术的不断发展,强大的科技基因的“遗传效应”在教育领域遍地开花,并结出了丰硕的果实。人工智能教育对教师的价值,表现为人工智能技术的优势遗传,带来教师角色、权威和工作内容的巨大变化。尤其在教师的工作领域,在传统教育中,教师的工作纷繁复杂,重复性工作占据了教师大量的琐碎时间,虽已筋疲力尽,但却又是不得不为。然而,人工智能时代的教育革命,改变了以往的工作模式。现如今,教师的备课、上课、批改作业、学情分析、个性化方案制定、教学资源的挖掘等,都将能够交由人工智能教育系统,一键轻松解决,教师将有更多的时间和精力投身于价值研判、情感导向与思想引领方向上来。\n\
    \n对于教师而言,人工智能教育不仅使教师获得一定程度上的解放,而且使他们在教学视野和教学方法上得到更多灵活处理的自由空间,教师的核心价值得以发挥。在人工智能时代,智能教育的发展使在传统教育中存在的大多数教育工作逐渐被人工智能所取代,但这种取代并不是完全意义上的取代,而是将教师从知识传授的繁杂工作中替代出来。\n\
    \n千百年来,教师的职责都是“教书”和“育人”同时进行。然而,教师也是骨肉之躯,同样会有筋疲力尽之时。事实证明,在传统的教育中,教师的绝大部分教学时间都耗费在教书上面,而真正的“育人”价值,则被“分数”与“指标”瓜分完毕。所以,以往的教育,教师的育人价值并未完全得以发挥,即使发挥出来,也只能是面向很少的一部分学生。\n\
    \n人工智能教育的发展,使教师的“育人”价值导向,已在突飞猛进的智能技术发展中渐渐得以实现。人工智能教育的到来,人工智能专家系统、人工智能教师、人工智能教育机器人的存在,虽然给予人类教师一定的职业冲击和挑战,但这种冲击并不是有害的,恰恰是人工智能在以新的方式提醒人们,现当代的教育应该改变以往的教育形态,应该回归到教育的本质上来,应该把教育的育人价值放在第一位。\n\
    \n教育的本质就是要培养人,培养符合社会发展与个人发展需要的人。在人工智能时代,“育人”的工作,终于又重新回到教师的手中,而不再像以往那样,以社会的惩戒制度为育人的终结手段。\n\
    \n人工智能时代的教师的育人价值,主要以引导学生实现人生价值为评判标准,以促进学生成长、活出个性色彩为育人的主旋律。在育人的过程中,教师能够借助智能技术工具,发现学生的特质,采取针对性的育人方法,帮助学生挖掘自身的优势与价值,解放学生的个性,让每个学生都在“因材施教”中“学以成人”。\n\
    \n教师在教育价值转向时,面向学生的教育内容也发生巨大变化,开始从传统的“讲授知识”转化为培养学生的结构思维能力、创新思维能力、批判思维能力、协作能力、发现美与欣赏美的能力,以及将理论运用于实践的能力等。通过培养学生的系列能力,提升学生整体的发现问题、分析问题与解决问题的综合能力。届时,学生将能够在各种复杂环境中进行独立思考、迅速获取知识、感知情感、建构新的认知、知识迁移与应用等,从而成为一个“德智体美劳”全面发展的人,一个严格意义上的“完整的人”。\n\
    \n从目前的人工智能教育发展阶段来看,人工智能教育的智能化水平还比较低,不足以支撑人工智能教师在“教书”领域完全取代人类教师,而是以最初的助手身份上阵。因此,人工智能教育对于教师的价值,还体现在通过帮助教师智能分析学情与学生的个性化数据,助力人类教师实现精准教学。\n\
    \n人工智能教育,还可以帮助人类教师提高整体的科研水平。大数据和人工智能时代,数据的累积为实证研究提供必要的前提,从而引发教育领域的新一轮科研热,进而促进教育科研领域的量化考核与质性分析双重结合,有效帮助人类教师挖掘更多有价值的数据信息。如今,优秀教师的评选,已经开始倾向于会使用人工智能的教师,更倾向于熟练使用人工智能的教师。\n\
    \n3.人工智能教育对家庭的价值\n\n人工智能时代的教育,从家庭视角来看,最重要的价值体现在“陪伴”价值。自90后出生以后,整个社会生活大环境的节奏变得非常快,父母与孩子之间的相处与陪伴的时间明显减少,孩子在成长的过程中,非常期待得到父母的陪伴,但由于客观条件限制,或者是孩子走进校园之后,彼此之间的联系与陪伴越来越少。这一困局最终演化为家庭教育缺失的问题。\n\
    \n然而,自人类进入人工智能时代以来,随着人工智能教育的发展,家庭教育的困局逐渐找到出路。人工智能教育助力家庭教育,是通过儿童家庭教育机器人和学校智能教育家长端两个渠道得以实现。\n\
    \n儿童教育机器人进入家庭,主要是以对话的方式陪伴儿童的成长与发展。一方面,以人工智能技术为基础的儿童教育机器人,能够根据儿童的发展阶段,提供必要的智能对话、趣味互动、协同游戏、同声传译等,让最怕孤独的孩子,在成长的过程中随时可以获得温暖的陪伴与优质的家庭教育。另一方面,在家庭教育中引入人工智能教育机器人,能将家长从辅导孩子做作业的工作中解放出来,有更多的时间和精力关心孩子的身心健康发展,有更多的时间陪伴孩子。\n\
    \n从学校智能教育家长端来看,人工智能教育其实是借助人工智能技术手段,打通了学生因为进入校园而导致的与家长的情感隔离,家长能够借助人工智能教育的家长端口,更为全面地了解学生的学习动态、思想倾向与行为习惯,从而促进家长与学生之间的有效沟通。譬如,科大讯飞公司的智学网家长端,便能凭借其强大的数据统计与数据可视化优势,引起家长对孩子的学校生活的积极关注,从而提升家长对家庭教育的重视,也可以助力家长了解孩子在学习方面的真正需求。\n\
    \n4.人工智能教育对学校的价值\n\n学校引入人工智能技术,改造升级整个教育系统,对于学校的教育教学活动意义重大,最为关键的价值在于促进学校管理的科学化。管理的核心在于精准决策,精准决策的关键在于决策数据的“结构理性”。人工智能技术之所以能够赋能教育,是因为扎实的教育信息化基础。2018年4月,教育部已正式发布《教育信息化2.0行动计划》,国家对教育信息化的发展又开始新一轮的战略布局,届时将对教育数据结构、教育数据共享机制、教育数据的保密协议、教育教学知识产权等方面进行有效完善,给学校的教育教学管理带来极大的便利。\n\
    \n截至目前,在教育信息化政策的引领下,全国各级各类学校在信息化基础上逐渐实行教育智能化转向,“智慧校园”的格局正在形成,同时学校的人工智能教育系统的感知能力也能迅速升级。在不远的将来,人工智能技术全线覆盖学校的各个角落时,学校的管理工作将变得非常智能,学校的教学管理、安全管理、学籍管理、学情分析管理等活动都将实现智能控制,最终实现学校教育管理的现代化。\n\
    \n(二)人工智能教育的宏观价值\n\n从宏观上看,人工智能教育的价值,既关涉教育环节的赋能与教育质量的提升,又关涉促进教育公平与提高国民总体素质。\n\n\
    1.赋能教育环节\n\n人工智能教育,其智能化的总特征最显著的地方表现在教育环节的赋能。各种类型的教育,从教学视角上看,归纳起来,一般环节包括五个：备课、上课、布置与批改作业、课外督学、学业成绩考评与反馈。人工智能技术赋能教育环节,其实就是让“五个”基本的教学环节变得智能。如备课环节,教师的教学方案、课程计划、课件制作等工作,都可以基于智能挖掘技术,到各大网站和数据库收集相关的共享资料,这样不仅节约了制作时间,还给教师完善备课内容以大量时间,使得备课的质量越来越高。再如布置和批改作业环节,无论是主观题还是客观题,都能实现智能批改,定理证明、智能学习博弈、求解微积分、智能行为演示、智能速记、智能翻译、语音合成、智能写稿等,样样精通。\n\
    \n2.提升教育质量\n\n教育质量是一种关于教育效果的衡量指标,是诸多教育因素作用于教育对象之后产出的效果的总和。教育对象的学识的多寡,是教育质量的集中体现。教育环节、教育方法、教育管理、教育制度、教育内容、教育环境等,都是对教育质量产生影响的因素。这些有利于提高学生学习效果的因素在人工智能技术的作用下都将实现智能化转向。人工智能技术的引入,能够有效识别限制教育质量提升的因素,并对其进行智能控制和调节,在提高教育效率的基础上,促进教育的“高质量发展”。\n\
    \n3.促进教育公平\n\n习近平总书记在向2019年的国际人工智能与教育大会致贺信时指出：“中国高度重视人工智能对教育的深刻影响,积极推动人工智能和教育深度融合,促进教育变革创新,充分发挥人工智能优势,加快发展伴随每个人一生的教育、平等面向每个人的教育、适合每个人的教育、更加开放灵活的教育。中国愿同世界各国一道,聚焦人工智能发展前沿问题,深入探讨人工智能快速发展条件下教育发展创新的思路和举措,凝聚共识、深化合作、扩大共享,携手推动构建人类命运共同体^([\\\
    [10\\]](#txt002.html#footnote_content_txt002_10))。”可见,人工智能赋能教育,对于促进教育公平具有重要意义,关系“人类命运共同体”的构建进程。人工智能教育中蕴藏的教育公平的价值,其核心思想是“把一切有价值的知识教给一切人”。人工智能时代,关于解决教育公平问题的实践已经开始,从“单师模式”向“双师模式”的转化,再向“多师模式”的突围,为全国各地的学生提供了优质的教学课程。国家“三通两平台”的建设落成,是人工智能技术在促进实现教育资源公平辐射全国的典型案例,人工智能技术促进教育公平发展,实现价值变现。\n\
    \n4.提高国民素质\n\n国民素质是一个综合的概念,它包括了很多方面,具体可以分为“三类八种”：三类素质是指自然素质、心理素质和社会素质;八种素质是指政治素质,思想素质,道德素质,业务素质,审美素质,劳动素质,身体素质,心理素质^([\\\
    [11\\]](#txt002.html#footnote_content_txt002_11))。概括而言,国民素质包括个人素质和集体素质。教育是国民素质养成的基本渠道。随着人工智能教育的不断发展,其实践与应用日趋成熟,意味着人工智能技术对于赋能教育环节、提高教学质量、促进教育公平的价值更大。从整体上来说,人工智能技术进入教育领域,将会把教育建构成一个开放且包容的巨型教育系统,学习型社会得以构建,终身教育体系得以形成,教育的内容涵盖国民素质教育的方方面面,完善的个人人格得以塑造,教育对象的“全面发展”的可能性极大提高。同时,爱国主义教育、集体主义教育、伦理道德教育也得到发展。最终,关于人工智能教育与国民素质的内在结构走向和谐,从整体上促进了个人素质与集体素质的有机统一,国民素质得到大幅度提高。\n\
