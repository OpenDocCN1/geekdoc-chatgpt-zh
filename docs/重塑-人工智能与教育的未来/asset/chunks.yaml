    ### The Connotation and Value of Maker Education


    Zhao Xiaosheng believes that maker education is essentially a new carrier and
    new form of innovation education in the information age, providing a possible
    "operating system" for optimizing the cultivation system of innovative talents
    ^([\[5\]](#txt009.html#footnote_content_txt009_5)). Yang Xianmin et al. believe
    that maker education is a new educational model that integrates information technology,
    adheres to the educational philosophy of "open innovation, inquiry experience,"
    takes "learning by creating" as the main learning method, and aims to cultivate
    various types of innovative talents ^([\[6\]](#txt009.html#footnote_content_txt009_6)).
    Zhang Maocong believes that maker education emphasizes the subject status and
    value of people, and is committed to transforming students from slaves of knowledge
    into masters of knowledge; it focuses on the cultivation of the "whole person"
    with abilities of knowledge, emotion, will, and action, deepening and internalizing
    knowledge through the application of knowledge, and paying more attention to the
    creation of knowledge ^([\[7\]](#txt009.html#footnote_content_txt009_7)).


    Combining the background of the artificial intelligence era, let us discuss maker
    education again. Zhu Zhiting believes that maker education in the AI era aims
    to cultivate makers who are dedicated to AI development and innovation. These
    makers must not only have solid technical skills and keen technical foresight
    but also possess the maker spirit of understanding cooperation, being good at
    communication, and never giving up easily. Emerging technical means such as AI
    open platforms, intelligent robots, and the Internet of Things provide open and
    novel experience and creative practice platforms for maker education ^([\[8\]](#txt009.html#footnote_content_txt009_8)).
    It can be seen that maker education is essentially a carrier of innovation education,
    completing innovation education work with the help of emerging technologies, and
    its main purpose lies in cultivating people''s maker abilities and maker spirit.


    In the AI era, intelligent maker education is deeply welcomed by society. In November
    2009, then-US President Obama, at the "Educate to Innovate" event, advocated for
    the first time that American students should become innovators of knowledge and
    creators of society. This became a landmark for the US government to take the
    lead globally in launching the "National Innovation Strategy" and further implementing
    maker education ^([\[9\]](#txt009.html#footnote_content_txt009_9)). Following
    this, the US proposed the "National Innovation Strategy" at the national strategic
    level, which in turn triggered a large number of internationally renowned universities
    and enterprises to layout maker education, extending the global influence of US
    maker education. Maker education labs, maker education spaces, maker education
    schools, maker education institutions, maker education incubation bases, etc.,
    emerged as the times require.


    The birth of maker education has been able to gain government policy promotion
    and active pulling by enterprises and research institutions, mainly because maker
    education itself possesses huge potential value. First, maker education can cultivate
    innovative to the requirements of the times and the guidance of national policies,
    the team of Chengde Zhixiang Robot Maker Center integrated maker culture and intelligent
    technology, established a specialized intelligent maker platform, and became one
    of the few pioneers in the field of international AI maker education. Since its
    establishment, the Chengde Maker Education Platform has achieved numerous results
    in relevant educational curriculum fields. Currently, they have incorporated courses
    such as 3D printing, laser engraving, UAV model aviation, scale model racing,
    Scratch children''s programming, bilingual Scratch programming (the world''s first
    composite course integrating traditional Chinese culture English, programming,
    AI, programming English, artistic creation, and other elements), radio communication,
    Arduino intelligent manufacturing, US VEX robotics, etc., into the curriculum
    system of the intelligent maker platform. In particular, its bilingual innovative
    quality education curriculum system independently developed by combining AI technology,
    traditional Lego education, and maker education technology is deeply welcomed
    and loved by the vast majority of service targets. At present, the platform has
    reached cooperation agreements with many schools in the Chengde area. From independent
    enterprise development to entering campuses to open up new horizons for intelligent
    maker education, the Chengde Zhixiang Robot Maker Platform is gradually developing
    into a standardized, institutionalized, and standardized intelligent maker platform.


    Today, with the continuous development and maturity of the Chengde Maker Platform,
    its platform scale is also expanding. In terms of faculty strength alone, its
    teaching team is expanding rapidly. On this basis, the curriculum system of this
    intelligent maker education platform is continuously improving. High-difficulty
    courses such as innovative creation parent-child courses, scale models, microcontrollers,
    program design, AI programming language Python programming, Arduino open-source
    hardware, etc., have been introduced into Chengde intelligent maker education
    one after another, and the educational effects of this intelligent maker education
    platform are remarkable. From 2017 to 2019, in just three years, Chengde teenagers
    trained by the Zhixiang Robot Maker Center have won championships and third places
    in well-known competitions such as the National Youth Maker Competition Finals
    and the World Robot Contest.


    The specialized platform of intelligent maker education mainly conducts innovation
    education around the AI curriculum system, which has important value for the intellectual
    development, thinking training, and practical ability cultivation of the educational
    objects. The core thinking of this AI maker education platform is to cultivate
    innovative talents for the future intelligent era and enhance the intelligent
    basic literacy of the current "digital natives." Future national competition will
    certainly be a competition of emerging technologies based on intelligent technology;
    the contest of national power is essentially a contest of AI innovative talents.
    Therefore, we should rapidly promote the popularization of intelligent maker education
    platforms in various ways.


    #### Case Study: Haier Maker Education Platform


    Taking Haier''s maker education platform as an example, it is a maker education
    platform based on maker culture. Haier has many maker education platforms, including
    Haier University, Haier Maker Acceleration Platform, Haier·Haibi College Student
    Entrepreneurship Crowdsourcing Platform, Haier Maker Lab, Haier Maker Summer Camp,
    Startup Weekend (Youth Maker Edition), Youth Maker Plan, Future New Kinetic Energy,
    etc., covering a wide range and diverse types.


    Haier''s maker education originates from Haier''s "Entrepreneurship and Innovation"
    culture. In Haier Group, this culture aims to cultivate and achieve every employee
    to become their own CEO through Haier''s own learning platform and maker acceleration
    platform, and takes achieving Haier users as the core culture of maker culture,
    making Haier''s employees "everyone a maker." Since Haier built the corporate
    "dual-creation culture" and forged the "dual-creation spirit," Haier''s maker
    platforms have attracted a large number of domestic and foreign maker resources,
    and expanded the cultivation of Haier''s maker talent team through course forms
    such as open classes, youth plans, summer camps, mentor guidance, and maker open
    classes.


    With the in-depth development of the intelligent era, Haier''s maker platforms
    are developing in the direction of channel expansion and platform intelligence.
    The development of Haier''s maker platforms is not limited to the internal self-growth
    of the group but also actively steps out of the group gate, moving towards campuses
    and society. In terms of channel expansion facing schools, Haier Group created
    the Haier·Haibi College Student Entrepreneurship Crowdsourcing Platform, providing
    students with C2C and B2C services such as campus social networking, student life,
    and docking with investment institutions and merchants under the O2O model. And
    by deeply integrating modern emerging technologies and introducing intelligent
    online systems, it subverts the traditional campus consumption model. In the process
    of years of campus service and enterprise business data accumulation, Haier just
    caught up with the era of mature big data technology, enabling Haier''s maker
    education service platform to rely on big data technology to realize the platform''s
    "one-to-many" service, breaking down the barriers between various independent
    maker platforms.


    The intelligent development of Haier''s maker education platform highlights Haier''s
    maker spirit of "entrepreneurship without guarding the business." Daring to innovate
    and standing at the forefront of innovation requires enormous courage and exceptional
    forward-looking thinking. The intelligent development of Haier''s maker platform
    means that the technical direction of the entire Haier Group has shifted, and
    the entire system of the enterprise will unfold around intelligent transformation
    and upgrading, so it carries great innovation risks. But facts have proved that
    the intelligent development of their maker education platform has followed the
    trend of the times. Recently, standing at the forefront of AI maker education,
    a maker open class organized by the "Haier Frontier Innovation Center" and co-organized
    by New Wisdom Yuan started at Haier University, aiming to assist Haier''s makers
    in deeply mastering AI and VR, AR, intelligent application scenarios, and the
    future singularity, in the hope of jointly creating Haier''s intelligent new future.
    In the future, Haier''s maker education will continue to move towards a more comfortable,
    portable, and intelligent future under the guidance of its maker culture.


    #### Summary of Maker Education Practices and Policy Support


    In summary, whether it is the Chengde Zhixiang Robot Maker Education Platform
    or the Haier Maker Education Platform, both leverage the advantages and strength
    of platformization to help maker education move towards specific practice, thereby
    promoting the effective connection between educational resources and maker education
    objects. The final destination of both is to hope to fit the background of the
    intelligent era, and under the conditions of new social trends and changes in
    market talent demand, efficiently cultivate innovative and entrepreneurial talents
    adapted to the intelligent era, and take their achievements as the pride of the
    maker education platform.


    Today''s maker education is mainly oriented towards courses related to intelligent
    technology, aiming to cultivate a team of intelligent innovative talents. With
    the development and maturity of maker education, the social attention it triggers
    is getting higher and higher. Taking Shandong Province as an example, in March
    2017, the Shandong Provincial Department of Education issued the "Notice on Printing
    and Distributing the Guiding Opinions on the Construction of Maker Spaces in Shandong
    Schools," proposing to accelerate the construction of maker spaces, advocating
    relevant units in the province to actively construct innovative investment mechanisms,
    effectively integrate innovative resources, and strongly support the construction
    of maker spaces. Up to now, provinces such as Shandong, Guangdong, Henan, Xi''an,
    Shanxi, etc., have issued documents supporting the construction of maker spaces
    domestically, bringing unexpected benefits to makers.


    The introduction of AI technology into maker education means the birth of new
    intelligent models, new trends, and new concepts of maker education; the traditional
    maker education model is being deconstructed and reconstructed. Under the strong
    support of makers themselves, families, schools, enterprises, and governments,
    maker education in the AI era will further advance into a new blue ocean. Overall,
    most current practices of AI maker education focus on the basic intelligent education
    of makers. Looking to the future, maker education will, with the support of IoT,
    big data, and AI technologies, pay more attention to the high-end education field
    of AI, not only touching the basic knowledge structure of AI but also involving
    AI''s emotional education and cognitive education.


    ## Entrepreneurship Education: Incubation of Mass Entrepreneurship in the Intelligent
    Era


    As a newly emerging technical field, the development of AI technology has brought
    a great gift to the world—intelligence, prompting a paradigm shift in the world''s
    production, life, and learning modes. The way of thinking about problems and solving
    problems based on AI technology as a thinking premise, and the critical theories
    and practical theories formed among people, are all unfolding in an orderly manner
    around AI technology. At the same time, new challenges have emerged. Since emerging
    technologies represent a brand-new field, research on their theories and applications
    requires amazing forward-looking thinking to find new ways out in their frontier
    fields.


    This shows that in the intelligent era, everything people face is new, meaning
    that people must respond to real life with a completely new way of thinking, and
    also create the future with a completely new way of thinking. With the continuous
    development of AI technology, basic theoretical research on AI technology has
    entered a relatively deep field. However, the combination of AI technology with
    specific application fields is currently still in the exploration stage, such
    as the combination of AI and the medical field, the combination of AI and the
    education field, etc. Against this background, the application boom of AI technology
    will inevitably give rise to a boom in entrepreneurship regarding AI applications.


    Premier Li Keqiang called for "Mass Entrepreneurship and Innovation" at the Summer
    Davos Forum in September 2014 ^([\[10\]](#txt009.html#footnote_content_txt009_10)),
    urging the broad masses of the people to actively carry out innovation and entrepreneurship
    work.


    Under the call for "Mass Entrepreneurship and Innovation," a new wave of entrepreneurship
    has been set off in various fields in China, and AI entrepreneurship education
    closely related to it has also developed rapidly. Popularly speaking, AI entrepreneurship
    education refers to "AI + Entrepreneurship + Education," that is, applying AI
    technology to entrepreneurship education. On the one hand, it conducts entrepreneurship
    education around the field of AI education; on the other hand, it searches for
    new paths of AI entrepreneurship in many fields around AI technology.


    Dr. Li Xiaoming, chief expert of the Ministry of Education''s College Graduate
    Entrepreneurship Think Tank, stated: "China''s innovation technology education
    urgently needs to be strengthened; innovation technology theory needs to be developed
    and researched, and needs to create China''s innovation education with the help
    of AI. Innovation and entrepreneurship education needs more tools. By applying
    new technologies such as AI, we can create an atmosphere where everyone can innovate,
    anytime can innovate, anywhere can innovate. First, teachers themselves master
    the technology, then let students master innovative technology, and finally stimulate
    students'' innovative potential, thereby continuously improving China''s innovation
    ability and becoming an innovative country ^([\[11\]](#txt009.html#footnote_content_txt009_11))."
    To create a "dual-creation" atmosphere in the intelligent era, it naturally follows
    that entrepreneurship education should be carried out around the field of AI education
    in higher education institutions.


    In May 2017, the University of Chinese Academy of Sciences took the lead in establishing
    the School of Artificial Intelligence Technology; subsequently, many higher education
    institutions also set up AI schools one after another. The entry of AI majors
    into university campuses plays a significant role in cultivating intelligent entrepreneurial
    talents for the future development of intelligent society. Whether in systematic
    theoretical knowledge or professional practical skills, they have innate advantages
    in future entrepreneurship in the AI field. Therefore, when 2019 college entrance
    examination candidates filled in their 志愿 (volunteers/choices), the AI major became
    a popular major.


    AI education is cultivating the necessary talent teams for AI entrepreneurship
    education and preparing for finding new paths of AI entrepreneurship. Social development
    requires personnel walking on the front line of entrepreneurship to actively carry
    out AI innovation and entrepreneurship activities, drive the entire entrepreneurship
    field to transform its development direction, and seize the commanding heights
    of intelligent entrepreneurship.


    As early as July 2017, Google announced a project called "Developers Launchpad
    Studio" on its official website, lasting 6 months, and investing huge funds in
    the supported projects. According to Google Research Director Peter Norvig, the
    main goal of the project is to cultivate AI and machine learning startups worldwide.


    Focusing on the field of intelligent entrepreneurship education, model enterprises
    are operating in the mode of "Entrepreneurship Education + Industrial Incubation."
    Just as Tencent''s "Cloud + Entrepreneurship Plan" intelligent entrepreneurship
    education model is unfolding, Alibaba''s Ant Financial Shared Learning Platform
    is also advancing by leaps and bounds in the field of intelligent entrepreneurship
    education, and successfully won the "Zijin Product Innovation Award" at the 2019
    China AI Summit. Today, the Ant Financial Shared Learning Platform has become
    a model of domestic intelligent entrepreneurship education. For entrepreneurship
    education based on AI technology, data, algorithms, and computing power are all
    key focuses that need centralized attention. In the field of data governance for
    intelligent entrepreneurial enterprises, Ant Financial''s intelligent entrepreneurship
    education platform is deeply welcomed due to its relatively strong technical support,
    strong financial backing, and perfect curriculum system as background.


    #### Case Study: Ant Financial Shared Learning Platform


    Ant Financial helps intelligent entrepreneurial enterprises solve data problems.
    Data is the foundation of intelligence. Data privacy protection, standard data
    governance, data sharing, data silos, and other issues are major difficulties
    troubling the development of intelligent entrepreneurial enterprises. For this,
    Ant Financial has given its own professional solutions, establishing a professional
    shared learning platform dedicated to helping different entrepreneurial institutions
    and entrepreneurial individuals solve data problems. Ant Financial carries out
    enterprise data governance education on the basis of technical advantages, government
    regulations, and ethical norms, ensuring the data security of the shared learning
    platform, realizing multi-party collaboration and authorized sharing of data,
    obtaining more accurate and efficient data models and decision-making frameworks,
    and thereby releasing the data value of intelligent entrepreneurial enterprises.


    From the above discussion, it can be seen that the AI schools of higher education
    institutions indirectly cultivate intelligent talents for social development,
    while the Ant Financial Shared Learning Platform invisibly helps the rise of many
    intelligent enterprises through education. It is visible that no matter what form
    of entrepreneurship education, it will closely revolve around AI technology. In
    general, entrepreneurship education based on AI technology should make full use
    of three types of platform resources: campuses, enterprises, and educational institutions,
    actively explore "two markets" domestic and international, effectively use a series
    of AI technologies to continuously extend into the depth of AI applications, thereby
    realizing the deep fit between AI entrepreneurship education and the development
    of the times, and meeting the diversified needs of social development and human
    development.


    ## Collaborative Efforts: Cultivation of Innovative Thinking in the Intelligent
    Era


    The focus of innovation, maker, and entrepreneurship education is to cultivate
    students'' creative thinking ability, which requires us to grasp the characteristics
    of creative thinking and promote the implementation of "Three Creations Education"
    (Innovation, Maker, Entrepreneurship).


    Creative thinking refers to the process of reorganizing existing knowledge and
    experience, proposing new solutions or procedures, and creating new ways of thinking.
    It develops on the basis of general thinking and is a manifestation of the high
    development of human thinking ability. As a high-level thinking in human thinking,
    it has the following main characteristics.


    ### Characteristics of Creative Thinking


    #### Breaking Conventions, Differing from Tradition


    First, breaking conventions, differing from tradition. Creative thinking often
    manifests in non-logical, unconventional forms, that is, differing from traditional
    experience and methods. It can question existing theories and boldly conceive
    new theories and new methods. This is a significant feature distinguishing creative
    thinking from traditional thinking. As the famous writer Wilde said: "The first
    man to compare a woman to a flower was a genius; the second was a mediocrity;
    the third was a fool." The famous mathematician Gauss, when in elementary school,
    solved the problem "What is the sum of 1 to 100?" not by using the traditional
    method of calculating "1+2+3+...", but by using a unique method: 101×50=5,050.
    This algorithm broke the convention and was original, embodying creative thinking.


    #### Active and Enterprising, Daring to Advance


    Then, active and enterprising, daring to advance. The initiative and enterprising
    nature of creative thinking show that the creator''s psychology is in a state
    of active advancement, exerting the maximum subjective initiative of the individual.
    Relying on this positive mentality, creators can overcome various difficulties
    and obstacles to win new victories. British doctor Jenner, after 30 years of repeated
    experiments, finally achieved the result of inoculating cowpox into animals to
    give them immunity. Afterwards, he took great risks to conduct human inoculation
    experiments on his own children, finally confirming that cowpox can prevent smallpox.
    It is visible that being active, enterprising, and daring to advance is one of
    the significant characteristics of creative thinking, and also one of the important
    conditions for ensuring creative achievements.


    #### Being Different, Bold and Unique


    Second, being different, bold and unique. Creative thinking often has the characteristics
    of novelty and uniqueness, therefore it is often pioneering, even isolated. When
    Wegener proposed the continental drift hypothesis, the whole world was in an uproar;
    suspicion, ridicule, and reproach put him in a dilemma of isolation and helplessness.
    It was not until decades after Wegener''s death that the continental drift theory
    was gradually accepted by people. A student, when he has mastered creative thinking,
    can not only assimilate new knowledge and new concepts into his existing conceptual
    and knowledge systems but also use new knowledge and new concepts to transform
    old concepts. Therefore, when solving problems, he does not rigidly adhere to
    formulas, can integrate and master them comprehensively, apply them flexibly,
    and solve problems conveniently and simply.


    #### Three-Dimensional Thinking, Keen Insight


    Third, three-dimensional thinking, keen insight. Traditional thinking often thinks
    from a single direction; once encountering difficulties, it often blocks the train
    of thought, making the problem unsolvable. Creative thinking belongs to multi-directional
    thinking; it forms three-dimensional thinking from different directions, different
    angles, different levels, or from point to surface, from surface to point, point
    and surface coexisting, multi-route complementing each other. Due to its multi-directionality
    in thinking, solving problems appears different, and it can think of methods others
    cannot. When solving problems, some students only use one method, some use multiple
    methods, and even use methods not introduced in textbooks. Therefore, the latter
    considers problem angles much larger than the former, and the component of creative
    thinking is also greater. The gain of these students is not only learning knowledge,
    but more importantly learning thinking methods, thus obtaining greater exercise
    and improvement.


    #### Flash of Inspiration, Sudden Emergence


    Finally, flash of inspiration, sudden emergence. Creative thinking often flashes
    in the human brain in the form of sudden arrival. Of course, this suddenness is
    not "falling from the sky," but the result of the brain''s highly concentrated
    intense thinking and experience accumulation over time. The well-known Newton''s
    proposal of the law of universal gravitation and Kekulé''s proposal of the ring
    structure of benzene are good examples.


    ### Strategies for Cultivating Creative Thinking


    Creative thinking is not innate to everyone. Under the past exam-oriented education
    conditions, overemphasis on scores and knowledge education, neglecting quality
    and "Three Creations" education, resulted in students'' innovative abilities not
    being well developed. Therefore, in the new intelligent era, when we promote "Three
    Creations" education and cultivate "Three Creations" talents according to the
    characteristics of creative thinking, we must pay special attention to the following
    points.


    #### Establishing Innovation Awareness


    First, establish innovation awareness. First, there must be the desire and expectation
    for innovation. Only with the idea of wanting to innovate will people actively
    pay attention to the formation process and results of innovative thinking. Second,
    establish innovation awareness. Establishing innovation awareness is the ideological
    foundation for cultivating creative ability. Third, master the methods of establishing
    innovation awareness. There is an intrinsic connection between innovation awareness
    and innovative thinking; there is no absolutely opposing trend between the two,
    but more of a mutually complementary and mutually promoting relationship. Therefore,
    mastering the methods of establishing innovation awareness will inevitably help
    people form innovative thinking. Finally, integrate innovation awareness into
    quality-oriented education. In promoting quality-oriented education, students
    must be made to establish innovation awareness, especially to have curiosity,
    thirst for knowledge, and a sense of doubt, as well as maintain the independence
    and creativity of thinking.


    #### Overcoming Negative Thinking Patterns


    Second, overcome negative thinking patterns. Cultivating students'' innovative
    thinking requires attention to correcting and overcoming some negative thoughts
    and ideas that hinder innovation, especially overcoming mental laziness, half-knowledge,
    rigidity and singularity, all talk no action, "I can''t do it," "following the
    crowd," and other problems.


