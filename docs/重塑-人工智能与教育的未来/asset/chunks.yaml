    28.认识到人工智能应用程序可能带有不同类型的偏见,这些偏见是训练人工智能技术所使用和输入的数据自身所携带的以及流程和算法的构建和使用方式中所固有的。认识到在数据开放获取和数据隐私保护之间的两难困境。注意到与数据所有权、数据隐私和服务于公共利益的数据可用性相关的法律问题和伦理风险。注意到采纳合乎伦理、注重隐私和通过设计确保安全等原则的重要性。


    29.测试并采用新兴人工智能技术和工具,确保教师和学习者的数据隐私保护和数据安全。支持对人工智能领域深层次伦理问题进行稳妥、长期的研究,确保善用人工智能,防止其有害应用。制定全面的数据保护法规以及监管框架,保证对学习者的数据进行合乎伦理、非歧视、公平、透明和可审核的使用和重用。


    30.调整现有的监管框架或采用新的监管框架,以确保负责任地开发和使用用于教育和学习的人工智能工具。推动关于人工智能伦理、数据隐私和安全相关问题,以及人工智能对人权和性别平等负面影响等问题的公开辩论。


    31.注意到缺乏有关人工智能应用于教育所产生影响的系统性研究。支持就人工智能对学习实践、学习成果以及对新学习形式的出现和验证产生的影响开展研究、创新和分析。采取跨学科办法研究教育领域的人工智能应用。鼓励跨国比较研究及合作。


    32.考虑开发监测和评估机制,衡量人工智能对教育、教学和学习产生的影响,以便为决策提供可靠和坚实的证据基础。


    33.基于各国自愿提交的数据,监测并评估各国之间人工智能鸿沟和人工智能鸿沟和不均衡性,并且注意到能够获取使用和开发人工智能和无法使用人工智能的国家之间两极分化的风险。重申解决这些忧虑的重要性,并特别优先考虑非洲、最不发达国家、小岛屿发展中国家以及受冲突和灾害影响的国家。


    34.在“2030年教育”的全球和地区架构范围内,协调集体行动,通过分享人工智能技术、能力建设方案和资源等途径,促进教育人工智能的公平使用,同时对人权和性别平等给予应有的尊重。


    35.支持对与新兴人工智能发展影响相关的前沿问题进行前瞻性研究,推动探索利用人工智能促进教育创新的有效战略和实践模式,以期构建一个在人工智能与教育问题上持有共同愿景的国际社会。


    36.确保国际合作有机配合各国在教育人工智能开发和使用以及跨部门合作方面的需求,以便加强人工智能专业人员在人工智能技术开发方面的自主性。加强信息共享和有良好前景应用模式的交流,以及各国之间的协调和互补协作。


    37.通过联合国教科文组织移动学习周等方式并借助其他联合国机构,为各国之间交流有关教育人工智能领域的监管框架、规范文本和监管方式提供适当的平台,从而支持在发掘人工智能潜力促进可持续发展目标4方面开展南南合作和北南合作,并从中受益。


    38.建立多利益攸关方伙伴关系并筹集资源,以便缩小人工智能鸿沟,增加对教育人工智能领域的投资。


    39.建立一个“人工智能服务于教育”的平台,作为开放源人工智能课程、人工智能工具、教育人工智能政策实例、监管框架和最佳做法的信息交流中心,以期推动利用人工智能促进可持续发展目标4,支持就教育和学习的未来开展辩论,并使开放源码人工智能资源和课程向所有人开放。


    40.在与会员国开展咨询的基础上制定教育人工智能指导纲要并开发资源,以支持会员国制定促进教育领域有效和公平应用人工智能的政策和战略。支持对教育政策制定者的相关能力建设。


    41.通过强化相关部门及处室并动员联合国教科文组织的机构和网络,加强联合国教科文组织在教育人工智能领域的引领作用。


    42.支持将人工智能技能纳入教师信通技术能力框架,支持各国就教职人员如何在富含人工智能的教育环境下工作开展培训。


    43.在教育人工智能方面,进一步扩大联合国教科文组织与相关联合国机构和多边合作伙伴、地区开发银行和组织以及私营部门的合作。


    44.此次大会之后,采取适当的地区和国际性后续行动,与活跃在这一领域的发展伙伴合作,巩固并扩大本共识的影响。


    二、教育的革命：大数据与个性化教育探讨


    教育的革命：大数据与个性化教育探讨


    摘 要：依托大数据可以记录学生的行为数据,了解学生的个性化需求,推荐个性化学习内容,了解教师的教学行为,完善教育评价,实现个性化教育,从而导致教育的革命性变革。大数据技术在驱动个性化教育的同时,也面临着技术资源问题、专业人才缺乏、教育歧视风险、教学效果较差、教育观念滞后与隐私安全挑战。探寻大数据时代个性化教育的新路径,就要保持理性思考,创新教育思维,发展大数据技术,加强人才培养,注重多方协作并重视数据隐私保护。


    关键词：教育;个性化教育;大数据


    教育是国之大计,是民族复兴和社会进步的基石,是人全面发展的根本途径。在不同时代,教育有着非常不同的内涵和形式。从农业时代的私塾式教育模式到工业时代的工厂式班级教育模式,再到信息和智能时代基于新一代信息技术和人工智能技术催生下的以数据为支撑的科学化、智能化、个性化的教育模式,教育的内涵在不断扩大,教育的形式在不断变化——更加符合人性和人的全面发展需要的个性化教育,在经历了否定之否定之后,正在向更高层次复归。如今,大数据掀起了一股教育改革的浪潮,推动个性化教育的蓬勃发展。而教育大数据热潮在引发个性化教育发展的同时也产生了一系列新的挑战。因此,有必要分析大数据时代教育的新态势与新挑战,探讨大数据时代下个性化教育发展的新路径,使大数据更好地为推动教育改革与发展服务。


    (一)大数据推动个性化教育的发展


    我国政府于2010年发布的《国家中长期教育改革和发展规划纲要(2010—2020年)》中提到：“关注学生不同特点和个性差异,发展每一个学生的优势潜能。”“关心每个学生,促进每个学生主动地、生动活泼地发展,尊重教育规律和学生身心发展规律,为每个学生提供适合的教育。^([\[2\]](#txt012.html#footnote_content_txt012_2))”可见,国家在教育规划中,十分强调和重视个性化教育。实际上,新时代教育发展的大方向是个性化教育,这也是教育适应人工智能时代科技进步和大数据发展的大趋势。个性化教育遵循学生的个体差异性、成长规律和教育规律,为学生提供丰富多彩的课程内容和实践活动,培养学生自主学习能力和适应时代发展需要的能力,挖掘个体的生命潜能,使学生朝着全面、个性、自由、健康的方向发展。而这一切,都与教育大数据发展和运用的方向相一致。利用大数据技术,可以记录学生的行为数据,了解学生的个性化需求,推荐个性化学习内容,了解教师的教学行为,完善教育评价,促进个性化教育的发展。


    1.记录学生的行为数据


    一个“一切都被记录,一切都被分析”的大数据时代的到来,为个性化教育的发展提供了可能性和现实性。学生在线上学习时会留下一连串的“数字足迹”,这些“数字足迹”包括学习过程的行为数据、学习结果的评价数据,以及通过在线学习形成的社会网络关系数据等。在大数据场景中,课程中每个学生的入学课程评估、讨论板输入、博客入门或维基活动等可以立即记录并添加到数据库中^([\[3\]](#txt012.html#footnote_content_txt012_3))。通过记录网页的点击次数、搜索足迹、课程资料的选择、视频的观看时间,反复观看的频率、暂停的次数、跳转的次数、点击视频的时间点等学生行为数据,以及作业完成情况、测试结果、答疑质量等学习成果的评价数据,一方面可以准确地分析学习资源的质量和效果,进而优化学习资源;另一方面可以使学生对自己这一时间段的学习情况进行分析和总结,确定最适合自身个性化学习的策略,以便日后对学习行为进一步优化。


    随着新一代信息技术和人工智能技术的发展及其在教育中的广泛应用,大数据对学生的行为数据进行采集、记录、分析和挖掘,使新时代的教育能够借助先进技术的发展从宏观群体走向微观个体,跟踪每一位学习者的行为足迹,为实现个性化教育奠定了技术条件。


    2.了解学生的个性化需求


    通过对学生行为数据进行记录、分析和挖掘,可以了解学生的个性化需求。霍华德·加德纳的多元智能理论认为,每个人由八种基本智能(语言智能、逻辑智能、音乐智能、身体动觉智能、空间智能、人际智能、内心智能和自然智能)不同程度地组合在一起,正是这八种智能的不同组合产生了个体差异^([\[4\]](#txt012.html#footnote_content_txt012_4))。实际上,个体差异不仅表现在生理上,还表现在人格特点、认知方式、学习经历、学习偏好、学习需求和学习能力以及社会背景等方面。不同个体存在着明显的差异,即便同一个体,其不同方面的发展也会随着时间而变化。在学习的过程中,个体的差异性会直接或间接地影响学生身心的健康发展。因此,教育工作者要承认学生的个体差异性,尊重学生的独特性,了解学生的个性化需求,并针对学生的兴趣、爱好、志向、才能、专长等不同的特点,因材施教。


    大数据时代,通过对学生行为数据的记录,可以了解每个学生的个性化学习需求,并通过大数据技术找到合适的学习资源和学习系统,从而实现真正意义上的个性化教育。学生在网上会留下学习过程的“数字足迹”,通过对这些数据进行分析和挖掘,可以了解每个学生的学习进度、学习方法以及兴趣爱好等内容。学生的知识水平、能力水平、未来规划、兴趣爱好以及长板、短板等方面的不同,会影响他们对学习内容和学习方法的选择。大数据可以使我们了解到年龄不同、地区不同、身份不同的学习者的各式各样的学习需求,并以此开发出丰富多样的学习资源,为学习者提供多种选择和个性化的学习指导。


    3.推荐个性化的学习内容


    英国著名大数据专家维克托·迈尔·舍恩伯格指出,大数据和教育的结合,将超越过去那些“力量甚微的创新”而创造真正的变革。他总结了大数据改善学习和教育的三大核心要素：反馈(feedback)、个性化(individualization)和概率预测(probabilistic
    predictions)^([\[5\]](#txt012.html#footnote_content_txt012_5))。在大数据时代,充分应用大数据技术的概率预测、个性化和反馈功能,对数据行为整合成有效信息,根据学生的需求和能力,推荐不同的学习内容、学习方式,为每个学生提供最合适的教学材料,让学生自主选择所需的学习资源、制订适合的学习计划、自由地安排学习时间和地点,从而达到自我学习、主动学习、个性化学习的目的。


    大数据技术还能够从大量学生的学习中获得某类型人才所需要具备的知识。如果一个学生持续地学习了某几门课程,大数据技术可以采集、记录、分析、挖掘得出该生的学习需求,并为其推荐其他可能要学习的课程,再通过学生的自主选择来确定要学习的课程。因为在信息化时代,知识增长的速度加快,网上海量、碎片化、爆炸式的教育资源会导致信息冗杂,学生不容易获得个性化学习的最佳资源。由于学生不清楚某类人才所需要的所有知识,自己无法选择后续课程学习,更不用说选择相应的优质课程,这挑战着学生的学习能力、信息处理能力和认知能力,容易出现信心缺失、效率低下等问题。但是,大数据技术能够很容易地做到这一点,通过大数据的收集和分析,学习内容将根据分析结果加以改变和调整,知识的传递得到个性化处理,从而使学生能高效地完成学习目标和计划,进而获得个性化发展。


    基于大数据技术的应用,一些互联网在线教育,如翻转课堂和慕课,通过即时、全面、高效、细致地收集、记录、存储学生的学习能力、学习方法、学习过程等大量数据,分析并得出学生的学习兴趣、学习特点、学习效率等结论,能结合不同类型学生的学习需要与能力,研发适合学生需求的教育产品和教育系统,帮助学生自主学习和个性化学习。


    4.了解教师的教学行为


    大数据时代,除了通过记录学生的学习行为数据、了解学生的学习需求、推荐个性化学习内容外,还可以通过对教育大数据的分析和研究了解和完善教师的教学行为。


    传统的学校教育模式是普鲁士教育模式,采用的教学组织形式是按照年龄来划分年级的大班授课制,教学都是按照事先的教学计划来执行的,教师每节课要完成指定的教学任务,有限的时间和精力很难去照顾每一位学生的个性化发展。而且在传统教育中,教师的角色是无法替代的,学生在教师的主导下被动地接受知识,机械地记忆所讲授的内容,久而久之就会形成懒惰和依赖心理,不愿独立思考,丧失了自主学习和自我规划的能力,创新能力更受到影响。


    大数据分析技术通过对学生各方面的数据进行挖掘,发现隐藏在数据身后的有价值的信息和知识。学习分析系统对收集到的数据进行处理之后,可以提取出一系列信息,这类信息的一个显著特征是具备预测性,利用这些信息可以给教学带来极强的针对性^([\[6\]](#txt012.html#footnote_content_txt012_6))。大数据的分析、统计和反馈功能可以帮助教师详细具体地了解学生的学习行为、学习能力、学习习惯、学习需求等内容,了解自己的教学行为和教学效果以及什么样的教学方法对学生的学习是最有效的,针对学生的学习发展情况来调整教学方案,教学安排上不再固守于同样的顺序,知识的传递得到个性化、灵活地处理。


    除了改善教师的教学行为,教师角色也将发生巨大变化,他们不再作为只是课本知识的传授者对学生灌输式授课,而是在教学中更加注重培养学生的思维能力、知识理解与运用能力、信息收集与分辨能力等,激发学生的创造性思维。在和学生的关系上是亦师亦友,更加了解学生、理解学生、尊重学生的个性、促进学生个性化发展。另外,利用大数据技术可以对教师进行全面考核,跟踪教师的教学过程,帮助教师分析教学效果,使教师及时调整教学方法,提高教学质量。


    5.促进全面客观的教育评价


    教育评价是根据一定的教育价值观或教育目标,运用有效的评价技术和手段,通过系统地搜集信息资料和分析整理,对教育活动满足教育主体需要的程度作出的价值判断活动^([\[7\]](#txt012.html#footnote_content_txt012_7))。大数据下的教育评价是基于教育活动过程中产生的数据进行分析的,要形成科学、客观、全面的教育评价,其有效途径就是让“数据说话”,让数据成为教育评价的重要依据。


    大数据使得教育形成以全方位、多层次、多领域、多角度的评价机制。第一,扩大评价指标。在应试教育下,传统的学习评价指标是考试成绩和排名,它不仅无法全面评价学生的学习情况,对成绩的片面追求还忽略了学生的身心健康发展,影响学生学习的主动性、积极性和创造性。大数据将重塑教育评价系统,将传统的单一的结果式评价转变为基于大数据的过程式评价、成长评价和综合性评价等,重视学生的学习过程、学习体验、学习效果、素质提升和师生的交流互动。


    第二,形成多角度、多领域、多主体的评价。教育评价对象不仅限于学生,还应该包括课程、教师、学校等对象。大数据的数据储备和技术理念使实现包括学生评价、教师评价、学校评价、区域教育发展评价、课程等众多评价对象的综合评价模式成为可能^([\[8\]](#txt012.html#footnote_content_txt012_8))。传统的德智体美劳的评价也不再适应新时代素质教育、个性化教育的发展要求,要重视培养学生的创新能力,将学生的全面发展评价扩展到思想道德、知识技能、人际关系、创新思维、实践能力、身体素质等方面。


    第三,转变评价功能。对学生的评价不是为了区分优劣,而是通过数据的收集和分析,了解学生的能力,并针对学生的情况提出建设性意见给予学生指导,以充分发挥自身的潜能。学校可以通过大数据、互联网和云服务建立起学生综合素质评价体系,学生的所有数据和信息被全方位地收集和记录。通过这些数据,可以很好地观察学生的变化发展,并依据数据分析为学生提供个性化的评价和指导。以多角度、全方位、多类型、多规格、多层次的全面客观评价机制,代替现行的单纯以分数为标准的评价制度,既是大数据“4V”特征(大量、多样性、及时性、真实性)的要求,也是大数据和人工智能时代个性化教育的追求。


    (二)大数据驱动个性化教育之问题


    大数据驱动个性化教育是一个复杂的系统工程,既涉及技术、经济、社会、教育等众多方面,又关涉理念、行动、伦理、政策等许多因素,目前存在着如下重要问题。


    1.技术资源问题


    大数据一方面促进了传统教育方式的改变,推动个性化教育发展;另一方面,我国目前大数据技术资源比较薄弱,对个性化教育的发展提出了挑战。第一,技术支撑的限制。教育是一个长期的复杂的过程,受限于现实条件,当前的技术手段还无法短时间内普遍实现对海量教育数据的收集、处理和分析。教学数据、管理数据、科研数据和服务数据等教育大数据种类繁多,数据的处理能力对视频、音频、图片、文字、教案等非结构化数据还存在着不足。第二,技术标准的缺失。行业的垂直建设,构成多个行业之间甚至同一行业的不同部门之间条块分隔的“数据孤岛”和“数据烟囱”。海量数据以各种形式分布在教育行业的各个部门中,存在着同类数据被反复采集、数据标准不一等问题,给大数据驱动个性化教育发展带来了极大的挑战。第三,数据鸿沟的扩大。由于经济、科技、教育等原因,国家、地区、行业间的大数据技术资源分布不均,很多学校缺乏必要的大数据基础设施建设。另外,部分地区、学校、教育机构办学理念较封闭,不愿开放共享自己的教育资源和数据,造成数据鸿沟有扩大之势。


    2.专业人才缺乏


    为顺应时代发展的要求,推动个性化教育,需要一批大数据研究者与实践者,需要一批既了解教育又掌握大数据技术与管理的综合型人才。然而,目前我国缺乏教育大数据的专业人才,因此培养优秀的专业人才刻不容缓。大数据时代下,各种数据信息大量充斥在教育活动中,这就要求专业人才对海量数据保持高度的敏感以发挥大数据的价值功能。因此,教育部为实施国家大数据战略,相继增设了“数据科学与大数据技术”专业,培养大数据人才。许多高校也创建了大数据研究院,开设了大数据方面的课程。虽然目前部分高校建立了大数据专业,但在配套课程体系的建设、人才培育的模式等方面仍处于初步探索阶段,短期内难以培养大量优秀的教育大数据从业者,因此缺乏专业人才和综合型人才。


    3.教育歧视风险


    随着大数据热度的攀升,以数据为评判标准的理念开始大行其道,大数据成为教育者进行教育决策的工具。而对大数据的崇拜,使“潜在歧视”深藏于个性化教育的过程中,加剧教育者误判与歧视的风险,在教育实践中更有可能影响学生身心健康的发展。'
