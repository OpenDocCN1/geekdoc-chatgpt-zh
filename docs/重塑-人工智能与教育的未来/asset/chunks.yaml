    [OL\\].https：//study.baidu.com.\n\n[\\[10\\]](#txt008.html#footnote_quote_txt008_10)于长虹,王运武,马武.智慧校园建设的现状、问题与对策\\\
    [J\\].教学与管理,2015(06)：48-51.\n\n\uFEFF\n\n第九章 三创教育：创新性思维能力的培养\n\n局限分析：智能时代阻碍创新的因素\n\
    \n创新教育：智能时代万众创新的培养\n\n创客教育：智能时代万千创客的成长\n\n创业教育：智能时代大众创业的孵化\n\n协同发力：智能时代创新思维的培育\n\
    \n近些年来,创新教育、创客教育与创业教育(三创教育)备受广大教育工作者和社会各界的关注,一方面是源于三创教育的价值,另一方面也是因为三创教育对于智能时代科技快速发展及其向现实生产力转化的有力回应。自国家和社会大力弘扬三创教育文化以来,埋藏于人们心中的、普遍受到工业文化限制的、多年以来没有得到很好释放的创造激情,被一下子点燃起来了,从而从根本上引发人们重新思考当下教育,尤其是思考当下三创教育的本质、目的、实践与应用,思考如何在智能新时代培养学生的创新性思维能力。\n\
    \n一、局限分析：智能时代阻碍创新的因素\n\n创新性思维,是指打破常规与思维定式,在原有的思维边界之外思考问题、解决问题和创造新事物的思维方式,本质上是创造和革新。创新性思维,亦是指因时制宜、知难而进、开拓创新的科学思维^([\\\
    [1\\]](#txt009.html#footnote_content_txt009_1))。\n\n从历史上看,创新性思维,带有明显的时代印记。在传统的农业时代和工业时代,创新性思维主要是围绕农业和工业进行;在大数据时代,创新性思维主要是站在数字化与数据化的角度进行;在人工智能时代,创新性思维主要是围绕智能而进行。譬如,人工智能时代的创新性思维,主要是一种跨界思维、整合思维与相关性思维。这种思维方式的缘起与发展,得益于大数据和人工智能技术本身的发展理念所延伸出来的社会文化,在潜移默化中成就了一个时代的创新文化,由此催生创新教育,推动着人们研究创新性思维。\n\
    \n人工智能时代,整体与部分开始呈现出有机统一的和谐关系,各个视域从“分裂”走向“综合”,人们的行为方式由“单向度”走向“多元智能”,技术领域也开始从单个“技术独立体”走向“技术复合体”。现如今这种“整体化”“多元化”与“综合化”趋势已成为必然,人们发明的智能机器,不仅要指望它能够代替人类从事多方面的重复性劳动,甚至还希望它能够在思维方式领域减轻人类的负担。为此,人们势必要首先创造出能够集“思维、行为与情感”为一体的复杂机器。所以,客观上只有具备创新性思维与创新能力的人,才能更好地适应这个时代发展的需要。\n\
    \n2019年1月,习近平总书记在省部级主要领导干部坚持底线思维着力防范化解重大风险专题研讨班开班会上发表重要讲话时强调,要提高战略思维、历史思维、辩证思维、创新性思维、法治思维、底线思维能力,并特别强调创新性思维的重要性。习近平总书记指出：“创新是一个民族进步的灵魂,是一个国家兴旺发达的不竭动力,也是中华民族最深沉的民族禀赋。”在习近平总书记看来,“激烈的国际竞争中,惟创新者进,惟创新者强,惟创新者胜。”在如今这个时代,抓住了创新,就抓住了牵动经济社会发展全局的“牛鼻子”。实践证明,大到一个国家,小到一个地方、一个企业,“创新都是引领发展的第一动力”。因此,习近平总书记始终要求,“必须把创新摆在国家发展全局的核心位置,把科技创新摆在更加重要位置”^([\\\
    [2\\]](#txt009.html#footnote_content_txt009_2))。可见,创新性思维与创新能力既关系党和国家的前途和命运,又关系企业的未来和个人的长远发展,真可谓“抓创新就是抓发展,谋创新就是谋未来。”\n\
    \n创新性思维是创新能力的根本。一个没有创新性思维的人,无论通过怎样的方式,都没办法从根本上让其拥有创新的智慧。创新性思维的核心是发散思维、联想思维与整合思维。如果不能掌握创新性思维的核心和本质,就很难发挥出创新性思维的魅力。由此可见,创新性思维是一系列关于思考问题的新思维的总和。"
