    根据各国各项诺贝尔奖奖项得主人数的世界前5强^[\[6\]](#txt003.html#footnote_content_txt003_6)统计数据显示，美国以绝对优势稳居世界第一，其他的诺贝尔奖得主包括英国、德国、法国、俄罗斯、日本、以色列、瑞典、西班牙、瑞士、荷兰、挪威等。可见，诺贝尔奖得主的世界前五强中并没有出现中国的身影。


    图3-1所示的数据已经从一个侧面反映出中国与世界的差距不是毫厘之差，而是相差甚远。从世界人口的分布情况来看，按照常理，中国的诺贝尔奖获得数据应该是处于世界前列。但从近代至今，上述现象确实令人诧异，“李约瑟难题”与“钱学森之问”诞生于中国，一定与这种“反常”有关。


    从世界视野看中国教育，重思我们的教育势在必行。在智能时代，中国的教育应该改变这种现状，世界顶尖创新人才、大科学家、大哲学家等，也应该在中国的土壤中生根发芽，并能够在新时代教育环境的支持下，实现茁壮成长。


    在智能新时代，我们的教育，理应知难而上，迎头赶上。


