    ## 引言


    但是,这种以逻辑思维教育为主,加上“填鸭式”的教育和学习方式,使左脑使用“过度”,而对于有关右脑的课程被忽视,右脑受到压抑。创新工作既需要右脑的主导,又需要左、右脑的配合。从思维上讲,既要善于分析思维,又要善于直觉思维;既善于收敛思维,又善于发散思维;既善于抽象思维,又善于具体思维。


    因此,在智能时代,要培养创新人才,就要特别注意开发教育对象的右脑,并使左右脑和谐地发展。审美心理学告诉人们,由感知、理解、想象、情感等因素参与的审美过程,实质上是一个认识过程,只不过认识的对象具有形象性的特征而已。从生理机制上看,主要是大脑右半球的功能。以形象教育、情感教育为特征的美育对于开发右脑,并促使左右脑和谐地发展具有重要的作用。它能提高人的感受性,训练形象记忆能力,发展想象力和形象思维能力,培养人的直觉能力,诱发人的创造灵感,从而促进人创造力的发展。


    ### 从科学方法论上看


    对美的追求能够诱发智能研究的动机。动机是促使个人产生行为的原因。科学活动,同人类其他活动一样,动机对研究课题的选择和研究过程的进展等都具有重要的影响。科学家极大的创造热情和研究动机在很大程度上来源于他们的美感。美国著名科学哲学家库恩指出,在新的科学范式代替老的科学范式时,“新理论被说成比旧理论更美、更适当或者更简单”,在新理论建立中,美的考虑的重要性有时可以是决定性^([\[9\]](#txt010.html#footnote_content_txt010_9))。同时,美学原则也为科学研究提供了方法论原则,如对称性原则、简单性原则和和谐性原则等。爱因斯坦早就指出,应该把“外在的事实证明”与“内在的完美”作为选择科学理论的要求。


    ### 从人的身心健康上看


    健与美是不能分开的,因为人不仅是自然存在物,更重要的是社会存在物。在教育中,只有将美育与体育结合起来,才能培养人的身体美、精神美和技巧美等,使人具有自然的外在美和社会的内在美的健美风貌,获得和谐发展。不仅如此,美育还能够以美怡情,调节心绪,疏导情感,保持心理平衡,促进身心健康发展,因为对美的感受、理解、欣赏和创造,总会给人带来精神上的享受,令人怡神悦态。


    我国古代思想家荀子说：“乐行而志清,礼修而行成,耳目聪明,血气和平,移风易俗,天下皆宁,美善相乐”^([\[10\]](#txt010.html#footnote_content_txt010_10))。亚里士多德也说：“音乐对于人们不仅可资怡悦,就解除疲劳而言,也是有益的”^([\[11\]](#txt010.html#footnote_content_txt010_11))。据最新研究表明,当人听一曲莫扎特之后,人的大脑活力将会增强,思维更敏捷,行动更有效,就像是给生锈的大脑零部件上了油。这甚至可作用于癫痫病人等患神经障碍的人,缓解他们的病情。这就是所谓的“莫扎特效应”^([\[12\]](#txt010.html#footnote_content_txt010_12))。其实,不惟音乐,所有其他形式的艺术教育和审美教育都具有类似的功效,是单纯的体育锻炼所无法达到的。通过美育所塑造出来的身心健康的和谐发展的人,正是智能时代所需要的具有创新特质的人。


    ## 三、艺术教育：激发人的想象力和创造力


    艺术教育能开发右脑潜能并使左右脑平衡发展,有助于创新酝酿和产生创造性设想,激发创新动机,为创新提供方法论原则,培养直觉力、想象力并诱发创造灵感,对创新活动和培养创新人才具有重要作用。当前应克服片面强调专业教育的影响,加强艺术教育,培育创新人才,提高我国的科技创新能力。


    美国洛杉矶市生物化学家罗伯特·鲁特·伯恩斯坦,长期以来一直从事科学与艺术之间的“神秘联系”的探索。最近,他在完成了对古今150名著名科学家和艺术家传记的研究后说,爱因斯坦和毕加索、巴斯德和巴赫之间存在着众多令人吃惊的“共同点”。达·芬奇是画家,他的名画《蒙娜丽莎》千古流传,同时,他也是一位科学家,他在物理、地理、医学与军事等方面均有杰出贡献;爱因斯坦,举世闻名德裔美国科学家,现代物理学的开创者和奠基人,相对论、“质能关系”的提出者。同时,他也是一位出色的小提琴手,深爱着艺术。史蒂夫·乔布斯曾说过：“为什么苹果公司能够获得如此出色的成就?是因为在员工招聘时我们有意招收了一群人,他们是音乐家、艺术家、诗人,而碰巧,他们又都是计算机领域的科学家,正是这批人改变了世界。”可见,但凡具有艺术修养的科学家和发明家在科技活动中更容易有重大创新,又说明了艺术教育在培养科技创新人才中的重要作用。


    ### 一方面、艺术教育与右脑开发


    现代脑科学通过裂脑人和正常被试者的研究表明,大脑左右两个半球在功能上是不对称的。多数人左半球是言语中枢和数理、分析思维的中枢,而右半球则是空间关系、型式关系、音乐和艺术欣赏的中枢^([\[13\]](#txt010.html#footnote_content_txt010_13))。人的创新能力的高度发展是大脑左右半球的功能平衡发展并在活动上相互密切配合的结果。在这里,长期被教育所忽视的右脑的功能就凸现了出来。以形象教育、情感教育为特征的艺术教育对于开发右脑,并促使左右脑和谐地发展具有重要的作用。通过艺术教育,将形象思维和抽象思维(逻辑思维)有机地结合起来,去充分调动脑的“次要半球”的积极性,去努力补偿脑的“优势半球”的功能,使人脑左右两半球得到平衡协调发展,从而形成这样的机制：艺术教育→促进形象思维→促进右脑开发→促进创新思维能力提高→智力和创造力发展。美国哈佛大学博士艾斯纳的研究进一步支持了这种结论。他确认,艺术教育可以促进八种主要的创造能力因素的发展——对事物关系的感知能力、对细微差异的注意力、运用多元方法解决问题的意识、在过程中转换目标而不固守概念的能力、在无章可循的情况下决策的能力、在一种受约束环境中的操作能力、想象力与创造力以及用审美的视野洞察世界的能力^([\[14\]](#txt010.html#footnote_content_txt010_14))。


    ### 另一方面、艺术教育与思维方式


    科学认识是一种极其复杂的活动,有众多的因素参与其中。但科学发现过程是“由理性活动和主要表现为直觉和灵感的创造性思维交互作用构成的。”理性准则和直觉灵感起着“互补方法论”的作用^([\[15\]](#txt010.html#footnote_content_txt010_15))。直觉和灵感都具有直接性、突发性、非逻辑性、整体性和独创性等特点。在现代科学技术条件下,这种思维方式对科学研究和技术发明具有愈来愈重要的方法论价值。这是由现代科学所研究的对象和特点决定的。现代科学在高度分化的基础上高度综合,向着两极化的方向快速推进,试图揭示自然界更深、更广、更久远、更复杂的层次和各种极限状态下的运动规律,其研究的对象愈来愈是一些带有根本性的宇宙之“道”。


    在这种情况下,近代以来建立在观察、实验、逻辑和数学的科学方法以及分析和还原的思维方式基础之上的经验科学已逐渐显露出自身的局限性。过分强调单一性、永恒性和简单性,忽视和排除多样性、暂时性和复杂性,造成了科学内部的抵触、冲突和危机。


    20世纪,相对论、量子力学、基本粒子理论和系统科学的形成和发展,表明了经验科学时代盛行的实证主义的思维模式已不能适应时代的需要。像爱因斯坦这样的科学伟人,都主张以新的思维模式代替实证主义。他认为,科学发现的道路首先是直觉的而不是逻辑的。“物理学家的最高使命是要得到那些普遍的基本定律,由此世界体系就能用单纯的演绎法建立起来。要通向这些定律,并没有逻辑的道路;只有通过那种以对经验的共鸣地理解为依据的直觉,才能得到这些定律。”因此,他明确指出,在科学研究中,“我相信直觉和灵感”^([\[16\]](#txt010.html#footnote_content_txt010_16))。艺术教育能够培养直觉能力,诱发创造灵感,从而促进创造力的发展。除了直觉和灵感外,科技创新离不开想象。因为科技创新活动并不是仅仅依赖于一串串干巴巴的实验数据和逻辑规则,而是需要对未知事物的内外因关系进行洞察。


    列宁曾高度评价想象(幻想)在科学发展中的作用,他说：“幻想是极其可贵的品质。”“有人认为,只有诗人才需要幻想,这是没有理由的,这是愚蠢的偏见!甚至在数学上也是需要幻想的,甚至没有它就不可能发明微积分。^([\[17\]](#txt010.html#footnote_content_txt010_17))”正因为想象在科技创新中的重要作用,郭沫若才语重心长地说：“科学是讲究实际的。科学是老老实实的学问,来不得半点虚假,需要付出艰巨的劳动。同时,科学也需要创造,需要幻想,有幻想才能打破传统的束缚,才能发展科学。科学工作者同志们,请你们不要把幻想让诗人独占了。^([\[18\]](#txt010.html#footnote_content_txt010_18))”培养想象力的重要途径之一就是接受艺术熏陶。艺术教育培养出来的美感、节奏感及和谐感会大大提高人的想象力和创造力。


    如上可见,艺术教育在创新活动和培养创新人才上的重要作用。教育部颁布的《全国学校艺术教育总体规划》明确指出：“艺术教育是学校实施美育的主要内容和途径,也是加强社会主义精神文明建设、潜移默化地提高学生道德水平、陶冶高尚情操、促进智力和身心发展的有力手段。”《中共中央、国务院关于深化教育改革全面推进素质教育的决定》业已明确指出：“要尽快改革学校美育工作薄弱的状况,将美育融入学校工作的全过程。”教育部则更进一步决定：“尽快颁布《学校艺术教育工作条例》,并围绕《条例》制定有关实施细则和配套文件,使学校艺术教育工作步入科学化、规范化、制度化管理轨道,不断提高教育质量。^([\[19\]](#txt010.html#footnote_content_txt010_19))”因此,当前在大力推进素质教育和创新教育的过程中,应下大力气解决这方面存在的问题,以培养出更多具有创新素质和创新能力的人才,提高我国的科技创新能力。


    ## 四、现存局限：束缚人的审美能力和创造能力


    今天所处的时代是智能的时代,数据是智能的基础,创新是智能的灵魂。创新能力的高低不仅受到智力因素的影响,而且也受到非智力因素的影响。考究传统美育,发现其中存在如下几个方面的局限,束缚了人们的审美能力和创造能力。


    ### 第一、家庭美育中的亲职教育


    在国外,家庭教育这一概念已逐渐为亲职教育所取而代之。所谓亲职教育,是一门教导父母如何了解与满足子女身心发展需求,善尽父母职责,以协助子女有效成长、适应与发展的学问。亲职教育被认为是家庭教育的内涵和精髓,也是其内在基础,与传统的家庭教育有很大的不同,如表10-2所示。


    **表10-2 亲职教育与家庭教育的差异**


    ![](images/txt010_3.jpg "pagenumber_ebook=177,pagenumber_book=167")


    (资料来源：施欣欣.亲职教育ABC\[M\].北京：中国纺织出版社,1999：6.)


    从上表可以看出,亲职教育与传统的家庭教育在教育的重点、原理、模式、气氛和方法上都有所不同。亲职教育至少对现代家庭美育提供了以下三点重要启示：


    首先,在家庭美育的主客体关系中,父母是矛盾的主要方面,起着决定的作用,美育成败的关键因素是父母的文化知识和审美修养。所以,家庭美育首先是父母自身的“美育”,其次才是父母对子女的美育。在智能时代的今天,父母应不断更新观念,增长知识,加强美学修养。


    其次,家庭美育中应注重亲情的交融与内心的感动,突出美育的情感性和潜移默化性的特点,注重鼓励和引导,采取辅导的方式,而不是传统家教注重训诲与管理,采取训导的方式。


    最后,身教胜于言教。模仿是儿童的天性。在儿童的成长过程中,儿童的模仿对象首先是父母。父母的一言一行,都是孩子的模仿对象。父母怎样穿衣服,怎样与别人交谈和怎样谈论别人,怎样读书看报……所有这一切,对孩子都具有重要的意义。孩子能发现并感觉到父母语调中的细微变化,父母思想上的所有转变,都会通过无形的途径传达给孩子。作为父母,可以通过言传身教,特别是身教,使孩子更健康的成长。在智能时代,父母要扮演好自己的角色,就要提高价值观的科学性,要有健康的生活方式,要建立健康文明的家庭环境。这对美育及所有教育的成败都是至关重要的。


    ### 第二、学校美育中的艺术教育


    艺术教育是美育的一个重要方面,学校开设的艺术类课程,无论是音乐、美术还是舞蹈等,在学校的美育实施中都占有重要的地位。艺术作品作为人类审美活动的最高形式,可以把生活中人们习以为常的事例加以艺术化、集中化、情感化,在打动人、感染人方面都要远远超越其他审美形象,具有无比强烈的引人入胜的魅力。


    ### 第三、社会美育中人文环境的创造


    与家庭美育和学校美育相比,社会美育是一个更大的舞台。因为人出生以后,经过社会化,由一个自然人变成一个社会人,社会性就成为人的本质属性。在社会美育中,我们不仅要注意自然环境的美化,而且更要注意社会环境的优化,尤其要注意创造良好的人文环境。


    ## 五、超越路径：家庭、学校与社会


    智能时代,应把美育作为一项社会系统工程贯穿于人生的始终,从多途径入手予以加强。通过家庭、学校和社会来加强美育。家庭美育、学校美育和社会美育这三者是相互联系、相互促进的。应充分发挥各教育力量自身的优势,使家庭、学校和社会之间相互补充,协调运作,形成合力,发挥整体功能,以达到良好的美育效果。


    ### 家庭美育：起点与摇篮


    家庭是组成社会的细胞,是人社会化的第一站,是人一生活动的重要场所。家庭也是美育的起点和摇篮。一个人的审美能力的培养,审美观念和审美趣味的形成,与家庭有着密切的关系。因此,家庭美育的重要性是不言而喻的。家庭美育的实施,可利用家庭环境、家庭气氛、日常生活、文学艺术、大自然等。家长要有意识地充分利用这些方面,努力培养孩子的审美能力和审美情趣,使他们健康和谐地成长。


    ### 学校美育：重要基地


    如果说家庭是美育的基础,那么可以说学校就是美育的重要基地。这是因为,和家庭相比,学校具有目的性、计划性、系统性、科学性和集中性等特点。


    学校美育的实施,可利用学科教学进行美育。学校教育的中心环节是不同学科的教学活动。因此,学校美育不能离开以智育为目的的学科教学。学校开设的课程,不仅在表现形式上,如概念的原始语言基础、模型、图形、分子式、方程式、运算过程、思辨过程等,都具有对称、均衡、和谐与多样统一的形式美特点,而且是构成审美教育的深层理性,对提高学生的审美感受能力具有重要作用。艺术教育是美育的一个重要方面。学校开设的艺术类课程,无论是音乐、美术还是舞蹈等,在美育的实施中,都占有重要的地位。


    在当前的教育实践中,由于受“应试教育”、片面追求“升学率”和片面强调专业教育的影响,一些学校减少甚至没有开设艺术类课程。这对培养全面发展的创新人才是极为不利的。爱因斯坦曾严肃地指出：“用专业知识教育人是不够的。通过专业教育,他可以成为一种有用的机器,但是不能成为一个和谐发展的人。要使学生对价值有所理解并且产生热烈的感情,那是最基本的。他必须获得对美和道德上的善有鲜明的辨别力。否则,他——连同他的专业知识——就更像一只受过很好训练的狗,而不像一个和谐发展的人”^([\[20\]](#txt010.html#footnote_content_txt010_20))。


    ### 社会美育：更大的舞台


    与家庭美育和学校美育相比,社会美育是一个更大的舞台。实际上,人在客观上不可能离开社会,也就必然无时无刻不接受社会的审美教育。因此,美育活动也就应贯穿于整个社会生活的一切时空之中。社会美育的实施,可利用大自然、社会设施、人文景观、各种活动等。要特别注意利用文化艺术进行美育。正如梁启超所说：“情感教育的最大利器,就是艺术：音乐美术文学这三件法宝,把‘情感秘密’的钥匙都掌住了。”


    所以,社会美育应很好利用文化艺术来浸润心灵,启迪智慧,增强美德,满足人审美心理的需要。同时,文艺工作者要认识到：“……艺术家的责任很重,为功为罪,间不容发。艺术家认清楚自己的地位,就该知道：最要紧的工夫,是要修养自己的情感,极力往高洁纯挚的方面,向上提,向里体验,自己腔子里那一团优美的情感养足了,再用美妙的技术把他表现出来,这才不辱没了艺术的价值”^([\[21\]](#txt010.html#footnote_content_txt010_21)),这样才能创造出为人民群众所喜闻乐见的艺术精品。


    社会美育,首先要积极利用和谐的人际环境进行教育。和谐是最高层次的美。要提高全社会的道德素质和心理健康水平,努力创造出一种充满关爱的和谐的人际环境,从而使社会成员在情感上被打动,在潜移默化中接受教育,改变内心世界,共同创造美好生活。其次,要利用人文景观进行美育。像大自然一样,建筑、园林、文物、名胜古迹等人文景观也是进行社会美育的好材料。在开发、保护、维修和重建这些景观的同时,应充分发挥其在审美教育中的作用,使人们获得更多的审美教育和审美享受。最后,要利用文化艺术进行美育。文化艺术能在情感上打动人、改变人、完善人,是美育的主要方式。


    总之,家庭美育中要提倡亲职教育,注重亲情的交融与内心的感动;学校美育中要充分利用学科教学并重视艺术类课程;社会美育要贯穿于整个社会生活的一切时空之中,并特别注意利用文化艺术进行美育。文艺工作者要认识到自己的社会责任,为人民群众创造出喜闻乐见的艺术精品。


