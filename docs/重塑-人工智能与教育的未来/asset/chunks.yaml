    promotes educational reform and innovation, gives full play to the advantages
    of AI, and accelerates the development of education that accompanies everyone
    for life, education that is equally accessible to everyone, education that suits
    everyone, and more open and flexible education... promoting human society to usher
    in an intelligent era of human-machine collaboration, cross-border integration,
    and co-creation and sharing. Grasping the global trend of AI development, finding
    the right breakthrough points and main directions, and cultivating a large number
    of high-end AI talents with innovative capabilities and a spirit of cooperation
    is an important mission of education."


    General Secretary Xi Jinping''s congratulatory letter profoundly expounded on
    the disruptive impact of AI technology on the field of education and China''s
    high attention to the deep integration of AI and education. During the conference,
    about 300 international representatives from over 100 countries and more than
    10 international organizations collectively visited several schools in Beijing,
    including Tsinghua University, to gain a detailed understanding of their integration
    of AI and education, ultimately forming a common vision of the international community
    for educational development in the intelligent era—the *Beijing Consensus*. On
    August 28, 2019, UNESCO released the *Beijing Consensus on Artificial Intelligence
    and Education*, which became the first important document globally to provide
    guidance and recommendations on using AI technology to achieve the Education 2030
    Agenda, solemnly declaring to the world: The new era of AI education has arrived!


    The new era of AI education writes a new chapter in human education. AI empowering
    education has triggered a revolutionary upheaval in education: difficult issues
    such as educational quality, equity, discrimination, and ethics have been further
    tackled; "teaching students in accordance with their aptitude" has moved from
    theory to practice, a lifelong education system has been constructed, and the
    boundaries of education have been broken and transcended; the focus of education
    has undergone a major shift, with "exam-oriented education" transforming into
    "quality-oriented education"; education is returning to its essence, human creative
    strategies, comprehensively innovate education, teaching, and learning methods
    through the systemic integration of AI and education, and use AI to accelerate
    the construction of open and flexible education systems, ensuring that all people
    enjoy equitable, suitable, and quality lifelong learning opportunities, thereby
    promoting the realization of sustainable development goals and a community with
    a shared future for mankind." The *Beijing Consensus on Artificial Intelligence
    and Education* has elevated the value of AI for education and the importance of
    the systemic integration of AI and education to an unprecedented height.


    From a technical perspective, AI refers to the general term for technologies through
    which humans, via technical means, endow machines with specific human wisdom and
    capabilities. It is an imitation, enhancement, and extension of human intelligence.
    It possesses value attributes far exceeding human intelligence itself in the field
    of operational skills, and its development has extensive influence and far-reaching
    significance.


    The development of AI, from the opening of the Dartmouth Conference in 1956 to
    the present, has a history of only 63 years. Reviewing the short decades of AI
    development history, it can be considered a tortuous technical history of "three
    rises and two falls," or a technical growth history of "spiral ascent." It represents
    the arrival of a new era—the Intelligent Era—triggering wave after wave of heated
    discussion and nurturing infinite hope for humanity.


    The development trajectory of AI can be roughly summarized into four basic stages:
    "initial theoretical exploration — concept formation — technological maturity
    — scenario application." With the continuous development of emerging technologies
    such as the Internet, Internet of Things, big data, and cloud computing, the technical
    spectrum of AI has gradually matured. Basic intelligent technologies related to
    it, such as expert systems, visual recognition, natural language processing, and
    deep learning, have been perfected. AI technology has gradually taken root in
    numerous application scenarios, and human society is striding towards a new intelligent
    era.


    The rapid development and wide application of AI mark a new peak in humanity''s
    use of science and technology. It has directly brought humanity to a new era height.
    The angle from which people view the world has undergone new changes, and the
    ability to transform the world has been greatly enhanced. From the origin of humanity
    to the present, we have roughly experienced six eras: the Stone Age, Bronze Age,
    Iron Age, Steam Age, Electrical Age, and Information Age. Now, humanity has opened
    a new era mode, opening its arms to welcome the arrival of the Intelligent Era.
    At three key time points since humanity entered the 21st century, three new eras
    that are interconnected yet slightly different have appeared successively: the
    Network Society Era, the Big Data Era, and the Intelligent Machine Era. The three
    together constitute a new social era—the Artificial Intelligence Era^[1].


    Entering the AI era, like all previous technological eras, humanity''s production
    methods, lifestyles, thinking activities, and learning forms will all face new
    opportunities and challenges. "Embracing it" and "keeping it at a distance" are
    destined to be two different story endings. This is a social characteristic existing
    in all new technological eras.


    The greatest impact of AI on society lies in disruption and reconstruction. It
    lets people deeply experience that—everything is becoming intelligent. With the
    aid of intelligent technology, humanity has embarked on an era journey of self-breakthrough
    and transcendence.


    The realistic charm of AI also lies in disruption and reconstruction. It allows
    previously independent industries to penetrate and integrate with each other,
    bringing new changes in industry forms, social division of labor, organizational
    forms, thinking modes, and activity boundaries. Particularly in fields closely
    related to the public, such as healthcare, education, employment, manufacturing,
    transportation, government affairs, and public services, all will enter intelligent
    modes one by one, moving from the original "Internet of Everything" to "Intelligence
    of Everything." Under this trend of the intelligence of everything, the most keen-scented
    business sector is surging, with major enterprises plunging into the intelligent
    industry and laying out intelligent industrialization, causing the scale of the
    AI industry to soar rapidly.


    Globally, according to statistics from the *2018 Global and China AI Industry
    Market Scale Forecast* (as shown in Figure 1-1): In 2015, the global AI market
    scale had already exceeded 168.4 billion RMB; from 2015 to 2018, it maintained
    an average annual growth rate of 17%, rapidly expanding to 270 billion RMB in
    2018. Preliminary estimates suggest that the global AI market scale will reach
    428.5 billion RMB in 2019, with a growth rate of 58.7%; the global AI market scale
    in 2020 will reach 680 billion RMB, with a growth rate of 58.7%. Compared with
    the growth rate before 2018, a leapfrog growth appeared in 2018–2019, with rapid
    development momentum.


    ![Figure 1-1 Global AI Market Scale and Growth Rate 2015–2020](img/txt001_1.jpg)


    Domestically, according to statistics from the *China AI Industry Market Outlook
    and Investment Strategic Planning Analysis Report* released by the Forward-looking
    Industry Research Institute (as shown in Figure 1-2): In 2015, China''s AI market
    scale had exceeded 10 billion RMB; in 2016, its scale reached 14.19 billion RMB,
    a year-on-year increase of 26.3%. As of 2017, China''s AI market scale increased
    to 21.69 billion RMB, a year-on-year increase of 52.8%. In 2018, China''s AI market
    scale reached 33.9 billion RMB, an increase of 56.3% over 2017, far higher than
    the global 17% growth level. It is predicted that in 2019 and 2020, China''s AI
    market scale will reach 50 billion RMB and 71 billion RMB respectively. From 2015
    to 2020, the compound annual growth rate of China''s AI market scale is 44.5%,
    with broad future market prospects and vast AI "new blue oceans" awaiting development.


    ![Figure 1-2 China AI Market Scale and Growth 2015–2020](img/txt001_2.jpg)


    Whether it is the global AI industry or the domestic AI industry, both are currently
    achieving rapid expansion of overall scale against the wind. Overall, this reflects
    that on a global scale, the degree to which AI technology is nested in the social
    structure and the depth of its influence have exceeded people''s original imagination.


    Education is a great undertaking concerning human development and the future of
    the nation, and it is also an industry extremely sensitive to technological development.
    In this intelligent era of rapid technological development, discussing the revolutionary
    impact that AI technology has already brought and may bring to education is of
    profound significance. The future has arrived, but the future is a continuation
    of the present. Today, fully grasping the disruption and reshaping of education
    by AI technology, and proactively recognizing the new models of future intelligent
    education, is of a value that cannot be overstated.


    ## 2. Empowering Education: AI Catalyzes Educational Revolution


    Revolution refers to a major transformation and adjustment of something, a leap
    process from quantitative change to qualitative change triggered by a series of
    catalytic activities. Since ancient times, whenever people discuss revolution,
    it is mostly related to politics. But besides political revolutions, many other
    fields also experience revolutions. For example, technological revolutions, industrial
    revolutions, agricultural revolutions, commercial revolutions, intelligent revolutions,
    learning revolutions, etc. The forms of revolution are rich and diverse. Regardless
    of the situation, the emergence of a revolution is the result of the combined
    action of multiple factors, encompassing four basic elements: economic foundation,
    contradictions and conflicts, technological innovation, and revolutionary leadership
    forces.


    In any field, as long as things are affected by "internal and external" factors,
    changes of varying depths will occur. Some occur in form, while others occur in
    essence. The latter can be further understood as irreversible major transformations
    and adjustments, which we can name as a revolutionary change in that field. As
    the degree to which humanity enters the intelligent era deepens, correspondingly,
    the degree to which people are forced to be involved deepens, and at this time,
    people''s dependence on AI technology becomes stronger, including all aspects
    of people''s "food, clothing, housing, transportation, and use," without exception.
    In other words, the revolutionary impact of AI technology on humanity is multi-faceted,
    covering almost all fields of human life, including the education field shared
    in this book—the revolution of education and the future of education are closely
    related to AI.


    Regarding educational revolutions, history has seen four occurrences. The "Four
    Educational Revolutions" were first proposed by British educator Eric Ashby. He
    believed that the first educational revolution appeared when the duty of education
    shifted from the family to Christian churches or Jewish synagogues; the second
    educational revolution was the adoption of writing as an educational tool by humans;
    the third educational revolution was the invention of printing; the fourth educational
    revolution was the application of microelectronics technology^[4]. Based on the
    four elements of the aforementioned revolutions, a technical interpretation of
    the educational revolutions that have occurred in a society with increasing economic
    development: the first educational revolution benefited from the emergence of
    professional teachers; the second benefited from the emergence of writing; the
    third benefited from the emergence of books; the fourth benefited from the emergence
    of information technology.


    ## 3. Questioning the Meaning: The Purpose of Educational Revolution in the Intelligent
    Era


    ## 4. Educational Revolution: The Purpose, Content, and Structure of This Book


