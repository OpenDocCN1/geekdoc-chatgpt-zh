    [J\\].中国教育信息化,2017(05)：48-50.\n\n[\\[5\\]](#txt008.html#footnote_quote_txt008_5)洛唐科技.洛唐智能图书柜\\\
    [OL\\].https：//www.lotaai.com/books.\n\n[\\[6\\]](#txt008.html#footnote_quote_txt008_6)图片来源：中国产业信息.2018年中国图书馆RFID市场规模约为9.37亿元,《中华人民共和国公共图书馆法》有望成为产业增长重要动力\\\
