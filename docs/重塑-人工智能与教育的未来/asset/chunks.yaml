    # Chapter 11 Educational Revolution: Moving Towards the Future Amidst Change and
    Constancy


    ## References


    [10] Department of Aesthetics, Philosophy Department, Peking University. Selected
    Materials on the History of Chinese Aesthetics: Volume 1[M]. Beijing: Zhonghua
    Book Company, 1980: 54.


    [11] Aristotle. Politics[M]. Beijing: The Commercial Press, 1965: 419.


    [12] Listening to Mozart''s Music Increases IQ by Half[N]. Guangzhou Daily, 2001-01-06(A5):
    5.


    [13] K.W. Walsh. Neuropsychology[M]. Science Press, 1984: 296-297.


    [14] E.W. Eisner. Educating for Tomorrow''s Jobs and Life Skills[OL]. http://www.artsednet.edu.


    [15] Liu Dachun. Complementary Methodology[M]. World Knowledge Press, 1994: 86.


    [16] Albert Einstein. Collected Works of Einstein (Vol. 1)[M]. Beijing: The Commercial
    Press, 1979: 102+284.


    [17] Central Compilation and Translation Bureau, CPC Central Committee. Complete
    Works of Lenin (Vol. 33)[M]. Beijing: People''s Publishing House, 1988: 282.


    [18] Dai Youfu. Appreciation of Famous Scientists'' Speeches[M]. Jinan: Shandong
    People''s Publishing House, 1995: 156.


    [19] Chen Zhili. Study Reference Materials for the Action Plan for Educational
    Revitalization Facing the 21st Century[M]. Beijing: Beijing Normal University
    Press, 1999: 65.


    [20] Albert Einstein. Collected Works of Einstein (Vol. 3)[M]. Beijing: The Commercial
    Press, 1979: 310.


    [21] Liang Qichao. Selected Works of Liang Qichao: Volume 2[M]. Beijing: China
    Radio and Television Press, 1992: 23.


    ## Intelligent Education: Analyzing the Essence Amidst Change and Constancy


    Standing in the present and looking to the future, the era of artificial intelligence
    is inseparable from visions of future education. The combination of artificial
    intelligence and education has given birth to AI education. Education comprises
    two aspects: "teaching" (jiao) and "nurturing" (yu). "Teaching" refers to imparting
    knowledge and skills; "nurturing" refers to cultivating people, fostering virtue
    and character. Throughout history, educational development has never been like
    today, able to simultaneously balance both dimensions of "teaching" and "nurturing,"
    and simultaneously address the needs of both teachers and students. It is evident
    that education in the AI era has ushered in a true return of education—a return
    to the most essential care for human beings: human value, dignity, and all-round
    development.


    Future education will inevitably move towards an era of deep integration with
    intelligent technology, where intelligent teachers and human teachers coexist.
    Intelligent teachers will focus on knowledge and skills education, helping learners
    profoundly grasp operational knowledge, and assisting in cultivating learners''
    wisdom-oriented knowledge and skills. Human teachers, on the other hand, will
    have core tasks significantly different from the present. Human teachers will
    shift from the original knowledge and skills education to emotional and moral
    education, focusing on cultivating learners'' qualities of "fostering virtue and
    character, learning to become a complete person, and being born as a human," truly
    practicing the human teacher''s value of cultivating people.


    In the first 20 years of the 21st century, the integration of AI and education
    was still in its initial stage. The application of AI technology in education
    was mainly concentrated in the teaching assistant phase, manifested as professional
    human teachers utilizing AI teacher systems to assist in completing teaching management,
    formulating teaching plans, improving teaching processes, optimizing teaching
    assessment, and standardizing teaching evaluation across a wide range of fields.
    However, the overall intelligent education theory, methodology, and practice still
    await theoretical generalization. The subdivided and micro fields of education
    still require deep integration with intelligent technology. Therefore, future
    education must follow a development model of advancing through pioneering. The
    overall practical path moves from the macro to the meso and micro domains, while
    the theoretical extension direction gives birth to a systematic and open educational
    theory system from concrete practice.


    In future education, human-machine coexistence will become a universal fact. Intelligent
    robots will begin to appear in the role of existing teachers, and the role of
    human teachers will also undergo tremendous changes. Instead, human teachers will
    be liberated from knowledge and skills education, devoting more time to students''
    moral and emotional education, so that students possess both virtue and talent,
    integrating scientific spirit and humanistic spirit.


    In future education, during the educational process, AI education systems will
    be able to conduct intelligent and personalized teaching based on data such as
    students'' learning progress, intensity, efficiency, weak points, concentration
    level, attention span, and learning interest. Education''s attitude towards people
    will thoroughly shift from objects requiring compulsory transformation to objects
    requiring transformation based on the needs of the learners and society.


    Thus, the development direction of AI education discussed above is also the direction
    AI education needs to change, and the area where the transformation brought by
    AI to education is most prominent. However, these changing phenomena ultimately
    only reflect the changes brought to education itself by AI empowering education.
    The unchanging things hidden behind the changes still need to be excavated, such
    as the purpose of education.


    In November 2018, Yu Minhong, founder of New Oriental, emphasized in an exclusive
    interview with The Paper in Wuzhen, Zhejiang: "Any technological change is merely
    a change in tool utilization and cannot change the essence of education. No technological
    improvement can be compared with the essence of cultivating a person." "From an
    educational perspective, the core elements of education are to cultivate a fully
    developed person, a physically and mentally healthy person, a person full of curiosity
    and spirit of exploration in the pursuit of knowledge. These are impossible to
    change. ^(1)" Similarly, from Yu Minhong''s remarks, it can be seen that AI empowering
    education always appears in the form of a tool. The education of humans by tools,
    due to the human-centric attribute of tools, means that the most fundamental connection
    mode in educational activities—the person-to-person education model—has not changed,
    and the purpose of education itself to cultivate people has not changed. In other
    words, the essence of education has not changed.


    In the AI era, the intelligentialization of education and intelligent education,
    the forms of education are constantly changing, the tools of education are constantly
    changing, the models of education are also constantly changing, and their trends
    of change will innovate with the updates and iterations of intelligent technology.
    However, amidst the changes in education, what remains constant is the purpose
    of cultivating fully developed people. No matter how advanced intelligent technology
    becomes, education must cultivate fully developed people, people with both virtue
    and talent, people with innovative thinking, innovative ability, imagination,
    and compassion.


    The unchanging essence contains value within. Future education will fully demonstrate
    its economic, political, and cultural values. Particularly, its value is more
    prominent in inheriting culture, creating knowledge, and cultivating intelligent
    talents, and it holds significant significance for improving people''s overall
    quality of life and quality of life.


    ## Lifelong Education: From the Rise of Concept to Practical Implementation


    In the mid-19th century, capitalist countries led by the United States set off
    a wave of the Second Industrial Revolution globally. The electrified mode of production
    greatly increased the level of social productivity, ushering humanity into the
    "Electrical Age." Under the influence of the Second Industrial Revolution, rapidly
    rotating electrical machines endlessly shaped the entire human world. The production
    methods, lifestyles, and thinking habits of human society were all being changed
    without limit. It was the technological power during the Industrial Revolution
    that, with its astonishing energy, rapidly subverted traditional society. The
    political destiny, economic forms, and social structures of society were no exception,
    and the world gradually changed from a dispersed world into an integrated world.


    Everything is in infinite change. Due to the accelerated changes in society, people
    began to think about how to cope with this change, how to survive better within
    it, and how to better demonstrate individual value and dignity. It was against
    this broad social background that lifelong education was born.


    Lifelong education was first formally proposed in 1965 by Paul Lengrand, the French
    Director of the UNESCO Institute for Adult Education. Paul Lengrand pointed out
    that lifelong education is not a specific practice, nor a specific educational
    stage, but generally refers to an educational thought. Lifelong education refers
    to the sum of all education received in a person''s life, covering various types
    of education and education received at all age stages. Since its proposal, lifelong
    education has become an important ideological basis for countries worldwide to
    formulate educational guidelines and policies, and is highly valued by all nations.


    From its background of birth, lifelong education aims to help people remain in
    a "sober state" at all times, requiring people in an era of accelerated change
    to clearly recognize the importance of lifelong education and lifelong learning,
    because it is directly closely related to people''s survival and development.
    In other words, the concept of lifelong education is a crucible of thought guiding
    people to adapt to a changing society; as long as one follows its principles,
    one will survive better than those who completely disregard it.


    However, technological limitations and spatiotemporal limitations of education
    restricted the practical implementation of lifelong education. In the industrial
    age and information age, this educational thought was destined to be piloted only
    on a small scale and could not be promoted globally. The main reason is that in
    that era, individual development rarely took the development of others as a prerequisite.
    There existed inevitable spatiotemporal boundaries between each relatively independent
    individual, limiting the implementation of the idea of lifelong education. Especially
    when people wanted to find the laws of lifelong education from general educational
    practices and apply lifelong education to specific individuals, primitive data
    barriers, information gaps, and the isolated state of stage-based educational
    departments blocked the shaping of the "lifelong" nature of lifelong education.
    For example, for contemporary university students, constructing their lifelong
    education system is feasible for their future, but integrating their preschool,
    primary, and secondary education would likely only yield fragmented stage-based
    learning outcomes. As for process data of learning, the learners themselves have
    probably forgotten it "completely." Because for this generation of university
    students currently in school, their past has become "fragmented memories" with
    only results and no process. One can imagine, how can such a state advance the
    realization of the lifelong education concept?


    However, in the era of big data and artificial intelligence, this educational
    status quo is changing. The concept of lifelong education has ushered in a golden
    period of development—from the rise of the concept to practical implementation.
    Supported by big data and AI technology, all educational influences exerted by
    educators on learners, as well as the process data of learners'' active learning,
    will be stored in the form of educational big data. Through top-level design of
    national lifelong education, big data of various education types achieve cross-border
    sharing and centralized correlation, thereby forming educational big data clusters
    concerning individuals and groups. When educational big data is integrated, a
    lifelong education system based on AI technology is being generated. The personal
    educational and learning activities of learners are fully mapped onto the lifelong
    education platform, and the educational laws for individuals and for the whole
    population are "unveiled."


    Education in the AI era, as Bill Gates pointed out in *The Road Ahead*, "The ultimate
    goal of education will change, not for a diploma, but for lifelong education.
    ^(2)" Throughout a person''s life, everything they engage in is related to their
    education, and all their educational activities will in turn react upon the learner''s
    present survival and development. Lifelong education platforms, lifelong learning
    platforms, intelligent open universities, and lifelong education public service
    systems are gradually being built, promoting the practical implementation of lifelong
    education. Future education will more directly serve human survival and development,
    realizing human value, dignity, and all-round development.


    ### Promoting Lifelong Learning Policies


    On August 2, 2019, the UNESCO "International Consultation Meeting on Lifelong
    Learning Policies" was successfully held in Chengdu (as shown in Figure 11-1)
    ^(3). The meeting mainly conducted pre-publication consultation, argumentation,
    and review for two publications: the *Joint Report on the Guidelines and Key Policy
    Interpretations of Lifelong Learning* and the *Lifelong Learning Handbook: Policies
    and Practices*. The *Joint Report on the Guidelines and Key Policy Interpretations
    of Lifelong Learning* aims to explore the policy implications of "lifelong learning"
    through a series of case studies and comparative analysis of lifelong learning
    policies, analyzing the knowledge, evidence, and core principles that policymakers
    and other stakeholders should possess based on national experience, human rights,
    and development frameworks, so as to formulate and implement relevant lifelong
    learning policies. The *Lifelong Learning Handbook: Policies and Practices* elaborates
    on the concept of lifelong learning and discusses how to promote lifelong learning
    through practical methods at the national, local, and institutional levels. Lifelong
    learning is a core component of lifelong education; the promotion of lifelong
    learning policies will inevitably directly or indirectly promote the development
    and improvement of lifelong education.


    ![](img/txt011_1.jpg "pagenumber_ebook=187,pagenumber_book=177")


    Figure 11-1 UNESCO "International Consultation Meeting on Lifelong Learning Policies"


    ### Building Lifelong Education Platforms


    The construction of lifelong education platforms is the platform foundation for
    effectively connecting and integrating learners'' lifelong education data and
    lifelong learning data in the AI era. Therefore, it is necessary to closely focus
    on the living environment of learners and carry out extensive "coverage-application"
    construction of educational platforms, covering all educational stages and types
    of learners from an overall perspective. With the help of big data AI lifelong
    education platforms, a comprehensive educational platform integrating "family-school-society"
    is formed. According to Xinhuanet, as early as 2012, the National Open University
    facing the whole nation had been established. The National Open University has
    been committed to promoting lifelong learning for all. In the open university,
    a learning mode combining online self-study, remote support, and face-to-face
    tutoring provides rich and diverse educational courses for different types of
    people (different ages, occupations, etc.), greatly promoting the implementation
    of lifelong education practice for all.


    ### Constructing a Lifelong Education System


    UNESCO pointed out in the released *Beijing Consensus on Artificial Intelligence
    and Education* that education in the AI era should "comprehensively innovate education,
    teaching, and learning methods through the systemic integration of AI and education,
    use AI to accelerate the construction of an open and flexible education system,
    and ensure that all people enjoy fair, quality lifelong learning opportunities
    suitable for each individual." "It is necessary to adopt key technologies such
    as AI platforms and data-based learning analytics to construct a comprehensive
    lifelong learning system where everyone learns, everywhere learns, and anytime
    learns. ^(4)" The construction of a "comprehensive lifelong learning system" is
    promoting the structural formation of the lifelong education system. In the AI
    era, the boundaries of education are being broken. Learners are no longer fixed
    in designated fields for learning or receiving education, but can learn and construct
    knowledge at any time and place. In the future, with the help of key technologies
    such as deep learning, natural language processing, and machine pattern recognition,
    a lifelong education system featuring "collective intelligence sharing, human-machine
    collaboration, cross-domain association, and integration" will be constructed,
    assisting the practical implementation and innovative development of lifelong
    education.


    Human society has begun to enter a "post-human society." The rise of emerging
    technologies represented by intelligent technology has challenged the original
    anthropocentric worldview, outlook on life, and values. "Being squeezed" has become
    a significant mark shared by humans in this era. Therefore, the development of
    AI education must lead the entire post-human society to break free from the "intelligent
    shackles" of the post-industrial society and embrace the AI lifelong education
    system. Future education does not mean all post-humans will be "squeezed" by AI.
    Only those post-humans who "disdain" lifelong learning and lifelong education
    will inevitably suffer the "bitter fruit" of AI.


    ## Facing the Future: Education Prepares for Students'' Future


    The change in education is in its form; the constancy in education is in its essence.
    Educational forms are rich and colorful, but the essence of education always revolves
    around cultivating people. In any era, the essential attributes of education will
    not change. This is determined by the essential attributes of society and reflected
    in the relative independence of education. The existence of education originates
    not from other fields, but from human productive labor. In this regard, the essence
    of education does not change, and the purposes and tasks determined by its essence
    do not change either. It is worth noting that while the essence of education does
    not change, the content of education will continue to expand, and the purposes
    and tasks of education will also continue to expand—keeping pace with the times.
    The qualitative determinacy of education, supported by diverse technologies, has
    drawn increasing attention to the questions of "what kind of people to cultivate"
    and "how to cultivate people." However, the ones most entitled to answer this
    question should be the learners themselves. They know best "what kind of person
    they want to become," not "what kind of person educators want them to become."


    So to speak, the content of the essence of education has now expanded into the
    domain of learners, containing two layers of meaning: one is the expectation of
    educators, which in a sense represents the development requirements of society,
    pointing out the direction for confused learners; the other is the urgent demand
    of learners, which directly supports learners moving towards the future continuously,
    not stopping at a certain stage. In other words, learners themselves know what
    they want their future selves to be like. Therefore, they start thinking about
    this from now on, because they always believe that following their hearts and
    never stopping thinking will eventually lead them to become who they want to be,
    and life will become what they want it to be. This is probably the so-called "Pygmalion
    Effect."


    Different from this, past education focused on immediate short-term benefits,
    whether for the high school entrance exam to enter a good school, or for the college
    entrance exam to enter a good university. However, once these goals are achieved,
    confusion and bewilderment become the theme of life, and many students spend their
    university years in such a state.


    Learners are an organic whole. As educators, one should not artificially split
    them into fragments and then assemble them; such short-term effects are certainly
    good. However, the cracks formed between fragments on the learners will become
    lifelong marks of deficiency for them. However, future education based on more
    advanced AI technology will inevitably have long avoided the above limitations,
    focusing on future-oriented education, which will become a universal commonality
    of future education. In summary, future education prepares for students'' future.
    This education neither ignores students'' past nor completely disregards the present
    reality, but, supported by past educational big data and learning big data, fully
    endows students with numerous future possibilities.


    Education prepares for students'' future. In the history of human education, many
    educators have mentioned the relationship between education and life: some proposed
    education prepares for religious life, some believed education is life, and some
    believed education prepares for leisure life, etc. However, the most praised view
    is still the educational thought of "preparing for future life." As early as the
    late 19th century, the famous British educational thinker Herbert Spencer proposed
    that the purpose of education is to "prepare for a complete future life." Indeed,
    in an era of material abundance and intellectual freedom, this educational thought
    contains strategic vision—students'' learning is future-oriented learning.


    In Euclid''s *Elements*, a disciple once asked him what benefit he would get from
    learning geometry. This utilitarian thought was quickly criticized by him. Facing
    such a question, Euclid said to his attendant, "Give him three coins, since he
    wants to gain profit from learning. ^(5)" Thus, whether modern or ancient, there
    are astonishing similarities in educational concepts—emphasizing the future value
    of education.


    Preparing for students'' future life is not only an important concept of some
    educators but also the development vision of some educational institutions. The
    Programme for International Student Assessment (PISA Education) is such an example.
    It aims to improve the quality of education and students'' overall capabilities
    from angles such as developing assessment tools, presenting result reports, analyzing
    factors of student performance, and coordinating the development of education
    quality and equity. PISA Education points out that educational development should
    focus on students'' knowledge construction ability, not memory ability. Behind
    memory ability is a whole set of exam-oriented education systems, emphasizing
    rote memorization, causing many students to lose thinking and innovative abilities,
    falling into an infinite loop of indoctrination. Knowledge construction ability,
    on the other hand, is the ability to cultivate students'' capacity to create knowledge.
    In the process of guiding students to create knowledge, PISA Education also includes
    literacy assessment in its evaluation content. The literacy defined by PISA differs
    from the literacy emphasized by other educational forms. The literacy it emphasizes
    is that students, through school education and life education, actively apply
    learned knowledge and skills to real life, so as to enhance their overall life
    ability and quality, thereby adapting to future life full of changes, ensuring
    they possess the ability to interpret and solve problems in different contexts.

