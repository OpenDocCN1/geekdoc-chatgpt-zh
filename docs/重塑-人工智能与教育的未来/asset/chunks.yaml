- raw: '赵晓声认为创客教育在本质上应是信息时代创新教育的新载体、新形态,为优化创新人才培养体系提供了可能的“操作系统”^([\[5\]](#txt009.html#footnote_content_txt009_5))。杨现民等认为创客教育是一种融合信息技术,秉承“开放创新、探究体验”教育理念,以“创造中学”为主要学习方式和培养各类创新型人才为目的的新型教育模式^([\[6\]](#txt009.html#footnote_content_txt009_6))。张茂聪认为创客教育强调人的主体地位和价值,致力于将学生从知识的奴隶变为知识的主人;注重具有知、情、意、行等能力的“全人”的培养,在知识的应用中深化、内化知识,更加注重知识的创造^([\[7\]](#txt009.html#footnote_content_txt009_7))。


    结合人工智能时代背景,再谈创客教育。祝智庭认为人工智能时代的创客教育旨在培养有志于从事人工智能开发与创新的创客,这些创客不仅要有扎实的技术功底和敏锐的技术前瞻性,同时也应具备懂合作、善交流、不轻言放弃的创客精神。人工智能开放平台、智能机器人、物联网等新兴技术手段为创客教育提供开放新颖的体验和创意实践平台^([\[8\]](#txt009.html#footnote_content_txt009_8))。可见,创客教育,本质上是创新教育的载体,通过借助新兴技术完成创新教育工作,其主要目的在于培养人们的创客能力和创客精神。


    人工智能时代,智能化的创客教育深受社会欢迎。2009年11月,美国时任总统奥巴马在“教育走向创新”的活动中,首次倡导美国学生应该成为知识的创新者和社会的创造者,这成为美国政府在全球率先开展“国家创新战略”和进一步落实创客教育的标志^([\[9\]](#txt009.html#footnote_content_txt009_9))。与此相继,美国从国家战略层面提出了《国家创新战略》,进而引发了一大批国际性知名大学与企业布局创客教育,延伸了美国创客教育的全球影响力。创客教育实验室、创客教育空间、创客教育学校、创客教育机构、创客教育孵化基地等应运而生。


    创客教育的诞生,之所以能够得到政府政策的推动和企业与科研机构的积极拉动,主要源于创客教育本身具有巨大的价值潜力。首先,创客教育能够培养人的创新思维。创客教育的核心就是培养人们的创新思维,人们通过运用智能创客技术,以智能创客空间为载体,培养人们的抽象思维、全局思维与发散性思维。


    其次,创客教育能够培养真正的创新人才。从结构上看,创客教育隶属于素质教育,是素质教育的有机组成部分,推进创客教育就是在推进实施素质教育。创客教育的理念、方法、内容与载体等,都是围绕学生的创新素养的培养、创新精神的塑造而展开的,它能够帮助学生减负,较为彻底地转变学生以往死记硬背的学习方法。学生可以通过创新实践与生活经验总结,以较为灵活的方式学到应学的知识,从而有利于学生的全面发展。


    最后,创客教育有助于学生适应智能时代。人工智能时代的创客教育,无论是其教育内容、教育方法,还是教育载体,都将紧密围绕人工智能技术而展开,甚至直接将教授人工智能知识与技能作为创客教育的内容,引领学生超前发展。如今,很多中学已开设人工智能创客教育课程,高等教育学校已存在多种形态的人工智能创客教育空间,各种人工智能教育机构也已开始了人工智能创客教育。编程技术、人脸识别、图像识别、机器人技术等成为创客教育的主要内容,这无疑将会拉近创客教育与智能时代的关系,促进创客教育与社会的紧密联系,促进创客教育与人的未来发展紧密联系。生于智能时代,长于智能时代,创客教育的价值正在朝着促进学生适应复杂多变的智能时代而演变。


    (三)创客教育的具体实践


    创客教育的蓬勃发展最终需要通过创客教育平台得以实现。创客教育平台,是指专门提供给创客进行创新的活动空间,包括网络虚拟创客平台和现实物理创客平台两大类。在智能技术盛行的当下,创客教育平台的具体实践与应用,离不开智能技术的有力支持。所以,在创客教育领域出现两种较为典型的创客模式：一种是基于智能技术的智能创客平台,另一种是基于创客文化的智能创客平台。


    以承德智翔机器人创客中心的平台为例,它是一种专注于人工智能创客教育的专业化平台。应时代发展要求与国家政策引领,承德智翔机器人创客中心的团队融合创客文化与智能技术,开设了专业化的智能创客平台,成为国际人工智能创客教育领域为数不多的拓荒者。承德创客教育平台自建立以来,在相关的教育课程领域取得众多成果。目前,他们已将3D打印、激光雕刻、无人机航模、比例赛车、Scratch少儿编程、双语Scratch编程(全球首家融合国学英语、编程、人工智能、编程英语、艺术创作等元素的复合型课程)、无线电通信、Arduino智能制造、美国VEX机器人等课程纳入智能创客平台的课程体系。特别是其结合人工智能技术、传统乐高教育与创客教育技术自主研发而成的双语创新素质教育课程体系,深受广大服务对象的欢迎和喜爱。目前,该平台已经与承德地区多所学校达成合作协议。由企业的独立发展到走进校园开拓智能创客教育新天地,承德智翔机器人创客平台正逐渐发展成为规范化、制度化与标准化的智能创客平台。


    如今,随着承德创客平台的不断发展成熟,其平台规模也在不断扩大。单就师资力量而言,其教师队伍就在迅速扩大,在此基础上,该智能创客教育平台的课程体系还在不断完善,创新造物亲子课、比例模型、单片机、程序设计、人工智能编程语言Python编程、Arduino开源硬件等高难度课程相继被引入承德智能创客教育,而且该智能创客教育平台的教育效果显著。2017—2019年,仅三年的时间,来自智翔机器人创客中心培训的承德少年就已经在全国青少年创客联赛总决赛、世界机器人大赛等知名赛事上获得冠军和季军的好成绩。


    智能创客教育的专业化平台,主要围绕人工智能课程体系进行创新教育,对于教育对象的智力开发、思维训练与实践能力培养具有重要价值。这种人工智能创客教育平台的核心思维是为未来的智能时代培养创新人才,提升现阶段的“智能原住民”的智能基础素养。未来的国家竞争必定是建立在智能技术基础上的新兴科技的竞争,国家力量的较量本质上是人工智能创新人才的较量。因此,我们应以多种方式迅速推动,促成智能创客教育平台的普及。


    以海尔的创客教育平台为例,它是一种以创客文化为基础的创客教育平台。海尔的创客教育平台众多,包括海尔大学、海尔创客加速平台、海尔·海狸大学生创业众包平台、海尔创客实验室、海尔创客夏令营、创业周末(青年创客版)、青年创客计划、未来新动能等,覆盖范围较广,类型多样。


    海尔的创客教育,源于海尔的“创业与创新”文化。在海尔集团,这种文化旨在通过海尔人自己的学习平台和创客加速平台,培养和成就每位员工成为自己的CEO,并将成就海尔用户作为创客文化的核心文化,让海尔的员工“人人成为创客”。自海尔打造企业“双创文化”、铸造“双创精神”以来,海尔的创客平台已经吸引大量海内外创客资源,并通过公开课、青年计划、夏令营、导师辅导、创客公开课等课程形式,扩大了培养海尔创客人才队伍。


    随着智能时代的深入发展,海尔的创客平台正朝着渠道扩张和平台智能化的方向发展。海尔的创客平台的发展不局限于集团内部的自我成长,还踊跃地迈出集团大门,走向校园和社会。在面向学校的渠道扩张方面,海尔集团创建海尔·海狸大学生创业众包平台,为学生提供O2O模式下的校园社交、学生生活,以及投资机构和商家对接等C2C与B2C服务。并深化融合现代化新兴技术,引入智能在线系统,颠覆校园传统的消费模式。在多年的校园服务与企业业务数据的积累过程中,海尔正好赶上大数据技术成熟的年代,使得海尔的创客教育服务平台得以依托大数据技术,实现平台的“一对多”服务,打通了各个独立的创客平台之间的壁垒。


    海尔创客教育平台的智能化发展,凸显海尔“创业不守业”的创客精神。敢于革故鼎新、勇立创新潮头,需要巨大的勇气和卓越的前瞻思维。海尔创客平台的智能化发展,意味着整个海尔集团的技术风向已发生转变,企业的整个系统都将围绕智能转型升级而展开,所以具有很大的创新风险。但事实证明,他们的创客教育平台的智能化发展,跟对了时代潮流。日前,站在人工智能创客教育的风口上,由“海尔超前创新中心”组织、新智元协办的创客公开课在海尔大学开课,旨在协助海尔的创客深入掌握人工智能与VR、AR、智能应用场景和未来的奇点,以期共同创造海尔的智能新未来。未来,海尔的创客教育还将在其创客文化的引领下,不断走向更加舒适、便携与智能的未来。


    综上可知,无论是承德智翔机器人创客教育平台,还是海尔创客教育平台,都是借助平台化的优势和力量助力创客教育走向具体实践,从而促成教育资源与创客教育对象的有效衔接。两者最终的归宿,都是希冀契合智能时代背景,在新的社会潮流与市场人才需求变动的条件下,高效地培养出适应智能时代的创新创业人才,并以他们的成就作为创客教育平台的骄傲。


    如今的创客教育,主要是以智能技术相关的课程为导向,旨在培养智能创新人才队伍。随着创客教育的发展成熟,其引发的社会关注度也越来越高。以山东省为例,2017年3月,山东省教育厅发布《关于印发山东省学校创客空间建设指导意见的通知》,提出加快推进创客空间建设,倡导省内相关单位要积极构建创新投入机制,有效整合创新资源,大力支持创客空间的建设。截至目前,在国内已有山东、广东、河南、西安、山西等省份出台支持创客空间建设的文件,给创客们带来了意想不到的福利。


    人工智能技术引入创客教育,意味着创客教育的智能新模式、新趋势、新概念的诞生,传统的创客教育模式正在被解构与重构。人工智能时代的创客教育在创客个人、家庭、学校、企业与政府的大力支持下,将进一步迈向新蓝海。整体来说,当下的人工智能创客教育的大多数实践都在关注创客的智能基础教育。着眼于未来,创客教育将在物联网、大数据与人工智能技术的支持下,更加关注人工智能的高端教育领域,不仅触及人工智能的基础知识结构,还将关涉人工智能的情感教育与认知教育。


    四、创业教育：智能时代大众创业的孵化


    作为一个新崛起的技术领域,人工智能技术的发展给世界带来了大礼——智能化,促使整个世界的生产、生活与学习方式出现范式转向。以人工智能技术为思维前提的问题思考方式和问题解决方式和在人们之间形成的关于批判的理论、实践的理论,无不都在围绕着人工智能技术而有序展开。同时,新的挑战也随之出现,由于新兴技术代表的是一个全新的领域,对其理论和应用的研究都需要具备惊人的前瞻思维,才能在其前沿领域找到新的出路。


    这就说明,智能时代,人们所要面对的一切都是新的,意味着人们要以全新的思维应对现实生活,也要以全新的思维开创未来。随着人工智能技术的不断发展,关于人工智能技术的基础理论研究已经进入较为深层的领域。然而,关于人工智能技术与具体应用领域的结合,目前却还处在探索阶段,如人工智能与医疗领域的结合、人工智能与教育领域的结合等。在此背景下,人工智能技术的应用热潮势必会催生关于人工智能应用的创业热潮。


    李克强总理早在2014年9月的夏季达沃斯论坛上,就提出了“大众创业、万众创新”的号召^([\[10\]](#txt009.html#footnote_content_txt009_10)),呼吁广大人民群众积极开展创新创业工作。


    在“大众创业、万众创新”的号召下,国内的各个领域掀起新的创业狂潮,与此密切相关的人工智能创业教育也得到飞速发展。通俗地讲,人工智能创业教育是指“人工智能+创业+教育”,就是将人工智能技术运用于创业教育中,一方面是围绕人工智能教育领域进行创业教育,另一方面是围绕人工智能技术,在众多领域中寻找人工智能创业的新路径。


    教育部高校毕业生创业智库首席专家李肖鸣博士表示：“我国创新技术的教育亟待加强,创新技术理论需要发展和研究,需要借助人工智能一起创建中国的创新教育。创新创业教育需要更多的工具,通过运用人工智能等新技术,营造人人可创新、时时可创新、处处可创新的氛围,首先是老师自己掌握技术,然后让学生掌握创新的技术,最后激发学生的创新潜能,进而使我国创新能力不断提高,成为创新型国家^([\[11\]](#txt009.html#footnote_content_txt009_11))。”要营造智能时代“双创”氛围,自然而然,要在高等院校围绕人工智能教育领域开展创业教育。


    2017年5月,中国科学院大学率先成立人工智能技术学院,随后,众多高等教育学校也纷纷设立人工智能学院。人工智能专业进入大学校园,为未来的智能社会发展培养智能创业人才具有重大作用,无论是在系统的理论知识上,还是在专业化的实操技能上,他们都在人工智能领域的未来创业上具有先天优势。所以,2019年的高考生填报高考志愿时,人工智能专业成为热门专业。


    人工智能教育,是在为人工智能创业教育培养必要的人才队伍,为寻找人工智能创业的新路径做好准备。社会的发展要求是需要走在创业一线的人员积极开展人工智能创新创业活动,带动整个创业领域转变发展方向,攻占智能创业的制高点。


    早在2017年7月,谷歌就在其官网公布了一个名为Developers Launchpad Studio的项目,为期6个月,并向项目支持方投资巨额资金。据谷歌研究总监Peter
    Norviq介绍,该项目的主要目标是要在世界范围内培养人工智能和机器学习的创业公司。


    驻足智能创业教育领域,模范企业正在以“创业教育+产业孵化”的模式进行。正值腾讯的“云+创业计划”的智能创业教育模式开展之际,阿里巴巴旗下的蚂蚁金服共享学习平台也在智能创业教育领域突飞猛进,并成功斩获2019中国人工智能峰会的“紫金产品创新奖”。如今,蚂蚁金服共享学习平台已成为国内智能创业教育的典范。以人工智能技术为基础的创业教育,数据、算法与算力都是需要集中关注的重点。而蚂蚁金服在智能创业企业的数据治理领域,由于有较为强硬的技术支撑、雄厚的资金支持与完善的课程体系为背景,蚂蚁金服的智能创业教育平台深受欢迎。


    蚂蚁金服帮助智能创业企业解决数据难题。数据是智能的基础,数据的隐私保护、数据的标准治理、数据的共享、数据的孤岛等问题是困扰智能创业企业发展的重大难题。对于此,蚂蚁金服给出了自己的专业解决方案,建立了专业的共享学习平台,专门用于帮助不同的创业机构、创业的个人解决数据难题。蚂蚁金服开展企业数据治理教育是在技术优势、政府法规、伦理道德规范等的要求之上,确保数据共享学习平台的数据安全,实现数据的多方协同和授权共享,得到更准确、更高效的数据模型和决策框架,进一步释放智能创业企业的数据价值。


    从上面的讨论可知,高等院校的人工智能学院为社会的发展间接培养智能人才,而蚂蚁金服共享学习平台则是通过教育的方式无形间助力众多智能企业的崛起。可见,无论是何种创业教育形态,都将紧密围绕人工智能技术而进行。总的来说,基于人工智能技术的创业教育要充分运用校园、企业与教育机构三种平台资源,积极开拓国内、国外“两个市场”,有效运用系列人工智能技术不断地向人工智能应用的纵深领域延展,从而实现人工智能创业教育与时代发展深度契合,满足社会发展与人的发展的多样化需求。


    五、协同发力：智能时代创新思维的培育


    创新、创客与创业教育的重点是培养学生的创造性思维能力,这就需要我们把握创造性思维的特征,推进“三创教育”的实施。


    创造性思维是指重新组织已有的知识、经验,提出新的方案或程序,并创造出新的思维方式的过程。它是在一般思维的基础上发展起来的,是人类思维能力高度发展的表现。作为人类思维中的高层次思维,它具有以下主要特征。


    首先,打破常规,异于传统。创造性思维常常以非逻辑、非常规的形式表现出来,即不同于传统的经验和方法,它能对已有的理论提出怀疑,并能大胆设想新的理论和新的方法。这是创造性思维与传统思维相区别的显著特点。正如著名作家王尔德所说：“第一个用花比美人的是天才,第二个是庸才,第三个就是蠢才了。”著名数学家高斯在读小学时,解答“1至100之和是多少”这个问题时,没有用传统的“1+2+3+……”的方法计算,而是用一个独特的方法101×50=5
    050,这种算法突破了常规,别出心裁,体现的就是创造性思维。


    然后,积极主动,敢于进取。创造性思维的主动性和进取性表现出创造者的心理处于主动进取之中,发挥了本人最大的主观能动性。凭着这种积极的心态,创造者能克服种种困难和险阻,去夺取新的胜利。英国医生琴纳历经30年反复试验,终于获得将牛痘接种到动物身上使其获得免疫能力的成果。之后,他又冒着极大的风险,在自己孩子身上做人身接种试验,最终确证牛痘可以预防天花。可见,积极主动、敢于进取是创造性思维的显著特征之一,也是确保取得创造成果的重要条件之一。


    其次,与众不同,大胆独特。创造性思维往往具有新奇、独特的特点,因而往往也是首创的,甚至是孤立的。魏格纳提出大陆漂移假说时,全世界一片哗然,怀疑、讽刺、斥责使他处于孤立无援的困境。直到魏格纳逝世几十年后,大陆漂移说才逐渐被人们接受。一个学生,当他掌握了创造性思维时,不仅能将新知识、新概念同化到已有的概念和知识系统中去,而且能够利用新知识、新概念改造旧概念,因而他在解决问题时,不死套公式,能融会贯通,举一反三,灵活而简便地解决问题。


    再次,立体思维,明察秋毫。传统思维往往是从单个方向去思考,一遇到困难常常会堵塞思路,使问题得不到解决。而创造性思维属于多向思维,它从不同的方向、不同的角度、不同层次或者说是由点到面、由面到点、点面并存、多路共补,形成立体思维。由于它的思维多向性,解决问题就显得与众不同,能想出别人想不到的方法。解题时,有的学生仅使用一种方法,有的则用了多种方法,甚至用了教科书上没有介绍过的方法,因而后者考虑问题的角度比前者要大得多,创造性思维的成分也就大。这些学生的收效不仅是学到了知识,更重要的是学会了思维方法,因而得到了更大的锻炼和提高。


    最后,灵机一动,突然闪现。创造性思维常常以突然降临的形式在人脑中闪现出来。当然,这种突发性并不是“从天上掉下来”的,而是平时大脑高度集中的紧张思考和经验积累的结果。众所周知的牛顿提出万有引力定律,凯库列提出苯的环形结构等,都是很好的例子。


    创造性思维不是人人天生就有的。在过去的应试教育条件下,过分强调分数和知识教育,忽视了素质和三创教育,使学生的创新能力没有得到很好的开发。因此,在智能新时代,我们在根据创造性思维的特点,推进三创教育,培养三创人才时,尤其要注意以下几点。


    第一,树立创新意识。首先,要有创新的愿望和期待。有想要创新的想法,人们才会主动关注创新思维的形成过程与形成结果。其次,要树立创新意识。树立创新意识,是培养创造能力的思想基础。再次,掌握树立创新意识的方法。创新意识与创新性思维之间存在内在的联系,两者之间没有绝对对立的走向,更多的是相辅相成、相互促进的关系。所以,掌握树立创新意识的方法势必有助于人们形成创新性思维。最后,将创新意识融入素质教育。在推进素质教育中,一定要使学生树立创新意识,尤其使他们具有好奇心、求知欲和怀疑感,以及保持思维的独立性和创造性。


    第二,克服消极的思维方式。培养学生的创新思维,就要注意改正、克服一些妨碍创新的消极的思维和想法,尤其要注意克服思想懒惰、一知半解、僵死单一、光说不做、“我不行”“随大流”等问题。'
  fmt: '

    ### 创客教育的内涵与价值


    赵晓声认为创客教育在本质上应是信息时代创新教育的新载体、新形态,为优化创新人才培养体系提供了可能的“操作系统”^([\[5\]](#txt009.html#footnote_content_txt009_5))。杨现民等认为创客教育是一种融合信息技术,秉承“开放创新、探究体验”教育理念,以“创造中学”为主要学习方式和培养各类创新型人才为目的的新型教育模式^([\[6\]](#txt009.html#footnote_content_txt009_6))。张茂聪认为创客教育强调人的主体地位和价值,致力于将学生从知识的奴隶变为知识的主人;注重具有知、情、意、行等能力的“全人”的培养,在知识的应用中深化、内化知识,更加注重知识的创造^([\[7\]](#txt009.html#footnote_content_txt009_7))。


    结合人工智能时代背景,再谈创客教育。祝智庭认为人工智能时代的创客教育旨在培养有志于从事人工智能开发与创新的创客,这些创客不仅要有扎实的技术功底和敏锐的技术前瞻性,同时也应具备懂合作、善交流、不轻言放弃的创客精神。人工智能开放平台、智能机器人、物联网等新兴技术手段为创客教育提供开放新颖的体验和创意实践平台^([\[8\]](#txt009.html#footnote_content_txt009_8))。可见,创客教育,本质上是创新教育的载体,通过借助新兴技术完成创新教育工作,其主要目的在于培养人们的创客能力和创客精神。


    人工智能时代,智能化的创客教育深受社会欢迎。2009年11月,美国时任总统奥巴马在“教育走向创新”的活动中,首次倡导美国学生应该成为知识的创新者和社会的创造者,这成为美国政府在全球率先开展“国家创新战略”和进一步落实创客教育的标志^([\[9\]](#txt009.html#footnote_content_txt009_9))。与此相继,美国从国家战略层面提出了《国家创新战略》,进而引发了一大批国际性知名大学与企业布局创客教育,延伸了美国创客教育的全球影响力。创客教育实验室、创客教育空间、创客教育学校、创客教育机构、创客教育孵化基地等应运而生。


    创客教育的诞生,之所以能够得到政府政策的推动和企业与科研机构的积极拉动,主要源于创客教育本身具有巨大的价值潜力。首先,创客教育能够培养人的创新思维。创客教育的核心就是培养人们的创新思维,人们通过运用智能创客技术,以智能创客空间为载体,培养人们的抽象思维、全局思维与发散性思维。


    其次,创客教育能够培养真正的创新人才。从结构上看,创客教育隶属于素质教育,是素质教育的有机组成部分,推进创客教育就是在推进实施素质教育。创客教育的理念、方法、内容与载体等,都是围绕学生的创新素养的培养、创新精神的塑造而展开的,它能够帮助学生减负,较为彻底地转变学生以往死记硬背的学习方法。学生可以通过创新实践与生活经验总结,以较为灵活的方式学到应学的知识,从而有利于学生的全面发展。


    最后,创客教育有助于学生适应智能时代。人工智能时代的创客教育,无论是其教育内容、教育方法,还是教育载体,都将紧密围绕人工智能技术而展开,甚至直接将教授人工智能知识与技能作为创客教育的内容,引领学生超前发展。如今,很多中学已开设人工智能创客教育课程,高等教育学校已存在多种形态的人工智能创客教育空间,各种人工智能教育机构也已开始了人工智能创客教育。编程技术、人脸识别、图像识别、机器人技术等成为创客教育的主要内容,这无疑将会拉近创客教育与智能时代的关系,促进创客教育与社会的紧密联系,促进创客教育与人的未来发展紧密联系。生于智能时代,长于智能时代,创客教育的价值正在朝着促进学生适应复杂多变的智能时代而演变。


    ### 创客教育的具体实践


    创客教育的蓬勃发展最终需要通过创客教育平台得以实现。创客教育平台,是指专门提供给创客进行创新的活动空间,包括网络虚拟创客平台和现实物理创客平台两大类。在智能技术盛行的当下,创客教育平台的具体实践与应用,离不开智能技术的有力支持。所以,在创客教育领域出现两种较为典型的创客模式：一种是基于智能技术的智能创客平台,另一种是基于创客文化的智能创客平台。


    #### 承德智翔机器人创客中心案例


    以承德智翔机器人创客中心的平台为例,它是一种专注于人工智能创客教育的专业化平台。应时代发展要求与国家政策引领,承德智翔机器人创客中心的团队融合创客文化与智能技术,开设了专业化的智能创客平台,成为国际人工智能创客教育领域为数不多的拓荒者。承德创客教育平台自建立以来,在相关的教育课程领域取得众多成果。目前,他们已将3D打印、激光雕刻、无人机航模、比例赛车、Scratch少儿编程、双语Scratch编程(全球首家融合国学英语、编程、人工智能、编程英语、艺术创作等元素的复合型课程)、无线电通信、Arduino智能制造、美国VEX机器人等课程纳入智能创客平台的课程体系。特别是其结合人工智能技术、传统乐高教育与创客教育技术自主研发而成的双语创新素质教育课程体系,深受广大服务对象的欢迎和喜爱。目前,该平台已经与承德地区多所学校达成合作协议。由企业的独立发展到走进校园开拓智能创客教育新天地,承德智翔机器人创客平台正逐渐发展成为规范化、制度化与标准化的智能创客平台。


    如今,随着承德创客平台的不断发展成熟,其平台规模也在不断扩大。单就师资力量而言,其教师队伍就在迅速扩大,在此基础上,该智能创客教育平台的课程体系还在不断完善,创新造物亲子课、比例模型、单片机、程序设计、人工智能编程语言Python编程、Arduino开源硬件等高难度课程相继被引入承德智能创客教育,而且该智能创客教育平台的教育效果显著。2017—2019年,仅三年的时间,来自智翔机器人创客中心培训的承德少年就已经在全国青少年创客联赛总决赛、世界机器人大赛等知名赛事上获得冠军和季军的好成绩。


    智能创客教育的专业化平台,主要围绕人工智能课程体系进行创新教育,对于教育对象的智力开发、思维训练与实践能力培养具有重要价值。这种人工智能创客教育平台的核心思维是为未来的智能时代培养创新人才,提升现阶段的“智能原住民”的智能基础素养。未来的国家竞争必定是建立在智能技术基础上的新兴科技的竞争,国家力量的较量本质上是人工智能创新人才的较量。因此,我们应以多种方式迅速推动,促成智能创客教育平台的普及。


    #### 海尔创客教育平台案例


    以海尔的创客教育平台为例,它是一种以创客文化为基础的创客教育平台。海尔的创客教育平台众多,包括海尔大学、海尔创客加速平台、海尔·海狸大学生创业众包平台、海尔创客实验室、海尔创客夏令营、创业周末(青年创客版)、青年创客计划、未来新动能等,覆盖范围较广,类型多样。


    海尔的创客教育,源于海尔的“创业与创新”文化。在海尔集团,这种文化旨在通过海尔人自己的学习平台和创客加速平台,培养和成就每位员工成为自己的CEO,并将成就海尔用户作为创客文化的核心文化,让海尔的员工“人人成为创客”。自海尔打造企业“双创文化”、铸造“双创精神”以来,海尔的创客平台已经吸引大量海内外创客资源,并通过公开课、青年计划、夏令营、导师辅导、创客公开课等课程形式,扩大了培养海尔创客人才队伍。


    随着智能时代的深入发展,海尔的创客平台正朝着渠道扩张和平台智能化的方向发展。海尔的创客平台的发展不局限于集团内部的自我成长,还踊跃地迈出集团大门,走向校园和社会。在面向学校的渠道扩张方面,海尔集团创建海尔·海狸大学生创业众包平台,为学生提供O2O模式下的校园社交、学生生活,以及投资机构和商家对接等C2C与B2C服务。并深化融合现代化新兴技术,引入智能在线系统,颠覆校园传统的消费模式。在多年的校园服务与企业业务数据的积累过程中,海尔正好赶上大数据技术成熟的年代,使得海尔的创客教育服务平台得以依托大数据技术,实现平台的“一对多”服务,打通了各个独立的创客平台之间的壁垒。


    海尔创客教育平台的智能化发展,凸显海尔“创业不守业”的创客精神。敢于革故鼎新、勇立创新潮头,需要巨大的勇气和卓越的前瞻思维。海尔创客平台的智能化发展,意味着整个海尔集团的技术风向已发生转变,企业的整个系统都将围绕智能转型升级而展开,所以具有很大的创新风险。但事实证明,他们的创客教育平台的智能化发展,跟对了时代潮流。日前,站在人工智能创客教育的风口上,由“海尔超前创新中心”组织、新智元协办的创客公开课在海尔大学开课,旨在协助海尔的创客深入掌握人工智能与VR、AR、智能应用场景和未来的奇点,以期共同创造海尔的智能新未来。未来,海尔的创客教育还将在其创客文化的引领下,不断走向更加舒适、便携与智能的未来。


    #### 创客教育实践总结与政策支持


    综上可知,无论是承德智翔机器人创客教育平台,还是海尔创客教育平台,都是借助平台化的优势和力量助力创客教育走向具体实践,从而促成教育资源与创客教育对象的有效衔接。两者最终的归宿,都是希冀契合智能时代背景,在新的社会潮流与市场人才需求变动的条件下,高效地培养出适应智能时代的创新创业人才,并以他们的成就作为创客教育平台的骄傲。


    如今的创客教育,主要是以智能技术相关的课程为导向,旨在培养智能创新人才队伍。随着创客教育的发展成熟,其引发的社会关注度也越来越高。以山东省为例,2017年3月,山东省教育厅发布《关于印发山东省学校创客空间建设指导意见的通知》,提出加快推进创客空间建设,倡导省内相关单位要积极构建创新投入机制,有效整合创新资源,大力支持创客空间的建设。截至目前,在国内已有山东、广东、河南、西安、山西等省份出台支持创客空间建设的文件,给创客们带来了意想不到的福利。


    人工智能技术引入创客教育,意味着创客教育的智能新模式、新趋势、新概念的诞生,传统的创客教育模式正在被解构与重构。人工智能时代的创客教育在创客个人、家庭、学校、企业与政府的大力支持下,将进一步迈向新蓝海。整体来说,当下的人工智能创客教育的大多数实践都在关注创客的智能基础教育。着眼于未来,创客教育将在物联网、大数据与人工智能技术的支持下,更加关注人工智能的高端教育领域,不仅触及人工智能的基础知识结构,还将关涉人工智能的情感教育与认知教育。


    ## 创业教育：智能时代大众创业的孵化


    作为一个新崛起的技术领域,人工智能技术的发展给世界带来了大礼——智能化,促使整个世界的生产、生活与学习方式出现范式转向。以人工智能技术为思维前提的问题思考方式和问题解决方式和在人们之间形成的关于批判的理论、实践的理论,无不都在围绕着人工智能技术而有序展开。同时,新的挑战也随之出现,由于新兴技术代表的是一个全新的领域,对其理论和应用的研究都需要具备惊人的前瞻思维,才能在其前沿领域找到新的出路。


    这就说明,智能时代,人们所要面对的一切都是新的,意味着人们要以全新的思维应对现实生活,也要以全新的思维开创未来。随着人工智能技术的不断发展,关于人工智能技术的基础理论研究已经进入较为深层的领域。然而,关于人工智能技术与具体应用领域的结合,目前却还处在探索阶段,如人工智能与医疗领域的结合、人工智能与教育领域的结合等。在此背景下,人工智能技术的应用热潮势必会催生关于人工智能应用的创业热潮。


    李克强总理早在2014年9月的夏季达沃斯论坛上,就提出了“大众创业、万众创新”的号召^([\[10\]](#txt009.html#footnote_content_txt009_10)),呼吁广大人民群众积极开展创新创业工作。


    在“大众创业、万众创新”的号召下,国内的各个领域掀起新的创业狂潮,与此密切相关的人工智能创业教育也得到飞速发展。通俗地讲,人工智能创业教育是指“人工智能+创业+教育”,就是将人工智能技术运用于创业教育中,一方面是围绕人工智能教育领域进行创业教育,另一方面是围绕人工智能技术,在众多领域中寻找人工智能创业的新路径。


    教育部高校毕业生创业智库首席专家李肖鸣博士表示：“我国创新技术的教育亟待加强,创新技术理论需要发展和研究,需要借助人工智能一起创建中国的创新教育。创新创业教育需要更多的工具,通过运用人工智能等新技术,营造人人可创新、时时可创新、处处可创新的氛围,首先是老师自己掌握技术,然后让学生掌握创新的技术,最后激发学生的创新潜能,进而使我国创新能力不断提高,成为创新型国家^([\[11\]](#txt009.html#footnote_content_txt009_11))。”要营造智能时代“双创”氛围,自然而然,要在高等院校围绕人工智能教育领域开展创业教育。


    2017年5月,中国科学院大学率先成立人工智能技术学院,随后,众多高等教育学校也纷纷设立人工智能学院。人工智能专业进入大学校园,为未来的智能社会发展培养智能创业人才具有重大作用,无论是在系统的理论知识上,还是在专业化的实操技能上,他们都在人工智能领域的未来创业上具有先天优势。所以,2019年的高考生填报高考志愿时,人工智能专业成为热门专业。


    人工智能教育,是在为人工智能创业教育培养必要的人才队伍,为寻找人工智能创业的新路径做好准备。社会的发展要求是需要走在创业一线的人员积极开展人工智能创新创业活动,带动整个创业领域转变发展方向,攻占智能创业的制高点。


    早在2017年7月,谷歌就在其官网公布了一个名为Developers Launchpad Studio的项目,为期6个月,并向项目支持方投资巨额资金。据谷歌研究总监Peter
    Norviq介绍,该项目的主要目标是要在世界范围内培养人工智能和机器学习的创业公司。


    驻足智能创业教育领域,模范企业正在以“创业教育+产业孵化”的模式进行。正值腾讯的“云+创业计划”的智能创业教育模式开展之际,阿里巴巴旗下的蚂蚁金服共享学习平台也在智能创业教育领域突飞猛进,并成功斩获2019中国人工智能峰会的“紫金产品创新奖”。如今,蚂蚁金服共享学习平台已成为国内智能创业教育的典范。以人工智能技术为基础的创业教育,数据、算法与算力都是需要集中关注的重点。而蚂蚁金服在智能创业企业的数据治理领域,由于有较为强硬的技术支撑、雄厚的资金支持与完善的课程体系为背景,蚂蚁金服的智能创业教育平台深受欢迎。


    #### 蚂蚁金服共享学习平台案例


    蚂蚁金服帮助智能创业企业解决数据难题。数据是智能的基础,数据的隐私保护、数据的标准治理、数据的共享、数据的孤岛等问题是困扰智能创业企业发展的重大难题。对于此,蚂蚁金服给出了自己的专业解决方案,建立了专业的共享学习平台,专门用于帮助不同的创业机构、创业的个人解决数据难题。蚂蚁金服开展企业数据治理教育是在技术优势、政府法规、伦理道德规范等的要求之上,确保数据共享学习平台的数据安全,实现数据的多方协同和授权共享,得到更准确、更高效的数据模型和决策框架,进而释放智能创业企业的数据价值。


    从上面的讨论可知,高等院校的人工智能学院为社会的发展间接培养智能人才,而蚂蚁金服共享学习平台则是通过教育的方式无形间助力众多智能企业的崛起。可见,无论是何种创业教育形态,都将紧密围绕人工智能技术而进行。总的来说,基于人工智能技术的创业教育要充分运用校园、企业与教育机构三种平台资源,积极开拓国内、国外“两个市场”,有效运用系列人工智能技术不断地向人工智能应用的纵深领域延展,从而实现人工智能创业教育与时代发展深度契合,满足社会发展与人的发展的多样化需求。


    ## 协同发力：智能时代创新思维的培育


    创新、创客与创业教育的重点是培养学生的创造性思维能力,这就需要我们把握创造性思维的特征,推进“三创教育”的实施。


    创造性思维是指重新组织已有的知识、经验,提出新的方案或程序,并创造出新的思维方式的过程。它是在一般思维的基础上发展起来的,是人类思维能力高度发展的表现。作为人类思维中的高层次思维,它具有以下主要特征。


    ### 创造性思维的特征


    #### 打破常规，异于传统


    首先,打破常规,异于传统。创造性思维常常以非逻辑、非常规的形式表现出来,即不同于传统的经验和方法,它能对已有的理论提出怀疑,并能大胆设想新的理论和新的方法。这是创造性思维与传统思维相区别的显著特点。正如著名作家王尔德所说：“第一个用花比美人的是天才,第二个是庸才,第三个就是蠢才了。”著名数学家高斯在读小学时,解答“1至100之和是多少”这个问题时,没有用传统的“1+2+3+……”的方法计算,而是用一个独特的方法101×50=5
    050,这种算法突破了常规,别出心裁,体现的就是创造性思维。


    #### 积极主动，敢于进取


    然后,积极主动,敢于进取。创造性思维的主动性和进取性表现出创造者的心理处于主动进取之中,发挥了本人最大的主观能动性。凭着这种积极的心态,创造者能克服种种困难和险阻,去夺取新的胜利。英国医生琴纳历经30年反复试验,终于获得将牛痘接种到动物身上使其获得免疫能力的成果。之后,他又冒着极大的风险,在自己孩子身上做人身接种试验,最终确证牛痘可以预防天花。可见,积极主动、敢于进取是创造性思维的显著特征之一,也是确保取得创造成果的重要条件之一。


    #### 与众不同，大胆独特


    其次,与众不同,大胆独特。创造性思维往往具有新奇、独特的特点,因而往往也是首创的,甚至是孤立的。魏格纳提出大陆漂移假说时,全世界一片哗然,怀疑、讽刺、斥责使他处于孤立无援的困境。直到魏格纳逝世几十年后,大陆漂移说才逐渐被人们接受。一个学生,当他掌握了创造性思维时,不仅能将新知识、新概念同化到已有的概念和知识系统中去,而且能够利用新知识、新概念改造旧概念,因而他在解决问题时,不死套公式,能融会贯通,举一反三,灵活而简便地解决问题。


    #### 立体思维，明察秋毫


    再次,立体思维,明察秋毫。传统思维往往是从单个方向去思考,一遇到困难常常会堵塞思路,使问题得不到解决。而创造性思维属于多向思维,它从不同的方向、不同的角度、不同层次或者说是由点到面、由面到点、点面并存、多路共补,形成立体思维。由于它的思维多向性,解决问题就显得与众不同,能想出别人想不到的方法。解题时,有的学生仅使用一种方法,有的则用了多种方法,甚至用了教科书上没有介绍过的方法,因而后者考虑问题的角度比前者要大得多,创造性思维的成分也就大。这些学生的收效不仅是学到了知识,更重要的是学会了思维方法,因而得到了更大的锻炼和提高。


    #### 灵机一动，突然闪现


    最后,灵机一动,突然闪现。创造性思维常常以突然降临的形式在人脑中闪现出来。当然,这种突发性并不是“从天上掉下来”的,而是平时大脑高度集中的紧张思考和经验积累的结果。众所周知的牛顿提出万有引力定律,凯库列提出苯的环形结构等,都是很好的例子。


    ### 培养创造性思维的策略


    创造性思维不是人人天生就有的。在过去的应试教育条件下,过分强调分数和知识教育,忽视了素质和三创教育,使学生的创新能力没有得到很好的开发。因此,在智能新时代,我们在根据创造性思维的特点,推进三创教育,培养三创人才时,尤其要注意以下几点。


    #### 树立创新意识


    第一,树立创新意识。首先,要有创新的愿望和期待。有想要创新的想法,人们才会主动关注创新思维的形成过程与形成结果。其次,要树立创新意识。树立创新意识,是培养创造能力的思想基础。再次,掌握树立创新意识的方法。创新意识与创新性思维之间存在内在的联系,两者之间没有绝对对立的走向,更多的是相辅相成、相互促进的关系。所以,掌握树立创新意识的方法势必有助于人们形成创新性思维。最后,将创新意识融入素质教育。在推进素质教育中,一定要使学生树立创新意识,尤其使他们具有好奇心、求知欲和怀疑感,以及保持思维的独立性和创造性。


    #### 克服消极的思维方式


    第二,克服消极的思维方式。培养学生的创新思维,就要注意改正、克服一些妨碍创新的消极的思维和想法,尤其要注意克服思想懒惰、一知半解、僵死单一、光说不做、“我不行”“随大流”等问题。

