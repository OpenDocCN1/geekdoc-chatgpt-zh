    ## Introduction


    However, this logic-thinking-centered education, coupled with "cramming" teaching
    and learning methods, leads to "overuse" of the left brain, while courses related
    to the right brain are neglected, suppressing the right brain. Innovative work
    requires not only the dominance of the right brain but also the cooperation of
    the left and right brains. In terms of thinking, one must be skilled in both analytical
    and intuitive thinking; both convergent and divergent thinking; both abstract
    and concrete thinking.


    Therefore, in the intelligent era, to cultivate innovative talents, special attention
    must be paid to developing the right brain of the educatees and promoting the
    harmonious development of both hemispheres. Aesthetic psychology tells us that
    the aesthetic process involving perception, understanding, imagination, emotion,
    and other factors is essentially a cognitive process, except that the object of
    cognition possesses the characteristic of imagery. From a physiological mechanism
    perspective, it is primarily the function of the right cerebral hemisphere. Aesthetic
    education, characterized by image education and emotional education, plays an
    important role in developing the right brain and promoting the harmonious development
    of the two hemispheres. It can enhance human sensitivity, train image memory ability,
    develop imagination and image thinking ability, cultivate intuitive ability, inspire
    creative inspiration, thereby promoting the development of human creativity.


    ### From the Perspective of Scientific Methodology


    The pursuit of beauty can stimulate the motivation for intelligent research. Motivation
    is the cause that prompts an individual to act. Scientific activities, like other
    human activities, are significantly influenced by motivation in the selection
    of research topics and the progress of the research process. Scientists'' tremendous
    creative enthusiasm and research motivation largely stem from their sense of beauty.
    The famous American philosopher of science Kuhn pointed out that when a new scientific
    paradigm replaces an old one, "the new theory is said to be more beautiful, more
    appropriate, or simpler than the old one"; in the establishment of a new theory,
    the importance of aesthetic considerations can sometimes be decisive^([\[9\]](#txt010.html#footnote_content_txt010_9)).
    At the same time, aesthetic principles also provide methodological principles
    for scientific research, such as the principles of symmetry, simplicity, and harmony.
    Einstein long ago pointed out that "external empirical verification" and "inner
    perfection" should be the criteria for selecting scientific theories.


    ### From the Perspective of Physical and Mental Health


    Health and beauty are inseparable, because humans are not only natural beings
    but more importantly social beings. In education, only by combining aesthetic
    education with physical education can we cultivate physical beauty, spiritual
    beauty, and skill beauty, endowing people with a healthy and beautiful appearance
    of natural external beauty and social internal beauty, achieving harmonious development.
    Moreover, aesthetic education can delight the mind with beauty, regulate mood,
    channel emotions, maintain psychological balance, and promote physical and mental
    health, because the perception, understanding, appreciation, and creation of beauty
    always bring spiritual enjoyment, making one feel refreshed and pleased.


    The ancient Chinese thinker Xunzi said: "When music prevails and the will is clear;
    when rites are cultivated and conduct is accomplished; ears and eyes are sharp,
    blood and qi are peaceful; customs are transformed, the world is at peace; the
    beautiful and the good rejoice together"^([\[10\]](#txt010.html#footnote_content_txt010_10)).
    Aristotle also said: "Music is not only a source of pleasure for people, but also
    beneficial in relieving fatigue"^([\[11\]](#txt010.html#footnote_content_txt010_11)).
    According to the latest research, after listening to a piece of Mozart, human
    brain vitality increases, thinking becomes more agile, actions more effective,
    as if oiling rusty brain parts. This can even affect epileptic patients and others
    with neurological disorders, alleviating their conditions. This is the so-called
    "Mozart Effect"^([\[12\]](#txt010.html#footnote_content_txt010_12)). In fact,
    not only music, but all other forms of art education and aesthetic education have
    similar effects, which cannot be achieved by mere physical exercise. The physically
    and mentally healthy, harmoniously developed individuals shaped by aesthetic education
    are precisely the innovative talents needed in the intelligent era.


    ## Three, Art Education: Stimulating Human Imagination and Creativity


    Art education can develop right brain potential and promote balanced development
    of the left and right brains, facilitating the incubation of innovation and the
    generation of creative ideas, stimulating innovation motivation, providing methodological
    principles for innovation, cultivating intuition and imagination, and inspiring
    creative inspiration, playing an important role in innovation activities and the
    cultivation of innovative talents. Currently, we should overcome the influence
    of overemphasizing specialized education, strengthen art education, cultivate
    innovative talents, and enhance our country''s scientific and technological innovation
    capability.


    Robert Root-Bernstein, a biochemist from Los Angeles, USA, has long been engaged
    in exploring the "mysterious connection" between science and art. Recently, after
    completing a study of the biographies of 150 famous scientists and artists from
    ancient and modern times, he said that there are many surprising "commonalities"
    between Einstein and Picasso, Pasteur and Bach. Da Vinci was a painter; his masterpiece
    *Mona Lisa* has been handed down through the ages. At the same time, he was a
    scientist who made outstanding contributions in physics, geography, medicine,
    military, and other fields; Einstein, a world-renowned German-American scientist,
    the founder and pioneer of modern physics, the proposer of relativity and "mass-energy
    equivalence". At the same time, he was an outstanding violinist who deeply loved
    art. Steve Jobs once said: "Why has Apple achieved such outstanding success? Because
    in hiring we deliberately recruited a group of people who were musicians, artists,
    poets, and who happened to be computer scientists as well; it was these people
    who changed the world." This shows that scientists and inventors with artistic
    cultivation are more likely to achieve major innovations in scientific and technological
    activities, which also illustrates the important role of art education in cultivating
    scientific and technological innovation talents.


    ### On the One Hand: Art Education and Right Brain Development


    Modern brain science, through research on split-brain patients and normal subjects,
    shows that the two hemispheres of the brain are functionally asymmetric. In most
    people, the left hemisphere is the center for language, mathematics, and analytical
    thinking, while the right hemisphere is the center for spatial relations, pattern
    relations, music, and art appreciation^([\[13\]](#txt010.html#footnote_content_txt010_13)).
    The high development of human innovative ability is the result of the balanced
    functional development of the left and right hemispheres and their close coordination
    in activities. Here, the function of the right brain, long neglected by education,
    stands out. Art education, characterized by image education and emotional education,
    plays an important role in developing the right brain and promoting the harmonious
    development of the two hemispheres. Through art education, image thinking and
    abstract thinking (logical thinking) are organically combined to fully mobilize
    the enthusiasm of the brain''s "non-dominant hemisphere," striving to compensate
    for the function of the "dominant hemisphere," enabling the two hemispheres to
    achieve balanced and coordinated development, thereby forming such a mechanism:
    Art Education → Promotes Image Thinking → Promotes Right Brain Development → Enhances
    Innovative Thinking Ability → Intellectual and Creative Development. Research
    by Dr. Eisner of Harvard University further supports this conclusion. He confirmed
    that art education can promote the development of eight major creative ability
    factors—perceptual ability for relationships among things, attention to subtle
    differences, awareness of using diverse methods to solve problems, ability to
    shift goals during the process without adhering to fixed concepts, ability to
    make decisions in the absence of rules, operational ability in a constrained environment,
    imagination and creativity, and the ability to insight into the world with an
    aesthetic vision^([\[14\]](#txt010.html#footnote_content_txt010_14)).


    ### On the Other Hand: Art Education and Thinking Modes


    Scientific cognition is an extremely complex activity with numerous factors involved.
    But the process of scientific discovery is "constituted by the interaction of
    rational activities and creative thinking mainly manifested as intuition and inspiration."
    Rational criteria and intuitive inspiration play the role of "complementary methodology"^([\[15\]](#txt010.html#footnote_content_txt010_15)).
    Both intuition and inspiration possess characteristics such as directness, suddenness,
    non-logicality, wholeness, and originality. Under modern scientific and technological
    conditions, this mode of thinking has increasingly important methodological value
    for scientific research and technological invention. This is determined by the
    objects and characteristics studied by modern science. Modern science, on the
    basis of high differentiation, is highly integrated, advancing rapidly in the
    direction of polarization, attempting to reveal the laws of motion at deeper,
    broader, more ancient, and more complex levels of nature and under various extreme
    states; its objects of study are increasingly the fundamental "Dao" (Way/principles)
    of the universe. In this situation, empirical science established since modern
    times on the basis of scientific methods of observation, experiment, logic, and
    mathematics, as well as analytical and reductionist thinking modes, has gradually
    revealed its own limitations. Overemphasizing unity, eternity, and simplicity,
    while neglecting and excluding diversity, temporality, and complexity, has caused
    internal contradictions, conflicts, and crises in science. In the 20th century,
    the formation and development of relativity, quantum mechanics, elementary particle
    theory, and systems science indicated that the positivist thinking mode prevalent
    in the era of empirical science could no longer meet the needs of the times. Scientific
    giants like Einstein all advocated replacing positivism with a new thinking mode.
    He believed that the path to scientific discovery is first intuitive, not logical.
    "The supreme task of the physicist is to arrive at those universal elementary
    laws from which the cosmos can be built up by pure deduction. There is no logical
    path to these laws; only intuition, resting on sympathetic understanding of experience,
    can reach them." Therefore, he explicitly pointed out that in scientific research,
    "I believe in intuition and inspiration"^([\[16\]](#txt010.html#footnote_content_txt010_16)).
    Art education can cultivate intuitive ability, inspire creative inspiration, thereby
    promoting the development of creativity. Besides intuition and inspiration, scientific
    and technological innovation cannot do without imagination. Because scientific
    and technological innovation activities do not merely rely on strings of dry experimental
    data and logical rules, but require insight into the internal and external causal
    relationships of unknown things.


    Lenin once highly valued the role of imagination (fantasy) in scientific development,
    saying: "Fantasy is an extremely precious quality." "Some people think that only
    poets need fantasy; this is groundless, a stupid prejudice! Even in mathematics
    fantasy is needed; without it, calculus could not have been invented.^([\[17\]](#txt010.html#footnote_content_txt010_17))"
    Precisely because of the important role of imagination in scientific and technological
    innovation, Guo Moruo earnestly said: "Science is practical. Science is honest
    learning; it tolerates no falsehood and requires arduous labor. At the same time,
    science needs creation, needs fantasy; only with fantasy can we break the shackles
    of tradition and develop science. Comrades in scientific work, please do not let
    poets monopolize fantasy.^([\[18\]](#txt010.html#footnote_content_txt010_18))"
    One of the important ways to cultivate imagination is to receive artistic edification.
    The sense of beauty, rhythm, and harmony cultivated by art education will greatly
    enhance human imagination and creativity.


    As seen above, art education plays an important role in innovation activities
    and the cultivation of innovative talents. The "Overall Plan for National School
    Art Education" issued by the Ministry of Education explicitly states: "Art education
    is the main content and approach for schools to implement aesthetic education,
    and is also a powerful means to strengthen socialist spiritual civilization construction,
    subtly improve students'' moral standards, cultivate noble sentiments, and promote
    intellectual and physical and mental development." The "Decision of the CPC Central
    Committee and the State Council on Deepening Educational Reform and Comprehensively
    Promoting Quality-Oriented Education" has clearly stated: "We must quickly reform
    the weak situation of school aesthetic education work and integrate aesthetic
    education into the entire process of school work." The Ministry of Education further
    decided: "Promulgate the ''Regulations on School Art Education Work'' as soon
    as possible, and formulate relevant implementation rules and supporting documents
    around the ''Regulations'' to bring school art education work onto the track of
    scientific, standardized, and institutionalized management, continuously improving
    education quality.^([\[19\]](#txt010.html#footnote_content_txt010_19))" Therefore,
    in the current process of vigorously promoting quality-oriented education and
    innovation education, great efforts should be made to solve the existing problems
    in this area, so as to cultivate more talents with innovative qualities and abilities,
    and enhance our country''s scientific and technological innovation capability.


    ## Four, Existing Limitations: Restricting Human Aesthetic and Creative Abilities


    The era we live in today is the era of intelligence; data is the foundation of
    intelligence, and innovation is the soul of intelligence. The level of innovative
    ability is influenced not only by intellectual factors but also by non-intellectual
    factors. Examining traditional aesthetic education reveals the following limitations,
    which restrict people''s aesthetic and creative abilities.


    ### First, Parental Education in Family Aesthetic Education


    Abroad, the concept of family education has gradually been replaced by parental
    education. So-called parental education is a discipline that teaches parents how
    to understand and meet their children''s physical and mental development needs,
    fulfill parental responsibilities, and assist children in effective growth, adaptation,
    and development. Parental education is considered the connotation and essence
    of family education, as well as its internal foundation, and differs greatly from
    traditional family education, as shown in Table 10-2.


    **Table 10-2 Differences between Parental Education and Family Education**


    ![](img/txt010_3.jpg "pagenumber_ebook=177,pagenumber_book=167")


    (Source: Shi Xinxin. *ABC of Parental Education* [M]. Beijing: China Textile Press,
    1999: 6.)


    As can be seen from the table above, parental education and traditional family
    education differ in educational focus, principles, modes, atmosphere, and methods.
    Parental education provides at least the following three important insights for
    modern family aesthetic education:


    First, in the subject-object relationship of family aesthetic education, parents
    are the principal aspect of the contradiction and play a decisive role; the key
    factor in the success or failure of aesthetic education is the parents'' cultural
    knowledge and aesthetic cultivation. Therefore, family aesthetic education is
    first the "aesthetic education" of the parents themselves, and only secondarily
    the parents'' aesthetic education of their children. In today''s intelligent era,
    parents should continuously update their concepts, increase their knowledge, and
    strengthen their aesthetic cultivation.


    Second, family aesthetic education should focus on the blending of family affection
    and inner touch, highlighting the emotional and subtle influence characteristics
    of aesthetic education, focusing on encouragement and guidance, adopting a counseling
    approach, rather than the traditional family instruction''s focus on admonition
    and management, adopting a disciplinary approach.


    Finally, teaching by example is better than teaching by words. Imitation is the
    nature of children. In the process of children''s growth, the first objects of
    imitation are parents. Every word and deed of parents are objects of imitation
    for children. How parents dress, how they talk to others and talk about others,
    how they read books and newspapers... all this has important significance for
    children. Children can detect and feel subtle changes in their parents'' tone;
    all shifts in parents'' thoughts are conveyed to children through invisible channels.
    As parents, they can enable children to grow healthier through teaching by words
    and deeds, especially by example. In the intelligent era, for parents to play
    their roles well, they must enhance the scientific nature of their values, have
    a healthy lifestyle, and establish a healthy and civilized family environment.
    This is crucial to the success or failure of aesthetic education and all education.


    ### Second, Art Education in School Aesthetic Education


    Art education is an important aspect of aesthetic education; art courses offered
    by schools, whether music, fine arts, or dance, etc., all occupy an important
    position in the implementation of school aesthetic education. As the highest form
    of human aesthetic activity, artistic works can artistically, concentrically,
    and emotionally process commonplace examples in life, far surpassing other aesthetic
    images in moving and infecting people, possessing an incomparably strong captivating
    charm.


    ### Third, Creation of Humanistic Environment in Social Aesthetic Education


    Compared with family aesthetic education and school aesthetic education, social
    aesthetic education is a larger stage. Because after birth, through socialization,
    a natural person becomes a social person, sociality becomes the essential attribute
    of human beings. In social aesthetic education, we must not only pay attention
    to the beautification of the natural environment but more importantly to the optimization
    of the social environment, especially the creation of a good humanistic environment.


    ## Five, Transcending Paths: Family, School, and Society


    In the intelligent era, aesthetic education should be regarded as a social systems
    engineering project running throughout life, strengthened from multiple channels.
    Strengthen aesthetic education through family, school, and society. Family aesthetic
    education, school aesthetic education, and social aesthetic education are interconnected
    and mutually reinforcing. We should give full play to the respective advantages
    of each educational force, enabling family, school, and society to complement
    each other, operate in coordination, form a synergy, exert overall function, and
    achieve good aesthetic education results.


    ### Family Aesthetic Education: Starting Point and Cradle


    The family is the cell constituting society, the first station of human socialization,
    and an important place for lifelong human activities. The family is also the starting
    point and cradle of aesthetic education. The cultivation of a person''s aesthetic
    ability and the formation of aesthetic concepts and tastes are closely related
    to the family. Therefore, the importance of family aesthetic education is self-evident.
    The implementation of family aesthetic education can utilize family environment,
    family atmosphere, daily life, literature and art, nature, etc. Parents should
    consciously make full use of these aspects to strive to cultivate children''s
    aesthetic ability and taste, enabling them to grow healthily and harmoniously.


    ### School Aesthetic Education: Important Base


    If the family is the foundation of aesthetic education, then the school can be
    said to be the important base of aesthetic education. This is because, compared
    with the family, schools possess characteristics of purposefulness, planning,
    systematicness, scientificity, and concentration. The implementation of school
    aesthetic education can utilize subject teaching for aesthetic education. The
    central link of school education is the teaching activities of different subjects.
    Therefore, school aesthetic education cannot be separated from subject teaching
    aimed at intellectual education. Courses offered by schools not only possess formal
    beauty characteristics of symmetry, balance, harmony, and unity in diversity in
    their forms of expression—such as the original language basis of concepts, models,
    graphics, molecular formulas, equations, calculation processes, speculative processes—but
    also constitute the deep rationality of aesthetic education, playing an important
    role in improving students'' aesthetic perception ability. Art education is an
    important aspect of aesthetic education. Art courses offered by schools, whether
    music, fine arts, or dance, etc., all occupy an important position in the implementation
    of aesthetic education.


    In current educational practice, due to the influence of "exam-oriented education,"
    the one-sided pursuit of "enrollment rates," and the one-sided emphasis on specialized
    education, some schools have reduced or even stopped offering art courses. This
    is extremely unfavorable for cultivating well-rounded innovative talents. Einstein
    once solemnly pointed out: "It is not enough to educate a person with specialized
    knowledge. Through specialized education, he may become a useful machine, but
    not a harmoniously developed person. It is most basic to make students understand
    values and develop fervent feelings for them. He must acquire a keen discernment
    for beauty and moral goodness. Otherwise, he—with his specialized knowledge—will
    more closely resemble a well-trained dog than a harmoniously developed person"^([\[20\]](#txt010.html#footnote_content_txt010_20)).


    ### Social Aesthetic Education: Larger Stage


    Compared with family aesthetic education and school aesthetic education, social
    aesthetic education is a larger stage. In fact, humans cannot objectively leave
    society, and thus inevitably receive social aesthetic education at all times.
    Therefore, aesthetic education activities should run through all times and spaces
    of the entire social life. The implementation of social aesthetic education can
    utilize nature, social facilities, humanistic landscapes, various activities,
    etc. Special attention should be paid to utilizing culture and art for aesthetic
    education. As Liang Qichao said: "The most powerful weapon of emotional education
    is art: music, fine arts, and literature—these three magic weapons hold the keys
    to the ''secrets of emotion''." Therefore, social aesthetic education should make
    good use of culture and art to infiltrate the soul, enlighten wisdom, enhance
    virtue, and satisfy human aesthetic psychological needs. At the same time, literary
    and art workers should realize: "...The responsibility of artists is heavy; between
    merit and sin, there is no margin. Once artists recognize their position, they
    should know: the most important work is to cultivate their own emotions, striving
    towards the noble and sincere, looking upward and experiencing inward; only when
    the beautiful emotions in their hearts are fully nurtured, and then expressed
    with exquisite technique, will they not disgrace the value of art"^([\[21\]](#txt010.html#footnote_content_txt010_21)),
    so as to create artistic masterpieces enjoyed by the masses.


    Social aesthetic education must first actively utilize a harmonious interpersonal
    environment for education. Harmony is the highest level of beauty. We must improve
    the moral quality and mental health level of the whole society, strive to create
    a harmonious interpersonal environment full of care, so that members of society
    are moved emotionally, receive education imperceptibly, change their inner world,
    and jointly create a beautiful life. Second, we must utilize humanistic landscapes
    for aesthetic education. Like nature, humanistic landscapes such as architecture,
    gardens, cultural relics, and scenic spots are also good materials for social
    aesthetic education. While developing, protecting, repairing, and reconstructing
    these landscapes, we should fully exert their role in aesthetic education, enabling
    people to gain more aesthetic education and enjoyment. Finally, we must utilize
    culture and art for aesthetic education. Culture and art can move, change, and
    perfect people emotionally, and are the main methods of aesthetic education.


    In summary, family aesthetic education should advocate parental education, focusing
    on the blending of family affection and inner touch; school aesthetic education
    should fully utilize subject teaching and attach importance to art courses; social
    aesthetic education should run through all times and spaces of social life, and
    pay special attention to utilizing culture and art for aesthetic education. Literary
    and art workers should recognize their social responsibility and create artistic
    masterpieces enjoyed by the masses.


