    # 第二章 新兴教育：人工智能教育的兴起


    ### 人工智能教育：智能时代教育的新形态


    ### 智能新时代的教育：个性化与人性化并存


    ### 人工智能教育的价值链条：一个日益增值的价值闭环


    随着互联网、大数据、物联网、云计算和人工智能等新兴技术的不断发展和广泛应用，由智能技术赋能教育而引发的教育革命，使整个人类社会对于教育的审视出现新的变化，重新定义了人工智能时代教育的理念与特征、价值与优势。


    ## 一、人工智能教育：智能时代教育的新形态


    人工智能技术是人类智能在技术层面的延伸和增强，它是计算机科学的一个重要分支，涵盖深度学习、视觉识别、图像识别、语音识别、自然语言处理、智能机器人、智能系统、人工神经网络等技术，被誉为“20世纪70年代以来世界三大尖端技术(空间技术、能源技术、人工智能)之一”。


    自20世纪50年代诞生以来，人工智能技术在经历“二起二落”之后，如今正迎来“第三次崛起”的社会智能化浪潮，与之相关的理论成果不断走向实践与应用领域，关于人工智能具体应用的社会解决方案如潮水般涌现。通过与其他领域的融合，人工智能技术对社会各个领域的发展都产生了重大影响。


    随着人工智能技术的不断发展与完善，以及教育信息化的迅速推进，教育的变革开始呼唤人工智能技术的参与。在人工智能时代，教育的信息化发展为教育的智能化发展奠定了数据基础，使以“数据驱动”为核心的人工智能技术得以渗透到教育的各个环节，从而引发教育领域的人工智能技术的迁移性革命。人工智能与教育的镶嵌式发展已成为时代趋势，广受社会各界的热切关注。


    2017年，国务院发布了《新一代人工智能发展规划》。《规划》指出：“要充分利用智能技术加快推动人才培养模式、教学方法改革，构建包含智能学习、交互式学习的新型教育体系。开展智能校园建设，推动人工智能在教学、管理、资源建设等全流程应用。开发立体综合教学场、基于大数据智能的在线学习教育平台。开发智能教育助理，建立智能、快速、全面的教育分析系统。建立以学习者为中心的教育环境，提供精准推送的教育服务，实现日常教育和终身教育定制化。”该《规划》的发布，还将发展人工智能教育作为构建智能社会的重要任务之一进行推进。


    2019年2月，国务院又印发了《中国教育现代化2035》^([\[1\]](#txt002.html#footnote_content_txt002_1))。该文件进一步指出，要“利用现代技术加快推动人才培养模式改革，实现规模化教育与个性化培养的有机结合。创新教育服务业态，建立数字教育资源共建共享机制，完善利益分配机制、知识产权保护制度和新型教育服务监管制度。推进教育治理方式变革，加快形成现代化的教育管理与监测体系，推进管理精准化和决策科学化。”


    无论是《新一代人工智能发展规划》，还是《中国教育现代化2035》，都是国家对教育智能化发展的政策性引领与战略性布局，对于我国教育的智能化发展意义重大。人工智能与教育的结合，是时代的趋势，也是国家和社会发展的客观要求。国家智能教育政策的颁布，正是对这种趋势的有效回应，也是对智能教育发展的超前展望。


    经过国家的战略引领，教育领域的智能化发展如火如荼。关于人工智能与教育融合的概念性探讨也深得学界青睐。人工智能与教育的并行发展，催生人工智能教育的诞生。在经历过政策引领与市场拉动之后，人工智能教育的实践与应用促使人们探讨人工智能教育的概念。截至目前，关于人工智能教育的概念的探讨，主要存在于应用层面、教学环节层面和教育结构智能化层面。


    在应用层面，徐鹏认为，人工智能教育的应用领域主要集中在智能教学系统、智能代理、智能答疑系统、智能化教育决策支持系统^([\[2\]](#txt002.html#footnote_content_txt002_2))。梁迎丽认为，人工智能教育的应用领域主要集中于智能导师系统、自动化测评系统、教育游戏、教育机器人等^([\[3\]](#txt002.html#footnote_content_txt002_3))。


    在教学环节层面，百度百科认为，人工智能教育是利用计算机技术为教学设计人员和其他教学产品开发人员在教学设计、教学产品开发过程中提供辅助、指导、咨询、帮助或决策的过程^([\[4\]](#txt002.html#footnote_content_txt002_4))。中华人民共和国科学技术部在《智能教育创新应用发展报告》中指出，人工智能教育是基于深度学习、大数据、虚拟现实等新一代信息技术，构建以学习者为中心，贯穿“备课-教学-练习-考试-评价-管理”教育流程各环节的智能化教育环境，实现人才培养更加多元、更加精准、更加个性化的新型教育模式^([\[5\]](#txt002.html#footnote_content_txt002_5))。


    在教育结构智能化层面，钟晓流等认为，人工智能教育是依托新一代信息技术所打造的泛在化、感知化、一体化、智能化的新型教育生态系统^([\[6\]](#txt002.html#footnote_content_txt002_6))。徐立芳认为，人工智能教育是指教育教学过程实现智能化，是对从事教育工作的人员进行人工智能教育教学思想启蒙^([\[7\]](#txt002.html#footnote_content_txt002_7))。


    通过对应用层面、教学环节层面、教育结构层面等智能化层面的概念探讨与辨析，人工智能教育的概念逐渐清晰。人工智能教育包括教育智能化和智能化教育两个方面。就教育的智能化层面来讲，主要集中于教育过程与教育环节的智能化，具体体现在教育的各大应用形态与执行环节之中，它是旨在改善教育者、教育中介与教育对象的存在状态，是一种“由下至上”的教育变革，其中牵涉人工智能技术在教育领域的具体应用情景，如智能导师系统、教学管理、教学评估、教育咨询等。就智能化的教育层面来讲，人工智能教育的概念，是源于“自上而下”的人文关怀与制度性边界的超越，旨在从人类的教育精神领域谋求教育教学的总体思想启蒙，从而带来整个人类教育系统的生态化与智慧化。


    综上所述，人工智能教育，是指在人工智能技术的基础上促成智能化的教育与教育的智能化在技术空间的社会泛在化过程。从技术与教育的融合视角来看，人工智能教育是现实教育与虚拟教育的综合体，是以“教育对象为中心”的新型教育架构，教育的全过程、全结构都将与智能技术实现立体式的融合，突出教育的真正价值与目的，集中彰显新时代的教育魅力。


    ## 二、智能新时代的教育：个性化与人性化并存


    人工智能教育是技术、教育与人文的有机结合，它通过技术手段表征教育者、教育对象与教育中介在教育活动和教育问题中的新形态，以及体现人工智能赋能教育核心新特征在技术空间中的价值与功能，它让学习者在教学活动中的主体地位得以回归，凸显智能新时代教育“学以御物”与“学以成人”的新内涵。对人工智能教育特征的进一步清晰界定，是探讨人工智能教育的价值、功能与应用的重要基础。


    ### 1.智能化


    智能化是人工智能教育的总特征。人工智能教育的智能化特征，是指在智能技术的支撑下，能动地满足教育者与学习者需求的倾向。数据、算法与算力是人工智能教育的核心驱动力。无论是智能教师系统、智能专家系统，还是智能个性化推荐学习系统，都是基于海量教育大数据的智能建模。在模型的泛化过程中，不断地完善人工智能教育系统的功能模块。


    人工智能教育，是在海量的教育大数据中迅速挖掘潜在价值的功能系统，借助人工智能技术的试错优势，能够在不影响学生学习的情况下，改善教育环境，提升教育资源的质量，为学校的教学工作带来丰富的情感体验。


