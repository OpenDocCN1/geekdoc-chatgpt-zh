    ## 第七章 通才之路：新工科与新文科教育


    - 社会需求：大教育体系的构建

    - 制度审思：文理分科教育的局限

    - 新工科教育：人工智能赋能新工科教育

    - 新文科教育：人工智能赋能新文科教育

    - 科学综合化：智能时代大学人才培养的重要路径


    ### 一、社会需求：大教育体系的构建


    教育，事关个人前途和国家命运，教育质量的高低也直接影响社会的发展。社会，是由人组成的社会，最小的单元是每个独立的个人。马克思说，人是一切社会关系的总和^([\[1\]](#txt007.html#footnote_content_txt007_1))。社会是所有人的一切社会关系的总和，人的素质反映社会的整体素质，人的格局决定了社会的整体格局。值得注意的是，人的格局与教育休戚相关。因此，良好的教育环境对于社会的整体格局的塑造功能是不言而喻的。


    关涉社会发展的理论也势必要谈及教育与人的发展方面。当今社会，是一个“文明大转换”的社会。科学技术的渗透力量，已经延伸至社会的每一个“细胞”，教育、医疗、就业、餐饮、交通、政务、社交、工程建设、农业发展等，无一例外。随着大数据、物联网、人工智能技术的不断发展，社会各领域在技术层面的卷入程度不断加深，社会的技术化形态越发明显，继农业社会、工业社会、信息社会之后，以智能技术为载体的智能社会日渐生成。


    随着智能社会的到来，各种新情况、新变化、新问题呈“井喷式”涌现，对社会的治理体系和治理能力造成了新的冲击。教育的质量决定人才的质量，为适应社会发展的“新”常态，教育必须革故鼎新，以培养新的社会人才为目标，从而推动智能时代的发展。


    目前，中国的常住人口城镇化率只有58.5%，中国的城镇化率要继续推向75%～80%，城市还将继续扩大。从2012年开始，我国的劳动力供给总量开始下降，必须大幅度地对劳动人口进行培训和提升教育，提升劳动力人口的素质，新的人口红利即将到来^([\[2\]](#txt007.html#footnote_content_txt007_2))。由此可见，社会的发展，随时都会有新情况、新变化、新问题的出现，要求社会的应对方式必须是“在发展中进行应对”。怎么发展？当然要从教育中培养新生代人才，为社会的发展提出创新性的战略方向。因此，教育的未来发展势必要跟上“三个步伐”：社会经济发展的步伐、科学技术发展的步伐和社会文化发展的步伐。


    教育要跟得上社会经济发展的步伐。智能时代，智能经济的发展，经济制度、经济结构、市场机制、生产制造、销售与服务等，都将掺杂时代元素，在经济领域的一切，都将走向智能化。因此，教育的发展也要顺应社会经济发展的需求，要迅速走教育转型之路。时代的改变，意味着创造社会财富的方式要改变，社会劳动力的素质与结构也要随着智能经济而改变，这是必要的教育思考，否则很容易危及劳动者的“饭碗”。教育势必要为社会经济发展而服务，要跟得上社会经济发展的步伐，要走上智能化的道路。

