    [M\\].北京：人民出版社,1995：294.\n\n\uFEFF\n\n附录\n\n一、《北京共识——人工智能与教育》\n\n联合国教科文组织《北京共识——人工智能与教育》全文\n\
    \n国际人工智能与教育大会成果文件^([\\[1\\]](#txt012.html#footnote_content_txt012_1))\n\n2019年5月16—18日\
    \ 中华人民共和国 北京\n\n序言\n\n1.我们——国际人工智能与教育大会与会者,包括50名政府部长、来自100多个会员国的逾500名国际代表,以及来自联合国机构、学术机构、民间社会和私营部门的约100名代表,于2019年5月16—18日齐聚中国北京。我们衷心感谢联合国教育、科学与文化组织和中华人民共和国政府合作举办此次大会,以及北京市政府的热情欢迎和盛情款待。\n\
    \n2.我们重申了《2030年可持续发展议程》中的承诺,特别是可持续发展目标4及其各项具体指标,并讨论了教育和培训系统在实现可持续发展目标4时所面临的挑战。我们致力于引领实施适当的政策应对策略,通过人工智能与教育的系统融合,全面创新教育、教学和学习方式,并利用人工智能加快建设开放灵活的教育体系,确保全民享有公平、适合每个人且优质的终身学习机会,从而推动可持续发展目标和人类命运共同体的实现。\n\
    \n3.我们回顾2015年通过的关于利用信息通信技术(信通技术)实现可持续发展目标4的《青岛宣言》,其中指出必须利用新兴技术强化教育体系、拓展全民受教育机会、提高学习质量和效果以及强化公平和更高效的教育服务供给;当我们步入人工智能广泛应用的时代时,我们认识到重申并更新这一承诺的迫切需要。\n\
    \n4.我们研究了人工智能演变的最新趋势及其对人类社会、经济和劳动力市场以及教育和终身学习体系的深远影响。我们审视了人工智能对于未来工作和技能培养的潜在影响,并探讨了其在重塑教育、教学和学习的核心基础方面的潜力。\n\
    \n5.我们认识到人工智能领域的复杂性和迅猛发展速度、对人工智能的多元化理解、宽泛的外延和各种差异较大的定义,以及在不同场景中的多样化应用及其引发的伦理挑战。\n\
    \n6.我们还认识到人类智能的独特性。忆及《世界人权宣言》中确立的原则,我们重申联合国教科文组织在人工智能使用方面的人文主义取向,以期保护人权并确保所有人具备在生活、学习和工作中进行有效人机合作以及可持续发展所需的相应价值观和技能。\n\
    \n7.我们还申明,人工智能的开发应当为人所控、以人为本;人工智能的部署应当服务于人并以增强人的能力为目的;人工智能的设计应合乎伦理、避免歧视、公平、透明和可审核;应在整个价值链全过程中监测并评估人工智能对人和社会的影响。\n\
    \n8.认识到人工智能的多学科特性及其影响;确保教育人工智能与公共政策特别是教育政策有机配合;采取政府全体参与、跨部门整合和多方协作的方法规划和治理教育人工智能政策;根据本地在实现可持续发展目标4及其具体目标以及其他可持续发展目标的工作中遇到的挑战,确定政策的战略优先领域。从终身学习的角度规划并制定与教育政策接轨和有机协调的全系统教育人工智能战略。\n\
    \n9.意识到推行教育人工智能政策和工程的巨大投资需求。审慎权衡不同教育政策重点之间的优先级,确定不同的筹资渠道,包括国家经费(公共和私人)、国际资金和创新性的筹资机制。还要考虑到人工智能在合并和分析多个数据来源从而提高决策效率方面的潜力。\n\
    \n10.意识到应用数据变革基于实证的政策规划方面的突破。考虑整合或开发合适的人工智能技术和工具对教育管理信息系统(EMIS)进行升级换代,以加强数据收集和处理,使教育的管理和供给更加公平、包容、开放和个性化。\n\
    \n11.还考虑在不同学习机构和学习场景中引入能够通过运用人工智能实现的新的教育和培训供给模式,以便服务于学生、教职人员、家长和社区等不同行为者。\n\n\
    12.注意到虽然人工智能为支持教师履行教育和教学职责提供了机会,但教师和学生之间的人际互动和协作应确保作为教育的核心。意识到教师无法被机器取代,应确保他们的权利和工作条件受到保护。\n\
    \n13.在教师政策框架内动态地审视并界定教师的角色及其所需能力,强化教师培训机构并制定适当的能力建设方案,支持教师为在富含人工智能的教育环境中有效工作做好准备。\n\
    \n14.认识到人工智能在支持学习和学习评价潜能方面的发展趋势,评估并调整课程,以促进人工智能与学习方式变革的深度融合。在使用人工智能的惠益明显大于其风险的领域,考虑应用现有的人工智能工具或开发创新性人工智能解决方案,辅助不同学科领域中明确界定的学习任务,并为开发跨学科技能和能力所需的人工智能工具提供支持。\n\
    \n15.支持采用全校模式围绕利用人工智能促进教学和学习创新开展试点测试,从成功案例中汲取经验并推广有证据支持的实践模式。\n\n16.应用或开发人工智能工具以支持动态适应性学习过程;发掘数据潜能,支持学生综合能力的多维度评价;支持大规模远程评价。\n\
    \n培养人工智能时代生活和工作所需的价值观和技能\n\n17.注意到采用人工智能所致的劳动力市场的系统性和长期性变革,包括性别平等方面的动态。更新并开发有效机制和工具,以预测并确认当前和未来人工智能发展所引发的相关技能需求,以便确保课程与不断变化的经济、劳动力市场和社会相适应。将人工智能相关技能纳入中小学学校课程和职业技术教育与培训(TVET)以及高等教育的资历认证体系中,同时考虑到伦理层面的内容和与之相关的人文学科渗透。\n\
    \n18.认识到进行有效的人机协作需要具备一系列人工智能素养,同时不能忽视对识字和算术等基本技能的需求。采取体制化的行动,提高社会各个层面所需的基本人工智能素养。\n\
    \n19.制定中长期规划并采取紧急行动,支持高等教育及研究机构开发或加强课程和研究项目,培养本地人工智能高端人才,以期建立一个具备人工智能系统设计、编程和开发的大型本地人工智能专业人才库。\n\
    \n20.重申终身学习是实现可持续发展目标4的指导方针,其中包括正规、非正规和非正式学习。采用人工智能平台和基于数据的学习分析等关键技术构建可支持人人皆学、处处能学、时时可学的综合型终身学习体系,同时尊重学习者的能动性。开发人工智能在促进灵活的终身学习途径以及学习结果累积、认证、发证和转移方面的潜力。\n\
    \n21.意识到需要在政策层面对老年人尤其是老年妇女的需求给予适当关注,并使他们具备人工智能时代生活所需的价值观和技能,以便为数字化生活消除障碍。规划并实施有充足经费支持的项目,使较年长的劳动者具备技能和选择,能够随自己所愿保持在经济上的从业身份并融入社会。\n\
    \n22.重申确保教育领域的包容与公平以及通过教育实现包容与公平,并为所有人提供终身学习机会,是实现可持续发展目标4——2030年教育的基石。重申教育人工智能方面的技术突破应被视为改善最弱势群体受教育机会的一个契机。\n\
    \n23.确保人工智能促进优质教育和全民学习机会,不分性别、是否残疾、不分社会地位、不分贫富、不分民族或文化背景、无论地理位置。教育人工智能的开发和使用不应加深数字鸿沟,也不能对任何少数群体或弱势群体表现出偏见。\n\
    \n24.确保教学和学习中的人工智能工具能够有效包容有学习障碍或残疾的学生,以及使用非母语学习的学生。\n\n性别公平的人工智能和应用人工智能促进性别平等\n\
    \n25.强调数字技能方面的性别差距是人工智能专业人员中女性占比低,且进一步加剧已有性别不平等现象的原因之一。\n\n26.申明我们致力于在教育领域开发不带性别偏见的人工智能应用程序,并确保人工智能开发所使用的数据具有性别敏感性。同时,人工智能应用程序应有利于推动性别平等。"
  fmt: '

    # 四、不忘初心：教育促进人的全面发展


    人类智能是人工智能的基础，人类智能的发展对于人工智能的发展具有决定性作用。弱人工智能阶段，人工智能是人类智能的模仿、延伸与增强，这一性质决定了它的“从属”地位，也间接地反映了人工智能的被动属性，只有在人类智能高度发展的时代，人工智能的发展才能达到新的高度。人工智能的“三起两落”正说明了这一点。


    人工智能的发展，源于技术的糅合与交融，从而在一个较为立体的层面（不是在一个单维度的层面），系统地再现人类智能。然而，当人工智能在完成模仿、延伸与增强的工作之后，它相较于人类智能，就完全从人类智能的母体中分离出去，成为独立的人工智能个体，具备了人工智能的相对独立性。


    人工智能的发展，它的相对独立性触发人类本体意识的觉醒。人工智能的发展，在历史上存在三大流派，分别是模仿人类神经传导的联结主义、模仿人类逻辑语言的符号主义和模仿人类行为模式的行为主义。不同的流派模仿的对象有别，但都是在以不同的方式模仿着人类本身的复杂形态，以及人类的生命本质。


    模仿的范式进化，经历了从简单到复杂、从单一到系统的过程。人工智能对人类智能的模仿，只是其发展的基本阶段；而延伸和增强阶段，却是人工智能开始宣告独立的开始。届时，引发人类智能与人工智能的冲突，俗称人机冲突。人类为了解决人机矛盾，寻求过几种消解办法，一是无政府主义，任其发展；二是技术恐怖主义，严格限制其发展；三是科学控制主义，趋利避害。显然，第三种消解办法暗含着人类本身的妥协与包容，凸显人类智能与人工智能的相辅相成关系。


    人类智能与人工智能的相辅相成关系，意味着在两者之间存在着“共进退”的属性。如今，人工智能对于人类智能的模仿、延伸与增强已达到很高的层次，特别是在行为模仿层面，模仿较为成熟。总的来说，到目前为止，由阿尔法狗引发的人机关系的再思考，大规模的“机器换人”战略的实施引发的“技术性失业”的焦虑等，都反映了人工智能机器已开始反向督促人类自身的发展问题，并在智能发展的过程中给人类的发展规定了严格的发展秩序。人类只有全面发展，才能更好地面对未来的人机共生社会中的生存、生活与发展的问题。


    因此，人工智能的高度发展，直接或间接地倒逼人类的发展。严格意义上来说，是促进人的全面发展。因为“不动脑、不动情”的领域，人工智能已远超人类智能，而且由于人类受到客观条件的限制，在这个领域永远不可能超越人工智能。所以，“人的全面发展”成为人工智能时代人的发展的主攻方向，也是人工智能教育的核心目的。


    “人的全面发展”，是指人的“德、智、体、美、劳”的完整发展。人工智能时代，有别于工业时代和信息时代，人们强调的全面发展，重心已经从“智育”转变为“五育并举”。这个重大的转向，主要源于人机冲突中的人类意识的觉醒。从古代的“本体论”到近代的“认识论”，再到现、当代的“存在论”的发展历程，就是由于人的自我意识的不断觉醒、个体意识不断提高而导致思维方式不断变化的结果^([\[6\]](#txt011.html#footnote_content_txt011_6))。人工智能时代的教育要促进人的全面发展亦是如此。


    物联网、大数据与人工智能技术的相互糅合，塑造了人类历史上迄今为止出现过的最为卓越的时代，也引发了技术思维与人本价值的矛盾冲突。技术思维的胜出，是整个人类遭受灾难的危险时刻。历史的惨痛教训，让智能时代的人们明白，人工智能技术的发展，需要大力弘扬人本价值，力争促进技术思维与人本价值的协同与有机统一，才能促进人的本体地位的时代性回归，才能使人走向存在主义的“人学立场”，人的全面价值才能受到社会的广泛关注。这就是说，是人，而不是技术，必须成为价值的最终根源；是人的最优发展，而不是生产的最大化，成为所有计划的标准^([\[7\]](#txt011.html#footnote_content_txt011_7))。


    考察人工智能时代的人的全面发展，存在两个分析维度：一是技术维度，二是物质资料维度。技术恐怖主义者认为，人工智能的发展，只会给人类带来毁灭性的灾难——技术性失业、机器换人、单维度的人、无用阶级等，不一而足。不难看出，他们一致看到的仅是人工智能技术对人类的冲击，也仅看到人工智能时代的技术维度，而没有看到物质资料维度。人工智能时代的物质资料的生产，正在进入一个全新的生产时代，由智能机器代替人类而进行的精准化工业生产模式，人类赖以生存的物质资料得到极大的满足，人类进入智能生产过剩的经济时代，人类对自然与物质的依赖程度降到历史最低。


    马克思指出，“人的依赖关系（起初完全是自然发生的），是最初的社会形式。在这种形式下，人的生产能力只是在狭小的范围内和孤立的地点上发展着。以物的依赖性为基础的人的独立性，是第二大形式。在这种形式下，才形成普遍的社会物质变换、全面的关系、多方面的需要以及全面的能力体系。建立在个人全面发展和他们共同的、社会的生产能力成为从属于他们的社会财富这一基础上的自由个性，是第三个阶段。第二个阶段为第三个阶段创造条件。^([\[8\]](#txt011.html#footnote_content_txt011_8))”按照马克思的说法，人工智能时代的智能机器大生产模式，充盈的物质资料已经为“以物的依赖性为基础的人的独立性”创造了条件，“第二个阶段”已经为“第三个阶段”创造条件。在这个需要全面的能力体系作为支撑的社会维度，人们不再只是“为生存而战”，而是将更多的时间消费在“为发展而战”之中，从而直接为人的全面发展提供了可能。


    共同体的全面发展，为人工智能时代个人的全面发展提供手段。2015年，习近平总书记在亚洲博鳌论坛上提出推动建设“人类命运共同体”的思想，深得世界各国赞许与支持。在这一思想的指引下，一个人的命运、一个社会的命运、一个国家的命运、一个民族的命运，都紧紧地与全人类的命运联系在一起，成为一个不可分割的“命运共同体”。由此可见，人工智能时代的教育，在促进人的全面发展的过程中，还得益于人类命运共同体提供必要的思想指引。马克思指出，“只有在共同体中，个人才能获得全面发展其才能的手段，也就是说，只有在共同体中才可能有个人自由。^([\[9\]](#txt011.html#footnote_content_txt011_9))”换言之，就是马克思所说的“每个人的自由发展是一切人的自由发展的条件。^([\[10\]](#txt011.html#footnote_content_txt011_10))”


    人工智能时代的教育，得益于技术维度与物质维度的多元价值，为教育对象的发展提供了必要的发展条件、发展时空和发展手段，人的全面发展的道路已“天堑变通路”，人的本体论价值与存在主义人学立场，正在所有人的全面发展中得到实现。人工智能时代的教育，促进人的全面的发展的目的，源于人工智能的相对独立性带来的人类整体意识觉醒，并在共同体的全面发展中实现了个人的全面发展。


