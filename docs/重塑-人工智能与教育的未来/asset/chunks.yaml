    # Chapter 8 Smart Campus: Intelligent Teaching and Management


    - Origin and Concept: History and Future of Smart Campus

    - Applications and Services: Intelligence Everywhere in Smart Campus

    - Future Classroom: Vision of Smart Classrooms

    - From Discrete to System: Construction Strategies for Smart Campus


    Since the 1970s, smart campus construction has gone through the industrial era,
    the information era, and the artificial intelligence era. Different eras, due
    to the differing shaping forces of emerging technologies, have shaped smart campuses
    of varying forms. The campus is a microcosm of society; the smart campus is a
    microcosm of the smart society. In the AI era, intelligent technology will not
    completely replace campus management work, but compared to schools that do not
    use AI, schools that apply AI technology to teaching and management activities
    are destined to make greater contributions to talent cultivation in the future
    education system.


    ## 1. Origin and Concept: History and Future of Smart Campus


    In the 1970s, the Massachusetts Institute of Technology (MIT) in the United States,
    combining the context of the times, proposed the "Electronic Campus" plan, which
    became the prototype of the "Smart Campus." By the 1980s, influenced by foreign
    "Smart Campus" construction, China also launched campus informatization construction.
    In 1990, Professor Kenneth of Claremont University in the US first proposed the
    concept of "Digital Campus," which attracted tremendous attention and became the
    core concept for campus upgrading and transformation in many countries worldwide.
    To date, the technological transformation and upgrading of campuses have roughly
    gone through three stages: the electronic stage, the digital stage, and the smart
    stage.


    In 2010, in China''s Informatization "12th Five-Year Plan," Zhejiang University
    proposed building an "exciting" "Smart Campus" ^([\[1\]](#txt008.html#footnote_content_txt008_1)).
    In 2017, the *13th Five-Year Plan for National Education Development* stated:
    "Support the construction of ''Smart Campuses'' in schools at all levels and of
    all types, comprehensively utilize the Internet, big data, artificial intelligence,
    and virtual reality technologies to explore new models of future education and
    teaching. ^([\[2\]](#txt008.html#footnote_content_txt008_2))" In 2018, the national
    standard *Smart Campus Overall Framework* was released, specifically providing
    framework construction and policy guidance for China''s "Smart Campus" construction.


    "Smart Campus" refers to the comprehensive application of emerging technologies
    such as LAN, mobile Internet, Internet of Things, big data, cloud computing, and
    artificial intelligence to fully intelligently perceive, coordinate, control,
    and intelligently serve the school''s teaching and management activities, improve
    the foundation of the school''s administrative office and teaching forms, enhance
    the campus''s intelligence and wisdom level from an overall perspective, and under
    the support of intelligent technology, make the campus''s overall operation mode
    present characteristics such as flexibility, precision, and efficiency.


    The smart campus is the extension and development of the traditional campus. It
    extends the furnishings and layout of the traditional campus in physical space,
    and the two have great similarity in hardware facilities. However, from a development
    perspective, the biggest difference between the smart campus and the traditional
    campus lies in software facility construction. Software facilities are the true
    source of "wisdom" in the campus; they replace part of the work of staff, and
    even the wisdom of staff, in the original physical operating space of the campus,
    and possess significant transcendental value in operating efficiency and quality,
    thereby driving schools at all levels and of all types to reform, with wisdom
    and intelligence becoming the dominant direction of campus transformation and
    upgrading.


    So, why carry out smart campus construction and reform across society? Ultimately,
    the reason lies not only in the value of the smart campus itself but also in the
    limitations of the traditional campus, because traditional education itself contains
    factors that restrict talent development.


    The campus has no fixed pattern; it takes different forms under different historical
    contexts. Campus 1.0 represents the most traditional educational form, where educational
    activities between people were mainly conducted through "oral transmission." The
    campus at that time had no fixed time and space constraints, or perhaps it could
    not even be called a "campus."


    With the development of social productivity, national governance and social industrialization
    required large numbers of professional technical talents, but people who grew
    up in the traditional Campus 1.0 era could not quickly adapt to the development
    needs of the industrial era, leading to the rapid development of Campus 2.0. Campuses
    in this period continued to expand in scale, serving as typical venues for "gathering
    the world''s talents to educate them," cultivating numerous professional technical
    talents for social development.


    In the Campus 2.0 era, the education and teaching model emphasized the ability
    to quickly cultivate enough talents for social development. Therefore, the class-based
    teaching system prevailed, but this also resulted in minimal differences among
    students. The same educational model, the same educational standards—different
    students became "products" cast from the same mold. Innovative spirit and critical
    spirit became what students cultivated in the Campus 2.0 era lacked.


    The AI era is an era of innovative development. "Innovation is the soul of a nation''s
    progress and the inexhaustible driving force for a country''s prosperity." Youth
    students, as the future builders and successors of the nation, the Campus 2.0
    model can no longer adapt to society''s demand for innovative talents. A campus
    lacking innovative and critical spirits is inherently unreasonable.


    Against this background, intelligent elements continuously permeated the campus
    and structurally nested with campus construction work, giving rise to the Campus
    3.0 era. In the Campus 3.0 era, students become the center of the entire campus,
    and both software and hardware facilities will focus on students'' personalized
    needs. Therefore, the intelligent and smart transformation and upgrading of the
    campus is imperative.


    The construction of smart campuses originates from the needs of social development
    and the needs of students'' personalized development. Because the development
    of traditional campuses could no longer effectively meet the era''s "dual needs,"
    people began to turn their development vision toward smart campuses, thus setting
    off a boom in smart campus construction in the intelligent era.


    Driven by demand and promoted by policy, smart campus construction is in full
    swing. Today, the development of smart campuses has entered a stage of extensive
    application, forming a diversified, refined, and ubiquitous development pattern.
    The development process is undergoing a rapid transformation "from points to lines,
    from lines to surfaces," and its applications and services have basically achieved
    full campus coverage, including scenarios such as campus safety, teaching management,
    library management, and student grade management.


    In the AI era, future smart campus construction requires forward-looking layout
    of its development, advance strategic planning, continuous promotion of the synchronized
    development of standardization and personalization of smart campus construction,
    continuous promotion of the scientific management and precise services of smart
    campuses advancing side by side, and precise positioning of the instrumental value
    and ideological value of smart campus construction. Empowered by intelligent technology,
    the smart campus gains "wisdom." As an important place for student growth, the
    smart campus should become a place that inspires student wisdom, a place that
    promotes the perfection of student personality, a place where students achieve
    success—a "growth paradise" in students'' lives.


    ## 2. Applications and Services: Intelligence Everywhere in Smart Campus


    The full-scenario application and full-scenario service of the smart campus refer
    to the virtual mapping of various real organizational structures and service activities
    within the campus onto the smart campus system platform. "Centralized management"
    and "Unified leadership" become the guiding ideology of the application process;
    it aims to move all real campus teaching and management activities onto the platform.
    The most direct manifestation is that for every activity entity existing in the
    campus, there is corresponding data and space in the smart campus.


    The full-scenario application and service of the smart campus include campus safety
    management, library management, teaching management, teacher team management,
    student club management, campus lighting, campus one-card system, etc. Currently,
    smart campus applications have achieved full campus coverage; basic campus supporting
    services are all connected with emerging technologies, showing great tension on
    the "smart" level. Specific typical application scenarios are as follows.


    ### (1) Artificial Intelligence and Campus Safety Management


    The importance of social public safety is self-evident. In May 2019, General Secretary
    Xi Jinping pointed out at the National Public Security Work Conference: "We must
    ensure that public security work adheres to the correct political direction, persists
    in reform and innovation, persists in comprehensively and strictly governing the
    Party and managing the police, and forges a high-quality, tough police force that
    the Party Central Committee can rest assured of and the people are satisfied with...
    strictly governing the police cannot be relaxed for a moment. We must persist
    in building the police politically and governing the police strictly, and strive
    to forge a ''public security iron army'' with iron-like ideals and beliefs, iron-like
    sense of responsibility, iron-like professional skills, and iron-like discipline.
    ^([\[3\]](#txt008.html#footnote_content_txt008_3))" From the perspective of the
    Party and the state''s attention to safety issues, they attach great importance
    to social public safety issues and insist on building "a high-quality, tough police
    force that the Party Central Committee can rest assured of and the people are
    satisfied with," which undoubtedly highlights the urgency and suddenness of social
    public safety issues; the Party and the state are always ready to respond to safety
    issues. Safety issues specifically include food safety, health safety, production
    safety, economic safety, psychological safety, and social security.


    Campus safety is an important component of social public safety, relating to the
    safety and happiness of millions of families. According to the 2018 and 2019 "China
    Safe Xiaokang Index" survey data, campus safety issues have been listed in the
    "Top Ten Safety Issues Most Worried by the Public" ranking (as shown in Table
    8-1), ranking 5th and 7th in 2018 and 2019 respectively.


    **Table 8-1 "Top Ten Safety Issues Most Worried by the Public" Ranking**


    ![](img/txt008_1.jpg "pagenumber_ebook=122,pagenumber_book=112")


    (Source: Xiaokang Network. 2018, 2019 China Safe Xiaokang Index: Top Ten Safety
    Issues Most Worried by the Public [OL]. http://www.sohu.com/a/239248333_426502;
    http://mini.eastday.com/a/190709153848239.html)


    In the past two years, the public''s concern about campus safety is not groundless
    but has its reasons. Today, in some campuses, some "naughty" students or "street
    hoodlums" still take the lead in inciting some students to make trouble, smashing
    and dismantling campus doors, windows, newsstands, and other facilities. Even
    more vicious, some evil elements target vulnerable students, carrying out violent
    attacks against this group; due to the extremely vicious nature, these escalate
    into campus violence incidents.


    Campus safety issues are not limited to campus violence hazards; campus bullying
    incidents cannot be ignored either. On April 9, 2019, a 40-second video of "female
    middle school students fighting" went "viral" online. The video shows two female
    middle school students in school uniforms fighting in a deserted alley; more accurately,
    one female student frantically bullying another, intermittently insulting the
    other with foul language. And the students filming nearby could be heard laughing.
    It is visible that the situation of campus bullying is relatively serious.


    Campus safety incidents include not only campus violence and bullying incidents
    but also campus traffic safety incidents, campus food safety, campus fires, unsafe
    campus facilities, etc. These incidents share a commonality: they all cause varying
    degrees of harm to students. If such campus safety incidents are not eliminated
    in time, they will quickly affect the overall campus safety environment. For example,
    if an ongoing campus bullying incident is not mediated by the school and family
    in time, it can easily evolve into a campus group incident, with students "forming
    gangs" to fight each other, with unimaginable consequences.


    Campus safety means that all faculty and students during their time on campus
    will not be threatened or harmed by the environment or others, nor will they become
    people who threaten or harm others, thereby maintaining a relatively safe state.
    In smart campus construction, campus safety construction should be placed first.
    Therefore, building a smart campus should follow the principle of "safety first,"
    comprehensively carry out campus safety governance work, to ensure that the most
    basic survival and safety needs of all faculty and students are met, and not let
    them live in constant panic of insecurity.


    To give all faculty and students a harmonious and safe environment, it is necessary
    to consider how to effectively utilize new-generation scientific technologies
    such as big data and artificial intelligence to assist campus safety management
    work in the process of promoting smart campus construction. AI technology is a
    technology integration system, a manifestation of highly integrated technology,
    containing various sub-technologies, among which video recognition technology
    is one. In the intelligent era, installing cameras covering the entire school
    within the smart campus is an important guarantee for campus safety. The purpose
    of installing full-coverage cameras is not to monitor, but to expose possible
    "darkness" under the sun, present it to managers, thereby making every corner
    of the campus a collection of visualizable video data, revealing "hidden" campus
    safety problems. Campus camera recordings are installed near elevators, entry/exit
    vehicles, toilets, campus building rooftops, and various places where pedestrians
    pass, all for the purpose of improving campus safety.


    Before the introduction of intelligent video recognition technology, many schools
    had already established the most basic monitoring network, laying the foundation
    for the subsequent introduction of intelligent technology. In the traditional
    campus monitoring network, only massive monitoring data was collected, requiring
    a large number of employees to manually analyze data rather than automatic system
    analysis. That is to say, the original monitoring system did not possess functions
    such as intelligent recognition, early warning, and video summarization, which
    requires upgrading the security monitoring network, introducing an intelligent
    video monitoring cloud system, adding intelligent recognition functions (such
    as license plate recognition, facial recognition, abnormal behavior recognition,
    etc.) on the basis of security monitoring video, and pushing video summaries to
    the cloud for search ^([\[4\]](#txt008.html#footnote_content_txt008_4)). In this
    way, abnormal behavior data occurring within the campus can achieve early warning
    and control at the first moment.


    AI video recognition technology is based on the automated and intelligent discrimination
    and identification technology of AI machines. Compared with traditional video
    monitoring technology, it has advantages such as high video content audit efficiency
    and fast discovery of harmful audio information. Therefore, the existence of the
    campus intelligent video monitoring cloud system will undoubtedly help enhance
    the overall level of the smart campus security system and further effectively
    guarantee campus safety.


    When talking about campus safety issues, one cannot avoid the student health issues
    triggered by campus influenza. The campus is a place where large crowds gather;
    once influenza breaks out, it spreads extremely fast and has strong radiation
    capability, which should be focused on and controlled. According to the Google
    Flu Trends prediction model, introducing AI technology helps early warning of
    campus influenza development trends. In 2017, Ping An of China and the Chongqing
    Disease Control Center jointly successfully developed the world''s first AI influenza
    prediction model. After practical testing, the model can predict the development
    trend of influenza one week in advance, greatly improving the efficiency of influenza
    prediction and the response capability of early warning. The prediction accuracy
    of both influenza and hand, foot, and mouth disease models reaches over 86%, and
    the prediction accuracy in high-incidence seasons can reach over 90%; applying
    the COPD intelligent screening model can significantly reduce screening costs
    and improve screening efficiency. Currently, the model''s accuracy has reached
    92%. It is visible that if the AI influenza prediction model is nested in the
    smart campus construction process, it will inevitably further enhance the campus
    influenza prediction capability, realize campus influenza monitoring and early
    filing, and activate response plans, with schools, families, and disease control
    centers coordinating together to jointly give children a healthy learning environment.


    The application of AI technology in campus safety management, with its efficient
    and precise work, can not only identify campus abnormal behaviors in advance but
    also detect campus dangerous scenarios in time, and realize intelligent reminders
    and early warnings, achieving the elimination of campus safety hazards from the
    source. Whether it is the intelligent influenza prediction model or the campus
    intelligent monitoring recognition system, they are all application forms of AI
    technology in campus safety, truly related to campus safety and the physical and
    mental health of all faculty and students.


    From the current perspective, the embedding of AI technology into smart campuses
    should also pay attention to coordination in several aspects. On the one hand,
    attention should be paid to the cultivation of professional AI talent teams; the
    model optimization of the campus safety system requires a very high level of intelligent
    technology, which cannot be handled by general technical workers. On the other
    hand, the intelligent and smart upgrading of the campus is a systematic project;
    separately upgrading the intelligent level of campus safety early warning involves
    many uncertain factors, requiring good coordination work. In the coordination
    process, it is no longer limited to the campus safety management department but
    involves the upgrading and transformation of the entire software and hardware
    facilities. Therefore, it is necessary to establish a departmental coordination
    mechanism of "vertical linkage" and "horizontal coordination."


    ### (2) Artificial Intelligence and Library Management


    Today on university campuses, the library has become a synonym for learning places:
    going to the library to "borrow and read books," "find materials for papers,"
    "discuss topics," etc., constitutes an essential activity for college students.
    The technological management of the new era campus library—smart library—indeed
    provides students with an excellent learning environment, facilitating both the
    search for paper book materials and electronic materials. Compared with traditional
    libraries, the advantages are obvious.


    In traditional libraries, all book resources are mainly in paper versions; books
    and documents are huge in size, occupy a lot of space, and when the library opens,
    the placement of books, handling, sorting, and other work require a lot of manpower.
    In addition, students entering and leaving the library require manual identity
    verification, and borrowing books requires manual entry of book borrowing registration;
    service quality is easily affected by human factors (the mood of library staff
    easily affects students'' impression of the library). Moreover, the retrieval
    of collection resources in traditional libraries is relatively difficult, the
    speed of resource acquisition is very slow, easily affecting students'' learning
    interest.


    To change this situation, in the process of smart campus construction, the library
    form must be reshaped. How to apply emerging technologies to improve library service
    quality and enhance students'' pleasant experience of the library has become an
    important issue in smart campus construction.


    In mid-March 2018, the 29th Beijing Educational Equipment Exhibition was held
    in Beijing. The conference showcased various styles through expert forums, enterprise
    case sharing, and campus case sharing. Xinshengda Education reported on the "Smart
    Library Solution," proposing the *RFID Library Solution*, which contains rich
    wisdom for smart library construction. Through the application of RFID technology,
    the binding of bookshelves, tags, books, and locations is realized, comprehensively
    achieving intelligent management and service of the overall information of library
    cataloging, retrieval, statistics, book reading, and circulation. Smart bookshelves,
    smart inventory carts, librarian workstations, automatic book borrowing and returning
    machines, mobile book return cabinets, smart card issuing machines, RFID security
    gates, OPAC query machines, high-frequency shelf labels, smart navigation systems,
    RFID book tags, surveillance cameras, smart bookshelves, and other technologies
    cover the entire library application scenario, bringing values such as efficient
    management, convenience, data visualization, and personalized book customization
    to library operations.


    The smart library is the extension and development of the traditional library;
    it fundamentally extends the service time and space of the library, redefines
    the existence of the library conceptually, and has even extended to the sharing
    field based on intelligent technology. In recent years, "sharing culture" has
    prevailed unprecedentedly in society; shared bicycles, shared cars, shared power
    banks, shared platforms, shared data, etc., have emerged. Precisely because of
    this, the word "sharing" successfully entered the "Top Ten Buzzwords in Chinese
    Media in 2017." The social penetration of sharing culture has not stopped at the
    above fields but continues to develop horizontally; library development has also
    been influenced—shared libraries have emerged. In June 2018, Changsha''s first
    shared library was born. This library aims to advocate a cultural atmosphere of
    "book sharing, universal reading, and common participation," building the library
    into a comprehensive library integrating reading, training, exhibitions, forums,
    and other functions. Citizens can read and relax here for free, and enterprises
    and institutions can also hold training, exhibitions, and other public welfare
    activities here.


    At the same time, supporting service functions such as "WeChat Mini Program +
    IC Borrowing Card + Fingerprint Recognition + Facial Recognition Cabinet Opening
    for Borrowing + Disinfection System + Book Donation System" assist the emergence
    of intelligent shared book cabinets. According to the intelligent book cabinet
    developed by Luotang Technology, the intelligent shared book cabinet is essentially
    an unmanned shared book cabinet, a shared book cabinet that realizes self-service
    book borrowing and returning through intelligent cabinets. Readers can not only
    borrow and return books through the intelligent book cabinet but also reserve
    books via WeChat, which is very convenient and fast ^([\[5\]](#txt008.html#footnote_content_txt008_5)).


    It can be seen that the application of AI technology in smart libraries is in
    full swing, with diverse application forms, including smart libraries, intelligent
    shared book cabinets, intelligent shared libraries, smart archives, etc.; in terms
    of specific technology integration, including smart bookshelves, smart navigation,
    smart tags, etc. The combination of AI technology and libraries has catalyzed
    new forms of libraries, enabling libraries to gradually move towards informatization
    and modernization in the process of critical inheritance of traditional libraries.


    In the application cases of AI combined with libraries, the concept of smart library
    gradually becomes clear. A smart library refers to the application of new-generation
    information technologies such as the Internet, Internet of Things, big data, and
    artificial intelligence in library management, planning, and construction, making
    the innovated library a gathering place of book resources with highly intelligent
    management and services. From the perspective of time and space, because of the
    empowerment of intelligent technology, many "7+24 libraries" have been able to
    operate normally. It is visible that the smart library is a place not limited
    by time and space; once built, users can enter the library anytime, anywhere for
    data retrieval and download, which is very convenient.


    From the current development trend, the value of smart libraries is mainly reflected
    in these aspects: First, smart libraries can realize the recycling of book resources
    to the greatest extent, reducing the problem of book resource waste caused by
    information blockage; Second, smart libraries can reduce manual costs of management
    and service, save construction and maintenance costs, improve the overall service
    quality of the library, and enhance users'' positive experience; Finally, the
    library''s book resources are rich, resource density is high, physical volume
    is small, occupying less library space resources, which is conducive to using
    more space for learning scene layout.


