    # The Role of Teachers and Teacher-Student Relationships in the Age of Artificial
    Intelligence


    ## Limitations of AI Teachers and the Response of Human Teachers


    The existence of AI teachers represents the absolute execution of standards. To
    date, the development of AI teachers has still not escaped the influence of the
    "genetic genes" of "expert systems." This determines both their astonishing capabilities
    in solving problems and highlights their limitations in being unable to engage
    in the work of "cultivating people" (moral/character education). When students
    seek help from AI teachers, they receive solutions to every request, but are not
    guided from a higher level of wisdom to construct their own problem-solving strategies.
    Over time, students will develop a dependency on AI teachers. This "bundled" student
    growth model is not conducive to the generation of critical and creative thinking;
    in extreme cases, it can even ruin students'' futures, ultimately reducing them
    to sacrificial victims in the teaching context of AI teachers.


    The limitations of AI teachers seem to constitute the most powerful evidence that
    human teachers cannot be replaced by them. The advantages of human teachers lie
    precisely where AI teachers cannot compensate and cannot replace. However, human
    teachers must also be aware that if they cannot master the skills that AI teachers
    cannot master, human teachers are highly likely to be eliminated by AI teachers.
    As Ray Clifford said: "Technology will not replace teachers, but teachers who
    use technology will replace teachers who do not^[[7]](#txt005.html#footnote_content_txt005_7)."
    Without foresight, teachers will face immediate worries. Since the possibility
    of human teachers being replaced by AI teachers has been identified, taking precautions
    in advance is the urgent task at hand for human teachers.


    In November 2017, the *Opinions on Comprehensively Deepening the Reform of Teacher
    Workforce Construction in the New Era*, reviewed and approved at the First Meeting
    of the 19th Central Committee for Deepening Overall Reform presided over by General
    Secretary Xi Jinping, mentioned that by 2035, China should basically achieve a
    scientific and efficient teacher management system and mechanism, realizing the
    modernization of the teacher governance system and governance capacity. Teachers
    must proactively adapt to new technological changes such as informatization and
    artificial intelligence, and actively and effectively carry out educational teaching.
    In the AI era, "professional intelligentization" and "intelligent professionalization"
    develop alternately; the intelligent development of human teachers and the professional
    development of AI teachers proceed in parallel without contradiction. When the
    professional development of AI teachers progresses smoothly, the intelligent development
    of human teachers should also advance rapidly, proactively adapting to the major
    adjustments and transformations of the intelligent society.


    The intelligent development of human teachers is the top priority for them not
    to be replaced by AI teachers in the future teaching profession, and is the inevitable
    choice for human teachers and AI teachers to move towards integration. In any
    era of major technological development, people cannot choose to fight against
    the general trend of the world; only by standing bravely at the forefront of the
    tide, arming themselves with the armor of cutting-edge technology, can they see
    higher and walk further. The same applies to teachers in the intelligent era;
    if they want to avoid elimination, they have no choice but to join the ranks of
    intelligentization, follow the trend, and take the path of "Human-Machine" integration.


    ## Three, "Human-Machine Co-teaching": From Opposition to Unity


    Viewed from the perspective of the development of education as a whole, the debate
    between AI teachers and human teachers, regardless of who wins or loses, will
    be detrimental to the high-quality development of education—dialectical development
    and integration are the best choices. On National Day in 1983, Comrade Deng Xiaoping
    inscribed for Beijing Jingshan School: "Education must face modernization, face
    the world, and face the future." In February 2019, the General Office of the CPC
    Central Committee and the General Office of the State Council issued the *Implementation
    Plan for Accelerating Educational Modernization (2018–2022)*. The Plan pointed
    out that in the new era of social development, we must promote the modernization
    of the educational governance system and governance capacity, and steadily promote
    the high-quality development of education. Therefore, in the AI era, educational
    development should gather forces from all sides, strive to form a synergy in education,
    and while resolving the contradictions between AI teachers and human teachers,
    promote a more rational overall structure of education.


    Human-Machine Co-teaching refers to the joint teaching by human teachers and AI
    teachers. The two are both opposing and unified, complementary to each other,
    and develop together. "A hundred-year plan, education is the foundation; the foundation
    of education lies in teachers." Whether AI teachers or human teachers, both are
    the bearers of the heavy responsibility of education; cooperation benefits both,
    division harms both. It is evident that Human-Machine Co-teaching is the best
    path for the development of both types of teachers at present, and the best choice
    to prevent human teachers from being replaced. As shown in Figure 5-2, "Teacher
    Intelligentization" and "Intelligentized Teachers" are the two major intelligentization
    trends to resolve the current conflicts between human and machine teachers, and
    the overall architecture for realizing the unity of opposites between humans and
    machines.


    ![](img/txt005_4.jpg "pagenumber_ebook=80,pagenumber_book=70")


    Figure 5-2 Human-Machine Integration


    In the discussion in the previous section, it was mentioned that the teaching
    activities of AI teachers are simple and repetitive, but in specific teaching
    contexts, they possess the advantages of high execution efficiency and precise
    implementation of standards, which human teachers do not possess, or are far inferior
    to AI teachers in. However, what cannot be ignored is that human teachers undoubtedly
    possess transcendent value in critical thinking, innovative thinking, and value
    judgment. In order to break the cycle of mutual competition and elimination between
    humans and machines, and to achieve human-machine integration and development,
    it is imperative to carry out innovative integration from three perspectives:
    technology, thinking, and structure, thereby highlighting the "non-traditional
    attributes" of future teachers.


    The integration and transcendence of AI teachers and human teachers: technological
    means are the realistic foundation for integrated development; integration at
    the thinking level is the directional guarantee; structural integration is the
    focal point of Human-Machine Co-teaching. The core problem that technological
    integration needs to solve is the chasm between the two, including two sub-problems:
    the "technological blind spots" of human teachers and the "value blind spots"
    of AI teachers. The integration of thinking mainly refers to the integration of
    the mechanical thinking of AI and the dialectical thinking of humans. Structural
    integration mainly refers to the structural alignment of the various qualities
    of human teachers and AI teachers.


    As can be seen from the Human-Machine Integration structure diagram in Figure
    5-2, throughout the entire process of human-machine integration, the birth of
    future teachers who organically integrate technology and values will be facilitated.
    In the overall intelligentization trend of Human-Machine Co-teaching, future teachers
    will form all-round teaching talents or educators with the human body as the carrier,
    technical knowledge and skills as the amulet, and care for life and humanistic
    values as the soul; the image of teachers will be completely subverted.


    Therefore, starting from the present, when educating students with the assistance
    of AI technology, we need to recognize the fact that AI teachers are strong in
    knowledge imparting. We also need to guide relevant human teachers to shift their
    teaching from facing the knowledge system for imparting, towards cultivating core
    competencies such as humanistic heritage, responsibility, national identity, and
    cross-cultural communication. Students'' creative ability, aesthetic ability,
    collaborative ability, and contextualized knowledge application ability are the
    core and focus that human teachers should pay attention to^[[8]](#txt005.html#footnote_content_txt005_8),
    moving towards unity in the division of labor and collaboration between human
    teachers and AI teachers.


    In the AI era, the task of cultivating future educational talent teams is arduous,
    among which the cultivation of the teaching ability of all-round teachers is the
    key difficulty. But no matter what, taking the path of future teachers under Human-Machine
    Co-teaching is the inevitable choice, and the most effective way for human teachers
    to truly avoid being eliminated by AI teachers. The emergence of future teachers
    requires the support of new educational methods, educational systems, educational
    resources, and educational structures. If we want to realize the value of future
    teachers as early as possible, we should currently actively carry out theoretical
    innovation and practical implementation work, open the closed doors and windows,
    breathe the fresh air of the new world, break through and transcend the barriers
    of traditional education, and accelerate the process of modernizing the educational
    governance system and governance capacity.


