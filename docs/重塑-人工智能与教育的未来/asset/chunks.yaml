    [M\\].北京：中国广播电视出版社,1992：23.\n\n\uFEFF\n\n第十一章 教育革命：在变与不变中走向未来\n\n智能教育：在变与不变中透析本质\n\
    \n终身教育：从理念兴起到实践落地\n\n面向未来：教育为学生未来做准备\n\n不忘初心：教育促进人的全面发展\n\n人工智能时代,由智能技术广泛应用而引发的教育革命,导致教育领域发生了翻天覆地的变革,教育内容、教育方式、教育资源、教育载体、教育结构等,无一例外,都在发生剧烈的变化。然而,在教育的飞速变化中,人们逐渐感觉到,虽然整个教育在变,但仍存在着不变的东西。此时,关于教育的变与不变的讨论便拉开序幕。那么,人工智能时代的教育,变的是哪些?不变的又是哪些?其本质又是什么?\n\
    \n一、智能教育：在变与不变中透析本质\n\n立足当下,展望未来,人工智能时代,离不开对未来教育的畅想。人工智能与教育的结合,催生人工智能教育。教育包含“教”和“育”两个方面。教是教知识和教技能;育是育人,立德树人。从古至今,教育的发展从未像今天这样,能够同时兼顾“教”和“育”两个维度,能够同时兼顾教师和学生的需求。可见,人工智能时代的教育,已经迎来了教育的真正回归——回归到人最本质的关怀——人的价值、尊严和全面发展。\n\
    \n未来教育,必将走向与智能技术深度融合的时代,智能教师与人类教师并存。智能教师主攻知识教育与技能教育,帮助教育对象深刻把握操作性知识,并助力培育教育对象的智慧性知识和技能。而人类教师,核心的任务则与现在有较大的差距,人类教师已经从原有的知识与技能教育,转向情感教育与道德教育,集中于培育教育对象“立德树人、学以成人、生而为人”的品质,真正践行人类教师的育人价值。\n\
    \n21世纪前20年,人工智能与教育的结合还处在初级阶段,人工智能技术在教育中的应用主要集中于助教阶段,表现为人类专业教师借助人工智能教师系统,以辅助完成教学管理、制订教学计划、完善教学过程、优化教学考核、规范教学评价等较为广泛的领域。但是,整体的智能教育理论、智能教育方法论、智能教育实践等,还有待进行理论概括,教育的细分、微分领域,仍然需要进行智能技术的深入契合。所以,未来的教育,一定是在拓荒中前进的发展模式,整体实践进路是由宏观迈向中观和微观领域,理论延展方向则是从具体实践中诞生系统且开放的教育理论体系。\n\
    \n未来的教育,人机并存成为普遍存在的事实。智能机器人开始以现有的教师的角色出现,人类教师的角色也将发生巨大改变。取而代之的是,人类教师从知识与技能的教育中解放出来,将更多的时间投身于学生的德育和情感教育中,学生德才兼备,科学精神与人文精神集于一身。\n\
    \n未来的教育,在教育的过程中,人工智能教育系统能够根据学生的学习进度、学习强度、学习效率、学习薄弱点、学习专注程度、学习注意力、学习兴趣等数据内容,进行智能化施教和个性化施教。教育对于人的态度,彻底由需要强制改造的对象,转换为需要根据教育对象的需求和社会的需求进行改造的对象。\n\
    \n由此可见,前面论及的人工智能教育的发展方向,也是人工智能教育需要改变的方向,也是最为凸显人工智能给教育带来的转变的领域。但是,这些变化的现象,最终反映的都只是人工智能赋能教育,给教育本身所带来的变化,而隐藏在变化的背后的不变的东西,仍然需要挖掘,如教育的目的等。\n\
    \n2018年11月,新东方创始人俞敏洪在浙江乌镇接受澎湃新闻专访时强调：“任何技术的改变都只是工具利用上的改变,不能改变教育本质,任何一种技术的改进,都不能与培养一个人的本质去相提并论。”“从教育方面来说,教育的核心要素就是培养一个全面成长的人,培养一个身心健康的人,培养一个对知识的追求充满好奇心和探索精神的人,这些都是不可能改变的。^([\\\
    [1\\]](#txt011.html#footnote_content_txt011_1))”同理,从俞敏洪的谈话中可知,人工智能赋能教育,也始终是以工具的形式出现的。工具对人的教育,由于工具的人本属性,使得教育活动中最根本的连接方式——人与人的教育模式没有改变,教育本身是培养人的这个目的没有改变。也就是说,教育的本质没有变。\n\
    \n人工智能时代,教育的智能化与智能化的教育,教育的形式在不断地变化,教育的工具在不断地变化,教育的模式也在不断地变化,且其变化的趋势会随着智能技术的更新与迭代而革新。但是,在教育的变化中,始终保持不变的就是培养全面发展的人的目的不变。无论智能技术何等发达,教育都是要培养全面发展的人,培养德才兼备的人,培养具有创新思维、创新能力、想象力、同情心的人。\n\
    \n不变的本质,价值蕴藏其中。未来的教育,教育充分展现其经济价值、政治价值与文化价值。特别是对于传承文化、创造知识、培养智能人才方面价值更为突出,对于提高人们的整体生活质量和生命质量具有重要意义。\n\
    \n二、终身教育：从理念兴起到实践落地\n\n19世纪中期,以美国为首的资本主义国家在全球掀起第二次工业革命浪潮,电气化的生产方式,极大地提高了社会生产力水平,使人类进入了“电气时代”。在第二次工业革命的影响下,飞速旋转的电力机器无休止地塑造着整个人类世界,人类社会的生产方式、生活方式以及思维习惯,都在被无限制地改变着。正是工业革命期间的技术力量,以其惊人的能量迅速地颠覆着传统社会,社会的政治命运、经济形态以及社会结构无一例外,最终世界逐渐从一个分散的世界变成一个整体的世界。\n\
    \n一切都在无穷的变化之中。由于社会的加速变化,人们开始思考如何应对这种变化、如何在其中更好地生存、如何更好地彰显个人的价值与尊严。正是在这样大的社会背景下,终身教育得以诞生。\n\
    \n终身教育,最早是由联合国教科文组织成人教育局局长法国的保罗·朗格朗(Paul Lengrand)在1965年正式提出的。保罗·朗格朗指出,终身教育不是某个具体的实践,也不是某个具体的教育阶段,而是泛指一种教育思想。终身教育是指在人的一生中接受的所有教育的总和,涵盖人们所接受的各种教育类型和各个年龄段所接受的教育。终身教育自提出至今,已成为世界各国制定教育方针、教育政策的重要思想依据,深受各国重视。\n\
    \n从其诞生的背景来看,终身教育旨在帮助人们时刻处于“清醒状态”,要求人们在一个加速变革的时代,应该清楚地认识到终身教育与终身学习的重要性,因为它直接与人们的生存和发展密切相关。换言之,终身教育理念是一种引导人们适应变革社会的思想熔炉,只要遵循它的义理,至少会比完全弃之不顾的人生存得更好。\n\
    \n然而,技术的局限性和教育时空的局限性,限制了终身教育的实践落地。工业时代和信息时代,这种教育思想理念,注定只能在小范围进行试点,而无法推广至全球。其主要原因在于,在那样的时代,个人的发展很少以他人的发展为前提,每个相对独立的个体之间,存在着必然的时空界限,使终身教育的思想落地受到限制。尤其是人们想要从一般的教育实践中找到终身教育的规律,以及将终身教育落到具体的个人时,原始的数据壁垒、信息鸿沟和阶段性教育部门的孤立状态,阻断了终身教育的“终身”性质的塑形。譬如,当代大学生,要构建其终身教育体系,对于他们的未来是可行的,但是要整合他们的学前教育、小学教育与中学教育,恐怕只能获取到零碎的阶段性学习成果,对于学习的过程数据,估计教育对象本人,也已经忘得“一干二净”。因为对于现如今已经在校的这代大学生而言,他们的过去已经成为只有结果没有过程的“零星记忆”。试想,该种状态如何推进实现终身教育理念?\n\
    \n然而,大数据和人工智能时代,这种教育现状正在改变。终身教育理念迎来发展的黄金时期——从理念兴起到实践落地。在大数据和人工智能技术的支撑下,教育者对教育对象施行的所有教育影响,以及教育对象本身主动学习的过程数据,都将以教育大数据的方式储存下来。各种教育类型的大数据之间,经过国家终身教育的顶层规划设计,实现教育大数据的跨界共享与集中关联,从而形成了关于个人与集体的教育大数据集群。当教育大数据集成后,以人工智能技术为基础的终身教育体系正在生成,教育对象的个人教育活动与学习活动,全面映射于终身教育平台上,针对个人的教育规律,以及面向全体的教育规律得以“去遮蔽”。\n\
    \n人工智能时代的教育,正如比尔·盖茨在《未来之路》中所指出的那样,“教育的最终目标会改变,不是为了一纸文凭,而是为了终身受到教育。^([\\[2\\]](#txt011.html#footnote_content_txt011_2))”人的一生中,他们所从事的一切,都与他们的教育有关,而他们的一切教育活动,也将反作用于教育对象的现世的生存与发展。终身教育平台、终身学习平台、智能开放大学、终身教育公共服务体系逐渐建成,推动终身教育实践落地。未来的教育,将更为直接地服务于人的生存与发展,实现人的价值、尊严和全面发展。\n\
    \n推行终身学习政策。2019年8月2日,联合国教科文组织“终身学习政策国际咨询会议”在成都成功举办(如图11-1所示)^([\\[3\\]](#txt011.html#footnote_content_txt011_3)),该会议主要对《终身学习的准则和关键政策解读的联合报告》与《终身学习手册：政策与实践》两份出版物了进行出版前咨询、论证和评审。《终身学习的准则和关键政策解读的联合报告》旨在通过一系列案例研究和终身学习政策的比较分析,探讨“终身学习”的政策含义,分析在国家经验、人权和发展框架的基础上,决策者和其他利益攸关方应具备的知识、证据、核心原则,以便能够制定和执行终身学习的相关政策。《终身学习手册：政策与实践》则阐述了终身学习的概念,并探讨如何通过国家、地方及院校层面的实践方法,推行终身学习。终身学习是终身教育的核心构成部分,终身学习政策推行,必然会直接或者间接地推动终身教育的发展与完善。\n\
    \n![](images/txt011_1.jpg \"pagenumber_ebook=187,pagenumber_book=177\")\n\n图11-1\
    \ 联合国教科文组织“终身学习政策国际咨询会议”\n\n搭建终身教育平台。终身教育平台的搭建,是人工智能时代有效联结与整合教育对象终身教育数据与终身学习数据的平台基础。所以,有必要紧密围绕教育对象的生活环境,进行广泛的教育平台“覆盖性应用型”建设,从整体上覆盖教育对象的各个教育阶段与各种教育类型,借助大数据人工智能终身教育平台,形成“家庭—学校—社会”为一体的综合性教育平台。据新华网报道,早在2012年,面向全民的国家开放大学就已建成,国家开放大学一直致力于促进全民终身学习,在开放大学中,网络自主学习、远程支持与面授辅导相结合的学习模式,为不同类型(不同年龄、不同职业等)的人群提供丰富多样的教育课程,大力推动了全民终身教育实践的落地。\n\
    \n构建终身教育体系。联合国教科文组织在发布的《北京共识——人工智能与教育》中指出,人工智能时代的教育,应该“通过人工智能与教育的系统融合,全面创新教育、教学和学习方式,利用人工智能加快建设开放灵活的教育体系,确保全民享有公平、有质量、适合每个人的终身学习机会。”“要采用人工智能平台和基于数据的学习分析等关键技术,构建人人皆学、处处能学、时时可学的综合型终身学习体系。^([\\\
    [4\\]](#txt011.html#footnote_content_txt011_4))”“综合型终身学习体系”的构建,正在推动终身教育体系的结构成型。人工智能时代,教育的边界正在被打破,教育对象不再被固定在指定的领域进行学习或者接受教育,而是在任意时间和地点都可以进行学习与建构知识。未来,将在深度学习、自然语言处理、机器模式识别等关键技术的帮助下,建构出“群智共享、人机协同、跨界关联、融会贯通”的终身教育体系,助力终身教育的实践落地与创新发展。\n\
    \n人类社会已经开始迈入“后人类社会”,以智能技术为代表的新兴技术的崛起,挑战了原始的人类中心主义的世界观、人生观与价值观,“被挤压”成为这个时代的人类所共有的显著标志。因此,人工智能教育的发展,势必要带领整个后人类社会,摆脱后工业社会的“智能束缚”,投身于人工智能终身教育体系的怀抱之中。未来教育,并不是所有的后人类都会被人工智能“挤压”,只有那些对终身学习与终身教育“不屑一顾”的后人类,最终难免是要吃人工智能的“苦头”。\n\
    \n三、面向未来：教育为学生的未来做准备\n\n教育的变,变的是形式;教育的不变,不变的是本质。教育的形式丰富多彩,但教育的本质总是围绕培养人而进行的。无论任何时代,教育的本质属性都不会变,这是由社会的本质属性所决定的,反映在教育的相对独立性之中。教育的存在,其起源就不是源于其他领域,而是源于人的生产劳动。就此而言,教育的本质不会变,由其本质所决定的目的和任务也就不会变。值得注意的是,教育的本质不会变,但教育的内容却会不断地扩充,教育的目的和任务也在不断地扩充——与时俱进,教育的质的规定性在多元技术的支撑下,“培养什么样的人,怎样培养人”的问题受到越来越多的关注。然而,最有权力回答此问题的人,应该是教育对象本身,他们最清楚“自己想要成为怎样的人”,而不是“教育者想要他们成为怎样的人”。\n\
    \n如此说来,教育的本质的内容,目前已经扩充到教育对象领域,包含两层含义：一层是教育者的期盼,在一定意义上代表社会的发展要求,为迷惘的教育对象指明发展方向;另一层是教育对象的迫切要求,它直接支撑教育对象一直走向未来,而不让教育对象止于某个阶段。换言之,教育对象自己知道未来的自己要活成什么样子。所以,他们从现在开始就已经思考这件事,因为他们始终相信,跟着自己的内心走,一直不停止思考,总会活成自己想要成为的样子,生活也会成为自己想要的样子,这大概就是所谓的“皮格马利翁效应”。\n\
    \n与此不同的是,过往的教育,重点强调的是眼前的短期利益,可以是为了中考考入一个好学校,也可以是为了高考考入一个好大学。但是,当这些目标实现之后,迷茫与困惑却成为生活的主题,很多学生就在这样的状态中度过了自己的大学时光。\n\
    \n教育对象是一个有机整体。作为教育者,不应该人为地将之割裂成碎片,然后进行拼装,这样的短期效果固然好。但是,在教育对象身上形成的碎片间的裂纹,将会成为教育对象一生的残缺印记。然而,以更为发达的人工智能技术为基础的未来教育,必然是早就规避了如上之局限,着眼于未来的教育,这将成为未来教育的普遍共性。总的来说,未来教育,是为学生的未来做准备的。这种教育,它不是忽视学生的过往,也不是完全不看眼前的实际,而是在过往的教育大数据与学习大数据的支撑下,充分赋予学生众多未来的可能性。\n\
    \n教育为学生的未来做准备。人类教育史上,有很多教育家提到过教育与生活的关系：有人提出教育为宗教生活做准备,有人认为教育就是生活的,也有人认为教育就是为休闲生活做准备等。但是,最为人称赞的观点,还是教育“为未来生活做准备”的教育思想。早在19世纪末期,英国著名的教育思想家赫伯特·斯宾塞就已提出,教育的目的是为“未来的圆满生活做准备”的。确实如此,在物质充盈与思想自由的年代,这一教育思想蕴藏着战略眼光——学生的学习是面向未来的学习。\n\
    \n在欧几里得的《几何原本》中,有个弟子曾经问他学习几何能够得到什么好处,这个功利性的想法很快就遭到了他的批判,面对这样的问题,欧几里得对身边的侍从说,“给他三个硬币,因为他想在学习中获取实利。^([\\\
    [5\\]](#txt011.html#footnote_content_txt011_5))”这样看来,无论今人还是古人,在教育的理念上,都有惊人的相似之处——强调教育的未来价值。\n\
    \n为学生的未来生活做准备,不仅是一些教育家的重要理念,也是一些教育机构的发展愿景。国际学生教育评估项目(PISA教育)便是如此,它旨在从开发测评工具、结果报告呈现、学生表现因素分析、教育质量和教育公平协调发展等角度,提高教育的质量和学生的整体能力。PISA教育指出,教育的发展应该重点关注学生的知识建构能力,而不是知识的记忆能力。记忆能力的背后,是一整套的应试教育体系,讲求的是死记硬背,使很多学生失去了思维能力和创新能力,陷入灌输的无限循环之中。而知识的建构能力,则是培养学生创造知识的能力。在引导学生创造知识的过程中,PISA教育还在考核内容中加入了素养考核。PISA定义的素养与其他教育形态强调的素养不同,它强调的素养是学生通过学校教育和生活教育,主动将已经学到的知识和技能应用于实际生活中,以便于学生提升总体的生活能力和生活水平,从而适应将来的极具变化色彩的生活,确保能够拥有在不同情境中具备解释问题和解决问题的能力。"
  fmt: '

    # 第十一章 教育革命：在变与不变中走向未来


