- raw: '创新性思维是在外部环境与内部条件双重作用下的结果,必然会受到多种因素的影响,甚至是限制和制约。历史地看,创新性思维的每一次时代性的呈现,都无不反映外部环境对创新性思维的影响,也显示出生活在一个时代的人们的整体创新水平,以及创新文化对创新性思维的形成的人文塑造。


    人工智能时代,是一个极具创新文化色彩的技术化时代。但创新性思维依然不可能完全摆脱枷锁,这是与创新性思维的时代性、民族性和社会性密切相关的。我国的创新文化,有着悠久的历史底蕴,“四大发明”成就了中国古代创新的文化自信,向世界显示国人过人的创新智慧。虽然如此,生活在人工智能时代的我们依然被很多因素限制,使创新性思维的发展受到威胁和挑战,如应试教育、思维与思维定式、传统观念与传统文化、工业文化的后遗症等,都会影响人们创新性思维的形成。


    应试教育对创新性思维的限制。在应试教育的实施过程中,局限与优势并存。但若论应试教育对创新性思维的影响,负向的评价在所有观点中是占主导地位的。就应试教育本身而言,其发展过程中主要重视的是学生的智育,轻视德育、体育、美育与劳育,造成学生发展的后天不足。在整个应试教育的实施过程中,片面重视考试分数与考试成绩,学生的求学过程成为分数比拼的过程,加重学生的学习负担,阻碍学生学习的积极性与主动性。应试教育还只注重教育的选拔功能,很容易导致教育的精英化发展。少数学生成为教师关注的重点对象,其他学生则任其随意发展。就此而言,应试教育的存在对于人才的长远发展有较大的局限性,学生所接受的多是灌输式的教育,学生的好奇心、想象力、批判性思维等,都被长期禁锢起来,严重束缚了学生创新性思维的形成。


    思维与思维定式对创新性思维的限制。思维定式(Thinking Set),也称“惯性思维”,是由先前的活动而造成的一种对活动的特殊的心理准备状态,或活动的倾向性。情境不变的条件下,思维定式使人能够应用已掌握的方法迅速解决问题;但在情境发生变化时,则会妨碍人采用新的方法。消极的思维定式是束缚创造性思维的枷锁^([\[3\]](#txt009.html#footnote_content_txt009_3))。思维定式,对于已经历过的问题解决较为有效。过去,中国主要处于农业文化与工业文化中,在技术领域,人们主要通过经验的方式传递技术,人才的培养成为上一代人才的当代延续。这种经验思维,本身就是一种思维定式,只要发生新的场景,人们就很难适应,需要重新拜师学艺。要想利用这种思维来解决创造性的问题,则比较困难。在这种经验思维限制下,人们的思维与决策都是一种固定的反应倾向,始终跳不出传统的框架或者固定的思维路径。


    传统观念与传统文化对创新性思维的限制。传统观念与传统文化对创新性思维的限制是根深蒂固的。传统观念和传统文化分为两大类：一类是先进的文化,另一类是落后的文化。比如,在洋务运动中表现出来的守旧观念与文化,他们认为老祖宗留下来的东西,后人是不能对其进行更改的,人们需要做的就是“遵守”。所以,洋务运动最终走向失败。再比如,清朝末年,朝廷为了不破坏皇陵风水,选择用马来拉轨道上的火车,成为世界的笑柄。可见,传统的观念与文化对新事物的态度是否定的,而创新性思维却是追逐创造与革新,两者显然不同。由此可见,现存的传统文化与传统观念,势必会限制人们进行创造活动与创新性思维。


    工业文化的后遗症对创新性思维的限制。工业文化的后遗症,是指自工业革命以来,在社会上形成的一种商业化、标准化与理性化的文化环境。从经济学角度看,工业文化是一种功利主义文化,该文化起源于社会对经济规模与经济利益的极度奢求,在整个文化的发展过程中,速度与规模成为人们追逐的首要目标。同理,从教育领域来看,这种文化依然能够显示出其弊端的一面。在整个工业大环境下,教育的发展主要是为了培养传统的工业人才,指在为某个特定领域输送专业化人才。由于社会岗位本身对人才的界定,就只是需要专业化的人才,所以人们只需要熟练地掌握某项独立的技能,便可获得很好的报酬。因此,这种文化本身就是鼓励人才的专业化发展。显然,传统的工业已不能适应智能时代,工业文化与智能文化的冲突在社会上开始形成。如今,在人们的思维领域,依然存在两种文化的激烈冲突。特别是在我国工业化与智能化互补发展的大环境下,传统的文化模式塑造的工业人才,不再适应智能时代的发展需要。


    二、创新教育：智能时代万众创新的培养


    创新教育是指为了培养人的创新性思维、创新能力、创新精神与创新人格而进行的教育活动。创新教育的核心和关键,是要培养教育对象的创新性思维,并能在新的思维方式的指引下塑造创新能力,在创新实践中锻造创新精神,进而形成“乐于创新、敢于创新、善于创新”的创新人格。


    人工智能时代是一个技术大综合的时代,技术融合与技术跨界是革新传统技术的主要方式,技术的应用与技术的发展呈现数据化、智能化趋势,各项技术的发展不再是本身的独立前进,而是在整个技术空间协同前行。可见,相较于传统,智能时代的创新教育需要紧密围绕信息化、数据化、智慧化与智能化进行才具有时代价值与现实指导意义。


    (一)实施创新教育的必要性


    社会各界的竞争,归根结底是创新人才的竞争。“得创新人才者,竞争得以胜”这句话从侧面充分体现了创新的价值与意义,实施创新教育关系国家、社会、企业与个人的前途和命运。


    对于国家而言,实施创新教育,一方面有助于在一个国家铸造创新文化,营造整体的创新氛围,鼓励更多的人投身创新行动,提升整体的国民创新素质;另一方面,有利于建设创新型国家。2016年6月,中共中央国务院印发《国家创新驱动发展战略纲要》,在《纲要》中指出,“创新驱动是国家命运所系。国家力量的核心支撑是科技创新能力。创新强则国运昌,创新弱则国运殆。我国近代落后挨打的重要原因是与历次科技革命失之交臂,导致科技弱、国力弱。实现中华民族伟大复兴的中国梦,必须真正用好科学技术这个最高意义上的革命力量和有力杠杆。”由此可见,创新教育担负国家的前途和命运,担负一个民族的科技创新重担,更是建设创新型国家的重大举措。


    创新教育是企业生存的根本。“人无我有、人有我优、人优我特”,这其中反映企业创新的表述虽然通俗,但道理非常深刻。对于企业而言,通过创新路径研发出市场上没有的商品,是企业抢占市场最有效的途径。对于各家企业都在经营的产品,企业需要做的就是在产品的性能上、结构上、外观上进行创新,创造出价值更高的产品,才能更受市场欢迎。所以,在企业中开展创新教育意义重大,这是企业培养创新人才、留住创新人才的关键,并且直接关系到企业的市场份额与未来前途。一个止步不前的企业,一个不谋求创新的企业,没有谁相信它能够恒久屹立而不倒。


    创新教育是教育的重要内容。教育是有目的的培养人的活动,它关系教育对象的生存与发展。但在当今时代,创新已成为国家、企业与个人竞争的关键要素,在国家层面需要创新人才,在企业层面需要创新人才,就个人的发展来看,唯有接受创新教育,才能更好地适应充满激烈竞争的社会生活。


    因此,无论是家庭教育、学校教育还是社会教育,都应该教会学生树立创新的理念,培养创新型人格,积极主动地从新视角看待问题、解决问题。从技术的视角来看,人类的整个发展历史,就是生存与淘汰的历史。特别是在智能时代,技术与人文的冲突异常激烈,人与人之间的淘汰、人与机器之间的淘汰呈现“双重叠加”的发展趋势,不具备创新思维与创新能力的人,不仅会被他人替代,还会面临被机器替代的危险。因此,创新教育应该成为当今教育的重要内容,各级各类教育都应该围绕创新教育而展开,以切实提升教育对象的创新能力和创新水平。


    (二)智能时代的创新教育新视角


    智能时代的创新教育,关涉国家、社会、企业与个人等不同主体的创新活动与创新实践,是国家与地方各个教育机构共同努力的结果,也是基于人才培养、基础设施建设与国家顶层规划设计的结果。


    创新教育是智能时代人才培养的重要突破口。新华网从教育部获悉报道,截至2019年10月,全国各大高校专门从事创新教育的教师已经超过11万人。其中,专职从事创新创业教育的教师有2.8万人,兼职担任创新创业教育教师的有9.3万。这说明,目前我国的创新教育已经具备一定的师资基础。创新教育的存在不仅要使教育对象成为创新人才,而且也是锻造教育者走向创新之路的重要推动力。教育者与教育对象的良性互动将构成创新教育活动与创新教育实践中最活跃的因素。


    但是,就创新教育的总体发展而言,师资缺口依然较大,这是由中国现存的整个教育领域的师资供需矛盾决定的。创新教育的师资匮乏主要表现在东西部人才队伍不均衡,发达地区的创新教育人才大量集结,偏远、落后地区的创新教育人才流失,国家创新人才总体规模较小等。因此,开展创新教育,应该加大力度促进创新教育师资队伍建设与培养,在创新教育领域打造一支铁军,成为创新教育急先锋,引领创新教育的时代潮流。


    创新教育,培养创新人才是第一要务。没有创新人才队伍的支撑,创新教育将成为无源之水,关于创新教育的实践也就无从谈起。但是,人工智能时代,既然已经谈及创新教育人才队伍建设,我们就应该继续深入探讨创新教育的社会实践与应用,以便于为后继创新教育的可持续发展铺平道路。


    智能时代,社会各领域的深度智能化发展给予创新教育的实践以重要方向。因此,当下的创新教育多是与互联网、大数据和人工智能技术密切相关。例如,天津人工智能创新教育先行先试,开创了属于地区的人工智能创新教育发展模式——校企合作。2019年5月16日,天津市河东区创新教育实验室落地天津市第七中学,为天津市河东区探索人工智能创新教育积累了成功经验。本次校企合作的创新教育模式主要通过创新教育内容、改善创新教育环境、改进创新教育的课程,以人工智能技术为创新教育的主攻方向,满足学生对人工智能技术的探索需求。


    人工智能技术,对于如今的中小学生而言,似乎是一项“可望而不可及”的技术,学生对其保持着高度的敏感性。中小学生的敏感性主要源于人工智能技术热潮的社会化与神秘化。就这项技术本身而言,80后、90后对这项技术赞不绝口,但学习之路却是步履维艰,原因在于这两代人并非“智能原住民”,而只是“智能移民”。从心理上讲,这个阶段的学生,好奇心最强,接受新生事物的能力也是最强的,而且学生本身有一种强烈的渴望,渴望超越祖辈与父辈,成为独树一帜的时代新人。为此,他们对于人工智能技术的探索需求非常强烈。


    基于此,中小学的人工智能创新教育开始发展。2019年3月,首届国际中学生人工智能交流展示会在北京成功举办。本次会议主要围绕中学生的人工智能基础教育而展开,旨在通过交流展示会的形式向全社会传达中学生人工智能创新教育的热情,以及探讨具体的实践路径。该交流展示会议涉及多个学科(如计算机科学、信息科学、工程学、数学与人工智能等)与多项人工智能技术(如人脸识别、人类异常行为检测、无人驾驶、环境监测等技术)。本次会议还为中学生提供了一个创新平台,不仅肯定他们的创新成果,而且还集结大批创新教育的专家学者给予实践指导,这对于提升学生的整体创新能力,帮助学生获得创新成就感与创新价值感具有重大现实意义。


    中小学生一代,是未来创新教育的领航人,作为“智能原住民”的他们,以智能为思考问题的思维基础,势必将大大提升学生的社会适应能力和综合创新能力。从想法到实践的落地,从信息时代到智能时代的转化,中学生的人工智能创新教育如火如荼,这是智能时代的必然要求。2018年6月,由华东师范大学、商汤科技与知名教师共同编著的AI教材《人工智能基础(高中版)》的出版发行产生了一定的影响。随着该教材社会影响力的不断增强,越来越多的中小学校开始以此为教学材料开设人工智能教育的课程。截至目前,全国已有40多所中学成为该教材的教育实验基地,充分显示了智能创新教育的实践吸引力,也间接地告诉国人,如今的智能创新教育已经成为专业的教育形态,不只是说说而已。


    综上而言,学校的创新教育不仅要重视培养人本身的创新品质,还要引导学生认识新兴技术,培养创新的基础理论功底,以便于学生能够积极拿起新时代的技术武器,去重新探索这个世界,从而提升整体的创新能力。


    不同的领域,创新教育的实践方式存在差异。就社会层面而言,创新教育的实践模式又将别开生面,以一种全新的形态展现出来。


    2019年全国“两会”期间,习近平总书记在参加福建代表团审议会议时强调：“要营造有利于创新创业创造的良好发展环境。要向改革开放要动力,最大限度释放全社会创新创业创造动能,不断增强我国在世界大变局中的影响力、竞争力。”激发社会创新活力,企业最先站出来开展创新教育实践。


    2019年7月,阿里巴巴GET数字经济创新创业大赛总决赛在贵州大学开幕,决赛就创新项目的优势价值、市场前景、商业模式与融资规划进行评比,加强了企业引领下的学校创新教育的实践导向,突出创新教育实践的社会影响力。企业创新教育实践,落地形式多种多样,掌门教育开启了创新教育落地新形势。作为强势的国内辅导机构,由“清、北、复、交、浙”^([\[4\]](#txt009.html#footnote_content_txt009_4))联合创办的掌门教育于2019年9月成为目前国内唯一一家受邀的“5G+教育”在线企业,与华为、中国移动等大型知名企业共同进驻中国首个“5G全球创新港”。据悉,该创新港坐落于中国上海,旨在面向国内和国际两个市场,推出新时代的5G创新产品。掌门教育的进驻,必然有利于推动创新教育与新兴5G技术的融合,成就创新教育的5G时代。


    “5G+创新教育”,标志着创新教育的发展走向深度技术融合的新时代。随着5G技术的不断发展,以及AR、VR、MR等技术的商业应用的不断成熟,由平安科技有限公司引领的创新教育——5G技术与AR技术同时得到关注,“5G+AR+创新教育”模式诞生。人工智能时代,创新教育主要是通过慕课、网络公开课、面对面视频互动等形式进行,传统4G网络技术的数据传输速度慢、高延时性、传输质量不佳等问题,限制了它的高质量发展,很是影响创新教育的质量。然而,5G技术恰好解决了4G创新教育过程中存在的不足,为创新教育的发展注入了新鲜活力。


    从整体上来说,“5G+AR+创新教育”的模式,旨在从教育对象的数据获取效率与质量上着手,再结合AR体验技术,给创新教育对象呈现出更高清晰度、更高教育体验度的极致体验,从而保证了基于智能传输的创新教育视频的共享与普及,创新教育的沉浸式体验由此而生。平安科技试行的“5G+AR+创新教育”的模式最终在与中央电化教育馆资源开发部的紧密合作下,推出了中央电化教育馆教育教学综合应用系统虚拟现实平台——平安科技K12VR教育云,从整体上改善了创新教育的教师教学互动模式、多人在线教育模式和课程内容呈现方式,深度解决传统创新教育的现实痛点,深得创新教育对象的青睐。因此,平安科技“5G+AR+创新教育”的模式正渗透到学校创新教育与家庭创新教育中去。


    人工智能时代创新教育的校企合作模式与“5G+AR+创新教育”模式仅代表创新教育的部分典型,关于创新教育与新兴技术的结合,还有无数种可能有待挖掘。


    人工智能时代,智能机器与人类的矛盾逐渐激化,人类只有谋求创新,在情感、思维与精神领域寻求独立,人类才能与机器保持一种和谐共存的状态。所以,人工智能时代的创新教育,不会止步不前,而是会继续向前发展,势不可挡。因此,应该对未来创新教育的发展进行一个整体规划,不仅要规范新兴技术在创新教育领域的应用,还要审视创新教育的时代价值与意义。不能将创新教育变成“为创新而创新”的空想教育,而是应该在党的创新教育思想的指引下,在科学的创新教育规划的帮助下,引导人们完善终身学习机制,强基固本,深化基础创新教育改革,提高人们的整体创新水平。


    三、创客教育：智能时代万千创客的成长


    与创新创业教育相关联,创客教育也是新时代必须高度关注的问题。谈及创客教育,不得不提及20世纪的朋克文化与反消费主义文化,以及与之密切相关的DIY文化。


    (一)创客教育诞生的文化背景


    20世纪70年代,美国音乐界掀起一阵朋克文化狂潮,在朋克文化的诉求中,将批判传统音乐文化,追求时尚与新文化作为旨归,直接或间接地反映了当时社会发展的现实状况,以及人们对主流文化的赤裸裸的抨击和挑衅,实则是人们对社会现实强烈不满的一种文化发泄方式。但无论如何,朋克文化的出现将美国内外部社会矛盾进行文化层面的调和,带动了整个国家和社会的新一轮转型。


    与此同时,诞生于20世纪20、30年代的消费主义文化盛行于世,与朋克文化交融发展。在全球工业进程逐步加快的情况下,人们逐渐从原有的物质匮乏的时代迈入物质充盈的时代,一种以物质消费和物质享受为主的消费文化成为人类文明的主流文化——消费主义文化,并导致诸多的社会问题。众多专家开始反思此种文化带来的社会危害,并引导人们理性消费,由此催生一种与消费主义文化共存的反消费主义文化。反消费主义文化,主张人们在消费的过程中注重消费的理性,唾弃购物带来的身心愉悦之感,购物应以实用为导向。在20世纪90年代,由加拿大Adbusters杂志提倡发起的国际罢买日(International
    Buy Nothing Day,每年11月的最后一个星期五/六),成为反消费主义文化的重要组成部分,它在告知世人适度消费的价值与意义。


    从本质上讲,无论是朋克文化还是反消费主义文化,在当时的时代背景下都是一种新文化。之所以被认为是那个时代的亚文化或是非主流文化,主要是因为它与当时的工业正统文化存在较大的冲突和抵抗。正是因为社会正统的工业文化带来的社会阵痛,人们以“失去自我”和“沦为单向度”为代价,换来了社会的集体觉醒,人们开始谋求一种以个体生命价值与尊严为主导的新文化,以期从中找到自由与自主的存在。所以,朋克文化与反消费主义文化的糅合与交融,铸造了如今比较盛行的美国DIY文化。


    DIY,是DO IT YOUSELF的简称,意思是自己能做的事情就自己做,这种文化宣扬人们应该自己解决自己的问题。“我会了,我自己来”“不用帮我,我能行”“这个事情我能解决”等,成为DIY文化在现实中的表现形式。


    DIY文化是一种自立文化,鼓励人们自己动手、动脑解决自己的生存问题与发展问题。正是如此,DIY文化迎合了时代的要求,在这个极具竞争的时代,人们更应该以积极的心态谋求自身的改变,而不是将自身的希望寄托于他人之上。而这种转变,在不同的时代背景下又主要表现为创新文化与创造文化,要求人们要以新的视角、新的思维方式、新的问题解决模式去应对复杂的外部环境。所以,DIY文化最终演变为创客文化,在创客文化熏陶下的人们,酷爱科技、热衷实践,并且坚信幸福生活源于实践。


    大数据和人工智能时代,创客文化日渐发展成熟,并从局部地区向全球普及。结合如今智能技术时代背景,通俗地讲,创客教育就是“创客文化+教育”。


    (二)创客教育的本质与优势


    鉴于人们对创客教育仍然保持“熟悉而又陌生”的感觉,在探讨创新教育的具体实践之前,有必要具体看一下创客教育的概念与特征。关于创客教育的概念,不同的学者给出不同的解释方式,仁者见仁,智者见智。'
  fmt: '

    # 创新性思维、创新教育与创客教育在智能时代的发展


    ## 一、创新性思维的限制因素


    创新性思维是在外部环境与内部条件双重作用下的结果，必然会受到多种因素的影响，甚至是限制和制约。历史地看，创新性思维的每一次时代性的呈现，都无不反映外部环境对创新性思维的影响，也显示出生活在一个时代的人们的整体创新水平，以及创新文化对创新性思维的形成的人文塑造。


    人工智能时代，是一个极具创新文化色彩的技术化时代。但创新性思维依然不可能完全摆脱枷锁，这是与创新性思维的时代性、民族性和社会性密切相关的。我国的创新文化，有着悠久的历史底蕴，“四大发明”成就了中国古代创新的文化自信，向世界显示国人过人的创新智慧。虽然如此，生活在人工智能时代的我们依然被很多因素限制，使创新性思维的发展受到威胁和挑战，如应试教育、思维与思维定式、传统观念与传统文化、工业文化的后遗症等，都会影响人们创新性思维的形成。


    ### 应试教育对创新性思维的限制


    在应试教育的实施过程中，局限与优势并存。但若论应试教育对创新性思维的影响，负向的评价在所有观点中是占主导地位的。就应试教育本身而言，其发展过程中主要重视的是学生的智育，轻视德育、体育、美育与劳育，造成学生发展的后天不足。在整个应试教育的实施过程中，片面重视考试分数与考试成绩，学生的求学过程成为分数比拼的过程，加重学生的学习负担，阻碍学生学习的积极性与主动性。应试教育还只注重教育的选拔功能，很容易导致教育的精英化发展。少数学生成为教师关注的重点对象，其他学生则任其随意发展。就此而言，应试教育的存在对于人才的长远发展有较大的局限性，学生所接受的多是灌输式的教育，学生的好奇心、想象力、批判性思维等，都被长期禁锢起来，严重束缚了学生创新性思维的形成。


    ### 思维与思维定式对创新性思维的限制


    思维定式，也称“惯性思维”，是由先前的活动而造成的一种对活动的特殊的心理准备状态，或活动的倾向性。情境不变的条件下，思维定式使人能够应用已掌握的方法迅速解决问题；但在情境发生变化时，则会妨碍人采用新的方法。消极的思维定式是束缚创造性思维的枷锁^[\[3\]](#txt009.html#footnote_content_txt009_3)。思维定式，对于已经历过的问题解决较为有效。过去，中国主要处于农业文化与工业文化中，在技术领域，人们主要通过经验的方式传递技术，人才的培养成为上一代人才的当代延续。这种经验思维，本身就是一种思维定式，只要发生新的场景，人们就很难适应，需要重新拜师学艺。要想利用这种思维来解决创造性的问题，则比较困难。在这种经验思维限制下，人们的思维与决策都是一种固定的反应倾向，始终跳不出传统的框架或者固定的思维路径。


    ### 传统观念与传统文化对创新性思维的限制


    传统观念与传统文化对创新性思维的限制是根深蒂固的。传统观念和传统文化分为两大类：一类是先进的文化，另一类是落后的文化。比如，在洋务运动中表现出来的守旧观念与文化，他们认为老祖宗留下来的东西，后人是不能对其进行更改的，人们需要做的就是“遵守”。所以，洋务运动最终走向失败。再比如，清朝末年，朝廷为了不破坏皇陵风水，选择用马来拉轨道上的火车，成为世界的笑柄。可见，传统的观念与文化对新事物的态度是否定的，而创新性思维却是追逐创造与革新，两者显然不同。由此可见，现存的传统文化与传统观念，势必会限制人们进行创造活动与创新性思维。


    ### 工业文化的后遗症对创新性思维的限制


    工业文化的后遗症，是指自工业革命以来，在社会上形成的一种商业化、标准化与理性化的文化环境。从经济学角度看，工业文化是一种功利主义文化，该文化起源于社会对经济规模与经济利益的极度奢求，在整个文化的发展过程中，速度与规模成为人们追逐的首要目标。同理，从教育领域来看，这种文化依然能够显示出其弊端的一面。在整个工业大环境下，教育的发展主要是为了培养传统的工业人才，指在为某个特定领域输送专业化人才。由于社会岗位本身对人才的界定，就只是需要专业化的人才，所以人们只需要熟练地掌握某项独立的技能，便可获得很好的报酬。因此，这种文化本身就是鼓励人才的专业化发展。显然，传统的工业已不能适应智能时代，工业文化与智能文化的冲突在社会上开始形成。如今，在人们的思维领域，依然存在两种文化的激烈冲突。特别是在我国工业化与智能化互补发展的大环境下，传统的文化模式塑造的工业人才，不再适应智能时代的发展需要。


    ## 二、创新教育：智能时代万众创新的培养


    创新教育是指为了培养人的创新性思维、创新能力、创新精神与创新人格而进行的教育活动。创新教育的核心和关键，是要培养教育对象的创新性思维，并能在新的思维方式的指引下塑造创新能力，在创新实践中锻造创新精神，进而形成“乐于创新、敢于创新、善于创新”的创新人格。


    人工智能时代是一个技术大综合的时代，技术融合与技术跨界是革新传统技术的主要方式，技术的应用与技术的发展呈现数据化、智能化趋势，各项技术的发展不再是本身的独立前进，而是在整个技术空间协同前行。可见，相较于传统，智能时代的创新教育需要紧密围绕信息化、数据化、智慧化与智能化进行才具有时代价值与现实指导意义。


    ### （一）实施创新教育的必要性


    社会各界的竞争，归根结底是创新人才的竞争。“得创新人才者，竞争得以胜”这句话从侧面充分体现了创新的价值与意义，实施创新教育关系国家、社会、企业与个人的前途和命运。


    **对于国家而言**，实施创新教育，一方面有助于在一个国家铸造创新文化，营造整体的创新氛围，鼓励更多的人投身创新行动，提升整体的国民创新素质；另一方面，有利于建设创新型国家。2016年6月，中共中央国务院印发《国家创新驱动发展战略纲要》，在《纲要》中指出：“创新驱动是国家命运所系。国家力量的核心支撑是科技创新能力。创新强则国运昌，创新弱则国运殆。我国近代落后挨打的重要原因是与历次科技革命失之交臂，导致科技弱、国力弱。实现中华民族伟大复兴的中国梦，必须真正用好科学技术这个最高意义上的革命力量和有力杠杆。”由此可见，创新教育担负国家的前途和命运，担负一个民族的科技创新重担，更是建设创新型国家的重大举措。


    **创新教育是企业生存的根本**。“人无我有、人有我优、人优我特”，这其中反映企业创新的表述虽然通俗，但道理非常深刻。对于企业而言，通过创新路径研发出市场上没有的商品，是企业抢占市场最有效的途径。对于各家企业都在经营的产品，企业需要做的就是在产品的性能上、结构上、外观上进行创新，创造出价值更高的产品，才能更受市场欢迎。所以，在企业中开展创新教育意义重大，这是企业培养创新人才、留住创新人才的关键，并且直接关系到企业的市场份额与未来前途。一个止步不前的企业，一个不谋求创新的企业，没有谁相信它能够恒久屹立而不倒。


    **创新教育是教育的重要内容**。教育是有目的的培养人的活动，它关系教育对象的生存与发展。但在当今时代，创新已成为国家、企业与个人竞争的关键要素，在国家层面需要创新人才，在企业层面需要创新人才，就个人的发展来看，唯有接受创新教育，才能更好地适应充满激烈竞争的社会生活。


    因此，无论是家庭教育、学校教育还是社会教育，都应该教会学生树立创新的理念，培养创新型人格，积极主动地从新视角看待问题、解决问题。从技术的视角来看，人类的整个发展历史，就是生存与淘汰的历史。特别是在智能时代，技术与人文的冲突异常激烈，人与人之间的淘汰、人与机器之间的淘汰呈现“双重叠加”的发展趋势，不具备创新思维与创新能力的人，不仅会被他人替代，还会面临被机器替代的危险。因此，创新教育应该成为当今教育的重要内容，各级各类教育都应该围绕创新教育而展开，以切实提升教育对象的创新能力和创新水平。


    ### （二）智能时代的创新教育新视角


    智能时代的创新教育，关涉国家、社会、企业与个人等不同主体的创新活动与创新实践，是国家与地方各个教育机构共同努力的结果，也是基于人才培养、基础设施建设与国家顶层规划设计的结果。


    **创新教育是智能时代人才培养的重要突破口**。新华网从教育部获悉报道，截至2019年10月，全国各大高校专门从事创新教育的教师已经超过11万人。其中，专职从事创新创业教育的教师有2.8万人，兼职担任创新创业教育教师的有9.3万。这说明，目前我国的创新教育已经具备一定的师资基础。创新教育的存在不仅要使教育对象成为创新人才，而且也是锻造教育者走向创新之路的重要推动力。教育者与教育对象的良性互动将构成创新教育活动与创新教育实践中最活跃的因素。


    但是，就创新教育的总体发展而言，师资缺口依然较大，这是由中国现存的整个教育领域的师资供需矛盾决定的。创新教育的师资匮乏主要表现在东西部人才队伍不均衡，发达地区的创新教育人才大量集结，偏远、落后地区的创新教育人才流失，国家创新人才总体规模较小等。因此，开展创新教育，应该加大力度促进创新教育师资队伍建设与培养，在创新教育领域打造一支铁军，成为创新教育急先锋，引领创新教育的时代潮流。


    **创新教育，培养创新人才是第一要务**。没有创新人才队伍的支撑，创新教育将成为无源之水，关于创新教育的实践也就无从谈起。但是，人工智能时代，既然已经谈及创新教育人才队伍建设，我们就应该继续深入探讨创新教育的社会实践与应用，以便于为后继创新教育的可持续发展铺平道路。


    智能时代，社会各领域的深度智能化发展给予创新教育的实践以重要方向。因此，当下的创新教育多是与互联网、大数据和人工智能技术密切相关。例如，`天津人工智能创新教育先行先试`，开创了属于地区的人工智能创新教育发展模式——`校企合作`。2019年5月16日，`天津市河东区创新教育实验室`落地`天津市第七中学`，为天津市河东区探索人工智能创新教育积累了成功经验。本次`校企合作`的创新教育模式主要通过创新教育内容、改善创新教育环境、改进创新教育的课程，以人工智能技术为创新教育的主攻方向，满足学生对人工智能技术的探索需求。


    人工智能技术，对于如今的中小学生而言，似乎是一项“可望而不可及”的技术，学生对其保持着高度的敏感性。中小学生的敏感性主要源于人工智能技术热潮的社会化与神秘化。就这项技术本身而言，80后、90后对这项技术赞不绝口，但学习之路却是步履维艰，原因在于这两代人并非“智能原住民”，而只是“智能移民”。从心理上讲，这个阶段的学生，好奇心最强，接受新生事物的能力也是最强的，而且学生本身有一种强烈的渴望，渴望超越祖辈与父辈，成为独树一帜的时代新人。为此，他们对于人工智能技术的探索需求非常强烈。


    基于此，中小学的人工智能创新教育开始发展。2019年3月，`首届国际中学生人工智能交流展示会`在北京成功举办。本次会议主要围绕中学生的人工智能基础教育而展开，旨在通过交流展示会的形式向全社会传达中学生人工智能创新教育的热情，以及探讨具体的实践路径。该交流展示会议涉及多个学科（如计算机科学、信息科学、工程学、数学与人工智能等）与多项人工智能技术（如`人脸识别`、`人类异常行为检测`、`无人驾驶`、`环境监测`等技术）。本次会议还为中学生提供了一个创新平台，不仅肯定他们的创新成果，而且还集结大批创新教育的专家学者给予实践指导，这对于提升学生的整体创新能力，帮助学生获得创新成就感与创新价值感具有重大现实意义。


    中小学生一代，是未来创新教育的领航人，作为“智能原住民”的他们，以智能为思考问题的思维基础，势必将大大提升学生的社会适应能力和综合创新能力。从想法到实践的落地，从信息时代到智能时代的转化，中学生的人工智能创新教育如火如荼，这是智能时代的必然要求。2018年6月，由`华东师范大学`、`商汤科技`与知名教师共同编著的`AI教材《人工智能基础(高中版)》`的出版发行产生了一定的影响。随着该教材社会影响力的不断增强，越来越多的中小学校开始以此为教学材料开设人工智能教育的课程。截至目前，全国已有40多所中学成为该教材的教育实验基地，充分显示了智能创新教育的实践吸引力，也间接地告诉国人，如今的智能创新教育已经成为专业的教育形态，不只是说说而已。


    综上而言，学校的创新教育不仅要重视培养人本身的创新品质，还要引导学生认识新兴技术，培养创新的基础理论功底，以便于学生能够积极拿起新时代的技术武器，去重新探索这个世界，从而提升整体的创新能力。


    不同的领域，创新教育的实践方式存在差异。就社会层面而言，创新教育的实践模式又将别开生面，以一种全新的形态展现出来。


    2019年全国“两会”期间，习近平总书记在参加福建代表团审议会议时强调：“要营造有利于创新创业创造的良好发展环境。要向改革开放要动力，最大限度释放全社会创新创业创造动能，不断增强我国在世界大变局中的影响力、竞争力。”激发社会创新活力，企业最先站出来开展创新教育实践。


    2019年7月，`阿里巴巴GET数字经济创新创业大赛总决赛`在`贵州大学`开幕，决赛就创新项目的优势价值、市场前景、商业模式与融资规划进行评比，加强了企业引领下的学校创新教育的实践导向，突出创新教育实践的社会影响力。企业创新教育实践，落地形式多种多样，`掌门教育`开启了创新教育落地新形势。作为强势的国内辅导机构，由“清、北、复、交、浙”^[\[4\]](#txt009.html#footnote_content_txt009_4)联合创办的`掌门教育`于2019年9月成为目前国内唯一一家受邀的“`5G+教育`”在线企业，与`华为`、`中国移动`等大型知名企业共同进驻中国首个“`5G全球创新港`”。据悉，该创新港坐落于中国上海，旨在面向国内和国际两个市场，推出新时代的`5G创新产品`。`掌门教育`的进驻，必然有利于推动创新教育与新兴`5G技术`的融合，成就创新教育的`5G时代`。


    “`5G+创新教育`”，标志着创新教育的发展走向深度技术融合的新时代。随着`5G技术`的不断发展，以及`AR`、`VR`、`MR`等技术的商业应用的不断成熟，由`平安科技有限公司`引领的创新教育——`5G技术`与`AR技术`同时得到关注，“`5G+AR+创新教育`”模式诞生。人工智能时代，创新教育主要是通过`慕课`、`网络公开课`、`面对面视频互动`等形式进行，传统`4G网络技术`的数据传输速度慢、高延时性、传输质量不佳等问题，限制了它的高质量发展，很是影响创新教育的质量。然而，`5G技术`恰好解决了`4G`创新教育过程中存在的不足，为创新教育的发展注入了新鲜活力。


    从整体上来说，“`5G+AR+创新教育`”的模式，旨在从教育对象的数据获取效率与质量上着手，再结合`AR体验技术`，给创新教育对象呈现出更高清晰度、更高教育体验度的极致体验，从而保证了基于智能传输的创新教育视频的共享与普及，创新教育的沉浸式体验由此而生。`平安科技`试行的“`5G+AR+创新教育`”的模式最终在与`中央电化教育馆资源开发部`的紧密合作下，推出了`中央电化教育馆教育教学综合应用系统虚拟现实平台——平安科技K12VR教育云`，从整体上改善了创新教育的教师教学互动模式、多人在线教育模式和课程内容呈现方式，深度解决传统创新教育的现实痛点，深得创新教育对象的青睐。因此，`平安科技`“`5G+AR+创新教育`”的模式正渗透到学校创新教育与家庭创新教育中去。


    人工智能时代创新教育的`校企合作`模式与“`5G+AR+创新教育`”模式仅代表创新教育的部分典型，关于创新教育与新兴技术的结合，还有无数种可能有待挖掘。


    人工智能时代，智能机器与人类的矛盾逐渐激化，人类只有谋求创新，在情感、思维与精神领域寻求独立，人类才能与机器保持一种和谐共存的状态。所以，人工智能时代的创新教育，不会止步不前，而是会继续向前发展，势不可挡。因此，应该对未来创新教育的发展进行一个整体规划，不仅要规范新兴技术在创新教育领域的应用，还要审视创新教育的时代价值与意义。不能将创新教育变成“为创新而创新”的空想教育，而是应该在党的创新教育思想的指引下，在科学的创新教育规划的帮助下，引导人们完善终身学习机制，强基固本，深化基础创新教育改革，提高人们的整体创新水平。


    ## 三、创客教育：智能时代万千创客的成长


    与创新创业教育相关联，创客教育也是新时代必须高度关注的问题。谈及创客教育，不得不提及20世纪的朋克文化与反消费主义文化，以及与之密切相关的`DIY文化`。


    ### （一）创客教育诞生的文化背景


    20世纪70年代，美国音乐界掀起一阵朋克文化狂潮，在朋克文化的诉求中，将批判传统音乐文化，追求时尚与新文化作为旨归，直接或间接地反映了当时社会发展的现实状况，以及人们对主流文化的赤裸裸的抨击和挑衅，实则是人们对社会现实强烈不满的一种文化发泄方式。但无论如何，朋克文化的出现将美国内外部社会矛盾进行文化层面的调和，带动了整个国家和社会的新一轮转型。


    与此同时，诞生于20世纪20、30年代的消费主义文化盛行于世，与朋克文化交融发展。在全球工业进程逐步加快的情况下，人们逐渐从原有的物质匮乏的时代迈入物质充盈的时代，一种以物质消费和物质享受为主的消费文化成为人类文明的主流文化——消费主义文化，并导致诸多的社会问题。众多专家开始反思此种文化带来的社会危害，并引导人们理性消费，由此催生一种与消费主义文化共存的反消费主义文化。反消费主义文化，主张人们在消费的过程中注重消费的理性，唾弃购物带来的身心愉悦之感，购物应以实用为导向。在20世纪90年代，由加拿大`Adbusters杂志`提倡发起的`国际罢买日`（`International
    Buy Nothing Day`，每年11月的最后一个星期五/六），成为反消费主义文化的重要组成部分，它在告知世人适度消费的价值与意义。


    从本质上讲，无论是朋克文化还是反消费主义文化，在当时的时代背景下都是一种新文化。之所以被认为是那个时代的亚文化或是非主流文化，主要是因为它与当时的工业正统文化存在较大的冲突和抵抗。正是因为社会正统的工业文化带来的社会阵痛，人们以“失去自我”和“沦为单向度”为代价，换来了社会的集体觉醒，人们开始谋求一种以个体生命价值与尊严为主导的新文化，以期从中找到自由与自主的存在。所以，朋克文化与反消费主义文化的糅合与交融，铸造了如今比较盛行的美国`DIY文化`。


    `DIY`，是`DO IT YOURSELF`的简称，意思是自己能做的事情就自己做，这种文化宣扬人们应该自己解决自己的问题。“我会了，我自己来”“不用帮我，我能行”“这个事情我能解决”等，成为`DIY文化`在现实中的表现形式。


    `DIY文化`是一种自立文化，鼓励人们自己动手、动脑解决自己的生存问题与发展问题。正是如此，`DIY文化`迎合了时代的要求，在这个极具竞争的时代，人们更应该以积极的心态谋求自身的改变，而不是将自身的希望寄托于他人之上。而这种转变，在不同的时代背景下又主要表现为创新文化与创造文化，要求人们要以新的视角、新的思维方式、新的问题解决模式去应对复杂的外部环境。所以，`DIY文化`最终演变为创客文化，在创客文化熏陶下的人们，酷爱科技、热衷实践，并且坚信幸福生活源于实践。


    大数据和人工智能时代，创客文化日渐发展成熟，并从局部地区向全球普及。结合如今智能技术时代背景，通俗地讲，创客教育就是“`创客文化+教育`”。


    ### （二）创客教育的本质与优势


    鉴于人们对创客教育仍然保持“熟悉而又陌生”的感觉，在探讨创新教育的具体实践之前，有必要具体看一下创客教育的概念与特征。关于创客教育的概念，不同的学者给出不同的解释方式，仁者见仁，智者见智。

