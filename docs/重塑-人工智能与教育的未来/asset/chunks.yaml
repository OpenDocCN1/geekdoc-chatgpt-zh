    # Development of Innovative Thinking, Innovation Education, and Maker Education
    in the Intelligent Era


    ## I. Restrictive Factors of Innovative Thinking


    Innovative tendency, always unable to jump out of traditional frameworks or fixed
    thinking paths.


    ### Restrictions of Traditional Concepts and Culture on Innovative Thinking


    The restrictions of traditional concepts and culture on innovative thinking are
    deep-rooted. Traditional concepts and culture are divided into two categories:
    one is advanced culture, the other is backward culture. For example, the conservative
    concepts and culture manifested in the Westernization Movement; they believed
    that things left by ancestors could not be changed by descendants, and what people
    needed to do was "obey." Therefore, the Westernization Movement ultimately failed.
    Another example: in the late Qing Dynasty, the court chose to use horses to pull
    trains on tracks to avoid damaging the feng shui of the imperial tombs, becoming
    a laughingstock to the world. It can be seen that traditional concepts and culture
    hold a negative attitude towards new things, while innovative thinking pursues
    creation and innovation; the two are obviously different. Thus, existing traditional
    culture and concepts will inevitably restrict people''s creative activities and
    innovative thinking.


    ### Restrictions of Industrial Culture''s Sequelae on Innovative Thinking


    The sequelae of industrial culture refer to a cultural environment of commercialization,
    standardization, and rationalization formed in society since the Industrial Revolution.
    From an economic perspective, industrial culture is a utilitarian culture, originating
    from society''s excessive pursuit of economic scale and profit; in the entire
    cultural development process, speed and scale become the primary goals people
    pursue. Similarly, from the education field, this culture still shows its drawbacks.
    In the overall industrial environment, education development is mainly to cultivate
    traditional industrial talents, i.e., to deliver specialized talents for specific
    fields. Because social positions themselves define talents as only needing specialized
    talents, people only need to master a specific independent skill proficiently
    to obtain good remuneration. Therefore, this culture itself encourages the specialized
    development of talents. Obviously, traditional industry can no longer adapt to
    the intelligent era, and conflicts between industrial culture and intelligent
    culture have begun to form in society. Today, in the realm of people''s thinking,
    there still exists fierce conflict between these two cultures. Especially in the
    context of China''s complementary development of industrialization and intelligentization,
    industrial talents shaped by traditional cultural models no longer meet the development
    needs of the intelligent era.


    ## II. Innovation Education: Cultivating Mass Innovation in the Intelligent Era


    Innovation education refers to educational activities aimed at cultivating people''s
    innovative thinking, innovation ability, innovation spirit, and innovation personality.
    The core and key of innovation education is to cultivate the innovative thinking
    of the educational objects, and to shape innovation ability under the guidance
    of new thinking modes, forge innovation spirit in innovation practice, and ultimately
    form an innovation personality of "willing to innovate, daring to innovate, and
    good at innovating."


    The AI era is an era of grand technological integration; technology fusion and
    cross-disciplinary technology are the main ways to innovate traditional technologies;
    technology application and development show trends of datafication and intelligentization;
    the development of various technologies is no longer independent advancement but
    coordinated progress in the entire technology space. Therefore, compared to tradition,
    innovation education in the intelligent era needs to closely revolve around informatization,
    datafication, wisdomization, and intelligentization to possess era value and practical
    guiding significance.


    ### (I) Necessity of Implementing Innovation Education


    Competition from all sectors of society ultimately boils down to competition for
    innovative talents. The saying "He who obtains innovative talents wins the competition"
    fully reflects the value and significance of innovation from the side; implementing
    innovation education concerns the future and destiny of the nation, society, enterprises,
    and individuals.


    **For the nation**, implementing innovation education, on the one hand, helps
    forge an innovation culture, create an overall innovation atmosphere, encourage
    more people to engage in innovation actions, and improve overall national innovation
    quality; on the other hand, it is conducive to building an innovative country.
    In June 2016, the CPC Central Committee and the State Council issued the "National
    Innovation-Driven Development Strategy Outline," which stated: "Innovation-driven
    development is the lifeline of the nation. The core support of national strength
    is scientific and technological innovation capability. If innovation is strong,
    the nation prospers; if innovation is weak, the nation declines. An important
    reason for China''s backwardness and suffering in modern times was missing successive
    technological revolutions, leading to weak science and technology and weak national
    power. To realize the Chinese Dream of the great rejuvenation of the Chinese nation,
    we must truly make good use of science and technology, this revolutionary force
    and powerful lever of the highest significance." This shows that innovation education
    bears the future and destiny of the nation, the heavy responsibility of a nation''s
    scientific and technological innovation, and is a major measure for building an
    innovative country.


    **Innovation education is the foundation of enterprise survival.** "Others don''t
    have it, I do; others have it, I excel; others excel, I am unique." Although this
    expression reflecting corporate innovation is colloquial, the reasoning is profound.
    For enterprises, developing products not on the market through innovation paths
    is the most effective way to seize the market. For products operated by all enterprises,
    what enterprises need to do is innovate in product performance, structure, and
    appearance, creating higher-value products to be more welcomed by the market.
    Therefore, carrying out innovation education in enterprises is of great significance;
    it is the key for enterprises to cultivate and retain innovative talents, and
    directly relates to the enterprise''s market share and future prospects. No one
    believes an enterprise that stagnates and does not seek innovation can stand forever.


    **Innovation education is an important content of education.** Education is a
    purposeful activity of cultivating people; it concerns the survival and development
    of the educational objects. But in today''s era, innovation has become a key element
    in the competition of nations, enterprises, and individuals; the national level
    needs innovative talents, the enterprise level needs innovative talents, and from
    the perspective of personal development, only by receiving innovation education
    can one better adapt to a social life full of fierce competition. Therefore, whether
    it is family education, school education, or social education, all should teach
    students to establish innovative concepts, cultivate innovative personalities,
    and actively view and solve problems from new perspectives. From a technological
    perspective, the entire development history of humanity is a history of survival
    and elimination. Especially in the intelligent era, the conflict between technology
    and humanities is exceptionally fierce; the elimination between people and between
    people and machines shows a "double superposition" trend; those without innovative
    thinking and ability will not only be replaced by others but also face the danger
    of being replaced by machines. Therefore, innovation education should become an
    important content of current education; all levels and types of education should
    revolve around innovation education to effectively enhance the innovation ability
    and level of educational objects.


    ### (II) New Perspectives on Innovation Education in the Intelligent Era


    Innovation education in the intelligent era concerns the innovation activities
    and practices of different subjects such as the nation, society, enterprises,
    and individuals; it is the result of joint efforts of national and local educational
    institutions, and also the result based on talent cultivation, infrastructure
    construction, and national top-level planning and design.


    **Innovation education is an important breakthrough for talent cultivation in
    the intelligent era.** Xinhua News Agency learned from the Ministry of Education
    that as of October 2019, the number of teachers in universities nationwide specifically
    engaged in innovation education has exceeded 110,000. Among them, 28,000 are full-time
    teachers engaged in innovation and entrepreneurship education, and 93,000 are
    part-time teachers. This shows that China''s innovation education currently has
    a certain faculty foundation. The existence of innovation education not only makes
    educational objects become innovative talents but is also an important driving
    force for forging educators on the path to innovation. The benign interaction
    between educators and educational objects will constitute the most active factor
    in innovation education activities and practices. However, in terms of the overall
    development of innovation education, the faculty gap is still large, which is
    determined by the current supply-demand contradiction of faculty in China''s entire
    education field. The shortage of innovation education faculty is mainly manifested
    in the unbalanced talent teams between eastern and western regions; large concentrations
    of innovation education talents in developed regions, loss of such talents in
    remote and backward regions, and a relatively small overall scale of national
    innovative talents. Therefore, to carry out innovation education, efforts should
    be increased to promote the construction and cultivation of the innovation education
    faculty team, forge an "iron army" in the field of innovation education, become
    the vanguard of innovation education, and lead the trend of the times in innovation
    education.


    **In innovation education, cultivating innovative talents is the primary task.**
    Without the support of an innovative talent team, innovation education will become
    water without a source, and the practice of innovation education cannot be discussed.
    However, in the AI era, since we have already discussed the construction of the
    innovation education talent team, we should continue to deeply explore the social
    practice and application of innovation education, so as to pave the way for the
    sustainable development of subsequent innovation education. In the intelligent
    era, the deep intelligent development of various social fields gives important
    direction to the practice of innovation education. Therefore, current innovation
    education is mostly closely related to the Internet, big data, and AI technologies.
    For example, the `Tianjin AI Innovation Education Pilot` pioneered a regional
    AI innovation education development model — `School-Enterprise Cooperation`. On
    May 16, 2019, the `Hedong District Innovation Education Laboratory, Tianjin` landed
    at `Tianjin No. 7 Middle School`, accumulating successful experience for Hedong
    District, Tianjin, in exploring AI innovation education. This `School-Enterprise
    Cooperation` innovation education model mainly innovates education content, improves
    the education environment, and improves curricula, taking AI technology as the
    main direction of innovation education to meet students'' needs for exploring
    AI technology.


    AI technology, for today''s primary and secondary school students, seems to be
    an "unattainable" technology, and students maintain a high sensitivity to it.
    Students'' sensitivity mainly stems from the socialization and mystification of
    the AI technology craze. Regarding the technology itself, the post-80s and post-90s
    generations praise it highly, but their learning path is arduous, because these
    two generations are not "intelligent natives" but only "intelligent immigrants."
    Psychologically, students at this stage have the strongest curiosity and the strongest
    ability to accept new things; moreover, students themselves have a strong desire
    to surpass their ancestors and parents and become outstanding new people of the
    era. Therefore, their demand for exploring AI technology is very strong.


    Based on this, AI innovation education in primary and secondary schools began
    to develop. In March 2019, the `First International Secondary School AI Exchange
    and Exhibition` was successfully held in Beijing. This conference mainly focused
    on AI basic education for secondary school students, aiming to convey the enthusiasm
    for secondary school AI innovation education to the whole society through the
    exchange and exhibition format, and discuss specific practical paths. The exchange
    conference involved multiple disciplines (such as Computer Science, Information
    Science, Engineering, Mathematics and AI, etc.) and multiple AI technologies (such
    as `Facial Recognition`, `Human Anomaly Behavior Detection`, `Autonomous Driving`,
    `Environmental Monitoring`, etc.). This conference also provided an innovation
    platform for secondary school students, not only affirming their innovation achievements
    but also gathering a large number of innovation education experts and scholars
    to give practical guidance, which has significant practical significance for enhancing
    students'' overall innovation ability and helping them gain a sense of innovation
    achievement and value.


    The generation of primary and secondary school students are the navigators of
    future innovation education; as "intelligent natives," they take intelligence
    as the thinking basis for problem-solving, which will inevitably greatly enhance
    students'' social adaptability and comprehensive innovation ability. From idea
    to practice implementation, from the information era to the intelligent era transformation,
    secondary school AI innovation education is in full swing; this is an inevitable
    requirement of the intelligent era. In June 2018, the publication of the `AI Textbook
    "Fundamentals of Artificial Intelligence (High School Edition)"` co-authored by
    `East China Normal University`, `SenseTime`, and renowned teachers had a certain
    impact. As the social influence of this textbook continues to grow, more and more
    primary and secondary schools have begun to use it as teaching material to offer
    AI education courses. As of now, more than 40 middle schools nationwide have become
    educational experimental bases for this textbook, fully demonstrating the practical
    attractiveness of intelligent innovation education, and indirectly telling the
    Chinese people that today''s intelligent innovation education has become a professional
    educational form, not just talk.


    In summary, school innovation education should not only focus on cultivating the
    innovative qualities of people themselves but also guide students to understand
    emerging technologies and cultivate a basic theoretical foundation for innovation,
    so that students can actively take up the technological weapons of the new era
    to re-explore the world, thereby enhancing overall innovation ability.


    Different fields have differences in the practice modes of innovation education.
    In terms of the social level, the practice mode of innovation education will also
    be novel, presenting itself in a brand-new form.


    During the 2019 National "Two Sessions," General Secretary Xi Jinping emphasized
    at the Fujian delegation review meeting: "We must foster a favorable development
    environment for innovation, entrepreneurship, and creation. We must draw momentum
    from reform and opening up, release the innovation, entrepreneurship, and creation
    dynamism of the whole society to the maximum extent, and continuously enhance
    China''s influence and competitiveness in the world''s major changes." To stimulate
    social innovation vitality, enterprises were the first to step forward to carry
    out innovation education practice.


    In July 2019, the `Alibaba GET Digital Economy Innovation and Entrepreneurship
    Competition Finals` opened at `Guizhou University`; the finals evaluated the advantage
    value, market prospects, business models, and financing plans of innovation projects,
    strengthening the practice orientation of school innovation education led by enterprises,
    and highlighting the social influence of innovation education practice. Enterprise
    innovation education practices take various landing forms; `Zhangmen Education`
    opened a new situation for the landing of innovation education. As a strong domestic
    tutoring institution, `Zhangmen Education`, jointly founded by "Tsinghua, Peking,
    Fudan, SJTU, Zhejiang"^[\[4\]](#txt009.html#footnote_content_txt009_4), became
    the only invited "`5G+Education`" online enterprise in China in September 2019,
    settling into China''s first "`5G Global Innovation Port`" alongside large well-known
    enterprises such as `Huawei` and `China Mobile`. It is reported that this innovation
    port is located in Shanghai, China, aiming to serve both domestic and international
    markets and launch new-era `5G innovative products`. `Zhangmen Education`''s settlement
    will surely promote the integration of innovation education with emerging `5G
    technology`, achieving the `5G era` of innovation education.


    "`5G+Innovation Education`" marks the development of innovation education entering
    a new era of deep technology integration. With the continuous development of `5G
    technology` and the continuous maturity of commercial applications of `AR`, `VR`,
    `MR` and other technologies, the innovation education led by `Ping An Technology
    Co., Ltd.` — `5G technology` and `AR technology` received attention simultaneously,
    and the "`5G+AR+Innovation Education`" model was born. In the AI era, innovation
    education is mainly conducted through `MOOCs`, `Online Open Courses`, `Face-to-face
    Video Interaction`, etc.; problems of traditional `4G network technology` such
    as slow data transmission speed, high latency, and poor transmission quality limited
    its high-quality development, greatly affecting the quality of innovation education.
    However, `5G technology` just solves the deficiencies in the `4G` innovation education
    process, injecting fresh vitality into the development of innovation education.


    Overall, the "`5G+AR+Innovation Education`" model aims to start from the efficiency
    and quality of data acquisition by educational objects, combined with `AR experience
    technology`, to present the ultimate experience of higher definition and higher
    educational experience to innovation education objects, thereby ensuring the sharing
    and popularization of innovation education videos based on intelligent transmission;
    the immersive experience of innovation education arises from this. The "`5G+AR+Innovation
    Education`" model piloted by `Ping An Technology` was finally launched in close
    cooperation with the `Resource Development Department of the Central Institute
    of Educational Technology`: the `Central Institute of Educational Technology Educational
    Teaching Comprehensive Application System Virtual Reality Platform — Ping An Technology
    K12 VR Education Cloud`, which overall improved the teacher-student interaction
    mode, multi-person online education mode, and curriculum content presentation
    mode of innovation education, deeply solving the realistic pain points of traditional
    innovation education, and deeply favored by innovation education objects. Therefore,
    `Ping An Technology`''s "`5G+AR+Innovation Education`" model is penetrating into
    school innovation education and family innovation education.


    The `School-Enterprise Cooperation` model and the "`5G+AR+Innovation Education`"
    model of innovation education in the AI era only represent some typical cases
    of innovation education; regarding the combination of innovation education and
    emerging technologies, there are countless possibilities waiting to be explored.
    In the AI era, the contradiction between intelligent machines and humans is gradually
    intensifying; only by seeking innovation and seeking independence in the fields
    of emotion, thinking, and spirit can humans maintain a state of harmonious coexistence
    with machines. Therefore, innovation education in the AI era will not stagnate
    but will continue to develop forward, unstoppable. Therefore, an overall plan
    should be made for the future development of innovation education, not only to
    regulate the application of emerging technologies in the field of innovation education
    but also to examine the era value and significance of innovation education. Innovation
    education must not be turned into a utopian education of "innovation for innovation''s
    sake," but should, under the guidance of the Party''s innovation education thought
    and with the help of scientific innovation education planning, guide people to
    improve the lifelong learning mechanism, strengthen the foundation, deepen basic
    innovation education reform, and improve the overall innovation level of people.


    ## III. Maker Education: The Growth of Myriad Makers in the Intelligent Era


    Associated with innovation and entrepreneurship education, maker education is
    also an issue that the new era must highly focus on. When talking about maker
    education, one must mention the punk culture and anti-consumerism culture of the
    20th century, as well as the closely related `DIY culture`.


    ### (I) Cultural Background of the Birth of Maker Education


    In the 1970s, the American music scene set off a wave of punk culture; in the
    demands of punk culture, criticizing traditional music culture and pursuing fashion
    and new culture as the goal, it directly or indirectly reflected the realistic
    situation of social development at that time, as well as the naked attack and
    provocation of mainstream culture by people; in fact, it was a cultural venting
    of people''s strong dissatisfaction with social reality. But anyway, the emergence
    of punk culture reconciled internal and external social contradictions in the
    US at the cultural level, driving a new round of transformation for the entire
    country and society.


    At the same time, consumerism culture born in the 1920s and 1930s prevailed in
    the world, blending and developing with punk culture. With the gradual acceleration
    of the global industrial process, people gradually moved from the original era
    of material scarcity into an era of material abundance; a consumer culture dominated
    by material consumption and enjoyment became the mainstream culture of human civilization
    — consumerism culture — and led to many social problems. Many experts began to
    reflect on the social harms brought by this culture and guide people to consume
    rationally, thereby giving rise to an anti-consumerism culture coexisting with
    consumerism culture. Anti-consumerism culture advocates that people focus on rationality
    in the consumption process, spurn the physical and mental pleasure brought by
    shopping, and that shopping should be utility-oriented. In the 1990s, the `International
    Buy Nothing Day` (last Friday/Saturday of November each year), advocated and initiated
    by Canada''s `Adbusters Magazine`, became an important part of anti-consumerism
    culture, informing the world of the value and significance of moderate consumption.


    Essentially, whether punk culture or anti-consumerism culture, in the era context
    at that time, they were both new cultures. The reason they were considered subcultures
    or non-mainstream cultures of that era is mainly because they had significant
    conflicts and resistance with the orthodox industrial culture of that time. It
    is precisely because of the social pains brought by the orthodox industrial culture
    that people, at the cost of "losing self" and "becoming one-dimensional," exchanged
    for a collective social awakening; people began to seek a new culture dominated
    by individual life value and dignity, hoping to find free and autonomous existence
    therein. Therefore, the blending and fusion of punk culture and anti-consumerism
    culture forged the now prevalent American `DIY culture`.


    `DIY` stands for `DO IT YOURSELF`, meaning do it yourself what you can do; this
    culture advocates that people should solve their own problems. "I got it, I''ll
    do it myself," "No need to help, I can do it," "I can solve this," etc., become
    the realistic manifestations of `DIY culture`. `DIY culture` is a self-reliance
    culture, encouraging people to use their own hands and brains to solve their own
    survival and development problems. Precisely so, `DIY culture` caters to the requirements
    of the era; in this highly competitive era, people should more actively seek their
    own changes rather than pin their hopes on others. And this transformation, in
    different era contexts, mainly manifests as innovation culture and creative culture,
    requiring people to cope with complex external environments with new perspectives,
    new thinking modes, and new problem-solving models. Therefore, `DIY culture` eventually
    evolved into maker culture; people nurtured by maker culture love technology,
    are keen on practice, and firmly believe that a happy life originates from practice.


    In the era of big data and AI, maker culture has gradually matured and spread
    from local areas to the globe. Combined with the current intelligent technology
    era context, colloquially speaking, maker education is "`Maker Culture + Education`".


    ### (II) Essence and Advantages of Maker Education


    Given that people still maintain a feeling of "familiar yet strange" towards maker
    education, before discussing the specific practices of innovation education, it
    is necessary to specifically look at the concepts and characteristics of maker
    education. Regarding the concept of maker education, different scholars give different
    interpretations; the benevolent see benevolence, the wise see wisdom.


    '
