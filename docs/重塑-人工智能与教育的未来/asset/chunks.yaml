- raw: '教师角色是人们对教师的能力和地位的期望和要求,是教师身份的集中表现。由于教师的劳动具有复杂性、创造性、长期性和示范性等特征,意味着教师的角色扮演具有多重属性。良好的教师角色对于学生的成长和发展具有重要意义。


    教师角色的演变与发展,深深地打上时代的印记。从深层意义上来说,教师的角色是社会赋予的,是社会的期望和要求在教师身份中的再现。既然如此,一个良好的教师角色势必是与整体的教育大环境相互融合的,是与学生的发展休戚相关的。因此,教师角色的优良评判,需要放在特定的历史环境中去衡量,也就无所谓“传统”与“现代”之别。但是,历史是一个有机的整体,特定时空的历史划分难免存在局限性,教师角色的时空演变,“历史的遗留”与“时代的脱节”引发我们对“传统”的忧虑。


    随着智能时代的不断发展,传统教师角色的时代性脱节加重。智能时代,教育的发展呈现智能化与无边界化特征,教育资源、教育方法、教育内容、教育评估等领域的教育活动与教育问题都将被智能化与无边界化,给整个人类教育体系带来了巨大冲击。当然,适应于传统教育模式的教师角色势必也会遇到相应的挑战。传统的教师角色,人们最初的印象就是“传道授业解惑”,时至今日,这个定义依然具有时代价值。


    人们对于“传道”中的“道”的理解,是传统教师角色的缩影。过去的人们认为,“传道”中的“道”是道理和知识的意思,教师的角色就是负责给学生讲解知识和道理,监督学生硬性地完成学习任务。在教学过程中,学生被教师视为“学生”,或“待完善”的求学者,从观念上形成了教师与学生之间的不平等地位,教师成为传统课堂的控制者而不是参与者。这既让学生在教学活动中成为被动的知识接受者,又让学生沦为知识与道理的灌输对象,不仅阻碍了学生个性化的发展进程,还限制了学生批判思维能力和创造思维能力的培养与养成。


    教育,是一项培养人的活动,它本应该专注于培养学生发现问题、提出问题、解决问题的能力。但在传统教师角色扮演的过程中,“教师提出问题,学生解决教师提出的问题”成为师生互动的主要内容。在人工智能时代,社会存在的问题不胜枚举,学生的问题意识不断提高,仅仅是学会解决教师提出的问题,学生很难形成独立思考的能力,特别是自我设问与自我求真的能力。由此看来,人工智能时代的课堂不能仅仅是教师向学生提出一系列的问题让学生解决,而是要求教师应该引导学生自己提出问题,然后解决自己提出的问题,因为提出问题比解决问题更重要^([\[1\]](#txt005.html#footnote_content_txt005_1))。


    在智能新时代,传统教师角色的弊端日渐显现。在这种状态下,教师的“园丁”“工程师”“蜡烛”等角色形象逐渐蜕变,教师角色逐渐开始出现一种新的回归,回归到“平凡”的角色。人工智能时代,教师角色的演变与发展,在继承优良传统角色的基础上,回应社会对教师的新要求和新期许。与此相应,教师角色的大转向也应时而生。


    智能技术在赋能教育的过程中,将教育者和教育的管理者从繁杂的教育活动中解放出来,如布置作业、批改作业、考试命题、学期评估等活动,都将在智能技术的支撑下,大大节省教师的时间和精力,给老师以更多从事探索性教学工作的时间和空间。如今,在智能化的社会大环境下,“合作学习者”“资源整合者”“授人以渔者”“个性教学策划者”正在成为教师角色的最新代名词。


    合作学习者。人工智能时代,教师角色从“圣人”向“平凡人”的回归,使教师与学生之间的平等关系得以有效建立。正如保罗所言：“技术革命最令人吃惊的后果是其对那些专家们的权威构成挑战。因为它能够冲破任何人为设置的束缚^([\[2\]](#txt005.html#footnote_content_txt005_2))。”也就是说,由人工智能技术引发的第五次教育革命直接冲击了传统教师的权威,传统的“知识”与“道理”的管控者的教师权威逐渐转变,教师与学生之间开始走向合作学习的新模式,教师以合作学习者的角色出现于教学情境。教师成为合作学习的引导者和互动者。在传统“单向灌输式”的教学情境中,鉴于知识的爆炸性增长,教学任务的流变性增强,师生之间存在的“一对多”的关系,间接地加重了教师的教学任务。不可否认,在新时代探索新知识,教师个人的力量必然无法与学生群体的学习智慧相比较。所以,人工智能时代,为了最大限度地实现教育目的,教师就必须要将自己融入学生群体,与学生一起共同学习,了解学生的需求,掌握学生的特点,学习学生的社交语言,陪伴学生一起建构新的认知。


    资源整合者。人工智能时代的教育,智能教育系统平台的构建,为教师和学生获取教育资源提供了便捷通道。传统的教师,在开展教学活动时,用于教学活动的教学资源,主要以教材为主,其余的辅助资料也基本不需要教师自己整合,而是直接按照既定的课程大纲进行购买。因此,教师的资源整合者的角色并不明显。然而,在人工智能时代,由于教育大数据的集成,教育资源呈现“4V”特征,所以很多传统课程与教材的内容已明显过时。加之学生的时代需要,教师势必要处理好教材与新课程资源之间的关系,并综合运用智能技术挖掘多样化的教育资源,以满足社会与学生的现实需要。随着多元化的教育资源的不断涌现,教育资源大数据与日俱增。在这样的时代条件下,教师急需培养自身的资源整合能力,以便在“鱼龙混杂”的教育资源中,迅速挖掘出有利于学生成长的教育资源。所以,造就了智能时代的教师的资源整合者的角色。


    授人以渔者。随着智能社会的不断发展,不同学科之间的交叉融合现象越来越普遍,人文学科与自然学科相互渗透,大量的知识铺天盖地涌向教育领域,并在极短的时间内,知识又出现新的迭代与更新。常言道：“授人以鱼,不如授人以渔。”换言之,教授学生学习方法,比直接让学生掌握书本已有的理论知识更有意义,因为只有掌握科学的适合自己的学习方法的人,才能通过不断的学习适应快速变化的社会。所以,当学生的学习与知识迭代之间出现矛盾时,教师需要“一马当先”,做好学习的引路人,引导学生从学习方法入手,帮助学生提升学习能力,而不是让学生拼尽全力去“死磕”新知识。在智能时代,教师的角色是教会学生如何学习的人,是真正的“授人以渔者”。


    个性化教学策划者。自古以来,个性化教学(因材施教)的理念早已深入人心,但迫于现实条件的约束,并未能实现真正的个性化教学。然而,随着物联网、大数据、人工智能等新一代技术的不断发展,以新兴技术为支撑的教学平台应运而生。在此基础上,学生的学情数据将实现可视化,学生的学习规律、发展规律将一目了然。在这种情况下,如果教师想要了解个别学生的学习情况,只需要用移动终端打开相应的数据平台,便可随时查看学生的个性化学情数据。基于此,教师教学计划的制订,便可在原来的基础上,执行两套教学方案：一套是面向全体学生的公共教学方案,另一套是依托智能学习平台,对个别学生进行个性化教学的方案。未来,随着教育观念的不断转化,“面向全体”的教师角色开始消隐,而“面向个体”的教师角色开始渐渐登上历史舞台,成为教师角色的主要构成部分。


    人工智能赋能人类教师,合作学习者、资源整合者、授人以渔者、个性教学策划者等新兴角色向人类教师靠拢,教师角色得到前所未有的丰富和发展。当教师的角色不断丰富,人们对教师“传道、授业、解惑”的理解更加深入,进入韩愈所讲的“传道”的真正内涵层面。韩愈在《师说》中说：“授之书而习其句读者,非吾所谓传其道解其惑者也。”人工智能时代,教师角色的扮演,绝非传统意义上人们所理解的那种讲授“知识”与传授“道理”的简单认识,而是在智能技术的支撑下,教师对教育教学规律全面认识与掌握,回归到对“道”的切实把握上来。


    人工智能时代,教师角色的丰富和发展,对于树立“教师权威”、改善“师生关系”与促进学生全面发展等方面具有重要意义。雅斯贝尔斯认为权威有两种：一种是内在权威,另一种是外在权威。内在权威主要来自人格和精神的力量,而外在权威主要依赖强权^([\[3\]](#txt005.html#footnote_content_txt005_3))。智能教育中的教师角色的演变,正是一种内外相结合的权威走向,是教师权威由“外在权威”向“内在权威”的转化。在这个转化的过程中,学生们甚至感受不到教师权威的存在。因为与教师的专业素养相伴相生的权威,最终从教育者的身上转移到教育对象身上,以学生的学科素养表征教师的权威,从而打破传统教育中由于教育信息不对称所导致的学生对教师的依赖,教师与学生的关系,在其权威的“转化”中实现平等。


    教师角色的丰富和发展,有利于促进学生的发展。教师角色的转变,是顺应时代发展的必然产物,也是关注学生发展的教育理念的逐步胜利。在智能新时代,促进学生的全面发展是重中之重,立德树人是新时代教育的根本任务。教师角色的转变,正是适应教育目的与教育任务之要求,有节奏地顺从智能新时代的发展规律,循序渐进地改变传统教师角色,将师生“打成一片”“揉在一起”,从而更大程度地发挥教师的模范带头作用,给学生的健康成长与全面发展树立榜样。因此,教师角色的转变,在权威的“转化”中实现师生关系的平等,然后促成教师与学生的融合,最终促进学生的健康成长与全面发展。


    二、未雨绸缪：人类教师会被取代吗


    随着互联网、大数据和人工智能的不断发展,由技术融合而成的系统开始成熟,使人工智能教师的出现成为可能。历史上,人们很难想象机器人会成为教师,更难想象它的存在会威胁到人类教师的工作。但是,在智能时代,过去的那些不可能的“想象”如今都已由“没有想过”变成了现实。


    人工智能教师的问世,最早可追溯到“专家系统”的诞生。专家系统是一个智能计算机程序系统,其内部含有大量的某个领域专家水平的知识与经验,能够利用人类专家的知识和解决问题的方法来处理该领域问题。专家系统本质上是知识与经验的存储系统,海量的知识和丰富的人类实践经验聚集在智能计算机系统中,构成了最早的专家系统。系统处于运行状态时,凡是有来访者进行系统访问,都将会得到一个特定的答案,或者是解决该问题的方法与策略。因此,作为人工智能技术的一个分支技术,“专家系统”的发展,既显现出人工智能理论“落地应用”的走向,又反映出教师行业的“无人化”与“智能化”趋势。


    人工智能教师诞生的根本力量在于人类本身所固有的局限性。人类在制造和使用工具的过程中,由于受到本身的“惰性”的支配,自然会有想要依赖工具的愿望和情感倾向,人工智能技术在教育领域的运用亦是如此。


    人工智能教师的诞生,一方面是源于技术发展的成熟,另一方面是源于人类的“惰性”。智能技术的发展成熟,是人工智能教师站立起来的基础,但人类的“惰性”,或者说是人类本身所固有的局限性,却成为人工智能教师诞生的历史根源与强大力量,驱使人们不断地通过运用智能技术,把人类教师的专业素养与专业能力赋予智能机器。


    2018年8月,全球首个拥有人类身份的人工智能机器人索菲亚(Sophia)被全球领先在线教育集团iTutor Group聘为人工智能教师,自此,索菲亚成为人类历史上首位人工智能教师。i
    Tutor Group聘请人工智能机器人索菲亚做教师,并非突然。据亿欧网2018年2月下旬的消息显示,早在2018年的上海“新时代新教育创未来”发布会上,全球领先在线教育集团i
    Tutor Group就已经与人工智能机器人索菲亚达成战略合作协议。截至目前,索菲亚(Sophia)基本可以承担在线教学任务,并能处理一些较为复杂的教育教学问题。一方面,它借助其强大的记忆能力,能够有针对性地为学生提供个性化教学服务,从整体上达到人类教师的助教水平;另一方面,它以人的外表样子出现,能够更好地与学生进行交流与互动,起到陪伴学生成长的重要作用。


    人工智能机器人(公民)被聘为教师引发了社会热议。人工智能索菲亚(Sophia)以教师的身份出现在人们面前时,人们在庆祝之余,也在担忧人类教师的前途与命运：人工智能教师会不会代替人类教师?在这样的时代危机下,人类教师应该做哪些准备,才不至于被人工智能教师替代?人工智能机器人对人类的各种职业的冲击,具有与生俱来的颠覆性力量,在人们思考教师被取代之余,其他领域的人们也都在思考这个问题。


    2017年10月,英国广播公司(BBC)基于剑桥大学研究者Michael Osborne和Carl Frey的数据体系,分析全球365种职业在未来社会中会被淘汰的概率,具体数据如表5-1所示^([\[4\]](#txt005.html#footnote_content_txt005_4))。由表中数据可知,未来最容易被人工智能机器人淘汰的前五名是电话推销员(被淘汰的概率为99.0%)、打字员(被淘汰的概率为98.5%)、会计(被淘汰的概率为97.6%)、保险业务员(被淘汰的概率为97.0%)、银行职员(被淘汰的概率为96.8%),其次是政府职员、接线员、前台、客服、人事、房地产经纪人、厨师等。


    根据英国广播公司统计数据可知,人工智能机器对人类职业的代替,将会深入人类生活的各个领域。以色列作家尤瓦尔·赫拉利(Yuval Noah Harari)认为,未来的分工越发专业化,人类社会将诞生一个历史上从未出现的对经济和军事都毫无用处的阶级——即“无用阶级”(Useless
    Class)^([\[5\]](#txt005.html#footnote_content_txt005_5))。但是,回归到教育领域,我们不禁要问,人类教师真的会沦为“无用阶级”吗?真的会完全被人工智能教师所代替吗?


    ![](images/txt005_1.jpg "pagenumber_ebook=75,pagenumber_book=65")


    图5-1 iTutor Group创始人、董事长兼CEO杨正大与全球首个人工智能教师索菲亚^([\[6\]](#txt005.html#footnote_content_txt005_6))


    表5-1 各种职业在未来被淘汰的概率①


    ![](images/txt005_2.jpg "pagenumber_ebook=75,pagenumber_book=65")


    续表


    ![](images/txt005_3.jpg "pagenumber_ebook=76,pagenumber_book=66")


    对于“人工智能教师是否会取代人类教师”这个问题的回答,其实在英国广播公司的统计数据中已经能够获得相应的答案——人类教师被人工智能机器取代的概率只有0.4%。但是值得关注的是：在人工智能时代,如果教师不会应用人工智能技术,被人工智能教师取代的概率将会大增。


    1996年,联合国教科文组织在《关于教师地位的建议》中指出,教师工作应该被视为一种“专业”。隐含之意便是,教师工作是一种专门的职业,他们要具备教育的能力和完善的品格,要能精准把握自己的服务对象的特质,以及掌握与之相匹配的一整套教育理论与教育方法。换言之,教师的专业技能与专业素养,来源于专业化的人才培养渠道,在专业方面很难被替代。


    在谈及人工智能教师是否会取代人类教师之前,有必要首先仔细分析人工智能机器人到底擅长什么,不擅长什么,这是未来的人类教师不被取代的关键。从英国广播公司的统计数据中可知,在未来的社会发展中,容易被人工智能技术淘汰的职业都有共同的特点,如教育客服,所有能够为求学者提供便捷服务的职业都可称之为教育客服,它们本身承载的价值导向就是为求学者提供便捷服务,但这项工作为什么却会有91%的概率会被人工智能替代?


    这个问题并不难回答,因为人工智能客服能够告诉你答案。智能教育客服,是基于人工智能语义识别技术的客服系统。在长时间的服务中,它能够主动针对特定语境进行问题构建与对策生成,就像客户打开淘宝购物界面向客服寻求帮助一样。当你开始输入问题时,智能教育客服已经根据它的深度学习经验,推测到你针对某个学习模块而可能会提出的各种问题,并对其进行套路解答。同时,它还可以依托智能推荐系统功能,向你推送相关的学习产品链接等。


    但是,细心的人就会发现,在同一个智能客服的人机界面,相同的问题基本上只能得到相同的解答。这就说明智能教育客服的根本,其实是问题解决系统。换言之,智能教育客服的存在,它是将现实的教育客服服务问题域进行了大数据综合汇总,特定的问题在特定的情境中,解答的方式不同,但回答的内容基本一致。这种“套路式”的工作性质,在人工客服与智能客服的比较中,人工智能客服系统具备明显的优势,它们不知疲倦,可以24小时在线,能够回答不同类型用户提出的各种“刁钻”的问题。因此,教育客服职业的被替代,值得深思。再如打字员的工作,如今可以依托智能语音输入、智能图片文字识别、智能视觉识别等技术,已经可以基本取代打字员的工作。在智能手机的社交软件(微信、QQ等)中,大家可以开启语音转换文字功能,便可轻松实现文字输入。


    如前所述,无论是客服、打字员、会计,还是银行职员,这些工作都是简单且重复性的劳作,身处其中的工作人员无须过多的动脑思考,只需熟练掌握业务技能即可。


    然而,建筑师、公关、心理医生、酒店管理者等职业,为何它们被人工智能机器取代的概率没有超过2%?综合比较研究发现,这几大职业,牵涉的情感因素和智慧因素过多,涉及复杂的人际关系网络、人文价值关怀与对生命的理解,其职业的运作方式更多的是需要智慧的头脑,而不是固定的业务模式。


    因此,从整体上而言,人工智能的出现之所以在特定的职业领域能够引发人类的“团体焦虑”,是因为人工智能在操作性技能层面具有人类无可比拟的优势。但是,在智慧性技能层面,人工智能的弱项便开始暴露。“知、情、意、行”是构成人类教师的四大基础能力,但由于人工智能教师是机器的化身,其本身不具备生命属性,所以在情感能力和意志能力方面有较大的缺陷。教师,作为一门专业的职业,不仅要求其要具备业务操作技能,还需要掌握专门的智慧性技能。人工智能教师的智慧性技能的匮乏,从而揭示了人类教师被替代的概率低的内在原因——人工智能教师死板、缺乏情感与缺乏创新精神。


    人工智能教师,是以人工智能技术为基础,在虚拟与现实中专门从事教学工作的智能系统,其本质是非生命的存在物。就目前的人工智能技术发展进程来看,由于智能技术本身存在的局限性,人工智能教师的存在,它们也只能“按部就班”地完成“指令式”的教学任务,包括人工智能教师索菲亚。由于缺乏独立的思想意识,绝对服从的人工智能教师系统,是对人类教育标准的精准化执行。


    例如,人工智能教师批改作业,对于客观题的评判标准的唯一性,给予它们很大的“自由”发挥的空间,在批改的效率和质量上都远超人类教师。然而,对于没有唯一评判标准的主观题而言,人工智能教师却显得有些无所适从。即使通过技术手段赋予它们一定的标准,但是由“标准”组合而成的评判体系,仍然无法有效感知答题者的情感态度和情感倾向。所以,在人工智能教师批改作业的过程中,很容易导致原本很出彩的文章却通不过人工智能教师的评判系统。'
  fmt: '

    # 教师角色在智能时代的演变与发展


    教师角色是人们对教师的能力和地位的期望和要求，是教师身份的集中表现。由于教师的劳动具有复杂性、创造性、长期性和示范性等特征，意味着教师的角色扮演具有多重属性。良好的教师角色对于学生的成长和发展具有重要意义。


    教师角色的演变与发展，深深地打上时代的印记。从深层意义上来说，教师的角色是社会赋予的，是社会的期望和要求在教师身份中的再现。既然如此，一个良好的教师角色势必是与整体的教育大环境相互融合的，是与学生的发展休戚相关的。因此，教师角色的优良评判，需要放在特定的历史环境中去衡量，也就无所谓“传统”与“现代”之别。但是，历史是一个有机的整体，特定时空的历史划分难免存在局限性，教师角色的时空演变，“历史的遗留”与“时代的脱节”引发我们对“传统”的忧虑。


    随着智能时代的不断发展，传统教师角色的时代性脱节加重。智能时代，教育的发展呈现智能化与无边界化特征，教育资源、教育方法、教育内容、教育评估等领域的教育活动与教育问题都将被智能化与无边界化，给整个人类教育体系带来了巨大冲击。当然，适应于传统教育模式的教师角色势必也会遇到相应的挑战。传统的教师角色，人们最初的印象就是“传道授业解惑”，时至今日，这个定义依然具有时代价值。


    人们对于“传道”中的“道”的理解，是传统教师角色的缩影。过去的人们认为，“传道”中的“道”是道理和知识的意思，教师的角色就是负责给学生讲解知识和道理，监督学生硬性地完成学习任务。在教学过程中，学生被教师视为“学生”，或“待完善”的求学者，从观念上形成了教师与学生之间的不平等地位，教师成为传统课堂的控制者而不是参与者。这既让学生在教学活动中成为被动的知识接受者，又让学生沦为知识与道理的灌输对象，不仅阻碍了学生个性化的发展进程，还限制了学生批判思维能力和创造思维能力的培养与养成。


    教育，是一项培养人的活动，它本应该专注于培养学生发现问题、提出问题、解决问题的能力。但在传统教师角色扮演的过程中，“教师提出问题，学生解决教师提出的问题”成为师生互动的主要内容。在人工智能时代，社会存在的问题不胜枚举，学生的问题意识不断提高，仅仅是学会解决教师提出的问题，学生很难形成独立思考的能力，特别是自我设问与自我求真的能力。由此看来，人工智能时代的课堂不能仅仅是教师向学生提出一系列的问题让学生解决，而是要求教师应该引导学生自己提出问题，然后解决自己提出的问题，因为提出问题比解决问题更重要^([\[1\]](#txt005.html#footnote_content_txt005_1))。


    在智能新时代，传统教师角色的弊端日渐显现。在这种状态下，教师的“园丁”“工程师”“蜡烛”等角色形象逐渐蜕变，教师角色逐渐开始出现一种新的回归，回归到“平凡”的角色。人工智能时代，教师角色的演变与发展，在继承优良传统角色的基础上，回应社会对教师的新要求和新期许。与此相应，教师角色的大转向也应时而生。


    智能技术在赋能教育的过程中，将教育者和教育的管理者从繁杂的教育活动中解放出来，如布置作业、批改作业、考试命题、学期评估等活动，都将在智能技术的支撑下，大大节省教师的时间和精力，给老师以更多从事探索性教学工作的时间和空间。如今，在智能化的社会大环境下，“合作学习者”“资源整合者”“授人以渔者”“个性教学策划者”正在成为教师角色的最新代名词。


    ## 合作学习者


    人工智能时代，教师角色从“圣人”向“平凡人”的回归，使教师与学生之间的平等关系得以有效建立。正如保罗所言：“技术革命最令人吃惊的后果是其对那些专家们的权威构成挑战。因为它能够冲破任何人为设置的束缚^([\[2\]](#txt005.html#footnote_content_txt005_2))。”也就是说，由人工智能技术引发的第五次教育革命直接冲击了传统教师的权威，传统的“知识”与“道理”的管控者的教师权威逐渐转变，教师与学生之间开始走向合作学习的新模式，教师以合作学习者的角色出现于教学情境。教师成为合作学习的引导者和互动者。在传统“单向灌输式”的教学情境中，鉴于知识的爆炸性增长，教学任务的流变性增强，师生之间存在的“一对多”的关系，间接地加重了教师的教学任务。不可否认，在新时代探索新知识，教师个人的力量必然无法与学生群体的学习智慧相比较。所以，人工智能时代，为了最大限度地实现教育目的，教师就必须要将自己融入学生群体，与学生一起共同学习，了解学生的需求，掌握学生的特点，学习学生的社交语言，陪伴学生一起建构新的认知。


    ## 资源整合者


    人工智能时代的教育，智能教育系统平台的构建，为教师和学生获取教育资源提供了便捷通道。传统的教师，在开展教学活动时，用于教学活动的教学资源，主要以教材为主，其余的辅助资料也基本不需要教师自己整合，而是直接按照既定的课程大纲进行购买。因此，教师的资源整合者的角色并不明显。然而，在人工智能时代，由于教育大数据的集成，教育资源呈现“4V”特征，所以很多传统课程与教材的内容已明显过时。加之学生的时代需要，教师势必要处理好教材与新课程资源之间的关系，并综合运用智能技术挖掘多样化的教育资源，以满足社会与学生的现实需要。随着多元化的教育资源的不断涌现，教育资源大数据与日俱增。在这样的时代条件下，教师急需培养自身的资源整合能力，以便在“鱼龙混杂”的教育资源中，迅速挖掘出有利于学生成长的教育资源。所以，造就了智能时代的教师的资源整合者的角色。


    ## 授人以渔者


    随着智能社会的不断发展，不同学科之间的交叉融合现象越来越普遍，人文学科与自然学科相互渗透，大量的知识铺天盖地涌向教育领域，并在极短的时间内，知识又出现新的迭代与更新。常言道：“授人以鱼，不如授人以渔。”换言之，教授学生学习方法，比直接让学生掌握书本已有的理论知识更有意义，因为只有掌握科学的适合自己的学习方法的人，才能通过不断的学习适应快速变化的社会。所以，当学生的学习与知识迭代之间出现矛盾时，教师需要“一马当先”，做好学习的引路人，引导学生从学习方法入手，帮助学生提升学习能力，而不是让学生拼尽全力去“死磕”新知识。在智能时代，教师的角色是教会学生如何学习的人，是真正的“授人以渔者”。


    ## 个性化教学策划者


    自古以来，个性化教学（因材施教）的理念早已深入人心，但迫于现实条件的约束，并未能实现真正的个性化教学。然而，随着物联网、大数据、人工智能等新一代技术的不断发展，以新兴技术为支撑的教学平台应运而生。在此基础上，学生的学情数据将实现可视化，学生的学习规律、发展规律将一目了然。在这种情况下，如果教师想要了解个别学生的学习情况，只需要用移动终端打开相应的数据平台，便可随时查看学生的个性化学情数据。基于此，教师教学计划的制订，便可在原来的基础上，执行两套教学方案：一套是面向全体学生的公共教学方案，另一套是依托智能学习平台，对个别学生进行个性化教学的方案。未来，随着教育观念的不断转化，“面向全体”的教师角色开始消隐，而“面向个体”的教师角色开始渐渐登上历史舞台，成为教师角色的主要构成部分。


    人工智能赋能人类教师，合作学习者、资源整合者、授人以渔者、个性教学策划者等新兴角色向人类教师靠拢，教师角色得到前所未有的丰富和发展。当教师的角色不断丰富，人们对教师“传道、授业、解惑”的理解更加深入，进入韩愈所讲的“传道”的真正内涵层面。韩愈在《师说》中说：“授之书而习其句读者，非吾所谓传其道解其惑者也。”人工智能时代，教师角色的扮演，绝非传统意义上人们所理解的那种讲授“知识”与传授“道理”的简单认识，而是在智能技术的支撑下，教师对教育教学规律全面认识与掌握，回归到对“道”的切实把握上来。


    人工智能时代，教师角色的丰富和发展，对于树立“教师权威”、改善“师生关系”与促进学生全面发展等方面具有重要意义。雅斯贝尔斯认为权威有两种：一种是内在权威，另一种是外在权威。内在权威主要来自人格和精神的力量，而外在权威主要依赖强权^([\[3\]](#txt005.html#footnote_content_txt005_3))。智能教育中的教师角色的演变，正是一种内外相结合的权威走向，是教师权威由“外在权威”向“内在权威”的转化。在这个转化的过程中，学生们甚至感受不到教师权威的存在。因为与教师的专业素养相伴相生的权威，最终从教育者的身上转移到教育对象身上，以学生的学科素养表征教师的权威，从而打破传统教育中由于教育信息不对称所导致的学生对教师的依赖，教师与学生的关系，在其权威的“转化”中实现平等。


    教师角色的丰富和发展，有利于促进学生的发展。教师角色的转变，是顺应时代发展的必然产物，也是关注学生发展的教育理念的逐步胜利。在智能新时代，促进学生的全面发展是重中之重，立德树人是新时代教育的根本任务。教师角色的转变，正是适应教育目的与教育任务之要求，有节奏地顺从智能新时代的发展规律，循序渐进地改变传统教师角色，将师生“打成一片”“揉在一起”，从而更大程度地发挥教师的模范带头作用，给学生的健康成长与全面发展树立榜样。因此，教师角色的转变，在权威的“转化”中实现师生关系的平等，然后促成教师与学生的融合，最终促进学生的健康成长与全面发展。


    # 二、未雨绸缪：人类教师会被取代吗


    随着互联网、大数据和人工智能的不断发展，由技术融合而成的系统开始成熟，使人工智能教师的出现成为可能。历史上，人们很难想象机器人会成为教师，更难想象它的存在会威胁到人类教师的工作。但是，在智能时代，过去的那些不可能的“想象”如今都已由“没有想过”变成了现实。


    人工智能教师的问世，最早可追溯到“专家系统”的诞生。专家系统是一个智能计算机程序系统，其内部含有大量的某个领域专家水平的知识与经验，能够利用人类专家的知识和解决问题的方法来处理该领域问题。专家系统本质上是知识与经验的存储系统，海量的知识和丰富的人类实践经验聚集在智能计算机系统中，构成了最早的专家系统。系统处于运行状态时，凡是有来访者进行系统访问，都将会得到一个特定的答案，或者是解决该问题的方法与策略。因此，作为人工智能技术的一个分支技术，“专家系统”的发展，既显现出人工智能理论“落地应用”的走向，又反映出教师行业的“无人化”与“智能化”趋势。


    人工智能教师诞生的根本力量在于人类本身所固有的局限性。人类在制造和使用工具的过程中，由于受到本身的“惰性”的支配，自然会有想要依赖工具的愿望和情感倾向，人工智能技术在教育领域的运用亦是如此。


    人工智能教师的诞生，一方面是源于技术发展的成熟，另一方面是源于人类的“惰性”。智能技术的发展成熟，是人工智能教师站立起来的基础，但人类的“惰性”，或者说是人类本身所固有的局限性，却成为人工智能教师诞生的历史根源与强大力量，驱使人们不断地通过运用智能技术，把人类教师的专业素养与专业能力赋予智能机器。


    2018年8月，全球首个拥有人类身份的人工智能机器人索菲亚被全球领先在线教育集团iTutor Group聘为人工智能教师，自此，索菲亚成为人类历史上首位人工智能教师。iTutor
    Group聘请人工智能机器人索菲亚做教师，并非突然。据亿欧网2018年2月下旬的消息显示，早在2018年的上海“新时代新教育创未来”发布会上，全球领先在线教育集团iTutor
    Group就已经与人工智能机器人索菲亚达成战略合作协议。截至目前，索菲亚基本可以承担在线教学任务，并能处理一些较为复杂的教育教学问题。一方面，它借助其强大的记忆能力，能够有针对性地为学生提供个性化教学服务，从整体上达到人类教师的助教水平；另一方面，它以人的外表样子出现，能够更好地与学生进行交流与互动，起到陪伴学生成长的重要作用。


    人工智能机器人（公民）被聘为教师引发了社会热议。人工智能索菲亚以教师的身份出现在人们面前时，人们在庆祝之余，也在担忧人类教师的前途与命运：人工智能教师会不会代替人类教师？在这样的时代危机下，人类教师应该做哪些准备，才不至于被人工智能教师替代？人工智能机器人对人类的各种职业的冲击，具有与生俱来的颠覆性力量，在人们思考教师被取代之余，其他领域的人们也都在思考这个问题。


    2017年10月，英国广播公司（BBC）基于剑桥大学研究者Michael Osborne和Carl Frey的数据体系，分析全球365种职业在未来社会中会被淘汰的概率，具体数据如表5-1所示^([\[4\]](#txt005.html#footnote_content_txt005_4))。由表中数据可知，未来最容易被人工智能机器人淘汰的前五名是电话推销员（被淘汰的概率为99.0%）、打字员（被淘汰的概率为98.5%）、会计（被淘汰的概率为97.6%）、保险业务员（被淘汰的概率为97.0%）、银行职员（被淘汰的概率为96.8%），其次是政府职员、接线员、前台、客服、人事、房地产经纪人、厨师等。


    根据英国广播公司统计数据可知，人工智能机器对人类职业的代替，将会深入人类生活的各个领域。以色列作家尤瓦尔·赫拉利认为，未来的分工越发专业化，人类社会将诞生一个历史上从未出现的对经济和军事都毫无用处的阶级——即“无用阶级”^([\[5\]](#txt005.html#footnote_content_txt005_5))。但是，回归到教育领域，我们不禁要问，人类教师真的会沦为“无用阶级”吗？真的会完全被人工智能教师所代替吗？


