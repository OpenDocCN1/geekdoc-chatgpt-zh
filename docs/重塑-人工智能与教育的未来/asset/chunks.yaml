    # Educational Reform and Liberal Arts Exploration in the Age of Artificial Intelligence


    ## I. Educational Development Must Keep Pace with the Times


    ### Education Must Keep Pace with Scientific and Technological Development


    The developmental form of education may evolve under the influence of science
    and technology; the birth of intelligent educational technology is the result
    of such evolution in the educational field. Regarding the classroom, "chalk" and
    "blackboard" are the knowledge presentation media of traditional classrooms, but
    the emergence of intelligent technology has gradually distanced this medium from
    students, replacing it with a new form of knowledge presentation medium. For instance,
    new media courseware, projectors, big data AI platforms, WeChat official accounts,
    etc., not only adapt to students'' living environments but also enable data-based
    recording and visual analysis of the learning process at the technical level.
    The development of science and technology has largely changed the media and methods
    by which students acquire knowledge, as well as the aesthetic sense and experience
    of the learning process. Educational development must inevitably keep pace with
    this new social form shaped by emerging technologies.


    ### Education Must Keep Pace with Socio-Cultural Development


    Today, AI technology is fundamentally changing the processes of production, dissemination,
    and value realization of socio-culture, and the value of intelligent elements
    in the socio-cultural environment is gradually increasing. Relative to socio-culture,
    education itself is also a tool for the production, dissemination, and screening
    of culture; it hopes to promote the free expression of every member of society
    within a larger cultural framework through innovative educational methods. In
    real life, the way each person discovers the meaning of life is closely related
    to the cultural environment in which they live^([\[3\]](#txt007.html#footnote_content_txt007_3)).
    Since people already live in an intelligent cultural space, education can provide
    talent for the development of this socio-culture, channels for its dissemination,
    and methodology for its innovation. Educational development must find its convergence
    point within the structural system of socio-culture.


    ### Social Development Poses New Requirements for Education


    Social development pushes back on the development of economy, technology, and
    culture, and also poses new developmental requirements for education. Therefore,
    what kind of educational landscape the AI era needs to form to meet the social
    development requirements of the intelligent age is a question worthy of deep reflection.


    ## An Open and Inclusive Educational System


    To meet the requirements posed by social development, the education system itself
    should be an **open and inclusive educational system** (as shown in Figure 7-1).
    This system should include various forms of education, such as online classrooms,
    vocational education, basic education, higher education, social vocational training,
    preschool education, family education, school education, social education, inclusive
    education, etc., ultimately forming a massive AI education system with diverse
    forms, pluralistic structures, and multi-dimensional educational methods, aiming
    to respond to overall social needs from the broad educational field. Simultaneously,
    to realize education preparing for future life, today''s education should also
    focus on the field of "**liberal arts education**" (or "generalist education"),
    actively leveraging AI technology to carry out new liberal arts education and
    new engineering education in the AI era, laying out the future talent market in
    advance on the premise of being grounded in real life.


    ![](img/txt007_1.jpg "pagenumber_ebook=101,pagenumber_book=91")


    **Figure 7-1 Open and Inclusive Educational System**


    An open and inclusive educational system inherently contains educators'' reflection
    on the discipline-based, major-based educational model; it does not reject the
    existing discipline-based education, but the results of this reflection are worth
    pondering. Because before the arrival of liberal arts education, the discussion
    on the defects of the arts-sciences division education will surely play a practical
    role and value in the construction of the liberal arts education system.


    ## II. Institutional Reflection: Limitations of Arts-Sciences Division Education


    Arts-sciences division refers to the systematic separation of the comprehensive
    subjects "Chinese, Math, English, Politics/History/Geography, Physics/Chemistry/Biology"
    into arts (Chinese, Math, English, Politics/History/Geography) and sciences (Chinese,
    Math, English, Physics/Chemistry/Biology) when students transition from Grade
    10 to Grade 11. Students can choose one to continue studying based on their foundation
    and interests. For students, the high school arts-sciences division seems like
    a watershed in life; different choices represent different ways of from the education
    system due to talent scarcity; cultivating new talents for new industries becomes
    an important aspect distinguishing new engineering education from traditional
    engineering education.


    ### Innovation in Curriculum System


    The "newness" of new engineering education is also reflected in the newness of
    the educational curriculum. On the basis of inheriting the advantages of traditional
    engineering education, new engineering education has launched a new generation
    of curriculum systems adapted to social development. In 2018, the General Office
    of the Ministry of Education issued the *Notice on Announcing the First Batch
    of "New Engineering" Research and Practice Projects (Jiao Gao Ting Han [2018]
    No. 17)*, calling for the accelerated formation of a batch of replicable and promotable
    reform achievements, achieving breakthroughs in emerging engineering curriculum
    systems, new-form teaching materials and content, MOOCs, engineering education
    faculty teams, and practice bases^([\[7\]](#txt007.html#footnote_content_txt007_7));
    the *Notice* further announced 612 new engineering research projects from universities
    nationwide. The specific scope of reform-related courses involved is shown in
    Table 7-1. The top five curriculum reforms are concentrated in the fields of big
    data and AI technology; related independent courses have emerged accordingly,
    such as Data Science and Technology, IoT Engineering, Robotics Engineering, Intelligent
    Science and Technology, Smart Grid Information Engineering, Optoelectronic Information
    Science and Engineering, Big Data and AI, Software Engineering, AI, and other
    major courses.


    **Table 7-1 Scope of New Engineering Curriculum Reform System**


    ![](img/txt007_2.jpg "pagenumber_ebook=106,pagenumber_book=96")


    Echoing the Ministry of Education''s new engineering curriculum reform and practice,
    local universities'' curriculum systems have begun to station in new fields; majors
    such as big data, AI, virtual reality, and cloud computing have entered universities
    one after another. As of now, over 40 universities nationwide have established
    AI colleges. In the first half of 2019 alone, Peking University, Renmin University
    of China, Xi''an Jiaotong University, Southeast University, and others established
    AI colleges within their schools. It is predicted that around 2025, the establishment
    of big data AI colleges and majors will rapidly expand to schools of all levels
    and types nationwide, with beneficiary students showing full coverage characteristics.


    In late October 2019, the world''s first AI university — Mohamed bin Zayed University
    of Artificial Intelligence (MBZUAI) — announced its establishment in Abu Dhabi,
    UAE, aiming to "introduce new models of academia and research to the field of
    AI, provide students and faculty with the world''s most advanced AI systems, and
    unleash the potential of AI in promoting economic and social development." From
    AI colleges to AI research institutes, to AI universities, curriculum development
    regarding AI has achieved relatively comprehensive coverage.


    ### Transformation of Educational Methods


    The "newness" of new engineering education will also be reflected in the "newness"
    of educational methods. In the era of big data and AI, new engineering education
    and big data AI technology will be "inseparable"; intelligent, humanized, collaborative,
    diversified, and personalized education will become the basic characteristics
    of new engineering education.


    Big data AI technology will further penetrate the entire new engineering education
    system; major courses of new engineering education will highlight the value of
    personalized education more prominently under the support of big data AI technology.
    Based on the construction of data-based AI education algorithm models, the knowledge,
    behavior, and emotion of new engineering education objects can all achieve personalized
    expression. Based on the transparency and datafication of students, teachers,
    and schools, educational methods gradually change, moving from traditional cramming
    and indoctrination teaching toward personalized, heuristic, and participatory
    teaching, ultimately achieving a major transformation of the humanistic educational
    methodology in the field of new engineering education, realizing the unity of
    new engineering value and humanistic value at the methodological level.


    "AI+" applications have entered the normalized stage of society, triggering the
    transformation of traditional engineering education; a series of new characteristics
    of engineering education emerge, with new engineering education at the forefront
    of educational development. The penetrating power of AI technology is so great,
    and its value to engineering education is so prominent, that people have begun
    to explore the application and solutions of AI education in the field of new engineering
    education, further promoting the integration of intelligent elements with new
    engineering education.


    In 2016, the Ministry of Education put new engineering construction on the agenda.
    2017 was called the first year of AI application; AI application and new engineering
    construction grew together, and the integration between the two followed a pattern.
    Application means adapting to needs for use. AI application refers to AI technology
    adapting to social development needs and providing the technology itself for use
    by various social fields. In the AI era, the integration of AI application and
    new engineering education mainly involves integrating AI technology into the entire
    process of new engineering education to achieve the modernized development of
    new engineering education.


    #### Personalized Learning for Students


    The application of AI technology in new engineering education helps build a personalized
    learning system for students through AI system platforms, combining the characteristics
    and laws of new engineering education to conduct personalized teaching for students.
    Based on data accumulated during individual student learning processes, exclusive
    learning models for specific students are constructed; with the help of intelligent
    models, students'' learning blind spots can be quickly filled, misconceptions
    quickly corrected, emotions quickly identified, learning needs fed back in a timely
    and effective personalized manner, and the formulation of learning plans and acquisition
    of learning resources will all become personalized. The integration of AI technology
    into new engineering education promotes the realization of personalized new engineering
    education, helping students leverage the cross-disciplinary learning system of
    new engineering to break through learning dilemmas caused by disciplinary barriers,
    and cultivate new engineering talents with "12 types of thinking abilities"^([\[8\]](#txt007.html#footnote_content_txt007_8))
    in heuristic, participatory, personalized learning systems.


    #### Precision Teaching for Teachers


    The realization of precision teaching for teachers requires docking with the needs
    of new engineering education objects, achieving precise connection between the
    two. With the gradual deepening of AI technology application in the field of new
    engineering education, AI education systems possessing speech recognition, visual
    recognition, natural language processing, and deep learning capabilities can timely
    and effectively examine students'' learning situations, i.e., intelligent analysis
    of learning status. They can use students'' learning big data as a basis to quickly
    identify learning characteristics, methods, effects, interests, and grades, and
    build learning status models on this basis; during the generalization process
    of student learning models, they can effectively insight into the crux of problems
    existing in the learning process. For example, if students have knowledge gaps
    in industrial design, additive manufacturing, virtual reality theory, etc., the
    system will output learning status data regarding these gaps, guiding teachers
    to improve teaching plans or methods, and provide personalized teaching for students
    with special needs.


    #### Scientific Management for Schools


    Scientific school management is an important application of AI technology in the
    field of new engineering education; it will effectively improve school management
    efficiency and quality, promoting the service transformation and upgrading of
    the entire school management system. Using AI recognition technology to actively
    mine big data in the field of school management, visualizing and making transparent
    the physical attributes of the management system, forming a school education management
    system pattern of "speaking with data, deciding with data, managing with data,
    innovating with data," promoting the scientification, systematization, and normalization
    of school safety management, teaching management, resource management, evaluation
    management, etc. Breaking the traditional departmental interest pattern, encouraging
    integration between departments, promoting the sharing and rational allocation
    of new engineering school-running resources; assessment mechanisms break traditional
    evaluation models, encouraging teachers to integrate across majors, promoting
    exploration of unknown technologies, breaking traditional management mechanisms,
    promoting cross-departmental and cross-school collaborative development, and promoting
    the realization of cross-major course selection and personalized training plans^([\[9\]](#txt007.html#footnote_content_txt007_9)).


    ## IV. New Liberal Arts Education: AI Empowering New Liberal Arts Education


    Liberal arts education is the general term for humanities and social sciences
    education, which has a large gap compared to natural sciences education. For a
    long time, compared to engineering education, liberal arts education has been
    in a relatively weak position; the "golden age of liberal arts" where "civil affairs
    were valued over military affairs" has slightly declined; "Master math, physics,
    and chemistry, and you can travel the world without fear" has become the most
    common "catchphrase" of science and engineering students, reflecting the decline
    and marginalization of liberal arts from the side.


    ### Causes of the Marginalization of Liberal Arts Education


    The marginalization of liberal arts education is a special phenomenon in current
    school education, related to student employment, social talent demands, and the
    inherent difficulty of the subjects. Traditional engineering education follows
    the path of learning "one specialized skill"; after graduation, students can obtain
    a stable job relying on their professional skills, and their employment and career
    choices are relatively broad. Because in a society where traditional industry
    and new technology industries develop alternately, talent demand is also biased
    toward introducing engineering talents; plus, engineering education emphasizes
    logical and abstract thinking more, so most students inclined toward perceptual
    thinking naturally gravitate toward liberal arts. Comparative research shows that
    the world''s top academic journals are almost entirely engineering journals (such
    as *PNAS*, *Cell*, *Nature*, *Science*, etc.); world-class journals for liberal
    arts are few and far between, which inevitably limits the influence and scope
    of research achievements for liberal arts students.


    ### The Indispensability of Liberal Arts Education and the Sprouting of New Liberal
    Arts Education


    Nevertheless, liberal arts education cannot be ignored, because the decline of
    humanities and social sciences also means the incompleteness of engineering education.
    Professor Ma Feicheng, a senior professor of humanities and social sciences at
    Wuhan University, explains: "Overall, various disciplines and even the entire
    scientific community are constantly moving toward integration while being highly
    differentiated." The development of liberal arts and engineering education, although
    they went down two vastly different paths in the early stage, according to Professor
    Ma, the deeper the differentiation, the higher the level of development; the divergent
    development of the two subjects is actually moving toward the grand integration
    of education from a broader field. Therefore, the lag of liberal arts can only
    be regarded as a phased "anomaly" in educational development; its subsequent evolution
    should start from new liberal arts education.


    In October 2017, at Hiram College in the US, the concept of new liberal arts education
    was proposed for the first time. Scholars pointed out: New liberal arts refers
    to disciplinary restructuring and arts-sciences crossover relative to traditional
    liberal arts, i.e., integrating new technologies into courses such as philosophy,
    literature, and language, providing students with comprehensive cross-disciplinary
    learning^([\[10\]](#txt007.html#footnote_content_txt007_10)). With the spread
    of the new liberal arts education concept, domestic educational research departments
    first noticed this new educational phenomenon. Against the social background of
    comprehensively revitalizing undergraduate education, the state specifically introduced
    the concept of new liberal arts education into China for the future development
    of liberal arts.


