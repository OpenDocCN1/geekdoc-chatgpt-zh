- raw: '2015年，卡内基梅隆大学的一项研究发现，较之女性，谷歌为男性提供的高薪工作广告更多。这显然不是打击薪酬性别歧视的方式。谷歌使用的其他算法也内嵌了歧视。谷歌的自动完成功能，对“政客”一词给出了以下选项：


    政客是骗子


    政客腐败


    政客是变色龙


    当然，这可能不是一个很合适的例子。我再试试看。谷歌的自动完成功能为“医生”一词给出的选项是：


    医生危险


    医生比教师好


    医生没用


    医生心眼坏


    我说不准我们是否真的想要返回上述答案的算法（哪怕是那条跟教师有关的）。我在这里选择了谷歌，但其他任何搜索引擎里也都可以发现类似的偏见。[^(\[22\])](#chapter001_0008.xhtml#m22)这些算法本身可能的确没有任何明确的偏见，但不管我们是否意识到，我们提供的数据令它们作出了带有偏见的决定。


    很多时候，它可归结为我们对算法的使用方式。假设你开发了一套机器学习算法来预测哪些已定罪的犯罪分子最有可能再次犯罪。你可以使用这样的算法来定位缓刑分子，帮助他们免于沦落到最终入狱的下场。这似乎是该技术的好用处。然而，假设有法官使用相同的算法来决定判刑，对有更大可能重新犯罪的人给予更严厉的刑罚。这种对技术的用法，就比较容易引来质疑了。尤其是，这有可能意味着，黑人最终关监狱的时间比白人更久。事实上，2016年COMPAS[^(\[23\])](#chapter001_0008.xhtml#m23)的一项研究就用计算机程序来预测二次犯罪，发现黑人被告远比白人被告更容易遭到再犯风险更高的误判，而白人被告则比黑人被告更容易遭到再犯率更低的误判。美国法院采用COMPAS的预测来为保释金额、刑期和缓刑期提供信息。算法歧视已经把人锁进不公平里了。


    欧盟正就这个问题采取行动。《一般数据保护条例》（*The General Data Protection Regulation*，GDPR）将于2018年5月生效。条例的第22条规定，欧盟公民有权质疑、反对纯粹以算法为依据做出的决策。目前还不清楚这一条例会怎样执行（甚至也不知道它能不能得到执行）。技术公司将怎样调整，同样不明朗。然而，很明显，我们都需要正视算法歧视问题，各国政府有着重要的监管之责。


    ### 隐私


    人工智能提出巨大伦理挑战的另一个领域是隐私。依靠智能算法筛选海量数据，“老大哥”的运转会好得多。爱德华·斯诺登（Edward Snowden）揭露的内幕，提醒我们许多人意识到人工智能侵入隐私的可怕潜力。事实上，情报机构只有通过人工智能才能筛选收集到的海量数据。


    一如以往，这是一把双刃剑。在正进行（而且似乎永无结束之日）的反恐战争中，我们或许希望能够使用智能技术找出藏在暗处的恐怖分子。另一方面，我们不希望政府知道自己所有和平且民主的想法。让问题变得更复杂的是，我们很多人早就习惯了向Facebook一类的公司无偿又实时地提交有关自己的宝贵信息。有句老话说得好：“如果你不为产品花钱，你就是产品。”


    目前有许多保护个人隐私的方法都正在开发当中。随着我们的设备变得更智能，我们可以把更多的计算从云端推送到设备上。这样，你或许就无须与其他任何人分享个人信息了。此外，还有“差分隐私”（differential
    privacy）等新设想。例如，我们可以为数据库添加“噪声”，保持查询答案不变，但无法再识别个人。不过，在我看来，缺失的环节是政府要退出来。个人需要保护隐私不受政府和公司的侵害。政府机构和公司侵犯我们的隐私，诱惑力太强，又太容易。技术只是让它变得更容易而已。


    ### 错误身份


    把机器错认为人，是好些科幻电影反复出现的一个主题。在经典电影《银翼杀手》（*Blade Runner*）里，哈里森·福特扮演的里克·狄卡（Rick Deckard），跟踪并摧毁在外观上与人类无异的逃脱复制人。然而，电影留下了一个撩人的开放结局，那就是里克·狄卡本身有可能就是个复制人。最近，电影《机械姬》（*Ex
    Machina*）把焦点放在了一种特定类型的图灵测试上，机器人艾娃（Ava）努力伪装得足够像人，骗人帮自己脱逃。而在史上第一部科幻电影《大都会》（*Metropolis*）里，机器人乔装成了名叫玛利亚的女性，造成了工人的暴动。


    因此，将来的某个时候，我们有可能被迫要应对机器被误认为人带来的冲击。考虑到计算机“通过了”图灵测试的有限形式，可以说，这样的未来其实已经到来了。看过莎士比亚的读者都知道，人试图伪装身份的时候，总是有许多危险在等着我们。如果机器模仿我们信任的人，会发生什么？或许它们能够哄骗我们照它们说的做。假设它们拥有跟人水平相当的能力，但只能在低于人的层面上行动，会有什么样的后果？意外说不定会转瞬即至。如果我们对机器产生了社会依附感会怎么样？又或者，更糟糕的话，如果我们爱上机器人了怎么办？前面有整整一片问题的雷区正等着我们。


    ### 危险信号


    技术有可能会破坏、危及我们生活的情况，这并非历史上第一次出现。1865年，因为担心机动车辆影响公众安全，英国议会通过了《机动车法案》（*Locomotive
    Act*）。它要求人赶在机动车辆前面摇红旗，发出信号，提醒危险马上就要到来。当然，公共安全并非这部法律的唯一考量，因为以这种方式限制汽车，铁路能从中获得利益。事实上，该法律限制机动车辆的使用，明显不只是为了安全所需。但它体现出来的精神是好的：公众有权预先获得提醒，了解潜在的危险，直到社会为新技术的到来做好调整。


    有趣的是，30年后的1896年，《机动车法案》撤销，此时汽车的速度限制提高到了每小时14英里（约为23千米）。巧的是，第一起超速违规，以及英国第一起汽车致死事故（可怜的行人布里吉·德里斯科尔），也在同年发生。此后，道路交通事故迅速升级。截至1926年（这是有案可查的第一年），英国道路上仅有1715421辆机动车，但却发生了134000起重伤事故。也就是说，每年每13辆汽车上路，就会发生一起严重伤害。一个世纪以后，我们的公路上有上千人因车祸丧命。


    ### 新法律


    受这些历史先例的启发，我最近提议设定一种避免机器被误当成人的新法律。[^(\[24\])](#chapter001_0008.xhtml#m24)


    **图灵危险信号法**


    一套自主系统应在设计上就使其不可能被误认为是自主系统之外的任何东西，且应在与其他主体进行互动之前就表明其身份。


    这当然不是法律本身，而是对它意图的概述。法律必然更长，更严谨。法律专家和技术人员必须起草这样的法律，措辞需要精心拟定，对术语加以准确的定义。比如，它要对自主系统下个精确的定义。


    这项拟议法律分为两部分。第一部分指出，自主系统的行为方式，在设计上就不应使之有可能被误认为是人。当然，不难想象，在某些情况下，让自主系统被误认为是自主系统之外的东西能带来好处。例如，假装成人类的计算机能创造出更吸引人的虚拟互动。更有争议的是，假装成人的机器人说不定能更好地照料、陪伴老年人。然而，我们也有更多理由不希望计算机愚弄我们，有意或无意地欺骗我们。好莱坞提供了许多涉及此类风险的例子。


    当然，这样的法律会给任何类型的图灵测试带来问题。枪支法律里已经设计了类似的条款。特别是加利福尼亚州州长阿诺德·施瓦辛格（Arnold Schwarzenegger）于2004年9月签署立法，禁止在该州公开展示仿真玩具枪，除非它们涂有鲜艳的颜色，能明确地与真枪区别开来。该法律的目的是避免警察把玩具枪误认为是真枪。


    法律的第二部分规定，自主系统必须在与另一主体进行互动的一开始就表明自己的身份。请注意，这里的其他主体，甚至可以是另一台机器。我是有意这么措辞的。如果你派自己的机器人去谈判购买新车，你希望知道它是在跟人谈话，还是在跟经销商的机器人谈话。你肯定不希望经销商的机器人会因为正在跟你的机器人互动，就假装成人类。法律的这一方面旨在减少自主系统被误认的概率。


    ### 危险信号示例


    我们来看看这项法律可能会触及的4个新兴领域。首先是自动驾驶车辆。依我之见，允许自动驾驶车辆上路的第一份法律文件（内华达州的《AB511》）完全没有提及此类车辆应向其他道路用户表明自动驾驶的身份，是真正的疏忽之举。图灵危险信号法将要求自动驾驶车辆向人类司机及其他自动驾驶车辆表明身份。


    很多时候，知道道路上的另一辆车是自动驾驶的，可能十分重要。举例来说，交通灯信号变化时，我们可以假设迎面而来的自动驾驶车辆会停下，这样我们就用不着为了避免事故而狠踩刹车。再举一个例子，如果大雾里有一辆自动驾驶车辆在我们前面行驶，我们可以假设它借助雷达能清楚看到前面的路。因此，我们不必因为担心它突然刹车而保持较长车距。第三个例子，在十字交叉路口，我们可以假设自动驾驶汽车不会在没有路权的情况下大胆往前冲。第四个也是最后一个例子，如果一辆自动驾驶车辆要转弯了，我们可以预料它会行驶得更为缓慢，以弄清路面状况。


    自动驾驶车辆应该如何表明身份呢？我不认为这需要有个人举着红旗走在前头。就算是在1865年，这也太憋屈了。自动驾驶车辆可以携带特殊的车牌，就像如今我们要求新手自己开车上路表明身份那样。又或者，自动驾驶车辆运行时可以打粉色闪光灯。


    此外，自动驾驶车辆应始终向相邻车辆播报其位置、速度和自主性。2015年6月，路透社报道说，两辆自动驾驶汽车，其一来自谷歌，另一辆来自德尔福公司（Delphi），在硅谷街头差一点儿发生意外。谷歌的车在改变车道时，明显地抢了德尔福汽车的道。德尔福汽车不得不“采取恰当行动”来避免事故。显然，如果自动驾驶汽车播报自己的位置和意图，会有助于避免此类事故发生。当然了，为避免此类广播不损害人类乘客的隐私，还需要设定充分的保障措施。


    等到自动驾驶汽车司空见惯，其他司机就对碰到它们有了心理预期。但在此之前，司机们有必要知道，迎面而来的车辆有些特殊，行为或许跟人类驾驶员不同。过去，要求自动驾驶车辆表明身份似乎没什么必要：这类车辆极少，大多数看起来都挺怪异的（车顶上架设着转动的巨大激光雷达传感器足以透露它们的身份）。然而，如今，同样的技术越来越微型，自动驾驶汽车外观显得愈发正常，要判断一辆车是否是自动驾驶越来越困难了。此外，还有一种倒过来说的观点。假设自动驾驶车辆变成比人类更优秀的驾驶员，那么，就像今天我们要求欠缺经验、能力不足的新手司机表明身份一样，我们或许会要求人类司机表明身份。图灵危险信号法能实现这一点。


    让我们转到图灵危险信号法可能很快会产生影响的第二个领域。想一想虚拟助理，比如苹果的Siri或微软的Cortana。以下是我刚才和Siri展开的对话：


    **与Siri的对话**


    SIRI：我能帮你做些什么？


    问：你是计算机吗？


    SIRI：就我目前的存在形式，我不能确认，也不能否认。


    问：你是人吗？


    SIRI：我是助理。这才是关键。


    问：你是人工智能吗？


    SIRI：这个问题太私人了。


    从这类的对话来看，Siri似乎很接近违反上文拟议的图灵危险信号法。它不表明自己的计算机身份就开始对话，而且它的回答方式建立在你的幽默感之上，有可能会造成欺骗效果。至少，过不了几年，对话变得更复杂，你都可以想象自己遭到欺骗的情形。当然，现在相信Siri是人的用户很少。只需要问几个问题，就能让Siri暴露“非人”身份。不过，让安装在数百万台智能手机上的日用技术显得像是人（尽管它的表现比较蹩脚），恐怕设定了一个危险的先例。


    有好几种容易信任他人的群体，说不定已经上当受骗了。我女儿有个洋娃娃，跟Siri建立了蓝牙连接，能回答若干一般性问题。我说不准女儿是不是完全理解，这些聪明的工作全都是智能手机完成的。此外，还有患有阿尔茨海默病和出现其他形式智力减退症状的群体。Paro是一只讨人喜欢的机器海豹，它正在接受测试，作为帮助此类患者的治疗工具。有些人认为，把一只机器海豹误认为是真的，很令人费解。想象一下，如果这类患者把人工智能系统误认为是人类，这会给社会带来多大的困扰啊。


    让我们进入第三个例子：在线扑克。这是一个价值数十亿美元的行业，不妨说这里的赌注很高。大多数（甚至于全部）在线扑克网站都已禁止计算机程序玩了。程序的优势太大了，尤其是对较弱的玩家：程序永远不会疲倦，可以非常准确地计算赔率，非常准确地追踪历史牌局。当然，按照现在的技术水平，它们也有弱点，比如理解对手心理的能力较差。然而，出于公平起见，我猜大多数人类扑克玩家都愿意知道自己的对手是不是真正的人类。此类观点也可能被其他在线计算机游戏提出。你恐怕想知道，你“死得”这么容易，只是因为对手是计算机程序，条件反射跟光速一样快。


    最后，我要举第四个例子：计算机生成文本。美联社现在使用Automated Insights开发的一套计算机程序，生成大部分美国企业盈利报告。狭义的阐释，可以把这种计算机生成文本排除在图灵危险信号法之外。文本生成算法通常没有自主性。实际上，它们大多也不互动。可如果我们从更长的时间尺度来考虑，这种算法仍然是以某种形式跟真实世界互动，它们生成的内容很有可能被误认为是人写出来的文本。


    就个人而言，我乐于知道自己正在阅读的文本是出自人类之手还是出自计算机之手。知道这个情况，可能会影响我对这段作品的情绪投入度，但我也接受如今我们正处于灰色地带的现实。自动生成的股票价格表和气象图不自动表明身份，你或许无所谓，但计算机生成的比赛报告，你恐怕希望它自报家门吧？如果报道世界杯比赛的电视节目评论，不是有史以来最优秀的足球运动员利昂内尔·梅西（Lionel
    Messi），而是一台声音像是梅西的计算机，那会怎么样？


    一如这些例子所示，要弄清该用图灵危险信号法在哪里划定界限，我们仍然还有一段路要走。但我主张，不管是在什么地方，这条界限应该划出来。


    ### 反对危险信号法


    有几个观点，可以提出来反对图灵危险信号法。一是认为担心这个问题还为时过早。事实上，在今天给这个问题打上记号，只能给人工智能的糟糕炒作增加噱头。出于若干原因，我认为这一观点不成立。


    首先，自动驾驶汽车可能几年内就会推广开来。2011年6月，内华达州州长签署了《AB511法》，这是全世界第一部明确允许自动驾驶车辆的立法。我之前说过，令人吃惊的是，法令并未说明自动驾驶车辆是否有必要表明自己的身份。


    其次，我们中许多人都受过计算机的愚弄。几年前，有个朋友问我，自助结账服务是怎样识别不同的水果和蔬菜的。我以为那是一种基于形状和颜色的分类算法。但紧接着，我朋友就指给我看了身后的中央监视系统，原来分类是人类操作员完成的。机器与人之间的界限正迅速变得模糊，哪怕是业内专家也可能犯错。图灵危险信号法有助于保持边界的清晰。


    第三，人类常常以为计算机拥有一些它们本来并没有的功能。前文最后一个例子就对此作了阐释。还有一个例子则是，我让学生跟机器狗Aibo玩上一会儿，他们立刻为它附加上了情绪和感受，但机器狗其实既没有情绪，也没有感受。自主系统还远不能像人类一样行事的时候，就在愚弄我们了。


    第四，对一切新技术而言，即将获得接纳但社会又尚未适应的时候，是它最危险的时刻。很可能，像今天的机动车一样，一旦人工智能系统成为常态，社会就会废除图灵危险信号法。但趁着它们还很罕见的时候，我们恐怕需要更谨慎地采取行动。


    在美国的许多州，还有澳大利亚、加拿大和德国等国家，如果电话通话要录音，对方必须告知你。说不定，将来你会听到如下的介绍：“你即将与人工智能机器人互动。如果你不希望这么做，请按1键转为真人接听。”


    以上论述的是各种有可能妨碍我们实现思考机器的限制条件，下面让我们来看看，哪些力量有可能让我们更快实现思考机器。


    ### 奇点


    实现思考机器，接着迅速发展，进入“超级智能”时代，有一条简单的路线，这就是所谓的“技术奇点”。这个概念可追溯到许多不同的思想家，约翰·冯·诺依曼[^(\[25\])](#chapter001_0008.xhtml#m25)就是最初想到它的人之一。1957年，诺依曼去世后，数学家斯塔尼斯拉夫·乌拉姆（Stanislaw
    Ulam）写道：“和（冯·诺依曼）进行了一番谈话，主要谈的是不断加速发展的技术以及人类生活模式的变化，将使得人类历史上出现某个重要的奇点，在此之后，传统的人类之道无以为继。”[^(\[26\])](#chapter001_0008.xhtml#m26)


    技术奇点概念背后的另一个人是I.J.古德。1965年，他提到了“智能爆炸”，他没有使用“奇点”这个词，但想法基本一样：


    让我们将超级智能机器定义为一台在一切智能活动上都远超人类的机器，不管人有多聪明。既然设计机器属于这类智能活动的范围，那么一台超级智能机器当然能够设计出更出色的机器。故此毫无疑问会出现一场“智能爆炸”，把人的智力远远抛在身后。是以，第一台超级智能机器也就成为人类最后的发明了……[^(\[27\])](#chapter001_0008.xhtml#m27)


    尽管这些引文出自20世纪50年代和60年代，许多人还是把技术奇点的概念算到了计算机科学家弗诺·文奇（Vernor Vinge）头上。1993年，文奇预测说：“30年之内，我们将拥有创造超人类智能的技术途径。不久之后，人类的时代就会结束。”[^(\[28\])](#chapter001_0008.xhtml#m28)此前，文奇在几本科幻小说里写到过技术奇点，第一本是1981年的开创性赛博朋克小说《真名实姓》（True
    Names）。


    之后，未来学家雷·库兹韦尔和牛津大学哲学家尼克·波斯特洛姆推广了技术奇点的概念。[^(\[29\])](#chapter001_0008.xhtml#m29)按照目前的趋势，库兹韦尔预测技术奇点将在2045年左右出现。着眼于本书的目的，我认为技术奇点指的是一个时间点，届时，我们将制造出一台具备足够智能，可以对自己进行重新设计以提高智能的机器。而一旦达到这个点，该机器的智能就开始呈指数级增长，迅速在量级上超过人类智能。


    现在许多人担心的是到了技术奇点那一天，人工智能给人类带来的风险。波斯特洛姆等哲学家担心思考机器会发展过快，人类根本没有时间监控它们的发展。然而，我马上就会解释，出于诸多理由，机器很可能无法反复自我改进，我们说不定永远也看不到技术奇点的到来。


    ### 数学上的两点困惑


    我在数学上的第一点困惑在于，用“技术奇点”来描述机器反复地提升自身智能这个概念，蹩脚透顶。按数学家的用法，这并不是奇点。若t=10，则函数具有数学奇点。随着t越来越接近10，函数趋近于无限。事实上，随着t接近10，函数的斜率也变成了无限，数学家称之为双曲线增长。“技术奇点”的支持者通常指的是指数增长，它比双曲线增长慢得多。函数随时间步长的常数倍增长，这叫作指数增长。举例来说，每当t增加1，指数函数翻一倍。这样的函数达到无限的速度，比双曲线函数慢得多。此外，指数函数的斜率始终是有限的。事实上，正因为斜率仅为值的倍数，指数函数样子很漂亮。由于值是有限的，其斜率也是有限的。'
  fmt: '

    2015年，卡内基梅隆大学的一项研究发现，较之女性，谷歌为男性提供的高薪工作广告更多。这显然不是打击薪酬性别歧视的方式。谷歌使用的其他算法也内嵌了歧视。谷歌的自动完成功能，对“政客”一词给出了以下选项：


    政客是骗子

    政客腐败

    政客是变色龙


    当然，这可能不是一个很合适的例子。我再试试看。谷歌的自动完成功能为“医生”一词给出的选项是：


    医生危险

    医生比教师好

    医生没用

    医生心眼坏


    我说不准我们是否真的想要返回上述答案的算法（哪怕是那条跟教师有关的）。我在这里选择了谷歌，但其他任何搜索引擎里也都可以发现类似的偏见。[^(\[22\])](#chapter001_0008.xhtml#m22)这些算法本身可能的确没有任何明确的偏见，但不管我们是否意识到，我们提供的数据令它们作出了带有偏见的决定。


    很多时候，它可归结为我们对算法的使用方式。假设你开发了一套机器学习算法来预测哪些已定罪的犯罪分子最有可能再次犯罪。你可以使用这样的算法来定位缓刑分子，帮助他们免于沦落到最终入狱的下场。这似乎是该技术的好用处。然而，假设有法官使用相同的算法来决定判刑，对有更大可能重新犯罪的人给予更严厉的刑罚。这种对技术的用法，就比较容易引来质疑了。尤其是，这有可能意味着，黑人最终关监狱的时间比白人更久。事实上，2016年COMPAS[^(\[23\])](#chapter001_0008.xhtml#m23)的一项研究就用计算机程序来预测二次犯罪，发现黑人被告远比白人被告更容易遭到再犯风险更高的误判，而白人被告则比黑人被告更容易遭到再犯率更低的误判。美国法院采用COMPAS的预测来为保释金额、刑期和缓刑期提供信息。算法歧视已经把人锁进不公平里了。


    欧盟正就这个问题采取行动。《一般数据保护条例》（*The General Data Protection Regulation*，GDPR）将于2018年5月生效。条例的第22条规定，欧盟公民有权质疑、反对纯粹以算法为依据做出的决策。目前还不清楚这一条例会怎样执行（甚至也不知道它能不能得到执行）。技术公司将怎样调整，同样不明朗。然而，很明显，我们都需要正视算法歧视问题，各国政府有着重要的监管之责。


    ## 隐私


    人工智能提出巨大伦理挑战的另一个领域是隐私。依靠智能算法筛选海量数据，“老大哥”的运转会好得多。爱德华·斯诺登（Edward Snowden）揭露的内幕，提醒我们许多人意识到人工智能侵入隐私的可怕潜力。事实上，情报机构只有通过人工智能才能筛选收集到的海量数据。


    一如以往，这是一把双刃剑。在正进行（而且似乎永无结束之日）的反恐战争中，我们或许希望能够使用智能技术找出藏在暗处的恐怖分子。另一方面，我们不希望政府知道自己所有和平且民主的想法。让问题变得更复杂的是，我们很多人早就习惯了向Facebook一类的公司无偿又实时地提交有关自己的宝贵信息。有句老话说得好：“如果你不为产品花钱，你就是产品。”


    目前有许多保护个人隐私的方法都正在开发当中。随着我们的设备变得更智能，我们可以把更多的计算从云端推送到设备上。这样，你或许就无须与其他任何人分享个人信息了。此外，还有“差分隐私”（differential
    privacy）等新设想。例如，我们可以为数据库添加“噪声”，保持查询答案不变，但无法再识别个人。不过，在我看来，缺失的环节是政府要退出来。个人需要保护隐私不受政府和公司的侵害。政府机构和公司侵犯我们的隐私，诱惑力太强，又太容易。技术只是让它变得更容易而已。


    ## 错误身份


    把机器错认为人，是好些科幻电影反复出现的一个主题。在经典电影《银翼杀手》（*Blade Runner*）里，哈里森·福特扮演的里克·狄卡（Rick Deckard），跟踪并摧毁在外观上与人类无异的逃脱复制人。然而，电影留下了一个撩人的开放结局，那就是里克·狄卡本身有可能就是个复制人。最近，电影《机械姬》（*Ex
    Machina*）把焦点放在了一种特定类型的图灵测试上，机器人艾娃（Ava）努力伪装得足够像人，骗人帮自己脱逃。而在史上第一部科幻电影《大都会》（*Metropolis*）里，机器人乔装成了名叫玛利亚的女性，造成了工人的暴动。


    因此，将来的某个时候，我们有可能被迫要应对机器被误认为人带来的冲击。考虑到计算机“通过了”图灵测试的有限形式，可以说，这样的未来其实已经到来了。看过莎士比亚的读者都知道，人试图伪装身份的时候，总是有许多危险在等着我们。如果机器模仿我们信任的人，会发生什么？或许它们能够哄骗我们照它们说的做。假设它们拥有跟人水平相当的能力，但只能在低于人的层面上行动，会有什么样的后果？意外说不定会转瞬即至。如果我们对机器产生了社会依附感会怎么样？又或者，更糟糕的话，如果我们爱上机器人了怎么办？前面有整整一片问题的雷区正等着我们。


    ## 危险信号


    技术有可能会破坏、危及我们生活的情况，这并非历史上第一次出现。1865年，因为担心机动车辆影响公众安全，英国议会通过了《机动车法案》（*Locomotive
    Act*）。它要求人赶在机动车辆前面摇红旗，发出信号，提醒危险马上就要到来。当然，公共安全并非这部法律的唯一考量，因为以这种方式限制汽车，铁路能从中获得利益。事实上，该法律限制机动车辆的使用，明显不只是为了安全所需。但它体现出来的精神是好的：公众有权预先获得提醒，了解潜在的危险，直到社会为新技术的到来做好调整。


    有趣的是，30年后的1896年，《机动车法案》撤销，此时汽车的速度限制提高到了每小时14英里（约为23千米）。巧的是，第一起超速违规，以及英国第一起汽车致死事故（可怜的行人布里吉·德里斯科尔），也在同年发生。此后，道路交通事故迅速升级。截至1926年（这是有案可查的第一年），英国道路上仅有1715421辆机动车，但却发生了134000起重伤事故。也就是说，每年每13辆汽车上路，就会发生一起严重伤害。一个世纪以后，我们的公路上有上千人因车祸丧命。


    ## 新法律


    受这些历史先例的启发，我最近提议设定一种避免机器被误当成人的新法律。[^(\[24\])](#chapter001_0008.xhtml#m24)


    **图灵危险信号法**


    一套自主系统应在设计上就使其不可能被误认为是自主系统之外的任何东西，且应在与其他主体进行互动之前就表明其身份。


    这当然不是法律本身，而是对它意图的概述。法律必然更长，更严谨。法律专家和技术人员必须起草这样的法律，措辞需要精心拟定，对术语加以准确的定义。比如，它要对自主系统下个精确的定义。


    这项拟议法律分为两部分。第一部分指出，自主系统的行为方式，在设计上就不应使之有可能被误认为是人。当然，不难想象，在某些情况下，让自主系统被误认为是自主系统之外的东西能带来好处。例如，假装成人类的计算机能创造出更吸引人的虚拟互动。更有争议的是，假装成人的机器人说不定能更好地照料、陪伴老年人。然而，我们也有更多理由不希望计算机愚弄我们，有意或无意地欺骗我们。好莱坞提供了许多涉及此类风险的例子。


    当然，这样的法律会给任何类型的图灵测试带来问题。枪支法律里已经设计了类似的条款。特别是加利福尼亚州州长阿诺德·施瓦辛格（Arnold Schwarzenegger）于2004年9月签署立法，禁止在该州公开展示仿真玩具枪，除非它们涂有鲜艳的颜色，能明确地与真枪区别开来。该法律的目的是避免警察把玩具枪误认为是真枪。


    法律的第二部分规定，自主系统必须在与另一主体进行互动的一开始就表明自己的身份。请注意，这里的其他主体，甚至可以是另一台机器。我是有意这么措辞的。如果你派自己的机器人去谈判购买新车，你希望知道它是在跟人谈话，还是在跟经销商的机器人谈话。你肯定不希望经销商的机器人会因为正在跟你的机器人互动，就假装成人类。法律的这一方面旨在减少自主系统被误认的概率。


    ## 危险信号示例


    我们来看看这项法律可能会触及的4个新兴领域。首先是自动驾驶车辆。依我之见，允许自动驾驶车辆上路的第一份法律文件（内华达州的《AB511》）完全没有提及此类车辆应向其他道路用户表明自动驾驶的身份，是真正的疏忽之举。图灵危险信号法将要求自动驾驶车辆向人类司机及其他自动驾驶车辆表明身份。


    很多时候，知道道路上的另一辆车是自动驾驶的，可能十分重要。举例来说，交通灯信号变化时，我们可以假设迎面而来的自动驾驶车辆会停下，这样我们就用不着为了避免事故而狠踩刹车。再举一个例子，如果大雾里有一辆自动驾驶车辆在我们前面行驶，我们可以假设它借助雷达能清楚看到前面的路。因此，我们不必因为担心它突然刹车而保持较长车距。第三个例子，在十字交叉路口，我们可以假设自动驾驶汽车不会在没有路权的情况下大胆往前冲。第四个也是最后一个例子，如果一辆自动驾驶车辆要转弯了，我们可以预料它会行驶得更为缓慢，以弄清路面状况。


    自动驾驶车辆应该如何表明身份呢？我不认为这需要有个人举着红旗走在前头。就算是在1865年，这也太憋屈了。自动驾驶车辆可以携带特殊的车牌，就像如今我们要求新手自己开车上路表明身份那样。又或者，自动驾驶车辆运行时可以打粉色闪光灯。


    此外，自动驾驶车辆应始终向相邻车辆播报其位置、速度和自主性。2015年6月，路透社报道说，两辆自动驾驶汽车，其一来自谷歌，另一辆来自德尔福公司（Delphi），在硅谷街头差一点儿发生意外。谷歌的车在改变车道时，明显地抢了德尔福汽车的道。德尔福汽车不得不“采取恰当行动”来避免事故。显然，如果自动驾驶汽车播报自己的位置和意图，会有助于避免此类事故发生。当然了，为避免此类广播不损害人类乘客的隐私，还需要设定充分的保障措施。


    等到自动驾驶汽车司空见惯，其他司机就对碰到它们有了心理预期。但在此之前，司机们有必要知道，迎面而来的车辆有些特殊，行为或许跟人类驾驶员不同。过去，要求自动驾驶车辆表明身份似乎没什么必要：这类车辆极少，大多数看起来都挺怪异的（车顶上架设着转动的巨大激光雷达传感器足以透露它们的身份）。然而，如今，同样的技术越来越微型，自动驾驶汽车外观显得愈发正常，要判断一辆车是否是自动驾驶越来越困难了。此外，还有一种倒过来说的观点。假设自动驾驶车辆变成比人类更优秀的驾驶员，那么，就像今天我们要求欠缺经验、能力不足的新手司机表明身份一样，我们或许会要求人类司机表明身份。图灵危险信号法能实现这一点。


    让我们转到图灵危险信号法可能很快会产生影响的第二个领域。想一想虚拟助理，比如苹果的Siri或微软的Cortana。以下是我刚才和Siri展开的对话：


    **与Siri的对话**


    SIRI：我能帮你做些什么？

    问：你是计算机吗？

    SIRI：就我目前的存在形式，我不能确认，也不能否认。

    问：你是人吗？

    SIRI：我是助理。这才是关键。

    问：你是人工智能吗？

    SIRI：这个问题太私人了。


    从这类的对话来看，Siri似乎很接近违反上文拟议的图灵危险信号法。它不表明自己的计算机身份就开始对话，而且它的回答方式建立在你的幽默感之上，有可能会造成欺骗效果。至少，过不了几年，对话变得更复杂，你都可以想象自己遭到欺骗的情形。当然，现在相信Siri是人的用户很少。只需要问几个问题，就能让Siri暴露“非人”身份。不过，让安装在数百万台智能手机上的日用技术显得像是人（尽管它的表现比较蹩脚），恐怕设定了一个危险的先例。


    有好几种容易信任他人的群体，说不定已经上当受骗了。我女儿有个洋娃娃，跟Siri建立了蓝牙连接，能回答若干一般性问题。我说不准女儿是不是完全理解，这些聪明的工作全都是智能手机完成的。此外，还有患有阿尔茨海默病和出现其他形式智力减退症状的群体。Paro是一只讨人喜欢的机器海豹，它正在接受测试，作为帮助此类患者的治疗工具。有些人认为，把一只机器海豹误认为是真的，很令人费解。想象一下，如果这类患者把人工智能系统误认为是人类，这会给社会带来多大的困扰啊。


    让我们进入第三个例子：在线扑克。这是一个价值数十亿美元的行业，不妨说这里的赌注很高。大多数（甚至于全部）在线扑克网站都已禁止计算机程序玩了。程序的优势太大了，尤其是对较弱的玩家：程序永远不会疲倦，可以非常准确地计算赔率，非常准确地追踪历史牌局。当然，按照现在的技术水平，它们也有弱点，比如理解对手心理的能力较差。然而，出于公平起见，我猜大多数人类扑克玩家都愿意知道自己的对手是不是真正的人类。此类观点也可能被其他在线计算机游戏提出。你恐怕想知道，你“死得”这么容易，只是因为对手是计算机程序，条件反射跟光速一样快。


    最后，我要举第四个例子：计算机生成文本。美联社现在使用Automated Insights开发的一套计算机程序，生成大部分美国企业盈利报告。狭义的阐释，可以把这种计算机生成文本排除在图灵危险信号法之外。文本生成算法通常没有自主性。实际上，它们大多也不互动。可如果我们从更长的时间尺度来考虑，这种算法仍然是以某种形式跟真实世界互动，它们生成的内容很有可能被误认为是人写出来的文本。


    就个人而言，我乐于知道自己正在阅读的文本是出自人类之手还是出自计算机之手。知道这个情况，可能会影响我对这段作品的情绪投入度，但我也接受如今我们正处于灰色地带的现实。自动生成的股票价格表和气象图不自动表明身份，你或许无所谓，但计算机生成的比赛报告，你恐怕希望它自报家门吧？如果报道世界杯比赛的电视节目评论，不是有史以来最优秀的足球运动员利昂内尔·梅西（Lionel
    Messi），而是一台声音像是梅西的计算机，那会怎么样？


    一如这些例子所示，要弄清该用图灵危险信号法在哪里划定界限，我们仍然还有一段路要走。但我主张，不管是在什么地方，这条界限应该划出来。


    ## 反对危险信号法


    有几个观点，可以提出来反对图灵危险信号法。一是认为担心这个问题还为时过早。事实上，在今天给这个问题打上记号，只能给人工智能的糟糕炒作增加噱头。出于若干原因，我认为这一观点不成立。


    首先，自动驾驶汽车可能几年内就会推广开来。2011年6月，内华达州州长签署了《AB511法》，这是全世界第一部明确允许自动驾驶车辆的立法。我之前说过，令人吃惊的是，法令并未说明自动驾驶车辆是否有必要表明自己的身份。


    其次，我们中许多人都受过计算机的愚弄。几年前，有个朋友问我，自助结账服务是怎样识别不同的水果和蔬菜的。我以为那是一种基于形状和颜色的分类算法。但紧接着，我朋友就指给我看了身后的中央监视系统，原来分类是人类操作员完成的。机器与人之间的界限正迅速变得模糊，哪怕是业内专家也可能犯错。图灵危险信号法有助于保持边界的清晰。


    第三，人类常常以为计算机拥有一些它们本来并没有的功能。前文最后一个例子就对此作了阐释。还有一个例子则是，我让学生跟机器狗Aibo玩上一会儿，他们立刻为它附加上了情绪和感受，但机器狗其实既没有情绪，也没有感受。自主系统还远不能像人类一样行事的时候，就在愚弄我们了。


    第四，对一切新技术而言，即将获得接纳但社会又尚未适应的时候，是它最危险的时刻。很可能，像今天的机动车一样，一旦人工智能系统成为常态，社会就会废除图灵危险信号法。但趁着它们还很罕见的时候，我们恐怕需要更谨慎地采取行动。


    在美国的许多州，还有澳大利亚、加拿大和德国等国家，如果电话通话要录音，对方必须告知你。说不定，将来你会听到如下的介绍：“你即将与人工智能机器人互动。如果你不希望这么做，请按1键转为真人接听。”


    以上论述的是各种有可能妨碍我们实现思考机器的限制条件，下面让我们来看看，哪些力量有可能让我们更快实现思考机器。


    ## 奇点


    实现思考机器，接着迅速发展，进入“超级智能”时代，有一条简单的路线，这就是所谓的“技术奇点”。这个概念可追溯到许多不同的思想家，约翰·冯·诺依曼[^(\[25\])](#chapter001_0008.xhtml#m25)就是最初想到它的人之一。1957年，诺依曼去世后，数学家斯塔尼斯拉夫·乌拉姆（Stanislaw
    Ulam）写道：“和（冯·诺依曼）进行了一番谈话，主要谈的是不断加速发展的技术以及人类生活模式的变化，将使得人类历史上出现某个重要的奇点，在此之后，传统的人类之道无以为继。”[^(\[26\])](#chapter001_0008.xhtml#m26)


    技术奇点概念背后的另一个人是I.J.古德。1965年，他提到了“智能爆炸”，他没有使用“奇点”这个词，但想法基本一样：


    让我们将超级智能机器定义为一台在一切智能活动上都远超人类的机器，不管人有多聪明。既然设计机器属于这类智能活动的范围，那么一台超级智能机器当然能够设计出更出色的机器。故此毫无疑问会出现一场“智能爆炸”，把人的智力远远抛在身后。是以，第一台超级智能机器也就成为人类最后的发明了……[^(\[27\])](#chapter001_0008.xhtml#m27)


    尽管这些引文出自20世纪50年代和60年代，许多人还是把技术奇点的概念算到了计算机科学家弗诺·文奇（Vernor Vinge）头上。1993年，文奇预测说：“30年之内，我们将拥有创造超人类智能的技术途径。不久之后，人类的时代就会结束。”[^(\[28\])](#chapter001_0008.xhtml#m28)此前，文奇在几本科幻小说里写到过技术奇点，第一本是1981年的开创性赛博朋克小说《真名实姓》（True
    Names）。


    之后，未来学家雷·库兹韦尔和牛津大学哲学家尼克·波斯特洛姆推广了技术奇点的概念。[^(\[29\])](#chapter001_0008.xhtml#m29)按照目前的趋势，库兹韦尔预测技术奇点将在2045年左右出现。着眼于本书的目的，我认为技术奇点指的是一个时间点，届时，我们将制造出一台具备足够智能，可以对自己进行重新设计以提高智能的机器。而一旦达到这个点，该机器的智能就开始呈指数级增长，迅速在量级上超过人类智能。


    现在许多人担心的是到了技术奇点那一天，人工智能给人类带来的风险。波斯特洛姆等哲学家担心思考机器会发展过快，人类根本没有时间监控它们的发展。然而，我马上就会解释，出于诸多理由，机器很可能无法反复自我改进，我们说不定永远也看不到技术奇点的到来。


    ## 数学上的两点困惑


    我在数学上的第一点困惑在于，用“技术奇点”来描述机器反复地提升自身智能这个概念，蹩脚透顶。按数学家的用法，这并不是奇点。若t=10，则函数具有数学奇点。随着t越来越接近10，函数趋近于无限。事实上，随着t接近10，函数的斜率也变成了无限，数学家称之为双曲线增长。“技术奇点”的支持者通常指的是指数增长，它比双曲线增长慢得多。函数随时间步长的常数倍增长，这叫作指数增长。举例来说，每当t增加1，指数函数翻一倍。这样的函数达到无限的速度，比双曲线函数慢得多。此外，指数函数的斜率始终是有限的。事实上，正因为斜率仅为值的倍数，指数函数样子很漂亮。由于值是有限的，其斜率也是有限的。

