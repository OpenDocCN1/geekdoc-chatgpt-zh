- raw: "\n\n# 版权信息\n\nCOPYRIGHT\n\n书名：人工智能会取代人类吗？  \n\n作者：【澳大利亚】托比·沃尔什  \n\n出版社：北京联合出版公司·时代华语\
    \  \n\n出版时间：2018年7月  \n\nISBN：9787559621221  \n\n本书由北京时代华语国际传媒股份有限公司 授权得到APP电子版制作与发行\
    \  \n\n版权所有·侵权必究\n\n# 代序\n\n2005年，在庆祝《科学》杂志（*science*）创刊125周年之际，该杂志社公布了125个最具挑战性的科学问题。在这125个问题中，和人工智能相关的问题只有一个——第94个问题——“通过计算机进行学习的极限是什么？”。\n\
    \n编写这些问题的专家那时也许还不知道，在2005年人工智能已经悄然发生了巨变。以Geoffery Hinton（辛顿）为首的一批计算机科学家应用多层神经网络的算法，借助大数据和高性能计算，带来崭新的智能计算效果，揭开人类新一轮工业革命的帷幕。以深度学习为首的重大变革正在悄然席卷整个人工智能行业。同样，2015年的《科学》杂志刊登了辛顿和学生的文章：“深度学习”。\n\
    \n之后的人工智能的历史我们都经历了。在2016年的3月，人工智能系统AlphaGO击败了人类围棋世界冠军李世石，其中深度学习大放异彩。但要说明的是，AlphaGO的这个成就包括了人工智能近期努力的所有结晶：深度学习、强化学习和蒙特卡洛树搜索。\n\
    \nAlphaGO的惊人成就也为社会带来了空前的好奇：人工智能到底是什么？这些科学家在过去60年做了些什么？人工智能的未来将走向哪里？\n\n这些问题也是伟大的哲学家们常问的问题：我们是谁？我们从哪里来？我们去向何方？\n\
    \n而这些问题的重要性远大于人们的好奇心。当蒸汽机刚刚出现的时候，不少人还没有意识到工业革命将因此而发生，以至于没有为后面发生的重大社会经济变革做好准备。工业革命的发生，为竞争者提供了弯道超车的机会。历史告诉我们，这样的机会在一个人的一生当中最多只有一两次。现在，我们终于看到了有强大学习能力的人工智能。那么，人工智能将为人类社会带来哪些机遇呢？\n\
    \n这本书的作者Toby Walsh教授是回答这些问题的最佳人选。我认识Walsh 教授有十多年了。印象比较深的一次是2011年在西班牙举办的国际人工智能联合大会（IJCAI）\
    \ ，那年Walsh教授是会议的程序委员会主席。IJCAI会议往往是找领域内最有学术成就的人士来担任会议主席，而Walsh教授是这些学者中最有社会责任感的。他不仅将一千多人的大会办得有声有色，而且在这次和以后的几次会议上，他主持的人工智能与社会影响方面的特别讨论会，场场都爆满。他睿智，幽默，很有洞察力和感召力。在2017年的IJCAI大会上，Walsh教授率先发布公开信，带领国际知名人士如太空探索技术公司（SpaceX）CEO兼CTO、特斯拉公司CEO兼产品架构师、太阳城公司（SolarCity）董事会主席埃隆·马斯克（Elon\
    \ Musk）等呼吁禁止人工智能武器的开发。\n\n今天，中国的人工智能已经在世界舞台上有了举足轻重的分量。在2011年的IJCAI大会上，一个中国公司赞助商的影子都看不到。而在2017年在墨尔本举行的IJCAI大会上，中国公司赞助商则成为主力军；中国的投稿量和文章录取数已经超过美国和欧洲，成为世界第一；文章质量也稳步提升，成为世界关注的焦点。就在不久前，中国在国家战略层面决定大规模投资人工智能研究和产业。中国国务院印发《新一代人工智能发展规划》，提出了面向2030年中国新一代人工智能发展的指导思想、战略目标、重点任务和保障措施，部署构筑我国人工智能发展的先发优势，加快建设创新型国家和世界科技强国。\n\
    \n在这样的大变革时代，Walsh教授的这本新作来得正是时候。在众多人工智能的新书中，这本书的内容涵盖最广，从人工智能的缘起、发展到未来可能对人类社会产生的影响，都有直接、全面的回答。\n\
    \n所以，如果今天《科学》杂志再次公布最具挑战性的科学问题的话，一定会有关于人工智能的问题。因为人工智能确实关乎人类社会的终极挑战：我们是谁？我们从哪里来？我们去向何方？\n\
    \n杨强\n\n2018年4月2日\n\n# 代序\n\n这本书值得一读！\n\n最近两年，雨后春笋般冒出许多关于人工智能的书籍，但是Toby Walsh教授的这本书有所不同：\n\
    \n首先，这本书全面涉及了人工智能的过去、现在和未来，从人工智能研究的历史、现状、局限、挑战，到社会影响、职业威胁、技术奇点、自主武器……几乎无所不包。前三章帮助读者了解人工智能的发展历程和技术现状，后四章则探讨其社会意义和深远影响。可以说，一般读者对人工智能所希望了解的主要内容都可以在这里找到，覆盖面如此之广，实属难得。\n\
    \n第二，这是一本由国际人工智能学界一流专家撰写的科普书。作者Toby Walsh教授是澳大利亚科学院院士，也是国际人工智能学会会士（AAAI Fellow），这是国际人工智能学界的崇高荣誉，标志着作者是业内公认的权威专家。市面上关于人工智能的书籍虽多，但水准良莠不齐，由国际一线权威专家撰写的高质量科普著作尤为少见。\n\
    \n第三，这本书很好读。人工智能是计算机学科的主流分支之一，很多研究内容涉及繁复的理论推导和程序实现。但本书读起来却很轻松，全书甚至没有使用任何数学公式！恐怕正因为作者是真正的专家，才能通俗易懂、简单明了地说清复杂的问题。这不啻是读者的福音，各种知识背景的读者都能通过本书对人工智能有一个全景式的概貌了解。\n\
    \nToby Walsh教授与愚常在国际学术会议上碰面。8月初他请作序，愚因未读不敢妄评。Toby即请国外出版社惠寄样书，不料连邮两次均未收到。11月底才拿到英文书稿。抽空读罢，深感出色，尤其前三章深入浅出，注释的熟人故事妙趣横生，其后各章亦纵横捭阖，令人不忍释卷。冀望中译本能准确传递原貌，以使本书惠及更多读者。\n\
    \n![](Images/image7-443.png)\n\n2018年3月于南京\n\n# 中文版前言\n\n在即将到来的人工智能革命中，中国已经将自己放到了中心的位置。我很高兴这本书的中文版能够付梓。见证本书讨论的巨大变化，中国必定是个绝佳的地方。事实上，中国似乎有望引领我们走向这一未来。\n\
    \n5年前，我们许多从事人工智能工作的人，看到中国展现出了可观的潜力。中国加大了对大学的资金投入，并拥有广泛的人才队伍。为了帮助并激励中国研究界，2013年，我们决定将顶尖的人工智能大会——国际人工智能联合会议——放到中国举办。\n\
    \n今天，我们看到，当初的潜力逐一变成了现实。作为后起之秀的中国已跻身研究和实践两方面的顶尖国家之列。2017年9月，高盛公司发布报告，名为《中国在人工智能中崛起》，介绍了世界第二大经济体怎样应用人工智能推动经济进步，成为重要的全球角逐者。\n\
    \n在学术界，中国也日益成为重要角色。2017年，提交给国际人工智能联合会议的报告，1/3来自中国，数量等于美国和欧洲所提交材料的总和。此外，尽管这次会议在澳大利亚召开，仍有1/4的代表来自中国。\n\
    \n中国把自己的未来公开地押注在了人工智能上。这是深思熟虑的决定，极有成功的把握。中国的人口逐渐城市化，面临着人口结构发生变化的挑战。中国需要人工智能带来的生产力，继续与周围生产成本更低的邻国竞争，满足本国越来越庞大的中间阶层人口。\n\
    \n2017年7月，中国政府公布了一份发展规划，计划到2030年成为人工智能的全球领跑者，创造10万亿元产值的国内人工智能行业。现在有迹象表明，该计划正顺利推进。\n\
    \n中国有许多天然的优势，可以帮助它赢得这场人工智能赛跑。类似谷歌、Facebook和亚马逊这样的美国大型科技巨头为数极少。中国却有着可与之一较高下的竞争者：腾讯、阿里巴巴和百度等公司。\n\
    \n中国还有可提供给人工智能算法的数据。中国拥有7.5亿互联网用户（包括全世界最大的智能手机用户市场），贡献出一口庞大的数据金矿。腾讯的微信软件，在全球有着近10亿用户，阿里巴巴集团则拥有5亿淘宝活跃买家。\n\
    \n这些中国公司，有许多都为人工智能投入了数亿人民币。此外，中国政府出台了有利于这些中国公司发展的保护政策，后者从前“山寨”硅谷，如今反倒常常一路领先。\n\
    \n自从5000年前发明算盘之后，计算的历史似乎没怎么朝中国投去目光。但未来一两百年里，人工智能的历史很可能会把视线大量汇聚在这个全世界人口最多、届时甚至可能是最为富裕的国家身上。\n\
    \n致A与B\n\n是你们让我的生活如此有趣\n\n# 引言\n\n让我从一句来自1950年的引言开始吧。当时的世界是个简单得多的地方。电视是黑白的。喷气式飞机尚未进入民用领域。硅晶体管还没发明问世。全世界一共只有十来台电脑。[\\\
    [1\\]](#chapter001_0004.xhtml#m1)每台都是满满当当的真空管、继电器、插接板和电容器的华丽组合，能塞满整个房间。\n\n因此，只有一个胆量十足的人才敢预测说：“我相信，到了20世纪末，语言的用法和受过教育者的普遍观点将会出现重大转变，人可以说‘机器在思考’，且不认为这自相矛盾。”[\\\
    [2\\]](#chapter001_0004.xhtml#m2)多么大胆的想法呀！能思考的机器。在不远的将来，机器真的能思考吗？如果它们真的能，它们什么时候会变得比我们更擅长思考呢？\n\
    \n但首先——是谁做出了这一大胆的预测呢？他们的预测有多大的分量？1999年，《时代》杂志将提出这一预测的人推选为“20世纪百位最重要人物”之一。[\\[3\\\
    ]](#chapter001_0004.xhtml#m3)毫无疑问，他是20世纪最高深莫测的一个人物。他是一位数学家，一位“二战”英雄。更为重要的是，他是一位梦想家。而且，直到今天，在他英年早逝很久以后，他的梦想仍对我们产生着影响。\n\
    \n一部奥斯卡获奖影片讲述了他在第二次世界大战期间破解德国Enigma密码中发挥了何等关键的作用。温斯顿·丘吉尔形容他和这些从事密码破译工作的同事是“下金蛋的鹅——但从不呱呱叫”。按大多数历史学家的估计，破解出Enigma密码，至少将战争缩短了两年。这无疑挽救了数百万人的生命。但我怀疑，到了21世纪末，人们对这位天才记得最多的事，不会是他破解过密码。\n\
    \n在破解Enigma密码的过程当中，他奠定了计算机的理论基础，并帮助开发了用来破解德军密码的实用计算设备“邦比”（Bombe，第一批此类设备之一）[\\\
    [4\\]](#chapter001_0004.xhtml#m4)。他的理念渗透到了当今的整个计算机科学领域。第一台计算机还没问世，他就提出了一套彻底通用的基本计算机模型。[\\\
    [5\\]](#chapter001_0004.xhtml#m5)为了表彰他的贡献，计算机领域最负盛名的奖项以他的名字命名。尽管计算机在我们生活的方方面面都发挥着巨大影响，但我猜，人们最记得他的地方，不会是他奠定了计算机科学的诸多基石。\n\
    \n他对发育生物学的分化和形态发生（morphogenesis）这一生物学分支也产生过巨大影响。他在全世界历史非常悠久的科学期刊之一发表过一篇论文，名为《形态发生的化学基础》（*The\
    \ Chemical Basis of Morphogenesis*）。[\\[6\\]](#chapter001_0004.xhtml#m6)该刊物此前的作者包括达尔文（Charles\
    \ Darwin，他的进化理论改变了我们对自身的认识）、亚历山大·弗莱明（Alexander Fleming，他发现了青霉素，挽救了数千万人的生命）、詹姆斯·沃森、弗朗西斯·克里克和多萝西·霍奇金（James\
    \ Watson，Francis Crick和Dorothy Hodgkin，他们发现了DNA结构，开启了基因革命）等生物学界的标志性人物。他的论文就自然界形成图案提出了一套理论，解释了动植物身上条纹、斑点和螺旋的形成。如今，这篇论文的引用次数是他著作里最高的。即便如此，我还是怀疑，到了21世纪末，人们对他的贡献记得最清楚的，恐怕不会是图案形成。\n\
    \n他还是同性恋社群里的一个重要人物。20世纪50年代，同性恋在英国不合法。1952年，他因同性恋行为遭到起诉，随后又接受了药物阉割，许多人认为这一切导致了他最终自杀，象征英国政府抛弃了这样一个在“二战”中做出了巨大贡献的人物。[\\\
    [7\\]](#chapter001_0004.xhtml#m7)2009年，经过了民众的一轮公开请愿，首相戈登·布朗（Gordon Brown）最终为他的遭遇表示歉意。4年后，女王签署了极少见的皇室赦免书。不足为奇，同性恋社群的部分人士视他为烈士。但我怀疑，到了21世纪末，人们对他最深刻的缅怀，恐怕不会缘自这些私人问题。\n\
    \n那么，人们对他记忆最深刻的到底会是什么呢？我想，那会是他在不怎么出名的哲学杂志《心智》（*Mind*）上发表的一篇论文。本章开头的引文便出自该论文。截至当时，《心智》最出名的地方应该是发表了刘易斯·卡罗尔（Lewis\
    \ Carroll）探讨芝诺悖论逻辑的论文《乌龟对阿基里斯说了些什么》（*What the Tortoise Said to Achilles*）。[\\\
    [8\\]](#chapter001_0004.xhtml#m8)到了今天，我们引言的出处被视为人工智能史上最重要的一篇论文。[\\[9\\]](#chapter001_0004.xhtml#m9)它设想未来的机器会思考。我们的作者撰写这篇论文的时候，世界上仅存的十来台电脑又大又昂贵。它们的功能远远不如你今天揣在口袋里的智能手机强大。在那时候想象计算机会对我们的生活产生什么影响显然很难。想象有一天它们会自己思考，就更难了。然而，论文预见到了日后人们否定思考机器的各种观点，并一一作了反驳。很多人都把这篇论文的作者看成是人工智能领域的奠基之父。\n\
    \n当然了，他就是皇家学会研究员艾伦·麦席森·图灵（Alan Mathison Turing），生于1912年，逝于1954年。\n\n我预测，到21世纪末，艾伦·图灵最为人铭记的地方是，为思考机器开发领域奠定了基础。这些机器注定将急剧改变我们的生活，一如蒸汽机在工业时代初始之时。它们将改变我们的工作方式、我们的教育方式、我们对待疾病与衰老的态度，并最终改变人类得以为后代铭记的方式。它们很可能会是我们最具变革性的作品。科幻小说里充斥着会思考的机器人。科学事实正紧跟在它后面追赶。\n\
    \n我们的生活正大步飞奔着冲向科幻小说里梦想的未来。我们每天都携带的掌上电脑可以回答最稀奇古怪的问题，用游戏和电影为我们提供娱乐，迷路的时候指引我们回家，帮我们寻找工作或生活伴侣，播放一首情歌，让我们跟世界各地的朋友即刻连接。思考机器“变身”成手机，只是它们最不值一提的作用。\n\
    \n当然，我的这一预测（认为图灵最大的遗产就是帮忙开创了人工智能领域）会引发几个问题。到了下个世纪之交，这些能思考的机器会记得图灵吗？那会是一个美好的未来吗？机器人会接手所有艰苦危险的工作吗？我们的经济会继续繁荣发展吗？我们能减少工作时间，享受更多假期吗？还是说，好莱坞是对的，未来很艰难？富人会越来越富，而我们其他人越来越穷？我们中会有更多人失业吗？甚至，更糟糕一点儿，机器人最终会接管整个世界吗？我们如今正在播撒自我毁灭的种子吗？\n\
    \n本书将探讨这些问题。它将预测人工智能会把我们带向何方。在第一部分，我会考察我们能从过去学到些什么教训。如果你知道一种技术的源头，或许能更好地理解它的发展方向。在第二部分，我审视了当今人工智能的发展，审视了制造思考机器的风险和收益。我尝试现实地评估这一伟大尝试带来的结果。制造思考机器无疑是一项雄心壮志的努力，如能成功，定将对社会造成巨大影响。最后，在第三部分，我会更详细地讨论人工智能的未来。书籍和电影里的狂野未来会变成现实吗？它们够不够异想天开？而我也将“亲身试水”，对“2050年人工智能将取得什么样的成就”做出十项预言。有些预测说不定会叫你大吃一惊。\n\
    \n如今正是人工智能领域大火的时代。过去5年，数十亿美元的风险投资涌入了人工智能企业。[\\[10\\]](#chapter001_0004.xhtml#m10)重注已经押下。计算巨头IBM在旗下的认知计算平台沃森（Watson）上押了10亿美元。[\\\
    [11\\]](#chapter001_0004.xhtml#m11)丰田为研究AI无人驾驶技术投入了10亿美元。开发安全通用人工智能的项目OpenAI，也得到了10亿美元的资金支持。2015年创办的软银愿景基金（SoftBank\
    \ Vision Fund），背靠沙特阿拉伯的资金支持，拥有差不多上千亿美元投资技术公司，以人工智能和“物联网”为焦点。谷歌、Facebook和百度等技术行业大佬，也在大手笔地投资人工智能。毫无疑问，在这个领域工作，当下正是一个非常激动人心的时刻。有了这么多的资金投入，思考机器的开发说不定还会加速。\n\
    \n**为什么阅读本书？**\n\n今天，计算机正以惊人的速度改变着我们的生活。因此，全球范围内，人们渴望对人工智能获得更深入的了解。许多评论家都预言会出现了不起的事情。2016年5月，微软英国分公司的首席构想官戴夫·科普林（Dave\
    \ Coplin）非常大胆地提出：人工智能是“当今地球人们着手从事的最重要的技术”。他说：“这将改变我们跟技术的关系。它将改变人与人之间的关系。我认为，它甚至会改变我们对人类这个概念的看法。”\n\
    \n一个月前，谷歌首席执行官桑达尔·皮查伊（Sundar Pichai）介绍说，人工智能是谷歌的战略核心。“关键的动力……是我们对机器学习和人工智能的长期投入……展望未来……我们将从‘手机优先’进入‘人工智能优先’的世界。”\n\
    \n然而，其他不少评论家则预测，人工智能蕴含着许多危险，如果我们不够谨慎的话，它甚至有可能加速人类的灭亡。2014年，埃隆·马斯克（Elon Musk）向麻省理工学院的听众发起警告：“我们对人工智能应该非常谨慎。如果非要我猜什么会对我们的生存造成最大威胁，那大概就是它了。”马斯克是位连续创业家，以发明并投资了贝宝（PayPal）、特斯拉汽车和SpaceX而闻名于世。他通过创新，撼动了银行业、汽车业和太空旅行业，所以，想必你会承认他对技术，尤其是计算技术对世界的破坏力略知一二。马斯克用自己的钱来支持上述观点（人工智能对人类生存构成重大威胁）。2015年初，他向人类未来研究所（Future\
    \ of Humanity Institute）捐赠了1000万美元，资助研究人员探索怎样确保人工智能的安全性。对一个像马斯克那么富有的人（他的身价约为100亿美元，跻身全世界最富有的100人之列）来说，1000万听起来不像是个太大的数目。但到2015年晚些时候，他又把赌注提高了100倍，宣布自己是OpenAI项目所得10亿美元背后的主要出资人之一。该项目的目标是开发安全的人工智能，再将它开放给全世界。\n\
    \n马斯克提出警告之后，物理学家史蒂芬·霍金（Stephen Hawking）也认为人工智能具有危险性。霍金一面欣喜自己的语音合成器软件升级了，一面略带讽刺地用该技术的电子嗓音发出警告：“全面人工智能的发展，有可能召唤出人类的灭亡。”"
