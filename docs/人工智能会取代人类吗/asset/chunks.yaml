    [\[39\]](#chapter001_0005_0001.xhtml#w39) “伊莉莎”的名字来自萧伯纳剧作《卖花女》（Pygmalion）里的工人阶级角色伊莉莎·杜立特（Eliza
    Doolittle）。语音学教授亨利·希金斯（Henry Higgins）教伊莉莎把自己打扮成上流阶层的淑女。


    [\[40\]](#chapter001_0005_0001.xhtml#w40) 约瑟夫·维森鲍姆出生于 1923 年，2008 年去世。尽管他是人工智能的早期先驱，但他后来对这一领域进行了激烈的批评。2010
    年，他在纪录片《插头与祷告》（*Plug and Pray*）中作为主要角色之一出现，认为我们应该对该技术的走向持谨慎态度。


    [\[41\]](#chapter001_0005_0001.xhtml#w41) 新泽西州的贝尔实验室最出名的地方，或许在于它 1947 年发明了晶体管。晶体管是每台计算机和智能手机都拥有的逻辑结构块之一（当然了，晶体管在贝尔实验室发明之后，体积变得越来越小）。20
    世纪 90 年代初，我偶然与贝尔实验室的人工智能研究小组聊过，事后还参观了实验室。我以为，这次参观的高潮来自展示第一个晶体管，世界各地的极客们都从教科书的照片上看到过它的样子：一大堆笨重的锗合金。可直到我们转过最后一个角落，回到接待处，视线里仍没有出现晶体管的身影。于是，我问道：“（那个）晶体管到哪儿去了？”接待我的主人回答说：“哎呀，我们清理东西的时候把它给弄丢了。”


    [\[42\]](#chapter001_0005_0001.xhtml#w42) 约翰·皮尔斯出生于 1910 年，2002 年去世。他在贝尔实验室工作多年，并发明了“晶体管”一词。他还说过一句名言：“资助开发人工智能是真正的愚蠢。”这句话的真假，我希望你自己来判断。


