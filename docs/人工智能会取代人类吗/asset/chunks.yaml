  trans: '


    很遗憾，到第五代计算机项目结束的时候，上述周期再次开始，第二场人工智能寒冬降临。日本人在人工智能技术探索的领域里做出了许多糟糕的选择。他们的项目没能取得成功，原来计划的
    10 年后续项目遭砍。然而，20 世纪 80 年代到 90 年代初期，美、日、欧三方研发资金增加，帮忙让许多新的研究人员入了行。如今，这些研究人员有不少都在继续向前推进我们对思考机器的认识。


    ## 人工智能之春


    人工智能目前正处在上升期，感觉就像是春天再次来临。数十亿美元投入这一领域。原因之一在于机器学习（尤其是深度学习领域）取得了极大的进展。[^(\[53\])](#chapter001_0005_0001.xhtml#m53)就在几年前，深度学习只是机器学习一个不起眼的分支，只有包括多伦多、纽约和蒙特利尔大学里的少数研究人员从事。[^(\[54\])](#chapter001_0005_0001.xhtml#m54)机器学习的大部分研究侧重于有着酷炫名称的概率技术，比如“贝叶斯推理”和“支持向量机”等。深度学习构建的神经网络有点儿像我们自己的大脑，与更为复杂的概率方法相比，多年来人们都认为这是一条死胡同。


    然而，这一小批深度学习研究人员的坚持，逐渐带来了回报——而且是惊人的回报——他们公布了许多引发人工智能研究社群想象力的研究成果。2013 年底，丹尼斯·哈比斯（Dennis
    Habbis）和英国创始公司 DeepMind 使用深度学习教计算机玩 7 款经典的雅达利街机游戏：《乓》（Pong，雅达利公司 1972 年推出的一款投币式街机游戏，很多时候，人们认为这是电子游戏史上的第一款街机电子游戏）、《打砖块》（Breakout）、《太空侵略者》（Space
    Invaders）、《海底救人》（Seaquest）、《Beam Rider》、《Enduro》和《Q 伯特》（Q\*bert）。随后，游戏范围又扩大到了
    49 款。[^(\[55\])](#chapter001_0005_0001.xhtml#m55)大多数时候，计算机玩的水平跟普通人差不多。但是，有 10
    多款游戏，它们的水平达到了超人级。这是一个了不起的成果，因为研究人员并未向程序提供游戏的任何背景知识。程序只能读取分数和屏幕上的像素，从头开始学习每款游戏。它不知道什么球拍、球或者激光，也不知道重力、牛顿物理学或者人类玩这类游戏时所知道的任何其他事情。计算机只不过玩了很多很多游戏，一开始学习怎样玩，接着（过上几个小时）再学习怎样玩得好。[^(\[56\])](#chapter001_0005_0001.xhtml#m56)人工智能领域权威教科书的作者之一斯图尔特·罗素（Stuart
    Russell）观察说：“要是看到一个人类小孩在出生当天的晚上就能把电子游戏玩得滚瓜烂熟，击败其他人类，这样的场面既会给你留下深刻的印象，也会叫你害怕。”


    受到这一突破的激励，谷歌据信支付 5 亿美元，买下了 DeepMind。当时，后者大约有 50 名员工，其中 10 多人是机器学习研究员，没有收入。不足为奇，开始上心的不光只有人工智能社群。


    自此之后，深度学习在感知方面（诸如语音识别、计算机视觉的物体识别和自然语言处理等任务）表现极佳。这些都是人类大脑无须有意识努力就能完成的各种任务。就连深度学习在古老的中国围棋上取得的成功，也主要归功于它能成功感知棋盘状态（也即谁会获胜、落子落得好是什么意思）。


    深度学习需要大量数据。但是在语音识别等领域，收集大量数据并不太难，深度学习似乎认为需要高层次推理的任务更困难。DeepMind 程序在玩二维版乒乓球电子游戏《乓》上表现出色。要玩好《乓》，你不需要太多的策略——只需要把球拍移动到球的位置，尝试把球打进角落就行。但是深度学习在需要记忆和规划的游戏里，从未达到人类水平。比如在《小精灵小姐》（*Ms.Pac-man*）里，你必须提前规划好自己怎么对付鬼魂。这样一来，深度学习玩这种游戏就玩得很差劲。在这类任务上，更常规的人工智能技术似乎更合适。


    最近似乎出现了一些对深度学习的强烈批评的声音。这些批评声音无法忍受对深度学习潜力进行的炒作。深度学习并不会“搞定”所有的智能，显然也无法提供给硅谷部分人士它的价值。在数据较少、要进行更多高级推理的地方，其他技术大有用武之地。在专业知识可明确编写成计算机程序的领域，以知识为基础的技术同样能发挥作用。最后，在安全和其他关键应用中，能解释自己在干什么、为什么要这么做，同时能确保特定行为的技术，也还扮演着一定的角色。对这类应用而言，深度学习恐怕很像是一个黑盒子。


    ## 无人驾驶汽车


    除了深度学习，近年来还有几项成功让我们在思考机器之路上走得更远。2004 年，国防高级研究计划署宣布举办 100 万美元的挑战赛，拉开了自动驾驶的进程，最终还解决了在伊拉克、阿富汗等危险地点运送物资的问题。第一次的比赛，对人工智能来说是一场无奈的失败。胜出的是卡内基梅隆大学的红队，但它在
    240 千米的沙漠赛道上仅前进了不到 12 千米。最终，完成赛道挑战的 100 万美元奖金无人拿下。但人工智能研究人员很快就反攻了：一年后，5 支队伍完成了该赛道。来自斯坦福大学的塞巴斯蒂安·特伦（Sebastian
    Thrun）团队获得了这一年的 200 万美元奖金。“不可完成的任务完成了。”特伦宣称。


    不太为人所知的是，10 多年前，欧盟曾出资 8.1 亿美元设立“欧洲高效安全交通系统计划”（Prometheus Project），研发自动驾驶。该计划始于
    1987 年，到 1994 年结束。在该计划接近尾声时，两辆自动驾驶汽车 VaMP 和 VITA-2，在车来车往的法国高速公路上以高达 130 千米的时速行驶了
    1000 多千米。（凡是在法国开过车的人，都会尊重这样的成绩。）如今，在我们的城市和高速公路上，都不时能看到自动驾驶汽车的身影。自动驾驶汽车甚至很快就要进入赛车赛道了。从
    2016—2017 赛季的某个时段开始，无人驾驶的赛车“Roborace”打算在赛车跑道上以 300 千米的最高时速比试一番。


    ## 亲爱的沃森


    人工智能新近的成功还包括 IBM 的沃森计算机。2011 年，它在《危险边缘》（《*Jeopardy*！》是美国一个播出多年的问答节目，节目方向参赛者提供各种琐碎的线索，参赛者根据这些线索对问题做出回答，不可弃权不答）回答了各种一般性知识问题，表现出了达到人类水平的能力。


    #### 沃森参加《危险边缘》


    主持人：这场“事件”不需要门票，它是物质无法逃脱的黑洞边缘。


    沃森：是“事件视界”（event horizon）。


    主持人：想杀死丹佛斯·卡鲁（Danvers Carew）爵士；外貌：苍白，身量矮小；似乎有着分裂的个性。


    沃森：是“海德先生”？


    主持人：就算你家墙上挂着的它坏了，每天也有两次是对的。


    沃森：是时钟？


    在这场人机大战里，沃森（得名自 IBM 的创始人托马斯·沃森）有两个强大的竞争对手。第一个竞争对手是布拉德·鲁特（Brad Rutter）。布拉德是《危险边缘》历年来获得奖金最多（总计超过
    300 万美元）的赢家。另一个竞争对手是肯·詹宁斯（Ken Jennings），他保持着该节目最长的连胜纪录（2004 年，他曾连赢 74 场）。尽管竞争激烈，沃森仍在为时
    3 天的比赛里拿到了 100 万美元的奖金。


    沃森代表了我们在自然语言理解、计算机理解文字和概率推理等方面（即让计算机应对不确定性）取得的真正进展。沃森使用复杂概率进行估计，在不同的答案中做出选择。这类技术已经渗透到了我们的日常生活中。Siri
    和 Cortana 等应用程序可以分析、理解并回答“美国第二大城市是哪座”这类复杂的问题。（正确答案是洛杉矶，有近 400 万人口。）


    ## 围棋之王


    我还可以介绍人造智能进步的许多其他例子，但这里，我想用另一个具有里程碑意义的时刻来作为结束。2016 年 3 月，谷歌的 AlphaGo 程序击败了世界最优秀的围棋手之一李世石，赢得了
    100 万美元的奖金。在围棋这一最古老、最具挑战性的棋盘游戏上，人类不再是王者。很多围棋大师都以为计算机永远没法下好围棋。就算对机器持有乐观态度的人也认为，至少要
    10 年以后才会获得成功。1997 年 7 月，“深蓝”在国际象棋上击败卡斯帕罗夫的时候，《纽约时报》这样说：“如果计算机能打败人类围棋手，那才是人工智能展现出真正精通某事的标志。”


    围棋规则简单，但下起来又极为复杂，因此 AlphaGo 的成功代表人工智能发展上的重要一步。两名玩家轮流在 19×19 的棋盘上落黑白子，以包围对方为目的。在国际象棋里，每一回合有
    20 种可能的下法，而在围棋上则有大约 200 种。要提前看到后两步棋，就需要考虑 200×200（40000）种可能的下法。要提前看 3 步棋，共有 800
    万种不同的下法要考虑。而提前看黑白子未来的 15 步棋，可能的下法比整个宇宙中的原子还要多。


    随着棋局的推进，围棋的另一个特点使得预测哪方获胜成了极大的挑战。在国际象棋中，算出哪方领先并不难。把不同棋子的价值加出来，就是基本准确的近似值了。在围棋里，只有黑白两种棋子。围棋大师要训练一辈子，才能判断出什么时候哪方选手占优。为了决定自己下
    200 多种下法中哪一手能改善自己的局面，任何优秀的围棋程序都需要能计算出眼下是谁领先。


    AlphaGo 将计算机暴力运算和人类风格的感知优雅地结合来解决这两个问题。为解决双方棋手数量庞大的可能下法，AlphaGo 采用了一种名叫“蒙特卡洛树”的人工智能启发式搜索。要将每步可能的棋招推算得非常远，这没办法做到。但计算机从所有可能棋着里随机选出样本来进行探索，因为平均而言能获胜最多次的棋着把握最大。为了解决判断谁占优势的难题，AlphaGo
    使用深度学习。我们并不确切地知道怎样对围棋棋盘上的优势局面进行描述。但一如人类能够学会感知优势局面，计算机也能够学习。这是深度学习极为擅长感知任务的另一个例子。AlphaGo
    学会并最终超越了围棋大师感知优势局面的能力。


    谷歌的规模和雄厚的财力，也在这场胜利里发挥了重要作用。AlpahGo 自己跟自己下了数十亿局棋，改善了策略。像人工智能新近的许多进展一样，重大的回报来自对问题投入越来越多的资源。在
    AlphaGo 之前，计算机围棋程序主要是单个程序员的努力，且大多运行在一台计算机上。反过来说，AlphaGo 代表了数十上百谷歌工程师和顶尖人工智能科学家的重大工程的努力，而且它享受着接入谷歌庞大数据库集群的福利。


    虽然 AlphaGo 的胜利无疑是明确地迈过了一道里程碑，但我并不完全同意 AlphaGo 项目负责人杰米斯·哈萨比斯（Demis Hassabis）的看法。他认为，围棋是“游戏的顶峰，在智力深度上是最为丰富的”。围棋绝对是迄今为止游戏界的珠穆朗玛峰，因为它有着最大的“游戏树”。然而，扑克却是一座更为致命的山峰，K2
    乔戈里峰[^(\[57\])](#chapter001_0005_0001.xhtml#m57)。扑克引入了一些其他因素，例如特定卡牌的不确定性，以及对手的心理状态。可以说，扑克是一项更讲究智力挑战的游戏。围棋没有不确定性，心理状态不如下得聪明重要。


    尽管人们说，用来解决围棋问题的方法是通用目的，但哪怕只是让 AlphaGo 改下国际象棋，也需要投入庞大的人力。不管怎么说，基于 AlphaGo 背后的设想和相关技术，我们可能很快就会找到途径，融入新的应用程序。AlphaGo
    不会只用来玩游戏，我们将在谷歌的 PageRank、AdWords、语音识别，甚至无人驾驶汽车等领域看到它的身影。


    ## 看不见的人工智能


    我们朝着机器思考前进的路上，存在一种“淡出视野”的习惯。一旦我们知道怎样把特定的任务加以自动化，往往就不再把它叫成人工智能，而将之视为主流计算的一部分。举例来说，很多人不再认为语言识别属于人工智能发明——隐马尔科夫模型和深度学习网络淡出了我们的视野。


    这方面的许多例子，如今正丰富着我们的生活。每当你朝 Siri 或 Cortana 提问，都是在享受多种类型的人工智能带来的益处：语音识别算法，把你的语言转化成自然语言问题；自然语言解析器，把这个问题变成搜索查询；搜索算法，对这一查询给予解答；排名算法，预测对你最“有用”的广告，将它放置在搜索结果旁边。如果你运气足够好，拥有了特斯拉汽车，你可以坐在驾驶座椅上，让它自主地顺着高速公路行驶，特斯拉使用了大量人工智能算法来感知道路和环境，规划行动路线，驾驶汽车。[^(\[58\])](#chapter001_0005_0001.xhtml#m58)


    对于从事人工智能工作的人来说，这些技术淡出视野，暗示了成功。最终，人工智能会变得像电一样。我们生活中几乎每种设备都要使用电力，它是我们的房子、汽车、农场、工厂和商店必不可少而又看不见的组成部分，它几乎要为我们所做的一切提供能量和数据。如果电力消失，世界将很快停止运转。同样道理，人工智能也很快要成为我们所有人生活里必不可少却又看不见的组成部分。


    * * *


    [\[1\]](#chapter001_0005_0001.xhtml#w1) 约翰·麦卡锡出生于 1927 年，2011 年去世。他对计算机科学做出了不计其数的贡献，尤其是在人工智能领域。1971
    年，他获得计算机科学界最著名的图灵奖。他创办了斯坦福人工智能实验室（也称为斯坦福 AI 实验室，或简称“SAIL”），这是全世界最顶尖的人工智能研究中心之一。认识约翰是我的幸运。有一次，他到访澳大利亚，其间，我们俩同时在一个美好的夏日受邀到悉尼海港去参加航海之旅。当时，他已步入老年，身体有些虚弱，要用到轮椅。登船的时候，我一只脚站在码头，一只脚踏在船上，抱着约翰想把他抬到甲板上。就在这一刻，约翰僵住了，我也僵住了。我们既没法往前，也没法退后。我腾起一个念头：在人工智能史上，我恐怕要成为害他摔死的脚注了。这个念头给了我足够的力量，把他推上了船。但这趟旅程剩下的时间，我全用来思考怎么把他带下船了。5
    年后，约翰在家里去世。不过，那趟航海之旅现在的确成了人工智能史上的一段脚注。


    [\[2\]](#chapter001_0005_0001.xhtml#w2) 牛津英语词典在介绍“人工智能”一词时，追溯到了 1955 年 8 月达特茅斯大会上麦卡锡、马文·明斯基（Marvin
    Minsky）、纳撒尼尔·罗切斯特（Nathaniel Rochester）和克劳德·香农四人联手执笔的倡议。不过，一般认为是麦卡锡创造了这个词。


    [\[3\]](#chapter001_0005_0001.xhtml#w3) 拉蒙·柳利出生于 1232 年前后，1315 年前后去世。他写了 200 多本书，还在其他几个领域做出了开创性贡献。2013
    年，在他去世后 700 多年，我很幸运地主持了巴塞罗那召开的一场重要的人工智能大会。我们为他举办了一次特别活动，纪念他在这一领域做出的许多贡献。谢谢你，卡尔斯。


    [\[4\]](#chapter001_0005_0001.xhtml#w4) 戈特弗里德·威廉·莱布尼茨出生于 1646 年，1716 年去世。莱布尼茨发明了若干台机械式计算器，改进了二进制数字系统（即当今每一台电子计算机的基础语言
    0 和 1）。莱布尼茨最有名的地方大概是他独立于牛顿，发明了微积分（研究变化率的数学方法）。微积分已经成为大部分物理学要用到的语言。


    [\[5\]](#chapter001_0005_0001.xhtml#w5) 语出 1685 年《发现的艺术》（*The Art of Discovery*）。


    [\[6\]](#chapter001_0005_0001.xhtml#w6) 图灵机就是一种通用且正式的计算机，是一台操作纸带上符号的机器。


    [\[7\]](#chapter001_0005_0001.xhtml#w7) 托马斯·霍布斯出生于 1588 年，1679 年去世。他更出名的地方或许是他写过一本书，名叫《利维坦》，书中提出了以哲学的方式论证国家的存在、论证道德的客观科学性。


    [\[8\]](#chapter001_0005_0001.xhtml#w8) 出自：De Corpore （translated from the Latin），Chapter
    1\]2，1655。


    [\[9\]](#chapter001_0005_0001.xhtml#w9) 10 年前的 1642 年，布莱兹·帕斯卡（Blaise Pascal）设计了一台机械式计算器。不过，有好几种能够做加法的机器都比这出现得更早，包括算盘和若干古希腊天文仪器。


    [\[10\]](#chapter001_0005_0001.xhtml#w10) 勒内·笛卡儿出生于 1596 年，1650 年去世。他是第一批强调使用逻辑推理来发展科学知识的哲学家之一。


    [\[11\]](#chapter001_0005_0001.xhtml#w11) 否定后件假言推理（Modus tollens）是反向推理的逻辑规则。它指的是，如果
    X 表示 Y，假设 Y 推理不成立，X 也不成立。它可以用矛盾推理原则来证明，论述过程如下：假设 X 成立，且 X 表示 Y，Y 也必然成立。但这就跟 Y
    不成立矛盾了。故此，我们的假设是错的：X 不成立。


    [\[12\]](#chapter001_0005_0001.xhtml#w12) 乔治·布尔（George Boole），英国皇家学会会员，出生于 1815
    年，1864 年去世。从数学上解释人类思考逻辑的设想，显然来自他 17 岁穿过唐卡斯特一块农田时偶然间出现的灵光一闪。不过，要等到十多年后，他才把这个设想形成书面文字。


    [\[13\]](#chapter001_0005_0001.xhtml#w13) 布尔的妻子叫玛丽·埃佛勒斯（Mary Everest），她是测量师埃佛勒斯（埃佛勒斯测量了世界最高峰珠穆朗玛峰，后来这座高山便用了他的名字）的侄女。（译注：珠穆朗玛峰在英语里称为
    Mount Everest，也即埃佛勒斯峰。）1864 年，布尔去大学讲课时下了雨，因为感冒病倒了。玛丽·埃佛勒斯是个顺势疗法医师，认为要顺势治疗才有利于布尔的病情。于是，她把丈夫裹上湿床单放在床上。许多人写道，她往患者身上一桶一桶地浇冷水，但这似乎是夸张说法。不管怎么说，布尔的病情恶化，毫无必要地死掉了。出于命运的偶然转折，布尔的曾曾孙之一杰弗里·埃佛勒斯·辛顿也将短暂地出现在我们的人工智能简史里，他是深度学习的顶尖领跑人。我在科克大学当教授期间，几乎每天都骑着自行车从布尔的房子旁绕过去，我总是想，要是他没有那么年轻就死去，他的理念将得到怎样的发展呢。


