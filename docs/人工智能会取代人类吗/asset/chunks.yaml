- raw: '很遗憾，到第五代计算机项目结束的时候，上述周期再次开始，第二场人工智能寒冬降临。日本人在人工智能技术探索的领域里做出了许多糟糕的选择。他们的项目没能取得成功，原来计划的10年后续项目遭砍。然而，20世纪80年代到90年代初期，美、日、欧三方研发资金增加，帮忙让许多新的研究人员入了行。如今，这些研究人员有不少都在继续向前推进我们对思考机器的认识。


    ### 人工智能之春


    人工智能目前正处在上升期，感觉就像是春天再次来临。数十亿美元投入这一领域。原因之一在于机器学习（尤其是深度学习领域）取得了极大的进展。[^(\[53\])](#chapter001_0005_0001.xhtml#m53)就在几年前，深度学习只是机器学习一个不起眼的分支，只有包括多伦多、纽约和蒙特利尔大学里的少数研究人员从事。[^(\[54\])](#chapter001_0005_0001.xhtml#m54)机器学习的大部分研究侧重于有着酷炫名称的概率技术，比如“贝叶斯推理”和“支持向量机”等。深度学习构建的神经网络有点儿像我们自己的大脑，与更为复杂的概率方法相比，多年来人们都认为这是一条死胡同。


    然而，这一小批深度学习研究人员的坚持，逐渐带来了回报——而且是惊人的回报——他们公布了许多引发人工智能研究社群想象力的研究成果。2013年底，丹尼斯·哈比斯（Dennis
    Habbis）和英国创始公司DeepMind使用深度学习教计算机玩7款经典的雅达利街机游戏：《乓》（Pong，雅达利公司1972年推出的一款投币式街机游戏，很多时候，人们认为这是电子游戏史上的第一款街机电子游戏）、《打砖块》（Breakout）、《太空侵略者》（Space
    Invaders）、《海底救人》（Seaquest）、《Beam Rider》、《Enduro》和《Q伯特》（Q\*bert）。随后，游戏范围又扩大到了49款。[^(\[55\])](#chapter001_0005_0001.xhtml#m55)大多数时候，计算机玩的水平跟普通人差不多。但是，有10多款游戏，它们的水平达到了超人级。这是一个了不起的成果，因为研究人员并未向程序提供游戏的任何背景知识。程序只能读取分数和屏幕上的像素，从头开始学习每款游戏。它不知道什么球拍、球或者激光，也不知道重力、牛顿物理学或者人类玩这类游戏时所知道的任何其他事情。计算机只不过玩了很多很多游戏，一开始学习怎样玩，接着（过上几个小时）再学习怎样玩得好。[^(\[56\])](#chapter001_0005_0001.xhtml#m56)人工智能领域权威教科书的作者之一斯图尔特·罗素（Stuart
    Russell）观察说：“要是看到一个人类小孩在出生当天的晚上就能把电子游戏玩得滚瓜烂熟，击败其他人类，这样的场面既会给你留下深刻的印象，也会叫你害怕。”


    受到这一突破的激励，谷歌据信支付5亿美元，买下了DeepMind。当时，后者大约有50名员工，其中10多人是机器学习研究员，没有收入。不足为奇，开始上心的不光只有人工智能社群。


    自此之后，深度学习在感知方面（诸如语音识别、计算机视觉的物体识别和自然语言处理等任务）表现极佳。这些都是人类大脑无须有意识努力就能完成的各种任务。就连深度学习在古老的中国围棋上取得的成功，也主要归功于它能成功感知棋盘状态（也即谁会获胜、落子落得好是什么意思）。


    深度学习需要大量数据。但是在语音识别等领域，收集大量数据并不太难，深度学习似乎认为需要高层次推理的任务更困难。DeepMind程序在玩二维版乒乓球电子游戏《乓》上表现出色。要玩好《乓》，你不需要太多的策略——只需要把球拍移动到球的位置，尝试把球打进角落就行。但是深度学习在需要记忆和规划的游戏里，从未达到人类水平。比如在《小精灵小姐》（*Ms.Pac-man*）里，你必须提前规划好自己怎么对付鬼魂。这样一来，深度学习玩这种游戏就玩得很差劲。在这类任务上，更常规的人工智能技术似乎更合适。


    最近似乎出现了一些对深度学习的强烈批评的声音。这些批评声音无法忍受对深度学习潜力进行的炒作。深度学习并不会“搞定”所有的智能，显然也无法提供给硅谷部分人士它的价值。在数据较少、要进行更多高级推理的地方，其他技术大有用武之地。在专业知识可明确编写成计算机程序的领域，以知识为基础的技术同样能发挥作用。最后，在安全和其他关键应用中，能解释自己在干什么、为什么要这么做，同时能确保特定行为的技术，也还扮演着一定的角色。对这类应用而言，深度学习恐怕很像是一个黑盒子。


    ### 无人驾驶汽车


    除了深度学习，近年来还有几项成功让我们在思考机器之路上走得更远。2004年，国防高级研究计划署宣布举办100万美元的挑战赛，拉开了自动驾驶的进程，最终还解决了在伊拉克、阿富汗等危险地点运送物资的问题。第一次的比赛，对人工智能来说是一场无奈的失败。胜出的是卡内基梅隆大学的红队，但它在240千米的沙漠赛道上仅前进了不到12千米。最终，完成赛道挑战的100万美元奖金无人拿下。但人工智能研究人员很快就反攻了：一年后，5支队伍完成了该赛道。来自斯坦福大学的塞巴斯蒂安·特伦（Sebastian
    Thrun）团队获得了这一年的200万美元奖金。“不可完成的任务完成了。”特伦宣称。


    不太为人所知的是，10多年前，欧盟曾出资8.1亿美元设立“欧洲高效安全交通系统计划”（Prometheus Project），研发自动驾驶。该计划始于1987年，到1994年结束。在该计划接近尾声时，两辆自动驾驶汽车VaMP和VITA-2，在车来车往的法国高速公路上以高达130千米的时速行驶了1000多千米。（凡是在法国开过车的人，都会尊重这样的成绩。）如今，在我们的城市和高速公路上，都不时能看到自动驾驶汽车的身影。自动驾驶汽车甚至很快就要进入赛车赛道了。从2016—2017赛季的某个时段开始，无人驾驶的赛车“Roborace”打算在赛车跑道上以300千米的最高时速比试一番。


    ### 亲爱的沃森


    人工智能新近的成功还包括IBM的沃森计算机。2011年，它在《危险边缘》（《*Jeopardy*！》是美国一个播出多年的问答节目，节目方向参赛者提供各种琐碎的线索，参赛者根据这些线索对问题做出回答，不可弃权不答）回答了各种一般性知识问题，表现出了达到人类水平的能力。


    **沃森参加《危险边缘》**


    主持人：这场“事件”不需要门票，它是物质无法逃脱的黑洞边缘。


    沃森：是“事件视界”（event horizon）。


    主持人：想杀死丹佛斯·卡鲁（Danvers Carew）爵士；外貌：苍白，身量矮小；似乎有着分裂的个性。


    沃森：是“海德先生”？


    主持人：就算你家墙上挂着的它坏了，每天也有两次是对的。


    沃森：是时钟？


    在这场人机大战里，沃森（得名自IBM的创始人托马斯·沃森）有两个强大的竞争对手。第一个竞争对手是布拉德·鲁特（Brad Rutter）。布拉德是《危险边缘》历年来获得奖金最多（总计超过300万美元）的赢家。另一个竞争对手是肯·詹宁斯（Ken
    Jennings），他保持着该节目最长的连胜纪录（2004年，他曾连赢74场）。尽管竞争激烈，沃森仍在为时3天的比赛里拿到了100万美元的奖金。


    沃森代表了我们在自然语言理解、计算机理解文字和概率推理等方面（即让计算机应对不确定性）取得的真正进展。沃森使用复杂概率进行估计，在不同的答案中做出选择。这类技术已经渗透到了我们的日常生活中。Siri和Cortana等应用程序可以分析、理解并回答“美国第二大城市是哪座”这类复杂的问题。（正确答案是洛杉矶，有近400万人口。）


    ### 围棋之王


    我还可以介绍人造智能进步的许多其他例子，但这里，我想用另一个具有里程碑意义的时刻来作为结束。2016年3月，谷歌的AlphaGo程序击败了世界最优秀的围棋手之一李世石，赢得了100万美元的奖金。在围棋这一最古老、最具挑战性的棋盘游戏上，人类不再是王者。很多围棋大师都以为计算机永远没法下好围棋。就算对机器持有乐观态度的人也认为，至少要10年以后才会获得成功。1997年7月，“深蓝”在国际象棋上击败卡斯帕罗夫的时候，《纽约时报》这样说：“如果计算机能打败人类围棋手，那才是人工智能展现出真正精通某事的标志。”


    围棋规则简单，但下起来又极为复杂，因此AlphaGo的成功代表人工智能发展上的重要一步。两名玩家轮流在19×19的棋盘上落黑白子，以包围对方为目的。在国际象棋里，每一回合有20种可能的下法，而在围棋上则有大约200种。要提前看到后两步棋，就需要考虑200×200（40000）种可能的下法。要提前看3步棋，共有800万种不同的下法要考虑。而提前看黑白子未来的15步棋，可能的下法比整个宇宙中的原子还要多。


    随着棋局的推进，围棋的另一个特点使得预测哪方获胜成了极大的挑战。在国际象棋中，算出哪方领先并不难。把不同棋子的价值加出来，就是基本准确的近似值了。在围棋里，只有黑白两种棋子。围棋大师要训练一辈子，才能判断出什么时候哪方选手占优。为了决定自己下200多种下法中哪一手能改善自己的局面，任何优秀的围棋程序都需要能计算出眼下是谁领先。


    AlphaGo将计算机暴力运算和人类风格的感知优雅地结合来解决这两个问题。为解决双方棋手数量庞大的可能下法，AlphaGo采用了一种名叫“蒙特卡洛树”的人工智能启发式搜索。要将每步可能的棋招推算得非常远，这没办法做到。但计算机从所有可能棋着里随机选出样本来进行探索，因为平均而言能获胜最多次的棋着把握最大。为了解决判断谁占优势的难题，AlphaGo使用深度学习。我们并不确切地知道怎样对围棋棋盘上的优势局面进行描述。但一如人类能够学会感知优势局面，计算机也能够学习。这是深度学习极为擅长感知任务的另一个例子。AlphaGo学会并最终超越了围棋大师感知优势局面的能力。


    谷歌的规模和雄厚的财力，也在这场胜利里发挥了重要作用。AlpahGo自己跟自己下了数十亿局棋，改善了策略。像人工智能新近的许多进展一样，重大的回报来自对问题投入越来越多的资源。在AlphaGo之前，计算机围棋程序主要是单个程序员的努力，且大多运行在一台计算机上。反过来说，AlphaGo代表了数十上百谷歌工程师和顶尖人工智能科学家的重大工程的努力，而且它享受着接入谷歌庞大数据库集群的福利。


    虽然AlphaGo的胜利无疑是明确地迈过了一道里程碑，但我并不完全同意AlphaGo项目负责人杰米斯·哈萨比斯（Demis Hassabis）的看法。他认为，围棋是“游戏的顶峰，在智力深度上是最为丰富的”。围棋绝对是迄今为止游戏界的珠穆朗玛峰，因为它有着最大的“游戏树”。然而，扑克却是一座更为致命的山峰，K2乔戈里峰[^(\[57\])](#chapter001_0005_0001.xhtml#m57)。扑克引入了一些其他因素，例如特定卡牌的不确定性，以及对手的心理状态。可以说，扑克是一项更讲究智力挑战的游戏。围棋没有不确定性，心理状态不如下得聪明重要。


    尽管人们说，用来解决围棋问题的方法是通用目的，但哪怕只是让AlphaGo改下国际象棋，也需要投入庞大的人力。不管怎么说，基于AlphaGo背后的设想和相关技术，我们可能很快就会找到途径，融入新的应用程序。AlphaGo不会只用来玩游戏，我们将在谷歌的PageRank、AdWords、语音识别，甚至无人驾驶汽车等领域看到它的身影。


    ### 看不见的人工智能


    我们朝着机器思考前进的路上，存在一种“淡出视野”的习惯。一旦我们知道怎样把特定的任务加以自动化，往往就不再把它叫成人工智能，而将之视为主流计算的一部分。举例来说，很多人不再认为语言识别属于人工智能发明——隐马尔科夫模型和深度学习网络淡出了我们的视野。


    这方面的许多例子，如今正丰富着我们的生活。每当你朝Siri或Cortana提问，都是在享受多种类型的人工智能带来的益处：语音识别算法，把你的语言转化成自然语言问题；自然语言解析器，把这个问题变成搜索查询；搜索算法，对这一查询给予解答；排名算法，预测对你最“有用”的广告，将它放置在搜索结果旁边。如果你运气足够好，拥有了特斯拉汽车，你可以坐在驾驶座椅上，让它自主地顺着高速公路行驶，特斯拉使用了大量人工智能算法来感知道路和环境，规划行动路线，驾驶汽车。[^(\[58\])](#chapter001_0005_0001.xhtml#m58)


    对于从事人工智能工作的人来说，这些技术淡出视野，暗示了成功。最终，人工智能会变得像电一样。我们生活中几乎每种设备都要使用电力，它是我们的房子、汽车、农场、工厂和商店必不可少而又看不见的组成部分，它几乎要为我们所做的一切提供能量和数据。如果电力消失，世界将很快停止运转。同样道理，人工智能也很快要成为我们所有人生活里必不可少却又看不见的组成部分。


