    \ 克劳德·香农出生于1916年，2001年去世。他在麻省理工学院的硕士论文指出，布尔代数（Boole's algebra，我们会对它深入介绍）可以在电路中快速执行，构建一切逻辑功能。这个设想，被认为是当今一切计算机硬件的基础。香农的这篇论文，据说有可能是20世纪最重要、最著名的硕士论文。他的理论为通信理论奠定了基础，描述了数字信息在嘈杂渠道（电报线路或是无线电链路）里传输存在的限制。1950年，香农出版了第一本论述计算机象棋的科学论文。他和妻子贝蒂周末喜欢去拉斯维加斯，他使用算牌的办法来赢21点。\n\
