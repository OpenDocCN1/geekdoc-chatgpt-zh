    ## 第四章 人工智能的局限性


    过去有进步，并不能保证将来必然会进步。我们开发思考机器的梦想，会不会碰到什么限制使其无法实现呢？让我们来看一些试图解释为什么可能永远制造不出思考机器的实践及理论观点。很多机器我们都希望拥有，但在工程上是没可能实现的。时间机器能带我们回到过去，永动机能永远运行。说不定，思考机器也属于同一范畴：很值得拥有，只可惜没这个可能。


    其他许多领域也曾碰到过来自理论和实践上的根本性限制。比方说，数学就包含了许多不可能。你不能化圆为方（译注：即给出一个圆形，要求画出一个面积跟它完全一样的正方形）。此外，你大概还记得，不是所有的数学运算都能写出逻辑公式。在物理学上，按照爱因斯坦的理论，不存在比光速更快的速度。时间旅行在实践层面上也几乎不可能，从而避免了“意外杀死自己祖父”这一类的逻辑困境。兴许，制造思考机器的雄心壮志，也会被扼杀在类似的实践或理论限制之下呢？


    在考察各种可能存在的限制之前，我们不妨先对自己期望达到的终点做个更谨慎的定义。接下来，我们就可以想想看，是否存在什么东西妨碍我们达到这一点。


    ### 强人工智能


    人工智能的可能终点之一是，在一项需要智力的具体任务上，制造出一台等于或超过我们能力的机器。这有时被称为弱人工智能。我们已经在许多专业领域达到了这个终点。举例来说，在下国际象棋、展开空对空作战[\[1\]](#chapter001_0008.xhtml#m1)、猜测照片位置[\[2\]](#chapter001_0008.xhtml#m2)、诊断肺部疾病[\[3\]](#chapter001_0008.xhtml#m3)等方面，计算机跟人类做得同样出色，有时甚至更为出色。


    除此之外就是强人工智能。这个概念，来自哲学家约翰·希尔勒（John Searle），他曾对人工智能提出过最具雄辩、最响亮的批评。[\[4\]](#chapter001_0008.xhtml#m4)强人工智能指的是，思考机器最终将成为思维，或至少具备思维的所有特征，如意识等。另一些与强人工智能相关的人类特征，包括自我意识、知觉、情绪和道德。希尔勒用“中文房间”介绍了强人工智能的设想，这是一个旨在暴露人工智能限制性的著名思想实验。[\[5\]](#chapter001_0008.xhtml#m5)


    中文房间实验有点儿是图灵测试。假设说，我们把希尔勒关在一间屋子里。出于实验的目的，我们必须知道希尔勒不懂中文，既不会说，也不会写。但房间里有一大堆书，书中用英文说明了中文符号的操作规则。你把写有中文问题的纸条递进屋子。希尔勒按照书中介绍的规则，在另一张纸上写出了问题的答案，并传到门外。现在，假设写下这些问题的中国人分辨不出这些答案到底是来自希尔勒，还是来自某个真正懂得中文的人。那么，希尔勒就问：谁懂中文呢？显然不是他。当然也不是屋子，也不是书籍——它们是无生命的物体。在这种情况下，希尔勒所扮演的角色，就是一台解答中文问题的计算机。故此，我们不能说通过了这种测试的计算机真正理解中文，而理解中文，是对强人工智能的要求。


    自此以后，哲学家、认知科学家和人工智能研究人员对希尔勒中文房间实验展开了激烈的讨论。2004年，有人称，“中文房间辩论，或许是过去25年以来认知科学界讨论得最为广泛的哲学问题了”。[\[6\]](#chapter001_0008.xhtml#m6)值得强调的是，人工智能领域的大多数研究都是以弱人工智能为重点的。老实说，我怀疑这个领域里只有极少数的研究人员相信我们最终能实现强人工智能，而且，我们并不需要强人工智能就能享受到思考机器带来的几乎所有的好处。我们只需要能跟人类做得同样出色的机器就够了，这样的机器其实并不拥有思维。事实上，如果它们没有思维，我们也就躲开了大量的伦理问题，比方说它们自身是否拥有权利，我们有没有权利关掉它们。


    因此，对许多在这个领域工作的人来说，希尔勒的中文房间辩论有点儿无关痛痒。实际上，艾伦·图灵提前20多年就预见到了希尔勒式的批评。引入图灵测试，正是为了反驳希尔勒提出的这类论点。


    还有其他许多人也对希尔勒的观点作出了回答。一种回答是，从整体上看，该系统可以说是懂中文的。还有一种回答是，这个观点不切题，因为它无法检验，没有实验能区分出系统有思维还是没思维。第三种回答是，中文房间本身不可能存在，因为符号必须对应现实的根基。比方说，只有机器人在实体上把符号跟现实世界中的物体联系起来，这才为符号提供了意义。不管怎么说，希尔勒的“中文房间”固然提供了有趣的视角，但对制造思考机器而言，恐怕算不上一个恼人的限制。


    ### 通用人工智能


    比强人工智能稍微不那么极端的终点是通用人工智能（Artificial General Intelligence，简称`AGI`）。这一目标指的是，制造出来的思考机器有能力解决人类能解决的任何问题，甚至超过人类的水平。我再强调一遍，开发思考机器的绝大多数研究都集中在弱人工智能（制造出可以解决具体问题的机器）而非通用人工智能（制造出能解决任何问题的机器）上。[\[7\]](#chapter001_0008.xhtml#m7)人工智能领域里只有极少数研究人员专注于通用人工智能。通用人工智能有时和强人工智能同义使用，但两者有一个很大的区别。通用人工智能并不一定是拥有思维、具备意识，以及跟思维相关所有一切的思考机器。通用人工智能通常跟超级智能（或者远超人类的智能）的概念同义使用，但真正的通用人工智能其实只是通往超级智能之路上的一步而已。


    尼克·波斯特洛姆将超级智能定义为“在几乎每个领域都比最优秀的人类大脑聪明得多，包括科学创造力、一般智慧和社会技能”。[\[8\]](#chapter001_0008.xhtml#m8)人们常常把通用人工智能和超级智能弄混，原因之一在于，许多人相信，从通用人工智能跃进到超级智能的速度会非常之快。一旦我们实现了通用人工智能，机器就可以自我改进了。因此，在通用人工智能实现后不久，我们将迅速获得超级智能。我们很快会讨论到技术奇点的概念，到时候，我们再转回来深入地聊一聊。


    所以，制造思考机器有几个不同的终点。按照能力的逐级提升，我们会拥有弱人工智能、通用人工智能、超级智能和强人工智能。在探讨不利于思考机器的论据时，有必要把这几个不同的终点记下来。举个例子，反对意识机器的观点，有可能阻止我们实现强人工智能，但并不会阻止弱人工智能甚至通用人工智能。


    ### 反对人工智能的观点


    能思考的机器是个很刺激的设想。它们威胁着要篡夺大部分据说只属于人类的东西。不足为奇，对制造思考机器这一久远的梦想，人们提出了许多反对的观点。事实上，1950年图灵就预见到了这一点：在《心智》杂志所刊登的开创性论文里，他就讨论了不少此类观点，并一一作了批驳。


    图灵讨论过的反人工智能论证之一是无资格说。人们说，计算机或许可以在某些方面采取智能行为，但它们永远不能做出新东西来，它们永远不犯错，它们永远不会坠入爱河，它们永远无法从经验中学习，它们永远没有幽默感，它们永远不会喜欢草莓和奶油。这份清单可以无穷无尽地列下去，但遗憾的是，一如图灵所说，对这些观点，人们很少能拿出支持的证据来。大多数时候，人从没见过做此类任务的机器。


    一些具体的观点很容易反驳。计算机做出新东西的案例很多。在围棋里拿出了新的开局招数，发明了一种新的数字类型，写出了一段新的故事。计算机从经验里学习也有很多例子。`AlphaGo`自己跟自己对弈，学会了下围棋；亚马逊从你和他人过去的互动里学习向你推荐产品；谷歌翻译研究了数百万的例子，学习怎样翻译句子。说到计算机从来不犯错，任何调试过复杂程序的人都会强烈反对。


    图灵还提出了一个相关的论点，也即从数学上反对说，计算机能够用数学证明的事情是有着逻辑限制的。这一反对意见存在的一个问题在于，人类是否存在自身的数学限制，目前尚不完全清楚。你大概认识不少非常聪明的人，学起数学来却一头雾水。这一点姑且不论，就算计算机不能证明所有的数学真理，仍然能够证明许多数学陈述。没错，有一些数学定理只有计算机“证明”过，最著名的是四色定理。该定理提出，任何平面地图最多只需要四种不同的颜色就可完全分隔开来。我们现在找到的唯一证据，就是彻底试尽数百近千种可能存在的着色反例，这样的任务，只有计算机才能不犯错地完成。


    ### 机器能拥有创造力吗


    反对人工智能的、最受欢迎的观点之一来自洛夫莱斯伯爵夫人，即认为计算机没有创造力。针对这一点，回应很多。一是计算机已经创作很多次了，它写诗、作曲、绘画。事实上，电子计算机发明100年前，机器就开始写诗了。孤僻的发明家约翰·克拉克（John
    Clark）用了15年时间，制造了“尤里卡”（`Eureka`），这是一台可生成拉丁文六步格诗的机器。[\[9\]](#chapter001_0008.xhtml#m9)1845年，“尤里卡”在伦敦皮卡迪利做了首演，事实证明，它大受欢迎，因为靠着每人一先令的入场费，克拉克竟然就舒舒服服地过上了退休生活。这台机器要上发条，每当作出一句拉丁语韵文，它就爱国地演奏国歌。“尤里卡”包含了86个轮子，轮子带动一大堆“汽缸、曲柄、螺旋齿轮、拉杆、杠杆、弹簧、棘轮、四分仪、牵引器、轴心轮、偏心轮和星轮”。一番转动，它会生成一条韵文（可能出现的韵文总数是2600万条）。为穷尽数量庞大韵文组合，它要花上一辈子；这里有一条例句：Martia
    castra foris praenarrant的proelia multa。意思是：军队预见到，未来还有许多场战斗。


    计算机如今做得可要好多了。这是雷·库兹韦尔所写“控制论诗人”（`Cybernetic Poet`）程序最近所作的一段俳句：


    疯狂的月之子

    躲开了你的棺木

    跟厄运对抗


    2011年，全世界最古老的由学生运营的文学期刊之一，杜克大学的《文献》（*Archive*），发表了一首短诗，名叫《献给狐尾松的残桩》（*For the Bristlecone
    Snag*）。


    一道闪电改变了家园

    坑坑洼洼，点缀在了一颗星球——地球——的无边大地上。

    它们，用机械的号角攻击它

    因为它们爱你，火与风般浓烈的爱。

    你说，它什么时候会发芽呢？

    我告诉你，要等到你的枝丫飘扬起来

    因为你是闻起来甜丝丝的钻石形结构

    却不知道它怎么会长成了这样。

    '
  trans: '


    早在 1997 年，科夫的计算机平均每 4 个星期就找到一个特定问题的最佳解法。20 年后，我们不到 1 秒就能解开相同的问题。事实上，2017 年 11
    月，英飞凌科技公司（Infineon）用 0.637 秒解开了魔方，创下世界纪录，超过了他们自己此前的纪录 0.887 秒。摄像机把魔方拍摄下来，了解魔方各个方格的混乱情况，接着，他们就计算出了将魔方还原的最快解决方案。此后，由机器人执行这些动作。所有这一切，半秒多一点的时间就完成了，比人类世界纪录快了
    10 倍。2015 年 11 月，来自肯塔基州的 14 岁少年卢卡斯·埃特尔（Lucas Etter）成为第一个打破 5 秒屏障的人，耗时 4.904 秒。


    ### 机器人足球


    世界各地的数百研究人员正在研发可以踢足球的机器人。这似乎是一个奇怪“进球”，不过，它具备许多特点，成了一项有趣的挑战——需要速度、力量、敏捷和协调性，以及策略性的踢球。此外，它很能调动年轻人对机器人产生兴趣。


    一年一度的机器人足球淘汰锦标赛——“机器人世界杯”，自 1997 年以来举办至今。该比赛吸引了 400 支不同队伍的 3000 多名参赛者，还带动了一些相关的活动，比如高中生“小机器人世界杯”以及“机器人救援世界杯”（开发能够在地震或类似灾害中出力帮忙的机器人）。


    机器人要在若干不同的联赛中踢球。蓝带赛事是标准平台联赛，每支队伍都有一台相同的机器人。机器人根据软件来区分，有可能是最优秀的程序获胜。标准平台联赛从 1999
    年开始使用索尼制造的可爱机器狗`AIBO`开赛，等索尼的这款机器狗停产之后，2008 年，联赛又转为使用 58 厘米的人形机器人`Nao`。


    “机器人世界杯”的总体目标是，到 2050 年，在表演赛里击败人类世界冠军队。未来要走的路还长：哪怕是一支 6 岁孩子组成的队伍，也能毫不费力地击败如今最优秀的机器人足球队。不过，机器人的成绩每年都在进步。每场比赛结束的时候，参赛者必须分享他们的代码，让所有人都能从获胜方所展现的进步中受益。


    与人类足球一样，保持领先的仍然是来自德国的球队。在每年举办的机器人世界杯比赛上，德国队赢得了 8 次标准平台联赛。澳大利亚队是颇有实力的竞争者，赢过 7 次。我有幸在一家为这一成功贡献良多的机构里工作。新南威尔士大学赢过
    5 次，更是在 2014 年、2015 年连续夺冠。听到 BBC 广播四台（BBC Radio 4）体育节目播报这个消息的那一刻，我意识到：机器人世界杯打进主流了。


    我对人工智能各个领域的进展情况就讨论到这里。我已经谈过机器在各种任务上的表现，比如下象棋、在两种语言中翻译转换、识别物体等。这些都是我们认为“智能”应该做到的任务。现在，我要谈一谈有哪些具体的限制，可能影响到未来思考机器的发展。


