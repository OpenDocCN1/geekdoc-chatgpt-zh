- raw: "早在1997年，科夫的计算机平均每4个星期就找到一个特定问题的最佳解法。20年后，我们不到1秒就能解开相同的问题。事实上，2017年11月，英飞凌科技公司（Infineon）用0.637秒解开了魔方，创下世界纪录，超过了他们自己此前的纪录0.887秒。摄像机把魔方拍摄下来，了解魔方各个方格的混乱情况，接着，他们就计算出了将魔方还原的最快解决方案。此后，由机器人执行这些动作。所有这一切，半秒多一点的时间就完成了，比人类世界纪录快了10倍。2015年11月，来自肯塔基州的14岁少年卢卡斯·埃特尔（Lucas\
    \ Etter）成为第一个打破5秒屏障的人，耗时4.904秒。\n\n#### 机器人足球\n\n世界各地的数百研究人员正在研发可以踢足球的机器人。这似乎是一个奇怪“进球”，不过，它具备许多特点，成了一项有趣的挑战——需要速度、力量、敏捷和协调性，以及策略性的踢球。此外，它很能调动年轻人对机器人产生兴趣。\n\
    \n一年一度的机器人足球淘汰锦标赛——“机器人世界杯”，自1997年以来举办至今。该比赛吸引了400支不同队伍的3000多名参赛者，还带动了一些相关的活动，比如高中生“小机器人世界杯”以及“机器人救援世界杯”（开发能够在地震或类似灾害中出力帮忙的机器人）。\n\
    \n机器人要在若干不同的联赛中踢球。蓝带赛事是标准平台联赛，每支队伍都有一台相同的机器人。机器人根据软件来区分，有可能是最优秀的程序获胜。标准平台联赛从1999年开始使用索尼制造的可爱机器狗AIBO开赛，等索尼的这款机器狗停产之后，2008年，联赛又转为使用58厘米的人形机器人Nao。\n\
    \n“机器人世界杯”的总体目标是，到2050年，在表演赛里击败人类世界冠军队。未来要走的路还长：哪怕是一支6岁孩子组成的队伍，也能毫不费力地击败如今最优秀的机器人足球队。不过，机器人的成绩每年都在进步。每场比赛结束的时候，参赛者必须分享他们的代码，让所有人都能从获胜方所展现的进步中受益。\n\
    \n与人类足球一样，保持领先的仍然是来自德国的球队。在每年举办的机器人世界杯比赛上，德国队赢得了8次标准平台联赛。澳大利亚队是颇有实力的竞争者，赢过7次。我有幸在一家为这一成功贡献良多的机构里工作。新南威尔士大学赢过5次，更是在2014年、2015年连续夺冠。听到BBC广播四台（BBC\
    \ Radio 4）体育节目播报这个消息的那一刻，我意识到：机器人世界杯打进主流了。\n\n我对人工智能各个领域的进展情况就讨论到这里。我已经谈过机器在各种任务上的表现，比如下象棋、在两种语言中翻译转换、识别物体等。这些都是我们认为“智能”应该做到的任务。现在，我要谈一谈有哪些具体的限制，可能影响到未来思考机器的发展。\n\
    \n* * *\n\n[\\[1\\]](#chapter001_0007_0001.xhtml#w1) 如需更详尽地了解机器学习部落，请见\\[参考书目15\\\
    ]。佩德罗·多明戈斯确认的是5个机器学习部落，但我更偏向于用“宗教团体”这个说法。如果你曾经听过两支宗教团体的成员辩论，坚决不肯向对方让步，你就会理解为什么。\n\
    \n[\\[2\\]](#chapter001_0007_0001.xhtml#w2) 托马斯·贝叶斯约1701年出生，1761年去世。他是统计学家、哲学家和长老会牧师，他的同名定理解决了“逆概率”问题。假设我们知道一口缸里黑球和白球的数量，可以迅速计算出随机抽到黑球的概率。贝叶斯定理允许我们做相反的事情。如果我们观察到抽出黑色球的概率，便可推断出缸里黑球和白球的可能比例。类似地，如果计算机程序观察到一些数据（如相机上的像素），我们可以使用贝叶斯法来推断它最有可能是猫还是狗。\n\
    \n[\\[3\\]](#chapter001_0007_0001.xhtml#w3) 答案是 ![](Images/image238-2996.jpg)。\n\
    \n[\\[4\\]](#chapter001_0007_0001.xhtml#w4) 1968年，麻省理工开始开发Macsyma计算机代数系统，是当时人工智能编程语言LISP所写的最大程序之一（甚至有可能是最大）。\n\
    \n[\\[5\\]](#chapter001_0007_0001.xhtml#w5) 数学A级考试是英国中学毕业考试，相当于澳大利亚新南威尔士州的高中毕业考试，或是美国和加拿大的高中结业考试。\n\
