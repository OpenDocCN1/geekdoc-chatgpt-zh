    \n[\\[7\\]](#chapter001_0007_0001.xhtml#w7) 西蒙·柯尔顿现为伦敦大学金史密斯学院英国法尔茅斯大学创新计算学教授。他的另一项发明是能“画画”的程序“绘画傻瓜”（Painting\
    \ Fool）。他希望有一天，这款程序能被接纳为独立画家。艾伦·邦迪（Alan Bundy）和我有幸指导了西蒙的博士生研究。\n\n[\\[8\\]](#chapter001_0007_0001.xhtml#w8)\
    \ HR的更多情况，请见\\[参考书目12\\]。\n\n[\\[9\\]](#chapter001_0007_0001.xhtml#w9) “深空1号”的名字里虽然也有个“深”字，但它跟深度学习无关。事实上，“深空1号”的控制软件并未使用任何形式的机器学习。\n\
    \n[\\[10\\]](#chapter001_0007_0001.xhtml#w10) Baxter由机器人创业公司Rethink Robotics生产制造。该公司的创办人是著名的褴褛洲人工智能专家罗德尼·布鲁克斯。Baxter可执行生产线上的简单、重复性任务。无须编程也可以教Baxter做工作。你把它的手挪到指定方向，Baxter会记住任务，并能够重复。按照设计，它还可以安全地在人类身边工作，不必像早前的许多工业机器人那样关在笼子里。\n\
    \n[\\[11\\]](#chapter001_0007_0001.xhtml#w11) 互联网对猫咪很着迷。不足为奇，ImageNet光是猫咪的图片就有62000多张。\n\
    \n[\\[12\\]](#chapter001_0007_0001.xhtml#w12) 大规模视觉识别挑战赛的失误率指的是：算法未能为图片从5个疑似标签中找到正确标签的百分比。\n\
    \n[\\[13\\]](#chapter001_0007_0001.xhtml#w13) 见\\[参考书目51\\]。\n\n[\\[14\\]](#chapter001_0007_0001.xhtml#w14)\
    \ 有少数游戏，如《过山车大亨》（*Mornington Crescent*），有违这一观察结论：“游戏有着准确的规则，一清二楚的获胜方”。\n\n[\\\
    [15\\]](#chapter001_0007_0001.xhtml#w15) 我父亲是四子棋迷，于是我把这套能下完美四子棋的程序送给他当礼物。他评论说，这款程序简直破坏了游戏的乐趣。对此，我不能不表示同意。\n\
    \n[\\[16\\]](#chapter001_0007_0001.xhtml#w16) IBM显然不认为销售象棋程序会是多大的买卖，毕竟，大多数人并不需要“深蓝”专为下国际象棋设计的硬件。\n\
    \n[\\[17\\]](#chapter001_0007_0001.xhtml#w17) 出处见“DeepMind founder Demis Hassabis\
    \ on how AI will shape the future”，the Verge，March 10^(th) 2016。\n\n[\\[18\\]](#chapter001_0007_0001.xhtml#w18)\
    \ ELO评分是一种计算两人游戏（如国际象棋）玩家相对技能水平的方法。ELO得名自它的发明者，匈牙利出生的美国物理学教授Arpad Elo。卡斯帕罗夫的巅峰ELO得分是2851。“口袋弗里茨4号”的ELO得分是2898。“深弗里茨”的得分达到了惊人的3150，远远超过了人类有史以来最优秀的棋手马格努斯·卡尔森（Magnus\
    \ Carlsen），他的得分仅为2870。\n\n[\\[19\\]](#chapter001_0007_0001.xhtml#w19) 见\\[参考书目27\\\
    ]。\n\n# 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n\n*   书单分享\n\n*   书友学习交流\n\
    \n**网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\n*   电子书搜索下载\n\
    \n*   电子书打包资源分享\n\n*   学习资源分享\n\n## 第四章  \n\n人工智能的局限性\n\n过去有进步，并不能保证将来必然会进步。我们开发思考机器的梦想，会不会碰到什么限制使其无法实现呢？让我们来看一些试图解释为什么可能永远制造不出思考机器的实践及理论观点。很多机器我们都希望拥有，但在工程上是没可能实现的。时间机器能带我们回到过去，永动机能永远运行。说不定，思考机器也属于同一范畴：很值得拥有，只可惜没这个可能。\n\
    \n其他许多领域也曾碰到过来自理论和实践上的根本性限制。比方说，数学就包含了许多不可能。你不能化圆为方（译注：即给出一个圆形，要求画出一个面积跟它完全一样的正方形）。此外，你大概还记得，不是所有的数学运算都能写出逻辑公式。在物理学上，按照爱因斯坦的理论，不存在比光速更快的速度。时间旅行在实践层面上也几乎不可能，从而避免了“意外杀死自己祖父”这一类的逻辑困境。兴许，制造思考机器的雄心壮志，也会被扼杀在类似的实践或理论限制之下呢？\n\
    \n在考察各种可能存在的限制之前，我们不妨先对自己期望达到的终点做个更谨慎的定义。接下来，我们就可以想想看，是否存在什么东西妨碍我们达到这一点。\n\n###\
    \ 强人工智能\n\n人工智能的可能终点之一是，在一项需要智力的具体任务上，制造出一台等于或超过我们能力的机器。这有时被称为弱人工智能。我们已经在许多专业领域达到了这个终点。举例来说，在下国际象棋、展开空对空作战[\\\
    [1\\]](#chapter001_0008.xhtml#m1)、猜测照片位置[\\[2\\]](#chapter001_0008.xhtml#m2)、诊断肺部疾病[\\\
    [3\\]](#chapter001_0008.xhtml#m3)等方面，计算机跟人类做得同样出色，有时甚至更为出色。\n\n除此之外就是强人工智能。这个概念，来自哲学家约翰·希尔勒（John\
    \ Searle），他曾对人工智能提出过最具雄辩、最响亮的批评。[\\[4\\]](#chapter001_0008.xhtml#m4)强人工智能指的是，思考机器最终将成为思维，或至少具备思维的所有特征，如意识等。另一些与强人工智能相关的人类特征，包括自我意识、知觉、情绪和道德。希尔勒用“中文房间”介绍了强人工智能的设想，这是一个旨在暴露人工智能限制性的著名思想实验。[\\\
    [5\\]](#chapter001_0008.xhtml#m5)\n\n中文房间实验有点儿是图灵测试。假设说，我们把希尔勒关在一间屋子里。出于实验的目的，我们必须知道希尔勒不懂中文，既不会说，也不会写。但房间里有一大堆书，书中用英文说明了中文符号的操作规则。你把写有中文问题的纸条递进屋子。希尔勒按照书中介绍的规则，在另一张纸上写出了问题的答案，并传到门外。现在，假设写下这些问题的中国人分辨不出这些答案到底是来自希尔勒，还是来自某个真正懂得中文的人。那么，希尔勒就问：谁懂中文呢？显然不是他。当然也不是屋子，也不是书籍——它们是无生命的物体。在这种情况下，希尔勒所扮演的角色，就是一台解答中文问题的计算机。故此，我们不能说通过了这种测试的计算机真正理解中文，而理解中文，是对强人工智能的要求。\n\
    \n自此以后，哲学家、认知科学家和人工智能研究人员对希尔勒中文房间实验展开了激烈的讨论。2004年，有人称，“中文房间辩论，或许是过去25年以来认知科学界讨论得最为广泛的哲学问题了”。[\\\
    [6\\]](#chapter001_0008.xhtml#m6)值得强调的是，人工智能领域的大多数研究都是以弱人工智能为重点的。老实说，我怀疑这个领域里只有极少数的研究人员相信我们最终能实现强人工智能，而且，我们并不需要强人工智能就能享受到思考机器带来的几乎所有的好处。我们只需要能跟人类做得同样出色的机器就够了，这样的机器其实并不拥有思维。事实上，如果它们没有思维，我们也就躲开了大量的伦理问题，比方说它们自身是否拥有权利，我们有没有权利关掉它们。\n\
    \n因此，对许多在这个领域工作的人来说，希尔勒的中文房间辩论有点儿无关痛痒。实际上，艾伦·图灵提前20多年就预见到了希尔勒式的批评。引入图灵测试，正是为了反驳希尔勒提出的这类论点。\n\
    \n还有其他许多人也对希尔勒的观点作出了回答。一种回答是，从整体上看，该系统可以说是懂中文的。还有一种回答是，这个观点不切题，因为它无法检验，没有实验能区分出系统有思维还是没思维。第三种回答是，中文房间本身不可能存在，因为符号必须对应现实的根基。比方说，只有机器人在实体上把符号跟现实世界中的物体联系起来，这才为符号提供了意义。不管怎么说，希尔勒的“中文房间”固然提供了有趣的视角，但对制造思考机器而言，恐怕算不上一个恼人的限制。\n\
    \n### 通用人工智能\n\n比强人工智能稍微不那么极端的终点是通用人工智能（Artificial General Intelligence，简称AGI）。这一目标指的是，制造出来的思考机器有能力解决人类能解决的任何问题，甚至超过人类的水平。我再强调一遍，开发思考机器的绝大多数研究都集中在弱人工智能（制造出可以解决具体问题的机器）而非通用人工智能（制造出能解决任何问题的机器）上。[\\\
    [7\\]](#chapter001_0008.xhtml#m7)人工智能领域里只有极少数研究人员专注于通用人工智能。通用人工智能有时和强人工智能同义使用，但两者有一个很大的区别。通用人工智能并不一定是拥有思维、具备意识，以及跟思维相关所有一切的思考机器。通用人工智能通常跟超级智能（或者远超人类的智能）的概念同义使用，但真正的通用人工智能其实只是通往超级智能之路上的一步而已。\n\
    \n尼克·波斯特洛姆将超级智能定义为“在几乎每个领域都比最优秀的人类大脑聪明得多，包括科学创造力、一般智慧和社会技能”。[\\[8\\]](#chapter001_0008.xhtml#m8)人们常常把通用人工智能和超级智能弄混，原因之一在于，许多人相信，从通用人工智能跃进到超级智能的速度会非常之快。一旦我们实现了通用人工智能，机器就可以自我改进了。因此，在通用人工智能实现后不久，我们将迅速获得超级智能。我们很快会讨论到技术奇点的概念，到时候，我们再转回来深入地聊一聊。\n\
    \n所以，制造思考机器有几个不同的终点。按照能力的逐级提升，我们会拥有弱人工智能、通用人工智能、超级智能和强人工智能。在探讨不利于思考机器的论据时，有必要把这几个不同的终点记下来。举个例子，反对意识机器的观点，有可能阻止我们实现强人工智能，但并不会阻止弱人工智能甚至通用人工智能。\n\
    \n### 反对人工智能的观点\n\n能思考的机器是个很刺激的设想。它们威胁着要篡夺大部分据说只属于人类的东西。不足为奇，对制造思考机器这一久远的梦想，人们提出了许多反对的观点。事实上，1950年图灵就预见到了这一点：在《心智》杂志所刊登的开创性论文里，他就讨论了不少此类观点，并一一作了批驳。\n\
    \n图灵讨论过的反人工智能论证之一是无资格说。人们说，计算机或许可以在某些方面采取智能行为，但它们永远不能做出新东西来，它们永远不犯错，它们永远不会坠入爱河，它们永远无法从经验中学习，它们永远没有幽默感，它们永远不会喜欢草莓和奶油。这份清单可以无穷无尽地列下去，但遗憾的是，一如图灵所说，对这些观点，人们很少能拿出支持的证据来。大多数时候，人从没见过做此类任务的机器。\n\
    \n一些具体的观点很容易反驳。计算机做出新东西的案例很多。在围棋里拿出了新的开局招数，发明了一种新的数字类型，写出了一段新的故事。计算机从经验里学习也有很多例子。AlphaGo自己跟自己对弈，学会了下围棋；亚马逊从你和他人过去的互动里学习向你推荐产品；谷歌翻译研究了数百万的例子，学习怎样翻译句子。说到计算机从来不犯错，任何调试过复杂程序的人都会强烈反对。\n\
    \n图灵还提出了一个相关的论点，也即从数学上反对说，计算机能够用数学证明的事情是有着逻辑限制的。这一反对意见存在的一个问题在于，人类是否存在自身的数学限制，目前尚不完全清楚。你大概认识不少非常聪明的人，学起数学来却一头雾水。这一点姑且不论，就算计算机不能证明所有的数学真理，仍然能够证明许多数学陈述。没错，有一些数学定理只有计算机“证明”过，最著名的是四色定理。该定理提出，任何平面地图最多只需要四种不同的颜色就可完全分隔开来。我们现在找到的唯一证据，就是彻底试尽数百近千种可能存在的着色反例，这样的任务，只有计算机才能不犯错地完成。\n\
    \n### 机器能拥有创造力吗\n\n反对人工智能的、最受欢迎的观点之一来自洛夫莱斯伯爵夫人，即认为计算机没有创造力。针对这一点，回应很多。一是计算机已经创作很多次了，它写诗、作曲、绘画。事实上，电子计算机发明100年前，机器就开始写诗了。孤僻的发明家约翰·克拉克（John\
    \ Clark）用了15年时间，制造了“尤里卡”（Eureka），这是一台可生成拉丁文六步格诗的机器。[\\[9\\]](#chapter001_0008.xhtml#m9)1845年，“尤里卡”在伦敦皮卡迪利做了首演，事实证明，它大受欢迎，因为靠着每人一先令的入场费，克拉克竟然就舒舒服服地过上了退休生活。这台机器要上发条，每当作出一句拉丁语韵文，它就爱国地演奏国歌。“尤里卡”包含了86个轮子，轮子带动一大堆“汽缸、曲柄、螺旋齿轮、拉杆、杠杆、弹簧、棘轮、四分仪、牵引器、轴心轮、偏心轮和星轮”。一番转动，它会生成一条韵文（可能出现的韵文总数是2600万条）。为穷尽数量庞大韵文组合，它要花上一辈子；这里有一条例句：Martia\
    \ castra foris praenarrant的proelia multa。意思是：军队预见到，未来还有许多场战斗。\n\n计算机如今做得可要好多了。这是雷·库兹韦尔所写“控制论诗人”（Cybernetic\
    \ Poet）程序最近所作的一段俳句：\n\n疯狂的月之子\n\n躲开了你的棺木\n\n跟厄运对抗\n\n2011年，全世界最古老的由学生运营的文学期刊之一，杜克大学的《文献》（*Archive*），发表了一首短诗，名叫《献给狐尾松的残桩》（*For\
    \ the Bristlecone Snag*）。\n\n一道闪电改变了家园\n\n坑坑洼洼，点缀在了一颗星球——地球——的无边大地上。\n\n它们，用机械的号角攻击它\n\
    \n因为它们爱你，火与风般浓烈的爱。\n\n你说，它什么时候会发芽呢？\n\n我告诉你，要等到你的枝丫飘扬起来\n\n因为你是闻起来甜丝丝的钻石形结构\n\n\
    却不知道它怎么会长成了这样。"
