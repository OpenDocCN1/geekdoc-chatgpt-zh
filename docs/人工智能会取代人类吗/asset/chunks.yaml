    共同学习跟集体学习有关，但又不同。社会学家、人类学家和其他一些学者探讨过人类种群通过代际之间的集体学习来进步。相比之下，共同学习指的是群体内的个体进行学习。共同学习涵盖技能和知识。共同学习的时间尺度，远比集体学习的代际知识转移要短。共同学习当然也适合更长的时间尺度。我们现在学到的东西，可以在未来的任何时间点上传到计算机。数字知识与人类知识不同，它从不会腐烂。


    想象一下，如果人类可以像计算机一样共同学习会怎样。你能够学会说地球上的每种语言，你学到的东西永远不会遗忘，你下棋能下得跟加里·卡斯帕罗夫、李世石一样好，你能像欧拉、高斯和埃尔德什一样轻松地证明定理，你可以写出足以跟莎翁媲美的诗歌和戏剧，你可以演奏任何一种乐器。总而言之，你将拥有地球上任何人拥有的最优秀能力。这听起来叫人战栗，但这就是计算机共同学习的未来。


    人类能进行有限形式的共同学习。我们有两种基本机制，其一是口头语言。然而，作为一种共同学习机制，它的局限性太大了——只有在能听到对方说话的距离内，我们才能向对方学习；我们只能共同学习人能够表达的内容。我女儿早就证明，告诉别人该怎么骑自行车，对正在学骑自行车的人没什么帮助。我们拥有的第二种共同学习机制是写作。写作要有效得多，事实上，写作是人类最具变革性的发明之一。写作令我们能在整个人类种群里进行共同学习。一旦你学到新的东西，你可以把它写下来，跨越时空与地球上的其他人分享。没有写作，文明的进步会慢得多。


    然而，作为共同学习的机制，写作也有着一定的局限性——它速度很慢。阅读要花时间，写作也仅仅表达的是对所学内容的描述。相比之下，计算机代码可以迅速共享，并立即执行。这让计算机之间的共同学习比人类共同学习有着明显的优势。地球上每部苹果智能手机都能学习、改进其他所有苹果智能手机所用的语音识别代码。每辆特斯拉汽车都可以改善自己的驾驶和其他每一辆特斯拉汽车的驾驶。每台Nest智能家居控制器，都能为自己，也为地球上其他的每台Nest智能家居控制器学习更高的能源使用效率。下一场即将到来的革命（思考机器的发明）为什么会在速度上出乎许多人的意料，共同学习是原因之一。全球规模的学习，将飞速提高人工智能系统。


    围绕人工智能局限性的讨论就到此为止了。我已经讨论了哪些因素有可能妨碍我们发展人工智能，以及计算机受到的限制可能比人类要少的原因。现在，我们要来看看思考机器对人类文明的长短期影响。


