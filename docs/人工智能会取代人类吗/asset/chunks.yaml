- raw: '我的第二点困惑是，智能指数增长的概念，完全取决于衡量智能所用的尺度。例如，人们常用对数尺度来衡量声音。20分贝比10分贝大10倍。30分贝则是10分贝的100倍，数学家称之为“对数空间”。如果我们在类似声音的这种对数空间里测量声音，那么指数增长也就是线性的罢了。这里，我无意就衡量机器智能到底是什么意思展开讨论。我只是假设这样一种情况：如果智能存在一种可以衡量、比较的特性，而技术奇点指的是，按恰当而合理的尺度，该指标呈指数倍增长。


    ### 奇点可能永远不会到来


    技术奇点的概念，更多的是主流人工智能社群之外而非之内的辩论主题。在某种程度上，这可能是因为，许多支持奇点论的人都是领域外人士。技术奇点还跟一些颇具挑战性的设想，如延续生命、超人类主义（transhumanism）等挂上了钩。这挺遗憾的，因为它令辩论脱离了根本性的问题：我们能不能开发出可以反复自我改进的机器，使其智能快速提升并超越人类？


    这似乎不算一个特别疯狂的想法。计算领域从大量的指数发展趋势中获益颇多。自1965年以来，摩尔定律基本准确地预测，集成电路上晶体管的数量（即芯片中存储器的数量）每两年翻一倍。20世纪50年代以来，库梅定律准确地预测，计算机使用每焦耳能量进行的运算数量，每18个月翻一倍。正是靠着这些指数发展趋势，计算机开发经历了半个世纪之后，为你带来了智能手机。如果同一时期汽车实现了同等技术进步，那么，它们会缩到蚂蚁那么大，靠一桶汽油能跑上一辈子。那么，基于这些指数趋势，认为人工智能到了某个时候将出现指数增长，又有什么不合理的地方呢？


    不过，针对技术奇点出现的可能性，有人提出了若干有力的反对观点。[^(\[30\])](#chapter001_0008.xhtml#m30)我最好是说得再准确一些：我并不是在预测人工智能永远不能达到或超越人类智能。我的意见是，不会出现有些人所说的那种失控性指数增长。更大的可能是，我们要靠自己给思考机器的大部分智能编程。这将需要大量的科学和工程工作。我们不会在某天早上醒来，发现机器一夜之间就自我改进了，人类不再是地球上最聪明的生物。


    既然讨论的是机器和人类的智能，我们必须要把“智能”到底是什么意思说个明白。我不会正面探讨它，但可以简单地做个假设：智能有一种特性，可以衡量并进行比较。有了这个假设，我就能够讨论反对技术奇点的几个有力观点了。反对技术奇点的观点不止一个。比方说，我们可以把前文讨论过的所有反对人工智能本身的观点继续扩展。例如，机器永远不会思考，因为它们没有意识。机器永远不能思考，因为它们没有创造力。不过，这里，我着重要讨论直接反对智能指数倍失控增长的观点。


    #### “捷思狗”（FAST-THINKING DOG）说


    技术奇点的支持者们都曾提出过一个相同的观点：相较于人类大脑硬件，计算机在速度和存储方面有着重大优势。这些优势每年都呈指数级增长。很遗憾，速度和存储本身并不会提升智能。弗诺·文奇提出过一个观点：一条思考速度更快的狗，恐怕还是不太可能会下象棋。[^(\[31\])](#chapter001_0008.xhtml#m31)史蒂芬·平克雄辩地为此作了阐释：


    没有丝毫的理由相信奇点即将降临。你能运用自己的想象力，生动地构想这样一个未来，并不是它真正可能出现的证据。蒙着圆顶的城市、上下班靠喷气式背包、水下城市、数英里高的建筑、核动力汽车——这些都是我小时候的未来幻想，但它们从未降临。纯粹的处理能力不是一包能神奇地解决所有问题的魔法药粉。[^(\[32\])](#chapter001_0008.xhtml#m32)


    智能不仅仅是对一个问题比别人想得更快、更久，或是罗列更多的事实。诚然，摩尔定律一类的计算发展趋势，肯定有助于对人工智能的追求。我们现在对规模更大的数据集展开学习，我们学习得更快了。但是，至少对人类而言，智能还取决于其他许多事情，包括多年的经验和训练。目前还说不清楚，光靠着提高计时速度、连接更多储存，是否就能在硅片里抄到捷径。


    #### “人类本位”（ANTHROPOCENTRISM）说


    技术奇点的许多描述假设，人类智能是一个可以超越的点，某种“临界点”。例如，尼克·波斯特洛姆写道：“人类水平的人工智能很快会带来超过人类水平的人工智能……机器和人类大致匹敌的时间间隔可能很短暂。过不了多久，人类在智力上就没办法与人工智能相提并论了。”[^(\[33\])](#chapter001_0008.xhtml#m33)


    然而，在从昆虫到老鼠、从狗到猿猴再到人类的这一更宽泛的频谱上，人类智能也只不过是一个点。实际上，说这是概率分布而非单独的一个点更合适。我们每个人都落在这一分布形态的不同点位上。


    假如说科学史能教会我们一件事，那就是：人类并不像我们自己以为的那么特殊。哥白尼告诉我们，宇宙不是围绕地球转动的。达尔文告诉我们，我们只是动物王国里的一员，跟我们的猿猴表亲基本上出自同一世系。而人工智能可能会告诉我们，人类智能本身没有什么特殊的地方，依靠机器，我们可以重现并超越它。因此，没有理由假设跟人类智能相匹敌就是一块特殊的里程碑，一旦超越，智能即可迅速提升。当然，这并不排除如下可能性：智能到了一定的阶段，会出现此类转折点。


    技术奇点的支持者提出一个观点：由于我们具备独特的能力，可制造出放大我们智力能力的人工制品，故此，我们是有待超越的特殊点。我们是地球上唯一具备足够智能来设计新智能的生物，而且，这种新的智能不会受制于繁殖与进化的缓慢过程。然而，这种观点是在循环论证。它假设人类智能足以设计出具备足够智能、实现技术奇点的人工智能。换句话说，它假设我们具备足够的智能来启动技术奇点，也即我们努力想要达到的最终目标。要设计出这样的人工智能，我们可能具备了足够的智能，也可能没有。它没有必然性。就算我们具备了足够的智能来设计超级人工智能，这个超级人工智能说不定也不足以带来技术奇点。


    #### “元智能”（META-INTELLIGENCE）说


    我最喜欢的反对技术奇点概念的一个观点是，它把完成一项任务的智能，跟改进智能完成一项任务的能力搞混淆了。大卫·查尔莫斯（David Chalmers）在详尽分析了技术奇点概念的文章中写道：“如果我们依靠机器学习制造出了人工智能，那么，我们可能很快就能够改进学习算法，拓展学习过程，带来进阶版人工智能。”[^(\[34\])](#chapter001_0008.xhtml#m34)人工智能指的是一套有着人类智能水平的系统，而进阶版人工智能，则是一套比最聪明的人还要聪明的系统。查尔莫斯的逻辑，在“我们可能很快就能够改进学习算法”这句话里出现了信仰飞跃。这里没什么“可能”的，机器学习算法的进步，既不特别迅速，也并不十分容易。日后，如果我们真的制造出了人类智能水平的人工智能系统，机器学习也的确可能是它的重要组成部分，但这只不过是因为手动编码所有必需的知识和专业技术太痛苦了。假设人工智能系统运用机器学习来改进自己在某项需要智能的任务上的绩效，比方说把文本从英语翻译成德语，但这样的系统，不可能改进它自己所用的基本机器学习算法。机器学习算法常常在特定的任务上表现出众，而且，再多的调整似乎也不能再让它们进步了。


    当然，我们目前看到使用深度学习的人工智能取得了令人瞩目的进展，它大大改善了语音识别、计算机视觉、自然语言处理等多个领域的现状，但这些进步并没有从根本上改变机器学习所采用的反向传播算法，而进步主要来自大规模的数据集和更深的神经网络。深度学习三巨头之一的扬·勒丘恩（Yann
    LeCun）[^(\[35\])](#chapter001_0008.xhtml#m35)归结于规模：“以前，神经网络在识别连续语音上无法打破纪录，它们还不够大。”[^(\[36\])](#chapter001_0008.xhtml#m36)


    更多的数据和更大的神经网络意味着我们需要更多的处理能力。因此，为了提供这种处理能力，需要经常使用GPU。然而，更好地识别语言或识别物体，并没有令深度学习本身获得任何改进。处于深度学习核心的反向传播算法，有了些许调整。但20年来神经网络研究带来的最重大改进是，有了更大的网络、更大的数据集和更强的处理能力。


    我们可以利用目前所知最优秀的智能系统案例之一，从另一个角度来看待这个观点。让我们来看看人类的大脑。对人类而言，学习怎样完成一项具体的任务，远比学习一般性知识更容易。如果我们去掉智商定义[^(\[37\])](#chapter001_0008.xhtml#m37)内置的规范化条件，那么，人类的智商自20世纪以来提高得非常缓慢。而且，如果你想在今天提高自己的智商，就跟一个世纪以前同样的缓慢而痛苦。即便人对大脑怎样学习的知识水平已经提高了，还能运用许多能够帮助学习的新技术，情况也并未有所改变。或许，思考机器要想提升绩效也是同样纠结的，甚至可能永远无法摆脱其根本的局限性，走得很远。


    #### “收益递减”说


    技术奇点的许多论点假设，智能的进步是个相对恒定的乘数，每一代都能比前一代好那么一点点。然而，迄今为止，大多数人工智能带给我们的体验是收益递减的。起初，我们摘的是那些挂在低树枝梢头的果子，进步很快，但很快我们就遇到困难了。人工智能系统或许可以自我改善无数次，但智能的改变程度整体而言却可能是有限制的。举例来说，如果每一代只能提升上一次改善的一半，那么，系统就无法将最初的智能翻倍。[^(\[38\])](#chapter001_0008.xhtml#m38)


    收益递减可能不仅仅来自改善人工智能算法的难度，还来自其主题迅速增加的难度。微软公司的联合创办人保罗·艾伦（Paul Allen）确认了这一现象：


    我们把这个问题叫作“复杂性刹车”（complexity brake）。随着我们对自然系统的理解越来越深入，我们常常发现，需要越来越多的专业知识来归纳其特点，我们被迫不断地以越来越复杂的方式拓展科学理论……我们相信，\[认知\]知识的进步，会因复杂性刹车而从根本上放缓。[^(\[39\])](#chapter001_0008.xhtml#m39)


    哪怕我们真的在人工智能系统身上看到了连续的甚至指数倍的进步，可能仍不足以提高其性能。智能还没提升，有待解决的问题的难度说不定就已经更迅速地提高了。


    #### “智能限度”说


    另一个反对观点是，技术奇点有可能出现根本性限制。有一些限制来自物理学。爱因斯坦告诉我们，你不可能加速超过光速。海森堡教给我们，你无法完全准确地同时知道位置和动量。欧内斯特·卢瑟福（Ernest
    Rutherford）和弗雷德里克·索迪（Frederick Soddy）教导我们，你无法确切地知道原子的放射性衰变何时出现。人类制造的任何思考机器，都将受到这些物理规律的限制。当然，如果这台机器是电子甚或量子的，那么，这些限制可能比我们人类大脑所受的生物和化学限制要大得多。人脑的时钟频率为每秒几十个周期。当今计算机的时钟频率是每秒数十亿个周期，比人脑快几百万倍。人类大脑用庞大的并行性弥补了自身缓慢的时钟频率。即便如此，一台速度缓慢的机器能做这么多，也是很了不起的。很明显，从初始时钟频率方面来看，计算机恐怕有着显著的优势。


    然而，复杂系统里出现了更为经验性的法则。例如，邓巴数（Dunbar’s number）指的是，灵长类动物的大脑尺寸和平均社会群体规模有着相关性。故此，人类的社会群体有着规模限制：100到250人。智能同样是复杂现象，很可能存在这类复杂性带来的限制条件。机器智能的进步（不管是失控还是来得更缓慢），说不定很快就会碰到这种限制。当然，没有理由假设我们人类自己的智能正处于或已经接近这一极限。但同样地，也没有什么理由能说我们自己的智能离此类限制还早得很。


    另一项限制，或许只是因为大自然固有的不确定性。不管你多么努力地思考一个问题，决策质量始终是有限的。预测下一期欧洲乐透彩票，哪怕是超级智能也并不会比我们做得更好。最后，计算已经碰到了一些纯粹物理上的限制。量子世界的不确定性限制了人能把计算机造得多小。2016年3月，英特尔宣布，摩尔定律要结束了，芯片只能再继续缩小5年了。英特尔正将焦点转移到功耗等领域（部分原因是为了满足我们对移动设备的需求）。


    #### “计算复杂性”说


    人类对指数的理解是非常蹩脚的。许多人都会低估复合增长的影响。但出于同样的道理，还有更多人倾向于高估指数增长的力量。有一种观点认为，指数改进足以破解任何问题。这是个误解。


    计算复杂性（Computational complexity）是计算机科学下的分支，它考查的是算法运行得有多快或多慢。有些计算问题很容易，比如，我们可以快速把一张姓名列表按字母顺序排列好，这耗用的时间，只比一个接一个地梳理名单稍长。其他计算问题就有些难度了，例如，我们可以在快于n²但慢于n³的时间里，将两个n×n的数字矩阵乘到一起。这到底是什么意思呢？如果我们要把所乘的矩阵大小翻倍，那么，把它们乘到一起的时间增加4倍以上（也即2²），但少于8倍（也即2³）。


    还有更难解决的计算问题。例如，解决卡车配送问题\[更常见的名字叫“旅行推销员（TSP）问题”\]的已知最优算法，要花掉指数级的时间。每当我们添加一个新的访问目的地，算法的运行时间就增加一个常数因子。这是指数增长的标志。


    对指数增长为什么令人痛苦的经典解释，来自一个古老的印度象棋传说。为了让圣人和自己下象棋，国王允诺说，圣人要什么奖品都可以。圣人在棋盘的第一格里要一粒米，第二格两粒米，第三格4粒米，依此类推。国王显然并不精通指数增长，答应了这个条件。在棋盘的第64格上，国王必须要放上18000000000000000000粒米。这相当于2100亿吨大米，足以覆盖整个印度。


    我们对摩尔定律等指数趋势带来的好处几乎视而不见了。但指数改进无助于解决一些最简单的问题，如计算列表的所有排列。解决这个问题的最优算法，仍然要花掉指数倍的时间才能把题目解出来。[^(\[40\])](#chapter001_0008.xhtml#m40)计算复杂性大概就是前文讨论过的根本性限制之一。除非我们使用远超传统计算模式的计算机，否则，我们很可能会碰到许多计算复杂性从根本上限制了绩效的问题。


    你或许以为，蓬勃发展的量子计算领域能为这一方向带来些指望。量子计算机带来了并行执行多项计算的潜力。在传统计算机里，每个比特代表两种可能的状态——0或1，计算在这种单一状态下进行。而在量子计算机中，每个量子比特（或qbit）是这两种不同状态的叠加，因此，计算可以在指数倍的状态下同时执行。这样一来，较之经典计算机，量子计算机有望实现指数倍的加速。遗憾的是，如前所述，有许多计算问题，哪怕是指数倍的提速也不足以“驯服”它们。因此，量子计算机很有帮助，但本身还不足以让我们达到技术奇点。


    尽管存在上述这些反对技术奇点的观点，但我坚信，总有一天，在某些任务上，我们能制造出有着人类甚至超人智能水平的思考机器。在我看来，没有什么根本上的原因能妨碍我们制造出足以匹敌甚至超过人类智能的机器。不过，我也认为，通往超人智能水平的道路不会太容易。实现了有着人类智能水平的机器，后面的发展可不会像是简单的智能滚雪球。我的同事们肯定会付出更多的心血才能实现这一宏伟目标。


    ### 模拟大脑


    有些人提出了另一条通往思考机器的“简单”路线：效法我们拥有的大好例子，我们可以对人类大脑进行模拟。这种方法同样存在许多挑战。


    首先，这个问题的规模庞大。如我们所见，人类今天构造的神经网络的连接数量，远比大脑要少。但我们还不能在这里停下来，我们恐怕还需要对神经元上的树突、对树突上长出来的树突棘建模，需要模拟大脑的化学和电活动。哪怕只对一个神经元进行如此详细的建模，对如今运转速度最快的计算机来说也是极大的挑战。


    第二，我们可能要复制大脑里大量不同的复杂结构，这将挑战我们对大脑的映射能力。在整个宇宙里，大脑是迄今为止我们已知最复杂的系统，这不会是一件容易的事情。


    第三，就算我们可以成功地模拟大脑，这或许也不过是带来了一个黑盒子。较之我们自己的大脑，它对智能或许提不出来什么更精彩的见解。有了电子和化学物质的模拟流，我们大概也并不能比观察大脑里真实的电子和化学物质流更好地理解智能怎样产生。


    ### 解决智能


    让我们来想想，到了我们能制造出思考机器的那一天，我们无法保证在此过程中能“解决”智能。我说“解决”智能的意思是，我们应该提出一套理论，就像物理学家设计出来为宇宙运动建模的那些理论。通过它们，我们可以预测天空中天体的位置，还可以准确地飞到其他行星去。我们需要一种智能理论，既能解释智能怎样从复杂系统里出现，也能让我们构建新的甚至更为智能的系统。


    抽象可能会是此种理论的重要组成部分。化学对量子物理学所发现的更精确理论做了抽象概括。在为化学反应建模的过程中，我们并未彻底解决薛定谔方程。反过来，生物学又对我们细胞里的化学做了抽象概括。例如，我们的进化理论不仅仅是DNA遗传学和化学的叙述，它们对其他许多因素做了抽象概括，如地理对种群的影响。任何智能理论，很可能极大地依赖类似的抽象归纳。


    在处理更大的复杂性时，其他科学已经退回到更侧重于描述的理论。我们最终可能拥有的是一套描述性而非预测性的智能理论。碰到最糟糕的情况，我们说不定只能提出一种类似经济学那样的主题（在经济学领域，理论甚至不能很好地描述实体经济怎样运行）。同样道理，制造思考机器带来的任何智能理论，可能都无法解释智能。一台能思考的机器，说不定就像其他人的思想那样，是我们不可知的。但愿不会出现这样的情况。


    ### 人类的限制


    我想用个昂扬乐观的音符结束本章，或许，事实将证明，人类所受的限制，或许对机器并不会成为太大的限制。人类要承受一些强有力的生物学限制。我们的大脑尺寸受到母亲产道的严格限制；我们的大脑相当缓慢，时钟频率约为10Hz；它在很小的功率下运作，大概20瓦；尽管如此，它却消耗了我们身体所需能量的1/3。相比之下，计算机能以更高的时钟频率运行，具有更大的存储空间、更多的传感器，功率也更强。


    人类智能还受到进化的限制。我们的智能是演化出来的。大自然只探索了一条达到人类水平智能的路，没有理由假设演化找到了执行智能的最佳途径。特别是，随着人年龄的增长，我们发现，身体的许多部位，其工程设计都很蹩脚。大多数时候，它们只够让我们挨过日子。演进是一种非常缓慢的进步：要用上几十年才能过渡到下一代。相比之下，对计算机来说，我们可以用更快的速度探索更多的设计途径。


    ### 集体学习


    还有最后一个领域我想讨论，在这个领域中，人类比计算机受到更多的限制——这就是学习。我们人类必须为自己学习很多东西。你学会了怎样骑自行车，对我学习骑自行车的帮助有限。相反，机器有着分享学习的独特能力。如果一辆特斯拉汽车学会了怎样识别、避开失控的购物手推车，我们可以把这些新的代码上传给全世界的特斯拉汽车，所有特斯拉汽车就都可以识别并避开失控的购物车了。一辆车学习，每辆车都分享到了绩效的提升。而且，这不仅仅指的是如今全世界的所有特斯拉，还包括未来将要生产出的每辆特斯拉。这是一个重要的概念，我已为它起好了名字：共同学习（colearning）。


    **共同学习的定义**


    集体性团体的代理人直接为自己学习，或是间接从其他代理处学习。'
  fmt: '

    我的第二点困惑是，智能指数增长的概念，完全取决于衡量智能所用的尺度。例如，人们常用对数尺度来衡量声音。20分贝比10分贝大10倍。30分贝则是10分贝的100倍，数学家称之为“对数空间”。如果我们在类似声音的这种对数空间里测量声音，那么指数增长也就是线性的罢了。这里，我无意就衡量机器智能到底是什么意思展开讨论。我只是假设这样一种情况：如果智能存在一种可以衡量、比较的特性，而技术奇点指的是，按恰当而合理的尺度，该指标呈指数倍增长。


    ## 奇点可能永远不会到来


    技术奇点的概念，更多的是主流人工智能社群之外而非之内的辩论主题。在某种程度上，这可能是因为，许多支持奇点论的人都是领域外人士。技术奇点还跟一些颇具挑战性的设想，如延续生命、超人类主义（transhumanism）等挂上了钩。这挺遗憾的，因为它令辩论脱离了根本性的问题：我们能不能开发出可以反复自我改进的机器，使其智能快速提升并超越人类？


    这似乎不算一个特别疯狂的想法。计算领域从大量的指数发展趋势中获益颇多。自1965年以来，摩尔定律基本准确地预测，集成电路上晶体管的数量（即芯片中存储器的数量）每两年翻一倍。20世纪50年代以来，库梅定律准确地预测，计算机使用每焦耳能量进行的运算数量，每18个月翻一倍。正是靠着这些指数发展趋势，计算机开发经历了半个世纪之后，为你带来了智能手机。如果同一时期汽车实现了同等技术进步，那么，它们会缩到蚂蚁那么大，靠一桶汽油能跑上一辈子。那么，基于这些指数趋势，认为人工智能到了某个时候将出现指数增长，又有什么不合理的地方呢？


    不过，针对技术奇点出现的可能性，有人提出了若干有力的反对观点。[^(\[30\])](#chapter001_0008.xhtml#m30)我最好是说得再准确一些：我并不是在预测人工智能永远不能达到或超越人类智能。我的意见是，不会出现有些人所说的那种失控性指数增长。更大的可能是，我们要靠自己给思考机器的大部分智能编程。这将需要大量的科学和工程工作。我们不会在某天早上醒来，发现机器一夜之间就自我改进了，人类不再是地球上最聪明的生物。


    既然讨论的是机器和人类的智能，我们必须要把“智能”到底是什么意思说个明白。我不会正面探讨它，但可以简单地做个假设：智能有一种特性，可以衡量并进行比较。有了这个假设，我就能够讨论反对技术奇点的几个有力观点了。反对技术奇点的观点不止一个。比方说，我们可以把前文讨论过的所有反对人工智能本身的观点继续扩展。例如，机器永远不会思考，因为它们没有意识。机器永远不能思考，因为它们没有创造力。不过，这里，我着重要讨论直接反对智能指数倍失控增长的观点。


    ### “捷思狗”（FAST-THINKING DOG）说


    技术奇点的支持者们都曾提出过一个相同的观点：相较于人类大脑硬件，计算机在速度和存储方面有着重大优势。这些优势每年都呈指数级增长。很遗憾，速度和存储本身并不会提升智能。弗诺·文奇提出过一个观点：一条思考速度更快的狗，恐怕还是不太可能会下象棋。[^(\[31\])](#chapter001_0008.xhtml#m31)史蒂芬·平克雄辩地为此作了阐释：


    没有丝毫的理由相信奇点即将降临。你能运用自己的想象力，生动地构想这样一个未来，并不是它真正可能出现的证据。蒙着圆顶的城市、上下班靠喷气式背包、水下城市、数英里高的建筑、核动力汽车——这些都是我小时候的未来幻想，但它们从未降临。纯粹的处理能力不是一包能神奇地解决所有问题的魔法药粉。[^(\[32\])](#chapter001_0008.xhtml#m32)


    智能不仅仅是对一个问题比别人想得更快、更久，或是罗列更多的事实。诚然，摩尔定律一类的计算发展趋势，肯定有助于对人工智能的追求。我们现在对规模更大的数据集展开学习，我们学习得更快了。但是，至少对人类而言，智能还取决于其他许多事情，包括多年的经验和训练。目前还说不清楚，光靠着提高计时速度、连接更多储存，是否就能在硅片里抄到捷径。


    ### “人类本位”（ANTHROPOCENTRISM）说


    技术奇点的许多描述假设，人类智能是一个可以超越的点，某种“临界点”。例如，尼克·波斯特洛姆写道：“人类水平的人工智能很快会带来超过人类水平的人工智能……机器和人类大致匹敌的时间间隔可能很短暂。过不了多久，人类在智力上就没办法与人工智能相提并论了。”[^(\[33\])](#chapter001_0008.xhtml#m33)


    然而，在从昆虫到老鼠、从狗到猿猴再到人类的这一更宽泛的频谱上，人类智能也只不过是一个点。实际上，说这是概率分布而非单独的一个点更合适。我们每个人都落在这一分布形态的不同点位上。


    假如说科学史能教会我们一件事，那就是：人类并不像我们自己以为的那么特殊。哥白尼告诉我们，宇宙不是围绕地球转动的。达尔文告诉我们，我们只是动物王国里的一员，跟我们的猿猴表亲基本上出自同一世系。而人工智能可能会告诉我们，人类智能本身没有什么特殊的地方，依靠机器，我们可以重现并超越它。因此，没有理由假设跟人类智能相匹敌就是一块特殊的里程碑，一旦超越，智能即可迅速提升。当然，这并不排除如下可能性：智能到了一定的阶段，会出现此类转折点。


    技术奇点的支持者提出一个观点：由于我们具备独特的能力，可制造出放大我们智力能力的人工制品，故此，我们是有待超越的特殊点。我们是地球上唯一具备足够智能来设计新智能的生物，而且，这种新的智能不会受制于繁殖与进化的缓慢过程。然而，这种观点是在循环论证。它假设人类智能足以设计出具备足够智能、实现技术奇点的人工智能。换句话说，它假设我们具备足够的智能来启动技术奇点，也即我们努力想要达到的最终目标。要设计出这样的人工智能，我们可能具备了足够的智能，也可能没有。它没有必然性。就算我们具备了足够的智能来设计超级人工智能，这个超级人工智能说不定也不足以带来技术奇点。


    ### “元智能”（META-INTELLIGENCE）说


    我最喜欢的反对技术奇点概念的一个观点是，它把完成一项任务的智能，跟改进智能完成一项任务的能力搞混淆了。大卫·查尔莫斯（David Chalmers）在详尽分析了技术奇点概念的文章中写道：“如果我们依靠机器学习制造出了人工智能，那么，我们可能很快就能够改进学习算法，拓展学习过程，带来进阶版人工智能。”[^(\[34\])](#chapter001_0008.xhtml#m34)人工智能指的是一套有着人类智能水平的系统，而进阶版人工智能，则是一套比最聪明的人还要聪明的系统。查尔莫斯的逻辑，在“我们可能很快就能够改进学习算法”这句话里出现了信仰飞跃。这里没什么“可能”的，机器学习算法的进步，既不特别迅速，也并不十分容易。日后，如果我们真的制造出了人类智能水平的人工智能系统，机器学习也的确可能是它的重要组成部分，但这只不过是因为手动编码所有必需的知识和专业技术太痛苦了。假设人工智能系统运用机器学习来改进自己在某项需要智能的任务上的绩效，比方说把文本从英语翻译成德语，但这样的系统，不可能改进它自己所用的基本机器学习算法。机器学习算法常常在特定的任务上表现出众，而且，再多的调整似乎也不能再让它们进步了。


    当然，我们目前看到使用深度学习的人工智能取得了令人瞩目的进展，它大大改善了语音识别、计算机视觉、自然语言处理等多个领域的现状，但这些进步并没有从根本上改变机器学习所采用的反向传播算法，而进步主要来自大规模的数据集和更深的神经网络。深度学习三巨头之一的扬·勒丘恩（Yann
    LeCun）[^(\[35\])](#chapter001_0008.xhtml#m35)归结于规模：“以前，神经网络在识别连续语音上无法打破纪录，它们还不够大。”[^(\[36\])](#chapter001_0008.xhtml#m36)


    更多的数据和更大的神经网络意味着我们需要更多的处理能力。因此，为了提供这种处理能力，需要经常使用GPU。然而，更好地识别语言或识别物体，并没有令深度学习本身获得任何改进。处于深度学习核心的反向传播算法，有了些许调整。但20年来神经网络研究带来的最重大改进是，有了更大的网络、更大的数据集和更强的处理能力。


    我们可以利用目前所知最优秀的智能系统案例之一，从另一个角度来看待这个观点。让我们来看看人类的大脑。对人类而言，学习怎样完成一项具体的任务，远比学习一般性知识更容易。如果我们去掉智商定义[^(\[37\])](#chapter001_0008.xhtml#m37)内置的规范化条件，那么，人类的智商自20世纪以来提高得非常缓慢。而且，如果你想在今天提高自己的智商，就跟一个世纪以前同样的缓慢而痛苦。即便人对大脑怎样学习的知识水平已经提高了，还能运用许多能够帮助学习的新技术，情况也并未有所改变。或许，思考机器要想提升绩效也是同样纠结的，甚至可能永远无法摆脱其根本的局限性，走得很远。


    ### “收益递减”说


    技术奇点的许多论点假设，智能的进步是个相对恒定的乘数，每一代都能比前一代好那么一点点。然而，迄今为止，大多数人工智能带给我们的体验是收益递减的。起初，我们摘的是那些挂在低树枝梢头的果子，进步很快，但很快我们就遇到困难了。人工智能系统或许可以自我改善无数次，但智能的改变程度整体而言却可能是有限制的。举例来说，如果每一代只能提升上一次改善的一半，那么，系统就无法将最初的智能翻倍。[^(\[38\])](#chapter001_0008.xhtml#m38)


    收益递减可能不仅仅来自改善人工智能算法的难度，还来自其主题迅速增加的难度。微软公司的联合创办人保罗·艾伦（Paul Allen）确认了这一现象：


    我们把这个问题叫作“复杂性刹车”（complexity brake）。随着我们对自然系统的理解越来越深入，我们常常发现，需要越来越多的专业知识来归纳其特点，我们被迫不断地以越来越复杂的方式拓展科学理论……我们相信，\[认知\]知识的进步，会因复杂性刹车而从根本上放缓。[^(\[39\])](#chapter001_0008.xhtml#m39)


    哪怕我们真的在人工智能系统身上看到了连续的甚至指数倍的进步，可能仍不足以提高其性能。智能还没提升，有待解决的问题的难度说不定就已经更迅速地提高了。


    ### “智能限度”说


    另一个反对观点是，技术奇点有可能出现根本性限制。有一些限制来自物理学。爱因斯坦告诉我们，你不可能加速超过光速。海森堡教给我们，你无法完全准确地同时知道位置和动量。欧内斯特·卢瑟福（Ernest
    Rutherford）和弗雷德里克·索迪（Frederick Soddy）教导我们，你无法确切地知道原子的放射性衰变何时出现。人类制造的任何思考机器，都将受到这些物理规律的限制。当然，如果这台机器是电子甚或量子的，那么，这些限制可能比我们人类大脑所受的生物和化学限制要大得多。人脑的时钟频率为每秒几十个周期。当今计算机的时钟频率是每秒数十亿个周期，比人脑快几百万倍。人类大脑用庞大的并行性弥补了自身缓慢的时钟频率。即便如此，一台速度缓慢的机器能做这么多，也是很了不起的。很明显，从初始时钟频率方面来看，计算机恐怕有着显著的优势。


    然而，复杂系统里出现了更为经验性的法则。例如，邓巴数（Dunbar’s number）指的是，灵长类动物的大脑尺寸和平均社会群体规模有着相关性。故此，人类的社会群体有着规模限制：100到250人。智能同样是复杂现象，很可能存在这类复杂性带来的限制条件。机器智能的进步（不管是失控还是来得更缓慢），说不定很快就会碰到这种限制。当然，没有理由假设我们人类自己的智能正处于或已经接近这一极限。但同样地，也没有什么理由能说我们自己的智能离此类限制还早得很。


    另一项限制，或许只是因为大自然固有的不确定性。不管你多么努力地思考一个问题，决策质量始终是有限的。预测下一期欧洲乐透彩票，哪怕是超级智能也并不会比我们做得更好。最后，计算已经碰到了一些纯粹物理上的限制。量子世界的不确定性限制了人能把计算机造得多小。2016年3月，英特尔宣布，摩尔定律要结束了，芯片只能再继续缩小5年了。英特尔正将焦点转移到功耗等领域（部分原因是为了满足我们对移动设备的需求）。


    ### “计算复杂性”说


    人类对指数的理解是非常蹩脚的。许多人都会低估复合增长的影响。但出于同样的道理，还有更多人倾向于高估指数增长的力量。有一种观点认为，指数改进足以破解任何问题。这是个误解。


    计算复杂性（Computational complexity）是计算机科学下的分支，它考查的是算法运行得有多快或多慢。有些计算问题很容易，比如，我们可以快速把一张姓名列表按字母顺序排列好，这耗用的时间，只比一个接一个地梳理名单稍长。其他计算问题就有些难度了，例如，我们可以在快于n²但慢于n³的时间里，将两个n×n的数字矩阵乘到一起。这到底是什么意思呢？如果我们要把所乘的矩阵大小翻倍，那么，把它们乘到一起的时间增加4倍以上（也即2²），但少于8倍（也即2³）。


    还有更难解决的计算问题。例如，解决卡车配送问题\[更常见的名字叫“旅行推销员（TSP）问题”\]的已知最优算法，要花掉指数级的时间。每当我们添加一个新的访问目的地，算法的运行时间就增加一个常数因子。这是指数增长的标志。


    对指数增长为什么令人痛苦的经典解释，来自一个古老的印度象棋传说。为了让圣人和自己下象棋，国王允诺说，圣人要什么奖品都可以。圣人在棋盘的第一格里要一粒米，第二格两粒米，第三格4粒米，依此类推。国王显然并不精通指数增长，答应了这个条件。在棋盘的第64格上，国王必须要放上18000000000000000000粒米。这相当于2100亿吨大米，足以覆盖整个印度。


    我们对摩尔定律等指数趋势带来的好处几乎视而不见了。但指数改进无助于解决一些最简单的问题，如计算列表的所有排列。解决这个问题的最优算法，仍然要花掉指数倍的时间才能把题目解出来。[^(\[40\])](#chapter001_0008.xhtml#m40)计算复杂性大概就是前文讨论过的根本性限制之一。除非我们使用远超传统计算模式的计算机，否则，我们很可能会碰到许多计算复杂性从根本上限制了绩效的问题。


    你或许以为，蓬勃发展的量子计算领域能为这一方向带来些指望。量子计算机带来了并行执行多项计算的潜力。在传统计算机里，每个比特代表两种可能的状态——0或1，计算在这种单一状态下进行。而在量子计算机中，每个量子比特（或qbit）是这两种不同状态的叠加，因此，计算可以在指数倍的状态下同时执行。这样一来，较之经典计算机，量子计算机有望实现指数倍的加速。遗憾的是，如前所述，有许多计算问题，哪怕是指数倍的提速也不足以“驯服”它们。因此，量子计算机很有帮助，但本身还不足以让我们达到技术奇点。


    尽管存在上述这些反对技术奇点的观点，但我坚信，总有一天，在某些任务上，我们能制造出有着人类甚至超人智能水平的思考机器。在我看来，没有什么根本上的原因能妨碍我们制造出足以匹敌甚至超过人类智能的机器。不过，我也认为，通往超人智能水平的道路不会太容易。实现了有着人类智能水平的机器，后面的发展可不会像是简单的智能滚雪球。我的同事们肯定会付出更多的心血才能实现这一宏伟目标。


    ## 模拟大脑


    有些人提出了另一条通往思考机器的“简单”路线：效法我们拥有的大好例子，我们可以对人类大脑进行模拟。这种方法同样存在许多挑战。


    首先，这个问题的规模庞大。如我们所见，人类今天构造的神经网络的连接数量，远比大脑要少。但我们还不能在这里停下来，我们恐怕还需要对神经元上的树突、对树突上长出来的树突棘建模，需要模拟大脑的化学和电活动。哪怕只对一个神经元进行如此详细的建模，对如今运转速度最快的计算机来说也是极大的挑战。


    第二，我们可能要复制大脑里大量不同的复杂结构，这将挑战我们对大脑的映射能力。在整个宇宙里，大脑是迄今为止我们已知最复杂的系统，这不会是一件容易的事情。


    第三，就算我们可以成功地模拟大脑，这或许也不过是带来了一个黑盒子。较之我们自己的大脑，它对智能或许提不出来什么更精彩的见解。有了电子和化学物质的模拟流，我们大概也并不能比观察大脑里真实的电子和化学物质流更好地理解智能怎样产生。


    ## 解决智能


    让我们来想想，到了我们能制造出思考机器的那一天，我们无法保证在此过程中能“解决”智能。我说“解决”智能的意思是，我们应该提出一套理论，就像物理学家设计出来为宇宙运动建模的那些理论。通过它们，我们可以预测天空中天体的位置，还可以准确地飞到其他行星去。我们需要一种智能理论，既能解释智能怎样从复杂系统里出现，也能让我们构建新的甚至更为智能的系统。


    抽象可能会是此种理论的重要组成部分。化学对量子物理学所发现的更精确理论做了抽象概括。在为化学反应建模的过程中，我们并未彻底解决薛定谔方程。反过来，生物学又对我们细胞里的化学做了抽象概括。例如，我们的进化理论不仅仅是DNA遗传学和化学的叙述，它们对其他许多因素做了抽象概括，如地理对种群的影响。任何智能理论，很可能极大地依赖类似的抽象归纳。


    在处理更大的复杂性时，其他科学已经退回到更侧重于描述的理论。我们最终可能拥有的是一套描述性而非预测性的智能理论。碰到最糟糕的情况，我们说不定只能提出一种类似经济学那样的主题（在经济学领域，理论甚至不能很好地描述实体经济怎样运行）。同样道理，制造思考机器带来的任何智能理论，可能都无法解释智能。一台能思考的机器，说不定就像其他人的思想那样，是我们不可知的。但愿不会出现这样的情况。


    ## 人类的限制


    我想用个昂扬乐观的音符结束本章，或许，事实将证明，人类所受的限制，或许对机器并不会成为太大的限制。人类要承受一些强有力的生物学限制。我们的大脑尺寸受到母亲产道的严格限制；我们的大脑相当缓慢，时钟频率约为10Hz；它在很小的功率下运作，大概20瓦；尽管如此，它却消耗了我们身体所需能量的1/3。相比之下，计算机能以更高的时钟频率运行，具有更大的存储空间、更多的传感器，功率也更强。


    人类智能还受到进化的限制。我们的智能是演化出来的。大自然只探索了一条达到人类水平智能的路，没有理由假设演化找到了执行智能的最佳途径。特别是，随着人年龄的增长，我们发现，身体的许多部位，其工程设计都很蹩脚。大多数时候，它们只够让我们挨过日子。演进是一种非常缓慢的进步：要用上几十年才能过渡到下一代。相比之下，对计算机来说，我们可以用更快的速度探索更多的设计途径。


    ## 集体学习


    还有最后一个领域我想讨论，在这个领域中，人类比计算机受到更多的限制——这就是学习。我们人类必须为自己学习很多东西。你学会了怎样骑自行车，对我学习骑自行车的帮助有限。相反，机器有着分享学习的独特能力。如果一辆特斯拉汽车学会了怎样识别、避开失控的购物手推车，我们可以把这些新的代码上传给全世界的特斯拉汽车，所有特斯拉汽车就都可以识别并避开失控的购物车了。一辆车学习，每辆车都分享到了绩效的提升。而且，这不仅仅指的是如今全世界的所有特斯拉，还包括未来将要生产出的每辆特斯拉。这是一个重要的概念，我已为它起好了名字：共同学习（colearning）。


    ### 共同学习的定义


    集体性团体的代理人直接为自己学习，或是间接从其他代理处学习。

    '
  trans: '


    我的第二点困惑是，智能指数增长的概念，完全取决于衡量智能所用的尺度。例如，人们常用对数尺度来衡量声音。20 分贝比 10 分贝大 10 倍。30 分贝则是
    10 分贝的 100 倍，数学家称之为“对数空间”。如果我们在类似声音的这种对数空间里测量声音，那么指数增长也就是线性的罢了。这里，我无意就衡量机器智能到底是什么意思展开讨论。我只是假设这样一种情况：如果智能存在一种可以衡量、比较的特性，而技术奇点指的是，按恰当而合理的尺度，该指标呈指数倍增长。


    ## 奇点可能永远不会到来


    技术奇点的概念，更多的是主流人工智能社群之外而非之内的辩论主题。在某种程度上，这可能是因为，许多支持奇点论的人都是领域外人士。技术奇点还跟一些颇具挑战性的设想，如延续生命、超人类主义（transhumanism）等挂上了钩。这挺遗憾的，因为它令辩论脱离了根本性的问题：我们能不能开发出可以反复自我改进的机器，使其智能快速提升并超越人类？


    这似乎不算一个特别疯狂的想法。计算领域从大量的指数发展趋势中获益颇多。自 1965 年以来，摩尔定律基本准确地预测，集成电路上晶体管的数量（即芯片中存储器的数量）每两年翻一倍。20
    世纪 50 年代以来，库梅定律准确地预测，计算机使用每焦耳能量进行的运算数量，每 18 个月翻一倍。正是靠着这些指数发展趋势，计算机开发经历了半个世纪之后，为你带来了智能手机。如果同一时期汽车实现了同等技术进步，那么，它们会缩到蚂蚁那么大，靠一桶汽油能跑上一辈子。那么，基于这些指数趋势，认为人工智能到了某个时候将出现指数增长，又有什么不合理的地方呢？


    不过，针对技术奇点出现的可能性，有人提出了若干有力的反对观点。[^(\[30\])](#chapter001_0008.xhtml#m30)我最好是说得再准确一些：我并不是在预测人工智能永远不能达到或超越人类智能。我的意见是，不会出现有些人所说的那种失控性指数增长。更大的可能是，我们要靠自己给思考机器的大部分智能编程。这将需要大量的科学和工程工作。我们不会在某天早上醒来，发现机器一夜之间就自我改进了，人类不再是地球上最聪明的生物。


    既然讨论的是机器和人类的智能，我们必须要把“智能”到底是什么意思说个明白。我不会正面探讨它，但可以简单地做个假设：智能有一种特性，可以衡量并进行比较。有了这个假设，我就能够讨论反对技术奇点的几个有力观点了。反对技术奇点的观点不止一个。比方说，我们可以把前文讨论过的所有反对人工智能本身的观点继续扩展。例如，机器永远不会思考，因为它们没有意识。机器永远不能思考，因为它们没有创造力。不过，这里，我着重要讨论直接反对智能指数倍失控增长的观点。


    ### “捷思狗”（FAST-THINKING DOG）说


    技术奇点的支持者们都曾提出过一个相同的观点：相较于人类大脑硬件，计算机在速度和存储方面有着重大优势。这些优势每年都呈指数级增长。很遗憾，速度和存储本身并不会提升智能。弗诺·文奇提出过一个观点：一条思考速度更快的狗，恐怕还是不太可能会下象棋。[^(\[31\])](#chapter001_0008.xhtml#m31)史蒂芬·平克雄辩地为此作了阐释：


    没有丝毫的理由相信奇点即将降临。你能运用自己的想象力，生动地构想这样一个未来，并不是它真正可能出现的证据。蒙着圆顶的城市、上下班靠喷气式背包、水下城市、数英里高的建筑、核动力汽车——这些都是我小时候的未来幻想，但它们从未降临。纯粹的处理能力不是一包能神奇地解决所有问题的魔法药粉。[^(\[32\])](#chapter001_0008.xhtml#m32)


    智能不仅仅是对一个问题比别人想得更快、更久，或是罗列更多的事实。诚然，摩尔定律一类的计算发展趋势，肯定有助于对人工智能的追求。我们现在对规模更大的数据集展开学习，我们学习得更快了。但是，至少对人类而言，智能还取决于其他许多事情，包括多年的经验和训练。目前还说不清楚，光靠着提高计时速度、连接更多储存，是否就能在硅片里抄到捷径。


    ### “人类本位”（ANTHROPOCENTRISM）说


    技术奇点的许多描述假设，人类智能是一个可以超越的点，某种“临界点”。例如，尼克·波斯特洛姆写道：“人类水平的人工智能很快会带来超过人类水平的人工智能……机器和人类大致匹敌的时间间隔可能很短暂。过不了多久，人类在智力上就没办法与人工智能相提并论了。”[^(\[33\])](#chapter001_0008.xhtml#m33)


    然而，在从昆虫到老鼠、从狗到猿猴再到人类的这一更宽泛的频谱上，人类智能也只不过是一个点。实际上，说这是概率分布而非单独的一个点更合适。我们每个人都落在这一分布形态的不同点位上。


    假如说科学史能教会我们一件事，那就是：人类并不像我们自己以为的那么特殊。哥白尼告诉我们，宇宙不是围绕地球转动的。达尔文告诉我们，我们只是动物王国里的一员，跟我们的猿猴表亲基本上出自同一世系。而人工智能可能会告诉我们，人类智能本身没有什么特殊的地方，依靠机器，我们可以重现并超越它。因此，没有理由假设跟人类智能相匹敌就是一块特殊的里程碑，一旦超越，智能即可迅速提升。当然，这并不排除如下可能性：智能到了一定的阶段，会出现此类转折点。


    技术奇点的支持者提出一个观点：由于我们具备独特的能力，可制造出放大我们智力能力的人工制品，故此，我们是有待超越的特殊点。我们是地球上唯一具备足够智能来设计新智能的生物，而且，这种新的智能不会受制于繁殖与进化的缓慢过程。然而，这种观点是在循环论证。它假设人类智能足以设计出具备足够智能、实现技术奇点的人工智能。换句话说，它假设我们具备足够的智能来启动技术奇点，也即我们努力想要达到的最终目标。要设计出这样的人工智能，我们可能具备了足够的智能，也可能没有。它没有必然性。就算我们具备了足够的智能来设计超级人工智能，这个超级人工智能说不定也不足以带来技术奇点。


    ### “元智能”（META-INTELLIGENCE）说


    我最喜欢的反对技术奇点概念的一个观点是，它把完成一项任务的智能，跟改进智能完成一项任务的能力搞混淆了。大卫·查尔莫斯（David Chalmers）在详尽分析了技术奇点概念的文章中写道：“如果我们依靠机器学习制造出了人工智能，那么，我们可能很快就能够改进学习算法，拓展学习过程，带来进阶版人工智能。”[^(\[34\])](#chapter001_0008.xhtml#m34)人工智能指的是一套有着人类智能水平的系统，而进阶版人工智能，则是一套比最聪明的人还要聪明的系统。查尔莫斯的逻辑，在“我们可能很快就能够改进学习算法”这句话里出现了信仰飞跃。这里没什么“可能”的，机器学习算法的进步，既不特别迅速，也并不十分容易。日后，如果我们真的制造出了人类智能水平的人工智能系统，机器学习也的确可能是它的重要组成部分，但这只不过是因为手动编码所有必需的知识和专业技术太痛苦了。假设人工智能系统运用机器学习来改进自己在某项需要智能的任务上的绩效，比方说把文本从英语翻译成德语，但这样的系统，不可能改进它自己所用的基本机器学习算法。机器学习算法常常在特定的任务上表现出众，而且，再多的调整似乎也不能再让它们进步了。


    当然，我们目前看到使用深度学习的人工智能取得了令人瞩目的进展，它大大改善了语音识别、计算机视觉、自然语言处理等多个领域的现状，但这些进步并没有从根本上改变机器学习所采用的反向传播算法，而进步主要来自大规模的数据集和更深的神经网络。深度学习三巨头之一的扬·勒丘恩（Yann
    LeCun）[^(\[35\])](#chapter001_0008.xhtml#m35)归结于规模：“以前，神经网络在识别连续语音上无法打破纪录，它们还不够大。”[^(\[36\])](#chapter001_0008.xhtml#m36)


    更多的数据和更大的神经网络意味着我们需要更多的处理能力。因此，为了提供这种处理能力，需要经常使用 GPU。然而，更好地识别语言或识别物体，并没有令深度学习本身获得任何改进。处于深度学习核心的反向传播算法，有了些许调整。但
    20 年来神经网络研究带来的最重大改进是，有了更大的网络、更大的数据集和更强的处理能力。


    我们可以利用目前所知最优秀的智能系统案例之一，从另一个角度来看待这个观点。让我们来看看人类的大脑。对人类而言，学习怎样完成一项具体的任务，远比学习一般性知识更容易。如果我们去掉智商定义[^(\[37\])](#chapter001_0008.xhtml#m37)内置的规范化条件，那么，人类的智商自
    20 世纪以来提高得非常缓慢。而且，如果你想在今天提高自己的智商，就跟一个世纪以前同样的缓慢而痛苦。即便人对大脑怎样学习的知识水平已经提高了，还能运用许多能够帮助学习的新技术，情况也并未有所改变。或许，思考机器要想提升绩效也是同样纠结的，甚至可能永远无法摆脱其根本的局限性，走得很远。


    ### “收益递减”说


    技术奇点的许多论点假设，智能的进步是个相对恒定的乘数，每一代都能比前一代好那么一点点。然而，迄今为止，大多数人工智能带给我们的体验是收益递减的。起初，我们摘的是那些挂在低树枝梢头的果子，进步很快，但很快我们就遇到困难了。人工智能系统或许可以自我改善无数次，但智能的改变程度整体而言却可能是有限制的。举例来说，如果每一代只能提升上一次改善的一半，那么，系统就无法将最初的智能翻倍。[^(\[38\])](#chapter001_0008.xhtml#m38)


    收益递减可能不仅仅来自改善人工智能算法的难度，还来自其主题迅速增加的难度。微软公司的联合创办人保罗·艾伦（Paul Allen）确认了这一现象：


    我们把这个问题叫作“复杂性刹车”（complexity brake）。随着我们对自然系统的理解越来越深入，我们常常发现，需要越来越多的专业知识来归纳其特点，我们被迫不断地以越来越复杂的方式拓展科学理论……我们相信，\[认知\]知识的进步，会因复杂性刹车而从根本上放缓。[^(\[39\])](#chapter001_0008.xhtml#m39)


    哪怕我们真的在人工智能系统身上看到了连续的甚至指数倍的进步，可能仍不足以提高其性能。智能还没提升，有待解决的问题的难度说不定就已经更迅速地提高了。


    ### “智能限度”说


    另一个反对观点是，技术奇点有可能出现根本性限制。有一些限制来自物理学。爱因斯坦告诉我们，你不可能加速超过光速。海森堡教给我们，你无法完全准确地同时知道位置和动量。欧内斯特·卢瑟福（Ernest
    Rutherford）和弗雷德里克·索迪（Frederick Soddy）教导我们，你无法确切地知道原子的放射性衰变何时出现。人类制造的任何思考机器，都将受到这些物理规律的限制。当然，如果这台机器是电子甚或量子的，那么，这些限制可能比我们人类大脑所受的生物和化学限制要大得多。人脑的时钟频率为每秒几十个周期。当今计算机的时钟频率是每秒数十亿个周期，比人脑快几百万倍。人类大脑用庞大的并行性弥补了自身缓慢的时钟频率。即便如此，一台速度缓慢的机器能做这么多，也是很了不起的。很明显，从初始时钟频率方面来看，计算机恐怕有着显著的优势。


    然而，复杂系统里出现了更为经验性的法则。例如，邓巴数（Dunbar’s number）指的是，灵长类动物的大脑尺寸和平均社会群体规模有着相关性。故此，人类的社会群体有着规模限制：100
    到 250 人。智能同样是复杂现象，很可能存在这类复杂性带来的限制条件。机器智能的进步（不管是失控还是来得更缓慢），说不定很快就会碰到这种限制。当然，没有理由假设我们人类自己的智能正处于或已经接近这一极限。但同样地，也没有什么理由能说我们自己的智能离此类限制还早得很。


    另一项限制，或许只是因为大自然固有的不确定性。不管你多么努力地思考一个问题，决策质量始终是有限的。预测下一期欧洲乐透彩票，哪怕是超级智能也并不会比我们做得更好。最后，计算已经碰到了一些纯粹物理上的限制。量子世界的不确定性限制了人能把计算机造得多小。2016
    年 3 月，英特尔宣布，摩尔定律要结束了，芯片只能再继续缩小 5 年了。英特尔正将焦点转移到功耗等领域（部分原因是为了满足我们对移动设备的需求）。


    ### “计算复杂性”说


    人类对指数的理解是非常蹩脚的。许多人都会低估复合增长的影响。但出于同样的道理，还有更多人倾向于高估指数增长的力量。有一种观点认为，指数改进足以破解任何问题。这是个误解。


    计算复杂性（Computational complexity）是计算机科学下的分支，它考查的是算法运行得有多快或多慢。有些计算问题很容易，比如，我们可以快速把一张姓名列表按字母顺序排列好，这耗用的时间，只比一个接一个地梳理名单稍长。其他计算问题就有些难度了，例如，我们可以在快于
    n²但慢于 n³的时间里，将两个 n×n 的数字矩阵乘到一起。这到底是什么意思呢？如果我们要把所乘的矩阵大小翻倍，那么，把它们乘到一起的时间增加 4 倍以上（也即
    2²），但少于 8 倍（也即 2³）。


    还有更难解决的计算问题。例如，解决卡车配送问题\[更常见的名字叫“旅行推销员（TSP）问题”\]的已知最优算法，要花掉指数级的时间。每当我们添加一个新的访问目的地，算法的运行时间就增加一个常数因子。这是指数增长的标志。


    对指数增长为什么令人痛苦的经典解释，来自一个古老的印度象棋传说。为了让圣人和自己下象棋，国王允诺说，圣人要什么奖品都可以。圣人在棋盘的第一格里要一粒米，第二格两粒米，第三格
    4 粒米，依此类推。国王显然并不精通指数增长，答应了这个条件。在棋盘的第 64 格上，国王必须要放上 18000000000000000000 粒米。这相当于
    2100 亿吨大米，足以覆盖整个印度。


    我们对摩尔定律等指数趋势带来的好处几乎视而不见了。但指数改进无助于解决一些最简单的问题，如计算列表的所有排列。解决这个问题的最优算法，仍然要花掉指数倍的时间才能把题目解出来。[^(\[40\])](#chapter001_0008.xhtml#m40)计算复杂性大概就是前文讨论过的根本性限制之一。除非我们使用远超传统计算模式的计算机，否则，我们很可能会碰到许多计算复杂性从根本上限制了绩效的问题。


    你或许以为，蓬勃发展的量子计算领域能为这一方向带来些指望。量子计算机带来了并行执行多项计算的潜力。在传统计算机里，每个比特代表两种可能的状态——0 或 1，计算在这种单一状态下进行。而在量子计算机中，每个量子比特（或
    qbit）是这两种不同状态的叠加，因此，计算可以在指数倍的状态下同时执行。这样一来，较之经典计算机，量子计算机有望实现指数倍的加速。遗憾的是，如前所述，有许多计算问题，哪怕是指数倍的提速也不足以“驯服”它们。因此，量子计算机很有帮助，但本身还不足以让我们达到技术奇点。


    尽管存在上述这些反对技术奇点的观点，但我坚信，总有一天，在某些任务上，我们能制造出有着人类甚至超人智能水平的思考机器。在我看来，没有什么根本上的原因能妨碍我们制造出足以匹敌甚至超过人类智能的机器。不过，我也认为，通往超人智能水平的道路不会太容易。实现了有着人类智能水平的机器，后面的发展可不会像是简单的智能滚雪球。我的同事们肯定会付出更多的心血才能实现这一宏伟目标。


    ## 模拟大脑


    有些人提出了另一条通往思考机器的“简单”路线：效法我们拥有的大好例子，我们可以对人类大脑进行模拟。这种方法同样存在许多挑战。


    首先，这个问题的规模庞大。如我们所见，人类今天构造的神经网络的连接数量，远比大脑要少。但我们还不能在这里停下来，我们恐怕还需要对神经元上的树突、对树突上长出来的树突棘建模，需要模拟大脑的化学和电活动。哪怕只对一个神经元进行如此详细的建模，对如今运转速度最快的计算机来说也是极大的挑战。


    第二，我们可能要复制大脑里大量不同的复杂结构，这将挑战我们对大脑的映射能力。在整个宇宙里，大脑是迄今为止我们已知最复杂的系统，这不会是一件容易的事情。


    第三，就算我们可以成功地模拟大脑，这或许也不过是带来了一个黑盒子。较之我们自己的大脑，它对智能或许提不出来什么更精彩的见解。有了电子和化学物质的模拟流，我们大概也并不能比观察大脑里真实的电子和化学物质流更好地理解智能怎样产生。


    ## 解决智能


    让我们来想想，到了我们能制造出思考机器的那一天，我们无法保证在此过程中能“解决”智能。我说“解决”智能的意思是，我们应该提出一套理论，就像物理学家设计出来为宇宙运动建模的那些理论。通过它们，我们可以预测天空中天体的位置，还可以准确地飞到其他行星去。我们需要一种智能理论，既能解释智能怎样从复杂系统里出现，也能让我们构建新的甚至更为智能的系统。


    抽象可能会是此种理论的重要组成部分。化学对量子物理学所发现的更精确理论做了抽象概括。在为化学反应建模的过程中，我们并未彻底解决薛定谔方程。反过来，生物学又对我们细胞里的化学做了抽象概括。例如，我们的进化理论不仅仅是
    DNA 遗传学和化学的叙述，它们对其他许多因素做了抽象概括，如地理对种群的影响。任何智能理论，很可能极大地依赖类似的抽象归纳。


    在处理更大的复杂性时，其他科学已经退回到更侧重于描述的理论。我们最终可能拥有的是一套描述性而非预测性的智能理论。碰到最糟糕的情况，我们说不定只能提出一种类似经济学那样的主题（在经济学领域，理论甚至不能很好地描述实体经济怎样运行）。同样道理，制造思考机器带来的任何智能理论，可能都无法解释智能。一台能思考的机器，说不定就像其他人的思想那样，是我们不可知的。但愿不会出现这样的情况。


    ## 人类的限制


    我想用个昂扬乐观的音符结束本章，或许，事实将证明，人类所受的限制，或许对机器并不会成为太大的限制。人类要承受一些强有力的生物学限制。我们的大脑尺寸受到母亲产道的严格限制；我们的大脑相当缓慢，时钟频率约为
    10Hz；它在很小的功率下运作，大概 20 瓦；尽管如此，它却消耗了我们身体所需能量的 1/3。相比之下，计算机能以更高的时钟频率运行，具有更大的存储空间、更多的传感器，功率也更强。


    人类智能还受到进化的限制。我们的智能是演化出来的。大自然只探索了一条达到人类水平智能的路，没有理由假设演化找到了执行智能的最佳途径。特别是，随着人年龄的增长，我们发现，身体的许多部位，其工程设计都很蹩脚。大多数时候，它们只够让我们挨过日子。演进是一种非常缓慢的进步：要用上几十年才能过渡到下一代。相比之下，对计算机来说，我们可以用更快的速度探索更多的设计途径。


    ## 集体学习


    还有最后一个领域我想讨论，在这个领域中，人类比计算机受到更多的限制——这就是学习。我们人类必须为自己学习很多东西。你学会了怎样骑自行车，对我学习骑自行车的帮助有限。相反，机器有着分享学习的独特能力。如果一辆特斯拉汽车学会了怎样识别、避开失控的购物手推车，我们可以把这些新的代码上传给全世界的特斯拉汽车，所有特斯拉汽车就都可以识别并避开失控的购物车了。一辆车学习，每辆车都分享到了绩效的提升。而且，这不仅仅指的是如今全世界的所有特斯拉，还包括未来将要生产出的每辆特斯拉。这是一个重要的概念，我已为它起好了名字：共同学习（colearning）。


    ### 共同学习的定义


    集体性团体的代理人直接为自己学习，或是间接从其他代理处学习。


    '
