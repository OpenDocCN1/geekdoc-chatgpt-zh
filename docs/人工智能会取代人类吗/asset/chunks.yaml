    [\[27\]](#chapter001_0005_0001.xhtml#w27) 从技术上来说，图灵的结论证明，存在图灵机无法解决的问题。这并不妨碍其他更丰富的计算模型可用来计算这些问题。然而，即便依靠更丰富的计算模型，如量子计算机，我们仍然会碰到此类不可判定的结果。举个例子，量子计算机可以比传统计算机更快地计算某些问题，但既然经典计算机可以模拟量子计算机，那么，停机问题哪怕用量子计算机也仍然无法判定。


