    公约禁止或限制使用会造成过度伤害、有着滥杀滥伤作用的特定常规武器。公约全名为《禁止或限制使用某些可被认为具有过分伤害力或滥杀滥伤作用的常规武器公约》。目前，该公约涵盖了地雷、饵雷、燃烧武器、激光致盲武器以及战争遗留爆炸物，新武器可通过附加协议的方式加入公约。杀手机器人的禁令，眼下可以指望它。


    对自主武器的讨论而言，激光致盲武器的议定书，往往被认为是最有趣的先例。这是针对一种新型武器的最成功禁令。议定书的各方签字国，没有任何人违反它，各国也从未在武装冲突中使用致盲的激光。这也是少数几次在武器还没投入战场之前就下禁令的例子之一。然而，激光致盲武器和致命性自主武器之间有相当大的差异，削弱了把前者视为良好先例的说服力。致盲激光是一种范围极窄的武器，对军队来说，不如自主武器那么有用，那么富有吸引力。


    尽管如此，2016年12月，联合国《特定常规武器公约》第五次审议大会上，代表们一致同意，对禁令可行性从非正式讨论转入更为正式的下一步：组建政府专家小组。联合国大会将授权该小组审议这一议题，如各国认同，还将提出禁令草案。情况的变数还很大。目前，唯一对自主武器持有重大正式立场的国家是美国。这或许会让许多人感到意外，因为美国是开发此类技术最活跃的国家之一。


    《美国国防部指令3000.09号》规定，自主和半自主武器系统的设计，应允许指挥官和操作人员对“武力的使用进行恰当程度的人为判断”。该指令并未说明“恰当程度”到底是什么意思，此外还有一项附加条款：参谋长联席会议主席或国防部副部长可以批准使用违反该指令的武器系统。


    我参加过多次《特定常规武器公约》会议，在我看来，在这一领域掌握了最先进技术能力的诸多国家（如美国和英国以及澳大利亚等亲密盟友）或许偏向于不要禁令，至少近期是这样。这些国家的许多行动似乎是为了拖延任何实质性的结果，我认为这是短视之举。这些国家的一切技术优势，很可能会迅速消失。2015年7月，我们公布了有关自主武器的公开信之后，我所了解到的每一件事，都使我的信念更为坚定：我们必须赶紧行动。


    对禁令的支持，来自一些出人意料的地方。约翰·卡尔爵士（Sir John Carr）是英国航空航天公司一家重要的军火商，正对下一代自主武器系统进行原型开发。例如，BAE一直在开发可以跨洋自主飞行的“猛禽”无人机。然而，在2016年世界经济论坛上，卡尔主张，完全的自主武器不能遵守战争法，还呼吁各国政府为此类武器划出界限。最接近自主武器的人呼吁设立禁令，我认为我们该听取他们的意见。


    ## 人工智能的失效


    在这个地方思考一下人工智能系统可能会以怎样的形式失效，应该是合适的。它们的失效，有可能跟所有常规程序失效的形式一样，也许是计划不力、说明蹩脚、写得糟糕，或是跟现有系统的整合差。然而，它们也可能以很多新的形式失效。比方说，它们可能会学习不良行为。2016年3月，微软发现了这种情况，他们在Twitter上推出了聊天机器人“泰伊”（Tay）。按照设计，泰伊模仿的是19岁美国姑娘的语言，“她”还会从针对自己的提问中来学习。不到一天，“她”就变成了一个种族主义、厌食、喜欢希特勒的少女。微软立刻把“她”下线了。


    微软犯了两个基本的错误。首先，开发人员应该关闭泰伊的学习功能。如果他们冻结了“她”的个性，“她”就不会从那些逗“她”玩的人那里学到这些糟糕行为了。其次，微软应该对泰伊接受的输入和“她”本身的输出进行脏话过滤。显而易见，用户会提交脏话输入，而微软绝不希望“她”输出脏话。好在这件事让微软只稍微丢了点儿颜面。他们不会是最后一家犯这类错误的公司，将来学到不良行为的人工智能系统，会给人们造成伤害。


    人工智能系统还可能以其他更微妙的方式失效。例如，它们可能会从带有偏差的数据里学习。20世纪90年代，匹兹堡大学医学中心的一支团队利用机器学习来预测哪些肺炎患者可能会出现严重的并发症。研究的目标是为低危患者提供门诊治疗，把医院资源省下来留给高危患者，但结果令人不安。程序想把一些患有哮喘的肺炎患者送回家，哪怕哮喘患者极易出现并发症。数据里确然存在这样的模式。但这样做是因为，在现行医院政策下，患哮喘的肺炎患者会直接送到重症监护室。这一政策运作十分有效，相关患者几乎从未出现严重并发症。


    人工智能系统的另一个问题是它们往往很脆弱。人类执行任务的绩效，大多下降得十分缓慢，人工智能系统不一样，它们失效起来，会兵败如山倒。对象识别就是一个很好的例子。人工智能研究员发现，只要改变几个像素，通常就足以让许多对象识别系统栽跟头。尽管如此，这种脆弱性也可以变成一件好事。2016年，卡内基梅隆大学的研究人员开发了一种可穿戴眼镜，击败了大部分面部识别软件。


    ## 增强智能


    本章的大部分内容，我们一直在讨论机器怎样取代人类。它们注定会在许多工作岗位、许多其他领域（如战场）里取代人类。如果这些活动本身危险或令人不快，我们也许会欢迎“更新换代”。但如果不是这样，上述变化恐怕就不受欢迎了。为了结束本章，我们不妨来考虑人工智能研究的一个目标：实现受人欢迎的改变。


    AI一般是“人工智能”（Artificial Intelligence）的缩写。但如果我们重新引导焦点，也可以说AI代表的是“增强智能”（Augmenting
    Intelligence）。如果我们让人类和机器一起工作，能够比光靠人类或光靠机器做得更好。人类可以发挥自己的优势：创造力、情绪智能、伦理道德和人性。机器也可以拿出自己的优势：逻辑精度高、能够处理庞大数据、不偏不倚、速度快和不知疲倦。别再把机器当作竞争对手了，要把它们看成是盟友。我们双方都能贡献些不同的东西。


    对这种共生的效力，我们已经有一些很好的例子了。人类和象棋程序合作，能比单纯的人、单纯的象棋程序下得更好。数学家和计算机代数程序合作，可以比单纯的人、单纯的程序更快、更好地探索新的数学领域。音乐家和作曲程序合作，也能比两者之一更快地作曲，说不定作出来的曲子也更好。


    ## 社会福祉


    过去几年，人工智能出现了一个下属子领域，专门关注社会福祉问题，对人工智能带来的影响作出回应。和大多数技术一样，人工智能在道德上基本上是中立的，它既可以用来做好事，也能用来做坏事。用它为善还是为恶，我们可以选择。自主无人机识别、跟踪并攻击目标的技术，也可以用到无人驾驶汽车上，识别并跟踪行人，避免发生碰撞。身为科学家，自己的发明被其他人用来做坏事，我们无法阻止，但至少，我们自己可以用它们来做好事。所以，过去10年里，人工智能和机器人研究人员对有益于社会的目标的关注，出现了显著提升。


    我在康奈尔大学的同事卡拉·戈麦斯（Carla Gomes）率先进入了“计算可持续性”领域的发展。“计算可持续性”指的是可持续地将计算工具（其中许多是人工智能技术，比如机器学习和优化等）用于解决问题。例如，人们正使用现成的卫星图像，开发可用于预测、绘制发展中国家贫困情况的机器学习方法。第二个例子，康奈尔大学的eBird项目使用众包方法，记录世界各地鸟类的生存情况。Merlin应用程序，同样开发自康奈尔，只需询问你几个问题，就能识别鸟类。第三个例子，仍然是在康奈尔，研究人员着手开发优化技术，调派纽约市区的公共租用自行车，平衡需求。在计算可持续性方面，人工智能还有其他许多令人兴奋的用途，此处无法一一列举。


    我的另一位同事，加州大学洛杉矶分校的米兰德·坦贝（Milind Tambe）率先发展了人工智能的另一个子领域，意在让世界变得更安全。这是一个名为“安全博弈”的领域。它把来自博弈理论[^(\[14\])](#chapter001_0009.xhtml#m14)、机器学习和优化的概念整合到一起，解决保护港口、机场、其他基础设施，以及野生动物或森林等自然资源的问题。对于所有这些问题，可用的资源有限，不能随时随地提供全面的安全保障。故此，我们必须有效地分配、调派有限资源，同时，考虑到对手的反应，避免太过有规律（使得对方可以预测）。效力意味着我们需要纳入来自优化的设想。和计算机不同，人类的随机性表现超差。因此，要达到不可预知的目的，我们将利用计算机比人类更擅长随机的能力。而要考虑对手的反应，我们会纳入来自博弈理论的观点。


    举个例子，洛杉矶国际机场（LAX）的保安巡逻调遣，就采用了相关工具，优化有限人手，最大化抓捕犯罪分子和恐怖分子的概率。再举一个例子，乌干达伊丽莎白女王国家公园的野生动物巡逻队也使用了类似的工具来调遣，优化有限人手，最大化抓捕偷猎者的概率。最后一个例子，洛杉矶地铁的巡逻队伍仍然采用了类似的设想和计算工具，阻止乘客逃票。在安全博弈这一子领域下，人工智能还有其他许多令人兴奋的用处，我不一一列举了。这里，我只想强调，人工智能是用来做好事还是做坏事，人工智能研究社区作出了回应。


    ## 研究人工智能带来的影响


    针对人工智能影响带来的担忧，另一种更为学术化的反应是，过去5年，专门着眼于相关影响的研究大幅增长。对学术界讲述一个问题，他们会立刻建立起研究中心来深入探索。美国、英国和其他地方的顶尖大学，已经设立了6家此类中心。有好几家已经获得了埃隆·马斯克的1000万美元赠款，启动该领域的研究。


    2014年，马克斯·泰格马克（Max Tegmark）在麻省理工学院创办了“生命未来研究所”，成为引导人们关注各类生存风险（包括人工智能）的重要舆论平台。2015年1月，该研究所在波多黎各主办了一次会议，汇集了来自学术界和产业界的诸多顶尖研究人员，以及经济、法律和伦理道德专家。会议的目标是确定最有潜力的研究方向，最大化人工智能的未来益处。这次会议最显眼的成果之一，是获得了埃隆·马斯克的大手笔捐赠。


    2015年，剑桥的休·普莱斯（Huw Price）拨款1000万英镑成立了未来智能研究中心，其目标是探索人工智能长期及短期带来的机遇与挑战。该中心将汇集计算机科学家、哲学家、社会学家和其他专业人士，研究下个世纪人工智能向人类提出的技术、实践与哲学问题。牛津大学的人工智能战略研究中心（Strategic
    Artificial Intelligence Research Centre）也于2015年成立，旨在为政府、产业及其他部门制定政策，在长期最大限度地减少人工智能带来的风险，最大限度地提升其益处。


    大西洋对面，2016年8月，伯克利大学拨款550万美元成立了人类兼容人工智能中心（Centre for Human-Compatible AI），聚焦于人工智能的安全性，由另一位知名研究人员斯图尔特·罗素领导。两个月后，南加州大学成立了社会人工智能中心，该中心由米兰德·坦贝联合指导，我在前几页提到过他在安全博弈方面的开创性工作。而卡内基梅隆大学则于2016年11月份拨款1000万美元，成立了伦理与计算技术中心。


    最后，我所在的新南威尔士大学，最近成立了人工智能和机器人技术影响中心（CIAIR），该中心有着极强的多学科性质，汇集了来自计算机科学、经济、历史、法律、哲学、社会学等领域的学者，其中心的任务是研究人工智能和机器人长短期的潜在影响。该中心将通过研究、教学、测量和公众辩论等途径，促进有益结果。我们的目标是确保人工智能和机器人安全、成功地为社会造福，为此，我们有意展开多样化的研究、教育、会议、研讨班及其他活动。如果您有兴趣参与，请与我们联系。


    对当今人工智能的发展状况，哪些因素有可能限制它，我的分析就到这里。现在，我们转向未来，以及本书主要基于猜想的部分。这一切会结束在什么地方呢？


