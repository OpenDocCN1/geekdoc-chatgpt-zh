- raw: '实际上，人工智能技术的日益普遍，反而有助于保住电工的饭碗。我们的家庭、工厂和办公室里，将出现越来越多的自动化设备。故此，安装和维护这些设备的电工，会有越来越多的工作可干。这项工作还会变得越来越讲究技能，进一步跟自动化拉开了距离。随着设备变得日益复杂，连接越来越多，电工必须掌握组建网络、无线通信、机器人和其他许多新技术。而随着家庭、工厂和办公室变得愈发自动化，设备出问题的情况也会越来越多。所以，电工（以及其他同类工人，如水暖工）的饭碗可能非常牢靠。


    #### 农民


    牛津报告认为农民被自动化工人所取代的概率仅为4.7%。农业已经亲眼目睹了大量自动化：工业革命之前，英国约有3/4的劳动力从事农业工作，如今仅有1.5%；其他发达国家的比例也大致相似。我们对农作物，对拖拉机及收割机等机械有了更好的认识，意味着我们能用比从前少得多的人手，种植比以前多得多的作物。故此，问题成了：是否还有更多的收益有待发现。


    我猜还有。我们仍然可以用比今天更少的人来耕作，现有机械将进一步自动化。实现拖拉机和联合收割机无人驾驶不是很难。与公路不同，我们可以控制自己的农田，清除人员和其他潜在危险，而且我们可以很方便地对环境进行高精度映射。此外，农业还可以利用自主无人机等其他新技术。


    进一步自动化的好处会很大。自主操控的机械可以全天候运转，它可以比人类更精确地工作。我们不再受到农村劳动力日益萎缩的限制，而且，我们可以减少劳动力成本。特别是在像澳大利亚这样的国家，劳动力成本太高，对农业是有害的。2017年年中，一家不使用任何人力的生菜农场将在日本开张。我预计，在10到20年里，我们会看到更多使用极少人手，甚至完全不需要人的农场。


    #### 警卫


    牛津报告指出，警卫的自动化概率为84%。一如好莱坞的预测，我们用机器人来当警卫是有很大可能性的。实际上，2013年12月以来，山景城的Knightscope公司开始对其K5型警卫机器人进行第二阶段测试。该机器人的设计用意是在学校、校园中心和地方社区巡逻。


    同样值得记住的是，自动化通过怎样的形式把工作改变为不同的形式。中央监控系统已经改变了警卫的工作。现在，一名警卫可以坐在一排监视器前，完成从前需要5名警卫完成的工作。技术要把这种情况再前进一步。计算机视觉系统将监控视频流，要是发生了什么“有意思”的事情，就自动通知警卫。一名警卫可以完成20名警卫的工作，这样的话，其余19名警卫就丢饭碗了。


    #### 理发师


    牛津报告显示，理发师自动化的概率为11%。照我看，0%还差不多。和自行车修理工一样，这是一份低薪工作，几乎没有什么自动化的价值。从技术上讲，自动化这份工作有做得到的可能性，但它不会发生。


    1975年，澳大利亚最大的研究机构——联邦科学与工业研究组织（Commonwealth Scientific and Industrial Research
    Organisation，简称CSIRO）[^(\[7\])](#chapter001_0009.xhtml#m7)着手研究能够剪羊毛的机器人。1979年7月，ORACE机器人缓慢地为第一只羊剪了毛。1993年，高速剪毛业有了可行性。然而，事实证明，将这一技术付诸商业化却大成问题。今天，剪羊毛基本上仍是人工完成的。照我料想，理发机器人要想在商业上得到推广会同样困难。


    #### 口译员


    牛津报告说，口译员的自动化概率是38%。有人认为这个数字太低了。自牛津报告公布以来，机器翻译取得了重大进展。当然，它还有很大的改进余地，尤其是对忠实度有很高要求的领域，如法律和外交方面。目前，机器翻译系统对翻译文本的语义理解极为有限。不过，口译似乎不像是一份人类还能长久干下去的工作。


    跟人类相比，机器口译员有如下几点优势。使用人类口译员，你必然会担心自己所说的事情没法保密。你还必然会担心，人类口译员有自己的喜恶偏向（故此无法做到完全公允地翻译）。而使用计算机口译员，没有其他人知道你所说的内容，计算机是不偏不倚的，因此，可能有许多种情况，你都更偏向使用机器口译员。


    机器翻译可能有助于维持语言的延续性。如今，每个星期都会有一种语言死亡，这很遗憾。到下个世纪，地球上现在使用的近7000种语言，大概有一半会消失，而汉语、英语和西班牙语会越来越流行。机器翻译软件或许能够减缓这一趋势，因为非说主流语言的必要性减少了。和科幻小说《银河系搭车客指南》（*The
    Hitchhiker''s Guide to the Galaxy*）里写的一样，把一条“巴别鱼” 放在耳朵里就行了（译注：巴别鱼，按照小说里的描述，是宇宙中最奇异的生物，体形很小，黄色，外形像水蛭，把它塞进耳朵，你就能立刻理解以任何形式的语言对你说的任何事情）。


    #### 记者


    牛津报告认为，记者的自动化概率是11%。这似乎太低了。记者应该担心自己的工作未来会有多少方面转为自动化。过去10年，美国的记者人数已经下降了约40%。与此同时，Automated
    Insights和Narrative Science等公司设计的软件开始自动撰写文章。2014年，Automated Insights推出了大约10亿篇计算机撰写的文章。这是一项针对记者的图灵测试，看看你能否判断哪些文章出自人类之手，哪些文章出自计算机。


    **是人，还是计算机？**


    弗吉尼亚州夏律第镇，对W.罗伯茨来说，星期二是个好日子。在达文波特球场，这位初级投手投出了一场完美的比赛，让弗吉尼亚队以2比0的成绩，战胜了华盛顿队。


    华盛顿的27名球员走上本垒，弗吉尼亚州的投手把他们全部干掉了，投出了一场完美的比赛。他将10名击球手三振出局，破了自己的纪录。在比赛的最后一局，罗伯茨把瑞恩·托马斯（Ryan
    Thomas）投出了局。


    弗吉尼亚州夏律第镇，星期二晚上，乔治·华盛顿棒球队在达文波特场只差两分就能打平，可惜在本垒上不敌弗吉尼亚队投手强大的表现，以0比2告负。


    GW（7-18）投掉了托米·盖特利，肯尼·奥布莱恩和克雷格·里约恩联手阻挡了弗吉尼亚队，使后者在6轮击球中仅得两分。排名第一的骑士队，全队平均打点达到0.297，每场比赛平均得分在7分以上。


    万一你无法判断，我来告诉你好了：第一篇是计算机写的。在我看来，它写得更好。不过，记者的实地工作（比如采访政治家，站在法院外面，在战区猫着腰躲子弹）还不会很快消失。但是，这份工作的事实性环节，比如根据网络收集的数据撰写体育或评论，则会消失。


    技术变革让新闻行业的经济状况变得天翻地覆。谷歌等公司已经把报纸的广告收入吞噬了一大部分。而现在，报纸本身也正免费赠送大多数的内容。新闻巨头《华盛顿邮报》从技术企业家——亚马逊公司创办人杰夫·贝佐斯（Jeff
    Bezos）那里寻找财务安全性，也就很容易理解了。[^(\[8\])](#chapter001_0009.xhtml#m8)广告少，收费内容也少，给记者工作带来了更大的压力。结局似乎很难避免：记者岗位会更少，智能算法获得更多的机会。


    #### 幼儿园教师


    牛津报告显示，幼儿园教师的自动化水平可能达到15%。有趣的是，报告认为，学前班、小学和中学教师的自动化概率低于1%。没有什么明显的理由足以支撑这些数字存在这么大的差异。恰恰相反，有一种观点认为，幼儿园教师需要更强的社交智力和创造力，甚至远远多于中学教师。因此，幼儿园教师受自动化的影响，可能比中学教师更小而非更多。


    幼儿园、小学和中学教师的概率差异很大，表明我们应该谨慎看待牛津大学研究中给出的这一预测。它采用的机器学习方法有些不稳定。工作所需技能上的小小差异，有可能造成估计概率上出现较大差异，而判断一份工作是否会遭到技术自动化，概率至多能算是个起点。


    即使教师的工作需要大量地面向人，也无法免受自动化的影响。2016年初，美国佐治亚理工学院的吉尔·威尔森（Jill Watson），一门在线硕士课程的助教，和另外8名助教要在网络论坛上回答300名学生提出的10000个问题。然而，她不是“人”，而是一款程序，根据IBM沃森项目提供的问答部件开发。课程里有一名学生对她的身份表示怀疑，但剩下的学生并未察觉她不是人类。这门课程的题目叫作“知识型人工智能”，所以，采用一名人工智能助教也非常合适。


    除了这个例子，人工智能还将以其他方式在教育中发挥至关重要的作用。这当然有可能让一些教师失业，但它带来的积极变化兴许会对我们的社会产生更大的影响。人工智能可以为学生提供更个性化的教育，程序有着无限的耐心帮学生梳理例题；它们可以了解到我们怎样学习，并根据这一认识调整到最适合你的教学方法；它们还能帮助我们学习新技能，跟上技术发展的步伐。


    #### 律师


    牛津报告显示，律师的自动化概率只有3.5%。雷姆斯和利维进行了谨慎详尽的研究，考察了律师进行的不同活动，认为法律工作有13%的部分可以自动化。这是否意味着未来会减少13%的律师呢？我对此表示怀疑。


    这可能是一个自动化将改变工作本身的领域，有待执行的法律工作的数量和已完成工作的质量都有可能提升。判例将得到更详细的搜索，更多的人将因为法律服务变得更廉价而采取法律途径，此类变化可以轻松地消解自动化节省的13%劳动力。


    我们已经能看到未来的一点儿端倪了：所有人都能更便利地获得法律咨询。斯坦福大学英国分校的学生约书亚·布洛德（Joshua Browde）开发的一款聊天机器人律师成功地为伦敦和纽约开出的16万张停车罚单进行了抗辩，而且免费。该程序先提出了一连串简单的问题，以判断怎样上诉。停车标志清楚可见吗？标志是不是隔得太远？附近是否有内容彼此矛盾的标志牌？你的汽车登记证是否准确地在付费电话系统上输入了？接下来，它会指引用户完成上诉流程。在更复杂的法律事务上采取类似自动化流程，也只不过是时间问题。如果我们在这件事上选对了发展方向，未来就不仅仅只有富人能玩转法律了。


    #### 音乐家


    牛津报告认为音乐家的自动化概率只有7.4%。这一预测罔顾事实：机器制作音乐已有上百年历史了。17世纪和18世纪的许多自动装置都有着音乐方面的用途。事实上，1206年，伊斯兰博学家加扎利（Ismail
    al-Jazari）[^(\[9\])](#chapter001_0009.xhtml#m9)写出《妙器知识书》（*Book of Knowledge of
    Ingenious Mechanical Devices*），介绍了一支音乐机器人乐队。乐队有四名机器人乐师（分别是两名鼓手、一名竖琴师和一名笛手），坐在湖里的一艘船上。这一精妙的创作，是用来款待皇家宴饮会上的客人们的，它很可能是采用跟音乐盒类似的鼓面凸点来编程的。想想看，在800多年前，编程机器人看起来多么神奇呀。


    第一台演奏音乐的数字计算机是凯斯拉克，它也是澳大利亚的第一台计算机。那时是1950年或1951年，数据不太确切，因为这台计算机的设计初衷是做些更“有用的”任务，如预测天气等。它比英国人超前了至少几个月，后者的“法朗尼1号”很快也成功地演奏了英国童谣《黑绵羊咩咩叫》（*Baa，Baa，Black
    Sheep*）。


    计算机现在不仅用于播放音乐，还用于创作音乐。2016年，我在巴黎的索尼实验室的同事弗朗西斯·帕切（Francois Pachet）开发了可自动作曲的机器学习程序FlowComposer。FlowComposer按照披头士乐队的风格制作出了一张歌曲专辑。你只需选择风格和曲目长度。当然了，歌词还需要人工填写，但实现自动化大概也只是时间问题了。更有趣的是，FlowComposer还能交互使用，帮助人类作曲家作曲。因此，可以这样说，它增进而非取代了人类的智能。


    尽管取得了上述进步，音乐家应该无须太担心饭碗流失。人类仍然希望听到其他人类的演奏，愿意听那些表达了人之常情的音乐。当然，技术扰乱了音乐行业，音乐数字化了，音乐的制作数字化了，音乐的流通转入了云端。有趣的是，音乐家们的回应是，重新回归演出。如今的乐队靠巡回演出来挣钱，我们回到人的体验上，其他工作也将出现类似趋势。


    #### 新闻播报员


    牛津报告指出，新闻播报员的自动化概率为10%。2014年，日本研究人员推出了两台人形机器人，能够播报新闻，它们至今仍在东京新兴科学与创新国家博物馆展出，播报有关全球问题和空间天气报告的新闻。不过，我们还要再往前走一段路，才能制造出可以采访政治人物、应对突发新闻的机器新闻播报员。与音乐家一样，我猜，虽然我们可以自动发布新闻，但我们还是喜欢让真正的人来播报新闻。然而，为了节约钱，一些新闻公司恐怕还是会用机器人来代替人类播报员。


    #### 口腔外科医生


    牛津报告提到，口腔外科医生将自动化的概率只有0.36%。这无疑是该清单上最牢靠的职业之一。牙医的概率为0.44%，任何时候，机器人都不可能取代他们。制造出能够进行口腔手术或牙科治疗的机器人，会是极大的技术挑战。就算我们能制造出这样的机器人，我怀疑，很多人也不会轻易把自己交到机器人牙医手里。


    #### 政治家


    牛津报告没有考虑政治家。拥有最相近技能的职业大概是神职人员（自动化概率是0.8%）和社会工作者（自动化概率是2.8%）。不过，政客们也别感到自满。[^(\[10\])](#chapter001_0009.xhtml#m10)2016年1月，马萨诸塞大学阿默斯特分校的瓦伦汀·卡萨尼格（Valentin
    Kassarnig）训练了一套机器学习系统，为共和党或民主党派撰写政治演讲稿[^(\[11\])](#chapter001_0009.xhtml#m11)，该系统使用美国国会辩论脚本来训练。距离取代政治代表还有多远，请读者们自己判断吧。


    **一段自动生成的讲演**


    讲演人先生，多年来，诚实但不幸的消费者们有了个案陈情、获得破产保护的能力，合理且有效地免除部分债务。制度应该这样运作，破产法庭评估包括收入、资产和债务等不同因素，判断哪些债务应当偿还，消费者怎样重新靠自己站起来。请支持成长和机会，通过这套立法吧。


    #### 采石场工人


    牛津报告指出，采石场工人的自动化概率可能达到96%，成为本次报告中最缺乏安全度的职业。理应如此。这是一件危险的工作。在澳大利亚，全国每年有数百人在矿山和采石场中丧命。今天，由于自动化程度的提高，丧生的矿工人数减少到了数十人。但即便是数十人，也是个不小的数字，自动化程度进一步提高只会减少事故。机器人非常适合这样的工作，我们可以把人类从矿山或采石场上彻底替换下来，让机器人承担所有风险。


    #### 接待员


    牛津报告说接待员的自动化概率为96%。2016年，长崎主题公园附近有一家酒店开张，员工几乎完全是机器人——接待员、门房和衣帽间服务员都是机器人。基本上，劳动力是经营酒店的最大成本，在美国等经济体中，它要占整体成本的40%至50%左右。自动化的经济优势太大了。


    和银行、超市和机场一样，我们会这样做的：毫无怨言地，我们不再跟人互动，并开始用接待处的屏幕，自助登记、自助结账；酒店客房将采用无锁安保。人类不再必要了，能达到这一目的的技术已经出现了。毫无疑问，高档酒店仍将继续提供贴身服务，聘用大量员工，但是我们许多人会用自己的钱包投票，更偏爱便宜些的无人酒店。


    讽刺的是，清洁工是酒店里最稳妥的工作岗位之一。这份工作太廉价了，不值得费力用机器人来代替。不过，这也构成了一种担忧：在酒店里，只有资质要求最低、薪酬太差的岗位才牢靠。


    #### 软件开发人员


    牛津报告指出，软件开发人员的工作，自动化概率仅为4.2%。在某种程度上，这是因为编写代码是一种创造性活动。你需要有能力想办法把问题拆散成为不同的部分，再把解决各个挑战所用的算法协调起来。编写程序的诸多环节都要求人的技能。例如，界面设计需要清楚地理解人们的想法。


    新的编程语言将继续开发出来，减轻人类编程员的负担。它们能带来更高水平的抽象，减少认知负担。理想情况下，我们希望能够按规范的自然语言来设计代码。“给我一款程序，管理所有人的年假。”“我想要一款能玩《太空侵略者》的程序。”但要实现这一点，自然语言有点太模糊了。


    我不期望计算机太快取代人类程序员。随着世界变得越来越数字化，需要编写的程序越来越多，而自动生成的程序还太小、太简单。计算机程序员可能仍然属于地球上最牢靠的饭碗之一。


    #### 培训师


    牛津报告指出，培训师的自动化概率为0.71%。最优秀的培训师是有着良好社交技能的人，他们理解怎样调动人来激励人达到目标。培训的这种人事方面，让它成了最稳妥的职业之一。此外，如果自动化从整体上能带给我们更多闲暇时间，我们会有更多的时间去健身房，找私人教练。


    不过，技术会威胁到许多私人教练的生计。智能设备不仅仅能监控我们的身体情况，还能给我们提供建议，代替私人教练所做的部分工作。有发展空间的培训师，会是那些专注于工作情感和社交方面的人，他们用机器做不到的方式来激励我们。


    #### 裁判


    牛津报告显示，裁判员的自动化概率为98%。从技术的角度来看，这个数字似乎是正确的。我们会看到更多的自动化设备（例如网球所用的鹰眼）辅助完成裁判的工作，它们做得比人类更准确。不过，我怀疑，未来20到30年里，我们需要的裁判会更多。


    自动化能帮助裁判更好地完成工作。如果我们真的有了更多的休闲时间，对裁判的需求就更大了。事实上，美国劳工部预计，未来10年，裁判的人数将增加5%。最后，我们或许更希望是人而非计算机来决定胜负，哪怕裁判得到了越来越多的技术的辅助。


    #### 兽医


    牛津报告认为，兽医自动化的可能性只有3.8%。这听起来似乎是个好消息。然而，许多国家的兽医学课程是极难入门，也极难完成的。随着人从其他工作岗位上剥离，当兽医可能会变得更加困难。一份工作能免于自动化的另一方面是，该工作的竞争将会增加。经济学家告诉我们，这种效应会拉低工资。所以，就算那些设法保住了工作的人，生活也会变得更艰辛。


    #### 修表匠


    牛津报告认为修表匠工作的自动化概率为99%。和对自行车修理工的预测一样，这完全不靠谱。从技术上说，修表匠的工作似乎太过精细多变了，难于自动化。这再次表明，牛津报告所预测的结果远非完美。


    修理手表是一项小众活动。这项工作是否能够自动化，对自动化给就业岗位带来的整体影响（创造就业岗位或是消除就业岗位）而言无关紧要。一些最常见的工作，比如服务员，可能很安全。但其他许多常见工作，比如卡车司机，显然会受到威胁。


    #### X光技术员


    牛津报告显示，X光技术员的自动化概率为23%。自动化能在照X光片的技术方面出力，让整个过程更迅捷，但怎样对待病人，让他们恢复正常状态，保持情绪稳定，它帮不上什么忙。不管怎么说，自动化能提高X光设备的吞吐量，但这是否等同于减少技术人员，就不太清楚了。有些设备所需的技术员可能会从两名减少为一名，但要我猜，我们不大可能把这个数字变成零。


    #### 动物学家'
  fmt: '

    实际上，人工智能技术的日益普遍，反而有助于保住电工的饭碗。我们的家庭、工厂和办公室里，将出现越来越多的自动化设备。故此，安装和维护这些设备的电工，会有越来越多的工作可干。这项工作还会变得越来越讲究技能，进一步跟自动化拉开了距离。随着设备变得日益复杂，连接越来越多，电工必须掌握组建网络、无线通信、机器人和其他许多新技术。而随着家庭、工厂和办公室变得愈发自动化，设备出问题的情况也会越来越多。所以，电工（以及其他同类工人，如水暖工）的饭碗可能非常牢靠。


    ## 农民


    牛津报告认为农民被自动化工人所取代的概率仅为4.7%。农业已经亲眼目睹了大量自动化：工业革命之前，英国约有3/4的劳动力从事农业工作，如今仅有1.5%；其他发达国家的比例也大致相似。我们对农作物，对拖拉机及收割机等机械有了更好的认识，意味着我们能用比从前少得多的人手，种植比以前多得多的作物。故此，问题成了：是否还有更多的收益有待发现。


    我猜还有。我们仍然可以用比今天更少的人来耕作，现有机械将进一步自动化。实现拖拉机和联合收割机无人驾驶不是很难。与公路不同，我们可以控制自己的农田，清除人员和其他潜在危险，而且我们可以很方便地对环境进行高精度映射。此外，农业还可以利用自主无人机等其他新技术。


    进一步自动化的好处会很大。自主操控的机械可以全天候运转，它可以比人类更精确地工作。我们不再受到农村劳动力日益萎缩的限制，而且，我们可以减少劳动力成本。特别是在像澳大利亚这样的国家，劳动力成本太高，对农业是有害的。2017年年中，一家不使用任何人力的生菜农场将在日本开张。我预计，在10到20年里，我们会看到更多使用极少人手，甚至完全不需要人的农场。


    ## 警卫


    牛津报告指出，警卫的自动化概率为84%。一如好莱坞的预测，我们用机器人来当警卫是有很大可能性的。实际上，2013年12月以来，山景城的Knightscope公司开始对其K5型警卫机器人进行第二阶段测试。该机器人的设计用意是在学校、校园中心和地方社区巡逻。


    同样值得记住的是，自动化通过怎样的形式把工作改变为不同的形式。中央监控系统已经改变了警卫的工作。现在，一名警卫可以坐在一排监视器前，完成从前需要5名警卫完成的工作。技术要把这种情况再前进一步。计算机视觉系统将监控视频流，要是发生了什么“有意思”的事情，就自动通知警卫。一名警卫可以完成20名警卫的工作，这样的话，其余19名警卫就丢饭碗了。


    ## 理发师


    牛津报告显示，理发师自动化的概率为11%。照我看，0%还差不多。和自行车修理工一样，这是一份低薪工作，几乎没有什么自动化的价值。从技术上讲，自动化这份工作有做得到的可能性，但它不会发生。


    1975年，澳大利亚最大的研究机构——联邦科学与工业研究组织（Commonwealth Scientific and Industrial Research
    Organisation，简称CSIRO）[^(\[7\])](#chapter001_0009.xhtml#m7)着手研究能够剪羊毛的机器人。1979年7月，ORACE机器人缓慢地为第一只羊剪了毛。1993年，高速剪毛业有了可行性。然而，事实证明，将这一技术付诸商业化却大成问题。今天，剪羊毛基本上仍是人工完成的。照我料想，理发机器人要想在商业上得到推广会同样困难。


    ## 口译员


    牛津报告说，口译员的自动化概率是38%。有人认为这个数字太低了。自牛津报告公布以来，机器翻译取得了重大进展。当然，它还有很大的改进余地，尤其是对忠实度有很高要求的领域，如法律和外交方面。目前，机器翻译系统对翻译文本的语义理解极为有限。不过，口译似乎不像是一份人类还能长久干下去的工作。


    跟人类相比，机器口译员有如下几点优势。使用人类口译员，你必然会担心自己所说的事情没法保密。你还必然会担心，人类口译员有自己的喜恶偏向（故此无法做到完全公允地翻译）。而使用计算机口译员，没有其他人知道你所说的内容，计算机是不偏不倚的，因此，可能有许多种情况，你都更偏向使用机器口译员。


    机器翻译可能有助于维持语言的延续性。如今，每个星期都会有一种语言死亡，这很遗憾。到下个世纪，地球上现在使用的近7000种语言，大概有一半会消失，而汉语、英语和西班牙语会越来越流行。机器翻译软件或许能够减缓这一趋势，因为非说主流语言的必要性减少了。和科幻小说《银河系搭车客指南》（*The
    Hitchhiker''s Guide to the Galaxy*）里写的一样，把一条“巴别鱼” 放在耳朵里就行了（译注：巴别鱼，按照小说里的描述，是宇宙中最奇异的生物，体形很小，黄色，外形像水蛭，把它塞进耳朵，你就能立刻理解以任何形式的语言对你说的任何事情）。


    ## 记者


    牛津报告认为，记者的自动化概率是11%。这似乎太低了。记者应该担心自己的工作未来会有多少方面转为自动化。过去10年，美国的记者人数已经下降了约40%。与此同时，Automated
    Insights和Narrative Science等公司设计的软件开始自动撰写文章。2014年，Automated Insights推出了大约10亿篇计算机撰写的文章。这是一项针对记者的图灵测试，看看你能否判断哪些文章出自人类之手，哪些文章出自计算机。


    ### 是人，还是计算机？


    弗吉尼亚州夏律第镇，对W.罗伯茨来说，星期二是个好日子。在达文波特球场，这位初级投手投出了一场完美的比赛，让弗吉尼亚队以2比0的成绩，战胜了华盛顿队。


    华盛顿的27名球员走上本垒，弗吉尼亚州的投手把他们全部干掉了，投出了一场完美的比赛。他将10名击球手三振出局，破了自己的纪录。在比赛的最后一局，罗伯茨把瑞恩·托马斯（Ryan
    Thomas）投出了局。


    弗吉尼亚州夏律第镇，星期二晚上，乔治·华盛顿棒球队在达文波特场只差两分就能打平，可惜在本垒上不敌弗吉尼亚队投手强大的表现，以0比2告负。


    GW（7-18）投掉了托米·盖特利，肯尼·奥布莱恩和克雷格·里约恩联手阻挡了弗吉尼亚队，使后者在6轮击球中仅得两分。排名第一的骑士队，全队平均打点达到0.297，每场比赛平均得分在7分以上。


    万一你无法判断，我来告诉你好了：第一篇是计算机写的。在我看来，它写得更好。不过，记者的实地工作（比如采访政治家，站在法院外面，在战区猫着腰躲子弹）还不会很快消失。但是，这份工作的事实性环节，比如根据网络收集的数据撰写体育或评论，则会消失。


    技术变革让新闻行业的经济状况变得天翻地覆。谷歌等公司已经把报纸的广告收入吞噬了一大部分。而现在，报纸本身也正免费赠送大多数的内容。新闻巨头《华盛顿邮报》从技术企业家——亚马逊公司创办人杰夫·贝佐斯（Jeff
    Bezos）那里寻找财务安全性，也就很容易理解了。[^(\[8\])](#chapter001_0009.xhtml#m8)广告少，收费内容也少，给记者工作带来了更大的压力。结局似乎很难避免：记者岗位会更少，智能算法获得更多的机会。


    ## 幼儿园教师


    牛津报告显示，幼儿园教师的自动化水平可能达到15%。有趣的是，报告认为，学前班、小学和中学教师的自动化概率低于1%。没有什么明显的理由足以支撑这些数字存在这么大的差异。恰恰相反，有一种观点认为，幼儿园教师需要更强的社交智力和创造力，甚至远远多于中学教师。因此，幼儿园教师受自动化的影响，可能比中学教师更小而非更多。


    幼儿园、小学和中学教师的概率差异很大，表明我们应该谨慎看待牛津大学研究中给出的这一预测。它采用的机器学习方法有些不稳定。工作所需技能上的小小差异，有可能造成估计概率上出现较大差异，而判断一份工作是否会遭到技术自动化，概率至多能算是个起点。


    即使教师的工作需要大量地面向人，也无法免受自动化的影响。2016年初，美国佐治亚理工学院的吉尔·威尔森（Jill Watson），一门在线硕士课程的助教，和另外8名助教要在网络论坛上回答300名学生提出的10000个问题。然而，她不是“人”，而是一款程序，根据IBM沃森项目提供的问答部件开发。课程里有一名学生对她的身份表示怀疑，但剩下的学生并未察觉她不是人类。这门课程的题目叫作“知识型人工智能”，所以，采用一名人工智能助教也非常合适。


    除了这个例子，人工智能还将以其他方式在教育中发挥至关重要的作用。这当然有可能让一些教师失业，但它带来的积极变化兴许会对我们的社会产生更大的影响。人工智能可以为学生提供更个性化的教育，程序有着无限的耐心帮学生梳理例题；它们可以了解到我们怎样学习，并根据这一认识调整到最适合你的教学方法；它们还能帮助我们学习新技能，跟上技术发展的步伐。


    ## 律师


    牛津报告显示，律师的自动化概率只有3.5%。雷姆斯和利维进行了谨慎详尽的研究，考察了律师进行的不同活动，认为法律工作有13%的部分可以自动化。这是否意味着未来会减少13%的律师呢？我对此表示怀疑。


    这可能是一个自动化将改变工作本身的领域，有待执行的法律工作的数量和已完成工作的质量都有可能提升。判例将得到更详细的搜索，更多的人将因为法律服务变得更廉价而采取法律途径，此类变化可以轻松地消解自动化节省的13%劳动力。


    我们已经能看到未来的一点儿端倪了：所有人都能更便利地获得法律咨询。斯坦福大学英国分校的学生约书亚·布洛德（Joshua Browde）开发的一款聊天机器人律师成功地为伦敦和纽约开出的16万张停车罚单进行了抗辩，而且免费。该程序先提出了一连串简单的问题，以判断怎样上诉。停车标志清楚可见吗？标志是不是隔得太远？附近是否有内容彼此矛盾的标志牌？你的汽车登记证是否准确地在付费电话系统上输入了？接下来，它会指引用户完成上诉流程。在更复杂的法律事务上采取类似自动化流程，也只不过是时间问题。如果我们在这件事上选对了发展方向，未来就不仅仅只有富人能玩转法律了。


    ## 音乐家


    牛津报告认为音乐家的自动化概率只有7.4%。这一预测罔顾事实：机器制作音乐已有上百年历史了。17世纪和18世纪的许多自动装置都有着音乐方面的用途。事实上，1206年，伊斯兰博学家加扎利（Ismail
    al-Jazari）[^(\[9\])](#chapter001_0009.xhtml#m9)写出《妙器知识书》（*Book of Knowledge of
    Ingenious Mechanical Devices*），介绍了一支音乐机器人乐队。乐队有四名机器人乐师（分别是两名鼓手、一名竖琴师和一名笛手），坐在湖里的一艘船上。这一精妙的创作，是用来款待皇家宴饮会上的客人们的，它很可能是采用跟音乐盒类似的鼓面凸点来编程的。想想看，在800多年前，编程机器人看起来多么神奇呀。


    第一台演奏音乐的数字计算机是凯斯拉克，它也是澳大利亚的第一台计算机。那时是1950年或1951年，数据不太确切，因为这台计算机的设计初衷是做些更“有用的”任务，如预测天气等。它比英国人超前了至少几个月，后者的“法朗尼1号”很快也成功地演奏了英国童谣《黑绵羊咩咩叫》（*Baa，Baa，Black
    Sheep*）。


    计算机现在不仅用于播放音乐，还用于创作音乐。2016年，我在巴黎的索尼实验室的同事弗朗西斯·帕切（Francois Pachet）开发了可自动作曲的机器学习程序FlowComposer。FlowComposer按照披头士乐队的风格制作出了一张歌曲专辑。你只需选择风格和曲目长度。当然了，歌词还需要人工填写，但实现自动化大概也只是时间问题了。更有趣的是，FlowComposer还能交互使用，帮助人类作曲家作曲。因此，可以这样说，它增进而非取代了人类的智能。


    尽管取得了上述进步，音乐家应该无须太担心饭碗流失。人类仍然希望听到其他人类的演奏，愿意听那些表达了人之常情的音乐。当然，技术扰乱了音乐行业，音乐数字化了，音乐的制作数字化了，音乐的流通转入了云端。有趣的是，音乐家们的回应是，重新回归演出。如今的乐队靠巡回演出来挣钱，我们回到人的体验上，其他工作也将出现类似趋势。


    ## 新闻播报员


    牛津报告指出，新闻播报员的自动化概率为10%。2014年，日本研究人员推出了两台人形机器人，能够播报新闻，它们至今仍在东京新兴科学与创新国家博物馆展出，播报有关全球问题和空间天气报告的新闻。不过，我们还要再往前走一段路，才能制造出可以采访政治人物、应对突发新闻的机器新闻播报员。与音乐家一样，我猜，虽然我们可以自动发布新闻，但我们还是喜欢让真正的人来播报新闻。然而，为了节约钱，一些新闻公司恐怕还是会用机器人来代替人类播报员。


    ## 口腔外科医生


    牛津报告提到，口腔外科医生将自动化的概率只有0.36%。这无疑是该清单上最牢靠的职业之一。牙医的概率为0.44%，任何时候，机器人都不可能取代他们。制造出能够进行口腔手术或牙科治疗的机器人，会是极大的技术挑战。就算我们能制造出这样的机器人，我怀疑，很多人也不会轻易把自己交到机器人牙医手里。


    ## 政治家


    牛津报告没有考虑政治家。拥有最相近技能的职业大概是神职人员（自动化概率是0.8%）和社会工作者（自动化概率是2.8%）。不过，政客们也别感到自满。[^(\[10\])](#chapter001_0009.xhtml#m10)2016年1月，马萨诸塞大学阿默斯特分校的瓦伦汀·卡萨尼格（Valentin
    Kassarnig）训练了一套机器学习系统，为共和党或民主党派撰写政治演讲稿[^(\[11\])](#chapter001_0009.xhtml#m11)，该系统使用美国国会辩论脚本来训练。距离取代政治代表还有多远，请读者们自己判断吧。


    ### 一段自动生成的讲演


    讲演人先生，多年来，诚实但不幸的消费者们有了个案陈情、获得破产保护的能力，合理且有效地免除部分债务。制度应该这样运作，破产法庭评估包括收入、资产和债务等不同因素，判断哪些债务应当偿还，消费者怎样重新靠自己站起来。请支持成长和机会，通过这套立法吧。


    ## 采石场工人


    牛津报告指出，采石场工人的自动化概率可能达到96%，成为本次报告中最缺乏安全度的职业。理应如此。这是一件危险的工作。在澳大利亚，全国每年有数百人在矿山和采石场中丧命。今天，由于自动化程度的提高，丧生的矿工人数减少到了数十人。但即便是数十人，也是个不小的数字，自动化程度进一步提高只会减少事故。机器人非常适合这样的工作，我们可以把人类从矿山或采石场上彻底替换下来，让机器人承担所有风险。


    ## 接待员


    牛津报告说接待员的自动化概率为96%。2016年，长崎主题公园附近有一家酒店开张，员工几乎完全是机器人——接待员、门房和衣帽间服务员都是机器人。基本上，劳动力是经营酒店的最大成本，在美国等经济体中，它要占整体成本的40%至50%左右。自动化的经济优势太大了。


    和银行、超市和机场一样，我们会这样做的：毫无怨言地，我们不再跟人互动，并开始用接待处的屏幕，自助登记、自助结账；酒店客房将采用无锁安保。人类不再必要了，能达到这一目的的技术已经出现了。毫无疑问，高档酒店仍将继续提供贴身服务，聘用大量员工，但是我们许多人会用自己的钱包投票，更偏爱便宜些的无人酒店。


    讽刺的是，清洁工是酒店里最稳妥的工作岗位之一。这份工作太廉价了，不值得费力用机器人来代替。不过，这也构成了一种担忧：在酒店里，只有资质要求最低、薪酬太差的岗位才牢靠。


    ## 软件开发人员


    牛津报告指出，软件开发人员的工作，自动化概率仅为4.2%。在某种程度上，这是因为编写代码是一种创造性活动。你需要有能力想办法把问题拆散成为不同的部分，再把解决各个挑战所用的算法协调起来。编写程序的诸多环节都要求人的技能。例如，界面设计需要清楚地理解人们的想法。


    新的编程语言将继续开发出来，减轻人类编程员的负担。它们能带来更高水平的抽象，减少认知负担。理想情况下，我们希望能够按规范的自然语言来设计代码。“给我一款程序，管理所有人的年假。”“我想要一款能玩《太空侵略者》的程序。”但要实现这一点，自然语言有点太模糊了。


    我不期望计算机太快取代人类程序员。随着世界变得越来越数字化，需要编写的程序越来越多，而自动生成的程序还太小、太简单。计算机程序员可能仍然属于地球上最牢靠的饭碗之一。


    ## 培训师


    牛津报告指出，培训师的自动化概率为0.71%。最优秀的培训师是有着良好社交技能的人，他们理解怎样调动人来激励人达到目标。培训的这种人事方面，让它成了最稳妥的职业之一。此外，如果自动化从整体上能带给我们更多闲暇时间，我们会有更多的时间去健身房，找私人教练。


    不过，技术会威胁到许多私人教练的生计。智能设备不仅仅能监控我们的身体情况，还能给我们提供建议，代替私人教练所做的部分工作。有发展空间的培训师，会是那些专注于工作情感和社交方面的人，他们用机器做不到的方式来激励我们。


    ## 裁判


    牛津报告显示，裁判员的自动化概率为98%。从技术的角度来看，这个数字似乎是正确的。我们会看到更多的自动化设备（例如网球所用的鹰眼）辅助完成裁判的工作，它们做得比人类更准确。不过，我怀疑，未来20到30年里，我们需要的裁判会更多。


    自动化能帮助裁判更好地完成工作。如果我们真的有了更多的休闲时间，对裁判的需求就更大了。事实上，美国劳工部预计，未来10年，裁判的人数将增加5%。最后，我们或许更希望是人而非计算机来决定胜负，哪怕裁判得到了越来越多的技术的辅助。


    ## 兽医


    牛津报告认为，兽医自动化的可能性只有3.8%。这听起来似乎是个好消息。然而，许多国家的兽医学课程是极难入门，也极难完成的。随着人从其他工作岗位上剥离，当兽医可能会变得更加困难。一份工作能免于自动化的另一方面是，该工作的竞争将会增加。经济学家告诉我们，这种效应会拉低工资。所以，就算那些设法保住了工作的人，生活也会变得更艰辛。


    ## 修表匠


    牛津报告认为修表匠工作的自动化概率为99%。和对自行车修理工的预测一样，这完全不靠谱。从技术上说，修表匠的工作似乎太过精细多变了，难于自动化。这再次表明，牛津报告所预测的结果远非完美。


    修理手表是一项小众活动。这项工作是否能够自动化，对自动化给就业岗位带来的整体影响（创造就业岗位或是消除就业岗位）而言无关紧要。一些最常见的工作，比如服务员，可能很安全。但其他许多常见工作，比如卡车司机，显然会受到威胁。


    ## X光技术员


    牛津报告显示，X光技术员的自动化概率为23%。自动化能在照X光片的技术方面出力，让整个过程更迅捷，但怎样对待病人，让他们恢复正常状态，保持情绪稳定，它帮不上什么忙。不管怎么说，自动化能提高X光设备的吞吐量，但这是否等同于减少技术人员，就不太清楚了。有些设备所需的技术员可能会从两名减少为一名，但要我猜，我们不大可能把这个数字变成零。


    ## 动物学家

    '
  trans: '


    实际上，人工智能技术的日益普遍，反而有助于保住电工的饭碗。我们的家庭、工厂和办公室里，将出现越来越多的自动化设备。故此，安装和维护这些设备的电工，会有越来越多的工作可干。这项工作还会变得越来越讲究技能，进一步跟自动化拉开了距离。随着设备变得日益复杂，连接越来越多，电工必须掌握组建网络、无线通信、机器人和其他许多新技术。而随着家庭、工厂和办公室变得愈发自动化，设备出问题的情况也会越来越多。所以，电工（以及其他同类工人，如水暖工）的饭碗可能非常牢靠。


    ## 农民


    牛津报告认为农民被自动化工人所取代的概率仅为 4.7%。农业已经亲眼目睹了大量自动化：工业革命之前，英国约有 3/4 的劳动力从事农业工作，如今仅有 1.5%；其他发达国家的比例也大致相似。我们对农作物，对拖拉机及收割机等机械有了更好的认识，意味着我们能用比从前少得多的人手，种植比以前多得多的作物。故此，问题成了：是否还有更多的收益有待发现。


    我猜还有。我们仍然可以用比今天更少的人来耕作，现有机械将进一步自动化。实现拖拉机和联合收割机无人驾驶不是很难。与公路不同，我们可以控制自己的农田，清除人员和其他潜在危险，而且我们可以很方便地对环境进行高精度映射。此外，农业还可以利用自主无人机等其他新技术。


    进一步自动化的好处会很大。自主操控的机械可以全天候运转，它可以比人类更精确地工作。我们不再受到农村劳动力日益萎缩的限制，而且，我们可以减少劳动力成本。特别是在像澳大利亚这样的国家，劳动力成本太高，对农业是有害的。2017
    年年中，一家不使用任何人力的生菜农场将在日本开张。我预计，在 10 到 20 年里，我们会看到更多使用极少人手，甚至完全不需要人的农场。


    ## 警卫


    牛津报告指出，警卫的自动化概率为 84%。一如好莱坞的预测，我们用机器人来当警卫是有很大可能性的。实际上，2013 年 12 月以来，山景城的 Knightscope
    公司开始对其 K5 型警卫机器人进行第二阶段测试。该机器人的设计用意是在学校、校园中心和地方社区巡逻。


    同样值得记住的是，自动化通过怎样的形式把工作改变为不同的形式。中央监控系统已经改变了警卫的工作。现在，一名警卫可以坐在一排监视器前，完成从前需要 5 名警卫完成的工作。技术要把这种情况再前进一步。计算机视觉系统将监控视频流，要是发生了什么“有意思”的事情，就自动通知警卫。一名警卫可以完成
    20 名警卫的工作，这样的话，其余 19 名警卫就丢饭碗了。


    ## 理发师


    牛津报告显示，理发师自动化的概率为 11%。照我看，0%还差不多。和自行车修理工一样，这是一份低薪工作，几乎没有什么自动化的价值。从技术上讲，自动化这份工作有做得到的可能性，但它不会发生。


    1975 年，澳大利亚最大的研究机构——联邦科学与工业研究组织（Commonwealth Scientific and Industrial Research
    Organisation，简称 CSIRO）[^(\[7\])](#chapter001_0009.xhtml#m7)着手研究能够剪羊毛的机器人。1979
    年 7 月，ORACE 机器人缓慢地为第一只羊剪了毛。1993 年，高速剪毛业有了可行性。然而，事实证明，将这一技术付诸商业化却大成问题。今天，剪羊毛基本上仍是人工完成的。照我料想，理发机器人要想在商业上得到推广会同样困难。


    ## 口译员


    牛津报告说，口译员的自动化概率是 38%。有人认为这个数字太低了。自牛津报告公布以来，机器翻译取得了重大进展。当然，它还有很大的改进余地，尤其是对忠实度有很高要求的领域，如法律和外交方面。目前，机器翻译系统对翻译文本的语义理解极为有限。不过，口译似乎不像是一份人类还能长久干下去的工作。


    跟人类相比，机器口译员有如下几点优势。使用人类口译员，你必然会担心自己所说的事情没法保密。你还必然会担心，人类口译员有自己的喜恶偏向（故此无法做到完全公允地翻译）。而使用计算机口译员，没有其他人知道你所说的内容，计算机是不偏不倚的，因此，可能有许多种情况，你都更偏向使用机器口译员。


    机器翻译可能有助于维持语言的延续性。如今，每个星期都会有一种语言死亡，这很遗憾。到下个世纪，地球上现在使用的近 7000 种语言，大概有一半会消失，而汉语、英语和西班牙语会越来越流行。机器翻译软件或许能够减缓这一趋势，因为非说主流语言的必要性减少了。和科幻小说《银河系搭车客指南》（*The
    Hitchhiker''s Guide to the Galaxy*）里写的一样，把一条“巴别鱼” 放在耳朵里就行了（译注：巴别鱼，按照小说里的描述，是宇宙中最奇异的生物，体形很小，黄色，外形像水蛭，把它塞进耳朵，你就能立刻理解以任何形式的语言对你说的任何事情）。


    ## 记者


    牛津报告认为，记者的自动化概率是 11%。这似乎太低了。记者应该担心自己的工作未来会有多少方面转为自动化。过去 10 年，美国的记者人数已经下降了约 40%。与此同时，Automated
    Insights 和 Narrative Science 等公司设计的软件开始自动撰写文章。2014 年，Automated Insights 推出了大约
    10 亿篇计算机撰写的文章。这是一项针对记者的图灵测试，看看你能否判断哪些文章出自人类之手，哪些文章出自计算机。


    ### 是人，还是计算机？


    弗吉尼亚州夏律第镇，对 W.罗伯茨来说，星期二是个好日子。在达文波特球场，这位初级投手投出了一场完美的比赛，让弗吉尼亚队以 2 比 0 的成绩，战胜了华盛顿队。


    华盛顿的 27 名球员走上本垒，弗吉尼亚州的投手把他们全部干掉了，投出了一场完美的比赛。他将 10 名击球手三振出局，破了自己的纪录。在比赛的最后一局，罗伯茨把瑞恩·托马斯（Ryan
    Thomas）投出了局。


    弗吉尼亚州夏律第镇，星期二晚上，乔治·华盛顿棒球队在达文波特场只差两分就能打平，可惜在本垒上不敌弗吉尼亚队投手强大的表现，以 0 比 2 告负。


    GW（7-18）投掉了托米·盖特利，肯尼·奥布莱恩和克雷格·里约恩联手阻挡了弗吉尼亚队，使后者在 6 轮击球中仅得两分。排名第一的骑士队，全队平均打点达到
    0.297，每场比赛平均得分在 7 分以上。


    万一你无法判断，我来告诉你好了：第一篇是计算机写的。在我看来，它写得更好。不过，记者的实地工作（比如采访政治家，站在法院外面，在战区猫着腰躲子弹）还不会很快消失。但是，这份工作的事实性环节，比如根据网络收集的数据撰写体育或评论，则会消失。


    技术变革让新闻行业的经济状况变得天翻地覆。谷歌等公司已经把报纸的广告收入吞噬了一大部分。而现在，报纸本身也正免费赠送大多数的内容。新闻巨头《华盛顿邮报》从技术企业家——亚马逊公司创办人杰夫·贝佐斯（Jeff
    Bezos）那里寻找财务安全性，也就很容易理解了。[^(\[8\])](#chapter001_0009.xhtml#m8)广告少，收费内容也少，给记者工作带来了更大的压力。结局似乎很难避免：记者岗位会更少，智能算法获得更多的机会。


    ## 幼儿园教师


    牛津报告显示，幼儿园教师的自动化水平可能达到 15%。有趣的是，报告认为，学前班、小学和中学教师的自动化概率低于 1%。没有什么明显的理由足以支撑这些数字存在这么大的差异。恰恰相反，有一种观点认为，幼儿园教师需要更强的社交智力和创造力，甚至远远多于中学教师。因此，幼儿园教师受自动化的影响，可能比中学教师更小而非更多。


    幼儿园、小学和中学教师的概率差异很大，表明我们应该谨慎看待牛津大学研究中给出的这一预测。它采用的机器学习方法有些不稳定。工作所需技能上的小小差异，有可能造成估计概率上出现较大差异，而判断一份工作是否会遭到技术自动化，概率至多能算是个起点。


    即使教师的工作需要大量地面向人，也无法免受自动化的影响。2016 年初，美国佐治亚理工学院的吉尔·威尔森（Jill Watson），一门在线硕士课程的助教，和另外
    8 名助教要在网络论坛上回答 300 名学生提出的 10000 个问题。然而，她不是“人”，而是一款程序，根据 IBM 沃森项目提供的问答部件开发。课程里有一名学生对她的身份表示怀疑，但剩下的学生并未察觉她不是人类。这门课程的题目叫作“知识型人工智能”，所以，采用一名人工智能助教也非常合适。


    除了这个例子，人工智能还将以其他方式在教育中发挥至关重要的作用。这当然有可能让一些教师失业，但它带来的积极变化兴许会对我们的社会产生更大的影响。人工智能可以为学生提供更个性化的教育，程序有着无限的耐心帮学生梳理例题；它们可以了解到我们怎样学习，并根据这一认识调整到最适合你的教学方法；它们还能帮助我们学习新技能，跟上技术发展的步伐。


    ## 律师


    牛津报告显示，律师的自动化概率只有 3.5%。雷姆斯和利维进行了谨慎详尽的研究，考察了律师进行的不同活动，认为法律工作有 13%的部分可以自动化。这是否意味着未来会减少
    13%的律师呢？我对此表示怀疑。


    这可能是一个自动化将改变工作本身的领域，有待执行的法律工作的数量和已完成工作的质量都有可能提升。判例将得到更详细的搜索，更多的人将因为法律服务变得更廉价而采取法律途径，此类变化可以轻松地消解自动化节省的
    13%劳动力。


    我们已经能看到未来的一点儿端倪了：所有人都能更便利地获得法律咨询。斯坦福大学英国分校的学生约书亚·布洛德（Joshua Browde）开发的一款聊天机器人律师成功地为伦敦和纽约开出的
    16 万张停车罚单进行了抗辩，而且免费。该程序先提出了一连串简单的问题，以判断怎样上诉。停车标志清楚可见吗？标志是不是隔得太远？附近是否有内容彼此矛盾的标志牌？你的汽车登记证是否准确地在付费电话系统上输入了？接下来，它会指引用户完成上诉流程。在更复杂的法律事务上采取类似自动化流程，也只不过是时间问题。如果我们在这件事上选对了发展方向，未来就不仅仅只有富人能玩转法律了。


    ## 音乐家


    牛津报告认为音乐家的自动化概率只有 7.4%。这一预测罔顾事实：机器制作音乐已有上百年历史了。17 世纪和 18 世纪的许多自动装置都有着音乐方面的用途。事实上，1206
    年，伊斯兰博学家加扎利（Ismail al-Jazari）[^(\[9\])](#chapter001_0009.xhtml#m9)写出《妙器知识书》（*Book
    of Knowledge of Ingenious Mechanical Devices*），介绍了一支音乐机器人乐队。乐队有四名机器人乐师（分别是两名鼓手、一名竖琴师和一名笛手），坐在湖里的一艘船上。这一精妙的创作，是用来款待皇家宴饮会上的客人们的，它很可能是采用跟音乐盒类似的鼓面凸点来编程的。想想看，在
    800 多年前，编程机器人看起来多么神奇呀。


    第一台演奏音乐的数字计算机是凯斯拉克，它也是澳大利亚的第一台计算机。那时是 1950 年或 1951 年，数据不太确切，因为这台计算机的设计初衷是做些更“有用的”任务，如预测天气等。它比英国人超前了至少几个月，后者的“法朗尼
    1 号”很快也成功地演奏了英国童谣《黑绵羊咩咩叫》（*Baa，Baa，Black Sheep*）。


    计算机现在不仅用于播放音乐，还用于创作音乐。2016 年，我在巴黎的索尼实验室的同事弗朗西斯·帕切（Francois Pachet）开发了可自动作曲的机器学习程序
    FlowComposer。FlowComposer 按照披头士乐队的风格制作出了一张歌曲专辑。你只需选择风格和曲目长度。当然了，歌词还需要人工填写，但实现自动化大概也只是时间问题了。更有趣的是，FlowComposer
    还能交互使用，帮助人类作曲家作曲。因此，可以这样说，它增进而非取代了人类的智能。


    尽管取得了上述进步，音乐家应该无须太担心饭碗流失。人类仍然希望听到其他人类的演奏，愿意听那些表达了人之常情的音乐。当然，技术扰乱了音乐行业，音乐数字化了，音乐的制作数字化了，音乐的流通转入了云端。有趣的是，音乐家们的回应是，重新回归演出。如今的乐队靠巡回演出来挣钱，我们回到人的体验上，其他工作也将出现类似趋势。


    ## 新闻播报员


    牛津报告指出，新闻播报员的自动化概率为 10%。2014 年，日本研究人员推出了两台人形机器人，能够播报新闻，它们至今仍在东京新兴科学与创新国家博物馆展出，播报有关全球问题和空间天气报告的新闻。不过，我们还要再往前走一段路，才能制造出可以采访政治人物、应对突发新闻的机器新闻播报员。与音乐家一样，我猜，虽然我们可以自动发布新闻，但我们还是喜欢让真正的人来播报新闻。然而，为了节约钱，一些新闻公司恐怕还是会用机器人来代替人类播报员。


    ## 口腔外科医生


    牛津报告提到，口腔外科医生将自动化的概率只有 0.36%。这无疑是该清单上最牢靠的职业之一。牙医的概率为 0.44%，任何时候，机器人都不可能取代他们。制造出能够进行口腔手术或牙科治疗的机器人，会是极大的技术挑战。就算我们能制造出这样的机器人，我怀疑，很多人也不会轻易把自己交到机器人牙医手里。


    ## 政治家


    牛津报告没有考虑政治家。拥有最相近技能的职业大概是神职人员（自动化概率是 0.8%）和社会工作者（自动化概率是 2.8%）。不过，政客们也别感到自满。[^(\[10\])](#chapter001_0009.xhtml#m10)2016
    年 1 月，马萨诸塞大学阿默斯特分校的瓦伦汀·卡萨尼格（Valentin Kassarnig）训练了一套机器学习系统，为共和党或民主党派撰写政治演讲稿[^(\[11\])](#chapter001_0009.xhtml#m11)，该系统使用美国国会辩论脚本来训练。距离取代政治代表还有多远，请读者们自己判断吧。


    ### 一段自动生成的讲演


    讲演人先生，多年来，诚实但不幸的消费者们有了个案陈情、获得破产保护的能力，合理且有效地免除部分债务。制度应该这样运作，破产法庭评估包括收入、资产和债务等不同因素，判断哪些债务应当偿还，消费者怎样重新靠自己站起来。请支持成长和机会，通过这套立法吧。


    ## 采石场工人


    牛津报告指出，采石场工人的自动化概率可能达到 96%，成为本次报告中最缺乏安全度的职业。理应如此。这是一件危险的工作。在澳大利亚，全国每年有数百人在矿山和采石场中丧命。今天，由于自动化程度的提高，丧生的矿工人数减少到了数十人。但即便是数十人，也是个不小的数字，自动化程度进一步提高只会减少事故。机器人非常适合这样的工作，我们可以把人类从矿山或采石场上彻底替换下来，让机器人承担所有风险。


    ## 接待员


    牛津报告说接待员的自动化概率为 96%。2016 年，长崎主题公园附近有一家酒店开张，员工几乎完全是机器人——接待员、门房和衣帽间服务员都是机器人。基本上，劳动力是经营酒店的最大成本，在美国等经济体中，它要占整体成本的
    40%至 50%左右。自动化的经济优势太大了。


    和银行、超市和机场一样，我们会这样做的：毫无怨言地，我们不再跟人互动，并开始用接待处的屏幕，自助登记、自助结账；酒店客房将采用无锁安保。人类不再必要了，能达到这一目的的技术已经出现了。毫无疑问，高档酒店仍将继续提供贴身服务，聘用大量员工，但是我们许多人会用自己的钱包投票，更偏爱便宜些的无人酒店。


    讽刺的是，清洁工是酒店里最稳妥的工作岗位之一。这份工作太廉价了，不值得费力用机器人来代替。不过，这也构成了一种担忧：在酒店里，只有资质要求最低、薪酬太差的岗位才牢靠。


    ## 软件开发人员


    牛津报告指出，软件开发人员的工作，自动化概率仅为 4.2%。在某种程度上，这是因为编写代码是一种创造性活动。你需要有能力想办法把问题拆散成为不同的部分，再把解决各个挑战所用的算法协调起来。编写程序的诸多环节都要求人的技能。例如，界面设计需要清楚地理解人们的想法。


    新的编程语言将继续开发出来，减轻人类编程员的负担。它们能带来更高水平的抽象，减少认知负担。理想情况下，我们希望能够按规范的自然语言来设计代码。“给我一款程序，管理所有人的年假。”“我想要一款能玩《太空侵略者》的程序。”但要实现这一点，自然语言有点太模糊了。


    我不期望计算机太快取代人类程序员。随着世界变得越来越数字化，需要编写的程序越来越多，而自动生成的程序还太小、太简单。计算机程序员可能仍然属于地球上最牢靠的饭碗之一。


    ## 培训师


    牛津报告指出，培训师的自动化概率为 0.71%。最优秀的培训师是有着良好社交技能的人，他们理解怎样调动人来激励人达到目标。培训的这种人事方面，让它成了最稳妥的职业之一。此外，如果自动化从整体上能带给我们更多闲暇时间，我们会有更多的时间去健身房，找私人教练。


    不过，技术会威胁到许多私人教练的生计。智能设备不仅仅能监控我们的身体情况，还能给我们提供建议，代替私人教练所做的部分工作。有发展空间的培训师，会是那些专注于工作情感和社交方面的人，他们用机器做不到的方式来激励我们。


    ## 裁判


    牛津报告显示，裁判员的自动化概率为 98%。从技术的角度来看，这个数字似乎是正确的。我们会看到更多的自动化设备（例如网球所用的鹰眼）辅助完成裁判的工作，它们做得比人类更准确。不过，我怀疑，未来
    20 到 30 年里，我们需要的裁判会更多。


    自动化能帮助裁判更好地完成工作。如果我们真的有了更多的休闲时间，对裁判的需求就更大了。事实上，美国劳工部预计，未来 10 年，裁判的人数将增加 5%。最后，我们或许更希望是人而非计算机来决定胜负，哪怕裁判得到了越来越多的技术的辅助。


    ## 兽医


    牛津报告认为，兽医自动化的可能性只有 3.8%。这听起来似乎是个好消息。然而，许多国家的兽医学课程是极难入门，也极难完成的。随着人从其他工作岗位上剥离，当兽医可能会变得更加困难。一份工作能免于自动化的另一方面是，该工作的竞争将会增加。经济学家告诉我们，这种效应会拉低工资。所以，就算那些设法保住了工作的人，生活也会变得更艰辛。


    ## 修表匠


    牛津报告认为修表匠工作的自动化概率为 99%。和对自行车修理工的预测一样，这完全不靠谱。从技术上说，修表匠的工作似乎太过精细多变了，难于自动化。这再次表明，牛津报告所预测的结果远非完美。


    修理手表是一项小众活动。这项工作是否能够自动化，对自动化给就业岗位带来的整体影响（创造就业岗位或是消除就业岗位）而言无关紧要。一些最常见的工作，比如服务员，可能很安全。但其他许多常见工作，比如卡车司机，显然会受到威胁。


    ## X 光技术员


    牛津报告显示，X 光技术员的自动化概率为 23%。自动化能在照 X 光片的技术方面出力，让整个过程更迅捷，但怎样对待病人，让他们恢复正常状态，保持情绪稳定，它帮不上什么忙。不管怎么说，自动化能提高
    X 光设备的吞吐量，但这是否等同于减少技术人员，就不太清楚了。有些设备所需的技术员可能会从两名减少为一名，但要我猜，我们不大可能把这个数字变成零。


    ## 动物学家


