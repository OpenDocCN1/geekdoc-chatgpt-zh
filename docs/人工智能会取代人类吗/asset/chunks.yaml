    神奇的是，去世前两年，布尔遇到了我们故事里的下一位演员，查尔斯·巴贝奇（Charles Babbage）[\[14\]](#chapter001_0005_0001.xhtml#m14)。这次相遇发生在伦敦博览会，人们认为两名伟大的创新家当时谈起了巴贝奇的“思考引擎”。要不是布尔不久以后就去世了，他们一起构思的东西该叫人多么憧憬呀。查尔斯·巴贝奇是多面手：他是数学家、哲学家、发明家兼工程师。他梦想着制造出机械式计算机。尽管他从未成功，但许多人都认为他是可编程计算机之父。他设计的“分析引擎”使用打孔卡片来编程。


    计算机按程序进行操作，而且这一程序可改变——这一设想是计算机能力的根本。你的智能手机安装新的应用程序，史蒂夫·乔布斯或其他任何智能手机制造商想都没想到的程序。这样一来，它就可以一次性地做很多事情了：计算器、笔记本、健康监控仪、导航仪、相机、电影播放器，甚至手机（有时你简直会忘了它还能打电话）。这就是图灵在提出通用计算模型时所探讨的设想。计算机是一种通用机器，可以编程执行许多不同的事情。更微妙的是，计算机程序自己可以修改。这种能力是人工智能之梦的基础。学习似乎是我们智力的关键组成部分。如果计算机要模拟学习，它必须拥有某种修改自己程序的方式。幸运的是，编写一套能够自行修改的计算机程序是相对容易的。程序只是数据，而且可以进行操作：想想你的电子表格里的数字，你的文字处理软件里的字母，或是你的数字图片里的颜色。故此，计算机可以学习做新的任务，那就是，改变它们的程序，去做它们初始程序里没想过要执行的任务。


    ## 第一位程序员


    与巴贝奇一起合作的是洛夫莱斯伯爵夫人奥古斯塔·埃达·金（Augusta Ada King）[\[15\]](#chapter001_0005_0001.xhtml#m15)。她写了一整套笔记，针对范围更大的受众介绍并解释巴贝奇的“分析引擎”。在这些笔记中，她写出了基本上得到公认的第一套计算机程序。巴贝奇把焦点放在引擎执行数值计算、编制天文及其他表格的能力上。而洛夫莱斯却梦想计算机除了处理数字，还可以做更多事情。她写道，巴贝奇的发明“或许还可以执行数字之外的其他事情……引擎说不定能作出复杂而科学的乐曲”。


    这个设想超前了一个世纪。洛夫莱斯伯爵夫人的概念性飞跃，可以从我们今天的智能手机上看出，除了数字，手机能操作声音、图像、视频，做其他各种各样的事情。然而，她也是人工智能的第一批评论家之一，对制造思考机器的梦想不屑一顾。她写道：“分析引擎没有创作任何东西的主张。它可以做任何我们吩咐它执行的事情。它可以遵循分析，但它没有力量去预见任何分析关系或真相。”


    这个想法（即如果计算机没有创造力，那它们就不是智能）存在很多争议。图灵在《心智》上发表的论文里作过讨论。我稍后会回到这一争论上，但在此之前，我想对洛夫莱斯的反对意见作一番审视。第一个想到计算机编程的人（一个提前一个多世纪梦想计算机不仅仅能处理数字的人），对制造思考机器的这一最终梦想持有怀疑态度。这可不是个简单的梦想。这个梦想，涉及我们在宇宙中位置的核心。我们有什么特别的地方吗？还是说，我们也是机器，就跟我们的计算机一样？这些问题的答案将最终改变我们对自己的看法。它甚至有可能改变我们的一些核心观念，一如哥白尼地球绕着太阳转的主张，或是达尔文“人是猿猴的后裔”的概念。


    18世纪，一个不太知名的人物来到了我们的故事当中，他叫威廉·斯坦利·杰文斯（William Stanley Jevons）[\[16\]](#chapter001_0005_0001.xhtml#m16)。他为数学和经济学做出了许多贡献。但我们要说的是他1870年发明的“逻辑钢琴”，这是一台机械式计算器，可以用来求解多达4个真/伪决定（用布尔逻辑的语言来说，也即4个可以取值0或1的变量）的逻辑题。杰文斯设计这台钢琴是为了帮助进行逻辑教学。逻辑钢琴的原作仍存在牛津历史博物馆展出。逻辑钢琴对布尔逻辑的一小部分做了简洁的机械化表达。它的发明者写道：“很明显，这一机制能够代替执行逻辑推演时所需的大部分思考行动。”[\[17\]](#chapter001_0005_0001.xhtml#m17)


    据说，杰文斯制造了一台非常原始的思考机器，但我猜，1870年那些看到过逻辑钢琴在皇家学会上展出的观众，不管多么杰出，恐怕都未预料到它将给我们的生活带来多么巨大的改变。至少，这是通往制造计算机（最终执行人工智能）之路上的第一批实验性步骤之一。遗憾的是，和这个故事里如今出场的几位人物一样，杰文斯去世太早了[\[18\]](#chapter001_0005_0001.xhtml#m18)；《泰晤士报》上刊登的他的讣告里，没有提及逻辑钢琴。


    ## 逻辑革命


    现在，我们的故事向前推进到了20世纪初。这是一个在科学、艺术和政治等诸多领域都爆发革命的时期。阿尔伯特·爱因斯坦（Albert Einstein）、尼尔斯·玻尔（Niels
    Bohr）、沃纳·海森堡（Werner Heisenberg）等人通过相对论和量子力学的革命思想撼动了物理学的基础；反古典的印象派和达达主义等运动撼动了绘画的基础；同一时间，构成数学和逻辑基础的部分基石，也遭到了猛烈的撼动。


    大卫·希尔伯特（David Hilbert）[\[19\]](#chapter001_0005_0001.xhtml#m19)是这个时代最伟大的数学家之一。1900年，他确认了数学面临的23个最具挑战性的问题。在介绍这些问题的过程中，他写道：


    我们中有谁不乐意去掀开未来藏身其后的面纱呢？有谁不乐意一窥科学即将出现的发展，以及未来几个世纪里科学发展的秘密呢？未来几代数学家的精神，会走向什么样的终点？在数学思想这一广大而丰富的领域，新世纪里会出现什么新方法，有哪些新方面？


    这近乎诗意的视野，对本书做了很好的介绍。希尔伯特提出的23个问题里，有几个涉及数学本身的基础。当时，数学的基石似乎摇摆不定。就说数学上很简单的集合吧。集合指的是某类对象的总体，比如黑色汽车集合、银色汽车集合、黑色或银色汽车集合、既非黑色也非银色汽车集合、任何并非银色汽车物体的集合。1874年，德国数学家格奥尔格·康托尔（Georg
    Cantor）[\[20\]](#chapter001_0005_0001.xhtml#m20)写下了集合的正规数学表达。对一个数学家来说，这似乎是个奇怪的项目。数学是关于数字和函数等对象的。对集合这样简单的东西，我们为什么要感兴趣呢？然而，集合可以表示许多不同的数学对象：数字、函数、图形，以及数学家研究的许多怪异对象，比如流形、环形和向量空间。[\[21\]](#chapter001_0005_0001.xhtml#m21)


    当时的另一位伟大数学家伯特兰·罗素（Bertrand Russell）[\[22\]](#chapter001_0005_0001.xhtml#m22)证明，康托尔试图将集合数学形式化的尝试，注定会落入循环悖论。还是以所有银色汽车集合为例。它不包含自身。我们称这是一个正常集合。反过来说，我们看看补充集合。该集合包含了所有不是银色汽车的东西。它的确包含了自身。让我们称之为异常集合。好，现在再来看所有正常集合的集合。所有正常集合的集合，它自身是否正常？如果它是正常的，它将包含在所有正常集合的集合当中。也就是说，它将包含自身。但这样它就又成了异常。我们再来看看另一种情况。假设所有正常集合的集合本身是异常的。由于它是异常的，它就包含自身（也即所有正常集合的集合）。但这就又让它成了正常集合。这是罗素著名的悖论：集合不能同时既正常又异常。接下来，我们的故事里还会出现其他类似的循环悖论。康托尔的集合论充满了这样的悖论，一些批评家把他叫成“科学骗子”和“年轻人的腐蚀剂”。不过，我们故事里的下一位演员会证明，这不是康托尔的错。从根本上说，数学就是这样的。这对制造思考机器（至少对使用逻辑来推理的思考机器而言）构成了一个根本性的挑战。


    为回应数学中心的这场危机，希尔伯特拟订了一套工作计划，试图把数学放到精确的、合乎逻辑的基础之上。希尔伯特计划（Hilbert’s program，日后人们就这么称呼它）想要寻找包含了若干基本事实或基本构建的一个小集合，数学的所有内容都建立在它之上。希尔伯特计划还希望找到证据，表明这种数学形式不包含康托尔集合理论里的那些悖论。一旦有了悖论，任何事都可以证明成立了。要想制造思考机器，制造能做包括数学在内各种事情的机器，我们需要这类基本构建。


    ## 数学的终结


    1931年，历史上最重要的一位逻辑学家库尔特·哥德尔（Kurt Gödel）[\[23\]](#chapter001_0005_0001.xhtml#m23)把希尔伯特计划彻底摧毁了。他通过两条著名的不完全定理破坏了希尔伯特计划。这两条定理证明，任何内容丰富到足以描述整数这一类简单概念的形式化数学，必然不完全，要么就包含悖论。故此，任何没有悖论的数学系统，都包含着无法证明的数学真理。这是哥德尔不完全定理中的“不完全性”。


    哥德尔的结论搞砸了希尔伯特计划，并为数学留下了永远有点摇晃的基础，让数学本身完全数学的目标不可能实现，这向构建思考机器的梦想提出了深刻的哲学挑战。如果我们要思考机器，又如果这些机器必须像莱布尼茨和霍布斯认为的那样必须进行数学推理，那么，我们就需要为它们提供精确的、逻辑形式化的数学，方便它们进行推理。但是，哥德尔不完全定理证明，我们不能为数学写出精确规则（即可以写给计算机，让它们能够进行所有数学运算的规则）。


    数学物理学家罗杰·彭罗斯爵士（Sir Roger Penrose）[\[24\]](#chapter001_0005_0001.xhtml#m24)大力倡导这类观点，并用它们反驳人工智能有一天能超过人类智慧的观点。[\[25\]](#chapter001_0005_0001.xhtml#m25)不过，针对彭罗斯的意见，也有很多反对的声音。计算机不需要具备证明一切数学的能力（就跟人类一样）。计算机可以在包含了悖论的系统中运作（就跟人类一样）。哥德尔定理要求我们思考无限的系统，但所有的人类和计算机都是有限的。再加上，很快计算机就会使用不同的计算模型（如量子计算机）来制造，这些模型超出了哥德尔结论的范畴。人工智能领域的共识仍然是：从理论上说，哥德尔定理并没有阻挡制造思考机器之梦的去路。在实践中，我先前也讨论过，我们继续朝着这个梦想取得不错的进展。


    ## 无法计算的事物


    这几乎让我们画了一个圆，回到了本书开篇就提到的数学家艾伦·图灵身上。不管是在实践还是理论上，他都在开发计算机过程中扮演着关键角色。他提供了基本的抽象模型“图灵机”，至今仍用来在数学上描述计算机。但1936年，在我们尚未真正把这些机器制造出来之前，图灵就提出了另一个意义深远的见解。他发现有一些问题，是此类机器永远不可能计算的。当时，还没有任何人为计算机编写过程序，也没有可供编程的计算机。然而，图灵却高屋建瓴地预见到一些哪怕日后再聪明的程序员也无法让计算机解决的问题。


    其一是“停机问题”。你能否写出一套计算机程序，让它判断另一套程序该不该终止？这会是一个很有用的程序。你肯定不希望自己飞行器的控制系统中途停机。同样道理，你肯定想要自己电视机顶盒上扫描新频道的程序能够中途停止。图灵证明，有些问题（如停机问题）是无法写出计算机程序来的。[\[26\]](#chapter001_0005_0001.xhtml#m26)请记住，程序本身就是数据。故此，它可以把数据输入另一套程序。我们可以编写一套以另一套程序为输入的程序，判断给定输入程序该不该终止。图灵的非凡成就在于，他证明，不管你是个多么聪明的程序员，都写不出来这样的程序。


    图灵使用了循环论证，跟罗素“集合不包含自身”悖论类似。假设我们确实拥有一套可以解决停机问题的程序。假设它叫“图灵程序”。现在，我们把它作为另一套更大程序的子程序，对后者，我们称之为“图灵超级程序”。图灵超级程序可把其他任何程序作为输入，并以图灵程序作为子程序，判断输入程序是否应该终止。如果输入程序终止，那么图灵超级程序就会进入永不终止的无限循环。反过来说，如果输入程序不终止，则图灵超级程序就会终止。这就是图灵循环论证切入的地方。如果把图灵超级程序自己作为输入，它会怎么做？对这一输入，图灵超级程序要么能终止，要么不能终止，只有这两个结果可选。


    让我们考虑两种可能性。假设图灵超级程序无法终止这一输入。此时，图灵超级程序被输入了一套需要终止的程序，它却无法终止。那么，这意味着图灵超级程序终止了。故此，如果图灵超级程序不终止，就意味着它自身终止。让我们再来看看另一种可能性。假设图灵超级程序终止了这一输入。此时，图灵超级程序被输入了一套不终止的程序，它将其终止了。这意味着图灵超级程序不终止。不管怎么想，我们都碰到了矛盾。图灵超级程序不能既终止又不终止。再回想我之前提出的关键假设：图灵程序存在。这个假设带来了矛盾，故此显然有误。于是，我们可以得出结论：图灵程序不可能存在。我们不能设计一套程序来判断给定输入程序是否终止。依靠这一论点，图灵指出：有些问题，是计算机无法解决的。


    存在无法计算的问题，似乎对开发思考机器之梦提出了另一个根本性的挑战。我们有一个不可辩驳的证据，表明有些事情计算机做不到。[\[27\]](#chapter001_0005_0001.xhtml#m27)现在，你或许会想，是不是只有模糊问题（如判定程序是否终止这一类）不能计算呢？其实，还有很多十分有用的问题无法计算，比如判定数学语句是否为真。[\[28\]](#chapter001_0005_0001.xhtml#m28)


    存在无法计算的问题，并不会搞砸开发思考机器之梦，原因有好几个。首先，我们仍然可以让计算机来解决此类问题，尽管有些不够完善。你说不定购买过Mathematica或Maple这类判定数学语句是否为真的软件，它们有时候会说：“我不知道。”其次，另一种替代办法是，你仍然可以拥有解决此类问题的计算机程序，但它或许有些许不精确。有时候，软件会出错：它说输入程序不终止，但其实输入程序已经终止了（或是反过来）。第三，很多人工智能靠的是启发式的经验原则，大多数时候管用，但有时候会失败，甚至让自己陷入无限循环。第四，智能本身也并不意味着100%正确。我们人类也并不是随时都100%正确。我们不需要制造一台随时都能解决图灵停机问题的机器。故此，哪怕我们知道存在计算机无法准确计算的问题，制造思考机器之梦也能延续下去。


    ## 计算机问世


    直到目前，开发思考机器的梦想，基本上还仅局限于理论上。哪怕图灵已经确认了计算机无法计算的问题，我们实际上都还没有能够计算的计算机。这种局面要等到第二次世界大战才会改变。解码敌方情报、执行复杂计算以制造原子弹的需求，向前推动了计算的实践方面，并带来了第一批真正可用的计算机。


    全世界第一台计算机到底是哪一台，各方说法纷纭。第二次世界大战期间的保密原则，以及机器的不同性能，把这潭水给搅浑了。德国的Z3，1941年开始运转；英国的巨人，1944年运转；美国的埃尼亚克，1946年运转；英国的曼彻斯特宝贝，虽然1948年才制造出来，但却是同期计算机里第一台开始存储程序的。[\[29\]](#chapter001_0005_0001.xhtml#m29)但谁是第一台计算机，跟我们的故事没有太大关系。重要的是，它们的速度和内存不断提高，而大小和价格却飞速下降。于是，全世界的计算机数量迅速增加。如今，全世界运转着数十亿台电脑。据说IBM的托马斯·沃森（Thomas
    Watson）曾认为，全世界只要6台计算机就够了，现实显然毫不留情地证明他错了。[\[30\]](#chapter001_0005_0001.xhtml#m30)更有可能的是，全世界每个人都至少拥有6台计算机才够。


    ## 达特茅斯及其他


    随着世界从第二次世界大战中逐渐恢复，计算机越来越普遍，我们拥有了着手制造思考机器的所有部件。我们只需要有个东西来启动它。这便是达特茅斯夏季研讨会（Dartmouth
    Summer Research Project）。1956年，该研讨会在新罕布什尔州常春藤联盟大学达特茅斯举行。组织者是约翰·麦卡锡，他与图灵并列为人工智能领域的奠基者之一。当时，麦卡锡正在达特茅斯大学任教，不过，他后来搬到了斯坦福大学，帮忙设立如今已经非常出名的人工智能实验室。麦卡锡和马文·明斯基、纳撒尼尔·罗切斯特、克劳德·香农联手撰写了一份提案，说服洛克菲勒基金会资助为期两个月的达特茅斯头脑风暴会议。明斯基是神经网络的先驱，后来在麻省理工学院建立了一所杰出的人工智能实验室。罗切斯特来自IBM，是IBM大批量制造第一台大型电子计算机701的联合设计师。香农在贝尔实验室工作，已经因为开发了信息统计理论（这是通信网络的根本），并将数学逻辑应用到计算机设计构建上而出名。出席达特茅斯会议的人还有伦敦百货公司创始人之孙，日后成为GTE实验室首席科学家的奥利弗·赛弗里奇（Oliver
    Selfridge）；日后将赢得诺贝尔经济学奖的赫伯特·西蒙（Herbert Simon）[\[31\]](#chapter001_0005_0001.xhtml#m31)；日后在卡内基梅隆大学建立了著名人工智能实验室的艾伦·纽厄尔（Allen
    Newell）。


    达特茅斯夏季研究项目对制造思考机器的进度极为乐观。该项目的筹资倡议开篇就这样写道：


    1956年夏天，我们10个人提议，一起在新罕布什尔州汉诺威的达特茅斯学院进行为期两个月的人工智能研究。这项研究基于如下猜想：学习的每个方面，或智力的其他任何特征，原则上都可精确地加以描述，以便制造机器来模拟。我们将努力探讨，怎样让机器使用语言构成抽象和概念，解决如今只有人类能解决的各种问题，并自我改进。我们认为，一群精心挑选出来的科学家夏天聚在一起携手合作，便可以在上述问题的一个或多个上取得可观进展。


    虽然有些过分自信，但该提案对梦想做了清晰的阐述：精确地描述学习和人类智能的其他方面，好让计算机能够模拟。简而言之，他们想让莱布尼茨的梦想变成现实：把思考转化为计算。遗憾的是，我们马上就会看到，这种乐观态度很快便会在该领域弥漫开来。


    ## 大西洋对岸


    别以为我们的故事仅仅在美国往前推进。英国同样是计算的发祥地之一，在人工智能早年岁月里也扮演了关键角色。事实上，全世界为研究思考而专门建立的最资深的科学会社，就是英国人工智能和行为模拟研究协会（Society
    for the Study of Artificial Intelligence and the Simulation of Behaviour）。它成立于1964年，延续至今。

    '
  trans: '


    神奇的是，去世前两年，布尔遇到了我们故事里的下一位演员，查尔斯·巴贝奇（Charles Babbage）[\[14\]](#chapter001_0005_0001.xhtml#m14)。这次相遇发生在伦敦博览会，人们认为两名伟大的创新家当时谈起了巴贝奇的“思考引擎”。要不是布尔不久以后就去世了，他们一起构思的东西该叫人多么憧憬呀。查尔斯·巴贝奇是多面手：他是数学家、哲学家、发明家兼工程师。他梦想着制造出机械式计算机。尽管他从未成功，但许多人都认为他是可编程计算机之父。他设计的“分析引擎”使用打孔卡片来编程。


    计算机按程序进行操作，而且这一程序可改变——这一设想是计算机能力的根本。你的智能手机安装新的应用程序，史蒂夫·乔布斯或其他任何智能手机制造商想都没想到的程序。这样一来，它就可以一次性地做很多事情了：计算器、笔记本、健康监控仪、导航仪、相机、电影播放器，甚至手机（有时你简直会忘了它还能打电话）。这就是图灵在提出通用计算模型时所探讨的设想。计算机是一种通用机器，可以编程执行许多不同的事情。更微妙的是，计算机程序自己可以修改。这种能力是人工智能之梦的基础。学习似乎是我们智力的关键组成部分。如果计算机要模拟学习，它必须拥有某种修改自己程序的方式。幸运的是，编写一套能够自行修改的计算机程序是相对容易的。程序只是数据，而且可以进行操作：想想你的电子表格里的数字，你的文字处理软件里的字母，或是你的数字图片里的颜色。故此，计算机可以学习做新的任务，那就是，改变它们的程序，去做它们初始程序里没想过要执行的任务。


    ## 第一位程序员


    与巴贝奇一起合作的是洛夫莱斯伯爵夫人奥古斯塔·埃达·金（Augusta Ada King）[\[15\]](#chapter001_0005_0001.xhtml#m15)。她写了一整套笔记，针对范围更大的受众介绍并解释巴贝奇的“分析引擎”。在这些笔记中，她写出了基本上得到公认的第一套计算机程序。巴贝奇把焦点放在引擎执行数值计算、编制天文及其他表格的能力上。而洛夫莱斯却梦想计算机除了处理数字，还可以做更多事情。她写道，巴贝奇的发明“或许还可以执行数字之外的其他事情……引擎说不定能作出复杂而科学的乐曲”。


    这个设想超前了一个世纪。洛夫莱斯伯爵夫人的概念性飞跃，可以从我们今天的智能手机上看出，除了数字，手机能操作声音、图像、视频，做其他各种各样的事情。然而，她也是人工智能的第一批评论家之一，对制造思考机器的梦想不屑一顾。她写道：“分析引擎没有创作任何东西的主张。它可以做任何我们吩咐它执行的事情。它可以遵循分析，但它没有力量去预见任何分析关系或真相。”


    这个想法（即如果计算机没有创造力，那它们就不是智能）存在很多争议。图灵在《心智》上发表的论文里作过讨论。我稍后会回到这一争论上，但在此之前，我想对洛夫莱斯的反对意见作一番审视。第一个想到计算机编程的人（一个提前一个多世纪梦想计算机不仅仅能处理数字的人），对制造思考机器的这一最终梦想持有怀疑态度。这可不是个简单的梦想。这个梦想，涉及我们在宇宙中位置的核心。我们有什么特别的地方吗？还是说，我们也是机器，就跟我们的计算机一样？这些问题的答案将最终改变我们对自己的看法。它甚至有可能改变我们的一些核心观念，一如哥白尼地球绕着太阳转的主张，或是达尔文“人是猿猴的后裔”的概念。


    18 世纪，一个不太知名的人物来到了我们的故事当中，他叫威廉·斯坦利·杰文斯（William Stanley Jevons）[\[16\]](#chapter001_0005_0001.xhtml#m16)。他为数学和经济学做出了许多贡献。但我们要说的是他
    1870 年发明的“逻辑钢琴”，这是一台机械式计算器，可以用来求解多达 4 个真/伪决定（用布尔逻辑的语言来说，也即 4 个可以取值 0 或 1 的变量）的逻辑题。杰文斯设计这台钢琴是为了帮助进行逻辑教学。逻辑钢琴的原作仍存在牛津历史博物馆展出。逻辑钢琴对布尔逻辑的一小部分做了简洁的机械化表达。它的发明者写道：“很明显，这一机制能够代替执行逻辑推演时所需的大部分思考行动。”[\[17\]](#chapter001_0005_0001.xhtml#m17)


    据说，杰文斯制造了一台非常原始的思考机器，但我猜，1870 年那些看到过逻辑钢琴在皇家学会上展出的观众，不管多么杰出，恐怕都未预料到它将给我们的生活带来多么巨大的改变。至少，这是通往制造计算机（最终执行人工智能）之路上的第一批实验性步骤之一。遗憾的是，和这个故事里如今出场的几位人物一样，杰文斯去世太早了[\[18\]](#chapter001_0005_0001.xhtml#m18)；《泰晤士报》上刊登的他的讣告里，没有提及逻辑钢琴。


    ## 逻辑革命


    现在，我们的故事向前推进到了 20 世纪初。这是一个在科学、艺术和政治等诸多领域都爆发革命的时期。阿尔伯特·爱因斯坦（Albert Einstein）、尼尔斯·玻尔（Niels
    Bohr）、沃纳·海森堡（Werner Heisenberg）等人通过相对论和量子力学的革命思想撼动了物理学的基础；反古典的印象派和达达主义等运动撼动了绘画的基础；同一时间，构成数学和逻辑基础的部分基石，也遭到了猛烈的撼动。


    大卫·希尔伯特（David Hilbert）[\[19\]](#chapter001_0005_0001.xhtml#m19)是这个时代最伟大的数学家之一。1900
    年，他确认了数学面临的 23 个最具挑战性的问题。在介绍这些问题的过程中，他写道：


    我们中有谁不乐意去掀开未来藏身其后的面纱呢？有谁不乐意一窥科学即将出现的发展，以及未来几个世纪里科学发展的秘密呢？未来几代数学家的精神，会走向什么样的终点？在数学思想这一广大而丰富的领域，新世纪里会出现什么新方法，有哪些新方面？


    这近乎诗意的视野，对本书做了很好的介绍。希尔伯特提出的 23 个问题里，有几个涉及数学本身的基础。当时，数学的基石似乎摇摆不定。就说数学上很简单的集合吧。集合指的是某类对象的总体，比如黑色汽车集合、银色汽车集合、黑色或银色汽车集合、既非黑色也非银色汽车集合、任何并非银色汽车物体的集合。1874
    年，德国数学家格奥尔格·康托尔（Georg Cantor）[\[20\]](#chapter001_0005_0001.xhtml#m20)写下了集合的正规数学表达。对一个数学家来说，这似乎是个奇怪的项目。数学是关于数字和函数等对象的。对集合这样简单的东西，我们为什么要感兴趣呢？然而，集合可以表示许多不同的数学对象：数字、函数、图形，以及数学家研究的许多怪异对象，比如流形、环形和向量空间。[\[21\]](#chapter001_0005_0001.xhtml#m21)


    当时的另一位伟大数学家伯特兰·罗素（Bertrand Russell）[\[22\]](#chapter001_0005_0001.xhtml#m22)证明，康托尔试图将集合数学形式化的尝试，注定会落入循环悖论。还是以所有银色汽车集合为例。它不包含自身。我们称这是一个正常集合。反过来说，我们看看补充集合。该集合包含了所有不是银色汽车的东西。它的确包含了自身。让我们称之为异常集合。好，现在再来看所有正常集合的集合。所有正常集合的集合，它自身是否正常？如果它是正常的，它将包含在所有正常集合的集合当中。也就是说，它将包含自身。但这样它就又成了异常。我们再来看看另一种情况。假设所有正常集合的集合本身是异常的。由于它是异常的，它就包含自身（也即所有正常集合的集合）。但这就又让它成了正常集合。这是罗素著名的悖论：集合不能同时既正常又异常。接下来，我们的故事里还会出现其他类似的循环悖论。康托尔的集合论充满了这样的悖论，一些批评家把他叫成“科学骗子”和“年轻人的腐蚀剂”。不过，我们故事里的下一位演员会证明，这不是康托尔的错。从根本上说，数学就是这样的。这对制造思考机器（至少对使用逻辑来推理的思考机器而言）构成了一个根本性的挑战。


    为回应数学中心的这场危机，希尔伯特拟订了一套工作计划，试图把数学放到精确的、合乎逻辑的基础之上。希尔伯特计划（Hilbert’s program，日后人们就这么称呼它）想要寻找包含了若干基本事实或基本构建的一个小集合，数学的所有内容都建立在它之上。希尔伯特计划还希望找到证据，表明这种数学形式不包含康托尔集合理论里的那些悖论。一旦有了悖论，任何事都可以证明成立了。要想制造思考机器，制造能做包括数学在内各种事情的机器，我们需要这类基本构建。


    ## 数学的终结


    1931 年，历史上最重要的一位逻辑学家库尔特·哥德尔（Kurt Gödel）[\[23\]](#chapter001_0005_0001.xhtml#m23)把希尔伯特计划彻底摧毁了。他通过两条著名的不完全定理破坏了希尔伯特计划。这两条定理证明，任何内容丰富到足以描述整数这一类简单概念的形式化数学，必然不完全，要么就包含悖论。故此，任何没有悖论的数学系统，都包含着无法证明的数学真理。这是哥德尔不完全定理中的“不完全性”。


    哥德尔的结论搞砸了希尔伯特计划，并为数学留下了永远有点摇晃的基础，让数学本身完全数学的目标不可能实现，这向构建思考机器的梦想提出了深刻的哲学挑战。如果我们要思考机器，又如果这些机器必须像莱布尼茨和霍布斯认为的那样必须进行数学推理，那么，我们就需要为它们提供精确的、逻辑形式化的数学，方便它们进行推理。但是，哥德尔不完全定理证明，我们不能为数学写出精确规则（即可以写给计算机，让它们能够进行所有数学运算的规则）。


    数学物理学家罗杰·彭罗斯爵士（Sir Roger Penrose）[\[24\]](#chapter001_0005_0001.xhtml#m24)大力倡导这类观点，并用它们反驳人工智能有一天能超过人类智慧的观点。[\[25\]](#chapter001_0005_0001.xhtml#m25)不过，针对彭罗斯的意见，也有很多反对的声音。计算机不需要具备证明一切数学的能力（就跟人类一样）。计算机可以在包含了悖论的系统中运作（就跟人类一样）。哥德尔定理要求我们思考无限的系统，但所有的人类和计算机都是有限的。再加上，很快计算机就会使用不同的计算模型（如量子计算机）来制造，这些模型超出了哥德尔结论的范畴。人工智能领域的共识仍然是：从理论上说，哥德尔定理并没有阻挡制造思考机器之梦的去路。在实践中，我先前也讨论过，我们继续朝着这个梦想取得不错的进展。


    ## 无法计算的事物


    这几乎让我们画了一个圆，回到了本书开篇就提到的数学家艾伦·图灵身上。不管是在实践还是理论上，他都在开发计算机过程中扮演着关键角色。他提供了基本的抽象模型“图灵机”，至今仍用来在数学上描述计算机。但
    1936 年，在我们尚未真正把这些机器制造出来之前，图灵就提出了另一个意义深远的见解。他发现有一些问题，是此类机器永远不可能计算的。当时，还没有任何人为计算机编写过程序，也没有可供编程的计算机。然而，图灵却高屋建瓴地预见到一些哪怕日后再聪明的程序员也无法让计算机解决的问题。


    其一是“停机问题”。你能否写出一套计算机程序，让它判断另一套程序该不该终止？这会是一个很有用的程序。你肯定不希望自己飞行器的控制系统中途停机。同样道理，你肯定想要自己电视机顶盒上扫描新频道的程序能够中途停止。图灵证明，有些问题（如停机问题）是无法写出计算机程序来的。[\[26\]](#chapter001_0005_0001.xhtml#m26)请记住，程序本身就是数据。故此，它可以把数据输入另一套程序。我们可以编写一套以另一套程序为输入的程序，判断给定输入程序该不该终止。图灵的非凡成就在于，他证明，不管你是个多么聪明的程序员，都写不出来这样的程序。


    图灵使用了循环论证，跟罗素“集合不包含自身”悖论类似。假设我们确实拥有一套可以解决停机问题的程序。假设它叫“图灵程序”。现在，我们把它作为另一套更大程序的子程序，对后者，我们称之为“图灵超级程序”。图灵超级程序可把其他任何程序作为输入，并以图灵程序作为子程序，判断输入程序是否应该终止。如果输入程序终止，那么图灵超级程序就会进入永不终止的无限循环。反过来说，如果输入程序不终止，则图灵超级程序就会终止。这就是图灵循环论证切入的地方。如果把图灵超级程序自己作为输入，它会怎么做？对这一输入，图灵超级程序要么能终止，要么不能终止，只有这两个结果可选。


    让我们考虑两种可能性。假设图灵超级程序无法终止这一输入。此时，图灵超级程序被输入了一套需要终止的程序，它却无法终止。那么，这意味着图灵超级程序终止了。故此，如果图灵超级程序不终止，就意味着它自身终止。让我们再来看看另一种可能性。假设图灵超级程序终止了这一输入。此时，图灵超级程序被输入了一套不终止的程序，它将其终止了。这意味着图灵超级程序不终止。不管怎么想，我们都碰到了矛盾。图灵超级程序不能既终止又不终止。再回想我之前提出的关键假设：图灵程序存在。这个假设带来了矛盾，故此显然有误。于是，我们可以得出结论：图灵程序不可能存在。我们不能设计一套程序来判断给定输入程序是否终止。依靠这一论点，图灵指出：有些问题，是计算机无法解决的。


    存在无法计算的问题，似乎对开发思考机器之梦提出了另一个根本性的挑战。我们有一个不可辩驳的证据，表明有些事情计算机做不到。[\[27\]](#chapter001_0005_0001.xhtml#m27)现在，你或许会想，是不是只有模糊问题（如判定程序是否终止这一类）不能计算呢？其实，还有很多十分有用的问题无法计算，比如判定数学语句是否为真。[\[28\]](#chapter001_0005_0001.xhtml#m28)


    存在无法计算的问题，并不会搞砸开发思考机器之梦，原因有好几个。首先，我们仍然可以让计算机来解决此类问题，尽管有些不够完善。你说不定购买过 Mathematica
    或 Maple 这类判定数学语句是否为真的软件，它们有时候会说：“我不知道。”其次，另一种替代办法是，你仍然可以拥有解决此类问题的计算机程序，但它或许有些许不精确。有时候，软件会出错：它说输入程序不终止，但其实输入程序已经终止了（或是反过来）。第三，很多人工智能靠的是启发式的经验原则，大多数时候管用，但有时候会失败，甚至让自己陷入无限循环。第四，智能本身也并不意味着
    100%正确。我们人类也并不是随时都 100%正确。我们不需要制造一台随时都能解决图灵停机问题的机器。故此，哪怕我们知道存在计算机无法准确计算的问题，制造思考机器之梦也能延续下去。


    ## 计算机问世


    直到目前，开发思考机器的梦想，基本上还仅局限于理论上。哪怕图灵已经确认了计算机无法计算的问题，我们实际上都还没有能够计算的计算机。这种局面要等到第二次世界大战才会改变。解码敌方情报、执行复杂计算以制造原子弹的需求，向前推动了计算的实践方面，并带来了第一批真正可用的计算机。


    全世界第一台计算机到底是哪一台，各方说法纷纭。第二次世界大战期间的保密原则，以及机器的不同性能，把这潭水给搅浑了。德国的 Z3，1941 年开始运转；英国的巨人，1944
    年运转；美国的埃尼亚克，1946 年运转；英国的曼彻斯特宝贝，虽然 1948 年才制造出来，但却是同期计算机里第一台开始存储程序的。[\[29\]](#chapter001_0005_0001.xhtml#m29)但谁是第一台计算机，跟我们的故事没有太大关系。重要的是，它们的速度和内存不断提高，而大小和价格却飞速下降。于是，全世界的计算机数量迅速增加。如今，全世界运转着数十亿台电脑。据说
    IBM 的托马斯·沃森（Thomas Watson）曾认为，全世界只要 6 台计算机就够了，现实显然毫不留情地证明他错了。[\[30\]](#chapter001_0005_0001.xhtml#m30)更有可能的是，全世界每个人都至少拥有
    6 台计算机才够。


    ## 达特茅斯及其他


    随着世界从第二次世界大战中逐渐恢复，计算机越来越普遍，我们拥有了着手制造思考机器的所有部件。我们只需要有个东西来启动它。这便是达特茅斯夏季研讨会（Dartmouth
    Summer Research Project）。1956 年，该研讨会在新罕布什尔州常春藤联盟大学达特茅斯举行。组织者是约翰·麦卡锡，他与图灵并列为人工智能领域的奠基者之一。当时，麦卡锡正在达特茅斯大学任教，不过，他后来搬到了斯坦福大学，帮忙设立如今已经非常出名的人工智能实验室。麦卡锡和马文·明斯基、纳撒尼尔·罗切斯特、克劳德·香农联手撰写了一份提案，说服洛克菲勒基金会资助为期两个月的达特茅斯头脑风暴会议。明斯基是神经网络的先驱，后来在麻省理工学院建立了一所杰出的人工智能实验室。罗切斯特来自
    IBM，是 IBM 大批量制造第一台大型电子计算机 701 的联合设计师。香农在贝尔实验室工作，已经因为开发了信息统计理论（这是通信网络的根本），并将数学逻辑应用到计算机设计构建上而出名。出席达特茅斯会议的人还有伦敦百货公司创始人之孙，日后成为
    GTE 实验室首席科学家的奥利弗·赛弗里奇（Oliver Selfridge）；日后将赢得诺贝尔经济学奖的赫伯特·西蒙（Herbert Simon）[\[31\]](#chapter001_0005_0001.xhtml#m31)；日后在卡内基梅隆大学建立了著名人工智能实验室的艾伦·纽厄尔（Allen
    Newell）。


    达特茅斯夏季研究项目对制造思考机器的进度极为乐观。该项目的筹资倡议开篇就这样写道：


    1956 年夏天，我们 10 个人提议，一起在新罕布什尔州汉诺威的达特茅斯学院进行为期两个月的人工智能研究。这项研究基于如下猜想：学习的每个方面，或智力的其他任何特征，原则上都可精确地加以描述，以便制造机器来模拟。我们将努力探讨，怎样让机器使用语言构成抽象和概念，解决如今只有人类能解决的各种问题，并自我改进。我们认为，一群精心挑选出来的科学家夏天聚在一起携手合作，便可以在上述问题的一个或多个上取得可观进展。


    虽然有些过分自信，但该提案对梦想做了清晰的阐述：精确地描述学习和人类智能的其他方面，好让计算机能够模拟。简而言之，他们想让莱布尼茨的梦想变成现实：把思考转化为计算。遗憾的是，我们马上就会看到，这种乐观态度很快便会在该领域弥漫开来。


    ## 大西洋对岸


    别以为我们的故事仅仅在美国往前推进。英国同样是计算的发祥地之一，在人工智能早年岁月里也扮演了关键角色。事实上，全世界为研究思考而专门建立的最资深的科学会社，就是英国人工智能和行为模拟研究协会（Society
    for the Study of Artificial Intelligence and the Simulation of Behaviour）。它成立于
    1964 年，延续至今。


