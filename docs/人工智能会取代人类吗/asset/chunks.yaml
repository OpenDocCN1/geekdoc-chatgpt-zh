    # 第一部分

    ## 人工智能的前尘旧事


    ## 第一章

    ### 人工智能之梦


    为理解人工智能将把我们带往何方，弄清楚它从哪儿来、今天在哪儿，会大有帮助。接下来，我们再从这里出发，推断未来。

    研发人工智能的努力，正式始于 1956 年，奠基人之一约翰·麦卡锡（John McCarthy）[\[1\]](#chapter001_0005_0001.xhtml#m1)在今天已经出了名的新罕布什尔州达特茅斯夏季研究项目中提出了这个名字。[\[2\]](#chapter001_0005_0001.xhtml#m2)说起来，麦卡锡选择这个名字是很不明智的。智能（Intelligence）本身是个不够明确的概念。而且，把“人工”这个词放在任何东西前头，都绝对不好听。它给你带来了许多关于“天然智能”和“人工愚蠢”的笑话。但不管是好是坏，我们现在还是用着这个名字。这个概念的历史可以追溯得更久远——甚至追溯到计算机发明之前。几百年来，人类一直想着能思考的机器，以及我们怎样塑造思维。


    ### 人工智能史前史

    和许多故事一样，这个故事并没有一个明确的开头。不过，它跟逻辑的发明故事密切相关。公元前 3 世纪或许可算是一个起点，当时亚里士多德开创了形式逻辑领域。没有逻辑，我们就没有当代数字计算机。逻辑往往（现在依然）被视为一种思考模式，一种精确说明我们怎样推理、形成论据的手段。

    亚里士多德之后的 2000 多年，除了一些用于计算天体运动、完成其他初级计算的机械式机器，人类在制造思考机器方面毫无进展。但公平地说，要想在中世纪的黑暗时代存活下来，即便是最先进的国家，人们还是有太多的事情要对付了，比如战争、疾病、饥饿。

    这期间有个突出的人物，是 13 世纪加泰罗尼亚作家、诗人、神学家、神秘主义者、数学家、逻辑学家和殉道者拉蒙·柳利（Ramon Llull）[\[3\]](#chapter001_0005_0001.xhtml#m3)。有人认为柳利是计算奠基人之一。他发明了一种原始逻辑，可以用机械方式，识别出他所谓的有关一个主题的所有可能真相。这样一来，他就成了第一批利用逻辑和机械方法产生知识的人物。然而，柳利的设想在当时并未得到大范围认可，尽管它们可能对我们这个故事里下一位要出场的人物产生了强烈的影响。


    ### 来计算吧

    随着中世纪蒙蔽心智的迷雾开始消逝，我们的故事渐渐提速。戈特弗里德·威廉·莱布尼茨（Gottfried Wilhelm Leibnitz）[\[4\]](#chapter001_0005_0001.xhtml#m4)是这期间出现的杰出人物之一。他最远见卓识的一点智慧贡献是，他认为人类的思想可以简化成某种运算，这种运算可以识别出我们推理中的错误，或是解决观点分歧。他写道：“校正我们推理的唯一方式就是让它们像数学家的工作一样具体，故此，我们可以一眼看出其中的错误。如果不同的人产生争执，我们可以简单地说：来计算吧，不用多说就能看出谁是对的。”[\[5\]](#chapter001_0005_0001.xhtml#m5)

    莱布尼茨提出了一种原始逻辑来执行这种计算。他构思了一套“人类思想字母表”，每个基本概念都由一个独特的符号来表示。归根结底，计算机也无非是操作符号的引擎。[\[6\]](#chapter001_0005_0001.xhtml#m6)如果数字计算机真的要“思考”，莱布尼茨的抽象概念必不可少。论据如下：就算计算机只能操作符号，如果这些符号代表了基本概念（一如莱布尼茨所提出），那么，计算机就能够产生新的概念，进而执行与人类似的推理过程。

    大约在同一时期，我们还出现了一位哲学家托马斯·霍布斯（Thomas Hobbes）[\[7\]](#chapter001_0005_0001.xhtml#m7)，他为思考机器的哲学基础又夯实了一块石头。和莱布尼茨一样，霍布斯把推理等同于计算。他写道：“通过推理，我理解了计算……故此，推理其实就跟加或减一样。”[\[8\]](#chapter001_0005_0001.xhtml#m8)

    像莱布尼茨和霍布斯那样把推理与计算等同起来，是在制造思考机器之路上迈出的第一步。尽管机械式计算器的发明，比霍布斯、莱布尼茨写书略早[\[9\]](#chapter001_0005_0001.xhtml#m9)，但直到近两百年后，才真的有人通过计算来执行推理。

    随着黑暗时代的过去，出现了另一位伟人勒内·笛卡儿（René Descartes）[\[10\]](#chapter001_0005_0001.xhtml#m10)。他贡献了一个至今仍困扰人工智能研究的重要哲学观点：我思故我在。也就是说，我思考，所以我存在。这五个字，把思想和存在干净利落地联系起来。反向推理[\[11\]](#chapter001_0005_0001.xhtml#m11)，我们可以得出结论：如果你不存在，你就不思考。这样一来，笛卡儿的观点就对思考机器的可能性提出了挑战。机器并不像我们这样存在。它们缺乏我们跟自身存在挂钩的许多特殊性质，比如说情感、道德、意识和创造力。而且，我们马上还将看到，反对思考机器存在的观点便提及了许多此类性质。例如，由于机器没有意识，它们无法思考。又或者，因为机器没有创造力，所以不能说它们是思考。我们很快会回到这些论点上。


    ### 布尔和巴贝奇

    又过了 200 年，我们故事中的下一个主要角色才登场。乔治·布尔（George Boole）[\[12\]](#chapter001_0005_0001.xhtml#m12)是一位自学成才的数学家。尽管没有大学学位，但他利用自己管理学校之外的闲暇时间，发表了不少数学文章，1849
    年被任命为爱尔兰科克郡皇后学院的第一位数学教授。布尔的大学职位，在当时处于学术世界的边缘位置，这让他得以自由地构建一些日后成为计算发展核心位置（也是开发思考机器之梦的核心）的观点。布尔提出，可以通过代数运算来形成逻辑，这一代数运算基于两个值来操作：真或伪，开或关，0
    或 1。这种“布尔逻辑”描述了今天每台计算机的操作；它们确确实实是复杂的机器，但处理的仍然是布尔的 0 和 1。虽然布尔观点的重要性当时没有多少人认可，但要说他是当今信息时代之父也不算太牵强。

    不过，布尔对自己的逻辑有着远超于所属时代的高远雄心。他就这套逻辑写过一本最完整的著作，名为《思维规律的研究》（*An Investigation of the
    Laws of Thought*），这个名字暗示了他的目标。布尔不光想为逻辑提供数学基础，更想对人类的推理进行解释。他在介绍这部作品时写道：

    本篇论文的宗旨是考察思维操作的基本规律；用微积分的符号语言加以表达，并根据这一基础，建立逻辑科学，构建它的方法；最后，在考察的过程中，收集真相的不同元素，对人类思维的性质和构成做一些可能的暗示。

    布尔从未完全实现这些雄心。事实上，他的工作在当时基本无人承认，10 年之后，他不幸去世。[\[13\]](#chapter001_0005_0001.xhtml#m13)但即便布尔没蹚科克郡学术圈的浑水，他也没有机器能自动实现这些梦想。


