    # 代序


    2005 年，在庆祝《科学》杂志（*science*）创刊 125 周年之际，该杂志社公布了 125 个最具挑战性的科学问题。在这 125 个问题中，和人工智能相关的问题只有一个——第
    94 个问题——“通过计算机进行学习的极限是什么？”。


    编写这些问题的专家那时也许还不知道，在 2005 年人工智能已经悄然发生了巨变。以 Geoffery Hinton（辛顿）为首的一批计算机科学家应用多层神经网络的算法，借助大数据和高性能计算，带来崭新的智能计算效果，揭开人类新一轮工业革命的帷幕。以深度学习为首的重大变革正在悄然席卷整个人工智能行业。同样，2015
    年的《科学》杂志刊登了辛顿和学生的文章：“深度学习”。


    之后的人工智能的历史我们都经历了。在 2016 年的 3 月，人工智能系统 AlphaGO 击败了人类围棋世界冠军李世石，其中深度学习大放异彩。但要说明的是，AlphaGO
    的这个成就包括了人工智能近期努力的所有结晶：深度学习、强化学习和蒙特卡洛树搜索。


    AlphaGO 的惊人成就也为社会带来了空前的好奇：人工智能到底是什么？这些科学家在过去 60 年做了些什么？人工智能的未来将走向哪里？


    这些问题也是伟大的哲学家们常问的问题：我们是谁？我们从哪里来？我们去向何方？


    而这些问题的重要性远大于人们的好奇心。当蒸汽机刚刚出现的时候，不少人还没有意识到工业革命将因此而发生，以至于没有为后面发生的重大社会经济变革做好准备。工业革命的发生，为竞争者提供了弯道超车的机会。历史告诉我们，这样的机会在一个人的一生当中最多只有一两次。现在，我们终于看到了有强大学习能力的人工智能。那么，人工智能将为人类社会带来哪些机遇呢？


    这本书的作者 Toby Walsh 教授是回答这些问题的最佳人选。我认识 Walsh 教授有十多年了。印象比较深的一次是 2011 年在西班牙举办的国际人工智能联合大会（IJCAI）
    ，那年 Walsh 教授是会议的程序委员会主席。IJCAI 会议往往是找领域内最有学术成就的人士来担任会议主席，而 Walsh 教授是这些学者中最有社会责任感的。他不仅将一千多人的大会办得有声有色，而且在这次和以后的几次会议上，他主持的人工智能与社会影响方面的特别讨论会，场场都爆满。他睿智，幽默，很有洞察力和感召力。在
    2017 年的 IJCAI 大会上，Walsh 教授率先发布公开信，带领国际知名人士如太空探索技术公司（SpaceX）CEO 兼 CTO、特斯拉公司 CEO
    兼产品架构师、太阳城公司（SolarCity）董事会主席埃隆·马斯克（Elon Musk）等呼吁禁止人工智能武器的开发。


    今天，中国的人工智能已经在世界舞台上有了举足轻重的分量。在 2011 年的 IJCAI 大会上，一个中国公司赞助商的影子都看不到。而在 2017 年在墨尔本举行的
    IJCAI 大会上，中国公司赞助商则成为主力军；中国的投稿量和文章录取数已经超过美国和欧洲，成为世界第一；文章质量也稳步提升，成为世界关注的焦点。就在不久前，中国在国家战略层面决定大规模投资人工智能研究和产业。中国国务院印发《新一代人工智能发展规划》，提出了面向
    2030 年中国新一代人工智能发展的指导思想、战略目标、重点任务和保障措施，部署构筑我国人工智能发展的先发优势，加快建设创新型国家和世界科技强国。


    在这样的大变革时代，Walsh 教授的这本新作来得正是时候。在众多人工智能的新书中，这本书的内容涵盖最广，从人工智能的缘起、发展到未来可能对人类社会产生的影响，都有直接、全面的回答。


    所以，如果今天《科学》杂志再次公布最具挑战性的科学问题的话，一定会有关于人工智能的问题。因为人工智能确实关乎人类社会的终极挑战：我们是谁？我们从哪里来？我们去向何方？


    杨强


    2018 年 4 月 2 日


    # 代序


    这本书值得一读！


    最近两年，雨后春笋般冒出许多关于人工智能的书籍，但是 Toby Walsh 教授的这本书有所不同：


    首先，这本书全面涉及了人工智能的过去、现在和未来，从人工智能研究的历史、现状、局限、挑战，到社会影响、职业威胁、技术奇点、自主武器……几乎无所不包。前三章帮助读者了解人工智能的发展历程和技术现状，后四章则探讨其社会意义和深远影响。可以说，一般读者对人工智能所希望了解的主要内容都可以在这里找到，覆盖面如此之广，实属难得。


    第二，这是一本由国际人工智能学界一流专家撰写的科普书。作者 Toby Walsh 教授是澳大利亚科学院院士，也是国际人工智能学会会士（AAAI Fellow），这是国际人工智能学界的崇高荣誉，标志着作者是业内公认的权威专家。市面上关于人工智能的书籍虽多，但水准良莠不齐，由国际一线权威专家撰写的高质量科普著作尤为少见。


    第三，这本书很好读。人工智能是计算机学科的主流分支之一，很多研究内容涉及繁复的理论推导和程序实现。但本书读起来却很轻松，全书甚至没有使用任何数学公式！恐怕正因为作者是真正的专家，才能通俗易懂、简单明了地说清复杂的问题。这不啻是读者的福音，各种知识背景的读者都能通过本书对人工智能有一个全景式的概貌了解。


    Toby Walsh 教授与愚常在国际学术会议上碰面。8 月初他请作序，愚因未读不敢妄评。Toby 即请国外出版社惠寄样书，不料连邮两次均未收到。11 月底才拿到英文书稿。抽空读罢，深感出色，尤其前三章深入浅出，注释的熟人故事妙趣横生，其后各章亦纵横捭阖，令人不忍释卷。冀望中译本能准确传递原貌，以使本书惠及更多读者。


