- raw: '编辑们不知道的是，这首诗是计算机写的。所以，撰写这一程序的发明家扎查瑞·斯库（Zachary Scholl）认为，他的程序已经在诗歌方面通过了图灵测试。不过，反驳这一说法的理由，和反驳聊天机器人尤金·古斯特曼通过了图灵测试的理由一样。学生写诗，本来可能就水平不佳，比如这首诗就有好几个叫人尴尬的地方。斯库提交了26首诗，对应26个英文字母。这首诗是唯一通过了编辑审阅的。故此，该程序96%的产出都并未通过图灵测试。再说，也没有人要求编辑们明确区分诗歌是计算机生成，还是人写出来的。不过，不管怎么说，说计算机永远写不了诗，已经越来越困难了。


    对洛夫莱斯伯爵夫人反对意见的另一回应是，人类跟计算机都受到相同的确定论定律限制。如果人类能带给我们惊喜，计算机或许也可以。事实上，从事人工智能研究工作的回报之一就是，当我们的创造物做出一些出人意料的事情，那醍醐灌顶的“我找到啦（aha）”瞬间。我还记得，自己第一次碰到此种情况时的惊讶和兴奋。那是1988年，我的程序推导出了一条数学定理的证明，我原以为这事远远超过了它的性能。对我带的本科生来说，推导也颇具挑战性。对此，我大受震动。


    对洛夫莱斯伯爵夫人反对意见的第三种回应是，机器学习有可能是任何智能机器的重要组成部分，因此，这机器会以我们没料到的方式行事。程序与周围环境之间复杂的互动，有可能带来创造力。


    ### “难题”


    反对思考机器（尤其是反对强人工智能）存在可能性还有一个强有力的观点是，机器永远不会拥有意识。这一反对意见是希尔勒“中文房间”观点的核心。1951年，在曼彻斯特大学举办的李斯特讲演大会上，英国脑外科医生杰弗里·杰弗逊（Geoffrey
    Jefferson）雄辩地提出了这一观点：


    除非机器能出于自己所感受的思想和情绪来写诗作曲，而不是靠着符号的随机落下，否则我们没法认同机器跟大脑相同。也就是说，机器不光要能写出诗来，更要知道这就是自己所写的东西。没有机器会感觉（不光是人为的信号，这在设计上很容易实现）自己成功带来的愉悦，为自己保险丝烧熔感到悲伤，因为好听话暖了心窝，为自己犯错而懊恼，受到性的诱惑，得不到想要的东西时勃然大怒或闷闷不乐。


    在考虑这一论点时，我们首先要抛开唯我论式的恐惧：只有人的意识确定存在（译注：此说法是“我思故我在”的另一种阐述）。有一种可能性，我们不得不面对：意识说不定是一种突现特征，它可以在任何足够复杂的系统里演化，哪怕该系统是硅构成的。此外，意识本来就是生物系统里一个难以解释的问题。事实上，哲学家大卫·查尔默斯（David
    Chalmers）就称之为“难题”（the hard prollem）。[\[10\]](#chapter001_0008.xhtml#m10)


    意识是心智科学里最令人困惑的问题。意识体验我们再熟悉不过了，可要解释它也再困难不过了。近年来，人们已经对各种各样的精神现象进行了科学观察，但意识仍然顽强地抵挡着来自人的探索努力。许多人试图解释它，但解释似乎总是打不着靶子。有人甚至认为这个问题太棘手了，给不出好的解释。


    我希望，通过制造思考机器，我们有一天能得出这个“难题”的部分解答。没准，到了某个时候，它们自己就冒出了意识？又或者，我们可以制造出能思考但本身并未发展出任何意识形式的机器？我们可能更喜欢未曾获得意识的机器。一旦机器有了意识，我们恐怕就对它们产生了道德义务。把它们关掉合理吗？它们是否在受苦？


    无论如何，由于我们今天对意识的认识还太少，还说不清它是否一定是制造思考机器之梦的限制。


    ### 缄默限制


    制造思考机器的另一限制乍看起来是矛盾的，它跟我们的无意识思维相关。在开创性作品《默会维度》（*The Tacit Dimension*）里，迈克尔·波兰尼（Michael
    Polanyi）一开始就做出了这样的观察：


    我们所知的，超出了我们自己的判断……潜水员的技能，不能用一套彻底的汽车理论知识来代替；我对自己身体的认识，完全有别于相关的生理学知识；韵律和诗体的规则，并不能告诉我一首诗到底在讲什么，而哪怕我对诗歌的规则一无所知，我也知道这首诗在讲什么。[\[11\]](#chapter001_0008.xhtml#m11)


    人所做的大量“智能活动”，我们是无法向其他任何人解释的，甚至也没法向自己解释。2014年，经济学家保罗·奥图（Paul Autor）借鉴了这一观点，认为“事实证明，最难诉诸自动化的任务，就是那些要求灵活性、判断力和常识技能等人只能通过默契来理解的任务”。[\[12\]](#chapter001_0008.xhtml#m12)（译注：不过，奥图论述的对象并不是计算机。）


    他将之称为“波兰尼悖论”。波兰尼悖论最合适的一个例子就是面部识别。你知道丈夫的脸，你可以从100万甚至10亿张其他人的面孔里把它认出来。可对这些有关他的脸的知识，你自己并无意识，你甚至说不出他眼睛、鼻子和嘴巴的位置到底是什么样的。然而，无意识中，你的的确确能分辨出这张脸的整体。


    另一个例子，仍然与构建思考机器密切相关的，是语言本身。我们学习语言，不是靠的教语法和用字典。事实上，尤其是英语这种松散的语言，我们很多人基本上都意识不到它竟然还有正式的语法。我了解的大部分英语语法，都来自在学校里被硬塞给我的拉丁语。波兰尼悖论还有其他很多例子：骑自行车、酿酒、烤面包……我们可以在书本里读到它们的知识，但要是你想学会，就必须亲手做。


    波兰尼悖论还跟另一个矛盾观点有着紧密的联系，后一观点来自人工智能研究人员早些时候的发现。20世纪80年代，汉斯·莫拉维克（Hans Moravec）、罗德尼·布鲁克斯、马文·明斯基等人确认了莫拉维克悖论的存在。[\[13\]](#chapter001_0008.xhtml#m13)莫拉维克对悖论作了这样的描述：“让计算机在智力测试或下跳棋等事情上表现出成年人的成绩水平相对容易，可在感知和机动性上，却很难赋予它们1岁孩子都掌握的技能。”[\[14\]](#chapter001_0008.xhtml#m14)


    著名语言学家兼认知科学家史蒂芬·平克（Steven Pinker）称这是人工智能研究人员最重要的发现。[^(\[15\])](#chapter001_0008.xhtml#m15)他在《语言本能》（*The
    Language Instinct*）一书中写道：


    35年人工智能研究路上的主要教训是，困难的问题容易，容易的问题难。4岁孩子的心智能力，如识别面孔、举起铅笔、穿过房间、回答问题，我们视之为理所当然，实际上是在解决最为困难的工程设计问题。别受汽车广告里流水线上的机器人愚弄，它们所做的无非是焊接和喷漆，这些任务不需要笨重的机器人先生看见、举起或放置任何东西。而如果你偶然碰到一套人工智能系统，你问它像这样的问题：是芝加哥大，还是面包箱大？斑马是蹩脚内裤吗？地板会不会跳起来咬你？如果苏珊去商店，她的脑袋会跟她一起去吗？大多数对自动化的恐惧都放错了地方。随着新一代智能设备的出现，股票分析师、石油化工工程师和假释董事会成员恐怕会遭到机器的取代。园丁、接待员和厨师，未来几十年都能饭碗无忧。[^(\[16\])](#chapter001_0008.xhtml#m16)


    波兰尼悖论的反面是，我们难于实现自动化的任务，是那些计算机趋于增进人类而非取代人类的任务。从这一悖论出发，建筑工人相对安全。但他会变成一个使用起重机、挖掘机、钻孔机和其他工具成倍放大自己工作效率的“机器人”。


    或许，波兰尼的想法里并没有真正的矛盾之处。我们的大脑对数十亿年来的演变做了编码，我们的感知和反射经过了数百万代人的精密微调，高级意识思想降临得相对较晚。机器掌握一项任务的难度，或许只不过反映出人类演化用了多长时间才掌握它。


    ### 人为限制


    我们可能永远无法迎来思考机器的一个原因在于，我们说不定会制定法律，禁止制造。我们可能会认为开发某些机器的风险大于收益。又或者，我们允许制造它们，但对它们的行为方式加以限制。1942年，艾萨克·阿西莫夫（Isaac
    Asimov）提出了著名的机器人定律。


    **阿西莫夫定律**


    1.机器人不得伤害人类，或坐视人类受到伤害。


    2.除非违背第一定律，机器人必须服从人类的命令。


    3.在不违背第一及第二定律的前提下，机器人必须保护自己。


    阿西莫夫称上述定律来自2058年出版的《机器人手册》（*Handbook of Robotics*）第56版。[^(\[17\])](#chapter001_0008.xhtml#m17)和许多其他领域一样，阿西莫夫的作品展现出了非凡的远见。到2058年，机器人很可能在我们的社会中扮演关键的角色，我们必须为它们的行为设定伦理。很遗憾的是，阿西莫夫的故事表明，就连这样简单的定律也大有问题。[^(\[18\])](#chapter001_0008.xhtml#m18)如果机器人必须伤害一个人，以拯救其他若干人，该怎么办？如果采取行动和不作为都会伤害人类，该怎么办？如果两个人给出彼此矛盾的命令，该怎么办？即便如此，阿西莫夫仍然主张，应该带着对此类定律的思考来开发机器人：“每当有人问我，如果到了机器人足够常见、足够灵活，能够在不同行为方式中做出选择的那一天，真的用我的机器人三定律来监管机器人的行为，我会怎么看呢？我的答案早已酝酿成熟。”[^(\[19\])](#chapter001_0008.xhtml#m19)


    尽管阿西莫夫如此坚持，我还是保持怀疑态度。他的定律为什么不足以充当开发能与人类互动的机器人的机制，原因很多。他自己也承认，人类肯定并不完全理性。阿西莫夫定律既不准确，也不完整。准确地把所有我们想都想不到的场景都涵盖在内，恐怕是挑战最大的地方。谷歌在开发无人驾驶汽车期间，报告说它们的车碰到了一些极度怪异、完全出乎意料的情况。


    曾和图灵一起在布莱切利公园共事的英国数学家I.J.古德（I.J.Good）[^(\[20\])](#chapter001_0008.xhtml#m20)提出了一条简单得多的定律。这条定律简洁而优美：“对待不如你的人，就像比你优秀的人对待你那样。”


    很遗憾，就连这条定律也能找到缺陷。机器人恐怕想要插上电源充充电，人类则不然。机器人一定要为了我们牺牲自己，哪怕我们不如它们。于是，后来的人只好试着把话说得更准确，限定条件也更多。2010年，英国资助人工智能研究的主要政府机构，工程与自然研究理事会（Engineering
    and Physical Science Research Council，EPSRC）召集了来自技术、艺术、法律和社会科学等领域的专家，为机器人界定一些根本性原则。


    **EPSRC的机器人原则**


    1.机器人是多用途工具。除非是为了国家安全，设计机器人的时候，不应以杀死或伤害人为唯一或主要目的。


    2.人类是负责主体，而非机器人。在设计、操作上，只要切实可行，机器人都应遵守现行法律及基本权利及自由，包括隐私权。


    3.机器人是产品。在设计上，它们所使用的流程，应确保其自身安全可靠。


    4.机器人是工业人造物品。在设计上，它们不应以欺骗性方式来利用弱势用户；相反，它们的机器性质应当一目了然。


    5.对机器人负有法律责任者，应遭到追责。


    很难对这些原则表示异议。但有几个严肃的问题，它们仍未能解决（我们稍后要提到）。如果机器人能对自身行为进行学习，人怎么能够对机器人负有法律责任呢？如果机器人不是负责主体，那么，当自动驾驶汽车把我们的孩子从学校送回家，该由什么人来负责呢？对那些工作被我们设计的机器人夺走的社会弱势群体，我们怎么加以保护呢？这类的问题还可以继续列举下去。


    还有人继续尝试。2016年，为全英国设定规格标准的国家机构，英国标准协会（British Standards Institution，BSI）公布了《BS
    8611》。这是一本28页的指南，论述怎样设计在道德上合乎理性的机器人，确定了一些道德危害，包括机器人欺骗、机器人上瘾，以及自学系统超出其职责的可能性。《卫报》将这套标准总结为：“不害人，不歧视。”其他国家和机构也正在跟进。全世界规模最大的技术专家组织，电气电子工程师学会（IEEE）就正在为下属的40万开发人工智能系统的会员拟定类似的指导原则。


    ### 机器合作伙伴


    2016年9月，谷歌、亚马逊、IBM、微软和Facebook宣布结成“人工智能伙伴关系，造福人类和社会”。该倡议的目标是规范人工智能技术的最佳实践，提高公众对人工智能的认识，充当探讨人工智能及其对人与社会影响的开放平台。该伙伴关系以下列宗旨为指导：


    **“人工智能伙伴关系”的宗旨**


    1.我们将努力确保人工智能技术为尽量多的人造福，也为其授权。


    2.我们将教育和倾听公众，积极调动利害关系人，了解他们对我们工作重点的反馈，告知他们我们的工作情况，解决他们的问题。


    3.我们承诺，就人工智能的道德、社会、经济和法律意义，进行公开的研究和对话。


    4.我们认为，人工智能的研究开发工作，需要大范围利害关系人的积极参与和负责。


    5.我们将与商界的利害关系人代表进行交流，帮忙确保具体领域的担忧与机遇得到理解，得到解决。


    6.我们将努力让人工智能技术带来的利益实现最大化，解决其潜在挑战，具体方式是：


    a.努力保护个人的隐私和安全。


    b.努力了解并尊重可能受到人工智能进步影响的各方利益。


    c.努力确保人工智能研究和工程社群，为人工智能给社会带去的大范围潜在影响承担责任，保持敏感，直接投入。


    d.确保人工智能研究和技术坚稳、可靠、值得信赖，按照安全规范运行。


    e.反对开发和利用违反国际公约或人权的人工智能技术，促进无危害的保障和技术。


    7.我们相信，出于解释技术的目的，人工智能系统的运作有必要得到人的理解，能向其进行说明。


    8.我们力争在人工智能科学家和工程师之间创造合作、信任和开放的文化，帮助我们更好地实现上述目标。


    还是那句话，“人工智能伙伴关系”提出的大部分原则，没什么好反对的。这一倡议还很年轻，很难知道它将怎样影响该领域的发展。它能保证负责任地开发可造福所有人的人工智能吗？但愿它不仅仅是一场公关活动。这些创始合作伙伴是从人工智能技术里受益最多的技术公司，它们存在明显的利益冲突。我有许多从事人工智能工作的同事都担心有太多的权力集中在这些巨头手里了。考虑到它们在税务安排、扫描书籍、游说国会等事情上的做法，这些公司的成功，不见得总是符合公众利益。


    ### 伦理限制


    思考机器提出了大量有趣的伦理挑战。自动驾驶就是急需解决这些挑战的领域之一。计算机正开始在我们的道路和高速公路上作事关生死的决定。假设你坐在一辆自动驾驶汽车上读报纸，两个孩子突然冲进了你前面的路上。汽车会决定撞上这两个孩子，还是跟对面车道上的车迎面相撞，还是撞上另一辆停着的车？计算机有几毫秒来决定采取哪种行动，而所有这些行动，都有可能导致人受伤或丧命。


    这种生死攸关的情景，伦理学家称为“有轨电车难题”（trolley problem）。你要在不同的方案之间进行选择，而选择的结果决定了谁生谁死。计算机兴许计算出，撞上两个孩子可能会害死他们，但安全气囊能把你救下来。计算机或许也计算出，跟迎面而来的汽车相撞，碰撞更猛烈，可能会害死你，也害死对面车里的乘客。最后，它可能还计算出，跟停着的车相撞，有很大概率会害死你。这个结果，死的人最少——但那个不幸的受害者是你。如果有一个孩子跑到路上，该怎么办？现在，要在你和孩子之间作选择。


    原版问题讨论的是一辆失控的轨道推车。前方的轨道上捆着五个人。你站在推车和人中间，身旁有个拉杆。如果你拉动它，推车将切换到旁边的轨道上，但那条轨道上绑着一个人。你有两种选择：要么什么都不做，推车在主轨上撞死5个人；要么你推动拉杆，把推车推上侧轨，撞死一个人。你会选择怎么做？推车问题有许多改编版本，如把人推进推车所在的轨道，从一个人身上移植器官拯救多人性命，受害者的结局是关起来而不是撞死。这些改编版本暴露了作为与不作为、直接效果与可能出现的副作用之间的伦理差异。


    尽管手推车问题引起了广泛的关注，但就开发符合伦理道德的自动驾驶汽车而言，它只占了问题的一小部分。人们还要面对其他许多伦理问题，这些问题里有不少都会出现得更为频繁。人类驾驶员是经常违反法律的。我们闯黄灯，我们占用人行道，我们会超速来摆脱危险路况。自动驾驶车辆能否以这种方式违反法律呢？如果可以，违反到多大程度合适呢？另一个引发热议的伦理问题是，我们是否应该开发一套系统，让人类驾驶员临时收回控制权呢？有证据表明，人类很难做到这一点，甚至可能没办法迅速重新获取背景认知。我们该怎样保护自动驾驶汽车有可能难以感知的其他道路使用者（如骑自行车的人，行人等）呢？自动驾驶汽车是否应该加上明确的标识，好让其他道路使用者保持恰当的谨慎态度来对待它们？我们应该为自动驾驶车辆准备专用车道吗？如果有一天，自动驾驶汽车变得比人类操纵的汽车更安全，还应该允许人类开车上路吗？


    未来10年，观察社会怎样适应自动驾驶汽车，怎样迎接它们带来的挑战，一定非常有趣。将来我们应该怎样应对人工智能提出的其他道德挑战，自动驾驶汽车领域有可能充当试验田。目前的证据只能说明，我们正梦游着走进这一光明的未来。在我看来，大多数政府对自动驾驶车辆所采取的立场，是把太多的责任都交到了开发相关技术的公司手里。可以理解，各国都不希望扼杀进步，也都想要从价值数万亿美元的自动驾驶车辆制造产业里分一杯羹。眼下的汽车巨头，如通用、福特和丰田，不见得能在这场比赛中赢得了特斯拉、苹果和Nvidia（英伟达）等后来者。同样地，让自动驾驶汽车上路，在伦理道德上势在必行，它们每年能避免数千人因交通事故丧生。但在这股匆忙往前跑的势头里，我们务必要谨慎。


    空中交通是一个很好的类比。在100年前这一技术的萌芽岁月，飞行很自由，事故司空见惯。飞行很危险，只有勇敢的人才敢飞。但政府很快就插手进来，对飞行本身和飞机制造商进行监管，设立了从事故中学习的机构。政府颁订法律规范飞行及飞机标准。如今，飞行成了最安全的交通方式之一。自动驾驶汽车也应以这样的终点为目标，但在我看来，要是政府不强调监管，我们恐怕达不到目的。


    我们不允许制药公司随心所欲地在一般公众身上检测产品。同样，我们也不应该让技术公司在没有强力监管的情况下，随心所欲地在公路上测试自动驾驶车辆。制药公司还不得随心所欲地改变产品。那么，我们为什么会允许汽车厂商自动上传未经验证的软件更新呢？只要具备商业可行性，任何道路测试中所学到的教训，都应与其他开发商共享。国家或国际机构需要调查自动驾驶车辆所卷入的事故原因，每次碰撞都能为自动驾驶车辆带来进步。


    ### 算法歧视


    另一个非常切近的伦理挑战是算法歧视。算法有可能有意无意地歧视特定社会群体。谷歌等公司一直在鼓吹算法很好、算法不歧视的神话。[^(\[21\])](#chapter001_0008.xhtml#m21)谷歌的行为准则开篇就说：“我们会尽力为用户提供不偏不倚的信息，关注其需求，为之带去最优秀的产品和服务。而他们为你提供不偏不倚信息的途径，就是靠盲目挑选最优结果的算法。然而算法真的有可能歧视，尤其是如果这些算法是从数据中学习的。'
  fmt: '

    编辑们不知道的是，这首诗是计算机写的。所以，撰写这一程序的发明家扎查瑞·斯库（Zachary Scholl）认为，他的程序已经在诗歌方面通过了图灵测试。不过，反驳这一说法的理由，和反驳聊天机器人尤金·古斯特曼通过了图灵测试的理由一样。学生写诗，本来可能就水平不佳，比如这首诗就有好几个叫人尴尬的地方。斯库提交了26首诗，对应26个英文字母。这首诗是唯一通过了编辑审阅的。故此，该程序96%的产出都并未通过图灵测试。再说，也没有人要求编辑们明确区分诗歌是计算机生成，还是人写出来的。不过，不管怎么说，说计算机永远写不了诗，已经越来越困难了。


    对洛夫莱斯伯爵夫人反对意见的另一回应是，人类跟计算机都受到相同的确定论定律限制。如果人类能带给我们惊喜，计算机或许也可以。事实上，从事人工智能研究工作的回报之一就是，当我们的创造物做出一些出人意料的事情，那醍醐灌顶的“我找到啦（aha）”瞬间。我还记得，自己第一次碰到此种情况时的惊讶和兴奋。那是1988年，我的程序推导出了一条数学定理的证明，我原以为这事远远超过了它的性能。对我带的本科生来说，推导也颇具挑战性。对此，我大受震动。


    对洛夫莱斯伯爵夫人反对意见的第三种回应是，机器学习有可能是任何智能机器的重要组成部分，因此，这机器会以我们没料到的方式行事。程序与周围环境之间复杂的互动，有可能带来创造力。


    ## “难题”


    反对思考机器（尤其是反对强人工智能）存在可能性还有一个强有力的观点是，机器永远不会拥有意识。这一反对意见是希尔勒“中文房间”观点的核心。1951年，在曼彻斯特大学举办的李斯特讲演大会上，英国脑外科医生杰弗里·杰弗逊（Geoffrey
    Jefferson）雄辩地提出了这一观点：


    除非机器能出于自己所感受的思想和情绪来写诗作曲，而不是靠着符号的随机落下，否则我们没法认同机器跟大脑相同。也就是说，机器不光要能写出诗来，更要知道这就是自己所写的东西。没有机器会感觉（不光是人为的信号，这在设计上很容易实现）自己成功带来的愉悦，为自己保险丝烧熔感到悲伤，因为好听话暖了心窝，为自己犯错而懊恼，受到性的诱惑，得不到想要的东西时勃然大怒或闷闷不乐。


    在考虑这一论点时，我们首先要抛开唯我论式的恐惧：只有人的意识确定存在（译注：此说法是“我思故我在”的另一种阐述）。有一种可能性，我们不得不面对：意识说不定是一种突现特征，它可以在任何足够复杂的系统里演化，哪怕该系统是硅构成的。此外，意识本来就是生物系统里一个难以解释的问题。事实上，哲学家大卫·查尔默斯（David
    Chalmers）就称之为“难题”（the hard prollem）。[\[10\]](#chapter001_0008.xhtml#m10)


    意识是心智科学里最令人困惑的问题。意识体验我们再熟悉不过了，可要解释它也再困难不过了。近年来，人们已经对各种各样的精神现象进行了科学观察，但意识仍然顽强地抵挡着来自人的探索努力。许多人试图解释它，但解释似乎总是打不着靶子。有人甚至认为这个问题太棘手了，给不出好的解释。


    我希望，通过制造思考机器，我们有一天能得出这个“难题”的部分解答。没准，到了某个时候，它们自己就冒出了意识？又或者，我们可以制造出能思考但本身并未发展出任何意识形式的机器？我们可能更喜欢未曾获得意识的机器。一旦机器有了意识，我们恐怕就对它们产生了道德义务。把它们关掉合理吗？它们是否在受苦？


    无论如何，由于我们今天对意识的认识还太少，还说不清它是否一定是制造思考机器之梦的限制。


    ## 缄默限制


    制造思考机器的另一限制乍看起来是矛盾的，它跟我们的无意识思维相关。在开创性作品《默会维度》（*The Tacit Dimension*）里，迈克尔·波兰尼（Michael
    Polanyi）一开始就做出了这样的观察：


    我们所知的，超出了我们自己的判断……潜水员的技能，不能用一套彻底的汽车理论知识来代替；我对自己身体的认识，完全有别于相关的生理学知识；韵律和诗体的规则，并不能告诉我一首诗到底在讲什么，而哪怕我对诗歌的规则一无所知，我也知道这首诗在讲什么。[\[11\]](#chapter001_0008.xhtml#m11)


    人所做的大量“智能活动”，我们是无法向其他任何人解释的，甚至也没法向自己解释。2014年，经济学家保罗·奥图（Paul Autor）借鉴了这一观点，认为“事实证明，最难诉诸自动化的任务，就是那些要求灵活性、判断力和常识技能等人只能通过默契来理解的任务”。[\[12\]](#chapter001_0008.xhtml#m12)（译注：不过，奥图论述的对象并不是计算机。）


    他将之称为“波兰尼悖论”。波兰尼悖论最合适的一个例子就是面部识别。你知道丈夫的脸，你可以从100万甚至10亿张其他人的面孔里把它认出来。可对这些有关他的脸的知识，你自己并无意识，你甚至说不出他眼睛、鼻子和嘴巴的位置到底是什么样的。然而，无意识中，你的的确确能分辨出这张脸的整体。


    另一个例子，仍然与构建思考机器密切相关的，是语言本身。我们学习语言，不是靠的教语法和用字典。事实上，尤其是英语这种松散的语言，我们很多人基本上都意识不到它竟然还有正式的语法。我了解的大部分英语语法，都来自在学校里被硬塞给我的拉丁语。波兰尼悖论还有其他很多例子：骑自行车、酿酒、烤面包……我们可以在书本里读到它们的知识，但要是你想学会，就必须亲手做。


    波兰尼悖论还跟另一个矛盾观点有着紧密的联系，后一观点来自人工智能研究人员早些时候的发现。20世纪80年代，汉斯·莫拉维克（Hans Moravec）、罗德尼·布鲁克斯、马文·明斯基等人确认了莫拉维克悖论的存在。[\[13\]](#chapter001_0008.xhtml#m13)莫拉维克对悖论作了这样的描述：“让计算机在智力测试或下跳棋等事情上表现出成年人的成绩水平相对容易，可在感知和机动性上，却很难赋予它们1岁孩子都掌握的技能。”[\[14\]](#chapter001_0008.xhtml#m14)


    著名语言学家兼认知科学家史蒂芬·平克（Steven Pinker）称这是人工智能研究人员最重要的发现。[^(\[15\])](#chapter001_0008.xhtml#m15)他在《语言本能》（*The
    Language Instinct*）一书中写道：


    35年人工智能研究路上的主要教训是，困难的问题容易，容易的问题难。4岁孩子的心智能力，如识别面孔、举起铅笔、穿过房间、回答问题，我们视之为理所当然，实际上是在解决最为困难的工程设计问题。别受汽车广告里流水线上的机器人愚弄，它们所做的无非是焊接和喷漆，这些任务不需要笨重的机器人先生看见、举起或放置任何东西。而如果你偶然碰到一套人工智能系统，你问它像这样的问题：是芝加哥大，还是面包箱大？斑马是蹩脚内裤吗？地板会不会跳起来咬你？如果苏珊去商店，她的脑袋会跟她一起去吗？大多数对自动化的恐惧都放错了地方。随着新一代智能设备的出现，股票分析师、石油化工工程师和假释董事会成员恐怕会遭到机器的取代。园丁、接待员和厨师，未来几十年都能饭碗无忧。[^(\[16\])](#chapter001_0008.xhtml#m16)


    波兰尼悖论的反面是，我们难于实现自动化的任务，是那些计算机趋于增进人类而非取代人类的任务。从这一悖论出发，建筑工人相对安全。但他会变成一个使用起重机、挖掘机、钻孔机和其他工具成倍放大自己工作效率的“机器人”。


    或许，波兰尼的想法里并没有真正的矛盾之处。我们的大脑对数十亿年来的演变做了编码，我们的感知和反射经过了数百万代人的精密微调，高级意识思想降临得相对较晚。机器掌握一项任务的难度，或许只不过反映出人类演化用了多长时间才掌握它。


    ## 人为限制


    我们可能永远无法迎来思考机器的一个原因在于，我们说不定会制定法律，禁止制造。我们可能会认为开发某些机器的风险大于收益。又或者，我们允许制造它们，但对它们的行为方式加以限制。1942年，艾萨克·阿西莫夫（Isaac
    Asimov）提出了著名的机器人定律。


    ### 阿西莫夫定律


    1.机器人不得伤害人类，或坐视人类受到伤害。


    2.除非违背第一定律，机器人必须服从人类的命令。


    3.在不违背第一及第二定律的前提下，机器人必须保护自己。


    阿西莫夫称上述定律来自2058年出版的《机器人手册》（*Handbook of Robotics*）第56版。[^(\[17\])](#chapter001_0008.xhtml#m17)和许多其他领域一样，阿西莫夫的作品展现出了非凡的远见。到2058年，机器人很可能在我们的社会中扮演关键的角色，我们必须为它们的行为设定伦理。很遗憾的是，阿西莫夫的故事表明，就连这样简单的定律也大有问题。[^(\[18\])](#chapter001_0008.xhtml#m18)如果机器人必须伤害一个人，以拯救其他若干人，该怎么办？如果采取行动和不作为都会伤害人类，该怎么办？如果两个人给出彼此矛盾的命令，该怎么办？即便如此，阿西莫夫仍然主张，应该带着对此类定律的思考来开发机器人：“每当有人问我，如果到了机器人足够常见、足够灵活，能够在不同行为方式中做出选择的那一天，真的用我的机器人三定律来监管机器人的行为，我会怎么看呢？我的答案早已酝酿成熟。”[^(\[19\])](#chapter001_0008.xhtml#m19)


    尽管阿西莫夫如此坚持，我还是保持怀疑态度。他的定律为什么不足以充当开发能与人类互动的机器人的机制，原因很多。他自己也承认，人类肯定并不完全理性。阿西莫夫定律既不准确，也不完整。准确地把所有我们想都想不到的场景都涵盖在内，恐怕是挑战最大的地方。谷歌在开发无人驾驶汽车期间，报告说它们的车碰到了一些极度怪异、完全出乎意料的情况。


    曾和图灵一起在布莱切利公园共事的英国数学家I.J.古德（I.J.Good）[^(\[20\])](#chapter001_0008.xhtml#m20)提出了一条简单得多的定律。这条定律简洁而优美：“对待不如你的人，就像比你优秀的人对待你那样。”


    很遗憾，就连这条定律也能找到缺陷。机器人恐怕想要插上电源充充电，人类则不然。机器人一定要为了我们牺牲自己，哪怕我们不如它们。于是，后来的人只好试着把话说得更准确，限定条件也更多。2010年，英国资助人工智能研究的主要政府机构，工程与自然研究理事会（Engineering
    and Physical Science Research Council，EPSRC）召集了来自技术、艺术、法律和社会科学等领域的专家，为机器人界定一些根本性原则。


    ### EPSRC的机器人原则


    1.机器人是多用途工具。除非是为了国家安全，设计机器人的时候，不应以杀死或伤害人为唯一或主要目的。


    2.人类是负责主体，而非机器人。在设计、操作上，只要切实可行，机器人都应遵守现行法律及基本权利及自由，包括隐私权。


    3.机器人是产品。在设计上，它们所使用的流程，应确保其自身安全可靠。


    4.机器人是工业人造物品。在设计上，它们不应以欺骗性方式来利用弱势用户；相反，它们的机器性质应当一目了然。


    5.对机器人负有法律责任者，应遭到追责。


    很难对这些原则表示异议。但有几个严肃的问题，它们仍未能解决（我们稍后要提到）。如果机器人能对自身行为进行学习，人怎么能够对机器人负有法律责任呢？如果机器人不是负责主体，那么，当自动驾驶汽车把我们的孩子从学校送回家，该由什么人来负责呢？对那些工作被我们设计的机器人夺走的社会弱势群体，我们怎么加以保护呢？这类的问题还可以继续列举下去。


    还有人继续尝试。2016年，为全英国设定规格标准的国家机构，英国标准协会（British Standards Institution，BSI）公布了《BS
    8611》。这是一本28页的指南，论述怎样设计在道德上合乎理性的机器人，确定了一些道德危害，包括机器人欺骗、机器人上瘾，以及自学系统超出其职责的可能性。《卫报》将这套标准总结为：“不害人，不歧视。”其他国家和机构也正在跟进。全世界规模最大的技术专家组织，电气电子工程师学会（IEEE）就正在为下属的40万开发人工智能系统的会员拟定类似的指导原则。


    ## 机器合作伙伴


    2016年9月，谷歌、亚马逊、IBM、微软和Facebook宣布结成“人工智能伙伴关系，造福人类和社会”。该倡议的目标是规范人工智能技术的最佳实践，提高公众对人工智能的认识，充当探讨人工智能及其对人与社会影响的开放平台。该伙伴关系以下列宗旨为指导：


    ### “人工智能伙伴关系”的宗旨


    1.我们将努力确保人工智能技术为尽量多的人造福，也为其授权。


    2.我们将教育和倾听公众，积极调动利害关系人，了解他们对我们工作重点的反馈，告知他们我们的工作情况，解决他们的问题。


    3.我们承诺，就人工智能的道德、社会、经济和法律意义，进行公开的研究和对话。


    4.我们认为，人工智能的研究开发工作，需要大范围利害关系人的积极参与和负责。


    5.我们将与商界的利害关系人代表进行交流，帮忙确保具体领域的担忧与机遇得到理解，得到解决。


    6.我们将努力让人工智能技术带来的利益实现最大化，解决其潜在挑战，具体方式是：


    a.努力保护个人的隐私和安全。


    b.努力了解并尊重可能受到人工智能进步影响的各方利益。


    c.努力确保人工智能研究和工程社群，为人工智能给社会带去的大范围潜在影响承担责任，保持敏感，直接投入。


    d.确保人工智能研究和技术坚稳、可靠、值得信赖，按照安全规范运行。


    e.反对开发和利用违反国际公约或人权的人工智能技术，促进无危害的保障和技术。


    7.我们相信，出于解释技术的目的，人工智能系统的运作有必要得到人的理解，能向其进行说明。


    8.我们力争在人工智能科学家和工程师之间创造合作、信任和开放的文化，帮助我们更好地实现上述目标。


    还是那句话，“人工智能伙伴关系”提出的大部分原则，没什么好反对的。这一倡议还很年轻，很难知道它将怎样影响该领域的发展。它能保证负责任地开发可造福所有人的人工智能吗？但愿它不仅仅是一场公关活动。这些创始合作伙伴是从人工智能技术里受益最多的技术公司，它们存在明显的利益冲突。我有许多从事人工智能工作的同事都担心有太多的权力集中在这些巨头手里了。考虑到它们在税务安排、扫描书籍、游说国会等事情上的做法，这些公司的成功，不见得总是符合公众利益。


    ## 伦理限制


    思考机器提出了大量有趣的伦理挑战。自动驾驶就是急需解决这些挑战的领域之一。计算机正开始在我们的道路和高速公路上作事关生死的决定。假设你坐在一辆自动驾驶汽车上读报纸，两个孩子突然冲进了你前面的路上。汽车会决定撞上这两个孩子，还是跟对面车道上的车迎面相撞，还是撞上另一辆停着的车？计算机有几毫秒来决定采取哪种行动，而所有这些行动，都有可能导致人受伤或丧命。


    这种生死攸关的情景，伦理学家称为“有轨电车难题”（trolley problem）。你要在不同的方案之间进行选择，而选择的结果决定了谁生谁死。计算机兴许计算出，撞上两个孩子可能会害死他们，但安全气囊能把你救下来。计算机或许也计算出，跟迎面而来的汽车相撞，碰撞更猛烈，可能会害死你，也害死对面车里的乘客。最后，它可能还计算出，跟停着的车相撞，有很大概率会害死你。这个结果，死的人最少——但那个不幸的受害者是你。如果有一个孩子跑到路上，该怎么办？现在，要在你和孩子之间作选择。


    原版问题讨论的是一辆失控的轨道推车。前方的轨道上捆着五个人。你站在推车和人中间，身旁有个拉杆。如果你拉动它，推车将切换到旁边的轨道上，但那条轨道上绑着一个人。你有两种选择：要么什么都不做，推车在主轨上撞死5个人；要么你推动拉杆，把推车推上侧轨，撞死一个人。你会选择怎么做？推车问题有许多改编版本，如把人推进推车所在的轨道，从一个人身上移植器官拯救多人性命，受害者的结局是关起来而不是撞死。这些改编版本暴露了作为与不作为、直接效果与可能出现的副作用之间的伦理差异。


    尽管手推车问题引起了广泛的关注，但就开发符合伦理道德的自动驾驶汽车而言，它只占了问题的一小部分。人们还要面对其他许多伦理问题，这些问题里有不少都会出现得更为频繁。人类驾驶员是经常违反法律的。我们闯黄灯，我们占用人行道，我们会超速来摆脱危险路况。自动驾驶车辆能否以这种方式违反法律呢？如果可以，违反到多大程度合适呢？另一个引发热议的伦理问题是，我们是否应该开发一套系统，让人类驾驶员临时收回控制权呢？有证据表明，人类很难做到这一点，甚至可能没办法迅速重新获取背景认知。我们该怎样保护自动驾驶汽车有可能难以感知的其他道路使用者（如骑自行车的人，行人等）呢？自动驾驶汽车是否应该加上明确的标识，好让其他道路使用者保持恰当的谨慎态度来对待它们？我们应该为自动驾驶车辆准备专用车道吗？如果有一天，自动驾驶汽车变得比人类操纵的汽车更安全，还应该允许人类开车上路吗？


    未来10年，观察社会怎样适应自动驾驶汽车，怎样迎接它们带来的挑战，一定非常有趣。将来我们应该怎样应对人工智能提出的其他道德挑战，自动驾驶汽车领域有可能充当试验田。目前的证据只能说明，我们正梦游着走进这一光明的未来。在我看来，大多数政府对自动驾驶车辆所采取的立场，是把太多的责任都交到了开发相关技术的公司手里。可以理解，各国都不希望扼杀进步，也都想要从价值数万亿美元的自动驾驶车辆制造产业里分一杯羹。眼下的汽车巨头，如通用、福特和丰田，不见得能在这场比赛中赢得了特斯拉、苹果和Nvidia（英伟达）等后来者。同样地，让自动驾驶汽车上路，在伦理道德上势在必行，它们每年能避免数千人因交通事故丧生。但在这股匆忙往前跑的势头里，我们务必要谨慎。


    空中交通是一个很好的类比。在100年前这一技术的萌芽岁月，飞行很自由，事故司空见惯。飞行很危险，只有勇敢的人才敢飞。但政府很快就插手进来，对飞行本身和飞机制造商进行监管，设立了从事故中学习的机构。政府颁订法律规范飞行及飞机标准。如今，飞行成了最安全的交通方式之一。自动驾驶汽车也应以这样的终点为目标，但在我看来，要是政府不强调监管，我们恐怕达不到目的。


    我们不允许制药公司随心所欲地在一般公众身上检测产品。同样，我们也不应该让技术公司在没有强力监管的情况下，随心所欲地在公路上测试自动驾驶车辆。制药公司还不得随心所欲地改变产品。那么，我们为什么会允许汽车厂商自动上传未经验证的软件更新呢？只要具备商业可行性，任何道路测试中所学到的教训，都应与其他开发商共享。国家或国际机构需要调查自动驾驶车辆所卷入的事故原因，每次碰撞都能为自动驾驶车辆带来进步。


    ## 算法歧视


    另一个非常切近的伦理挑战是算法歧视。算法有可能有意无意地歧视特定社会群体。谷歌等公司一直在鼓吹算法很好、算法不歧视的神话。[^(\[21\])](#chapter001_0008.xhtml#m21)谷歌的行为准则开篇就说：“我们会尽力为用户提供不偏不倚的信息，关注其需求，为之带去最优秀的产品和服务。而他们为你提供不偏不倚信息的途径，就是靠盲目挑选最优结果的算法。然而算法真的有可能歧视，尤其是如果这些算法是从数据中学习的。

    '
  trans: '

    编辑们不知道的是，这首诗是计算机写的。所以，撰写这一程序的发明家扎查瑞·斯库（Zachary Scholl）认为，他的程序已经在诗歌方面通过了图灵测试。不过，反驳这一说法的理由，和反驳聊天机器人尤金·古斯特曼通过了图灵测试的理由一样。学生写诗，本来可能就水平不佳，比如这首诗就有好几个叫人尴尬的地方。斯库提交了
    26 首诗，对应 26 个英文字母。这首诗是唯一通过了编辑审阅的。故此，该程序 96%的产出都并未通过图灵测试。再说，也没有人要求编辑们明确区分诗歌是计算机生成，还是人写出来的。不过，不管怎么说，说计算机永远写不了诗，已经越来越困难了。


    对洛夫莱斯伯爵夫人反对意见的另一回应是，人类跟计算机都受到相同的确定论定律限制。如果人类能带给我们惊喜，计算机或许也可以。事实上，从事人工智能研究工作的回报之一就是，当我们的创造物做出一些出人意料的事情，那醍醐灌顶的“我找到啦（aha）”瞬间。我还记得，自己第一次碰到此种情况时的惊讶和兴奋。那是
    1988 年，我的程序推导出了一条数学定理的证明，我原以为这事远远超过了它的性能。对我带的本科生来说，推导也颇具挑战性。对此，我大受震动。


    对洛夫莱斯伯爵夫人反对意见的第三种回应是，机器学习有可能是任何智能机器的重要组成部分，因此，这机器会以我们没料到的方式行事。程序与周围环境之间复杂的互动，有可能带来创造力。


    ## “难题”


    反对思考机器（尤其是反对强人工智能）存在可能性还有一个强有力的观点是，机器永远不会拥有意识。这一反对意见是希尔勒“中文房间”观点的核心。1951 年，在曼彻斯特大学举办的李斯特讲演大会上，英国脑外科医生杰弗里·杰弗逊（Geoffrey
    Jefferson）雄辩地提出了这一观点：


    除非机器能出于自己所感受的思想和情绪来写诗作曲，而不是靠着符号的随机落下，否则我们没法认同机器跟大脑相同。也就是说，机器不光要能写出诗来，更要知道这就是自己所写的东西。没有机器会感觉（不光是人为的信号，这在设计上很容易实现）自己成功带来的愉悦，为自己保险丝烧熔感到悲伤，因为好听话暖了心窝，为自己犯错而懊恼，受到性的诱惑，得不到想要的东西时勃然大怒或闷闷不乐。


    在考虑这一论点时，我们首先要抛开唯我论式的恐惧：只有人的意识确定存在（译注：此说法是“我思故我在”的另一种阐述）。有一种可能性，我们不得不面对：意识说不定是一种突现特征，它可以在任何足够复杂的系统里演化，哪怕该系统是硅构成的。此外，意识本来就是生物系统里一个难以解释的问题。事实上，哲学家大卫·查尔默斯（David
    Chalmers）就称之为“难题”（the hard prollem）。[\[10\]](#chapter001_0008.xhtml#m10)


    意识是心智科学里最令人困惑的问题。意识体验我们再熟悉不过了，可要解释它也再困难不过了。近年来，人们已经对各种各样的精神现象进行了科学观察，但意识仍然顽强地抵挡着来自人的探索努力。许多人试图解释它，但解释似乎总是打不着靶子。有人甚至认为这个问题太棘手了，给不出好的解释。


    我希望，通过制造思考机器，我们有一天能得出这个“难题”的部分解答。没准，到了某个时候，它们自己就冒出了意识？又或者，我们可以制造出能思考但本身并未发展出任何意识形式的机器？我们可能更喜欢未曾获得意识的机器。一旦机器有了意识，我们恐怕就对它们产生了道德义务。把它们关掉合理吗？它们是否在受苦？


    无论如何，由于我们今天对意识的认识还太少，还说不清它是否一定是制造思考机器之梦的限制。


    ## 缄默限制


    制造思考机器的另一限制乍看起来是矛盾的，它跟我们的无意识思维相关。在开创性作品《默会维度》（*The Tacit Dimension*）里，迈克尔·波兰尼（Michael
    Polanyi）一开始就做出了这样的观察：


    我们所知的，超出了我们自己的判断……潜水员的技能，不能用一套彻底的汽车理论知识来代替；我对自己身体的认识，完全有别于相关的生理学知识；韵律和诗体的规则，并不能告诉我一首诗到底在讲什么，而哪怕我对诗歌的规则一无所知，我也知道这首诗在讲什么。[\[11\]](#chapter001_0008.xhtml#m11)


    人所做的大量“智能活动”，我们是无法向其他任何人解释的，甚至也没法向自己解释。2014 年，经济学家保罗·奥图（Paul Autor）借鉴了这一观点，认为“事实证明，最难诉诸自动化的任务，就是那些要求灵活性、判断力和常识技能等人只能通过默契来理解的任务”。[\[12\]](#chapter001_0008.xhtml#m12)（译注：不过，奥图论述的对象并不是计算机。）


    他将之称为“波兰尼悖论”。波兰尼悖论最合适的一个例子就是面部识别。你知道丈夫的脸，你可以从 100 万甚至 10 亿张其他人的面孔里把它认出来。可对这些有关他的脸的知识，你自己并无意识，你甚至说不出他眼睛、鼻子和嘴巴的位置到底是什么样的。然而，无意识中，你的的确确能分辨出这张脸的整体。


    另一个例子，仍然与构建思考机器密切相关的，是语言本身。我们学习语言，不是靠的教语法和用字典。事实上，尤其是英语这种松散的语言，我们很多人基本上都意识不到它竟然还有正式的语法。我了解的大部分英语语法，都来自在学校里被硬塞给我的拉丁语。波兰尼悖论还有其他很多例子：骑自行车、酿酒、烤面包……我们可以在书本里读到它们的知识，但要是你想学会，就必须亲手做。


    波兰尼悖论还跟另一个矛盾观点有着紧密的联系，后一观点来自人工智能研究人员早些时候的发现。20 世纪 80 年代，汉斯·莫拉维克（Hans Moravec）、罗德尼·布鲁克斯、马文·明斯基等人确认了莫拉维克悖论的存在。[\[13\]](#chapter001_0008.xhtml#m13)莫拉维克对悖论作了这样的描述：“让计算机在智力测试或下跳棋等事情上表现出成年人的成绩水平相对容易，可在感知和机动性上，却很难赋予它们
    1 岁孩子都掌握的技能。”[\[14\]](#chapter001_0008.xhtml#m14)


    著名语言学家兼认知科学家史蒂芬·平克（Steven Pinker）称这是人工智能研究人员最重要的发现。[^(\[15\])](#chapter001_0008.xhtml#m15)他在《语言本能》（*The
    Language Instinct*）一书中写道：


    35 年人工智能研究路上的主要教训是，困难的问题容易，容易的问题难。4 岁孩子的心智能力，如识别面孔、举起铅笔、穿过房间、回答问题，我们视之为理所当然，实际上是在解决最为困难的工程设计问题。别受汽车广告里流水线上的机器人愚弄，它们所做的无非是焊接和喷漆，这些任务不需要笨重的机器人先生看见、举起或放置任何东西。而如果你偶然碰到一套人工智能系统，你问它像这样的问题：是芝加哥大，还是面包箱大？斑马是蹩脚内裤吗？地板会不会跳起来咬你？如果苏珊去商店，她的脑袋会跟她一起去吗？大多数对自动化的恐惧都放错了地方。随着新一代智能设备的出现，股票分析师、石油化工工程师和假释董事会成员恐怕会遭到机器的取代。园丁、接待员和厨师，未来几十年都能饭碗无忧。[^(\[16\])](#chapter001_0008.xhtml#m16)


    波兰尼悖论的反面是，我们难于实现自动化的任务，是那些计算机趋于增进人类而非取代人类的任务。从这一悖论出发，建筑工人相对安全。但他会变成一个使用起重机、挖掘机、钻孔机和其他工具成倍放大自己工作效率的“机器人”。


    或许，波兰尼的想法里并没有真正的矛盾之处。我们的大脑对数十亿年来的演变做了编码，我们的感知和反射经过了数百万代人的精密微调，高级意识思想降临得相对较晚。机器掌握一项任务的难度，或许只不过反映出人类演化用了多长时间才掌握它。


    ## 人为限制


    我们可能永远无法迎来思考机器的一个原因在于，我们说不定会制定法律，禁止制造。我们可能会认为开发某些机器的风险大于收益。又或者，我们允许制造它们，但对它们的行为方式加以限制。1942
    年，艾萨克·阿西莫夫（Isaac Asimov）提出了著名的机器人定律。


    ### 阿西莫夫定律


    1.机器人不得伤害人类，或坐视人类受到伤害。


    2.除非违背第一定律，机器人必须服从人类的命令。


    3.在不违背第一及第二定律的前提下，机器人必须保护自己。


    阿西莫夫称上述定律来自 2058 年出版的《机器人手册》（*Handbook of Robotics*）第 56 版。[^(\[17\])](#chapter001_0008.xhtml#m17)和许多其他领域一样，阿西莫夫的作品展现出了非凡的远见。到
    2058 年，机器人很可能在我们的社会中扮演关键的角色，我们必须为它们的行为设定伦理。很遗憾的是，阿西莫夫的故事表明，就连这样简单的定律也大有问题。[^(\[18\])](#chapter001_0008.xhtml#m18)如果机器人必须伤害一个人，以拯救其他若干人，该怎么办？如果采取行动和不作为都会伤害人类，该怎么办？如果两个人给出彼此矛盾的命令，该怎么办？即便如此，阿西莫夫仍然主张，应该带着对此类定律的思考来开发机器人：“每当有人问我，如果到了机器人足够常见、足够灵活，能够在不同行为方式中做出选择的那一天，真的用我的机器人三定律来监管机器人的行为，我会怎么看呢？我的答案早已酝酿成熟。”[^(\[19\])](#chapter001_0008.xhtml#m19)


    尽管阿西莫夫如此坚持，我还是保持怀疑态度。他的定律为什么不足以充当开发能与人类互动的机器人的机制，原因很多。他自己也承认，人类肯定并不完全理性。阿西莫夫定律既不准确，也不完整。准确地把所有我们想都想不到的场景都涵盖在内，恐怕是挑战最大的地方。谷歌在开发无人驾驶汽车期间，报告说它们的车碰到了一些极度怪异、完全出乎意料的情况。


    曾和图灵一起在布莱切利公园共事的英国数学家 I.J.古德（I.J.Good）[^(\[20\])](#chapter001_0008.xhtml#m20)提出了一条简单得多的定律。这条定律简洁而优美：“对待不如你的人，就像比你优秀的人对待你那样。”


    很遗憾，就连这条定律也能找到缺陷。机器人恐怕想要插上电源充充电，人类则不然。机器人一定要为了我们牺牲自己，哪怕我们不如它们。于是，后来的人只好试着把话说得更准确，限定条件也更多。2010
    年，英国资助人工智能研究的主要政府机构，工程与自然研究理事会（Engineering and Physical Science Research Council，EPSRC）召集了来自技术、艺术、法律和社会科学等领域的专家，为机器人界定一些根本性原则。


    ### EPSRC 的机器人原则


    1.机器人是多用途工具。除非是为了国家安全，设计机器人的时候，不应以杀死或伤害人为唯一或主要目的。


    2.人类是负责主体，而非机器人。在设计、操作上，只要切实可行，机器人都应遵守现行法律及基本权利及自由，包括隐私权。


    3.机器人是产品。在设计上，它们所使用的流程，应确保其自身安全可靠。


    4.机器人是工业人造物品。在设计上，它们不应以欺骗性方式来利用弱势用户；相反，它们的机器性质应当一目了然。


    5.对机器人负有法律责任者，应遭到追责。


    很难对这些原则表示异议。但有几个严肃的问题，它们仍未能解决（我们稍后要提到）。如果机器人能对自身行为进行学习，人怎么能够对机器人负有法律责任呢？如果机器人不是负责主体，那么，当自动驾驶汽车把我们的孩子从学校送回家，该由什么人来负责呢？对那些工作被我们设计的机器人夺走的社会弱势群体，我们怎么加以保护呢？这类的问题还可以继续列举下去。


    还有人继续尝试。2016 年，为全英国设定规格标准的国家机构，英国标准协会（British Standards Institution，BSI）公布了《BS
    8611》。这是一本 28 页的指南，论述怎样设计在道德上合乎理性的机器人，确定了一些道德危害，包括机器人欺骗、机器人上瘾，以及自学系统超出其职责的可能性。《卫报》将这套标准总结为：“不害人，不歧视。”其他国家和机构也正在跟进。全世界规模最大的技术专家组织，电气电子工程师学会（IEEE）就正在为下属的
    40 万开发人工智能系统的会员拟定类似的指导原则。


    ## 机器合作伙伴


    2016 年 9 月，谷歌、亚马逊、IBM、微软和 Facebook 宣布结成“人工智能伙伴关系，造福人类和社会”。该倡议的目标是规范人工智能技术的最佳实践，提高公众对人工智能的认识，充当探讨人工智能及其对人与社会影响的开放平台。该伙伴关系以下列宗旨为指导：


    ### “人工智能伙伴关系”的宗旨


    1.我们将努力确保人工智能技术为尽量多的人造福，也为其授权。


    2.我们将教育和倾听公众，积极调动利害关系人，了解他们对我们工作重点的反馈，告知他们我们的工作情况，解决他们的问题。


    3.我们承诺，就人工智能的道德、社会、经济和法律意义，进行公开的研究和对话。


    4.我们认为，人工智能的研究开发工作，需要大范围利害关系人的积极参与和负责。


    5.我们将与商界的利害关系人代表进行交流，帮忙确保具体领域的担忧与机遇得到理解，得到解决。


    6.我们将努力让人工智能技术带来的利益实现最大化，解决其潜在挑战，具体方式是：


    a.努力保护个人的隐私和安全。


    b.努力了解并尊重可能受到人工智能进步影响的各方利益。


    c.努力确保人工智能研究和工程社群，为人工智能给社会带去的大范围潜在影响承担责任，保持敏感，直接投入。


    d.确保人工智能研究和技术坚稳、可靠、值得信赖，按照安全规范运行。


    e.反对开发和利用违反国际公约或人权的人工智能技术，促进无危害的保障和技术。


    7.我们相信，出于解释技术的目的，人工智能系统的运作有必要得到人的理解，能向其进行说明。


    8.我们力争在人工智能科学家和工程师之间创造合作、信任和开放的文化，帮助我们更好地实现上述目标。


    还是那句话，“人工智能伙伴关系”提出的大部分原则，没什么好反对的。这一倡议还很年轻，很难知道它将怎样影响该领域的发展。它能保证负责任地开发可造福所有人的人工智能吗？但愿它不仅仅是一场公关活动。这些创始合作伙伴是从人工智能技术里受益最多的技术公司，它们存在明显的利益冲突。我有许多从事人工智能工作的同事都担心有太多的权力集中在这些巨头手里了。考虑到它们在税务安排、扫描书籍、游说国会等事情上的做法，这些公司的成功，不见得总是符合公众利益。


    ## 伦理限制


    思考机器提出了大量有趣的伦理挑战。自动驾驶就是急需解决这些挑战的领域之一。计算机正开始在我们的道路和高速公路上作事关生死的决定。假设你坐在一辆自动驾驶汽车上读报纸，两个孩子突然冲进了你前面的路上。汽车会决定撞上这两个孩子，还是跟对面车道上的车迎面相撞，还是撞上另一辆停着的车？计算机有几毫秒来决定采取哪种行动，而所有这些行动，都有可能导致人受伤或丧命。


    这种生死攸关的情景，伦理学家称为“有轨电车难题”（trolley problem）。你要在不同的方案之间进行选择，而选择的结果决定了谁生谁死。计算机兴许计算出，撞上两个孩子可能会害死他们，但安全气囊能把你救下来。计算机或许也计算出，跟迎面而来的汽车相撞，碰撞更猛烈，可能会害死你，也害死对面车里的乘客。最后，它可能还计算出，跟停着的车相撞，有很大概率会害死你。这个结果，死的人最少——但那个不幸的受害者是你。如果有一个孩子跑到路上，该怎么办？现在，要在你和孩子之间作选择。


    原版问题讨论的是一辆失控的轨道推车。前方的轨道上捆着五个人。你站在推车和人中间，身旁有个拉杆。如果你拉动它，推车将切换到旁边的轨道上，但那条轨道上绑着一个人。你有两种选择：要么什么都不做，推车在主轨上撞死
    5 个人；要么你推动拉杆，把推车推上侧轨，撞死一个人。你会选择怎么做？推车问题有许多改编版本，如把人推进推车所在的轨道，从一个人身上移植器官拯救多人性命，受害者的结局是关起来而不是撞死。这些改编版本暴露了作为与不作为、直接效果与可能出现的副作用之间的伦理差异。


    尽管手推车问题引起了广泛的关注，但就开发符合伦理道德的自动驾驶汽车而言，它只占了问题的一小部分。人们还要面对其他许多伦理问题，这些问题里有不少都会出现得更为频繁。人类驾驶员是经常违反法律的。我们闯黄灯，我们占用人行道，我们会超速来摆脱危险路况。自动驾驶车辆能否以这种方式违反法律呢？如果可以，违反到多大程度合适呢？另一个引发热议的伦理问题是，我们是否应该开发一套系统，让人类驾驶员临时收回控制权呢？有证据表明，人类很难做到这一点，甚至可能没办法迅速重新获取背景认知。我们该怎样保护自动驾驶汽车有可能难以感知的其他道路使用者（如骑自行车的人，行人等）呢？自动驾驶汽车是否应该加上明确的标识，好让其他道路使用者保持恰当的谨慎态度来对待它们？我们应该为自动驾驶车辆准备专用车道吗？如果有一天，自动驾驶汽车变得比人类操纵的汽车更安全，还应该允许人类开车上路吗？


    未来 10 年，观察社会怎样适应自动驾驶汽车，怎样迎接它们带来的挑战，一定非常有趣。将来我们应该怎样应对人工智能提出的其他道德挑战，自动驾驶汽车领域有可能充当试验田。目前的证据只能说明，我们正梦游着走进这一光明的未来。在我看来，大多数政府对自动驾驶车辆所采取的立场，是把太多的责任都交到了开发相关技术的公司手里。可以理解，各国都不希望扼杀进步，也都想要从价值数万亿美元的自动驾驶车辆制造产业里分一杯羹。眼下的汽车巨头，如通用、福特和丰田，不见得能在这场比赛中赢得了特斯拉、苹果和
    Nvidia（英伟达）等后来者。同样地，让自动驾驶汽车上路，在伦理道德上势在必行，它们每年能避免数千人因交通事故丧生。但在这股匆忙往前跑的势头里，我们务必要谨慎。


    空中交通是一个很好的类比。在 100 年前这一技术的萌芽岁月，飞行很自由，事故司空见惯。飞行很危险，只有勇敢的人才敢飞。但政府很快就插手进来，对飞行本身和飞机制造商进行监管，设立了从事故中学习的机构。政府颁订法律规范飞行及飞机标准。如今，飞行成了最安全的交通方式之一。自动驾驶汽车也应以这样的终点为目标，但在我看来，要是政府不强调监管，我们恐怕达不到目的。


    我们不允许制药公司随心所欲地在一般公众身上检测产品。同样，我们也不应该让技术公司在没有强力监管的情况下，随心所欲地在公路上测试自动驾驶车辆。制药公司还不得随心所欲地改变产品。那么，我们为什么会允许汽车厂商自动上传未经验证的软件更新呢？只要具备商业可行性，任何道路测试中所学到的教训，都应与其他开发商共享。国家或国际机构需要调查自动驾驶车辆所卷入的事故原因，每次碰撞都能为自动驾驶车辆带来进步。


    ## 算法歧视


    另一个非常切近的伦理挑战是算法歧视。算法有可能有意无意地歧视特定社会群体。谷歌等公司一直在鼓吹算法很好、算法不歧视的神话。[^(\[21\])](#chapter001_0008.xhtml#m21)谷歌的行为准则开篇就说：“我们会尽力为用户提供不偏不倚的信息，关注其需求，为之带去最优秀的产品和服务。而他们为你提供不偏不倚信息的途径，就是靠盲目挑选最优结果的算法。然而算法真的有可能歧视，尤其是如果这些算法是从数据中学习的。

    '
