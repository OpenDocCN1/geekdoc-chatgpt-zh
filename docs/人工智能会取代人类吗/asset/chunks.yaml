  trans: '


    低估新技术引诱我们的速度很容易。10 年前，你或许买了自己的第一款智能手机。你恐怕没料到这种设备会在我们的生活里变得这么重要。[^(\[2\])](#chapter001_0011.xhtml#m2)智能手机基本上取代了日记、相机、音乐播放器、游戏机、卫星导航仪和其他许多设备。据估计，如今全世界有
    20 亿部智能手机。放眼全球，1/3 以上的人都拥有智能手机——真不赖，毕竟地球还有一半的人生活在贫困线，每天收入不到 2.5 美元。出于类似道理，对自动驾驶汽车将带来的变化，我们也很容易低估其速度和程度。


    首先，自动驾驶汽车将从根本上改变道路安全性。每年，世界各地有超过 100 万人死于交通事故。光是在美国，每年就有 33000 人死于道路交通事故。想想看吧，如果每星期都坠毁一架满载乘客的波音
    747，我们一定会呼吁改善航空公司的安全性。美国运输部统计，95%的汽车事故是驾驶员失误所致。我们开得太快，我们酒醉驾车，我们开车时发短信，我们跟着收音机摇摆，我们冒了本不应该冒的险。如果我们把人从这一恶性循环中带出来，就能让道路变得更安全。事实上，汽车制造商沃尔沃就认为，要想在
    2020 年实现道路交通事故零死亡率这一雄心勃勃的目标，瑞典只能走这条路。


    自动驾驶车辆还将从根本上改变交通运输的经济性，以及我们获取的方便性。小孩、老人和残疾人士等群体将首次获得个人机动性。此外，运输成本也将下降。世界经合组织对葡萄牙里斯本的运输需求进行过一项研究，认为如果使用自动驾驶汽车的话，只需要
    10%的车辆，全城就可享受与今天相同的交通水平。


    其实，我们的大部分道路是用来存放汽车、等候我们派遣的。据估计，一个城市大约有 1/3 的汽车正兜兜转转，寻找停车位。因此，想想看，如果我们消除这个问题，我们的城市会变得多宽敞呢？我们工作时，可以把车派出去当出租车赚钱。甚至有不少人会放弃拥有私人汽车。汽车是我们花很多钱购买的第二贵重的资产（最贵重的当然是住宅），但它大部分时间都停在路边，慢慢生锈。为什么不直接购买自动驾驶汽车共享公司提供的服务呢？


    因此，一旦自动驾驶汽车普及，将为我们带来巨大的利益。事实上，这一幕来得很快。新加坡于 2016 年 8 月开始试行自动驾驶出租车。同一个月，福特宣布打算在
    5 年内销售一款完全自动驾驶的汽车。还是在 2016 年 8 月，赫尔辛基在公共道路上试运行了一个月的自动公交。一个月后，Uber 开始在匹兹堡试行自动驾驶出租车服务。2016
    年 9 月，无人驾驶公交行驶在里昂和珀斯的街道上。开发、销售自动驾驶汽车的竞赛显然已经拉开了序幕。


    15 到 20 年之内，自动驾驶汽车有望承载我们大多数人，这将改变我们的日常通勤。我们可以把通勤时间用来看电影、看书或写电子邮件。我们不再浪费时间在车上，而是将之用来工作或休息，这将为我们的城镇腾出更多空间。许多人说不定愿意住得更远些，搬出越来越贵的城市中心。


    随着自动驾驶汽车越来越便利可得，我们在实际驾驶上所花的时间会越来越少。我们会让机器去承担奔波的辛苦。这样一来，我们会逐渐丧失驾驶技能。由于道路变得愈发安全，我们很多人会发现，自己的驾驶执照提前过期了——这也是为了我们自己的安全好。许多年轻人永远无须费事学开车。他们会招来一辆自动驾驶的
    Uber，想去哪儿就去哪儿。到 2050 年，公元 2000 年会显得古朴但落伍，就如同 1950 年，人们回首 1900 年马拉车时代所产生的感觉。我们不再驾驶汽车，但我们不会注意到，甚至也不在乎。


    ## 预测之二：你每天都看医生


    到 2050 年，你每天都从医生那里得到医学建议。不是只有疑病症患者会这么做，而是我们几乎所有人都这么做。那位医生，就是你的计算机。今天的技术基本上已经能这么做了，只是尚未得到很好的整合。


    你的健身手表将自动检测许多重要身体指标：脉搏、血压、血糖水平、睡眠和锻炼情况。如果你晕倒了，它会留心你跌倒，打电话叫人来帮忙。你的厕所会自动进行尿液和粪便分析。你的智能手机会定期为你拍照，以便更好地了解你的健康状况。比方说，它会识别出可疑的皮肤黑素瘤，监测你的视力健康。


    计算机还将寻找阿尔茨海默病的早期征兆。它将记录你的声音，辨别暗示感冒、帕金森氏症甚或中风的迹象。所有这一切，都将由一款人工智能程序对你进行终身监控，从各个传感器每天记录你的健康情况，诊断许多简单的健康问题，如果碰到较大的问题，就打电话叫专家。


    到 2050 年，我们不少人会去进行基因测序，识别遗传风险。到那时候，基因测序便宜又容易，许多人还在妈妈的子宫内就测序完毕了。跟踪你健康情况的人工智能医生可以调取该基因序列，观察你容易患上哪些疾病，这将为医疗保健创造出一个更为个性化的新层面。这将是一桩价值数万亿美元的生意，因为几乎人人都想要活得更长。未来
    30 年经济增长的很大一部分，将用于实现这一梦想。私人人工智能医生将掌握我们的生活史，比任何一名医生对医学知识都更了解，而且还能随时跟进所有新出现的医学文献。


    我们希望，不光是发达国家的民众能从这些变化中受益，部分第三世界国家的民众，如今甚至会死于一些我们可以用最低成本进行治疗的疾病，人工智能可以为这些患者提供诊断工具。想象一下，如果第三世界的每座村庄都有一台智能手机，可以提供跟看全科医生所得同等质量的医疗建议，那会是怎样一番情形呢？


    ## 预测之三：玛丽莲·梦露重返银幕


    其实，不光只有玛丽莲·梦露能拍新片了，你自己也能参与这些电影。当然，那不是真正的梦露，而是一个虚拟化身，按照程序像她那样说话和行动。这样的电影是全面互动的，故事发生在哪里，取决于你做什么或说什么。好莱坞和计算机游戏产业将合为一体。电影让我们沉浸在超现实世界里，电影摄制、虚拟和增强现实，以及计算机游戏统一成为娱乐行业。


    另一方面，人们会越来越担心真正的现实跟虚拟及增强现实的融合。我们将越来越多的时间花在不存在也不可能存在的世界里，这些虚幻世界将非常诱人。置身其间，我们全都可以是富豪和大明星，我们全都可以美丽又聪明。两相对比，现实世界就愈发令人不快了。那时可能会出现一个沉迷于到虚拟世界逃避现实的下层社会，人把清醒着的每分钟都用到虚拟世界去了。由于这些虚拟世界并不真实存在，还将出现一些人，他们寄居在虚拟世界只是为了去做一些现实世界不可接受的事情。会有人呼吁，现实世界里的违法行为，在虚拟世界也应当是违法的或不可能实现的。还会有人反驳说，虚拟世界就是为了向人提供必要的减压阀。这个问题很可能会给我们的社会造成巨大困扰。


    ## 预测之四：计算机能聘请你，也能炒了你


    老实说，如果谷歌总部里某个黑暗角落，是计算机正忙着招聘解聘员工，我毫不惊讶。我们已经相信它们能帮人匹配合适的配偶，这可是人一辈子要做的最重要抉择之一呢。实际上，有观点认为，把人和工作岗位匹配起来，难度低于把人们彼此匹配起来。资历和过往经验是人能否适应新岗位的良好指标，但要判断人是否适合一段亲密关系，就很难获得类似的客观证据了。


    然而，计算机不会止步于作出招聘或解聘决策。在你受聘上岗期间，计算机还将接管诸多管理你的任务。程序将为你的活动进行时间安排，批准你的假期，监控和奖励你的绩效。高管可将计算机释放出来的这些时间，更多地用于追求公司的战略及长期目标（至少应该这么做）。2016
    年 12 月，全球规模最大的一家对冲基金（管理着超过 1000 亿美元的资金）桥水联合（Bridgewater Associates）宣布了一项自动化公司日常管理（包括招聘、解聘及其他战略决策）的项目。该项目由大卫·费卢奇（David
    Ferrucci）主持，他以前曾负责 IBM 旗下“沃森”的开发工作。


    类似这样的项目，提出了一些道德问题。我们应该把招聘和（尤其是）解聘决策交到计算机手里吗？在哪些地方授权机器作出决策，尤其是那些能从根本上影响人们生活的决定，我们需要划出界限。我小时候很喜欢科幻小说作家阿瑟·克拉克，他的预言式写作激发了我开发思考机器的渴望。说到赋予机器解聘人类的职责，我很想引用他在《2001
    太空漫游》里说过的一句名言。我们必须学习什么时候对电脑说：“对不起，我不能让你这么做。”对机器而言，能比人更好地完成一项任务，这还不够。有一些决定，我们就是不应该交给机器去做。


    ## 预测之五：你对着房间说话


    让我做一个更积极的预测。你会走进一间房，大声说：“开灯。”接着你或许会问：“我接下来的安排是什么？”或者，“昨天晚上的足球比赛谁赢了？”你指望房间里的某样东西作出回答，可能是电视、音响，甚至冰箱。无论是哪种设备，它都能利用你的声音模式，验证你的私人日记访问请求，琢磨出你是谁，并理解你想查询的足球比赛是哪一场。


    少数人会加以抵制，有意识地效法不联网的 19 世纪式生活。但我们大多数人会喜欢让家里所有设备都联网带来的优势。我们的冰箱、烤面包机、烧水壶、浴室、门锁、灯、窗户、汽车、自行车和花盆都将上网连线。到
    2020 年，预计将有超过 2000 亿台设备接入“物联网”。每个活着的人都拥有数十上百台设备。由于不少此类设备并没有屏幕，口头语言就成了天然的界面。


    物联网背后的操作系统，是人工智能。过去几十年，计算机的操作系统，也就是你和硬件之间的软件层，发生了显著变化。最开始，用户必须跟物理硬件交互，按下开关，连上插头。为了让机器运作起来，你必须理解机器在什么样的硬件上运行。但在那之后，操作系统让我们越发轻松地与计算机交互了。


    到 20 世纪 70 年代，计算机不再那么“极客范儿”了。我们许多初露头角的程序员都开始在 MS-DOS、CP/M 和 Unix 等命令行系统中获得经验。你键入的命令差不多是有意义的，比如`cp`即可复制文件。到
    20 世纪 80 年代，计算机转为使用诸如 Mac OS 和 Windows 之类的图形界面，你可以移动鼠标并点击。要删除文件？把它拖进垃圾桶，一切再简单不过了。计算不再是极客的专属品了，任何有鼠标的人都能做到。


    20 世纪 90 年代，计算之间的联系变得更紧密了。互联网起飞，浏览器称王。事实上，谷歌已经制造出了一整套操作系统，也即 Chrome OS。再近一些时候，计算嵌入了移动设备，专注于智能手机应用程序。下一场革命将是对话式操作系统。谷歌助理、苹果的
    Siri 及其继任者，将成为这些全新操作系统的基础。不需要再打字，也不需要指指点点，你只需说话，设备（借助云端）便将为你执行复杂的任务。


    于是，我们与设备交流的界面消失了，替代它的将是对话。随着我们从一个房间进入另一个房间，从房间进入汽车、进入办公室甚至躺到床上，这些对话将继续下去。谷歌、微软、Facebook
    和亚马逊等公司恐怕会是未来的赢家，因为网络效应极为庞大：我们希望这些对话可以贴身跟随自己。但也会有输家。我们的隐私、多元化和民主将面临挑战。每个房间都能听到我们的话，国家安全局和其他情报机构再乐意不过了，营销人员也喜欢看到我们日常生活的所有数据。所以，下一次如果有人要你检查自己的隐私设置，仔细想想自己可能放弃了些什么吧。


    ## 预测之六：机器人抢银行


    到 2050 年，会有一家大型银行遭到机器人抢劫，它不是破门而入，或是从天花板上垂降下来；它会是“软件机器人”，以电子方式偷偷摸摸地进入银行系统；它能叫数亿美元凭空消失。迄今为止，许多网络犯罪的技术水平还相对较低。攻击者从不知情的用户那里窃取密码，恶意软件要靠防范意识不强的员工点击可疑链接来下载。人工智能将改变这场博弈，但此事有喜也有忧。会出现更智能的软件保卫系统。但随着攻击越发智能，防御软件不得不加快升级的步伐。


    2014 年，DARPA 发起了网络超级挑战赛，开发能够实时自动发现、纠正软件缺陷的防御系统。2016 年 8 月，来自卡内基梅隆大学的梅姆团队（Mayhem
    team）在全球规模最大的年度黑客大会 DEFCON 24 上获胜，夺得 200 万美元的奖金。此次年度黑客大会共有 7 支队伍参加，共计 96 轮比赛。这是一场热门黑客游戏，团队必须保护自己的数据，同时尝试访问其他团队的数据，只不过，这一回，参赛团队不是人类而是自主程序。之后，梅姆又在
    DEFCON 24 上跟人类黑客一较高下，得了最后一名（虽说它曾短暂领先过几个人）。但到 2050 年，我不敢打赌人类还能赢。人工智能黑客能比人类黑客速度更快、更彻底地运转，而你唯一的防御也只能是人工智能程序。


    DARPA 为这次网络超级挑战赛投入了数百万美元。对自主网络防御，他们的着眼点主要不在于民用目的。战争正转入网络空间，美国军队需要保持领先地位。但民用领域也会迅速发展同类技术。据说，俄国人为了影响美国
    2016 年的总统选举发起了黑客入侵，已经示范了此类网络攻击带来的冲击力。防御系统采用人工智能获得的诸多优势，攻击系统很快就能学到，这是一大挑战。银行别无选择，只能投资于越来越复杂的人工智能系统来抵挡攻击。


    ## 预测之七：德国队输给机器人队


    这项预测的第一部分是，2050 年，德国将再次在足球世界杯上夺冠。迄今为止，德国人已经夺得了 5 次世界杯冠军，比巴西少一次。但跟巴西人不同，他们的球星还处于上升期。作为
    2050 年的世界冠军，他们要参加一场表演赛，结果会输给一支机器人队伍。


    相较于人类，机器人具备大量优势。它们拥有超一流的球技，它们能以更准确的速度传球，它们每次都能扑出罚球，它们随时都能知道其他队友的准确位置。它们会观看历年来录制下来的每场世界杯比赛和预选赛，了解比赛策略，将这些知识运用起来，获得极大优势。就类似
    2014 年德国队和巴西队在半决赛上相遇，德国队以 7 比 1 的比分大幅获胜。就算是机器人队的球迷，也会请求给人类足球队选手叫暂停。


    足球运动员不必担心这场表演赛的结果如何。大多数足球队仍然会由人类球员组成。没有太多人想看机器人跟机器人打比赛，尤其是等机器人比人类踢得更好的时候。但人工智能将改变人类足球及其他大部分比赛。教练和球员都会依赖机器学习和优化算法，更好地训练球员，为打比赛提供更好的策略建议。数据科学家将成为足球俱乐部薪水最丰厚的部分成员。来自曼彻斯特联队的球探会到牛津大学、帝国学院和爱丁堡大学等地溜达，招募有潜力的年轻计算机科学家。


    ## 预测之八：全球各地穿梭着无人驾驶的船只、飞机和火车


    到 2050 年，完全没有人操控的船只、飞机和火车，将穿梭在全球的海洋、天空和轨道上。牛津大学的研究认为，船长、大副和飞行员的自动化概率仅为 27%。我怀疑这太低了。在
    2016 年，劳斯莱斯海事分公司的总裁预测：“自主航运是海运业的未来。智能船舶的破坏性一如智能手机，将彻底改变船舶设计和运营的格局。”


    对卡车或飞机来说，有些决定需要在分秒之间作出，但在船上，时间就长得多了。因此，事实有可能会证明，自主操纵船只比驾驶汽车或飞机更容易。除了安全性提高之外，自动驾驶还将带来明显的效益。现今用于搭载船员的空间，可用来堆放货物，船只永远不需要等待新船员的到达。运营成本将会下降，就跟无人驾驶的卡车一样。


    到 2050 年，还将出现大量的自主货机。和道路不同，空域是受到严格管制的。这样一来，将任务转为自动化执行会更容易。此外，飞机本身的自动化程度就很高，只需要很短的时间就能完全消除人类的存在。货机不用考虑乘客的性命安危，监管机构很快就能批准这一自动化转型。另一方面，载人飞机可能会继续由人类驾驶。但等货机安全飞行数十年，想来会出现一场场辩论：航空公司的飞行员仍然需要由人类担任吗？


    如今，许多轻轨、城市及地铁系统采用了自主运行。长途铁路自动化更具挑战性，需要用几十年时间转型。英国力拓集团（Rio Tinto）正在开发世界上第一套完全自主的重载远程铁路系统，运输产自西澳大利亚皮尔巴拉地区的铁矿石。2014
    年，力拓就开始测试它的 AutoHaul 技术。2016 年，该技术仍然存在部分问题，但等到 2050 年，应该早已解决。届时，大量其他长途铁路也为自主运行。例如，德意志银行计划在
    2023 年之前运行长途自动驾驶列车。自主轨道交通，将带来更大的安全性，提升吞吐量。所以，以后的小孩子们不再希望长大后成为火车司机，许多人甚至会忘了人类也曾驾驶火车。不过，老年人还是挺怀念列车由人驾驶的岁月——就跟我们如今回望蒸汽机车的年代一样。


    ## 预测之九：电视新闻不再由人类制作


    到 2050 年，会出现一套无人参与制作的夜间电视新闻节目。其实，和我的其他一些预测一样，这条预测的近乎所有部分已经就绪了。只不过，还没有人把所有东西都整合到一起。让我们从记者撰写新闻的这部分工作入手吧。前面，我介绍过计算机自动撰写简单的体育和金融消息。随着技术的进步，计算机还将撰写出更复杂的故事。


    接下来是新闻编辑的工作，判断跟踪哪些新闻，播放哪些新闻，怎样放到节目里。2016 年的里约奥运会上，《华盛顿邮报》试用了 Heliograf 系统；它使用人工智能来自动编辑报纸的新闻博客。在未来的
    35 年里，这些系统将普遍应用到平面媒体、电视和电台新闻编辑室。


    接下来，我们转到主持人的工作上：播报新闻。我在前文介绍了 2014 年日本研究人员开发的两台新闻播报机器人。最近，上海东方电视台开始尝试用微软的一款聊天机器人播报早间新闻节目的天气预报环节。最后是摄像师的工作，也即负责拍摄新闻的人。许多摄影棚现在都使用机器人摄像机来完成这项工作了。


    随着新闻机构降低成本的压力越来越大，新闻节目最终完全无人制作的情况似乎不可避免。以这种方式制作出的节目，跟我们今天看广播新闻所期待获得的产品价值是一样的。但它将成为“窄播”，也就是说，我们每个人所观看的新闻节目将按照自己的特定喜好量身定制。


    媒体老板会很喜欢无人新闻编辑室（尤其是再没有了昂贵的新闻播报员）带来的经济性，但人们将就算法偏倚继续展开辩论，尤其是届时人类已经不再自行判断想要看什么新闻。我们观看世界的镜头和角度，塑造了我们的观点。这些算法会向我们提出足够的挑战吗？它们真的关心我们所关心的东西吗？它们能够充分理解谎言和欺骗吗？我们哭泣时，它们会哭吗？又或者，它们给我们带来的娱乐，比以前我们自娱自乐时效果更好吗？


    ## 预言之十：我们死后继续“活”下去


    用这一预测来作为结束似乎很合适。其实这仍然离今天的现实不太远。在 2016 年，尤金妮亚·库伊达（Eugenia Kuyda）用自己最近过世的朋友罗曼·马祖连科（Roman
    Mazurenko）的文本训练了一款聊天机器人。罗曼的一位朋友说：“真正叫我吃惊的是，它说话的措辞完全跟他一样。你可以判断那就是他在说话。”罗曼的母亲补充说：“我对自己的孩子有太多不了解的地方。但现在，我可以读到他对不同主题的想法，我反而越来越熟悉他了。这带给我一种他此刻仍然在世的错觉。”


    到 2050 年，人过世后留下这样一款人工智能聊天机器人会成为普遍现象。它会像你一样说话，知道你过去的故事，在你死后安慰你的家人。有些人或许会给自己的聊天机器人布置任务：读出遗嘱，分配遗产。还有些人有可能会利用这个机会来解决一些私人的“往日恩怨”。还有很多人会十分谨慎，尽量避免引发更多的悲伤。事实上，我们中甚至会有人给自己的聊天机器人编程，用幽默来化解这一刻的哀痛。


    这些“数字分身”还将代替活人出场。名人将使用聊天机器人来创建社交媒体账号，在 Facebook 上回复信息，发推文回应新闻事件，到 Instagram 发布照片和视频。我们中许多人会把生活的各个方面交托给此类的聊天机器人，它们会管理我们的日记，组织会议和社交活动，回复电子邮件。


