- raw: '有一条安在谷歌首席经济学家哈尔·范里安（Hal Varian）头上，但实际上出自安德鲁·麦卡菲（Andrew McAfee）的规律这样指出：“预测未来的一个简单办法是观察今天的富人拥有些什么；中等收入人士在未来10年里能拥有同等的东西，而穷人则再过10年也能拥有。”如今的富人让私人助理帮忙管理自己的生活，到了未来，我们其他人将得到数字助理的帮助。如今的富人有私人司机，到了未来，我们中的许多人可以开上自动驾驶汽车。如今的富人有家族财富管理办公室管理资产，到了未来，我们其他人将让机器顾问管理自己极为有限的资产。


    范里安提出的规律表明，今天的富人能享受到的隐私待遇，我们其余人日后也能享受到。在我看来，有这样的可能，但可能性并不大。我们已经能够通过非常强大的加密技术保护自己的电子邮件和语音邮件。但我们大多数人根本懒得费这个心，我们使用的许多“免费”服务实际上就是靠我们的数据来“买单”的。如果你不花钱，你就是产品，这对算法而言一点儿也不假。


    对身前身后的生活进行数字外包，这必将引发激烈的辩论。要是有人工智能假装成你，你该采取什么样的补救措施呢？我们有权知道跟自己互动的是一台计算机而不是一个人吗？政治对话是否应该禁止使用人工智能机器人？


    2016年的美国大选为我们提供了一个前瞻的机会，观察此类技术会把我们带到什么地方。此外，它还提出了其他许多令社会不安的问题。比方说，你死后，谁能关掉你的人工智能机器人？如果你的机器人煽动种族主义或性别歧视，该由你负责吗？这类机器人享有言论自由吗？未来会很有意思的。


    * * *


    [\[1\]](#chapter001_0011.xhtml#w1) 见\[参考书目21\]。


    [\[2\]](#chapter001_0011.xhtml#w2) 第一代iPhone手机2007年上市。10年前的1996年，诺基亚9000 Communicator上市。黑莓6210手机也要到2003年才出现。


    # 尾声


    我希望这本书能够就人工智能来自哪里，今天走到了什么地方，未来将带着我们走向何处等问题给予一定程度的解答。站在21世纪末回首今天，我们想必会把思考机器的开发视为人类最伟大的科学成就之一。这将是一场冒险，和我们过去尝试过的其他所有冒险一样大胆，一样充满雄心壮志。一如哥白尼革命，它将从根本上改变我们对自己在宇宙中的定位。这甚至可能是我们最后一次伟大的冒险，在那之后，思考机器有可能接管我们推进知识疆域的冒险工作。


    思考机器说不定是我们留给后世最大的遗产，能给人类生活带来如此重大影响的发明并不多。思考机器将掀起一场社会革命，堪与工业革命相媲美。蒸汽机释放了我们的肌肉，计算机将解放我们的头脑。我们的生活几乎没有任何一部分，不受这场革命所冲击，它将改变我们的工作方式、玩耍方式、教育孩子的方式、治疗患者的方式、照料老人的方式。


    当今世界面临许多挑战：全球变暖、全球金融危机的持续（可能永无止境）、全球反恐战争、新出现的全球难民问题。我们所有的问题好像都是全球性的。人工智能又新增了一项挑战，它威胁着我们的工作岗位，从长远来看，甚至威胁着人类的延续。但我们也应该牢记人工智能的潜力，思考机器说不定有能力帮助我们解决一些重大挑战。


    这带来的结果最终是好是坏，在很大程度上取决于社会本身怎样适应人工智能技术。这既是科学家和技术人员的任务，也是政治家、剧作家和诗人的任务。在天鹅绒革命中，剧作家瓦茨拉夫·哈维尔（Václav
    Havel）出力对捷克斯洛伐克做了天才的引导。我们将需要拥有这般眼界、拥有如此远大志向的人指引我们完成这场信息革命。


    这些变化可能会带来许多严肃的挑战。最严肃的挑战或许是经济层面的。如果无人把关，思考机器将把财富集中到最方便接触此类技术的少数几家公司和个人手里。托马斯·皮凯蒂（Thomas
    Piketty）等经济学家已经提出了一个强有力的例子：如果资本回报率超过经济增长率，资本主义经济中的不平等现象就会加剧，在我们经济史的大多数时段，情况都是如此。全球化和全球金融危机等其他发展趋势，也为不平等现象加剧出了力。除非我们采取纠正措施，否则，人工智能只会进一步加剧不平等，把财富集中到少数人手里。


    向大众说明未来可能会是什么样子，是科学家的一大责任。如本书所述，人工智能可以带来许多美好的未来，它能让我们更健康、更富有、更快乐。许多批评者说得也没错：人工智能或许会带来糟糕的未来，它可能会破坏许多人的生计，让战争打得更激烈，剥夺我们的隐私。然而，未来并非必然。如果我们什么都不做，结果可能不会好。很明显，在这一历史关头，许多力量正推动我们朝着不利的方向走。地球在变暖，不平等在加剧，隐私遭到侵蚀，我们现在必须采取行动扭转这些趋势。现在还不算晚，但也没有时间可以浪费了。


    从社会的角度来说，我们必须对一个重要问题作出决定：我们应该把哪些决定交托给机器？我们可以把许多决定交给自主技术。有些技术能让我们的生活变得更美好，提高生产力，改善健康，增强幸福感；但有些技术却会让我们的生活变得更糟糕，增加失业率，削弱隐私空间，挑战人类的道德观。就算机器能够作一些比人类更出色的决定，我认为，始终有一些决定是不能放手给机器的。技术是一种奇异的外来侵扰之物，我们应该只欢迎那些能丰富我们生活的技术。


    我想，用拉开本书序幕的人的话来结束本书再恰当不过了。1951年，艾伦·图灵在BBC三台（BBC’s Third Programme）的一套节目结束时说：


    关于这一主题的讲演或文章，习惯用这样一句话来向人表示安慰：也就是某一具体的人类特点，机器永远无法模仿……这样的安慰我给不了，因为我相信，这样的界限定不下来……但我也相信，努力制造一台思考机器，极大地有助于我们洞察自己怎样思考。


