  trans: '


    调查中还有一大群人（贡献了 42 份回复），来自所谓的“人工智能哲理”（PT-AI），他们是穆勒在牛津主办的人工智能哲学及理论大会的参与者。本次大会的参与者包括两位主流人工智能研究人员，斯图尔特·罗素和亚伦·斯洛曼（Aaron
    Sloman）。然而，其他许多参与者都是不折不扣的哲学家：丹尼尔·丹尼特（Daniel Dennett），此外就是穆勒和波斯特洛姆本人。这些人在开发人工智能系统、解决大量实际挑战方面几乎没有经验。这两群人（来自通用人工智能和哲理人工智能领域），贡献了调查总回复的
    2/3 以上。说他们的回答代表了主流或顶尖的人工智能研究员，是颇为可疑的。


    为叙述的完整考虑，请让我介绍一下接受调查的第 4 群人，也是最后一群人，他们是希腊人工智能协会的 26 名会员。如今，希腊在计算机科学好几个领域都有很强的实力，其一是数据库。但如果我说，人工智能领域走在前头的是其他国家，如美国、英国、德国和澳大利亚，希望我的希腊同事别生气。此外，这
    26 名受访者只占希腊人工智能协会的 10%，他们是否算是主流或顶尖人工智能研究员的代表性样本，同样存疑。综上所述，各位读者应该谨慎看待穆勒和波斯特洛姆的调查结果。


    最近进行的一项调查，恐怕更好地揭示了从事主流人工智能的研究人员是怎么想的。2016 年，人工智能进步协会（Association for the Advancement
    of Artificial Intelligence，AAAI）的 193 名研究员接受了调查。入选这一协会，是人工智能领域的一项最高荣誉。该协会只针对数十年来在人工智能领域做出了重大和持续贡献的人士。研究员仅占该协会会员的不到
    5%，故此，把这样一些人称为“顶尖人工智能专家”是恰如其分的。人工智能进步协会的 193 名研究员里，有 80 人对调查作了回复（41%），其中包括领域内的许多知名人物，包括杰夫·辛顿（Geoff
    Hinton）、埃德·菲恩鲍姆（Ed Feigenbaum）、罗德尼·布鲁克斯和彼得·诺米格（Peter Norvig）。[\[15\]](#chapter001_0006.xhtml#m15)跟穆勒及波斯特洛姆的调查不一样，1/4
    的受访者预测，超级人工智能永远不会实现，另外 2/3 的人预测要花 25 年以上的时间。总体来看，9/10 以上的受访者指出，超级人工智能要到自己退休年龄之后才能出现。[\[16\]](#chapter001_0006.xhtml#m16)这一预测结果比穆勒及波斯特洛姆的调查更为悲观。不过，在人工智能领域，有合理数量的专家认为
    21 世纪内存在机器能跟人一样思考的可能性。


    ### 前面的路

    就算思考机器能在 2100 年出现，离那一天的到来仍有相当漫长的路要走。2016 年，纽约市顶尖人工智能大会主办了首次威诺格拉德模式挑战赛。还记得吗，这是图灵测试的拟议替代挑战之一，目的是检验计算机的常识和其他类型的推理能力。获胜程序的准确率达到了
    58%，最多算得上 D 等成绩。[\[17\]](#chapter001_0006.xhtml#m17)虽然胜出程序的表现比人随机投掷硬币要好，但跟普通人
    90%的正确率（人类在这种测试中一般都能达到这一水平）还差得有点儿远。


    那么，我们在思考机器的道路上到底走了有多远呢？如果你把报纸所有跟思考机器进度相关的内容都加起来，或是你相信较为乐观的调查，你大概以为我们比实际上走得要远。


    好吧，对人工智能的过去就介绍到这里。在本书的下一部分，我将转向人工智能的现状。我将详细介绍我们今天在思考机器的道路上走了多远，此外，还会谈一谈思考机器未来发展有可能存在的限制条件。


