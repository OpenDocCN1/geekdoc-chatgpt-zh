- raw: '这类物体识别技术已经变得足够主流，各类应用软件都能够自动识别物体了。诺基亚的“拍立寻”（Point and Find）程序能自动识别建筑物、电影海报和各类产品。另一款应用程序“谷歌眼镜”（译注：原文为“Google
    Goggles”，这是一款手机拍照识别程序，真正能佩戴的“谷歌眼镜”对应的英文是“Google Glass”）能识别出纽约大都会艺术博物馆的76000件不同艺术作品。此外，微软的“必应影像”（Bing
    Vision）可以识别书籍、CD和DVD（但这款软件现在已经停止开发了）。


    面部识别是计算机视觉中的一个专业领域，进展也不错。面部识别软件目前对正面图像的效果很好，但要是你转向侧脸，它就变得纠结了。光线欠佳，戴着太阳镜，留着长发甚至露出微笑，也可能对它提出挑战。不管怎么说，根据标准的“户外面部检测”数据库（内有收集自网络的13000张图像），诸如谷歌FaceNet等最先进的系统可达到99%以上的准确率，这对“老大哥”来说可能就够好了。还是那句话，深度学习在达到如此水平的准确性上发挥了重要作用。


    光学字符识别（Optical character recognition，OCR）是人工智能不为人所知的另一个例子。OCR识别的第一项专利可追溯到1929年，到20世纪50年代，OCR机器首次出现在商业领域。今天，你购买的任何多功能打印机都会为扫描仪捆绑某款不错的OCR软件。OCR基本上是一个已得到解决的问题。对于拉丁印刷字母，OCR识别准确率高于99%；手写字母识别准确率在80%左右，但由于我们越来越少用到手写，这个问题似乎已经消失了！


    计算机视觉还对“仿生眼”等项目作出了贡献。植入式耳蜗和成熟的信号处理，为许多失聪人士带去了听力。美国、澳大利亚和欧洲目前正展开一场类似的竞赛，为那些部分甚至完全失明的人士带去视力。目标是将电极植入受损的视网膜。在为电极准备信号、让大脑聚焦在图像重要部分方面，计算机视觉算法扮演了重要角色。


    尽管如此，计算机视觉还需要一定的时间，才能承担比物体识别更为复杂的任务。例如，让计算机不光理解单个对象，更要理解整个场景，以及物体与物体之间的关系，这仍然是个相当重大的挑战。为一群女士端饮料上来的服务员，打翻了一杯水。预测接下来会发生什么，对计算机来说仍是挑战。跌落的玻璃杯砸在石头地板上会碎裂，以及不利的照明、恶劣的天气条件、低分辨率的图像和棘手的摄像头角度，都会让如今的计算机视觉系统难于应付。


    ### 自然语言处理的情况


    第四支也是最后一支人工智能部落是语言学家。他们试图让计算机解析、理解并使用自然语言。自然语言处理可以分解为一些相互关联的任务，如回答问题、机器翻译、文本摘要和语音识别。


    回答问题是自然语言处理研究中最古老的一个难题，它本身可以分解成一些子问题，例如基于文本的问答和基于知识的问答。简单的文本问答中，我们只希望从文本中检索出正确的答案。故事的主人公是谁？故事发生在什么地方？而在基于知识的问答中，我们通常希望从结构化数据库中提取更多的语义信息。哪些国家与中国存在陆上边界？猫王去世时，美国总统是哪一位？待回答的问题还可以按另一些维度进行分解（如是开放式问答还是封闭式问答）。


    文本检索大会（Text REtrieval Conference，简称TREC，自1992年以来每年举办）等大量比赛对问答系统的表现加以评估。许多针对此类竞赛开发的系统，如谷歌、必应等商业搜索引擎已将之用于回答查询。如果以返回事实或列表为目标，最先进的问答系统可以回答正确率在70%以上的简单问题。对于封闭式问题的回答，早在20世纪70年代初，问答系统的成绩就颇为可观了。例如，1971年在休斯敦举办的第二届农历年科学大会上，对地质学家们提出的有关“阿波罗号”所收集的月球岩石的问题，LUNAR系统答对了78%。[\[13\]](#chapter001_0007_0001.xhtml#m13)LUNAR回答了以下这类问题：“高碱性岩石中铝的平均浓度是多少？”对开放式问答，IBM的沃森（前文介绍过）代表了当前技术最前沿的水平。


    机器翻译是自然语言处理的另一个问题，它在过去几十年中取得了良好的进展。经历了20世纪60年代和70年代的失望之后，到20世纪80年代至90年代，部分因为全球互联网络的发展，人们再次对机器翻译产生了兴趣。今天，诸如谷歌翻译等系统表明，如果两种语言的血缘关系亲近，那么，机器翻译在句这一级别的准确度是可以接受的。举例来说，谷歌翻译对法语和英语之间的互译挺不错。如果两种语言的关系疏远（如中文和英文），或是我们想翻译一整段话，那么机器翻译还有颇长的道路要走。不过，就算是在句的层面，谷歌翻译仍然会犯一些低级错误。


    **谷歌的误译**


    输入：L’auto est’a ma soeur。


    输出：The car is to my sister.（这辆车是我妹妹。）


    正确译文：The car belongs to my sister.（这辆车属于我妹妹。）


    输入：They were pregnant.（她们怀孕了。）


    输出：llsétaient enceintes.


    正确译文：Elles étaient enceintes.


    （译注：此处是为了表现谷歌翻译在英法互译之间犯下的低级错误，故此未作翻译。）


    输入：Mais ça n’a l’air très amusant.


    输出：But it does sound very funny.（但听起来的确很好笑。）


    正确译文：But it doesn’t sound very funny.（但听起来并不怎么好笑。）


    输入：La copine de le pilot mange son diner.


    输出：The girlfriend of the pilot eats his dinner.（飞行员的女朋友吃了他的饭。）


    正确译文：The girlfriend of the pilot eats her dinner.（飞行员的女朋友在吃饭。）


    为把这些句子翻译正确，需要对语义有着深刻的理解。你必须明白一般只有女性会怀孕；你必须理解成语；你必须能够执行复杂的代名词指涉解析，使用常识和其他形式的推理，弄清特定的代词到底指的是谁。虽然要计算机系统跟人类做得一样出色，我们大概还有许多年甚至数十年的路要走，但机器翻译现在的表现，对许多应用程序来说已经足够了。


    最后，语音识别是人工智能进展极其顺利，已经开始逐渐从人们的视野里消失的又一个领域。对着设备说话，它还能理解我们——我们很快就会把这认为是理所当然的事情。近年来取得的许多成果，深度学习仍然是背后的推手。例如，百度的“深度语音2”（Deep
    Speech 2）系统在转录口头英语或普通话时，速度和准确性堪与人类竞争；相比过去大得多的训练库，其性能提升非常明显。“深度语音2”接受了数万小时标注口语训练。不过，最叫人啧啧称奇的地方或许是，此类系统在语义上并不理解转录的文本，它们的运作建立在纯粹的句法层面上。


    尽管取得了上述进展，在一些最基础的领域，自然语言处理仍然面临着挑战。首先，一旦超出句的层面，系统理解语音和语言就很困难了。在翻译整段文字或转录长篇口语段落方面，机器的改进空间还很大。第二，自然语言处理在语义上仍然很纠结，也就是说，还难以真正地理解意义。“the
    bolt hit the ground，and the tree caught fire”（“闪电击中地面，树着了火”）和“the bolt hit the
    ground，and the mast collapsed”（“螺栓落到地上，桅杆倒了”）这两句话，你必须依靠意义才能区分。前一个“bolt”是闪电，后一个“bolt”是螺栓。


    ### 人工智能和游戏


    现在我想转到上面四个部落都着力研究的一些有趣问题上。一直以来，游戏都是热门的人工智能测试场，这应该并不会叫人太吃惊。游戏有着准确的规则，有一清二楚的获胜方，故此是进行自动化的好选择。[\[14\]](#chapter001_0007_0001.xhtml#m14)游戏的每一步，各方玩家都需要在若干可能的行动中作出选择。要判断什么时候谁赢了，哪些行动对此次成功作出了贡献，大多是很容易的。此外，通过游戏，我们也训练计算机，叫它自己跟自己多玩。


    要对现实世界采取行动，往往没这么容易。很多情况下，我们要做什么，并没有准确的规则。在任意时间点上，可以采取的行动都有很多，甚至无限多，要确定选定行为是好是坏，可能非常困难。此外，收集大量训练数据更是难上加难。


    故此，游戏为开发能思考的机器提供了一个简单的理想化世界，游戏领域要量化进度也很容易。如今，有几种游戏，机器的表现明显优于人类。每当有人告诉我，计算机只能按编好的程序去做，我就喜欢举出6款游戏的例子，计算机在这些游戏上已经拿下了世界冠军。在大多数情况下，这些世界冠军级的计算机程序学会了如何比我们玩得更出色。


    #### 黑白棋


    黑白棋（Othello，有时也叫Reversi，中文也叫奥赛罗棋、翻转棋）是一款八格棋盘的双人游戏。玩家轮流在棋盘上放置彩色棋子，同时，在双方棋子之间，可翻转对手的任何棋子。1997年，计算机程序Logistello毫无争议地以6：0的成绩，击败了世界冠军村上健。Logistello玩了数十万次游戏，来完善自己的能力。自此以后，黑白棋程序一直在进步，如今比任何人类玩家都玩得更好。在较小的棋盘上（如4×4或6×6），计算机能算出完美的落子，此时，持白棋后落子的玩家必将赢得游戏。而如果是在8×8的棋盘上，如果双方玩家都下得完美无误，则游戏可以平局结束（虽然这一点尚未得到正式的证明）。


    #### 四子棋


    四子棋（Connect 4，也叫“屏风四子棋”）是一款垂直版的“画圈打叉”游戏，棋盘为6行7列。两名玩家轮流将彩色棋子落在纵列上，争取在水平、竖直或斜向上连续排出4颗棋子来。1988年，维克多·艾里斯（Victor
    Allis）写了一款人工智能程序，能下出完美的四子棋来。这款程序永远不会输，它会逼得你进入平局，如果你犯了足够多的错误，它会击败你。从数学上来说，你没法击败这款程序。[\[15\]](#chapter001_0007_0001.xhtml#m15)


    #### 国际象棋


    从一开始，人工智能领域就认为国际象棋是个有趣的检验平台。1948年前后，艾伦·图灵写出了有可能是第一款的国际象棋程序。因为当时还没有能运行该程序的计算机，他用铅笔和纸张来运行。计算每一步的下法，他会用上半个小时。这款程序叫“增压夺冠”（Turbochamp），可惜它辜负了自己的名字，第一场比赛就输掉了。尽管如此，它包含的许多设想，在今天许多更成熟的象棋程序中仍能找到。


    如前所述，1997年，世界象棋冠军加里·卡斯帕罗夫输给了IBM的“深蓝”计算机程序，这是一个重要的里程碑。这是“深蓝”最后一次打比赛[\[16\]](#chapter001_0007_0001.xhtml#m16)，如今个人计算机上运行的象棋程序也能下得远超最佳人类棋手。2006年，从卡斯帕罗夫手里拿下世界冠军头衔的弗拉基米尔·克拉姆尼克（Vladimir
    Kramnik），以两胜四负的成绩，败给了标准个人计算机上运行的“深弗里茨”（Deep Fritz）程序。有趣的是，“深弗里茨”这类计算机象棋程序改变了象棋本身，提高了我们对这种游戏的理解，成了了不起的教育工具。专业棋手和业余爱好者都从象棋程序中受益，他们借助象棋程序学习新棋局，分析旧棋局。用国际象棋来说明思考机器怎样提升人类而非取代人类，是个很好的例子。


    因为如今有了更好的算法，哪怕是相当小的象棋程序，如今也能下得很有竞争力。2009年，“口袋弗里茨4号”（Pocket Fritz 4）在阿根廷布宜诺斯艾利斯举办的“南方共同市场杯”大师巡回赛上胜出，成绩是九胜一负。“口袋弗里茨4号”的评分比加里·卡斯帕罗夫还要高，更叫人惊讶的是，它是在HTC
    Touch智能手机上运行的。


    虽然“深蓝”的名字里同样有个“深”字，但它其实并未使用深度学习。“深蓝”里的这个“深”，指的是探索远超人类所能达到的深度。


    和AlphaGo等程序相比，“深蓝”还有一点容易叫人糊涂的地方，那就是有人暗示它并未使用机器学习。AlphaGo项目负责人杰米斯·哈萨比斯就曾说：


    “深蓝”是一套手工制作的程序，程序员们将来自国际象棋大师的信息转化成具体的规则和启发式，而我们则赋予了AlphaGo学习的能力，接着，它就像人那样，通过实践和研究学习。[\[17\]](#chapter001_0007_0001.xhtml#m17)


    这误解了“深蓝”。没错，“深蓝”有着大量的手工特点，也通过开局和收官棋谱的形式获得了象棋大师提供的知识。


    然而，机器学习在深蓝的发展中扮演了至关重要的角色。它的评估功能（也即判断哪一方获胜）有着许多不确定参数。例如，它不是按照编程来权衡是选择“王”到安全位置，还是占据棋盘中央空间优势，这些参数的优化值是靠机器学习根据数千盘大师比赛来确定的。


    AlphaGo同样有着大量手工特点，比如“气”（跟棋子相邻的空交叉点）、“征子”（Z字形移动）、“点眼”（把棋子下到被围起来的区域）。这些都不是机器靠学习得来，而是靠人类的编程。此外，AlphaGo是根据人类过往所下大量棋局的数据库来训练的。所以AlphaGo和“深蓝”都使用了机器学习，只不过AlphaGo比“深蓝”学得更多。AlphaGo和“深蓝”都包含了对各自游戏的手工知识，只是AlphaGo的手工知识比“深蓝”要少。


    #### 跳棋


    跳棋通常是用8×8的棋盘来下，并靠对角线移动来捕获黑白棋子。1996年，阿尔伯塔大学乔纳森·谢弗（Jonathan Shaeffer）领导的一支团队编写了程序“奇努克”（Chinook），击败了人类大师唐·拉弗蒂（Don
    Lafferty），赢得了世界人机挑战锦标赛的冠军。“奇努克”获胜略有争议的地方在于，此事出在跟公认最伟大的跳棋棋手马里恩·廷斯利（Marion Tinsley）交手之后没多久。廷斯利从来没有在世界冠军赛里输过一轮，他45年的职业生涯里也只输过7场比赛，其中两局便是对战奇努克。在双方的最后一场比赛中，廷斯利和奇努克以平局结束，但这是因为廷斯利健康不佳被迫退赛，没过多久就去世了。很遗憾，我们永远无法知道最终会是奇努克赢，还是打成平手。但不管怎么说，阿尔伯塔大学的一支团队如今有了能下完美跳棋的程序，他们淋漓尽致地表明，他们的程序永远也没人能打败。淋漓尽致这个词用得恰如其分：200多台计算机要用上几年时间才能探索完所有可能的棋局。


    #### 围棋


    如我们所见，2016年3月，AlphaGo以四胜一负的成绩击败了韩国棋手李世石，机器首次战胜了人。（译注：在本书翻译期间，2017年5月，AlphaGo又以三连胜的成绩战胜了世界排名第一的中国棋手柯洁。）AlphaGo出现之前，最成功的计算机围棋程序是雷米·库隆（Remi
    Coulom）所写的“狂石”（CrazyStone）。“狂石”击败过好几名职业围棋手——但只有人类棋手在让先4子甚至更多的时候才行。库隆也是蒙特卡罗树搜索的发明者，这种搜索策略是AlphaGo成功的一大关键因素。2014年3月，库隆预测，计算机要战胜职业棋手还得再用10年。实际上，时间只过去了24个月，AlphaGo就击败了全世界最优秀的棋手之一。（为了对库隆表示公平，他做预测时还说了一句话：“我不喜欢做预测。”）


    比较AlphaGo与“深蓝”颇为有趣。“深蓝”使用专用硬件，每秒探索大约2亿个位置。相比之下，AlphaGo每秒只能评估6万个位置。“深蓝”使用暴力运算来找到好棋着，但这并不太适合围棋这一更复杂的游戏。相比之下，AlphaGo有着更强的位置评估能力，这种能力是靠着自我对弈数十亿盘学习而来。


    现代国际象棋程序探索的棋着位置，远比“深蓝”时代的程序要少。“深弗里茨”每秒探索800万个位置。手机上运行且评分比卡斯帕罗夫还高的“口袋弗里茨4号”[\[18\]](#chapter001_0007_0001.xhtml#m18)，每秒只探索两万个位置，这甚至比AlphaGo还要少。这些程序接受的训练，已经能让它们更好地评估棋盘位置。故此，它们不需要像“深蓝”那样提前搜索那么多位置。因为能够更好地评估棋面局势，我们在围棋和国际象棋上的表现都更好了。


    #### 扑克


    扑克提出了国际象棋和围棋等游戏中找不到的一些有趣挑战。一个挑战是，它是一场不完美的信息博弈。对象棋和围棋而言，你可以看到棋盘，能准确地知道游戏的状态。但在像扑克这样的游戏里，有些牌是藏起来的，这就使它成了一场概率博弈。另一个挑战是，扑克也是一种心理学游戏，你必须理解对手的策略。比方说，他们可能会虚张声势（bluffing）。


    尽管存在这些挑战，计算机现在仍非常擅长打扑克。2015年，一款名叫“Cepheus”的bot（译注：这是robot的简称，但并非有实体的机器人，更类似智能程序）已经基本解决了流行的两人对战扑克游戏：一对一德州扑克。考虑到扑克中概率所扮演的角色，要想每手都赢钱不可能。有时候你就是运气不好，拿到的牌差。但如果你着眼于所有可能打出来的牌，并做个平均，那么，“Cepheus”是能赢的，而且长期而言还能打破平均成绩。


    人类仍然略微领先，尤其是在更具挑战性的不限人数的牌戏里。2015年，在匹兹堡里弗斯赌场举办的为期两周的“大脑与人工智能”竞赛里，人类以小幅优势胜出。考虑到4名人类玩家都是顶尖牌手（其中还包括世界排名第一的牌手），我敢押注打赌，机器很快就会超过人类。


    #### 拼字游戏


    2006年，在多伦多举办的一场人机对战中，计算机程序“Quackle”击败了前世界冠军大卫·鲍伊斯（David Boys）。鲍伊斯相当不客气地说，输给机器总好过做一台机器。当然，计算机极为擅长找到能得最高分的单词，它们可以机械式地快速搜索整部字典。然而，拼字游戏还需要善用拼字板，利用特殊方格将分数翻倍甚至翻三倍，并利用整个拼字板交叉得分。此外，玩家还需要预测哪些字母还没抽出来，打好收官战。因此，把拼字游戏玩得很好，不仅仅要求能在字典里找到能得最高分的单词。


    #### 魔方


    标准的三阶魔方能出现差不多43×10^(18)种朝向。10的18次方，就是一个“1”，后头跟着18个零。老实说，我们可以很精确地说出魔方的复杂性，魔方可以出现43252003274489856000种朝向。考虑到只有“全知万能的存在”才知道任意一步移动的最优举措，凡是能最优化解决魔方的算法，都叫作“上帝算法”。类似的，“上帝之数”指的是解开魔方所需的最优转动次数。我的同事理查德·科夫（Richard
    Korf）用计算机做了大量暴力运算，证明“上帝之数”仅为20步。[\[19\]](#chapter001_0007_0001.xhtml#m19)实际上，大多数魔方只需转动18次就能解开了。'
  fmt: "\n这类物体识别技术已经变得足够主流，各类应用软件都能够自动识别物体了。诺基亚的“拍立寻”（`Point and Find`）程序能自动识别建筑物、电影海报和各类产品。另一款应用程序“谷歌眼镜”（译注：原文为“`Google\
    \ Goggles`”，这是一款手机拍照识别程序，真正能佩戴的“谷歌眼镜”对应的英文是“`Google Glass`”）能识别出纽约大都会艺术博物馆的76000件不同艺术作品。此外，微软的“必应影像”（`Bing\
    \ Vision`）可以识别书籍、CD和DVD（但这款软件现在已经停止开发了）。\n\n面部识别是计算机视觉中的一个专业领域，进展也不错。面部识别软件目前对正面图像的效果很好，但要是你转向侧脸，它就变得纠结了。光线欠佳，戴着太阳镜，留着长发甚至露出微笑，也可能对它提出挑战。不管怎么说，根据标准的“户外面部检测”数据库（内有收集自网络的13000张图像），诸如谷歌`FaceNet`等最先进的系统可达到99%以上的准确率，这对“老大哥”来说可能就够好了。还是那句话，深度学习在达到如此水平的准确性上发挥了重要作用。\n\
    \n光学字符识别（`Optical character recognition`，`OCR`）是人工智能不为人所知的另一个例子。`OCR`识别的第一项专利可追溯到1929年，到20世纪50年代，`OCR`机器首次出现在商业领域。今天，你购买的任何多功能打印机都会为扫描仪捆绑某款不错的`OCR`软件。`OCR`基本上是一个已得到解决的问题。对于拉丁印刷字母，`OCR`识别准确率高于99%；手写字母识别准确率在80%左右，但由于我们越来越少用到手写，这个问题似乎已经消失了！\n\
    \n计算机视觉还对“仿生眼”等项目作出了贡献。植入式耳蜗和成熟的信号处理，为许多失聪人士带去了听力。美国、澳大利亚和欧洲目前正展开一场类似的竞赛，为那些部分甚至完全失明的人士带去视力。目标是将电极植入受损的视网膜。在为电极准备信号、让大脑聚焦在图像重要部分方面，计算机视觉算法扮演了重要角色。\n\
    \n尽管如此，计算机视觉还需要一定的时间，才能承担比物体识别更为复杂的任务。例如，让计算机不光理解单个对象，更要理解整个场景，以及物体与物体之间的关系，这仍然是个相当重大的挑战。为一群女士端饮料上来的服务员，打翻了一杯水。预测接下来会发生什么，对计算机来说仍是挑战。跌落的玻璃杯砸在石头地板上会碎裂，以及不利的照明、恶劣的天气条件、低分辨率的图像和棘手的摄像头角度，都会让如今的计算机视觉系统难于应付。\n\
    \n## 自然语言处理的情况\n\n第四支也是最后一支人工智能部落是语言学家。他们试图让计算机解析、理解并使用自然语言。自然语言处理可以分解为一些相互关联的任务，如回答问题、机器翻译、文本摘要和语音识别。\n\
    \n回答问题是自然语言处理研究中最古老的一个难题，它本身可以分解成一些子问题，例如基于文本的问答和基于知识的问答。简单的文本问答中，我们只希望从文本中检索出正确的答案。故事的主人公是谁？故事发生在什么地方？而在基于知识的问答中，我们通常希望从结构化数据库中提取更多的语义信息。哪些国家与中国存在陆上边界？猫王去世时，美国总统是哪一位？待回答的问题还可以按另一些维度进行分解（如是开放式问答还是封闭式问答）。\n\
    \n文本检索大会（`Text REtrieval Conference`，简称`TREC`，自1992年以来每年举办）等大量比赛对问答系统的表现加以评估。许多针对此类竞赛开发的系统，如谷歌、必应等商业搜索引擎已将之用于回答查询。如果以返回事实或列表为目标，最先进的问答系统可以回答正确率在70%以上的简单问题。对于封闭式问题的回答，早在20世纪70年代初，问答系统的成绩就颇为可观了。例如，1971年在休斯敦举办的第二届农历年科学大会上，对地质学家们提出的有关“阿波罗号”所收集的月球岩石的问题，`LUNAR`系统答对了78%。[\\\
    [13\\]](#chapter001_0007_0001.xhtml#m13)`LUNAR`回答了以下这类问题：“高碱性岩石中铝的平均浓度是多少？”对开放式问答，IBM的`Watson`（前文介绍过）代表了当前技术最前沿的水平。\n\
    \n机器翻译是自然语言处理的另一个问题，它在过去几十年中取得了良好的进展。经历了20世纪60年代和70年代的失望之后，到20世纪80年代至90年代，部分因为全球互联网络的发展，人们再次对机器翻译产生了兴趣。今天，诸如谷歌翻译等系统表明，如果两种语言的血缘关系亲近，那么，机器翻译在句这一级别的准确度是可以接受的。举例来说，谷歌翻译对法语和英语之间的互译挺不错。如果两种语言的关系疏远（如中文和英文），或是我们想翻译一整段话，那么机器翻译还有颇长的道路要走。不过，就算是在句的层面，谷歌翻译仍然会犯一些低级错误。\n\
    \n### 谷歌的误译\n\n输入：`L’auto est’a ma soeur.` \n\n输出：`The car is to my sister.`（这辆车是我妹妹。）\n\
    \n正确译文：`The car belongs to my sister.`（这辆车属于我妹妹。）\n\n输入：`They were pregnant.`（她们怀孕了。）\n\
    \n输出：`llsétaient enceintes.`\n\n正确译文：`Elles étaient enceintes.`\n\n（译注：此处是为了表现谷歌翻译在英法互译之间犯下的低级错误，故此未作翻译。）\n\
    \n输入：`Mais ça n’a l’air très amusant.`\n\n输出：`But it does sound very funny.`（但听起来的确很好笑。）\n\
    \n正确译文：`But it doesn’t sound very funny.`（但听起来并不怎么好笑。）\n\n输入：`La copine de le\
    \ pilot mange son diner.`\n\n输出：`The girlfriend of the pilot eats his dinner.`（飞行员的女朋友吃了他的饭。）\n\
    \n正确译文：`The girlfriend of the pilot eats her dinner.`（飞行员的女朋友在吃饭。）\n\n为把这些句子翻译正确，需要对语义有着深刻的理解。你必须明白一般只有女性会怀孕；你必须理解成语；你必须能够执行复杂的代名词指涉解析，使用常识和其他形式的推理，弄清特定的代词到底指的是谁。虽然要计算机系统跟人类做得一样出色，我们大概还有许多年甚至数十年的路要走，但机器翻译现在的表现，对许多应用程序来说已经足够了。\n\
    \n最后，语音识别是人工智能进展极其顺利，已经开始逐渐从人们的视野里消失的又一个领域。对着设备说话，它还能理解我们——我们很快就会把这认为是理所当然的事情。近年来取得的许多成果，深度学习仍然是背后的推手。例如，百度的“深度语音2”（`Deep\
    \ Speech 2`）系统在转录口头英语或普通话时，速度和准确性堪与人类竞争；相比过去大得多的训练库，其性能提升非常明显。“深度语音2”接受了数万小时标注口语训练。不过，最叫人啧啧称奇的地方或许是，此类系统在语义上并不理解转录的文本，它们的运作建立在纯粹的句法层面上。\n\
    \n尽管取得了上述进展，在一些最基础的领域，自然语言处理仍然面临着挑战。首先，一旦超出句的层面，系统理解语音和语言就很困难了。在翻译整段文字或转录长篇口语段落方面，机器的改进空间还很大。第二，自然语言处理在语义上仍然很纠结，也就是说，还难以真正地理解意义。`the\
    \ bolt hit the ground，and the tree caught fire`（“闪电击中地面，树着了火”）和`the bolt hit the\
    \ ground，and the mast collapsed`（“螺栓落到地上，桅杆倒了”）这两句话，你必须依靠意义才能区分。前一个“bolt”是闪电，后一个“bolt”是螺栓。\n\
    \n## 人工智能和游戏\n\n现在我想转到上面四个部落都着力研究的一些有趣问题上。一直以来，游戏都是热门的人工智能测试场，这应该并不会叫人太吃惊。游戏有着准确的规则，有一清二楚的获胜方，故此是进行自动化的好选择。[\\\
    [14\\]](#chapter001_0007_0001.xhtml#m14)游戏的每一步，各方玩家都需要在若干可能的行动中作出选择。要判断什么时候谁赢了，哪些行动对此次成功作出了贡献，大多是很容易的。此外，通过游戏，我们也训练计算机，叫它自己跟自己多玩。\n\
    \n要对现实世界采取行动，往往没这么容易。很多情况下，我们要做什么，并没有准确的规则。在任意时间点上，可以采取的行动都有很多，甚至无限多，要确定选定行为是好是坏，可能非常困难。此外，收集大量训练数据更是难上加难。\n\
    \n故此，游戏为开发能思考的机器提供了一个简单的理想化世界，游戏领域要量化进度也很容易。如今，有几种游戏，机器的表现明显优于人类。每当有人告诉我，计算机只能按编好的程序去做，我就喜欢举出6款游戏的例子，计算机在这些游戏上已经拿下了世界冠军。在大多数情况下，这些世界冠军级的计算机程序学会了如何比我们玩得更出色。\n\
    \n### 黑白棋\n\n黑白棋（`Othello`，有时也叫`Reversi`，中文也叫奥赛罗棋、翻转棋）是一款八格棋盘的双人游戏。玩家轮流在棋盘上放置彩色棋子，同时，在双方棋子之间，可翻转对手的任何棋子。1997年，计算机程序`Logistello`毫无争议地以6：0的成绩，击败了世界冠军村上健。`Logistello`玩了数十万次游戏，来完善自己的能力。自此以后，黑白棋程序一直在进步，如今比任何人类玩家都玩得更好。在较小的棋盘上（如4×4或6×6），计算机能算出完美的落子，此时，持白棋后落子的玩家必将赢得游戏。而如果是在8×8的棋盘上，如果双方玩家都下得完美无误，则游戏可以平局结束（虽然这一点尚未得到正式的证明）。\n\
    \n### 四子棋\n\n四子棋（`Connect 4`，也叫“屏风四子棋”）是一款垂直版的“画圈打叉”游戏，棋盘为6行7列。两名玩家轮流将彩色棋子落在纵列上，争取在水平、竖直或斜向上连续排出4颗棋子来。1988年，维克多·艾里斯（Victor\
    \ Allis）写了一款人工智能程序，能下出完美的四子棋来。这款程序永远不会输，它会逼得你进入平局，如果你犯了足够多的错误，它会击败你。从数学上来说，你没法击败这款程序。[\\\
    [15\\]](#chapter001_0007_0001.xhtml#m15)\n\n### 国际象棋\n\n从一开始，人工智能领域就认为国际象棋是个有趣的检验平台。1948年前后，艾伦·图灵写出了有可能是第一款的国际象棋程序。因为当时还没有能运行该程序的计算机，他用铅笔和纸张来运行。计算每一步的下法，他会用上半个小时。这款程序叫“`Turbochamp`”，可惜它辜负了自己的名字，第一场比赛就输掉了。尽管如此，它包含的许多设想，在今天许多更成熟的象棋程序中仍能找到。\n\
    \n如前所述，1997年，世界象棋冠军加里·卡斯帕罗夫输给了IBM的“深蓝”计算机程序，这是一个重要的里程碑。这是“深蓝”最后一次打比赛[\\[16\\]](#chapter001_0007_0001.xhtml#m16)，如今个人计算机上运行的象棋程序也能下得远超最佳人类棋手。2006年，从卡斯帕罗夫手里拿下世界冠军头衔的弗拉基米尔·克拉姆尼克（Vladimir\
    \ Kramnik），以两胜四负的成绩，败给了标准个人计算机上运行的“深弗里茨”（`Deep Fritz`）程序。有趣的是，“深弗里茨”这类计算机象棋程序改变了象棋本身，提高了我们对这种游戏的理解，成了了不起的教育工具。专业棋手和业余爱好者都从象棋程序中受益，他们借助象棋程序学习新棋局，分析旧棋局。用国际象棋来说明思考机器怎样提升人类而非取代人类，是个很好的例子。\n\
    \n因为如今有了更好的算法，哪怕是相当小的象棋程序，如今也能下得很有竞争力。2009年，“口袋弗里茨4号”（`Pocket Fritz 4`）在阿根廷布宜诺斯艾利斯举办的“南方共同市场杯”大师巡回赛上胜出，成绩是九胜一负。“口袋弗里茨4号”的评分比加里·卡斯帕罗夫还要高，更叫人惊讶的是，它是在HTC\
    \ Touch智能手机上运行的。\n\n虽然“深蓝”的名字里同样有个“深”字，但它其实并未使用深度学习。“深蓝”里的这个“深”，指的是探索远超人类所能达到的深度。\n\
    \n和`AlphaGo`等程序相比，“深蓝”还有一点容易叫人糊涂的地方，那就是有人暗示它并未使用机器学习。`AlphaGo`项目负责人杰米斯·哈萨比斯就曾说：\n\
    \n“深蓝”是一套手工制作的程序，程序员们将来自国际象棋大师的信息转化成具体的规则和启发式，而我们则赋予了`AlphaGo`学习的能力，接着，它就像人那样，通过实践和研究学习。[\\\
    [17\\]](#chapter001_0007_0001.xhtml#m17)\n\n这误解了“深蓝”。没错，“深蓝”有着大量的手工特点，也通过开局和收官棋谱的形式获得了象棋大师提供的知识。\n\
    \n然而，机器学习在深蓝的发展中扮演了至关重要的角色。它的评估功能（也即判断哪一方获胜）有着许多不确定参数。例如，它不是按照编程来权衡是选择“王”到安全位置，还是占据棋盘中央空间优势，这些参数的优化值是靠机器学习根据数千盘大师比赛来确定的。\n\
    \n`AlphaGo`同样有着大量手工特点，比如“气”（跟棋子相邻的空交叉点）、“征子”（Z字形移动）、“点眼”（把棋子下到被围起来的区域）。这些都不是机器靠学习得来，而是靠人类的编程。此外，`AlphaGo`是根据人类过往所下大量棋局的数据库来训练的。所以`AlphaGo`和“深蓝”都使用了机器学习，只不过`AlphaGo`比“深蓝”学得更多。`AlphaGo`和“深蓝”都包含了对各自游戏的手工知识，只是`AlphaGo`的手工知识比“深蓝”要少。\n\
    \n### 跳棋\n\n跳棋通常是用8×8的棋盘来下，并靠对角线移动来捕获黑白棋子。1996年，阿尔伯塔大学乔纳森·谢弗（Jonathan Shaeffer）领导的一支团队编写了程序“奇努克”（`Chinook`），击败了人类大师唐·拉弗蒂（Don\
    \ Lafferty），赢得了世界人机挑战锦标赛的冠军。“奇努克”获胜略有争议的地方在于，此事出在跟公认最伟大的跳棋棋手马里恩·廷斯利（Marion Tinsley）交手之后没多久。廷斯利从来没有在世界冠军赛里输过一轮，他45年的职业生涯里也只输过7场比赛，其中两局便是对战奇努克。在双方的最后一场比赛中，廷斯利和奇努克以平局结束，但这是因为廷斯利健康不佳被迫退赛，没过多久就去世了。很遗憾，我们永远无法知道最终会是奇努克赢，还是打成平手。但不管怎么说，阿尔伯塔大学的一支团队如今有了能下完美跳棋的程序，他们淋漓尽致地表明，他们的程序永远也没人能打败。淋漓尽致这个词用得恰如其分：200多台计算机要用上几年时间才能探索完所有可能的棋局。\n\
    \n### 围棋\n\n如我们所见，2016年3月，`AlphaGo`以四胜一负的成绩击败了韩国棋手李世石，机器首次战胜了人。（译注：在本书翻译期间，2017年5月，`AlphaGo`又以三连胜的成绩战胜了世界排名第一的中国棋手柯洁。）`AlphaGo`出现之前，最成功的计算机围棋程序是雷米·库隆（Remi\
    \ Coulom）所写的“狂石”（`CrazyStone`）。“狂石”击败过好几名职业围棋手——但只有人类棋手在让先4子甚至更多的时候才行。库隆也是蒙特卡罗树搜索的发明者，这种搜索策略是`AlphaGo`成功的一大关键因素。2014年3月，库隆预测，计算机要战胜职业棋手还得再用10年。实际上，时间只过去了24个月，`AlphaGo`就击败了全世界最优秀的棋手之一。（为了对库隆表示公平，他做预测时还说了一句话：“我不喜欢做预测。”）\n\
    \n比较`AlphaGo`与“深蓝”颇为有趣。“深蓝”使用专用硬件，每秒探索大约2亿个位置。相比之下，`AlphaGo`每秒只能评估6万个位置。“深蓝”使用暴力运算来找到好棋着，但这并不太适合围棋这一更复杂的游戏。相比之下，`AlphaGo`有着更强的位置评估能力，这种能力是靠着自我对弈数十亿盘学习而来。\n\
    \n现代国际象棋程序探索的棋着位置，远比“深蓝”时代的程序要少。“深弗里茨”每秒探索800万个位置。手机上运行且评分比卡斯帕罗夫还高的“口袋弗里茨4号”[\\\
    [18\\]](#chapter001_0007_0001.xhtml#m18)，每秒只探索两万个位置，这甚至比`AlphaGo`还要少。这些程序接受的训练，已经能让它们更好地评估棋盘位置。故此，它们不需要像“深蓝”那样提前搜索那么多位置。因为能够更好地评估棋面局势，我们在围棋和国际象棋上的表现都更好了。\n\
    \n### 扑克\n\n扑克提出了国际象棋和围棋等游戏中找不到的一些有趣挑战。一个挑战是，它是一场不完美的信息博弈。对象棋和围棋而言，你可以看到棋盘，能准确地知道游戏的状态。但在像扑克这样的游戏里，有些牌是藏起来的，这就使它成了一场概率博弈。另一个挑战是，扑克也是一种心理学游戏，你必须理解对手的策略。比方说，他们可能会虚张声势（bluffing）。\n\
    \n尽管存在这些挑战，计算机现在仍非常擅长打扑克。2015年，一款名叫“`Cepheus`”的bot（译注：这是robot的简称，但并非有实体的机器人，更类似智能程序）已经基本解决了流行的两人对战扑克游戏：一对一德州扑克。考虑到扑克中概率所扮演的角色，要想每手都赢钱不可能。有时候你就是运气不好，拿到的牌差。但如果你着眼于所有可能打出来的牌，并做个平均，那么，“`Cepheus`”是能赢的，而且长期而言还能打破平均成绩。\n\
    \n人类仍然略微领先，尤其是在更具挑战性的不限人数的牌戏里。2015年，在匹兹堡里弗斯赌场举办的为期两周的“大脑与人工智能”竞赛里，人类以小幅优势胜出。考虑到4名人类玩家都是顶尖牌手（其中还包括世界排名第一的牌手），我敢押注打赌，机器很快就会超过人类。\n\
    \n### 拼字游戏\n\n2006年，在多伦多举办的一场人机对战中，计算机程序“`Quackle`”击败了前世界冠军大卫·鲍伊斯（David Boys）。鲍伊斯相当不客气地说，输给机器总好过做一台机器。当然，计算机极为擅长找到能得最高分的单词，它们可以机械式地快速搜索整部字典。然而，拼字游戏还需要善用拼字板，利用特殊方格将分数翻倍甚至翻三倍，并利用整个拼字板交叉得分。此外，玩家还需要预测哪些字母还没抽出来，打好收官战。因此，把拼字游戏玩得很好，不仅仅要求能在字典里找到能得最高分的单词。\n\
    \n### 魔方\n\n标准的三阶魔方能出现差不多43×10^(18)种朝向。10的18次方，就是一个“1”，后头跟着18个零。老实说，我们可以很精确地说出魔方的复杂性，魔方可以出现43252003274489856000种朝向。考虑到只有“全知万能的存在”才知道任意一步移动的最优举措，凡是能最优化解决魔方的算法，都叫作“上帝算法”。类似的，“上帝之数”指的是解开魔方所需的最优转动次数。我的同事理查德·科夫（Richard\
    \ Korf）用计算机做了大量暴力运算，证明“上帝之数”仅为20步。[\\[19\\]](#chapter001_0007_0001.xhtml#m19)实际上，大多数魔方只需转动18次就能解开了。\n"
  trans: "\n\n这类物体识别技术已经变得足够主流，各类应用软件都能够自动识别物体了。诺基亚的“拍立寻”（`Point and Find`）程序能自动识别建筑物、电影海报和各类产品。另一款应用程序“谷歌眼镜”（译注：原文为“`Google\
    \ Goggles`”，这是一款手机拍照识别程序，真正能佩戴的“谷歌眼镜”对应的英文是“`Google Glass`”）能识别出纽约大都会艺术博物馆的 76000\
    \ 件不同艺术作品。此外，微软的“必应影像”（`Bing Vision`）可以识别书籍、CD 和 DVD（但这款软件现在已经停止开发了）。\n\n面部识别是计算机视觉中的一个专业领域，进展也不错。面部识别软件目前对正面图像的效果很好，但要是你转向侧脸，它就变得纠结了。光线欠佳，戴着太阳镜，留着长发甚至露出微笑，也可能对它提出挑战。不管怎么说，根据标准的“户外面部检测”数据库（内有收集自网络的\
    \ 13000 张图像），诸如谷歌`FaceNet`等最先进的系统可达到 99%以上的准确率，这对“老大哥”来说可能就够好了。还是那句话，深度学习在达到如此水平的准确性上发挥了重要作用。\n\
    \n光学字符识别（`Optical character recognition`，`OCR`）是人工智能不为人所知的另一个例子。`OCR`识别的第一项专利可追溯到\
    \ 1929 年，到 20 世纪 50 年代，`OCR`机器首次出现在商业领域。今天，你购买的任何多功能打印机都会为扫描仪捆绑某款不错的`OCR`软件。`OCR`基本上是一个已得到解决的问题。对于拉丁印刷字母，`OCR`识别准确率高于\
    \ 99%；手写字母识别准确率在 80%左右，但由于我们越来越少用到手写，这个问题似乎已经消失了！\n\n计算机视觉还对“仿生眼”等项目作出了贡献。植入式耳蜗和成熟的信号处理，为许多失聪人士带去了听力。美国、澳大利亚和欧洲目前正展开一场类似的竞赛，为那些部分甚至完全失明的人士带去视力。目标是将电极植入受损的视网膜。在为电极准备信号、让大脑聚焦在图像重要部分方面，计算机视觉算法扮演了重要角色。\n\
    \n尽管如此，计算机视觉还需要一定的时间，才能承担比物体识别更为复杂的任务。例如，让计算机不光理解单个对象，更要理解整个场景，以及物体与物体之间的关系，这仍然是个相当重大的挑战。为一群女士端饮料上来的服务员，打翻了一杯水。预测接下来会发生什么，对计算机来说仍是挑战。跌落的玻璃杯砸在石头地板上会碎裂，以及不利的照明、恶劣的天气条件、低分辨率的图像和棘手的摄像头角度，都会让如今的计算机视觉系统难于应付。\n\
    \n## 自然语言处理的情况\n\n第四支也是最后一支人工智能部落是语言学家。他们试图让计算机解析、理解并使用自然语言。自然语言处理可以分解为一些相互关联的任务，如回答问题、机器翻译、文本摘要和语音识别。\n\
    \n回答问题是自然语言处理研究中最古老的一个难题，它本身可以分解成一些子问题，例如基于文本的问答和基于知识的问答。简单的文本问答中，我们只希望从文本中检索出正确的答案。故事的主人公是谁？故事发生在什么地方？而在基于知识的问答中，我们通常希望从结构化数据库中提取更多的语义信息。哪些国家与中国存在陆上边界？猫王去世时，美国总统是哪一位？待回答的问题还可以按另一些维度进行分解（如是开放式问答还是封闭式问答）。\n\
    \n文本检索大会（`Text REtrieval Conference`，简称`TREC`，自 1992 年以来每年举办）等大量比赛对问答系统的表现加以评估。许多针对此类竞赛开发的系统，如谷歌、必应等商业搜索引擎已将之用于回答查询。如果以返回事实或列表为目标，最先进的问答系统可以回答正确率在\
    \ 70%以上的简单问题。对于封闭式问题的回答，早在 20 世纪 70 年代初，问答系统的成绩就颇为可观了。例如，1971 年在休斯敦举办的第二届农历年科学大会上，对地质学家们提出的有关“阿波罗号”所收集的月球岩石的问题，`LUNAR`系统答对了\
    \ 78%。[\\[13\\]](#chapter001_0007_0001.xhtml#m13)`LUNAR`回答了以下这类问题：“高碱性岩石中铝的平均浓度是多少？”对开放式问答，IBM\
    \ 的`Watson`（前文介绍过）代表了当前技术最前沿的水平。\n\n机器翻译是自然语言处理的另一个问题，它在过去几十年中取得了良好的进展。经历了 20\
    \ 世纪 60 年代和 70 年代的失望之后，到 20 世纪 80 年代至 90 年代，部分因为全球互联网络的发展，人们再次对机器翻译产生了兴趣。今天，诸如谷歌翻译等系统表明，如果两种语言的血缘关系亲近，那么，机器翻译在句这一级别的准确度是可以接受的。举例来说，谷歌翻译对法语和英语之间的互译挺不错。如果两种语言的关系疏远（如中文和英文），或是我们想翻译一整段话，那么机器翻译还有颇长的道路要走。不过，就算是在句的层面，谷歌翻译仍然会犯一些低级错误。\n\
    \n### 谷歌的误译\n\n输入：`L’auto est’a ma soeur.` \n\n输出：`The car is to my sister.`（这辆车是我妹妹。）\n\
    \n正确译文：`The car belongs to my sister.`（这辆车属于我妹妹。）\n\n输入：`They were pregnant.`（她们怀孕了。）\n\
    \n输出：`llsétaient enceintes.`\n\n正确译文：`Elles étaient enceintes.`\n\n（译注：此处是为了表现谷歌翻译在英法互译之间犯下的低级错误，故此未作翻译。）\n\
    \n输入：`Mais ça n’a l’air très amusant.`\n\n输出：`But it does sound very funny.`（但听起来的确很好笑。）\n\
    \n正确译文：`But it doesn’t sound very funny.`（但听起来并不怎么好笑。）\n\n输入：`La copine de le\
    \ pilot mange son diner.`\n\n输出：`The girlfriend of the pilot eats his dinner.`（飞行员的女朋友吃了他的饭。）\n\
    \n正确译文：`The girlfriend of the pilot eats her dinner.`（飞行员的女朋友在吃饭。）\n\n为把这些句子翻译正确，需要对语义有着深刻的理解。你必须明白一般只有女性会怀孕；你必须理解成语；你必须能够执行复杂的代名词指涉解析，使用常识和其他形式的推理，弄清特定的代词到底指的是谁。虽然要计算机系统跟人类做得一样出色，我们大概还有许多年甚至数十年的路要走，但机器翻译现在的表现，对许多应用程序来说已经足够了。\n\
    \n最后，语音识别是人工智能进展极其顺利，已经开始逐渐从人们的视野里消失的又一个领域。对着设备说话，它还能理解我们——我们很快就会把这认为是理所当然的事情。近年来取得的许多成果，深度学习仍然是背后的推手。例如，百度的“深度语音\
    \ 2”（`Deep Speech 2`）系统在转录口头英语或普通话时，速度和准确性堪与人类竞争；相比过去大得多的训练库，其性能提升非常明显。“深度语音 2”接受了数万小时标注口语训练。不过，最叫人啧啧称奇的地方或许是，此类系统在语义上并不理解转录的文本，它们的运作建立在纯粹的句法层面上。\n\
    \n尽管取得了上述进展，在一些最基础的领域，自然语言处理仍然面临着挑战。首先，一旦超出句的层面，系统理解语音和语言就很困难了。在翻译整段文字或转录长篇口语段落方面，机器的改进空间还很大。第二，自然语言处理在语义上仍然很纠结，也就是说，还难以真正地理解意义。`the\
    \ bolt hit the ground，and the tree caught fire`（“闪电击中地面，树着了火”）和`the bolt hit the\
    \ ground，and the mast collapsed`（“螺栓落到地上，桅杆倒了”）这两句话，你必须依靠意义才能区分。前一个“bolt”是闪电，后一个“bolt”是螺栓。\n\
    \n## 人工智能和游戏\n\n现在我想转到上面四个部落都着力研究的一些有趣问题上。一直以来，游戏都是热门的人工智能测试场，这应该并不会叫人太吃惊。游戏有着准确的规则，有一清二楚的获胜方，故此是进行自动化的好选择。[\\\
    [14\\]](#chapter001_0007_0001.xhtml#m14)游戏的每一步，各方玩家都需要在若干可能的行动中作出选择。要判断什么时候谁赢了，哪些行动对此次成功作出了贡献，大多是很容易的。此外，通过游戏，我们也训练计算机，叫它自己跟自己多玩。\n\
    \n要对现实世界采取行动，往往没这么容易。很多情况下，我们要做什么，并没有准确的规则。在任意时间点上，可以采取的行动都有很多，甚至无限多，要确定选定行为是好是坏，可能非常困难。此外，收集大量训练数据更是难上加难。\n\
    \n故此，游戏为开发能思考的机器提供了一个简单的理想化世界，游戏领域要量化进度也很容易。如今，有几种游戏，机器的表现明显优于人类。每当有人告诉我，计算机只能按编好的程序去做，我就喜欢举出\
    \ 6 款游戏的例子，计算机在这些游戏上已经拿下了世界冠军。在大多数情况下，这些世界冠军级的计算机程序学会了如何比我们玩得更出色。\n\n### 黑白棋\n\
    \n黑白棋（`Othello`，有时也叫`Reversi`，中文也叫奥赛罗棋、翻转棋）是一款八格棋盘的双人游戏。玩家轮流在棋盘上放置彩色棋子，同时，在双方棋子之间，可翻转对手的任何棋子。1997\
    \ 年，计算机程序`Logistello`毫无争议地以 6：0 的成绩，击败了世界冠军村上健。`Logistello`玩了数十万次游戏，来完善自己的能力。自此以后，黑白棋程序一直在进步，如今比任何人类玩家都玩得更好。在较小的棋盘上（如\
    \ 4×4 或 6×6），计算机能算出完美的落子，此时，持白棋后落子的玩家必将赢得游戏。而如果是在 8×8 的棋盘上，如果双方玩家都下得完美无误，则游戏可以平局结束（虽然这一点尚未得到正式的证明）。\n\
    \n### 四子棋\n\n四子棋（`Connect 4`，也叫“屏风四子棋”）是一款垂直版的“画圈打叉”游戏，棋盘为 6 行 7 列。两名玩家轮流将彩色棋子落在纵列上，争取在水平、竖直或斜向上连续排出\
    \ 4 颗棋子来。1988 年，维克多·艾里斯（Victor Allis）写了一款人工智能程序，能下出完美的四子棋来。这款程序永远不会输，它会逼得你进入平局，如果你犯了足够多的错误，它会击败你。从数学上来说，你没法击败这款程序。[\\\
    [15\\]](#chapter001_0007_0001.xhtml#m15)\n\n### 国际象棋\n\n从一开始，人工智能领域就认为国际象棋是个有趣的检验平台。1948\
    \ 年前后，艾伦·图灵写出了有可能是第一款的国际象棋程序。因为当时还没有能运行该程序的计算机，他用铅笔和纸张来运行。计算每一步的下法，他会用上半个小时。这款程序叫“`Turbochamp`”，可惜它辜负了自己的名字，第一场比赛就输掉了。尽管如此，它包含的许多设想，在今天许多更成熟的象棋程序中仍能找到。\n\
    \n如前所述，1997 年，世界象棋冠军加里·卡斯帕罗夫输给了 IBM 的“深蓝”计算机程序，这是一个重要的里程碑。这是“深蓝”最后一次打比赛[\\[16\\\
    ]](#chapter001_0007_0001.xhtml#m16)，如今个人计算机上运行的象棋程序也能下得远超最佳人类棋手。2006 年，从卡斯帕罗夫手里拿下世界冠军头衔的弗拉基米尔·克拉姆尼克（Vladimir\
    \ Kramnik），以两胜四负的成绩，败给了标准个人计算机上运行的“深弗里茨”（`Deep Fritz`）程序。有趣的是，“深弗里茨”这类计算机象棋程序改变了象棋本身，提高了我们对这种游戏的理解，成了了不起的教育工具。专业棋手和业余爱好者都从象棋程序中受益，他们借助象棋程序学习新棋局，分析旧棋局。用国际象棋来说明思考机器怎样提升人类而非取代人类，是个很好的例子。\n\
    \n因为如今有了更好的算法，哪怕是相当小的象棋程序，如今也能下得很有竞争力。2009 年，“口袋弗里茨 4 号”（`Pocket Fritz 4`）在阿根廷布宜诺斯艾利斯举办的“南方共同市场杯”大师巡回赛上胜出，成绩是九胜一负。“口袋弗里茨\
    \ 4 号”的评分比加里·卡斯帕罗夫还要高，更叫人惊讶的是，它是在 HTC Touch 智能手机上运行的。\n\n虽然“深蓝”的名字里同样有个“深”字，但它其实并未使用深度学习。“深蓝”里的这个“深”，指的是探索远超人类所能达到的深度。\n\
    \n和`AlphaGo`等程序相比，“深蓝”还有一点容易叫人糊涂的地方，那就是有人暗示它并未使用机器学习。`AlphaGo`项目负责人杰米斯·哈萨比斯就曾说：\n\
    \n“深蓝”是一套手工制作的程序，程序员们将来自国际象棋大师的信息转化成具体的规则和启发式，而我们则赋予了`AlphaGo`学习的能力，接着，它就像人那样，通过实践和研究学习。[\\\
    [17\\]](#chapter001_0007_0001.xhtml#m17)\n\n这误解了“深蓝”。没错，“深蓝”有着大量的手工特点，也通过开局和收官棋谱的形式获得了象棋大师提供的知识。\n\
    \n然而，机器学习在深蓝的发展中扮演了至关重要的角色。它的评估功能（也即判断哪一方获胜）有着许多不确定参数。例如，它不是按照编程来权衡是选择“王”到安全位置，还是占据棋盘中央空间优势，这些参数的优化值是靠机器学习根据数千盘大师比赛来确定的。\n\
    \n`AlphaGo`同样有着大量手工特点，比如“气”（跟棋子相邻的空交叉点）、“征子”（Z 字形移动）、“点眼”（把棋子下到被围起来的区域）。这些都不是机器靠学习得来，而是靠人类的编程。此外，`AlphaGo`是根据人类过往所下大量棋局的数据库来训练的。所以`AlphaGo`和“深蓝”都使用了机器学习，只不过`AlphaGo`比“深蓝”学得更多。`AlphaGo`和“深蓝”都包含了对各自游戏的手工知识，只是`AlphaGo`的手工知识比“深蓝”要少。\n\
    \n### 跳棋\n\n跳棋通常是用 8×8 的棋盘来下，并靠对角线移动来捕获黑白棋子。1996 年，阿尔伯塔大学乔纳森·谢弗（Jonathan Shaeffer）领导的一支团队编写了程序“奇努克”（`Chinook`），击败了人类大师唐·拉弗蒂（Don\
    \ Lafferty），赢得了世界人机挑战锦标赛的冠军。“奇努克”获胜略有争议的地方在于，此事出在跟公认最伟大的跳棋棋手马里恩·廷斯利（Marion Tinsley）交手之后没多久。廷斯利从来没有在世界冠军赛里输过一轮，他\
    \ 45 年的职业生涯里也只输过 7 场比赛，其中两局便是对战奇努克。在双方的最后一场比赛中，廷斯利和奇努克以平局结束，但这是因为廷斯利健康不佳被迫退赛，没过多久就去世了。很遗憾，我们永远无法知道最终会是奇努克赢，还是打成平手。但不管怎么说，阿尔伯塔大学的一支团队如今有了能下完美跳棋的程序，他们淋漓尽致地表明，他们的程序永远也没人能打败。淋漓尽致这个词用得恰如其分：200\
    \ 多台计算机要用上几年时间才能探索完所有可能的棋局。\n\n### 围棋\n\n如我们所见，2016 年 3 月，`AlphaGo`以四胜一负的成绩击败了韩国棋手李世石，机器首次战胜了人。（译注：在本书翻译期间，2017\
    \ 年 5 月，`AlphaGo`又以三连胜的成绩战胜了世界排名第一的中国棋手柯洁。）`AlphaGo`出现之前，最成功的计算机围棋程序是雷米·库隆（Remi\
    \ Coulom）所写的“狂石”（`CrazyStone`）。“狂石”击败过好几名职业围棋手——但只有人类棋手在让先 4 子甚至更多的时候才行。库隆也是蒙特卡罗树搜索的发明者，这种搜索策略是`AlphaGo`成功的一大关键因素。2014\
    \ 年 3 月，库隆预测，计算机要战胜职业棋手还得再用 10 年。实际上，时间只过去了 24 个月，`AlphaGo`就击败了全世界最优秀的棋手之一。（为了对库隆表示公平，他做预测时还说了一句话：“我不喜欢做预测。”）\n\
    \n比较`AlphaGo`与“深蓝”颇为有趣。“深蓝”使用专用硬件，每秒探索大约 2 亿个位置。相比之下，`AlphaGo`每秒只能评估 6 万个位置。“深蓝”使用暴力运算来找到好棋着，但这并不太适合围棋这一更复杂的游戏。相比之下，`AlphaGo`有着更强的位置评估能力，这种能力是靠着自我对弈数十亿盘学习而来。\n\
    \n现代国际象棋程序探索的棋着位置，远比“深蓝”时代的程序要少。“深弗里茨”每秒探索 800 万个位置。手机上运行且评分比卡斯帕罗夫还高的“口袋弗里茨 4\
    \ 号”[\\[18\\]](#chapter001_0007_0001.xhtml#m18)，每秒只探索两万个位置，这甚至比`AlphaGo`还要少。这些程序接受的训练，已经能让它们更好地评估棋盘位置。故此，它们不需要像“深蓝”那样提前搜索那么多位置。因为能够更好地评估棋面局势，我们在围棋和国际象棋上的表现都更好了。\n\
    \n### 扑克\n\n扑克提出了国际象棋和围棋等游戏中找不到的一些有趣挑战。一个挑战是，它是一场不完美的信息博弈。对象棋和围棋而言，你可以看到棋盘，能准确地知道游戏的状态。但在像扑克这样的游戏里，有些牌是藏起来的，这就使它成了一场概率博弈。另一个挑战是，扑克也是一种心理学游戏，你必须理解对手的策略。比方说，他们可能会虚张声势（bluffing）。\n\
    \n尽管存在这些挑战，计算机现在仍非常擅长打扑克。2015 年，一款名叫“`Cepheus`”的 bot（译注：这是 robot 的简称，但并非有实体的机器人，更类似智能程序）已经基本解决了流行的两人对战扑克游戏：一对一德州扑克。考虑到扑克中概率所扮演的角色，要想每手都赢钱不可能。有时候你就是运气不好，拿到的牌差。但如果你着眼于所有可能打出来的牌，并做个平均，那么，“`Cepheus`”是能赢的，而且长期而言还能打破平均成绩。\n\
    \n人类仍然略微领先，尤其是在更具挑战性的不限人数的牌戏里。2015 年，在匹兹堡里弗斯赌场举办的为期两周的“大脑与人工智能”竞赛里，人类以小幅优势胜出。考虑到\
    \ 4 名人类玩家都是顶尖牌手（其中还包括世界排名第一的牌手），我敢押注打赌，机器很快就会超过人类。\n\n### 拼字游戏\n\n2006 年，在多伦多举办的一场人机对战中，计算机程序“`Quackle`”击败了前世界冠军大卫·鲍伊斯（David\
    \ Boys）。鲍伊斯相当不客气地说，输给机器总好过做一台机器。当然，计算机极为擅长找到能得最高分的单词，它们可以机械式地快速搜索整部字典。然而，拼字游戏还需要善用拼字板，利用特殊方格将分数翻倍甚至翻三倍，并利用整个拼字板交叉得分。此外，玩家还需要预测哪些字母还没抽出来，打好收官战。因此，把拼字游戏玩得很好，不仅仅要求能在字典里找到能得最高分的单词。\n\
    \n### 魔方\n\n标准的三阶魔方能出现差不多 43×10¹⁸种朝向。10 的 18 次方，就是一个“1”，后头跟着 18 个零。老实说，我们可以很精确地说出魔方的复杂性，魔方可以出现\
    \ 43252003274489856000 种朝向。考虑到只有“全知万能的存在”才知道任意一步移动的最优举措，凡是能最优化解决魔方的算法，都叫作“上帝算法”。类似的，“上帝之数”指的是解开魔方所需的最优转动次数。我的同事理查德·科夫（Richard\
    \ Korf）用计算机做了大量暴力运算，证明“上帝之数”仅为 20 步。[\\[19\\]](#chapter001_0007_0001.xhtml#m19)实际上，大多数魔方只需转动\
    \ 18 次就能解开了。\n\n"
