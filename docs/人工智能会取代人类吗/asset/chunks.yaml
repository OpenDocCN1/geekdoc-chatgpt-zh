  toc: []
- raw: '牛津报告认为，动物学家的工作有30%的自动化概率。相比之下，其他大多数类型的科学家在1%至2%左右。有趣的是，动物学恰好是机器学习所用的训练集合的一部分。在初始训练集合中，弗雷和奥斯本将动物学家标注为“不易于自动化”。虽然这套机器学习算法的输入不是1就是0（易于自动化，或不易于自动化），但其输出的是一个0到1之间的概率。他们的机器学习程序并不会把输入0自动映射为概率0，或是把输入1映射为概率1。就动物学家的例子来说，机器学习算法把输入0映射为了0.30的概率。我认为，弗雷和奥斯本是对的，分类机制有误。很难想到出于什么理由，动物学家会比其他生物科学家更容易自动化。


    训练集合里还包括了另外几种分类程序给出不同结果的岗位。更确切地说，在训练集合的70种工作中，分类机制分类错误的占7%。例如，训练集合里的服务员，标记是不易于自动化，而分类机制认为服务员的自动化概率为95%。这一次，我仍然认同训练集合。端着若干盘子穿过繁忙的餐厅，这不是机器人很快能做到的事。就算它们做得到，这也是一份低薪工作，采用自动化太过昂贵。另外，这还是一份极为强调人际关系的工作。如果机器人告诉我们今晚的鱼味道棒，是特色菜，我们会相信它吗？


    这些差异表明，我们应该谨慎对待弗雷和奥斯本计算出来的自动化危及的工作岗位预估数字。我们当然不能说美国的就业岗位比澳大利亚的受到更大的自动化威胁，因为该分析认为，美国有47%的工作有自动化风险，澳大利亚仅为40%[^(\[12\])](#chapter001_0009.xhtml#m12)——这么说只是想让数字显得更准确些罢了。然而，毫无疑问，相当大一部分工作受到了威胁。


    ### 从革命中生存下来


    从个人层面上来说，从这场革命中生存下来的策略之一，是找一份我所谓的“开放”工作。有固定工作量的属于封闭工作。例如，打扫道路是封闭工作。要打扫的道路，长度固定；一旦机器人可以打扫道路（未来几十年，它们有很大概率能够这么做），道路清洁工人的工作就消失了。相比之下，开放工作会随着自动化而扩展。比方说，科学研究是一项开放工作。对科学家来说，能自动化工作的工具只会帮你做更多的科学研究，你可以更快速地推进知识的疆域。显然，如果你希望从这场革命中生存下来，你肯定想从事开放工作。


    一些工作既不完全开放，也不完全封闭。以卡车司机为例。如果我们自动驾驶，送货成本可能会下降，这将扩大经济，创造更多的送货需求。此外，从前太过昂贵的任务能获得可行性。遗憾的是，这很可能只为自动驾驶卡车创造更多工作。人力驾驶太贵，太不安全，无法承担这些新多出来的额外工作。


    教育是一个必然会出现改变的领域——教育日益专业化。我们对专业知识越学越多，但专业本身所涵盖的范围却越来越窄。当然，人想要知道的东西也越来越多，所以，我们需要保持专注，推进一切知识领域的疆域。然而，大部分的专业知识也迅速过时，因此，更新知识、学习新技能，成为许多人的终身任务。为了对此作出回应，教育必须减少专业化倾向，它得把不会过时的基本技能教给我们，它应该教会我们怎样在之后的人生里迅速掌握新技能。人工智能会成为这道药方的一部分。大量的开放在线课程（MOOCs），依靠帮助人学习的人工智能机器人，协助人在整个工作生涯中开展自我教育。


    ### 机会“金三角”


    你应该学习什么样的技能和知识，维持对机器的竞争力呢？我在这里的建议是，要朝着我所说的“机会金三角”前进，占据一个或一个以上的角。一个角里是精通技术的极客，做个发明未来的人。让计算机自己编程，仍然是件极具挑战性的事情；创造新颖的未来，对计算机同样也极具挑战性。做一个能这样做的人。


    当然，不是所有人都喜欢编程，也不是所有人都能成为优秀的程序员，这就跟不是所有人都能成为优秀的乐手一样。成为游戏程序员所需的技能，或许牵涉到很大的遗传因素。如果你不是程序员，我建议你去另外两个角。


    机会金三角的第三个也是最后一个角，是创作人和工匠。生活里自动化场景越来越多，却有可能让人产生一种反应：对人工制造的东西更加欣赏。事实上，时尚潮流似乎正在迎接这一趋势。地球上最古老的工种，比如木匠这一类，说不定也是最牢靠的饭碗，我认为这相当讽刺。故此，锁定饭碗的另一个机会是开发创造力，学习若干手工技能——制作传统奶酪、写小说、组乐队。毫无疑问，计算机也可以拥有创意，但这对它们仍然是一个存在挑战的领域。此外，社会选择更为重视那些带着“手工制作”标签的东西。经济学家会让我们相信，市场会对此给予回应。


    ### 人工智能和战争


    战场，是人工智能注定要彻底改变我们生活的一个领域。开发机器人，对军方来说有着诸多吸引力。机器人不需要睡觉，不需要吃饭，可以全天候战斗；使用机器人可以确保人类不受伤害；机器人严格遵守命令，速度快，准确度高。把战场引入人工智能称为第三次战争革命（前两次分别是火药的发明和核武器的出现），也就不足为奇了，这将是我们干掉对手在速度和效率上的另一场巨变。


    能杀人的机器人，其技术名称叫“致命性自主武器”。不过，媒体经常使用另一个更令人回味的说法：“杀手机器人”。这个名字可能会让你联想到来自同名电影里的“终结者”。其实，如果你还记得电影的故事情节，你会发现，“终结者”是2029年启动的。但现实当中，杀手机器人的启动要简单得多，最多再过几年。以“捕食者”无人机和它所携带的“地狱火”导弹为例。如今，计算机已经取代了人类飞行员，这是一个小小的技术飞跃。英国国防部表示，如今在技术上用计算机控制此类武器已经是可行的了。我表示认同。


    不过，杀手机器人的开发，不会止步于捕食者的自主版本。现在的机器人还很原始粗糙，未来会出现一场改善机器人的军备竞赛。终点必然是电影《终结者》所想象的那种可怕技术，好莱坞在这部分上猜得没错。和摩尔定律一样，我们可能看到自主武器的性能呈指数增长。为了提醒我们它将在哪里结束，我把这叫作“施瓦辛格定律”。


    挑战之一是杀手机器人将会变得廉价，而且只会变得更廉价。只要看看过去几年无人机价格下降的速度就知道了。它们制造起来也会更容易，哪怕不甚完善。你可以给自己买一架四轴飞行器，外加一部手机、一枚炸弹。接下来，你只需要找个像我这样的人，给你写一款能瞄准、跟踪、干掉敌人的软件就行了。军队会喜欢这一套的，至少最初会喜欢：它们不需要睡觉和休息，不需要漫长而昂贵的训练，损坏了也不需要从战场上疏散。


    一旦我们在战斗中使用武器系统，我们必然预料到对方会迅速掌握它，并还治于我方。只要我们的军队想要保护自己，免受这些机器人所伤，他们对此类武器的合法性认识就会有所改变。杀手机器人将拉低战争的障碍，它们让人得以进一步远离战场，从而把战争变成逼真的电子游戏。


    自主武器将破坏当下的地缘政治秩序。过去，国家的军事力量在很大程度上取决于经济实力。军事优势取决于国家征募、维持大量士兵的能力。国家也需要以某种方式让部队遵从国家意愿，说服也好，胁迫也好。反过来说，有了自主武器，只需要少数人，就可以控制一支大规模部队。于是，独裁者就更容易把个人意志强加给全国人民。对美国这样的超级大国来说，要在全世界的热点地区巡逻就更为困难了。自主武器将破坏自“二战”结束以来建立的微妙势力平衡，我们的星球将变成一个更危险的地方。


    ### 禁止杀手机器人


    出于这样的考虑，我认为我们必须对自主武器加以规范。如果我们希望对已经上路的军备竞赛加以限制，就必须在不远的未来赶紧下手。其他许多了解技术的人士也认同这一观点。2015年7月，我帮助拟发了一封公开信，要求禁止自主武器。我们收集了1000多位人工智能及机器人研究员的签名，他们分别来自世界各地的大学，以及谷歌DeepMind、Facebook人工智能研究实验室和艾伦人工智能研究所（Allen
    Institute for AI）等商业实验室。今天，这封信已经有超过20000个签名，包括史蒂芬·霍金、埃隆·马斯克、诺姆·乔姆斯基（Noam Chomsky）等著名人物。但在我看来，最值得注意的一点在于，人工智能和机器人领域的许多知名研究员也签了名。


    **2015年7月的公开信**


    无须人为干预，自主武器就可选择并攻击目标。例如，这类武器可以包括武装四轴无人机，能搜索、消灭满足某些预设标准的人，但不包括需要人来作出瞄准决定的巡航导弹或遥控无人机。人工智能技术已经达到了在几年内部署此类系统（就算法律上不允许，技术上也是可行的）的程度，而且赌注极高：自主武器被称为火药与核武器之后的第三次战争革命。


    有许多观点，既支持自主武器，也反对它。举例来说，用机器取代人类士兵，好处是减少了伤亡，坏处是降低了作战门槛。对人类而言，今天的关键问题是，是要拉开全球人工智能军备竞赛，还是阻止它。如果有重要军事强国推动人工智能武器发展，全球军备竞赛实际上就不可避免，而这一技术轨迹的终点显而易见：自主武器将成为明天的AK-47。与核武器不同，它们不需要昂贵或难以获得的原材料，故此，它们将变得无处不在，而且十分廉价，因为任何重要军事力量都能进行大规模生产。它们出现在黑市上，落到恐怖分子或者希望更好地控制民众的独裁者、想进行种族清洗的军阀手里，只会是个时间问题。自主武器是完成暗杀、颠覆国家、压制民众、选择性地清除特定种族等任务的理想工具。因此，我们认为，军事人工智能军备竞赛不会造福人类。有许多种方法，都可以让人工智能把战场变得对人类（尤其是平民）更安全，又不成为杀人的新工具。


    正如大多数化学家和生物学家对制造化学或生物武器毫无兴趣，大多数人工智能研究员也对制造人工智能武器毫无兴趣，同时不希望有其他人这么做（令公众强烈反对人工智能、妨碍人工智能有望带来的社会福祉）玷污自己所在的领域。事实上，化学家和生物学家普遍支持成功禁止化学及生物武器的国际协议，大多数物理学家都支持禁止空间核武器和激光致盲武器的条约。


    总而言之，我们相信，人工智能在很多方面有极大潜力为人类造福，这也应当是本研究领域的目标。掀起一场军事人工智能军备竞赛是个糟糕的主意，应当对无人控制的进攻性自主武器加以禁止。


    2015年，在布宜诺斯艾利斯召开的人工智能大会开幕式上，这封信向媒体公布。略微出乎我们意料的是，这一举动成了世界各地的头条新闻。《纽约时报》、《华盛顿邮报》、英国广播公司、CNN等许多主要新闻媒体都对此做了报道，这有助于在联合国和其他地方推动此议题。


    但并不是所有人都认为，世界能靠着禁令变成一个更美好的地方。他们说：“机器人比人类更擅长打仗。就让机器人跟机器人去打仗吧，人类别掺和了。”在我看来，这些观点经不起仔细审视。我想逐一批驳5种反对禁止杀手机器人的意见，解释它们为什么会造成误导。


    ### 反对意见#1：机器人更有效


    机器人肯定会更有效率。它们不需要睡觉，不需要休息和恢复时间，不需要长期训练，也不在乎极寒或极热条件。总而言之，它们会成为理想的士兵。但它们不会更有效，至少现在不成。根据一份针对美军在兴都库什地区反塔利班和基地组织军事行动的调查，10个死于无人机袭击的人，有近9个都不是直接目标。而且，在这个循环里，是人在最终作出生死决定。


    人工智能当前所采用的方法，既没有情境意识，也不具备人类无人机飞行员的决策能力。因此，如果无人机完全自主化，统计数据可能会更糟。随着时间的流逝，它们会变得更好，我认为它们必然能够达到甚至超过人类飞行员的水平。届时，针对它们的效力，可能会出现不同的看法。战争的历史，基本上就在于哪一方能更有效地杀死另一方。对人类而言，这通常不是件好事。


    ### 反对意见#2：机器人更符合道德规范


    我听到的另一条反对意见是，在战争中，机器人会比人类更符合伦理道德规范。在我看来，这是一条反对禁令中最有趣也最严肃的意见，需要最为全面的考量。在作战带来的恐怖气氛下，人类犯下了许多暴行，机器人可以遵循准确的规则行事。然而，说我们知道怎样建立符合道德的机器人，可谓是异想天开。像我这样的人工智能研究员，才刚刚开始担心人怎样编写程序，让计算机的行为符合道德，光是这恐怕就要用上几十年的时间。就算等我们把这件事做到了，也没有任何计算机不能被人“黑”掉，做出不符合我们期望的行为。


    今天的机器人无法按照战争要求，根据国际规则进行区分：如区分战斗人员和平民，并按相应方式行事，等等。机器人战争可能比我们今天打的战争更令人不快。自主武器必定会落在那些罔顾战争规则的人手里，他们会冷血地对机器编程，使之无差别地攻击平民。不管多么令人难受，多么不讲道德，机器人都将是始终遵守命令的完美恐怖武器。


    ### 反对意见#3：机器人可以只对付机器人


    在战场这种危险的地方，用机器人代替人类似乎是个好主意，但认为我们能让机器人光跟机器人作战，也是异想天开。世界上并没有哪个专门的地方叫作“战场”。我们在城市里打仗，不幸死在双方交火里的平民太多太多。今天，在叙利亚和其他一些地方，世界仍在哀伤地见证这一点。


    今天的战争也往往是不对称的，很多时候，对手是恐怖分子和流氓国家。他们可不会注册参加仅限于机器人之间进行的比赛。没错，确实有人提出，无人机远程释放的恐怖，有可能加剧了当今世界的许多冲突。无人机如雨水一般洒播死亡，他们只能以无差别恐怖袭击的方式来回应。躲在白宫避难所里的美国总统或许可以轻率地认为，战争可以远程进行，讽刺的是，使用无人机作战，有可能让我们更深地卷入部分冲突，不得不痛苦而艰难地做出“派遣地面部队”的决策。


    ### 反对意见#4：自主武器已经存在，且为必需


    诚然，世界各地的军队已经在使用具有不同程度自主权的武器系统。许多海军舰艇上的方阵反导弹系统就是自主的，这是件好事。面对飞来的超音速导弹，你没时间作出人为决策来进行自我防御，但是“方阵”（Phalanx）是一套防御系统。我们的公开信并未要求禁止防御系统而要求禁止的是进攻性自主武器。


    你可以说，当今的战场上同样存在进攻性自主武器。例如，英国皇家空军的“硫黄石”地面攻击导弹（Brimstone fire-and-forget，发射后自动寻址）就是在目标区域之外，从喷气式飞机或无人驾驶飞行器上发射的。它使用高功率雷达，在指定区域内寻找目标（如附近的非友军等），甚至可以识别所攻击目标的最佳位置，确保摧毁。它一次性可在空中发射多达24枚导弹，瞄准系统使用算法确保导弹以交错方式击中目标，而不是同时击中相同目标。


    但就算已经存在这样的武器系统，也不能成为不被禁止的理由。过去，世界就是这么做的。生化武器是遭到禁止的，尽管大量的冲突中使用过它们。同样，反步兵地雷也遭到了禁止，尽管这样的地雷已经有了数百万枚。这里，我们能够做些明智的事情，赶在自主武器落入坏人手里之前，禁止它们。


    ### 反对意见#5：武器禁令不管用


    但有人说，虽然禁止这些武器是一件好事，禁令实际上并不奏效。好在历史为这一反对意见提供了几个反例。1998年的《关于激光致盲武器的议定书》，把激光致盲武器挡在了战场之外。今天，就算你前往叙利亚或世界上任何一个战区，你都不会找到这种武器。在世界上的任何地方，都不会有军火公司贩卖这种武器。有趣的是，禁令实施之前，两家军火公司（有一家来自美国）曾宣布打算出售激光致盲武器。而在联合国议定书公布之后，两家公司都再无举动。支持激光致盲武器的技术已经发明出来，你没办法取消了，但为它加上一道封印，足以挡住军火公司的步伐。


    我希望自主武器也能如此。技术已经发明出来了，我们没法取消，但如果能把它们狠狠地钉上耻辱柱，它们就不会在战场上部署。照我的想象，对于此类武器，任何禁令都能避免它们的部署（尽管不见得能阻止它们开发）。就算只是部分有效的禁令，也很值得一试。虽然1997年出台了《渥太华条约》，反步兵地雷仍然存在至今。但4000万枚此类地雷得以摧毁，因为误踩地雷而失去四肢甚至丢掉性命的孩子少了许多，这让世界变得更加安全。


    ### 禁令怎样发挥作用


    如果出现针对自主武器的部署禁令，我认为甚至不需要设立特别的监管机构进行监督。和其他许多禁用武器一样，诸如“人权观察”等非政府组织会出手监督，此外还有外交及财政压力，以及在国际法院遭到起诉的威胁。这些途径足以执行其他武器条约，我希望对自主武器也足够。


    我还希望，条约不必对致命性自主武器做出非常准确的定义。联合国《关于激光致盲武器的议定书》并未界定致盲激光的波长或瓦数。同样，1970年的联合国《不扩散核武器条约》也并未正式界定什么是核武器。这可以说是一件好事，因为它能把尚未发明出来的设备涵盖在内。我怀疑，今天很难准确地界定什么是“自主”“有意义的人类控制”等外交讨论术语。就算能拿出定义来，也很快会遭到技术的淘汰。


    我希望在国际共识下出现一套非正式的含蓄定义。我猜，它将允许当代武器系统（如英国皇家空军的“硫黄石”地面攻击导弹）的使用，但会对更复杂的自主武器类型划出界限，尤其是那些发射后数分钟或数小时内都具备自主性的武器系统。两者之间必定会出现一条线，即使这条线从未得到准确的界定，但我们可以把大多数武器系统清楚地放在线的这一边或那一边。这应该足以让条约具备效力了。


    另一项挑战是有些技术可以轻松地重新定位。简单的软件更新，就能把并不自主也不致命的系统变成致命的自主武器。所以，要禁止杀手机器人是很难的。此外，我们想要能促成自主武器的技术，它们跟自动驾驶汽车所采用的技术基本上是相同的，而且大部分已经问世。但只因为某件事很难禁止，并不意味着我们不应该尝试。哪怕是部分有效的禁令，也值得一试。


    哪怕有了行之有效的禁令，我们的军队也能够、也应该继续从事人工智能研究。人工智能在军事领域大有可为。比如，机器人可用于清除雷区。我们不应该让任何人拿生命（或手脚四肢）去冒险，这是一件完全属于机器人的工作。再比如，自动驾驶卡车可以携带补给物资通过争议地区。还是那句话，我们不应该让任何人拿性命冒险，去做一件机器能很好完成的工作。人工智能还可以对海量的信号情报进行筛选，帮忙打赢战斗，挽救生命。纯粹的防御性自主武器，如方阵反导弹系统，有很大可能得到继续开发和部署。这些都是有待人工智能完成的好事，但永远不该让机器决定人的生死。归根结底，我们必须铭记、尊重自己的人性。生死抉择必须，也只能由人来定夺。


    ### 杀手机器人@联合国


    2012年10月，包括“人权观察”（Human Rights Watch）、“第36条”（Article 36）和“帕格沃什会议”（Pugwash Conference）等非政府组织发起了“阻止杀手机器人运动”（Campaign
    to Stop Killer Robots）。[^(\[13\])](#chapter001_0009.xhtml#m13)这促使该问题获得联合国的关注和帮助。2013年11月，前联合国秘书长潘基文在《关于武装冲突中对平民的保护》的报告（*the
    Protection of Civilians in Armed Conflict*）中提及了“杀手机器人”。他的报告就这类系统能否按照国际人道主义和人权法行事提出了怀疑。不久后，在《特定常规武器公约》（*Convention
    on Certain Conventional Weapons*）的框架下，联合国在日内瓦对禁令的可行性展开了讨论。'
  fmt: '

    牛津报告认为，动物学家的工作有30%的自动化概率。相比之下，其他大多数类型的科学家在1%至2%左右。有趣的是，动物学恰好是机器学习所用的训练集合的一部分。在初始训练集合中，弗雷和奥斯本将动物学家标注为“不易于自动化”。虽然这套机器学习算法的输入不是1就是0（易于自动化，或不易于自动化），但其输出的是一个0到1之间的概率。他们的机器学习程序并不会把输入0自动映射为概率0，或是把输入1映射为概率1。就动物学家的例子来说，机器学习算法把输入0映射为了0.30的概率。我认为，弗雷和奥斯本是对的，分类机制有误。很难想到出于什么理由，动物学家会比其他生物科学家更容易自动化。


    训练集合里还包括了另外几种分类程序给出不同结果的岗位。更确切地说，在训练集合的70种工作中，分类机制分类错误的占7%。例如，训练集合里的服务员，标记是不易于自动化，而分类机制认为服务员的自动化概率为95%。这一次，我仍然认同训练集合。端着若干盘子穿过繁忙的餐厅，这不是机器人很快能做到的事。就算它们做得到，这也是一份低薪工作，采用自动化太过昂贵。另外，这还是一份极为强调人际关系的工作。如果机器人告诉我们今晚的鱼味道棒，是特色菜，我们会相信它吗？


    这些差异表明，我们应该谨慎对待弗雷和奥斯本计算出来的自动化危及的工作岗位预估数字。我们当然不能说美国的就业岗位比澳大利亚的受到更大的自动化威胁，因为该分析认为，美国有47%的工作有自动化风险，澳大利亚仅为40%[^(\[12\])](#chapter001_0009.xhtml#m12)——这么说只是想让数字显得更准确些罢了。然而，毫无疑问，相当大一部分工作受到了威胁。


    ## 从革命中生存下来


    从个人层面上来说，从这场革命中生存下来的策略之一，是找一份我所谓的“开放”工作。有固定工作量的属于封闭工作。例如，打扫道路是封闭工作。要打扫的道路，长度固定；一旦机器人可以打扫道路（未来几十年，它们有很大概率能够这么做），道路清洁工人的工作就消失了。相比之下，开放工作会随着自动化而扩展。比方说，科学研究是一项开放工作。对科学家来说，能自动化工作的工具只会帮你做更多的科学研究，你可以更快速地推进知识的疆域。显然，如果你希望从这场革命中生存下来，你肯定想从事开放工作。


    一些工作既不完全开放，也不完全封闭。以卡车司机为例。如果我们自动驾驶，送货成本可能会下降，这将扩大经济，创造更多的送货需求。此外，从前太过昂贵的任务能获得可行性。遗憾的是，这很可能只为自动驾驶卡车创造更多工作。人力驾驶太贵，太不安全，无法承担这些新多出来的额外工作。


    教育是一个必然会出现改变的领域——教育日益专业化。我们对专业知识越学越多，但专业本身所涵盖的范围却越来越窄。当然，人想要知道的东西也越来越多，所以，我们需要保持专注，推进一切知识领域的疆域。然而，大部分的专业知识也迅速过时，因此，更新知识、学习新技能，成为许多人的终身任务。为了对此作出回应，教育必须减少专业化倾向，它得把不会过时的基本技能教给我们，它应该教会我们怎样在之后的人生里迅速掌握新技能。人工智能会成为这道药方的一部分。大量的开放在线课程（MOOCs），依靠帮助人学习的人工智能机器人，协助人在整个工作生涯中开展自我教育。


    ## 机会“金三角”


    你应该学习什么样的技能和知识，维持对机器的竞争力呢？我在这里的建议是，要朝着我所说的“机会金三角”前进，占据一个或一个以上的角。一个角里是精通技术的极客，做个发明未来的人。让计算机自己编程，仍然是件极具挑战性的事情；创造新颖的未来，对计算机同样也极具挑战性。做一个能这样做的人。


    当然，不是所有人都喜欢编程，也不是所有人都能成为优秀的程序员，这就跟不是所有人都能成为优秀的乐手一样。成为游戏程序员所需的技能，或许牵涉到很大的遗传因素。如果你不是程序员，我建议你去另外两个角。


    机会金三角的第三个也是最后一个角，是创作人和工匠。生活里自动化场景越来越多，却有可能让人产生一种反应：对人工制造的东西更加欣赏。事实上，时尚潮流似乎正在迎接这一趋势。地球上最古老的工种，比如木匠这一类，说不定也是最牢靠的饭碗，我认为这相当讽刺。故此，锁定饭碗的另一个机会是开发创造力，学习若干手工技能——制作传统奶酪、写小说、组乐队。毫无疑问，计算机也可以拥有创意，但这对它们仍然是一个存在挑战的领域。此外，社会选择更为重视那些带着“手工制作”标签的东西。经济学家会让我们相信，市场会对此给予回应。


    ## 人工智能和战争


    战场，是人工智能注定要彻底改变我们生活的一个领域。开发机器人，对军方来说有着诸多吸引力。机器人不需要睡觉，不需要吃饭，可以全天候战斗；使用机器人可以确保人类不受伤害；机器人严格遵守命令，速度快，准确度高。把战场引入人工智能称为第三次战争革命（前两次分别是火药的发明和核武器的出现），也就不足为奇了，这将是我们干掉对手在速度和效率上的另一场巨变。


    能杀人的机器人，其技术名称叫“致命性自主武器”。不过，媒体经常使用另一个更令人回味的说法：“杀手机器人”。这个名字可能会让你联想到来自同名电影里的“终结者”。其实，如果你还记得电影的故事情节，你会发现，“终结者”是2029年启动的。但现实当中，杀手机器人的启动要简单得多，最多再过几年。以“捕食者”无人机和它所携带的“地狱火”导弹为例。如今，计算机已经取代了人类飞行员，这是一个小小的技术飞跃。英国国防部表示，如今在技术上用计算机控制此类武器已经是可行的了。我表示认同。


    不过，杀手机器人的开发，不会止步于捕食者的自主版本。现在的机器人还很原始粗糙，未来会出现一场改善机器人的军备竞赛。终点必然是电影《终结者》所想象的那种可怕技术，好莱坞在这部分上猜得没错。和摩尔定律一样，我们可能看到自主武器的性能呈指数增长。为了提醒我们它将在哪里结束，我把这叫作“施瓦辛格定律”。


    挑战之一是杀手机器人将会变得廉价，而且只会变得更廉价。只要看看过去几年无人机价格下降的速度就知道了。它们制造起来也会更容易，哪怕不甚完善。你可以给自己买一架四轴飞行器，外加一部手机、一枚炸弹。接下来，你只需要找个像我这样的人，给你写一款能瞄准、跟踪、干掉敌人的软件就行了。军队会喜欢这一套的，至少最初会喜欢：它们不需要睡觉和休息，不需要漫长而昂贵的训练，损坏了也不需要从战场上疏散。


    一旦我们在战斗中使用武器系统，我们必然预料到对方会迅速掌握它，并还治于我方。只要我们的军队想要保护自己，免受这些机器人所伤，他们对此类武器的合法性认识就会有所改变。杀手机器人将拉低战争的障碍，它们让人得以进一步远离战场，从而把战争变成逼真的电子游戏。


    自主武器将破坏当下的地缘政治秩序。过去，国家的军事力量在很大程度上取决于经济实力。军事优势取决于国家征募、维持大量士兵的能力。国家也需要以某种方式让部队遵从国家意愿，说服也好，胁迫也好。反过来说，有了自主武器，只需要少数人，就可以控制一支大规模部队。于是，独裁者就更容易把个人意志强加给全国人民。对美国这样的超级大国来说，要在全世界的热点地区巡逻就更为困难了。自主武器将破坏自“二战”结束以来建立的微妙势力平衡，我们的星球将变成一个更危险的地方。


    ## 禁止杀手机器人


    出于这样的考虑，我认为我们必须对自主武器加以规范。如果我们希望对已经上路的军备竞赛加以限制，就必须在不远的未来赶紧下手。其他许多了解技术的人士也认同这一观点。2015年7月，我帮助拟发了一封公开信，要求禁止自主武器。我们收集了1000多位人工智能及机器人研究员的签名，他们分别来自世界各地的大学，以及谷歌DeepMind、Facebook人工智能研究实验室和艾伦人工智能研究所（Allen
    Institute for AI）等商业实验室。今天，这封信已经有超过20000个签名，包括史蒂芬·霍金、埃隆·马斯克、诺姆·乔姆斯基（Noam Chomsky）等著名人物。但在我看来，最值得注意的一点在于，人工智能和机器人领域的许多知名研究员也签了名。


    **2015年7月的公开信**


    无须人为干预，自主武器就可选择并攻击目标。例如，这类武器可以包括武装四轴无人机，能搜索、消灭满足某些预设标准的人，但不包括需要人来作出瞄准决定的巡航导弹或遥控无人机。人工智能技术已经达到了在几年内部署此类系统（就算法律上不允许，技术上也是可行的）的程度，而且赌注极高：自主武器被称为火药与核武器之后的第三次战争革命。


    有许多观点，既支持自主武器，也反对它。举例来说，用机器取代人类士兵，好处是减少了伤亡，坏处是降低了作战门槛。对人类而言，今天的关键问题是，是要拉开全球人工智能军备竞赛，还是阻止它。如果有重要军事强国推动人工智能武器发展，全球军备竞赛实际上就不可避免，而这一技术轨迹的终点显而易见：自主武器将成为明天的AK-47。与核武器不同，它们不需要昂贵或难以获得的原材料，故此，它们将变得无处不在，而且十分廉价，因为任何重要军事力量都能进行大规模生产。它们出现在黑市上，落到恐怖分子或者希望更好地控制民众的独裁者、想进行种族清洗的军阀手里，只会是个时间问题。自主武器是完成暗杀、颠覆国家、压制民众、选择性地清除特定种族等任务的理想工具。因此，我们认为，军事人工智能军备竞赛不会造福人类。有许多种方法，都可以让人工智能把战场变得对人类（尤其是平民）更安全，又不成为杀人的新工具。


    正如大多数化学家和生物学家对制造化学或生物武器毫无兴趣，大多数人工智能研究员也对制造人工智能武器毫无兴趣，同时不希望有其他人这么做（令公众强烈反对人工智能、妨碍人工智能有望带来的社会福祉）玷污自己所在的领域。事实上，化学家和生物学家普遍支持成功禁止化学及生物武器的国际协议，大多数物理学家都支持禁止空间核武器和激光致盲武器的条约。


    总而言之，我们相信，人工智能在很多方面有极大潜力为人类造福，这也应当是本研究领域的目标。掀起一场军事人工智能军备竞赛是个糟糕的主意，应当对无人控制的进攻性自主武器加以禁止。


    2015年，在布宜诺斯艾利斯召开的人工智能大会开幕式上，这封信向媒体公布。略微出乎我们意料的是，这一举动成了世界各地的头条新闻。《纽约时报》、《华盛顿邮报》、英国广播公司、CNN等许多主要新闻媒体都对此做了报道，这有助于在联合国和其他地方推动此议题。


    但并不是所有人都认为，世界能靠着禁令变成一个更美好的地方。他们说：“机器人比人类更擅长打仗。就让机器人跟机器人去打仗吧，人类别掺和了。”在我看来，这些观点经不起仔细审视。我想逐一批驳5种反对禁止杀手机器人的意见，解释它们为什么会造成误导。


    ## 反对意见#1：机器人更有效


    机器人肯定会更有效率。它们不需要睡觉，不需要休息和恢复时间，不需要长期训练，也不在乎极寒或极热条件。总而言之，它们会成为理想的士兵。但它们不会更有效，至少现在不成。根据一份针对美军在兴都库什地区反塔利班和基地组织军事行动的调查，10个死于无人机袭击的人，有近9个都不是直接目标。而且，在这个循环里，是人在最终作出生死决定。


    人工智能当前所采用的方法，既没有情境意识，也不具备人类无人机飞行员的决策能力。因此，如果无人机完全自主化，统计数据可能会更糟。随着时间的流逝，它们会变得更好，我认为它们必然能够达到甚至超过人类飞行员的水平。届时，针对它们的效力，可能会出现不同的看法。战争的历史，基本上就在于哪一方能更有效地杀死另一方。对人类而言，这通常不是件好事。


    ## 反对意见#2：机器人更符合道德规范


    我听到的另一条反对意见是，在战争中，机器人会比人类更符合伦理道德规范。在我看来，这是一条反对禁令中最有趣也最严肃的意见，需要最为全面的考量。在作战带来的恐怖气氛下，人类犯下了许多暴行，机器人可以遵循准确的规则行事。然而，说我们知道怎样建立符合道德的机器人，可谓是异想天开。像我这样的人工智能研究员，才刚刚开始担心人怎样编写程序，让计算机的行为符合道德，光是这恐怕就要用上几十年的时间。就算等我们把这件事做到了，也没有任何计算机不能被人“黑”掉，做出不符合我们期望的行为。


    今天的机器人无法按照战争要求，根据国际规则进行区分：如区分战斗人员和平民，并按相应方式行事，等等。机器人战争可能比我们今天打的战争更令人不快。自主武器必定会落在那些罔顾战争规则的人手里，他们会冷血地对机器编程，使之无差别地攻击平民。不管多么令人难受，多么不讲道德，机器人都将是始终遵守命令的完美恐怖武器。


    ## 反对意见#3：机器人可以只对付机器人


    在战场这种危险的地方，用机器人代替人类似乎是个好主意，但认为我们能让机器人光跟机器人作战，也是异想天开。世界上并没有哪个专门的地方叫作“战场”。我们在城市里打仗，不幸死在双方交火里的平民太多太多。今天，在叙利亚和其他一些地方，世界仍在哀伤地见证这一点。


    今天的战争也往往是不对称的，很多时候，对手是恐怖分子和流氓国家。他们可不会注册参加仅限于机器人之间进行的比赛。没错，确实有人提出，无人机远程释放的恐怖，有可能加剧了当今世界的许多冲突。无人机如雨水一般洒播死亡，他们只能以无差别恐怖袭击的方式来回应。躲在白宫避难所里的美国总统或许可以轻率地认为，战争可以远程进行，讽刺的是，使用无人机作战，有可能让我们更深地卷入部分冲突，不得不痛苦而艰难地做出“派遣地面部队”的决策。


    ## 反对意见#4：自主武器已经存在，且为必需


    诚然，世界各地的军队已经在使用具有不同程度自主权的武器系统。许多海军舰艇上的方阵反导弹系统就是自主的，这是件好事。面对飞来的超音速导弹，你没时间作出人为决策来进行自我防御，但是“方阵”（Phalanx）是一套防御系统。我们的公开信并未要求禁止防御系统而要求禁止的是进攻性自主武器。


    你可以说，当今的战场上同样存在进攻性自主武器。例如，英国皇家空军的“硫黄石”地面攻击导弹（Brimstone fire-and-forget，发射后自动寻址）就是在目标区域之外，从喷气式飞机或无人驾驶飞行器上发射的。它使用高功率雷达，在指定区域内寻找目标（如附近的非友军等），甚至可以识别所攻击目标的最佳位置，确保摧毁。它一次性可在空中发射多达24枚导弹，瞄准系统使用算法确保导弹以交错方式击中目标，而不是同时击中相同目标。


    但就算已经存在这样的武器系统，也不能成为不被禁止的理由。过去，世界就是这么做的。生化武器是遭到禁止的，尽管大量的冲突中使用过它们。同样，反步兵地雷也遭到了禁止，尽管这样的地雷已经有了数百万枚。这里，我们能够做些明智的事情，赶在自主武器落入坏人手里之前，禁止它们。


    ## 反对意见#5：武器禁令不管用


    但有人说，虽然禁止这些武器是一件好事，禁令实际上并不奏效。好在历史为这一反对意见提供了几个反例。1998年的《关于激光致盲武器的议定书》，把激光致盲武器挡在了战场之外。今天，就算你前往叙利亚或世界上任何一个战区，你都不会找到这种武器。在世界上的任何地方，都不会有军火公司贩卖这种武器。有趣的是，禁令实施之前，两家军火公司（有一家来自美国）曾宣布打算出售激光致盲武器。而在联合国议定书公布之后，两家公司都再无举动。支持激光致盲武器的技术已经发明出来，你没办法取消了，但为它加上一道封印，足以挡住军火公司的步伐。


    我希望自主武器也能如此。技术已经发明出来了，我们没法取消，但如果能把它们狠狠地钉上耻辱柱，它们就不会在战场上部署。照我的想象，对于此类武器，任何禁令都能避免它们的部署（尽管不见得能阻止它们开发）。就算只是部分有效的禁令，也很值得一试。虽然1997年出台了《渥太华条约》，反步兵地雷仍然存在至今。但4000万枚此类地雷得以摧毁，因为误踩地雷而失去四肢甚至丢掉性命的孩子少了许多，这让世界变得更加安全。


    ## 禁令怎样发挥作用


    如果出现针对自主武器的部署禁令，我认为甚至不需要设立特别的监管机构进行监督。和其他许多禁用武器一样，诸如“人权观察”等非政府组织会出手监督，此外还有外交及财政压力，以及在国际法院遭到起诉的威胁。这些途径足以执行其他武器条约，我希望对自主武器也足够。


    我还希望，条约不必对致命性自主武器做出非常准确的定义。联合国《关于激光致盲武器的议定书》并未界定致盲激光的波长或瓦数。同样，1970年的联合国《不扩散核武器条约》也并未正式界定什么是核武器。这可以说是一件好事，因为它能把尚未发明出来的设备涵盖在内。我怀疑，今天很难准确地界定什么是“自主”“有意义的人类控制”等外交讨论术语。就算能拿出定义来，也很快会遭到技术的淘汰。


    我希望在国际共识下出现一套非正式的含蓄定义。我猜，它将允许当代武器系统（如英国皇家空军的“硫黄石”地面攻击导弹）的使用，但会对更复杂的自主武器类型划出界限，尤其是那些发射后数分钟或数小时内都具备自主性的武器系统。两者之间必定会出现一条线，即使这条线从未得到准确的界定，但我们可以把大多数武器系统清楚地放在线的这一边或那一边。这应该足以让条约具备效力了。


    另一项挑战是有些技术可以轻松地重新定位。简单的软件更新，就能把并不自主也不致命的系统变成致命的自主武器。所以，要禁止杀手机器人是很难的。此外，我们想要能促成自主武器的技术，它们跟自动驾驶汽车所采用的技术基本上是相同的，而且大部分已经问世。但只因为某件事很难禁止，并不意味着我们不应该尝试。哪怕是部分有效的禁令，也值得一试。


    哪怕有了行之有效的禁令，我们的军队也能够、也应该继续从事人工智能研究。人工智能在军事领域大有可为。比如，机器人可用于清除雷区。我们不应该让任何人拿生命（或手脚四肢）去冒险，这是一件完全属于机器人的工作。再比如，自动驾驶卡车可以携带补给物资通过争议地区。还是那句话，我们不应该让任何人拿性命冒险，去做一件机器能很好完成的工作。人工智能还可以对海量的信号情报进行筛选，帮忙打赢战斗，挽救生命。纯粹的防御性自主武器，如方阵反导弹系统，有很大可能得到继续开发和部署。这些都是有待人工智能完成的好事，但永远不该让机器决定人的生死。归根结底，我们必须铭记、尊重自己的人性。生死抉择必须，也只能由人来定夺。


    ## 杀手机器人@联合国


    2012年10月，包括“人权观察”（Human Rights Watch）、“第36条”（Article 36）和“帕格沃什会议”（Pugwash Conference）等非政府组织发起了“阻止杀手机器人运动”（Campaign
    to Stop Killer Robots）。[^(\[13\])](#chapter001_0009.xhtml#m13)这促使该问题获得联合国的关注和帮助。2013年11月，前联合国秘书长潘基文在《关于武装冲突中对平民的保护》的报告（*the
    Protection of Civilians in Armed Conflict*）中提及了“杀手机器人”。他的报告就这类系统能否按照国际人道主义和人权法行事提出了怀疑。不久后，在《特定常规武器公约》（*Convention
    on Certain Conventional Weapons*）的框架下，联合国在日内瓦对禁令的可行性展开了讨论。

    '
  trans: '


    牛津报告认为，动物学家的工作有 30%的自动化概率。相比之下，其他大多数类型的科学家在 1%至 2%左右。有趣的是，动物学恰好是机器学习所用的训练集合的一部分。在初始训练集合中，弗雷和奥斯本将动物学家标注为“不易于自动化”。虽然这套机器学习算法的输入不是
    1 就是 0（易于自动化，或不易于自动化），但其输出的是一个 0 到 1 之间的概率。他们的机器学习程序并不会把输入 0 自动映射为概率 0，或是把输入 1
    映射为概率 1。就动物学家的例子来说，机器学习算法把输入 0 映射为了 0.30 的概率。我认为，弗雷和奥斯本是对的，分类机制有误。很难想到出于什么理由，动物学家会比其他生物科学家更容易自动化。


    训练集合里还包括了另外几种分类程序给出不同结果的岗位。更确切地说，在训练集合的 70 种工作中，分类机制分类错误的占 7%。例如，训练集合里的服务员，标记是不易于自动化，而分类机制认为服务员的自动化概率为
    95%。这一次，我仍然认同训练集合。端着若干盘子穿过繁忙的餐厅，这不是机器人很快能做到的事。就算它们做得到，这也是一份低薪工作，采用自动化太过昂贵。另外，这还是一份极为强调人际关系的工作。如果机器人告诉我们今晚的鱼味道棒，是特色菜，我们会相信它吗？


    这些差异表明，我们应该谨慎对待弗雷和奥斯本计算出来的自动化危及的工作岗位预估数字。我们当然不能说美国的就业岗位比澳大利亚的受到更大的自动化威胁，因为该分析认为，美国有
    47%的工作有自动化风险，澳大利亚仅为 40%[^(\[12\])](#chapter001_0009.xhtml#m12)——这么说只是想让数字显得更准确些罢了。然而，毫无疑问，相当大一部分工作受到了威胁。


    ## 从革命中生存下来


    从个人层面上来说，从这场革命中生存下来的策略之一，是找一份我所谓的“开放”工作。有固定工作量的属于封闭工作。例如，打扫道路是封闭工作。要打扫的道路，长度固定；一旦机器人可以打扫道路（未来几十年，它们有很大概率能够这么做），道路清洁工人的工作就消失了。相比之下，开放工作会随着自动化而扩展。比方说，科学研究是一项开放工作。对科学家来说，能自动化工作的工具只会帮你做更多的科学研究，你可以更快速地推进知识的疆域。显然，如果你希望从这场革命中生存下来，你肯定想从事开放工作。


    一些工作既不完全开放，也不完全封闭。以卡车司机为例。如果我们自动驾驶，送货成本可能会下降，这将扩大经济，创造更多的送货需求。此外，从前太过昂贵的任务能获得可行性。遗憾的是，这很可能只为自动驾驶卡车创造更多工作。人力驾驶太贵，太不安全，无法承担这些新多出来的额外工作。


    教育是一个必然会出现改变的领域——教育日益专业化。我们对专业知识越学越多，但专业本身所涵盖的范围却越来越窄。当然，人想要知道的东西也越来越多，所以，我们需要保持专注，推进一切知识领域的疆域。然而，大部分的专业知识也迅速过时，因此，更新知识、学习新技能，成为许多人的终身任务。为了对此作出回应，教育必须减少专业化倾向，它得把不会过时的基本技能教给我们，它应该教会我们怎样在之后的人生里迅速掌握新技能。人工智能会成为这道药方的一部分。大量的开放在线课程（MOOCs），依靠帮助人学习的人工智能机器人，协助人在整个工作生涯中开展自我教育。


    ## 机会“金三角”


    你应该学习什么样的技能和知识，维持对机器的竞争力呢？我在这里的建议是，要朝着我所说的“机会金三角”前进，占据一个或一个以上的角。一个角里是精通技术的极客，做个发明未来的人。让计算机自己编程，仍然是件极具挑战性的事情；创造新颖的未来，对计算机同样也极具挑战性。做一个能这样做的人。


    当然，不是所有人都喜欢编程，也不是所有人都能成为优秀的程序员，这就跟不是所有人都能成为优秀的乐手一样。成为游戏程序员所需的技能，或许牵涉到很大的遗传因素。如果你不是程序员，我建议你去另外两个角。


    机会金三角的第三个也是最后一个角，是创作人和工匠。生活里自动化场景越来越多，却有可能让人产生一种反应：对人工制造的东西更加欣赏。事实上，时尚潮流似乎正在迎接这一趋势。地球上最古老的工种，比如木匠这一类，说不定也是最牢靠的饭碗，我认为这相当讽刺。故此，锁定饭碗的另一个机会是开发创造力，学习若干手工技能——制作传统奶酪、写小说、组乐队。毫无疑问，计算机也可以拥有创意，但这对它们仍然是一个存在挑战的领域。此外，社会选择更为重视那些带着“手工制作”标签的东西。经济学家会让我们相信，市场会对此给予回应。


    ## 人工智能和战争


    战场，是人工智能注定要彻底改变我们生活的一个领域。开发机器人，对军方来说有着诸多吸引力。机器人不需要睡觉，不需要吃饭，可以全天候战斗；使用机器人可以确保人类不受伤害；机器人严格遵守命令，速度快，准确度高。把战场引入人工智能称为第三次战争革命（前两次分别是火药的发明和核武器的出现），也就不足为奇了，这将是我们干掉对手在速度和效率上的另一场巨变。


    能杀人的机器人，其技术名称叫“致命性自主武器”。不过，媒体经常使用另一个更令人回味的说法：“杀手机器人”。这个名字可能会让你联想到来自同名电影里的“终结者”。其实，如果你还记得电影的故事情节，你会发现，“终结者”是
    2029 年启动的。但现实当中，杀手机器人的启动要简单得多，最多再过几年。以“捕食者”无人机和它所携带的“地狱火”导弹为例。如今，计算机已经取代了人类飞行员，这是一个小小的技术飞跃。英国国防部表示，如今在技术上用计算机控制此类武器已经是可行的了。我表示认同。


    不过，杀手机器人的开发，不会止步于捕食者的自主版本。现在的机器人还很原始粗糙，未来会出现一场改善机器人的军备竞赛。终点必然是电影《终结者》所想象的那种可怕技术，好莱坞在这部分上猜得没错。和摩尔定律一样，我们可能看到自主武器的性能呈指数增长。为了提醒我们它将在哪里结束，我把这叫作“施瓦辛格定律”。


    挑战之一是杀手机器人将会变得廉价，而且只会变得更廉价。只要看看过去几年无人机价格下降的速度就知道了。它们制造起来也会更容易，哪怕不甚完善。你可以给自己买一架四轴飞行器，外加一部手机、一枚炸弹。接下来，你只需要找个像我这样的人，给你写一款能瞄准、跟踪、干掉敌人的软件就行了。军队会喜欢这一套的，至少最初会喜欢：它们不需要睡觉和休息，不需要漫长而昂贵的训练，损坏了也不需要从战场上疏散。


    一旦我们在战斗中使用武器系统，我们必然预料到对方会迅速掌握它，并还治于我方。只要我们的军队想要保护自己，免受这些机器人所伤，他们对此类武器的合法性认识就会有所改变。杀手机器人将拉低战争的障碍，它们让人得以进一步远离战场，从而把战争变成逼真的电子游戏。


    自主武器将破坏当下的地缘政治秩序。过去，国家的军事力量在很大程度上取决于经济实力。军事优势取决于国家征募、维持大量士兵的能力。国家也需要以某种方式让部队遵从国家意愿，说服也好，胁迫也好。反过来说，有了自主武器，只需要少数人，就可以控制一支大规模部队。于是，独裁者就更容易把个人意志强加给全国人民。对美国这样的超级大国来说，要在全世界的热点地区巡逻就更为困难了。自主武器将破坏自“二战”结束以来建立的微妙势力平衡，我们的星球将变成一个更危险的地方。


    ## 禁止杀手机器人


    出于这样的考虑，我认为我们必须对自主武器加以规范。如果我们希望对已经上路的军备竞赛加以限制，就必须在不远的未来赶紧下手。其他许多了解技术的人士也认同这一观点。2015
    年 7 月，我帮助拟发了一封公开信，要求禁止自主武器。我们收集了 1000 多位人工智能及机器人研究员的签名，他们分别来自世界各地的大学，以及谷歌 DeepMind、Facebook
    人工智能研究实验室和艾伦人工智能研究所（Allen Institute for AI）等商业实验室。今天，这封信已经有超过 20000 个签名，包括史蒂芬·霍金、埃隆·马斯克、诺姆·乔姆斯基（Noam
    Chomsky）等著名人物。但在我看来，最值得注意的一点在于，人工智能和机器人领域的许多知名研究员也签了名。


    **2015 年 7 月的公开信**


    无须人为干预，自主武器就可选择并攻击目标。例如，这类武器可以包括武装四轴无人机，能搜索、消灭满足某些预设标准的人，但不包括需要人来作出瞄准决定的巡航导弹或遥控无人机。人工智能技术已经达到了在几年内部署此类系统（就算法律上不允许，技术上也是可行的）的程度，而且赌注极高：自主武器被称为火药与核武器之后的第三次战争革命。


    有许多观点，既支持自主武器，也反对它。举例来说，用机器取代人类士兵，好处是减少了伤亡，坏处是降低了作战门槛。对人类而言，今天的关键问题是，是要拉开全球人工智能军备竞赛，还是阻止它。如果有重要军事强国推动人工智能武器发展，全球军备竞赛实际上就不可避免，而这一技术轨迹的终点显而易见：自主武器将成为明天的
    AK-47。与核武器不同，它们不需要昂贵或难以获得的原材料，故此，它们将变得无处不在，而且十分廉价，因为任何重要军事力量都能进行大规模生产。它们出现在黑市上，落到恐怖分子或者希望更好地控制民众的独裁者、想进行种族清洗的军阀手里，只会是个时间问题。自主武器是完成暗杀、颠覆国家、压制民众、选择性地清除特定种族等任务的理想工具。因此，我们认为，军事人工智能军备竞赛不会造福人类。有许多种方法，都可以让人工智能把战场变得对人类（尤其是平民）更安全，又不成为杀人的新工具。


    正如大多数化学家和生物学家对制造化学或生物武器毫无兴趣，大多数人工智能研究员也对制造人工智能武器毫无兴趣，同时不希望有其他人这么做（令公众强烈反对人工智能、妨碍人工智能有望带来的社会福祉）玷污自己所在的领域。事实上，化学家和生物学家普遍支持成功禁止化学及生物武器的国际协议，大多数物理学家都支持禁止空间核武器和激光致盲武器的条约。


    总而言之，我们相信，人工智能在很多方面有极大潜力为人类造福，这也应当是本研究领域的目标。掀起一场军事人工智能军备竞赛是个糟糕的主意，应当对无人控制的进攻性自主武器加以禁止。


    2015 年，在布宜诺斯艾利斯召开的人工智能大会开幕式上，这封信向媒体公布。略微出乎我们意料的是，这一举动成了世界各地的头条新闻。《纽约时报》、《华盛顿邮报》、英国广播公司、CNN
    等许多主要新闻媒体都对此做了报道，这有助于在联合国和其他地方推动此议题。


    但并不是所有人都认为，世界能靠着禁令变成一个更美好的地方。他们说：“机器人比人类更擅长打仗。就让机器人跟机器人去打仗吧，人类别掺和了。”在我看来，这些观点经不起仔细审视。我想逐一批驳
    5 种反对禁止杀手机器人的意见，解释它们为什么会造成误导。


    ## 反对意见#1：机器人更有效


    机器人肯定会更有效率。它们不需要睡觉，不需要休息和恢复时间，不需要长期训练，也不在乎极寒或极热条件。总而言之，它们会成为理想的士兵。但它们不会更有效，至少现在不成。根据一份针对美军在兴都库什地区反塔利班和基地组织军事行动的调查，10
    个死于无人机袭击的人，有近 9 个都不是直接目标。而且，在这个循环里，是人在最终作出生死决定。


    人工智能当前所采用的方法，既没有情境意识，也不具备人类无人机飞行员的决策能力。因此，如果无人机完全自主化，统计数据可能会更糟。随着时间的流逝，它们会变得更好，我认为它们必然能够达到甚至超过人类飞行员的水平。届时，针对它们的效力，可能会出现不同的看法。战争的历史，基本上就在于哪一方能更有效地杀死另一方。对人类而言，这通常不是件好事。


    ## 反对意见#2：机器人更符合道德规范


    我听到的另一条反对意见是，在战争中，机器人会比人类更符合伦理道德规范。在我看来，这是一条反对禁令中最有趣也最严肃的意见，需要最为全面的考量。在作战带来的恐怖气氛下，人类犯下了许多暴行，机器人可以遵循准确的规则行事。然而，说我们知道怎样建立符合道德的机器人，可谓是异想天开。像我这样的人工智能研究员，才刚刚开始担心人怎样编写程序，让计算机的行为符合道德，光是这恐怕就要用上几十年的时间。就算等我们把这件事做到了，也没有任何计算机不能被人“黑”掉，做出不符合我们期望的行为。


    今天的机器人无法按照战争要求，根据国际规则进行区分：如区分战斗人员和平民，并按相应方式行事，等等。机器人战争可能比我们今天打的战争更令人不快。自主武器必定会落在那些罔顾战争规则的人手里，他们会冷血地对机器编程，使之无差别地攻击平民。不管多么令人难受，多么不讲道德，机器人都将是始终遵守命令的完美恐怖武器。


    ## 反对意见#3：机器人可以只对付机器人


    在战场这种危险的地方，用机器人代替人类似乎是个好主意，但认为我们能让机器人光跟机器人作战，也是异想天开。世界上并没有哪个专门的地方叫作“战场”。我们在城市里打仗，不幸死在双方交火里的平民太多太多。今天，在叙利亚和其他一些地方，世界仍在哀伤地见证这一点。


    今天的战争也往往是不对称的，很多时候，对手是恐怖分子和流氓国家。他们可不会注册参加仅限于机器人之间进行的比赛。没错，确实有人提出，无人机远程释放的恐怖，有可能加剧了当今世界的许多冲突。无人机如雨水一般洒播死亡，他们只能以无差别恐怖袭击的方式来回应。躲在白宫避难所里的美国总统或许可以轻率地认为，战争可以远程进行，讽刺的是，使用无人机作战，有可能让我们更深地卷入部分冲突，不得不痛苦而艰难地做出“派遣地面部队”的决策。


    ## 反对意见#4：自主武器已经存在，且为必需


    诚然，世界各地的军队已经在使用具有不同程度自主权的武器系统。许多海军舰艇上的方阵反导弹系统就是自主的，这是件好事。面对飞来的超音速导弹，你没时间作出人为决策来进行自我防御，但是“方阵”（Phalanx）是一套防御系统。我们的公开信并未要求禁止防御系统而要求禁止的是进攻性自主武器。


    你可以说，当今的战场上同样存在进攻性自主武器。例如，英国皇家空军的“硫黄石”地面攻击导弹（Brimstone fire-and-forget，发射后自动寻址）就是在目标区域之外，从喷气式飞机或无人驾驶飞行器上发射的。它使用高功率雷达，在指定区域内寻找目标（如附近的非友军等），甚至可以识别所攻击目标的最佳位置，确保摧毁。它一次性可在空中发射多达
    24 枚导弹，瞄准系统使用算法确保导弹以交错方式击中目标，而不是同时击中相同目标。


    但就算已经存在这样的武器系统，也不能成为不被禁止的理由。过去，世界就是这么做的。生化武器是遭到禁止的，尽管大量的冲突中使用过它们。同样，反步兵地雷也遭到了禁止，尽管这样的地雷已经有了数百万枚。这里，我们能够做些明智的事情，赶在自主武器落入坏人手里之前，禁止它们。


    ## 反对意见#5：武器禁令不管用


    但有人说，虽然禁止这些武器是一件好事，禁令实际上并不奏效。好在历史为这一反对意见提供了几个反例。1998 年的《关于激光致盲武器的议定书》，把激光致盲武器挡在了战场之外。今天，就算你前往叙利亚或世界上任何一个战区，你都不会找到这种武器。在世界上的任何地方，都不会有军火公司贩卖这种武器。有趣的是，禁令实施之前，两家军火公司（有一家来自美国）曾宣布打算出售激光致盲武器。而在联合国议定书公布之后，两家公司都再无举动。支持激光致盲武器的技术已经发明出来，你没办法取消了，但为它加上一道封印，足以挡住军火公司的步伐。


    我希望自主武器也能如此。技术已经发明出来了，我们没法取消，但如果能把它们狠狠地钉上耻辱柱，它们就不会在战场上部署。照我的想象，对于此类武器，任何禁令都能避免它们的部署（尽管不见得能阻止它们开发）。就算只是部分有效的禁令，也很值得一试。虽然
    1997 年出台了《渥太华条约》，反步兵地雷仍然存在至今。但 4000 万枚此类地雷得以摧毁，因为误踩地雷而失去四肢甚至丢掉性命的孩子少了许多，这让世界变得更加安全。


    ## 禁令怎样发挥作用


    如果出现针对自主武器的部署禁令，我认为甚至不需要设立特别的监管机构进行监督。和其他许多禁用武器一样，诸如“人权观察”等非政府组织会出手监督，此外还有外交及财政压力，以及在国际法院遭到起诉的威胁。这些途径足以执行其他武器条约，我希望对自主武器也足够。


    我还希望，条约不必对致命性自主武器做出非常准确的定义。联合国《关于激光致盲武器的议定书》并未界定致盲激光的波长或瓦数。同样，1970 年的联合国《不扩散核武器条约》也并未正式界定什么是核武器。这可以说是一件好事，因为它能把尚未发明出来的设备涵盖在内。我怀疑，今天很难准确地界定什么是“自主”“有意义的人类控制”等外交讨论术语。就算能拿出定义来，也很快会遭到技术的淘汰。


    我希望在国际共识下出现一套非正式的含蓄定义。我猜，它将允许当代武器系统（如英国皇家空军的“硫黄石”地面攻击导弹）的使用，但会对更复杂的自主武器类型划出界限，尤其是那些发射后数分钟或数小时内都具备自主性的武器系统。两者之间必定会出现一条线，即使这条线从未得到准确的界定，但我们可以把大多数武器系统清楚地放在线的这一边或那一边。这应该足以让条约具备效力了。


    另一项挑战是有些技术可以轻松地重新定位。简单的软件更新，就能把并不自主也不致命的系统变成致命的自主武器。所以，要禁止杀手机器人是很难的。此外，我们想要能促成自主武器的技术，它们跟自动驾驶汽车所采用的技术基本上是相同的，而且大部分已经问世。但只因为某件事很难禁止，并不意味着我们不应该尝试。哪怕是部分有效的禁令，也值得一试。


    哪怕有了行之有效的禁令，我们的军队也能够、也应该继续从事人工智能研究。人工智能在军事领域大有可为。比如，机器人可用于清除雷区。我们不应该让任何人拿生命（或手脚四肢）去冒险，这是一件完全属于机器人的工作。再比如，自动驾驶卡车可以携带补给物资通过争议地区。还是那句话，我们不应该让任何人拿性命冒险，去做一件机器能很好完成的工作。人工智能还可以对海量的信号情报进行筛选，帮忙打赢战斗，挽救生命。纯粹的防御性自主武器，如方阵反导弹系统，有很大可能得到继续开发和部署。这些都是有待人工智能完成的好事，但永远不该让机器决定人的生死。归根结底，我们必须铭记、尊重自己的人性。生死抉择必须，也只能由人来定夺。


    ## 杀手机器人@联合国


    2012 年 10 月，包括“人权观察”（Human Rights Watch）、“第 36 条”（Article 36）和“帕格沃什会议”（Pugwash
    Conference）等非政府组织发起了“阻止杀手机器人运动”（Campaign to Stop Killer Robots）。[^(\[13\])](#chapter001_0009.xhtml#m13)这促使该问题获得联合国的关注和帮助。2013
    年 11 月，前联合国秘书长潘基文在《关于武装冲突中对平民的保护》的报告（*the Protection of Civilians in Armed Conflict*）中提及了“杀手机器人”。他的报告就这类系统能否按照国际人道主义和人权法行事提出了怀疑。不久后，在《特定常规武器公约》（*Convention
    on Certain Conventional Weapons*）的框架下，联合国在日内瓦对禁令的可行性展开了讨论。


