    [\\[13\\]](#chapter001_0009.xhtml#w13) “人权观察”对武器禁令有一份出色的跟踪记录。“人权观察”是禁止使用反步兵地雷的《渥太华条约》背后的非政府组织之一，还参与了帮忙实施集束弹药禁令的“集束弹药联盟”。非政府组织“第36条”的名字得自《日内瓦公约》1977年的《第一附加议定书》。“第36条”要求各国审核新武器、战争的新手段和新方法，确保其符合国际法。一些国家（包括英国）认为这些审核也适用于控制致命性自主武器。然而，在这一方面，此类审核的历史，却没有给我什么信心。帕格沃什科学和世界事务会议，以科学的洞见和理性来论述核武器及其他大规模杀伤性武器给人类带来的威胁。1995年，他们获得了诺贝尔和平奖。（帕格沃什船长是一部英国动画片虚构出来的海盗，他有一位副手——有着儿童电视节目里最下流的名字。）\n\
    \n[\\[14\\]](#chapter001_0009.xhtml#w14) 博弈理论研究的是智能理性决策者之间冲突及合作的简单数学模型。人们一般认为约翰·冯·诺依曼是博弈理论之父。不过，博弈理论的部分概念至少可追溯到17世纪。1994年，约翰·纳什因为对博弈理论的研究，与他人同获诺贝尔经济学奖。同名电影和书《美丽心灵》对此作了记录。他的博士论文（也属于他获得诺贝尔奖的部分成就）着眼于非合作博弈理论，仅有20页的篇幅，只包含了两条引用。\n\
    \n# 第三部分  \n\n人工智能的未来\n\n## 第六章  \n\n技术变革\n\n说到预测未来，我们可以从过去学到很多东西。这不是人类社会第一次受到技术变革的严重干扰，大概也不会是最后一次。在本章，我将转向以下问题：我们可以从过去的技术变革中，学到哪些有关人工智能未来的事情呢？就算如今对人工智能的预测，只有极少部分正确，我们也将迎来一些社会、经济和生活上的巨大变化。历史能识别出哪些问题有可能随着思考机器的崛起向人类提出挑战吗？\n\
    \n1998年，人文学者兼作家尼尔·波兹曼（Neil Postman）在丹佛发表讲演，提出了他从过往技术变革中确认的五大重要教训。[\\[1\\]](#chapter001_0010_0001.xhtml#m1)这些教训，以他三十多年来对技术变革史的研究为基础。而我在这里要说的大部分内容，就来自波兹曼的睿智总结。他的五大教训很简单，大多数听上去也分外明显，但这并不能抵消它们的重要意义。\n\
    \n### 教训一：要付出代价\n\n波兹曼提出的第一条教训是，技术既有所予，也有所取。这是一笔和魔鬼做的交易，很多时候，面对它带来的每个优点，你都能找到相应的缺点，而且，优点并不必然超过缺点。事实上，技术造就的奇迹越多，负面后果也很可能越大。在审视思考机器的时候，我们应当持有这一清醒的认识，因为思考机器听起来就很奇妙。\n\
    \n波兹曼举了几个例子，说明过去的技术变革也曾付出代价。机动汽车给了我们机动能力，缩短了距离。但我们现在呼吸着废气，陷入了交通堵塞的汪洋大海，要应对汽车事故后果（有一些后果是致命的）。随着郊区大卖场慢慢杀死了市中心和它们所维持的社区，我们必须要问：汽车带来的优点，是否真的超过了这些不利之处？印刷媒体是另一项巨大的技术变革。它有助于传播知识和科学社会的发展，但它同样带来了代价。印刷机出力支持了独裁者、不宽容的宗教和种种令人不快的想法。\n\
    \n在问“新技术将会做些什么”的时候，波兹曼指出，我们还应该问，“新技术将抹杀些什么？”他认为，确切地说，提出第二个问题常常更为重要，因为提这个问题的人太少了。我们几乎从没发明过没有缺点的技术，实在要说的话，抗生素和眼镜几乎没有什么负面影响。但大多数新技术都涉及到这样那样的权衡。\n\
    \n思考机器的好处显而易见。它们会在许多智能任务上出力，它们会去完成危险、平凡和不愉快的工作，它们会比人类更有效也更高效地完成这些任务。在深入企业时，我的一些同事会使用一条简单的经验法则：如果你让计算机而不是人类来安排调遣公司的运营，该公司的效率至少能提高10%。除了效率的提高，计算机还增强了我们的能力，让我们在大量任务上变成了“超人”。有了象棋计算机，我们下象棋比从前光靠人下得好多了。有了能查询大量文献的机器助理，医学会进步得更快。机器能增强人类智能的例子还有很多。\n\
    \n但我们要为思考机器付出什么样的代价呢？前文已经提到了一些。它们将接管许多工作岗位：卡车司机、口译员、警卫、仓库拣货员等等，这些都属于机器将要取代人类完成的工作。思考机器还有可能损害我们的隐私，而且，它们可能会表现出歧视，有意或无意地侵蚀我们20世纪奋斗争取得来的许多权利。\n\
    \n还有其他的代价要付。人与人之间的接触可能会减少，在某些情况下，比如照料老人，这恐怕有害。在另一些情况下，它或许能改变我们的生活。较之现实世界，我们中的一些人可能会从充斥着人工智能的虚拟世界发现更多乐趣。不平等现象越演越烈，说不定是另一个代价。机器人的所有者，会变得更加富裕。而其他的人，则将落后得更远。但财富差距的扩大，不一定真的不可避免。我们可以改变社会的经济制度、税收和劳动法，防止这一幕出现。\n\
    \n### 教训二：不是所有人都会赢\n\n波兹曼提出的第二条是，会有赢家，也会有输家。不同的人，受新技术的影响是不一样的。赢家往往还试图开导输家，说所有的人都是真正的赢家。举例来说，我们许多人都受益于汽车的发明。但是铁匠、修驯马台的工匠、照管马匹的人，可没享受到什么益处。\n\
    \n举第二个例子，哈伯-博施法（通过氮气及氢气产生氨气NH[3]的过程）为世界带来了廉价肥料，全世界的农民成为直接的赢家，我们许多人也间接地成为赢家，因为我们得到了更为廉价的粮食。可输家也很多。在第一次世界大战中，德国使用该工艺制造炸弹，规避了盟军贸易封锁，而被这些炸药害死的无辜民众，就是输家。"
