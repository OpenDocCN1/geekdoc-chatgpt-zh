    Everest，也即埃佛勒斯峰。）1864年，布尔去大学讲课时下了雨，因为感冒病倒了。玛丽·埃佛勒斯是个顺势疗法医师，认为要顺势治疗才有利于布尔的病情。于是，她把丈夫裹上湿床单放在床上。许多人写道，她往患者身上一桶一桶地浇冷水，但这似乎是夸张说法。不管怎么说，布尔的病情恶化，毫无必要地死掉了。出于命运的偶然转折，布尔的曾曾孙之一杰弗里·埃佛勒斯·辛顿也将短暂地出现在我们的人工智能简史里，他是深度学习的顶尖领跑人。我在科克大学当教授期间，几乎每天都骑着自行车从布尔的房子旁绕过去，我总是想，要是他没有那么年轻就死去，他的理念将得到怎样的发展呢。'
