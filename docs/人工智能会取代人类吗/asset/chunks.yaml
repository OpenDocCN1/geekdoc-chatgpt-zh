  toc: []
- raw: "很难想到有什么新技术不曾带来输家。医学或许要算一个输家不多的领域。伴随着抗生素的发明，唯一输家恐怕是极少数感染了耐药性极强的“超级细菌”的不幸患者。除了医学之外，大多数新技术往往都会产生大量的输家（当然也有大量的赢家）。\n\
    \n那么，思考机器出现后，什么人会成为输家，什么人会成为赢家呢？答案取决于未来几十年我们对社会进行怎样的改造。如果我们什么都不做，技术专家会成为主要的赢家。至于我们其余的人，很多都会变成输家，因为技术失业下岗，甚至再也找不到工作——这就包括出租车司机、卡车司机、口译员、仓库分拣员、警卫，甚至记者和法律文书员。但结局不一定非如此不可。如果对税收制度、福利国家、养老保险和教育制度进行正确的改革，把压力全转移到机器人身上，那么，我们所有人都能成为赢家。\n\
    \n### 教训三：技术内嵌着强大的观念\n\n波兹曼提出的第三条教训是，每一种技术的出现，都伴随着强大观念的出现。这些观念常常是隐藏起来看不见的，但它们有可能导致极具颠覆性的后果。例如，书写带来的观念是：知识可以写下来，知识的分享可以跨越时间和空间。这就颠覆了从前的口头传统，即思想无法跨越时空口口相授。于是，记忆在大多数文化中丧失了重要性，故事日渐湮灭。电报的发明，蕴含着如下观念：信息可以即刻传递到世界各地。我们的视野迅速扩大，全球化拉开序幕。我们今天仍然体验着这一颠覆性观念带来的后遗效应。\n\
    \n那么思考机器的发明隐含着什么样的观念呢？这些想法有着什么样的实际颠覆性后果呢？第一个观念是，不光是人，机器也能够思考。这将破坏我们从前在地球上独一无二的地位，我们将不再是地球上最聪明的生物。哥白尼、达尔文等人也曾对人类的重要感提出了类似的警示。不过，在本例中，人类仍然可以为自己感到骄傲：思考机器是我们创造出来的。故此，冲击可能会得到缓解。\n\
    \n发明思考机器隐含的第二个观念是：莱布尼茨的设想没错，推理的确可以化简为计算，无非是符号的操作罢了。诚然，这些符号可能必须放回现实世界，但不管怎么说，这就是计算机也能做的事。如果这是正确的，它将带来极其深远的后果。它拔高了理性主义（笛卡儿、莱布尼茨等人开创的哲学学派把推理视为获取世界知识的一种途径）。反过来，这提出了事关人类道德和精神生活的深刻问题。\n\
    \n### 教训四：改变不是渐进的\n\n波兹曼提出的第四条教训是，技术变革往往不是增量变化。也就是说，它给生活带来的改变，不是小幅的、渐进的，它可能彻底改变我们生活的整个生态系统。电视的发明，不光为我们带来了一种对电台加以补充的全新信息广播方式，还彻底地改变了政治和娱乐生态系统。手机的发明，不光为我们带来了一种对座机加以补充的人际沟通方式，还彻底地改变了我们的工作和娱乐方式。这些新技术给生活带来的不是增量变化，它们深刻地改变了生活。\n\
    \n为此，波兹曼警告说，我们必须对技术创新保持警惕。技术变革的后果可能极为庞大，无法预测，基本上不可逆转。他警告说，我们尤其要当心资本家，这些人尝试把新技术用到极限，从根本上改变我们的文化。19世纪的这类例子是贝尔、爱迪生、福特和卡内基等以技术为动力的新生资本家。这些人（很遗憾，这些人全都是男性）推着我们从19世纪进入了20世纪。21世纪，这类人有可能是诸如贝佐斯、布林和扎克伯格等技术专家，他们淘汰旧技术，推出新技术。\n\
    \n那么，思考机器对我们的生态系统会有什么样的影响呢？这本书想要讨论的主要论点是：人工智能会影响我们生活中的几乎每个方面。而且它的效应不是增量式的，而是天翻地覆式的。人工智能将让工业、政治、教育和休闲发生彻底变化。事实上，我们很难说哪个领域能躲过人工智能带来的重大冲击。\n\
    \n### 教训五：新技术成为常态\n\n波兹曼提出的第五条，也是最后一条教训是：新技术将迅速成为天然秩序的一部分。正如我很难想象飞机、火车和汽车出现之前的世界，最年轻的一代人也很难想象智能手机和互联网出现之前的世界。竟然有过你没法上谷歌搜索问题、等公交时玩《愤怒小鸟》的时代，竟然还有过48小时都没法绕着地球飞一圈、通勤100千米去上班的时代。\n\
    \n波兹曼认为，这种把技术视为天然秩序的一部分的观点，有着危险性。也就是说，人们接受了技术原本的样子，于是很难去修改、规范它。现在，报纸要让人们为了内容掏腰包十分困难，如今的人都期待通过互联网免费获得内容。点对点传输软件Napster也曾在音乐领域造成过类似的危险局面。如今有人说互联网是基本权利，跟获得水和卫生设施的权利相当。\n\
    \n教皇约翰·保罗二世给梵蒂冈天文台主任写了一封信，就这个问题给出了几条很好的建议：“科学可以消除宗教中的错误与迷信，让它变得更为纯粹。宗教也可以消除科学里的偶像崇拜和虚假绝对性，让它变得更为纯粹。它们把彼此引入了一个更广阔的世界，两者都能在其中蓬勃发展。”如果我们不够谨慎，技术和它所做的“进步”承诺，就有可能变成虚假并且危险的宗教，跟真正的宗教一样。波兹曼建议，最好是把技术看成是“怪异的入侵者”。新技术不是天然秩序的一部分，而是人类创造力的产物，它们有可能为人类的状况带来进步和改善，也有可能做不到。新技术是用于行善还是作恶，完全有赖于我们自己的选择。人工智能是上述观点的精彩例子。思考机器有可能带来各种结果，有些好，有些坏。我们必须自己去选。\n\
    \n### 教训六：我们并不知道自己想要什么\n\n波兹曼对技术变革只提出了五条教训，但我想再加一条。人极其不擅长预测技术将把我们带向何方。因此，在期待哪些新技术会成功方面，我们表现得十分糟糕。亨利·福特说过一句名言：“如果我问人们想要什么，他们会说，想要更快的马。”[\\\
    [2\\]](#chapter001_0010_0001.xhtml#m2)\n\n这一教训的例子太多了。我可以再次提到那句据说出自托马斯·沃森之口的话：全世界只要6台计算机就够了。我还可以拿出激光的例子。激光的发明者之一查尔斯·汤斯（Charles\
    \ Townes）写道：\n\n事实是，我们这些从事第一批激光研究工作的人，没有一个设想过它最终能有多少种用途。这说明了一个再强调也不为过的关键点。当今的许多实用技术，来自十多年前的基础科学研究。参与这份事业的人，主要受好奇心的激励，常常对研究要通往什么地方摸不着头脑。对事物性质的基础探索能带来多少实际回报（类似的还有，了解当今的哪些研究途径是技术死胡同），我们的预测能力很糟糕。这引出了一点简单的事实：研究过程中所发现的新观念是真正新鲜的。[^(\\\
    [3\\])](#chapter001_0010_0001.xhtml#m3)\n\n很难想象当今会有哪家研究机构划拨一笔研究资金，说要研究光波共振，以求改变购物体验。但激光发明后，出现了条码扫描仪，的确改变了我们的购物体验。激光还改变了生活的许多其他方面，包括手术、焊接、印刷和显微镜。很难想象当年有什么人能预测到研究光波共振为生活带来的变化是这么大。\n\
    \n20世纪90年代初，我的一位在欧洲核子研究中心（CERN）工作的朋友，讲述了一个预测技术变革是多么棘手的故事，很有见地。他的故事涉及万维网的发明。他的研究同行蒂姆·伯纳斯-李（Tim\
    \ Berners-Lee，没错，就是那位著名的蒂姆·伯纳斯-李）邀请他参加第一款网络浏览器的第一次展示。这是个非常规项目，蒂姆想要通过它让核子研究中心跟其他科研机构的物理学家们更方便地分享信息。我的朋友看了演示，并给出了一些审慎的建议。他告诉蒂姆，软件看起来不错，但考虑到网络连接速度很慢，他提议放弃所有图形图像。事后看来，正是因为伯纳斯-李的浏览器有着图形性质，连孩子都能使用，才带来了日后的万维网。其余竞争的超文本系统，比如只专注于文本的Gopher，最终都死掉了。万维网之美，在于它的开放性。蒂姆和我的朋友都不曾预测区区20年后，网络就可以用来做那么多神奇的事情，实际上，其他任何人也不曾做出这样的预见。\n\
    \n当然，如果我们真能料到，也就不存在吃惊了。但我们至少可以预测到，思考机器会在很多方面让我们吃惊。或许，它们既具有超级智能，也具有超级意识？或许，它们仍然冥顽不灵地没有意识，但这种没有意识的智能让我们有意识的思想大吃一惊？有一点可以肯定：前面的道路既有趣又出人意料。\n\
    \n### 这次不一样\n\n考察来自过去的教训，或许只能帮上一部分的忙。历史不见得总会重演，从技术上看，这一次会有所不同也有充分的理由。随着工业革命的发生，机器夺走了我们的一项技能：它把生产从人类肌肉力量的限制中解放了出来。但仍然有些事情，只有人类能做到。在即将到来的革命中，机器将会夺走我们最后一项独特的技能：它把经济从我们思想力量的限制中解放出来。机器不会有竞争，因为它们是真正的“超人”。创造财富需要我们做的事所剩无几了，机器全都可以自行完成。\n\
    \n为什么这一次会有所不同，还有一个很强烈的社会原因。原因不在于这一次特殊，而在于上一次太特殊了。当时，世界经历了重大冲击，反而帮助社会适应了变化（真有些讽刺）。紧跟着工业革命，出现了两次世界大战和一次天翻地覆的大萧条，它们为“一次性逆转不平等”（这是当今经济学家的认识）奠定了基础。那一次，社会展现出了应对剧烈变化的能力，福利国家、劳动法和工会出现，教育得到普及。还有一些局部变化，如美国有了《退伍军人法》，英国有了《国民保健服务法》，掀起了巨大的社会变革。我们开始为更多的劳动力提供教育，给他们工作，而不是坐视机器淘汰他们。同时，我们还为大多数人提供了一道安全网，赋予他们经济安全感，而不是在机器淘汰之后把他们送进救济院。\n\
    \n我们希望全球金融危机和其他挑战（如全球变暖等）能带来同样积极的结果。这些问题或许能为改革社会带来必要的冲击，迎接社会思考机器即将带来的革命。但我们的政治家真的有勇气吗？真的拥有远见吗？又或者我们的政治制度能让他们这么做吗？我没有太大的信心。为积极改变创造必要的条件，需要的远远不只是印钱。我们需要考虑对福利国家、对税收制度、对教育制度、对劳动法，甚至对政治制度做根本性的改革。不过，我认为也没紧迫到非要在本书中讨论这些事情。本书的目的是唤起、呼吁改革。\n\
    \n### 新经济\n\n经济是未来必将发生变化的一个领域。许多工作岗位转为自动化，将对我们的经济产生重大影响。2015年，巴克莱银行估计，哪怕对自动化只投入区区12.4亿英镑，也能使得英国制造业在接下来的10年增加近600亿的收入。他们估计，虽然工作岗位转为自动化的数字提高了，但这笔投资事实上将扩大制造业。反过来，这实际上增加了总就业人数。情况是否的确如此还有待观察。\n\
    \n即使工作岗位未遭破坏，技术变革也降低了饭碗的牢靠性。越来越多的人会在“零工经济”（gig economy）下劳动。Intuit的一项研究预测，到2020年，40%的美国工人为自己工作。技术工人有可能受益于零工经济，收取顾问费用，并轻松地在收入丰厚的零工岗位之间跳来跳去。但不熟练工恐怕会遭到压榨，放弃工作保障、医疗保健和其他福利，只能拿到微薄的薪酬。\n\
    \n不在财政上进行重大调整，这种力量很可能会加剧越来越大的贫富差距。这不是历史上第一次出现这样的威胁。马克思预测，工业革命将使财富过度地集中在生产资料所有者手中。与此类似，这一轮正在展开的技术革命，若没有制衡，有可能将财富过度集中到机器人的所有者手里。\n\
    \n税收是逆转这一趋势的杠杆之一。尤其是，我们需要考虑怎样向富有的跨国大公司收税，它们似乎并没有出够钱。涓滴经济好像并未奏效[^(\\[4\\])](#chapter001_0010_0001.xhtml#m4)，各国政府恐怕需要考虑怎样更有力度地重新分配财富。另一方面，我们还需要考虑怎样赡养那些收入微薄的人。福利国家是从工业革命里发展出来的。工人得到了安全网，帮助他们应对技术进步带来的失业。我认为，面对即将到来的“知识革命”，我们很有必要重新审视这个问题。\n\
    \n### 钱为人人\n\n技术专家群体里特别流行一个观点，认为应该实行全民基本收入。所有人，无论是就业还是失业，都必定得到收入保障，而这笔收入，至少足以养家糊口。由于目前尚未出现任何采用全民基本收入制度的国家，我们很难判断它是否管用。加拿大和芬兰有过小规模的试验，但无一达到了全民层面，或是执行过足够长的时间，足以推广到整个国家或整整一代人。人们会变得懒惰吗？我们应该如何执行这样的制度？我们怎么可能负担得起它？\n\
    \n要实行全民基本收入，资金需求是很大的。在美国，如果要每年给处于就业年龄段的两亿多成年人1.8万美元，国家要拿出3.6万亿美元。这跟美国联邦年度预算一样大了。这笔钱必须有新的来源，因为你不能把其他所有的政府支出都砍掉，同时还减少了纳税基数。自动化帮得上忙：它提高了生产率，创造出更多可以征税的财富。即便如此，仍然存在庞大的经济、政治、社会和心理问题有待解决，我们没有太长时间可供构思答案并执行了。\n\
    \n还有人提出了几种不那么激烈的办法来代替全民基本收入设想。其中包括提高最低工资、加强工会和劳动法，通过廉价住房改善劳动力的流动性，将按劳课税转为按资本课税，增加就业培训和再教育资金。这些举措的优势在于，社会无须进行根本性的变革。但这些举措（哪怕加到一起）是否足以应对即将出现的变化，仍是一个悬而未决的问题。\n\
    \n### 梦游着走进未来\n\n技术变革历史带给我们的最后一条教训是，我们有可能在梦游状态下走进未来。技术发明得很快，但法律、经济、教育和社会却只能缓缓地跟在后面。例如，手机30多年前就发明出来，2000年前后在发达国家市场达到了50%左右的饱和度。直到2007年，华盛顿才成为第一个确立禁止开车时发短信之类禁令的州。但直到今天，美国仍然有几个州没有立法禁止开车时发短信。法律需要几十年才能发展出台，可新的技术每个季度都在往外冒。\n\
    \n波兹曼把这称为“技术至上主义”，即认为技术比其他任何东西都更重要。对新技术奉行这种态度，会让我们牺牲很多能让生活变得更美好的东西。技术应该是我们的仆人，而不是反过来。我们有能力发明一种新技术，不一定意味着我们应该把它发明出来。新发明的技术可以投入某些用途，不一定意味着我们应该这么做。2016年11月，中国上海交通大学的研究人员展示了怎样用机器学习来区分犯罪分子和非犯罪分子的照片。我们可以做这类的事情，并不意味着我们现在就应该做这类的事情。此类人工智能应用，大有值得商榷缓行的理由。在什么时候、什么地方使用思考机器，我们必须作出谨慎的选择。\n\
