  trans: '


    英国有一个地方，在最初的开发阶段发挥了非常突出的作用。1963 年，在爱丁堡大学，唐纳德·米基（Donald Michie）[\[32\]](#chapter001_0005_0001.xhtml#m32)成立了一支研究小组，它最终演变成了全世界第一个人工智能科系（有一段时间，全世界独此一家）。米基曾在布莱切利公园与图灵共事，他们经常一起在午餐时间探讨开发思考机器之梦。爱丁堡大学发起了许多开创性项目，包括机器人“弗雷迪”（freddy）。这是最早集成了视觉、操纵和复杂控制软件的机器人之一。


    不幸的是，1973 年，《莱特希尔报告》（*Lighthill report*）对人工智能提出了强烈批评，英国放弃了自己在这个领域的早期领先地位。英国科学研究理事会要求应用数学家迈克尔·詹姆斯·莱特希尔（Michael
    James Lighthill）对本国人工智能研究进行评估。报告对研究的诸多核心方面提出了极其悲观的预测，称“该领域迄今为止的发现，并未产生事先承诺的重要作用”。莱特希尔的批评，一部分是出于他见证了爱丁堡各研究团队的内斗。由于他的报告，英国人工智能研究的资金被削减，直到
    10 年之后，阿尔维计划（Alvey Programme）才又让一切回到正轨。


    ### 早期的成功


    尽管人工智能研究的初步进展并不像达特茅斯夏季研讨会的参与者们预测的那么快[\[33\]](#chapter001_0005_0001.xhtml#m33)，但
    1956 年之后的 20 年里一些意义深远的举措被采用，大量项目脱颖而出，成为重要里程碑。


    其一是机器人“摇摇”（Shakey）[\[34\]](#chapter001_0005_0001.xhtml#m34)。这是第一台移动机器人，能感知环境，对自己的周围情况和行动进行推理。它做不了太多事，但从某种意义上来说，这是人类首次严肃地尝试制造一台自主机器人。“摇摇”项目于
    1966 年到 1972 年间在加利福尼亚州帕洛阿尔托的斯坦福研究所开展。和大多数人工智能研究一样，它的资金来自美国国防部，后者希望开发可执行侦察任务、无须危及人命的军用机器人。50
    多年以后，军方真的拥有了这样的机器人。


    《生活》杂志把“摇摇”称为“第一个电子人”。[\[35\]](#chapter001_0005_0001.xhtml#m35)这或许有点儿夸张，但“摇摇”确实可以算是历史上第一代能够自主“思考和行动”的机器人。2004
    年，它跻身卡内基-梅隆大学的机器人名人堂。“摇摇”项目最重要的分支研究是 A\*搜索算法。该算法寻找两点之间的最短路径。“摇摇”用它来规划自己前往新位置的路线。如果你听到自己的车载导航系统说“计算新路线”，它很可能用的就是
    A\*搜索算法的某个变体。技术怎样引领我们朝着事先无法预测的方向前进，这就是一个很好的例子。谁能料到，第一代自主机器人的相关研究，日后竟然成了车载卫星导航系统的关键？翻遍“摇摇”项目的拨款提案，你肯定也找不到这方面的苗头。


    早期的另一个里程碑是始于 1965 年的 DENDRAL 项目，它启动了一个全新的行业：专家系统。DENDRAL 是一场雄心勃勃的尝试，把专业领域知识（本例中为分子化学）编码到计算机程序里。DENDRAL
    以质谱（mass spectra）作为输入，利用自己的化学知识库，提出有可能加以响应的化学结构。DENDRAL 靠的是专业人士会用的启发式经验法则，从诸多可能的化学结构中筛选出少量的候选者。虽然
    DENDRAL 在其专业领域取得了成功，但它带来的最大冲击是，它表明，聚焦在一个狭窄主题上，把人类的专业知识进行明确编码，计算机程序能够以专家级的绩效来完成特定任务。20
    世纪 80 年代，医院、银行、核反应堆等各种地方，都实施了 DENDRAL 等专家系统。专家系统现在基本上已演变为 SAP、Oracle（甲骨文）和 IBM
    等公司销售的业务规则引擎。


    ### 我们的机器大师


    1979 年 7 月 15 日，发生了思考机器开发史上意义重大的里程碑事件：计算机程序 BKG 9.8 击败了西洋双陆棋世界冠军路易吉·维拉（Luigi Villa）。在蒙特卡洛举办的这场比赛（比赛奖金为
    5000 美元，赢家全拿）中，计算机的成绩是 7 胜 1 负。这是计算机程序第一次在技能游戏上“吊打”人类世界冠军。人类不再是最优秀的选手。计算机逐渐让自己的创造者黯然失色。不过，更公平地说，西洋双陆棋是既讲究技巧，也讲究运气的游戏。[\[36\]](#chapter001_0005_0001.xhtml#m36)计算机在投掷骰子时运气很好。开发
    BKG 9.8 的汉斯·波林纳（Hans Berliner）[\[37\]](#chapter001_0005_0001.xhtml#m37)事后写道：


    我几乎不敢相信这样的结果，但毫无疑问，程序赢得了胜利。它的下法没犯什么严重错误，尽管能赢下第三局和最后一局靠的是运气。围观群众冲进了进行比赛的封闭房间。摄影师拍照，记者采访，专家列队向我表示祝贺。只有一件事搞砸了现场。前一天才拿下世界冠军头衔、达到自己双陆棋事业巅峰的维拉郁郁寡欢。我对他说，我对发生的事情感到很抱歉，我们俩都知道，他才是更优秀的棋手。[\[38\]](#chapter001_0005_0001.xhtml#m38)


    就算 BKG 9.8 其实并不是最优秀的棋手，这仍是一个历史性瞬间。波林纳不是按更优秀的双陆棋规则来编程的，而是按学习下双陆棋来编程的。随着时间的推移，程序逐渐下得比自己的创造者更优秀，最终达到了世界冠军的水平。


    接下来，机器还将在另一些游戏上击败人类，包括曾让图灵等人着迷的古老的国际象棋。1985 年，加里·卡斯帕罗夫（Gary Kasparov）成为世界上最年轻的国际象棋冠军，时年仅
    22 岁。直到今天，很多人都认为他是历史上最伟大的棋手。十多年后，象棋程序最终击败人类时，国际象棋冠军碰巧是他，这样的收场未免让人觉得有些残酷。1997 年
    5 月 11 日，卡斯帕罗夫在纽约锦标赛主办的表演赛上输给了 IBM 开发的计算机象棋程序“深蓝”。“深蓝”拿到了 70 万美元的奖金。虽说卡斯帕罗夫一年前也曾击败“深蓝”，赢得了
    40 万美元奖金，但这于事无补。他将永远带着“第一个被计算机击败的国际象棋大师”的烙印，为后人所铭记。


    ### 你感觉如何


    人工智能史早期的另一块里程碑是计算机心理治疗师“伊莉莎”（Eliza）[\[39\]](#chapter001_0005_0001.xhtml#m39)。把它放在成功的章节里我有点儿犹豫，因为把它放在下一部分“人工智能早期的失败”里也同样成立。1964
    年到 1966 年间，约瑟夫·维森鲍姆（Joseph Weizenbaum）[\[40\]](#chapter001_0005_0001.xhtml#m40)创建了“伊莉莎”。一方面，“伊莉莎”固然算得上是日后贝宝（PayPal）、宜家等公司网站上成功回复客户询问的聊天机器人的智能始祖之一；另一方面，它也作了弊。“伊莉莎”会把患者所说的一句陈述，比如“我一直在想我父亲”，变成一个问题：“你为什么一直在想你父亲呢？”事实上，“伊莉莎”对任何对话的语义理解都十分有限。不过，它生成了一些令人信服的对话。在一篇著名的报道里，维森鲍姆的秘书曾提出请求，想私下跟“伊莉莎”聊聊。


    **与伊莉莎进行的对话**


    维森鲍姆报告了“伊莉莎”和一名年轻女性的对话：


    女子：男人都一样。

    伊莉莎：哪些方面？

    女子：他们总会拿这样那样的事情来烦我们。

    伊莉莎：你能举个具体的例子吗？

    女子：唉，是男朋友要我来这儿的。

    伊莉莎：你男朋友让你来这儿？

    女子：他说我总是抑郁。

    伊莉莎：听到你说自己抑郁，我挺抱歉。

    女子：真的。我不开心。

    伊莉莎：你觉得来这儿能让你变得没那么不开心吗？


    照维森鲍姆想来，“伊莉莎”是对心理治疗师的“拙劣模仿”。可一些精神科专业人士提出，不妨把“伊莉莎”开发成临床工具，还有些人认为“伊莉莎”展示了用计算机处理自然语言的合理性，这叫他大为震惊。今天，创业公司
    X2AI 开发了“伊莉莎”的后代——聊天机器人“卡里姆”（Karim），用它充当“治疗助手”帮助叙利亚难民。该聊天机器人提供的不是治疗，而是帮助和支持，两者在法律和道德上有着重要的区别。此外，人类还监控着“卡里姆”。但它确然表明，我们正走上了维森鲍姆提醒过的道路。


    “伊莉莎”还表明，我们在判断行为智能时应该谨慎。人是很容易上当受骗的。此外，人会出于能力的欠缺而忽视机器造成的错误。人类的对话充满了失误，但我们视而不见。等谈到图灵的人工智能测试时，我会对这些概念再做探讨。


    ### 早期的失败


    除了早期的成功之外，还有一些早期的失败。机器翻译就属于后一种情况。早在 1946 年就有人提出使用计算机来翻译语言，20 世纪五六十年代发起了若干机器翻译项目。冷战期间，美国军方热衷于把俄语和其他语言的文件自动翻译成英语。


    一开始，让机器自动翻译的进展缓慢。妥帖的翻译，要求掌握源语言和目标语言两者中的语法、语义、句法和成语等知识。你不能光按字面翻译。有一个流传甚广的故事说，有人要机器翻译系统把“心有余而力不足”先翻译成俄语，再翻译回英语。结果成了这样：“伏特加挺好，可肉馊了。”不管这个故事是不是真的，都说明了机器翻译要面临的部分挑战。


    1964 年，3 家出资研究机器翻译的机构（美国国防部、国家科学基金会和中央情报局）成立了“ALPAC”，即自动语言处理咨询委员会，对进展情况进行评估。委员会对截至当时的机器翻译研究进度持高度批评态度，研究经费大幅缩水。直到
    20 年后，统计法逐渐展现希望，研究才再次得到了支持。如今，机器翻译当然回归了，并且已经付诸日常使用。谷歌翻译每天处理的文字量相当于 100 万本书的容量。更令人印象深刻的或许是
    Skype 的翻译功能，可对英语、西班牙语、法语、德语、意大利语及中文普通话进行准确、实时的翻译。机器翻译眼下似乎成了一个可实现的梦想——只不过，在 20
    世纪 60 年代，它太过超前了。


    另一场高调的失败是语音识别。多年来，企业巨头美国电话电报公司（AT&T）下属的研究机构贝尔实验室对让计算机理解口语很有兴趣（这一点想必不足为奇吧）。[^(\[41\])](#chapter001_0005_0001.xhtml#m41)1952
    年，贝尔实验室开发了一套系统，能够识别一个说话人说出的单个数字。之后，1969 年，约翰·皮尔斯[^(\[42\])](#chapter001_0005_0001.xhtml#m42)（John
    Pierce，领导了第一颗商业通信卫星 Telstar 的开发工作）写了一篇文章，将语音识别比作“水变汽油、从海洋里提炼黄金、治疗癌症、登上月球”一类的项目，他怀疑，语音识别能不能识别多名说话人词汇丰富的对话。[^(\[43\])](#chapter001_0005_0001.xhtml#m43)这令贝尔实验室的项目资金锐减。另一个处境比较艰难的项目，是国防高级研究计划署（DARPA，美国国防部的分支机构，帮助开发了多项新兴技术）资助的“语音理解研究”。该项目从
    1971 年开始持续了 5 年，支持了 BBN、IBM、卡内基梅隆大学和斯坦福大学研究所的研究。然而，因为对进度感到失望，DARPA 停止了后续计划。


    与机器翻译一样，在 20 世纪六七十年代，这些语音识别项目太超前了。不过，在过去几年里，我们看到语音识别的性能陡然提高。这是一种名叫“深度学习”的机器学习技术带来的变化，我们很快将详细地探讨。如今，所有主要商业语音识别系统都在使用这一技术。[^(\[44\])](#chapter001_0005_0001.xhtml#m44)数据更多、计算机处理能力更强，这两者帮助很大，但算法改进同样有益。在大词汇库中进行多人语音识别，现在已经做得到了。打开你智能手机上的
    Siri 或 Cortana 等辅助程序，自己试试看吧。


    ### 对常识进行编码


    第三项失败（来得稍微迟一些）是 1984 年微电子与计算机技术公司（Microelectronics and Computer Technology Corporation，简称
    MCC）发起的颇具争议的项目 CYC。MCC 是美国创办的第一家计算机研发财团，从某种意义上讲，它是为了回应日本的第五代计算机项目而创办的。MCC 最初集结了得克萨斯州奥斯汀的
    10 多家科技公司，包括 DEC、数据控制（Control Data）、RCA、NCR、霍尼韦尔、AMD 和摩托罗拉。稍后，微软、波音、通用电气、洛克威尔（Rockwell）等科技巨头也加入进来。


    道格·莱纳特（Doug Lenat）[^(\[45\])](#chapter001_0005_0001.xhtml#m45)离开了斯坦福大学，转而领导 MCC
    公司的 CYC 项目。他梦想着编撰一种常识性知识百科全书（“CYC”就截取自百科全书的英文单词“enCYClopedia”一词），让计算机可以用以进行智能行为。这就包括“所有的树木均为植物”“巴黎是法国的首都”等事实，以及“如果
    X 是 Y 的一种，且 Y 具有 Z 特性，则 X 也具备 Z 特性”等通用规律。举个例子，使用这套规则，再加上“植物是不能活动的”这一事实，CYC 可以推断出树木也不能活动。与当时的专家系统相比，莱纳特的目标是建立一套有一般性智能的系统。人工智能的一项重大挑战就是让计算机知道所有我们视为理所当然的、简单且琐碎的事实。“树木是不能活动的……巴黎不是植物……猫是毛茸茸的。”接受了
    MCC 10 年的慷慨的资金支持之后，CYC 被分离出去，成了较为低调的 Cycorp 公司。Cycorp Inc.营运至今（MCC 已解散），但商业成就相当有限。人类当今视为理所当然的知识十分庞杂，CYC
    百科全书系统本身也变得极其复杂，使得为 CYC 增添知识的研究人员难以应对。


    以事后的角度来看，CYC 项目的问题仍然在于太过超前。它着手进行的时候，万维网尚未腾飞，更重要的一点是，当时语义网（Semantic Web）还没创建。2012
    年，谷歌开始借助旗下的知识图谱（Knowledge Graph）来改进搜索结果。从某些方面看，知识图谱就是谷歌对 CYC 的回答。它是一套世界事实的结构化知识库。它可以让谷歌回答“澳大利亚人口是多少”的提问式搜索。试试看吧。你能得到过去
    50 年里该国的人口发展趋势图。微软必应（Bing）、雅虎和百度现在全都使用同类技术来提升搜索结果。DBpedia 和 YAGO 等数据库社群项目，也尝试以类似的方式编纂知识。尽管莱纳特的雄心没问题，但他的时机不对。[^(\[46\])](#chapter001_0005_0001.xhtml#m46)


    ### 对人工智能的批评


    从一开始，人工智能就引来了一些声音响亮、破坏性很强的批评意见。前文提到的莱特希尔和彭罗斯都属于此类代表。另一位早期批评家是哲学家休伯特·德雷福斯（Hubert
    Dreyfus）[^(\[47\])](#chapter001_0005_0001.xhtml#m47)。他写过一篇文章《炼金术与人工智能》，1972 年又增订内容，就是《计算机做不到的那些事》（*What
    Computers Can’t Do*）一书。[^(\[48\])](#chapter001_0005_0001.xhtml#m48)1992 年，该书第三版问世，他既俏皮又略带挑衅地把书名变成了《计算机仍然做不到的那些事》（*What
    Computers Still Can’t Do*）。


    德雷福斯并不怀疑人工智能将取得成功。他所主张的是，人工智能研究人员对这个问题的解决途径存在根本缺陷。他说：“原则上，只要人充分地使用构成人类的组件，没有任何理由说他不能构建起人工的、有形体的主体。”德雷福斯的主要批评点放在构建思考机器的象征性方法上，它可以回溯到莱布尼茨的“人类思想字母表”。德雷福斯认为，为了拥有智能，这些符号必须以现实世界为基础，就跟人类一样。


    德雷福斯的论点遭到人工智能研究人员的强烈反对。更欠妥当的是，德雷福斯提出观点的形式也很有争议性，他把人工智能跟炼金术相提并论。不过，人工智能研究人员这一边的表现并没有更好。据说，在麻省理工，德雷福斯受到所有学者的排挤，只有编写“伊莉莎”的维森鲍姆有胆量跟德雷福斯坐在一起吃午饭。德雷福斯跟计算机程序
    Mac Hack 下了一局国际象棋，他输的时候，周围一片欢喜之声。


    德雷福斯的一些批评的确敲打在了点子上。机器人专家罗德尼·布鲁克斯（Rodney Brooks）[^(\[49\])](#chapter001_0005_0001.xhtml#m49)认为，思考机器必须植入现实世界，像人类一样感知世界并在其间行动，根据自身的感知和行为构建符号。只有这样，符号才能获得真正的意义。布鲁克斯把这些观念放进一系列的机器人身上：艾伦、汤姆和杰瑞、赫伯特、西摩和六条腿的根格斯。[^(\[50\])](#chapter001_0005_0001.xhtml#m50)


    德雷福斯提出的其他批评，则被有力地反驳掉了。德雷福斯认为，计算机永远无法通过一套简单的规则获得人类理解背景、环境或目标的能力。然而，我们今天无法想象存在这样一套正式规则，并不意味着这样的规则不存在。如今，许多研究人员正开发出越来越好、越来越接近人类表现的系统，有力地回应了德雷福斯。


    ### 人工智能周期


    这些早期失败带来的后果之一，是人工智能经历了乐观主义和资金充裕的时期，紧随其后又经历了悲观主义和资金锐减的时期。第一次所谓的人工智能寒冬发生在 20 世纪
    70 年代后期，第二次发生在 20 世纪 80 年代末到 90 年代初。这两次寒冬的到来，主要是因为投资机构和风险投资家对人工智能的希望崩塌了。从科学上看，人工智能并没有失败，哪怕它蕴含的技术挑战比许多早期研究人员预计得更为棘手。


    事后不难看出，制造思考机器，是一项巨大的智力挑战。我们试图匹配甚至超越整个宇宙里已知最为复杂的系统——人类大脑——的性能。我在这个领域工作的时间越长，对人类大脑就越发尊重。人类实现的所有惊人壮举都靠它，但它的功率只有
    20 瓦。相比之下，IBM 的计算机“沃森”是如今最强大、最能干的系统之一，能耗是 80000 瓦。[^(\[51\])](#chapter001_0005_0001.xhtml#m51)要想跟上人类思想的绩效/功率比，我们还有很长的路要走。


    第一场 AI 寒冬始于 1974 年前后，当时 DARPA 削减对人工智能研究的资助。1982 年，日本国际贸易和工业部于 1982 年推出了第五代计算机系统项目，寒冬就结束了。日本的目标是不再跟在美国的后面跑，想要变成计算领域的领跑者。在这个为期
    10 年的项目里，日本花掉了 4 亿美元。这一项目有着雄心勃勃的目标，好几个竞争国家因为担心输掉这场技术比赛，也发起了本国的相应项目。英国回应以阿尔维计划（Alvey
    Programme），提高了计算领域（包括人工智能）的研发资金。欧洲回应以 65 亿美元的 ESPRIT 项目[^(\[52\])](#chapter001_0005_0001.xhtml#m52)，美国则推出了
    10 亿美元的战略计算计划，组建了微电子与计算机技术联盟。和日本的第五代计算机系统项目一样，除了人工智能之外，这些项目也着眼于计算机硬件及其他信息技术领域。世界各地的人工智能资金也出现大幅提升。


