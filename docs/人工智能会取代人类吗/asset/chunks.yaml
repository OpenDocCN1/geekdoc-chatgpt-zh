    # 第二部分

    人工智能的现状


    ## 第三章

    当今人工智能的情况


    面对困难问题的时候，把它分解为若干部分，是个很自然的策略。构建思考机器这个问题，本身也分为许多不同的部分。许多从事人工智能工作的研究人员只关注其中一个部分，这不足为奇。当然，也有人认为这个问题从根本上就不可分解。但人类大脑有着诸多不同的部分，并且似乎是在执行不同的功能。故此，检验大脑的组成部分，尝试简化制造思考机器这个问题，应该是个合理的做法。


    ### 四大部落

    目前有四个不同的“部落”，从事着构建思考机器不同方面的工作。这么说或许极大地简化了现实，因为实际上人工智能的“智能”格局异常复杂。不过，对人工智能研究人员按“部落”分类，有助于我们理解这片“土地”上的真假虚实。


    #### 学习部落

    我们生下来并不会说话，不知道什么东西好吃，不能行走，不知道太阳和星星，也不知道牛顿的物理定律。但我们逐渐学到了所有这些事情，甚至更多。因此，制造思考机器的方法之一，就是制造一台能像人类一样学习的计算机。这一思路，消除了另一个问题：编纂人在成长过程中掌握的所有知识——这些知识，对在现实世界中运作至关重要。一如
    CYC 项目发现，为机器人编写所需的所有常识性知识，是一项痛苦而漫长的任务，比如水不能“拾起来”，天空是蓝色的，阴影不是物体，等等。


    在学习部落内，我的同事佩德罗·多明戈斯（Pedro Domingos）确认了五支“宗教团体”：符号派、连接派、演进派、贝叶斯派和类比派。[\[1\]](#chapter001_0007_0001.xhtml#m1)


    符号派是莱布尼茨的门徒，把逻辑学里的观点带到了学习上。在逻辑学中，我们通常会进行演绎推理，推断 A 之后跟着是 B。符号派逆转了这一过程，使用“归纳推理”来学习是什么导致了
    B。由于我们观察到了 B，那么，他们假设 A 必然是其成因。


    另一方面，连接派把神经科学的观点带到了学习上：从人类大脑里观察到的 A 和 B、0 和 1 等符号很少，更多的是连续的信号。他们采用的是类似我们神经元里的学习机制，从而学习怎样最好地权衡人造神经元里的各种输入。深度学习派就是这一“宗教”里最显眼的成员。


    第三支“宗教团体”是演进派。他们从大自然里汲取灵感，使用类似于演进的机制（适者生存）来寻找问题的最佳计算模型。


    第四支“宗教团体”是贝叶斯派。他们采取的是一种可追溯到托马斯·贝叶斯（Thomas Bayes）牧师的统计学习方法。[\[2\]](#chapter001_0007_0001.xhtml#m2)根据观察数据，他们可学习到哪一种模型里成功的可能性最大。


    最后一支“宗教团体”是类比派。他们希望把问题映射到其他的某个空间（大多拥有更多的维度），这样类似项目之间的连接在此可能会表现得更为清晰。他们使用的是有着“支持向量机”这种华丽名称的学习方法。此类方法发现了问题的其他一些视角，此时，类似的项目（对猫的所有观察结果）紧密相连。凡是类似这些原有观察结果的新观察结果，即可视为一只猫。


    #### 推理部落

    第二大部落是莱布尼茨、霍布斯和布尔的门徒。他们探索怎样为机器配备清晰的思考规则。机器可以根据明确编码的知识进行推理，或是依靠与现实世界的互动来学习。因此，推理部落或许依赖学习部落做前期预备工作。


    人类推理远比布尔设想的简单代数模型复杂得多。现实世界并不都是 0 和 1。我们必须要面对不完整、不一致的知识，要面对知识内在的不确定性，以及有关知识的知识。因此，推理部落试图开发正式的推理模型，能应对部分知识、矛盾信息、概率信息及有关信息本身的信息。推理部落本身也由众多不同的群体组成：有铁杆演绎推理派，他们中有一部分人试图让计算机进行数学推理、证明定理，甚至发明新的数学；另一个群体专注于规划，让计算机规划一系列的行动，达成特定的某个目标；推理部落内部的其他群体专注于推理任务，比如根据新出现的或互相矛盾的信息来更新知识库。


    #### 机器人部落

    人类智能是一个复杂现象，它部分地来自我们与现实世界的互动。第三大部落——机器人部落——想要开发能在现实世界里行动的机器：它们可以对自己的行为进行推理，像我们一样通过互动来学习。故此，机器人部落与学习部落、推理部落存在交叠。当然，机器人需要感知自己在其中行动的世界，所以，这一部落里有些人主要从事计算机视觉工作，即让计算机具备感知世界状态的能力。视觉不仅帮助我们在现实世界中导航，而且是我们学习能力的重要组成部分之一。


    #### 语言学部落

    构建思考机器的第四大部落是语言学家。语言是人类思想的重要组成部分。机器要思考，那就必须理解和操纵自然语言。语言学家开发可以解析书面文本、理解并回答问题，甚至在两种语言之间翻译的计算机程序。还有些人从事语音识别工作，让计算机把音频信号转换为自然语言文本。


    ### 两大洲

    让我们把部落的比喻做进一步延伸。人工智能研究中还有两“大洲”：褴褛洲和整齐洲。整齐洲寻求的是能够用来构建思考机器的简洁、精确的机制。莱布尼茨是整齐洲开疆拓土第一人，约翰·麦卡锡则是另一个著名的整齐洲人。而褴褛洲人认为智能过于复杂和混乱，无法通过简单、精确的机制解决。罗德尼·布鲁克斯是最著名的褴褛洲人。他开发的机器人就没有明确的逻辑控制结构，这些机器人在现实世界中感知与行动，复杂的行为从互动中浮现出来。褴褛洲人相当于人工智能世界的黑客。事实上，黑客文化的起源就可以部分地追溯到麻省理工学院计算机科学与人工智能实验室的许多褴褛洲人身上。


    四大部落（学习部落、推理部落、机器人部落和语言学部落）的族人，散布在两大洲。比方说，机器学习的部分成员是褴褛洲人，也有些成员是整齐洲人。同样地，有些语言学家是褴褛洲人，有些是整齐洲人。不足为奇，推理部落几乎所有的族人都来自整齐洲，他们要解决的问题，常常是合乎逻辑的，故此本身就有着工整的方法。机器人部落的许多族人是褴褛洲的，他们面对的是复杂而又散乱的问题，故此要采用东拼西凑的方法。


    现在我们来看看每一部落领土的发展情况。


    ### 机器学习的情况

    今天，人工智能引起的许多喧嚣都来自学习部落取得的惊人进展。深度学习法表现尤其突出，取得了让人印象深刻的成绩，很多时候超过了其他老牌技术。例如，基于深度学习的语音识别系统，如百度的
    DeepSpeech 2，在将语音转换为文本方面可跟人类一较高下。而且，我之前也提到过，2016 年初，谷歌的 AlphaGo 程序击败了全世界最优秀的一位围棋选手。


    然而，如果就此得出结论，说机器学习让我们十分接近思考机器，只要再稍作改进，深度学习等技术就能让我们“解决”智能问题，这就错了。深度学习并不是游戏的终点，原因之一在于它需要大量的数据。在下围棋这样的领域里，获得大量的数据不难：数据库里塞满了高手从前下过的棋谱，计算机可从中学习。而且，我们还可以让机器自己跟自己对弈，生成数量无限的进一步数据。但在其他领域，收集数据就很难了。在许多机器人领域中，物理和工程情况或许会限制我们收集数据的速度——在机器人学习和犯错误的过程中，我们要小心地不把它们弄坏。还有些领域没有太多数据，比如我们可能想要预测心脏或肺移植患者的血液和身体组织类型，但这样的手术在全世界仅有几百例，可作为预测基础的数据太过有限。由于存在这样的问题，深度学习将面临挑战。相比之下，人类学习的速度相当快，只要有极少的数据我们就能学习。根据围棋专家的说法，AlphaGo
    下围棋的方式前所未有，尤其是在开局。尽管如此，李世石也只用了 3 局比赛就了解到 AlphaGo 是怎么赢的了。相比之下，AlphaGo 比任何人一辈子下过的棋局都要多——它下过数十亿盘。所以，李世石是值得尊重的。再说了，人类的一场小胜，也等于是人类再一次战胜了机器（译注：此处当指李世石在第
    4 局对弈中战胜了 AlphaGo）。


    深度学习为什么并不是构建思考机器的全部答案，还有其他几个原因。首先，我们常常希望思考机器能对自己作出的决定作出解释。深度学习基本上是一个黑匣子，不能用有效的方式来解释自己。第二，我们常常希望机器保证会做某些行为。比如，自动驾驶汽车看到红灯总会停。空中交通管制软件绝不允许两架飞机飞入同一空域。深度学习无法作出这样的保证，我们大概要靠基于规则的系统来实现上述目的。第三，人类大脑在复杂性上超出了今天使用深度学习构建的任何网络。人脑具有数十亿的神经元，上万亿的连接；今天的深度学习使用数千个人工神经元，数百万的连接。让它扩大到人脑的水平可不容易。此外，大脑具有许多不同类型的神经元和不同的结构，分别用于不同的任务。因此，对思考机器我们或许也需要类似的专门化。


    尽管存在上述不足，机器学习技术仍然在走向成熟，无须人类的太多帮助，便可解决许多问题。但事情也并未达到只需要人按下按钮那么简单：要让技术运转起来，人类还是需要做大量的算法选择、参数调整，以及委婉地称为“特征工程”（feature
    engineering）的做法。机器学习天生就会受到输入数据的限制。举例来说，想预测购物者是否会使用优惠券，你需要在模型里添加新的数据——比如自购物者上次从公司处购物以来过去了多长时间等。


    不谈及大数据在机器学习最近成功中扮演的角色，我们是无法讨论机器学习的状况的。许多行业正利用大数据集来开发借助机器学习的实际应用。银行用大数据和机器学习来检测信用卡欺诈，亚马逊和
    Netflix 等网商和服务商使用大数据和机器学习来调整产品推荐，美国航空航天局将机器学习应用到一套大型星表（译注：star catalogue，指天文学目录，收录关于星体的各种数据的记录，包括天体在天空中的视位置、星等、光谱型等）上进而确认了一种新型的恒星。


