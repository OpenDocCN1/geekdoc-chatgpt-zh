- raw: "[\\[14\\]](#chapter001_0005_0001.xhtml#w14) 查尔斯·巴贝奇出生于1791年，1871年去世。他是剑桥大学数学高级教授，牛顿和如今的史蒂芬·霍金（Stephen\
    \ Hawking）都曾出任此职。制造机械式计算机的项目，他自己出了钱，政府也给予了大手笔的资助，项目设计精彩至极，而且投入了英国最优秀的工程制造能力，但仍以失败告终，淹没在了历史长河里。巴贝奇也无能为力。他是爱动怒的人，很讲究原则性，易受冒犯，经常跟他视为敌人的人当众争执。此外，这一项目宣传不畅，资金使用不规范，太超前于时代，要想象这样的项目能取得成功实在很难。但如果它真的成功了，我们大概能够热切地着手开发思考机器了。1991年，他出生两百周年后，巴贝奇的“差分机”在伦敦科学博古馆建成。他的“分析引擎”里包含了现代数字计算机里包含的若干新颖功能，包括顺序控制、分支和循环。此外，英国还在进行另一个项目，希望能在2021年他去世150周年时完成“分析引擎”。\n\
    \n[\\[15\\]](#chapter001_0005_0001.xhtml#w15) 埃达·洛夫莱斯出生于1815年，1852年去世。她是诗人拜伦的女儿。为了纪念她，鼓励女性投身科学、技术、工程和数学主题，每年10月设有“洛夫莱斯纪念日”。\n\
    \n[\\[16\\]](#chapter001_0005_0001.xhtml#w16) 威廉·斯坦利·杰文斯出生于1835年，1882年去世。他最出名的事迹或许要数将数学方法应用到经济学（尤其是有关效用的设想）上。他在教科书《政治经济学理论》（*The\
    \ Theory of Political Economy*，1857）中写道：“很显然，经济学如果要成为一门科学，必然是数学的科学。”自此以来，许多经济学家一直在尝试攻克这一挑战，可惜未能成功。\n\
    \n[\\[17\\]](#chapter001_0005_0001.xhtml#w17) Philosophical Transactions of the\
    \ Royal Society of London，1870，Volume 160，page 517。\n\n[\\[18\\]](#chapter001_0005_0001.xhtml#w18)\
    \ 一个星期天的早上，杰文斯在黑斯廷斯附近的海里游泳时淹死，时年46岁。\n\n[\\[19\\]](#chapter001_0005_0001.xhtml#w19)\
    \ 大卫·希尔伯特出生于1862年，1943年去世。希尔伯特属于第一批思考元数学（即对数学本身进行数学研究）的人。\n\n[\\[20\\]](#chapter001_0005_0001.xhtml#w20)\
    \ 格奥尔格·康托尔出生于1845年，1918年去世。康托尔以简洁的“对角线”论证方法著称。这一论证，是图灵停机问题（Halting problem）的证明核心，也是哥德尔第一不完全性定理的证明核心。\n\
    \n[\\[21\\]](#chapter001_0005_0001.xhtml#w21) 用集合来代表数字有若干种方法。例如，我们可以通过空集合来表示数字0，用包含空集合的集合来表示1，用包含了代表数字1的集合的集合（即该集合包含了含有空集合的集合）来表示2，以此类推，直至无穷。\n\
    \n[\\[22\\]](#chapter001_0005_0001.xhtml#w22) 伯特兰·罗素伯爵出生于1872年，1970年去世。1950年，罗素因主张人道主义理想和思想自由的著作获诺贝尔文学奖。\n\
    \n[\\[23\\]](#chapter001_0005_0001.xhtml#w23) 库尔特·哥德尔出生于1906年，1978年去世。他逃离纳粹德国，在普林斯顿大学高等研究院拿到了一个永久职位，并在那里跟阿尔伯特·爱因斯坦和约翰·冯·诺依曼（John\
    \ von Neumann）成为好朋友。哥德尔是个有点怪异的人物。他甚至怪到要爱因斯坦（原本也是个怪人）陪他去接受入籍面试。但就算爱因斯坦在场，哥德尔仍然在入籍面试时说，美国宪法里有些固有的内在矛盾可导致独裁，并可用数学证明。好在他拿到了美国公民身份。他还有几个不太出名的地方：他为上帝的存在写过正式的证明；他因为害怕有人下毒，最后饿死了自己。\n\
    \n[\\[24\\]](#chapter001_0005_0001.xhtml#w24) 罗杰·彭罗斯爵士出生于1931年。他反对人工智能的观点引自他所著的《皇帝的新脑》一书\\\
    [见参考书目36\\]。他认为人的意识并非算法，不能用传统的数字计算机建模。此外，他推测量子效应在人脑中扮演着至关重要的角色。这本书问世后不久，我邀请彭罗斯在爱丁堡大学人工智能系做了一次讲演（我当时在该大学任教）。彭罗斯来了，但他在讲演之前跟我吃午餐时说，来这里讲演让他感觉像是自寻死路，把脑袋放进狮子嘴里。当时，爱丁堡大学人工智能研究中心很出名，他感到紧张确实挺合理。虽然他的书获得了皇家学会“科学图书奖”，但他的观点却遭到了哲学家、计算机科学家和神经学家的质疑。我喜欢和彭罗斯一起吃午饭，但对他的讲演没那么喜欢。\n\
    \n[\\[25\\]](#chapter001_0005_0001.xhtml#w25) 实际上，彭罗斯反对人工智能可能性的一些观点跟J·R·Lucas最早提出的类似，见\\\
    [参考书目32\\]。\n\n[\\[26\\]](#chapter001_0005_0001.xhtml#w26) 从计算复杂性上来说，停机这一类的问题叫作“不可判定问题”。其他不可判定问题还包括：判断数学语句是否为真，判断两个数学函数是否总是计算出相同的答案，以及希尔伯特的第10个问题（判断一个简单多项式方程是否具有整数解）。\n\
    \n[\\[27\\]](#chapter001_0005_0001.xhtml#w27) 从技术上来说，图灵的结论证明，存在图灵机无法解决的问题。这并不妨碍其他更丰富的计算模型可用来计算这些问题。然而，即便依靠更丰富的计算模型，如量子计算机，我们仍然会碰到此类不可判定的结果。举个例子，量子计算机可以比传统计算机更快地计算某些问题，但既然经典计算机可以模拟量子计算机，那么，停机问题哪怕用量子计算机也仍然无法判定。\n\
