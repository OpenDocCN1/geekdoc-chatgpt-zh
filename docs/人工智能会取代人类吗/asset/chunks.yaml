    2018 年 3 月于南京


    # 中文版前言


    在即将到来的人工智能革命中，中国已经将自己放到了中心的位置。我很高兴这本书的中文版能够付梓。见证本书讨论的巨大变化，中国必定是个绝佳的地方。事实上，中国似乎有望引领我们走向这一未来。


    5 年前，我们许多从事人工智能工作的人，看到中国展现出了可观的潜力。中国加大了对大学的资金投入，并拥有广泛的人才队伍。为了帮助并激励中国研究界，2013 年，我们决定将顶尖的人工智能大会——国际人工智能联合会议——放到中国举办。


    今天，我们看到，当初的潜力逐一变成了现实。作为后起之秀的中国已跻身研究和实践两方面的顶尖国家之列。2017 年 9 月，高盛公司发布报告，名为《中国在人工智能中崛起》，介绍了世界第二大经济体怎样应用人工智能推动经济进步，成为重要的全球角逐者。


    在学术界，中国也日益成为重要角色。2017 年，提交给国际人工智能联合会议的报告，1/3 来自中国，数量等于美国和欧洲所提交材料的总和。此外，尽管这次会议在澳大利亚召开，仍有
    1/4 的代表来自中国。


    中国把自己的未来公开地押注在了人工智能上。这是深思熟虑的决定，极有成功的把握。中国的人口逐渐城市化，面临着人口结构发生变化的挑战。中国需要人工智能带来的生产力，继续与周围生产成本更低的邻国竞争，满足本国越来越庞大的中间阶层人口。


    2017 年 7 月，中国政府公布了一份发展规划，计划到 2030 年成为人工智能的全球领跑者，创造 10 万亿元产值的国内人工智能行业。现在有迹象表明，该计划正顺利推进。


    中国有许多天然的优势，可以帮助它赢得这场人工智能赛跑。类似谷歌、Facebook 和亚马逊这样的美国大型科技巨头为数极少。中国却有着可与之一较高下的竞争者：腾讯、阿里巴巴和百度等公司。


    中国还有可提供给人工智能算法的数据。中国拥有 7.5 亿互联网用户（包括全世界最大的智能手机用户市场），贡献出一口庞大的数据金矿。腾讯的微信软件，在全球有着近
    10 亿用户，阿里巴巴集团则拥有 5 亿淘宝活跃买家。


    这些中国公司，有许多都为人工智能投入了数亿人民币。此外，中国政府出台了有利于这些中国公司发展的保护政策，后者从前“山寨”硅谷，如今反倒常常一路领先。


    自从 5000 年前发明算盘之后，计算的历史似乎没怎么朝中国投去目光。但未来一两百年里，人工智能的历史很可能会把视线大量汇聚在这个全世界人口最多、届时甚至可能是最为富裕的国家身上。


    致 A 与 B


    是你们让我的生活如此有趣


    # 引言


    让我从一句来自 1950 年的引言开始吧。当时的世界是个简单得多的地方。电视是黑白的。喷气式飞机尚未进入民用领域。硅晶体管还没发明问世。全世界一共只有十来台电脑。\[1\]每台都是满满当当的真空管、继电器、插接板和电容器的华丽组合，能塞满整个房间。


    因此，只有一个胆量十足的人才敢预测说：“我相信，到了 20 世纪末，语言的用法和受过教育者的普遍观点将会出现重大转变，人可以说‘机器在思考’，且不认为这自相矛盾。”\[2\]多么大胆的想法呀！能思考的机器。在不远的将来，机器真的能思考吗？如果它们真的能，它们什么时候会变得比我们更擅长思考呢？


    但首先——是谁做出了这一大胆的预测呢？他们的预测有多大的分量？1999 年，《时代》杂志将提出这一预测的人推选为“20 世纪百位最重要人物”之一。\[3\]毫无疑问，他是
    20 世纪最高深莫测的一个人物。他是一位数学家，一位“二战”英雄。更为重要的是，他是一位梦想家。而且，直到今天，在他英年早逝很久以后，他的梦想仍对我们产生着影响。


    一部奥斯卡获奖影片讲述了他在第二次世界大战期间破解德国 Enigma 密码中发挥了何等关键的作用。温斯顿·丘吉尔形容他和这些从事密码破译工作的同事是“下金蛋的鹅——但从不呱呱叫”。按大多数历史学家的估计，破解出
    Enigma 密码，至少将战争缩短了两年。这无疑挽救了数百万人的生命。但我怀疑，到了 21 世纪末，人们对这位天才记得最多的事，不会是他破解过密码。


    在破解 Enigma 密码的过程当中，他奠定了计算机的理论基础，并帮助开发了用来破解德军密码的实用计算设备“邦比”（Bombe，第一批此类设备之一）\[4\]。他的理念渗透到了当今的整个计算机科学领域。第一台计算机还没问世，他就提出了一套彻底通用的基本计算机模型。\[5\]为了表彰他的贡献，计算机领域最负盛名的奖项以他的名字命名。尽管计算机在我们生活的方方面面都发挥着巨大影响，但我猜，人们最记得他的地方，不会是他奠定了计算机科学的诸多基石。


    他对发育生物学的分化和形态发生（morphogenesis）这一生物学分支也产生过巨大影响。他在全世界历史非常悠久的科学期刊之一发表过一篇论文，名为《形态发生的化学基础》（*The
    Chemical Basis of Morphogenesis*）。\[6\]该刊物此前的作者包括达尔文（Charles Darwin，他的进化理论改变了我们对自身的认识）、亚历山大·弗莱明（Alexander
    Fleming，他发现了青霉素，挽救了数千万人的生命）、詹姆斯·沃森、弗朗西斯·克里克和多萝西·霍奇金（James Watson，Francis Crick
    和 Dorothy Hodgkin，他们发现了 DNA 结构，开启了基因革命）等生物学界的标志性人物。他的论文就自然界形成图案提出了一套理论，解释了动植物身上条纹、斑点和螺旋的形成。如今，这篇论文的引用次数是他著作里最高的。即便如此，我还是怀疑，到了
    21 世纪末，人们对他的贡献记得最清楚的，恐怕不会是图案形成。


    他还是同性恋社群里的一个重要人物。20 世纪 50 年代，同性恋在英国不合法。1952 年，他因同性恋行为遭到起诉，随后又接受了药物阉割，许多人认为这一切导致了他最终自杀，象征英国政府抛弃了这样一个在“二战”中做出了巨大贡献的人物。\[7\]2009
    年，经过了民众的一轮公开请愿，首相戈登·布朗（Gordon Brown）最终为他的遭遇表示歉意。4 年后，女王签署了极少见的皇室赦免书。不足为奇，同性恋社群的部分人士视他为烈士。但我怀疑，到了
    21 世纪末，人们对他最深刻的缅怀，恐怕不会缘自这些私人问题。


    那么，人们对他记忆最深刻的到底会是什么呢？我想，那会是他在不怎么出名的哲学杂志《心智》（*Mind*）上发表的一篇论文。本章开头的引文便出自该论文。截至当时，《心智》最出名的地方应该是发表了刘易斯·卡罗尔（Lewis
    Carroll）探讨芝诺悖论逻辑的论文《乌龟对阿基里斯说了些什么》（*What the Tortoise Said to Achilles*）。\[8\]到了今天，我们引言的出处被视为人工智能史上最重要的一篇论文。\[9\]它设想未来的机器会思考。我们的作者撰写这篇论文的时候，世界上仅存的十来台电脑又大又昂贵。它们的功能远远不如你今天揣在口袋里的智能手机强大。在那时候想象计算机会对我们的生活产生什么影响显然很难。想象有一天它们会自己思考，就更难了。然而，论文预见到了日后人们否定思考机器的各种观点，并一一作了反驳。很多人都把这篇论文的作者看成是人工智能领域的奠基之父。


    当然了，他就是皇家学会研究员艾伦·麦席森·图灵（Alan Mathison Turing），生于 1912 年，逝于 1954 年。


    我预测，到 21 世纪末，艾伦·图灵最为人铭记的地方是，为思考机器开发领域奠定了基础。这些机器注定将急剧改变我们的生活，一如蒸汽机在工业时代初始之时。它们将改变我们的工作方式、我们的教育方式、我们对待疾病与衰老的态度，并最终改变人类得以为后代铭记的方式。它们很可能会是我们最具变革性的作品。科幻小说里充斥着会思考的机器人。科学事实正紧跟在它后面追赶。


    我们的生活正大步飞奔着冲向科幻小说里梦想的未来。我们每天都携带的掌上电脑可以回答最稀奇古怪的问题，用游戏和电影为我们提供娱乐，迷路的时候指引我们回家，帮我们寻找工作或生活伴侣，播放一首情歌，让我们跟世界各地的朋友即刻连接。思考机器“变身”成手机，只是它们最不值一提的作用。


    当然，我的这一预测（认为图灵最大的遗产就是帮忙开创了人工智能领域）会引发几个问题。到了下个世纪之交，这些能思考的机器会记得图灵吗？那会是一个美好的未来吗？机器人会接手所有艰苦危险的工作吗？我们的经济会继续繁荣发展吗？我们能减少工作时间，享受更多假期吗？还是说，好莱坞是对的，未来很艰难？富人会越来越富，而我们其他人越来越穷？我们中会有更多人失业吗？甚至，更糟糕一点儿，机器人最终会接管整个世界吗？我们如今正在播撒自我毁灭的种子吗？


    本书将探讨这些问题。它将预测人工智能会把我们带向何方。在第一部分，我会考察我们能从过去学到些什么教训。如果你知道一种技术的源头，或许能更好地理解它的发展方向。在第二部分，我审视了当今人工智能的发展，审视了制造思考机器的风险和收益。我尝试现实地评估这一伟大尝试带来的结果。制造思考机器无疑是一项雄心壮志的努力，如能成功，定将对社会造成巨大影响。最后，在第三部分，我会更详细地讨论人工智能的未来。书籍和电影里的狂野未来会变成现实吗？它们够不够异想天开？而我也将“亲身试水”，对“2050
    年人工智能将取得什么样的成就”做出十项预言。有些预测说不定会叫你大吃一惊。


    如今正是人工智能领域大火的时代。过去 5 年，数十亿美元的风险投资涌入了人工智能企业。\[10\]重注已经押下。计算巨头 IBM 在旗下的认知计算平台沃森（Watson）上押了
    10 亿美元。\[11\]丰田为研究 AI 无人驾驶技术投入了 10 亿美元。开发安全通用人工智能的项目 OpenAI，也得到了 10 亿美元的资金支持。2015
    年创办的软银愿景基金（SoftBank Vision Fund），背靠沙特阿拉伯的资金支持，拥有差不多上千亿美元投资技术公司，以人工智能和“物联网”为焦点。谷歌、Facebook
    和百度等技术行业大佬，也在大手笔地投资人工智能。毫无疑问，在这个领域工作，当下正是一个非常激动人心的时刻。有了这么多的资金投入，思考机器的开发说不定还会加速。


    ### 为什么阅读本书？


    今天，计算机正以惊人的速度改变着我们的生活。因此，全球范围内，人们渴望对人工智能获得更深入的了解。许多评论家都预言会出现了不起的事情。2016 年 5 月，微软英国分公司的首席构想官戴夫·科普林（Dave
    Coplin）非常大胆地提出：人工智能是“当今地球人们着手从事的最重要的技术”。他说：“这将改变我们跟技术的关系。它将改变人与人之间的关系。我认为，它甚至会改变我们对人类这个概念的看法。”


    一个月前，谷歌首席执行官桑达尔·皮查伊（Sundar Pichai）介绍说，人工智能是谷歌的战略核心。“关键的动力……是我们对机器学习和人工智能的长期投入……展望未来……我们将从‘手机优先’进入‘人工智能优先’的世界。”


    然而，其他不少评论家则预测，人工智能蕴含着许多危险，如果我们不够谨慎的话，它甚至有可能加速人类的灭亡。2014 年，埃隆·马斯克（Elon Musk）向麻省理工学院的听众发起警告：“我们对人工智能应该非常谨慎。如果非要我猜什么会对我们的生存造成最大威胁，那大概就是它了。”马斯克是位连续创业家，以发明并投资了贝宝（PayPal）、特斯拉汽车和
    SpaceX 而闻名于世。他通过创新，撼动了银行业、汽车业和太空旅行业，所以，想必你会承认他对技术，尤其是计算技术对世界的破坏力略知一二。马斯克用自己的钱来支持上述观点（人工智能对人类生存构成重大威胁）。2015
    年初，他向人类未来研究所（Future of Humanity Institute）捐赠了 1000 万美元，资助研究人员探索怎样确保人工智能的安全性。对一个像马斯克那么富有的人（他的身价约为
    100 亿美元，跻身全世界最富有的 100 人之列）来说，1000 万听起来不像是个太大的数目。但到 2015 年晚些时候，他又把赌注提高了 100 倍，宣布自己是
    OpenAI 项目所得 10 亿美元背后的主要出资人之一。该项目的目标是开发安全的人工智能，再将它开放给全世界。


    马斯克提出警告之后，物理学家史蒂芬·霍金（Stephen Hawking）也认为人工智能具有危险性。霍金一面欣喜自己的语音合成器软件升级了，一面略带讽刺地用该技术的电子嗓音发出警告：“全面人工智能的发展，有可能召唤出人类的灭亡。”


