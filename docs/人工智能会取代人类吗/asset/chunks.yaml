  trans: '


    人工智能正在进步。它进步得或许比这个领域早期一些研究人员所预测的要慢，但计算机每天都越变越聪明，这的确是不争的事实。故此，怎样准确地衡量这一进步，成了一项根本性的挑战。说来或许并不叫人感到意外，这是一项十分艰巨的挑战。我们对智能本身没有很好的定义，故此也难以判断计算机是否越发智能。


    你大概会想，为什么不用 IQ 测试呢？毕竟，IQ 测试就是对人类智力进行标准测量用的。为什么不能用它们来测量机器智能呢？问题在于，IQ 测试里存在许多文化、语言和心理偏差，彻底无视人类智力生活的多个重要方面，如创造力、社交和情绪智力。此外，IQ
    测试需要最低限度的基准智力。对新生婴儿，或是还在襁褓里的孩子进行书面 IQ 测试，你了解不到太多信息。


    ### 图灵测试


    艾伦·图灵自己预料到了这个问题。他建议我们采用一种纯粹的功能性定义：如果一台计算机的行为方式与人类一样，那么就可以说它是智能的。他在 1950 年为《心智》杂志撰写的著名论文中，用一个简单的思想实验介绍了这种功能性定义。这就是日后的“图灵测试”。


    假设我们有一套智能程序，图灵测试让评委待在一个房间，使用一台计算机终端，跟该程序或真正的人相连接。评委向连接的程序或人提问，想提出什么问题都可以。如果评委无法区分对面的是程序还是人，则该程序通过了图灵测试。图灵预测，计算机能在未来
    50 年里通过这一测试。而现在，刚好过去 50 多年，所以，如果图灵是正确的，那么计算机现在就应该能通过测试了。我马上会来讨论我们距离实现这一目标还有多久。


    我们还要谈一谈针对更专业任务的图灵测试。假设说你正在开发一套自动撰写啤酒评价的程序。如果你的程序撰写的评价跟人撰写的评价无法区分，那么，该程序就通过了图灵啤酒评价测试。让我们来看看以下的啤酒评价：


    漂亮的深红色，酒头很好，玻璃杯里留下的泡沫花边绵密丰厚。带覆盆子和巧克力的酒香。不过除了有覆盆子的气味之外，没有太多的深度可言。此外还有微妙的波本酒味。我真的不知道哪款啤酒的口感会像这样。我更喜欢过喉时的碳化泡沫再多些。挺好喝的，如果这种啤酒市面有售那就更好了。


    计算机能写出这样的东西来吗？实际上，这就是计算机写的。[\[1\]](#chapter001_0006.xhtml#m1)操作人员只告诉它要给一种有水果或蔬菜味的啤酒写评价。于是它就生成了这篇短文，完全自动。为写出评论，它使用了一套神经网络，用
    BeerAdvocate.com 上的数千条过往评价做了训练。操作人员没有向计算机讲解英文语法规则，也没有告诉它怎样让评价看起来像人写的。它通过检测过往评价的模式，了解到上述所有信息。


    ### 勒布纳奖


    我的看法（我相信，我在人工智能行业工作的许多同事也有同样的看法）是，最好是把图灵测试看成是德语里所谓的“理想实验”（Gedankenexperiment）——这是一种思想实验，我们可以用它来探讨机器思考的设想以及它意味着什么，但它不需要实际执行（或者这么说吧，不一定需要像图灵设想中那样执行）。


    但也不是所有人都这样想。1990 年，发明家休·勒布纳（Hugh Loebner）设立了 10 万美元的奖金和一枚纯金奖章[\[2\]](#chapter001_0006.xhtml#m2)，打算颁给第一个写出一款程序能通过图灵测试的程序员。自此之后，勒布纳奖赛每年举办。


    勒布纳奖赛已经周游了全球。它基本上在英国举办；1999 年，它到澳大利亚弗林德斯大学做了短暂游历；2000 年又回到了北半球，此后尚未再次穿过赤道。有两年，它在纽约市勒布纳自己的公寓里举办。2014
    年以来，它由全世界致力于研究人工智能的最古老的科学协会——英国人工智能和行为模拟研究协会举办。


    勒布纳奖引来了不少批评的声音。事实上，马文·明斯基[\[3\]](#chapter001_0006.xhtml#m3)就认为这是一个宣传的噱头[\[4\]](#chapter001_0006.xhtml#m4)，任何人能阻止勒布纳奖，他都愿送上
    100 美元的酬金。勒布纳回应说，没有人会错过更多宣传的噱头。这一下，明斯基成了共同赞助人，因为按照规则，只要有程序通过图灵测试，勒布纳奖便自行终止。有一阵子，勒布纳的公司制作可折叠塑料迪斯科舞池。勒布纳说：“用来自塑料迪斯科舞池的钱赞助人工智能，甚至为之做推广，这挺有趣的。”除了创办人的自我炒作这一点，勒布纳奖还有许多方面遭到批评。最严重的批评是，比赛经常找来一些根本不合格的评委，而且，比赛的规则和安排上鼓励甚至有时奖励作弊。


    ### 电脑程序通过了图灵测试？


    2014 年，图灵测试在伦敦皇家学会举行。有点儿让人心酸的是，这场测试是在艾伦·图灵逝世 60 周年之际举行的。获奖程序是一款叫作尤金·古斯特曼（Eugene
    Goostman）的聊天机器人。该聊天机器人假装是个 13 岁的乌克兰男孩。活动结束后发布的新闻稿称，计算机程序首次通过了图灵测试，30 名评委里有 10
    人认为该聊天机器人是真人。[\[5\]](#chapter001_0006.xhtml#m5)但我们并不清楚，在 5 分钟里骗过 30%的人类评委是不是就够了。图灵的论文并未特别规定测试的时间长度、要骗过的评委人数。不过，他做了如下的预测：“我相信，在未来大约
    50 年里，对计算机编程，让它精通模仿游戏，普通的询问者经过 5 分钟的提问，只有不高于 70%的概率能做出正确判断。”1952 年，BBC 电视台的 3
    频道对此展开了讨论，图灵本人并不太乐观，他预计通过自己的同名测试“至少需要 100 年”。大略地读一下 2014 年皇家学会图灵测试里的人机对话脚本，我们会发现：要让计算机程序按照图灵的原意通过图灵测试，还有很长的路要走。


    #### 2014 年 6 月英国皇家学会举办的图灵测试之对话记录


    评委：哈罗。

    尤金：哈罗，很高兴有机会跟你聊天！我的几内亚小猪也送上问候！

    评委：比尔是公的还是母的？

    尤金：拜托亲自去问比尔吧。

    尤金：我还是跟你聊天好了。你叫什么名字？

    尤金：叫我尤金。很高兴跟你说话！

    评委：我叫简，我是女的。你呢？你是男是女？

    尤金：我是男的。一个“小伙子”。

    评委：很高兴认识你，尤金。你那儿天气如何？

    尤金：我们还是说回之前的话题吧！

    评委：你不喜欢说说天气吗？

    尤金：聊天气的话全是浪费时间。

    评委：你想讨论些什么？

    尤金：我不知道。最好是跟我多讲讲你自己！


    假装成一个 13 岁的乌克兰男孩，频频地回避回答问题——许多人工智能研究人员，包括我自己，都不认为这符合图灵所提出的测试的精神。在最低限度上，你需要模仿成年人，那就需要回答问题。对话程序的开发目标应该是智能地回答问题，而不是有意欺骗，躲躲闪闪。有趣的是，图灵料到玩模仿游戏的机器兴许会尝试这类把戏。在《心智》杂志的著名论文中，他略带草率地驳斥了这种担忧：


    也许有人会提出，玩“模仿游戏”时，机器的最佳策略有可能并非模仿人的行为。或许如此，但我认为这么做没有太大效果。不管怎么说，这一询问的目的不是博弈理论，我们应当假设，最优策略就是尽量提供人自然而然给出的回答。


    ### 超越图灵测试


    图灵测试还存在另一些问题。智力有许多维度：情绪智力、语言及演绎智力，等等。此外，测试应该更客观，难以作弊，减少文化偏误，较少关注单个任务，更便于衡量增量式进步。鉴于诸如此类的许多问题，这里有一些提议测试，或许能更好地完成测量思考机器开发进展的任务。


    多伦多大学顶尖人工智能研究员赫克托·莱维斯克（Hector Levesque）提出了一种替代方案：威诺格拉德模式挑战赛（Winograd Schema Challenge）。测试的名字得自人工智能研究先驱特里·威诺格拉德（Terry
    Winograd），他在 1968 年开发的 SHRDLU 程序，是第一批自然语言理解计算机程序之一。SHRDLU 可以回答有关一个虚拟积木世界的自然语言问题。在当时，这极具开创意义。程序的输出记录对它的性能做了很好的概括。


    #### 与 SHRDLU 程序的对话


    人：拿一块大的红色积木。

    计算机：好。

    人：抓住金字塔。

    计算机：我不明白你说的是哪一种金字塔。

    人（改变了主意）：找一块积木，比现在手里这块更高，把它放进盒子里。

    计算机：你说的“它”，我以为是指比我手里拿的那块更高的那块。

    计算机：好的。

    人：盒子里有什么？

    计算机：蓝色金字塔和蓝色积木。

    人：金字塔是什么撑起来的？

    计算机：盒子。

    人：有多少块不在盒子里？

    计算机：4 块。

    人：是不是至少有一块比我让你拿起来的那块更窄？

    计算机：是的，红色的方块。

    人：它有支撑吗？

    计算机：有的，是桌子撑着的。

    人：桌子能把积木拿起来吗？

    计算机：不能。

    人：金字塔可以用积木来支撑吗？

    计算机：是的。

    人：金字塔可以支撑金字塔吗？

    计算机：我不知道。


    受到 SHRDLU 程序的启发，威诺格拉德模式挑战赛要求计算机回答一系列多项选择题，执行简单的解析，理解代词“它”的含义。挑战赛中的问题是成对的。


    奖杯装不进棕色手提箱里，它太大了。什么太大了？

    0：奖杯

    1：手提箱


    奖杯装不进棕色手提箱，因为它太小了。什么太小了？

    0：奖杯

    1：手提箱


    要弄清楚“它”是什么，光有语法规则还不够。你需要理解有关“它”的问题和原因。上面的例子需要一些常识和几何推理。奖杯装不进，不是因为“它”（奖杯）太大，就是因为“它”（手提箱）太小。以下的例子则示范了这些问题所检测的另一些方面的智能。


    大球直接把桌子给撞坏了，因为它是钢制的。什么是钢制的？

    0：球

    1：桌子


    大球直接把桌子给撞坏了，因为它是泡沫做的。什么是泡沫做的？

    0：球

    1：桌子


    回答这些问题需要材质知识和物理推理能力。因为球直接把桌子撞坏了，不是因为“它”（球）是钢制的，就是因为“它”（桌子）是泡沫做的。要弄清正确的答案，你需要知道材质的密度，什么能把什么撞坏。


    图灵测试的另一种替代方案是宜家挑战。我拿不准这是不是个好的选择，但任何努力组装过某样宜家家具的人恐怕都能够理解它。该挑战是让机器人根据常规说明图片来组装宜家家具。我猜，要完全解决这一挑战，恐怕得花上
    100 多年。


    ### 元图灵测试


    图灵测试中隐含着这样的设想：只有智能才能识别何为智能。我们把判断一台计算机是不是一个智能造物的任务交给了具备智能的人类。这就引入了测试的不对称性。没有人去判断评审是否智能。


    出于这个原因，我提出了图灵测试的另一种替代方案，我叫它“元图灵测试”。这是一项对称的测试，我们找来一群数量相同的人和计算机。他们两两结对进行交谈。每一方都必须判断小组里哪些是人，哪些是机器。要通过元图灵测试，你既要精通分辨人和机器，也要表现得像个人，被接受测试的其他人判断为人。


    回避问题，或者抛出没头没脑的一段话，你是通不过测试的。你必须提问，判断对方是人还是机器。要想出好的问题，判断你是在跟人还是跟机器说话，这可比单纯地回答问题困难多了。


    ### 恐怖谷


    衡量人工智能进度的另一个问题是，我们常常错误地判断机器对人的相似度。就机器人技术而言，这里存在一个有趣的心理现象，叫作“恐怖谷”（The uncanny valley）。如果机器人看起来跟人差不多，行动也差不多，我们就会因为它们的外表产生不安。随着机器人越来越像人类，我们的心理舒适度就会越向谷底陷落。微小的差距愈发明显，也承担了越来越大的重要性。计算机生成图形领域也观察到类似和相关的现象。


    反过来说，计算机程序似乎又有跟恐怖谷相反的问题。在跟计算机互动时，人们很快就会忽视那些不像人的失误和反应。前面提到过，约瑟夫·维森鲍姆发现许多人都误以为“伊莉莎”是个真正的心理治疗师，哪怕它不过是把人们的回答重新措辞，变成提问罢了。我自己也碰到过这一现象的若干例子。


    1997 年，加里·卡斯帕罗夫被“深蓝”痛宰时，计算机在第二局里下了一步奇怪的棋。“深蓝”不去吃掉孤立无援的卒，反而主动牺牲了一个。卡斯帕罗夫感到了不安。计算机似乎展现了巨大的战略前瞻眼光，提前进行防御，防止出现反击的一切可能。这步棋向卡斯帕罗夫暗示，较之一年前两人的第一场交战，“深蓝”已经大为进步。然而，这步棋是“深蓝”代码的漏洞导致的。程序并不像卡斯帕罗夫想的那么聪明，也并没有那么强的前瞻能力。但卡斯帕罗夫不由自主地认为深蓝比他想的还要聪明，这也并不奇怪。谁乐意输给一台愚蠢的计算机呢？


    我们可以把这称为“自然谷”。当程序接近我们自己的智能水平时，我们会迅速认为它们比实际情况还要聪明。我们落入了“以为它们更自然”的陷阱。随着计算机接管从前由我们来完成的任务，我们乐于认为，它们比实际上更加聪明。因为我们过去做这些任务的时候可困难了！此外，我们会自动地，甚至潜意识地纠正跟他人沟通中出现的小失误。我们会把平常用来对待其他人类的揣度之心用来对待计算机，并认为它们比实际上更为智能。


    ### 乐观预测


    让我们从衡量进度的问题转到预测进展何时出现的问题。艾伦·图灵预测说，到 2000 年，我们就拥有思考机器了，如今的事实证明，这个设想有点太乐观了。在千禧之交，我们离目标的距离还颇有些远。遗憾的是，许多顶尖的人工智能研究员仍有着和图灵同样的乐观情绪。1957
    年，诺贝尔奖获得者赫伯特·西蒙宣布，我们已经进入了智能机器的时代：


    如果我说，（人工智能）在核裂变和展望星际旅行的时代确有实现的可能，我可不是想吓唬你，让你吃一惊。但用最简单的方式来总结当下的局面，我能说的便是：如今我们置身的世界，就是机器能思考、学习和创造的世界。而且，它们做这些事情的能力将快速提高，在可见的未来，它们能处理的问题的范畴，将扩大到跟人类意识相同的程度。


    有鉴于机器智能的进步速度，他建议人类谨慎考虑我们的立场：“启发式解决问题的革命，将迫使人类思考——在机器智能不管是能力和速度都超越人类智能的世界，人扮演了什么样的角色。”


    和图灵一样，西蒙对思考机器的态度恐怕也太乐观了。当时所出现的机器，比他预测里的更难以改进。不过，在我看来，他建议我们考虑智能机器对人类生活的重大影响，这倒是一点儿也不错。


    1967 年，马文·明斯基对进展也非常乐观，他预言思考机器已经非常接近了。“一代人之内……创造‘人工智能’的问题大体上就能解决了。”[\[6\]](#chapter001_0006.xhtml#m6)3
    年后的 1970 年，他更加乐观：


    在 3 到 8 年之内，我们将拥有一台具有人类平均智能的机器。我的意思是，这台机器能阅读莎士比亚、给汽车打蜡、玩办公室政治、讲笑话、打架。到了这时候，机器将以惊人的速度开始自我教育。几个月后，它将达到天才水平；再过几个月，它的能力将无法估量。[\[7\]](#chapter001_0006.xhtml#m7)


    讽刺的是，这种过于乐观的主张说不定反而拖了该领域的后腿。人工智能评论家罗杰·彭罗斯等人持反对态度的一部分原因正是受了这些主张的刺激。彭罗斯说，他撰写《皇帝的新脑》（*The
    Emperor’s New Mind*）一书就是为了回应明斯基和其他人在 BBC 科普纪录片《地平线》（*Horizon*）节目中所提出的部分“极端而荒唐的主张”。


    ### 悲观预测


    为乐观主义者说句公道话，对思考机器持悲观态度的人所犯的错误，和赫伯特·西蒙及马文·明斯基等人同样糟糕。2004 年，弗兰克·利维（Frank Levy）和理查德·默南（Richard
    Murnane）认为，驾驶不可能在近期内实现自动化。[\[8\]](#chapter001_0006.xhtml#m8)这一预测提出后一年，斯坦福大学开发的自动驾驶车辆就顺着一条未经勘测的沙漠道路行驶了
    100 多千米，赢下了达帕大挑战赛（DARPA Grand Challenge）和 200 万美元的奖金。这场胜利标志着各大公司竞相开始建立一个价值数万亿美元的新行业：无人驾驶汽车。如果利维和默南稍微回过头去看一下，就知道自己的预言从头到尾都错了。早在整整
    10 年前，两辆自动驾驶汽车就在法国的高速公路上行驶了超过 1000 千米。[\[9\]](#chapter001_0006.xhtml#m9)


    普林斯顿大学高级研究所天体物理学家兼热心的围棋玩家皮特·胡特（Piet Hut）博士是另一位悲观主义者。1997 年，“深蓝”战胜卡斯帕罗夫之后，《纽约时报》引用胡特的话说：“计算机要在围棋上击败人类，恐怕需要
    100 年的时间，甚至更久。”20 年之后，这个悲观预测被证明是错误的。


    ### 专家意见


    2012 年，牛津大学的文森特·穆勒（Vincent Muller）和尼克·波斯特洛姆（Nick Bostrom）对一些人工智能研究人员进行了调查，问他们“高级机器智能”什么时候能实现。[\[10\]](#chapter001_0006.xhtml#m10)他们还特别追问，我们什么时候能制造出能执行人类大多数任务，且至少干得跟普通人一样好的机器。考虑到这种情况的发生存在很大的不确定性，他们要求估计的是
    50%可能达到这种程度的时间。这些估计的中间值是 2040 年。他们又问，高级机器智能 90%有可能出现是在什么时候。估计的中间值是 2075 年。另外，问及此类思考机器对人类的整体影响时，调查里只有半数的受访者持乐观态度。大约一半的人认为思考机器带来的影响是中立的，或是负面的。


    尼克·波斯特洛姆在畅销书《超级智能》（*Superintelligence*）中提出，人工智能向人类提出了迫在眉睫的威胁。上述调查便是他论点的主要证据之一。遗憾的是，媒体对此事的报道蹩脚透顶。许多报道称，穆勒和波斯特洛姆对
    500 多名研究人员进行了调查。[\[11\]](#chapter001_0006.xhtml#m11)没错，他们是向 500 多名研究人员发送了调查问卷，但回复的人只有
    170 名。所以，他们的调查只涵盖了全球数以千计人工智能工作人员中的极小部分。许多报告还称，接受调查的人全是“业内顶尖专家”。[\[12\]](#chapter001_0006.xhtml#m12)实际上，170
    名受访者里只有 29 人（不到 20%）可称得上“顶尖”研究员。[\[13\]](#chapter001_0006.xhtml#m13)绝大多数受访者来自人工智能世界的少数群体，这类群体有不少都倾向于对此类调查做出热情而乐观的回答。


    回答者所属的最大群体（来自穆勒和波斯特洛姆所谓的“通用人工智能”AGI 研究领域，总共贡献了 72 份调查回复），是两场聚焦于制造超级智能的大会的与会者。[\[14\]](#chapter001_0006.xhtml#m14)这群人占了所有回复的近一半。既然他们出席的是专门讨论超级智能及其存在风险的大会，你大概能料到，这群人对思考机器的出现时间会比较乐观。他们回答率最高，也反映出
    AGI 群体的热情态度。接受调查的 AGI 群体里有 65%的人对调查作了回应，相比之下，该调查的总体回复率仅为 31%。


