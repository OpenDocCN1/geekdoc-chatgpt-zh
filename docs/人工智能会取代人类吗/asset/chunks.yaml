    [参考书目13\\]）\n\n## 第七章  \n\n十项预测\n\n我想在本书的这个部分做一场有关未来思考机器的美梦，这个梦涉及的活动范围很大，包括交通、就业、教育、娱乐和医疗保健，它畅想的是2050年有可能是什么样子。为什么选择2050年这个时间节点呢？因为它已经远到足以让我们看到自己的生活发生一些天翻地覆的变化了。事实上，雷·库兹韦尔就预测那时候技术奇点已经到来。一如前文所述，我认为我们2050年不会到达奇点，甚至永远也不会到达奇点。即便如此，我们仍可预见一些重大的变化。\n\
