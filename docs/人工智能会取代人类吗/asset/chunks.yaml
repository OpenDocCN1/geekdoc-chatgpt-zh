    [\[24\]](#chapter001_0005_0001.xhtml#w24) 罗杰·彭罗斯爵士出生于 1931 年。他反对人工智能的观点引自他所著的《皇帝的新脑》一书\[见参考书目
    36\]。他认为人的意识并非算法，不能用传统的数字计算机建模。此外，他推测量子效应在人脑中扮演着至关重要的角色。这本书问世后不久，我邀请彭罗斯在爱丁堡大学人工智能系做了一次讲演（我当时在该大学任教）。彭罗斯来了，但他在讲演之前跟我吃午餐时说，来这里讲演让他感觉像是自寻死路，把脑袋放进狮子嘴里。当时，爱丁堡大学人工智能研究中心很出名，他感到紧张确实挺合理。虽然他的书获得了皇家学会“科学图书奖”，但他的观点却遭到了哲学家、计算机科学家和神经学家的质疑。我喜欢和彭罗斯一起吃午饭，但对他的讲演没那么喜欢。


    [\[25\]](#chapter001_0005_0001.xhtml#w25) 实际上，彭罗斯反对人工智能可能性的一些观点跟 J·R·Lucas 最早提出的类似，见\[参考书目
    32\]。


    [\[26\]](#chapter001_0005_0001.xhtml#w26) 从计算复杂性上来说，停机这一类的问题叫作“不可判定问题”。其他不可判定问题还包括：判断数学语句是否为真，判断两个数学函数是否总是计算出相同的答案，以及希尔伯特的第
    10 个问题（判断一个简单多项式方程是否具有整数解）。


    [\[27\]](#chapter001_0005_0001.xhtml#w27) 从技术上来说，图灵的结论证明，存在图灵机无法解决的问题。这并不妨碍其他更丰富的计算模型可用来计算这些问题。然而，即便依靠更丰富的计算模型，如量子计算机，我们仍然会碰到此类不可判定的结果。举个例子，量子计算机可以比传统计算机更快地计算某些问题，但既然经典计算机可以模拟量子计算机，那么，停机问题哪怕用量子计算机也仍然无法判定。


    [\[28\]](#chapter001_0005_0001.xhtml#w28) 确定一个数学语句是否为真，是希尔伯特的“判定性问题”。1936 年，阿隆佐·邱奇（Alonzo
    Church）使用自己的计算模型证明，计算机对此不可判定。1937 年，图灵使用自己的图灵机设想（在本质上等同于计算模型），独立地证明这个问题计算机不可判定。


    [\[29\]](#chapter001_0005_0001.xhtml#w29) 1943 年，Zuse Z3 在盟军空袭中被摧毁。“巨人”的开发始于 1943
    年 2 月，一年后，它解码了第一条消息，但它的存在，直到 20 世纪 70 年代才解密。和“巨人”不同，埃尼亚克 1946 年就公之于众，所以很多历史书籍都把它视为第一台计算机。曼彻斯特的小型实验机，绰号叫“宝贝”，1948
    年才制造出来，但它是第一台把程序放在存储器里的计算机，无须实际重新布线、改变开关就可改写。


    [\[30\]](#chapter001_0005_0001.xhtml#w30) 几乎没有证据表明托马斯·沃森说过“全世界只需要 6 台计算机”这样的话。查尔斯·达尔文爵士（他就是那位著名的自然科学家的孙子）1946
    年在担任英国国家物理实验室负责人时的确写过一篇报告，认为“很有可能”，“一台机器就足以解决全国需要它处理的所有问题”。


    [\[31\]](#chapter001_0005_0001.xhtml#w31) 1978 年，赫伯特·西蒙因对决策的研究获诺贝尔奖。他与艾伦·纽厄尔一起合作编写了两套开创性的人工智能程序，用来证明数学定理的逻辑理论机（Logic
    Theory Machine，1956）和一般问题解决器（General Problem Solver，1957）。这是第一批把知识跟问题解决策略分开的程序之一，也是
    20 世纪 80 年代出现的专家系统的（expert system）前身。


    [\[32\]](#chapter001_0005_0001.xhtml#w32) 唐纳德·米基出生于 1923 年，2007 年因车祸去世。1960 年，他写了
    MENACE（Machine Educable Noughts And Crosses Engine，直译为“可教育三连棋机”）。这是一套计算机程序，它学会了完美地下三连棋游戏。由于计算机当时不是随处可用，米基执行该程序时用数百个火柴盒来代表游戏的不同状态。


    [\[33\]](#chapter001_0005_0001.xhtml#w33) 为免得你对达特茅斯夏季研究项目倡议产生批评态度，有必要指出：学者们在写捐款倡议时一贯过分乐观。学术体制在设计上可以说是鼓励这种行为。


    [\[34\]](#chapter001_0005_0001.xhtml#w34) “摇摇”是一台摇摇晃晃的机器人。项目的领导者之一查尔斯·罗森（Charles
    Rosen）写道：“我们忙活了一个月，想给它找个好听的名字，我们想了各种希腊语名字，各种稀奇古怪的叫法，后来有个人说，哎呀，它摇晃得这么厉害，又动来动去的，就叫它‘摇摇’（Shakey）吧。”你可以到`https：//vimeo\]com/5072714`看一眼“摇摇”。


    [\[35\]](#chapter001_0005_0001.xhtml#w35) 见\[参考书目 14\]。虽然《生活》杂志的这篇文章写于 35 年前，但说是今天写的，也很应景：“什么能向我们保证，在做出这些\[关键\]决定的时候，机器会始终考虑我们的最佳利益？……MAC
    项目（MAC 是麻省理工学院 AI 项目的简称）的人们预见了一个甚至令人更加不安的前景。按照他们的推理，有了一台能为其他计算机编程的计算机，很快就会出现一台能够设计制造比它自己远为复杂和智能的计算机——由此无限循环。‘我担心这样的上升螺旋，很快就会失去控制，’\[麻省理工的\]明斯基说……人类大脑是不是过时了呢？细胞质的演进，是否会遭到电路演进的取代？‘为什么不会呢？’我最近向明斯基提出这些问题，他这样回答。‘说到底，人类大脑就是一台肉质计算机嘛。’我瞪大了眼睛，他却微微笑着。这个人\[明斯基\]在理论和电路错综复杂的丛林里住得太久了。不过，像明斯基这样的人也值得佩服，说英勇也不为过。他们卡在了一场普罗米修斯式的冒险中，从他们眼里，你看得出来，他们被自己所做的事情困扰着。让我沮丧的是另外一些人，他们是人工智能世界里不那么出名的小人物，他们全神贯注地思考电路上无限微小的谜团，从来不曾从工作中抬起头来，想一想它对自己生活的世界会有什么影响。还有五角大楼里那些给大部分人工智能项目买单的人，他们又在想些什么？明斯基说：‘我反反复复地警告过他们，我们走进了非常危险的领域。他们似乎不理解。’我想到，在这些粗心大意的人的照料下，‘沙基’长大以后会变成什么样呢？没法预见。”本书或许算是对这些担忧情绪的一个迟到已久的回应吧。趁此机会，我从自己和同事们的工作中抬起头来，思考它有可能会对我们生活的世界造成什么样的影响。


    [\[36\]](#chapter001_0005_0001.xhtml#w36) 为免得你担心是计算机作弊，我需要说明：投掷骰子的不是计算机，而是另一个独立的人。


