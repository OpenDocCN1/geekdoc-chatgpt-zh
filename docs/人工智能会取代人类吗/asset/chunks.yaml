- raw: "其他一些知名的技术专家，包括微软的比尔·盖茨（Bill Gates）和苹果的史蒂夫·沃兹尼亚克（Steve Wozniak，即著名的“沃兹”）也都预测人工智能的未来充满危险。1987年，信息理论之父克劳德·香农（Claude\
    \ Shannon）写道：“我想象，有一天，我们之于机器人，就如同今天的狗之于人类……我为机器喝彩！”[\\[12\\]](#chapter001_0004.xhtml#m12)就连艾伦·图灵自己，也曾在1951年BBC第三套节目的广播里提出了警示性的预测：\n\
    \n如果机器能够思考，说不定在思考上比我们还聪明，那将把我们置于何地？就算我们能让机器继续处在臣服的位置，比方说，在战略时刻关掉电源，从物种的角度讲，我们也应当感到极大的卑下……它……绝对会是能给我们带来焦虑的东西。\n\
    \n当然，不是所有技术专家都担心思考机器会对人类造成什么负面影响。2016年1月，Facebook的马克·扎克伯格驳斥了这一类的担忧：“我认为人类能够开发出可以为我们工作、可以帮助我们的人工智能。有些人担心人工智能会成为重大危险，但在我看来这有些牵强，它的发生概率比大规模疾病、暴力等导致的灾难要低得多。”中国互联网巨头百度的顶尖人工智能研究员吴恩达表示：“担心人工智能，就跟担心火星上人口太多差不多。”（别忘了，马斯克的另一个“登月”项目就是移民火星……）\n\
    \n那么，你相信谁才好呢？如果马斯克和扎克伯格这样的技术人员都无法达成一致意见，这不就恰恰意味着至少有些事值得我们担心吗？对人工智能的担忧由来已久。科幻小说作家阿瑟·克拉克（Arthur\
    \ C.Clarke）是一位非常优秀的未来愿景家，早在1968年，他就预言人工智能会带来危险后果。克拉克十分擅长预见未来的技术。他预见了地球同步卫星、全球数字图书馆（我们现在称之为互联网）、机器翻译等应用。他在小说《2001太空漫游》（*2001：A\
    \ Space Odyssey*）里描述的哈尔9000型电脑，就展示了人工智能接管地球造成的后果。\n\n受克拉克及其他有远见卓识的人士的启发，我从孩提时代起就开始对人工智能心怀梦想。我日后一直在这个领域工作，试图让这些梦想成真。所以，听到这个领域之外的人（尤其是非常聪明的物理学家和成功的科技企业家）预测人工智能将成为人类的终结，不免让我有点儿焦虑。最靠近现场的人能为这场辩论提供一些有帮助的思路吗？还是说，我们在自己做的事情里投入得太深，反而看不到这些风险了？再说了，为什么我们会致力于研发有可能毁灭自己的东西呢？\n\
    \n对人工智能的一些担忧兴许来自我们心灵深处的某个部分。普罗米修斯等神话故事（普罗米修斯是希腊神话里的神明之一，他把火种带给了人类，后来，火为人类造了许多福，也造了许多孽）就体现了这种恐惧心理。玛丽·雪莱（Mary\
    \ Shelley）笔下的科学怪人弗兰肯斯坦也表达了同样的恐惧——我们创造出来的东西有可能会伤害我们。但仅仅因为这种恐惧由来已久，并不意味着它来得没有道理。人类发明的许多技术都应该（也的确曾）让我们停下来好好想一想，比如：核弹、克隆、激光致盲武器和社交媒体。本书的目的之一，就是帮助你理解对思考机器的降临，你应该秉持几分的欢迎、几分的忧心。\n\
    \n辩论存在的一个问题是，外面的人对人工智能有很多误解。我希望消除一些误解。我的论点之一是，人们，尤其是这个领域之外的人，往往会高估当今和不远的将来人工智能的能力。他们看到一台计算机下围棋下得比任何人类都好[\\\
    [13\\]](#chapter001_0004.xhtml#m13)，又因为他们自己不会下围棋，便想象计算机也能做许多其他需要智力的任务，或者至少这么说，让机器做许多其他需要智力的任务并不困难。然而，围棋程序，和我们今天设计的所有其他计算机程序一样，属于白痴天才。它只能做好一件事。它甚至不能既下象棋又打扑克。人类要付出巨大的工程、努力，才能让它从事其他游戏。它绝不可能有一天早晨醒来，就觉得下围棋击败我们挺无聊，想玩玩在线扑克，给自己赢点儿钱。它更不可能有一天早晨醒来，突然想到要统治世界。它没有欲望。它是一套计算机程序，只能按照程序的要求去做事——把围棋下得特别好。\n\
    \n另一方面，我还认为，我们所有人都倾向于低估技术带来的长期变化。我们拥有智能手机才不过十来年时间，看看它们给我们的生活带来了多大的转变。想想互联网，它才不过二十多岁，却几乎改变了我们生活的每个方面——所以，想想未来20年会出现些什么变化吧。由于技术的倍增效应，未来20年有可能出现比过去20年更大的变化。我们人类很不擅长理解指数增长，因为进化是从应对眼前危险这个角度对我们进行优化的。我们不善于理解长期风险，也不擅长预期黑天鹅。[\\\
    [14\\]](#chapter001_0004.xhtml#m14)如果我们真的清楚地理解了长期，我们不会再购买彩票，我们会存更多的养老金。我们追求愉悦、回避痛苦的大脑，很难理解复合增长带来的进步。我们只生活在此时此刻。\n\
    \n在你更深入地阅读本书之前，我必须提醒你：预测未来的确是科学，但并不精确。丹麦物理学家和诺贝尔奖得主尼尔斯·玻尔（Niels Bohr）写道：“预测非常困难，预测未来尤其困难。”按我的预计，我所描写的宽泛情形应该是正确的，但一些细节肯定是错的。但在探索这些设想的过程中，我希望你能理解我和数千名同行为什么要把自己的一生投入到这条能带我们通往思考机器的刺激之路上。我希望你们明白，如果想要继续改善全人类的生活质量，为什么我们应该，也必须去探索这条路。我们在若干领域有道义责任要开发人工智能，因为它能拯救无数的生命。\n\
    \n最后，我希望你能想一想，社会本身有什么样的改变需求。这本书的终极信息是，人工智能可以引领我们走上许多条不同的道路，一些好，一些坏，但社会必须选择该选哪一条路，并根据这一选择采取行动。很多决策，我们可以交给机器去做。但我认为，只有某些决定可以交给机器去做，哪怕机器作决定比人类更好。从社会的角度来说，该把什么事情交托给机器，我们需要着手作出选择了。\n\
    \n**什么人应该阅读本书**\n\n本书面向对这个话题有兴趣但并非专业的读者。你或许想了解人工智能将把我们带往何处。还会出现什么样的有关思考机器的夸张预测呢？技术奇点会出现吗？你应该为它带我们走上的方向感到担忧吗？它对你和你的孩子们有些什么样的影响？如果某些预测能成真，到那一天还需要多长时间？为了避免读到一半接不上气，我把引用和额外的技术性说明放在了尾注当中。你可以完全不管它们把这本书读完。[\\\
    [15\\]](#chapter001_0004.xhtml#m15)不过，如果你想更深入地探讨一个概念，这些注释能带给你更多的细节，它们也是通往相关文献的跳板。现在，让我们上路吧。\n\
