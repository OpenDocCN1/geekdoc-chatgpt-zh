- raw: "调查中还有一大群人（贡献了42份回复），来自所谓的“人工智能哲理”（PT-AI），他们是穆勒在牛津主办的人工智能哲学及理论大会的参与者。本次大会的参与者包括两位主流人工智能研究人员，斯图尔特·罗素和亚伦·斯洛曼（Aaron\
    \ Sloman）。然而，其他许多参与者都是不折不扣的哲学家：丹尼尔·丹尼特（Daniel Dennett），此外就是穆勒和波斯特洛姆本人。这些人在开发人工智能系统、解决大量实际挑战方面几乎没有经验。这两群人（来自通用人工智能和哲理人工智能领域），贡献了调查总回复的2/3以上。说他们的回答代表了主流或顶尖的人工智能研究员，是颇为可疑的。\n\
    \n为叙述的完整考虑，请让我介绍一下接受调查的第4群人，也是最后一群人，他们是希腊人工智能协会的26名会员。如今，希腊在计算机科学好几个领域都有很强的实力，其一是数据库。但如果我说，人工智能领域走在前头的是其他国家，如美国、英国、德国和澳大利亚，希望我的希腊同事别生气。此外，这26名受访者只占希腊人工智能协会的10%，他们是否算是主流或顶尖人工智能研究员的代表性样本，同样存疑。综上所述，各位读者应该谨慎看待穆勒和波斯特洛姆的调查结果。\n\
    \n最近进行的一项调查，恐怕更好地揭示了从事主流人工智能的研究人员是怎么想的。2016年，人工智能进步协会（Association for the Advancement\
    \ of Artificial Intelligence，AAAI）的193名研究员接受了调查。入选这一协会，是人工智能领域的一项最高荣誉。该协会只针对数十年来在人工智能领域做出了重大和持续贡献的人士。研究员仅占该协会会员的不到5%，故此，把这样一些人称为“顶尖人工智能专家”是恰如其分的。人工智能进步协会的193名研究员里，有80人对调查作了回复（41%），其中包括领域内的许多知名人物，包括杰夫·辛顿（Geoff\
    \ Hinton）、埃德·菲恩鲍姆（Ed Feigenbaum）、罗德尼·布鲁克斯和彼得·诺米格（Peter Norvig）。[\\[15\\]](#chapter001_0006.xhtml#m15)跟穆勒及波斯特洛姆的调查不一样，1/4的受访者预测，超级人工智能永远不会实现，另外2/3的人预测要花25年以上的时间。总体来看，9/10以上的受访者指出，超级人工智能要到自己退休年龄之后才能出现。[\\\
    [16\\]](#chapter001_0006.xhtml#m16)这一预测结果比穆勒及波斯特洛姆的调查更为悲观。不过，在人工智能领域，有合理数量的专家认为21世纪内存在机器能跟人一样思考的可能性。\n\
    \n### 前面的路\n\n就算思考机器能在2100年出现，离那一天的到来仍有相当漫长的路要走。2016年，纽约市顶尖人工智能大会主办了首次威诺格拉德模式挑战赛。还记得吗，这是图灵测试的拟议替代挑战之一，目的是检验计算机的常识和其他类型的推理能力。获胜程序的准确率达到了58%，最多算得上D等成绩。[\\\
    [17\\]](#chapter001_0006.xhtml#m17)虽然胜出程序的表现比人随机投掷硬币要好，但跟普通人90%的正确率（人类在这种测试中一般都能达到这一水平）还差得有点儿远。\n\
    \n那么，我们在思考机器的道路上到底走了有多远呢？如果你把报纸所有跟思考机器进度相关的内容都加起来，或是你相信较为乐观的调查，你大概以为我们比实际上走得要远。\n\
    \n好吧，对人工智能的过去就介绍到这里。在本书的下一部分，我将转向人工智能的现状。我将详细介绍我们今天在思考机器的道路上走了多远，此外，还会谈一谈思考机器未来发展有可能存在的限制条件。\n\
    \n* * *\n\n[\\[1\\]](#chapter001_0006.xhtml#w1) 见\\[参考书目31\\]。\n\n[\\[2\\]](#chapter001_0006.xhtml#w2)\
    \ 勒布纳总是热切地提醒人们，和自己的奖牌不同，奥运会金牌不是纯金的。\n\n[\\[3\\]](#chapter001_0006.xhtml#w3) 马文·明斯基出生于1927年，2016年去世。按科普作家卡尔·萨根（Carl\
    \ Sagan）的说法，他这辈子就遇到过艾萨克·阿西莫夫（Isaac Asimov）和马文·明斯基这两个智力超过自己的人。明斯基是著名导演斯坦利·库布里克（Stanley\
    \ Kubrick）电影《2001太空漫游》的科学顾问。人工智能研究员雷·库兹韦尔（Ray Kurzweil）曾表示，Alcor公司保存了明斯基的尸体，并将于2045年左右让他苏醒过来。有趣的是，库兹韦尔预言机器超越人类智能也是在这一时期。库兹韦尔、尼克·波斯特洛姆（Nick\
    \ Bostrom）和其他几位人工智能研究员也加入了明斯基的队伍，花钱要求在至少零下200摄氏度保存自己的身体。\n\n[\\[4\\]](#chapter001_0006.xhtml#w4)\
    \ 除了同名奖项之外，休·勒布纳还因频频发起卖淫合法化活动而出名。\n\n[\\[5\\]](#chapter001_0006.xhtml#w5) 2014年6月8日，雷丁大学发布的新闻稿名为《人工智能里程碑，电脑首次通过图灵测试》。文章一开始就说：“在雷丁大学组织的一场活动中，由现代计算机科学之父艾伦·图灵设定的人工智能历史性里程碑，已经实现了。星期六，一款名叫尤金·古斯特曼的计算机程序，通过了2014年伦敦皇家学会举办的图灵测试。这项标志性测试，已经有65年的历史。开发团队包括‘尤金’的创作者弗拉基米尔·维塞洛夫（Vladimir\
    \ Veselov），他出生于俄罗斯，现居美国，此外还有乌克兰籍的尤金·杰姆琴科（Eugene Demchenko），现居俄罗斯。”文章还引用特立独行的人工智能研究员、教授凯文·沃里克（Kevin\
    \ Warwick）的话作为结束。沃里克对这场图灵测试表示支持：“皇家学会的会员艾伦·图灵在1954年6月7日去世前不久预测，假以时日，计算机能通过他的测试。很难想象，他能设想出今天的计算机，以及计算机之前的连接网络是什么样子。”我不认同凯文·沃里克的看法。艾伦·图灵对当今计算机的能力，以及要花多久才能制造出思考机器，都有过设想。（另外，2014年6月并不是人们第一次声称有程序通过了图灵测试。2011年，NBC新闻报道，“聪明机器人”（Cleverbot）通过了图灵测试，它在印度古瓦哈提举办的科技节上骗过了许多评委。）\n\
    \n[\\[6\\]](#chapter001_0006.xhtml#w6) 见\\[参考书目33\\]。\n\n[\\[7\\]](#chapter001_0006.xhtml#w7)\
    \ 见\\[参考书目14\\]。\n\n[\\[8\\]](#chapter001_0006.xhtml#w8) 见\\[参考书目30\\]。\n\n[\\\
    [9\\]](#chapter001_0006.xhtml#w9) 1995年，欧洲人展示自动驾驶汽车的一年以后，卡内基梅隆大学的改装庞蒂亚克小型运输车NavLab\
    \ 4，横穿美国行驶了3000英里，计算机操纵的时间占98%。然而，跟欧洲项目不同，人类仍然控制油门和刹车。\n\n[\\[10\\]](#chapter001_0006.xhtml#w10)\
    \ 本着充分披露信息的立场，我本人就是接受了穆勒和波斯特洛姆调查的研究人员之一。\n\n[\\[11\\]](#chapter001_0006.xhtml#w11)\
    \ “2012年，牛津大学的文森特·穆勒和尼克·波斯特洛姆询问550名专家……”（Slate，2016年4月28日）\n\n[\\[12\\]](#chapter001_0006.xhtml#w12)\
    \ “2014年，文森特·穆勒和尼克·波斯特洛姆对170名人工智能顶尖专家做了调查……”（Epoch Times，2015年5月23日）\n\n[\\[13\\\
    ]](#chapter001_0006.xhtml#w13) 回应了穆勒和波斯特洛姆调查的170名受访者里，有29人出自“人工智能行业前100名优秀作者”，这份名单由微软学术搜索（Microsoft\
    \ Academic Research）基于出版数据汇总。\n\n[\\[14\\]](#chapter001_0006.xhtml#w14) 穆勒和波斯特洛姆调查的两场大会是通用人工智能会议（AGI\
    \ 12）和通用人工智能的影响及风险会议（AGI-Impacts 2012）。这两场大会均由穆勒和波斯特洛姆于2012年12月筹办组织。\n\n[\\[15\\\
    ]](#chapter001_0006.xhtml#w15) 再一次本着充分披露原则：我也是接受本次调查的80名受访者之一。\n\n[\\[16\\]](#chapter001_0006.xhtml#w16)\
    \ 按照定义，超级人工智能会抢了人工智能研究人员的工作。故此，有论点认为：超级智能必然出现在所有人工智能研究员退休年龄之后！\n\n[\\[17\\]](#chapter001_0006.xhtml#w17)\
    \ 最初，2016年威诺格拉德模式挑战赛获胜者的准确率是48%。然而，就算是投掷硬币来回答测试的人也有望达到45%的正确率（因为60道题目里有几道存在两个以上的可行答案）。很遗憾，主办者在输入文件里犯了个错误。修正了该失误之后，获胜者（中国科技大学的刘权）的成绩提高了，正确率达到了58%。\n\
    \n# 第二部分  \n\n人工智能的现状\n\n## 第三章  \n\n当今人工智能的情况\n\n面对困难问题的时候，把它分解为若干部分，是个很自然的策略。构建思考机器这个问题，本身也分为许多不同的部分。许多从事人工智能工作的研究人员只关注其中一个部分，这不足为奇。当然，也有人认为这个问题从根本上就不可分解。但人类大脑有着诸多不同的部分，并且似乎是在执行不同的功能。故此，检验大脑的组成部分，尝试简化制造思考机器这个问题，应该是个合理的做法。\n\
    \n### 四大部落\n\n目前有四个不同的“部落”，从事着构建思考机器不同方面的工作。这么说或许极大地简化了现实，因为实际上人工智能的“智能”格局异常复杂。不过，对人工智能研究人员按“部落”分类，有助于我们理解这片“土地”上的真假虚实。\n\
    \n#### 学习部落\n\n我们生下来并不会说话，不知道什么东西好吃，不能行走，不知道太阳和星星，也不知道牛顿的物理定律。但我们逐渐学到了所有这些事情，甚至更多。因此，制造思考机器的方法之一，就是制造一台能像人类一样学习的计算机。这一思路，消除了另一个问题：编纂人在成长过程中掌握的所有知识——这些知识，对在现实世界中运作至关重要。一如CYC项目发现，为机器人编写所需的所有常识性知识，是一项痛苦而漫长的任务，比如水不能“拾起来”，天空是蓝色的，阴影不是物体，等等。\n\
    \n在学习部落内，我的同事佩德罗·多明戈斯（Pedro Domingos）确认了五支“宗教团体”：符号派、连接派、演进派、贝叶斯派和类比派。[\\[1\\\
    ]](#chapter001_0007_0001.xhtml#m1)\n\n符号派是莱布尼茨的门徒，把逻辑学里的观点带到了学习上。在逻辑学中，我们通常会进行演绎推理，推断A之后跟着是B。符号派逆转了这一过程，使用“归纳推理”来学习是什么导致了B。由于我们观察到了B，那么，他们假设A必然是其成因。\n\
    \n另一方面，连接派把神经科学的观点带到了学习上：从人类大脑里观察到的A和B、0和1等符号很少，更多的是连续的信号。他们采用的是类似我们神经元里的学习机制，从而学习怎样最好地权衡人造神经元里的各种输入。深度学习派就是这一“宗教”里最显眼的成员。\n\
    \n第三支“宗教团体”是演进派。他们从大自然里汲取灵感，使用类似于演进的机制（适者生存）来寻找问题的最佳计算模型。\n\n第四支“宗教团体”是贝叶斯派。他们采取的是一种可追溯到托马斯·贝叶斯（Thomas\
    \ Bayes）牧师的统计学习方法。[\\[2\\]](#chapter001_0007_0001.xhtml#m2)根据观察数据，他们可学习到哪一种模型里成功的可能性最大。\n\
    \n最后一支“宗教团体”是类比派。他们希望把问题映射到其他的某个空间（大多拥有更多的维度），这样类似项目之间的连接在此可能会表现得更为清晰。他们使用的是有着“支持向量机”这种华丽名称的学习方法。此类方法发现了问题的其他一些视角，此时，类似的项目（对猫的所有观察结果）紧密相连。凡是类似这些原有观察结果的新观察结果，即可视为一只猫。\n\
    \n#### 推理部落\n\n第二大部落是莱布尼茨、霍布斯和布尔的门徒。他们探索怎样为机器配备清晰的思考规则。机器可以根据明确编码的知识进行推理，或是依靠与现实世界的互动来学习。因此，推理部落或许依赖学习部落做前期预备工作。\n\
    \n人类推理远比布尔设想的简单代数模型复杂得多。现实世界并不都是0和1。我们必须要面对不完整、不一致的知识，要面对知识内在的不确定性，以及有关知识的知识。因此，推理部落试图开发正式的推理模型，能应对部分知识、矛盾信息、概率信息及有关信息本身的信息。推理部落本身也由众多不同的群体组成：有铁杆演绎推理派，他们中有一部分人试图让计算机进行数学推理、证明定理，甚至发明新的数学；另一个群体专注于规划，让计算机规划一系列的行动，达成特定的某个目标；推理部落内部的其他群体专注于推理任务，比如根据新出现的或互相矛盾的信息来更新知识库。\n\
    \n#### 机器人部落\n\n人类智能是一个复杂现象，它部分地来自我们与现实世界的互动。第三大部落——机器人部落——想要开发能在现实世界里行动的机器：它们可以对自己的行为进行推理，像我们一样通过互动来学习。故此，机器人部落与学习部落、推理部落存在交叠。当然，机器人需要感知自己在其中行动的世界，所以，这一部落里有些人主要从事计算机视觉工作，即让计算机具备感知世界状态的能力。视觉不仅帮助我们在现实世界中导航，而且是我们学习能力的重要组成部分之一。\n\
    \n#### 语言学部落\n\n构建思考机器的第四大部落是语言学家。语言是人类思想的重要组成部分。机器要思考，那就必须理解和操纵自然语言。语言学家开发可以解析书面文本、理解并回答问题，甚至在两种语言之间翻译的计算机程序。还有些人从事语音识别工作，让计算机把音频信号转换为自然语言文本。\n\
    \n### 两大洲\n\n让我们把部落的比喻做进一步延伸。人工智能研究中还有两“大洲”：褴褛洲和整齐洲。整齐洲寻求的是能够用来构建思考机器的简洁、精确的机制。莱布尼茨是整齐洲开疆拓土第一人，约翰·麦卡锡则是另一个著名的整齐洲人。而褴褛洲人认为智能过于复杂和混乱，无法通过简单、精确的机制解决。罗德尼·布鲁克斯是最著名的褴褛洲人。他开发的机器人就没有明确的逻辑控制结构，这些机器人在现实世界中感知与行动，复杂的行为从互动中浮现出来。褴褛洲人相当于人工智能世界的黑客。事实上，黑客文化的起源就可以部分地追溯到麻省理工学院计算机科学与人工智能实验室的许多褴褛洲人身上。\n\
    \n四大部落（学习部落、推理部落、机器人部落和语言学部落）的族人，散布在两大洲。比方说，机器学习的部分成员是褴褛洲人，也有些成员是整齐洲人。同样地，有些语言学家是褴褛洲人，有些是整齐洲人。不足为奇，推理部落几乎所有的族人都来自整齐洲，他们要解决的问题，常常是合乎逻辑的，故此本身就有着工整的方法。机器人部落的许多族人是褴褛洲的，他们面对的是复杂而又散乱的问题，故此要采用东拼西凑的方法。\n\
    \n现在我们来看看每一部落领土的发展情况。\n\n### 机器学习的情况\n\n今天，人工智能引起的许多喧嚣都来自学习部落取得的惊人进展。深度学习法表现尤其突出，取得了让人印象深刻的成绩，很多时候超过了其他老牌技术。例如，基于深度学习的语音识别系统，如百度的DeepSpeech\
    \ 2，在将语音转换为文本方面可跟人类一较高下。而且，我之前也提到过，2016年初，谷歌的AlphaGo程序击败了全世界最优秀的一位围棋选手。\n\n然而，如果就此得出结论，说机器学习让我们十分接近思考机器，只要再稍作改进，深度学习等技术就能让我们“解决”智能问题，这就错了。深度学习并不是游戏的终点，原因之一在于它需要大量的数据。在下围棋这样的领域里，获得大量的数据不难：数据库里塞满了高手从前下过的棋谱，计算机可从中学习。而且，我们还可以让机器自己跟自己对弈，生成数量无限的进一步数据。但在其他领域，收集数据就很难了。在许多机器人领域中，物理和工程情况或许会限制我们收集数据的速度——在机器人学习和犯错误的过程中，我们要小心地不把它们弄坏。还有些领域没有太多数据，比如我们可能想要预测心脏或肺移植患者的血液和身体组织类型，但这样的手术在全世界仅有几百例，可作为预测基础的数据太过有限。由于存在这样的问题，深度学习将面临挑战。相比之下，人类学习的速度相当快，只要有极少的数据我们就能学习。根据围棋专家的说法，AlphaGo下围棋的方式前所未有，尤其是在开局。尽管如此，李世石也只用了3局比赛就了解到AlphaGo是怎么赢的了。相比之下，AlphaGo比任何人一辈子下过的棋局都要多——它下过数十亿盘。所以，李世石是值得尊重的。再说了，人类的一场小胜，也等于是人类再一次战胜了机器（译注：此处当指李世石在第4局对弈中战胜了AlphaGo）。\n\
    \n深度学习为什么并不是构建思考机器的全部答案，还有其他几个原因。首先，我们常常希望思考机器能对自己作出的决定作出解释。深度学习基本上是一个黑匣子，不能用有效的方式来解释自己。第二，我们常常希望机器保证会做某些行为。比如，自动驾驶汽车看到红灯总会停。空中交通管制软件绝不允许两架飞机飞入同一空域。深度学习无法作出这样的保证，我们大概要靠基于规则的系统来实现上述目的。第三，人类大脑在复杂性上超出了今天使用深度学习构建的任何网络。人脑具有数十亿的神经元，上万亿的连接；今天的深度学习使用数千个人工神经元，数百万的连接。让它扩大到人脑的水平可不容易。此外，大脑具有许多不同类型的神经元和不同的结构，分别用于不同的任务。因此，对思考机器我们或许也需要类似的专门化。\n\
    \n尽管存在上述不足，机器学习技术仍然在走向成熟，无须人类的太多帮助，便可解决许多问题。但事情也并未达到只需要人按下按钮那么简单：要让技术运转起来，人类还是需要做大量的算法选择、参数调整，以及委婉地称为“特征工程”（feature\
    \ engineering）的做法。机器学习天生就会受到输入数据的限制。举例来说，想预测购物者是否会使用优惠券，你需要在模型里添加新的数据——比如自购物者上次从公司处购物以来过去了多长时间等。\n\
    \n不谈及大数据在机器学习最近成功中扮演的角色，我们是无法讨论机器学习的状况的。许多行业正利用大数据集来开发借助机器学习的实际应用。银行用大数据和机器学习来检测信用卡欺诈，亚马逊和Netflix等网商和服务商使用大数据和机器学习来调整产品推荐，美国航空航天局将机器学习应用到一套大型星表（译注：star\
    \ catalogue，指天文学目录，收录关于星体的各种数据的记录，包括天体在天空中的视位置、星等、光谱型等）上进而确认了一种新型的恒星。"
