    15 个人里才有一人死亡。著名人工智能研究员，我的同事罗伯·米林（Rob Milne）就葬身于珠穆朗玛峰。他在爱丁堡大学攻下博士学位后，成为五角大楼的首席人工智能科学家。他回到苏格兰创办了智能应用有限公司。每次碰到他，他都会给我讲他在山里最新的冒险故事。只可惜，攀登世界最高峰时，目标近在眼前，他却倒下了。他在工作和业余爱好上的表现都充满了勃勃雄心。


