  trans: '


    思考机器对社会还有其他的影响方式。在上一章，我提到了它们对隐私的影响以及算法歧视的情况。我们父母和祖父母一代人靠着斗争得到的许多权利即将失去，这一点存在着真切的风险。我们可能并未意识到这些权利正逐渐消失。但有可能，某天我们醒来，发现随着机器接管了从前人类专属的岗位，这些自由有不少都消失了，同等的机会，不再赋予所有人。我们并不是有心给机器编出了歧视程序，而是我们没把它们编写得好到足以避免歧视。


    ## 弟兄之海


    人工智能还有一个方面，把算法歧视这类问题变得复杂起来，那就是这一领域当前是一片“弟兄之海”（sea of dudes）。这个说法是时任微软研究员的玛格丽特·米切尔（Margaret
    Mitchell）2016 年所说（她现在谷歌任职）。她强调的是，人工智能研究员只有大约 10%是女性。其实，更准确地说，这是一片“白弟兄之海”（sea of
    white dudes）。


    遗憾的是，性别失衡始于早年岁月。GCSE 是英国年满 16 岁的在校学生要接受的公共考试。2014 年，参加 GCSE 计算学考试的学生中只有 15%是女性。两年后，参加
    A 级计算学考试的学生，只有不到 10%的人为女性。在大学和工业界，我们可以为这个问题进行补救，但很明显，我们需要把重点放在动员更多的年轻女性一开始就选择计算学。学生们刚开始选择所需科目的时候，姑娘们就选择了计算学之外的学科。


    这种性别失衡对人工智能开发进度是有害的。因为存在这样的问题，有些该问的问题没问，该解决的问题没解决。在人工智能研究领域，其他群体（如黑人、西班牙裔等）代表也不足。这同样有害，而且恐怕没有简单的补救措施。不过，承认问题存在，至少朝着减少未来偏差迈出了第一步。


    ## 人工智能和经济学


    经济，是我们生活中毫无疑问会受到思考机器改变的一个方面。大多数第一世界国家正在从工业生产转向知识经济，而知识经济的产出不是实物，而是智力商品。思考机器很可能会生产大量此类产品。


    80 多年前，英国著名经济学家约翰·梅纳德·凯恩斯（John Maynard Keynes）警告说：“我们正遭受着一种新的疾病的折磨，一些读者可能还没听过这个名字，但在未来的岁月，他们会多次听到——技术性失业。”[\[2\]](#chapter001_0009.xhtml#m2)凯恩斯预测，一个世纪之内，人均产出将比当时高
    4 到 8 倍。他还预测，工作周将减少到大约 15 小时，以对此加以抵消，让我们获得更多的闲暇时间。


    凯恩斯的增长预测是正确的。自那时以来，在澳大利亚，人均产出提高了 6 倍，美国的生产率也出现了类似的增长。伴随而来的是，大量工作岗位转出传统行业。1900
    年，1/4 的澳大利亚人在农业部门就业。到 2016 年，澳大利亚农业占总就业人数的比例仅略高于 2%。迟至 1970 年，制造业工人占总劳动力的 28%，现在的比例仅比
    7%略高。不过，对工作周的长度，凯恩斯却说错了。在大多数工业经济体中，工作周只稍微缩短，大约为 35 到 40 小时。


    从那时开始，对技术性失业的担忧越来越强。1949 年，艾伦·图灵非常明确地说：“我不明白，为什么它（机器）不能进入人类智力通常涵盖的一切领域，并最终以平等的方式展开竞争。”3
    年后，著名经济学家瓦西里·列昂季耶夫（Wassily Leontief）[\[3\]](#chapter001_0009.xhtml#m3)对技术的影响表达了同样的悲观情绪。他写道：“劳动力将变得越来越不重要……越来越多的工人将为机器所取代。我不认为新兴行业能够把所有想要一份工作的人都雇用下来。”[\[4\]](#chapter001_0009.xhtml#m4)


    列昂季耶夫以马匹的劳动力为例，说明技术变革对人类劳动力构成的威胁。随着铁路和电报的发明，马匹劳动力在美国经济中扮演的角色越来越重要。随着美国的发展和繁荣，1840
    年到 1900 年之间，马匹数量增长了 6 倍，全美共有 2100 万匹马和骡子。马匹或许觉得技术变革带来了安全感：虽说在城镇之间运送人员和信息的岗位逐渐消失，但社会上也出现了新的工作岗位，接替了原先的岗位。它们不知道，这是一种短暂趋势。内燃机的发明迅速颠覆了前述趋势，人口越来越多，国家越来越富裕，马匹逐渐从劳动力市场上消失了。到
    1960 年，全国仅有 300 万匹马，减少了近 90%。20 世纪初，经济学家就马匹劳动力未来在经济中的角色进行过辩论，他们或许曾经预测，一如过去，在新技术促成的领域，将出现适合马匹的新工作岗位。这可就错得太厉害了。


    1964 年 3 月，对技术性失业的担忧进入了成熟阶段。林登·约翰逊总统收到了来自“三重革命特设委员会”（Ad Hoc Committee on the Triple
    Revolution）的一份简短而令人震惊的备忘录。[^(\[5\])](#chapter001_0009.xhtml#m5)诺贝尔化学奖得主莱纳斯·鲍林（Linus
    Pauling）、《科学美国人》（*Scientific American*）出版商杰拉德·皮尔（Gerard Piel）和日后将要获得诺贝尔经济学奖的贡纳尔·默达尔（Gunnar
    Myrdal）等杰出人士在该备忘录上签了名。备忘录警告说，技术很快就会造成大规模失业。


    从绝对意义上来说，备忘录是错的。大规模失业并未出现。1964 年以来，美国经济增加了 7400 万个就业机会。但计算机和自动化彻底改变了现有的工作岗位，这些岗位需要技能，薪资也涌向了这些岗位。而且，我们不像是已经来到了终点。2015
    年，美国没有大学学位，年龄在 21 岁到 30 岁之间的男性，有差不多 22%此前的 12 个月里没有工作。20 来岁、有高中学历的男性，从前是美国工人队伍里最骨干的构成部分。他们离开学校，找到一份蓝领工作，干上
    40 多年，然后退休。今天，1/5 的这类人没工作，整个群体的就业率下降了 10%。这似乎引发了文化、经济和社会的衰退。没有工作，这一群体很难结婚、离开家乡或是参与政治，他们的未来看起来相当黯淡。


    ## 多少就业岗位受到威胁


    2016 年，受人敬重的计算机科学家莫舍·瓦尔迪（Moshe Vardi）在科学促进会年会上明确地说：


    我们正进入一个机器几乎能够在任何任务上胜过人类的时代。我相信，社会赶在以下问题到来之前就面对它：如果机器能做人类能做的几乎任何工作，那么人类要做些什么？……在人类劳动遭到淘汰之前，我们必须挺身而出，迎接这一挑战。


    一些研究试图更准确地量化这一影响。得到最广泛报道的是 2013 年牛津大学的弗雷和奥斯本进行的研究。[^(\[6\])](#chapter001_0009.xhtml#m6)该报告预测，未来
    20 多年，美国 47%的岗位将受到自动化的威胁。其他国家也做过类似的研究，所得结论基本上差不多。讽刺的是，撰写报告本身，就部分地自动化了。作者使用机器学习来准确地预测
    702 种不同的工作岗位里哪些能够自动化。通过机器学习，他们训练了一套分类机制，用程序来预测哪些工作岗位会转为自动化。他们先为程序馈送了一套训练集合，里头有
    70 种他们手工标注的能够自动化的工作岗位。接下来，程序预测了其余的 632 种岗位是否能够自动化。也就是说，就连预测未来哪些岗位会自动化的工作，也部分地自动化了！


    就算你同意报告做出的所有假设（我并不同意），你也无法得出很多报纸所做的结论：再过 20 多年，我们中有一半人都会失业。牛津报告只估计了未来几十年有多少种岗位有可能转为自动化，这并不能直接变成
    47%的失业率，原因有很多。


    首先，牛津报告估计的只是容易受自动化影响的工作岗位的数量。在实践中，出于经济、社会、技术和其他原因，有些岗位不会转为自动化。举例来说，如今我们基本上可以把航空公司飞行员的工作自动化。老实说，大多数时候，驾驶飞机的就是计算机。但在未来一段时间内，社会很可能要求有飞行员待在仪表盘前面，哪怕他们大部分时间都在浏览
    iPad。我可以很快举出更多的例子，说明报告里预测的一些能够自动化的岗位，实际上不会转为自动化。


    第二，我们还需要考虑技术创造的各种新岗位。比方说，我们不会再雇用很多人来从事铅字排版的工作。但我们雇用了更多的人，从事基本上同等的数字工作：制作网页。当然，如果你是个打字员，饭碗被毁了，那么，如果你接受合适的教育，你能够重新对自己进行定位，在这些新行业里找到工作，这很好。可惜经济学里没有一条基本定理曾指出，新技术摧毁多少旧岗位，就创造多少新岗位。过去的情形如此，纯属偶然。一如
    20 世纪的马匹劳动力一例所指出，事情并不总是如此。


    第三，一些岗位只能部分自动化，而自动化其实又可能提高我们的工作能力。例如，科学实验领域出现了许多新的自动化工具：基因测序仪可以自动读取我们的基因，质谱仪可以自动推断化学结构，望远镜可以自动化地扫描天空，但科学家们并未因此丢掉饭碗。事实上，较之文明史上的任何时期，如今从事科学工作的科学家都更多了。自动化提高了生产率，科学知识发现得更快了。


    第四，我们还需要考虑今后几十年里每星期的工作时长会有些什么样的改变。在大多数发达国家，每星期工作小时数自工业革命以来大幅下降。美国每星期的平均工作时从大约
    60 小时下降到 33 小时。其他发达国家走得更远，德国工人平均每星期只工作 26 小时。如果这样的趋势持续下去，我们就需要创造更多的工作岗位，代替缩短的时间。


    第五，我们还需要考虑人口统计变化。求职人数肯定会变。许多发达经济体的人口日趋老龄化，如果能够完善养老金制度，我们中会有更多人开始享受退休生活，不再需要为工作烦心。


    第六，我们还要考虑自动化带来的经济发展。自动化产生的一些额外财富将通过“涓滴”效应渗透到经济当中，在其他地方创造新的就业机会。当然了，如果你对“涓滴经济学”持有健康的怀疑态度（我就是），这个论点就不如其他论点那么站得住脚。富人花钱跟我们其他人不一样，他们致富靠的就是这个。同样道理，富裕的公司似乎并没有承担同等的税务责任，尤其是从公司获取收入的那些国家。不过，只要对个人及企业课税方式稍作调整，所有人都能受益于自动化带来的生产力提高。


    牛津报告确认了据称未来几十年里难以实现自动化的三种工作技能：创造力、社交智能以及感知和操纵能力。但这三种技能，每一种我都无法完全认同。


    首先，创造力已经实现了自动化。计算机可以作画、写诗、作曲、创造新的数学，它们做得或许还不如人类好，可能要再过二三十年，才能达到跟人类相当的水平。我会把创造力放到“自动化有难度”这一类下面，而非“除了人类，机器不可能做到”这一类。第二，今天的计算机缺乏真正的社交智能，但人们已经在着手开发能感知我们情绪状态、更具社交智能的计算机了。需要社交智能的岗位能抵挡自动化浪潮，不是因为它们不能自动化，而是因为，在很多情况下，人类更乐意与其他人类互动。和计算机比起来，我们更愿意跟真正的精神科医生说话。至于第三种技能，计算机已经能够比我们更好地感知世界了：它们能察知的波长更宽，精确度更高。不过，操作对机器人来说的确很困难，尤其是在工厂车间之外的不受控环境下。未来一段时间，情况可能不会有太大变化。


    牛津报告罗列的确切数字掩盖了一个难以准确预测的事实，那就是：未来几十年，我们到底会有多少人失业。对牛津大学的研究，我举出了若干保留意见。不过，很明显，白领和蓝领都有许多岗位受到威胁。以我之见，失业率可能会增加，但大概是预测的一半左右，也即
    20%到 25%。即便如此，这也是个巨大的变化，我们今天就需要开始为它做好规划。


    ## 哪些工作岗位可能会消失


    为了让你对未来的变化以及为什么许多岗位会发生变化甚至彻底消失有所体会，我想要逐一讨论一下有可能遭到取代的工作。


    ### 作家


    牛津报告指出，作家遭到自动化的概率是 3.8%，这听上去挺合理的。在未来当个作家，大概会是份牢靠（虽说薪资不甚丰厚）的工作。这不是因为没人试过让计算机写小说，实际上，2016
    年 3 月，计算机写出来的一部短篇小说，通过了日本一项文学奖（吸引了 1450 份稿件）的第一轮遴选。我想对这项成就的背景多说两句：该奖项允许非人类投稿，该程序获得了自己创作者的大力帮助，后者决定了剧情和人物；之后，程序根据预先准备好的句子和单词撰写了文本。小说的题目很有趣，叫《那一天，计算机写了篇小说》。它的结尾是这么写的：“那一天，计算机写了篇小说。计算机把追求自身愉悦放到了优先地位，不再为人类工作了。”


    就算我们认为这样的结局并无预言的意味，作家也有好几个理由，无须为自动化太过担心。首先，如果经济继续发展，我们可能会阅读更多书籍。过去 10 年，美国出版停滞不前，而在中国，出版业的发展，跟全国经济增长速度大致相同。第二，自动化创造出新的需求。亚马逊的推荐引擎让人能轻松找到有关伦敦圣殿教堂管风琴的书籍，故此，掌握了伦敦圣殿教堂管风琴专业知识的人类作家就有了新市场。第三，我们很可能最喜欢切中人类体验的书籍。要在人写的书和计算机写的书之间进行选择的话，我猜大多数人都会选人写的书吧。


    倒不是说自动化不会改变作家的工作。亚马逊等科技公司已经大大改变了出版行业。自出版和按需印刷模式，已经向所有拥有笔记本电脑的人打开了出版之门，而且这些改变远未结束。过去，只有少数作家名利双收，大多数人只能挣扎求生。在未来全新的出版世界中，这种情况可能会继续下去，甚至更糟糕。


    ### 自行车修理工


    牛津报告认为，自行车修理工遭自动化取代的概率是 94%，这纯属胡说八道。未来 20 到 30 年里，自行车修理工的工作，连一小部分转为自动化的概率都几乎是零。这一错误揭示了牛津大学研究的部分局限性，以及它对计算机预测的过分依赖（这一点极具讽刺意味）。


    首先，牛津大学的研究忽视了就业岗位自动化在经济上是否可行。很遗憾，修理自行车的报酬相当低，人类能够相当廉价地完成这一任务，让它不值得转为自动化。第二，自行车是一辆不规则、需要高精度操作的物体，它有一堆大大小小、弯弯曲曲、零零散散的部件。对机器人来说，修理自行车将是一项巨大的技术挑战，考验了它的物体操作能力。第三，做个自行车修理工，是件很讲究社交能力的事情。我有个好朋友经营一家自行车店，这是个闲逛的地方，人们来这儿寻找骑游路线，聊天讨论最新的零件，说笑话，喝咖啡，谈政治。我们想跟别的人做这些事，不想找机器人。


    ### 厨师


    牛津报告把“厨师”工作分为多个类别，包括大厨、主厨（自动化概率为 10%），快餐厨师（fast food cook，自动化概率为 81%），散点厨师（short
    order cook，自动化概率为 94%），餐馆厨师（自动化概率为 96%）。


    哪怕是在最好的餐厅，烹饪也都和重复有关系。大多数人不可能有机会每天都在米其林星级餐厅吃饭，但如果有人这么做过，一定会注意到菜单调整得很慢。大多数餐厅都有经常做的招牌菜，厨师的目标是尽可能迅速且廉价地为每一名顾客重现质量相同的菜肴。自动化是实现上述目标的理想选择。


    硅谷已经在这个领域实践创新了，机器人比萨饼就是一个例子。在加利福尼亚的门洛公园，Zume 公司使用机器人来预备完全可重复的比萨饼；做好的比萨饼装在一辆有 56
    口小烤箱的卡车里，逐一送到顾客家。这节省了大量时间：传统的比萨外卖公司先把比萨做好，再送货。而 Zume 公司用算法算好做比萨的时间，这样，等卡车来到你家门外，比萨正好新鲜出炉。于是，技术让你得到了质量更好、配送更快的比萨饼。还有许多类似的创新也正处于开发之中，如机器人寿司和机器人汉堡。


    我怀疑，牛津报告认为主厨和大厨的自动化概率仅为 10%，其他类型厨师的自动化概率却那么高，原因是设计新菜肴需要创造力。可就算从这个角度看，我们也已经发现了一些有趣的创新。IBM
    的“沃森”（没错，就是那个赢得了《危险边缘》游戏的沃森！）肩负起了学习烹饪书的任务，学习怎样将食材混合到一起，创造出新食谱。接着，大厨沃森创造性地发明了新菜肴，比如土耳其烤面包配茄子及帕玛森干酪，印度姜黄什锦饭，瑞士泰国芦笋乳蛋饼，等等。大厨沃森的烹饪书（包含了
    65 道原始食谱），在亚马逊上得了 4.4 颗星的评分。去看看吧！


    ### 司机


    牛津报告将“司机”拆分为出租车司机（自动化概率 89%）、重型卡车司机（自动化概率 79%）、轻型卡车司机（自动化概率 69%）、送货司机（自动化概率 69%）、公共汽车司机（自动化概率
    67%）和救护车司机（自动化概率 25%）。这些概率都很高，但我最吃惊的地方在于，有些概率竟然高得还不够。未来几十年，没有任何技术能比自动驾驶汽车更快地取代更多的就业岗位。这一观点得到了有力证据的支持。


    这种变化的主要驱动力之一是经济效益。谷歌和 Facebook 等技术公司获得成功，正因为它们可以毫不费力地扩张。那么，对 Uber 这样更像出租车公司而非技术公司的企业来说，情况又是怎样的呢？2016
    年 9 月，Uber 开始在匹兹堡街头试行自动驾驶出租车，答案变得清晰起来。有了自动驾驶汽车，公司的发展不再受到司机人数（没有太多人类司机愿意为了低工资工作）的限制。故此，地球上最新出现的工作岗位之一（Uber
    司机），说不定也正是最短命的岗位，这可真够讽刺的。


    还有其他许多从经济角度支持自动驾驶车辆的论点。大约 75%的货物运输成本都来自劳动力，而且，法律还限制了卡车司机的行车时间。在大多数国家，卡车司机每隔 12
    小时必须休息。相比之下，无人驾驶卡车可全天候行驶。结合这两点事实，我们可以用 1/4 的成本，将公路上运输的货物总量翻一倍。燃油效率也将进一步节省，自动驾驶卡车将行驶得更平稳，浪费的燃油较少。它们还能在其他方面节省燃油。卡车最省油的速度是每小时
    72 千米上下，所以，一旦我们减少了劳动力成本，自动驾驶卡车便可靠着开得更慢来节省更多的钱。


    用机器换下出租车和卡车司机，将成为未来 20 年里最明显的劳动力自动化事件之一。在我们的道路上，自动驾驶卡车和出租车将在我们的道路上变得司空见惯。驾驶这些车辆不需要大量的技能或训练，故此，怎样重新雇用这些被迫下岗的、技能相对较低的工人，就成了挑战。如果大多数出租车和卡车司机最终失业，社会将面临巨大的冲击。另一方面，如果经济发展情况足够好，能为这些工人找到新的岗位，我们的运气就太好了。


    我们不应该太过悲观。自动驾驶车辆能为我们所有人带来乐见其成的经济利益。从前太过偏远的城镇，会因为运输成本的降低而繁荣起来。尤其是在澳大利亚等此前因为偏远限制了经济发展的国家，商品将变得更便宜。我们道路的拥堵状况会得到极大缓解，而且变得更安全。


    有趣的是，埃隆·马斯克（Elon Musk），人工智能辩论中反调唱得最响亮的人之一，正在开发自动驾驶汽车。从眼下看来，人工智能带来的最大风险之一，恐怕就是它对劳动力的影响，尤其是跟驾驶相关的工作。我不知道埃隆是否尝出了这里头的讽刺味道。


    ### 电工


    牛津报告认为，电工工作遭到自动化的概率仅为 15%。我认为可能性还会更低。电工不是重复性工作，而且，尽管这一工作不怎么涉及社交及创造力，但工作环境的不可预测性，能稳稳地守护电工岗位。此外，电工要做的许多任务，对机器人（哪怕是极为昂贵的机器人）的操作技能都构成了极大的挑战。


    '
