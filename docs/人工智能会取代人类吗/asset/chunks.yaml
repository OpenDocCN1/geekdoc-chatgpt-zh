    Skype Translator 都使用深度学习。


    [\[45\]](#chapter001_0005_0001.xhtml#w45) 道格拉斯·莱纳特出生于 1950 年。他说过一句名言：“智能就是 1000
    万条规则。”真要有这么简单就好了！


    [\[46\]](#chapter001_0005_0001.xhtml#w46) CYC 项目一开始就打算对知识进行手工编码，这到底是不是个好主意，人们很难说得清。但就算我们能让计算机自己学习，在一套智能系统当中把所有的事实和规则单独列出，也是很有好处的。


    [\[47\]](#chapter001_0005_0001.xhtml#w47) 休伯特·德雷福斯出生于 1929 年。在麻省理工与马文·明斯基等同事共同执教期间，他接触到了人工智能。


