    # 定义 5.7 若 \\(A=(O_a, c_a, v_a)\\) 中，\\(O_a\\) 和 \\(v_a\\) 是某参数 \\(t\\) 的函数，称\
    \ A 为参变量事元，记作\n\n\\[A(t)=(O_a(t), c_a, v_a(t))\\]\n\n对多维事元，有\n\n\\[A(t)=(O_a(t),\
    \ C_a, V_a(t))\\]\n\n# 3) 关系元(relation-element)\n\n在大千世界中，任何物、事、人、信息、知识等与其他的物、事、人、信息、知识，都有千丝万缕的关系。由于这些关系之间又有互相作用、互相影响。因此，描述它们的物元、事元和关系元也与其他的物元、事元和关系元有各种各样的关系，这些关系的变化也会互相作用、互相影响。关系元是描述这类现象的形式化工具。\n\
    \n# 定义 5.8(关系元) 以关系词(relative)或关系符(简称关系名) \\(O_r, n\\) 个特征 \\(c_{r1}, c_{r2},\
    \ \\cdots, c_m\\) 和相应的量值 \\(v_{r1}, v_{r2}, \\cdots, v_m\\) 构成的 n 维阵列\n\n\\[\n\
    \\begin{bmatrix}\nO_r, & c_{r1}, & v_{r1} \\\\\n & c_{r2}, & v_{r2} \\\\\n & \\\
    vdots & \\vdots \\\\\n & c_m, & v_m\n\\end{bmatrix} = (O_r, C_r, V_r) \\stackrel{\\\
