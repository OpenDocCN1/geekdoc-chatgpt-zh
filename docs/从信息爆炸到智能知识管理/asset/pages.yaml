    \ ]\n```\n\n# 3. 智能知识的基元表达\n\n通过对多种方法的比较，我们发现用基元表达知识格式可以统一，内容上便于扩充，同时便于利用可拓变换技术实现后续的知识推理、审计及自动推送应用。因此，我们采用可拓学的基元理论，用物元、事元和关系元来表达智能"
