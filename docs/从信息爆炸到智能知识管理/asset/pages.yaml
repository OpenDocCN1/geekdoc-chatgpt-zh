  md: '类、判定树归纳分类、神经网络分类、邻域分类、遗传算法分类、基于粗糙集理论的分类、模糊集分类、MCLP 分类等。本节基于 MCLP 分类方法提出一种新的分类算法，以获取智能知识。


    # 4.3.1 MCLP 分类原理


    MCLP 分类方法已在数据挖掘中得到较为广泛地应用(Li et al,2006;Kou et al,2003;Shi,2001; Shi et al,1989)，以典型的信用卡客户数据为例，模型解释如下：


    对于一个信用卡持卡客户 \( i \), 可以用 \( r \) 个属性变量来刻画其行为, 这里不妨用 \( A_i = (A_{i1}, A_{i2},
    \cdots, A_{ir}) \) 表示该持卡用户, \( i=1, 2, \cdots, n \) 为持卡用户的个数即为样本的总个数, 建模目的是想得到关于
    \( r \) 个属性的系数 \( X = (x_1, x_2, \cdots, x_r)^T \) (或者称之为评分系数或者权重) 和边界 \( b \)
    来划分信用卡客户, 在这里有违约或破产倾向的客户记为 \( B \) (坏人), 信用良好的客户记为 \( G \) (好人), 则信用客户数据集可以通过如下模型进行划分：


    \( A_i X \leqslant b, \quad A_i \in B(\text{Bad}) \)

    \( A_i X \geqslant b, \quad A_i \in G(\text{Good}) \) (4.9)


    为了不失去一般性, 在下面的分析中, 假设正常分布下“坏人”集合 \( B \) 的评分在边界的左边, “好人”集合 \( G \) 的评分在边界的右边,
    用符号 (\(\star\)) 记作“好人”, 用 (\(\cdot\)) 记作“坏人”, 则 MCLP 模型的思想可以由图 4.4 表示如下。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_101_0.png)


    图 4.4 带有重叠部分的二分类问题示意图


    通过求目标函数的最优值, 让两条边界靠的最近, 理想状态下成为一个分类边界。有重叠部分的思想优点在于: 可以较容易地利用线性规划技术来解决分类问题, 而不利的地方在于必须在两个最优目标之间寻求一个妥协解。Shi
    等 (2005) 通过求解多目标线性规划的妥协解, 使错分距离最小化和对分距离最大化'
