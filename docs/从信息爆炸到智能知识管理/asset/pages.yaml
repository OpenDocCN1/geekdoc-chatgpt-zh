    需要注意的是，在进行可拓分类时，对于与分类任务不相关或冗余的属性没有必要进行分析和处理，应该把它们排除在分类任务之外。对于给定的类，如果一个属性的值可能用于区分该类与其他类，则该属性被认为是高度相关的。属性相关分析度量可以帮助识别不相关或弱相关属性，可以将它们排除在分类过程之外。在属性概化的基础上来进一步压缩训练集，因此，可以帮助提高分类的有效性和可伸缩性。


