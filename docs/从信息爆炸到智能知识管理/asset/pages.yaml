  md: '(Li et al, 2009b)对如何收集全面的情景信息提供了一种思路。


    # 5.4.3 基于基元的智能知识表达


    # 1. 基元理论


    大千世界由万物构成，物与物的互相作用就是事，物于物、物与事、事与事存在各种关系，物、事和关系千变万化，形成了五彩缤纷的天地人世。


    为了让计算机能描述世界的现象及其变化，必须研究简练、方便的形式化模型。为此，可拓学(蔡文, 1983)建立了可拓模型，它以基元为逻辑细胞，包括物元、事元和关系元。描述物的是物元，描述事的是事元，描述关系的是关系元。对于复杂的现象，可以用它们复合而成的复合元或基元的运算式来表示。下面利用可拓工程(杨春燕等,
    2007)的最新研究成果，对基元理论进行简要描述。


    +   1) 物元(matter-element)


    定义 5.1 以物 $O_m$ 为对象，$c_m$ 为特征，$O_m$ 关于 $c_m$ 的量值 $v_m$ 构成的有序三元组


    $$M=(O_m, c_m, v_m)$$


    作为描述物的基本元，称为一维物元，$O_m, c_m, v_m$ 三者称为物元 M 的三要素，其中 $c_m$ 和 $v_m$ 构成的二元组 $(c_m,
    v_m)$ 称为物 $O_m$ 的特征元。


    为方便起见，把物元的全体记为 $\mathcal{L}(M)$，物的全体记为 $\mathcal{L}(O_m)$，特征的全体记为 $\mathcal{L}(c_m)$。关于特征
    $c_m$ 的取值范围记为 $V(c_m)$，称为 $c_m$ 的量域。


    一物具有多个特征，与一维物元相仿，可以定义多维物元：


    定义 5.2 物 $O_m, n$ 个特征名 $c_{m1}, c_{m2}, \cdots, c_{mn}$ 及 $O_m$ 关于 $c_{mi} (i=1,
    2, \cdots, n)$ 对应的量值 $v_{mi} (i=1, 2, \cdots, n)$ 所构成的阵列


    ```

    M = \begin{bmatrix} O_m, & c_{m1}, & v \\ & c_{m2}, & v_{m2} \\ & \vdots & \vdots
    \\ & c_{mn}, & v_{mn} \end{bmatrix} = (O_m, C_m, V_m)

    ```


    称为 n 维物元，其中


    ```

    C_m = \begin{bmatrix} c_{m1} \\ c_{m2} \\ \vdots \\ c_{mn} \end{bmatrix}, V_m
    = \begin{bmatrix} v_{m1} \\ v_{m2} \\ \vdots \\ v_{mn} \end{bmatrix}

    ```


    例如


    ```

    M_1 = \begin{bmatrix} \text{人 A,} & \text{体温,} & 39^\circ\text{C} \\ & \text{血压,}
    & 70 \sim 100 \end{bmatrix}

    ```'
