- pgno: 103
  md: '# 4.3.2 可拓分类的概念


    可拓分类提出的目标是从可拓集合的基本思想、工具和方法出发，从可拓变换角度研究一种新的分类方法，实现基于特定变换条件下的动态分类，为预防客户流失（Nie et
    al, 2006）提供理论和措施上的指导。


    基于可拓集合、关联函数和距以及可拓变换理论，我们提出了针对 MCLP 方法的可拓分类的概念。


    定义 1 可拓分类是基于特定变换对事物物性质相互转化的影响下，对事物所处的稳定域、可拓域进行的动态划分。


    可拓分类的研究对象除了事物所属的类别之外，还包括事物的稳定域、可拓域、拓界以及特定变换对分类的影响度。可拓分类和其他分类方法的显著区别是可拓分类强调分类的可转化性和分类的实用性。


    可拓域的概念揭示了在一定的变换下，元素“是”与“非”的分类是可变的。例如，在产品质量检验中，合格品与不合格品是对立的两个集合，然而在实际问题中，不合格的产品经过一定的加工处理却可以变为合格品。我们把元素属于正负域的可变性称为分类的可转化性。显然，可拓分类的可转化性与变换方法的选择有关，变换方法不同，所产生的可拓域也不同，从而导致不同的分类。基于上述考虑，可拓分类的主要研究内容包括：


    +   （1）在传统分类的基础上，针对特定变换方法划分可拓域；（2）定量描述特定变换下属性分类转化的难易程度；（3）评价不同变换方法的效率、实用性。


    # 4.3.3 可拓分类的实现框架


    +   （1）通过 MCLP 分类算法，经训练集、测试集综合打分得出分类的模型，该模型是各属性对评分值影响大小的权重值。（2）通过数据挖掘得到事物类别转化的相关主要属性的量变和质变区间。（3）识别具有可操作性的属性，设计可拓变换方案。（4）针对选定的可拓变换划分可拓域、稳定域和拓界。（5）利用关联函数计算可拓域内各元素类别转化的难易程度。（6）评价可拓变换和可拓分类方案的效率和实用性。（7）在执行选定的可拓变换方案一定时间后，重新利用
    MCLP 方法修正分类模型。


    其实现的框架图如图 4.6 所示。'
  merge: -1
