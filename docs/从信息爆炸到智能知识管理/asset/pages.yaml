    从数据挖掘的角度,可进行有效挖掘的数据 \( R_2 \) 是由和挖掘目标关联的完整的、一致的、正确的数据的集合。数据清洗的一个重要任务,就是通过清洗脏数据,使数据质量达到可有效挖掘的要求。设某企业进行数据挖掘项目,论域
    \( U=\{某企业用于数据挖掘的数据的集合\}\),数据集质量的评价特征 \( c_{o1} = \)数据完整性, \( c_{o2} = \)数据一致性,
