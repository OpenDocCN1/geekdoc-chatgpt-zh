    图 3.6 信息—知识—智能:智能系统的理论框架(钟义信,2001)


    要实现 IKM 的应用目标，还需要有一定的支撑条件以及有相应的方法实现知识与智能特性的结合，而智能知识管理的方法是建立在有关技术支持基础之上的。为此建立了包括应用层、方法层、技术层和支持条件层的
