  md: '(4) 基于数据理解建立数据仓库。根据所有文档提供的波阻抗和岩性特征，构建了石油勘探数据仓库的框架，包括垂直测井数据（数据值、数据类型、数据特征）。针对数据挖掘过程，可以产生立体空间数据库。


    以上是智能知识的初步应用，下一步的工作是在智能知识管理系统平台开发完成后，对知识的智能化进行全面的测试和应用。


    # 7.4 本章小结


    本章对直接挖掘获取的智能知识进行了实践应用流程的分析设计，介绍了应用背景和详细的应用过程，以该过程为基础可以使智能知识的应用逐步流程化、标准化，加快实施的效率。最后分析了应用效果，提出了改进建议。本章的案例仅仅是智能知识初步应用的三个例子，智能知识管理平台的设计已经得到企业用户的认可，下一步的研究重点将利用
    Agent 技术、本体技术等，对智能知识管理系统进行系统的设计、开发，扩大试用的范围。'
