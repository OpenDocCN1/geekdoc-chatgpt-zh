    # 1. 决策树分类规则分析


    决策树(decision tree)是一个类似于流程图的树结构，其中每个内部节点表示在一个属性上的测试，每个分枝代表一个测试的输出，而每个树叶节点代表一个类别。决策树主要是基于数据的属性值进行归纳分类，从树的最顶层节点（根节点）到存放该样本预测的叶节点遍历，就可以将判定树转换成“if-then”形式的分类规则。以
