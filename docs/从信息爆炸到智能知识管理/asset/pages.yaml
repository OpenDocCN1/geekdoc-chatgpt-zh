  md: '的知识创造、储存和检索、转移、应用的过程，组织及其成员会融入多重知识管理过程链中。知识管理过程的复杂度、资源需求和潜在工具和方法会因知识管理过程的类型、范围和特征的不同而不同。Feigenbaum(1977)于
    1977 年提出知识工程的概念，王众托院士(2004)建议开创知识系统工程学科，应用系统工程的原理与方法研究知识系统，对知识系统的各种体系结构与运行过程进行分析研究。


    近年来国内很多公司也逐步在企业内部建立知识管理系统，结合信息技术研发知识管理工具，围绕企业相关业务设计知识蓝图，建立企业业务的知识体系及知识流等(吴庆海等，2005；AMT，2003)。到目前为止，知识管理学者大都认为，最难的是对人的隐性知识的管理，知识管理的一个重要目的是让每个人的智慧在组织中充分发挥出来。个人是知识的主体、知识创造的根源，组织是知识成为生产力的放大器。个人的隐性知识转化为组织中的显性知识是知识创造的开始，将成为个人或组织成功的关键。与此相反，组织中的显性知识必须很快再转化为个人的隐性知识，只有组织中的显性知识转化为企业员工的隐性知识，才是知识应用的过程，或知识成为生产力的过程，知识运用于具体的环境中，才产生价值。


    在综合研究上述文献的基础上，本书对中国期刊网(CNNI)自 1999 年到 2008 年 11 月的文献进行了进一步的分析，将全部文章的标题、关键词和摘要另存为文本书件，通过语料库软件分析确定关键词，并按词频予以排序。按关键词统计的文章篇数如表
    2.1 所示。


    表 2.1 中国期刊网(CNNI)自 1999 年到 2008 年 11 月知识管理研究统计


    | 关键词 | 篇数 | 百分比/% |

    | :--- | :--- | :--- |

    | 知识管理 | 15768 | 100 |

    | 隐性知识或知识共享 | 10038 | 63.7 |

    | 隐性知识 | 4522 | 28.7 |

    | 知识管理+隐性知识 | 3281 | 20.8 |

    | 知识管理+知识共享 | 3343 | 21.2 |

    | 知识管理+知识管理系统 | 8808 | 55.9 |

    | 隐性知识+知识共享 | 1281 | 8.1 |


    其中以“隐性知识”或“知识共享”作为关键词的文章占 63.7%。知识管理系统的研究也占了 55.9%的比重，但知识管理工具的研究主要局限在组织现有知识的存储和利用上，现有知识管理工具存在功能不完整、集成性不高、协同性不够以及可重构性差等不足(潘旭伟，2005)。


    # 4. 知识管理研究重心的迁移


    基于对目前知识管理研究现状的分析，结合经济全球化和信息全球化带来的'
