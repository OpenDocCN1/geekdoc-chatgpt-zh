- pgno: 74
  md: '面内容。


    # 1. 可拓集合


    集合是描述人脑思维对客观事物的识别与分类的数学方法。经典集合、模糊集合和粗糙集合都分别提出了各自的分类识别的方法和准则，它们成为各自形成的分支的理论基础。这三类集合方法都把事物具有某种性质的程度看成不变的，可以说，是从“静态”的角度考察事物。但客观世界是复杂的，人的认识和事物具有某种性质的程度都处于不断运动和变化之中，因此，人脑思维对客观事物的识别和分类并不只有一个模式，而是多种形式的，从而描述这种识别和分类的集合也不应是唯一的，而应是多样的。为了从本质上考察动态的事物和变化的过程，可拓学建立了可拓集合(Cai,1990)。


    可拓集合把分类与变换(包括时间、空间的变换)联系起来。根据这种分类思想，元素的分类是可以改变的，它具有某种性质的程度(关联度)也是可变的(杨春燕等,2007)。元素的变换(包括事元和物元的变换)、关联函数的变换和论域的变换，统称为可拓变换。在一定的变换下，负域的元素可转变为正域的元素，这就把分类和变换联系起来，为分类的转化提供了依据，使动态分类具有了合理的集合基础。本节更详细的内容请参阅文献(杨春燕等,2007)。


    # 2. 关联函数


    关联函数是描述可拓转化程度的定量化计算工具。通过关联函数值，可以定量地描述 U 中任一元素 u 属于正域、负域或零界三个域中的哪一个，即使同属于一个域中的元素，也可以由关联函数值的大小区分出不同的层次。当点在区间内时，经典数学中认为点与区间的距离都为
    0，而在可拓集合中，利用距的概念，就可以根据距的值的不同描述出点在区间内的位置的不同。距的概念对点与区间的位置关系的描述，使人们从“类内即为同”发展到类内也有程度区别的定量描述(杨春燕等,2007)。根据情况，关联函数的计算分为：①最优点在区间中点的初等关联函数；②侧距及相应的初等关联函数；③最优点在
    x0 处达到时的初等关联函数。应用时要根据量值的最优值 x0 是在区间 X0 的中点还是在中点的左侧或右侧，选择相应的公式。


    # 3. 可拓变换


    可拓变换方法是获得智能知识的一种途径。基元的可拓性指出了解决问题的可能途径。以物元为例，物元 R0=(N0,c0,v0) 改变为物元 R=(N,c,v) 或若干物元
    R1=(N1,c1,v1),R2=(N2,c2,v2),...,Rn=(Nn,cn,vn)，称为物元 R0 的变换。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '基元具有置换、增删、扩缩、组分、复制五种基本变换：


    (1) 置换变换，考虑是否可以用另一事物代替当前条件或目标中的事物、用某特征代替另一特征、用某量值代替另一量值。一般从以下方面辅助思考。


    +   一物多征：一个事物可以具有很多特征。可以从事物的不同特征出发考虑问题。

    +   一征多物：一个特征可以为多个事物所具有。

    +   一征多值：一个特征可以具有很多个量值。

    +   一值多物：一个量值可以为多个事物所拥有，可以是同征同值，也可以是异征同值。

    +   一值多征：一个量值可以对应不同的特征。


    另外还可以考虑事物的共轭性：实部—虚部、硬部—软部、潜部—显部、正部—负部等，详细说明可参考文献(杨春燕等, 2007)。


    (2) 增加删除变换：考虑可否在条件(或目标)中增加或删除一些特征，或者增加或删除新的事物。


    (3) 扩缩变换：考虑可否在条件、目标中把一些特征、量值，或者事物进行扩大或缩小。


    (4) 组合分解变换：考虑可否在条件、目标或实现目标的过程中把一些特征、量值，或者事物组合在一起或者分解开处理。


    (5) 复制变换：考虑把事物、特征由一份复制成多份。


    对于一个基元的变换，会导致相关基元的变换，称后者为前者的传导变换，传导变换产生的传导效应是进行决策时必须考虑的问题，传导变换可以从以下六种形式考虑(何斌,
    2005)：


    +   (1) 一事物的置换引起相应属性值的带动变换。

    +   (2) 一事物中某要素的变换引起该事物关于某些相关特征的量值变化。

    +   (3) 一事物中某要素的变换使该事物变为他事物。

    +   (4) 一事物的变换引起相关事物关于某些相关特征的量值变化。

    +   (5) 一事物的变换引起相关事物向他事物变化。

    +   (6) 共轭对中一方的变化引起另一方的变化。


    同时，变换具有积、逆、或、与四种基本运算，三种基本类型：可拓元的变换、关联准则的变换和论域的变换，由此组成的变换体系概括了人们解决矛盾问题的多种方式(杨春燕等,
    2007)。


    # 3.3 数据挖掘与智能知识管理的关系


    通常意义下的数据挖掘在智能知识管理中被看做是由数据或信息到粗糙知'
