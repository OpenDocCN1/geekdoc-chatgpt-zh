- pgno: 109
  md: '# # 第 5 章 智能知识管理的间接实现模式


    本章论述在传统数据挖掘方法下获取的原始知识如何逐步孵化成智能知识，并给出智能知识表达、存储和审计的方法，初步研究智能知识的推理机制。


    # ## 5.1 原始知识的获取方法及表现形式


    数据挖掘的目的是发现知识，并通过一定的模式表达。可用于数据挖掘的知识表示模式主要有以下几种：概要描述、关联规则、分类规则(包括决策树、网络权值、判别方程、概率图等)、聚类、公式和案例、异常点等。常用方法的介绍如下：


    (1) 概要描述(concept description)是对数据所蕴涵的概念特征信息、汇总信息和比较信息等的概括、精炼和抽象的过程。被挖掘出来的概要知识可以结合可视化技术以直观的图表（如柱状图、曲线图、饼图等）和各种报表甚至立方体(Gray
    et al, 1997)等形式展示给用户，其代表性方法是多维数据分析技术(Chaudhuri et al, 1997)和面向属性的概念归约方法(Cai et
    al, 1991)等。


    (2) 关联规则(association rules)挖掘是从大量数据中发现项集之间有趣的关联和相关联系，并将这些联系表示为规则形式(Mannila et
    al, 1994; Agrawal et al, 1993)。对关联挖掘所得到规则进行有用性度量的指标主要有置信度和可信度等。关联规则的表示形式是：X =>
    Y，解释为“满足 X 中条件的数据库元组多半也满足 Y 中条件”。例如，购买计算机也趋向于同时购买财务管理软件可以用以下关联规则表示：


    ```

    buy computer => financial management sofafeare(support = 2%, confidence = 60%)

    ```


    规则的支持度和置信度是两个规则兴趣度度量。它们分别反映发现规则的有用性和确定性。上面这条关联规则的支持度 2%意味着分析中的全部事务的 2%同时购买计算机和财务管理软件。置信度
    60%意味着购买计算机的顾客 60%也购买财务事务管理软件。


    (3) 分类(classification)的目的是通过训练集学会一个分类模型，该分类模型可以把数据库中的数据项映射到给定的类别中。当分类的准确度满足要求时，就可以用该分类器预测未来数据的归类。分类的技术很多，包括决策树(Quinlan,
    1993, 1986)、贝叶斯分类(Domingos et al, 1996)、神经网络(Hertz, et al, 1991；'
