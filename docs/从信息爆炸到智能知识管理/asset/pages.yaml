  md: '上述介绍的七种主要知识管理模式虽然存在部分内容交叉的现象，但为我们理解现有的模式并参照这些模式进行深入研究打下了基础。另外，还存在一些其他的模式，如基于分布式计算理念的知识管理模式(Li
    et al, 2006)等。


    # 2.1.4 知识管理技术和工具


    本节集成专家学者的研究成果(Liao, 2003;潘旭伟, 2003a;Brent, 2001)，综合潘旭伟(2005)，Tyndale(2002)和 Dieng(1999)对各种知识管理技术和工具的分类方案，以知识的获取开发、组织存储、传播共享、检索应用以及知识评价等五个过程为基础对知识管理各种技术和工具进行回顾。


    +   1. 知识的获取技术和工具


    传统隐性知识的获取主要靠管理制度、企业文化和场等进行分享，缺乏有效的技术手段和工具。随着信息技术的发展，公司积累的大量数据成为重要的资源。数据挖掘就是从大量数据中提取出可信、新颖、有用并能被人理解的知识的处理过程，它的目标是利用从数据库中发现的隐含的、有意义的知识(Olson
    et al, 2007；Han, 2006；陈文伟等，2004；Chen et al, 1996)，做出具有前瞻性的、基于隐含规律的科学的决策。


    互联网的发展使得网络上的知识资源异常丰富，Internet 搜索引擎的出现使得人们能十分方便地获取各种网络资源。国内目前使用最多的搜索引擎 Google 和百度，除对一般网页进行搜索之外，还能实现图片、音乐、视频等搜索。目前，针对网络知识资源，提供语义检索功能的系统已经出现。如
    OntoBroker (Decker, 2002)是一个面向 Web 信息资源，能通过推理进行精确查询问题的工具环境，在此基础上，进一步实现了基于语义信息检索的门户站点
    SEAL(Maedche, 2001)。随着互联网的发展，Web 挖掘(Srivastava et al, 2003；Tan et al, 2003；Kosala
    et al, 2000)及其综合集成方法(Li et al, 2007a)成为知识的主要来源之一。


    +   2. 知识的存储技术和工具


    知识的存储是把获取的知识转化为结构化和系统化的形式，将知识进行有效存储并以简明的方式呈现给使用者，促进这些知识在组织内的交流和共享。


    Kingston 等提出的多视图模型将知识分为 who, what, how, when, where 和 why 等视图(Kingston, 2000)。诸葛海提出了面向全球知识资源共享和管理的知识网格模型(Zhuge,
    2002)，将知识组织在类别、位置和层次构成的三维知识空间中。知识仓库是知识存储类技术和工具的代表。知识仓库收集了各种经验、备选的技术方案以及各种用于支持决策的信息和知识，以一定原则对这些信息和知识进行分类保存，并提供相应的检索手段。Nemati
    等提出了基于数据仓库模型扩展'
  merge: -1
  img_proc: true
- pgno: 38
  md: '的知识仓库体系结构(Nemati, 2002)。


    为了避免专家知识流失，构建基于知识的系统（knowledge-based system, KBS)是有必要的。KBS 建立在人工智能基础上，其目的是让计算机理解并存储人们的知识（Wiig,
    1994）。KBS 经过一二十年的发展，取得了巨大成绩，如提出了构建 KBS 的系统化方法：CommonKADS 方法（Schreiber, 2003），建立了大量的
    KBS(McMeekin, 2002; Tian, 2002)。KBS 是知识工程过程的成果，应当被用于更大视野的知识管理(Schreiber, 2003)。近年来，一些学者（李兴森等,
    2007d; 陈文伟等, 2006）提出用可拓学（蔡文, 1994）的基元（蔡文等, 2004）存储知识，使知识的表达内容更加丰富，详细内容见第 4 章。


    # 3. 知识的传播共享技术和工具


    知识管理的一个关键是知识的传播和共享：在员工之间、员工和管理者之间、各部门之间的知识传播共享等，让正确的知识在正确的时刻到达正确的人。知识的传播共享技术和工具主要实现隐性知识之间、显性知识之间以及将隐性知识转化为显性知识进行传播共享。


    为实现隐性知识之间的传播共享，知识黄页（赵曙明，2000）以一种类似于传统电话号码黄页的工具，根据知识门类，将那些拥有知识的人的地址和电话号码标在知识黄页上，帮助企业了解组织内部知识分布的大致情况，以及帮助公司员工通过黄页，了解谁拥有自己所需的知识、经验和诀窍等。Desouza
    等认为信息技术对隐性知识交流共享的主要作用是通过工具（如电子邮件、知识黄页）与目标人物建立联系（Desouza, 2003）。动态知识地图（dynamic
    knowledge map）（Woo, 2004）软件是一个基于 Web 的知识导航器，帮助人们重用专家的隐性知识，它能搜索专家并通过使用 Internet
    技术方便地与这些专家进行交流。


    实现知识传播共享的另一类重要技术和工具是基于互联网的论坛、新闻组以及称为群件的软件包。这类技术和工具的特点在于它能够提供虚拟的工作平台，在这个平台上，人们可以交流看法、协同工作。在人们交流的过程中，这类系统不仅保存交流形成的文档，还能捕捉交流和互动的线索，保留知识的情境。著名的群件工具有
    IBM 的 Lotus Notes 和微软的 Exchange Server 等。Buckman 公司采用了一个称为 K’Netix 的在线论坛的知识共享知识管理系统（Stepanek,
    2001），集中用于讨论造纸、水处理和皮革退色等过程中的化学问题。Koh 等开发了一个虚拟社区活动框架，在这个框架中，以一个电子商务模型把知识共享活动集成到商业活动中(Koh,
    2004)。


    博客技术使组织员工知识分享、流程知识、客户资料都处于动态的更新中，真正实现了扁平化的学习型组织。博客形式使所有人的工作痕迹留了下来，组织基'
  merge: -1
