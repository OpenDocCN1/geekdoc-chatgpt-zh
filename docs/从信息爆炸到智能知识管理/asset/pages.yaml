    # 2.2.5 数据挖掘在应用中面临的问题


    尽管数据挖掘技术已经得到普遍的认可和较为广泛的实施，但由于挖掘结果知识的特点，在实际应用中仍存在如下问题：


    +   (1) 在数据挖掘结果的评价上，大部分学者将注意力集中在如何获取准确的模型上，而很少对挖掘出的结果进行分类、评价或形式化，进而支持企业决策(Mcgarry,
    2005)。数量繁多、质量粗糙导致其结果离实际的商业应用还有较大的距离。例如，某数据挖掘项目通过运用决策树分类算法，对用户分为“现用用户、冻结用户和流失用户”，并预测用户类型，得到了
    245 条规则。但业务人员难以从这些规则中获取促使用户转化的知识。上述问题涉及数据挖掘中规则结果的评价问题，对于数据挖掘研究应用是很重要的，但目前对于这个问题的标准的、系统的研究离应用需求还相去甚远。


    +   (2) 数据挖掘获取的知识的表达和解释上，数据挖掘所获得的知识要以不同的形式来表示，并以容易理解的形式展现给用户，重要的是提供给用户能够理解的知识。这就要求知识的表达不仅限于数字或符号，而且要以更容易理解的方式，如图形、自然语言和可视化技术等以利于使用者理解使用，而目前数据挖掘在这方面的研究还不够深入。


    +   (3) 数据挖掘过程中的人机交互方面，由于知识结构的复杂性和认知过程的渐进性，要求知识发现技术在不同的抽象层次上要进行交互发掘。有效的决策过程往往需要经过多次人机交互和反复。在数据挖掘过程中保留必要的中间结果，通过人机交互、动态调整挖掘目标、用户的背景知识和指导作用可以加快挖掘的过程，并且保证了所获得知识的有效性。而目前的系统或工具则很少能真正让用户参与到挖掘过程尤其是对挖掘的结果的再处理之中。


    +   (4) 与知识应用情境的结合方面，数据挖掘产生的模式或规则要在实践中使用必须结合具体的情境，这里的情境既包括相关的物理、业务等外部环境因素、背景因素，又包括主体的认知、经验、心理等内部因素。它是完整理解知识的关键要素，影响人们对知识的评价。某一条规则在一种情境、某个决策者、时间点可能是有用的，但是换个情境可能就没有价值。知识是在各种不同的情境下产生创造的，没有合适的情境信息，知识将与其他相关知识相互隔离，不能完整地理解知识的含义或错误地理解知识含义。因此情境对于数据挖掘及数据挖掘结果的处理非常关键(潘旭伟,
    2005; Goldkuhl, 2001)。


    以上欠缺导致这一交叉学科的发展落后于其商业应用的现实需求。利用数据挖掘等工具，产生大量的模式和规则，一般只是初步的粗糙的知识，用户不能很'
