- pgno: 66
  md: '挖掘技术获取的原始知识（粗糙知识）与主体知识（规范知识、经验、领导意图、企业情境等因素）相结合，并对其进行过滤、筛选、提取、存储、转化和利用，以智能地支持企业有效管理决策的管理过程。


    它是在有用知识的基础上进行智能化处理，孵化出自身具有智能特点的知识并实现自我更新和智能应用等过程的管理，使知识能在需要的时间将需要的知识传送给需要的人，从而促进数据挖掘获取知识的实用性，减少知识过载，提高知识管理水平。智能知识管理具有如下特征：


    +   (1) 智能知识管理的对象是通过数据挖掘获取的有用知识。


    +   (2) 实现知识管理智能化的途径是首先实现知识个体的智能化，而不是让智能的管理平台系统去管理没有智能的知识。


    +   (3) 智能知识管理是一个系统工程，涉及数据集的处理、数据挖掘算法、对知识的审计、孵化、组织存储和智能应用、淘汰等全过程，涉及主体、对象、平台之间的相互作用等。


    +   (4) 智能知识管理需要组织在战略、组织结构、文化、业务过程、人员、技术等多方面的协同支持。


    智能知识管理的研究框架如图 3.3 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_66_0.png)


    图 3.3 智能知识管理研究框架


    研究框架思路是：


    +   (1) 将数据挖掘产生的结果作为一类特殊的知识，探讨其与传统知识结构之间的逻辑关系，建立数据技术与该类知识内在联系的数学模式，并用此模式解释由数量分析结果产生的智能知识特征，并进一步研究其保存、转化和应用的数学和管理上的含义与结构。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '(2) 采用人-机结合以人为主、综合集成以及知识管理的过程学派理论，以通过数据挖掘支持企业决策为目的，建立一个数据挖掘与智能知识管理的系统框架。


    (3) 研究智能知识在特定应用环境下保存、转化、应用、共享、创新的过程管理理论。其中不仅涉及数据挖掘知识本身，而且要考虑决策者和使用者的隐性知识及其他显性知识的使用。其中将用到心理学、复杂系统、综合集成等理论知识以及一些实证研究方法。


    (4) 基于数据技术与智能知识的理论框架，寻找运用一类适当的“关系测度”去衡量数据、信息和智能知识之间的相互依存性，研究合适的智能知识分类表达方式。其中，智能知识分类、评价与测度主要包括下列研究内容。


    智能知识的分类与评价：分析由数据挖掘产生的智能知识的特性，对智能知识进行分类，对不同类型的智能知识选取合适的指标进行有效性评估，构建智能知识分类和评价体系。


    智能知识的测度：研究智能知识的主、客观测度理论与方法，从数据挖掘模型的区分能力、所能提供的信息量等多个角度研究智能知识价值测度的数学模型方法。


    智能知识结构有效性评估：给定应用目标和信息源，数据挖掘系统必须要做的是评估智能知识结构的有效性，这一领域的探索需要在以下三方面进行深入的研究：


    +   (1) 智能知识复杂性分析；

    +   (2) 智能知识复杂性和模型有效性关联分析；

    +   (3) 跨异构模型的智能知识有效性分析。


    总之，如何鉴别数据挖掘的结果，如何准确衡量有价值智能知识以及评价智能知识质量是智能知识管理应用的关键问题之一。


    本书拟研究智能知识与智能行为、智能决策之间的关联，以及智能知识的应用如何提高决策智能及决策行为的效率。从数据—信息—知识这一知识管理的基本内涵入手，提出一套基于数据挖掘技术的智能知识管理的基本概念、原理和方法。


    # 3.1.5 智能知识管理系统


    Gallupe(2001)认为：“知识管理系统是支持各种组织知识管理实践的工具与技术”；Meso 等(2000)引用 Takinn Quinn 的研究，认为知识管理系统是一种把企业的事实知识(know-what)、技能知识(know-how)、原理知识(know-why)与存在于公司数据库和操作技术中的显性知识组织起来的技术。Davenport
    等(1998)认为知识管理系统是经设计和开发的为组织的决策者/用户提供决策和完成各种任务所需知识的一种系统。Alavi 等(2001)综合学者研究的观点指出，知识管理系统是一种集中于创造、聚集、组织和传播一个组织知识的信息系统。知识库和知识地图是知识管理系统的两种常见类型。张新武等(2002)认为，企业知识管理系'
