    patterns）和时间序列（similar time sequences）等手段从大量的、不完全的、有噪声的、模糊的、随机的数据中，提取隐含在其中的、人们事先不知道的、但又是潜在有用的信息和知识，这些新的知识可以用来制定有效的商业战略去吸引新的顾客和维持已有的顾客、开发适销的产品等。近年来，数据挖掘在生物、金融、保险、零售等行业已得到较为广泛的应用，成为信息时代决策支持的关键技术之一，它会聚了数据库、人工智能、统计学、可视化、并行计算等不同学科和领域，近年来受到各界的广泛关注。


    据 Gartner 公司的统计及预测，2009 年，由于缺乏有效的信息处理过程与工具，全球化的 5000 家企业中的 35％以上的企业无力面临商业与市场剧烈变化中做出有效的决策。至
