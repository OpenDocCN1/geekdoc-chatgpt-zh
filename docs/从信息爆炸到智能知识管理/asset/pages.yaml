- pgno: 41
  md: '# 2.2 数据挖掘的研究综述——数据挖掘及其对知识管理的影响


    数据挖掘是从大量的、不完全的、有噪声的、模糊的和随机的数据中，提取隐含在其中的、人们事先不知道的、但又是潜在有用的信息和知识的过程。目前，数据挖掘方面的研究主要集中在挖掘算法、挖掘过程等方面。


    # 2.2.1 数据挖掘过程


    知识发现(knowledge discovery in database,KDD)被认为是从数据中发现有用知识的整个过程。数据挖掘被认为是 KDD 过程中的一个特定步骤，它用专门算法从数据中抽取模式(pattern)。KDD
    过程定义为(Fayyad et al, 1996)：KDD 是从数据集中识别出有效的、新颖的、潜在有用的，以及最终可理解的模式的高级处理过程。


    其中，数据集：事实 F(数据库元组)的集合；模式：用语言 L 表示的表达式 E，它所描述的数据是集合 F 的一个子集 FE，它比枚举所有 FE 中元素更简单，我们称
    E 为模式；有效、新颖、潜在有用、可被人理解：表示发现的模式有一定的可信度，应该是新的，将来有实用价值，能被用户所理解。


    KDD 过程图如图 2.3 所示(陈文伟等,2004)。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_41_0.png)


    图 2.3 KDD 过程图


    KDD 过程可以概括为三部分:数据准备、数据挖掘及结果的解释和评估。为了促进数据挖掘的规范实施，促进数据挖掘模型的标准化，已经有一些厂商和组织(如 IBM、KXEN、Microsoft、National
    Center for Data Mining 等)提出了相关的标准(Clifton, 2001)。现在比较有影响力的数据挖掘模型是由数据挖掘组(Data Mining
    Group)提出的预测模型标记语言 PMML(predictive model markup language)描述，是一种基于 XML 的预测模型设计语言。一个
    PMML 所定义的模型有如下的组成部分：


    +   (1) 数据字典:定义模型输入和输出所包含的属性名称和类型。


    +   (2) 输入、输出数据定义:定义一个具体的数据挖掘模型的输入和输出应包'
  merge: -1
  img_proc: true
- pgno: 42
  md: '括数据字典中的哪些项。


    +   (3) 统计信息：定义对于一个或一些属性应计算的统计值，如最小值、最大值、平均值、标准偏差和中位数。该步骤是可选项。


    +   (4) 标准化：定义如何对第(2)步中所确定的输入数据做相应的标准化处理，使之可以被顺利地处理。


    +   (5) 挖掘模型：可在一个包含了很多个模型的模型库中进行选择，该模型库包含了分类树、多元线性回归、偏最小二乘模型、关联规则、神经元网络和聚类等多个模型。


    一个标准化的数据挖掘过程有助于形成一个可以有效记录工作经验的统一体系(有利于重现已完成的项目)，也有助于进行项目计划和项目管理，还有助于使新手顺利地完成数据挖掘的整个工作流程。因此一些学者和组织已经致力于数据挖掘的标准过程的研究(Dorian,
    2003)。


    目前，最有影响的数据挖掘标准过程模型就是数据挖掘的工业标准过程(Cross Industry Standard Process for Data Mining，CRISP-DM)，已有超过
    200 家公司和组织认同其标准地位，其中包括 IBM、SPSS、SGI、NCR 等知名公司。CRISP-DM 主要倡导的理念是：提倡标准过程行业内共享；建立与应用背景无关的标准过程；建立与所用数据挖掘工具无关的标准过程；建立具有普遍指导意义的标准过程(Shearer,
    2000; http://www.crisp-dm.org/)。


    CRISP-DM 是一个分级的过程模型，它将整个数据挖掘工作分解成六个阶段，如图 2.4 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_42_0.png)


    图 2.4 CRISP-DM 过程模型


    每个阶段及其包含的任务为：'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   (1) 业务理解，即理解数据挖掘商业背景，确定商业目标，评估目前的情势，明确数据挖掘目标和建立项目计划。

    +   (2) 数据理解，即理解原始数据，收集原始数据，描述所收集的数据，检查数据和确认数据的质量。

    +   (3) 数据准备，即选择数据、清理数据、综合数据和标准化数据。

    +   (4) 建立模型，即选择数据挖掘建模算法，产生测试模型，建立模型和评估模型。

    +   (5) 模式评估，即评估数据挖掘的结果，检视数据挖掘过程和决定下一步要做的工作。

    +   (6) 决策实施，即将数据挖掘结果付诸实际决策，完成最终报告，为下一轮数据挖掘做准备。


    Fayyad 等(1996)总结的偏重技术的数据挖掘过程模型主要包含以下步骤：


    +   (1) 数据清洗：消除噪声或不一致的数据，解决数据的错误、丢失问题。

    +   (2) 数据集成：把多样的和不同种类的数据源集成为一个单一的数据源。

    +   (3) 数据选择：从数据库中检索出与分析任务相关的数据。

    +   (4) 数据变换：通过概括和聚集等操作把数据转化成适合挖掘的形式。

    +   (5) 数据挖掘：应用智能化方法从数据中提取出数据中隐藏的知识。

    +   (6) 模式评价：根据某种兴趣度度量，识别出真正用户感兴趣的模式所表达的知识。

    +   (7) 知识表示：用可视化或其他知识表示技术，把挖掘出的知识展示给用户。


    该模型从数据入手，到知识表示后结束。但是在实际应用中，挖掘到的知识如何使用，模型中没有反映，而这恰恰是整个数据挖掘过程最重要的、也是最终的目标。


    目前还有一个较有影响的数据挖掘标准过程模型：SEMMA（是五个步骤：Sample, Explore, Modify, Model, Assess 的头字母缩写）。SAS
    公司出品的 Enterprise Miner 等数据挖掘系统对这种标准过程模型进行支持。SEMMA 由五个步骤组成，SEMMA 这五个步骤各自又包含了很多小的任务：


    +   (1) 数据采样，即从海量的数据中选择出典型性的数据子集，同时要求该数据子集包含足够多的数据信息。

    +   (2) 数据检验，即从所得到的数据子集中发现异常趋势和数据点，从而对数据子集有一个全面的了解。

    +   (3) 数据变换，即将数据子集内各数据点的属性域进行标准化或做其他的变换，使之易于进行后继工作。

    +   (4) 数据建模，这是一个核心步骤，从上几步的结果数据集中，自动发现隐含的知识和规律。'
