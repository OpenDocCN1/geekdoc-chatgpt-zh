  md: '\( M_2 = \begin{bmatrix} \text{药物 A,} & \text{功能} & \text{治感冒} \\ & \text{颜色,}
    & \text{白色} \\ & \text{批号,} & x \end{bmatrix} \)


    物是随时间 \( t \) 变化的，可用物元


    \( M(t)=(O_{\text{m}}(t),c_{\text{m}},v_{\text{m}}(t)) \)


    来描述。类似地，物也随空间位置和其他条件的改变而改变。为此，规定了参变量物元。


    定义 5.3 在物元 \( M=(O_{\text{m}},c_{\text{m}},v_{\text{m}})\) 中，若 \( O_{\text{m}}\)
    和 \( v_{\text{m}}\) 是参数 \( t \) 的函数，称 \( M \) 为参变量物元，记作


    \( M(t)=(O_{\text{m}}(t),c_{\text{m}},v_{\text{m}}(t)) \)


    这时，\( v_{\text{m}}(t)=c_{\text{m}}(O_{\text{m}}(t))\)。为了书写方便起见，在不引起混淆的地方，省略参数
    \( t \)，简记为


    \( v_{\text{m}}=c_{\text{m}}(O_{\text{m}}) \)


    它描述了物与其关于某个特征的量值之间的关系。


    对于多个特征，有多维参变量物元，记作


    \( M(t) = \begin{bmatrix} O_{\text{m}}(t), & c_{\text{m1}}, & v_{\text{m1}}(t)
    \\ & c_{\text{m2}}, & v_{\text{m2}}(t) \\ & \vdots & \vdots \\ & c_{\text{mn}},
    & v_{\text{mn}}(t) \end{bmatrix} = (O_{\text{m}}(t), C_{\text{m}}, V_{\text{m}}(t))
    \)


    给定一物，它关于任一特征都有对应的量值，并且在同一时刻是唯一的。当该量值不存在时，用空量值 \(\varnothing\) 表示。如果物 \( O_{\text{m}}\)
    关于特征 \( c_{\text{m}}\) 的量值为非空量值，称 \( c_{\text{m}}\) 为 \( O_{\text{m}}\) 的非空特征。


    定义 5.4 称物 \( O_{\text{m}}\) 的一切非空特征所对应的物元


    \( \begin{bmatrix} O_{\text{m}}, & c_{\text{m1}}, & v_{\text{m1}} \\ & \vdots
    & \vdots \\ & c_{\text{mn}}, & v_{\text{mn}} \\ & \vdots & \vdots \end{bmatrix}
    \)


    为物 \( O_{\text{m}}\) 的全征物元，记作 \( cpM(O_{\text{m}})\)。


    在确定的时刻，物 \( O_{\text{m}}\) 的全征物元是唯一的。对任意两个不同的物 \( O_{\text{m1}}\) 和 \( O_{\text{m2}}\)，至少可以找到一个特征
    \( c_{\text{m}}\)，使 \( c_{\text{m}}(O_{\text{m1}}) \neq c_{\text{m}}(O_{\text{m2}})\)。


    2) 事元(affair-element)


    物与物的相互作用称为事，事以事元来描述。


    定义 5.5 把动词 \( O_a\)、动词的特征 \( c_a\) 及 \( O_a\) 关于 \( c_a\) 所取得的量值 \( v_a\) 构成的有序


    三元组


    \( A=(O_a, c_a, v_a) \)'
