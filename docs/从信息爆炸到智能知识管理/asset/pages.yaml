- pgno: 102
  md: '两个最优目标同时成立。


    具体建模如下：


    ```

    (M4) Minimize \(\sum_{i} \alpha_i\) and Maximize \(\sum_{i} \beta_i\)

    Subject to:

    \(A_i X = b + \alpha_i - \beta_i, \quad A_i \in B\)

    \(A_i X = -b - \alpha_i + \beta_i, \quad A_i \in G\)

    (4. 10)

    ```


    其中，\(A_i\) 为给定的属性变量矩阵，\(X\) 和 \(b\) 为无约束变量，而且 \(\alpha_i \geqslant 0, \beta_i
    \geqslant 0\)。


    基于平衡训练集的多目标线性规划模型可以被训练成一个好的分类器。


    以上介绍的分类方法都是基于历史数据的分析，用历史数据中静态的属性特征、权重等对未知数据集进行分类。评价分类效果的指标主要是准确率和 KS 值。有时，即使分类的准确率高于
    80%，实践应用中也仍然存在误分和难以采取转化措施的困惑。原因可以用示意图 4.5 说明。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_102_0.png)


    # 图 4.5 基于可拓域的 MCLP 分类方法示意图


    因为正确分类的部分往往是图 4.4 分界虚线的两侧，所谓的特征明显的顽固派和忠诚派，这两类特征往往容易发现，利用分类结果实现金融风险的预防有一定的效果。但对客户流失分析而言，这种分类很难为预防客户流失提供措施上的支持。现实生活中，分类最容易出错的部分即图
    4.4 中的交叉区域也是最有应用价值的部分，这类客户好坏的特征很不明显，实际生活中可能确实处于摇摆状态，一个很小的行动可能会导致其流失，另外一个措施可能促使其从即将流失状态转变为忠诚用户，故称之为动摇派。实践应用中的一个主要需求就是如何实现动摇派向忠诚派的转化，并预防动摇派转化成顽固派。'
