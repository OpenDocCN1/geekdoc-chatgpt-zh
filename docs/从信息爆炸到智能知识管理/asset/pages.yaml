    # 2.1.3 知识管理模式的研究现状


    # 1. 管理模式的内涵


    模式的定义一般表述为:“模式是一个过程或情境的一个质(或)量的表征。它显示我们认为可以使我们达成预定目的的重要因素.”(梅文·席尔曼,1986)。企业管理模式是为实现企业经营目标而建立的企业管理系统的整体结构和运行'
