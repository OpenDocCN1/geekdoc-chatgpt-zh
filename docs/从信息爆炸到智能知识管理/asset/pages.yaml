  md: '识的转换。这是“数据—知识—智能”转换系列中的一类初级转换，将数据用符号 \( D \) 表示，通过数据挖掘算法或工具从数据中发现的隐藏性知识模式，简称原始粗糙知识，用
    \( K_R \) 表示。则该转换可表示为

    \( T_1: D \to K_R \) 或 \( K_R = T_1(D) \)


    粗糙知识是原始数据经过数据挖掘技术处理得到的直接结果，是没有经过筛选的、粗糙的。因此，数据挖掘这一初级转换获得的知识可看作智能知识的“一阶”分析结果。


    用 \( K_I \) 表示智能知识，作为在粗糙知识的基础上，结合相关的信息和主体知识（包括规范知识 \( K_S \)、经验知识 \( K_E \)、常识知识
    \( K_C \)、本能知识 \( K_H \)、情境知识 \( K_U \)）进行“二阶”挖掘并智能化处理所生成的知识表达。


    由粗糙知识到智能知识的转换是“数据—知识—智能”转换系列中的重要级转换，该转换可表示为

    \( T_2: K_R \bigcup K \to K_I \) 或 \( K_I = T_2(K_R \bigcup K) \)

    其中，\( K = \rho(K_S, K_E, K_C, K_H, K_U) \)，称为主体知识，是幂集。


    如前所述，由于粗糙知识具有数量巨大、时效性强等特点，完全靠人工处理难以胜任，必须以智能化的方式进行管理。为此定义智能策略和智能行为如下：


    # 定义 3.9 智能策略(S)。


    智能策略是在给定问题和问题求解的环境约束下，针对特定的目标，基于相关知识所生成求解问题的工作程序。若用符号表示具体问题(\( P \))、问题求解的环境(\(
    E \))、问题求解的预设目标(\( G \))、关于问题和环境的信息 \( I(P, E) \)、相关的知识(\( K_I \))，那么所生成的问题求解策略
    \( S \) 就有如下关系：

    \( T_3: K_I \times I(P, E) \times G \to S \) 或 \( S = T_3(K_I \times I(P, E) \times
    G) \)


    即实现了由知识到策略的转换，是由乘积空间 \( K_I \times I(P, E) \times G \) 到策略空间 \( S \) 的映射。其中，\(
    I(P, E) \) 是关于所给问题 \( P \) 及其环境约束 \( E \) 的信息。


    # 定义 3.10 智能行为(\( K_A \))。


    智能行为是通过主体的执行机构把主体生成的智能策略转换而来的行为。

    \( T_4: S \to K_A \) 或 \( K_A = T_4(S) \)


    智能行为原则上应当是 1-1 映射。一般而言，智能策略和智能行为是智能系统“智能水平”的“孪生概念”，智能策略是智能行为的源，智能策略是它的内在表现，智能行为是它的外在表现，两者的统一体构成智能系统的实际“智能水平”。


    从数据到粗糙知识(\( T_1 \))，从粗糙知识到智能知识(\( T_2 \))，从智能知识到智能策略(\( T_3 \))，从智能策略到智能行为(\(
    T_4 \))的过程，可表示如图 3.5 所示。


    综上所述，智能知识与数据挖掘的关系可归纳为：


    +   (1) 智能知识来源于数据挖掘的结果，是在数据分析产生的粗糙知识基础上'
