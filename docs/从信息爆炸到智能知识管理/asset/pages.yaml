    # 7.3 智能知识管理模式的初步应用


    某服装集团创建于 1979 年，经过 20 多年的发展，成为一家以服装制造和营销为主的综合性企业，包括了服装设计、纺织面料、成衣生产到成衣销售整个供应链，是中国服装行业的龙头企业，主打产品衬衫连续十年获市场综合占有率第一位，西服也连续四年保持市场综合占有率第一位，并双双成为“中国名牌”产品。该集团集设计、生产、销售、展示、商务为一体的国际服装工业城被中国服装协会认定为国内最大的服装先进制造业基地，同时被评为中国服装工业八强企业，被国家经贸委、国家统计局列入国家综合评价最优
    500 家企业之一。该服装集团有着庞大的服装营销网络，在全国建立了 150 多家分公司，形成一个覆盖全国的自营专卖店、大型商场商场、特许专卖和团购为主要营销方式和渠道的营销网络体系，现有
    2000 多个销售网点，形成了强大的销售能力。


    自 1998 年开始，该服装集团就全面启动数字化工程，并取得了明显成效。2003 年，被国家信息化测评中心列为中国企业信息化 500 强第 18 位，居服装行业第一名，并获最佳信息化战略奖，2004
    年被该中心确定为首批中国企业信息化标杆工程企业。通过雅戈尔数字化工程，加速市场信息反馈，缩短供应链周期，形成市场快速反应机制，进一步增强公司的核心竞争力。商业智能和知识管理是该服装集团数字化工程中的一个重要组成部分。集团建立了以数据仓库和数据挖掘为主的运营数据综合分析系统和各级业务部门的知识管理平台，定期分享交流经营管理的经验知识。


    通过在数据仓库基础上的数据挖掘，其北方某区域公司发现，2005～2006 年团购订单销售额占总销售额的比例和利润都增长较大，成为越来越盈利的销售渠道。且成功交付某几笔较大的团购订单后
    2～3 月内其旗舰专卖店的销售都有不同程度的增长。但 2007 上半年团购订单的交货延期率大于前几年平均水平（具体数值略），成为制约团购业务发展的瓶颈。建立集团级经营决策知识管理平台'
