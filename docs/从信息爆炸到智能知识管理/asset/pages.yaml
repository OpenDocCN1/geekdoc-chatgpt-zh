- pgno: 68
  md: '统是将企业整体看作一个知识处理的系统，它包括企业组织、企业文化、个体知识与学习模式、业务规则及其间的交互过程以及由计算机支持的信息系统。


    在综合学者们研究的基础上(盛小平等, 2003)，结合智能知识应用的实践经验给出智能知识管理系统的定义：


    # 定义 3.8 智能知识管理系统（intelligent knowledge management system, IKMS）。


