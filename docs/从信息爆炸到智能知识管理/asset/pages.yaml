  md: '(Mohammadian, 2004)。国内研究者针对传统算法提出改进的也有很多，例如，王天真(2006)提出了三种基于聚类的算法：复合聚类分析算法；基于动态数据窗口的自组织竞争神经网络聚类分析方法；基于动态数据窗口的融合聚类分析算法。

    并基于动态数据窗口的聚类分析方法，相对主元方法和并行递归神经网络的多维预测模型，提出一种基于智能融合的数据挖掘方法监控系统。该方法可以实现监控系统的虚警消除、参数压缩(多变量降维)、故障监测等。


    自组织数据挖掘方法(SODM)是在数据分组处理方法(group method of data handling, GMDH)基础上发展起来的一系列算法(Mueller,
    2000)，已成为复杂系统进行非线性分析的有效方法(贺昌政, 2001; Madala et al, 1994)。GMDH 方法由乌克兰科学院院士 Ivakhnenko(1967)首先提出的。对应于进化论的自组织选择，GMDH
    算法就是在“进化—遗传—变异—选择”的原理下，由一个简单的初始(网络)结构开始，按照某种演变规则，产生一系列具有某种“进化”特征的模型，它们的复杂度逐步递增，而复杂度递增的每一步都是从大量待选模型中，经基于“适者生存”的原则选择后获得的。不断地重复这样一个产生、进化、变异和选择的过程，直到具有最优复杂度模型被选出为止。随着模型的进化，这一树状网络不断生出枝节，网络的层数、层间节点数都不需要建模者事先指定，整个建模过程具有自组织的特征(http://www.
    knowledgegeminier. net/pdf/sodm. pdf; 俞海, 2004; Aks-enova, 1988)。在 20 世纪 90 年代，Mueller
    和 Frank 研制了功能强大的自组织数据挖掘软件包 Knowledge Miner，使 SODM 成功地应用于经济、生态、人口、医药、军事等领域的建模预测实践(贺昌政,
    2005; Ivakhnenko, 1995)。Kondo(2000)等将 GMDH 与神经网络结合产生了 GMDH-type 型方法(Muller, 1998)，但
    SODM 方法算法复杂、运算量大、获取的知识可理解性较差。对 SODM 的改进目的是希望将 SODM 从单纯的数据挖掘技术扩展为知识提取的全过程，提高 SODM
    解决复杂问题的能力(张宾等, 2006)。


    一些学者(蔡文等, 2008; 陈文伟等, 2006a, 2006b; 黄金才等, 2006)基于可拓学理论和实践需求，将数据挖掘概念拓宽到可拓数据挖掘的概念，把挖掘可拓变换的变化的知识称为可拓数据挖掘，其理论依据是可拓集为基础的可拓论，方法论采用将现有数据挖掘与可拓方法结合的挖掘方法，应用的对象是经济、管理、营销、策划、医学、技术创新等多个领域，挖掘各种可拓知识是可拓数据挖掘的重要任务。可拓数据挖掘与传统数据挖掘的差异之一是传统数据挖掘得出的结果是一般知识，而可拓数据挖掘可以挖掘可拓变换，即其结果是可拓变换的策略，决策者可以借助可拓变换策略，使矛盾问题转化。在数据库或数据仓库中，数据的变化可以反映出可拓变换的作用。从过去的数据中挖掘基于可拓变换的知识，就可以提出解决矛盾问题的变换策略。


    可拓学是一门由中国学者原创的新学科。它用形式化模型研究事物拓展的'
