  md: '# # 后 记


    衷心感谢国家自然科学基金委员会管理科学部等对本研究的大力支持！感谢参加 278 届香山科学会议的国内外院士、专家的建议以及在国际学术会议上各界学者们的交流！


    在研究过程中，国内很多专家、学者给予了我们较大的帮助，如可拓学创始人蔡文老师，中国人工智能学会可拓工程专业委员会杨春燕老师，中国科学院数学与系统科学研究院顾基发、汪寿阳、杨晓光老师，中国科学院科技政策与管理科学研究所徐伟宣老师，中国科学院软件研究所工业管理与工程设计研究中心韩永生老师，浙江大学现代制造工程研究所先进制造系统及管理研究室祁国宁、顾新建老师，北京航空航天大学韩立岩老师，北京理工大学计算机科学技术学院牛振东老师，国防科技大学陈文伟老师，哈尔滨工业大学邹广天、钟诗胜、孙佰清老师，中国科学院虚拟经济与数据科学研究中心田英杰、杨海珍、石敏俊、刘莹老师，电子科技大学寇纲、彭怡老师，浙江工业大学赵燕伟老师，北京建筑工程学院秦建军老师，浙江大学管理学院张军博士，以及中国科学院虚拟经济与数据科学研究中心朱正祥、李爱华、张展、张东玲、张悦今、李军、聂广礼、张鹏、张志旺、陈若颖、欧阳忠滨、朱梅红、韩晶晶、周琳、卫婕、刘荣、王惊、印为、柴耀辉、郑秀榆、黄安强、陈全及中国科学院研究生院管理学院王能元、申爱华、鹿盟、肖利华、谭大鹏、孟建平、刘二军、孔倩等同学，均对书稿的完成贡献了他们的智慧，对此，向他们表示衷心的感谢。另外，浙江大学宁波理工学院管理分院的余巧、周力、陈科等同学为书稿的完成做了大量工作，在此一并致谢。


    本书在出版过程中得到中国人工智能学会、科学出版社、雅戈尔集团、网易公司(北京)、安徽力源工程机械有限公司等的大力支持，在此一并致谢。


    感谢在本书中由于疏忽而未提及的其他学者，他们的研究成果是本书研究的基础。'
