    描述了 $v_{r1}$ 和 $v_{r2}$ 的关系 $O_r$ 随时间 $t$ 的改变而产生的动态变化(包括关系程度的变化)。不同的人、事、物的影响也使关系产生变化,这些变化表现为关系程度的改变。若把
