  md: '(8) 对任意的输入 \( x \) 计算其位置如下：

    \( D(x, X_0, X) = \begin{cases} \rho(x, X) - \rho(x, X_0), & \\ \rho(x, X) \neq
    \rho(x, X_0) \text{ 且 } x \notin X_0 \\ \rho(x, X) - \rho(x, X_0) + a - b, & \\
    \rho(x, X) \neq \rho(x, X_0) \text{ 且 } x \in X_0 \\ a - b, & \\ \rho(x, X) =
    \rho(x, X_0) \end{cases} \)


    其中, \( \rho(x, X_0), \rho(x, X) \) 定义如下：

    \( \rho(x, X_0) = |x - \frac{a+b}{2}| - \frac{b-a}{2} \)

    \( \rho(x, X) = |x - \frac{c+d}{2}| - \frac{d-c}{2} \)


    (9) 计算输入 \( x \) 关于 \( X_0 \) 和 \( X \) 的关联函数为

    \( k(x) = \begin{cases} \frac{\rho(x, X_0)}{D(x, X_0, X)} - 1, & \\ \rho(x, X_0)
    = \rho(x, X) \text{ 且 } x \notin X_0 \\ \frac{\rho(x, X_0)}{D(x, X_0, X)}, & \\
    \text{其他} \end{cases} \)


    其中

    \( \rho(x, X_0) = |x - \frac{a+b}{2}| - \frac{b-a}{2} \)


    表示点 \( x \) 与区间 \( X_0 \) 的位置关系(在 \( X_0 \) 的中点处取得最大值)，

    \( D(x, X_0, X) = \begin{cases} \rho(x, X) - \rho(x, X_0), & \\ \rho(x, X) \neq
    \rho(x, X_0) \text{ 且 } x \notin X_0 \\ \rho(x, X) - \rho(x, X_0) + a - b, & \\
    \rho(x, X) \neq \rho(x, X_0) \text{ 且 } x \in X_0 \\ a - b, & \\ \rho(x, X) =
    \rho(x, X_0) \end{cases} \)


    描述点 \( x \) 与 \( X_0 \) 和 \( X \) 组成的区间套的位置关系。


    当某特征值的最优点不在区间的中点时，必须根据实际问题的要求建立不同形式的关联函数。当最优点在左侧达到时，


    给定区间 \( X_0 = [a, b], x_0 \in (a, \frac{a+b}{2}] \), 称


    \( \rho_l(x, x_0, X_0) = \begin{cases} a - x, & x \leqslant a \\ \frac{b - x_0}{a
    - x_0}(x - a), & x \in (a, x_0) \\ x - b, & x \geqslant x_0 \end{cases} \)


    为 \( x \) 与区间 \( X_0 \) 关于 \( x_0 \) 的左侧距。


    反之, 给定区间 \( X_0 = [a, b], x_0 \in [\frac{a+b}{2}, b) \), 称


    \( \rho_r(x, x_0, X_0) = \begin{cases} a - x, & x \leqslant x_0 \\ \frac{a - x_0}{b
    - x_0}(b - x), & x \in (x_0, b) \\ x - b, & x \geqslant b \end{cases} \)'
