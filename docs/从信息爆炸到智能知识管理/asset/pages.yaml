  md: '(5) 结果评价，即对于数据挖掘过程所发掘的知识和规律的可用性和可靠性进行客观的评价。


    为了促进标准过程的完善,有些学者提出了数据挖掘过程和知识管理相结合的方案(Li et al,2006b),在数据挖掘过程中积累与数据挖掘实施有关的知识。还有的学者提出了数据挖掘与最优化结合的应用模型(何增有等,2005)。


    一个好的数据挖掘的标准体系结构将有利于更好地利用软件环境,有利于有效、及时地完成数据挖掘任务,也有利于与其他信息系统协调和交换信息,还有利于系统适应用户的各种需求,并随时间变化对系统进行改进和优化。


    一个数据挖掘系统的体系结构标准应该包括多个方面:数据挖掘系统和数据库、决策支持系统与数据仓库的关系;数据挖掘的挖掘者和决策者这两种用户群的标准用户界面;数据挖掘系统的功能结构体系的标准化等。关于数据挖掘系统完整的体系结构标准还没有出台,目前只有一些关于数据挖掘系统的功能结构体系的讨论,一般认为应采用三层构架的功能结构,如图
    2.5 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_44_0.png)


    图 2.5 数据挖掘系统的体系结构


    在数据挖掘标准化语言这一领域,尽管微软已经推出了 OLE DB DM 这一数据挖掘语言,但是并不像关系数据库中的 ER 数据模型已经具有完善的工业标准,这一技术还处在改进和完善的阶段,距离行业期待的成熟的数据挖掘语言的要求还有一定差距。数据挖掘的标准化工作已经取得了一些成果,但是目前离完善的数据挖掘工业标准还是很远的(潘无名等,2004)。


