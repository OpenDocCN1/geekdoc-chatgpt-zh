  md: '# 附录 知识管理和数据挖掘研究论文统计


    # 附表 1 知识管理和数据挖掘研究论文统计表

    (论文发表时间：1999～2007，查询时间：2007. 10. 22)


    | 关键词 | 数据库 | 论文篇数 | 准交叉研究论文数 | 百分比/% |

    | :--- | :--- | :--- | :--- | :--- |

    | 知识管理 (“knowledge management”) | ISI web of knowledge | 5469 | 169 | 3.09 |

    | | Web of Science | 2101 | 65 | 3.09 |

    | | Ei Engineering Village 2 | 3444 | 196 | 5.69 |

    | | 中国知网 CNKI | 13077 | 205 | 1.57 |

    | | 小计 | 24091 | 635 | 2.64 |

    | 数据挖掘 (“data mining”) | ISI web of knowledge | 14000 | 169 | 1.21 |

    | | Web of Science | 6267 | 65 | 1.04 |

    | | Ei Engineering Village 2 | 14679 | 196 | 1.34 |

    | | 中国知网 CNKI | 15414 | 205 | 1.33 |

    | | 小计 | 50360 | 635 | 1.26 |


    其中，准交叉研究论文是指以“知识管理” 和 “数据挖掘” (“knowledge management”and“data mining”) 为关键词或主题的论文，其比例示意图如附图
    1 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_176_0.png)


    # 1. Web of Science 介绍


    ISI Web of Science® 包括著名的三大引文索引：Science Citation Index Expanded® (SCIE, 1900 至今)、Social
    Sciences Citation Index® (SSCI, 1956 至今) 和 Arts & Humanities Citation Index® (A&HCI,
    1975 至今) 及两大化学信息数据库 Current Chemical Reactions® (CCR, 1986 至今) 和 Index Chemicus®
    (IC,'
  merge: -1
  img_proc: true
- pgno: 177
  md: '1993 至今)。涵盖自然科学、工程技术、生物医学、社会科学、艺术与人文领域，来源于 9000 多种核心学术期刊。（网址：http://www.isiknowledge.com）


    # 2. ISI Web of Knowledge 简介


    ISI Web of Knowledge 是一个基于 Web 而构建的整合的数字研究环境，在内容上以 Web of Science 为核心，整合了学术期刊（ISI
    Web of Science, Current Contents Connect）、发明专利（Derwent Innovations Index）、会议录文献（ISI
    Proceedings）、化学反应（Current Chemical Reactions，Index Chemicus）、学术专著（Current Contents
    Connect）研究基金（ISi eSearch）、Internet 学术资源（External Collections）、学术分析与评价工具（Journal
    Citation Reports, Essential Science Indicators）、学术社区（ISIHighlyCited.com）及其他多个重要的学术信息资源（BIOSIS
    Previews, INSPEC, FSTA, PsycINFO）等，提供了自然科学、工程技术、生物医学、社会科学、艺术与人文等多个领域中高质量、可信赖的学术信息。


    # 3. Ei Engineering Village 2 简介


    《Ei》(工程索引)的网络版，内容包括原来的光盘版（Ei Compendex）和后来扩展的部分（Ei PageOne）。该数据库包含 1970 年以来的超过
    700 万条的工程类期刊、会议论文和技术报告的题录，每年新增 25 万条工程类文献，数据来自 175 个学科的 5100 多种工程类期刊、会议论文和技术报告。Ei
    Compendex Web 收录的文献涵盖了所有的工程领域，该数据库侧重提供应用科学和工程领域的文摘索引信息。


    # 4. CNKI 简介


    国家知识基础设施（National Knowledge Infrastructure, CNKI），概念由世界银行于 1998 年提出。CNKI 是世界上全文信息量规模最大的数字图书馆，目前，中国期刊全文数据库来源期刊/杂志
    8809 种，时间自 1915～2007，文章篇数超过 24960000 篇。'
