- pgno: 39
  md: '于博客的知识管理形式是企业创新的源泉，动态的知识管理实现了知识的学习——共享—创新（AMT，2004）。新出现的威客（www. witkey. com）模式为寻找知识拥有者并购买其知识提供了一个新的平台（李静等，2007）。


    # 4. 知识的检索应用技术与工具


    知识的检索应用主要是从组织的知识库中快速检索获取在知识应用过程中所需的知识，辅助完成工作任务。


    随着组织知识资源的不断丰富，检索时通常会出现成百上千条知识信息，知识过载（Shi et al, 2007）影响了知识使用效率。知识地图是用于帮助人们在短时间内找到所需知识的工具。知识地图最终指向的可以是人、地点或时间，但它们都指出了在何处人们能找到所需的知识，知识地图创造了一个可视化的知识框架。Gordon
    提出了使用学习依赖关系建立组织知识地图的方法（Gordon，2000）。大量的知识地图构成知识地图集（knowledge atlas）（Seemana, 1997），王君等提出了基于知识地图集的知识管理系统模型框架（王君等，2003b）。在此基础上，提出了企业知识门户解决方案（Benbya,
    2004; Grammer, 2000）。企业知识门户不仅提供检索知识的方法，而且允许用户互动式地将知识与他们的共同价值、经验和洞察力相联系，提供给用户强大的、不断改进的指向组织知识和信息的联系图。


    为快速地检索获取知识，各种检索技术得到了研究，如基于案例的推理（case-based reasoning，CBR）（王知行，2003; Lau, 2003;
    Noh, 2000）。CBR 以在不同的应用中通过案例匹配来获取过去的经验和知识能力为特点，是在实现知识管理系统中出现并得到接受的方法。随着语义网技术的发展，知识管理中语义和关键词相结合的检索方法（李飞等，2004），知识管理中的联想检索（周明建等，2004）等在语义基础上的知识检索方法正得到研究。


    除通过检索供应知识进行知识应用外，随着知识管理水平的提高，出现了主动的知识推送供应方法，即知识推送技术。知识推送技术采用广播的方式，将企业重要的知识主动地推送到使用者的面前（Nabie
    et al, 2003）。


    # 5. 知识的评价技术与工具


    知识及知识管理的复杂性决定了对其进行评价是困难的，而对知识和知识管理价值的评估又是非常重要的。知识和知识管理评价包括多个方面：对知识本身价值、知识利用效果以及知识和知识管理给组织带来的效益等进行评价。


    当把知识看成价值形成和增值的手段时，知识也就成了知识资本。很多文献对知识资本的评估问题进行了探讨（刘善球，2004; Mouritsens, 2001; 金明律，'
  merge: -1
  img_proc: true
- pgno: 40
  md: '1999)。知识资本基准系统（Intellectual Capital Benchmarking System）（Marti, 2000）是用于与相同行业最好的竞争者的核心能力或知识资本进行比较的一套方法和工具，已成功地在欧洲
    30 多个企业中实施。Kreng 等根据知识时间扩散、贬值和增长的特点，提出了基于扩散模型为单个知识构建知识扩散过程来评估知识价值的方法（Kreng, 2003），他们认为只有通过对知识价值变化的理解，知识管理的性能才能得到全面的评估。Ahn
    等通过评估知识对企业性能的促进作用来评估知识价值，提出的 KP3 知识价值评估方法通过把产品和过程作为中间媒介来评估知识对业务性能的作用（Ahn, 2004）。


    杨炳儒等(2002)认识到对 KDD 中所发现的知识进行评价是一个很重要的环节，在分析专家对规则的客观感兴趣度的研究如置信度（Agrawah, 1996）、事件独立性（Piateset-Shapiro,
    1991）、J-Measure 函数（Symrh, 1992）、分组的覆盖集合（cover rules）(Toivonen, 1995)等的基础上，提出了一种因果关联规则的自动评价方法。该评价方法采用了语言场和语言值结构的知识表示方法，并引入推理机制，通过人机交互，以规则的因果关联强度评价知识的兴趣度，重视背景知识和用户的参与。


    在此研究基础上，蔡艳霞和杨炳儒(2003)提出了 KDD 中的分层次的自动的知识评价系统。整个评价过程分为三个层次：第一层客观地从数据的层面进行；第二层强调人机交互和领域知识的参与，是主观的、从规则的层面进行的；第三层综合了主客观两方面的因素，形成了综合的评价指标。该评价模型与方法将评价过程与基础知识库联系起来，通过计算机实现了人类进行评价的基本过程，使评价过程具有一定的智能。


    # 2.1.5 本节小结


    本节对知识管理研究的对象、内容、方法和技术、工具进行了系统地回顾，为后续的研究打下了基础。当以上工具和技术集成起来应用时，就形成了知识管理平台与知识管理系统。Tiwana(2004)在《知识管理十步走》一书中提出，知识管理系统指的是促进知识整合、应用和管理的技术成分，而知识管理平台包括知识管理体系的内在框架、知识管理战略、知识管理文化、激励模式的设计以及测评和评价机制。因此知识管理系统是知识管理平台的一个子集。


    通过大量分析可以看出，随着信息技术的迅速发展，知识管理的获取方式将由传统的隐性知识显性化为主转移到从数据和信息中挖掘知识为主，数据挖掘逐步成为知识获取的重要工具。因此，下一节将对数据挖掘及其在知识管理中的应用研究现状进行综述。'
