  md: '+   (1) 规范知识，是主体关于事物所处状态及其变化规律的表述。

    +   (2) 经验知识，是主体关于事物所处状态及其变化方式的总结性表述。

    +   它是未经科学检验和证实的知识，因此可以称为“准知识”或“前知识”。

    +   (3) 常识知识，常识是众所周知而不需证明的知识。

    +   (4) 本能知识，本能是主体（包括人类和生物）先天具有的知识，也不需要学习和证明过程。

    +   (5) 情境知识，是与知识、知识活动等相关的条件、背景和环境。


    信息时代的知识既来自于人的实践经验，是在认识和实践过程中，人们所获得的认知、经验和洞察力等；也来自于数据和信息背后隐藏的规律性模式的反映。综上所述，知识的获取方式可分为如图
    2.1 所示的三类。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_25_0.png)


    # 图 2.1 知识获取的三种主要方式


    +   (1) 传统的知识获取方式，以隐性知识分享和实践经验总结为主的知识管理。

    +   (2) 基于数据、信息的知识发现方式以数据挖掘为主要工具，从数据库、数据仓库及互联网等数据源、信息源中挖掘知识。

    +   (3) 人机交互的智能知识获取模式，则把专家经验和数据挖掘技术结合起来，从挖掘过程及挖掘后获取的知识的智能化处理为手段，实现智能化决策支持。


    在后面的章节中将分别介绍知识管理、数据挖掘和智能知识研究的现状。第三种模式是本书研究的重点。'
