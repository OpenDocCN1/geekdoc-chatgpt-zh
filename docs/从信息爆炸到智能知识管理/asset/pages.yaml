  md: '# 前 言


    迈入知识经济主导的 21 世纪,知识正成为组织的重要资源。随着信息技术和互联网的迅速发展,信息采集、传播的速度和规模都不断提升,实现了全球的信息共享与交互,现代通信和传播技术,大大提高了信息传播的速度和广度。通信网络已经成为信息社会必不可少的基础设施。它克服了传统的时间和空间的障碍,将世界更进一步地连接为一体。伴随而来的信息浩如烟海,在巨大的信息海洋中迅速而准确地获取自己需要的信息,变得越来越困难。


    信息时代出现的数据爆炸、信息泛滥及噪音化趋势,使人们难以根据自己的需要选择、收集所需的信息,系统或个人所接受的信息超过其自身的处理能力导致信息不能有效利用的状况,称为“信息爆炸”(information
    explosion)。随着管理信息系统和数据挖掘技术的应用,知识的增长速度又进一步加快。而数据挖掘得到的大量知识具有多样性、粗糙性、时效性和分散性等特点,需要靠专家经验进行鉴别、筛选才能有效利用。当产生的这类知识数量很大或者表现形式可解释性差时,人工识别变得非常困难。另外,识别出的知识随着时间的推移也会失效,同时新的知识也在不断产生,而且,应用过程中知识是被动地利用,不能主动提供给需要的人,而用户无法识别边界条件,导致人工审计大量知识的成本高、工作量大、周期长。从上述分析可以看到,有效管理数据挖掘获取的知识并非易事,庄子“人生也有涯而知也无涯”的矛盾深深地困扰着现代信息人。


    如何有效利用数据挖掘获取的知识,弥补目前知识管理实施中遇到的问题,尚未引起学者足够的重视。数据挖掘获取的知识是将隐藏在数据库和互联网中的规律,通过深入挖掘分析而得到的,它很难用显性知识或隐性知识来描述其特征。因此,当前知识管理理论和方法还没有探讨如何有效地管理上述由数据挖掘获取的知识。而数据挖掘领域的专家大都把数据建模后得到知识作为数据挖掘流程的结束,对获取的知识如何有效选择、运用没有进行足够的分析研究。知识管理和数据挖掘的智能融合研究对持续提高组织的决策水平,提升企业的核心竞争力有着重要的意义。


    本书将探讨如何利用可能的技术手段,构筑一套系统化方案,使信息爆炸转化为知识的智能化个性服务,从而提升组织及个人的信息利用能力,提高企业决策水平。


    本书的结构是这样安排的:第 1 章简要论述信息时代知识管理和数据挖掘对决策的影响,及其在应用中遇到的问题,指出智能知识管理研究的方向。第 2 章'
  merge: -1
  img_proc: true
- pgno: 7
  md: "从信息爆炸入手，论述知识获取方式的变迁，对知识管理、数据挖掘的研究现状进行了综述，提出知识的智能化管理是必由之路。第 3 章对智能知识进行定义，阐述了其理论基础及理论框架。第\
    \ 4 章介绍智能知识的直接获取技术，包括数据准备、转化规则挖掘算法及可拓分类算法等。第 5 章介绍智能知识的间接实现模式，系统阐述了从粗糙的原始知识到智能知识的过程，包括其孵化过程、表达方式、存储结构、知识智能审计策略和推理机制。第\
    \ 6 章对智能知识管理系统进行了设计，为软件开发做好技术储备。第 7 章介绍了智能知识管理模式的实施流程及应用案例。最后一章对本研究做了总结和展望。应该说，研究成果是初步的，撰写本书的目的是为更多有识之士在智能知识领域从事深入研究打开一扇窗户，冀求引出高水平的研究成果。\n\
    \n本研究是在国家自然科学基金面上项目“数据挖掘获取的知识的智能化管理研究”(70871111)、国家自然科学基金委员会创新研究群体科学基金“数据挖掘与智能知识管理：理论及应用研究”(70921061)的资助下完成的，同时也得到国家自然科学基金(70501030，90718042，70840010，70531040)、美国国家科学基金会、美国自然科学基金、宁波市科技局软科学研究项目(2009A10033)、中国科学院研究生院院长基金项目(A\
    \ 类交叉)(085102HN00)以及 Nebraska Furniture Market Co., USA 和 BHP Billiton Co., Australia\
    \ 的部分资助，在此一并致谢！\n\n由于作者水平有限，疏漏之处在所难免，恳请读者不吝批评赐教。\n\n作者  \n2010年2月\n\n李兴森，浙江大学宁波理工学院信息管理与信息系统研究所所长，中国人工智能学会可拓工程专业委员会秘书长，中国科学院软件研究所工业管理与设计工程研究中心高级咨询顾问。\n\
    \n石勇，中国科学院虚拟经济与数据科学研究中心常务副主任，中国科学院研究生院管理学院副院长，2004 年中国科学院百人计划获得者，1999～2004 年 3\
    \ 月，任美国内布拉斯加州立大学信息科学和技术学院查尔斯－玛格丽·德姆信息技术杰出讲座教授、系主任和数据挖掘实验室主任。\n\n张玲玲，中国科学院研究生院管理学院副教授，中国科学院虚拟经济与数据科学研究中心兼职研究人员。\n\
