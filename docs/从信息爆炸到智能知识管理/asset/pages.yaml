  md: '后，开始着手查找与团购业务相关的知识，主要内容如下：


    生产厂的加工生产类型分 3 类:1. 面向库存的生产，供各类渠道销售;2. 团购订单加工;3. OEM(original equipment manufacturer
    的缩写，指一家厂家根据另一家厂商的要求，为其生产产品或配件，亦称为定牌生产或授权贴牌生产，习惯称为委托生产,三来加工)订单加工。


    生产厂团购订单及时交货率出现持续下降趋势，远远低于 OEM 生产订单的及时交货率。OEM 订单批量大，在生产厂利润中的比重也越来越大。


    OEM 加工费略高于团购订单的加工费，平均每件高 2~4 元。


    生产厂的加工循序规则是:优先加工利润高、批量大的订单。


    集团财务数据挖掘显示，服装板块的利润来源主要是自营专卖店销售和团购业务销售。


    利润指标是集团对下属单位考核的主要指标之一，生产厂每年利润指标都完成 95%以上，属于绩效考核的先进单位。


    将上述知识进行分析，可以得出如下知识链:利润是生产厂的主要考核指标->优先加工利润高的订单->OEM 订单利润高->优先加工 OEM 订单->OEM 订单批量大，在生产能力一定的情况下，团购订单被延期。从生产厂的角度来说，优先加工利润高的
    OEM 订单无可厚非，但从集团角度来看，OEM 单件加工费和单件团购销售的利润相比几乎可以忽略(不超过 5%)，团购的利润是 OEM 利润的 20 倍以上。而产生这一“捡了芝麻，丢了西瓜”现象的根本原因在于利润指标的设置。集团变生产厂的利润指标为订单及时交货率后，生产能力得到充分利用，团购订单交货及时率大大提高，而
    OEM 订单交货率几乎没有下降，而服装板块的整体利润提高很多。


    另外，本研究也在与澳大利亚必和必拓 (HBP BillHton)公司应用数据挖掘技术开展石油勘探复杂数据挖掘及知识发现方面得到应用。


    (1) 金伯利岩数据库实验。作为理解数据挖掘技术如何应用于地球科学与勘探的准备工作，BHPB 提供了一个已知的 Botswana 金刚石矿区的数据集。使用了包括自行研发的多目标线性规划方法，其数据挖掘结果证实真实属性具有高于
    80%的准确率，甚至高于 BPHB 专家所能做到的准确率。这也表明数据挖掘技术应用于石油勘探领域具有非常大的潜力。


    (2) 识别油藏和非油藏特征。针对 BHPB 提供的澳大利亚海岸的石油勘探数据集，通过测井数据识别和分析了油藏和非油藏特征。基于现有的测井属性学习得到的模型和规则可以用于识别油藏和非油藏，而油藏和非油藏的特征是通过分类结果得到的。


    (3) 理解和访问地震数据。进一步研究了地震数据，包括两个属性:波阻抗和类。波阻抗是岩性的特征化，与孔隙度和流体等有密切关系。'
