    # 5) 业务流程导向的知识管理模式


    张玲玲(2007)综合专家文献研究后认为，传统的知识管理主要集中于一些针对开展特定知识管理活动的局部性有效方法，知识管理与业务流程没有很好地结合起来，知识管理游离于企业实际运作过程之外，知识库的管理、维护以及知识的更新增加了员工的额外负担和工作量，这种知识管理与业务流程的脱节脱离了企业的实际管理需求，无法真正实现将合适的知识在合适的时间传递给合适的人这一知识管理的目标(Petrash,
    1996)。鉴于产生、储存、传递知识的方法因特定的业务流程而异，处理知识应该在业务流程范围内而不应该孤立进行(Davenport et al, 1998)。


    业务流程导向的知识管理(张玲玲, 2007；李兴森等, 2007c；Mertins et al, 2004)，一方面对业务流程知识进行提取和挖掘，实现流程知识的共享和再利用，避免人才流动造成知识流失，缩短人员岗位调动的交接时间等，另一方面让知识管理过程和业务流程紧密结合起来，在业务处理过程中自动收集、存储知识。


    Wiig 分析了知识管理与业务流程设计的关系，提出了知识管理的构建模块的概念，并提出知识创造与传播的构建模块实例(Wiig, 1994)。Hinkelmann
    等(2002)提出的 POROMOTE 方法体系为业务流程及知识加工的建模提供了一种方法和软件工具。该方法对所选业务流程进行建模，找出需要大量知识才能完成的任务(knowledge
    intensive task, KTI)，分析此类知识，并确定这些流程中的知识流，对知识结构进行定义，为知识流程建模，并将其纳入业务流程中。


    业务流程导向的知识管理模式是过程管理模式的一个主要分支。


