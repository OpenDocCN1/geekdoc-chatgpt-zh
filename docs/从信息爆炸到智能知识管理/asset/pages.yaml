    # 5.2 从原始知识到智能知识的转化


    原始知识的出现，$T_1$ 本质上是试图通过各种基于机器智能的方法（如数据挖掘、统计分析）来发现各种具体数据（语法信息）之间存在的某种现象学的关联，属于语法信息一形式性知识转换的情形，离实际的能够支持决策的知识，还有一定的距离，因此，如何对这些知识进行“二次”处理就显得尤为重要。


