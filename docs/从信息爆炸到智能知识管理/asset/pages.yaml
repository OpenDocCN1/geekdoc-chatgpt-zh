- pgno: 3
  md: '# 内容简介


    本书对数据挖掘获取知识的形式、特点和管理模式进行研究，以促进知识管理和数据挖掘学科的互补式交叉发展，提高企业决策质量。运用理论和实践相结合、定性和定量相结合的研究方法，综合知识管理、数据挖掘、人工智能、可拓学和复杂性理论等交叉学科的研究成果，给出了智能知识(IK)和智能知识管理(IKM)的概念。改变了学者一贯采用的智能的知识管理方案，提出让知识本身具有记忆、识别、推理、自适应等一系列特点的智能知识及其管理模式理论，建立了IKM研究的体系框架，以减少即将来临的知识过载。


    本书通过引入可拓学理论，设计了具有目标智能性的可拓规则挖掘算法和基于MCLP的可拓分类算法，首次提出了智能知识的孵化方法，实现了智能知识的表达和存储方案，并提出了智能知识的自我审计方法和推理技术等新方案。最后分析了智能知识管理系统(IKMS)的需求，并进行了详细的软件功能设计，从而为智慧决策提供一种新视角和一条新途径。


    本书适合知识管理、数据挖掘、决策支持、人工智能等研究领域的学者、企业CEO、CIO及研究生和大学高年级学生阅读，也可以作为研究生选修课教材。


