- pgno: 91
  md: '# 1) 关于论域变换的解决方案


    对论域做置换变换，可以选择质量满足数据挖掘要求的其他数据集进行挖掘，同时改变挖掘目标；对论域做增删变换，增加质量更好的数据集以降低整体数据集的不准确率，或者去掉一些质量很差的数据，用清洗后的子集做数据挖掘，这是目前常用的数据清洗方法，其缺点是清洗工作量大，容易洗掉一些有价值的信息。


    # 2) 关于关联准则变换的解决方案


    企业用于数据挖掘的数据的集合本身不变，即关联度不变，对判断数据质量的标准 \(c_{01}, c_{02}, c_{03}\) 做变换，在一般数据挖掘软件下不符合要求的数据在变换后的新软件下质量达到挖掘要求。如研究构造一个低数据质量下的数据挖掘系统，实现容忍低质量数据的数据挖掘算法等。


    # 3) 关于元素变换的解决方案


    变换 V 值，使现在质量差的数据集变成可挖掘的数据集。目前数据挖掘上研究的数据清洗，针对不完整数据的各种填充算法等都是这类方法；对元素 \(u\) 进行置换变换，用符合质量要求的
    \(u''\) 代替现有的元素 \(u\)。


    # 4.1.3 数据转换措施


    给定物元 \(R_1(N_1(t), c, v_1(t))\)，通过事元“数据挖掘咨询”(包括进行数据挖掘目标的分析、数据质量分析，从数据挖掘角度提出数据质量改进建议等)的影响，进行数据质量改进的发展变换，将数据质量变差的恶性循环变换为数据质量不断改进的良性循环。进行发展变换的事元要素包括从数据挖掘的角度分析
    \(R_1\) 现状数据和 \(R_2\) 可用于挖掘的数据，通过挖掘分析、试验发现现状数据和目标数据之间的差距，通过关联函数计算差距大小，采取调整数据结构、存储方式、汇总方式、保留时间等，使数据的完整性和准确性提高，逐步提高整体的数据质量，缩小数据质量的差距。如果差距在
    \(k(u) \leqslant 0\) 的负域，再通过挖掘试验发现新的差距，继续提供数据挖掘咨询。循环进行挖掘试验，采取改进措施，差距逐渐减小，高质量的数据物元逐渐替换低质量的数据物元，使数据质量逐步提高，在某一时刻
    \(t\)，量变引起质变，使物元 \(R_1\) 的质量达到 \(R_2\) 的标准，实现了发展变换的过程，记为 \(T_{V \to N}\)，即


    \(T_{V \to N}(N_1(t), c, v_1(t)) = (N_2(t), c, v_2(t))\)


    最终通过物元可拓变换，得到满足条件的物元 \(N''\)。这样可以主动分阶段进行数据挖掘工作，加速数据质量提升。下面详细论述数据转换的系统解决方案。


    从企业战略目标及行业特征出发，首先分析信息化及决策支持的需求，按数据挖掘所需数据要求、质量标准出发，制定或调整信息化规划、实施方案。对实施信息化多年的企业，可以针对数据挖掘数据和当前业务汇总数据的差距，从软件维护方面采取多种改进方案及措施。其整体解决方案如图
    4.1 所示。'
