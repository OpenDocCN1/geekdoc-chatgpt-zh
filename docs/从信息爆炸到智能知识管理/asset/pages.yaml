    et al,1998)等。


    Davenport 等(1998)在其专著《运用知识:组织如何管理他们所知晓的知识》中论述了知识产生、知识编码与合作、知识转移等流程。Tiwana(2002)提出了由分析企业现存的体系结构、整合知识管理与业务战略、设计知识管理体系结构、审计现存的知识资产和系统、设计知识管理团队、设计知识管理蓝图、发展知识管理系统、配置资源、实施变革管理、评估绩效和完善知识管理系统等十个步骤组成的知识管理流程。还有一些学者从知识管理的生命周期入手进行知识创造或获取、调试、利用、存储(文档处理)、转移或交流、翻译或重新定位、存取、处置过程等的管理(Bergeron,2003;Firestone
    et al,2003)。


    # 3) 信息技术主导的管理模式


    技术流派以信息技术为工具。微软公司信息技术战略研究人员哈尼卡特(Honeycutt)根据微软的知识管理探索提出了一种知识管理战略理论,他认为,知识管理的主要任务是处理智力资本和管理资产,成功的知识管理设计要满足下述主要目标(Honeycutt,2000):


    +   (1) 聚焦关键的信息；

    +   (2) 集成不同来源的信息；

    +   (3) 有效利用来自他人的知识；

    +   (4) 无论在办公室或出门在外都可以用同样的信息环境工作。


    IBM Lotus 知识管理软件把知识管理定义为“系统性地利用信息、处理流程和专家技能,改进企业的创新能力、快速响应能力,提高企业效率和技能素质.”基于这个定义,IBM
    Lotus 提出了受企业规模和协作程度制约的知识管理框架,以实现企业知识管理目标(王启智,2001)。


    由于信息技术的发展,知识管理越来越离不开软件系统的支持,但信息系统的设计需要有知识管理的理论研究为指导,两者是相辅相成的。


