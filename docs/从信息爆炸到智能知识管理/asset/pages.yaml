    \ D， 功能， 抗癌 ]\n    [ 类型， 全新 ]\n```\n\n又如，“企业 E₁ 与企业 E₂ 进行了 2 年的密切合作，开发出了新产品 P”，也是一条复杂信息，可用事元和关系元的运算式表示为：A₃\
