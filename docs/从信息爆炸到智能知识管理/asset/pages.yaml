    \ c₁, v₁(t) \n         c₂, v₂(t) \n         ... ... \n         cₙ, vₙ(t) ] (4.2)\n\
    ```\n\n表示，该物元为条件物元。数据挖掘过程可用多维事元\n\n```\nI = [ DataMining, b₁, u₁ \n     b₂, u₂\
    \ \n     ... ... \n     bₙ, uₙ ] (4.3)\n```"
