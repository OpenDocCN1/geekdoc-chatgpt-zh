  md: '的各个方面，包括：科学理论层面、技术层面、管理层面等，并分析了其子系统，是对知识管理分析较为全面的文献之一。


    人们对知识的需求，基本上是为了引用知识、运用知识、传播知识、学习知识和发展知识，基于该认识，张景中(2000)提出了“智能知识平台”的概念：“在某一知识领域内一定层次上，能够满足人们引用知识、运用知识、传播知识、学习知识和发展知识需求的系统，称为一个智能知识平台”。这里设想的智能知识平台是面向学科领域的，并且是分层次的。在进一步研究的基础上，提出了智能知识平台的结构(张景中，2005)，如图
