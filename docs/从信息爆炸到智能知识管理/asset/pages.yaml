    # 6.4 智能知识管理系统的软件架构及组件划分


    智能知识管理由于增加了智能变换的理论和方法，不同变换之下其挖掘结论不同，同一数据集也会根据不同目标挖掘出不同的变换策略，因而其软件设计和开发更为复杂。为了提高系统的可维护性和提高开发效率，建议智能知识管理的软件架构及组件划分如图
    6.4 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_145_0.png)


    图 6.4 智能知识管理软件架构及模块组成图


    系统的整个体系结构以 B/S 结构为主，部分功能以 C/S 结构实现。其中挖掘引擎可以单独安装运行，整个系统又可以在 Web 上运行。智能知识管理的软件架构分为五层：


    最底层为系统数据库，由基础数据库和基元库、可拓变换库等组成。基础数据库存放系统的基础数据，如用户数据、基础配置信息等，可采用任意的商业数据库产品或开源数据库产品。基元库存放物元、事元、关系元的基本数据，可拓变换库存放常用的变换方法，如基本变换、共轭变换、叠合变换等。


    构筑在基础数据库之上的是基础构件，包括：网络安全构件、原子服务构件、系统维护构件、基元管理组件、可拓变换组件、关联函数计算器等。其中基元管理组'
  merge: -1
  img_proc: true
- pgno: 146
  md: '件提供基元到基元库的存取、增删、更新等，可拓变换组件实现变换与基元的匹配、修剪、推理、策略管理等，关联函数计算器用于计算事物量变、质变的区间，计算关联函数的数值等。


    在基础构件之上，可以高效开发各应用组件。常用的应用组件包括智能分类函数、智能聚类函数、关联规则挖掘组件、变换策略评价方法库组件等。数据挖掘过程所需的数据清洗、数据转换等一般功能也开发成组件工具包，供各种挖掘程序调用。


    次上层是应用配置层。系统管理员可调用应用组件配置成智能知识管理软件产品。如调用数据清洗器、数据转换器、分类函数和评价方法库可以装配成可拓分类软件的主体框架，进一步增加一些代码并进行充分测试后可拓分类软件就可使用了。这里需要注意的是，应用组件不一定完全符合具体软件的要求，如果在软件配置过程中对应用组件做了修改，应该及时修订版本号，连同技术说明一起存入应用组件库，供后续开发使用。


    最上层是用户界面层，支持单机运行和 Web 上运行。系统主界面是一个门户网站，用户在网站上可以完成注册、缴费、个性化网页定制等功能，可浏览介绍资料，在线学习智能知识管理系统的使用，在线试用测试版或下载单机运行的测试版安装程序，参与论坛讨论，交流使用经验等。


    # 6.5 智能知识管理系统的功能概要设计


    根据前面的需求分析，智能知识管理平台系统 IKMS 的功能主要包括：选取商业目标，数据集分析，数据抽取、转换、装载，规则生成，变换知识生成，知识的审计、存储、智能化利用、更新、删除等。


    +   1. 数据、规则预处理层


    数据、规则预处理模块从数据库、数据仓库、数据文件中读入数据，或读入原始规则到规则库，然后进行清洗、转换等预处理，最后装载成为可供挖掘的标准数据文件。该模块具备从多种业务数据源中抽取数据的能力，支持多种数据源并且支持网络连接，支持数据清洗，支持高速的数据采集及定时采集，为进一步的分析挖掘提供高质量的数据来源。数据可采用各种文件格式存放，可以根据分类和录入时间设立目录存放，系统应能识别各种文件格式的文档，包括
    txt、Excel、Access 数据库 mdb 文件等，可以在通过系统调用显示和编辑，但不同权限的使用者具有不同的编辑功能权限。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 2. 智能知识挖掘层


    实现智能知识的挖掘，并存入智能知识库。将数据挖掘与智能变换相结合，实现挖掘过程中的交互式、探索性数据分析，可混合选择挖掘算法，实现多个挖掘功能的交互，并提供开放的接口便于算法的维护。提供友好的可视化操作界面，以多种可视化方法来分析数据和描述挖掘结果，辅助用户监测挖掘过程并与之交互。通过基元库的维护，能满足不同应用领域的需求。


    # 3. 智能知识管理平台层


    对智能知识进行评估、审计、存储、推理、更新、删除等操作，并提供与运营管理系统和业务处理系统的接口。知识库管理主要功能是建立统一的智能知识库，提供方便快捷的检索方式。知识库管理的内容包括基元库管理、智能策略库管理、案例库管理等，以及提供在系统中的以附件形式添加到系统中的各种文档的统一归档和管理，并提供模版对知识库的内容进行方便的管理。系统应建立起统一共享、内容丰富的客户资料库和企业知识库，并以此为基础实现对客户的市场营销、销售和客户服务工作的科学化、创新性决策支持。


    知识库面向所有使用者，但设立级别权限。提供方便的检索、知识库中信息的分类。同时使用者可以定制个性化的知识库管理页面。平台实现的最终目标是为用户提供一个良好的数据分析和挖掘环境，可以在网上得到所需的帮助信息，并完成大部分分析功能。


    # 4. 模块功能列表


    各模块的功能分析如表 6.1 所示。


    # 表 6.1 智能知识管理系统软件功能模块一览表


    | 主功能 | 子模块 | 功能概述 | 备注 |

    |---|---|---|---|

