- pgno: 105
  md: '(1) 设已知训练集 \( T=\{(x_1, y_1), \cdots, (x_l, y_l)\} \in (X \times Y)^l \), 其中
    \( x_i \in X = R^n \), \( y_i \in Y = \{1, -1\} \), \( i=1, \cdots, l \) ;


    (2) 构造并求解最优化问题


    \(\min_{\alpha} \frac{1}{2} \sum_{i=1}^l \sum_{j=1}^l y_i y_j \alpha_i \alpha_j
    (x_i \cdot x_j) - \sum_{j=1}^l \alpha_j\)


    s. t. \(\sum_{i=1}^l y_i \alpha_i = 0\)


    \( 0 \leqslant \alpha_i \leqslant C, \quad i = 1, \cdots, l \)


    得到最优解 \( \alpha^* = (\alpha_1^*, \cdots, \alpha_l^*)^T \) ;


    (3) 计算 \( w^* = \sum_{i=1}^l \alpha_i^* y_i x_i \). 再选择 \( a^* \) 的一个分量 \( 0 <
    a_j^* < C \), 据此计算 \( b^* = y_j - \sum_{i=1}^l \alpha_i^* y_i (x_i \cdot x_j)
    \) ;


    (4) 构造分化超平面 \( (w^* \cdot x) + b^* = 0 \), 由此求的决策函数 \( f(x) = \text{sgn}(g(x))
    \), 其中 \( g(x) = (w^* \cdot x) + b^* = \sum_{i=1}^l \alpha_i^* y_i (x \cdot x_i)
    + b^* \) ;


    (5) 对所有满足 \( f(x_i) \leqslant 0 \) 的点 \( \{x_i | y_i = 1\} \), 计算他们到超平面的距离 \(
    d_i = \frac{|f(x_i)|}{\|w\|} \), 取 \( d_j = \max_{\{i | y_i = 1\}} d_i \) ; 对所有满足
    \( f(x_i) \geqslant 0 \) 的点 \( \{x_i | y_i = -1\} \) 计算他们到超平面的距离 \( d_i = \frac{|f(x_i)|}{\|w\|}
    \), 取 \( d_k = \max_{\{i | y_i = 1\}} d_i \) ;


    (6) 分别设定区间 \( [a, b] \) 和 \( [\overline{a}, \overline{b}] \) 如下:


    \(\overline{a} = - \frac{1}{\|w^*\|} = - \frac{1}{\sum_{i=1}^l \alpha_i^* y_i
    x_i}\)


    \(\overline{b} = \frac{1}{\|w^*\|} = \frac{1}{\sum_{i=1}^l \alpha_i^* y_i x_i}\)


    \(\overline{a} = -d_j\)


    \(\overline{b} = d_k\)


    (7) 取量变区间 \( X_0 = [a, b] \) 和质变区间 \( X = [c, d] \) 如下:


    \( a = \min\{ \overline{a}, a \} \quad b = \min\{ \overline{b}, b \} \)


    \( c = \max\{ \underline{a}, \overline{a} \} \quad d = \max\{ \underline{b}, \overline{b}
    \} \)'
