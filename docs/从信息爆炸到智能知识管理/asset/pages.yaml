  md: '# 第 1 章 绪 论


    # 1.1 信息时代背景下的知识管理和数据挖掘


    早在 1965 年，著名管理学家德鲁克就提及，“知识”将与机器设备、资金、原材料或劳工等一样，成为企业关键的生产要素之一，而“知识型工作者”将取代传统的劳动工人，为企业创造更多的效益。斯坦福大学经济学家
    Paul Romer 认为：“知识，是世界上唯一无限的资源，而且是会随着使用而成长的资产。”随着世界经济结构日趋全球化，以知识为基础的经济体系正在世界范围内形成。知识经济是相对于工业经济而言的，它是建立在知识和信息的生产、分配和应用基础之上的新型经济（成思危，2001）。知识经济时代，信息、知识正成为日益重要的资源。


    随着知识对社会、经济的推动作用日益增强，各种高新技术与知识密集型产业的产品、服务中的知识含量逐渐提升，知识的重要性日益突出（王众托，2004），知识在新经济中的地位正如资本在工业经济时代以及土地在农业经济时代的地位（Drucker，1998；Quinn，1992）。对知识的获取、创造及应用成为促进经济增长、发展公司核心竞争力的关键性因素（Emin，2000；Grant，1996；Spender，1994；Kought
    et al，1992）。因此，如何创造、存储、传播与运用知识这项战略性资源成为学者和企业致力研究的问题，1986 年在联合国国际劳工大会上，瑞典的斯威比（Sveiby）博士首次提出知识管理（knowledge
    management，KM）概念（Thomas，1999；Sveiby，1997），他也由此被业界誉为“知识管理之父”。从广义上看，知识管理指的是对企业（或组织）内所有与知识有关的活动、业务、计划及政策的系统的管理。


    进入 21 世纪以来，知识管理已经成为企业管理所必须关注的重要课题。知识管理涉及对信息、知识进行收集、整理、储存、加工、促进新知识的产生、隐性和显性知识的相互转化以及知识资产的形成和经营等环节（Mertins，2004）。从企业的角度来看，知识来源于实践，来源于人们对企业内外经营环境的了解，以及在长期的经营活动中积累起来的经验。知识又是大量数据和信息的提炼和结晶。这些知识对于企业的运营和竞争无疑有重要的作用。任何企业都必须认真考虑对自己知识资源的创造和运用，考虑如何在企业经营模式中融入知识管理，考虑知识管理在企业的核心竞争战略中的地位。'
