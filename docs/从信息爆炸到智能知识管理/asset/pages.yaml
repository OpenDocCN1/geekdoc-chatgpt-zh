    第一，自然科学的飞速发展产生了一系列新学科，20 世纪 50 年代以来，知识急速增长，无论是知识的广度还是深度，都远远超过了历史上任何时期。人类活动范围的扩展，增加了对知识的需求，也促进了新知识的产生。据计算，全世界的知识总量，平均
    7～10 年翻一番。


    第二，随着信息技术的迅速发展，管理信息系统、互联网、富媒体等正在不断改变人类社会的环境。互联网资源中、企业公开报表中、社会各组织的公共数据“库中，各类媒体中，充斥着大量的知识和信息。管理信息系统使管理的广度和深度都得到提高的同时，积累了大量的数据，数据挖掘技术应运而生。数据挖掘（data
