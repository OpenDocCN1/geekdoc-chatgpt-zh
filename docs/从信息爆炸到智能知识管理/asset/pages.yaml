    \( u \in U \),在 \( c_{o1} \) 至 \( c_{o4} \) 的量值域 \( V(c_{o1}) \) 至 \( V(c_{o4})
    \) 上分别建立关联函数 \( k_1(x_1), k_2(x_2), k_3(x_3), k_4(x_4) \), \( x_1 \in V(c_{o1}),
    x_2 \in V(c_{o2}), x_3 \in V(c_{o3}), x_4 \in V(c_{o4}) \)。在物元集


