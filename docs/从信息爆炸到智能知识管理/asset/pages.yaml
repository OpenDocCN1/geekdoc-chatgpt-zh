    \ <x₁ 年, x₂ 年> ]\n```\n\n+   4) 用复合元表示复杂信息\n\n很多信息都是复杂信息，既包含陈述型信息，又包含行为型信息，还可能包含关系型信息，此时就要用复合元来形式化表达。\n\
    \n例如，“2006 年 9 月企业 E 成功研制出一种新型抗癌药物 D”，是一条复杂信息，可用复合元表示为\n\n```\nA₁ = [ 研制， 支配对象，\
