    # 2.2.2 数据挖掘算法


    目前,大部分数据挖掘领域的所从事的研究主要集中在算法、技术实现层面(Peng,2007 ; Chen et al,1996),如关联规则( Agrawal,1993)
    ,分类( Cheeseman et al,1996) ,聚类( Kaufman et al,1990)等算法,方法上有决策树(陈文伟等,2004 ; Quinlan,1986)
    ,多目标线性规划(MCLP)方法( Shi,2005,2002 ; Kou et al,2003) ;支持向量机( SVM)方法(邓乃扬等,2004) ,高性能、分布式挖掘算法(
    Liu et al,2005a,2005b,2004) ;容忍脏数据的算法,检测数据质量、定位错误数据、数据推荐等增加数据质量的算法( Zhu et al,2004)等。Perols
    等(2009)将多种分类算法得到的分类结果进行融合,形成信息集市投票的集成分类方法以提高分类准确率。


    很多研究者将智能体(intelligent agent)技术引入数据挖掘,改进算法性能等'
