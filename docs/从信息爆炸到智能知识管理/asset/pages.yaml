    其中，某些槽值可缺省。


    框架是一类事物的完整描述。事物之间匹配只能是部分相同槽的匹配。


    # 4. R-FOL 方法


    潘旭伟(2005)将模型中已定义的信息和识别获取的事实信息转化为一阶谓词的三元组形式，将模型定义的关系和约束转化为推理规则，并结合用户自定义规则，通过演绎推理寻求模型中各要素间存在的关系，从而推理获取更多的所需信息，如图
    5.4 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_134_0.png)


    图 5.4 R-FOL 推理方法的流程


    实现 R-FOL 方法主要包括是模型信息和事实信息向一阶谓词的转化、规则库的建立和推理引擎的实现。R-FOL 方法中的智能推理引擎通过对数据驱动推理、目标驱动推理及综合推理等方法的支持，实现智能推理。数据驱动的推理方法，选取条件部分被规则库所满足的规则，触发该规则，并将新的事实增加到规则库中，重复上述过程直到问题解决。目标驱动的推理方法，先确定一真值待定的表'
