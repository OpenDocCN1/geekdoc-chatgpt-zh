  md: '组织一家独立调查机构 Conference Board 公司和美国管理协会最近调查显示：72%的欧洲公司在进行某种知识管理活动，近 80%的跨国公司在实施知识管理（Allee,
    2000）。参加 2001 年达沃斯“世界经济论坛”的 CEO 有 95%认为知识管理是组织成功的关键因素（Bontis, 2002）。从战略管理的角度，知识管理是提升组织竞争优势的最后战略（De
    Tienne et al, 2001）。


    1995 年在加拿大召开了第一届知识发现和数据挖掘国际学术会议，会上把数据库中的“数据”形象地比喻成矿藏，“数据挖掘”一词很快流传开来。数据挖掘（data
    mining）是从大量的数据中，提取隐含在其中的、人们事先不知道的、但又是潜在有用的信息和知识的过程。通过数据挖掘可以更好地理解客户行为、提高服务水平、增加商业机会（Chen
    et al, 1996）数据挖掘以一种更自动化的方式对具有大量数据的商业活动进行分析和探索，改变了过去需要由行业专家和统计专家来提取有价值的知识的单一局面。


    近年来，数据挖掘在生物、金融、保险、零售等行业已得到较为广泛的应用（Olson et al, 2007；Han, 2006；Chen et al, 2005；Larry,
    2004），成为后信息化时代获取知识的关键技术。发达国家的数据挖掘技术已经成功应用到多个领域，我国的数据挖掘技术市场正在悄然形成，数据挖掘将引领社会由数据爆炸进入信息爆炸（information
    overload）（Shi, 2000），并即将进入知识过载（knowledge overload）（Shi et al, 2007）时代。知识管理和数据挖掘在提升国家竞争力方面的作用日益突出（石勇等,
    2005），世界各国都在积极开展数据挖掘、知识管理相关的科学研究及实践应用项目。


    # 1.2 知识管理和数据挖掘在应用中遇到的问题


    几乎所有的管理专家都已经意识到在组织中进行有效的知识管理势在必行，越来越多的组织开始实施知识管理。但大多数的知识管理项目的实施并不顺利。世界著名的产业分析机构
    IDC 报导，开始实施的知识管理项目中 80% 以上都没有达到预期的效果（IDC 网站：http://www.idc.com）。知识管理正成为一种高风险的投资。


    +   通过大量案例分析，失败的知识管理项目中存在着两大问题：

    +   （1）分享不足导致知识缺乏；

    +   （2）获取知识过多导致知识过载，难以有效利用。


    在知识管理项目中，缺乏时间分享和整理知识是知识管理最大的障碍。另外，知识分享的主要途径——知识转移的效率低下。知识转移可发生在个人间、个人与群体间、群体之间，以及群体与组织之间等（Alavi
    et al, 2001）。也可以经由社会化、教育以及在学习活动中被转移。'
