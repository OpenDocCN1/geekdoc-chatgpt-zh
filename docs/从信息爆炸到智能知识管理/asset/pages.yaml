- pgno: 64
  md: '如何识别知识的有效性，提高智能程度？目前专家的做法是建立智能的知识管理系统，当知识数量剧增时，该方案将不能胜任，随着有用知识不断积累，越来越多的知识之间也会产生冲突等，因此必须对有用的知识进行智能化处理，使知识自身具备智能性。


    # 3.1.3 智能知识的定义及分析


    根据前面的分析，结合文献(Li et al, 2009; Shi et al, 2007)，给出如下定义：


    # 定义 3.6 智能知识(intelligent knowledge, IK)。


    智能知识是指通过数据挖掘技术得到的，通过人机交互的处理后具有记忆、识别、自我更新和消亡等智能特征的有价值的知识。其定位如图 3.2 所示。


    ![](img/5ca02fe6dafc13fdc40bf6907227ca5c_64_0.png)


    # 图 3.2 智能知识的定位图


    从集合角度，以 Kn 为所有知识的集合，PKn 是原始知识的集合，UKn 是有用知识的集合，IKn 是智能知识的集合，从上图可以看出以下命题成立：


    Proposition 1 Kn ⊃ PKn ⊃ UKn ⊃ IKn


    ⊃表示包含。过载知识的集合可表示为


    Proposition 2 Kn\IKn=Kn\PKn ∪ PKn\UKn ∪ UKn\IKn


    在前述定义的基础上，对人的经验知识、原始知识、有用知识和智能知识做进一步的对比，如表 3.1 所示。


    表 3.1 智能知识和人的经验知识、原始知识、有用知识的对比


    | 类别 | 来源 | 积累周期 | 数量 | 质量 | 智能性 |

    |---|---|---|---|---|---|

    | 人的经验知识 | 人类的实践经验总结 | 长 | 少 | 高 | 高 |

    | 原始知识 | 数据和信息的挖掘 | 短 | 多 | 低 | 差 |

    | 有用知识 | 原始知识的审计、筛选 | 短 | 少 | 较高 | 差 |

    | 智能知识 | 有用知识的智能化处理 | 较长 | 少 | 高 | 较高 |'
