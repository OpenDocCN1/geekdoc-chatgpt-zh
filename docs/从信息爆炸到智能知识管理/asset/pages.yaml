    数据挖掘得到的知识主要表示为以下几种：关联规则、分类规则（包括决策树、网络权值、判别方程、概率图等）、聚类、公式和案例等。关联规则（association
    rules）是最常用的一种方法，它挖掘记录与属性间的关联性，发现记录之间的关联关系和相关关系，并将这些关系表示为规则形式。一个典型例子就是“啤酒和尿布的故事”。数据挖掘人员通过对超市销售交易数据的分析，发现啤酒和尿布同时购买的比例非常高。经进一步的调查发现，原来是有孩子的父亲在给刚出生不久的子女购买尿布时，也常会给自己购买啤酒。根据以上信息，超市人员便及时调整了物品的摆放结构，让客户的购买更加方便，从而提高了啤酒的销售量。


    知识主要有两个来源：一是从人类社会实践的经验获得，二是从数据或信息资料中挖掘获取。通过数据挖掘获取的知识特别是决策树分类规则知识的数量可能非常庞大，但并非所有的知识都可以很好地被应用，其中有一些是粗糙的知'
