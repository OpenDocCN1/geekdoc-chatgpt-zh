    # [第四章 信号和噪声](../Text/contents.xhtml#e_8)


    “锲而不舍方能强大。”


    我高年级时参加了贝尔实验室在得克萨斯大学奥斯汀分校的面试，并拿到了录取通知书。如果我为他们工作，他们会帮我交攻读硕士学位的学费。同时，我申请了得克萨斯大学的商学院，他们愿意为我提供全额奖学金。我还收到了贝尔通信研究所（Bellcore，1984年从贝尔实验室分拆出来，为分拆后的地方贝尔运营公司统一提供研究开发的服务）和一家石油公司的录取通知书。贝尔实验室这个公司名字略带自夸，但其作为多项基础科技突破性发明的诞生地，决定了电子通信领域的发展。


    自1937年以来，贝尔实验室的科学家们已经获得8次诺贝尔奖，获奖项目包括晶体管和激光器的发明、克劳德·香农（Claude Shannon）创建的通信理论，以及关于信息和噪声的数学概念。20世纪70年代后期，贝尔实验室开发了编程语言C语言。这种语言是我编程的主要支柱，也是Unix操作系统的支柱。Unix操作系统不仅可用在苹果公司Mac计算机的运行上，还可用于许多大大小小的系统（后来，C语言发展成为更为先进的版本，也就是我们今天使用的C++语言）。经过一番考虑，我接受了贝尔实验室的工作，同时攻读1988—1989学年的得克萨斯大学计算机科学硕士学位。'
  fmt: '

    我在纽约最初的几个月，都不敢去离玄武石旅馆远一点的地方。那时是夏天，我没有去学校上学，所以也没有太多的机会学英语。到了秋季，父母把我送到附近的一所公立学校就读。我在俄罗斯上四年级，但在美国可以上六年级。相比同期美国的其他学校，明斯克的学校教的数学要难得多，但美国的学校教会我很多其他方面的东西。我学英语的速度非常快，我用字典查不认识的单词，就这样完成了家庭作业。


    我在曼哈顿的学校学习几周后，全家搬到了皇后区的阿斯托里亚（Astoria）。那里的学校教学环境不太好。那是一个糟糕的社区，情况有时糟糕到令人发指。


    不出一年，父亲在里士满交响乐团（Richmond Symphony）找到一个稳定的职位，我们又向南迁移到弗吉尼亚州。父亲因为这些年一直在教学，所以熟知很多交响乐的演奏。从某种意义上讲，里士满给我带来了重大的改变，如同初到纽约对我的改变一样。这次，我们住到了郊区。两年以后，我们再次搬家，这一次搬到了堪萨斯州的威奇托。


    对纽约人来说，威奇托就是像《荒野镖客》（Gunsmoke）里描述的地方，不过这个城市确实有很悠久的文化历史和很好的交响乐团。这里的生活成本也比在纽约时低了许多，父亲找到了工作，只是赚得不够多。


    父母从未抱怨过，他们对新生活心存感恩、感到满足。当然，这并不是说我能舒舒服服地过日子，在那些艰难的岁月里，我学会了很多谋生的本领。尽管我的父母竭尽所能地保护我，但他们并不溺爱我。父亲鼓励我找工作，于是我开始寻找工作机会。13岁那年，我找到了一份工作：为一家有几千本藏书和杂志的私人图书馆建卡片目录，每建一张索引卡片，我就可以赚10美分。


    那之后的几年，我找过很多工作。有一年夏天，我在威奇托的一家牛排餐厅当洗碗工。在20世纪90年代，厨房里的温度非常高，地板上覆盖了一层薄薄的油脂，非常滑，所以我在工作的时候，需要从一个地方像“溜冰”一样滑行到另一个地方。我通过这份洗碗工作每小时可以赚3.35美元。这种工作既无聊又低薪，但是它训练了我的毅力，以及忍受单调乏味但必须完成任务的意志力。后来我辞掉这份工作，为了多赚一点工资，我去了街对面的一家面包店。我每天一早必须做好饼干和三明治，每小时可以赚3.45美元。


    在威奇托，我学会了很多东西，但是最重要的是学会了计算机编程。我所在的中学当时有屈指可数的几台苹果IIe计算机，我立刻沉迷其中，我对键盘爱不释手，无法自拔。我的编程入门语言是Logo语言，它是在20世纪60年代针对学龄儿童教育被研发的。黑客们可以天真地回想起孩童时代那只在Logo语言下输入指令的机器小海龟（后来屏幕上的海龟形状光标）。这是一种全方位的程序语言，它提供了比预装的应用软件更多的拓展空间，可以让孩子们充分感受计算机的魅力。


    在高中时，我得到一份工作——在一个残障人士营地活动中教Logo语言。第一天，由于老师没有来，我被迫自己管理班级。这是一次难忘的经历。因为残障，许多学生身体活动能力有限，但计算机端口可以让他们淋漓尽致地表现自我。当时，我从他们身上和自己身上领悟到很多。我意识到，只要给予机会和合适的工具，人们会变得更聪明和更有能力。同时，我也看到，当面对环境压力时，我可以处理任何状况。即使老师最后没有出现，即使我没有接受过正规训练，我也可以胜任教学工作，并完成各种需要的工作。


    接下来，我自学了一种更有用的程序语言：BASIC。有一天，当地医院的一位内科医生来到我所在的中学，询问谁会编程。学校指定了我和另一个爱好计算机的朋友——一位来自德国的小伙伴。那时，我俩都熟练地掌握了BASIC语言，所以医生雇用我们为抗生素用药剂量编写程序。虽然有这位医生监督管理着我们，但每次用药剂量的程序毕竟还是由15岁的孩子开发的BASIC语言而设计的，搞不好我们可能误杀上百个人。不过，我们开发的程序成功了！从中，我又学到另外的关键一课：年龄从来都不会限制一个人，真正能限制你的，只有你拥有的能力和你有多坚持。


    我17岁时，全家搬往休斯敦。我们喜欢得克萨斯州的生活。父亲再一次鼓励我找工作，指导我通过当地报纸上登载的分类招聘信息寻找工作。我由此发现了一则计算机视频游戏编程工作的广告，薪酬是每小时20美元，我感到一个十几岁少年的幸运时刻再一次降临。我马上跳进汽车（刚刚学会开），紧张地穿过交通混乱的休斯敦，冲到公司的办公室。我见到了公司的总裁，他很简短地说明了编程的工作要求：“你的任务就是：我们给你一个游戏名字，你给我们写出一个视频游戏。怎么样？”


    “完全可以，”我回答，“肯定没问题！”


    他抛出的游戏名字让我感觉很有趣：《死亡山谷侦察队》（Death Valley Patrol）、《口哨声声》（Sound the Whistle）、《幽灵出没》（Ghost
    Hunt）、《约瑞克的复仇》（Yorick''s Revenge）。这些游戏准备在当时新出现的苹果Commodore 64家用计算机运行，于是我打破存钱罐（实际上，我真的有一个）买了一台计算机，开始编程。苹果Commodore
    64计算机在20世纪80年代非常流行，尤其是对游戏开发者和游戏玩家而言。当时使用的语言就是BASIC，但是需要速度。这些游戏在今天看来很简单。我们现在还能在YouTube视频网站上找到它们。我通常会放入一些有趣的或者恐怖的元素，比如秃鹰从天而降吞噬失败的游戏玩家等。公司当时很喜欢这些游戏，很快就有人请我编写视频游戏设计方面的图书，让我解释这些代码和我设计的这些游戏背后的思考过程。后来，虽然这些书卖得一般，但是我的5个游戏都成功上市了。


    ![](Images/cut_61_0316_m.jpg)


    作为一名十几岁的休斯敦少年，我当时完全没有意识到，无意间被卷入电子游戏行业，居然促成我探索计算机模拟，并接触这个未来会变得更强大的技术。尽管在编程的早期，比方说，当我在做《死亡山谷侦察队》时，我就在建立一种镜像世界，或者说模拟镜像世界。用今天的标准来看，我当时使用的编程工具太简陋了，计算机的处理器和内存也严重不足。但是在每一个游戏里，我们都创造了新的世界，或者说，模拟了一个新的世界。


    在海量数据和更快更强的计算机的驱动下，计算机模拟以一种不可思议的方式快速发展着，并且作为科技领域应用的重要工具在很多方面发挥着作用：医药、自动驾驶、可以飞入遥远星球的太空船、视频游戏和电影等相关的各种娱乐领域，还有模拟飞行训练系统等。在世坤投资，它帮助阿尔法经受了严格的回测，用海量市场数据模拟过去。计算机模拟和大数据使得我们可以处理以前无法突破的、由海量数据导致的复杂系统。


    为什么亚当·斯密所说的市场上的“手”是“看不见的”？因为就像市场这样一个复杂的系统，至少它的某一部分是自组织的。也就是说，尽管市场表面看起来是随机性的，实际上，某些部分会受一些原则的控制，某些部分会受深层模式化的影响。亚当·斯密和他的继承者们因为不擅长数学或计算，无法探究哪怕最简单的市场的复杂性，所以这只“手”依然是“看不见”的，进而，这只“手”在很大程度上也是不可预测的。


    “复杂”（complex）这个词不仅仅意味着“难懂”（complicatied）。在科学意义上，一个复杂的系统包含许多因素，它们相互作用，但在运行中并不遵循根据所有因素统计出来的平均值。复杂的系统以一种非常规的方式运转，由一大批小规模的“代理人”的相互作用开始，就像交易员推动市场。这些系统会从一种状态转化为另一种状态（“阶梯性的转变”或“机制变化”），而发生时带有突然、没有预兆、随机的特性。这些变化令人费解，看起来就像任性的神灵们的肆意妄为。然而，这些特性标志着所有复杂的系统具有“自然的”特征，这些系统就像地震、人口激增或者生物灭绝、气候变化、火山爆发、市场或经济的繁荣与衰退所表现出来的一样，让人难以捉摸。无论飓风、泥石流，还是类似美国大萧条一样的经济衰退和全球金融危机，都很难被预测。引发这些现象的潜在因素通常错综复杂，尽管能够被解释，但是几乎没有人能够准确地预测它们。


    对于第二次世界大战期间从事建造原子弹的科学家而言，复杂系统的预测难题是难以逾越的阻碍。“曼哈顿计划”[^(\[1\])](#chapter6.xhtml#comment_2609)（Manhattan
    Project）的最终成功，部分可归功于电子计算机的发展。虽然用今天的眼光看，当时计算机的计算水平还很初级，但它们已经能够完成大量的运算。当然，除了新工具，人类智慧才是实现突破必不可少的保障。


    在很大程度上，这些智慧是由数学家约翰·冯·诺依曼（John von Neumann）提供的。他在20世纪30年代初期离开匈牙利，到普林斯顿大学新成立的高等研究院（Institute
    for Advanced Study，IAS）任教。阿尔伯特·爱因斯坦（Albert Einstein）几乎与他同时到达高等研究院。几年以后，随着纳粹德国接管奥地利，库尔特·哥德尔也加入进来。冯·诺依曼是那个时代的博学家，在由哥德尔证明的数学算法的矛盾所引发的争论达到白热化的时候，他为平息这场争论做出了突出贡献。此外，他的贡献还体现在量子物理、博弈论、数字计算机体系结构、实用型核武器等方面，也体现在他临终前还在致力研究的自复制自动机（self-reproducing
    automata）理论。


    随着第二次世界大战的到来，冯·诺依曼被抽调到政府组织的一些军事研发项目上。其中一个就是“曼哈顿计划”，这是一个秘密的原子弹研究计划，在新墨西哥州（New Mexico）洛斯阿拉莫斯（Los
    Alamos）一片沙漠中进行。冯·诺依曼解决了物理过程的预测问题，这一问题已经困扰17世纪法国数学家、哲学家、发明家布莱士·帕斯卡（Blaise Pascal，他发明并制作了许多早期的机械计算器）及以后的许多数学家们很久了。他解决了流体力学、湍流，甚至混沌、液体流动的计算问题，比如奔流而下的山间小溪。冯·诺依曼用了非常数学化的方法解决问题：首先，他找出问题的特征，推演出新的方法来解决这一问题（运用数字模拟）；然后，再建立一套计算机软硬件的理论体系，包括需要完成模拟的硬件和需要运行硬件的软件（那时还没有“软件”这个说法）。


    液体的行为就像其他复杂系统一样，它拒绝非线性方程来描绘其特征或预测其如何随着时间的推移而运动。第二次世界大战早期，冯·诺依曼已经成为聚能装药（shaped
    charges）方面的计算专家，知道如何算出火箭炮炮弹外形的最大效能，以更好地消灭德式装甲坦克。在“曼哈顿计划”中，他支持所谓的内爆法引爆核武器，其中爆炸冲击波将钚核压缩到临界状态。问题是如何“成型”（shaping），如何达成有效压缩，引导炮弹形成快速连锁爆炸：实现控制和集中爆炸。


    冯·诺依曼的方法就是模拟爆炸冲击波，将其分解成数以万计的微小的数据包，并在刚刚被运送到洛斯阿拉莫斯的IBM计算机上运行这些数据包。科学家们将每一个数据包的规则进行编程。这些规则描述了炸弹对当地障碍物和邻近障碍物会做出什么反应，这也是一种算法。但这种算法要求计算机内存储有海量数据以供计算机计算，然后计算机会算出每一微小数据包所需的微小的时间碎片。这些结果会反馈到计算机，并由计算机生成集合波（collective
    wave）的模拟结果。就如理查德·罗兹（Richard Rhodes）在其历史学著作《黑太阳》（Dark Sun）中关于氢弹研发的描写，结果是“像在挤满人的舞厅里的频闪闪光灯下捕捉舞者的连续定位一样”不容易。其中唯一的关键要素就是快，这项工作要求数以百万计的打孔卡和大量的数据供给机器夜以继日地工作。结果虽然是相对粗糙的，但是已经可以使冯·诺依曼设计出炸弹“芯”周围的炸药“透镜”（lenses），从而解决制造实用型核武器上的一个关键问题。


    计算机模拟对数据的需求可以用近乎贪婪来形容。反过来，它也会产出大量的新数据。模拟复杂系统需要一个能够不断扩展的数据源。管理这些不断变大的数据集的需求，反过来又不断催生更精密的模拟技术。正是这种相互关系推动了计算机的发展。


    身材矮胖、口若悬河的冯·诺依曼就站在计算机发展前沿。他在洛斯阿拉莫斯使用了一台模拟IBM计算机，这本质上就是一台大型计算器。缓慢的计算速度激发他重新思考应该怎样制造计算机。历史给了他再一次实践想法的机会。第二次世界大战结束后，制造氢弹被称为超级工程（Super
    project），顺理成章成为最高优先级项目。在冯·诺依曼的匈牙利裔同僚爱德华·泰勒（Edward Teller）的领导下，这个超级工程采用强大且精密的内爆机制。其中，裂变装置作为引爆触发器，生成的远不只有冲击波，还有海量的电磁辐射放射物，后者将炸弹的重氢内核压缩到一定程度，从而引起极大规模的聚变反应。


    除了其他各方面问题的考虑，完成氢弹项目还需要更复杂的运算去理解中子爆炸以及通过裂变爆炸所产生的高温。1944年，在火车站的站台上，冯·诺依曼和一位工程师展开了交谈。这位工程师当时刚刚帮助宾夕法尼亚大学建成一台计算机。在这台计算机上，工程师采用真空管代替了IBM的齿轮和继电器。这台计算机是工程师埃克特（Eckert）和约翰·W.
    莫克利（John W. Mauchly）一起发明的，被称作“ENIAC”，也就是“电子数字积分计算机”（electronic numerical integrator
    and computer）。它在1945年12月和1946年1月的超级炸弹服务中进行了第一次运算，计算出百万级的中子弹道的运算速度远超洛斯阿拉莫斯的IBM计算机的运算速度。


    很快，冯·诺依曼在他的105页的论文中阐述了存储程序计算机（stored-program computer）这一概念。在这一装置里，指令和数据可以用程序写进电子存储器内，替代物理的插管、继电器、电缆等（很像一架老式电话交换机）；每一次程序的变化可以调取存储的指令和数据。冯·诺依曼在普林斯顿的高等研究院继续按照他的想法制造数字计算机——MANIAC（数学分析器、数字积分器和自动计算机），它一度成为20世纪50年代世界上运算速度最快的计算机。MANIAC是第一个存储程序计算机，而冯·诺依曼式结构依然是现在随处可见的计算机主流设计。


    在与世无争的、偏理论化的高等研究院，制造热核炸弹并没有受到普遍欢迎。高等研究院负责人、主持整体“曼哈顿计划”的J. 罗伯特·奥本海默（J. Robert Oppenheimer）尽管还在支持MANIAC项目的开发，但也对研制一次比一次威力更大的炸弹深感不安。而且普林斯顿高等研究院以高度抽象化理论举世闻名，计算机项目与之所取得理论成就显得格格不入：应用数学超过了纯理论数学；工程学压倒了理论思考。20世纪50年代后期，当机器开始老化时，研究院全体教师投票决定不再参与这类项目。


    然而，冯·诺依曼对计算机领域所做贡献的深远影响一直延续至今。他设法建造了第一台通用计算机。以破译第二次世界大战期间德国密码著称（电影《模仿游戏》的原型故事）的英国数学家艾伦·图灵（Alan
    Turing），在1936年将图灵机理论化。那时，图灵还只是剑桥大学数学专业的一名学生。1935年，他参加了一个数学基金会的课程，旨在阐明哥德尔也曾经设法解决相同类型的问题。有一天，他跑完步在草地上休息时，忽然想象出一种理论上存在的机器，这种机器可以证明任何交给它的数学论断。这种机器可以处理读写过程——就像一个包含符号标志的纸带，可以充当发送给设备的一系列指令：那就是通用计算机拥有的运算规则。这个机器是通用的，因为它可以模仿当时被图灵称作有标准说明的其他机器。简单来说，相对于机械式手工操作的计算设备，图灵的通用机是可编程、可设计的，所以他带来了软件的概念（但不是用软件这个词来命名的）。1936年，图灵在写出那篇著名的论文——《论可计算数》（On
    Computable Numbers）之后，获得了普林斯顿大学博士学位。冯·诺依曼熟知图灵以及这篇论文，他成功地使图灵关于通用机的想法变成了现实。


    ![](Images/cut_33_45898_m.jpg)


    18岁那年，我需要找到一份工作以支付我在休斯敦大学上学的费用。我也拿到了其他大学的录取通知书，但是休斯敦大学学费比较便宜，况且我的女朋友也选择去那里读书，因此，我便选了这所大学。我应聘了一则当地招聘广告上的工作，工作内容是在一家拥有油气终端的公司进行财务编程。我对会计和油气终端都一窍不通。但令人意外的是，一个月以后，我接到了录用电话。


    这家公司在休斯敦的办公室只有两个人：总裁里克·沃利（Rick Worley）和他的秘书。公司的其他人都在密西西比州（Mississippi）。里克并不介意我的年龄。他搭乘半夜到早上8点的火车，在旅途中通过查看我的学校作业了解我的能力。他从来没有见过任何一个像我这样擅长编程的人。我开始为他兼职工作。我们会爬进他的大奔驰车，开6小时的车到密西西比州的比洛克西（Biloxi）。在那里，我们可以花上几天时间安装软件并培训员工，然后一直看着巨大的气体管道终端被填满。


    我喜欢这份工作，喜欢编程、坐奔驰、享受旅途中的炸薯条和汉堡，以及和里克一起纵谈人生。里克是一个纯正的得克萨斯州人，他想给我提供一份全职工作的机会，但是我拒绝了。大学一年级之后，我从休斯敦大学转到得克萨斯大学奥斯汀分校（University
    of Texas Austin）。那所学校从那时到现在都有一门卓越的学科——计算机科学编程。此后的几年，我学习了计算机科学。我们学习了希尔伯特、哥德尔、图灵、冯·诺依曼的研究，还有很多相关知识。我还一直做兼职工作，从事编程工作或者辅导他人的数学和英语。


    随后，在毕业季，我收到了来自贝尔实验室的工作邀约。


    * * *


    [\[1\]](#chapter6.xhtml#commentRef_2583)第二次世界大战期间，美国陆军自1942年起开发核武器计划的代号。——译者注


    # [第四章 信号和噪声](../Text/contents.xhtml#e_8)


    “锲而不舍方能强大。”


    我高年级时参加了贝尔实验室在得克萨斯大学奥斯汀分校的面试，并拿到了录取通知书。如果我为他们工作，他们会帮我交攻读硕士学位的学费。同时，我申请了得克萨斯大学的商学院，他们愿意为我提供全额奖学金。我还收到了贝尔通信研究所（Bellcore，1984年从贝尔实验室分拆出来，为分拆后的地方贝尔运营公司统一提供研究开发的服务）和一家石油公司的录取通知书。贝尔实验室这个公司名字略带自夸，但其作为多项基础科技突破性发明的诞生地，决定了电子通信领域的发展。


    自1937年以来，贝尔实验室的科学家们已经获得8次诺贝尔奖，获奖项目包括晶体管和激光器的发明、克劳德·香农（Claude Shannon）创建的通信理论，以及关于信息和噪声的数学概念。20世纪70年代后期，贝尔实验室开发了编程语言C语言。这种语言是我编程的主要支柱，也是Unix操作系统的支柱。Unix操作系统不仅可用在苹果公司Mac计算机的运行上，还可用于许多大大小小的系统（后来，C语言发展成为更为先进的版本，也就是我们今天使用的C++语言）。经过一番考虑，我接受了贝尔实验室的工作，同时攻读1988—1989学年的得克萨斯大学计算机科学硕士学位。

    '
  trans: '


    我在纽约最初的几个月，都不敢去离玄武石旅馆远一点的地方。那时是夏天，我没有去学校上学，所以也没有太多的机会学英语。到了秋季，父母把我送到附近的一所公立学校就读。我在俄罗斯上四年级，但在美国可以上六年级。相比同期美国的其他学校，明斯克的学校教的数学要难得多，但美国的学校教会我很多其他方面的东西。我学英语的速度非常快，我用字典查不认识的单词，就这样完成了家庭作业。


    我在曼哈顿的学校学习几周后，全家搬到了皇后区的阿斯托里亚（Astoria）。那里的学校教学环境不太好。那是一个糟糕的社区，情况有时糟糕到令人发指。


    不出一年，父亲在里士满交响乐团（Richmond Symphony）找到一个稳定的职位，我们又向南迁移到弗吉尼亚州。父亲因为这些年一直在教学，所以熟知很多交响乐的演奏。从某种意义上讲，里士满给我带来了重大的改变，如同初到纽约对我的改变一样。这次，我们住到了郊区。两年以后，我们再次搬家，这一次搬到了堪萨斯州的威奇托。


    对纽约人来说，威奇托就是像《荒野镖客》（Gunsmoke）里描述的地方，不过这个城市确实有很悠久的文化历史和很好的交响乐团。这里的生活成本也比在纽约时低了许多，父亲找到了工作，只是赚得不够多。


    父母从未抱怨过，他们对新生活心存感恩、感到满足。当然，这并不是说我能舒舒服服地过日子，在那些艰难的岁月里，我学会了很多谋生的本领。尽管我的父母竭尽所能地保护我，但他们并不溺爱我。父亲鼓励我找工作，于是我开始寻找工作机会。13
    岁那年，我找到了一份工作：为一家有几千本藏书和杂志的私人图书馆建卡片目录，每建一张索引卡片，我就可以赚 10 美分。


    那之后的几年，我找过很多工作。有一年夏天，我在威奇托的一家牛排餐厅当洗碗工。在 20 世纪 90 年代，厨房里的温度非常高，地板上覆盖了一层薄薄的油脂，非常滑，所以我在工作的时候，需要从一个地方像“溜冰”一样滑行到另一个地方。我通过这份洗碗工作每小时可以赚
    3.35 美元。这种工作既无聊又低薪，但是它训练了我的毅力，以及忍受单调乏味但必须完成任务的意志力。后来我辞掉这份工作，为了多赚一点工资，我去了街对面的一家面包店。我每天一早必须做好饼干和三明治，每小时可以赚
    3.45 美元。


    在威奇托，我学会了很多东西，但是最重要的是学会了计算机编程。我所在的中学当时有屈指可数的几台苹果 IIe 计算机，我立刻沉迷其中，我对键盘爱不释手，无法自拔。我的编程入门语言是
    Logo 语言，它是在 20 世纪 60 年代针对学龄儿童教育被研发的。黑客们可以天真地回想起孩童时代那只在 Logo 语言下输入指令的机器小海龟（后来屏幕上的海龟形状光标）。这是一种全方位的程序语言，它提供了比预装的应用软件更多的拓展空间，可以让孩子们充分感受计算机的魅力。


    在高中时，我得到一份工作——在一个残障人士营地活动中教 Logo 语言。第一天，由于老师没有来，我被迫自己管理班级。这是一次难忘的经历。因为残障，许多学生身体活动能力有限，但计算机端口可以让他们淋漓尽致地表现自我。当时，我从他们身上和自己身上领悟到很多。我意识到，只要给予机会和合适的工具，人们会变得更聪明和更有能力。同时，我也看到，当面对环境压力时，我可以处理任何状况。即使老师最后没有出现，即使我没有接受过正规训练，我也可以胜任教学工作，并完成各种需要的工作。


    接下来，我自学了一种更有用的程序语言：BASIC。有一天，当地医院的一位内科医生来到我所在的中学，询问谁会编程。学校指定了我和另一个爱好计算机的朋友——一位来自德国的小伙伴。那时，我俩都熟练地掌握了
    BASIC 语言，所以医生雇用我们为抗生素用药剂量编写程序。虽然有这位医生监督管理着我们，但每次用药剂量的程序毕竟还是由 15 岁的孩子开发的 BASIC
    语言而设计的，搞不好我们可能误杀上百个人。不过，我们开发的程序成功了！从中，我又学到另外的关键一课：年龄从来都不会限制一个人，真正能限制你的，只有你拥有的能力和你有多坚持。


    我 17 岁时，全家搬往休斯敦。我们喜欢得克萨斯州的生活。父亲再一次鼓励我找工作，指导我通过当地报纸上登载的分类招聘信息寻找工作。我由此发现了一则计算机视频游戏编程工作的广告，薪酬是每小时
    20 美元，我感到一个十几岁少年的幸运时刻再一次降临。我马上跳进汽车（刚刚学会开），紧张地穿过交通混乱的休斯敦，冲到公司的办公室。我见到了公司的总裁，他很简短地说明了编程的工作要求：“你的任务就是：我们给你一个游戏名字，你给我们写出一个视频游戏。怎么样？”


    “完全可以，”我回答，“肯定没问题！”


    他抛出的游戏名字让我感觉很有趣：《死亡山谷侦察队》（Death Valley Patrol）、《口哨声声》（Sound the Whistle）、《幽灵出没》（Ghost
    Hunt）、《约瑞克的复仇》（Yorick''s Revenge）。这些游戏准备在当时新出现的苹果 Commodore 64 家用计算机运行，于是我打破存钱罐（实际上，我真的有一个）买了一台计算机，开始编程。苹果
    Commodore 64 计算机在 20 世纪 80 年代非常流行，尤其是对游戏开发者和游戏玩家而言。当时使用的语言就是 BASIC，但是需要速度。这些游戏在今天看来很简单。我们现在还能在
    YouTube 视频网站上找到它们。我通常会放入一些有趣的或者恐怖的元素，比如秃鹰从天而降吞噬失败的游戏玩家等。公司当时很喜欢这些游戏，很快就有人请我编写视频游戏设计方面的图书，让我解释这些代码和我设计的这些游戏背后的思考过程。后来，虽然这些书卖得一般，但是我的
    5 个游戏都成功上市了。


    ![](img/cut_61_0316_m.jpg)


    作为一名十几岁的休斯敦少年，我当时完全没有意识到，无意间被卷入电子游戏行业，居然促成我探索计算机模拟，并接触这个未来会变得更强大的技术。尽管在编程的早期，比方说，当我在做《死亡山谷侦察队》时，我就在建立一种镜像世界，或者说模拟镜像世界。用今天的标准来看，我当时使用的编程工具太简陋了，计算机的处理器和内存也严重不足。但是在每一个游戏里，我们都创造了新的世界，或者说，模拟了一个新的世界。


    在海量数据和更快更强的计算机的驱动下，计算机模拟以一种不可思议的方式快速发展着，并且作为科技领域应用的重要工具在很多方面发挥着作用：医药、自动驾驶、可以飞入遥远星球的太空船、视频游戏和电影等相关的各种娱乐领域，还有模拟飞行训练系统等。在世坤投资，它帮助阿尔法经受了严格的回测，用海量市场数据模拟过去。计算机模拟和大数据使得我们可以处理以前无法突破的、由海量数据导致的复杂系统。


    为什么亚当·斯密所说的市场上的“手”是“看不见的”？因为就像市场这样一个复杂的系统，至少它的某一部分是自组织的。也就是说，尽管市场表面看起来是随机性的，实际上，某些部分会受一些原则的控制，某些部分会受深层模式化的影响。亚当·斯密和他的继承者们因为不擅长数学或计算，无法探究哪怕最简单的市场的复杂性，所以这只“手”依然是“看不见”的，进而，这只“手”在很大程度上也是不可预测的。


    “复杂”（complex）这个词不仅仅意味着“难懂”（complicatied）。在科学意义上，一个复杂的系统包含许多因素，它们相互作用，但在运行中并不遵循根据所有因素统计出来的平均值。复杂的系统以一种非常规的方式运转，由一大批小规模的“代理人”的相互作用开始，就像交易员推动市场。这些系统会从一种状态转化为另一种状态（“阶梯性的转变”或“机制变化”），而发生时带有突然、没有预兆、随机的特性。这些变化令人费解，看起来就像任性的神灵们的肆意妄为。然而，这些特性标志着所有复杂的系统具有“自然的”特征，这些系统就像地震、人口激增或者生物灭绝、气候变化、火山爆发、市场或经济的繁荣与衰退所表现出来的一样，让人难以捉摸。无论飓风、泥石流，还是类似美国大萧条一样的经济衰退和全球金融危机，都很难被预测。引发这些现象的潜在因素通常错综复杂，尽管能够被解释，但是几乎没有人能够准确地预测它们。


    对于第二次世界大战期间从事建造原子弹的科学家而言，复杂系统的预测难题是难以逾越的阻碍。“曼哈顿计划”[^(\[1\])](#chapter6.xhtml#comment_2609)（Manhattan
    Project）的最终成功，部分可归功于电子计算机的发展。虽然用今天的眼光看，当时计算机的计算水平还很初级，但它们已经能够完成大量的运算。当然，除了新工具，人类智慧才是实现突破必不可少的保障。


    在很大程度上，这些智慧是由数学家约翰·冯·诺依曼（John von Neumann）提供的。他在 20 世纪 30 年代初期离开匈牙利，到普林斯顿大学新成立的高等研究院（Institute
    for Advanced Study，IAS）任教。阿尔伯特·爱因斯坦（Albert Einstein）几乎与他同时到达高等研究院。几年以后，随着纳粹德国接管奥地利，库尔特·哥德尔也加入进来。冯·诺依曼是那个时代的博学家，在由哥德尔证明的数学算法的矛盾所引发的争论达到白热化的时候，他为平息这场争论做出了突出贡献。此外，他的贡献还体现在量子物理、博弈论、数字计算机体系结构、实用型核武器等方面，也体现在他临终前还在致力研究的自复制自动机（self-reproducing
    automata）理论。


    随着第二次世界大战的到来，冯·诺依曼被抽调到政府组织的一些军事研发项目上。其中一个就是“曼哈顿计划”，这是一个秘密的原子弹研究计划，在新墨西哥州（New Mexico）洛斯阿拉莫斯（Los
    Alamos）一片沙漠中进行。冯·诺依曼解决了物理过程的预测问题，这一问题已经困扰 17 世纪法国数学家、哲学家、发明家布莱士·帕斯卡（Blaise Pascal，他发明并制作了许多早期的机械计算器）及以后的许多数学家们很久了。他解决了流体力学、湍流，甚至混沌、液体流动的计算问题，比如奔流而下的山间小溪。冯·诺依曼用了非常数学化的方法解决问题：首先，他找出问题的特征，推演出新的方法来解决这一问题（运用数字模拟）；然后，再建立一套计算机软硬件的理论体系，包括需要完成模拟的硬件和需要运行硬件的软件（那时还没有“软件”这个说法）。


    液体的行为就像其他复杂系统一样，它拒绝非线性方程来描绘其特征或预测其如何随着时间的推移而运动。第二次世界大战早期，冯·诺依曼已经成为聚能装药（shaped
    charges）方面的计算专家，知道如何算出火箭炮炮弹外形的最大效能，以更好地消灭德式装甲坦克。在“曼哈顿计划”中，他支持所谓的内爆法引爆核武器，其中爆炸冲击波将钚核压缩到临界状态。问题是如何“成型”（shaping），如何达成有效压缩，引导炮弹形成快速连锁爆炸：实现控制和集中爆炸。


    冯·诺依曼的方法就是模拟爆炸冲击波，将其分解成数以万计的微小的数据包，并在刚刚被运送到洛斯阿拉莫斯的 IBM 计算机上运行这些数据包。科学家们将每一个数据包的规则进行编程。这些规则描述了炸弹对当地障碍物和邻近障碍物会做出什么反应，这也是一种算法。但这种算法要求计算机内存储有海量数据以供计算机计算，然后计算机会算出每一微小数据包所需的微小的时间碎片。这些结果会反馈到计算机，并由计算机生成集合波（collective
    wave）的模拟结果。就如理查德·罗兹（Richard Rhodes）在其历史学著作《黑太阳》（Dark Sun）中关于氢弹研发的描写，结果是“像在挤满人的舞厅里的频闪闪光灯下捕捉舞者的连续定位一样”不容易。其中唯一的关键要素就是快，这项工作要求数以百万计的打孔卡和大量的数据供给机器夜以继日地工作。结果虽然是相对粗糙的，但是已经可以使冯·诺依曼设计出炸弹“芯”周围的炸药“透镜”（lenses），从而解决制造实用型核武器上的一个关键问题。


    计算机模拟对数据的需求可以用近乎贪婪来形容。反过来，它也会产出大量的新数据。模拟复杂系统需要一个能够不断扩展的数据源。管理这些不断变大的数据集的需求，反过来又不断催生更精密的模拟技术。正是这种相互关系推动了计算机的发展。


    身材矮胖、口若悬河的冯·诺依曼就站在计算机发展前沿。他在洛斯阿拉莫斯使用了一台模拟 IBM 计算机，这本质上就是一台大型计算器。缓慢的计算速度激发他重新思考应该怎样制造计算机。历史给了他再一次实践想法的机会。第二次世界大战结束后，制造氢弹被称为超级工程（Super
    project），顺理成章成为最高优先级项目。在冯·诺依曼的匈牙利裔同僚爱德华·泰勒（Edward Teller）的领导下，这个超级工程采用强大且精密的内爆机制。其中，裂变装置作为引爆触发器，生成的远不只有冲击波，还有海量的电磁辐射放射物，后者将炸弹的重氢内核压缩到一定程度，从而引起极大规模的聚变反应。


    除了其他各方面问题的考虑，完成氢弹项目还需要更复杂的运算去理解中子爆炸以及通过裂变爆炸所产生的高温。1944 年，在火车站的站台上，冯·诺依曼和一位工程师展开了交谈。这位工程师当时刚刚帮助宾夕法尼亚大学建成一台计算机。在这台计算机上，工程师采用真空管代替了
    IBM 的齿轮和继电器。这台计算机是工程师埃克特（Eckert）和约翰·W. 莫克利（John W. Mauchly）一起发明的，被称作“ENIAC”，也就是“电子数字积分计算机”（electronic
    numerical integrator and computer）。它在 1945 年 12 月和 1946 年 1 月的超级炸弹服务中进行了第一次运算，计算出百万级的中子弹道的运算速度远超洛斯阿拉莫斯的
    IBM 计算机的运算速度。


    很快，冯·诺依曼在他的 105 页的论文中阐述了存储程序计算机（stored-program computer）这一概念。在这一装置里，指令和数据可以用程序写进电子存储器内，替代物理的插管、继电器、电缆等（很像一架老式电话交换机）；每一次程序的变化可以调取存储的指令和数据。冯·诺依曼在普林斯顿的高等研究院继续按照他的想法制造数字计算机——MANIAC（数学分析器、数字积分器和自动计算机），它一度成为
    20 世纪 50 年代世界上运算速度最快的计算机。MANIAC 是第一个存储程序计算机，而冯·诺依曼式结构依然是现在随处可见的计算机主流设计。


    在与世无争的、偏理论化的高等研究院，制造热核炸弹并没有受到普遍欢迎。高等研究院负责人、主持整体“曼哈顿计划”的 J. 罗伯特·奥本海默（J. Robert
    Oppenheimer）尽管还在支持 MANIAC 项目的开发，但也对研制一次比一次威力更大的炸弹深感不安。而且普林斯顿高等研究院以高度抽象化理论举世闻名，计算机项目与之所取得理论成就显得格格不入：应用数学超过了纯理论数学；工程学压倒了理论思考。20
    世纪 50 年代后期，当机器开始老化时，研究院全体教师投票决定不再参与这类项目。


    然而，冯·诺依曼对计算机领域所做贡献的深远影响一直延续至今。他设法建造了第一台通用计算机。以破译第二次世界大战期间德国密码著称（电影《模仿游戏》的原型故事）的英国数学家艾伦·图灵（Alan
    Turing），在 1936 年将图灵机理论化。那时，图灵还只是剑桥大学数学专业的一名学生。1935 年，他参加了一个数学基金会的课程，旨在阐明哥德尔也曾经设法解决相同类型的问题。有一天，他跑完步在草地上休息时，忽然想象出一种理论上存在的机器，这种机器可以证明任何交给它的数学论断。这种机器可以处理读写过程——就像一个包含符号标志的纸带，可以充当发送给设备的一系列指令：那就是通用计算机拥有的运算规则。这个机器是通用的，因为它可以模仿当时被图灵称作有标准说明的其他机器。简单来说，相对于机械式手工操作的计算设备，图灵的通用机是可编程、可设计的，所以他带来了软件的概念（但不是用软件这个词来命名的）。1936
    年，图灵在写出那篇著名的论文——《论可计算数》（On Computable Numbers）之后，获得了普林斯顿大学博士学位。冯·诺依曼熟知图灵以及这篇论文，他成功地使图灵关于通用机的想法变成了现实。


    ![](img/cut_33_45898_m.jpg)


    18 岁那年，我需要找到一份工作以支付我在休斯敦大学上学的费用。我也拿到了其他大学的录取通知书，但是休斯敦大学学费比较便宜，况且我的女朋友也选择去那里读书，因此，我便选了这所大学。我应聘了一则当地招聘广告上的工作，工作内容是在一家拥有油气终端的公司进行财务编程。我对会计和油气终端都一窍不通。但令人意外的是，一个月以后，我接到了录用电话。


    这家公司在休斯敦的办公室只有两个人：总裁里克·沃利（Rick Worley）和他的秘书。公司的其他人都在密西西比州（Mississippi）。里克并不介意我的年龄。他搭乘半夜到早上
    8 点的火车，在旅途中通过查看我的学校作业了解我的能力。他从来没有见过任何一个像我这样擅长编程的人。我开始为他兼职工作。我们会爬进他的大奔驰车，开 6 小时的车到密西西比州的比洛克西（Biloxi）。在那里，我们可以花上几天时间安装软件并培训员工，然后一直看着巨大的气体管道终端被填满。


    我喜欢这份工作，喜欢编程、坐奔驰、享受旅途中的炸薯条和汉堡，以及和里克一起纵谈人生。里克是一个纯正的得克萨斯州人，他想给我提供一份全职工作的机会，但是我拒绝了。大学一年级之后，我从休斯敦大学转到得克萨斯大学奥斯汀分校（University
    of Texas Austin）。那所学校从那时到现在都有一门卓越的学科——计算机科学编程。此后的几年，我学习了计算机科学。我们学习了希尔伯特、哥德尔、图灵、冯·诺依曼的研究，还有很多相关知识。我还一直做兼职工作，从事编程工作或者辅导他人的数学和英语。


    随后，在毕业季，我收到了来自贝尔实验室的工作邀约。


    * * *


    [\[1\]](#chapter6.xhtml#commentRef_2583)第二次世界大战期间，美国陆军自 1942 年起开发核武器计划的代号。——译者注


    # 第四章 信号和噪声


    “锲而不舍方能强大。”


    我高年级时参加了贝尔实验室在得克萨斯大学奥斯汀分校的面试，并拿到了录取通知书。如果我为他们工作，他们会帮我交攻读硕士学位的学费。同时，我申请了得克萨斯大学的商学院，他们愿意为我提供全额奖学金。我还收到了贝尔通信研究所（Bellcore，1984
    年从贝尔实验室分拆出来，为分拆后的地方贝尔运营公司统一提供研究开发的服务）和一家石油公司的录取通知书。贝尔实验室这个公司名字略带自夸，但其作为多项基础科技突破性发明的诞生地，决定了电子通信领域的发展。


    自 1937 年以来，贝尔实验室的科学家们已经获得 8 次诺贝尔奖，获奖项目包括晶体管和激光器的发明、克劳德·香农（Claude Shannon）创建的通信理论，以及关于信息和噪声的数学概念。20
    世纪 70 年代后期，贝尔实验室开发了编程语言 C 语言。这种语言是我编程的主要支柱，也是 Unix 操作系统的支柱。Unix 操作系统不仅可用在苹果公司
    Mac 计算机的运行上，还可用于许多大大小小的系统（后来，C 语言发展成为更为先进的版本，也就是我们今天使用的 C++语言）。经过一番考虑，我接受了贝尔实验室的工作，同时攻读
    1988—1989 学年的得克萨斯大学计算机科学硕士学位。


