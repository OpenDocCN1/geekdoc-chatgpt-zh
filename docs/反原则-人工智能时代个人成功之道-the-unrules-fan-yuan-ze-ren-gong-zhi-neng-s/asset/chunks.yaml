  trans: '


    # 遗传学与基因组学的发展历程


    ## 19 世纪到 20 世纪的奠基


    遗传学和基因研究都在 19 世纪取得了重大进展。当时，奥地利的修道士格雷戈尔·孟德尔（Gregor Mendel）发表了一篇关于豌豆作物遗传和变异的开创性论文。这一发现虽然一开始被忽视，但后来产生了巨大影响（孟德尔的论文一度遗失，后来在他去世后被人们重新找到）。20
    世纪，关于基因和染色体的研究大幅加速，`DNA`被发现。真正意义上的突破发生在 1953 年，当时，詹姆斯·沃森（James Watson）和弗朗西斯·克里克（Francis
    Crick）发现了基因编码，阐明了`DNA`的结构。`DNA`是由一组长序列的核苷酸编码组成的。许多人相信，如果能解开`DNA`编码的奥秘，我们就有了打开人类繁衍信息宝藏的钥匙。


    `DNA`是由核苷酸构成的。这些核苷酸的碱基包括腺嘌呤（`A`）、胞嘧啶（`C`）、鸟嘌呤（`G`），以及胸腺嘧啶（`T`），它们在双螺旋结构中根据碱基互补配对原则存在于每一个细胞之中。在
    4 种碱基中，`A`与`T`匹配成键，`C`与`G`匹配成键。事实上，`DNA`类似图灵机中的纸带，它就像一种包含碱基对的生物化的程序语言。那些序列通过相关的核酸指导细胞生成机制，引导氨基酸组装成蛋白质。`DNA`编码存在于每个细胞核中，按
    3 个碱基对的片段排列`RNA`。举例来说，`CAT`三联密码子，用于组氨酸（一种氨基酸）的编码。对于组成蛋白质的 20 种氨基酸来说，4 种碱基的三联密码子一共有
    64 种可能的组合。那些额外的三联密码子履行着其他的功能，比如从`DNA`到蛋白质表达过程的起始和终止。举例来说，`DNA`上的起始密码子序列`ATG`负责启动蛋白质合成过程。


    ## DNA 结构与中心法则


    在沃森和克里克获得的诺贝尔奖成果，以及晶体学家莫里斯·威尔金斯（Maurice Wilkins）的成果，（他通过 X 射线衍射技术，生成`DNA`最初的结构影像）的基础上，1958
    年，克里克首次提出了分子生物学的“中心法则[^(\[3\])](#chapter12.xhtml#comment_8617)”：`DNA`提供了必要的遗传信息，`DNA`通过转录将遗传信息传递给`RNA`，然后`RNA`又将遗传信息翻译成特定蛋白质。中心法则描述了这样一种信息流：`DNA`编码`RNA`，`RNA`编码蛋白质。信息只能沿着一个方向传递，不能从蛋白质再传递回基因组。


    半个世纪以后，研究人员仍然在探索生化编码的复杂性。`DNA`的超长的基因组序列（30 亿个碱基对，1.9 万~2 万个蛋白质编码基因）提供了许多未解之谜，例如特定基因的定位和序列、大量非编码的`DNA`（占全部基因组的
    98%）、`RNA`剪接或基因转座（基因突然改变染色体的位置）的处理。1960 年，分子生物学家发现两种`RNA`：信使`RNA`和转运`RNA`[^(\[4\])](#chapter12.xhtml#comment_8677)。


    ## 基因组测序技术的指数增长


    1995 年，科学家发布了一种流感细菌的基因组排序，这意味着基因组第一次被完整地测序；人类基因组计划（`Human Genome Project`）在 2000
    年公布了人类基因组的初版图，在 2004 年公布了完成图。自始至终，科学家们公布的基因组大体上是相同的。一个答案往往会引出更多的问题，像阐明`DNA`或基因组序列这样的根本性的突破研究，引发了人们（特别是在公众和市场之间）极大的热情，也揭示了基因组更深度的复杂性。这证明，中心法则本身就是反原则理论的另一个例子：一个广泛适用的法则也有很多例外情况。而正是由于这些例外情况，科学家才开辟出调查研究至关重要的新途径。


    与此同时，对各种相关科技工具的改进盛行一时，工具性能实现指数级的飞跃。高通量基因组测序技术以类似摩尔定律的速度飞速发展。人类基因组计划历经 13 年，花费大约
    30 亿美元，完成了全部的人类基因组测序。梅森指出，从 2006 年开始，基因组测序的成本每 5 个月就会减半。一家名为 Solexa 的公司在 2007
    年被圣迭戈的 Illumina 公司收购，公司于 2016 年宣布，已经将一个人类基因组的测序成本降到 1000 美元，计划到 2020 年进一步降到 100
    美元。


    基因组测序技术飞速发展，随之而来的是，基因组数据以指数级速率在增长。今天，研究人员可以向很多数据库提交或使用其中的基因组数据。例如`DNA`元素百科全书（Encyclopedia
    of DNA Elements，`ENCODE`）计划，就是一个庞大的不断增长的数据集，它将参与`ENCODE`的国际研究人员聚集起来，对人类基因组的全部功能元素进行测序。作为美国国家癌症研究所（National
    Cancer Institude，`NCI`）和美国国家人类基因组研究所（National Human Genome Research Institude，`NHGRI`）研究发起和支持的项目，癌症基因图谱（`TCGA`）项目正在绘制
    33 种不同癌症的基因变化图谱。国际癌症基因组联盟（International Cancer Genome Consortium，`ICGC`）正在生成 50
    种不同癌症的全面的基因组数据。梅森的实验室通过运行自有的高通量测序技术，开发细胞特异分子图谱，试图在细胞层面提供关于疾病的多维视角。


    我们正在一步步发现，在分子和原子层面上，大自然如何通过不断地进化来编织生命的网络。所有人有大量相同的基因序列，但是每个人也有数量惊人的变异基因，其中一些基因信息会遗传给后代。由环境破坏、基因复制过程中出现错误等各种因素导致的基因突变和转座，可能会诱发疾病或者慢性病，也可能反而会促进健康，并且驱动人类的进化，这些机制符合以自然选择学说为核心的达尔文进化论。


    梅森和同事们经常把中心法则比作在路灯下寻找钥匙——即使你知道可能是在其他地方弄丢了钥匙，仍然在路灯下寻找。梅森拿它与 17 世纪的天文学对比，当时我们关于宇宙的视角，只能局限在简陋的工具所获取的信息上，靠着薄镜片来放大电磁波谱中的可见光。


    无论是在天文学，还是在生物学，我们都已经取得了非常大的成就。基因组学之父弗雷德里克·桑格（Frederick Sanger）是一位英国生物化学家。20 世纪
    50 年代，他苦心钻研，完全测定了胰岛素（一种蛋白质）的氨基酸序列，这包含了大约 1 千字节（kilobyte）的数据。20 世纪 60 年代，他继续研究更为复杂的`RNA`的序列问题。20
    世纪 70 年代，他研究了`DNA`的某种核苷酸序列，这项工作涉及几百个千字节的数据。因为在化学方面出色的工作成果，他获得了两次诺贝尔化学奖。几年以后，分子生物学家认识到，一个完整的人类基因组测序，就像测出`DNA`的结构一样，既是开始也是结束。今天，像梅森实验室里的现代测序仪器，每天都可以生产几百个太字节（terabyte）的数据。


    关于大规模水平上研究蛋白质特征的蛋白质组学、开发分析生物数据软件工具的生物信息学、分析和解释数据的过程的计算生物学等学科已经蓬勃兴起。对于（像阿尔茨海默症以及多种肿瘤这样的）众所周知的疑难杂症的深度研究，已经展开了新的篇章。大概在
    10 年前，梅森本人工作的领域还鲜为人知，现在已经包含了许多交叉学科并不断发展。这些领域包括现代生物医学、分子生物学以及生物信息学，产生了宏基因组学、计算基因组学、预测生物学等学科。


    我们看看梅森及其同事在过去几年里持续进行的一项研究。就像`DNA`一样，`RNA`也包含 4 个碱基，但是它有 1 个碱基是`DNA`所没有的，这个碱基就是尿嘧啶，尿嘧啶替代了`DNA`中的胸腺嘧啶。在`RNA`内，100
    多种已知的修饰或标记方式调节着`RNA`的活动。在这些标记方式中，最常见的基团之一就是甲基，它是由一个碳原子和三个氢原子组成的小分子化学基团，可通过特定酶的作用，附着在`RNA`或`DNA`上。其中一种化学修饰方式是腺苷
    N6 位置的甲基化（`m6A-methyl-adenosine`），它存在于 7000 个基因的 12000 个位点，大多出现在个体基因的终止位点，通常与基因表达的开始或终止功能相关联。`m6A`标记表现出重要的调节功能。此外，`RNA`修饰可能会影响`DNA`修饰；`m6A`表现为`RNA`编辑过程的负调节因子，其中一些细胞在转录后可能发生序列改变。但是`m6A`只是一个单一标记，也是一个信号，整体的信号多而复杂，其中一些信号很强，但其他的信号不好分辨。实际上，这个系统存在不同层次的调节活动，就像市场包括多级反馈环路和交互作用一样。


    就像梅森说明的那样，克里克的中心法则已经被打破。`DNA`可以自我复制；`RNA`可以沿两个方向行动（蛋白质合成方向和`DNA`合成方向）；蛋白质反过来也可以修饰`RNA`。完整的人类基因组有大约
    1 亿千兆字节的数据。但是这个基因组并不包括多级调节的活动，除了表观基因组[^(\[5\])](#chapter12.xhtml#comment_8885)（`DNA`）、表观转录组[^(\[6\])](#chapter12.xhtml#comment_8890)（`RNA`）、表观蛋白质组[^(\[7\])](#chapter12.xhtml#comment_8895)（蛋白质）这些调节，研究者还在想办法找出它们（`DNA`、`RNA`、蛋白质）相互作用的其他方式，例如蛋白质组[^(\[8\])](#chapter12.xhtml#comment_8902)（在体内生产的所有种类的蛋白质），或者微生物组[^(\[9\])](#chapter12.xhtml#comment_8907)（生物体内或生物体表面的所有微生物）。所有这些方式都在生物体内起着某种或好或坏的作用。用梅森的话来说：“相互作用是复杂的。”


    我们需要学习太多的东西。为了获得人体生物学的完整数据，你不仅要考虑环境中影响`DNA`、`RNA`和蛋白质的所有因素，还要考虑随着时间的推移所引发的变化因素。按照梅森的估计，你还需要储存
    1 万亿太字节的数据，也就是约 1000 的 8 次方个字节的数据，或者是 1 尧字节（yottabyte）的数据。我们今天还做不到，但这就是未来前进的方向。


    ![](img/cutq_196_8756_l.jpg)


    ## 微生物组与预测医学


    当梅森和我第一次对话时，他说：“我希望能够预测任何事情。”这话真是野心勃勃，引发了我的关注。尽管他承认这个目标可能有点激进，但这个目标与我自己设定的关于阿尔法的目标一样大胆。他强调，预测工作已经被纳入威尔康奈尔医学院的每一个项目中。


    他对我解释道：“对于医药和生物学的大部分，我们通常并不知道最值得探究的地方在哪里。对健康或疾病最具参考性的分子特征是哪一种、它们在哪里，这一切还在被发现的过程中。所以，我说希望能够预测任何事情，是指我想构建一系列框架，充分利用这些框架提供一个更好的视角，来观察肿瘤演化以及理解传染病。”


    梅森所致力的病理学地图计划（`PathoMap`），是有关绘制纽约市地铁微生物、病毒、潜在病原体，以及它们的基因组的项目。纽约市地铁的乘客是城市里移动范围最广泛的一群人。这项研究得出的一系列数据十分引人注目，其中包括这一惊人的数据和事实：被检测到的微生物中，有
    48%是之前人们所未知的。这些细节引发媒体的极大关注，正如梅森告知《纽约时报》那样，每天运送 550 万名乘客的纽约市地铁系统，是一座值得人们探险的“雨林”。梅森的病理学地图计划首个完成的项目就是宏设计计划（`MetaSUB`），这个项目旨在通过全球的主要城市勾勒出微生物组的世界。在进化史上，微生物很久以前就在人体内与人类共生，但是很少有人意识到它们的存在。事实上，我们每个人都携带着约
    100 万亿个微生物，重 3~5 磅[^(\[10\])](#chapter12.xhtml#comment_9016)。当我们离开一个地方时，从车厢拉杆和地铁闸机，到门把手和公用电话，这些地方都会留下它们的痕迹。梅森有很多形容微生物组的经典语录：“当你体内的细胞进行民主选举时，你会发现你自己的细胞是少数党”“你体内携带的基因大部分不是你的。”


    他强调，对于健康的人体生态系统而言，微生物组至关重要，人体生态系统一旦丧失微生物的多样性，后果不堪设想。其中，“微生物组”不仅仅是指大量的微生物，还包括它们的基因，其数量是人类基因组的
    100 倍。这些微生物基因负责制造人体消化、营养、免疫系统、调节食欲以及控制体重所需的蛋白质。大约有 700 种“药物”是由体内的微生物生产出来的，其中包括
    90%的血清素和 50%的多巴胺，还有关键的维生素，都得益于微生物，微生物偶尔也会产生病原。


    人类基因组也可能是在一个“保险库”里，但是很难与微生物的基因完全隔离。自从人类和黑猩猩在进化树上“分道扬镳”以来，大约 98000 种病毒已经在人类基因中留下它们的`DNA`。线粒体是产生化学能量的细胞器，来自线粒体[^(\[11\])](#chapter12.xhtml#comment_9068)的
    300 种基因，也存在于人类基因组之中。线粒体基因组与微生物基因组有类似之处。


    与了解存在于地铁站中最奇异的微生物相比，病理学地图计划的目标更严肃、更长期。该项目可通过不同时期重复取样来评估长期疫情监控工作，可用来建立分析基准、侦测生物恐怖袭击，以及大规模人群的健康管理。也就是说，它旨在通过多种不同的方式进行预测。


    无论是地铁潜藏的微生物的基因组，还是癌症患者放化疗后杂乱的基因组，所有基因组序列中总会有信号存在。梅森深信，我们将能够监测和测序人类个体细胞，以及细胞间的通信信号。通过快速和经济划算的测序技术，我们将能够检查任何癌细胞的突变。梅森认为，要实现这样的目标，我们还面临两大挑战。第一个挑战是，在技术上，我们如何实现、捕获并且正确地描述患者身上的个体细胞或个体分子。第二个挑战是，我们怎样建立模型，攻克类似癌症这些难解的、顽固的、异质性疾病上发生的变化。总之，我们能够以一种指导未来行动的方式读懂`DNA`序列吗？


    “在测序某个`DNA`片段时，它的结果能够像法医断案一样，明确地告诉我们这个`DNA`片段来自哪里、它存在哪些潜在风险，或者它能够为医学提供什么有用的信号吗？”梅森问道：“我们希望通过提取体内一个特定的细胞，观察它的`DNA`序列，就能了解关于身体的一切状况。当你的细胞处于基因突变的状态下，你的身体存在哪些危险？这些序列能提供哪些健康指导？在某种身体情况下，我们服用哪些药物会见效？只有通过大数据和更卓越的科技手段，我们才能找出这些问题的答案。”


    梅森曾经问我，是否可以开发一个金融模型，这个模型能够很好地预测市场，并且可以持续 30 年都有效。我的回答当然是不可能开发得出来。但是在医学界的病情预测工作上，模型的长期有效性恰恰就是关键所在。例如，你可能会用到多年前的数据做病情预测，你可能会说：“好吧，根据你
    15 岁和 18 岁的基因组，这时你需要考虑是否做双侧乳房切除术。如果有一个乳腺癌 1 号基因（`BRCA1`）突变，你不得不做出决定，选择部分切除，以继续存活下来。”为了活命，切除一部分器官是不得已而为之的决定。


    当梅森和我继续对话时，我们开始讨论，采取什么方式能够更有效地开发治疗疾病的模型。毋庸置疑，资金充足是开发这个模型首要条件。为了深入研究个体细胞，更快速地完成测序和癌细胞的复杂分析，如果有充裕的资金，梅森就能够聘请更多的研究人员，购置更多的精密仪器。于是我们发现，双方可以通过合作获得优势互补的机会。世坤投资的目标确实与梅森所在单位的不同，双方的模型也完全不一样。然而，我们也有相同之处，双方都聘请了大量的博士、计算机科学家，以及
    IT 专家；我们都致力于科研工作；我们都靠数据吃饭。我们使用许多相同的计算机程序语言，工作中所用的数学和科学语言也是相似的；我们共享同一种量化思维方式。在世坤投资，我们知道如何将经过科学训练的新同事快速引导到金融领域的工作上。如果我们把公司的几位研究员派送到梅森的单位，同时把对方的一些毕业生和博士后带入我们的办公室，会混合出什么效果呢？我们就把它当成一场异想天开的实验吧，把量化金融方面的人才与量化基因组学方面的人才混合在一起，看看能不能提高这两个领域的技术含量。


    我们已经这样做了。2017 年春季，世坤投资深化了与威尔康奈尔医学院的合作。我们捐赠了 500 万美元，用于在威尔康奈尔医学院创建世坤量化预测计划（`WorldQuant
    Intiative for Quantitative Prediction`）。梅森告诉我：“无论是对于人类还是对于微生物，这是把带有微生物组的肿瘤生物学的大数据和宏基因组学大数据，或者所有基因组结合起来的第一个计划。”梅森将和奥利维尔·埃利门托（Olivier
    Elemento）共同负责监控研究项目的工作进展。埃利门托是威尔康奈尔医学院的副教授，当时正在研究如何将大数据应用于药物临床试验失败原因的分析。梅森还将联合威尔康奈尔医学院的卡里尔和伊斯雷尔·英格兰德精准医疗研究所（Weill
    Cornell''s Caryl and Israel Englander Institute for Precision Medicine）以及桑德拉和爱德华·迈耶癌症中心（Sandra
    and Edward Meyer Cancer Center）的科学家一起投入这项工作。


    我们挑选了世坤投资的几位研究人员。他们精通预测算法，将作为访问学者到梅森实验室工作。他们将作为数据科学家提供服务，他们的使命是深入基因组数据集研究工作中，想出构建预测模型的新灵感。梅森也将派一部分人来世坤投资，让他们学习我们的数据处理方法。


    在我撰写本书的时候，这个计划刚刚启动。世坤投资已经派出几位专家到威尔康奈尔医学院；梅森的小团队刚成立，正准备加入我们。我们都希望通过融合这些最棒的大脑、灵感、算法以及方法，找出更好的预防和治疗疾病的方法，同时提高阿尔法研究技术水平。我们对首次试验都感到很兴奋，并且对结果充满期待。


    ![](img/cutq_201_16940_l.jpg)


    ## 基因型表型与疾病关联


    梅森和同事在基因组数据中大海捞针般找寻的是什么呢？本质上，他们希望查明染色体序列和遗传病之间的因果关系，通过预测算法构建模型发现这种关系。用生物术语来讲，基因型[^(\[12\])](#chapter12.xhtml#comment_9282)（`genotype`，基因组序列）通常能在表型（`phenotype`）上体现出来。形式决定功能，这为寻找它们的相互关系提供了基础。


    现在，人们已经发现了一些基因与疾病的因果关系。随着研究的深入，这类疾病的清单正在被不断拉长，比如血友病，这是由有缺陷的基因破坏了凝血功能所引起的疾病；还有镰状细胞贫血，这是由氨基酸合成相关的某个碱基对发生基因突变所引起的；囊性纤维化疾病[^(\[13\])](#chapter12.xhtml#comment_9289)，这是由于基因突变破坏了氯离子和水通过细胞膜的运输而引起的；某些乳腺癌和卵巢癌与乳腺癌
    1 号基因突变有关系，亨廷顿舞蹈症[^(\[14\])](#chapter12.xhtml#comment_9292)是由基因突变引起的（`CAG`三联密码子重复次数达到
    50~60 次），它会产生大量衰减的蛋白质（attenuated protein），这些蛋白质会积累起来进入脑细胞，并且损害脑细胞。尽管与基因关联的疾病的清单相当长，并且还在继续增长，但与大量的蛋白质相互作用而导致的基因突变疾病相比，现在已知的还只是冰山一角。


