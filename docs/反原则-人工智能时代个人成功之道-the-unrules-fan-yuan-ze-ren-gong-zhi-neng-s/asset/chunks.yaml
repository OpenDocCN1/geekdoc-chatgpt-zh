    # [第九章 量化生物学](../Text/contents.xhtml#e_13)


    “大处着眼就会容易些。”


    2013年，你会发现数据的指数级增长现象已经广泛存在，甚至开始通过市场和传媒渗入流行文化中。突然间，“大数据”一词冒了出来，并无所不在，广为人知。随之而来的术语和概念，正是我们在量化投资中长期思考和致力研究的内容：预测算法、人工智能、机器学习，以及数据科学。在这个广阔的世界里，这些内容曾经看起来毫无用武之地，但是一切都在改变，而且是飞速地改变。2015年，世坤大学开始围绕这些内容设计相应的课程。在世坤投资基金会和我们的风险投资计划的支持下，我开始在不同于交易的领域探索这些概念。


    2014年春天，在纽约的威尔康奈尔医学院，我和一位非常聪明的青年研究员共进午餐。他就是克里斯托夫·梅森博士，是一所实验室的负责人，专注于开发有关基因测序的新技术，并运用算法技术研究人类基因图谱和疾病之间的关系。


    梅森幽默风趣，35岁时获得了耶鲁大学遗传学博士学位。他思维活跃，谈话时常常从一个主题跳跃到另一个主题，并在多个主题间来回切换，其主题包括基因学和基因测序、微生物学、擦拭技术（这种技术是为采集纽约地铁网的细菌的`DNA`而设计的，是纽约市微生物基因图谱项目的一部分）。梅森是生物学和生物物理学的副教授，当时正在和美国国家航空航天局合作，检验微重力条件对`DNA`（脱氧核糖核酸）和`RNA`（核糖核酸）以及其他与太空相关的环境因素的影响。他告诉我，他正在思考一个长达500年的研究计划，这是一个关于探索火星和在火星居住的计划（请注意，很显然，他不会亲眼看到这一研究成果）。午餐后，他带我参观了他的湿性实验室[^(\[1\])](#chapter12.xhtml#comment_8399)，这里正在对许多样本进行排序；他还带我参观了干性实验室，那里正在进行计算分析。


    我发现实验室的一切都让人大开眼界，但是梅森的干性实验室（实际上是个堆满机器或计算机的房间）让我感觉到我们两个机构在工作上的相关性。干性实验室与世坤投资看起来大部分都一样，两者都有同样的隔间和计算机，还有许多通用的程序，都有一种安静的工业化氛围，两个地方的年轻人看上去也都一样聪明。


    这次参观之后，世坤投资基金会很快就为威尔康奈尔医学院捐赠了100万美元，用于每年提供5万美元奖金以鼓励内部研究。截至目前，梅森的团队已经3次获得奖金。


    我们的关系绝非停留在慈善捐赠这一层面上。首次共进午餐之后，梅森和我继续保持对话。我们有时是在吃晚餐时沟通，有时通过电话或电子邮件沟通。我们讨论量化金融和预测生物学，以及疾病建模的可能性。他把基于实验室研究发布的论文和报告发送给我。在某种意义上，对我来说，梅森的实验室是我公司以外的另一个世界。在这座享誉世界的医学院中，梅森和他的同事致力于发现致病的原因、预测疾病的爆发和治愈疾病，而不是从持续变化的市场中榨取回报。梅森讲话从来不刻意修饰，而是平铺直叙、直奔主题，和我的讲话风格一致。在数据大爆炸的时代，我们千方百计都想从极端复杂、非线性系统中提取信号，并使用计算机科学技术识别有价值的模型。


    就像梅森常常对我指出的那样，我们不能忽视我们两个机构工作之间的区别。正如梅森所说，在医学界和金融界，量化模式是不同的。我们在世坤投资构建成千上万的阿尔法，每个阿尔法的有效性可能持续数月或数年；而梅森专注于开发为数不多的几个模型，但每个模型要在30年或40年内都可以持续帮助患者。在交易领域，因为市场变化太快，所以我们已经学会与那些有效性非常短的阿尔法打交道。另外，在51%的获胜概率下，我们就有把握锁定胜局，但在医疗健康领域，人们肯定无法接受一个疗效如此低的模型。


    “如果你告诉患者，癌症趋于好转的概率大概是50%，那对患者来说无济于事。”梅森强调，“通常来说，在医学界，必须有80%~85%的把握，否则，人们不会把你的话当回事。你不能这样告诉某个人，‘哎，你懂吧，我刚才抛了枚硬币，你可能会死，也可能不会。’”


    然而，在医学界和金融界，反原则一样适用：没有模型可以完美代表一个复杂并且永远变化的现实世界。每个市场各不相同，每个病人也是独一无二的。变化是永恒的。这些对梅森和他的同事来说，才是巨大的挑战。


    最后，我们开始讨论在量化金融与量化基因组学[^(\[2\])](#chapter12.xhtml#comment_8507)（`genomics`）之间合作的可能。我们能够从彼此身上学到些什么？


    ![](Images/cutq_188_59976_l.jpg)


    疾病研究的可用数据来源并不总是局限在医学界。古希腊的医生，包括希波克拉底（`Hippocrates`）和盖伦（`Galen`），都曾致力于找出致病原因，尝试将其与环境因素联系起来。但是那时的研究，理论意义远远大于实践。17世纪，这一情况开始发生变化，关于疾病发生率及类型的量化研究开始出现了，首批能够更深入地研究生物学的工具也被发明了。


    在随后的几个世纪，流行病学（`epidemiology`）这一实证学科慢慢发展起来。在希腊语中，“Epi”是指“在我们之上”或者“在我们之间”，流行病学是关于“什么在人们之上”的研究。19世纪50年代，伦敦为什么发生了霍乱疫情？我们能够从这场流行病的传播中学到什么？比如，病菌是通过什么途径传染的？20世纪，很多数学家也投入医学研究工作，并主导了大规模多发疾病的研究。例如，他们用概率和统计工具分析得出结论，将肺癌与吸烟联系起来。那时，疾病的传播媒介（例如病毒和细菌）已经被发现。就像金融领域一样，仍然在努力抛出大量数据，试图解释各种现象背后的原因。

    '
  trans: '


    我开始用心思考，如何提升量化投资领域的教育水平。从某种意义上讲，世坤投资也是一家教育机构，也在对数学和科学专家进行金融知识的培训。我考虑设立一个独立于公司的机构，它可以满足多方面的需要，它将提供奖学金以激发量化金融所需要的批判性思维；对全球数学和科学领域的杰出机构进行奖励；与非政府组织、大学和政府进行合作；主办会议，并为旨在鼓励增进教育机会的大会提供赞助。同时，我将挖掘一些创新项目、新研究领域以及潜在突破性项目，并通过风险投资方式给予支持和鼓励。


    2009 年，我创立了非营利机构——世坤投资基金会，来执行上述策略。一开始，世坤投资基金会资助了一些组织，比如教授数学、物理和量化分析的大学。最后，我们还设立了个人奖学金项目，主要奖励量化科学领域的人才。尽管公司没有从这些奖学金项目和捐赠项目中直接获利，但是我相信，我们所做的一切促进量化科学发展的努力，都将令整个量化投资产业受益。


    在这一进程中，我们并不孤独。2012 年，德国计算机科学家塞巴斯蒂安·特伦（`Sebastian Thrun`）和两个合伙人开办了优达学城（`Udacity`）教育公司，这家公司创新性地提供了一种大型开放式的在线课程——慕课（`MOOCs`）。在
    20 世纪 90 年代中期，特伦曾经带领团队建造机器人，他是从一个名为犀牛（`Rhino`）的博物馆机器人导览项目开始的，后来，他把这个项目作为他在波恩大学毕业论文的内容。在斯坦福人工智能实验室，他主持团队开发了无人驾驶大众汽车斯坦利（`Stanley`），并在
    2005 年美国国防部高级研究计划局（U.S. Defense Advanced Research Projects Agency）举办的自动驾驶挑战赛中获胜。两年以后，特伦加入了谷歌，他为搜索引擎巨头创建了神秘的`Google
    X`实验室，孵化了无人驾驶项目——现在众所周知的街景车（`Waymo`）项目。《快公司》（`Fast Company`）杂志，美国最具影响力的商业杂志之一，称特伦为“世界最著名的科学家，他饱受争议，在成功说服普通人拥抱疯狂理念方面，也许只有埃隆·马斯克[^(\[2\])](#chapter11.xhtml#comment_7905)（`Elon
    Musk`）能打败他”。


    特伦的一个疯狂念头是普及精英教育。尽管在离开斯坦福大学之前，他已经开发上线的课程可能足以超越实体大学所能覆盖的课程。2011 年，特伦在客厅使用数码相机和替代黑板的手持白板纸，首次教授人工智能的在线课程，当时大约有
    16 万人签到上课。正如《快公司》杂志在 2013 年关于特伦的报道中所说的，计算机科学家按照第一次考试成绩排序，前 400 名无一出自斯坦福大学。离开谷歌公司以后，特伦建立了优达学城，致力于提供慕课，特别是统计学与计算机科学的交叉学科课程。


    在世坤投资基金会，我们正在考虑同类问题。我也希望能够通过互联网方式触达更广大的全球受众，识别并鼓励那些有天赋的人。我希望教授更多的数学和科学课程，因为我相信这些课程将会重塑世界。尽管我们支持或资助的课程在内容上与优达学城的课程有显著的重合，比如人工智能、机器学习、统计学、计算机和数据科学这些课程，但我们更聚焦于量化金融课程，以及生产阿尔法所必需的大数据相关课程。特伦本人坦然面对学生完课和通过考试这两大难题，这是许多在线教育公司都会面临的普遍问题。2013
    年，我们开始为教授阿尔法开发而研制慕课。我们希望无论在世界哪个地方，有意愿学习的人都能学习这些免费或仅象征性收费的课程。为此，世坤投资的许多员工都自愿帮助设计这些课程内容。


    就像我第一个阿尔法的开发，或者就像在北京开设办公室的尝试，课程项目的开始，代表着一项更宏大、更复杂、徐徐展开的长期策略的启动。我们从两个方向上想办法实施在线教育。第一个方向是我们在
    2014 年举办的世坤投资挑战赛。就像美国电话电报公司举办的大学生投资挑战赛一样，世坤投资挑战赛不仅是投资方面的挑战赛，还是包含了投资教育成分的挑战赛。竞赛项目主题是开发高效的阿尔法。参加竞赛的选手要通过登录世坤投资挑战赛的网页参赛。我们公司的`WebSim`在线模拟平台对所有参赛者开放；如同公司内部的研究员和投资组合策略师一样，参赛者可以运用同样的数据集和回测功能。对于通常来说带有神秘色彩的量化产业，这种做法已经相当开放和透明了（比赛甚至可以支持使用智能手机和平板电脑登录`WebSim`）。


    我们将挑战赛当成一个教育平台，围绕阿尔法开发，实现人才甄选、课程运营、线上或线下会议等功能。2017 年 7 月，我们举办了 32 场类似的活动，例如“金融和技术指标”在线课程；在印度举办的“阿尔法质量和过度拟合的风险”会议（“过度拟合的风险”是指算法可能会由于过于复杂而削弱可预测性）；在韩国、俄罗斯和越南举办的阿尔法松（`Alphathon`）信息会议（阿尔法松是指世坤投资按季度举办的全球量化金融建模大赛）。获胜阿尔法的开发者将会获得
    10000 美元的奖金。同时，对于表现最好的参赛者，我们还会提供研究顾问的岗位；我们现在已经有超过 700 位的研究顾问。一位从农村来的参赛者已经获得工程学学位，但由于他要继承家族土地的所有权，所以他选择了回乡当农民。他在挑战赛中表现非常突出，因此我们为他提供调研顾问的岗位机会。


    第二个方向是，我们开始筹备设立世坤大学。我们已经通过世坤投资基金会给传统大学的在校生提供奖学金，但是我希望进一步扩大规模。最终，我们设计出关于量化金融领域的全套课程，配有现场辅导答疑环节。学生通过大约两年的在线学习，可以取得金融工程硕士学位。作为世坤投资基金会资助的非营利机构，世坤大学在
    2015 年宣布成立。大学项目对世坤投资来说，又是一个没有带来直接收益的项目。我有两个目标：一是消除地域的障碍，大多数金融工程专业的研究生课程只在美国的部分大学开设，对参与者来说，学习这些课程是有地域限制的，但是世坤大学可以通过互联网，让世界各地任何区域的人们都可以学习这些课程；二是消除成本障碍，对于这些学术课程的学费，教育机构按市场价值可以收取
    10 万美元甚至更多。对很多人来说，教育机会依然是一种特权，而不是一种权利。我希望世坤大学能改变这一状况。我坚信，学生不应该因为贫困而被剥夺教育选择权，或者没有任何机会获得高质量的资源，或者没有与量化领域专家一起工作的机会。


    2016 年，世坤大学第一个班开课了：来自 35 个国家和地区的两百多名学生入学了，这意味着全球的人才获得了更多的成长机会。现在，我们已经开设了 14 门研究生课程，有超过
    90 个国家和地区的大约 1800 名学生正在通过互联网学习，参与者的数量还在快速增加。我们每 7 周组建一个新的学习群，并持续更新课程。超过半数以上的学生来自撒哈拉以南的非洲国家，仅尼日利亚就有几百人（不要惊讶于这个数量），其他学生分布在亚洲以及欧洲的许多国家。世坤大学的教学质量正在逐渐取得公信力，这个过程预计还要花上几年的时间。因为除了其他因素的考量，我们需要毕业生的实力来证明教学质量。世坤投资并没有指望通过这所大学获取什么直接利益。我们也不希望学生认为，这是一条可以到世坤投资工作的捷径。事实上，作为一个非营利机构，我们约定，学生毕业后至少一年内不能被世坤投资雇用。我们的目标是，教会学生
    21 世纪已有的科学成果，让他们有能力回报他们所生活的社区。


    我要求大学项目团队的同事，要开始关注如何将课程扩展到数据科学领域。团队已经着手上线一个数据工程学课程，这个课程会设置一个为期 8 周的数据科学“新兵训练营”，大部分课程内容是学习用`Python`之类的计算机语言进行建模编程。这种短学期课程可以评估学生使用更先进学习资料的能力。


    目前，世坤大学的学生大约 90%都是男性。这意味着世坤大学仍然有巨大的成长潜力。现在的人才库不够大，我们应该通过努力不断扩充人才库，把更多的女性人才吸纳进来。我们决心加紧开发全球的人才资源，致力于提供平等的教育机会。


    人才的分布同样遵循幂律。如果你选取足够大的样本，你就会发现他们中的小部分尤其擅长某一特定任务，所以人才库的大小只是一个单纯的统计问题。这就是为什么我们感觉必须走出去、到达尽可能多的国家，并避免用任何人为的标准对人才进行分类。如果无法面对面接触人才，我们就通过互联网，使用网上模拟平台`WebSim`去触达他们，了解他们的才华。


    ![](img/cutq_179_49718_l.jpg)


    2015 年 3 月，我们组织公司的所有员工和一些客户（共约 700 人），一起到波多黎各的度假村，参加世坤投资举办的全球峰会。那时我已经确信，一场指数型变革正在扫荡量化金融领域。我在千禧管理公司“孤军奋战”的时代，也是我和唯一的阿尔法相依为命的时代。走到今天，世坤投资拥有这么多同事和阿尔法，经历了漫漫长路。这条路比从白俄罗斯到纽约、威奇托，甚至更远的地方还要漫长。我在峰会上发言并提出，当今世界所面临的经营挑战是，如何应对一个指数级增长的变化。如今，数据、知识以及计算能力（符合摩尔定律[^(\[3\])](#chapter11.xhtml#comment_8159)）都在以指数级增长。


    以指数思维思考问题意味着什么？它意味着要连续不断地确立目标；意味着思考和行动要有胆量和见识；意味着要认识到，今天令人震惊的事情，明天可能就变得稀松平常，后天可能就变得完全没有价值了；意味着不要让思维受限，今天笃信的事情现在还存在着，只是为了接受被打破的宿命；意味着承担风险就是一种生活方式。在一个指数世界里，我们无法估量究竟能够看见多少的地势，因此动荡冲击也就不可避免。在那种无法判断地势的地方，充满了未知的陷阱，但能够消化、吸收大量信息的人，将得到指数级增长的回报。


    2014 年，也就是举办全球峰会的前一年，我对世坤投资的支柱业务做了规划和布局：开发无限的阿尔法，招聘全球的人才，教授交易的技术，通过这些努力，把交易的未来掌握在自己手中。我们已经打造了全球化阿尔法工厂，目标是生产
    100 万个阿尔法，尽管这个目标在当时看来非常激进，但我们还是越来越接近这个目标了。然后我又提出将目标数量改为原来的 3 倍，无论在过去还是现在，完成目标的限制条件都是计算机的整体计算能力不足，而不是开发阿尔法的灵感不足。指数级增长让每一个新目标都显得令人震惊。


    在一个指数级增长的世界里，任何公司想要蓬勃发展，都要具有足够的魄力和执行力。在波多黎各峰会上，我们邀请了一部分美国军事将领（包括美国前国务卿科林·鲍威尔以及一些四星上将）参加演讲。我为什么邀请他们为投资峰会做演讲？因为对于一个组织在指数级增长条件下如何运行，这些人具备深刻的洞察力。他们对快速做出决定、严明的纪律性、识别风险，以及在重重压力下完成执行，都了如指掌。当然，量化金融与战争非常不同。但是竞争总是存在的，而且实际上你一直置身其中。在一个指数级增长的世界里，竞争者从来不是一直在睡大觉，赢家通吃，我们必须始终做那个领先一步的人。


    在一个指数级增长的世界里，你必须摒弃线性思维。以指数思维思考，意味着要与风险共生。线性思维所包含的确定性，对我来说就是一种死亡：在这个世界上，还有什么能像死亡一样确定呢？当世界以指数级变化发展时，我们能做的就是紧跟这一趋势，随时因势而变。


    我们通过计算发现，这些年，我们开发的阿尔法数量与模拟投资组合的数量直接成比例增长。问的问题越多，得到的答案越多。事实上，我们的业务结果趋向于与阿尔法数量的对数成比例增长。我们已经通过计算验证了这种现象的存在。在外行的眼中，这意味着业务在以线性方式增长，而阿尔法的数量必须每年都以指数级增长。在这一数学关系下，我们永远都要在人力资本、业务绩效和阿尔法产量之间权衡取舍。我们必须问自己：我们聘用了多少人？我们投了多少资金？我们有多少的灵感被开发成阿尔法？灵感可能是无限的，但阿尔法产量是受成本限制的。我们怎样才能保证把最好的灵感投入生产？


    世坤投资的生存离不开多样性理念。谁也无法逃脱反原则的规律：任何理论和方法都有缺陷，没有事情能被证明绝对确定或正确，而且任何事情都不可能完美无缺。一旦你不盯着这条规律的消极一面，你就会看到一个主张自由交流思想的积极论点。


    重视多样化的、相互矛盾的方法。因为所有理论都是有缺陷的，所以最好的方法是收集尽可能多的理论，设计最佳方式来同步运用它们。


    重视多元的、独立自主的观点。让头脑敏锐的顾问为你提供独立的咨询服务，这会显著提高你的决策质量。如果把每个顾问设想成一个阿尔法：5 个不相关的阿尔法就会让你得出一个非常好的夏普指数，比
    1 个阿尔法的效果好得多。


    让每个人都受益。让更多的人受益，会帮助你获得成功。把你的努力和周围每个人的成功都联结起来，你自然就获得了所有人的助推力。这正是我在世坤投资所实践的。


    * * *


    [\[1\]](#chapter11.xhtml#commentRef_7702)为了维持群体的和谐，群体成员削弱了决策能力，并且避免做出符合现实的评价。——译者注


    [\[2\]](#chapter11.xhtml#commentRef_7888)著名企业家，现任太空探索技术公司（SpaceX）CEO 兼 CTO、特斯拉公司
    CEO、太阳城公司（SolarCity）董事会主席。——译者注


    [\[3\]](#chapter11.xhtml#commentRef_8140)摩尔定律是由英特尔创始人之一戈登·摩尔提出来的。其内容为：当价格不变时，集成电路上可容纳的元器件的数目，每隔
    18~24 个月便会增加一倍，性能也将提升一倍。换言之，每一美元所能买到的计算机性能，将每隔 18~24 个月翻一倍以上。这一定律解释了信息科技进步的速度。——译者注


    # 第九章 量化生物学


    “大处着眼就会容易些。”


    2013 年，你会发现数据的指数级增长现象已经广泛存在，甚至开始通过市场和传媒渗入流行文化中。突然间，“大数据”一词冒了出来，并无所不在，广为人知。随之而来的术语和概念，正是我们在量化投资中长期思考和致力研究的内容：预测算法、人工智能、机器学习，以及数据科学。在这个广阔的世界里，这些内容曾经看起来毫无用武之地，但是一切都在改变，而且是飞速地改变。2015
    年，世坤大学开始围绕这些内容设计相应的课程。在世坤投资基金会和我们的风险投资计划的支持下，我开始在不同于交易的领域探索这些概念。


    2014 年春天，在纽约的威尔康奈尔医学院，我和一位非常聪明的青年研究员共进午餐。他就是克里斯托夫·梅森博士，是一所实验室的负责人，专注于开发有关基因测序的新技术，并运用算法技术研究人类基因图谱和疾病之间的关系。


    梅森幽默风趣，35 岁时获得了耶鲁大学遗传学博士学位。他思维活跃，谈话时常常从一个主题跳跃到另一个主题，并在多个主题间来回切换，其主题包括基因学和基因测序、微生物学、擦拭技术（这种技术是为采集纽约地铁网的细菌的`DNA`而设计的，是纽约市微生物基因图谱项目的一部分）。梅森是生物学和生物物理学的副教授，当时正在和美国国家航空航天局合作，检验微重力条件对`DNA`（脱氧核糖核酸）和`RNA`（核糖核酸）以及其他与太空相关的环境因素的影响。他告诉我，他正在思考一个长达
    500 年的研究计划，这是一个关于探索火星和在火星居住的计划（请注意，很显然，他不会亲眼看到这一研究成果）。午餐后，他带我参观了他的湿性实验室[^(\[1\])](#chapter12.xhtml#comment_8399)，这里正在对许多样本进行排序；他还带我参观了干性实验室，那里正在进行计算分析。


    我发现实验室的一切都让人大开眼界，但是梅森的干性实验室（实际上是个堆满机器或计算机的房间）让我感觉到我们两个机构在工作上的相关性。干性实验室与世坤投资看起来大部分都一样，两者都有同样的隔间和计算机，还有许多通用的程序，都有一种安静的工业化氛围，两个地方的年轻人看上去也都一样聪明。


    这次参观之后，世坤投资基金会很快就为威尔康奈尔医学院捐赠了 100 万美元，用于每年提供 5 万美元奖金以鼓励内部研究。截至目前，梅森的团队已经 3 次获得奖金。


    我们的关系绝非停留在慈善捐赠这一层面上。首次共进午餐之后，梅森和我继续保持对话。我们有时是在吃晚餐时沟通，有时通过电话或电子邮件沟通。我们讨论量化金融和预测生物学，以及疾病建模的可能性。他把基于实验室研究发布的论文和报告发送给我。在某种意义上，对我来说，梅森的实验室是我公司以外的另一个世界。在这座享誉世界的医学院中，梅森和他的同事致力于发现致病的原因、预测疾病的爆发和治愈疾病，而不是从持续变化的市场中榨取回报。梅森讲话从来不刻意修饰，而是平铺直叙、直奔主题，和我的讲话风格一致。在数据大爆炸的时代，我们千方百计都想从极端复杂、非线性系统中提取信号，并使用计算机科学技术识别有价值的模型。


    就像梅森常常对我指出的那样，我们不能忽视我们两个机构工作之间的区别。正如梅森所说，在医学界和金融界，量化模式是不同的。我们在世坤投资构建成千上万的阿尔法，每个阿尔法的有效性可能持续数月或数年；而梅森专注于开发为数不多的几个模型，但每个模型要在
    30 年或 40 年内都可以持续帮助患者。在交易领域，因为市场变化太快，所以我们已经学会与那些有效性非常短的阿尔法打交道。另外，在 51%的获胜概率下，我们就有把握锁定胜局，但在医疗健康领域，人们肯定无法接受一个疗效如此低的模型。


    “如果你告诉患者，癌症趋于好转的概率大概是 50%，那对患者来说无济于事。”梅森强调，“通常来说，在医学界，必须有 80%~85%的把握，否则，人们不会把你的话当回事。你不能这样告诉某个人，‘哎，你懂吧，我刚才抛了枚硬币，你可能会死，也可能不会。’”


    然而，在医学界和金融界，反原则一样适用：没有模型可以完美代表一个复杂并且永远变化的现实世界。每个市场各不相同，每个病人也是独一无二的。变化是永恒的。这些对梅森和他的同事来说，才是巨大的挑战。


    最后，我们开始讨论在量化金融与量化基因组学[^(\[2\])](#chapter12.xhtml#comment_8507)（`genomics`）之间合作的可能。我们能够从彼此身上学到些什么？


    ![](img/cutq_188_59976_l.jpg)


    疾病研究的可用数据来源并不总是局限在医学界。古希腊的医生，包括希波克拉底（`Hippocrates`）和盖伦（`Galen`），都曾致力于找出致病原因，尝试将其与环境因素联系起来。但是那时的研究，理论意义远远大于实践。17
    世纪，这一情况开始发生变化，关于疾病发生率及类型的量化研究开始出现了，首批能够更深入地研究生物学的工具也被发明了。


    在随后的几个世纪，流行病学（`epidemiology`）这一实证学科慢慢发展起来。在希腊语中，“Epi”是指“在我们之上”或者“在我们之间”，流行病学是关于“什么在人们之上”的研究。19
    世纪 50 年代，伦敦为什么发生了霍乱疫情？我们能够从这场流行病的传播中学到什么？比如，病菌是通过什么途径传染的？20 世纪，很多数学家也投入医学研究工作，并主导了大规模多发疾病的研究。例如，他们用概率和统计工具分析得出结论，将肺癌与吸烟联系起来。那时，疾病的传播媒介（例如病毒和细菌）已经被发现。就像金融领域一样，仍然在努力抛出大量数据，试图解释各种现象背后的原因。


