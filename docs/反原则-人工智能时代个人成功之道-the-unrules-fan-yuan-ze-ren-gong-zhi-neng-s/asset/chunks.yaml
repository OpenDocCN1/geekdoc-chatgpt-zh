    乌拉姆的分支思想涉及中子的状态，这些中子是由引发氢弹的原子爆炸所释放的。这些中子只有几种可能的结果：发散辐射、被吸收、改变速率，或者与其他原子核发生反应，形成新的同位素。这些不同的结果看起来是随机的，但其实在自然中普遍存在，它们通常在一些突发的相变之前产生，迪迪埃·索内特认为，当微小的断裂以一种分支模式突然激增时。在研究受到压力的地壳构造板块和崩盘前的市场所产生的信号时，他也识别到同样的分支模式。


    乌拉姆的思想促进了蒙特卡罗法（Monte Carlo Method）[^(\[10\])](#chapter9.xhtml#comment_5849)的诞生。蒙特卡罗是乌拉姆在洛斯阿拉莫斯实验室的同事想出的名字，这位同事是尼古拉斯·梅特罗波利斯（Nicholas
    Metropolis）。蒙特卡罗是摩纳哥的一座赌城，乌拉姆的叔叔过去经常向亲戚借钱去那里赌博，那里最受欢迎的赌博方式是轮盘赌，赌徒们总觉得自己有一定的概率会赌赢。乌拉姆和冯·诺依曼在数学上通力合作。当冯·诺依曼看到单个中子的随机抽样的概率轨迹时，他估计，用几千个样本和当时最先进的ENIAC计算机，就可以将结果模拟运算出来；后来这项研究从宾夕法尼亚大学迁移到了马里兰州（Maryland）的阿伯丁试验场（Aberdeen
    Proving Ground）[^(\[11\])](#chapter9.xhtml#comment_5906)。尽管关于谁是第一个想到这个方法的人存在争议，但冯·诺依曼确实向ENIAC的工程师建议了一种改进计算机的方法，包括安装存储程序，以便计算机更高效地进行蒙特卡洛方法模拟运算；这个改进预示了普林斯顿大学MANIAC计算机存储程序架构的诞生。


    乔治·戴森（George Dyson）在关于计算机发展的《图灵的大教堂》（Turing''s Cathedral）一书中，描述了蒙特卡罗法的影响力：“蒙特卡罗法在数学物理学（mathematical
    physics）[^(\[12\])](#chapter9.xhtml#comment_5913)方面开辟了一个新领域。经典物理学[^(\[13\])](#chapter9.xhtml#comment_5918)（classical
    physics）考虑的是少量理想化对象的准确行为；统计力学[^(\[14\])](#chapter9.xhtml#comment_5923)（statisticalmechanics）考虑的是大量对象集体行为的平均值。与它们不同，蒙特卡罗法考虑的是在任意数量的单个对象的对象中，单独概率性行为，因此比以上两种方法都更接近物质宇宙的实际运作方式。”


    从投资组合、期权和金融衍生品的价值评估，到长期、复杂项目的风险判断，蒙特卡罗法在金融领域有各种各样的应用。从20世纪40年代后期开始，以恩里科·费米（Enrico
    Fermi）和尼古拉斯·梅特罗波利斯这样的物理学领军人为代表，掀起了一阵改进原始的冯·诺依曼算法的热潮。当传统计算方法，甚至是当时运算速度最快的计算机，也无法轻松解决随机问题的计算难题时，蒙特卡罗法的出现可谓开启了解决之道的一扇门。蒙特卡罗法及其他相关联的方法运用了随机模拟过程，这些方法通过随机和重复的行为去捕捉复杂的、不断变化的各种情景。其产出结果是一组概率值，而不是一个明确的值。这种随机过程佐证了乌拉姆最初的观察：玩游戏的次数越多，得到的近似值就越接近真实情况。


    随机要素的应用，不仅给看似混沌无序的系统带来了秩序，同时还在统计理论上起到关键的作用，这个统计理论就是现在广为人知的中心极限定理（Central Limit
    Theorem，CLT）。蒙特卡罗法可以用来模拟现实；中心极限定理是概率分析的关键技术。中心极限定理的提出，最早可追溯到18世纪早期法国数学家亚伯拉罕·棣莫弗（Abraham
    de Moivre）的假设；后来，另一位更著名的法国数学家——皮埃尔—西蒙·拉普拉斯（Pierre-Simon Laplace）于1812年重新发现这一定理，并将其推而广之。弗朗西斯·高尔顿（Francis
    Galton）是英国维多利亚女王时代的一位通才，也是优生学（Eugenics）的始创者。他在1889年称中心极限定理为“至高无上的非理性法则”，并认识到了从混沌到秩序、从非理性到理性的悖论。他写道：“无论何时，将由杂乱无章的元素组成的大量样本，根据其等级对其中的元素进行排序，一种无法预料的、最美丽的规律形态就会呈现，这证明中心极限定理的规律自始至终都蕴含其中。”


    中心极限定理是指，大千世界中，大量相互独立的随机变量的均值，在经过适当标准化后，将收敛于正态分布，表现为一种钟形曲线形状。中心极限定理被公认为概率论中的首席定理，发展出了数量众多的应用。它假定，总体变量的平均数将会呈正态分布，那么，只需要数量相对较少的样本就可以推出符合大数量样本的近似值。从口袋里掏出的硬币就可以检验这一定理的有效性：如果抛出一枚硬币，结果要么是正面朝上，要么是反面朝上，从理论上来讲，正反面朝上的概率各为50%；如果只抛10次，那么可能正面朝上的概率较大，也可能反面朝上的概率较大，结果可能会偏离理论概率；但是如果你抛100次，结果就会更趋近50%这个中心极限的概率；而如果你抛1000次，结果会更近一步靠近50%，这就是中心极限定理。


    交易股票也可以应用与中心极限定理类似的方法。如果你只买卖几只股票，即使只有一只严重下跌，你也将蒙受损失。过去几年，有多家对冲基金公司证明了这一点（当然，考虑到风险与回报之间存在正相关关系，高度集中的投资组合可能也会产生高回报）。如果你是一名交易员，你交易了一组股票的投资组合，其中的许多股票存在相关性，那么这些股票的收益往往会一起上升或下跌；相应地，你的工作绩效会走两个极端：要么做得很好，要么很糟糕。但是，如果你交易的是大量无相关性的股票，你就可以运用大数定律来获益。在16世纪，大数定律首次被提出。这是一个关于概率的定律，被包括在蒙特卡罗模拟方法中。它陈述了一个规律：实验次数越多，更多的结果就会越接近期望值的覆盖范围。这一规律也反映在赌场：赌徒在赌盘下注时，下注越多，结果越会反映出赌场预期的结果——永远都让赌场老板赚得盆满钵满。而在投资中，结果会覆盖股票的固有价值。


    让我们来思考两个简单化的交易情景。在第一个情景里，假定你在较少数量的证券上投资10000美元，投资期限250天，并承担盈亏的后果。结果投资顺利，你盈利55%，年化收益率就是60%。用夏普指数（Sharpe
    Ratio）[^(\[15\])](#chapter9.xhtml#comment_59231)来衡量经过考虑承担风险调整后的回报，是1.63，这对一般投资者而言是非常优秀的业绩了。相比较而言，购买国库券承担的市场风险几乎没有，购买国库券的夏普指数是零。


    然而在现实世界里，第一个情景里的投资组合的风险是有点难以承受的，因为它的收益不稳定性太大。尽管最后业绩不错，但如果我们截取其中一小段时间，就会得出一个不同的观点，比方说，在第27天到第103天这段时间，这个组合跌了20%。此外，如果我们从另一个视角观察这个投资策略，并运用蒙特卡罗模拟法，选取250天的价格，然后把它们随机洗牌10000次，为这篮子股票创造10000个不同的假设轨迹，然后分析这些轨迹中下跌情况。我们发现在这250天里，初始投资额会遭受10%或更大幅度的下跌损失的概率是30%，损失20%或更多的概率是5%。与其说这是投资，不如说是赌博，风险极大。


    现在思考一个稍微不同的投资方案：在同一时间，随机选取10个不同的投资策略，投资期限为250天。尽管总回报率是34%，比投资期限为250天的单一投资策略的总回报率低一点儿（一个任意的终点），不过这样的投资业绩还是挺让人赞叹的。在这种情况下，夏普指数却高出很多，达到3.11，这表明这一投资方案的风险波动性更低，结果是，损失的可能性小很多。这一年里，遭受2%的下跌损失的概率是20%，遭受1%的下跌损失的概率为40%。大数定律在这里受到两个不同的期望值驱动。第一个是整个投资期间的复合报酬率的期望值，第二个是最好每日回报的差异期望值，这个值最好接近于零。


    因为这10个投资策略是随机选取的，所以它们的相关性低得有点离谱。正因如此，回报的平滑效果可能显得有些夸张。但这个例子确实揭示出，一个恰当的、非相关性的投资组合策略能够降低市场风险，从而产生更加稳定的回报。


    2000年，我只有两个阿尔法模型，尽管我可以将它们应用于世界各地的交易所、成千上万种类型的证券交易中，但并不总是容易获得大数定律的完美平滑效果。目前，我已开始思考一个能够创造更多平滑效果的新方法，我一直梦想着能够不断扩展阿尔法模型的数量。


