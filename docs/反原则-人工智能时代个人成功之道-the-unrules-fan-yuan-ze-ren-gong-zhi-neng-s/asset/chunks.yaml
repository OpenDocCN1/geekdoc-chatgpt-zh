    ## 推荐序


    1988 年，在贝尔实验室（Bell Labs）工作时，我遇到了伊戈尔·图钦斯基。贝尔实验室是一家在重大科学与工程创新方面拥有悠久历史的美国机构。我们的办公室在同一层楼，我和伊戈尔有时会一起吃午餐，在周末聚会。当时，即使在汇聚世界各地诸多顶尖人才的贝尔实验室，伊戈尔也令我印象深刻，因为他总能迅速地从稀疏的数据或观察结果中提取见解和规则，仿佛他可以比其他人更快地预测未来。伊戈尔也深具分析能力，有着不同寻常的谦逊和一股子冷幽默感——这些品质裨益了他整个的职业生涯。


    在与伊戈尔成为朋友的 30 多年中，我得以近距离地观察他如何从贝尔实验室的一位杰出计算机科学家，到华尔街上的一名极为成功的交易员，再到世坤有限责任公司（以下简称“世坤投资”）这一全球领先的量化投资机构的创始人和首席执行官，这一路上的成长和演变。在这段非凡的旅程中，伊戈尔将他所学到的、所经历的、他的知识和智慧提炼成诸多精妙的规则，因此得以在金融、创业和个人生活中取得成功。他在《反原则》中解释了这些规则的本质，同时娴熟地将这些规则穿插于自己的生活点滴之中。这些规则令我深受启发，而他的成就和人生故事也同样瞩目。


    1991 年，我和伊戈尔都决定离开贝尔实验室去攻读 MBA。他去了宾夕法尼亚大学沃顿商学院，而我去了哥伦比亚大学。在商学院学习的第一年，伊戈尔想参加美国电话电报公司（AT＆T）举办的大学投资挑战赛：这是一个为期
    3 个月的选股比赛，吸引了来自数百所大学的 10000 多队学生。我跟着他一起报了名。伊戈尔迅速为我们提出了一些想法，他拿出自己的笔记本电脑，回测这些点子，精炼优化，然后进行更多的回测——全神贯注，直到一个好的公式被发现，整个过程大约只花了
    1 小时！有了伊戈尔这个公式以后，我们在所有竞争对手中的排名上升到第 12 名。当然，这个点子对于管理虚拟投资组合非常有效，但用来在现实生活中赚钱太冒险了。尽管如此，这个故事仍然显示了伊戈尔对于快速思考、大胆假设、严格测试验证，以及不断完善以得出有效公式这一模式的偏爱。


    后来，伊戈尔加入了一家名为千禧管理（Millennium Management）的知名对冲基金公司，并搬到了世界金融中心纽约。伊戈尔是量化金融的先驱之一。量化金融将严密的数学和科学研究方法与计算机运算能力相结合，通过寻找规则预测复杂的股票市场行为。凭借在将数据、观测结果和财务知识转换为高度复杂且响应迅速的算法这一方面的优势，伊戈尔在千禧管理创造了令人艳羡的业绩纪录。2005
    年，他开始与该公司创始人伊兹·英格兰德（Izzy Englander）讨论从公司剥离，成立世坤投资的事宜。


    2005 年年底，我与伊戈尔会面，讨论加入世坤投资的可能性。在那之前，我已经收购、重建和出售了一家软件公司，成为一名风险投资顾问，通过招聘高级管理人员、募集风险投资、优化营销策略帮助创业企业家和小型科技公司实现更快的增长。我问伊戈尔是否考虑过在中国开设办公室，那时我们都注意到了世坤投资在中国招揽有天赋的量化人才的重大机会，因为当时没有任何其他领先的量化公司在中国开展业务。而就个人而言，我是
    16 岁时从中国台湾来到美国明尼苏达州的，我也想要了解父亲出生的地方。我们聊了几分钟，就决定在中国成立一个量化研究办公室，这证明了伊戈尔的两个原则：第一，采取行动，别的都无所谓；第二，大胆思考，因为那更容易。


    从 2006 年开始，我们为世坤投资中国办公室远程招聘。到第一季度末，我们已经收到了来自中国著名大学——清华大学和北京大学的五名顶尖毕业生的入职承诺。到年中，我搬家到北京，并且制定了一个远程导师流程。在这个流程中，伊戈尔会通过电子邮件亲自向新员工的研究工作提出建议。在接下来的几年中，我们越来越擅长指导，将新手转变为量化研究专家的时间也越来越短；我们还将该研究模型扩展到更多的国家和地区，从
    2008 年的印度和 2009 年的以色列开始，并于 2012 年在上海设立了我们在中国的第二个办公室。如今，世坤投资在 13 个国家及地区拥有 23 个办事处。


    《反原则》讲述了伊戈尔的成长历程，他如何组建一支由顶级量化专家组成的全球团队，以及他和他的团队如何利用技术和数据来开发数百万个阿尔法[^(\[1\])]（alpha），并力图运用这些算法以更精细的细节来预测特定市场关系。


    本书还介绍了伊戈尔关于如何取得成功的哲学：采取行动，确立目标，发展意志力，持之以恒，扫除障碍，生活在焦虑的边缘，避免自大，不怪罪他人，最大限度地减少官僚主义，以及价值多元化。


    最后，这本书阐述了伊戈尔的人文关怀，他的理想，即无论身处何地，都为有才华的人们带来机会，并在全球范围内提供免费的金融工程大学教育。


    我本人觉得《反原则》里所传达的智慧深具启发意义且振奋人心，整本书读起来也很令人愉悦。我希望你也会。


    胡振华（Richard Hu）


    世坤投资公司副主席


