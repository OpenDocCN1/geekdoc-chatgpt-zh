- raw: '我一次又一次地提醒自己，坚持才有价值；彼得菲的看法是正确的。我设法让自己达到轻度焦虑的状态；压力太大可能反而会让业绩变差，但压力太小又不容易让人达到全力以赴的水平。而当我在某个问题上百思不得其解时，我有时会无法入睡，遇上这种时刻，我会强迫自己跑上5英里。如果你遇到和我一样的情况，你的身体也会因为失眠而付出代价，而且你会察觉失眠对你的惩罚，并陷入不断的失眠中。于是，我意识到一个非常浅显的道理：自大会扭曲现实。自大会令你用放大自我的方式去感知外界环境。但你要知道，环境不是因你而存在的，所以当你放大自我意识时，你对周围环境的理解和感知将会陷入一种虚构和想象的状态。而一旦开始产生想象的错觉，你就会做出错误的决定。想想尼布甲尼撒（Nebuchadnezzar）或者李尔王[^(\[1\])](#chapter9.xhtml#comment_5105)（King
    Lear），我们就会知道，骄兵必败。


    我认为“经济化表达”[^(\[2\])](#chapter9.xhtml#comment_5110)（economy of expression）是一种优秀品质。我从来不认为自己是那种特别健谈的人，但是我注意到，优秀的交易员的思维非常高效。而思维高效，不仅意味着思考方式的清晰和简洁，也塑造了直截了当和用词精准的表达方式。假如你一生所说的话的数量是恒定的，那么它们被言尽的时间越快，你这一生结束得就越快。


    ![](Images/cutq_119_39611_l.jpg)


    在金融上首次应用“阿尔法”这个词可以追溯到1968年。当年，迈克尔·詹森（Michael Jensen）在《金融学期刊》（The Journal of Finance）发表的一篇论文里首次提出了“詹森阿尔法”（Jensen''s
    alpha）一词，那时的他还是芝加哥大学一名年轻的经济学博士。“詹森阿尔法”评估投资组合的风险调整后回报，将其与市场平均水平相比较，通过超过理论预期的超额收益来衡量投资组合业绩的优劣水平。最终，“詹森阿尔法”一词被简称为“阿尔法”。


    后来，这个概念被对冲基金领域引用，用来描述基金经理希望传达给投资者的理念：它会带来高于市场平均水平的回报。在量化的世界里，阿尔法慢慢演变为用于预测证券价格（或相对价格）相关数学算法或模型的简称。阿尔法的定义方式有很多种，就像俄罗斯套娃一样彼此嵌套在一起，每一种定义都是同一个圆心扩散出去的同心圆。阿尔法是一种算法，是数学表达式、计算机源代码和配置参数的一个组合（即软件和硬件的设置）。如同其他运算规则一样，阿尔法包含计算机执行程序时所需要遵守的一定的规则（例如，if-then这样的假定条件，即如果事件X发生，那么该如何决策），其目的是预测金融证券的回报。市场上每时每刻都可能有无数的交易灵感产生，而每一个灵感都有可能蕴含一个阿尔法。我们之所以开发、测试阿尔法，并用阿尔法交易，是认为即使市场是充分有效的，但也存在某种力量，这种力量会驱动证券价格回归均衡，那就意味着差价和机会总是存在的。从广义上说，投资者总会千方百计地获取回报，那就需要克服市场大盘背景噪声所施加的影响，这样，投资者的行为一定会慢慢驱动价格朝向证券的内在价值变动。


    这听起来可能比较简单，但从市场的本质而言，情况就是这样的。尽管从原理角度看，阿尔法是非常简单的，但是我们用于构造阿尔法的计算工具和相关数据却是无比复杂的。举例来说，一个阿尔法可能被表示为一个数值矩阵，这个矩阵以证券为索引，因时间而发生变化［我们称它们为时变结构化向量[^(\[3\])](#chapter9.xhtml#comment_5216)（time-varying
    structures vectors）］。当想要以我们在全球不同市场上几千只股票为基准来生成预测时，这个向量的规模也就变得十分庞大。每天，软件都会重新评估阿尔法理念的逻辑基础，并基于市场条件给予向量新的数值。我们可以通过用阿尔法预测投资组合模型，将实现的理想化回报与历史日均回报相比较，从而评估阿尔法的业绩。日均回报相对于所估计的回报的波动率，即两者的比率，就是这个阿尔法的信息比率（Information
    Ratio，IR）。这一比率主要用于度量这个信号的强度及稳定性，以及这个阿尔法理念是否运作有效——显示我们找到的信号的强弱程度。信息比率会提示我们，正在处理的阿尔法是一个信号还是一个噪声。


    这听起来似乎难以理解。事实上，我们在量化投资上所做的工作就是通过概率论和统计的方法，让我们的投资胜算概率更大，请把这点牢牢记在心里。在世坤投资，我们构建、测试阿尔法，并用它进行投资，最主要的关注点是减少或控制相关性，即要让两个或多个因素之间的关系或联系是中性的，互不干扰。如果把量化投资比作一场棒球赛，我们并不追求大获全胜、打出全垒打而得分，我们只是尽最大努力以避免灾难，并努力产出高于整体市场回报水平的稳定回报。


    1992年，在美国电话电报公司组织的大学生投资挑战赛中，胡振华和我为了获得高分而尝试的投资策略中隐含赌运气的成分。如果我们的运气足够好，那么我们也许会赶上一波市场行情，搭上市场的顺风车。所以问题就在于，依靠运气具有极大的不稳定性，我们运气可能很好，也可能极差。在我们的公司里，我们可不希望发生后一种情况。我们的主要目标之一就是，避免突然出现流氓波，绝不能被它的惊涛骇浪吞噬。在各种违约事件、互联网泡沫、量化投资振荡，以及金融危机中，大量投资者因价格持续下跌而损失惨重。当这些市场急剧下跌的突发事件发生时，我们希望能将它们对公司业绩的影响降至最小。但是这并不意味着我们不能采取一些积极的市场策略。在市场环境下行期间，我们要把握好一条关键的原则：冒最低的风险，并且控制好损失。相比其他策略，积极策略能更好地迫使市场对你的行动做出反应，你将会掌握控制权，可以有更多的配置选择和更高的成功概率。但是这条原则并不是万能的。如果它没有奏效，你还需要有备用的退出计划。


    ![](Images/cutq_122_465_l.jpg)


    让我们再回到北海看看。那里的海风还在狂啸，海浪还在怒吼，风险时刻出没，给我们讲述了一个有启发性的故事：在可怕的巨浪里，一艘船为避免风险而设计了万全之策，却不幸地宣告失败。这艘船属于挪威一家私营航运公司，这家公司专注于为深水油气钻井平台提供海上运输服务。公司的创始人不是等闲之辈，而是一位挪威的经济学家，名叫彼得·洛朗（Peter
    Lorange）。他曾在沃顿商学院和麻省理工学院斯隆管理学院任教，并且担任过瑞士洛桑国际管理学院和奥斯陆的BI挪威商学院的院长，后者是全欧洲第二大规模的商学院。他的公司虽然规模不大，只有两艘船舶，但是这两艘船舶都是功能非常复杂并且造价十分昂贵的，任何一艘出现事故，对公司而言都将是毁灭性的打击。


    洛朗是位罕见的、见多识广的业主，他拥有耶鲁大学运营管理学位以及哈佛大学商学博士学位，对于风险控制领域颇有研究。他的公司遭遇的一次最大风险，就是船舶在北海发生发动机故障，那次故障使他的船舶只能任由海浪摆布。万幸的是，蒙海浪慈悲为怀，船舶并没有沉没。洛朗针对这种现象着手进行了成本效益分析。计算结果显示，在每艘船上安装5台发动机，发动机同时损坏的概率很低，可以达到抗风险最优水平，这样既可以消除整体风险，同时也可以保证购买及维护发动机所产生的相关成本在可承受的范围内。考虑到船只正常航行的速度和机动性，一般需要有两台发动机在同一时间工作。洛朗的假设条件是，万一其中一台发动机出现故障，靠另外一台发动机独立工作来应急，也能够在最猛烈的风暴中成功地驱动船舶航行。因此，洛朗的备用发动机其实变得冗余了，发动机总数是所需数量的5倍：只有当所有这5台发动机都失效时，船舶才真正受到威胁。那么，这种情况发生的概率是多少呢？好吧，我们先来谈其中一种概率，它是用来统计柴油发动机在大海里“失效时间”的概率的。那么，1台柴油发动机从运转良好到失效大概需要多长时间呢（特别是在大海环境恶劣的运行情况下）？粗略估计，1台发动机在一年之内发生故障的概率大约是千分之一，也就是0.001。而所有5台引擎同时失败的概率是0.001的5次方，也就是千万亿分之一，这个概率可以算得上是一个相当安全的水平。


    然而，在1992年一个平静的日子里，当洛朗的一艘船舶正在北海正常航行时，从一个奇怪的角度涌来一个巨大的波浪，让船舶遭受了严重的撞击。当时船舶损坏程度很小，也没有人员受伤，但是一束小火苗意外点燃了控制室外面的配电板，燃烧了20分钟之后，船员才发现火情并扑灭大火。结果，正在运行的2个发动机彻底坏掉了，剩下的3个备用发动机都无法启动，船舶只能在水中无望地四处漂流。幸运的是，当时周围的海域里还有其他船舶，其中一艘把洛朗的船拖到海港去修理了。


    不是说只有千万亿分之一的概率吗？这艘船配备了高功率、保养到位的柴油电气驱动装置，这些装置就像柴油机车里的发动机。这些发动机产生的电能储存在蓄电池里，以电流的形式驱动传动轴运转。5台发动机的控制线通过直径几英寸[^(\[4\])](#chapter9.xhtml#comment_5426)的导管，穿过蓄电池所在的位置，而点燃配电板的火苗烧坏了导管，使所有发动机的控制线都无法正常使用。这种情况发生的概率，和5台发动机因各自原因发生事故并同时失效的概率没有任何关系。这一概率不是独立产生的，而是耦合而成的，事故看起来是由5个独立的事件引发的，实际上是由影响5台发动机同时失效的一个事件引发的。


    这个故事阐明了很多趋势，这些趋势为耶鲁大学社会学家查尔斯·佩罗（Charles Perrow）称作的“常态（或称为系统）意外事故”提供了佐证。佩罗在其《高风险技术与“正常”事故》（Normal
    Accidents）一书中写道，正常事故“是不可避免的，系统具有多重特征，事故是由多种无法知晓的方式之间的相互作用而导致的”。他指出了两种通常导致灾难的系统性趋势：具有高度交互的复杂性，而且包含了许多相互联结的组成部分；同时这些组成部分之间紧耦合在一起。佩罗写道，灾难会一直伴随我们。与往日的灾难不同的是，今天“新产品设计得如此复杂，以至于我们无法预测，这些最终不可避免的失败结果之间发生了怎样的相互作用”。操作者无法解决其中的问题，因为对于他们来说，这个系统已经复杂得远远超过他们的处理能力。


    不那么紧耦合的复杂系统也可能会发生故障，但是在这种情形下，问题可以被更好地限定在一定范围内。（我们通常要在耦合系统所具备的工作效率与系统安全性之间做出权衡和取舍。严密集成的系统可能效率是最优的，但同时也伴随着高风险，一旦发生事故，负面影响会迅速扩大。）耦合作用是指，在一些较大的系统内，相互独立的各组成部分之间有交互作用。一旦其中一个部分失效，其他部分也会导致系统不能工作，就像船只发动机的电气系统会因一场火灾而无法运行。


    在上述语境中，耦合大致可以作为相关性的代名词。


    ![](Images/cutq_126_53551_l.jpg)


    对北海的风险管理与平凡的韭菜看上去没有什么共性，实际上，在现代金融体系下，二者之间具有很强的共性。韭菜有点像是一棵微型的树，是一种气味温和、有点像洋葱口味的蔬菜。它被种植在土壤中，有着肉质的白色鳞茎，根茎呈绿色，顶部状如茅草。无论是厨艺大师还是家庭主妇，在他们的眼中，韭菜的所有部位不都是可食用的。对他们而言，根部是不能吃的，通常只能被切掉并扔到堆肥箱中；顶部的绿叶又平又干，通常也被扔掉；韭菜最好的部分就是从白色的鳞茎到浅绿色的中部。


    所以，韭菜并不全身都是宝。即使是被厨艺大师慷慨买下的最优质的韭菜，也有被丢弃的部分；即使是韭菜最差的部分，也可以被利用。这就引出了一个结论：对于一个韭菜农夫来讲，获得最佳回报的方法不是出售整根韭菜，而是将韭菜品质最好的鳞茎部分卖给厨艺大师，把品质较差的部分卖给那些不那么挑剔的、时刻把预算记在心里的家庭主妇。那么怎样才能做到这一点呢？答案是，把韭菜装箱，排列好根部末端，然后用切割机将韭菜垂直切下，最终，韭菜就被分成各种各样的韭菜段。品质好的韭菜从鳞茎开始，越接近绿色的茎叶部分，质量就逐渐降低。这样，我们就可以丢弃无用的根部和茎叶，将这些重新“包装的”成捆的韭菜段卖给顾客，而不再是简单出售整根的一捆韭菜。顾客也可以在价格承受范围内，挑选购买他们想要的那段韭菜。


    实际上，上述描述的就是在金融界日益普遍的一种实践做法：资产证券化。把韭菜替换为数以千计的抵押贷款，你就会获得一个抵押支持债券（Mortgage-Backed
    Security，MBS）。把抵押支持债券变成一个合成证券[^(\[5\])](#chapter9.xhtml#comment_5575)（synthetic
    security）的过程，和前面所述的韭菜“分段打包”的操作大体相同。根据贷款质量的不同，将资金池中的抵押支持债券进行分级打包：把违约风险更高的合约打底，然后再把更安全的归在另一级。分别出售这些不同“分级”的证券给那些有着不同风险偏好的机构投资者——从通常要求只购买高质量抵押证券的银行，到具有一定投机性的机构投资者（这类投资者愿意为获取更高收益而冒更高的风险）。打包不同风险的债券背后的理论基础是，每一级的债券都彼此独立，就好像洛朗船只上的发动机，或者不同部分的韭菜段一样，或者抛出去的硬币。


    抵押支持债券设计者们假定，一个抵押贷款违约的风险性与第二个抵押贷款违约的风险之间的关联性非常低。特别是，一个层级的抵押贷款［比如特大型贷款[^(\[6\])](#chapter9.xhtml#comment_5582)（jumbo
    loan）］与另一层级的抵押贷款［比方几乎不需要出具任何证明材料就能申请的次级贷款[^(\[7\])](#chapter9.xhtml#comment_5636)（subprime
    loan）］看上去几乎没有任何关联。他们深信这些抵押贷款之间本质上是不相关的。不幸的是，2008年的美国次贷危机证明这一假定完全是灾难性的错误。事实上，这些数量庞大的抵押贷款与房地产市场高度相关，是房地产市场的关键组成部分，其估值创下历史新高，杠杆率也很高。不同层级的债券内部及相互之间的违约风险是被紧耦合在一起的。从更大范围的全球金融系统来看，不同证券的内部与它们之间的风险也是一样的。


    我们可以用另一种方式解释这个现象：如果一个抵押贷款的违约行为显著影响另一个抵押贷款的命运，或者因为一个共同的原因，这两个抵押贷款同时违约，那么认为这两个抵押贷款没有相关性，并把它们分入不同的“韭菜段”，只不过制造了一种关于安全性的“错觉”。这些最初的贷款和被分级后合成后的贷款在本质上是一模一样的。但经过所谓的“聪明地将不同风险重新配置”，卖方就可以把所有的抵押贷款进行错误定价，将其粉饰为神话并打包销售给投资者。


    这就是相关性的危害所在。这就好像一个黑色霉菌会影响整包韭菜一样。无论韭菜段的品质是高级、低级，还是中级，霉菌都会从一段韭菜扩散到下一段韭菜。


    在洛朗的案例里，那些用来降低并分散风险的程序，在某些情况下反而可能增加风险。在那场金融危机发生之前，一些经验较为丰富的投资者相信，资产证券化可以降低甚至消除风险，所以任由资产证券化泛滥，从而堆积了大量风险。从事经济活动的人由于感到自身不会被后果危害，而故意放纵风险，这种现象被称作道德风险[^(\[8\])](#chapter9.xhtml#comment_5692)（moral
    hazard）。它掩饰了全球经济的发展动力实际上彼此关联的事实。事实上，风险并不是相互独立的。金融危机已经证明，相关性存在于金融市场的每一个层级中，从单个股票到金融衍生品，再到全部经济体。投资者应该吸取教训：永远不要怀疑系统中的所有部分其实都是耦合的、具有相关性的。


    全世界的人都忽略了这个教训。因为系统太庞大、耦合太复杂，所以没有人能够真正地看到产生危机的因素间的相关性。许多人都会自欺欺人，认为世界上还有很多聪明人，总不会大家都犯错吧。


    要做好量化投资，你必须谨慎地使用模拟方法，以便将相关性降至最低。在投资时，人们有一个共同的心理陷阱，比如相信数据模型是一把万能钥匙，可用于解释市场某一方面的行为。事实上，即使解释得通，那也可能只是偶然而已。你必须保持极度诚实，将自我意识降到最低，还要有成功的信念。不过，当一个人变得更成功时，傲慢心理往往就会乘虚而入，这个人就更难做到这些了。如果只是产出一堆投资理念，在没有认真地进行回测实验的情况下，就认为这些投资理念在市场上会有效，这是非常糟糕的做法。就像我在沃顿商学院的那些同学一样，他们个个自以为是，认定自己是优于一般水准的。实际上，这些自大的想法都经不起市场相关性现实的无情检验。


    在投资中，几乎每个人都会采用某种形式的回测实验，并通过一些历史数据库进行投资或模型运算。诚然，一些投资者可能会拥有更多、更好的数据，这便造成了投资效果有好有坏。回测对于产生阿尔法固然至关重要，但是可能会产生备受关注的安全性问题，从而导致道德风险。虽然这听起来像是陈词滥调，但过去的成功并不能保证未来一直成功。所以，在模拟产生阿尔法的过程中，我们一定要用符合反原则的原则来建立阿尔法：许多阿尔法是没有效果的，也没有任何一个阿尔法会永久有效。用概率论的相关术语来讲，每个阿尔法的效用都在0和1之间，“0”表示这个阿尔法从来没有发挥作用，“1”表示这个阿尔法一直在发挥作用。


    ![](Images/cutq_131_1396_l.jpg)


    学习量化投资就像学习量子物理学和赌博一样，都需要精通概率和统计学。这门学科被广泛传授，但大多数人很难得心应手地掌握。量化投资是一个数字游戏。除此之外，量化投资的一些关键技术植根于第二次世界大战期间和之后的核武器计划，特别要归功于约翰·冯·诺依曼和他最亲密的搭档——物理学家斯塔尼斯拉夫·乌拉姆（Stanislaw
    Ulam）。乌拉姆出生于波兰，是冯·诺依曼的密友、搭档和工作伙伴。


    第二次世界大战后，乌拉姆放弃了“曼哈顿计划”，离开了洛斯阿拉莫斯，到南加利福尼亚大学（University of Southern California，又译南加州大学）任教。在那里，他由于感染病毒性脑炎而几乎失去生命。万幸的是，他活了过来，不幸的是，他的身体状况只能说是勉强恢复健康。医生告诫他要注意休息，避免剧烈的脑力劳动。于是他放下工作，玩起了纸牌接龙游戏。很快，他就开始尝试计算甘菲德纸牌游戏（Canfield
    Solitaire）[^(\[9\])](#chapter9.xhtml#comment_5798)接龙成功的概率是多少。甘菲德纸牌游戏与其他流行纸牌游戏的一个区别在于，前者的成功概率比较低。在尝试计算52张纸牌的集合接龙成功的概率以后，乌拉姆发现，直接计算所需要的运算力，远远超越了他的世界级数学大脑的能力。于是，乌拉姆采用了另一个方法，他试着玩了100次游戏，然后统计游戏成功的次数。这是一个简单、粗略但实用的模拟运算。但是，乌拉姆意识到，玩游戏的次数越多，计算结果的近似值就会越精确。他迅速认识到，这一思路可以应用于解决氢弹项目上的问题。他在回忆录里写道：“它让我意识到，这种方法同样适用于所有的计算过程，包括那些‘分支事件’。”'
  fmt: '

    # 量化投资与风险思考


    ## 自我认知与焦虑管理

    我一次又一次地提醒自己，坚持才有价值；彼得菲的看法是正确的。我设法让自己达到轻度焦虑的状态；压力太大可能反而会让业绩变差，但压力太小又不容易让人达到全力以赴的水平。而当我在某个问题上百思不得其解时，我有时会无法入睡，遇上这种时刻，我会强迫自己跑上5英里。如果你遇到和我一样的情况，你的身体也会因为失眠而付出代价，而且你会察觉失眠对你的惩罚，并陷入不断的失眠中。于是，我意识到一个非常浅显的道理：自大会扭曲现实。自大会令你用放大自我的方式去感知外界环境。但你要知道，环境不是因你而存在的，所以当你放大自我意识时，你对周围环境的理解和感知将会陷入一种虚构和想象的状态。而一旦开始产生想象的错觉，你就会做出错误的决定。想想尼布甲尼撒（Nebuchadnezzar）或者李尔王[^(\[1\])](#chapter9.xhtml#comment_5105)（King
    Lear），我们就会知道，骄兵必败。


    ## 经济化表达

    我认为“经济化表达”[^(\[2\])](#chapter9.xhtml#comment_5110)（economy of expression）是一种优秀品质。我从来不认为自己是那种特别健谈的人，但是我注意到，优秀的交易员的思维非常高效。而思维高效，不仅意味着思考方式的清晰和简洁，也塑造了直截了当和用词精准的表达方式。假如你一生所说的话的数量是恒定的，那么它们被言尽的时间越快，你这一生结束得就越快。


    ![](Images/cutq_119_39611_l.jpg)


    ## 阿尔法的起源与演进

    在金融上首次应用“阿尔法”这个词可以追溯到1968年。当年，迈克尔·詹森（Michael Jensen）在《金融学期刊》（The Journal of Finance）发表的一篇论文里首次提出了“詹森阿尔法”（Jensen''s
    alpha）一词，那时的他还是芝加哥大学一名年轻的经济学博士。“詹森阿尔法”评估投资组合的风险调整后回报，将其与市场平均水平相比较，通过超过理论预期的超额收益来衡量投资组合业绩的优劣水平。最终，“詹森阿尔法”一词被简称为“阿尔法”。


    后来，这个概念被对冲基金领域引用，用来描述基金经理希望传达给投资者的理念：它会带来高于市场平均水平的回报。在量化的世界里，阿尔法慢慢演变为用于预测证券价格（或相对价格）相关数学算法或模型的简称。阿尔法的定义方式有很多种，就像俄罗斯套娃一样彼此嵌套在一起，每一种定义都是同一个圆心扩散出去的同心圆。阿尔法是一种算法，是数学表达式、计算机源代码和配置参数的一个组合（即软件和硬件的设置）。如同其他运算规则一样，阿尔法包含计算机执行程序时所需要遵守的一定的规则（例如，if-then这样的假定条件，即如果事件X发生，那么该如何决策），其目的是预测金融证券的回报。市场上每时每刻都可能有无数的交易灵感产生，而每一个灵感都有可能蕴含一个阿尔法。我们之所以开发、测试阿尔法，并用阿尔法交易，是认为即使市场是充分有效的，但也存在某种力量，这种力量会驱动证券价格回归均衡，那就意味着差价和机会总是存在的。从广义上说，投资者总会千方百计地获取回报，那就需要克服市场大盘背景噪声所施加的影响，这样，投资者的行为一定会慢慢驱动价格朝向证券的内在价值变动。


    ## 阿尔法的量化实践与信息比率

    这听起来可能比较简单，但从市场的本质而言，情况就是这样的。尽管从原理角度看，阿尔法是非常简单的，但是我们用于构造阿尔法的计算工具和相关数据却是无比复杂的。举例来说，一个阿尔法可能被表示为一个数值矩阵，这个矩阵以证券为索引，因时间而发生变化［我们称它们为时变结构化向量[^(\[3\])](#chapter9.xhtml#comment_5216)（time-varying
    structures vectors）］。当想要以我们在全球不同市场上几千只股票为基准来生成预测时，这个向量的规模也就变得十分庞大。每天，软件都会重新评估阿尔法理念的逻辑基础，并基于市场条件给予向量新的数值。我们可以通过用阿尔法预测投资组合模型，将实现的理想化回报与历史日均回报相比较，从而评估阿尔法的业绩。日均回报相对于所估计的回报的波动率，即两者的比率，就是这个阿尔法的信息比率（Information
    Ratio，IR）。这一比率主要用于度量这个信号的强度及稳定性，以及这个阿尔法理念是否运作有效——显示我们找到的信号的强弱程度。信息比率会提示我们，正在处理的阿尔法是一个信号还是一个噪声。


    这听起来似乎难以理解。事实上，我们在量化投资上所做的工作就是通过概率论和统计的方法，让我们的投资胜算概率更大，请把这点牢牢记在心里。在世坤投资，我们构建、测试阿尔法，并用它进行投资，最主要的关注点是减少或控制相关性，即要让两个或多个因素之间的关系或联系是中性的，互不干扰。如果把量化投资比作一场棒球赛，我们并不追求大获全胜、打出全垒打而得分，我们只是尽最大努力以避免灾难，并努力产出高于整体市场回报水平的稳定回报。


    1992年，在美国电话电报公司组织的大学生投资挑战赛中，胡振华和我为了获得高分而尝试的投资策略中隐含赌运气的成分。如果我们的运气足够好，那么我们也许会赶上一波市场行情，搭上市场的顺风车。所以问题就在于，依靠运气具有极大的不稳定性，我们运气可能很好，也可能极差。在我们的公司里，我们可不希望发生后一种情况。我们的主要目标之一就是，避免突然出现流氓波，绝不能被它的惊涛骇浪吞噬。在各种违约事件、互联网泡沫、量化投资振荡，以及金融危机中，大量投资者因价格持续下跌而损失惨重。当这些市场急剧下跌的突发事件发生时，我们希望能将它们对公司业绩的影响降至最小。但是这并不意味着我们不能采取一些积极的市场策略。在市场环境下行期间，我们要把握好一条关键的原则：冒最低的风险，并且控制好损失。相比其他策略，积极策略能更好地迫使市场对你的行动做出反应，你将会掌握控制权，可以有更多的配置选择和更高的成功概率。但是这条原则并不是万能的。如果它没有奏效，你还需要有备用的退出计划。


    ![](Images/cutq_122_465_l.jpg)


    ## 北海案例：系统风险与耦合

    让我们再回到北海看看。那里的海风还在狂啸，海浪还在怒吼，风险时刻出没，给我们讲述了一个有启发性的故事：在可怕的巨浪里，一艘船为避免风险而设计了万全之策，却不幸地宣告失败。这艘船属于挪威一家私营航运公司，这家公司专注于为深水油气钻井平台提供海上运输服务。公司的创始人不是等闲之辈，而是一位挪威的经济学家，名叫彼得·洛朗（Peter
    Lorange）。他曾在沃顿商学院和麻省理工学院斯隆管理学院任教，并且担任过瑞士洛桑国际管理学院和奥斯陆的BI挪威商学院的院长，后者是全欧洲第二大规模的商学院。他的公司虽然规模不大，只有两艘船舶，但是这两艘船舶都是功能非常复杂并且造价十分昂贵的，任何一艘出现事故，对公司而言都将是毁灭性的打击。


    洛朗是位罕见的、见多识广的业主，他拥有耶鲁大学运营管理学位以及哈佛大学商学博士学位，对于风险控制领域颇有研究。他的公司遭遇的一次最大风险，就是船舶在北海发生发动机故障，那次故障使他的船舶只能任由海浪摆布。万幸的是，蒙海浪慈悲为怀，船舶并没有沉没。洛朗针对这种现象着手进行了成本效益分析。计算结果显示，在每艘船上安装5台发动机，发动机同时损坏的概率很低，可以达到抗风险最优水平，这样既可以消除整体风险，同时也可以保证购买及维护发动机所产生的相关成本在可承受的范围内。考虑到船只正常航行的速度和机动性，一般需要有两台发动机在同一时间工作。洛朗的假设条件是，万一其中一台发动机出现故障，靠另外一台发动机独立工作来应急，也能够在最猛烈的风暴中成功地驱动船舶航行。因此，洛朗的备用发动机其实变得冗余了，发动机总数是所需数量的5倍：只有当所有这5台发动机都失效时，船舶才真正受到威胁。那么，这种情况发生的概率是多少呢？好吧，我们先来谈其中一种概率，它是用来统计柴油发动机在大海里“失效时间”的概率的。那么，1台柴油发动机从运转良好到失效大概需要多长时间呢（特别是在大海环境恶劣的运行情况下）？粗略估计，1台发动机在一年之内发生故障的概率大约是千分之一，也就是0.001。而所有5台引擎同时失败的概率是0.001的5次方，也就是千万亿分之一，这个概率可以算得上是一个相当安全的水平。


    然而，在1992年一个平静的日子里，当洛朗的一艘船舶正在北海正常航行时，从一个奇怪的角度涌来一个巨大的波浪，让船舶遭受了严重的撞击。当时船舶损坏程度很小，也没有人员受伤，但是一束小火苗意外点燃了控制室外面的配电板，燃烧了20分钟之后，船员才发现火情并扑灭大火。结果，正在运行的2个发动机彻底坏掉了，剩下的3个备用发动机都无法启动，船舶只能在水中无望地四处漂流。幸运的是，当时周围的海域里还有其他船舶，其中一艘把洛朗的船拖到海港去修理了。


    不是说只有千万亿分之一的概率吗？这艘船配备了高功率、保养到位的柴油电气驱动装置，这些装置就像柴油机车里的发动机。这些发动机产生的电能储存在蓄电池里，以电流的形式驱动传动轴运转。5台发动机的控制线通过直径几英寸[^(\[4\])](#chapter9.xhtml#comment_5426)的导管，穿过蓄电池所在的位置，而点燃配电板的火苗烧坏了导管，使所有发动机的控制线都无法正常使用。这种情况发生的概率，和5台发动机因各自原因发生事故并同时失效的概率没有任何关系。这一概率不是独立产生的，而是耦合而成的，事故看起来是由5个独立的事件引发的，实际上是由影响5台发动机同时失效的一个事件引发的。


    这个故事阐明了很多趋势，这些趋势为耶鲁大学社会学家查尔斯·佩罗（Charles Perrow）称作的“常态（或称为系统）意外事故”提供了佐证。佩罗在其《高风险技术与“正常”事故》（Normal
    Accidents）一书中写道，正常事故“是不可避免的，系统具有多重特征，事故是由多种无法知晓的方式之间的相互作用而导致的”。他指出了两种通常导致灾难的系统性趋势：具有高度交互的复杂性，而且包含了许多相互联结的组成部分；同时这些组成部分之间紧耦合在一起。佩罗写道，灾难会一直伴随我们。与往日的灾难不同的是，今天“新产品设计得如此复杂，以至于我们无法预测，这些最终不可避免的失败结果之间发生了怎样的相互作用”。操作者无法解决其中的问题，因为对于他们来说，这个系统已经复杂得远远超过他们的处理能力。


    不那么紧耦合的复杂系统也可能会发生故障，但是在这种情形下，问题可以被更好地限定在一定范围内。（我们通常要在耦合系统所具备的工作效率与系统安全性之间做出权衡和取舍。严密集成的系统可能效率是最优的，但同时也伴随着高风险，一旦发生事故，负面影响会迅速扩大。）耦合作用是指，在一些较大的系统内，相互独立的各组成部分之间有交互作用。一旦其中一个部分失效，其他部分也会导致系统不能工作，就像船只发动机的电气系统会因一场火灾而无法运行。


    在上述语境中，耦合大致可以作为相关性的代名词。


    ![](Images/cutq_126_53551_l.jpg)


    ## 资产证券化、韭菜比喻与相关性危害

    对北海的风险管理与平凡的韭菜看上去没有什么共性，实际上，在现代金融体系下，二者之间具有很强的共性。韭菜有点像是一棵微型的树，是一种气味温和、有点像洋葱口味的蔬菜。它被种植在土壤中，有着肉质的白色鳞茎，根茎呈绿色，顶部状如茅草。无论是厨艺大师还是家庭主妇，在他们的眼中，韭菜的所有部位不都是可食用的。对他们而言，根部是不能吃的，通常只能被切掉并扔到堆肥箱中；顶部的绿叶又平又干，通常也被扔掉；韭菜最好的部分就是从白色的鳞茎到浅绿色的中部。


    所以，韭菜并不全身都是宝。即使是被厨艺大师慷慨买下的最优质的韭菜，也有被丢弃的部分；即使是韭菜最差的部分，也可以被利用。这就引出了一个结论：对于一个韭菜农夫来讲，获得最佳回报的方法不是出售整根韭菜，而是将韭菜品质最好的鳞茎部分卖给厨艺大师，把品质较差的部分卖给那些不那么挑剔的、时刻把预算记在心里的家庭主妇。那么怎样才能做到这一点呢？答案是，把韭菜装箱，排列好根部末端，然后用切割机将韭菜垂直切下，最终，韭菜就被分成各种各样的韭菜段。品质好的韭菜从鳞茎开始，越接近绿色的茎叶部分，质量就逐渐降低。这样，我们就可以丢弃无用的根部和茎叶，将这些重新“包装的”成捆的韭菜段卖给顾客，而不再是简单出售整根的一捆韭菜。顾客也可以在价格承受范围内，挑选购买他们想要的那段韭菜。


    实际上，上述描述的就是在金融界日益普遍的一种实践做法：资产证券化。把韭菜替换为数以千计的抵押贷款，你就会获得一个抵押支持债券（Mortgage-Backed
    Security，MBS）。把抵押支持债券变成一个合成证券[^(\[5\])](#chapter9.xhtml#comment_5575)（synthetic
    security）的过程，和前面所述的韭菜“分段打包”的操作大体相同。根据贷款质量的不同，将资金池中的抵押支持债券进行分级打包：把违约风险更高的合约打底，然后再把更安全的归在另一级。分别出售这些不同“分级”的证券给那些有着不同风险偏好的机构投资者——从通常要求只购买高质量抵押证券的银行，到具有一定投机性的机构投资者（这类投资者愿意为获取更高收益而冒更高的风险）。打包不同风险的债券背后的理论基础是，每一级的债券都彼此独立，就好像洛朗船只上的发动机，或者不同部分的韭菜段一样，或者抛出去的硬币。


    抵押支持债券设计者们假定，一个抵押贷款违约的风险性与第二个抵押贷款违约的风险之间的关联性非常低。特别是，一个层级的抵押贷款［比如特大型贷款[^(\[6\])](#chapter9.xhtml#comment_5582)（jumbo
    loan）］与另一层级的抵押贷款［比方几乎不需要出具任何证明材料就能申请的次级贷款[^(\[7\])](#chapter9.xhtml#comment_5636)（subprime
    loan）］看上去几乎没有任何关联。他们深信这些抵押贷款之间本质上是不相关的。不幸的是，2008年的美国次贷危机证明这一假定完全是灾难性的错误。事实上，这些数量庞大的抵押贷款与房地产市场高度相关，是房地产市场的关键组成部分，其估值创下历史新高，杠杆率也很高。不同层级的债券内部及相互之间的违约风险是被紧耦合在一起的。从更大范围的全球金融系统来看，不同证券的内部与它们之间的风险也是一样的。


    我们可以用另一种方式解释这个现象：如果一个抵押贷款的违约行为显著影响另一个抵押贷款的命运，或者因为一个共同的原因，这两个抵押贷款同时违约，那么认为这两个抵押贷款没有相关性，并把它们分入不同的“韭菜段”，只不过制造了一种关于安全性的“错觉”。这些最初的贷款和被分级后合成后的贷款在本质上是一模一样的。但经过所谓的“聪明地将不同风险重新配置”，卖方就可以把所有的抵押贷款进行错误定价，将其粉饰为神话并打包销售给投资者。


    这就是相关性的危害所在。这就好像一个黑色霉菌会影响整包韭菜一样。无论韭菜段的品质是高级、低级，还是中级，霉菌都会从一段韭菜扩散到下一段韭菜。


    在洛朗的案例里，那些用来降低并分散风险的程序，在某些情况下反而可能增加风险。在那场金融危机发生之前，一些经验较为丰富的投资者相信，资产证券化可以降低甚至消除风险，所以任由资产证券化泛滥，从而堆积了大量风险。从事经济活动的人由于感到自身不会被后果危害，而故意放纵风险，这种现象被称作道德风险[^(\[8\])](#chapter9.xhtml#comment_5692)（moral
    hazard）。它掩饰了全球经济的发展动力实际上彼此关联的事实。事实上，风险并不是相互独立的。金融危机已经证明，相关性存在于金融市场的每一个层级中，从单个股票到金融衍生品，再到全部经济体。投资者应该吸取教训：永远不要怀疑系统中的所有部分其实都是耦合的、具有相关性的。


    全世界的人都忽略了这个教训。因为系统太庞大、耦合太复杂，所以没有人能够真正地看到产生危机的因素间的相关性。许多人都会自欺欺人，认为世界上还有很多聪明人，总不会大家都犯错吧。


    要做好量化投资，你必须谨慎地使用模拟方法，以便将相关性降至最低。在投资时，人们有一个共同的心理陷阱，比如相信数据模型是一把万能钥匙，可用于解释市场某一方面的行为。事实上，即使解释得通，那也可能只是偶然而已。你必须保持极度诚实，将自我意识降到最低，还要有成功的信念。不过，当一个人变得更成功时，傲慢心理往往就会乘虚而入，这个人就更难做到这些了。如果只是产出一堆投资理念，在没有认真地进行回测实验的情况下，就认为这些投资理念在市场上会有效，这是非常糟糕的做法。就像我在沃顿商学院的那些同学一样，他们个个自以为是，认定自己是优于一般水准的。实际上，这些自大的想法都经不起市场相关性现实的无情检验。


    在投资中，几乎每个人都会采用某种形式的回测实验，并通过一些历史数据库进行投资或模型运算。诚然，一些投资者可能会拥有更多、更好的数据，这便造成了投资效果有好有坏。回测对于产生阿尔法固然至关重要，但是可能会产生备受关注的安全性问题，从而导致道德风险。虽然这听起来像是陈词滥调，但过去的成功并不能保证未来一直成功。所以，在模拟产生阿尔法的过程中，我们一定要用符合反原则的原则来建立阿尔法：许多阿尔法是没有效果的，也没有任何一个阿尔法会永久有效。用概率论的相关术语来讲，每个阿尔法的效用都在0和1之间，“0”表示这个阿尔法从来没有发挥作用，“1”表示这个阿尔法一直在发挥作用。


    ![](Images/cutq_131_1396_l.jpg)


    ## 量化投资的概率本质

    学习量化投资就像学习量子物理学和赌博一样，都需要精通概率和统计学。这门学科被广泛传授，但大多数人很难得心应手地掌握。量化投资是一个数字游戏。除此之外，量化投资的一些关键技术植根于第二次世界大战期间和之后的核武器计划，特别要归功于约翰·冯·诺依曼和他最亲密的搭档——物理学家斯塔尼斯拉夫·乌拉姆（Stanislaw
    Ulam）。乌拉姆出生于波兰，是冯·诺依曼的密友、搭档和工作伙伴。


    第二次世界大战后，乌拉姆放弃了“曼哈顿计划”，离开了洛斯阿拉莫斯，到南加利福尼亚大学（University of Southern California，又译南加州大学）任教。在那里，他由于感染病毒性脑炎而几乎失去生命。万幸的是，他活了过来，不幸的是，他的身体状况只能说是勉强恢复健康。医生告诫他要注意休息，避免剧烈的脑力劳动。于是他放下工作，玩起了纸牌接龙游戏。很快，他就开始尝试计算甘菲德纸牌游戏（Canfield
    Solitaire）[^(\[9\])](#chapter9.xhtml#comment_5798)接龙成功的概率是多少。甘菲德纸牌游戏与其他流行纸牌游戏的一个区别在于，前者的成功概率比较低。在尝试计算52张纸牌的集合接龙成功的概率以后，乌拉姆发现，直接计算所需要的运算力，远远超越了他的世界级数学大脑的能力。于是，乌拉姆采用了另一个方法，他试着玩了100次游戏，然后统计游戏成功的次数。这是一个简单、粗略但实用的模拟运算。但是，乌拉姆意识到，玩游戏的次数越多，计算结果的近似值就会越精确。他迅速认识到，这一思路可以应用于解决氢弹项目上的问题。他在回忆录里写道：“它让我意识到，这种方法同样适用于所有的计算过程，包括那些‘分支事件’。”

