    ## 北海案例：系统风险与耦合

    让我们再回到北海看看。那里的海风还在狂啸，海浪还在怒吼，风险时刻出没，给我们讲述了一个有启发性的故事：在可怕的巨浪里，一艘船为避免风险而设计了万全之策，却不幸地宣告失败。这艘船属于挪威一家私营航运公司，这家公司专注于为深水油气钻井平台提供海上运输服务。公司的创始人不是等闲之辈，而是一位挪威的经济学家，名叫彼得·洛朗（Peter
    Lorange）。他曾在沃顿商学院和麻省理工学院斯隆管理学院任教，并且担任过瑞士洛桑国际管理学院和奥斯陆的 BI 挪威商学院的院长，后者是全欧洲第二大规模的商学院。他的公司虽然规模不大，只有两艘船舶，但是这两艘船舶都是功能非常复杂并且造价十分昂贵的，任何一艘出现事故，对公司而言都将是毁灭性的打击。


    洛朗是位罕见的、见多识广的业主，他拥有耶鲁大学运营管理学位以及哈佛大学商学博士学位，对于风险控制领域颇有研究。他的公司遭遇的一次最大风险，就是船舶在北海发生发动机故障，那次故障使他的船舶只能任由海浪摆布。万幸的是，蒙海浪慈悲为怀，船舶并没有沉没。洛朗针对这种现象着手进行了成本效益分析。计算结果显示，在每艘船上安装
    5 台发动机，发动机同时损坏的概率很低，可以达到抗风险最优水平，这样既可以消除整体风险，同时也可以保证购买及维护发动机所产生的相关成本在可承受的范围内。考虑到船只正常航行的速度和机动性，一般需要有两台发动机在同一时间工作。洛朗的假设条件是，万一其中一台发动机出现故障，靠另外一台发动机独立工作来应急，也能够在最猛烈的风暴中成功地驱动船舶航行。因此，洛朗的备用发动机其实变得冗余了，发动机总数是所需数量的
    5 倍：只有当所有这 5 台发动机都失效时，船舶才真正受到威胁。那么，这种情况发生的概率是多少呢？好吧，我们先来谈其中一种概率，它是用来统计柴油发动机在大海里“失效时间”的概率的。那么，1
    台柴油发动机从运转良好到失效大概需要多长时间呢（特别是在大海环境恶劣的运行情况下）？粗略估计，1 台发动机在一年之内发生故障的概率大约是千分之一，也就是 0.001。而所有
    5 台引擎同时失败的概率是 0.001 的 5 次方，也就是千万亿分之一，这个概率可以算得上是一个相当安全的水平。


    然而，在 1992 年一个平静的日子里，当洛朗的一艘船舶正在北海正常航行时，从一个奇怪的角度涌来一个巨大的波浪，让船舶遭受了严重的撞击。当时船舶损坏程度很小，也没有人员受伤，但是一束小火苗意外点燃了控制室外面的配电板，燃烧了
    20 分钟之后，船员才发现火情并扑灭大火。结果，正在运行的 2 个发动机彻底坏掉了，剩下的 3 个备用发动机都无法启动，船舶只能在水中无望地四处漂流。幸运的是，当时周围的海域里还有其他船舶，其中一艘把洛朗的船拖到海港去修理了。


    不是说只有千万亿分之一的概率吗？这艘船配备了高功率、保养到位的柴油电气驱动装置，这些装置就像柴油机车里的发动机。这些发动机产生的电能储存在蓄电池里，以电流的形式驱动传动轴运转。5
    台发动机的控制线通过直径几英寸[^(\[4\])](#chapter9.xhtml#comment_5426)的导管，穿过蓄电池所在的位置，而点燃配电板的火苗烧坏了导管，使所有发动机的控制线都无法正常使用。这种情况发生的概率，和
    5 台发动机因各自原因发生事故并同时失效的概率没有任何关系。这一概率不是独立产生的，而是耦合而成的，事故看起来是由 5 个独立的事件引发的，实际上是由影响
    5 台发动机同时失效的一个事件引发的。


    这个故事阐明了很多趋势，这些趋势为耶鲁大学社会学家查尔斯·佩罗（Charles Perrow）称作的“常态（或称为系统）意外事故”提供了佐证。佩罗在其《高风险技术与“正常”事故》（Normal
    Accidents）一书中写道，正常事故“是不可避免的，系统具有多重特征，事故是由多种无法知晓的方式之间的相互作用而导致的”。他指出了两种通常导致灾难的系统性趋势：具有高度交互的复杂性，而且包含了许多相互联结的组成部分；同时这些组成部分之间紧耦合在一起。佩罗写道，灾难会一直伴随我们。与往日的灾难不同的是，今天“新产品设计得如此复杂，以至于我们无法预测，这些最终不可避免的失败结果之间发生了怎样的相互作用”。操作者无法解决其中的问题，因为对于他们来说，这个系统已经复杂得远远超过他们的处理能力。


    不那么紧耦合的复杂系统也可能会发生故障，但是在这种情形下，问题可以被更好地限定在一定范围内。（我们通常要在耦合系统所具备的工作效率与系统安全性之间做出权衡和取舍。严密集成的系统可能效率是最优的，但同时也伴随着高风险，一旦发生事故，负面影响会迅速扩大。）耦合作用是指，在一些较大的系统内，相互独立的各组成部分之间有交互作用。一旦其中一个部分失效，其他部分也会导致系统不能工作，就像船只发动机的电气系统会因一场火灾而无法运行。


    在上述语境中，耦合大致可以作为相关性的代名词。


