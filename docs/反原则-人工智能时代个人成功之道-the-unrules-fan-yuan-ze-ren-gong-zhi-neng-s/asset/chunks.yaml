    [\[1\]](#chapter7.xhtml#commentRef_3026)在计算机学科中，存在多项式时间（Polynomial time）的算法的一类问题为P类问题；至今没有找到多项式时间算法解的一类问题为NP类问题。多项式时间在计算复杂度理论中，指的是一个问题的计算时间m（n）不大于问题大小n的多项式倍数。任何抽象机器都拥有一复杂度类，此类包括可于此机器以多项式时间求解的问题。而NP问题中最困难的问题称为NPC问题，根据库克定理，任意一个NPC问题如果能够在多项式时间内解决，则所有的NP问题都能在多项式时间内解决，而至今这一问题仍无答案。无法直接计算得到的，只能通过间接的“猜算”得到结果的问题就是非确定性问题。而这些问题通常可通过算法解决，但是这类算法的复杂性是指数级的，因此，计算的时间随问题的复杂程度呈现指数级增长，很快便变得不可计算了。——译者注


    [\[2\]](#chapter7.xhtml#commentRef_3737)1平方英尺≈0.093平方米。——编者注


