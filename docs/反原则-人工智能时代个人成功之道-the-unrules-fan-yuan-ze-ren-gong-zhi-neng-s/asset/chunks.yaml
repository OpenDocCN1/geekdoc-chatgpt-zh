    # 第八章 一个指数级成长的世界


    “让每个人都受益。”


    多年以来，我和胡振华一直保持联系，他是我在贝尔实验室的同事，也是我的朋友。胡振华从哥伦比亚大学商学院毕业后，先在一家软件公司工作，负责收购另一家软件公司，然后对这家公司进行再融资、重新发布发展战略，并且最后成功出售。他在新泽西州一家咨询公司工作了
    5 年，为技术型公司提供战略管理方面的咨询。我早就期待和他再度合作。当我计划将世坤投资从千禧管理公司分离出来的时候，我和胡振华交流，问他如果加入新公司，他想做什么。他问我：“你考虑过在中国设立办公室吗？”胡振华出生在中国台湾，他对中国人才济济的市场非常感兴趣。我认真考虑了他的提议，最后公司聘用了胡振华。


    2006 年的中国还不是我们今天所认识的中国。我们团队的一些人，当时对于在中国设置业务持怀疑态度。但当我们着手将世坤投资分离出来时，胡振华立刻前往北京，开始招募研究员。尽管那时中国很少有从事量化投资的工作机会，但他还是发现了许多在数学和科学专业受过良好训练并且非常聪明的年轻人。因为我们在这一领域进入最早，所以我们拥有首选的优势。在相当长的一段时间，胡振华在招募中国人才时由于没有对手产生了孤独感，那种感觉就像独自拥有一个超高人气的阿尔法模型一样，后来，高盛和其他公司陆续进入北京抢夺人才。


    胡振华面试了超过 1000 名应试者，我们先为其中 5 个人提供了工作。也许这些数据中也存在幂律，那些人中的大部分人现在还在世坤投资工作。胡振华在北京居住了
    7 年，后来搬到台北，作为公司首席研究官，负责国际运营。


    从我的角度来看，中国办公室计划算是一个即兴决策。当时我希望胡振华加入世坤投资，而他看到了中国的发展机会，我愿意支持他的想法。以当的时业务需要来看，去中国开办公室不是当务之急，但是这件事彻底改变了公司的发展格局。那时我们已经开始在整个美国开发阿尔法模型，而不只是局限在纽约，更不只是在格林尼治的老办公室。


    在中国开设办公室的计划进一步强化了公司名字的内涵：世坤投资（`WorldQuant`），一家业务遍及世界的量化投资公司。一开始，这个计划只是一项实验，但是它的效果非常好，于是我们开始更加投入，吸引那些经过教育体制的严格训练又需要机会发挥聪明才智的人。作为全球经济体的一分子，有着众多人口的中国，金融市场刚刚起步，投资产业也尚处在发展初期，这充分说明，优秀智力资源丰富和人才发展机会偏少的情况同时存在，我们将积极开发这些人力资源，为他们提供舞台。


    继在中国设立办公室之后，2008 年，我们又将业务拓展到了印度，然后又拓展到了其他地方，这使阿尔法工厂概念得以成立。随着规模较小的团队不断扩大，我从团队成员身上发现了他们的潜能，这让我产生了构建阿尔法工厂这一想法。我们当时一次只能构建一个阿尔法，就像手工制作家具一样低效率。关于怎样让阿尔法有效、怎样找出阿尔法，我们已经掌握很多知识。尽管阿尔法数量是在增加，尽管我不断推动技术专家实现技术的自动化，但还必须密切关注那些显著的规模变化。


    到 2007 年，我们已经有一支技术团队在开发更加先进的工具，用于模拟软件的研发。`C`语言是（20 世纪 70 年代早期）贝尔实验室开发的一种通用语言。我在独自从事交易的时候，已经用`C`语言开发了一个模拟程序；技术人员将这个程序称为伊戈尔模拟器（`IgorSim`）。现在我们需要一个每个人都能使用的模拟系统。2008
    年，我们推出了世坤模拟器（`WQSim`），它采用的是那时流行的`C++`语言。后来，在这一基础上，我们构建了一个基于互联网的模拟器，我们称其为网络模拟器（`WebSim`）。我们花在模拟器上的探索时间累计超过
    10 年。


    如果新员工精通物理和数学，但不了解金融和市场，在刚入职的一两个月就要进行阿尔法开发的时候，世坤模拟器就能够助他们一臂之力。当最资深的交易员将研究成果和部分阿尔法束之高阁，开始使用在中国开发的阿尔法来设计投资组合时，世坤模拟器也可以大显身手。


    胡振华挖掘了人才的金矿，我们也因此发现了增长的发动机。我们引导这些人才加入阿尔法的研究。为了给模拟器输入数据，我们找到了比以往更多的数据包。这些数据不仅包括金融数据，还包括新闻推送、社交媒体和卫星影像的数据，为研究人员的探索打开了新通路。为了跟上日益复杂的系统的发展，我们在重估头寸的精密自动化方面进行了投资。同时，我们采取的第一个步骤就是实现阿尔法的创造自动化。我们开始使用算法来发现数据中的信号，然后将其输入回测模拟器。这种方式能够产出很多信号，但是许多都是噪声，不具备真正阿尔法模型的预测能力。几年之内，我们把世坤投资从一个小小的“手工家具店”，变成“亨利·福特的汽车组装工厂”，生产力飞速提升。世坤投资从此有了阿尔法工厂。


    模拟器和自动化系统激发阿尔法的数量以指数级增长。到 2010 年年末，我们有超过 13000 个阿尔法，这是个令人印象相当深刻的数字。我们的竞争对手拥有不多的阿尔法（尽管在很长一段时期内，其中许多阿尔法都运行得非常好）。2011
    年年末，我们开发完成了超过 2.6 万个阿尔法；2012 年，我们有将近 6 万个阿尔法。阿尔法的数量每年都在成倍增长。那时，阿尔法的数量增长曲线实现指数级飞跃。到
    2013 年年末，我们有 42.5 万个阿尔法，几乎是前一年的 8 倍。12 个月以后，我们的阿尔法模型数量是 2013 年年末的两倍多：我们有超过 100
    万个阿尔法模型。随后，我们似乎 “放慢”了速度，到 2015 年 12 月，我们的阿尔法数量达到 170 万个。


    到 2016 年年末，我们已经开发了将近 400 万个阿尔法，超越了 2010 年我在公司内部公布的（在 5 年内达成 100 万个阿尔法的）目标。在我确定这个目标时，世坤投资的很多人（尤其是那些资深员工）一定认为我疯了。的确，我当时并不确定我们能够实现这个目标。但是我知道，在日益呈指数级增长的市场环境下，确立一个真正富有进取性、可量化的目标，让大家为之奋斗，是非常值得尝试的。事实上，我们实现了目标。从
    19 个阿尔法到 1000 万个阿尔法，我们用了 10 年的时间。


    我在 2016 年确立了一个最新的目标：完成 10 亿个阿尔法。


    阿尔法浪潮驱动着世坤投资的进化历程。不断增加的阿尔法数量，促进了专业分工的提升。在研究、投资组合策略和技术的专业领域的人力需求，反过来促进了智商高、科学素养深厚但金融经验欠缺的新人的快速增加。我们认识到，整个交易过程可以被划分为许多小的流程，并且是可以被学会的。这一认识与许多从事交易业务的资深人士的观点背道而驰。我们发现，大多数事物是可以被教会的，因此，如果学生既聪明又主动，他们几乎可以学会所有的交易知识。


    随着我们从中筛选出更多的阿尔法，我们开始着手将这些阿尔法打包并应用到投资组合中。如今，一个典型的投资组合可能包含成千上万个阿尔法，最大的投资组合可能包含 10
    万个阿尔法。我们的投资组合策略就像一个黑箱子，即使这个策略中只有一个阿尔法，其向量也可能是由几百或几千只证券组成的，仍然像黑箱子一样充满不确定性。研究员掌控阿尔法的算法、逻辑和知识产权；投资组合策略师所知道的单个阿尔法，是将市场信号用数学表达式体现出来的。作为一个结果，投资组合并不是通过宏观经济分析或者价值理念开发而建立的。事实上，投资组合全是算出来的，计算内容包括：这些阿尔法的集合体在市场运行得怎么样、其特点是什么、它能够进一步改善和提高吗，等等。


    很显然，策略师之所以能够几个月或几年密切地监控市场上交易的各种投资组合，高水平实现各种复杂功能，得益于我们开发的自动化系统。但是自动化不是万能的，策略师需要保留一定程度的自判能力。这种能力能够让阿尔法“改头换面”，比如将某个部分剔除以进行风险控制，或者改变资本配置、资本权重或者交易场所的参数。投资组合策略师要负责是否用新的投资组合替代旧的，并最终对公司的利润表负责。


    我们在中国设立办公室的收获不只是阿尔法数量的累积。比方说，它降低了我们掉入群体思维[^(\[1\])](#chapter11.xhtml#comment_7746)（`groupthink`）陷阱的风险，正如我在独自做交易的那段时间，我担心自己不知不觉地像其他人一样思考。这是一个很难克服的倾向，你从不知道自己是否会不知不觉地陷入群体思维。这时，反原则就会提醒你：所有的理论和方法都有缺陷。你怎么就能确信，你没有在重复自己以前的行为，或者没有局限于某种思维方式呢？而这些让你一叶障目的思维方式，往往是经由长期的学术训练，或者根植于心的文化逐渐形成的。你怎么就能知道，你在金融领域身经百战这一事实，就能让你避免套利回报为零，甚至遭受更糟的损失呢？


    你希望招募那些渴望解决棘手难题的人，这种人有着坚持不懈和永不言弃的精神，他们智力超群、富有主见并且充满创造力。但是你也需要某种创见，这种创见让你能够从拥有不同经历、不同文化背景的人中把他们识别出来。在高等数学和科学领域，许多最好的成果出自
    20 岁左右的人，他们用全新的视角处理问题，精力充沛，冲劲十足。想要发现他们，你就必须飞到他们居住的地方，不管是在匈牙利的布达佩斯，还是在以色列的特拉维夫、印度的孟买还是在俄罗斯的莫斯科。今天，世坤投资已经在
    15 个国家和地区拥有超过 25 家办公室。


    当然，在这些办公室中，没有一家是一开始就成功的。世坤投资从千禧管理公司分拆出来就是一次冒险，在中国成立办公室又是一次冒险。那时，公司刚刚起步，在中国的办公室业务发展再好，也只是一个成本中心。我们的努力会取得成效吗？需要多长时间才能看到成效？我知道，我们对待像在中国开设办公室这样的项目，必须把它当作一个交易，如果在一个合理的时间段内没能创造回报，就要做好止损的准备。很显然，这个项目很快就为世坤投资带来了富有竞争力的优势。


    回顾过去，世坤投资的全球化发展所带来的完美感觉，不仅体现在我个人的成长故事、奋斗经历和取得的成就中，而且体现在我所有同事的辛勤努力中。没有人能够预见所有这些会如何发生。我在和胡振华进行那次关于在中国开展业务的谈话时，对此也没有任何把握。这些决策逐个递进，通常都建立在不完全的信息基础上。这时，确立目标、避免陷入群体思维、用指数思维来思考问题都是非常重要的。我知道我们想要以一种大动作来扩大业务规模，而我们恰好有一些技术工具来实现这一点，所以我们成功了。


    ![](img/cutq_172_3916_l.jpg)


    世坤投资在以稳健的方式成长。我们无法预测发展方向，但是仍然继续寻找新的方式，来吸引和打磨那些缺少发展机会的、数学和科学方面的年轻天才。金融危机减弱后不久，就像在中国开设办公室时做的那样，我们把所有的策略集中在拓宽招聘和培训工作上。我们希望公司的发展不仅仅停留在挖掘新人和开办新办公室这个层面，在开展这些工作的同时，我们加大投资，提升运营能力，这使得阿尔法数量达到指数级增长。


