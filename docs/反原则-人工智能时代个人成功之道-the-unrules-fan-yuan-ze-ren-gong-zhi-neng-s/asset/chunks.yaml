    # 从学术训练到金融实践：个人经历与思想演进


    ## 计算复杂性的学术磨砺


    我经受了一段非常暴虐的考验。整整 9 个月的时间，除了学习，我什么都不干，几乎没有时间睡觉。仅在计算机图形学上，我们每周就要花上 40 小时进行学习。但是这项学术性挑战令人非常兴奋，让我可以在大学本科毕业后继续聚焦于计算复杂性（computational
    complexity）领域。计算复杂性理论是理论计算机科学的分支学科内容，它很抽象，属于数学范畴，不需要很多的程序设计。但它包含了对算法的深度钻研，简单来说，算法即计算机要解决一个问题时必须构建的一系列代表机械化步骤的数学表达式。


    我发现，要让我的大脑解决一个难题，我需要 48 小时全神贯注地思考，不停地想办法解决它。其中，最关键的是锲而不舍的精神。我在攻读硕士学位期间的研究聚焦于解决那些学术难题。我和其他两名同学一起写了一篇论文，这篇论文对非完全多项式问题［NP-complete
    problem，简称“NPC 问题”，与非确定多项式时间（nondeterministic polynomial time）相关］[^(\[1\])](#chapter7.xhtml#comment_3057)进行了讨论。该问题涉及随着问题规模的不断扩大，解决问题所需要的时间呈指数级增加。在运行一个问题前就知道它的算法的问题属于
    NPC 问题，有助于确定可使用的处理能力。数学领域著名的旅行商问题就是其中一个典型例子。这类问题会给定一系列城市和每两个城市之间的距离，求解访问每一座城市一次并回到起始城市的最短路线。当城市数量开始增加，问题就成指数级增长了。旅行商问题可以为复杂计算问题提供参考，例如应用于微芯片的设计和多种卫星在轨道运行的协调问题的计算。即使有捷径算法（shortcuts）、近似算法（approximations）和其他技术方法，但在计算机科学领域，NPC
    问题被公认为难题。


    1988 年 6 月，我完成了学业，成为得克萨斯大学第一位在一年内完成计算机科学硕士课程的学生。其实，我仅用了 9 个月，但我并没有告诉贝尔实验室，所以我去公司在新泽西州米德尔敦（Middletown，New
    Jersey）的研究机构报到前，差不多有 3 个月的假期。


    ## 贝尔实验室的失望与转型思考


    但是在贝尔实验室的工作有些令我失望。1984 年 1 月，贝尔系统已经由美国电话电报公司（AT＆T）和西电公司（Western Electric）分拆，长途电话业务和制造辅助业务从地方贝尔运营公司中分出来。由于失去了原本的行业垄断地位，贝尔将其研究与运营单位的商业模式更加紧密地捆绑在一起。我去米德尔敦时，科技公司的时代正在发生风云变幻。数字电子产业在硅谷蓬勃兴起，硅谷的风险资本家、创业公司如雨后春笋般生长出来，个个摩拳擦掌。互联网时代正在到来，计算机运算速度快速迭代就像摩尔定律所描述的一样，从大型主机到小型计算机，再到台式机，计算机的计算能力不断提高。


    我们在世坤投资一直热切鼓励的那种探索的自由，在当时的贝尔实验室早已不复存在。在贝尔实验室，我感觉身陷官僚主义泥潭，受到条条框框的桎梏，我们一天写 4 行代码，每一步都需要反复证明并且做回测。人为的效率降低问题让我沮丧。我很快意识到我根本不想做一名程序员，我并不属于这里。这种感觉实在是令人忧伤。庆幸的是，我在贝尔工作时结交了很多朋友，他们中的许多人也深有同感。


    因为我对做什么还没有想清楚，所以对申请去法学院还是商学院继续读书举棋不定。那时我对金融和投资知之甚少，但读过康妮·布鲁克（Connie Bruck）所写的《垃圾债券之王》（Predator''s
    Ball）。书中介绍的主人公是高收益债券创新者迈克尔·米尔肯。这本书让我感觉找到了令我着迷的学科，所以我申请了米尔肯的母校宾夕法尼亚大学沃顿商学院，并成功地获得了录取通知书。


    ## 沃顿商学院与早期投资启蒙


    在沃顿，我开启了人生新篇章。这所学院的学生个个自命不凡，我身处一群前所未见的精英之中。在 MBA 课程一开始，所有人必须参加团队建设活动。《经济学人》（The
    Economist）杂志为此写了一篇报道，文章还配了一幅照片——由一群学生手拉手抬着一名女士，展示如何建立信任，我的手腕还有幸出现画面中。让我感到惊讶的是，当沃顿商学院的学生们被问到自己的情况时，他们全都大言不惭地认为自己超过了平均水平，大约一半人还说自己曾经挽救一条人命。


    在沃顿的第一年，我参加了美国电话电报公司举办的大学生投资挑战赛。这是一个为期 3 个月的选股比赛。我和胡振华组队，他是我在贝尔实验室的一个同事，后来被哥伦比亚大学商学院录取了。我们两人对选股都没有经验。但我有个想法，我们要想方设法在
    12000 支参赛队伍里成为前 12 强，这比找到获胜的投资技巧更重要。我们的策略是选择波动性最强并且相关的几支股票，然后祈祷我们押中大市。我们运气极佳，竞赛期间，我们获得了
    4 倍回报。从专业的投资角度看，我们下的肯定是臭棋，但这对于一上来就处于下风的水平不济的我们来说，却是一步好棋。在快要进入排行榜时，我们止步不前。但竞赛给我带来了更实在的奖励：我的搭档胡振华，他在中国台北长大，16
    岁来到美国，他后来负责创办世坤投资的海外运营业务。


    沃顿把我领入了金融领域。在沃顿商学院读书期间，我去布莱尔公司（D. H. Blair＆Co.）上班。这是一家在纽约创办的公司，这些年以善于与小型技术创业公司打交道著称。我的工作是判断高科技投资机会，帮助投资者与开发者建立联系，并促成交易。虽然这项工作很麻烦、浪费了我大量的时间，却没有达成任何一项交易，但我还是从中找到不少乐趣。布莱尔公司不是非常知名的公司，但是这份工作让我明白作为一名企业家所要承担的挑战——在把好想法投入市场成功运营之前，需要清除许许多多看不见的障碍。这些企业家为了实现目标都非常努力。


    沃顿就业办公室给我介绍了下一份工作，我做这份工作的时间不长。我被哈佛国际发展学院（Harvard Institute for International Development）送到莫斯科去帮助推进俄罗斯一些国有企业的私有化进程。这个项目当时正由经济学家、政治家阿纳托利·丘拜斯（Anatoly
    Chubais）在俄罗斯主导开展。哈佛大学的运营工作由俄罗斯出生的经济学家安德鲁·施莱弗（Andrei Shleifer）牵头，他正担任丘拜斯的顾问。但是两个星期以后，我意识到我在那里意义不大，于是又回到了美国。今天，世坤投资在俄罗斯设有两家办事处。显然，抛开其他因素不谈，俄罗斯真是人才济济。


    ## 廷贝尔—希尔与职业转折


    辞掉莫斯科的工作之后，我需要找一份新工作。我那时已经结婚了。在面临未知挑战时，我又一次采用了一贯采用的随机策略：给各个公司的首席执行官随机发送自荐信，最终，我接到康涅狄格州（Connecticut）格林尼治（Greenwich）的廷贝尔—希尔（Timber
    Hill）公司的电话。当时，该公司是由托马斯·彼得菲（Thomas Peterffy）创建、管理的一家自营交易公司。1993 年，彼得菲还创办了盈透证券（Interactive
    Brokers），该公司后来成为世界上最成功的在线交易和交易软件厂商之一。彼得菲一直都是个与众不同的人。1944 年，他出生于布达佩斯（Budapest）。彼得菲在匈牙利学习工程学，后来到了联邦德国，1965
    年来到美国。彼得菲刚到纽约时不会说英语（这算是我们的共同点）。他从马萨诸塞州（Massachusetts）的克拉克大学（Clark University）毕业，然后在纽约找到一份绘制建筑图样的工作。公司购置了计算机，由彼得菲负责程序编制。他虽然开始对此一窍不通，但后来爱上了编程。1967
    年，他换了工作，他所在的新公司正在开发早期计算机化金融模型。1977 年，彼得菲用他的积蓄在美国证券交易所（American Stock Exchange）购买了一个席位，然后为了让商品、证券和期货交易所可以接受他那个日益成熟的计算机化的交易系统而开展了经年累月的艰苦奋斗。


    我去廷贝尔—希尔公司面试（确切地说，是面见彼得菲）的情景让我终生难忘。我去了他在格林尼治的公寓，他的男管家（居然家里有男管家）给我们准备了各种饮品。我随口开了一个关于编程的玩笑，他立刻斥责我不懂得敬畏现实。他告诉我：“要想在这行取得成功，就要无时无刻地思考。不是每个人都能意识到，这行的人绝大多数都聪明绝顶。”“时时刻刻地思考”这句话给我留下了深刻的印象，我意识到这个道理是多么简单和显而易见。彼得菲的话几乎成为我的座右铭，至少算是其中之一。那时，我被这句话的简单易懂触动了。事实上，当面临复杂的编程挑战时，我的确需要时时刻刻地思考。


    尽管我开了一个不合时宜的玩笑，但彼得菲还是雇用了我。他安排我调查研究各种各样的计算机化投资策略，把它们的算法写出来。我具备从事这项工作的所有素质：编程技巧、熟悉算法、金融与市场的知识积累。在廷贝尔—希尔公司，我抱着在市场上掘金的目标开始运用这些素质。但在彼得菲的眼中，我只是一名研究员，而不是交易员。两年以后，我跳槽到了依兹·英格兰德的纽约对冲基金公司：千禧管理公司。


    今天，我也在格林尼治拥有一套像彼得菲的房子那样的公寓，但是我没有聘请男管家。


    ![](img/cut_80_25455_m.jpg)


    ## 有效市场假说与随机性理论


    对任何交易员和投资者而言，在运用计算机模拟建模以及预测金融市场和证券交易方面，最大的挑战是理解有效市场假说（Efficient Market Hypothesis，EMH）。20
    世纪 60 年代，尤金·法玛（Eugene Fama）在芝加哥大学建立了有效市场假说。至今，该假说依然主导着金融领域，但在提出后的几十年里也不断受到实践界和理论界的各种挑战，包括我们在世坤投资想要通过各种量化交易实践来突破这个理论。（法玛因为有效市场假说在
    2013 年获得了诺贝尔经济学奖。金融危机后不久，他在市场有效性方面又进一步完善了观点。）


    法玛的假说论证，未来的股价是不可预测的，因为当前价格已经包含了关于一只股票所有可以获得的信息（包括对其未来价格的评估）。简言之，相信任何市场预测方法就类似相信世上有圣诞老人。这一假说暗示了任何给定的策略都不可能有效地模拟股票价格。因为未来价格根本不能被模拟计算出来，而模拟是基于过去和当前的数据计算出来的。继而，有效市场假说切断了过去和未来之间的任何相关性。相反，因为普林斯顿的伯顿·马尔基尔（Burton
    Malkiel）所著《漫步华尔街》（A Random Walk Down Wall Street）一书广受欢迎，市场处于随机游走状态变得广为人知。这帮助解释了为什么大多数主动投资者或交易员在相当长时间无法战胜市场。


    有效市场假说非常权威。战胜满是理性投资者的市场非常困难，这些理性投资者会远离所谓的定价错误的无效市场，从而进行有效套利，这就进一步推动无效市场理论假说变成金科玉律。其中一个后果就是被动投资策略的出现：各种指数基金和交易所交易基金（Exchange
    Traded Funds，ETF）涌现，人们认为既然战胜市场无望，不如尝试进行市场模仿投资，或者分行业板块投资。但是预测依然是摆在面前的难题：即使选取一个行业指数投资，投资者们尝试进入的板块可能涨，也可能跌。这样导致的结果是，投资者还是会受到股市涨跌的影响，依然是在做假设（另一个预测）。在一个相当长时间里，以这样的方式选择股票算是下一个不错的赌注。它带来的实际好处是指数基金非常便宜，不像积极管理的共同基金（actively
    managed mutual funds）或者通过股票经纪人购买的股票那么贵。实际上，除了股票经纪人，所有买股票的人都承担了风险，每个人都想在股票交易中赚钱，最后是输家还是赢家都是偶然的。这与我和胡振华在美国电话电报公司举办的大学生投资挑战赛中采取的策略是相同的。我们都期望成为最后的幸运儿，只不过我们不需要投入本钱，也就没有损失一说。


    ## 巴舍利耶与布朗运动的先驱


    股票价格的随机性与有效市场假说最早出现在 1900 年法国数学家路易斯·巴舍利耶（Louis Bachelier）的博士论文中。这篇 70 页的《投机理论》论文，揭示了市场体系与自然体系的共性。但这篇极具突破性的论文当时没有给巴舍利耶带来更好的职业声望。把市场与自然联系在一起看起来非常怪异，导致巴舍利耶甚至无法在学术上博取一席之地。但巴舍利耶确实是一位洞悉本质的观察者。他本人并不是一名市场投资者或投机者。他发现了市场是如何运转的，也许这得益于他只是站在一位纯粹的数学家的立场上，所以能纯粹感知市场的运行特点。他认识到股票价格模仿所谓的布朗运动，即在平静的水中，微小灰尘的运动路径是无规则的、随机的，这种运动是当灰尘遇到水分子的随机运动产生碰撞时对热力学背景噪声所做的回应。


    巴舍利耶还用数学方法演示了解决这种不可预测性问题的恰当方法，这种方法与计算概率相关，而不是运用线性方程相关。预测是有难度的，但是布朗运动确实遵循了特定的统计趋势：在给定的时间里，灰尘或价格停留在给定位置的概率值不同。


    不管是对于布朗运动，还是对于所谓的随机游走，我们都不能把价格当作像牛顿摆球（Newtonian billiard balls）一样绝对可以预测的，要知道，我们只是在押注。巴舍利耶还将他的另外一个洞察进行了量化证明，即这些随机运动会随着时间的延长逐渐扩大规模。


    这名法国数学家的研究成果远远领先于他的时代。他的论文影响深远，几十年后在不同研究领域都起到了奠基性作用。阿尔伯特·爱因斯坦于 1905 年开展关于布朗运动的早期研究，就是源于巴舍利耶推导出来的公式。今天，巴舍利耶作为最早的金融领域随机过程研究者，或被称为随机运动统计分析的先驱而闻名于世。而今，随机过程被用于分析大量的复杂系统，从金融学、经济学到生物学、化学、量子物理、信息理论，以及通信行业和计算机科学。克劳德·香农在
    1948 年发表论文《通信的数学理论》（A Mathematical Theory of Communication），全力解决了通过熵或不确定性度量随机通信过程的问题。


    巴舍利耶率先尝试计算期货和期权价值，由此成为布莱克—斯科尔斯（Black-Scholes）期权定价模型的鼻祖。由费希尔·布莱克（Fischer Black）、迈伦·斯科尔斯（Myron
    Scholes）以及罗伯特·默顿（Robert Merton）于 20 世纪 70 年代开发的定价模型，可能是现在金融领域应用最普遍的模型。今天，许多宏观经济预测采用了动态随机一般均衡模型（Dynamic
    Stochastic General Equilibrium，DSGE 模型），尝试计算随机冲击的效果，比如石油价格变化、税收政策调整，以及为达到经济均衡在一段时间内所制定的经济政策等方面的效果。就像冯·诺伊曼计算氢弹内的中子流一样，那些复杂的动态模型一般要在计算机里运行。冯·诺伊曼在与经济学家奥斯卡·摩根斯坦（Oskar
    Morgenstern）合作发表了博弈论之后不久，便在 1945 年建立了早期的一般均衡模型。尽管动态随机一般均衡模型不断完善、日趋复杂，但仍然和冯·诺依曼关于原子弹计算的预测一样，不可能被完全证明。


    巴舍利耶在关于市场的洞察中引入了严谨的风险回报理论。金融学家发现，随着时间的推移，市场上的某些板块（例如小盘股）趋向于产生更高的回报。但是这些回报更高的板块要求人们付出更大的代价。同时，类似小盘股的板块股票的风险性更大，一部分原因是因为它们的波动性更大。人们被迫在风险和回报之间反复权衡。


    ![](img/cut_85_39989_m.jpg)


    ## 布莱克、价值线与投资思想


    该好好说说费希尔·布莱克了。他曾在哈佛大学学习物理，获得应用数学领域的博士学位，主攻运筹学、逻辑、计算机设计以及人工智能。就像彼得·伯恩斯坦（Peter Bernstein）在其关于现代投资学发展的《投资革命：源自象牙塔的华尔街理论》（Capital
    Ideas: The Improbable Origins of Modern Wall Street）一书中所写的，布莱克的“主要兴趣在于将这些学科应用到信息处理的方法上”。但是布莱克很快就被金融吸引了，他在做了一段时间的咨询师后，又先后在芝加哥大学、麻省理工学院教书。他的职业生涯是在高盛结束的。在这里，他无可争议地成为华尔街上量化“绝世高手”，是一位身负物理和数学两大绝学的操盘手。他与华尔街交易大厅那个异常躁动的世界形成了鲜明的对比。布莱克个性不事张扬，工作一丝不苟，为人谦虚低调。（他也有率真、幽默的一面，在高盛期间，他给交易员写过一个备忘录，开始标题用的是“布莱克—斯科尔斯的漏洞”，后来又把标题改为“怎样利用布莱克—斯科尔斯的漏洞”。他恰如其分地捕捉了理论与交易实践之间的区别。）如同许多领先的金融思想家一样，布莱克将有效市场假说奉为金科玉律，尤其是在成为芝加哥大学终身教授之后，更是对此笃信无疑。


    然而，1970 年，布莱克开始深度怀疑阿诺德·伯恩哈德（Arnold Bernhard）的观点。伯恩哈德是价值线（Value Line）公司的创始人，倡导积极投资（也可称为价值投资）的领袖之一。以下是布莱克的相关阐述：“在有效市场中，可以通过投资分析来预测股票价格变化趋势吗？”价值线公司所坚持的价值投资方法，因哥伦比亚大学的本杰明·格雷厄姆（Benjiamin
    Graham）和他的学生沃伦·巴菲特而闻名于世。这一思想指出，通过对公司数据的详细分析，股价要么被低估（股票价格低于其内在价值），要么被高估。这一投资方法以强调均衡作为投资信条，坚信投资者是理性的，而价格总会围绕股票的真实价值上下波动。


    伯恩哈德的价值线系统使用市场数据锁定价值被低估的股票。经济大萧条期间，伯恩哈德被信用评级机构穆迪解雇后，开发了自己的价值线系统。价值线评级从字面上讲，就是绘制一条直线叠加在锁定股票的价格上，绘制的直线即真实价格，再根据每一只股票相对于市场和历史价格的收益增长、价格动能，以及市盈率来进行评级。早期，伯恩哈德根据手工绘制的透明的价值线跟踪股价：当股价下跌到价值线以下一定数值时，他称为价值被低估，代表要买进；当股价上涨到价值线以上，他会催促赶紧卖出。通过这一技术，伯恩哈德发现，1929
    年许多股票的价格被显著高估。他根据各只股票偏离各自价值线的正负程度，将整个系统拆分成五类或五级。


    最初，伯恩哈德以图书的形式出版了评级成果。他本来的想法是，尽力吸引华尔街公司来购买这些研究结果，但他发现，他可以定期将评级更新升级，由他直接卖给广大投资者。接下来几年，在麦迪逊大道
    347 号伯恩哈德的办公室，他和助手手工绘制的价值线被一目了然地标注在用长尺辅助画出的股票图表上。1946 年，伯恩哈德雇用了萨缪尔·艾森斯塔特（Samuel
    Eisenstadt）作为校对员。艾森斯塔特是俄罗斯移民的儿子，是一名美国陆军退伍兵，获得过纽约城市大学（New York''s City University）统计学学位。艾森斯塔特对原有方法进一步改善，包括使用普通最小二乘回归分析法，以及引入横向分析代替时间序列分析，从而提高价值线的准确度。


