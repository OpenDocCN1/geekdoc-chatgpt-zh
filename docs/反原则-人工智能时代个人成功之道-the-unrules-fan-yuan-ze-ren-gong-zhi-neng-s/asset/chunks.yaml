    # 量化投资与风险思考


    ## 自我认知与焦虑管理

    我一次又一次地提醒自己，坚持才有价值；彼得菲的看法是正确的。我设法让自己达到轻度焦虑的状态；压力太大可能反而会让业绩变差，但压力太小又不容易让人达到全力以赴的水平。而当我在某个问题上百思不得其解时，我有时会无法入睡，遇上这种时刻，我会强迫自己跑上
    5 英里。如果你遇到和我一样的情况，你的身体也会因为失眠而付出代价，而且你会察觉失眠对你的惩罚，并陷入不断的失眠中。于是，我意识到一个非常浅显的道理：自大会扭曲现实。自大会令你用放大自我的方式去感知外界环境。但你要知道，环境不是因你而存在的，所以当你放大自我意识时，你对周围环境的理解和感知将会陷入一种虚构和想象的状态。而一旦开始产生想象的错觉，你就会做出错误的决定。想想尼布甲尼撒（Nebuchadnezzar）或者李尔王[^(\[1\])](#chapter9.xhtml#comment_5105)（King
    Lear），我们就会知道，骄兵必败。


    ## 经济化表达

    我认为“经济化表达”[^(\[2\])](#chapter9.xhtml#comment_5110)（economy of expression）是一种优秀品质。我从来不认为自己是那种特别健谈的人，但是我注意到，优秀的交易员的思维非常高效。而思维高效，不仅意味着思考方式的清晰和简洁，也塑造了直截了当和用词精准的表达方式。假如你一生所说的话的数量是恒定的，那么它们被言尽的时间越快，你这一生结束得就越快。


    ![](img/cutq_119_39611_l.jpg)


    ## 阿尔法的起源与演进

    在金融上首次应用“阿尔法”这个词可以追溯到 1968 年。当年，迈克尔·詹森（Michael Jensen）在《金融学期刊》（The Journal of
    Finance）发表的一篇论文里首次提出了“詹森阿尔法”（Jensen''s alpha）一词，那时的他还是芝加哥大学一名年轻的经济学博士。“詹森阿尔法”评估投资组合的风险调整后回报，将其与市场平均水平相比较，通过超过理论预期的超额收益来衡量投资组合业绩的优劣水平。最终，“詹森阿尔法”一词被简称为“阿尔法”。


    后来，这个概念被对冲基金领域引用，用来描述基金经理希望传达给投资者的理念：它会带来高于市场平均水平的回报。在量化的世界里，阿尔法慢慢演变为用于预测证券价格（或相对价格）相关数学算法或模型的简称。阿尔法的定义方式有很多种，就像俄罗斯套娃一样彼此嵌套在一起，每一种定义都是同一个圆心扩散出去的同心圆。阿尔法是一种算法，是数学表达式、计算机源代码和配置参数的一个组合（即软件和硬件的设置）。如同其他运算规则一样，阿尔法包含计算机执行程序时所需要遵守的一定的规则（例如，if-then
    这样的假定条件，即如果事件 X 发生，那么该如何决策），其目的是预测金融证券的回报。市场上每时每刻都可能有无数的交易灵感产生，而每一个灵感都有可能蕴含一个阿尔法。我们之所以开发、测试阿尔法，并用阿尔法交易，是认为即使市场是充分有效的，但也存在某种力量，这种力量会驱动证券价格回归均衡，那就意味着差价和机会总是存在的。从广义上说，投资者总会千方百计地获取回报，那就需要克服市场大盘背景噪声所施加的影响，这样，投资者的行为一定会慢慢驱动价格朝向证券的内在价值变动。


    ## 阿尔法的量化实践与信息比率

    这听起来可能比较简单，但从市场的本质而言，情况就是这样的。尽管从原理角度看，阿尔法是非常简单的，但是我们用于构造阿尔法的计算工具和相关数据却是无比复杂的。举例来说，一个阿尔法可能被表示为一个数值矩阵，这个矩阵以证券为索引，因时间而发生变化［我们称它们为时变结构化向量[^(\[3\])](#chapter9.xhtml#comment_5216)（time-varying
    structures vectors）］。当想要以我们在全球不同市场上几千只股票为基准来生成预测时，这个向量的规模也就变得十分庞大。每天，软件都会重新评估阿尔法理念的逻辑基础，并基于市场条件给予向量新的数值。我们可以通过用阿尔法预测投资组合模型，将实现的理想化回报与历史日均回报相比较，从而评估阿尔法的业绩。日均回报相对于所估计的回报的波动率，即两者的比率，就是这个阿尔法的信息比率（Information
    Ratio，IR）。这一比率主要用于度量这个信号的强度及稳定性，以及这个阿尔法理念是否运作有效——显示我们找到的信号的强弱程度。信息比率会提示我们，正在处理的阿尔法是一个信号还是一个噪声。


    这听起来似乎难以理解。事实上，我们在量化投资上所做的工作就是通过概率论和统计的方法，让我们的投资胜算概率更大，请把这点牢牢记在心里。在世坤投资，我们构建、测试阿尔法，并用它进行投资，最主要的关注点是减少或控制相关性，即要让两个或多个因素之间的关系或联系是中性的，互不干扰。如果把量化投资比作一场棒球赛，我们并不追求大获全胜、打出全垒打而得分，我们只是尽最大努力以避免灾难，并努力产出高于整体市场回报水平的稳定回报。


    1992 年，在美国电话电报公司组织的大学生投资挑战赛中，胡振华和我为了获得高分而尝试的投资策略中隐含赌运气的成分。如果我们的运气足够好，那么我们也许会赶上一波市场行情，搭上市场的顺风车。所以问题就在于，依靠运气具有极大的不稳定性，我们运气可能很好，也可能极差。在我们的公司里，我们可不希望发生后一种情况。我们的主要目标之一就是，避免突然出现流氓波，绝不能被它的惊涛骇浪吞噬。在各种违约事件、互联网泡沫、量化投资振荡，以及金融危机中，大量投资者因价格持续下跌而损失惨重。当这些市场急剧下跌的突发事件发生时，我们希望能将它们对公司业绩的影响降至最小。但是这并不意味着我们不能采取一些积极的市场策略。在市场环境下行期间，我们要把握好一条关键的原则：冒最低的风险，并且控制好损失。相比其他策略，积极策略能更好地迫使市场对你的行动做出反应，你将会掌握控制权，可以有更多的配置选择和更高的成功概率。但是这条原则并不是万能的。如果它没有奏效，你还需要有备用的退出计划。


