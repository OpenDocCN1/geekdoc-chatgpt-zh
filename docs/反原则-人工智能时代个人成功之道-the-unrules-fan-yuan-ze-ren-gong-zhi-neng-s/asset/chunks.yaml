    ## 布莱克、价值线与投资思想


    该好好说说费希尔·布莱克了。他曾在哈佛大学学习物理，获得应用数学领域的博士学位，主攻运筹学、逻辑、计算机设计以及人工智能。就像彼得·伯恩斯坦（Peter Bernstein）在其关于现代投资学发展的《投资革命：源自象牙塔的华尔街理论》（Capital
    Ideas: The Improbable Origins of Modern Wall Street）一书中所写的，布莱克的“主要兴趣在于将这些学科应用到信息处理的方法上”。但是布莱克很快就被金融吸引了，他在做了一段时间的咨询师后，又先后在芝加哥大学、麻省理工学院教书。他的职业生涯是在高盛结束的。在这里，他无可争议地成为华尔街上量化“绝世高手”，是一位身负物理和数学两大绝学的操盘手。他与华尔街交易大厅那个异常躁动的世界形成了鲜明的对比。布莱克个性不事张扬，工作一丝不苟，为人谦虚低调。（他也有率真、幽默的一面，在高盛期间，他给交易员写过一个备忘录，开始标题用的是“布莱克—斯科尔斯的漏洞”，后来又把标题改为“怎样利用布莱克—斯科尔斯的漏洞”。他恰如其分地捕捉了理论与交易实践之间的区别。）如同许多领先的金融思想家一样，布莱克将有效市场假说奉为金科玉律，尤其是在成为芝加哥大学终身教授之后，更是对此笃信无疑。


    然而，1970年，布莱克开始深度怀疑阿诺德·伯恩哈德（Arnold Bernhard）的观点。伯恩哈德是价值线（Value Line）公司的创始人，倡导积极投资（也可称为价值投资）的领袖之一。以下是布莱克的相关阐述：“在有效市场中，可以通过投资分析来预测股票价格变化趋势吗？”价值线公司所坚持的价值投资方法，因哥伦比亚大学的本杰明·格雷厄姆（Benjiamin
    Graham）和他的学生沃伦·巴菲特而闻名于世。这一思想指出，通过对公司数据的详细分析，股价要么被低估（股票价格低于其内在价值），要么被高估。这一投资方法以强调均衡作为投资信条，坚信投资者是理性的，而价格总会围绕股票的真实价值上下波动。


    伯恩哈德的价值线系统使用市场数据锁定价值被低估的股票。经济大萧条期间，伯恩哈德被信用评级机构穆迪解雇后，开发了自己的价值线系统。价值线评级从字面上讲，就是绘制一条直线叠加在锁定股票的价格上，绘制的直线即真实价格，再根据每一只股票相对于市场和历史价格的收益增长、价格动能，以及市盈率来进行评级。早期，伯恩哈德根据手工绘制的透明的价值线跟踪股价：当股价下跌到价值线以下一定数值时，他称为价值被低估，代表要买进；当股价上涨到价值线以上，他会催促赶紧卖出。通过这一技术，伯恩哈德发现，1929年许多股票的价格被显著高估。他根据各只股票偏离各自价值线的正负程度，将整个系统拆分成五类或五级。


    最初，伯恩哈德以图书的形式出版了评级成果。他本来的想法是，尽力吸引华尔街公司来购买这些研究结果，但他发现，他可以定期将评级更新升级，由他直接卖给广大投资者。接下来几年，在麦迪逊大道347号伯恩哈德的办公室，他和助手手工绘制的价值线被一目了然地标注在用长尺辅助画出的股票图表上。1946年，伯恩哈德雇用了萨缪尔·艾森斯塔特（Samuel
    Eisenstadt）作为校对员。艾森斯塔特是俄罗斯移民的儿子，是一名美国陆军退伍兵，获得过纽约城市大学（New York''s City University）统计学学位。艾森斯塔特对原有方法进一步改善，包括使用普通最小二乘回归分析法，以及引入横向分析代替时间序列分析，从而提高价值线的准确度。

