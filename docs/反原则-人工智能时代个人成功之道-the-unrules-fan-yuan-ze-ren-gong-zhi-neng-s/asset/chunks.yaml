    \[1\] 阿尔法：英文为`Alpha`，是一种量化金融模型或量化交易策略，研究员通过计算机编程将这种交易策略用量化模型方法描述出来，期望通过研究市场的无效性预测获得超过市场的超额收益交易模型。——译者注


    ## 译者序 唯有变化才是永恒的——适者生存


    一个偶然的机会，朋友向我推荐了本书。工作之余，我开始尝试本书的翻译工作。


    在这本书中，作者伊戈尔·图钦斯基讲述了自己如何在逆境中寻找机会，一步步走向成功，并分享了自己宝贵的人生经验。伊戈尔早年跟随父母离开家乡前往美国。在其丰富的职业生涯中，他做过洗碗工、图书管理员，也从事过视频游戏的开发、贝尔实验室的编程工作，最终成为全球量化投资公司——世坤投资的创始人、首席执行官。因为秉信教育和公益的力量，他携手梅森所在的实验室，致力于癌症的精准医疗研究；同时创立了非营利性组织——世坤大学，为有志于量化金融研究的学子提供免费在线课程，提供跨越国界的知识与教育。


    本书分享了其投资原则，有助于读者了解数字技术和分析如何改变投资世界。作者所自创的“阿尔法”可以被视为一种金融模型，其在分析和预测复杂的金融交易方面具有很大的作用。但是，2008
    年美国次贷危机的蔓延，也给痴迷于数理分析的模型学派敲响了警钟。事实上，没有人可以准确地预测未来，模型总是有缺陷的，甚至某些时候，过于沉迷于模型反而容易让人忽略常识本身。作为译者，我本人并不推崇金融模型的技术学派。模型仅仅可以作为投资的一种“参考”，我们不能唯模型论。但是作者的经验仍然值得借鉴，这也是作者在漫长的投资生涯中积累的宝贵财富，比如“不要在交易中掺杂情绪”“对坏消息要第一时间做出反应”“可以冒险，但一定要管理好损失”，等等。


    在本书的核心部分，作者结合自己的人生历程归纳了一系列规则。其中最核心的部分就是“反原则”，它既是作者一系列从业经历的指南，也是作者的人生哲学。何为“反原则”呢？简单来说，反原则就是“没有永远适用的原则”。任何理论和方法都有缺陷，完美的东西是不存在的，唯有变化才是永恒的。我们应当在变化中，在不断的自我提升中，战胜自己、攻克难题。


    作者还在书中分享了自己的人生哲学，比如“生命是不可预测的”“能够被计划的事情总是有限的，关键在于行动”“树立具体的、可以量化的目标”“发展意志力，发挥自己的相对优势”“持之以恒，假以时日，坚持胜过能力”……


    思想家斯宾塞·约翰逊（Spencer Johnson）有句名言：“在这个世界上，唯一不变的就是改变。”没有什么东西是一成不变的，如果有，也许只有变化才是永恒的。特别是在互联网、人工智能、大数据技术蓬勃发展的时代，世界日新月异，新事物层出不穷，用作者的话来讲，“每一天，世界都以一种指数级方式在变化”。这是一个充满预测的时代，如果你缺乏预测趋势的能力，不断变化的复杂事物就会轻易打败你。在对趋势的判断过程中，你要时刻提醒自己，收集所有你能够收集的信息，因为在某些时候，“数量即是质量”。同时你也要提醒自己，不管你有多么完善的模型或多么充足的数据，你都无法捕捉所有的变化，因此，你始终要将“自我意识”抽离，独立、客观地做出判断。


    春去秋来，花谢花开，唯有变化才是永恒。没有人天生就具有清晰的目标，但是我们可以磨炼心智，接受、面对、迎接每一个哪怕微小的挑战，在这些微小的挑战中成就自己的人生。唯有张开双臂，拥抱这个飞速变化的世界，才是生存之道。


    未来扑面而来，你准备好了吗？


    ## 英文版序言


    伊戈尔·图钦斯基拥有与我完全不同的人生经历。不过，我们两个也有很多共同点：都有关怀我们的父母，都喜爱读书，都迷恋数学。


    作为一个当今领先的量化投资者，对于构成动态市场的基础，伊戈尔比大多数人都理解得更为深刻。“市场像波浪”，他写道，“像乐器演奏一样，进行有规律的振动”。尽管他的观察结果和我过往了解的商业与金融运转的方式不同，但我觉得他的观察结果符合逻辑。在大学时代，我深受诺贝尔经济学奖得主加里·贝克尔（Gary
    Becker）的著作影响，我认识到，不少有抱负的企业家，特别是少数族裔和妇女，是难以被资本市场接纳的。


    伊戈尔的方法需要人们通过严格且复杂的数学分析来识别交易机会。这种方法可能看起来与依赖人力资本（与人的天赋、训练、经验相关）的那些理论完全不同，也与我使用的关于社会趋势对商业成功的影响的理论大相径庭。但实际上，我们都是基于自身的观察力图预测最有可能的未来。不断理解数字和持续思考人性，都会产生至关重要的洞察，并且都将有助于获取回报或获得成功。在本书所讨论的许多重要的观点上，我们意见一致。


    · 所有的市场都包含风险，没有风险则没有收益。精细的研究有助于更精确地发现风险的代价。


    · 市场也包含心理陷阱，比如，将相关关系与因果关系相混淆。如果大多数人都会掉入心理陷阱，那么一个采用调查研究的客观的投资者将处于优势地位，就像谚语“盲人国里独眼人称王”所说的一样。


    · 最好的投资者会从多个来源广泛收集多样化信息，并且擅于从中提取有用信息。


    · 研究市场和研究生物学有共同点。它们都是数据驱动的信息科学；两者都会用预测算法在信息的海洋里查找信息，就像在大海里捞针一样。正如伊戈尔指出的那样，下一个治愈顽疾的、伟大的、具有突破性的进展，很可能就是通过与分析金融数据一致的数学方法而取得的。


    · 人才遍地开花，天才随机出没。


    伊戈尔和我都相信历史的经验与教训。一本 2010 年的关于金融市场的书中提到“不动产价格暴跌，信贷枯竭，房产烂尾”，那看起来很像 2008 年发生的事情，实际上，它指的是
    1792 年乔治·华盛顿（George Washington）时代的情况。“最近，股票市场股价急剧下跌，银行削减贷款，失业率上升为两位数”，你可能又一次以为这在说
    2008 年的情况。其实不对，这段话是在描述 1974 年发生的社会惨状。如果你活得足够长，你可以不断欣赏历史长河中那些永恒不变的规律。历史不是正弦波，不像正弦曲线那样精确重复同样的模式；它更像一个螺旋——以一种不同的轨道重现类似的事件。这也就是研究历史如此重要的原因。


    那些进行深入研究的投资者，通常受市场回撤的影响更小。他们能够理解支撑全部资本市场的那些债券的价值；他们能够理解在市场剧烈波动时，杠杆是一个危险的工具；他们能够理解评级并不总能可靠地评估信用质量；他们能够理解利率是难以预测的；他们能够理解政府行为通常会使市场进一步失真。


    这么多年过去了，这些基本的投资原则几乎一成不变，但金融工具已经发生了翻天覆地的变化。20 世纪 60 年代，我在伯克利学习量化经济学时，计算机还很昂贵，不那么容易上手，机器设备犹如房间大小，但其模拟投资情境的能力却很弱。1976
    年，我的公司安装了 IBM 大型机 System/370，处理数据能力提升了，但是每一兆字节仍然需要 100 万美元的存储成本。今天，计算机的数据处理能力已经提升成千上万倍；地球上几乎每个人都可以接触计算机；云存储能力几乎是无限的，但成本却接近于零。


    这一技术革命正在许多领域深刻地改变着世界。例如，它在生物医学研究以及精准医疗方面的影响，加速了临床医学的发展，并且拯救了数不清的生命。通过世坤投资与威尔康奈尔（Weill
    Cornell）医学院在量化预测研究方面的合作，我们可以预见，这一领域未来会有巨大的发展机遇。在金融与投资领域，伊戈尔与其伙伴们现在可以通过创造上百万个阿尔法，以惊人的速度和准确性来模拟现实并鉴别交易机会，这对
    20 世纪 60 年代的金融专业学生来说简直是梦想。


    尽管伊戈尔和我通过不同的角度来观察市场，但我们在看待这个时代最重要的社会问题上意见一致：不论有多少传统意义上的工作被日益发展的科技替代，社会仍应为每一个劳动者提供一条路径，让他们生活得更有意义。2017
    年，我们就自动化与人工智能的挑战这一主题在《华尔街日报》（Wall Street Journal）上合作发表了一篇评论文章。我们的结论是，数字革命和机器人正在为劳动者开启新的可能性，未来的职场可以提供更有意义的生活机会。简言之，我们相信，科技影响了人力资本；而广泛运用科技将创造更多的工作，其数量足以抵补科技所替代的工作数量。当然，这其中的关键是，要给人们提供充分的机会进行培训和再培训。


    通过伊戈尔的世坤投资在全球范围内的运营，我们可以对未来的金融职场窥见一斑。世坤投资所支持的世坤大学单独为学生们提供免费的金融工程硕士学位在线课程。在不同群体的人中，总有人愿意通过努力实现清晰的目标。伊戈尔通过为这样的人提供机会来扩充他的人力资本，并帮助大家实现一个更加繁荣的明天。《反原则》一书正是个人通向繁荣明天的宝贵指南。


    迈克尔·米尔肯（Michael Milken）


    米尔肯研究院主席


    ## 前言


    了解我的人都知道，我是一个话很少的人。事实上，我经常开玩笑说，你一生中要说的话就那么多，当你把它们用光时，你就该死了。所以，现在我写了这本书，我的生命就处于危险之中。


    我们一生下来就被赋予语言的能力。我出生在明斯克（Minsk），现在的白俄罗斯首都，我从小说着俄语长大。20 世纪 70 年代后期，父母和我离开家乡来到美国，我们不得不学习英语。作为一个孩子，我比父母更容易学习一门新的语言。随着适应陌生新文化带来的挑战，我们解决了语言难题。数学成为我用得非常得心应手的一门语言。我从孩童时代就开始下象棋。我的父母都是职业音乐家。象棋和音乐这两类日常爱好，究其根底都与数学和规则化的次序密切相关。我家乡的学校很擅长数学教学，为我打下了良好的数学基础。当我在堪萨斯州（Kansas）的威奇托（Wichita）读中学时，我接触了计算机编程。从早期计算机语言
    BASIC，到后来的 C 语言，编程的精妙世界吸引了我。17 岁时，我无意中接触了视频游戏的开发领域，后来还与别人合著了一本关于视频游戏编程方面的书。早期视频游戏阶段的种种人生经历，从构思各种角色（笑料）、编程到写书，让我相信一切皆有可能做到。


