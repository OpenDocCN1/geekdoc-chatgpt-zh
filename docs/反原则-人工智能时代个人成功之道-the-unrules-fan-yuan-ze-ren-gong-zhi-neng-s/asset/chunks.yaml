    [\[1\]](#chapter7.xhtml#commentRef_3026)在计算机学科中，存在多项式时间（Polynomial time）的算法的一类问题为`P`类问题；至今没有找到多项式时间算法解的一类问题为`NP`类问题。多项式时间在计算复杂度理论中，指的是一个问题的计算时间
    m（n）不大于问题大小 n 的多项式倍数。任何抽象机器都拥有一复杂度类，此类包括可于此机器以多项式时间求解的问题。而`NP`问题中最困难的问题称为`NPC`问题，根据库克定理，任意一个`NPC`问题如果能够在多项式时间内解决，则所有的`NP`问题都能在多项式时间内解决，而至今这一问题仍无答案。无法直接计算得到的，只能通过间接的“猜算”得到结果的问题就是非确定性问题。而这些问题通常可通过算法解决，但是这类算法的复杂性是指数级的，因此，计算的时间随问题的复杂程度呈现指数级增长，很快便变得不可计算了。——译者注


    [\[2\]](#chapter7.xhtml#commentRef_3737)1 平方英尺≈0.093 平方米。——编者注


    [\[3\]](#chapter7.xhtml#commentRef_3922)噪声交易者是指在几乎没有信息的情况下进行交易的人，即使他们认为自己是“知情的”，把噪声错误当作信息进行交易。他们的存在会使资产价格定价产生偏差。——译者注


    # 第五章 波


    “只要采取行动，其他都不重要。”


    当我还只是个孩子的时候，父亲差不多每天都在练习小提琴，我时常沉浸在他演奏的声波里。实际上，我们所有人（包括孩子和大人）每天都沉浸在各种物理表现的波中：声波、水波、电磁波。波是有规律的，而且波可以通过数学表达。然而，我们经常想当然地理解波。


    在 19 世纪，与波现象有关的科学发现产出非常丰富，这些发现跨越一个宽广的领域，特别是在经典物理领域。20 世纪，奥地利物理学家埃尔温·薛定谔（Erwin
    Schrödinger）建立了波动方程，他通过振荡、正弦曲线、上升、下降模型描述电子的运动行为，并把这样的现象称为波动力学。在同一时间，德国哥廷根大学（University
    of Göttinge，这所大学也是冯·诺伊曼、希尔伯特和其他关键人物早年学习与成长的摇篮）的维尔纳·海森堡（Werner Heisenberg）开发了一组和波动方程近似精准的方程，用它描述微观粒子的运动行为，并提出用矩阵力学——用希尔伯特所倡导的代数方法来计算粒子运动的科学。后来，冯·诺依曼很快发现薛定谔方程和海森堡方程之间存在根本上的相关性；其实，薛定谔和海森堡用各自的方法描述的都是同一自然现象，那就是量子力学。


    海森堡后来认为，我们虽然可以精确地描述一个粒子的动量[^(\[1\])](#chapter8.xhtml#comment_4170)（`momentum`）或位置，但不能在同一时间测量其中一个。动量可以由波函数求解，而位置是作为一个区域中一个点进行测量的。这就是海森堡的不确定性原理[^(\[2\])](#chapter8.xhtml#comment_4175)（`uncertainty
    principle`）：观察量子位置会影响量子的动量，反之亦然。现在我们想到基础粒子，包括光的光子和电的电子，它们共享波和粒子的属性，但是反直觉的概念一直困扰着爱因斯坦，直至他
    1955 年去世。


    我们也可以把市场变化看作一种波动现象。通过追踪股票或市场的价格起落，我们可以勾勒一只股票或市场的变化。如果让这些价格变化图变得平滑一些，它们就会像乐器有规律地振动，或像海浪匀速地冲击着海滩。有时，这些波动会产生一个清晰的声调或信号，但有时只产生不和谐的随机噪声。


    ![](img/cutq_98_7166_l.jpg)


    北海[^(\[3\])](#chapter8.xhtml#comment_4227)是世界上最密集的航运地区之一，支撑着几个主要发达国家的贸易。这些国家不仅包括挪威、丹麦、德国、荷兰、比利时、法国和英国，还包括斯堪的纳维亚半岛的其他国家、波罗的海的
    3 个国家，以及俄罗斯。北海依傍于欧洲大陆架，由于地表石油较浅，具备开采优势，这里分布了相当多的海上钻井平台。但是北海的航道并不安全。由于恶劣的天气、复杂的风场类型在大陆架附近掀起无数的惊涛骇浪，在大海中颠簸的船只增加了航行危险性，也增加了和海上石油平台与陆地或海下岩石组成物相撞的危险性。这使得北海相比开阔水域而言危险性更大。


    许多年，那些关于海事神话的传闻都在反复强调北海的异常海浪非常猛烈，破坏性极大。另外，根据那些目击者的陈述，这些破坏性极强的波浪不可能被提前预测，因为它们看起来神出鬼没，好像没有规律可循。这些波浪具有一些共性：它们通常突然出现在相对平静的海面上（尽管按照常识来说，波涛汹涌的海面更加具有破坏性），看起来像是在各种角度沿着盛行风主导风向和涌浪方向移动着，且移动速度很快，从表象看起来很容易辨识。当这些波浪接近时，海面就会升起一面水墙，水墙前面有一个很深的海洞，自古被称作“海中无底洞”，后面还有另外的海洞。这些行驶在惊涛骇浪里的船只，一旦遇上这些波浪，经常要么消失得无影无踪，要么沉没。


    科学家们通常视这些故事为臆想、幻觉或者胡言乱语。然而，在 1995 年元旦那天下午的 3:20，北海的德劳普纳（Draupner）钻井平台被巨浪吞没（德劳普纳是属于奥丁神所有的金戒指的名字。奥丁神是日耳曼神话中的一个神，具备自我繁殖能力）。幸运的是，尽管装备的主体架构遭到海浪的破坏，但钻井平台还是保存完整，躲在钻探平台设备中的工作人员在这次巨浪中得以生还。事实上，工作人员也没有亲眼看见过那次巨浪。通过钻探平台上的常规遥感勘测激光检测设备，技术人员追踪到了涌浪经过前、经过时和经过后的运动轨迹。最大的波形高度从波谷到波峰估计有
    84 英尺[^(\[4\])](#chapter8.xhtml#comment_4285)；单一最高波峰大约是之前和之后波峰的 3 倍高。当时，德劳普纳钻井平台所在地并没有发生暴风雨，附近也没有发生这样规模的海浪。


    德劳普纳发生的海浪激发了大家研究的兴趣。“流氓波”（`Rogue wave`，或称疯狗浪）现在已成为一个技术术语。科学家们估测，流氓波平均每年会使一艘大船沉没。1995
    年 9 月初，德罗普尼尔钻井平台被流氓波撞击的同一年，北大西洋上的一个流氓波撞击了伊丽莎白女王 II 号，当时这艘船正在从瑟堡（Cherbourg，法国西北部港市）航行到纽约的途中。为加拿大的海上天气进行预报的海上浮标系统判断，该波浪有
    98 英尺高。船长在航行日志中写道：“这艘船看起来好像正在驶向多佛（Dover）港的白悬崖。”波浪卷过船头，导致船体产生一阵巨大的震动，紧接着就是两个小一些的震动，船体掉入波浪另一侧的“洞”里。万幸的是，伊丽莎白女王
    II 号只遭受轻微的破坏，没有发生人员伤亡。


    是什么导致了“流氓波”？最普遍的假设是，流氓波是因为在同一地点同时发生多重小海浪的波动而产生的。当你在海滩上看到来来回回的海浪融合形成一个更大的波峰，然后爆发时，你就可以看到流氓波。但这些波只在浅水域的影响下才出现。假设者们没能解释移动的流氓波为什么能持久保持形状，以及流氓波两侧的深海洞是怎么形成的。尽管假设者们坚称，时间再久的话，流氓波的形态会发生变化，但是大部分流氓波都会突然出现，然后没有变化地消失。流氓波的形状特征明显，与常规的波浪比起来，它的形状比较平滑。正常的波浪成群结队地起伏出现，并且缓慢地散开。流氓波是单独行动，但水浪好像彼此相约在某个地方汇合一样地行进。关于流氓波现象的形成原因，主要还有与潮汐、火山现象，以及风效应有关的假说，但是所有这些假说都被证明存在缺陷。潮涌导致的波浪形状又长又平。没有证据表明，在出现流氓波的大湖中曾出现火山活动。在没有任何风的情况下，有时也会发生流氓波现象。


    有一种波在本质上是与众不同的，那就是海啸波。海啸波是机械波，它有一个明确的外因（比如地震），是通过一些外界的活动而不是内因而产生的。当地壳构造板块移动时，海床突然升起，海床的垂直运动引发水体的置换，从而生成一系列巨大的浪潮。因为海床的垂直运动产生了大量的能量，所以海啸产生的波浪以一个极快的速度移动并穿过宽广的区域（置换的水体越多，波浪传播速度就越大）。在海拔较低的开阔水域，海啸波漫过船的浮子能引起船员的注意。海啸撞击陆地会引发极大的破坏作用。当海啸接近浅水域时，由于深度变浅，波高突然增大，垂直位移的海水显示出水平和垂直两种形式相结合的运动：波浪升起到海平面以上，开始起伏；被相互间的水浪的摩擦阻碍，海水聚积起来形成很高的水墙。这些力量形成一种巨大的、破坏性的“破浪波”（`breaking
    wave`），这是一种“潮汐波”（`tidal wave`）。


    但是，尽管海啸在撞击陆地前也制造了一种惊人的波浪，但与开阔水域的巨大的流氓波完全不同。海啸现象推动了流体力学的研究。海啸中的水体并不是向前移动的，而是上下移动的，海啸的能量却是向前移动的。垂直干扰的波从一个位置传到下一个位置，就像足球赛观众席此起彼伏的人浪一样。因为传播的媒介是流体，所以在任何固定位置的上下移动通常不会在一个单循环后停止。由于水体内相互摩擦的作用，所以水体的单循环会留存下来，但它会随着时间的推移而减弱。你可以想象一下，向池塘里扔进一小块石头，在石头掉进湖底后很长一段时间，波纹从石头撞击水面的位置开始向外扩散，并越来越小。


