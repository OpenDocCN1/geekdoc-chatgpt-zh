- raw: '我一直在培养一种富有经验的判断力：知道什么是有效的、什么是无效的。特别是与我们今天能做的相比，很多经验现在看起来都是很基础性的。举个例子，有两大类价格信号：动量（momentum）和逆转（reversion）。动量信号是指股票延续当前上升或下降的轨迹的趋势；逆转信号则是暗示当前价格要么过高、要么过低，正在回归某种均衡的状态。根据我的经验，逆转信号实际上比动量信号有用得多。我的第一个阿尔法模型就曾在交易日结束时捕捉到了逆转信号。显而易见，这是由于许多交易员需要卖掉头寸，以便换取流动性，所以价格会在这时随之下跌。


    动量信号不像逆转信号那么强。如果动量信号比逆转信号还强，那就意味着价格会缓慢稳定地回归其内在价值，就像士兵从A点齐步走到B点一样。根据实证主义提供的依据，这种情况实际上不可能发生。现实中，价格的形成是一个不断试错的行进过程，价格可能反应不足，也可能反应过度。


    我也在通过更老道的方法运用概率论研发阿尔法模型，我开始在我的模拟程序中搭建关键组成部分。在千禧管理公司和其他量化投资公司中，交易员追求一揽子套利交易：统计套利（satistical
    arbitrage）、并购套利[^(\[2\])](#chapter10.xhtml#comment_6518)（merger arbitrage）、固定收益套利[^(\[3\])](#chapter10.xhtml#comment_6523)（fixed-income
    arbitrage）、抵押套利（mortgage arbitrage）[^(\[4\])](#chapter10.xhtml#comment_6528)和相对价值交易策略（relative-value
    trade）。“套利”是指利用两种不同债券的价格差异，或者两个并购中的公司的股票价格差异，同时进行的资产买卖行为；也指买卖两种不同种类的证券（抵押证券和股票）的行为；或者指在不同市场以不同价格交易类似证券的行为。一个赚钱套利的机会，可能因为整体有效市场中存在某种无效性而突然出现，这种无效性就是一个信号。


    我开发的第二个阿尔法模型围绕配对交易运作，这种方法因循的是股票交易中一些相对清晰的趋势，比如均值回归[^(\[5\])](#chapter10.xhtml#comment_6580)（mean
    reversion）。这种配对交易包含两只股票，而统计套利采用的策略却包含成百上千的股票。不管股票组合的复杂程度如何，这些方法都能奏效的原因是，这些股票存在相关性。举例来说，一个配对交易包含两只相关股票，做多交易员看涨的股票，同时做空交易员看跌的股票。也许你认为福特汽车公司近期的股价一直大涨，现在估值一定过高；而对于其市场竞争对手通用汽车公司，你认为由于股民对该公司养老金偿债能力的过度担心，股价暴跌，所以该公司股价被低估。经过这样的判断，你可能会买入通用汽车公司的股票，因为你相信，在投资者发现对通用汽车公司的担心程度被夸大时，通用汽车公司的股价就会回弹；而同时做空福特汽车公司的股票。这样，不管市场上汽车板块或整体大市的涨跌表现如何，通用汽车和福特汽车的股价都会向着它们的真实价值移动，最后，你的获利是相当稳妥的。


    采用这一类型的交易策略，还有另一个好处：有利于风险管理。还记得阿诺德·伯恩哈德开发的价值线系统吗？在该系统中，5篮子股票，按照有望上涨到最高的、可能上涨最少的、会下跌的依次排序。价值线通过横截面数据[^(\[6\])](#chapter10.xhtml#comment_6585)评估股票价值；也就是说，如果我们把市场看作一个整体，业绩最差那篮子股票的价格相对于市场大盘就会预期下跌。因此，我们可以很自然地得出一个投资策略：购买有望上涨到最高的那篮子股票，以及卖出最有可能下跌的那篮子股票。就像船只随着潮水起伏漂流一样，在复杂且潜在的经济压力主导下，这两篮子的股票都倾向于与市场大盘走势相互关联。正常来说，当投资者试图预测某只股票的未来时，他们也在有意或无意地试图预测市场大盘的趋势。大多数市场预测都是徒劳无功的，预测经常被证明是难题。但是也有一种方法可以消除这样的市场风险。比如在价值线例子中，通过买入看涨篮子里的股票，同时卖出相同金额的看跌篮子里的股票，你可以令市场中性化来抵消这一风险，也因此产生了“市场中性”（market
    neutralization）这一术语。市场中性的意思是，如果市场上涨，即使只是引起最有可能下跌的那篮子股票上涨，其收益仍然不会超过有望上涨到最高的那篮子股票的收益。尽管你并没有对市场涨跌下注，你的投资仍然获利了。


    这些中性策略通过计算概率的方式运行；若采用这些策略，你可能赢，也可能输。这些策略无法总是获胜，但是允许你按自己的喜好来投注市场；经过一定时间的积累，它们会给你可量化的优势。


    在千禧管理公司那些年，我开始精通怎样将中性策略应用到模拟程序中：将同等金额投资在数量从100到4000不等的股票的多头和空头上。要一并处理那么多数量的股票，我们需要尽可能地运用自动化手段。性能日益强大的计算机允许我像约翰·冯·诺依曼一样，去全力打造那些过去根本无法想象的模拟运算程序。这些程序能够处理相当大数量的证券交易，并且能够运用大数定律处理不断增加的数据变量。但是我仍然需要构建一个交易的基础设施，并且通过这个基础设施，自动化地实现多处场所、多种证券交易的许多复杂任务。同时，我也发现了一些更好地实施中性策略的方法，这里的中性不仅指市场中性，也包括市场不同板块的效应、行业板块、各类货币等方面的中性。那段时间，我自主编程。这些融合中性策略的程序展示了模拟的能力。


    ![](Images/cutq_149_57426_l.jpg)


    2000年，我已经完全解决了俄罗斯债券违约事件带来的不利影响，正在积极研究不同的投资策略。那时，我还没有充分认识到，开发的策略要绝对多样化。但是我的确已经认识到，那两个阿尔法存在的相互依赖性是一个重大的风险因素，而对另一个阿尔法投资策略进行多样化调整，既可以提供更多的收益，还可以让回报曲线更平滑。我仍然面临一些挑战，从积极的一面来说，我刚刚触及指数级增长的可能性——知识孕育知识，数据产生数据；从消极的一面来说，我理解了独立工作的局限，独立工作可能带来心理压力，还可能带来一种我之前没有意识到的危险——思考内容与其他人雷同。只是单纯管理屈指可数的阿尔法，我的工作量也呈现指数级飞跃，更不要说有10个或100个阿尔法。


    那时我急需得到帮助。


    我们从来不会为了扩大生意规模而雇人。我也没有对人力资源工作进行总体规划，我们的招聘工作都是自然而然地发生的，都是机缘巧合的结果。“人生不可限量”，这是许多年前我学会的一条原则，也许我在父母宣布我们要离开家乡去美国时就学会了。事情不会总像你预期的那样呈现，能被谋划出来的毕竟有限。突破的关键在于行动：付诸一点一滴的行动，因为不能预见哪个点上的努力会变为现实，所以要想办法把每次努力连接在一起。通过培育机会，充分利用这些产出成果，你就可以放大实现成功的可能性。


    只有当我发现所需要的人才时，我们才会扩大人员规模。早期时，我只聘请了一位助手，等有合适人选后再聘请第二位。雇用更多的员工也会产生新的挑战：我必须花时间管理和培训他们。另外，当你拥有宝贵的知识产权时，你需要仔细保护它。这条经验来源于一段经历：那时我的一个助手离开了，说他准备返回校园学习，可他却将我们公司的一个程序带给了另一家公司。纸包不住火，他很快被新雇主解雇了。


    在那以后，我对有才能的人会心存警觉，当他们能够独当一面的时候，我才会雇用他们。这些有才能的人通常会带来自己的技术，开始构建交易系统并开发阿尔法模型，我会通过培训了解他们的个性、兴趣和才华。这也是一个不断递进的培养过程。那时我招募了许多有才能的人，比如杰夫·米勒（Jeff
    Miller），他曾经在纽约大学学习数学编程，并且在高盛工作过；还有布莱恩·约翰逊（Brian Johnson），他是芝加哥大学的数学博士和讲师。此后的很多年，我投入了很多时间，考虑如何找到我们所需要的身怀绝技的聪明人，这并不是一件很容易的事。任何指数级增长在起步阶段都是非常缓慢的，你几乎看不到变化，但是你必须为以后的发展打下坚实的基础。


    现在已经成为世坤投资首席投资官的杰弗里·洛普雷特，在麻省理工学院取得运筹学博士学位，又在德意志银行（Deutsche Bank）做过一段时间宽客[^(\[7\])](#chapter10.xhtml#comment_6798)（quant）后，于2003年8月加入世坤投资。当时这个团队（包括我在内）有6个人，成功开发并运行的阿尔法模型屈指可数。2006年12月，当我们筹备创办世坤投资时，我们已经有19个阿尔法模型了。一年之后，我们差不多有150个阿尔法模型；又过了一年（处于在金融危机中期），我们大概有了1000个；到2010年，我们有将近5000个。但是我们仍然只是在初始阶段。随后我们开始不断地雇用更多的人，但离阿尔法模型数量的大规模增长差得远；招聘工作转化出了巨大的生产效益。这些有才华的新人，给阿尔法模型的开发和投资组合策略带来很多新的灵感。2008年一整年，我还在继续管理自己的交易账户，但是最终还是不得不放弃，以便更加专注于世坤投资的管理。我真的有太多的任务需要处理。就像亚当·斯密在《国富论》（The
    Wealth of Nations）里描述的制针工厂，我们开始进行专业分工。更重要的是，这时阿尔法曲线开始向上弯曲。


    在这一时期的大部分时间里，我都没有什么总体规划，但事业依旧加速发展。从某种角度上讲，我们的日常工作就和市场自身运行一样，需要通过每日实验来检验价格和灵感，剔除无效的，奖励有效的。我已经开发出一定的技巧和方法，以及强大的技术，特别是模拟软件（我们对其持续优化）。我们也增加了越来越多的数据集，因为灵感越多，越能从中发现哪些阿尔法策略有效、哪些无效。努力终有回报，我们加强了对概率的掌握，也提高了风险管理能力。


    当时我们做得相当成功，但我们也知道成功可能会在瞬间消失。大概是2005年或者2006年的某天，我开始与依兹谈论从千禧管理公司分离世坤投资的问题。2005年，千禧管理公司在我生活过的老格林尼治开设了一间办公室，我的团队成员在隔间工作，我的玻璃墙办公室占用了大概1/3的面积。如果有新员工加入，我就移动办公室的隔断墙，我的办公室面积也逐渐收缩。


    我一直希望，有一天能够开创属于自己的事业。我也一直思考，我们能够从事哪些业务，怎样能够让生意发展壮大。我有一套适用于我自身发展的规则，它们是我长期摸索出来的，但是我还得重新制定规则，以适应不断增长的专业化分工岗位的需要，加速壮大我们的业务。一名优秀的交易员需要什么特质？这个人需要才智过人的头脑，做事精力集中，积极并善于行动而不是一味思考，善于从失败中汲取经验，表达简明扼要，思路简洁高效，具备诚实守信的品格、很强的独立思考能力、承担风险的能力，做到公私分明，能够驾驭自己，不会自我膨胀。一名优秀研究员需要什么特质？这个人需要富有创造力，面对困难时要有韧性，关注细节，有解决难题的智慧，具备永不止步、追求卓越的精神，做事有始有终，而且在我们的公司，这个人还要有一流的编程能力。一名优秀的管理者需要什么特质？这个人要善解人意，能够换位思考，具备聪明而智慧的头脑，具备开创精神，面对持续的困难能够坚韧不拔，做事不出结果则誓不罢休。你会发现，这三种人有许多优点是共通的：韧性、创造力、智力超群。我们按图索骥，在受过量化培训的人中寻求具有这些特质的人。


    慢慢地，我开始相信两条更进一步的原则，它们看似矛盾其实不然。


    具有可扩展性。一家优秀的公司能够自驱成长，我希望世坤投资具备这样的可扩展性。想要做到这点，就必须选对人。你必须在选人环节中投入足够的精力。因此，制定最优的人才激励方案尤为重要。如果选人和激励做好了，你再稍微用心做点事，业务就一定会增长。


    精简层级。我们的目标是尽可能安全地实现组织扁平化。时间就是金钱，时间是稀缺的。官僚主义作风会浪费时间和金钱。如果已经有了正确的人、正确的运营系统、正确的激励方案，只要没有附加庞大的层级体系，公司规模就会不断扩大。假以时日，关于经营业绩、研究成果等各项流程都会加倍获益。在呈指数级增长的运营体系中，浪费时间产生的损失也是加倍的。


    在我的愿景里，我们将保留与千禧管理公司之间的紧密联系，但是我们必须有自己的名号和自己做事情的方式。2006年晚些时候，双方达成一致意见，继续向前发展一步。2007年1月，世坤投资宣告成立。不久之后，我开始在老格林尼治寻找更大的房子，以适应公司规模不断扩大的需求。


    ![](Images/cutq_154_5532_l.jpg)


    那些年，我开始探索“scale”或“scaling”另外的含义。圣塔菲研究所（Santa Fe Institute）的理论物理学家杰弗里·韦斯特（Geoffrey
    West），在《规模》（Scale）一书中写道：“从最基本形式来看，规模缩放是指，一个系统在规模发生变化时如何做出响应。”寻找阿尔法信号是对市场动力学的一种探索，就像在混沌之间寻找有秩序的岛屿。市场中包含很多不可思议的要求：从随机的，甚至是杂乱无章的非线性系统中完成市场预测；从无序的股价中找出变化规律；从噪声信息中找出买卖信号。人为制造的市场有点像蜂巢或蚁穴，都存在聚集现象。这些聚集现象涉及许多智能体[^(\[8\])](#chapter10.xhtml#comment_7004)（agent），包括能够自主决定的、天生听命于人的、只是为了花粉而迷恋花朵的、为了寻求投资回报的各类智能体。这种集群智能（swarm
    intelligence）不是靠单一智能体产生的，例如，单只蜜蜂动作简单、能力有限，但是随着蜂群壮大，不同蜜蜂间分工协作的智能特性就会体现出来。关于蜂群的智能规则虽然还不能被完全解读，但是已经受到广泛关注。


    自然界充满了自发性，虽然情况很复杂，但我们仍然可以通过概率和比例观察其中的秩序和规则。大自然的和谐之声并非某位知名的作曲家或指挥家的作品，这看上去并没有中央控制者在发挥作用。也许最包罗万象的例子就是达尔文提出的以自然选择为核心的进化论。在自然界，变化发生在各个层级，包括分子、细胞、有机体、物种、属、科以及生态系统。各个层级可能是复杂的、易变的，而且容易受持续改变的外界条件和反馈机制的影响。在几百万年和许多代人的时间里，这些外界条件和反馈机制通过一个简单的、看似随机和不可预测的、实质上有规律可循的法则，塑造和重塑着生命。这一法则是基因突变驱动下的进化。我们现在可以通过DNA的生化机理，一窥这一自然法则。


    大约在公元前10000年，也就是在新石器时代（Neolithic period），农业发展起来之后，市场才开始存在。大概在6000年以前，苏美尔人在黏土制成的泥板上记录会计信息，这说明位于市场中心的某种交换开始出现。从会计信息来看，当时的出价也是相当随意的。确实，直到近年来，市场才变得像生态系统一样，过于复杂、难以完全理解和预测。


    当然，市场上充斥着许多自信心爆棚的人，他们认为自己无所不知。但直到过去50年左右，我们才刚刚开始厘清复杂系统（如天气预报、进化研究、市场预测）所遵循的规则。通过这些复杂系统，我们能够勉强识别其延伸出的一些模式和规律，尽管我们并不总是知道它们为什么而存在。


    现在让我们思考一下所谓的幂律[^(\[9\])](#chapter10.xhtml#comment_7067)（power law）。幂律表述的是两个量之间存在固定的统计关系，即当其中一个量发生相关变化时，另一个量会相应成比例地发生变化。例如，动物的体型越大，相对于体型小的动物，它们的代谢率按一定比例增长得越快。按数学术语来说，每增加4个单位的体重，就会相应增加3个单位的代谢率[^(\[10\])](#chapter10.xhtml#comment_7126)。因此，在代谢率上，一头蓝鲸比一只白鼠更高效。这一关系可以在直角坐标系中用X轴和Y轴绘制出来，生成一条向上倾斜的直线，斜率是3/4。


    如果你留心观察生活中的点点滴滴，你会发现幂律无处不在，无论是自然界还是人造世界（比如在物理学领域和社会科学领域），幂律有效地消除了自然与人类的界限。一些成比例的变化，通常是根据一个固定的指数或幂（乘方）实现的。例如，随着距离增大，重力作用将以2次幂减弱；随着边长变化，正方形的面积以2次幂进行变化；还有很多现象，如城市的大小、月球上陨石坑直径的分布、一种语言中单词的使用频率、地震的强度、名字的流行度、市场的繁荣与萧条等，都呈现根据幂律排序的规律，即数据分布近似一条直线或斜线，是一种对数图，而不是许多随机分散的点。


    概括来说，幂律暗示了许多现象是按不同层级划分规模的。在法国，小村庄远多于小城市；小城市远多于更大的区域性城市；最大规模的城市只有巴黎一个。实际上，最大的城市打破了众所周知的标度不变性（scale
    invariance，这是符合幂律分布的一个属性），它们就像流氓波、异常值（outliers）一样，超出了正常的规模。索内特戏称这种现象为“妖怪”（dragon
    kings），并将“妖怪”用来描述主要城市和全球性市场暴跌这类大事件。我们都知道，自19世纪中后期以来，不同规模经济体或者公司的收入分布似乎是遵从幂律的。意大利经济学家兼社会学家维尔弗雷多·帕累托（Vilfredo
    Pareto）提出著名的“80/20法则”：80%的财富是由20%的人群控制的，财富值与人口数呈反比关系（帕累托创造了“阿尔法”这个词来描述该直线斜率）。这一法则在很多场景下都适用，比如打赌和计算机程序漏洞的修复。帕累托发现80%的豌豆是从20%的豆荚里长出的。即使是互联网的许多方面，比如网站的访问次数、页面浏览量、页面的链接量，也都遵循幂律。


    幂律通常也适用于那些在明显的混沌中产生自发秩序的复杂系统或网络。自组织现象被随机波动触发，然后被正反馈（positive feedback）放大。在美国新墨西哥州中部城镇洛斯阿拉莫斯，乌拉姆和冯·诺依曼在理论上设计了自复制细胞自动机。这是一种简单细胞或机器人，具有开启和关闭两种状态，可以依靠某种固定法则进行繁殖，并按极其复杂的方式通过随机交互作用进行进化。著名的约翰·康威（John
    Conway）已经通过生命游戏（Game of Life，一种仿真游戏，其中每一个细胞都包含一个通用图灵机）探索了细胞自动机的进化。'
