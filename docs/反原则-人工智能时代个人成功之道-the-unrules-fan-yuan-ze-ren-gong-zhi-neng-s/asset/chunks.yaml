    # [第五章 波](../Text/contents.xhtml#e_9)


    “只要采取行动，其他都不重要。”


    当我还只是个孩子的时候，父亲差不多每天都在练习小提琴，我时常沉浸在他演奏的声波里。实际上，我们所有人（包括孩子和大人）每天都沉浸在各种物理表现的波中：声波、水波、电磁波。波是有规律的，而且波可以通过数学表达。然而，我们经常想当然地理解波。


    在19世纪，与波现象有关的科学发现产出非常丰富，这些发现跨越一个宽广的领域，特别是在经典物理领域。20世纪，奥地利物理学家埃尔温·薛定谔（Erwin Schrödinger）建立了波动方程，他通过振荡、正弦曲线、上升、下降模型描述电子的运动行为，并把这样的现象称为波动力学。在同一时间，德国哥廷根大学（University
    of Göttinge，这所大学也是冯·诺伊曼、希尔伯特和其他关键人物早年学习与成长的摇篮）的维尔纳·海森堡（Werner Heisenberg）开发了一组和波动方程近似精准的方程，用它描述微观粒子的运动行为，并提出用矩阵力学——用希尔伯特所倡导的代数方法来计算粒子运动的科学。后来，冯·诺依曼很快发现薛定谔方程和海森堡方程之间存在根本上的相关性；其实，薛定谔和海森堡用各自的方法描述的都是同一自然现象，那就是量子力学。


    海森堡后来认为，我们虽然可以精确地描述一个粒子的动量[^(\[1\])](#chapter8.xhtml#comment_4170)（momentum）或位置，但不能在同一时间测量其中一个。动量可以由波函数求解，而位置是作为一个区域中一个点进行测量的。这就是海森堡的不确定性原理[^(\[2\])](#chapter8.xhtml#comment_4175)（uncertainty
    principle）：观察量子位置会影响量子的动量，反之亦然。现在我们想到基础粒子，包括光的光子和电的电子，它们共享波和粒子的属性，但是反直觉的概念一直困扰着爱因斯坦，直至他1955年去世。


    我们也可以把市场变化看作一种波动现象。通过追踪股票或市场的价格起落，我们可以勾勒一只股票或市场的变化。如果让这些价格变化图变得平滑一些，它们就会像乐器有规律地振动，或像海浪匀速地冲击着海滩。有时，这些波动会产生一个清晰的声调或信号，但有时只产生不和谐的随机噪声。


    ![](Images/cutq_98_7166_l.jpg)


    北海[^(\[3\])](#chapter8.xhtml#comment_4227)是世界上最密集的航运地区之一，支撑着几个主要发达国家的贸易。这些国家不仅包括挪威、丹麦、德国、荷兰、比利时、法国和英国，还包括斯堪的纳维亚半岛的其他国家、波罗的海的3个国家，以及俄罗斯。北海依傍于欧洲大陆架，由于地表石油较浅，具备开采优势，这里分布了相当多的海上钻井平台。但是北海的航道并不安全。由于恶劣的天气、复杂的风场类型在大陆架附近掀起无数的惊涛骇浪，在大海中颠簸的船只增加了航行危险性，也增加了和海上石油平台与陆地或海下岩石组成物相撞的危险性。这使得北海相比开阔水域而言危险性更大。


    许多年，那些关于海事神话的传闻都在反复强调北海的异常海浪非常猛烈，破坏性极大。另外，根据那些目击者的陈述，这些破坏性极强的波浪不可能被提前预测，因为它们看起来神出鬼没，好像没有规律可循。这些波浪具有一些共性：它们通常突然出现在相对平静的海面上（尽管按照常识来说，波涛汹涌的海面更加具有破坏性），看起来像是在各种角度沿着盛行风主导风向和涌浪方向移动着，且移动速度很快，从表象看起来很容易辨识。当这些波浪接近时，海面就会升起一面水墙，水墙前面有一个很深的海洞，自古被称作“海中无底洞”，后面还有另外的海洞。这些行驶在惊涛骇浪里的船只，一旦遇上这些波浪，经常要么消失得无影无踪，要么沉没。


    科学家们通常视这些故事为臆想、幻觉或者胡言乱语。然而，在1995年元旦那天下午的3:20，北海的德劳普纳（Draupner）钻井平台被巨浪吞没（德劳普纳是属于奥丁神所有的金戒指的名字。奥丁神是日耳曼神话中的一个神，具备自我繁殖能力）。幸运的是，尽管装备的主体架构遭到海浪的破坏，但钻井平台还是保存完整，躲在钻探平台设备中的工作人员在这次巨浪中得以生还。事实上，工作人员也没有亲眼看见过那次巨浪。通过钻探平台上的常规遥感勘测激光检测设备，技术人员追踪到了涌浪经过前、经过时和经过后的运动轨迹。最大的波形高度从波谷到波峰估计有84英尺[^(\[4\])](#chapter8.xhtml#comment_4285)；单一最高波峰大约是之前和之后波峰的3倍高。当时，德劳普纳钻井平台所在地并没有发生暴风雨，附近也没有发生这样规模的海浪。


    德劳普纳发生的海浪激发了大家研究的兴趣。“流氓波”（Rogue wave，或称疯狗浪）现在已成为一个技术术语。科学家们估测，流氓波平均每年会使一艘大船沉没。1995年9月初，德罗普尼尔钻井平台被流氓波撞击的同一年，北大西洋上的一个流氓波撞击了伊丽莎白女王II号，当时这艘船正在从瑟堡（Cherbourg，法国西北部港市）航行到纽约的途中。为加拿大的海上天气进行预报的海上浮标系统判断，该波浪有98英尺高。船长在航行日志中写道：“这艘船看起来好像正在驶向多佛（Dover）港的白悬崖。”波浪卷过船头，导致船体产生一阵巨大的震动，紧接着就是两个小一些的震动，船体掉入波浪另一侧的“洞”里。万幸的是，伊丽莎白女王II号只遭受轻微的破坏，没有发生人员伤亡。


    是什么导致了“流氓波”？最普遍的假设是，流氓波是因为在同一地点同时发生多重小海浪的波动而产生的。当你在海滩上看到来来回回的海浪融合形成一个更大的波峰，然后爆发时，你就可以看到流氓波。但这些波只在浅水域的影响下才出现。假设者们没能解释移动的流氓波为什么能持久保持形状，以及流氓波两侧的深海洞是怎么形成的。尽管假设者们坚称，时间再久的话，流氓波的形态会发生变化，但是大部分流氓波都会突然出现，然后没有变化地消失。流氓波的形状特征明显，与常规的波浪比起来，它的形状比较平滑。正常的波浪成群结队地起伏出现，并且缓慢地散开。流氓波是单独行动，但水浪好像彼此相约在某个地方汇合一样地行进。关于流氓波现象的形成原因，主要还有与潮汐、火山现象，以及风效应有关的假说，但是所有这些假说都被证明存在缺陷。潮涌导致的波浪形状又长又平。没有证据表明，在出现流氓波的大湖中曾出现火山活动。在没有任何风的情况下，有时也会发生流氓波现象。


    有一种波在本质上是与众不同的，那就是海啸波。海啸波是机械波，它有一个明确的外因（比如地震），是通过一些外界的活动而不是内因而产生的。当地壳构造板块移动时，海床突然升起，海床的垂直运动引发水体的置换，从而生成一系列巨大的浪潮。因为海床的垂直运动产生了大量的能量，所以海啸产生的波浪以一个极快的速度移动并穿过宽广的区域（置换的水体越多，波浪传播速度就越大）。在海拔较低的开阔水域，海啸波漫过船的浮子能引起船员的注意。海啸撞击陆地会引发极大的破坏作用。当海啸接近浅水域时，由于深度变浅，波高突然增大，垂直位移的海水显示出水平和垂直两种形式相结合的运动：波浪升起到海平面以上，开始起伏；被相互间的水浪的摩擦阻碍，海水聚积起来形成很高的水墙。这些力量形成一种巨大的、破坏性的“破浪波”（breaking
    wave），这是一种“潮汐波”（tidal wave）。


    但是，尽管海啸在撞击陆地前也制造了一种惊人的波浪，但与开阔水域的巨大的流氓波完全不同。海啸现象推动了流体力学的研究。海啸中的水体并不是向前移动的，而是上下移动的，海啸的能量却是向前移动的。垂直干扰的波从一个位置传到下一个位置，就像足球赛观众席此起彼伏的人浪一样。因为传播的媒介是流体，所以在任何固定位置的上下移动通常不会在一个单循环后停止。由于水体内相互摩擦的作用，所以水体的单循环会留存下来，但它会随着时间的推移而减弱。你可以想象一下，向池塘里扔进一小块石头，在石头掉进湖底后很长一段时间，波纹从石头撞击水面的位置开始向外扩散，并越来越小。'
  fmt: '

    这些计算要求比当时机械计算器所具备的能力要高太多。20世纪50年代早期，成为价值线公司研究部主任的艾森斯塔特买了当时仅生产46台的通用自动计算机（Universal
    Automatic Computer，`UNIVAC`）中的一台，`UNIVAC`当时是世界上首次生产的商用大型主机（这在当时还是一个新鲜的词汇）。`UNIVAC`，或者称为通用自动计算机，是`ENIAC`计算机（Electronic
    Numerical Integrator And Calculator）的直接继承者。`ENIAC`是由宾夕法尼亚大学的埃克特和莫克利发明的。1950年，他们的公司被打字机制造商雷明顿兰德（RemingtonRand）公司收购后，由罗伯特·奥本海默在洛斯阿拉莫斯的老领导——莱斯利·格罗夫斯将军（General
    Leslie Groves）执掌。购买`UNIVAC`的第一位客户是美国人口普查局，他们为支持开发工作而买单。这一计算机重达13吨，中央处理器占据1250平方英尺[^(\[2\])](#chapter7.xhtml#comment_3774)的空间，每秒运算次数大约为2000，内存可容纳12000字符。数据通过打孔卡片写入，一张卡代表一个指令。


    尽管价值线公司缺少曼哈顿计划所拥有的人力，但其运算能力更强大的主机与艾森斯塔特更为复杂的量化方法相结合，可以更快、更详尽、更精确地做出价值线，尤其是在统计检验方面的计算。尽管如此，出于各种原因，专业学者与华尔街研究社团仍对伯恩哈德的方法持极端悲观的看法。学术界认为，价值线的结果违背了有效市场假说，华尔街则将价值线看作将直觉与专业知识进行量化的一种粗略尝试。


    费希尔·布莱克也对价值线持怀疑态度，他本人信仰强有效的市场。他在1973年写道，“我的立场已经比强式随机漫步假说更极端”，“我说过，挑选那些表现更好的股票的尝试是不会成功的”。布莱克从不会公开宣布放弃已有的观点，但是他会以一种重要的方式改变观点。


    1970年，布莱克与伯恩哈德在芝加哥的一个会议上进行辩论。在一个名为“投资组合管理：是主动投资还是被动投资”的分组会议上，布莱克选择站队被动投资一方。伯恩哈德把股票表现从最好的等级到最差的等级分为5级，通过展示价值线5种分级的实际结果，为主动投资一方进行辩护。布莱克承认这次辩论让他印象深刻，并且引发他更深一步地研究回归分析的应用，将投资组合的回报与市场整体回报相分离，想办法找出我们现在称为从贝塔（`beta`）而来的阿尔法。


    布莱克随后给《金融分析师杂志》（Financial Analysts Journal）的编辑写了一封信，概述了他的结果：“假设交易成本控制在2%或者很小的变动幅度，那么价值线策略能够在5年期间持续对投资组合模拟的净结果带来显著效果，尽管显著性水平有所降低……当然，过去的成功有时不会延续到未来。然而有趣的是，价值线评级的业绩就像建立初期一样稳定，和这篇报告所覆盖的5年期效果一样好。”布莱克给这封信冠以“是的，弗吉尼亚，有希望：价值线评级系统的测试”的标题。


    这封信引发了一场关于有效市场与价值线的持续数年的辩论。与价值线（间接暗示有效市场假说已经是神圣不可侵犯的）这个叫法一样怪异的是，价值线理论存在一个被布莱克理解得非常透彻的原则：如果有效市场假说没有得以完全运行，如果所有信息没有被完全体现在当前股价里，那么股票价格不会完全遵循随机游走规律。有效性可能不那么强。尽管股价可能在很大程度上会遵循随机游走规律，但并不会完全遵循。股价的随机性就像噪声，其中可能包含非随机规律，也就是存在信号。必然地，对有效市场假说的违背现象被一些基本面分析、主动投资、价值投资方法应用：就像技术交易员喜欢用图表、术语和证据来证明一样，理论上，关于未来股价变动的信息体现在之前的价格变化中。


    但想从噪声中提取这一信号并不容易。价值线存在于伯恩哈德的手工计算到艾森斯塔特的`UNIVAC`，再到后续体积更小、功能更强大的计算机。计算机已经被广泛使用、无所不在。今天，任何人都可以通过使用各种复杂数据库以及强大的软件工具获取数据，例如通过使用托马斯·彼得菲的盈透证券所提供的工具，这个工具只收取象征性的月费。价值线公司虽然失去了智能优势，但仍然作为一家网站存在着，宣传着一条令人舒服、听上去积极乐观的口号：“投资研究领域最受信任的公司”。1987年，伯恩哈德去世。


    价值线再次出现在布莱克的传记里。在建议高盛的交易员怎样利用标准的布莱克—斯科尔斯期权定价模型后，布莱克转向研究错误定价（`mispricing`），他在麻省理工学院教学那些年就提出这一课题。1982年，堪萨斯城期货交易所（Kansas
    City Board of Trade）推出了第一份指数期货合约，其建立在价值线股票池的基础上。价值线的股票指数是一个几何平均数，而不是算数平均数。它并不是大多数交易员认为的，是由每年的回报的简单平均得到的，而是需要计算当年股价对上一年股价的比率。布莱克所知更详。布莱克知道错误定价很小，但他意识到即使是很小的错误定价，也可以是显著的，最终可以实现套利。1984年，来到高盛后不久，布莱克给公司的交易员演示了怎样利用这一错误。他们照做了，并获取了很大的盈利。在1986年夏天这一错误被弥补之前（套利交易信号消失），仅公布出来的公司盈利就达1.5亿美元。不久后，布莱克成为高盛的合伙人。


    1995年，费希尔·布莱克去世，年仅57岁。因为他的去世，他没能因布莱克—斯科尔斯模型而获得诺贝尔奖，最终该奖由斯科尔斯和默顿在两年后获得。其实，在1985年12月，布莱克作为当时的美国金融协会（American
    Finance Association）主席在纽约举行的年度大会上做了主旨演讲。他把自己的演讲以及后来发布的论文精炼后命名为《噪声》。这是典型的布莱克式表达：论点鲜明、用词精准而且回味无穷。这篇论文大部分反映了市场与交易本质，也反映了市场有效性。


    一开始，布莱克将噪声与信息加以对比。他提供了一个透彻的观察结论，体现了噪声交易者[^(\[3\])](#chapter7.xhtml#comment_3932)和信息交易者的共生与竞争关系。他写道：“把我们观察世界的方法用在我的模型里，噪声就是使我们的观察结论不那么完美的东西。它让我们无法清晰地知道一只股票或一个投资组合的预期回报……它让我们无法知道该做些什么才可以让回报变得更好。”因为噪声总是存在的，所以市场总是不那么完美有效。我们通常会错过有效性，因为许多交易实际上是基于噪声在交易，但看起来会像是基于信息在交易。“噪声交易者放到抬高股价中的噪声是会渐增的，就像一名醉汉总是倾向于离他的出发点越来越远，这两者的道理是一样的。”


    所有关于价值的估计都是充满噪声的，布莱克写道，所以我们从来不知道价格偏离价值有多远。一个市场是有效的，他特别指出，“价格是在价值2个因子范围内，也就是说，价格在价值的1/2以上或者在2倍价值以内”。他承认这既是一个武断的数字，又是一个他认为比较合理的数字。在这一定义的基础上，他说：“几乎所有时候、几乎所有市场都是有效的。‘几乎所有’意味着90%以上。”


    距离强式有效市场（strong form of efficiency market）还有很长一段路需要走。布莱克的观察结果解释了：为什么积极投资或价值投资有时会繁荣兴旺，为什么我在廷贝尔—希尔公司和千禧管理公司所努力尝试的量化投资也会有一席之地。市场上的噪声可能是喧闹的，但是总有一些规律——不管某些信号有多弱，有些信息交易者总可以察觉到，并且在交易时加以参考。简而言之，总有办法可以战胜市场，但是很少有交易者能够持续战胜。


    ![](Images/cutq_93_53221_l.jpg)


    我还在不断发展的路上。在开始第五章之前，我想插入一个故事，它是我在从学校到职场来回切换的那些年里悄然发生的。


    我十几岁时，父亲决心再一次彻底地重塑自己。离开纽约到里士满之后，父亲决定要成为一名小提琴制作者。他是一名熟练的小提琴演奏家，并且深知制造更优秀的，甚至伟大的乐器需要什么：由精选木材制成的音箱、干燥工艺、上漆工艺，只有这些才能将琴弓拉过琴弦产生的振动放大成共鸣的声波。但是他对制作（或修理和修复）小提琴知之甚少。小提琴的传统制作工艺可以追溯到16世纪，阿玛蒂（Amati）、瓜纳里（Guarneri）家族以及更有名的安东尼奥·斯特拉迪瓦里（Antonio
    Stradivari），在克雷莫纳（Cremona，意大利城市）制作了许多音色华美的小提琴。在意大利，成为一名弦乐器工匠的流程包含跟随一名大师学艺的漫长学徒生涯。时至今日，这个流程还一直保留。要成为一名学徒，通常需要你年轻且未婚，对生活的物质需求非常少，以便和微薄的收入相匹配，还必须这样安安心心干上几年才行。


    我的父亲已有家庭，还有另一份工作要做，而且人到中年，但是他并没有被吓退。尽管还是一个初学者，他仍然旁听了俄亥俄州的欧柏林学院（Oberlin College）制琴师的课程。在一次现场演奏会中，他发现自己隔壁的大提琴演奏家也是一位小提琴制作者。他很不情愿地同意让父亲协助和观摩。“协助”通常意味着打扫地板。在白天练习与工作之余，父亲把剩下时间都用来自学小提琴制作。


    几年之后，我和我的商业合伙人依兹·英格兰德在曼哈顿上东区的一家餐厅用餐。餐厅的名字是“Sette Mezzo”，这是一家小巧的、不那么引人注意的意大利餐馆，但拥有一些不同寻常的名人老主顾，他们许多人就住在餐馆附近。一位社会名流来到我们的餐桌，依兹把我介绍给他。


    “哦，我知道一位著名的小提琴制作者也用这个姓氏”，他说。


    “那是我的父亲”。我自豪地答道。


    锲而不舍。


    * * *


    [\[1\]](#chapter7.xhtml#commentRef_3026)在计算机学科中，存在多项式时间（Polynomial time）的算法的一类问题为`P`类问题；至今没有找到多项式时间算法解的一类问题为`NP`类问题。多项式时间在计算复杂度理论中，指的是一个问题的计算时间m（n）不大于问题大小n的多项式倍数。任何抽象机器都拥有一复杂度类，此类包括可于此机器以多项式时间求解的问题。而`NP`问题中最困难的问题称为`NPC`问题，根据库克定理，任意一个`NPC`问题如果能够在多项式时间内解决，则所有的`NP`问题都能在多项式时间内解决，而至今这一问题仍无答案。无法直接计算得到的，只能通过间接的“猜算”得到结果的问题就是非确定性问题。而这些问题通常可通过算法解决，但是这类算法的复杂性是指数级的，因此，计算的时间随问题的复杂程度呈现指数级增长，很快便变得不可计算了。——译者注


    [\[2\]](#chapter7.xhtml#commentRef_3737)1平方英尺≈0.093平方米。——编者注


    [\[3\]](#chapter7.xhtml#commentRef_3922)噪声交易者是指在几乎没有信息的情况下进行交易的人，即使他们认为自己是“知情的”，把噪声错误当作信息进行交易。他们的存在会使资产价格定价产生偏差。——译者注


    # [第五章 波](../Text/contents.xhtml#e_9)


    “只要采取行动，其他都不重要。”


    当我还只是个孩子的时候，父亲差不多每天都在练习小提琴，我时常沉浸在他演奏的声波里。实际上，我们所有人（包括孩子和大人）每天都沉浸在各种物理表现的波中：声波、水波、电磁波。波是有规律的，而且波可以通过数学表达。然而，我们经常想当然地理解波。


    在19世纪，与波现象有关的科学发现产出非常丰富，这些发现跨越一个宽广的领域，特别是在经典物理领域。20世纪，奥地利物理学家埃尔温·薛定谔（Erwin Schrödinger）建立了波动方程，他通过振荡、正弦曲线、上升、下降模型描述电子的运动行为，并把这样的现象称为波动力学。在同一时间，德国哥廷根大学（University
    of Göttinge，这所大学也是冯·诺伊曼、希尔伯特和其他关键人物早年学习与成长的摇篮）的维尔纳·海森堡（Werner Heisenberg）开发了一组和波动方程近似精准的方程，用它描述微观粒子的运动行为，并提出用矩阵力学——用希尔伯特所倡导的代数方法来计算粒子运动的科学。后来，冯·诺依曼很快发现薛定谔方程和海森堡方程之间存在根本上的相关性；其实，薛定谔和海森堡用各自的方法描述的都是同一自然现象，那就是量子力学。


    海森堡后来认为，我们虽然可以精确地描述一个粒子的动量[^(\[1\])](#chapter8.xhtml#comment_4170)（`momentum`）或位置，但不能在同一时间测量其中一个。动量可以由波函数求解，而位置是作为一个区域中一个点进行测量的。这就是海森堡的不确定性原理[^(\[2\])](#chapter8.xhtml#comment_4175)（`uncertainty
    principle`）：观察量子位置会影响量子的动量，反之亦然。现在我们想到基础粒子，包括光的光子和电的电子，它们共享波和粒子的属性，但是反直觉的概念一直困扰着爱因斯坦，直至他1955年去世。


    我们也可以把市场变化看作一种波动现象。通过追踪股票或市场的价格起落，我们可以勾勒一只股票或市场的变化。如果让这些价格变化图变得平滑一些，它们就会像乐器有规律地振动，或像海浪匀速地冲击着海滩。有时，这些波动会产生一个清晰的声调或信号，但有时只产生不和谐的随机噪声。


    ![](Images/cutq_98_7166_l.jpg)


    北海[^(\[3\])](#chapter8.xhtml#comment_4227)是世界上最密集的航运地区之一，支撑着几个主要发达国家的贸易。这些国家不仅包括挪威、丹麦、德国、荷兰、比利时、法国和英国，还包括斯堪的纳维亚半岛的其他国家、波罗的海的3个国家，以及俄罗斯。北海依傍于欧洲大陆架，由于地表石油较浅，具备开采优势，这里分布了相当多的海上钻井平台。但是北海的航道并不安全。由于恶劣的天气、复杂的风场类型在大陆架附近掀起无数的惊涛骇浪，在大海中颠簸的船只增加了航行危险性，也增加了和海上石油平台与陆地或海下岩石组成物相撞的危险性。这使得北海相比开阔水域而言危险性更大。


    许多年，那些关于海事神话的传闻都在反复强调北海的异常海浪非常猛烈，破坏性极大。另外，根据那些目击者的陈述，这些破坏性极强的波浪不可能被提前预测，因为它们看起来神出鬼没，好像没有规律可循。这些波浪具有一些共性：它们通常突然出现在相对平静的海面上（尽管按照常识来说，波涛汹涌的海面更加具有破坏性），看起来像是在各种角度沿着盛行风主导风向和涌浪方向移动着，且移动速度很快，从表象看起来很容易辨识。当这些波浪接近时，海面就会升起一面水墙，水墙前面有一个很深的海洞，自古被称作“海中无底洞”，后面还有另外的海洞。这些行驶在惊涛骇浪里的船只，一旦遇上这些波浪，经常要么消失得无影无踪，要么沉没。


    科学家们通常视这些故事为臆想、幻觉或者胡言乱语。然而，在1995年元旦那天下午的3:20，北海的德劳普纳（Draupner）钻井平台被巨浪吞没（德劳普纳是属于奥丁神所有的金戒指的名字。奥丁神是日耳曼神话中的一个神，具备自我繁殖能力）。幸运的是，尽管装备的主体架构遭到海浪的破坏，但钻井平台还是保存完整，躲在钻探平台设备中的工作人员在这次巨浪中得以生还。事实上，工作人员也没有亲眼看见过那次巨浪。通过钻探平台上的常规遥感勘测激光检测设备，技术人员追踪到了涌浪经过前、经过时和经过后的运动轨迹。最大的波形高度从波谷到波峰估计有84英尺[^(\[4\])](#chapter8.xhtml#comment_4285)；单一最高波峰大约是之前和之后波峰的3倍高。当时，德劳普纳钻井平台所在地并没有发生暴风雨，附近也没有发生这样规模的海浪。


    德劳普纳发生的海浪激发了大家研究的兴趣。“流氓波”（`Rogue wave`，或称疯狗浪）现在已成为一个技术术语。科学家们估测，流氓波平均每年会使一艘大船沉没。1995年9月初，德罗普尼尔钻井平台被流氓波撞击的同一年，北大西洋上的一个流氓波撞击了伊丽莎白女王II号，当时这艘船正在从瑟堡（Cherbourg，法国西北部港市）航行到纽约的途中。为加拿大的海上天气进行预报的海上浮标系统判断，该波浪有98英尺高。船长在航行日志中写道：“这艘船看起来好像正在驶向多佛（Dover）港的白悬崖。”波浪卷过船头，导致船体产生一阵巨大的震动，紧接着就是两个小一些的震动，船体掉入波浪另一侧的“洞”里。万幸的是，伊丽莎白女王II号只遭受轻微的破坏，没有发生人员伤亡。


    是什么导致了“流氓波”？最普遍的假设是，流氓波是因为在同一地点同时发生多重小海浪的波动而产生的。当你在海滩上看到来来回回的海浪融合形成一个更大的波峰，然后爆发时，你就可以看到流氓波。但这些波只在浅水域的影响下才出现。假设者们没能解释移动的流氓波为什么能持久保持形状，以及流氓波两侧的深海洞是怎么形成的。尽管假设者们坚称，时间再久的话，流氓波的形态会发生变化，但是大部分流氓波都会突然出现，然后没有变化地消失。流氓波的形状特征明显，与常规的波浪比起来，它的形状比较平滑。正常的波浪成群结队地起伏出现，并且缓慢地散开。流氓波是单独行动，但水浪好像彼此相约在某个地方汇合一样地行进。关于流氓波现象的形成原因，主要还有与潮汐、火山现象，以及风效应有关的假说，但是所有这些假说都被证明存在缺陷。潮涌导致的波浪形状又长又平。没有证据表明，在出现流氓波的大湖中曾出现火山活动。在没有任何风的情况下，有时也会发生流氓波现象。


    有一种波在本质上是与众不同的，那就是海啸波。海啸波是机械波，它有一个明确的外因（比如地震），是通过一些外界的活动而不是内因而产生的。当地壳构造板块移动时，海床突然升起，海床的垂直运动引发水体的置换，从而生成一系列巨大的浪潮。因为海床的垂直运动产生了大量的能量，所以海啸产生的波浪以一个极快的速度移动并穿过宽广的区域（置换的水体越多，波浪传播速度就越大）。在海拔较低的开阔水域，海啸波漫过船的浮子能引起船员的注意。海啸撞击陆地会引发极大的破坏作用。当海啸接近浅水域时，由于深度变浅，波高突然增大，垂直位移的海水显示出水平和垂直两种形式相结合的运动：波浪升起到海平面以上，开始起伏；被相互间的水浪的摩擦阻碍，海水聚积起来形成很高的水墙。这些力量形成一种巨大的、破坏性的“破浪波”（`breaking
    wave`），这是一种“潮汐波”（`tidal wave`）。


    但是，尽管海啸在撞击陆地前也制造了一种惊人的波浪，但与开阔水域的巨大的流氓波完全不同。海啸现象推动了流体力学的研究。海啸中的水体并不是向前移动的，而是上下移动的，海啸的能量却是向前移动的。垂直干扰的波从一个位置传到下一个位置，就像足球赛观众席此起彼伏的人浪一样。因为传播的媒介是流体，所以在任何固定位置的上下移动通常不会在一个单循环后停止。由于水体内相互摩擦的作用，所以水体的单循环会留存下来，但它会随着时间的推移而减弱。你可以想象一下，向池塘里扔进一小块石头，在石头掉进湖底后很长一段时间，波纹从石头撞击水面的位置开始向外扩散，并越来越小。

    '
  trans: '


    这些计算要求比当时机械计算器所具备的能力要高太多。20 世纪 50 年代早期，成为价值线公司研究部主任的艾森斯塔特买了当时仅生产 46 台的通用自动计算机（Universal
    Automatic Computer，`UNIVAC`）中的一台，`UNIVAC`当时是世界上首次生产的商用大型主机（这在当时还是一个新鲜的词汇）。`UNIVAC`，或者称为通用自动计算机，是`ENIAC`计算机（Electronic
    Numerical Integrator And Calculator）的直接继承者。`ENIAC`是由宾夕法尼亚大学的埃克特和莫克利发明的。1950 年，他们的公司被打字机制造商雷明顿兰德（RemingtonRand）公司收购后，由罗伯特·奥本海默在洛斯阿拉莫斯的老领导——莱斯利·格罗夫斯将军（General
    Leslie Groves）执掌。购买`UNIVAC`的第一位客户是美国人口普查局，他们为支持开发工作而买单。这一计算机重达 13 吨，中央处理器占据 1250
    平方英尺[^(\[2\])](#chapter7.xhtml#comment_3774)的空间，每秒运算次数大约为 2000，内存可容纳 12000 字符。数据通过打孔卡片写入，一张卡代表一个指令。


    尽管价值线公司缺少曼哈顿计划所拥有的人力，但其运算能力更强大的主机与艾森斯塔特更为复杂的量化方法相结合，可以更快、更详尽、更精确地做出价值线，尤其是在统计检验方面的计算。尽管如此，出于各种原因，专业学者与华尔街研究社团仍对伯恩哈德的方法持极端悲观的看法。学术界认为，价值线的结果违背了有效市场假说，华尔街则将价值线看作将直觉与专业知识进行量化的一种粗略尝试。


    费希尔·布莱克也对价值线持怀疑态度，他本人信仰强有效的市场。他在 1973 年写道，“我的立场已经比强式随机漫步假说更极端”，“我说过，挑选那些表现更好的股票的尝试是不会成功的”。布莱克从不会公开宣布放弃已有的观点，但是他会以一种重要的方式改变观点。


    1970 年，布莱克与伯恩哈德在芝加哥的一个会议上进行辩论。在一个名为“投资组合管理：是主动投资还是被动投资”的分组会议上，布莱克选择站队被动投资一方。伯恩哈德把股票表现从最好的等级到最差的等级分为
    5 级，通过展示价值线 5 种分级的实际结果，为主动投资一方进行辩护。布莱克承认这次辩论让他印象深刻，并且引发他更深一步地研究回归分析的应用，将投资组合的回报与市场整体回报相分离，想办法找出我们现在称为从贝塔（`beta`）而来的阿尔法。


    布莱克随后给《金融分析师杂志》（Financial Analysts Journal）的编辑写了一封信，概述了他的结果：“假设交易成本控制在 2%或者很小的变动幅度，那么价值线策略能够在
    5 年期间持续对投资组合模拟的净结果带来显著效果，尽管显著性水平有所降低……当然，过去的成功有时不会延续到未来。然而有趣的是，价值线评级的业绩就像建立初期一样稳定，和这篇报告所覆盖的
    5 年期效果一样好。”布莱克给这封信冠以“是的，弗吉尼亚，有希望：价值线评级系统的测试”的标题。


    这封信引发了一场关于有效市场与价值线的持续数年的辩论。与价值线（间接暗示有效市场假说已经是神圣不可侵犯的）这个叫法一样怪异的是，价值线理论存在一个被布莱克理解得非常透彻的原则：如果有效市场假说没有得以完全运行，如果所有信息没有被完全体现在当前股价里，那么股票价格不会完全遵循随机游走规律。有效性可能不那么强。尽管股价可能在很大程度上会遵循随机游走规律，但并不会完全遵循。股价的随机性就像噪声，其中可能包含非随机规律，也就是存在信号。必然地，对有效市场假说的违背现象被一些基本面分析、主动投资、价值投资方法应用：就像技术交易员喜欢用图表、术语和证据来证明一样，理论上，关于未来股价变动的信息体现在之前的价格变化中。


    但想从噪声中提取这一信号并不容易。价值线存在于伯恩哈德的手工计算到艾森斯塔特的`UNIVAC`，再到后续体积更小、功能更强大的计算机。计算机已经被广泛使用、无所不在。今天，任何人都可以通过使用各种复杂数据库以及强大的软件工具获取数据，例如通过使用托马斯·彼得菲的盈透证券所提供的工具，这个工具只收取象征性的月费。价值线公司虽然失去了智能优势，但仍然作为一家网站存在着，宣传着一条令人舒服、听上去积极乐观的口号：“投资研究领域最受信任的公司”。1987
    年，伯恩哈德去世。


    价值线再次出现在布莱克的传记里。在建议高盛的交易员怎样利用标准的布莱克—斯科尔斯期权定价模型后，布莱克转向研究错误定价（`mispricing`），他在麻省理工学院教学那些年就提出这一课题。1982
    年，堪萨斯城期货交易所（Kansas City Board of Trade）推出了第一份指数期货合约，其建立在价值线股票池的基础上。价值线的股票指数是一个几何平均数，而不是算数平均数。它并不是大多数交易员认为的，是由每年的回报的简单平均得到的，而是需要计算当年股价对上一年股价的比率。布莱克所知更详。布莱克知道错误定价很小，但他意识到即使是很小的错误定价，也可以是显著的，最终可以实现套利。1984
    年，来到高盛后不久，布莱克给公司的交易员演示了怎样利用这一错误。他们照做了，并获取了很大的盈利。在 1986 年夏天这一错误被弥补之前（套利交易信号消失），仅公布出来的公司盈利就达
    1.5 亿美元。不久后，布莱克成为高盛的合伙人。


    1995 年，费希尔·布莱克去世，年仅 57 岁。因为他的去世，他没能因布莱克—斯科尔斯模型而获得诺贝尔奖，最终该奖由斯科尔斯和默顿在两年后获得。其实，在
    1985 年 12 月，布莱克作为当时的美国金融协会（American Finance Association）主席在纽约举行的年度大会上做了主旨演讲。他把自己的演讲以及后来发布的论文精炼后命名为《噪声》。这是典型的布莱克式表达：论点鲜明、用词精准而且回味无穷。这篇论文大部分反映了市场与交易本质，也反映了市场有效性。


    一开始，布莱克将噪声与信息加以对比。他提供了一个透彻的观察结论，体现了噪声交易者[^(\[3\])](#chapter7.xhtml#comment_3932)和信息交易者的共生与竞争关系。他写道：“把我们观察世界的方法用在我的模型里，噪声就是使我们的观察结论不那么完美的东西。它让我们无法清晰地知道一只股票或一个投资组合的预期回报……它让我们无法知道该做些什么才可以让回报变得更好。”因为噪声总是存在的，所以市场总是不那么完美有效。我们通常会错过有效性，因为许多交易实际上是基于噪声在交易，但看起来会像是基于信息在交易。“噪声交易者放到抬高股价中的噪声是会渐增的，就像一名醉汉总是倾向于离他的出发点越来越远，这两者的道理是一样的。”


    所有关于价值的估计都是充满噪声的，布莱克写道，所以我们从来不知道价格偏离价值有多远。一个市场是有效的，他特别指出，“价格是在价值 2 个因子范围内，也就是说，价格在价值的
    1/2 以上或者在 2 倍价值以内”。他承认这既是一个武断的数字，又是一个他认为比较合理的数字。在这一定义的基础上，他说：“几乎所有时候、几乎所有市场都是有效的。‘几乎所有’意味着
    90%以上。”


    距离强式有效市场（strong form of efficiency market）还有很长一段路需要走。布莱克的观察结果解释了：为什么积极投资或价值投资有时会繁荣兴旺，为什么我在廷贝尔—希尔公司和千禧管理公司所努力尝试的量化投资也会有一席之地。市场上的噪声可能是喧闹的，但是总有一些规律——不管某些信号有多弱，有些信息交易者总可以察觉到，并且在交易时加以参考。简而言之，总有办法可以战胜市场，但是很少有交易者能够持续战胜。


    ![](img/cutq_93_53221_l.jpg)


    我还在不断发展的路上。在开始第五章之前，我想插入一个故事，它是我在从学校到职场来回切换的那些年里悄然发生的。


    我十几岁时，父亲决心再一次彻底地重塑自己。离开纽约到里士满之后，父亲决定要成为一名小提琴制作者。他是一名熟练的小提琴演奏家，并且深知制造更优秀的，甚至伟大的乐器需要什么：由精选木材制成的音箱、干燥工艺、上漆工艺，只有这些才能将琴弓拉过琴弦产生的振动放大成共鸣的声波。但是他对制作（或修理和修复）小提琴知之甚少。小提琴的传统制作工艺可以追溯到
    16 世纪，阿玛蒂（Amati）、瓜纳里（Guarneri）家族以及更有名的安东尼奥·斯特拉迪瓦里（Antonio Stradivari），在克雷莫纳（Cremona，意大利城市）制作了许多音色华美的小提琴。在意大利，成为一名弦乐器工匠的流程包含跟随一名大师学艺的漫长学徒生涯。时至今日，这个流程还一直保留。要成为一名学徒，通常需要你年轻且未婚，对生活的物质需求非常少，以便和微薄的收入相匹配，还必须这样安安心心干上几年才行。


    我的父亲已有家庭，还有另一份工作要做，而且人到中年，但是他并没有被吓退。尽管还是一个初学者，他仍然旁听了俄亥俄州的欧柏林学院（Oberlin College）制琴师的课程。在一次现场演奏会中，他发现自己隔壁的大提琴演奏家也是一位小提琴制作者。他很不情愿地同意让父亲协助和观摩。“协助”通常意味着打扫地板。在白天练习与工作之余，父亲把剩下时间都用来自学小提琴制作。


    几年之后，我和我的商业合伙人依兹·英格兰德在曼哈顿上东区的一家餐厅用餐。餐厅的名字是“Sette Mezzo”，这是一家小巧的、不那么引人注意的意大利餐馆，但拥有一些不同寻常的名人老主顾，他们许多人就住在餐馆附近。一位社会名流来到我们的餐桌，依兹把我介绍给他。


    “哦，我知道一位著名的小提琴制作者也用这个姓氏”，他说。


    “那是我的父亲”。我自豪地答道。


    锲而不舍。


