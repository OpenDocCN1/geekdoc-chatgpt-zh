    # 第六章 相关性


    “一个人如果没有明确的可以具体量化的目标，那么他的人生轨迹就会如布朗运动一样充满随机性。”


    幸运的是，我的第一个阿尔法模型在 10 年中一直在赚钱，在相当长的一段时期战胜了强式有效市场。我精通选择有效的交易来创造算法，这带给我此前无人获得的专利。阿尔法模型本身波动性很大，不是一个平滑的信号，而且它需要有一个强有力的消化能力。有时，投资组合的波动非常剧烈。我继续坚持一个人独立工作。也许这种工作性质导致了在所难免的孤独，至少对我而言是这样的过程，不过，长时间孤军奋战的滋味非常难受。几乎没有交易员连续几年孤军奋战。


    我花了很多时间思考阿尔法模型。我千思万想，怎样才能进一步开发它、完善它呢？怎样才能在把交易回撤降至最小的同时，争取收益最大化呢？怎样才能从市场中获取经验，并找到更有效的检验方法呢？1998
    年的金融危机事件一直在我的脑海深处，令我难以忘怀，它总是警醒我，市场的变化总是出其不意。与此同时，我加深了对市场的理解，以及如何提高阿尔法模型的运算能力。我努力奋战，想要研究出更多的阿尔法模型。我模糊地意识到，其他人也在沿着同样的路径探索，但我全神贯注在自己已有的阿尔法模型及其收益上。


