    # [第七章 扩展](../Text/contents.xhtml#e_11)


    “知识循环相生，灵感孕育新知，生生不息，改变现实。”


    英文单词“scale”的具体意义是什么？《牛津英语词典》（Oxford English Dictionary）用了一页多密密麻麻的字来解释“scale”这个词，把它分成10个不同的含义。这个词语有众多的释义，其中一种是指天平，一种用来称重的装置；还有鳞的意思，是指鱼类和爬行动物皮肤上长出的又薄又硬的东西；还可以指去除牙结石的动作；还有攀登的意思，是指用梯子翻越过城堡围墙；更普遍的意思是，攀爬一座山、一段楼梯，等等。


    其实，那个梯子和那些楼梯都是有重要意义的。“云梯”（scaling ladder）这个词的引申含义是一种度量和计算方法。《牛津英语词典》中还将“scale”这个词解释为“计量尺度，即一条直线或曲线上的一系列有数值意义的尺度标记，用来度量距离、温度、数量，等等；特别是指比例尺，一种在地图、图表、设计图上用来测量两点之间距离的工具”。这一解释涵盖了从音阶到数学每一个表示上升或下降的标识：“你可以想到的任何一个系统的记号法，都是基于这样的原则，将按各种标记体系选定好的数字作为基数，通过尺度连续位置变化，令计算数值呈几何倍数变化。”


    古代数学家熟知尺度这一概念，他们认真研究星星，然后推导出构成物质的最小组成单位是原子[^(\[1\])](#chapter10.xhtml#comment_6305)。那些从本质上认真思考数学模型的思想家，他们的思维在宏大和极微小范畴之间来回切换，思路在宇宙与地球之间驰骋。可数学又是怎样能够操纵尺度的呢？实际上，任何通过改变指数或移动小数点来得到更大或更小数值的人都知道答案；通过改变计量尺度，从无限小到宇宙，甚至到无限大是多么容易啊！就像我们所熟知的宇宙，尽管还有许多未解之谜，但从量子粒子到银河系，已经向我们形象地说明了不同尺度的含义。


    在千禧管理公司，我想扩展自己的个人量化投资小组，最初的冲动来源于我觉得独来独往太过乏味。因为那时我的第一个阿尔法模型业绩不错，理论上，后续开发的第二个、第三个的阿尔法模型不仅可以增加一两倍的业绩，还可以降低投资风险。因为这种做法可以一举两得，我便开始想开发更多的阿尔法模型，希望获取更多自己名下管理的资产来加大投资，从而带来更多的盈利。不过与此同时，这种野心也带来风险，并且风险永远存在。我开发第二个阿尔法模型的初次尝试，是通过配对交易策略分散投资，但是这次尝试因为俄罗斯债券违约事件失败了。这次失败迫使我重新研究投资策略。事实上，我在更广泛的投资策略中重新聚焦这个配对交易策略，把它升级为更高标准定义下的阿尔法。同时，我也对第一个阿尔法模型稍微进行了扩充，在扩充的同时引发了其他挑战。


    一个阿尔法模型包含许多不断变动的部分。如果没有自动化交易技术，我们绝不可能交易如此多的证券。虽然交易可以通过自动化完成，但交易前要进行阿尔法模型的开发、编程和回测实验等工作；进入交易阶段，还要有对整个交易过程进行监控。这些工作都必须投入大量的时间和人力。有人认为，量化投资交易就是“程序化”的交易，可以自动响应市场的某些变化，或者只不过是以光速进行高频交易。这些认知都是错误的。人和机器必须一起工作。虽然自动化交易技术的确极大地突破了交易员工作能力的极限，并且与以前我们投资时相比，可以帮助我们极大地改进交易范围、复杂度以及生产力，达到不可以想象的程度，但是，拥有非凡创造力的人类，仍然是交易的最关键要素。


    这段时期之后，我不再局限于交易操作层面。我不仅是交易投资研究员，还是投资组合经理、模拟机械系统和交易基础系统的程序员，以及负责许多积极头寸（active positoin）的操盘手。后来，这些角色的职责都被准确定义出来。我找到相应的专家去承担这些职责，我们组成一个团队，以便开发更多的阿尔法模型、优化投资策略、让阿尔法模型更富有创造性和有效性。投资研究员和投资组合经理的工作职能靠什么联结在一起呢？投资研究员的工作是产生能够开发出阿尔法模型的灵感，而投资组合经理的工作是将这些阿尔法模型整合为可执行的投资策略。因此，不论阿尔法模型还是投资策略，都需要经历严格的、不断重复的回测。作为投资操作的重要一环，回测联结并验证了投资研究员和投资组合经理的工作。


    我尝试着不断超越自己。此时，以上想法只是存在于我的头脑中，还未成形。在开发阿尔法模型时，对于每一件事，我都亲力亲为。那段时间，我工作非常拼。其中几天，有一个助手帮助我运行系统，让我可以集中精力在程序设计或研究开发阿尔法模型的灵感上。当时我要处理很多的阿尔法模型灵感，基于每个灵感构建算法，然后逐一进行回测。那段时间，我虽然并没有开发出一个特别好的阿尔法模型，但是我一直努力尝试。同是这一时期，我的孩子陆续来到了这个世界，现在我已经是5个孩子的爸爸了。


    当被检验的灵感无法见效时，我并没有泄气。因为我当时使用的这两个阿尔法模型还在继续盈利，它们的确给了我信心与底气，而且我确实从每次失败中获得了很多经验。每一次的失败都会为你提供有用的信息。在我看来，从失败中吸取教训，然后继续努力的做法是非常积极、正向的。就好像做俯卧撑，每次你做的俯卧撑越多，你积累的力量就越大，随着日积月累，以后你能做的俯卧撑的数量也就更多。面对很多未知的不确定性因素，我认为最好的解决方案就是行动，有所行动总好过什么都不做。当我的阿尔法不见效时，我就会关闭头寸，重新修正阿尔法。我也从仿效其他交易员或者其他公司的做法中吸取了教训。不管是千禧管理公司的某个人，还是在另一家量化基金公司工作的人，他们拥有的资金几乎是我资本的100倍以上。如果模仿他们，我肯定会失败。因此，我需要独立完成开发。在这个野蛮竞争的市场中，如果交易员想出大量同样的灵感（无论这个灵感多么高明），交易策略雷同的阿尔法模型就会失败，这就是为什么你必须独立思考。模仿他人一定会给你的投资带来危害。

    '
  trans: '


    乌拉姆的分支思想涉及中子的状态，这些中子是由引发氢弹的原子爆炸所释放的。这些中子只有几种可能的结果：发散辐射、被吸收、改变速率，或者与其他原子核发生反应，形成新的同位素。这些不同的结果看起来是随机的，但其实在自然中普遍存在，它们通常在一些突发的相变之前产生，迪迪埃·索内特认为，当微小的断裂以一种分支模式突然激增时。在研究受到压力的地壳构造板块和崩盘前的市场所产生的信号时，他也识别到同样的分支模式。


    乌拉姆的思想促进了蒙特卡罗法（Monte Carlo Method）[^(\[10\])](#chapter9.xhtml#comment_5849)的诞生。蒙特卡罗是乌拉姆在洛斯阿拉莫斯实验室的同事想出的名字，这位同事是尼古拉斯·梅特罗波利斯（Nicholas
    Metropolis）。蒙特卡罗是摩纳哥的一座赌城，乌拉姆的叔叔过去经常向亲戚借钱去那里赌博，那里最受欢迎的赌博方式是轮盘赌，赌徒们总觉得自己有一定的概率会赌赢。乌拉姆和冯·诺依曼在数学上通力合作。当冯·诺依曼看到单个中子的随机抽样的概率轨迹时，他估计，用几千个样本和当时最先进的
    ENIAC 计算机，就可以将结果模拟运算出来；后来这项研究从宾夕法尼亚大学迁移到了马里兰州（Maryland）的阿伯丁试验场（Aberdeen Proving
    Ground）[^(\[11\])](#chapter9.xhtml#comment_5906)。尽管关于谁是第一个想到这个方法的人存在争议，但冯·诺依曼确实向
    ENIAC 的工程师建议了一种改进计算机的方法，包括安装存储程序，以便计算机更高效地进行蒙特卡洛方法模拟运算；这个改进预示了普林斯顿大学 MANIAC 计算机存储程序架构的诞生。


    乔治·戴森（George Dyson）在关于计算机发展的《图灵的大教堂》（Turing''s Cathedral）一书中，描述了蒙特卡罗法的影响力：“蒙特卡罗法在数学物理学（mathematical
    physics）[^(\[12\])](#chapter9.xhtml#comment_5913)方面开辟了一个新领域。经典物理学[^(\[13\])](#chapter9.xhtml#comment_5918)（classical
    physics）考虑的是少量理想化对象的准确行为；统计力学[^(\[14\])](#chapter9.xhtml#comment_5923)（statisticalmechanics）考虑的是大量对象集体行为的平均值。与它们不同，蒙特卡罗法考虑的是在任意数量的单个对象的对象中，单独概率性行为，因此比以上两种方法都更接近物质宇宙的实际运作方式。”


    从投资组合、期权和金融衍生品的价值评估，到长期、复杂项目的风险判断，蒙特卡罗法在金融领域有各种各样的应用。从 20 世纪 40 年代后期开始，以恩里科·费米（Enrico
    Fermi）和尼古拉斯·梅特罗波利斯这样的物理学领军人为代表，掀起了一阵改进原始的冯·诺依曼算法的热潮。当传统计算方法，甚至是当时运算速度最快的计算机，也无法轻松解决随机问题的计算难题时，蒙特卡罗法的出现可谓开启了解决之道的一扇门。蒙特卡罗法及其他相关联的方法运用了随机模拟过程，这些方法通过随机和重复的行为去捕捉复杂的、不断变化的各种情景。其产出结果是一组概率值，而不是一个明确的值。这种随机过程佐证了乌拉姆最初的观察：玩游戏的次数越多，得到的近似值就越接近真实情况。


    随机要素的应用，不仅给看似混沌无序的系统带来了秩序，同时还在统计理论上起到关键的作用，这个统计理论就是现在广为人知的中心极限定理（Central Limit
    Theorem，CLT）。蒙特卡罗法可以用来模拟现实；中心极限定理是概率分析的关键技术。中心极限定理的提出，最早可追溯到 18 世纪早期法国数学家亚伯拉罕·棣莫弗（Abraham
    de Moivre）的假设；后来，另一位更著名的法国数学家——皮埃尔—西蒙·拉普拉斯（Pierre-Simon Laplace）于 1812 年重新发现这一定理，并将其推而广之。弗朗西斯·高尔顿（Francis
    Galton）是英国维多利亚女王时代的一位通才，也是优生学（Eugenics）的始创者。他在 1889 年称中心极限定理为“至高无上的非理性法则”，并认识到了从混沌到秩序、从非理性到理性的悖论。他写道：“无论何时，将由杂乱无章的元素组成的大量样本，根据其等级对其中的元素进行排序，一种无法预料的、最美丽的规律形态就会呈现，这证明中心极限定理的规律自始至终都蕴含其中。”


    中心极限定理是指，大千世界中，大量相互独立的随机变量的均值，在经过适当标准化后，将收敛于正态分布，表现为一种钟形曲线形状。中心极限定理被公认为概率论中的首席定理，发展出了数量众多的应用。它假定，总体变量的平均数将会呈正态分布，那么，只需要数量相对较少的样本就可以推出符合大数量样本的近似值。从口袋里掏出的硬币就可以检验这一定理的有效性：如果抛出一枚硬币，结果要么是正面朝上，要么是反面朝上，从理论上来讲，正反面朝上的概率各为
    50%；如果只抛 10 次，那么可能正面朝上的概率较大，也可能反面朝上的概率较大，结果可能会偏离理论概率；但是如果你抛 100 次，结果就会更趋近 50%这个中心极限的概率；而如果你抛
    1000 次，结果会更近一步靠近 50%，这就是中心极限定理。


    交易股票也可以应用与中心极限定理类似的方法。如果你只买卖几只股票，即使只有一只严重下跌，你也将蒙受损失。过去几年，有多家对冲基金公司证明了这一点（当然，考虑到风险与回报之间存在正相关关系，高度集中的投资组合可能也会产生高回报）。如果你是一名交易员，你交易了一组股票的投资组合，其中的许多股票存在相关性，那么这些股票的收益往往会一起上升或下跌；相应地，你的工作绩效会走两个极端：要么做得很好，要么很糟糕。但是，如果你交易的是大量无相关性的股票，你就可以运用大数定律来获益。在
    16 世纪，大数定律首次被提出。这是一个关于概率的定律，被包括在蒙特卡罗模拟方法中。它陈述了一个规律：实验次数越多，更多的结果就会越接近期望值的覆盖范围。这一规律也反映在赌场：赌徒在赌盘下注时，下注越多，结果越会反映出赌场预期的结果——永远都让赌场老板赚得盆满钵满。而在投资中，结果会覆盖股票的固有价值。


    让我们来思考两个简单化的交易情景。在第一个情景里，假定你在较少数量的证券上投资 10000 美元，投资期限 250 天，并承担盈亏的后果。结果投资顺利，你盈利
    55%，年化收益率就是 60%。用夏普指数（Sharpe Ratio）[^(\[15\])](#chapter9.xhtml#comment_59231)来衡量经过考虑承担风险调整后的回报，是
    1.63，这对一般投资者而言是非常优秀的业绩了。相比较而言，购买国库券承担的市场风险几乎没有，购买国库券的夏普指数是零。


    然而在现实世界里，第一个情景里的投资组合的风险是有点难以承受的，因为它的收益不稳定性太大。尽管最后业绩不错，但如果我们截取其中一小段时间，就会得出一个不同的观点，比方说，在第
    27 天到第 103 天这段时间，这个组合跌了 20%。此外，如果我们从另一个视角观察这个投资策略，并运用蒙特卡罗模拟法，选取 250 天的价格，然后把它们随机洗牌
    10000 次，为这篮子股票创造 10000 个不同的假设轨迹，然后分析这些轨迹中下跌情况。我们发现在这 250 天里，初始投资额会遭受 10%或更大幅度的下跌损失的概率是
    30%，损失 20%或更多的概率是 5%。与其说这是投资，不如说是赌博，风险极大。


    现在思考一个稍微不同的投资方案：在同一时间，随机选取 10 个不同的投资策略，投资期限为 250 天。尽管总回报率是 34%，比投资期限为 250 天的单一投资策略的总回报率低一点儿（一个任意的终点），不过这样的投资业绩还是挺让人赞叹的。在这种情况下，夏普指数却高出很多，达到
    3.11，这表明这一投资方案的风险波动性更低，结果是，损失的可能性小很多。这一年里，遭受 2%的下跌损失的概率是 20%，遭受 1%的下跌损失的概率为 40%。大数定律在这里受到两个不同的期望值驱动。第一个是整个投资期间的复合报酬率的期望值，第二个是最好每日回报的差异期望值，这个值最好接近于零。


    因为这 10 个投资策略是随机选取的，所以它们的相关性低得有点离谱。正因如此，回报的平滑效果可能显得有些夸张。但这个例子确实揭示出，一个恰当的、非相关性的投资组合策略能够降低市场风险，从而产生更加稳定的回报。


    2000 年，我只有两个阿尔法模型，尽管我可以将它们应用于世界各地的交易所、成千上万种类型的证券交易中，但并不总是容易获得大数定律的完美平滑效果。目前，我已开始思考一个能够创造更多平滑效果的新方法，我一直梦想着能够不断扩展阿尔法模型的数量。


