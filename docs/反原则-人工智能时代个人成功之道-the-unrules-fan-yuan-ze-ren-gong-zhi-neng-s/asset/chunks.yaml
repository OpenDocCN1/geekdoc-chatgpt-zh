    ## 资产证券化、韭菜比喻与相关性危害

    对北海的风险管理与平凡的韭菜看上去没有什么共性，实际上，在现代金融体系下，二者之间具有很强的共性。韭菜有点像是一棵微型的树，是一种气味温和、有点像洋葱口味的蔬菜。它被种植在土壤中，有着肉质的白色鳞茎，根茎呈绿色，顶部状如茅草。无论是厨艺大师还是家庭主妇，在他们的眼中，韭菜的所有部位不都是可食用的。对他们而言，根部是不能吃的，通常只能被切掉并扔到堆肥箱中；顶部的绿叶又平又干，通常也被扔掉；韭菜最好的部分就是从白色的鳞茎到浅绿色的中部。


    所以，韭菜并不全身都是宝。即使是被厨艺大师慷慨买下的最优质的韭菜，也有被丢弃的部分；即使是韭菜最差的部分，也可以被利用。这就引出了一个结论：对于一个韭菜农夫来讲，获得最佳回报的方法不是出售整根韭菜，而是将韭菜品质最好的鳞茎部分卖给厨艺大师，把品质较差的部分卖给那些不那么挑剔的、时刻把预算记在心里的家庭主妇。那么怎样才能做到这一点呢？答案是，把韭菜装箱，排列好根部末端，然后用切割机将韭菜垂直切下，最终，韭菜就被分成各种各样的韭菜段。品质好的韭菜从鳞茎开始，越接近绿色的茎叶部分，质量就逐渐降低。这样，我们就可以丢弃无用的根部和茎叶，将这些重新“包装的”成捆的韭菜段卖给顾客，而不再是简单出售整根的一捆韭菜。顾客也可以在价格承受范围内，挑选购买他们想要的那段韭菜。


    实际上，上述描述的就是在金融界日益普遍的一种实践做法：资产证券化。把韭菜替换为数以千计的抵押贷款，你就会获得一个抵押支持债券（Mortgage-Backed
    Security，MBS）。把抵押支持债券变成一个合成证券[^(\[5\])](#chapter9.xhtml#comment_5575)（synthetic
    security）的过程，和前面所述的韭菜“分段打包”的操作大体相同。根据贷款质量的不同，将资金池中的抵押支持债券进行分级打包：把违约风险更高的合约打底，然后再把更安全的归在另一级。分别出售这些不同“分级”的证券给那些有着不同风险偏好的机构投资者——从通常要求只购买高质量抵押证券的银行，到具有一定投机性的机构投资者（这类投资者愿意为获取更高收益而冒更高的风险）。打包不同风险的债券背后的理论基础是，每一级的债券都彼此独立，就好像洛朗船只上的发动机，或者不同部分的韭菜段一样，或者抛出去的硬币。


    抵押支持债券设计者们假定，一个抵押贷款违约的风险性与第二个抵押贷款违约的风险之间的关联性非常低。特别是，一个层级的抵押贷款［比如特大型贷款[^(\[6\])](#chapter9.xhtml#comment_5582)（jumbo
    loan）］与另一层级的抵押贷款［比方几乎不需要出具任何证明材料就能申请的次级贷款[^(\[7\])](#chapter9.xhtml#comment_5636)（subprime
    loan）］看上去几乎没有任何关联。他们深信这些抵押贷款之间本质上是不相关的。不幸的是，2008 年的美国次贷危机证明这一假定完全是灾难性的错误。事实上，这些数量庞大的抵押贷款与房地产市场高度相关，是房地产市场的关键组成部分，其估值创下历史新高，杠杆率也很高。不同层级的债券内部及相互之间的违约风险是被紧耦合在一起的。从更大范围的全球金融系统来看，不同证券的内部与它们之间的风险也是一样的。


    我们可以用另一种方式解释这个现象：如果一个抵押贷款的违约行为显著影响另一个抵押贷款的命运，或者因为一个共同的原因，这两个抵押贷款同时违约，那么认为这两个抵押贷款没有相关性，并把它们分入不同的“韭菜段”，只不过制造了一种关于安全性的“错觉”。这些最初的贷款和被分级后合成后的贷款在本质上是一模一样的。但经过所谓的“聪明地将不同风险重新配置”，卖方就可以把所有的抵押贷款进行错误定价，将其粉饰为神话并打包销售给投资者。


    这就是相关性的危害所在。这就好像一个黑色霉菌会影响整包韭菜一样。无论韭菜段的品质是高级、低级，还是中级，霉菌都会从一段韭菜扩散到下一段韭菜。


    在洛朗的案例里，那些用来降低并分散风险的程序，在某些情况下反而可能增加风险。在那场金融危机发生之前，一些经验较为丰富的投资者相信，资产证券化可以降低甚至消除风险，所以任由资产证券化泛滥，从而堆积了大量风险。从事经济活动的人由于感到自身不会被后果危害，而故意放纵风险，这种现象被称作道德风险[^(\[8\])](#chapter9.xhtml#comment_5692)（moral
    hazard）。它掩饰了全球经济的发展动力实际上彼此关联的事实。事实上，风险并不是相互独立的。金融危机已经证明，相关性存在于金融市场的每一个层级中，从单个股票到金融衍生品，再到全部经济体。投资者应该吸取教训：永远不要怀疑系统中的所有部分其实都是耦合的、具有相关性的。


    全世界的人都忽略了这个教训。因为系统太庞大、耦合太复杂，所以没有人能够真正地看到产生危机的因素间的相关性。许多人都会自欺欺人，认为世界上还有很多聪明人，总不会大家都犯错吧。


    要做好量化投资，你必须谨慎地使用模拟方法，以便将相关性降至最低。在投资时，人们有一个共同的心理陷阱，比如相信数据模型是一把万能钥匙，可用于解释市场某一方面的行为。事实上，即使解释得通，那也可能只是偶然而已。你必须保持极度诚实，将自我意识降到最低，还要有成功的信念。不过，当一个人变得更成功时，傲慢心理往往就会乘虚而入，这个人就更难做到这些了。如果只是产出一堆投资理念，在没有认真地进行回测实验的情况下，就认为这些投资理念在市场上会有效，这是非常糟糕的做法。就像我在沃顿商学院的那些同学一样，他们个个自以为是，认定自己是优于一般水准的。实际上，这些自大的想法都经不起市场相关性现实的无情检验。


    在投资中，几乎每个人都会采用某种形式的回测实验，并通过一些历史数据库进行投资或模型运算。诚然，一些投资者可能会拥有更多、更好的数据，这便造成了投资效果有好有坏。回测对于产生阿尔法固然至关重要，但是可能会产生备受关注的安全性问题，从而导致道德风险。虽然这听起来像是陈词滥调，但过去的成功并不能保证未来一直成功。所以，在模拟产生阿尔法的过程中，我们一定要用符合反原则的原则来建立阿尔法：许多阿尔法是没有效果的，也没有任何一个阿尔法会永久有效。用概率论的相关术语来讲，每个阿尔法的效用都在
    0 和 1 之间，“0”表示这个阿尔法从来没有发挥作用，“1”表示这个阿尔法一直在发挥作用。


    ![](img/cutq_131_1396_l.jpg)


    ## 量化投资的概率本质

    学习量化投资就像学习量子物理学和赌博一样，都需要精通概率和统计学。这门学科被广泛传授，但大多数人很难得心应手地掌握。量化投资是一个数字游戏。除此之外，量化投资的一些关键技术植根于第二次世界大战期间和之后的核武器计划，特别要归功于约翰·冯·诺依曼和他最亲密的搭档——物理学家斯塔尼斯拉夫·乌拉姆（Stanislaw
    Ulam）。乌拉姆出生于波兰，是冯·诺依曼的密友、搭档和工作伙伴。


    第二次世界大战后，乌拉姆放弃了“曼哈顿计划”，离开了洛斯阿拉莫斯，到南加利福尼亚大学（University of Southern California，又译南加州大学）任教。在那里，他由于感染病毒性脑炎而几乎失去生命。万幸的是，他活了过来，不幸的是，他的身体状况只能说是勉强恢复健康。医生告诫他要注意休息，避免剧烈的脑力劳动。于是他放下工作，玩起了纸牌接龙游戏。很快，他就开始尝试计算甘菲德纸牌游戏（Canfield
    Solitaire）[^(\[9\])](#chapter9.xhtml#comment_5798)接龙成功的概率是多少。甘菲德纸牌游戏与其他流行纸牌游戏的一个区别在于，前者的成功概率比较低。在尝试计算
    52 张纸牌的集合接龙成功的概率以后，乌拉姆发现，直接计算所需要的运算力，远远超越了他的世界级数学大脑的能力。于是，乌拉姆采用了另一个方法，他试着玩了 100
    次游戏，然后统计游戏成功的次数。这是一个简单、粗略但实用的模拟运算。但是，乌拉姆意识到，玩游戏的次数越多，计算结果的近似值就会越精确。他迅速认识到，这一思路可以应用于解决氢弹项目上的问题。他在回忆录里写道：“它让我意识到，这种方法同样适用于所有的计算过程，包括那些‘分支事件’。”


