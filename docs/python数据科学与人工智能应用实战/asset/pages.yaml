  md: '# 2. 型 2 错误


    当虚无假设是假时，因为抽样检验有偏差而让统计检验量没有落在临界区内，所以接受虚无假设，但是虚无假设为假，所以犯了错误，不应该接受虚无假设，此种错误称为型 2
    错误。


    当使用较小的显著水平来避免型 1 错误发生时，相对增加了型 2 错误发生的可能，因为临界区的面积变少，非临界区的面积增加，即统计检验量不容易落在临界区内，反而增加了型
    2 错误的可能。


    # 12.6 卡方检验


    卡方检验（Chi-square Test）也称为 x² 检验，是进行适合度检验（Test of Goodness of Fit）和独立性检验（Test of
    Independence）经常使用的统计方法之一，这是一种 2 个名目尺度变量之间的假设检验方法。


    # 12.6.1 适合度检验


    卡方检验的适合度检验用来判断样本数据的分布是否和预期分布相同，即判断每一个字段的观测值是否与期望值相同。


    例如，比萨店希望各种比萨的销售量相同，即期望值是 30，以方便备料，而不会造成过多库存。现在，有某假日的比萨销量如表 12-2 所示。


    | 比萨 | 蔬菜 | 地中海 | 总汇 | 夏威夷 | 海鲜 | 熏鸡 | 总计 |

    |---|---|---|---|---|---|---|---|

    | 销售量 | 20 | 16 | 34 | 40 | 38 | 32 | 180 |

    | 期望量 | 30 | 30 | 30 | 30 | 30 | 30 | 180 |


    表 12-2 中共有 6 个字段，使用卡方检验运行适合度检验，以 5% 显著水平，虚无假设和对立假设如下所示。


    +   • H₀: 比萨销售量和期望销售量相同。

    +   • Hₐ: 比萨销售量和期望销售量不相同。


    如果可以推翻虚无假设，就表示接受对立假设。接着，需要计算卡方检验统计量，其公式如下所示：


    ```

    卡方检验统计量 \(\chi^2 = \sum_{i=1}^{n} \frac{(观测值_i - 期望值)^2}{期望值}\)

    ```


    上述公式中，观测值就是表 12-2 中的销售量，期望值是 30，n 是字段数 6。可以计算出卡方检验统计量，如下所示：


    ```

    \(\frac{(20-30)^2}{30} + \frac{(16-30)^2}{30} + \frac{(34-30)^2}{30} + \frac{(40-30)^2}{30}
    + \frac{(38-30)^2}{30} + \frac{(32-30)^2}{30} = 16\)

    ```'
