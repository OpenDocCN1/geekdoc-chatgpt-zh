  md: '# 12.5.2 假设检验的基本步骤


    一般来说，因为研究者的结论是对立假设，假设检验的目的是希望可以拒绝虚无假设，接受对立假设，即结论成立，所以需要认真思考如何定出对立假设，并设定拒绝虚无假设所需的拒绝域。例如，当显著水平是
    5% 时，对立假设使用双尾检验，就是左右两侧各 2.5%；单尾检验是一侧 5%。


    例如，学校最近几年来了很多交换生，有人认为交换生的成绩比较好，有人认为比较差。

    所以，使用随机抽样从交换生中抽出 100 位（样本数 n）学生，得到平均成绩 x̄ 是 71.5 分，并且从学校教务处得知全校学生的平均成绩是 70（总体平均数
    μ），总体标准差 σ 是 2.5。其他假设检验的基本步骤如下所示。


    # 1. 步骤 1：提出假设


    首先需要提出虚无假设和对立假设，如下所示。


    +   Ho: 交换生的成绩和全校平均成绩相同。


    +   Ha: 交换生的成绩和全校平均成绩不相同。


    # 2. 步骤 2：选择抽样分布和决定临界区


    抽样分布有很多种，此例中是使用平均数的抽样分布，并且选择正态分布的 Z 分布。在决定信赖系数 95%后，即 5%的显著水平（α =0.05），可以使用查表或
    Scipy 包得知 Z 分数，如下所示：


    Z<sub>(critical)</sub> = ±1.96


    因为对立假设是不相同，所以是双尾检验。


    # 3. 步骤 3：计算检验统计量


    将样本平均数 71.5 转换成 Z 分数（使用第 11.5.2 节的公式，s = σ / √n），称为检验统计量（Test Statistic），也称为 Z<sub>(obtained)</sub>。其计算过程如下所示：


    Z<sub>(obtained)</sub> = (x̄ - μ) / (σ / √n) = (71.5 - 70) / (2.5 / √100) = 1.5
    / 0.25 = 6


    上述公式中，Z<sub>(obtained)</sub>=6，表示 71.5 离虚无假设的预设参数平均数 70 有 6 个标准差之远。使用 Python 程序计算上述检验统计量（Python
    程序： Ch12_5_2.py），如下所示：


    ```

    import numpy as np

    from scipy import stats

    import math


    population_mean = 70

    sample_size = 100

    ```'
