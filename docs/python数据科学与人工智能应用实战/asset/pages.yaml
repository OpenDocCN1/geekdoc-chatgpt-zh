  md: '上述程序代码中的 str1 是连接字符串，list1 是要连接的列表，可以输出连接后的字符串内

    容 ''This-is-a-book.''。


    # 6.2 数据清理


    在实际操作时，从网页获取的数据大多有多余字符、不一致格式、不同断行、拼字错误和

    数据遗失等问题，在将数据存入文档或数据库前，需要使用字符串函数和正则表达式来进行数

    据清理（Clean the Data）（也称为数据清洗）。


    数据清理可以在获取数据和探索数据时进行，如下所示。


    +   在获取数据时进行数据清理：当从网页抓取数据后，就可以使用字符串函数和正则表达

    +   式对数据进行清理。本书即介绍此部分的数据清理。


    +   在探索数据时进行数据清理：第 9 章中介绍的 Pandas 包可以将获取的数据加载成列/

    +   行的表格数据，并且在探索数据时再次运行数据清理，其介绍请参阅第 13.3 节。


    # 6.2.1 使用字符串函数处理文字内容


    因为从网页获取的数据都是字符串类型的数据，所以可以使用第 6.1 节的 Python 字符串函

    数，将获取的数据处理成可以存入文档或数据库的数据。例如，删除字符串中的多余字符和不

    需要的符号字符等。


    +   动手学——切割与合并文字内容：Ch6_2_1.py


    可以调用 split() 函数将字符串使用分割字符切割成列表，然后调用 join() 函数将列表转换

    成 CSV（Comma-Separated Values）字符串，如下所示：


    ```

    str1 = """Python is a programming language that lets you work quickly

    and integrate systems more effectively."""


    list1 = str1.split()

    print(list1)


    str2 = ",".join(list1)

    print(str2)

    ```


    上述程序代码创建字符串变量 str1 后，调用 split() 函数使用空格将其分割成列表，然后使

    用 "," 作为连接字符串，即可调用 join() 函数将其转换成 CSV 字符串。其运行结果如下所示：


    ```

    [''Python'', ''is'', ''a'', ''programming'', ''language'', ''that'', ''lets'',
    ''you'',

    ''work'', ''quickly'', ''and'', ''integrate'', ''systems'', ''more'', ''effectively.'']

    Python, is, a, programming, language, that, lets, you, work, quickly, and,

    integrate, systems, more, effectively.

    ```'
