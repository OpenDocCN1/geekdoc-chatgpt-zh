  md: '# 1. 集合的基本使用


    Python 集合使用大括号“{}”括起,每一个元素使用逗号“,”分隔(Python 程序:Ch2_5_3.py),如下所示:


    ```

    animals = {"cat", "dog", "pig"}                 # 创建集合

    print("cat" in animals)                         # 检查是否有此元素：输出"True"

    print("fish" in animals)                        # 输出 "False"

    animals.add("fish")                             # 新增集合元素

    print("fish" in animals)                        # 输出 "True"

    print(len(animals))                             # 元素数：输出 "4"

    animals.add("cat")                              # 新增存在的元素

    print(len(animals))                             # 输出 "4"

    animals.remove(''cat'')                           # 删除集合元素

    print(len(animals))                             # 输出 "3"

    ```


    上述程序代码创建集合变量 animals 后，使用 in 运算符检查集合中是否有指定的元素，然后调用 add() 函数新增元素，调用 len() 函数输出元素数。可以看到，如果新增集合中已经存在元素“cat”，并不会再次新增。删除元素使用
    remove() 函数。


    # 2. 遍历集合


    遍历集合和遍历列表是相同的，只是因为集合没有顺序，所以其无法通过创建顺序来遍历(Python 程序: Ch2_5_3a.py)，如下所示:


    ```

    animals = {"cat", "dog", "pig", "fish"} # 创建集合

    for index, animal in enumerate(animals):

    print(''#%d: %s'' % (index + 1, animal))

    ```


    上述程序代码创建集合后，使用 for 循环和 enumerate() 函数遍历集合的所有元素，可以看到运行结果的顺序和创建时的顺序并不相同，如下所示:


    ```

    #1: dog

    #2: fish

    #3: pig

    #4: cat

    ```


    # 3. 集合运算


    Python 集合可以进行交集（Set Intersection）、并集（Set Union）、差集（Set Difference）、对称差集（Set Symmetric
    Difference）运算。本书测试的 2 个集合（Python 程序: Ch2_5_3b.py）如下所示:


    ```

    A = {1, 2, 3, 4, 5}

    B = {4, 5, 6, 7, 8}

