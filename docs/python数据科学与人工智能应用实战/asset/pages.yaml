  md: '# 动手学——数组复制、填满值和连接数组：Ch8_6_1c.py


    NumPy 数组可以调用 copy() 函数复制 1 个内容相同的全新数组，fill() 函数指定数组元素为单一值，np.concatenate() 函数连接多个数组，如下所示：


    ```

