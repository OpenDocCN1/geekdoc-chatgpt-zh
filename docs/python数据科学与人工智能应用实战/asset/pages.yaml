  md: '# 8.2.2 建立数组


    NumPy 数组是一系列的整数 int 或浮点数 float 值，每一个数组元素都是相同的数据类型，可以使用 Python 列表或元组（Tuple）来建立一维、二维或更多维的数组。建立数组前，需要在
    Python 程序中导入 NumPy 包，如下所示：


    ```

    import numpy as np

    ```


    # 动手学——使用列表与元组建立一维数组：Ch8_2_2.py


    在导入 NumPy 包后，就可以调用 array() 函数建立 NumPy 数组，如下所示：


    ```

    import numpy as np


    a = np.array([1, 2, 3, 4, 5])

    b = np.array((1, 2, 3, 4, 5))

    print(type(a))

    print(type(b))

    print(a[0], a[1], a[2], a[3], a[4])

    b[0] = 5

    print(b)

    b[4] = 0

    print(b)

    ```


    上述程序代码导入 NumPy 包 np 后，调用 array() 函数建立数组，如下所示：


    ```

    a = np.array([1, 2, 3, 4, 5])

    b = np.array((1, 2, 3, 4, 5))

    ```


    上述程序代码中，第 1 个 array() 函数的参数是列表，第 2 个 array() 函数的参数是元组。数组元素个数是列表和元组长度。然后调用 type(a)
    和 type(b) 函数输出数组类型，即 numpy.ndarray 对象。axis 轴是方向，一维数组的 axis 值 0 是横向，如图 8-5 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_222_0.png)


    > Tip

    > 列表和元组都是以多项数据所汇集成的一组数据，但两者的差异在于：列表使用中括号“[]”，可以将里面的数据置换成其他数据；但使用小括号“()”的元组则不能指派新元素进去。


    因为是数组，所以可以从索引值 0 开始取出数组的每一个元素，如下所示：


    ```

    print(a[0], a[1], a[2], a[3], a[4])

    ```


    上述 print() 函数输出数组的 5 个元素，索引值是 0~4。同样方式，可以使用索引修改指定的数组元素值，如下所示：'
