    \ HTTP 请求，如在 1 秒内发送超过 10 次请求。为了避免被黑客攻击，目前的网站大都有预防密集请求的机制。即在爬虫时应避免短时间密集发送 HTTP\
    \ 请求，而是在每一次请求之间等待几秒钟（Python 程序：Ch7_1b.py），如下所示：\n\n```\nimport time\nimport requests\n\
    URL = \"http://www.majortests.com/word-lists/word-list-0(0).html\"\nfor i in range(1,\
    \ 10):\n    url = URL.format(i)\n    r = requests.get(url)\n    print(r.status_code)\n\
    \    print(\"等待 5 秒钟...\")\n    time.sleep(5)\n```\n\n上述程序代码导入 time 模块，在 for 循环中共发送\
    \ 9 次 HTTP 请求，每一次请求之间调用 time.sleep(5) 函数暂停几秒。此例中参数为 5 秒，即每 5 秒才会发送一次 HTTP 请求。\n\
    \n# 3. 处理异常的 HTML 标签\n\n当分析 HTML 网页搜索到目标 HTML 标签后，编写 Python 爬虫程序时需要注意一些异常情况来进行特别处理，否则在爬虫时就有可能中断在这些异常情况中。例如，编程论坛发帖的\
