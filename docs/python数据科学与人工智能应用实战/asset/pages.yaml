  md: '# 1. 随机变量与概率分布


    随机变量是一种变量（并非程序语言的变量），可以使用一个数值来描述一个概率的事件。

    随机变量在特定时间点是一个值，但是它会随环境变化而拥有多种不同值。通常使用大写英文

    字母来表示随机变量，如 X、Y 或 Z 等。


    例如，掷 1 个骰子的随机变量 X，可以使用点数来描述掷 1 个骰子的事件，点数的可能

    值有 1～6，每一次掷的点数因概率而不同（概率的事件），所以这是一个随机变量。


    一般来说，随机变量都会伴随着一个随机过程的试验，而这个试验产生的是一个随机的结

    果，如掷 1 个骰子、选 1 张卡片、选 1 个买果球等。但是，并无法准确地预测结果，其结果

    是在一个范围内的一个值（代表一个事件），只能计算出每一个事件（每一个值）的发生概率，

    这就是概率分布。


    概率分布通常使用图形来呈现，可以描述随机变量的分布情况、哪些随机变量常常出现、

    哪些随机变量比较少出现。例如，掷 1 个骰子的可能结果是随机变量 X，X 的值可能是 1～

    6 点数，可以计算出每一种点数的概率是 1/6，其概率分布 [适用离散型变量（Discrete

    Variable）] 如表 11-2 所示。


    | 点数值 | X=1 | X=2 | X=3 | X=4 | X=5 | X=6 |

    | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

    | 概率 | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 | 1/6 |


    表 11-2 中，掷出各骰子点数的概率是相同的。如果掷 2 个骰子，点数出现的概率就会不

    一样。事实上，随机变量 X 是样本空间对应到值的一个 f() 函数，其参数值代表对应的事件，

    可以返回此事件的概率，如下所示：


    f（事件）=概率


    仍以掷 1 个骰子为例，f(X=1)=1/6、f(X=2)=1/6 等。


    # 2. 随机变量的种类


    随机变量根据变量值的性质不同可以分成两种，如下所示。


    +   ● 离散型变量：这些值之间通常有间隔。例如，骰子点数 1、2、3、4、5、6，一间房

    +   子的房间数量 1、2、3、4 等。


    +   ● 连续型变量（Continuous Variable）：这种变量值拥有无限可能的值，即其变量值是

    +   在一定范围之内的任何值（没有间隔）。例如，北京飞到上海花费的时间、身高、体

    +   重、温度、费用和轮胎的胎压等。


    # 3. 概率分布的用途


    随机变量的概率分布有很多种，一些常见的概率分布有正态分布（Normal Distribution）、

    二项分布（Binomial Distribution）、泊松分布（Poisson Distribution）等。


    概率分布可以帮助建立不同种类的随机事件模型来进行统计分析，即将复杂现象使用简单

    的数学模型来表示。换个角度来说，不同种类的概率分布可以回答不同问题的随机事件，所以'
