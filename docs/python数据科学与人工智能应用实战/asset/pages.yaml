- pgno: 286
  md: '# # 10.1 Matplotlib 包的基本应用


    Matplotlib 包是 Python 绘制图表的著名函数库，可以使 Pandas 处理结果的数据可视化（Data Visualization），简单地说，就是使用各种图表来探索数据和呈现数据的分析结果。


    # ### 10.1.1 绘制基本图表


    Matplotlib 是一套类似于 GNUplot 的图表函数库，其源码开放、跨平台和支持多种常用图表，可以轻松产生高质量且多种不同格式的输出文件。Python
    程序需要导入 Matplotlib 包的 pyplot 模块，如下所示：


    ```

    import matplotlib.pyplot as plt

    ```


    +   1. 绘制简单的折线图：Ch10_1_1.py


    使用 Python 列表绘制第 1 个折线图（Line Plots），如下所示：


    ```

    import matplotlib.pyplot as plt

    ```


    ```

    data = [-1, -4.3, 15, 21, 31]

    ```


    ```

    plt.plot(data) # x 轴是 0、1、2、3、4

    ```


    ```

    plt.show()

    ```


    上述程序代码导入包后，建立 data 列表的数据，共有 5 个项目，这是 y 轴；然后调用 plt.plot() 函数绘制图表，参数只有 1 个 data，即
    y 轴，x 轴默认就是索引值 0.0～4.0（数据个数）；最后调用 show() 函数输出图表。其运行结果如图 10-1 所示。


    +   2. 绘制不同线条样式和色彩的折线图：Ch10_1_1a.py


    修改 Ch10_1_1.py 折线图的线条外观，将其改为蓝色虚线，并加上圆形标记，如下所示：


    ```

    data = [-1, -4.3, 15, 21, 31]

    ```


    ```

    plt.plot(data, "o--b") # x 轴是 0、1、2、3、4

    ```


    ```

    plt.show()

    ```


    上述程序代码中，plot() 函数的第 2 个参数字符串 “o--b” 指定线条外观（在第 10.1.2 节将进一步说明）。其运行结果如图 10-2 所示。'
  merge: -1
  img_proc: true
