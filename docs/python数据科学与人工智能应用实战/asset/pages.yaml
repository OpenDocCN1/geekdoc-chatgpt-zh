- pgno: 413
  md: '依据对手的棋路来决定下一步棋和是否需改变战略，即需要随着环境的变动来改变做法，此时使用的是强化学习。


    强化学习是边做边学，同时使用尝试错误方式来进行学习。其类似于玩猜数字游戏，随机产生 0~100 的整数，当输入数字后，系统会响应太大、太小或猜中，当太大或太小时，机器需要依目前的情况来改变猜测策略，如下所示。


    +   - 猜测值太大：因为值太大，机器需要调整策略，决定下一步输入一个更小的值。

    +   - 猜测值太小：因为值太小，机器需要调整策略，决定下一步输入一个更大的值。


    最后，机器可以在猜测过程中累积输入值的经验，学习建立猜数字的最佳策略，这就是强化学习的基本原理。


    # 1. 人类做决策的方式


    实际上，强化学习是在模拟人类做决策的方式。当人类进行决策时，会根据目前环境的状态来执行所需的动作，其流程如图 14-12 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_413_0.png)


    如图 14-12 所示，首先根据目前环境的状态执行第 1 次动作，在得到环境的回馈，即报酬（Reward）后，因为执行动作已经改变目前环境，成为一个新环境，需要观察新环境的新状态，并且修正执行策略，执行下一次动作。这个流程会重复执行直到满足预期报酬，人类决策的主要目的就是试图极大化预期的报酬。


    # 2. 强化学习的代理人


    强化学习是让代理人模拟人类的决策，采用边做边学方式，在获得报酬后，更新自己的策略模型，然后使用目前模型来决定下一步动作；下一步动作获得报酬后，再次更新模型，不断重复直到这个模型建立完成。


    在强化学习的一系列决策过程中，一位好的代理人需要具备三项元素，如下所示。


    +   - 政策（Policy）：代理人执行动作的依据。例如，执行此动作可以将价值函数最大化。

    +   - 价值函数（Value Function）：评估执行动作后目前环境的价值。实际上，价值函数是一个未知函数，需要通过不断地执行动作来取得报酬，即收集数据，然后使用这些数据来重新估计价值函数。

    +   - 模型（Model）：模型是在预测环境的走势。以下棋来说，就是预测下一步棋的走法。因为代理人在执行动作后就会发生 2 件事，一是环境状态的改变，二是报酬，模型就是在预测这个走势。


    不仅如此，强化学习还有两个非常重要的概念：探索（Exploration）和开发（Exploitation），如下所示。


    +   - 探索：如果是从未执行过的动作，可以让机器进而探索出更多的可能性。

    +   - 开发：如果是已经执行过的动作，可以从已知动作来更新模型，以便开发出更完善的模型。


    例如，小朋友学走路时可能有多种不同的走法，如小步走、大步走、滑步走、踮起脚尖走、'
