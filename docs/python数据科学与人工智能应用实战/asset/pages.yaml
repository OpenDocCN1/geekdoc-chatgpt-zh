  md: "上述 URL 中 sk 后面的数字代码为城市代码。Python 程序如下所示：\n\n```\nimport json\nimport requests\n\
    url = \"http://www.weather.com.cn/data/sk/101010100.html\"\njsonfile = \"Weather.json\"\
    \nr = requests.get(url)\nr.encoding = \"utf-8\"\njson_data = json.loads(r.text)\n\
    with open(jsonfile, 'w') as fp:\n    json.dump(json_data, fp, ensure_ascii=False)\n\
    ```\n\n上述程序代码调用 requests.get() 函数发送 HTTP 请求后，调用 json.loads() 函数将读取的数据转换成字典，然后打开写入文件，调用\
    \ json.dump() 函数写入 JSON 文件，可以在 Python 程序的目录中看到创建的 Weather.json 文件。\n\n# 6.3.3\
    \ 下载图文件\n\nPython 程序可以使用 requests 模块和内置 urllib 模块打开串流来下载图文件，即将 Web 网站显示的图片下载保存为本地计算机的图文件。\n\
    \n动手学——使用 requests 模块下载图文件： Ch6_3_3.py\n\n从 URL 网址 https://www.baidu.com/img/bd_logo1.png\
    \ 下载 PNG 格式的图文件，如下所示：\n\n```\nimport requests\nurl = \"https://www.baidu.com/img/bd_logo1.png\"\
    \npath = \"logo.png\"\nresponse = requests.get(url, stream=True)\nif response.status_code\
