- pgno: 351
  md: '# # 12.1 抽样与抽样分布


    推论统计可以从部分数据的样本中推论出全部数据的总体，其做法和任务有两项，如下所示。


    +   - 估计（Estimation）：从样本数据推论样本来源的总体特征（平均数和标准差）的过程。

    +   - 假设检验（Hypothesis Testing）：先针对总体提出假设，然后通过分析比较样本来验证提出的假设是否有效。


    # ## 12.1.1 参数与统计量


    通常不可能有足够的条件来收集完整的总体（Population）（也称为母体）数据，也可能根本无法调查出整个总体数据。例如，调查全国男性抽烟情况，只能使用抽样方式调查选出总体的部分数据，即样本（Sample）。例如，在了解样本平均数后，使用推论统计来推测出总体平均数。


    总体特征的平均数和标准差等量数称为参数（Parameters）（也称为母数），样本特征称为统计量（Statistic），如图 12-1 所示。


    图 12-1 是从总体中抽样出部分数据样本。样本特征的统计量是已知且可以掌握的信息，总体是未知的准备进一步了解的信息，即参数，如图 12-2 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_351_0.png)


    图 12-1


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_351_1.png)


    图 12-2


    # ### 1. 参数与总体分布


    总体是使用总体平均数 \(\mu\) 和总体标准差 \(\sigma\) 等集中量数或离散量数来描述总体特征，即参数。如果从总体中随机抽出 1 个值，并且将之视为变量，它就是第
    11 章介绍的的随机变量。对应随机变量的概率分布称为总体分布（Population Distribution）。


    实际上，虽然无从得知总体分布是哪一种分布，但是通常会假设总体是一种正态分布，将其称为正态总体（Normal Population），如此才可以使用推论统计来进行估计和检验。'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# 2. 统计量与抽样分布


    样本是总体的部分数据，从总体中抽样获取样本，可以计算出样本平均数 x 和样本标准差 s 等集中量数或离散量数来描述样本的特征，即统计量。统计量本身是一个随机变量，对应随机变量的概率称为抽样分布（Sampling
    Distribution），该内容将在第 12.1.3 节有进一步的说明。


    因为可以从样本计算出样本平均数和标准差，所以这些统计量才是真正可以掌控的信息。


    # 12.1.2 抽样方法


    从总体中抽出的样本称为样本数据（Sampling Data），主要是使用随机抽样（Random Sampling）来选择样本，这是一种常用的概率抽样（Probability
    Sampling）方法。


    实际上，无论概率抽样使用哪一种方法，其目标是希望抽出的样本能够代表总体。例如，总体中有 40% 是男性，样本如果有代表性，那么样本的男性比例应该也接近 40%。为了确保样本有代表性，需要使用均等概率选择方式（Equal
    Probability of Selection Method，EPSM）来抽出样本。


    推论统计只能使用 EPSM 抽样方法获取的样本，常用 EPSM 抽样方法的简单说明如下所示。


    +   - 简单随机抽样（Simple Random Sampling，SRS）：将总体的成员列成一个表，然后使用概率均等方式随机从列表中挑选出所需的样本。例如，使用随机数表进行抽样。


    +   - 系统抽样（Systematic Sampling）：不同于简单随机抽样的每一个样本都是随机挑选，系统抽样只有第 1 个是随机选取，然后以总体大小除以样本大小的间距来挑出样本。例如，第
    1 次抽到 11，总体有 10000，样本需 200，间隔就是 10000/200=50，所以第 2 个是 61，第 3 个是 111，以此类推。


    +   - 分层抽样（Stratified Sampling）：分层抽样是一种随机抽样，首先将总体分成性质不同或互斥的若干群组，每一组就是一层（Strata），同属一层的性质需尽量相近，然后在每一层以一定比例使用简单随机抽样来抽出样本。例如，对大学生进行抽样，可以先将学生分成侨生、交换生和一般学生，然后针对每一类学生抽样
    2% 的学生。


    +   - 从集抽样（Cluster Sample）：也称为分群随机抽样或分簇抽样。如果无法获取总体的完整成员列表，则可以使用从集抽样，即从大到小进行抽样。例如，以学校为单位，首先随机选出几所学校，然后每所学校再以班为单位选出几个班，最后从班中抽出几位学生。


    # 12.1.3 抽样分布


    从总体抽出样本后，参考第 11.5 节即可计算出样本的集中量数与离散量数。但问题是虽然已经知道样本的特征，对于其背后的总体仍然一无所知。推论统计需要使用抽样分布观念来推论总体，使用的就是第
    11.6 节的概率分布。因为有抽样分布，所以才能运用概率分布来从样本推论总体。'
  merge: -1
