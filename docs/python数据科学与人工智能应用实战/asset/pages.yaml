  md: '图 14-13 中间是神经网络示意图，是共有 5 层隐藏层的非线性处理单元，每一层拥有多个小方框的神经元（Neuron）以进行特征抽取（Feature
    Extraction）和转换（Transformation），位于上一层的输出结果就是接着下一层的输入数据，直到最终得到一组结果。


    # 2. 深度学习就是一个函数集


    深度学习是一个神经网络，神经网络就是一组函数集。将一堆特征值送入神经网络，经过每一层神经元的输入和输出，整个神经网络可以输出一组最后的结果，并且从其中找出一个最好的结果，即最佳解（也称最优解）。例如，深度学习的下棋程序可以依据最佳解来决定下一步棋走哪里，人类也可以使用最佳解的建议来做出商业上的决策。


    例如，一个公司生产营销一个产品是一个函数集，这个函数集如同深度学习的神经网络一般，可以在函数集中加入各种变量，包含竞争对手、生产流程、产品研发和产品营销等多种考虑，在经过神经网络每一层神经元的运算后，最后函数集的输出结果就是此函数集提出的最佳生产和营销产品决策。


    事实上，现实世界的公司生产和营销产品的函数集更为复杂，可能需要花费数个月的时间才能看到决策结果。深度学习可以快速建构出神经网络、设定目标和开始学习，如果输出的决策结果不佳，也可以马上调整整函数集内容来产生其他结果，这个过程就是在学习。在经过大量训练过程后，最终深度学习可以找出一个最佳函数集，并得到最佳解。


    例如，Google DeepMind 开发的人工智能围棋软件 AlphaGo，在建构神经网络、设定目标和开始学习后，需要将大量现成棋谱数据输入网络，让 AlphaGo
    自行学习下围棋的方法。在训练完成后，AlphaGo 可以自行判断棋盘上的各种情况，并且根据对手的落子来做出最佳的响应。


