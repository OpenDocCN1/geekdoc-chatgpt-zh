- pgno: 323
  md: '# # 11.1 认识概率


    在日常生活中，常常会遇到一些涉及可能性或发生机会等概念的事件（Event）。例如：

    从一班 50 名学生中随意选出一个人，此人会是男生吗？

    刮刮乐（Scratch-off Lottery）中头奖的机会有多大？

    当我们使用“……可能会发生吗？”这类句型来询问时，就表示关注事件发生的机会，这

    就是“概率”（Probability）。


    # ## 11.1.1 概率的基础


    概率又称为或然率、机率或可能性，表示事件发生的机会。在介绍概率的数学公式前，需

    先了解几个名词，如下所示。


    +   • 试验（Trials）：执行动作观察结果的过程称为试验。例如，丢 1 个铜板或掷出 1

    +   个骰子，出现正面、反面或点数的结果。


    +   • 事件：在试验获得的结果中，符合条件的试验结果集合称为事件。例如，丢 1 个铜

    +   板出现正面的事件；或掷 1 个骰子出现偶数点数的事件，即点数 2、4 和 6 的集合。

    +   而且，每一个事件是一个简单事件（Simple Event），因为事件的试验并不能再次分

    +   割。例如，掷 2 个骰子的试验可以分割成 2 个简单事件，掷第 1 个骰子和掷第 2

    +   个骰子。


    +   • 样本空间（Sample Space）：所有可能试验结果的集合。例如，丢 1 个铜板的样本空

    +   间是正面和反面，掷 1 个骰子的样本空间是点数 1～6 的集合。更进一步，如果依

    +   次丢 3 次铜板，其样本空间是{正正正，正正反，正反反，正反正，反反正，反反正，

    +   反正正，反正反}，共有 8 种排列组合。


    # ### 1. 概率公式


    如果 A 是事件，P(A) 是发生事件 A 的概率，可以定义事件 A 的概率为


    P(A)=\frac{发生事件A的次数}{样本空间的尺寸}


    上述公式是将“该事件的数量”除以“所有可能发生的事件数量”。事件发生的概率越高

    （越接近 1），就表示此事件越可能发生。例如，电影院有 100 位观众，女性有 25 位，男

    性有 75 位，如下所示：


    +   • 观众是女性的概率：P(A) = 25/100，即 0.25（25%）。


    +   • 观众是男性的概率：75/100，即 0.75（75%）。其他可以直接使用 1-(25/100) 表示，

    +   称为事件 A 的互补事件（Complementary Event），符号是 \bar{A}。


    从上述电影院选出 1 个人是男性的概率是 75%，女性是 25%，男性的概率比较高。如果

    使用图形表示，则电影院观众的整个样本空间是大圆形 100 人，事件 A 是位于大圆形中的小'
