- pgno: 76
  md: '# 3.3.1 图片


    HTML 网页是一种超媒体（Hypermedia）文格，除了可以输出文字内容外，还可以输出图片，其基本语法如下所示：


    ```

    <img src="filename" width="value" height="value" alt="替换文字"/>

    ```


    上述标签中的 src 和 alt 属性是必须属性，图片数据并没有真正插入网页之中。标签只是建立长方形区域来连接输出外部的图片文件，支持 gif、jpg 或
    png 格式的文件。标签的属性及说明如表 3-5 所示。


    # 表 3-5 标签的属性及说明


    | 属性 | 说明 |

    |---|---|

    | src | 图片文件名和路径的 URL 网址 |

    | alt | 指定图片无法输出的替换文字 |

    | width | 图片宽度，可以是小数或百分比 |

    | height | 图片高度，可以是小数或百分比 |


    HTML 5 不再支持旧版中的 align、border、hspace 和 vspace 属性。


