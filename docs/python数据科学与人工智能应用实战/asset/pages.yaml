- pgno: 353
  md: '# 1. 认识抽样分布


    抽样分布是将所有可能样本统计值（如平均数）的发生概率转换成随机变量和概率分布，每一次抽样的样本平均数是一个随机变量 X，对应的概率是概率分布，称为算术平均数抽样分布（Sampling
    Distribution of the Mean）。


    例如，从 5 个数值的总体随机抽取固定大小（3 个）样本数的样本，在计算算术平均数后，将样本放回总体；再抽出固定大小（3 个）样本数的样本，计算算术平均数后放回。需要重复进行抽样和计算平均数的操作，如图
    12-3 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_353_0.png)


    图 12-3


    当图 12-3 中的抽样次数很多时，总会抽出和总体特征相同的样本，而且因为样本的组成不同，可以分别计算出平均数 6.00、7.00、6.66 的发生概率，这就是第
    11.6 节的概率分布。


    事实上，所有可能得到的样本统计值就是一种随机变量 X 的概率分布。但是，不可能无限次地进行抽样，所以这是一个理论上的概率分布。由于此例是使用平均数，所以称为算术平均数的抽样分布，当然样本统计量也可以是方差或比例等。


    # 2. 正态分布的抽样分布


    如果总体是一个正态分布，总体的平均数是 μ，标准差是 σ，当重复从总体抽出 n 个样本数的样本时，所有样本平均数 x 组成的抽样分布也是一种正态分布，而且分布的平均数也是
    μ（和总体平均数相同），标准差是 $\frac{\sigma}{\sqrt{n}}$。


    因为样本平均数的抽样分布是一种正态分布，所以可以使用已知的正态分布特性来进行估计，详见第 12.2 节和第 12.4 节。


    # 12.2 标准正态分布与数据标准化


    在第 11.6.6 节已经介绍过正态分布的概率分布，本节将进一步说明正态分布的特性和标准正态分布，使用的是数据标准化的 Z 分数（Z-score）。


    # 12.2.1 标准正态分布


    正态分布是统计学中最重要的概率分布，所有的统计分析都是基于正态分布。标准正态分'
