    | lower() | 返回小写英文字母的字符串，如 str1.lower() |

    | upper() | 返回大写英文字母的字符串，如 str1.upper() |

    | title() | 返回字符串中每一个英文单词第 1 个英文字母大写的字符串，如 str1.title() |

    | swapcase() | 返回英文字母大写变小写，小写变大写的字符串，如 str1.swapcase() |

    | replace(old, new) | 将字符串中参数 old 的旧子字符串取代成参数 new 的新字符串，如 str1.replace(old_str,
    new_str) |


    # 6.1.3 字符串切割运算符


    Python 程序代码中的“[]”索引运算符不仅可以获取指定索引位置的字符，还是一种切割运算符（Slicing Operator），可以从原始字符串切割出所需的子字符串。'
