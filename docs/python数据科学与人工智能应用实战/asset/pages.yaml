  md: '# 2. 标签说明


    +   第 1 行：DOCTYPE 声明，告诉浏览器的 HTML 版本是 HTML 5。

    +   第 2~12 行：在 <html> 标签中使用 lang 属性指定简体中文。

    +   第 3~6 行：在 <head> 标签中包括 <meta> 和 <title> 标签。

    +   第 7~11 行：在 <body> 标签中包括 <h3><hr> 和 <p> 标签。


    # 3.1.2 HTML 的 DOCTYPE


    DOCTYPE 位于 HTML/XHTML 网页的 <html> 标签之前，其功能：告诉浏览器是哪一个版本的 HTML，以便浏览器正确地生成文档内容。


    DOCTYPE 可以指明文档遵循的 HTML DTD 规格，DTD 原来是 XML 1.0 规格的一部分，是一种文档验证机制，用来定义文档的元素架构、元素标签和属性，检查内容是否符合定义规则。


    HTML 5 使用的 DOCTYPE 非常简单，如下所示：


    ```

    <!DOCTYPE html>

    ```


    XHTML 1.1 使用的 DOCTYPE 如下所示：


    ```

    <!DOCTYPE html PUBLIC "--//W3C//DTD XHTML 1.1//EN">

    ```


    # 3.1.3 HTML 5 基本语法与共同属性


    HTML 5 语法比 XHTML 语法松散，而且并不用遵循 XML 语法。


    # 1. HTML 5 基本语法


    HTML 5 基本的语法规则如下所示。


    +   <html><head> 和 <body> 标签都可有可无，而 XHTML 中必须有这些标签。

    +   元素和属性不区分英文大小写，如 <html><Html><HTML> 都是指相同标签。

    +   元素不一定需要结尾标签（End-Tag），如果是没有内容的元素，也不需要使用 “/>” 符号代替结尾标签。一些合法的 HTML 5 标签写法如下所示：


    ```

    <p>这是一个测试</p>

    <p>这是一个测试

    <br>

    <br/>

    ```


    标签属性值的引号可有可无。例如，在 HTML 标签的合法 HTML 5 属性写法如下所示：


    ```

    <img src="sample.jpg" width=20 height=30 />

    ```


    如果属性没有属性值，则只需使用属性名称，并不需要加上属性值，如下所示：'
