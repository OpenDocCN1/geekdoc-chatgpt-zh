- pgno: 411
  md: '![](img/26e9944e14d74e7e03dda869acb3f1a8_411_0.png)


    图 14-7


    监督式学习主要可以分成两大类，其主要差异在于预测的响应数据不同，如下所示。


    # 1. 分类


    分类（Classification）问题是尝试预测可分类的响应数据，这是一些有限集合，如下所示。


    +   - 是非题：只有 True 或 False 两种类别。例如，上述垃圾邮件过滤只有是垃圾邮件或不是垃圾邮件两种类别，人脸辨识的结果则是本人或不是本人等。


    +   - 分级：虽然不只 2 种类别，但仍然是有限集合。例如，癌症分成第 1～4 期，满意度分成 1～10 级等。


    # 2. 回归


    回归（Regression）问题是尝试预测连续的响应数据，这种数值数据是在一定范围之内拥有无限个数的值，如下所示。


    +   - 价格：预测工资、价格和预算等。例如，给予一些二手车的基本数据，即可预测其车价。


    +   - 温度和时间（单位是秒或分）。


    以二手车估价系统为例，只需提供车辆特征（Features）的厂牌、里程和年份等信息，称为预报器（Predictors）。当使用回归来训练机器时，就是使用多台现有二手车的特征和标签（价格）来找出符合的方程，如图
    14-8 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_411_1.png)


    图 14-8


    当机器从训练数据找出规律，并成功地使用统计的回归分析建立对应的方程后，只需输入新进的二手车特征，就可以预测二手车的价格。'
  merge: -1
