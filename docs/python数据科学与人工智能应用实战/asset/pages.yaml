  md: '# # 15.2 线性回归


    统计中的回归分析（Regression Analysis）是通过某些已知信息来预测未知变量。实际上，回归分析是一个大家族，包含多种不同的分析模式，其中最简单的就是线性回归（Linear
    Regression）。


    # ## 15.2.1 认识回归线


    在介绍线性回归之前，我们需要先认识什么是回归线（Regression Line）。实际上，当预测市场走向，如物价、股市、房市和车市时，都会使用散布图以图形来呈现数据点，如图
    15-3 所示。


    从图 15-3 中可以看出，众多分点分布在一条直线的周围，这条线可以使用数学公式来表示和预测点的走向，称为回归线。“回归线”这个名词源于 1877 年，英国遗传学家弗朗西斯·高尔顿（Francis
    Galton）在研究亲子间的身高关系时，发现父母身高会遗传到子女，但是子女身高最后仍然会回归到人类身高的平均值，所以称之为回归线。


    实际上，回归线是一条直线，其方向会往右斜向上或往右斜向下，具体说明如下所示。


    +   - 回归线的斜率是正值：回归线往右斜向上的斜率是正值（图 15-3），x 和 y 的关系是正相关，x 值增加时，y 值也会增加。

    +   - 回归线的斜率是负值：回归线往右斜向下的斜率是负值（图 15-4），x 和 y 的关系是负相关，x 值增加时，反而 y 值会减少。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_419_0.png)


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_419_1.png)


    # ## 15.2.2 简单线性回归


    简单线性回归（Simple Linear Regression）是一种最简单的线性回归分析法，只有 1 个解释变量，这条线可以使用数学的一次方程式来表示，即
    2 个变量之间关系的数学公式，如下所示：


    回归方程式y = a + bX


    式中，变量 y 是反应变量（Response，或称应变量）；X 是解释变量（Explanatory，或称自变量）；a 是截距（Intercept）；b 是回归系数。


    当从训练数据找出截距 a 和回归系数 b 的值后，就完成预测公式。只需使用新值 X，即可通过公式来预测 y 值。


    # ### 案例 1：使用当日气温预测当日的业绩


    在本市某地铁站旁有一家饮料店，店长记录的在不同气温时的日营业额如表 15-1 所示。'
