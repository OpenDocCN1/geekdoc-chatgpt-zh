- pgno: 404
  md: '# 14.1 人工智能概论


    随着数据科学的发展，人工智能（Artificial Intelligence，AI）和机器学习（Machine Learning）成为信息科学界热门的研究项目。实际上，人工智能本身只是一个泛称，所有能够让计算机有智慧的技术都可以称为人工智能。


    # 14.1.1 人工智能简介


    人工智能在信息科学中并不算是一个很新的领域，因为早期计算机的运算效能不佳，人工智能受限于计算机运算能力，实际应用非常有限；直到 CPU 性能大幅提升和绘图
    GPU 应用在人工智能，再加上深度学习（Deep Learning）的重大突破，才让人工智能的梦想逐渐成真。


    # 1. 认识人工智能


    人工智能是让机器变得更聪明的一种科技，即让机器具备和人类一样的思考逻辑与行为模式。简单地说，人工智能就是让机器展现出人类的智慧，像人类一样思考。实际上，人工智能是一个让计算机执行人类工作的广义名词术语，其衍生的应用和变化至今仍然没有定论。


    人工智能是计算机科学领域的范畴，其发展过程包括学习（大量读取信息和判断何时及如何使用该信息）、感知、推理（使用已知信息来做出结论）、自我校正和操纵或移动物品等。


    知识工程（Knowledge Engineering）是过去人工智能主要研究的核心领域，让机器大量读取数据后，机器就能够自行判断对象、进行归类、分群和统整，并且找出规则来判断数据之间的关联性（Relationships），进而建立知识。在知识工程的发展下，人工智能可以让机器具备专业知识。


    事实上，现在开发的人工智能系统都属于弱人工智能（Narrow AI）的形式，机器拥有能力做一件或几件事情，而且做这些事的智能程度与人类相当，甚至可能超越人类（注意：只限这些事），如自动驾驶、人脸识别、下棋和自然语言处理等。当然，在计算机游戏中加入的人工智能或机器学习也都属于弱人工智能。


    # 2. 从原始数据转换成智能的过程


    人工智能是研究如何从原始数据转换成智能的过程，需要经过多个不同层次的处理步骤，如图 14-1 所示。


    由图 14-1 可以看出，原始数据经过处理后成为信息；信息在认知后成为知识；知识在模式抽取后变得可理解；最后进行推论，就成为智能。


    # 3. 图灵测试


    图灵测试（Turing Test）是计算机科学和人工智能之父——艾伦·图灵（Alan Turing）在 1950 年提出的一个判断机器是否拥有智慧、是否能够思考的著名试验。


    图灵测试引出了人工智能的概念，并且让我们相信机器有可能具备智慧的能力。简单地说，图灵测试是测试机器是否能够表现出与人类相同或无法区分的智能表现，如图 14-2
    所示。'
