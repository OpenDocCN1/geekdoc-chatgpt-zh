- pgno: 40
  md: '# ## 2.1 认识 Python 语言


    Python 语言是由 Guido Van Rossum 开发的一种通用用途（General Purpose）程序语言，是拥有优雅语法和高可读性程序代码的程序语言，可以开发
    GUI 窗口程序、Web 应用程序、系统管理工作、财务分析和大数据分析等各种不同的应用程序。

    Python 语言有两大版本，即 Python 2 和 Python 3，本书中使用的是 Python 3。


    # ### 1. Python 是一种解释性语言


    Python 是解释性语言（Interpreted Language），Python 程序使用解释器（Interpreters）来执行，解释器并不输出可执行文件，而是一个指令一个动作，将程序逐行转换成机器语言后，马上运行程序代码，如图
    2-1 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_40_0.png)


    因为解释器是一行一行转换和执行，所以 Python 语言的执行效率较 C/C++ 语言低。

    C/C++语言是编译语言（Compiled Language），用其编写的程序代码需要使用编译程序（Compilers）来检查，如果程序没有错误，就会翻译成机器语言的目标代码（Object
    Code）文件，如图 2-2 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_40_1.png)


