- pgno: 439
  md: '# # 16.1 决策树


    第 15 章的 Logistic 回归并不用来预测连续的数值数据，而是预测二元分类（Binary Classification），可以分类成男或女、成功或失败、真或假等。实际上，回归与分类算法都属于监督式学习。


    本章将介绍另外两种分类算法：决策树（Decision Tree）和 K 近邻算法（K Nearest Neighbor Algorithm，KNN），这两种都是多元分类（Multiclass
    Classification）算法，可以进行多种类别的分类，如多种类型电影、多种花等。


    # # 16.1.1 认识树状结构和决策树


    树（Trees）是一种模拟现实生活中树干和树枝的数据结构，属于阶层架构的非线性数据结构，如家族族谱，如图 16-1 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_439_0.png)


    图 16-1


    图 16-1 中，位于最上层的数据类似于树的树根，称为根节点（Root）；根节点下是树的树枝，拥有 0 ~ n 个子节点（Children），称为树的分支（Branch）；每一个分支的最后
    1 个节点称为叶节点（Leaf Node）。


    决策树（也称为判定树）是使用树状结构显示所有可能结果和其概率，可以帮助我们进行所需的决策，换一个角度，也就是将我们观察到的现象进行分类。所以，决策树就是一种特殊类型的概率树（Probability
    Tree）。


    决策树实际上由一系列是与否的条件决策所组成，每一个分支代表一个可能的决策、事件或反应，这是一个互斥选项，拥有不同的概率和分类来决定下一步。决策树可以用来显示如何和为什么一个选择可以导致下一步的选择。


    例如，电子邮件管理的决策树，当信箱收到新邮件后，导致 2 个分支，需要决策是否需要立即回复邮件。如果是，就马上回复邮件；如果不是，将导致另一个分支，是否在
    2 分钟内回复邮件。如果是，就在 2 分钟内回复邮件；如果不是，就标记回复邮件的时间，如图 16-2 所示。'
  merge: -1
  img_proc: true
