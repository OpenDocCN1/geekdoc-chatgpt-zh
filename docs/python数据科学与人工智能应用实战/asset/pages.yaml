    上述 P(A∩B) 的分子是 2 和 4 点两种，所以是 2; P(A∪B) 的分子是 1、2、3、4、6 点 5 种，所以是 5。


    # 11.2.2 条件概率


    条件概率是当一个事件已经发生，在此事件上发生另一事件的概率。例如，现在有事件 A 和事件 B，P(A|B) 就是条件概率，指事件 A 在事件 B 发生的样本空间上发生的概率。简单地说，这是转换分母的样本空间，从原来全部的样本空间改成只有
    B 事件发生的样本空间，其公式如下：


    P(A|B)=\frac{P(A∩B)}{P(B)}=\frac{\text{事件A和事件B同时发生的概率}}{\text{事件B发生的概率}}


    上述 P(A|B) 条件概率的图例，如图 11-6 所示。


