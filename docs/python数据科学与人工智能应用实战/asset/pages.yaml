    # 12.6.2 独立性检验


    概率的独立性（Independence）是指当知道一个变量值后，对于另一个变量值依然一无所知，即 2 个变量之间没有任何关联性。例如，性别和网站喜好之间拥有关联性，出生月份和喜好哪一种浏览器之间没有关联性，这就是独立性。卡方检验的独立性检验用于判断
    2 个分类变量之间是否拥有独立性。


    因为卡方检验的独立性检验会使用交叉分析表，所以应首先建立交叉分析表，再来进行卡方检验的独立性检验。'
