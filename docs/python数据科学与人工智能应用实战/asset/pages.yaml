    # 9.3.2 过滤数据


    DataFrame 对象可以使用布尔索引的条件、isin() 函数或 Python 字符串函数来过滤数据，即使用条件在 DataFrame 对象中选择数据。


    动手学——使用布尔索引和 isin() 函数过滤数据：Ch9_3_2.py


    DataFrame 对象的索引一样可以使用 NumPy 布尔索引，只选择条件成立的记录数据，如下所示：


    ```

    print(df[df.population > 350000])

    ```


    上述程序代码过滤 population 字段值大于 350000 的记录数据，其运行结果如图 9-20 所示。


    DataFrame 对象的 isin() 函数检查指定字段值是否在列表中，可以只过滤列表中符合条件的记录数据，如下所示：


    ```

    print(df[df["city"].isin(["台北市", "高雄市"]]))

    ```


    上述程序代码过滤 city 字段值是否在 isin() 函数的参数列表中，其运行结果只有“台北市”和“高雄市”两个城市，如图 9-21 所示。'
