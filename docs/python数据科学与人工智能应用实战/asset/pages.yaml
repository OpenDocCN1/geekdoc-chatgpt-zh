- pgno: 5
  md: '# 第 1 篇：数据科学和 Python 基础


    第 1 篇包括第 1～3 章，介绍了数据科学相关知识、Python 编程和 HTML 网页基础。其中，第 1 章介绍了什么是数据科学、数据种类和源于数据挖掘的数据科学的基本步骤，并且使用
    Anaconda 包创建本书 Python 开发环境；第 2 章介绍 Python 程序语言，以使读者拥有写出本书范例的 Python 程序的编程基础；第
    3 章是学习网络爬虫必须了解的 HTML 网页结构与 JSON 格式。


    # 第 2 篇：网络爬虫和 Open Data——获取数据


    第 2 篇包括第 4～7 章，介绍如何使用网络爬虫来获取网络数据。其中，第 4 章说明如何发出 HTTP 请求来获取 HTML 网页和 Open Data
    的 JSON 数据；第 5 章使用 BeautifulSoup 对象剖析 HTML 网页，使用函数、CSS 选择器或正则表达式来获取所需的数据；第 6 章使用
    Python 字符串处理和正则表达式来清理和转换获取的数据，并且将数据存储为 CSV 和 JSON 格式文件，或将数据存入 SQL 和 NoSQL 数据库；第
    7 章是几个网络爬虫的实战案例。


    # 第 3 篇：Python 数据科学包——探索数据


    第 3 篇包括第 8～13 章，其重点是 Python 数据科学包、概率和统计。其中，第 8 章介绍向量与矩阵运算的 NumPy 包；第 9 章介绍数据处理与分析的
    Pandas 包(可以理解为 Python 程序版的 Excel 电子表格)；第 10 章介绍数据可视化的 Matplotlib 包，可以绘制各种图表来展示或探索数据；第
    11 和 12 章介绍数据科学必备的概率与统计知识，以及数理统计中两个最基本也是最重要的内容——估计和检验；第 13 章说明探索性数据分析的主要工作后，使用一个完整实战案例来说明数据预处理的数据转换与清理和实战可视化的探索性数据分析。


    # 第 4 篇：人工智能与机器学习——预测数据


    第 4 篇包括第 14～16 章，开始进入人工智能与机器学习。其中，第 14 章介绍人工智能与机器学习的相关知识，并且说明什么是深度学习；第 15 和 16
    章使用实际案例说明多种机器学习算法，包括线性回归、复回归、Logistic 回归、决策树、K 近邻算法和 K-means 算法。


