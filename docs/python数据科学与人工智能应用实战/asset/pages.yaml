    # 6.4 将数据存入 SQL 数据库


    SQLite 是单一文件著名的免费数据库系统，Python 内置模块支持 SQLite 数据库，可以将从网页获取的数据存入 SQL 数据库。


    # 6.4.1 认识 SQLite 数据库


    SQLite 是目前世界上广泛使用的免费数据库引擎，是一套实现大部分 SQL92 标准的函数库。它不需要管理，没有服务器，不但体积轻巧，而且是一套支持交易（Transaction）的
    SQL 数据库引擎，其官方网址为 http://www.sqlite.org。


    SQLite 数据库的记录数据存储在单一文件中，直接使用文件存储数据库的数据。但是，SQLite 的执行效率仍然超过目前一些常用的数据库系统，其主要特点如下所示。


    +   - SQLite 数据库只是一个文件，直接使用文件权限来管理数据库，并不用自行处理用户权限管理，所以没有 SQL 的 DCL（Data Control
    Language，数据控制语言）访问控制。


    +   - 单一文件的 SQLite 数据库很容易安装，并不用特别进行数据库系统的设置与管理，而且不需要启动，不会浪费额外的内存资源。'
  merge: -1
  img_proc: true
