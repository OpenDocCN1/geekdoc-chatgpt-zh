  md: "```\nimport csv\n\ncsvfile = \"Example2.csv\"\nlist1 = [[10, 33, 45], [5, 25,\
    \ 56]]\nwith open(csvfile, 'w+', newline='') as fp:\n    writer = csv.writer(fp)\n\
    \    writer.writerow([\"Data1\", \"Data2\", \"Data3\"])\n    for row in list1:\n\
    \        writer.writerow(row)\n```\n\n上述程序代码调用 open() 函数打开文件，参数 newline='' 表示删除每一列多余的换行；然后调用\
    \ csv.writer() 函数写入文件；writerow() 函数表示写入一行 CSV 数据，其参数是列表；for/in 循环可以将列表 list1 的每一个元素写入文件。在其运行结果中可以看到\
    \ Excel 打开的文件内容，如图 6-2 所示。\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_174_0.png)\n\
    \n# 图 6-2\n\n# 动手学——从 W3School 获取表格数据并写入 CSV 文件：Ch6_3_1b.py\n\n了解了 CSV 文件的读写后，可以将网页\
    \ HTML 表格数据存入 CSV 文件。例如，W3School 的“视频格式”说明如图 6-3 所示。\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_174_1.png)\n\
