    # 11.3.3 排列与组合


    因为计算概率需要知道发生此情况的数量，即有关计数（Counting）的问题，所以还需要利用排列组合来找出有多少种可能。例如，大乐透开奖结果有几组可能，密码、身份证号码的组合有多少种等。


    # 1. 组合公式


    组合公式是在计算如果有 $n$ 个不同的东西，从中选出 $r$ 个的方式有几种，其公式为


    $C_r^n = \frac{n!}{r!(n-r)!}$


    上述公式的 C 是指英文 Combination（组合），$n!$ 是阶乘函数，$n$ 的值大于 0，而且 $0!=1$，如下所示：


    $n! = n \times (n-1) \times (n-2) \times \dots \times 3 \times 2 \times 1$


    例如，$4!=4 \times 3 \times 2 \times 1=24$，$5!=5 \times 4 \times 3 \times 2 \times
    1=120$。实际上，组合问题就是计算从 $n$ 个不同的东西选出 $r$ 个的方式有几种。例如，现在有 5 种水果，从 5 种水果之中选出 3 种水果的组合方式有几种。此时
    $n=5, r=3$，计算公式如下所示：


    $C_3^5 = \frac{5!}{3!(5-3)!} = \frac{5!}{3!2!} = 10$


    由计算结果可以知道有 10 种组合方式。再看一个例子，$0 \sim 9$ 共有 10 个数字，选出 3 个的组合方式有几种。此时 $n=10, r=3$，计算公式如下所示：


    $C_3^{10} = \frac{10!}{3!(10-3)!} = \frac{10!}{3!7!} = 120$


