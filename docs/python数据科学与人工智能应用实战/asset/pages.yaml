  md: '在第 12.4.3 节中，当区间估计的信赖系数是 95% 时，表示准确度是 95%；剩下 5% 会不准，称为显著水平，就是根据这 5% 的显著水平来判定检验的结果的。


    现在，假设“成年男性平均身高是 170cm”，接着从总体抽出样本并计算出平均身高。此时有两种情况，如下所示。


    +   - 落在 5% 的显著水平：因为这种概率很少见却发生了，表示假设有误，所以应该拒绝假设。5% 的区域称为临界区（Critical Region）或拒绝区（Region
    of Rejection）。


    +   - 落在信赖系数 95%：表示样本真的是来自预期的总体，所以应该接受假设。


    回顾第 12.2.1 节正态分布的特性：绝大部分样本平均数会落在总体平均数加减 2 个标准差之内。如果样本平均数落在 5% 显著水平，表示这并不是随机结果，已经离开太远了，远到出现的概率太小，所以抽出的样本并不能代表总体，应该拒绝假设。


    # ## 2. 虚无假设与对立假设


    检验的目的是验证提出的假设。一般来说，需要建立两种互相对立的假设，如下所示。


    +   - 虚无假设（Null Hypothesis）：也称为零假设。假设样本是来自总体，样本的特性是从总体而来，这也是目前状态或预设正确的答案（包含等于“=”的值），使用
    Ho 表示，如下所示。


    +   - Ho: 成年男性平均身高是 170cm。


    +   - Ho: 交换生的成绩和全校平均成绩相同。


    +   - 对立假设（Alternative Hypothesis）：对立假设和虚无假设互相对立，对立假设表示样本和总体之间的差异真的存在，样本并不是来自总体（所以不包含等于“=”的值），使用
    Ha 表示，如下所示。


    +   - Ha: 成年男性平均身高不是 170cm。


    +   - Ha: 交换生的成绩和全校平均成绩不相同。


    所以，当拒绝虚无假设时，就表示接受对立假设；反之接受虚无假设，就表示拒绝对立假设。


    # ## 3. 单尾检验与双尾检验


    统计的假设检验需要使用虚无假设和对立假设，当提出虚无假设：成年男性平均身高是 170cm 后，共有 3 种方式来提出对立假设，如下所示。


    +   - 成年男性平均身高不是 170cm。


    +   - 成年男性平均身高大于 170cm。


    +   - 成年男性平均身高小于 170cm。


    第 1 种情况是“不是”，因为包含“大于”和“小于”，如果显著水平是 5%，需除以 2，即左右两侧的拒绝域各 2.5%，称为双尾检验（Two-tailed
    Test）。


    第 2 种情况是“大于”，显著水平 5% 的临界区是右侧 5%（不需要除以 2）。


    第 3 种情况是“小于”，显著水平 5% 的临界区是左侧 5%。因为只有左或右单侧，所以称为单尾检验（One-tailed Test）。'
  merge: -1
