  md: "# 6.3.2 保存为 JSON 文件\n\nPython 的 JSON 处理使用 json 模块，配合文件处理即可将 JSON 数据写入文件和读取\
    \ JSON 文件内容。\n\n# 动手学——JSON 字符串和 Python 字典的转换：Ch6_3_2.py\n\n通过 json 模块的 dumps()\
    \ 函数可以将 Python 字典转换成 JSON 字符串，loads() 函数将 JSON 字符串转换成 Python 字典，如下所示：\n\n```\n\
    import json\n\ndata = {\n    \"name\": \"Joe Chen\",\n    \"score\": 95,\n   \
    \ \"tel\": \"0933123456\"\n}\n\njson_str = json.dumps(data)\nprint(json_str)\n\
    data2 = json.loads(json_str)\nprint(data2)\n```\n\n上述程序代码首先调用 dumps() 函数，将 Python\
    \ 字典转换成 JSON 数据内容的字符串；然后调用 loads() 函数，再将 JSON 字符串转换成 Python 字典。其运行结果如下所示：\n\n\
    {\"name\": \"Joe Chen\", \"score\": 95, \"tel\": \"0933123456\"}\n{'name': 'Joe\
    \ Chen', 'score': 95, 'tel': '0933123456'}\n\n# 动手学——将 JSON 数据写入文件：Ch6_3_2a.py\n\
    \n可以调用 dump() 函数将 Python 字典写入 JSON 文件，如下所示：\n\n```\nimport json\n\ndata = {\n\
    \    \"name\": \"Joe Chen\",\n    \"score\": 95,\n    \"tel\": \"0933123456\"\n\
    }\n\njsonfile = \"Example.json\"\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\nwith open(jsonfile, 'w') as fp:\n    json.dump(data, fp)\n```\n\n上述程序代码创建字典\
    \ data 后，调用 open() 函数打开写入文件，然后调用 dump() 函数将第 1 个参数的 data 字典写入第 2 个参数的文件，可以在 Python\
    \ 程序的目录中看到创建的 Example.json 文件。\n\n# 动手学——读取 JSON 文件：Ch6_3_2b.py\n\n可以调用 load()\
    \ 函数将 JSON 文件内容读取成 Python 字典，如下所示：\n\n```\nimport json\njsonfile = \"Example.json\"\
    \nwith open(jsonfile, 'r') as fp:\n    data = json.load(fp)\njson_str = json.dumps(data)\n\
    print(json_str)\n```\n\n上述程序代码打开 JSON 文件 Example.json 后，调用 load() 函数读取 JSON 文件，将其转换成字典，接着转换成\
    \ JSON 字符串，输出 JSON 内容。其运行结果如下所示：\n\n```\n{ \"name\": \"Joe Chen\", \"score\":\
    \ 95, \"tel\": \"0933123456\" }\n```\n\n# 动手学——将北京市天气查询的 JSON 数据写入文件：Ch6_3_2c.py\n\
    \n天气查询的 Web 服务可以通过输入城市代码来查询天气信息。例如，北京市的城市代码为 101010100，如图 6-5 所示（http://www.weather.com.cn/data/sk/101010100.html）。\n\
