    # 11.2 组合事件与条件概率


    目前介绍的概率都是单一事件，当涉及 2 个或更多事件时，就需要探讨组合事件（Compound Events）和条件概率（Conditional Probability）。


    # 11.2.1 组合事件


    组合事件是指处理 2 个或更多个事件，即事件拥有 2 或更多个简单事件。例如，现在有事件 A 和事件 B，则：


    +   - 事件 A 和 B 同时发生的概率，因为是交集，所以使用交集符号表示，即 P(A∩B)。

    +   - 事件 A 或事件 B 任一个发生的概率（没有同时发生），因为是并集，所以使用并集符号表示：P(A∪B) 。


    以掷 1 个骰子为例，事件 A 是“出现点数 4（含）以下的事件”，事件 B 是“出现点数是偶数的事件”，如图 11-4 所示。


    图 11-4 中，事件 A 是 1、2、3、4 点，事件 B 是 2、4、6 点，AB 是 A∩B，即 2、4 点，如图 11-5 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_327_1.png)


    图 11-4


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_327_2.png)


    图 11-5'
