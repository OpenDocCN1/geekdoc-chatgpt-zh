    # 11.3 概率定理与排列组合


    概率定理（The Rule of Probability）可以帮助计算组合事件的概率。另外，还需要了解排列，才能计算出除了组合，还有排列的概率。


    # 11.3.1 加法定理


    在第 11.2.1 节已经介绍过事件 A 或事件 B 任一个发生概率的计算，可以改用加法定理来计算 P(A∪B)，其公式如下所示：


    ```

    P(A ∪ B) = P(A) + P(B) - P(A ∩ B)

    ```


    上述公式是先将事件 A 和事件 B 的概率加起来，然后减去共同部分的概率。以第 11.2.1 节的范例为例，事件 A 是“出现点数 4（含）以下的事件”，P(A)=4/6；事件
    B 是“出现点数是偶数的事件”，P(B)=3/6。其计算过程如下：


    ```

    P(A ∪ B) = 4/6 + 3/6 - 2/6 = 5/6

    ```


    如果 2 个事件 A 和 B 是互斥的，即不可能同时发生，因此 P(A ∩ B) = 0，此时的公式如下：


    ```

    P(A ∪ B) = P(A) + P(B)

    ```


    例如，一个星期有星期一～星期日，事件 A 是“今天是星期一”，事件 B 是“今天是星期五”，依据加法定理，P(A ∪ B) = 1/7+1/7 = 2/7。


    # 11.3.2 乘法定理


    在第 11.2.1 节已经介绍过事件 A 和事件 B 同时发生概率 P(A ∩ B) 的计算，可以改用乘法定理来计算 P(A ∩ B)，其公式如下所示：


    ```

    P(A ∩ B) = P(A) × P(B|A)

    ```


    上述公式是乘以 P(B|A)，而不是 P(B)，因为事件 A 和 B 可能相关（Dependence）。简单地说，事件 A 和事件 B 同时发生的概率，就是事件
    A 发生的概率，乘以当事件 A 发生时，事件 B 发生的概率。


    以第 11.2.1 节的范例为例，事件 A 是“出现点数 4（含）以下的事件”，P(A)=4/6；事件 B 是“出现点数是偶数的事件”，P(B|A) 是 1/2。其计算过程如下：


    ```

    P(A ∩ B) = 4/6 × 3/6 = 12/36 = 1/3

    ```


    如果事件 A 和事件 B 是独立事件（Independence Events），不受其他因素影响，此时 P(B|A) 就是 P(B)，所以公式如下所示：'
