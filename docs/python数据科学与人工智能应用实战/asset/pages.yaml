    就是 p 值。


    对于虚无假设来说，在计算出检验统计量后，可以得到相对于对立假设来说有利的概率，这就是 p 值。其判断条件是当 p 值小于显著水平（如 5% 就是 0.05）时，必须拒绝虚无假设，接受对立假设。


    以本书饮料瓶范例来说，使用 p 值的双尾检验和单尾检验如下所示。


    +   - 双尾检验：对立假设是“饮料瓶容量不是 500ml”，因为 p 值约为 0.134，明显大于显著水平 0.05，所以必须接受虚无假设。


    +   - 单尾检验：对立假设是“饮料瓶容量大于 500ml”，p 值除以 2，即 0.134/2=0.067，仍然大于显著水平 0.05，所以必须接受虚无假设。


    # 12.5.4 型 1 和型 2 错误


    因为假设检验的显著水平决定是否拒绝虚无假设的概率，再加上无法得知获取的样本是否真的是具代表性的样本，所以假设检验永远拥有不确定性，而且可能犯错，即 型 1
    错误（Type I Error）和型 2 错误（Type II Error），如表 12-1 所示。


    | 虚无假设 | 检验后接受虚无假设 | 检验后拒绝虚无假设 |

    |---|---|---|

    | 虚无假设为真 | 正确决策 | 型 1 错误 |

    | 虚无假设为假 | 型 2 错误 | 正确决策 |


    # 1. 型 1 错误


    当虚无假设为真时，因为抽样检验有偏差而让统计检验量落在临界区内，所以拒绝虚无假设，但是虚无假设是真，所以犯了错误，不应该拒绝虚无假设，此种错误称为型 1 错误。


    为了避免型 1 错误，应该使用较小的显著水平（如 5%），即减少临界区的面积。事实上，当决定了显著水平时，就已经将统计检验量分成两类，如下所示。


    +   - 统计检验量落在临界区内：因为认为不太可能发生，所以拒绝虚无假设。


    +   - 统计检验量落在非临界区：因为认为这很容易发生，所以接受虚无假设。'
