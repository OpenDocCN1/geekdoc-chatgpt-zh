    # 12.3 中心极限定理


    中心极限定理（Central Limit Theorem）是第 12.1.3 节中算术平均数抽样分布的重要定理，因为统计分析的理论基础是正态分布，而中心极限定理可以证明算术平均数的抽样分布是一种正态分布。


    # 1. 认识中心极限定理


    无论总体是哪一种分布，算术平均数的抽样分布就是一种正态分布，其定理如下：

    总体平均数是 \(\mu\)，标准差是 \(\sigma\)，从总体重复抽出 \(n\) 个样本数的样本，当 \(n\) 越大时，样本平均数 \(\bar{X}\)
    组成的抽样分布会近似正态分布，此分布的平均数也是 \(\mu\)（和总体平均数相同），标准差 \(s\) 是 \(\frac{\sigma}{\sqrt{n}}\)。


    上述定理和第 12.1.3 节的差异在于不用考虑总体是否为正态分布，当样本数 \(n\) 够大时（通常 \(n\) 大于 100），算术平均数的抽样分布就是一种正态分布。


    Tip 中心极限定理的 \(n\) 越大是指样本数要够大，并不是指每次抽样的样本数越来越大，每一次抽样仍然使用固定样本数 \(n\)。


    # 2. 掷骰子的中心极限定理


    以掷骰子为例来说明中心极限定理。当掷一个“公正”骰子时，随机变量 \(X\) 的点数都拥有相同的概率 1/6，称为均匀分布（Uniform Distribution），即掷骰子的总体是均匀分布，并非正态分布。

    现在，从掷骰子的总体重复抽出数个样本来计算样本平均数。首先使用的样本数是 1，并且重复掷 100 次骰子来计算样本平均数（Python 程序：Ch12_3.py），如下所示：'
