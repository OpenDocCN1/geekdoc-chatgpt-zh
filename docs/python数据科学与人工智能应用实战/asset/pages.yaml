    # ## 3. 方差


    全距和四分位差在计算上十分简单明了，但问题是它们都只使用 2 个值来表示数据的离散程度，而不是全部的样本数据。为了使用全部的样本数据，可以将每一个值减去第
    11.5.1 节的平均数，该过程得到的值称为偏差（Deviations），表示数据偏离平均数多少。如果数据越离散，偏差也会越大，如下所示：


    偏差 = \(x_i - \bar{x}\)


    然后，将全部数据的偏差值平方后，加总，得到偏差平方和（平方的目的是避免负值，否则总和值会正负相抵），如下所示：


    偏差平方和 = \((x_1 - \bar{x})^2 + (x_2 - \bar{x})^2 + \cdots + (x_n - \bar{x})^2\)


    最后，将偏差平方和除以数据量，就是方差（Variance），比率尺度的数据可以使用方差，其公式如下所示：


    方差 \(s^2 = \frac{(x_1 - \bar{x})^2 + (x_2 - \bar{x})^2 + \cdots + (x_n - \bar{x})^2}{n}\)


    例如，有 2 个样本 A 和 B，各有 6 个数值，其平均值都是 10，如下所示：


    样本 A={10, 9, 12, 8, 11, 10}

    样本 B={2, 2, 2, 4, 4, 46}'
