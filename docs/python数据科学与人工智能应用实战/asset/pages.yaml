  md: "# 动手学——向上遍历父标签： Ch5_5_3.py\n\n可以使用 parent 属性和 find_parent() 函数遍历父标签，如下所示：\n\
    \n```\ntag_div = soup.select(\"#q2\")    # 找到第 2 题\ntag_ul = tag_div[0].ul   \
