    \ 数据标准化\n\n因为从样本本计算出的平均数和标准差会因为单位的不同而造成数值上的变化，如米、厘米或千克、克等，所以可能造成统计分析时产生完全不同的结果，数据标准化就是在解决此问题。数据标准化删除数据原来的单位，统一使用标准分数（Standard\
    \ Score）或称为 Z 分数作为单位，在转换成 Z 分数后，平均数成为 0，标准差成为 1，其公式如下所示：\n\n标准化 \\( z=\\frac{x_i-\\\
    bar{x}}{s} \\)\n\n从上述公式可知，当变量 \\( x \\) 等于平均数时，\\( z=0 \\)，所以标准正态分布下的平均数是 \\(\
    \ 0 \\)。原式变量 \\( x \\) 等于 \\( \\bar{x}+s \\) 时，转换后 \\( z=1 \\)，如右所示：\\( z=\\frac{(\\\
    bar{x}+s)-\\bar{x}}{s}=1 \\)。\n\n标准化的目的是将原来的数据转换成一种标准分数，这样不同的样本分布在经过标准化后，因为拥有相同单位的\
    \ \\( Z \\) 分数，所以就可以进行比较。\n\n例如，在某社交软件随机选择 24 位朋友的样本，并且一一记下其朋友数。首先查看样本的统计量（Python\
