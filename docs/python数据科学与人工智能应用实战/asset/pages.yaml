  md: '# 3.5 HTML 5 语意与结构标签


    HTML 5 继承了大部分 HTML 4 标签，并更改了部分标签的使用、意义和属性，其他新增部分是语意与结构标签。HTML 5 语意与结构标签的简单说明如表
    3-12 所示。


    # 表 3-12 HTML 5 语意与结构标签的简单说明


    | 标签 | 说明 |

    | --- | --- |

    | <article> | 建立自我包含的完整内容成分，如博客或 BBS 文章 |

    | <aside> | 建立非网页主题但相关的内容片段，只是有些离题 |

    | <bdi> | 设定部分文字来格式化成不同的文字显示方向 |

    | <command> | 建立用户可使用的命令按钮 |

    | <details> | 建立可展开的文本块，用户可以自行显示或隐藏详细的说明文字 |

    | <summary> | 建立 <details> 标签的标题文字 |

    | <figure> | 建立自我说明的图形、照片或程序片段等内容 |

    | <figcaption> | 定义 <figure> 标签的标题文字 |

    | <footer> | 建立网页或区段内容的脚注区块 |

    | <header> | 建立网页的标题区块，可以包含说明、商标和导览 |

    | <hgroup> | 群组 <h1> ~ <h6> 标签来建立多层次的标题文字，如副标题文字等 |

    | <mark> | 建立需要做记号的重点文字 |

    | <meter> | 显示可测量单位的使用量，如硬盘使用量等 |

    | <nav> | 建立网页导览区块，即连接其他网页的超链接 |

    | <progress> | 显示文档下载等长时间操作的进度 |

    | <ruby><rt><rp> | <ruby> 标签可以建立支持 Ruby 符号的标签，<rt> 标签定义文字的说明与发音，<rp> 标签是当浏览器不支持时显示的内容
    |

    | <section> | 建立一般用途的文件或应用程序区段，如报纸的体育版、财经版等 |

    | <wbr> | 定义可能的文字断行 |


    # 3.6 HTML 网页结构与 DOM


    DOM（Document Object Model，文件对象模型）可以将 HTML 元素转换成一棵节点树，每一个标签和文字内容都是一个节点（Nodes），使用程序代码访问节点来存取
    HTML 元素。


    # 3.6.1 认识 DOM 对象模型


    DOM 对象模型提供了一组标准程序接口来存取对象的属性和方法，程序设计者可以直接使用此程序接口来浏览 HTML 网页或 XML 文件，或新增、删除和修改节点数据。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '对于 HTML 网页来说，DOM 主要由两大部分组成，如下所示。


    +   - DOM Core: 提供 HTML 网页或 XML 文件浏览、处理和维护阶层结构，主要提供两种功能，如下所示。

    +   > 浏览（Navigator）：在网页的树状结构中访问节点。

    +   > 参考（Reference）：存取节点的集合对象。


    +   - DOM HTML: HTML 网页专属的 DOM API 接口，其目的是将网页元素都视为一个一个的对象，以便让程序语言存取元素来建立动态网页内容。


    DOM Core 同时支持 XML 和 HTML，因此可以使用相同的属性和方法来访问和存取对象；DOM HTML 是 HTML 网页，可以存取各种不同的 HTML
    元素。


    # 3.6.2 DOM 基础的 HTML 节点树


    DOM 可以将 HTML 网页的标签和文字内容视为节点，根据各节点之间的关系连接成树状结构。如一个简单的 HTML 网页，如下所示：


    ```

    ```html

    <html>

    <head>

    <title>范例文件</title>

    </head>

    <body>

    <h2>网页语言</h2>

    <p>JavaScript 是一种<i>Simple</i>语言</p>

    </body>

    </html>

    ```

    ```


    从 DOM 角度来看，上述 HTML 网页就是一棵树状结构的节点树，如图 3-12 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: "从图 3-12 可以看出各节点之间的关系，每一个节点都是一个对象，DOM HTML 提供各节点对象的属性和方法，DOM Core 提供属性和方法以访问上述树状结构的节点。\n\
    \n进一步分析上述树状结构，在节点之下包括的下一层是子节点（Child Node），上一层是父节点（Parent Node），左右同一层是兄弟节点（Sibling\
    \ Node），在最下层的节点称为叶节点（Leaf Node），HTML 网页显示的内容是文字节点（Text Node）。\n\n# 3.7 JSON 的基础\n\
    \nJSON（JavaScript Object Notation）是类似于 XML 的一种数据交换格式，事实上，JSON 就是 JavaScript 对象的文字表示法，其内容只有文字（Text\
    \ Only）。\n\n# 3.7.1 认识 JSON\n\nJSON 是由 Douglas Crockford 定义的一种轻量化数据交换格式，比 XML\
    \ 快速且简单。JSON 数据结构就是 JavaScript 对象文字表示法，无论 JavaScript 语言还是其他程序语言都可以轻易解读，这是一种和语言无关的数据交换格式。\n\
    \n+   1. 为什么使用 JSON\n\n因为 JSON 格式就是文字内容，可以很容易地在客户端和服务器端之间传送数据，所以 JSON 已经取代 XML\
    \ 成为异步浏览器与服务器之间通信使用的数据交换格式。另外，很多网络公司也都支持 REST API，其可以获取 JSON 格式的数据。即获取网络数据时，除了自行从\
    \ HTML 标签获取外，也可以通过 AJAX 下载 JSON 格式文件。\n\n不只如此，JSON 格式文件还是数据存储的格式，很多 NoSQL 数据库存储的数据就是\
    \ JSON 格式，详见第 6 章的说明。\n\n+   2. JSON 文件的内容\n\nJSON 是一种可以自我描述和容易了解的数据交换格式，使用大括号定义成对的键和值（Key-Value\
    \ Pairs），相当于对象的属性和值，类似于 Python 语言的字典和列表，如下所示：\n\n```\n{\n\t\"key1\": \"value1\"\
    ,\n\t\"key2\": \"value2\",\n\t\"key3\": \"value3\",\n\t...\n}\n```\n\nJSON 如果是对象数组，则可以使用中括号来定义，如下所示：\n\
    \n```\n[\n\t{\n\t\t\"title\": \"ASP.NET 网页设计\",\n```"
