    # 6.5 将数据存入 NoSQL 数据库


    MongoDB 是 Document Stores 数据模型的 NoSQL 数据库，其存储的数据是文件（Document，记录），即一种扩充的 JSON 格式文件，数据表称为
    Collection 集合。


    # 6.5.1 认识 NoSQL 和 MongoDB


    NoSQL 是一个名词，并不是数据库，从英文字面解释其有两种说法：一是 No 和 SQL，表示没有 SQL，即不是使用 SQL 语法来存取数据库。所以，NoSQL
    不是一种关系数据库模型的数据库，也不使用 SQL 语言。二是 Not Only SQL，这是最常见的解释，泛指从 21 世纪初发展的那些没有遵循关系数据库模型的各种数据库系统（大多是开源项目），即
    NoSQL 数据库不使用表格的字段和记录存储数据，也不使用 SQL 语言进行数据操作和查询。


    实际上，上述两种解释都是针对目前主流的关系数据库和 SQL 语言所做的对比和反弹。如果单纯从技术角度来说，NoSQL 是一组观念，其专注于提升效能、可靠性和灵活性，以快速和有效率地处理数据，包含结构化和非结构化数据。


    MongoDB 是一套支持 Windows、Linux、Mac OS X 和 Solaris 操作系统的跨平台数据库系统，是可提供高效能、高可用性和高扩展性的
    Document Stores 数据模型的数据库，所以将其归类在 NoSQL 数据库。下载和安装 MongoDB 数据库服务器请参阅附录 A（电子版）。


