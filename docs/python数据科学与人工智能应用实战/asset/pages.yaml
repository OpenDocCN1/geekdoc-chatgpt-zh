    是横向，每一个数组连接在数组的右方，如下所示：


    ```

    a = np.array([[1, 2], [3, 4]])

    b = np.array([[5, 6], [7, 8]])


    c = np.concatenate((a, b))

    print("c=np.concatenate((a, b))->")

