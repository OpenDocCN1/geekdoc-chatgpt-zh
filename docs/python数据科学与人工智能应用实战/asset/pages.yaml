    # 8.2 数组的基本使用


    数组类似于 Python 列表，但是是数组元素的数据类型必须是相同的，不同于列表可以不同。


    # 8.2.1 认识数组


    数组是程序语言的一种基本数据结构，属于有序的数据结构。日常生活中最常见的数组范例是一排信箱，如图 8-3 所示。


    图 8-3 所示为小区中的一排信箱，邮政人员根据信箱号码投递邮件，住户根据信箱号码取出邮件。信箱号码是存取数据的索引，因为只有 1 个索引，所以称为一维数组。


    多维数组是指二维数组及以上维度的数组（含二维），属于一维数组的扩充。如果将一维数组想象成一维空间的线，那么二维数组就是二维空间的平面，需要使用 2 个索引才能定位二维数组中的指定元素。


    在日常生活中，二维数组的应用非常广泛，只要是平面的各式表格都可以转换成二维数组，如月历、课程表等，如图 8-4 所示。如果继续扩充二维数组，还可以建立三维、四维等更多维的数组。


