  md: '布是平均数为 0、标准差为 1 的特殊的正态分布。


    # 1. 正态分布的特性


    正态分布的曲线以总体平均数（期望值）为中心，因为左右对称，任何位于中心左边的点与 x 轴之间在正态曲线下的面积和中心右侧同距离的点与 x 轴之间的面积相等，如图
    12-4 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_354_0.png)


    图 12-4

    图片来源：http://www.muelaner.com/wp-content/uploads/2013/07/Standard_deviation_diagram.png


    由图 12-4 可以看出，总体平均数 μ 和标准差 σ 所占面积的比例有一定的关系，如下所示。


    +   • 68.2%面积位于 μ ± σ 区间，即总体平均数加减 1 个标准差。

    +   • 95.4%面积位于 μ ± 2σ 区间，即总体平均数加减 2 个标准差。

    +   • 99.7%面积位在 μ ± 3σ 区间，即总体平均数加减 3 个标准差。


    当随机变量的分布是正态分布时，其面积的比例就是样本比例。例如，样本数为 1000，样本平均数加减 1 个标准差大约是 682（1000 × 68.2%），所以绝大部分样本平均数会落在总体平均数加减
    2 个标准差之内，只有极少数样本平均数会落在总体平均数加减 3 个标准差之外。也就是说，样本平均数极少数会比总体平均数加 3 个标准差大，或比总体平均数减
    3 个标准差小。


    # 2. 标准正态分布


    在了解正态分布的特性后，可以进一步将分布使用第 12.2.2 节的数据标准化转换成为标准正态分布，即平均数 μ=0 和标准差 σ=1 的正态分布，如下所示：


    ```

    标准正态分布f(x) = \frac{1}{\sqrt{2\pi}} e^{-\frac{x^2}{2}}

    ```


    上述公式和第 11.6.6 节中的公式类似，只是该公式中，μ=0, σ=1。Python 程序：Ch12_2_1.py 绘制的就是标准正态分布曲线，如图 12-5
    所示。'
