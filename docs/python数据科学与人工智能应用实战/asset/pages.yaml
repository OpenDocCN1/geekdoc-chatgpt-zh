    # 16.2.3 交叉验证的 K 值优化


    第 15.3.3 节是将数据集分割成训练数据集和测试数据集，使用训练数据集训练模型，使用测试数据集验证模型，这种方式称为持久性验证（Holdout Validation）。该方式的缺点是有些数据并没有用来训练，单纯只用在验证，即并没有使用完整的数据集来进行模型的训练。


    # 1. K-fold 交叉验证


    交叉验证用于解决持久性验证的问题，其将数据集分割成 2 个或更多分隔区（Partitions），并且将每一个分隔区都作为测试数据集，将其他分隔区作为训练数据集。最常用的交叉验证是
    K-fold 交叉验证（K-fold Cross Validation）。


    图 16-12 中，K-fold 将数据集随机分割成相同大小的 K 个分隔区，或称为折（Folds），第 1 次使用第 1 个分隔区作为测试数据集来验证模型，其他
    K-1 个分隔区用来训练模型；第 2 次是使用第 2 个分隔区作为测试数据集来验证模型，其他 K-1 个分隔区用来训练模型。重复执行 K 次，即可组合出最后的模型。所以，交叉验证可以让使用数据集的所有数据来训练和建立模型。'
