  md: '# # 2.5 容器类型


    Python 语言支持的容器类型有列表、字典、集合和元组。容器类型如同一个放东西的盒子，可以将元素或元素的东西存储在盒子中。


    # ## 2.5.1 列表


    Python 语言的列表（List）类似于其他程序语言的数组（Arrays），中文译名有清单、串行和阵列等。不同于字符串类型的不能更改，列表允许更改（Mutable）内容，因此可以新增、删除、插入和更改列表中的元素（Items）。


    # ### 1. 列表的基本使用


    Python 列表是使用中括号“[]”括起的多个元素，每一个元素使用逗号“，”分隔（Python 程序：Ch2_5_1.py），如下所示：


    ```

    ls = [6, 4, 5]    # 创建列表

    print(ls, ls[2])  # 输出 "[6, 4, 5] 5"

    print(ls[-1])     # 负索引从最后开始：输出 "5"

    ls[2] = "py"      # 指定字符串类型的元素

    print(ls)         # 输出 "[6, 4, ''py'']"

    ls.append("bar")  # 新增元素

    print(ls)         # 输出 "[6, 4, ''py'', ''bar'']"

    ele = ls.pop()    # 取出最后元素

    print(ele, ls)    # 输出 "bar [6, 4, ''py'']"

    ```


    上述程序代码首先创建包括 3 个元素的列表 ls，然后使用索引取出第 3 个元素（索引从 0 开始），负索引 -1 是最后 1 个，将列表元素更改为字符串后，再使用
    append() 函数在最后新增元素，pop() 函数可以取出最后 1 个元素。


    # ### 2. 切割列表


    Python 列表可以在中括号“[]”中使用符号“:”，即指定开始和结束来分割列表，使其成为子列表（Python 程序：Ch2_5_1a.py），如下所示：


    ```

    nums = list(range(5))   # 创建一个整数列表

    print(nums)             # 输出 "[0, 1, 2, 3, 4]"

    print(nums[2:4])        # 切割索引 2~4（不含 4）：输出 "[2, 3]"

    print(nums[2:])         # 切割索引从 2 至最后：输出 "[2, 3, 4]"

    print(nums[:2])         # 切割从开始至索引 2（不含 2）：输出 "[0, 1]"

    print(nums[:])          # 切割整个列表：输出 "[0, 1, 2, 3, 4]"

    print(nums[:-1])        # 使用负索引切割：输出 "[0, 1, 2, 3]"

    ```'
