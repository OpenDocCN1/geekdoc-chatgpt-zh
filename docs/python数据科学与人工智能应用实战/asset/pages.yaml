    群组是先将数据根据条件分类成群组后，再套用相关函数在各群组取得一些统计数据。本节 Python 程序 Ch9_5_1.py 是使用群组来计算总和，首先使用字典创建测试的
    DataFrame 对象，如下所示：


    ```

