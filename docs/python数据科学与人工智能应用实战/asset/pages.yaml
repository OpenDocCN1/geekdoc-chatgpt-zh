  md: '# 15.1 认识机器学习算法


    机器学习算法是一种从数据中学习，完全不需要人类干预，就可以自行从数据中取得经验，并且从经验中提升能力的算法。简单地说，机器学习使用的算法就是机器学习算法。


    # 15.1.1 机器学习算法的种类


    随着人工智能的快速发展，人们已经开发出许多种针对不同问题使用的机器学习算法，可以根据第 14.3 节中介绍的机器学习的种类来简单区分机器学习算法，如下所示。


    +   1. 监督式学习


    监督式学习的问题基本上分成 2 类，如下所示。


    +   - 回归问题：预测连续的响应数据，这是一种数值数据，可以预测商店的营业额、学生的身高和体重等。回归问题常用算法有线性回归、SVR 等。

    +   - 分类问题：预测可分类的响应数据，这是一些有限集合，可以分类成男与女、成功与失败、癌症分成第 1～4 期等。分类问题常用算法有 Logistic
    回归、决策树、K 近邻算法、CART、朴素贝叶斯等。


    +   2. 非监督式学习


    非监督式学习的问题基本上分成 3 类，如下所示。


    +   - 关联问题：找出各种现象同时出现的概率，称为购物篮分析（Market-basket Analysis）。例如，当顾客购买米时，78%可能会同时购买鸡蛋。关联问题常用算法有
    Apriori 算法等。

    +   - 分群问题：将样本分成相似的群组，这是数据如何组成的问题，可以帮助分群出喜欢同一类电影的观众。分群问题常用算法有 K-means 算法等。

    +   - 降维问题：减少数据集中变量的个数，但是仍然保留主要信息而不失真，通常是使用特征提取和选择方法来实现。降维问题常用算法有主成分分析算法等。


    # 15.1.2 Scikit-learn 介绍


    Scikit-learn 是 scikits.learn 的正式名称，是一套支持 Python 2 和 Python 3 语言且完全免费的机器学习函数库，内置多种回归、分类和分群等机器学习算法，其官网（网址为
    http://scikit-learn.org/stable）如图 15-1 所示。


    在 Scikit-learn 官网可以免费下载和安装 Scikit-learn，因为 Anaconda 整合安装包已经内置 Scikit-learn，所以可以在
    Spyder 的 Python 程序代码中直接导入 Scikit-learn 包，如下所示：


    ```

    from sklearn.linear_model import LinearRegression

    ```


    上述程序代码导入 Scikit-learn 包的线性回归模型。Scikit-learn 官网中提供了完整联机帮助文件，以及各种机器学习算法的学习地图，如图
    15-2 所示。'
