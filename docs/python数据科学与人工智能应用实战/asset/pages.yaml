  md: "# # 7.1 网络爬虫的常见问题\n\n网络爬虫是向 Web 服务器发送 HTTP 请求后，从回传 HTML 网页中获取所需的内容。本书 Python\
    \ 程序使用 requests 向目标 URL 网址发送 HTTP 请求，但是因为目前很多网站内建防爬机制，所以联机时可能会遇到一些问题，本节就来介绍一些常见的问题。\n\
    \n# ## 1. 更改 HTTP 标头，伪装成浏览器发送请求\n\n从第 4.3.1 节的 Ch4_3_1b.py 中可以看出，如果使用 requests\
    \ 发送 HTTP 请求，则 Web 网站可以知道是 Python 程序发送的请求，并不是浏览器。例如，发送 HTTP 请求至“经管之家”（https://bbs.pinggu.org）网站（Python\
    \ 程序：Ch7_1.py），如下所示：\n\n```\nimport requests\n\nURL = \"https://bbs.pinggu.org/\"\
    \n\nr = requests.get(url)\nif r.text.strip() is not '':\n    print(r.text)\nelse:\n\
    \    print(\"HTTP 请求错误...\" + url)\n```\n\n上述程序代码使用 requests 发送 HTTP 请求，从运行结果中会看到返回值为空字符串。这里通过\
    \ “if r.text.strip() is not :” 来判断是否请求成功，如果请求失败，将会输出 “HTTP 请求错误...”，如下所示：\n\n\
    HTTP 请求错误...https://bbs.pinggu.org/\n\n在第 4.4.2 节已经介绍过更改标头信息的方式。假设是从浏览器发送 HTTP\
    \ 请求（Python 程序：Ch7_1a.py），如下所示：\n\n```\nimport requests\n\nurl = \"https://bbs.pinggu.org/\"\
    \n\nheaders = {'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'\n   \
    \     'AppleWebKit/537.36 (KHTML, like Gecko)'\n        'Chrome/63.0.3239.132\
    \ Safari/537.36'}\nr = requests.get(url, headers=headers)\nif r.status_code ==\
    \ requests.codes.ok:\n```"
