  md: '# # 9.1 Pandas 包的基础


    Pandas 是著名的 Python 包，是一套高效能的数据分析工具，也是数据科学和机器学习领域必学的 Python 包。


    # ## 9.1.1 认识 Pandas 包


    Pandas 包属于数据处理和分析工具，简单地说，可以将 Pandas 包视为一套 Python 程序版的 Excel 电子表格工具，通过简单的 Python
    程序代码，就可以针对表格数据执行 Excel 电子表格的功能。


    # ### 1. Pandas 包简介


    Pandas 包和熊猫（Panda）并没有任何关系，这个名称源于 Python and data analysis and panel data 的缩写。Pandas
    是一套使用 Python 语言开发的 Python 包，其主要目的是帮助开发者进行数据处理和分析。事实上，数据科学有 80% 的工作是在进行数据处理。


    Pandas 包是架构在 NumPy 包之上，提供特殊的数据结构和操作来处理数值和表格数据，其特点如下所示。


    +   - 提供一组拥有标签的数组数据结构，称为 Series 和 DataFrame 对象。

    +   - 索引对象支持单轴索引和多层次的阶层索引。

    +   - 集成群组（Grouping）功能，可以聚合（Aggregating）和转换（Transforming）数据集（Data Set）。

    +   - 日期范围产生函数和自定义日期的位移，能够帮助我们操作自定义的日期序列。

    +   - 提供强大的数据加载和输出功能，可以直接加载或输出表格数据的 CSV、JSON 和 HTML 等数据。


    # ### 2. Pandas 包的数据结构


    Pandas 包提供了两种数据结构，其说明如下所示。


    +   - Series 对象：类似于一维数组的对象，这是一个拥有标签的一维数组。更准确地说，可以将 Series 视为 2 个数组的组合，一个是类似索引的标签，另一个是实际数据。

    +   - DataFrame 对象：类似于电子表格的表格数据，这是一个有标签（索引）的二维数组，其结构可以任意更改，每一行允许存储不同数据类型的数据。


    > Tip: 如果读者学过关系数据库，那么 DataFrame 对象如同是数据库的一个数据表，每一行就是一项记录，每一个字段对应记录的字段。'
  merge: -1
  img_proc: true
