  md: '# # 9.4.1 更新数据


    可以更新 DataFrame 对象特定位置的标量值、单项记录、整个字段，也可以更新整个 DataFrame 对象的数据。


    # ## 动手学——更新标量值： Ch9_4_1.py


    只需使用第 9.3.1 节的标签和位置来选择数据，就可以更新选择的数据。DataFrame 对象 df 和第 9.3 节相同，如下所示：


    ```

    df.loc[ordinals[0], "population"] = 160000

    df.iloc[1, 2] = 560000

    print(df.head(2))

    ```


    上述程序代码中，第 1 行使用标签选择第 1 项记录的 population 字段，将值改成 160000；第 2 行修改第 2 项记录。从运行结果中可以看到，索引值为
    2 的人口数值都已更改，如图 9-26 所示。


    # ## 动手学——更新单项记录： Ch9_4_1a.py


    当使用 Python 列表创建新的记录数据后，就可以选择欲取代的记录来取代，如下所示：


    ```

    s = ["新北市", "新庄区", 416640]

    df.loc[ordinals[1]] = s

    print(df.head(3))

    ```


    上述程序代码创建 Python 列表 s 后，使用标签选择第 2 项记录，然后直接以指定语句来更改这项记录。在其运行结果中可以看到第 2 项的“板桥”已经改成“新庄”，如图
    9-27 所示。


