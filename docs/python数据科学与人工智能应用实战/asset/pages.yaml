  md: '# 3. 数据预处理: Ch13_5b.py


    在检验数据集的描述数据后，可知目前需要处理的工作如下所示。


    +   - PassengerId 字段是不是流水号，如果是，则可以将此字段改为索引字段。

    +   - Sex 字段是名目尺度数据，需要处理分类数据转换成数值的 0 和 1（1 是女，0 是 男）。

    +   - PClass 字段是名目尺度数据，需要处理分类数据转换成数值的 1、2 和 3（1 是 1st, 2 是 2nd, 3 是 3rd）。

    +   - Age 字段有很多遗漏值，准备使用 Age 字段的平均值来补值。

    +   - Name 字段值包含 Miss、Mrs 和 Mr 等信息，可以新增 Title 字段，区分乘客是先生、女士或小姐等。


    首先，调用 NumPy 包的 unique() 函数检查字段值是不是唯一，如下所示：


    ```

    print(np.unique(titanic["PassengerId"].values).size)

    ```


    上述程序代码调用 unique() 函数检查 PassengerId 字段是否唯一，通过 size 属性可以知道有多少个不同值。其运行结果如下所示：


    1313


    上述运行结果和数据集的行数相同，表示是唯一的流程编号。可以指定此字段为索引，如下所示：


    ```

    titanic.set_index(["PassengerId"], inplace=True)

    print(titanic.head())

    ```


    上述程序代码指定索引字段，参数 inplace 值为 True，表示直接取代目前的 DataFrame 对象。其运行结果如图 13-27 所示。


    | PassengerId | Name | PClass | Age | Sex | Survived |

    |---|---|---|---|---|---|

    | 1 | Allen, Miss Elisabeth Walton | 1st | 29.00 | female | 1 |

    | 2 | Allison, Miss Helen Loraine | 1st | 2.00 | female | 0 |

    | 3 | Allison, Mr Hudson Joshua Creighton | 1st | 30.00 | male | 0 |

    | 4 | Allison, Mrs Hudson JC (Bessie Waldo Daniels) | 1st | 25.00 | female | 0
    |

    | 5 | Allison, Master Hudson Trevor | 1st | 0.92 | male | 1 |


    图 13-27


    接着新增 SexCode 字段，将 Sex 字段改为数值 0 和 1（1 是女，0 是 男），如下所示：


    ```

    titanic["SexCode"] = np.where(titanic["Sex"]=="female", 1, 0)

    print(titanic.head())

    ```


    上述程序代码调用 NumPy 包的 where() 函数取代字段值，第 1 个参数是条件，条件成立指定成第 2 个参数值，条件失败则指定成第 3 个参数值。其运行结果如图
