    \ σ（总体标准差）。此时可以使用样本标准差 s（使用第 11.5.2 节的公式）来估计，但是因为有偏差，样本数需要使用自由度，此时的公式如下所示：\n\n\
    信赖区间c.i.=x̄ ± Z \\frac{s}{\\sqrt{n-1}}\n\n上述公式中的 n-1 是自由度（Degrees of Freedom），这是因为样本平均数\
    \ x 已知，计算时实际只有 n-1 个样本可以随机选择，最后 1 个 n 不用选，可以从平均数反推而得，即最后 1 个样本并非随机，所以自由度是 n-1。\n\
    \n样本比例的区间估计步骤和上述相同，因为样本比例的抽样分布也是一种正态分布，信赖区间的公式如下所示：\n\n信赖区间c.i.=P_s ± Z \\sqrt{\\\
