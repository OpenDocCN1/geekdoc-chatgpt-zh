  md: '# ### 4.1.3 HTTP 通信协议


    HTTP 通信协议 (Hypertext Transfer Protocol) 是一种在服务器端 (Server) 和客户端 (Client) 之间传送数据的通信协议，如图
    4-1 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_95_0.png)


    图 4-1


    图 4-1 所示的 HTTP 通信协议的应用程序是一种主从架构（Client-Server Architecture）应用程序，在客户端使用 URL 指定联机的服务器端资源，发送
    HTTP 信息（HTTP Message）进行沟通，可以请求指定文件，其过程如下所示。


    +   - Step 1 客户端请求联机服务器端。

    +   - Step 2 服务器端允许客户端的联机。

    +   - Step 3 客户端发送 HTTP 请求信息，内含 GET/POST 请求，以获取服务器端的指定文件。

    +   - Step 4 服务器端以 HTTP 响应消息来响应客户端的请求，返回信息包含请求的文件内容。


    # ## 4.2 使用 Requests 发送 HTTP 请求


    Python 语言内置的 urlib2 模块也可以发送 HTTP 请求，但是 Requests 包可以使用更简单的方式来发送 GET/POST 的 HTTP
    请求。这时需要导入模块，如下所示：


    ```

    import requests

    ```


    # ### 4.2.1 发送 GET 请求


    一般来说，在大部分浏览器 URL 网址中输入网址发送的请求都是 GET 请求，这是向 Web 服务器获取资源的请求。Requests 即调用 get() 函数来发送
    GET 请求。


