    # 3.2.2 段落、换行与水平线


    对于网页中的文字内容来说，可能需要根据内容长度将其分为段落、换行，或使用水平线来分割网页内容。


    # 1. 段落与换行


    HTML 网页中的文字内容使用段落编排，即 <p> 标签。<p> 标签可以定义段落，浏览器默认在之前和之后增加边界尺寸（可以使用 CSS 的 margin
    属性来更改），如下所示：


    ```

    <p>JavaScript 原为网景公司开发的脚本语言，

    提供该公司浏览器 Netscape Navigator 开发互动网页的功能。 </p>

    ```


    HTML 5 已经不再支持 align 属性的对齐方式，如需对齐元素，可使用 CSS 的 text-align 属性。


    一般来说，在文字处理器，如记事本或 Word 等中，编辑文字时按 Enter 键换行或建立新段落。而在 HTML 网页中，换行需要使用换行标签（并不是建立段落），只按
    Enter 键并不会显示换行，如下所示：


    ```

    <br/>

    ```


    # 2. 水平线


    HTML 的 <hr> 标签可以在浏览器中显示一条水平线。但是 HTML5 的 <hr> 标签不再只是为了美化版面，而是给予了其内容上主题分割的意义，可以分割网页内容，如下所示：


    ```

    <h3>HTML</h3>

    <p>HTML 语言是 Tim Berners-Lee 在 1991 年建立···</p>

    <hr/>

    <h3>JavaScript</h3>

    <p>JavaScript 原为网景公司开发的脚本语言···</p>

    ```


    上述内容分割成 HTML 和 CSS 的定义，使用的是 <hr> 标签。


    动手练——HTML 网页：Ch3_2_2.html


    HTML 网页使用段落、换行与水平线标签来建立名词索引的网页内容，如图 3-5 所示。


    上述网页使用 <hr> 标签分割网页内容，上方超链接使用 <br> 标签换行（关于超链接标签的说明请参阅第 3.3.2 节），单击该超链接可以跳转至下方的名词说明。'
