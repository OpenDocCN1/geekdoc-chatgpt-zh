    # ## 4.3 获取 HTTP 响应内容


    响应内容（Response Content）是发送 HTTP 请求后，Web 服务器回传给客户端的响应数据，其内容可能是 HTML 标签字符串、JSON 或二进制数据。


    # ### 4.3.1 获取 HTTP 响应内容的方法


    Python 程序调用 get() 和 post() 函数发送 HTTP 请求，如下所示：


    ```

    ```python

    r = requests.get("https://www.w3school.com.cn/")

    ```

    ```


    上述程序代码中的变量 r 是响应内容的 Response 对象，可以使用相关属性来获取响应数据，如表 4-1 所示。


    # #### 表 4-1 获取响应数据的属性及说明


    | 属性 | 说明 |

    | --- | --- |

    | text | 编码的卷标字符串，可以使用 encoding 属性获取使用的编码 |

    | contents | 没有编码的字节数据，适用于非文字请求 |

    | raw | 服务器响应的原始 Socket 响应（Raw Socket Response），这是 HTTPResponse 对象 |


    HTTP 响应内容如果是编码的 HTML 标签字符串，则 HTML 网页的编码在 `<head>` 的 `<meta>` 子标签指定，详见第 3.1.4 节的说明。


