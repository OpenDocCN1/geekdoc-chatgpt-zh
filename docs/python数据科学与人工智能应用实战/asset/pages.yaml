  md: '# 动手学——NumPy 数组广播的使用规则


    如果 2 个 NumPy 数组的形状不同，元素对元素的运算是无法进行的，NumPy 数组广播可以让较小数组扩充成大型数组的相同形状进行元素对元素的运算。广播
    2 个数组的使用规则如下所示。


    +   - 如果两个数组是不同等级的数组（ndim 属性值不同），就迫加较低等级数组的形状为 1。例如，a 是 (4, 3)，b 是 (3, )，则第 1
    步是将一维数组 b 增加成 (1, 3) 的二维数组。


    +   - 数组形状在每一个维度（Dimension）的尺寸是 2 个输入数组在该维度的最大值，所以在广播后，2 个数组的形状是 2 个输入数组的最大形状。例如，a
    是 (4, 3)，b 是 (1, 3)，最大值是 (4, 3)，所以最后数组 b 会广播成 (4, 3) 。


    +   - 当数组有任何一个维度的尺寸是 1，其他数组的尺寸大于 1，则尺寸 1 的数组会沿着此维度复制并扩充数组尺寸。例如，b 数组形状是(1, 3)，第
    1 维是 1，所以沿着第 1 维从 1 扩充成 4，即 (4, 3)。


    两个数组需要是兼容的（Compatible），NumPy 才会自动使用广播进行数组运算。数组符合兼容可广播的条件如下所示。


    +   - 两个数组拥有相同形状。


    +   - 两个数组拥有相同维度，而且每一个维度的尺寸是相同的，或此维度的尺寸是 1。


    +   - 如果两个数组的维度不同，较少维度的数组就会改变形状，迫加维度尺寸为 1，以便两个数组可以拥有相同的维度。


