  md: "# 11.6.6 正态分布\n\n正态分布也称常态分布，又名高斯分布（Gaussian Distribution），这是一种常见的连续型随机变量的概率分布。\n\
    \n# 1. 认识正态分布\n\n正态分布是统计学中一个非常重要的概率分布，经常用在自然和社会科学中，用来代表一个随机变量。正态分布配合平均数和标准偏差，可以进行精确的描述和推论。正态分布的形状是一个正态曲线（The\
    \ Normal Curve），其主要特性如下所示。\n\n+   正态曲线的外形是以平均值为中心，左右对称的钟形曲线。\n\n> Tip 对称形状不一定是正态分布，但正态分布一定是对称形状。\n\
    \n+   正态曲线的众数、中位数和平均数三合一。\n\n+   正态曲线的两尾向两端无限延伸。\n\n+   正态曲线的形状完全以平均数和标准偏差来决定。\n\
    \n正态分布之所以重要，是因为其可以用来发现真实世界的现象，如 IQ 测验、身高、体重、收入和支出等。这些真实世界的现象基本上都遵循正态分布的理论模型，所以常常使用正态分布模型化随机变量，大部分常用的统计检验也都假设数据分布是一种正态分布。\n\
    \n# 2. 正态分布的概率密度函数\n\n正态分布的概率密度函数如下所示：\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_347_0.png)\n\
    \n上述公式中，\\(\\mu\\) 是随机变量的平均数（期望值），\\(\\sigma\\) 是标准偏差。\n\n可以使用 Python 程序建立此公式的函数（Python\
    \ 程序：Ch11_6_6.py），如下所示：\n\n```\nimport numpy as np\nimport matplotlib.pyplot as\
    \ plt\n\ndef normal_pdf(x, mu, sigma):\n    pi = 3.1415926\n    e = 2.718281\n\
    \    f = (1./np.sqrt(2*pi*sigma**2))*e**(-(x-mu)**2/(2.*sigma**2))\n    return\
    \ f\n\nax = np.linspace(-5, 5, 100)\nay = [normal_pdf(x, 0, 1) for x in ax]\n\
    plt.plot(ax, ay)\n```"
