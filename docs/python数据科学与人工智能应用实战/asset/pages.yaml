  md: "# 动手学——使用 children 属性获取所有子标签：Ch5_5_2b.py\n\nBeautifulSoup 的 children 属性和 contents\
    \ 属性基本上是相同的，只是 children 属性返回的不是列表，而是列表生成器（List Generator），类似于 for 循环的 range()\
    \ 函数。例如，<li> 标签内是混合内容，包括文字内容和 <span> 子标签，现在获取 <li> 标签的文字内容，如下所示：\n\n```\ntag_div\
    \ = soup.select(\"#q2\")       # 找到第 2 题\ntag_ul = tag_div[0].ul             #\
    \ 遍历到之下的<ul>\nfor child in tag_ul.children:\n    if not isinstance(child, NavigableString):\n\
    \        print(child.name)\n        for tag in child:\n            if not isinstance(tag,\
    \ NavigableString):\n                print(tag.name, tag.string)\n           \
    \ else:\n                print(tag.replace('\\n', ''))\n```\n\n上述程序代码有 2 层 for/in\
    \ 循环，第 1 层遍历 children 属性获取子标签的列表生成器，if 条件判断是不是 NavigableString，若不是，即为 <li> 标签。\n\
    \n如果是 <li> 标签，就再次使用 for/in 循环取出下一层文字内容的 NavigableString 和 <span> 子标签的 Tag 对象，if/else\
    \ 条件判断是哪一种，Tag 对象就输出其标签名称和内容，NavigableString 调用 replace() 函数取代“\\n”换行符，避免多输出换行。其运行结果如下所示：\n\
    \n```\nli\n喜欢 -\nspan 40\nli\n普通 -\nspan 20\nli\n不喜欢 -\nspan 0\n```\n\n# 动手学——使用\
    \ descendants 属性获取所有子孙标签：Ch5_5_2c.py\n\nBeautifulSoup 的 children 和 contents 属性只能获取所有直接的子标签，descendants\
    \ 属性可以获取之下的所有子标签和孙标签。例如，获取 <ul> 标签之下的所有 <li> 子标签和 <span> 孙标签，如下所示：\n\n```\ntag_div\
    \ = soup.select(\"#q2\")       # 找到第 2 题\ntag_ul = tag_div[0].ul             #\
    \ 遍历到之下的<ul>\nfor child in tag_ul.descendants:\n```"
