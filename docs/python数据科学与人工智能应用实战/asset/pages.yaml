- pgno: 220
  md: '# # 8.1 Python 数据科学包


    Python 数据科学的相关包有很多，本书第 8～10 章将详细介绍数据科学一些必学的 Python 包。


    # ## 8.1.1 认识 Python 数据科学包


    Python 数据科学包可用来处理、分析和可视化获取的数据，主要包括 NumPy、Pandas 和 Matplotlib 三大包，其简单介绍如下所示。


    +   - NumPy （Numeric Python 或 Numerical Python）包：一套强调高效率数组（Arrays）处理的 Python 数学包，可以进行向量（Vector）和矩阵（Matrix）运算。

    +   - Pandas 包：Python 程序代码版的 Excel 电子表格工具，可以进行数据处理和分析。

    +   - Matplotlib 包：2D 绘图函数库的数据可视化工具，支持各种统计图表的绘制，可以可视化探索数据和输出数据分析结果。


    除了这三大包外，本篇第 11 ～ 12 章还会使用 Scipy 包的统计模块来学习基础统计知识，Scipy 是 Python 数学、科学和工程运算的基础函数库。


    本章介绍 NumPy 包，其提供了一维、二维和多维数组对象与相关延伸对象，并且支持高效率数组的数学、逻辑、维度操作、排序、选取元素，以及基本线性代数与统计等多种数学函数的函数库。


    NumPy 包的核心是 ndarray 对象，这是相同数据类型元素组成的数组。NumPy 数组和 Python 列表的差异如下所示。


    +   - NumPy 数组是固定尺寸，更改 ndarray 对象尺寸就是建立全新数组；Python 列表则是容器，不用指定尺寸。

    +   - NumPy 数组元素的数据类型相同（Python 列表项目可以不同），每一个元素占用相同的内存空间。唯一的例外是对象数组，因为元素是 Python
    或 NumPy 对象，所以元素尺寸可以不同。

    +   - NumPy 数组支持高效率和大量数据的数学运算，可以使用比 Python 列表更少的程序代码来进行高效率的向量和矩阵运算。


    # ## 8.1.2 向量与矩阵


    在说明 NumPy 数组之前，需要先了解数学（Mathematics）的向量与矩阵，其介绍如下所示。


    +   - 向量：向量包括方向值和大小值，常常用来表示速度、加速度和动力等。向量是一系列数值，有多种表示方法，在 NumPy 中使用一维数组（One-dimensional
    Arrays）来表示，如图 8-1 所示。

    +   - 矩阵：矩阵类似于向量，只是形状是二维表格的行（Rows）和列（Columns），需要使用行和列来获取指定元素值。在 NumPy 中使用二维数组（Two-dimensional
    Arrays）方式来表示矩阵，如图 8-2 所示。'
  merge: -1
  img_proc: true
