- pgno: 58
  md: '+   ● 交集: 交集是 2 个集合都存在的相同元素的集合，如图 2-5 所示。


    Python 交集使用 “&” 运算符或 intersection() 函数，如下所示：


    ```

    C = A & B

    ```


    ```

    C = A.intersection(B)

    ```


    上述表达式的结果是集合{4, 5}。


    +   ● 并集：并集是 2 个集合所有元素合并在一起组合的集合（集合中的元素不能重复），如图 2-6 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_58_0.png)


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_58_1.png)


    Python 并集使用 “|” 运算符或 union() 函数，如下所示：


    ```

    C = A | B

    ```


    ```

    C = A.union(B)

    ```


    上述表达式的结果是集合{1, 2, 3, 4, 5, 6, 7, 8}。


    +   ● 差集：差集是 2 个集合 A-B，只存在集合 A，不存在集合 B（B-A 就是只存在集合 B，不存在集合 A）的元素集合，如图 2-7 所示。


    Python 差集使用 “-” 运算符或 difference() 函数，如下所示：


    ```

    C = A - B

    ```


    ```

    C = A.difference(B)

    ```


