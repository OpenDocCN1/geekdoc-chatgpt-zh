  md: '# 6.1.4 切割字符串使其成为列表和合并字符串


    Python 中可以调用 split() 函数将字符串切换成列表；反之，也可以调用 join() 函数将列表以指定的连接字符串合并成一个字符串。


    # 1. 切割字符串使其成为列表：split() 函数


    字符串对象提供相关函数，可以使用分隔字符将字符串内容以分隔字符切割，使字符串成为列表，其说明如表 6-6 所示。


    # 表 6-6 切割字符串函数


    | 切割字符串函数 | 说明 |

    |---|---|

    | split() | 没有参数时使用空格格切割字符串，使其成为列表；也可以指定参数的分隔字符 |

    | splitlines() | 使用换行符 “\n” 切割字符串，使其成为列表 |


    例如，可以调用 split() 函数将一个英文句子的每一个单词切割成列表（Python 程序：Ch6_1_4.py），如下所示：


    ```

    ```python

    str1 = "This is a book."

    list1 = str1.split()

    print(list1)    # [''This'', ''is'', ''a'', ''book.'']

    ```

    ```


    我们也可以指定 split() 函数使用分隔字符 “，” 来切割字符串，使其成为列表，如下所示：


    ```

    ```python

    str2 = "Tom, Bob, Mary, Joe"

    list2 = str2.split(", ")

    print(list2)    # [''Tom'', ''Bob'', ''Mary'', ''Joe'']

    ```

    ```


    如果是从文件读取字符串，因为其中的每一行使用换行符 “\n” 来分隔。除了调用 split("\n") 函数外，也可以直接调用 splitlines() 函数，将字符串切割成列表，如下所示：


    ```

    ```python

    str3 = "23\\n12\\n45\\n56"

    list3 = str3.splitlines()

    print(list3)    # [''23'', ''12'', ''45'', ''56'']

    ```

    ```


    上述字符串内容是使用换行符 “\n” 分隔的数字数据。在切割字符串创建成列表后，可以看到列表项目都是数值字符串，并不是整数。


    # 2. 合并列表使其成为字符串：join() 函数


    Python 字符串的 join() 函数可以将列表的每一个元素使用连接字符串连接成单一字符串（Python 程序：Ch6_1_4a.py），如下所示：


    ```

    ```python

    str1 = "-"

    list1 = [''This'', ''is'', ''a'', ''book.'']

    print(str1.join(list1))    # ''This-is-a-book.''

    ```

    ```'
