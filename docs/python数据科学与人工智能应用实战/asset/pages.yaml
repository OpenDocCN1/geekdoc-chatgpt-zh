    # 2.3 流程控制


    Python 流程控制可以配合条件表达式（Conditional Expressions）的条件来执行不同程序块（Blocks）或重复执行指定区块的程序代码。流程控制主要分为两种，如下所示。


    +   - 条件控制：条件控制是选择题，分为单选（if）、二选一（if/else）或多选一（if/elif/else），依照条件表达式的结果决定执行哪一个程序块的程序代码。

    +   - 循环控制：循环控制是重复执行程序块的程序代码，拥有一个结束条件可以结束循环的执行。


    Python 程序块是程序代码缩排相同数量的空格符，一般使用 4 个空格符。所以，相同缩排的程序代码属于同一个程序块。


