  md: '# 5.5.5 上一个元素和下一个元素


    BeautifulSoup 可以通过剖析 HTML 网页的顺序来进行遍历，使用 next_element 属性遍历下一个元素，这是目前标签对象相邻的下一个对象；使用
    previous_element 属性遍历上一个元素，这是相邻的上一个对象。


    # 动手学——遍历上一个元素和下一个元素：Ch5_5_5.py


    以 Example.html 的 HTML 网页为例来介绍上一个元素和下一个元素的遍历，如下所示：


    ```

    <html lang="big5">

    <head>

    <meta charset="utf-8"/>

    <title>测试数据爬取的 HTML 网页</title>

    </head>

    <body>

    ...

    </body>

    </html>

    ```


    以上述 HTML 标签为例，从 <html> 标签遍历至下一个元素至 <head> 标签，从 <title> 标签遍历至上一个 <meta> 标签，如下所示：


    ```

    tag_html = soup.html      # 找到 <html> 标签

    print(type(tag_html), tag_html.name)

    tag_next = tag_html.next_element.next_element

    print(type(tag_next), tag_next.name)

    tag_title = soup.title      # 找到 <title> 标签

    print(type(tag_title), tag_title.name)

    tag_previous = tag_title.previous_element.previous_element

    print(type(tag_previous), tag_previous.name)

    ```


    上述程序代码首先找到 <html> 标签，使用 next_element 属性遍历下一个元素，共使用 2 次，因为其有多个 NavigableString
    对象，可以遍历到下一个 <head> 标签；然后找到 <title> 标签，使用 2 次 previous_element 属性遍历上一个元素至 <meta>
    标签。其运行结果如下所示：


    ```

    <class ''bs4.element.Tag''> html

    <class ''bs4.element.Tag''> head

    <class ''bs4.element.Tag''> title

    <class ''bs4.element.Tag''> meta

    ```'
