  md: '# 6.1 Python 字符串处理


    数据清理（Clean the Data）（也称为数据清洗）的主要工作是处理从网络获取的数据，因为这些数据都是字符串数据，所以需要使用 Python 字符串函数来处理获取的数据。


    # 6.1.1 创建字符串


    Python 字符串（Strings）是使用单引号 ‘’ 或双引号 “” 括起的一系列 Unicode 字符，这是一种不允许修改（Immutable）内容的数据类型，所有字符串的修改实际上都是创建了一个全新的字符串。


    # 动手学——创建 Python 字符串： Ch6_1_1.py


    可以指定变量值是一个字符串，如下所示：


    ```

    str1 = "学习 Python 语言程序设计"

    str2 = ''Hello World!''

    ch1 = "A"

    ```


    上述程序代码中，前 2 行是创建字符串，最后 1 行是创建字符（只有 1 个字符的字符串就是字符）。也可以使用对象方式创建字符串，如下所示：


    ```

    name1 = str()

    name2 = str("陈会安")

    ```


    上述程序代码中，第 1 行是创建空字符串，第 2 行是创建内容为“陈会安”的字符串对象。在创建字符串后，可以调用 print() 函数输出字符串变量，如下所示：


    ```

    print(str1)

    print(str2)

    ```


    在 print() 函数中也可以使用字符串连接表达式来输出字符串变量，因为是字符串变量，所以并不需要调用 str() 函数将其转换成字符串类型，如下所示：


    ```

    print("ch1 = " + ch1)

    print("name1 = " + name1)

    print("name2 = " + name2)

    ```


    # 动手学——访问 Python 字符串中的每一个字符： Ch6_1_1a.py


    字符串是一系列的 Unicode 字符，可以使用 for 循环来访问输出每一个字符，其正式的说法是迭代（Iteration），如下所示：


    ```

    str3 = ''Hello''

    ```'
