    # 11.4 统计的基础


    统计（Statistics）是一门收集、组织、展示、分析和解释数据的科学，可以让我们了解数据，并利用这些数据来做出更有效率的决策。


    # 11.4.1 认识统计


    统计就是分析数据，了解数据特征和趋势的方法，即让数据说话。需要适当地使用统计来组织、评估、分析这些数据，以便让这些数据的意义呈现出来。


    实际上，统计就是从理解调查的数据 [称为样本（Sample）] 开始，然后使用这些样本以概率理论来推理和理解尚未调查的数据，如同从冰山一角推论了解整座冰山的形状，如图
    11-9 所示。


    如图 11-9 所示，我们看到的部分只是浮出海面的一小部分，这也是可以观察的部分。冰山大部分位于海面下，我们在海面上看到的是样本，样本和海面下的整座冰山是总体（Population），其说明如下所示。


    +   * 总体：也称为母体，包含已经调查和没有调查的全部数据，即拥有共同特征的个体、物体或测量值的全部集合。

    +   * 样本：已经调查的数据，属于总体（母体）的一部分。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_331_0.png)


    # 11.4.2 统计的分类


    传统统计可以分成两大类：描述统计（Descriptive Statistics）和推断统计（Inferential Statistics），如图 11-10
    所示。'
