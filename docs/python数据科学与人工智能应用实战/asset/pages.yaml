  md: "图 6-3 使用 Chrome 开发人员工具搜索 <table> 表格标签，可以看到 class 属性值是 dataintable。接着，创建 Python\
    \ 程序，搜索 HTML 网页获取表格数据，并将其存入 CSV 文件，如下所示：\n\n```\nimport requests\nfrom bs4 import\
    \ BeautifulSoup\nimport csv\n\nurl = \"https://www.w3schools.com.cn/html/html_media.asp\"\
    \ncsvfile = \"VideoFormat.csv\"\nr = requests.get(url)\nr.encoding = \"utf-8\"\
    \nsoup = BeautifulSoup(r.text, \"lxml\")\ntag_table = soup.find(class_=\"dataintable\"\
    )    # 搜索 <table> 标签\nrows = tag_table.findAll(\"tr\")    # 搜索所有 <tr> 标签\n```\n\
    \n上述程序代码导入相关模块后，调用 BeautifulSoup 对象的 dataintable find() 函数搜索第 1 个 <table> 标签，然后调用\
    \ findAll() 函数搜索表格的所有 <tr> 标签。接着打开 CSV 文件准备写入获取的数据，如下所示：\n\n```\nwith open(csvfile,\
    \ 'w+', newline='', encoding=\"utf-8\") as fp:\n    writer = csv.writer(fp)\n\
    \    for row in rows:\n        rowList = []\n        for cell in row.findAll([\"\
    td\", \"th\"]):\n            rowList.append(cell.get_text().replace(\"\\n\", \"\
    \").replace(\"\\r\", \"\"))\n        writer.writerow(rowList)\n```\n\n上述程序代码调用\
    \ open() 函数指定编码是 utf-8，row 列表变量是所有 <tr> 标签的表格行，第 1 层 for/in 循环取出每一行，第 2 层 for/in\
    \ 循环取出每一个单元格。\n\n在内层 for/in 循环的 findAll() 函数可以搜索此行的所有 <td> 和 <th> 标签，这里调用 append()\
    \ 函数将 get_text() 函数获取的标签内容新增至列表，调用 replace() 函数删除 \"\\n\" 和 \"\\r\" 字符，最后调用 writerow()\
    \ 函数写入每一行数据至 CSV 文件 VideoFormat.csv。\n\nPython 程序的运行结果可以创建 VideoFormat.csv 文件。用\
    \ Excel 打开文件内容如图 6-4 所示。\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_175_0.png)"
