    复回归（Multiple Regression）是第 15.2.2 节简单线性回归的扩充，预测模型的线性方程不只有 1 个解释变量 X，而是有多个解释变量
    X₁、X₂ 等。


    # ## 15.3.1 线性复回归


    第 15.2.2 节的简单线性回归研究的是“1 因 1 果”的问题：线性复回归（Multiple Linear Regression）研究的是一个反应变量
    y 和多个解释变量 X₁、X₂、⋯、X_k 的关系，即“多因 1 果”的问题。


    Python 程序只需将原来解释变量的 DataFrame 对象 X 从 1 字段扩充成多字段，每一个字段是一个解释变量，即可使用和第 15.2.2 节相同的方式来建立复回归方程。


