- pgno: 170
  md: "# # 动手学——处理 URL 网址：Ch6_2_1c.py\n\n从网页内容获取的 URL 网址格式可能因为相对或绝对路径而有不一致的格式，此时可以创建函数来整理\
    \ URL 网址，使其格式一致。首先是基底 URL 网址和测试的网址列表，如下所示：\n\n```\n```python\nbaseUrl = \"http://example.com\"\
    \nlist1 = [\"http://www.example.com/test\", \"http://example.com/word\",\n   \
    \     \"media/ex.jpg\", \"http://www.example.com/index.html\"]\n\ndef getUrl(baseUrl,\
    \ source):\n    if source.startswith(\"http://www.\"):\n        url = \"http://\"\
    \ + source[11:]\n    elif source.startswith(\"http://\"):\n        url = source\n\
    \    elif source.startswith(\"www\"):\n        url = source[4:]\n        url =\
    \ \"http://\" + source\n    else:\n        url = baseUrl + \"/\" + source\n\n\
    \    if baseUrl not in url:\n        return None\n\n    return url\n```\n```\n\
    \n上述程序代码调用 getUrl() 函数使用 if/elif/else 多选一条件判断 URL 网址的开头是什么，即可处理成格式一致的 URL 网址。使用\
    \ for/in 循环测试列表的 URL 网址，如下所示：\n\n```\n```python\nfor item in list1:\n    print(getUrl(baseUrl,\
    \ item))\n```\n```\n\n上述程序代码调用 getUrl() 函数，第 1 个参数是基底 URL 网址，第 2 个参数是可以测试不一致的\
    \ URL 网址。其运行结果如下所示：\n\n```\nhttp://example.com/test\nhttp://example.com/word\n\
    http://example.com/media/ex.jpg\nhttp://example.com/index.html\n```\n\n# ## 6.2.2\
    \ 使用正则表达式处理文字内容\n\nPython 正则表达式 re 模块可以调用 sub() 函数取代符合模板字符串的子字符串成为其他字符串，一样可以使用正则表达式来处理网页获取的文字内容。"
  merge: -1
  img_proc: true
- pgno: 171
  md: "# 动手学——删除不需要的字符：Ch6_2_2.py\n\n类似第 6.2.1 节的字符串处理，可以使用 re 模块调用 sub() 函数来删除不需要的\
    \ “\\n” 和多余的空格符，如下所示：\n\n```\nimport re\n\nstr1 = \" Python, is a, \\nprogramming,\
    \ \\n\\nlanguage.\\n\\r \"\n\nlist1 = str1.split(\",\")\nfor item in list1:\n\
    \    item = re.sub(r\"\\n+\", \"\", item)\n    item = re.sub(r\" +\", \" \", item)\n\
    \    item = item.strip()\n    print(\"'\" + item + \"'\")\n```\n\n上述程序代码中，str1\
    \ 字符串是测试字符串，当调用 split() 函数将其分割成列表后，调用 2 次 sub() 函数删除不需要的字符，第 1 次是删除 1 至多个 “\\\
    n” 字符，第 2 次是删除多余的空格符，但会保留 1 个，最后的 strip() 函数可以删除前后的空格符。其运行结果如下所示：\n\n```\n'Python'\n\
    'is a'\n'programming'\n'language.'\n```\n\n# 动手学——处理电话号码字符串：Ch6_2_2a.py\n\n对于一些固定格式的数据，如金额或电话号码，可以调用\
    \ re 模块的 sub() 函数来进行处理，如下所示：\n\n```\nimport re\n\nphone = \"0938-111-4567 # Phone\
    \ Number\"\n\nnum = re.sub(r\"#.*$\", \"\", phone)\nprint(num)\n\nnum = re.sub(r\"\
    \\D\", \"\", phone)\nprint(num)\n```\n\n上述电话号码中有 “-” 字符，之后是类似 Python 的注释文字，第 1\
    \ 次的 sub() 函数删除之后的注释文字符号“#”，第 2 次的 sub() 函数删除所有非数字的字符。其运行结果如下所示：\n\n```\n0938-111-4567\n\
    09381114567\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "# 动手学——处理路径字符串：Ch6_2_2b.py\n\n同样的技巧，可以调用 re 模块的 sub() 函数来处理路径字符串，如下所示：\n\n\
    ```\nimport re\n\nlist1 = [\"\", \"/\", \"path/\", \"/path\", \"/path/\", \"//path/\"\
    , \"/path//\"]\n\ndef getPath(path):\n    if path:\n        if path[0] != \"/\"\
    :\n            path = \"/\" + path\n        if path[-1] != \"/\":\n          \
    \  path = path + \"/\"\n        path = re.sub(r\"/{2, }\", \"/\", path)\n    else:\n\
    \        path = \"/\"\n    return path\n\nfor item in list1:\n    item = getPath(item)\n\
    \    print(item)\n```\n\n上述程序代码调用 getPath() 函数使用嵌套 if/else 条件判断路径前后的 “/” 字符，以便决定是否需要补上\
    \ “/” 字符；调用 sub() 函数可以删除多余的 “/” 字符。其运行结果如下所示：\n\n```\n/\n/\n/path/\n/path/\n/path/\n\
    /path/\n/path/\n```\n\n# 6.3 保存为文件\n\n在成功从 HTML 网页抓取出所需数据后，可以将整理好的数据保存为文件，常用的文件格式有\
    \ CSV 和 JSON。如果需要网络中的图片，同样可以从 Web 网站下载这些图片。"
