- pgno: 85
  md: '# 表 3-10 HTML 基本窗体标签及说明


    | 标签 | 事件处理 | 说明 |

    | :--- | :--- | :--- |

    | `<input type=...>` | onchange | 文字输入或选择字段，type 属性值决定字段种类，其中 radio 是单选按钮，checkbox
    是复选框，button 是按钮，text 是文本框，type 属性值 hidden 是隐藏域，没有事件处理 |

    | `<input type="submit|reset">` | onclick | 按钮字段，可以提交窗体重或重设字段值 |

    | `<select>` | onchange | 下拉列表字段，包括 `<option>` 标签的选项。其中，size 属性值为 1，表示下拉菜单；大于
    1，表示列表框 |

    | `<option>` | N/A | 下拉列表字段的选项 |

    | `<textarea>` | onchange | 多行文本框字段 |

    | `<label>` | N/A | 搭配指定字段的标题文字，可以使用 for 属性指定所属的字段元素 |

    | `<button type=...>` | onclick | 按钮字段，type 属性值可以是 button、submit 和 reset |


    表 3-10 中的 `<button>` 和 `<input>` 标签都可以建立按钮，其主要差异是 `<button>` 标签可以建立图片按钮。HTML 窗体就是表
    3-10 中标签的组合，其基本结构如下所示：


    ```

    <form id="name" name="name" method="post | get"

    action="URL">

    <input type=...>

    <textarea> ... </textarea>

    <select>

    <option> ... </option>

    </select>

    <input type="submit" ...>

    </form>

    ```


    上述 `<form>` 标签中包括 `<input>` `<textarea>` `<select>` 字段标签的窗体，在 `<select>` 标签中有
    `<option>` 标签的选项。`<form>` 标签的相关属性说明如表 3-11 所示。


    # 表 3-11 <form> 标签的相关属性说明


    | 属性 | 说明 |

    | :--- | :--- |

    | id/name | 窗体 id 和名称 |

    | method | 数据传送到服务器端的方法，其中 get 使用 URL 网址的参数来传递数据，post 使用 HTTP 通信协议的标头数据传递数据 |

    | action | 服务器端执行的窗体处理程序，如 ASP、ASP.NET、PHP 或 JSP 等程序的 URL 网址，或 MVC 路由 |'
