    # 动手学——使用位置选择数据: Ch9_3_1c.py


    事实上，DataFrame 对象的 loc 索引器是使用标签索引来选择数据，iloc 索引器是使用位置索引，其操作方式是切割运算符，如下所示：


    ```

    print(df.iloc[3])   # 第 4 项记录

    ```


    ```

    print(df.iloc[3:5, 1:3])   # 切割

    ```


    上述程序代码中，第 1 行是索引值为 3 的第 4 项记录 [图 9-17（a）]，第 2 行是第 4～5 项记录（索引 3 和 4）的 name 和 population
    字段 [图 9-17（b）]。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_270_0.png)


    也可以切割 DataFrame 对象的行或列，即选择指定范围的行和列，如下所示：


    ```

    print(df.iloc[1:3, :])   # 切割行

    ```


    ```

    print(df.iloc[:, 1:3])   # 切割列

    ```


    上述程序代码中，第 1 行是第 2 项和第 3 项记录，在 “,” 后的 “:” 前后没有索引值，表示全部字段 [图 9-18（a）]；第 2 行在 “,”
    前的 “:” 前后没有索引值，表示全部记录，之后是 name 和 population 两个字段，可以获取这 2 个字段的所有记录 [图 9-18（b）]。


    一样可以分别使用行和列的索引引列表，从 DataFrame 对象选择所需的数据，如下所示：


    ```

    print(df.iloc[[1, 2, 4], [0, 2]])   # 索引列表

    ```


    上述程序代码是第 2、3、5 项记录的 city 和 population 字段，其运行结果如图 9-19 所示。同样的方式，可以使用 iloc 或 iat
    索引器选择标量值，如下所示：


    ```

    print(df.iloc[1, 1])

    ```


    ```

    print(df.iat[1, 1])

    ```'
