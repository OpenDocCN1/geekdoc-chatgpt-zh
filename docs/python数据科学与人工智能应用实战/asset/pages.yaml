    # 12.4.3 区间估计的基础


    点估计是数值预测，当样本数越大时，估计的效果越好，但是仍然有可能会非常不准。区间估计是一种比较保险的做法，推论的总体是一个包含信赖度的区间范围。


    # 1. 信赖系数与信赖区间


    当使用点估计预测“男性身高的平均数是 170 cm” 后，如果换成区间估计，其结果是“男性身高有 95% 的概率是在 161～179 cm”，95% 的概率是信赖系数（Confidence
    Coefficient）或称为信赖水平，161～179 cm 的范围称为信赖区间（Confidence Intervals），信赖区间的两端值 161 和
    179 称为信赖界限（Confidence Limit），如图 12-10 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_361_0.png)


    图 12-10


    上述信赖系数是 95%，表示准确度是 95%；剩下的 5% 会不准，称为显著水平（Significance Level）。实际上，如果信赖系数越高，信赖区间就越大；反之，如果降低信赖系数，信赖区间就会变小。


    # 2. 区间估计的基本步骤


    区间估计无论使用哪一种分布、平均数或比例，其基本步骤都是相同的，如下所示。


    +   Step1 决定信赖系数：需要确认允许不准的错误概率有多少，称为 α，通常取 0.05，即 95%信赖系数。


    +   Step2 查询 Z 分布表：在决定信赖系数后，传统做法是查分布表（Python可以使用 scipy.stats 包）。以 α = 0.05（95%）为例，因为正态分布是对称的两边，所以除以2，α/2=0.025，可以查出Z分数是±1.96，即第12.2.1节的正态分布特性，位于
    μ± 1.96σ区间。


    +   Step3 建立信赖区间：随机抽取样本数 n 的样本，然后从样本推论出总体平均数 μ 的信赖范围，其公式如下所示：'
