- pgno: 173
  md: "# 6.3.1 保存为 CSV 文件\n\nCSV 文件的内容是用纯文本方式表示的表格数据，这是一个文本文件，其中每一行表示表格的一行，每一个字段使用“,”逗号来分隔。例如，现在有一个表格数据，如表\
    \ 6-7 所示，现将其转换成 CSV 数据。\n\n# 表 6-7 表格信息\n\n| Data1 | Data2 | Data3 |\n|---|---|---|\n\
    | 10 | 33 | 45 |\n| 5 | 25 | 56 |\n\n将表 6-7 中的数据转换成 CSV 数据，如下所示：\n\n```\nData1,\
    \ Data2, Data3\n10, 33, 45\n5, 25, 56\n```\n\n上述 CSV 数据的每一行最后由换行符 “\\n” 来换行，每一个字段使用逗号\
    \ “,” 来分隔。可以直接使用 Excel 打开 CSV 文件。\n\n# 动手学——读取 CSV 文件：Ch6_3_1.py\n\nPython 程序使用\
    \ csv 模块读取 CSV 文件。例如，读取 Example.csv 文件的内容（表 6-7 中的数据），如下所示：\n\n```\nimport csv\n\
    csvfile = \"Example.csv\"\nwith open(csvfile, 'r') as fp:\n    reader = csv.reader(fp)\n\
    \    for row in reader:\n        print(','.join(row))\n```\n\n上述程序代码导入 csv 模块后，调用\
    \ open() 函数打开文件，然后调用 csv.reader() 函数读取文件内容，for/in 循环读取每一行数据，调用 join() 函数创建以逗号\
    \ “,” 分隔的字符串。其运行结果如下所示：\n\n```\nData1, Data2, Data3\n10, 33, 45\n5, 25, 56\n```\n\
    \n# 动手学——写入数据到 CSV 文件：Ch6_3_1a.py\n\n除了读取 CSV 文件的数据外，也可以将 CSV 数据的列表写入 CSV 文件。例如，将\
    \ CSV 列表写入 Example2.csv 文件，如下所示："
  merge: -1
  img_proc: true
