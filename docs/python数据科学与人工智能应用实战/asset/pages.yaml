- pgno: 169
  md: "# 动手学——删除不需要的字符：Ch6_2_1a.py\n\n因为从网页获取的字符串数据常常有一些不需要的字符，所以可以调用 replace() 函数删除这些字符（如“\\\
    n”和“\\r”）和调用 strip() 函数删除前后的空格符，如下所示：\n\n```\nstr1 = \" Python is a \\nprogramming\
    \ language.\\n\\r \"\nstr2 = str1.replace(\"\\n\", \"\").replace(\"\\r\", \"\"\
    )\nprint(\"\" + str2 + \"\")\nprint(\"\" + str2.strip() + \"\")\n```\n\n上述程序代码的\
    \ str1 字符串前后有空格符，内含“\\n”和“\\r”字符，首先调用 replace() 函数将第 1 个符号字符取代成第 2 个空字符串，即删除这些字符，然后调用\
    \ strip() 函数删除前后空格符。其运行结果如下所示：\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_169_0.png)\n\
    \nreplace(\"\",\"\") 函数会删除所有空格符，如果想删除过多的空格符，只保留一个，则需要使用第 6.2.2 节的正则表达式来处理。\n\n\
    # 动手学——删除标点符号字符：Ch6_2_1b.py\n\n如果想删除字符串中多余的标点符号字符，可以使用 string.punctuation 获取所有标点符号字符，然后调用\
    \ strip() 函数将其删除，如下所示：\n\n```\nimport string\n\nstr1 = \"#$%^Python -is- *a* $%programming\
    \ _ language.$\"\n\nprint(string.punctuation)\nlist1 = str1.split(\" \")\nfor\
    \ item in list1:\n    print(item.strip(string.punctuation))\n```\n\n上述程序代码导入 string\
    \ 模块，因为字符串变量 str1 中有很多标点符号，所以首先调用 split()函数以空格符分隔字符串，然后一一删除各项目中的标点符号字符。其运行结果如下所示：\n\
    \n![](img/26e9944e14d74e7e03dda869acb3f1a8_169_1.png)"
  merge: -1
