    # 3.2.4 HTML 列表


    HTML 列表有很多种，列表是一种文档编排，可以将文档内容的重点纲要一一列出。本节介绍常用的项目编号（Ordered List）、项目符号（Unordered
    List）和定义列表（Definition List）。


    # 1. 项目编号


    HTML 列表中可以使用有顺序的项目编号，如下所示：


    ```

    <ol>

    <li>项目 1</li>

    <li>项目 2</li>

    ...

    </ol>

    ```


    上述 <ol> 标签建立项目编号，每一个项目都是一个 <li> 标签。<ol> 标签的属性如表 3-4 所示。


    # 表 3-4 <ol> 标签的属性及说明


    | 属性 | 说明 |

    | :--- | :--- |

    | start | 指定项目编号的开始，HTML 4.x 不支持此属性 |

    | type | 指定项目编号是数字、英文等，如 1、A、a、I、i，HTML 4.x 不支持此属性 |

    | reversed | HTML 5 新增属性，指定项目编号是反向由大至小 |'
