  md: '# 10.1.4 输出图例


    如果同一张图表有多个数据集，则会绘制多条线，此时需要输出图例（Legend）来标示每一条线属于哪一个数据集。


    # 1. 输出图表的图例：Ch10_1_4.py


    在图表输出图例，可以标示 2 条线分别是 sin(x) 函数和 cos(x) 函数，如下所示：


    ```

    x = np.linspace(0, 10, 50)

    sinus = np.sin(x)

    cosinus = np.cos(x)

    plt.plot(x, sinus, "r-o", label="sin(x)")

    plt.plot(x, cosinus, "g--", label="cos(x)")

    plt.legend()

    plt.xlabel("Rads")

    plt.ylabel("Amplitude")

    plt.title("Sin and Cos Waves")

    plt.show()

    ```


    上述程序代码建立 2 个数据集的图表，并且调用 2 个 plot() 函数分别绘制 2 条线（因为参数很多，建议每一条线调用 1 个 plot() 函数来绘制），然后在
    plot() 函数中使用 label 参数指定每一条线的标签说明。


    现在，可以调用 legend() 函数输出图例，可以输出标签说明、线条外观和色彩的图例。其运行结果如图 10-9 所示。


