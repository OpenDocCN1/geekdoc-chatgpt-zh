    \ 种形态（源于统计学）：质的数据（Qualitative Data）与量的数据（Quantitative Data）。\n\n# 1. 质的数据\n\n\
    质的数据是使用文字描述性质、顺序和分类的文字型数据，无法量化，即质的数据无法使用数值和基本数学运算来呈现。\n\n> 虽然质的数据可以是数值数据，但是这些数值数据本身并没有数值的性质，只是一个符号。例如，使用\
    \ 1 代表男性，2 代表女性。\n\n# 2. 量的数据\n\n量的数据是观察结果的数值数据，可以使用数值和基本数学运算来呈现。量的数据可以分为 2 种，如下所示。\n\
