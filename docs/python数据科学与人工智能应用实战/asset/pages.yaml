  md: '# # 12.4 估计


    在了解抽样分布和中心极限定理后，就可以根据样本计算出统计量，然后进一步推估出总体的参数，这就是估计（Estimate）。


    # ## 12.4.1 认识估计


    估计即推测总体的性质。例如，从样本平均数推测出总体平均数，或从样本比例推测出总体比例。例如，从样本的客家人比例推测全国的客家人比例等。


    # ### 1. 估计的种类


    估计可以分为两种，如下所示。


    +   - 点估计（Point Estimate）：根据从样本得到的统计量来估计参数。例如，男性身高的总体平均数是 170 cm，民意调查结果全部选民有 45%
    会投给 1 号候选人。


    +   - 区间估计（Interval Estimate）：对于统计来说，区间是指一个范围值，如平均数落在 10 ~ 100 之间。换句话说，区间估计是一个范围，这个范围称为信赖区间（Confidence
    Intervals），而点估计是单一值。例如，男性身高的总体平均数是 161 ~ 179 cm，39%~48% 的选民会投给 1 号候选人。


    # ### 2. 估计使用的估计量


    无论采用点估计还是区间估计，都是从样本统计量来推算参数的估计量（Estimators）。至于样本的哪一些统计量是可以使用的好估计量，需要满足以下 3 大特性。


    +   - 不偏性（Unbiased）：不偏性估计量是指样本统计量和总体相等，没有误差，所以不偏。目前知道有样本平均数满足不偏性，样本比例也满足。


    +   - 有效性（Efficiency）：估计量的标准差要最小，即所有样本的估计量集中在抽样分布的参数平均量附近。


    +   - 一致性（Consistency）：样本数 n 越大时，估计量会越接近参数，即当样本数大时，估计量与参数的差异会减少。


    # ## 12.4.2 点估计


    点估计估计的是总体的参数，使用的是样本数据的统计量。即只需计算出样本的平均数和标准差等统计量，就可以使用点估计来推算出总体的参数。


    # ### 1. 样本平均数的点估计


    样本平均数的点估计是以样本平均数来推算总体的平均数。例如，使用掷骰子（每次掷 100 次计算平均）建立正态分布的总体 10000，然后随机抽样来计算样本平均（Python
    程序：Ch12_4_2.py），如下所示：'
