    # 13.4 数据预处理与探索性数据分析


    数据科学的探索阶段是整理、归纳和描述数据，其主要工作是数据预处理（Data Preprocessing）和探索性数据分析（Exploratory Data
    Analysis，EDA），如下所示。


    +   数据预处理：源于数据挖掘技术，其主要目的是将取得的原始数据转换成可阅读的数据格式，因为真实世界的数据常常有不完整、错误和不一致的情况，数据预处理就是在处理这些问题。实际上，数据预处理的操作非常多，常用的操作有处理遗漏值、处理分类数据和特征缩放与标准化等。


    +   探索性数据分析：探索性数据分析是一种数据分析的步骤和观念，可以使用各种不同的技巧，大部分是使用图表方式来深入了解数据本身，找出数据底层的结构，从数据中取出重要的变量，侦测异常值（Outlier），并且找出数据趋势的线索，提出假设（Hypotheses）。例如，解释为什么此群组客户的业绩会下滑，目标客户不符合年龄层造成产品销售不佳等。


    实际上，当取得一份全新的数据集后，无论是否已经熟悉这些数据，都可以使用下列问题的指引来帮助进行数据探索，其包含数据预处理的清理、转换和探索性数据分析，如下所示。


    +   是不是有组织的数据？数据是不是行/列结构的结构化数据？如果是非结构化数据或半结构化数据，则需要将数据转换成类似电子表格行/列结构的结构化数据，以 Python
    语言来说，就是建立 Pandas 包的 DataFrame 对象。


    +   数据的每一行代表什么？在成功转换成结构化数据的数据集后，就可以开始了解这个数据集。第一步是了解每一行数据是什么，即每一项记录是什么样的数据。


    +   数据的每一列代表什么？在了解每一项记录后，可以开始了解每一个字段是什么、字段值是哪一种尺度的数据、字段值是质的数据还是量的数据。


    +   是否有遗漏值？如果数据集有遗漏值，则需要了解哪些字段有遗漏值、遗漏值数据有多少项，以及如何处理这些遗漏值，是直接删除数据还是改为平均值、中位数或随机值等。


    +   是否需要进行字段数据转换？当知道字段是哪一种尺度的数据后，需要判断字段数据是否需要进行转换。例如，分类数据是否需转换成数值数据；当单位差异太大时，是否需要标准化数据或正规化数据。'
