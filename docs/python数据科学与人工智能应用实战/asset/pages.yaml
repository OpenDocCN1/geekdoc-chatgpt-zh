    +   - 在取得上一个月蛋糕店营收的样本数据后，可以取得数据特征：蛋糕店平均一天可以卖 15 个蛋糕。


    # 2. 推断统计


    推断统计是从数据中分析数据的趋势，可以从部分数据的样本推论出全部情形，即总体。简单地说，推断统计就是从样本数据推论总体特征的统计，其基础就是概率，如下所示。


    +   - 针对手摇饮料店数年每周日的营收，可以预测下一个周日可以卖出 80~120 杯饮料。

    +   - 针对蛋糕店的每日营收，可以预测明天有 95% 的概率可以卖出 20 个蛋糕。


    # 11.5 集中量数与离散量数


