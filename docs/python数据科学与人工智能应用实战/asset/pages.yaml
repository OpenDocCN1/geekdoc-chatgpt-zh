    # 5.4 使用正则表达式搜索 HTML 网页


    BeautifulSoup 对象的 find() 函数和 find_all() 函数可以使用正则表达式来搜索 HTML 网页，特别是用来搜索 HTML 网页中没有位于标签中的文字内容。


    # 5.4.1 认识正则表达式


    正则表达式是一个模板字符串，可以用来进行字符串比对。在正则表达式的模板字符串中，每一个字符都拥有特殊意义，这是一种小型的字符串比对语言。'
