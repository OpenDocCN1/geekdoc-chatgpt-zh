    HTML 标签有很多共同属性，常用共同属性及说明如表 3-1 所示。


    # ### 表 3-1 HTML 标签常用共同属性及说明


    | 属性 | 说明 |

    |---|---|

    | id | 指定 HTML 元素唯一的识别名称。在整页 HTML 网页中，名称必须唯一，不能重复 |

    | accesskey | 指定元素的快捷键来取得焦点 |

    | class | 指定元素套用的样式类别 |

    | dir | 指定元素内内容的文字方向是从左至右或从右至左，其值可以是 ltr、rtl 或 auto |

    | lang | 指定 HTML 元素使用的语言 |

    | style | 指定 HTML 元素套用的 CSS 样式，CSS 是格式化 HTML 标签显示的样式码 |

    | tabindex | 指定按 Tab 键移动元素取得焦点的顺序 |

    | title | 指定 HTML 元素的额外信息 |


    # ### 3.1.4 <head> 标签


    <head> 标签是 <html> 标签的子标签，是一个容器元素，可以包含 <title> <meta> <script> 和 <style> 等标签，如表
    3-2 所示。


    # ### 表 3-2 <head>标签及说明


    | 标签 | 说明 |

    |---|---|

    | <title> | 显示浏览器窗口上方标题栏或标签页的标题文字 |

    | <meta> | 提供 HTML 网页的 metadata 数据，如网页描述、关键词、作者和最近修改日期等信息 |

    | <script> | 此标签的内容是客户端的脚本程序代码。例如，JavaScript。HTML 4.0 需要指定 type 属性，而 HTML 5 版可有可无
    |

    | <style> | 定义 HTML 网页套用的 CSS 样式 |

    | <link> | 连接外部资源的文档，主要是连接 CSS 样式表单文档 |


    表 3-2 中，<meta> 标签可以使用 charset 属性指定网页编码，如下所示：


    ```

    <meta charset="utf-8">

