  md: "# ## 5.5.4 向左右进行兄弟遍历\n\nBeautifulSoup 可以使用属性和函数来向左右进行兄弟遍历，即遍历同一层的上一个兄弟标签或下一个兄弟标签。\n\
    \n# ### 动手学——遍历下一个兄弟标签：Ch5_5_4.py\n\n可以使用 `next_sibling` 属性和 `find_next_sibling()`\
    \ 函数遍历下一个兄弟标签，如下所示：\n\n```\n```python\ntag_div = soup.select(\"#q2\")      # 找到第\
    \ 2 题\nfirst_li = tag_div[0].ul.li         # 第 1 个 <li>\nprint(first_li)\n# 使用\
    \ next_sibling 属性获取下一个兄弟标签\nsecond_li = first_li.next_sibling.next_sibling\nprint(second_li)\n\
    ```\n```\n\n上述程序代码首先找到第 2 题的 `<ul>` 标签，然后使用 2 次 `next_sibling` 属性遍历下一个兄弟标签，因为有多个\
    \ NavigableString 对象。\n\n调用 `find_next_sibling()` 函数遍历下一个兄弟标签（只需调用 1 次，因为此函数会自动跳过\
    \ NavigableString 对象），如下所示：\n\n```\n```python\n# 调用 next_sibling() 函数获取下一个兄弟标签\n\
    third_li = second_li.find_next_sibling()\nprint(third_li)\nprint(\"-----------------------------------\"\
    )\n# 调用 next_siblings() 函数获取所有兄弟标签\nfor tag in first_li.find_next_siblings():\n\
    \    print(tag.name, tag.span.string)\n```\n```\n\n上述程序代码最后调用 `find_next_siblings()`\
    \ 函数获取第 1 个 `<li>` 标签之后的所有兄弟标签，可以使用 for/in 循环输出标签名称和 `<span>` 子标签的内容。其运行结果如下所示：\n\
    \n```\n```html\n<li class=\"response\">喜欢 -\n    <span class=\"score\">40</span></li>\n\
    <li class=\"response\">普通 -\n    <span class=\"score selected\">20</span></li>\n\
    <li class=\"response\">不喜欢 -\n    <span class=\"score\">0</span></li>\n-----------------------------------\n\
    li 20\nli 0\n```\n```\n\n上述运行结果首先输出第 1 个 `<li>`；使用属性遍历下一个兄弟标签，即第 2 个 `<li>` 标签；接着调用函数遍历下一个兄弟标签，即第\
    \ 3 个 `<li>` 标签；最后输出第 1 个 `<li>` 标签之"
