- pgno: 407
  md: '+   基因程序设计（Genetic Programming, GP）：一种能够找出优化结果的程序技术，使用基因组合、突变和自然选择的进化方式，从输入数据的可能组合经过如同基因般的进化后，找出最佳的输出结果。例如，超市找出最佳的商品上架排列方式，以提升超市的业绩。


    # 14.2 机器学习


    机器学习应用统计学习技术（Statistical Learning Techniques）自动找出数据中隐藏的规则和关联性，建立预测模型来准确地进行预测。


    # 14.2.1 机器学习简介


    机器学习就是从过往数据和经验中自我学习并找出其运行的规则，以达到人工智能的方法。事实上，机器学习就是目前人工智能发展的核心研究领域之一。


    +   1. 认识机器学习


    机器学习是一种人工智能，也是一种数据科学的技术，可以让计算机使用现有数据进行训练和学习，以便建立预测模型。当成功建立模型后，我们就可以使用此模型来预测未来的行为、结果和趋势，如图
    14-3 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_407_0.png)


    图 14-3


    图 14-3 中的核心概念是数据处理、训练和最优化，属于数据科学领域的分支。通过机器学习的帮助，我们可以处理常见的分类和回归问题（属于监督式学习，详见第 14.3.1
    节的介绍），如下所示。


    +   - 分类问题：将输入数据区分成不同类别。例如，垃圾邮件过滤可以区分哪些是垃圾邮件，哪些不是。

    +   - 回归问题：从输入数据找出规律，并且使用统计的回归分析来建立对应的方程，以便做出准确的预测。例如，预测假日的饮料销售量等。


    > 机器学习是通过数据来训练机器可以自行辨识出运作模式，这不是一些写死在程序代码的规则。事实上，机器学习也是一种弱人工智能，可以从数据得到复杂的函数或方程来学习建立出算法的规则，然后通过预测模型对未来进行预测。'
  merge: -1
