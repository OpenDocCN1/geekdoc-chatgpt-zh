    # 14.4 深度学习


    深度学习是机器学习的分支，其使用的算法是模仿人类大脑功能的类神经网络（Artificial Neural Networks，ANNS）。以机器学习的分类来说，深度学习是一种能够自我学习的非监督式（如样式分析）或监督式（如分类）机器学习。


    # 1. 认识深度学习


    深度学习的定义很简单：一种实现机器学习的技术。所以，深度学习就是一种机器学习。深度学习的目的就是训练机器的直觉（注意：这是直觉训练，并非知识的学习）。例如，人脸辨识的深度学习，为了进行深度学习，需要使用大量现成的人脸数据，如果机器训练的数据比你一辈子看过的人脸还多很多，那么深度学习训练出来的机器当然经验丰富，在人脸辨识的准确度上一定比你还强。


    实际上，大部分深度学习方法是使用模仿人类大脑神经元传输的神经网络架构（Neural Network Architectures），在深度学习中使用的神经网络称为深度神经网络（Deep
    Neural Networks，DNNs），这是因为传统神经网络的隐藏层（Hidden Layers）只有 2～3 层，深度学习的隐藏层有很多层，很深（Deep），可以高达
    150 层隐藏层。


    深度学习在实际操作时只有 3 个步骤：建构神经网络、设定目标和开始学习。例如，图 14-13 所示为 TensorFlow 范例网站展示的深度学习范例，其
    URL 网址为 http://playground.tensorflow.org/。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_414_0.png)


    图 14-13'
