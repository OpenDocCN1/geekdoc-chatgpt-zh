- pgno: 72
  md: '# 3.2.3 标示文字内容


    HTML 网页显示的文字内容可能有些名词或词组需要特别标示，此时可以使用本节标签来标示文字内容。只需将文字包含在这些标签之中，就可以显示不同的标示效果，如表
    3-3 所示。


    # 表 3-3 用来标示文字内容的标签及说明


    | 标签 | 说明 |

    | :--- | :--- |

    | <b> | 使用粗体字标示文字，在 HTML 5 中表示文体上的差异，如关键词和印刷上的粗体字等 |

    | <i> | 使用斜体字标示文字，在 HTML 5 中表示另一种声音或语调，通常用来标示其他语言的技术名词、词组和想法等 |

    | <em> | 显示强调文字的效果，在 HTML 5 中是强调发音上有细微改变句子的意义，如因发音改变而需强调的文字 |

    | <strong> | 在 HTML 4.x 中是更强的强调文字，在 HTML 5 中是重要文字 |

    | <cite> | 在 HTML 4.x 中是引言或参考其他来源；在 HTML 5 中是定义产品名称，如一本书、一首歌、一部电影或画作等 |

    | <small> | 在 HTML 4.x 中是显示缩小文字；在 HTML 5 中是辅助说明或小型印刷文字，如网页最下方的版权声明等 |


    表 3-3 所示标签在 HTML 4.x 中主要是为文字套用不同的显示样式，在 HTML 5 中进一步给予元素内容的意义，即语意（Semantics）。


    一般来说，<b> 标签是标示特别文字内容的最后选择，首选是 <h1> ~ <h6>，强调文字使用 <em>，重要文字使用 <strong>，需要做记号的重点文字使用第
    3.5 节 HTML 5 的 <mark> 标签。


    动手练——HTML 网页：Ch3_2_3.html


