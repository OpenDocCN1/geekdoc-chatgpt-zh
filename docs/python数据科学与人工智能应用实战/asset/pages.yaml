    # 1.2.3 4 种尺度的数据


    数据除了可以分为质的数据和量的数据外，还可以分为是否可计算数据和不同运算能力的 4 种尺度数据，如图 1-7 所示。


    这 4 类尺度数据是统计学中依据测量方式定义的测量数据，可以分成 4 种测量尺度（Level of Measurement）。简单地说，测量尺度就是指获取的数据可以执行哪些数学运算或操作。例如，从某员工中找出的
    4 种尺度数据，如图 1-8 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_23_0.png)


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_23_1.png)


    # 1. 名目尺度


    名目尺度（The Nominal Level）数据是文字内容的名称或分类，如动物性别、动物种类、人类的种族、国籍、眼睛颜色、宗教信仰和咖啡产地等。因为名目尺度数据是一种定性数据，所以不能进行加法或减法等运算，只能进行分类或计数，同时名目尺度也不具有特定的顺序。


    名目尺度数据可以进行的运算或操作如下所示。


    +   - 相等：名目尺度数据可以比较是否相等，如同一个咖啡产地、相同性别等。

    +   - 集合的成员：名目尺度数据可以进行成员运算，即是否属于此集合，如是否属于此国的咖啡产地、是否是亚洲国籍等。


    # 2. 顺序尺度


    因为名目尺度数据没有顺序性，所以可以进行的运算十分有限。如果名目尺度的数据拥有顺序性，那就成为顺序尺度（The Ordinal Level）（也称次序尺度）数据。顺序尺度数据是使用不同'
  merge: -1
  img_proc: true
- pgno: 24
  md: '顺序来区别的数据，但是是无法判断不同顺序之间的差异或意义。

    例如，满意度是 1～10 分、快乐程度是 1～5 分等。满意度 10 分大于 9 分、9 分大于 8 分，以此类推；或使用饮料品牌来区分，可口可乐排第 1、百事可乐排第
    2，雪碧排第 3，以此类推等。

    顺序尺度数据虽然使用数值来表示，但是进行加法和减法等运算仍然没有意义。顺序尺度数据除了可以进行名目尺度数据的运算和操作外，还可以进行的运算或操作如下所示。


    +   - 顺序性：顺序尺度数据拥有顺序性，可以使用图表呈现其原始顺序。例如，可见光色彩是顺序尺度数据，其顺序是红、橙、黄、绿、青、蓝、紫。

    +   - 比较：顺序尺度数据可以使用顺序性来进行比较。例如，快乐程度 5 高于 1，满意度 8 小于 10 等。


    # 3. 区间尺度


    区间尺度（The Interval Level）数据包含顺序尺度数据的所有特性，还增加了不同数值数据之间的等距特性（也称为等距尺度）。简单地说，在各数据区间的数据可以进行减法运算，如摄氏温度、华氏温度、服装尺寸区间等。


    > 0 在区间尺度并不是代表没有。


    以摄氏温度来说，台北 25°C，高雄 35°C，高雄比台北温暖，因为 2 个城市之间差了 10°C。


    > 温度 0°C 并不是表示没有温度，这只是测量温度的单位（绝对 0 度是 -273.15°C）。


    区间尺度数据除了可以进行顺序尺度数据的运算和操作外，还可以进行的运算和操作有加法和减法。


    # 4. 比率尺度


    在比率尺度（The Ratio Level）（也称为等比尺度）数据中，0 值表示没有、数据之间的差距与比率都是有意义的，即比率尺度和区间尺度的最大差异是可以计算比率，而且
    0 值就是没有。例如，工资、银行存款、生产单位和股票价格等。

    以银行存款来说，账户的存款余额是比率尺度数据，可以是 0（没有存款），存款余额 20000 是 10000 的两倍。比率尺度数据除了可进行区间尺度数据的运算和操作外，还可以进行的运算和操作有乘法和除法。


    # 1.3 数据科学的五大步骤


    在说明数据科学和数据种类后，本节介绍数据科学的五大基本步骤，这也是数据科学和数据分析（Data Analytics）之间的最大差异。

    事实上，数据科学是一种现代版的数据挖掘（Data Mining）。数据挖掘是数据科学的子集，在说明数据科学的处理过程前，先来看一看数据挖掘。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1.3.1 数据挖掘


    数据挖掘是指使用软件技术分析数据库存储的庞大数据，以便从这些数据中找出隐藏的规则性或因果关系，即找寻样式（Patterns）。


    # 1. 认识数据挖掘


    数据挖掘能够帮助公司或组织专注于最重要的数据和预测未来的趋势与行为，也称为数据库的知识探索（Knowledge Discovery in Database,
    KDD）。数据挖掘的目的分为 4 种，如下所示。


    +   - 预测（Prediction）：使用现有数据预测未来情况。例如，分析消费者的购买习惯，即预测消费者可能购买的商品；分析以往打折促销的业绩，预测再降低折扣可能增加的业绩。

    +   - 识别（Identification）：当找出特定样式后，可以标识项目是否存在。例如，分析计算机病毒特征，找出特定的病毒样式，可以通过计算机杀毒程序识别出是否中了病毒。

    +   - 分类（Classification）：将数据以不同等级、参数和特性进行分类。例如，分析信用卡消费金额的大小，可以将客户分为经常使用、偶尔使用和不曾使用信用卡，然后通过客户分类寄送购物目录来进一步分析不同消费者的购物习惯。

    +   - 优化（Optimization）：可以在目前已知的有限资源中创造出有限资源的最大效益。例如，便利店因为卖场面积有限，只能销售 1000 种商品，因此需要优化商品的选择、选购动线设计和商品排列的架位，以便创造最大的营业额。


    # 2. 数据挖掘的步骤


    尤萨马·费亚德（Usama Fayyad）和伊文盖尔斯·西穆迪斯（Evangelos Simoudis）提出的数据挖掘步骤也称为 KDD 步骤，其从原始数据开始，经过多个步骤的处理后，直到从数据中探索出知识为止，其步骤如图
    1-9 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - 筛选（Selection）：使用一些标准或准则来选取或筛选数据，以便从数据中获取所需的数据子集。例如，获取拥有车的客户数据、年收入超过 100
    万元的客户数据。

    +   - 前置处理（Preprocessing）：进行数据清理，删除错误或不一致的数据，因为一些不需要的数据可能降低查询速度。例如，针对男性用品来说，性别数据就是多余数据。在前置处理时还需要整合数据，即将不同格式的数据整合成相同格式的数据。例如，月薪整合成人民币计价、性别以
    F 和 M 代表女和男。

    +   - 转换（Transformation）：为了进行数据挖掘，在此步骤需要将数据进行分割或合并等，以便将数据转换成可用和操作的数据。例如，将销售数据切割成月、季、周和日的销售数据；信用卡种类有
    3 种，转换成数值 0～3 来代表，以方便数据操作。

    +   - 数据挖掘：最主要的数据分析步骤，使用数据挖掘方法从数据中找出样式和规则。

    +   - 解释与评估（Interpretation and Evaluation）：解释和评估找出的样式和规则是否为具有参考价值的知识，如果没有，就需要回到前面步骤进行调整后重新进行数据挖掘，直到找到足以支持经理人决策的有用结果。


    # 1.3.2 数据科学的处理过程


    数据科学包含第 1.3.1 节数据挖掘的所有步骤，只需将数据挖掘第四步骤的数据挖掘转换成建立模型，即成为数据科学处理过程的步骤。

    数据科学和数据分析在本质上没有什么不同，其最大的差异在于数据科学必须遵循结构化步骤，需要遵循这些步骤来维护分析结果的完整性。数据科学处理过程的五大步骤（源于乔·布利茨林
    Joe Blitzstein 和汉斯彼得·普菲斯特 Hanspeter Pfister 哈佛大学 CS 109 课程）如图 1-10 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_26_0.png)


    图 1-10


    上述数据科学处理过程的五大步骤说明如下所示。


    +   - 询问有兴趣的问题（Ask an Interesting Question）：在实际解决问题前，需要先定义问题'
  merge: -1
  img_proc: true
- pgno: 27
  md: '是什么。这需要具有科学、专业领域知识和好奇心，可以发起头脑风暴活动，写下所有可能的问题，然后在这之中选出可以通过获取数据来解决的问题。


    +   获取数据（Get the Data）：在选择好问题后，接着需要获取所有与问题相关的原始数据。数据源可以是公开数据、内部数据或向外面购买的数据，需要使用网络爬虫、Open
    Data、数据清理和查询数据库等技能来获取这些数据。


    +   探索数据（Explore the Data）：当成功获取数据后，需要进一步整理、归纳和描述数据，以便进行数据分析。在此步骤有 2 项主要工作，如下所示。


    +   数据前处理（Data Preprocessing）：依据第 1.2 节所讲述的数据种类，分辨各种数据属于哪一种尺度的数据，然后学习相关的领域知识，才能正确地转换和清理数据。因为获取数据通常会有些问题，如重复数据和遗漏值等大大小小的问题，解决这些问题称为数据转换与清理（Data
    Munging）。


    +   探索性数据分析（Exploratory Data Analysis, EDA）：在完成数据转换和清理后，可以开始探索数据，直接利用数据集（Data
    Sets）的统计摘要信息和可视化图表方式进行判断，以便找出隐藏在数据之间的关系、样式或异常情况，然后提出假设（Hypotheses），如解释为什么此群组客户的业绩会下滑、目标客户不符合年龄层造成产品销售不佳等。


    +   模型化数据（Model the Data）：使用统计方法和机器学习模型来验证提出的假设，如统计和检测机器学习的线性回归等。简单地说，此步骤是在证明你的假设是否正确无误。


    +   沟通和视觉化结果（Communicate and Visualize the Results）：最后需要沟通和说明分析结果来让人了解如果是一个数据科学项目，更需要说服客户相信这个分析结果。其中，最常使用的方式是使用图表等可视化方式来呈现结果。


