    # 16.3 K-means 算法


    分群和分类的差异在于：分类是在已知数据集分类的情况下，替新东西进行分类；分群是在根本不知道数据集分类的情况下，直接使用特征来进行分类。K-means 算法就是机器学习常用的一种分群算法。


    # 16.3.1 认识 K-means 算法


    K-means 分群（K-means Clustering）也称为 K 平均数分群，其在不知道数据集分类的情况下即可进行分群，这是一种非监督式学习。


    # 1. K-means 算法的基本步骤


    K-means 分群的做法是先找出 K 个群组的重心（Centroid），数据集以距离最近的重心分成群组；重新计算群组的新重心，再分群一次。以此类推，重复操作，完成分群，其步骤如下所示。


    +   Step 1 根据数据集数决定适当的 K 个重心，如 2 个。

    +   Step 2 计算数据集和重心的距离（公式和 K 近邻算法相同），然后以距离最近重心的数据来分成群组，如图 16-14 所示。

    +   Step 3 重新计算群组数据集各特征的算术平均数，将其作为新的重心，如图 16-15 所示。

    +   Step 4 再次计算数据集和重心的距离，然后以距离最近重心的数据来分成群组，如图 16-16 所示。'
