- pgno: 408
  md: '# 2. 从数据中自我训练学习


    机器学习的主要目的是预测数据，其重要之处在于可以自主学习，以及找出数据之间的关系和规则，如图 14-4 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_408_0.png)


    图 14-4


    图 14-4 中，当数据送入机器学习模型后，就会自行找出数据之间的关联性并识别出样式，其输出结果是已经学会知识的模型。机器学习主要是通过下列方式进行训练。


    +   - 需要大量数据训练模型。

    +   - 从数据中自行学习来找出关联性并识别出样式。

    +   - 根据自行学习和识别出样式获得的经验，即可对未来的新数据进行分类，并且推测其行为、结果和趋势。


    # 14.2.2 机器学习可以解决的问题


    机器学习可以解决五种问题：分类、异常值判断、预测性分析、分群和协助决策。


    # 1. 分类


    分类算法用来解决只有 2 种或多种结果的问题。二元分类（Two-class Classification）算法是将问题结果区分成 A 或 B 类，是或否、开或关、抽烟或不抽烟等两种结果。一些常见范例如下所示。


    +   - 客户是否会续约？

    +   - 图片是猫还是狗？

    +   - 回馈 10 元或打 75 折，哪一种促销方法更能提升业绩？


    多元分类（Multi-class Classification）是二元分类的扩展，可以用来解决有多种结果的问题，如哪种口味、哪家公司或哪一位参选人等。一些常见范例如下所示。


    +   - 哪种动物的图片？哪种植物的图片？

    +   - 雷达信号来自哪一种飞机？

    +   - 录音里的说话者是谁？'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 2. 异常值判断


    异常值判断算法用来检测异常情况（Anomaly Detection），简单地说，就是辨认不正常数据，找出奇怪的地方。实际上，异常值判断和二元分类看起来虽然十分相似，但是二元分类一定有
    2 种结果，而异常值判断则不一定，可以只有 1 种结果。一些常见范例如下所示。


    +   - 信用卡是否被盗刷？

    +   - 网络信息是否正常？

    +   - 这些消费和之前消费行为是否落差很大？

    +   - 管道压力大小是否有异常？


    # 3. 预测性分析


    预测性分析算法解决的是数值问题而非分类问题，即预测量有多少、需要多少钱、未来是涨价还是跌价等，此类算法称为回归（Regression）。一些常见范例如下所示。


    +   - 下星期四的气温是多少摄氏度？

    +   - 北京市长城汽车第二季度的销售量有多少？

    +   - 下周公众号会新增几位粉丝？

    +   - 下周日可以卖出多少个产品？


    # 4. 分群


    分群算法解决的是数据是如何组成的问题，属于第 14.3.2 节的非监督式学习。其基本做法是测量数据之间的距离或相似度，即距离度量（Distance Metric），如智商的差距、相同基因组的数量、两点之间的最短距离，然后据此将数据分成均等的群组。一些常见范例如下所示。


    +   - 哪些消费者对水果有相似的喜好？

    +   - 哪些观众喜欢同一类型的电影？

    +   - 哪些型号的手机有相似的故障？

    +   - 微博访客可以分成哪些不同类别的群组？


    # 5. 协助决策


    协助决策算法用于决定下一步做什么，属于第 14.3.4 节的强化学习。其基本原理源于大脑对惩罚和奖励的反应机制，可以决定奖励最高的下一步和避开惩罚的选择。一些常见范例如下所示。


    +   - 网页广告置于哪一个位置才能让访客最容易点击？

    +   - 看到黄灯时，应该保持当前速度、刹车还是加速通过？

    +   - 温度是调高、调低还是不动？

    +   - 下围棋时下一步棋的落子位置在哪里？


    # 14.2.3 人工智能、机器学习和深度学习的关系


    实际上，人工智能并不是一个新概念，这个概念最早可以追溯到 20 世纪 50 年代。到了 1980 年，机器学习开始受到欢迎；大约到了 2010 年，深度学习（详见第
    14.4 节）在弱人工'
  merge: -1
  img_proc: true
