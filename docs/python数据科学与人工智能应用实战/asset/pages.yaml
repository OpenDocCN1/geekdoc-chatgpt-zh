  md: '# 2. 离散型随机变量的方差和标准差


    如同第 11.5.2 节的离散量数，也可以计算离散型随机变量的方差，其公式如下所示：


    \(\sigma^2 = (x_1 - \mu)^2 p_1 + (x_2 - \mu)^2 p_2 + \cdots + (x_n - \mu)^2 p_n\)


    \(\mu\) 是期望值，\(p\) 是对应的概率（可用概率质量函数取得）。例如，掷 1 个骰子的期望值 \(\mu\) 是 3.5，方差 \(\sigma^2\)
    的计算如下所示：


    \(\sigma^2 = (1-3.5)^2 \times \frac{1}{6} + (2-3.5)^2 \times \frac{1}{6} + \cdots
    + (6-3.5)^2 \times \frac{1}{6} = \frac{35}{12} \approx 2.9\)


    标准偏差是方差开根号：


    \(\sigma = \sqrt{\sigma^2} = \sqrt{\frac{35}{12}} \approx 1.7\)


    # 11.6.3 连续型随机变量与概率分布


    连续型随机变量是一种有无限可能值的随机变量。例如，离散型随机变量值是 1 和 2，连续型随机变量就是 1~2 的无限值，如 1.00、1.01、1.001、1.0001、……。一些连续型随机变量的范例如下所示。


    +   - 时间（Time）：计算机完成指定工作花费的时间。看起来时间好像可以计数，事实上，时间只是区间的大约值，可以再向下细分。例如，1.3 秒可能是 1.33333333333333……秒，这是一个连续值。


    +   - 体重（Weight）：一个成人的体重是 75 kg，其值可能是 75.10 kg 或 75.1110 kg，成人体重的可能值是无限的。


    +   - 年龄（Age）：年龄 20 岁，可能是 20 年 10 天 1 秒加上 1 毫秒，与时间类似，年龄也是具有无限可能值的连续变量。


    +   - 收入（Income）：年收入看起来是可计数的值，但实际上，收入可以是任何可能值。


    # 1. 概率密度函数


    因为离散型随机变量是可计数的数值，所以概率函数能够依据事件返回对应的概率。但是，连续型随机变量是连续且无法计数的值，因此需要使用概率密度函数（Probability
    Density Function，PDF）来计算概率，如图 11-14 所示。


    图 11-14 所示为概率密度函数的曲线，当随机变量 X 落在 a 和 b (\(a \leqslant X \leqslant b\)) 区间时，概率就是此区域的面积。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_342_0.png)


    > Tip

    > 对于连续型随机变量，当随机变量 X 的值是 x 时，概率是 0，因为 x 在某一特定值时区间面积为 0，所以出现的概率都是 0。概率密度函数返回的概率值是区间宽度
    a 和 b 切割成无限小长方形的面积，需要使用积分来计算面积值。'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 2. 连续型随机变量的期望值与方差


    计算连续型随机变量的期望值与方差时需要使用积分概念，如下所示：


    期望值\(\mu\) = 随机变量\(X\)与概率密度函数乘积的积分


    方差\(\sigma\) = \((X\)值 - 期望值\(\mu\))^2 与概率密度函数乘积的积分


    上述公式需要使用数学的积分来计算，传统的统计学是使用查表方式（已经都算好）来替代复杂的计算。在第 12 章介绍估计时，也会使用 Scipy 包的统计函数来进行计算。


    # 11.6.4 累积分布函数


    概率分布的累积分布函数（Cumulative Distribution Function，CDF）（或直接称为分布函数）可以完整描述随机变量 \(X\) 的概率分布。


    # 1. 认识累积分布函数


    累积分布函数的概念类似于统计的累积次数表（Cumulative Frequency Table），其将次数和相对次数分别进行累加，如表 11-5 所示。


    # 表 11-5 将次数和相对次数分别进行累加


    | 类 型 | 次 数 | 累 积 次 数 |

    |---|---|---|

    | 1～1000 | 22 | 22 |

    | 1001～2000 | 45 | 67 |

    | 2001～3000 | 57 | 124 |

    | 3001～4000 | 97 | 221 |

    | 4001～5000 | 152 | 373 |

    | 5001～6000 | 241 | 614 |

    | 6001～7000 | 52 | 666 |


    表 11-5 中的累积次数都是之前次数的总和，累积分布函数也与此类似，只是累加的是概率，不是次数。当随机变量 \(X\) 的值是 \(x\) 时，累积分布函数的计算如下所示。


    +   离散型随机变量：所有 \(x\) 之前的概率总和。


    +   连续型随机变量：所有 \(x\) 之前概率密度函数的积分。


    # 2. 累积分布函数的用途


    累积分布函数用于找出特定值之上、之下，或两个值之间的概率。例如，现在已经有一个小狗体重的累积分布函数，可以根据此函数找出：


    +   小狗体重大于 3 kg 的概率。


    +   小狗体重小于 3 kg 的概率。


    +   小狗体重在 2～3 kg 的概率。'
