- pgno: 147
  md: '# # 5.5 遍历 HTML 网页


    现在已经知道如何调用 BeautifulSoup 的 find() 函数和 select() 函数搜索 HTML 网页。对于复杂数据，搜索只能缩小范围，无法马上获取数据，还需要遍历
    HTML 网页的标签来定位和获取所需数据。


    # ## 5.5.1 遍历 HTML 网页的方法


    BeautifulSoup 除了提供相关函数外，还支持相关属性来帮助遍历 HTML 网页。可以在对象树中进行遍历，也可以使用上一个元素和下一个元素来遍历剖析
    HTML 网页的标签顺序。


    +   1. 遍历 Python 对象树


    BeautifulSoup 剖析 HTML 网页，使其成为一棵阶层结构的 Python 对象树。因为是阶层结构，所以可以向上（父）、向下（子）和水平（兄弟）方向来进行遍历。例如，Example.html
    第 2 个问题的 <div> 标签，如图 5-5 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_147_0.png)


    图 5-5


    图 5-5 中的第 2 层 <div> 标签是第 1 层 <div> 标签的直接子标签（Direct Child），整个灰色大框的所有标签是其子孙标签（Descendants）。Python
    对象树中各标签遍历方式的说明如下所示。


    +   - 向下遍历：从 <div> → <div> → <p> → <a>。

    +   - 向上遍历：从 <li> → <ul> → <div> → <div>。

    +   - 水平遍历：对于 <ul> 标签的同一层 <li> 子标签，从 <li> 2 → <li> 1 和 <li> 2 → <li> 3 是水平遍历。'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# 2. 遍历上一个元素和下一个元素\n\nPython 对象树以类似上下楼梯方式来遍历标签，也可以使用 HTML 网页标签剖析顺序进行遍历，下一个元素是目前标签对象相邻的下一个对象，上一个元素是相邻的上一个对象，如图\
    \ 5-6 所示。\n\n![](img/26e9944e14d74e7e03dda869acb3f1a8_148_0.png)\n\n上述程序代码中，<div>\
    \ 的下一个元素是 <p>，再下一个是 <ul>，再下一个是 <li>，其顺序与树状结构的遍历不同。\n\n# 3. 再谈 BeautifulSoup 解析\
    \ HTML 网页\n\n使用 BeautifulSoup 解析 HTML 网页，就是将所有 HTML 标签建成 Tag 对象，将文字内容建成 NavigableString\
    \ 对象，但是因为文字编排的 HTML 标签中大都会有空格符和换行符“\\n”，如下所示：\n\n```\n<div class=\"survey\" id=\"\
    q2\">\n...\n    <ul class=\"answer\">\n        <li class=\"response\">喜欢 -\n \
    \       <span class=\"score\">40</span></li>\n        <li class=\"response\">普通\
    \ -\n        <span class=\"score selected\">20</span></li>\n        <li class=\"\
    response\">不喜欢 -\n        <span class=\"score\">0</span></li>\n    </ul>\n</div>\n\
    ```\n\n上述程序代码是 Example.html 第 2 题的原始 <div> 标签，可以看到各标签之间有空格符，这些字符都会建成 NavigableString\
    \ 对象，而不是只有 <span> 标签的内容，即实际遍历的 Python 对象树会多出很多 NavigableString 对象。"
  merge: -1
  img_proc: true
- pgno: 149
  md: "Tip 如果 HTML 网页在各标签之间没有任何空格符和换行符，全部连在一起，则剖析 HTML 网页的 Python 树就是图 5-5 所示的树状结构。\n\
    \n例如，使用第 5.5.2 节的 children 属性获取 <ul> 标签下的所有子标签（Python 程序：Ch5_5_1.py），如下所示：\n\n\
    ```\ntag_div = soup.select(\"#q2\")     # 找到第 2 题\ntag_ul = tag_div[0].ul    \
    \       # 遍历到之下的<ul>\nfor child in tag_ul.children:\n    print(type(child))\n\
    ```\n\n上述程序代码调用 select() 函数找到第 2 题的 <div> 标签，然后取出 <ul> 子标签，for/in 循环遍历 <ul> 标签的所有子标签，理论来说应该有\
    \ 3 个 <li> 标签，但是运行结果如下所示：\n\n```\n<class 'bs4.element.NavigableString'>\n<class\
    \ 'bs4.element.Tag'>\n<class 'bs4.element.NavigableString'>\n<class 'bs4.element.Tag'>\n\
    <class 'bs4.element.NavigableString'>\n<class 'bs4.element.Tag'>\n<class 'bs4.element.NavigableString'>\n\
    ```\n\n上述运行结果中共有 3 个 <li> 标签的 Tag 对象，其他 NavigableString 对象是位于 <li> 标签前后的空格符和换行符。\n\
    \n实际上，可以使用 if 条件过滤这些多余的 NavigableString 对象。在 Python 程序中导入 NavigableString 对象，如下所示：\n\
    \n```\nfrom bs4.element import NavigableString\n```\n\n然后修改 Ch5_5_1.py，不输出这些 NavigableString\
    \ 对象（Python 程序：Ch5_5_1a.py），如下所示：\n\n```\ntag_div = soup.select(\"#q2\")     #\
    \ 找到第 2 题\ntag_ul = tag_div[0].ul           # 遍历到之下的<ul>\nfor child in tag_ul.children:\n\
    \    if not isinstance(child, NavigableString):\n        print(child.name)\n```\n\
    \n上述程序代码 if 条件使用 not 加上 isinstance() 函数判断是不是 NavigableString 对象，如果不是，则为 Tag 对象，可以只显示\
    \ 3 个标签名称 li，其运行结果如下所示：\n\n```\nli\nli\nli\n```"
