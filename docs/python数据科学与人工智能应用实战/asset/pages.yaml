- pgno: 94
  md: '# 4.1 认识网络爬虫


    数据科学的第一步是获取数据，因为有数据才能进行分析。如果不能获得整理好的数据，就需要使用网络爬虫（Web Scraping）自己从网络获取所需的数据。


    # 4.1.1 网络爬虫的基础


    网络爬虫是一个从 Web 资源获取所需数据的过程，即直接从 Web 资源获取所需的信息，而不是使用网站提供的现成的 API 访问接口。


    网络爬虫也称为网页数据获取（Web Data Extraction），是一种数据获取技术。通过该技术，我们可以直接从网站的 HTML 网页获取所需的数据，其过程包含与
    Web 资源进行通信、剖析文件获取所需数据并整理成信息，即转换成所需的数据格式。


    实际上，网络爬虫的整个过程需要使用不同的工具和函数库（Python 是模块和包）来完成，如下所示。


    +   - Chrome 开发人员工具：Chrome 浏览器的开发人员工具可以帮助我们在 HTML 网页指出数据所在位置和找到此数据的特征，如标签名称和属性值。

    +   - HTTP 函数库：与 Web 服务器进行 HTTP 通信的函数库，以便获取响应文件的 HTML 网页内容，本书中使用 Requests 包。

    +   - 网络爬虫工具或函数库：在获取响应文件后，需要使用工具或函数库来剖析文件，以便获取所需的数据，本书中使用 BeautifulSoup 包。


    # 4.1.2 网络爬虫的基本步骤


    网络爬虫是一个从 Web 资源获取所需数据的过程，完整网络爬虫的基本步骤如下所示。


    +   - Step 1 识别出目标 URL（Uniform Resource Locations，统一资源定位符）网址：网络爬虫的第一步是识别出目标 Web
    资源的 URL 网址，可以是一个 URL 网址，也可以是一组 URL 网址。

    +   - Step 2 使用 HTTP 函数库获取 HTML 网页：使用 Requests 发送 HTML 请求，获取 HTTP 响应的 HTML 网页。

    +   - Step 3 使用浏览器的开发人员工具分析 HTML 网页：使用工具在 HTML 网页定位出所需数据，并且分析如何搜索和访问此标签来获取数据。

