    图 11-1 所示的大圆形是电影院的人数 100 人，事件 A 是女性人数 25 人，所以 P(A) = 25/100 = 0.25，其概率值范围是 0～1。也就是说，任何事件的概率最大值就是
    1。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_324_0.png)


    # 2. 样本空间


    样本空间是试验结果的所有可能值。例如，丢 2 个铜板的所有正面朝上和背面朝上的可能值有{正正，正反，反正，反反} 这 4 种，第 1 个正代表第 1 个铜板，第
    2 个正代表第 2 个铜板。那么，丢 2 个铜板都是正面的概率为 P(正正) = 1/4 = 0.25。


    可以使用表格证明 P(正正) 的概率，如表 11-1 所示。


    # 表 11-1 概率说明


    | | 铜板 1 正面 | 铜板 1 反面 |

    |---|---|---|

    | 铜板 2 正面 | True | False |

    | 铜板 2 反面 | False | False |


    表 11-1 中共有 4 种可能，只有 1 种是 2 个都为正面，所以概率是 1/4。


    # 11.1.2 频率论


    如果样本空间根本无法完整试验出来，即无法试验出所有有可能发生的事件，样本空间的尺寸也无法得知，此时可以使用频率论（Frequentist Approach）来计算概率。


    频率论是使用试验（Experimentation）的方式计算概率，以实际重复试验的次数来计算出发生次数的概率，其公式为


    ```

    P(A) = \frac{发生次数}{重复试验的次数}

    ```


    例如，丢 10 次铜板，有 4 次是正面，所以铜板正面的概率是 P(正)= 4/10= 0.4（40%）。

    如果铜板是一个“公正”的铜板，其正反概率相同，那丢 100 次铜板，可能有 54 次是正面，P(正)= 54/100 = 0.54（54%）。如果丢了 1000
    次铜板，正面的概率就会越接近实际概率 50%。

    这就是大数法则（The Law of Large Numbers），在第 11.1.3 节有进一步的说明。


    事实上，频率论是在计算相对频率（Relative Frequency），即事件多常发生的概率，可以使用过去的数据来预测未来。例如，计算网站访客的重复访问率是一个相对频率，可以从访客的记录文件找出上个月共有
    5467 名访客访问网站，其中 1345 位是重复访问，所以 P(重复访问)=1345/5467 ≈ 0.246，即 24.6% 的重复访问概率。


    > Tip 概率计算除了使用频率论外，另一个著名方法是贝叶斯推论（Bayesian Inference），这是源于贝氏理论（Bayes Theorem）的概率学，也是机器学习贝叶斯分类器的基础。本书中并没有讨论此部分，有兴趣的读者可以自行参阅其他相关图书。'
  merge: -1
  img_proc: true
- pgno: 325
  md: "# 11.1.3 大数法则\n\n大数法则是指当使用频率论计算概率时，当重复试验的次数够多够大时，试验结果相对频率的概率就等于实际概率。\n\n例如，丢\
    \ 1 个铜板 10 次是正面的概率不一定是 0.5，但是丢 10000 次，概率就会接近 0.5 的实际概率。同理，掷 1 个骰子 10 次是 1 点的概率不一定是\
    \ 0.167，但掷了 10000 次，概率就会接近 0.167 的实际概率。\n\n# 1. 丢 1 个铜板是正面概率的大数法则：Ch11_1_3.py\n\
    \n丢 1 个“公正”铜板是正面的实际概率是 1/2 = 0.5（50%）。可以使用随机数模拟丢 1 个铜板从 1 次至 10000 次，然后计算每一次试验出现正面的概率，如下所示：\n\
    \n```\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\
    \nresults = []\nfor num_throws in range(1, 10001):\n    throws = np.random.randint(low=0,\
    \ high=2, size=num_throws)\n    probability_of_throws = throws.sum() / num_throws\n\
    \    results.append(probability_of_throws)\n```\n\n上述程序代码中，for 循环是 1~10000 次，num_throws\
    \ 是丢 1 个铜板的总次数。调用 random.randint() 函数产生 num_throws 次数的 0 或 1，1 代表正面，0 代表反面。在调用\
    \ sum() 函数计算总和（正面次数）后，除以 num_throws 次数就是丢出铜板的正面概率。最后使用 results 列表建立 DataFrame\
    \ 对象和绘制折线图，如下所示：\n\n```\ndf = pd.DataFrame({\"throws\" : results})\n\ndf.plot(color=\"\
    b\")\nplt.title(\"Law of Large Numbers\")\nplt.xlabel(\"Number of throws in sample\"\
    )\nplt.ylabel(\"Average Of Sample\")\n```\n\n上述程序代码可以绘制蓝色线条的折线图，其运行结果如图 11-2 所示。由图\
    \ 11-2 可以看出，当次数越大时，概率就越接近实际概率 0.5。"
