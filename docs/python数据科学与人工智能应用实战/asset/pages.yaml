    # 14.1.3 人工智能的研究领域


    人工智能的研究领域非常广泛，一些主要的人工智能研究领域如下所示。


    +   机器学习和模式识别（Machine Learning and Pattern Recognition）：这是目前人工智能最主要和普遍的研究领域，可以让我们设计和开发软件从数据中学习，并建立学习模型，然后使用此模型来预测未知的数据。其最大的限制是数据量，机器学习需要大量数据进行学习，如果数据量不大，相对的预测准确度就会大幅下降。


    +   逻辑基础的人工智能（Logic-based Artificial Intelligence）：逻辑基础的人工智能程序是针对特别问题领域的一组逻辑格式的事实和规则描述，简单地说，就是使用数学逻辑来执行计算机程序，其特别适用于样式比对（Pattern
    Matching）、语言剖析（Language Parsing）和语法分析（Semantic Analysis）等。


    +   搜索（Search）：搜索技术也常常应用在人工智能中，可以在大量的可能结果中找出一条最佳路径。例如，下棋程序找到最佳的下一步、优化网络资源分配和调度等。


    +   知识表示法（Knowledge Representation, KR）：知识表示法研究世界上围绕我们的各种信息和事实是如何来表示的，以便计算机系统可以了解和看懂。如果知识表示法有效率，机器将会变得聪明且有智慧，可以解决复杂的问题。例如，诊断疾病情况或进行自然语言的对话。


    +   AI 规划（AI Planning）：正式的名称是自动化规划和调度（Automated Planning and Scheduling），规划是一个决定动作顺序的过程，以成功执行所需的工作；调度是在特定日期时间限制下，组成充足的可用资源来完成规划。自动化规划和调度专注于使用智能代理人（Intelligent
    Agents）来优化动作顺序，简单地说，就是建立最小成本和最大回报的优化规划。


    +   启发法（Heuristics）：启发法应用于快速反应，其可以依据有限知识（不完整数据）在短时间内找出问题可用的解决方案，但不保证是最佳方案。例如，搜索引擎和智能机器人。'
