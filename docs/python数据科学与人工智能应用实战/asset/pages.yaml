- pgno: 143
  md: '正则表达式翻译器（或称为引擎）能够将定义的正则表达式模板字符串和字符串变量进行比较，返回布尔值，True 表示字符串符合模板字符串的定义，False
    则表示不符合。


    # 1. 字符集


    正则表达式的模板字符串由英文字母、数字和一些特殊字符组成，其中最主要的就是字符集。可以使用 “\” 开头的默认字符集，或是使用 “[” 和 “]” 符号组合成一组字符集的范围，每一个字符集代表比对字符串中的字符需要符合的条件，其说明如表
    5-4 所示。


    | 字符集 | 说明 |

    |---|---|

    | [abc] | 包含英文字母 a、b 或 c |

    | [abc{] | 包含英文字母 a、b、c 或符号 “{” |

    | [a-z] | 任何英文小写字母 |

    | [A-Z] | 任何英文大写字母 |

    | [0-9] | 数字 0～9 |

    | [a-zA-Z] | 任何大小写英文字母 |

    | [^abc] | 除了 a、b 和 c 以外的任何字符，[^...] 表示之外 |

    | \w | 任何字符，包含英文字母、数字和下划线，即 [A-Za-z0-9_] |

    | \W | 任何不是 \w 的字符，即 [^A-Za-z0-9_] |

    | \d | 任何数字的字符，即 [0-9] |

    | \D | 任何不是数字的字符，即 [^0-9] |

    | \s | 空格符，包含不会显示的逸出字符，如\n 和 \t 等，即 [ \t\n\r\f\v] |

    | \S | 不是空格符的字符，即 [^ \t\n\r\f\v] |


    正则表达式的模板字符串中除了包含字符集外，还可以包含 Escape 逸出字符串代表的特殊字符，如表 5-5 所示。


    | Escape 逸出字符串 | 说明 |

    |---|---|

    | \n | 新行符号 |

    | \r | Carriage Return 的 Enter 键 |

    | \t | Tab 键 |

    | \\, \?, \?, \\, \\[, \\], \\{, \\}, \\(, \\), \+, \*, \\| | 在模板字符串中代表 . ? /
    \ [ ] { } ( ) + * 和 | 特殊功能的字符 |

    | \xHex | 十六进制的 ASCII 码 |

    | \xOct | 八进制的 ASCII 码 |


    正则表达式的模板字符串中不仅可以包含字符集和 Escape 逸出字符串，而且可以包含由序列字符组成的子模板字符串，可将其使用 ( ) 括号括起，如下所示：'
