  md: '# # 11.6.5 二项分布


    二项分布就是二项随机变量（Binomial Random Variables）的概率分布，是一种离散型随机变量的概率分布。


    # ## 1. 二项随机变量


    二项随机变量是在重复发生的单一事件中计算出的成功次数（如果不能计数，就一定不是二项随机变量）。其需要符合的条件如下所示。


    +   - 样本尺寸是固定的，即固定的试验次数。

    +   - 对于每一次试验，成功情况一定会出现，或没有出现。

    +   - 每一个事件的概率必须是相等的。

    +   - 每一次试验都是独立事件，即 2 个试验之间没有任何关联。


    一些二项随机变量的范例如下所示。


    +   - 丢 1 个 “公正” 铜板 10 次，计算正面的次数。

    +   - 掷 1 个 “公正” 骰子 5 次，计算出现 1 点的次数。

    +   - 购买 20 次刮刮乐，计算中奖的次数。

    +   - 随机选择 200 人的样本，计算左撇子的人数。


    # ## 2. 二项分布


    二项随机变量的概率分布就是二项分布，二项分布拥有 2 个重要特性，如下所示。


    +   - 固定试验次数 n。

    +   - 每一次试验的成功概率 p。


    二项随机变量的概率质量函数如下所示：


    $P(X=k) = C_k^n p^k (1-p)^{n-k}$


    $C_k^n = \frac{n!}{(n-k)!k!}$


    P(X=k) 就是概率质量函数，第 2 个公式是第 11.3.3 节的组合公式。例如，掷 1 个 “公正” 骰子 5 次，计算出现 1 点的次数，n 的值是
    5，p 的值是 1/6，k 的可能值是 0~5。随机变量 X 是二项分布，P(X=0)、P(X=1)、⋯的计算如下：


    $P(X=0) = C_0^5 \left(\frac{1}{6}\right)^0 \left(1-\frac{1}{6}\right)^{5-0}$


    $P(X=1) = C_1^5 \left(\frac{1}{6}\right)^1 \left(1-\frac{1}{6}\right)^{5-1}$


    ...


    Python 可以使用 Scipy 包的 stats 统计模块来计算概率质量函数的值（Python 程序：Ch11_6_5.py），如下所示：


    ```

    ```python

    from scipy import stats

    ```

    ```'
