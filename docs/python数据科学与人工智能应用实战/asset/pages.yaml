    # 1. 描述统计


    描述统计是在观察样本数据、测量数据重要特征时的摘要，可以从数据中将特征与特性明确化，即了解数据背后隐含的特征和特性，然后使用信息化方式来组织、摘要与展示数据。其中最有效的方法是将数据整理成表格，并使用第
    10.2 节的各种图表来展示。


    描述统计的目的就是对过去的数据进行总结，如下所示。


