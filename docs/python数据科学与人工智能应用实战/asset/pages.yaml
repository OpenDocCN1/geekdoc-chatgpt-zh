    # 3.3.2 超链接


    HTML 网页是一种超文本（Hypertext），内含超链接，可以连接全世界不同服务器的资源。

    超链接不仅可以连接同网站的其他 HTML 网页，还可以连接其他网站的网页，其基本语法如下所示：


    ```

    <a href="URL" target="frame_name">超链接名称</a>

    ```


    上述 <a> 超链接标签在浏览器中默认显示蓝色带下划线文字，访问过的超链接显示紫色带下划线文字，启动的超链接是红色带下划线文字。


    HTML5 超链接不仅可以使用 <img> 子元素建立图片超链接，还可以在 <a> 元素中使用区块元素，如<h3>，如下所示：


    ```

    <a href="http://www.waterpub.com.cn/">

    <h3>中国水利水电出版社</h3></a>

    ```


    # 1. 超链接 <a> 标签的属性


    超链接 <a> 标签的属性及说明如表 3-6 所示。


    | 属性 | 说明 |

    |---|---|

    | href | 指定超链接连接的目的地，其值可以是相对 URL 网址，即指定同网站的文件名，如 index.html；或绝对 URL 网址，如 http://www.baidu.com
    |

    | hreflang | 指定连接 HTML 网页的语言，如 en、zh 等 |

    | media | HTML5 的新属性，可以指定哪一种媒体或装置可以优化处理连接的网页文档 |

    | rel | 指定目前网页和连接网页之间的关系，当 href 属性存在时才能指定。例如，alternate 是替代文档，bookmark 作为书签等 |

    | target | 指定超链接如何打开目的地的 HTML 网页，其属性值的说明详见表 3-7 |

    | type | 指定连接 HTML 网页的 MIME 类型 |


    HTML5 不再支持旧版的 charset、coords、name、rev 和 shape 属性。


    # 2. target 属性值


    <a> 标签的 target 属性值及说明如表 3-7 所示。'
