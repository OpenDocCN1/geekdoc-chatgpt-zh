- pgno: 166
  md: '# 动手学——使用索引运算符获取字符： Ch6_1_3.py


    Python 字符串可以使用 “[]” 索引运算符获取指定位置的字符，索引值从 0 开始，而且可以是负值，如下所示：


    ```

    str1 = ''Hello''


    print(str1[0])    # H

    print(str1[1])    # e

    print(str1[-1])   # O

    print(str1[-2])   # l

    ```


    上述程序代码依次输出字符串 str1 的第 1 个和第 2 个字符，-1 表示最后 1 个字符，-2 表示倒数第 2 个字符。


    # 动手学——切割字符串： Ch6_1_3a.py


    切割运算符的基本语法如下所示：


    ```

    str1[start:end]

    ```


    上述中括号 “[]” 中使用冒号 “:” 分隔 2 个索引位置，可以获取字符串 str1 从索引位置 start 开始到 end-1 之间的子字符串，如果没有
    start，就是从 0 开始；如果没有 end，就是到字符串的最后 1 个字符。例如，本节范例字符串 str1 的字符串内容如下所示：


    ```

    str1 = ''Hello World!''

    ```


    上述字符串的索引位置值可以是正值，也可以是负值，如图 6-1 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_166_0.png)


    一些切割字符串的范例如表 6-5 所示。


    | 切割字符串 | 索引值范围 | 取出的子字符串 |

    |---|---|---|

    | str1[1:3] | 1~2 | "el" |

    | str1[1:5] | 1~4 | "ello" |

    | str1[1:7] | 0~6 | "Hello W" |

    | str1[4:] | 4~11 | "o World!" |

    | str1[1:-1] | 1~(-2) | "ello World" |

    | str1[6:-2] | 6~(-3) | "Worl" |'
