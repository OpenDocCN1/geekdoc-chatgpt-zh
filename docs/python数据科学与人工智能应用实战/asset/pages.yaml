    # 3.4 HTML 5 表格、窗体与容器标签


    HTML 的 <table> 表格标签可以建立表格；<form> 标签可以建立窗体；<div> 和 <span> 标签是一种容器，可以用来群组其他 HTML
    元素。


    # 3.4.1 HTML 的表格标签


    表格是一种数据编排方式，如果网页内容需要分类，则可以使用表格对数据进行分类和系统化处理，将原本杂乱的数据重新编排来清楚呈现想要表达的信息。

    HTML 表格是一组相关标签的集合，需要同时使用数个标签才能建立表格。表格相关的标签及说明如表 3-8 所示。


    | 标签 | 说明 |

    |---|---|

    | <table> | 建立表格，其他表格相关标签都在此标签之中 |

    | <tr> | 定义表格的每一个表格行 |

    | <th> | 定义表格的标题栏 |

    | <td> | 定义表格的每一个单元格 |

    | <caption> | 定义表格的标题文字，这是 <table> 标签的第 1 个子元素 |

    | <thead> | 群组 HTML 表格的标题内容 |

    | <tbody> | 群组 HTML 表格的文本内容 |

    | <tfoot> | 群组 HTML 表格的脚注内容 |'
