    ![](img/26e9944e14d74e7e03dda869acb3f1a8_410_0.png)


    图 14-5


    事实上，人工智能包含机器学习，机器学习本身也是一种数据科学的重要技术，而且包含深度学习。人工智能、机器学习和深度学习的关系（最下层是各种算法）如图 14-6
    所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_410_1.png)


    图 14-6


    从图 14-6 中可以发现人工智能、机器学习和深度学习三者彼此之间的关联性，基本上，它们彼此互为子集。简单地说，深度学习推动机器学习的发展，最后实现人工智能。


    # 14.3 机器学习的种类


    机器学习根据训练方式的不同，可以分成需要答案的监督式学习（Supervised Learning）、不需要答案的非监督式学习（Unsupervised Learning）、半监督式学习（Semisupervised
    Learning）和强化学习（Reinforcement Learning）。


    # 14.3.1 监督式学习


    监督式学习是一种机器学习方法，可以根据训练数据（Training Data）建立学习模型（Learning Model），并且依据此模型来推测新数据是什么。


    实际上，在监督式学习的训练过程中，需要告诉机器答案 [称为有标签数据（Labeled Data）]。因为该学习方式仍然需要老师提供答案，所以其称为监督式学习。例如，垃圾邮件过滤的机器学习，在输入
    1000 封电子邮件且告知每一封是垃圾邮件（Y）或不是垃圾邮件（N）后，即可根据这些训练数据建立学习模型，然后就可以询问模型一封新邮件是否是垃圾邮件，如图
    14-7 所示。'
