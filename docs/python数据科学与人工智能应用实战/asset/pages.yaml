  md: "# 2. 项目符号\n\nHTML 列表可以使用无编号的项目符号，即项目前的小圆形、正方形等符号，如下所示：\n\n```\n<ul>\n    <li>项目\
    \ 1</li>\n    <li>项目 2</li>\n    ...\n</ul>\n```\n\n# 3. 定义列表\n\nHTML 5 定义列表是任何名称和值成对群组的结合列表，如词汇说明的是每一个项目的定义和说明，如下所示：\n\
