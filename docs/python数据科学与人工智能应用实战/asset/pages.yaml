  md: '图 13-1 所示散布图的数据点可以帮助我们找出 \( x \) 和 \( y \) 轴数据是正相关（Positive Relation）、负相关（Negative
    Relation）还是无相关（No Relation），其说明如下所示。


    +   - 正相关：图表显示当一轴增加时，另一轴也增加，数据排列成一条往右斜向上的直线。例如，身高增加，体重也同时增加，如图 13-2 所示。


    +   - 负相关：图表显示当一轴增加时，另一轴却减少，数据排列成一条往右斜向下的直线。例如，打手游的时间增加，读书的时间就会减少，如图 13-3 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_378_0.png)


    +   - 无相关：图表显示的数据点十分分散，看不出有任何直线的趋势，如学生身高和期中考试成绩，如图 13-4 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_378_1.png)


    观察上述散布图的数据点，目的就是找出 2 个数据之间是否呈现出一条直线关系，这种关系就是线性关系。当 2 个数据具有线性关系时，就可以从一个数据来预测另一个数据。


    # ## 13.1.2 使用协方差


    在统计上，协方差（Covariance）用来测量 2 个随机变量之间的关系，特别是指线性关系的强弱。第 11.5.2 节的方差（Variance）可以呈现单一变量的离散程度，而协方差多了“协”，可以呈现
    2 个变量一起的离散程度。


    协方差和第 11.5.2 的方差公式有些相似，其公式如下所示：


    ```

    \(\text{协方差 } S_{xy} = \frac{(x_1 - \bar{x})(y_1 - \bar{y}) + (x_2 - \bar{x})(y_2
    - \bar{y}) + \cdots + (x_n - \bar{x})(y_n - \bar{y})}{n}\)

    ```


    上述公式中，\( n \) 是数据数，\( \bar{x} \) 和 \( \bar{y} \) 是平均数。


    使用第 13.1.1 节的数据，使用 NumPy 包计算协方差（Python 程序：Ch13_1_2.py），如下所示：'
