- pgno: 18
  md: '# # 1.1 数据科学的基础


    数据科学（Data Science）是一门艺术，也是一门科学，其主要目的是从数据（Data）中获得知识（Knowledge）。对于公司或组织来说，数据是重要的资产，如何从庞大的数据中找出获利模式或开发出产品，已经成为现今各大公司发展的主战场。


    # ## 1.1.1 认识数据科学


    在 19 世纪的工业时代（Industrial Age），因为发明了机器，人们快速从农业社会进入工业制造的年代，到了 20 世纪，人们已经可以轻而易举地建造出超大型工厂和各种大型机具。现在，我们的目标已经转移至更小更快的芯片、CPU
    和计算机，工业时代已经被信息时代（Information Age）取代，我们开始使用计算机存储和处理信息，并且开始大量使用电子数据（Electronic Data）。


    +   1. 数据时代


    随着全球因特网（Internet）的兴起，数据的获取变得非常容易。例如，某些社交网站无时无刻不在获取用户数据、手机定位数据、用户产生的数据（留言、点赞和上传图片等）、社交网络数据（加入朋友）、传感器接收数据和计算机系统自动产生的记录数据等，如图
    1-1 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_18_0.png)


    图 1-1


    图 1-1 所示统计数据是全世界存储的数字数据，以 Zettabyte（ZB）为单位，1ZB = 1024 Exabyte（EB），那么 1EB 大约有 100
    多万 GB（Gigabyte）。从 2006 年到 2011 年，数字数据已经增长了 5 倍以上，而且绝大部分新产生的数据是非结构化数据（Unstructured
    Data）或是半结构化数据（Semistructured Data），并不是结构化数据（Structured Data）。详细数据种类的说明请参阅第 1.2.1
    节。


    21 世纪是数据时代（Data Age），庞大且持续产生的数据已经成为重要的数据源和资产，再加上硬件运算能力的快速成长，人工智能、机器学习（Machine
    Learning）已经跃升为当前热门'
  merge: -1
  img_proc: true
- pgno: 19
  md: '学科。如何从大量数据中获得知识，通过数据来学习和产生智能，这就是数据科学家（Data Scientist）的工作。


    # 2. 数据科学


    因为数据科学的目标是数据，所以在定义数据科学之前，需要先了解什么是数据科学的数据，其概念如下所示：

    数据就是有组织或没有组织格式的一个信息集合。

    基本上，数据的格式分为 2 种，如下所示。


    +   - 有组织的数据（Organized Data）：数据已经排列成行（Rows）和列（Columns）的表格形式，其中每一行代表一个单一的观测结果（Observation），每一个字段代表观测结果的单一特点（Characteristics），如数据库的数据表或
    Excel 电子表格等。

    +   - 没有组织的数据（Unorganized Data）：自由格式的数据，通常是一些原始数据（Raw Data），需要进一步将其转换和清理成有组织的数据。


    数据科学是一个完整的研究方法过程，可以使用数据做出科学性的研究成果，简单地说，就是从数据中获得知识。数据科学家需要搜集数据、观察数据、探索数据和提出假设，然后使用统计或方法数学验证结果，以便我们从数据中获得的知识能够起到以下作用：


    +   - 帮助我们制定决策。

    +   - 预测未来。

    +   - 了解过去和现在。

    +   - 建立新的产品。


    # 3. 数据与知识


    数据科学使用的数据不是原始数据，而是一种有意义的数据，称为信息（Information）。知识就是相连接的信息，如图 1-2 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_19_0.png)


    换句话说，数据科学家的工作就是建立具体步骤和程序来发现数据（信息）之间的关联性和因果关系，然后连接信息产生知识，接着应用知识来产生智能，这就是机器学习。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.1.2 数据科学的文氏图


    数据科学需要的背景知识与技能非常多，可以使用数据科学文氏图（Venn Diagram）来呈现这些知识与技能的关系，如图 1-3 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_20_0.png)


    图 1-3


    图 1-3 中列出的主要知识与技能有 3 种，其说明如下所示。


    +   - 数学与统计知识（Math/Statistics Knowledge）：使用数学（线性代数）、统计公式或表达式来分析数据，建立预测模型和验证结果。

    +   - 计算机编程能力（Computer Programming）：编写程序代码来转换和清理数据，以便分析和训练数据，本书中使用的是 Python 语言。

    +   - 专业领域知识（Domain Knowledge）：因为获取的数据属于不同的领域，如医疗、财务、社会科学等，所以在分析数据时，需要拥有该领域的相关知识，如此才能正确地认知和分析数据。


    # 1.2 数据的种类


    数据科学研究的目标是数据，且通常是大量的数据。因此，只有进一步了解我们面对的数据，才能真正了解第 1.3 节数据科学的处理过程。


    # 1.2.1 结构化、非结构化和半结构化数据


    数据根据结构来划分，可以分成 3 种：结构化数据（Structured Data）、非结构化数据（Unstructured Data）和半结构化数据（Semistructured
    Data）。


    +   1. 结构化数据


    结构化数据就是第 1.1.1 节说明的有组织的数据，这是一种已经预先定义格式，而且可以让计算机读取的数据，通常是使用表格方式呈现，如数据库或 Excel 电子表格，如表
    1-1 所示。'
  merge: -1
