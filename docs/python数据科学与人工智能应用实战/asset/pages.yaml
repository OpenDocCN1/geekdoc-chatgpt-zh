    \n+   离散数据（Discrete Data）：以不连续数值呈现的数据，此类型数据的数值都是离散的数值，即任何 2 个数值之间不可以插入无限数量的数值数据。例如，骰子点数和考试分数等。\n\
    \n例如，从一间咖啡店观察出的数据，这里只列出字段定义，如图 1-6 所示。\n\n| 店名 | 年营业额 | 邮政编码 | 月平均来客数 | 咖啡产地 |\n\
