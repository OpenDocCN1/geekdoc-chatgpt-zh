    # 12.5 假设检验


    第 12.4 节的点估计和信赖区间是基本的推论工具，也是统计假设检验（Statistical Hypothesis Testing）推论技术的基础，可以帮助查明观察到的样本是否偏离所期望的总体。


    # 12.5.1 认识假设检验


    统计上的假设检验可以查明样本数据是否真的来自预期的总体，或根本是来自一个不同的总体。


    > 虽然抽样的样本是来自同一个总体，但是因为信赖区间，观察到的样本统计量仍然有可能和预期总体不符，如同是一个来自其他总体的样本数据，假设检验就是在查明是否有此问题。


    # 1. 假设与检验的关系


    统计上的假设是指针对总体性质的推论。例如，成年男性平均身高是 170cm、交换生的成绩和全校平均成绩相同、成年女性的平均体重位于 46~56kg 等。检验则是根据抽样的样本来检验这些针对总体性质的假设是否正确，如果检验结果成立，则接受（Accept）假设；反之拒绝（Reject）假设。'
