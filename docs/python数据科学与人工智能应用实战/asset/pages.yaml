- pgno: 412
  md: '# 14.3.2 非监督式学习


    非监督式学习和监督式学习的最大差异是训练数据不需有答案（标签），即机器是在没有老师告知答案的情况下进行学习。例如，博客访客的训练数据集是没有标签的数据，如图
    14-9 所示。


    图 14-9 所示训练数据集是博客的多位访客，既没有标准答案，也没有任何标签。在训练时只需提供上述输入数据，机器就会自动从这些数据中找出潜在规则和关联性。例如，使用分群（Clustering）算法将博客访客分成几个相似的群组，如图
    14-10 所示。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_412_0.png)


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_412_1.png)


    图 14-9


    图 14-10


    简单来说，如果训练数据有标签，需要老师提供答案，就是监督式学习；如果训练数据没有标签，不需要老师提供答案，机器能够自行摸索出数据的规则和关联性，就是非监督式学习。


    # 14.3.3 半监督式学习


    半监督式学习是介于监督式学习与非监督式学习之间的一种机器学习方法，此方法使用的训练数据大部分是没有标签的数据，只有少量数据有标签。


    因为机器学习的研究者发现如果同时使用少量标签数据和大量的无标签数据，可以大幅提高机器学习的正确度，如图 14-11 所示。


    图 14-11 中，首先使用少量有标签数据割切出一条分界的分隔线来分成群组，然后将大量无标签数据根据整体分布来调整成 2 个群组，建立出新分界的分隔线。如此，只需通过少量的有标签数据，就可以大幅提高分群的正确度。


    ![](img/26e9944e14d74e7e03dda869acb3f1a8_412_2.png)


    图 14-11


    Google 相册就是半监督式学习的实例，当上传家庭全部成员的照片后，Google 相册就会学习分辨照片 1、2、5、11 有成员 A，照片 4、5、11
    有成员 B，照片 3、6、9 有成员 C 等，这是使用第 14.3.2 节非监督式学习的分群结果；当输入成员 A 的姓名后（有标签数据），Google 相册马上就可以在有此成员的照片上标示姓名，这就是一种半监督式学习。


    # 14.3.4 强化学习


    如果机器学习没有明确答案，而是一系列的连续决策，即决定下一步做什么，如下棋需要'
