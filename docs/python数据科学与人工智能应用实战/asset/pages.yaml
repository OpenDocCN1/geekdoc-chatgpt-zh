  md: '# 前言 P R E F A C E


    数据科学（Data Science）是一门艺术，也是一门科学，其主要目的是从数据（Data）中获得知识（Knowledge）。人工智能（Artificial
    Intelligence, AI）是让机器变得更聪明的一种科技，即让机器具备和人类一样的思考逻辑与行为模式。


    事实上，机器学习就是一种人工智能，也是一种数据科学的技术，可以让计算机使用现有的数据进行训练和学习，以便创建预测模型。我们可以使用其创建的模型来预测未来的行为、结果和趋势，或进行数据的分类与分群等。


    本书是一本使用 Python 3 语言介绍数据科学和机器学习的学习手册，可以作为大中专院校尤其是应用型本科院校人工智能、数据科学或机器学习专业的教材。在内容上，本书从基础开始说明如何获取数据、探索数据和预测数据，强调不只是让读者单纯学习
    Python 数据科学和机器学习的编程知识，更希望读者能够创建正确的数据科学、人工智能和机器学习的相关理念。全书操作性比较强，从实务角度详细说明数据科学家和人工智能工程师需要具备的理论、观念和技能，通过阅读本书，读者可以轻松了解当今盛行的数据科学、大数据分析、人工智能和机器学习等相关知识。


    因为数据科学需要的背景知识与技能相当多，不仅需要会 Python 编程知识，更需要了解各种相关 Python 包和模块的使用，再加上机器学习的基础就是概率和统计，所以本书也详细说明了数据科学必备的概率和统计相关知识。


    为了方便初学者能够深入了解数据科学和机器学习，本书从数据获取的网络爬虫开始，详细说明数据科学必备的 Python 包之后，再从概率、统计和探索式数据分析进入人工智能的机器学习，为读者提供一个完整的数据科学和机器学习历程。通过本书的学习，可以为成为一名高级数据科学家或更进一步的深度学习打下坚实的基础。


    本书在定位上是一本 Python 数据科学和机器学习的入门书，除了基础概率和统计的数学外，作者使用大量范例和图例说明来取代复杂的数学公式，并且使用多个小型数据集，直接使用
    Scikit-learn 包来介绍常见的机器学习算法。


    # 本书结构


    本书循序渐进，从数据科学的基础知识开始，在说明 Python 语言、HTML 网页结构和 JSON 后，从网络爬虫开始学习如何获取数据，接着学习 Python
    数据科学必备软件包来帮助读者探索数据，最后才进入人工智能与机器学习，创建所需的预测模型来预测数据。全书分 4 篇共 16 章，具体结构如下。'
