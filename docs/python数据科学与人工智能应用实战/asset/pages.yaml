  md: '# 16.2 K 近邻算法


    简单地说，分类预测就是使用已知的分类数据建立预测模型来预测未知数据所属的类别，除了使用第 15.4 节的 Logistic 回归、第 16.1 节的决策树外，另一个常见的分类算法是
    K 近邻算法。


    # 16.2.1 认识 K 近邻算法


    K 近邻算法是使用 K 个最接近目标数据的数据来预测目标数据所属的类别。


    通过一个简单实例的计算过程来说明 K 近邻算法。例如，某家面纸厂商使用问卷调查客户对面纸的好恶，问卷共使用 2 个属性（耐酸性、强度）判断面纸的好或坏，如图
    16-7 所示。


    厂商在今年开发出一种面纸的新产品，其实验室测试结果的耐酸性是 3，强度是 7。在 K = 3 的情况下，请使用 K 近邻算法判断新产品是好面纸还是坏面纸，其步骤如下所示。


    +   Step 1 计算新产品与所有数据集的距离。需要计算新产品与所有数据集其他面纸产品的距离，其公式是各属性与新产品属性差的平方和。例如，编号 1 是
    (7, 7)，新产品是 (3, 7)，各属性差的平方和是 (7-3)² + (7-7)² = 4² = 16，如图 16-8 所示。


    | 编号 | 耐酸性 | 强度 | 分类 |

    | :--- | :--- | :--- | :--- |

    | 1 | 7 | 7 | 坏 |

    | 2 | 7 | 4 | 坏 |

    | 3 | 3 | 4 | 好 |

    | 4 | 1 | 4 | 好 |


    | 编号 | 耐酸性 | 强度 | 分类 | 距离 (3, 7) |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 7 | 7 | 坏 | (7-3)² + (7-7)² = 16 |

    | 2 | 7 | 4 | 坏 | (7-3)² + (4-7)² = 25 |

    | 3 | 3 | 4 | 好 | (3-3)² + (4-7)² = 9 |

    | 4 | 1 | 4 | 好 | (1-3)² + (4-7)² = 13 |


    图 16-7


    图 16-8


    +   Step 2 排序找出最近的 K 笔距离。在计算出距离后，因为 K=3，所以可以找出距离最近 3 笔的编号是 1、3 和 4，距离分别是 16、9
    和 13，距离 25 被排除，如图 16-9 所示。


    | 编号 | 耐酸性 | 强度 | 分类 | 距离 (3, 7) |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 7 | 7 | 坏 | (7-3)² + (7-7)² = 16 |

    | 2 | 7 | 4 | 坏 | (7-3)² + (4-7)² = 25 |

    | 3 | 3 | 4 | 好 | (3-3)² + (4-7)² = 9 |

    | 4 | 1 | 4 | 好 | (1-3)² + (4-7)² = 13 |


    图 16-9


    +   Step 3 新产品分类是最近 K 笔距离的多数分类。现在，知道距离最近 3 笔编号是 1、3 和 4，其分类分别是坏、好和好，好比较多，所以新产品的分类是“好”，这就是
    K 近邻算法。'
