  md: '值的范围是 -1~+1 ) 。但是，在介绍相关系数之前，需要先了解相关性和因果关系（Causation）。


    # 1. 相关性和因果关系


    实际上，如果 2 个变量有因果关系，则表示一定有相关性；反之，有相关性，并不表示 2 个变量之间有因果关系，如下所示。


    +   相关性：量化相关性的值范围为 -1 ~ +1，即相关系数，可以使用相关系数的值来测量 2 个变量的走势如何相关和其强度。例如，相关系数的值接近 1，表示一个变量增加，另一个变量也增加；接近
    -1，表示一个变量增加，另一个变量减少。


    +   因果关系：一个变量真的影响另一个变量，即一个变量真的可以决定另一个变量的值。简单地说，如果变量 X 影响变量 Y，相关性只是 X 导致 Y 的原因之一（可能还有其他原因），而因果关系是指变量
    X 是变量 Y 的决定因素。至于要如何证明 2 个变量之间的因果关系，则需要使用第 12 章的检验。


    # 2. 相关系数


    相关系数是一种统计检验方法，可以测量 2 个变量之间线性关系的强度和方向。相关系数的公式是 x 和 y 的协方差除以 x 和 y 的标准差，如下所示：


    相关系数\(r_{xy} = \frac{S_{xy}}{S_x S_y}\)


    上述公式中，\(S_{xy}\) 是协方差，\(S_x\) 和 \(S_y\) 分别是变量 x 和 y 的标准差。


    使用第 13.1.1 节的数据，分别使用 NumPy 和 Pandas 包来计算相关系数（Python 程序：Ch13_1_3.py），如下所示：


    ```

    hours_phone_used = [0, 0, 0, 1, 1.3, 1.5, 2, 2.2, 2.6, 3.2, 4.1, 4.4, 4.4, 5]

    work_performance = [87, 89, 91, 90, 82, 80, 78, 81, 76, 85, 80, 75, 73, 72]


    x = np.array(hours_phone_used)

    y = np.array(work_performance)

    n = len(x)

    x_mean = x.mean()

    y_mean = y.mean()


    diff = (x-x_mean)*(y-y_mean)

    covar = diff.sum()/n

    print("协方差:", covar)


    corr = covar/(x.std()*y.std())

    print("相关系数:", corr)

    ```


    上述程序代码首先使用 NumPy 包计算相关系数，在计算出协方差后，调用 std() 函数计'
