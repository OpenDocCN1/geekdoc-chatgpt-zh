    图像识别本质上是个分类问题，也就是给计算机一张图像，让其给出图像所属的类别。在计算机中，类别往往也是用数字表示的。例如一个二分类问题，类别的标签就是0和1，无论分的是猫和狗，还是苹果和香蕉，都可以把其中一种类别标记为0，另一种标记为1。如果类别不止两类，那么就要使用更多数字，例如一个十分类问题，类别的标签就是0
    ~ 9这十个数字。但是直接使用数字作为标签会有个小问题，那就是数字之间有比较和算术关系，如2>1，5<7，3×3 = 9，而标签类别之间并没有这种比较关系，如苹果和香蕉是平级的，不存在苹果大于香蕉，或者梨是西瓜的2倍之类的关系。如果做分类问题时直接让计算机输出一个数字，数字自身的比较和算术关系会影响计算机的判断。所以通常我们会用一种叫独热编码（One
    Hot Encoding）的方法来代替数字。例如有10个类别，我们就会用10个0或1来表示任何一种类别，其中只有一个位置是1，其余位置都是0，哪一位


