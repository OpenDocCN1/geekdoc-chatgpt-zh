    # （二）Alpha-Beta 剪枝


    如前文所述，在极大极小算法中，每一层需要搜索的节点个数和层数是成指数相关的，所以通常能够搜索的最大深度并不会很大，这在很大程度上限制了算法的效果。为了改善算法的效率，可引入Alpha-Beta剪枝策略，它在某些情况下可以极大地减少一层中需要搜索的节点个数，同时完全不影响算法的准确性。人们通常把采用了Alpha-Beta剪枝策略的极大极小算法简称为Alpha-Beta搜索。实际上，它的核心思想十分简单：如果某个走法一定劣于已知的走法，那就不需要继续搜索它，而是可以把该走法代表的结点连同其子树直接剪去。


