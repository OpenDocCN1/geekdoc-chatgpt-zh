    \ = n x f(n - 1),在定义式中出现了阶乘函数本身。但为了不使这个自我指涉无限进行下去，必须指明递归的终止条件，例如f(1) = 1。编程中的递归函数与此类似，也是指在函数体中使用该函数自身的行为。\n\
