    \n### （二）在 Keras 中使用 VGG16\n\n首先我们导入一些必要的库。\n\n- cifar10: Keras库中包含的一个方便加载CIFAR-10数据集的类。\n\
    - VGG16: Keras中可以直接加载的VGG16模型。\n- preprocess_input: VGG16的输入预处理函数。\n- Model: Keras的模型类。\n\
    - numpy: Python中用于处理各种数值计算的库。\n\n```\n# 如果没有安装 keras 和 tensorflow 库\n# 请使用 pip\
    \ install keras tensorflow 安装\nimport keras\nfrom keras.datasets import cifar10\n\
    from keras.applications.vgg16 import VGG16, preprocess_input\nfrom keras.models\
    \ import Model\nimport numpy as np\n```\n\n载入CIFAR-10数据集并进行预处理。Keras 为每个预定义的架构提供了一个\
    \ preprocess_input 方法,用于对输入图像数据进行预处理,可以理解为用 preprocess_input 方法替代了将每个数字除以 255\
    \ 的操作。\n\n```\n(x_train, y_train), (x_test, y_test) = cifar10.load_data()\nx_train\
    \ = preprocess_input(x_train)\nx_test = preprocess_input(x_test)\ny_train = keras.utils.to_categorical(y_train)\n\
    y_test = keras.utils.to_categorical(y_test)\n```\n\n加载VGG16模型，并指定一些参数。\n\n- weights=None：使用随机初始化的权重。\n\
    - input_shape= (32, 32, 3)：指定输入数据的大小为32×32×3。\n- classes=10：指定类别的数量，CIFAR-10中一共有\
    \ 10 类物体。\n\n```\nmodel = VGG16(weights=None, input_shape=(32, 32, 3), classes=10)\n\
    ```\n\n我们使用随机梯度下降sgd优化器，定义损失函数为交叉熵，并使用准确度作为度量。\n\n```\nmodel.compile(optimizer=\"\
    sgd\", loss=\"categorical_crossentropy\", metrics=[\"accuracy\"])\n```\n\n使用fit函数训练模型。由于VGG16架构比较大，参数较多，训练会花费较多时间。\n\
    \n```\nmodel.fit(x_train, y_train, batch_size=256, epochs=50, validation_data=\n\
    (x_test, y_test))\n```\n\n```\n输出结果:\nTrain on 50000 samples, validate on 10000\
