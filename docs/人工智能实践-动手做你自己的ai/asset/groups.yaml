    \n## （二）生成网络\n\n首先构建生成网络。先定义一些常用的网络结构，以便于后续编写代码：\n\n```python\n# 用于初始化\nconv_init\
    \ = RandomNormal(0, 0.02)\n\ndef conv2d(f, *a, **k):\n    # ...\n    卷积层\n   \
    \ # ...\n    return Conv2D(f,\n        kernel_initializer = conv_init,\n     \
    \   *a, **k)\n\ndef batchnorm():\n    # ...\n    标准化层\n    # ...\n    return BatchNormalization(momentum=0.9,\
    \ epsilon=1.01e-5, axis=-1)\n```\n\n我们的生成网络采用了“残差网络”的结构，这种结构可以构建比较深的神经网络。残差网络的基本结构是一个“块”，它的代码如下：\n\
    \n```python\ndef res_block(x, dim):\n    # ...\n    残差网络\n    [x] --> [卷积] -->\
    \ [标准化] --> [激活] --> [卷积] --> [标准化] --> [+] --> [激活]\n     |                 \
    \                   ^\n     |                                    |\n     +------------------------------------+\n\
    \    # ...\n    x1 = conv2d(dim, 3, padding=\"same\", use_bias=True)(x)\n    x1\
    \ = batchnorm()(x1, training=1)\n    x1 = Activation('relu')(x1)\n    x1 = conv2d(dim,\
    \ 3, padding=\"same\", use_bias=True)(x1)\n    x1 = batchnorm()(x1, training=1)\n\
    \    x1 = Activation(\"relu\")(Add()([x, x1]))\n    return x1\n```\n\n### 残差网络\n\
    \n之所以要采用这样的结构，是因为神经网络的深度不是越深越好。\n\n![](img/9b291315612c9c478ad54afa29381fce_86_0.png)\n\
    \n更深的网络不意味着更好的性能\n\n从上图可以看出，56层的神经网络产生的误差反而比20层的要大，这与我们的直觉相违背。假设深层网络后面的几层网络都将输入原样输出，那么最差的情况也应该和浅层网络的误差一样。从这个想法出发，我们把网络设定为着重于训练偏离输入的小变化，这就是残差网络。假设网络的输出是H（x）=F（x）+x，那么残差网络着重学习的就是F（x）。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_86_1.png)\n\n残差网络的一个块\n\n残差网络就是由这样的块堆叠而成。这里使用的是卷积层，根据任务类型的不同，也可以换成任何加权型的层，例如全连接层等。\n\
    \n使用残差网络后，可以大大加深网络的深度，提升输出效果。在生成网络中，也采用了残差网络。\n\n## 延伸阅读\n\n### 批标准化层（Batch Normalization）\n\
    \n批标准化的作用是把一批数据归一化为平均值0，方差为1的数据。\n\n![](img/9b291315612c9c478ad54afa29381fce_87_0.png)\n\
    \n标准化的作用\n\n直观地看，标准化前的数据在分布上远离零点，一眼看上去感到它们都差不多，不太容易找出它们的内在差别。\n\n这种方法应用在激活函数上也是类似的。以tanh激活函数为例，tanh激活函数有一个特点，它的导数在0附近相对来说比较大，在小于-1或者大于1的区域，导数会非常快地减小。如果这个激活函数的输入数据分布非常不均衡，如都非常大，那么实际上在这个区域，曲线实际上非常平坦，导数非常小，激活函数就无法起到激活的作用。\n\
    \n而在标准化之后，数据的平均值被调整到0，而且每个数据离零点也不会太远，有利于激活函数发挥其作用。\n\n另外一种情况是，当输入数据中不同部分的量纲不同，或者不便直接进行比较、加减等运算时，也可以通过标准化来解决这些问题。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_87_1.png)\n\n标准化前后可能的数据分布（橙色区域）\n\n\
    生成网络是按照3层卷积层、9个残差网络block和3个反卷积层的结构堆叠而成。而反卷积运算可以帮助我们从小尺寸的特征图中生成大尺寸的图像。\n\n## 概念解析\n\
    \n### 反卷积层\n\n我们知道卷积层具有自己的步长，当步长大于1的时候，输出的尺寸小于输入尺寸。而反卷积层则相反，当反卷积层的步长大于1的时候，输出的尺寸大于输入尺寸。反卷积层可以视作卷积层的一种逆向操作，其运算规则和卷积层相似。反卷积层首先在输入数据之间填充，使输入的尺寸扩大，然后再用卷积核进行卷积运算，得到的输出尺寸有可能比原本的输入更大。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_88_0.png)\n\n反卷积运算\n\n有了残差网络和反卷积的知识，就更容易理解生成网络的结构了。\n\
    \n```python\ndef NET_G(ngf=64, block_n=6, downsampling_n=2, upsampling_n=2, image_size\
    \ = 256):\n    \"\"\"\n    生成网络\n    采用resnet结构\n\n    block_n为残差网络叠加的数量\n   \
    \ 论文中采用的参数为 若图像大小为128，采用6; 若图像大小为256，采用9\n\n    [第一层] 大小为7的卷积核 通道数量 3->ngf\n \
    \   [下采样] 大小为3的卷积核 步长为2 每层通道数量倍增\n    [残差网络] 9个block叠加\n    [上采样]\n    [最后一层]\
    \ 通道数量变回3\n    \"\"\"\n```\n\n```python\ninput_t = Input(shape=(image_size, image_size,\
    \ 3))\n# 输入层\n\nx = input_t\ndim = ngf\n\nx = conv2d(dim, 7, padding=\"same\"\
    )(x)\nx = batchnorm()(x, training = 1)\nx = Activation(\"relu\")(x)\n# 第一层\n```\n\
    \n```python\nfor i in range(downsampling_n):\n    dim *= 2\n    x = conv2d(dim,\
    \ 3, strides = 2, padding=\"same\")(x)\n    x = batchnorm()(x, training = 1)\n\
    \    x = Activation('relu')(x)\n# 下采样部分\n```\n\n```python\nfor i in range(block_n):\n\
    \    x = res_block(x, dim)\n# 残差网络部分\n```\n\n```python\nfor i in range(upsampling_n):\n\
    \    dim = dim // 2\n    x = Conv2DTranspose(dim, 3, strides = 2, kernel_initializer=conv_init,\
    \ padding=\"same\")(x)\n    x = batchnorm()(x, training = 1)\n    x = Activation('relu')(x)\n\
    # 上采样\n```\n\n```python\ndim = 3\nx = conv2d(dim, 7, padding=\"same\")(x)\nx =\
    \ Activation(\"tanh\")(x)\n# 最后一层\nreturn Model(inputs=input_t, outputs=x)\n```\n\
    \n## （三）判别网络\n\n判别网络的结构由几层卷积的叠加而成，比生成网络更简单。\n\n```python\ndef NET_D(ndf=64, max_layers\
    \ = 3, image_size = 256):\n    ...\n    判别网络\n    ...\n    input_t = Input(shape=(image_size,\
    \ image_size, 3))\n\n    x = input_t\n    x = conv2d(ndf, 4, padding=\"same\"\
    , strides=2)(x)\n    x = LeakyReLU(alpha = 0.2)(x)\n    dim = ndf\n\n    for i\
    \ in range(1, max_layers):\n        dim *= 2\n        x = conv2d(dim, 4, padding=\"\
    same\", strides=2, use_bias=False)(x)\n        x = batchnorm()(x, training=1)\n\
    \        x = LeakyReLU(alpha = 0.2)(x)\n\n    x = conv2d(dim, 4, padding=\"same\"\
    )(x)\n    x = batchnorm()(x, training=1)\n    x = LeakyReLU(alpha = 0.2)(x)\n\n\
    \    x = conv2d(1, 4, padding=\"same\", activation = \"sigmoid\")(x)\n    return\
    \ Model(inputs=input_t, outputs=x)\n```\n\n判别网络最后的输出并不是一个数，而是一个矩阵。这并不影响我们计算损失函数，我们只需要把损失函数中的0和1看作是和判别网络具有相同尺寸的矩阵就可以了。\n\
    \n我们可以使用一种新的激活函数——带泄露线性整流（LeakyReLU）。这个函数和线性整流（ReLU）非常相似，不同的是当x小于0时，带泄露线性整流函数的值并不是0，而仍然有一个较小的斜率。\n\
    \n(a) 线性整流函数 (ReLU)\n\n(b) 带泄露线性整流函数 (Leaky ReLU)\n\n## (四) 整体网络结构的搭建\n\n采用“类”的概念组织GAN的网络结构：\n\
    \n```python\ndef loss_func(output, target):\n    ...\n    损失函数\n    论文中提到使用平方损失更好\n\
    \    ...\n    return K.mean(K.abs(K.square(output-target)))\n\nclass CycleGAN(object):\n\
    \    def __init__(self, image_size=256, lambda_cyc=10, lrd = 2e-4, lrg = 2e-4,\
    \ ndf = 64, ngf = 64, resnet_blocks = 9):\n        ...\n\n        构建网络结构\n\n \
    \           cyc loss\n        +--------------------------------------+\n     \
    \   |         (CycleA)                     |\n        |   v                  \
    \                |\n        | realA -> [GB] -> fakeB -> [GA] -> recA |\n     \
    \   |   |           |                      |\n        |   |  +----------------------+\
    \        |\n        |   |  |                      |        |\n        |   v  v\
    \                      v        v |\n        | [DA] <CycleGAN>           [DB]\
    \      |\n        |   ^           ^               ^       |\n        |   |   \
    \        |               |       |\n        |   +----------------------+   | \
    \      |\n        |   |                      |   |       |\n        | recB <-\
    \ [GB] <- fakeA <- [GA] <- realB |\n        |   |           ^               |\
    \       |\n        |   |   (CycleB)|               |       |\n        |   +----------------------+\
    \   |       |\n        |           cyc loss           |\n        ...\n```\n"
