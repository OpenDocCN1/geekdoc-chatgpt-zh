    \ y_i |\\)\n```\n\n那么，对于生成网络，完整的损失函数为：\n\n```\n\\(L_1 = L_G + L_F + \\lambda(L_{cyc}^X\
    \ + L_{cyc}^Y)\\)\n```\n\n其中λ是一个可调的参数，控制着两类损失函数之间的比例。\n\n那么训练的算法为：取一张 X 类的图像和一张\
    \ Y 类的图像，把它们放入神经网络中计算，得到损失函数。再使用反向传播算法，调整 G、F 两个神经网络中的参数。这一步我们称作步骤一。\n\n先不要急着反复迭代这个过程，因为我们还要研究一下如何生成判别网络。只有让生成网络和判别网络同时进步，才能取得更好的效果。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_80_0.png)\n\n### （二）如何训练判别网络\n\n对于一个判别网络，它的能力体现在两方面：\n\
    \n- 1. 能把真的识别为真的。\n- 2. 能把假的识别为假的。\n\n从这个想法入手，我们可以很容易地设计一个损失函数：\n\n```\nL_{D_Y}^{real}\
    \ = (D_Y(y) - 1)^2\nL_{D_Y}^{fake} = (D_Y(G(x)) - 0)^2\nL_{D_Y} = L_{D_Y}^{real}\
    \ + L_{D_Y}^{fake}\n```\n\nL_{D_Y}^{real} 表示的是“把真的识别为真的”的能力，如果判别网络的输入是一张真实的 Y\
    \ 类图像 y，那么我们希望它的输出应该尽量接近 1；而 L_{D_Y}^{fake} 表示的是“把假的识别为假的”能力，如果判别网络的输入是一张生成网络生成的图像\
    \ G(x)，那么我们希望判别网络能把它“鉴别”出来，它的输出应该尽量接近 0。\n\n以上是神经网络 D_Y 的损失函数，而对于 D_X 损失函数也类似。对于判别器来说，整体的损失函数可以写成：\n\
    \n```\nL_2 = L_{D_X} + L_{D_Y}\n```\n\n训练的算法为：取一张 X 类的图像和一张 Y 类的图像，把它们放入神经网络中计算，得到这个损失函数。再使用反向传播算法，调整Dx、Dy两个神经网络中的参数。这一步我们称之为步骤二。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_81_0.png)\n\n### (三) 把它们合起来\n\n有了以上两个步骤的铺垫，整个网络的训练过程就是步骤一和步骤二的交叉迭代。在这个过程中，要做是最小化损失函数L1和L2，但最小化这两个损失函数的过程是矛盾的（从形式上就可以看出来）。这类似生成器和判别器之间的“角力”，生成器的生成能力越来越强，判别器的判别能力也就越来越强，最终两者会达成一个相对平衡，此时生成器和判别器都具备了一定的能力，这也是我们希望得到的结果。\n\
