    plt.show()\n```\n\n运行结果如下页图所示，可以看到MNIST数据集中包含了笔画轻重各异、书写风格不同的图像。数据集中的数据多样性很重要，只有计算机“见过”的数据越多，分类才越准确。直观上理解，若计算机“见过”的数字都是右撇子写的，这时给它一个由左撇子书写的数字，那么它大概率会识别错误；如果计算机曾经“见过”左撇子写的数字，那么它识别正确的可能性就会提升。\n\
