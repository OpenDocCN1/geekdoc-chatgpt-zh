    # 二、编码器-解码器


    ![](img/9b291315612c9c478ad54afa29381fce_120_0.png)


    最基础的seq2seq模型包含了3个主要的组成部分：编码器（encoder）、解码器（decoder）和连接它们的中间状态向量。编码器通过学习输入语句，将语句编码成一个固定大小的中间状态向量S（这个中间状态向量中包含了整个输入语句的语义信息），然后将S传给解码器，解码器再对状态向量进行解码并产生输出。


    举个例子，如果编码器和解码器都采用长短期记忆网络，那么S就是编码器最后一个时刻的隐状态和细胞状态，我们把它作为解码器第一个时刻神经元的初始隐状态和初始细胞状态，然后通过解码器对这个信号进行解码。


