    \n## 思考与实践\n\n3.1 你还能想到其他图像数据增强的变换方式吗？\n\n## 五、使用搭建好的卷积神经网络\n\n以上例子中都是我们自己搭建的卷积神经网络架构，架构的好坏很大程度上会决定算法的效果。许多计算机科学家会将他们发现的效果比较好的架构公开供他人使用。Keras中提供了许多预定义的神经网络架构，在本节中，我们将尝试使用一个经典的卷积神经网络架构——VGG16。\n\
    \n### （一）VGG16 简介\n\nVGG16网络由牛津大学的计算机科学家提出，并在 2014 年的 ImageNet 图像分类挑战赛中获得第二名。它的结构非常简洁，仅用到了\
