    \n像素级别梯度优化的结果\n\n## 第七章 生成对抗网络\n\n在本章中，我们将了解生成对抗网络，并使用一种特殊的生成对抗网络——CycleGAN来实现图像风格迁移。在这个过程中，我们也会学习神经网络中一些比较复杂的结构，如反卷积层、批标准化层和残差网络。\n\
    \n### 一、算法思想\n\n### (一) 协同进化——生成对抗网络\n\n![](img/9b291315612c9c478ad54afa29381fce_76_0.png)\n\
    \n猎豹只有跑得够快才能捕获猎物，羚羊因此也进化出更敏捷的身手。这是一种协同进化，生成对抗网络也是一个与此类似的过程\n\n在之前的方法中，每做一次风格迁移，都需要重新训练神经网络，十分麻烦。能否找到这样一种方式，可以在训练完之后，对于一张输入的图像，可以快速地产生一张特定风格的输出图像？\n\
    \n或许我们可以使用卷积神经网络。搭建一个卷积神经网络，训练它，使它可以生成和目标风格相似的图像。那么，怎么确定神经网络的目标函数？即如何在数学上描述一张图像是否符合图像目标的风格？又如何对神经网络的输出进行判别？这是一个很难但很关键的问题。\n\
    \n这个问题很难直接解决，但我们可以尝试用机器学习来解决。“如何判定一张图像是否符合某种风格？”这个问题本身可以被看作一个分类问题。可以采用之前学到的图像识别技术，建立一个新的神经网络对图像进行分类。如果能训练好这个判别网络，那就可以用这个网络去训练生成网络了。\n\
    \n如何训练这个判别网络就需要数据支持：其中一些是目标风格的图像，这些作为正例，打上标签“1”；另一些是由生成网络生成的“假”图像，打上标签“0”。在训练的过程中，这个判别网络不断提高自己区分“真的”目标风格的图像和生成出的“假”图像的能力。\n\
    \n有了这个判别网络之后，再去训练生成网络。生成网络在训练的过程中，使生成的图像不断地向目标风格靠近，让判别网络“认为”生成的图像更像是真正的目标风格的图像。即生成网络尝试去“造假”，用生成的图像“欺骗”判别网络。\n\
    \n而当生成网络“欺骗”的能力有一定的提高之后，原来的判别网络就不够用了，它很有可能被生成网络所“欺骗”。所以需要继续训练判别网络，使它能更好地“鉴别”真实的图像和“进化版”的生成网络产生的图像。如此循环往复，生成网络“欺骗”的能力越来越强，而判别网络“鉴别”的能力也越来越强。这两者协同进化，不断提高，最后得到令人满意的结果。这是一个对抗的过程，这种结构就被称为生成对抗网络（Generative\
    \ Adversarial Network），简称GAN。\n\n![](img/9b291315612c9c478ad54afa29381fce_77_0.png)\n\
    \n### （二） 无监督学习\n\n生成对抗网络是一种无监督学习（Unsupervised Learning）。顾名思义，无监督学习指的就是学习的时候没有“监督”。在上一部分的图像识别中，提供的数据里不仅包含输入数据（可以视作“问题”），还包含“答案”（图像的类）。我们让AI尝试回答“问题”，再与“答案”对照，根据回答的情况调整参数。这种“对答案”的学习方式就叫监督学习。而在生成对抗网络中，数据并没有经过标注，也就是说并不知道“答案”。这种情况下的机器学习就叫做无监督学习。\n\
    \n### （三） 要配对！CycleGAN\n\n这种单向的生成对抗网络效果并不好。这与输入的数据有关系。我们的输入数据是一些待转换的图像（输入到生成网络中）和一些目标风格的图像（输入到判别网络中），而这两个图像集合里的元素并没有一一对应的关系。如想要把自然风光的照片转化为带有莫奈风格的画，我们只能找到莫奈的画和自然风光照片两个图像的集合，而不可能找到与莫奈的画相对应的那张照片，即不能在这两者之间建立一一对应的关系。那么判别网络在对生成网络的输出进行评估的时候，并没有考虑到原图是怎么样的。假设一种极端的情况，输入一只猫的图像，生成网络生成一只“莫奈风格”的狗的图像，判别网络对这种现象并不能作出很好的区分。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_78_0.png)\n\n鉴于此，我们需要对网络结构作一些改进，来解决数据没有配对的问题。单向的\
    \ GAN 只是把 A 类图像转化为 B 类图像，为了建立一个配对的关系，我们可以再训练一个把 B 类图像转化为 A 类图像的 GAN。后一个 GAN 可以看作前一个\
    \ GAN 的逆变换。为了得到这个逆变换，可以这样训练这个网络：输入 A 类图像，转换成 B 类图像，再把它转换回 A 类图像，得到一张经过一轮“循环”之后的图像，然后比较输入图像和经过“循环”之后的图像，查看它们的相似情况。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_78_1.png)\n\n### 二、算法细节\n\n![](img/9b291315612c9c478ad54afa29381fce_78_2.png)\n\
    \n有了对于 CycleGAN 的初步感性认识后，我们需要用数学语言更精确地描述 CycleGAN，在此基础上找到训练 CycleGAN 的算法（以下内容可能会有一些枯燥，但是这非常重要）。\n\
    \n在上图（a）中，X、Y 分别表示两类图像的集合，CycleGAN 用 G、F、Dx、Dy 4 个函数来表示。G、F 实现生成功能，输入一张图像，输出也是一张图像；而\
    \ Dx、Dy 则负责判定，输入的这张图像与输出的图像属于相同类别的概率。这 4 个函数都由神经网络来实现。\n\n### （一）如何训练生成网络\n\n\
    图（b）和（c）表现了由 X 产生 Y 再回到 X 和由 Y 产生 X 再回到 Y 的过程。以图（b）为例，图中输入的图像是 x，经过了 G 的变换之后产生\
    \ \\(\\hat{y}=G（x）\\)，再将 \\(\\hat{y}\\) 送入判定网络 Dy 中，得到判定网络的输出 Dy (\\(\\hat{y}\\\
    )) = Dy (G（x）)。我们希望生成网络能够达成“以假乱真”的程度，即要让判定网络认为这是一张 Y 类图像的概率尽可能高，所以我们要让判定网络的输出尽量接近\
    \ 1。为了描述“接近”的程度，我们采用平方的形式（在 GAN 中更常用的是对数形式，但是 CycleGAN 的论文中提到使用平方形式效果更佳）：\n\n\
    ```\n\\(L_G = (D_Y(G(x)) - 1)^2\\)\n```\n\n这个 L 可以表征出“接近”程度，称为损失函数。训练过程就是尽量减小这个损失函数。对于（c）来说，也可以得到相似的损失函数：\n\
    \n```\n\\(L_F = (D_X(F(y)) - 1)^2\\)\n```\n\n但是，CycleGAN 中的一个重要部分是一个“循环”的过程，我们可以对比“循环”之后获得的图像和原图像之间的差别。图像在这里就是一个向量，就是一串数字。我们将这两个图像相同位置像素差的绝对值的和作为“循环”损失函数。令原来的图像为\
    \ x，“循环”之后的结果为 \\(\\hat{x}=F（G（x）），有：\n\n```\n\\(L_{cyc}^X = \\| \\hat{x} - x\
    \ \\|_1 = \\sum_i | \\hat{x_i} - x_i |\\)\n```\n\n对于对称的“循环”有：\n\n```\n\\(\\hat{y}\
    \ = G(F(y))\\)\n\\(L_{cyc}^Y = \\| \\hat{y} - y \\|_1 = \\sum_i | \\hat{y_i} -\
    \ y_i |\\)\n```\n\n那么，对于生成网络，完整的损失函数为：\n\n```\n\\(L_1 = L_G + L_F + \\lambda(L_{cyc}^X\
    \ + L_{cyc}^Y)\\)\n```\n\n其中λ是一个可调的参数，控制着两类损失函数之间的比例。\n\n那么训练的算法为：取一张 X 类的图像和一张\
    \ Y 类的图像，把它们放入神经网络中计算，得到损失函数。再使用反向传播算法，调整 G、F 两个神经网络中的参数。这一步我们称作步骤一。\n\n先不要急着反复迭代这个过程，因为我们还要研究一下如何生成判别网络。只有让生成网络和判别网络同时进步，才能取得更好的效果。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_80_0.png)\n\n### （二）如何训练判别网络\n\n对于一个判别网络，它的能力体现在两方面：\n\
    \n- 1. 能把真的识别为真的。\n- 2. 能把假的识别为假的。\n\n从这个想法入手，我们可以很容易地设计一个损失函数：\n\n```\nL_{D_Y}^{real}\
    \ = (D_Y(y) - 1)^2\nL_{D_Y}^{fake} = (D_Y(G(x)) - 0)^2\nL_{D_Y} = L_{D_Y}^{real}\
    \ + L_{D_Y}^{fake}\n```\n\nL_{D_Y}^{real} 表示的是“把真的识别为真的”的能力，如果判别网络的输入是一张真实的 Y\
    \ 类图像 y，那么我们希望它的输出应该尽量接近 1；而 L_{D_Y}^{fake} 表示的是“把假的识别为假的”能力，如果判别网络的输入是一张生成网络生成的图像\
    \ G(x)，那么我们希望判别网络能把它“鉴别”出来，它的输出应该尽量接近 0。\n\n以上是神经网络 D_Y 的损失函数，而对于 D_X 损失函数也类似。对于判别器来说，整体的损失函数可以写成：\n\
    \n```\nL_2 = L_{D_X} + L_{D_Y}\n```\n\n训练的算法为：取一张 X 类的图像和一张 Y 类的图像，把它们放入神经网络中计算，得到这个损失函数。再使用反向传播算法，调整Dx、Dy两个神经网络中的参数。这一步我们称之为步骤二。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_81_0.png)\n\n### (三) 把它们合起来\n\n有了以上两个步骤的铺垫，整个网络的训练过程就是步骤一和步骤二的交叉迭代。在这个过程中，要做是最小化损失函数L1和L2，但最小化这两个损失函数的过程是矛盾的（从形式上就可以看出来）。这类似生成器和判别器之间的“角力”，生成器的生成能力越来越强，判别器的判别能力也就越来越强，最终两者会达成一个相对平衡，此时生成器和判别器都具备了一定的能力，这也是我们希望得到的结果。\n\
    \n## 三、代码实现\n\n在实现生成对抗网络的过程中，使用到Python中“类”的概念。我们可以把类看作一种工具。一种类就是完成一种任务的工具，它包含了完成这种任务的一些数据和处理这些数据的方法。\n\
    \n- 导入一些需要的库：\n  - PIL (Pillow)：图像处理库，用于保存中间的快照。\n  - glob：获取目录下所有文件名，用于获取数据。\n\
    \  - random：用于产生随机数。\n  - time：用于计时。\n- 还有一些神经网络中的层：\n  - Conv2D：2维卷积层。\n  - BatchNormalization：批标准化层。\n\
    \  - Add：加法层。\n  - Conv2DTranspose：反卷积层。\n"
