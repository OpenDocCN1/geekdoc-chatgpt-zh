    # 四、优化与改进


    此外，Deep Q-Network算法对传统的Q-learning进行了一些改进，其中主要的有经验回放和目标网络。


    # （一）经验回放


    由于Q值网络的训练数据是智能体在环境中采集的，而智能体与环境的交互是一串连续的轨迹，因此训练样本之间有相关性，把它们直接作为Q值网络的输入会导致不好的训练效果，所以人们引入经验回放（Experience
    Replay），即把训练数据存储在经验池中，用随机采样的方式从经验池中抽取样本，采集得到的样本可能出自智能体的不同运行轨迹，从而降低它们的相关性，这有助于Q值网络的训练。


    # （二）目标网络


    在智能体学习过程中，每次训练都会改变Q值网络的参数，而作为训练标签的目标Q值是Q值网络输出的，变化的参数导致数据的标签不断地改变，这会降低训练的稳定性，因此人们提出目标网络（Target
    Q-Network）的改进，即用另一个固定的Q值网络输出目标Q值，它不会在训练中被频繁改变，每隔一段时间把当前网络的参数同步给目标网络，以巩固学习结果。


