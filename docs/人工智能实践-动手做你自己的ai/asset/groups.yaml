    # ## (二) 博弈树


    我们从简化版的角斗士棋开始。棋盘缩小到6x6，玩家的棋子也减少了许多，但规则仍和原来一样。这样的简化对提高角斗士棋的水平并无意义，单纯是为了更好地理解算法的概念。


