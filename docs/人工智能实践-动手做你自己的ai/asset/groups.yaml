    \ [['小明', '小芳', '小华'], [12, 13, 11]]。类似的道理,在这里我们把经验池中的一列状态转移展开,分别得到状态、动作、奖励、下一个状态的列表。注意,两个状态列表中的数据仍然是State类型,需要继续把它转换成numpy数组。\n\
    \n```\ndef get_training_sample(self, memory_slices):\n    # 将一批记忆(s, a, r, s')的展开为s,\
    \ a, r, s'，将它们解压缩为若干列表,\n    [state_list, action_list, reward_list, next_state_list]\
