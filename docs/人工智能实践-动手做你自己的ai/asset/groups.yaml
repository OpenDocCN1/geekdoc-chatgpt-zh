    有了对于 CycleGAN 的初步感性认识后，我们需要用数学语言更精确地描述 CycleGAN，在此基础上找到训练 CycleGAN 的算法（以下内容可能会有一些枯燥，但是这非常重要）。


    在上图（a）中，X、Y 分别表示两类图像的集合，CycleGAN 用 G、F、Dx、Dy 4 个函数来表示。G、F 实现生成功能，输入一张图像，输出也是一张图像；而
    Dx、Dy 则负责判定，输入的这张图像与输出的图像属于相同类别的概率。这 4 个函数都由神经网络来实现。


    # （一）如何训练生成网络


    图（b）和（c）表现了由 X 产生 Y 再回到 X 和由 Y 产生 X 再回到 Y 的过程。以图（b）为例，图中输入的图像是 x，经过了 G 的变换之后产生
    $\hat{y}=G（x）$，再将 $\hat{y}$ 送入判定网络 Dy 中，得到判定网络的输出 Dy ($\hat{y}$) = Dy (G（x）)。我们希望生成网络能够达成“以假乱真”的程度，即要让判定网络认为这是一张
    Y 类图像的概率尽可能高，所以我们要让判定网络的输出尽量接近 1。为了描述“接近”的程度，我们采用平方的形式（在 GAN 中更常用的是对数形式，但是 CycleGAN
    的论文中提到使用平方形式效果更佳）：


    ```

    \(L_G = (D_Y(G(x)) - 1)^2\)

    ```


    这个 L 可以表征出“接近”程度，称为损失函数。训练过程就是尽量减小这个损失函数。对于（c）来说，也可以得到相似的损失函数：


    ```

    \(L_F = (D_X(F(y)) - 1)^2\)

    ```


    但是，CycleGAN 中的一个重要部分是一个“循环”的过程，我们可以对比“循环”之后获得的图像和原图像之间的差别。图像在这里就是一个向量，就是一串数字。我们将这两个图像相同位置像素差的绝对值的和作为“循环”损失函数。令原来的图像为
    x，“循环”之后的结果为 $\hat{x}=F（G（x）），有：


    ```

    \(L_{cyc}^X = \| \hat{x} - x \|_1 = \sum_i | \hat{x_i} - x_i |\)

    ```


    对于对称的“循环”有：


    ```

    \(\hat{y} = G(F(y))\)

    \(L_{cyc}^Y = \| \hat{y} - y \|_1 = \sum_i | \hat{y_i} - y_i |\)

    ```


    那么，对于生成网络，完整的损失函数为：


    ```

    \(L_1 = L_G + L_F + \lambda(L_{cyc}^X + L_{cyc}^Y)\)

    ```'
  - '[PAGE 80]


    其中λ是一个可调的参数，控制着两类损失函数之间的比例。


    那么训练的算法为：取一张 X 类的图像和一张 Y 类的图像，把它们放入神经网络中计算，得到损失函数。再使用反向传播算法，调整 G、F 两个神经网络中的参数。这一步我们称作步骤一。


    先不要急着反复迭代这个过程，因为我们还要研究一下如何生成判别网络。只有让生成网络和判别网络同时进步，才能取得更好的效果。


    ![](img/9b291315612c9c478ad54afa29381fce_80_0.png)


    # （二）如何训练判别网络


    对于一个判别网络，它的能力体现在两方面：


    +   1. 能把真的识别为真的。

    +   2. 能把假的识别为假的。


    从这个想法入手，我们可以很容易地设计一个损失函数：


    ```

    L_{D_Y}^{real} = (D_Y(y) - 1)^2

    L_{D_Y}^{fake} = (D_Y(G(x)) - 0)^2

    L_{D_Y} = L_{D_Y}^{real} + L_{D_Y}^{fake}

    ```


    L_{D_Y}^{real} 表示的是“把真的识别为真的”的能力，如果判别网络的输入是一张真实的 Y 类图像 y，那么我们希望它的输出应该尽量接近 1；而
    L_{D_Y}^{fake} 表示的是“把假的识别为假的”能力，如果判别网络的输入是一张生成网络生成的图像 G(x)，那么我们希望判别网络能把它“鉴别”出来，它的输出应该尽量接近
    0。


    以上是神经网络 D_Y 的损失函数，而对于 D_X 损失函数也类似。对于判别器来说，整体的损失函数可以写成：


    ```

    L_2 = L_{D_X} + L_{D_Y}

    ```


    训练的算法为：取一张 X 类的图像和一张 Y 类的图像，把它们放入神经网络中计算，得到'
  - '[PAGE 81]


    这个损失函数。再使用反向传播算法，调整Dx、Dy两个神经网络中的参数。这一步我们称之为步骤二。


    ![](img/9b291315612c9c478ad54afa29381fce_81_0.png)


    # ## (三) 把它们合起来


    有了以上两个步骤的铺垫，整个网络的训练过程就是步骤一和步骤二的交叉迭代。在这个过程中，要做是最小化损失函数L1和L2，但最小化这两个损失函数的过程是矛盾的（从形式上就可以看出来）。这类似生成器和判别器之间的“角力”，生成器的生成能力越来越强，判别器的判别能力也就越来越强，最终两者会达成一个相对平衡，此时生成器和判别器都具备了一定的能力，这也是我们希望得到的结果。


