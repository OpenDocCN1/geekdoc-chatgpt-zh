    # 四、蒙特卡罗树搜索


    在类似于极大极小搜索的算法中，我们所做的事情实际上可以概括为：深度优先地探索整棵由可能情况组成的树至某一预先设定的深度，再对搜索到的局面进行估值，最后按照极大极小准则选择下一步的走法。这是一个十分优秀而通用的方案，但是仍有很多不足的地方。首先，它从根本上不可避免地需要一个人为设定的估价函数；其次，哪怕是在使用Alpha-Beta剪枝之后，搜索整棵树的开销仍然可能是难以接受的，从而限制了整体可以搜索的深度。这两点实际上在一定程度上有所关联：之所以需要一个人为设定的估价函数，其根本原因是无法直接穷举搜索直至游戏结束的局面。既然如此，为什么不有选择地探索其中一部分子树以降低搜索开销呢？蒙特卡罗树搜索算法(Monte
    Carlo Tree Search, MCTS)就采用了这种思路。


    由于蒙特卡罗树搜索所牵涉的数据结构较为复杂，为了不进一步增加理解难度，我们只对算法的思路进行了解。


    # (一) 搜索树扩展


    对于蒙特卡罗树搜索，这里主要了解选择下一步探索子树的方法，即搜索树的扩展，最终决策的方式留至以后探索。在学习本书的过程中，你应当始终在脑海中保留着一个没有被完全扩展开的搜索树的图像。


    +   蒙特卡罗树搜索的搜索树扩展，简单而由 4 个部分组成：

    +   ■ 选择：从已经扩展出的节点中选择一个节点。

    +   ■ 扩展：选择该节点的一个子节点加入到已有的搜索树中。

    +   ■ 模拟：对于该子节点进行一次模拟。

    +   ■ 反向传播：根据模拟的结果更新搜索树上各个节点的值。


