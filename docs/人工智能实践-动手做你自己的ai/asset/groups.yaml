    # 一、算法思想


    卷积神经网络在计算机视觉领域有着广泛的应用，例如人脸识别、图像分类、无人驾驶等。在第一部分的图像识别项目中，相信你已经体会到卷积神经网络的神奇魅力。有趣的是，以图像识别为目的训练出来的卷积神经网络也可以用于图像风格迁移。因为，为了完成图像识别的任务，卷积神经网络必须
    “理解” 图像，从图像中提取特征。一般来说，卷积层的特征图（feature map）蕴含着这些特征，对特征图进行适当的处理，就可以提取出图像的内容表示（content
    representations）和风格表示（style representations），进而进行图像风格迁移。


