    ## 第十六章 Q-learning


    本章中我们将了解求解最优策略的思路和方法、无模型强化学习的概念、平衡探索与利用的原因和方式，学习Q-learning算法，并理解Q-learning算法中通过求解最优动作值函数取得最优策略的思路。


    ### 一、贝尔曼方程


    从回报 \( G_t \) 的公式可以看出，智能体直到完成与环境交互的整个过程后，才能拥有全部的奖励来为途经的状态计算回报，这为智能体的学习带来了诸多限制。我们想到在给定策略下，下一个状态只取决于当前状态，那么当前状态的价值应当可以由下一个状态的价值来反映。根据这一思想，将回报的定义代入状态值函数的式子：


    ```

    \( V_\pi(s) = \mathbb{E}_{\pi} [ G_t \mid S_t = s ] \)

    \( = \mathbb{E}_{\pi} [ R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \cdots \mid
    S_t = s ] \)

    \( = \mathbb{E}_{\pi} [ R_{t+1} + \gamma ( R_{t+2} + \gamma R_{t+3} + \cdots )
    \mid S_t = s ] \)

    \( = \mathbb{E}_{\pi} [ R_{t+1} + \gamma G_{t+1} \mid S_t = s ] \)

    \( = \mathbb{E}_{\pi} [ R_{t+1} + \gamma V_\pi( S_{t+1} ) \mid S_t = s ] \)

    ```


    从公式 \( V_\pi(s) = \mathbb{E}_{\pi} [ R_{t+1} + \gamma V_\pi( S_{t+1} ) \mid S_t
    = s ] \) 中可以看到，遵循策略π的智能体可以通过当前的奖励和下一个状态的价值的期望来评估当前状态的价值，这个相邻状态的状态值函数满足的关系叫作贝尔曼方程（Bellman
    Equation）。类似的，对动作值函数也有如下所示的贝尔曼方程：


    ```

    \( Q_{\pi}(s, a) = \mathbb{E}_{\pi} [ R_{t+1} + \gamma Q_{\pi}(S_{t+1}, A_{t+1})
    \mid S_t = s, A_t = a ] \)

    ```


    其中，下一个时刻的状态 \( S_{t+1} \) 和动作 \( A_{t+1} \) 是由环境的状态转移和智能体的策略一起决定的。


    ### 二、最优策略与最优价值函数


    强化学习的目标是寻找最大化回报的策略，人们称之为最优策略。对于有限的马尔可夫决策过程，总存在至少一个最优策略。所有的最优策略都对应着同一个最优价值函数，因此我们可以将最优策略不加区分地记作π*，将最优价值函数写作$V_*$和$Q_*$。由于智能体在任何初始条件下都能依靠最优策略获得最大的回报，所以任意状态的最优状态值函数是所有可能策略的状态值函数中最高的。


    ```

    $V_*(s) = \max_\pi V_\pi(s)$

    ```


    类似地对任意一对状态和动作 $(s, a)$，都有：


    ```

    $Q_*(s, a) = \max_\pi Q_\pi(s, a)$

    ```


    因为$V_*$是最优策略$\pi_*$的状态值函数，它也满足贝尔曼方程，也就是说$V_*(s)$ 可以由后续状态的价值函数来表达，又因为$V_*(s)$ 的取值是最优的，我们可以推断出$\pi_*$在状态$s$处选择了拥有最大$Q$值的动作，以最大化后续的回报。因此，得到下面的式子：


    ```

    $V_*(s) = \max_a Q_*(s, a)$

    ```


    对动作值函数采用类似的想法，因为$Q_*(s, a)$ 是最优的，$\pi_*$需要采取最大化$Q$值的动作。


    ```

    $Q_*(s, a) = \mathbb{E} [R_{t+1} + \gamma \max_{a''} Q_*(S_{t+1}, a'') \mid S_t
    = s, A_t = a]$

    ```


    上述关于$V_*(s)$和$Q_*(s, a)$的方程是贝尔曼最优性方程(Bellman Optimality Equation)，它的重要意义在于：


    - (1) 贝尔曼最优性方程使得最优价值函数的求解不依赖于最优策略。我们在不知道最优策略的情况下，也可以直接求解最优价值函数。

    - (2) 只要拥有了最优价值函数，就可以通过选择对应最大$Q_*(s, a)$ 的动作来生成最优策略。


    贝尔曼最优性方程带来了求解最优策略的一种思路——通过求解最优价值函数，以价值的形式反映各个状态与动作的优劣，智能体便可以做出高价值的动作来最大化它的回报。


    ### 三、无模型的强化学习


    强化学习的目标是最大化回报，而回报的获得依赖于智能体的策略以及环境根据动作而改变的机制。强化学习可以根据智能体“是否懂得环境变化的机制”被分为基于模型（Model-based）和无模型（Model-free）两大类。其中无模型的强化学习意味着环境模型对于智能体来说是未知的。环境在智能体的眼中成为提供奖励的黑盒子，智能体无法预判它的行动将会导致什么状态，只得依靠与环境的大量交互，在纯粹的试错过程中寻找完成任务的最佳策略。


    在本部分中，智能红绿灯属于无模型的强化学习。为什么环境模型对它来说是未知的呢？因为在智能体作出调整红绿灯的决策后，它无法预测调整红绿灯之后驾驶员们会做出什么反应以及车流会如何改变，因此它无法洞察环境运行的机制。Q-learning和Deep
    Q-Network是解决该类无模型问题的经典算法。


    注意，在没有环境模型的情况下，状态值函数V*(s)将不能指导策略的选取，因为即使智能体知道接下来可达的状态拥有很高的价值，由于缺少环境模型作为桥梁，它也不知道应该通过什么样的动作到达目标状态，因此应当直接学习动作值函数Q*(s,
    a)。正如下面的式子所表示的，智能体会选择有着最高Q值的动作以获得最丰厚的回报。


    ```

    $$\pi_*(s) = \text{argmax}_a Q_*(s, a)$$

    ```


    ### 延伸阅读


    ### 基于模型的强化学习


    倘若你正在学习驾驶，希望让汽车平稳地运行在道路中央。你知道油门、刹车、方向盘会如何改变汽车行进的轨迹，因此会在脑中模拟不同的操纵汽车方式，并去预测它们带来的各种行车轨迹，最终，你选择了预测中那条最平稳的行车轨迹，并实施了带来该行车轨迹的最优行车方式，这就是基于模型的控制问题。基于模型的强化学习可以通过环境模型来预测做出动作后到达的状态，这为它带来了独到的优势，模型的存在减少了在真实环境中试错的需求，为强化学习在实际问题中的训练与应用提供了基础。


    ### 四、探索与利用


    在无模型的情况下，智能体对环境的所有认知都来自于交互的实际经验，它只有尝试过各种行为才能客观公正地了解整个环境。智能体需要积极探索（Exploration）未知的状态和动作，因为或许会有蕴藏着丰厚奖励的动作尚未被发现。然而智能体也需要充分利用（Exploitation）已学得的策略，来最优化回报。探索与利用的平衡是强化学习中的重要问题。


    应对探索与利用问题的最简单方法是使用 $\epsilon-greedy$ 策略，这种策略由以下两部分构成：


    - (1) 随机选择动作。

    - (2) 选择当前Q值最大的动作，这个策略被称之为贪心策略。


    采取随机的动作就是探索未知，有利于更新出更大的Q值，学得更好的策略；而使用贪心策略则是利用学得的Q值，让智能体获得当前最大的收益。在 ε-greedy策略中，ε
    是选取随机动作的概率，一般设置为一个不大的值，让智能体始终维持较小程度的探索。


    ### 五、Q-learning 算法


    Q-learning是强化学习中一种简单、经典的算法。它的思路是先让智能体基于最优贝尔曼方程学得最优动作值函数，再由此间接生成最优策略。其中智能体面临无模型的环境，通过与环境的交互收集数据。


    在了解算法之前，我们先认识Q值的存储与表示。使用Q值表格是简单直观的想法，以下表为例，每个状态占据一行，列代表动作，每个单元格存放着一对状态和动作对应的Q值。


    Q值表格


    | | a₁ | a₂ | a₃ |

    |---|---|---|---|

    | s₁ | Q(s₁, a₁) | Q(s₁, a₂) | Q(s₁, a₃) |

    | s₂ | Q(s₂, a₁) | Q(s₂, a₂) | Q(s₂, a₃) |

    | s₃ | Q(s₃, a₁) | Q(s₃, a₂) | Q(s₃, a₃) |


    用Q-learning的方式来更新上表的Q值。首先把Q值表格设置为任意的初值，假设初始化后的Q值表格如下表所示。


    初始化后的Q值表格


    | | a₁ | a₂ | a₃ |

    |---|---|---|---|

    | s₁ | 2 | 0 | 3 |

    | s₂ | 1 | 0 | -2 |

    | s₃ | 2 | -1 | 0 |


    随后假设智能体从状态s2出发，用 ε-greedy策略选择了动作a1，到达状态s3，得到奖励1。智能体根据公式Q(s, a) ← (1-α)Q(s, a)
    + α(r+γmax_a Q(s'',a)) 来更新Q值表格。


    上式中各字母的意思如下：


    状态转移 (s, a, s'', r)：智能体与环境的一次交互，在初始状态s做出动作a，环境转移到状态s''，并给予智能体奖励r。


    折扣因子γ：在计算回报过程中，考虑未来奖励的权重递减。


    学习率 α：学习率的取值范围为 α ∈ (0, 1)，它表示了一次更新中 Q(s, a) 被更新的比例。α 越大表示 Q 值表格中的值越容易被改变。


    这个公式的意思是说，被更新后的 Q(s, a) 是一个加权平均，其中保留 $(1-\alpha)$ 比例的先前 $Q(s, a)$，再加上 $\alpha$
    比例的更新目标，其中智能体的更新目标是当前奖励 $r$ 加上折损后的从一个状态 $s''$ 中可选的最大 Q 值。


    将公式应用在这个例子当中即为：


    ```

    $Q(s_2, a_1) = (1 - \alpha) \times 1 + \alpha(1 + \gamma \times 2) = 1 + 2\gamma\alpha$

    ```


    所以将表格中 $s_2$ 与 $a_1$ 对应的 Q 值更新为 $1+2\gamma\alpha$。


    反复这样的操作，Q 值在试验中被不断地更新，最终逼近最优 Q 值，智能体也就因此间接地获得最优策略。


    ### 思考与实践


    - 16.1 除了本章提到的策略之外，你还能举出其他在利用当前最优动作的同时兼顾探索环境的方式吗？

    - 16.2 请尝试举出基于模型的强化学习在实际场景中的典型应用。


    ## 第十七章 Deep Q-Network


    在本章中我们将从Q-learning算法实际应用时的局限性出发，了解价值函数估计的概念和作用，进而探索Deep Q-Network算法，理解Deep Q-Network怎样克服Q-learning的不足，并掌握Q值网络的结构与训练流程。


    ### 一、维度灾难


    在Q-learning算法中，我们用表格存储动作值函数，但是在实际问题中，表格无法应对多如繁星的状态，也缺少举一反三的智能，这被称之为维度灾难。


    实际问题中状态的数量常常难以穷尽，在智能红绿灯的状态表示中，假定每条道路最多有50辆等待车辆和运行车辆，那么智能体可能的状态数可以是 \(9 \times
    50^{2 \times 12} \approx 5 \times 10^{41}\)，如果全用表格来存储，恐怕计算机有再大的内存也不够。


    ![](img/9b291315612c9c478ad54afa29381fce_165_0.png)


    高维度空间中智能体与环境的交互轨迹难以覆盖所有状态


    在浩如烟海的状态面前，智能体没有办法在训练中见识所有的情况，这就要求它能够联想到相似状态下的经验，从而在陌生的状态下做出合理的动作。但是表格中的各个状态都彼此独立、互不相关，智能体没有任何举一反三的能力。在下图所示的CityFlow的路口状态中，即使智能体学习到面对左下图情形应该放行南北方向道路，但面对场景极其相似的右下图情形却并不能有所帮助，因为在右下图的红框中缺失的车辆使得这两个状态的Q值被存储在表格的不同单元格中。


    ![](img/9b291315612c9c478ad54afa29381fce_166_0.png)


    相似的交通状态示例


    ### 二、价值函数估计


    人们用价值函数估计(Value Function Approximation)的方式来解决维度灾难的问题，也就是用函数取代表格来表达状态和动作到Q值的对应关系，即Q(s，a)
    = f(s，a)，其中f可以是任意形态的函数。之所以叫估计，是因为Q值的分布不受限制，而f的参数和形态受到模型的约束，因而只能做到对Q值的近似拟合。


    设想一个简单线性近似的例子。假设智能体的状态用横坐标x表示，状态对应的价值函数是纵坐标y。智能体和环境交互的过程中探索到一部分状态的价值，如下图中散点所示。从


    ![](img/9b291315612c9c478ad54afa29381fce_166_1.png)


    状态价值函数估计示例


    中可以发现，与其用表格法将这些散点的坐标全部记录下来，不如使用图中蓝色直线来近似拟合它们。我们只需要存储直线的斜率和截距，就能对没有见过的状态x所对应的y值进行合理推断。由此拓展出去，可以使用神经网络来拟合更加复杂的函数关系，以解决维度灾难的问题。


    ### 三、Deep Q-Network 算法


    在机器学习中，有一种方法对拟合函数很在行，那就是神经网络。在 Q-learning 算法上配备使用神经网络实现价值函数估计后，Deep Q-Network
    算法便应运而生了。


    我们知道，网络需要训练才能预测出准确的值，那么神经网络是如何被训练的呢？与监督学习不同，我们不知道可作为训练标签的正确的 Q 值，回想在 Q-learning
    当中，是依靠当前的奖励和下一个状态的 Q 值作为目标 Q 值来更新当前的 Q 值的，我们可借用这样的思想为 Q 值网络提供带标签的训练样本。具体地说，对每一次状态转移
    (s, a, s’, r)，把状态 s 作为网络的输入，Q 值网络输出各个动作对应的 Q 值，对于被采取的动作 a，使用 Q-learning 算法的更新公式，将
    r+γmax_a Q (s’, a’) 作为训练标签，从而损失函数被设置为：$L(w) = E[[r + \gamma \max_a Q(s'', a'',
    w) - Q(s, a, w)]^2]$。


    因为 Q 值网络也会输出不被更新的其他动作，我们将这些动作的训练标签设为当前 Q 值本身，使得损失为 0，不参与训练。


    智能体使用 ε-greedy 策略收集交互数据，在 Q 值网络上对上述损失函数进行梯度下降，以便能够在高维状态上有效估计最优动作值函数、学习最优策略。至此
    Deep Q-Network 算法就基本成型了。


    下图展示了 Deepmind 使用 Deep Q-Network 算法训练智能体玩 Atari 游戏的 Q 值网络结构。Q 值网络可以直接接受像素图像的输入，输出当前状态下各键位的
    Q 值。


    ![](img/9b291315612c9c478ad54afa29381fce_167_0.png)


    使用 Deep Q-Network 算法玩 Atari 游戏时的 Q 值网络结构


    ### 四、优化与改进


    此外，Deep Q-Network算法对传统的Q-learning进行了一些改进，其中主要的有经验回放和目标网络。


    ### （一）经验回放


    由于Q值网络的训练数据是智能体在环境中采集的，而智能体与环境的交互是一串连续的轨迹，因此训练样本之间有相关性，把它们直接作为Q值网络的输入会导致不好的训练效果，所以人们引入经验回放（Experience
    Replay），即把训练数据存储在经验池中，用随机采样的方式从经验池中抽取样本，采集得到的样本可能出自智能体的不同运行轨迹，从而降低它们的相关性，这有助于Q值网络的训练。


    ### （二）目标网络


    在智能体学习过程中，每次训练都会改变Q值网络的参数，而作为训练标签的目标Q值是Q值网络输出的，变化的参数导致数据的标签不断地改变，这会降低训练的稳定性，因此人们提出目标网络（Target
    Q-Network）的改进，即用另一个固定的Q值网络输出目标Q值，它不会在训练中被频繁改变，每隔一段时间把当前网络的参数同步给目标网络，以巩固学习结果。


    下图展示了改进后 Deep Q-Network 算法的训练过程。


    ![](img/9b291315612c9c478ad54afa29381fce_168_0.png)


    使用经验回放和目标网络的 Deep Q-Network 训练过程


    ![](img/9b291315612c9c478ad54afa29381fce_168_1.png)


    论文。作者向大家展示了使用Deep Q-Network的强化学习智能体在只接收屏幕像素作为状态，以游戏分数作为奖励的情况下，成功地学会玩2 600个不同的Atari游戏，并在其中一些游戏中取得超越人类的惊人成绩。更了不起的是，该智能体在相同的算法和网络结构下，在这些规则和内容各异的Atari游戏中普遍取得优异的成果。

