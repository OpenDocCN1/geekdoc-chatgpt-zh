    \n# 将模型每一层的名字和输出放到一个字典里\noutput_dict = dict([(layer.name, layer.output) for layer\
    \ in model.layers])\n```\n\n### （二）计算损失函数\n\n如果损失函数中只有内容损失和风格损失，那么生成图像有可能会过度拟合原图的内容或者风格，使得生成图像的相邻像素之间差异较大，看起来不自然，这种现象被称为“过拟合”。为了防止这种现象，保证图像局部的一致性，我们引入总变化损失(total\
    \ variation loss)的概念。因此，最终的损失函数是内容损失、风格损失和总变化损失的加权平均。\n\n设置各损失函数的权重。\n\n```\n\
    # 设置内容损失、风格损失和总变化损失各自的权重\ncontent_weight = 0.5\nstyle_weight = 1.0\ntotal_variation_weight\
    \ = 1.0\n\n# 设置总损失\nloss = K.variable(0.0)\n```\n\n### 思考与实践\n\n6.1 你可以尝试赋予各损失函数不同的权重比例，观察其对生成图像的影响。\n\
    \n计算内容损失并加到总损失中。\n\n```\n# 计算内容损失\ndef get_content_loss(content_features, output_features):\n\
    \    return 0.5 * K.sum(K.square(output_features - content_features))\n\n# 取conv4_2的输出作为内容表示\n\
    layer_feat = output_dict['block4_conv2']\ncontent_feat = layer_feat[0, :, :, :]\n\
    output_feat = layer_feat[2, :, :, :]\n# 将内容损失加入到总损失中\nloss += content_weight *\
    \ get_content_loss(content_feat, output_feat)\n```\n\n计算风格损失并加到总损失中。\n\n```\n\
    # 计算图像张量的格拉姆矩阵，用于捕捉图像的风格\ndef get_gram_matrix(x):\n    if K.image_data_format()\
    \ == 'channels_first':\n        feature_matrix = K.batch_flatten(x)\n    else:\n\
    \        feature_matrix = K.batch_flatten(K.permute_dimensions(x, (2, 0, 1)))\n\
    \    gram_matrix = K.dot(feature_matrix, K.transpose(feature_matrix))\n    return\
    \ gram_matrix\n\n# 计算单个卷积核的风格损失\ndef get_style_loss(style_features, output_features):\n\
    \    G = get_gram_matrix(style_features)\n    A = get_gram_matrix(output_features)\n\
    \    if K.image_data_format() == 'channels_first':\n        channel_number = int(style_features.shape[0])\n\
    \        size = int(style_features.shape[1] * style_features.shape[2])\n    else:\n\
    \        channel_number = int(style_features.shape[2])\n        size = int(style_features.shape[0]\
    \ * style_features.shape[1])\n    return K.sum(K.square(G - A)) / (4. * (channel_number\
    \ ** 2) * (size ** 2))\n```\n\n```\n# 选择conv1_1, conv2_1, conv3_1, conv4_1, conv5_1五个卷积层的输出计算风格损失\n\
    layer_names = ['block1_conv1', 'block2_conv1',\n    'block3_conv1', 'block4_conv1',\n\
    \    'block5_conv1']\n\n# 计算各个卷积层的风格损失并加入到总损失中\nfor layer_name in layer_names:\n\
    \    layer_feat = output_dict[layer_name]\n    style_feat = layer_feat[1, :, :,\
    \ :]\n    output_feat = layer_feat[2, :, :, :]\n    single_style_loss = get_style_loss(style_feat,\
    \ output_feat)\n    loss += (style_weight / len(layer_names)) * single_style_loss\n\
    ```\n\n计算总变化损失并加到总损失中。\n\n```\n# 计算总变化损失\ndef get_total_variation_loss(x):\n \
    \   # 总变化损失是相邻像素值之差的平方和\n    if K.image_data_format() == 'channels_first':\n \
    \       a = K.square(x[:, :, :length - 1, :width - 1] - x[:, :, 1:, :width - 1])\n\
    \        b = K.square(x[:, :, :length - 1, :width - 1] - x[:, :, :length - 1,\
    \ 1:])\n    else:\n        a = K.square(x[:, :length - 1, :width - 1, :] - x[:,\
    \ 1:, :width - 1, :])\n        b = K.square(x[:, :length - 1, :width - 1, :] -\
    \ x[:, :length - 1, 1:, :])\n    return K.sum(K.pow(a + b, 1.25))\n\n# 在总损失中加入总变化损失\n\
    loss += total_variation_weight * get_total_variation_loss(output_image)\n```\n\
