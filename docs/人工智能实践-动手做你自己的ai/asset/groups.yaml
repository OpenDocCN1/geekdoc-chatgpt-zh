    ## 总序


    清晰记得，2018年1月21日上午，我突然看到手机里有这样一则消息“【教育部出大招】人工智能进入全国高中新课标”，我预感到我可以为此做点事情。这种预感很强烈，它也许是我这辈子最后想做、也是可以做的一件事，我不想错过。


    从我1986年华东师范大学计算机科学系硕士毕业来到上海交通大学从教，至今已有33年。其间做了三件引以自豪的事，一是率领上海交通大学ACM队参加ACM国际大学生程序设计竞赛，分别于2002年、2005年及2010年三次获得世界冠军，创造并保持了亚洲纪录；二是2002年创办了旨在培养计算机科学家及行业领袖的上海交通大学ACM班，成为中国首个计算机特班，从此揭开了中国高校计算机拔尖人才培养的序幕；三是1996年创建了上海交通大学APEX数据与知识管理实验室（简称APEX实验室），该实验室2018年度有幸跻身全球人工智能“在4个领域出现的高引学者”世界5强（AMiner每两年评选一次全球人工智能“最有影响力的学者奖”）。出自上海交通大学的ACM队、ACM班和APEX实验室的杰出校友有：依图科技联合创始人林晨曦、第四范式创始人戴文渊、流利说联合创始人胡哲人、字节跳动AI实验室总监李磊、触宝科技联合创始人任腾、饿了么执行董事罗宇龙、森亿智能创始人张少典、亚马逊首席科学家李沐、天墅科技创始人薛贵荣、宾州州立大学终身教授黎珍辉、加州大学尔湾分校助理教授赵爽、明尼苏达大学双子城分校助理教授钱风、哈佛大学医学院助理教授李博、新加坡南洋理工大学助理教授李翼、伊利诺伊大学芝加哥分校助理教授孙晓锐和程宇、卡耐基梅隆大学助理教授陈天奇、乔治亚理工学院助理教授杨笛一、加州大学圣地亚哥分校助理教授商静波等。


    我想做的第四件事是创办一所民办学校，这是我的终极梦想。几十年的从教经历，使得从教对我来说已不只是一份职业，而是一种习惯、一种生活方式。当前，人工智能再度兴起，国务院也发布了《新一代人工智能发展规划》，且中国已将人工智能上升为国家战略。于是，我创建了伯禹教育，专注人工智能教育，希望把我多年所积累的教育教学资源分享给社会，惠及更多需要的人群。正如上海交通大学党委书记姜斯宪教授所说，“你的工作将对社会产生积极的影响，同时也是为上海交通大学承担一份社会责任”。也如上海交通大学校长林忠钦院士所说，“你要做的工作是学校工作的延伸”。我属于上海交通大学，我也属于社会。


    2018年暑假，我们制订了“青少年AI实践项目”的实施计划。在设计实践项目过程中，我们遵循青少年“在玩中学习，在玩中成长”的理念，让青少年从体验中感受学习的快乐，激发其学习热情。经过近半年的开发及完善，我们完成了数字识别、图像风格迁移、文本生成、角斗士桌游及智能交通灯等实践项目的设计，取得了非常不错的效果，并编写了项目所涉及的原理、步骤及说明，准备将其编成一本实践手册给青少年使用。但是，作为人工智能的入门读物，光是一本实践手册远远满足不了读者的需要，于是本套丛书便应运而生。


    本套丛书起名“青少年AI学习之路：从思维到创造”，共有四个分册。


    第一册《从人脑到人工智能：带你探索AI的过去和未来》，从人脑讲起，利用大量生动活泼的案例介绍了AI的基本思维方式和基础技术，讲解了AI的起源、发展历史及对未来世界的影响。


    第二册《人工智能应用：炫酷的AI让你脑洞大开》，从人们的衣食住行出发，借助生活中的各种AI应用场景讲解了数十个AI落地应用实例。


    第三册《人工智能技术入门：让你也看懂的AI“内幕”》，从搜索、推理、学习等AI基础概念出发解析AI技术，帮助读者从模型和算法层面理解AI原理。


    第四册《人工智能实践：动手做你自己的AI》，从玩AI出发，引导读者从零开始动手搭建自己的AI项目，通过实践深入理解AI算法，体验解剖、改造和创造AI的乐趣。


    ## 本套丛书的特点：


    - 根据青少年的认知能力及认知发展规律，以趣味性的语言、互动性的体验、形象化的解释、故事化的表述，深入浅出地介绍了人工智能的历史发展、基础概念和基本算法，使青少年读者易学易用。


    - 通过问题来驱动思维训练，引导青少年读者学会主动思考，培养其创新意识。因为就青少年读者来说，学到AI的思维方式比获得AI的知识更重要。


    - 用科幻小说或电影作背景，并引用生活中的人工智能应用场景来诠释技术，让青少年读者不再感到AI技术神秘难懂。


    - 以丛书方式呈现人工智能的由来、应用、技术及实践，方便学校根据不同的需要组合课程，如科普性的通识课程、科技性的创新课程、实践性的体验课程等。


    2019年1月15日，我们召集成立了丛书编写组；1月24日，讨论了丛书目录、人员分工和时间安排，开始分头收集相关资料；3月6日，完成了丛书1/3的文字编写工作；4月10日，完成了丛书2/3的文字编写工作；5月29日，完成了丛书的全部文字编写工作；6月1日—7月5日，进行3—4轮次交叉审阅及修改；7月6日，向出版社提交了丛书的终稿。在不到6个月的时间里，我们完成了整套丛书共4个分册的编写工作，合计100万字。


    在此，特别感谢张伟楠博士，他在本套丛书编写过程中给予了很多专业指导，做出了重要的贡献。


    感谢我的博士生龙婷、任侃、沈键和张惠楚，他们分别负责了4个分册的组织与编写工作。


    感谢我的学生吴昕、戴心仪、周铭、粟锐、杨正宇、刘云飞、卢冠松、宋宇轩、茹栋宇、吴宪泽、钱利华、周思锦、秦佳锐、洪伟峻、陈铭城、朱耀明、杨阳、卢冠松、陈力恒、秋闻达、苏起冬、徐逸凡、侯博涵、蔡亚星、赵寒烨、任云玮、钱苏澄及潘哲逸等，他们参与了编写工作，并在如此短的时间内，利用业余时间进行编写，表现了高度的专业素质及责任感。


    感谢王思捷、冯思远全力以赴开发实验平台。

    感谢陈子薇为本套丛书绘制卡通插图。

    感谢所有支持编写的APEX实验室成员及给予帮助的所有人。

