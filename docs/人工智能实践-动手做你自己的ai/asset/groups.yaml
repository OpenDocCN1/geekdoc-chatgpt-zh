    隐藏层的存在使神经网络结构更加复杂，表现力更加强大，也更加“智能”。


    子曰：“学而不思则罔，思而不学则殆。”神经网络必须具备学习能力才能够产生实际作用，而神经网络结构本身并不知道“如何分类”，它必须从大量的数据中发现“如何分类”的规律。


    学习是一个基于经验不断尝试、不断逼近真理的过程，这对机器来说也一样。学习的时候，我们往往要做大量的练习题，并与标准答案比对，如果和标准答案不一样，说明我们对知识的理解有偏差，需要改正。对神经网络来说也一样，我们准备一些“题目”和“答案”，让它“做题”，然后与“标准答案”对比，再做出调整。在图像识别这个具体的问题中，要完成“出题”的任务，就要用到图像识别领域中的经典数据集。我们准备的许多图像就是“题目”，而图像的已知分类就是“答案”。有了题目，就让神经网络开始“做题”，然后比对做出来的答案和“标准答案”，然后朝着“标准答案”的方向调整。具体来说，我们调整的是连接各个神经元之间的边的权重值。这种有“题目”，有“答案”的学习过程，称为监督式学习。


    要说明调整进行的过程需要更进一步的数学知识。但我们可以形象地描述这个过程。定义一个“距离”用来表示神经网络的输出和“标准答案”之间的差距，这个“距离”称为损失函数。向目标靠近，就是要最小化这个损失函数。


    解决最小化问题有许多方法。常用的一种方法是基于函数上的点的切线斜率，也就是导数的方法。例如，最简单的一元情况：假设有一个函数y=f(x)，如下图所示，我们任意取曲线上的一点作为起始点，假设为
    (w1, f(w1))，并求得该点处曲线切线的斜率，记为 f''(w1)。为了找到函数的最小值，想象我们在这条光滑的曲线上，沿着斜率的方向向下滑，滑到w2处，其中w2可由以下式计算得到：


    ```

    $$w_2 = w_1 - kf''(w_1)$$

    ```


    其中k影响下滑的速度，也称为学习率。可以看出，每经过一次“下滑”，我们就离最小值更进一步。


    ![](img/9b291315612c9c478ad54afa29381fce_36_0.png)


    梯度下降'
  - '[PAGE 37]


    而对于多元函数的情况，我们做一个简化。假设神经网络的输出只依赖于两个参数（二元情况下）x和y，设定损失函数为z。对于每一个（x，y），我们都可以确定一个z。这种关系类似于地理中的地形图，地形图平面上的每个点都对应着一个高度。对于神经网络而言，损失函数就是高度，而最小化损失函数，就是要找到地形中的最低点。


    ![](img/9b291315612c9c478ad54afa29381fce_37_0.png)


    # 损失函数与梯度下降


    假设你在一座光滑的山上，受到重力的作用沿着山坡往下滑，下滑的方向就是山体高度下降最快的方向。很自然地，你会下滑到一个地势较低的“洼地”里，“洼地”的高度比它周围的高度都低，这时候就不能继续下滑了。寻找最小化损失函数的过程就是模拟下滑的过程。我们要通过计算来确定下降最快的方向。


    方向确定后，就要考虑一次下滑的距离。因为每次下滑之后位置会发生变化，位置的改变会使“下滑最快的方向”这个信息发生改变，必须重新计算下滑方向。如果每次下滑的距离比较小，那么这条下滑路径就越“细腻”“光滑”“连贯”，但相应的下滑到低点的速度也越慢，需要的时间更多；如果下滑距离比较大，计算速度比较快，就显得“粗糙”。就好比步子迈太大，很有可能就会不停地跨越并错过“洼地”。所以我们必须选取一个合适的下降速度。决定下降速度快慢的参数叫做学习率。


    这种方法有一个弊端，那就是我们找到的“洼地”并不一定就是全局的最小值。洼地只能说明它比周围一圈高度都要低，有可能只是一个局部的最小值。上图中两个红色箭头所指的区域，一个是局部最小值，一个是全局最小值，然而最终得到的是局部最小值，这并不是我们想要的结果。


    尽管有这个局限性，但是在绝大多数情况下，这种方法还是很好用的。


