    # （一） 穷举法


    穷举，又称枚举，是最简单、最基础的搜索算法。如其字面意思，穷举搜索是将所有可能的解列出来，再一一验证正确性。前文所述的找钥匙就是穷举的过程。穷举法的思想十分朴素：答案总归是存在的，我们只要粗暴地挨着找过去，就一定能找到它。


    但细心的你或许发现，上面的说法并不严谨。什么是“挨着”找过去？如何用清晰而没有歧义的语言向计算机解释“挨着”的含义？另一方面，在博弈树中，与每个结点相连的结点有很多，应该按什么顺序搜索？在搜索过程中会不会重复搜索同一结点？


