    | flatten_1 (Flatten) | (None, 800) | 0 |\n| dense_1 (Dense) | (None, 256) | 205056\
    \ |\n| dense_2 (Dense) | (None, 10) | 2570 |\n| Total params: 217,706 | | |\n\
    | Trainable params: 217,706 | | |\n| Non-trainable params: 0 | | |\n\n搭建完卷积神经网络后，需要定义一个优化器，用于找到使损失函数最小的权重，这里我们使用Adam优化器，使用交叉熵（一种用于计算多分类问题误差的函数）作为损失函数，使用准确率作为度量指标，完成模型的搭建。\n\
    \n### 概念解析\n\n#### 优化器\n\n计算机科学家提出了许多复杂的优化器，它们可能使用动态变化的学习率、或者使用更多的导数信息改变权重。Adam优化器和随机梯度下降优化器都是常用且高效的优化器。其中，随机梯度下降优化器与梯度下降法紧密相关，它每次会随机对一定数量的数据点（而非全部数据点）求损失函数，并根据该损失函数的导数信息改变权重。Adam优化器则是随机梯度下降的一种改进。优化时每次选择的数据点数量通常被称为批量大小。\n\
    \n```\nmodel.compile(loss=\"categorical_crossentropy\", optimizer=\"adam\", metrics=['accuracy'])\n\
    ```\n\nKeras提供的fit函数用于训练卷积神经网络，将训练的输入与输出（x_train, y_train）传给fit函数，指定批量大小为32，训练轮数为10。一切就绪！开始训练（这会花上一些时间）。\n\
    \n```\nmodel.fit(x_train, y_train, batch_size=32, epochs=5, validation_data=(x_test,\
    \ y_test))\n```\n\n```\n输出结果:\nTrain on 60000 samples, validate on 10000 samples\n\
    Epoch 1/5\n60000/60000 [==============================] - 67s 1ms/step - loss:\
    \ 0.1385\n- acc: 0.9562 - val_loss: 0.0446 - val_acc: 0.9862\nEpoch 2/5\n60000/60000\
    \ [==============================] - 66s 1ms/step - loss: 0.0463\n- acc: 0.9859\
    \ - val_loss: 0.0353 - val_acc: 0.9893\nEpoch 3/5\n60000/60000 [==============================]\
