    \    axes[i].set_title(\"y_predict: %d\\ny_test: %d\" % (y_predict[idx],\n   \
    \ y_test[idx]))\nplt.tight_layout()\nplt.show()\n```\n\n![](img/9b291315612c9c478ad54afa29381fce_31_0.png)\n\
    \n分类错误的图像\n\ny_predict 是K近邻算法的分类结果,y_test是正确分类。从中可以看出,分错类的图像基本都是一些歪歪扭扭，与正常写法有较大差异的数字。\n\
    \n## 四、K近邻算法的缺点\n\nK近邻算法的原理非常简单易懂，效果也不错，但是K近邻算法也有一些明显的缺点。\n\n- 分类速度慢。如果你运行一遍代码就会发现，在predict过程中，K近邻算法花费了大量时间。这是因为在每做一次分类时，K近邻算法都要在已知的数据中找到最相似的那些数据，当已知数据规模很大的时候，这个寻找的过程就非常慢。但一般情况下我们又希望已知数据越多越好，否则算法的准确性会降低。虽然有一些索引算法可以加速寻找过程，但总体来说，每做一次分类花费的时间还是不可接受。因此，K近邻算法不适用于一些需要快速出结果的场景。\n\
    \n- 分类效果依赖于相似度计算的方法。K近邻算法的准确性很大程度依赖于相似度计算方法的准确性，我们目前采用的是简单的欧式距离。这种方法对于规整的黑白手写数字分类效果尚可，但是对于复杂的图像，比如歪扭、不规整的图像或是CIFAR-10中的彩色物体图像，效果就会大打折扣。事实上，我们只要将图像旋转一个角度，目前的相似度计算方法就会出现问题。如下图所示，如果将数字7的图像旋转一个很小的角度，然后将其与未旋转的数字图像叠放在一起，淡灰色的部分就是它们不相同的地方。这时两张图像的欧式距离就不足以反映这两张图像内容上的相似性。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_32_0.png)\n\n将图像旋转一定角度后产生的差异\n\n##\
    \ 第三章 卷积神经网络\n\n近年来，卷积神经网络(Convolutional Neural Networks)的使用让计算机在图像识别领域取得了飞跃式的发展。\n\
    \n- 2012年，基于卷积神经网络的模型AlexNet在ImageNet竞赛中获得冠军，正确率超出第二名近10%，让人大跌眼镜。这个表现直接奠定了它在图像识别领域的重要地位。自此以后，图像识别领域的所有最优算法都以卷积神经网络为基础架构。\n\
    \n- 2014年，牛津大学研究员研发出16层的VGG模型。同年，DeepFace、DeepID模型横空出世，直接将LFW数据库上的人脸识别、人脸认证的正确率刷到99.75%，几乎超越人类。\n\
    \n- 2016年，大名鼎鼎的AlphaGo也使用了卷积神经网络作为对盘面的评估算法。其实棋盘与图像类似，你可以把棋盘想象成一张像素为19x19的图像，每一个像素上有3种取值，分别是黑子、白子、无子。\n\
    \n在本章中，我们将认识神经网络，理解卷积神经网络的原理，了解图像增强的方法，并使用Keras库搭建卷积神经网络。\n\n### 一、初识神经网络\n\n\
    神经网络是一种模仿人类神经系统而产生的人工智能技术。人类神经系统的基本组成单元是神经元，神经元通过神经突起（树突和轴突）与其他细胞（神经元或者其他种类的细胞）相连构成一个网络，以电信号或者化学信号的方式传递信息。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_33_0.png)\n\n神经元结构示意图\n\n人工神经网络正是受此启发并进行模仿而生成的，人工神经网络的基本组成单元也是神经元。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_34_0.png)\n\n人工神经网络中的神经元\n\n如上图所示，信号以数字的形式在神经元之间传递。一个神经元会接收很多输入（a1\
    \ … an），每个输入会有一个对应的权重。神经元先对输入进行加权求和，即：\n\n```\nsum = w_1a_1 + w_2a_2 + \\cdots\
    \ + w_na_n = \\sum_{i=1}^n w_ia_i\n```\n\n输入加权求和之后，在这个和上作用一个函数 f（激活函数），最终的输出是\
    \ f（sum）。类比生物学中的神经元，信号从人工神经网络中的上一个神经元传递到下一个神经元的过程中，并不是任何强度的信号都可以传递下去的。信号必须足够强，才能激发下一个神经元的动作电位，使其产生兴奋。激活函数的作用与之类似，例如最简单的激活函数如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_34_1.png)\n\n单位阶跃函数\n\n上图是单位阶跃函数。当输入大于0的时候就继续向下一层传递，否则就不传递。这个函数很好地表现了“激活”的意思，但是这个函数是由两段水平线组成的，这个特性会导致一些问题（由于会涉及一些高等数学知识，本书不做详细解释，直观地理解就是这个函数导致数大多为0，无法为权重的学习提供指引），所以并不常用。其他一些函数的性质要好一些，因此在神经网络中更为常用。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_35_0.png)\n\n上图是常用的激活函数——Sigmoid 函数，它的形状与之前的单位阶跃函数类似，但是更加连续光滑，性质更好。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_35_1.png)\n\n上图是另一种常用的激活函数——ReLU 函数，又称线性整流函数。它的形式更加简单，当输入小于0时，输出为0，当输入大于0时，输出与输入相等。\n\
    \n神经网络往往被设计成具有层次性的结构。常见的分为输入层、隐藏层和输出层。如下图所示，从输入层到输出层中间有2个隐藏层。第一个隐藏层中有4个神经元，每个神经元都是对输入加权、求和、再激活后的结果。第二个隐藏层中也有4个神经元，每个神经元都是对第一个隐藏层的4个神经元加权、求和、再激活后的结果。这种每一个神经元都由前一层的输出加权、求和、再激活得到的隐藏层，又被称为全连接层。\n\
    \n隐藏层的存在使神经网络结构更加复杂，表现力更加强大，也更加“智能”。\n\n子曰：“学而不思则罔，思而不学则殆。”神经网络必须具备学习能力才能够产生实际作用，而神经网络结构本身并不知道“如何分类”，它必须从大量的数据中发现“如何分类”的规律。\n\
    \n学习是一个基于经验不断尝试、不断逼近真理的过程，这对机器来说也一样。学习的时候，我们往往要做大量的练习题，并与标准答案比对，如果和标准答案不一样，说明我们对知识的理解有偏差，需要改正。对神经网络来说也一样，我们准备一些“题目”和“答案”，让它“做题”，然后与“标准答案”对比，再做出调整。在图像识别这个具体的问题中，要完成“出题”的任务，就要用到图像识别领域中的经典数据集。我们准备的许多图像就是“题目”，而图像的已知分类就是“答案”。有了题目，就让神经网络开始“做题”，然后比对做出来的答案和“标准答案”，然后朝着“标准答案”的方向调整。具体来说，我们调整的是连接各个神经元之间的边的权重值。这种有“题目”，有“答案”的学习过程，称为监督式学习。\n\
    \n要说明调整进行的过程需要更进一步的数学知识。但我们可以形象地描述这个过程。定义一个“距离”用来表示神经网络的输出和“标准答案”之间的差距，这个“距离”称为损失函数。向目标靠近，就是要最小化这个损失函数。\n\
    \n解决最小化问题有许多方法。常用的一种方法是基于函数上的点的切线斜率，也就是导数的方法。例如，最简单的一元情况：假设有一个函数y=f(x)，如下图所示，我们任意取曲线上的一点作为起始点，假设为\
    \ (w1, f(w1))，并求得该点处曲线切线的斜率，记为 f'(w1)。为了找到函数的最小值，想象我们在这条光滑的曲线上，沿着斜率的方向向下滑，滑到w2处，其中w2可由以下式计算得到：\n\
    \n```\n$$w_2 = w_1 - kf'(w_1)$$\n```\n\n其中k影响下滑的速度，也称为学习率。可以看出，每经过一次“下滑”，我们就离最小值更进一步。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_36_0.png)\n\n梯度下降\n\n而对于多元函数的情况，我们做一个简化。假设神经网络的输出只依赖于两个参数（二元情况下）x和y，设定损失函数为z。对于每一个（x，y），我们都可以确定一个z。这种关系类似于地理中的地形图，地形图平面上的每个点都对应着一个高度。对于神经网络而言，损失函数就是高度，而最小化损失函数，就是要找到地形中的最低点。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_37_0.png)\n\n### 损失函数与梯度下降\n\n假设你在一座光滑的山上，受到重力的作用沿着山坡往下滑，下滑的方向就是山体高度下降最快的方向。很自然地，你会下滑到一个地势较低的“洼地”里，“洼地”的高度比它周围的高度都低，这时候就不能继续下滑了。寻找最小化损失函数的过程就是模拟下滑的过程。我们要通过计算来确定下降最快的方向。\n\
    \n方向确定后，就要考虑一次下滑的距离。因为每次下滑之后位置会发生变化，位置的改变会使“下滑最快的方向”这个信息发生改变，必须重新计算下滑方向。如果每次下滑的距离比较小，那么这条下滑路径就越“细腻”“光滑”“连贯”，但相应的下滑到低点的速度也越慢，需要的时间更多；如果下滑距离比较大，计算速度比较快，就显得“粗糙”。就好比步子迈太大，很有可能就会不停地跨越并错过“洼地”。所以我们必须选取一个合适的下降速度。决定下降速度快慢的参数叫做学习率。\n\
    \n这种方法有一个弊端，那就是我们找到的“洼地”并不一定就是全局的最小值。洼地只能说明它比周围一圈高度都要低，有可能只是一个局部的最小值。上图中两个红色箭头所指的区域，一个是局部最小值，一个是全局最小值，然而最终得到的是局部最小值，这并不是我们想要的结果。\n\
    \n尽管有这个局限性，但是在绝大多数情况下，这种方法还是很好用的。\n\n### 二、卷积神经网络详解\n\n#### (一) 卷积层\n\n在K近邻算法中，我们利用图像矩阵之间的欧式距离表达图像的相似度，然而这种方法\n"
