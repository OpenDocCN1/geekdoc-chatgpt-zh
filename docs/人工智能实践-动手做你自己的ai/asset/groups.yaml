    # 第十章 循环神经网络


    在本章中，我们将要学习词向量（word vector）的概念及性质，以及词到向量技术，并使用gensim与sklearn库训练、观察词向量分布。另外还要了解循环神经网络、长短期记忆网络的基本结构，并使用Keras搭建一个简单的长短期记忆网络。通过本章节学习，掌握词向量的基本定义和意义，掌握连续词袋模型、跳跃－元模型两种计算词向量的技术思想，学会使用长短期记忆网络进行文本生成。


    在之前的图像识别、图像风格迁移的项目中，相信大家已经体会到神经网络，尤其是卷积神经网络（Convolutional Neural Network）的强大。如同卷积神经网络在计算机视觉领域中大展神威一样，循环神经网络（Recurrent
    Neural Network）在处理文本与时间序列等序列数据的领域中也有举足轻重的地位。它的应用一举突破了自然语言处理领域诸如语言模型、文本生成、文本分类、情感分析等许多问题的瓶颈，取得了良好的表现。


    神经网络的基本知识大家可以参考图像识别与图像风格迁移的相关内容，这里不再赘述。


    # 一、词的模型——词向量


    在引入接下来的模型之前，我们需要学习词向量。


    # 1. 算法思想


    在n元语法模型中，并没有把词本身代入计算，只是对词的出现作了一个计数而已。为了能够对单词进行计算，需要一种把词转化成数学对象的技术，即对单词建模。


    首先，最容易的建模方法是给词表里的单词标号，然后用标号来代表这个词参与数学运算，但是这种模型对词来说太简单了。模型应尽可能多地包含词原本的信息，如词性、语义，以及动词的形式、名词的单复数等，这些显然不是一个标号可以囊括的。而且用标号来代表词的话，对标号进行加减乘除其实没有任何意义，例如，“男人”的标号是1，“苹果”的标号是2，1+2=3代表什么呢？它和3号词又有什么关系呢？可能没有丝毫关系，因为任何一个词都可以标为3号。


    既然一个数不够，可以用更多的维度去表征一个词的信息，这就是词向量。向量是一组数（有关向量的概念解析参见图像识别部分），而词向量是用来表示词的一组数。'
  - '[PAGE 110]


    独热编码（有关独热编码的内容参考第一部分）是一种最简单的词向量，但是独热编码依然有很明显的缺陷。首先，独热编码很容易遇到维数灾难的问题，因为向量的维数和词语集合的大小相同，而词语集合的规模通常都很大，这会大大增加模型尤其是神经网络模型的计算时间，导致根本无法训练。其次，独热编码依然没有克服向量运算无意义的问题，也无法用独热编码向量来衡量词的相似程度。


    那该如何确定每个词的词向量值呢？


    结合之前对标号模型和独热编码模型的思考，事实上我们希望词向量能够满足下面两个条件。


    +   (1) 语义相近的词的词向量距离相近，语义不同的词的词向量距离较远。

    +   如：“苹果”与“香蕉”的距离比“苹果”和“跑”的距离要近。


    +   (2) 对词做运算是有意义的。

    +   如：“男人” - “女人” = “国王” - “皇后”（语义的意义）。

    +   又如：apples - apple = bananas - banana（语法的意义）。


    ![](img/9b291315612c9c478ad54afa29381fce_110_0.png)


    我们把构造这种词向量的技术称作词嵌入（word embedding），实际上就是把单词嵌入向量空间的意思。


    目前主流的计算词向量的方法是词到向量（word2vec），词到向量是一种基于深度前馈神经网络的技术，它的计算效率特别高。一般来说词到向量分为两种类型：连续词袋（Continuous
    Bag of Words，CBOW）模型和跳跃-元模型（Skip-Gram）模型。从算法上看，这两种模型比较相似，只是连续词袋模型是从上下文字词预测中间字词，而跳跃-元模型则与之相反，是从中间字词预测上下文字词。'
  - '[PAGE 111]


    词到向量技术源于对词的语义如何定义的思考。一种观点认为，一个词的语义就是它的语境，也就是周围的词。不同的词所处的语境不同，类似的词所处的语境类似，而语境的类似可以理解为出现词的概率分布类似。比如“银行”这个词的周围总是出现“税率”“利息”等词，“苹果”的周围就很少出现这样的词，“苹果”和“银行”的语义非常不同，但是“苹果”和“香蕉”周围都会经常出现“水果”“营养”等词语，它们所处的语境就很类似，也就意味着它们的语义相近。


    词到向量技术具体如何实现不在本书的讨论范围内，有兴趣可以自行查阅相关资料。


    # 2. 代码实现


    目前已经有成熟的词向量训练库，我们不需要知道具体的技术细节也可以训练并观察词向量。下面将利用现有的 gensim、sklearn 和 plotly 库，在一个语料上训练
    word2vec 模型，并可视化训练后的词向量分布。


    # (1) 导入必要的库。


    +   - plotly;

    +   - decomposition：经典机器学习库 sklearn 中用来数据降维的库。

    +   - gensim：一个经典的自然语言处理库。

    +   - numpy：Python 中用于处理各种数值计算的库。


    ```

    # 如果没有安装 gensim, sklearn 和 numpy 库

    # 请使用 pip install gensim scikit-learn numpy 安装

    import plotly

    import sklearn.decomposition

    import gensim

