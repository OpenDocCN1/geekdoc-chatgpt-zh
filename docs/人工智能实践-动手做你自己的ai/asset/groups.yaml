    第一步是建立数学模型。棋盘、游戏规则等概念对计算机来说实在太复杂，必须将这些概念中没有实质作用的部分舍弃（如棋盘的材质是什么，玩家是人还是电脑等），而将本质的东西依靠数学手段提取出来（如棋盘的大小、棋子的形状和位置）。


    第二步是设计算法。算法，即计算的方法。设计算法相当于在拆解命令，并且必须保证命令清晰严谨、没有歧义。


    第三步是编程。如果模型足够完善、算法又足够清晰，编程就顺理成章，基本不是难事了。假若你没有编程基础，也大可不必担心，可以跳过后面的所有程序代码，这不会对阅读'
