    +   - 全连接层：隐藏层维度为256，使用ReLU作为激活函数。

    +   - 全连接层：隐藏层维度为10，使用Softmax作为激活函数，输出每个分类的概率。


    # 概念解析


    # Softmax


    Softmax又称归一化指数函数。所谓归一化就是将原先的输入进行变换，使输出的每个数都在0到1之间，并且使他们的和为1。如果输入的是一个7维向量 [1, 2,
    3, 4, 1, 2, 3]，经过Softmax后就得到向量 [0.024, 0.064, 0.175, 0.475, 0.024, 0.064, 0.175]。这个向量可以被看作概率，每一维上的值代表的就是原向量这一维的值属于这一类的概率。因此在分类问题中，最后一层往往会使用一个维度与类别数量相同、激活函数为Softmax的层作为全连接层。


