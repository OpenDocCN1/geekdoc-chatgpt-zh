    策略。


    在本部分中，智能红绿灯属于无模型的强化学习。为什么环境模型对它来说是未知的呢？因为在智能体作出调整红绿灯的决策后，它无法预测调整红绿灯之后驾驶员们会做出什么反应以及车流会如何改变，因此它无法洞察环境运行的机制。Q-learning和Deep
    Q-Network是解决该类无模型问题的经典算法。


    注意，在没有环境模型的情况下，状态值函数V*(s)将不能指导策略的选取，因为即使智能体知道接下来可达的状态拥有很高的价值，由于缺少环境模型作为桥梁，它也不知道应该通过什么样的动作到达目标状态，因此应当直接学习动作值函数Q*(s,
    a)。正如下面的式子所表示的，智能体会选择有着最高Q值的动作以获得最丰厚的回报。


    ```

    $$\pi_*(s) = \text{argmax}_a Q_*(s, a)$$

    ```


    # 延伸阅读


    # 基于模型的强化学习


    倘若你正在学习驾驶，希望让汽车平稳地运行在道路中央。你知道油门、刹车、方向盘会如何改变汽车行进的轨迹，因此会在脑中模拟不同的操纵汽车方式，并去预测它们带来的各种行车轨迹，最终，你选择了预测中那条最平稳的行车轨迹，并实施了带来该行车轨迹的最优行车方式，这就是基于模型的控制问题。基于模型的强化学习可以通过环境模型来预测做出动作后到达的状态，这为它带来了独到的优势，模型的存在减少了在真实环境中试错的需求，为强化学习在实际问题中的训练与应用提供了基础。


    # 四、探索与利用


    在无模型的情况下，智能体对环境的所有认知都来自于交互的实际经验，它只有尝试过各种行为才能客观公正地了解整个环境。智能体需要积极探索（Exploration）未知的状态和动作，因为或许会有蕴藏着丰厚奖励的动作尚未被发现。然而智能体也需要充分利用（Exploitation）已学得的策略，来最优化回报。探索与利用的平衡是强化学习中的重要问题。


    应对探索与利用问题的最简单方法是使用 $\epsilon-greedy$ 策略，这种策略由以下两部分构成：


    +   (1) 随机选择动作。

    +   (2) 选择当前Q值最大的动作，这个策略被称之为贪心策略。


    采取随机的动作就是探索未知，有利于更新出更大的Q值，学得更好的策略；而使用贪'
