    \ = move\n\n    return max_score, best_move\n```\n\n由于策略简单，其代码实现也十分清晰易懂。初始时将当前最优分数设置为Python意义上的负无穷大，接下来遍历每种可能的走法，计算相应的估值。如果新走法的估值比当前最优估值还要大，就说明找到了更好的方法，需要更新已经保存的最优分数和相应的行动。\n\
    \n### 概念解析\n\n### 局部最优与全局最优\n\n当我们面临一个规模较大的问题时，往往会想到将大问题拆分成许多小问题并各个击破，再将小问题的答案组合起来以解决大问题的方法。局部最优指的是小问题的最优解，而全局最优指的是大问题的最优解。看似每个小问题都取得最优解时，由这些最优解综合得到的答案一定是全局最优，实则不然。原因在于，各个小问题并不总是互相独立的，从而它们的解在组合时可能会互相影响、互相冲突。\n\
    \n虽然贪心算法并不一定总能得到最优解，但在多数情况下，贪心算法得到的解和最优解是相当接近的。另外，贪心法操作简单，花费的时间通常更低，因此在对解的质量要求不是特别严苛的情况下，贪心法不失为一个好的选择。\n\
    \n然而，贪心不是万能的。可以想见，这种只考虑下一步的做法存在着致命缺陷——短视。有任何博弈类游戏经验的读者都应该很清楚，博弈中只考虑自己的行动而不考虑对方的应对是一种极其愚蠢的行为，按这种策略给出的行动很难真正取得博弈的胜利。那么，问题出在哪里呢？\n\
    \n或许你会归咎于估价函数。假设有一个完全精确的估价函数，将必胜局面映射到1，将必败局面映射到-1，必平局面映射到0，除此之外再没有其他值。在这个估价函数的指导下，我们始终会沿着必胜局面行动，直至终局。但是，这样完全精确的估价函数只能在遍历所有可能情况后给出，而前文已经指出，如此遍历的时间代价是不可承受的。事实上，既然估价函数的目的是用人类智慧来简化机器计算，那么不应再苛求机器负担所有的计算任务。因此，虽然好的估价函数的确能提高贪心策略的水平，但解决问题的关键还是在考虑对方行动上。\n\
    \n## 三、极大极小搜索\n\n### (一) 基本实现\n\n为了解决贪心法的缺陷，需要把对方的行为也考虑进来，应运而生的是被称作极大极小搜索（Minimax\
    \ algorithm）的算法（实际上上称作Maximin算法更为精确，但是这里仍旧按照惯例称之为Minimax算法）。对于每一个合法行动m，穷举对方在此行动已经做出的前提下的所有合法走法，得到一个双方各走一步之后的局面。对此局面用估价函数进行估值，再根据估值的结果去选择合适的行动。\n\
    \n问题在于，“根据估值的结果选择”究竟意味着什么。可以发现，对于一个固定的走法m，对方的走法不同，会导致不同的局面以及不同的估值，而我们最后所能选择的只有第一步自己的走法。对于这一问题，其中一个合理的方案就是采用极大极小准则，即对于我们的每一合法走法m，考虑对方的每一合法走法m'，记这两步之后的局面为u(m,\
    \ m')。最终选择的走法m*就是：\n\n```\nm* = arg max_m min_m' L(u(m, m'))\n```\n\n这里，$x^* =\
    \ \\arg \\max_x f(x)$ 的含义是，$x^*$ 等于 f 取到最大值时自变量 x 的值。同理，$x^* = \\arg \\min_x f(x)$\
    \ 表示 x* 等于 f 取到最小值时自变量 x 的值。\n\n直观上来说，我们认为对方必然会选择使得局面对于我们而言尽可能劣的走法，这对应公式中的 min\
    \ 部分。而我们所选择的则是令所有这样的最劣局面尽可能优的走法，即 arg max 的部分。\n\n目前只考虑了一步我方的走法和一步对方的走法，接下来可以再把之后的两步也考虑进来，对四步之后的局面进行估值。这里有一些需要注意的细节，设在\
    \ m’之后的一步我方的走法为 n，同样是对于固定的 m 和 m’，由于这一步的差异又会有不同的结果。那么该如何确定对方 m’这一步会如何走呢？在之前的情况中，假设了对方会采取使局面对我方而言尽可能劣的走法，在这里也需要作出类似的假设，即对方也会按照极大极小准则来行动。具体而言，对方会对于每一个走法\
    \ m’，考虑我方之后的走法所能达到的最优值，从中选出一个最小的。最后，在考虑三层的情况下，我方的走法会由如下公式决定：\n\n$m^*=\\arg \\\
    max_m \\min_{m'} \\max_n L(u(m, m', n))$\n\n以此类推，可以继续往下搜索，只需要在每一层将 max 变为 min，min\
    \ 变为 max 即可。\n\n这种思考方式有自我嵌套的意味，已经含有递归的特征，自然可想到用递归函数来实现这一算法。另外，每一层需要搜索的节点个数在一般情况下和当前的层数是成指数相关的，这意味着搜索不可能进行太深。因此，可提前设置一个最大深度。当达到最大深度的时候，直接使用估价函数\
    \ L 对局面进行估值，而不再继续向下进行搜索。具体代码如下：\n\n```python\ndef minimax(board, depth, player_id):\n\
    \n    # 达到最大深度，或已经是终局局面，直接估值\n    if depth == 0 or is_terminated(board):\n   \
    \     return evaluate(board, player_id)\n\n    # 双方的id分别是0和1\n    opponent_id\
    \ = 1 - player_id\n\n    if is_maximizing_player(player_id):\n        # 当前player是我方\n\
    \        score = -float('inf')\n        for move in get_valid_moves(board, player_id):\n\
    \            new_board = drop(board, move)\n            # 下一层搜索\n            score\
    \ = max(score, minimax(new_board, depth - 1, opponent_id))\n        return score\n\
    \    else:\n        # 当前player是对方\n        score = float('inf')\n        for move\
    \ in get_valid_moves(board, player_id):\n            new_board = drop(board, move)\n\
    \            score = min(score, minimax(new_board, depth - 1, opponent_id))\n\
    \        return score\n\n# 外部初始调用，max_depth即是最大搜索深度\nminimax(current_board, max_depth,\
    \ player_id)\n```\n\n### 概念解析\n\n### 递归\n\n递归通常可以理解为自我指涉、自我定义，利用自己来定义自己。如正整数阶乘可以定义为f(n)\
    \ = n x f(n - 1),在定义式中出现了阶乘函数本身。但为了不使这个自我指涉无限进行下去，必须指明递归的终止条件，例如f(1) = 1。编程中的递归函数与此类似，也是指在函数体中使用该函数自身的行为。\n\
    \n通常把我方称为极大玩家 (Maximizing player)，因为我方的目的是使局面尽可能更优。相应的,我们称对方为极小玩家 (Minimizing\
    \ player)。你或许已经注意到,最大化和最小化部分的代码是十分类似的。因此, 可以将它合并并简化为负值最大算法 (Negamax algorithm):\n\
    \n```python\ndef negamax(board, depth, player_id):\n    # 达到最大深度，或已经是终局局面，直接估值\n\
    \    if depth == 0 or is_terminated(board):\n        return evaluate(board, player_id)\n\
    \    # 双方的id分别是0和1\n    opponent_id = 1 - player_id\n    score = -float('inf')\n\
    \    for move in get_valid_moves(board, player_id):\n        new_board = drop(board,\
    \ move)\n        score = max(score, -negamax(new_board, depth - 1, opponent_id))\n\
    \    return score\n```\n\n本质上来说，极大极小算法和负值最大算法并无区别，只不过负值最大算法利用了 max(a, b) = min(-a,\
    \ -b) 这一数学恒等式而已。此式也是理解上面代码实现的关键。\n\n最后来看一个例子，理解极大极小算法具体是如何运作的。同时这一个例子也会在之后 Alpha-Beta剪枝\
    \ 的时候被重新讨论。\n\n![](img/9b291315612c9c478ad54afa29381fce_143_0.png)\n\n上图所示是一棵博弈树，其中圆形的结点表示轮到我方落子的情况，方形的则表示轮到对方落子。结点上的数字代表该点最后的分值，其中圆形结点是我方结点，对所有子节点的分值取最大值；而方形结点则对子结点分值取最小值。我们记第\
    \ i 层的第 j 个结点为 $u_{ij}$，标号从 0 开始，最上层的圆形节点为 $u_{0,0}$。当前图中已经完成了对 $u_{1,0}$ 子树的探索。当开始调用极大极小算法的时候，我们处在\
    \ $u_{0,0}$ 结点，接着开始深度优先地递归探索它的左子树。完成对某个结点的所有子结点的搜索时，就可以确定该结点的评分了。例如图中，已经确定了左下\
    \ 3 个结点的评分分别是 4、7、6，其父结点是极小结点，应用刚刚的极大极小原则可以得出父结点的评分是 3 个数中的最小值 4。\n\n### （二）Alpha-Beta\
    \ 剪枝\n\n如前文所述，在极大极小算法中，每一层需要搜索的节点个数和层数是成指数相关的，所以通常能够搜索的最大深度并不会很大，这在很大程度上限制了算法的效果。为了改善算法的效率，可引入Alpha-Beta剪枝策略，它在某些情况下可以极大地减少一层中需要搜索的节点个数，同时完全不影响算法的准确性。人们通常把采用了Alpha-Beta剪枝策略的极大极小算法简称为Alpha-Beta搜索。实际上，它的核心思想十分简单：如果某个走法一定劣于已知的走法，那就不需要继续搜索它，而是可以把该走法代表的结点连同其子树直接剪去。\n\
    \n依然考虑之前的例子，符号与前文相同。假设我们已经完成了 $u_{2,3}$ 及其子树的探索，并给出它的值是3。由于方形节点最终会取最小值，所以我们已经知道\
    \ $u_{1,1}$ 的值至多不会超过3。同时，已知 $u_{1,0}$ 的值是 4，而最顶层的 $u_{0,0}$ 将在 $u_{1,0}$ 与 $u_{1,1}$\
    \ 间取较大值，也就是说，$u_{0,0}$ 的值至少不会小于4，因此，$u_{1,1}$ 的取值不会对 $u_{0,0}$ 造成任何影响。在此情况下，直接放弃\
    \ $u_{1,1}$ 及其子结点是非常合理的选择：对于剩下的 $u_{2,4}$ 子树，我们完全不必再费时去搜索它了。\n\n![](img/9b291315612c9c478ad54afa29381fce_144_0.png)\n\
    \n现在再来把这个例子进行一定的抽象，从而得出Alpha-Beta 剪枝的具体算法。对于每一个圆形节点（极大玩家节点），保存当前已知子树的最大值，记为α；同理，对于每一个方形节点，保存当前已知子树的最小值，记作β。当出现\
    \ α≥β 的时候，由以上的论证可知，可以完全放弃当前节点，不再对剩下的子树进行搜索。此处我们先看看其代码，之后再讨论Alpha-Beta 剪枝的运作方式。\n\
    \n```python\ndef alphabeta(board, depth, alpha, beta, player_id):\n    # 达到最大深度，或已经是终局局面，直接估值\n\
    \    if depth == 0 or is_terminated(board):\n        return evaluate(board, player_id)\n\
    \n    # 双方的id分别是0和1\n    opponent_id = 1 - player_id\n\n    # 极大玩家部分\n    if is_maximizing_player(player_id):\n\
    \        score = -float('inf')\n        for move in get_valid_moves(board, player_id):\n\
    \            new_board = drop(board, move)\n            score = max(score, alphabeta(new_board,\
    \ depth - 1, alpha, beta, opponent_id))\n\n        # 有得分更高的子树，更新alpha\n      \
    \  if alpha < score:\n            alpha = score\n        # 出现alpha>=beta，直接剪枝\n\
    \        if alpha >= beta:\n            break\n        return score\n\n    # 极小玩家部分\n\
    \    else:\n        score = float('inf')\n        for move in get_valid_moves(board,\
    \ player_id):\n            new_board = drop(board, move)\n            score =\
    \ min(score, alphabeta(new_board, depth - 1, alpha, beta,\n                  \
    \                        opponent_id))\n\n            # 有得分更低的子树，更新beta\n    \
    \        if beta > score:\n                beta = score\n            if alpha\
    \ >= beta:\n                break\n\n        return score\n\n# 外部初始调用，将alpha设置为-inf，beta设置为inf\n\
    alphabeta(current_board, max_depth, -float('inf'), float('inf'), player_id)\n\
    ```\n\n结合代码，考虑极大玩家的节点。这类节点的\\(\\alpha\\)是从它的双亲节点传过来的，在整个过程中都不会被修改。在这个节点中，我们每探索完它的一棵子树，都会去尝试更新对应的\\\
    (\\beta\\)。如果某个时刻，\\(\\beta\\)变得比\\(\\alpha\\)小了，当前节点就永远不会被其父节点所选择。因此，可以直接放弃剩下的搜索。\n\
    \n## 思考与实践\n\n13.2 与极大极小算法一样，Alpha-Beta 剪枝也有其对应的负值最大形式，试一试，请把上面的代码转化为负值最大形式。\n\
    \n### （三）迭代加深\n\n或许你可能已经注意到，如果首先探索的是比较优的子树，剪枝会更早地被触发，从而避免对其他子树进行无用的搜索。所以，我们可以先对每一个走法进行估价，按照估价的结果由大到小进行排序，并按此顺序进行探索。\n\
    \n"
