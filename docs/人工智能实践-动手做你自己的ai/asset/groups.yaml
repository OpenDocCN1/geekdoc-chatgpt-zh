    ## 第 1 部分 图像识别


    人们每时每刻都在无意识地进行图像识别：识别物体，拿起它们；识别障碍物，避开它们；识别文字，进行阅读理解；识别人脸，进行身份判断。对于人类来说，图像识别是一个自然又简单的过程，从眼睛接受光信号到大脑识别出图像，几乎不需要思考。而对于计算机来说，图像识别就没那么容易了。从计算机被发明以来，科学家们一直期望让计算机能自动识别出图像内容，但是由于算法和硬件方面的限制，计算机的图像识别能力一直远低于人类的水平。直到近几年，随着深度学习的发展，图像识别的效率和准确率得到了大幅度的提升。在近几年人工智能浪潮中，图像识别是发展最快、技术最成熟、落地最早的算法。车牌识别、人脸识别等诸多基于图像识别的技术正在改变着人们的生活。在本部分中，我们将一起了解机器处理图像数据的原理，编写图像识别的两个经典算法：
    K 近邻算法与卷积神经网络，并解决手写数字识别以及物体识别问题。


