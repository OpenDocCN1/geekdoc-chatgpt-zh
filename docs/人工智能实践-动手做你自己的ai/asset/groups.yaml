  mdcn: "\n## 唐诗高频词\n\n(来自于 https://github.com/chinese-poetry/chinese-poetry)\n\n\
    接下来的章节将具体了解一些从语料中学习语言模型的方法。\n\n## 思考与实践\n\n8.1 这里所介绍的统计语言模型其实也是一个简化版本，请尝试运用这种建模思想设计一个更普适的语言模型。\n\
    \n## 第九章 n元语法模型——从数数开始\n\n在本章中，我们将要学习n元语法模型的基本原理并使用Python实现n元语法模型。通过本章学习体会n元语法模型简化问题的基本思路，学会用n元语法模型完成初级的文本生成。\n\
    \n### 一、算法思想\n\n之前我们认为第m+1个词的概率依赖于前面所有的词w1...wm，如果在统计语言模型的基础上进一步简化，认为第m+1个词的概率只依赖于前面的n-1个词，即\
    \ wm, wm-1, ..., wm-n+2，与更远的历史无关，并且n是一个与m无关的常数，我们就称这种语言模型为n元语法模型。例如，对于2元语法模型，有\
    \ P (wm+1 | w1, w2, ..., wm) = P (wm+1 | wm)。\n\n马尔可夫性质 (Markov property) 是概率论中的一个概念。当一个随机过程在给定现在状态以及历史所有状态的情况下，未来状态的概率分布仅依赖于当前状态，那么这个随机过程就具有马尔可夫性质。可以看到，正文中举的2元语法模型的例子恰好说明了它满足马尔可夫性质，而更广的n元语法实质上是马尔可夫性质的一个推广。马尔可夫链是最广为人知的马尔可夫过程，但不少其他的过程，包括布朗运动也是马尔可夫过程。\n\
    \n### 二、算法细节\n\n> “一、二、三、五、四……”\n> “不，爸爸。应该是一、二、三、四、五……”\n> “好了，那如果我就是要说一、二、三、五、四，为什么我不能这么说呢？”\n\
    > “因为……因为不是这样的。”\n> ——迈克尔·阿廷《代数》\n\n如何从语料中统计 P（w_{m+1} | w_m）呢？\n\n“一去二三里，烟村四五家。亭台六七座，八九十枝花。”孩童时期，人们其实就已经掌握了最基本的统计手段——数数。\n\
    \n因此，如果想要估计条件概率 P（人工智能 | 我喜欢），那么只需要统计语料中“我喜欢”和“我喜欢人工智能”出现的次数，即C（我喜欢）和C（我喜欢人工智能），则自然地就可以得到\n\
    \nP（人工智能 | 我喜欢） = \\frac{C（我喜欢人工智能）}{C（我喜欢）}\n\n以上就是n元语法模型的核心思想，相信它并不难理解。下图所示的是一个6元语法的例子。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_105_0.png)\n\n### 三、代码实现\n\n下面我们动手实现n元语法。\n\
    \n- (1) 导入必要的库：\n\n- random: Python内置的随机函数库。\n\n- jieba: 一个中文分词工具，支持多种模式的分词。\n\
    \n```\n# 如果没有安装 jieba 库\n# 请使用 pip install jieba 安装\nimport random\nimport jieba\n\
    ```\n\n- (2) 读取语料数据，选择分字或者是分词，确定n元语法检索长度。\n\n中文不同于英语，中文的词是紧凑连接的，无法用空格分开。例如“这是人工智能的黄金时代”这句话，希望能够分割成“这/是/人工智能/的/黄金时代”。\n\
    \n```\n# 读取语料数据\ncorpus_file = open(\"../input/poetry.txt\", \"r\", encoding=\"\
    utf-8\")\nraw_text = corpus_file.readlines()\ntext = \"\"\nfor line in raw_text:\n\
    \    text += line.strip()\ncorpus_file.close()\n# 选择分词或者是分字\nsplit_mode = \"char\"\
    \nif split_mode == \"char\":\n    token_list = [char for char in text]\n# 利用jieba库分词\n\
