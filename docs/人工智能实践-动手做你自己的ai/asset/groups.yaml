    # 概念解析


    # 优化器


    计算机科学家提出了许多复杂的优化器，它们可能使用动态变化的学习率、或者使用更多的导数信息改变权重。Adam优化器和随机梯度下降优化器都是常用且高效的优化器。其中，随机梯度下降优化器与梯度下降法紧密相关，它每次会随机对一定数量的数据点（而非全部数据点）求损失函数，并根据该损失函数的导数信息改变权重。Adam优化器则是随机梯度下降的一种改进。优化时每次选择的数据点数量通常被称为批量大小。


