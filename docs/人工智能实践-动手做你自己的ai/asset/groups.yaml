    u<sub>1</sub><sub>，</sub><sub>1</sub> 的值至多不会超过3。同时，已知 u<sub>1</sub><sub>，</sub><sub>0</sub>
    的值是 4，而最顶层的 u<sub>0</sub><sub>，</sub><sub>0</sub> 将在 u<sub>1</sub><sub>，</sub><sub>0</sub>
    与 u<sub>1</sub><sub>，</sub><sub>1</sub> 间取较大值，也就是说，u<sub>0</sub><sub>，</sub><sub>0</sub>
    的值至'
