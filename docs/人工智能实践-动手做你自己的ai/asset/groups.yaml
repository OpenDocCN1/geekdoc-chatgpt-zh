    # 三、使用 Keras 搭建一个简单的卷积神经网络


    了解了卷积神经网络的原理后，我们开始尝试动手搭建一个简单的卷积神经网络。Keras库提供了非常方便的搭建卷积神经网络的方法，整个过程就像是搭积木一样，将想要的网络层一层一层搭建起来。


    +   首先导入一些必要的库，我们主要会用到Keras库。

    +   - mnist：Keras库中包含的一个方便下载MNIST数据集的类。

    +   - Sequential：Keras线性模型框架，可以理解为积木的模板。

    +   - 神经网络中的一些常用层。

    +     - Dense：全连接层。

    +     - Flatten：平铺层。'
