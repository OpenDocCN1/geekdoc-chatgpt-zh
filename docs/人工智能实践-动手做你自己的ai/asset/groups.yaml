    # 第十五章 马尔可夫决策过程


    本章我们将认识马尔可夫决策过程各要素的基本概念，了解智能红绿灯状态和奖励的设计思路，并从马尔可夫决策过程（Markov Decision Process，MDP）的角度思考红绿灯调度问题。


    马尔可夫决策过程是强化学习的基础，也可理解为是智能体所居住的世界。在这个世界里，时间被分割成一个一个时间点，智能体依时间顺序 t=1, 2, 3...


    同环境交互。在每个时间点 t，它会感知到自己处于状态 $S_t$，然后选择并做出一个可行的动作 $A_t$，接着在下一个时间点 $t+1$ 得到奖励 $R_{t+1}$，并到达新的状态
    $S_{t+1}$，由此构成智能体与环境交互的序列：$S_0, A_0, R_1, S_1, A_1, R_2, S_2, A_2, R_3 \cdots$


    接下来我们先去认识一些马尔可夫决策过程中涉及的重要概念。


    # 一、状态


    在马尔可夫决策过程中，智能体的状态具有马尔可夫性，这是指智能体未来可能到达的状态 $S_{t+1}$ 只取决于当前状态 $S_t$，与过去的历史不相关。智能体的世界是基于“未来只取决于当前”的假设来运作的。


    智能体的状态如同棒球手击出的棒球，基于每个时间点上棒球的位置和速度，用简单的物理知识可以推算出它即将到达的下一个状态乃至整个的飞行轨迹，棒球飞行的这种状态就是马尔可夫的。


    以智能红绿灯这个智能体为例，它的状态是路口的交通状况。如下图所示，一个十字路


