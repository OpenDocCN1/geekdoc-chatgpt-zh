    \n## 概念解析\n\n## 向量、矩阵、张量与通道\n\n图像的存储方式涉及四个专业术语。\n\n向量：用最简单的方式理解，一个向量其实就是一组数字。如下左图所示。\n\
    \n矩阵：矩阵也是一组数字，与向量有所不同，它由行与列构成。矩阵中的数字都可以用x行y列来定位。一个矩阵的形状由两个整数定义，如下中图的矩阵就是一个大小为（5，5）的矩阵。矩阵可以用来描述灰度图。\n\
    \n张量：张量是一种更广义的概念。如果我们希望排列方式不仅有行和列，还有更多的维度，那么就需要用到张量。向量实际上就是一阶张量，矩阵就是二阶张量，如下右图是一个三阶张量，它的大小是（5，5，3）。三阶张量可以用来描述RGB彩色图。\n\
    \n通道：一张彩色图像通常由一个三阶张量表示，而除了行与列的维度，另外一个维度称为通道。如下右图所示，一张RGB格式的图像，通道数量为3。\n\n![](img/9b291315612c9c478ad54afa29381fce_16_0.png)\n\
    \n## 思考与实践\n\n- 1.1 如果有一张 100×100 像素的 RGB 彩色图像，计算机存储这张图像需要存多少个数字呢？\n\n- 1.2 除了\
    \ RGB，每个像素中还可以存储什么信息？\n\n- 1.3 一张灰度图能否用 3 阶张量表示？如果能的话，该张量的形状是怎样的？通道数量是几？\n\n##\
    \ 三、人如何识别图像\n\n在学习如何让计算机识别图像之前，我们先花五分钟时间想一想自己是如何识别图像的。\n识别图像对人类来说似乎是一种天赋，完全是下意识的行为，识别过程在大脑中自动完成。\n\
    环视一下你书桌上的各种物体，是不是感觉没有动脑就自动给出了每个物体的名称，因为这些物体对你来说很熟悉，所以识别过程很难被注意到。现在让我们来认真体验一下识别一个新图像的过程。我们将观察一组可能从未见过的图像以及它们的标号，然后为另一组新的图像标号，试着感受一下识别过程。下图是第一组图像。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_17_0.png)\n\n现在观察第二组图像，为每张图打上编号（1 号、2\
    \ 号、3 号或者都不是）。感受一下自己识别图像的过程。\n\n![](img/9b291315612c9c478ad54afa29381fce_17_1.png)\n\
    \n公布答案！从左到右分别是：都不是、都不是、3 号、2 号、1 号。其实这些图像都是甲骨文。第一组图像中的 1 号是龙、2 号是车、3 号是火。第二组图像的第一张是鸟，第二张是车的另外一种写法。\n\
    \n回想一下刚才的识别过程，你是不是将第二组图像与第一组图像一一做比较，与1号、2号、3号哪个更像，就把它打上相应的标签？如果与这3个都不像，就认为这是一张未知的图像。那么具体怎样才算像呢？请你再尝试一次，感受一下判断像不像的过程。对于这几张甲骨文的图像，我们可能会注重形状上的相似，例如都是瘦瘦长长的，或者都有左右两个圆圈，圆圈中有一个十字，又或者都有三个尖的突起等。其实计算机识别图像的过程与人的判断过程十分类似。计算机也是通过与已有标签的图像做比较，来对新的图像作出判断。与人判断过程不同的是，计算机科学家们会设计算法，来捕捉与图像形状、颜色相关的各种特征，通过这些特征来判断图像的相似度。这个捕捉特征来判断相似程度的算法的效果，能够很大程度决定图像识别的效果。\n\
    \n## 四、类别的表示方法\n\n| 5 | 0000010000 = 5 |\n| 0 | 1000000000 = 0 |\n| 4 | 0000100000\
    \ = 4 |\n| 1 | 0100000000 = 1 |\n| 9 | 0000000001 = 9 |\n| 2 | 0010000000 = 2\
    \ |\n\n图像识别本质上是个分类问题，也就是给计算机一张图像，让其给出图像所属的类别。在计算机中，类别往往也是用数字表示的。例如一个二分类问题，类别的标签就是0和1，无论分的是猫和狗，还是苹果和香蕉，都可以把其中一种类别标记为0，另一种标记为1。如果类别不止两类，那么就要使用更多数字，例如一个十分类问题，类别的标签就是0~9这十个数字。但是直接使用数字作为标签会有个小问题，那就是数字之间有比较和算术关系，如2>1，5<7，3×3\
    \ = 9，而标签类别之间并没有这种比较关系，如苹果和香蕉是平级的，不存在苹果大于香蕉，或者梨是西瓜的2倍之类的关系。如果做分类问题时直接让计算机输出一个数字，数字自身的比较和算术关系会影响计算机的判断。所以通常我们会用一种叫独热编码（One\
    \ Hot Encoding）的方法来代替数字。例如有10个类别，我们就会用10个0或1来表示任何一种类别，其中只有一个位置是1，其余位置都是0，哪一位是1就代表哪个类别，如上图所示。\n\
    \n## 五、图像识别领域的经典数据集\n\n我们知道计算机进行图像识别需要先有一些已知的图像，也就是已经被标注了类别的图像。这一节中我们将了解几个经典的图像数据集。\n\
    \n### (一) MNIST 手写数字数据集\n\nMNIST数据集是一个非常著名的数据集，很多教程都会使用它，新的分类算法也往往会先在MNIST数据集上做效果测试。MNIST数据集来自美国国家标准与技术研究所(National\
    \ Institute of Standards and Technology)。该数据集中包含了由250个人手写的数字，其中50%是高中学生，50%来自人口普查局的工作人员。在MNIST数据集中的每张图像都由28×28个像素构成，每个像素用一个灰度值表示。下面我们利用代码对MNIST数据集进行可视化。\n\
    \n首先导入一些必要的库。\n\n- mnist：Keras库中的一个方便我们下载MNIST数据集的类。\n- pyplot：Python中常用的画图工具matplotlib的画图类。\n\
    - numpy：Python中用于处理各种数值计算的库。\n\n```\n# 如果没有安装 keras 和 tensorflow 库\n# 请使用 pip\
