    n元语法模型利用了马尔可夫性质，这也恰是其问题所在，因为在预测下一个词是什么的时候，只考虑固定长度的前若干个词明显是不够的。在传统的深度神经网络中，输入层接受输入，经过隐层的计算得到输出。循环神经网络则将考虑历史信息的想法与神经网络相结合，在每一个时刻
    t，神经元接受的输入不只有原输入 x，还有上一个时刻的神经元的状态 s(t-1)，这样某一个时刻 t 的信息就可以沿着时间线一直传播，在预测每个时刻的输出的时候，历史信息也自然而然地被包含进来了。


    ![](img/9b291315612c9c478ad54afa29381fce_114_0.png)


    +   上图是一个典型的循环神经网络结构图，其中符号解释如下：

    +   - x_t 是 t 时刻的输入，在我们的场景中，它就是第 t 个词的词向量。

    +   - s_t 是 t 时刻的状态，在之前深度神经网络的学习中我们知道，s_t=f ( Ux_t+b)，其中 f 是激活函数， U 是权重矩阵，b 是偏差，而循环神经网络在这里作了修改，即在循环神经网络中，s_t=f
    ( Ux_t+W s_{t-1} )，这样就把上一个时刻的状态 s_{t-1} 考虑进来了。

    +   - o_t 是 t 时刻的输出，这里和深度神经网络并没有区别，o_t=softmax ( Vs_t )。


    循环神经网络的想法并不复杂，在此基础上人们又对循环神经网络作了很多改进，现在人们使用的循环神经网络模型几乎全都是改进版本了，这其中就有大名鼎鼎的长短期记忆网络（Long-Short
    Term Memory，LSTM）。


    # ### 2. 改进： 长短期记忆网络


    长短期记忆网络保持了循环神经网络的基本结构，只是在神经元内部引入了门控结构来控制神经网络对于信息的遗忘与记忆。'
  - '[PAGE 115]


    ![](img/9b291315612c9c478ad54afa29381fce_115_0.png)


    不同于传统循环神经网络只在不同时刻之间传递一个\( h_t \)（隐状态，hidden state），长短期记忆网络在上一个时刻与下一个时刻传递的状态有两个，\(
    c_t \)（细胞状态，cell state）和\( h_t \)。


    简单来说，长短期记忆网络神经元的内部计算可以分为3个阶段。


    首先是选择遗忘阶段，由门\( f_t \)进行控制，决定对\( c_{t-1} \)中的哪些信息进行遗忘。具体来说，先由\( f_t=\sigma(W_f
    [h_{t-1}, x_t] + b_t) \)产生门控信号，再通过\( f_t \circ c_{t-1} \)得到选择遗忘结果（其中\( \sigma
    \)指sigmoid运算，[]指向量的拼接，\( \circ \)运算指哈达玛积，下同）。可以看到，经由sigmoid运算，\( f_t \)是一个各个维度的值都在\(
    (0, 1) \)之间的向量，从而在与\( c_{t-1} \)进行哈达玛积运算时，可以对\( c_{t-1} \)各个维度的数值进行强度控制，这就是\(
    f_t \)称为门控信号的原因，之后的其他门也是一样的。


    # 概念解析


    # 哈达玛积


    哈达玛积（Hadamard product），又称舒尔积或逐项积。


    若两个矩阵\( A \)和\( B \)具有相同的维度\( m \times n \)，则它们的哈达玛积\( A \circ B \)是一个具有相同维度的矩阵，其元素值为：


    \( (A \circ B)_{ij} = (A)_{ij}(B)_{ij} \)


    对于维度不相同的矩阵，哈达玛积没有定义。


    哈达玛积被应用于有损图片压缩，同时也被应用于门控循环神经网络的结构描述。'
