    \ sigmoid 而是取值范围为 (-1, 1) 的 tanh 运算，是因为 c̄ 并不是门控信号。\n\n最后是输出阶段，由门 o_t 进行控制，将输入\
    \ x_t 与 c_t 结合得到输出 h_t。具体来说，由 o_t = σ(W_o [h_{t-1}, x_t] + b_o) 产生门控信号，接着通过 h_t\
    \ = o_t ⊙ tanh(c_t) 得到下一个时刻的隐状态。\n\n长短期记忆网络的计算比传统循环神经网络要复杂许多，现在主流的机器学习框架都已经封装好了它的实现，我们可以利用其方便地搭建一个长短期记忆网络。\n\
    \n### 3. 使用 Keras 搭建一个简单的长短期记忆网络\n\n这一节中我们用 Keras 框架搭建一个简单的长短期记忆网络。\n\n#### (1)\
    \ 加载必要的库。\n\n```python\n# 如果没有安装 keras 和 tensorflow 库\n# 请使用 pip install keras\
    \ tensorflow 安装\nimport itertools\nimport jieba\nimport numpy as np\nfrom collections\
    \ import Counter\nfrom keras.models import Model\nfrom keras.layers import Input,\
    \ Embedding, LSTM, Dense, TimeDistributed\nfrom keras.optimizers import SGD, Adam,\
    \ Adadelta\n```\n\n#### (2) 定义一些必要的工具函数，用来处理输入文本，生成训练数据。\n\n在这里我们并不利用网络每一个时刻的输出，而只是用最后时刻的输出作为对一个句子下一个词的预测，所以训练数据是由（前\
    \ n 个词，第 n+1 个词）这样的二元组构成的，下一节会简要介绍循环神经网络的几种不同结构。\n\n```python\n# 建立词汇表，为每种字赋予唯一的索引\n\
    def build_vocab(text, vocab_lim):\n    word_cnt = Counter(itertools.chain(*text))\n\
    \    vocab_inv = [x[0] for x in word_cnt.most_common(vocab_lim)]\n    vocab_inv\
    \ = list(sorted(vocab_inv))\n    vocab = {x: index for index, x in enumerate(vocab_inv)}\n\
    \    return vocab, vocab_inv\n```\n\n```python\n# 处理输入文本文件\ndef process_file(file_name,\
    \ use_char_based_model):\n    raw_text = []\n    with open(file_name, \"r\") as\
    \ f:\n        for line in f:\n            if (use_char_based_model):\n       \
    \         raw_text.extend([str(ch) for ch in line])\n            else:\n     \
    \           raw_text.extend([word for word in jieba.cut(line)])\n    return raw_text\n\
    \n# 格式化文本，建立词矩阵\ndef build_matrix(text, vocab, length, step):\n    M = []\n  \
    \  for word in text:\n        index = vocab.get(word)\n        if index is None:\n\
    \            M.append(len(vocab))\n        else:\n            M.append(index)\n\
    \    num_sentences = len(M) // length\n    M = M[: num_sentences * length]\n \
    \   M = np.array(M)\n\n    X = []\n    Y = []\n    for i in range(0, len(M) -\
    \ length, step):\n        X.append(M[i : i + length])\n        Y.append(M[i +\
    \ length])\n    return np.array(X), np.array(Y)\n```\n\n- (3) 读取语料，用之前写好的工具函数得到训练数据。\n\
    \n```python\nseq_length = 5\nraw_text = process_file(\"../input/poetry.txt\",\
    \ True)\nvocab, vocab_inv = build_vocab(raw_text, 4000)\nX, Y = build_matrix(raw_text,\
    \ vocab, seq_length, 1)\n```\n\n- (4) 搭建长短期记忆网络模型。\n\n注意，Embedding 层就是之前所说的词向量嵌入层。在使用词向量的时候，可以先使用之前介绍的词到向量方法先训练得到词向量，再训练神经网络；也可以不作预先的训练，把词向量视作神经网络的参数，让神经网络在训练过程中同步调整词向量。这里我们为了简化采用后面一种方式。\n\
    \n```python\n# 构建模型\ninputs = Input(shape=(None, ))\nembedding = Embedding(input_dim=len(vocab)\
    \ + 1, output_dim=128,\n    trainable=True)(inputs)\nlstm1 = LSTM(units=128, return_sequences=False)(embedding)\n\
    outputs = Dense(units=len(vocab) + 1, activation='softmax')(lstm1)\nmodel = Model(inputs=inputs,\
    \ outputs=outputs)\n\n# 编译模型\nmodel.compile(optimizer=Adam(lr=0.001),\n    loss='sparse_categorical_crossentropy')\n\
    \n# 输出模型报告\nmodel.summary()\n```\n\n(5) 进行 batch 训练，并在训练完毕后保存模型。\n\n```python\n\
    model.fit(X, Y, batch_size=512, epochs=60, verbose=1)\nmodel.save('lstm-poetry.h5')\n\
    ```\n\n### 4. 结果\n\n我们在五言诗数据集上训练，并且让模型在给出第一句诗后生成任意长度的诗歌。下面所示的是以“明月松间照”作为开头生成的诗。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_118_0.png)\n\n![](img/9b291315612c9c478ad54afa29381fce_118_1.png)\n\
    \n## 第十一章 编码与解码——seq2seq\n\n在本章中，我们将要学习循环神经网络的不同结构、seq2seq 的基本架构，并使用 Keras 搭建一个\
    \ seq2seq 模型。通过本章学习，要求掌握循环神经网络不同变体的不同应用，了解编码器—解码器架构的思想，并学会使用 seq2seq 模型进行文本生成。\n\
    \n在长短期记忆网络模型完成后，可以进行任意语料训练和文本生成了。接下来更进一步，解决给出上句诗，输出下句诗这样一个特殊的问题。在这一节中，我们将学习使用\
    \ seq2seq（序列对序列）模型。\n\n### 一、引入：循环神经网络的不同结构\n\n![](img/9b291315612c9c478ad54afa29381fce_119_0.png)\n\
    \n首先我们了解一下循环神经网络的几种结构，如上图所示。\n\n- (1) 一对一：这种模型其实算不上是循环神经网络，而是典型的固定长度输入和输出的前馈神经网络。\n\
    - (2) 一对多：应用于给图片配字幕、机器看图说话等。即在开始处输入图片的信息，然后让机器自由输出句子。\n- (3) 多对一：应用于情感分析、文本分类、文本生成等。即输入一个句子的信息，输出一次预判。之前的例子，使用的就是这种结构。\n\
    - (4) 变长多对多：应用于机器翻译、机器问答等。\n- (5) 定长多对多：应用于文本生成、语言模型等。seq2seq 就是一种类似于变长多对多的结构。\n\
    \n### 二、编码器-解码器\n\n![](img/9b291315612c9c478ad54afa29381fce_120_0.png)\n\n最基础的\
    \ seq2seq 模型包含了 3 个主要的组成部分：编码器（encoder）、解码器（decoder）和连接它们的中间状态向量。编码器通过学习输入语句，将语句编码成一个固定大小的中间状态向量\
    \ S（这个中间状态向量中包含了整个输入语句的语义信息），然后将 S 传给解码器，解码器再对状态向量进行解码并产生输出。\n\n举个例子，如果编码器和解码器都采用长短期记忆网络，那么\
    \ S 就是编码器最后一个时刻的隐状态和细胞状态，我们把它作为解码器第一个时刻神经元的初始隐状态和初始细胞状态，然后通过解码器对这个信号进行解码。\n\n\
    ### 三、使用 Keras 搭建一个简单的 seq2seq 模型\n\nKeras 官方有一个 seq2seq 的公开实现，以下代码基于 Keras 的公开实现作了一点改动。\n\
    \n- (1) 导入必要的库。\n\n```python\nfrom keras.models import Model\nfrom keras.layers\
    \ import Input, LSTM, Dense, Embedding\nfrom keras.optimizers import Adam\nimport\
    \ numpy as np\n```\n\n- (2) 定义一些参数——batch 大小，epoch 数，状态向量维数，词嵌入维数和语料路径。\n\n```python\n\
    batch_size = 64\nepochs = 100\nlatent_dim = 256\nembedding_size = 128\nfile_name\
    \ = '../input/poetry.txt'\n```\n\n- (3) 从语料构建编码器和解码器的训练数据。\n\n```python\nline_sp\
    \ = line.strip().split(',')\nif len(line_sp) < 2:\n    continue\ninput_text, target_text\
    \ = line_sp[0], line_sp[1]\ntarget_text = '\\t' + target_text[:-1] + '\\n'\ninput_texts.append(input_text)\n\
    target_texts.append(target_text)\nfor ch in input_text:\n    if ch not in input_vocab:\n\
    \        input_vocab.add(ch)\nfor ch in target_text:\n    if ch not in target_vocab:\n\
    \        target_vocab.add(ch)\n# 确定编码器、解码器网络长度\ninput_vocab = sorted(list(input_vocab))\n\
    encoder_vocab_size = len(input_vocab)\nencoder_len = max([len(sentence) for sentence\
    \ in input_texts])\ntarget_vocab = sorted(list(target_vocab))\ndecoder_vocab_size\
    \ = len(target_vocab)\ndecoder_len = max([len(sentence) for sentence in target_texts])\n\
    # 初始化输入和输出词汇反向词典\nreverse_input_char_index = dict(\n    (i, char) for char, i\
    \ in input_vocab.items())\nreverse_target_char_index = dict(\n    (i, char) for\
    \ char, i in target_vocab.items())\n\ninput_vocab = dict([(char, i) for i, char\
    \ in enumerate(input_vocab)])\ntarget_vocab = dict([(char, i) for i, char in enumerate(target_vocab)])\n\
    ```\n\n```python\n# 利用词典向量化输入和目标\nencoder_input_data = np.zeros((len(input_texts),\
    \ encoder_len), dtype='int')\ndecoder_input_data = np.zeros((len(input_texts),\
    \ decoder_len), dtype='int')\ndecoder_target_data = np.zeros((len(input_texts),\
    \ decoder_len,\n1), dtype='int')\nfor i, (input_text, target_text) in enumerate(zip(input_texts,\
    \ target_texts)):\n    for t, char in enumerate(input_text):\n        encoder_input_data[i,\
    \ t] = input_vocab[char]\n    for t, char in enumerate(target_text):\n       \
    \ decoder_input_data[i, t] = target_vocab[char]\n        if t > 0:\n         \
    \   decoder_target_data[i, t - 1, 0] = target_vocab[char]\n```\n\n#### (4) 构建\
    \ seq2seq 模型。\n\n```python\n# 编码器网络建构\n\n# 编码器输入层\nencoder_inputs = Input(shape=(None,))\n\
    # 编码器词嵌入层\nencoder_embedding = Embedding(input_dim=encoder_vocab_size,\n    output_dim=embedding_size,\
    \ trainable=True)(encoder_inputs)\n# 编码器长短期记忆网络层\nencoder = LSTM(latent_dim, return_state=True)\n\
    # 编码器长短期记忆网络输出是一个三元组(encoder_outputs, state_h, state_c)\n# encoder_outputs 是长短期记忆网络每个时刻的输出构成的序列\n\
    # state_h 和 state_c 是长短期记忆网络最后一个时刻的隐状态和细胞状态\nencoder_outputs, state_h, state_c\
    \ = encoder(encoder_embedding)\n# 我们会把 state_h 和 state_c 作为解码器长短期记忆网络的初始状态，之前我们所说的状态向量的传递就\n\
    # 是这样实现的\nencoder_states = [state_h, state_c]\n\n# 解码器网络建构\n\n# 解码器输入层\ndecoder_inputs\
    \ = Input(shape=(None,))\n# 解码器词嵌入层\ndecoder_embedding = Embedding(input_dim=decoder_vocab_size,\n\
    \    output_dim=embedding_size, trainable=True)(decoder_inputs)\n# 解码器长短期记忆网络层\n\
    decoder_lstm = LSTM(latent_dim, return_sequences=True, return_state=True)\n# 解码器长短期记忆网络的输出也是三元组，但我们只关心三元组的第一维，同时我们在这里设置了解码器\n\
    # 长短期记忆网络的初始状态\n```\n"
