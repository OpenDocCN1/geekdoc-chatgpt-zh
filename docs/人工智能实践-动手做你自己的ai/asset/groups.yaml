    \n通过“一、算法思想”中的例子，我们了解到平面中两个点之间的相似度可以用它们的距离表达，距离越小代表相似度越高。点之间的距离可以通过勾股定理得到，平面上a和b两个点的距离可以由下面的公式计算得出：\n\
    \ndist(a, b) = \\sqrt{(a_1 - b_1)^2 + (a_2 - b_2)^2}\n\n其中 \\(a_1, b_1\\) 是 a,\
    \ b 两点的 x 轴坐标，\\(a_2, b_2\\) 是 a, b 两点的 y 轴坐标。\n\n同理，图像间的相似度也可以利用图像间的距离进行表达。我们知道一张灰度图是由一个矩阵来表示的，那灰度图之间的相似度，则可以用两矩阵间的距离表示。计算两个矩阵之间的距离与计算两个点的距离十分类似，只需要将矩阵对应位置的数字相减（所谓对应位置就是矩阵\
    \ A 的第一行第一列对应矩阵 B 的第一行第一列，矩阵 A 的第一行第二列对应矩阵 B 的第一行第二列），将对应数字相减后的平方求和，再取根号，即为两个矩阵间的距离。这个距离又被称为两个矩阵间的欧式距离。我们用\
    \ \\(A_{ij}\\) 来代表矩阵第 i 行第 j 列的数字，矩阵 A 和 B 之间的欧式距离下面的公式计算：\n\n\\(dist(A, B) =\
    \ \\sqrt{\\sum_{ij} (A_{ij} - B_{ij})^2}\\)\n\n两张图像对应矩阵的欧式距离越小，那么它们就越相似。\n\n##\
