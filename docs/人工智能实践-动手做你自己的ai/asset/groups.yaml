  - "[PAGE 138]\n\n需要按一定的权重，对各个函数的评分进行加权平均。如何分配权重又是一个大问题。例如，人们一般给国际象棋的每个棋子赋予分值，局面的得分就是已方棋子分数之和减去对方棋子分数之和。然而，双方棋子种类相同的局面，价值一定一样吗？当然不是。棋子的位置也会发挥很重要的作用。于是，就由另外的估价函数，综合己方和对方棋子的分布来给出评分。这两个估价函数各给出一个评分，直接相加不一定合适，而需要考虑何时棋子价值重要、何时棋子分布重要。最后，按某种方式给出权值，把分数加权平均作为最后的评分。\n\
    \n这里先抛开复杂的设计，回到最简单的情况。在角斗士棋中，一个最容易想到的估价函数就是：双方所占据方格数目的差值加上双方可以走的位置数目的差值。翻译成Python代码如下所示：\n\
    \n```\ndef evaluate(board, player_id):\n    # 双方的id分别是0和1\n    opponent_id = 1\
    \ - player_id\n\n    # get_score(board, id)返回id对应的玩家占据的方格数目\n    # eval1是双方所占方格数目的差值\n\
    \    eval1 = get_score(board, player_id) - get_score(board, opponent_id)\n\n \
    \   # get_valid_moves(board, id)返回id对应的玩家下一步的所有合法行动\n    # eval2是双方可以走的位置数目的差值\n\
    \    eval2 = len(get_valid_moves(board, player_id)) -\n    len(get_valid_moves(board,\
    \ opponent_id))\n\n    return eval1 + eval2\n```\n\n我们在此省略了很多不必要的细节，比如一个局面应该如何表示，如何求出当前的合法行动，以及如何处理某一方已经无法行动等特殊情况。这些内容虽然在具体实现上十分重要，但与核心的算法思想并没有太大关联，且可以有各种各样的实现方法。因此，这里不再展开叙述。\n\
