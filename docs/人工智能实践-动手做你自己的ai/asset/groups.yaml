    \ - 45s 908us/step - loss:\n5.0449e-05 - acc: 1.0000 - val_loss: 2.3215 - val_acc:\
    \ 0.7274\n```\n\n50轮训练完成！从这个过程可以看出使用预定义的VGG16架构，就可以使用非常少的代码在CIFAR-10数据集上获得72%的准确率。这个准确率并没有发挥出VGG16架构的全部实力，因为VGG16架构是为更复杂的Imagenet数据集设计的。相比CIFAR-10数据集，Imagenet数据集的种类更多，图像分辨率也更大。另外，如果使用更多先进的技巧，如图像增强，那么，VGG16架构的准确率将会进一步提升。\n\
    \n## 本部分小结\n\n在本部分中，我们了解了什么是图像识别问题，学习了灰度图、RGB图等图像在计算机中的表示方法，并且编写代码对图像识别的经典数据集进行了可视化。此外，我们还学习了K近邻与卷积神经网络这两种算法的原理、了解了他们的优缺点以及用Python编程实现。\n\
    \n图像识别领域的发展非常迅速，新算法层出不穷。希望通过本部分的学习，你能对图像识别和相关的算法有初步的认识。如果你感兴趣，我们非常鼓励你进行更为系统的学习，并且探索更新、更难、更有效的算法。\n\
    \n## 第 2 部分\n\n## 图像风格迁移\n\n现如今，当我们想要记录下眼前的风景时，可以采用手机拍摄的方式；而几百年前的画家，靠的则是画笔和双手。你可曾想过，如果让莫奈这样的名画家用画笔记录下你所看到的风景，那将是一幅怎样的绘画作品呢？\n\
    \n如果你了解 Photoshop 图像处理软件，那么就知道使用软件里面提供的滤镜功能，可以轻松地把照片转化为水彩、油画、炭笔画甚至浮雕等风格的绘画作品。\n\
    \n但是如果要求把照片转换成一幅带有莫奈风格的绘画作品就不是用 Photoshop 能轻易完成的了。或许可以通过不同滤镜的组合来达到效果，但还是比较复杂。然而，一些机器学习算法却能够轻易完成。让我们一起来探究机器学习算法是如何做到的。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_55_0.png)\n\n## 第四章 图像风格迁移基础知识\n\n\
    在本章中，我们将一起了解图像风格迁移概念，掌握与图像风格迁移相关的一些基础知识。\n\n### 一、图像风格迁移简介\n\n风格迁移的两个要素是内容与风格。我们希望达成的效果是，输入一张图像，程序可以把它转化为带有某种特定风格的图像，同时保留图像中原有的内容信息，而这种风格应该是由人工智能从该类风格的图像中学习得到。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_56_0.png)\n\n风格迁移的效果\n\n### 二、与图像风格迁移相关的基础知识\n\
    \n- 与图像风格迁移相关的基础知识有以下四点。\n- 有关计算机处理图像的知识（位图、RGB 向量、张量）。\n- 有关K近邻算法的概念。\n- 有关神经网络的内容（激活函数、卷积）。\n\
    - 像素级别梯度优化和cycleGAN。\n\n## 第五章 色彩的模仿——K近邻算法\n\n在本章中，我们将使用K近邻算法进行图像色彩风格迁移，学习如何在计算机中表示和处理图像，并动手实现基于K近邻算法的色彩风格迁移。\n\
    \n### 一、算法思想\n\n图像的内容是指图像中物体的形状、轮廓等。而图像的风格具有一定的抽象性，你也许能从画面的色彩运用、纹理、质感、笔触、线条等方面感受到图像的风格，却很难给风格下一个具体的定义。我们可以从最简单、直观的风格——色彩入手，试图保持一张图像的内容不变，赋予它另一张图像的色彩风格。技术实现上，需要提取图像的灰度图，然后根据风格图像对灰度图进行上色。为了实现这种做法，我们需要引入Lab色彩空间的概念。\n\
    \n### 概念解析\n\n### Lab色彩空间\n\n色彩空间是对颜色的一种量化描述。通常一种颜色可以用色彩空间中的一个三维坐标表示。例如在计算机上我们可以通过输入RGB的值得到一种具体颜色，这就\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_57_0.png)\n\nLab色彩空间\n\n是在RGB色彩空间下对颜色的描述。在处理图像时，除了我们常见的RGB色彩空间，还有一种Lab色彩空间，其中L维度表示亮度，a维度和b维度表示两个颜色通道。一种具体的颜色可以由Lab三个维度上的值来确定。一个像素点可以由Lab三维坐标表示，因此一张由像素点构成的图像（位图）可以由分别来自L通道、a通道和b通道的三个大小相同的矩阵表示。其中L通道的矩阵对应灰度值，a、b通道的两个矩阵对应色彩值。\n\
    \n现有图像A和B，要生成一张图像C，使它具有A的内容和B的风格。将这个问题放到Lab色彩空间下考虑。因为表示亮度的L通道反映了图像的内容，所以让图像C的L通道与图像A的L通道相同就可以把图像A的内容保留下来。如果将风格简单地定义为颜色，那么问题就转换成如何填充图像C的a、b通道使其拥有图像B的风格。因此，风格可以理解为从L通道到a、b通道的映射。如果仅仅考虑单个像素灰度值到色彩值的映射，那么一种灰度值唯一对应到一种色彩值，这样的映射太单一。于是我们需要考虑一个更复杂的映射——以某个像素点为中心的，一个3×3像素矩阵中，9个灰度值到该像素色彩值的映射，如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_58_0.png)\n\n由9个像素的灰度值确定中间像素的色彩值\n\n\
    我们可以采用K近邻算法来实现这个映射。在图像B的L通道中找到k个与输入最接近的3×3灰度矩阵，然后将这k个3×3矩阵中的中心像素的色彩值加权平均得到输出。其中两个3×3灰度矩阵的距离定义为两矩阵对应像素之差的平方和，权重为对应距离的倒数。用这种方法填充图像C的a、b通道后，图像C会带有图像B的风格。事实上，我们也可以让算法学习多张图像的风格，只需扩大k个与输入最接近的3×3灰度矩阵的查找范围到多张图像的L通道即可。\n\
    \n### 二、代码实现\n\n下面开始动手实现上述算法。首先导入一些必需的库。\n\n- numpy：用于处理各种数值计算。\n- skimage：用于读入、保存图像以及RGB模式和Lab模式的相互转化。\n\
    - sklearn: 提供K近邻算法的接口。\n\n```\nimport numpy as np\nfrom skimage import io, data\n\
    from skimage.color import rgb2lab, lab2rgb\nfrom sklearn.neighbors import KNeighborsRegressor\n\
    import os\n\n# data_dir是放置风格图像的目录\ndata_dir = \"knn_data/\"\n# input_path是内容图像的路径\n\
    input_path = \"input.jpg\"\n# output_path是输出图像的路径\noutput_path = \"output.jpg\"\
    \n# 设置灰度矩阵的大小为2*size+1\nsize = 1\n```\n\n读入图像，返回图像中所有 3×3 灰度矩阵到中心点色彩值的映射关系。\n\n\
    ```\n# 读入风格图像，得到x, Y\n# X: 储存3*3像素格的灰度值\n# Y: 储存中心像素格的色彩彩值\n# X, Y构成了从3*3像素格的灰度值到中心像素格色彩值的映射\n\
    def read_style_image(file_name):\n    img = rgb2lab(io.imread(file_name))\n  \
    \  w, h = img.shape[:2]\n    X = []\n    Y = []\n    for x in range(size, w -\
    \ size):\n        for y in range(size, h - size):\n            X.append(img[x\
    \ - size : x + size + 1, y - size : y + size + 1, 0].reshape(-1))\n          \
    \  Y.append(img[x, y, 1:])\n    return X, Y\n```\n\n读取若干张图像构建数据集。\n\n```\n# 读取所有data_dir目录下的风格图像，建立从3*3像素格的灰度值到中心像素格色彩值的映射\n\
    # number限制了读入风格图像的最大数目\ndef create_dataset(data_dir=data_dir, number=1):\n   \
    \ X = []\n    Y = []\n    n = 0\n    for file in os.listdir(data_dir):\n     \
    \   print(\"reading\", file)\n        X0, Y0 = read_style_image(os.path.join(data_dir,\
    \ file))\n        X.extend(X0)\n        Y.extend(Y0)\n        n += 1\n       \
    \ if n >= number:\n            break\n    return X, Y\n\nprint(\"reading data\"\
    )\nX, Y = create_dataset()\nprint(\"finish reading\")\n```\n\n建立K近邻算法模型，设置超参数k=4，即预测的色彩值是与其最近的4个点的色彩值的加权平均，其权重与距离的倒数成正比。\n\
    \n```\n# 调用sklearn的K近邻算法接口\nnbrs = KNeighborsRegressor(n_neighbors=4, weights='distance')\n\
    \nprint(\"start fitting\")\nnbrs.fit(X, Y)\nprint(\"finish fitting\")\n```\n\n\
    处理内容图像得到若干3×3的灰度矩阵。\n\n```\n# 获取内容图像的所有3*3像素格的灰度值\ndef split_origin_image(img,\
    \ size=size):\n    w, h = img.shape[:2]\n    X = []\n    for x in range(size,\
    \ w - size):\n        for y in range(size, h - size):\n            X.append(img[x\
    \ - size : x + size + 1, y - size : y + size + 1, 0].reshape(-1))\n    return\
    \ X\n```\n\n根据K近邻算法得到色彩风格迁移后的图像。\n"
