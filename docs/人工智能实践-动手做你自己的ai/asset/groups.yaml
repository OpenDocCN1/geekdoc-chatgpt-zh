    # 第七章 生成对抗网络


    在本章中，我们将了解生成对抗网络，并使用一种特殊的生成对抗网络——CycleGAN来实现图像风格迁移。在这个过程中，我们也会学习神经网络中一些比较复杂的结构，如反卷积层、批标准化层和残差网络。


    # 一、算法思想


    # (一) 协同进化——生成对抗网络


    ![](img/9b291315612c9c478ad54afa29381fce_76_0.png)


    猎豹只有跑得够快才能捕获猎物，羚羊因此也进化出更敏捷的身手。这是一种协同进化，生成对抗网络也是一个与此类似的过程


    在之前的方法中，每做一次风格迁移，都需要重新训练神经网络，十分麻烦。能否找到这样一种方式，可以在训练完之后，对于一张输入的图像，可以快速地产生一张特定风格的输出图像？


    或许我们可以使用卷积神经网络。搭建一个卷积神经网络，训练它，使它可以生成和目标风格相似的图像。那么，怎么确定神经网络的目标函数？即如何在数学上描述一张图像是否符合图像目标的风格？又如何对神经网络的输出进行判别？这是一个很难但很关键的问题。


    这个问题很难直接解决，但我们可以尝试用机器学习来解决。“如何判定一张图像是否符合某种风格？”这个问题本身可以被看作一个分类问题。可以采用之前学到的图像识别技术，建立一个新的神经网络对图像进行分类。如果能训练好这个判别网络，那就可以用这个网络去训练生成网络了。


    如何训练这个判别网络就需要数据支持：其中一些是目标风格的图像，这些作为正例，'
  - '[PAGE 77]


    打上标签“1”；另一些是由生成网络生成的“假”图像，打上标签“0”。在训练的过程中，这个判别网络不断提高自己区分“真的”目标风格的图像和生成出的“假”图像的能力。


    有了这个判别网络之后，再去训练生成网络。生成网络在训练的过程中，使生成的图像不断地向目标风格靠近，让判别网络“认为”生成的图像更像是真正的目标风格的图像。即生成网络尝试去“造假”，用生成的图像“欺骗”判别网络。


    而当生成网络“欺骗”的能力有一定的提高之后，原来的判别网络就不够用了，它很有可能被生成网络所“欺骗”。所以需要继续训练判别网络，使它能更好地“鉴别”真实的图像和“进化版”的生成网络产生的图像。如此循环往复，生成网络“欺骗”的能力越来越强，而判别网络“鉴别”的能力也越来越强。这两者协同进化，不断提高，最后得到令人满意的结果。这是一个对抗的过程，这种结构就被称为生成对抗网络（Generative
    Adversarial Network），简称GAN。


    ![](img/9b291315612c9c478ad54afa29381fce_77_0.png)


    # （二） 无监督学习


    生成对抗网络是一种无监督学习（Unsupervised Learning）。顾名思义，无监督学习指的就是学习的时候没有“监督”。在上一部分的图像识别中，提供的数据里不仅包含输入数据（可以视作“问题”），还包含“答案”（图像的类）。我们让AI尝试回答“问题”，再与“答案”对照，根据回答的情况调整参数。这种“对答案”的学习方式就叫监督学习。而在生成对抗网络中，数据并没有经过标注，也就是说并不知道“答案”。这种情况下的机器学习就叫做无监督学习。


    # （三） 要配对！CycleGAN


    这种单向的生成对抗网络效果并不好。这与输入的数据有关系。我们的输入数据是一些待转换的图像（输入到生成网络中）和一些目标风格的图像（输入到判别网络中），而这两个图像集合里的元素并没有一一对应的关系。如想要把自然风光的照片转化为带有莫奈风格的画，我们只能找到莫奈的画和自然风光照片两个图像的集合，而不可能找到与莫奈的画相对应的那张照片，即不能在这两者之间建立一一对应的关系。那么判别网络在对生成网络的输出进行评估的时候，并没有考虑到原图是怎么样的。假设一种极端的情况，输入一只猫的图像，生成网络生成一只“莫奈风格”的狗的图像，判别网络对这种现象并不能作出很好的区分。'
