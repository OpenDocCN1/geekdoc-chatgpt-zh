    \n标准化的作用\n\n直观地看，标准化前的数据在分布上远离零点，一眼看上去感到它们都差不多，不太容易找出它们的内在差别。\n\n这种方法应用在激活函数上也是类似的。以tanh激活函数为例，tanh激活函数有一个特点，它的导数在0附近相对来说比较大，在小于-1或者大于1的区域，导数会非常快地减小。如果这个激活函数的输入数据分布非常不均衡，如都非常大，那么实际上在这个区域，曲线实际上非常平坦，导数非常小，激活函数就无法起到激活的作用。\n\
    \n而在标准化之后，数据的平均值被调整到0，而且每个数据离零点也不会太远，有利于激活函数发挥其作用。\n\n另外一种情况是，当输入数据中不同部分的量纲不同，或者不便直接进行比较、加减等运算时，也可以通过标准化来解决这些问题。\n\
