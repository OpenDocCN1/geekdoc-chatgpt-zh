    # ## 三、策略


    策略（Policy）指的是智能体遵循的行为规范，智能体依照策略来选择动作。我们将策略记作π，其中π（a|s）表示智能体在状态s处选择动作a的概率分布。例如在状态s下，有两个可选动作，智能体选择1号动作a1的概率为π（a1|s）=0.3，选择2号动作a2的概率为π（a2|s）=0.7，这两个动作的概率一起构成了当前状态s下，智能体动作的概率分布π（a|s），所有状态策略π（a|s）的全体构成了马尔可夫决策过程的整体策略π。


    强化学习的学习目标是希望找到一个最优策略π*。该策略就像一张藏宝图，跟随它行动可以带来最大的长期奖励总和。同样的，智能红绿灯旨在学得一个红绿灯调控的最优策略，以达到加快城市道路行车速度，提高通行效率的目标。


    # ## 四、回报


    ![](img/9b291315612c9c478ad54afa29381fce_157_1.png)


    给定一种策略，智能体该如何评判其优劣呢？如右图所示，智能体通过强化学习，希望寻找到最大化奖励总和的行为方式。智能体必须有足够的远见和计划，将未来的潜在奖励纳入考虑范围。


    我们引入回报（Return）Gt来表示智能体从时刻t开始，未来累计收获的奖励之和，这是智能体所希望的最大化的目标。


    ```

    $$G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+1} + \cdots = \sum_{k=0}^{\infty}
    \gamma^k R_{t+k+1}$$

    ```


    把未来的潜在奖励纳入考虑'
  - '[PAGE 158]


    其中，Rt+1, Rt+2, Rt+3...是智能体从时间t开始，在交互中收获的一系列奖励。而γ∈[0, 1]被称为作折扣因子（Discount Factor）。我们知道，智能体当前的行为对即将发生的事情有强相关性，但随着时间的推移，这个行为对未来发展轨迹的贡献逐渐减弱，因而与未来奖励的关联也是逐级递减的，所以需要折扣因子来表达衰减。


    智能体在每个状态上根据给定策略做出动作，而有了当前的动作，下一个状态以及奖励也就确定了。这就意味着在给定策略的情况下，每个状态的好坏可以由它出发后得到的回报来描述。


    红绿灯调度的目标是让车辆从起始到结束的平均行驶时间最短。我们将智能红绿灯的奖励设计为，让每辆驶过路口的车辆带来+1的奖励，而每辆在路口等待的车辆导致－0.25的惩罚。这样智能体为了得到最大化的回报，便会在努力放行车流的同时，尽量减少在路口等待的车辆，从而达到高效通行的目的。


    # 五、价值函数


    回报是一个随机变量，因为马尔可夫决策过程中的状态转移和策略都是以概率分布的形式定义的，即使遵循一个固定的策略，从一个确定的状态或是一对状态和动作出发，智能体还是可能途经很多不同的状态，得到各异的回报。


    这里，我们引入状态值函数（State-Value Function）和动作值函数（Action-Value Function）的概念，通常把它们统称为价值函数。状态值函数V（s）是指从状态s出发得到回报的期望，而动作值函数Q（s，a）是指在状态s做出动作a之后智能体得到回报的期望，也可以直观地把它们理解为多次出发后获得回报的平均值。


    # 概念解析


    # 随机变量与期望


    随机变量是从样本空间Ω到实数R的函数，它表示了随机现象的各种结果。例如某一时间内公共汽车站等车乘客人数，电话交换台在一定时间内收到的呼叫次数，灯泡的寿命等。一个离散型随机变量的期望是试验中每次可能的结果乘以其发生概率的总和。如果我们把试验的一种结果发生的概率近似看作该试验结果发生的次数与总试验次数之比，那么期望值就近似地等于随机试验重复多次后，所有试验结果的平均值。'
  md: "\n当然，在这里简单地把贪心换成一个层数较低的Alpha-Beta搜索也是可以的，但是通常并不十分有效，更好的做法是使用迭代加深技术。作为前提，假设我们已经有了一个被称作“置换表”的数据结构，它能够保存已知局面的估值，建立起从局面到估值的映射。置换表支持两种操作：一是新增某局面及其估值或更新已有局面的估值，二是检索某个已估价过的局面的估值。这两种操作的时间复杂度都被控制在可以接受的范围内。\n\
    \n### 置换表\n\n置换表（Transposition Table, TT）事实上是一种十分简单的数据结构，通常是用哈希表来实现的。在搜索算法中，置换表通过哈希可以建立起局面和其相对应的某些信息的映射，并且能够利用哈希函数快速检索这些信息。\n\
    \n二人角斗士棋的棋盘总共有 14^2=196 格，再加上其规则的特殊性，我们只需要记录双方分别覆盖的位置。这样，只需要 196x2=392 个比特就可以完整地记录局面上所有的信息。对于这样的数据规模，哪怕是应用最朴素的哈希算法，也不会产生很大的时间与空间开销。而在更加一般的情况下，我们其实并不要求置换表的内容是完全精确的，所以即使采用有损的哈希也不会有太大的影响。\n\
    \n迭代加深所需要的仅仅是一个循环：枚举本次Alpha-Beta的最大深度，然后进行Alpha-Beta搜索。但如果只是单纯地这样做的话，和直接按照原本的最大深度搜索没有什么区别。真正起效果的做法是，利用浅层搜索的结果来决定深层搜索的顺序。根据之前的讨论，这种做法在多数情况下可以大大提升Alpha-Beta剪枝的效率；甚至在很多时候，使用迭代加深进行搜索，要比直接使用最大深度进行搜索要快得多。\n\
    \n具体的实现重点在于两步。第一，完成了一次对当前节点的搜索之后，更新置换表中相应的信息；第二，在开始搜索前，先按照置换表中的值来对合法走法进行排序。置换表在不同最大深度的搜索中是共用的，从而使得深层的搜索可以用到浅层搜索的结果。例如，在进行层数为4的搜索的时候，可以使用之前的三层搜索的结果进行排序，以此决定第一步搜索的顺序。通常情况下，这样得到的顺序要比一般的顺序更加合理。\n\
    \n### 思考与实践\n\n- 13.3 合理的搜索顺序为什么能大大提高搜索效率？请结合 Alpha-Beta 剪枝的原理进行思考。\n- 13.4 阅读\
    \ p138 的延伸阅读，想一想，为什么置换表的内容无须完全精确？\n\n## 四、蒙特卡罗树搜索\n\n在类似于极大极小搜索的算法中，我们所做的事情实际上可以概括为：深度优先地探索整棵由可能情况组成的树至某一预先设定的深度，再对搜索到的局面进行估值，最后按照极大极小准则选择下一步的走法。这是一个十分优秀而通用的方案，但是仍有很多不足的地方。首先，它从根本上不可避免地需要一个人为设定的估价函数；其次，哪怕是在使用Alpha-Beta剪枝之后，搜索整棵树的开销仍然可能是难以接受的，从而限制了整体可以搜索的深度。这两点实际上在一定程度上有所关联：之所以需要一个人为设定的估价函数，其根本原因是无法直接穷举搜索直至游戏结束的局面。既然如此，为什么不有选择地探索其中一部分子树以降低搜索开销呢？蒙特卡罗树搜索算法(Monte\
    \ Carlo Tree Search, MCTS)就采用了这种思路。\n\n由于蒙特卡罗树搜索所牵涉的数据结构较为复杂，为了不进一步增加理解难度，我们只对算法的思路进行了解。\n\
    \n### (一) 搜索树扩展\n\n对于蒙特卡罗树搜索，这里主要了解选择下一步探索子树的方法，即搜索树的扩展，最终决策的方式留至以后探索。在学习本书的过程中，你应当始终在脑海中保留着一个没有被完全扩展开的搜索树的图像。\n\
    \n- 蒙特卡罗树搜索的搜索树扩展，简单而由 4 个部分组成：\n  - 选择：从已经扩展出的节点中选择一个节点。\n  - 扩展：选择该节点的一个子节点加入到已有的搜索树中。\n\
    \  - 模拟：对于该子节点进行一次模拟。\n  - 反向传播：根据模拟的结果更新搜索树上各个节点的值。\n\n### 1. 模拟\n\n与搜索的实际顺序有所不同，先来了解模拟的概念，因为它在这4个部分中最为直观。如前所述，搜索树中的每一个结点实际上代表一个局面，我们当然可以从这个局面开始将游戏继续下去。像这样，从某一个结点继续对局直到游戏结束的过程叫做模拟。在最为朴素的蒙特卡罗树搜索版本中，模拟的方式十分简单：让双方都随机落子，直到整场游戏结束。无论是根据日常经验还是根据概率论中的大数定律，都可以直观地感受到：从某个局面出发，随着模拟次数的增加，按照这些模拟结果统计出的胜率会不断趋近于这个节点的真实胜率。只要进行足够多次的模拟，就可以得到该局面较为准确的胜率。\n\
    \n### 大数定律\n\n大数定律是概率论中的重要定律，它指出，对于一系列独立的、拥有相同数学期望的随机变量，当其数目足够多时，它们的均值会收敛到其相同的期望值。这个定律是实际生活中各种测量行为的理论基础。我们通常可以认为测量值是一个以真实值为期望的随机变量，且每次测量对应的随机变量是独立的，这样，大数定律保证了随着测量次数的增多，测量值的平均值会趋近于真实值。蒙特卡罗树搜索的模拟过程可以认为是对胜率的“测量”，因此也遵循大数定律。\n\
    \n### 2. 扩展\n\n和模拟一样，节点的扩展是一个十分直观的概念。最初，搜索树中只有根节点这一个节点，我们必须选择一种合法的走法——也就是根节点的一个子节点，把它加入到搜索树中。对于一般的情况也是如此。在“选择”步骤中，我们已经按某种方法选择了搜索树中已有的一个节点。扩展过程是将它的一个还不在搜索树中的子节点加入搜索树。\n\
    \n### 3. 选择\n\n选择是蒙特卡罗树搜索中最重要的一步，这个步骤使得蒙特卡罗树搜索和通常的极大极小算法有了根本性的区别。极大极小算法仅仅是单纯地按照深度优先的顺序选择节点，而蒙特卡罗树搜索则采用了不同的策略。当然，最后选择的节点必须是可以扩展的。\n\
    \n首先，要大致了解我们希望的搜索树在生长过程中的形状变化趋势。在极大极小以及Alpha-Beta搜索中，通常搜索树到最后会显得十分完整。虽然Alpha-Beta搜索可以剪掉很多不必要的分支，但是至少需要探索完一个子树，才有可能做出剪枝动作。此外，它的最大深度是固定的。然而，直觉上我们更加希望搜索树不是非常平衡、非常完整的。例如，对于几个可能比较好的走法，我们希望它们对应的子树可以更深一些，以便了解它下面的具体策略。反之，对于看上去不那么好的情况，则希望它稍微浅一点，但是也不能完全不去管它，因为暂时的劣势也有可能在之后带来更大的收益。\n\
    \n为了达成这样的目标，通常采用置信上界（Upper Confidence Bound, UCB）来选择之后需要扩展的结点。具体来说，我们选择最大化如下表达式的结点。\n\
    \n```\n\\frac{w_i}{n_i} + c \\sqrt{\\frac{\\log N_i}{n_i}}\n```\n\n其中w_i和n_i分别是在模拟过程中从该结点出发的获胜次数以及总次数，因此第一项即表示从该节点出发的胜率。N_i代表从它的双亲结点出发的总的模拟次数。第二项的含义是，我们会在一定程度上优先探索那些被探索次数较少的结点。c是一个调整这两项权重的参数，根据经验，c\
    \ = \\sqrt{2}是一个不错的选择。\n\n### 4. 反向传播\n\n反向传播是指在回溯过程中更新对应的w_i、n_i和N_i。需要注意，如果结点u是新扩展出的、刚刚开始进行模拟的节点，我们不仅需要更新u本身的信息，还需要更新从它到根结点的路径上所有结点的对应信息。\n\
    \n### （二） 决策\n\n在理解了搜索树全部的扩展过程后，确定当前这一步的走法也就变成一件自然而的事情了。一般情况下，我们会选择被探索次数最多的结点，因为按照蒙特卡罗树搜索的逻辑，探索某个结点的次数，总是和它的好坏程度直接相关。通常，越好的结点被探索的次数越多。\n\
    \n### 思考与实践\n\n- 13.5 蒙特卡罗树搜索算法运行时的搜索树会以什么样的形态生长？为什么会有这样的效果？\n- 13.6 请尝试一下自行实现蒙特卡罗树搜索的基本结构和扩展过程。\n\
    \n### 本部分小结\n\n在本部分中，我们学习了搜索算法的基本思路和表示棋类博弈游戏的基本模型——博弈树，详细了解贪心法、极大极小搜索及其优化方式，并认识了更加复杂的蒙特卡罗树搜索的过程。\n\
    \n## 第 5 部分 红绿灯调度\n\n交通运输是城市的血管，与人们的生活息息相关，高效合理的红绿灯调度对于城市健康发展至关重要。\n\n早在 1946\
    \ 年 11 月，杭州的解放路中山路口已经设置了红绿灯，那时候由路口执勤交警根据车流量变化手动调配红绿灯时长。到 2000 年，杭州引进了 SCATS 信号控制系统，但仍然需要人工在屏幕前监控路面状况，效率低，工作量大。2018\
    \ 年，杭州开展人工智能参与红绿灯调度的探索，被智能程序接管的红绿灯逐步覆盖整个杭州的高架道路，极大地改善了杭州高架交通状态：提升了 20% 的车辆行驶速度，增加了\
    \ 15% 的通行流量，同时减少了燃料消耗，省去了烦琐复杂的人工调控。以上塘一中河高架路段为例，下图展示了智能调控为交通和环境带来的切实而显著的变化。\n\n\
    在本部分中，我们也将参与智慧交通的建设，这与我们熟悉的图片分类、文本生成等任务不同，它不仅需要分析数据，还要进行连续决策，因此我们使用强化学习的方法来实现红绿灯调度。\n\
    \n我们将首先基于名为CityFlow的交通模拟器实现一个智能红绿灯，然后从强化学习的基础概念——马尔可夫决策过程出发，由浅入深地学会使用 Q-learning\
    \ 和 Deep Q-Network （DQN）算法求解强化学习问题，最终动手编程实现基于 DQN 算法的红绿灯调度，并把它的表现与传统方法进行对比，从而体会到人工智能为生活带来的改变。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_151_0.png)\n\n智能红绿灯在部分高架路段的优化成果展示\n\
    \n### 第十四章 红绿灯调度基础知识\n\n在本章中我们将认识红绿灯调度问题所处的虚拟交通环境，并了解强化学习的背景知识。\n\n### 一、规则简介\n\
    \n首先我们来了解智能红绿灯所处的环境以及可以作出的决策。\n\n红绿灯所处的环境是由名为CityFlow的交通模拟器提供的虚拟交通环境。CityFlow可以根据当前各个红绿灯的状态，推算出所有车辆在下一个时刻的位置，使得这些车辆的行为与真人司机的驾驶相似。模拟器中的每辆车次都有属于自己的出发时间，它们从各自的起始道路驶入，沿着固定的路线前往终点，并最终从路网边缘驶出。\n\
    \n在 CityFlow 中，红绿灯可以呈现9种状态，代表了红绿灯能指示的9种通行方式。下图给出其中两个红绿灯状态作为示例（车辆随时可以右转，故不特别在图中标出），左图表示“来自东西方向的车辆可直行”，右图表示“来自东西方向的车辆可左转”。另外，我们还可以选择其他各种各样的路网环境，可以是默认预设的网格状路网，也可以是模拟的真实城市街道。本项目中我们使用2x2的“井”字形交通环境，有4个可调控的红绿灯。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_152_0.png)\n\n此外，CityFlow能记录这道路上所有车辆的平均运行时间，它反映了车辆通行的效率，将被用作衡量红绿灯调度策略好坏的指标。\n\
    \n### 二、初识强化学习\n\n强化学习(Reinforcement Learning)考虑的是智能体与环境之间的交互问题。智能体是拥有行动能力的事物，常见的智能体有机器人、游戏AI、无人车等。以下图的无人车为例，在它前往目的地的过程中，车所在的车道、周围的其他车辆、路边的行人以及路口的红绿灯等组成了环境，无人车通过摄像头、传感器等设备来感知环境，然后通过决策如何操控方向、油门和刹车来实现安全行车这个任务。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_153_0.png)\n\n无人车的自动行驶\n\n强化学习是围绕智能体（Agent）在环境中的活动展开的。智能体是学习的主体，它在与环境的交互中学习，下图展示了智能体与环境的交互框架。智能体可以感知自己在环境中的\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_153_1.png)\n\n智能体与环境的交互框架\n\n状态（State），经过分析判断，对环境做出一个动作（Action）。由于该动作的影响，环境会变化到下一个状态。接着智能体又感知到环境的变化，如此循环往复、相互作用……每当智能体做出动作，使得环境状态发生变化时，它都会收到环境给予的奖励（Reward），这奖励反映了环境变化的好坏，是对智能体行为的反馈。在上述例子中，如果无人车偏离了车道，那么奖励就是负的，如果高效准确地行驶到目的地，奖励则是正的。\n\
    \n强化学习的任务是寻找一个能最大化长期奖励总和的行为方式。智能体根据奖励的指引，不断互动尝试，并评判各种情形下不同行为的好坏，总结优秀的动作，摈弃招致惩罚的行为，从而学习出一套能最大化长期奖励总和的行为方式。智能红绿灯就是基于这样的思路，从交通数据中学习出高效的交通调度方案。\n\
    \n### 第十五章 马尔可夫决策过程\n\n本章我们将认识马尔可夫决策过程各要素的基本概念，了解智能红绿灯状态和奖励的设计思路，并从马尔可夫决策过程（Markov\
    \ Decision Process，MDP）的角度思考红绿灯调度问题。\n\n马尔可夫决策过程是强化学习的基础，也可理解为是智能体所居住的世界。在这个世界里，时间被分割成一个一个时间点，智能体依时间顺序\
    \ t=1, 2, 3... 同环境交互。在每个时间点 t，它会感知到自己处于状态 $S_t$，然后选择并做出一个可行的动作 $A_t$，接着在下一个时间点\
    \ $t+1$ 得到奖励 $R_{t+1}$，并到达新的状态 $S_{t+1}$，由此构成智能体与环境交互的序列：$S_0, A_0, R_1, S_1,\
    \ A_1, R_2, S_2, A_2, R_3 \\cdots$\n\n接下来我们先去认识一些马尔可夫决策过程中涉及的重要概念。\n\n### 一、状态\n\
    \n在马尔可夫决策过程中，智能体的状态具有马尔可夫性，这是指智能体未来可能到达的状态 $S_{t+1}$ 只取决于当前状态 $S_t$，与过去的历史不相关。智能体的世界是基于“未来只取决于当前”的假设来运作的。\n\
    \n智能体的状态如同棒球手击出的棒球，基于每个时间点上棒球的位置和速度，用简单的物理知识可以推算出它即将到达的下一个状态乃至整个的飞行轨迹，棒球飞行的这种状态就是马尔可夫的。\n\
    \n以智能红绿灯这个智能体为例，它的状态是路口的交通状况。如下图所示，一个十字路\n\n![](img/9b291315612c9c478ad54afa29381fce_155_0.png)\n\
    \n智能红绿灯的状态\n\n口拥有上下左右4条驶入的道路，我们取“等待的车辆数”以及“正在运行的车辆数”作为每条道路的特征，并将所有道路的特征按类别堆叠成两个向量来表达整个十字路口的状态。另外，这个路口未来的红绿灯调度还与它当前的红绿灯状态相关，因此，智能红绿灯的状态是由汇入车道的特征和当前红绿灯状态共同组成的。\n\
    \n### 二、状态转移\n\n智能体做出的动作会影响它将到达的下一个状态，我们用状态转移来描述智能体的动作是如何影响环境的状态转移的。状态转移可以用概率来表示：\n\
    \np(s' | s, a) = Prob(S_{t+1} = s' | S_t = s, A_t = a)\n\n这是一个条件概率，它的意思很简单，是说智能体在状态\
    \ s 做出动作 a 后转移到状态 s' 的概率。\n\n以红绿灯调度任务为例，假设路口当前状态如下图所示，4 条道路都是红灯状态。\n\n![](img/9b291315612c9c478ad54afa29381fce_156_0.png)\n\
    \n路口初始状态\n\n若智能体接下来选择维持红灯，如下图，根据状态转移概率，新状态中拥堵的车辆将会增加。\n\n![](img/9b291315612c9c478ad54afa29381fce_156_1.png)\n\
    \n维持红灯对应的状态转移\n\n若智能体接下来选择左右绿灯放行，如下图，环境将转移到左右车辆通行的状态。\n\n![](img/9b291315612c9c478ad54afa29381fce_157_0.png)\n\
    \n绿灯放行对应的状态转移\n\n### 三、策略\n\n策略（Policy）指的是智能体遵循的行为规范，智能体依照策略来选择动作。我们将策略记作π，其中π（a|s）表示智能体在状态s处选择动作a的概率分布。例如在状态s下，有两个可选动作，智能体选择1号动作a1的概率为π（a1|s）=0.3，选择2号动作a2的概率为π（a2|s）=0.7，这两个动作的概率一起构成了当前状态s下，智能体动作的概率分布π（a|s），所有状态策略π（a|s）的全体构成了马尔可夫决策过程的整体策略π。\n\
    \n强化学习的学习目标是希望找到一个最优策略π*。该策略就像一张藏宝图，跟随它行动可以带来最大的长期奖励总和。同样的，智能红绿灯旨在学得一个红绿灯调控的最优策略，以达到加快城市道路行车速度，提高通行效率的目标。\n\
    \n### 四、回报\n\n![](img/9b291315612c9c478ad54afa29381fce_157_1.png)\n\n给定一种策略，智能体该如何评判其优劣呢？如右图所示，智能体通过强化学习，希望寻找到最大化奖励总和的行为方式。智能体必须有足够的远见和计划，将未来的潜在奖励纳入考虑范围。\n\
    \n我们引入回报（Return）Gt来表示智能体从时刻t开始，未来累计收获的奖励之和，这是智能体所希望的最大化的目标。\n\n$$G_t = R_{t+1}\
    \ + \\gamma R_{t+2} + \\gamma^2 R_{t+1} + \\cdots = \\sum_{k=0}^{\\infty} \\gamma^k\
    \ R_{t+k+1}$$\n\n把未来的潜在奖励纳入考虑\n\n其中，Rt+1, Rt+2, Rt+3...是智能体从时间t开始，在交互中收获的一系列奖励。而γ∈[0,\
    \ 1]被称为作折扣因子（Discount Factor）。我们知道，智能体当前的行为对即将发生的事情有强相关性，但随着时间的推移，这个行为对未来发展轨迹的贡献逐渐减弱，因而与未来奖励的关联也是逐级递减的，所以需要折扣因子来表达衰减。\n\
    \n智能体在每个状态上根据给定策略做出动作，而有了当前的动作，下一个状态以及奖励也就确定了。这就意味着在给定策略的情况下，每个状态的好坏可以由它出发后得到的回报来描述。\n\
    \n红绿灯调度的目标是让车辆从起始到结束的平均行驶时间最短。我们将智能红绿灯的奖励设计为，让每辆驶过路口的车辆带来+1的奖励，而每辆在路口等待的车辆导致-0.25的惩罚。这样智能体为了得到最大化的回报，便会在努力放行车流的同时，尽量减少在路口等待的车辆，从而达到高效通行的目的。\n\
    \n### 五、价值函数\n\n回报是一个随机变量，因为马尔可夫决策过程中的状态转移和策略都是以概率分布的形式定义的，即使遵循一个固定的策略，从一个确定的状态或是一对状态和动作出发，智能体还是可能途经很多不同的状态，得到各异的回报。\n\
    \n这里，我们引入状态值函数（State-Value Function）和动作值函数（Action-Value Function）的概念，通常把它们统称为价值函数。状态值函数V（s）是指从状态s出发得到回报的期望，而动作值函数Q（s，a）是指在状态s做出动作a之后智能体得到回报的期望，也可以直观地把它们理解为多次出发后获得回报的平均值。\n\
    \n### 概念解析\n\n### 随机变量与期望\n\n随机变量是从样本空间Ω到实数R的函数，它表示了随机现象的各种结果。例如某一时间内公共汽车站等车乘客人数，电话交换台在一定时间内收到的呼叫次数，灯泡的寿命等。一个离散型随机变量的期望是试验中每次可能的结果乘以其发生概率的总和。如果我们把试验的一种结果发生的概率近似看作该试验结果发生的次数与总试验次数之比，那么期望值就近似地等于随机试验重复多次后，所有试验结果的平均值。\n"
  mdcn: "\n当然，在这里简单地把贪心换成一个层数较低的Alpha-Beta搜索也是可以的，但是通常并不十分有效，更好的做法是使用迭代加深技术。作为前提，假设我们已经有了一个被称作“置换表”的数据结构，它能够保存已知局面的估值，建立起从局面到估值的映射。置换表支持两种操作：一是新增某局面及其估值或更新已有局面的估值，二是检索某个已估价过的局面的估值。这两种操作的时间复杂度都被控制在可以接受的范围内。\n\
    \n### 置换表\n\n置换表（Transposition Table, TT）事实上是一种十分简单的数据结构，通常是用哈希表来实现的。在搜索算法中，置换表通过哈希可以建立起局面和其相对应的某些信息的映射，并且能够利用哈希函数快速检索这些信息。\n\
    \n二人角斗士棋的棋盘总共有 14^2=196 格，再加上其规则的特殊性，我们只需要记录双方分别覆盖的位置。这样，只需要 196x2=392 个比特就可以完整地记录局面上所有的信息。对于这样的数据规模，哪怕是应用最朴素的哈希算法，也不会产生很大的时间与空间开销。而在更加一般的情况下，我们其实并不要求置换表的内容是完全精确的，所以即使采用有损的哈希也不会有太大的影响。\n\
    \n迭代加深所需要的仅仅是一个循环：枚举本次Alpha-Beta的最大深度，然后进行Alpha-Beta搜索。但如果只是单纯地这样做的话，和直接按照原本的最大深度搜索没有什么区别。真正起效果的做法是，利用浅层搜索的结果来决定深层搜索的顺序。根据之前的讨论，这种做法在多数情况下可以大大提升Alpha-Beta剪枝的效率；甚至在很多时候，使用迭代加深进行搜索，要比直接使用最大深度进行搜索要快得多。\n\
    \n具体的实现重点在于两步。第一，完成了一次对当前节点的搜索之后，更新置换表中相应的信息；第二，在开始搜索前，先按照置换表中的值来对合法走法进行排序。置换表在不同最大深度的搜索中是共用的，从而使得深层的搜索可以用到浅层搜索的结果。例如，在进行层数为4的搜索的时候，可以使用之前的三层搜索的结果进行排序，以此决定第一步搜索的顺序。通常情况下，这样得到的顺序要比一般的顺序更加合理。\n\
    \n### 思考与实践\n\n- 13.3 合理的搜索顺序为什么能大大提高搜索效率？请结合 Alpha-Beta 剪枝的原理进行思考。\n- 13.4 阅读\
    \ p138 的延伸阅读，想一想，为什么置换表的内容无须完全精确？\n\n## 四、蒙特卡罗树搜索\n\n在类似于极大极小搜索的算法中，我们所做的事情实际上可以概括为：深度优先地探索整棵由可能情况组成的树至某一预先设定的深度，再对搜索到的局面进行估值，最后按照极大极小准则选择下一步的走法。这是一个十分优秀而通用的方案，但是仍有很多不足的地方。首先，它从根本上不可避免地需要一个人为设定的估价函数；其次，哪怕是在使用Alpha-Beta剪枝之后，搜索整棵树的开销仍然可能是难以接受的，从而限制了整体可以搜索的深度。这两点实际上在一定程度上有所关联：之所以需要一个人为设定的估价函数，其根本原因是无法直接穷举搜索直至游戏结束的局面。既然如此，为什么不有选择地探索其中一部分子树以降低搜索开销呢？蒙特卡罗树搜索算法(Monte\
    \ Carlo Tree Search, MCTS)就采用了这种思路。\n\n由于蒙特卡罗树搜索所牵涉的数据结构较为复杂，为了不进一步增加理解难度，我们只对算法的思路进行了解。\n\
    \n### (一) 搜索树扩展\n\n对于蒙特卡罗树搜索，这里主要了解选择下一步探索子树的方法，即搜索树的扩展，最终决策的方式留至以后探索。在学习本书的过程中，你应当始终在脑海中保留着一个没有被完全扩展开的搜索树的图像。\n\
    \n- 蒙特卡罗树搜索的搜索树扩展，简单而由 4 个部分组成：\n  - 选择：从已经扩展出的节点中选择一个节点。\n  - 扩展：选择该节点的一个子节点加入到已有的搜索树中。\n\
    \  - 模拟：对于该子节点进行一次模拟。\n  - 反向传播：根据模拟的结果更新搜索树上各个节点的值。\n\n### 1. 模拟\n\n与搜索的实际顺序有所不同，先来了解模拟的概念，因为它在这4个部分中最为直观。如前所述，搜索树中的每一个结点实际上代表一个局面，我们当然可以从这个局面开始将游戏继续下去。像这样，从某一个结点继续对局直到游戏结束的过程叫做模拟。在最为朴素的蒙特卡罗树搜索版本中，模拟的方式十分简单：让双方都随机落子，直到整场游戏结束。无论是根据日常经验还是根据概率论中的大数定律，都可以直观地感受到：从某个局面出发，随着模拟次数的增加，按照这些模拟结果统计出的胜率会不断趋近于这个节点的真实胜率。只要进行足够多次的模拟，就可以得到该局面较为准确的胜率。\n\
    \n### 大数定律\n\n大数定律是概率论中的重要定律，它指出，对于一系列独立的、拥有相同数学期望的随机变量，当其数目足够多时，它们的均值会收敛到其相同的期望值。这个定律是实际生活中各种测量行为的理论基础。我们通常可以认为测量值是一个以真实值为期望的随机变量，且每次测量对应的随机变量是独立的，这样，大数定律保证了随着测量次数的增多，测量值的平均值会趋近于真实值。蒙特卡罗树搜索的模拟过程可以认为是对胜率的“测量”，因此也遵循大数定律。\n\
    \n### 2. 扩展\n\n和模拟一样，节点的扩展是一个十分直观的概念。最初，搜索树中只有根节点这一个节点，我们必须选择一种合法的走法——也就是根节点的一个子节点，把它加入到搜索树中。对于一般的情况也是如此。在“选择”步骤中，我们已经按某种方法选择了搜索树中已有的一个节点。扩展过程是将它的一个还不在搜索树中的子节点加入搜索树。\n\
    \n### 3. 选择\n\n选择是蒙特卡罗树搜索中最重要的一步，这个步骤使得蒙特卡罗树搜索和通常的极大极小算法有了根本性的区别。极大极小算法仅仅是单纯地按照深度优先的顺序选择节点，而蒙特卡罗树搜索则采用了不同的策略。当然，最后选择的节点必须是可以扩展的。\n\
    \n首先，要大致了解我们希望的搜索树在生长过程中的形状变化趋势。在极大极小以及Alpha-Beta搜索中，通常搜索树到最后会显得十分完整。虽然Alpha-Beta搜索可以剪掉很多不必要的分支，但是至少需要探索完一个子树，才有可能做出剪枝动作。此外，它的最大深度是固定的。然而，直觉上我们更加希望搜索树不是非常平衡、非常完整的。例如，对于几个可能比较好的走法，我们希望它们对应的子树可以更深一些，以便了解它下面的具体策略。反之，对于看上去不那么好的情况，则希望它稍微浅一点，但是也不能完全不去管它，因为暂时的劣势也有可能在之后带来更大的收益。\n\
    \n为了达成这样的目标，通常采用置信上界（Upper Confidence Bound, UCB）来选择之后需要扩展的结点。具体来说，我们选择最大化如下表达式的结点。\n\
    \n```\n\\frac{w_i}{n_i} + c \\sqrt{\\frac{\\log N_i}{n_i}}\n```\n\n其中w_i和n_i分别是在模拟过程中从该结点出发的获胜次数以及总次数，因此第一项即表示从该节点出发的胜率。N_i代表从它的双亲结点出发的总的模拟次数。第二项的含义是，我们会在一定程度上优先探索那些被探索次数较少的结点。c是一个调整这两项权重的参数，根据经验，c\
    \ = \\sqrt{2}是一个不错的选择。\n\n### 4. 反向传播\n\n反向传播是指在回溯过程中更新对应的w_i、n_i和N_i。需要注意，如果结点u是新扩展出的、刚刚开始进行模拟的节点，我们不仅需要更新u本身的信息，还需要更新从它到根结点的路径上所有结点的对应信息。\n\
    \n### （二） 决策\n\n在理解了搜索树全部的扩展过程后，确定当前这一步的走法也就变成一件自然而的事情了。一般情况下，我们会选择被探索次数最多的结点，因为按照蒙特卡罗树搜索的逻辑，探索某个结点的次数，总是和它的好坏程度直接相关。通常，越好的结点被探索的次数越多。\n\
    \n### 思考与实践\n\n- 13.5 蒙特卡罗树搜索算法运行时的搜索树会以什么样的形态生长？为什么会有这样的效果？\n- 13.6 请尝试一下自行实现蒙特卡罗树搜索的基本结构和扩展过程。\n\
    \n### 本部分小结\n\n在本部分中，我们学习了搜索算法的基本思路和表示棋类博弈游戏的基本模型——博弈树，详细了解贪心法、极大极小搜索及其优化方式，并认识了更加复杂的蒙特卡罗树搜索的过程。\n\
    \n## 第 5 部分 红绿灯调度\n\n交通运输是城市的血管，与人们的生活息息相关，高效合理的红绿灯调度对于城市健康发展至关重要。\n\n早在 1946\
    \ 年 11 月，杭州的解放路中山路口已经设置了红绿灯，那时候由路口执勤交警根据车流量变化手动调配红绿灯时长。到 2000 年，杭州引进了 SCATS 信号控制系统，但仍然需要人工在屏幕前监控路面状况，效率低，工作量大。2018\
    \ 年，杭州开展人工智能参与红绿灯调度的探索，被智能程序接管的红绿灯逐步覆盖整个杭州的高架道路，极大地改善了杭州高架交通状态：提升了 20% 的车辆行驶速度，增加了\
    \ 15% 的通行流量，同时减少了燃料消耗，省去了烦琐复杂的人工调控。以上塘一中河高架路段为例，下图展示了智能调控为交通和环境带来的切实而显著的变化。\n\n\
    在本部分中，我们也将参与智慧交通的建设，这与我们熟悉的图片分类、文本生成等任务不同，它不仅需要分析数据，还要进行连续决策，因此我们使用强化学习的方法来实现红绿灯调度。\n\
    \n我们将首先基于名为CityFlow的交通模拟器实现一个智能红绿灯，然后从强化学习的基础概念——马尔可夫决策过程出发，由浅入深地学会使用 Q-learning\
    \ 和 Deep Q-Network （DQN）算法求解强化学习问题，最终动手编程实现基于 DQN 算法的红绿灯调度，并把它的表现与传统方法进行对比，从而体会到人工智能为生活带来的改变。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_151_0.png)\n\n智能红绿灯在部分高架路段的优化成果展示\n\
    \n### 第十四章 红绿灯调度基础知识\n\n在本章中我们将认识红绿灯调度问题所处的虚拟交通环境，并了解强化学习的背景知识。\n\n### 一、规则简介\n\
    \n首先我们来了解智能红绿灯所处的环境以及可以作出的决策。\n\n红绿灯所处的环境是由名为CityFlow的交通模拟器提供的虚拟交通环境。CityFlow可以根据当前各个红绿灯的状态，推算出所有车辆在下一个时刻的位置，使得这些车辆的行为与真人司机的驾驶相似。模拟器中的每辆车次都有属于自己的出发时间，它们从各自的起始道路驶入，沿着固定的路线前往终点，并最终从路网边缘驶出。\n\
    \n在 CityFlow 中，红绿灯可以呈现9种状态，代表了红绿灯能指示的9种通行方式。下图给出其中两个红绿灯状态作为示例（车辆随时可以右转，故不特别在图中标出），左图表示“来自东西方向的车辆可直行”，右图表示“来自东西方向的车辆可左转”。另外，我们还可以选择其他各种各样的路网环境，可以是默认预设的网格状路网，也可以是模拟的真实城市街道。本项目中我们使用2x2的“井”字形交通环境，有4个可调控的红绿灯。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_152_0.png)\n\n此外，CityFlow能记录这道路上所有车辆的平均运行时间，它反映了车辆通行的效率，将被用作衡量红绿灯调度策略好坏的指标。\n\
    \n### 二、初识强化学习\n\n强化学习(Reinforcement Learning)考虑的是智能体与环境之间的交互问题。智能体是拥有行动能力的事物，常见的智能体有机器人、游戏AI、无人车等。以下图的无人车为例，在它前往目的地的过程中，车所在的车道、周围的其他车辆、路边的行人以及路口的红绿灯等组成了环境，无人车通过摄像头、传感器等设备来感知环境，然后通过决策如何操控方向、油门和刹车来实现安全行车这个任务。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_153_0.png)\n\n无人车的自动行驶\n\n强化学习是围绕智能体（Agent）在环境中的活动展开的。智能体是学习的主体，它在与环境的交互中学习，下图展示了智能体与环境的交互框架。智能体可以感知自己在环境中的\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_153_1.png)\n\n智能体与环境的交互框架\n\n状态（State），经过分析判断，对环境做出一个动作（Action）。由于该动作的影响，环境会变化到下一个状态。接着智能体又感知到环境的变化，如此循环往复、相互作用……每当智能体做出动作，使得环境状态发生变化时，它都会收到环境给予的奖励（Reward），这奖励反映了环境变化的好坏，是对智能体行为的反馈。在上述例子中，如果无人车偏离了车道，那么奖励就是负的，如果高效准确地行驶到目的地，奖励则是正的。\n\
    \n强化学习的任务是寻找一个能最大化长期奖励总和的行为方式。智能体根据奖励的指引，不断互动尝试，并评判各种情形下不同行为的好坏，总结优秀的动作，摈弃招致惩罚的行为，从而学习出一套能最大化长期奖励总和的行为方式。智能红绿灯就是基于这样的思路，从交通数据中学习出高效的交通调度方案。\n\
    \n### 第十五章 马尔可夫决策过程\n\n本章我们将认识马尔可夫决策过程各要素的基本概念，了解智能红绿灯状态和奖励的设计思路，并从马尔可夫决策过程（Markov\
    \ Decision Process，MDP）的角度思考红绿灯调度问题。\n\n马尔可夫决策过程是强化学习的基础，也可理解为是智能体所居住的世界。在这个世界里，时间被分割成一个一个时间点，智能体依时间顺序\
    \ t=1, 2, 3... 同环境交互。在每个时间点 t，它会感知到自己处于状态 $S_t$，然后选择并做出一个可行的动作 $A_t$，接着在下一个时间点\
    \ $t+1$ 得到奖励 $R_{t+1}$，并到达新的状态 $S_{t+1}$，由此构成智能体与环境交互的序列：$S_0, A_0, R_1, S_1,\
    \ A_1, R_2, S_2, A_2, R_3 \\cdots$\n\n接下来我们先去认识一些马尔可夫决策过程中涉及的重要概念。\n\n### 一、状态\n\
    \n在马尔可夫决策过程中，智能体的状态具有马尔可夫性，这是指智能体未来可能到达的状态 $S_{t+1}$ 只取决于当前状态 $S_t$，与过去的历史不相关。智能体的世界是基于“未来只取决于当前”的假设来运作的。\n\
    \n智能体的状态如同棒球手击出的棒球，基于每个时间点上棒球的位置和速度，用简单的物理知识可以推算出它即将到达的下一个状态乃至整个的飞行轨迹，棒球飞行的这种状态就是马尔可夫的。\n\
    \n以智能红绿灯这个智能体为例，它的状态是路口的交通状况。如下图所示，一个十字路\n\n![](img/9b291315612c9c478ad54afa29381fce_155_0.png)\n\
    \n智能红绿灯的状态\n\n口拥有上下左右4条驶入的道路，我们取“等待的车辆数”以及“正在运行的车辆数”作为每条道路的特征，并将所有道路的特征按类别堆叠成两个向量来表达整个十字路口的状态。另外，这个路口未来的红绿灯调度还与它当前的红绿灯状态相关，因此，智能红绿灯的状态是由汇入车道的特征和当前红绿灯状态共同组成的。\n\
    \n### 二、状态转移\n\n智能体做出的动作会影响它将到达的下一个状态，我们用状态转移来描述智能体的动作是如何影响环境的状态转移的。状态转移可以用概率来表示：\n\
    \np(s' | s, a) = Prob(S_{t+1} = s' | S_t = s, A_t = a)\n\n这是一个条件概率，它的意思很简单，是说智能体在状态\
    \ s 做出动作 a 后转移到状态 s' 的概率。\n\n以红绿灯调度任务为例，假设路口当前状态如下图所示，4 条道路都是红灯状态。\n\n![](img/9b291315612c9c478ad54afa29381fce_156_0.png)\n\
    \n路口初始状态\n\n若智能体接下来选择维持红灯，如下图，根据状态转移概率，新状态中拥堵的车辆将会增加。\n\n![](img/9b291315612c9c478ad54afa29381fce_156_1.png)\n\
    \n维持红灯对应的状态转移\n\n若智能体接下来选择左右绿灯放行，如下图，环境将转移到左右车辆通行的状态。\n\n![](img/9b291315612c9c478ad54afa29381fce_157_0.png)\n\
    \n绿灯放行对应的状态转移\n\n### 三、策略\n\n策略（Policy）指的是智能体遵循的行为规范，智能体依照策略来选择动作。我们将策略记作π，其中π（a|s）表示智能体在状态s处选择动作a的概率分布。例如在状态s下，有两个可选动作，智能体选择1号动作a1的概率为π（a1|s）=0.3，选择2号动作a2的概率为π（a2|s）=0.7，这两个动作的概率一起构成了当前状态s下，智能体动作的概率分布π（a|s），所有状态策略π（a|s）的全体构成了马尔可夫决策过程的整体策略π。\n\
    \n强化学习的学习目标是希望找到一个最优策略π*。该策略就像一张藏宝图，跟随它行动可以带来最大的长期奖励总和。同样的，智能红绿灯旨在学得一个红绿灯调控的最优策略，以达到加快城市道路行车速度，提高通行效率的目标。\n\
    \n### 四、回报\n\n![](img/9b291315612c9c478ad54afa29381fce_157_1.png)\n\n给定一种策略，智能体该如何评判其优劣呢？如右图所示，智能体通过强化学习，希望寻找到最大化奖励总和的行为方式。智能体必须有足够的远见和计划，将未来的潜在奖励纳入考虑范围。\n\
    \n我们引入回报（Return）Gt来表示智能体从时刻t开始，未来累计收获的奖励之和，这是智能体所希望的最大化的目标。\n\n$$G_t = R_{t+1}\
    \ + \\gamma R_{t+2} + \\gamma^2 R_{t+1} + \\cdots = \\sum_{k=0}^{\\infty} \\gamma^k\
    \ R_{t+k+1}$$\n\n把未来的潜在奖励纳入考虑\n\n其中，Rt+1, Rt+2, Rt+3...是智能体从时间t开始，在交互中收获的一系列奖励。而γ∈[0,\
    \ 1]被称为作折扣因子（Discount Factor）。我们知道，智能体当前的行为对即将发生的事情有强相关性，但随着时间的推移，这个行为对未来发展轨迹的贡献逐渐减弱，因而与未来奖励的关联也是逐级递减的，所以需要折扣因子来表达衰减。\n\
    \n智能体在每个状态上根据给定策略做出动作，而有了当前的动作，下一个状态以及奖励也就确定了。这就意味着在给定策略的情况下，每个状态的好坏可以由它出发后得到的回报来描述。\n\
    \n红绿灯调度的目标是让车辆从起始到结束的平均行驶时间最短。我们将智能红绿灯的奖励设计为，让每辆驶过路口的车辆带来+1的奖励，而每辆在路口等待的车辆导致-0.25的惩罚。这样智能体为了得到最大化的回报，便会在努力放行车流的同时，尽量减少在路口等待的车辆，从而达到高效通行的目的。\n\
    \n### 五、价值函数\n\n回报是一个随机变量，因为马尔可夫决策过程中的状态转移和策略都是以概率分布的形式定义的，即使遵循一个固定的策略，从一个确定的状态或是一对状态和动作出发，智能体还是可能途经很多不同的状态，得到各异的回报。\n\
    \n这里，我们引入状态值函数（State-Value Function）和动作值函数（Action-Value Function）的概念，通常把它们统称为价值函数。状态值函数V（s）是指从状态s出发得到回报的期望，而动作值函数Q（s，a）是指在状态s做出动作a之后智能体得到回报的期望，也可以直观地把它们理解为多次出发后获得回报的平均值。\n\
    \n### 概念解析\n\n### 随机变量与期望\n\n随机变量是从样本空间Ω到实数R的函数，它表示了随机现象的各种结果。例如某一时间内公共汽车站等车乘客人数，电话交换台在一定时间内收到的呼叫次数，灯泡的寿命等。一个离散型随机变量的期望是试验中每次可能的结果乘以其发生概率的总和。如果我们把试验的一种结果发生的概率近似看作该试验结果发生的次数与总试验次数之比，那么期望值就近似地等于随机试验重复多次后，所有试验结果的平均值。\n"
