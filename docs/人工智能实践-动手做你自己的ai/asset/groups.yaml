    ## 第 1 部分 图像识别


    人们每时每刻都在无意识地进行图像识别：识别物体，拿起它们；识别障碍物，避开它们；识别文字，进行阅读理解；识别人脸，进行身份判断。对于人类来说，图像识别是一个自然又简单的过程，从眼睛接受光信号到大脑识别出图像，几乎不需要思考。而对于计算机来说，图像识别就没那么容易了。从计算机被发明以来，科学家们一直期望让计算机能自动识别出图像内容，但是由于算法和硬件方面的限制，计算机的图像识别能力一直远低于人类的水平。直到近几年，随着深度学习的发展，图像识别的效率和准确率得到了大幅度的提升。在近几年人工智能浪潮中，图像识别是发展最快、技术最成熟、落地最早的算法。车牌识别、人脸识别等诸多基于图像识别的技术正在改变着人们的生活。在本部分中，我们将一起了解机器处理图像数据的原理，编写图像识别的两个经典算法：
    K 近邻算法与卷积神经网络，并解决手写数字识别以及物体识别问题。


    ![](img/9b291315612c9c478ad54afa29381fce_13_0.png)


    ### 第一章 图像识别的基础知识


    在本章中，我们将了解什么是图像识别、图像在计算机中的表达、图像识别的流程以及图像识别中类别的表达方式。此外，我们将编写代码探索图像识别领域中的一些经典数据集。


    ### 一、图像识别简介


    图像识别，顾名思义就是识别图像的内容。严谨地讲，就是给计算机一张图像，让其判断出图像中的内容。例如给一张手写数字的图像，判断出它是数字几；或是给一张动物的图像，判断是猫还是狗；或是给一张班级里同学的照片，判断出他/她的名字。


    ![](img/9b291315612c9c478ad54afa29381fce_14_0.png)


    ### 二、计算机如何表示图像


    为了让计算机识别图像，我们首先得让计算机“看”到图像。所以在学习图像识别的算法之前，我们要先了解计算机“眼”中的图像是怎样的。


    对于用计算机处理图像，你可能并不陌生。使用Windows操作系统自带的画图软件，可以进行一些简单的图像处理工作。此外还有Lightroom、Photoshop之类功能更为强大的图像处理软件，可见计算机处理图像的能力非常强大。你可能听说过，计算机世界里的通用语言是二进制，在计算机的“眼”中，一切都是数字。那么，我们怎样把一张图像转化为机器能处理的数字形式呢？


    计算机中的图像主要有两种——位图和矢量图（矢量图在本书中不做介绍）。其中位图是使用像素矩阵来表示图像的一种方法。我们可以把图像分割成一个个小方块，每一个小方块

