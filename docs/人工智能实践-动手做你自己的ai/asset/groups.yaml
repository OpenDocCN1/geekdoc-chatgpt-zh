    \ = dataset_path + \"trainA/*.jpg\"\ntrainB_path = dataset_path + \"trainB/*.jpg\"\
    \n```\n\n```python\ntrain_A = DataSet(trainA_path, image_size = IMG_SIZE)\ntrain_B\
    \ = DataSet(trainB_path, image_size = IMG_SIZE)\n```\n\n```python\ndef train_batch(batchsize):\n\
