  md: "\n过于表象。我们希望能从图像的灰度值中挖掘出更多的信息，如图像中各个物体的轮廓、边缘信息。下面我们一起了解一种能检测出物体边缘的简单方法。\n\n\
    ![](img/9b291315612c9c478ad54afa29381fce_38_0.png)\n\n图像中和周围其他像素相比差异较大的像素更有可能是边缘。因此，检测物体边缘的问题可以转化为衡量像素之间灰度的问题。要衡量两个像素之间灰度的差别，只需要将两个灰度相减。要衡量一个像素与周围几个像素的差距，一个很朴素的方法就是把它与上下左右四个像素之间的灰度值的差加起来。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_38_1.png)\n\n而在实际处理灰度图像的操作过程中，我们会将图像中每一个像素的灰度值与一个矩阵上对应位置的数值相乘，再对积进行求和，和的值越大，代表越有可能是边缘。这样对于每一个像素都会计算出一个新的数值，从而得到一张新图像，如下图所示。处理后的图像边缘点都被高亮显示，非边缘点变黑。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_38_2.png)\n\n获取一张新图像的过程就是挖掘图像特征的过程。这个过程涉及的运算过程被称为卷积，它是一种提取图像特征的方式，其中用到的矩阵又被称为卷积核。利用卷积核对输入图像进行卷积操作后，就会输出一张特征图。\n\
    \n卷积核的大小不一，有3×3、5×5、7×7甚至更大的。卷积运算的时候不一定要以每个像素为中心都计算一次，可以每次跳过一定数量的像素再进行计算，这个间隔被称为步长。卷积核中的值不是人工指定的，而是由神经网络学习得到的。\n\
    \n### （二）池化层\n\n了解了卷积核后，我们用一句话就可以介绍卷积层了。所谓卷积层其实就是使用一个或多个卷积核对输入进行卷积操作。\n\n![](img/9b291315612c9c478ad54afa29381fce_39_0.png)\n\
    \n池化层的目的是减小输入图像的大小，去除次要特征，保留主要特征。直观上理解，如果一张图像的分辨率变小，我们还是能够看出图像是什么，因为我们还是能够找到图像内容的主要特征，池化层正是基于这样的思想。池化层本身没有可学习的参数。池化层有两种，最大池化和平均池化。确定一个池化层，首先要确定池化的种类，其次是池化的区域大小和步长，这和卷积核大小和步长同理。对于最大池化，它输出的是选择区域内最大的数值；对于平均池化，它输出的是选择区域内数值的平均值，如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_39_1.png)\n\n### （三）平铺层\n\n平铺层是一个非常简单的神经网络层，它的作用是将一个二阶张量（矩阵）或三阶张量展开成一个一阶张量（向量）。如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_40_0.png)\n\n平铺层作用图解\n\n### （四）卷积神经网络\n\
    \n人类视觉系统的信息处理是分级的。首先，视网膜接受视觉信号，大脑中低级的V1区进行边缘特征提取，V2区进行基本形状提取，更高层的前额叶皮层进行分类判断……高层特征由低层特征组合得到，从低层到高层，特征表达越来越抽象化和概念化。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_40_1.png)\n\n大脑视觉皮层\n\n卷积神经网络对图像的处理过程与人类视觉系统信息处理的方式很相似。卷积神经网络的第一个卷积层的卷积核用来检测低阶特征，如边、角、曲线等。第二个卷积层的输入是第一层的输出，这一层的卷积核用来检测低阶特征的组合，如半圆、四边形等。随着层数的增加，对应卷积核检测的特征就更加复杂、抽象，到卷积层达到一定深度时，卷积神经网络模型就可以识别出图像中的物体。下页图是一个经典的卷积神经网络LeNet的架构图，从中看出输入图像经过了2次卷积层和池化层，然后再经过三个全连接层进行输出，输出数据代表的是属于每个种类的概率。\n\
    \n训练开始时，卷积核中的值都是随机的，它们不能检测到任何特征。就像刚出生的孩子，对任何物体都没有概念，需要学习才能逐步建立概念，卷积神经网络也需要类似的学习过程。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_41_0.png)\n\n通过训练，不断调整卷积核中的值，使得卷积神经网络能够识别出一些特定的图像特征。下图是对卷积神经网络的可视化，右侧显示了卷积神经网络中每一层的样子，第二行代表的是第一个卷积层，它包含了若干卷积核。可以看出有些卷积核检测朝上的边，有些卷积核检测弯曲的边，有些卷积核检测交点。还有很多卷积核我们无法描述它具体检测的特征。经过学习后，每个卷积核具体检测的特征是没有清晰定义的，并不一定是人类所理解的边、角，但一定是卷积神经网络认为能够帮助它进行图像识别的特征。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_41_1.png)\n\n## 三、使用 Keras 搭建一个简单的卷积神经网络\n\
    \n了解了卷积神经网络的原理后，我们开始尝试动手搭建一个简单的卷积神经网络。Keras库提供了非常方便的搭建卷积神经网络的方法，整个过程就像是搭积木一样，将想要的网络层一层一层搭建起来。\n\
    \n- 首先导入一些必要的库，我们主要会用到Keras库。\n  - mnist：Keras库中包含的一个方便下载MNIST数据集的类。\n  - Sequential：Keras线性模型框架，可以理解为积木的模板。\n\
    \  - 神经网络中的一些常用层。\n    - Dense：全连接层。\n    - Flatten：平铺层。\n    - Conv2D：二维卷积层。\n\
    \    - MaxPooling2D：二维池化层。\n\n```\n# 如果没有安装 keras 和 tensorflow 库\n# 请使用 pip install\
    \ keras tensorflow 安装\nimport keras\nfrom keras.datasets import mnist\nfrom keras.models\
    \ import Sequential\nfrom keras.layers import Dense, Dropout, Flatten\nfrom keras.layers\
    \ import Conv2D, MaxPooling2D\n```\n\n首先导入MNIST数据集。为了训练卷积神经网络，我们还需要对数据做一些预处理和变换。在Keras库中，图像数据需要以三阶张量的形式输入，而由于MNIST数据集是灰度图，图像是以矩阵形式表达的，因此需要对其进行形状变换。使用reshape函数将输入的每张图像从28×28的矩阵变为28×28×1的张量。需要注意的是，原本图像中每个像素的取值是一个0～255的整数，但是图片输入神经网络时，我们一般将其转化为0～1或者-1～1范围的数，因此将输入数据统一除以255。另外对于输出数据，我们不再简单地用一个数字来表示，而是采用独热编码作为输出。Keras提供了一个函数to_categorical来完成这种输出。\n\
    \n```\n(x_train, y_train), (x_test, y_test) = mnist.load_data()\nwidth, height\
    \ = x_train.shape[1], x_train.shape[2] # 获取图像的宽、高\nn_train = x_train.shape[0]\
    \ # 获取训练数据数量\nn_test = x_test.shape[0] # 获取测试数据数量\nx_train = x_train.reshape(n_train,\
    \ width, height, 1) # 将输入转为三阶张量\nx_test = x_test.reshape(n_test, width, height,\
    \ 1) # 将输入转为三阶张量\nprint(\"reshape后的输入形状\")\nprint(x_train.shape)\nprint(x_test.shape)\n\
    y_train = keras.utils.to_categorical(y_train) # 将输出转为独热编码\ny_test = keras.utils.to_categorical(y_test)\
    \ # 将输出转为独热编码\nprint(\"独热化后的输出形状\")\nprint(y_train.shape)\nprint(y_test.shape)\n\
    print(\"处理前的最大值为%f\" % x_train.max())\nx_train = x_train / 255 # 将输入转化到0~1范围的数\n\
    x_test = x_test / 255 # 将输入转化到0~1范围的数\nprint(\"处理后的最大值为%f\" % x_train.max())\n\
    ```\n\n输出结果:\nreshape后的输入形状\n(60000, 28, 28, 1)\n(10000, 28, 28, 1)\n独热化后的输出形状\n\
    (60000, 10)\n(10000, 10)\n处理前的最大值为255.000000\n处理后的最大值为1.000000\n\n处理完数据后，开始搭建模型。我们使用Keras中的线性（Sequential）模型搭建一个基础的卷积神经网络，该网络的架构如下。\n\
    \n- 二维卷积层：32个5×5的卷积核，使用ReLU作为激活函数。\n- 最大池化层：2×2大小的池化核。\n- 二维卷积层：32个3×3的卷积核，使用ReLU作为激活函数。\n\
    - 最大池化层：2×2大小的池化核。\n- 平铺层：将数据形状转为向量。\n- 全连接层：隐藏层维度为256，使用ReLU作为激活函数。\n- 全连接层：隐藏层维度为10，使用Softmax作为激活函数，输出每个分类的概率。\n\
    \n### 概念解析\n\n#### Softmax\n\nSoftmax又称归一化指数函数。所谓归一化就是将原先的输入进行变换，使输出的每个数都在0到1之间，并且使他们的和为1。如果输入的是一个7维向量\
    \ [1, 2, 3, 4, 1, 2, 3]，经过Softmax后就得到向量 [0.024, 0.064, 0.175, 0.475, 0.024, 0.064,\
    \ 0.175]。这个向量可以被看作概率，每一维上的值代表的就是原向量这一维的值属于这一类的概率。因此在分类问题中，最后一层往往会使用一个维度与类别数量相同、激活函数为Softmax的层作为全连接层。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_43_0.png)\n\n在Keras的Sequential模块中，我们可以使用add函数一层层地添加神经网络层。\n\
    \n```\nmodel = Sequential()\nmodel.add(Conv2D(32, (5, 5), activation=\"relu\"\
    , input_shape=(width, height, 1)))\nmodel.add(MaxPooling2D(pool_size=(2, 2)))\n\
    model.add(Conv2D(32, (3, 3), activation=\"relu\"))\nmodel.add(MaxPooling2D(pool_size=(2,\
    \ 2)))\nmodel.add(Flatten())\nmodel.add(Dense(256, activation=\"relu\"))\nmodel.add(Dense(10,\
    \ activation=\"softmax\"))\n```\n\nKeras提供的summary函数，可以用于查看模型中每一层的结构及参数个数。\n\n\
    ```\nmodel.summary()\n```\n\n输出结果:\n\n| Layer (type) | Output Shape | Param #\
    \ |\n|---|---|---|\n| conv2d_1 (Conv2D) | (None, 24, 24, 32) | 832 |\n| max_pooling2d_1\
    \ (MaxPooling2D) | (None, 12, 12, 32) | 0 |\n| conv2d_2 (Conv2D) | (None, 10,\
