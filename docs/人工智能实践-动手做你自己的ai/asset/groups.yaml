    (60000, 10)\n(10000, 10)\n处理前的最大值为255.000000\n处理后的最大值为1.000000\n\n处理完数据后，开始搭建模型。我们使用Keras中的线性（Sequential）模型搭建一个基础的卷积神经网络，该网络的架构如下。\n\
