    蒙特卡罗树搜索版本中，模拟的方式十分简单：让双方都随机落子，直到整场游戏结束。无论是根据日常经验还是根据概率论中的大数定律，都可以直观地感受到：从某个局面出发，随着模拟次数的增加，按照这些模拟结果统计出的胜率会不断趋近于这个节点的真实胜率。只要进行足够多次的模拟，就可以得到该局面较为准确的胜率。


    ### 大数定律


    大数定律是概率论中的重要定律，它指出，对于一系列独立的、拥有相同数学期望的随机变量，当其数目足够多时，它们的均值会收敛到其相同的期望值。这个定律是实际生活中各种测量行为的理论基础。我们通常可以认为测量值是一个以真实值为期望的随机变量，且每次测量对应的随机变量是独立的，这样，大数定律保证了随着测量次数的增多，测量值的平均值会趋近于真实值。蒙特卡罗树搜索的模拟过程可以认为是对胜率的“测量”，因此也遵循大数定律。


    # ## 2. 扩展


    和模拟一样，节点的扩展是一个十分直观的概念。最初，搜索树中只有根节点这一个节点，我们必须选择一种合法的走法——也就是根节点的一个子节点，把它加入到搜索树中。对于一般的情况也是如此。在“选择”步骤中，我们已经按某种方法选择了搜索树中已有的一个节点。扩展过程是将它的一个还不在搜索树中的子节点加入搜索树。


    # ## 3. 选择


    选择是蒙特卡罗树搜索中最重要的一步，这个步骤使得蒙特卡罗树搜索和通常的极大极小算法有了根本性的区别。极大极小算法仅仅是单纯地按照深度优先的顺序选择节点，而蒙特卡罗树搜索则采用了不同的策略。当然，最后选择的节点必须是可以扩展的。


    首先，要大致了解我们希望的搜索树在生长过程中的形状变化趋势。在极大极小以及Alpha-Beta搜索中，通常搜索树到最后会显得十分完整。虽然Alpha-Beta搜索可以剪掉很多不必要的分支，但是至少需要探索完一个子树，才有可能做出剪枝动作。此外，它的最大深度是固定的。然而，直觉上我们更加希望搜索树不是非常平衡、非常完整的。例如，对于几个可能比较好的走法，我们希望它们对应的子树可以更深一些，以便了解它下面的具体策略。反之，对于看上去不那么好的情况，则希望它稍微浅一点，但是也不能完全不去管它，因为暂时的劣势也有可能在之后带来更大的收益。'
  - "[PAGE 149]\n\n为了达成这样的目标，通常采用置信上界（Upper Confidence Bound, UCB）来选择之后需要扩展的结点。具体来说，我们选择最大化如下表达式的结点。\n\
    \n```\n\\frac{w_i}{n_i} + c \\sqrt{\\frac{\\log N_i}{n_i}}\n```\n\n其中w_i和n_i分别是在模拟过程中从该结点出发的获胜次数以及总次数，因此第一项即表示从该节点出发的胜率。N_i代表从它的双亲结点出发的总的模拟次数。第二项的含义是，我们会在一定程度上优先探索那些被探索次数较少的结点。c是一个调整这两项权重的参数，根据经验，c\
    \ = \\sqrt{2}是一个不错的选择。\n\n# 4. 反向传播\n\n反向传播是指在回溯过程中更新对应的w_i、n_i和N_i。需要注意，如果结点u是新扩展出的、刚刚开始进行模拟的节点，我们不仅需要更新u本身的信息，还需要更新从它到根结点的路径上所有结点的对应信息。\n\
