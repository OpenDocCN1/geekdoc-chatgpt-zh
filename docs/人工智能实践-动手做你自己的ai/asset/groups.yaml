    ```\n输出结果:\n10000/10000 [==============================] - 3s 269us/step\n损失为0.032268\n\
    准确度为0.990900\n```\n\n输出结果显示，我们搭建的卷积神经网络在测试数据上取得了99.09%的准确率！\n\n## 四、图像数据增强\n\n\
    有一种观点认为神经网络是靠数据“喂”出来的，如果能够提供海量训练数据，那么，就能够有效提升算法的准确率。而当训练数据有限，又想提升算法准确率时，可以通过对已有训练数据集进行变换生成新的数据的方法，快速扩充训练数据。这种方法被称为“数据增强”。\n\
    \n对图像数据进行变换的方式有很多，最常用的有旋转、平移、水平和竖直翻转。\n\nKeras提供了ImageDataGenerator模块用于进行图像数据增强。我们使用CIFAR-10数据集举例，对原数据进行数据增强。\n\
    \n首先导入一些必要的库。\n\n- cifar10：Keras库中包含的用于加载CIFAR-10数据集的类。\n- ImageDataGenerator：Keras中用于进行图像数据增强的类。\n\
    - pyplot：Python中常用的画图工具matplotlib的画图类。\n\n![](img/9b291315612c9c478ad54afa29381fce_47_0.png)\n\
    \n```\n# 如果没有安装 keras 和 tensorflow 库\n# 请使用 pip install keras tensorflow 安装\n\
    from keras.datasets import cifar10\nfrom keras.preprocessing.image import ImageDataGenerator\n\
    from matplotlib import pyplot as plt\n```\n\n```\n输出结果：\nUsing TensorFlow backend.\n\
    ```\n\n加载CIFAR-10数据集，并进行预处理。\n\n```\n(x_train, y_train), (x_test, y_test) = cifar10.load_data()\n\
    y_train = keras.utils.to_categorical(y_train)\ny_test = keras.utils.to_categorical(y_test)\n\
    print(\"独热化后的输出形状\")\nprint(y_train.shape)\nprint(y_test.shape)\nprint(\"处理前的最大值为%f\
    \ \" % x_train.max())\nx_train = x_train / 255\nx_test = x_test / 255\nprint(\"\
    处理后的最大值为%f \" % x_train.max())\n```\n\n在 ImageDataGenerator 中定义图像数据增强的方式。\n\n\
    - rotation_range=30, 随机旋转不超过 30 度。\n- horizontal_flip=True, 随机水平翻转。\n- vertical_flip=True,\
    \ 随机竖直翻转。\n- width_shift_range=5, 随机水平平移不超过 5 像素。\n- height_shift_range=5, 随机竖直平移不超过\
    \ 5 像素。\n\n```\ndatagen = ImageDataGenerator(\n    rotation_range=30,\n    horizontal_flip=True,\n\
    \    vertical_flip=True,\n    width_shift_range=5,\n    height_shift_range=5\n\
    )\n```\n\n选取训练集中一张卡车的图像，用 ImageDataGenerator 对图像进行五次随机变换，并画出原图及五次随机变换后的图像。\n\n\
    ```\norigin_image = x_train[1] # 选取原图\n# 将原图画出来\nplt.imshow(origin_image)\nplt.show()\n\
    # 对图像作五次随机变换并画出来\nfig, ax = plt.subplots(1, 5, figsize=(15, 3))\nax = ax.flatten()\n\
    for i in range(5):\n    ax[i].imshow(datagen.random_transform(origin_image)) #\
    \ 使用datagen对图像作\n```\n"
  mdcn: "\n过于表象。我们希望能从图像的灰度值中挖掘出更多的信息，如图像中各个物体的轮廓、边缘信息。下面我们一起了解一种能检测出物体边缘的简单方法。\n\n\
    ![](img/9b291315612c9c478ad54afa29381fce_38_0.png)\n\n图像中和周围其他像素相比差异较大的像素更有可能是边缘。因此，检测物体边缘的问题可以转化为衡量像素之间灰度的问题。要衡量两个像素之间灰度的差别，只需要将两个灰度相减。要衡量一个像素与周围几个像素的差距，一个很朴素的方法就是把它与上下左右四个像素之间的灰度值的差加起来。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_38_1.png)\n\n而在实际处理灰度图像的操作过程中，我们会将图像中每一个像素的灰度值与一个矩阵上对应位置的数值相乘，再对积进行求和，和的值越大，代表越有可能是边缘。这样对于每一个像素都会计算出一个新的数值，从而得到一张新图像，如下图所示。处理后的图像边缘点都被高亮显示，非边缘点变黑。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_38_2.png)\n\n获取一张新图像的过程就是挖掘图像特征的过程。这个过程涉及的运算过程被称为卷积，它是一种提取图像特征的方式，其中用到的矩阵又被称为卷积核。利用卷积核对输入图像进行卷积操作后，就会输出一张特征图。\n\
    \n卷积核的大小不一，有3×3、5×5、7×7甚至更大的。卷积运算的时候不一定要以每个像素为中心都计算一次，可以每次跳过一定数量的像素再进行计算，这个间隔被称为步长。卷积核中的值不是人工指定的，而是由神经网络学习得到的。\n\
    \n### （二）池化层\n\n了解了卷积核后，我们用一句话就可以介绍卷积层了。所谓卷积层其实就是使用一个或多个卷积核对输入进行卷积操作。\n\n![](img/9b291315612c9c478ad54afa29381fce_39_0.png)\n\
    \n池化层的目的是减小输入图像的大小，去除次要特征，保留主要特征。直观上理解，如果一张图像的分辨率变小，我们还是能够看出图像是什么，因为我们还是能够找到图像内容的主要特征，池化层正是基于这样的思想。池化层本身没有可学习的参数。池化层有两种，最大池化和平均池化。确定一个池化层，首先要确定池化的种类，其次是池化的区域大小和步长，这和卷积核大小和步长同理。对于最大池化，它输出的是选择区域内最大的数值；对于平均池化，它输出的是选择区域内数值的平均值，如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_39_1.png)\n\n### （三）平铺层\n\n平铺层是一个非常简单的神经网络层，它的作用是将一个二阶张量（矩阵）或三阶张量展开成一个一阶张量（向量）。如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_40_0.png)\n\n平铺层作用图解\n\n### （四）卷积神经网络\n\
    \n人类视觉系统的信息处理是分级的。首先，视网膜接受视觉信号，大脑中低级的V1区进行边缘特征提取，V2区进行基本形状提取，更高层的前额叶皮层进行分类判断……高层特征由低层特征组合得到，从低层到高层，特征表达越来越抽象化和概念化。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_40_1.png)\n\n大脑视觉皮层\n\n卷积神经网络对图像的处理过程与人类视觉系统信息处理的方式很相似。卷积神经网络的第一个卷积层的卷积核用来检测低阶特征，如边、角、曲线等。第二个卷积层的输入是第一层的输出，这一层的卷积核用来检测低阶特征的组合，如半圆、四边形等。随着层数的增加，对应卷积核检测的特征就更加复杂、抽象，到卷积层达到一定深度时，卷积神经网络模型就可以识别出图像中的物体。下页图是一个经典的卷积神经网络LeNet的架构图，从中看出输入图像经过了2次卷积层和池化层，然后再经过三个全连接层进行输出，输出数据代表的是属于每个种类的概率。\n\
    \n训练开始时，卷积核中的值都是随机的，它们不能检测到任何特征。就像刚出生的孩子，对任何物体都没有概念，需要学习才能逐步建立概念，卷积神经网络也需要类似的学习过程。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_41_0.png)\n\n通过训练，不断调整卷积核中的值，使得卷积神经网络能够识别出一些特定的图像特征。下图是对卷积神经网络的可视化，右侧显示了卷积神经网络中每一层的样子，第二行代表的是第一个卷积层，它包含了若干卷积核。可以看出有些卷积核检测朝上的边，有些卷积核检测弯曲的边，有些卷积核检测交点。还有很多卷积核我们无法描述它具体检测的特征。经过学习后，每个卷积核具体检测的特征是没有清晰定义的，并不一定是人类所理解的边、角，但一定是卷积神经网络认为能够帮助它进行图像识别的特征。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_41_1.png)\n\n## 三、使用 Keras 搭建一个简单的卷积神经网络\n\
    \n了解了卷积神经网络的原理后，我们开始尝试动手搭建一个简单的卷积神经网络。Keras库提供了非常方便的搭建卷积神经网络的方法，整个过程就像是搭积木一样，将想要的网络层一层一层搭建起来。\n\
