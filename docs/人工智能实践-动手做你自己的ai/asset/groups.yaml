    )维向量）。记\\(\\vec{p}\\)为原图，\\(\\vec{x}\\)为随机生成的图像，\\(P^l\\)和\\(F^l\\)是\\(\\vec{p}\\\
    )和\\(\\vec{x}\\)各自在卷积层1的内容表示，那么内容损失函数可以定义为这两个内容表示之差的平方和：\n\n$$\nL_{content}(\\\
