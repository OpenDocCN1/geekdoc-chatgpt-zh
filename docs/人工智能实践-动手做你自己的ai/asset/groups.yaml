    几年人工智能浪潮中，图像识别是发展最快、技术最成熟、落地最早的算法。车牌识别、人脸识别等诸多基于图像识别的技术正在改变着人们的生活。在本部分中，我们将一起了解机器处理图像数据的原理，编写图像识别的两个经典算法：
