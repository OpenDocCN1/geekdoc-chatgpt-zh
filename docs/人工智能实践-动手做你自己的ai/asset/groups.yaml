    - acc: 0.4382 - val_loss: 1.4892 - val_acc: 0.4670\n...\n...\n...\nEpoch 48/50\n\
    50000/50000 [==============================] - 45s 909us/step - loss:\n5.9696e-05\
    \ - acc: 1.0000 - val_loss: 2.2972 - val_acc: 0.7277\nEpoch 49/50\n50000/50000\
