    价值函数是相对于策略而言的，只有在指明策略的情况下，谈论价值函数才是有意义的。

    因为智能体从某状态出发后获得的回报，由它途经的一系列状态所决定，而正是智能体选择动作的策略决定了它将到达的状态，所以说智能体的策略决定了期望回报的大小。

    状态值函数与动作值函数的数学表达式如下：


    ```

    \( V_\pi(s) = \mathbb{E}_\pi [G_t | S_t = s] \)

    \( Q_\pi(s, a) = \mathbb{E}_\pi [G_t | S_t = s, A_t = a] \)

    ```


    这里为了强调价值函数对应的策略π，我们把它记作价值函数的下标，为了表明对遵循策略π产生的回报取期望，我们也把E记作期望的下标。


    当智能体遵循某一策略时，可以通过这个策略对应的价值函数来反映在智能体眼中一个状态、或一对状态和动作的好坏。比如，一位台球好手在比赛中思量：目前是一杆清台的好机会。那么，这时的台球局势s对应着的是高状态值函数V(s)。再比如，战场上两军陷入僵持状态s，那时派遣骑兵包抄的动作a很可能带来胜利，则这一对（s，a）对应着的是高动作值函数Q(s,
    a)。


