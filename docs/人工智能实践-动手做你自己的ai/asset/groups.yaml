    \  Decoded sentence: 今朝又几年\n\n- Input sentence: 黄河分地络\n  Decoded sentence: 万里见青山\n\
    \n- Input sentence: 一览遗芳翰\n  Decoded sentence: 千载空有情\n\n- Input sentence: 昔闻有耆叟\n\
    \  Decoded sentence: 不觉生尘埃\n\n- Input sentence: 迹与尘嚣隔\n  Decoded sentence: 心期事不同\n\
    \n- Input sentence: 云路三天近\n  Decoded sentence: 山河万里遥\n\n- Input sentence: 犹期传秘诀\n\
    \  Decoded sentence: 不是旧人间\n\n- Input sentence: 城阙天中近\n  Decoded sentence: 山河水正流\n\
    \n- Input sentence: 归期千载鹤\n  Decoded sentence: 春色不相随\n\n- Input sentence: 采药逢三秀\n\
    \  Decoded sentence: 衔杯不可求\n\n- Input sentence: 参同如有旨\n  Decoded sentence: 何必问青山\n\
    \n- Input sentence: 乾道运无穷\n  Decoded sentence: 人间有所思\n\n- Input sentence: 阴阳调厉象\n\
    \  Decoded sentence: 寒气入清风\n\n- Input sentence: 介胄清荒外\n  Decoded sentence: 山河入海云\n\
    \n## 本部分小结\n\n在本部分中，我们首先学习了什么是文本生成问题，如何利用统计语言模型把文本生成问题转化为分类问题。接着学习了n元语法模型、循环神经网络与长短期记忆网络，以及seq2seq等若干文本生成的技术，其间还对词向量和词到向量技术有了初步的了解。\n\
    \n## 第 4 部分 角斗士棋\n\n本部分将围绕角斗士棋（Blokus Duo），了解一些基础的搜索算法及其应用。你或许有疑问，既然已经有了各种各样较为先进的算法，能够高效率地构建水平高超的人工智能，为什么还要学习传统的搜索算法呢？\n\
    \n广义上，人工智能不仅包括以机器学习系列算法所构建的程序，也包括以传统的搜索算法为核心，主要依靠人类经验设计而成的智能体。基本的搜索算法和相关的博弈理论至今仍是许多人工智能算法与模型尤其是强化学习模型的基础。离开这些基础算法和理论，很难进一步理解更加复杂的理论。\n\
    \n在棋类博弈中，人工智能的历史并不算短。早在 20 世纪 60 年代，国际象棋的人工智能程序就已经问世。1997 年，IBM 公司研发的“深蓝”击败当时国际象棋等级分第一位的卡斯帕罗夫，轰动世界。此后，国际象棋、国际跳棋、中国象棋、日本将棋等棋类游戏一一被人工智能占领。2016\
    \ 年，阿尔法人工智能围棋程序横空出世，以 4 : 1 击败围棋世界冠军李世石九段，宣告人类的最后一块棋类游戏高地也被攻占。\n\n不过，在深度学习技术发展起来之前，棋类人工智能所采用的技术都是人类专家精心设计的各种算法，以及从无数人类高手对局中提炼出来的经验和策略。例如“深蓝”包含了几百种特别针对国际象棋的搜索技巧，以及无数已成范式的开局库和残局库。爱好国际象棋或中国象棋的人或许知道，如今，随着终端计算能力的迅速提升，仅靠成熟的搜索算法，许多小巧到可以在普通智能手机上搭载的对弈软件，已经可以击败任何人类棋手。\n\
    \n在本部分的学习中，将以角斗士棋为例，学习几种常见的棋类人工智能算法，从最简单的传统的贪心算法开始，再到不那么平凡的极大极小算法和对应的 Alpha-Beta\
    \ 剪枝，最后再考虑最复杂、但威力也最大的蒙特卡罗树搜索算法。希望通过这一学习路径，能掌握基本的棋类博弈模型以及搜索类人工智能的基本原理。\n\n![](img/9b291315612c9c478ad54afa29381fce_127_0.png)\n\
    \n1997 年“深蓝”与卡斯帕罗夫比赛最后一局的终局局面，“深蓝”执白胜出\n\n## 第十二章 角斗士棋基础知识\n\n本章先来了解双人角斗士棋的基本规则，以及用来表示棋类博弈过程的数学模型。\n\
    \n### 一、游戏规则\n\n角斗士棋是由法国数学家伯纳德·泰维坦(Bernard Tavitian)发明的一款棋类游戏。两名玩家各拥有21枚形状不同的棋子，如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_128_0.png)\n\n角斗士棋的棋子形状\n\n玩家双方在14×14的棋盘上按如下规则交替落子：\n\
    \n- (1) 棋子在放置时允许任意翻转和旋转。\n\n- (2) 本方的棋子必须与已有的本方棋子角对角相邻，但不能边对边相邻；\n\n![](img/9b291315612c9c478ad54afa29381fce_128_1.png)\n\
    \n符合规则落子与不符合规则落子示例\n\n- (3) 双方第一步应分别覆盖棋盘上坐标为（5，5）和（10，10）的位置，即下图中红、蓝方框所标记处；\n\n\
    ![](img/9b291315612c9c478ad54afa29381fce_129_0.png)\n\n初始位置\n\n- (4) 若一方没有合法的落子方式，须弃权一回合，换由另一方落子，除此情况之外不得主动弃权；\n\
    \n- (5) 双方都无法落子时，游戏结束，棋子覆盖格数多者获胜。\n\n### 二、人工智能的任务\n\n计算机功能虽然强大，但它的理解能力却很差。如果不把命令拆解，详细到“某时某刻做某事，以及如何如何做”，再用计算机能“听懂”的语言告诉它，就无法让它有所行动。因此，为了完成目标，大致要经历三步：\n\
    \n第一步是建立数学模型。棋盘、游戏规则等概念对计算机来说实在太复杂，必须将这些概念中没有实质作用的部分舍弃（如棋盘的材质是什么，玩家是人还是电脑等），而将本质的东西依靠数学手段提取出来（如棋盘的大小、棋子的形状和位置）。\n\
    \n第二步是设计算法。算法，即计算的方法。设计算法相当于在拆解命令，并且必须保证命令清晰严谨、没有歧义。\n\n第三步是编程。如果模型足够完善、算法又足够清晰，编程就顺理成章，基本不是难事了。假若你没有编程基础，也大可不必担心，可以跳过后面的所有程序代码，这不会对阅读本部分的其他内容造成实质上的阻碍；你若有Python语言基础，则可以在阅读代码后，尝试动手实现自己的想法。\n\
    \n请不要被看似高深的名词吓到。天下难事，必作于易；天下大事，必作于细。认真思考，许多东西并不困难。\n\n### 三、基本模型\n\n设计棋类人工智能，必须把对局中涉及的组件翻译成计算机能理解的语言。连接自然语言和代码之间的桥梁，就是数学模型。\n\
    \n### （一）状态表示\n\n先来分析一下，为了表示一个确定的局面，需要什么必要的元素。首先，当然要有棋盘；其次，需要标识棋盘上哪些地方有棋子、哪些地方没有棋子，以及棋子具体属于哪一方；此外，某些游戏是历史相关的，这时还需要保存双方在此之前的所有行动。除了以上几点，或许还有其他必要因素，这由具体的游戏类型而定。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_130_0.png)\n\n角斗士棋比较简单，除了棋盘和棋子外，不需要任何额外的信息。首先，规则保证同一方的棋子永远不会边对边相邻，从而每一棋子的轮廓都是清晰、独立的。只要知道棋盘被覆盖的情况，就可以还原出双方已经使用了哪些棋子，也就知道哪些棋子还未被使用。第二，这个游戏是历史无关的，所以不用保存双方的落子记录。综合以上两点，一个状态的所有信息可以表示为“每个位置是否已被某一方的棋子覆盖”。这里可用字母s表示状态，用S表示所有可能状态的集合。\n\
    \n现在，角斗士棋游戏已被抽象出来，我们可建立如下数学模型：一个完整的角斗士棋的对局，就是从初始状态（空棋盘，$s_0$）到终止状态（游戏结束，双方都无法落子），按一定规则进行状态转移（落子）的结果。\n\
    \n### (二) 博弈树\n\n我们从简化版的角斗士棋开始。棋盘缩小到6×6，玩家的棋子也减少了许多，但规则仍和原来一样。这样的简化对提高角斗士棋的水平并无意义，单纯是为了更好地理解算法的概念。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_131_0.png)\n\n简化角斗士棋的博弈树\n\n上图列出了从某个局面开始的部分情况，最右一列表示当前轮是哪一方在行动。最初轮蓝方落子。从图中的初始局面开始，蓝方有4种可能走法（状态转移）；接下来红方又有许多可能的应对（图中只列出了其中一种）。如此下去，自然而然地形成了树形结构：初始状态是树根，从树根长出许多枝条，有的枝条再分出枝条，最终到最底端的树叶为止。人们把从某一状态出发、通过状态转移所形成的树形结构称为游戏的博弈树。\n\
    \n在博弈树中，每个局面（状态）称为一个结点。初始状态称为根结点，简称根；最底端的终局状态称为叶结点。若状态A可以转移到状态B，则AB间有树枝相连，并称A是B的父结点，B是A的子结点。把博弈树每个结点的分支数目平均一下，得到博弈树的分支因子W。博弈树的复杂度（包含结点的数目）是由分支因子和高度决定的。分支因子越大，高度越高，博弈树越复杂，包含的状态就越多。\n\
    \n树结构是计算机模型中最常见的结构之一，而博弈树则是包括棋类游戏在内的许多博弈问题的基本模型。本部分后面学习中遇到的一切算法都将在博弈树上展开。\n\n\
    ## 第十三章 常用的搜索算法\n\n本章主要学习了解基本的搜索算法及其思想，并认识一些较为复杂的变式和其他算法。有编程能力的你可尝试实现本章中的那些算法。\n\
    \n### 一、搜索算法基础\n\n请设想这样一个场景：你把钥匙放在家中的某处，但它突然自己“消失”了。这时，你或许会望望桌上，摸摸口袋，甚至趴下来看看沙发下面。终于，你在书包里找到了它。在此过程中，你试图搜索所有钥匙可能出现的位置（桌上，口袋里，沙发下面……），并对每一个可能的位置去验证（钥匙在那里吗？）；当你搜索到“书包里”时，验证的结果是“钥匙在这里！”，于是问题被成功地解决了。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_133_0.png)\n\n找钥匙\n\n有过棋类游戏经验的人应该知道，取胜的关键在于进行大量而有效的计算。局面对双方都是公开透明的，只有想到了对方忽略的招法，才能克制制胜。这也是一种搜索。\n\
    \n计算机中的搜索与此大同小异。在计算机科学中，“搜索”一词的含义是，利用计算机强大的计算能力，穷举问题的可能解或解的一部分，从而达到解决问题的目的，这与我们的生活经验大体一致。不同之处在于，计算机能在短时间内搜索巨量的状态，因而在处理某些问题上相比人类更加有效。\n\
    \n### （一） 穷举法\n\n穷举，又称枚举，是最简单、最基础的搜索算法。如其字面意思，穷举搜索是将所有可能的解列出来，再一一验证正确性。前文所述的找钥匙就是穷举的过程。穷举法的思想十分朴素：答案总归是存在的，我们只要粗暴地挨着找过去，就一定能找到它。\n\
    \n但细心的你或许发现，上面的说法并不严谨。什么是“挨着”找过去？如何用清晰而没有歧义的语言向计算机解释“挨着”的含义？另一方面，在博弈树中，与每个结点相连的结点有很多，应该按什么顺序搜索？在搜索过程中会不会重复搜索同一结点？\n\
    \n此外，对于某些有明确答案的问题，验证正确性是很容易的一件事。可对于未完成的棋局，怎么评判搜索过程中遇到的某个局面是不是“正确”的呢？\n\n### （二）\
    \ 深度优先搜索\n\n再设想一个场景：你走入了一个迷宫。道路之间有高墙分隔开，完全阻挡了你的视线。幸好你有一支粉笔，可以在走过的墙上做标记。你先想想，用什么方法才能保证找到出口？\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_134_0.png)\n\n复杂的迷宫\n\n一个很自然的想法是：一直向前，同时做好标记。碰到岔路口时，任意选一个没有走过（标记过）的方向进行尝试。如果走到死路，就回到上个岔路口，换个新的方向再试。标记的存在保证了不会出现重复走入同一支路的情况。如此走下去，或许耗费的时间会很长，但只要出口存在，总能走出迷宫。以上描述的过程就是深度优先搜索的基本思想。\n\
    \n让我们再仔细思考这个过程。如果迷宫中没有环状道路，把入口当作根，岔路口当作结点，那么人在迷宫中不断尝试所走过的路径，恰好构成了一棵树！\n\n![](img/9b291315612c9c478ad54afa29381fce_135_0.png)\n\
    \n对p123博弈树进行深度优先搜索的结果\n\n把上述想法应用到p123博弈树上，得到的结果如上图所示，箭头表明了搜索顺序。这样，“深度优先搜索”中“深度”一词的含义也清晰起来：选一个分支走到最深的地方，如果没有找到合适的答案，就返回到最近的、没有被搜索过的结点，换一个分支重复刚才的过程。如此下去，必定能搜索到每一个可能的状态，且不会重复搜索相同的状态。\n\
    \n虽然深度优先搜索本质上还是穷举，但它针对树形结构给出了一种自然、清晰的搜索顺序。至此，第一个疑问初步解决了。\n\n### （三） 剪枝\n\n诚然，根据策梅洛定理（Zermelo’s\
    \ theorem），角斗士棋存在先手或后手的必不败策略。\n\n既然深度优先搜索的过程可以遍历所有局面，自然也可以找到这个策略。理论上，按照该策略去落子是万无一失的。然而，虽然深度优先搜索可以保证找到解，但计算机的计算资源不是无限的。拿国际象棋来说，其复杂度大致为10^46。假设一台计算机每秒可以进行一百亿次运算（10^10\
    \ 次），想要完整地把国际象棋的局面全部搜索一遍，也要10^36 秒，也就是3.2×10^28 年！即使角斗士棋是一种简单的棋类游戏，其所有可能的状态数也大得可怕。因此，把所有状态遍历一遍并不现实。必须想办法“预知”某些分支是走不通的，以免在这些分支上浪费时间。像这样把树上的旁枝舍去的操作被形象地称为剪枝。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_136_0.png)\n\n剪枝示意（模糊部分在剪掉后不会被访问）\n\
    \n假如已经找到了一个较优解，且可以断定某个分支下肯定没有更优解，当然可以把该分支剪掉。这样，我们又回到了第二个疑问：怎样评判某个局面的好坏？\n\n###\
    \ 延伸阅读\n\n#### 策梅洛定理\n\n策梅洛定理是博弈论中的一条重要定理，由德国数学家恩斯特·策梅洛在1913年提出。定理表示，在二人的有限博弈中，如果双方都拥有完全的信息，且博弈中没有运气因素，那么，先行或后行者中必有一方存在必胜或必不败（可能存在平局）的策略。\n\
    \n### （四） 估价函数\n\n对于第二个疑问，最简单的回答是：我方获胜的局面是“正确的”；反之，我方失败的局面是“错误的”。更进一步，导向我方获胜结果的局面是“正确的”，导向我方失败结果的局面是“错误的”。但上节已经提到过，博弈树的复杂度实在太大，不太可能从中间某个结点开始，将其子结点全部搜索一遍，获得每种可能的终局情况，再来评判该结点的价值。因此，需要再次剪枝。顺着这个思路下去，似乎陷入了“剪枝——估价——遍历——剪枝”的死循环。\n\
    \n在传统的搜索算法中，破局的方法需要人类智慧参与：利用人类现有的对游戏的理解，设计一个估价函数，用来判断中间局面的价值。因为人类的感觉多数情况是模糊的，所以估价函数的结果并不是“非黑即白”，直接断言某个局面一定会导向胜利或失败；而是给出一些数字，表示在人类的评判标准下，某个局面的好坏程度。估价函数相当于把人类的知识提前输入给计算机：这个局面不好，那个局面更好。计算机可以利用它进行剪枝，在搜索时避开胜利希望不大的分支，节约搜索时间。用数学的语言来讲，估价函数L把局面状态的集合映射到实数，即L：S→R。换句话说，状态s的评分是L（s）。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_137_0.png)\n\n局面评分的结果（示意）\n\n上图是用某种估价函数L对p123博弈树上每个局面评分之后的结果。可以看到，L把每个状态映射到\
    \ [-5, 5]。其中，蓝方获胜为5，红方获胜为-5，平局为0。其他状态按某种特定的规则分析后给出评分。\n\n设计一个好的估价函数并不是一件容易的事。首先，设计者需要对游戏有较深的了解，知道哪些情况对落子方是有利的，哪些情况是不利的。其次，估价函数可能有多个，使用时\n"
