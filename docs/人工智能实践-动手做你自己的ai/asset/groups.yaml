    \n已知类别的数据往往会被分为两部分，训练数据与测试数据。其中训练数据是用来训练模型的，训练后得到的模型会在测试数据上进行测试，测试得到的准确性就可以认为是这个算法的效果。你可能会问，为什么不直接用全部数据训练，再用相同的数据测试呢？我们考虑这样一个例子，一个人学习乘法的时候，往往先学习“九九乘法口诀表”，可以靠死记硬背的方式把这81种答案都背下来，这样出任何一道个位数的乘法他都能答对。但是这并不代表他学会了乘法运算，一旦给他一个新的乘法算式，例如12×15，他就答不上来了。同样地，一个模型也可以靠“死记硬背”的方法把它“见过”数据的对应类别都记录下来，但是这并不能反应它的真实效果，我们需要用一些它没有“见过”的数据来测试。\n\
    \n从x_train和y_train的形状可以看出训练数据中包含了 60000个数据点。其中输入x是 60000张用28×28=784像素组成的图像。由于MNIST数据集是灰度图，所以每个像素仅由一个数字表示。输出y是\
    \ 60000个数字，代表了每一张图像对应的数字。测试数据x_test和y_test中则包含了 10000个数据点。\n\n我们将训练数据中的前10张图像画出来。（有关matplotlib库的详细用法在本书中不作展开，如果感兴趣可以搜索相关教程。）\n\
    \n```\nfig, axes = plt.subplots(2, 5, figsize=(10, 4)) # 新建一个包含10张子图2行5列的画布\n\
    axes = axes.flatten() # axes中存储了每一个子图\nfor i in range(10): # 循环10次（画10张图)\n  \
    \  axes[i].imshow(x_train[i], cmap=\"gray_r\") # 将x_train的第i张图画在第i个子图上，这里我们用cmap=\"\
    gray_r\"即反灰度图，数字越大颜色越黑，数字越小颜色越白\n    axes[i].set_xticks([]) # 移除图像的x轴刻度\n    axes[i].set_yticks([])\
