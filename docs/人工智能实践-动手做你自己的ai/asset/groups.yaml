    # 确定ngram的历史检索长度，即n\nngram_len = 4\n```\n\n- (3) 进行n元语法计数。\n\n```\n# 初始化ngram词典\n\
    ngram_dict = {}\nfor i in range(1, ngram_len): # i = 1 2 3\n    for j in range(len(token_list)\
    \ - i - 1):\n        # 以前n-1个词为键，第n个词为值，统计映射次数\n        key = \"\".join(token_list[j:\
    \ j + i + 1])\n        value = \"\".join(token_list[j + i + 1])\n        # 为第一次出现的键建立字典\n\
    \        if key not in ngram_dict:\n            ngram_dict[key] = {}\n       \
    \ # 初始化字典内每个键值对映射的计数器\n        if value not in ngram_dict[key]:\n            ngram_dict[key][value]\
    \ = 0\n        ngram_dict[key][value] += 1\n```\n\n- (4) 根据n元语法计数进行文本生成。\n\n```\n\
    # 对输入进行分字或分词\nstart_text = \"明月\"\ngen_len = 200\ntopn = 3\n\nif split_mode ==\
    \ \"char\":\n    word_list = [char for char in start_text]\nelif split_mode ==\
    \ \"jieba\":\n    word_list = [word for word in jieba.cut(start_text)]\n\n# gen_len是我们期望的生成字数或词数\n\
    for i in range(gen_len):\n    temp_list = []\n    # 统计给定前小于等于n-1个词的情况下，下一个词的词频分布\n\
    \    for j in range(1, ngram_len):\n        if j >= len(word_list):\n        \
    \    continue\n        prefix = \"\".join(word_list[-(j + 1):])\n        if prefix\
    \ in ngram_dict:\n            temp_list.extend(ngram_dict[prefix].items())\n \
    \   # 按词频对词排序\n    temp_list = sorted(temp_list, key=lambda d: d[1], reverse=True)\n\
    \    next_word = \"\"\n    # 如果最高频词是标点，则选择最高频词\n    if temp_list[0] == ', ' or\
    \ temp_list[0] == '。' or temp_list[0] == '\\n':\n        next_word = temp_list[0]\n\
    \    else:\n        # 否则从前topn中随机选一个\n        next_word = random.choice(sorted(temp_list,\
    \ key=lambda d: d[1], reverse=True)[:topn])[0]\n    word_list.append(next_word)\n\
    \nprint(\"\".join(word_list))\n```\n\n### 四、结果\n\n在古诗数据集上训练一个4-gram模型后，用“明月”作为开头生成了如下图所示的一段诗歌。\n\
    \n明月，万事不堪思。登山屐，春风吹。树老，何处，风雨夜来风。江南春。不见。上客如先起，还应照所思香何处是，谁知苦寒歌。春来半月度，漾影逐波深。山色满轩白马津。云山，南山，苍苍非一朝。怨咽空自悲泪，不见，秋风。江上秋。不见君。如逢旧友无由。苍苍松桂阴，残月，千里。不见。君看白日暮铜台雨，秋风吹不尽，春风。江上月，独立望江南。江山。白发生。人间。天地有归人。江山此地，不见，秋风吹，门外，孤云。山中。水流。今\n\
    \n| 前缀 | 预测 | 原句 |\n|---|---|---|\n| 明月松间 | 关 | 照 |\n| 白日依山 | 水 | 尽 |\n| 千山鸟飞\
    \ | 燕 | 绝 |\n| 床前明月 | 中 | 光 |\n| 大漠孤烟 | 霞 | 直 |\n\n很明显，ngram模型的效果是不尽如人意的，但这也是可以预见的，毕竟我们使用的n元语法模型本身过于简单。我们不必气馁，凡事总是从简单开始的，一切科学难题都需要一代又一代人前赴后继的努力才能够解决，文本生成也不例外。\n\
    \n## 思考与实践\n\n9.1 n 元语法模型中唯一的可调参数就是 n，n 较大或较小分别有什么好处和坏处？\n\n## 第十章 循环神经网络\n\n\
    在本章中，我们将要学习词向量（word vector）的概念及性质，以及词到向量技术，并使用gensim与sklearn库训练、观察词向量分布。另外还要了解循环神经网络、长短期记忆网络的基本结构，并使用Keras搭建一个简单的长短期记忆网络。通过本章节学习，掌握词向量的基本定义和意义，掌握连续词袋模型、跳跃－元模型两种计算词向量的技术思想，学会使用长短期记忆网络进行文本生成。\n\
    \n在之前的图像识别、图像风格迁移的项目中，相信大家已经体会到神经网络，尤其是卷积神经网络（Convolutional Neural Network）的强大。如同卷积神经网络在计算机视觉领域中大展神威一样，循环神经网络（Recurrent\
    \ Neural Network）在处理文本与时间序列等序列数据的领域中也有举足轻重的地位。它的应用一举突破了自然语言处理领域诸如语言模型、文本生成、文本分类、情感分析等许多问题的瓶颈，取得了良好的表现。\n\
    \n神经网络的基本知识大家可以参考图像识别与图像风格迁移的相关内容，这里不再赘述。\n\n### 一、词的模型——词向量\n\n在引入接下来的模型之前，我们需要学习词向量。\n\
    \n### 1. 算法思想\n\n在n元语法模型中，并没有把词本身代入计算，只是对词的出现作了一个计数而已。为了能够对单词进行计算，需要一种把词转化成数学对象的技术，即对单词建模。\n\
    \n首先，最容易的建模方法是给词表里的单词标号，然后用标号来代表这个词参与数学运算，但是这种模型对词来说太简单了。模型应尽可能多地包含词原本的信息，如词性、语义，以及动词的形式、名词的单复数等，这些显然不是一个标号可以囊括的。而且用标号来代表词的话，对标号进行加减乘除其实没有任何意义，例如，“男人”的标号是1，“苹果”的标号是2，1+2=3代表什么呢？它和3号词又有什么关系呢？可能没有丝毫关系，因为任何一个词都可以标为3号。\n\
    \n既然一个数不够，可以用更多的维度去表征一个词的信息，这就是词向量。向量是一组数（有关向量的概念解析参见图像识别部分），而词向量是用来表示词的一组数。\n\
    \n独热编码（有关独热编码的内容参考第一部分）是一种最简单的词向量，但是独热编码依然有很明显的缺陷。首先，独热编码很容易遇到维数灾难的问题，因为向量的维数和词语集合的大小相同，而词语集合的规模通常都很大，这会大大增加模型尤其是神经网络模型的计算时间，导致根本无法训练。其次，独热编码依然没有克服向量运算无意义的问题，也无法用独热编码向量来衡量词的相似程度。\n\
    \n那该如何确定每个词的词向量值呢？\n\n结合之前对标号模型和独热编码模型的思考，事实上我们希望词向量能够满足下面两个条件。\n\n- (1) 语义相近的词的词向量距离相近，语义不同的词的词向量距离较远。\n\
    \n  - 如：“苹果”与“香蕉”的距离比“苹果”和“跑”的距离要近。\n\n- (2) 对词做运算是有意义的。\n\n  - 如：“男人” - “女人”\
    \ = “国王” - “皇后”（语义的意义）。\n  - 又如：apples - apple = bananas - banana（语法的意义）。\n\n\
    ![](img/9b291315612c9c478ad54afa29381fce_110_0.png)\n\n我们把构造这种词向量的技术称作词嵌入（word\
    \ embedding），实际上就是把单词嵌入向量空间的意思。\n\n目前主流的计算词向量的方法是词到向量（word2vec），词到向量是一种基于深度前馈神经网络的技术，它的计算效率特别高。一般来说词到向量分为两种类型：连续词袋（Continuous\
    \ Bag of Words，CBOW）模型和跳跃-元模型（Skip-Gram）模型。从算法上看，这两种模型比较相似，只是连续词袋模型是从上下文字词预测中间字词，而跳跃-元模型则与之相反，是从中间字词预测上下文字词。\n\
    \n词到向量技术源于对词的语义如何定义的思考。一种观点认为，一个词的语义就是它的语境，也就是周围的词。不同的词所处的语境不同，类似的词所处的语境类似，而语境的类似可以理解为出现词的概率分布类似。比如“银行”这个词的周围总是出现“税率”“利息”等词，“苹果”的周围就很少出现这样的词，“苹果”和“银行”的语义非常不同，但是“苹果”和“香蕉”周围都会经常出现“水果”“营养”等词语，它们所处的语境就很类似，也就意味着它们的语义相近。\n\
    \n词到向量技术具体如何实现不在本书的讨论范围内，有兴趣可以自行查阅相关资料。\n\n### 2. 代码实现\n\n目前已经有成熟的词向量训练库，我们不需要知道具体的技术细节也可以训练并观察词向量。下面将利用现有的\
    \ gensim、sklearn 和 plotly 库，在一个语料上训练 word2vec 模型，并可视化训练后的词向量分布。\n\n- (1) 导入必要的库。\n\
    \n- plotly;\n- decomposition：经典机器学习库 sklearn 中用来数据降维的库。\n- gensim：一个经典的自然语言处理库。\n\
    - numpy：Python 中用于处理各种数值计算的库。\n\n```\n# 如果没有安装 gensim, sklearn 和 numpy 库\n# 请使用\
    \ pip install gensim scikit-learn numpy 安装\nimport plotly\nimport sklearn.decomposition\n\
    import gensim\nimport numpy\n```\n\n- (2) 利用gensim的Word2Vec训练词向量并保存词向量模型。\n\n\
    ```\n# 读入语料\nsentences = gensim.models.word2vec.Text8Corpus(\"../input/word2vec/word2vec.txt\"\
    )\n# 训练word2vec模型\nmodel = gensim.models.word2vec.Word2Vec(sentences, size=300)\n\
    # 保存模型\nmodel.save(\"poetry.w2v\")\n```\n\n- (3) 训练完成后载入词向量模型。\n\n```\n# 装载模型\n\
    model = gensim.models.Word2Vec.load(\"./\" + w2v_filename)\n# 装载词向量\nall_word_vector\
    \ = model[model.wv.vocab]\n```\n\n我们是无法直接可视化一个300维的向量的，但是可以利用sklearn的主成分分析（principal\
    \ component analysis, PCA）工具对词向量进行降维,并获得与start_word最相似的词的词向量列表。\n\n> # 延伸阅读\n\
    > \n> ## 主成分分析\n> \n> 主成分分析是一种常用的数据分析方法。主成分分析通过线性变换将原始数据变换为一组各维度线性无关的表示，可用于提取数据的主要特征分量，常用于高维数据的降维。在降维后，低维表示仍能保留高维数据的一些重要性质，由于保留了原数据方差最大的几个主要特征方向，低维表示是高维数据很好的低耗近似。\n\
    \n```\npca = sklearn.decomposition.PCA(n_components=3)\npca.fit(all_word_vector)\n\
    # 收集与start_word最相似的词向量\nsimilar_word_list = [start_word] + [pair[0] for pair in\
    \ model.most_similar(start_word, topn=topn)]\nsimilar_word_vector = [model[word]\
    \ for word in similar_word_list]\n# 降维\ndecomposed_vector = pca.transform(similar_word_vector)\n\
    ```\n\n- (4) 利用plotly工具进行绘图，返回一个html文件，可以查看与start_word最相似的词的3维词向量分布。\n\n```\n\
    # 设置坐标图中画出的点的坐标，文本标注的位置和颜色\ntrace = plotly.graph_objs.Scatter3d(\nx=decomposed_vector[:,\
    \ 0],\ny=decomposed_vector[:, 1],\nz=decomposed_vector[:, 2],\nmode=\"markers+text\"\
    ,\ntext=similar_word_list,\ntextposition=\"bottom center\",\nmarker=dict(\n  \
    \  color=[256 - int(numpy.linalg.norm(decomposed_vector[1] - decomposed_vector[0]))\
    \ for i in range(len(similar_word_list))]\n    )\n)\nlayout = plotly.graph_objs.Layout(\n\
    \    title=\"Top \" + str(topn) + \" Word Most Similar With \\\"\" + start_word\
    \ + \"\\\"\"\n)\ndata = [trace]\nfigure = plotly.graph_objs.Figure(data=data,\
    \ layout=layout)\ngraph_name = \"word2vec.html\"\n# 绘图\nplotly.offline.plot(figure,\
    \ filename=graph_name, auto_open=False)\n```\n\n### 3. 结果\n\n在我们准备的古诗数据集上训练得到的与“山”字最相似的一些字的词向量分布图如下图所示。\n\
    \n![](img/9b291315612c9c478ad54afa29381fce_113_0.png)\n\n与“山”字最相近的一些字的词向量低维分布\n\
    \n用词向量能够将文本数据嵌入低维空间转化为向量数据，从而能够输入神经网络进行运算。\n"
