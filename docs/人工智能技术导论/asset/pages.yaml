    # 3. 人工智能、机器学习与深度学习之间的关系


    机器学习的思想是让机器自动地从大量的数据中学习出规律，并利用该规律对未知'
  merge: -1
  img_proc: true
- pgno: 77
  md: '的数据做出预测。在机器学习的算法中，深度学习是特指利用深度神经网络的结构完成训练和预测的算法。人工智能、机器学习和深度学习的关系如图 2-11 所示。从图中可以看出，深度学习是机器学习的子类。可以说机器学习是一种实现人工智能的方法，深度学习是一种实现机器学习的技术。


    ![](img/70810124a73792907f3adecdd1e14f54_77_0.png)


    图 2-11 人工智能、机器学习和深度学习的关系


    # (1) 机器学习和深度学习具体是如何工作的


    以人脸识别为例，传统的机器学习在确定了相应的面部特征，如眼睛、鼻子、嘴等之后，才能基于这些特征做进一步的分类处理；而深度学习可以通过多层神经网络结构，将底层特征（low-level
    features）逐步“进化成”人能看懂的、能理解的高层特征（high-level features），从而实现自动找出分类问题所需要的重要特征。基于深度学习的人脸识别步骤如图
    2-12 所示。第一步输入的是原始数据（raw data），这个数据机器是没法理解的。


    ![](img/70810124a73792907f3adecdd1e14f54_77_1.png)


    图 2-12 基于深度学习的人脸识别步骤'
  merge: -1
  img_proc: true
- pgno: 78
  md: '于是，深度学习首先尽可能地找到与这个头像相关的各种边，这些边就是底层特征；然后对这些底层特征进行组合，就可以看到鼻子、眼睛、耳朵等，它们是中间层特征（mid-level
    features）；最后对鼻子、眼睛、耳朵等进行组合，就可以组成各种各样的头像，也就是高层特征。这个时候就可以识别出各种人的头像了。


    # (2) 机器学习与深度学习的区别


    机器学习与深度学习的区别可以从数据、硬件、特征和运行时间等几个维度进行分析。


    首先是数据依赖，随着数据量的增加，二者的表现有很大区别。深度学习适合处理大数据，而当数据量比较小的时候，用机器学习更加合适。机器学习和深度学习的数据处理效果对比如图
    2-13 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_78_0.png)


    图 2-13 数据处理效果对比


    其次是硬件依赖，深度学习十分依赖高端的硬件设施，因为计算量实在太大。深度学习会涉及很多矩阵运算，因此很多深度学习要求有 GPU（图形处理器，专门为矩阵运算而设计的）参与运算。相比之下，机器学习对硬件配置没有很高的要求，传统的机器学习算法可以运行在低端的设备上，依靠计算机
    CPU 就可以完成模型的训练。


    再次是特征工程，简单讲就是在训练一个模型的时候，需要首先确定哪些特征。在机器学习中，几乎所有特征都需要人为确认后再进行手工特征编码，而深度学习则试图自己从数据中学习特征。


    最后是运行时间，深度学习需要花大量时间来训练，因为有太多参数要去学习。机器学习一般几秒钟、最多几小时就可以训练好。


