    一些照相机和摄影机就是利用了小孔成像的原理——镜头是小孔（大多数安装凸透镜以保证光线成像距离），景物通过小孔进入暗室，像被一些特殊的化学物质（如卤化银等）留在胶片上(数码相机、摄影机等则是把像通过一些感光元器件存储在存储卡内)。


    照相机中对成像最有用、最基本的还是处理器和传感器。单反相机全名叫单镜头反光式照相机，有胶片相机和数码相机之分，但现在几乎全是数码相机了。数码相机最核心的部件是处理器，其中包含中央处理器和图像处理器（现在很多是集成到同一芯片中，中央处理器负责整合相机的所有动作，比如开机、控制相机等）。图像处理器负责将传感器记录下来的光学图像信息（模拟信号）转换为数字信号，也就是照片和视频，然后再保存到存储器中。


