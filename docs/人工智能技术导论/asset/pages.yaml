    # 4. 机器学习在生产排产智能化领域的应用


    高级计划与排程（advanced planning and scheduling，APS）系统的构建是智能制造领域的研究热点之一。因为 APS 可以实现 ERP
    和 MES 之间的协调管理，是避免出现信息孤岛的核心系统。其中，ERP 是进行企业经营的顶层决策系统，主要用于解决企业协同管理和运营数据问题，面向企业的财务、销售、采购、研发、生产等部门，通过优化流程管理、规范管理和数据管理来提升企业管理效率；MES
    是进行车间管理的底层决策系统，主要用于解决制造企业车间现场数据采集、监控、自动报工等问题，通过传感器和控制器记录整个生产过程，使生产管理具有追溯性；而 APS
    系统则是独立于 ERP 和 MES 之外的系统，是一个独立的生产计划模块，主要解决 ERP 需求和 MES 执行之间的协调问题，通过 APS 系统让 ERP
    需求成为 MES 可执行性生产计划。目前，机器学习和深度学习在以上 3 类系统中均有广泛应用。


    以 APS 系统为例，APS 的实质是在生产资源受到约束的前提下，针对物料、机器设备、人员、客户需求和订单变化等数据进行实时监控，然后利用数学计算、机器学习算法等进行数据建模并反复训练和推理，最终形成一个有效的、精确的和可执行的生产计划，以便企业能够精确整合生产资源和合理分配生产时间，用于降低生产成本，提高生产效率。


    # 5. 机器学习在机器翻译领域的应用


    在日常工作与生活中经常使用的百度翻译、网易有道词典等“文本翻译”软件都涉及了多种机器学习和深度学习算法的应用。各种类型的机器翻译服务虽然暂时还无法直接用于书面翻译，但人们理解其他语言的壁垒已经大大降低，在很多场景下机器翻译确实起到了很好的辅助作用。


