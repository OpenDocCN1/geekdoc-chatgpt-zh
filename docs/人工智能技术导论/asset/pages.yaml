    # 4. 智慧渔业


    渔业是指开发和利用水域，采集捕捞与人工养殖各种有经济价值的水生动植物，以取得水产品的社会生产部门。渔业按水域可分为海洋渔业和淡水渔业，按生产特性可分为养殖业和捕捞业。


    智慧渔业是运用物联网、大数据、人工智能、卫星遥感、移动互联网等技术，深入开发和利用渔业信息资源，全面提高渔业综合生产力和经营管理效率的过程，是推进渔业供给侧结构性改革，加速渔业转型升级的重要手段和有效途径。其中人工智能技术已逐步应用在水产养殖、水产加工、水质分析、鱼情诊断、饲料配比和疾病预防等领域。


    # 1.3.5 案例鉴赏：人工智能技术在智慧商业领域的应用案例


    # 1. 智能客服机器人


    智能客服机器人集成了语音识别、语义理解、知识图谱、深度学习等多项人工智能技术，能准确理解用户的意图或提问，再根据丰富的内容和海量知识图谱给予用户满意的回答。智能客服机器人具有以下两大优点。


    +   (1) 提高售前转化率


    智能客服机器人在售前接待中，支持全渠道客服接入，并且可以及时与客户进行接触。在用户提出咨询的第一时间，智能客服机器人就会做出响应。在营销转化方面，智能客服机器人可以收集用户的浏览轨迹、访问渠道、点击率等，根据用户画像来为用户推荐差异化的产品，做到精准营销。


    +   (2) 降低售后客服成本


    智能客服机器人在同一时间可以接待多位客户，做到快速应答，如果用户的问题不能通过智能客服机器人引导自助解决，则会转给人工客服，这样分流到人工客服的工作量就会大大减轻。通过对智能客服机器人知识库的不断优化，智能客服机器人可以处理的问题越来越多，同时人工客服在与客户交流时也可以得到智能客服机器人的辅助，比如推荐解决方案等。


    # 2. 刷脸支付


    刷脸支付利用了智能传感、人工智能和大数据等技术，是一种以人脸识别为核心的，具备更便捷、更安全、更好的体验等优势的新型支付方式。


    其中，人脸识别技术是基于人的脸部特征，对输入的图像或者视频流，首先判断其是否存在人脸，如果存在人脸，则进一步给出每个人脸的位置、大小和各个主要面部器官的位置信息，然后依据这些信息，进一步提取每个人脸中所蕴含的身份特征，并将其与已知的人脸进行对比，从而识别每个人脸的身份。


    人脸识别一般包括以下 4 个过程。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# (1) 人脸图像采集及检测


    不同的人脸图像都能通过摄像镜头采集下来，如静态图像，动态图像，不同位置、不同表情的图像等都可以得到很好的采集。当用户在采集设备的拍摄范围内时，采集设备会自动搜索并拍摄用户的人脸图像，然后通过人脸检测将人脸的位置和大小在拍摄的图像中准确标定出来。


    # (2) 人脸图像预处理


    预处理是对人脸检测的结果进行光线补偿、灰度变换、直方图均衡化、归一化、几何校正、滤波以及锐化等的处理过程。因为原始图像会受到各种条件的限制和随机干扰，往往不能直接使用，所以必须在图像预处理阶段对其进行灰度校正、噪声过滤等操作。


    # (3) 人脸图像特征提取


    人脸识别技术可使用的人脸图像特征通常分为视觉特征、像素统计特征、人脸图像变换系数特征、人脸图像代数特征等。人脸图像特征提取就是对人脸特征进行提取建模的过程。人脸图像特征提取的方法归纳起来分为两大类：一种是基于知识的表征方法；另一种是基于代数特征或统计学习的表征方法。


    # (4) 人脸图像匹配与识别


    人脸图像匹配是将提取的人脸图像特征数据与数据库中存储的特征模板进行搜索匹配，通过设定一个阈值，当相似度超过这一阈值时，则把匹配得到的结果输出。人脸图像识别就是将待识别的人脸特征与已得到的人脸特征模板进行比较，根据相似程度对人脸的身份信息进行判断。这一过程又分为两类：一类是确认，是一对一进行图像比较的过程；另一类是辨认，是一对多进行图像匹配对比的过程。


    # 3. 无人仓


    无人仓是现代信息技术应用在商业领域的创新。无人仓的主要应用领域包括以下几个方面。


    +   1) 劳动密集型且生产波动比较明显的行业：如电商仓储物流，对物流时效性要求不断提高，受限于企业用工成本的上升，尤其是临时用工的难度加大，采用无人仓能够有效提高作业效率，降低企业整体成本。


    +   2) 劳动强度比较大或劳动环境恶劣的行业：如港口物流、化工企业，采用无人仓能够有效降低操作风险，提高作业安全性。


    +   3) 物流用地成本相对较高的企业：如城市中心地带的快消品批发中心，采用无人仓能够有效提高土地利用率，降低仓储成本。


    +   4) 作业流程标准化程度较高的行业：如烟草、汽配行业，采用无人仓更易于衔接标准化的仓储作业流程，实现自动化作业。


    +   5) 对于管理精细化要求比较高的行业：如医药、精密仪器行业，采用无人仓可以实现更加精准的库存管理。


    设立无人仓的目标是实现入库、存储、拣选、出库等仓库作业流程的无人化操作。这就需要仓储系统具备自主识别货物、自主追踪货物流动、自主指挥设备执行任务、无须人工干预等条件；此外，该系统还要有一个“智慧大脑”，用于对传感器感知的海量'
