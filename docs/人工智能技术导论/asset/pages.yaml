  md: '# 1. 宽度优先搜索


    宽度优先搜索（breadth first search，BFS）又称为广度优先搜索，如图 4-1 所示，是最简便的图搜索算法之一，最初用于解决迷宫最短路径和网络路由等问题。整个搜索过程可以看作一个树的结构，算法从图上的一个节点出发，先访问其直接相连的子节点，若子节点不符合，再访问其子节点的子节点，按级别顺序依次访问，直到访问到目标节点为止。这种搜索方法是每层走完了才会对下一层进行搜索，以接近起始节点的程度依次扩展节点，逐层进行搜索，在对下一层的任一节点进行搜索之前，必须搜索完本层的所有节点。


    ![](img/70810124a73792907f3adecdd1e14f54_110_0.png)


    图 4-1 宽度优先搜索


    以图 4-1 为例，可以理解为搜索的顺序是从第 0 层的 A 节点开始，往第 1 层分别依次访问 B、E、H、K 节点，至此第 1 层所有节点访问完毕，此时才可以对下一层继续访问。需要注意的是，在对下一层的任一节点进行搜索之前，必须搜索完本层的所有节点，直至最后访问至
    M 节点，遍历完成。


    # 2. 深度优先搜索


    深度优先搜索（depth first search，DFS）如图 4-2 所示，是一种用于遍历搜索树或图的算法。搜索的过程是沿着一条路径不断往下搜索直到不能再继续为止，然后再折返，开始搜索下一条候补路径，如此重复，直到找到目标。


    设想现在身处一个巨大的迷宫中，只能自己想办法走出去，下面是一种看上去很盲目但实际上会很有效的方法。以当前所在位置为起点，沿着一条路向前走，当碰到岔道口时，选择其中一个岔路前进。如果选择的这个岔路前方是一条死路，就退回到这个岔道口，再选择另一个岔路前进。如果岔道口存在新的岔道口，那么仍然按上面的方法枚举新岔道口的每一条岔路。这样，只要迷宫存在出口，那么通过这个方法一定能够找到它。


    深度优先搜索的主要特点是沿路径搜索，以图 4-2 为例，搜索路径从第 0 层的 A 节'
