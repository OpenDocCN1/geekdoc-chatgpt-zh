    # 1. 语音电子病历


    语音电子病历主要利用了人工智能技术中的自然语言处理和语音识别领域的研究成果。与传统手写病历不同，语音电子病历一方面改变了医生的问诊方式，使他们可以一边问诊，一边将结果读出来，并通过专门定制的医学麦克风传输到计算机上，再利用语音识别和语音转换程序生成电子版的文字病历，提供给患者且便于长期存档，从而缓解医生的疲劳，提升其问诊效率；另一方面，有了语音电子病历后，患者看不懂医生写的“天书”病历，听不懂医生的方言诊断，纸质病历容易遗失等问题迎刃而解，患者看病的满意度显著提高。


