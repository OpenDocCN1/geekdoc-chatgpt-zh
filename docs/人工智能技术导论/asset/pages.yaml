    # 2. 第一次寒冬（1965～1979 年）


    1965 年，人工智能迎来一个小高潮之后，质疑的声音也随之到来，阿瑟·塞缪尔设计的“跳棋程序”停留在了战胜州冠军，机器翻译领域一直无法突破自然语言理解，1966
    年美国公布了一份名为“语言与机器”的报告，全盘否定了机器翻译的可行性。1969 年，马文·明斯基发表言论，称第一代神经网络（感知机 perceptron）并不能学习任何问题，美国政府和美国自然基金会大幅削减了人工智能领域的研究经费。在
    20 世纪 70 年代，人工智能经历了将近十年的寒冬时期。


    # 3. 繁荣后再一次寒冬（1980～1988 年）


