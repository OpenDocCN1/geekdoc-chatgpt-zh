  md: '起床次数以及进入深度睡眠的总时间等。


    # (5) 母婴健康管理


    母婴健康管理涉及从母体健康到孕育新的生命，再到宝宝出生生长大等方面，包括个人形体变化、心理情感变化、育儿技能，甚至还能解决各种复杂的家庭问题。例如，Owlet无线智慧袜能够监测宝宝的健康和舒适度，记录宝宝的心率、血氧水平、睡眠质量、皮肤温度以及睡眠位置等信息，可在侦测到幼儿异常心率或血氧水平时通知父母。


    # (6) 老年人护理


    老年人护理系统主要针对老年人的养老生活，使家人可以远程了解老年人的状况，并在出现突发状况时及时进行救助。例如，老年人没有在往常的时间段进行作息，系统便会给家人发送短信，提醒家人进行电话询问。


    # 5. 药物研发


    新药研发具有研发周期长、研发费用高和研发风险大三大痛点。人工智能技术可作用于药物研发中的药物发现、临床前研究、临床试验、药品生产和销售推广 5 个阶段，主要应用于靶点发现、化合物合成、新适应证发现、化合物筛选、晶型预测、患者招募、优化临床试验设计、药品检查和学术推广九大场景。


    目前，人工智能技术在药物研发中的应用如表 1-4 所示。


    # 表 1-4 人工智能技术在药物研发中的应用一览表


    | 药物阶段 | 应用环节 | 应用场景 |

    | :--- | :--- | :--- |

    | 药物发现 | 靶点发现 | 利用自然语言处理技术检索分析海量的文献、专利和临床试验报告等非结构化的数据库，找出潜在的、被忽视的通路、蛋白和机制等与疾病的相关性，从而提出新的可供测试的假设，以发现新机制和新靶点
    |

    | 药物发现 | 先导化合物研究和化合物筛选 | 利用机器学习（或深度学习）技术学习海量化学知识，建立高效的模型，快速过滤“低质量”化合物，聚合潜在有效分子
    |

    | 药物发现 | 化合物合成 | 利用机器学习（或深度学习）技术学习海量已知的化学反应，预测在任何单一步骤中可以使用的化学反应，解析所需分子，得到可用试剂
    |

    | 临床前研究 | 新适应证发现 | 借助计算机的深度学习能力和认知计算能力，将已上市或处于研发中的药物与疾病进行匹配，发现新靶点，扩大药物的治疗范围 |

    | 临床前研究 | 晶型预测 | 一种物质能以两种或两种以上不同的晶体结构存在的现象称为多晶型现象，晶型变化会改变固体化合物的物理及化学性质（如溶解度、稳定性、熔点等），导致药物在临床治疗、毒副作用、安全性方面的差异，会对药物研发造成干扰。可以利用认知计算实现高效动态配置药物晶型，预测小分子药效
    |

    | 临床试验 | 临床试验设计 | 利用自然语言处理技术检索过去临床试验中的成功和失败经验，优化临床试验方案 |

    | 临床试验 | 患者招募 | 利用自然语言处理技术提取患者数据，为临床试验匹配相应患者 |

    | 药品生产 | 药品检查 | 利用计算机视觉检测压花、重影、划痕、分层等缺陷 |

    | 药品销售 | 学术推广 | 为药物及医疗器械企业、医生、患者提供全流程的智能医学创新服务 |'
