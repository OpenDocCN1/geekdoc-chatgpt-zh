    +   (7) 同一项语音识别技术部署于不同行业需要进行不同的调整和设置。 ( )

    +   (8) 智能语音技术可以极大地解放生产力，实现一定程度上的办公自动化。 ( )

    +   (9) 智能语音技术可以用于身份识别。 ( )


    # 2. 选择题


