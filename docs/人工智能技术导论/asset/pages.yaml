- pgno: 175
  md: '语法分析。


    # (1) 查词典


    通过查词典，找出词或词组的译文代码和语法信息，为以后的语法分析与译文输出提供条件。机器翻译中的词典按其任务的不同可分成以下几种。


    综合词典：它是机器所能翻译的文献的词汇大全，包括原文词及其语法特征（如词类）、语义特征和译文代码，以及对其中某些词进一步加工的指示信息。例如，在一般的词典中查找“我”这个词，会体现出词类是“名词”，用法是做“主语或宾语”等。


    成语词典：为了提高翻译速度和质量，可以将成语词典与综合词典共同使用。例如，需要翻译“波澜不惊”，如果按照逐字翻译的方式很难体现词语的意境，并且速度较慢，使用成语词典可以一步到位。


    同形词典：专门用来区分语句中有语法同形现象的词。例如，“aabb”式词语有勤勤恳恳、兢兢业业等，根据同形现象的查询，可以明确此类词语一般用于强调语境。


    结构词典：某些词在语言中与其他词可构成一种可嵌套的固定格式，将这类词定义为分离结构词。根据这种固定搭配关系，可以简便而又切实地找出一些词（尤其是介词）的词义和语法特征，从而减轻语法分析部分的负担。例如，“如果……那么”“虽然……但是”等等。


    多义词典：语言中一词多义的现象很普遍，为了解决多义词问题，必须把源语的各个词划分为一定的类属组。例如，“厉害”有时候表示一个人的优秀程度，有时候表示事情的严重程度。机器翻译的时候，在多义词典中预置好这一多义现象，有助于加快翻译的速度和提高翻译的精准度。


    通过查词典，原文句中的词在语法类别上便可成为单功能的词，在词义上成为单义词（某些介词和连词除外），从而给下一步语法分析创造有利条件。


    # (2) 语法分析


    经过词典加工之后，就进入了对输入句的语法分析阶段。语法分析的任务是进一步明确某些词的形态特征，切分句，找出词与词之间在句法上的联系，同时得出语言的中介成分，为下一步译文综合做好充分准备。


    通过英汉语句对比研究发现，翻译英语句子时除了要翻译其中各个词的意义，还需要完成调整词序和一些形态成分的工作。为了调整词序，必须弄清需要调整什么，即找出要调整的对象。根据分析，英语句子一般可以分为动词词组、名词词组、介词词组、形容词词组、分词词组、不定式词组、副词词组等。正是这些词组承担着各种句法功能，如谓语、主语、宾语、定语、状语等，除谓语外，它们都可以作为调整的对象。


    # 3. 译文综合


    译文综合比较简单，事实上它的一部分工作（如该调整哪些成分和调整到什么地方）在上一阶段已经完成，这一阶段的任务主要是把应该移位的成分调动一下。除此之外，译文综合阶段还有一个重要的任务就是“润色”，早期的机器翻译之所以生硬，是因为译文综合部分缺少了“润色”功能。例如，“我在学校”这一句汉语，如果采用查字典逐字翻译的方式，翻译出来是“I
    at school”，但这是一个病句，因为句子中没有谓语动词。'
