    # 2.2.2 人工智能层次


    # 1. 人工智能发展层次


    人工智能发展可以分为 3 个层次，即运算智能、感知智能和认知智能。


    +   (1) 运算智能


    运算智能，即对数据的基础逻辑计算和统计分析。通常指基于清晰规则的数值运算，如数值加减、微积分、矩阵分解等。得益于计算机运算速度和存储容量的与日俱增，运算智能给互联网、金融、工业等多个领域带来产业价值。然而，运算智能也面临显著困境。以金融场景为例，运算智能受限于指定的数据逻辑规则，虽然运算智能可以高性能地计算股票的统计特征，但无法运用专家知识，也难以进行深度、动态和启发式的推理，对投资等业务贡献的价值有限。运算智能所需的高性能硬件和网络支持等，也给企业带来了巨大的成本压力。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# (2) 感知智能


    感知智能，即视觉、听觉、触觉等感知能力。感知智能是指将物理世界的信号通过摄像头、麦克风或者其他传感器的硬件设备，借助语音识别、图像识别等前沿技术，映射到数字世界，再将这些数字信息进一步提升至可认知的层次，如记忆、理解、规划、决策等。自动驾驶汽车，就是通过激光雷达等感知设备和人工智能算法来实现感知智能的。机器在感知智能方面比人类还有优势。不管是
    Big Dog（美国运输机器狗）这样的感知机器人，还是自动驾驶汽车，因为充分利用了 DNN 和大数据的成果，在感知智能方面已越来越接近人类。自动驾驶智能感知如图
    2-5 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_73_0.png)


    图 2-5 自动驾驶智能感知


    # (3) 认知智能


    认知智能，通俗讲是“能理解，会思考”。从特征来看，其具有人类思维理解、知识共享、行动协同等特征。从能力来看，首先，需要具有对采集的信息进行处理、存储和转化的能力，在这一阶段需要运用计算智能、感知智能的数据清洗、图像识别能力。其次，需要拥有对业务需求的理解及对分散数据、知识的治理能力。最后，需要能够针对业务场景进行策略构建和决策，提升人与机器、人与人、人与业务的协同、共享等能力。


    # 2. 人工智能程度划分


    按照人工智能发展程度和应用范围，可以将人工智能划分为弱人工智能、强人工智能和超人工智能 3 个等级，如图 2-6 所示。其中，弱人工智能也称限制领域人工智能或应用型人工智能，指的是专注于且只能解决特定领域问题的人工智能。强人工智能则是通用人工智能或完全人工智能，指的是可以胜任人类所有工作的人工智能，人类可以做什么，强人工智能就可以做什么。显而易见，在强人工智能的基础上，如果在单个或多个领域都远超人类的智能，那么这种智能就可以称为超人工智能。当前市面上能看到的人工智能应用还处于弱人工智能的范畴，虽然人工智能依靠机器学习和深度学习技术取得了快速进展，但存在依赖大规模标注数据进行监督训练的问题，要实现真正的强人工智能，人工智能应用还需要掌握大量的常识性知识，以人的思维模式和知识结构来进行语言理解、视觉场景解析和决策分析等。'
