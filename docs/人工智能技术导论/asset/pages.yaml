    # 中国古代的人工智能：非物质文化遗产之提线木偶


    相比于当前人工智能领域的机器人，早在秦汉时期，古代先人创造的提线木偶（见图 2-20），在精神和动作上更加细腻、传神。通过精湛规范的操线功夫和独具特色的木偶头雕刻与制作工艺，一部部经典传统剧目被出彩演绎，大大满足了当时人们的精神文化需求。


    如同木偶的动作和精神需要手艺人精准操控每一根线来演绎一样，当前人工智能的高速发展，也需要在可控的范围内规范发展，人工智能引发的一系列社会问题，在很大程度上是由于开发过程中的技术缺陷所导致的。因此，投身于人工智能浪潮中，从业者既要仰望星空，勇攀高峰，又要时刻谨记使命，不忘初心，科技要造福'
