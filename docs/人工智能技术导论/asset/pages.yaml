    祝融号，“天问一号”任务火星车，火神祝融登陆火星的意思。2021 年 5 月 17 日，“祝融号”火星车（见图 6-20）首次通过环绕器传回遥测数据。5 月
    22 日 10 时 40 分，“祝融号”火星车已安全驶离着陆平台，到达火星表面，开始巡视探测。6 月 11 日，“天问一号”探测器着陆火星，首批科学影像图公布。8
    月 23 日，“祝融号”火星车平安在火星度过 100 天，更是行驶里程突破 1000 米的关键一天，标志着我国首次火星探测任务取得圆满成功。


    ![](img/70810124a73792907f3adecdd1e14f54_157_0.png)


    # 图 6-20 “祝融号”火星车


    “祝融号”火星车搭载了 2 台高科技的视觉设备，包括：


    +   1) 多光谱相机，获取着陆点周围的地形、地貌和地质背景信息，进行空间分析，获得岩石、土壤等可见近红外光谱数据；采集各种白天和黑夜的天空图像，以进行特定的大气、气象和天文研究。


    +   2) 导航地形相机，拍摄广角图片，指导火星车的移动并寻找感兴趣的目标（岩石/土壤等）；结合环绕器上搭载的高分辨率相机，将拍摄到的地面图像进行比对，可以校准火星表面的真实情况；为其他科学载荷寻找感兴趣的探测目标或区域。


    正是由于有了这两对眼睛，才使得“祝融号”火星车在阳生环境下行走变得顺畅。由于搭载了导航地形相机，“祝融号”火星车能顺利完成地形探测和路径规划，在自主避障行走过程中，能在复杂多变的环境中避开障碍物，找到最优路线行走。多光谱相机又能获取火星地形，采集各种白天和黑夜的天空图像，能对火星环境研究提供数据。这是计算机视觉技术在我国火星探索领域的深度应用，表明我国在计算机视觉技术领域处于国际前沿位置。'
