    # (3) 信息物理融合系统


    信息物理融合系统又被称为“虚拟网络-实体物理”生产系统，其架构如图 1-33 所示，它彻底改变了传统制造业的逻辑。在成熟的信息物理融合系统中，每个工件所需要的服务将会被独立计算出来。现有生产设施通过数字化改造升级，信息物理融合系统可以实现全新的体系结构。


    ![](img/70810124a73792907f3adecdd1e14f54_29_2.png)


    # (4) 网络安全技术


    网络安全技术是一种保障网络系统硬件、软件、数据及其服务安全而采取的信息安全技术。制造业向数字化方向的改变，很大程度上依托于工业互联网技术的发展，工业网络的普及也让工厂的网络安全受到威胁，需要利用网络安全技术加以保护。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '一个相对成熟的智能工厂网络安全体系需要包括以下几个方面。


    +   1）一个应对传统信息安全防范问题的子系统。


    +   2）一个应对工控网络安全防范问题的子系统。


    +   3）一个应对物联网安全防范问题的子系统。


    +   4）一个进行全域网络安全监管的信息安全中心。


    # (5) 系统协同技术


    系统协同就是在不同系统之间通过大型制造工程项目自动化系统解决方案进行规划，使在自动化工厂中存在的各种信息管理系统协同操作，实现效益最大化。


    # 2. 智能制造系统


    智能制造系统是一种将互联网、云计算、大数据、人工智能等技术与产品生产管理深度融合，借助计算机模拟人类专家的智能活动，进行分析、推理、判断、构思和决策等，从而取代或延伸制造环境中人的部分脑力劳动，实现生产模式的创新变革，为客户提供工厂可视化和远程运维解决方案的人机一体化智能系统。


    智能制造系统应具备以下特点。


    +   1）自组织性：是指产品生产过程的构建和演化依赖于外界的“特定”干扰，并不断向结构化、有序化和多功能化方向发展，智能制造系统本身的结构和功能也会随着外部环境的变化而“自动”改变，以便快速适应市场对产品的差异化需求，实现产品生产的“超柔性”。


    +   2）自律性：智能制造系统应具备主动收集环境信息和自身信息，并根据信息内容进行分析、判断及规划自身行为的作业能力。从技术发展的角度看，未来的智能制造系统会具备较强的独立性、自主性，更具个性化，并主动参与系统之间的相互协作任务。


    +   3）虚拟现实性：智能制造系统应具备利用数据化手段模拟制造全过程的作业能力，使人们可以直观感受产品的生产过程和质量，并可以根据人们的意图进行变化。目前，这种基于虚拟现实技术的新一代智能化展示形式已经成为智能制造系统的一个显著特点。


    +   4）人机一体化：未来的智能制造系统还应具备良好的人机交互能力，如脑机接口等，使人们能更好地进行产品生产及设备管理。这种人机结合的新一代智能制造系统将进一步提升智能制造的“柔性”。


    基于以上特点，可以把智能制造系统通俗化理解成企业在引入数控机床和工业机器人等生产设备并实现生产自动化的基础上，再搭建一套精密的“神经系统”，如图 1-34
    所示。


    该智能“神经系统”将以 ERP 系统和 MES 等管理软件组成中枢神经；以传感器、嵌入式芯片、RFID 标签和条码等组件为神经元；以 PLC 等为连接控制神经元的突触；以现场总线和工业以太网等通信技术为神经纤维，使企业能够借助完善的“神经系统”感知环境、获取信息和传递指令，以此实现科学决策、智能设计及合理排产，从而大幅度提升设备的使用率并降低设备的运行维护成本。'
