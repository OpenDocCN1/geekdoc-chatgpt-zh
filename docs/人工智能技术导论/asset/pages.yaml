    +   1) 农田水利管护数字地图：在全面完成骨干工程水利名录规划的基础上，对区域内所有水库、山塘、骨干渠道、田间渠道等同步开展摸排，并进行数字地图标注及勘误。

    +   2) “智慧水利”信息化管理平台：集合区域内水利工程基础数据及运行管理数据，通过数据入库、工程上图、视频可控、现场监管等方式，实现水利工程运行维护全过程管理。'
