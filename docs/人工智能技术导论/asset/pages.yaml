    的创新之处主要体现在两个方面：一是发展了强化学习技术；二是在围棋这个平台上将传统的搜索技术与深度学习技术很好地结合，实现了理性与感性的良好融合。


    # 4.2.4 搜索技术应用——移动机器人路径规划


    移动机器人是机器人研究领域的一个热点，用以从事各种生产作业，使工业生产实现高度自动化。如搬运机器人搬运货物，可以替代人类去完成那些繁重、重复性、有害身体健康和具有危险性的工业生产劳动；空间移动机器人被送入宇宙，可以对外太空资源进行探测开发；水下移动机器人可以用于海底探索、海底开发以及水下救生等方面。在未来战争中，移动机器人可以普遍用于排雷、侦查、战斗等众多场合，替代人类完成危险任务。除了工业和军事上的应用，移动机器人也越来越多地应用于人们的日常生活中，如服务式移动机器人，可以服务于清洁卫生、家庭维护、病人护理、商业导购等众多场合。


    移动机器人通过自身携带的各种传感器感知自身状态以及周围环境信息，据此来完成在未知环境中躲避障碍物，实现从一个起始位置到一个目标位置的自主运动。当移动机器人为了完成一项任务进行移动时，必须为如何在周围环境中移动做出一个路径规划。


    移动机器人的路径规划方法主要分为传统的路径规划算法、基于采样的路径规划算法和智能仿生路径规划算法。传统的路径规划算法主要有 A 算法、Dijkstra 算法、D
    算法、人工势场算法等；基于采样的路径规划算法有 PRM 算法、RRT 算法等；智能仿生路径规划算法有神经网络算法、蚁群算法、遗传算法等。'
