    # 3.2.3 知识的表示


    自然语言（natural language）是人类知识表示的主要方法，是交流、协作和传承的基础。


    自然语言是复杂松散的。对于刚刚诞生几十年的计算机来说，目前还没有办法充分理解如此复杂的自然语言。知识表示，是指需要把信息和知识表示为计算机可接受、可理解的一种形式。这种形式通常是一整套符号和规则，即一种数据结构。“知识表示”，作为名词理解，就是一种计算机可以接受的、用于描述知识的数据结构；作为动词理解，就是将知识符号化并输入计算机的过程。


    人工智能从数理逻辑开始，借鉴和创造了一系列的知识表示方法和推理方法，包括命题和谓词逻辑、产生式、框架网络、状态空间、搜索树、语义网络、知识图谱等。下面主要介绍其中的几种基础方法，即命题和谓词逻辑，产生式和知识图谱。


    # 1. 命题和谓词逻辑


    命题和谓词逻辑是源于数学和逻辑学中的一种最早的和最广泛的知识表示方法。它们既是现代计算机科学的基础，也适合用于人工智能中的知识表示。命题可以判断真假，如图
    3-6 所示。


    命题是指具有具体意义的，又能判断它是真还是假的句子。例如，命题“一年有四季”其真值为“真”，记为 T (true)；命题“我发烧 55°C 了”，其真值为“假”，记为
    F (false)。命题逻辑或命题演


    ![](img/70810124a73792907f3adecdd1e14f54_92_0.png)


    图 3-6 命题可以判断真假


    算则是在命题的基础上，研究如何通过一些逻辑符号构成更复杂的命题以及逻辑推理的方法。常用的逻辑连接词如表 3-1 所示。


    # 表 3-1 常用的逻辑连接词


    | 表示符号 | 符号意义 | 举例 | 命题逻辑表示 | 命题逻辑真值 |

    | :--- | :--- | :--- | :--- | :--- |

    | ¬ | 非，否定式 | 十进制数 “10” 不是个整数 (P) | ¬P | F |

    | ∨ | 或，析取式 | 火车要不没到 (P)，要不已经到了 (R) | P∨R | T |

    | ∧ | 与，并且，合取式 | 这种材料硬度很高 (P)，耐热性也很好 (R) | P∧R | T |

    | → | 蕴涵式，生成，如果---那么 | 天空乌云密布 (Q)，可能要下雨了 (P) | Q→P | T |

    | ↔ | 等价式，当且仅当，恒等 | 十进制数 “10” 是个整数等价于十进制数 “10” 是个偶数 | P↔Q | F |


    在命题的基础上发展出了谓词逻辑（predicate logic）。一个简单命题（原子命题）可以分解为实体词和谓词两个部分。例如，命题“燕子是一种鸟”，其中“燕子”是实体词，“是一种鸟”是谓词，表示对实体“燕子”的属性描述。“燕子”是一种实'
