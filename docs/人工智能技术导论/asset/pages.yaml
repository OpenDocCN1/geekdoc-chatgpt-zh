  md: '![](img/70810124a73792907f3adecdd1e14f54_163_0.png)


    # 4. 采样


    机器不能直接识别模拟信号的语音，需要将声波波形转换成计算机能直接识别的二进制数据，完成这一任务的设备是模/数转换器（A/D）。它以每秒上万次的速率对声波进行采样，每一次采样都记录下了原始模拟声波在某一时刻的状态，称之为样本。将一串样本连接起来，就可以描述一段声波，把每秒钟所采样的数目称为采样频率，单位为
    Hz（赫兹）。采样频率越高，所能描述的声波频率就越高。采样频率决定声音频率的范围（相当于音调），可以用数字波形表示。声音的采样与量化如图 7-6 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_163_1.png)


    # 7.2.2 语音识别


    语音识别就是把语音转换成文字。具体来说，是输入一段语音信号，要找一个文字序列（由词或字组成），使得它与语音信号的匹配程度最高，解决机器“听清”的问题。对于不同的语音识别过程，人们采用的识别方法和技术都不尽相同，但其基本原理大致相同，即将经过预处理后的语音信号送入特征提取模块进行特征处理，并利用声学模型和语言模型对语音信号进行解码，然后输出识别结果。语音识别技术主要包括语音特征提取技术、声学模型与模式匹配技术以及语言模型与语义理解技术。语音识别'
