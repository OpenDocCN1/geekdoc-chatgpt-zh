  md: '# ## 8.1 项目描述


    人工智能的优点主要体现在 3 个方面：一是提高效率；二是消除人为错误；三是提供更智能的科技。人工智能以不可逆转的迅猛之势进入人们的生活中，人们可以时刻感受到人工智能带来的便利，深刻感受到人工智能的影响。


    本项目将以人工智能三大核心要素的未来发展趋势为切入点，重点介绍中国在人工智能领域取得的成就并展望人工智能的未来。


    # ## 8.2 知识准备


    # ### 8.2.1 人工智能三大核心要素的发展趋势


    人工智能三大核心要素分别是数据、算法和算力。数据对于人工智能，犹如食材对于美味菜肴；算力对于人工智能，犹如灶台对于美味佳肴；算法对于人工智能，犹如厨师对于美味菜肴。这三者是推动人工智能技术持续发展的源动力，缺一不可。


    # ### 1. 数据的未来


    数据是让计算机获得智能的钥匙。对于人工智能而言，海量数据十分重要，而且需要数据能够覆盖各种可能的场景，这样才能得到一个表现得更智能的训练模型。因为人工智能的根基是训练，就如同人类如果需要掌握某一项技能，就必须经过不断地训练，做到熟能生巧一样。人工智能也是如此，只有经过大量的训练，才能总结出规律，从而应用于新的样本中。


    另一方面，数据管理的发展趋势可以总结为：数量持续增长，以云端集中存储为主，公有云渗透率持续增长。目前，世界互联网用户的基数已达到十亿量级，随着物联网、5G
    技术的进一步发展，会带来更多数据源和传输层面的能力提升，数据的总量将继续快速增长。参考 IDC 的数据报告（见图 8-1），数据总量预计到 2025 年将增长到
    175ZB。


    ![](img/70810124a73792907f3adecdd1e14f54_180_0.png)


    图 8-1 数据增长预测'
