    # 图 1-2 实验室信息管理系统基本架构示例


    3）医学影像信息存储系统（picture archiving and communication system，PACS）是应用在医院影像科室的系统，其基本架构示例如图
    1-3 所示。该系统是把日常产生的各种医学影像（包括核磁、CT、超声、X 光机、红外仪、显微仪等设备产生的图像）通过各类型接口（模拟、DICOM、网络）以数字化的方式进行海量保存，并在需要时能通过授权快速调阅影像资料，同时增加了部分辅助诊断功能的特种信息系统。


    4）医生工作站（doctor workstation，DW），其核心工作是采集、存储、传输、处理和利用病人健康状况和医疗信息。医生工作站是包括门诊和住院诊疗的接诊、检查、诊断、治疗、处方和医疗医嘱、病程记录、会诊、转科、手术、出院、病案生成等全部医疗过程的工作平台。其中，又以门诊医生工作站最为常见，如图
    1-4 所示，它是一个按门诊流程（挂号、候诊、看医生、交费、取药、抽血、化验、检查、治疗等），围绕着医生的诊疗行为而设计开发的信息系统。'
