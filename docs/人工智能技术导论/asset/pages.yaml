  md: '的询问“明天要带伞吗？”蕴含着对话想要了解的信息“时间、地点、天气状况、是否需要带伞”等。自然语言生成系统需要决定哪些信息应该包括在输出文本中，哪些信息不应该包括，如输出信息包含“时间：明天；地点：询问者所在地；天气：下雨；气温
    0~3℃；答：带伞”等。通常情况下，数据中包含的信息比想要通过文本传达的要多，或者数据比想要用文本表达的要详细。


    # (2) 句子规划


    “内容规划”模块为“句子规划”模块提供了最基本的内容，但并没有完全指定输出文本的内容和结构。“句子规划”模块的任务就是进一步明确定义规划文本的细节，如对已规划的如图
    7-2 中的内容，确定输出结构：先说时间，再说地点，然后说天气，最后说结果，即“明天、长沙、下雨、气温 0~3℃，带伞”。


    # (3) 文本实现


    将所有相关的单词和确定的短语组成一个结构完整的句子。如图 7-2 中参考输出句子“您好！长沙明天下雨，气温 0~3℃，需要带伞哦”。自然语言生成工作过程如图
    7-13 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_169_0.png)


    图 7-13 自然语言生成工作过程示意图


    # 7.2.4 语音合成


    语音合成是人机交互的重要一环。语音合成技术又被称为文语转换（text to speech, TTS）技术，可以将任意文字信息转化为流畅标准的语音朗读出来，相当于给机器装上了人工嘴巴。语音合成技术可以改善人机交互困难的情景，尤其是对有身体障碍、只能通过语音来交流的特殊人群，可以使他们和计算机的交流更加方便快捷。


    语音合成技术处理的首要问题是如何把文字数据转变成声音信息，也就是说如何让机器像人类一样说话。但该技术领域所说的“让机器像人类一样说话”与声音回放设备是有本质区别的。声音回放设备比如录音机，它的原理是利用先录制好的音频，然后回'
  merge: -1
  img_proc: true
- pgno: 170
  md: '放该音频来实现“让机器讲话”。这种方法在及时性、传输性、存储、内容等方面有很大的限制因素。利用语音合成技术来实现“让机器讲话”，主要是利用计算机来按照事先设计好的程序及指令人为地制造出不同的词、句子、音节，该技术能够在不限制任何时间和规格的情况下，将文本信息转化成高质量和高自然度的语音。


    语音合成系统有两个组件：前端和后端。前端负责文本分析和语言特征提取，包括分词、句子成分标注、多词歧义消除、韵律结构预测等；后端基于前端的语言特征来生成语音，包括语音参数建模、韵律建模、语音生成等。语音合成过程如图
    7-14 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_170_0.png)


    # 1. 前端处理


    要让一个机器像人一样开口讲话，即使是提供了规范的文本，到语音合成阶段也是一件相当困难的任务，也要经过一系列非常复杂的处理过程。因此，首先要将文本信息进行初步处理，因为输入的文本一般是没有任何上下文信息的，需要通过一定的语法规则、语言学的规律得到合成语音所需的上下文信息。与绝大多数中文信息处理一样，语音合成系统中的文本处理也是从分词开始的。通过分词，才能正确地分析语义，划分语音单元进行注音，也才能合成出更准确的语音来。例如：“我/长大/以后，我的/胳膊/也/变长/了”。第一个“长”应该读“zhang3”（拼音后面的数字代表音调，0-轻声，1-阴平，2-阳平，3-上声，4-去声），第二个“长”应该读“chang2”，否则就无法确定“长”该如何读音。分词处理有两种方法：一种是基于词典匹配法，事先根据专家知识（如电子词典、新华字典等）建立词典的词条，通过词典匹配算法做出字词切分的判断；另一种方法是基于机器学习的方法，此种方法需要对大量的文本进行分词标注，从中抽取特征和所属类别训练模型，使用时对输入文本进行特征抽取后，利用模型判断边界类型，从而实现分词的目的。


    真实文本中含有大量非标准词，这些词在词典中查不到，它们的读音也不能通过正常的拼音规则得到。在中文文本中，非标准词是指包含含非汉字字符（如阿拉伯数字，标点符号、各种特殊符号等）的词，其中的非汉字字符需要转换成对应的汉字，这个转换过程称为文本正则化，是前端处理的重要环节。例如，“2008—2009
    年，我市最低工资水平为￥1200 元/月，同比增长了 8.5%”。在这个句子里，“一”要正则化为“至”'
  merge: -1
  img_proc: true
- pgno: 171
  md: '或“到”，“¥1200 元/月”要正则化为“人民币一千二百元每月”，“8.5%”要正则化为“百分之八点五”。


    # 2. 后端处理


    如果要让计算机合成的语音既显得抑扬顿挫，有节奏感，又轻重缓急，富有感情，就必须进行后端处理；否则，合成出来的语音就会显得机械呆板，让人听起来极不自然，甚至得到相反的信息。一般语音合成技术的前端处理是类似的，不同的语音合成技术的主要区别在于后端处理。前端生成的文本特征输入后端模块，合成相应的语音波形。传统的波形生成方法主要有波形拼接合成和统计参数合成。近些年，一些研究人员将深度学习技术应用到语音合成技术中，使得语音合成技术得到了进一步发展。传统的后端处理流程如图
    7-15 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_171_0.png)


    图 7-15 传统的后端处理流程


    基于波形拼接的语音合成技术首先要构建一个音库，其内容是与单元音节相对应的语音波形，由原始语音按照音节进行切分得到。例如，先将真人语音“我今天学习的是人工智能啊”这一句话拆成单元音节“我”“今”“天”“学”“习”“的”“是”“人”“工”“智”“能“啊”，如果需要让机器说出“我的天啊”，则无须让真人再行录制，直接使用单元音节“我”+“的”+“天”+“啊”拼接即可完成期望的语音输出。具体而言，在音波合成时，首先从输入文本序列中分析出单元音节与进行单元挑选时所需要的韵律信息、声学参数等，然后按照一定的规则，从音库中挑选一些与目标语音相似的候选合成单元开展合成操作。


    在波形拼接语音合成技术研究初期，由于计算机处理能力较差、高质量的音库规模较小以及波形拼接算法性能较差等问题，合成语音的自然度和连续性较差，合成的语音风格较为单一，难以实现定制化语音合成，拼接痕迹比较明显。'
