    # 2. 小而宽数据


    数据是实现人工智能计划的基础。小而宽数据（small and wide data）策略能够实现更强大的分析和人工智能、减少企业机构对大数据的依赖，并提供更丰富、更完整的情境感知。根据
    Gartner 的预测，到 2025 年，70%的企业机构将被迫把重点从大数据转向小而宽数据，这将为分析工具提供更多的上下文并减少人工智能对数据的需求。


    # 3. 神经形态硬件


    神经形态硬件（neuromorphic hardware）旨在用与传统硬件完全不同的方式处理信息，通过模仿人脑构造来大幅提高计算机的思维能力与反应能力。采用多进制信号来模拟生物神经元的功能，可将负责数据存储和数据处理的元件整合到同一个互联模块当中。从这个意义上说，这一系统与组成人脑的数十亿计的、相互连接的神经元颇为相似。神经形态硬件能够大幅提升数据处理能力和机器学习能力，能耗和体积却要小得多，从而为人工智能的未来发展提供强大的算力支撑。


    # 4. 智能机器人


    智能机器人（intelligent robot）需要具备 3 个基本要素：感觉要素、思考要素和反应要素。感觉要素是利用传感器感受内部和外部信息，如视觉、听觉、触觉等；思考要素是根据感觉要素所得到的信息，思考应采用什么样的动作；反应要素是对外界做出反应性动作。智能机器人的关键技术包括多传感器信息融合、导航与定位、路径规划、智能控制等。考虑到硬件设施计算速度不够、传感器种类不足，以及无法编程实现机器人思考行为等，即使社会发展需求和机器人应用行业范围在扩大，机器人可具备的智能水平也并未达到其上限。


    # 2.3 项目实施


