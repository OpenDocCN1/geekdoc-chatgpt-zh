  md: '# 6. 信息化时代


    信息化的概念起源于 20 世纪 60 年代的日本。1997 年，我国召开的首届全国信息化工作会议对信息化给出了官方定义：“信息化是指培育、发展以智能化工具为代表的新的生产力并使之造福于社会的历史过程”。信息化技术是以现代通信、网络、数据库技术为基础，将所研究对象各要素汇总至数据库，与人类息息相关的各种行为相结合的一种技术，使用该技术后，可以极大提高各种行为的效率，并且降低成本，为推动人类社会进步提供技术支持。


    一般来说，信息化时代包含信息化、数字化和智能化几个阶段。其中，信息化是基础，数字化是过程，智能化是目标。管理信息系统（management information
    system，MIS）、办公自动化（office automation，OA）、产品数据管理（product data management，PDM）等软件系统，都是信息化的典型应用。这些典型应用在运行过程中会产生实时、准实时或者历史的数据，人们可以做出全面和客观的判断与决策，而不用再像过去那样依靠个人直觉和经验。像这种数据采集、加工和利用的过程可以称为“数字化”。


    智能化，典型的理念就是以数字化为基础，通过大数据、人工智能等技术让数据自动计算，实现人工智能一般的控制与自我管理。智能化强调的是复杂信息的处理，让人工智能更多地代替人的脑力活动。在半导体微处理基础上诞生的智能化工具，超越了生产领域、经济领域，全面影响着人类社会生活，其生产力结构从“劳动者+机械化工具”变成了“管理者+智能化工具”。如今，个人、家庭的生活、学习等都融合在一个以智能手机为中心的生态体系之中。国家、政府、企业的运行、管理、市场营销与物联网、云计算、大数据、区块链紧紧相依。百姓生活在一个人工智能无处不在的智慧社区、智慧城市之中，充分享受智慧医疗、智慧家居、智能出行带来的便利。即使遭遇地震这样的天灾，人们依靠智能手机、无人机、GPS、生命探测仪机器人等智能化工具，以及
    5G、边缘计算等技术，也能将灾害损失降到最低。


    越来越多的信息表明，人工智能已进入技术创新和大规模应用的高潮期、智能企业的开创期和智能产业的形成期，人类正在加速进入智能化时代。让我们一起通过这门课程触摸人工智能，体验人工智能带给我们的种种便利。


