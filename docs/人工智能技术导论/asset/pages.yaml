    # 3. 图像的预处理


    在计算机视觉进行分析的过程中，图像质量的好坏直接影响识别算法的设计与效果的精度，因此在图像分析（特征提取、分割、匹配和识别等）前，需要对图像进行预处理。图像预处理的主要目的是消除图像中无关的信息，恢复有用的真实信息，增强有关信息的可检测性，最大限度地简化数据，从而改进特征提取、图像分割、匹配和识别的可靠性。一般的预处理流程有灰度化、几何变换、图像增强等。


    对彩色图像进行处理时，需要对 3 个通道依次进行处理，时间开销将会很大。为了达到提高整个应用系统的处理速度的目的，需要减少所需处理的数据量，因此会对图像进行灰度化，在
    RGB 模型中，如果 R=G=B 时，则彩色表示一种灰度颜色，其中 R=G=B 的值叫灰度值，因此，灰度图像每个像素只需一个字节存放灰度值（又称强度值、亮度值），灰度范围为
    0～255。一般有分量法、最大值法、平均值法、加权平均法等方法对彩色图像进行灰度化。例如，最大值法就是将彩色图像中的三分量中亮度的最大值作为灰度图的灰度值，而平均值法是将彩色图像中的三分量亮度求平均得到一个灰度值。


    如果需要进一步对灰度图像进行简化，还可以将灰度图像转化为二值化图像，此过程简称为二值化。二值化就是将图像上的像素点的灰度值设置为 0 或 255，也就是将整个图像呈现出明显的黑白效果的过程。


    在计算机视觉中，一般用矩阵来表示图像。也就是说，无论图片看上去多么好看，对计算机来说都只不过是个矩阵而已。在这个矩阵中，每一个像素就是矩阵中的一个元素。在三通道的彩色图像中，这个元素是由
    3 个数字组成的元组。对于单通道的灰度图像来说，这个元素就是一个数字，这个数字代表了图像在这个点的亮度，数字越大，像素点'
