    # (2) 智能制造系统的神经突触


    工业控制计算机（见图 1-37）和 PLC（见图 1-38）都是由 CPU、存储器、输入/输出（input/output, I/O）单元、外设 I/O 接口、通信接口及电源共同组成的，能够根据实际控制对象的需要配备编程器、打印机等外部设备，具备逻辑控制和逻辑编程功能，能够完成对各类机械电子装置的控制任务。特别是
    PLC，因为体形小巧，具有可靠性高、易于编程、组态灵活、安装方便、运行速度快等特点，不仅成为机械装备和生产线的控制器，还成为生产线数据的采集器和转发器，类似于神经系统中的“突触”，一方面可以收集、读取设备状态数据并反馈给上位机[数据采集与监视控制（SCADA）系统或分布式控制系统（distributed
    control system, DCS）]，另一方面可以接收并执行上位机发出的指令，直接控制现场层的生产设备。


    # (3) 智能制造系统的神经元


    在智能制造“神经系统”中，担任神经元角色的是与物料、在制品、生产设备、现场环境等物理环境直接接触的传感器（见图 1-39）、RFID 标签及条码等组件。传感器能感受到被测量的信息，并能将感受到的信息变换成为电信号或其他所需形式的信息输出，传感器使智能制造系统有了触觉、味觉和嗅觉等感官。RFID
    标签具有读取快捷、批量识别、实时通信、重复使用和可动态更改等特点，与智能制造的需求极为契合。通过 RFID 技术，企业可以将物料、刀具、在制品、成品等一切附有
    RFID 标签的物理实体纳'
