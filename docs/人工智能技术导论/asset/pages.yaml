    推理机构成。规则库即由产生式规则组成的、相关领域的知识库；综合数据库中存储了已知事实、问题的初始值、最终的推理结论和推理的中间过程；推理机包含了一组计算机程序，进行推理的执行和策略控制。


    产生式系统的基本运行流程为，在产生式规则内，某一产生式生成的结论供另一个产生式作为已知事实使用，使用推理机不断进行产生式和事实的迭代，最终使用以求得问题的解，并存储在综合数据库中。产生式系统的架构如图
