    3 种颜色的颜料以一定的比例混合便能产生需要的颜色，每个彩色图像都是由这 3 种颜色或 3 个通道（红色、绿色和蓝色）组成的，这意味着在彩色图像中，矩阵的数量或通道的数量将会更多。在如图
    6-12 所示的彩色图像中，有 3 个矩阵：1 个红色矩阵，称为红色通道；1 个绿色矩阵，称为绿色通道；1 个蓝色矩阵，称为蓝色通道。这些像素都具有 0～255
    的值，其中每个数字代表像素的强度，或者可以说红色、绿色和蓝色的阴影。最后，所有这些通道或所有这些矩阵都将叠加在一起，这样当图像的形状加载到计算机中时，它会是各种不同的颜色了。以狗的彩色图片为例，3
    个通道的数据叠加起来，在计算机中用 3 个数字矩阵存储，在显示器中叠加显示便成了一幅彩色图片，'
