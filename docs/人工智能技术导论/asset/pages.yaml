    用一个带有小孔的板遮挡在墙体与物体之间，墙体上就会形成物的倒立的实像，这种现象叫小孔成像，如图 6-9 所示。前后移动中间的板，墙体上像的大小也会随之发生变化，这种现象说明了光沿直线传播的性质。


