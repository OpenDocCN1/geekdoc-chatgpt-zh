  md: '# 2.1 项目描述


    在计算机出现之前，人们就幻想着有一种机器或者程序可以实现人类的思维，可以帮助人类解决问题，甚至比人类有更高的智力。这些年来，得益于人工智能这门计算机科学分支的螺旋式发展，如今这种设想已逐渐成为现实，比如线上购物有电商智能购物推荐，自动辅助驾驶也发展到
    L3 等级（在特定的环境下可以独立完成操作驾驶）等。回顾人工智能 60 多年的发展历史，人工智能已在机器人、语音识别、图形识别、自然语言处理和专家系统等各个研究领域实现了广泛而成熟的应用。


    本项目将以人工智能发展历史作为切入点，重点介绍人工智能研究领域的划分、发展方向等相关知识（如人工智能、机器学习与深度学习之间的关系等），以便读者了解人工智能的基本概念及发展史，并熟悉人工智能的基本术语。


    # 2.2 知识准备


    # 2.2.1 人工智能溯源与发展史


    从 20 世纪 50 年代开始，众多程序员和不同学科的科学家就加入了人工智能领域的研究，从不同角度帮助和巩固了当代人类对人工智能思想的整体理解。虽然人工智能在发展过程中出现过几次寒冬期，但随着科技进步和经济环境的改善，历史进步的车轮不断推动着人工智能从一个无法实现的幻想变为现实。


    +   1. 起源（1956～1964 年）


    1956 年 8 月，在美国汉诺斯小镇宁静的达特茅斯学院中，麦卡锡·约翰（McCarthy John）、明斯基·马文（Minsky Marvin，人工智能与认知学专家）、香农·克劳德（Shannon
    Claude，信息论的创始人）、司马贺（诺贝尔经济学奖得主）、纽厄尔·艾伦（Newell Allen，计算机科学家）等科学家聚在一起，讨论用机器来模仿人类学习以及其他方面的智能，如图
    2-1 所示。他们讨论了很久，始终没有达成共识，却为讨论内容起了一个名字——人工智能。自此，人工智能开始进入人们的视野，1956 年也就成为人工智能元年。


    达特茅斯会议之后，人工智能获得了井喷式的发展，好消息接踵而至。1955～1964 年，人工智能进入快速发展时期，在机器学习领域出现了“跳棋程序”，该程序在
    1959 年打败了它的设计师塞缪尔·阿瑟（Samuel Arthur），随后在 1962 年，打败了当时全美最强的西洋跳棋选手之一罗伯特·尼雷（Robert
    Nealey）。在模式识别领域，1956 年，塞弗里奇·奥利弗（Selfridge Oliver）研发了第一个字符识别程序，开辟了模式识别这一新领域。在此基础上，1963
    年斯拉格·詹姆斯（Slagle James）发表了符号积分程序'
