- pgno: 34
  md: '# (4) 智能制造系统的神经纤维


    工业通信网络种类繁杂，企业在日常经营过程中，在研发、计划、生产、工艺、物流、仓储和检测等各个环节都会产生大量数据，要让海量数据在智能制造“神经系统”内顺畅流转，就要综合利用现场总线、工业以太网等各类工业通信网络建立一套健全的神经纤维网络。工业通信网络总体上可以分为有线通信网络和无线通信网络。


    有线通信网络主要包括现场总线、工业以太网、工业光纤网络和时间敏感网络（time sensitive networking，TSN）等。现阶段工业现场设备数据采集主要采用有线通信网络，以保证信息实时采集和上传，满足对生产过程实时监控的需求。


    无线通信网络正逐步向工业数据采集领域渗透，是有线通信网络的重要补充。目前，无线通信网络技术包括短距离通信技术（RFID、ZigBee 和 Wi-Fi 等），主要用于在车间或工厂内的传感器数据读取、物品及资产管理和移动机器人（automated
    guided vehicle，AGV）等设备的网络连接；专用工业无线通信技术（WIAPA、WirelessHART 等）以及峰窝无线通信技术（4G/5G）等，主要用于工厂外智能产品、大型远距离移动设备、手持终端等的网络连接。


    # (5) 智能制造系统的躯干及四肢


    智能制造装备是智能制造系统的躯干及四肢。它是指具有感知、分析、推理、决策、控制功能的制造装备，是先进制造技术、信息技术和智能技术的集成和深度融合。目前，智能制造装备的两大核心是数控机床与工业机器人。


    数控机床（见图 1-40）是一种装有程序控制系统的自动化机床，该控制系统能够逻辑地处理具有控制编码或其他符号指令并规定的程序，并将其译码通过信息载体输入数控装置。数控机床的控制系统通过运算处理由数控装置发出的各种控制信号来控制机床，按图纸要求的形状和尺寸自动地将零件加工出来，能够较好地解决复杂、精密、小批量、多品种的零件加工问题。工业机器人是面向工业领域的多关节机械手或多自由度的机器装置，它可以接受人类指挥，也可以按照预先编排的程序运行。


    ![](img/70810124a73792907f3adecdd1e14f54_34_0.png)


    图 1-40 数控机床


    工业机器人（见图 1-41）在汽车制造、电子设备制造等领域应用广泛，有点焊机器人、弧焊机器人、搬运/码垛机器人、装配机器人等多种类型，能够高效、精准、持续地完成焊接、涂装、组装、物流、包装、检测等工作。'
