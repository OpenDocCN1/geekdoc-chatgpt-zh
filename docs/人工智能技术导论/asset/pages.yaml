  md: '保护之下，并在人工智能系统的整个生命周期内予以保障。


    +   6）人类的监督和决定原则。在人工智能系统的全生命周期内始终受到人类的监督。


    +   7）透明度和可解释性原则。在人工智能系统的整个生命周期内都要努力提高系统的透明度和可解释性，以确保人权、基本自由和伦理原则得到尊重、保护和促进。


    +   8）责任和问责原则。要确保人工智能系统的运行可审计和可追溯，人工智能行为者对利用人工智能系统做出的任何决定和行动都应该承担相应的伦理责任和法律责任。


    +   9）认识和素养原则。应通过由政府、政府间组织、民间社会、学术界、媒体共同领导和促进公众对于人工智能技术和数据价值的认识和理解，确保公众的有效参与，让所有社会成员都能够就使用人工智能系统做出知情决定，避免受到不当影响。


    全球一系列关于人工智能伦理的准则和指南，对人工智能的技术发展和社会应用将起到重要作用。除了 2021 年联合国教科文组织发布的《人工智能伦理问题建议书》之外，德国
    2017 年公布了《自动化和网联化车辆交通伦理准则》，规定当车辆出现问题不可避免要产生碰撞时，在人与动物之间，选择撞向动物；在动物和没有生命的物体之间，选择后者。2021
    年，我国科技部国家新一代人工智能治理专业委员会发布了《新一代人工智能伦理规范》，针对人工智能提出了包括透明性和可解释性在内的多项伦理要求；中国国家互联网信息办公室等九部门联合发布的《关于加强互联网信息服务算法综合治理的指导意见》将“透明可释”作为算法应用的基本原则。在人工智能透明度和可解释性的基础上，这些人工智能的伦理问题才有可能被人们所认识、评估和修正。


    # 利用人工智能修复敦煌壁画，为中华文化的传承保驾护航


    敦煌壁画是古代人类文明艺术的结晶，凝聚着世界文明的精髓，蕴含着丰富的历史文化精神，对相关文物进行保护具有十分重要的意义。然而，敦煌石窟在经历千余年的沧桑岁月后，其壁画也受到了不同程度的损坏。“敦煌莫高窟每存在一天，就更接近消失一天”，时间流逝带来的自然褪色、风沙等都会对壁画带来不可逆的伤害。


    敦煌壁画现保存了十六国至元代的壁画共 4 万多平方米，人工修复壁画的过程极其繁复庞大，从前期拍摄，到图像处理、导出、CAD 绘图，一个 10 平方米的壁画，按照一个工作人员的工作量计算，大约需要
    96 小时才能完成。


    利用数字化图像修复技术对敦煌壁画实现虚拟修复保护，是目前图像处理和计算机视觉领域的重要研究热点之一。腾讯通过深度学习敦煌壁画病害数据，形成了一整套自动识别并添加图示的算法，对壁画进行“对症下药”。虽然通过深度学习对壁画进行诊断还处于发展阶段，但在识别壁画残损、颜料脱落上已经有了不错的成效。


    在未来，人工智能技术还可能运用到洞内的其他文物上，对这些文物进行数字化的采集与呈现，让人们足不出户就可以“云游敦煌”。当古老壁画遇见新兴科技，它们之间碰撞出的火花就是中华文化迸发的巨大生命力。这也让人们进一步看到了前人未曾达到过的、被重新定义的将来。'
