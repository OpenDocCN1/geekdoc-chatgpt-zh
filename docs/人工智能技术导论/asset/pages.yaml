    # ## 2.2.3 人工智能与计算机科学


    # ### 1. 人工智能的定义


    人工智能按照名词可以拆分为“人工”和“智能”两个部分。


    通常来说，“人工”一词的意思是合成的，即人造的。一部分人认为，人造物体的品质不如自然物体。实际情况是，人造物体通常优于自然物体，比如，蜡烛、电灯泡产生的人造光相比较只有白天才具有的太阳光，人造光可以随时提供光源。另一部分人则认为，人造物体的品质必然优于自然物体，比如人工交通装备（如火车、汽车、飞机和自行车等）与跑步、步行及其他自然形式的交通（如骑马）相比，在速度和耐久等方面具有巨大的优势，但也有显著的缺点，如使用过程中会带来尾气污染等问题。由此可知，人工智能是人造的，并且也具有两面性。


    “智能”对人们来说是一个既熟悉又陌生的词汇。熟悉的是，智能天天发生在我们身边；陌生的是，如何来准确地定义它和衡量它。2016 年，由“走向智能丛书”的创始策划编委胡虎、赵敏、宁振波等九位专家合作撰写的《三体智能革命》一书指出，智能本质是一切生命系统对自然规律的感应、认知与运用。2018
    年，工业和信息化部原副部长、北京大学教授杨学山在其所撰写的《智能原理》一书中也对智能进行了描述：智能是主体适应、改变、选择环境的各种行为能力。


    因此，对于人工智能的定义，本书采用《人工智能：一种现代的方法（第 3 版）》中对人工智能的解释，像人一样思考的系统，像人一样行动的系统，理性思考的系统，理性行动的系统，如图
    2-7 所示。这里“行动”应广义地理解为采取行动或制定行动的决策，而不是肢体动作。


    +   理性思考的系统

    +   像人一样思考的系统

    +   - 自主学习

    +   - 推理演算

    +   - 人工意识

    +   - 知识表达


    ![](img/70810124a73792907f3adecdd1e14f54_74_1.png)


    +   理性行动的系统

