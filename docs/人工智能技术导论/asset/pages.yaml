    # 5.3 项目实施


    # 5.3.1 案例鉴赏：应用于智能制造中的机器学习


    +   1. 机器学习在数字孪生技术领域的应用


    数字孪生（digital twin）目前是智能制造领域的技术热点之一，是指充分利用物理模型、传感器、运行的历史数据等，在数字世界实现物理实体的镜像，即建立一个与真实物理实体高度契合的数字化模型。如生产线上要实现数字孪生，首先要以真实生产线为基础，搭建一条虚拟生产线，通过对真实生产线上每一台设备进行三维建模，并将三维模型放置到虚拟生产线场景内，实现真实生产线与虚拟生产线一一对应，然后进行数据同步，如使用传感器采集真实生产线上的
    PLC 数据，来驱动虚拟环境下的设备模型，实现真实设备与虚拟设备的实时联动。


    机器学习引入数字孪生领域，通过对生产线历史数据的学习，了解、掌握生产线运转规律，然后根据掌握的运转规律对虚拟生产线与真实生产线的联动数据进行分析，并根据分析结果对生产线现状做出预测，从而帮助建立智能化的数字模型。监控人员坐在监控室内，就可以通过观察、监控虚拟生产线，了解真实生产线的实时工作状态。如在人员管理方面，在监控室可以直观地看到车间里的人是否在自己的工位上，在执行什么任务等，通过对历史数据的学习和对实时数据进行分析判断，了解其工作效率等；在设备管理方面，在监控室可以看到整个车间的设备运行状况，通过对实时数据的分析，可以准确预测设备的运行状态，并通过三维可视化手段直观地表现出来，非常方便管理人员排查隐患；在能源管理方面，在监控室可以看到整合出的整个车间的消耗，如焊条、刀具、润滑油等耗材'
  merge: -1
