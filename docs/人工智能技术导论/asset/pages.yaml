    # 4. 支付方式


    随着科技的发展，目前支付方式已经变得更加便捷化。在付款端，指纹识别、声纹识别、人脸识别等生物识别技术正逐步应用于支付用户的身份认证和指令识别环节；在收款端，大数据、云计算、人工智能和区块链等技术的广泛应用，促使支付与场景深度结合。目前，支付方式便捷化主要体现在以下几个方面。


    # (1) 基于移动支付技术实现交易便捷化


    随着 5G 时代的到来，移动支付已成为广大民众获取基础性金融服务的重要渠道，进一步扩大了普惠金融的服务范围，激发了支付清算行业创新发展的活力。移动支付发展迅猛，以云闪付、支付宝、微信支付等为代表的中国支付品牌，正在推动中国移动支付业务模式、标准规范、系统平台、应用场景等逐渐走向海外。


    # (2) 利用云计算技术实现企业经营轻量化


    随着云计算、大数据、人工智能在金融云领域的运用，通过对信息价值的挖掘，可以优化企业要素资源配置，实现企业价值的最大化。分布式云架构（见图 1-63）具有低延迟、低数据成本和数据驻留安全等优点，能帮助支付系统实现资源弹性扩容，大大缩短应用部署时间，实现故障自动检测、业务升级不中断，从而能更好地适应“互联网+金融”的服务模式。


