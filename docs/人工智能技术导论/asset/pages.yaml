- pgno: 142
  md: '# 6.1 项目描述


    计算机视觉是一门“教”会计算机如何去“看”世界的学科。形象地说，就是给计算机安装上眼睛（相机）和大脑（算法），让计算机能够感知环境。具体来说，计算机视觉是使用计算机及相关设备对生物视觉的一种模拟，用各种成像设备代替视觉器官作为输入手段，用计算机来代替大脑完成处理和解释，最终研究目标就是使计算机能像人那样通过视觉观察和理解世界，并且具有自主适应环境的能力。


    由于计算机视觉系统可以快速获取大量信息，而且易于自动处理，也易于与设计信息以及加工控制信息集成，因此，在现代自动化生产过程中，人们将计算机视觉系统广泛地用于工况监视、成品检验和质量控制等领域。计算机视觉系统的特点是可以提高生产的柔性和自动化程度。在一些不适合人工作业的危险工作环境或人工视觉难以满足要求的场合，常使用计算机视觉系统来替代人工视觉；同时，在大批量工业生产过程中，用人工视觉检查产品质量效率低且精度不高，用计算机视觉检测方法可以大大提高生产效率和生产的自动化程度，而且计算机视觉易于实现信息集成，是实现计算机集成制造的基础技术。


    本项目从计算机视觉的发展、应用以及图像处理的基础知识出发，介绍计算机视觉相关案例，使读者对计算机视觉有全面了解。


    # 6.2 知识准备


    # 6.2.1 计算机视觉简介


    计算机视觉是一门研究如何使机器“看”的学科，更进一步地说，就是研究如何用摄影机和计算机代替人眼对目标进行识别、跟踪和测量等。计算机视觉研究相关的理论和技术，试图建立能够从图像或者多维数据中获取“信息”的人工智能系统。计算机视觉随着人工智能发展变得更加智能，从早期的对图像简单处理，到现在应用人工智能使得机器能理解图像与视频的内容。计算机视觉的行业应用也逐渐落地，国内外相关应用层出不穷。我国作为制造业大国，计算机视觉在工业领域的应用发展非常迅速。典型的计算机视觉系统如图
    6-1 所示。


    +   1. 计算机视觉的发展历程


    计算机视觉发展经历了 20 世纪 70 年代的数字图像处理时期；80 年代和 90 年代，随着计算机硬件水平的进一步提高，计算机视觉的诸多处理算法开始得到发展与应用；到
    21 世纪，计算机视觉与机器学习、深度神经网络相融合，其应用更加广泛、更加智能。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/70810124a73792907f3adecdd1e14f54_143_0.png)


    图 6-1 典型的计算机视觉系统


    # (1) 20 世纪 70 年代


    计算机视觉始于 20 世纪 70 年代早期，它被视为模拟人类智能并赋予机器人智能行为感知的组成部分。当时，人工智能和机器人的一些早期研究者（如麻省理工学院、斯坦福大学、卡内基梅隆大学的研究者）认为，在解决高层次推理和规划等更困难问题的过程中，解决“视觉输入”应该是一个简单的问题。随着研究者对“视觉输入”问题的研究，发现要让机器能像人一样看懂并非简单问题，麻省理工学院人工智能实验室此时便开设了课程《计算机视觉》，如图
    6-2 所示，讲授当时较为前沿的计算机视觉知识。


    ![](img/70810124a73792907f3adecdd1e14f54_143_1.png)


    图 6-2 麻省理工学院开展计算机视觉课程


    计算机视觉期望从图像中恢复出实物的三维结构并以此得出完整的场景理解。场景理解的早期尝试包括物体的边缘抽取及随后的从二维线条的拓扑结构推断其三维结构，使得当时边缘检测成为一个活跃的研究领域。


    那时也出现了一些更定量化的计算机视觉方法，包括基于特征的立体视觉对应算法和基于亮度的光流算法，同时，关于恢复三维结构和相机运动的研究工作也开始出现。


    该时期的重大进展是大卫·考特尼·马尔（David Courtnay Marr）提出了其关于（视觉）信息处理系统表达的三个层次，他认为信息处理系统应该被理解为三个独立而互为补充的层次。


    +   1) 计算层：系统做些什么事情（例如解决什么问题）以及为什么要做这些事情。

    +   2) 算法层：如何做这些事情，特别是如何表征以及做什么样的处理来建立和操作'
  merge: -1
  img_proc: true
- pgno: 144
  md: '这些表征。


    +   3) 实现层：物理上如何实现（在生物视觉中就是什么神经结构和神经元活动实现了视觉系统）。


    # （2）20 世纪 80~90 年代


    20 世纪 80 年代，逻辑学和知识库等理论在人工智能领域占据了主导地位。人们试图建立专家系统来存储先验知识，然后与实际项目中提取的特征进行规则匹配，这种思想也同样影响了计算机视觉领域，于是诞生了很多这方面的方法。图像金字塔和尺度空间开始广泛用于由粗到精的对应点搜索。在
    80 年代后期，在一些应用中小波变换开始取代图像金字塔。这一时期，探寻更准确的边缘和轮廓检测方法是一个活跃的研究领域，其中包括动态演化轮廓跟踪器的引入。另外，伴随着统计学理论在人工智能中的逐渐“走红”，学者们利用统计学手段来提取物体的本质特征描述，而不是由人工去定义这些规则。这一时期产生的多种基础理论直到现在还有广泛的应用，例如图像搜索引擎。


    # （3）21 世纪


    21 世纪，计算机视觉与计算机图形学之间的交叉越来越明显，特别是在基于图像的建模和绘制这个交叉领域。另外，计算摄像学发挥出越来越重要的作用，包括光场获取和绘制以及通过多曝光实现的高动态范围成像。目标识别中基于特征的方法（与学习方法相结合）日益凸显，更高效的复杂全局优化问题求解算法也得到了发展。


    2010 年之后，卷积神经网络（convolutional neural networks，CNN）大放异彩。卷积神经网络是一类包含卷积计算且具有深度结构的前馈神经网络（feedforward
    neural networks），是深度学习（deep learning）的代表算法之一。卷积神经网络具有表征学习能力，能够按其阶层结构对输入信息进行特征提取后分类，因此卷积神经网络使得计算机视觉朝着更加智能化的方向演进。


    # 2. 中国计算机视觉行业发展现状与未来展望


    # （1）中国计算机视觉行业起步晚，目前处于快速成长期


    我国计算机视觉行业源于 20 世纪 90 年代的第一批技术引进。自 1998 年众多电子和半导体工厂落户广东和上海开始，计算机视觉生产线和高级设备被引入我国，诞生了国际计算机视觉厂商的代理商和系统集成商。我国计算机视觉行业发展主要经历了以下
    3 个阶段：


    第一个阶段是 1999～2003 年的启蒙阶段。这一阶段我国企业主要通过代理业务对客户进行服务，在服务的过程中引导客户对计算机视觉的理解和认知，借此开启了我国计算机视觉的历史进程。


    第二个阶段是 2004～2007 年的发展阶段。这一阶段我国企业开始起步探索由更多自主核心技术承载的计算机视觉硬硬件的研发，在多个应用领域取得了关键性的突破。


    第三个阶段是 2008 年以后的高速发展阶段。这一阶段众多计算机视觉核心器件研发厂商不断涌现，一大批真正的系统级工程师被不断培养出来，推动了我国计算机视觉行业的高速、高质量发展。


    # （2）市场规模逐年扩张，年均复合增长率较大


    近十年来，计算机视觉技术在工业领域的应用日趋广泛。随着计算机视觉技术与产'
