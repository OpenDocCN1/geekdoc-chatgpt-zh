    # 5. 计算机视觉在无人驾驶场景中的应用


    想要完全实现无人驾驶，还有很长的一段路要走，但利用计算机视觉技术，汽车驾驶辅助的功能及应用会越来越多。随着技术的发展，计算机视觉可以解决更加复杂的问题，比如完成道路的识别，从而辅助人类更好、更安全地驾驶。未来，无人驾驶会像人类驾驶一样安全和快捷。计算机视觉在无人驾驶场景的应用示例如图
    6-8 所示。


