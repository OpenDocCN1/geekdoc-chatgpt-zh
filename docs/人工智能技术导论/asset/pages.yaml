    # 1.2.3 体验人工智能技术在智能制造领域的应用


    制造业是指机械工业时代将某种资源（如物料、能源、设备、工具、资金、技术、信息和人力等），按照市场要求，通过制造过程，转化为可供人们使用的工业产品与生活消费产品的行业。制造业直接体现了一个国家的生产力水平，是区别发展中国家和发达国家的重要因素，其在发达国家的国民经济中占有重要份额。


    智能制造源于人工智能的研究，是一种由智能机器和人类专家共同组成的人机一体化智能系统，它在制造过程中能进行智能活动，诸如分析、推理、判断、构思和决策等。随着产品性能的完善，结构的复杂化、精细化以及功能的多样化，促使产品所包含的设计信息和工艺信息量猛增，随之生产线和生产设备内部的信息流量增加，制造过程和管理工作的信息量也必然剧增，因而促使制造技术发展的热点与前沿转向了提高制造系统'
