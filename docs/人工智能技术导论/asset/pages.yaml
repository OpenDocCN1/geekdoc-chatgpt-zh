  md: '# 2. 人工智能研究学派和研究领域划分


    首先人工智能既是计算机科学的一个分支，又是一个融合了多种学科的交叉学科，随着不同学科背景的研究人员对人工智能的研究，基于各自理论的认知，产生了三大主流学派，如图
    2-8 所示。传统的人工智能研究被称为符号主义学派，符号主义主要研究的是基于逻辑推理的智能模拟方法；而一些人则认为可通过模拟大脑的神经网络结构来实现人工智能，即连接主义学派；此外，还有人认为可以从生物体与环境互动的模式中寻找答案，被称为行为主义学派。


    ![](img/70810124a73792907f3adecdd1e14f54_75_0.png)


    图 2-8 人工智能三大学派


    # (1) 符号主义学派


    符号主义学派认为任何能够将某些模式或符号进行操作并转化成另外一些模式或符号的系统就可能产生智能行为，其实质就是模拟人脑的抽象逻辑思维，并通过某种符号来描述人类的认知过程，从而实现人工智能。符号主义主要集中在人类智能的高级行为，如知识表示、知识图谱等。


    # (2) 连接主义学派


    连接主义学派认为每个人的大脑都有万亿个神经元细胞，它们错综复杂地互相连接，也被认为是人类智慧的来源。因此，人们很自然地想到能否通过大量神经元来模拟大脑的智力。连接主义学派认为神经网络和神经网络间的连接机制和学习算法能够产生智能。


    # (3) 行为主义学派


    行为主义学派的出发点与其他两个学派完全不同，该学派研究的是一种基于感知行动的行为智能模拟方法。该学派认为行为是个体用于适应环境变化的各种身体反应的组合，它的理论目标在于预见和控制行为。


    在各学派学者的研究下，划分了图搜索、自动推理、不确定性推理、符号学习、知识工程、神经计算、进化计算、免疫计算、蚁群计算、归纳学习、模式识别、统计学习、'
