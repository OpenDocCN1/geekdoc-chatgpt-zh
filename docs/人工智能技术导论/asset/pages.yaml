    如何使用谓词逻辑来实现一个简单的问答系统？例如，向问答系统提出问题：“燕子是一种能飞在天上的鸟吗？”谓词逻辑是如何进行求解的？问答系统程序推理的步骤如下。


    +   1) 对输入的问题文本进行预处理，提取其中的实体（燕子，天上）和谓词（能飞在天上，一种鸟）。

