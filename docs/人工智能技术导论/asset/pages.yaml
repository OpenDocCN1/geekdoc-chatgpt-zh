    # 5. 蒙特卡洛树搜索算法


    蒙特卡洛树搜索（Monte Carlo tree search，MCTS）算法是一种用于决策的启发式搜索算法。


    蒙特卡洛树搜索算法的设计思路是模拟下棋过程。下棋时，棋手并没有在脑海中把所有可能的走子方法列出来，而是根据棋感在脑海中大致筛选出几种最可能的走法，然后思考走了这几种走法之后对手最可能的走法，再思考自己接下来最可能的走法。


    这个过程可以分解为 4 个子过程：选择（selection）、扩展（expansion）、模拟（simulation）和回溯（backpropagation）。


    按照设计思路，假定模拟 21 局棋，其中胜局为 12，把各个不同的棋局及落子策略作为蒙特卡洛树的节点，每个节点有两个值，代表这个节点以及它的子节点模拟的次数和赢的次数，比如模拟了
    10 次，赢了 4 盘，记为 4/10，构建的蒙特卡洛树如图 4-8 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_116_0.png)


    图 4-8 蒙特卡洛树


    # (1) 选择


    从根节点开始，根据 UCT 函数选择一个最有潜力的子节点，向下搜索，直到找到一个还有可扩展的子节点（还没模拟过所有的对手行动的节点），UCT 函数的定义如下：


    \(\text{UCT}(v_i, v) = \frac{Q(v_i)}{N(v_i)} + c \sqrt{\frac{\log(N(v))}{N(v_i)}}\)


    其中，\(v_i\) 表示当前节点；\(v\) 表示 \(v_i\) 的父节点；\(Q(v_i)\) 表示 \(v_i\) 节点赢的次数；\(N(v_i)\)
    表示该节点模拟的次数；\(C\) 是一个常数。


    # (2) 扩展


    扩展是对可拓展的节点进行的，即随机添加一个新的子节点。例如，将刚刚选择的节点加上一个统计信息为 “0/0” 的节点，然后进入下一步模拟。


    # (3) 模拟


    模拟是对上一步扩展出来的子节点进行一次模拟游戏，双方随机下子，直到分出胜负。


    # (4) 回溯


    从扩展出来的子节点向上回溯，更新所有父节点的参数，即获胜次数和被访问次数。蒙特卡洛树搜索算法的搜索过程如图 4-9 所示。'
