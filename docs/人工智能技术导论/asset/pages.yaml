    # 3. 医疗机器人


    医疗机器人是集医学、机器人、人工智能、生物力学、材料学、计算机图形图像等诸多学科为一体的新型交叉研究领域的重要成果。医疗机器人除包括机器人的基础理论和关键技术，还包括机器人构型设计优化技术、运动模型、驱动技术、自动控制技术、传感器技术等。在此基础之上，如果涉及机器人自主作业，还要求医疗机器人具有的关键技术包括人机协同、遥控操作、空间定位、多模影像处理、人工智能、互联网大数据、VR/AR
    等。


    目前，根据医疗机器人的不同功能，可将其分为手术机器人、非手术诊疗机器人、康复机器人和医疗服务机器人四大类。根据波士顿咨询公司的统计数据，手术机器人是医疗机器人中占比规模最大的产品，约有
    60% 的市场份额，其次是外骨骼、智能假肢等康复机器人，非手术诊疗机器人和医疗服务机器人占比相对较小。


    # (1) 手术机器人


    手术机器人通常由一个内窥镜（探头）、刀剪等手术器械、微型摄像头和操纵杆等器件组装而成。目前使用的手术机器人的工作原理是通过无线操作进行外科手术的，即医生坐在计算机显示屏前，通过显示屏和内窥镜仔细观察病人体内的病灶情况，然后通过手术机器人的手术刀将病灶精确切除或修复。手术机器人最大的特点是具有人不具备的灵巧性，原因在于一方面它的震颤过滤系统能滤除外科医生手部的颤动，另一方面它的手术动作缩减系统能成比例缩减外科医生的动作幅度。


    目前，手术机器人能够操作的手术种类主要有以下几个方面。


    +   1）普外科的胃部分切除术、阑尾切除术、胃造口术、乳房切除术等。

    +   2）肝胆外科的胆囊切除术、肝门空肠吻合术、胆总管造口术等。

    +   3）妇产科的子宫切除术、卵巢错位、子宫肌瘤切除术等。

    +   4）泌尿外科的前列腺切除术、肾切除术、输尿管成形术等。

    +   5）胸心外科的心脏不停跳旁路术、瓣膜修复术、食管肿物切除术等。'
