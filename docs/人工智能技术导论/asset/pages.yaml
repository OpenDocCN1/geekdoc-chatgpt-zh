    255 的较大数字表示较浅或白色的阴影。


    也就是说，图像以数字矩阵的形式存储在计算机中，其中这些数字称为像素值。这些像素值代表每个像素的强度。0 代表黑色，255 代表白色。数字矩阵称为通道，对于灰度图像，只有一个通道，黑白图像就是
    0～255 的一个数字矩阵。那么彩色图像又如何存储在计算机上呢？


