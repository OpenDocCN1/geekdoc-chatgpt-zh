    # (4) 典型应用之四“视觉定位”


    “视觉定位”是计算机视觉在工业场景中的基本应用。视觉定位能够准确地检测到产品并且确认它的位置，如图 6-6 所示。在半导体制造领域，芯片位置信息调整拾取头非常不好处理，计算机视觉则能够很好地解决这个问题。


    ![](img/70810124a73792907f3adecdd1e14f54_147_0.png)


    # 2. 计算机视觉在身份验证场景中的应用


    计算机视觉在日常生活中被广泛地使用，已经变成了最热门的科技服务之一。人脸识别是计算机视觉在身份验证场景中最热门的应用。《麻省理工科技评论》发布的 2017
    年全球十大突破性技术榜单中，来自中国的刷脸支付技术位列其中，这是该榜单创建 16 年来首个来自中国的技术突破。到今天为止，人脸识别技术已经广泛应用于金融、司法、公安、边检、政府、航天、电力、工厂、教育、医疗等行业。平时大家都会通过手机使用人脸识别功能。


    # 3. 计算机视觉在安防场景中的应用


    计算机视觉技术可以对结构化的人、车、物等视频内容进行快速检索、查询，在大量人群流动的交通枢纽，这一技术被广泛用于人群分析、防控预警等方面，使得公安系统可以通过繁杂的监控视频搜寻罪犯。


    # 4. 计算机视觉在医疗场景中的应用


    医学图像分析是计算机视觉发挥作用的常见领域，通过对 MRI、CT 扫描和 X 射线的图像进行分析并发现异常，如发现肿瘤或寻找神经系统疾病的迹象，能够显著改善医学诊断的过程。计算机视觉在
