    # 3.2.2 知识工程概述


    知识工程（knowledge engineering）是关于建造、维护和使用基于知识的系统的方法论和技术手段的统称。基于知识的系统（knowledge-based
    system, KBS）是一种计算机程序，它使用知识库进行推理，来解决和回答复杂问题。


    “知识工程”属于“符号主义”人工智能技术，符号主义认为人工智能源于数理逻辑，认为智能的本质就是符号的操作和运算，或者说是概念的逻辑推理。其中，美国斯坦福大学的爱德华·阿尔伯特·费根鲍姆（Edward
    Albert Feigenbaum），如图 3-4 所示，领导研制的一种化学分析的专家系统 DENDRAL 于 1968 年问世，该系统可以帮助有机化学家鉴定未知有机分子，被认为是之后各种专家系统的萌芽。专家系统作为早期人工智能的重要分支，是一种在特定领域内具有专家水平解决问题能力的程序系统。1977
    年，费根鲍姆将构建该系统的方法正式命名为知识工程。


    ![](img/70810124a73792907f3adecdd1e14f54_90_1.png)


    图 3-4 爱德华·阿尔伯特·费根鲍姆


    狭义上看，知识工程主要是构建专家系统、知识库系统的技术和方法。广义上看，语义网络以及之后出现的知识图谱等技术都可以归类为基于知识的系统，也都与知识工程的概念和技术息息相关。


    知识工程是认知智能的核心，是人工智能可解释性的基础，而这种可解释性是人工智能伦理应遵循的重要原则之一。设想这样一个场景：一辆自动驾驶的汽车行驶在一条窄路上，突然一名小朋友冲到车前，此时刹车已经来不及了，只能打方向避让，其中汽'
