- pgno: 2
  md: '# # 内容简介


    本书首先带领读者体验身边的人工智能技术应用，使读者初步了解人工智能，然后引领读者认识人工智能关键技术及应用，并使用手机 APP 实际操作不同领域（如设备故障智能排查、导航路径规划、文本拍照翻译、手机刷脸软件使用、同声翻译
    APP 等）中人工智能的应用，以加深对人工智能知识的理解，最后引导读者畅想人工智能的未来。本书的主要内容包括认识与体验身边的人工智能技术应用、初识人工智能、初探知识工程、揭秘智慧搜索、初见机器学习、探索计算机视觉、聆听智能语音、畅想人工智能的未来
    8 个循序渐进的项目，采用项目导向、任务驱动、理论结合的教学模式。


    本书可作为新时代职业院校人工智能通识教育基础教材和人工智能爱好者的启蒙教材，也可作为人工智能科普读物。


