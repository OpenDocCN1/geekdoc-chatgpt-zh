  md: '能机顶盒、智能故事机、智能学习机、智能录音笔、车载智能导航等，人们可以通过使用该技术来和机器完成高自然度的人机交互。智能语音交互过程如图 7-2 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_161_0.png)


    # 图 7-2 智能语音交互过程


    在智能语音交互过程中，机器需要“听清”声音并且“识别”声音，然后“理解”声音所含信息，并根据理解的信息采取下一步“行动”（查询当地天气信息），再根据行动（查询）的结果，思考给出问题的答案（文字），通过语音反馈给用户。这个过程类比人听到了同样的语音指令所需要进行的步骤。


    智能语音主要包含了语音信号处理、语音识别、自然语言处理、语音合成等技术领域。


    # 7.2.1 语音信号处理


    人的耳朵是一个很特殊、灵敏的器官，可以分辨声音的大小、方位和距离，感觉声音的大小和远近变化，还可以选择感兴趣的声音进行聆听。例如，在周围有各种噪声的环境中，如果远处突然有人叫自己的名字，人们往往能够马上就注意到他，而忽略环境中其他的声音或噪声。


    如果把机器放到同样的环境中，机器是很难从各种声音中找到真正需要倾听的声音的，这就需要在语音识别前解决机器“听清”和“识别”的问题。机器要识别采集的语音（连续的模拟信号），首先要经过预处理，如回声消除、混响分离、降噪、采样、量化等，然后将语音信号送入特征提取模块进行特征处理，并利用声学模型和语音模型对语音信号进行解码，然后输出识别结果。


    +   1. 回声消除


    声波在传播过程中，碰到大的反射面（如建筑物的墙壁、大山等）将发生反射，人们把能够与原声区分开的反射声波叫作回声。


    在麦克风离音源比较远的远端（如分会场）语音识别系统中，回声消除最典型的应用是智能终端播放音乐，远端扬声器播放的音乐会回传给近端（如主会场）麦克风，此时需要有效的回声消除算法来抑制远端（如远端扬声器播放的音乐）信号的干扰。回声'
  merge: -1
  img_proc: true
