    人脸识别用于身份核验的应用空间已经呈现出较高的渗透率，计算机视觉在传统行业，如工业质检、巡检的应用也正在兴起。


    我国计算机视觉相关企业数量在逐年增长，计算机视觉市场竞争日益激烈，但我国尚未出现具有行业主导地位的龙头企业。从市场格局角度，在商汤、旷视、云从、依图四家公司的整体份额之外，海康威视、大华、宇视三家公司在“人工智能+安防”市场的份额显著增长；在质检、巡检市场，百度、华为、腾讯以及以创新奇智为代表的创业公司等也在崛起。


    # (3) 中国计算机视觉行业进入企业较多，投融资市场发展迅速


    随着中国制造业的崛起，制造业对生产线更加智能化的需求，使得中国计算机视觉产业投融资案例逐渐增多。目前进入计算机视觉行业的企业很多，从应用功能领域划分，主要是检测、测量、定位、识别读码等几种，各家企业都有自身专注的领域，或一个或多个，在很大程度上，工艺算法是主要壁垒，行业案例是敲门砖。


    综合来看，鉴于短期内技术密集型的机器人产业仍处于成长阶段，新晋企业和团队仍将持续涌入计算机视觉行业。作为人工智能技术与工业制造的直接结合点，计算机视觉有望持续快速发展。


    # 6.2.2 计算机视觉典型应用


    # 1. 计算机视觉在工业场景中的应用


    计算机视觉系统大大提高了工业生产的效率和产品精度，为工业生产的信息集成提供了有效途径。计算机视觉技术不断成熟和进步，应用范围变得越来越广泛。计算机视觉在工业场景中的典型应用如图
    6-3 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_145_0.png)


    图 6-3 计算机视觉在工业场景中的典型应用


    # (1) 典型应用之一“物料分拣”


    在计算机视觉应用环节中，物料分拣是建立在识别、检测之后的一个环节，通过计算机视觉系统对图像进行处理，结合机械臂的使用实现物料分拣。例如，在过去的生产'
  merge: -1
  img_proc: true
- pgno: 146
  md: '线上，是用人工的方法将不同物料进行分拣后，再进行下一步工序，现在则是使用自动化设备进行分拣，其中使用计算机视觉系统进行物料图像抓取、图像分析、输出结果，再通过机器人把对应的物料放到固定的位置上，从而实现工业生产的智能化、现代化、自动化。自动化生产线的物料分拣如图
    6-4 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_146_0.png)


    图 6-4 自动化生产线的物料分拣


    # (2) 典型应用之二 “图像检测”


    在工业生产中，每种产品都需要检验是否合格，“图像检测”是比较普遍的计算机视觉应用。在过去，人工肉眼检测往往会遇到很多问题，比如准确性太低，容易有误差，不能连续工作且易疲劳，而且费时费力。


    计算机视觉系统的大量应用将产品生产和检测推进到高度自动化水平。比较常见的“图像检测”应用，如硬币字符检测、电路板检测以及人民币造币工艺的检测等，这类检测对精度要求特别高，检测的设备也很多，工序复杂。此外，还有饮料瓶盖的质量检测、产品的条码字符检测、玻璃瓶的缺陷检测以及药用玻璃瓶检测等。


    # (3) 典型应用之三 “物体测量”


    计算机视觉工业应用最大的特点就是非接触、无磨损，因此可以避免接触测量可能造成的二次损伤隐患。计算机视觉对物体进行测量（见图 6-5），不需要像传统人工操作一样要与产品进行接触，而且具有高精度、高速度，对产品无磨损，不会造成产品的二次伤害，这对精密仪器的制造水平有特别明显的提升。


    ![](img/70810124a73792907f3adecdd1e14f54_146_1.png)


    图 6-5 物体测量示例'
