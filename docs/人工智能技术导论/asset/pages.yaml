  md: '于非线性问题，通常需要使用多层神经网络处理。随着神经网络的层数增加，其自身需要的调整参数呈指数级递增，若要保证良好的性能，则需要参数合理寻优。目前，针对神经网络的参数寻优一般采用遗传算法、模拟退火算法、极限学习算法等来智能处理参数问题。


    # 7.2.5 智能语音翻译


    世界上共有 5671 种不同的语言，翻译工作费时费力，专业领域的翻译更加困难，因为翻译者不仅要熟练掌握待翻译的语言，还要拥有足够的专业知识。另外，在人们参加国际会议、外出旅游等场景下，语言不通，会造成很多现实困难，如果能通过智能语音准确地进行不同语言之间的翻译，将能够大大提升沟通效率。智能语音翻译示意图如图
    7-20 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_174_0.png)


    图 7-20 智能语音翻译示意图


    机器在进行语音翻译之前，在存储器中已存储了语言学工作者编好的并由数学工作者加工处理过的机器词典和机器语法。人们进行翻译时所经历的过程，机器也同样遵照执行：先查词典得到词的意义和一些基本的语法特征（如词类等），如果查到的词不只有一个意义，那么就根据上下文选取所需要的意义（这一点参照自然语言理解中的“语用分析”）；在弄清楚词的意义和基本语法特征之后，就要进一步明确各个词之间的关系；此后，根据翻译要组成译文（包括改变词序、翻译原文词的一些形态特征及修辞等）。语音翻译的过程一般包括
    4 个阶段：语音输入、原文分析（查词典和语法分析）、译文综合（调整词序与修辞以及从译文词典中取词）和译文朗读。


    +   1. 语音输入


    计算机只能识别二进制输入，因此字词和符号要先进行转码工作，即将自然语言转换为二进制码。以例句“我在学校”的翻译为例，不论是要翻译成何种语言，都要先把每一个单词转换成机器可以识别的二进制码，在我国以汉字二进制国家标准码
    GB/T 2312—1980 为准。汉字与二进制国家标准码对照如图 7-21 所示。


    | 字 | 码 |

    |---|---|

    | 我 | 110011011010010 |

    | 在 | 110101001101010 |

    | 学 | 110100011010011 |

    | 校 | 110100001010001 |


    图 7-21 汉字与二进制国家标准对照


    +   2. 原文分析


    原文分析有两个处理步骤：一是查词典；二是'
