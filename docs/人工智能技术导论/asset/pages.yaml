    在谓词逻辑中，可以把这个命题表示为谓词演算的形式：bird(swallow)=T，表示“swallow 燕子”是一种鸟的命题是为真（T）的。利用该谓词公式，可以代入不同的实体，并做出谓词演算：


    +   1) bird(dog) = F: “狗是一种鸟”为假命题。

    +   2) bird(海鸥) = T: “海鸥是一种鸟”为真命题。


