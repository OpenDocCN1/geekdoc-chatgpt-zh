- pgno: 127
  md: '设备利用强化学习去感知地形也是基于类似的操作。


    # 5.2.3 机器学习应用流程


    使用机器学习算法处理实际问题的一般流程如图 5-5 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_127_0.png)


    图 5-5 机器学习算法处理实际问题的一般流程


    +   1) 数据采集：数据集的质量和数据集的规模可直接影响后续机器学习模型的分类预测性能。


    +   2) 数据处理：采集完毕的数据信息通常情况下参差不齐，可采用数据标注、数据清洗、数据抽样、数据切分等操作，以提高数据集的整体质量。


    +   3) 模型构造、训练、预测：选择合适的机器学习算法构造模型，将处理完毕的数据切分为训练数据集与测试数据集，通过计算机独立训练数据，使得模型具备预测测试数据属性的能力。


    +   4) 评估、参数调整：根据实际问题需求设定评价指标来评估模型性能优劣，并根据评估结果对模型中的具体参数进行调整，使得模型在某些评价指标上得到进一步提高。


    +   5) 部署：选择效果最好的模型部署到实际生产环境中进行使用。


    # 5.2.4 深度学习


    深度学习（deep learning, DL）是机器学习的子集，它模仿人脑对于信息的处理方式，是利用深度神经网络（deep neural networks,
    DNN）来解决特征表达的一种学习过程。


    神经元是一种处理单元，是对人脑组织的神经元（见图 5-6）的某种抽象、简化和模拟，是人工神经网络的关键部分。通过神经元，人工神经网络可以用数学模型模拟人脑神经元活动，继而进行高效的计算以及其他处理。


    将神经元的信息处理原理应用到计算机中，就是感知机模型，如图 5-7 所示，它是一个有若干输入和一个输出的线性关系模。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/70810124a73792907f3adecdd1e14f54_128_0.png)


    ![](img/70810124a73792907f3adecdd1e14f54_128_1.png)


    感知机模型只能用于二元分类，且无法学习比较复杂的非线性模型，在工业界无法使用。因此，在感知机的基础上扩展形成了深度神经网络模型，深度神经网络模型如图 5-8
    所示。


    ![](img/70810124a73792907f3adecdd1e14f54_128_2.png)


    现代深度学习通常包含数十个甚至上百个连续的表示层，这些表示层全都是从训练数据中自动学习的。与此相反，其他机器学习算法的重点往往是仅仅学习一两层的数据表示，因此有时也被称为浅层学习（shallow
    learning）。


    面对复杂多变的生产环境、多种多样的检测对象，过度依赖于专家经验输入和人为划分任务难免造成瓶颈，且难以优化。针对规模庞大的检测和识别任务，让机器去深度学习才是最优的解决办法。'
