    +   1) 影像诊断人才资源紧缺。医疗机构普遍缺乏高水平的影像医师，在疾病诊断时往往会发生同病异影、异病同影等情况。


    +   2) 传统定性分析存在诊断误差。医生普遍擅长定性分析，很多微小的定量变化无'
