  md: '# 讨论与思考


    # 1. 判断题


    +   (1) 智能语音技术是基于神经网络的。 ( )

    +   (2) 语音识别技术主要包括语音特征提取技术、声学模型与模式匹配技术以及语音模型与语义理解技术 3 个部分。 ( )

    +   (3) 智能语音识别是一项多学科交叉的前沿技术。 ( )

    +   (4) 智能语音技术可以部署于移动终端和云端服务器。 ( )

    +   (5) 语音识别与在线同声翻译同属智能语音技术范畴。 ( )

