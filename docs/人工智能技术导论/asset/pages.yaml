  md: '车左前方是一棵树，右前方是一条小狗。请问自动驾驶汽车应该转向哪个方向更合理？这个选择中自动驾驶汽车会用到哪类人工智能技术？在这个场景中，可以通过感知智能（图像识别等）来识别物体，通过行为智能（车辆自动控制）来操控汽车。而在两方中进行抉择，则需要通过知识工程（常识知识、价值知识、伦理知识、法律知识等）进行推理和决策来做到。


    将知识融合在机器中，让机器能够利用人类经验、专家知识解决问题，这就是知识工程要做的事情。例如，计算机如何解答“18-13”的问题？过程大致如下：


    +   1）从拍摄的图像中定位问题图形的目标位置。

    +   2）使用视觉感知技术对目标位置图像进行分割。

    +   3）对分割后的图像进行特征提取，匹配识别数字和计算符号。

    +   4）把识别的计算符号在符号库中进行匹配，获取计算规则。

    +   5）根据计算规则，使用计算机程序控制完成计算。


    计算机解答计算问题的过程如图 3-5 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_91_0.png)


    图 3-5 计算机解答计算问题的过程


    计算机运用知识解决问题的过程明确地拆分为几个过程，可以抽象地总结为以下几个方面。


    +   1）知识表示。研究怎样对知识进行形式化描述，以让计算机能合理地存储和使用知识。这里将数字和计算符号的定义和编码记录到符号库中，形成所有计算机的标准，就是一种知识表示方法。

    +   2）知识获取。研究知识处理系统如何从系统外部获得知识、充实知识库，包括对外部数据进行知识化。学习不同的语言符号并不断扩展符号库，就是知识获取的过程。

    +   3）知识使用。研究在知识处理系统中应如何组织和利用知识，使用怎样的推理方法，以达到所希望的目标。本示例中首先通过视觉感知技术对图像进行分割和特征提取，识别为机器能理解的数字和计算符号，之后根据符号库中的规则完成计算控制，是为知识的运用。当然，此处的减法例子相对简单，但对于复杂问题，完成问题结论的推理可能是相当复杂的。


    其中，知识表示是知识工程研究的主要领域，知识使用则是在特定知识表示的基础'
