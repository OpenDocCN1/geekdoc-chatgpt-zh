    将灰度图像转化为二值化图像的方法有很多，阈值法是比较简单的一种方法。阈值法是指选取一个数字，大于它就视为全白，小于它就视为全黑。根据阈值选取方式的不同，可以分为全局阈值和局部阈值。比如图
    6-14 中的彩色图像，选取一个阈值，当超过这个阈值就为全白，低于这个阈值就为全黑，故而二值化图像能将图片中的轮廓更加鲜明地表达出来。


    ![](img/70810124a73792907f3adecdd1e14f54_152_0.png)


    # 图 6-14 彩色图像的二值化


    图像几何变换又称为图像空间变换，通过平移、转置、镜像、旋转、缩放等几何变换对采集的图像进行处理，用于改正图像采集系统的系统误差和仪器位置（成像角度、透视关系乃至镜头自身原因）的随机误差。此外，还需要使用灰度插值算法，因为按照这种变换关系进行计算，输出图像的像素可能被映射到输入图像的非整数坐标上。通常采用的方法有最近邻插值、双线性插值和双三次插值。


    图像增强是增强图像中的有用信息，它可以是一个失真的过程，其目的是要改善图像的视觉效果，针对给定图像的应用场合，有目的地强调图像的整体或局部特性，将原来不清晰的图像变得清晰或强调某些感兴趣的特征，扩大图像中不同物体特征之间的差别，抑制不感兴趣的特征，使之改善图像质量、丰富信息量，加强图像判读和识别效果，满足某些特殊分析的需要。图像增强算法可以分成两大类：空间域法和频率域法。


    # 4. 图像特征提取


    图像特征是指可以对图像的特点或内容进行表征的一系列属性的集合，主要包括图像自然特征（如亮度、色彩、纹理等）和图像人为特征（如图像频谱、矩特征、图像直方图等）。


    图像特征主要有图像的颜色特征、纹理特征、形状特征和空间关系特征。图像特征提取根据其相对尺度可分为全局特征提取和局部特征提取两类。全局特征提取关注图像的整体表征。常见的全局特征包括颜色特征、纹理特征、形状特征、空间位置关系特征等。局部特征提取关注图像的某个局部区域的特殊性质。一幅图像中往往包含若干兴趣区域，从这些区域中可以提取数量不等的若干个局部特征。


    优秀的图像特征一般具有以下 4 个特性。


    1）可靠性：对具有相同类别的对象提取出来的图像特征应该具有相似性。比如小狗小猫的识别，小狗的样貌特征比较统一，选择这一特征就能很好地识别是小狗还是小猫，而此时选择小狗的颜色作为特征就不是一个好的选择。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '2）区别性：提取出来的图像特征应该具有很好的区别性。类别之间的特征值差别越大越好，不同类别的特征值应该具有显著差异。比如篮球和乒乓球，直径大小的差异就有明显的不同。


    3）独立性：各个特征之间应该相互独立，彼此不相关联。若两个特征值所表征的是识别对象的同一属性，那么这两个特征就可以合并为一个特征值，使得计算量大为简化。


    4）数量小：表示图像特征的各个特征数目不能过大。特征数目的增多会显著增加基于特征的图像识别的复杂度。


    颜色特征是一种全局特征，描述了图像或图像区域所对应的景物的表面性质。由于颜色对图像或图像区域的方向、大小等变化不敏感，因此颜色特征不能很好地捕捉图像中对象的局部特征。此外，仅使用颜色特征进行查询时，如果数据库很大，常会将许多不需要的图像也检索出来。颜色特征提取方法有颜色直方图、颜色集、颜色矩（颜色分布）、颜色聚合向量、颜色相关图。


    纹理特征也是一种全局特征，它描述了图像或图像区域所对应景物的表面性质。但由于纹理只是一种物体表面的特性，并不能完全反映物体的本质属性，因此仅仅利用纹理特征是无法获得高层次图像内容的。


    与颜色特征不同，纹理特征不是基于像素点的特征，它需要在包含多个像素点的区域中进行统计计算。在模式匹配中，这种区域性的特征具有较大的优越性，不会由于局部的偏差而无法匹配成功。


    作为一种统计特征，纹理特征常具有旋转不变性，并且对于噪声有较强的抵抗能力。但是，纹理特征也有其缺点，一个很明显的缺点是当图像的分辨率变化的时候，所计算出来的纹理可能会有较大偏差。另外，由于有可能受到光照、反射情况的影响，从二维图像中反映出来的纹理不一定是三维物体表面真实的纹理。


    例如，水中的倒影，光滑的金属面互相反射造成的影响等都会导致纹理的变化。由于这些不是物体本身的特性，因而将纹理信息应用于检索时，有时这些虚假的纹理会对检索造成“误导”。在检索具有粗细、疏密等方面较大差别的纹理图像时，利用纹理特征是一种有效的方法。但当纹理之间的粗细、疏密等易于分辨的信息之间相差不大的时候，通常的纹理特征很难准确地反映人的视觉所能感觉出的不同纹理之间的差别。


    许多形状特征仅描述了目标局部的性质，要全面描述目标，常对计算时间和存储量有较高的要求；许多形状特征所反映的目标形状信息与人的直观感觉不完全一致，或者说，特征空间的相似性与人的视觉系统感受的相似性有差别。另外，从二维图像中表现的三维物体，实际上只是物体在空间某一平面的投影，从二维图像中反映出来的形状常常不是三维物体真实的形状，由于视点的变化，可能会产生各种失真。同时，如果目标有变形时，检索结果往往不太可靠。


    在通常情况下，形状特征有两类表示方法：一类是轮廓特征；另一类是区域特征。图像的轮廓特征主要针对物体的外边界，而图像的区域特征则关系到整个形状区域。典型的形状特征描述方法有边界特征法、傅里叶形状描述算法、几何参数法、形状不变矩法等。


    图像的特征提取需要根据需要识别的对象不同而不同，现在特征的提取还可以采用机器学习的方法完成，选择哪些特征，如何区分，都让机器去自主学习完成，目前已经'
