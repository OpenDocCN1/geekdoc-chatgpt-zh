    +   3) 代入实体燕子（swallow）、天上（sky），根据谓词公式演算出逻辑真值（T）。

    +   4) 根据谓词演算结果“真”（true），向用户输出回答“是”。谓词逻辑的推理步骤如图 3-8 所示。


