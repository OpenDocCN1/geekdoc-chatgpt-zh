  md: '# 2. 数字农业基础设施建设


    # (1) 农林道路数字化建设


    农林道路数字化建设的目的是围绕农林道路设施的建设、投用、管养、考核全过程，建立起科学高效的农林道路运行及养护机制，示例如图 1-51 所示。其数字化建设的主要内容包括以下几个方面。


    +   1) 视频采集系统：主要针对农村公路车流量情况进行采集，包括若干套前端设备，设备具有采集模块和处理模块，可以实现车辆计数、车速监控、车牌识别等功能。

    +   2) 交通地理信息云平台：是基于地理信息整合交通规划、建设和管理数据的系统化平台，对多源、多维、多类型交通管理数据和地理信息数据进行统一部署、融合互通，实现区域交通地理信息“一张图”。

    +   3) 全网监控管理系统：用于查看前端点位的整体运行状态，在日常使用中能及时发现排查前端障碍点。

    +   4) 多数据融合分析系统：是将通过农村公路前端各种类型设备采集的数据，按照标准进行数据整合，运用自动分析工具完成有用数据的提取推送。

    +   5) 农村业务子系统：包含智慧农路综合管理平台、运维支撑平台，最终接入交通综合信息管理与服务平台。

    +   6) 风、光供电系统：作为一种合理的独立电源，适合用于为远离电网、用电负荷不大的设备提供稳定可靠的电源供应。


    ![](img/70810124a73792907f3adecdd1e14f54_41_0.png)


    # 图 1-51 农林道路数字化建设示例


