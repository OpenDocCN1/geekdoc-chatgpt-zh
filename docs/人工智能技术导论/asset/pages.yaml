  md: '# 1. 智慧农业的关键技术


    当前服务于智慧农业领域的关键技术主要包括基于物联网的农业感知技术、基于大数据及云平台的农业分析技术、基于人工智能的农业决策技术等。


    # (1) 基于物联网的农业感知技术


    基于物联网的农业感知技术是实现智慧农业精细化生产和自动化生产的基础，所感知的准确数据是指导农业过程中合理生产管理的重要依据。其主要通过各种无线传感器（见图
    1-42）实时采集农业生产现场的土壤成分、温湿度、风速风向、光照强度、二氧化碳浓度等环境参数，利用视频监控设备获取作物的生长状况等信息，远程监控农业生产环境，同时将采集的参数和获取的信息进行数字化转换和汇总后，经传输网络（见图
    1-43）实时上传到智能管理系统中，实现对土壤墒情、农田虫情、农田苗情和农田灾情的农业“四情”管理。


    ![](img/70810124a73792907f3adecdd1e14f54_36_0.png)


    图 1-42 无线传感器示例


    # (2) 基于大数据及云平台的农业分析技术


    基于大数据及云平台的农业分析技术是开展智慧农业生产的驱动要素。它是在开放系统中收集、鉴别、标识数据，并建立数据库，通过参数、模型和算法来组合和优化海量数据，为农业生产操作和经营决策提供依据的重要手段。目前，其主要服务的领域包括以下几个方面。


    +   1) 农业环境与资源数据分析：主要分析土地资源数据、水资源数据、气象资源数据、生物资源数据和灾害数据。


    +   2) 农业生产数据分析：主要分析种植业生产数据和养殖业生产数据。


    +   3) 农业市场数据分析：主要分析市场供求信息、价格行情、生产资料市场信息、价格及利润、流通市场和国际市场信息等。'
