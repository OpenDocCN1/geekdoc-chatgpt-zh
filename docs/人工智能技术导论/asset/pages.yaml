- pgno: 121
  md: '导航的呢？答案是靠光学自主导航。


    ![](img/70810124a73792907f3adecdd1e14f54_121_0.png)


    图 4-14 “祝融号”火星车


    其实，在古代就有了光学自主导航。那个时候，它有另外一个名称——天文导航（牵星术）。古代船只在远洋航行的时候，经验丰富的水手会通过恒星与月亮的位置来判断航向。即使在现代，在分辨不清楚东南西北的野外，依然可以以北极星辨明方向。


    光学自主导航根据参照物的不同分为基于太阳和行星的导航以及基于小行星的导航两种。


    “天问一号”有两台全新研制的设备：光学导航敏感器和红外导航敏感器，它们会在不同阶段帮助“天问一号”确定位置与速度。光学导航敏感器主要用于巡航段，利用拍摄的恒星与火星图像，精确计算出自身的飞行姿态、位置与速度，实现相对火星的自主导航，这是我国首次在行星际转移飞行过程中应用光学自主导航技术。红外导航敏感器用于环绕段，在“天问一号”成为火星卫星的时候，用于测量“天问一号”探测器的轨道位置和速度，该敏感器可以在一千万千米以外的距离识别出火星，从而帮助“天问一号”自主找到正确的前进道路，奔赴火星。


