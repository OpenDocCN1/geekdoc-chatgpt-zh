    # 1. 语音特征提取技术


    在智能语音识别系统中，模拟的语音信号在完成 A/D 转换后会变成能被计算机识别的数字信号。但是时域上的语音信号难以直接被识别，这就需要从语音信号中提取语音特征。这样做的好处是：一方面可以获得语音的本质特征；另一方面可以起到压缩数据的作用。输入的模拟语音信号首先要进行预处理，然后将语音划分为极小的片段，以便于处理，同时尽可能降低信号失真等，以获取语音的声学特征，再将语音声学特征转换为发音的最小单元，如音素特征。语音特征提取示例如图
    7-8 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_164_1.png)


    图 7-8 语音特征提取示例'
