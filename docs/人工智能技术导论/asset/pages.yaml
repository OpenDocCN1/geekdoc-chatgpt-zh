- pgno: 27
  md: '对于爆炸性增长的制造信息处理的能力、效率及规模上。先进的制造设备离开信息输入就无法运转，柔性制造系统（flexible manufacturing system，FMS）一旦被切断信息来源就会立刻停止工作。因此，制造系统正在由原先的能量驱动型转变为信息驱动型，这就要求制造系统不但要具备柔性，而且还要表现出智能，否则是难以处理如此大量而复杂的信息工作量的。其次，瞬息万变的市场需求和激烈竞争的复杂环境，也要求制造系统更加灵活、敏捷和智能。因此，智能制造越来越受到重视。


    广义的智能制造包括智能制造技术和智能制造系统两部分。


    # 1. 智能制造的关键技术


    当前服务于智能制造领域的关键技术主要包括识别技术、实时定位系统、信息物理融合系统、网络安全技术、系统协同技术等。


    # (1) 识别技术


    智能制造所利用的识别技术主要包括射频识别技术（radio frequency identification，RFID）（见图 1-27）、基于深度三维图像识别技术（见图
    1-28）、物体缺陷自动识别技术（见图 1-29）等。


    ![](img/70810124a73792907f3adecdd1e14f54_27_0.png)


    图 1-27 射频识别示例


    ![](img/70810124a73792907f3adecdd1e14f54_27_1.png)


    图 1-28 基于深度三维图像识别示例'
