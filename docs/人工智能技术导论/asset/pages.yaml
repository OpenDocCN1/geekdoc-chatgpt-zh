    # 2. 混响分离


    声波在室内传播时，要被墙壁、天花板、地板等障碍物反射，每反射一次都要被障碍物吸收一些，当声源停止发声后，声波在室内要经过多次反射和吸收，最后才消失。这种室内声源停止发声后仍然存在的声音延续现象叫作混响，这段时间叫作混响时间。混响传达到麦克风，从而生成混响语音；房间大小、声源和麦克风的位置、室内障碍物、混响时间等因素均影响着混响语音的生成。混响降低了语音清晰度，给语音识别带来了很大的困难，因此在语音识别前需要进行混响分离处理。混响分离示例如图
    7-4 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_162_1.png)


    图 7-4 混响分离示例


    # 3. 降噪


    在生活环境中通常会存在如空调、风扇等产生的各种噪声，降噪算法的目的在于降低环境中存在的噪声，提高信噪比，进一步提升识别效果。语音降噪示例如图 7-5 所示。'
