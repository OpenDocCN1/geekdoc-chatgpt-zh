  md: '环境进行实时监测，依靠先进的车辆监测技术和计算机信息处理技术获得有关交通状况的信息，并根据收集的信息对交通进行控制，如控制信号灯、发布诱导信息、管制道路、处理事故与实施救援等。


    ![](img/70810124a73792907f3adecdd1e14f54_20_0.png)


