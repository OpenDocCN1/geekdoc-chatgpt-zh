  md: '# 7.1 项目描述


    智能语音技术通常包含两个方向，即语音识别和语音合成。语音识别主要是将人类语音中的词汇内容转换为计算机可读的输入，语音识别就好比机器的听觉系统，它使机器通过识别和理解，能将语音信号转换为相应的文本或命令；而语音合成则类似于机器的嘴巴，它把运算结果中的电信号转换为拟人的声音信号。智能语音是一项融合了数学与统计学、声学、语言学、生物学等多学科知识的前沿技术。


    自 2009 年深度学习技术兴起之后，语音识别技术的发展已经取得了长足进步。语音识别技术的精度和速度取决于实际应用环境，在安静环境、标准口音、常见词汇场景下，语音识别技术准确率已超过
    97%，具备了与人类相仿的语音识别能力。

    本项目重点介绍智能语音技术的基本原理及其当前应用现状。


    # 7.2 知识准备


    声音在自然界中广泛存在，其本质是由物体振动产生的声波，声音与轮廓都可以作为基本特征来描述事物。例如，《道德经》中所说的“大音希声，大象无形”正是以声音和轮廓来表述的中国传统哲学理念，这里的“音”泛指各种声音，而语音是特指人类发出的能够用于实际交流的声音。在一定程度上，声音包含了语音，语音是声音中最特殊且最重要的组成部分。


    随着工业化与智能化进程的推进，智能语音技术已成为较为重要的科学技术。智能语音技术已经融入人们的日常生活，如常用的智能音响，既能对用户发出的语音进行识别，也能将其运算的结果进行语音合成后反馈给用户。在人工智能大潮的推动下，人们对于人机交互终端也提出了新的展望，即让机器拥有“耳朵”和“嘴巴”，使机器既可以听懂人类的语言并执行人类发出的指令，又可以通过语音来给人类反馈，从而解放人类的双手。智能语音示意如图
    7-1 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_160_0.png)


    图 7-1 智能语音示意图


    当代智能语音技术已经在许多领域得到了成功的运用，如智能音箱、智能电视、智'
  merge: -1
  img_proc: true
