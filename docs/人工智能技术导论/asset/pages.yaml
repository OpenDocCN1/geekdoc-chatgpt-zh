- pgno: 31
  md: '| 系统/组件 | 描述 |

    | :--- | :--- |

    | ERP系统 (大脑) | ERP系统相当于中枢神经系统的脑部，负责制订计划，调配资源，提供决策支持 |

    | MES (脊髓) | MES相当于中枢神经系统中的脊髓，向上连接ERP系统，向下连接PLC或其他控制系统，负责整个生产过程的控制 |

    | PLC (神经突触) | PLC是中枢神经系统与神经元之间的突触，负责信息的采集与转发，并直接控制生产设备与生产线 |

    | 现场总线、工业以太网等 (神经纤维) | 现场总线、工业以太网等通信设备是神经纤维，负责整个系统的数据、指令的传输工作，是系统运作的基本保障 |

    | 传感器、RFID标签等 (神经元) | 传感器、RFID标签等组件是整个系统的神经元，负责收集生产环境、物料流向、在制品状态等数据并上传 |


