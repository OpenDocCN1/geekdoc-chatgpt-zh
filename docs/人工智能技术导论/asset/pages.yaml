- pgno: 109
  md: '# ### 4.1 项目描述


    计算机并不具备通过逻辑推理而有意识地理解世界的能力。在一个智能系统中，让计算机给出一个清晰简洁的有关知识的描述是很困难的，但以形式化的方式表示知识或者查找知识并将其提供给计算机进行自动处理，是目前智能系统主要的实现方式。人对自己大脑中所记忆的知识的查找方式是联想的、即刻的，头脑中并不存在固定位置的知识库或经验信息物理空间。但计算机解决问题或查找有用信息时需要利用各种搜索技术，搜索和推理都是计算机解决问题的基本方法。


    本项目将以新一代搜索技术在智能制造领域中的应用为切入点，重点介绍人工智能技术在该领域的应用现状及发展趋势。


    # ### 4.2 知识准备


    # #### 4.2.1 搜索技术简介


    搜索技术（search technique）是用搜索方法寻求问题解答的技术，常表现为系统设计或达到特定目的而寻找恰当或最优方案的各种系统化的方法。搜索技术也是人工智能的一个重要内容。


    在人工智能中，搜索问题一般包括两个关键问题：一是搜索什么，即搜索目标；二是在哪里搜索，即搜索空间。以在湖南省搜索湖南铁道职业技术学院为例，那么湖南省整个地域范围为搜索空间，而湖南铁道职业技术学院为搜索目标。


    搜索空间通常是指一系列状态的汇集，因此称为状态空间。与通常的搜索空间不同，人工智能中大多数问题的状态空间在问题求解之前不是全部知道的。


    搜索的方法有很多，其中按照搜索时是否使用启发信息分类，有两种基本方式。一种是盲目搜索，即不考虑给定问题的具体知识，而根据实现确定的某种固定顺序来调用操作规则，一般是按预定的搜索策略进行搜索，没有考虑到问题本身的特性，这种搜索具有很大的盲目性，效率不高，不便于复杂问题的求解。另一种是启发式搜索，是在搜索过程中加入与问题有关的启发式信息，用于指导搜索朝着最有希望的方向前进，加速问题的求解并找到最优解，即考虑问题可应用的知识，动态地调用操作规则，从而让搜索变得更快。


    # #### 4.2.2 盲目搜索


    盲目搜索方法主要包括宽度优先搜索和深度优先搜索。'
