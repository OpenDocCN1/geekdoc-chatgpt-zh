    # 8.3.2 训练实操：人工智能背景下的伦理讨论


    2021 年 11 月，联合国教科文组织发布了首份人工智能伦理问题全球性协议《人工智能伦理问题建议书》，目的是促进人工智能为人类、社会、环境以及生态系统服务，并预防其潜在风险。


    考虑到人工智能技术对人类大有助益并惠及所有国家，但也会引发根本性的伦理关切，例如：


    +   1) 人工智能技术可能内嵌并加剧偏见，可能导致歧视、不平等、数字鸿沟和排斥，并对文化、社会和生物多样性构成威胁，造成社会或经济鸿沟。


    +   2) 算法的工作方式和算法训练数据应该具有透明度和可理解性。


    +   3) 人工智能技术对于多方面的潜在影响，包括但不限于人的尊严、人权和基本自由、性别平等、民主、社会、经济、政治和文化进程、科学和工程实践、动物福利以及环境和生态系统。


    因此，《人工智能伦理问题建议书》明确规定了人工智能发展应遵循如下原则。


    +   1) 相称性和不损害原则。人工智能技术本身并不一定能确保人类、环境和生态系统蓬勃发展，因此应确保落实风险评估程序并采取措施，以防止发生此类损害。


    +   2) 安全和安保原则。在人工智能系统的整个生命周期内，应避免并解决、预防和消除意外伤害（安全风险）以及易受攻击的脆弱性（安保风险），确保人类、环境和生态系统的安全和安保。


    +   3) 公平和非歧视原则。要采用包容性办法确保人工智能技术的受益人包括不同年龄组、不同文化体系、不同语言群体、残障人士、女童和妇女以及处境不利、边缘化和弱势群体或处境脆弱群体的具体需求，以便让每个人都得到公平待遇。


    +   4) 可持续性原则。要保障人工智能技术有利于社会发展的可持续性目标。


    +   5) 隐私权和数据保护原则。人工智能系统所用数据的收集、使用、共享、归档和删除方式必须符合国际法，要建立适当的数据保护框架和治理机制，将其置于司法系统'
