    # 2. 机器学习在边缘计算领域的应用


    边缘计算（edge computing）目前是智能制造领域的另一个技术热点，它是在高带宽、物联网集成背景下发展起来的技术。边缘计算是指在靠近实物或数据源的一侧，利用网络、计算、存储和应用核心能力为一体的开放平台提供就近端计算服务的技术。边缘计算处于物理实体和工业连接之间或处于物理实体的顶端。其应用程序在边缘侧发起，产生更快的网络服务响应，满足行业在实时业务、应用智能、安全与隐私保护等方面的基本需求。


    在传统的物联网及工业物联网（industrial internet of things，简称 IIoT）内，一般是先将数据发送至云端，然后等待云端的推理决策，这个过程很难满足对实时响应要求高的业务场景需求。例如，智能摄像头需要在边缘侧快速识别电子标签或者人脸等场景，如若把海量的视频数据实时上传到云端去做推理，这势必会带来大量不必要的带宽占用，并无法满足其对于实时决策的需求。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '机器学习算法（尤其是深度学习算法）经常会产生可提高预测准确性的模型。但是，准确性会损害较高的计算和内存利用率。深度学习算法（也称为模型）由计算层组成，其中在每个层中处理大量参数，然后迭代地进行到下一层。信息（例如，高分辨率图片）的维数越高，计算需求就越高。现实中经常使用云端中的
    GPU 来满足这些计算需求。


    边缘计算使计算和数据存储更接近需要的区域，从而提高了响应时间和备用带宽。尽管边缘计算解决了连接性、延迟、可伸缩性和安全性挑战，但边缘设备上的深度学习模型的计算需求，在较小的设备中还是很难满足。因此，目前网络计算服务已经呈现出云、边、端一体化协同的趋势，一方面在云端进行机器学习和深度学习模型的训练与优化；另一方面在边缘端的设备中利用经过优化的训练模型，确保人工智能物联网应用程序能快速获得推理结果，从而达到甚至在没有互联网的环境中产生数据时，也能实现高速响应业务变化并做出决策，并等待设备再次连入互联网时，可以同步数据到云端。


    # 3. 机器学习在预测性维护领域的应用


    预测性维护（predictive maintenance，PdM）包括应对性维护、预防性维护和预测性维护。


    应对性维护是一种计划外停机的设备维护方式，对任何企业而言都极具破坏性；预防性维护是一种以增加维护成本来换取设备运行稳定性的设备维护方式；而预测性维护是一种保持现场设备以最大限度提高利用率，以及将昂贵的计划外停机、运行不正常风险、安全性风险和环境风险降至最低的设备维护方式。因此，预测性维护已经成为智能制造领域的研究热点之一。应对性维护、预防性维护和预测性维护的成本模型示例如图
    5-14 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_132_0.png)


    图 5-14 应对性维护、预防性维护和预测性维护的成本模型示例


    预测性维护策略的目标是延长设备的有效使用寿命并预防故障。异常诊断是预测性维护领域中的一种常见处理方式，通常比基于简单规则的故障检查方式更加准确，对预防代价昂贵的故障和服务中断很有帮助。


    利用基于机器学习的多维度异常诊断模型可以检测出传感器数据曲线虽然一直处于阈值的“上下限”之间，但其生成轨迹与模型数据曲线存在明显的“异常点”，这种'
