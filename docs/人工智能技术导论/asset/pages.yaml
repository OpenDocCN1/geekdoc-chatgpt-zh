    # 3. 语言模型与语义理解技术


    根据声学特征直接得到到最匹配的字符串，忽略了语言学信息，如多音字词的理解、上下文之间的关系等。因此，还需要语言模型来对识别结果进行语法和语义的纠正。语言模型用来表示词语序列出现的可能性，可以基于语法规则，也可以基于统计方法。基于语法规则的语言模型：来源于语言学家掌握的语言学知识和领域知识，是在对汉语词汇系统按语法、语义进行分类的基础上，通过确定自然语言的词法、句法及语义关系，试图达到同音词的大范围的基本唯一识别的语言模型。基于统计方法的语言模型：通过对大量文本料进行处理，获取给定词序列的概率分布，从而能够客观描述隐含的规律，适合于处理大规模真实文本。基于统计方法的语言模型已被广泛应用于语音识别、机器翻译、文本校对等领域。


    # 7.2.3 自然语言处理


    自然语言处理（natural language processing，NLP）属于计算机科学、语言学、数学等领域的交叉学科，是用人工智能来处理、理解以及运用人类语言，实现人与机器的自然交流。如语音助手与人类之间的交流，离不开自然语言处理技术。自然语言处理包括自然语言理解和自然语言生成两部分。


    # 1. 自然语言理解


    自然语言理解（natural language understanding，NLU）是指通过计算机对自然语言文本进行分析处理，从而理解该文本的过程、技术和方法，在智能语音系统中主要应用在将语音识别后的语音信息转换为文本表示。自然语言是人类区别于其他动物的重要特征，没有语言，人类的思维和文明无从传承。对于机器而言，能够理解自然语言才真正向人工智能迈进了一步，即只有当机器具备了理解自然语言的能力时，它们才算是初步具备了“智能”。


    20 世纪 50 年代，当电子计算机还在襁褓之中时，利用计算机处理人类语言的想法'
  merge: -1
  img_proc: true
- pgno: 167
  md: '就已经出现。当时，美国希望能够利用计算机将大量俄语材料自动翻译成英语，以窥探苏联科技的最新发展。研究者从对军事密码的破译这一行为中得到启示，认为不同的语言只不过是对“同一语义”的不同编码而已，从而想当然地认为可以采用译码技术，像破译密码一样“破译”这些语言。事实上，理解人类语言远比破译密码要复杂得多，存在着很多困难和挑战。经过长期探索，自然语言理解技术已经有了长足进步，现有的自然语言理解技术一般包含词法分析、句法分析、语义分析和语用分析
    4 个环节。


    # (1) 词法分析


    词法分析的主要目的是从句子中切分出单词，找出词汇的各个词素，并确定其词义。词法分析包括词形和词汇两个方面。一般来讲，词形主要表现在对单词的前缀、后缀等的分析，而词汇则表现在对整个词汇系统的控制。在中文全文检索系统中，词法分析主要表现在对汉语信息的词语切分上，此即为汉语自动分词技术。通过这种技术，机器能够比较准确地分析用户输入信息的特征，从而完成准确的搜索过程。汉语中每一个字都是“词素”，因此词素寻找过程非常容易，但要切割词汇就较为困难。例如，“学校体检来了三个医院的医生”，词汇分割可以是“学校体检/来了/三个/医院的医生”，是陈述有三个医生来自同一家医院；也可以分割成“学校体检/来了/三个医院的/医生”，是陈述来了三个医生，分别属于三家医院。


    # (2) 句法分析


    句法分析是对用户输入的自然语言进行词汇短语分析，目的就是找出词、短语等的相互关系以及它们各自在句子中的作用等，并以一种层次结构来加以表达。这种层次结构可以是从属关系、直接成分关系，也可以是语法功能关系。句法分析是由专门设计的分析器进行的，其分析过程就是构造句法树的过程，即将每个输入的合法语句转换为一棵句法分析树。例如，句子“我来大学是上学的”，要对其进行结构树拆分，先要明确句子主干，主语是“我”，谓语动词是“来”，宾语“是上学的”，要注意这里是复合宾语结构，即宾语中又包含了谓语动词“是”和宾语“上学的”。例句的句法分析树如图
    7-11 所示，因其形状像树枝的分支，所以这种图称为“树”。


    ![](img/70810124a73792907f3adecdd1e14f54_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# (3) 语义分析


    语义分析是基于自然语言语义信息的一种分析方法，其不仅仅是词法分析和句法分析这种语法水平上的分析，更多地会涉及单词、词组、句子、段落所包含的意义分析。其目的是用句子的语义结构表示语言的结构。中文语义分析方法是基于语义网络的一种分析方法。语义网络则是一种结构化的、灵活的、明确的、简洁的表达方式。语义分析其实就是要识别一句话所表达的实际意义，通俗来讲就是弄清楚一个事件的来龙去脉。例如，“你是不是吃多了？”这句话可以有两种解释：一种是质问对方是不是“无事生非”；另一种是表达关心，是否对方因为过度饮食而有身体不适。同一种文本组合可能产生歧义，语义分析可以解决文本的多重语义问题。


    # (4) 语用分析


    语用分析主要是在语义分析的基础上，结合上下文、语言背景、环境来做进一步分析。例如，“你是不是吃多了？”如果上下文语境是“在医院”，那么例句的表意结构和深层意义一目了然。语用分析就是为了让机器能够深刻解读自然语言而增加的分析环节。


    人们听到语音时，并不会把语音和语言的语法结构、语义结构分离开来。但当语音发音模糊时，人们可以利用这些知识来指导对自然语言的理解过程。对机器来说，自然语言理解系统也要利用这方面的知识，只是在有效地描述这些语法和语义时还存在一些困难。不同规模的自然语言理解系统包含的词汇量有相当大的差别。


    +   1) 小词汇量的自然语言理解系统：通常包括几十个词。


    +   2) 中等词汇量的自然语言理解系统：通常包括几百至上千个词。


    +   3) 大词汇量的自然语言理解系统：通常包括几千至几万个词。


    # 2. 自然语言生成


    自然语言生成（natural language generation，NLG）是自然语言处理的一部分，在智能语音系统中，是将自然语言理解后的语音以人类语言的形式进行表达。自然语言生成降低了人类和计算机之间沟通的难度，被广泛应用于机器新闻写作、聊天机器人等领域，已成为人工智能的研究热点之一。例如，人类对话语音助手：“现在几点了？”语音助手首先利用自然语言理解技术判断用户的意图，理解用户的需求是什么，然后再利用自然语言生成技术做出回复：“现在是早上
    7 点整。”


    传统的自然语言生成框架包含 3 个模块，即内容规划、句子规划和文本实现，如图 7-12 所示。“内容规划”模块讨论的是“说什么”的问题；“句子规划”模块讨论的是“怎么说”的问题，从微观层面决定词汇和句法结构；而“文本实现”模块则负责生成语法、句法、词性正确的文本内容。


    ![](img/70810124a73792907f3adecdd1e14f54_168_0.png)


    # 图 7-12 自然语言生成框架


    # (1) 内容规划


    智能语音系统对输入的语音进行自然语言理解，了解到说话人的意图，如图 7-2 中'
