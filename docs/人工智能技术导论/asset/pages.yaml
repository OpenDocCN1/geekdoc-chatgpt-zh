    # 讨论与思考


    # 1. 判断题


    +   (1) 聚类和分类的区别在于用于聚类的训练样本的类标记是未知的。 （ ）

    +   （2）机器学习算法在图像识别领域的性能表现可能会超过人类。 （ ）

    +   （3）学习率越大，训练速度越快，最优解越精确。 （ ）

    +   （4）线性回归是一种有监督机器学习算法，它使用真实的标签进行训练。 （ ）

    +   （5）无监督学习算法的难度低于监督学习算法。 （ ）

