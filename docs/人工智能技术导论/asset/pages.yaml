    # 1.3.3 案例鉴赏：人工智能技术在智能制造领域的应用案例


    # 1. 智能分拣


    制造业有许多需要分拣的作业，如果采用人工作业，速度缓慢且成本高，而且还需要提供适宜的工作温度环境，如果采用智能分拣系统进行智能分拣，可以大幅降低成本，提高速度。


    # 2. 生产设备健康管理


    目前，利用预测性维护方案进行生产设备的运维管理已经逐步成为行业主流。一方面，可以利用特征分析和机器学习等技术开展预测性维护，对生产设备运行数据进行实时监测，可以在事故发生前进行设备的故障预测，减少非计划性停机。另一方面，面对设备的突发故障，能够迅速进行故障诊断，定位故障原因并提供相应的解决方案。


    # 3. 产品及零部件表面缺陷检测


    基于机器视觉的产品零部件表面缺陷检测应用在制造业已经较为常见。利用机器视觉可以在环境频繁变化的条件下，以毫秒为单位快速识别出产品表面更微小、更复杂的产品缺陷，并进行分类，如检测产品表面是否有污染物、表面损伤、裂缝等。目前已有工业智能企业将深度学习与三维显微镜结合，将缺陷检测精度提高到纳米级。对于检测出的有缺陷的产品，系统可以自动做可修复判定，并规划修复路径及方法，再由设备执行修复动作。


    # 4. 智能决策


    制造企业在产品质量、运营管理、能耗管理和刀具管理等方面，可以应用机器学习和深度学习等人工智能技术，结合大数据分析，优化调度方式，提升企业决策能力。


    # 5. 数字孪生


    数字孪生是指建立一个可以实时更新的、现场感极强的“虚拟”模型，该模型所有动作与真实的物理设备同步，且动作参数均来自物理设备本身。目前，在对数字孪生对象的降阶建模方面，可以把复杂性和非线性模型放到神经网络中，借助深度学习建立一个有限的目标，基于这个有限的目标进行降阶建模。


    # 6. 云计算与边缘计算


    随着工业物联网的快速发展，制造企业在生产线上投入了大量智能设备，使得云计算和边缘计算在智能制造领域的应用也逐渐成为热点。其中，云计算是分布式计算的一'
  merge: -1
  img_proc: true
- pgno: 60
  md: '种，指的是通过网络“云”将巨大的数据计算处理程序分解成无数个小程序，然后通过多部服务器组成的系统处理和分析这些小程序，并将得到的结果返回给用户，其应用程序在服务器端发起。边缘计算是指在靠近物或数据源头的网络边缘侧，融合网络、计算、存储以及应用处理能力的分布式平台，就近提供智能服务，其应用程序在边缘侧发起。云计算强调计算和存储等能力从边缘端或桌面端集中到“云”端，而边缘计算则是将计算和存储等能力重新下沉到边缘端。


    # 1.3.4 案例鉴赏：人工智能技术在智慧农业领域的应用案例


    # 1. 智慧种植业


    种植业是指利用植物的生活机能，通过人工培育以取得粮食、副食品、饲料和工业原料的社会生产部门，包括粮食作物、经济作物、蔬菜作物、绿肥作物、饲料作物、牧草和花卉等园艺作物的生产。在中国，通常指粮、棉、油、糖、麻、丝、烟、茶、果、药等作物的生产。


    智慧种植业是新一代信息技术与种植业深度融合的产物，其中人工智能技术已逐步应用在种植业环境监测、土壤和气象监测、农产品溯源、病虫害监测、种植专家系统、智能农机管理和农业生产联动控制等领域。


    # 2. 智慧林业


    林业是指通过培育和保护森林以获得木材和其他林产品，利用林木的自然特性以发挥防护作用的社会生产部门。因为林业有着保护生态环境和保持生态平衡的重要功能，所以它是促进人口、经济、社会、环境和资源协调发展的基础性产业和社会公益事业。


    智慧林业是基于数字林业和新一代信息技术发展起来的。在数字林业的基础上，智慧林业具有感知化、一体化、协同化、生态化、最优化的本质特征。智慧林业把林业看成一个有机联系的整体，运用智能感知技术、物联网技术、大数据、云计算和人工智能技术，使得这个整体运转得更智能、更高效，从而进一步提高林业产品的市场竞争力、林业资源发展的持续性以及林业能源利用的有效性。其中人工智能技术已逐步应用在生态环境保护、生态灾害防治等领域。


    # 3. 智慧畜牧业


    畜牧业是利用畜禽等已经被人类驯化的动物，或者鹿、麝、狐、貉、水獭、鹌鹑等野生动物的生理机能，通过人工饲养、繁殖，使其将牧草和饲料等植物能转变为动物能，以取得肉、蛋、奶、羊毛、山羊绒、皮张、蚕丝和药材等畜产品的社会生产部门。畜牧业有别于自给自足的家畜饲养，畜牧业的主要特点是集中化、规模化，并以营利为生产目的。


    智慧畜牧业是新一代信息技术与畜牧业深度融合的产物。将畜牧兽医知识技术和畜牧产品市场信息数字化，运用智能感知技术、物联网技术、大数据、云计算和人工智能技术，使畜牧工作更智能、更高效，以便进一步提高畜牧业产品的市场竞争力。'
