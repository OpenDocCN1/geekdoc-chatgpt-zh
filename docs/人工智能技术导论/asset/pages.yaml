- pgno: 3
  md: '# # 前言


    随着新一代信息技术的迅猛发展，具有代表性的人工智能（artificial intelligent, AI）技术已悄然走进人们的生活，“AI+医疗”“AI+出行”“AI+制造”“AI+物流”“AI+商业”“AI+农业”“AI+金融”“AI+教育”等应用场景如潮水般向我们涌来，人工智能与我们的生活已经息息相关，如“小爱同学”这样的智能语音交互系统、超市购物时使用的刷脸支付系统、穿梭在餐厅及酒店的智能送餐机器人等，这些都是人工智能的典型应用。


    随着我国产业结构转型升级，传统行业在以人工智能技术为代表的信息技术的赋能下进入快速转型升级期，会衍生出更多的复合型岗位，企业对现有岗位的技能需求也会提高到一个全新的层次，这都预示着培养具备“AI+岗位技能”的高素质技术技能人才的时代已经到来。因此，职业院校的学生非常有必要认识人工智能技术并了解其简单应用。


    从 2020 年开始，教育界的有识之士就开始了关于人工智能技术与职业教育融通的思考与探索，希望以公共课的模式让人工智能进入课堂，让更多学生认识人工智能，思考人工智能未来可能在哪些方面影响自己从事的行业及职业岗位。职业院校通过开设人工智能通识课程，可以推动学生了解人工智能知识，激发学生学习人工智能的兴趣，引导学生结合自己的专业去思考和理解人工智能技术及应用场景，进而培养学生在人工智能领域的实践创新能力，为适应新时代、拥抱新型职业岗位打下良好的基础。


    人工智能作为一种新兴技术、前沿技术，如何将其引入职业院校的课堂，又如何能使学生喜闻乐见地接受呢？本书编写团队对智慧医疗、智能出行、智能制造、智慧农业、智慧商业等领域的人工智能应用场景进行了调研，结合职业院校学生的认知规律及职业教育的痛点和难点，选取与职业院校学生生活、学习、工作等场景相关，能够吸引其学习兴趣，使其产生共鸣，进而激发其学习热情的内容，开发了认识与体验身边的人工智能技术应用、初识人工智能、初探知识工程、揭秘智慧搜索、初见机器学习、探查计算机视觉、聆听智能语音、畅想人工智能的未来共
    8 个项目，将复杂枯燥的知识点、技能点、行业应用案例融入项目中。在每个项目中，还设计了手机 APP 人工智能应用实操环节，以加深学生对相关人工智能知识的理解，提高其学习兴趣。


    本书特色主要体现在以下几个方面。


    +   1. 落实立德树人根本任务，将思政元素融入教材


    本书以习近平新时代中国特色社会主义思想为指导，坚持“为党育人、为国育才”的原则，精选切合人工智能应用主题、符合项目需求的思政元素，将家国情怀、责任担当、科学思维、职业素养等的培养融入教材，如以“天问一号”中人工智能应用为主，以传统文化传承中人工智能应用为辅，在教学内容中引入人工智能助力“天问一号”成功登陆火星、“天问一号”自主导航、“天问一号”中的机器视觉助力科学探索等思政案例，将人工智能与科学探索紧密结合，引导学生进行科学探索创新；引入人工智能修复'
  merge: -1
  img_proc: true
- pgno: 4
  md: '敦煌壁画、智能语音说方言等思政案例，引导学生为中华文化的传承保驾护航。通过思政元素与教学内容的有机结合，达到潜移默化的育人效果，培养德智体美劳全面发展的社会主义建设者和接班人。


    # 2. 教材内容的设计与学生专业场景、生活场景相结合，力求务实


    一本好的教材是课程的灵魂和核心，本书作为职业院校的通识课教材或科普读物，为了使学生学起来有兴趣，达到教学目标，在编写方面主要遵循以下几个原则。


    +   1）教学内容、教学项目的设计，从认识与体验人工智能开始，到初步了解人工智能知识，再到分析理解人工智能关键技术，最后畅想人工智能的未来，这种由简单到复杂、由浅入深、由点及面的设计思路遵循职业院校学生的认知规律，切合职业教育的教学要求。另外，教学内容在注重情境化、案例化设计的同时，还将一些难以理解的定义、概念、术语等内容通俗化、图形化，向学生娓娓道来，有效降低学生的学习难度。


    +   2）教学内容兼顾不同专业背景的学生需求。选取智慧医疗、智能出行、智能制造、智慧农业、智慧商业等领域的应用场景，涵盖了不同专业背景学生的需求；将人工智能技术与行业应用紧密结合，涵盖了传统专业学生对未来产业格局变化及布局方向了解的需求，使学生能够结合产业结构转型升级，思考自己未来的岗位变化及职业岗位能力要求。


    +   3）“案例鉴赏”中教学案例和“训练实操”中任务的选择与学生的专业场景、生活场景相结合，力争使难点和重点知识变得生活化，使其能将人工智能技术应用到自己的工作、学习、生活中，容易使其产生共鸣。


    # 3. 采用“项目导向、任务驱动”的编写方式


    每个项目采用“项目描述、知识准备、项目实施”的编写结构，“项目实施”包括“案例鉴赏”和“训练实操”。在“知识准备”中学习理论知识，在“案例鉴赏”中理解知识的应用，在“训练实操”中提升实践能力，有助于避免学生在学习过程中产生畏难情绪，提高其学习兴趣。


    # 4. 信息化教学资源丰富，适应“互联网+职业教育”发展需求


    本书配套微课视频、教学课件、教学设计、课程标准等教学资源，为师生营造良好的线上线下学习环境，便于提高学习者的学习兴趣和学习效果。微课视频可扫描二维码观看，其他教学资源可到科学出版社网站（www.abook.cn）下载或联系编辑部邮箱（360603935@qq.com）索取。


    本书由湖南铁道职业技术学院吴海波和郭外萍主编，参与编写人员有高赢、秦金、程翔、周剑、谢云高、张霞和吴家仪。湖南铁道职业技术学院刘志成教授对本书进行了审核。


    本书是配合新的教学模式的初步探索，需要一个动态调整的过程来不断完善和提高，尤其是需要紧跟人工智能技术发展步伐及应用场景的变化，实时补充、完善知识内容及应用场景，且由于编者水平有限，书中难免存在不足之处，恳请广大读者批评指正。'
