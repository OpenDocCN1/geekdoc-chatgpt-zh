  md: '# 2. 声学模型与模式匹配技术


    声学模型的输入是由语音特征提取技术提取的声学特征，它负责将每一个单词与基本的发音单位对应起来（不同语言建模的基本单位也不同，如英语多采用音素建模，而汉语比较适合音节母建模），根据声学特征直接得到最匹配的字符串。目前，智能语音识别主要采用隐马尔可夫模型（hidden
    Markov model，HMM）建模，深度神经网络在语音识别中的应用正在兴起。


    HMM 是统计模型，用来描述一个含有隐含未知参数的马尔可夫过程。其方法是从可观察的参数中确定该过程的隐含参数，然后利用这些参数来做进一步分析。


    假设有一个盲人无法看到外面的天气状况，但可以通过触摸树叶的干湿状态（干燥、潮湿、湿润）来判断天气状态（晴、阴、雨），树叶的干湿状态与天气的状况有一定的概率关系。如果把树叶的干湿程度记为观测状态（用
    O 表示），对于盲人来说，天气状态就是隐藏状态（用 S 表示），如图 7-9 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_165_0.png)


    图 7-9 HMM 示意图


    假定明天的天气（或晴或阴或雨 3 种可能，用 S1 表示），与今天的树叶观察结果（或干燥或潮湿或湿润，用 O1 表示）及今天的天气相关（相关程度用概率），与昨天的天气无关；同理，后天的天气（S2）与明天的天气（S1）及明天树叶的观察结果（O2）相关，与今天的天气无关……简单地说，根据观察值及隐含的相关性（概率）找到可能出现的结果，这就是
    HMM。


    对于智能语音识别系统，要根据接收端收到的信号去分析、理解、还原发送端传送过来的信息。那么如何根据接收的信息来推测说话者想表达的意思呢？利用 HMM 可以解决这些问题。假定，接收到语音信号
    O1、O2、O3，现在要根据这组信号推测出发送的句子 S1、S2、S3，这时，应该在所有可能的句子中找最有可能性的那一个。如果用数学语言来描述，就是在已知
    O1、O2、O3…的情况下，求使得条件概率：P(O1,O2,O3,…|S1,S2,S3,…)*P(S1,S2,S3,…)达到最大值的那个句子 S1、S2、S3…。其中，P(O1,O2,O3,…|S1,S2,S3,…)表示某句话“S1、S2、S3…”被读成“O1、O2、O3…”的可能性；P(S1,S2,S3,…)表示字串“S1、S2、S3…”本身能够成为一个合乎情理的句子的可能性。


    +   现做两个假设：

    +   1）“S1、S2、S3…”是一个马尔可夫链，即 Si 只由 Si-1 决定；

    +   2）第 i 时刻的接收信号 Oi 只由发送信号 Si 决定，即 P(O1,O2,O3,…|S1,S2,S3,…)= P(O1|S1)*P(O2|S2)*P(O3|S3)…。


    那么就可以很容易利用算法找出上面式子的最大值，进而找出要识别的句子“S1、S2、S3…”。这就是 HMM，其中状态“S1、S2、S3…”是无法直接观测到的。声学模型'
