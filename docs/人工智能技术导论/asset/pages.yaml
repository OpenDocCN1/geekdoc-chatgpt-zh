  md: 'APTS 的主要目的是采用各种智能技术促进公共运输业的发展，使公交系统实现安全便捷、经济、运量大的目标。例如，通过个人计算机、闭路电视等向公众提供出行方式和事件、路线及车次选择等方面的咨询，在公交车站通过显示屏向候车者提供车辆的实时运行信息。在公交车辆管理中心，可以根据车辆的实时状态合理安排发车、收车等计划，提高工作效率和服务质量。


