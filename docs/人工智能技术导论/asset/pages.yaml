  md: '通过上述分析可知，数据量本身不会限制人工智能技术发展，但是人工标注数据的成本与规模很可能成为限制人工智能技术发展的因素，这将倒逼人工智能从算法和算力方面有所突破，以便有效解决对数据特别是人工标注数据的依赖。


    # 2. 算力的未来


    算力也就是计算能力，即处理大数据和执行先进算法的计算能力。每个智能系统背后都有一套强大的硬件或者软件计算系统。目前的人工智能算力主要由人工智能硬件芯片和提供超级计算能力的公有云计算服务来支撑。


    在人工智能硬件芯片方面，GPU（图形处理器）应用最为广泛，其浮点计算的能力是 CPU（中央处理器）的 10 倍左右，并拥有更高的并行度、单机计算峰值和计算效率。


    根据全球 GPU 行业市场来看，据统计，2020 年全球 GPU 行业市场规模为 254.1 亿美元，预计 2027 年将达到 1853.1 亿美元，年平均增速为
    32.82%，保持高速增长状态。2020～2027 年全球 GPU 行业市场规模预测如图 8-5 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_182_0.png)


    图 8-5 2020～2027 年全球 GPU 行业市场规模情况


    GPU 未来主要有两大应用发展方向。从需求端考虑，GPU 的优势在于并行计算，需要大规模使用并行计算的领域就是未来 GPU 的发展方向。


    +   1）更加逼真的图形显现。图形显现是 GPU 芯片最初的功能，随着视觉科技和虚拟现实技术的发展，更加真实的图形显现效果会对 GPU 的并行计算能力提出更高的要求。因此，图形显现是
    GPU 芯片未来重要的发展方向之一。


    +   2）高性能计算。高性能计算主要包括通用计算和人工智能计算。通用计算就是用 GPU 来处理一些原本 CPU 可以处理，但是更适合拥有强大浮点计算能力的
    GPU 处理的运算，比如人脸识别等。人工智能计算是另一种高性能计算，不同于用于传统的基于流处理器的 GPU，用于人工智能计算的 GPU 在大多数情况下浮点计算精度要求较低，但对计算吞吐量要求较高。'
