    # 3. 爬山算法


    爬山（hill climbing）算法又称为贪婪局部搜索算法，该算法每次都会从当前解的临近解空间中选择一个最优解并将其作为当前解，直至达到一个局部最优解。如图
    4-6 所示，它在增加山峰高度（数值）的方向上连续移动，以找到峰顶（最佳解决问题的方法）为目的，在到达峰顶时终止。爬山算法不一定能找到最高的峰顶，当找到一个相对高的峰顶时算法就会停止搜索。此时，在这个局部最高的峰顶无论向哪个方向小幅度移动都不能得到更优的解。


    爬山算法是一种局部搜索算法，总是会选择相邻状态中最好的一个，在搜索过程中'
