    无人机可以为农民提供以下 3 种类型的详细信息。


    +   1) 从空中观察作物，帮助农民发现灌溉问题和土壤问题。

    +   2) 空中摄像可以提供多层次的图片，既可以采集到普通的视觉光谱照片，也能拍摄红外线照片，帮助农民发现肉眼无法看到的作物健康问题。

    +   3) 可以通过卫星定位方式，按累加的定位拍摄结果演示作物的生长变化，帮助农民更科学地进行作物生长管理。


    # (2) 无人驾驶拖拉机


    无人驾驶拖拉机（见图 1-55）是一种为了完成低速耕作等农业任务的自主运动农用车。与其他无人地面车辆一样，它利用计算机视觉、激光雷达和卫星定位及导航等技术执行规划任务，并能有效避开诸如人、动物或野外物体等障碍。


    ![](img/70810124a73792907f3adecdd1e14f54_43_1.png)


    # 图 1-55 无人驾驶拖拉机示例


    无人驾驶拖拉机体积小、重量轻，既节约燃料，又能减少化肥使用量。因为拖拉机的重量越重，就会把土壤压得越紧实，导致作物的根系生长困难，所以人们往往会用更大功率的拖拉机把地犁得更深，而大功率拖拉机的重量较大，会形成更深的压实土壤层。'
