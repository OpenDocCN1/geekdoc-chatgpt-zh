    # 4.2.3 启发式搜索


    启发式搜索就是在搜索中要对每一个搜索的节点进行评估，从中选择最好、可能容易到达目标的节点，再从这个节点向前进行搜索，这样就可以在搜索中省略大量无关的节点，从而提高效率。


    启发式搜索中比较常见的算法有贪婪最佳优先搜索算法、A*搜索算法、爬山算法、模拟退火算法、蒙特卡洛树搜索算法等。


    +   1. 贪婪最佳优先搜索算法


    贪婪最佳优先搜索算法（greedy best first search，GBS），也称贪婪算法，可以将它看作广度优先搜索算法的一种改进。其中心思想是：从起始节点出发，每次选择最优路径，直到到达目标节点。'
