    # 2. A* 搜索算法


    A*（A-star）搜索算法是一种在静态图形中求解最短路径的最有效的直接搜索方法，从起点开始，首先遍历起点周围邻近的点，然后再遍历已经遍历过的点邻近的点，逐步地向外扩散，直到找到终点。


    A*搜索算法的思路类似贪婪最佳优先搜索算法，采用贪心的策略，即“若 A 到 C 的最短路径经过 B，则 A 到 B 的那一段必须取最短”，找出起点到每个可能到达的点的最短路径并记录。


    A*搜索算法与贪婪最佳优先搜索算法的不同之处在于，A*搜索算法是一个启发式搜索算法，它已经有了一些通过问题获得的先验知识，如“朝着终点的方向走更可能走到”，它不仅关注已走过的路径，还会对未走过的点或状态进行预测。因此，A*搜索算法相较于贪婪最佳优先搜索算法而言调整了进行搜索的顺序，少搜索了那些“不太可能经过的点”，能更快地找到目标点的最短路径。


    A*搜索算法用公式表示为


    ```

    f*(n)=g*(n)+h*(n)

    ```


    其中，f*(n)是从起始节点经由节点 n 到达目标节点的估算距离；g*(n)是从起始节点移动到节点 n 的距离；h*(n)是节点 n 距离目标节点的预计距离，也就是
    A*搜索算法的启发函数。


