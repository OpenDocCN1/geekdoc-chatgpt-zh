    # ## (2) 实时定位系统


    实时定位系统按技术类别可分为基于射频识别技术的电子标签系统（见图 1-30）、基于超宽带技术（ultra wideband，UWB）的定位基站（见图 1-31）和基于
    GPS 技术的 GPS 定位器（见图 1-32）等，主要用于企业园区内的资产跟踪、人员跟踪、物流跟踪等，提供了查找、记录、监测、控制、调试等功能。


