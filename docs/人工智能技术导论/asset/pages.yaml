  md: '![](img/70810124a73792907f3adecdd1e14f54_96_0.png)


    # 图 3-11 产生式推理识别目标的过程


    知识图谱是使用一种叫语义网络的方法来表示知识，使用图模型来描述知识和建模世界万物之间的关联关系的技术方法。语义网络是由实体、关系和属性组成的一种数据结构，其基本数据的单元称为三元组。它由节点和边组成，节点表示实体（entity）、概念（concept）或属性值（value），边表示实体的属性（property）或实体间的关系（relation），一般形式为“实体-关系-实体”或者“实体-属性-属性值”。关于“姚明”的三元组如图
    3-12 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_96_1.png)


    # 图 3-12 关于“姚明”的三元组


    例如，姚明（实体）→身高（属性）→2.26 米（属性值），姚明（实体）→配偶（关系）→叶莉（实体）。大量的三元组组成网络，形成了知识图谱。关于“姚明”的知识图谱如图
    3-13 所示。


    使用知识图谱可以对问题进行基本回答。例如，“姚明的队友有哪些？”，可以很直观地通过知识图谱查找到“队友”关系的实体，找到“易建联”。也可以利用知识图谱进一步推理和解释，例如“叶莉是易建联的朋友”，可以通过知识图谱找到这两个实体之间的关系；“姚明为什么是伟大的篮球运动员？”，通过知识图谱可以找到他的身高（2.26
    米），还可以找到他获得的各种荣誉属性信息，从而解释这个问题。


    相对于产生式、专家系统等传统知识工程技术，知识图谱是当前感知智能中的热门技术。它的构建过程包括数据获取、知识抽取、知识融合、知识加工，到最后的应用。知识图谱的构建过程如图
