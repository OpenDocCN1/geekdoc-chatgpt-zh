    # ## 思政苑


    # # 机器学习助力“天问一号”精准着陆


    火星上有河流、三角洲、悬崖、沙丘、巨石和陨石坑等复杂环境，怎样在火星上着陆并开展探测？火星探测器能精准着陆火星，得益于背后强大的机器学习算法。


    根据以往火星探测的数据，可以构建一个火星模拟场，模拟火星的土壤、地形、光谱特性等，提前对火星探测器进行数据采集和训练，以帮助训练机器学习算法。火星探测器着陆时的每个动作都由机器学习算法精确计算并记录数据，重复演练着陆期间的每个环节，即着陆过程都被机器学习算法预先精确计算“彩排”，可以帮助提高火星探测器的性能。“天问一号”着陆巡视探测实拍影像如图
    5-24 所示。


    “天问一号”从火星每天向地球发送数十到数百张图像，供科学家们梳理特定的地质特征。科学家们需要根据“天问一号”发回的图像信息进行快速科学决策，在几小时内将决策发送给火星车。任何一位科学家都不可能每天在如此短的时间内仔细查看所有图像，而人工智能研究人员则可以使“天问一号”提前通过图像识别算法来提取图像特征，筛选科学家感兴趣的特定特征图像，将筛选之后的图像发回地球，以此减少科学家们的工作量，从而实现快速高效决策。'
