    # 1.2.2 体验人工智能技术在智能出行领域的应用


    智能出行也称智能交通，是智慧城市的一个重要构成部分，其借助移动互联网、云计算、大数据、人工智能、物联网等技术，将传统交通运输业和互联网进行有效渗透与融合，形成具有“线上资源合理分配，线下高效优质运行”的新业态和新模式；并利用卫星定位、移动通信、高性能计算、地理信息系统等技术，实现城市、城际道路交通系统状态的实时感知，准确、全面地将交通路况通过手机导航、路侧电子布告板、交通电台等途径提供给人们；在此基础上，集成驾驶行为实时感应与分析技术，实现公众出行多模式多标准动态导航，提高出行效率；辅助交通管理部门制定交通管理方案，促进城市节能减排，提升城市运行效率。


    # 1. 智能交通系统


    智能交通系统（intelligent traffic system, ITS）又称智能运输系统（intelligent transportation system），是将数据通信技术、传感器技术、电子控制技术、自动控制理论、运筹学、人工智能技术等有效地综合运用于交通运输、服务控制和车辆制造，加强车辆、道路、使用者三者之间的联系，从而形成的保障安全、提高效率、改善环境、节约能源的综合运输系统。


    目前，世界上智能交通系统应用最为广泛的国家是日本，日本的智能交通系统相当完备和成熟，其次美国、欧洲等国家和地区的智能交通系统应用也非常普遍。中国的智'
  merge: -1
  img_proc: true
- pgno: 19
  md: '能交通系统发展迅速，在北京、上海、广州等大城市已经建设了先进的智能交通系统；其中，北京建立了道路交通控制、公共交通指挥与调度、高速公路管理和紧急事件管理4大智能交通系统；广州建立了交通信息共用主平台、物流信息平台和静态交通管理系统3大智能交通系统。随着智能交通系统技术的发展，智能交通系统将在交通运输行业得到越来越广泛的运用。


    从系统组成的角度，可将智能交通系统分成以下子系统。


    +   1) 先进交通信息服务系统（advanced traffic information system，ATIS）。ATIS 架构示例如图 1-14 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_19_0.png)


    MTD: microwave traffic detector, 双雷达微波交通检测器。


    图 1-14 ATIS 架构示例


    ATIS 建立在完善的信息网络基础上，交通参与者通过装备在道路、车辆、换乘站、停车场以及气象中心的传感器和传输设备，向交通信息中心提供各地的实时交通信息；ATIS
    得到这些信息并进行处理后，实时向交通参与者提供道路交通信息、公共交通信息、换乘信息、交通气象信息、停车场信息以及与出行相关的其他信息；出行者根据这些信息确定自己的出行方式、路线选择。更进一步，当车辆上装备了自动定位和导航系统时，该系统还可以帮助驾驶员自动选择行驶路线。


    +   2) 先进交通管理系统（advanced traffic management system，ATMS）。ATMS 架构示例如图 1-15 所示。


    ATMS 主要是给交通管理者使用的，用于监测控制和管理公路交通，在道路、车辆和驾驶员之间提供通信联系。它对道路系统中的交通状况、交通事故、气象状况和交通'
  merge: -1
  img_proc: true
