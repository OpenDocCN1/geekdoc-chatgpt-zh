    +   4) 商品销售是指商品经营企业通过货币结算出售所经营的商品，转移所有权并取得销售收入的交易行为。


    这些活动的主要参与者包括商品生产者、商品经营者和商品消费者，以及为这些商业活动提供金融服务的以银行为代表的第三方金融业者。服务于现代商业活动的关键技术主要是指为了实现以商品识别智能化、商品流通可视化、网上购物场景化和支付方式便捷化为目标的物联网、大数据、云计算、人工智能、区块链等技术手段。


    # 1. 商品识别


    目前条码技术和射频技术已经被广泛应用于制作商品标签，这为实现商品识别智能化提供了必要的基础。商品标签是贴在商品上的标志，包括文字和图案。与商品包装的装潢不同，商品标签是为了区别商品的分类、等级、产地、成分、价格等信息，是专用的；而商品包装的装潢是对商品的美化、装饰说明和宣传。


    +   (1) 一维条码


    一维条码又称条形码，是将宽度不等的多个黑条和白条按照一定的编码规则排列，用以表达一组信息的图形标识符。一维条码可以标出物品的生产国、制造厂家、商品名称、生产日期等许多信息，因而在商品生产、流通、销售等许多领域得到广泛的应用。


    目前，常见的一维条码多为 EAN（european article number）条形码。图 1-57 所示为标准版条形码，用 13 个数据位来表示，分为
    4 个部分。从左到右，1～3 位是中国的国家编码，由国际分配；4～7 位是生产厂商编码，由国家分配；8～12 位是产品编码，由厂商自行确定；最后 1 位是校验码，根据一定的算法，由前面
    12 位数字计算得到。


    ![](img/70810124a73792907f3adecdd1e14f54_45_0.png)


    图 1-57 EAN 条形码示例


    +   (2) 二维条码


    二维条码又称二维码，是在一维条码的基础上扩展出的一种具有可读性的条码。设备扫描二维条码，通过识别条码的长度和宽度中所记载的二进制数据，可获取其中包含的信息。相比一维条码，二维条码可以记录更杂的数据，如图片、网络链接等。目前，常见的二维条码为
    QR（quick response）二维码，可将其简单理解成在水平和垂直方向构成的二维空间的存储信息的条形码，如图 1-58 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_45_1.png)


    图 1-58 QR 二维码示例


