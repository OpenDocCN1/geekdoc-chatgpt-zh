  md: "# 3. 算法的未来\n\n算法是实现人工智能的根本途径，是挖掘数据智能的有效方法。当前，机器学习算法是主流算法，它是从数据分析中获得规律，并利用规律对未知数据进行预测的算法，深度学习是其最热门的一个分支。近年来深度学习的发展达到了高潮。但是此路径发展带来的算力需求问题恐将较难持续，如图\
    \ 8-8 所示。\n\n![](img/70810124a73792907f3adecdd1e14f54_184_0.png)\n\n图 8-8 深度学习模型算力需求与算力发展对比\n\
    \n根据 OpenAI 的测算，一方面，从 2012 年开始，训练一个大型 AI 模型对算力需求的年均增长率约为 11.5 倍，而算力提升量的年均增长率只有\
    \ 1.4 倍；另一方面，算法效率的进步，可年均节省约 1.7 倍的算力。这意味着，随着持续追求算法性能的不断提升，每年平均约有 8.4 倍的算力需求赤字。因此，在数据与算力红利正在逐渐消退之际，人工智能技术未来发展的核心驱动力将主要依靠算法层面的突破与创新。\n\
    \n在 2021 年举办的“第十六届 CCF 全国高性能计算学术年会”上，中国工程院副院长陈左宁院士提出未来人工智能模型和算法的发展趋势如下：\n\n+ \
    \  1）算法将向无监督方向发展，以适应“小数据”，减少对标注数据的需求和计算开销。\n+   \n+   2）利用现有软件框架增加解释技术接口或构建以人为中心的人工智能系统，提升算法的可解释能力。\n\
    +   \n+   3）多种算法和模型将有机结合，分布式和分散式的需求会越来越突出，深度推理将进一步发展。\n+   \n+   4）人工智能应用需求应该关注算法的全生命周期，人工智能也将进一步走向自学习和自演化。\n\
    \n# 8.2.2 中国人工智能发展的“三步走”战略\n\n2017 年，国务院印发《新一代人工智能发展规划》，提出了面向 2030 年的我国新一代人工智能发展的指导思想、战略目标、重点任务和保障措施，目标是构筑我国人工智能发展的先发优势，加快建设创新型国家和世界科技强国。"
