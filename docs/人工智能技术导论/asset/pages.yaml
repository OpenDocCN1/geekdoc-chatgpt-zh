    # 思政范


    # 智能语音说方言，听取乡情一片


    “少小离家老大回，乡音无改鬓毛衰。”方言传递一方乡音，不仅是地域风物的承载，更体现着中华传统文化的赓续。方言在于交流，方言的根基是普通老百姓的使用。可是，随着城镇化进程的推进和网络传播的迅速发展，方言在年轻人文化圈层中的声音渐淡。以吴语为例，吴语源远流长，说吴语的地区包括我国江苏南部、上海、浙江大部分地区、安徽南部、江西东北部、福建西北部、香港、台湾，以及日本九州岛、美国旧金山等地。今日的吴语发音者稀缺，加上吴语方言地区分布广、地域差别大，所谓“十里不同音”，这些都为收集方言带来了难度。


    让智能语音说出流利普通话已经很难，更别提要合成有着 28 个声母、49 个韵母、8 个声调的吴语了。为了让人工智能说一口流利的吴语，保护这一历史悠久的方言文化，讯飞语音技术团队攻关
    3 年，最终人工智能吴语诞生了。目前，该技术已应用于方言保护公益短片《姑苏颂记》的配音工作中。利用人工智能通过语音赋能方言传承，不仅希望乡音能够激发乡情，唤起乡音记忆，也希望更多年轻人用实际行动参与方言保护。'
