- pgno: 12
  md: '# 1.1 项目描述


    随着以人工智能为代表的新一代信息技术的蓬勃发展，以及“智能+”概念的兴起，人工智能技术加速普及，智慧医疗、智能出行（也称智能交通）、智能制造、智慧农业、智慧商业等新概念应运而生。


    本项目重点介绍人工智能技术在上述领域的应用现状及发展趋势。


    # 1.2 知识准备


    # 1.2.1 体验人工智能技术在智慧医疗领域的应用


    智慧医疗（wise information technology of med, WITMED）是近年来兴起的专有医疗名词，是一种基于物联网的，通过打造健康档案区域医疗信息平台，利用大数据、人工智能和区块链等技术，实现患者与医务人员、医疗机构、医疗设备之间的互动，用于进一步提升医疗服务质量的新兴医疗手段。智慧医疗由智慧医院系统、区域卫生系统和家庭健康系统
    3 部分组成。


    +   1. 智慧医院系统


    智慧医院系统由数字医院和提升应用两部分组成。


    +   (1) 数字医院


    数字医院包括以下 4 部分，用于实现病人诊疗信息和行政管理信息的收集、存储、处理、提取及数据交换。


    1) 医院信息系统（hospital information system, HIS）指利用计算机软硬件技术和网络通信技术等现代化手段，对医院及其所属各部门的人流、物流、财流进行综合管理，对在医疗活动各阶段产生的数据进行采集、存储、处理、提取、传输、汇总，加工形成各种信息，从而为医院的整体运行提供全面的自动化管理及各种服务的信息系统。医院信息系统基本架构示例如图
    1-1 所示。


    2) 实验室信息管理系统（laboratory information management system, LIMS）是以数据库为核心的信息化技术与实验室管理需求相结合的信息化管理系统。其管理的对象主要是与实验室有关的人、事、物、信息、经费等。实验室信息管理系统利用大数据、人工智能等技术实现实验数据的自动采集和分析，并结合网络化技术，优化实验室的业务和管理流程，从而极大提高了实验室的检测效率，降低了实验室运行成本，并且能有效进行问题的快速溯源，克服了传统实验室手工作业中存在的各种弊端。实验室信息管理系统基本架构示例如图
    1-2 所示。'
  merge: -1
  img_proc: true
