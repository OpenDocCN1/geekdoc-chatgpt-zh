  md: '语音直接转化，这种特性也是“端到端”这一名称的由来。端到端的语音合成仅适用于英语等文本和其读音相关联的语言，而中文汉字和其读音几乎没有关联，因此，对于中文语音合成，输入文本序列在通过声学特征生成网络之前要先经过一个文本前端处理模块，其功能是为中文文本添加韵律信息，并且将汉字转换为与发音相关联的拼音或音素序列。深度学习语音合成流程如图
    7-18 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_173_0.png)


    # 图 7-18 深度学习语音合成流程


    要实现较好的后端处理效果，通常还需要解决音库扩展、统计优化和参数寻优问题。

    （1）音库扩展

    在传统的波形拼接后端处理中，音库的优劣是后端处理效果的决定性因素。例如，在功能机时代，多数厂商为节省存储空间，使用的都是“极简音库”，设备对于多音字的音库支持极其有限，类似“春去花还在，人来鸟不惊”中的“还”字读音就经常出现错误。音库的扩展面临的是存储空间的成倍增加，一般英文较少存在多音字现象，故需要专门针对中文进行重新设计。目前，较好的解决方案是使用云音库，将大数据技术和语音技术融合。云音库示例如图
    7-19 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_173_1.png)


    # 图 7-19 云音库示例


    （2）统计优化

    在后端处理中采用的 HMM 需要提前训练好，而执行不同合成任务的模型并不能通用，因此需要预先统筹多种 HMM。例如，同一台录音设备可能今天用于会议，明天用于演讲等。不同的场景对于统计模型的要求不同，如何针对多种场景需求构建多套模型或者通用性较强的模型是较为关键的问题。


    （3）参数寻优

    基于深度学习的语音合成技术的关键在于专用神经网络的构建和训练，语音合成属'
