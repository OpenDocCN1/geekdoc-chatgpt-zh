  md: '基于统计参数的语音合成技术的基本原理是使用统计的方法对文本特征与声学特征之间的关系进行建模，利用训练好的模型预测输出声学特征。该方法首先提取输入信息的语言特征，然后使用统计的方法从文本特征生成声学特征（基频、时长、频谱等），最后使用声码器将声学特征转换为语音波形。语音合成流程如图
    7-16 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_172_0.png)


    图 7-16 语音合成流程


    在众多统计参数语音合成方法中，基于 HMM 的统计参数语音合成方法最为成熟。基于 HMM 的统计参数语音合成方法使用基频和线谱对或频谱作为语音的特征参数，输入文本经过文本分析得到上下文特征（音素、韵律等），使用
    HMM 构建声学模型，同时对语音的基频、频谱和时长进行建模，在训练过程中建立文本特征到声学特征之间的映射关系。统计参数语音合成方法目前已被广泛应用，例如我们日常使用的输入法中的常用词汇联想功能就是基于统计参数语音合成方法实现的。假设用户经常输入“我爱中国，我是中国人”，软件内置的统计模型会根据输入频率预测用户的输入习惯，当用户在键盘上输入“我爱”之后，统计模型根据用户习惯会显示“中国”。统计模型预测示例如图
    7-17 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_172_1.png)


    图 7-17 统计模型预测示例


    基于深度学习的语音合成技术主要有两个方向：一个是利用深度学习替代传统方法中的 HMM 的统计模块；另一个是利用深度学习进行端到端的语音合成，其基本原理是将从文本和语音样本中提取出的特征输入专用神经网络进行训练，等神经网络能够以较高的准确率将单元文本与单元音节对应之后，再利用训练好的神经网络对新的本文进行'
