  md: '# ## (2) 非手术诊疗机器人


    非手术诊疗机器人主要包括配药机器人、放疗机器人、胶囊机器人和影像辅助机器人等辅助诊断治疗的机器人系统。


    +   1) 配药机器人是替代人工配药作业的新方式，是提高药品库存管理质量和药品使用效率的新型工具。


    +   2) 放疗机器人的图像引导治疗手段能够实施术中导航以及术后评估治疗效果，有效降低手术的创伤，提高治疗的精度，使患者尽早康复，减少复发可能性。其一般由影像引导系统、治疗计划系统和治疗实施系统
    3 部分组成。


    +   3) 胶囊机器人是胃肠部检查的新型方式，这种方式避开了胃镜的插管，医护人员利用磁场技术对胶囊内镜实现体外遥控，受检者检验全程无须麻醉，可以做到无痛、无创、无交叉感染，检查后胶囊机器人经消化道排泄出体外，一次性使用。


    +   4) 影像辅助机器人用于整合现有的多种成像系统，能够将 X 光、磁共振成像、超声成像、正电子发射型计算机断层显像等多种成像手段集于一体，能够实现 360°
    的全景成像并进行大范围的三维图像重建。影像辅助机器人还包括帮助医生阅片的阅片机器人，可高效完成疾病筛查、定位病灶、定量标注、科学诊断等一整套医学影像识别流程，全面覆盖肺部
    CT、骨龄、乳腺肿块、X 光等十几种常见的医学影像识别场景，并兼具快速的识别速度和极高的识别准确率，是未来人工智能与医疗健康结合的主要应用场景。


    # ## (3) 康复机器人


    自 20 世纪 90 年代美国麻省理工学院 Hogan 教授带领团队研制出 MIT-MANUS 末端式上肢康复机器人后，机器人在功能康复与辅助方面的应用也得到了国际学术界、工业界及临床康复界的广泛关注。康复机器人是应对人口老龄化、医疗资源需求增长的重点，因为涉及人类生命健康的特殊领域以及潜在的经济市场，已经被多个国家列为战略性新兴产业。


    # ## (4) 医疗服务机器人


    医疗服务机器人能够在限定的医疗环境中提供高精度、高强度、长时间的医疗服务，目前由于医护人员的缺少，医疗服务机器人的需求越来越大。医疗服务机器人的工作重点也在于帮助医护人员分担一些沉重、烦琐的运输工作，提高医护人员的工作效率，如抬起病人去厕所或为大小便失禁的病人更换床单等。一些医疗服务机器人还用来辅助护士完成药品、医疗器械等的投递工作。


