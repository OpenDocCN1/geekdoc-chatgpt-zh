    # 4. 模拟退火算法


    模拟退火算法来源于固体退火原理，将高温物体徐徐冷却，慢慢达到一个稳定的状态。高温时，内部粒子内能大，粒子可能在固体内部的任何地方活动；当温度慢慢冷却，粒子内能减少，活跃度降低，活动范围慢慢减小；当固体冷却完毕或者达到平衡稳定时，粒子的位置就固定了，就可以获取最优解。


    模拟退火算法的主要思想是：在搜索区间随机游走，再利用蒙特卡洛模拟（Metropolis）抽样准则，使随机游走逐渐收敛于局部最优解。


    如图 4-7 所示，采用模拟退火算法求函数 f(x)的全局最小值。


