- pgno: 176
  md: '词。正确的写法应该是 “I’m at school”，这是译文综合中较为重要的功能。


    # 4. 译文朗读


    将翻译完成之后的内容朗读输出呈现给用户，语音翻译才算真正完成。与语音输入类似，机器只能够识别二进制码，在机器内部完成的翻译的体现形式也是二进制码，译文朗读阶段只需要将译文的二进制码转换成目标语言的声音信号，即可形成人类可理解的译文朗读。


    # 7.3 项目实施


    # 7.3.1 案例鉴赏：智能客服机器人


    “您好，欢迎致电××，我是语音助手××，请直接说出您要办理的业务。”拨打部分银行客服电话、运营商客服电话时，经常会听到这样的提示。当前，智能客服机器人已成为不少客服中心的“标配”。近年来，受互联网金融冲击、净利润增速趋缓等因素的影响，很多企业面临着服务质量及用工成本的双重挑战。为了改善服务质量，降低营业成本，各企业纷纷布局人工智能应用领域。智能客服机器人的工作原理分解一下，大概是个什么样子的呢？


    智能客服机器人的工作原理主要是在人机对话过程中模拟人工客服的听、说、理解和决策这 4 项能力。首先，用户说了一句话，智能客服机器人会先听是什么，把用户的话通过语音识别转化成文本。第二个环节是理解客户话语的意图，实际上，这一段文本转化成意图之后，计算机才能去处理这个意图节点相关的数据标签。最关键的环节叫作决策，怎么去响应用户，是用问句还是用回答，或是用其他内容，这是一个决策的过程。决策完之后，就会用到自然语言生成技术，生成一段对应的话术。最后一个环节，把话术通过语音合成技术形成一个声音信号播放给用户听。整个听、说、理解和决策这
    4 项工作需要在几百毫秒以内完成，这样用户才有及时对话的响应，才没有卡顿的现象。


    # 7.3.2 训练实操：同声翻译 APP


    在很多需要与外籍人员接触的场合，语言不通往往让人十分苦恼。这个这时候不用担心，选择合适的同声传译 APP 足以让人们从容应对多种外语的同声传译需求。


    目前，各大软件市场已有多种具备同声传译功能的 APP，其使用过程是，先选择需要进行同声传译的语种（可以是英语、法语、德语等），然后在 APP 的提示下用母语说出需要翻译的话，稍等片刻后，翻译好的文字就会呈现在屏幕上，同时这段文字会以语音的形式进行播报。


    下面以“腾讯翻译君”同声翻译软件为例进行同声翻译软件的实操训练。


    +   步骤一：进入应用市场下载安装同声翻译软件，界面如图 7-22 所示。


    +   步骤二：打开 APP，并赋予必要的使用权限。从界面下方往上滑动，进入同声传译'
