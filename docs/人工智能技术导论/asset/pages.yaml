  md: 'EMS 是一个特殊的系统，它的基础是 ATIS、ATMS 及有关的救援机构和设施，通过 ATIS 和 ATMS 将交通监控中心与职业的救援机构联成有机的整体，为道路使用者提供车辆故障现场紧急处置、拖车、现场救护、排除事故车辆等服务。


    # 2. 电子地图


    电子地图（electronic map）即数字地图，是利用计算机技术，以数字方式存储和查阅的地图。目前，主流品牌的互联网电子地图产品主要有百度地图、高德地图、搜搜地图、图吧地图、天地图等。电子地图的数据一般包含地理底图数据、卫星影像数据、三维数据和街景数据
    4 部分。


    # (1) 地理底图数据


    1) 地理底图数据是电子地图的核心，可以看成是传统纸制地图的电子版，除了地图显示外，还支持地图的放大与缩小、地址查询、路径规划等功能。在日常使用过程中，如查询某个地点、查询两个地点之间的路径等所使用的都是这部分数据。这部分数据主要包含道路、POI（points
    of interest，兴趣点，商用地图主要采集饭店、宾馆、加油站、洗手间、ATM 等与人们生活息息相关的兴趣点）、行政区划、河流、绿地、居民区等数据。


    在商用地图中，道路数据用于支撑路径规划，POI 数据用于支撑地址查找，这是商用地图的使用重点。其中，道路数据的获取一般需要实地开车沿道路行驶，通过摄像机记录道路实景，主要拍摄限速标志、路牌等，并依赖北斗或全球定位系统（global
    positioning system，GPS）记录行车位置信息，然后进行数据编辑；也可以利用卫星遥感进行道路图像勾绘。POI 数据的获取一般依靠实地采集或众包采集。行政区划、河流、绿地等数据多使用卫星遥感图像勾绘，以降低成本。


    2) 路况信息即为实时交通状况信息，一般以图层形式放置于地理底图数据之上使用。这部分数据有 3 种获取方式：一是以行业运营车辆（如出租车、物流车）作为浮动车，通过北斗或
    GPS 车载装置和无线通信设备，将车辆行驶信息（如时间、速度、坐标、方向等参数）实时地传送到浮动车信息中心，经汇总处理后生成反映实时道路路况的交通信息；二是通过在道路上安置传感器来实时获取路段的车辆通行频次，进而计算交通流量；三是通过手机地图的使用者提供实时交通信息[其属于用户生产内容（user
    generated content，UGC），UGC 将是未来交通信息采集发展的大趋势]，然后再通过对多来源的实时数据进行融合与分析，有效提高交通信息预测的质量。


    另外，交通信息的预测还必须有历史数据的支持，通过历史交通公共出行记录，使用人工智能预测模型计算出结果后，再利用大量的用户数据反向抽查，并利用反馈数据来调整预测模型，使预计到达时间（estimated
    time of arrival，ETA）更为精准。


    # (2) 卫星影像数据


    1) 正射影像数据（见图 1-21）可以理解为卫星从高空垂直俯瞰地面所拍摄的照片。因为地理底图数据是通过一定的地理抽象而绘制出来的，在空间上并不连续，而卫星影像数据可以展示完整的地形地貌状况，因此能很好地补偿地理底图数据存在的误差。'
