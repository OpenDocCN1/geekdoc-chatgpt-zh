- pgno: 124
  md: '# 5.1 项目描述


    机器学习（machine learning, ML）是人工智能的一个子集。其主要任务是指导计算机从数据中学习，然后利用学习到的“经验”来改善自身的性能。在机器学习中，算法会不断进行训练，从大型数据集中发现模式和相关性，然后根据数据分析结果做出最佳决策和预测。机器学习应用具有自我演进能力，它们获得的数据越多，准确性就会越高。


    本项目带领大家初步认识机器学习，主要内容有了解机器学习的具体定义、算法分类和应用流程，以及机器学习的子类——深度学习；鉴赏智能制造领域的数字孪生、边缘计算、预测性维护模型；最后通过两个训练实操来进一步认识机器学习。


    # 5.2 知识准备


    # 5.2.1 机器学习简介


    机器学习是一类算法的总称，这些算法试图从大量历史数据中挖掘隐含的规律，得出某一模型，然后利用此模型进行预测或者分类的一种方法。这个过程跟人的学习过程有些类似，比如人获取一定的经验，可以对新问题进行预测。具体地说，机器学习可以看作是寻找一个函数，输入是样本数据，输出是期望的结果，只是这个函数过于复杂，以至于不太方便形式化表达。机器学习的目标是使学到的函数能很好地适用于“新样本”，而不仅仅是在训练样本上表现很好。学到的函数适用于新样本的能力，称为泛化能力。


    机器学习算法中最重要的就是数据，根据使用的数据形式，主要可以分为监督学习（supervised learning）、无监督学习（unsupervised learning）、弱监督学习（weakly
    supervised learning）和强化学习（reinforcement learning）。机器学习思维导图如图 5-1 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_124_0.png)


    图 5-1 机器学习思维导图'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 5.2.2 机器学习算法


    # 1. 监督学习


    监督学习是使用标注好类别的数据集对机器进行训练。例如，将标注“猫”的图片输入机器进行学习，机器就能识别预测出其他的“猫”的图片。利用足够多的已知输入/输出去训练机器，量变触发质变，最终机器能够预测未来。常见的监督学习算法有朴素贝叶斯（naive
    Bayes，NB）、逻辑回归（logistic regression，LR）、支持向量机（support vector machine, SVM）、决策树（decision
    tree, DT）、K 近邻（K-nearest neighbor, KNN）分类等。监督学习示例如图 5-2 所示。


    ![](img/70810124a73792907f3adecdd1e14f54_125_0.png)


    图 5-2 监督学习示例


    # 2. 无监督学习


    无监督学习是使用未标注的数据集输入机器进行训练，让机器自己去发现数据中隐藏的模式或内在结构。经过足够多次数的迭代后，机器通常能够通过未知的输入/输出学习到隐含的运算规则。无监督学习示例如图
    5-3 所示。例如，输入序列有① “2+2”、② “1+1”、③ “4+4”，输出序列有① “4”、② “2”、③ “8”。


    ![](img/70810124a73792907f3adecdd1e14f54_125_1.png)


    图 5-3 无监督学习示例'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/70810124a73792907f3adecdd1e14f54_126_0.png)


    # (b)


    # 图 5-3 (续)


    # 3. 弱监督学习


    弱监督学习与传统的监督学习相比，其使用有限的、含有噪声的或者标注不准确的数据来进行模型参数的训练。弱监督学习是利用已知数据和其一一对应的弱标签来训练一个智能算法，并将输入数据映射到一组更强的标签的过程。标签的强弱指的是标签蕴含的信息量的多少。


    如果有一幅复杂的图，图上有一只猫，还有一系列复杂的背景，如图 5-4 所示。如果仅仅告诉机器图上有一只猫，这就是只赋予了机器一个弱标签，然后需要机器把猫在哪里、猫和背景的分界在哪里找出来，这就是一个基于弱标签去学习强标签的过程。


    ![](img/70810124a73792907f3adecdd1e14f54_126_1.png)


    # 图 5-4 背景复杂的猫


    # 4. 强化学习


    强化学习也是使用未标记的数据，但是是可以通过某种方法知道距离正确答案越来越近还是越来越远（即奖惩函数），强调的是如何基于环境而行动以取得最大化的收益，强化学习类比于人与环境交互。


    例如，在夜间得不到良好照明的环境下开车，司机在几乎完全黑暗的情况下驾驶，如何保障车辆行驶在道路上呢？只能够通过方向盘的触感，如果感觉车轮撞击了异物（错误答案），则需要回转方向盘让车辆回到道路上（正确答案）；实际上扫地机器人等'
  merge: -1
