    众所周知，制造和使用工具是人类区别于其他动物的标志，是人类劳动过程独有的特征。从几百万年前徒手打制的石器到当代智能化工厂的制造设备，人类的发展和社会生产关系的变化就是生产工具日渐先进的结果。考虑到生产工具是在人们生产过程中用来直接对劳动对象进行加工的物件，因此生产工具必然会朝着高效率、自动化、智能化等特性发展。接下来，将依托生产工具的变化介绍人类发展的不同时代。


