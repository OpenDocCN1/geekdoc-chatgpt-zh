    # 5. 图像识别


    图像刺激作用于感觉器官，人们辨认出它是以前见过的某一图像的过程，叫作图像再认。在图像识别中，既要有当前进入感官的信息，也要有记忆中存储的信息，只有通过存储的信息与当前的信息进行比较的加工过程，才能实现对图像的再认。


    图像识别是以图像的主要特征为基础的。每个图像都有它的特征，如字母 A 有个尖，P 有个圈，而 Y 的中心有个锐角等。对图像识别时，对眼睛运动的研究表明，视线总是集中在图像的主要特征上，也就是集中在图像轮廓的地方，这些地方的信息量最大，而且眼睛的扫描路线也总是依次从一个特征转到另一个特征上。由此可见，在图像识别过程中，知觉机制必须排除输入的多余信息，抽出关键的信息。同时，在大脑里必定有一个负责整合信息的机制，它能把分阶段获得的信息整理成一个完整的知觉映像。图像识别的特征提取非常重要，图像识别主要是根据图像的特征进行分类，同一相似特征的图像分为一类，不同相似特征的图像分为不同的类。


    为了编制模拟人类图像识别活动的计算机程序，人们提出了不同的图像识别模型，如模板匹配模型。这种模型认为，识别某个图像，必须在过去的经验中有这个图像的记忆模式，又叫模板。当前的图像输入如果能与计算机中存储的模板相匹配，这个图像也就被识别了。这种模型简单明了，也容易得到实际应用。但这种模型强调图像必须与初始的模板完全符合才能加以识别，因此只能识别与初始模板相类似的图片。而事实上，人不仅能识别与大脑中的模板完全一致的图像，也能识别与大脑中的模板差别较大的图像。


    基于特征的图像识别需要人为选择可以区分的特征，我们很难设计出应对多种识别任务的特征，而且即使精心设计了图像特征，计算机对图像的理解仍然可能和人类存在很大的差异，如需要识别特征非常相似的一张人脸和一张猫的照片，对于特征识别来说，因为特征相似，计算机在模板库中找到相似的模板，会把它们归属为同类，而不会区分一张是人的照片，一张是猫的照片。因此，基于特征的识别方法仍有很多问题。


    随着技术的发展，人们开始寻找其他方法来进行图像识别。近些年来，深度学习在图像识别领域取得了长足的发展。深度学习应用到图像识别领域，避免了人工设计图像特征这项令人头痛的工作。例如，区分猫和狗，只需要把各种猫和狗的照片送入神经网络中，神经网络根据标有猫和狗标签的照片，通过深度学习去自动地学习猫和狗的特征，而不必告诉它猫和狗各自有哪些特征，只需对神经网络获取的猫和狗的特征，使用未进行标记的猫和狗的照片进行验证，看它是否能正确区分猫和狗，如果不能，重复学习，再进行验证，直到验证通过；然后投入实际应用，对新的没有标记的猫和狗的照片，神经网络就能正确地判断出它是猫还是狗。


    至于神经网络提出来的猫和狗的特征究竟是什么，我们并不知道，也不需要关心。这个过程和人类的学习过程非常相似。当我们教孩子识别猫和狗时，只要让他们看到各种猫和狗的照片，同时告诉他这是猫还是狗，并且与实际的猫和狗进行对照，经过一段时间之后，他基本上就可以认识了。我们并不用给孩子详细描述猫和狗在外观上的区别，只需要告诉他这是猫还是狗，一开始他也许会认错，但是只要立刻纠正并告诉他正确答'
