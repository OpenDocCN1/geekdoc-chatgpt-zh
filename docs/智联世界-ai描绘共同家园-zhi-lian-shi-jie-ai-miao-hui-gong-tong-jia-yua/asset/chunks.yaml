- raw: "另一个重要领域是健康医疗。我们可以看到，5G和AI如何变革健康医疗领域，支持更准确的早期诊断、健康监控，以及药品与疫苗开发，实现这一切的关键也在于连接。仅在美国，预计到2030年，50%的医疗服务将在线上进行。借助科技，你能够享有优质视频、海量数据支持的影像和研究，以及实时的AI交互。仅凭这一领域一小步的技术革新，韩国急救人员已经能够利用5G连接的360度摄像机从急诊室向医生实时传输数据。对于影响全球GDP近10%的医疗行业来说，科技和AI将帮助其扩大覆盖范围、改善体验并降低成本。\n\
    \n我们再谈谈工作效率和生产力的未来，这是另一个正在发生变革的重要转型领域。企业工作流向云端迁移可以更智能地优化数据管理，系统必须支持随时随地的工作，而网络连接帮助提高了生产力，数据与云和AI正紧密相连。最近几个月，84%的组织表示可能继续实行部分居家办公或远程办公，很多企业甚至开始重新思考，如何融合数字空间和实体世界，科技和AI辅以扩展现实（XR）、增强现实和全息远程支持全新的工作方式。企业的转型才刚刚开始。\n\
    \n零售业是会受到重大影响的另一个领域。5G和AI能够从端到端变革零售业，范围覆盖智能供应链、物流管理以及全新的店内体验等方方面面。在5G环境下，无界XR（boundless\
    \ XR）、分离渲染和AI处理技术能带来个性化的购物体验。你可以在橱窗看到AI为你定制的商品推荐，甚至在展示中看到自己如照片般逼真的图像。高吞吐量、低时延的5G\
    \ XR眼镜还将利用云和终端侧智能，把虚拟物体映射到真实世界，其中蕴藏着重大机遇。\n\n当我们考虑产业时，我们不得不谈到制造业。目前制造业正经历着重大变革，我们可以看到智能互联带来的变化。5G和AI将推动实现新一代可重新配置、灵活的生产制造。企业专网将通过高度可靠的5G网络来提供安全的工业数据管理，并且根据需求，数据处理将在终端和边缘云或本地服务器之间分别进行。5G超可靠、低时延的特性，将实现对机器的工业级远程控制，具备端到端跟踪与控制功能的智能操作，将把生产力提升到更高水平。我们甚至将看到从未想象过的创新。\n\
    \n最后，5G和AI将为交通运输业开启光明的未来。随着我们将汽车连接到云端，技术已经在改变交通运输业。我们期待5G和AI使汽车变得更加智能，汽车将拥有智能驾驶舱、自动驾驶与数据分析能力和全新服务。从安全角度，随着我们将车与车、车与基础设施和车与行人相连接，5G\
    \ C—V2X（5G蜂窝车联）有望让出行更安全、更高效、更愉悦。路侧基础设施将利用AI辅助摄像头感知和实施交通流量管控，在计算平台中将传感器和AI相结合，将使十字路口变得更加安全。5G商用还可充分利用路侧单元和公共网络小型基站的组合，在智慧城市和运营商之间创造高效协同。这是交通运输业潜在的巨大变革。\n\
    \n以上谈到的所有这一切必须通过合作来实现。智能互联的未来需要多家公司通力协作，高通公司一直致力于在全球生态系统内实现合作，并通过合作创造新技术。释放AI在云端、边缘侧和终端的全部潜力，这将无比振奋人心。5G将是智联万物的连接平台，对于移动行业的所有参与者而言，这意味着巨大的机遇。\n\
    \n\uFEFF\n\n5G时代的AI创新\n\n洪曜庄（John Allen Hoffman）\n\n全球移动通信系统协会（GSMA）首席执行官\n\n\
    ![](images/txt041_1.jpg \"pagenumber_ebook=288,pagenumber_book=272\")\n\nGSMA\
    \ Ltd是全球最大无线通信商贸组织GSMA的全资子公司。作为GSMA Ltd的首席执行官兼董事，负责监管公司多项业务的有效运营，其中包括GSMA屡获荣誉的行业活动、网络媒体、印刷与广播媒体、行业研究及一系列管理式服务等。投身全球无线通信行业已逾25年。在供职于GSMA\
    \ Ltd前，曾担任基于软件的运营商解决方案供应商Fastmobile的首席执行官，在这之前曾担任语音及数据漫游解决方案供应商Roamware的总裁和CEO。\n\
    \n![](images/txt041_2.jpg \"pagenumber_ebook=289,pagenumber_book=273\")\n\n现在全球的移动用户是52亿，整个行业在2019年为全球经济贡献了4.1万亿美元；2025年，5G的互联将会达到18亿；2030年，AI将会对全球贡献16万亿美元，并且推动地方经济增长26%。GSMA代表了750家移动运营商以及相关生态链中的400家。\n\
    \n2019年对于5G至关重要。很多运营商积极更新基础设施来迎合5G的需要，他们愿意斥巨资搞基建，是因为他们看到了5G所带来的大量机会。消费者也意识到了5G的好处，中国、韩国，还有中东的消费者，都非常愿意升级到5G。截止到2020年第二季度末，已经有87个运营商在39个市场实现了5G商用服务，2025年5G的连接将会占到全球所有通信连接的20%，亚洲、北美洲和欧洲的运营商在未来的5年将会投资1.1万亿美元，80%将会用于5G的网络。这些都是好消息，因为AI时代，5G是基础。\n\
    \n亚太地区一直是5G建设的领先者，9个市场已经有了商业的部署，还有12个市场宣布了商用规划。亚太地区的移动运营商预计在未来5年内将投资5000亿美元用于通信基础建设，其中3\
    \ 700亿美元用于5G。到2025年，亚太地区5G的连接将达到11亿，占区域里总连接数的23%。在亚太地区的一些国家，政府和企业都相信数字化是重点。虽然包括5G在内的新技术的推广和建设在疫情冲击下可能会有所延迟，但这只是短期的影响。政府和运营商都认为5G将会更快地推动AI的发展，所以在5G的建设上都将不遗余力。\n\
    \n中国政府和企业对5G和AI进行了大量的投资，北京、上海已经推动了几十亿美元的城市风险投资项目，科技园中也有越来越多的AI企业。中国有比其他国家更多的数据和连接，由于AI靠大数据才能更精确，中国也无疑能从新应用中获益最多。中国人口庞大，AI用户案例较之他国更多、市场预期好，可以更快进行测试。百度、腾讯、阿里巴巴等优秀企业在5G和AI上有巨大的投资，其他私营企业也在不断投资，支持这个行业的发展。可以肯定，我们会拥有一个AI+5G的世界，我们的想象会成为现实。\n\
    \nGSMA在中国具体做什么呢？首先为运营商争取关键的频谱资源至关重要，我们协助并期待政府能在适当的时间给中国移动运营商发放毫米波频谱，推动中国5G的全面发展。GSMA还发布了一些AI的案例分析以及5G的发展战略来帮助中国的企业。GSMA的会员还支持了中国国家电网的智能电网项目、中国移动边缘计算与云计算的项目，把一线的制造商和整个行业生态互联起来。一些新的技术，比如说开放界面的标准等，对于建立一个安全的供应链是非常重要的，5G能满足不同垂直行业的此类需求。5G还能帮助一些垂直行业，如航空业，使用AR、VR来推出新服务。媒体、娱乐业也会因为5G发生巨大的变革，5G能够跨地域提供高清的视频服务。GSMA为此提供了网络切片的模板，并且不断做网络切片的融合，通过这些帮助和引导，希望能够提供卓越的娱乐体验。\n\
    \nGSMA在AI方面也加强了业界和学术界的合作。比如，GSMA和美国加州大学伯克利分校联合开发了AI课程，让学生开发一些新的用户的案例，希望能够产生5G方面的成功应用。中国联通也参与其中，他们在5G及物联网方面都有新的项目参与，比如无人机、新冠疫情、5G覆盖、应急预案等。此外，GSMA与英国一家AI研发机构合作，帮助移动运营商更好地应用AI。GSMA还和英国的牛津大学、剑桥大学、伦敦大学学院合作，侧重的领域包括能源、网络优化、5G用户案例、物联网、垂直行业和网络安全。5G和其他垂直行业的融合会创造前所未有的场景，尤其在农业方面，5G能够为农民更好地进行作物长势、病虫害防治等方面的分析，节省农药与化肥，实现农业绿色的持续发展。在交通领域，5G可以更好地推动智能城市的发展，在应急服务领域提供更好的解决方案。\n\
    \n5G将会推动AI、大数据和物联网的发展，所以我们希望所有政府能够支持移动行业的发展，降低相应的税收负担，并提供更多的政策支持。云计算和边缘计算结合起来，将会为企业创造更多的用户案例。\n\
    \n2020年，5G技术正在改变我们的生活和工作的方式，GSMA的愿景是释放互联的潜力，让这个社会持续繁荣与发展，我们要跨出一步来推动AI之下的互联！\n\n\
    \uFEFF\n\n人工智能与多学科交叉融合\n\n陈 杰\n\n中国工程院院士，IEEE/IFAC会士，同济大学校长\n\n![](images/txt042_1.jpg\
    \ \"pagenumber_ebook=293,pagenumber_book=277\")\n\n“复杂系统智能控制与决策”国家重点实验室主任、中国自动化学会副理事长、中国人工智能学会副理事长。主要研究方向为动态环境下复杂系统的多指标优化与智能控制、多智能体协同控制等。近年来，以第一完成人获国家自然科学二等奖1项、国家科技进步二等奖2项、省部级一等奖4项以及何梁何利基金“科学与技术进步奖”。发表SCI收录论文100余篇，以第一发明人获授权发明专利40多项，出版学术专著4部，教材和译著各1部。\n\
    \n何积丰\n\n中国科学院院士，中国科学院人工智能创新研究院学术委员会委员\n\n![](images/txt042_2.jpg \"pagenumber_ebook=294,pagenumber_book=278\"\
    )\n\n中国科学院院士，著名计算机软件科学家。现任中国科学院人工智能创新研究院学术委员会委员、上海市人工智能战略咨询专家委员会委员、上海市人工智能产业安全专家咨询委员会主任、华东师范大学终身教授、华东师范大学软件学院创院院长、上海工业控制系统安全创新功能型平台（上海工业控制安全创新科技有限公司）首席科学家。长期从事计算机软件理论及应用研究，针对软件的复杂性、正确性和可靠性等问题开展了系统性的研究。他是程序统一理论创立者、数据精化完备理论奠基者、可信软件设计理论与技术开拓者，其研究成果是保障人工智能应用安全可信的关键手段，是安全可信人工智能领域的领军人物。开创性提出的可信人工智能原则，得到G20全球领袖吸纳认可，为推进安全可信人工智能产业发展做出奠基性贡献。\n\
    \n张成奇\n\n悉尼科技大学副校长\n\n![](images/txt042_3.jpg \"pagenumber_ebook=295,pagenumber_book=279\"\
    )\n\n2017年2月27日被悉尼科技大学聘为杰出教授，2017年12月1日被任命为悉尼科技大学副校长（中国科研合作）。自2005年11月起，连续当选为澳大利亚计算机学会澳大利亚人工智能理事会理事长。2019年8月被任命为2024年国际人工智能联合会大会主席。1982年3月在复旦大学获得学士学位，1985年3月在吉林大学获得硕士学位，1991年10月在澳大利亚昆士兰大学获得博士学位，2002年10月在迪肯大学（Deakin\
    \ University）获得科学博士学位（高级博士学位）。重点研究领域是数据挖掘及其应用。发表300余篇科技论文，其中包括在国际权威期刊上发表的诸多论文。澳大利亚计算机学会会士（ACS\
    \ Fellow）和IEEE计算机学会高级会员。还担任世界三大学术顶会的主席、程序委员会主席或组织主席，包括ICDM—2010、KDD—2015及IJCAI—2024。\n\
    \n梅 宏\n\n中国科学院院士，上海交通大学人工智能研究院院长\n\n![](images/txt042_4.jpg \"pagenumber_ebook=296,pagenumber_book=280\"\
    )\n\n中国科学院院士，发展中国家科学院院士，欧洲科学院外籍院士，电气和电子工程师协会会士（IEEE Fellow）。主要从事软件工程和系统软件领域的研究，在构件化软件中间件、开发方法学和工具环境等方面取得了系列成果。发表学术论文150余篇，多次获国际会议最佳论文与优秀论文荣誉。获国家技术发明专利授权10余项。承担了数十项国家级科研项目，2次担任国家973计划项目首席科学家。曾获国家技术发明一等奖和二等奖、国家自然科学二等奖、国家科技进步二等奖等科技成果奖励。历任国家863计划专家组成员、组长，国家“核高基”科技重大专项专家组成员，全国信息技术标准化技术委员会大数据标准工作组组长，国家重点科技研发专项“云计算与大数据”实施方案编制组组长、总体组组长，国家“科技创新2030—重大项目”大数据重大项目立项建议和实施方案编制组组长。\n\
    \n![](images/txt042_5.jpg \"pagenumber_ebook=297,pagenumber_book=281\")\n\n陈杰：人工智能下一步的基础创新，可以从不同学科中吸取非常重要的养分，比如数学、脑科学、物理学，甚至哲学、心理学等人文科学。这些学科为人工智能未来的发展能够带来哪些新方向？\n\
    \n何积丰：我提出复杂思维组合性研究。当前人工智能的深度学习模型，主要是基于深度神经网络，它继承了我们人类思维信号的传递特性，依赖于训练数据和应用场景。这方面各行业都有自己的经验，它们证明基于数据的机器学习能够给我们带来新的知识、新的认识问题的规律，这是我们已经看到的。\n\
    \n下面我们来谈谈我们遇到什么样的问题。回顾早期艾伦·图灵（Alan Turing）提出智能问题的时候，他的问题是问“机器能够思考吗？（Can machine\
    \ think？）”。而我们现在提的都是机器的学习问题。我认为学习和思考还是有距离的。我们从小学开始，老师给学生灌输知识，这是一个学习过程。但是我们很希望能够举一反三，能够慢慢分析问题、找到问题，这就不属于纯粹学习了。我们觉得应该朝前走一步，这也是为什么我们考虑新的研究领域。\n\
    \n第二个问题，就是机器学习以前，过去很多的人工智能成果主要体现为专家系统，这是基于因果推断的人工智能。分析这种人工智能，我们现在有这样的结论，也就是2011年图灵奖获得者茹代安·珀尔（Judea\
    \ Pearl）说的：“以数据为中心的机器学习所得到的知识经验解释性弱，并且会出现与原本知识完全相反的情况。”茹代安先生举过这样一个例子：过去有数据分析显示人参加锻炼跟我们胆固醇之间存在的关系是，锻炼越多胆固醇越高。这当然不是我们希望得到的结果，我们希望锻炼能使胆固醇降下来。后来发现导致这个结果的主要原因是在机器学习里面少了一个特征值，没有把人的年龄考虑在里面。如果把年龄这个因子考虑进去，就会发现不同年龄段的人锻炼之后都有好的成果。这就是机器学习的短板。\n\
    \n1975年美国一位哲学家杰瑞·福多（Jerry Fodor）提出，思维是可以使用具有语法规则的语言来形式化表征的^([\\[1\\]](#txt042.html#footnote_content_txt042_1))。这个判断我认为并不令人惊奇，人们之间交换思想就是靠语言的，那至少证明语言里具有表达思想的功能。问题在于是不是只有形式化的语言能够表达这样的思维？为什么强调形式化？因为只有形式化语言机器才能消化，否则机器是听不懂的。\n\
    \n假设真的有形式化的语言，我们可以推导出这样一个思维模型，思维的活动是需要向前推进的，这就意味着在人工智能原始创新上，既有基于逻辑的图灵机，也有基于数据和传递的神经网络。换句话说，大脑和神经系统两者都是需要的，不单单是传递信息的问题。\n\
    \n![](images/txt042_6.jpg \"pagenumber_ebook=299,pagenumber_book=283\")\n\n下面我们回到复杂思维组合性本身。先举一个简单的例子。关于牛顿发现三大定律，人们一直传说，他坐在苹果树下，苹果掉在他头上了，这就是很片面的数据知识。经过加工和消化以后，才形成最后一个定理，即加速度是跟哪些因素有关的。换句话说，我们要对碎片化知识信息进行加工再消化，才能在我们的大脑里面形成可组合的思维。从这个例子中，我们得到以下结论：思维是加工和消化知识并产生新知识的过程。因此，对复杂思维组合性的深入理解和研究，是突破现阶段基于数据的人工智能算法和模型的关键。我们不是说任何事情都要靠数据。除了数据之外，我们大脑也是很重要的源泉。\n\
    \n![](images/txt042_7.jpg \"pagenumber_ebook=300,pagenumber_book=284\")\n\n我们现阶段主要在做如下4个研究：\n\
    \n第一步，我们要关注面向思维的知识表达。知识是总结提炼思维的要素，而目前已有的知识表达方式，不足以体现思维的过程，体现思维过程的思维表达是我们应该研究的第一个问题，这样我们就可以把思维和知识连在一起，这是第一步。\n\
    \n第二步，我们应该构建知识和思维相互作用的模型。我们知道，有意识的思维与知识的关系，相对其他意识更加具体。实际上在人的大脑里有很多不同类型的思维，比如说下意识、潜意识、无意识。这里举一个非常简单的例子，运动员参加国际竞赛，教练往往鼓励他说：你是代表14亿人走到这个舞台上。这时候他的脑子下意识产生一个压力，我一定要把这次跳水跳好，这个结果有时候很成功，他发挥得非常好，有时候会起到负面作用，因为他的心理压力太大，没有把正常水平发挥出来。因此，我们觉得意识和知识之间是有相互作用的。\n\
    \n第三步，我们要讨论思维的组合性。思维不是一个简单思维。我们对猕猴做了强制性选择实验，看它在饥饿和口渴的时候选择什么，是喝饮料还是吃东西。事实证明它在不同场景下，大脑皮层产生的反应是不一样的，是依次活跃的。下面这张图演示了这个过程。第一种情况下，它很饥饿，它看到香蕉，做了一个动作，把左手的绳子拉动了，表明它很饿，想吃香蕉。第二种情况下，它很渴，旁边放了瓶水，右脚边有个踏板，它踩了踏板，表示它很渴。所以脑电波并不是在同一个地方发生的，这跟我们脑科学的研究关系非常密切。\n\
    \n![](images/txt042_8.jpg \"pagenumber_ebook=301,pagenumber_book=285\")\n\n最后，我们想研究新知识和新架构形成的机制。机器产生知识的过程是机器通过知识数据的训练产生知识，我们觉得可组合思维也是创造新知识的过程。下图的左边是一组在飞的鸟，实际上反映了复杂的多元性输入，它不是一只鸟，是很多只在一起的。这就需要了解鸟在飞行过程中，它们之间怎样的互动可以保证不会发生撞击事故，这里有很多产生新知识的机会。此外，我们从人的运动例子里可以看到，一个人骑着摩托车开得很快，他可能下意识会把腰弯下来、把头低下来，他觉得这种情况下阻力会比较小。还有在滑冰场上，运动员腰都弯得很低的，他认为这种动作阻力最小。所以我们觉得可组合思维是创造新知识的过程。\n\
    \n![](images/txt042_9.jpg \"pagenumber_ebook=302,pagenumber_book=286\")\n\n陈杰：人工智能不仅仅是一个算法，它其实希望机器和人一样能够工作，包括认知、分析、推理、决策、控制等。人工智能怎样与其他学科，包括计算机学科、控制学科等学科进行交叉融合，我们也希望能够展望一下未来愿景。"
