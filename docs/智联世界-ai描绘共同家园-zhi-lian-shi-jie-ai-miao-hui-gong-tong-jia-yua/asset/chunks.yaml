    # Dialogues with AI Leaders and Development Trends


    ## Industry Leader Profiles


    ### Ding Lei

    Founder and Chief Executive Officer, NetEase Inc.


    With over 20 years of experience in the internet industry, leveraging keen market
    insight, he has led NetEase to create multiple milestone products, including China''s
    first free Chinese email service, the first self-developed large-scale online
    game, and the first "Internet + Advanced Manufacturing" lifestyle e-commerce platform.
    Currently, NetEase has developed into a world-leading interactive entertainment
    product developer and publisher, China''s largest email service provider, occupying
    leading positions in numerous fields such as interactive entertainment, online
    music, online education, and news media.


    ### Xu Li

    Co-founder and Chief Executive Officer, SenseTime


    ![](img/txt016_2.jpg "pagenumber_ebook=130,pagenumber_book=114")


    Co-founder and CEO of SenseTime. Under his leadership, SenseTime has established
    a world-class, self-developed deep learning supercomputing center; innovative
    achievements in smart cities, smartphones, smart healthcare, autonomous driving,
    and many other fields have supported the AI transformation of industries. Simultaneously,
    he has facilitated strategic cooperation between SenseTime and top-tier enterprises
    domestically and internationally, driving AI upgrades for over 1,100 clients.
    Honors include *Fortune* Magazine''s "40 Under 40 Business Elites in China" for
    four consecutive years (2017–2020), *Fortune* Magazine''s "Global 40 Under 40
    Business Elites" (2018), EY Entrepreneur of the Year 2018 China Award, 2019 Hong
    Kong Innovation Leader Award, among others.


