- raw: "拥有20余年互联网行业经验，凭借敏锐的市场洞察力，带领网易公司创造了多个里程碑产品，包括中国首个中文免费邮箱、首个自主研发的大型网络游戏、首个“互联网+先进制造”生活电商等。目前，网易已发展为全球领先的互娱产品开发与发行商、中国最大的电子邮件服务商，在互动娱乐、在线音乐、在线教育、新闻传媒等众多领域占据领先地位。\n\
    \n徐 立\n\n商汤科技联合创始人、首席执行官\n\n![](images/txt016_2.jpg \"pagenumber_ebook=130,pagenumber_book=114\"\
    )\n\n商汤科技联合创始人、首席执行官。在他的带领下，商汤科技建立了全球顶级、自主研发的深度学习超算中心；在智慧城市、智能手机、智慧医疗、无人驾驶等诸多领域的创新成果支撑了行业的AI变革。同时，还促进了商汤科技与国内外顶尖企业的战略合作，推动了超过1\
    \ 100家客户的人工智能升级。连续四年获得《财富》杂志“中国40位40岁以下商界精英”（2017—2020）、2018《财富》杂志“全球40位40岁以下商业精英”、安永企业家奖2018中国大奖、2019香港创新领军人物大奖等荣誉。\n\
    \n王 劲\n\n中智行董事长、首席执行官\n\n![](images/txt016_3.jpg \"pagenumber_ebook=131,pagenumber_book=115\"\
    )\n\n中智行董事长兼首席执行官、中国电信研究院首席专家（人工智能方向）、中国一汽首席技术顾问（智能网联方向）、南京航空航天大学兼职教授。2017年6月，入选《福布斯》杂志“20位驱动中国人工智能革命领导者”（其中七位为其原下属）；2016年11月，美国汽车行业最权威媒体Automotive\
    \ News“全球60名驱动自动驾驶技术发展的人物”唯一上榜中国企业家，被称为“中国无人驾驶先驱者”。拥有无人驾驶领域创业公司和大公司成功经验。曾创立景驰科技并担任首席执行官。还曾任谷歌中国工程研究院副院长，领导eBay和阿里巴巴的研发团队，并在E—Loan、Informix、甲骨文等位于美国硅谷的多家公司任职。\n\
    \n黄晓庆\n\n达闼科技创始人兼首席执行官\n\n![](images/txt016_4.jpg \"pagenumber_ebook=132,pagenumber_book=116\"\
    )\n\n达闼科技创始人兼首席执行官，被称为“云端机器人之父”。曾任职于美国贝尔实验室，后担任UT斯达康公司高级副总裁兼首席技术官。现任中国电子工业协会理事长、中国电子工业协会云计算专家委员会副主任、中国电子科技大学教授。2007年任职中国移动通信研究院担任院长，在此期间，提出了为运营商建设下一代移动互联网的网络、应用和终端三大基础设施的战略构想，推动TD—LTE成为4G国际主流标准，提升了中国通信产业在国际上的话语权和影响力。2012年，率先提出“云端机器人”架构；2015年，创办达闼科技，投身“云端机器人”技术及产业发展；2016年，电气和电子工程师协会（IEEE）CQR授予他主席大奖。\n\
    \n朱啸虎\n\n金沙江创业投资基金主管合伙人\n\n![](images/txt016_5.jpg \"pagenumber_ebook=133,pagenumber_book=117\"\
    )\n\n金沙江创业投资基金主管合伙人，主要负责公司在互联网、无线和新媒体行业的早期投资，负责领导了对滴滴出行、饿了么、ofo共享单车、映客、大智慧等项目的早期投资。在加入金沙江创投之前，与他人共同创办了易保网络技术有限公司，并曾在麦肯锡大中国区任职，积累了丰富的咨询和实施经验。拥有复旦大学国际经济文学硕士学位以及上海交通大学电信工程理学学士学位。\n\
    \n季昕华\n\n优刻得科技股份有限公司董事长、首席执行官兼总裁\n\n![](images/txt016_6.jpg \"pagenumber_ebook=134,pagenumber_book=118\"\
    )\n\n优刻得科技股份有限公司（UCloud）董事长、首席执行官兼总裁，2020年度上海市人工智能专业正高级工程师，上海市第十五届人大代表，担任国家工信部、上海市经信委、上海市科委技术专家等职务。作为负责人和主要参与人，承担了国家和上海市多项重点项目建设，荣获2017年上海市科技进步一等奖、2019年“中国通信学会科学技术奖（科技进步类）一等奖”等奖项。曾荣获“上海市领军人才”“上海市优秀青年企业家”“第五届上海市优秀中国特色社会主义事业建设者”“中国双创先锋人物”等荣誉称号。在创立UCloud之前，曾先后担任华为公司安全团队负责人、腾讯公司安全中心副总经理、盛大在线首席安全官、盛大云计算公司首席执行官等职务。\n\
    \n![](images/txt016_7.jpg \"pagenumber_ebook=135,pagenumber_book=119\")\n\n在新冠疫情之前，人工智能就已经出现了几个重要的趋势性和方向性变化。第一，人工智能从单一技术突破，开始进入并重塑各行各业。第二，作为人工智能发展的重要基础，数据的重要性不断提升，关注点既包括降低数据使用门槛、打破数据垄断，也包括数据隐私、人工智能伦理。第三，5G的出现为人工智能发展创建了全新的基础，并一定程度上改变了市场的结构。而当这一切到来的时候，2020年暴发的新冠疫情同样对人工智能的发展造成了重要影响，并赋予其新的含义。我们迎来的是一次人工智能发展的新浪潮。\n\
    \n寻找人工智能最佳应用场景\n\n丁磊：人工智能不是个技术问题，而是个应用场景问题，如果选对了应用场景，人工智能发挥出来的作用会非常大。\n\n普通老百姓关心的不是复杂的算法，而是人工智能对民生有没有改善。红灯是否可以做到智能从而提高效率？公共卫生体系是否可以有很好的预警机制从而防止大规模的疫情传播？人工智能能否帮助解决教育资源不平等的问题？这些都是关系到老百姓切身利益的问题。所以人工智能最重要的是能把这些问题解决了，让城市的人出行方便、看病少排队，让乡村的人同样享受到高水平的教育服务。这就是民生。\n\
    \n比如在教育中，网易推出的应用程序可以帮助老师批改学生作文，包括中文作文和英文作文，快速帮助学生纠正语法和用词方面的错误。当然，网易还在人工智能应用的其他领域有所涉及，比如在音乐领域，网易开发了一套人工智能编曲和作词系统，还投资了欧洲人工智能作曲公司AIVA。在未来，网易希望在游戏领域开发的人工智能应用可以与真实的玩家一起上网竞技，提高玩家的水平。\n\
    \n徐立：人工智能的应用正从头部问题延伸至长尾问题，从而形成价值闭环。\n\n过去人工智能很多只关注头部问题，就是那种受众面广、发生频率高、人们广为关心的问题，人脸识别就是其中一个典型的例子。当要让人工智能真正去改变整个行业的时候，我们会发现需要解决很多发生频率并不怎么高，却难以忽视的问题，相关的应用被我们称为“长尾应用”。这些应用的广泛出现真正意味着人工智能开始深入各行业，开始产生价值闭环。以上海的“一网统管”为例，很多的细分领域已经融入了人工智能的技术，比如治理车辆违停和乱扔垃圾，这些应用不像人脸识别那样受关注，但同样能够为城市的精细化管理带来质的提升。\n\
    \n新冠疫情还带来另外一个影响，那就是加快了人工智能在各行业的普及。过去一些传统企业虽然一直谈人工智能改造升级，但由于成本等多种原因，进展并不快。在疫情中，众多企业业务重点转向线上，从而推动了业务数据化的进程，而数据化是人工智能应用的基础，结果就是我们看到利用综合数据辅助决策的企业数量大量上升，整体上推动了企业的智能化转型。\n\
    \n王劲：在无人驾驶方面，中国正逐渐走向车路协同。\n\n按照现在的发展路线，中国可能还需要两三年才能在一部分区域实现L4级的无人驾驶，而要实现L5级无人驾驶可能还要更长的时间。现在，通过5G和AI的结合，中国有机会通过“车路协同”来实现新一代的智能交通。\n\
    \n过去无人驾驶靠车上的传感器和车载电脑来实现，属于单车智能。相对而言，车路协同会有三个好处。首先是更安全。道路上的传感器会帮助车上传感器实现超视距感知，路上计算单元还能增强计算能力，从而使无人驾驶安全性大幅度提高。其次是成本更低。中国有3亿辆车，如果每辆车通过路网协同（相对于纯单车智能）能节省1.5万亿元成本，这些钱就能在现有道路上以“100万元人民币/千米”的投资部署传感器和路边单元，足以实现中国的车路协同。最后是效率更高。单车智能是一辆车的个体优化、局部优化，而车路协同是全局优化，从而有更高的效率。\n\
    \n中国已经渐渐地走上了车路协同的道路，与单车智能可能是以技术突破为主不同，车路协同中政府政策的作用更为明显。在道路上部署这么多传感器、计算单元并形成网络，没有政府支持、许可和帮助，将是不可能的。\n\
    \n为了达到车路协同，需要有更多相关方参与其中。人工智能企业是重要的一方；因为涉及车辆，所以汽车产业也会参与进来；当然还包括出行行业。除了上述各方，5G运营商也需要深度参与进来。这四个产业怎样在一个新的智能交通产业中融为一体，需要政府来协调，既要打破技术障碍、产业障碍，还要打破政策障碍。\n\
    \n黄晓庆：我们正进入用户界面的第三个时代，载体是机器人。\n\n乔布斯利用鼠标做出了视窗界面，开启用户界面的第一个时代。第二个时代也是乔布斯开启的，其代表是手机领域的多点触控。在多模态人工智能基础上，通过视觉、自然语言、身体动作，人和机器能形成一个新的用户界面，这就是用户界面的第三个时代。第一个时代，界面载体是个人电脑，第二个时代是手机，第三个时代是什么？肯定不是手机，而应该是机器人。\n\
    \n在这个时代，人工智能成为超系统平台，机器人就是新一代的个人电脑或手机。机器人一开始可能不会特别聪明，但已经能有效地执行一些重复性强、技能要求狭窄的工作，比如扫地、站岗、接待等，这恰好是人类最不想干的事情。随着超系统水平越来越高，未来我们会做出家庭保姆机器人这种更高级别的产品，只是还需要一些时间。\n\
    \n朱啸虎：新冠疫情推动人工智能发展。\n\n2002年的严重急性呼吸综合征（SARS）极大加速了中国电子商务的发展。京东、天猫基本上都是在SARS以后迅速发展起来，新冠疫情对人工智能同样会有这样的影响。中国制造业将出现整体性的无人化、智能化趋势，另外还有远程办公也将变得普遍。很多企业在疫情后至少有10%～20%的员工申请继续远程办公。他们发现在家办公效率很高，生活质量也得到了提升，甚至一些员工不再需要回到一线城市。未来远程办公的比例会越来越高。\n\
    \n任何一个行业在发展得好的时候都会有泡沫，人工智能也不例外。有一点泡沫是健康的，它会促进整个行业更好地发展。最开始，很多人涌入人工智能行业，现在大家已经变得更加务实，去分析哪些场景能更好地落地，更好地商业化，更好地给企业和用户创造价值。这表明行业的发展最终进入了正轨。5年以后，所有的互联网公司、科技公司都是人工智能赋能的，至少都有人工智能的模块。\n\
    \n季昕华：从场景、数据、算法和算力考虑人工智能业务。\n\n人工智能有4个关键要素：场景、数据、算法和算力。优刻得（UCloud）最初提供算力，后来发现数据很重要，就推出一个叫作“安全屋”的产品，实现数据的使用权和所有权分离，让数据可用不可拿。上海是全国第一个实现政务数据开放的城市，很多人工智能公司可以通过安全屋来训练模型，但不能拿走数据，从而确保用户的隐私。此次疫情发生后，我们发现，人工智能在医学方面有广泛的应用空间，比如通过分析脑电波来判断什么样的人容易失眠，怎么治疗失眠等等，我们正在多个场景进行尝试。\n\
    \n数据共享与数据隐私保护\n\n徐立：从数据智能的角度来讲，需要解决数据孤岛的问题。没有任何一家人工智能企业可以触及所需要的所有数据，而解决这个问题要明确数据资产，以及进行数据共享。比如，利用多体训练可以让各组织在不分享数据的情况下也能协同合作，共同推动算法精度的提升，其中相关标准制定是眼下要解决的问题。\n\
    \n王劲：在车路协同的无人驾驶方面，需要坚持由政府拥有数据的原则。无人驾驶公司可以帮助搜集数据，但不能成为数据的拥有者，从而保护数据隐私与国家安全。之后还可能会面临如何进行跨国合作的问题，这需要更多的探讨。\n\
    \n上海人工智能发展特色与优势\n\n徐立：要让技术真正落地，最大的问题还是认知。比如，交流电在诞生十几、二十年后才普及，不是因为交流电本身的问题，而是大众的认知出现偏差。现在人工智能也面临同样的挑战，比如普罗大众是否能够接受车中没有驾驶员的状态？企业是否理解人工智能的作用？很多传统企业没有进行人工智能升级的最大原因是不了解人工智能能做什么，只有让受众更好地理解当前人工智能应用的边界以及局限，应用才能真正落地。在这一点上，上海有自己的优势，人工智能理念在上海已经有了很好的普及，这种普及已经能够为各种应用的实际逻辑打下很好的基础。\n\
    \n对上海人工智能发展的建议\n\n丁磊：我希望政府能下定决心，重点攻克一些与民生相关的项目。希望上海不仅仅是东方的一颗明珠，也能成为引领世界人工智能的城市，一个智慧的城市。\n\
    \n朱啸虎：人才是人工智能发展的最大瓶颈，把上海打造成人工智能的人才高地，是上海人工智能发展最重要的第一步。在现有人才吸引上，可以增加人才公寓的供应。在未来人才培养上，大学在招生时可以进一步向人工智能、计算机行业倾斜。\n\
    \n黄晓庆：上海应对未来智能服务机器人领域进行预先布局，吸引整个产业链在上海落地，目标是在上海及周边地区打造一个世界上最大规模的机器人服务和制造业体系。上海应该将自己打造成优秀人才和优秀企业都愿意来的城市。不管是中国人，还是外国人，都可以在上海成立公司，并在科创板上市。上海还可以规模化引入一些核心关键技术领域的制造商，它们可能不是传统意义上的头部企业，而是技术很先进的年轻企业。\n\
    \n![](images/txt016_8.jpg \"pagenumber_ebook=142,pagenumber_book=126\")\n\n一个行业的成长是和规模有很大关系。通过人工智能、移动通信和机器人技术，云端机器人已经形成了一个产品级别的服务，这个时候需要政府来帮助推动整个行业的规模化发展。政府可以采取补贴或者对用户进行支持的方式，就像推动电动汽车发展那样。替代人工是未来机器人行业一个非常重要的商业模式，机器人将更多地被出租而不是卖给客户，就像现在的企业用工一样。这种商业模式需要金融的支持。\n\
    \n季昕华：现在大公司造成了数据垄断，很多创业公司想拿数据却拿不到。我建议上海可以用数据招商，把数据向人工智能企业开放，吸引人工智能企业在上海落地，然后在上海这个平台上创造出最好的英雄。上海的医疗数据目前是比较统一的，并且做了很好的汇集，最大的问题是如何使用这些数据。目前上海已领先一步将政府数据开放，下一步能不能开放其他行业特别需要的数据，比如医疗影像数据、运营商数据等？这对行业发展很关键。\n\
