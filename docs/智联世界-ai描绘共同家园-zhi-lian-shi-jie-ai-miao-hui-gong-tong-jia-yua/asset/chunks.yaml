    \ 年，创立秒针系统—中国最大的互联网用户行为和营销数据分析平台；2014 年，创立明略科技—将业务从线上商业领域拓展到政府服务及线下商业领域，将技术能力从大数据拓展至人工智能；2019\
    \ 年，创立明略科技集团—中国领先的一站式人工智能企业级服务平台，并入选国家新一代人工智能开放创新平台。毕业于北京大学，获数学系学士学位、计算机软件与理论硕士学位及北大人工智能实验室（`AILab`）优秀硕士学位。拥有\
    \ 20 年软件工程开发和算法研究经验、130 余项国内外发明专利。\n\n**夏华夏**  \n美团首席科学家兼 AI 平台总经理\n\n![](img/txt022_6.jpg\
    \ \"pagenumber_ebook=182,pagenumber_book=166\")\n\n美团首席科学家、`AI`平台总经理。于美国加州大学圣迭戈分校取得博士学位。曾任`Google`高级工程师、百度主任架构师。主要从事基础架构、云计算、大数据、人工智能、无人驾驶等领域。\n\
    \n![](img/txt022_7.jpg \"pagenumber_ebook=183,pagenumber_book=167\")\n\n## 引言\n\
    \n从 2017 年开始，上海就在人工智能领域出台了一系列中长期的规划，并逐步凝聚起了浓郁的产业发展氛围。而现在，人工智能又成为新基建的轴心，从而为中国经济创造新的红利。\n\
    \n## 人工智能与数字新基建\n\n### 姚志强\n\n新基建是我们从信息化到智慧化、智能化的必要转型步骤。如果说人工智能是大脑，那么硬件基础就相当于身体。我们不仅需要聪明的大脑，也要有强健的身体。\n\
    \n身体传回来的数据要聪明的大脑去分析，去做出决策；分析的结果和决策又会返回实际应用场景与实时数据相结合。所以我们既需要人工智能，也需要数字基础设施。\n\n\
    ### 周剑\n\n几年前，人工智能还没有到达切实可行的阶段。但随着人工智能技术的发展，包括数据积累、算力提升等，人工智能将对社会发展起到核心驱动的作用。新基建的含义也会从之前的“铁公基”转变为更多的技术驱动的基础设施建设。\n\
    \n在这次疫情中，我们发现智能机器人是人工智能最好的载体。未来机器人还将更多地在智慧医疗、智慧教育、智慧驾驶等场景中全面地改变社会运转的结构，让社会发展越来越高效。\n\
    \n### 郑庆生\n\n中国的互联网已经走过了 20 个年头，支付、消费、娱乐都已经实现了大规模在线化，这积累了大量数据资源，让整个社会的互联网节点变得非常丰富，也为下一步的数字智能或人工智能提供了一个非常好的基础。\n\
    \n同时，中国的发展是很有特色的。中国的数字化、在线化、云端化、智能化是一个全价值链的过程，和欧美发达国家不同的是，中国既有巨大的市场，又是世界的工厂，所以基本上做到了从设计营销到生产物流的全覆盖，可以形成全链路数字化闭环。在全链路的闭环里面，通过数据化，每一个环节都有人工智能的巨大机会，有非常广阔的天地。\n\
    \n### 陈海波\n\n20 年的互联网发展使中国成为互联网大国，也成为数据大国，为中国成为人工智能大国奠定了基础。目前深度学习是人工智能的主要阶段，数据是粮食，算法是工具，算力是基础，新基建将为我们夯实多种基础。\n\
    \n### 吴明辉\n\n新基建是各方都需要参与的事情，不仅是国家层面，也包括在企业内部去推动基础设施建设，并在这个基础上推动更广泛的经济增长。整个社会是由物质、能量、信息三大核心要素构成的，老基建的作用是促进物质和能量的运输和流通，而人工智能关乎的是信息，其中数据中心就是人工智能的基础设施。比如，我们为上海地铁搭建的智能运维平台和数据共享平台可以提升地铁运营效率，降低成本；为电力系统搭建的数据中台可以做到电网智慧调度。未来还会有更多基于此的应用出现。\n\
    \n### 夏华夏\n\n我们认为人工智能就是一种基础设施，会是未来生活中必不可少的技术。我们提供智能餐厅解决方案帮助商家更高效地运营，我们打造无人酒店，让用户可以刷脸入住，指纹开锁，从而提供更好的入住体验。为了帮助外卖小哥改善工作环境，我们正在开发无人机和无人车的配送，让小哥不需要在路上奔波，而只是解决最后\
    \ 100 米的配送问题。我们做人工智能应用是基于一个个真实的生活场景，我们也相信`AI`会成为未来生活的基础设施。国家大力推动的新基建对人工智能行业也有很大帮助。`5G`、芯片、物联网、数据中心等项目的建设将进一步完善人工智能生态，并对行业起到推动作用。\n\
    \n## 人工智能发展的机遇与路径\n\n### 周剑\n\n目前人工智能还处于比较初级的阶段，到通用智能还有很长的路要走。所以我们现在强调的是在可控环境下，在一些垂直领域的细分场景去深入发展。\n\
    \n优必选科技一直聚焦在人形机器人。为什么是人形机器人？轮式的、履带式的或四足的机器人是否也能实现我们需要的功能？如果你看过《西部世界》，一定会喜欢这部剧中的人形机器人，这就是我们的目标，可能需要\
    \ 50～100 年才能实现。\n\n但这件事总得有人去做。\n\n优必选科技目前在努力降低大型人形机器人的成本。我们认为只要这样的机器人价格降低到一定程度，比如说几十万元，和一台中高档汽车的价格类似，那么它们就能进入家庭，从而形成机器人行业一个垂直领域的应用场景。我一直强调，不能只看现在的技术，而是要思考人类未来到底需要什么样的产品。如果未来需要人形机器人，那么优必选科技就会一直走在这条路上。发展硬科技必须有耐心以及坚持长期投资的理念，我们希望为中国做一些与众不同的东西。依托中国强大的制造业和供应链基础，我们希望用得起的人形机器人能够在中国的供应链上被第一个造出来，能够实现商用或者家用，这是我们最自豪的事情。在实现这个目标的过程中，我们的很多技术可以“沿途下蛋”，比如我们可以做最美的新基建—人工智能教育，以及商业服务、安防巡检、养老等方面的一些智能机器人。\n\
    \n### 陈海波\n\n如果中国要在第四次工业革命中处于领导者地位，需要解决两个问题。第一，基础研究要领先世界；第二，要完成从工业大国到工业强国的转变。在此期间，技术推动是主旋律，而人工智能在工业智能化方面是主力军。\n\
    \n智能制造能在很大程度上帮助人工智能企业商业落地，帮助人工智能企业针对市场需求打造产品。人工智能企业要认识到技术是用以赋能各行各业的，人工智能技术只有与场景结合才能产生作用。真正的人工智能企业应该从“软”做到“硬”，基础研究和应用开发都强，才能够符合未来市场和社会对人工智能的期望。\n\
    \n### 吴明辉\n\n在人工智能时代，科技创新企业应走出差异化的道路，选好细分市场和不同赛道。我认为，未来每一个人工智能细分领域只有第一名可以取得成功，因为其能力是可以复制的，而其他的竞争者将是没有前途的。中国有最为广泛的人工智能应用场景，企业应选好自己的细分市场。\n\
    \n### 夏华夏\n\n我们真正的目标是用科技，特别是人工智能帮助提供本地生活服务的商家提高效率，帮助用户得到更好的服务，最终让人工智能成为生活的一个基础设施。未来五六年，我们一个重要的任务是帮助那些不会用互联网的人使用我们的服务，包括很多老人和小孩。用图像识别帮助中小餐馆老板录入菜单和管理订单，利用语音交互、视觉理解等人工智能相关技术实现无人配送，都是未来几年我们要做的事情。\n\
    \n### 郑庆生\n\n对于投资人来说，无论多好的技术都需要找到商业变现的场景。企业有一个长远的定位，但每一步都需要找到细分的场景去实现，这是投资人非常希望看到的。\n\
    \n"
