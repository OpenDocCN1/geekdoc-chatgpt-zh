    ## Dialogue Transcript


    ### Jie Chen: The next step of fundamental innovation in AI can draw very important
    nutrients from different disciplines, such as mathematics, brain science, physics,
    and even humanities like philosophy and psychology. What new directions can these
    disciplines bring to the future development of AI?


    ### Jifeng He: I propose research on the compositionality of complex thinking.
    Current AI deep learning models are mainly based on deep neural networks; they
    inherit the signal transmission characteristics of human thinking and rely on
    training data and application scenarios. Various industries have their own experiences
    in this regard, proving that data-based machine learning can bring us new knowledge
    and new patterns of understanding problems—this is what we have already seen.


    Now let''s talk about what problems we encounter. Looking back at when Alan Turing
    first posed the question of intelligence, his question was "Can machines think?".
    What we raise now are machine learning problems. I think there is a distance between
    learning and thinking. From elementary school, teachers instill knowledge into
    students—this is a learning process. But we hope to be able to draw inferences
    from one example, to slowly analyze problems and find them; this no longer belongs
    to pure learning. We feel we should take a step forward, which is why we consider
    new research areas.


    The second problem is that before machine learning, many past AI achievements
    were mainly manifested as expert systems—this is AI based on causal inference.
    Analyzing this type of AI, we now have a conclusion, as 2011 Turing Award winner
    Judea Pearl said: "The knowledge experience obtained by data-centric machine learning
    has weak interpretability and may produce situations completely contrary to original
    knowledge." Mr. Pearl gave an example: past data analysis showed the relationship
    between human exercise and cholesterol was that the more exercise, the higher
    the cholesterol. This is obviously not the result we hope for; we hope exercise
    lowers cholesterol. Later it was discovered the main reason for this result was
    a missing feature value in the machine learning—age was not factored in. If the
    age factor is considered, it would be found that people of different age groups
    all have good results after exercise. This is a shortcoming of machine learning.


    In 1975, American philosopher Jerry Fodor proposed that thinking can be formally
    represented using a language with syntactic rules^([\[1\]](#txt042.html#footnote_content_txt042_1)).
    I don''t find this judgment surprising; people exchange ideas through language,
    which at least proves language has the function of expressing thought. The question
    is whether *only* formal language can express such thinking? Why emphasize formalization?
    Because only formal language can be digested by machines; otherwise, machines
    cannot understand.


    Assuming there really is a formal language, we can derive a thinking model: the
    activity of thinking needs to move forward. This means in original AI innovation,
    there are both logic-based Turing machines and data-and-transmission-based neural
    networks. In other words, both the brain and the nervous system are needed; it''s
    not just a matter of transmitting information.


    ![](img/txt042_6.jpg "pagenumber_ebook=299,pagenumber_book=283")


    Now let''s return to the compositionality of complex thinking itself. First, a
    simple example. Regarding Newton''s discovery of the three laws, legend has it
    he sat under an apple tree and an apple fell on his head—this is very fragmented
    data knowledge. After processing and digestion, the final theorem was formed,
    i.e., what factors acceleration relates to. In other words, we must process and
    digest fragmented knowledge information to form combinable thinking in our brains.
    From this example, we draw the following conclusion: thinking is the process of
    processing and digesting knowledge to generate new knowledge. Therefore, a deep
    understanding and research on the compositionality of complex thinking is the
    key to breaking through current data-based AI algorithms and models. We are not
    saying everything must rely on data. Besides data, our brain is also a very important
    source.


    ![](img/txt042_7.jpg "pagenumber_ebook=300,pagenumber_book=284")


    Our current work mainly focuses on the following 4 research steps:


    **Step 1**, we must focus on knowledge representation oriented towards thinking.
    Knowledge is the summarized element of thinking, but existing knowledge representation
    methods are insufficient to reflect the thinking process. Thinking representation
    that reflects the thinking process is the first problem we should study, so we
    can link thinking and knowledge together—this is the first step.


    **Step 2**, we should construct a model of the interaction between knowledge and
    thinking. We know the relationship between conscious thinking and knowledge is
    relatively more concrete compared to other consciousness. In fact, there are many
    different types of thinking in the human brain, such as subconscious, unconscious,
    and preconscious. Here is a very simple example: an athlete participating in an
    international competition, the coach often encourages them saying: "You represent
    1.4 billion people on this stage." At this moment, his subconscious generates
    a pressure: "I must dive/jump well." This result is sometimes very successful—he
    performs extremely well; sometimes it plays a negative role because the psychological
    pressure is too great, and he fails to perform at his normal level. Therefore,
    we feel there is an interaction between consciousness and knowledge.


    **Step 3**, we must discuss the compositionality of thinking. Thinking is not
    a simple thought. We conducted forced-choice experiments on macaques to see what
    they choose when hungry and thirsty—drink or eat. It proved that in different
    scenarios, the reactions produced by the cerebral cortex are different; they are
    sequentially active. The image below demonstrates this process. In the first situation,
    it is very hungry, sees a banana, makes a movement, pulls the rope with its left
    hand, indicating it is hungry and wants the banana. In the second situation, it
    is very thirsty, a bottle of water is placed nearby, there is a pedal by its right
    foot, it steps on the pedal, indicating it is thirsty. So brainwaves do not occur
    in the same place; this is closely related to our brain science research.


    ![](img/txt042_8.jpg "pagenumber_ebook=301,pagenumber_book=285")


    **Finally**, we want to study the mechanism of new knowledge and new architecture
    formation. The process of machines generating knowledge is machines producing
    knowledge through training on knowledge data; we feel composable thinking is also
    a process of creating new knowledge. The left side of the figure below shows a
    group of flying birds, actually reflecting complex multi-source input; it''s not
    one bird, but many together. This requires understanding how the interaction between
    them during flight guarantees no collisions occur—there are many opportunities
    for generating new knowledge here. Additionally, from human motion examples, we
    can see a person riding a motorcycle very fast may subconsciously bend their waist
    and lower their head, feeling the resistance is smaller in this posture. Also
    on the ice rink, athletes bend their waists very low, believing this posture minimizes
    resistance. So we feel composable thinking is a process of creating new knowledge.


    ![](img/txt042_9.jpg "pagenumber_ebook=302,pagenumber_book=286")


    ### Jie Chen: AI is not just an algorithm; it actually hopes machines can work
    like humans, including cognition, analysis, reasoning, decision-making, control,
    etc. How AI can integrate with other disciplines, including computer science,
    control science, etc., we also hope to envision a future vision.


    '
