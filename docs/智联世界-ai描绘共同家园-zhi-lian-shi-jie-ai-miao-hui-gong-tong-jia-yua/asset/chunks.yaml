    - [后记](#att002.html#att002_1)\n\n# 家园·AI（爱）\n\n## 变革的时代，与其担忧不如担当\n\n**马云**\n\n\
    联合国数字合作高级别小组联合主席\n\n![](images/txt002_1.jpg \"pagenumber_ebook=18,pagenumber_book=2\"\
    )\n\n1999年创立阿里巴巴，并担任董事局主席及首席执行官至2013年5月，2013年5月至2019年9月担任阿里巴巴董事局主席。同时是世界经济论坛（WEF）基金会董事局成员、浙商总会会长以及中国企业家俱乐部主席，并于2018年起担任联合国数字合作高级别小组联合主席。毕业于杭州师范学院（杭州师范大学前身）英语教育专业。\n\
    \n![](images/txt002_2.jpg \"pagenumber_ebook=19,pagenumber_book=3\")\n\n我现在在云南，很荣幸能够加入大家的讨论。\n\
    \n这是一次非常特殊的大会，可能也是历史性的。第一届人工智能大会我们在上海聚在一起的时候，谁都不会想到，今年我们是以这样的方式继续去年的研讨会。\n\n我记得去年我们当中还有人在担心，还有人在争论，机器会不会取代人，就业怎么办；现在我们最着急的是怎样才能让机器尽快取代人类的很多工作，比如在病毒传播的领域，我们千方百计要让机器去解决问题而不是让人冲在最前面。所以世界真的是这样，我们担心的都没有发生，但我们没担心的却在接二连三地发生。\n\
    \n今天的问题是我们昨天做的决定造成的，但是我们很难改变昨天，甚至对今天往往也无能为力；未来应该怎么样是今天我们可以决定的。疫情对世界带来的改变，我想我们不如把它当作一种来自大自然、来自未来的信号。我想跟大家分享一下这几天我的三点思考：\n\
    \n### 第一，人类离不开地球，但地球却可以离开人类。\n\n工业革命以后，人类有能力向外看，登上了月球，建设了太空站，试着在太空生存，很多杰出的人包括埃隆·马斯克开始对地球以外的世界有了伟大的探索。\n\
    \n接下来，因为数字革命，人类有能力向内探索，真正地了解自身，也真正了解地球。相比之下，人类对自身的探索显得更难也更加重要。\n\n今天人类对自己的了解非常有限，最厉害的脑科学家也只了解人类大脑不到10%。这次疫情，让我们看到了人类对自己的陌生，对地球的陌生，因为我们不了解自己，不了解自己生存的世界，不懂得这个地球，不珍惜和保护这个地球，所以制造了很多麻烦和灾难。我想人类现在最重要的是先解决好自己的问题，解决好地球的问题，不然，无论我们移居到哪个地方，无论我们去哪个星球，都依然会面临这样的麻烦和灾难。\n\
    \n其实我们人类还离不开地球，但是地球离开我们可能会更好。最近看到几则新闻：由于游客数量的减少，日本奈良的鹿少吃了很多零食，肠胃恢复了健康；意大利的水城威尼斯封城以后，水变得更清澈了，还能够看到水里的鱼。如果说地球是一家公司，大自然才是真正的老板，人类只是大自然优选的管理者而已，人类的权力很大，但是大自然却可以随时让我们下岗。\n\
    \n很多事情对人类来说没有错，但是对大自然来说就是个很大的错误。如果人类一直给大自然带来灾难，大自然一定会回报人类以灾难。我们人类一定要学会和大自然共存，人类只有顺应自然，尊重自然，才能在地球上生存下去。\n\
    \n### 第二，经济增长可以放慢，但是人类必须要成长。\n\n疫情让我们明白，世界上的生态系统很大程度上是受微生物的影响，而不是最高等级的动物。就好像非洲大草原的生态系统中，发挥重要作用的是那里的微生物，而不是那里的狮子和大象。我们人类千万不能把自己看得太高。\n\
    \n我认为AI应该翻译成为“机器智能”，翻译成“人工智能”是人类把自己看得过大，也过高。很多事情对人类来讲很难，但对机器来说却非常容易。动物有的是本能，机器有的是智能，而我们人类拥有的应该是智慧。\n\
    \n几千年来，人类的知识在快速地增长，技术在发展，但人类的智慧并没有成长。\n\n今天我们所拥有的资源和财富前所未有，我们拥有的知识和技术能力也是前所未有，当然我们面临的麻烦也是前所未有。\n\
    \n今天人类知识的积累、信息处理的能力和抗风险的能力是有史以来最强大的。但是很遗憾，我们缺乏智慧，我们有时候并没有把这些资源、能力和知识用来加强沟通和合作，有时候还制造了很多隔阂，甚至扩大了分歧。人类从来不缺灾难，但是灾难之后的我们一定要成长。否则，我相信，未来毁掉人类文明的不是病毒，而是人类自己。\n\
    \n人和人，国家和国家，没有一个是一样的，肯定是不同的，而且会永远地不同下去，也因为我们的不同，世界才丰富多彩。今天世界的很多问题，就是因为不尊重彼此之间太多的不同和分歧而造成的。看到了不同，依然能够放下分歧，学会尊重和欣赏各自的不同，这才是人类文明进步的标志。\n\
    \n### 第三，如果过去数字技术是让生活变好，那么今后数字技术是让人类能够更好地生存下去！\n\n疫情没有改变技术变革的趋势，但是疫情加速了数字技术的变革，因为灾难在逼迫我们创新。\n\
    \n一位专家用肉眼看一张新冠肺炎疑似病例的CT片子，需要15～20分钟；后来中国的技术人员在很短时间内开发出的新冠肺炎CT影像的智能算法，机器看一张疑似病例的片子只需要20秒，效率是专家的60倍。\n\
    \n我听说疫情期间农民用卫星遥感技术贷款。就是农户通过手机上的小程序在地图上划定自家的水稻田，卫星通过遥感图像识别稻田里作物生长的情况，机器结合气候、行业等情况预估产量和价值，再决定给农民多少贷款。\n\
    \n疫情期间这样用互联网技术让自己活下去、让别人活下去的创新无处不在，我们上学、开会、买东西、看病……维持生活的运转都必须依靠数字技术，为活下去而做的创新才是真正最强大和不可阻挡的动力。数字技术的大趋势并没有发生变化，但是未来，本来需要三五十年完成的数字化，可能会提速到10年、20年内就完成。这是巨变以后的巨变，技术变革提前并且加速，这是我们需要做好准备的，也是我们今年人工智能大会和去年大会所面临的完全不同的局面。\n\
    \n相隔一年，世界已经发生了巨变，今天的我们已经没有时间担忧，与其担忧，不如担当。因为病毒不需要签证，不分国家，技术也不应该有边界，不能分你我。今天的灾难是巨大的，今天的灾难也许才刚刚开始，我们没有其他选择，所以，大家早一点开始合作、团结、抱团，我们就会早一天胜利。\n\
    \n再次谢谢大家！\n\n## AI进化的机遇与展望\n\n**埃隆·马斯克（Elon Musk）**\n\n特斯拉公司联合创始人、首席执行官\n\n![](images/txt003_1.jpg\
    \ \"pagenumber_ebook=24,pagenumber_book=8\")\n\n特斯拉公司的联合创始人和CEO，领导公司电动车、电池产品和Solar\
    \ Roof的产品设计、工程和制造。同时还是太空探索技术公司（SpaceX）的联合创始人、CEO和首席设计师，领导先进火箭和航天器的研发与制造。另外创立了The\
    \ Boring Company并担任CEO，同时还担任Neuralink的CEO。\n"
  trans: "\n# Proceedings of the 2020 World Artificial Intelligence Conference Cloud\
    \ Summit\n\n> “A new generation of artificial intelligence is booming globally,\
    \ injecting new momentum into economic and social development, and profoundly\
    \ changing people's modes of production and life.”\n>\n> “China is willing to\
    \ work with all countries in the field of artificial intelligence to jointly promote\
    \ development, safeguard security, and share achievements.”\n>\n> —Excerpt from\
    \ General Secretary Xi Jinping's congratulatory letter to the 2018 World Artificial\
    \ Intelligence Conference\n\n# Preface\n\nThe 2020 World Artificial Intelligence\
    \ Conference Cloud Summit, themed \"Intelligent Connectivity, Shared Home,\" was\
    \ successfully held in Shanghai from July 9 to 11, 2020. Against the special backdrop\
    \ of epidemic prevention and control, the conference fully leveraged Shanghai's\
    \ advantages in AI technological innovation and application, integrating online\
    \ and offline formats, hosting the conference \"on the cloud\" and the exhibition\
    \ \"digitally.\" Top AI scientists, entrepreneurs, investors, developers, and\
    \ people from all walks of life concerned with AI development from around the\
    \ world gathered to discuss new directions in AI technological development, new\
    \ drivers for industrial application, and themes such as AI assisting global epidemic\
    \ prevention and control and building a warm home. They put forward many valuable\
    \ concepts, views, insights, and suggestions, attracting widespread attention\
    \ from the industry and society at large.\n\nAs an international high-end exchange\
    \ platform facing this important emerging technology field, the World Artificial\
    \ Intelligence Conference has been successfully held for three sessions. In September\
    \ 2018, General Secretary Xi Jinping sent a congratulatory letter to the first\
    \ World Artificial Intelligence Conference, profoundly elaborating on the development\
    \ trend of the new generation of artificial intelligence from a strategic and\
    \ overall height, demonstrating China's clear attitude of being willing to work\
    \ with all countries to jointly promote development, safeguard security, and share\
    \ achievements in the field of AI, pointing the way for the rapid and healthy\
    \ development of AI. At the opening ceremony of this year's World Artificial Intelligence\
    \ Conference, Li Qiang, Member of the Political Bureau of the CPC Central Committee\
    \ and Secretary of the Shanghai Municipal Committee, emphasized in his address\
    \ that Shanghai will deeply implement the spirit of General Secretary Xi Jinping's\
    \ important instructions, striving to build an open platform linking collaborative\
    \ innovation, an empowering platform linking industrial development, a smart platform\
    \ linking urban governance, and a service platform linking a better life. Shanghai\
    \ will cooperate with friends from home and abroad to jointly explore the bright\
    \ prospects of AI development and jointly write a splendid chapter of the intelligent\
    \ era.\n\nIn order to allow more people to share the thoughts and academic achievements\
    \ of the World Artificial Intelligence Conference, and in response to demands\
    \ from all sectors, the Conference Organizing Committee continues to launch the\
    \ \"Intelligent Connectivity\" series of books this year. This book focuses on\
    \ the guest speeches at the opening ceremony, plenary sessions, and evening talks\
    \ of the 2020 World Artificial Intelligence Conference. Centering on themes such\
    \ as \"Home·AI (Love),\" \"Direction,\" \"Trend,\" \"Epidemic Fight,\" \"Opportunity,\"\
    \ and \"Connection·Integration,\" it comprehensively presents the latest development\
    \ trends of world AI and conveys the value concept of AI for good and building\
    \ a common home for humanity.\n\nThis book aims to provide a useful reference\
    \ for relevant professionals and general readers to understand and grasp AI development\
    \ trends, participate in the World Artificial Intelligence Conference and the\
    \ construction of Shanghai's AI highland, and promote the healthy development\
    \ of China's new generation of AI.\n\nWorld Artificial Intelligence Conference\
    \ Organizing Committee\n\nSeptember 2020\n\n# Table of Contents\n\n- Preface\n\
    - Home·AI (Love)\n  - Era of Transformation: Responsibility Over Worry\n  - First,\
    \ humans cannot leave Earth, but Earth can leave humans.\n  - Second, economic\
