    \n不迷茫于今日，不错失于未来\n\n陈黎明\n\nIBM大中华区集团董事长\n\n![](images/txt014_1.jpg \"pagenumber_ebook=106,pagenumber_book=90\"\
    )\n\n在多个行业和国家有逾30年的工作经历。1982年作为助理研究员开始了职业生涯。1991—1994年在新加坡标准与工业研究院担任食品技术研究高级研究员。1994年加入德国康迪雅化学新加坡分公司，后调往中国，历任康迪雅中国化学公司副总经理、总经理和董事总经理。2006\
    \ 年被南非沙索公司任命为沙索中国公司执行副总裁。2008年加入BP，出任BP中国区总裁及BP（中国）投资有限公司董事长。过去数年中，出任多家企业的董事会成员。他还是爱丁堡大学的荣誉教授。本科毕业于新疆石河子大学，1989\
    \ 年于美国康奈尔大学获得硕士学位，并于2003 年在哈佛商学院完成了高级管理课程。\n\n![](images/txt014_2.jpg \"pagenumber_ebook=107,pagenumber_book=91\"\
    )\n\n我们是生活在一个快速的广泛的科技变革时代，还是经久的延绵的滞胀时期？仁者见仁，智者见智。\n\n曾经有一位科技公司的先贤在1946年断言说全球可能只需要5台计算机，而今天计算机已经走进了寻常百姓家里，甚至装到了我们的口袋里，今天一部手机的计算能力已经超越了当年IBM送人类登月的大型计算机计算能力的几万倍甚至几十万倍。\n\
    \n人工智能近几年的热潮使政府、企业和社会大众都期望它一出现就石破天惊，即刻改变世界。在不同的时期，各界对人工智能的态度不断转变，渴望、期待、热情、贪婪、焦虑、担忧，抑或失望。我们往往更关注一项科技今天能够给我们带来什么改变，创造多少GDP，提升多少当下的政绩，能否解决我们面对的所有问题，甚至仅仅是赶时髦，却往往忽略了一项重大科技自身发展的规律和长期所带来的重大影响。\n\
    \n技术发明路漫漫\n\n一项技术从孕育到开发到应用到普及再到成熟，直至衰退，都有它自身的发展规律。大多数技术都不是灵光闪现后一蹴而就，并立刻改变了人类社会，而是需要经历持久且逐步的发展历程。有时我们甚至都很难厘清一项技术最早的发明者究竟是谁。我们对许多技术的认知也有时间的局限，我们常说世界上第一部计算机是1946年在美国宾夕法尼亚大学发明的，叫ENIAC。事实上，早在1822年英国剑桥大学的一位教授查尔斯·巴贝奇（Charles\
    \ Babbage）就撰文描述了一种计算机器—差分机。巴贝奇试图打造一个可以用以各种复杂计算的万用计算装置，有人认为这才是现代计算机的鼻祖。虽然巴贝奇并没有在他有生之年看到这些机器的问世或应用，但他在1832年写道：“任何一个成功地被制造出来的产品，都是从一系列的失败，逐步走向卓越。”今天，由IBM打造，世界上最快的超级计算机之一Summit的运算速度高达每秒20亿亿次，比第一台计算机ENIAC大约提高了40万亿倍！\n\
    \n同样的故事也发生在其他许多领域。我们从小就被告知是瓦特早在 1769年发明了推动工业革命发生的蒸汽机，但早在瓦特致力于蒸汽机之前的几十年里，蒸汽机已经在苏格兰地区广泛出现。据说蒸汽机的雏形可以追溯到2000多年前的古希腊。但是，毫无疑问，瓦特在改良早期的工业蒸汽机中做出了不可磨灭的贡献。\n\
    \n许多被称为通用技术的发明创造都经历了漫长的过程，其间不断得到改进，同其他技术有效地融合与互补，发展出广泛的应用，从而形成了很强的外溢效用（spillover），对人类社会产生重大影响。语言、服装、火的使用、植物栽培、动物养殖、轮子、制陶、书写、水车、印刷术等许多古代的发明都属于这些范畴。蒸汽机、内燃机、电动机、电力、电器、汽车、计算机、互联网等则是现代从根本上改变了人类社会、被广泛应用的通用技术。我们今天所熟悉的纳米技术、生物技术、人工智能也都可能成为我们这个时代的通用技术。\n\
    \n技术扩散路遥遥\n\n新技术的引入需要经验的积累、技术的完善、认知的提升，因此，通用技术的扩散有时会伴随着早期生产效率的下降，而在经历经验曲线之后，大幅度的生产效率提升才会出现。\n\
    \nIBM在1964年就推出了计算机大型主机，极大地规范了行业的软件硬件标准，但计算机真正进入千家万户还是二三十年之后，而距离第一台现代计算机问世已有四五十年的时间。科学家乔治·劳雷尔（George\
    \ Laurer）在1973年就发明出了被称为20世纪最伟大发明之一的条形码，而条形码真正被广泛采用却是二三十年之后。\n\n在人工智能领域有一句笑话说：有多少人工智能，背后就有多少人工。这是人工智能早期开发中所需要经历的学习曲线，有人形容这个规律为“播种的时节和收获的时节”。\n\
    \n1965年，摩尔在集成电路制造上总结出了“当价格不变时，集成电路上可容纳的元器件数目，约每18～24个月便会增加一倍，性能也将提升一倍”，从而形成了摩尔定律。赖特早在1936年就发现飞机制造的产量每增加一倍，生产成本就会下降20%，这被后人称为赖特经验曲线或者赖特定律。2013年圣塔菲研究院和麻省理工学院的研究人员通过收集研究62项来自化工、能源和信息技术的数据，验证了赖特定律和摩尔定律适应于不同的行业。\n\
    \n随着时间的推移、经验的积累、算法的丰富、投资的增加，人工智能也会突破早期的学习成本，加速在各行各业的部署。也许20年后，许多公司从某种意义上来说都是AI公司，如同今天许多银行也是金融科技公司一样。\n\
    \n早期人工智能的研究仅仅是由科学家们的好奇心驱使。比如IBM的人工智能研究始于1952年，当时科学家想要实现人工智能仅仅是为了下西洋跳棋。1997年IBM的深蓝计算机战胜了当时的国际象棋冠军卡斯帕罗夫，被认为是人工智能彪炳史册的转折点。又经历了二十几年的发展，人类在绝大多数棋类游戏上，已经完全不是人工智能的对手。今天随便一部智能手机都已经配备了很强的人工智能，无论是自然语言理解和交互，还是图像识别，其功能都已让过去的大型计算机望尘莫及。\n\
    \n莫蹉跎，莫错失\n\n一项技术必须在应用中找到自己的沃土，也只有在应用中才获得生命力，同样一个行业必须与时俱进，不断拥抱新的科技才能得以赋能，提升自身的竞争力。今天，无论是制造业、医疗健康、金融、零售、教育、政府机构、农业等，人工智能都已显现威力，将来还会发挥出更大的潜力。\n\
    \n企业在疫情背景下正加快数字化转型，而人工智能已经成为它们难以回避的选项。人工智能作为一项通用技术，会进一步和各个行业和各项技术融合，不断形成外溢效用。人工智能将持续提升生产效率并降低使用成本，并在未来的几十年甚至更长时期对商业、生活、社会治理带来变革性的影响。虽然人工智能依然有一个持续完善的过程，但这并不妨碍企业尽早拥抱人工智能，尽早获益，提升企业竞争力。作壁上观只会坐失良机。\n\
    \n“朝看水东流，暮看日西坠”，莫等万事成蹉跎。创新带来的收益往往都集中在创新者、早期尝鲜者或早期跟随者，晚来者往往会变成看客，被边缘化甚至被淘汰。智能手机的利润大多集中在几家公司手里，谷歌和Facebook占据了网络广告收入的绝大部分。企业应不迷茫于今日，不错失于未来。\n\
    \n\uFEFF\n\n人工智能的未来挑战与突破\n\n杨 强\n\n微众银行首席人工智能官、香港科技大学讲席教授、中国人工智能学会（CAAI）荣誉副理事长\n\
    \n![](images/txt015_1.jpg \"pagenumber_ebook=112,pagenumber_book=96\")\n\n微众银行首席人工智能官，香港科技大学讲席教授，人工智能促进协会（AAAI）执行委员会委员，中国人工智能学会（CAAI）荣誉副理事长以及香港人工智能与机器人学会（HKSAIR）理事长，第四范式公司联合创始人，国际人工智能联合会（IJCAI）理事会主席。同时也是AAAI/ACM/CAAI/IEEE/IAPR/AAAS会士。曾获2019年度“吴文俊人工智能科学技术奖”杰出贡献奖以及2017年ACM\
    \ SIGKDD杰出服务奖。最新著作有《迁移学习》和《联邦学习》。\n\n戴文渊\n\n第四范式创始人、首席执行官，迁移学习学者\n\n![](images/txt015_2.jpg\
    \ \"pagenumber_ebook=113,pagenumber_book=97\")"
