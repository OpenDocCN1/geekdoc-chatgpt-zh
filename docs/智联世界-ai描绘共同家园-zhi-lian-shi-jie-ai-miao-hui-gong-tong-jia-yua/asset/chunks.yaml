    \n![](images/txt029_2.jpg \"pagenumber_ebook=224,pagenumber_book=208\")\n\nSAP全球高级副总裁、SAP中国总裁，全面负责中国市场的业务和运营。一直积极推动德国“工业4.0”在中国市场的落地，促成了中德第一个“工业4.0”合作项目，并于2015年在中德两国政府总理的见证下签署了合作协议。现任中国工业互联网产业联盟副理事长。2018年，当选为第十三届上海市政协委员，并被评为“中国ICT产业十大影响力人物”。2019年，受聘担任陕西省人民政府国际高级经济顾问。荣获了中国跨国会颁发的“全球跨国公司领袖奖”、《经济观察报》评选的“2019年度中国受尊敬企业家奖”，并荣登《人民网》新中国成立70周年“奋斗中国人”特别节目。有着20余年IT从业经验，对商业软件、云计算以及创新的商业模式有着非常前瞻和深入的理解。\n\
    \n![](images/txt029_3.jpg \"pagenumber_ebook=225,pagenumber_book=209\")\n\n柯睿安：全球经济正经历着过去75年来最快速、最巨大的变革。纵观各个行业，因为疫情，即使是最有远见卓识的公司也表示遇到了供应链的问题，许多日常业务也遭受到影响，这场危机又一次证明了转型为智慧企业的必要性。"
