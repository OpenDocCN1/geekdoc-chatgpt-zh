    ## Postscript


    After the successful conclusion of the 2020 World Artificial Intelligence Conference
    Cloud Summit, under the unified arrangement of the Conference Organizing Committee
    and the care and support of leaders at all levels, the compilation and publication
    of conference achievements was immediately launched. After more than two months
    of intense editing work, this book "Intelligent World—AI Depicts Our Common Home"
    is presented to readers.


    The textual content of this book comes from the speeches of guests at the conference
    opening ceremony, plenary sessions, and night talk events; during the compilation
    process, active cooperation and support were received from all speaking guests.
    The content editing of this book, including material collation, text sorting,
    and guest liaison, was undertaken by relevant teams from the Shanghai Municipal
    Commission of Economy and Informatization, Shanghai Media Group''s CBN (First
    Financial), Fudan University Smart City Research Center, and Donghao Lansheng
    (Group) Co., Ltd. The design and publication of this book were supported by the
    Shanghai Scientific & Technical Publishers of Shanghai Century Publishing Group.
    At the same time, the publication of this book would not have been possible without
    the strong support of the conference''s organizing units and leaders and relevant
    departments at all levels of Shanghai. Sincere thanks are extended to all of them.


    World Artificial Intelligence Conference Organizing Committee


    September 2020

