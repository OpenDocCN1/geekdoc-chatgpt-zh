- raw: "![](images/txt003_2.jpg \"pagenumber_ebook=25,pagenumber_book=9\")\n\n人工智能和机器人在感知、认知和行为方面的进展\n\
    \n如果按照感知、认知和行为的分类标准，人工智能在感知层面已经取得巨大进展。在专业的图像识别领域，人工智能几乎比任何人都做得好，问题只是需要多少算力、多少台计算机和多长时间来训练。就图像识别和语音识别而言，对于给定的字节流，人工智能系统都能够非常准确地识别和处理。\n\
    \n认知可能是最薄弱的领域。人工智能是不是能够理解概念？是不是能够有效推理？能否创造有意义的事物？目前有很多非常有创造力的、先进的人工智能技术，但是它们无法很好地控制创造性的活动。\n\
    \n行为层面，游戏是个很好的例子。在任何规则明确，或者说自由发挥空间比较有限的游戏中，人工智能表现得就像超人类。就目前而言，很难想象有什么游戏，人工智能游戏玩家的表现不能超越人类，更不用说人工智能的反应要比人类快很多。\n\
    \nL5级别自动驾驶很快就会实现\n\n我对于未来实现L5级别自动驾驶或完全自动驾驶非常有信心，我们很快就可以实现。\n\n我认为实现L5级别自动驾驶不存在底层的、根本性的挑战，但是还存在很多细节问题。我们面临的挑战是要解决所有这些小问题，然后整合系统，并持续解决长尾问题。我们经常会发现当可以解决绝大多数场景下的问题的时候，不时又会有一些不寻常的场景出现，所以必须有一个系统可以找出并解决这些不寻常场景下的问题。\n\
    \n这就是为什么需要在现实场景中训练我们的自动驾驶系统。没有什么比现实的场景更加复杂了，我们创建的任何模拟都是现实世界复杂性的子集。我们现在非常专注于处理L5级别自动驾驶的细节问题。我相信这些细节问题可以基于特斯拉车辆目前搭载的硬件版本解决，需要做的只是改进软件，从而实现L5级别自动驾驶。\n\
    \n特斯拉上海超级工厂进展很顺利，我对特斯拉团队感到无比自豪，我非常感谢特斯拉中国团队，他们出色的工作让我深感欣慰。未来我们的工厂中会运用更多人工智能和更智能化的软件。\n\
    \n自动辅助驾驶如何推动AI算法和芯片的发展，又如何改变我们对AI的理解\n\n在为自动辅助驾驶（autopilot）配备人工智能芯片时，我们发现市场上没有价格合理且低功耗的系统。如果我们只能用传统GPU、CPU或者其他类似产品，功率将会达到数百瓦，车辆的后备厢将被巨大的冷却系统填满。传统芯片不仅成本高昂、占用车辆空间，而且还存在高耗能的问题，而能耗对于电动汽车的行驶里程又非常关键。\n\
    \n为此，特斯拉自主研发了人工智能芯片，即具有双系统的特斯拉完全自动驾驶（FSD）芯片，该芯片具有8位元和加速器，用于点积运算。目前我们还未完全发挥出这个芯片的能力，几个月前才审慎地启动了芯片的第二套系统。距离充分利用特斯拉完全自动驾驶芯片的能力，可能还需要一段时间。\n\
    \n为了能够快速处理大量视频数据，我们还开发了特斯拉Dojo训练系统，以改善对人工智能系统的训练。Dojo系统就像一个FP16训练系统，目前主要受到芯片发热量和通信速率的限制。我们正在开发新的总线和散热冷却系统，用于开发更高效的计算机，从而能更有效处理视频数据。\n\
    \n在人工智能算法的发展方面，神经网络主要从现实中获取大量信息，很多来自无源光学方面，并创建矢量空间，本质上是将大量光子压缩为矢量空间。我们通常以类比的方式，将现实视为理所当然。但我认为，我们可以进入自己大脑中的矢量空间，了解大脑如何处理外部信息。事实上，大脑在做的是通过获取并过滤大量信息，只保留相关部分，从而记忆尽可能少的信息。大脑中的信息仅占原始数据很小的一部分，却可以根据这个矢量空间的表达做出决策，这实际上就类似一个大规模的压缩和解压缩的过程。\n\
    \n\uFEFF\n\nAI发展的透明、公平、安全、责任和隐私原则\n\n苏世民\n\n黑石集团董事长、首席执行官兼联合创始人\n\n![](images/txt004_1.jpg\
    \ \"pagenumber_ebook=28,pagenumber_book=12\")\n\n黑石集团董事长、首席执行官兼联合创始人。斯坦福大学“以人为本”人工智能研究所顾问委员会、对外关系委员会、企业圆桌会议和WEF国际企业委员会成员。2019年“巴伦（Barron）全球最佳首席执行官”提名者之一，并在2018年被《福布斯》（Forbes）评\
    \ 为“全球最具影响力人物”之一。在商业和慈善事业中，致力于用变革性的方法来解决重大问题。在麻省理工学院创建了一所致力于人工智能研究的新学院，并在清华大学建立了国际奖学金计划—施瓦茨曼学者奖（Schwarzman\
    \ Scholars），以培养、教育更加了解中国的未来世界领导人。\n\n![](images/txt004_2.jpg \"pagenumber_ebook=29,pagenumber_book=13\"\
    )\n\n近期，七国集团（G7）成立了“人工智能全球合作伙伴组织”（GPAI），这是一个令人鼓舞的开端。如果没有一个真正鼓励全球协作和跨学科合作的全球公约，各国均会承受很大损失，并影响各国在创新方面的进程。\n\
    \n人工智能可以帮助企业优化复杂的全球供应链和预测市场变化。利用人工智能，企业将能够打造更加灵活、可靠和有韧性的端到端供应链，在面对新冠疫情引发的全球业务中断时，基于人工智能的供应链会更加稳健可靠。创新会在世界各地产生，各国在人工智能领域的最佳实践应该共享，从而形成有益于人工智能发展和应用的新经验，造福所有国家。\n\
    \n近年来，世界上很多组织发布了合乎道德的人工智能发展原则和指南，这是全球讨论的一个良好的开端。虽然各国在对于某些问题的诠释、重视程度，以及实施思路方面存在复杂的区域和文化差异，但全球在“透明”“公平”“安全”“责任”和“隐私”等核心原则方面已经呈现出趋同的态势。\n\
    \n原则一：透明。人工智能系统中的决策应该是可解释和可审计的，并且决策的设计和实施都应该接受监督。人工智能系统和软件不能是黑盒子，我们需要能够容易理解何地、何时以及如何使用人工智能系统。\n\
    \n原则二：公平。技术不能够加剧偏见，而应该具有包容性，尽可能让更多人受益。\n\n原则三：安全。人工智能不应该造成可预见或无意的伤害，而应该是可靠的，且对破坏有抵抗力。\n\
    \n原则四：责任。由于人工智能系统决定错误而造成的伤害需要能明晰责任，并在适用情况下采取强制性的补救措施。研发人员需要考虑人工智能技术可能造成的任何风险，并表明他们已采取具体行动来降低风险。\n\
    \n原则五：隐私。人工智能的应用有赖于数据，因此需要有一套机制来保护人们的权利、利益和个人隐私。人工智能系统需要以易于理解的方式披露如何使用、储存和保护个人信息，用户也应该可以非常轻松地撤销对其个人信息的使用授权。\n\
    \n越早通过共同的治理框架来统一和应用这些原则，就越有可能避免人工智能可能带来的负面影响。中国多家组织已经展开行动，促进人工智能道德原则的实现，包括中国国家新一代人工智能专家委员会发布的治理原则，以及“世界人工智能大会”在2018年、2019年发布的两项上海人工智能治理计划等。\n\
    \n各国政府应该参与人工智能治理领域的合作和建设。在2018世界人工智能大会上，中国国家领导人表达了中国愿与其他国家合作发展人工智能，以期造福人类的愿望。现在，世界各国政府携手确保人工智能健康发展的时刻已经到来。\n\
    \n\uFEFF\n\n人工智能的未来：疫情下的深入思考\n\n张文宏\n\n复旦大学附属华山医院感染科主任\n\n![](images/txt005_1.jpg\
    \ \"pagenumber_ebook=31,pagenumber_book=15\")\n\n复旦大学附属华山医院感染科主任、肝病中心联合主任，复旦大学临床医学院内科系主任，教授，博士生导师。复旦大学生命科学学院双聘PI兼结核课题组组长，复旦大学医学分子病毒重点实验室双聘PI。毕业于上海医科大学医学系，曾分别在香港大学、哈佛大学医学院以及芝加哥州立大学微生物系从事访问学者及博士后工作。兼任中华医学会感染病学分会常委兼秘书长，中华预防医学会感染性疾病防控分会副主任委员，中国医师协会内科医师分会副会长，上海市医学会感染病学分会主任委员，上海市感染病医师协会创会会长。\n\
    \n陈 杰\n\n中国工程院院士，IEEE/IFAC会士，同济大学校长\n\n![](images/txt005_2.jpg \"pagenumber_ebook=32,pagenumber_book=16\"\
    )\n\n“复杂系统智能控制与决策”国家重点实验室主任、中国自动化学会副理事长、中国人工智能学会副理事长。主要研究方向为动态环境下复杂系统的多指标优化与智能控制、多智能体协同控制等。近年来，以第一完成人获国家自然科学二等奖1项、国家科技进步二等奖2项、省部级一等奖4项以及何梁何利基金“科学与技术进步奖”。发表SCI收录论文100余篇，以第一发明人获授权发明专利40多项，出版学术专著4部，教材和译著各1部。\n\
    \n沈向洋\n\n科学家、学者、前微软全球执行副总裁\n\n![](images/txt005_3.jpg \"pagenumber_ebook=33,pagenumber_book=17\"\
    )\n\n前微软全球执行副总裁，微软人工智能及微软研究事业部负责人。因其在计算机科学和人工智能领域的卓越学术成就，先后被推举评选为电气和电子工程师协会会士（IEEE\
    \ Fellow）、美国计算机协会会士（ACM Fellow）、美国国家工程院外籍院士、英国皇家工程院外籍院士。2020年3月，再次受聘为清华大学双聘教授，在西雅图清华大学创新学院（GIX）任教。\n\
    \n朱 民\n\n清华大学国家金融研究院院长，国际货币基金组织（IMF）原副总裁\n\n![](images/txt005_4.jpg \"pagenumber_ebook=34,pagenumber_book=18\"\
    )\n\n清华大学国家金融研究院院长，中英对话机制“一带一路”金融与专业服务公使，复旦大学校董，也是世界经济论坛董事会常务董事，彼特逊国际经济研究院董事会董事。2011年7月至2016年7月担任国际货币基金组织副总裁，此前，曾担任中国人民银行副行长和中国银行副行长。\n\
    \n![](images/txt005_5.jpg \"pagenumber_ebook=35,pagenumber_book=19\")\n\n人工智能在抗击新冠疫情中的作用\n\
    \n张文宏：现在大家都对人工智能寄予了极大的期望，但是在这次疫情初期，我们还是高度依赖人工的。当上海的防疫部队奔赴武汉时，我们很期望人工智能已经遍布全国—通过人工智能了解口罩、防护服、呼吸机以及尿不湿等资源的储备情况，并了解如何调配医疗资源。但很可惜，当时这些数据都还没有。\n\
    \n随着疫情的发展，我们逐渐深刻意识到人工智能具有非常大的潜力。当我被问到为何其他国家的城市难以取得如上海那样的防疫成果，我的回答是，人工智能和智能化管理在上海的疫情防控中起到了很好的作用。上海进行社交隔离后的一两个月时间内，人工智能在城市运行、人们生活、病患医疗方面起到了关键的作用。\n\
    \n![](images/txt005_6.jpg \"pagenumber_ebook=36,pagenumber_book=20\")\n\n人工智能如今如日中天，但是我非常遗憾地告诉大家，这次中国疫情的控制，整体上还是靠传统的智慧和城市的管理来实现的。人工智能在疫苗靶位预测、药物靶标发现上得到应用，但这些药物和疫苗都是为未来而造的。我们需要反思的是，在这次疫情过后，人工智能在未来可以如何改善我们的公共卫生体系。\n\
    \n陈杰：人工智能在此次防疫中起到了重要的作用。以同济大学为例，学校有来自海内外的4万多名学生，为了做到有效防控，我们利用人工智能技术将学校所有的教职员工和学生的信息整理并录入信息系统，并设计了一个智能识别系统，从而判断谁能够进入学校。为了减少矛盾，我们还将不能进入校园的四个理由自动显示在屏幕上，包括：来自疫情重点地区、在上海隔离未满14天、体温超过37.3℃和到访者不是同济大学的职工或学生。\n\
    \n沈向洋：人工智能在这次疫情中展示了三个方面的价值。第一，人工智能加速推进预防、诊断和相关治疗的研究，特别是疗程手段的突破。第二，从全球卫生健康、流行病学的数据里提取相关数据，然后将疫情数据的特征、变化、趋势直观立体地展现出来，供全球学者、医疗人员和相关领域专家共同探讨如何应对疫情风险。第三，远程医疗、远程协作等一系列新技术手段，更好地推动了医疗资源的分享，让有限的医疗资源可以服务更多的人口。这不仅对于发展中国家，对于发达国家也很重要。\n\
    \n我始终相信发展人工智能的目标是增强人类能力，造福人类未来。人工智能基础研究方面需要有新的突破，例如隐私保护、标准化、防止误操作性等方面的基础研究的推进，可以确保安全、可靠、高效地分享数据。疫情刚开始的时候，人工智能必须要解决的一个问题就是数据的问题。我们首先考虑的是怎样早发现、早预警、早阻断。随着人工智能的发展，未来我们将能够做到分钟级别的预警、小时级别的阻断。\n\
    \n人工智能提升未来公共卫生体系弹性\n\n张文宏：现在疾控数据、公共卫生数据和物理世界数据都是分散割裂的，这些数据如何第一时间在大数据平台、爬虫技术、图像识别技术的共同作用下融合，进而提供预警功能，这是非常重要的。\n\
    \n将来人工智能在公共卫生监测体系中的运用，以及医疗机构和公共卫生体系的融合，也就是新医防融合体系的构建，都离不开大数据。人工智能能做到什么程度，主要看我们如何运用大数据。我们如何把线下的数据和线上的数据结合，构成一个完整的体系并实现预警，如何把国际航班信息和各个国家的疫情程度结合，分析城市疫情“免疫力”，这些领域的研究都应该有数据支持。当前国际疫情防控的措施是熔断，但熔断不是人工智能。\n\
    \n![](images/txt005_7.jpg \"pagenumber_ebook=38,pagenumber_book=22\")\n\n朱民：我们不要用政府管理的办法来解决问题。未来，人工智能将发挥很大的作用，而其中的关键是打破数据孤岛。我们越来越意识到，我们活在一个复杂系统里，单纯利用人工智能解决单维的线上任务已经不足以解决我们面临的挑战，因此复杂系统的智能化在未来有无限的前景。\n\
    \n陈杰：现在很多数据和人工智能技术还没有完全应用到医疗卫生领域，很多基于大数据的学习方法，还是基于质量较高、有标识的数据。现在，各类传感器获取了大量时空数据，如何有效融合和处理这些复杂数据，如何处理数据的叠加涌现现象，这些都是我们面临的挑战。例如，这次疫情刚开始的时候，网络信息真假难辨，如何整合这些数据就是一个巨大的问题。\n\
    \n![](images/txt005_8.jpg \"pagenumber_ebook=39,pagenumber_book=23\")\n\n人工智能的未来\n\
    \n沈向洋：关于人工智能未来的发展，我讲三个方面。第一，我觉得接下来非常重要的变化是认知—感知的巨大变化。这些年的深度学习工作，像计算机视觉、语音识别，都拓展了我们认知—感知的边界。第二，未来人工智能发展的核心是交互问题。在计算机出现之前，我们主要是人人交互；计算机出现之后就变成了人机交互；未来最激动人心的是人和AI的交互。第三，人工智能要得到更大的发展就必须解决常识的问题。我们只有让AI能够理解常识，才能真正地迈入人工智能的世界。\n\
    \n陈杰：未来的世界应该是信息空间、物理空间和人类社会空间共同构建形成的一个新的信息物理系统。在这个新的系统中，人工智能能够帮助人类拓展认知边界。人工智能对于未来社会的经济系统、工业系统、社会系统、出行系统以及城市管理系统，都将起到关键性的作用。\n\
    \n现在的机器学习方法，从原来传统的深度学习向强化学习、迁移学习、进化学习不断转移。未来，机器与人将各司其职，人在这个新的系统中既是操作者，又是平等的参与者。未来人和机器怎样共融，这是一个重要的命题。\n\
    \n朱民：疫情后的人工智能大潮正在到来，这个大潮跟以前相比会有结构性的变化。以前人工智能是to C，是面向消费者；现在开始会更多地走向to B；以后则会发展为to\
    \ S（社会）。这是一个极其宏大的场景。人工智能发展中很重要的因素是数据，我们需要打破数据垄断，真正将数据变成资源和生产力。最终，人工智能将从感知走向认知，形成人和人工智能的交互，机器将帮助我们更好地认识世界，扩展思维能力。这将是美好的未来。\n\
    \n\uFEFF\n\n方 向\n\n\uFEFF\n\n探索人工智能的新机与新局\n\n马化腾\n\n腾讯公司董事会主席兼首席执行官\n\n![](images/txt007_1.jpg\
    \ \"pagenumber_ebook=44,pagenumber_book=28\")\n\n腾讯公司主要创办人之一，腾讯公司董事会主席兼首席执行官，全面负责公司的战略规划、定位和管理。2018年，在《财富》杂志“中国最具影响力50位商界领袖”中名列榜首，并于2017年入选《哈佛商业评论》“全球百位最佳CEO”榜单。\n\
    \n任宇昕\n\n腾讯集团首席运营官\n\n![](images/txt007_2.jpg \"pagenumber_ebook=45,pagenumber_book=29\"\
    )\n\n自2012年5月起出任腾讯集团首席运营官，全面负责互动娱乐事业群以及平台与内容事业群的管理和发展。于2000年加入腾讯，自2005年9月起，全面负责互动娱乐业务系统的游戏开发、运营、市场、渠道销售等工作，并于2018年开始带领平台与内容事业群的发展。在加入腾讯之前，曾在华为技术有限公司工作。毕业于电子科技大学计算机科学与工程专业，并拥有中欧国际工商学院EMBA学位。\n\
    \n马化腾：人工智能是一个跨国、跨学科的科学探索工程，它正在将人类的认知推向“更快、更高、更强”，也势必带给我们一场前所未见的科技与产业革命。目前，我们对人工智能等新科技的未知仍然大于已知。我们每天都在研究和应用新科技，归根到底要为每一位用户负责。我们要做到“AI向善”，就要努力让人工智能实现“可知、可控、可用、可靠”。这是全世界共同面对的课题，也是腾讯把“科技向善”纳入公司的使命和愿景的原因。\n\
    \n作为中国改革开放的前沿窗口，上海为我们解决世界级课题提供了合作交流的平台。未来，腾讯华东总部将进一步扎根上海，成为上海人工智能高地的建设者之一。我们会加快新基建投入，与上海一起，在危机中育新机、于变局中开新局，为上海乃至长三角一体化发展注入新动能。\n\
    \n任宇昕：我主要以三个“新”来跟大家分享我们在人工智能领域的思考与探索。\n\n第一个“新”是新增长（New Growth）。\n\n疫情常态化，让复工复产变得很有挑战性。为保证“物流、资金流、信息流”的畅通，AI发挥了重大作用。比如：上海的优图人工智能实验室向中外公司提供了OCR（光学字符识别）技术，它代替了人工录入物流单据；腾讯安全团队帮助小微企业获得“零接触”的线上信贷服务；基于人工智能的同传技术，如果与在线会议系统、社交工具等结合在一起，就能让人们随时随地进行不受场地、交通、语言限制的国际会议。\n\
    \n![](images/txt007_3.jpg \"pagenumber_ebook=47,pagenumber_book=31\")\n\n新药的研发往往需要10年以上的时间，但人工智能可能改变这种局面。比如腾讯的人工智能药物发现平台“云深智药”已向科研人员全面开放，我们希望借助机器学习，缩短新药研发的时间。"
  fmt: "\n# 人工智能和机器人在感知、认知和行为方面的进展\n\n如果按照感知、认知和行为的分类标准，人工智能在感知层面已经取得巨大进展。在专业的图像识别领域，人工智能几乎比任何人都做得好，问题只是需要多少算力、多少台计算机和多长时间来训练。就图像识别和语音识别而言，对于给定的字节流，人工智能系统都能够非常准确地识别和处理。\n\
    \n认知可能是最薄弱的领域。人工智能是不是能够理解概念？是不是能够有效推理？能否创造有意义的事物？目前有很多非常有创造力的、先进的人工智能技术，但是它们无法很好地控制创造性的活动。\n\
    \n行为层面，游戏是个很好的例子。在任何规则明确，或者说自由发挥空间比较有限的游戏中，人工智能表现得就像超人类。就目前而言，很难想象有什么游戏，人工智能游戏玩家的表现不能超越人类，更不用说人工智能的反应要比人类快很多。\n\
    \n## L5级别自动驾驶很快就会实现\n\n我对于未来实现L5级别自动驾驶或完全自动驾驶非常有信心，我们很快就可以实现。\n\n我认为实现L5级别自动驾驶不存在底层的、根本性的挑战，但是还存在很多细节问题。我们面临的挑战是要解决所有这些小问题，然后整合系统，并持续解决长尾问题。我们经常会发现当可以解决绝大多数场景下的问题的时候，不时又会有一些不寻常的场景出现，所以必须有一个系统可以找出并解决这些不寻常场景下的问题。\n\
    \n这就是为什么需要在现实场景中训练我们的自动驾驶系统。没有什么比现实的场景更加复杂了，我们创建的任何模拟都是现实世界复杂性的子集。我们现在非常专注于处理L5级别自动驾驶的细节问题。我相信这些细节问题可以基于特斯拉车辆目前搭载的硬件版本解决，需要做的只是改进软件，从而实现L5级别自动驾驶。\n\
    \n## 特斯拉上海超级工厂进展很顺利\n\n我对特斯拉团队感到无比自豪，我非常感谢特斯拉中国团队，他们出色的工作让我深感欣慰。未来我们的工厂中会运用更多人工智能和更智能化的软件。\n\
    \n## 自动辅助驾驶如何推动AI算法和芯片的发展，又如何改变我们对AI的理解\n\n在为自动辅助驾驶（`autopilot`）配备人工智能芯片时，我们发现市场上没有价格合理且低功耗的系统。如果我们只能用传统`GPU`、`CPU`或者其他类似产品，功率将会达到数百瓦，车辆的后备厢将被巨大的冷却系统填满。传统芯片不仅成本高昂、占用车辆空间，而且还存在高耗能的问题，而能耗对于电动汽车的行驶里程又非常关键。\n\
    \n为此，特斯拉自主研发了人工智能芯片，即具有双系统的特斯拉完全自动驾驶（`FSD`）芯片，该芯片具有8位元和加速器，用于点积运算。目前我们还未完全发挥出这个芯片的能力，几个月前才审慎地启动了芯片的第二套系统。距离充分利用特斯拉完全自动驾驶芯片的能力，可能还需要一段时间。\n\
    \n为了能够快速处理大量视频数据，我们还开发了特斯拉`Dojo`训练系统，以改善对人工智能系统的训练。`Dojo`系统就像一个`FP16`训练系统，目前主要受到芯片发热量和通信速率的限制。我们正在开发新的总线和散热冷却系统，用于开发更高效的计算机，从而能更有效处理视频数据。\n\
    \n在人工智能算法的发展方面，神经网络主要从现实中获取大量信息，很多来自无源光学方面，并创建矢量空间，本质上是将大量光子压缩为矢量空间。我们通常以类比的方式，将现实视为理所当然。但我认为，我们可以进入自己大脑中的矢量空间，了解大脑如何处理外部信息。事实上，大脑在做的是通过获取并过滤大量信息，只保留相关部分，从而记忆尽可能少的信息。大脑中的信息仅占原始数据很小的一部分，却可以根据这个矢量空间的表达做出决策，这实际上就类似一个大规模的压缩和解压缩的过程。\n\
    \n# AI发展的透明、公平、安全、责任和隐私原则\n\n> **苏世民**  \n> 黑石集团董事长、首席执行官兼联合创始人\n\n近期，七国集团（`G7`）成立了“人工智能全球合作伙伴组织”（`GPAI`），这是一个令人鼓舞的开端。如果没有一个真正鼓励全球协作和跨学科合作的全球公约，各国均会承受很大损失，并影响各国在创新方面的进程。\n\
    \n人工智能可以帮助企业优化复杂的全球供应链和预测市场变化。利用人工智能，企业将能够打造更加灵活、可靠和有韧性的端到端供应链，在面对新冠疫情引发的全球业务中断时，基于人工智能的供应链会更加稳健可靠。创新会在世界各地产生，各国在人工智能领域的最佳实践应该共享，从而形成有益于人工智能发展和应用的新经验，造福所有国家。\n\
    \n近年来，世界上很多组织发布了合乎道德的人工智能发展原则和指南，这是全球讨论的一个良好的开端。虽然各国在对于某些问题的诠释、重视程度，以及实施思路方面存在复杂的区域和文化差异，但全球在“透明”“公平”“安全”“责任”和“隐私”等核心原则方面已经呈现出趋同的态势。\n\
    \n### 原则一：透明\n\n人工智能系统中的决策应该是可解释和可审计的，并且决策的设计和实施都应该接受监督。人工智能系统和软件不能是黑盒子，我们需要能够容易理解何地、何时以及如何使用人工智能系统。\n\
    \n### 原则二：公平\n\n技术不能够加剧偏见，而应该具有包容性，尽可能让更多人受益。\n\n### 原则三：安全\n\n人工智能不应该造成可预见或无意的伤害，而应该是可靠的，且对破坏有抵抗力。\n\
    \n### 原则四：责任\n\n由于人工智能系统决定错误而造成的伤害需要能明晰责任，并在适用情况下采取强制性的补救措施。研发人员需要考虑人工智能技术可能造成的任何风险，并表明他们已采取具体行动来降低风险。\n\
    \n### 原则五：隐私\n\n人工智能的应用有赖于数据，因此需要有一套机制来保护人们的权利、利益和个人隐私。人工智能系统需要以易于理解的方式披露如何使用、储存和保护个人信息，用户也应该可以非常轻松地撤销对其个人信息的使用授权。\n\
    \n越早通过共同的治理框架来统一和应用这些原则，就越有可能避免人工智能可能带来的负面影响。中国多家组织已经展开行动，促进人工智能道德原则的实现，包括中国国家新一代人工智能专家委员会发布的治理原则，以及“世界人工智能大会”在2018年、2019年发布的两项上海人工智能治理计划等。\n\
    \n各国政府应该参与人工智能治理领域的合作和建设。在2018世界人工智能大会上，中国国家领导人表达了中国愿与其他国家合作发展人工智能，以期造福人类的愿望。现在，世界各国政府携手确保人工智能健康发展的时刻已经到来。\n\
    \n# 人工智能的未来：疫情下的深入思考\n\n## 嘉宾介绍\n\n**张文宏**  \n复旦大学附属华山医院感染科主任\n\n**陈杰**  \n中国工程院院士，`IEEE`/`IFAC`会士，同济大学校长\n\
    \n**沈向洋**  \n科学家、学者、前微软全球执行副总裁\n\n**朱民**  \n清华大学国家金融研究院院长，国际货币基金组织（`IMF`）原副总裁\n\
    \n## 人工智能在抗击新冠疫情中的作用\n\n**张文宏**：现在大家都对人工智能寄予了极大的期望，但是在这次疫情初期，我们还是高度依赖人工的。当上海的防疫部队奔赴武汉时，我们很期望人工智能已经遍布全国—通过人工智能了解口罩、防护服、呼吸机以及尿不湿等资源的储备情况，并了解如何调配医疗资源。但很可惜，当时这些数据都还没有。\n\
    \n随着疫情的发展，我们逐渐深刻意识到人工智能具有非常大的潜力。当我被问到为何其他国家的城市难以取得如上海那样的防疫成果，我的回答是，人工智能和智能化管理在上海的疫情防控中起到了很好的作用。上海进行社交隔离后的一两个月时间内，人工智能在城市运行、人们生活、病患医疗方面起到了关键的作用。\n\
    \n人工智能如今如日中天，但是我非常遗憾地告诉大家，这次中国疫情的控制，整体上还是靠传统的智慧和城市的管理来实现的。人工智能在疫苗靶位预测、药物靶标发现上得到应用，但这些药物和疫苗都是为未来而造的。我们需要反思的是，在这次疫情过后，人工智能在未来可以如何改善我们的公共卫生体系。\n\
    \n**陈杰**：人工智能在此次防疫中起到了重要的作用。以同济大学为例，学校有来自海内外的4万多名学生，为了做到有效防控，我们利用人工智能技术将学校所有的教职员工和学生的信息整理并录入信息系统，并设计了一个智能识别系统，从而判断谁能够进入学校。为了减少矛盾，我们还将不能进入校园的四个理由自动显示在屏幕上，包括：来自疫情重点地区、在上海隔离未满14天、体温超过37.3℃和到访者不是同济大学的职工或学生。\n\
    \n**沈向洋**：人工智能在这次疫情中展示了三个方面的价值。第一，人工智能加速推进预防、诊断和相关治疗的研究，特别是疗程手段的突破。第二，从全球卫生健康、流行病学的数据里提取相关数据，然后将疫情数据的特征、变化、趋势直观立体地展现出来，供全球学者、医疗人员和相关领域专家共同探讨如何应对疫情风险。第三，远程医疗、远程协作等一系列新技术手段，更好地推动了医疗资源的分享，让有限的医疗资源可以服务更多的人口。这不仅对于发展中国家，对于发达国家也很重要。\n\
    \n我始终相信发展人工智能的目标是增强人类能力，造福人类未来。人工智能基础研究方面需要有新的突破，例如隐私保护、标准化、防止误操作性等方面的基础研究的推进，可以确保安全、可靠、高效地分享数据。疫情刚开始的时候，人工智能必须要解决的一个问题就是数据的问题。我们首先考虑的是怎样早发现、早预警、早阻断。随着人工智能的发展，未来我们将能够做到分钟级别的预警、小时级别的阻断。\n\
    \n## 人工智能提升未来公共卫生体系弹性\n\n**张文宏**：现在疾控数据、公共卫生数据和物理世界数据都是分散割裂的，这些数据如何第一时间在大数据平台、爬虫技术、图像识别技术的共同作用下融合，进而提供预警功能，这是非常重要的。\n\
    \n将来人工智能在公共卫生监测体系中的运用，以及医疗机构和公共卫生体系的融合，也就是新医防融合体系的构建，都离不开大数据。人工智能能做到什么程度，主要看我们如何运用大数据。我们如何把线下的数据和线上的数据结合，构成一个完整的体系并实现预警，如何把国际航班信息和各个国家的疫情程度结合，分析城市疫情“免疫力”，这些领域的研究都应该有数据支持。当前国际疫情防控的措施是熔断，但熔断不是人工智能。\n\
    \n**朱民**：我们不要用政府管理的办法来解决问题。未来，人工智能将发挥很大的作用，而其中的关键是打破数据孤岛。我们越来越意识到，我们活在一个复杂系统里，单纯利用人工智能解决单维的线上任务已经不足以解决我们面临的挑战，因此复杂系统的智能化在未来有无限的前景。\n\
    \n**陈杰**：现在很多数据和人工智能技术还没有完全应用到医疗卫生领域，很多基于大数据的学习方法，还是基于质量较高、有标识的数据。现在，各类传感器获取了大量时空数据，如何有效融合和处理这些复杂数据，如何处理数据的叠加涌现现象，这些都是我们面临的挑战。例如，这次疫情刚开始的时候，网络信息真假难辨，如何整合这些数据就是一个巨大的问题。\n\
    \n## 人工智能的未来\n\n**沈向洋**：关于人工智能未来的发展，我讲三个方面。第一，我觉得接下来非常重要的变化是认知—感知的巨大变化。这些年的深度学习工作，像计算机视觉、语音识别，都拓展了我们认知—感知的边界。第二，未来人工智能发展的核心是交互问题。在计算机出现之前，我们主要是人人交互；计算机出现之后就变成了人机交互；未来最激动人心的是人和`AI`的交互。第三，人工智能要得到更大的发展就必须解决常识的问题。我们只有让`AI`能够理解常识，才能真正地迈入人工智能的世界。\n\
    \n**陈杰**：未来的世界应该是信息空间、物理空间和人类社会空间共同构建形成的一个新的信息物理系统。在这个新的系统中，人工智能能够帮助人类拓展认知边界。人工智能对于未来社会的经济系统、工业系统、社会系统、出行系统以及城市管理系统，都将起到关键性的作用。\n\
    \n现在的机器学习方法，从原来传统的深度学习向强化学习、迁移学习、进化学习不断转移。未来，机器与人将各司其职，人在这个新的系统中既是操作者，又是平等的参与者。未来人和机器怎样共融，这是一个重要的命题。\n\
    \n**朱民**：疫情后的人工智能大潮正在到来，这个大潮跟以前相比会有结构性的变化。以前人工智能是`to C`，是面向消费者；现在开始会更多地走向`to B`；以后则会发展为`to\
    \ S`（社会）。这是一个极其宏大的场景。人工智能发展中很重要的因素是数据，我们需要打破数据垄断，真正将数据变成资源和生产力。最终，人工智能将从感知走向认知，形成人和人工智能的交互，机器将帮助我们更好地认识世界，扩展思维能力。这将是美好的未来。\n\
    \n# 探索人工智能的新机与新局\n\n## 嘉宾介绍\n\n**马化腾**  \n腾讯公司董事会主席兼首席执行官\n\n**任宇昕**  \n腾讯集团首席运营官\n\
    \n**马化腾**：人工智能是一个跨国、跨学科的科学探索工程，它正在将人类的认知推向“更快、更高、更强”，也势必带给我们一场前所未见的科技与产业革命。目前，我们对人工智能等新科技的未知仍然大于已知。我们每天都在研究和应用新科技，归根到底要为每一位用户负责。我们要做到“`AI`向善”，就要努力让人工智能实现“可知、可控、可用、可靠”。这是全世界共同面对的课题，也是腾讯把“科技向善”纳入公司的使命和愿景的原因。\n\
    \n作为中国改革开放的前沿窗口，上海为我们解决世界级课题提供了合作交流的平台。未来，腾讯华东总部将进一步扎根上海，成为上海人工智能高地的建设者之一。我们会加快新基建投入，与上海一起，在危机中育新机、于变局中开新局，为上海乃至长三角一体化发展注入新动能。\n\
    \n**任宇昕**：我主要以三个“新”来跟大家分享我们在人工智能领域的思考与探索。\n\n### 第一个“新”是新增长（`New Growth`）\n\n\
    疫情常态化，让复工复产变得很有挑战性。为保证“物流、资金流、信息流”的畅通，`AI`发挥了重大作用。比如：上海的优图人工智能实验室向中外公司提供了`OCR`（光学字符识别）技术，它代替了人工录入物流单据；腾讯安全团队帮助小微企业获得“零接触”的线上信贷服务；基于人工智能的同传技术，如果与在线会议系统、社交工具等结合在一起，就能让人们随时随地进行不受场地、交通、语言限制的国际会议。\n\
    \n新药的研发往往需要10年以上的时间，但人工智能可能改变这种局面。比如腾讯的人工智能药物发现平台“云深智药”已向科研人员全面开放，我们希望借助机器学习，缩短新药研发的时间。\n"
  trans: "\n\n# Advances in AI and Robotics in Perception, Cognition, and Behavior\n\
    \nIf categorized by perception, cognition, and behavior, artificial intelligence\
    \ has made tremendous progress at the perceptual level. In the professional field\
    \ of image recognition, AI performs almost better than any human; the only question\
    \ is how much computing power, how many computers, and how long it takes to train.\
    \ Regarding both image and speech recognition, for a given byte stream, AI systems\
    \ can recognize and process it with high accuracy.\n\nCognition is perhaps the\
    \ weakest area. Can AI understand concepts? Can it reason effectively? Can it\
    \ create meaningful things? There are currently many highly creative, advanced\
    \ AI technologies, but they cannot well control creative activities.\n\nIn terms\
    \ of behavior, gaming is a good example. In any game with explicit rules, or where\
    \ the degree of freedom is relatively limited, AI performs like a superhuman.\
    \ As of now, it is hard to imagine any game where AI players cannot surpass humans,\
    \ not to mention that AI reacts much faster than humans.\n\n## L5 Autonomous Driving\
    \ Will Be Achieved Soon\n\nI am very confident that L5 autonomous driving, or\
    \ full self-driving, will be achieved in the future, and we can achieve it soon.\n\
    \nI don't think there are any fundamental, underlying challenges to achieving\
    \ L5 autonomy, but there are many detail-oriented problems. The challenge we face\
    \ is solving all these small problems, integrating the systems, and continuously\
    \ addressing the long-tail problems. We often find that just when we can solve\
    \ problems in the vast majority of scenarios, some unusual scenarios pop up from\
    \ time to time, so there must be a system to identify and solve problems in these\
    \ unusual scenarios.\n\nThis is why we need to train our autonomous driving systems\
    \ in real-world scenarios. Nothing is more complex than real-world scenarios;\
    \ any simulation we create is a subset of the complexity of the real world. We\
    \ are currently very focused on solving the detail problems of L5 autonomous driving.\
    \ I believe these detail problems can be solved based on the hardware version\
    \ currently equipped in Tesla vehicles; all that needs to be done is to improve\
    \ the software to achieve L5 autonomous driving.\n\n## Tesla Shanghai Gigafactory\
    \ Progressing Smoothly\n\nI am incredibly proud of the Tesla team, and I am very\
    \ grateful to the Tesla China team; their outstanding work gives me great relief.\
    \ In the future, our factories will utilize more AI and smarter software.\n\n\
    ## How Autonomous Driving Drives AI Algorithm and Chip Development, and Changes\
    \ Our Understanding of AI\n\nWhen equipping Autopilot with AI chips, we found\
    \ there were no reasonably priced, low-power systems on the market. If we could\
    \ only use traditional GPUs, CPUs, or similar products, the power consumption\
    \ would reach hundreds of watts, and the vehicle's trunk would be filled with\
    \ a huge cooling system. Traditional chips are not only costly and take up vehicle\
    \ space, but they also have high energy consumption issues, while energy consumption\
    \ is critical to the driving range of electric vehicles.\n\nTo this end, Tesla\
    \ developed its own AI chip: the Tesla Full Self-Driving (FSD) chip with dual\
    \ systems. This chip features 8-bit integers and accelerators for dot product\
    \ operations. We have not yet fully unleashed the capabilities of this chip; it\
    \ was only a few months ago that we prudently activated the chip's second system.\
    \ It may take a while before we fully utilize the capabilities of the Tesla FSD\
    \ chip.\n\nTo rapidly process massive amounts of video data, we also developed\
    \ the Tesla Dojo training system to improve the training of AI systems. The Dojo\
    \ system is like an FP16 training system, currently limited mainly by chip heat\
    \ generation and communication bandwidth. We are developing new buses and thermal\
    \ cooling systems to develop more efficient computers, thereby processing video\
    \ data more effectively.\n\nIn terms of AI algorithm development, neural networks\
    \ primarily acquire massive amounts of information from reality, much of it from\
    \ passive optics, and create vector spaces—essentially compressing massive amounts\
    \ of photons into vector spaces. We usually take reality for granted by way of\
    \ analogy. But I think we can enter the vector space in our own brains to understand\
    \ how the brain processes external information. In fact, what the brain does is\
    \ acquire and filter massive amounts of information, retaining only the relevant\
    \ parts, thereby memorizing as little information as possible. The information\
    \ in the brain accounts for only a tiny fraction of the raw data, yet it can make\
    \ decisions based on the representation of this vector space, which is actually\
    \ similar to a large-scale compression and decompression process.\n\n# Principles\
    \ of Transparency, Fairness, Safety, Responsibility, and Privacy in AI Development\n\
    \n> **Stephen A. Schwarzman**  \n> Chairman, CEO, and Co-Founder of Blackstone\n\
    \nRecently, the Group of Seven (G7) established the \"Global Partnership on Artificial\
    \ Intelligence\" (GPAI), which is an encouraging start. Without a true global\
    \ convention that encourages global collaboration and interdisciplinary cooperation,\
    \ all countries will suffer significant losses and impact the innovation process\
    \ of each nation.\n\nAI can help enterprises optimize complex global supply chains\
    \ and predict market changes. By leveraging AI, enterprises will be able to build\
    \ more flexible, reliable, and resilient end-to-end supply chains; in the face\
    \ of global business disruptions caused by the COVID-19 pandemic, AI-based supply\
    \ chains will be more robust and reliable. Innovation will emerge all over the\
    \ world, and best practices in AI from various countries should be shared to form\
    \ new experiences beneficial to AI development and application, benefiting all\
    \ nations.\n\nIn recent years, many organizations worldwide have released ethical\
    \ AI development principles and guidelines, which is a good start for global discussion.\
    \ Although there are complex regional and cultural differences in the interpretation,\
    \ emphasis, and implementation approaches of certain issues among countries, the\
    \ world has shown a converging trend on core principles such as \"Transparency,\"\
    \ \"Fairness,\" \"Safety,\" \"Responsibility,\" and \"Privacy.\"\n\n### Principle\
    \ 1: Transparency\n\nDecision-making in AI systems should be explainable and auditable,\
    \ and the design and implementation of decisions should be subject to oversight.\
    \ AI systems and software cannot be black boxes; we need to be able to easily\
    \ understand where, when, and how AI systems are used.\n\n### Principle 2: Fairness\n\
    \nTechnology must not exacerbate bias but should be inclusive, benefiting as many\
    \ people as possible.\n\n### Principle 3: Safety\n\nAI should not cause foreseeable\
    \ or unintended harm; it should be reliable and resistant to disruption.\n\n###\
    \ Principle 4: Responsibility\n\nHarm caused by errors in AI system decisions\
    \ must be clearly attributable, and mandatory remedial measures should be taken\
    \ where applicable. Researchers and developers need to consider any risks that\
    \ AI technology may pose and demonstrate that they have taken concrete actions\
    \ to mitigate risks.\n\n### Principle 5: Privacy\n\nAI applications rely on data;\
    \ therefore, there needs to be a mechanism to protect people's rights, interests,\
    \ and personal privacy. AI systems need to disclose in an easy-to-understand manner\
    \ how personal information is used, stored, and protected. Users should also be\
    \ able to revoke authorization for the use of their personal information very\
    \ easily.\n\nThe sooner these principles are unified and applied through a common\
    \ governance framework, the more likely we are to avoid the potential negative\
    \ impacts of AI. Many organizations in China have already taken action to promote\
    \ the realization of AI ethical principles, including the governance principles\
    \ released by the National New Generation AI Expert Committee, and the two Shanghai\
    \ AI Governance Initiatives released at the World Artificial Intelligence Conference\
    \ (WAIC) in 2018 and 2019.\n\nGovernments of all countries should participate\
    \ in cooperation and construction in the field of AI governance. At the 2018 WAIC,\
    \ Chinese state leaders expressed China's willingness to cooperate with other\
    \ countries in developing AI for the benefit of humanity. Now, the time has come\
    \ for governments worldwide to join hands to ensure the healthy development of\
    \ AI.\n\n# The Future of AI: Deep Reflections Amid the Pandemic\n\n## Guest Introductions\n\
    \n**Zhang Wenhong**  \nDirector, Department of Infectious Diseases, Huashan Hospital\
    \ Affiliated to Fudan University\n\n**Chen Jie**  \nAcademician of the Chinese\
    \ Academy of Engineering, IEEE/IFAC Fellow, President of Tongji University\n\n\
    **Shen Xiangyang (Harry Shum)**  \nScientist, Scholar, Former Executive Vice President\
    \ of Microsoft Global\n\n**Zhu Min**  \nDean, National Institute of Financial\
    \ Research, Tsinghua University; Former Deputy Managing Director of the International\
    \ Monetary Fund (IMF)\n\n## The Role of AI in Fighting the COVID-19 Pandemic\n\
    \n**Zhang Wenhong**: Now everyone has high expectations for AI, but in the early\
    \ stages of this epidemic, we were still highly dependent on manual labor. When\
    \ Shanghai's epidemic prevention teams rushed to Wuhan, we hoped AI was already\
    \ ubiquitous nationwide—using AI to understand reserves of masks, protective suits,\
    \ ventilators, and even diapers, and how to allocate medical resources. Unfortunately,\
    \ at that time, this data simply did not exist.\n\nAs the epidemic developed,\
    \ we gradually realized the huge potential of AI. When asked why other countries'\
    \ cities found it difficult to achieve epidemic control results like Shanghai,\
    \ my answer is that AI and intelligent management played a very good role in Shanghai's\
    \ epidemic prevention and control. Within one or two months after Shanghai implemented\
    \ social distancing, AI played a key role in city operations, people's lives,\
    \ and patient care.\n\nAI is currently at its peak, but I regret to tell you that\
    \ overall, China's control of this epidemic was still achieved relying on traditional\
    \ wisdom and city management. AI has been applied in vaccine target prediction\
    \ and drug target discovery, but these drugs and vaccines are made for the future.\
    \ What we need to reflect on is how AI can improve our public health system in\
    \ the future after this epidemic.\n\n**Chen Jie**: AI played an important role\
    \ in this epidemic prevention. Taking Tongji University as an example, the school\
    \ has over 40,000 students from home and abroad. To achieve effective prevention\
    \ and control, we used AI technology to organize and enter the information of\
    \ all faculty, staff, and students into the information system, and designed an\
    \ intelligent recognition system to determine who could enter the school. To reduce\
    \ conflicts, we also automatically displayed the four reasons for denial of entry\
    \ on the screen: coming from key epidemic areas, not having completed 14 days\
    \ of quarantine in Shanghai, body temperature exceeding 37.3°C, and visitors not\
    \ being Tongji University faculty or students.\n\n**Shen Xiangyang**: AI demonstrated\
    \ value in three aspects during this epidemic. First, AI accelerated the research\
    \ on prevention, diagnosis, and related treatments, particularly breakthroughs\
    \ in therapeutic means. Second, extracting relevant data from global public health\
    \ and epidemiological data, and then intuitively and three-dimensionally presenting\
    \ the characteristics, changes, and trends of epidemic data for global scholars,\
    \ medical staff, and experts in related fields to jointly discuss how to respond\
    \ to epidemic risks. Third, a series of new technical means such as telemedicine\
    \ and remote collaboration better promoted the sharing of medical resources, allowing\
    \ limited medical resources to serve more people. This is important not only for\
    \ developing countries but also for developed countries.\n\nI have always believed\
    \ that the goal of developing AI is to augment human capabilities and benefit\
    \ the future of humanity. New breakthroughs are needed in basic AI research, such\
    \ as the advancement of basic research in privacy protection, standardization,\
    \ and prevention of misuse, to ensure data is shared safely, reliably, and efficiently.\
    \ At the beginning of the epidemic, one problem AI had to solve was the data issue.\
    \ We first considered how to achieve early detection, early warning, and early\
    \ interception. With the development of AI, in the future, we will be able to\
    \ achieve minute-level warning and hour-level interception.\n\n## AI Enhancing\
    \ the Resilience of Future Public Health Systems\n\n**Zhang Wenhong**: Currently,\
    \ disease control data, public health data, and physical world data are scattered\
    \ and siloed. How these data can be integrated in the first place under the joint\
    \ action of big data platforms, crawler technology, and image recognition technology\
    \ to provide early warning functions is very important.\n\nThe future application\
    \ of AI in public health monitoring systems, and the integration of medical institutions\
    \ and public health systems—that is, the construction of a new \"medical-prevention\
    \ integration\" system—are inseparable from big data. To what extent AI can achieve\
    \ depends mainly on how we utilize big data. How we combine offline data with\
    \ online data to form a complete system and achieve early warning, how we combine\
    \ international flight information with the epidemic severity of various countries\
    \ to analyze a city's epidemic \"immunity\"—research in these areas should all\
    \ be data-driven. Current international epidemic prevention measures are \"circuit\
    \ breakers,\" but circuit breakers are not AI.\n\n**Zhu Min**: We should not use\
    \ government administrative methods to solve problems. In the future, AI will\
    \ play a huge role, and the key is to break data silos. We are increasingly aware\
    \ that we live in a complex system; simply using AI to solve single-dimensional\
    \ online tasks is no longer sufficient to address the challenges we face. Therefore,\
    \ the intelligentization of complex systems has unlimited prospects in the future.\n\
    \n**Chen Jie**: Currently, a lot of data and AI technologies have not been fully\
    \ applied to the medical and health field. Many big data-based learning methods\
    \ still rely on high-quality, labeled data. Now, various sensors have acquired\
    \ massive spatiotemporal data; how to effectively integrate and process these\
    \ complex data, and how to handle the superposition and emergence phenomena of\
    \ data—these are the challenges we face. For example, at the beginning of this\
    \ epidemic, online information was mixed with truth and falsehood; how to integrate\
    \ these data was a huge problem.\n\n## The Future of AI\n\n**Shen Xiangyang**:\
    \ Regarding the future development of AI, I will talk about three aspects. First,\
    \ I think the next very important change is a huge shift in cognition-perception.\
    \ Years of deep learning work, like computer vision and speech recognition, have\
    \ expanded the boundaries of our cognition-perception. Second, the core of future\
    \ AI development is the interaction problem. Before computers appeared, we mainly\
    \ had human-human interaction; after computers appeared, it became human-computer\
    \ interaction; the most exciting thing in the future is human-AI interaction.\
    \ Third, AI must solve the common sense problem to achieve greater development.\
    \ Only by enabling AI to understand common sense can we truly enter the world\
    \ of AI.\n\n**Chen Jie**: The future world should be a new cyber-physical system\
    \ jointly constructed by information space, physical space, and human social space.\
    \ In this new system, AI can help humans expand cognitive boundaries. AI will\
    \ play a key role in the future society's economic system, industrial system,\
    \ social system, transportation system, and urban management system.\n\nCurrent\
    \ machine learning methods are continuously shifting from traditional deep learning\
    \ to reinforcement learning, transfer learning, and evolutionary learning. In\
    \ the future, machines and humans will each perform their duties; humans in this\
    \ new system are both operators and equal participants. How humans and machines\
    \ will integrate in the future is an important proposition.\n\n**Zhu Min**: A\
    \ post-epidemic AI wave is coming, and this wave will have structural changes\
    \ compared to the past. Previously, AI was \"to C\" (consumer-facing); now it\
    \ is starting to move more towards \"to B\" (business-facing); in the future,\
    \ it will develop into \"to S\" (society-facing). This is an extremely grand scenario.\
    \ A very important factor in AI development is data; we need to break data monopolies\
    \ and truly turn data into resources and productivity. Ultimately, AI will move\
    \ from perception to cognition, forming human-AI interaction, and machines will\
    \ help us better understand the world and expand our thinking abilities. This\
    \ will be a beautiful future.\n\n# Exploring New Opportunities and New Situations\
    \ in Artificial Intelligence\n\n## Guest Introductions\n\n**Pony Ma (Ma Huateng)**\
    \  \nChairman of the Board and Chief Executive Officer, Tencent\n\n**Martin Lau\
    \ (Ren Yuxin)**  \nChief Operating Officer, Tencent Group\n\n**Pony Ma**: Artificial\
    \ intelligence is a cross-border, cross-disciplinary scientific exploration project.\
    \ It is pushing human cognition toward \"Faster, Higher, Stronger\" and will inevitably\
    \ bring us an unprecedented technological and industrial revolution. Currently,\
    \ our unknowns about new technologies like AI are still greater than our knowns.\
    \ We research and apply new technologies every day, but ultimately, we must be\
    \ responsible for every single user. To achieve \"AI for Good,\" we must strive\
    \ to make AI \"Knowable, Controllable, Usable, and Reliable.\" This is a shared\
    \ challenge for the whole world, and it is the reason why Tencent has incorporated\
    \ \"Tech for Good\" into its corporate mission and vision.\n\nAs a frontier window\
    \ of China's reform and opening up, Shanghai provides us with a platform for cooperation\
    \ and exchange to solve world-class problems. In the future, Tencent's East China\
    \ Headquarters will further root itself in Shanghai and become one of the builders\
    \ of Shanghai's AI highland. We will accelerate investment in new infrastructure,\
    \ and together with Shanghai, nurture new opportunities in crisis and open new\
    \ situations in change, injecting new momentum into Shanghai and even the integrated\
    \ development of the Yangtze River Delta.\n\n**Martin Lau**: I will mainly share\
    \ our thoughts and explorations in the field of AI through three \"News\" (New).\n\
    \n### The First \"New\": New Growth\n\nThe normalization of the epidemic makes\
    \ resumption of work and production very challenging. To ensure the smooth flow\
    \ of \"logistics, capital flow, and information flow,\" AI has played a major\
    \ role. For example: Shanghai's Youtu AI Lab provided OCR (Optical Character Recognition)\
    \ technology to domestic and foreign companies, replacing manual entry of logistics\
    \ documents; Tencent's security team helped small and micro enterprises obtain\
    \ \"zero-contact\" online credit services; AI-based simultaneous interpretation\
    \ technology, if combined with online meeting systems and social tools, can enable\
    \ people to hold international conferences anytime, anywhere, unrestricted by\
    \ venue, traffic, or language.\n\nNew drug R&D often takes more than 10 years,\
    \ but AI may change this situation. For example, Tencent's AI drug discovery platform\
    \ \"Yunshen Zhiyao\" has been fully opened to researchers, and we hope to shorten\
    \ the time for new drug R&D with the help of machine learning.\n\n"
