    # AI Expert Dialogue Transcript


    ## Expert Profiles


    ### Qiang Yang

    Transfer learning scholar, proposed the basic theoretical framework and main algorithmic
    directions for transfer learning, ranked third in academic influence in the field
    of transfer learning (data according to Google Scholar); research results included
    in the classic data mining university textbook *Data Mining: Concepts and Techniques*;
    lead author of the Cambridge University AI Series *Transfer Learning* and lead
    author of the big data course textbook *Big Data Modeling Methods*. Designed the
    world''s earliest commercial AI system, Baidu''s "Fengchao" (Phoenix Nest), increasing
    Baidu''s monetization capability 8-fold in 4 years; former ACM-ICPC World Champion;
    first entrepreneur to win the First Class Prize of the "Wu Wenjun Artificial Intelligence
    Science and Technology Award" (China''s highest AI award); selected for *MIT Technology
    Review* "35 Innovators Under 35 (China)" and *Fortune* "40 Under 40 Business Elites
    in China".


    ### Toby Walsh

    Professor of Artificial Intelligence, University of New South Wales, Sydney


    ![](img/txt015_3.jpg "pagenumber_ebook=114,pagenumber_book=98")


    Professor of Artificial Intelligence at the University of New South Wales, also
    a Fellow of the Australian Academy of Science. Dubbed a "rock star" of Australia''s
    digital revolution by *The Australian Newspaper*. Strongly advocates for restrictions
    on the application areas of AI to ensure it is used appropriately to improve human
    lives. Has played a leading role in discussions on killer robots, speaking on
    the topic at UN meetings in New York and Geneva. Frequently appears on TV and
    radio. Authored two popular science books on AI, the latest being *2062: The World
    That AI Made*, available in Chinese, English, German, Japanese, Korean, Polish,
    Russian, and Vietnamese.


    ### Tong Zhang

    Professor, Department of Mathematics and Department of Computer Science, Hong
    Kong University of Science and Technology; Fellow of IEEE, American Statistical
    Association, and Institute of Mathematical Statistics


    ![](img/txt015_4.jpg "pagenumber_ebook=115,pagenumber_book=99")


    Professor at the Department of Mathematics and Department of Computer Science,
    HKUST; Fellow of IEEE, ASA, and IMS. Main research areas include machine learning,
    big data, and their applications. Served as General Chair or Area Chair for top
    international machine learning conferences NIPS, ICML, COLT, and as Editor for
    top AI journals PAMI, JMLR, and Machine Learning Journal. Former Research Staff
    Member at IBM Research, Principal Scientist at Yahoo Research, Vice President
    of Baidu Research and Head of Big Data Lab, Head of Tencent AI Lab.


    ### Yike Guo

    Vice-President (Research and Development), Hong Kong Baptist University


    ![](img/txt015_5.jpg "pagenumber_ebook=116,pagenumber_book=100")


    Fellow of the Royal Academy of Engineering (UK), Fellow of the Academia Europaea,
    Fellow of the British Computer Society. Appointed Vice-President (Research and
    Development) of Hong Kong Baptist University on January 1, 2020. Became Professor
    of Computing at Imperial College London in 2002 and Director of the Data Science
    Institute at Imperial College from 2014. Received First Class Honors in Computational
    Science from Tsinghua University in 1985 and PhD in Computer Science from Imperial
    College in 1993. Founded Imperial College spin-out InforSense Limited in 1999,
    a data analytics platform company specializing in big data analytics for life
    sciences and medicine. Main research interests lie in machine learning and large-scale
    data management, contributing to many major research projects. Currently an investigator
    on several major UK and European data science projects. Won "Most Innovative Award"
    at the 2002 International Supercomputing Conference; "Best Practice Award" at
    the 2014 Bio-IT World Conference; "Best Open Source Software Award" from ACM SIGMM
    in 2017.


    ### Hideyuki Nakashima

    President, Sapporo City University


    ![](img/txt015_6.jpg "pagenumber_ebook=117,pagenumber_book=101")


    Received PhD in Information Engineering from the University of Tokyo in 1983 and
    joined the Electrotechnical Laboratory (ETL). Served as Director of the Network-Assisted
    Research Center at the National Institute of Advanced Industrial Science and Technology
    (AIST) from 2001–2004. President of the Public University of Hakodate Future (currently
    Honorary President) from 2004–2016. Appointed as Project Professor in the field
    of advanced AI education at the University of Tokyo from 2016–2018. Assumed position
    as President of Sapporo City University starting 2018.


    ![](img/txt015_7.jpg "pagenumber_ebook=118,pagenumber_book=102")


    ## Current Breakthroughs in AI


    **Qiang Yang**: Today we have three topics. First, let''s discuss where the current
    breakthroughs in AI lie; second, we''ll look at the challenges and limitations
    facing AI; finally, we''ll look further into the future to discuss what great
    achievements AI might accomplish.


    **Wenyuan Dai**: In my view, the biggest breakthrough in AI is deep learning.
    10 years ago, we tried to implement AI technology, first applying it to the internet
    sector. We started with internet advertising and search engines, seeing that AI
    could effectively help search engines deliver targeted ads, improving ad effectiveness
    by 800%. 7 years ago, we tried to apply AI to other industries, such as better
    marketing, fraud detection, and anti-money laundering in finance. 5 years ago,
    we began seeing AI utilized in retail and energy. Currently, we can see AI applications
    everywhere; many industries have deployed AI applications. These AI applications
    are emerging daily; perhaps next year we will see 10x or even more applications.
    This is an exciting moment; we are full of confidence and delighted to see more
    AI technologies applied to more industries.


    **Toby Walsh**: AI is a very useful complement to human intelligence, helping
    humans in many fields, but it is also very different from human intelligence.
    For example, as we just saw, adding a little noise caused a cat to be recognized
    as a bus; humans would never make such a mistake. So we humans should be very
    proud because our recognition method differs from machines and is comparatively
    more advanced. Another limitation of AI is the machine''s limited perception.
    In the future, we should enable machines to better understand the world—understand
    speech, text, and images. Additionally, human subconscious knowledge cannot be
    acquired by machines; this is a key focus of current research.


    **Tong Zhang**: I think AI and machine learning perform well in leveraging big
    data to complete simple tasks in simple environments. Take gaming: if you focus
    on a specific game and collect massive data from it, AI performs excellently.
    In such clearly structured environments, AI has strong learning capabilities and
    has achieved huge breakthroughs, especially recently in reinforcement learning.
    AI can play games, compete in matches, and even outperform humans. In other similar
    environments with high determinism, AI performs well too, such as speech recognition
    in quiet environments. If there is a concrete, fixed environment and a specific
    task, training a model using recently developed deep learning techniques works
    very well.


    Over the past few years, AI has started learning knowledge from vast amounts of
    unlabeled data. For instance, in natural language, representative work includes
    `GPT` (Generative Pre-training Transformer). It can learn from massive unlabeled
    data and apply to many other tasks, potentially even superhuman intelligence in
    the future, integrating with previous analysis of labeled data. There have also
    been major breakthroughs in computer vision; we can see AI learning feature representations
    from vast unlabeled data. Because of its broad applicability, you don''t need
    to label all data before using it for AI training. These are very promising recent
    areas and will definitely be development focuses in the coming years.


    There has also been significant progress in theory, such as better understanding
    of neural network operation modes. Many recent theoretical advances in neural
    networks help us understand how to train them to solve complex problems.


    From an industry application perspective, AutoML (Automated Machine Learning)
    is very promising. Combining hardware, model architecture search, hyperparameter
    tuning, plus feature engineering on raw or general data to form a black-box automated
    ML model yields better results. It makes ML easier to deploy to solve different
    problems. Just by adjusting parameters on the black box, the barrier to using
    these tools is lowered, and they can be applied to different hardware devices.
    High-compute hardware like cloud or edge computing can use auto-optimized large
    models; low-compute devices like phones and IoT can use small models. This is
    a very promising future technical field, making AI more general and easier to
    deploy.


    **Yike Guo**: Precisely speaking, current AI development focuses on cognition,
    such as pattern recognition and image recognition. Over the past 10 years, we
    have seen huge progress in two areas: first, automatic feature extraction—this
    is the breakthrough of Convolutional Neural Networks (CNNs), which can automatically
    identify object features. Based on this, we have built many new models enabling
    automatic recognition of graphics, text, etc. Another area with huge progress
    is representation learning, which learns effective representations of recognition
    objects. Reinforcement learning is also a rapidly developing field; combined with
    recognition capabilities, we can create great AI applications like AlphaGo and
    other board games where AI defeats humans.


    We are in a data-driven AI era; everyone thinks more data is better, hoping to
    identify features through data and use neural networks to help humans reason and
    make decisions. These cognition-based AIs can reach a certain level of intelligence,
    making decisions based on certain models. But human decision-making is not purely
    data-driven; nor is AI. Human wisdom is not just recognition—children acquire
    this early—adult wisdom lies mainly in reasoning, combining known knowledge to
    infer. Much current AI progress is in this area, a very positive trend: combining
    existing learning models with reasoning.


    **Hideyuki Nakashima**: I feel the current situation is that deep learning development
    has brought great progress to AI. But machine learning itself still has many limitations;
    first and foremost, it must have data—only with data can information be acquired
    and analyzed. In this regard, we need to combine AI with existing domain knowledge
    and experience from foundational fields.


    ## Limitations and Challenges of AI


    **Qiang Yang**: Next, let''s discuss some shortcomings of AI; perhaps these can
    drive AI development for the next 10 years. From my experience, AI falls short
    in learning from existing experience and then adapting to changing environments—we
    call this "transfer learning" in the field. We have long hoped to achieve machine
    generalization or adaptability for reasoning, both theoretically and practically.
    Humans do this, but machines still need to work hard on it. Additionally, regarding
    privacy, when we take data from others, there is a risk of privacy leakage; others
    may not want to share data with us. This is also a current challenge: AI cannot
    integrate and acquire true big data.


    **Wenyuan Dai**: Transfer learning is indeed a major challenge for AI. We see
    more AI applications now, but in complex environments, transfer learning becomes
    even more critical. Let me give an example: yesterday I visited a catering giant
    wanting to move offline business online, changing their business model. Previously,
    most stores were offline; post-pandemic, only 5% of revenue is offline, 95% online
    via digital channels. Before, waiters gave coupons to diners and made personalized
    upsell recommendations manually. They found moving recommendation services online
    very hard. First, it requires many data scientists, but with the AI talent shortage,
    enterprises are helpless. So we need ordinary developers to build AI apps to solve
    the data scientist shortage. This is why 4th Paradigm invested heavily in `AutoML`
    (Automated Machine Learning) research 5 years ago—it allows ordinary developers,
    e.g., `Java` developers and `Python` engineers, to build AI apps.


    Second challenge: even with enough scientists, even if ordinary developers can
    build AI, enterprises lack usable data. We must use transfer learning to move
    knowledge from one domain to another to solve data scarcity in certain domains.
    4th Paradigm has accumulated many excellent algorithms in transfer learning, and
    we insist the system itself must solve privacy issues. In recent years, we''ve
    made significant breakthroughs in privacy-preserving transfer learning, enabling
    knowledge transfer between domains without privacy exposure.


    Third challenge is cost. Top internet companies spend tens of millions annually
    on search engines; few companies can afford such investment. So we must consider
    AI costs. The AI system is not just hardware; there''s software too. Software
    design must be hardware-based, hardware design must adapt to software—it''s a
    software-hardware co-optimization, fusion system. 4th Paradigm is designing software
    and hardware via fusion; our "Software-Defined Compute" technology increased data
    center TCO (Total Cost of Ownership) performance by 10x.


    **Hideyuki Nakashima**: I think we may have a consensus: we need to enhance the
    capability level of deep learning. Our technology still needs improvement and
    refinement; we need to apply these technologies to higher-level tasks.


    **Toby Walsh**: Let me quickly mention a few challenges. First is language. Language
    is a foundational engine; enabling machines to truly understand language is crucial.
    Currently, machines don''t understand human language at the semantic level; they
    may only understand it superficially. I see language as the embodiment of machine
    intelligence. Second is common sense. A famous example: you can run into a city,
    find a school, ask students history questions, they answer clearly; but AI might
    confuse things because it lacks basic common sense. Third is emotion. Machines
    have no feelings, cannot empathize, or form relevant interactions with humans—a
    major challenge.


    **Tong Zhang**: I strongly agree that current AI cannot do natural language and
    semantic understanding. As said before, AI can do well on specific tasks, relying
    on big data for text comparison in specific environments. But for general or broader
    tasks, current AI fails. Our real goal is general tasks, not single specific tasks
    in fixed environments. For example, we want to inject common sense into AI to
    strengthen its thinking and logical reasoning, but this is extremely hard. Current
    AI systems rely on data comparison for probabilistic guesses, not human common
    sense. Even for single tasks, with different application environments and data
    characteristics, AI may fail to complete a task across environments with a unified
    model. This is what we must solve now: giving AI stronger adaptability to different
    contexts.


    For us, enabling AI to solve common sense and general tasks poses huge challenges.
    In the next 10 years, AI''s adaptability to different scenarios when doing single
    tasks is also very important and urgently needed. E.g., some image recognition
    systems work well indoors but need series of adjustments for outdoor use. Same
    for autonomous driving: real applications encounter situations never seen in training;
    improving robustness to these is a critical challenge. Addressing adaptability
    of specific tasks across multiple scenarios is the current pressing work. If we
    achieve this, AI application in many industries becomes very simple. Originally
    each specific AI system applied to one industry; future systems can adapt to different
    scenes, environments, industries—wider use, higher safety. Regarding moving from
    big data to small data, this involves transfer learning capability. As mentioned,
    we need AI to adapt to different scenarios—a key challenge for transfer learning.
    Also, privacy: how to use AI across institutions, deploy on different devices,
    collaborate? This is also crucial.


    **Yike Guo**: Fundamentally, AI faces a basic challenge: how to recognize knowledge
    and data, and enable interaction between data and knowledge. Acquiring data and
    knowledge through observation often involves applying knowledge. E.g., transfer
    learning: after learning knowledge, one must generalize. Small data learning:
    you must fuse data and knowledge. Knowledge grows through learning, but you must
    organize this knowledge, combine data and knowledge—this is vital. Bayesian theory
    in statistics emphasizes using prior experience as a learning base; knowledge-data
    fusion also involves control theory, automation theory, etc.


    Fundamentally, the biggest future challenge is the fusion of knowledge and data.
    I believe we should adhere to this philosophy: whether computer theory or statistical
    theory, we should never be biased; we must pursue both simultaneously, focusing
    on knowledge-data fusion to build better models and logic. On this basis, we can
    better reduce different data, understand data better, and make data more effective.
    This is crucial and our constant goal.


    **Hideyuki Nakashima**: So far, data application scenarios are still limited.
    I feel the future should apply data in a more intelligent way, with better communication
    and interaction between humans and AI. We should better endow AI with value systems
    and values. Values are indeed important, but AI cannot understand them. We must
    train AI to have such values or "common sense views". I don''t know if other technologies
    can help, but I think values are critical.


    **Toby Walsh**: We sometimes let machines take over parts of work, but if machines
    do everything, will we become lazier? Useless? Our challenge is to ensure machines
    don''t completely replace humans, don''t take over all human tasks; we must remain
    in control.


    ## Future Outlook for AI


    **Yike Guo**: I believe in the next 10 or 15 years, AI will make great strides.
    One key area is healthcare. Future healthcare will become largely data-driven;
    many super-devices will emerge for medical practices, and personalization will
    trend. This will drive much AI research: interoperability, verifiability, small
    data challenges, privacy—all worth attention.


    **Wenyuan Dai**: I believe it will be 5G and IoT. Current AI learns from humans—many
    people label data, data comes from human clicks. From clicking webpages to labeling,
    humans teach AI everything. But with 5G and IoT, we can let AI learn on its own.
    There are only billions of humans, but IoT has trillions of devices, growing exponentially.
    So 5G plus IoT development will bring a huge leap for AI—more objectives, more
    data, more scenarios to learn from. That''s why I believe 5G and IoT will accelerate
    AI development.


    **Tong Zhang**: Trends for the coming decades: AI can evolve from a specialist
    to a generalist. With algorithmic advances, AI can learn more robustly, handle
    broader scenarios and environments better. The most urgent problem now, in my
    view, is making the whole system more robust and safer to use. Simultaneously,
    we will incorporate knowledge into AI, hoping to add reasoning capabilities. I
    think this may be hard to achieve recently because we don''t know how. Another
    trend: with IoT and 5G, we will have countless AI devices everywhere. They can
    communicate, learn from each other, grow autonomously—cooperatively—continuously
    improving. Current federated learning has many limitations; future independent
    AI individuals learning from each other, self-learning, becoming continuously
    growing machines, will greatly enhance federated learning''s capability and scope.
    In coming decades, AI evolving via this new decentralized learning—how powerful
    it becomes—is worth anticipating.


    **Qiang Yang**: Due to 5G and IoT development, we will see more entities communicating,
    coordinating. Under constraints like privacy (commercial interests preventing
    data sharing), if they are to learn remotely, they must collaborate better while
    respecting privacy and other considerations. This is a brand new market created
    by AI, coexisting with humans; we call it Federated Learning, which is what we
    are doing now.


    ---


    # The New Wave of AI


    ## Lei Ding

    CEO of NetEase, Representative Figure of China''s Digital Economy


