    Chairman and Chief Executive Officer, Zhixing (AutoX)


    ![](img/txt016_3.jpg "pagenumber_ebook=131,pagenumber_book=115")


    Chairman and CEO of Zhixing (AutoX), Chief Expert at China Telecom Research Institute
    (AI direction), Chief Technical Advisor at FAW Group (Intelligent Connected Vehicles
    direction), Adjunct Professor at Nanjing University of Aeronautics and Astronautics.
    In June 2017, selected as one of *Forbes* "20 Leaders Driving China''s AI Revolution"
