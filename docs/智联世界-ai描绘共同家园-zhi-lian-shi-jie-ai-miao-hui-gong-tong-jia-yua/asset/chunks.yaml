    ![](img/txt016_7.jpg "pagenumber_ebook=135,pagenumber_book=119")


    ## Finding the Best Application Scenarios for AI


    Before the COVID-19 pandemic, AI had already seen several important trend-setting
    and directional changes. First, AI began to enter and reshape various industries,
    moving beyond single technological breakthroughs. Second, the importance of data,
    as a crucial foundation for AI development, continued to rise; focus areas included
    lowering the threshold for data usage, breaking data monopolies, as well as data
    privacy and AI ethics. Third, the advent of 5G created a brand-new foundation
    for AI development and changed the market structure to a certain extent. Just
    as all this was arriving, the outbreak of the COVID-19 pandemic in 2020 also had
    a significant impact on AI development, endowing it with new meaning. We are witnessing
    a new wave of AI development.


    ### Ding Lei: AI is not a technology problem, but an application scenario problem


    AI is not a technology problem, but an application scenario problem. If the right
    application scenario is chosen, the role played by AI will be enormous.


    What ordinary people care about is not complex algorithms, but whether AI improves
    people''s livelihood. Can traffic lights be made intelligent to improve efficiency?
    Can the public health system have a good early warning mechanism to prevent large-scale
    epidemic spread? Can AI help solve the problem of unequal educational resources?
    These are all issues related to the vital interests of ordinary people. Therefore,
    the most important thing for AI is to solve these problems, making travel convenient
    for city dwellers, reducing hospital queues, and allowing rural residents to enjoy
    high-quality educational services equally. This is people''s livelihood.


    For example, in education, an app launched by NetEase can help teachers correct
    student essays, including Chinese and English compositions, quickly helping students
    correct grammar and wording errors. Of course, NetEase is also involved in other
    fields of AI application. For instance, in music, NetEase has developed an AI
    arrangement and lyric writing system and invested in the European AI composition
    company AIVA. In the future, NetEase hopes that AI applications developed in the
    gaming field can compete online with real players, improving player skills.


    ### Xu Li: AI applications are extending from head problems to long-tail problems


    AI applications are extending from head problems to long-tail problems, thereby
    forming a closed loop of value.


    In the past, AI often focused only on head problems—those with wide audiences,
    high frequency of occurrence, and broad public concern. Facial recognition is
    a typical example. When we want AI to truly transform an entire industry, we find
    that we need to solve many problems that do not occur very frequently but cannot
    be ignored. Related applications are what we call "long-tail applications." The
    widespread emergence of these applications truly signifies that AI is penetrating
    deep into various industries and beginning to generate a closed loop of value.
    Take Shanghai''s "One-Network Management" as an example; many subdivided fields
    have integrated AI technology, such as governing illegal parking and littering.
    These applications may not attract as much attention as facial recognition, but
    they equally bring a qualitative improvement to the refined management of cities.


    The COVID-19 pandemic has brought another impact: accelerating the popularization
    of AI in various industries. In the past, although some traditional enterprises
    constantly talked about AI transformation and upgrading, progress was not fast
    due to cost and other reasons. During the pandemic, many enterprises shifted their
    business focus online, thereby promoting the process of business datafication,
    while datafication is the foundation of AI application. The result is that we
    have seen a large increase in the number of enterprises using comprehensive data
    to assist decision-making, overall driving the intelligent transformation of enterprises.


    ### Wang Jie: In autonomous driving, China is gradually moving towards Vehicle-Road
    Coordination (V2X)


    In autonomous driving, China is gradually moving towards Vehicle-Road Coordination
    (V2X).


    Following the current development path, China may still need two to three years
    to achieve `L4-level` autonomous driving in some areas, while achieving `L5-level`
    autonomous driving may take even longer. Now, through the combination of `5G`
    and `AI`, China has the opportunity to realize a new generation of intelligent
    transportation through "Vehicle-Road Coordination."


    In the past, autonomous driving relied on on-board sensors and on-board computers,
    belonging to single-vehicle intelligence. In contrast, Vehicle-Road Coordination
    has three benefits. First, it is safer. Roadside sensors assist on-board sensors
    in achieving over-the-horizon perception, and roadside computing units can enhance
    computing power, thereby significantly improving the safety of autonomous driving.
    Second, the cost is lower. China has 300 million vehicles. If each vehicle can
    save costs through road network coordination (relative to pure single-vehicle
    intelligence), saving 1.5 trillion RMB in total, this money can deploy sensors
    and roadside units on existing roads at an investment of "1 million RMB/km," sufficient
    to realize China''s Vehicle-Road Coordination. Third, efficiency is higher. Single-vehicle
    intelligence is individual optimization and local optimization of a single vehicle,
    while Vehicle-Road Coordination is global optimization, thus achieving higher
    efficiency.


    China has gradually embarked on the path of Vehicle-Road Coordination. Unlike
    single-vehicle intelligence, which may be mainly driven by technological breakthroughs,
    government policy plays a more obvious role in Vehicle-Road Coordination. Deploying
    so many sensors and computing units on roads and forming a network would be impossible
    without government support, permission, and assistance.


    To achieve Vehicle-Road Coordination, more relevant parties need to participate.
    AI enterprises are an important party; because vehicles are involved, the automotive
    industry will also participate; of course, the travel industry is included as
    well. In addition to the above parties, `5G` operators also need to participate
    deeply. How these four industries integrate into a new intelligent transportation
    industry requires government coordination to break not only technical and industrial
    barriers but also policy barriers.


    ### Huang Xiaoqing: We are entering the third era of user interface, with robots
    as the carrier


    We are entering the third era of user interface, with robots as the carrier.


    Jobs utilized the mouse to create the window interface, opening the first era
    of user interface. The second era was also opened by Jobs, represented by multi-touch
    in the mobile phone field. Based on multimodal AI, through vision, natural language,
    and body movements, humans and machines can form a new user interface—this is
    the third era of user interface. In the first era, the interface carrier was the
    PC; in the second era, the mobile phone; what is the third era? Definitely not
    the mobile phone, but should be the robot.


    In this era, AI becomes a super-system platform, and the robot is the new generation
    of PC or mobile phone. Robots may not be particularly smart at first, but can
    already effectively perform some repetitive, narrow-skill tasks, such as sweeping,
    standing guard, and reception—precisely the things humans least want to do. As
    the super-system level gets higher and higher, in the future we will make more
    advanced products like family nanny robots, though it still needs some time.


    ### Zhu Xiaohu: COVID-19 pandemic drives AI development


    The COVID-19 pandemic drives AI development.


    The SARS outbreak in 2002 greatly accelerated the development of e-commerce in
    China. JD.com and Tmall basically developed rapidly after SARS. The COVID-19 pandemic
    will have a similar impact on AI. China''s manufacturing industry will see an
    overall trend towards unmanned and intelligent operations. In addition, remote
    work will become prevalent. Many companies found that after the pandemic, at least
    10%–20% of employees applied to continue working remotely. They found that working
    from home was highly efficient, quality of life improved, and some employees no
    longer needed to return to first-tier cities. The proportion of remote work will
    become higher and higher in the future.


    Any industry developing well will have bubbles, and AI is no exception. A certain
    amount of bubble is healthy; it promotes better development of the entire industry.
    Initially, many people flooded into the AI industry; now everyone has become more
    pragmatic, analyzing which scenarios can be better implemented, better commercialized,
    and create more value for enterprises and users. This indicates that the industry''s
    development has finally entered the right track. In 5 years, all internet companies
    and tech companies will be AI-empowered, with at least AI modules.


    ### Ji Xinhua: Considering AI business from scenarios, data, algorithms, and computing
    power


    Considering AI business from scenarios, data, algorithms, and computing power.


    AI has 4 key elements: scenarios, data, algorithms, and computing power. UCloud
    initially provided computing power, later found data very important, and launched
    a product called "Security Room" (Data Clean Room), realizing the separation of
    data usage rights and ownership, making data usable but not obtainable. Shanghai
    is the first city in the country to realize the opening of government data. Many
    AI companies can train models through the Security Room but cannot take away the
    data, thereby ensuring user privacy. After this pandemic occurred, we found that
    AI has broad application space in medicine, such as judging who is prone to insomnia
    and how to treat insomnia by analyzing brainwaves, etc. We are trying in multiple
    scenarios.


    ## Data Sharing and Data Privacy Protection


    ### Xu Li: From the perspective of data intelligence, the problem of data silos
    needs to be solved


    From the perspective of data intelligence, the problem of data silos needs to
    be solved. No single AI enterprise can access all the data it needs. Solving this
    problem requires clarifying data assets and conducting data sharing. For example,
    using federated learning (multi-party training) allows organizations to collaborate
    and jointly improve algorithm accuracy without sharing data. The formulation of
    relevant standards is a problem to be solved at present.


    ### Wang Jie: In V2X autonomous driving, the principle of government data ownership
    must be upheld


    In V2X autonomous driving, the principle of government data ownership must be
    upheld. Autonomous driving companies can assist in data collection but cannot
    become data owners, thereby protecting data privacy and national security. Later,
    there may also be the issue of how to conduct cross-border cooperation, which
    requires more discussion.


    ## Characteristics and Advantages of Shanghai''s AI Development


    ### Xu Li: The biggest problem for technology implementation is still cognition


    To truly implement technology, the biggest problem is still cognition. For example,
    alternating current (AC) only became widespread ten or twenty years after its
    invention, not because of a problem with AC itself, but because of a deviation
    in public perception. AI now faces the same challenge. For instance, can the general
    public accept a state where there is no driver in the car? Do enterprises understand
    the role of AI? The biggest reason many traditional enterprises have not undergone
    AI upgrades is that they do not understand what AI can do. Only by letting the
    audience better understand the boundaries and limitations of current AI applications
    can applications truly be implemented. In this regard, Shanghai has its own advantages;
    AI concepts have already been well popularized in Shanghai, and this popularization
    has laid a good foundation for the practical logic of various applications.


    ## Suggestions for Shanghai''s AI Development


    ### Ding Lei: I hope the government can make up its mind to focus on tackling
    some projects related to people''s livelihood


    I hope the government can make up its mind to focus on tackling some projects
    related to people''s livelihood. I hope Shanghai can not only be a shining pearl
    in the East but also become a city leading the world in AI, a smart city.


    ### Zhu Xiaohu: Talent is the biggest bottleneck for AI development


    Talent is the biggest bottleneck for AI development. Building Shanghai into a
    high ground for AI talent is the most important first step for Shanghai''s AI
    development. In terms of attracting existing talent, the supply of talent apartments
    can be increased. In terms of cultivating future talent, universities can further
    tilt enrollment towards the AI and computer industries.


    ### Huang Xiaoqing: Shanghai should pre-position layout in the future intelligent
    service robot field


    Shanghai should pre-position layout in the future intelligent service robot field,
    attract the entire industrial chain to settle in Shanghai, with the goal of building
    the world''s largest robot service and manufacturing system in Shanghai and surrounding
    areas. Shanghai should build itself into a city where both outstanding talents
    and outstanding enterprises are willing to come. Whether Chinese or foreigners,
    they can establish companies in Shanghai and list on the STAR Market. Shanghai
    can also introduce on a large scale manufacturers in some core key technology
    fields; they may not be leading enterprises in the traditional sense, but young
    enterprises with very advanced technology.


    ![](img/txt016_8.jpg "pagenumber_ebook=142,pagenumber_book=126")


    The growth of an industry is closely related to scale. Through AI, mobile communications,
    and robotics technology, cloud robots have formed a product-level service. At
    this time, the government needs to help promote the large-scale development of
    the entire industry. The government can adopt methods such as subsidies or support
    for users, just like promoting the development of electric vehicles. Replacing
    labor is a very important business model for the future robot industry. Robots
    will be rented to clients more often than sold, just like current enterprise employment.
    This business model requires financial support.


    ### Ji Xinhua: Large companies now cause data monopoly


    Large companies now cause data monopoly. Many startups want data but cannot get
    it. I suggest Shanghai can use "data investment promotion" (attracting investment
    with data), open data to AI enterprises, attract AI enterprises to settle in Shanghai,
    and then create the best "heroes" on this Shanghai platform. Shanghai''s medical
    data is currently relatively unified and has been well aggregated. The biggest
    problem is how to use these data. Shanghai has taken the lead in opening government
    data. The next step: can it open other data that industries especially need, such
    as medical imaging data, operator data, etc.? This is critical for industry development.


    ### Wang Jie: Shanghai has great opportunities in the intelligent transportation
    field


    Shanghai has great opportunities in the intelligent transportation field. Looking
    forward to Shanghai being able to open a transportation special zone as soon as
    possible, so that V2X autonomous driving can be implemented in Shanghai quickly.
    In the beginning, pilots can be conducted in suburbs or urban-rural fringes.


    ### Xu Li: AI faces "uncharted territory" when entering many industries


    When AI enters many industries, it faces "uncharted territory" (areas without
    regulations), lacking relevant norms. Shanghai needs to set up pilot demonstration
    zones for "first trials," allowing industries to develop first in the absence
    of relevant norms.


    ## Trends


    ### AI New Starting Point: New Infrastructure Accelerates the Arrival of Intelligent
    Economy and Intelligent Society


    #### Li Yanhong (Robin Li)

    Founder, Chairman and Chief Executive Officer, Baidu


    ![](img/txt018_1.jpg "pagenumber_ebook=146,pagenumber_book=130")


    Founder, Chairman and CEO of Baidu, fully responsible for Baidu''s strategic planning
    and operation management. Graduated from the Information Management major at Peking
    University, later obtained a Master''s degree in Computer Science from the University
    at Buffalo, State University of New York. His patented "Hyperlink Analysis" technology
    is one of the foundational inventions that established the development trend and
    direction of the entire modern search engine. Over 18 years, he led Baidu to become
    the world''s largest Chinese search engine and successfully listed on NASDAQ in
    the US in 2005. Since 2010, he has continuously promoted the innovative R&D, practical
    application, and legislative process of cutting-edge technologies such as AI and
    autonomous driving in China, driving the tech industry to face the future and
    make continuous progress. Currently serves as a member of the National Committee
    of the Chinese People''s Political Consultative Conference (CPPCC), Vice Chairman
    of the China Chamber of Commerce, and other positions. On January 19, 2018, *Time*
    Magazine published a cover story interview with him, defining him as "the innovator."
    He is the first Chinese internet entrepreneur to appear on the cover of *Time*
    Magazine.


    ![](img/txt018_2.jpg "pagenumber_ebook=147,pagenumber_book=131")


    Shanghai has taken the development of AI as a priority strategic choice and is
    accelerating the construction of an AI development highland with global influence.
    Such ambition and pattern are highly commendable. Although the tech industry has
    been full of ups and downs over the past few decades, with prosperity and depression,
    peaks and valleys, as a tech practitioner, what I have witnessed overall is the
    driving role of technology on the development of human society.


    Since this year, the novel coronavirus has raged globally, the economy has stagnated,
    and the unemployment rate has risen sharply. As entrepreneurs, we cannot help
    but reflect on whether technological innovation can allow humans to better control
    their own destiny at critical moments. I think the theme of this year''s World
    Artificial Intelligence Conference, "Intelligent Connectivity, Indivisible Community,"
    is the answer to this question.


    The reality is that we were unable to dispatch a large number of autonomous vehicles
    to solve people''s daily life problems when Wuhan was locked down; we were unable
    to quickly develop a COVID-19 vaccine through bio-computing; we also did not reserve
    enough basic technologies and applications to cope with the risk of anti-globalization
    for a considerable period in the future. So I see many people have developed pessimistic
    sentiments towards technology, especially AI technology.


    However, as an insider, I know we are making progress. Baidu''s invented `LinearFold`
    algorithm can shorten the full-genome secondary structure prediction of the novel
    coronavirus from 55 minutes to 27 seconds, a 120x speedup. This allows us to predict
    virus mutation trends faster to formulate effective prevention and control measures,
    and can also improve the efficiency of vaccine development. The multi-person rapid
    temperature screening solution effectively reduces the risk of infection for staff
    in public places such as train stations and subways. The contactless delivery
    vehicles and unmanned disinfection operation vehicles supported by the Apollo
    autonomous driving system greatly reduce and avoid cross-infection.


    I believe that in the future, in public health monitoring, new drug R&D, and disease
    diagnosis, AI has great potential. AI can improve the sensitivity and accuracy
    of detection, shorten the cycle of new drug R&D, reduce the cost of new drug R&D,
    and improve the accuracy and efficiency of medical diagnosis. These will make
    humans more proactive when facing health problems.


    I also believe that the "New Infrastructure" advocated by the state is infrastructure
    construction with AI at its core. It will greatly improve efficiency in fields
    such as transportation and energy, driving economic growth. The construction of
    intelligent transportation infrastructure based on Vehicle-Road Coordination will
    be able to increase traffic efficiency by 15%–30%, which means contributing an
    absolute growth of 2.4%–4.8% to GDP.


    I believe even more that with the open source and opening up of AI technology
    platforms, more and more applications can be developed very conveniently, benefiting
    all aspects of the economy and society. The main operating system of the future
    will no longer be an OS based on PC or mobile phone, but an OS based on AI deep
    learning frameworks. Deep learning frameworks connect various intelligent applications
    upward and dominate the design of various AI chips downward.


    In my view, AI development will go through three major historical stages.


    The first stage is the **intellectualization of technology**. AI was proposed
    more than 60 years ago. In the past 10 years, it has experienced rapid iteration
    and innovation of algorithms. Empowered by cloud computing and big data, it has
    gradually developed into a new type of technology platform. However, the efforts
    of AI scientists were mainly focused on concept introduction, technology exploration,
    and partial application exploration such as human-machine gaming. AI had not evolved
    into an industrial phenomenon or economic phenomenon.


    The second stage is the **intellectualization of the economy**. With the development
    of mobile internet, the effective data volume generated by humans has risen exponentially.
    The development of cloud computing provides the computing power needed for massive
    calculations. Coupled with the basic environment created by the widespread digitalization
    and internetization of the economy and society, AI has finally been able to start
    exerting its magic in a wide range of economic fields.


    '
