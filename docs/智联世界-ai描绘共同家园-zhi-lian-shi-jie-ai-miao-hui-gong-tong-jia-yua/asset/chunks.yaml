    # Dialogue on the History of AI Development and Interdisciplinary Integration


    ## Zhang Chengqi: Three Waves and Three Schools of AI


    Looking back at the history of artificial intelligence, the earliest pursuit was
    General Intelligence, the GPS (General Problem Solver). They hoped to use computer
    capabilities to solve general problems, and the earliest achievement was in proving
    elementary mathematical formulas. However, bottlenecks were later encountered,
    leading to the "AI winter."


    The second wave of AI was primarily knowledge-based intelligence. At that time,
    people believed AI mainly imitated human high-level intelligence—so-called high-level
    intelligence being the difference between humans and animals. The biggest difference
    lies in cognition. Knowledge-based AI, represented by expert systems, did solve
    many high-level intelligence problems. But it also hit a bottleneck: perception
    was very poor, whether recognition, translation, or even speech. These intelligences
    are possessed not only by humans but also by animals. In fact, this intelligence
    is not just about imitating human intelligence but also animal intelligence.


    The recently popular third wave of AI is data-driven intelligence. Its greatest
    success is in perception, such as image recognition, natural language understanding,
    and translation. Therefore, current AI performs very well in applications. Autonomous
    driving is very hot now, but why was no one researching it a few years ago? Because
    if perception couldn''t be solved, there was no such thing as autonomous driving.


    Over 60 years of AI development, it has basically split into three schools:

    - **The Cognitive School (Symbolism)**, or the knowledge-based school. It primarily
    uses symbolic reasoning and is explainable.

    - **The Perceptive School (Connectionism)**, or the data-based school. This school
    is very successful now.

    - **The Behavioral School (Actionism)**, mainly focused on robotics. It relates
    to control feedback.


    Autonomous driving is a very typical case—a perfect integration from perception
    to cognition to behavior. This field combines computer science, mathematics, and
    also uses reasoning and control knowledge.


    **Perception**: Autonomous vehicles must quickly and accurately identify the surrounding
    environment; otherwise, autonomous driving is impossible.


    **Cognition**: Requires understanding maps, planning paths, reacting to the environment,
    and making action decisions—all determined by the cognitive part.


    **Behavior**: The execution of decisions—physical control of the vehicle, speed,
    and direction.


    I think the autonomous driving platform very typically reflects the integration
    of AI with other fields to the fullest, and also combines the three schools of
    AI. Using this example to illustrate AI: the computer is its core. Without computers,
    there is no AI, because the computer is the most underlying, core, or "0 to 1"
    change for AI. Other disciplines are also important, possibly "1 to 100" or "1
    to 1000" changes. Of course, mathematics also plays a core role in AI development.


    ## Chen Jie: AI Empowering Industries and Integration Trends


    AI penetrates deeply into various industries, playing a significant empowering
    role. What is the current trend of integrated development between AI and other
    application fields? Can AI development reduce reliance on domain knowledge?


    ![Image](img/txt042_10.jpg "pagenumber_ebook=304,pagenumber_book=288")


    ## Mei Hong: Evolution from Expert Systems to Deep Learning


    Since the creation of computers, starting from Turing''s universal computing model,
    we have hoped to use computers to replace human mental labor. Looking at it now,
    does doing arithmetic count as intelligence? Or simple scientific computing? 100
    years ago, this was absolutely high intelligence, because many people had not
    received such education and did not possess such capabilities. But after computers
    solved general arithmetic and scientific computing problems, basic computing power
    was no longer the intelligence we pursued. With the continuous progress and development
    of society, people now have new demands for computer intelligence capabilities.


    Expert systems were also a very successful example of knowledge engineering. Early
    on, they solved many practical problems. But why did they fail later? Because
    expert systems followed logical reasoning patterns, making it difficult to solve
    general problems. Especially common sense—problems ordinary children can handle
    were extremely difficult for expert systems.


    The current new wave of AI is primarily broken through in perception. Why deep
    neural networks? Deep neural networks themselves do not possess true recognition
    capabilities; they are data-based classifiers. Deep neural networks and deep learning
    have enabled major breakthroughs in perception. Perceptual intelligence is now
    widely applied in various industries. Virtually any real-world problem, as long
    as we can model it as a classification problem, can be solved with deep learning.
    Industry applications are mainly in this regard. In this sense, I believe current
    AI applications in various industries represent a new stage of deepening application
    of information technology or computing technology across industries.


    What is the meaning of AI integrating with industries? In the case of using expert
    systems, one first needed humans to formalize industry knowledge into rules, then
    use the system for calculation and judgment. Current AI is data-driven; it can
    directly self-classify, recognize, and learn some rules from data through classifiers.
    Current applications are at this stage. This is what we often call AI empowering
    various industries, enabling them to enter so-called "deep informatization."


    What is "deep informatization"?

    1.  **First, digitization** must be completed—digitizing all knowledge and processes
    of various industries.

    2.  **Then, networking**—connecting them via networks.

    3.  **The third level** is the so-called "intelligentization"—presenting intelligent
    applications.


    As of now, I believe AI *must* combine with other industries and knowledge. Of
    course, this integration of industry and knowledge may differ from the past; it
    can greatly reduce the degree of human intervention or human rule extraction,
    handing as much work as possible to machines. In this sense, current AI industry
    applications play an empowering and value-adding role. It is hard to say they
    form a so-called "interdisciplinary" field with any single industry. Because my
    understanding of the definition of interdisciplinary may be stricter. Currently,
    it is still computing technology, AI technology, or information technology being
    applied more deeply in a certain industry. This is the stage I understand for
    the current integration of AI technology and industries.


    ## Chen Jie: Intersection of AI and Humanities


    Now AI includes intersection with humanities. Its safety, ethics, and health may
    involve humanities, social sciences, psychology, philosophy, etc. From what angle
    can these issues be approached?


    ## Mei Hong: Technology for Good and Ethical Governance


    This is a very complex issue. I want to talk about two aspects.


    **First**, undoubtedly, AI-related technologies have an empowering effect on traditional
    humanities and are a very good assistant. How to use AI to assist traditional
    humanities research is a problem worth paying attention to. In addition, what
    we need to care about is not just research problems in humanities and social sciences,
    but more importantly, technology being people-centered, providing technological
    energy for human survival, development, and a better, happier life. This is the
    major significance technology brings to us in the humanities.


    **Second**, the so-called "bias" brought by big data and AI, and whether further
    AI development will infringe on human living space and working space—these ethical
    issues are of social concern, and we should attach great importance to them. A
    while ago, the China Computer Federation established a committee related to computing
    ethics, discussing inviting ethicists and computer scholars to cooperate. Our
    overall goal is "technology for people, technology for good," hoping technology
    makes life better, not bringing new troubles. Of course, technology development
    is always a double-edged sword; we must strive to let it develop in a beneficial
    direction. I think a lot of research probably shouldn''t be done. When a technology
    brings greater harm than good to humanity, we would rather not do it.


    ## He Jifeng: Algorithmic Fairness and Humanities Participation


    Ethics is one issue. The second is the fairness issue of current machine learning-based
    algorithms. We know data itself has bias. When using mathematical models derived
    from biased data to make decisions, unfair results may occur. Speaking of fairness,
    people discuss fairness under what meaning; there are many different descriptions.
    For example, three people watch a football match standing behind a fence. You
    give each a stool to stand on; we think this is fair because everyone gets the
    same treatment. But some are shorter, some taller. If you really want everyone
    to see the match, you might give the shorter spectator a higher stool. These are
    all issues to be discussed.


    In addition, the relationship between technology development, social development,
    and "tech for good" is also a concern for philosophers. Which jobs will be eliminated,
    what new jobs will emerge—everyone must prepare in advance. I believe this has
    a lot to do with humanities. Ancient Chinese philosophy discussed cognitive issues
    very early on, for thousands of years, leaving us good things, proving that ancients
    also encountered the impact of so-called scientific development on their lives.
    Therefore, my understanding is that humanities participation judges the direction
    of scientific development from another level.


    ![Image](img/txt042_11.jpg "pagenumber_ebook=308,pagenumber_book=292")


    ## Zhang Chengqi: Collaborative Scheduling and Safety Challenges in Autonomous
    Driving


    Take autonomous driving again. Many people care how autonomous driving drives
    a car safely, accurately, and efficiently. This is only one aspect. Another very
    important aspect is researching the collaborative scheduling of *many* cars. Like
    Didi''s current scheduling involves drivers. If all cars become autonomous, how
    to schedule? This scheduling needs to meet passengers'' privacy protection, comfort,
    speed, and economic needs. This requires a lot of economics knowledge to make
    people save money, be comfortable, and reach destinations quickly.


    But another aspect: many new technologies are double-edged swords. In autonomous
    driving, how to prevent hackers from hijacking your autonomous vehicle? If your
    car is hijacked, you can''t control it at all—the danger is huge. This is the
    double-edged sword of technology. We must prevent one more thing: whether hackers
    use autonomous driving technology to manufacture remote weapons. As researchers
    of autonomous driving, this must be considered, but it''s not just a technical
    issue; it involves legal issues. This double-edged sword needs to be put on the
    agenda—protecting privacy, ensuring safe driving, preventing hackers, and preventing
    autonomous driving technology from being used as remote weapons by some people.
    Legally, this requires global cooperation.


    ## Chen Jie: Innovation in AI Talent Cultivation Models


    AI is developing so fast. What ideas or thoughts are there for innovating talent
    cultivation models in the AI field?


    ## Zhang Chengqi: Faculty Alliances and AI Parks


    I''ll talk about two dimensions.


    **First, how to solve the faculty shortage?** Now all universities offer AI courses,
    including junior colleges and technical schools. Where to find so many faculty?
    This course isn''t something you can just learn by listening to lectures. For
    the faculty shortage, my idea is that due to the epidemic, online courses are
    popular, which instead gives us an opportunity: how to form cross-school alliances.
    Suppose three to five or more schools form an alliance, jointly design AI curricula,
    use faculty from each school, and combine online and offline teaching. This can
    solve the faculty problem for cultivating AI talents—a suggestion.


    **Second, AI courses need internships, not just lectures.** Learning math and
    computer science requires students to have strong hands-on and practical abilities.
    Everyone usually says "industry-university-research integration." I had an idea
    about 3 years ago that hasn''t been realized: to establish a data platform, a
    computing power platform, and an industry platform. So I''ve been thinking: can
    the Shanghai municipal government lead, together with enterprises and universities,
    to establish an **"AI Park"**? The so-called AI Park puts all current AI experimental
    products in the park, serving both as a demonstration and an internship platform.
    If we can cooperatively build an AI Park, treating all AI products as entertainment
    products while establishing a large experimental platform—whether data, computing
    power, or scenario platforms—allowing graduate students and researchers to intern
    here, while also letting enterprises showcase their products.


    ## Chen Jie: Inspiration for University Discipline Construction and Interdisciplinary
    Integration


    What inspiration does AI have for our university discipline construction, especially
    interdisciplinary integration?


    ## Mei Hong: Discipline Reconstruction in the Digital Age and Reflection on Talent
    Cultivation


    Undoubtedly, the interdisciplinary integration of AI with other disciplines is
    the general trend. AI-related technologies will have a very important impact on
    scientific research in other industries. Everyone knows data-intensive science
    or the "Fourth Paradigm," proposed in a specific era. It is a new scientific paradigm
    emerging with the development of information technology, beyond the existing experimental
    observation, theoretical deduction, and computational simulation. Therefore, for
    current university discipline construction, many traditional disciplines must
    strengthen the imparting of digital knowledge when cultivating talents, because
    we are entering a brand-new digital age. Digital survival is something everyone
    facing future society will encounter.


    Think about it: with technological progress, what methods will we use to solve
    problems in the future? In our early university days, we learned to use slide
    rules and lookup tables; much calculation was done manually. After computers appeared,
    many things didn''t need manual work. In the future, we will use data thinking
    and computational thinking to solve problems. Many problems are modeled first,
    then solved by computers. We think many disciplines, including traditional mechanics
    and other humanities, may use such methods.


    Another thing I want to mention is the AI talent shortage. Everyone talks about
    talent cultivation. I wonder: what talents are lacking exactly? Lack of researchers?
    I think there is a shortage, but not *that* severe. Because current AI technology
    is still a new development and continuation of traditional technical paths. Current
    AI research still has a large reserve of traditional talents. I think from a research
    level, it''s not that lacking. What''s lacking is frontier, high-end research
    talent. What''s *more* lacking is talent urgently needed by the industry.


    Looking back, how to cultivate talents urgently needed by the industry? What talents
    does it need? I personally hold reservations about so many prestigious universities
    in China offering narrow-sense AI majors. I think universities, especially top
    universities, should still focus on general education and innovative education,
    giving students potential for future development. I think top universities don''t
    need to, and shouldn''t, position themselves mainly to cultivate talents that
    existing enterprises can use immediately. Of course, China''s education system
    should separate a category of universities to specifically cultivate applied talents
    capable of data analysis, AI technology implementation, etc. This is a practical
    problem. We need a large number of applied talents, but these talents should not
    be cultivated as undergraduates by schools like SJTU, Fudan, Tongji, or ECNU.


    I think AI or information technology is a very important aspect for transforming
    all disciplines, especially engineering disciplines, towards lightweight directions
    in the future. That is, all future disciplines will involve close integration
    with information, not necessarily crossing with AI technology, but AI technology
    should play an important foundational knowledge role in computing, control-related
    basic teaching, and knowledge system construction of various disciplines. But
    do we *have* to develop all engineering disciplines in this direction? Must all
    universities'' talent cultivation be oriented towards the batch of hands-on engineers
    currently most urgently needed by enterprises? I think we need to put a big question
    mark on this. This is my reflection on AI discipline construction from outside
    the university.


    ## Chen Jie: Multi-party Collaborative Layout and Role Division


    Now there are many interdisciplinary integrations between AI and other majors.
    So, from the three levels of academia, industry, and government, how to layout
    the next step? How to carry out comprehensive cooperation? What responsibilities
    should each party bear and what roles should they play to promote the rapid development
    of AI?


    ## He Jifeng: Government Policy, Industry-University Integration, and Tiered Talent
    Cultivation


    The government should provide corresponding policies to encourage cooperation
    between enterprises, universities, and research institutes. The biggest problem
    now might still be how to stick the "two skins" of teaching/research and enterprises
    together. This problem has been discussed for a long time. I think there are a
    few approaches.


    **First**, during students'' academic phase, they should be allowed to participate
    in research projects as early as possible, slowly cultivating the ability to find,
    analyze, and solve problems. This is the foundation of innovation. If there is
    no ability to analyze problems, innovation is out of the question. This is the
    first point.


    **Second**, encourage some form of business communication between university teachers
    and enterprise technical personnel. Any AI application is impossible without domain
    knowledge. If we all want to do applications, but stay on opposite sides of a
    river—one side doing research, the other applications—hands can never be joined.
    So I think we should use this method to encourage teachers to go to enterprises,
    and enterprise engineers to come to schools. Such interaction should have relevant
    policies, but implementation is rare.


    **Third**, in cultivation direction, we must cultivate both talents with basic
    research ability and "master craftsmen" (skilled engineers). This is very different
    from the "master craftsmen" we talked about early on. For example, everyone is
    doing digitalization and digital twins now. If you can''t build models, how to
    do digital twins? You can''t just ask math and CS teachers to build models for
    you. Therefore, personnel communication is extremely important.


    ---


    ## Appendix: Review of the 2020 World Artificial Intelligence Conference (WAIC)
    Cloud Summit


    The 2020 World Artificial Intelligence Conference Cloud Summit was successfully
    held in Shanghai from July 9–11. The conference deeply implemented the spirit
    of General Secretary Xi Jinping''s important speeches and the Central Committee''s
    decisions and deployments, seized new opportunities in the development of the
    new generation of AI, took AI development as a new driving force for post-epidemic
    economic and social development, fully leveraged Shanghai''s advantages in AI
    technological innovation and application, meticulously prepared and powerfully
    organized, integrated online and offline, held "cloud" meetings and "digital"
    exhibitions, demonstrating to the world Shanghai''s significant achievements in
    coordinating epidemic prevention and control with economic and social development.
    It promoted AI empowering efficient urban operation, high-quality economic development,
    and high-quality people''s life, showing Shanghai''s confidence and determination
    to unswervingly build an AI highland, attracting widespread attention and extensive
    influence in domestic and international circles and the whole society.


    Li Qiang, Member of the Political Bureau of the CPC Central Committee and Secretary
    of the Shanghai Municipal Committee, delivered a speech at the opening ceremony,
    pointing out that for Shanghai to become a central node of the domestic grand
    cycle and a strategic link of the domestic-international dual cycle, AI is an
    important carrier. Shanghai will deeply implement the spirit of General Secretary
    Xi Jinping''s important instructions, strive to build an open platform for collaborative
    innovation, an empowering platform for industrial development, a smart platform
    for urban governance, and a service platform for a better life, and work with
    friends at home and abroad to jointly explore the bright prospects of AI development.
    Gong Zheng, Deputy Secretary of the Shanghai Municipal Committee and Mayor, presided
    over the opening ceremony, pointing out that Shanghai takes AI as a priority strategic
    choice and will accelerate the cultivation of more new models and new forms of
    intelligent economy, providing a Shanghai demonstration for cultivating and developing
    new driving forces. Xiao Yaqing, Minister of Industry and Information Technology;
    Li Yong, Director General of UNIDO; Houlin Zhao, Secretary-General of ITU, etc.,
    delivered video speeches. Representatives from relevant cities and institutions
    in Switzerland, South Korea, Finland, Germany, Singapore, UAE, etc., delivered
    video speeches. Relevant leaders of the Shanghai Municipal Committee, Municipal
    People''s Congress, Municipal Government, and Municipal CPPCC participated in
    multiple meetings and foreign affairs activities.


    Against the special background of the epidemic, this conference took "Intelligent
    Connectivity, Indivisible Community" as the theme, adopting the "Cloud Summit"
    model for the first time, achieving the goal of "hundreds of stations broadcasting
    simultaneously, thousands of networks releasing simultaneously, hundreds of millions
    of people watching simultaneously." Compared with domestic conferences of the
    same type and specification, it had a wider communication range, higher search
    heat, and more overseas activities, becoming the most influential professional,
    international high-end platform linking global AI development.


    ### I. Gathering a Strong Lineup of Guests, Pooling Wisdom from Academia and Industry


    The conference held a total of 1 opening ceremony, 2 plenary sessions, 11 thematic
    forums, 20+ industry forums, and 20+ special events, inviting 550+ speakers. Combined
    with the "cloud speech" format, this conference had more guests and higher levels.


    - **Academic Leaders Foreseeing Frontier Theories**: 7 Turing Award winners (5
    more than 2019), 1 Nobel Prize winner, 62 Chinese and foreign academicians, and
    200+ leading scholars attended, interpreting the latest academic achievements.
    27 world (regional) development reports and initiatives were released, including
    the Nature paper by Chinese AI young scientists and UNIDO''s first Industrial
    Intelligence Open Innovation Ecosystem Initiative.

    - **Industry Leaders Discussing Industry Trends**: 32 CEO-level speakers on the
    first day, double that of 2019. The "Three Mas" (Jack Ma, Pony Ma, Elon Musk)
    and "Two Hongs" (Robin Li, Zhang Wenhong) gathered, sparking heated industry discussions.
    Heads of domestic and foreign leading enterprises like BAT, Tesla, SAIC, China
    Mobile, Port of Hamburg, and high-growth innovative enterprises like Bilibili,
    UiPath, SenseTime, Yitu attended, discussing emerging industry development and
    traditional industry transformation in the era of economic intelligentization.


    ### II. Shaping an Excellent Cloud Participation Experience, Setting a New Benchmark
    for Innovative Conferences and Exhibitions


    Under the background of strong epidemic prevention, the conference spanned continents
    and gathered in the cloud, with many "firsts" shining brightly.


    1.  **Strengthening Application of Latest Intelligent Technologies**. Using AI
    technology to run an AI conference, launching the world''s first live holographic
    projection speech by a real person at a conference, and the first real-time 3D
    cloud guest experience. Adopting the latest network intelligent offense and defense
    technologies, successfully guaranteeing network security.

    2.  **Demonstrating Professional Institutional Conference Organization Capabilities**.
    Launched the first 3×24-hour cloud live studio, with 98 million views. Planned
    multiple "intercontinental connections," linking people from Asia, America, Europe,
    etc. Using Shanghai as a blueprint, built the first pure 3D virtual exhibition
    area "AI Home," conducting online cloud meetings, cloud business talks, and cloud
    exhibitions.

    3.  **Highlighting First Releases and Debuts Leading Industry Development**. Released
    world-class scenarios like Shanghai Metro (Shentong Metro), East China UAV Base,
    Zhangjiang Science City. A new batch of 11 application scenarios opened for global
    bidding. 16 latest AI chips debuted. Shanghai Top 100 AI enterprises showcased
    highlight products and solutions.

    4.  **Implementing Epidemic Prevention Requirements, Doing a Good Job in Guest
    Service Guarantee**. Formulated a COVID-19 prevention and control plan, prepared
    for various emergency epidemic situations. For important guests coming to Shanghai,
    formulated personalized reception plans, coordinated nucleic acid testing, epidemic
    prevention isolation, and other matters.


