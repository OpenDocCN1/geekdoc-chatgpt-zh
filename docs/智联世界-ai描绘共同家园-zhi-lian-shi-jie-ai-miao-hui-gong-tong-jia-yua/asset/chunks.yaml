    # 共建开放生态，使能万物互联的智能世界


    ## 陶景文


    华为公司董事、首席信息官


    ![](images/txt020_1.jpg "pagenumber_ebook=163,pagenumber_book=147")


    毕业于北京邮电大学。1996年加入华为，历任产品开发工程师、市场技术处副总经理、国际行销部常务副部长、南部非洲地区部常务副总裁/总裁、全球行销/营销总裁、终端公司总裁、西欧地区部总裁、质量流程IT总裁等职务。


    ![](images/txt020_2.jpg "pagenumber_ebook=164,pagenumber_book=148")


    第四次工业革命已经到来，随着5G、AI、产业互联网等技术的不断成熟，以及以5G、数据中心、云等为代表的新一代基础设施的加速建设和推进，技术正在加速第四代工业互联网在万物互联、万物智能，包括企业、行业的数字化转型方面的海量应用。


    ### 对人工智能发展的理解和判断


    我们认为，第四次工业革命将会影响到行业的方方面面，它不但会改变人们的生活，让人们的生活更智慧、更便捷，也会改变各行各业。随着人工智能，还有数字技术大量的使用，在这个世界上会诞生一个超过12万亿的市场。我们预计到2025年，ICT（信息通信技术）行业和智能制造行业大概分别会有5万亿和6.4万亿的规模。华为2017年发布了公司新的愿景，就是把数字世界带给每个人、每个家庭、每个组织，从而构建万物互联的数字世界。2018年，华为发布了“+智能，见未来”的全栈人工智能战略。2019年，又以“共创智能新高度”展示企业在人工智能方面的战略和推进人工智能行业应用的决心。


    ### 华为的人工智能发展经验


    华为首先是一个科技创新型公司，拥有两大产业群。第一大产业群是围绕智能手机的电子消费产业群。我们一直在持续构建“1+8+N”的商业生态，希望让每个人、每个家庭的生活更加智能、愉悦。华为打造了围绕着“2C”商业环境全栈的智能解决方案，从终端手机芯片、云服务、产业生态，与行业合作伙伴共同构建一个面向个人和家庭的智能生活解决方案。


    第二大产业群面向政府、运营商、行业企业客户、ICT基础设施产业群，致力于提供无处不在的连接和无所不及的智能产品和解决方案。在华为2019年发布的全栈人工智能解决方案中就有一项内容，是结合华为的企业智能（EI）使能平台，帮助政府、行业、企业快速构建人工智能应用。从芯片、5G、边缘计算，以鲲鹏生态Atlas为中心的云服务，华为提供了全栈的服务平台，并与产业合作伙伴共同构建了一个面向全行业、全场景的应用生态，为构建面向“端边云”的全场景AI基础设施提供产品和服务的支持。


    洛阳有个钼矿，因为地处偏远，人工驾驶大型矿车深入矿区采矿风险很高。利用“5G+人工智能”实现的无人驾驶和远端控制，2019年该矿区实现了零伤亡，司机人数从原来的100多人减少到了20人，年产值增加了1.6亿元，实现了很大的经济和社会效益。华为还帮助宁波舟山港建成了“5G+人工智能”智慧港口，集装箱卡车24小时自动作业，自动识别准确率高达95%，节约了大量的人力投入。在本次新冠疫情中，华为与全国300多家医院合作，为超过100万人提供基于“5G+人工智能”的医疗服务，医生读片的速度从过去的每张超过10分钟，缩短到了1分钟之内。


    人工智能是业务场景、算法、算力和数据四位一体的综合性服务，华为作为业态丰富的企业，自身也在积极推动智能化的实践。华为在公司内部建立了华为企业智能大脑，将建设一个为企业服务的人工智能平台的时间从初期的14～16个月缩短到了现在的0.5～2个月。我们希望华为自身的实践经验也能帮助各行各业实现体验提升、效率提升、效益提升和商业模式创新。华为一直秉承“自己的降落伞自己跳”的理念，基于自身丰富的企业应用场景，聚焦重复、海量、复杂的场景，打造产品创新和智能化转型的试验田，并将华为数字化转型的成熟经验赋能于更多的企业。


    ### 对人工智能发展的思考和建议


    为了让人工智能发展更好地服务社会，我们有两个建议。第一，人工智能要有序发展。我们认为政府、行业协会、标准组织应加强政策制定、AI立法，各个行业、产业联盟要加强共识，形成数据交换的标准。第二，我们呼吁在人工智能产业链上加强政府与企业，AI技术、算法与专业技术方面的合作。人工智能的发展目标是为企业提供好的技术和产品解决方案，技术需要相应的企业和用户场景去验证，算法需要数据和业务场景进行持续优化。任何国家试图以封闭来阻止人工智能的发展，都改变不了公众对人工智能行业应用和未来智能社会构建的诉求。依托上海的政策优势和优秀的产业发展环境，华为在上海陆续布局了鲲鹏+昇腾、5G、5G+XR以及自动驾驶等创新中心，共同推进人工智能在各行各业的应用。


    在使用人工智能方面，我们对业界也有两个方面的建议。

