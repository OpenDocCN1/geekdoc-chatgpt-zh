- raw: "第一，人工智能是四位一体的综合性服务，数据已经成为海、陆、空之外的第四个战略资源、第四个空间，并会越来越重要。我们不能总是期望“去挖别人家的矿，建自己家的楼”，发展人工智能要在加强数据主权保护的基础上，促进数据开放、智能、至善。第二，在尊重数据主权、数据空间、知识产权、有效保护数据资产的基础上，促进合理的开源开放和数据流动是当务之急。我们呼吁政府、行业机构加强AI立法、行业伦理和行业标准制定，建立有共识的数据交换空间，促进数据合理使用。\n\
    \n\uFEFF\n\n人工智能芯片：新的一页\n\n陆永青\n\n帝国理工学院教授，鲲云科技联合创始人兼首席科学家\n\n![](images/txt021_1.jpg\
    \ \"pagenumber_ebook=168,pagenumber_book=152\")\n\n英国帝国理工学院教授，英国皇家工程院院士，电气和电子工程师协会（IEEE）、英国计算机学会（BCS）会士，中国人工智能产业创新联盟专业委员会主任委员及鲲云科技联合创始人兼首席科学家，鲲云人工智能应用创新研究院院长。ACM\
    \ TRETS创刊主编，定制计算领域学术会议FPT、FPL创始人，ASAP、FCCM、FPL、FPT、HEART学术会议指导委员会委员，曾任英国皇家工程院杰出访问学者评选委员会委员。作为可重构计算及现场可编程技术领域的国际知名学者，在国际学术期刊和国际学术会议上发表500余篇论文，获得国际专利2项，出版学术著作3部。\n\
    \n在开始讨论芯片之前，我首先谈一谈这10年来的高性能计算趋势。大家可能看过全球前500名最快的超级计算机列表。2008年11月，日本的一个基于GPU（图形处理器）的超级计算机首次进入了500强，排名第三十。到了2010年6月，基于GPU的超级计算机“星云”（中国的一款超级计算机）排名第二。10年之后的今天，也就是2020年的6月，我们发现在前10名超级计算机中，基于GPU的占6名。\n\
    \n什么是GPU？GPU有两个核心功能：第一，它包含数以千计的处理核并行计算。也就是说，一个GPU可以支持大规模的并行处理。图1是图灵GPU，每个绿色的部分又包含很多处理核。GPU的第二个核心功能是它支持单指令流、多重数据流。\n\
    \n![](images/txt021_2.jpg \"pagenumber_ebook=169,pagenumber_book=153\")\n\n图1　\
    \ 图灵GPU\n\n我们先看一看图2左边的CPU。我们可以看到它包含单指令流、单数据流。图2右边的GPU也是单指令流，但它有单指令多重数据架构，可以处理多重数据流。正是因为GPU的数据流可以分享单一指令流，它的效率能比CPU更高。\n\
    \n![](images/txt021_3.jpg \"pagenumber_ebook=170,pagenumber_book=154\")\n\n图2　\
    \ GPU计算架构\n\n我们比较一下GPU和CPU的性能。从图3中可以看到对于单一精度和多精度浮点操作来说，GPU都比CPU有更高的性能。\n\nGPU如此强大，还有进步的空间吗？我们来看一看人工智能的基准测试程序中有关芯片利用效率这个指标（图4）。其实GPU的芯片利用率并不高，甚至低到了7.52%。芯片利用效率衡量的是芯片的算力性价比。芯片实测性能是用户得到的价值，峰值性能基于芯片的尺寸和技术，反映芯片的成本。芯片利用效率等于芯片实测性能除以芯片峰值性能。\n\
    \n![](images/txt021_4.jpg \"pagenumber_ebook=171,pagenumber_book=155\")\n\n图3　\
    \ GPU/CPU性能比较\n\n![](images/txt021_5.jpg \"pagenumber_ebook=171,pagenumber_book=155\"\
    )\n\n图4　 芯片利用效率\n\n也就是说，对于一个给定的峰值性能，芯片利用效率越高，芯片实测性能就越高，用户得到的效果就越好。那么如何改进芯片利用效率呢？过去的几年中，我们研制了一个新的架构，叫作定制数据流计算架构。和图5左边的一个指令流、多重数据流的GPU相比，图5右边的定制处理器也可以处理多重数据流，但它不需要指令流，所以它能比GPU更加有效。\n\
    \n![](images/txt021_6.jpg \"pagenumber_ebook=172,pagenumber_book=156\")\n\n图5　\
    \ 定制数据流计算架构\n\nGPU的指令让GPU更灵活。定制处理器没有指令，如何实现灵活性呢？在定制处理器中，有一个数据流配置器，这个数据流配置器可以用于动态重组定制处理器，让它尽可能地灵活，就像CPU和GPU一样。\n\
    \n这种架构现在已经被投入实践应用中。在图6的定制人工智能数据流的芯片架构CAISA3.0中我们可以看到，这个架构和GPU一样包含多个定制处理器，它们可以并行运作以支持大规模的并行计算。在每个定制处理器中都有多重配置器，旨在保证灵活性。就像GPU和CPU可以提供的灵活性一样，全局的缓冲结构中也包含了这种配置器，使这个架构更加灵活。\n\
    \n![](images/txt021_7.jpg \"pagenumber_ebook=173,pagenumber_book=157\")\n\n图6　\
    \ 芯片架构CAISA3.0\n\nCAISA3.0架构的芯片采用了28纳米的工艺，已经被应用于第一代先进的数据流芯片中，可以支持边缘和云端AI推理。图灵GPU的芯片利用效率可以低至只有8%，而CAISA3.0芯片利用率可以高达95.4%，是一个巨大的飞跃。它的峰值算力是10.9\
    \ TOPS，可以在-40～125℃之间正常工作。这个CAISA芯片现在已经被应用于星空加速卡X3，可以支持边缘计算平台及云计算平台。该芯片还被用于星空加速卡X9，主要是用于云计算。\n\
    \n接下来我们看一些基准数据，比较一下X9和GPU。首先我们看延时。延时就是响应一个外部输入的时间，所以延时越低越好。从图7中我们可以看到，CAISA芯片的延时比图灵GPU要好30倍，在不同的AI基准中，我们都可以看得到这种优势。\n\
    \n然后再看看图8的芯片利用率。在不同的AI基准中，我们看到CAISA芯片在X9加速卡中，它的芯片利用率比GPU要高11倍。\n\n![](images/txt021_8.jpg\
    \ \"pagenumber_ebook=174,pagenumber_book=158\")\n\n图7　 X9和GPU基准数据—延时对比\n\n![](images/txt021_9.jpg\
    \ \"pagenumber_ebook=174,pagenumber_book=158\")\n\n图8　 X9和GPU基准数据—芯片利用率对比\n\n\
    再看一看性能。从图9中我们可以看到，CAISA芯片在X9加速卡中能够达到的FPS（画面每秒传输帧数）性能是图灵GPU的3.91倍。\n\n![](images/txt021_10.jpg\
    \ \"pagenumber_ebook=175,pagenumber_book=159\")\n\n图9　 X9和GPU基准数据—性能对比\n\n这是什么意思？我们举一个例子说明：处理分析25000路视频数据。在此案例中，如果我们使用包含GPU加速卡的服务器，我们需要100台服务器，每一个服务器包含8张GPU加速卡，以支持每一个250路的视频分析。如果把性能提升到3.91倍，这就意味着每一个服务器不是仅能支持250路视频，而是可以支持977路视频，这时就不需要100台服务器，而只需要26台服务器，每个服务器上采用8张X9加速卡。这个X9加速卡就是采用了我们刚才讲到的CAISA3.0版本的芯片。\n\
    \n这个用于加速卡的CAISA芯片架构现在已经落地于一系列广泛的领域，包括智能制造、智慧城市、安监生产、轨道交通、智能遥感等。为了能够让应用程序的开发简便易用，我们研制了一个端到端的应用程序开发模型。这个始于深度学习的模型，可以自动产生CAISA架构上的适合应用程序，应用于有关的硬件平台。\n\
    \n也就是说，开发应用程序的人，不需要成为一个AI芯片的专家。他甚至不需要了解CAISA架构，就可以利用它的好处。这个模型支持广泛的深度学习算子，部分如图10所示。这让算法设计者的工作更加轻松，因为他们只要应用这些算子软件，就可以得益于CAISA架构。\n\
    \n![](images/txt021_11.jpg \"pagenumber_ebook=176,pagenumber_book=160\")\n\n图10　\
    \ 部分支持算子\n\n因此，这种新的架构让我们掀开了人工智能芯片的新的一页。这种芯片可以带来更高的算力性价比，支持更多的AI算法，更便于使用。因为应用开发工具用起来很方便，所以它们会带来更智能的计算平台、系统和应用，它们可以被更快地落地部署。\n\
    \n希望新的CAISA芯片可以让我们受益于最先进的技术进展，让所有人的生活更美好。\n\n\uFEFF\n\n人工智能与新基建\n\n姚志强\n\n云从科技联合创始人\n\
    \n![](images/txt022_1.jpg \"pagenumber_ebook=177,pagenumber_book=161\")\n\n云从科技联合创始人，重庆市机器视觉工程技术研究中心主任、重庆市企业技术中心负责人。中国科学技术大学信号与信息处理专业博士，有19年从业经历。坚持自主创新，带队参与国家级项目5项，省部级项目9项，规划建设国家发改委重大工程项目—人工智能基础资源公共服务云平台，参与起草国家标准“基于互联网的人脸识别认证系统技术要求”、公安部标准“公共安全视频监控云平台可行性研究报告”。\n\
    \n周 剑\n\n优必选科技创始人、董事长兼CEO\n\n![](images/txt022_2.jpg \"pagenumber_ebook=178,pagenumber_book=162\"\
    )\n\n优必选科技创始人、董事长兼CEO，广东省第十三届人民代表大会代表，悉尼大学工程与信息技术学院计算机科学学院客座教授，深圳国际商会副会长，深圳市商业联合会副会长，深商AI智能机器人产业联盟主席，深圳机器人协会副理事长，第十七届国际奥林匹克机器人大赛主席等。人形机器人的先锋践行者，2012年3月创办的优必选科技，现已发展成为全球顶尖的人工智能和人形机器人研发、制造和销售为一体的高科技创新企业。\n\
    \n郑庆生\n\n红杉资本中国基金合伙人\n\n![](images/txt022_3.jpg \"pagenumber_ebook=179,pagenumber_book=163\"\
    )\n\n红杉资本中国基金合伙人，专注于TMT领域的投资。投资了包括客路旅游、爱奇艺、大众点评、360集团、蘑菇街、360金融、摩拜单车、新经典出版、百度文学、容联云通讯、激智科技、豆瓣和好大夫等优秀企业。毕业于复旦大学国际金融系，在从事风险投资工作之前，曾担任盛大互动娱乐有限公司的投资与海外中心助理总监，负责投资和海外业务。在此之前，曾在普华永道、IBM和BearingPoint有多年财务和管理咨询经验。\n\
    \n陈海波\n\n深兰科技（上海）有限公司创始人\n\n![](images/txt022_4.jpg \"pagenumber_ebook=180,pagenumber_book=164\"\
    )\n\n中国管理科学研究院学术委员、清华大学创+学生创意创新创业实践基地创业导师，中南大学—深兰科技人工智能联合研究院第一届专家委员会委员，曾先后荣获“2019中国人工智能杰出人物”“2018硬科技行业风云人物奖”“中国智能制造风云人物”等多项个人荣誉。\n\
    \n吴明辉\n\n明略科技集团创始人、董事长兼CEO\n\n![](images/txt022_5.jpg \"pagenumber_ebook=181,pagenumber_book=165\"\
    )\n\n《财富》“中国40位40岁以下商界精英”之一。中国人民公安大学特聘教授，北京大学和中国人民大学创业导师。作为改革开放40年里年轻一代的连续创业成功者，2006年，创立秒针系统—中国最大的互联网用户行为和营销数据分析平台；2014年，创立明略科技—将业务从线上商业领域拓展到政府服务及线下商业领域，将技术能力从大数据拓展至人工智能；2019年，创立明略科技集团—中国领先的一站式人工智能企业级服务平台，并入选国家新一代人工智能开放创新平台。毕业于北京大学，获数学系学士学位、计算机软件与理论硕士学位及北大人工智能实验室（AILab）优秀硕士学位。拥有20年软件工程开发和算法研究经验、130余项国内外发明专利。\n\
    \n夏华夏\n\n美团首席科学家兼AI平台总经理\n\n![](images/txt022_6.jpg \"pagenumber_ebook=182,pagenumber_book=166\"\
    )\n\n美团首席科学家、AI平台总经理。于美国加州大学圣迭戈分校取得博士学位。曾任Google高级工程师、百度主任架构师。主要从事基础架构、云计算、大数据、人工智能、无人驾驶等领域。\n\
    \n![](images/txt022_7.jpg \"pagenumber_ebook=183,pagenumber_book=167\")\n\n从2017年开始，上海就在人工智能领域出台了一系列中长期的规划，并逐步凝聚起了浓郁的产业发展氛围。而现在，人工智能又成为新基建的轴心，从而为中国经济创造新的红利。\n\
    \n人工智能与数字新基建\n\n姚志强：新基建是我们从信息化到智慧化、智能化的必要转型步骤。如果说人工智能是大脑，那么硬件基础就相当于身体。我们不仅需要聪明的大脑，也要有强健的身体。\n\
    \n身体传回来的数据要聪明的大脑去分析，去做出决策；分析的结果和决策又会返回实际应用场景与实时数据相结合。所以我们既需要人工智能，也需要数字基础设施。\n\n\
    周剑：几年前，人工智能还没有到达切实可行的阶段。但随着人工智能技术的发展，包括数据积累、算力提升等，人工智能将对社会发展起到核心驱动的作用。新基建的含义也会从之前的“铁公基”转变为更多的技术驱动的基础设施建设。\n\
    \n在这次疫情中，我们发现智能机器人是人工智能最好的载体。未来机器人还将更多地在智慧医疗、智慧教育、智慧驾驶等场景中全面地改变社会运转的结构，让社会发展越来越高效。\n\
    \n郑庆生：中国的互联网已经走过了20个年头，支付、消费、娱乐都已经实现了大规模在线化，这积累了大量数据资源，让整个社会的互联网节点变得非常丰富，也为下一步的数字智能或人工智能提供了一个非常好的基础。\n\
    \n同时，中国的发展是很有特色的。中国的数字化、在线化、云端化、智能化是一个全价值链的过程，和欧美发达国家不同的是，中国既有巨大的市场，又是世界的工厂，所以基本上做到了从设计营销到生产物流的全覆盖，可以形成全链路数字化闭环。在全链路的闭环里面，通过数据化，每一个环节都有人工智能的巨大机会，有非常广阔的天地。\n\
    \n陈海波：20年的互联网发展使中国成为互联网大国，也成为数据大国，为中国成为人工智能大国奠定了基础。目前深度学习是人工智能的主要阶段，数据是粮食，算法是工具，算力是基础，新基建将为我们夯实多种基础。\n\
    \n吴明辉：新基建是各方都需要参与的事情，不仅是国家层面，也包括在企业内部去推动基础设施建设，并在这个基础上推动更广泛的经济增长。整个社会是由物质、能量、信息三大核心要素构成的，老基建的作用是促进物质和能量的运输和流通，而人工智能关乎的是信息，其中数据中心就是人工智能的基础设施。比如，我们为上海地铁搭建的智能运维平台和数据共享平台可以提升地铁运营效率，降低成本；为电力系统搭建的数据中台可以做到电网智慧调度。未来还会有更多基于此的应用出现。\n\
    \n夏华夏：我们认为人工智能就是一种基础设施，会是未来生活中必不可少的技术。我们提供智能餐厅解决方案帮助商家更高效地运营，我们打造无人酒店，让用户可以刷脸入住，指纹开锁，从而提供更好的入住体验。为了帮助外卖小哥改善工作环境，我们正在开发无人机和无人车的配送，让小哥不需要在路上奔波，而只是解决最后100米的配送问题。我们做人工智能应用是基于一个个真实的生活场景，我们也相信AI会成为未来生活的基础设施。国家大力推动的新基建对人工智能行业也有很大帮助。5G、芯片、物联网、数据中心等项目的建设将进一步完善人工智能生态，并对行业起到推动作用。\n\
    \n人工智能发展的机遇与路径\n\n周剑：目前人工智能还处于比较初级的阶段，到通用智能还有很长的路要走。所以我们现在强调的是在可控环境下，在一些垂直领域的细分场景去深入发展。\n\
    \n优必选科技一直聚焦在人形机器人。为什么是人形机器人？轮式的、履带式的或四足的机器人是否也能实现我们需要的功能？如果你看过《西部世界》，一定会喜欢这部剧中的人形机器人，这就是我们的目标，可能需要50～100年才能实现。\n\
    \n但这件事总得有人去做。\n\n优必选科技目前在努力降低大型人形机器人的成本。我们认为只要这样的机器人价格降低到一定程度，比如说几十万元，和一台中高档汽车的价格类似，那么它们就能进入家庭，从而形成机器人行业一个垂直领域的应用场景。我一直强调，不能只看现在的技术，而是要思考人类未来到底需要什么样的产品。如果未来需要人形机器人，那么优必选科技就会一直走在这条路上。发展硬科技必须有耐心以及坚持长期投资的理念，我们希望为中国做一些与众不同的东西。依托中国强大的制造业和供应链基础，我们希望用得起的人形机器人能够在中国的供应链上被第一个造出来，能够实现商用或者家用，这是我们最自豪的事情。在实现这个目标的过程中，我们的很多技术可以“沿途下蛋”，比如我们可以做最美的新基建—人工智能教育，以及商业服务、安防巡检、养老等方面的一些智能机器人。\n\
    \n陈海波：如果中国要在第四次工业革命中处于领导者地位，需要解决两个问题。第一，基础研究要领先世界；第二，要完成从工业大国到工业强国的转变。在此期间，技术推动是主旋律，而人工智能在工业智能化方面是主力军。\n\
    \n智能制造能在很大程度上帮助人工智能企业商业落地，帮助人工智能企业针对市场需求打造产品。人工智能企业要认识到技术是用以赋能各行各业的，人工智能技术只有与场景结合才能产生作用。真正的人工智能企业应该从“软”做到“硬”，基础研究和应用开发都强，才能够符合未来市场和社会对人工智能的期望。\n\
    \n吴明辉：在人工智能时代，科技创新企业应走出差异化的道路，选好细分市场和不同赛道。我认为，未来每一个人工智能细分领域只有第一名可以取得成功，因为其能力是可以复制的，而其他的竞争者将是没有前途的。中国有最为广泛的人工智能应用场景，企业应选好自己的细分市场。\n\
    \n夏华夏：我们真正的目标是用科技，特别是人工智能帮助提供本地生活服务的商家提高效率，帮助用户得到更好的服务，最终让人工智能成为生活的一个基础设施。未来五六年，我们一个重要的任务是帮助那些不会用互联网的人使用我们的服务，包括很多老人和小孩。用图像识别帮助中小餐馆老板录入菜单和管理订单，利用语音交互、视觉理解等人工智能相关技术实现无人配送，都是未来几年我们要做的事情。\n\
    \n郑庆生：对于投资人来说，无论多好的技术都需要找到商业变现的场景。企业有一个长远的定位，但每一步都需要找到细分的场景去实现，这是投资人非常希望看到的。"
  fmt: "\n# 人工智能芯片：新的一页\n\n**陆永青**  \n帝国理工学院教授，鲲云科技联合创始人兼首席科学家\n\n![](images/txt021_1.jpg\
    \ \"pagenumber_ebook=168,pagenumber_book=152\")\n\n英国帝国理工学院教授，英国皇家工程院院士，电气和电子工程师协会（`IEEE`）、英国计算机学会（`BCS`）会士，中国人工智能产业创新联盟专业委员会主任委员及鲲云科技联合创始人兼首席科学家，鲲云人工智能应用创新研究院院长。`ACM\
    \ TRETS`创刊主编，定制计算领域学术会议`FPT`、`FPL`创始人，`ASAP`、`FCCM`、`FPL`、`FPT`、`HEART`学术会议指导委员会委员，曾任英国皇家工程院杰出访问学者评选委员会委员。作为可重构计算及现场可编程技术领域的国际知名学者，在国际学术期刊和国际学术会议上发表500余篇论文，获得国际专利2项，出版学术著作3部。\n\
    \n## 高性能计算趋势回顾\n\n在开始讨论芯片之前，我首先谈一谈这10年来的高性能计算趋势。大家可能看过全球前500名最快的超级计算机列表。2008年11月，日本的一个基于`GPU`（图形处理器）的超级计算机首次进入了500强，排名第三十。到了2010年6月，基于`GPU`的超级计算机“星云”（中国的一款超级计算机）排名第二。10年之后的今天，也就是2020年的6月，我们发现在前10名超级计算机中，基于`GPU`的占6名。\n\
    \n## GPU 核心功能\n\n什么是`GPU`？`GPU`有两个核心功能：第一，它包含数以千计的处理核并行计算。也就是说，一个`GPU`可以支持大规模的并行处理。图1是图灵`GPU`，每个绿色的部分又包含很多处理核。`GPU`的第二个核心功能是它支持单指令流、多重数据流（`SIMD`）。\n\
    \n![](images/txt021_2.jpg \"pagenumber_ebook=169,pagenumber_book=153\")\n\n**图1　\
    \ 图灵GPU**\n\n## CPU 与 GPU 架构对比\n\n我们先看一看图2左边的`CPU`。我们可以看到它包含单指令流、单数据流（`SISD`）。图2右边的`GPU`也是单指令流，但它有单指令多重数据架构，可以处理多重数据流。正是因为`GPU`的数据流可以分享单一指令流，它的效率能比`CPU`更高。\n\
    \n![](images/txt021_3.jpg \"pagenumber_ebook=170,pagenumber_book=154\")\n\n**图2　\
    \ GPU计算架构**\n\n## GPU 与 CPU 性能比较\n\n我们比较一下`GPU`和`CPU`的性能。从图3中可以看到对于单一精度和多精度浮点操作来说，`GPU`都比`CPU`有更高的性能。\n\
    \n![](images/txt021_4.jpg \"pagenumber_ebook=171,pagenumber_book=155\")\n\n**图3　\
    \ GPU/CPU性能比较**\n\n## 芯片利用效率分析\n\n`GPU`如此强大，还有进步的空间吗？我们来看一看人工智能的基准测试程序中有关芯片利用效率这个指标（图4）。其实`GPU`的芯片利用率并不高，甚至低到了7.52%。芯片利用效率衡量的是芯片的算力性价比。芯片实测性能是用户得到的价值，峰值性能基于芯片的尺寸和技术，反映芯片的成本。芯片利用效率等于芯片实测性能除以芯片峰值性能。\n\
    \n![](images/txt021_5.jpg \"pagenumber_ebook=171,pagenumber_book=155\")\n\n**图4　\
    \ 芯片利用效率**\n\n也就是说，对于一个给定的峰值性能，芯片利用效率越高，芯片实测性能就越高，用户得到的效果就越好。\n\n## 定制数据流计算架构\n\
    \n那么如何改进芯片利用效率呢？过去的几年中，我们研制了一个新的架构，叫作定制数据流计算架构。和图5左边的一个指令流、多重数据流的`GPU`相比，图5右边的定制处理器也可以处理多重数据流，但它不需要指令流，所以它能比`GPU`更加有效。\n\
    \n![](images/txt021_6.jpg \"pagenumber_ebook=172,pagenumber_book=156\")\n\n**图5　\
    \ 定制数据流计算架构**\n\n### 定制处理器的灵活性实现\n\n`GPU`的指令让`GPU`更灵活。定制处理器没有指令，如何实现灵活性呢？在定制处理器中，有一个数据流配置器，这个数据流配置器可以用于动态重组定制处理器，让它尽可能地灵活，就像`CPU`和`GPU`一样。\n\
    \n## CAISA 3.0 芯片架构与应用\n\n这种架构现在已经被投入实践应用中。在图6的定制人工智能数据流的芯片架构`CAISA3.0`中我们可以看到，这个架构和`GPU`一样包含多个定制处理器，它们可以并行运作以支持大规模的并行计算。在每个定制处理器中都有多重配置器，旨在保证灵活性。就像`GPU`和`CPU`可以提供的灵活性一样，全局的缓冲结构中也包含了这种配置器，使这个架构更加灵活。\n\
    \n![](images/txt021_7.jpg \"pagenumber_ebook=173,pagenumber_book=157\")\n\n**图6　\
    \ 芯片架构CAISA3.0**\n\n`CAISA3.0`架构的芯片采用了28纳米的工艺，已经被应用于第一代先进的数据流芯片中，可以支持边缘和云端`AI`推理。图灵`GPU`的芯片利用效率可以低至只有8%，而`CAISA3.0`芯片利用率可以高达95.4%，是一个巨大的飞跃。它的峰值算力是10.9\
    \ `TOPS`，可以在-40～125℃之间正常工作。这个`CAISA`芯片现在已经被应用于星空加速卡`X3`，可以支持边缘计算平台及云计算平台。该芯片还被用于星空加速卡`X9`，主要是用于云计算。\n\
    \n## 基准测试数据对比\n\n接下来我们看一些基准数据，比较一下`X9`和`GPU`。\n\n### 延时对比\n\n首先我们看延时。延时就是响应一个外部输入的时间，所以延时越低越好。从图7中我们可以看到，`CAISA`芯片的延时比图灵`GPU`要好30倍，在不同的`AI`基准中，我们都可以看得到这种优势。\n\
    \n![](images/txt021_8.jpg \"pagenumber_ebook=174,pagenumber_book=158\")\n\n**图7　\
    \ X9和GPU基准数据—延时对比**\n\n### 芯片利用率对比\n\n然后再看看图8的芯片利用率。在不同的`AI`基准中，我们看到`CAISA`芯片在`X9`加速卡中，它的芯片利用率比`GPU`要高11倍。\n\
    \n![](images/txt021_9.jpg \"pagenumber_ebook=174,pagenumber_book=158\")\n\n**图8　\
    \ X9和GPU基准数据—芯片利用率对比**\n\n### 性能对比\n\n再看一看性能。从图9中我们可以看到，`CAISA`芯片在`X9`加速卡中能够达到的`FPS`（画面每秒传输帧数）性能是图灵`GPU`的3.91倍。\n\
    \n![](images/txt021_10.jpg \"pagenumber_ebook=175,pagenumber_book=159\")\n\n**图9　\
    \ X9和GPU基准数据—性能对比**\n\n## 实际应用案例：视频分析\n\n这是什么意思？我们举一个例子说明：处理分析25000路视频数据。在此案例中，如果我们使用包含`GPU`加速卡的服务器，我们需要100台服务器，每一个服务器包含8张`GPU`加速卡，以支持每一个250路的视频分析。如果把性能提升到3.91倍，这就意味着每一个服务器不是仅能支持250路视频，而是可以支持977路视频，这时就不需要100台服务器，而只需要26台服务器，每个服务器上采用8张`X9`加速卡。这个`X9`加速卡就是采用了我们刚才讲到的`CAISA3.0`版本的芯片。\n\
    \n## 落地应用与开发生态\n\n这个用于加速卡的`CAISA`芯片架构现在已经落地于一系列广泛的领域，包括智能制造、智慧城市、安监生产、轨道交通、智能遥感等。为了能够让应用程序的开发简便易用，我们研制了一个端到端的应用程序开发模型。这个始于深度学习的模型，可以自动产生`CAISA`架构上的适合应用程序，应用于有关的硬件平台。\n\
    \n也就是说，开发应用程序的人，不需要成为一个`AI`芯片的专家。他甚至不需要了解`CAISA`架构，就可以利用它的好处。这个模型支持广泛的深度学习算子，部分如图10所示。这让算法设计者的工作更加轻松，因为他们只要应用这些算子软件，就可以得益于`CAISA`架构。\n\
    \n![](images/txt021_11.jpg \"pagenumber_ebook=176,pagenumber_book=160\")\n\n**图10　\
    \ 部分支持算子**\n\n## 总结\n\n因此，这种新的架构让我们掀开了人工智能芯片的新的一页。这种芯片可以带来更高的算力性价比，支持更多的`AI`算法，更便于使用。因为应用开发工具用起来很方便，所以它们会带来更智能的计算平台、系统和应用，它们可以被更快地落地部署。\n\
    \n希望新的`CAISA`芯片可以让我们受益于最先进的技术进展，让所有人的生活更美好。\n\n---\n\n# 人工智能与新基建\n\n## 嘉宾介绍\n\n\
