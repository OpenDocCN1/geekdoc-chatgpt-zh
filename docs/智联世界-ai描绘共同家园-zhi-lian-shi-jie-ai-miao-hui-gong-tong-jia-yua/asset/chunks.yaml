    ### Ji Xinhua

    Chairman, Chief Executive Officer and President, UCloud Technology Co., Ltd.


    ![](img/txt016_6.jpg "pagenumber_ebook=134,pagenumber_book=118")


    Chairman, CEO and President of UCloud Technology Co., Ltd. (UCloud), 2020 Shanghai
    Senior Professional Engineer (AI specialty), Deputy of the 15th Shanghai People''s
