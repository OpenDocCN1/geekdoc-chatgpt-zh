- raw: "第一是环境感知。人工智能的图像识别系统，虽然识别率很高，但由于它识别的办法跟人类非常不一样，所以非常不可靠、不安全、容易受到攻击。我们看一下机器是怎么识别马的：它把马的局部特征分析出来，然后和牛等其他动物的特征做比较，根据局部特征进行区分。这就是我们常常讲的黑箱学习方法，也就是说它只能学习那些局部的特征，学习不了高层的语义特征，因此只能分辨马和牛，但并不认识马和牛。那么我们怎么来改进这项工作？其中一个途径是借鉴人脑的工作机制。人脑的视觉神经也是多层神经网络，相比之下，我们现在使用的人工神经网络太简单了，只有下一层跟上一层的联系，这叫作前向连接。而人脑视神经网络比前向人工神经网络要复杂得多，其中还有反馈连接、横向连接、稀疏放电、注意机制、多模态和记忆等。\n\
    \n如果我们能把人类视神经网络的特点，加到现在人工神经网络中去，就可以极大改善图像识别的性能，这也是我们今天要做的一项工作。下面介绍我们团队的一项工作，即把稀疏放电的规则放到各层神经网络中，仅凭借这一点，就可以让网络中最顶部的神经元检测到人脸的轮廓、小汽车的轮廓和大象的轮廓和鸟的轮廓，也就是说它能够把语义特征检测出来。这说明只要把人类神经网络的一些特点加进去，就有可能改善人工智能图像识别和语音识别的性能。当然，这只是初步的工作。\n\
    \n此外，现在图像识别里还存在许多问题，比如，很难把物体和它的背景分开。以识别马作为例子，机器很难检测到马在什么地方（where），也不知道什么是马（what）。怎么解决这个矛盾呢？还是要回到人类的大脑，大脑怎么解决这个问题呢？人类为什么一看图片，就知道马在哪里？因为我们认识马，那么马的知识是从哪里来的？实际上，是从我们不断的观察中学来的。我们可以用一个自编码的神经网络，让它通过无监督学习，学到有关马的知识。当计算机认识马以后，就很容易在图像上找到马，把马和背景区分开，因此很容易识别马。这方面我们做了一些初步工作，取得了一些成果。\n\
    \n第二，关于人工智能的安全性问题。刚才说过，通过深度学习做出来的模式识别系统，非常不安全，非常容易受到攻击。这些缺陷我们可以从数据上、从模型上进行改进。这里只举一个例子—人脸识别。大家经常用人脸识别登录手机。如果不是本手机用户，则通过“刷脸”登录失败，系统判别出不是用户。如果戴上伪装的眼镜，就可以登录了，实现了对系统的欺骗。如果加上AI防火墙，即使戴上伪装眼镜也进不去了。这说明可以用各种办法提高智能系统的安全性。我们开发了一个开源的“珠算”概率编程库，其中包括我们自己研制的概率编程算法，在可解释性、安全性上都有一定提高。\n\
    \n第三，关于推理、决策和博弈。人工智能程序在棋类上打败了人类，包括围棋和象棋，它们属于完全信息博弈，对计算机来讲是比较简单的。如果是不完全信息博弈的牌类，对计算机而言就困难得多。2017年计算机才在四人无限注的德州扑克牌上战胜了人类。牌类一般属于概率意义下的确定性问题，概率通常可以计算出来。但我们平常的决策环境不一样，属完全不确定的，甚至是在对抗环境下做决策。目前在对抗环境下做决策，往往用游戏比赛作为实验平台。游戏的环境是变化的、不确定的，也有进攻、防卫等不同的任务。目前采用的主要办法是强化学习，当前计算机只是在简单的游戏环境下可以打败人类。我们团队参加了一些比赛，如在国际VizDoom比赛中，2018年获预赛2项冠军，决赛1项冠军、1项亚军。\n\
    \n第四，如何适应环境的变化，即如何随机应变。我们从1991年就开始研制自动驾驶车，当前自动驾驶的问题在哪里？我们现在采用的办法是把物体识别出来，建立模型，在模型上做规划，目前以上三项均能达到实时的要求。尽管如此，在路况复杂的情况下，这种方案还是不好用，因为它难以对付突发事件。为了对付突发事件，需要加上驾驶的知识，需要在真实环境下，从不断的试验中去积累经验，就是通过所谓强化学习的办法，学会应对突发事件。我们开发了一个开源平台，即“天授”强化学习平台。\n\
    \n最后，为什么说人工智能刚刚拉开序幕呢？第一代、第二代人工智能都存在很大的局限，它只能解决完全信息和结构化环境下确定性的问题，能解决的问题非常有限，主要是利用数据和计算机的计算能力。精彩的大戏将要上演，这就是指第三代人工智能。第三代人工智能的目标是更好地解决计算机的智能问题。人类智能最重要的表现，是随机应变、举一反三。为了做到这一点，我们必须充分利用知识、数据、算法和算力四个要素，这样才能解决不完全信息、不确定性和动态变化环境下的问题，达到真正的人工智能。\n\
    \n【注释】  \n\n[\\[1\\]](#txt009.html#footnote_quote_txt009_1)Yinpeng Dong，Fangzhou\
    \ Liao，Tianyu Pang，et al.Boosting Adversarial Attacks with Momentum.\\[2017—12—6\\\
    ].https： //za.arxiv.org/pdf/1710.06081.\n\n\uFEFF\n\n走向有意识的AI：受认知神经智能启发的计算机架构\n\
    \n曼纽尔·布卢姆（Manuel Blum）\n\n图灵奖得主、美国国家科学院院士、美国国家工程院院士、美国艺术与科学学院院士\n\n![](images/txt010_1.jpg\
    \ \"pagenumber_ebook=67,pagenumber_book=51\")\n\n美国卡内基梅隆大学计算机科学学院教授。1964年获麻省理工学院数学博士学位，博士导师是人工智能先驱马尔温·明斯基（Marvin\
    \ Minsky）教授。先后于麻省理工学院、加州大学伯克利分校、香港城市大学、卡内基梅隆大学任教。研究方向主要包括意识图灵机、计算复杂性、自动机理论、算法、归纳推理、密码学、程序结果检查、人机交互证明等。1995年因计算复杂性理论及其在密码系统和程序检验中的应用而获第三十届图灵奖。\n\
    \n我们认为，认知神经科学家伯纳德·巴尔斯（Bernard Baars）和斯坦尼斯拉斯·德阿纳（Stanislas Dehaene）已经理解了“意识”的含义，尽管他们的理论还并不广为人知。我们所做的是把他们的理论翻译成数学语言。我们把认知科学转换成数学，也就是后面案例中会分享的自动机理论。这启发我们去思考大脑是怎样产生诸如疼痛和愉悦等感受的。多年以来，我们一直想知道我们的脑袋里正在发生些什么，为此我们想找到一个合适的模型去解释。\n\
    \n最初的模型认为是有一个小矮人在脑中操控着我们，但这显然不是一个很好的模型，因为我们还需要理解小矮人在脑中的工作机制。第二个模型来自柏拉图的有限状态机，柏拉图认为，当我们出生时，我们的初始状态是知晓世界上所有的语言的，并在生命初期会寻找一个与周围人语言对应的状态，这在我们看来仍然有些牵强。一个比上述两者都要好的模型是图灵机，它拥有眼睛、耳朵，还增添了胳膊和腿。但这仍然不尽如人意，因为它不能让我们洞悉到意识。最终我们找到了巴尔斯的“全局工作空间模型”—意识剧院模型。我们做出的贡献是用数学语言精确地描述了这个全局工作空间模型。\n\
    \n巴尔斯将意识觉察比喻成剧院，意识则是演员在短时记忆（STM）的舞台上进行的活动，演员的表演被一大批坐在暗处的、代表长时记忆（LTM）中的无意识处理器的观众所观察。它的原理是这样的：你在参加一个聚会，看到一位女士，她叫什么名字？你在想她的名字但是没能马上想起来，你回想起你们初次见面的情景，这个信息从短时记忆中被广播出来，并传播到各个长时记忆处理器上，其中一个处理器想起了她的职业，于是进入意识中，然后被广播到各个处理器；另一个处理器说她的名字是T开头的，这个信息也被广播开来。于是，半小时后，当你没有继续思考这件事时，她的名字从一直在思考和搜索的无意识长时记忆处理器中来到了“舞台”上。然而舞台上有意识的自我是不知道她的名字是怎样想起来的，有意识自我对无意识自我的工作是不知情的。这是伯纳德·巴尔斯的意识模型，是个可爱的模型，输入从左边进来，输出从右边出去，舞台在中间，叫作工作存储器。输入进入工作处理器，然后被输出，舞台上发生的事由中央执行功能控制，就像一个舞台管理者。底部是长时记忆处理器，负责所有繁重工作。\n\
    \n![](images/txt010_2.jpg \"pagenumber_ebook=69,pagenumber_book=53\")\n\n伯纳德·巴尔斯的意识模型\n\
    \n我们的模型与巴尔斯的模型有所不同。在我们的模型中，顶部没有舞台管理者，输入不进入短时记忆转而进入处理器。它们穿过其他处理器后输出，不需要经过短时记忆，但是处理器中的信息可以通过竞争来决定哪个处理器可以把信息传入短时记忆，这个过程会花费一些时间，所以你有时会在一项工作完成后才意识到它。\n\
    \n意识图灵机（CTM）是一个七元组，短时记忆在中间，长时记忆在底部，蓝色沿树向下由短时记忆触发，称之为广播；沿树向上直到顶部的灰色的竞争树。当意识图灵机刚诞生时，处理器之间是没有连接的。但是当两个处理器通过短时记忆互相交流时，且这种交流足够多，那么处理器之间就会产生连接，继而就不一定要通过短时记忆交流了。通过这种方式，最初的有意识就变成了无意识。\n\
    \n![](images/txt010_3.jpg \"pagenumber_ebook=70,pagenumber_book=54\")\n\n意识图灵机的机制\n\
    \n沿树上下移动的叫作数据块，这是一个五元组，它包含地址（address），即生成数据块的处理器。主旨（gist）只是一个语句，或者最多由两个断句描述的高层级信息。例如你想背诵字母表，比如语句“ABC”，当你开始背诵时，“ABC”就会引出下一个语句“DEF”以及接下来的其他字母。与数据块相关的权重（weight）包括正权和负权，会在读取短时记忆时体现其重要性。数据块还包括强度（intensity）和情绪值（mood）。\n\
    \n我先解释一下当数据块达到最顶端时代表什么。在短时记忆中，权重即为主旨的初始权重，强度是所有长时记忆处理器权重的绝对值之和，情绪值是权重的和，没有绝对值。这组成了一个数据块。\n\
    \n![](images/txt010_4.jpg \"pagenumber_ebook=71,pagenumber_book=55\")\n\n意识图灵机的机制\n\
    \n我们能意识到短时记忆里的东西，不多也不少。在意识图灵机中，所有繁重工作都是由处理器完成的，它们在长时记忆中无意识地运作。假设意识图灵机确实是描述人类意识的合适模型，那么我们只能意识到长时记忆处理器传入短时记忆的主旨。你意识到的“主旨”是什么？它一定是以下几种之一：最典型的是内在声音，你能听到强调你想法的内在声音；内在图像，可能是一张地图或一个梦境；还有感觉、感受等。意识图灵机的意识被定义为所有长时记忆处理器对短时记忆内容的觉察，但这个定义仍没有回答一个问题：是什么让我们感受到意识？\n\
    \n我们的回答是，所有长时记忆处理器都知道短时记忆的内容，一些长时记忆处理器专门负责意识，由于它们在长时记忆中，它们会知道短时记忆的内容：内在语言处理器把短时记忆的大脑语言翻译成外部世界所能听到的语言；内在视觉处理器将所有短时记忆的大脑图像翻译成外部世界所能看得到的图像，你在梦境中能见到它的样子；第三个能够引发意识的是从短时记忆广播而来的内部和外部感知，无论是梦境中还是现实中，所有意识图灵机能意识到的信息都来自短时记忆。这些感知从短时记忆广播出去被所有长时记忆处理器接收，使得梦境中的内在画面和真实世界的外在画面变得难以分辨。\n\
    \n意识能为图灵机带来什么？通过从短时记忆广播，意识使得长时记忆处理器专注于生成对真实环境的当前最佳解释，并会持续地验证这个解释，帮助意识图灵机解决一致性问题（比如内克尔立方体）。它能对意识图灵机认为值得关注的问题、想法或思考保持关注。它给了意识图灵机解决预期外问题的能力，即用现有工具应对复杂的真实世界。\n\
    \n现在我们还面对一个大问题：意识图灵机是否能感觉到自身拥有意识？我们认为能，但是我们该怎样证明意识图灵机感受到了意识？其实没有这个必要去证明。我们对意识定义的合理性完全取决于它对于意识能做出的解释、意识图灵机能简洁而自然地解释多少概念、这些解释是否符合我们直觉上对意识的理解，以及意识图灵机能对设计者预期外的场景做出怎样的回应。\n\
    \n意识图灵机能意识到什么？短时记忆内容，从定义来看，这就是它的定义；短时记忆中的数据块是什么？它是一个指向长时记忆中位置的指针；为什么短时记忆容量这么小？为了保证所有长时记忆处理器注意到同一个被意识到的想法，我们可以给出更多这样的例子；长时记忆处理器如何决定权重的符号？对婴儿来说，饥饿和疼痛是负值，食物和爱是正值，这些符号是天生的，在后来的人生中如果一个主旨的符号不明确，那么意识图灵机会将其设置为当时情绪对应的符号。但不能仅仅依据疼痛是负值而快乐是正值就得出意识图灵机能感受疼痛和快乐的结论，那么，是什么让意识图灵机真正感受到疼痛和快乐？\n\
    \n这需要我们思考简单问题和意识难题。简单问题就是让机器人模拟感觉，比如疼痛和快乐；意识难题是让机器人体验感觉，比如疼痛和快乐。但是，首先我们需要把模拟和体验区分开来。例如，在一种名为“无痛症”的疾病中，患者知道他应该有痛的感觉，但却感受不到痛苦。由脑震荡引发“无痛症”的成年人知道什么是疼痛，声称他们能有痛感，但是说“没关系”，“他们说疼痛仍然存在，只是不再困扰他们了”。我们设计的机器人就是“无痛症”，我们知道怎样让机器人看起来像在承受疼痛，但是我们不知道如何让机器人感受疼痛。\n\
    \n我们提出了3个建议来解释极度疼痛。第一个是广播，极度疼痛是一个演员（数据块），它占据了整个舞台（短时记忆），它阻止其他演员登上舞台。有且只有疼痛信息能被广播，每个处理器才能知道疼痛。在极端情况下，除了痛苦，没有任何信息能进入短时记忆。这里有些证据表明，在导致极大痛苦的情况下，普通人不能保持思考而“无痛症”的人能正常思考。由史密斯（Smith）和艾尔斯（Ayres）发表在教育心理学综述上的文章《持续疼痛对短时记忆和学习的影响》中提到，持续经历低程度疼痛6个月或以上的参与者在各种测试中的表现比无疼痛参与者明显差。尽管广播能够解释部分疼痛，但仍不能解释突发的剧痛，比如韧带撕裂。这该怎么解释呢？\n\
    \n第二个是中断。突发的剧痛，当手指触碰一个点着的炉子时，所有无意识处理器都被中断了。中断（与广播有所不同）告知所有长时记忆处理器停止手头的工作，迫使它们把全部注意力集中到引发中断的事件上。这与广播不同，广播把信息发送给处理器但并不强迫它们停止当前的工作。\n\
    \n最后，我们对痛苦的第三个解释是恶性循环。疼痛导致恐惧，恐惧导致疼痛，这是许多可能可以把注意力保持在疼痛上的循环之一。\n\n这是一个奥利弗·萨克斯（Oliver\
    \ Sacks）和公牛的例子。\n\n![](images/txt010_5.jpg \"pagenumber_ebook=74,pagenumber_book=58\"\
    )\n\n奥利弗·萨克斯和公牛\n\n这是许多呈现疼痛的循环图之一，恐惧向左进入愤怒、焦虑等。\n\n有关意识图灵机，还有一些问题：意识需要哪些长时记忆处理器？不需要哪些长时记忆处理器？\n\
    \n大多数长时记忆处理器是不被意识所需要的，比如：视觉和听觉处理器【海伦·凯勒（Hellen Keller）失去了视觉和听觉，但仍然是有意识的】；面部识别处理器（如果你患有脸盲症，会失去辨认人脸的能力，无法认出自己的家人，无法认出镜子里的自己，但你仍然是有意识的）；危险警告处理器（患者S.M.的杏仁核钙化了，她感觉不到恐惧，从没感受过任何恐惧，但她仍是有意识的）；计划和教养处理器【菲尼亚斯·盖奇（Phineas\
    \ Gage）失去整个前额叶，他的整个人格发生了变化，但是在他后来的人生中他在智利驾驶公共马车，六匹马拉动的公共马车在长达77英里的路途来回可不是一项简单任务】；陈述性记忆处理器（患者H.M.在失去海马体后丧失了建立永久记忆的能力，但是他仍可以建立程序性记忆）；程序性记忆处理器（患者W.O.失去了建立陈述性记忆和程序性记忆的能力，是一个只有90分钟记忆的人）。\n\
