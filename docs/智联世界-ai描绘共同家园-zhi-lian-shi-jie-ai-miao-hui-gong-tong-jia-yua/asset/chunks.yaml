    \ 引言\n\n从2017年开始，上海就在人工智能领域出台了一系列中长期的规划，并逐步凝聚起了浓郁的产业发展氛围。而现在，人工智能又成为新基建的轴心，从而为中国经济创造新的红利。\n\
    \n## 人工智能与数字新基建\n\n### 姚志强\n\n新基建是我们从信息化到智慧化、智能化的必要转型步骤。如果说人工智能是大脑，那么硬件基础就相当于身体。我们不仅需要聪明的大脑，也要有强健的身体。\n\
    \n身体传回来的数据要聪明的大脑去分析，去做出决策；分析的结果和决策又会返回实际应用场景与实时数据相结合。所以我们既需要人工智能，也需要数字基础设施。\n\n\
    ### 周剑\n\n几年前，人工智能还没有到达切实可行的阶段。但随着人工智能技术的发展，包括数据积累、算力提升等，人工智能将对社会发展起到核心驱动的作用。新基建的含义也会从之前的“铁公基”转变为更多的技术驱动的基础设施建设。\n\
    \n在这次疫情中，我们发现智能机器人是人工智能最好的载体。未来机器人还将更多地在智慧医疗、智慧教育、智慧驾驶等场景中全面地改变社会运转的结构，让社会发展越来越高效。\n\
    \n### 郑庆生\n\n中国的互联网已经走过了20个年头，支付、消费、娱乐都已经实现了大规模在线化，这积累了大量数据资源，让整个社会的互联网节点变得非常丰富，也为下一步的数字智能或人工智能提供了一个非常好的基础。\n\
    \n同时，中国的发展是很有特色的。中国的数字化、在线化、云端化、智能化是一个全价值链的过程，和欧美发达国家不同的是，中国既有巨大的市场，又是世界的工厂，所以基本上做到了从设计营销到生产物流的全覆盖，可以形成全链路数字化闭环。在全链路的闭环里面，通过数据化，每一个环节都有人工智能的巨大机会，有非常广阔的天地。\n\
    \n### 陈海波\n\n20年的互联网发展使中国成为互联网大国，也成为数据大国，为中国成为人工智能大国奠定了基础。目前深度学习是人工智能的主要阶段，数据是粮食，算法是工具，算力是基础，新基建将为我们夯实多种基础。\n\
    \n### 吴明辉\n\n新基建是各方都需要参与的事情，不仅是国家层面，也包括在企业内部去推动基础设施建设，并在这个基础上推动更广泛的经济增长。整个社会是由物质、能量、信息三大核心要素构成的，老基建的作用是促进物质和能量的运输和流通，而人工智能关乎的是信息，其中数据中心就是人工智能的基础设施。比如，我们为上海地铁搭建的智能运维平台和数据共享平台可以提升地铁运营效率，降低成本；为电力系统搭建的数据中台可以做到电网智慧调度。未来还会有更多基于此的应用出现。\n\
    \n### 夏华夏\n\n我们认为人工智能就是一种基础设施，会是未来生活中必不可少的技术。我们提供智能餐厅解决方案帮助商家更高效地运营，我们打造无人酒店，让用户可以刷脸入住，指纹开锁，从而提供更好的入住体验。为了帮助外卖小哥改善工作环境，我们正在开发无人机和无人车的配送，让小哥不需要在路上奔波，而只是解决最后100米的配送问题。我们做人工智能应用是基于一个个真实的生活场景，我们也相信`AI`会成为未来生活的基础设施。国家大力推动的新基建对人工智能行业也有很大帮助。`5G`、芯片、物联网、数据中心等项目的建设将进一步完善人工智能生态，并对行业起到推动作用。\n\
    \n## 人工智能发展的机遇与路径\n\n### 周剑\n\n目前人工智能还处于比较初级的阶段，到通用智能还有很长的路要走。所以我们现在强调的是在可控环境下，在一些垂直领域的细分场景去深入发展。\n\
    \n优必选科技一直聚焦在人形机器人。为什么是人形机器人？轮式的、履带式的或四足的机器人是否也能实现我们需要的功能？如果你看过《西部世界》，一定会喜欢这部剧中的人形机器人，这就是我们的目标，可能需要50～100年才能实现。\n\
    \n但这件事总得有人去做。\n\n优必选科技目前在努力降低大型人形机器人的成本。我们认为只要这样的机器人价格降低到一定程度，比如说几十万元，和一台中高档汽车的价格类似，那么它们就能进入家庭，从而形成机器人行业一个垂直领域的应用场景。我一直强调，不能只看现在的技术，而是要思考人类未来到底需要什么样的产品。如果未来需要人形机器人，那么优必选科技就会一直走在这条路上。发展硬科技必须有耐心以及坚持长期投资的理念，我们希望为中国做一些与众不同的东西。依托中国强大的制造业和供应链基础，我们希望用得起的人形机器人能够在中国的供应链上被第一个造出来，能够实现商用或者家用，这是我们最自豪的事情。在实现这个目标的过程中，我们的很多技术可以“沿途下蛋”，比如我们可以做最美的新基建—人工智能教育，以及商业服务、安防巡检、养老等方面的一些智能机器人。\n\
    \n### 陈海波\n\n如果中国要在第四次工业革命中处于领导者地位，需要解决两个问题。第一，基础研究要领先世界；第二，要完成从工业大国到工业强国的转变。在此期间，技术推动是主旋律，而人工智能在工业智能化方面是主力军。\n\
    \n智能制造能在很大程度上帮助人工智能企业商业落地，帮助人工智能企业针对市场需求打造产品。人工智能企业要认识到技术是用以赋能各行各业的，人工智能技术只有与场景结合才能产生作用。真正的人工智能企业应该从“软”做到“硬”，基础研究和应用开发都强，才能够符合未来市场和社会对人工智能的期望。\n\
    \n### 吴明辉\n\n在人工智能时代，科技创新企业应走出差异化的道路，选好细分市场和不同赛道。我认为，未来每一个人工智能细分领域只有第一名可以取得成功，因为其能力是可以复制的，而其他的竞争者将是没有前途的。中国有最为广泛的人工智能应用场景，企业应选好自己的细分市场。\n\
    \n### 夏华夏\n\n我们真正的目标是用科技，特别是人工智能帮助提供本地生活服务的商家提高效率，帮助用户得到更好的服务，最终让人工智能成为生活的一个基础设施。未来五六年，我们一个重要的任务是帮助那些不会用互联网的人使用我们的服务，包括很多老人和小孩。用图像识别帮助中小餐馆老板录入菜单和管理订单，利用语音交互、视觉理解等人工智能相关技术实现无人配送，都是未来几年我们要做的事情。\n\
    \n### 郑庆生\n\n对于投资人来说，无论多好的技术都需要找到商业变现的场景。企业有一个长远的定位，但每一步都需要找到细分的场景去实现，这是投资人非常希望看到的。\n"
  trans: "\n# 人工智能芯片：新的一页\n\n**陆永青**  \n帝国理工学院教授，鲲云科技联合创始人兼首席科学家\n\n![](img/txt021_1.jpg\
    \ \"pagenumber_ebook=168,pagenumber_book=152\")\n\n英国帝国理工学院教授，英国皇家工程院院士，电气和电子工程师协会（`IEEE`）、英国计算机学会（`BCS`）会士，中国人工智能产业创新联盟专业委员会主任委员及鲲云科技联合创始人兼首席科学家，鲲云人工智能应用创新研究院院长。`ACM\
    \ TRETS`创刊主编，定制计算领域学术会议`FPT`、`FPL`创始人，`ASAP`、`FCCM`、`FPL`、`FPT`、`HEART`学术会议指导委员会委员，曾任英国皇家工程院杰出访问学者评选委员会委员。作为可重构计算及现场可编程技术领域的国际知名学者，在国际学术期刊和国际学术会议上发表\
    \ 500 余篇论文，获得国际专利 2 项，出版学术著作 3 部。\n\n## 高性能计算趋势回顾\n\n在开始讨论芯片之前，我首先谈一谈这 10 年来的高性能计算趋势。大家可能看过全球前\
    \ 500 名最快的超级计算机列表。2008 年 11 月，日本的一个基于`GPU`（图形处理器）的超级计算机首次进入了 500 强，排名第三十。到了 2010\
    \ 年 6 月，基于`GPU`的超级计算机“星云”（中国的一款超级计算机）排名第二。10 年之后的今天，也就是 2020 年的 6 月，我们发现在前 10\
    \ 名超级计算机中，基于`GPU`的占 6 名。\n\n## GPU 核心功能\n\n什么是`GPU`？`GPU`有两个核心功能：第一，它包含数以千计的处理核并行计算。也就是说，一个`GPU`可以支持大规模的并行处理。图\
    \ 1 是图灵`GPU`，每个绿色的部分又包含很多处理核。`GPU`的第二个核心功能是它支持单指令流、多重数据流（`SIMD`）。\n\n![](img/txt021_2.jpg\
    \ \"pagenumber_ebook=169,pagenumber_book=153\")\n\n**图 1　 图灵 GPU**\n\n## CPU 与\
    \ GPU 架构对比\n\n我们先看一看图 2 左边的`CPU`。我们可以看到它包含单指令流、单数据流（`SISD`）。图 2 右边的`GPU`也是单指令流，但它有单指令多重数据架构，可以处理多重数据流。正是因为`GPU`的数据流可以分享单一指令流，它的效率能比`CPU`更高。\n\
    \n![](img/txt021_3.jpg \"pagenumber_ebook=170,pagenumber_book=154\")\n\n**图 2　\
    \ GPU 计算架构**\n\n## GPU 与 CPU 性能比较\n\n我们比较一下`GPU`和`CPU`的性能。从图 3 中可以看到对于单一精度和多精度浮点操作来说，`GPU`都比`CPU`有更高的性能。\n\
    \n![](img/txt021_4.jpg \"pagenumber_ebook=171,pagenumber_book=155\")\n\n**图 3　\
    \ GPU/CPU 性能比较**\n\n## 芯片利用效率分析\n\n`GPU`如此强大，还有进步的空间吗？我们来看一看人工智能的基准测试程序中有关芯片利用效率这个指标（图\
    \ 4）。其实`GPU`的芯片利用率并不高，甚至低到了 7.52%。芯片利用效率衡量的是芯片的算力性价比。芯片实测性能是用户得到的价值，峰值性能基于芯片的尺寸和技术，反映芯片的成本。芯片利用效率等于芯片实测性能除以芯片峰值性能。\n\
    \n![](img/txt021_5.jpg \"pagenumber_ebook=171,pagenumber_book=155\")\n\n**图 4　\
    \ 芯片利用效率**\n\n也就是说，对于一个给定的峰值性能，芯片利用效率越高，芯片实测性能就越高，用户得到的效果就越好。\n\n## 定制数据流计算架构\n\
    \n那么如何改进芯片利用效率呢？过去的几年中，我们研制了一个新的架构，叫作定制数据流计算架构。和图 5 左边的一个指令流、多重数据流的`GPU`相比，图 5\
    \ 右边的定制处理器也可以处理多重数据流，但它不需要指令流，所以它能比`GPU`更加有效。\n\n![](img/txt021_6.jpg \"pagenumber_ebook=172,pagenumber_book=156\"\
    )\n\n**图 5　 定制数据流计算架构**\n\n### 定制处理器的灵活性实现\n\n`GPU`的指令让`GPU`更灵活。定制处理器没有指令，如何实现灵活性呢？在定制处理器中，有一个数据流配置器，这个数据流配置器可以用于动态重组定制处理器，让它尽可能地灵活，就像`CPU`和`GPU`一样。\n\
    \n## CAISA 3.0 芯片架构与应用\n\n这种架构现在已经被投入实践应用中。在图 6 的定制人工智能数据流的芯片架构`CAISA3.0`中我们可以看到，这个架构和`GPU`一样包含多个定制处理器，它们可以并行运作以支持大规模的并行计算。在每个定制处理器中都有多重配置器，旨在保证灵活性。就像`GPU`和`CPU`可以提供的灵活性一样，全局的缓冲结构中也包含了这种配置器，使这个架构更加灵活。\n\
    \n![](img/txt021_7.jpg \"pagenumber_ebook=173,pagenumber_book=157\")\n\n**图 6　\
    \ 芯片架构 CAISA3.0**\n\n`CAISA3.0`架构的芯片采用了 28 纳米的工艺，已经被应用于第一代先进的数据流芯片中，可以支持边缘和云端`AI`推理。图灵`GPU`的芯片利用效率可以低至只有\
    \ 8%，而`CAISA3.0`芯片利用率可以高达 95.4%，是一个巨大的飞跃。它的峰值算力是 10.9 `TOPS`，可以在-40～125℃之间正常工作。这个`CAISA`芯片现在已经被应用于星空加速卡`X3`，可以支持边缘计算平台及云计算平台。该芯片还被用于星空加速卡`X9`，主要是用于云计算。\n\
    \n## 基准测试数据对比\n\n接下来我们看一些基准数据，比较一下`X9`和`GPU`。\n\n### 延时对比\n\n首先我们看延时。延时就是响应一个外部输入的时间，所以延时越低越好。从图\
    \ 7 中我们可以看到，`CAISA`芯片的延时比图灵`GPU`要好 30 倍，在不同的`AI`基准中，我们都可以看得到这种优势。\n\n![](img/txt021_8.jpg\
    \ \"pagenumber_ebook=174,pagenumber_book=158\")\n\n**图 7　 X9 和 GPU 基准数据—延时对比**\n\
    \n### 芯片利用率对比\n\n然后再看看图 8 的芯片利用率。在不同的`AI`基准中，我们看到`CAISA`芯片在`X9`加速卡中，它的芯片利用率比`GPU`要高\
    \ 11 倍。\n\n![](img/txt021_9.jpg \"pagenumber_ebook=174,pagenumber_book=158\")\n\
    \n**图 8　 X9 和 GPU 基准数据—芯片利用率对比**\n\n### 性能对比\n\n再看一看性能。从图 9 中我们可以看到，`CAISA`芯片在`X9`加速卡中能够达到的`FPS`（画面每秒传输帧数）性能是图灵`GPU`的\
    \ 3.91 倍。\n\n![](img/txt021_10.jpg \"pagenumber_ebook=175,pagenumber_book=159\"\
    )\n\n**图 9　 X9 和 GPU 基准数据—性能对比**\n\n## 实际应用案例：视频分析\n\n这是什么意思？我们举一个例子说明：处理分析 25000\
    \ 路视频数据。在此案例中，如果我们使用包含`GPU`加速卡的服务器，我们需要 100 台服务器，每一个服务器包含 8 张`GPU`加速卡，以支持每一个 250\
    \ 路的视频分析。如果把性能提升到 3.91 倍，这就意味着每一个服务器不是仅能支持 250 路视频，而是可以支持 977 路视频，这时就不需要 100 台服务器，而只需要\
    \ 26 台服务器，每个服务器上采用 8 张`X9`加速卡。这个`X9`加速卡就是采用了我们刚才讲到的`CAISA3.0`版本的芯片。\n\n## 落地应用与开发生态\n\
    \n这个用于加速卡的`CAISA`芯片架构现在已经落地于一系列广泛的领域，包括智能制造、智慧城市、安监生产、轨道交通、智能遥感等。为了能够让应用程序的开发简便易用，我们研制了一个端到端的应用程序开发模型。这个始于深度学习的模型，可以自动产生`CAISA`架构上的适合应用程序，应用于有关的硬件平台。\n\
    \n也就是说，开发应用程序的人，不需要成为一个`AI`芯片的专家。他甚至不需要了解`CAISA`架构，就可以利用它的好处。这个模型支持广泛的深度学习算子，部分如图\
    \ 10 所示。这让算法设计者的工作更加轻松，因为他们只要应用这些算子软件，就可以得益于`CAISA`架构。\n\n![](img/txt021_11.jpg\
    \ \"pagenumber_ebook=176,pagenumber_book=160\")\n\n**图 10　 部分支持算子**\n\n## 总结\n\
    \n因此，这种新的架构让我们掀开了人工智能芯片的新的一页。这种芯片可以带来更高的算力性价比，支持更多的`AI`算法，更便于使用。因为应用开发工具用起来很方便，所以它们会带来更智能的计算平台、系统和应用，它们可以被更快地落地部署。\n\
    \n希望新的`CAISA`芯片可以让我们受益于最先进的技术进展，让所有人的生活更美好。\n\n---\n\n# 人工智能与新基建\n\n## 嘉宾介绍\n\n\
