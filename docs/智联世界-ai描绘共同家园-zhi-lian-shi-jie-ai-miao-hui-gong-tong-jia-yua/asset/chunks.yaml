    ## VI. Multi-level Activities Link "Global Brains", Promoting Exchange and Connectivity


    Targeting top experts, the Strategic Consultation Expert Meeting was held to discuss
    major issues on global open cooperation in AI and basic capacity building. Targeting
    entrepreneurs, the "AI Night Talk" was planned, with government and enterprises
    on the same stage for in-depth dialogue focusing on AI new infrastructure. Targeting
    investors, the "Shanghai AI Living Room" was built, setting up an online "Investment
    Club", with over 100 international innovative projects pitching online. Targeting
    international talents, a cloud recruitment platform was created, with globally
    renowned tech companies posting 550 job positions. Targeting developers, the Developer
    Day activities were fully upgraded, setting up events such as Developer Demo Day.
    Targeting young audiences such as the post-90s and post-00s, the MV "Smart Home"
    (智联家园), the world''s first AI-composed and performed by 4 virtual idols, was launched,
    winning widespread acclaim.


    The World Artificial Intelligence Conference has been successfully held for 3
    sessions. Since the 3 sessions, Shanghai''s AI "circle of friends" has continued
    to expand, with over 20 innovation platforms unveiled and launched, nearly 100
    projects signed and settled, high-end talents continuously gathering, initially
    building a high ground for AI development. Looking to the future, Shanghai will
    resolutely implement the strategic deployment of the CPC Central Committee and
    the State Council, earnestly summarize the experience of hosting the conference,
    continue to strengthen the conference''s role as a "linking platform", and make
    every effort to build the "Four Major Platforms" of AI, making greater contributions
    to the healthy development of China''s new generation of AI.


