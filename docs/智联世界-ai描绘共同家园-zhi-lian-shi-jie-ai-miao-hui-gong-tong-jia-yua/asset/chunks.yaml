    \ RDS、Amazon S3、Amazon’s Paxosbased lock service等。与沃纳·威格尔（Werner Vogels）先生合著的Amazon\
    \ Dynamo论文（http：//bit.ly/1mDs0Yh）荣获“美国计算机协会名人堂大奖”。Amazon Dynamo现已成为诸多NoSQL系统的基石。\n\
    \n![](images/txt028_2.jpg \"pagenumber_ebook=219,pagenumber_book=203\")\n\n我们生活在人工智能和机器学习的黄金时代，这是一个一切皆有可能的时代。很多意见领袖说机器学习就是未来，但它早已不仅是未来，机器学习正在对各个地区、各行各业产生重要影响，几乎彻底改变了我们生活和工作的方方面面。机器学习有潜力帮助我们应对那些人类社会面临的最为严峻的挑战，但我们需要找到正确使用这一工具的方法。\n\
    \n机器学习已从一项人们渴望的技术，迅速发展成为一项主流技术。在过去很长一段时间中，机器学习仅是极少数科技公司和核心学术研究人员的专利，直到云计算成为主流，情况开始发生变化。原因是机器学习的数据密集型算法非常消耗计算机资源，而云计算的出现让普通大众都能访问到机器学习所需的计算资源，利用其数据存储能力。现在，从金融业到零售业，从农业到医疗保健行业等，机器学习正被各个行业普遍采用，并从外围深入到业务的核心。\n\
    \n机器学习如何影响客户\n\n曼特尔实验室是一家总部位于英国的农业技术初创公司，业务是向英国境内客户提供其由人工智能驱动的农作物监测解决方案。这项技术的工作原理是通过评估农作物的卫星图像，及早向农户和零售商报告可能出现的问题，以便他们能够更好地调整供应、采购和库存计划。该平台部署了定制的机器学习模型和亚马逊机器学习平台Sage\
    \ Maker，能够基于多颗卫星拍摄到的图像对农作物生长情况进行实时评估。这项重要技术比以往任何时候都更能帮助各种企业、食品杂货连锁店和农民实时评估供应链的状况。\n\
    \n另一个案例是总部位于加拿大的初创公司Blue Dot，该公司的产品是使用机器学习算法预测疾病暴发。Blue Dot监测超过65种语言的新闻，包括动物疾病等的信息，来预测和分析可能出现的疫情。信息会交由流行病学家审查，他们从科学角度验证结论的准确性，然后形成专业意见提供给公共卫生部门的官员和医院。在此次新冠肺炎病毒开始流行时，Blue\
    \ Dot就是最早发出警报的机构之一。\n\n初创公司Giant是一家中国的休闲游戏开发商。他们关注如何利用机器学习来完成用户留存和提高盈利水平等目标。该公司在Sage\
    \ Maker上构建各种机器学习模型，并持续在亚马逊云服务（AWS）和游戏平台上获得新的收入来源。\n\n找到合适的问题并建立科学的组织架构\n\n在从事了10年机器学习相关工作，并与许多经历了机器学习不同发展阶段的客户进行讨论后，我认识到有4个因素能促进机器学习得到成功采用。首先是数据，当谈到真正的机器学习时，数据整理是需要做的第一个工作；其次是对于机器学习如何应用的理解；再次是解决人才缺乏的问题，从而打破技术限制；最后是不要进行无差别的繁重工作（如每个机构都去建立自有的机器学习基础设施）。\n\
    \n为机器学习寻找适当的场景，其实就是为机器学习找到正确对应的问题，通常我们会进行3个维度的评估。首先是数据的准备是否妥当；其次是这个问题对于业务的影响程度，也就是问题解决的必要性；最后是评估机器学习在这个问题上的适用性，也可以说是评估当前的技术水平是否足以解决该问题。一个理想的情况是，选择的问题对业务影响很大，同样有足够的数据资源，并且最先进的机器学习算法也能适用，那么这个问题的解决就能对整体业务带来重大且有意义的推动。\n\
    \n在采用机器学习的过程中，设定适合的组织架构同样重要。机构通常会聘请管理人员和技术专家组成一个核心团队，这种类型的团队虽然能做出一些成果，却与行业专家和机构中的其他人缺少联系，从而让看上去不错的机器学习模型并不能适配具体的业务问题。更为理想的状况是组建一个包括技术专家、行业专家和业务人员的综合团队，这样才更有可能在机器学习应用方面取得有意义的进展。\n\
    \n雇用了最优秀的人才、选择了正确问题，甚至正确制定了数据策略后，许多机构会去建立“无差别的基础设施”，这需要支付很大的成本并且浪费了时间。我一直建议这些组织不要再做无差别的繁重工作，因为善用外部服务可以更有效地解决这个问题。比如使用如Sage\
    \ Maker之类的工具，可以更好地构建、训练、优化和部署机器学习模型并加快项目的进展。这就是AWS的使命所在：为每位开发人员、数据科学家和研究人员提供工具。\n\
