- raw: "这个阶段又可以细分为两个子阶段。在前半段，人工智能的发展主要围绕通用能力的开发和作为一种资源的AI能力的平台化，以及在智能搜索和信息流推荐这两个标志性行业的应用；在后半段，人工智能开始全面的产业化，也就是行业应用与商业化的全面普及。\n\
    \n第三个阶段是社会的智能化。人工智能将从经济领域渗透到广泛的社会领域，全社会和全球范围内的智能协作与制度创新将是这个阶段的主要特征。最终这种协作和变革又会对经济产生更深远的影响，人类将真正进入智能社会。\n\
    \n目前，我们正处于从经济智能化的前半段向后半段过渡的时期。经过前半段的发展，在全球范围内已经出现了少数几家通用AI平台和一些专注于某个垂直行业的细分AI平台。在信息搜索、信息流推荐、无人驾驶这几个垂直行业，人工智能已经证明，或初步证明了其对所在行业的颠覆和重构潜能。\n\
    \n比如，百度从一开始就专注于搜索引擎这一迄今为止人工智能规模最大的应用场景；10年前，百度开始将通用AI能力的开发和平台化作为一个重要战略；几年前，百度开始在无人驾驶和智能交通这一垂直行业发力。\n\
    \n20世纪90年代，美国通过“信息高速公路”计划，大大扩充了互联网的基础设施，从而将人类带入了互联网时代。今天，中国正在积极推进的“新基建”可以被视为人类在进入智能经济和智能社会前最大的基础设施扩张工程，它有很大的希望会在中国率先掀起全面人工智能化的潮流。\n\
    \n作为将自己定位于专注对外赋能的AI平台型公司，百度希望每一家企业不管规模多小，都可以像用水和用电一样使用我们的平台能力和服务能力，从而快速实现AI化转型，最终这又会使每一个普通消费者受益。这种定位也可以让我们避免与生态伙伴竞争，并始终将开放作为一项基本原则，从而专心致志扮演好AI赋能者的角色。\n\
    \n但目前人工智能所处的阶段，也是一个容易产生迷茫甚至悲观的阶段，这是大多数颠覆性技术在加速普及之前的必经阶段。这就像互联网在2000年后的几年里经历的那样，一些公司消失了，一些人永远离开了这个行业。我还记得当时一些海归甚至因为失去信心而离开，因为百度也是从那个低谷期爬出来的，我对此记忆犹新。但是，当迷雾消散时，一个经济和社会全面互联网化的时代开始了，熬过寒冬的小人物们成为新的英雄。\n\
    \n无论是当年我对互联网的信仰，还是今天我对AI的信仰，都没有一丝丝改变。我仍然认为AI是堪比工业革命的大浪潮，它一定会彻底改变我们今天的每一个行业。这次疫情会成为一个契机，它让人们产生了掌控命运的紧迫感，同时也让我们看到人工智能不再遥远，而是就在我们身边。人工智能延长了我们的双手，强大了我们的大脑，丰富了我们的视觉，消除了时空的障碍。\n\
    \n迷雾终将散去，智能经济和智能社会终将成为现实，人类也终将掌握自己的命运。\n\n\uFEFF\n\n机器人学及计算机视觉\n\n马歇尔·赫伯特（Martial\
    \ Hebert）\n\n卡内基梅隆大学计算机科学院教授、院长\n\n![](images/txt019_1.jpg \"pagenumber_ebook=152,pagenumber_book=136\"\
    )\n\n计算机视觉和机器人学领域的领先研究者，卡内基梅隆大学（CMU）计算机学院院长。在巴黎大学获得了计算机科学博士学位。1984年加入世界上最大的机器人教育和研究机构机器人研究所（Robotics\
    \ Institute）。在加入CMU教员后，成了Autonomous Land Vehicles项目的一员，为自动驾驶技术研究奠定了基础。研究领域集中于计算机视觉，包括环境感知建模、高效识别技术、三维场景重建和解读、三维信号处理、视频分析以及动力学系统的检测跟踪与识别等。\n\
    \n在过去几年中，我们见证了计算机创新领域的巨大进步，尤其是在计算机视觉领域引入的深度学习。今天，我们就来谈谈将上述计算机创新能力迁移到机器人系统以及自主系统时所面临的挑战。例如，我们机器人研究所与工业界联合开发的全自动驾驶汽车已经正常运行多年，该系统需要满足高鲁棒性感知才能够正常工作；另一个例子是高速移动的无人机，它要求系统在复杂环境中仅用有限的计算资源就要达到高鲁棒性感知。\n\
    \n那么，哪些关键问题是我们必须解决的呢？首先，需要使用有限数据来训练与其他AI应用场景不同的系统；其次，视觉系统中的任何失败、失灵和错误都会导致系统不可逆的失败；同时我们要处理的是非常复杂的动态环境，例如自动驾驶环境；除此之外，还需要解决系统计算资源有限的问题，以及做出实时决策。接下来，我将就上述4个问题展开论述。\n\
    \n第一，监督式学习模型。传统的学习方法通过大量的数据、标签数据、受监督数据来生成模型，例如分类、检测以及仿真模型—此类学习方法需要大型监督数据模型，并且不需要对系统有任何先验知识。然而，在机器人系统中，我们可能无法，或者很难获得大量监督数据，但是我们可以获取大量数据和经验来帮助我们学习这些模型。由此想到，我们能否对视觉任务进行离线训练？\n\
    \n这可以采用元数据学习的方法—学习如何进行学习。这基本上可以理解为，为了新任务，如何从先验知识中学习新模型，即在没有足够数据的情况下构建一个有效的计算机视觉模型。非常重要的一点是，当我们思考结构化视觉世界时，不是仅仅在数据和特征空间中去思考，而是要直接在任务和模型空间中进行思考。\n\
    \n![](images/txt019_2.jpg \"pagenumber_ebook=154,pagenumber_book=138\")\n\n试想你面对一个分类问题，你可以将每个分类器想象成模型空间中的独立模型，它们都存在于受到视觉任务框架严格约束的高维度空间。那么问题就变成了，我们是否可以使用这样的模型空间结构来促进学习，尤其是基于少量样本进行学习、用有限数据更加动态化地学习。\n\
    \n举一个例子，假设你可以获取一些用于学习模型的有限样本，比如用于观察分类的一个简单样本，这是在某个任务或分类器中从单一样本中学习到的。现在的问题是，我们如何基于多个样本生成我们想要的模型。事实上我们可以考虑转化—把从有限样本中学习到的模型转化成通过大量样本学习到的模型，我们只有搞清楚这种转化，才能够更好地从有限样本中学习，这也是整个视觉系统中，尤其是机器人学视觉系统中面临的主要障碍，即需要依赖标签数据或者监督数据。\n\
    \n以下这个例子可以用来说明如何落实这个想法。这个分类问题基于400种不同的类别，分别从左至右按照从样本数量最多到样本数量最少显示，这就是刚才提到的通过技术实现性能提升。也就是说，通过左侧拥有大样本的分类来学习转化，并利用这种转化来优化右侧只拥有小样本的分类模型。此处图例表示每个类别性能的提升，我们可以看到右侧小样本类别的性能有了大幅度的提升，而数据量大的这些分类的性能只有小幅提升，甚至没有提升。\n\
    \n![](images/txt019_3.jpg \"pagenumber_ebook=155,pagenumber_book=139\")\n\n这实现了我们想要得到的基本概念，即用易获取数据的视觉概念来帮助学习稀疏数据的视觉概念。这个例子可以用来说明我们可以用最少量数据进行学习，尤其是机器人的应用场景。\n\
    \n第二，计算机视觉系统中的受迫决策问题，特别是从计算机视觉错误中进行恢复。首先，机器人系统中存在从输入层、感知层、解释层，最终到推理和决策层的流程。从感知层输出到解释层是一条直线，即我们总是通过感知层的输出进行决策。问题在于，感知层的输出可能含有噪声，是很混乱的，可能感知层的输出不足以好到让计算机视觉系统做出正确决策。因此，现在的问题就是我们如何在线评估计算机视觉系统的性能，并实时判断我们是否能够根据输出结果进行决策，这就涉及自评、自省、故障检测等。\n\
    \n举一个关于在自动驾驶的环境下语义分割的例子。\n\n![](images/txt019_4.jpg \"pagenumber_ebook=156,pagenumber_book=140\"\
    )\n\n此类系统的问题一般存在于由于不同照明条件而引起的结果变化。那么，现在的问题就变成了在给定照明条件的情况下预测视觉系统的工作性能。我们的基本思路是，根据输入来预测感知系统的性能，并在必要时绕过感知系统，通过减少对感知系统的直接依赖，使得系统运行更具可靠性。为达到这个目的，一个方法是明确表示出输入特征和性能之间的关系；另外一种更好的方法是，找到通过输入直接预测系统性能的特征。\n\
    \n举个例子，针对一个简单的分割任务，系统能够自动预测到：左侧的图像较难进行分割，右侧的图像是较易进行分割的。从输出结果来看，右侧明显性能较好，问题在于如何自动、系统化地做到这一点，能够使我们得到系统性能的全新内部描述。\n\
    \n![](images/txt019_5.jpg \"pagenumber_ebook=157,pagenumber_book=141\")\n\n另一个例子是室外移动机器人，同样的，在这个例子中我们可以发现系统准确地定义了左侧的图像比右侧的图像更难以分割。也就是说，需要预测计算机视觉系统性能的自评，才能够在系统的自主性和规划方面做出更好的决策。\n\
    \n另一个例子，无人机在非结构化环境中飞行。这是飞机系统的几张驾驶的图，在左侧可以看到图像的输入流；左上角是重建的环境近似深度，使用了计算机视觉爱好者比较感兴趣的各种LSD（激光信号装置）标签；右侧可以看到不同轨迹线的评估，带有我们做出应该跟进哪条轨迹线的决策的时间节点，这是基于滚动时域所采用的经典技术。\n\
    \n![](images/txt019_6.jpg \"pagenumber_ebook=158,pagenumber_book=142\")\n\n![](images/txt019_7.jpg\
    \ \"pagenumber_ebook=158,pagenumber_book=142\")\n\n那么，问题来了，如果视觉系统的输入变差，会导致深度估算也变差，继而可能导致系统出现灾难性故障。因此，我们能做的就是如何通过数据学习预测系统的飞行性能，不是考量深度估算的质量，而是考量这些轨迹线是否得到了有效评估。我们可以根据输入数据来预测性能—通过观察到的数据得知为何系统能够飞行。做到这点之后，我们就可以做一些后续工作。在这个例子中，无人机右侧的失效概率很高，所以它就会做出新动作或者寻找新位置来获得更好的视觉输出，这说明我们大幅提高了系统的飞行性能。\n\
    \n这个案例引出了另一个非常有趣的问题，即在将计算机视觉应用到机器人学的过程中，它面临的核心挑战是什么？让我们看下面这些图像，这些是分割系统的输出结果，非常典型的以不同区域为图像标签。显然在这两个输出结果中，上图的输出结果比下图的输出结果更好，下图中房屋前部有很大一片区域标签错误，上图中被正确标注的像素数要比下图更多，这说明对于此类任务而言，误差测量的目的是要尽可能多地正确标注像素。\n\
    \n![](images/txt019_8.jpg \"pagenumber_ebook=159,pagenumber_book=143\")\n\n问题在于，现在没有应用场景要求正确标注图像中的所有像素，这意味着我们使用了错误的目标函数、错误的误差测度，它可能比我们执行任务时所需要的实际最小目标函数的实现难度要大得很多。\n\
    \n回到这个例子上，我们其实可以试着弄清视觉系统重建的3D世界的精度，但实际上这个精度到底是3毫米还是2毫米根本不重要，唯一重要的只是这个任务的完成度。这就是机器人学应用场景下唯一重要的目标，难点在于如何设计一个只关注并且只优化某个特定目标的视觉系统。\n\
    \n第三，系统与动态环境的互动能力。在下面的例子中，我们要对左方的18号目标进行预测，确定这位行人作为研究对象将要往哪一个方向移动。这个问题的挑战在于如何做出动态预测，利用概率函数将研究对象可能做出的决策考虑进来。另外一个难题、也可能是最大的一个难题，就是这个任务不仅要在单个研究对象上实现，还要在多个研究对象上实现，包括单个研究对象与其他研究对象的互动等。\n\
    \n![](images/txt019_9.jpg \"pagenumber_ebook=161,pagenumber_book=145\")\n\n因此我们就会遇到一个博弈论的问题，某个研究对象所做的决策依赖于其他研究对象所做的决策，而其他研究对象所做的决策又依赖于这个研究对象所做的决策。因此这个优化难题是在预测动态工作环境时所面临的主要挑战。\n\
    \n第四，我们只能利用有限的计算资源来实现所有这些工作。举一个例子，我做过一个假设，即在整个计算过程中，将输入信息传输给感知层后才能得到最终解释，但实际上在计算资源非常有限的情况下，我们可能需要视觉系统更早做出决策，也许需要视觉系统更早地输出，或许在计算过程中就得到输出。换句话说，需要视觉系统随时给出解释并输出结果。这个能力现在越来越重要，尤其是考虑到计算资源有限，而且要在有限的确切时间内做出决策，这就是属于经典计算机科学研究领域的一个概念，即“实时机器学习（anytime\
    \ mission learning）”，也可称为“实时预测（anytime prediction）”。实时预测的基本概念是先输出粗略的早期结果，然后随着时间增长不断迭代优化结果—这与经典的机器视觉学习的观点不同。经典观点认为在结果处理的最后才输出单一结果。这就意味着，实时预测的计算过程是可中断的，我们需要在计算期间随时得到输出结果；并随着时间推移，由于计算量的增加得到越来越好的输出结果；最后收益递减，即随着计算量越来越大，结果的改善越来越小。这就是实时预测的定义。\n\
    \n那么我们如何在深度学习中实现实时预测呢？举一个例子，一个典型的深度学习系统的架构，比如在这个网络中有不同的阶段、层以及区块，每个区块都会进行计算，并将计算结果传输给下一个区块，并根据最终的输出结果对整个网络进行优化，最终的输出结果可能是就是最终结果。\n\
    \n![](images/txt019_10.jpg \"pagenumber_ebook=162,pagenumber_book=146\")\n\n现在为了准确地随时得到这样的输出，我们需要得到中间层输出，即不仅要优化最终输出结果也要优化中间层输出值。如何实现这一点是研究面临的挑战，一种可行的方法是得到这些输出量的线性组合。可以看到，较好的方法是在优化过程的每个阶段通过损失的反比得到权重。细节不是特别重要，重要的是机器人系统的概念。我们可能需要考虑为这些学习系统实现更复杂的设计—比如让它们给出即时的中间层输出，这样在计算资源有限的情况下可以随时得到部分结果。\n\
    \n\uFEFF\n\n共建开放生态，使能万物互联的智能世界\n\n陶景文\n\n华为公司董事、首席信息官\n\n![](images/txt020_1.jpg\
    \ \"pagenumber_ebook=163,pagenumber_book=147\")\n\n毕业于北京邮电大学。1996年加入华为，历任产品开发工程师、市场技术处副总经理、国际行销部常务副部长、南部非洲地区部常务副总裁/总裁、全球行销/营销总裁、终端公司总裁、西欧地区部总裁、质量流程IT总裁等职务。\n\
    \n![](images/txt020_2.jpg \"pagenumber_ebook=164,pagenumber_book=148\")\n\n第四次工业革命已经到来，随着5G、AI、产业互联网等技术的不断成熟，以及以5G、数据中心、云等为代表的新一代基础设施的加速建设和推进，技术正在加速第四代工业互联网在万物互联、万物智能，包括企业、行业的数字化转型方面的海量应用。\n\
    \n对人工智能发展的理解和判断\n\n我们认为，第四次工业革命将会影响到行业的方方面面，它不但会改变人们的生活，让人们的生活更智慧、更便捷，也会改变各行各业。随着人工智能，还有数字技术大量的使用，在这个世界上会诞生一个超过12万亿的市场。我们预计到2025年，ICT（信息通信技术）行业和智能制造行业大概分别会有5万亿和6.4万亿的规模。华为2017年发布了公司新的愿景，就是把数字世界带给每个人、每个家庭、每个组织，从而构建万物互联的数字世界。2018年，华为发布了“+智能，见未来”的全栈人工智能战略。2019年，又以“共创智能新高度”展示企业在人工智能方面的战略和推进人工智能行业应用的决心。\n\
    \n华为的人工智能发展经验\n\n华为首先是一个科技创新型公司，拥有两大产业群。第一大产业群是围绕智能手机的电子消费产业群。我们一直在持续构建“1+8+N”的商业生态，希望让每个人、每个家庭的生活更加智能、愉悦。华为打造了围绕着“2C”商业环境全栈的智能解决方案，从终端手机芯片、云服务、产业生态，与行业合作伙伴共同构建一个面向个人和家庭的智能生活解决方案。\n\
    \n第二大产业群面向政府、运营商、行业企业客户、ICT基础设施产业群，致力于提供无处不在的连接和无所不及的智能产品和解决方案。在华为2019年发布的全栈人工智能解决方案中就有一项内容，是结合华为的企业智能（EI）使能平台，帮助政府、行业、企业快速构建人工智能应用。从芯片、5G、边缘计算，到以鲲鹏生态Atlas为中心的云服务，华为提供了全栈的服务平台，并与产业合作伙伴共同构建了一个面向全行业、全场景的应用生态，为构建面向“端边云”的全场景AI基础设施提供产品和服务的支持。\n\
    \n洛阳有个钼矿，因为地处偏远，人工驾驶大型矿车深入矿区采矿风险很高。利用“5G+人工智能”实现的无人驾驶和远端控制，2019年该矿区实现了零伤亡，司机人数从原来的100多人减少到了20人，年产值增加了1.6亿元，实现了很大的经济和社会效益。华为还帮助宁波舟山港建成了“5G+人工智能”智慧港口，集装箱卡车24小时自动作业，自动识别准确率高达95%，节约了大量的人力投入。在本次新冠疫情中，华为与全国300多家医院合作，为超过100万人提供基于“5G+人工智能”的医疗服务，医生读片的速度从过去的每张超过10分钟，缩短到了1分钟之内。\n\
    \n人工智能是业务场景、算法、算力和数据四位一体的综合性服务，华为作为业态丰富的企业，自身也在积极推动智能化的实践。华为在公司内部建立了华为企业智能大脑，将建设一个为企业服务的人工智能平台的时间从初期的14～16个月缩短到了现在的0.5～2个月。我们希望华为自身的实践经验也能帮助各行各业实现体验提升、效率提升、效益提升和商业模式创新。华为一直秉承“自己的降落伞自己跳”的理念，基于自身丰富的企业应用场景，聚焦重复、海量、复杂的场景，打造产品创新和智能化转型的试验田，并将华为数字化转型的成熟经验赋能于更多的企业。\n\
    \n对人工智能发展的思考和建议\n\n为了让人工智能发展更好地服务社会，我们有两个建议。第一，人工智能要有序发展。我们认为政府、行业协会、标准组织应加强政策制定、AI立法，各个行业、产业联盟要加强共识，形成数据交换的标准。第二，我们呼吁在人工智能产业链上加强政府与企业，AI技术、算法与专业技术方面的合作。人工智能的发展目标是为企业提供好的技术和产品解决方案，技术需要相应的企业和用户场景去验证，算法需要数据和业务场景进行持续优化。任何国家试图以封闭来阻止人工智能的发展，都改变不了公众对人工智能行业应用和未来智能社会构建的诉求。依托上海的政策优势和优秀的产业发展环境，华为在上海陆续布局了鲲鹏+昇腾、5G、5G+XR以及自动驾驶等创新中心，共同推进人工智能在各行各业的应用。\n\
    \n在使用人工智能方面，我们对业界也有两个方面的建议。"
  fmt: '

    # 人工智能发展的三个阶段与当前机遇


    这个阶段又可以细分为两个子阶段。在前半段，人工智能的发展主要围绕通用能力的开发和作为一种资源的AI能力的平台化，以及在智能搜索和信息流推荐这两个标志性行业的应用；在后半段，人工智能开始全面的产业化，也就是行业应用与商业化的全面普及。


    第三个阶段是社会的智能化。人工智能将从经济领域渗透到广泛的社会领域，全社会和全球范围内的智能协作与制度创新将是这个阶段的主要特征。最终这种协作和变革又会对经济产生更深远的影响，人类将真正进入智能社会。


    目前，我们正处于从经济智能化的前半段向后半段过渡的时期。经过前半段的发展，在全球范围内已经出现了少数几家通用AI平台和一些专注于某个垂直行业的细分AI平台。在信息搜索、信息流推荐、无人驾驶这几个垂直行业，人工智能已经证明，或初步证明了其对所在行业的颠覆和重构潜能。


    比如，百度从一开始就专注于搜索引擎这一迄今为止人工智能规模最大的应用场景；10年前，百度开始将通用AI能力的开发和平台化作为一个重要战略；几年前，百度开始在无人驾驶和智能交通这一垂直行业发力。


    20世纪90年代，美国通过“信息高速公路”计划，大大扩充了互联网的基础设施，从而将人类带入了互联网时代。今天，中国正在积极推进的“新基建”可以被视为人类在进入智能经济和智能社会前最大的基础设施扩张工程，它有很大的希望会在中国率先掀起全面人工智能化的潮流。


    作为将自己定位于专注对外赋能的AI平台型公司，百度希望每一家企业不管规模多小，都可以像用水和用电一样使用我们的平台能力和服务能力，从而快速实现AI化转型，最终这又会使每一个普通消费者受益。这种定位也可以让我们避免与生态伙伴竞争，并始终将开放作为一项基本原则，从而专心致志扮演好AI赋能者的角色。


    但目前人工智能所处的阶段，也是一个容易产生迷茫甚至悲观的阶段，这是大多数颠覆性技术在加速普及之前的必经阶段。这就像互联网在2000年后的几年里经历的那样，一些公司消失了，一些人永远离开了这个行业。我还记得当时一些海归甚至因为失去信心而离开，因为百度也是从那个低谷期爬出来的，我对此记忆犹新。但是，当迷雾消散时，一个经济和社会全面互联网化的时代开始了，熬过寒冬的小人物们成为新的英雄。


    无论是当年我对互联网的信仰，还是今天我对AI的信仰，都没有一丝丝改变。我仍然认为AI是堪比工业革命的大浪潮，它一定会彻底改变我们今天的每一个行业。这次疫情会成为一个契机，它让人们产生了掌控命运的紧迫感，同时也让我们看到人工智能不再遥远，而是就在我们身边。人工智能延长了我们的双手，强大了我们的大脑，丰富了我们的视觉，消除了时空的障碍。


    迷雾终将散去，智能经济和智能社会终将成为现实，人类也终将掌握自己的命运。


