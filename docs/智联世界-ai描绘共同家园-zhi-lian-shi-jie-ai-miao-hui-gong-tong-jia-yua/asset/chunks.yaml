- raw: "夏天很多人都需要空调，但大家一定觉得现在的空调离完美还很远。空调房间并不是很舒服，甚至还产生各种各样的空调病，在家里怎么控制好空调，既不会让孩子着凉，也不会让他热出痱子，真的很难。做到温度上的智能化处理，首先需要了解房型并知道空调在房间中的具体位置，并设置温湿度传感器。房间里面温度不平均时，需要知道人在什么地方以及每个人处于什么状态（睡眠或是活动），还要了解老人和孩子在晚上是否盖好被子。这些数据需要随时掌握，并据此调整出风口，对不同房间设置温度，相信不久的将来这样的空调将会出现。\n\
    \n小米也涉足金融领域。过去10年，数字化和人工智能在零售金融领域得到了很大的发展。个人在互联网上的行为，甚至生活中的大部分行为和习惯都已被数字化了。基于这么多数据，相应的人工智能模型就可以建立，这是过去10年里个人信贷高度便捷化的根本原因。\n\
    \n相比之下，企业自动化和数字化程度仍然较低。中小企业要获得贷款非常不容易，金融机构对中小企业的贷款往往是基于对企业主个人行为、个人信用的分析和判断，所以将企业各个流程数字化并记录下来显得格外重要。\n\
    \n小米有很多小的零售商需要资金进货，但是很多银行不愿意对这些小店贷款，原因是银行不能掌握资金的真实去向，也难以确定抵押品是否安全可靠。造成这种局面的根本原因是库存没有很好地数字化，所以我们为这些小店提供了一套“智能抽屉”的解决方案。简单而言，“智能抽屉”就是当你把货品放入其中时，它可以自动识别货品品质、数量和价值，在消费者购买时货品可以自动取出，一切过程全被数字化记录在后台。金融机构可以通过这个系统随时了解库存的数量和价值，为企业提供相应的贷款额度。\n\
    \n小米投资了很多智能硬件制造企业，当他们完成产品开发时，往往会面临巨大的资金缺口。这些企业需要上亿元的资金，需要向上游企业购买元器件，购买代工和仓储服务，直到零售商付款后，才有资金的回流。一个仅拿到订单的企业很难获得银行贷款，多数时候只能通过股权融资获取第一笔周转资金，对企业而言代价很高。\n\
    \n基于我们对这些企业经营模式的了解，可以将整个经营流程充分数字化：需要多少零件、向谁采购、与谁合作建造、仓储和运输情况、产品销售渠道，以及汇款情况。这些数据被自动采集并进入信息系统，实现数字化。有了这个基础，就可以做出非常详尽的订单管理系统，金融机构可以基于这个系统了解所需的准确信息，为企业发放贷款。银行并不是不愿意放贷，而是信息高度不对称让银行看不到企业的真实情况。我们要做的就是通过企业数字化，把视觉黑洞变成白盒子。我们相信，在企业信贷、产业金融领域，在企业充分数字化后，人工智能发展的机会将是巨大的。\n\
    \n\uFEFF\n\n智慧互联，激发汽车产业新动能\n\n王晓秋\n\n上海汽车集团股份有限公司总裁\n\n![](images/txt036_1.jpg\
    \ \"pagenumber_ebook=266,pagenumber_book=250\")\n\n工学博士，高级工程师（教授级）。曾长期从事汽车质量、技术、采购等管理工作，具有丰富的合资整车、零部件及自主品牌汽车企业管理经验。2006年起，历任上海汽车股份有限公司乘用车分公司总经理，上海柴油机股份有限公司总经理，上海通用汽车有限公司总经理，上海汽车集团副总裁兼乘用车分公司总经理、技术中心主任。现任上海汽车集团股份有限公司总裁。\n\
    \n![](images/txt036_2.jpg \"pagenumber_ebook=267,pagenumber_book=251\")\n\n人工智能、大数据、云计算等新一代信息技术是驱动科技革命和产业变革的重要引擎。未来，5G、人工智能等技术的不断成熟，必将推动经济社会从“网络化”向“智能化”加速跃升。特别是当前全球汽车产业正面临百年未有之大变革，国内汽车产业正经历多年未遇的大调整，突如其来的新冠疫情，更是成为汽车产业形成新格局的催化剂。加快人工智能等新技术与汽车产业的深度融合，持续激发新动能，将是汽车产业转型升级、越级而立的内在要求，也是构建“更美好汽车生活”的重要途径。\n\
    \n从消费变化看，人工智能等新技术将带动汽车产品和服务持续“提质升级”。未来，人们的出行不仅仅以“到达”为目的，而是更加注重过程的“体验”。比如，上海汽车集团（以下简称“上汽”）正在车联网系统的基础上，研发融合5G技术的全新智能座舱，从而实现车辆对驾乘者主动感应以及与两者之间的深度交互，让汽车真正成为智能、贴心的移动终端。同时，这次疫情一定程度上改变了居民的消费习惯，加速了在线经济的发展，也倒逼传统车企加快向线上转型发展。上汽在上海“55购物节”期间，借鉴互联网企业的经验和做法，将新品发布在线化，积极探索汽车数字化营销的新模式。\n\
    \n从技术发展看，软件定义汽车的变化正在加速而来，将成为车企变革发展所必须跨越的“创新门槛”。软件既是推动汽车朝着“电动化”和“智能网联化”方向发展的核心，也是决定未来汽车产品和服务差异化的关键。为此，上汽在2019年底组建了软件中心，加快推动自动驾驶、移动出行等业务不断升级。上汽正自主研发电动车专属架构、“车载中央大脑+域控制器”融合的新一代电子电器架构，并联合国内外芯片研发头部企业，打造定制化芯片。同时，持续完善人工智能、大数据、云计算、网联信息安全4大中心的核心能力建设，为上汽加快在产品和服务上的软件技术应用落地打下基础。\n\
    \n从成果转化看，国家和地方的支持将为人工智能等新技术在汽车产业加快落地提供“助力赋能”。近两年，为支持智能汽车的创新发展，国家出台了一系列指导意见，营造了良好的发展环境。上汽作为国内智能网联汽车的先行者之一，也在探索一条技术可靠、成本可行、安全可控的智能驾驶技术路线。上汽已完成3代智能驾驶平台开发，实车道路测试里程已近30万千米，虚拟仿真测试里程已近2000万千米，并建立智能驾驶“拟人化”控制知识库和学习模型。上汽正牵头制定国家智能网联汽车长三角创新平台“落户上海”的方案。长三角地区无论是经济总量、产业规模、交通网络等硬件，还是人才素质、数字经济等软件，对发展智能网联汽车具有得天独厚的优势。上汽将继续发挥自身产业优势，从上海起步并在长三角多个城市创建示范区，实现Robotaxi等多个场景应用落地，进一步加快智能驾驶技术创新成果的商业化应用，助力长三角智慧交通建设，满足广大消费者对于便捷出行和美好生活的需求。\n\
    \n这场席卷全球的疫情，给世界汽车工业带来了巨大冲击，但也让我们看到汽车作为重要的智能移动空间对于城市出行生活的重要意义。无论城市如何变迁，车水马龙才是城市的“烟火气”，智慧移动出行才能让世间美好环环相扣。\n\
    \n\uFEFF\n\nAI构建未来物流：汉堡港如何拥抱数字化与人工智能\n\n狄智拉（Angela Titzrath）\n\n汉堡港口与物流股份公司（HHLA）执行董事会主席\n\
    \n![](images/txt037_1.jpg \"pagenumber_ebook=270,pagenumber_book=254\")\n\n德国波鸿鲁尔大学经济学和罗曼语言学专业毕业后，开始了在罗马梅赛德斯—奔驰（Mercedes-Benz）的运营和战略控制主管职业生涯。1991—2012年，在戴姆勒集团（Daimler\
    \ Group）担任多个国际高级管理职务，包括加拿大梅赛德斯—奔驰信贷的首席执行官，梅赛德斯—奔驰信贷公司北美地区常务董事和梅赛德斯—奔驰银行欧洲常务董事。2002年，在西班牙梅赛德斯—奔驰生产工厂担任商业总经理，随后成为戴姆勒客车公司全球执行董事会成员。2012年，被任命为德国邮政集团执行董事会成员，直到2014年主要负责集团内的全球人力资源管理工作。自2016年10月1日起担任汉堡港口与物流股份公司（HHLA）（已上市的欧洲物流领军企业）执行董事，并从2017年1月1日起担任执行董事会主席。\n\
    \n![](images/txt037_2.jpg \"pagenumber_ebook=271,pagenumber_book=255\")\n\n世界人工智能大会虽然受到疫情的影响，但仍然成功召开，这是一个鼓舞人心的信号。尤其是全世界正在经历艰难的时期，跨国观点的交流变得越来越重要，只有合作互联才能够克服困难，比如说在健康保护和应对气候挑战等方面。我将介绍德国汉堡的HHLA是怎么拥抱数字化与人工智能的。\n\
    \nHHLA有6000多名员工，是欧洲领先的物流集团。汉堡这个城市一直强调它的全球声誉和繁荣都来自汉堡港，汉堡港就是我们的生命线，HHLA所有的船都是在这个港口停靠，所以集装箱决定了这个城市发展的规模，就好像我们红色砖墙的仓库一样。\n\
    \n并不是幸运使我们长盛不衰，不断尝试、不断创新才是最关键的因素。135年前，HHLA建立了世界上最大的仓储中心，但近百年后，这个仓储中心已经过时，因为集装箱代替了原有的货物运输。1968年，汉堡有了第一艘集装箱船，它重新定义了物流的方式和空间。在接下来的几年中，HHLA参与塑造了集装箱行业，把汉堡的集装箱码头建成了世界上自动化程度最高的码头，在集装箱的处理和操作方面制定了世界广泛采用的标准。\n\
    \n一个有远见的公司不能对新的技术和技术变革视而不见。HHLA仍不断寻找问题的全新解决方案。集装箱之后，接下来是什么？我们的目标是和客户共同发展数字和物流的枢纽。世界将快速变化，运输和物流在未来将会更加紧密地融合，大数据包会在数据路线上穿行，就好像传统的货物在海陆空路线上运输一样。现在整个经济还主要是按传统的方式运行的，所以送货的准时性和可靠性仍然是关键。\n\
    \n数字化给我们提供了非常多的机会，能够更好地把货物流和数据有效地整合起来。HHLA正在实施自己的数字战略，希望能够成为数字变革的引擎。在HHLA看来，人工智能能够提高生产能力以及码头运作的效率。\n\
    \n过去，我们并不能预测仓储集装箱的提货时间；未来，计算机将会利用历史的数据集成算法，计算集装箱可能的提货时间，还能通过机器学习的算法不断自我优化。AI算法还能更精确预测送货时间，精确计算运输中集装箱的位置，以及它们是装在卡车、船，还是火车上。在AI的帮助下，我们可以预判集装箱吊车零部件的使用寿命，可以精确地预测船停靠在吊桥的时间，以便精准实施吊装。HHLA位于汉堡港的一个码头在运用AI预测后，仓储效率大为提升，因为AI可以精确地预测集装箱提货的时间，避免了集装箱在仓库期间的重复操作，从而优化了码头作业的效率。我们在汉堡另一个港口也用了同样的解决方案，未来将会有更多传统的码头使用这样的技术。\n\
    \n汉堡港位于汉堡市的中心，所以保护环境和气候就变得更加重要。我们非常小心地使用自然资源，HHLA的目的就是要在2040年前实现气候中立（Climate Neutral）。2019年，汉堡港CTA码头成为世界上第一个气候中立集装箱码头。对HHLA而言，数字和技术的创新是可持续发展解决方案的中心，人工智能将会发挥重要作用，数字化正在改变我们的行业，以及我们的港口。\n\
    \n\uFEFF\n\n连接·融合\n\n\uFEFF\n\n5G使AI更泛在，AI让5G更智能\n\n董 昕\n\n中国移动通信集团有限公司总经理\n\n\
    ![](images/txt039_1.jpg \"pagenumber_ebook=276,pagenumber_book=260\")\n\n中国移动通信集团有限公司董事、总经理。毕业于北京邮电大学邮电管理专业，澳大利亚国立大学财会管理专业硕士，上海交通大学与法国雷恩合办工商管理专业博士。曾在邮电部财务司、信息产业部经济调节与通信清算司工作，历任中国移动财务部总经理、计划部总经理，中国移动海南、河南、北京公司董事长、总经理。同时还担任中国通信企业协会理事会副会长、中国国防邮电工会常委、中国铁塔股份有限公司董事会董事。\n\
    \n![](images/txt039_2.jpg \"pagenumber_ebook=277,pagenumber_book=261\")\n\n5G和AI已成为引领新一轮科技革命和产业变革的战略性技术，也是新型基础设施建设的重要内容，两者互融互促，共赢共生，加快经济社会数字化转型进程。随着5G网络建设的提速与云、边、端等基础设施协同运行，万物互联和数据汇集将得到有效促进，这样大大降低了AI使用的门槛，全面促使AI深度融入经济社会发展。\n\
    \n到2025年，预计全世界AI市场规模将超过6万亿美元，这说明5G将使AI更泛在。随着AI成为5G网络承载的核心应用，5G网络和云、边、端等基础设施的智能化演进将大大提速，云网的综合效能将得到最大限度释放。我们可以预计AI将使5G更加智能，可以想象5G和AI的融合将引发链式变革，产生乘数效应，加速万物互联、万物感知、万物智能，对经济社会数字化转型产生深远的影响。\n\
    \n在数字化生活方面，“高速连接+感官智能”将催生人机交互新应用。视觉、听觉、触觉智能会在个人穿戴、家居设备中快速地渗透，展现丰富多彩的智慧生活。\n\n\
    ![](images/txt039_3.jpg \"pagenumber_ebook=278,pagenumber_book=262\")\n\n“高速连接+感官智能”催生人机交互新应用\n\
    \n在数字化生产方面，“可靠连接+专用智能”将催生智能制造的新业态。凭借高可靠、低时延的特征，5G将整合工业生产各领域离散的网络，推动AI深度融入制造业全流程、全环节，大幅提升传统产业的生产效率。\n\
    \n在数字化治理方面，“广域连接+通用智能”将催生智慧治理新模式。5G的超大规模连接特性，将促进教育、医疗、交通等各领域线上互通，加速数据要素的充分流通和高效运用，支撑AI深度学习，推动社会治理向协同化、精准化、高效化方向转变。比如在抗击疫情过程中，基于通信、交通、医疗等数据，AI成了人员行动轨迹溯源、健康状态分析的“神兵利器”。\n\
    \n![](images/txt039_4.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n“可靠连接+专用智能”催生智能制造新业态\n\
    \n![](images/txt039_5.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n“广域连接+通用智能”催生智慧治理新模式\n\
    \n面向未来，中国移动将把握数字化、网格化、智能化融合发展契机，发挥自身的网络、用户规模和海量数据优势，大力推动5G+AI规模化应用和价值创新，努力为推动数字经济和实体经济的深度融合，激发高质量发展新动能。\n\
    \n首先是实现AI规模化商业价值。主要设想是：围绕数字经济发展，结合民生保障，加速5G+AI规模化拓展。面向百姓大众，赋能云游戏、多形态直播、云XR等业务，提供沉浸式娱乐体验。面向千家万户，赋能智能家居、视频精准推送、3D体感游戏等应用，创造智慧安居美好生活。面向各行各业，提供安防监控、智能巡检、工业质检、智慧阅片等智能化解决方案，助力产业升级、产品开发和服务创新。\n\
    \n![](images/txt039_6.jpg \"pagenumber_ebook=280,pagenumber_book=264\")\n\n构筑能力即服务（AaaS）体系\n\
    \n其次是实现AI规模化技术价值。主要设想是：一方面，全方位布局泛在AI基础设施，构建全球领先的智慧云网，将AI融入5G网络规划、建设、优化和运维的全生产周期，搭建网络智能化开放创新平台，推动网络智能化应用和规模化部署，使5G网络更“聪明”。将AI融入移动云，推进大规模算力建设。2020年，中国移动将面向行业伙伴提供智能云方案。另外一方面，建设开放共享的智慧中台，构筑“能力即服务（AaaS）”体系，积淀汇聚企业内外部通用成熟能力，降低门槛，提高效率，使创新更开放、更便捷、更高效，使AI应用百花齐放。\n\
    \n最后是实现AI规模化社会价值。我们的主要设想是：履行央企责任，通过产、学、研联合创新，强化关键核心技术攻关，深化产业开放，合作共赢，促进更多AI芯片、能力、应用成熟商用，加速产业繁荣。中国移动把自身定位为新型智慧城市运营商，强化人工智能与医疗、教育、交通、环保、应急指挥等社会治理各方面的深度融合，消除数字壁垒和信息孤岛，使社会治理更加科学高效、人民生活更加智能便捷。\n\
    \n\uFEFF\n\n5G+AI开启智能互联未来\n\n克里斯蒂亚诺·阿蒙（Cristiano Amon）\n\n高通公司（QCT）总裁\n\n![](images/txt040_1.jpg\
    \ \"pagenumber_ebook=282,pagenumber_book=266\")\n\n高通公司总裁、执行委员会成员，全面负责高通公司半导体业务。此前三年，曾担任QCT联席总裁。在出任QCT联席总裁前，是QCT产品管理高级副总裁，负责公司的无线芯片产品组合。1995年作为工程师加入高通，之后在公司先后担任过多个业务和技术领导职务。在加入高通前，曾担任巴西无线运营商Vésper的首席技术官，并曾在NEC、爱立信和Velocom\
    \ 任职。拥有巴西圣保罗坎皮纳斯州立大学（UNICAMP）电子工程理学学士学位。\n\n![](images/txt040_2.jpg \"pagenumber_ebook=283,pagenumber_book=267\"\
    )\n\n对于整个行业来说，现在是一个振奋人心的时刻，我们正在迈入一个由AI和5G驱动的智能云连接的新时代。万物都将被连接到云端，并以可靠的方式实现互联。终端和体验与云端的内容、数据、算力和存储密不可分，5G具有光纤般的连接速度及低时延，加上先进的处理能力，为这一切提供了基础，将我们的边缘终端变得更加智能。5G和AI相结合将影响我们生活的方方面面和众多行业，这是下一个重大技术变革。\n\
    \n为了实现AI规模化，我们必须在整个网络实现分布式智能。如今，智能广泛分布在云端，并且逐渐向终端侧迁移。未来，来自数十亿边缘终端的海量数据将需要我们创建全新的边缘云。在全新的边缘云中，内容和控制的处理将转移到产生流量的地方。现在，边缘云和5G能够降低时延并赋能新的应用与服务，我们将看到性能、安全性和隐私保护都得到提升。\n\
    \n边缘云结合终端侧AI，还将助力更加广泛的全新应用。对我们而言，因为更直观、更富沉浸感与情境感体验的实现，如从交互式内容到无界虚拟现实，或是实时语音翻译，生活将更加丰富多彩。5G和AI结合边缘云，也将以积极和颠覆性方式推动更多行业的企业创新。你将看到，利用智能机器和物体产生的海量数据，人们可以进行本地实时网络分析，促进业务洞察，将生产力提升至全新水平，并带来更佳的自动化和控制水平。\n\
    \n这一趋势也将改变我们看待终端的方式，因为相对于操作系统和应用商店而言，云将发挥更大的作用。想象一下，终端始终联网并从云端获取几乎无限的存储空间和处理能力。这一场景的实现，将推动更加强大、更具潜能的应用涌现。当我们看到如今的微信、QQ等应用时，就已意识到应用的演进速度是如此之快，而未来应用的功能将更加强大，且独立于操作系统。当人们能够以可靠的方式连接终端和云端时，也就无须再为多个操作系统分别开发应用。\n\
    \n5G和AI将变革许多细分领域和行业\n\n利用5G和AI等技术，智能化的在线教育能够变得更加丰富且更具包容性。在线教育将能够支持差异化和个性化学习，实时翻译等技术将让学生能够获取全球教育数据库的内容，并以自己的语言进行学习。截至2020年4月，全球共有17亿学生采用了远程学习的方式，这使因宽带网络连接差距而导致的数字鸿沟更为突出，但5G能够改变这种局面。一旦具备5G和边缘云的能力，就可以实现随时随地的全新学习体验、优质的交互内容，将打造更具生产力和更智能的社会。"
  fmt: "\n# 小米AI与金融数字化实践\n\n夏天很多人都需要空调，但大家一定觉得现在的空调离完美还很远。空调房间并不是很舒服，甚至还产生各种各样的空调病，在家里怎么控制好空调，既不会让孩子着凉，也不会让他热出痱子，真的很难。做到温度上的智能化处理，首先需要了解房型并知道空调在房间中的具体位置，并设置温湿度传感器。房间里面温度不平均时，需要知道人在什么地方以及每个人处于什么状态（睡眠或是活动），还要了解老人和孩子在晚上是否盖好被子。这些数据需要随时掌握，并据此调整出风口，对不同房间设置温度，相信不久的将来这样的空调将会出现。\n\
    \n小米也涉足金融领域。过去10年，数字化和人工智能在零售金融领域得到了很大的发展。个人在互联网上的行为，甚至生活中的大部分行为和习惯都已被数字化了。基于这么多数据，相应的人工智能模型就可以建立，这是过去10年里个人信贷高度便捷化的根本原因。\n\
    \n相比之下，企业自动化和数字化程度仍然较低。中小企业要获得贷款非常不容易，金融机构对中小企业的贷款往往是基于对企业主个人行为、个人信用的分析和判断，所以将企业各个流程数字化并记录下来显得格外重要。\n\
    \n小米有很多小的零售商需要资金进货，但是很多银行不愿意对这些小店贷款，原因是银行不能掌握资金的真实去向，也难以确定抵押品是否安全可靠。造成这种局面的根本原因是库存没有很好地数字化，所以我们为这些小店提供了一套“智能抽屉”的解决方案。简单而言，“智能抽屉”就是当你把货品放入其中时，它可以自动识别货品品质、数量和价值，在消费者购买时货品可以自动取出，一切过程全被数字化记录在后台。金融机构可以通过这个系统随时了解库存的数量和价值，为企业提供相应的贷款额度。\n\
    \n小米投资了很多智能硬件制造企业，当他们完成产品开发时，往往会面临巨大的资金缺口。这些企业需要上亿元的资金，需要向上游企业购买元器件，购买代工和仓储服务，直到零售商付款后，才有资金的回流。一个仅拿到订单的企业很难获得银行贷款，多数时候只能通过股权融资获取第一笔周转资金，对企业而言代价很高。\n\
    \n基于我们对这些企业经营模式的了解，可以将整个经营流程充分数字化：需要多少零件、向谁采购、与谁合作建造、仓储和运输情况、产品销售渠道，以及汇款情况。这些数据被自动采集并进入信息系统，实现数字化。有了这个基础，就可以做出非常详尽的订单管理系统，金融机构可以基于这个系统了解所需的准确信息，为企业发放贷款。银行并不是不愿意放贷，而是信息高度不对称让银行看不到企业的真实情况。我们要做的就是通过企业数字化，把视觉黑洞变成白盒子。我们相信，在企业信贷、产业金融领域，在企业充分数字化后，人工智能发展的机会将是巨大的。\n\
    \n---\n\n# 智慧互联，激发汽车产业新动能\n\n**王晓秋**  \n上海汽车集团股份有限公司总裁\n\n![](images/txt036_1.jpg\
    \ \"pagenumber_ebook=266,pagenumber_book=250\")\n\n工学博士，高级工程师（教授级）。曾长期从事汽车质量、技术、采购等管理工作，具有丰富的合资整车、零部件及自主品牌汽车企业管理经验。2006年起，历任上海汽车股份有限公司乘用车分公司总经理，上海柴油机股份有限公司总经理，上海通用汽车有限公司总经理，上海汽车集团副总裁兼乘用车分公司总经理、技术中心主任。现任上海汽车集团股份有限公司总裁。\n\
    \n![](images/txt036_2.jpg \"pagenumber_ebook=267,pagenumber_book=251\")\n\n人工智能、大数据、云计算等新一代信息技术是驱动科技革命和产业变革的重要引擎。未来，5G、人工智能等技术的不断成熟，必将推动经济社会从“网络化”向“智能化”加速跃升。特别是当前全球汽车产业正面临百年未有之大变革，国内汽车产业正经历多年未遇的大调整，突如其来的新冠疫情，更是成为汽车产业形成新格局的催化剂。加快人工智能等新技术与汽车产业的深度融合，持续激发新动能，将是汽车产业转型升级、越级而立的内在要求，也是构建“更美好汽车生活”的重要途径。\n\
    \n## 从消费变化看：人工智能等新技术将带动汽车产品和服务持续“提质升级”\n\n未来，人们的出行不仅仅以“到达”为目的，而是更加注重过程的“体验”。比如，上海汽车集团（以下简称“上汽”）正在车联网系统的基础上，研发融合5G技术的全新智能座舱，从而实现车辆对驾乘者主动感应以及与两者之间的深度交互，让汽车真正成为智能、贴心的移动终端。同时，这次疫情一定程度上改变了居民的消费习惯，加速了在线经济的发展，也倒逼传统车企加快向线上转型发展。上汽在上海“55购物节”期间，借鉴互联网企业的经验和做法，将新品发布在线化，积极探索汽车数字化营销的新模式。\n\
    \n## 从技术发展看：软件定义汽车的变化正在加速而来\n\n软件既是推动汽车朝着“电动化”和“智能网联化”方向发展的核心，也是决定未来汽车产品和服务差异化的关键。为此，上汽在2019年底组建了软件中心，加快推动自动驾驶、移动出行等业务不断升级。上汽正自主研发电动车专属架构、“车载中央大脑+域控制器”融合的新一代电子电器架构，并联合国内外芯片研发头部企业，打造定制化芯片。同时，持续完善人工智能、大数据、云计算、网联信息安全4大中心的核心能力建设，为上汽加快在产品和服务上的软件技术应用落地打下基础。\n\
    \n## 从成果转化看：国家和地方的支持将为人工智能等新技术在汽车产业加快落地提供“助力赋能”\n\n近两年，为支持智能汽车的创新发展，国家出台了一系列指导意见，营造了良好的发展环境。上汽作为国内智能网联汽车的先行者之一，也在探索一条技术可靠、成本可行、安全可控的智能驾驶技术路线。上汽已完成3代智能驾驶平台开发，实车道路测试里程已近30万千米，虚拟仿真测试里程已近2000万千米，并建立智能驾驶“拟人化”控制知识库和学习模型。上汽正牵头制定国家智能网联汽车长三角创新平台“落户上海”的方案。长三角地区无论是经济总量、产业规模、交通网络等硬件，还是人才素质、数字经济等软件，对发展智能网联汽车具有得天独厚的优势。上汽将继续发挥自身产业优势，从上海起步并在长三角多个城市创建示范区，实现Robotaxi等多个场景应用落地，进一步加快智能驾驶技术创新成果的商业化应用，助力长三角智慧交通建设，满足广大消费者对于便捷出行和美好生活的需求。\n\
    \n这场席卷全球的疫情，给世界汽车工业带来了巨大冲击，但也让我们看到汽车作为重要的智能移动空间对于城市出行生活的重要意义。无论城市如何变迁，车水马龙才是城市的“烟火气”，智慧移动出行才能让世间美好环环相扣。\n\
    \n---\n\n# AI构建未来物流：汉堡港如何拥抱数字化与人工智能\n\n**狄智拉（Angela Titzrath）**  \n汉堡港口与物流股份公司（HHLA）执行董事会主席\n\
    \n![](images/txt037_1.jpg \"pagenumber_ebook=270,pagenumber_book=254\")\n\n德国波鸿鲁尔大学经济学和罗曼语言学专业毕业后，开始了在罗马梅赛德斯—奔驰（Mercedes-Benz）的运营和战略控制主管职业生涯。1991—2012年，在戴姆勒集团（Daimler\
    \ Group）担任多个国际高级管理职务，包括加拿大梅赛德斯—奔驰信贷的首席执行官，梅赛德斯—奔驰信贷公司北美地区常务董事和梅赛德斯—奔驰银行欧洲常务董事。2002年，在西班牙梅赛德斯—奔驰生产工厂担任商业总经理，随后成为戴姆勒客车公司全球执行董事会成员。2012年，被任命为德国邮政集团执行董事会成员，直到2014年主要负责集团内的全球人力资源管理工作。自2016年10月1日起担任汉堡港口与物流股份公司（HHLA）（已上市的欧洲物流领军企业）执行董事，并从2017年1月1日起担任执行董事会主席。\n\
    \n![](images/txt037_2.jpg \"pagenumber_ebook=271,pagenumber_book=255\")\n\n世界人工智能大会虽然受到疫情的影响，但仍然成功召开，这是一个鼓舞人心的信号。尤其是全世界正在经历艰难的时期，跨国观点的交流变得越来越重要，只有合作互联才能够克服困难，比如说在健康保护和应对气候挑战等方面。我将介绍德国汉堡的HHLA是怎么拥抱数字化与人工智能的。\n\
    \nHHLA有6000多名员工，是欧洲领先的物流集团。汉堡这个城市一直强调它的全球声誉和繁荣都来自汉堡港，汉堡港就是我们的生命线，HHLA所有的船都是在这个港口停靠，所以集装箱决定了这个城市发展的规模，就好像我们红色砖墙的仓库一样。\n\
    \n并不是幸运使我们长盛不衰，不断尝试、不断创新才是最关键的因素。135年前，HHLA建立了世界上最大的仓储中心，但近百年后，这个仓储中心已经过时，因为集装箱代替了原有的货物运输。1968年，汉堡有了第一艘集装箱船，它重新定义了物流的方式和空间。在接下来的几年中，HHLA参与塑造了集装箱行业，把汉堡的集装箱码头建成了世界上自动化程度最高的码头，在集装箱的处理和操作方面制定了世界广泛采用的标准。\n\
    \n一个有远见的公司不能对新的技术和技术变革视而不见。HHLA仍不断寻找问题的全新解决方案。集装箱之后，接下来是什么？我们的目标是和客户共同发展数字和物流的枢纽。世界将快速变化，运输和物流在未来将会更加紧密地融合，大数据包会在数据路线上穿行，就好像传统的货物在海陆空路线上运输一样。现在整个经济还主要是按传统的方式运行的，所以送货的准时性和可靠性仍然是关键。\n\
    \n数字化给我们提供了非常多的机会，能够更好地把货物流和数据有效地整合起来。HHLA正在实施自己的数字战略，希望能够成为数字变革的引擎。在HHLA看来，人工智能能够提高生产能力以及码头运作的效率。\n\
    \n过去，我们并不能预测仓储集装箱的提货时间；未来，计算机将会利用历史的数据集成算法，计算集装箱可能的提货时间，还能通过机器学习的算法不断自我优化。AI算法还能更精确预测送货时间，精确计算运输中集装箱的位置，以及它们是装在卡车、船，还是火车上。在AI的帮助下，我们可以预判集装箱吊车零部件的使用寿命，可以精确地预测船停靠在吊桥的时间，以便精准实施吊装。HHLA位于汉堡港的一个码头在运用AI预测后，仓储效率大为提升，因为AI可以精确地预测集装箱提货的时间，避免了集装箱在仓库期间的重复操作，从而优化了码头作业的效率。我们在汉堡另一个港口也用了同样的解决方案，未来将会有更多传统的码头使用这样的技术。\n\
    \n汉堡港位于汉堡市的中心，所以保护环境和气候就变得更加重要。我们非常小心地使用自然资源，HHLA的目的就是要在2040年前实现气候中立（Climate Neutral）。2019年，汉堡港CTA码头成为世界上第一个气候中立集装箱码头。对HHLA而言，数字和技术的创新是可持续发展解决方案的中心，人工智能将会发挥重要作用，数字化正在改变我们的行业，以及我们的港口。\n\
    \n---\n\n# 连接·融合\n\n## 5G使AI更泛在，AI让5G更智能\n\n**董 昕**  \n中国移动通信集团有限公司总经理\n\n![](images/txt039_1.jpg\
    \ \"pagenumber_ebook=276,pagenumber_book=260\")\n\n中国移动通信集团有限公司董事、总经理。毕业于北京邮电大学邮电管理专业，澳大利亚国立大学财会管理专业硕士，上海交通大学与法国雷恩合办工商管理专业博士。曾在邮电部财务司、信息产业部经济调节与通信清算司工作，历任中国移动财务部总经理、计划部总经理，中国移动海南、河南、北京公司董事长、总经理。同时还担任中国通信企业协会理事会副会长、中国国防邮电工会常委、中国铁塔股份有限公司董事会董事。\n\
    \n![](images/txt039_2.jpg \"pagenumber_ebook=277,pagenumber_book=261\")\n\n5G和AI已成为引领新一轮科技革命和产业变革的战略性技术，也是新型基础设施建设的重要内容，两者互融互促，共赢共生，加快经济社会数字化转型进程。随着5G网络建设的提速与云、边、端等基础设施协同运行，万物互联和数据汇集将得到有效促进，这样大大降低了AI使用的门槛，全面促使AI深度融入经济社会发展。\n\
    \n到2025年，预计全世界AI市场规模将超过6万亿美元，这说明5G将使AI更泛在。随着AI成为5G网络承载的核心应用，5G网络和云、边、端等基础设施的智能化演进将大大提速，云网的综合效能将得到最大限度释放。我们可以预计AI将使5G更加智能，可以想象5G和AI的融合将引发链式变革，产生乘数效应，加速万物互联、万物感知、万物智能，对经济社会数字化转型产生深远的影响。\n\
    \n### 在数字化生活方面\n\n“高速连接+感官智能”将催生人机交互新应用。视觉、听觉、触觉智能会在个人穿戴、家居设备中快速地渗透，展现丰富多彩的智慧生活。\n\
    \n![](images/txt039_3.jpg \"pagenumber_ebook=278,pagenumber_book=262\")\n\n> **“高速连接+感官智能”催生人机交互新应用**\n\
    \n### 在数字化生产方面\n\n“可靠连接+专用智能”将催生智能制造的新业态。凭借高可靠、低时延的特征，5G将整合工业生产各领域离散的网络，推动AI深度融入制造业全流程、全环节，大幅提升传统产业的生产效率。\n\
    \n![](images/txt039_4.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n> **“可靠连接+专用智能”催生智能制造新业态**\n\
    \n### 在数字化治理方面\n\n“广域连接+通用智能”将催生智慧治理新模式。5G的超大规模连接特性，将促进教育、医疗、交通等各领域线上互通，加速数据要素的充分流通和高效运用，支撑AI深度学习，推动社会治理向协同化、精准化、高效化方向转变。比如在抗击疫情过程中，基于通信、交通、医疗等数据，AI成了人员行动轨迹溯源、健康状态分析的“神兵利器”。\n\
    \n![](images/txt039_5.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n> **“广域连接+通用智能”催生智慧治理新模式**\n\
    \n面向未来，中国移动将把握数字化、网格化、智能化融合发展契机，发挥自身的网络、用户规模和海量数据优势，大力推动5G+AI规模化应用和价值创新，努力为推动数字经济和实体经济的深度融合，激发高质量发展新动能。\n\
    \n#### 首先是实现AI规模化商业价值\n\n主要设想是：围绕数字经济发展，结合民生保障，加速5G+AI规模化拓展。面向百姓大众，赋能云游戏、多形态直播、云XR等业务，提供沉浸式娱乐体验。面向千家万户，赋能智能家居、视频精准推送、3D体感游戏等应用，创造智慧安居美好生活。面向各行各业，提供安防监控、智能巡检、工业质检、智慧阅片等智能化解决方案，助力产业升级、产品开发和服务创新。\n\
    \n#### 其次是实现AI规模化技术价值\n\n主要设想是：一方面，全方位布局泛在AI基础设施，构建全球领先的智慧云网，将AI融入5G网络规划、建设、优化和运维的全生产周期，搭建网络智能化开放创新平台，推动网络智能化应用和规模化部署，使5G网络更“聪明”。将AI融入移动云，推进大规模算力建设。2020年，中国移动将面向行业伙伴提供智能云方案。另外一方面，建设开放共享的智慧中台，构筑“能力即服务（AaaS）”体系，积淀汇聚企业内外部通用成熟能力，降低门槛，提高效率，使创新更开放、更便捷、更高效，使AI应用百花齐放。\n\
    \n![](images/txt039_6.jpg \"pagenumber_ebook=280,pagenumber_book=264\")\n\n> **构筑能力即服务（AaaS）体系**\n\
    \n#### 最后是实现AI规模化社会价值\n\n我们的主要设想是：履行央企责任，通过产、学、研联合创新，强化关键核心技术攻关，深化产业开放，合作共赢，促进更多AI芯片、能力、应用成熟商用，加速产业繁荣。中国移动把自身定位为新型智慧城市运营商，强化人工智能与医疗、教育、交通、环保、应急指挥等社会治理各方面的深度融合，消除数字壁垒和信息孤岛，使社会治理更加科学高效、人民生活更加智能便捷。\n\
    \n---\n\n# 5G+AI开启智能互联未来\n\n**克里斯蒂亚诺·阿蒙（Cristiano Amon）**  \n高通公司（QCT）总裁\n\n![](images/txt040_1.jpg\
    \ \"pagenumber_ebook=282,pagenumber_book=266\")\n\n高通公司总裁、执行委员会成员，全面负责高通公司半导体业务。此前三年，曾担任QCT联席总裁。在出任QCT联席总裁前，是QCT产品管理高级副总裁，负责公司的无线芯片产品组合。1995年作为工程师加入高通，之后在公司先后担任过多个业务和技术领导职务。在加入高通前，曾担任巴西无线运营商Vésper的首席技术官，并曾在NEC、爱立信和Velocom\
    \ 任职。拥有巴西圣保罗坎皮纳斯州立大学（UNICAMP）电子工程理学学士学位。\n\n![](images/txt040_2.jpg \"pagenumber_ebook=283,pagenumber_book=267\"\
    )\n\n对于整个行业来说，现在是一个振奋人心的时刻，我们正在迈入一个由AI和5G驱动的智能云连接的新时代。万物都将被连接到云端，并以可靠的方式实现互联。终端和体验与云端的内容、数据、算力和存储密不可分，5G具有光纤般的连接速度及低时延，加上先进的处理能力，为这一切提供了基础，将我们的边缘终端变得更加智能。5G和AI相结合将影响我们生活的方方面面和众多行业，这是下一个重大技术变革。\n\
    \n为了实现AI规模化，我们必须在整个网络实现分布式智能。如今，智能广泛分布在云端，并且逐渐向终端侧迁移。未来，来自数十亿边缘终端的海量数据将需要我们创建全新的边缘云。在全新的边缘云中，内容和控制的处理将转移到产生流量的地方。现在，边缘云和5G能够降低时延并赋能新的应用与服务，我们将看到性能、安全性和隐私保护都得到提升。\n\
    \n边缘云结合终端侧AI，还将助力更加广泛的全新应用。对我们而言，因为更直观、更富沉浸感与情境感体验的实现，如从交互式内容到无界虚拟现实，或是实时语音翻译，生活将更加丰富多彩。5G和AI结合边缘云，也将以积极和颠覆性方式推动更多行业的企业创新。你将看到，利用智能机器和物体产生的海量数据，人们可以进行本地实时网络分析，促进业务洞察，将生产力提升至全新水平，并带来更佳的自动化和控制水平。\n\
    \n这一趋势也将改变我们看待终端的方式，因为相对于操作系统和应用商店而言，云将发挥更大的作用。想象一下，终端始终联网并从云端获取几乎无限的存储空间和处理能力。这一场景的实现，将推动更加强大、更具潜能的应用涌现。当我们看到如今的微信、QQ等应用时，就已意识到应用的演进速度是如此之快，而未来应用的功能将更加强大，且独立于操作系统。当人们能够以可靠的方式连接终端和云端时，也就无须再为多个操作系统分别开发应用。\n\
    \n## 5G和AI将变革许多细分领域和行业\n\n利用5G和AI等技术，智能化的在线教育能够变得更加丰富且更具包容性。在线教育将能够支持差异化和个性化学习，实时翻译等技术将让学生能够获取全球教育数据库的内容，并以自己的语言进行学习。截至2020年4月，全球共有17亿学生采用了远程学习的方式，这使因宽带网络连接差距而导致的数字鸿沟更为突出，但5G能够改变这种局面。一旦具备5G和边缘云的能力，就可以实现随时随地的全新学习体验、优质的交互内容，将打造更具生产力和更智能的社会。\n"
  trans: "\n# Xiaomi AI and Financial Digitalization Practice\n\nIn summer, many people\
    \ need air conditioners, but everyone must feel that current air conditioners\
    \ are still far from perfect. Air-conditioned rooms are not very comfortable and\
    \ can even cause various \"air conditioner diseases.\" At home, how to control\
    \ the air conditioner well so that children don't catch a cold or get heat rash\
    \ is really difficult. To achieve intelligent temperature management, one first\
    \ needs to understand the house layout and know the specific location of the air\
    \ conditioner in the room, and set up temperature and humidity sensors. When the\
    \ room temperature is uneven, one needs to know where people are and what state\
    \ each person is in (sleeping or active), and also know whether the elderly and\
    \ children have covered their quilts properly at night. These data need to be\
    \ grasped at all times, and based on this, adjust the air outlets and set temperatures\
    \ for different rooms. I believe such air conditioners will appear in the near\
    \ future.\n\nXiaomi is also involved in the financial sector. Over the past 10\
    \ years, digitalization and artificial intelligence have developed significantly\
    \ in the retail finance field. Personal behavior on the internet, and even most\
    \ behaviors and habits in daily life, have been digitized. Based on so much data,\
    \ corresponding AI models can be established. This is the fundamental reason for\
    \ the high convenience of personal credit over the past 10 years.\n\nIn comparison,\
    \ the degree of automation and digitalization of enterprises is still relatively\
    \ low. It is very difficult for SMEs to obtain loans. Financial institutions often\
    \ base loans to SMEs on the analysis and judgment of the business owner's personal\
    \ behavior and personal credit. Therefore, it is particularly important to digitize\
    \ and record all processes of the enterprise.\n\nXiaomi has many small retailers\
    \ who need funds to purchase goods, but many banks are unwilling to lend to these\
    \ small shops. The reason is that banks cannot grasp the true whereabouts of the\
    \ funds, nor can they determine whether the collateral is safe and reliable. The\
    \ fundamental cause of this situation is that inventory has not been well digitized.\
    \ So we provided these small shops with a \"Smart Drawer\" solution. Simply put,\
    \ when you put goods into the \"Smart Drawer,\" it can automatically identify\
    \ the quality, quantity, and value of the goods. When consumers purchase, the\
    \ goods can be automatically retrieved, and the entire process is digitally recorded\
    \ in the background. Financial institutions can use this system to understand\
    \ the quantity and value of inventory at any time and provide corresponding credit\
    \ lines to enterprises.\n\nXiaomi has invested in many smart hardware manufacturing\
    \ enterprises. When they complete product development, they often face huge funding\
    \ gaps. These enterprises need hundreds of millions of yuan to purchase components\
    \ from upstream companies, and purchase OEM and warehousing services, until retailers\
    \ pay back, then funds flow back. An enterprise that only has an order finds it\
    \ difficult to get a bank loan; most of the time, they can only obtain the first\
    \ working capital through equity financing, which comes at a high cost to the\
    \ enterprise.\n\nBased on our understanding of these enterprises' business models,\
    \ we can fully digitize the entire business process: how many parts are needed,\
    \ from whom to procure, who to cooperate with for manufacturing, warehousing and\
    \ transportation conditions, product sales channels, and remittance situations.\
    \ These data are automatically collected and entered into the information system,\
    \ realizing digitalization. With this foundation, a very detailed order management\
    \ system can be created. Financial institutions can understand the accurate information\
    \ they need based on this system and issue loans to enterprises. Banks are not\
    \ unwilling to lend; rather, highly asymmetric information prevents banks from\
    \ seeing the real situation of enterprises. What we need to do is to turn the\
    \ \"visual black hole\" into a \"white box\" through enterprise digitalization.\
    \ We believe that in the fields of corporate credit and industrial finance, after\
    \ enterprises are fully digitized, the opportunities for AI development will be\
    \ huge.\n\n---\n\n# Intelligent Connectivity, Unleashing New Momentum for the\
    \ Auto Industry\n\n**Wang Xiaoqiu**  \nPresident, SAIC Motor Corporation Limited\n\
    \n![](img/txt036_1.jpg \"pagenumber_ebook=266,pagenumber_book=250\")\n\nDoctor\
    \ of Engineering, Senior Engineer (Professor Level). Has long been engaged in\
    \ automobile quality, technology, procurement, and other management work, with\
    \ rich management experience in joint-venture whole vehicles, parts, and independent\
    \ brand automobile enterprises. Since 2006, has served as General Manager of SAIC\
    \ Passenger Vehicle Branch, General Manager of Shanghai Diesel Engine Co., Ltd.,\
    \ General Manager of SAIC-GM, Vice President of SAIC Group and General Manager\
    \ of Passenger Vehicle Branch, Director of Technical Center. Currently serves\
    \ as President of SAIC Motor Corporation Limited.\n\n![](img/txt036_2.jpg \"pagenumber_ebook=267,pagenumber_book=251\"\
    )\n\nNew-generation information technologies such as artificial intelligence,\
    \ big data, and cloud computing are important engines driving the technological\
    \ revolution and industrial transformation. In the future, the continuous maturity\
    \ of technologies such as 5G and artificial intelligence will surely accelerate\
    \ the leap of the economy and society from \"networking\" to \"intelligence.\"\
    \ Particularly, the global auto industry is currently facing unprecedented changes\
    \ in a century, the domestic auto industry is undergoing a major adjustment not\
    \ seen in many years, and the sudden COVID-19 pandemic has become a catalyst for\
    \ the formation of a new landscape in the auto industry. Accelerating the deep\
    \ integration of new technologies such as AI with the auto industry, and continuously\
    \ stimulating new momentum, will be an intrinsic requirement for the transformation,\
    \ upgrading, and leapfrog development of the auto industry, and an important way\
    \ to build a \"better automotive life.\"\n\n## From the Perspective of Consumption\
    \ Changes: New Technologies such as AI Will Drive Continuous \"Quality Upgrade\"\
    \ of Auto Products and Services\n\nIn the future, people's travel will not only\
    \ aim at \"arrival\" but pay more attention to the \"experience\" of the process.\
    \ For example, SAIC Motor (hereinafter referred to as \"SAIC\") is developing\
    \ a brand-new intelligent cockpit integrating 5G technology based on the V2X (Vehicle-to-Everything)\
    \ system, thereby realizing the vehicle's active sensing of drivers and passengers\
    \ and deep interaction between them, making the car truly an intelligent, intimate\
    \ mobile terminal. At the same time, this pandemic has changed residents' consumption\
    \ habits to a certain extent, accelerated the development of the online economy,\
    \ and forced traditional auto companies to accelerate their transformation to\
    \ online development. During the Shanghai \"5.5 Shopping Festival,\" SAIC drew\
    \ on the experience and practices of internet companies to move new product launches\
    \ online, actively exploring new models of digital marketing for automobiles.\n\
    \n## From the Perspective of Technology Development: The Change of \"Software-Defined\
    \ Vehicle\" Is Accelerating\n\nSoftware is not only the core driving the development\
    \ of automobiles in the direction of \"electrification\" and \"intelligent connectivity,\"\
    \ but also the key to determining the differentiation of future automotive products\
    \ and services. For this reason, SAIC established a Software Center at the end\
    \ of 2019 to accelerate the continuous upgrading of businesses such as autonomous\
    \ driving and mobile travel. SAIC is independently developing a dedicated EV platform\
    \ and a new-generation electrical/electronic architecture integrating \"Vehicle\
    \ Central Brain + Domain Controllers,\" and collaborating with leading domestic\
    \ and foreign chip R&D companies to create customized chips. At the same time,\
    \ it continues to improve the core capability construction of four major centers:\
    \ AI, big data, cloud computing, and V2X information security, laying the foundation\
    \ for SAIC to accelerate the landing of software technology applications in products\
    \ and services.\n\n## From the Perspective of Achievement Transformation: National\
    \ and Local Support Will Provide \"Empowerment\" for the Accelerated Landing of\
    \ New Technologies such as AI in the Auto Industry\n\nIn the past two years, the\
    \ state has issued a series of guiding opinions to support the innovative development\
    \ of intelligent connected vehicles, creating a good development environment.\
    \ As one of the pioneers of domestic intelligent connected vehicles, SAIC is also\
    \ exploring a technical route for intelligent driving that is technically reliable,\
    \ cost-feasible, and safety-controllable. SAIC has completed the development of\
    \ three generations of intelligent driving platforms, with actual vehicle road\
    \ test mileage reaching nearly 300,000 kilometers, and virtual simulation test\
    \ mileage reaching nearly 20 million kilometers, and has established an \"anthropomorphic\"\
    \ control knowledge base and learning model for intelligent driving. SAIC is leading\
    \ the formulation of the plan for the \"Settlement in Shanghai\" of the National\
    \ Intelligent Connected Vehicle Yangtze River Delta Innovation Platform. The Yangtze\
    \ River Delta region has unique advantages for developing intelligent connected\
    \ vehicles, whether in terms of hardware such as economic aggregate, industrial\
    \ scale, and transportation network, or software such as talent quality and digital\
    \ economy. SAIC will continue to leverage its own industrial advantages, starting\
    \ from Shanghai and creating demonstration zones in multiple cities in the Yangtze\
    \ River Delta, realizing the landing of application scenarios such as Robotaxi,\
    \ further accelerating the commercial application of intelligent driving technological\
    \ innovation achievements, assisting the construction of smart transportation\
    \ in the Yangtze River Delta, and meeting the needs of the vast number of consumers\
    \ for convenient travel and a better life.\n\nThis global pandemic has brought\
    \ a huge impact to the world auto industry, but it has also made us see the important\
    \ significance of the automobile as an important intelligent mobile space for\
    \ urban travel life. No matter how the city changes, bustling traffic is the \"\
    vitality\" of the city, and smart mobile travel can make the beauty of the world\
    \ interlock.\n\n---\n\n# AI Building Future Logistics: How the Port of Hamburg\
    \ Embraces Digitalization and AI\n\n**Angela Titzrath**  \nChairwoman of the Executive\
    \ Board, Hamburger Hafen und Logistik AG (HHLA)\n\n![](img/txt037_1.jpg \"pagenumber_ebook=270,pagenumber_book=254\"\
    )\n\nAfter graduating from Ruhr University Bochum with degrees in Economics and\
    \ Romance Languages, she began her career as Head of Operations and Strategic\
    \ Controlling at Mercedes-Benz in Rome. From 1991 to 2012, she held several international\
    \ senior management positions at Daimler Group, including CEO of Mercedes-Benz\
    \ Financial Services Canada, Managing Director of Mercedes-Benz Financial Services\
    \ North America, and Managing Director of Mercedes-Benz Bank Europe. In 2002,\
    \ she served as Commercial Managing Director at the Mercedes-Benz production plant\
    \ in Spain, subsequently becoming a member of the Global Executive Board of Daimler\
    \ Buses. In 2012, she was appointed to the Executive Board of Deutsche Post DHL\
    \ Group, primarily responsible for global human resources management within the\
    \ group until 2014. Since October 1, 2016, she has been a member of the Executive\
    \ Board of Hamburger Hafen und Logistik AG (HHLA) (a listed European logistics\
    \ leader), and has served as Chairwoman of the Executive Board since January 1,\
    \ 2017.\n\n![](img/txt037_2.jpg \"pagenumber_ebook=271,pagenumber_book=255\")\n\
    \nThe World Artificial Intelligence Conference was successfully held despite the\
    \ impact of the pandemic, which is an encouraging signal. Especially as the world\
    \ is going through difficult times, the exchange of transnational perspectives\
    \ is becoming increasingly important; only through cooperation and interconnection\
    \ can we overcome difficulties, for example in health protection and addressing\
    \ climate challenges. I will introduce how HHLA in Hamburg, Germany, embraces\
    \ digitalization and AI.\n\nHHLA has more than 6,000 employees and is a leading\
    \ European logistics group. The city of Hamburg has always emphasized that its\
    \ global reputation and prosperity come from the Port of Hamburg; the Port of\
    \ Hamburg is our lifeline. All of HHLA's ships dock at this port, so containers\
    \ determine the scale of this city's development, just like our red-brick warehouses.\n\
    \nIt is not luck that keeps us thriving; continuous experimentation and innovation\
    \ are the most critical factors. 135 years ago, HHLA built the world's largest\
    \ warehousing center, but nearly a hundred years later, this center became obsolete\
    \ because containers replaced the original mode of cargo transport. In 1968, Hamburg\
    \ welcomed its first container ship, which redefined the way and space of logistics.\
    \ In the following years, HHLA participated in shaping the container industry,\
    \ building Hamburg's container terminals into the most highly automated terminals\
    \ in the world, and setting standards widely adopted globally for container handling\
    \ and operations.\n\nA forward-looking company cannot turn a blind eye to new\
    \ technologies and technological changes. HHLA continues to seek entirely new\
    \ solutions to problems. What comes after containers? Our goal is to develop digital\
    \ and logistics hubs together with our customers. The world will change rapidly;\
    \ transport and logistics will be more closely integrated in the future. Large\
    \ data packets will travel on data routes, just like traditional goods are transported\
    \ on sea, land, and air routes. Now the entire economy still operates mainly in\
    \ traditional ways, so the punctuality and reliability of delivery remain key.\n\
    \nDigitalization provides us with many opportunities to better integrate cargo\
    \ flows and data effectively. HHLA is implementing its own digital strategy, hoping\
    \ to become an engine of digital transformation. In HHLA's view, AI can increase\
    \ production capacity and terminal operational efficiency.\n\nIn the past, we\
    \ could not predict the pickup time of stored containers; in the future, computers\
    \ will use algorithms integrated with historical data to calculate the probable\
    \ pickup time of containers, and continuously self-optimize through machine learning\
    \ algorithms. AI algorithms can also predict delivery times more accurately, precisely\
    \ calculate the position of containers in transit, and whether they are on trucks,\
    \ ships, or trains. With the help of AI, we can predict the service life of container\
    \ crane components, and accurately predict the time a ship berths at the quay\
    \ bridge to enable precise lifting operations. After an HHLA terminal in the Port\
    \ of Hamburg applied AI prediction, storage efficiency increased significantly,\
    \ because AI can accurately predict container pickup times, avoiding repeated\
    \ handling of containers during their stay in the warehouse, thereby optimizing\
    \ terminal operational efficiency. We used the same solution at another port in\
    \ Hamburg, and more traditional terminals will use such technology in the future.\n\
    \nThe Port of Hamburg is located in the center of the city of Hamburg, so protecting\
    \ the environment and climate becomes even more important. We use natural resources\
    \ very carefully. HHLA's goal is to achieve Climate Neutrality by 2040. In 2019,\
    \ the CTA terminal at the Port of Hamburg became the world's first climate-neutral\
    \ container terminal. For HHLA, digital and technological innovation is at the\
    \ center of sustainable development solutions; AI will play an important role.\
    \ Digitalization is changing our industry and our port.\n\n---\n\n# Connection\
    \ · Integration\n\n## 5G Makes AI More Ubiquitous, AI Makes 5G Smarter\n\n**Dong\
    \ Xin**  \nGeneral Manager, China Mobile Communications Group Co., Ltd.\n\n![](img/txt039_1.jpg\
    \ \"pagenumber_ebook=276,pagenumber_book=260\")\n\nDirector and General Manager\
    \ of China Mobile Communications Group Co., Ltd. Graduated from Beijing University\
    \ of Posts and Telecommunications majoring in Postal Management, Master of Financial\
    \ Management from Australian National University, PhD in Business Administration\
    \ co-run by Shanghai Jiao Tong University and France's Rennes School of Business.\
    \ Formerly worked in the Finance Department of the Ministry of Posts and Telecommunications,\
    \ and the Economic Regulation and Telecommunications Settlement Department of\
    \ the Ministry of Information Industry. Served as General Manager of Finance Department\
    \ and Planning Department of China Mobile, Chairman and General Manager of China\
    \ Mobile Hainan, Henan, and Beijing companies. Also serves as Vice President of\
    \ the Council of China Communications Enterprises Association, Standing Committee\
    \ Member of China National Defense Postal Union, and Director of China Tower Corporation\
    \ Limited.\n\n![](img/txt039_2.jpg \"pagenumber_ebook=277,pagenumber_book=261\"\
    )\n\n5G and AI have become strategic technologies leading a new round of technological\
    \ revolution and industrial transformation, and are important components of new\
    \ infrastructure construction. The two integrate and promote each other, achieving\
    \ win-win and symbiosis, accelerating the digital transformation of the economy\
    \ and society. With the acceleration of 5G network construction and the collaborative\
    \ operation of infrastructure such as cloud, edge, and terminal, the Internet\
    \ of Everything and data aggregation will be effectively promoted, which greatly\
    \ lowers the threshold for AI use and comprehensively promotes the deep integration\
    \ of AI into economic and social development.\n\nBy 2025, the global AI market\
    \ size is expected to exceed 6 trillion US dollars, indicating that 5G will make\
    \ AI more ubiquitous. As AI becomes the core application carried by 5G networks,\
    \ the intelligent evolution of 5G networks and infrastructure such as cloud, edge,\
    \ and terminal will greatly accelerate, and the comprehensive effectiveness of\
    \ cloud-network will be maximized. We can expect AI to make 5G smarter. One can\
    \ imagine that the integration of 5G and AI will trigger a chain reaction, producing\
    \ a multiplier effect, accelerating the Internet of Everything, the Perception\
    \ of Everything, and the Intelligence of Everything, and having a profound impact\
    \ on the digital transformation of the economy and society.\n\n### In Digital\
    \ Life\n\n\"High-Speed Connection + Sensory Intelligence\" will give rise to new\
    \ human-computer interaction applications. Visual, auditory, and tactile intelligence\
    \ will rapidly penetrate personal wearables and home devices, presenting a rich\
    \ and colorful smart life.\n\n![](img/txt039_3.jpg \"pagenumber_ebook=278,pagenumber_book=262\"\
    )\n\n> **\"High-Speed Connection + Sensory Intelligence\" Gives Rise to New Human-Computer\
    \ Interaction Applications**\n\n### In Digital Production\n\n\"Reliable Connection\
    \ + Specialized Intelligence\" will give rise to new forms of intelligent manufacturing.\
    \ With the characteristics of high reliability and low latency, 5G will integrate\
    \ discrete networks in various fields of industrial production, promote the deep\
    \ integration of AI into the entire process and all links of manufacturing, and\
    \ significantly improve the production efficiency of traditional industries.\n\
    \n![](img/txt039_4.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n> **\"\
    Reliable Connection + Specialized Intelligence\" Gives Rise to New Forms of Intelligent\
    \ Manufacturing**\n\n### In Digital Governance\n\n\"Wide-Area Connection + General\
    \ Intelligence\" will give rise to new models of smart governance. The ultra-large-scale\
    \ connection feature of 5G will promote online interconnection in various fields\
    \ such as education, medical care, and transportation, accelerate the full circulation\
    \ and efficient utilization of data elements, support AI deep learning, and promote\
    \ the transformation of social governance in the direction of collaboration, precision,\
    \ and efficiency. For example, in the process of fighting the epidemic, based\
    \ on communication, transportation, medical, and other data, AI became a \"magic\
    \ weapon\" for tracing personnel movement trajectories and analyzing health status.\n\
    \n![](img/txt039_5.jpg \"pagenumber_ebook=279,pagenumber_book=263\")\n\n> **\"\
    Wide-Area Connection + General Intelligence\" Gives Rise to New Models of Smart\
    \ Governance**\n\nLooking to the future, China Mobile will seize the opportunity\
    \ of the integrated development of digitalization, grid-based management, and\
    \ intelligence, leverage its own network, user scale, and massive data advantages,\
    \ vigorously promote the large-scale application and value innovation of 5G+AI,\
    \ and strive to promote the deep integration of the digital economy and the real\
    \ economy, stimulating new momentum for high-quality development.\n\n#### First,\
    \ Realize Large-Scale Commercial Value of AI\n\nThe main vision is: focusing on\
    \ the development of the digital economy, combining livelihood security, and accelerating\
    \ the large-scale expansion of 5G+AI. For the general public, empower businesses\
    \ such as cloud gaming, multi-form live streaming, and cloud XR to provide immersive\
    \ entertainment experiences. For millions of households, empower applications\
    \ such as smart home, precise video push, and 3D motion-sensing games to create\
    \ a smart and beautiful life. For all industries, provide intelligent solutions\
    \ such as security monitoring, intelligent inspection, industrial quality inspection,\
    \ and smart medical imaging to assist industrial upgrading, product development,\
    \ and service innovation.\n\n#### Second, Realize Large-Scale Technical Value\
    \ of AI\n\nThe main vision is: on the one hand, comprehensively layout ubiquitous\
    \ AI infrastructure, build a world-leading intelligent cloud network, integrate\
    \ AI into the full production cycle of 5G network planning, construction, optimization,\
    \ and operation & maintenance, build an open innovation platform for network intelligence,\
    \ promote the application and large-scale deployment of network intelligence,\
    \ and make 5G networks \"smarter.\" Integrate AI into Mobile Cloud, and promote\
    \ large-scale computing power construction. In 2020, China Mobile will provide\
    \ intelligent cloud solutions to industry partners. On the other hand, build an\
    \ open and shared intelligent middle platform, construct an \"Ability as a Service\
    \ (AaaS)\" system, accumulate and aggregate general mature capabilities from inside\
    \ and outside the enterprise, lower thresholds, improve efficiency, make innovation\
    \ more open, convenient, and efficient, and make AI applications flourish.\n\n\
    ![](img/txt039_6.jpg \"pagenumber_ebook=280,pagenumber_book=264\")\n\n> **Constructing\
    \ the Ability as a Service (AaaS) System**\n\n#### Third, Realize Large-Scale\
    \ Social Value of AI\n\nOur main vision is: fulfill the responsibilities of a\
    \ central enterprise, strengthen key core technology research through joint innovation\
    \ of industry, academia, and research, deepen industrial openness, cooperate for\
    \ win-win results, promote more AI chips, capabilities, and applications to mature\
    \ and become commercially available, and accelerate industrial prosperity. China\
    \ Mobile positions itself as a new smart city operator, strengthen the deep integration\
    \ of AI with all aspects of social governance such as medical care, education,\
    \ transportation, environmental protection, and emergency command, eliminate digital\
    \ barriers and information silos, make social governance more scientific and efficient,\
    \ and people's lives more intelligent and convenient.\n\n---\n\n# 5G+AI Opening\
    \ an Intelligent Connected Future\n\n**Cristiano Amon**  \nPresident, Qualcomm\
    \ Technologies (QCT)\n\n![](img/txt040_1.jpg \"pagenumber_ebook=282,pagenumber_book=266\"\
    )\n\nPresident of Qualcomm Technologies, member of the Executive Committee, fully\
    \ responsible for Qualcomm's semiconductor business. Previously served as Co-President\
    \ of QCT for three years. Prior to serving as Co-President of QCT, was Senior\
    \ Vice President of Product Management at QCT, responsible for the company's wireless\
    \ chip product portfolio. Joined Qualcomm as an engineer in 1995, and subsequently\
    \ held various business and technology leadership positions in the company. Before\
    \ joining Qualcomm, served as CTO of Brazilian wireless operator Vésper, and worked\
    \ at NEC, Ericsson, and Velocom. Holds a B.S. in Electrical Engineering from the\
    \ University of Campinas (UNICAMP), São Paulo, Brazil.\n\n![](img/txt040_2.jpg\
    \ \"pagenumber_ebook=283,pagenumber_book=267\")\n\nFor the entire industry, now\
    \ is an exciting moment. We are entering a new era of intelligent cloud connectivity\
    \ driven by AI and 5G. Everything will be connected to the cloud and interconnected\
    \ in a reliable manner. Terminals and experiences are inseparable from the content,\
    \ data, computing power, and storage in the cloud. 5G provides fiber-like connection\
    \ speeds and low latency, coupled with advanced processing capabilities, providing\
    \ the foundation for all this, making our edge terminals more intelligent. The\
    \ combination of 5G and AI will affect all aspects of our lives and many industries;\
    \ this is the next major technological transformation.\n\nTo achieve AI at scale,\
    \ we must realize distributed intelligence across the entire network. Today, intelligence\
    \ is widely distributed in the cloud and is gradually migrating to the terminal\
    \ side. In the future, massive data from billions of edge terminals will require\
    \ us to create an entirely new edge cloud. In this new edge cloud, the processing\
    \ of content and control will move to where the traffic is generated. Now, the\
    \ edge cloud and 5G can reduce latency and empower new applications and services;\
    \ we will see improvements in performance, security, and privacy protection.\n\
    \nThe combination of edge cloud and on-device AI will also help enable a wider\
    \ range of entirely new applications. For us, because of the realization of more\
    \ intuitive, immersive, and contextual experiences, such as from interactive content\
    \ to boundless virtual reality, or real-time voice translation, life will be more\
    \ colorful. The combination of 5G and AI with the edge cloud will also positively\
    \ and disruptively drive enterprise innovation in more industries. You will see\
    \ that by utilizing massive data generated by intelligent machines and objects,\
    \ people can perform local real-time network analysis, promote business insights,\
    \ raise productivity to a whole new level, and bring better automation and control\
    \ levels.\n\nThis trend will also change the way we look at terminals, because\
    \ relative to operating systems and app stores, the cloud will play a greater\
    \ role. Imagine a terminal that is always online and obtains nearly unlimited\
    \ storage space and processing power from the cloud. The realization of this scenario\
    \ will drive the emergence of more powerful and potential applications. When we\
    \ look at today's WeChat, QQ, and other applications, we already realize that\
    \ the evolution speed of applications is so fast, and future application functions\
    \ will be more powerful and independent of the operating system. When people can\
    \ reliably connect terminals and the cloud, there is no need to develop applications\
    \ separately for multiple operating systems.\n\n## 5G and AI Will Transform Many\
    \ Vertical Fields and Industries\n\nUtilizing technologies such as 5G and AI,\
    \ intelligent online education can become richer and more inclusive. Online education\
    \ will be able to support differentiated and personalized learning; technologies\
    \ such as real-time translation will allow students to access content from global\
    \ education databases and learn in their own languages. As of April 2020, a total\
    \ of 1.7 billion students worldwide had adopted remote learning, which made the\
    \ digital divide caused by the gap in broadband network connections more prominent,\
    \ but 5G can change this situation. Once equipped with 5G and edge cloud capabilities,\
    \ a new learning experience anytime, anywhere, and high-quality interactive content\
    \ can be realized, building a more productive and smarter society.\n\n"
