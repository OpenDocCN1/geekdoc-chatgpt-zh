  trans: "\n\n# Summary and Outlook: Trustworthy AI and Theoretical Foundations of\
    \ Deep Learning\n\nTo summarize, we should become the insignificant intelligent\
    \ autonomous machines among us, and this will certainly have a significant impact\
    \ on society. AI also involves other fields such as economics, ethics, military,\
    \ superintelligence, etc. AI researchers have also realized their responsibility\
    \ to develop safe, reliable, and ethical AI systems, encouraging the development\
    \ of successors. For example, the Future of Life Institute funded by Elon Musk,\
    \ founded by Max Tegmark, conducts research on AI safety projects. The US National\
    \ Science Foundation currently also incorporates AI safety requirements into its\
    \ research projects. Finally, I would like to conclude with another important\
    \ milestone event. The Association for the Advancement of Artificial Intelligence\
    \ (AAAI) and \"Squirrel AI\" jointly announced the Nobel Prize of the AI world:\
    \ the \"Squirrel AI\" Award — Artificial Intelligence for the Benefit of Humanity.\
    \ Squirrel AI sponsors $1 million annually to scientists worldwide in the field\
    \ of AI, focusing on those whose work can be commercially applied and make significant\
    \ positive contributions to humanity and their lives — that is, they can protect,\
    \ enhance, and improve human life in a beneficial way with long-term impact. This\
    \ award was officially launched in 2020.\n\n---\n\n# Foreseeing Trustworthy AI\
    \ — Discussion on Theoretical Foundations of Deep Learning\n\n**Dacheng Tao**\
    \  \nFellow of the Australian Academy of Science, Professor at the University\
    \ of Sydney, Director of the UBTECH Sydney AI Centre\n\n![](img/txt013_1.jpg \"\
    pagenumber_ebook=93,pagenumber_book=77\")\n\nHe received his Bachelor's degree\
    \ from the University of Science and Technology of China, his Master's degree\
    \ from the Chinese University of Hong Kong, and his Ph.D. from the University\
    \ of London. After graduation, he taught successively at the Hong Kong Polytechnic\
    \ University, Nanyang Technological University in Singapore, and the University\
    \ of Technology Sydney. He currently serves as a Professor at the University of\
    \ Sydney and Director of the UBTECH Sydney AI Centre. His main research focuses\
    \ on Artificial Intelligence. He has published over 200 papers in authoritative\
    \ journals and major conferences, including various IEEE Transactions, top-tier\
    \ journals, and conferences; and has won Best Paper Awards multiple times. He\
    \ received the Australian Eureka Prize and the UTS Chancellor's Medal in 2015,\
    \ and the IEEE ICDM Research Contribution Award in 2018. Due to his research contributions\
    \ in the field of AI, he has been elected Fellow of IEEE/AAAS/ACM, Foreign Member\
    \ of the Academia Europaea, and Fellow of the Australian Academy of Science.\n\
    \n---\n\n## The Automation Revolution and Trust Crisis Brought by Deep Learning\n\
    \nI am very pleased to have the opportunity to share our understanding of the\
    \ trustworthiness issues in AI. Deep learning has brought an automation revolution\
    \ to many fields, such as computer vision, natural language processing, speech\
    \ recognition, etc. Our research work mainly focuses on deep learning and its\
    \ applications in computer vision.\n\nWe can see that with deep learning, many\
    \ computer vision tasks that we previously found very difficult have now become\
    \ very easy. Deep learning algorithms are very stable and efficient, meeting the\
    \ needs of many practical situations to a certain extent. However, in many scenarios\
    \ with high requirements for AI algorithm safety, a tiny error could lead to a\
    \ fatal disaster.\n\nDue to the lack of suitable theoretical foundations for existing\
    \ algorithms, we do not know why these algorithms succeed, when they will fail,\
    \ or how high the probability of failure is. Coupled with some challenges encountered\
    \ in application domains, our trust in AI continues to decrease. So, how to solve\
    \ this problem? This requires us to establish a complete theoretical foundation\
    \ for AI.\n\n---\n\n## Progress in Current AI Foundational Theories\n\nFirst,\
    \ let's discuss the progress in current AI foundational theories, focusing mainly\
    \ on the deep learning part. There are two main reasons: first, the foundational\
    \ theories of traditional machine learning are relatively mature and complete;\
    \ second, deep learning has dominated the third AI boom and driven many practical\
    \ applications, but currently, the foundational theories of deep learning are\
    \ still in their infancy. The success of deep learning is mainly built upon experiments,\
    \ and it currently lacks a solid theoretical foundation. So, why are we so confident\
    \ in using deep learning?\n\n### Why Theoretical Analysis of Deep Learning Algorithms\
    \ is Difficult\n\nHere I quote a statement by Professor Tomaso Poggio from MIT:\
    \ \"We once needed more training data than model parameters to get a meaningful\
    \ fit.\" What about deep learning? Let me make a comparison, see the figure below:\
    \ the left side shows the best-performing neural network in 2017, with tens of\
    \ millions of parameters; the right side shows a commonly used dataset now. The\
    \ first is the CORD-19 database, with only 6,000 data points; most datasets only\
    \ have tens of thousands of data points. ImageNet is considered a relatively large\
    \ database, but it only has over 10 million data points. So, even for a database\
    \ like ImageNet, the data volume is very small relative to the parameters of deep\
    \ learning.\n\n![](img/txt013_2.jpg \"pagenumber_ebook=95,pagenumber_book=79\"\
    )\n\nThen, why does deep learning perform so well under such over-parameterization?\
    \ Some works analyze neural networks from the perspective of model capacity and\
    \ complexity. We know that if a model's capacity or complexity is small, its generalization\
    \ ability is guaranteed. This is what traditional statistical learning theory\
    \ tells us. If we can prove that the capacity or complexity of a deep learning\
    \ model is not directly related to the number of parameters, then to a certain\
    \ extent we can clearly explain why deep learning is so successful.\n\n---\n\n\
    ## Analysis Based on Model Capacity and Complexity\n\n### VC Dimension Analysis\n\
    \nFirst, let's look at VC Dimension. VC Dimension is a common tool for measuring\
    \ complexity in traditional machine learning. In 2017, Harvey et al. analyzed\
    \ the generalization performance of neural networks from the perspective of VC\
    \ Dimension and obtained two upper bounds[¹]. We found that the upper bound of\
    \ VC Dimension is directly related to the number of model parameters, which makes\
    \ the upper bound of generalization error very large, even larger than the maximum\
    \ value of the loss function; such an upper bound loses its meaning. This work\
    \ shows that the VC Dimension path might be arduous, but we think this work is\
    \ still very valuable. It tells us that we need to further explore the foundational\
    \ theories of deep learning.\n\n### Rademacher Complexity\n\nHow about Rademacher\
    \ Complexity? In 2018, Golowich et al. derived a generalization error upper bound\
    \ from the perspective of Rademacher Complexity. This upper bound is not directly\
    \ related to the model scale, but it is related to the norm of model parameters\
    \ and the network depth. This also makes the upper bound of generalization error\
    \ relatively large[²].\n\n### Fisher-Rao Norm and Matrix-1 Norm\n\nIn 2019, Liang\
    \ et al. explored the Fisher-Rao Norm. Their work showed that the Fisher-Rao Norm\
    \ has many good properties, such as invariance under certain reparameterization\
    \ processes and some special advantages over other complexity measures[³]. In\
    \ our work at the International Conference on Learning Representations (ICLR)\
    \ this year, we also used the Fisher-Rao Norm and Matrix-1 Norm to prove the upper\
    \ bound of the generalization error of RNN networks[⁴]. The Fisher-Rao Norm and\
    \ Matrix-1 Norm can effectively help us control the scale of the upper bound.\
    \ The term related to model scale in our upper bound is `the inverse of the minimum\
    \ eigenvalue of the product of x transpose and x`. This term gives us an inspiration\
    \ — adding some noise to the training samples can improve the model's generalization\
    \ ability. At the same time, we cannot add too much noise, because this term would\
    \ make the training error relatively large. Our Fisher-Rao Norm relies on a structured\
    \ lemma about gradients, which states that the norm of parameters can be controlled\
    \ by the magnitude of gradients. This lemma and the Fisher-Rao Norm help us effectively\
    \ characterize the impact of gradients on the generalization ability of deep learning\
    \ models, helping us understand the relationship between generalization ability\
    \ and training ability, and further helping us understand the impact of weight\
    \ decay and gradient clipping on generalization ability.\n\n![](img/txt013_3.jpg\
    \ \"pagenumber_ebook=97,pagenumber_book=81\")\n\n### The Paradox of Over-parameterization\
    \ and Generalization Ability\n\nGeneralization error upper bounds based on model\
    \ capacity and complexity usually indicate that small models have better generalization\
    \ ability, but deep learning experiments and performance are not entirely consistent.\
    \ Neyshabur et al.'s work in 2015[⁵], and Novak's work in 2018[⁶] both used experiments\
    \ to show that large networks not only have good test performance, but generalization\
    \ performance also improves as the network grows larger. This point also supports\
    \ the current trend. Companies are trying every means to increase the depth and\
    \ scale of networks. Canziani et al. statistics on some competition model scales\
    \ found that the depth of winning models is increasing year by year[⁷], and students\
    \ who often participate in competitions probably feel the same way.\n\n---\n\n\
    ## Generalization Error Upper Bounds Based on Information Theory\n\nCurrently,\
    \ our work starts from the perspective of information theory and obtains a generalization\
    \ error upper bound. Our theoretical analysis also supports previous empirical\
    \ observations. It is mainly based on the following three aspects.\n\nFirst, unlike\
    \ traditional shallow learning models — such as Support Vector Machines — deep\
    \ neural networks possess a hierarchical feature mapping structure. Is this the\
    \ key to helping us avoid overfitting under high complexity? Our work answers\
    \ this question affirmatively[⁸]. The hierarchical structure is the key to guaranteeing\
    \ the generalization ability of deep neural networks.\n\nSecond, traditional generalization\
    \ error upper bounds are estimated through the complexity of the model's function\
    \ space, such as VC Dimension and Rademacher Complexity. This estimation ignores\
    \ the data distribution itself and considers the worst-case scenario in the model's\
    \ function space. Therefore, the estimation of the generalization error upper\
    \ bound becomes relatively loose for deep models with large function spaces. In\
    \ practice, however, the model's generalization ability is related to the data\
    \ distribution. Inspired by recent work in information theory and adaptive data\
    \ analysis, we can use the Mutual Information between the features learned by\
    \ the neural network and the parameters of the last layer as the generalization\
    \ error upper bound. Intuitively, the less the network output depends on the input,\
    \ the stronger its generalization ability.\n\nThird, inspired by the Strong Data\
    \ Processing Inequality in information theory, as long as the mapping of each\
    \ layer of the network is irreversible — for example, using ReLU activation functions,\
    \ convolution, and pooling — the Mutual Information between the features learned\
    \ by the network and the parameters of the last layer will decrease as the number\
    \ of layers increases.\n\nTherefore, the deeper the network, the stronger the\
    \ model's generalization ability. However, as the number of network layers increases,\
    \ information useful for data fitting may be lost during the mapping process.\
    \ In such cases, the training dataset fitting error will increase. Therefore,\
    \ although the generalization ability of deeper networks gradually increases,\
    \ to ensure the overall network performance is good, it is still necessary to\
    \ guarantee that the training fitting error is sufficiently small.\n\n---\n\n\
    ## SGD Optimization Process and PAC-Bayes Theory\n\nFrom the current progress,\
    \ the path based on model capacity is still very difficult. Because the capacity\
    \ of neural networks is huge, they even have universal approximation capabilities.\
    \ Three independent works in 1989 simultaneously proved that the Universal Approximation\
    \ Theorem holds for infinitely wide multi-layer networks[⁹][¹⁰][¹¹]. Hornik et\
    \ al. proved in 1993 that infinitely wide single-layer networks also have the\
    \ Universal Approximation Theorem[¹²]. In 2017, Lu et al. proved that finite-width\
    \ networks also have the Universal Approximation Theorem[¹³]. In 1993, Funahashi\
    \ and Nakamura proved that RNNs can approximate arbitrary sequences[¹⁴]. Lu and\
    \ Lu recently proved that neural networks can fit arbitrary distributions[¹⁵].\
    \ These examples all show that if parameters can be chosen arbitrarily, the capacity\
    \ of neural networks would be huge, but the question is: can parameters be chosen\
    \ arbitrarily?\n\nCurrently, neural network parameters are basically learned through\
    \ the Stochastic Gradient Descent algorithm (SGD), so obviously the parameters\
    \ are not completely random. Therefore, SGD might be the key to solving this problem.\
    \ The hypothesis space of the neural network itself is large, but SGD only explores\
    \ a part of the space, which makes the part actually output to the hypothesis\
    \ space not that large. Recent articles, including our paper at the 2019 Conference\
    \ on Neural Information Processing Systems (NeurIPS), pointed out that the SGD\
    \ optimization process and the formed path can be represented by Partial Differential\
    \ Equations (PDEs)[¹⁶]. The SGD optimization process — the parameters at time\
    \ t+1 minus the parameters at time t, equals the learning rate times the gradient\
    \ — is a PDE.\n\nSince the \"batch\" is random and initialization is random, modeling\
    \ the gradient introduces a lot of noise. That is, the gradient equals the average\
    \ gradient over the entire dataset plus an uncertain noise, which is usually assumed\
    \ to be Gaussian distributed. Recently, people have also been exploring what distribution\
    \ is more suitable for modeling. Therefore, the PDE becomes a Stochastic Partial\
    \ Differential Equation. So the stochastic PDE of parameters with respect to time\
    \ t can be represented by an O-U process. We know that the SGD optimization path\
    \ can be modeled by an O-U process.\n\nSpecifically, the stationary distribution\
    \ of this stochastic process is used to model the model learned by the SGD algorithm,\
    \ and then we can use PAC-Bayes theory to obtain a generalization error upper\
    \ bound. Our conclusion also gives a positive correlation between generalization\
    \ ability and the ratio of learning rate to batch size. This relationship also\
    \ shows that hyperparameter tuning follows patterns. We trained 1,600 models on\
    \ CIFAR-10 and CIFAR-100 based on the network structures ResNet-110 and VGG-19\
    \ to verify this positive correlation. We collected the test accuracy of all models\
    \ for analysis, where each small plot is drawn from 20 models. We use test accuracy\
    \ to represent generalization ability because training accuracy is almost 100%.\
    \ The left side shows the relationship between test accuracy and batch size under\
    \ constant learning rate conditions — that is, as batch size increases, test accuracy\
    \ decreases; the right side shows the relationship between test accuracy and learning\
    \ rate under constant batch size conditions. We found that as learning rate increases,\
    \ test accuracy improves. These two plots show the relationship between test accuracy\
    \ and the ratio of batch size to learning rate, each colored function drawn from\
    \ 1,000 models. Obviously, as the ratio increases, test accuracy decreases.\n\n\
    ![](img/txt013_4.jpg \"pagenumber_ebook=102,pagenumber_book=86\")\n\nModeling\
    \ the SGD optimization trajectory using PDEs is very valuable for our understanding\
    \ of deep learning, and it also requires us to deeply understand the geometric\
    \ properties of the loss landscape. The geometric properties of the loss landscape\
    \ determine the trajectory of the stochastic PDE on the loss landscape, i.e.,\
    \ the phase portrait. The curve of neural network parameters changing with time\
    \ t is the phase portrait.\n\nThis is mainly for two reasons. First, the stochastic\
    \ PDE contains the loss function and its derivatives of various orders, so the\
    \ geometric structure of the loss landscape directly affects the structure of\
    \ the stochastic PDE. Second, the loss landscape also determines the boundary\
    \ conditions of the stochastic PDE; therefore, the loss landscape determines the\
    \ nature of the solutions output by the SGD algorithm. Therefore, a thorough understanding\
    \ of the geometric structure of the loss landscape is crucial for our research\
    \ on deep learning optimization and generalization. In 2018, Novak et al. experimentally\
    \ showed that the generalization performance of neural networks is related to\
    \ the geometric structure of the loss landscape[¹⁷]. Specifically, the generalization\
    \ performance of neural networks is related to the number of linear regions in\
    \ the input space. Nonlinear activation functions make the loss landscape extremely\
    \ non-convex and non-smooth. This chaotic situation makes the theoretical analysis\
    \ of existing optimization algorithms very difficult. For example, why can convex\
    \ optimization algorithms optimize such non-convex problems as neural networks?\
    \ But on the other hand, deep learning models have achieved world-renowned results\
    \ in practical problems. This also hints that beneath the chaotic surface, there\
    \ may exist some undiscovered order.\n\n---\n\n## Debates and Discoveries on the\
    \ Geometric Structure of the Loss Landscape\n\nRegarding the geometric structure\
    \ of the loss landscape, there is currently a very interesting debate. For linear\
    \ networks — networks where activation functions are all linear — there are already\
    \ some conclusions. Kawaguchi's work in 2016[¹⁸] and the work by Lu and Kawaguchi\
    \ in 2017[¹⁹] pointed out that for linear networks under squared loss, all local\
    \ minima are equally good, meaning they are all global minima. If similar properties\
    \ can be found for nonlinear networks, then the excellent performance of neural\
    \ networks would get a good explanation, at least we would understand some theoretical\
    \ properties of deep learning to a certain extent. This is because once the SGD\
    \ algorithm finds a local minimum, it has found a global minimum.\n\nSeveral works\
    \ have pointed out that nonlinearity might not be important because nonlinear\
    \ networks might inherit some important properties of linear networks. But other\
    \ papers have proven that the reality is not so. In 2019, Yun et al. proved that\
    \ the loss landscape of a single-layer neural network has infinitely many suboptimal\
    \ local minima[²⁰]. This conclusion requires 4 conditions.\n\nFirst, only one\
    \ hidden layer; second, squared loss function is used for training; third, the\
    \ output is one-dimensional; fourth, the activation function is ReLU. Our paper\
    \ at the International Conference on Learning Representations this year significantly\
    \ expanded these conditions, covering almost all practical situations[²¹]. Specifically,\
    \ we extended these 4 conditions to: first, arbitrary depth; second, arbitrary\
    \ differentiable loss functions; third, arbitrary output dimensions; fourth, arbitrary\
    \ piecewise linear activation functions.\n\nSo what might the previously conjectured\
    \ order be? Soudry and Hoffer pointed out in 2018 that the loss landscape of ReLU\
    \ networks is divided into several smooth multi-linear regions[²²]. We further\
    \ proved in the paper that: first, in each region, every local minimum is a global\
    \ minimum; second, in each region, all local minima converge into a minimum valley;\
    \ third, all points on the valley constitute an equivalence class; fourth, there\
    \ exist \"parallel valleys\" for this equivalence class; fifth, all these equivalence\
    \ classes and parallel valleys constitute a quotient space. The second property\
    \ here explains \"Mode Connectivity\"[²³] — that near the local minima found by\
    \ SGD, there exist some points with very small differences in empirical risk,\
    \ and these points connect into a line, which is equivalent to one of these minimum\
    \ valleys. But unfortunately, currently these geometric properties only hold for\
    \ single-hidden-layer neural networks. For the analysis of multi-hidden-layer\
    \ neural networks, we still need further efforts.\n\n---\n\n## Conclusion\n\n\
    Theoretical analysis of deep learning is currently still in its early stages,\
    \ and there are a large number of questions that require in-depth discussion and\
    \ research. Besides the issues discussed just now, there are also issues of fairness,\
    \ privacy, security, etc., all of which require our long-term efforts and struggle.\n\
    \n---\n\n## References\n\n[¹]: Harvey et al., 2017\n[²]: Golowich et al., 2018\n\
    [³]: Liang et al., 2019\n[⁴]: ICLR related work\n[⁵]: Neyshabur et al., 2015\n\
    [⁶]: Novak et al., 2018\n[⁷]: Canziani et al., Statistics on competition model\
    \ scales\n[⁸]: Work related to hierarchical structure and generalization ability\n\
    [⁹]: Universal Approximation Theorem, 1989\n[¹⁰]: Universal Approximation Theorem,\
    \ 1989\n[¹¹]: Universal Approximation Theorem, 1989\n[¹²]: Hornik et al., 1993\n\
    [¹³]: Lu et al., 2017\n[¹⁴]: Funahashi and Nakamura, 1993\n[¹⁵]: Lu and Lu, Recent\
    \ work\n[¹⁶]: NeurIPS 2019, SGD Optimization Path Modeling\n[¹⁷]: Novak et al.,\
    \ 2018\n[¹⁸]: Kawaguchi, 2016\n[¹⁹]: Lu and Kawaguchi, 2017\n[²⁰]: Yun et al.,\
    \ 2019\n[²¹]: ICLR 2024, Condition Extension Work\n[²²]: Soudry and Hoffer, 2018\n\
    [²³]: Mode Connectivity\n\n"
