    ## V. Full-Chain Cooperation Links "Global Resources", Accelerating the Cohesion
    of Development Synergy


    The conference strives to build a first-class innovation ecosystem with smooth
    "innovation chain, industrial chain, data chain" throughout the full chain. Promote
    cooperative construction of key projects: 36 industrial innovation projects signed
    and settled, with total investment exceeding 30 billion yuan. Promote deep integration
    of industry and finance: The Shanghai AI Industry Investment Fund completed its
    first phase of fundraising, and jointly built the "STAR Market AI Industry Workstation"
    with the SSE (Shanghai Stock Exchange). Promote joint industry-university-research
    tackling: The Shanghai Artificial Intelligence Laboratory and the Process Manufacturing
    Basic Science Center were officially unveiled, accelerating forward-looking scientific
    research and key core technology breakthroughs. Promote international and domestic
    dual circulation: Xuhui West Bund AI Tower, Zhangjiang AI Empowerment Center,
    and Sequoia Digital Intelligence Industrial Incubation Center were unveiled, attracting
    and gathering global AI innovative enterprises; the Shanghai Magnolia Open Source
    Research Institute was established, promoting the construction of an international
    open source community platform; the Shanghai Artificial Intelligence Industry
    Association was established, which will further serve the industry and create
    an international AI brand.


