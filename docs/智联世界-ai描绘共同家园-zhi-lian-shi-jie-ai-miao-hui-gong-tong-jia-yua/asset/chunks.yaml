    # 5G and AI Transform Industries


    Another critical area is healthcare. We can see how 5G and AI are transforming
    the healthcare sector, supporting more accurate early diagnosis, health monitoring,
    and drug and vaccine development—the key to all of this lies in connectivity.
    In the US alone, it is projected that by 2030, 50% of healthcare services will
    be conducted online. With technology, you can have high-quality video, imaging
    and research backed by massive data, and real-time AI interaction. Thanks to just
    a small step of technological innovation in this field, paramedics in South Korea
    are already able to use 5G-connected 360-degree cameras to transmit data from
    the ambulance to doctors in real-time. For a healthcare industry impacting nearly
    10% of global GDP, technology and AI will help expand coverage, improve experiences,
    and reduce costs.


    Let''s talk about the future of work efficiency and productivity, another important
    area undergoing transformation. Enterprise workflows migrating to the cloud can
    optimize data management more intelligently; systems must support work from anywhere,
    and network connectivity helps boost productivity, with data tightly linked to
    cloud and AI. In recent months, 84% of organizations stated they are likely to
    continue partial work-from-home or remote work policies; many enterprises are
    even rethinking how to integrate digital space with the physical world. Technology
    and AI, supplemented by Extended Reality (XR), Augmented Reality, and holographic
    telepresence, support entirely new ways of working. Enterprise transformation
    has only just begun.


    Retail is another sector facing significant impact. 5G and AI can transform retail
    end-to-end, covering all aspects from smart supply chains and logistics management
    to entirely new in-store experiences. In a 5G environment, boundless XR, split
    rendering, and AI processing technologies enable personalized shopping experiences.
    You can see AI-tailored product recommendations in shop windows, even photorealistic
    images of yourself in displays. High-throughput, low-latency 5G XR glasses will
    also leverage cloud and on-device intelligence to map virtual objects onto the
    real world, harboring major opportunities.


    When we consider industry, we must talk about manufacturing. Manufacturing is
    currently undergoing a major transformation, and we can see the changes brought
    by intelligent connectivity. 5G and AI will drive the realization of a new generation
    of reconfigurable, flexible manufacturing. Enterprise private networks will provide
    secure industrial data management via highly reliable 5G networks, and data processing
    will be distributed between devices, edge cloud, or on-premise servers as needed.
    5G''s ultra-reliability and low latency will enable industrial-grade remote control
    of machinery. Intelligent operations with end-to-end tracking and control capabilities
    will elevate productivity to new heights. We will even see innovations never imagined
    before.


    Finally, 5G and AI will usher in a bright future for transportation. As we connect
    vehicles to the cloud, technology is already changing the transportation industry.
    We expect 5G and AI to make vehicles smarter—equipped with intelligent cockpits,
    autonomous driving and data analytics capabilities, and entirely new services.
    From a safety perspective, as we connect vehicle-to-vehicle, vehicle-to-infrastructure,
    and vehicle-to-pedestrian, 5G C-V2X (Cellular Vehicle-to-Everything) promises
    to make travel safer, more efficient, and more enjoyable. Roadside infrastructure
    will utilize AI-assisted cameras to perceive and manage traffic flow; the integration
    of sensors and AI in computing platforms will make intersections safer. 5G commercialization
    can also fully leverage a combination of roadside units and public network small
    cells to create efficient collaboration between smart cities and operators. This
    is a potentially massive transformation for the transportation industry.


    All of the above must be achieved through collaboration. The future of intelligent
    connectivity requires multiple companies working together. Qualcomm has been committed
    to fostering collaboration within the global ecosystem and creating new technologies
    through partnership. Unleashing the full potential of AI in the cloud, at the
    edge, and on devices will be tremendously exciting. 5G will be the connectivity
    platform for the intelligent connected everything, representing enormous opportunities
    for all participants in the mobile industry.


