    \n![](images/txt033_2.jpg \"pagenumber_ebook=248,pagenumber_book=232\")\n![](images/txt033_3.jpg\
    \ \"pagenumber_ebook=248,pagenumber_book=232\")\n\n## 文明的变迁\n\n我们谈人工智能，首先要看一下我们今天处在怎样的时代。人类文明从最早的原始文明，逐步发展到农业文明、工业文明，再到今天的互联网时代，人工智能则是始于60多年前。纵观整个人类文明发展史，是什么在推动人类文明的变迁？其间发生了什么？\n\
    \n### 基础设施变革推动人类向机器文明跃迁\n\n长久以来，我们可能已经忘记，生活中最常见的一些工具，却是社会变迁最重要的基础。\n\n石器、弓箭、火、陶器构成了简单的原始文明；铁器、文字、印刷术、轮子等成为农业文明的基础；蒸汽机、电、内燃机等一系列发明奠定了工业文明；而最近几十年中，互联网、半导体芯片等成为信息文明的核心特征。文明的发展变迁在于基础设施的革命，也就是我们所说的生产工具的变化。\n\
    \n那么从整个人类文明发展的视角看，我们今天处于怎样的位置？\n\n我们所知宇宙中最小的时间单位（时间间隔）是10^-43秒，从这么小的时间单位，到人类心跳瞬间的1秒，再到城市的历史、人类历史，直至几亿年银河系的历史，这是从时间轴和物理世界看宇宙文明的发展变迁。\n\
    \n下面这组照片分别是100年前、30年前和今天的上海浦东。照相技术让我们能刻画城市的变迁，这组照片体现的是上海浦东在百年尺度上的变迁。\n\n再看1秒尺度下物理世界的变迁。当一个人将手撑在书架上，人眼看到的只是一种静止的状态，而如果从机器的视角，则可以捕捉到1秒微小的震动。如果将这种震动放大100倍、1000倍，就能够看到木材如何受力。\n\
    \n![](images/txt033_4.jpg \"pagenumber_ebook=250,pagenumber_book=234\")\n\n###\
    \ 宇宙文明的变迁\n\n![](images/txt033_5.jpg \"pagenumber_ebook=250,pagenumber_book=234\"\
    )\n\n### 上海百年变迁\n\n我们再看更宏观的世界。左边是2006年哈勃望远镜拍到的某个星系的照片，右边是2019年人类拍摄的银河系的中心黑洞的照片。\n\
    \n![](images/txt033_6.jpg \"pagenumber_ebook=251,pagenumber_book=235\")\n\n###\
    \ 视觉放大\n\n![](images/txt033_7.jpg \"pagenumber_ebook=251,pagenumber_book=235\"\
    )\n\n### 银河系的中心黑洞\n\n人类能够拍摄到5亿年前的宇宙，这是非常遥远的过去，也论证了人类能够观测微观以及遥远的世界。那么以此时此刻为起点，往前30年是信息时代，往后30年是AI时代，通过了解过去的30年发生的事情，也可以预测出未来AI时代会发生什么。\n\
    \n## 芯片算力、算法水平、算法模型、训练算力万倍增长\n\n信息时代有三要素：计算能力、存储能力和传输能力。过去30年信息时代最重要的变化就是计算能力、存储能力、传输能力获得了百万倍的提升。\n\
    \n过去几十年，算力发展分为两个阶段（分别以蓝色曲线和绿色曲线表示），我们分别称之为旧时代或传统时代芯片，以及新时代基于GPU或为AI计算定制的芯片。蓝色曲线基于传统摩尔定律发展，性能每隔18～24个月提升一倍；绿色曲线是加速的超摩尔时代芯片算力。过去几年间，AI算力增长了接近1万倍，单个GPU的算力比过去基于单个CPU的算力多了1000倍。\n\
    \n![](images/txt033_8.jpg \"pagenumber_ebook=253,pagenumber_book=237\")\n\n###\
    \ 算力增长\n\n那么算法水平提升了多少？大家应该对2015年AlphaGo大战人类棋手印象深刻。从2015年开始，机器棋手能够战胜人类、机器人脸识别可以超越人类。到了2020年，与5年前相比，机器性能又提高了100万倍，这是非常惊人的幅度。与此同时，机器学习本身模型的规模、算法参数也增加了1万倍，训练所需算力也提高了1万倍。现在有一种说法，那就是AI进入了新的算力霸权时代，大家要用过去千倍、万倍的算力才能训练出世界上最好的算法。\n\
    \n那么现在AI具体能做什么？在新冠疫情早期，依图科技与上海公共卫生临床中心合作研发出了业界第一款新冠肺炎辅助诊断AI系统，系统能够基于肺部CT片给出病变的描述和定性的诊断，使得医生的确诊时间可以从过去的数小时缩短到数秒，这是一种视觉感知的智能。\n\
    \n未来，低阶感知智能将向高阶决策智能跃迁，从最初级眼睛看到的视觉感知智能向完善的知识图谱支持下的高阶认知智能、决策智能甚至是预测智能跃迁。我们在儿科医学领域里已经实现让AI基于几百万份病例进行学习，在这样的知识图谱下，AI能够达到接近10年资历医生的诊断水平。\n\
    \n几年前，一个城市管理要用到的智能计算需要十几个机柜提供的算力支持，这需要非常大的空间、投资以及能源消耗；而到了1年前，受益于AI芯片性能提升，所需机柜数量已经降到了1个。\n\
    \n未来10年，超摩尔时代会带来什么改变？管理一座城市可能需要满足对于几万乃至十万路视频的计算需求，而我们将仅仅需要一个巴掌大小的芯片就能支撑，这将是巨大的变化。\n\
    \n---\n\n# 人工智能赋能机器人与高端制造业\n\n**安世铭（Sami Atiya）**  \nABB集团机器人与离散自动化事业部总裁、ABB集团执行委员会成员\n\
    \n![](images/txt034_1.jpg \"pagenumber_ebook=254,pagenumber_book=238\")\n\n2016年6月，作为ABB集团离散自动化与运动控制业务总裁加入ABB集团执行委员会。ABB机器人与离散自动化事业部致力于谱写柔性制造与智能机械的未来。曾于1997—2015年在德国西门子担任多个高级管理职位，包括交通与物流部门首席执行官、医疗业务领域计算机断层扫描诊断设备部门首席执行官。还曾担任Harald\
    \ Balzer & Partner董事总经理，并曾任职于博世集团-蓝宝股份有限公司和弗朗霍夫信息与数据处理研究所。拥有美国麻省理工学院工商管理硕士、德国伍珀塔尔大学/德国卡尔斯鲁厄理工学院电气工程博士（机器人、传感器和人工智能方向），以及德国卡尔斯鲁厄理工学院电气工程和自动化硕士学位。\n\
    \n![](images/txt034_2.jpg \"pagenumber_ebook=255,pagenumber_book=239\")\n\n我们可否预测技术对于社会经济的影响？我们曾认为电动汽车不可能出现，现在电动汽车正在带来一场革命；以前的学者认为想要驾驶飞机跨越海洋，最好的方法是建立一个个中继站给飞机加油，但现在科技进步早已让直接的越洋飞行成为现实。\n\
    \n技术在过去的百余年中突飞猛进，而在过去10年间，AI和机器学习技术革命更极大地推动了社会发展。\n\n时下的新冠疫情正在影响我们的方方面面，比如由于封城措施影响了生产，企业经营者被迫重新审视生产线，这些生产线或许没有他们原来认为的那样具有灵活性，难以满足特殊情况下的市场需求。确保供应链的韧性和灵活性至关重要，新冠疫情是促使行业变化的催化剂，顺应这种变化将是一个新的趋势。\n\
    \n技术的发展伴随着4大工业趋势，即个性化消费盛行、劳动力日益短缺、不确定性加剧和数字化提速。而AI赋能的技术，以机器人和自动化的形式，提供了很多解决方案来应对以上4大趋势以及疫情带来的挑战。为应对这些趋势，我们创造解决方案，传递4大核心价值，即提高生产效率、改善产品质量、提升生产灵活性与简化生产流程。其中，生产效率和产品质量一直是重要因素。与此同时，柔性与至简将越来越具有战略意义，因为我们的客户要去适应快速变化的商业环境。想象这样一个世界：生产足够灵活，能应对任何需求的变化，人们将从重复和危险的工作中解脱出来，专注于高附加值的事情，从而享受更健康的工作和生活，我们真正要做的仅仅是告诉机器人去做什么。这样的世界正离我们越来越近，比我们想象的更近。\n\
    \n## AI驱动的柔性生产与未来工厂\n\nAI驱动的机器人能够帮助实现柔性生产。生产线不再是固定的、线性的，而是完全柔性的、灵活的、自动化的，生产过程主要由机器来控制。在同一个工厂，电动汽车和传统汽车的生产可以实现无缝连接，而机器人可以自动学习，实时进行数据分析，以便于提高绩效。通过与AGV（自动导引运输车）融合，人工赋能的机器人可以管理生产任务，自动下载程序，与车间里的其他机器人合作，整个过程不需要人进行干预。我非常有信心，机器人和AI的融合在机器人生产、编程、自我学习、开展服务的整个周期都能够创造价值，事实上这一切已经发生。\n\
    \nABB正在上海建设机器人未来工厂，并将专门建立机器人生产质量控制系统，确保生产的每一个部件都是完美的。不管处于制造业中的哪一个行业，质检都很关键。\n\n\
    ![](images/txt034_3.jpg \"pagenumber_ebook=257,pagenumber_book=241\")\n\n### 未来工厂\n\
    \n有了AI，不仅设计和生产机器人会更简单，编程也会变得更简单，甚至被淘汰。我们在研究AI怎么帮助人用自然语言与机器人进行交互，在编程方面引入AI的应用将使这一目标更容易实现。AI还能让核心工人更有效地与他人互动，增强现实的工具可以帮助操作人员和工程师找到解决问题的新方案，这些都是AI能够为我们带来的价值。\n\
    \n## AI在编程、仓储、喷涂、垃圾分类中的应用\n\n以前，机器人对不同型号、包装的货物进行挑拣和装箱是不可能的，现在AI能帮助我们做到这一点，从而让仓储管理更加有效。比如让一个机器人挑苹果，如果正面拿不起来，可以试一下其他角度，或者是将苹果转一转，看怎样抓得更快。在这个过程中，机器人用不同的变量进行分析，并将成果应用在未来的任务中，不仅可以抓苹果，也可以抓其他不同的物体。AI能够让机器人在这种非结构化环境中更好地工作，并通过不断试错积累经验，进一步增强工作能力。\n\
    \n通过机器学习也能让自动雾化器更好地工作，这不仅可以提高喷涂质量，还能监督一些核心的指标，如压力、振动、温度等。这样的雾化器可以节省75%的喷料以及20%的气体消耗。\n\
    \nAI正在帮助实现可持续的垃圾分类工作。ABB与华为共同开发的系统可以帮助上海市政府进行垃圾分类和再循环利用。这个系统整合了我们的小型机器人YuMi和FlexPicker，利用AI和云计算，打造一个包含机器人、计算机和传感器的神经系统，它能像人脑一样将垃圾分类，然后分到不同垃圾筒进行运输，每一步骤都会被拍照。在整个过程中，专用的云仪表盘能把信息传给机器人，机器人据此判断垃圾类型并进行分类。机器人通过不断循环学习，可以学会将越来越多类型的垃圾进行分类投放。得益于华为的高性能芯片，我们能够以100毫秒级的速度进行处理，准确率高达98%。\n\
    \n![](images/txt034_4.jpg \"pagenumber_ebook=258,pagenumber_book=242\")\n\n###\
    \ 垃圾分类系统\n\n此外，通过预测性维护，AI能够提高机器人的可靠性。我们利用AI技术来对机器人手臂上的变速箱和其他零部件进行预维护，并帮助客户更好地预判未来可能需要进行的维护。\n\
    \n我们需要进一步提升制造的灵活性和简单性，让人类能够更自然、更方便地与机器人合作。AI要成为机器人解决方案的一部分，所以我们要建立一个全球生态系统来推动创新。\n\
    \n---\n\n# 数智互联新十年\n\n**洪 锋**  \n小米集团联合创始人、高级副总裁，小米金融董事长兼CEO\n\n![](images/txt035_1.jpg\
    \ \"pagenumber_ebook=260,pagenumber_book=244\")\n\n2010年加入小米，目前担任小米金融董事长兼CEO，专注小米金融业务的发展推进。毕业于上海交通大学，取得计算机科学与工程学士学位，后取得美国普渡大学计算机科学硕士。创立小米之前，曾在谷歌和Siebel担任一系列产品和工程主管工作。主导或参与了谷歌音乐、谷歌拼音输入法、谷歌日历、谷歌3D街景等项目。\n\
    \n![](images/txt035_2.jpg \"pagenumber_ebook=261,pagenumber_book=245\")\n\n小米是物联网（IoT）生态布局的制造商，现在布局非常大的IoT平台，怎么利用它丰富的多维度数据源，进入人工智能新领域，是我们眼下思考的事情。\n\
    \n目前，同时拥有5件以上可以被IoT控制设备的小米用户已经接近500万；同时拥有二三十件，甚至超过100件小米设备的用户也大有人在，这种用户的数量增加会更快，这是小米用户的一个特点。\n\
    \n## 声学与视觉领域的研究\n\n为了在这些IoT设备上更好地加载人工智能能力，我们在各个基础领域开展了大量的研究工作。在声学领域，最近一年小米做得最多的是音纹识别。比如，当你家里有多个设备具备语音接收功能的时候，如何指定哪个设备回应并为你提供服务，避免一呼百应；或者当家中有多个使用者，如何识别每个用户并附加使用场景：这就需要音纹识别。\n\
    \n![](images/txt035_3.jpg \"pagenumber_ebook=262,pagenumber_book=246\")\n\n###\
    \ 小米IoT最新进展\n\n视觉领域也是我们人工智能研究的重点。我们在相机方面做了大量研究，主要是在不同场景下，通过最优化的算法，做出判断并赋予最优美的形象。可以说，大家现在看到的很多照片都很难说是完全真实的，它们都是基于真实场景的一种美好幻象。\n\
    \n## 智能家居的个性化与数字化\n\n生活中的方方面面都在加速数字化，并带来更多更新的人工智能发展机遇。这次疫情中，线上会议数量大幅增加，每一场会议的内容、组织者和与会者都被数字化，变得很容易追踪。当数字化变得越来越普遍的时候，人工智能就迎来了发展机会，因为我们可以在数字中找到规律，有了规律就有产生更优决策的机会。\n\
    \n在智能家居领域，未来几年一定有大量人工智能技术融入的机会，因为种类众多的家居设备都能够实现数字化，而数字化就是人工智能的切入口。\n\n每个人的生活习惯并不一样，所以要实现真正的智能家居并不容易。为了实现这一点，你做每一件事情、智能家居为你做的每一件事情，以及你控制智能家居做的每一件事情都会被记录下来，我们能从中找到规律。比如，我们找到闹钟和打开窗帘的规律，找到浴灯、取暖器和排风扇的联动开关的规律，找到门窗开关和净化器开关的规律等等，最终形成个性化的人工智能。它就像母亲一样在背后注视着你的一举一动，并且帮你安排好一切。\n\
    \n![](images/txt035_4.jpg \"pagenumber_ebook=263,pagenumber_book=247\")\n\n###\
    \ 小米智能家居设备\n"
  trans: "\n\n# Five Key Innovations in AI and New Milestones for the Next Decade\n\
    \n## Five Key Innovations\n\n### 1. Achieving Larger-Scale Applications with Less\
    \ Data\n\nTaking machine translation as an example, there are still many low-resource\
    \ languages for which it is difficult to find corresponding parallel corpora for\
    \ training. iFLYTEK discovered that semi-supervised machine translation enhancement\
    \ training based on forward and backward data augmentation can leverage large-scale\
    \ monolingual data for semi-supervised machine translation enhancement training,\
    \ effectively improving machine translation performance and robustness. This achieves\
    \ the effect of traditional 20 million bilingual sentence pairs with only 2 million\
    \ pairs. Without breakthroughs in these key technologies, relying solely on a\
    \ deep neural network model cannot fundamentally solve the practical problems\
    \ of AI in applications.\n\n![](img/txt032_4.jpg \"pagenumber_ebook=244,pagenumber_book=228\"\
    )\n\n### 2. Dynamic Self-Learning Models\n\nAI faces a significant problem: \"\
    overfitting\" caused by excessive training data. For instance, if training uses\
    \ too much data from quiet environments, recognition rates in noisy environments\
    \ will drop instead, and vice versa. This is \"overfitting.\" The contradiction\
    \ here lies in how to balance massive training data with personalized adaptation.\
    \ Solving this requires new approaches, such as iFLYTEK's proposed dynamic model\
    \ extension based on multi-environment factor sniffing. By automatically sniffing\
    \ different types of noise, the model structure can be automatically and dynamically\
    \ adjusted, and recognition effects in high-noise scenarios can be iteratively\
    \ improved, making data-driven approaches more effective.\n\n### 3. Cross-Lingual\
    \ Transfer Learning\n\nIn the future, under global integration, the multi-language\
    \ platformization of language technology is an inevitable trend. A community with\
    \ a shared future for mankind must first achieve free interaction of languages.\
    \ Therefore, cross-lingual transfer learning is also a key focus for the next\
    \ step of AI.\n\n### 4. Offline Privacy Protection\n\nIn AI ethics, a very important\
    \ aspect is privacy protection. Privacy protection is not only a legal issue but\
    \ also means giving users more choices. For example, translators, home controllers,\
    \ and smart speakers can be made as purely offline versions. On the one hand,\
    \ this does not hinder functionality; on the other hand, it protects user privacy\
    \ through physical isolation.\n\n### 5. Making Digital Life More Human with Affective\
    \ Computing\n\nEnabling AI to possess empathy like humans. In AI follow-up calls,\
    \ the voice needs to convey a pleasant mood and respond according to the other\
    \ party's feedback. There is a vast amount of research to be done in this process,\
    \ especially how to start from affective computing and psychological research\
    \ to make future AI more human-like in possessing empathy. This involves a series\
    \ of algorithms as well as a series of humanities and social science research,\
    \ which requires us to explore further.\n\n## New Milestones for AI in the Next\
    \ 10 Years\n\nIn the era of digital existence, the learning data AI relies on\
    \ is richer than before. Simultaneously, due to epidemic prevention and control\
    \ systems, data accumulation, management, and aggregation are more effective than\
    \ before. This also proves that we can build a better world with AI while protecting\
    \ user privacy. The next 10 years will be a new decade belonging to AI, marked\
    \ by three major milestones:\n\nFirst, AI can truly address weaknesses in people's\
    \ livelihood undertakings, tangibly meeting rigid social needs in fields such\
    \ as education, healthcare, judiciary, and smart cities.\n\nSecond, AI can empower\
    \ every individual, making everyone **\"AI-enabled.\"** Ubiquitous AI applications\
    \ allow everyone to stand on the shoulders of AI, making AI capabilities as accessible\
    \ as water and electricity. For example, translators give people stronger communication\
    \ skills; voice recorders turn speech into text anytime, anywhere; and there are\
    \ office assistants, medical assistants, learning assistants...\n\nFinally, AI\
    \ can fully support and lead the digital existence of the next 10 years, integrating\
    \ online and offline, through core capabilities and the continuous traction of\
    \ emotion and humanities, using AI to **light up the warmth of human life.**\n\
    \n---\n\n# A Clear \"Visible\" New Era of AI\n\n**Zhu Long**  \nCo-founder & CEO,\
    \ YITU Technology\n\n![](img/txt033_1.jpg \"pagenumber_ebook=247,pagenumber_book=231\"\
    )\n\nWorld-leading AI scientist. Returned to China in 2012 to found YITU Technology,\
    \ building it into a world-leading AI company. Received Ph.D. in Statistics from\
    \ UCLA in 2008, studying under Prof. Alan Yuille (IEEE Fellow, student of physics\
    \ master Hawking), learning how to understand and depict the world. Postdoctoral\
    \ researcher at MIT AI Lab (2008–2010), working with Prof. Bill Freeman (IEEE\
    \ Fellow), a pioneer in computational photography. Researcher at NYU Courant Institute\
    \ of Mathematical Sciences (2010–2012), in the lab of Prof. Yann LeCun (Member\
    \ of NAE), a founding father of neural networks and deep learning; led team to\
    \ win international computer vision algorithm competition championships. Published\
    \ dozens of papers in top-tier AI, ML, CV journals/conferences: PAMI, IJCV, NIPS,\
    \ AISTATS, CVPR, etc.\n\n![](img/txt033_2.jpg \"pagenumber_ebook=248,pagenumber_book=232\"\
    )\n![](img/txt033_3.jpg \"pagenumber_ebook=248,pagenumber_book=232\")\n\n## The\
    \ Evolution of Civilization\n\nWhen discussing AI, we must first examine what\
    \ era we are in today. Human civilization has gradually evolved from primitive\
    \ civilization to agricultural civilization, industrial civilization, and now\
    \ the Internet era, while AI originated over 60 years ago. Looking back at the\
    \ history of human civilization, what drives the transformation of civilization?\
    \ What has happened in between?\n\n### Infrastructure Revolution Drives Humanity's\
    \ Leap to Machine Civilization\n\nFor a long time, we may have forgotten that\
    \ the most common tools in life are the most important foundations for social\
    \ change.\n\nStone tools, bows and arrows, fire, and pottery constituted simple\
    \ primitive civilization; iron tools, writing, printing, and the wheel became\
    \ the basis of agricultural civilization; steam engines, electricity, internal\
    \ combustion engines, and a series of inventions laid the foundation for industrial\
    \ civilization; while in recent decades, the Internet and semiconductor chips\
    \ have become the core characteristics of information civilization. The development\
    \ and evolution of civilization lie in the revolution of infrastructure, i.e.,\
    \ the change of production tools.\n\nSo, from the perspective of the entire development\
    \ of human civilization, where do we stand today?\n\nThe smallest known time unit\
    \ (interval) in the universe is $10^{-43}$ seconds. From such a tiny time unit\
    \ to the 1 second of a human heartbeat, to the history of cities, human history,\
    \ and even the hundreds of millions of years of the Milky Way's history—this is\
    \ the development and evolution of cosmic civilization viewed from the time axis\
    \ and the physical world.\n\nThe set of photos below shows Shanghai Pudong 100\
    \ years ago, 30 years ago, and today. Photographic technology allows us to depict\
    \ the vicissitudes of cities; this set of photos reflects the changes in Shanghai\
    \ Pudong on a century scale.\n\nNow look at the changes in the physical world\
    \ on a 1-second scale. When a person rests their hand on a bookshelf, the human\
    \ eye sees only a static state, but from a machine's perspective, it can capture\
    \ tiny vibrations within 1 second. If this vibration is magnified 100 or 1,000\
    \ times, one can see how the wood bears force.\n\n![](img/txt033_4.jpg \"pagenumber_ebook=250,pagenumber_book=234\"\
    )\n\n### Evolution of Cosmic Civilization\n\n![](img/txt033_5.jpg \"pagenumber_ebook=250,pagenumber_book=234\"\
    )\n\n### Shanghai's Century of Change\n\nLet's look at a more macroscopic world.\
    \ On the left is a photo of a galaxy taken by the Hubble Telescope in 2006; on\
    \ the right is the photo of the supermassive black hole at the center of the Milky\
    \ Way taken by humans in 2019.\n\n![](img/txt033_6.jpg \"pagenumber_ebook=251,pagenumber_book=235\"\
    )\n\n### Visual Magnification\n\n![](img/txt033_7.jpg \"pagenumber_ebook=251,pagenumber_book=235\"\
    )\n\n### Supermassive Black Hole at the Center of the Milky Way\n\nHumans can\
    \ photograph the universe 500 million years ago—an extremely distant past—which\
    \ also proves that humans can observe the microscopic and distant worlds. Taking\
    \ this moment as a starting point, the past 30 years were the Information Age,\
    \ and the next 30 years will be the AI Age. By understanding what happened in\
    \ the past 30 years, we can predict what will happen in the AI Age.\n\n## Ten-Thousand-Fold\
    \ Growth in Chip Compute, Algorithm Level, Algorithm Models, and Training Compute\n\
    \nThe Information Age has three elements: computing power, storage capacity, and\
    \ transmission capacity. The most important change in the past 30 years of the\
    \ Information Age is that computing power, storage capacity, and transmission\
    \ capacity have increased by a million times.\n\nOver the past decades, compute\
    \ development has gone through two stages (represented by blue and green curves\
    \ respectively), which we call the old/traditional era chips and the new era chips\
    \ based on GPUs or customized for AI computing. The blue curve develops based\
    \ on the traditional Moore's Law, with performance doubling every 18–24 months;\
    \ the green curve represents accelerated super-Moore era chip compute. In recent\
    \ years, AI compute has grown nearly **10,000 times**; a single GPU's compute\
    \ is **1,000 times** that of a single CPU in the past.\n\n![](img/txt033_8.jpg\
    \ \"pagenumber_ebook=253,pagenumber_book=237\")\n\n### Compute Growth\n\nHow much\
    \ has the algorithm level improved? Everyone should be deeply impressed by the\
    \ 2015 AlphaGo vs. human masters match. Starting from 2015, machine players could\
    \ defeat humans, and machine facial recognition surpassed humans. By 2020, compared\
    \ to 5 years prior, machine performance improved another **1 million times**—an\
    \ astonishing magnitude. Simultaneously, the scale of machine learning models\
    \ and algorithm parameters increased **10,000 times**, and the compute required\
    \ for training also increased **10,000 times**. There is now a saying that AI\
    \ has entered a new era of \"compute hegemony,\" where everyone must use thousands\
    \ or tens of thousands times the compute of the past to train the world's best\
    \ algorithms.\n\nSo what can AI do specifically now? In the early stages of the\
    \ COVID-19 pandemic, YITU Technology collaborated with the Shanghai Public Health\
    \ Clinical Center to develop the industry's first AI-assisted diagnosis system\
    \ for COVID-19. The system can provide lesion descriptions and qualitative diagnoses\
    \ based on lung CT scans, reducing doctors' confirmation time from hours to seconds.\
    \ This is a form of visual perception intelligence.\n\nIn the future, low-level\
    \ perception intelligence will leap to high-level decision-making intelligence—from\
    \ the most basic visual perception intelligence to high-level cognitive intelligence,\
    \ decision intelligence, and even predictive intelligence supported by comprehensive\
    \ knowledge graphs. We have already achieved in pediatric medicine the ability\
    \ for AI to learn from several million cases; under such knowledge graphs, AI\
    \ can reach diagnostic levels close to a doctor with 10 years of experience.\n\
    \nA few years ago, the intelligent computing needed for city management required\
    \ the compute support of over a dozen cabinets, demanding huge space, investment,\
    \ and energy consumption. By a year ago, benefiting from AI chip performance improvements,\
    \ the required number of cabinets had dropped to **one**.\n\nIn the next 10 years,\
    \ what changes will the super-Moore era bring? Managing a city may require meeting\
    \ the computing needs of tens or even hundreds of thousands of video streams,\
    \ yet we will only need a **chip the size of a palm** to support it. This will\
    \ be a tremendous change.\n\n---\n\n# AI Empowering Robotics and High-End Manufacturing\n\
    \n**Sami Atiya**  \nPresident, Robotics & Discrete Automation Business Area, ABB\
    \ Group; Member, ABB Group Executive Committee\n\n![](img/txt034_1.jpg \"pagenumber_ebook=254,pagenumber_book=238\"\
    )\n\nJoined ABB Group Executive Committee in June 2016 as President of Discrete\
    \ Automation and Motion Business. The Robotics & Discrete Automation Business\
    \ Area is dedicated to writing the future of flexible manufacturing and intelligent\
    \ machinery. Held various senior management positions at Siemens Germany (1997–2015),\
    \ including CEO of Transportation & Logistics and CEO of Computed Tomography Diagnostic\
    \ Equipment in Healthcare. Also served as Managing Director of Harald Balzer &\
    \ Partner, and worked at Bosch Group - Blaupunkt and Fraunhofer Institute for\
    \ Information and Data Processing. Holds an MBA from MIT, a Ph.D. in Electrical\
    \ Engineering (Robotics, Sensors, and AI) from University of Wuppertal / Karlsruhe\
    \ Institute of Technology (KIT), and a Master's in Electrical Engineering and\
    \ Automation from KIT.\n\n![](img/txt034_2.jpg \"pagenumber_ebook=255,pagenumber_book=239\"\
    )\n\nCan we predict the impact of technology on the socio-economy? We once thought\
    \ electric vehicles were impossible; now they are bringing a revolution. Scholars\
    \ once believed the best way to fly across oceans was to build relay stations\
    \ for refueling, but technological progress has long made direct transoceanic\
    \ flight a reality.\n\nTechnology has advanced by leaps and bounds over the past\
    \ century, and in the past 10 years, the AI and machine learning technology revolution\
    \ has greatly driven social development.\n\nThe current COVID-19 pandemic is affecting\
    \ all aspects of our lives. For example, lockdown measures have impacted production,\
    \ forcing business operators to re-examine their production lines, which may not\
    \ be as flexible as they originally thought, unable to meet market demands under\
    \ special circumstances. Ensuring supply chain resilience and flexibility is crucial.\
    \ The pandemic is a catalyst for industry change; adapting to this change will\
    \ be a new trend.\n\nTechnological development accompanies four major industrial\
    \ trends: the prevalence of personalized consumption, increasing labor shortages,\
    \ growing uncertainty, and accelerated digitalization. AI-empowered technology,\
    \ in the form of robotics and automation, provides many solutions to address these\
    \ four trends and the challenges brought by the pandemic. To respond to these\
    \ trends, we create solutions delivering four core values: **improving production\
    \ efficiency, enhancing product quality, increasing production flexibility, and\
    \ simplifying production processes.** Among these, production efficiency and product\
    \ quality have always been important factors. Meanwhile, flexibility and extreme\
    \ simplicity will become increasingly strategically significant because our customers\
    \ need to adapt to rapidly changing business environments. Imagine a world: production\
    \ is flexible enough to cope with any demand changes; people are freed from repetitive\
    \ and dangerous work to focus on high-value tasks, enjoying healthier work and\
    \ life; all we truly need to do is tell the robot what to do. Such a world is\
    \ getting closer to us, closer than we imagine.\n\n## AI-Driven Flexible Manufacturing\
    \ and Future Factories\n\nAI-driven robots can help achieve flexible manufacturing.\
    \ Production lines are no longer fixed and linear but fully flexible, agile, and\
    \ automated, with the production process mainly controlled by machines. In the\
    \ same factory, production of electric vehicles and traditional vehicles can be\
    \ seamlessly connected, and robots can automatically learn and perform real-time\
    \ data analysis to improve performance. Through integration with AGVs (Automated\
    \ Guided Vehicles), AI-empowered robots can manage production tasks, automatically\
    \ download programs, and collaborate with other robots in the workshop—the entire\
    \ process requires no human intervention. I am very confident that the integration\
    \ of robotics and AI can create value throughout the entire cycle of robot production,\
    \ programming, self-learning, and service delivery; in fact, all this is already\
    \ happening.\n\nABB is building a Future Robotics Factory in Shanghai and will\
    \ establish a dedicated robot production quality control system to ensure every\
    \ single component produced is perfect. Regardless of the manufacturing sector,\
    \ quality inspection is critical.\n\n![](img/txt034_3.jpg \"pagenumber_ebook=257,pagenumber_book=241\"\
    )\n\n### Future Factory\n\nWith AI, not only will designing and manufacturing\
    \ robots become simpler, but programming will also become simpler, even obsolete.\
    \ We are researching how AI can help humans interact with robots using natural\
    \ language; the introduction of AI in programming will make this goal easier to\
    \ achieve. AI can also enable core workers to interact more effectively with others;\
    \ augmented reality tools can help operators and engineers find new solutions\
    \ to problems—these are all values AI can bring us.\n\n## AI Applications in Programming,\
    \ Warehousing, Painting, and Waste Sorting\n\nPreviously, it was impossible for\
    \ robots to pick and pack goods of different models and packaging; now AI helps\
    \ us achieve this, making warehouse management more effective. For example, letting\
    \ a robot pick apples: if it can't grab from the front, it tries other angles,\
    \ or rotates the apple to see how to grab faster. In this process, the robot analyzes\
    \ with different variables and applies the results to future tasks—not only picking\
    \ apples but also other different objects. AI enables robots to work better in\
    \ such unstructured environments and continuously enhance capabilities through\
    \ trial-and-error experience accumulation.\n\nMachine learning can also make automatic\
    \ atomizers work better. This not only improves painting quality but also monitors\
    \ core indicators such as pressure, vibration, and temperature. Such atomizers\
    \ can save **75% of paint** and **20% of gas consumption**.\n\nAI is helping achieve\
    \ sustainable waste sorting. A system jointly developed by ABB and Huawei helps\
    \ the Shanghai Municipal Government with waste sorting and recycling. This system\
    \ integrates our small robots YuMi and FlexPicker, utilizing AI and cloud computing\
    \ to build a \"nervous system\" comprising robots, computers, and sensors. It\
    \ can classify waste like a human brain, then transport it to different bins,\
    \ with every step photographed. In the process, a dedicated cloud dashboard transmits\
    \ information to the robot, which judges the waste type and sorts accordingly.\
    \ Through continuous cyclic learning, robots can learn to sort an increasing variety\
    \ of waste. Benefiting from Huawei's high-performance chips, we can process at\
    \ **100-millisecond speeds** with **98% accuracy**.\n\n![](img/txt034_4.jpg \"\
    pagenumber_ebook=258,pagenumber_book=242\")\n\n### Waste Sorting System\n\nIn\
    \ addition, through predictive maintenance, AI can improve robot reliability.\
    \ We use AI technology for pre-maintenance of gearboxes and other components on\
    \ robot arms, helping customers better predict future maintenance needs.\n\nWe\
    \ need to further enhance manufacturing flexibility and simplicity, allowing humans\
    \ to collaborate with robots more naturally and conveniently. AI must become part\
    \ of the robotics solution, so we need to build a global ecosystem to drive innovation.\n\
    \n---\n\n# The New Decade of Digital-Intelligent Interconnection\n\n**Hong Feng**\
    \  \nCo-founder & Senior Vice President, Xiaomi Group; Chairman & CEO, Xiaomi\
    \ Finance\n\n![](img/txt035_1.jpg \"pagenumber_ebook=260,pagenumber_book=244\"\
    )\n\nJoined Xiaomi in 2010, currently serves as Chairman & CEO of Xiaomi Finance,\
    \ focusing on promoting the development of Xiaomi's financial business. Graduated\
    \ from Shanghai Jiao Tong University with a Bachelor's in Computer Science and\
    \ Engineering, and obtained a Master's in Computer Science from Purdue University,\
    \ USA. Before founding Xiaomi, held a series of product and engineering leadership\
    \ roles at Google and Siebel. Led or participated in projects such as Google Music,\
    \ Google Pinyin Input, Google Calendar, and Google 3D Street View.\n\n![](img/txt035_2.jpg\
    \ \"pagenumber_ebook=261,pagenumber_book=245\")\n\nXiaomi is a manufacturer laying\
    \ out the Internet of Things (IoT) ecosystem, with a very large IoT platform layout\
    \ now. How to utilize its rich multi-dimensional data sources to enter new fields\
    \ of AI is what we ares\"; or when there are multiple users at home, how to identify\
    \ each user and attach usage scenarios: this requires voiceprint recognition.\n\
    \n![](img/txt035_3.jpg \"pagenumber_ebook=262,pagenumber_book=246\")\n\n### Latest\
    \ Progress of Xiaomi IoT\n\nVision is also a key focus of our AI research. We\
    \ have done extensive research on cameras, mainly making judgments through optimized\
    \ algorithms in different scenarios and endowing the most aesthetically pleasing\
    \ images. It can be said that many photos you see now are hardly completely real;\
    \ they are all a kind of beautiful illusion based on real scenes.\n\n## Personalization\
    \ and Digitalization of Smart Home\n\nAll aspects of life are accelerating digitalization,\
    \ bringing more and new opportunities for AI development. During this pandemic,\
    \ the number of online meetings increased significantly. The content, organizers,\
    \ and attendees of every meeting are digitized, becoming very easy to track. When\
    \ digitalization becomes more and more prevalent, AI ushers in development opportunities\
    \ because we can find patterns in the data, and with patterns comes the opportunity\
    \ to generate better decisions.\n\nIn the smart home field, there will certainly\
    \ be a large number of opportunities for AI technology integration in the next\
    \ few years, because a wide variety of home devices can be digitized, and digitalization\
    \ is the entry point for AI.\n\nEveryone's living habits are different, so achieving\
    \ true smart home is not easy. To achieve this, everything you do, everything\
    \ the smart home does for you, and everything you control the smart home to do\
    \ will be recorded, and we can find patterns from them. For example, we find the\
    \ pattern between the alarm clock and opening curtains; the linkage pattern of\
    \ bathroom heater, heater, and exhaust fan; the pattern of door/window switches\
    \ and air purifier switches, etc., ultimately forming personalized AI. It is like\
    \ a mother watching your every move behind your back and arranging everything\
    \ for you.\n\n![](img/txt035_4.jpg \"pagenumber_ebook=263,pagenumber_book=247\"\
    )\n\n### Xiaomi Smart Home Devices\n\n"
