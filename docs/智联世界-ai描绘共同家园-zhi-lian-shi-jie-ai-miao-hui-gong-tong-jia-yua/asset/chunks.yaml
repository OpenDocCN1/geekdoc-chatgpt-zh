    )\n\n\uFEFF\n\n“新一代人工智能正在全球范围内蓬勃兴起，为经济社会发展注入了新动能，正在深刻改变人们的生产生活方式。”\n\n“中国愿在人工智能领域与各国共推发展、共护安全、共享成果。”\n\
    \n—摘自习近平总书记\n\n致2018世界人工智能大会的贺信\n\n\uFEFF\n\n前 言\n\n2020世界人工智能大会云端峰会以“智联世界 共同家园”为主题，于2020年7月9—11日在上海成功举办。在疫情防控的特殊背景下，大会充分发挥上海人工智能技术创新和应用优势，线上线下融合，“云端”办会、“数字”办展。来自世界各地的人工智能顶级科学家、企业家、投资家、开发者以及关心人工智能发展的各界人士，围绕人工智能技术发展新方向、产业应用新动能，以及人工智能助力全球疫情防控、打造温暖家园等主题展开讨论，提出了许多很有价值的理念、观点和见解、建议，得到业界和全社会的广泛关注。\n\
    \n作为面向人工智能这一重要新兴技术领域的国际高端交流平台，世界人工智能大会已成功举办三届。2018年9月，习近平总书记向首届世界人工智能大会发来贺信，从战略和全局的高度，深入阐明了新一代人工智能的发展态势，表明了中国愿在人工智能领域与各国共推发展、共护安全、共享成果的鲜明态度，为推动人工智能快速健康发展指明了方向。在今年世界人工智能大会开幕式上，中共中央政治局委员、上海市委书记李强致辞时强调，上海将深入贯彻落实习近平总书记重要指示精神，着力打造链接协同创新的开放平台、链接产业发展的赋能平台、链接城市治理的智慧平台、链接美好生活的服务平台，与海内外朋友携手合作，共同开拓人工智能发展美好前景，共同谱写智能时代精彩篇章。\n\
    \n为了让更多的人分享世界人工智能大会的思想和学术成果，应各界需求，大会组委会在今年继续推出“智联世界”系列图书。本书以2020世界人工智能大会开幕式、全体会议和夜话活动的嘉宾演讲内容为主，围绕“家园·AI（爱）”“方向”“趋势”“抗疫”“机遇”“连接·融合”等主题，全面展现世界人工智能最新发展态势，传递AI向善、打造人类共同家园的价值理念。\n\
    \n本书旨在为相关专业人士和广大读者理解把握人工智能发展趋势、参与世界人工智能大会和上海人工智能高地建设、推动我国新一代人工智能健康发展提供有益参考。\n\n\
