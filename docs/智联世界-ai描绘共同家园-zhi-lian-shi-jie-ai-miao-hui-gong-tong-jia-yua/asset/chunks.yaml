    \n![](img/txt014_1.jpg \"pagenumber_ebook=106,pagenumber_book=90\")\n\n在多个行业和国家有逾\
    \ 30 年的工作经历。1982 年作为助理研究员开始了职业生涯。1991—1994 年在新加坡标准与工业研究院担任食品技术研究高级研究员。1994 年加入德国康迪雅化学新加坡分公司，后调往中国，历任康迪雅中国化学公司副总经理、总经理和董事总经理。2006\
    \ 年被南非沙索公司任命为沙索中国公司执行副总裁。2008 年加入 BP，出任 BP 中国区总裁及 BP（中国）投资有限公司董事长。过去数年中，出任多家企业的董事会成员。他还是爱丁堡大学的荣誉教授。本科毕业于新疆石河子大学，1989\
    \ 年于美国康奈尔大学获得硕士学位，并于 2003 年在哈佛商学院完成了高级管理课程。\n\n![](img/txt014_2.jpg \"pagenumber_ebook=107,pagenumber_book=91\"\
    )\n\n## 技术发明路漫漫\n\n我们是生活在一个快速的广泛的科技变革时代，还是经久的延绵的滞胀时期？仁者见仁，智者见智。\n\n曾经有一位科技公司的先贤在\
    \ 1946 年断言说全球可能只需要 5 台计算机，而今天计算机已经走进了寻常百姓家里，甚至装到了我们的口袋里。今天一部手机的计算能力已经超越了当年 IBM\
    \ 送人类登月的大型计算机计算能力的几万倍甚至几十万倍。\n\n人工智能近几年的热潮使政府、企业和社会大众都期望它一出现就石破天惊，即刻改变世界。在不同的时期，各界对人工智能的态度不断转变，渴望、期待、热情、贪婪、焦虑、担忧，抑或失望。我们往往更关注一项科技今天能够给我们带来什么改变，创造多少\
    \ GDP，提升多少当下的政绩，能否解决我们面对的所有问题，甚至仅仅是赶时髦，却往往忽略了一项重大科技自身发展的规律和长期所带来的重大影响。\n\n一项技术从孕育到开发到应用到普及再到成熟，直至衰退，都有它自身的发展规律。大多数技术都不是灵光闪现后一蹴而就，并立刻改变了人类社会，而是需要经历持久且逐步的发展历程。有时我们甚至都很难厘清一项技术最早的发明者究竟是谁。我们对许多技术的认知也有时间的局限。我们常说世界上第一部计算机是\
    \ 1946 年在美国宾夕法尼亚大学发明的，叫 ENIAC。事实上，早在 1822 年英国剑桥大学的一位教授查尔斯·巴贝奇（Charles Babbage）就撰文描述了一种计算机器—差分机。巴贝奇试图打造一个可以用以各种复杂计算的万用计算装置，有人认为这才是现代计算机的鼻祖。虽然巴贝奇并没有在他有生之年看到这些机器的问世或应用，但他在\
    \ 1832 年写道：“任何一个成功地被制造出来的产品，都是从一系列的失败，逐步走向卓越。”今天，由 IBM 打造，世界上最快的超级计算机之一 Summit\
    \ 的运算速度高达每秒 20 亿亿次，比第一台计算机 ENIAC 大约提高了 40 万亿倍！\n\n同样的故事也发生在其他许多领域。我们从小就被告知是瓦特早在\
    \ 1769 年发明了推动工业革命发生的蒸汽机，但早在瓦特致力于蒸汽机之前的几十年里，蒸汽机已经在苏格兰地区广泛出现。据说蒸汽机的雏形可以追溯到 2000\
    \ 多年前的古希腊。但是，毫无疑问，瓦特在改良早期的工业蒸汽机中做出了不可磨灭的贡献。\n\n许多被称为通用技术的发明创造都经历了漫长的过程，其间不断得到改进，同其他技术有效地融合与互补，发展出广泛的应用，从而形成了很强的外溢效用（spillover），对人类社会产生重大影响。语言、服装、火的使用、植物栽培、动物养殖、轮子、制陶、书写、水车、印刷术等许多古代的发明都属于这些范畴。蒸汽机、内燃机、电动机、电力、电器、汽车、计算机、互联网等则是现代从根本上改变了人类社会、被广泛应用的通用技术。我们今天所熟悉的纳米技术、生物技术、人工智能也都可能成为我们这个时代的通用技术。\n\
    \n## 技术扩散路遥遥\n\n新技术的引入需要经验的积累、技术的完善、认知的提升，因此，通用技术的扩散有时会伴随着早期生产效率的下降，而在经历经验曲线之后，大幅度的生产效率提升才会出现。\n\
