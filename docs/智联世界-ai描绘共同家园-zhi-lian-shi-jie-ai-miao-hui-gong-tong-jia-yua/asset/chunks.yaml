    # New Directions in Artificial Intelligence Theory


    **Yao Qizhi (Andrew Chi-Chih Yao)**


    Dean of the Institute for Interdisciplinary Information Sciences, Tsinghua University;
    2000 Turing Award Laureate; Academician of the Chinese Academy of Sciences; Foreign
    Associate of the US National Academy of Sciences


    ![](img/txt008_1.jpg "pagenumber_ebook=51,pagenumber_book=35")


    World-renowned computer scientist, internationally recognized as a pioneer in
    cryptography and quantum computing. Awarded the Turing Award in 2000, he remains
    the only scientist of Chinese descent to receive this honor to date. He has taught
    at MIT, Stanford University, UC Berkeley, and Princeton University. In 2004, he
    left Princeton University to return to China and teach full-time at Tsinghua University.
    In 2005, he founded the "Computer Science Experimental Class" (Yao Class), acclaimed
    by the outside world as "the world''s best undergraduate computer science education".
    In 2011, he established the "Tsinghua Center for Quantum Information" and the
    "Institute for Interdisciplinary Information Sciences". In 2018, he founded the
    Nanjing Turing Institute of Artificial Intelligence and the Xi''an Institute for
    Interdisciplinary Information Core Technologies. In 2019, he specially founded
    the "Tsinghua AI Class" (Zhi Class). In 2020, he established the Shanghai Qi Zhi
    Institute, aiming to promote interdisciplinary development led by artificial intelligence.


    ![](img/txt008_2.jpg "pagenumber_ebook=52,pagenumber_book=36")


    Applications of artificial intelligence are already ubiquitous. If we look around,
    we will see many new advances in the field of AI and widespread applications of
    AI. But at the same time, we must also remember that the dazzling applications
    we see today benefit from the development of certain basic scientific fields,
    and the development of basic science stems from the accumulation and breakthroughs
    in basic theoretical research over many years. Therefore, to continue to drive
    the innovation trend in AI applications, we must achieve new breakthroughs in
    theoretical research. I want to convey the following three points:


    First, AI theory is extremely important. Through theoretical analysis, we can
    understand the problems and challenges faced in the field of AI more clearly,
    while also gaining some inspiration and clues about solutions.


    Second, AI development requires interdisciplinary cooperation. We can see many
    examples of great success in the field of AI, all originating from cooperation
    between seemingly unrelated disciplines. Without the achievements of scientists
    from other disciplines, such rapid development in the field of AI would have been
    impossible.


    Third, there are some very interesting and worthwhile new directions to explore
    in AI theory.


    I hope to share three new directions in AI fundamental theory: Neural Topology,
    Privacy-Preserving Learning, and Controllable `Super AI` (Superintelligence).


    ## New Perspective on Neural Network Research: Neural Topology


    Deep learning and neural networks are the foundation of many current AI applications.
    The huge breakthrough in deep learning in recent years was actually unexpected
    by many people. Deep learning had no progress for many years, until suddenly several
    factors came together, after which deep learning and neural networks produced
    huge applications and impact.


    But why are neural networks so successful? This remains a mystery to many—many
    are pursuing where the power of neural networks truly comes from—if we can understand
    the reasons for the success of neural networks, then perhaps we would know how
    to improve them, thereby achieving the next breakthrough.


    Let''s first look at a simple example of "what neural networks can do". Take climate
    prediction, for example. If we need to design an algorithm to capture climate
    conditions to analyze whether a weather map shows a storm or normal climate, a
    relatively standard method is to treat the weather map as a two-dimensional or
    three-dimensional representation, and then find patterns through graphic analysis
    to identify storm characteristics.


    However, in deep learning and recent machine learning, people take a higher-level
    perspective, viewing the entire image as a point in a high-dimensional space.
    For example, a picture of a cat: assuming this image has one million pixels, it
    can be viewed as a point in a one-million-dimensional data space. This is actually
    a standard machine learning method in the current field of artificial intelligence—data
    is viewed as a point in an extremely high-dimensional data space, and algorithms
    analyze to determine whether this point belongs to a specific set (e.g., the set
    of cat pictures in the example).


    Abstractly speaking, we can look at all cat pictures; they constitute a data set
    in a one-million-dimensional space. We have an intuitive feeling for low-dimensional
    data, but no one knows what the data set looks like in high dimensions. Our task
    is to design algorithms to make good judgments on high-dimensional data. The core
    of this work lies in neural networks, and the most critical question is how large
    and deep the neural network needs to be to distinguish cat pictures from non-cat
    pictures.


    For many years, mathematicians have been concerned with high-dimensional data
    sets. A natural question is: when we try to understand what neural networks can
    do, we first want to understand what kind of data sets are relatively easy for
    neural networks to analyze and recognize, and what kind of data sets we cannot
    analyze using neural networks.


    Over the past decade or so, neural network researchers have begun to combine topology
    in mathematics with neural networks, achieving very good computational results.
    An important concept in topology corresponding to high-dimensional data is the
    Betti number. `B0`, `B1`, `Bi`, `ΣiBi` are related mathematical expressions of
    Betti numbers. The Betti number is a sequence; the lowest is `B0`, which corresponds
    to the number of mutually uncorrelated elements in the data set. What does `Bi`
    mean? You can think of it as the number of i-dimensional holes in the subset (number
    of holes). For example, in the Betti number example below, the left side is a
    circle on a plane, then `B0=1`, representing the existence of one connected element;
    `B1=1`, representing one hole in the figure. The right side is a more complex
    example. The figure shows a torus; `B1`, the number of one-dimensional holes,
    equals 2, because there are two different types of circles, and each circle represents
    a hole. Let the Betti numbers of figure S be (`B0`, `B1`, …), `ΣiBi` is called
    the "total Betti number" of S. Intuitively, the higher the Betti number, the more
    complex the shape.


    ![](img/txt008_3.jpg "pagenumber_ebook=55,pagenumber_book=39")


    **Betti Number Examples**


    An intuitive view is that for neural networks, the more complex the shape, the
    higher the difficulty of recognition. In fact, this intuition is also correct;
    we can prove this hypothesis through some classic topological theories, combined
    with some insights from theoretical computer scientists. This also proves the
    point just mentioned: if you want to solve an interesting AI problem, you need
    to think from the perspective of different disciplines. The case discussed here
    is topology; by introducing topology, we can gain brand-new insights in AI, which
    would be impossible by focusing only on AI research.


    ## Privacy-Preserving Learning


    First, let me introduce another discipline: cryptography. I am personally very
    interested in cryptography, especially "Multi-party Computation (`MPC`)". The
    basic idea behind `MPC` is this: assume there are many different parties, each
    with some data, and only when all parties'' data are combined can AI technology
    be used to mine or discover important results. However, the data each party possesses
    is confidential and very valuable; therefore, they do not want to leak their private
    data to other parties.


    In this case, can we perform collaborative computation without revealing the content
    of our respective data? The answer is yes; this goal can be achieved through cryptographic
    design, i.e., secure multi-party computation.


    This concept and technology of secure multi-party computation was proposed by
    me in 1982; its value at the time was conceptual innovation and algorithmic feasibility.
    After years of development, the application cost of cryptography has been greatly
    reduced, making secure multi-party technology have various practical applications,
    including in privacy-preserving machine learning. For example, several pharmaceutical
    companies want to jointly develop new drugs, but each has its own confidential
    information; now, through AI + `MPC`, multiple pharmaceutical companies can cooperate
    without disclosing their exclusive intellectual property.


    ![](img/txt008_4.jpg "pagenumber_ebook=56,pagenumber_book=40")


    **Application of Multi-party Secure Computation in Privacy-Preserving Drug Discovery
    Process**


    ## Controllable Super AI (Superintelligence)


    The last point is one that many people are very interested in, but also a topic
    full of controversy: controllable superintelligence, the so-called `Super AI`.
    People are generally concerned about the potential threats that the rapid progress
    of AI may pose to human society. When will general superintelligence arrive? This
    is unpredictable. Professor Stuart Russell of UC Berkeley published *Human Compatible:
    AI and the Problem of Control* in 2019, introducing how to promote "provably safe"
    `Super AI` and strongly advocating that this concept must run through the AI design
    process. He set three principles: Altruism (human interests above machine interests),
    Humility (machines cannot be self-righteous), and Diligence (machines can learn
    human preferences), implementing these principles through mathematical methods
    such as probability theory and game theory.


    I want to tell everyone a basic fact: current AI applications come from past theoretical
    research; the theoretical research we do now will surely bring us huge progress
    at some day in the future.


    ---


    # Towards the Third Generation of Artificial Intelligence


    **Zhang Bo**


    Academician of the Chinese Academy of Sciences; Dean of the Institute for Artificial
    Intelligence, Tsinghua University; Professor, Department of Computer Science,
    Tsinghua University


    ![](img/txt009_1.jpg "pagenumber_ebook=58,pagenumber_book=42")


    Awarded an Honorary Doctorate of Natural Sciences by the University of Hamburg,
    Germany in 2011; won the 2014 China Computer Federation (CCF) Lifetime Achievement
    Award; won the 2019 Wu Wenjun Artificial Intelligence Highest Achievement Award
    from the Chinese Association for Artificial Intelligence. Engaged in theoretical
    research on artificial intelligence, artificial neural networks, and machine learning,
    as well as applied technology research on pattern recognition, knowledge engineering,
    and robotics. Published over 200 academic papers and 5 monographs in the above
    fields. His scientific research achievements have won the ICL European AI Award,
    among others. In addition, he is one of the founders of the State Key Laboratory
    of Intelligent Technology and Systems, and served as its director from 1990 to
    1996.


    ![](img/txt009_2.jpg "pagenumber_ebook=59,pagenumber_book=43")


    The 60-year development history of artificial intelligence has gone through two
    generations. The first generation of AI is sometimes called Symbolism. People
    proposed a reasoning model based on knowledge and experience, using this model
    to simulate human rational intelligence, such as reasoning, planning, decision-making,
    etc. For this, it is necessary to establish a knowledge base and reasoning mechanism
    in the machine, and use these two mechanisms to simulate human reasoning, thinking,
    and other behaviors.


    Here is an example. Around 1971, an expert system built by Stanford University
    in the US based on this principle was called the `MYCIN` system. It was mainly
    used to diagnose blood infectious diseases and prescribe antibiotics. It put the
    knowledge of infectious disease experts into the computer, and also put the doctor''s
    diagnostic process—how to infer the disease from symptoms and finally prescribe—into
    the computer as a reasoning mechanism. Thus, internal medicine doctors could diagnose
    with the assistance of the computer. Since internal medicine doctors are usually
    not infectious disease experts, such a computer-assisted treatment system can
    help internal medicine doctors make better and more accurate diagnoses and prescriptions.


    The most representative achievement of AI systems made using this principle is
    IBM''s Deep Blue international chess program. This program defeated world champion
    Kasparov in May 1997. The computer''s Deep Blue program could defeat human chess
    masters mainly due to the following three elements: The first element is knowledge
    and experience, meaning it utilized 700,000 games played by human masters, plus
    all 5-6 piece endgames. Based on this chess knowledge, it was summarized into
    chess rules. And through master-machine games, the 8,000 parameters in the evaluation
    function were tuned, putting the masters'' experience into the program as well.
    The second relies on algorithms; "Deep Blue" used the `Alpha-Beta Pruning Algorithm`.
    This algorithm speeds up the search. The third is computing power; IBM used `RS6000`
    machines at the time, capable of analyzing 200 million moves per second, able
    to look ahead 8-12 steps on average. An experienced chess master can generally
    only look ahead 3-5 steps; therefore, the machine surpassed humans in speed.


    The advantage of the first generation of AI lies in its ability to imitate the
    human reasoning and thinking processes; therefore, it is explainable, consistent
    with the process of human thinking. At the same time, using this method for machine
    learning enables "learning one, inferring ten" (generalizing from one instance).
    This is the advantage of the first generation of AI.


    But the first generation of AI also has very serious defects. For example, this
    knowledge comes from experts; everyone knows expert knowledge is very scarce and
    very expensive, and manually programming it into the computer is very time-consuming
    and laborious. At the same time, a lot of knowledge is difficult to express, such
    as uncertain knowledge, common sense, etc. Therefore, the application scope of
    the first generation of AI is very limited.


    ## Second Generation AI: Deep Learning


    The second generation of AI is the deep learning everyone is very familiar with.
    So-called deep learning simulates human perception, such as vision, hearing, touch,
    etc. We use image recognition as an example to illustrate how computers simulate
    human perception. For instance, if we want the computer to recognize different
    animals, what should we do? Since we cannot tell the computer what a horse is
    or what a cow is, we have to adopt the human learning method; therefore, the machine
    learning process is roughly as follows.


    First, collect a large number of animal pictures and divide them into two categories.
    One category is used for training, training the computer to recognize horses or
    other animals; this is called classification, i.e., enabling the computer to correctly
    distinguish horses, cows, etc., through training, also called learning. Machine
    learning uses multi-layer neural networks. After training with a large number
    of pictures, we then give the other part of the pictures—pictures not learned
    before—to the machine for recognition. If 90% are recognized correctly, we say
    its recognition rate is 90%, and the misrecognition rate is 10%. The same method
    is used for speech recognition. Under given image or speech libraries, current
    machine recognition rates for images or speech can both reach or exceed human
    levels.


    What are the advantages of deep learning? The first advantage is that it does
    not require domain knowledge, and the technical threshold is relatively low. In
    other words, we only need to input raw images and raw speech; we don''t need to
    tell the computer how to recognize images or speech; the computer will automatically
    extract appropriate features and recognize them, so anyone can use this tool.


    Second, the network scale is very large, so it can handle big data. For example,
    the image library `ImageNet` has 20,000 categories and 14 million images, a very
    large data volume. In 2011, the computer''s misrecognition rate on this image
    library was as high as 50%, meaning half were wrong. But 4 years later, in 2015,
    Microsoft used deep learning methods to recognize this set of images, and the
    misrecognition rate dropped to 3.57%, even lower than the human misrecognition
    rate of 5.1%. This shows that using deep learning methods, under certain conditions,
    machine image and speech recognition levels can exceed humans.


    Therefore, deep learning has received widespread attention. A most typical example
    is the Go program. Everyone knows that before October 2015, Go programs written
    using traditional knowledge-based methods only reached amateur 5-dan level. In
    October 2015, using deep learning and other methods, the Go program `AlphaGo`
    defeated the European champion. In March 2016, it defeated the world champion.
    By October 2017, `AlphaGo Zero` defeated `AlphaGo`. This shows that in 3 years,
    due to the use of deep learning, the Go program''s level jumped from amateur to
    professional, from professional to world champion, and from world champion to
    super-world-champion.


    The Go program achieved a "triple jump" in two years. Where did `AlphaGo`''s success
    come from? It came from three aspects: big data, algorithms, and computing power.
    We can see that `AlphaGo` indeed utilized big data; it learned 30 million games
    in total, played another 30 million against itself, learning 60 million games
    in total, a huge data volume. Algorithms used were `Monte Carlo Tree Search`,
    `Reinforcement Learning`, `Deep Learning`, etc. Computing power was also very
    strong, composed of a distributed computing system with 1,202 `CPUs` and 280 `GPUs`.


    The second generation of AI also has great limitations, including unexplainability,
    insecurity, vulnerability to attacks, difficulty in generalization, and the need
    for large amounts of samples. Here is just a simple example, done by our PhD students,
    to illustrate this problem. The image on the left below is a snowy mountain—the
    Alps; the computer image recognition system identified it as the Alps with 94.39%
    confidence. But just by adding a little noise, turning it into the image on the
    right, the right image looks almost exactly the same as the left image to the
    human eye, because only a tiny bit of noise was added, but the computer would
    identify it as a dog with 99.99% certainty.


    It can be seen that the computer''s pattern recognition system is very different
    from human vision. Although its recognition rate is high, it is very unsafe, very
    unreliable, and unexplainable. Why the machine interprets the snowy mountain with
    noise as a dog, we cannot explain.


    ![](img/txt009_3.jpg "pagenumber_ebook=63,pagenumber_book=47")


    **Example of Limitations of Second-Generation AI**^([\[1\]](#txt009.html#footnote_content_txt009_1))


    Judging from the achievements of the first and second generations of AI, it should
    be said that AI has just begun. Both the first and second generations of AI have
    major defects, and their application scope is very limited; the more exciting
    big show is about to begin. This big show is the third generation of AI, which
    must solve the defects existing in the first and second generations of AI. We
    must establish an explainable, robust AI theory, and develop safe, trustworthy,
    reliable, and scalable AI technology; only then can we achieve technological breakthroughs.
    With technological breakthroughs, we can drive innovative applications of AI.


    The way to develop the third generation of AI is to combine the first generation''s
    knowledge-driven methods with the second generation''s data-driven methods. In
    other words, we need to comprehensively utilize four elements: knowledge, data,
    algorithms, and computing power. The first generation of AI used three of these
    elements; the second generation also only used three.


    How do we solve the following key problems?


    '
