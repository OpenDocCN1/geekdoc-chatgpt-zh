- raw: "迁移学习学者，提出迁移学习基本理论框架及主要算法方向，在迁移学习领域学术影响力排名第三（数据根据Google Scholar），研究成果被收录至经典数据挖掘大学教材《数据挖掘：概念与技术》；是剑桥大学AI丛书《迁移学习》（Transfer\
    \ Learning）主要作者、大数据课程教材《大数据建模方法》主要作者。设计全球最早的商用AI系统百度“凤巢”，使百度变现能力4年提升8倍；曾获ACM—ICPC世界冠军，是首位获中国智能界最高奖“吴文俊人工智能科学技术奖”一等奖的企业家；入选《麻省理工科技评论》“中国区35岁以下科技创新35人”和《财富》“中国40位40岁以下商界精英”。\n\
    \n托比·沃尔什（Toby Walsh）\n\n悉尼新南威尔士大学人工智能专业教授\n\n![](images/txt015_3.jpg \"pagenumber_ebook=114,pagenumber_book=98\"\
    )\n\n新南威尔士大学人工智能专业教授，同时兼任澳大利亚科学院院士。被《澳大利亚人报》（Australian Newspaper）评为澳大利亚数字革命的“摇滚巨星”。大力倡导对人工智能的运用领域加以限制，以确保人工智能能够被恰当用于改善人类生活。在有关杀手机器人的讨论中，一直担任领路人的角色，并在纽约和日内瓦召开的联合国会议上就该主题发表演讲。还经常在电视和广播中发声。编撰了两本面向大众的人工智能图书，最新一本名为《2062：人工智能制造的世界》，该书现有中文、英文、德文、日文、韩文、波兰文、俄文及越南文版本。\n\
    \n张 潼\n\n香港科技大学数学系和计算机系教授，IEEE、美国统计学会和国际数理统计学会会士\n\n![](images/txt015_4.jpg \"\
    pagenumber_ebook=115,pagenumber_book=99\")\n\n香港科技大学数学系和计算机系教授，IEEE、美国统计学会和国际数理统计学会会士。主要研究领域包括机器学习、大数据及其应用等。担任NIPS、ICML、COLT等国际顶级机器学习会议主席或领域主席，以及PAMI、JMLR和Machine\
    \ Learning Journal等国际一流人工智能期刊编委。曾担任IBM研究院研究员和雅虎研究院主任科学家、百度研究院副院长和大数据实验室负责人、腾讯AILab负责人。\n\
    \n郭毅可\n\n香港浸会大学副校长（研究及拓展）\n\n![](images/txt015_5.jpg \"pagenumber_ebook=116,pagenumber_book=100\"\
    )\n\n英国皇家工程院院士，欧洲科学院院士，英国计算机学会会士。2020年1月1日被委任为香港浸会大学副校长（研究及拓展）。2002年成为英国帝国理工学院计算机系教授并于2014年起担任帝国理工学院数据科学研究所所长。于1985年获得清华大学计算科学一级荣誉学位，1993年获得帝国理工学院计算机科学博士学位。1999年创立了帝国理工学院衍生企业数据分析平台公司InforSense\
    \ Limited，专门从事生命科学和医学的大数据分析。主要研究兴趣在于机器学习和大规模数据管理领域，并为许多重大研究项目做出了贡献。现在是英国和欧洲几个主要数据科学项目的研究者。曾在2002年国际超级计算会议获“最具创新奖”；2014年获国际生物信息工业顶级会议Bio—IT\
    \ World的“最佳实践奖”；2017年获ACM SIGMM（国际计算机协会多媒体兴趣组）颁发的“最佳开源软件奖”。\n\n中岛秀之\n\n札幌市立大学校长\n\
    \n![](images/txt015_6.jpg \"pagenumber_ebook=117,pagenumber_book=101\")\n\n1983年在东京大学获得信息工程博士学位，并加盟电子技术实验室（ETL）。2001—2004年，担任日本产业技术综合研究院AIST网络辅助研究中心主任。2004—2016年，出任日本公立函馆未来大学校长（现任名誉校长）。2016—2018年，受聘为东京大学人工智能前沿教育领域的专案教授。自2018年开始就任札幌市立大学校长。\n\
    \n![](images/txt015_7.jpg \"pagenumber_ebook=118,pagenumber_book=102\")\n\n杨强：今天我们有三个问题。首先我们探讨一下当前人工智能方面的突破在哪里；第二我们会看一看人工智能所面临的挑战及其局限性；最后我们会展望更长远的未来，共同探讨人工智能未来可能取得哪些伟大的成就。\n\
    \n当前人工智能的突破\n\n戴文渊：在我看来，AI方面最大的突破，就是深度学习。10年前，我们试图让AI技术落地，并首先应用于互联网领域。我们从互联网广告与搜索引擎开始发展，看到人工智能可以有效帮助搜索引擎精准投放广告，并提高800%的广告效果。7年前，我们试图将AI技术应用到其他行业，比如说在金融领域进行更好的营销、更好的欺诈检测，以及反洗钱。5年前，我们开始看到AI被利用到零售和能源行业。当前，我们可以看到AI的应用随处可见，很多行业都已经有AI的应用落地。这些AI的应用每天都层出不穷，可能明年我们就看到10倍甚至更多的应用。这是激动人心的时刻，我们充满信心，也很高兴看到越来越多的AI技术被应用到更多行业。\n\
    \n托比·沃尔什：人工智能对于人类智能来说是一个非常有益的补充，在很多领域可以帮助人类，但是它跟人类的智能也有很大的不同。比如说，刚才我们看到加了一点噪声之后，一只猫就会被识别成一辆公共汽车，人类却绝不会犯这样的错误，所以我们人类应该感到非常自豪，因为我们的识别方法和机器不一样，相比之下更为先进。人工智能的另外一个局限性在于机器的感受有限，未来我们应该让机器能够更好理解这个世界，理解语音，理解文本，理解图像。此外，我们人类潜意识的东西无法被机器所习得，这也是现在研究的一个重点领域。\n\
    \n张潼：我觉得人工智能和机器学习表现很好的地方就在于利用大数据支持，在简单环境下完成简单的任务。比如说打游戏，你只要关注某一个游戏，从中收集到很多数据，AI就能有很好的表现。在这样非常明确的结构化的环境下，AI学习能力很强，并已经带来了巨大的突破，特别是最近强化学习有很大的突破。AI可以打游戏，或者打比赛，甚至比人类打得更好。在其他一些类似的确定性比较高的环境中，AI的表现也不错，比如说安静环境下的语音识别。如果有一个具体并且固定的环境，有具体的任务，此时你训练一个模型，采用最近开发出来的深度学习的一些技术，人工智能会做得很好。\n\
    \n过去几年，AI开始可以从很多没有加标签的数据中学习知识。比如说在自然语言方面，代表性的工作有GPT（Generative Pre-training Transformer，生成式预训练转换器）。它可以从很多没有加标签的数据中学习，并能应用到很多其他任务中，将来甚至可以被应用到超人类的智能中，融合到之前对于有标签的数据的分析中。在计算机视觉方面也有很大的突破，我们可以看到AI可以从很多没有加标签的数据中学习特征表示。因为它的适用性很广，你就不用给所有的数据加上标签后再用于人工智能的训练。这些是近来很有前景的领域，它们在接下来几年肯定是发展的重点。\n\
    \n在理论方面也有很大的进展，比如说对神经网络的运作模式有了更好的理解。最近有很多神经网络方面的理论进展，可以让我们了解如何来训练神经网络，让它们帮助我们解决复杂的问题。\n\
    \n从行业应用的角度来说，自动机器学习很有前景。结合硬件、模型结构搜索、机器学习调参，加上原生数据或者通用数据的特征组合，形成黑箱的自动化机器学习模型，这能带来更好的结果。它可以让机器学习更容易落地，解决不同的问题。只要对黑箱进行参数调整，就可以降低这些工具的使用门槛，并应用到不同的硬件设备上。一些高计算力的硬件设备，比如说云计算或者边缘计算，可以用自动优化的大模型；手机，还有IoT等其他一些低计算力设备都可以用小模型。这是未来非常有前景的技术领域，可以让AI更具普适性，更方便让应用落地。\n\
    \n郭毅可：准确来说，如今AI的发展是关注认知，如模式识别、图像识别。在过去10年中我们在两个领域看到巨大的进展：第一个是自动特征提取，这就是卷积神经网络的突破，它可以自动地识别物体的一些特征。基于这样的技术进展，我们建立了很多新的模型，它们使得图形、文本等都可以被自动识别。还有一个领域也获得了巨大的进展，那就是表达学习，它可以学到对于一个识别对象的有效表达。此外，强化学习也是有很大发展的领域，加上识别能力，我们可以做出一些很好的人工智能应用，比如说AlphaGo，还有不同的棋类游戏，人工智能在这方面能够打败人类。\n\
    \n我们处在一个数据驱动的AI时代，所有人都觉得数据越多越好，希望通过数据识别一些特征，通过神经网络帮助人类进行推理，做出决定。这些基于认知的人工智能在能力上可以达到某种智能程度，能够基于某些模型，做出一个决定。但是人类的决策不是单纯由数据驱动的，人工智能也是如此。我们人类的智慧不仅仅是识别而已，孩童很早就习得了这个能力，而成人的智慧主要在推理方面，能够结合已知的知识进行推理。现在人工智能的很多进步都是在这个领域，这是一个非常积极的趋势，也就是把现有的学习模型和推理结合起来。\n\
    \n中岛秀之：我觉得现在形势就是深度学习的发展让AI有了很大的进步。但机器学习本身还是有很多限制，首先就是一定要有数据，有数据才能够获取和分析信息。在这个方面，我们要把人工智能和现有基础领域的知识和经验结合起来应用。\n\
    \n人工智能的局限和挑战\n\n杨强：下面要讨论的是人工智能所面临的一些短板，也许这些短板能够激励我们推动人工智能下一个10年的发展。从我自己的经验来说，我觉得人工智能在基于现有的经验进行学习，然后拓展适应不断变化的环境这方面做得不足。在AI领域我们把这叫作“迁移学习”。我们过去一直希望在理论和现实层面上都实现机器的举一反三，或者是它的适应性，来进行推理。人类就是这么做的，但机器在这方面还需要努力。此外，在隐私方面，我们从其他人手中拿数据的时候，是有隐私泄露风险的，别人可能不想和我们分享数据。这也是当前人工智能的挑战，人工智能没有办法去整合和获取真正的大数据。\n\
    \n戴文渊：迁移学习的确是人工智能面临的一个大挑战，现在我们看到人工智能的应用越来越多了，但是在复杂的环境当中，迁移学习的使用更加重要。举一个例子：我昨天去拜访了一家餐饮巨头企业，他们想要把线下的业务放到线上去，改变业务的模式。过去，他们的店大部分在线下；但疫情之后，仅有5%的营收是来自线下的，其余95%的营收是来自线上的，是通过数字化的渠道来的。此前，他们会让服务员给来店的客户送一些优惠券，通过服务员人工为客户提供一些建议，做增值推荐服务。他们觉得，要把推荐服务放到线上去很难。首先就是需要大量的数据科学家来完成这项工作，但在AI人才紧缺的当下，企业也无能为力。所以我们觉得需要让普通开发者能够开发AI应用，以解决数据科学家紧缺的问题。这也是为什么5年前第四范式就开始把很多时间投入AutoML（自动机器学习）技术的研究上，它可以让普通开发者—比如说JAVA开发师和Python工程师—都可以构建AI应用。\n\
    \n第二个挑战，即使有足够多的科学家，即使普通开发者也可以开发AI技术，但企业还是缺少可用的数据。我们必须利用迁移学习，把知识从一个领域迁移到另外一个领域，以解决某些领域数据量不足的问题。第四范式在迁移学习领域积累了很多优秀的算法，同时我们一直坚持系统本身需要解决好隐私的问题。最近几年，我们在迁移学习隐私保护领域取得了比较大的突破，能够把知识从一个领域迁移到另外一个领域，同时也不会导致隐私暴露。\n\
    \n第三个挑战是成本问题。我们发现顶尖的互联网公司每年都要在搜索引擎上花掉上千万元，很少有公司能够接受这样的投入成本，所以我们必须考虑AI的成本问题。AI体系不仅仅是硬件体系，还有软件体系，软件的设计必须基于硬件，硬件的设计也必须适配软件，这是一个软硬件优化、融合的体系。第四范式正在以融合的方法来设计软件和硬件，我们的“软件定义算力”技术让数据中心的TCO（总拥有成本）表现增加了10倍。\n\
    \n中岛秀之：我觉得我们可能都有共识，那就是要加强深度学习的能级。在这方面我们的技术还有待改良和提高，我们需要把这些技术能够在更高领域的任务上进行应用。\n\
    \n托比·沃尔什：我想快速讲讲几个挑战。第一是语言。语言是一个基础的引擎，让机器能够读懂语言是非常重要的。当前，机器并没有在语意层面上理解人的话，它可能只是表面上理解人的话。我觉得语言是机器智能化的体现。第二是常识。可能最有名的一个例子就是：你可以跑到一个城市里面，找一所学校，问学生一些历史问题，学生可能会回答得非常清楚；但是你如果让AI去做的话，有一些东西它可能会混淆，因为它缺乏一些基本的常识。第三是有关情感的问题。机器并没有感情，没有办法产生共情，或者跟人形成相关的互动、交互，这是一个比较大的挑战。\n\
    \n张潼：我非常同意的一点是，当前AI没有办法做自然语言和语义的识别。之前我们说过，可能有一些特定的任务，AI是可以做好的，对一些特定的环境，我们可以依托大数据来做相应的文本对比。但是对于通用的任务或者是更加广泛的任务，当前的人工智能是无法做到的，而我们真正的目标是希望人工智能能够做通用的任务，而不是一些固定环境中的单一特定的任务。比如说，我们希望能够将常识注入人工智能里面，让它在思考、逻辑推理的时候变得更强，但这是非常难的事情。目前的AI系统并不是依托我们的常识，而是依托数据的对比，做出一些概率的推测，这和人的常识是完全不一样的。即使我们只做单一任务，但有不同的应用环境、不同的数据特点，这个时候AI可能没有办法在不同环境之下用统一模型完成一个任务，这也是我们现在要解决的事情，要让AI有更强的对不同背景环境的适应能力。\n\
    \n对于我们来说，让AI解决常识任务、通用任务有非常大的挑战。在未来10年中，AI做单一任务时对不同场景的适应能力也是非常重要的，并且是更加急需解决的事情。比如，我们有一些图像识别系统可以做很好的室内图像识别，但是如果希望把它放到室外场景当中应用，就需要进行一系列相应的调整。同样，无人驾驶也是如此，实际应用中会碰到在训练时从没有发生过的情况，提升对这些情况的鲁棒性也是非常重要的挑战。如何应对这样特定任务在多场景中的适应性要求，是当前更紧迫的工作。如果我们能够做到这一点，AI在很多行业的应用就会变得非常简单。原本每一个特定的AI系统只能适用于一个特定的行业，但是将来它就可以适用于不同的场景、环境和行业。这样的话，人工智能能够使用的范围更广，而且安全性更高。至于说如何从大数据变成小规模数据，这涉及迁移学习的能力。正如我提到的，我们需要做的就是让人工智能适应不同场景，这也是迁移学习需要解决的非常重要的挑战。还有，需要注意到隐私的问题。如何在不同机构使用人工智能，将其运用到不同设备当中去？如何协同合作？这也是非常重要的事情。\n\
    \n郭毅可：从根源上来看，AI面临一个基本的挑战，就是如何识别知识和数据，进行数据和知识的互动。通过观察来获得相应的数据和知识，很多时候就涉及应用知识的问题。比如迁移学习，你学习到一些知识后，必须能够举一反三，触类旁通。又如小规模数据的学习，你必须要让数据和知识之间进行交融。通过学习，知识会不断增加，但是你必须能够理清这一系列相应的知识，将数据和知识结合起来，这非常重要。统计学中的贝叶斯理论也强调依托之前得到的经验，将其作为学习的基础，知识和数据融合还涉及控制理论、自动化理论等。\n\
    \n从根本上说，未来最大的挑战就是知识和数据的融合。我认为应该坚持这样一个理念：无论是前面所说的计算机理论，或者是统计学理论，我们永远不应当持有任何偏见，应当双管齐下，同时关注知识和数据的融合，这样才能更好地建模，才能有更好的逻辑。在这样的基础之上，我们就可以更好地规约不同的数据，更好地理解数据，让数据发挥更好的效用。这非常重要，也是我们一直想要实现的目标。\n\
    \n中岛秀之：目前为止，数据能够运用的场景还是比较有限的，我觉得未来它应当是以一种更加智能的方式，进行更好的应用，而且人和AI能够有更好的沟通和交互。我们应该更好地向AI赋予价值系统和价值观。价值观确实是非常重要的，但是对于AI来说，它是没有办法能够理解的。我们要训练AI，让它有这样的价值观，或者是所谓的常识观。我不知道其他的技术是否能够帮助我们，但我觉得价值观是非常重要的事情。\n\
    \n托比·沃尔什：我们有的时候会让机器来接管部分工作，但是如果机器做了所有的事情，我们是否会变得更懒惰？我们是否会变得一无是处？我们的挑战就是要保证机器不会彻底取代人类，不会接管人类所有的事情，我们必须要有所掌控。\n\
    \n未来人工智能的展望\n\n郭毅可：我认为接下来10年或者15年，AI会有很大进展。AI可以发挥重要作用的领域之一是医疗。未来医疗将在很大程度上变为数据驱动，很多超级设备将应运而生，用于某一些医疗实践，另外还会呈现个性化趋势。这会带来很多的AI研究，比如说互操作性、可验证性、小数据的挑战，还有隐私问题，这些领域都是值得我们关注的。\n\
    \n戴文渊：我相信应该是5G和IoT。现在的AI是从人类身上学习，有很多人给数据做标注，数据则来自很多人的点击。从点击网页到做标记，是人类在教AI做所有事。但是将来有了5G、IoT之后，我们可以让AI自己来学。人只有十几亿，但是IoT有万亿级，它的级数还不断有巨大的增长，所以5G加上IoT的发展，会给AI带来巨大飞跃，会带来更多的目标、更多的数据，会有更多的场景可供学习。这就是我相信5G和IoT会加速促进AI发展的原因。\n\
    \n张潼：将来几十年会有如下趋势。AI可以从一个专才变成通才，随着算法的进步，AI可以更鲁棒地学习，可以更好地处理更广泛的场景和环境。在我看来当前最急迫需要解决的问题，就是让整个系统更加鲁棒，使用起来更为安全。同时，未来我们还会在AI中纳入知识，希望借此为AI加上一些推理能力。我觉得这一点最近可能很难实现，因为我们还不知道怎么做。此外还有一点我觉得会逐渐发生：随着IoT和5G的发展，我们将有众多的AI设备，它们将随处可见。它们之间可以相互沟通，相互学习，可以自己成长—合作式地成长，从而不断改进。当前所谓的联邦学习还是有很多局限，将来如果有很多独立AI个体可以通过相互学习、自主学习，成为可以持续成长的机器，那将会在很大程度上提高现有的联邦学习的能力和范畴。未来几十年里，AI通过这种新的去中心化的学习方式，最后会进化出多么强大的能力，这值得我们期待。\n\
    \n杨强：由于5G和IoT的发展，我们会看到越来越多的实体，它们之间相互交流、沟通、协调。在某些限制条件下，比如说隐私性的限制，因为某些商业利益，它们没有办法相互之间打通、分享数据，如果它们要以远程的方式学习，就必须要更好地协作。另一方面，也要兼顾到隐私以及其他的一些考量。这是一个全新的市场，由AI创建的市场，和人类共生共存，我们把它叫作联邦学习，这是我们现在在做的一件事。\n\
    \n\uFEFF\n\n人工智能新浪潮\n\n丁 磊\n\n网易公司首席执行官，中国数字经济代表人物\n\n![](images/txt016_1.jpg\
