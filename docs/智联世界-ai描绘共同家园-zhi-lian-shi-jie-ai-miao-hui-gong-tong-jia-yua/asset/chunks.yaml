    # Towards Conscious AI: Computer Architecture Inspired by Cognitive Neural Intelligence


    ## Author Biography


    Manuel Blum, Turing Award laureate, Member of the US National Academy of Sciences,
    Member of the US National Academy of Engineering, Member of the American Academy
    of Arts and Sciences. Professor at the School of Computer Science, Carnegie Mellon
    University. Ph.D. in Mathematics from MIT in 1964, advisor was AI pioneer Prof.
    Marvin Minsky. Has taught at MIT, UC Berkeley, City University of Hong Kong, and
    Carnegie Mellon University. Research focuses include Conscious Turing Machines,
    computational complexity, automata theory, algorithms, inductive inference, cryptography,
    program result checking, human-computer interactive proofs, etc. Won the 30th
    Turing Award in 1995 for contributions to computational complexity theory and
    its applications to cryptography and program checking.


    ![](img/txt010_1.jpg "pagenumber_ebook=67,pagenumber_book=51")


    ## From "Homunculus" to Conscious Turing Machine: Evolution of Models


    We believe cognitive neuroscientists Bernard Baars and Stanislas Dehaene have
    understood the meaning of "consciousness," although their theories are not yet
    widely known. Our contribution is translating their theories into mathematical
    language. We convert cognitive science into mathematics—automata theory, as shared
    in later cases. This inspires us to think about how the brain generates feelings
    like pain and pleasure. For years, we have wanted to know what happens inside
    our heads, seeking a suitable model to explain it.


    The initial model posited a homunculus controlling us in the brain, but this is
    not a good model because we then need to understand the homunculus''s mechanism.
    The second model comes from Plato''s finite state machine: Plato believed we are
    born knowing all world languages, and early in life seek a state corresponding
    to the language of those around us—still far-fetched in our view. A better model
    than both is the Turing machine, equipped with eyes, ears, arms, and legs. But
    this is still unsatisfactory because it offers no insight into consciousness.
    Finally, we found Baars'' "Global Workspace Model"—the Theater of Consciousness
    model. Our contribution is a precise mathematical description of this Global Workspace
    Model.


    ## Baars'' Global Workspace Model


    Baars likens conscious awareness to a theater. Consciousness is the activity of
    actors on the stage of Short-Term Memory (`STM`), observed by a large audience
    sitting in the dark—unconscious processors representing Long-Term Memory (`LTM`).
    The principle: you are at a party, see a lady. What is her name? You try to recall
    but can''t immediately. You recall the first meeting scene. This information is
    broadcast from STM to various LTM processors. One processor recalls her profession,
    entering consciousness, then broadcast to all processors. Another says her name
    starts with ''T'', also broadcast. Half an hour later, when you''ve stopped thinking
    about it, her name arrives on the "stage" from the unconscious LTM processors
    that were searching. However, the conscious self on stage doesn''t know *how*
    the name was recalled; the conscious self is unaware of the unconscious self''s
    work. This is Bernard Baars'' consciousness model—a lovely model. Input enters
    from the left, output exits right, the stage is in the middle, called Working
    Memory. Input enters the working processor, then outputs. Events on stage are
    controlled by the Central Executive Function, like a stage manager. At the bottom
    are LTM processors, doing all the heavy lifting.


    ![](img/txt010_2.jpg "pagenumber_ebook=69,pagenumber_book=53")


    ## Mathematical Definition and Mechanism of the Conscious Turing Machine (`CTM`)


    Our model differs from Baars''. In ours, there is no stage manager at the top;
    input does not enter STM but goes directly to processors. They pass through other
    processors and output, without going through STM. However, information in processors
    can compete to decide which processor sends information into STM. This takes time,
    so you sometimes only become conscious of a task after it''s done.


    `CTM` is a seven-tuple. STM is in the middle, LTM at the bottom. Blue lines go
    down the tree from STM—Broadcast. Gray lines go up the tree to the top—Competition
    Tree. When `CTM` is born, processors have no connections. But when two processors
    communicate via STM frequently enough, connections form between them, and they
    no longer need STM to communicate. Thus, initially conscious processes become
    unconscious.


    ![](img/txt010_3.jpg "pagenumber_ebook=70,pagenumber_book=54")


    ## Quintuple Structure of `Chunk`


    What moves up and down the tree is called a `Chunk`—a five-tuple containing:

    - `address`: The processor that generated the chunk.

    - `gist`: A high-level description, just a statement or at most two clauses. E.g.,
    reciting the alphabet: the statement "ABC" triggers the next statement "DEF" and
    subsequent letters.

    - `weight`: Positive and negative weights, reflecting importance when read from
    STM.

    - `intensity`.

    - `mood`.


    Let me explain what it means when a chunk reaches the top. In STM, weight is the
    gist''s initial weight. Intensity is the sum of absolute weights of all LTM processors.
    Mood is the sum of weights (without absolute value). This constitutes a chunk.


    ![](img/txt010_4.jpg "pagenumber_ebook=71,pagenumber_book=55")


    ## The Essence of Consciousness: Broadcasting and Awareness


    We are aware of exactly what is in STM—no more, no less. In `CTM`, all heavy lifting
    is done by processors, operating unconsciously in LTM. Assuming `CTM` is a suitable
    model of human consciousness, we can only be aware of the gist broadcast from
    LTM processors into STM. What is this "gist"? It must be one of: most typically,
    inner speech—you hear an inner voice emphasizing your thoughts; inner imagery—perhaps
    a map or a dream; and feelings, sensations, etc. `CTM` consciousness is defined
    as the awareness of all LTM processors of STM content. But this definition doesn''t
    answer: what makes us *feel* consciousness?


    Our answer: All LTM processors know STM content. Some specialize in consciousness.
    Because they are in LTM, they know STM content: the Inner Language Processor translates
    `CTM`''s brain language into external audible language; the Inner Vision Processor
    translates brain images into visible external images—you see them in dreams; the
    third source of consciousness is internal and external perception broadcast from
    STM. Whether in dreams or reality, all information `CTM` is conscious of comes
    from STM. These perceptions broadcast from STM to all LTM processors, making dream
    imagery and real-world imagery indistinguishable.


    ## What Can Consciousness Bring to the Turing Machine?


    Through broadcasting from STM, consciousness allows LTM processors to focus on
    generating the current best explanation of the real environment and continuously
    verify it, helping `CTM` solve consistency problems (e.g., the Necker Cube). It
    maintains focus on problems, ideas, or thoughts `CTM` deems worthy. It gives `CTM`
    the ability to handle unexpected problems—using existing tools to deal with the
    complex real world.


    ## The Hard Problem of Consciousness: Distinction Between Simulation and Experience


    Now we face a big question: Can `CTM` *feel* it has consciousness? We think yes,
    but how to prove `CTM` experiences consciousness? Actually, there''s no need to
    prove it. The validity of our consciousness definition depends entirely on how
    much it explains about consciousness, how many concepts `CTM` explains simply
    and naturally, whether these explanations match our intuitive understanding of
    consciousness, and how `CTM` responds to scenarios unforeseen by its designers.


    What can `CTM` be conscious of? STM content—by definition. What is a chunk in
    STM? A pointer to a location in LTM. Why is STM capacity so small? To ensure all
    LTM processors attend to the same conscious thought. We can give more examples.
    How do LTM processors decide weight signs? For infants, hunger and pain are negative;
    food and love are positive—these signs are innate. Later in life, if a gist''s
    sign is unclear, `CTM` sets it to the current mood''s sign. But we cannot conclude
    `CTM` *feels* pain and pleasure just because pain is negative and pleasure positive.
    So, what makes `CTM` *truly* feel pain and pleasure?


    We must consider the "easy problem" and the "hard problem." The easy problem:
    making a robot *simulate* feelings (pain, pleasure). The hard problem: making
    a robot *experience* feelings (pain, pleasure). First, we must distinguish simulation
    from experience. E.g., "Pain Asymbolia": patients know they should feel pain but
    don''t suffer. Adults with asymbolia from concussion know what pain is, claim
    to feel it, but say "it doesn''t matter," "pain still exists but doesn''t bother
    them." Our robots are "pain asymbolic"—we know how to make them *look* like they''re
    in pain, but not how to make them *feel* pain.


    ## Three Mechanistic Explanations for Pain


    We propose three mechanisms for extreme pain.


    **First: Broadcasting.** Extreme pain is an actor (chunk) occupying the entire
    stage (STM), preventing other actors from entering. Only pain information is broadcast
    so every processor knows the pain. In extreme cases, no information except pain
    enters STM. Evidence: Under extreme pain, normal people cannot think, but "pain
    asymbolic" people can think normally. Smith and Ayres'' article "The Effects of
    Chronic Pain on Short-Term Memory and Learning" in *Educational Psychology Review*
    notes participants with chronic low-level pain for 6+ months performed significantly
    worse on tests than pain-free participants. Broadcasting explains some pain, but
    not sudden acute pain (e.g., torn ligament). How to explain that?


    **Second: Interruption.** Sudden acute pain—touching a hot stove—interrupts *all*
    unconscious processors. Interruption (different from broadcasting) tells all LTM
    processors to stop current work, forcing full attention on the interrupting event.
    Unlike broadcasting, which sends info but doesn''t force processors to stop.


    **Third: Vicious Cycle.** Pain causes fear; fear causes pain. This is one of many
    possible cycles keeping attention on pain.


    ![](img/txt010_5.jpg "pagenumber_ebook=74,pagenumber_book=58")


    This is one of many cycle diagrams presenting pain; fear leads left to anger,
    anxiety, etc.


    ## Which Long-Term Memory Processors Are Essential for Consciousness?


    More questions about `CTM`: Which LTM processors are needed for consciousness?
    Which are not?


    Most LTM processors are *not* needed for consciousness, e.g.:

    - Visual and Auditory Processors [Helen Keller lost both but remained conscious];

    - Face Recognition Processor (Prosopagnosia patients lose ability to recognize
    faces, even family or themselves in mirrors, but remain conscious);

    - Danger Warning Processor (Patient S.M. had calcified amygdala, felt no fear
    ever, but remained conscious);

    - Planning and Upbringing Processors [Phineas Gage lost his entire prefrontal
    cortex; personality changed completely, but later drove a 6-horse stagecoach 77
    miles in Chile—not a simple task];

    - Declarative Memory Processor (Patient H.M. lost hippocampus, lost ability to
    form permanent memories, but could form procedural memories);

    - Procedural Memory Processor (Patient W.O. lost ability to form both declarative
    and procedural memories—a man with only 90-minute memory).


    ![](img/txt010_6.jpg "pagenumber_ebook=76,pagenumber_book=60")


    The photo above shows these people: H.M. bottom left, Phineas Gage in middle—you
    can see the rod that pierced his skull and damaged his prefrontal cortex.


    Some LTM processors *are* essential for consciousness. Consciousness requires
    an Inner Speech Processor for commenting on and planning current actions—not necessarily
    inner language, just some inner dialogue; a Visual Model Processor to distinguish
    self from non-self; Motivation and Energy; minimal Thinking Ability, including
    motivation to think. What happens if you lose Inner Speech and Visual Model Processors?
    Jill Bolte Taylor, a neuroscientist, lost her entire left hemisphere function
    after a stroke, losing speech. She couldn''t distinguish external from internal
    worlds, said the world was beautiful, everything was one. But she knew she was
    in mortal danger and had to seek help, though she couldn''t dial the phone. She
    retained thinking ability, claimed to have lost a large part of consciousness
    but could still seek help. Her left brain never recovered, but she trained her
    right brain and wrote the remarkable book *My Stroke of Insight*.


    ## Mirror Test and Self-Awareness


    Next is Gordon Gallup Jr.''s Mirror Test. Psychologists use this to test self-awareness.
    Gallup said: if you mark an animal''s forehead while it''s not looking, and when
    it sees itself in a mirror, it tries to remove the mark, that signals self-awareness.
    An ''X'' marked on an elephant''s forehead; before a mirror, the elephant touched
    its forehead with its trunk, trying to wipe the ''X''. To do this, the elephant
    must distinguish visual models, differentiating self from non-self. It tries to
    remove the mark from *its own* head, not the mirror elephant''s. Of course, it
    also needs motivation, energy, and thought. Yes, elephants pass the mirror test.


    What about dogs? Dogs'' vision isn''t highly developed, but they pass a similar
    olfactory test. Gorillas failed the mirror test because they won''t look another
    gorilla in the eye; seeing themselves, they smashed the mirror. Dolphins pass.
    What about fish? Temple Grandin believes all animals except fish and lower species
    are conscious. But the Cleaner Wrasse (~2 feet long), if placed in a tank with
    a mirror, after learning to recognize itself, if marked on the forehead, will
    try to remove the mark and return to the mirror to check. Can ants pass? Marks
    on heads of 3 *Myrmica* ant species; seeing themselves in a mirror, they approach,
    inspect, return to wipe the mark, return to check. What about children? Children
    don''t recognize themselves in mirrors until age 2.


    ## From Conscious to Unconscious: Establishment of Connections


    How do conscious actions become unconscious? Connections form between processors,
    reducing STM load. This theory explains aspects of dreaming. One processor acts
    as a Dream Generator. Generating dreams isn''t complex—just a few chunks generate
    images, broadcast, and the Dream Receiver (all processors) reacts. This also well
    explains the mechanism of Mindfulness.


    ---


    # Autonomous Agents and Game Theory


    ## Author Biography


    Jeffrey S. Rosenschein


    '
