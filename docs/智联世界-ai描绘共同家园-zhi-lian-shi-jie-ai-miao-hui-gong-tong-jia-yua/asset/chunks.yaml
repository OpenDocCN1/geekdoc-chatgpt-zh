- raw: "我最近交流过的许多商业和公共部门的决策者都开始意识到，数字化不再是可选项，而是必备项。那些已经在使用创新技术驱动商业模式创新和自动化的公司，不仅在危机前更具韧性，在本次疫情期间也是如此。智慧企业能够利用最新技术，实时地将洞察力转化为行动，它们能更快实现数据驱动的创新和流程自动化，实现新的业务模式并提供卓越体验，以及对不断变化的世界做出更快的反应。\n\
    \n![](images/txt029_4.jpg \"pagenumber_ebook=226,pagenumber_book=210\")\n\n智慧企业应用\n\
    \n智慧企业拥抱这些创新的焦点就是人工智能技术。人工智能不仅帮助企业改进现有产品，更重要的是帮助他们创造新产品。\n\n从SAP的视角来看，人工智能更重要的应用在于智能分析、计划排产，以及按需求监测企业流程和生产运营。在制造过程中，当从采购到制造到交付和服务的供应链能够实现数字化时，公司就可以解决库存问题。再比如，通过将数字化流程中的数据与基于实时市场和销售数据的财务规划模型相结合，公司就能比其他竞争对手都更快、更好地开展市场行动。\n\
    \n所有这一切的关键因素就是数据。只有在获得正确的底层数据和语义的情况下，企业才能提高运营活动的整体智能和绩效。虽然已有一些预先训练好的人工智能服务工具，但只有当应用构建在企业自身数据之上时，它才能显现出其真正的价值。\n\
    \n将人工智能应用在聊天机器人和企业内部搜索固然能显著改善员工和客户的体验，但对于企业最有价值的应用还是在提高运营效率方面。例如，基于历史数据和外部数据，人工智能能够实现企业现金收款流程的自动化，通过标准化的数据模型和语义分析，我们能够在企业整体范围内实现规模化的数据分析。\n\
    \n从各公司的案例来看，人工智能不仅可以改善营收和提升利润，还能够对未来几个季度进行预测并提供能驱动未来业务发展的决策洞察。此外，人工智能能够通过提供多元化建议帮助企业克服潜在的经济冲击。\n\
    \nKaiserwetter是一家能源资产管理公司，这家公司最近开始在中国提供服务，它拥有一款名为Aristoteles的旗舰产品。Aristoteles通过智能数据分析和机器学习算法跟踪全球气象数据，从而智能预测用电量趋势，实现绿色发电，并实现能源运营财务指标的透明化。Kaiserwetter的人工智能应用是一个绝佳案例，表明公司盈利能力和可持续发展可以携手共进，这一最佳实践来自数据和技术的强大力量。\n\
    \n另外一个人工智能应用案例是REHAU集团。这家公司一直需要投入大量的人力资源处理他们的业务流程，这降低了效率并难以避免错误的发生。现在，REHAU中国分公司依靠智能机器人的流程自动化功能，每天自动处理数千份财务会计单据，以前4天才能完成的工作现在只要10分钟就能完成。\n\
    \n中国拥有所有国家中最雄心勃勃的人工智能战略，并为该战略的实施提供了最多的资源。SAP的一家主要研发实验室就设在上海，SAP正立足上海、服务整个中国。\n\
    \n![](images/txt029_5.jpg \"pagenumber_ebook=228,pagenumber_book=212\")\n\n李强：纵观过去4次全球低迷时期，每一次都有领先的企业利用先进科技脱颖而出，并推动全球经济复苏。我们坚信这次企业端数字化也将成为经济复苏引擎，而“人工智能”就是企业数字化金钥匙。\n\
    \n今天，我们正站在人工智能推动全球经济增长的转折点。根据相关分析，到2030年全球得益于人工智能推动的经济增长将高达15.7万亿美元，其中中国就占7万亿美元。增长动力主要来自企业生产力提高、产品和服务消费的增加以及劳动力水平的提升。\n\
    \n中国已经是全球第二大人工智能国家，无论是技术水平、人才数量、投融资额、专利数量等方面，中国都处于领先地位。但是，如果我们仔细分析，中国人工智能发展依然有不平衡的地方。人工智能应用场景中有超过50%来自互联网、金融、安防和交通，紧随其后的是与消费者相关的消费电子、教育医疗等领域。与之形成鲜明对比的是，占据中国经济半壁江山的制造业人工智能应用只占5%。换言之，人工智能对于中国制造、中国实体经济赋能仍然有很大提升空间。\n\
    \n![](images/txt029_6.jpg \"pagenumber_ebook=229,pagenumber_book=213\")\n\nAI赋能中国实体经济\n\
    \n2019年德国汉诺威工业博览会的主题就是“工业与人工智能的融合”。这次博览会上发布了超过500个人工智能的制造业应用场景，涵盖了设计、研发、制造、交付和服务的企业经营全过程、全价值链，为我们描绘了一幅人工智能打造智慧企业的全景地图。预计2025年60%的企业业务流程将会被人工智能所取代，我们坚定地认为工业与人工智能融合将会成为人工智能应用的主航道。\n\
    \n无论是SEW零部件制造商全自动化子智能工厂，还是奥迪最新电动汽车智能化工厂，以及库卡利用全自动化独立加工完成矩阵式生产，人工智能应用涵盖每一个工业领域。人工智能的应用能帮助企业应对客户个性化需求日益丰富、产品配置大幅增加、产品生命周期显著缩短的挑战，在生产效率提升、库存降低、按时交货等方面发挥作用，大幅度提升经济效益。\n\
    \n上海是中国的经济中心，在人才、科技、资本和先进制造业方面有非常强的优势。我们有理由相信，上海可以为中国制造和全球制造贡献一个人工智能与制造业结合的样板。作为欧洲最大科技公司、德国市值最大企业，SAP已经进入中国市场25周年，也是唯一一家将双总部（区域研发总部和业务总部）放在上海的大型跨国科技集团，我们还将加大对上海的投入，继续扎根上海，服务中国。\n\
    \n\uFEFF\n\n科技赋能，智“惠”大众\n\n葛 越\n\nApple全球副总裁、大中华区董事总经理\n\n![](images/txt030_1.jpg\
    \ \"pagenumber_ebook=231,pagenumber_book=215\")\n\nApple全球副总裁及大中华区董事总经理，负责领导并协调Apple中国团队。2008年加入Apple，担任无线技术副总裁，专注于几乎每一款Apple产品的蜂窝、Wi—Fi、蓝牙、NFC、定位和motion技术的开发。在为iPhone和iPad开发具有中国特色的功能方面发挥了至关重要的作用。任职Apple之前，曾在Palm担任无线软件工程副总裁，并在其他无线技术公司的技术与管理岗位担任重要角色。拥有不列颠哥伦比亚省西蒙弗雷泽大学电气工程学士学位和硕士学位，以及加州大学伯克利分校工商管理硕士学位。\n\
    \n![](images/txt030_2.jpg \"pagenumber_ebook=232,pagenumber_book=216\")\n\n疫情让我们看到了科技的力量，我们的用户以新的方式保持联络、收取信息、激发创意和生产力。我们同样也把人工智能技术应用在疫情防护和疫后重建中，比如苹果和谷歌联手开发的追踪技术能够精准地定位新冠肺炎患者的密切接触者。\n\
    \n机器学习是人工智能中非常重要的一个技术。相机是每一个人都经常用到的设备，利用机器学习可以帮助识别镜头中的人、物和位置，使照片的搜索和分享变得更加容易。语音助手，如苹果产品上的Siri使用的自然语言处理技术能了解用户需求，帮助用户获取信息，控制智能家居系统，甚至帮助语言不通的人们进行交谈。机器学习还能帮助识别手写输入，借助机器学习的功能，苹果手表可以知道用户是否摔倒，还能准确记录用户活动，帮助其养成健康生活习惯。现在，强大的机器学习功能大部分可以在设备端完成，比如苹果自研芯片中就有专门用于机器学习的处理器（神经引擎），它和CPU、GPU一起执行机器学习所需要的大量的运算，每秒可以完成高达5万亿次的运算。苹果的机器学习开发平台Core\
    \ ML也可以直接在设备端运行。\n\n迄今为止已经有超过10亿台苹果设备支持Core ML。通过机器学习控制模块，Core ML可以在CPU、GPU以及神经引擎上同时运行，这让开发者在不需要做额外工作的前提下，提高机器学习的性能和效率。人工智能视觉创作APP马卡龙玩图利用Core\
    \ ML在终端设备上处理用户视频，由于视频不需要上传至服务器，既节省了用户时间、为公司节省服务器的成本，还保护了用户隐私。马卡龙玩图的创始人蔡天懿认为，苹果的A13仿生芯片和Core\
    \ ML降低了创作门槛，让创意人士能够充分发挥他们的想象力。\n\n增强现实（AR）通过人工智能技术将虚拟的物体投射到真实的世界里，其绝妙之处在于能将原本不切实际、天马行空的想法直接呈现在你的眼前，改变了人们工作、学习、娱乐、购物和社交的方式。苹果AR系统采用硬件和软件结合的设计。苹果拥有世界上最大的AR平台，支撑数以亿计的苹果设备，同时提供多种AR开发工具。AR\
    \ Kit是苹果的增强现实开发平台，目前已经进化到了第四代，它包括一个深度测距的功能，使用深度传感器可以精确计算室内不同物体之间（包括用户与物体之间）的相对距离，从而帮助开发者开发更加完美的虚实结合应用。\n\
    \n应用商店（APP store）帮助全球2 300万开发者把自己的想法变成现实。2008年7月，苹果开启了应用商店的先河，并创造了大量的就业机会。2019年7月，苹果在上海启动了在华首个设计开发加速器中心，2020年上半年推出的线上讲座，帮助众多的开发者学习最新的技术。\n\
    \n人工智能的重要意义体现于下一代的培养，而培养人工智能人才要从学习编程开始。苹果智慧计划的目标是用技术去汇集创新的新一代，通过奖学金计划和比赛，学生能得到业内工程师的指导，并与同龄人交流，共同进步。每一个孩子都应该有机会学习编程，因此学习编程的机会需要延伸至贫困地区。当学生拥有更多的机会来表达观点的时候，他们的思维方式也会随之发生改变。\n\
    \n一个软硬件服务相结合并生机勃勃的生态能够创造就业机会、培养企业家精神，以及鼓励创新。苹果很自豪能去做这样的事情。展望未来，我们的工作不会止步，正如苹果\
    \ CEO库克所说，我们对技术巨大的潜力充满了乐观，但是我们也知道它绝不会自行发生。我们关注产品的人性化，每天都会竭尽努力将之注入设计中，期待让我们共同的家园更加美好。这个使命激励着我们用科技赋能，智“惠”大众。\n\
    \n\uFEFF\n\nRPA+AI，赋能自动化未来\n\n潘博文（Bobby Patrick）\n\nUiPath首席市场官\n\n![](images/txt031_1.jpg\
    \ \"pagenumber_ebook=235,pagenumber_book=219\")\n\nUiPath是全球增长最快且领先的机器人流程自动化（RPA）和人工智能软件供应商，不断引领世界走向“自动化优先时代”。作为首席市场官（CMO），负责带领团队制定并执行全球营销战略，助力各类规模企业日常业务运营的数字化发展，并应用人工智能推动真正的数字化转型。还是一位技术专家，从《财富》50强到初创企业，20多年来，一直推动着科技企业的显著增长。曾担任惠普公司数十亿美元云业务的CMO，负责业务的品牌国际化、产品营销、传播与需求挖掘，以实现公司的战略增长要求；担任Basho、GXS（由OpenText收购）和Digex（由Verizon收购）的CMO。16岁就开始了他在联邦调查局的计算机专家生涯。\n\
    \n机器人流程自动化（RPA）正在成为人工智能所赋能的下一代自动化。\n\nUiPath在2010—2012年致力于完善两项关键技术：计算机视觉和设计器。计算机视觉让软件机器人可以像人一样看屏幕，并具有同样的精确度和弹性；设计器则让非技术工程师能够真正构建自己的软件机器人，并自动完成自己的任务。这两项技术结合在一起，创造出一个令人惊叹的行业领域。\n\
    \n今天，任何人都可以去学习如何使用RPA并建造自己的机器人。UiPath首席执行官兼联合创始人丁澹然（Daniel Dines）说过：“自动化技术的潜力十分巨大，我们相信人工智能的强大力量可以让它几乎无所不能。”\n\
    \n几年前，UiPath就描绘了一个愿景，这个愿景非常类似于比尔·盖茨在20世纪70年代后期勾勒的“个人电脑成为每个家庭和办公室的必备品”，那就是“人手一个机器人”。每个人，无论是知识工人还是信息工人，或是生产线工人、调度工人、制造车间工人，或者是零售店的服务人员，机器人都可以帮助他更聪明地完成日常工作，无论这个工作是简单或是复杂的。\n\
    \n根据Gartner公司的数据，2019年10月排名第一的技术趋势概念是“超自动化”。自动化技术已经存在了几十年，但是当前的超自动化其实截然不同，它真正关乎时间、价值和速度，从而帮助解决过去5～7年中企业数字化转型中很难实现投资回报的问题。Gartner确定了超自动化的7个核心领域，其中一个围绕人工智能，另一个围绕机器学习和建模。我们需要建立一个内置平台，从而实现不管在桌面、后台还是在云端，都能在整个流程中应用高级分析的能力。从本质上讲，这就是RPA目前的发展方向。\n\
    \n在早期，RPA通常围绕较小的任务来展开，这能够产生很高的回报率，但更多只是以任务为导向。今天，RPA围绕着时间跨度更长的工作流程，该流程由工作台上由人操控的机器人以及在云或数据中心中的无人值守机器人协同完成。RPA通过流程挖掘，找出哪些具体流程应自动化，以便更容易地集成到现有的环境中。\n\
    \n人工智能的巨大潜力将改变每一个行业。科幻小说作家弗诺·文奇（Vernor Vinge）有一句名言：“我们正处在变革的边缘，这场变革的意义堪比人类出现在地球上。”我们已经经历了从技术时代到个人电脑时代，现在我们真正进入了自动化和人工智能的时代。今天机器学习的一个挑战是找到数据来应用机器学习模型，并让这个过程变得简单。\n\
    \n2020年，RPA已经和人工智能融合在一起。Gartner公司指出，80%已部署RPA的组织将引入人工智能。该公司还表示，到2023年，90%的大型企业将部署某种形式的RPA，并至少有4/5的企业将大规模部署RPA，这将真正大幅提高生产力。普华永道认为：“2030年，人工智能对全球经济的贡献将达到15.7万亿美元，仅在21世纪20年代就达到6.6万亿美元。”\n\
    \n人工智能真正应用到企业或商业流程的最佳途径就是通过RPA。\n\n通过RPA，机器人可以完成人类利用电脑做的各种工作：读写数据库、将数据在不同系统中进行转移、登录应用程序等。当你在RPA上应用人工智能时，你就会开始考虑如何真正理解内容、理解文档，如何真正帮助聊天机器人变得更有效。机器人不再仅仅是模仿人类，更可以帮助人类专注于思考运营策略、增强决策能力。\n\
    \n人工智能能让包括高度不确定性的流程自动化。现在人们执行的大多数流程不仅仅是查询SQL数据库，实际上还会与不同的网站、不同的应用程序发生交互，还与不同种类的图像、视频、内含签名的文档、可更正的PDF文档、非结构化电子邮件发生交互。比如，通过一张胸部X线片来确定某个人是否感染了新冠肺炎，或者对零售企业进行库存管理、定价优化，以及在金融服务领域开展欺诈侦查、了解客户要求、反洗钱等。如何将基于规则的流程转化为基于经验的流程呢？这就是人工智能真正能发挥作用的地方。\n\
    \n我们的大型企业客户正在以不同的方式在整个流程中应用人工智能，将基于规则的工作流转变为基于经验的工作流，推动效率提升，获得竞争优势。人工智能可以帮助实现RPA自动化，而更快扩展自动化也能便于人工智能识别、确定并优先处理可带来最大利益的流程。全球范围内，当前只有16%的人工智能项目已经进入生产环节，提升这个比例将是巨大的挑战，我们认为当前最佳的途径是通过RPA平台直接向通过该平台的数据流应用人工智能模型。\n\
    \n总的来说，RPA是一个令人惊叹的技术集合，其美妙之处在于你可以很快得到结果。应用人工智能，能够帮助一个流程从基于规则转向基于经验，随着时间的推移不断学习，其益处是可以长期持续的。这就是为什么RPA确实被证明是人工智能的最佳途径，正如我们的创始人丁澹然早些时候提到的，这是创建一家自我完善公司的最佳途径，也是企业最终实现在市场和最智能的企业中拥有最强竞争力的方法。\n\
    \n\uFEFF\n\n用人工智能点亮人间烟火\n\n刘庆峰\n\n科大讯飞股份有限公司董事长\n\n![](images/txt032_1.jpg \"\
