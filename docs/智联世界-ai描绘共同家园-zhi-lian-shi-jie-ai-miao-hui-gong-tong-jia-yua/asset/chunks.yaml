    \ Laurer）在1973年就发明出了被称为20世纪最伟大发明之一的条形码，而条形码真正被广泛采用却是二三十年之后。\n\n在人工智能领域有一句笑话说：有多少人工智能，背后就有多少人工。这是人工智能早期开发中所需要经历的学习曲线，有人形容这个规律为“播种的时节和收获的时节”。\n\
    \n1965年，摩尔在集成电路制造上总结出了“当价格不变时，集成电路上可容纳的元器件数目，约每18～24个月便会增加一倍，性能也将提升一倍”，从而形成了摩尔定律。赖特早在1936年就发现飞机制造的产量每增加一倍，生产成本就会下降20%，这被后人称为赖特经验曲线或者赖特定律。2013年圣塔菲研究院和麻省理工学院的研究人员通过收集研究62项来自化工、能源和信息技术的数据，验证了赖特定律和摩尔定律适应于不同的行业。\n\
    \n随着时间的推移、经验的积累、算法的丰富、投资的增加，人工智能也会突破早期的学习成本，加速在各行各业的部署。也许20年后，许多公司从某种意义上来说都是AI公司，如同今天许多银行也是金融科技公司一样。\n\
    \n早期人工智能的研究仅仅是由科学家们的好奇心驱使。比如IBM的人工智能研究始于1952年，当时科学家想要实现人工智能仅仅是为了下西洋跳棋。1997年IBM的深蓝计算机战胜了当时的国际象棋冠军卡斯帕罗夫，被认为是人工智能彪炳史册的转折点。又经历了二十几年的发展，人类在绝大多数棋类游戏上，已经完全不是人工智能的对手。今天随便一部智能手机都已经配备了很强的人工智能，无论是自然语言理解和交互，还是图像识别，其功能都已让过去的大型计算机望尘莫及。\n\
    \n## 莫蹉跎，莫错失\n\n一项技术必须在应用中找到自己的沃土，也只有在应用中才获得生命力，同样一个行业必须与时俱进，不断拥抱新的科技才能得以赋能，提升自身的竞争力。今天，无论是制造业、医疗健康、金融、零售、教育、政府机构、农业等，人工智能都已显现威力，将来还会发挥出更大的潜力。\n\
    \n企业在疫情背景下正加快数字化转型，而人工智能已经成为它们难以回避的选项。人工智能作为一项通用技术，会进一步和各个行业和各项技术融合，不断形成外溢效用。人工智能将持续提升生产效率并降低使用成本，并在未来的几十年甚至更长时期对商业、生活、社会治理带来变革性的影响。虽然人工智能依然有一个持续完善的过程，但这并不妨碍企业尽早拥抱人工智能，尽早获益，提升企业竞争力。作壁上观只会坐失良机。\n\
    \n“朝看水东流，暮看日西坠”，莫等万事成蹉跎。创新带来的收益往往都集中在创新者、早期尝鲜者或早期跟随者，晚来者往往会变成看客，被边缘化甚至被淘汰。智能手机的利润大多集中在几家公司手里，谷歌和Facebook占据了网络广告收入的绝大部分。企业应不迷茫于今日，不错失于未来。\n\
    \n---\n\n# 人工智能的未来挑战与突破\n\n## 杨 强\n\n微众银行首席人工智能官、香港科技大学讲席教授、中国人工智能学会（CAAI）荣誉副理事长\n\
    \n![](images/txt015_1.jpg \"pagenumber_ebook=112,pagenumber_book=96\")\n\n微众银行首席人工智能官，香港科技大学讲席教授，人工智能促进协会（AAAI）执行委员会委员，中国人工智能学会（CAAI）荣誉副理事长以及香港人工智能与机器人学会（HKSAIR）理事长，第四范式公司联合创始人，国际人工智能联合会（IJCAI）理事会主席。同时也是AAAI/ACM/CAAI/IEEE/IAPR/AAAS会士。曾获2019年度“吴文俊人工智能科学技术奖”杰出贡献奖以及2017年ACM\
    \ SIGKDD杰出服务奖。最新著作有《迁移学习》和《联邦学习》。\n\n## 戴文渊\n\n第四范式创始人、首席执行官，迁移学习学者\n\n![](images/txt015_2.jpg\
    \ \"pagenumber_ebook=113,pagenumber_book=97\")\n"
