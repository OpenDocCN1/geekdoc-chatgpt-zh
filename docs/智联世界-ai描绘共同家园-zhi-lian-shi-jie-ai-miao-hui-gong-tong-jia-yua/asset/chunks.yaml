    \  - Infrastructure Transformation Drives Humanity's Leap to Machine Civilization\n\
    \  - Chip Computing Power, Algorithm Level, Algorithm Models, Training Computing\
    \ Power Increase by 10,000 Times\n  - AI Empowering Robotics and High-End Manufacturing\n\
    \  - New Decade of Digital-Intelligent Interconnection\n  - Intelligent Interconnection,\
    \ Stimulating New Momentum for the Auto Industry\n  - AI Building Future Logistics:\
    \ How the Port of Hamburg Embraces Digitalization and AI\n- Connection·Integration\n\
    \  - 5G Makes AI More Ubiquitous, AI Makes 5G Smarter\n  - 5G+AI Opens the Future\
    \ of Intelligent Interconnection\n  - 5G and AI Will Transform Many Sub-fields\
    \ and Industries\n  - AI Innovation in the 5G Era\n  - Cross-Disciplinary Integration\
    \ of AI\n- Appendix: Review of the 2020 WAIC Cloud Summit\n  - I. Gathering a\
    \ Strong Lineup of Guests, Pooling Wisdom from Academia and Industry\n  - II.\
    \ Shaping a Superior Cloud Attendance Experience, Setting a New Benchmark for\
    \ Innovative Conference and Exhibition\n  - III. Spreading a Strong Voice of Industry\
    \ Development, Shaping Authoritative Influence Domestically and Internationally\n\
    \  - IV. Innovation Awards in Various Fields Link \"Global Creativity,\" Accelerating\
    \ Transformation of Original Achievements\n  - V. Full-Chain Cooperation Links\
    \ \"Global Resources,\" Accelerating the Cohesion of Development Synergy\n  -\
    \ VI. Activities at All Levels Link \"Global Brains,\" Promoting Exchange and\
    \ Integration\n- Postscript\n\n# Home·AI (Love)\n\n## Era of Transformation: Responsibility\
    \ Over Worry\n\n**Jack Ma**\n\nCo-Chair, UN High-Level Panel on Digital Cooperation\n\
    \n![](img/txt002_1.jpg \"pagenumber_ebook=18,pagenumber_book=2\")\n\nFounded Alibaba\
    \ in 1999, serving as Chairman of the Board and CEO until May 2013, and as Chairman\
    \ of the Board from May 2013 to September 2019. Also a member of the Board of\
    \ Trustees of the World Economic Forum (WEF) Foundation, President of the Zhejiang\
    \ Merchants Association, and Chairman of the China Entrepreneur Club. Has served\
    \ as Co-Chair of the UN High-Level Panel on Digital Cooperation since 2018. Graduated\
    \ from Hangzhou Normal College (predecessor of Hangzhou Normal University) with\
    \ a major in English Education.\n\n![](img/txt002_2.jpg \"pagenumber_ebook=19,pagenumber_book=3\"\
    )\n\nI am currently in Yunnan, and it is a great honor to join your discussion.\n\
    \nThis is a very special conference, perhaps even a historic one. When we gathered\
    \ in Shanghai for the first AI conference, no one would have imagined that this\
    \ year we would continue last year's seminar in such a way.\n\nI remember last\
    \ year some among us were still worried, still debating whether machines would\
    \ replace humans and what to do about employment; now what we are most anxious\
    \ about is how to let machines replace many human jobs as soon as possible. For\
    \ example, in the field of virus transmission, we try every means to let machines\
    \ solve problems rather than letting people rush to the front lines. So the world\
    \ is really like this: what we worried about didn't happen, but what we didn't\
    \ worry about keeps happening one after another.\n\nToday's problems are caused\
    \ by the decisions we made yesterday, but we can hardly change yesterday, and\
    \ are often powerless even for today; what the future should look like is what\
    \ we can decide today. I think we should regard the changes brought to the world\
    \ by the epidemic as a signal from nature, from the future. I want to share three\
    \ thoughts I've had these past few days:\n\n### First, humans cannot leave Earth,\
    \ but Earth can leave humans.\n\nAfter the Industrial Revolution, humans had the\
    \ ability to look outward, landed on the moon, built space stations, tried to\
    \ survive in space, and many outstanding people including Elon Musk began great\
    \ explorations of worlds beyond Earth.\n\nNext, because of the Digital Revolution,\
    \ humans have the ability to explore inward, to truly understand themselves, and\
    \ to truly understand Earth. In comparison, human exploration of themselves appears\
    \ more difficult and more important.\n\nToday, human understanding of themselves\
    \ is very limited; even the top brain scientists understand less than 10% of the\
    \ human brain. This epidemic has shown us humanity's unfamiliarity with itself\
    \ and with Earth. Because we don't understand ourselves, don't understand the\
    \ world we survive in, don't know this Earth, and don't cherish and protect it,\
    \ we have created many troubles and disasters. I think the most important thing\
    \ for humanity now is to solve its own problems and solve Earth's problems; otherwise,\
    \ no matter where we migrate, no matter which planet we go to, we will still face\
    \ such troubles and disasters.\n\nIn fact, we humans still cannot leave Earth,\
    \ but Earth might be better off without us. I saw a few news items recently: due\
    \ to the reduction in tourists, the deer in Nara, Japan, ate fewer snacks and\
    \ their stomachs recovered health; after Venice, the city of water in Italy, was\
    \ locked down, the water became clearer, and fish could be seen in the water.\
    \ If Earth is a company, nature is the real boss; humans are merely managers selected\
    \ by nature. Humans have great power, but nature can fire us at any time.\n\n\
    Many things are not wrong for humans, but are big mistakes for nature. If humans\
    \ keep bringing disasters to nature, nature will surely repay humans with disasters.\
    \ We humans must learn to coexist with nature; only by following and respecting\
    \ nature can humans survive on Earth.\n\n### Second, economic growth can slow,\
    \ but humans must grow.\n\nThe epidemic has made us realize that the world's ecosystem\
    \ is largely influenced by microorganisms, not the highest-level animals. Just\
    \ like in the African savanna ecosystem, the important role is played by microorganisms,\
    \ not lions and elephants. We humans must never think too highly of ourselves.\n\
    \nI think AI should be translated as \"Machine Intelligence\"; translating it\
    \ as \"Artificial Intelligence\" shows humans thinking too highly and too greatly\
    \ of themselves. Many things are difficult for humans but very easy for machines.\
    \ Animals have instincts, machines have intelligence, and what humans possess\
    \ should be wisdom.\n\nFor thousands of years, human knowledge has grown rapidly,\
    \ technology has developed, but human wisdom has not grown.\n\nToday, the resources\
    \ and wealth we possess are unprecedented; the knowledge and technical capabilities\
    \ we possess are also unprecedented; of course, the troubles we face are also\
    \ unprecedented.\n\nToday, humanity's accumulation of knowledge, information processing\
    \ capabilities, and risk resistance capabilities are the most powerful in history.\
    \ But regrettably, we lack wisdom. We sometimes fail to use these resources, capabilities,\
    \ and knowledge to strengthen communication and cooperation; sometimes we even\
    \ create many barriers and even widen differences. Humanity has never lacked disasters,\
    \ but after disasters, we must grow. Otherwise, I believe that what will destroy\
    \ human civilization in the future will not be viruses, but humans themselves.\n\
    \nPeople and people, countries and countries, no two are the same; they are definitely\
    \ different, and will remain different forever. It is because of our differences\
    \ that the world is rich and colorful. Many of the world's problems today are\
    \ caused by not respecting the many differences and divergences between each other.\
    \ Seeing differences, yet still being able to put aside divergences, learning\
    \ to respect and appreciate each other's differences—this is the mark of human\
    \ civilization's progress.\n\n### Third, if digital technology used to make life\
    \ better, then future digital technology is to enable humans to survive better!\n\
    \nThe epidemic has not changed the trend of technological transformation, but\
    \ it has accelerated the transformation of digital technology, because disasters\
    \ force us to innovate.\n\nAn expert using the naked eye to read a CT scan of\
    \ a suspected COVID-19 case takes 15–20 minutes; later, Chinese technicians developed\
    \ an intelligent algorithm for COVID-19 CT imaging in a very short time, and the\
    \ machine only needs 20 seconds to read a suspected case scan, 60 times the efficiency\
    \ of an expert.\n\nI heard that during the epidemic, farmers used satellite remote\
    \ sensing technology to get loans. That is, farmers delineate their own rice fields\
    \ on a map via a mini-program on their mobile phones; satellites identify the\
    \ growth of crops in the fields through remote sensing images; the machine estimates\
    \ yield and value by combining climate, industry, and other factors, and then\
    \ decides how much loan to give the farmer.\n\nInnovations using Internet technology\
    \ to keep oneself alive and keep others alive during the epidemic are everywhere.\
    \ Attending classes, holding meetings, shopping, seeing doctors... maintaining\
    \ the operation of life all must rely on digital technology. Innovation for survival\
    \ is the truly most powerful and unstoppable driving force. The general trend\
    \ of digital technology has not changed, but in the future, digitalization that\
    \ originally took thirty to fifty years to complete may accelerate to completion\
    \ within 10 or 20 years. This is a huge change after a huge change; technological\
    \ transformation advances and accelerates. This is what we need to prepare for,\
    \ and it is the completely different situation faced by this year's AI conference\
    \ compared to last year's.\n\nSeparated by a year, the world has undergone tremendous\
    \ changes. Today's us no longer have time to worry; rather than worry, we should\
    \ take responsibility. Because the virus needs no visa, knows no borders; technology\
    \ should not have borders either, and should not distinguish between you and me.\
    \ Today's disaster is enormous; today's disaster may have just begun. We have\
    \ no other choice. So, the earlier we start cooperation, unity, and banding together,\
    \ the earlier we will win.\n\nThank you all again!\n\n## Opportunities and Outlook\
    \ for AI Evolution\n\n**Elon Musk**\n\nCo-founder & CEO, Tesla\n\n![](img/txt003_1.jpg\
    \ \"pagenumber_ebook=24,pagenumber_book=8\")\n\nCo-founder and CEO of Tesla, leading\
    \ product design, engineering, and manufacturing of the company's electric vehicles,\
    \ battery products, and Solar Roof. Also co-founder, CEO, and Chief Designer of\
    \ Space Exploration Technologies Corp. (SpaceX), leading the R&D and manufacturing\
    \ of advanced rockets and spacecraft. Also founded The Boring Company and serves\
    \ as CEO, and serves as CEO of Neuralink.\n\n"
