    '
  trans: '

    # 微软携手 Adaptive Biotechnologies 推进 T 细胞分析与 AI 医疗应用


    如前文所述，微软与 Adaptive Biotechnologies 公司携手，对新型冠状病毒进行深入的 T 细胞分析，并将所有数据公开发布在 Immune
    Code 数据库中，以期促进基于 T 细胞的新诊断方法、新药物疗法和新疫苗的研发工作。


    微软一直在无偿提供云端的 GPU 计算能力，以及研究人员的专业知识，帮助如 Immunity Bio 这样的公司加快疫苗研发工作。值得一提的是，Immunity
    Bio 使用的计算能力是 2002 年第一次 SARS 暴发期间全球最大的超级计算机的计算能力 250 倍以上。如今的云计算能力着实惊人。


    最后，微软还将 AI 医疗技术用于其他用途，例如血浆捐赠、临床试验、文档阅读等。


    ## AI 赋能血浆捐赠与临床试验


    在疫苗研制成功之前，最有希望的治疗方法之一是使用康复患者的血浆，可以是直接用康复患者的血浆进行输血治疗，或是生产多克隆超免疫球蛋白类药物。为了确保疗法可靠，需要让更多新冠肺炎的康复患者知道如何捐赠血浆。为此，微软使用了
    Health Bot 的一个版本—Plasma Bot，帮助人们确定是否有资格捐赠康复期血浆，并且了解在哪里以及如何进行捐赠。


    同样，微软一直在测试部署另一种 Health Bot，用来帮助患者和医生找到可能对他们有帮助的最佳临床试验方案以及需要患者参与的试验。这种 Clinical
    Trials Bot 使用了最先进的文档机器阅读技术，可以自动阅读`clinicaltrials.gov`网站上对各项临床试验进行解释的文档，为 Health
    Bot 构建了智能对话的能力。


    ## Hanover 技术助力医学研究


    此外，在帮助医学研究人员更快地取得研究进展方面，AI 也可以有所帮助。每天仅仅发布在 PubMed 上的论文和摘要就有 4000 多篇，远远超出任何人或团队的消化吸收能力。借助
    AI 机器阅读技术，微软开发了 Hanover 技术，它能够阅读所有论文，并制作全面的知识图谱。这种知识图谱可用于协助决策制定，例如它曾帮助缅因州的杰克逊实验室等癌症中心进行癌症治疗的决策。随着新型冠状病毒研究和临床试验的爆炸式增长，专门针对新冠肺炎相关研究的
    Hanover 最新版，将有着巨大的应用潜力。


    ## 医疗数据进步：过去四个月超越以往四年


    我们观察 AI 在医疗和应对新型冠状病毒的过程中所发挥的作用时，可以看到数据的惊人重要性。确实，数据在医疗和新冠肺炎疫情应对上，起到了至关重要的作用。当下正是科技和医疗行业的关键时刻，如何管理共享医疗数据，正处于转变的十字路口。这其中涉及政策、技术标准、互操作性、隐私性、安全性等许多问题。


    尽管大家都知道数据在 AI 解决方案中至关重要的作用，但也遇到了诸多挑战。任何想在医疗行业尝试使用机器学习或人工智能的技术研究者，都会在数据获取上遭遇困难。不少医疗技术初创公司能够提供非常出色的产品和服务，但由于缺乏数据，无法形成具有实际意义的功能。


    表面上看，我们淹没在数字的海洋里。但是，它们几乎总是处于格式不兼容的孤岛中，同时又被锁在规则复杂的迷宫里。塞缪尔·泰勒·柯勒律治（Samuel Taylor
    Coleridge）于 1798 年写过一首古诗《古舟子咏》（Rime of the Ancient Mariner），诗中描述主人公被困在茫茫大海中，没有风，船随波逐浪，“到处都是水，却无一滴可饮”（“water，
    water， everywhere， nor any drop to drink”）。


    不过有迹象表明，当下的新冠肺炎疫情让很多事情发生了变化。从某种意义上说，过去 4 个月的进步甚至超过了过去 4 年。如果你的工作涉及医疗数据，你需要了解“FHIR”即“快速医疗互操作性资源”是什么。这是一个新的全球数据标准，其目标是以一致、便于实施和严格的方式简化数据操作和维护数据完整性，以在医疗应用和医疗组织之间交换数据。


    ![](img/txt025_7.jpg "pagenumber_ebook=210,pagenumber_book=194")


    ## FHIR：医疗数据交换的基础


    FHIR 涉猎范围广泛，涵盖了为人类和动物提供服务的各种诊所、临床护理、公共卫生、临床试验、行政管理和财务部门。这套数据标准旨在供全球范围内各种体系结构和场景中使用。作为完全现代化且可扩展的数据标准，FHIR
    有能力让 AI 系统在全球范围内扩展，因为即使目前只能在给定的医疗系统中使用 FHIR，最终目标仍然是所有 AI。


    为了确保为将来的医疗发展奠定基础，可以为机器学习算法提供不偏向特定地理位置的数据，无论是患者数据库、遗传基因库，还是治疗方法，都需要一个具有全球扩展潜力的系统，而
    FHIR 正是为此而设计。可以畅想一下未来的医疗服务，运用 FHIR 找到一种便捷的方式，让各地区之间可以交换数据，同时满足人们的各种安全和隐私需求。


    能够在新冠肺炎疫情下做到这一点极其重要。正如我们所吸取的最大的教训，保障公共健康和应对公共卫生危机离不开数据以及数据的交换共享。为此，微软通过云计算平台 Azure
    提供了世界上第一个基于云的 FHIR 服务。基于 Azure 的 FHIR 服务器可作为开源产品使用，而为 FHIR 设计的 API 则可作为完全托管的“平台即服务”来提供。


    微软在此基础上启用了众多托管服务，通过在云上无缝管理受保护的医疗信息为客户赋能，无论这些数据是来自远程连接的设备、电子病历系统，或是任何其他来源。在现代化医疗数据互操作性基础上，还将
    Teams、Dynamics、Power Platform、Azure 和 Azure AI 中的各种功能整合到“微软医疗云”这一产品中。除了云服务，微软也将继续与世界各地的政府合作，甚至与最激烈的竞争对手合作，来确保共同营造一个更加以数据为驱动的未来。


    可以说，这是技术基础架构的巨大转变，因为如此大规模的迁移上云，在历史上或许只会发生一次。业界伙伴需要共同努力，在做出了这一转变之后，未来才可能有更好的医疗服务和公共卫生体系。今天的努力是为了促进公共卫生、医疗服务供给和科学研究的共同进步，今天的每一个选择，都对未来影响重大。


    因此，我们需要所有人共同努力应对数据挑战，这样才能从眼前的危机中恢复，并且防患于未然，最终建立一个更美好、更安全的世界。


    # 以 AI 之力引领医疗未来


    ## 作者简介：苏博科


    苏博科（Pascal Soriot）


    阿斯利康全球首席执行官


    ![](img/txt026_1.jpg "pagenumber_ebook=212,pagenumber_book=196")


    自 2012 年 10 月 1 日起担任阿斯利康全球首席执行官，任职以来，引领了阿斯利康的变革，使之成为一家科学至上的全球生物制药企业，专注于肿瘤、呼吸、心血管、糖尿病、肾脏疾病领域。加入阿斯利康前，曾在瑞士巴塞尔担任罗氏制药首席运营官，在此之前曾在美国就任基因泰克首席执行官并领导了与罗氏制药的成功合并。拥有法国迈松阿尔福国家兽医学院兽医学博士学位及巴黎高等商学院工商管理硕士学位。


    ![](img/txt026_2.jpg "pagenumber_ebook=213,pagenumber_book=197")


    ## AI 在医疗领域的应用实践


    现在全球都感受到了新冠疫情的影响，虽然很多地方有效控制了疫情，但是全球性的挑战依然存在，仍然需要我们共同来应对，只有这样才能够取得经济社会的进一步发展。在这方面，AI
    能够发挥重要的作用。AI 有巨大的潜能，可以改善制造产品和提供服务的能力，以及改变人们互动交流的方式，这里我想借助阿斯利康的实践，谈一谈 AI 在医疗方面的应用。


    AI 可以帮助研发新药，赋能新药的生产，也可以提高对疾病的诊断能力。长期而言，AI 能够帮助我们预测甚至是预防疾病。当前，在世界人口老龄化、预期寿命上升以及如癌症、糖尿病等慢性疾病日益普遍的背景下，世界各地的医疗体系都面临巨大挑战，而新冠疫情更是加重了这种挑战，因此，AI
    在医疗领域取得的进展非常重要。


    为了让 AI 能在应对这些挑战时发挥更大作用，我们必须协同合作，其中信息分享尤为重要，必须确保数据能合理存储、及时分享，并保证数据安全。我们要把在医院、诊所、个人终端收集的数据加以整理并用统一格式存储，从而确保数据可以应用于不同的项目。个人设备获取的数据应该能供医生远程使用，甚至跨越国界，同时我们又要保护数据安全，确保用户隐私不被泄露。只有当人们能够信任数据运用的方式，才能够乐于分享数据。也只有这样，我们才能更好、更高效地运用数据，并将数据的市场效益最大化。


    在 AI 的应用方面，以阿斯利康为例，我们不是以碎片化的方式来应用技术，而是采用一个整体的方法，把数据科学和 AI 运用在药物的整个生命周期中。


    阿斯利康和其他企业一起为复杂疾病研发新药。我们运用在治疗疾病方面的专长以及对数据科学、生物医学的理解，更好地了解疾病机制，更好地找到治疗的靶向目标。


    现在我们在测试新药有效性和进行临床试验时，超过 70%的数据从家庭收集，这意味着更少的随访、对患者生活更少的干扰，并让我们的临床试验更加高效。


    AI 也能在药品生产中发挥作用，减少人力投入。我们利用 AI 对生产设备进行更好的维护和保养，并在设备发生故障后更及时地进行维修。不管是对患者、我们自己或者整个社会，这都非常重要。


    在诊断和治疗方面，阿斯利康与剑桥大学运用 AI 进行新冠肺炎患者的管理，让医生能够更快更准地进行诊断，让医院可以更高效地进行资源配置，这增加了患者生存和康复的概率。


    ![](img/txt026_3.jpg "pagenumber_ebook=215,pagenumber_book=199")


    ## 中国市场的 AI 医疗创新


    以上都是中国以外的例子，然而我认为 AI 在医疗领域最令人振奋的应用在中国。在中国，我们看到技术迅猛发展，百度、阿里巴巴、腾讯这样的企业已成为世界巨头，并拥有众多的合作伙伴。中国的人口、产业实力、政府领导力和创业文化都能让技术能得到更好的发展，让数字化可以更好地推广。中国的软件工程师们有很高的目标，他们和产业界一起创造了一个新的生态系统，让
    AI 技术蓬勃发展。


    阿斯利康在中国的 AI 实践主要是在复杂疾病管理和治疗方面。2017 年，阿斯利康在无锡建立了 AI 创新中心（药物开发合作平台），并建立了全程疾病管理解决方案。运用
    AI 和数据科学技术，诊断变得更加高效准确，从而让治疗变得更加有效，这让我们能够更多、更好地对患者进行治疗。


    有 3 个案例可以证明我们取得的进展。第一是肺癌治疗一体化中心。我们将 AI 技术应用于肺部影像的造影、CT，减少医生负担，帮助患者更快得到诊断结果，而时间对于这类患者而言，非常宝贵。第二是在消化道肿瘤方面。我们将
    AI 技术应用于消化内镜的诊断，提高诊断效率和准确性。第三是咳喘管理中心。我们利用 AI 帮助呼吸道患者自动检测自身健康状况，提醒他们遵照医嘱，同时及时与患者沟通。如果没有
    AI，我们完全没有办法同时管理那么多患者，并保持很高的服务水平。


    ![](img/txt026_4.jpg "pagenumber_ebook=216,pagenumber_book=200")


    我们已经看到 AI 改变社会、经济和产业的潜力，但这仅仅是开始，相互学习可以让我们找到更多进步的方法。阿斯利康一直都在寻找最好的伙伴进行医疗领域的研发，让医疗服务更加高效、便捷和普惠。


    # 机遇：机器学习大有可为


    ## 作者简介：斯瓦米·西瓦苏布拉曼尼


    斯瓦米·西瓦苏布拉曼尼（Swami Sivasubramanian）


    亚马逊 AWS 全球副总裁


    ![](img/txt028_1.jpg "pagenumber_ebook=218,pagenumber_book=202")


    亚马逊 AWS 全球副总裁，负责亚马逊人工智能和机器学习领域的业务。负责 AWS 核心数据库业务的工程设计、产品管理和运营保障，而这一核心数据库正是 AWS
    以下产品的基础构建模块：DynamoDB、Amazon ElastiCache、Amazon QuickSight、SimpleDB 以及其他一些大数据业务。拥有
    200 多项发明专利，发表过 40 余篇科技论文，同时也是多个学术团体和行业组织的成员。此外，还打造了 30 多项 AWS 云服务，包括 CloudFront、Amazon
    RDS、Amazon S3、Amazon’s Paxosbased lock service 等。与沃纳·威格尔（Werner Vogels）先生合著的 Amazon
    Dynamo 论文（`http://bit.ly/1mDs0Yh`）荣获“美国计算机协会名人堂大奖”。Amazon Dynamo 现已成为诸多 NoSQL
    系统的基石。


    ![](img/txt028_2.jpg "pagenumber_ebook=219,pagenumber_book=203")


    ## 机器学习进入黄金时代


    我们生活在人工智能和机器学习的黄金时代，这是一个一切皆有可能的时代。很多意见领袖说机器学习就是未来，但它早已不仅是未来，机器学习正在对各个地区、各行各业产生重要影响，几乎彻底改变了我们生活和工作的方方面面。机器学习有潜力帮助我们应对那些人类社会面临的最为严峻的挑战，但我们需要找到正确使用这一工具的方法。


    机器学习已从一项人们渴望的技术，迅速发展成为一项主流技术。在过去很长一段时间中，机器学习仅是极少数科技公司和核心学术研究人员的专利，直到云计算成为主流，情况开始发生变化。原因是机器学习的数据密集型算法非常消耗计算机资源，而云计算的出现让普通大众都能访问到机器学习所需的计算资源，利用其数据存储能力。现在，从金融业到零售业，从农业到医疗保健行业等，机器学习正被各个行业普遍采用，并从外围深入到业务的核心。


    ## 机器学习如何影响客户


    曼特尔实验室是一家总部位于英国的农业技术初创公司，业务是向英国境内客户提供其由人工智能驱动的农作物监测解决方案。这项技术的工作原理是通过评估农作物的卫星图像，及早向农户和零售商报告可能出现的问题，以便他们能够更好地调整供应、采购和库存计划。该平台部署了定制的机器学习模型和亚马逊机器学习平台
    Sage Maker，能够基于多颗卫星拍摄到的图像对农作物生长情况进行实时评估。这项重要技术比以往任何时候都更能帮助各种企业、食品杂货连锁店和农民实时评估供应链的状况。


    另一个案例是总部位于加拿大的初创公司 Blue Dot，该公司的产品是使用机器学习算法预测疾病暴发。Blue Dot 监测超过 65 种语言的新闻，包括动物疾病等的信息，来预测和分析可能出现的疫情。信息会交由流行病学家审查，他们从科学角度验证结论的准确性，然后形成专业意见提供给公共卫生部门的官员和医院。在此次新冠肺炎病毒开始流行时，Blue
    Dot 就是最早发出警报的机构之一。


    初创公司 Giant 是一家中国的休闲游戏开发商。他们关注如何利用机器学习来完成用户留存和提高盈利水平等目标。该公司在 Sage Maker 上构建各种机器学习模型，并持续在亚马逊云服务（AWS）和游戏平台上获得新的收入来源。


    ## 找到合适的问题并建立科学的组织架构


    在从事了 10 年机器学习相关工作，并与许多经历了机器学习不同发展阶段的客户进行讨论后，我认识到有 4 个因素能促进机器学习得到成功采用。首先是数据，当谈到真正的机器学习时，数据整理是需要做的第一个工作；其次是对于机器学习如何应用的理解；再次是解决人才缺乏的问题，从而打破技术限制；最后是不要进行无差别的繁重工作（如每个机构都去建立自有的机器学习基础设施）。


    为机器学习寻找适当的场景，其实就是为机器学习找到正确对应的问题，通常我们会进行 3 个维度的评估。首先是数据的准备是否妥当；其次是这个问题对于业务的影响程度，也就是问题解决的必要性；最后是评估机器学习在这个问题上的适用性，也可以说是评估当前的技术水平是否足以解决该问题。一个理想的情况是，选择的问题对业务影响很大，同样有足够的数据资源，并且最先进的机器学习算法也能适用，那么这个问题的解决就能对整体业务带来重大且有意义的推动。


    在采用机器学习的过程中，设定适合的组织架构同样重要。机构通常会聘请管理人员和技术专家组成一个核心团队，这种类型的团队虽然能做出一些成果，却与行业专家和机构中的其他人缺少联系，从而让看上去不错的机器学习模型并不能适配具体的业务问题。更为理想的状况是组建一个包括技术专家、行业专家和业务人员的综合团队，这样才更有可能在机器学习应用方面取得有意义的进展。


    雇用了最优秀的人才、选择了正确问题，甚至正确制定了数据策略后，许多机构会去建立“无差别的基础设施”，这需要支付很大的成本并且浪费了时间。我一直建议这些组织不要再做无差别的繁重工作，因为善用外部服务可以更有效地解决这个问题。比如使用如
    Sage Maker 之类的工具，可以更好地构建、训练、优化和部署机器学习模型并加快项目的进展。这就是 AWS 的使命所在：为每位开发人员、数据科学家和研究人员提供工具。


    # 工业与智能融合：推动高质量发展


    ## 作者简介：柯睿安、李强


    柯睿安（Christian Klein）


    SAP 执行董事会成员、全球首席执行官


    ![](img/txt029_1.jpg "pagenumber_ebook=223,pagenumber_book=207")


    SAP 全球首席执行官。作为 SAP 智慧企业部门的领导者，负责全球 SAP 核心应用的开发和交付，同时负责 SAP 全球业务运营的工作。在其领导下，智慧企业部门负责推动
    SAP 数字化核心开发功能和产品管理，包括 SAP 的旗舰产品 SAP S/4HANA（下一代 ERP）和 SAP Digital Supply Chain，并管理
    SAP 丰富的行业特定产品组合。1999 年，在校期间就已经在 SAP 开启了职业生涯。先后在 SAP 全球支持集团、服务运营部门和全球管控部门担任多个职位。2011—2012
    年担任 SAP SuccessFactors 首席财务官。2014 年被任命为 SAP 首席风险控制官，并于 2016 年 4 月 1 日接任 SAP 首席运营官。


    李强


    SAP 全球高级副总裁、SAP 中国总裁


    ![](img/txt029_2.jpg "pagenumber_ebook=224,pagenumber_book=208")


    SAP 全球高级副总裁、SAP 中国总裁，全面负责中国市场的业务和运营。一直积极推动德国“工业 4.0”在中国市场的落地，促成了中德第一个“工业 4.0”合作项目，并于
    2015 年在中德两国政府总理的见证下签署了合作协议。现任中国工业互联网产业联盟副理事长。2018 年，当选为第十三届上海市政协委员，并被评为“中国 ICT
    产业十大影响力人物”。2019 年，受聘担任陕西省人民政府国际高级经济顾问。荣获了中国跨国会颁发的“全球跨国公司领袖奖”、《经济观察报》评选的“2019 年度中国受尊敬企业家奖”，并荣登《人民网》新中国成立
    70 周年“奋斗中国人”特别节目。有着 20 余年 IT 从业经验，对商业软件、云计算以及创新的商业模式有着非常前瞻和深入的理解。


    ![](img/txt029_3.jpg "pagenumber_ebook=225,pagenumber_book=209")


    ## 对话：全球经济变革与智慧企业转型


    柯睿安：全球经济正经历着过去 75 年来最快速、最巨大的变革。纵观各个行业，因为疫情，即使是最有远见卓识的公司也表示遇到了供应链的问题，许多日常业务也遭受到影响，这场危机又一次证明了转型为智慧企业的必要性。

