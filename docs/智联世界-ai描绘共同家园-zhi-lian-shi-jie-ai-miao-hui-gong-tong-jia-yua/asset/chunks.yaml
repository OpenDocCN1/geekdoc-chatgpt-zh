- raw: "中国有最发达的消费互联网，消费互联网端也积累了很好的数据，基于此的人工智能应用发展也是领先的，并诞生了很多世界级的人工智能巨头，他们都是从C端成长起来的。而中国企业管理的技术在互联网之前的时代还没有充分发展起来。在欧美，该领域的进步从20世纪中叶开始，一直持续发展。因此对于人工智能，既要提供很好的技术，也要在产品中融入先进的企业管理思路，把先进的管理方法、好的思路和人工智能技术融会贯通，把其他国家已经积累了数十年的管理经验，通过产品一并提供给客户。对我们的科技企业而言，这是一个重大的机遇和挑战。\n\
    \n姚志强：人工智能未来一定要帮助每一个人提升能力，增强每个人的效率。在人工智能赋能后，每个人都将有更强的感官、更丰富的知识和经验，从而提升个人的能力和效率，并在此过程中实现资源分配的公平。这是我们希望看到的人机协同时代。\n\
    \n中美技术竞争背景下的人工智能发展\n\n夏华夏：中美之间的脱钩或脱钩的过程，对中国而言是短痛，也是长期的利好。这会逼着我们集中力量来补上短板，包括芯片以及很多其他基础元部件。\n\
    \n吴明辉：软件层面目前受到的影响还非常小，但我认为在算力层面影响会很大，包括将来边缘计算，同时我也看到了国内很多新兴的科技公司正在快速补上这个短板。人工智能的底层领域很多关乎材料，但更多地关乎数学，在数学领域中国还是有优势的。\n\
    \n从软件开发角度来看，不管是消费互联网还是产业互联网公司，很多都受益于开源，而开源本身不容易受国际政治影响。国际上许多优秀的工程师和科学家都在共创产品，这个领域仍然有非常好的无边界、协作共赢的文化，所以我觉得人工智能本身在未来没有那么多隔阂，协作依旧是主流。\n\
    \n陈海波：目前形势是严峻的，但阳光总在风雨后。中国有自己的创新能力，我们自力更生的精神会被激发起来，大部分企业也都有自己的预案。比如我们2018年就建立了芯片研究院，做自己的FPGA芯片的研发，用于工业智能化，我们对前景还是充满信心的。\n\
    \n周剑：从短期看，在芯片领域我们有一些担忧，但从长远来看，我相信会走出自己的道路。优必选科技从硬件起家，2008年开始研发伺服舵机。当时我们在中国遍地寻找小型的伺服舵机，结果没找到，最后找了三家供应商，分别来自日本、韩国和瑞士，价格都贵得离谱，一个很小的数字电机要卖到将近100美元。一个人形机器人如果全身有二三十个关节，成本就很高了，一个小机器人可能要卖几万块钱。所以我们从2008年就开始研发伺服舵机，一直到现在，可以很自豪地讲，全球伺服舵机，尤其是几十千克以下的小型伺服舵机，我们的量产能力非常领先。当初我们到处买不到伺服舵机，即使能买到也很贵；现在我们的伺服舵机，无论PID算法，还是减速器、电机等都是自己做的。经过十多年坚持不懈的努力，至少在这个领域我们实现了突破。在每个细分领域十年如一日地磨剑，我相信芯片迟早能够走出来，我们中国人不光勤劳还很聪明。\n\
    \n姚志强：中美竞争的本质还是效率竞争。美国通过各种手段拖慢中国的发展速度，而我们应该在国家政策的支持下，加快研发速度和应用速度，特别是所有的人工智能企业应该抱团发展，让更多的应用场景加速落地，并借此拉动基础研究的工作。\n\
    \n郑庆生：即便是在当前的宏观情况下，风险投资的资金仍然在全球自由地流动，中国和美国一样仍是全世界创业最繁荣的热土。过去两年，中国包括人工智能在内的硬科技领域的投资非常踊跃。\n\
    \n供给端的国产替代的潜力也很巨大，因此我们担忧不利宏观形势的同时，也应该认识到有危也有机。中国的创业者非常多，在那些原来看上去不容易生长新的企业的领域，因为有了宏观的新机遇和发展出了新技术，现在也有大量创业企业出现，这样一定能造就很多非常了不起的企业。\n\
    \n对于5年后的期望\n\n郑庆生：希望5年后，在新基建、各级政府和所有创业企业和创投机构的推动下，中国在产业互联网（包括人工智能）领域能够发展到今天消费互联网那样的世界地位，中国将不仅是数字大国，还是一个智能大国。\n\
    \n姚志强：我希望5年后各行业中都能够实现资源更好的泛化，不仅专家，而且普通从业者都能做成很多非常有价值的事情，帮助各行业实现效率最大化。\n\n周剑：目前的人工智能和智能机器人还处于较为初级的阶段，离通用智能阶段还有相当长的距离。正因为行业还没成熟，所以更需要政府提供技术环境和场景，让人工智能和智能机器人更好地落地应用。我希望5年之后，在上海或其他地方能够看到我们打造的智慧养老中心，用100张床位把模式跑出来，之后向全球所有面临人口老龄化问题的地区推广。我相信我们可以做到。\n\
    \n陈海波：人工智能服务民生。希望5年以后上海能够在世界范围内成为人工智能基础研究和应用都非常出色的城市，被打造成著名的人工智能世界级高地。\n\n吴明辉：我相信5年后会看到人工智能在越来越多的场景中实现从感知到认知甚至行动系统，能有更多的基于人工智能分析决策的复杂应用实现，并超越人的能力。\n\
    \n![](images/txt022_8.jpg \"pagenumber_ebook=192,pagenumber_book=176\")\n\n夏华夏：从5年时间的维度来看，技术上人工智能会受益于几个方面的影响，包括“AI+5G”“AI+物联网”“AI+机器人”，这几个领域与人工智能结合会极大改变生活中的很多场景。我希望5年后无人机和无人车可以在很多城市，不仅是一线城市，为大家提供更快、更便捷的配送服务。\n\
    \n\uFEFF\n\n特别主题：抗疫\n\n\uFEFF\n\n有关传染性风险预测的机器学习技术在智能手机上的应用\n\n约书亚·本希奥（Yoshua Bengio）\n\
    \n图灵奖获得者，蒙特利尔大学教授、魁北克人工智能研究所科学主任\n\n![](images/txt024_1.jpg \"pagenumber_ebook=194,pagenumber_book=178\"\
    )\n\n作为蒙特利尔大学教授，凭借着在深度学习技术的突出贡献而获得图灵奖，这是计算机科学领域的最高荣誉。正是深度学习技术掀起了人工智能的复兴浪潮，也一步步推动了无人驾驶汽车、即时语音翻译以及人脸识别成为可能。\n\
    \n![](images/txt024_2.jpg \"pagenumber_ebook=195,pagenumber_book=179\")\n\n新冠病毒感染的一个重要事实是，传染途径主要为近距离接触感染。另外一个重要事实是，在新冠肺炎症状出现之前和之后不久，感染者就已经具备传染性了。个人是否有可能感染新冠病毒，可以从他是否接触过病毒检测呈阳性的人来进行估计。\n\
    \n数字接触追踪（digital contact tracing）是指通过手机发送和新冠肺炎相关的信息，比如接触者的阳性检测报告。与数字接触追踪相比，人工接触追踪（manual\
    \ contact tracing）的局限性在于需要消耗大量的时间。\n\n目前数字接触追踪的标准方法是只传递一个人的病毒检测结果是否呈阳性的二元信息。但是，新冠病毒的感染期早在阳性检测结果出来的数天之前就已经开始了，标准的数字接触追踪存在一定的延误期。如果我们能够缩短延误期，那么就能够有效减少病毒的传播。\n\
    \n事实上，判断个人感染的风险等级不仅是阳性/非阳性这样简单的二元问题。新冠肺炎存在多种症状，不同症状的严重程度也不同。此外，之前的健康状况、年龄、性别、接触人群的风险等级，以及接触发生时间等也会对疫情的进程产生影响。因此，需要将这些信息整合起来，进行更加完整的分析和判断。\n\
    \n分析大量信息并进行判断不是一件容易的事，最好的解决方案是用机器学习方法，分析大量碎片信息，从而确定个体是不是已经被感染了，或者处于感染的哪个阶段。如果能做到这一点的话，那些感染风险等级高的人需要居家隔离，并向之前接触的人发送风险信息；而那些风险不是特别高的人需要谨慎一些，但不用接受强制隔离。\n\
    \n![](images/txt024_3.jpg \"pagenumber_ebook=196,pagenumber_book=180\")\n\n基于机器学习的数字接触追踪App能够扩大跟踪和警示的范围。但需要注意的是，数字接触追踪并不是完全取代人工接触跟踪，其原因是人工接触跟踪可以发现手机无法捕捉的人际关系，因此两种追踪方式是相互补充的关系。\n\
    \n数字接触追踪工具中积累的信息对公共卫生管理来说也是很有价值的。举例来说，公共卫生管理部门可以根据数字接触追踪的分析结果来安排核酸检测的优先顺序，风险更高的人或者有接触史的人需要优先测试。此外，数字接触追踪还可以提供很多重要的信息，比如根据某些地区疫情风险的变化情况，在大量人群涌向医院进行病毒测试之前，提前预测是否可能出现疫情的大暴发。\n\
    \n如果我们已经知道人际接触的全局网络图，那么就可以通过机器学习的方法，通过迭代获取网络中每个个体的感染风险。但问题是，我们并不了解人际接触的全局网络图，另外一个需要考虑问题是这种迭代在算力、带宽方面的成本可能会比较高。\n\
    \n如果机器学习的预测器足够简单的话，另一种做法就是使用联邦学习（federated learning），即不需要拥有一个中央的训练服务器，而是每个人在手机上进行训练。但这种方法的一个问题是，每部手机上都要进行多次迭代计算，另外中央服务器和手机客户端之间也需要进行大量的参数通信交换。\n\
    \n我们的实验是采用混合方法—既进行手机之间的数据传输以计算风险，同时手机和服务器之间也进行数据和信息的交互，从而能够更好地训练风险预测器。手机之间传递的信息只是关于个人感染风险的信息更新，每个人每天能够收发4次信息。此外，那些同意分享数据的用户可以向服务器发送自己的数据。利用去识别化的方法，发送方的手机号码和姓名这些信息被脱敏，服务器只获取用户的症状、感受，以及这个人的病毒测试结果。\n\
    \n在我们的实验中，风险预测器会接收以下的信息输入：自身现有的疾病，年龄、性别、行为有关的信息（例如在户外或者封闭空间里面或者在工作场所有没有戴口罩，工作的地方有没有玻璃隔挡，有没有坐过公共交通工具，家里住多少人），病毒检测报告的结果，在过去的14天里的症状，以及和多少人接触过，接触多久，相隔多长距离。\n\
    \n![](images/txt024_4.jpg \"pagenumber_ebook=198,pagenumber_book=182\")\n\n根据个人的情况，风险预测器接收到的数据长度是不同的，即数据输入长度是可变的。这就意味着很多标准的机器学习算法，比如EM算法，无法处理这些数据了。在我们的实验中，我们采用变换器来解决这个问题。\n\
    \n现在还有一个重要的问题是，预测的目标是什么，或者说在实际应用中一个人应该向另外一个人发送什么样的信息？比如说艾丽斯在5天之前碰到鲍勃，随后艾丽斯现在发现被感染了，应该给鲍勃发什么信息呢？最有用的、最相关的信息就是评估艾丽斯在5天前接触鲍勃的时候的传染力有多少。因此预测的目标就是感染者在过去14天里面的每一天的传染力有多强。\n\
    \n我们并不知道传染力的真实数值是多少，只能使用测试结果作为代理信息。但即使是测试结果，也存在假阳性、假阴性的错误。幸运的是，在机器学习中间有一些基于潜在变量的方法用于处理这个问题。\n\
    \n在实验中，我们建立了一个生成模型去捕捉个体层面的信息，包括人们如何移动，如何通过接触感染，他们的病情。我们根据已知的医疗信息调整模型，使模型与人口流动性以及医疗等已知数据保持一致。经过实验，我们发现和标准数字跟踪的方法（只传递阳性/非阳性检验结果）相比，使用人工智能的数字接触追踪模型可以大幅减少病例的数量。\n\
    \n![](images/txt024_5.jpg \"pagenumber_ebook=199,pagenumber_book=183\")\n\n通过使用基于机器学习的数字追踪技术，我们可以充分利用数字追踪和人工追踪两者的优势，并扩大人工追踪的范围。同时，我们可在不损害隐私或人权和尊严的前提下达到目标。\n\
    \n\uFEFF\n\nAI医疗正值关键时刻\n\n彼得·李（Peter Lee）\n\n微软全球资深副总裁，微软研究院负责人，美国计算机协会（ACM）会士，美国国家医学学会成员\n\
    \n![](images/txt025_1.jpg \"pagenumber_ebook=201,pagenumber_book=185\")\n\n微软全球资深副总裁，负责领导微软研究院以及技术孵化；全面负责微软全球八大研究院，以及赋能微软产品和业务部门的新技术孵化，其中包括当今快速发展的医疗和生命科学领域业务。拥有丰富的管理经验，涉及领域贯穿从基础研究到商业影响的整个过程。2010年加入微软前，曾担任美国国防部高级研究计划局（DARPA）的部门总监，领导先进的机器学习、众包和大数据分析等具有实用能力的技术研发。曾担任卡内基梅隆大学计算机科学系主任。艾伦人工智能研究机构和Kaiser\
    \ Permanente医学院的董事会成员。美国计算机协会会士（ACM Fellow），服务过多家国家级研究机构。曾在美国总统强化国家网络安全委员会任职。\n\
    \n今年突如其来的新冠疫情，让医疗与公共卫生领域成为全世界的焦点，对这一领域的各方面投入也大幅增加，除了生命科学与医学研究，人工智能、大数据等技术在疫情的追踪监测、精细管控、远程医疗等方面，也发挥了很大的作用。\n\
    \nAI与医疗的结合，一直是微软关注的焦点。如何充分利用人工智能等新兴技术去实现科技、人性与自然、社会的平衡发展，需要社会各界的共同努力。现阶段正是科技和医疗行业的关键时刻，未来将会迈向何方，将取决于今天的每一个选择。\n\
    \nAI医疗的无穷可能\n\n当医生抽取你的血液后，他就得到了大约100万个T细胞，它们是身体自然免疫系统的样本。每个T细胞的特异性，是由胞外受体（或称T细胞受体）的遗传学机制决定的，因此目前有很多研究正在试图大批量地解码这些基因所传递的信息。如果能够做到这一点，就可以映射出人体内的T细胞图谱，诊断出发生在人们身上的传染病、癌症、自身免疫性疾病等。这也将成为基于血液的通用型诊断方法的基础。\n\
    \n![](images/txt025_2.jpg \"pagenumber_ebook=202,pagenumber_book=186\")\n\nT细胞\n\
    \n目前，微软正在与西雅图的一家生物技术公司Adaptive Biotechnologies进行这方面的合作，其独有的免疫测序技术，可以快速读取血样中大约100万个T细胞，其中涵盖的大量信息，可以用来了解人体免疫系统正在应对的传染病、癌症或其他免疫疾病等。关键在于，能否解码这些信息？这也正是AI与机器学习发挥作用的地方。微软一直通过机器学习技术对这些输出内容进行处理，试图将T细胞基因受体语言转换为抗原语言，再利用机器学习进一步探查这些免疫引擎，寻找身体正在对抗哪些疾病。\n\
    \n![](images/txt025_3.jpg \"pagenumber_ebook=203,pagenumber_book=187\")\n\n构建人体适应性免疫系统\n\
    \n双方合作的终极梦想，是采用简易、通用的方法，基于血液检测出任意一种传染病，并且可以对任意癌症进行早期诊断，判断患者可能有哪些免疫性疾病。作为一名研究员，以及《星际迷航》这样的科幻剧的爱好者，这些研究让我想起了“三录仪”。现阶段确实是一个了不起的时代，医疗科学发展将带来无限可能性，今天的计算技术和计算能力，也让数据能够帮助人们拥有更好的健康状况。\n\
    \n新的理念正在引发无穷的可能，而AI等技术在精准医学中的应用，只是未来医疗的一小部分。\n\n除了面向未来的研究，AI对于当下诊疗过程的优化也很重要。医生过劳现象在很多国家都很常见，通常医生将更多关注放在计算机屏幕上而不是患者身上。医疗诊断记录如今都已经实现数字化，但问题是，数字化带来的重担完全落在了医生和护士身上。多项研究表明，目前临床医生要花费超过40%的工作时间在数据录入上，创建临床文档的负担，成为医生过劳的主要原因之一。甚至在许多国家，医生是自杀率最高的职业之一。\n\
    \n微软与合作伙伴Nuance携手开发了一款名为Dragon Ambient eXperience的产品，它能够观察并聆听医患之间的对话，然后自动构建绝大部分的诊疗记录。在早期的部署中，医生对它的满意度很高，患者对于聆听对话并帮助医生的机器也给予了良好的信任。\n\
    \n![](images/txt025_4.jpg \"pagenumber_ebook=204,pagenumber_book=188\")\n\n医院看诊\n\
    \n用AI对抗新型冠状病毒\n\n新冠肺炎疫情的暴发给世界各地的人们带来严重影响，如何应对疾病及其引发的社会问题和全球经济紧缩，给所有人都提出了挑战。好消息是全球各地的组织机构都已经动员起来，共同应对这场危机，合作、共享和协作的精神令人鼓舞，这是历史上前所未有的。在微软，大家也致力于与各方合作伙伴携手，共同应对新冠疫情。\n\
    \n首先，微软与医疗机构深度合作，帮助他们面对数量激增的就诊患者，重整运作流程，提供足够的传染防控能力。\n\n在西雅图，Providence医疗系统接诊了美国本土的第一位新冠肺炎患者，因此他们很早就不得不去应对许多棘手的问题。微软与他们合作的项目之一，是利用AI聊天机器人技术Microsoft\
    \ Health Bot，开发了一台名为Grace的机器人，它可以与居家患者进行互动，然后智能地为他们提供建议，让他们继续在家中休息，或者将患者移交给医生或护士，进行实时的健康咨询，以进一步核实情况。\n\
    \n接着，微软还与疾病控制中心（CDC）合作，在CDC官方网站上面向全美用户推出了这一机器人服务。此后，全球有1 900多个网站部署了这种医疗机器人。迄今为止，已有3\
    \ 900万人使用机器人对自己的症状进行评估。使用了该医疗机器人服务的多数医疗机构表示，其急诊部、呼叫中心和远程医疗服务有关新冠肺炎的就诊或问询数量降低了至少30%。\n\
    \n![](images/txt025_5.jpg \"pagenumber_ebook=206,pagenumber_book=190\")\n\nMicrosoft\
    \ Healthcare Bot\n\n与此同时，医疗机构在疫情初期最大的挑战在于接诊能力及其利用率，医院里需要有充足的床位和重症监护室、呼吸机和个人防护装备。但医院里多个系统如何一起协作、整体调配，并更好地按需优化处理能力？\n\
    \n在Power Platform上，微软迅速部署了医院应急响应平台，它可以让医院轻松跟踪新冠肺炎患者接诊能力和利用率，并在整个卫生系统中共享。这个平台还可以自动向政府报告相关信息，用于公共卫生报告汇总，然后利用Azure\
    \ AI数据分析来预测未来需求。现在美国和世界各地的数百家医院正在使用这个易于部署的解决方案。\n\n其次，远程医疗也是很好的辅助方式，微软Teams正成为医患对话的AI助手。\n\
    \n微软致力于简化新的远程医疗服务的创建过程，同时满足医疗机构及患者对于隐私性、安全性和合规性的所有要求。\n\n![](images/txt025_6.jpg\
    \ \"pagenumber_ebook=207,pagenumber_book=191\")\n\n医院应急响应平台\n\n如今，用于医疗用途的微软Teams会议系统每天处理着数百万次的远程医疗访问，任何医院或诊所都可以轻松地使用Teams，创建新的电话问诊服务。同时，越来越多的AI技术被集成到Teams中，用于自动转录、智能搜索、图像处理、语音交互等等，微软Teams正成为医患对话的AI助手。\n\
    \n再次，AI技术不仅可以用于提供医疗服务，推进医学研究和疾病治疗也是AI的沃土。"
