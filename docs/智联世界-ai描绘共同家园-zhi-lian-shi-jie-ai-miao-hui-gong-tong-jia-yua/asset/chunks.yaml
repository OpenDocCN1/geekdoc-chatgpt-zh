    # 人工智能研究路线图—架起学习与推理的桥梁


    ## 巴特·塞尔曼（Bart Selman）


    康奈尔大学计算机科学教授、`AAAI`主席


    ![](images/txt012_1.jpg "pagenumber_ebook=84,pagenumber_book=68")


    康奈尔大学计算机科学教授，获得了美国国家科学基金会`CAREER Award`和阿尔弗雷德·P .斯隆研究奖，是人工智能促进协会（`AAAI`）主席和美国科学发展协会（`AAAS`）会士。研究领域是计算机和人工智能，以及机器和计算机在社会中不断增加和变化的作用，特别是计算和表示方面的问题。对于易处理的推理、知识表示、随机搜索方法、理论逼近论、知识汇编、默认推理以及计算机科学与统计物理学（相变现象）之间的联系等领域有深度研究。在“人类兼容AI中心（`CHAI`）”的研究重点是高级AI的潜在风险和负面影响。作为一位AI安全专家，研究计算机领域的发展如何从道德中立的软件转变为预测算法，并倡导将伦理道德与AI相融合。《美国人工智能研究的20年路线图》主编之一，合著共计出版100多种，其中获得六项最佳论文奖。


    ## 当前AI时代的机遇与挑战


    身为研究人员，我们生活在一个令人振奋的人工智能时代。我们看到各种智能自主系统或半智能自主系统不断地在社会上兴起。从自动驾驶汽车，到自主无人机，再到虚拟助手和辅助机器人等等，不一而足。这对于学术界来说是一个重大的变化，学术界花了大约60年时间，才完成人工智能研究从理论研究到现实世界的转变。至少我个人人为，这得益于深度学习和大数据的推动。


    当前，我们终于实现了机器感知，系统开始能够“看见”和“听见”。眼前这些成果，是我们经过50多年的研究才得到的。人工智能的很多技术，比如推理、搜索、强化学习、决策理论方法、规划等，都是在假设感知输入“以某种方式”提供给系统的前提下开发的。但是，机器人不可能真正看见或听见任何东西。


    2005年，首届自动驾驶汽车大赛得主、斯坦福大学的`Stanley`，不过是一辆开着瞎转的汽车。它既没有搭载常规摄像头，也没有搭载轻便些的激光测距摄像头，这只是因为在当时还无法分析汽车周围的图像。现在情况就完全不同了，自动驾驶汽车已经能使用计算机区域系统，我们可以把这些感知系统的输出，用于已经开发出的其他一系列实际技术上。事实上，许多技术，如人脸识别和交通标志识别技术，现在已经超出人类自身的能力水平，所以我们可以充分利用这些技术。


    ### 深度学习与硬件假设


    那么，是哪些因素让我们取得这些进步的呢？我认为最根本的是深度学习，深度神经网络的成功有力支持了“硬件假设”。算法的发展实际上可以追溯到20世纪80年代的反向传播算法，这是第一种用于训练神经系统的方法，有一个隐藏层，我们现在当然知道它是由数百个隐藏层组成的网络。这个进步纯属意料之外，截止到2000年，几乎所有的人工智能研究人员都不再研究神经网络，直到2011年、2012年，情况才彻底改观。突然间，这些方法取代了所有其他机器学习方法。要做到这一点，需要重大的算法进步。


    ### 大数据与计算能力的增长


    此后的另一项进步是大数据。这里有一张完整的层次图，这个图表里垂直方向代表的是处理速度。在这张图的中间部分，我们能够看到超级计算机`深蓝`（1997年击败国际象棋世界冠军的IBM超级计算机），它的计算能力大致相当于老鼠大脑的处理能力。与人类大脑相比，长期以来计算机处理能力都是非常有限的。然而，我们生活在一个振奋人心的时代，据粗略估计，到2030年前后，1000美元能买到的计算资源将与人脑计算和存储的能力相当。当然，这不是通用人工智能，却能助力通用人工智能的实现。还有其他几个方面的进展：如众包人类数据，可以通过十万多幅有标注道路数据的图片训练自动驾驶汽车的视觉系统；如工程团队，例如IBM的超级计算机`Watson`，它在《危险边缘》智力竞赛中一敌五十。对人工智能系统研发方面的投资正以数十亿量级扩大，这样巨大的商业利益是我们前所未见的。


    ![](images/txt012_2.jpg "pagenumber_ebook=86,pagenumber_book=70")


    ## AI研究的三大阵营


    整个人工智能领域的进展，大致可以分为三个不同的阵营：数据密集型—深度学习方法是目前人工智能研究人员最熟悉的、推理密集型和知识密集型。我们来看看小猫图像，深度学习系统要识别它，需要通过成千上万的图像训练，它们是迥然不同的信息，是知识。这确实是一个抽象层面的内容，例如牛顿定律`F=ma`就是知识的一个很好的范例，它是个体在学校习得的。有时知识是从数据中获得的，而不是从以前的直接经验中获得的。这是一个科学发现的过程，可以引导个体去主动获得知识。这是人工智能系统面临的一个障碍。数据密集型方法的实践例子，包括`谷歌翻译`、`谷歌搜索`、IBM，大量成功事例让我们开始看到人工智能的作用。在推理密集型领域，借助机器学习方法，一些悬而未决的数学猜想能够得以解决。此外，成百上千的验证方法也可以建立在推理密集型研究方法的基础之上，`AlphaGo`就是个有趣的例子。它结合了推理研究和数据密集型的强化学习，是学习和推理的结合。


    ![](images/txt012_3.jpg "pagenumber_ebook=87,pagenumber_book=71")


    ## 未来：集成与常识推理


    那么，未来会怎样呢？如果单纯专注于某项研究领域，那未来的情况一定会越来越糟。在很多不同的常识领域的科学研究都是依靠知识密集型方法展开的，人们对计算机视觉和自然语言理解的研究则更多地依赖于数据密集型研究方法，但是要想了解真实的自然语言理解，就应该将知识密集型和数据密集型研究方法相结合。那么接下来要怎么办呢？正如我强调的那样，感知、学习、推理和决策等技术的进一步集成将彻底改变人工智能系统。`AlphaGo`就是一个很好的例子。我们最近在化学科学和合成化学中也有一些发现，这些发现是由知识密集型和数据密集型方法结合所得到的。


    现在，我们也应该关注我们还无法做到的以及人工智能系统的薄弱方面，这就是我们所说的常识性推理和常识性知识。简单举一个小例子。在英语中，有些句子有不明确的指称，我们来看看这个句子中的“它”：“这个大球撞破了桌子，因为它是由泡沫塑料制成的。”“它”到底指的是什么呢？“它”必然是指桌子，因为球砸穿了它，而泡沫塑料是种轻质材料。但如果稍微改一下这个句子：“这个大球撞破了桌子，因为它是由钢制成的。”“它”指代的对象就变成了球，而这种指称的微妙变化却很难被人工智能系统捕捉到。尽管我们在取得进步，但最终还需要对语言有更深层次的理解。如果用`谷歌翻译`将这个句子翻译成法语，你会发现`谷歌翻译`也不清楚“它”指代的是什么，这多少有些令人惊讶。这揭示出，在翻译时，`谷歌翻译`实际上并没有真正理解文本。换言之，你可以把你的名字翻译成中文，却不必理解它在任何一种语言中的实际含义。这实在让人惊讶，就算人工智能研究人员也着实愕然。显然，`谷歌翻译`拥有足够大的语言数据库，例句翻译的数据量很庞大。然而至少在目前，这对系统对语言更深层含义的理解并没有什么帮助和实际意义。


    ### 人工非人类智能


    我还想指出，在谈到人工智能时，我们能想到另一个令人兴奋的领域—人工非人类智能。我们看到，这主要涉及推理和计划。在深度学习方面，我们已取得了巨大进步，但有些不太为人所知，如果你看看软件验证、程序综合、科学自动化和数学发现等领域，就会发现令人兴奋的进展。现在，这些进步的取得并没有试图模拟人类智能。实际上，我认为这可能是一个聪明的想法，我们不一定要模仿人类的智能能力。我们可以接受一些特定的任务，然后努力把它做得更好。下面我来举个小例子：埃尔德什差异猜想。这个猜想提出80多年了，我们仅以差异2为例，这个猜想用推理程序进行了求解并包含十多亿个推理步骤，并且可以很容易用独立的证明检查程序进行验证。我们从中看到的是，人类数学与机器发现的数学相结合将能够增强人类数学，我认为这将是未来10～20年中取得进展的一个主要领域。


    另一个例子展示了材料发现过程中的人工智能。这项工作在美国康奈尔大学进行，研究小组中包括戈麦斯（Gomez）教授等人。它是一个人工智能用于材料发现的实验，这个实验在康奈尔大学的X射线同步加速器上运行。在人工智能系统的指导下，研究小组在全自动设置中发现了新材料。于是，我们看问题就有了一个不同的视角，这是一种理论计算机科学的有趣方法，利用它，我们可以大致正确地完成人类能完成的任务，最多几兆字节就能完成，这属于较低的计算层次。我相信机器将从较高的计算层次开始。


    有个很有趣的问题，我们能在多大程度上理解机器或机器的发现成果？我对此持乐观态度，因为理解相对更容易，这些发现需要理解牛顿定律，而不是需要发现牛顿定律，我想机器会帮助我们寻找新发现，人类也将能理解它们。


    ## 美国20年人工智能研究路线图


    最后，我谈谈美国20年人工智能研究路线图。这是由南加州大学的约兰达·吉尔（Yolanda Gil）和我一道负责的一项研究。我们得到了来自美国100项人工智能研究的意见，我们发现了人工智能发展历程背后的一系列驱动因素，我们认为，它们也是未来5～10年乃至20年社会发展的核心驱动因素。它们分别是提高健康和生活质量、终身教育和培训、业务创新和竞争力、加快科学发现和技术创新、社会正义和政策、网络防御和安全。


    我们研究团队发现了3个重点：


    ### 第一，集成智能


    我们称之为集成智能—我们如何将学习、推理、规划能力整合到一个完整系统中？我们的大脑能够结合各种信息，结合各种形式的信息处理，那么如何整合人工智能的各个组成部分？这些将是未来10～20年的一个关键领域。


    ### 第二，有意义的互动


    有意义的互动—我们如何将机器人融入我们的社会？如何让智能系统进入我们的社会？我们怎样才能信任它们？我们怎样让它们负责？我们如何与它们互动才是有意义的互动？


    ### 第三，自我感知学习


    自我感知学习—我们如何建立能够反映出自我学习能力的系统，并根据学习机制的需求长期引导它们进行自我学习？


    接下来，我们回过头来问，人工智能的这种转变是什么？这为国家带来什么机遇？它们都是人工智能领域的巨大机会。其中包括，综合智能科学方面的人类基因组医学项目和哈勃望远镜计划，它们都需要大量基础投资和基础研究，并将推动发现人工智能研究的新领域。但是，这些工作是小型研究团队无法完成的，因此需要国家建设国家层面的人工智能基础设施。也许最好的一个例子应该是人工智能即用型医院：一家大医院集中全国各地的人工智能领域研究人员，以便能够使用医院设施，提供以人工智能驱动的医疗服务和实证研究，以协作方式协调对人工智能技术所开发出的技术的评估。这些任务驱动型人工智能中心将集中三四十人组成的研究团队，他们来自全国各地，依托各种软硬件支持，从事雄心勃勃的研究项目。同样，任务驱动型人工智能中心还可以设有生活辅助设施，人工智能研究人员汇集于此，试验新技术和新的人工智能创新。目前在美国，这样的人工智能中心正得到资助，今年会有第一批6个大型中心。美国国家科学基金会（`NSF`）已开始人工智能研究工作，他们开始资助这些格外引人注目的研究中心，接下来几个月内他们将宣布第一批资助花落谁家，它们都将成为国家人工智能基础设施的组成部分。

    '
