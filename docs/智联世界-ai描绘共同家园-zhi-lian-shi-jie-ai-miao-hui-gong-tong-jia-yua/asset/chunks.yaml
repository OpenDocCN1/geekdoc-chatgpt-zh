    # Intelligent Enterprise: Digital Transformation and AI Application


    Many business and public sector decision-makers I have recently spoken with are
    beginning to realize that digitalization is no longer an option, but a necessity.
    Companies that were already using innovative technologies to drive business model
    innovation and automation were not only more resilient before the crisis, but
    also during this pandemic. Intelligent enterprises can leverage the latest technologies
    to turn insights into actions in real time; they achieve data-driven innovation
    and process automation faster, realize new business models and deliver exceptional
    experiences, and respond more quickly to a constantly changing world.


    ![](img/txt029_4.jpg "pagenumber_ebook=226,pagenumber_book=210")


    ## Intelligent Enterprise Applications


    The focus of the intelligent enterprise''s embrace of these innovations is artificial
    intelligence technology. AI not only helps companies improve existing products,
    but more importantly, helps them create new ones.


    From `SAP`''s perspective, the more important applications of AI lie in intelligent
    analytics, planning and scheduling, and monitoring enterprise processes and production
    operations on demand. In the manufacturing process, when the supply chain from
    procurement to manufacturing to delivery and service can be digitized, companies
    can solve inventory issues. For another example, by combining data from digitalized
    processes with financial planning models based on real-time market and sales data,
    companies can act in the market faster and better than any competitor.


    The key factor in all of this is data. Only with the correct underlying data and
    semantics can enterprises improve the overall intelligence and performance of
    their operational activities. Although there are some pre-trained AI service tools,
    they only reveal their true value when applications are built on the enterprise''s
    own data.


    Applying AI to chatbots and internal enterprise search can significantly improve
    employee and customer experiences, but the most valuable application for enterprises
    is still in improving operational efficiency. For example, based on historical
    and external data, AI can automate enterprise cash collection processes; through
    standardized data models and semantic analysis, we can achieve scalable data analysis
    across the entire enterprise.


    Judging from various company cases, AI can not only improve revenue and increase
    profits, but also forecast the next few quarters and provide decision-making insights
    that drive future business development. In addition, AI can help enterprises overcome
    potential economic shocks by providing diversified recommendations.


    ### Kaiserwetter Case


    `Kaiserwetter` is an energy asset management company that recently began offering
    services in China. It has a flagship product named `Aristoteles`. `Aristoteles`
    tracks global meteorological data through intelligent data analysis and machine
    learning algorithms to intelligently predict electricity consumption trends, achieve
    green power generation, and realize transparency in energy operational financial
    indicators. `Kaiserwetter`''s AI application is an excellent case demonstrating
    that corporate profitability and sustainable development can go hand in hand,
    a best practice stemming from the powerful force of data and technology.


    ### REHAU Case


    Another AI application case is the `REHAU` Group. This company has always needed
    to invest massive human resources to handle their business processes, which lowered
    efficiency and made errors difficult to avoid. Now, `REHAU` China relies on the
    process automation capabilities of intelligent robots to automatically process
    thousands of financial accounting vouchers every day; work that previously took
    4 days can now be completed in just 10 minutes.


    ### China''s AI Strategy and Li Qiang''s View


    China has the most ambitious AI strategy among all nations and has provided the
    most resources for its implementation. One of `SAP`''s major R&D labs is located
    in Shanghai; `SAP` is rooted in Shanghai, serving all of China.


    ![](img/txt029_5.jpg "pagenumber_ebook=228,pagenumber_book=212")


    **Li Qiang**: Looking back at the past four global downturns, each time there
    were leading enterprises that stood out by leveraging advanced technologies and
    drove global economic recovery. We firmly believe that enterprise-side digitalization
    will also become an engine for economic recovery this time, and "Artificial Intelligence"
    is the golden key to enterprise digitalization.


    Today, we stand at a turning point where AI drives global economic growth. According
    to relevant analysis, by 2030, global economic growth driven by AI will reach
    up to $15.7 trillion, of which China will account for $7 trillion. The growth
    drivers mainly come from increased enterprise productivity, increased consumption
    of products and services, and improved labor force levels.


    China is already the world''s second-largest AI nation; whether in terms of technical
    level, talent pool, investment and financing volume, or number of patents, China
    is in a leading position. However, if we analyze carefully, China''s AI development
    still has imbalances. Over 50% of AI application scenarios come from the Internet,
    finance, security, and transportation sectors, followed by consumer-related fields
    such as consumer electronics, education, and healthcare. In stark contrast, the
    manufacturing industry, which accounts for half of China''s economy, only accounts
    for 5% of AI applications. In other words, there is still huge room for improvement
    in AI''s empowerment of "Made in China" and the Chinese real economy.


    ![](img/txt029_6.jpg "pagenumber_ebook=229,pagenumber_book=213")


    ## AI Empowering China''s Real Economy


    The theme of the 2019 Hannover Messe in Germany was "Integration of Industry and
    Artificial Intelligence". Over 500 AI manufacturing application scenarios were
    released at this fair, covering the entire business process and value chain of
    enterprises—design, R&D, manufacturing, delivery, and service—painting a panoramic
    map of AI building intelligent enterprises. It is predicted that by 2025, 60%
    of enterprise business processes will be replaced by AI; we firmly believe that
    the integration of industry and AI will become the main track for AI application.


    Whether it is `SEW`''s fully automated component smart factory, `Audi`''s latest
    smart factory for electric vehicles, or `KUKA`''s matrix production completed
    by fully automated independent machining, AI applications cover every industrial
    field. AI applications can help enterprises cope with challenges such as increasingly
    rich personalized customer demands, significantly increased product configurations,
    and significantly shortened product life cycles, playing a role in improving production
    efficiency, reducing inventory, and on-time delivery, thereby significantly improving
    economic benefits.


    Shanghai is China''s economic center, with very strong advantages in talent, technology,
    capital, and advanced manufacturing. We have reason to believe that Shanghai can
    contribute a model for the integration of AI and manufacturing for Chinese and
    global manufacturing. As Europe''s largest technology company and Germany''s largest
    company by market capitalization, `SAP` has been in the Chinese market for 25
    years, and is the only large multinational technology group to place its dual
    headquarters (Regional R&D Headquarters and Business Headquarters) in Shanghai.
    We will further increase investment in Shanghai, continue to take root in Shanghai,
    and serve China.


