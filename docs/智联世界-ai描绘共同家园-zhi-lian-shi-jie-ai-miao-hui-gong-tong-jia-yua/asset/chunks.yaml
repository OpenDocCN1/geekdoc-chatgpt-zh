    ## 六、各层次活动链接“全球智脑”，促进交流融通


    面向顶级专家，召开战略咨询专家会议，共商人工智能全球开放合作、基础能力建设重大议题。面向企业家，策划“AI夜话”，政企同台聚焦AI新基建等深入对话。面向投资人，搭建“上海AI会客厅”，设置线上“投资俱乐部”，100余个国际创新项目线上路演。面向国际人才，打造云端招聘平台，全球知名科技企业发布550个工作岗位。面向广大开发者，全新升级开发者日活动，设置开发者Demo
    Day等活动。面向90后、00后等年轻受众，推出全球首支人工智能作曲、4大虚拟偶像合唱演绎的MV《智联家园》，赢得广泛好评。


    世界人工智能大会已成功举办3届。3届大会以来，上海AI“朋友圈”不断扩大，20余个创新平台揭牌启动，近百个项目签约落户，高端人才不断集聚，已初步建成人工智能发展高地。面向未来，上海将坚决贯彻党中央、国务院战略部署，认真总结大会举办经验，继续强化大会的“链接平台”作用，全力打造人工智能“4大平台”，为我国新一代人工智能健康发展做出更大贡献。


