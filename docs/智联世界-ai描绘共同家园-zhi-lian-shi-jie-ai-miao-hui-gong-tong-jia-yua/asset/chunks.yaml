- raw: "如前文所述，微软与Adaptive Biotechnologies公司携手，对新型冠状病毒进行深入的T细胞分析，并将所有数据公开发布在Immune\
    \ Code数据库中，以期促进基于T细胞的新诊断方法、新药物疗法和新疫苗的研发工作。\n\n微软一直在无偿提供云端的GPU计算能力，以及研究人员的专业知识，帮助如Immunity\
    \ Bio这样的公司加快疫苗研发工作。值得一提的是，Immunity Bio使用的计算能力是2002年第一次SARS暴发期间全球最大的超级计算机的计算能力250倍以上。如今的云计算能力着实惊人。\n\
    \n最后，微软还将AI医疗技术用于其他用途，例如血浆捐赠、临床试验、文档阅读等。\n\n在疫苗研制成功之前，最有希望的治疗方法之一是使用康复患者的血浆，可以是直接用康复患者的血浆进行输血治疗，或是生产多克隆超免疫球蛋白类药物。为了确保疗法可靠，需要让更多新冠肺炎的康复患者知道如何捐赠血浆。为此，微软使用了Health\
    \ Bot的一个版本—Plasma Bot，帮助人们确定是否有资格捐赠康复期血浆，并且了解在哪里以及如何进行捐赠。\n\n同样，微软一直在测试部署另一种Health\
    \ Bot，用来帮助患者和医生找到可能对他们有帮助的最佳临床试验方案以及需要患者参与的试验。这种Clinical Trials Bot使用了最先进的文档机器阅读技术，可以自动阅读\
    \ clinicaltrials.gov网站上对各项临床试验进行解释的文档，为Health Bot构建了智能对话的能力。\n\n此外，在帮助医学研究人员更快地取得研究进展方面，AI也可以有所帮助。每天仅仅发布在PubMed上的论文和摘要就有4000多篇，远远超出任何人或团队的消化吸收能力。借助AI机器阅读技术，微软开发了Hanover技术，它能够阅读所有论文，并制作全面的知识图谱。这种知识图谱可用于协助决策制定，例如它曾帮助缅因州的杰克逊实验室等癌症中心进行癌症治疗的决策。随着新型冠状病毒研究和临床试验的爆炸式增长，专门针对新冠肺炎相关研究的Hanover最新版，将有着巨大的应用潜力。\n\
    \n医疗数据的进步，过去4个月超过以往4年。\n\n我们观察AI在医疗和应对新型冠状病毒的过程中所发挥的作用时，可以看到数据的惊人重要性。确实，数据在医疗和新冠肺炎疫情应对上，起到了至关重要的作用。当下正是科技和医疗行业的关键时刻，如何管理共享医疗数据，正处于转变的十字路口。这其中涉及政策、技术标准、互操作性、隐私性、安全性等许多问题。\n\
    \n尽管大家都知道数据在AI解决方案中至关重要的作用，但也遇到了诸多挑战。任何想在医疗行业尝试使用机器学习或人工智能的技术研究者，都会在数据获取上遭遇困难。不少医疗技术初创公司能够提供非常出色的产品和服务，但由于缺乏数据，无法形成具有实际意义的功能。\n\
    \n表面上看，我们淹没在数字的海洋里。但是，它们几乎总是处于格式不兼容的孤岛中，同时又被锁在规则复杂的迷宫里。塞缪尔·泰勒·柯勒律治（Samuel Taylor\
    \ Coleridge）于1798年写过一首古诗《古舟子咏》（Rime of the Ancient Mariner），诗中描述主人公被困在茫茫大海中，没有风，船随波逐浪，“到处都是水，却无一滴可饮”（“water，\
    \ water， everywhere， nor any drop to drink”）。\n\n不过有迹象表明，当下的新冠肺炎疫情让很多事情发生了变化。从某种意义上说，过去4个月的进步甚至超过了过去4年。如果你的工作涉及医疗数据，你需要了解“FHIR”即“快速医疗互操作性资源”是什么。这是一个新的全球数据标准，其目标是以一致、便于实施和严格的方式简化数据操作和维护数据完整性，以在医疗应用和医疗组织之间交换数据。\n\
    \n![](images/txt025_7.jpg \"pagenumber_ebook=210,pagenumber_book=194\")\n\nFHIR：医疗数据交换的基础\n\
    \nFHIR涉猎范围广泛，涵盖了为人类和动物提供服务的各种诊所、临床护理、公共卫生、临床试验、行政管理和财务部门。这套数据标准旨在供全球范围内各种体系结构和场景中使用。作为完全现代化且可扩展的数据标准，FHIR有能力让AI系统在全球范围内扩展，因为即使目前只能在给定的医疗系统中使用FHIR，最终目标仍然是所有AI。\n\
    \n为了确保为将来的医疗发展奠定基础，可以为机器学习算法提供不偏向特定地理位置的数据，无论是患者数据库、遗传基因库，还是治疗方法，都需要一个具有全球扩展潜力的系统，而FHIR正是为此而设计。可以畅想一下未来的医疗服务，运用FHIR找到一种便捷的方式，让各地区之间可以交换数据，同时满足人们的各种安全和隐私需求。\n\
    \n能够在新冠肺炎疫情下做到这一点极其重要。正如我们所吸取的最大的教训，保障公共健康和应对公共卫生危机离不开数据以及数据的交换共享。为此，微软通过云计算平台Azure提供了世界上第一个基于云的FHIR服务。基于Azure的FHIR服务器可作为开源产品使用，而为FHIR设计的API则可作为完全托管的“平台即服务”来提供。\n\
    \n微软在此基础上启用了众多托管服务，通过在云上无缝管理受保护的医疗信息为客户赋能，无论这些数据是来自远程连接的设备、电子病历系统，或是任何其他来源。在现代化医疗数据互操作性基础上，还将\
    \ Teams、Dynamics、Power Platform、Azure和Azure AI中的各种功能整合到“微软医疗云”这一产品中。除了云服务，微软也将继续与世界各地的政府合作，甚至与最激烈的竞争对手合作，来确保共同营造一个更加以数据为驱动的未来。\n\
    \n可以说，这是技术基础架构的巨大转变，因为如此大规模的迁移上云，在历史上或许只会发生一次。业界伙伴需要共同努力，在做出了这一转变之后，未来才可能有更好的医疗服务和公共卫生体系。今天的努力是为了促进公共卫生、医疗服务供给和科学研究的共同进步，今天的每一个选择，都对未来影响重大。\n\
    \n因此，我们需要所有人共同努力应对数据挑战，这样才能从眼前的危机中恢复，并且防患于未然，最终建立一个更美好、更安全的世界。\n\n\uFEFF\n\n以AI之力引领医疗未来\n\
    \n苏博科（Pascal Soriot）\n\n阿斯利康全球首席执行官\n\n![](images/txt026_1.jpg \"pagenumber_ebook=212,pagenumber_book=196\"\
    )\n\n自2012年10月1日起担任阿斯利康全球首席执行官，任职以来，引领了阿斯利康的变革，使之成为一家科学至上的全球生物制药企业，专注于肿瘤、呼吸、心血管、糖尿病、肾脏疾病领域。加入阿斯利康前，曾在瑞士巴塞尔担任罗氏制药首席运营官，在此之前曾在美国就任基因泰克首席执行官并领导了与罗氏制药的成功合并。拥有法国迈松阿尔福国家兽医学院兽医学博士学位及巴黎高等商学院工商管理硕士学位。\n\
    \n![](images/txt026_2.jpg \"pagenumber_ebook=213,pagenumber_book=197\")\n\n现在全球都感受到了新冠疫情的影响，虽然很多地方有效控制了疫情，但是全球性的挑战依然存在，仍然需要我们共同来应对，只有这样才能够取得经济社会的进一步发展。在这方面，AI能够发挥重要的作用。AI有巨大的潜能，可以改善制造产品和提供服务的能力，以及改变人们互动交流的方式，这里我想借助阿斯利康的实践，谈一谈AI在医疗方面的应用。\n\
    \nAI可以帮助研发新药，赋能新药的生产，也可以提高对疾病的诊断能力。长期而言，AI能够帮助我们预测甚至是预防疾病。当前，在世界人口老龄化、预期寿命上升以及如癌症、糖尿病等慢性疾病日益普遍的背景下，世界各地的医疗体系都面临巨大挑战，而新冠疫情更是加重了这种挑战，因此，AI在医疗领域取得的进展非常重要。\n\
    \n为了让AI能在应对这些挑战时发挥更大作用，我们必须协同合作，其中信息分享尤为重要，必须确保数据能合理存储、及时分享，并保证数据安全。我们要把在医院、诊所、个人终端收集的数据加以整理并用统一格式存储，从而确保数据可以应用于不同的项目。个人设备获取的数据应该能供医生远程使用，甚至跨越国界，同时我们又要保护数据安全，确保用户隐私不被泄露。只有当人们能够信任数据运用的方式，才能够乐于分享数据。也只有这样，我们才能更好、更高效地运用数据，并将数据的市场效益最大化。\n\
    \n在AI的应用方面，以阿斯利康为例，我们不是以碎片化的方式来应用技术，而是采用一个整体的方法，把数据科学和AI运用在药物的整个生命周期中。\n\n阿斯利康和其他企业一起为复杂疾病研发新药。我们运用在治疗疾病方面的专长以及对数据科学、生物医学的理解，更好地了解疾病机制，更好地找到治疗的靶向目标。\n\
    \n现在我们在测试新药有效性和进行临床试验时，超过70%的数据从家庭收集，这意味着更少的随访、对患者生活更少的干扰，并让我们的临床试验更加高效。\n\nAI也能在药品生产中发挥作用，减少人力投入。我们利用AI对生产设备进行更好的维护和保养，并在设备发生故障后更及时地进行维修。不管是对患者、我们自己或者整个社会，这都非常重要。\n\
    \n在诊断和治疗方面，阿斯利康与剑桥大学运用AI进行新冠肺炎患者的管理，让医生能够更快更准地进行诊断，让医院可以更高效地进行资源配置，这增加了患者生存和康复的概率。\n\
    \n![](images/txt026_3.jpg \"pagenumber_ebook=215,pagenumber_book=199\")\n\n以上都是中国以外的例子，然而我认为AI在医疗领域最令人振奋的应用在中国。在中国，我们看到技术迅猛发展，百度、阿里巴巴、腾讯这样的企业已成为世界巨头，并拥有众多的合作伙伴。中国的人口、产业实力、政府领导力和创业文化都能让技术能得到更好的发展，让数字化可以更好地推广。中国的软件工程师们有很高的目标，他们和产业界一起创造了一个新的生态系统，让AI技术蓬勃发展。\n\
    \n阿斯利康在中国的AI实践主要是在复杂疾病管理和治疗方面。2017年，阿斯利康在无锡建立了AI创新中心（药物开发合作平台），并建立了全程疾病管理解决方案。运用AI和数据科学技术，诊断变得更加高效准确，从而让治疗变得更加有效，这让我们能够更多、更好地对患者进行治疗。\n\
    \n有3个案例可以证明我们取得的进展。第一是肺癌治疗一体化中心。我们将AI技术应用于肺部影像的造影、CT，减少医生负担，帮助患者更快得到诊断结果，而时间对于这类患者而言，非常宝贵。第二是在消化道肿瘤方面。我们将AI技术应用于消化内镜的诊断，提高诊断效率和准确性。第三是咳喘管理中心。我们利用AI帮助呼吸道患者自动检测自身健康状况，提醒他们遵照医嘱，同时及时与患者沟通。如果没有AI，我们完全没有办法同时管理那么多患者，并保持很高的服务水平。\n\
    \n![](images/txt026_4.jpg \"pagenumber_ebook=216,pagenumber_book=200\")\n\n我们已经看到AI改变社会、经济和产业的潜力，但这仅仅是开始，相互学习可以让我们找到更多进步的方法。阿斯利康一直都在寻找最好的伙伴进行医疗领域的研发，让医疗服务更加高效、便捷和普惠。\n\
    \n\uFEFF\n\n机 遇\n\n\uFEFF\n\n机器学习大有可为\n\n斯瓦米·西瓦苏布拉曼尼（Swami Sivasubramanian）\n\n\
    亚马逊AWS全球副总裁\n\n![](images/txt028_1.jpg \"pagenumber_ebook=218,pagenumber_book=202\"\
    )\n\n亚马逊AWS全球副总裁，负责亚马逊人工智能和机器学习领域的业务。负责AWS核心数据库业务的工程设计、产品管理和运营保障，而这一核心数据库正是AWS以下产品的基础构建模块：DynamoDB、Amazon\
