    # 自主智能体与博弈论


    ## 作者简介


    杰弗里·罗森沙因（Jeffrey S.Rosenschein）

    '
  trans: '


    # Key Issues and Prospects in AI Development


    ## First: Environmental Perception


    AI image recognition systems, despite high recognition rates, are very unreliable,
    unsafe, and vulnerable to attacks because their recognition methods differ vastly
    from humans. Let''s look at how a machine recognizes a horse: it analyzes the
    local features of the horse, then compares them with features of other animals
    like cows, distinguishing based on local features. This is the so-called black-box
    learning method—it can only learn local features, not high-level semantic features.
    Therefore, it can only distinguish horses from cows but does not truly "know"
    what a horse or a cow is.


    How can we improve this? One approach is to draw inspiration from the human brain''s
    mechanisms. The human visual nervous system is also a multi-layer neural network.
    In comparison, the artificial neural networks we currently use are too simple,
    having only connections from the lower layer to the upper layer—so-called feedforward
    connections. The human visual neural network is far more complex, featuring feedback
    connections, lateral connections, sparse firing, attention mechanisms, multimodality,
    and memory.


    If we can incorporate the characteristics of the human visual neural network into
    current artificial neural networks, we can greatly improve image recognition performance.
    This is a key task we are undertaking today. Below, I introduce a project from
    our team: integrating sparse firing rules into each layer of the neural network.
    Based on this alone, the top-level neurons in the network can detect the contours
    of faces, cars, elephants, and birds—meaning it can detect semantic features.
    This shows that adding characteristics of the human neural network can potentially
    improve AI image and speech recognition performance. Of course, this is only preliminary
    work.


    Additionally, many problems remain in image recognition, such as the difficulty
    of separating an object from its background. Taking horse recognition as an example,
    machines struggle to detect *where* the horse is, and also *what* a horse is.
    How to resolve this contradiction? We must return to the human brain. How does
    the brain solve this? Why do humans know where the horse is at a glance? Because
    we know horses. Where does this knowledge come from? It is learned from continuous
    observation. We can use an autoencoder neural network to let it learn knowledge
    about horses through unsupervised learning. Once the computer "knows" the horse,
    it becomes easy to locate the horse in the image, separate it from the background,
    and thus recognize it. We have done some preliminary work in this area with some
    results.


    ## Second: AI Safety Issues


    As mentioned, pattern recognition systems built via deep learning are very unsafe
    and easily attacked. These defects can be improved from the data side and the
    model side. Here is just one example: facial recognition. Everyone uses facial
    recognition to unlock phones. If it''s not the phone''s owner, "face scanning"
    fails, and the system identifies it as a non-user. If adversarial glasses are
    worn, login succeeds, deceiving the system. With an AI firewall, even wearing
    adversarial glasses prevents entry. This shows that various methods can improve
    intelligent system security. We developed an open-source `Zhusuan` probabilistic
    programming library, including our self-developed probabilistic programming algorithms,
    which improve interpretability and security.


    ## Third: Reasoning, Decision Making, and Game Theory


    AI programs have defeated humans in board games, including Go and Chess, which
    are perfect information games—relatively simple for computers. For imperfect information
    card games, it is much harder for computers. Only in 2017 did computers defeat
    humans in four-player no-limit Texas Hold''em. Card games generally fall into
    deterministic problems under probability, where probabilities can usually be calculated.
    But our usual decision environments are different—completely uncertain, even adversarial.
    Currently, game competitions are often used as experimental platforms for decision-making
    in adversarial environments. Game environments are dynamic, uncertain, and involve
    different tasks like offense and defense. The main method currently used is reinforcement
    learning; currently, computers can only beat humans in simple game environments.
    Our team has participated in competitions, such as the international `VizDoom`
    competition, winning 2 preliminary championships in 2018, and 1 championship and
    1 runner-up in the finals.


    ## Fourth: How to Adapt to Environmental Changes


    We started developing autonomous vehicles in 1991. Where are the problems with
    current autonomous driving? Our current approach is to recognize objects, build
    models, and plan on the models—all three steps currently meet real-time requirements.
    Despite this, this approach struggles in complex road conditions because it cannot
    handle emergencies well. To handle emergencies, driving knowledge must be added,
    and experience must be accumulated from continuous trials in real environments—learning
    to handle emergencies via reinforcement learning. We developed an open-source
    platform: the `Tianshou` reinforcement learning platform.


    ## Finally: Why AI Has Just Begun


    The first and second generations of AI have significant limitations; they can
    only solve deterministic problems in perfect information and structured environments.
    The scope of solvable problems is very limited, relying mainly on data and computing
    power. The exciting main act is about to begin—this refers to the third generation
    of AI. The goal of third-generation AI is to better solve computer intelligence
    problems. The most important manifestations of human intelligence are adaptability
    and analogical reasoning (learning one thing and inferring many). To achieve this,
    we must fully utilize four elements: knowledge, data, algorithms, and computing
    power. Only then can we solve problems in imperfect information, uncertain, and
    dynamically changing environments, achieving true AI.


