- raw: "经过这次疫情，中国已经没有纯粹的传统产业，即便是最为传统的农业。今年2月，国内抗疫最紧张的时候，腾讯AI Lab尝试在辽宁的温室进行远程种植番茄的实验。虽然碰上倒春寒，但实验组通过AI算法做到了实时气温调整，从而让每亩净利润增加数千元。在腾讯与荷兰的大学联合举办的温室种植大赛中，5个复赛队的AI组收成都超过有20年种植经验的农业专家组。我们相信，AI技术正在深深“嵌入”各行各业，变得无所不在。日益完善的新基建和产业互联网，将为各行各业带来新增量，为经济发展带来新增长。\n\
    \n第二个“新”是新博弈（New Games）。\n\nGame是游戏，也有比赛和博弈的含义。腾讯正在全力支持上海打造“全球电竞之都”。目前，腾讯电竞在上海建立了《英雄联盟》和《王者荣耀》的远程直播中心，腾讯电竞的一系列重要职业联赛将陆续落地上海。今年，我们还在积极筹备在上海举办的英雄联盟S10全球总决赛。\n\
    \n潜力巨大的电竞产业，给我们带来的不仅仅是经济价值。在选手和观众眼中，电竞是一场比赛；在AI专家眼中，电竞更是一场多智能体的博弈。在AI发展历程中，具有标志意义的AlphaGo就诞生在围棋这个古老的中国“游戏”场景中。目前中国国家围棋队正在将腾讯开发的围棋AI“绝艺”用于队员训练，并取得了很好的效果。在破解围棋难题之后，多人战术竞技类游戏（MOBA）成为我们研究AI复杂决策能力的重要场景。2018年，《王者荣耀》AI“绝悟”通过了人类战队的测试，2019年达到电竞职业水平，目前正在向顶级职业水平冲刺。\n\
    \n通过探索多模态等前沿课题开发出的“数字人艾灵”不仅会做电竞解说，教小朋友唱歌跳舞，还有越来越多模仿真人的能力。未来的小说、电影、动漫和游戏里的人物都很可能跳出具体的作品，成为我们现实生活中的朋友，跟我们交流情感，帮我们出谋划策。比如，如果工作中遇到挫折和困难，你除了找朋友吐吐槽，也许还能找《庆余年》里那个聪明豁达的范闲聊聊天。\n\
    \n未来，AI可能会重塑我们的游戏研发、电竞赛事乃至整个数字文化产业，同时，游戏和电竞为AI提供了最理想的试验场。比如，游戏电竞中的多智能体博弈，也是智能网联汽车在现实中需要解决的问题。目前，我们已经尝试用游戏领域的技术优势为汽车厂商构建仿真环境，以提升自动驾驶的测试效率和安全性。我相信，人工智能高地和全球电竞之都不是孤立存在的，它们将在未来的上海找到交点。\n\
    \n第三个“新”是新世代（New Generation）。\n\n今天的电竞运动员大多是“95后”。我们叫他们“数字原住民”。在我们看来，新基建将激发新一代年轻人的聪明才智，产业互联网注定会成为“数字原住民”实现梦想的舞台。仅今年前4个月，微信生态的工作岗位就增加了近60万个。我们相信，数字世界是一个等待全球年轻人共同建设的新家园。\n\
    \n“AI向善”的“四可”（可用、可靠、可知、可控）原则督促我们在使用AI时，不断思考和解决隐私安全、算法歧视、数字鸿沟等新问题，努力实现“透明、普惠、责任与安全”。AI不但改变着人与机器的关系，而且也会带来人与人关系的变化。AI是我们产业经济中最大的变量，更是我们社会生活中最重要的未知数，新一代年轻人要掌握科技力量，更要思考文化价值，两者同等重要。\n\
    \n创新正在让上海变得更有魅力。上海多次提出要把开放的“门”打开、创新的“火”点旺、包容的生态建好。最近几年，上海的独角兽企业像雨后春笋一样层出不穷。我们不仅看到美团点评、拼多多、小红书、阅文集团、哔哩哔哩（Bilibili）等企业的迅速成长，还看到了上海“开放、包容与创新”的城市品格。我们相信，这座城市的创新潜力才刚刚开始释放，未来它一定会在科技之江与人文之海的交汇点创造新的历史。\n\
    \n\uFEFF\n\n人工智能理论的新方向\n\n姚期智\n\n清华大学交叉信息研究院院长，2000年图灵奖得主，中国科学院院士，美国科学院院士\n\n\
    ![](images/txt008_1.jpg \"pagenumber_ebook=51,pagenumber_book=35\")\n\n世界著名计算机科学家，被公认为密码学及量子计算的国际先驱。2000年荣膺图灵奖，是迄今唯一获此殊荣的华裔科学家。先后任教于美国麻省理工学院、斯坦福大学、加州大学伯克利分校及普林斯顿大学。2004年辞离普林斯顿大学回国全职任教于清华大学。2005年创办“计算机科学实验班”（姚班），被外界誉为“世界上最好的计算机本科教育”。2011年创建“清华量子信息中心”与“交叉信息研究院”。2018年创立南京图灵人工智能研究院、西安交叉信息核心技术研究院。2019年又特别创办“清华学堂人工智能班”（智班）。2020年成立上海期智研究院，旨在推动以人工智能为主导的交叉学科发展。\n\
    \n![](images/txt008_2.jpg \"pagenumber_ebook=52,pagenumber_book=36\")\n\n人工智能的应用已经无处不在。如果我们环顾四周，就会看到很多AI领域新进展以及AI的广泛应用。但与此同时，我们也要记住，今天看到的这些耀眼的应用，得益于一些基础科学领域的发展，而基础科学的发展，是源于多年以来基础理论研究的积累和突破。所以，为了继续推动AI应用方面的创新趋势，我们必须在理论研究方面有新的突破。我想传递以下三个观点：\n\
    \n第一，AI理论是非常重要的。通过理论视角进行分析，我们可以更清晰地了解AI领域面临的问题和挑战，同时也获取一些关于解决方案的启示和线索。\n\n第二，AI的发展需要跨学科的合作。我们可以看到很多在AI领域获得巨大成功的例子，都是来源于一些看似不搭界的学科之间的合作。如果没有来自其他学科科学家的成果，那么在AI领域我们不可能取得这么快的发展。\n\
    \n第三，AI理论方面有一些非常有意思、值得探索的新方向。\n\n我希望分享三个AI基础理论的新方向：神经拓扑结构、隐私保护学习、可控的Super AI（超级人工智能）。\n\
    \n首先，神经网络研究的新视角：神经拓扑结构。深度学习和神经网络是目前很多AI应用的基础。深度学习在近年来的巨大突破，其实很多人是没有预计到的。深度学习很多年以来都没有什么进展，直到突然之间几个要素集合在一起之后，深度学习和神经网络才产生了巨大的应用和影响。\n\
    \n但是为什么神经网络能这么成功呢？这对很多人来说依然是一个谜—很多人都在追寻神经网络的力量到底来自哪里—如果我们能够理解神经网络为何会成功的缘由，那么也许就会知道如何来改善神经网络，进而取得下一个突破。\n\
    \n我们先来看看关于“神经网络能做什么”的一个简单例子。比如气候预测，如果需要设计一个算法来捕捉气候形势，用来分析气象图到底是风暴现象还是正常气候，一个比较标准的方法是把气象图看作是一个二维或者三维的表现，然后通过图形分析从中找到范式，用以识别风暴的特点。\n\
    \n但是在深度学习和最近的一些机器学习中，人们是从一个更高层次的角度，将整张图视作高维度空间中的一个点。比如说猫的图片，假设这张图有一百万像素，那么它可以被视为一个一百万维数据空间中的一个点。这其实就是现在人工智能领域一个标准的机器学习的方式—数据被视为极高维度数据空间中的一个点，通过算法分析去判断这个点是否属于某个特定的集合（例如例子中的猫图片的集合）。\n\
    \n抽象来讲，我们可以看一下所有的猫的图片，它们构成了一个一百万维度中的数据集合。我们对于低维度数据有一个直观感受，但是没有人知道在高维度中的数据集是什么样的。我们的任务就是通过设计算法来对高维度数据做出好的判断。这一工作的核心在于神经网络，其中最关键问题就是神经网络要达到多大的大小和深度，才可以区分猫与非猫的图片。\n\
    \n多年以来，数学家一直在关注高维度数据集。一个自然的问题是，当我们试图去理解神经网络能用来做什么，我们首先希望理解对于神经网络而言，什么样的数据集是比较容易去分析和识别的，以及什么样的数据集是我们不能够用神经网络来分析的。\n\
    \n在过去的十多年中，神经网络学家开始将数学中的拓扑学和神经网络相结合，并且取得了很好的计算效果。在拓扑学中与高维度数据相对应的一个重要概念是贝蒂数。贝蒂数是一个数列，最低的是B0，它相当于数据集中相互之间不相关的元素数量。而Bi是什么意思呢？你可以把它认为是子集当中i—维洞的数量（number\
    \ of holes）。比如下图贝蒂数示例中左边是一个平面上的圆圈，则B0\\=1，代表存在一个相互连接的元素；B1\\=1，代表图形中有一个洞。右边是一个更复杂的例子。图中展示了一个环面，B1也就是一维洞的数量，等于2，因为有两个不同类型的圆圈，而每一个圆圈就代表着一个洞。令图形S的贝蒂数为（B0，B1，…），ΣiBi称为S的“贝蒂数”。直观上说，贝蒂数越高，形状越复杂。\n\
    \n![](images/txt008_3.jpg \"pagenumber_ebook=55,pagenumber_book=39\")\n\n贝蒂数示例\n\
    \n一个直觉观点是，对于神经网络而言，形状越复杂，识别的难度也就越高。事实上这种直觉也是正确的，我们可以通过一些经典的拓扑学的理论，再加上理论计算科学家的一些洞见来证明这一假设。这也证明了刚才的一个观点，即如果你想解决一个有趣的AI问题，需要从不同学科的角度加以思考。这个案例当中讲的就是拓扑学，通过引入拓扑学可以让我们获得在AI方面的崭新洞见，而如果只关注AI的研究是不可能达到的。\n\
    \n第二个例子，关于隐私的保护。首先介绍另外一个学科，就是密码学。我本人对密码学非常感兴趣，特别是“多方计算（multi-party computation，MPC）”。MPC背后基本的理念是这样的：假定有很多不同的当事方，每个当事方都有一些数据，而且需要所有各方的数据集合在一起后，才能够利用AI的技术去挖掘或者发现重要的结果。然而各个当事方所拥有的数据都是机密的数据，而且是非常有价值的，因此他们都不希望将自己的私密数据泄露给其他当事方。\n\
    \n在这种情况下，我们是不是可以不需要揭秘各自的数据内容就可以进行协同计算呢？答案是确实可以的，可以通过密码的设计，也就是多方安全计算可以实现这个目标。\n\
    \n这个多方安全的概念及技术是我在1982年提出的，在当时的价值是观念上的创新及算法上的可行性。经过多年的发展，密码学的应用成本已经大大地降低，使得多方安全技术也可以有多种实际应用，包括用在具有隐私保护的机器学习。举个例子，几家制药公司希望共同进行新药开发，但每一家制药公司都有一点自己的机密信息，现在就可以通过人工智能+MPC使多家制药公司能够在不披露其独家知识产权的情况下进行合作。\n\
    \n![](images/txt008_4.jpg \"pagenumber_ebook=56,pagenumber_book=40\")\n\n多方安全计算在隐私保护药物发现流程中的应用\n\
    \n最后一点是很多人非常感兴趣的，但也是一个充满争议的话题，那就是可控的超级人工智能，就是所谓的Super AI。人们普遍关心的是AI快速的进展对于人类社会可能造成的威胁。通用的超级人工智能何时到来？这是不可预知的。加州大学伯克利分校斯图尔特·拉塞尔（Stuart\
    \ Russell）教授2019年出版了《人类兼容：人工智能和控制问题》（Human Compatible： AI and the Problem of Control），介绍如何推动“确保安全”的Super\
    \ AI，并力主这一理念必须贯穿AI设计过程中。他设定了三个原则：利他（人的利益高于机器利益）、谦卑（机器不能自以为是）、尽心（机器能学懂人的偏好），通过概率理论和博弈论理论等数学方法来实现这些原则。\n\
    \n我要告诉大家一个基本的事实是，现在的AI应用是来自过去的理论研究，我们现在做的理论研究总会在未来的某一天让我们获得巨大的进步。\n\n\uFEFF\n\n\
    迈向第三代人工智能\n\n张 钹\n\n中国科学院院士，清华大学人工智能研究院院长，清华大学计算机系教授\n\n![](images/txt009_1.jpg\
    \ \"pagenumber_ebook=58,pagenumber_book=42\")\n\n2011年德国汉堡大学授予其自然科学名誉博士，获2014年度中国计算机学会（CCF）终身成就奖，2019年获人工智能学会吴文俊人工智能最高成就奖。从事人工智能、人工神经网络和机器学习等理论研究，以及模式识别、知识工程和机器人等应用技术研究。在上述领域共发表学术论文200多篇，出版5部专著。其科研成果获ICL欧洲人工智能奖等。此外，他是智能技术与系统国家重点实验室创建者之一，并于1990—1996年担任该实验室主任。\n\
    \n![](images/txt009_2.jpg \"pagenumber_ebook=59,pagenumber_book=43\")\n\n人工智能60年的发展历史，一共经过了两代。第一代人工智能，有的时候称作符号主义。人们提出了基于知识和经验的推理模型，用这个模型来模拟人类的理性智能，像推理、规划、决策等。为此，需要在机器里建立知识库和推理机制，利用这两个机制模拟人类的推理和思考等行为。\n\
    \n下面举一个例子。1971年左右，美国斯坦福大学根据这个原理建造的一个专家系统叫作MYCIN系统，它主要用来诊断血液传染病和开抗生素处方。它把传染病专家的知识放在计算机里，并且把医生诊断的过程—如何从症状推到疾病，最后开出处方—作为推理机制，也放在计算机里。这样内科医生就可以在计算机的辅助下进行诊断。由于内科医生通常不是传染病专家，因此这样的计算机辅助治疗系统，可以帮助内科医生做出更好的、更准确的诊断和处方。\n\
    \n利用这种原理做的人工智能系统，一个最有代表性的成果，就是IBM的深蓝国际象棋程序。这个程序在1997年5月打败世界冠军卡斯帕罗夫。计算机的深蓝程序为什么可以打败人类的象棋大师，主要是以下三个要素：第一个要素是知识和经验，也就是说它利用了人类大师下过的70万盘棋局，还有全部的5～6子的残局。根据这些下棋的知识，总结成下棋规则。又通过大师和机器对弈，对评价函数中的8000个参数进行调试，把大师的经验也放在程序里。第二个靠的是算法，“深蓝”使用α—β剪枝算法。这个算法可以加快搜索速度。第三个是算力，IBM当时用RS6000机器，每秒能分析2亿步，平均来讲能往前看8～12步。一个有经验的象棋大师一般只能往前看3～5步，因此机器从速度上超过了人类。\n\
    \n第一代人工智能的优势，在于它能够模仿人类推理的过程、思考的过程，因此它是可以解释的，跟人类思考问题的过程一致。同时，利用这个办法做机器学习，就能够举一反三。这是第一代人工智能的优势。\n\
    \n但是第一代人工智能也存在非常严重的缺陷。比如，这些知识来自专家，大家知道专家的知识是非常稀缺，也是非常昂贵的，而且通过人工编程把它输进计算机，是非常费时费力的。同时有很多知识很难表达，比如，那些不确定的知识、常识等。因此第一代人工智能的应用范围非常有限。\n\
    \n第二代人工智能，这就是大家非常熟悉的深度学习。所谓深度学习，就是通过它模拟人类的感知，如视觉、听觉、触觉等。我们用图像识别作为例子来说明计算机如何模拟人类的感知。比如，我们要想让计算机识别不同的动物，怎么办呢？由于我们没法把什么叫作马、什么叫作牛告诉计算机，只好采用人类学习的办法，因此机器学习的过程大体如下。\n\
    \n先收集大量有关动物的图片，把这些图片分成两类。一类作为训练，训练计算机识别马或其他动物，这叫作分类，即通过训练让计算机能正确地区分马和牛等，也叫作学习，机器学习用的是多层神经网络。经大量的图片训练以后，我们再把另一部分图片，即没有学习过的图片，让机器识别。如果90%识别对了，就说它的识别率是90%，误识率是10%。用同样的办法进行语音识别。在给定的图像库或语音库下，现在图像或语音的机器识别率均可以达到或超过人类的水平。\n\
    \n深度学习有什么优点？第一个优点是它不需要领域知识，技术门槛比较低。换句话讲，我们只要把原始图片、原始语音输进去就可以，不需要告诉计算机怎么去识别图片或语音，计算机会自动提取合适的特征并识别它，所以任何人都可以使用这个工具。\n\
    \n第二，网络的规模很大，因此可以处理大数据。比如，图像库ImageNet，一共有2万种类别、1 400万张图，数据量很大。2011年计算机在这个图像库上的误识率高达50%，也就是说一半认错了。可是4年以后，2015年微软用深度学习的办法来识别这组图像，误识率降到3.57%，比人类的误识率5.1%还要低。这说明利用深度学习的方法，在一定条件下，可以使机器的图像和语音识别水平超过人类。\n\
    \n因此，深度学习受到广泛的关注。一个最典型的例子就是围棋程序。大家知道在2015年10月之前，我们用传统的基于知识的方法编出来的围棋程序只达到业余5段的水平。2015年10月，利用深度学习等方法，围棋程序AlphaGo打败了欧洲冠军。2016年3月，打败了世界冠军。到2017年10月，AlphaGo—Zero打败了AlphaGo。这说明在3年时间里，由于利用深度学习，围棋程序的水平从业余跳到专业，从专业跳到世界冠军，又从世界冠军跳到超世界冠军。\n\
    \n两年里围棋程序实现了三级跳。AlphaGo的成功来自何处？来自三个方面：一个是大数据，一个是算法，一个是计算能力。我们可以看到AlphaGo的确利用了大数据，它一共学习了3000万盘棋局，自己跟自己又下了3000万盘，一共学了6000万盘棋局，数据量很大。用的算法是蒙特卡洛树搜索、强化学习、深度学习等。算力也很强大，由1\
    \ 202个CPU、280个GPU组成分布式计算系统。\n\n第二代人工智能也有很大的局限性，包括不可解释性、不安全、易受攻击、不易推广、需要大量的样本等。这里只举一个简单的例子，即用我们博士生做的一个例子来说明这个问题。下图左边这张图片是雪山—阿尔卑斯山，计算机图像识别系统以94.39%的信度认定它是阿尔卑斯山。但只要加上一点噪声，变成右边这张图，右边图跟左边图从人的眼睛看来几乎完全一样，因为只多了一点点噪声，但是计算机会以99.99%的把握认定它是一条狗。\n\
    \n可以看出，计算机的模式识别系统跟人类的视觉差别非常大。尽管它的识别率很高，但是非常不安全、非常不可靠，而且不可解释。为什么机器把带噪声的雪山解释成一条狗，我们没法解释。\n\
    \n![](images/txt009_3.jpg \"pagenumber_ebook=63,pagenumber_book=47\")\n\n第二代人工智能局限性示例^([\\\
    [1\\]](#txt009.html#footnote_content_txt009_1))\n\n从第一代、第二代人工智能的成就来看，应该说人工智能刚刚拉开序幕。第一代、第二代人工智能都有很大的缺陷，它们的应用范围非常有限，更精彩的大戏正要上演。这场大戏就是第三代人工智能，它必须解决第一代、第二代人工智能中存在的缺陷。必须建立一个可解释的、鲁棒的人工智能理论，必须发展安全、可信、可靠和可扩展的人工智能技术，只有这样才能实现技术上的突破。有了技术上的突破，才能推动人工智能的创新应用。\n\
    \n发展第三代人工智能的办法就是把第一代知识驱动的方法和第二代数据驱动的方法结合起来。换句话讲，我们要综合地利用四个要素，即知识、数据、算法和算力，第一代人工智能使用了其中的三个要素，第二代人工智能也只用了其中的三个要素。\n\
    \n我们如何解决以下几个关键问题？"
  fmt: '

    # 三个“新”：AI技术深度嵌入、新博弈与新世代


    经过这次疫情，中国已经没有纯粹的传统产业，即便是最为传统的农业。今年2月，国内抗疫最紧张的时候，腾讯AI Lab尝试在辽宁的温室进行远程种植番茄的实验。虽然碰上倒春寒，但实验组通过AI算法做到了实时气温调整，从而让每亩净利润增加数千元。在腾讯与荷兰的大学联合举办的温室种植大赛中，5个复赛队的AI组收成都超过有20年种植经验的农业专家组。我们相信，AI技术正在深深“嵌入”各行各业，变得无所不在。日益完善的新基建和产业互联网，将为各行各业带来新增量，为经济发展带来新增长。


    ## 第二个“新”是新博弈（New Games）


    Game是游戏，也有比赛和博弈的含义。腾讯正在全力支持上海打造“全球电竞之都”。目前，腾讯电竞在上海建立了《英雄联盟》和《王者荣耀》的远程直播中心，腾讯电竞的一系列重要职业联赛将陆续落地上海。今年，我们还在积极筹备在上海举办的英雄联盟S10全球总决赛。


    潜力巨大的电竞产业，给我们带来的不仅仅是经济价值。在选手和观众眼中，电竞是一场比赛；在AI专家眼中，电竞更是一场多智能体的博弈。在AI发展历程中，具有标志意义的`AlphaGo`就诞生在围棋这个古老的中国“游戏”场景中。目前中国国家围棋队正在将腾讯开发的围棋AI“绝艺”用于队员训练，并取得了很好的效果。在破解围棋难题之后，多人战术竞技类游戏（MOBA）成为我们研究AI复杂决策能力的重要场景。2018年，《王者荣耀》AI“绝悟”通过了人类战队的测试，2019年达到电竞职业水平，目前正在向顶级职业水平冲刺。


    通过探索多模态等前沿课题开发出的“数字人艾灵”不仅会做电竞解说，教小朋友唱歌跳舞，还有越来越多模仿真人的能力。未来的小说、电影、动漫和游戏里的人物都很可能跳出具体的作品，成为我们现实生活中的朋友，跟我们交流情感，帮我们出谋划策。比如，如果工作中遇到挫折和困难，你除了找朋友吐吐槽，也许还能找《庆余年》里那个聪明豁达的范闲聊聊天。


    未来，AI可能会重塑我们的游戏研发、电竞赛事乃至整个数字文化产业，同时，游戏和电竞为AI提供了最理想的试验场。比如，游戏电竞中的多智能体博弈，也是智能网联汽车在现实中需要解决的问题。目前，我们已经尝试用游戏领域的技术优势为汽车厂商构建仿真环境，以提升自动驾驶的测试效率和安全性。我相信，人工智能高地和全球电竞之都不是孤立存在的，它们将在未来的上海找到交点。


    ## 第三个“新”是新世代（New Generation）


    今天的电竞运动员大多是“95后”。我们叫他们“数字原住民”。在我们看来，新基建将激发新一代年轻人的聪明才智，产业互联网注定会成为“数字原住民”实现梦想的舞台。仅今年前4个月，微信生态的工作岗位就增加了近60万个。我们相信，数字世界是一个等待全球年轻人共同建设的新家园。


    “AI向善”的“四可”（可用、可靠、可知、可控）原则督促我们在使用AI时，不断思考和解决隐私安全、算法歧视、数字鸿沟等新问题，努力实现“透明、普惠、责任与安全”。AI不但改变着人与机器的关系，而且也会带来人与人关系的变化。AI是我们产业经济中最大的变量，更是我们社会生活中最重要的未知数，新一代年轻人要掌握科技力量，更要思考文化价值，两者同等重要。


    创新正在让上海变得更有魅力。上海多次提出要把开放的“门”打开、创新的“火”点旺、包容的生态建好。最近几年，上海的独角兽企业像雨后春笋一样层出不穷。我们不仅看到美团点评、拼多多、小红书、阅文集团、哔哩哔哩（Bilibili）等企业的迅速成长，还看到了上海“开放、包容与创新”的城市品格。我们相信，这座城市的创新潜力才刚刚开始释放，未来它一定会在科技之江与人文之海的交汇点创造新的历史。


