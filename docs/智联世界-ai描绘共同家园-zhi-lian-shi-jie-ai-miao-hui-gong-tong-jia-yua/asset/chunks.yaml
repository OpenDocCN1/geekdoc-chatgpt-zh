    # Three Stages of AI Development and Current Opportunities


    This stage can be further divided into two sub-stages. In the first half, AI development
    focused primarily on the development of general capabilities and the platformization
    of AI capabilities as a resource, as well as applications in two landmark industries:
    intelligent search and information feed recommendation. In the second half, AI
    began comprehensive industrialization—that is, the widespread adoption of industry
    applications and commercialization.


    The third stage is the intelligization of society. AI will permeate from the economic
    sphere into broad social domains. Intelligent collaboration and institutional
    innovation on a societal and global scale will be the main characteristics of
    this stage. Ultimately, this collaboration and transformation will have an even
    more profound impact on the economy, and humanity will truly enter an intelligent
    society.


    Currently, we are in a period of transition from the first half to the second
    half of economic intelligization. Through the development of the first half, a
    few general AI platforms and some vertical AI platforms focusing on specific industries
    have emerged globally. In vertical industries such as information search, information
    feed recommendation, and autonomous driving, AI has proven, or preliminarily proven,
    its potential to disrupt and reconstruct the industries it resides in.


    For example, Baidu has focused from the outset on search engines, the largest
    AI application scenario to date; 10 years ago, Baidu began treating the development
    and platformization of general AI capabilities as a key strategy; several years
    ago, Baidu began exerting efforts in the vertical industry of autonomous driving
    and intelligent transportation.


    In the 1990s, the US launched the "Information Superhighway" initiative, greatly
    expanding internet infrastructure and ushering humanity into the Internet era.
    Today, China''s actively promoted "New Infrastructure" can be viewed as the largest
    infrastructure expansion project before humanity enters the intelligent economy
    and intelligent society. It has a high probability of triggering a wave of comprehensive
    AI adoption in China first.


    As an AI platform company positioned to focus on external empowerment, Baidu hopes
    that every enterprise, no matter how small, can use our platform capabilities
    and service capabilities like water and electricity, thereby rapidly achieving
    AI transformation. This will ultimately benefit every ordinary consumer. This
    positioning also allows us to avoid competing with ecosystem partners and always
    adhere to openness as a fundamental principle, enabling us to wholeheartedly play
    the role of AI enabler.


    However, the current stage of AI is also one prone to confusion and even pessimism.
    This is a necessary stage for most disruptive technologies before accelerated
    adoption. It is similar to what the internet experienced in the few years after
    2000: some companies disappeared, and some people left the industry forever. I
    still remember that some overseas returnees even left due to loss of confidence,
    because Baidu also crawled out of that trough, and the memory remains fresh. But
    when the fog cleared, an era of comprehensive internetization of the economy and
    society began, and the "little people" who survived the winter became new heroes.


    Whether it was my faith in the internet back then, or my faith in AI today, there
    has not been a shred of change. I still believe AI is a great wave comparable
    to the Industrial Revolution, and it will thoroughly transform every industry
    we have today. This pandemic will become a catalyst; it has given people a sense
    of urgency to control their destiny, while also letting us see that AI is no longer
    distant, but right beside us. AI extends our hands, empowers our brains, enriches
    our vision, and eliminates barriers of time and space.


    The fog will eventually clear, the intelligent economy and intelligent society
    will eventually become reality, and humanity will eventually master its own destiny.


    ---


    # Robotics and Computer Vision


    ## Martial Hebert


    Professor and Dean, School of Computer Science, Carnegie Mellon University


    ![](img/txt019_1.jpg "pagenumber_ebook=152,pagenumber_book=136")


    A leading researcher in the fields of computer vision and robotics, Dean of the
    School of Computer Science at Carnegie Mellon University (CMU). Received a Ph.D.
    in Computer Science from the University of Paris. Joined the Robotics Institute,
    the world''s largest robotics education and research institution, in 1984. After
    joining the CMU faculty, became a member of the Autonomous Land Vehicles project,
    laying the foundation for autonomous driving technology research. Research areas
    focus on computer vision, including environmental perception modeling, efficient
    recognition technology, 3D scene reconstruction and interpretation, 3D signal
    processing, video analysis, and detection, tracking, and recognition of dynamical
    systems.


    In recent years, we have witnessed tremendous progress in the field of computer
    innovation, particularly the introduction of deep learning in computer vision.
    Today, we will discuss the challenges faced when transferring the aforementioned
    computer innovation capabilities to robotic systems and autonomous systems. For
    example, the fully autonomous vehicle jointly developed by our Robotics Institute
    and industry has been operating normally for many years; this system requires
    high-robustness perception to function properly. Another example is high-speed
    drones, which require the system to achieve high-robustness perception in complex
    environments using only limited computational resources.


    So, what are the key problems we must solve? First, we need to use limited data
    to train systems that differ from other AI application scenarios. Second, any
    failure, malfunction, or error in the vision system can lead to irreversible system
    failure. Simultaneously, we must handle highly complex dynamic environments, such
    as autonomous driving environments. Additionally, we need to solve the problem
    of limited system computational resources and make real-time decisions. Next,
    I will elaborate on the above four issues.


    ### First, Supervised Learning Models


    Traditional learning methods generate models—such as classification, detection,
    and simulation models—through large amounts of data, labeled data, and supervised
    data. Such learning methods require large-scale supervised data models and do
    not require any prior knowledge of the system. However, in robotic systems, we
    may be unable to obtain large amounts of supervised data, or it may be very difficult
    to do so, but we can acquire large amounts of data and experience to help us learn
    these models. This raises the question: can we perform offline training for vision
    tasks?


    This can be approached via meta-learning—learning how to learn. This can basically
    be understood as: for a new task, how to learn a new model from prior knowledge,
    i.e., building an effective computer vision model with insufficient data. A crucial
    point is that when we think about the structured visual world, we should not think
    merely in data and feature space, but directly in task and model space.


    ![](img/txt019_2.jpg "pagenumber_ebook=154,pagenumber_book=138")


    Imagine you face a classification problem. You can envision each classifier as
    an independent model in model space, all existing in a high-dimensional space
    strictly constrained by the visual task framework. The question then becomes:
    can we use this model space structure to facilitate learning, especially few-shot
    learning and more dynamic learning with limited data?


    For example, suppose you can obtain some limited samples for learning a model,
    such as a simple sample for observing a classification, learned from a single
    sample in a certain task or classifier. The current problem is: how do we generate
    the model we want based on multiple samples? In fact, we can consider transformation—transforming
    the model learned from limited samples into a model learned from large samples.
    Only by figuring out this transformation can we better learn from limited samples.
    This is the main obstacle in the entire vision system, especially in robotic vision
    systems: the reliance on labeled data or supervised data.


    The following example illustrates how to implement this idea. This classification
    problem is based on 400 different categories, displayed from left to right in
    order of most samples to fewest samples. This is the performance improvement achieved
    through the technology mentioned earlier. That is, learning the transformation
    from the large-sample classifications on the left, and using this transformation
    to optimize the small-sample classification models on the right. The legend here
    represents the performance improvement of each category. We can see that the performance
    of the small-sample categories on the right has improved significantly, while
    the performance of these large-data classifications has only improved slightly,
    or not at all.


    ![](img/txt019_3.jpg "pagenumber_ebook=155,pagenumber_book=139")


    This achieves the basic concept we wanted: using visual concepts with easily accessible
    data to help learn visual concepts with sparse data. This example illustrates
    that we can learn with minimal data, especially in robotic application scenarios.


    ### Second, Forced Decision Problems in Computer Vision Systems


    First, in robotic systems, there is a pipeline from the input layer, perception
    layer, interpretation layer, to the reasoning and decision layer. The path from
    the perception layer output to the interpretation layer is a straight line; that
    is, we always make decisions based on the perception layer output. The problem
    is that the perception layer output may contain noise, be messy, and may not be
    good enough for the computer vision system to make correct decisions. Therefore,
    the current problem is how to evaluate the performance of the computer vision
    system online and determine in real-time whether we can make decisions based on
    the output results. This involves self-assessment, introspection, and fault detection.


    Take semantic segmentation in an autonomous driving environment as an example.


    ![](img/txt019_4.jpg "pagenumber_ebook=156,pagenumber_book=140")


    Problems in such systems generally lie in result variations caused by different
    lighting conditions. The question then becomes predicting the working performance
    of the vision system under given lighting conditions. Our basic idea is to predict
    the performance of the perception system based on the input, and bypass the perception
    system when necessary, making system operation more reliable by reducing direct
    dependence on the perception system. To achieve this, one method is to explicitly
    represent the relationship between input features and performance; another, better
    method is to find features that directly predict system performance from the input.


    For example, for a simple segmentation task, the system can automatically predict
    that the image on the left is difficult to segment, while the image on the right
    is easier to segment. From the output results, the right side clearly performs
    better. The problem is how to do this automatically and systematically, enabling
    us to obtain a brand-new internal description of system performance.


    ![](img/txt019_5.jpg "pagenumber_ebook=157,pagenumber_book=141")


    Another example is an outdoor mobile robot. Similarly, in this example, we can
    find that the system accurately defines the left image as more difficult to segment
    than the right image. That is, predicting the self-assessment of the computer
    vision system''s performance enables better decisions in system autonomy and planning.


    Another example: a drone flying in an unstructured environment. These are a few
    frames of the aircraft system''s flight. On the left, you can see the input stream
    of images; the top left shows the reconstructed approximate depth of the environment,
    using various LSD (Laser Signal Device) labels that computer vision enthusiasts
    are interested in; the right side shows the evaluation of different trajectories,
    with time nodes for the decision on which trajectory to follow, using the classic
    rolling horizon technique.


    ![](img/txt019_6.jpg "pagenumber_ebook=158,pagenumber_book=142")


    ![](img/txt019_7.jpg "pagenumber_ebook=158,pagenumber_book=142")


    Then the question arises: if the visual system input degrades, it leads to degraded
    depth estimation, which in turn may lead to catastrophic system failure. Therefore,
    what we can do is learn to predict the system''s flight performance from data—not
    assessing the quality of depth estimation, but whether these trajectories have
    been effectively evaluated. We can predict performance based on input data—knowing
    why the system can fly from observed data. Once we achieve this, we can do some
    follow-up work. In this example, the failure probability on the drone''s right
    side is high, so it makes a new move or seeks a new position to get better visual
    output, showing that we have significantly improved the system''s flight performance.


    This case leads to another very interesting question: what is the core challenge
    faced in applying computer vision to robotics? Let''s look at the images below.
    These are the output results of a segmentation system, typically labeling images
    by different regions. Obviously, in these two output results, the upper image''s
    output is better than the lower image''s. In the lower image, a large area in
    the front of the house has incorrect labels. The number of correctly labeled pixels
    in the upper image is greater than in the lower image, indicating that for such
    tasks, the purpose of error measurement is to correctly label as many pixels as
    possible.


    ![](img/txt019_8.jpg "pagenumber_ebook=159,pagenumber_book=143")


    The problem is that there is currently no application scenario that requires correctly
    labeling all pixels in an image. This means we are using the wrong objective function,
    the wrong error metric. Its implementation difficulty may be much greater than
    the actual minimum objective function required to perform the task.


    Returning to this example, we can actually try to figure out the accuracy of the
    3D world reconstructed by the vision system. But in reality, whether this accuracy
    is 3mm or 2mm doesn''t matter at all. The only thing that matters is the completion
    degree of this task. This is the only important objective in robotic application
    scenarios. The difficulty lies in how to design a vision system that focuses on
    and optimizes only a specific objective.


    ### Third, System Interaction Capability with Dynamic Environments


    In the example below, we need to predict Target 18 on the left, determining which
    direction this pedestrian, as the subject of study, will move. The challenge of
    this problem lies in how to make dynamic predictions, incorporating the subject''s
    possible decisions using probability functions. Another difficulty, and perhaps
    the biggest one, is that this task must be realized not only on a single subject
    but on multiple subjects, including interactions between a single subject and
    other subjects.


    ![](img/txt019_9.jpg "pagenumber_ebook=161,pagenumber_book=145")


    Therefore, we encounter a game theory problem: a subject''s decision depends on
    other subjects'' decisions, while other subjects'' decisions depend on this subject''s
    decisions. Therefore, this optimization problem is the main challenge faced when
    predicting dynamic working environments.


    ### Fourth, Real-time Prediction Under Limited Computational Resources


    We can only use limited computational resources to accomplish all this. For example,
    I made an assumption that in the entire computation process, the input information
    is passed to the perception layer before the final interpretation is obtained.
    But in cases of extremely limited computational resources, we may need the vision
    system to make decisions earlier, perhaps needing the vision system to output
    earlier, perhaps obtaining output during the computation process. In other words,
    the vision system needs to give interpretations and output results at any time.
    This capability is becoming increasingly important, especially considering limited
    computational resources and the need to make decisions within a limited exact
    time. This is a concept belonging to the classic computer science research field,
    namely "Anytime Machine Learning" (or "Anytime Prediction"). The basic concept
    of anytime prediction is to output a rough early result first, then continuously
    iteratively optimize the result as time grows—this differs from the classic machine
    vision learning view. The classic view holds that a single result is output only
    at the end of result processing. This means the anytime prediction computation
    process is interruptible; we need to get output results at any time during computation;
    and as time passes, we get better and better output results due to increased computation;
    finally, diminishing returns—i.e., as computation increases, result improvement
    gets smaller. This is the definition of anytime prediction.


    So how do we implement anytime prediction in deep learning? For example, a typical
    deep learning system architecture, say in this network there are different stages,
    layers, and blocks. Each block performs computation and passes the result to the
    next block, and the entire network is optimized based on the final output result,
    which may be the final result.


    ![](img/txt019_10.jpg "pagenumber_ebook=162,pagenumber_book=146")


    Now, to accurately get such output at any time, we need to get intermediate layer
    outputs—that is, not only optimize the final output result but also optimize the
    intermediate layer output values. How to achieve this is a research challenge.
    A feasible method is to get a linear combination of these output quantities. It
    can be seen that a better method is to obtain weights through the inverse of the
    loss at each stage of the optimization process. The details are not particularly
    important; what is important is the concept of the robotic system. We may need
    to consider implementing more complex designs for these learning systems—for example,
    letting them give immediate intermediate layer outputs, so that partial results
    can be obtained at any time under limited computational resources.


    ---


    # Building an Open Ecosystem to Enable an Intelligent World of Everything Connected


    ## Tao Jingwen


    Director and Chief Information Officer, Huawei Technologies Co., Ltd.


    ![](img/txt020_1.jpg "pagenumber_ebook=163,pagenumber_book=147")


    Graduated from Beijing University of Posts and Telecommunications. Joined Huawei
    in 1996, serving as Product Development Engineer, Deputy General Manager of Market
    Technical Department, Executive Deputy Director of International Marketing Department,
    Executive Vice President/President of Southern Africa Region, President of Global
    Marketing/Sales, President of Terminal Company, President of Western Europe Region,
    President of Quality Process IT, and other positions.


    ![](img/txt020_2.jpg "pagenumber_ebook=164,pagenumber_book=148")


    The Fourth Industrial Revolution has arrived. With the continuous maturation of
    technologies such as 5G, AI, and Industrial Internet, as well as the accelerated
    construction and promotion of new-generation infrastructure represented by 5G,
    data centers, and cloud, technology is accelerating the massive application of
    the fourth-generation Industrial Internet in the Internet of Everything, Intelligence
    of Everything, including the digital transformation of enterprises and industries.


    ### Understanding and Judgment on AI Development


    We believe the Fourth Industrial Revolution will impact all aspects of industries.
    It will not only change people''s lives, making them smarter and more convenient,
    but also transform all walks of life. With the extensive use of AI and digital
    technologies, a market exceeding 12 trillion (USD) will be born in this world.
    We predict that by 2025, the ICT (Information and Communications Technology) industry
    and the intelligent manufacturing industry will have scales of approximately 5
    trillion and 6.4 trillion, respectively. In 2017, Huawei released the company''s
    new vision: to bring the digital world to every person, every home, and every
    organization, building a fully connected, intelligent world. In 2018, Huawei released
    the "+ Intelligence, See the Future" full-stack AI strategy. In 2019, with "Create
    New Heights of Intelligence Together," Huawei demonstrated its strategic determination
    in AI and to promote AI industry applications.


    ### Huawei''s AI Development Experience


    Huawei is first and foremost a technology innovation company with two major business
    groups. The first major business group is the Consumer Electronics Business Group
    centered around smartphones. We have been continuously building a "1+8+N" business
    ecosystem, hoping to make every person''s and every family''s life more intelligent
    and enjoyable. Huawei has built a full-stack intelligent solution for the "2C"
    business environment, from terminal phone chips, cloud services, and industry
    ecosystem, jointly building an intelligent life solution for individuals and families
    with industry partners.


    The second major business group faces government, carrier, and enterprise customers—the
    ICT Infrastructure Business Group—dedicated to providing ubiquitous connectivity
    and pervasive intelligent products and solutions. In Huawei''s 2019 full-stack
    AI solution release, one item combines Huawei''s Enterprise Intelligence (EI)
    enablement platform to help governments, industries, and enterprises quickly build
    AI applications. From chips, 5G, edge computing, to cloud services centered on
    the Kunpeng ecosystem Atlas, Huawei provides a full-stack service platform and
    jointly builds an application ecosystem for all industries and scenarios with
    industry partners, providing product and service support for building "Device-Edge-Cloud"
    full-scenario AI infrastructure.


    There is a molybdenum mine in Luoyang. Because it is located in a remote area,
    manual driving of large mining trucks deep into the mining area carries high risks.
    Using "5G + AI" to achieve unmanned driving and remote control, the mining area
    achieved zero casualties in 2019. The number of drivers decreased from over 100
    to 20, and annual output value increased by 160 million RMB, achieving significant
    economic and social benefits. Huawei also helped Ningbo Zhoushan Port build a
    "5G + AI" smart port. Container trucks operate automatically 24 hours a day, with
    an automatic recognition accuracy rate as high as 95%, saving a massive amount
    of labor input. During the COVID-19 pandemic, Huawei cooperated with over 300
    hospitals nationwide to provide "5G + AI" based medical services to over 1 million
    people. The speed of doctors reading scans shortened from over 10 minutes per
    image to within 1 minute.


    AI is a comprehensive service integrating four elements: business scenarios, algorithms,
    computing power, and data. As an enterprise with rich business forms, Huawei is
    also actively promoting intelligent practices internally. Huawei has established
    the Huawei Enterprise Intelligence Brain internally, reducing the time to build
    an AI platform serving the enterprise from the initial 14–16 months to the current
    0.5–2 months. We hope Huawei''s own practical experience can also help various
    industries achieve experience improvement, efficiency improvement, benefit improvement,
    and business model innovation. Huawei has always adhered to the concept of "packing
    its own parachute" (dogfooding), based on its own rich enterprise application
    scenarios, focusing on repetitive, massive, and complex scenarios, creating a
    testing ground for product innovation and intelligent transformation, and empowering
    more enterprises with Huawei''s mature digital transformation experience.


    ### Thoughts and Suggestions on AI Development


    To enable AI development to better serve society, we have two suggestions. First,
    AI must develop in an orderly manner. We believe governments, industry associations,
    and standards organizations should strengthen policy formulation and AI legislation.
    Various industries and industrial alliances should strengthen consensus and form
    data exchange standards. Second, we call for strengthened cooperation between
    governments and enterprises, AI technologies/algorithms and professional technologies
    on the AI industry chain. The goal of AI development is to provide enterprises
    with good technologies and product solutions. Technology needs corresponding enterprises
    and user scenarios for verification; algorithms need data and business scenarios
    for continuous optimization. Any country attempting to hinder AI development through
    closure cannot change the public''s demand for AI industry applications and the
    construction of a future intelligent society. Leveraging Shanghai''s policy advantages
    and excellent industrial development environment, Huawei has successively laid
    out innovation centers such as Kunpeng + Ascend, 5G, 5G+XR, and Autonomous Driving
    in Shanghai, jointly promoting AI applications in various industries.


    In terms of using AI, we also have two suggestions for the industry.


