    # RPA+AI, Empowering the Automated Future


    **Bobby Patrick**


    `UiPath` Chief Marketing Officer


    ![](img/txt031_1.jpg "pagenumber_ebook=235,pagenumber_book=219")


    `UiPath` is the world''s fastest-growing and leading Robotic Process Automation
    (`RPA`) and AI software vendor, continuously leading the world into the "Automation
    First Era". As Chief Marketing Officer (`CMO`), responsible for leading the team
    to formulate and execute global marketing strategies, helping enterprises of all
    sizes digitally develop daily business operations, and applying AI to drive true
    digital transformation. Also a technology expert, from `Fortune` 500 companies
    to startups, has been driving significant growth for tech companies for over 20
    years. Formerly served as `CMO` of HP''s multi-billion dollar cloud business,
    responsible for brand internationalization, product marketing, communications,
    and demand generation to achieve the company''s strategic growth requirements;
    served as `CMO` of `Basho`, `GXS` (acquired by `OpenText`), and `Digex` (acquired
    by `Verizon`). Began his career as a computer specialist at the Federal Bureau
    of Investigation at age 16.


    Robotic Process Automation (`RPA`) is becoming the next generation of automation
    empowered by AI.


    `UiPath` dedicated 2010–2012 to perfecting two key technologies: Computer Vision
    and the Designer. Computer Vision allows software robots to "see" the screen like
    humans, with the same precision and resilience; the Designer enables non-technical
    engineers to truly build their own software robots and automate their own tasks.
    The combination of these two technologies created an amazing industry field.


    Today, anyone can learn how to use `RPA` and build their own robots. `UiPath`
    CEO and Co-founder Daniel Dines said: "The potential of automation technology
    is enormous; we believe the powerful force of AI can make it almost omnipotent."


    A few years ago, `UiPath` outlined a vision very similar to Bill Gates'' vision
    in the late 1970s of "a personal computer on every desk and in every home"—that
    is, "a robot for every person". Everyone, whether a knowledge worker or information
    worker, or a production line worker, dispatcher, manufacturing floor worker, or
    retail service personnel, robots can help them complete daily work more intelligently,
    whether the work is simple or complex.


    According to `Gartner` data, the number one technology trend concept in October
    2019 was "Hyperautomation". Automation technology has existed for decades, but
    current hyperautomation is fundamentally different; it is truly about time, value,
    and speed, thereby helping to solve the problem of difficult ROI in enterprise
    digital transformation over the past 5–7 years. `Gartner` identified seven core
    areas of hyperautomation, one centered around AI, another around machine learning
    and modeling. We need to build a built-in platform to achieve the ability to apply
    advanced analytics throughout the entire process, whether on the desktop, in the
    background, or in the cloud. Essentially, this is the current direction of `RPA`
    development.


    In the early days, `RPA` usually revolved around smaller tasks, which could generate
    very high ROI, but were more task-oriented. Today, `RPA` revolves around longer-spanning
    workflows, completed collaboratively by human-attended robots on the workstation
    and unattended robots in the cloud or data center. `RPA` uses process mining to
    identify which specific processes should be automated, making it easier to integrate
    into existing environments.


    The enormous potential of AI will change every industry. Sci-fi writer `Vernor
    Vinge` has a famous quote: "We are on the edge of change comparable to the rise
    of human life on Earth." We have experienced the transition from the technology
    era to the PC era, and now we are truly entering the era of automation and AI.
    One challenge of machine learning today is finding data to apply machine learning
    models and making this process simple.


    In 2020, `RPA` has merged with AI. `Gartner` states that 80% of organizations
    that have deployed `RPA` will introduce AI. The company also states that by 2023,
    90% of large enterprises will deploy some form of `RPA`, and at least 4/5 of enterprises
    will deploy `RPA` at scale, which will truly significantly improve productivity.
    PwC believes: "By 2030, AI''s contribution to the global economy will reach $15.7
    trillion, reaching $6.6 trillion in the 2020s alone."


    The best way to truly apply AI to enterprise or business processes is through
    `RPA`.


    Through `RPA`, robots can perform various tasks humans do on computers: read and
    write databases, transfer data between different systems, log into applications,
    etc. When you apply AI on `RPA`, you start to think about how to truly understand
    content, understand documents, and how to truly help chatbots become more effective.
    Robots no longer just mimic humans; they can help humans focus on thinking about
    operational strategies and enhancing decision-making capabilities.


    AI can automate processes including those with high uncertainty. Most processes
    people execute today are not just querying `SQL` databases; they actually interact
    with different websites, different applications, and different types of images,
    videos, documents with signatures, editable `PDF` documents, and unstructured
    emails. For example, determining if a person is infected with COVID-19 through
    a chest `X-ray`, or inventory management and pricing optimization for retail enterprises,
    and fraud detection, Know Your Customer (KYC), and anti-money laundering in financial
    services. How to transform rule-based processes into experience-based processes?
    This is where AI can truly play a role.


    Our large enterprise clients are applying AI in different ways throughout the
    entire process, transforming rule-based workflows into experience-based workflows,
    driving efficiency improvements, and gaining competitive advantages. AI can help
    realize `RPA` automation, while faster scaling of automation also facilitates
    AI in identifying, determining, and prioritizing processes that bring the greatest
    benefits. Globally, currently only 16% of AI projects have entered production;
    increasing this proportion will be a huge challenge, and we believe the current
    best path is to apply AI models directly to the data streams passing through the
    `RPA` platform.


    In summary, `RPA` is an amazing collection of technologies; its beauty lies in
    the fact that you can get results very quickly. Applying AI can help a process
    shift from rule-based to experience-based, learning continuously over time, with
    benefits that can be sustained long-term. This is why `RPA` has indeed proven
    to be the best path for AI, just as our founder Daniel Dines mentioned earlier:
    this is the best way to create a self-improving company, and the method for enterprises
    to ultimately have the strongest competitiveness in the market and among the most
    intelligent enterprises.


    ---


    # Lighting Up Everyday Life with AI


    **Liu Qingfeng**


    Chairman of iFlytek Co., Ltd.


    ![](img/txt032_1.jpg "pagenumber_ebook=240,pagenumber_book=224")


    Chairman of iFlytek Co., Ltd., Director of the National Engineering Laboratory
    for Speech and Language Information Processing, Part-time Professor and PhD Supervisor
    at the University of Science and Technology of China, Deputy to the 10th, 11th,
    12th, and 13th National People''s Congress, Founding Chairman of the National
    University Student Innovation and Entrepreneurship Alliance, Chairman of the China
    Speech Industry Alliance.


    ![](img/txt032_2.jpg "pagenumber_ebook=241,pagenumber_book=225")


    During the critical period of the fight against the epidemic, AI played an irreplaceable
    role, and practice has proven that solving essential social needs is the key driver
    for the large-scale application of AI.


    After the epidemic, the whole population has been pushed into the era of digital
    survival; in the future, a lifestyle combining online and offline will become
    the norm. Therefore, whether it is epidemic prevention and control, future production
    and life, or phased or long-term digital survival, using AI to light up everyday
    life is not only an extremely attractive and appealing picture, but also a future
    trend we must face.


    ## AI Solves Essential Social Needs, Technology Makes Cities Warmer


    ![](img/txt032_3.jpg "pagenumber_ebook=242,pagenumber_book=226")


    Currently, AI has developed from the innovation period of core technical algorithms
    to the breakthrough period of typical industry pilot applications, and has begun
    to enter the stage of large-scale application. At this stage, the key lies in
    whether AI can solve essential social needs and play a better, larger-scale role.


    During the epidemic, the workload of epidemic prevention screening was so huge
    that relying on traditional community staff and medical personnel to conduct door-to-door
    investigations or manual phone calls was almost impossible to complete. Using
    phone robots to call residents, send text messages, publicize prevention and control
    knowledge related to COVID-19, and conduct follow-ups on key groups could improve
    the notification and follow-up efficiency of medical staff while reducing the
    risk of door-to-door communication by medical staff.


    Besides healthcare, AI application in the education field was rapidly advanced
    during the epidemic. "AI + Education" helped ensure "classes suspended but learning
    continues". In the future, combined online and offline teaching will become the
    new normal; famous teachers can teach more children online; using AI to automatically
    correct compositions and recommend knowledge graphs in subjects like math, physics,
    and chemistry allows children to get more attention from teachers in online classes...
    So, AI lighting up everyday life will benefit everyone''s learning and life.


    AI can not only be used to fight the epidemic, but is also an important driving
    force for supporting the resumption of work and production. As the epidemic gradually
    improves, this driving force has not disappeared, but has broader development
    space.


    In the judicial field, the application of AI technology to judicial-related entities
    such as public security, procuratorates, courts, and political and legal committees
    helps improve the intelligence level of the judicial system. AI technology greatly
    improves the case-handling efficiency of frontline police officers through functions
    such as automatic transcript generation, retrieval of relevant data, flaw monitoring,
    and full-process recording. During the 2020 "Two Sessions", the `Civil Code` was
    promulgated; the day after the "Two Sessions" ended, the `Civil Code` WeChat Mini
    Program "Civil Code Know-How" jointly developed by `Procuratorial Daily` and iFlytek
    was officially launched. This mini-program aims to create an integrated legal
    platform in the field of the `Civil Code` that combines theoretical interpretation,
    knowledge explanation, interactive consultation, training, and other content,
    as well as a connector and display platform for civil procuratorial work, greatly
    facilitating the implementation of the `Civil Code`.


    In the field of smart cities, facing the pressure brought by the aging population
    on urban development in recent years, we can analyze data such as water, electricity,
    gas, community, and property videos through AI; once an abnormality is detected,
    AI phone robots automatically call the elderly, their relatives, and community
    staff, reflecting the warmth of the smart city. In barrier-free applications,
    AI allows the blind to "hear" text, the deaf to "see" sound, makes information
    communication barrier-free, and promotes the progress of the whole society.


    ## Five Key Innovation Points in AI Development


