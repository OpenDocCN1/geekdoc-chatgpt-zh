    # AI Innovation in the 5G Era


    **Yaozhuang Hong (John Allen Hoffman)**


    Chief Executive Officer, Global System for Mobile Communications Association (GSMA)


    ![](img/txt041_1.jpg "pagenumber_ebook=288,pagenumber_book=272")


    GSMA Ltd is a wholly-owned subsidiary of the GSMA, the world''s largest wireless
    communications trade association. As CEO and Director of GSMA Ltd, he oversees
    the effective operation of the company''s multiple businesses, including GSMA''s
    award-winning industry events, online media, print and broadcast media, industry
    research, and a range of managed services. He has been engaged in the global wireless
    communications industry for over 25 years. Prior to joining GSMA Ltd, he served
    as CEO of Fastmobile, a provider of software-based carrier solutions, and before
    that as President and CEO of Roamware, a provider of voice and data roaming solutions.


    ![](img/txt041_2.jpg "pagenumber_ebook=289,pagenumber_book=273")


    There are currently 5.2 billion mobile subscribers globally, and the industry
    contributed $4.1 trillion to the global economy in 2019; by 2025, 5G connections
    will reach 1.8 billion; by 2030, AI will contribute $16 trillion to the global
    economy and drive 26% growth in local economies. GSMA represents 750 mobile operators
    and 400 companies in the broader ecosystem.


    ## 2019: A Pivotal Year for 5G


    2019 was crucial for 5G. Many operators actively upgraded infrastructure to meet
    5G needs; they were willing to invest heavily in infrastructure because they saw
    the massive opportunities 5G brings. Consumers also recognized the benefits of
    5G; consumers in China, South Korea, and the Middle East were very willing to
    upgrade to 5G. By the end of Q2 2020, 87 operators had launched commercial 5G
    services in 39 markets. By 2025, 5G connections will account for 20% of total
    global connections. Operators in Asia, North America, and Europe will invest $1.1
    trillion in the next 5 years, 80% of which will go to 5G networks. These are all
    positive signals because in the AI era, 5G is the foundation.


    ## Asia-Pacific Leads 5G Deployment


    The Asia-Pacific region has always been a leader in 5G deployment, with 9 markets
    already commercially deployed and 12 more announcing commercial plans. Mobile
    operators in Asia-Pacific are expected to invest $500 billion in telecom infrastructure
    over the next 5 years, of which $370 billion will be for 5G. By 2025, 5G connections
    in Asia-Pacific will reach 1.1 billion, accounting for 23% of total regional connections.
    In some Asia-Pacific countries, both governments and enterprises believe digitalization
    is the priority. Although the rollout and construction of new technologies including
    5G may be delayed due to the pandemic impact, this is only a short-term effect.
    Governments and operators believe 5G will accelerate AI development faster, so
    they will spare no effort in 5G construction.


    ## China''s Massive Investment in 5G and AI


    The Chinese government and enterprises have made massive investments in 5G and
    AI. Beijing and Shanghai have promoted city venture capital projects worth billions
    of dollars, and there are a growing number of AI companies in tech parks. China
    has more data and connections than other countries; since AI relies on big data
    for greater precision, China undoubtedly stands to benefit most from new applications.
    China has a huge population, more AI use cases than other countries, and good
    market prospects, allowing for faster testing. Excellent companies like Baidu,
    Tencent, and Alibaba have huge investments in 5G and AI, and other private enterprises
    are continuously investing to support the industry''s development. It is certain
    we will have an AI+5G world, and our imagination will become reality.


    ## GSMA''s Work in China


    What specifically does GSMA do in China? First, securing key spectrum resources
    for operators is crucial. We assist and look forward to the government allocating
    mmWave spectrum to Chinese mobile operators at the appropriate time to drive the
    comprehensive development of 5G in China. GSMA has also released AI case studies
    and 5G development strategies to help Chinese enterprises. GSMA members have supported
    China State Grid''s smart grid projects, China Mobile''s edge computing and cloud
    computing projects, connecting frontline manufacturers with the entire industry
    ecosystem. Some new technologies, such as open interface standards, are very important
    for building a secure supply chain; 5G can meet such needs of different vertical
    industries. 5G can also help vertical industries like aviation launch new services
    using AR/VR. The media and entertainment industry will also undergo huge changes
    due to 5G, which can provide high-definition video services across regions. GSMA
    has provided network slicing templates and continuously works on network slicing
    integration, hoping to deliver superior entertainment experiences through this
    guidance and support.


    ## GSMA Strengthens Industry-Academia-Research Collaboration in AI


    GSMA has also strengthened collaboration between industry and academia in AI.
    For example, GSMA jointly developed AI courses with the University of California,
    Berkeley, enabling students to develop new use cases, hoping to generate successful
    5G applications. China Unicom also participated; they have new projects in 5G
    and IoT, such as drones, COVID-19 response, 5G coverage, and emergency plans.
    In addition, GSMA cooperates with a UK AI research institution to help mobile
    operators better apply AI. GSMA also collaborates with the UK''s University of
    Oxford, University of Cambridge, and University College London, focusing on areas
    including energy, network optimization, 5G use cases, IoT, vertical industries,
    and cybersecurity. The integration of 5G with other vertical industries will create
    unprecedented scenarios, especially in agriculture, where 5G can help farmers
    better analyze crop growth, pest control, etc., saving pesticides and fertilizers,
    and achieving green sustainable agricultural development. In transportation, 5G
    can better promote smart city development and provide better solutions in emergency
    services.


    ## Policy Appeals and Vision


    5G will drive the development of AI, big data, and IoT, so we hope all governments
    can support the development of the mobile industry, reduce corresponding tax burdens,
    and provide more policy support. The combination of cloud computing and edge computing
    will create more use cases for enterprises.


    In 2020, 5G technology is changing the way we live and work. GSMA''s vision is
    to unleash the power of connectivity so that society can continue to prosper and
    develop. We must take a step forward to drive connectivity under AI!


