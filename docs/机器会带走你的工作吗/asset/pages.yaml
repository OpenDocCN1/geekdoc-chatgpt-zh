- pgno: 103
  md: '# 第三章 欢迎来到“铁锈地带”


    一个接一个的工业变革正在经历着戏剧化的变革过程，然而所有的结局都是一样的——更为便捷、价廉（通常会是免费服务），以及更少的工作。但是，这一过程才刚刚开始。如果深信这种戏剧性的变革会发生在我们之后，那就过于天真了。我们正处于这种变革的起点，而对于正在发生的变革的中心，其影响却纯粹而深远，有朝一日，我们将把那些原本由人承担的工作交给机器。


    在某一层面上，这种替代是科技的永恒传说。车轮、杠杆、滑轮，农业机械中的铲子和犁，使得我们人类可以做出那些数千年前没有这些机器时难以做到的事情；而与此同时，我们从事这样的工作时却只需要更少的人。这其中的关键点在于科技在不断进步——并且是以飞快的速度进步。在更为根本的层面上，我们正在不断地将劳动力因素从价值创造中移出，这一点在我们前面论述的一些例子'
  merge: -1
  img_proc: true
- pgno: 104
  md: '中已经非常明显。我们曾经需要依靠富有技能和经验的接待员为我们预定机票，但现在我们几乎都是自己在智能手机上完成操作，而且我们自己所做的远比接待员所能做的更为复杂。我刚刚给自己预定了一张飞往西雅图的机票，去看望女儿。在预定过程中，我发现了不同航班的低价日期和时间，从中又挑选出了可能的行程，然后再决定是用里程数还是现金去支付，我在五段航线上分别选择了自己喜好的座位，最后输入了我的信用卡号码。这里的重点是，整个过程没有旁人参与。电脑已经设定好程序来帮助我从数据中做出筛选，其中涉及四家公司——包括Travelocity，美联航，Visa和花旗银行——由它们之间自行联系决算。它们之间的沟通是通过互联网，并进行了大量复杂的后台操作，而我只需要通过手机上的几个按键就能获得回应。这一切发生时，我一直躺在床上。


    还有一点值得注意的是，新价值类型的出现，它们往往不需要或者很少需要人力的介入。种类繁多的数字商品，可以为大量的消费者带来价值，然后却根本不需要发生多少雇佣。其中最显著的就是社交传媒，通过服务性总'
