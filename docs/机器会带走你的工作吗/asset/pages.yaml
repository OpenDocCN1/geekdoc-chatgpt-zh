  md: '生更好地为二十世纪的劳动力市场做好准备。那么二十一世纪会如何呢？我们应当认真反思我们的课程，同时我们也并不能提供一种解决方案，这一点看上去去对人类学和自由艺术是一个非常好的消息，它们会在对工作作准备的同时，也对生活给予很多指导；但是在对未来发展更具认知的情况下，我们对技术的接触，尤其是对智能机器的接触，这些将会不断地填充到我们智人的工作和休闲生活中来。作为开始，我们也许可以用文学和电影开设“科学幻想”研究，并将其置于教育的核心位置，以此来刺激课程的发展。


