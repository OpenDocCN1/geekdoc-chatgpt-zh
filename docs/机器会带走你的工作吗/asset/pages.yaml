    万匹马的帮助下劳作。今天，美国在农业领域受雇的劳动者已经降到了总人口的约 1%，但结果并没有导致大量的失业。大量的新工作最终出现了，那些农业劳动者在工业经济起飞后重新就业；同时，当新的机会出现时，他们便获得了新的技能。但对于马却不是这样的，随着农业机械化，马力劳动不再被需要了。新机器正是被设计用来——用萨默斯的话说——“做马力劳动之前所做的事情”，而马却只适合留在废马屠宰场的后院里。


