- pgno: 137
  md: '正如本书此前建议的那样，既然我们不知道将要发生什么，那么我们就需要向自己提两个基本问题。第一，基于常规假设，我们认为新的工作会出现，并替代那些被机器夺走的工作，那么在此过程中我们预期劳动市场上会发生何种风暴呢？第二，认为严重的工作损失不能被新工作所替代的想法，仅仅是无稽之谈？还是可能恰恰是严峻的现实？


    请注意，这两个问题都没有假设大卫·亚瑟（David Author, 2015）所说的大规模失业的“反乌托邦（dystopia）”观点。第一个问题假设随着人工智能高级应用的推出，劳动力市场将受到重大影响。这种观点较为被大众所接受，即便是
    OECD 仅提出的 9% 低数值（查尔斯·默里提出），也会带来巨大影响，因此“铁锈地带”的景象可以预见会发生在若干经济部门，在那里，我们所谓的“非人力资源”将开始被运用。


    第二个问题假设是在危机中讨论“异化”（dystopic）


    ①编者注：反乌托邦（Dystopia）又被译作“反靠乌托邦”“敌托邦”或“废托邦”，是指与乌托邦相对的，充满丑恶与不幸之地。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 机器会夺走你的工作吗


    # Will Robots Take Your Job


    的劳动市场景象。至少在中短期内，无法阻止一场大崩盘的可能性有多大？这种凯恩斯主义的假设在如今有着不断增长的受众，为人们敲响了警钟。它所建议的是，在即将到来的由技术创新带来的下一轮劳动系统瓦解，会包含着不断深刻的生产力要素重塑，从而排除人类劳动——先是从一些方面，然后是许多方面，直到大多数方面。但是这种疑问并未聚焦在我们所提出的问题上，回答究竟会发生什么（对此存在众多见解），而是只提出了可能发生这一危机。


    既然未来在各个维度上都是不确定的，那么组织的战略部门就应该制订“战略计划”并探究危机以努力管控其不确定性。例如X会在多大程度上发生？以及如果X发生了，将会带来何种影响？首要任务是量化风险（多大程度）继而推理其潜在影响（影响多大）。其次是制定战略，最大限度降低X发生的可能性，如果无论如何我们如何努力，它必将发生的话，最后还需要考虑如何有效限制X带来的影响。这一事例适用于所有可产生显著影响的风险，漠视风险而不作考虑的后果是不可想象的。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '当然，在组织框架下，风险评估和风险管理较为复杂，因为在应对 X 出现的可能性的同时，需要考虑如何减少在其他方面造成的损害，我们并不希望为了治愈“疾病”而导致更糟的结果。这也是那些对努力制订计划应对
    X 可能性持批判态度者的部分动机。他们辩解称对创新带来的潜在影响提出质疑，会使得创新的革命性大打折扣并降低其成功率。这种处理指数级驱动的技术变化的观点，看上去就过于天真了。


    正如麻省理工学院经济学院大卫·亚瑟（David Autor，2015）曾指出的，反对他所谓的“最近关于人机替代的悲观预言”的批评者，他们通常无法解决他们论点的含义，即如果事情真变成那样，“那么我们的主要经济问题将是分配问题，而不是稀缺性”。此处值得注意的是，这一观点直接从经济领域跨越到了政策领域。如果除却最让人乐观的情景，这种讨论的正面意义在于，它明确指出经济中的分配问题将不可避免，资本将在其中扮演更重要的角色，而劳动力则会越发式微。


    小心地回应前述提出的两个基本问题，会引导我们进'
  merge: -1
