- pgno: 140
  md: '人具有共识基础上的谨慎规划，无论是从个体、组织层面，还是在各国政府层面。每个人都知道我们的前路充满了崩塌瓦解，但我们也只能谨慎对待，未雨绸缪。然而这一发展的时间线最难以预测，也许这种干扰已然到来。牛津大学的研究对这一进程的预见也许太过暧昧，但也说到可能是在未来“十年或二十年”。


    那我们该如何准备呢？


    # 公共动员


    最近我被一位政府顾问问道，我们该做些什么呢？我的第一回应是，我们的领导人必须为我们厘清问题所在。

    在这个星球上的任何地方，迄今为止我们还尚未从一位国际社会的主要政治领导人那里，听到有关未来劳动危机的讲话。而最近也只是在偶然的场合下，有人提到过工人们应当从“新经济”的科技发展中获得公平的利益分享（美国前总统奥巴马在其最后的白宫离任演讲中，曾经围绕这一点提出了若干倡议）。但是，这样会带来对问题的误解。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '公司可以通过科技发展更多地榨取工人，纵然这一点无可厚非；但这本身就是一个渐进的过程。问题的焦点不在于工人是否从机器带来的生产力升级中分享到收益，而在于工人是否还能是工人。


    因此，政府领导人的首要责任在于明确这些问题，并根据问题的严重性和紧迫性进行分级。然而，领导人可能面临的难题在于，这些问题的排列可能与他们已有的政策时间表不相匹配——任何人的政策，至少是主流领导人的时间表。特别是在转型过程中，领导人明确而且是正确地明确问题就尤为必要。接下来的是在何种情形下，我们可以期待从二十世纪继承而来的产业经济会发生根本性转变，在未来的经济中其结构可能出现向十八世纪或十九世纪时期的倒退。这种结构变化将是全方位的变化，因为“充分就业”已经随时代而去了。正如我们现在已经习以为常的，人们变换工作越来越频繁，在这种背景下，在一家公司终身就职的情形已经过时；那么未来任何人想要全职工作，也可能会成为历史。我们将走向全球性的“铁锈地带”，工人们的各项技能无法找到足够多的可获得报酬'
  merge: -1
  img_proc: true
- pgno: 142
  md: '的工作机会（工作的消失）。因为如前所述，我们发现与我们自身竞争的是其他物种，是机器类物种，它们使用廉价，而且能够不断进化得更聪明。


    因此，我们需要领导人能建构讨论的框架，并在各自选区做好准备，警醒选民，同时也教育选民。因为即将到来的情形既可以被认为是一种危机，也可能表现为一种无与伦比的机遇。


    但问题的部分原因在于如何将巨大的挑战置于可识别的日程中。劳工领袖们之所以不愿参与讨论——人们可能认为他们显然是工会的旗手——原因之一在于他们在反对创新和抵制技术方面的犹豫不决。不仅仅是因为他们惧怕被贴标签指为勒德分子，而且还在于过去转型所留下的经验表明，转型的过程虽然充满痛苦，但最终却带来了经济的繁荣，并增加了就业机会。他们认为不大肆加入将新技术所描绘的令人恐惧并强迫人们抵制新技术的议论，事实上反而可能是有益的。


    选择这条路，或者是另一条路，我们有必要使公众了解我们正在讨论的这一问题，作为对未来作出成熟的个人'
  merge: -1
