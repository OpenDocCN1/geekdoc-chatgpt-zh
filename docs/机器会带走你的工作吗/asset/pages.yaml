- pgno: 81
  md: 虽然对于未来尚不知晓，但是智慧地估计将要发生的事情，对于我们当下的决策至关重要。人们不愿意探讨科技对就业的潜在影响，一个主要原因是他们不希望被贴上“勒德分子”的标签。这很容易去指责或者威胁人们在技术发展之前不要去谈论。我在序中提到，一些公共知识分子开始质疑传统智慧观点，他们中就有美国前财务部部长、哈佛大学校长拉里·萨默斯。既然他首先提出了“勒德”问题，那就用他的言论作为本章的精彩起点吧！
  merge: -1
  img_proc: true
- pgno: 82
  md: '二十世纪七十年代，当我还是麻省理工学院本科生的时候，作为一名年轻的经济学学生便被置于自动化的议论中。当时存在有两大派系：一派是愚蠢的勒德分子，他们大部分置身于经济学系之外；另一派则是聪明的进步派……勒德分子认为自动化将会使所有的工作都消失，这将使得人们没有工作可做。


    ——拉里·萨默斯（2013）'
  merge: -1
  img_proc: true
- pgno: 83
  md: 在科技鼓吹者中，正在滋长着针对批评者的敏感——对于任何批评——在任何地方都是主导性的：我们已经从历史中学习了各种灾难——从下沉的泰坦尼克到转基因的惨败，再到
    2008 年华尔街的崩溃——令人沮丧的批判性想法总是夸大危机。事情越大，风险就越大。即便是左派政治家和劳工领袖也不愿涉足这些讨论，因为他们都怕被贴上勒德分子的标签。科技鼓吹者正使得那些必须单独被讨论的事情，变得越来越难以言说。换言之，其实他们并不是真正意义上上自以为是的技术之友——特别是从长期来看。尽早参与到潜在问题中，是确保成功的关键，其中重要的是给予不和谐的声音以话语的空间。从反应停（沙利度胺）到“疯牛”病，从吸烟到“转基因”生物体，我们早已见识到消失了早期批评后，留给世人的只有更具伤害的后果。
  merge: -1
