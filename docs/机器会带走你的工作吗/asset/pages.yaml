  md: '# 序


    用一本小书来讨论一个复杂而又富有争议的话题，其实是很危险的。但是，我们在这里提出的问题，将科学、技术及社会各方面汇聚于一点，这些问题关乎我们每一个人，也是我们所无法回避的。


    我关注未来工作的问题已经很多年了，以往，我们所做的努力是召集决策人及其他领导者进行讨论。然而直到过去三四年，并没有谁准备好去说点什么；尽管最近社会上掀起了一场讨论，至少是在公共生活边界的讨论[
