- pgno: 92
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    只是一种特殊的表述。对于最初的那几格，稻谷的数量在增加，但是尚可想象：1, 2, 4, 8, 16, 32，直到 64。但是当我们的棋盘过半〔这一词语来自发明家和未来学家雷·库兹维尔（Ray
    Kurzweil）2000 年的观点〕，每增加一格的变化都将是巨大无比。此刻我们正处于计算机时代的半世纪途中——根据摩尔法则——我们应当预见的每年的变化率将会逐年指数级变大。


    # 新常态的谬论


    然而，这不是我们日常看事物的方式。我们知道变化会发生得很快，而且变化是加速发生的。但是我们该怎么办？二十世纪最具影响力的著作之一，当属阿尔文·托夫勒（Alvin
    Toffler）于 1977 年发表的《未来的冲击》（Future Shock）。题目的缘起来自人们经历过的“文化的冲击”，当时人们在不同的文化中流动。托夫勒的观点是，未来更像另一种文化，并且向未来快速转变并不容易。


    这里回应前文就很有趣，即使是过去，变化发生得如'
  merge: -1
  img_proc: true
- pgno: 93
  md: '此之慢，人们也注意到我们是很难应对的，变化从来都不是易事。虽然我们实际上比我们预期的适应得更好，我们所预计的能够很好适应，但是我们同时会发现，展望未来去想象持续不断的、快速的、令人不安的变化，却尤为困难。我们往往会回首往事，为自己成功挺过昨天的变化而松一口气。所以当我们向前眺望时，我们期待明天会重复今天的轨迹。


    试想这一过程是我们正处的上升旅途。我们回看过去，会发现把我们带到现在位置的曲线，升起得是多么快速和陡峭。而当我们展望未来，我们所能想象的曲线却非常和缓。我们将曲线打个结，然后再拉直。未来之线还在上升，只是越来越缓。我们只是没有想象到，曾带我们至此的变化之快速，还将继续——更别说速度还会更快了。我们已经为自己建起了“新常态”，作为明天的基线。


    让我们再看看棋盘上堆积稻谷的例子，如果我们真想在前面，那么将来发展的曲线放缓恰恰与现实相反。它只会更为陡斜，越来越陡峭地发展下去。当你我生活中还有一些方面远没有受到数字化影响时（烹饪、运动、气'
  merge: -1
  img_proc: true
- pgno: 94
  md: '象 ), 任何受到电脑力量影响的事物都会推拉曲线。想想看养育我们的这个世界——在地图变成 GPS 之前，电报未被短信取代之前，以及大百科全书在谷歌问世之前。尝试坐下来列一个清单，看看哪些事情你是用手机完成的，而这些事情曾经要想去完成，需要你购买许多
    CD 光盘，然后花费一整夜的时间去写支票。而未来的变化会越来越快，越来越巨大，如果我们拒绝承认这一切，那只是我们不这么想而已。


    我们都倾向于认为，未来会一帆风顺。科技的发展将会带给生活更多的便利和乐趣，但绝不会威胁我们现在认为理所应当的常态。当然，对于劳动市场的挑战绝非根本上唯一的威胁。同样影响深远的，也同样受到科技力量驱使的，还有事物之间网络化的意义——在这个世界上，任何物体都将联系起来——而黑客也就可以取相同之道，侵入我们的车子和房屋，然后将它们占为己有，这些和他们过去用来窃取我们的信用卡信息的手法毫无两样。但是我们人类倾向于更愿意关注好的信息，而政治领导者的思想动员员也是这样做的，无论是左派、右派还是中间派。有一'
  merge: -1
  img_proc: true
- pgno: 95
  md: '种观点认为，他们的选民有可能会有诉求（appealing）。但民主的短期化特征决定了其本身于事无补——如果你的工作是在线两年或者四年，那么有什么理由会使你愿意让自己因为那些未来二十年的可怕故事而变得不受欢迎呢？当然，领袖的挑战在于从长远来框定这些问题，并让人们在思想上对变化有所准备。


    在每个人的人生漫步中，我们都会遇到相同的趋势；即使是商业领袖——以及科技大师——也不能置身事外。令人倍感鼓舞的是伟大的商业领袖们——CE 的杰克·韦尔奇（Jack
    Welch）就经常被视为最佳的例子——当需要对日常的股票价格波动问责，并且每个季度需要回应分析师和投资人的盈利要求时，是绝不可能预想未来的几十年而构建成伟大的公司的。而正是这种富有远见的领袖气质，是时下每个全球化领袖所必须具备的，特别是当我们正在爬越摩尔定律曲线上最为陡峭的那段。时间的流逝已经让全球领袖们对科学家们所预见的气候变化负责，而这恰恰突出了过程的困难。而他们未能解决抗生素的未来威胁这一同样重要的问题，则为我们提供了相同问题上的又'
