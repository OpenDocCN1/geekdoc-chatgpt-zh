- pgno: 110
  md: '技术”的终极典范——它会对经济整体都产生影响。蒸汽动力，之后是电力，对一个一个产业都带来变化，并将影响逐次传导至整个西方经济。然而这种影响仅仅是对深具潜力的机器智能的初步应用，其实它会威胁并摧毁人类千百年来在各个就业领域中的角色。


    美国中西部钢铁厂区或者南威尔士矿业小镇所经历过的社会重创，也正是由于这些地区单一依赖某种集中性产业而出现的。当这一产业日落西山时，整个地区的经济也将随之坍塌。正因如此，底特律曾被描述为公司之城，而现在正在运营的公司一家也没有了。在导致前述地区经济瓦解的因素中，其地方性特征加剧了该地区人们的窘境，也使别的地区无法关注到该地区的情况。与此同时，这种地方性特征也便于政府做出补救干预，不过这些政府却急于对该地区的专业劳动力进行再培训，因为他们的价值（raison
    d’être）已经发挥殆尽了。


    在机器智能革命的情形下，我们所面对的崩溃可以从过往的经验中得以映射，但是我们所面临的威胁却远比以往任何时候更广泛。机器智能革命的影响不会受限于地理'
  merge: -1
  img_proc: true
- pgno: 111
  md: '限制，也不会止步于某一产业。这是基于两点原因：部分因为工作岗位直接从人工转作机器作业会导致经济生活中各个领域的岗位消失——卡车司机下岗，收银员、私人银行家、法律研究员、大学老师、电话营销员、会计师下岗……另外一部分原因在于，很多情形下这些机器智能的新应用，其影响会极速传导并导致更多就业岗位的间接消失，而这种间接影响也不受地理局限，这与之前当钢铁城市或煤矿村镇破产后，导致当地商业也关门大吉的地域局限性是不同的。这一事实应当有助于政策制定者提高重视，因为他们了解过往产业消退后将政策实施的重点集中在某一地区的经验，也因为过去的政策应对过于强调对非技术或半技术体力劳动者的关注。即将到来的就业体系崩溃表明，将会出现更为困难的政策环境，因为机器智能的影响会切人每个劳动者的经济和社会生活舒适度，而无关乎他们自身在政治党派上的倾向。


    自动驾驶汽车给我们提供了最明显的例证，因为它们的影响已经引发了最深刻的反思；同时我们注意到它们已经在商业上应用，即便是在非常有限的情景下。正如本书'
