- pgno: 30
  md: '的转型过程中，我们可以预见劳动力市场会发生怎样的动荡呢？第二，认为（机器换人将会产生）大量失业却无法获得新工作进行弥补的想法，到底是一种荒谬的想法，还是很可能发生的未来？


    尽管一些学术讨论偶尔会有来自科技界和其他方面的意见领袖参与其中，但尚无证据表明政府对这些问题已经严阵以待。坦白说，如果对于问题一的答案是，“劳动力市场不会太过动荡”；同时，对于问题二的答案是，“是的，净损失大量工作岗位的这种想法简直荒谬至极”，那么我们的确不必担心。而本书的观点是，虽然这些假设充满善意并令人安慰，但它们毫无道理可言。并且，这些假设暗藏危险，因为它们错误地估计了我们将要面临的风险。


    但是，我们应该如何应对机器替代工作呢？当我们个人“并不知道”，同时事实上这个问题其实颇为复杂时，一种方法是，看看是否有已经表达出他们自身想法的聪明人——在这个过程中，假若有，就为我们打开了一扇窗，'
