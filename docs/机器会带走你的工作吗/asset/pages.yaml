  md: '前繁荣。当我们进入诺伯特·维纳（Norbert Wiener）① 令人印象深刻的“奴隶经济”（slave economy）中时，或许新的科技物种发展的步伐和复杂性，渐渐地留给我们可做的工作将所剩无几。随着生产价值过程中劳动的重要性逐渐衰退，经济权力向资本所有者戏剧化地倒向，这将会考验我们民主社会的能力，并可能产生各种新的分配模式。它也可能会引领我们进入一个前所未见的情景之中，那种被凯恩斯描述为“新有闲阶级”的出现，也会带给我们人类社会根本上的挑战，正如我们的时间从那些行为中解放出来，而不再与挣取我们每日的面包相关。


    当然，这也许只是一种夸张，或者仅仅是对遥远未来的事物的一种描述。但有一点似乎很明显，即使是以严谨的态度来看，当“铁锈地带”的结构性失业冲击那些建立在技术基础上的顶端和底部的职业，劳动力市场将会面临动荡；而且我们相信，新的工作出现后会迫使工人去适应


    ① 诺伯特·维纳很早就对人类和计算机器之间的关系提出了警告。他指出，无论我们认为自动机器有没有感觉，它都是经济上的奴隶劳动。而与奴隶劳动竞争的劳动，必须接受奴隶劳动的经济条件。'
