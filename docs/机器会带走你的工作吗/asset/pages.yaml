- pgno: 28
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    传统观点认为我们无须担心，并且一些技术支持者为此大声疾呼。与此同时，有一些著名的思想者——包括过去一百年内最具影响力的经济学家约翰·梅纳德·凯恩斯（John
    Maynard Keynes）和著名的“控制论之父”诺伯特·维纳（Norbert Wiener），他们都曾经指出，机器智能化的崛起将极有可能导致人类就业的崩溃。截至目前，以我们对新技术的经验来看，过去确实如此，新技术可能导致对个人乃至对工业的破坏，但同时它们也带来新的工作——更重要的是会产生更多的财富。但是，我们最新的发明——这些由人工智能所驱动的，专门设计用来执行各种至今一直是由我们人类所从事的工作任务的机器——仍会是这样吗？


    当然，这场争论里并不仅仅只有简单的两种观点，而是各种各样的。一些人预测在未来的几十年中，大部分的人类工作将会消失。而在另一个极端，有些人甚至指责所有提出了阻碍技术进步的问题的人表现得像个勒德分子。在两者之间存在的、有理由的期待是，即使新工作层出不穷，能够取代那些机器替换掉的工作，这种破坏仍将会如'
