    2025 年，网络化的、自动化的人工智能应用程序和机器人设备，已经取代的工作数量会比它们创造的新工作多”。对这个问题的应答者超过 2000 人，其中有 48%
    的人赞成这一预设，52% 的应答者则不这么认为。


