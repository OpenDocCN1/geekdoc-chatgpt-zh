    代……比如，洗碗工所需的低程度的社会智能，使得这一

    职业比公共关系专家更容易受到计算机化的影响。


    他们的研究方法是依据对既有工作的评估，评价其对

    工作外包的敏感性。他们的结论是，大约 47% 的美国雇员'
