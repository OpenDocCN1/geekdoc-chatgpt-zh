- pgno: 49
  md: '同时也提出，新工作是否会随着旧工作被取代而自然出现。但在开始议论前，首先让我们抽样一些关键的领域和职业，因为这些领域和职业已经开始受到影响，正在从人类劳动变成机器在认真工作。在某些情况下，我们会议论已经被使用的技术，而这时其他的技术应用也即将到来。还在角落中观察这些景象都不完全是一个好事情。在佩尤研究中心的一份研究中，他们提供了尖锐的例子，揭示出普遍存在的“专家”不确定性的原因；而在弗雷和奥斯本和
    OECD 的报告中，则鲜明地描述了这些具体工作的特征。


    我们从最著名、最引人注目的例子开始，即自动驾驶汽车（autonomous vehicles）。之后我们会更简单地分析其他就业领域的情况。最后，我们再小心谨慎地去展望，看看那些在直觉上被认为是“以人为中心”的职业，因而也是“更安全”的职业，其实际上也正在面临威胁。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 自动驾驶车辆


    优步（Uber）抓住了商用车应用的主动权，而谷歌的发展更是吸引了全世界的想象，19 辆自动驾驶汽车正在加州的公共道路上行驶。不太为人所知的是，与谷歌同时期，世界上所有主要的汽车公司都在做同样的工作，从所谓的“互联汽车”开始，包括发展先进的电子技术，从而帮助驾驶员驾驶车辆，并与公司的数据库连接（CB
    Insights, 2016）。它们中的一些模式是过渡型的，本质上是实验性的，可能很快就会过时；而另一些模式则是能够在实现完全自动化的过程中，通过连续不断地更新软件以及可能的硬件，实现长远发展。我们中很少有人知道汽车在多大程度上已经变成了轮子上的电脑。举个例子，福特F150很难说是最迷人或看上去是高科技的汽车，可其却安装有
    15 亿条代码（Saracco, 2016）。


    这一情形也出现在我们早已习惯的现有系统上，其中 ABS（防抱死）刹车可能是最有趣的。在危险情况下，'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'ABS 系统基本上会超越驾驶员的指令，自行决定刹车。事实上，我们的汽车已经开始自动驾驶了。


    围绕这一争论的一大不确定性，是自动驾驶汽车的未来是发生在底特律，还是硅谷和西海岸科技地区。我们笨拙地来判断一下，关于以底特律模式为典型的、在现有汽车上应用数字设备的方式，传统汽车制造商们还保持着自信，他们相信自己的业务和技术尚不会被硅谷所取代。举一个适当的例子：我最近开的车是一辆租的凯迪拉克
    SUV（Cadillac SUV），它安装的视觉显示屏显示我的车速是标准速度的三倍，我认为更加高级的是车辆还有两块独立的数字显示屏在做同样的事，再加上一个大的、彩色的字体，告诉我剩余的油的比例，然后你就能注意到重点。平头的中间部位安装有一个屏幕来控制倒车，汽车的后置倒车摄像头也是一个优点（也许是数字时代唯一明显的变化），尽管不清楚是否比使用同样的屏幕来设置暖气控制更好（开车时比传统的旋钮更难控制，如果不算是彻头彻尾的危险的话），这里本身就是一个好问题。


    谷歌汽车当然获得了大众的关注，不过在美国西海岸'
  merge: -1
  img_proc: true
- pgno: 52
  md: '也有传言称苹果正在开发一个项目，而特斯拉则以其创新的高端电动汽车做出了大胆的声明。特斯拉汽车已经可以在高速公路上以半自动模式行驶——司机们应该保持警惕，并做好被取代的准备。到
    2018 年，软件更新将使它们在无人驾驶模式下能够在美国全国范围内开车，从一个海岸到另一个海岸。在欧洲的汽车公司中，沃尔沃宣称到 2020 年该品牌的汽车将是“无事故”的，他们雄心勃勃的目标是该品牌汽车不伤害他们的用户。而考虑到沃尔沃在安全方面的传统声誉，这是一种专注于发展的有趣方式——不是冒险，而是在加强使其成名的因素。大众汽车（Volkswagen）持有斯堪尼亚（Scania）的主要股权。斯堪尼亚正在开发一种名为“排进”（platooning）的概念，在这种概念中，一系列在近距离护航下行驶的卡车，会始终由领头车辆控制，如同一列火车受到控制一样。印度巨头塔塔已经展示了自动泊车技术，而丰田则已经在麻省理工学院和斯坦福大学研究中心投资（Hoge,
    2016）。


    与此同时，优步在为无人驾驶出租车市场（这一市场在很大程度上还是未知的）做准备，并已经处于领'
  merge: -1
  img_proc: true
- pgno: 53
  md: '先地位。优步最近从卡内基梅隆大学（Carnegie Mellon University）聘请了一批实验室人工智能研究人员（据报道有 40 人）。正如我们已经注意到的那样。来帮助优步，在匹兹堡推出一项服务，这是一个绝妙的主意。很明显，整个交通经济开始被可以预见的一种基于服务（而非所有权）的自动使用模式所颠覆，这些人正计划建立自己的商业模式。我们点击优步的应用，在很短的时间内就会出现一辆无人驾驶的优步出租车。事实上已经出现了一些有趣的讨论，比如是否能将优步在拼车业务增长中的强势品牌地位提升到其所预期的新情势，从而实现扩增市场。优步很可能会发现，租用无人驾驶汽车已经成为一种商品服务，因此汽车品牌本身已经无关紧要。无论如何，优步的人类司机极有可能发现他们的新职业生涯被极大地缩短了。优步可能是迄今唯一一家在硅谷的创造了大量的新工作岗位的初创企业，而优步司机职业生涯的结束是即将到来的颠覆瓦解中出现的更戏剧性的早期影响之一（Samani,
    2015）。


    据《连线》（Wired Magazine）杂志报道，向混合动力'
