    # ## 前瞻与回望


    很久以前，我曾是剑桥大学的学生。我作为辩手，在第一学期被邀请在“新生辩论赛”上讲话。之所以于我而言，这是一段值得记忆的经历，原因很多。当时的学生会主席是一位心直口快的希腊女士，但却持保守观点，而且显而易见，她非常有钱。她的第一本书在毕业后很快就出版了——主题是对当代女性主义的抨击。她的名字叫作阿里安娜·斯达西纳普洛斯（Arianna
    Stassinopoulos），但我们对于她现在的名字更为熟悉，就是阿里安娜·赫芬顿'
