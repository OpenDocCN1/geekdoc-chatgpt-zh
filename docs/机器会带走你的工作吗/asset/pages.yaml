  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    反而时常来自那些科技鼓吹者）。当然，正如我们将看到的，一些历史上最重要的经济学家反而加入警示者之中。慢慢地，这个议题蔓延到主流讨论中。


    也是最近，我又受邀出席了一个有趣的会议，议题是关于世界在 100 年之后将会变成什么。这封邀请函来自巴西前总统卡多佐（Cardoso），邀请函引人入胜地写着这样一段话，一个现在出生的孩子，很有可能会活到
    100 岁。我们这些有子女或外孙辈的人，如果我们要关注子孙后代的利益和他们面对的未来，我们必须考虑得相当长远。这里无关“学术”，而是我会给尤安（Euan）、林肯（Lincoln）、吉迪恩（Gideon）及其他外孙说点什么，对他们未来的职业提出怎样的建议呢？我们作为学者来讨论这些问题，作为领导者、政客、商业人士、科技人员、市民社会的代表去思考这些问题。但是同时，我们自己也是劳动者。此外，我们还为人父母或祖父母，我们的孩子、孩子的孩子，他们的未来又会是怎样呢？


    我们已然富足，处于发达世界中的我们，正置身于前所未有的繁荣时代。我们的社会既有穷困者也有富足者。'
