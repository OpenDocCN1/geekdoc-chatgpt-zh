    # 心理学与精神病学


    如果你打算从事一项能够竞争过机器的工作并将其作为事业，那么一个显在的选择就是专注于人类心灵研究。心理学家在弗雷和奥斯本分类学中排名第十七位——他们的排名情况和我们想象的差不多高。然而，就在我撰写本章时，我的推特上出现了另一篇来自《美国科学》的文章，内容是关于人工智能和情感领域：'
