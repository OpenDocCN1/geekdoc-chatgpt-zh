- pgno: 89
  md: '# 事物确已变化


    因此，我们该如何进行严肃的讨论？我们可以开始用更具体的方式来思考“未来”。当我们回首过去，我们一直被提醒着，事物是如何变化的。我们的手机给我们导航，Skype
    使得电话免费了，而脸书让我们可以不费吹灰之力就能和家人、朋友保持联系，谷歌则让我们可以连接到世界知识宝库，在这一切发生以前，我们是很难想象生活的样貌的。然而这一切的变化，都发生在过去的二十多年。


    回到 1995 年，当时只有 1800 万名美国网民，那时还没有这些，但一些令人吃惊的事情已经开始发生。Craigslist 发布，之后是 Ebay 和亚马逊（Amazon），再之后是第一个约会网站
    Match.com。也是在同一年，网景（Netscape）首次公开募股（IPO），然后就是微软（Microsoft）网络搜索引擎的面世。所有的这一切都是在同一年发生的。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    每个变化都是来自电脑芯片的力量，运行都是根据我们现在已知的摩尔定律（Moore’s Law），该“定律”由英特尔创始人戈登·摩尔（Gordon Moore）确立后近半个世纪来一直是这样。该定律认为（以简化的方式而言）电脑处理能力每两年会提高一倍。换句话说，任何由电脑技术驱动的事物——任何可以被数字化的事物——都是按照指数级速度发展的。这一过程会越来越快，每年都会变得更快。这就使得预想未来变得更加困难，这也使得我们自1998年出现谷歌（Google）之后的生活，正在被即将到来的变化弄得天翻地覆——而无论变化会是什么。


    这种指数级思想的伟大是值得思考的。我们熟悉那些发生在金融领域的变化——复利就是带给我们退休投资长期回报的驱动力。但是关于它的力量最适合的比喻，是古老传说中的稻谷和棋盘，其景象是这样的：


    一名印第安王子提出同来访的智者下一盘棋，并给他任何他想要的东西作为奖励。智者说他只想要几粒米，一粒稻谷在第一格，两粒稻谷在第二格，四粒在第三格，像'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 第二章 “愚蠢的勒德分子”


    这样每增加一格就翻倍前面的数。这在数学上看来确实简单，只要我们不被太大的数的计算所拖住。到了第 20 格时，已经需要 100 万粒稻谷了。到第 40 格时，数字会上升到十亿粒。而在棋盘上还有
    24 格要走。到最后一格时，谷物的数量已经达到 18, 000, 000, 000, 000, 000, 000 粒，折算成重量的话就是大概 2100 亿吨（具体会取决于谷物的种类）。


    这里很显然的是，摩尔定律在最后会慢下来（Technology Quarter, 2016），量子和生物计算的前景预示着未来巨大的变化。图像也可以显示我们已经走了多远。通过计算我们可以得出，带领阿波罗宇航员飞往月球的计算机，其能力只是任天堂游戏机内核的两倍。而
    iPhone 4 的计算机相当于 Cray-2 计算机的能力，后者曾是 1985 年最快的计算机。在过去的 50 年间，我们的计算能力已经提升了一兆（Stone,
    2015）。


    简言之，指数级法则使得预见未来变得极为困难。但是却也告诉我们，前方的变化将是多么巨大。棋盘的例子'
