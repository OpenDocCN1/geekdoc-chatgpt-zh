  md: '自二十世纪产业社会的思想遗产将会褪去，连同那些诸如区分全职与兼职的附随理论。在这里，如同这一进程中的其他部分，会在美国而不是欧洲社会更为明显，因为在美国，健康和其他福利更加依附于全职工作。但这也正是所有工业化经济体之间的最大区别，最典型的莫过于将各种政策或福利的基础建立在假定的一定数量的工作时间之上（比如退休后的收入和产假）。这些假设前提需要在工作日益减少的背景下重新加以审视，同时也可能会存在必要的政策，鼓励人们分享工作（出于社会原因）而不是将工作尽可能维持在全职工作的框架里（现行的机制预设）。


    简单来说，对于雇佣和自雇的区别也同样是如此。它们在被称为“零工经济”（gig economy）出现的背景下被大众进行议论，特别是在美国。这种转变可能被夸大了，因为自雇被视为劳动力的附属层级早就存在，只不过优步的出现，以及它对事实上是雇员的承包人的使用，又在政策上和美国法院中被给予了新的话题性。


    类似的还有志愿工作和失业之间的区分。志愿付出——同时被政府视为社会价值的劳动，作为提供社会服'
