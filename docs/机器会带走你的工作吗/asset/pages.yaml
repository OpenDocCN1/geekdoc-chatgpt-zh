- pgno: 85
  md: '是比充分和自由的公共讨论更好的润滑剂，用以去关注那些新生技术可能导致的危险。而当前正是我们鼓励和欢迎去进行最为坦诚的也是最为诚实的对话，去共议未来的时候。


    并且，机器人对就业的影响，同时也是机器人对数字科技的发展和应用的影响这一更为广泛议题的一部分。科技鼓吹者无视对技术性失业的关注，将使得他们奇怪地站在争论的两方。例如，我最近被邀请出席西班牙马德里举办的一个由《经济学》杂志主办的会议。会议的主题是：这是否是一场真正的革命，是否是一场远胜于其他最终是科技和经济标准化进程中常规发展的进步？科技鼓吹者们会回答是，但是会否认其将对就业带来颠覆性影响。似乎工作本身是已经独立于基础性前提的“安全港”。任何事物都在发展变化，他们说。但是除非我们每个人仍将获得充分的工作，正如在旧工业经济中我们所拥有的那样，否则这显然只是一个颂令人欣慰的假设，但同时也过于天真。


    科技鼓吹者们虚构的勒德分子并不关心严肃的话题；'
  merge: -1
  img_proc: true
- pgno: 86
  md: '他们更钟情于“大锤”的使用。因此今天那些科技鼓吹者感到他们自己需要自己挥动武器，以避免严肃的讨论，这就很具有讽刺意味了。我们必须停止称呼人们为勒德分子，而开始进行相互尊重的圆桌议论，包括邀请那些正在挑战传统智识的人参加。


    在这一问题上，最近最具有影响力的书，是由麻省理工学院经济学家埃里克·布吕诺尔夫松（Erik Bryjolfsson）和安德鲁·麦卡菲（Andrew McAfee）合写的《次机器革命》（The
    Second Machine Age），副标题是《智慧科技时代中的工作、进步和财富》（Work, Progress, and Prosperity in a
    Time of Brilliant Technologies，2014）。其基础是他们早先的一部电子书籍《人与机器的赛跑》（Race Against the
    Machine，2011）。他们具体指出了机器智能对于就业的变革性影响，并得出结论认为，机器智能实际上会带给劳动市场根本意义上的挑战，同时也存在政策和行动策略可以缩小该影响。企业家兼作家马丁·福特（Martin
    Ford）所写的《机器人崛起》（Rise of the Robots）也是类似的著作，而且更加鞭辟入里。研究者们的更为细致的当代分析，还'
