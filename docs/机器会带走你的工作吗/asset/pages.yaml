- pgno: 48
  md: '子专利的著名例子，她认为这会使她的子民被夺去工作而沦为贫困：


    如此一来就会夺其工作，而迫其为丐，吾民覆也。


    主要工业经济体的“智瘦团” ——国际经济合作与发展组织（OECD）的一份报告发展了弗雷和奥斯本的方法，但也对其提出了挑战。虽然该报告接受了弗雷和奥斯本的大部分分析，但
    OECD 的文件（Arntz, Gregory & Zierahn, 2016）聚焦于弗雷和奥斯本的假设，即弗雷和奥斯本认为在向机器智能转移的工作任务（或者用
    OECD 的术语来说，是“自动化”），基本包含了他们所列出的工作。OECD 在报告中预测的，远比弗雷和奥斯本名单中的工作数量更多，特别是那些包含特殊工作内容的工作。报告中还指出，伦理和法律因素将抑制机器对许多职业的接管。因此
    OECD 得出的结论是，会有 9% 而不是 47% 的工作面临接管的危险。


    在后面的章节中，我们评估了这些方法的相对优点，'
