- pgno: 101
  md: 二十一世纪最大的惊奇之一，就是政府与产业界的领导者们，甚至工会自身，都未能将大规模的劳动市场崩溃视为一种严峻的可能。同时，这不是他们演讲的主题，亦不会列入他们的计划之中。当我们观察政治候选人的讨论时，会发现他们只字未提这种崩溃带来的一系列复杂的政策挑战。尽管事实上比尔·盖茨和其他科技家已经开始打破沉默，但是仍难以证明这种发声对主流思想已经产生了影响。然而，我们如果要回答今天的问题，就不能回避去回应明天的问题，那么我们又有多大程度上有信心去面对劳动市场上的巨大崩溃？正如我们所看到的，在具体分析完那些被我们称为职业的“高端”工作后，萨斯坎德们挑战了一种虽然简单但不计后果的假设，即认为总会有工作留给人们。
