  md: '技术开发方面投入了大量资金，用以使得老年照顾依赖者获得照顾更为简单。在基本层面上，这可能只涉及那些独居者，在其家中安装传感器，一旦他们的行动模式发生变化，就会通过传感器发出报告，这样就会有亲戚或护士到访。其他的研发契机，包括机器人陪伴者帕罗（
    Paro ）——这是一款机械海豹，能够回应宠爱，也能够在被丢落或者无视时哭泣（是一款针对老年人设计的上一代电子宠物的更新版）——帕罗可以和老年人做游戏以及跳舞，能够帮助他们在琐事上保持思维活跃（
    Hey，2015）。这种方式非常简单，可以使用一个伦巴（ Roomba ）真空扫地机器人，或者使用机器人手臂做出有限的动作来帮助老年人入浴，以及通用设置指令将机器人开发出洗碗和洗衣的功能。其实以上例子中没有一个是严格限定为医疗用途的设计，而是通过多方面来实现对人的照顾，处理那些情况比年轻时更为脆弱的人的护理问题。


