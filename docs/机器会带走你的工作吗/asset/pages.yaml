  md: '工作情况将会变得有多糟糕？一份经济合作与发展组织的研究得出，9% 的美国就业将面临威胁。两位牛津大学学者预计，将会有 47% 的美国工作受到威胁。即使是乐观的愿景也预示了这一严峻问题。而无论如何，在未来的几十年中，对于一个生活在美国的人，极有可能再也不会去从事那些被传统定义的工作……“这次与以往不同”还有很多需要去做。


