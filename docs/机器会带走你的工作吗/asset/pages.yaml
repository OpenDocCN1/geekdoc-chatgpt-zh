  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    最近重新得到重视，那就是全民基本收入（ UBI ）。随着人类劳动与资本共同为创造价值而相互作用的需求减少，从就业中所获得的收入与维持个人生存之间的纽带将会面临威胁。在发达国家，对于“社会工资”水平（政府为服务提供的国民收入数额），与对贫困者、低就业者、失业者所提供的资助水平（在一些国家该水平可能在合理工作中的全职岗位上差别不大，但在有些国家可能差距较大）上，获得的重视不同。但是在以下问题上并无异议，那就是失业水平上升时，不仅会促使社会问题爆发（实际上是政治问题），也会导致需求的剧降，从而进一步对经济发展产生压力。为了回应上述关注，一种极端的简化福利思想在今天被重新提出来；有趣的是，该思想获得了政治、经济两界在不同角度上的广泛关注。在这一意义上，全民基本收入理论由于从根本上是对国家收入的再分配，因此可能被看作我们正在面临的富有挑战意义的“社会主义”解决方案，并值得成为自己的政治品牌。其支持者主要是保守经济学家米尔顿·弗里德曼（
    Milton Friedman）（ Orfalea, 2015 ）。'
