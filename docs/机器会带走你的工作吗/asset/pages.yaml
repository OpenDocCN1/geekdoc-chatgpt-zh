- pgno: 54
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    车的转变可能从卡车开始，因为它们的成本要高很多，同时自动化将会使 24 小时运行成为可能，并削减保险费用（ Davies, 2015）。根据美国卡车运输公司的说法，在美国，目前有
    350 万个卡车司机的工作岗位。而卡车也造成了许多事故——在 2012 年，约有 33 万起事故，导致 4000 人死亡（当然，大部分是在汽车内的死亡）。90%
    的事故是由司机造成的。目前，矿业公司已经在广泛使用自动驾驶卡车（和火车），其部分原因就是由于劳动力成本，但同时也是出于对安全的考虑（ Santens, 2015;
    Strauss, 2015 ）。


    保险是一个很重要的因素。这可能看起来与直觉相违背，但它却是支持自动驾驶技术安全性的一个主要理由。当我们发现在 70 英里的高速公路交通上，卡车上居然没有一个司机，这种景象虽然可怕，然而事实却是，我们人类并不是很擅长许多我们所从事的工作（这一点同样适用于许多其他将会被机器智能取代的领域）。这就是有那么多公路事故，使得美国每年会有数万人死亡、数十万人受伤的原因。我们集中注意力的能力是有限的，从我们坐在方向盘前不知不觉已经开出去
    20 英里这种经历就可以让'
  merge: -1
  img_proc: true
- pgno: 55
  md: '人理解。事实上，在每年死于交通事故的 3.5 万美国人中，80% 的人都是酒后驾驶、超速或分心驾驶的受害者——这些都不太可能成为电脑的问题。有人预测，应用自动驾驶技术后保险费率整体上将大幅下降，但是如果你想要享受自己开车的奢侈，保险费用将变得非常昂贵。此外，自动驾驶技术未来的前景不仅是自动驾驶车辆将会比目前的人类驾驶更安全，而且它们还将进行防御性驾驶。通过
    24 小时 360 度的注意，并与其他车辆（如拐角附近的车辆）沟通，它们可以保护乘客免受其他车辆错误的侵扰。


    其中一个有利因素是，急诊室的就诊需求可能会下降（作为连锁反应，医疗费用也会下降）。当然，这也会对医疗工作产生影响，同时也会影响到那些已经缩小了的汽车保险产业的工作。与此同时，沃尔沃已经提出了一项针对自动驾驶汽车的标准责任方案。人们会问道，如果事故发生在汽车驾驶本身，那么谁将承担责任呢？沃尔沃率先声明将承担全部责任——这一政策可能为其他制造商也设定了相应标准（《保险时报》，2015
    年）。


    伦敦劳埃德银行 2014 年发表的承保人保险报告'
  merge: -1
  img_proc: true
- pgno: 56
  md: '( Lloyd''s of London, 2014 ) 中称，目前已经开始解决自动驾驶汽车未来可能引发的某些实操问题。该报告描绘了这样一种经济：


    私人所有的汽车数量已经急剧下降，被越来越多的人使用的是自动驾驶的快捷汽车，这些汽车可能是由公司从制造商那里租来的，而不是自己拥有。


    劳埃德银行意识到这一情形下的一些问题：


    随着人们更少地依赖人类驾驶员进行驾驶，交通行业新增加的风险将与汽车技术本身相关。电脑能做许多人类司机做不到的事情：它们能在雾天和黑暗中看到东西，而且不容易疲劳和分心。然而，系统只能和它们的设计者和程序员水平一致，因此它们也可能会犯错。而随着汽车上使用的硬件和软件越来越复杂，也会有更多可能出错的地方。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '因此，他们预计负责人仍需要做好随时接手工作的准备。


    如果法律要求司机监督一辆自动驾驶的汽车，他们可能会意识到自己很难专注于这项任务，如果他们觉得自己能够信任这辆汽车的话。


    埃德劳报告设想的前景是一个过渡性方案，驾驶员可以选择巡航控制来进行“自动驾驶”。相比之下，谷歌最新一代的原型机则完全没有方向盘。这种设计上的坚持也获得了加州政府的支持。事实上，前述那种半替代的过渡方案存在的问题远比全程无人驾驶方案的更多。在驾驶过程中，始终保持半注意力——这对于人类驾驶员而言，他们本应完全靠自己驾驶，而在半注意状态下往往不能正确地集中注意力——这样似乎格外危险。


    更为重要的是，自动驾驶技术可能会戏剧性地改变汽车市场的保有量。如果点击一个应用程序，系统就会立刻把一辆汽车带到您家门口，那么谁还想要去拥有一辆车'
