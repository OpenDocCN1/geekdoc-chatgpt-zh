- pgno: 87
  md: '讨论了当前工资停滞问题，这些研究包括詹姆斯·贝森（James Bessen）的《做中学：创新、工资与财富之间的真实关联》（Learning by Doing:
    The Real Connection Between Innovation, Wages, and Wealth, 2015）。


    而另一篇非常重要的文章，来自麻省理工学院经济学家大卫·亚瑟（David Autor），则提请人们关注技术自动地会摧毁工作。在《为什么还有这么多工作？职场自动化的历史和未来》（Why
    are There Still So Many Jobs？ The History and Future of Workplace Automation,
    2015）这篇论文中，作者反映了最近的技术对劳动市场的影响，并对未来可能出现的工作提出了乐观见解。正确地评估技术对就业的影响，“需要思考工作中所包含的任务范围，以及人力劳动在多大程度上可以补充新技术”。前一观点在OECD的报告中被进一步阐释，正如我们在第一章中介绍的那样，一个原因就是这个评估比起牛津大学马丁学院的方法更为乐观——因为“工作是由多任务组成的”，技术替代远比第一种预测所建议的那样更为复杂。并且，亚瑟引用了哲学家迈克尔·波兰尼（Michael
    Polanyi）的著'
  merge: -1
  img_proc: true
- pgno: 88
  md: '作，认为很多人类行为中存在一种“隐性知识”：我们做的事情往往是我们自己并未完全理解的——比如写一段说服性文字，或者在碗沿儿打一颗鸡蛋，或者一眼见过就确认出其中的一只稀有鸟类。因此，这些任务是“最难被自动化的”——这里既有较低技能工作，也有较高技能工作——这些都包含着“灵活性、判断和常识”，这些构成被认为是自动化最难以去模仿的。亚瑟也关注到了日益重要的问题，即人和机器的互补性可以实现成功的工作表现和价值创造。


    很显然，任何严谨的分析都需要将这些考虑在其中，虽然有一种工作直到最近才被人们提起，但它正是低水平工作中“隐形知识”的极佳代表——这一工作为我们所有人所熟知——那就是驾驶。这里的隐形知识，即可以让高水平人类司机成功做出直观的复杂选择，将这种知识转换为算法，并没有花费很长时间。而就这一原则在更高层次上的普遍应用而言，萨斯肯德（Susskind
    & Susskind）最近关于机器智能对职业影响的文章——已经讨论过——已经在提醒，这一切都太引人入胜了。'
