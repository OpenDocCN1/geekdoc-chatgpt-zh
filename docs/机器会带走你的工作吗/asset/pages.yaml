- pgno: 75
  md: '这里是卡内基·梅隆大学，在我们的机器人中心，费尔南德·德拉托雷（Fernando De La Torre）已经领导开发出某种特别有效的人脸分析软件，称为英特飞（IntraFace）。他的团队创造的个体识别算法，使得软件可以执行对人个体的外表分析。虽然还不是非常精确，但是已经很有效率；这款软件甚至可以在手机上运行。


    德拉托雷和一位来自匹兹堡大学的心理学家杰弗瑞·科恩（Jeffery Cohn），已经开始在精神病诊所试用该软件，该软件对于探测情绪上的抑郁取得了令人振奋的效果。在自然状态下探测抑郁，需要有能力去捕捉精确的面部表情，而这正是这款软件正在做的事情。


    想象这种可能性：一位虚拟心理学家可以在诊所与患者面谈过程中，通过分析我们所展现出来的感情，帮助诊断抑郁；它甚至能够随着疾病的过程或者治疗的介入程度，而量化情绪上的变化。市场分析师可以很好地测算受众将对他们的产品和广告做出何种反应，而教师能够评价一堂课程计划是否有效地吸引了学生。智能手机也能变化'
