- pgno: 107
  md: '覆性变革的实际影响，人们过早地忽略了。我们也无须回溯到第一次工业革命来寻找答案，我们身边的例子就已然不胜枚举。比如在英国，以煤矿社区遭受的破坏来看，1984年臭名昭著的煤炭工人大罢工引发了戏剧性的重整，并最终导致该产业的终结。威尔士曾经有四分之一人口依赖煤炭采掘为生。在美国，近年来发生的底特律市政府破产，也为我们提供了技术变化导致高昂成本的案例。再如在像印第安纳州盖里（以曾经强大一时的美国钢铁业巨头的奠基人命名，但现在是全美闻名的杀人犯罪城市）这样的城市中，传统重工业的瓦解带来的是“铁锈地带”的蔓延——在美国中心部形成了非规则形状的、跨多州的“铁锈地带”，那里经济恢复相当缓慢，产业崩溃后的恢复需要不止一代人的努力。因此，重要的是要认真考虑实际的社会影响和成本，从理论的角度来看，这似乎是对技术和全球经济力量的例行调整。当然，也应该说，这些情况都是可控的，总体经济和就业状况都因此表现良好（
    Janoski et al. 2014 ）。


    借古鉴今，在最近对英国工会大会的一次讲演中，'
