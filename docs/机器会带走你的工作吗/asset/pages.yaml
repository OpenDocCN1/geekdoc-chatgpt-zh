- pgno: 84
  md: '也有一些人，他们希望提出超越不同意见的观点。最明显的例子当属埃隆·马斯克（Elon Musk）提出的新奇建议，他的创新帝国中包括特斯拉汽车、SpaceX
    火箭，以及计划中的 hyperloop 极速交通系统。他不仅仅被认为是勤德式的，而且足以被称为“年度勤德分子”。这一判断来自华盛顿特区的政府智库。为什么这样说？因为马斯克敢于签署一份来自世界顶尖科学思想家（包括斯蒂芬·霍金）的声明，该声明引发了人们对人工智能可以从本质上取代人类的长期危险性的质疑。提出一个关于技术的潜在问题，你有被人称为勤德分子的危险。很难想象还有什么


    ① 针对埃隆·马斯克（Elon Musk）是勤德分子的诽谤，来自信息技术与创新基金会（Information Technology and Innovative
    Foundation）。也许这是不公平的，我发现一个理由来避免这一指责，这是在埃里克·布兰诺尔夫松（Erik Bryjolfsson）和安德鲁·麦卡菲（Andrew
    McAfee）合写的《次机器革命》（The Second Machine Age, 2014）的书封上部的小标题，是关注于技术性失业时间表的，写道《智慧科技时代中的工作、进步和财富》（Work,
    Progress, and Prosperity in a Time of Brilliant Technologies），这比他们早前另一部书《人与机器的赛跑》（Race
    Against the Machine）更好地抓住了问题本身。更多关于马斯克、霍金和盖茨有关人工智能的警告，见 Sainato（2015）。'
