    呢？在城市中，已经有一些证据表明优步的拼车服务正在减少车辆的拥有量，因为它比打车方便多了（而且通常更便宜）。千禧一代的购车人数，已经下降了一段时间了（Schwartz,
    2015）。事实上，密歇根大学的一项研究表明，汽车保有量可能会减少 43%。研究指出，目前美国家庭平均拥有 2.1 辆汽车，这就表明，上述比例可能会降至 1.2
    辆（Schoettle & Sivak, 2015）。


    而这一切实际上有可能被低估了。研究人员预测，典型的美国家庭，最终还是会拥有一辆汽车——但是会处理掉第二辆，因为无人驾驶汽车的租赁既方便又实惠。更具可能性的是，一旦无人驾驶技术革命开始，它就将持续下去。而对未来车主的另一项预测是，汽车保有量将减少
    60% — 90%，继而将可能对汽车制造业产生巨大影响。如果我们不需要拥有两辆车，为什么还要一辆呢？成本对消费者的影响也可能是巨大的。在《人工智能时代》（Humans
    Need Not Apply）一书中，硅谷企业家、斯坦福学者杰瑞·卡布兰（Jerry Kaplan）（2015）为我们展示了一些有趣的数字。根据美国汽车协会（AAA）提供的数据，他'
