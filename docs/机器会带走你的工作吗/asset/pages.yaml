    年报道，华尔街的一位分析师认为，汽车的典型利用率是 4%。每天只使用一小时。“这一百年来没有发生实质性的变化……" 对他来说，这是一种惊人的浪费，是一种不可撼动的模式。当然，这种观点与拥有汽车的便利性背道而驰：汽车在需要的时候就在那里，等待着被驾驶。黛博拉说：“我有一辆车，整天都在我的车道上。”“但我真的真的很喜欢我的车在我需要的时候就在那里。”


