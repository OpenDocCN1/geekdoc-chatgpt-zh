    的在线教育之所以没有取得许多人 25 年前预期的飞跃进步，其中一个原因是，它与更早的 19 世纪以来依旧有的邮件系统为基础的“函授课程”相差并不多。标准在线课程有一种特殊的便利——特别是当它们是同步性的——也就是说，你可以随时学习——但是它们像传统的课堂教育一样，需要为老师们提供密集的教学帮助。例如，班级需要小一些。随着慕课的出现，课堂发生的变化是，教授
    100 万名学生所需的费用，并不比教授十几个名学生生多。


    当一项技术抓住了新闻头条，但却未能在市场上流行起来时，一些评论员很快就会为这项技术撰写讣告，而慕课现象正属于这一类，但现在还为时尚早。主要的科研机构——包括世界顶尖大学在内——正在开展的一项调查研究，也许多少让人有所担心，这就是科技是否会终结整个高等教育。同时，与无人驾驶汽车一样，我们需要注意这其中的经济因素。传统的大学教育对于学生和政府而言都在变得越来越昂贵，这一事实（同时考虑到学生债务）已经成为当今教育界讨论的主要话题。当新技术提供的可能性与经济机会相遇，巨变将随之而来。乐观主义者曾引导'
