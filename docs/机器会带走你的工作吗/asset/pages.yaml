- pgno: 96
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    一例证。


    那么，为何如此之多的意见领袖会忽视智能机器对工作的潜在影响——而那些科技鼓吹者却是在告诉我们，提出这一问题是因为我们很愚蠢？科技鼓吹者们相信他们是对技术和未来愿景的真正捍卫者，他们是科技革命性的真正的“信徒”，而那些提出问题者则是未来之路的拦路人。


    他们说，我们应当不会存在任何问题去适应机器智能的影响，我们应当去发现新的工作，我们应当充实我们所从事的事业，而这些事业是机器难以发现的。他们也许是对的，但是透过他们狂热的过度自信，他们只是完全相信新常态的谬论。同样是这些人在扭曲曲线，想象着未来会比他们曾拥有的生活更加舒适，而这种想象超越了他们所据以相信的理由本身。


    人们能够理解我们所谓的技术决定论的影响力——在这种思想下，技术发展自身会带动社会改变，并重塑未来社会，技术发展会解决其所引发的问题，因此我们应当静观其变。但是历史总被人类、技术和经济的相互作用所扰乱，在这些事例中，人类的洞见、勇气和计划改变了事'
  merge: -1
  img_proc: true
- pgno: 97
  md: '物的发生——从对股票市场和银行倒闭的介入（从罗斯福新政到 2008 年全球应对雷曼兄弟破产的危机）到对技术的直接规制（石棉、DDT、汽车排放，全面的环境保护企业），以及对科学技术资助的公共
    / 政策角色 [ 最为人熟知的是苹果和其对手安卓的出现，并非硅谷的产物，而是由美国政府投资并主要通过美国国防高级研究计划局 DARPA ( Defense
    Advanced Research Project Agency ) 实现的——后者本身还参与了互联网的发明 ]。我们不能无视这一点，更不能想当然地认为它会管好自己。


    # 清晰地思考未来


    因此，我们应当如何考虑未来？我们需要非常谨慎，即便我们并不确切地知道未来会怎样。让我们先看看那些貌似可信的未来，然后思考可能会是怎样的，并对所有可能的结果竭尽全力做好准备——对应它们各自的风险特点。


    评估风险的一个简单方法是，将可能的结果划分为四'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 机器会夺走你的工作吗

    Will Robots Take Your Job


    类——归入同一矩阵下的四个盒子中：高影响和高可能性；高影响和低可能性；低影响和高可能性；低影响和低可能性。简言之，最初的两个盒子最为紧要。而第二个是最难办的。


    事实上，这里存在两种论辩，它们在分析风险的目的上存在显著区别。一个涉及严重的结构性失业的可能性；另一个涉及从这种劳动市场突变中不能恢复的可能性，而且就长期而言，将会降低未来经济维持“充分就业”的能力，在那时，人工智能机器人实际上已经被大量使用了。严重的结构性失业是高可能性还是低可能性？无论是哪一种，一旦发生将会强烈地影响那些发达（以及潜在地影响发展中）社会。如果届时无法恢复“充分就业”的水平——正如盖兹、萨默斯和默里等人所预见的景象——那时的影响就会更加巨大。


    当我们展望未来，我们很难想象政策制定者们可以回避思考关于未来就业的问题。'
  merge: -1
  img_proc: true
