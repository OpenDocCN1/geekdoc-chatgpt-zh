- pgno: 108
  md: '安迪·霍尔丹（Andy Haldane）作为英格兰银行首席经济学家，他认为，关于第一次工业革命的影响，令人吃惊的一点是，英国的非技术劳动力在规模上的持续倍增——从
    1700 年到 1850 年规模从 20% 增加到 40%（Haldane,2015）。类似的情况也发生在稍晚一些时候的美国。新机械的效果之一就是使得大量的技术手工劳动者失业，而将工作重新配置到了工厂和生产线上。当新的管理类型和其他相关高级别工作出现后，经济增长带来了更广泛的社会福利，这一过程还伴随着技能阶梯的大规模下降，而不是上升。值得注意的一点却也极为简单：就我们曾经的经验而言，“结构性失业”的实际成本是很高的。


    在十九世纪初期，历史上最具影响力的经济学家之一大卫·李嘉图（David Ricardo）也重提了这一点。在反映工业革命的影响时，他对那些认为工业革命吞食了工人的工作和收入的观点表达了认同。但是，他并不同意放弃科技进步，因为这样只会将资本和生产送往国外（他也以比较优势理论的创始人而闻名于世）。他得出结论认为，“工人阶级提出的观点，认为使用机器会经常危害到他们的利'
  merge: -1
  img_proc: true
- pgno: 109
  md: '益，这种认识虽然不是建立在偏见或错误之上，但是却与政治经济学中的修正原则一致”（Ricado，1821）。从历史背景上看，当然，我们可以将这一观点看作对导致“结构性失业”的瓦解过程的一种观察，经济整体（而不是那些被击垮的众多个体）最终还是从中受益了。


    然而，即便是接受了这种对于过去、现在与未来在结构性失业经验上的基本类比，机器智能的革命性影响仍是独特的，因为它对众多行业带来的冲击和颠覆都是同时发生的——在起伏变化的过程中，终点并不清晰（即便终将有一个终点的话）。这一点已经在我们之前讨论过的最近进行的关于机器智能影响职业的评估中，为大家展现了令人惊讶的细节。以往的破坏性经验主要集中在两个方面，或是新设备的发明（例如哈夫里格斯经典的珍妮针织机），或是新的通用技术的引入（例如蒸汽动力），也或者是两者的结合利用。我们所了解的是，当初期的科技开始进入我们的生活，它会拍拍我们每个人的肩膀说，“我能帮到您吗”？然后无论我们正在做什么，它都能够或多或少地帮助到一些。机器智能可以被证明是经济学家称为“通用'
  merge: -1
