- pgno: 114
  md: '归一化后的数据范围为 [0， 1]，其中， x 为原始数据样本， min(x)、 max(x) 分别表示求样本数据的最小值和最大值， x'' 为归一化后的数据。


    +   2) 平均值归一化，即


    $$x'' = \frac{x - mean(x)}{max(x) - min(x)}$$ (4-26)


    式中， mean(x) 为样本数据平均值。


    +   3) Z 归一化，即


    $$x'' = \frac{x - \mu}{\sigma}$$ (4-27)


    归一化后的数据范围为实数集，其中， $\mu$、 $\sigma$ 分别为样本数据的均值和标准差。


    +   4) 对数归一化，即


    $$x'' = \frac{lg x}{lg max(x)}$$ (4-28)


    +   5) 反正切函数归一化，即


    $$x'' = arctan(x) \frac{2}{\pi}$$ (4-29)


    归一化后的数据范围为 [-1， 1]。


    +   6) 小数定标标准化，即


    $$x'' = \frac{x}{10^j}$$ (4-30)


    归一化后的数据范围为 [-1， 1]， j 为使 max(|x''|< 1) 的最小整数。


    最小值最大值归一化和平均值归一化适合在最大值最小值明确不变的情况下使用。在最大值最小值不明确时，每当有新数据加入，都可能会改变最大值或最小值，导致归一化结果不稳定，后续使用效果也不稳定。同时，数据需要相对稳定，如果有过大或过小的异常值存在，最小值最大值归一化和平均值归一化的效果也不会很好。但如果对处理后的数据范围有严格要求，也应使用最小值最大值归一化和平均值归一化。Z
    归一化处理后的数据呈均值为 0、标准差为 1 的分布。在数据存在异常值、最大最小值不固定的情况下，可以使用 Z 归一化。Z 归一化会改变数据的状态分布，但不会改变分布的种类。方法
    4）~ 6）为代表的非线性归一化通常被用在数据分化程度较大的场景，有时需要通过一些数学函数对原始值进行映射，如对数、反正切等。


    对于关节信息来说，通常机器人生产完成后关节角度上下限就已确定，而由于物理条件的限制，关节角速度上下限也是确定的，所以通常情况下对于盲眼运动来说，数据归一化方法为对传感器数据进行上下限截断后，使用最小值最大值归一化。接入摄像头等其他外部传感器或更换任务类型后，多种数据类型不同，数据归一化方法往往根据实际数据特征进行调整，但往往都会将数据变化最为明显、影响最大的部分归一化为（-1，
    1）或（0， 1）的范围。'
