  md: '该策略根据式（5-41）进行奖励，即


    \( r(s_t, a_t) = \begin{cases} r_g, D_t < \eta_D \\ r_c, \text{检测到碰撞} \\ v - |\omega|,
    \text{其他情况} \end{cases} \quad (5-41) \)


    式中，时间步 \( t \) 处的状态 - 动作对 \( (s_t, a_t) \) 的奖励 \( r \) 取决于三个条件。如果当前时间步 \( D_t
    \) 处到目标的距离小于阈值 \( \eta_D \)，则应用正目标奖励 \( r_g \)。如果检测到碰撞，则应用负碰撞奖励 \( r_c \)。如果这两个条件都不存在，则根据当前线速度
    \( v \) 和角速度 \( \omega \) 应用即时奖励。为了引导导航策略朝着给定的目标前进，采用延迟归因奖励方法，即


    \( r_{t-i} = r(s_{t-i}, a_{t-i}) + \frac{r_g}{i}, \forall i = \{1, 2, 3, \cdots,
    n\} \quad (5-42) \)


    式中，\( n \) 是更新奖励的先前步骤数。这意味着在达到目标之前的最后 \( n \) 步中，正目标奖励的归因会逐渐减少，网络学习了一种通用的局部导航策略，该策略能够达到局部目标，同时直接避开来自激光输入的障碍物。


    # 5.4.3 探索与建图


    机器人沿着路径点向全局目标行进。一旦机器人接近全局目标，它就会导航至该目标。在行进过程中，机器人同时进行环境探索和绘图。通过激光和里程计传感器，机器人能够实时生成环境的占用网格图，从而更好地了解周围环境。目标驱动的自主探索算法是一种完全自主的探索算法，能够使机器人在未知环境中探索并导航至预定的全局目标点。其基本思想是通过不断读取传感器数据更新环境地图，并在地图中识别新的兴趣点，从而逐步逼近全局目标点。以下是算法的详细工作流程：


    +   1) 读取传感器数据：在整个探索过程中，机器人会不断读取自身携带的传感器的数据。这些传感器通常包括激光雷达、超声波传感器、摄像头和里程计等。这些传感器能够提供环境的距离信息、图像信息和自身位置信息，从而帮助机器人感知周围环境。


    +   2) 更新地图：通过读取到的传感器数据，机器人能够实时更新其地图。该地图通常采用占用网格（Occupancy Grid）的形式表示环境中各个位置的占用状态。每个网格单元可以表示为被占用、未被占用或未知状态。随着机器人在环境中移动，更多的未知区域将被探索并更新到地图中。


    +   3) 获取新的兴趣点：在更新地图的过程中，机器人会识别出新的兴趣点。这些兴趣点通常是一些尚未探索的区域或可能存在目标物的区域。兴趣点的识别可以基于地图中的未知区域、边界区域或其他特定的特征。


    +   4) 判断是否接近目标：机器人会不断计算自己与全局目标点之间的距离。当当前距离小于某个预定阈值（如 \( \eta D \)）时，机器人需要进一步判断当前位置是否已经是全局目标。如果当前位置等于全局目标点，说明机器人已经到达目标点，此时探索过程可以结束。


    +   5) 选择下一个导航点：如果当前位置不是全局目标点，机器人会进一步检查当前位'
