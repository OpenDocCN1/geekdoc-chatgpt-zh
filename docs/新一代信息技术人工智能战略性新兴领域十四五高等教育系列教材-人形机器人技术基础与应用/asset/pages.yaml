    # 2. 运动学结构


    一般的仿人机器人的骨架结构图如图 2-15 所示。仿人机器人的拟人结构为： 6 自由度的腿、7 自由度的手臂、2 自由度的躯干和 2 自由度的头部。在真实的仿人机器人中，所有关节都是单自由度旋转的
    R 关节。一方面，机器人模型经常使用等效的多自由度关节。在这种情况下，与人体骨骼结构相似，其髋部、肩部和手腕处的 3R 关节组件表示为等效的球关节（3 自由度）。另一方面，其脚踝、躯干和颈部的
    2R 关节构成等效的万向节（2 自由度）。假设骨架结构图中的所有机器人连杆都是刚体，然后可以通过以适当方式建立在连杆上的坐标系的位置和方向来计算每个连杆的位置和方向。例如，对于单自由度关节模型、经常使用
    D-H 参数法；对于多自由度关节模型，连杆坐标系建立在其中一个连接关节上。


    运动链中的一个连杆，即“骨盆”连杆，起着特殊作用。仿人机器人的运动链可以用'
