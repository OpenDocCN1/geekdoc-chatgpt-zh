  md: '最初，机器人的定位和地图构建是独立研究的。后来研究人员发现这两个问题是相互依赖的。在进行地图构建之前，机器人需要知道自己的位置，在没有地图的情况下，机器人很难确定自己当前的位置。为了解决这个问题，研究人员提出了同时定位与建图（SLAM）理论。SLAM
    被形象地描述为“鸡和蛋”的问题：机器人需要准确的自身位姿来构建良好的地图，而地图构建又是机器人获得相对距离等位姿信息的关键。图 5-1 展示了导航的三个关键步骤及其之间的关系，定位和地图构建相互融合形成
    SLAM 理论，而 SLAM 理论和路径规划相融合形成主动 SLAM 理论。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_134_0.png)


    移动机器人自主导航是指机器人依靠自身携带的或环境中的各种传感器，在特定环境中根据路径最短、时间最优或能耗最低等准则实现从起始位置移动至目标位置的技术。根据使用的传感器和应用场景的不同，导航方式可以分为以下几类：


    +   （1）惯性导航 惯性导航是早期应用广泛的一种导航方式。它依靠搭载的加速度计和陀螺仪等惯性传感器测量载体的加速度和角速度，通过解算得到位置和速度等信息。惯性导航具有自主性和不受外界环境影响的优点，可以用于军工、航天等领域，在导弹、航天器等的三维空间定位中发挥着重要作用。然而，由于制造误差和温度漂移等因素，惯性导航单独使用会存在累积误差，因此常结合其他传感器如
    GPS 和里程计等进行使用。


    +   （2）卫星定位导航 卫星定位系统（如 GPS）是目前应用最广泛的导航方式之一。GPS 通过卫星发射的信号，实现对地面点的定位，提供高精度的三维坐标信息。然而，GPS
    定位在动态环境中容易丢失信号，在建筑物内信号弱且难以应用，且无法满足实时控制的要求。在此基础上，我国的北斗卫星导航系统不断完善，它具备局部定位的功能，并在陆地、海洋和航空航天等领域得到广泛应用。


    +   （3）光学导航和磁感导航 光学导航和磁感导航是早期用于自动导引车（AGV）的导航方式。通过在地面上铺设特殊的发光或易反光材料、带电导线或预设磁场的磁带，利用机器人下方安装的光传感器或电磁传感器来检测两边传感器的偏差，从而纠正机器人的运动方向误差。


    +   （4）激光导航 激光导航利用激光测距原理，通过测量激光的速度和发射与接收时间来确定物体的位置。激光雷达传感器能够快速、精确地获取目标的三维坐标位置，具有抗干扰能力强、精度高和稳定性好等优点。它在交通通信、资源探测、防震减灾等领域得到广泛应用，但受天气影响较大且价格相对较高。


    +   （5）视觉导航 视觉导航是通过摄像机实时拍摄周围环境，根据图像信息确定机器人的位置和导航参数。早期的视觉导航主要依靠识别人工设定的、简单易识别的标志或路标，具有设备简单、成本低的优点。然而，在复杂、不确定的环境中，其导航精度较低，定位效果不理想。


    # 5.1.1 同时定位与建图理论


    同时定位与建图理论描述了在未知环境中，机器人能否同时确定自身的位置并逐步构'
