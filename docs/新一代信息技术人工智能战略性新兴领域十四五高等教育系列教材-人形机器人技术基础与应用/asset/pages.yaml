  md: '此外，为了梯度更新的稳定，PPO 还对重要性权重进行了裁剪，即


    $$J(\theta) = \sum_{(s_t, a_t)} \min \left[ \frac{p_\theta(a_t|s_t)}{p_{\theta''}(a_t|s_t)}
    A^{\omega}(s_t, a_t), clip \left( \frac{p_\theta(a_t|s_t)}{p_{\theta''}(a_t|s_t)},
    1-\epsilon, 1+\epsilon \right) \cdot A^{\omega}(s_t, a_t) \right] \quad (4-24)$$


    这进一步保证了梯度的稳定更新。


    # 4.1.3 机器人的强化学习控制框架


    机器人控制当中需要控制算法时刻根据机器人自身所处状态做出决策，控制机器人执行特定动作以完成预计任务。无人车需要根据当前路况决定节气门与方向盘控制指令，机械臂需要根据工况控制关节完成对目标物体的各种操作。而对于人形机器人来说，需要通过各类本体与外部感受器在同时维持自身姿态的情况下控制各类执行器完成指定任务。基于强化学习的机器人控制方法更关注机器人与环境的互动过程以及在这个工程中汲取知识的准确性与速度。


    在图 4-1 中，智能体根据当前状态选取一个动作执行，该行为作用于整个环境，环境发生改变后返回下一个时刻的状态用于对下一个动作进行决策，同时产生一个奖励值用于策略优化，策略优化将鼓励未来行为获取最多的奖励。由于动作选择方式的不同以及训练方式的差异，各种强化学习算法之间有较大差异。典型人形机器人基于深度强化学习的运动控制算法框架如图
    4-3 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_111_0.png)


    与传统控制方法类似，基于深度强化学习的运动控制算法框架也是一种反馈控制结构，其中奖励值反馈为算法参数更新所需，控制过程中无需奖励值反馈。信号处理过程、深度强化学习算法以及数据转换过程共同组成了运动框架中的反馈模块，利用观察值反馈生成理想电动机指令。与图
    4-1 相比，这里主要增加了信号处理与数据转换过程，此外由于学习与测试的场景不同，互动环境接收的动作值、反馈的观察值与奖励值也不尽相同。无模型的深度强化学习方法不需要机器人的结构、物理性质等信息，任务信息完全由观察值、动作值以及奖励值来体现。因此，从应用方法上来看，各类强化学习算法的应用方式几乎没有差别，但考虑到实际控制效果与应用范围，现在用于机器人运动控制的强化学习方法多为结合基于值估计与基于策略优化的深度强化学习方法。


    # 4.2 人形机器人运动控制算法设计


    由于目前人形机器人中基于深度强化学习的运动控制算法仍以无模型算法为主，不同运动控制任务的区别往往体现在观察值空间、动作值空间与奖励函数的区别当中，因此不同的算法与任务，其观察值、动作值与奖励函数设计各不相同，即使使用相同的强化学习'
