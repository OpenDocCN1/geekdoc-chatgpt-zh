  md: '# # 第 8 章 人形机器人机构设计


    # ## 导读


    本章从系统角度着重讨论人形机器人机构设计方法，从设计需求出发，确定机器人系统驱动配置方案、传动方式、运动范围、强度刚度需求，一般将人形机器人人机构拆分为腿部、手臂及胸腔三大部分；然后，开始详细设计每部分具体的关节机构、传动机构、支撑结构，再进行结构分析及机构设计优化，将设计的零件生成二维工程图，并确定加工工艺，完成零部件的加工、装配与调试，最后形成人形机器人人系统。


    # ## 本章知识点


    +   - 人形机器人设计要点、基本设计方法与原则

    +   - 人形机器人总体方案设计

    +   - 人形机器人本体的基本组成与结构

    +   - 人形机器人驱动机构与设计

    +   - 人形机器人传动机构与设计

    +   - 人形机器人系统集成机构设计


    # ## 8.1 概述


    人形机器人具有人类的外形特征，是由多自由度组成的非线性强耦合系统，全身包括多个自由度。其结构会对其运动学和动力学计算、平衡及稳定控制产生重要影响。同时，其关节与肢体结构的质量分布、刚度等对人形机器人的性能也会产生重要影响，因此需要在机构设计时统筹考虑。


    根据所要完成任务的不同，人形机器人特定机构在设计上有很大区别。当前主要按上肢、下肢、腰部等不同的部分分开设计。根据任务中主要负载能力、速度、工作空间、精度、工作时长等实际因素影响，面向不同的应用场景，如家庭场景、商用场景、野外场景，机器人的设计构造也不相同。因此，需要满足不同的设计需求，强调目标导向。对于特定的应用需求，其整体尺寸、关节能力、功耗及成本等均是至关重要的影响因素。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '人形机器人人结构设计一般主要包括腿部、手臂及胸腔三大部分的设计，对每部分设计的要求各不相同。具体来说，腿部是机器人的移动机构，因此需要着重关注其承载能力、抗冲击能力、运动的快速性。手臂主要用于完成各种不同作业任务，因此其运动的精度至关重要，设计时需要考虑关节的精度、传动的刚度、运动的重复定位精度等要求。胸腔是连接上下肢及头部的结构，通常需要布置各类传感器、安装电池、控制单元等。因此，在有限的空间与质量要求限制下，需要满足结构稳定、刚度好、质量轻等条件。


    在机器人机构设计常用工具方面，随着工业化水平的不断提升，设计工具也逐步完善。人形机器人机构设计主要涉及的软件也日新月异。机器人属于交叉学科，在设计初期，需要依据人形机器人设计要求，进行关节配置及需求分析，此时需要依据经验及设计，进行计算，需要使用
    MATLAB 等工具。确定机器人设计参数及配置后，将运用 SolidWorks 等三维设计软件，对机器人的零部件进行详细的机构设计，这部分是机器人人机构设计的核心工作。完成机构设计后，需要对零部件进行结构优化设计，多使用
    ANSYS 等仿真分析软件。机器人机构设计完成后，下一步工作是根据现有机构的几何尺寸、质量惯量分布、连接关系进行运动学、动力学分析，使用较多的软件工具包括
    Adams、Vrep 等。


    人形机器人是智能机器人技术的制高点，其机构设计有着更严苛的要求，通常需要满足以下整机设计原则：


    +   1) 满足刚度条件下的轻量化、最小运动惯量原则。由于人形机器人腿部运动需要满足快速性、鲁棒性的要求，且其运动部件多，运动状态经常改变，必然产生冲击和振动，采用最小运动惯量原则，可增加机器人运动平稳性，优化机器人动力学特性。为此，设计时应注意在满足强度和刚度的前提下，尽量减小运动部件的质量，并注意运动部件对转轴的质心配置。


    +   2) 尺度规划优化原则。当需要满足一定工作空间要求时，通过尺度优化选定最小的臂杆尺寸，这将有利于机器人刚度的提高，使运动惯量进一步降低。


    +   3) 刚度设计的原则。设计中，刚度是比强度更重要的问题。要使刚度大，必须恰当地选择杆件剖面形状和尺寸，提高支承刚度和接触刚度，合理地安排作用在臂杆上的力和力矩，尽量减少杆件的弯曲变形。另外，选用高强度材料，对机器人的结构构型进行合理设计，也将提高机器人刚度，增强机器人的稳定能力与负载能力。


    +   4) 可靠性原则。机器人因机构复杂、环节较多，所以可靠性问题显得尤为重要。一般来说，零件的可靠性应高于部件的可靠性，而部件的可靠性应高于整机的可靠性。可以通过概率设计方法设计出可靠度满足要求的零件或结构，也可以通过系统可靠性综合方法评定机器人系统的可靠性。采用模块化的设计既精简了设计流程，也便于维护，是提高机器人可靠性的有效手段。


    +   5) 工艺性原则。机器人是一种高精度、高集成度的自动机械系统，良好的加工和装配工艺性是设计时要遵循的重要原则之一。仅有合理的结构设计而无良好的工艺性，将导致机器人性能降低和成本提高。'
