    # 2. 贝尔曼方程和值函数


    深度强化学习算法中通常包含了策略（Policy），大多数算法中也包含了值函数，又称价值函数（ Value Function）。其中策略表达了智能体会如何选取下一步的动作。而值函数用于对于状态进行评估，即评估智能体进入某个状态后，可以对后面的奖励带来多大的影响。值函数值越大，说明智能体进入这个状态越有利。


    策略是智能体执行动作的依据。强化学习算法的最终目标就是获得最优的策略。当智能体依此策略行事时，能够获得最高的累积奖励。策略的本质是状态 \( s_t \)
    到动作 \( a_t \) 的映射，它决定了智能体的动作。它其实是一个函数，用于把输入的状态变成动作，策略可表示为 \( \pi(a|s) \)。


    强化学习算法需要使用累积奖励值 \( G_t \) 来衡量一个策略的优劣，其定义式为


    ```

    \( G_t = r_{t+1} + \gamma r_{t+2} + \cdots = \sum_{k=0}^{\infty} \gamma^k r_{t+k+1}
    \) (4-2)

    ```


    式中， \( \{r_{t+1}, r_{t+2}, r_{t+3}\cdots\} \) 是一轮学习过程的立即奖励值序列； \( \gamma \) 为折扣因子（Discount
    Factor），在 0 ~1 范围内取值，用来调整未来奖励在当前的重要程度。


    值函数的值是对未来奖励的预测，可用来评估状态的好坏。为了在尽可能短的时间内得到尽可能多的奖励，也要把折扣因子放到值函数的定义中，值函数的定义为


    ```

    \( V_{\pi}(s) = E_{\pi} \left[ \sum_{t=0}^{\infty} \gamma^t r_{t+1} \mid s_t =
    s \right] \) (4-3)

    ```


    式中， \( \pi \) 表示该值函数在使用策略 \( \pi \) 时成立， \( \gamma \) 为折扣因子，同样为 0 ~ 1 的实数，表示未来的奖励在当前要产生折扣，而获得奖励的时间越晚，
    \( \gamma \) 指数越高，奖励折扣越大，体现了对短时间内所获取奖励的重视。该值函数表示了策略 \( \pi \) 在状态 \( s \) 下，未来所能获取总和奖励的期望，反映了状态
    \( s \) 的好坏。


    值得注意的是，式 (4-2) 可进一步推导为


    ```

    \( V_{\pi}(s) = E_{\pi} \left[ \sum_{t=0}^{\infty} \gamma^t r_{t+1} \mid s_t =
    s \right] \)

    \( = E_{\pi} \left[ r_t \mid s_t = s \right] + E_{\pi} \left[ \sum_{t=1}^{\infty}
    \gamma^t r_{t+1} \mid s_t = s \right] \)

    \( = R(s) + \gamma E_{\pi} \left[ \sum_{t=0}^{\infty} \gamma^t r_{t+2} \mid s_t
    = s \right] \)

    \( = R(s) + \gamma E_{\pi} \left[ V_{\pi}(s+1) \mid s_t = s \right] \)

    \( = R(s) + \gamma \sum p(s_{t+1} \mid s_t) V_{\pi}(s+1) \) (4-4)

    ```


    式 (4-4) 就是常见的贝尔曼方程，其中 \( p(s_{t+1} \mid s_t) \) 为策略 \( \pi \) 下的状态转移概率。贝尔'
