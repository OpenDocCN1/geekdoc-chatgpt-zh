    # 4.3 动力学仿真配置与优化


    传统控制算法往往出于计算成本、优化方法等因素使用简化后的模型进行控制，这限制了传统控制算法的理论上限也限制了机器人的运动模式。基于深度强化学习的人形机器人控制方法往往不需要对机器人物理模型结构做巨大的修改，训练过程中机器人的四肢往往都会参与到训练中。但考虑到强化学习训练过程需要采集大量数据，这些数据往往又需要在仿真环境中采集，这与传统控制算法在仿真环境中进行效果验证的目的不同。因此，需要在仿真环境中搭建机器人模型与工作环境，强化学习将针对该模型与环境优化控制策略。完成训练后，控制策略可以很好地适应该模型与模拟环境，但不一定能够很好地适应真实机器人与实际工作环境。为缓解该类问题，需要对机器人模型参数与仿真环境进行进一步处理。


    # 4.3.1 机器人参数设置


    使用深度强化学习方法需要机器人在仿真环境中与环境不停地进行互动，对于单一机器人而言，从零开始学习一个任务的数据收集过程往往需要持续数千小时甚至更久，'
