    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_124_0.png)


    根据仿真环境、任务类型、网络结构以及学习算法的不同，重置的方法与内容也各不相同。现有常用的仿真环境都有着面向基于强化学习的机器人运动控制方法的特定接口，便于机器人进行重置，但对于个别仿真环境来说，强化学习重置过程需要手动编写。对于运动控制任务来说，重置需要对机器人各连杆的位置、姿态、速度、角速度进行重置，且往往需要对惯性进行处理，以防止重置后仍沿重置前的运动趋势进行运动。根据所附加传感器的不同，传感器数据需要置零或填人目标数据。存在记忆缓存的算法，需要对缓存进行清除或存储。具有记忆功能的网络结构也需要对该部分网络参数进行处理，以避免不同周期之间的数据之间产生污染。


    初始状态分布决定了机器人在每周期开始时的状态。对于初始状态分布，通常的选择是始终将机器人置于固定状态。对于具有参考动作的强化学习运动控制而言，可将期望动作加入重置过程中。一个简单的策略是将角色初始化为实际应用中动作的开始状态，并允许它在一个周期的过程中自行演绎直到结束。通过这种设计，策略必须以顺序的方式学习运动，首先学习运动的早期阶段，然后逐步向后期阶段发展。在掌握前面的阶段之前，后面的阶段几乎没有进展。这在后空翻等动作中可能会遇到困难，因为学习落地是角色从跳跃中获得高奖励的先决条件。如果机器人不能成功着陆，跳跃实际上会带来更糟糕的奖励。固定初始状态的另一个缺点是由此带来的探索挑战。该策略只有在访问到某个状态后才会获得回顾性奖励。因此，在访问高奖励状态之前，策略无法了解到该状态是有利的。这两个缺点都可以通过修改初始状态分布来弥补。


    对于许多强化学习任务，固定的初始状态可能更方便，因为初始化机器人使其获得有价值的初始状态分布往往十分具有挑战性。然而，对于运动模仿任务，参考运动提供了信息丰富的状态分布，可以用来指导智能体在训练过程中学习合适的策略。在每一周期的开始，一个状态可以从参考运动中采样，并用于初始化机器人的状态。此策略被称为引用状态初始化。通过从参考运动中采样初始状态，可以使策略在达到理想状态所需的熟练程度之前就能遇到这些状态。例如，学习后空翻的任务，在固定的初始状态下，为了让角色发现在半空中执行完整的旋转将获取高奖励，它必须首先学会完成协调的跳跃动作。然而，为了激励机器人执行这种跳跃，它必须意识到跳跃将获取更高的奖励。但由于运动对起飞'
  merge: -1
