- pgno: 176
  md: '目前，语音识别已经到了应用阶段，人与机器人交流，可以使用成熟的语音识别系统来收集人的语音指令。机器人在开发中经常使用的语音识别系统有科大讯飞语音识别工具包、百度语音识别工具包等。


    # 2. 语言理解


    在多数服务场景中，人形机器人需要按人的指令要求完成任务，如何让人形机器人听懂人类的话语，理解人类的语言表达是至关重要的。由于自然语言的多义性、上下文有关性、模糊性、非系统性和环境密切相关性等原因，自然语言处理是困难问题之一。


    自然语言理解的研究大体上经历了三个时期。20 世纪 60 年代，以关键词匹配为主流，其特点是没有真正意义上的语法分析，主要依靠关键词匹配技术来识别输入句子的意义；在系统中存放了大量包含关键词的模式，每当输入一个句子，系统便查找与之匹配的模式。一旦匹配成功，系统就输出相应的解释，不考虑其他成分对句子意义的影响。20
    世纪 70 年代，以句法语义分析为主流，采用句法 - 语义分析技术，如允许用普通英语和数据库对话的人机接口。20 世纪 80 年代开始走向实用化和工程化，一批商品化的自然语言人机接口系统和机器翻译系统推向了市场。


    目前，自然语言理解包含以下两种基本方法：基于规则的方法和基于统计的方法。基于规则的方法是从语言学的角度出发，将一种语言使用特定的知识表达，形成一个语义知识库，让计算机可以依靠知识库来处理自然语言。常见的语义知识库有
    WordNet 等。该类方法只能从固定规则的语法角度对文本进行分析。基于统计的方法则是运用数学模型从大规模语料库中学习语言规律。一般利用机器学习技术，如支持向量机（SVM）和条件随机场等，通过使用向量空间对输入的自然语言进行建模，文本中每一个词汇都会被表达为一个包含多维特征的向量。


    近年来，随着深度学习的发展，以大语言模型的出现为里程碑，可以对极其庞大的数据进行学习。基于统计学习的自然语言处理模型将不仅是模仿数据的结果与规律，而是更像人类一样，能够从数据中学到深层的特征，真实地理解语言的规律。谷歌在
    2017 年发布的 Transformer 是许多大语言模型的基础，如 BERT（Bidirectional Encoder Representations
    from Transformers）和 GPT（Generative Pre-trained Transformer）等。其中，OpenAI 推出的 GPT
    使用了 Transformer 的解码器部分，专注于生成文本的能力。现如今，GPT-4 已经在全球范围内产生了巨大的影响，广泛应用于教育、医疗、客户服务等领域，大幅提升了工作效率。图
    6-18 所示为基于 ChatGPT 的机器人操作实例。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_176_0.png)


    打招呼


    依次抓取香蕉、订书机、水果刀


    图 6-18 基于 ChatGPT 的机器人操作实例'
