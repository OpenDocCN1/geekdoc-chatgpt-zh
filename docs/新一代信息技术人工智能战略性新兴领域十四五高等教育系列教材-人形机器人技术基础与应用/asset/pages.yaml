  md: "总之，动作值空间也需要结合任务类型和控制算法等特点进行设计。通常而言，动作值空间越大，学习越困难，反之则学习更为容易；完成任务所需序列更长，则学习更为缓慢，有时无法完成学习，反之学习迅速。在一些任务与算法难以确定是否能够达成要求时，可以尝试降低学习难度、缩短任务长度，以验证可行性。在检验算法框架无误后，可以逐渐扩大动作空间并扩展任务长度，进行对算法的精确调整。\n\
    \n# 4.2.4 人形机器人奖励值设计\n\n强化学习的奖励值设计一直是整个强化学习运动控制算法的重点与难点。作为描述整个策略优势与计算神经网络梯度最为重要的数据，强化学习算法奖励值的设定直接影响算法的学习成功率以及最终习得策略的表现好坏。但令人失望的是，目前仍然缺乏一种能够针对各种任务自如设定任务奖励的方法。目前，基于深度强化学习的人形机器人运动控制算法中的奖励值设计仍然依赖研究人员的设计经验以及各类启发式的设计方法。本小节将介绍一些常见的奖励函数设计形式与注意事项，在具体应用中仍然需要根据任务形式与需求构建合理的任务奖励。\n\
    \n最基础的奖励设置方法是为一个任务设计一个最终奖励。在机器人完成任务后获取这份总奖励，在任务执行过程中不获得奖励。这样虽然可以在理论上通过 Q 值不断衰减获取每个时间步的\
    \ Q 值，但在实际任务中，这种方案无法使机器人习得一个复杂的任务。由于奖励过于稀疏，机器人通常在学习过程中无法完成任何一个任务，无法获取任何奖励或奖励过少不足以更新网络参数，最终导致学习失败。因此，在实际任务中，会尽量避免奖励稀疏的问题，往往会采取奖励形式的设计修改、外界信息引入、任务分解等手段缓解此类问题。\n\
    \n通过设计合理的奖励形式，对整个任务执行过程中的状态进行奖励设计是一种常见的方式。在这个过程中，可以对机器人的姿态、速度、关节角度、步高、步频以及其他可以在任务中评价任务完成情况或效果好坏的指标进行评价。不过值得注意的是，相较于关节空间上下限位而言，通过对任务指标进行奖惩也可以对这些指标进行约束，但由于这些约束更类似于鼓励，因此难以保证绝对地完成约束条件，在涉及安全性的问题时需格外注意并进行对应处理。\n\
    \n常见的奖励函数的形式主要有以下几种：\n\n+   (1) 各级范数 范数（Norm）是数学中的一种基本概念。它常被用来度量某个向量空间（或矩阵）中的每个向量的长度或大小。这里以\
    \ \\(C^n\\) 空间为例，\\(R^n\\) 空间类似。最常用的范数就是 \\(p\\)-范数。在 \\(x = [x_1, x_2, \\cdots,\
    \ x_n]^T\\) 情况下，则有\n+   \n+   \\(\\|x\\|_p = (|x_1|^p + |x_2|^p + \\cdots + |x_n|^p)^{1/p}\\\
    ) (4-33)\n\n在 \\(p\\) 不同时，二元函数范数等高线如图 4-15 所示。\n各级范数以 0.0 为基本对称中心。当需要修改对称中心时，只需将公式做相应修改即可。\n\
    \n+   (2) 指数函数 指数函数尤以自然指数函数的使用最为广泛。指数函数图例如图 4-16 所示。"
