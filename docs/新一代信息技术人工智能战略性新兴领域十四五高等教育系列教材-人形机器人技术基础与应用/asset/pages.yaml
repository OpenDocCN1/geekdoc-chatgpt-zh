  md: '期轨迹和地图。然而，这种估计通常存在误差，随时间积累会导致显著的偏差。为了提高系统的准确性，引入后端优化成为关键步骤，它有助于修正这些误差，保证长期定位和映射的准确性。


    后端优化的核心是集束调整（Bundle Adjustment, BA），包括局部 BA 和全局 BA 两种形式。局部 BA 专注于最近获取的一组关键帧及其观测到的地图点，目的是快速优化这些最新元素的位姿和结构信息，以便及时纠正轨迹。全局
    BA 则是针对全局信息进行优化，它涉及所有关键帧和地图点，以实现全局一致性的优化。尽管全局 BA 能够提供最优的位姿估计和地图精度，但由于其计算复杂度较高，通常只在检测到回环时或需要全局地图校准时才执行。位姿图优化是另一种后端优化策略，它通过简化问题为仅优化关键帧位姿而非整个地图来减少计算负担。在位姿图优化中，关键帧被视为图中的节点，它们之间的相对运动作为边来表示。这种方法虽然牺牲了一些精度，但能显著提高计算效率，特别适用于实时应用和大规模环境中的
    SLAM 系统。


    # 1. BA 优化


    BA 本质上是一种优化过程，期望通过调整相机位姿和特征点的空间位置来最小化误差，以获得最优的 3D 模型和相机参数。在 SLAM 系统中，全局 BA 针对所有关键帧的位姿和路标点进行优化，而局部
    BA 在建图后针对当前关键帧及与之共视的关键帧的位姿和路标点进行优化。求解 BA 的代价函数，步骤如下：


    +   1) 空间点 P 通过相机位姿 (R,t) 转换到相机坐标系点 P''

    +   \( P'' = RP + t = [X'' Y'' Z'']^T \)


    +   2) 将 P'' 转换为归一化坐标，便于后续处理，即

    +   \( P_c = [u_c v_c 1]^T = [\frac{X''}{Z''} \frac{Y''}{Z''} 1]^T \)


    +   3) 考虑到畸变参数 (k1,k2)，对归一化坐标进行畸变校正，即

    +   \( \begin{cases} u''_c = u_c(1+k_1r_c^2+k_2r_c^4) \\ v''_c = v_c(1+k_1r_c^2+k_2r_c^4)
    \end{cases} \)


    +   4) 使用相机内参将归一化坐标转换为像素坐标，即

    +   \( \begin{cases} u_s = f_x u''_c + c_x \\ v_s = f_y u''_c + c_y \end{cases}
    \)


    +   5) 式 (5-4) ~ 式 (5-7) 展示了如何从世界坐标系转换到像素坐标系，这个过程可以抽象表示为

    +   \( z = h(x, y) \)


    在式 (5-8) 表示的观测方程中，z 是实际观测值，x 为相机的位姿，即变换的平移 t 和旋转 R，用李群 T 表示，空间中的三维点 P 用 y 表示。重投影误差计算为实际观测值与通过相机模型计算的投影值之差，可表示为'
