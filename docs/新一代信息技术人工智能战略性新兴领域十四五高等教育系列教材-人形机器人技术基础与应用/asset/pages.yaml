  md: '+   1) 关节的角度不应该超过机器人的机械限位。

    +   2) 关节的速度不应该超过机器人电动机的速度约束。

    +   3) 关节的力矩不应该超过机器人电动机的转矩约束。

    +   4) 接触点的地面反作用力应该满足地面摩擦系数决定的摩擦锥约束。

    +   5) 除了脚掌以外，机器人其他部分不应与地面发生碰撞。


    假设 \( q_{min} \)、\( q_{max} \)、\( \dot{q}_{min} \)、\( \dot{q}_{max} \)、\( \tau_{min}
    \)、\( \tau_{max} \) 分别为机器人的关节限位、关节速度限制和关节力矩限制，\( p_{link\_ends\_z} \) 包含了所有连杆两端的位置坐标在世界坐标系
    \( z \) 轴上的投影（即离地高度），地面摩擦系数为 \( \mu \)，则最终可以将路径约束描述为


    ```

    \( q_{min} \leqslant q(t) \leqslant q_{max} \quad (p=1,2,3) \)

    \( \dot{q}_{min} \leqslant \dot{q}(t) \leqslant \dot{q}_{max} \quad (p=1,2,3)
    \)

    \( \tau_{min} \leqslant \tau(t) \leqslant \tau_{max} \quad (p=1,2,3) \)

    \( -p_{link\_ends\_z}(t) \leqslant \mathbf{0} \quad (p=1,2,3) \)

    \( \mathbf{D}(\mu) \mathbf{f}_{toe}(t) \leqslant \mathbf{0} \quad (p=1,3) \)

    \( \mathbf{D}(\mu) \mathbf{f}_{heel}(t) \leqslant \mathbf{0} \quad (p=1,3) \)

    \( \mathbf{D}(\mu) = \begin{bmatrix} -1 & -\mu \\ 1 & -\mu \\ 0 & -1 \end{bmatrix}
    \quad \text{(9-53)} \)

    ```


    连接约束式（9-45）描述了，机器人在不同阶段之间切换时状态量的变化。从起跳阶段到腾空阶段，机器人状态应当保持连续。从腾空阶段到落地阶段，由于存在与地面的碰撞，会导致机器人状态量发生变化。假设碰撞在瞬间完成且为完全非弹性碰撞，那么机器人碰撞前后的广义位置不变，但广义速度发生突变，且碰撞后脚尖与脚后跟的速度为
    0。


    ```

    \( \mathbf{H}(\dot{\mathbf{q}}^+ - \dot{\mathbf{q}}) = \mathbf{J}_{toe}^T \mathbf{f}_{toe}
    + \mathbf{J}_{heel}^T \mathbf{f}_{heel} \quad (p=2, t=t_f) \)

    \( \mathbf{J}_{toe} \dot{\mathbf{q}}^+ = 0 \quad (p=2, t=t_f) \)

    \( \mathbf{J}_{heel} \dot{\mathbf{q}}^+ = 0 \quad (p=2, t=t_f) \quad \text{(9-54)}
    \)

    ```


    由此可以计算得到落地之后机器人的关节速度突变后的结果 \( \dot{\mathbf{q}}^+ \) 为


    ```

    \( \begin{bmatrix} \dot{\mathbf{q}}^+ \\ \mathbf{f}_{toe} \\ \mathbf{f}_{heel}
    \end{bmatrix} = \begin{bmatrix} \mathbf{H} & -\mathbf{J}_{toe}^T & -\mathbf{J}_{heel}^T
    \\ \mathbf{J}_{toe} & \mathbf{0} & \mathbf{0} \\ \mathbf{J}_{heel} & \mathbf{0}
    & \mathbf{0} \end{bmatrix}^\dagger \begin{bmatrix} \mathbf{H} \dot{\mathbf{q}}
    \\ \mathbf{0} \\ \mathbf{0} \end{bmatrix} \quad (p=2, t=t_f) \quad \text{(9-55)}
    \)

    ```


    从腾空阶段到落地阶段的连续约束为


    ```

    \( \dot{\mathbf{q}}^+ = \dot{\mathbf{q}}^{(3)}(t_s) \quad \text{(9-56)} \)

    ```


    最后，根据现有的非线性优化软件，如 GPOPS，PSOPT，CASADI 等，将优化问题按照软件要求进行封装，即可求解完整的跳跃运动轨迹。


    如图 9-22 和图 9-23 所示，期望 G1 机器人从左边的初始站立状态，通过跳跃的方式越过中间的 1.25m 的沟，最终达到右侧的结束站立状态。'
