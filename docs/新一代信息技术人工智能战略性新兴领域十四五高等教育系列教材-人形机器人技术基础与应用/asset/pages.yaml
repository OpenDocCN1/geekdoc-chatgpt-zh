- pgno: 74
  md: '当人形机器人可能遇到的最大扰动幅度已知时，就能得到对应的有效稳定区域。此时，若 ZMP 落在有效稳定区域内，即使受到外界环境的干扰，也无须进行姿态稳定性调整，人形机器人还能够保持自身姿态稳定并维持行走；当
    ZMP 落在稳定区域内，但在有效稳定区域外时，人形机器人在没有外界环境干扰时仍是稳定的，如果受到外界环境干扰，就可能变得不稳定，需要进行姿态稳定性调整；当
    ZMP 落在稳定区域外时，人形机器人将变得不稳定，随时可能倾覆，需要立即对人形机器人姿态进行调整，使 ZMP 尽快回到稳定区域，甚至有效稳定区域内。


    # 4. ZMP 稳定性判据的注意事项和局限


    ZMP 稳定性判据在概念上容易出现一些误解，应用上也有一些局限。


    +   1) ZMP 只能出现在支撑多边形内，不可能出现在支撑多边形外。


    类似于“当 ZMP 位于支撑多边形之外时，人形机器人是不稳定的”这种说法是不准确的。ZMP 概念的提出本就是为了描述动态平衡的，ZMP 的概念与动态平衡的概念是不能分开的。ZMP
    只在人形机器人保持动态平衡（脚掌没有相对地面转动）的状态下存在，当人形机器人不处于动态平衡时，ZMP 也就不存在了。


    如果 ZMP 已经到了支撑多边形的边缘，而继续有外力导致脚面抬起，地面等效作用力的作用点还继续在支撑多边形的边缘，但是由于地面作用力已经不足以平衡外力，所以当前这个地面作用点就不是
    ZMP 了。因此，严格地说，计算 ZMP 的位置时，在得到计算结果后还需要将计算得到的 ZMP 与支撑多边形的位置进行比较。如果计算得到的 ZMP 的位置在支撑多边形之外，那么实际的地面作用力的作用点仍在支撑多边形的边缘，且系统将绕着支撑多边形的边缘转动。


    +   2) ZMP 与压力中心（CoP）的联系和区别。


    在动态平衡的情况下，CoP 和 ZMP 的位置是一致的。当人形机器人处于非动态平衡状态时，ZMP 不存在，而 CoP 处于支撑多边形的边缘。由此可见，ZMP
    可以用来表征系统的动态平衡，而 CoP 则不行。


    +   3) ZMP 稳定性判据应用的局限。


    需要注意的是，ZMP 稳定性判据在以下几种情况下将不再适用：


    +   ① 人形机器人脚掌与地面的接触面积很小。由于 ZMP 稳定性判据的目标是防止机器人脚掌与地面发生相对转动，所以应用条件是人形机器人的脚掌有一定的面积。如果脚掌与地面接触面积很小，如点脚机器人，则
    ZMP 稳定性判据就不再适用。


    +   ② 允许人形机器人支撑腿脚部相对地面转动。如果人形机器人的期望步态是允许发生支撑腿脚掌相对地面转动的，如某些欠驱动机器人，在摆动腿落地前，支撑腿的脚掌就抬起，并且可以形成周期性的行走步态，则
    ZMP 稳定性判据也是不适用的。


    +   ③ 需要判断人形机器人脚底与地面是否有相对滑动时。ZMP 稳定性判据是针对足底相对于地面翻转的失稳状况，而无法判断足底相对于地面平移和旋转的情况。当人形机器人足底与地面的接触摩擦力有限，需要考虑足底接触的相对滑动时，ZMP
    稳定性判据不再适用。


    除以上情况外，当人形机器人在不平坦的地面上行走，以及人形机器人的肢体与外界环境有接触时，ZMP 稳定性判据也不再适用。'
  merge: -1
  img_proc: true
