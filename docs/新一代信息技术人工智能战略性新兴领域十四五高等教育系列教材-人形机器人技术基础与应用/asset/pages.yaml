    2) 滚子链传动。滚子链传动属于比较完善的传动机构，噪声小，效率高，得到了广泛的应用。但是，高速运动时滚子与链轮之间的碰撞产生的噪声和振动较大，所以只有在低速时才能得到满意的效果，即适合低惯性载荷的关节传动。链轮齿数少摩擦力会增加，要得到平稳运动，链轮的齿数应大于
    17，并尽量设计齿的个数为奇数。图 8-10 所示为链传动示例。


    # (7) 绳传动与钢带传动机构


    1) 绳传动。绳传动广泛应用于机器人手爪的开合传动，特别适合有限行程动传递。绳传动的主要优点是，钢丝绳强度大，各方向上的柔软性好，尺寸小，可消除传动间隙。绳传动的主要缺点是，不加预载时存在传动间隙，绳索的蠕变和索夹的松弛会使传动不稳定，多层缠绕绳传动在内层绳索、支承等处损耗能量，效率低、易积尘。


    2) 钢带传动。图 8-11 所示为钢带传动示例。它把钢带末端紧固于驱动轮和被动轮，受摩擦的影响较小，适合有限行程的传动。钢带传动的优点是，传动比精确、传动件质量小、惯量小、传动参数稳定、柔性好、不需润滑、强度高。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_225_2.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_225_3.png)


    图 8-10 链条传动示例


    图 8-11 钢带传动示例


    (8) 杆、连杆与凸轮传动机构 重复完成简单动作的搬运机器人等固定程序机器人，广泛采用杆、连杆与凸轮机构，如图 8-12 所示。例如，从某位置抓取物体放在另一位置。连杆机构的特点是用简单的机构得到较大的位移，而凸轮机构具有设计灵活、可靠性高和形式多样等优点。外凸轮机构是最常见的机构，借助弹簧即可得到较好的高速性能。内凸轮驱动轴要求有一定的间隙，其高速性能劣于前者。圆柱凸轮用于驱动摆杆，而摆杆在与凸轮回转方向平行的面内摆动。设计凸轮机构时，应选用适应大载荷的凸轮曲线（修正梯形和修正正弦曲线等）。


    (9) 流体传动机构 流体传动分为液压传动和气压传动。液压传动可得到高惯性矩。气压传动比其他传动运动精度低，但由于容易达到高速，多数用在完成简易作业的搬运机器人上。液压、气压传动易设计成模块化和小型化的机构。例如，驱动机器人端部手爪由'
