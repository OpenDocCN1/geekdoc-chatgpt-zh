    基于 MEMS 工艺制造的芯片具有低功耗、微型化、智能化、高集成度以及可大批量生产等优点，能够满足人形机器人对于传感器微型化、低功耗以及低成本的需求，在人形机器人领域拥有广阔的应用空间。目前，已有多个机器人产品采用了
    IMU 与其他传感器配合的方式进行感知。比较有代表性的如优必选搭载了高精度惯性导航传感器；小米 Cyberdog 也配备有 IMU，与其他传感器配合使用，以实现实时定位与地图构建；宇树机器人
