  md: '式中，\( (dx, dy) \) 为单个像素点在 \( x \) 轴和 \( y \) 轴方向上的实际物理尺寸。


    联立式 (6-3)、式 (6-5) 和式 (6-7) 可得从世界坐标系到图像像素坐标系的转换关系为


    ```

    \( z_c \begin{bmatrix} u \\ v \\ 1 \end{bmatrix} = \begin{bmatrix} \frac{1}{dx}
    & 0 & u_o \\ 0 & \frac{1}{dy} & v_o \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix}
    f & 0 & 0 & 0 \\ 0 & f & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix} \begin{bmatrix}
    R & T \\ O^T & 1 \end{bmatrix} \begin{bmatrix} x_w \\ y_w \\ z_w \\ 1 \end{bmatrix}
    = M_1 M_2 \begin{bmatrix} x_w \\ y_w \\ z_w \\ 1 \end{bmatrix} \quad (6-8) \)

    ```


    式中，\( M_1 \)、\( M_2 \) 分别为摄像机的内参数矩阵与外参数矩阵。摄像机的内参数包括焦距 \( f \)、\( (u_o, v_o) \)、\(
    (dx, dy) \)，它们不随环境变化。摄像机的外参数包括旋转矩阵 \( R \) 和平移矩阵 \( T \)，它们随着摄像机的移动而变化。


    由式 (6-8) 可知，若 \( M_1 \)、\( M_2 \) 矩阵内参数已知，则由世界坐标点 \( (x_w, y_w, z_w) \) 可求得该点对应的图像上的图像像素坐标
    \( (u, v) \)。将求解摄像机内、外参数的过程称为摄像机标定，其目的是为世界坐标系的三维物点和图像坐标系中的二维像点之间建立起映射关系。摄像机标定的基本思想是给定一组世界坐标系中的已知点，而且这些点对应的成像平面坐标也已知，这样依据式
    (6-8) 便可以建立多个方程以求解未知参数。在人形机器人应用中，摄像机内、外参数标定是非常重要的环节，其标定精度直接影响摄像机工作所产生结果的准确性。


    在实际应用中，若已知物体在图像上的二维像素坐标 \( (u, v) \)，且已知相机的内、外参数矩阵 \( M_1 \)、\( M_2 \)，却不能唯一确定三维空间中的点坐标
    \( (x_w, y_w, z_w) \)，因为 \( z_c \) 未知。针对该问题，可以采用深度视觉相机，如英特尔 Real Sense 等，经深度图像与
    RGB 图像配准后，可直接从深度图像中获取每个像素点对应的 \( z_c \) 值。也可以采用双目立体视觉，基于两台摄像机拍摄的图像获得深度信息，进而重建三维世界中的点。


    以下是以人形机器人抓取物体为应用背景，讲解从视觉检测到机器人抓取规划的过程。在已经完成相机标定的基础上，需要经过 8 个基本流程环节来实现抓取任务，如图 6-12
