  md: '关于 URDF 的更多细节，可查阅与 ROS 相关的书籍。


    # 2. Mujoco 仿真器机器人描述文件 MJCF


    MJCF 是 Mujoco 仿真器提供的一种机器人描述文件格式。MJCF 以 XML 作为文件载体，能描述复杂的动力学系统。MJCF 的模块化设计，使用户能够从简单的小规模模型开始，随后逐步生成更加精细、复杂的模型。MJCF
    与 URDF 的功能类似，但形式上更加简洁，且具有更丰富的表示能力。以下是以一个使用 MJCF 描述的空间二连杆机构：


    ```

    <mujoco model="2R-link example">

    <worldbody >

    <body pos="0 0 1">

    <joint axis="1 0 0" name="joint0" />

    <geom type="capsule" size="0.06" fromto="0 0 0 0 0 -.4" />

    <body pos="0 0 -0.4">

    <joint axis="0 1 0" name="joint1" />

    <geom type="capsule" size="0.04" fromto="0 0 0 .3 0 0" />

    </body>

    </body>

    </worldbody >

    <actuator >

    <general name="joint0_ctrl" joint="joint0" />

    <general name="joint1_ctrl" joint="joint1" />

    </actuator >

    <sensor >

    <jointpos name="joint0_pos" joint="joint0" />

    <jointpos name="jointq_pos" joint="joint1" />

    </sensor >

    </mujoco >

    ```


    其中，第一个关节 joint0 和第二个关节 joint1 的旋转轴分别与世界坐标系的 x 轴和 y 轴对齐。<actuator> 标签下定义了 joint0
    和 joint1 的电动机执行器。<sensor> 标签下定义了 joint0 和 joint1 的关节角度传感器。


    尽管 MJCF 具有比 URDF 更丰富的特性，但 URDF 的使用范围更广，如一些开源动力学库 RBDL、Pinocchio 等支持导入 URDF 并计算动力学信息，现有的机器人描述格式仍然以
    URDF 为主。为此，Mujoco 提供了一个将 URDF 转化为 MJCF 的工具。在编译安装完 Mujoco 可以使用 Mujoco 的 compile
    程序将机器人 URDF 转为 MJCF。


    ```

    compile input.urdf output.xml

    ```


    其中，input.urdf 是待转化的 URDF 文件，output.xml 是输出的 MJCF 文件。


