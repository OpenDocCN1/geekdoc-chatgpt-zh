  md: '![](img/47a2b26fde9e2a8fab8f8289e100ee37_185_0.png)


    图 7-2 利用神经网络进行图像特征提取的过程


    1) 卷积层（convolutional layer），通过卷积操作提取图像中的局部特征。卷积操作使用一组称为滤波器（或卷积核）的权重矩阵在图像上滑动，生成特征图。


    2) 激活函数（activation function）。常用的激活函数是线性整流（Rectified Linear Unit，ReLU）函数。它将卷积层的线性输出转换为非线性。这一步引入了非线性特性，使得网络能够拟合复杂的函数。


    3) 池化层（pooling layer），通过下采样操作减少特征图的尺寸，同时保留重要信息。常见的操作有最大池化（max pooling）和平均池化（average
    pooling）。


    4) 全连接层（fully connected layer）。通常应用于网络的最后几层，特征图被展平并连接到全连接层，用于生成最终的输出。


    其中，卷积操作是神经网络理解图像内容的核心，它通过在输入图像上滑动滤波器来提取局部特征。每个滤波器在滑动过程中与输入图像的局部区域进行点积运算，生成一个特征图，通常表现为一个三维张量，即


    ```

    Feature Map =[Filter1  Filter2  ...  Filter N]   (7-1)

    ```


    式中，N 是滤波器数量，每个滤波器对应一个特征图。多个滤波器可以提取不同的特征，如边缘、纹理和形状。


    CNN 通过层层卷积和池化操作，逐步提取和组合图像的特征。在较低的层次，网络提取的是一些简单的特征，如边缘和角点；在较高的层次，网络逐渐学会识别更复杂的模式和对象，如物体种类和目标位置。这种逐层提取和组合特征的过程类似人类视觉系统的工作机制，人类也是通过从低级特征到高级特征逐渐理解图像内容的。


    # 3. 常见二维视觉任务


    图像分类（image classification）任务的目标是将输入图像分配到预定义的类别中。图像分类任务是计算机视觉基本的任务之一，广泛应用于包括物体识别、人脸识别和场景分类等领域。常见的图像分类数据集包括
    CIFAR-10、ImageNet。


    目标检测（object detection）不仅需要识别图像中的物体类别，还需要确定物体在图像中的位置。常见的目标检测算法包括区域卷积神经网络（Region-based
    Convolutional Neural Network，R-CNN）、只浏览一次（You Only Look Once，YOLO）和单次多框检测器（Single
    Shot Multi-box Detector，SSD）算法。另外，COCO 数据集是常见的用于目标检测任务的数据集。


    图像分割（image segmentation）任务的目标是将图像中的每个像素分配到一个类'
