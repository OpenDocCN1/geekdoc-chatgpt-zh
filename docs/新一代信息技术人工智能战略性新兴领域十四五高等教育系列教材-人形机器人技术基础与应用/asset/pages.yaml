  md: '![](img/47a2b26fde9e2a8fab8f8289e100ee37_130_0.png)


    图 4-25 一种典型传感器的随机噪声示例


    可以看到，传感器回传数据较仿真环境有很大波动，为使学习策略适应这类状况，通常在仿真环境训练时也对此类状况进行模拟，在传感器传回真实值的情况下在数据上加入针对性的噪声以模拟真实情况。编码器、IMU
    等传感器往往加入高斯噪声，噪声的均值与方差根据机器人实际状况估计。此外，根据任务需求，各类外部干扰，如外界推动等，也会在周期中随机产生，以增加算法收集到的数据的多样性。


    在人形机器人行走任务中，行走地形的不同往往对学习任务有着巨大的影响，现有强化学习方法往往采用课程学习的方式逐渐提升算法性能，与之对应的地形类型与难度也会相应改变。因此，常采用各地形类型以训练机器人。


    随机地形的图示如图 4-26 所示，常见地形往往包含凹陷、楼梯、台阶、斜坡以及起伏地形。随着难度提高，各类地形的起伏程度也会不断加大。此外，根据任务要求不同，也可以设计许多其他地形或组合地形用于机器人训练。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_130_1.png)


