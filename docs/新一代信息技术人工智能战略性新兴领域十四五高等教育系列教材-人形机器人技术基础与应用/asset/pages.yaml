    z 轴旋转角度 \( \phi \)；然后，绕当前 y 轴旋转角度 \( \theta \)；最后，绕当前 z 轴旋转角度 \( \psi \)。图 2-10
    中的坐标系 {a} 是旋转 \( \phi \) 角度后得到的新坐标系，坐标系 {b}'
