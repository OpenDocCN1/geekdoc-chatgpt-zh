  md: '了对机器人的运行轨迹进行研究，可对轨迹进行逐步推导，假定机器人只能向前和旋转，把机器人的运行轨迹拆成小段，对相邻时间段的机器人路径进行探索。为方便计算，将相近时间点内的位移设计成直线，将移动距离分别投射到
    \(x\) 轴和 \(y\) 轴，可得


    ```

    \begin{cases} \Delta x = v\Delta t\cos(\theta_i) \\ \Delta y = v\Delta t\sin(\theta_i)
    \end{cases}

    ```


    此时向下推算，为了计算在一段时间内的位移，将每小段时间的位移进行累加，见式（5-31），图 5-18 所示为机器人位移示意图。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_154_0.png)


    ```

    \begin{cases} x = x + v\Delta t\cos(\theta_i) \\ y = y + v\Delta t\sin(\theta_i)
    \\ \theta_i = \theta_i + \omega\Delta t \end{cases}

    ```


    进一步推算，机器人在 \(X_{robot}\) 轴也有速度，将机器人在 \(Y_{robot}\) 轴的位移投射到坐标轴，即


    ```

    \begin{cases} \Delta x = v_x\Delta t\cos\left(\theta_i + \frac{\pi}{2}\right)
    = -v_x\Delta t\sin(\theta_i) \\ \Delta y = v_y\Delta t\sin\left(\theta_i + \frac{\pi}{2}\right)
    = v_y\Delta t\cos(\theta_i) \end{cases}

    ```


    将机器人在 \(X_{robot}\) 的路径轨迹与 \(Y_{robot}\) 的路径轨迹进行叠加，可得到在全向移动情况下机器人的轨迹，即


    ```

    \begin{cases} x = x + v\Delta t\cos(\theta_i) - v_x\Delta t\sin(\theta) \\ y =
    y + v\Delta t\sin(\theta_i) + v_y\Delta t\cos(\theta) \\ \theta_i = \theta_i +
    \omega\Delta t \end{cases}

    ```


    这种计算方法假定短时间内机器人的移动是线性的，这样计算虽然简便，但不精确。更准确的方法是假定机器人在相邻时间内的移动是圆弧，同样按照前面的方法进行计算。圆弧的半径为


    ```

    r = \frac{v}{\omega}

    ```


    此时假定旋转速度不为 0，则机器人当前位置为


    ```

    \begin{cases} x = x - \frac{v}{\omega}\sin\theta_i + \frac{v}{\omega}\sin(\theta_i
    + \omega\Delta t) \\ y = y - \frac{v}{\omega}\cos\theta_i - \frac{v}{\omega}\cos(\theta_i
    + \omega\Delta t) \\ \theta_i = \theta_i + \omega\Delta t \end{cases}

    ```


    虽然这种方法更加精确，但计算更加复杂，因此 ROS 中常用的是假定为直线的计算'
