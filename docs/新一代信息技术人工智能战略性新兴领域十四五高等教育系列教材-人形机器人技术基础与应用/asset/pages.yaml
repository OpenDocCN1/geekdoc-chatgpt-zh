    # 附录 C 自主导航系统的安装与使用


    下面对本书第 5 章提到的自主导航系统的安装及使用进行介绍。首先，该系统建立在 Ubuntu 20.04 系统之上，关于 Ubuntu 系统的安装方法不再赘述，其依赖
    ROS Noetic、PyTorch 以及 TensorBoard 等常用工具；接下来，介绍这些常用工具的安装方法。注意，以下命令皆在 Ubuntu 系统终端内执行。


    # 1. 依赖项安装


    +   (1) ROS Noetic 的安装


    ```

    $ wget http://fishros.com/install-O fishros && . fishros

    ```


    +   (2) PyTorch 的安装


    ```

    $ pip3 install torch torchvision torchaudio

    ```


    +   (3) TensorBoard 的安装


    ```

    $ pip3 install tensorboard

    ```


    # 2. 自主导航系统安装及训练


    +   (1) 克隆算法库


    ```

    $ cd~

    ```


    ```

    $ git clone https://github.com/reiniscimurs/DRL-robot-navigation

    ```


    +   (2) 编译工作区


    ```

    $ cd~/DRL-robot-navigation/catkin_ws

    ```


    ```

    $ catkin_make_isolated

    ```


    +   (3) 开启终端进行设置


    ```

    $ export ROS_HOSTNAME=localhost

    ```


    ```

    $ export ROS_MASTER_URI=http://localhost:11311

    ```


    ```

    $ export ROS_PORT_SIM=11311

    ```


    ```

    $ export GAZEBO_RESOURCE_PATH=~/DRL-robot-navigation/catkin_ws/src/multi_

    ```


    ```

    robot_scenario/launch

    ```


    ```

    $ source~/.bashrc

    ```


    ```

    $ cd~/DRL-robot-navigation/catkin_ws

    ```


    ```

    $ source devel_isolated/setup.bash

    ```


    +   (4) 开始训练


    ```

    $ cd~/DRL-robot-navigation/TD3

    ```'
