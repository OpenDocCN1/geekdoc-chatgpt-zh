    # 1.3 系统组成与关键技术


    # 1.3.1 系统组成


    与一般机器人相比，人形机器人有从功能结构、物理结构、仿生结构三个层面的系统组成方式。


    +   1. 人形机器人系统的功能结构组成


    从功能结构组成上来看，人形机器人系统主要包括类人本体构型、类人决策系统、类人控制系统、类人感知系统、类人行走系统和类人作业系统，如图 1-16 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_18_3.png)


    # 图 1-16 人形机器人的功能结构组成


    (1) 类人本体构型 在进行人形机器人的本体构型设计时，需尽可能模仿人类的外形和功能，以实现自然的运动和高度灵活的操作能力。人类的身体结构和运动机制经过长期的进化，提供了许多有价值的设计灵感。例如：人类通过眼睛、耳朵、鼻子等感知器官'
