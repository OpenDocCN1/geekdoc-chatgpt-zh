    # 4.3.2 环境参数随机化


    通过对现实中的机器人进行建模，再在仿真环境中进行训练，可以有效学习到机器人在现实世界中所需的各类技能。但由于现实中的传感器噪声、环境的变化以及许多机器人参数的误差导致了仿真中训练的各种策略难以直接部署在现实环境中。为此，需要提高策略的鲁棒性，以应对这类问题。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '最为常见的解决方法为环境参数的随机化，其中包含了机器人物理参数的域随机化，还有传感器参数、外界干扰以及外界环境的随机化模拟。


    域随机化是当前环节仿真到现实跨越的常用方法之一。能够完全访问的环境（即仿真环境）为源领域，状态转移方程为 \( p^*(s_{t+1} | s_t, a_t)
    \)，将模型转移的目标环境称为目标领域（即现实环境），状态转移方程为 \( \hat{p}(s_{t+1} | s_t, a_t) \approx p^*(s_{t+1}
    | s_t, a_t) \)。由于建模和其他形式的校准误差，在模拟中成功完成任务的行为一旦部署到现实世界中就可能不成功了。此外，深度强化学习方法容易利用模拟器的特性来实现在现实世界中不可行的行为。因此，解决方案之一是不在一个特定的动态模型下训练策略，而是训练一个可以在各种不同的动态模型下执行任务的策略。首先，可引入一组动力学参数
    \( \mu \) 来参数化仿真的动力学特性 \( p(s_t | a_t, s_t, \mu) \)，然后将目标修改为最大化动态模型分布 \( \rho_\mu
    \) 的期望奖励，即


    ```

    \( E_{\mu \sim \rho_\mu} \left[ E_{\tau \sim p(\tau | \mu)} \left[ \sum_{t=0}^{T-1}
    r(s_t, a_t) \right] \right] \quad (4-34) \)

    ```


    通过训练策略以适应环境动态中的可变性，所得到的策略可能会更好地推广到现实世界的动态中。


    在人形机器人运动控制中，主要对仿真环境的物理参数进行随机化。研究表明，递归策略可以适应不同的物理动力学。一组物理动力学特性包括但不限于：物体的质量和尺寸、机器人身体的质量和尺寸、关节的阻尼、摩擦、PID
    控制器的增益（P 项）、关节限制、动作延迟。部分涉及视频及图像处理的任务，也会对物体的位置、形状和颜色、材料纹理、光照条件、图像中添加的随机噪声，以及模拟器中相机的位置、方向和视场等进行随机化。


    域随机化的方法主要在于扩大策略的适应范围，提高其策略鲁棒性。当现实环境参数范围能够被域随机化的范围覆盖时，在仿真中训练的策略理论上可以直接在现实中进行部署，域随机化的示意图如图
    4-24 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_129_0.png)


    仿真数据分布往往与真实数据分布并不重合，学习算法却常常通过仿真数据获取各类技能。为使这类技能也可以在现实环境中应用，可以使策略在随机化后的环境中训练，随机化后的数据分布往往可以覆盖到部分真实的数据分布，这也使得学习策略在适应随机环境后也可以在真实场景中进行应用。


    除以上域随机化的参数外，部分算法也将观察值噪声作为随机化的重要部分，但与上述物理参数随机化不同。物理参数随机化后通常在一个训练周期内保持不变，使策略在新的周期内适应恒定不变的参数改变，而观察值噪声则模拟了机器人各类传感器本身的高频噪声，这类噪声带来的干扰在一个周期内的每个时间步上各不相同。图
    4-25 所示为一种典型传感器的随机噪声示例，无论是编码器还是 IMU，其噪声往往呈高斯分布并伴有一定程度的漂移，根据传感器精度与工作环境的不同，其表现形式会略有不同，可根据机器人实际状况添加噪声。'
