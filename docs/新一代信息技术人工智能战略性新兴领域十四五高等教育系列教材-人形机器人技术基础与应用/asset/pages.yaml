    IMU 可助力人形机器人实现姿态控制、平衡维持等需求，是辅助人形机器人实现双足运动的可行性最高的方案。IMU 中的 3 轴陀螺仪和 3 轴加速度计可以测量物体在三维空间中的角速率和加速度，是人形机器人保持平衡及运动控制的关键传感器，可以帮助人形机器人实现姿态控制、平衡维持、导航定位等需求，且能有效规避障碍物遮挡问题和复杂运动的执行问题。


