    # 2. 使用 Unitree SDK2 进行数据通信


    人形机器人是一个复杂的系统，如何高效地获取众多关节电动机和传感器的数据是控制应用开发中需要考虑的问题。尽管在仿真设计中可以直接调用 Mujoco 仿真器提供的应用程序接口（Application
    Programming Interface，API）来获取传感器数据和实现电动机控制，但是这不利于控制程序在实物机器人上的部署。这是因为仿真器与机器人实物的
    API 通常存在较大差异，仿真器中获取数据和控制电动机的方式在机器人实物上并不适用。因此，可以借助一些数据通信工具（如 ROS、DDS 等）来连接不同的 API，统一数据结构。这样用户在实现运动控制应用时，就可以方便地在仿真和机器人实物之间切换验证，提高开发效率。'
  merge: -1
  img_proc: true
