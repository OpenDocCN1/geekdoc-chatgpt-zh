  md: '# 2.1.1 刚体旋转


    +   1. 位置描述


    在使用坐标进行代数运算时，所有的坐标向量都应该在同一坐标系下。首先建立一个直角坐标系 {0}，如图 2-1 所示，则空间中任一点 P 的位置可以用 3×1
    的列向量，即位置向量 $^0\mathbf{P}$ 表示为


    $$^0\mathbf{P} = \begin{bmatrix} p_x \\ p_y \\ p_z \end{bmatrix}$$


    式中，$p_x$、$p_y$ 和 $p_z$ 是点 $P$ 在坐标系 $\{0\}$ 中的 3 个坐标分量，$^0\mathbf{P}$ 的左上标 $0$
    代表选定的参考坐标系 $\{0\}$，$^0\mathbf{P}$ 称为位置向量。除了直角坐标系之外，也可以用球坐标系或者圆柱坐标系来描述空间中点的位置。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_29_0.png)


    +   2. 旋转描述


    为了表示两个刚体之间的相对位置和姿态，在每个刚体上附带一个坐标系，然后指定这些坐标系之间的几何关系。讨论一个坐标系相对于另一个坐标系的姿态问题时，应先研究平面内的旋转问题，然后推广到三维空间。


    (1) 平面内的旋转 图 2-2 所示为两个坐标系之间的相对姿态，其中坐标系 {1} 是由坐标系 {0} 旋转 $\theta$ 角后得到的。或许表示这两个坐标系之间相对姿态的一个最明显的方法是仅指定旋转角度
    $\theta$，但该表示方法有两个明显的缺点。第一，从相对姿态到 $\theta$ 角的映射在 $\theta=0$ 的邻域内不连续，特别是当 $\theta=2\pi-\varepsilon$
    ($\varepsilon$ 表示无穷小量) 时，姿态的微小变化会使得 $\theta$ 角产生很大的变化，例如，一个角度为 $\varepsilon$ 的转动会使得
    $\theta$ 角以“环绕”方式变为 0；第二，这种表示方法不能被很好地扩展到三维空间。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_29_1.png)


    指定姿态的一个稍微不太明显的方式是，指定坐标系 {1} 各轴相对于坐标系 {0} 的坐标向量，即


    $$^0_1\mathbf{R} = [^0\mathbf{x}_1 \quad ^0\mathbf{y}_1]$$


    式中，$^0\mathbf{x}_1$ 和 $^0\mathbf{y}_1$ 分别是单位向量 $x_1$ 和 $y_1$ 在坐标系 $\{0\}$ 中的对应坐标。此类型的矩阵
    $^0_1\mathbf{R}$ 被称为旋转矩阵（Rotation Matrix）。下面讨论旋转矩阵的一系列特殊性质。


