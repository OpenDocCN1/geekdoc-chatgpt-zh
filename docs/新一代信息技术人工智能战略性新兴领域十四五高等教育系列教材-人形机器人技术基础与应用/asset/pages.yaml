    人形机器人的控制任务极其复杂，通常涉及多个层次和多种类型的控制问题。想象一个人形机器人正在一个工厂车间工作，它需要在一个狭窄的工作台上进行精细的焊接操作。在这个任务中，人形机器人不仅要保持自身的平衡，还要精确控制焊接工具的位置和方向，以确保焊接质量。在这个过程中，人形机器人需要同时处理多个优先级不同的任务：最高优先级任务是保持平衡，这是一切任务的基础；焊接操作是主要任务，而手臂动作的自然平滑程度是次要任务。例如，如果人形机器人在焊接过程中失去平衡，不仅会导致焊接质量问题，还可能损坏焊件或工具。在某些极端工况下，人形机器人可以牺牲手臂控制的平滑程度来保证焊接工作的质量。


    还有一个更加实际的控制例子，即控制人形机器人的行走任务。对于行走，可以将整体控制任务分为 4 个小任务，按照任务的优先级从高到低分别为：支撑腿不打滑任务、机身转动控制任务、机身平动控制任务、摆动腿轨迹跟随任务。由于人形机器人支撑腿与地面建立稳定可靠的接触是整个控制算法的前提条件，因此支撑腿不打滑任务被设定为最'
