  md: '# 第 5 章 人形机器人导航


    # 导读


    人形机器人导航涉及同时定位与建图（Simultaneous Localization and Mapping, SLAM）、定位技术和路径规划技术，使人形机器人能够在未知或动态环境中生成地图、确定自身位置，并规划出最优路径，从而实现导航控制。本章首先介绍
    SLAM 的基本原理和算法，并通过具体实例展示 SLAM 在人形机器人导航中的应用，接着介绍全局路径规划和局部路径规划的不同策略及其实现方法，最后通过多个实际应用实例，介绍人形机器人导航技术在不同场景下的具体应用。


    # 本章知识点


    +   - 人形机器人导航概述

    +   - 同时定位与建图

    +   - 人形机器人路径规划

    +   - 人形机器人导航应用实例


    # 5.1 概述


    人形机器人导航是人形机器人研究中的一个核心问题，涉及如何在已知或未知环境中从起点移动到目标点。经典导航方法包括启发式导航、端到端导航及其他常见方法等。启发式导航方法基于图搜索和启发式函数，适用于静态环境中的路径规划；端到端导航方法则利用深度学习和强化学习技术，直接从传感器输入生成控制输出；其他常见方法包括基于贝叶斯理论的定位和行为学方法，它们在特定场景下表现优异。通过深入理解这些导航方法，可以掌握人形机器人在不同环境中实现自主导航的基本策略和技术。人形机器人在现实环境中必须拥有导航能力，因此对经典导航方法的了解是非常必要的。


    移动机器人实现自主导航涉及 Durrant-Whyte 和 Leonard 提出的三个基本问题：定位、地图构建和路径规划。定位指的是精确测量人形机器人在当前环境中的位置和姿态；地图构建是将通过各种传感器感知到的局部环境信息整合成一个统一且一致的地图；路径规划是在已知地图的基础上计算出一条最优路径，使人形机器人能够到达目标点。'
