    $$\phi = \text{Atan2}(-r_{13}, r_{23}) \tag{2-33}$$


    $$\psi = \text{Atan2}(r_{31}, -r_{32}) \tag{2-34}$$


    因此，存在两组取决于 $\theta$ 正负符号的解。


    第二种情况，如果 $r_{13} = r_{23} = 0$，那么 $\boldsymbol{R}$ 是正交矩阵，意味着 $r_{33} = \pm 1$，以及
    $r_{31} = r_{32} = 0$。所以，矩阵 $\boldsymbol{R}$ 为


    $$\boldsymbol{R} = \begin{bmatrix} r_{11} & r_{12} & 0 \\ r_{21} & r_{22} & 0
    \\ 0 & 0 & \pm 1 \end{bmatrix} \tag{2-35}$$


    如果 $r_{33} = 1$，那么 $\cos\theta = 1$，并且 $\sin\theta = 0$，所以 $\theta = 0$。这种情况下，式
    (2-27) 变为


    $$\begin{bmatrix} \cos\phi\cos\psi - \sin\phi\sin\psi & -\cos\phi\sin\psi - \sin\phi\cos\psi
    & 0 \\ \sin\phi\cos\psi + \cos\phi\sin\psi & -\sin\phi\sin\psi + \cos\phi\cos\psi
    & 0 \\ 0 & 0 & 1 \end{bmatrix} = \begin{bmatrix} \cos(\phi+\psi) & -\sin(\phi+\psi)
    & 0 \\ \sin(\phi+\psi) & \cos(\phi+\psi) & 0 \\ 0 & 0 & 1 \end{bmatrix}$$


    因此，$\phi$、$\psi$ 之和为


    $$\phi + \psi = \text{Atan2}(r_{11}, r_{21}) - \text{Atan2}(r_{11}, -r_{12}) \tag{2-36}$$


    由于在这种情况下只能确定 ($\phi + \psi$)，因而存在无数组可能的解。此时可按惯例指定 $\phi = 0$。如果 $r_{33} = -1$，那么
