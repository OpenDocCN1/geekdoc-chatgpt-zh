  md: '而得到机器人动力学方程。而拉格朗日法则是基于能量的角度来分析机器人的动力学。对于同一个机器人，两者得到的动力学方程是相同的。


    首先从分析动能开始进行能量分析，对于机器人的第 $i$ 个连杆，其动能可以表示为


    \(k_i = \frac{1}{2} m_i {}^0v_{C_i}^T {}^0v_{C_i} + \frac{1}{2} {}^i\omega_i {}^C
    I_i {}^i\omega_i\)


    式中，等号右侧的两项分别代表由连杆的线速度（质心处）引起的动能和由连杆的角速度（同为质心处）引起的动能。整个机械臂的动能是所有连杆的动能之和，即


    \(k = \sum_{i=1}^n k_i\)


    而机器人的动能又可以与之前的惯性矩阵 \(M(q)\) 建立等式。对于 6 关节机器人，6 连杆的动能可以由 \(6 \times 6\) 矩阵 \(M(q)\)
    与关节角速度建立关系式，即


    \(k(q, \dot{q}) = \frac{1}{2} \dot{q}^T M(q) \dot{q}\)


    从物理力学可知，物体的总动能总是为正值，所以惯性矩阵 \(M(q)\) 为正定矩阵。


    然后研究机器人的势能。对于机器人的第 $i$ 个连杆，其势能可以表示为


    \(u_i = -m_i {}^0g {}^0P_{C_i} + u_{\text{ref}_i}\)


    上式中的 ${}^0g$ 是 $3 \times 1$ 的重力加速度矢量，${}^0P_{C_i}$ 则是第 $i$ 个连杆的质心的相对位置矢量。为了使势能最小为
    0，取一常数为 \(u_{\text{ref}_i}\)。则整个机械臂的势能是所有连杆的势能之和，即


    \(u = \sum_{i=1}^n u_i\)


    因为 ${}^0P_{C_i}$ 是第 $i$ 个连杆的质心的相对位置矢量，则 ${}^0P_{C_i}$ 应该是关节角的函数。机械臂的整体势能可以表示为
    \(u(q)\)，它是各关节位置的标量函数。


    当得到机器人的动能和势能后，进一步推导、计算，得到拉格朗日函数，即


    \(L(q, \dot{q}) = k(q, \dot{q}) - u(q)\)


    通过拉格朗日函数得到机器人的驱动力矩，即


    \(\frac{d}{dt} \frac{\partial L}{\partial \dot{q}} - \frac{\partial L}{\partial
    q} = \tau\)


    对于机械臂，该方程式也可以表示为


    \(\frac{d}{dt} \frac{\partial k}{\partial \dot{q}} - \frac{\partial k}{\partial
    q} + \frac{\partial u}{\partial q} = \tau\)


    综上所述，通过计算机器人的动能和势能，再代入拉格朗日函数中整理，可得机器人的动力学方程，这就是由拉格朗日法推导机器人的动力学方程。'
