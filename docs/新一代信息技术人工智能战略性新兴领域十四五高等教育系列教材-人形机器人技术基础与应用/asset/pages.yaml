  md: 'ZMP 越靠近稳定区域的中心，与稳定区域边界的最短距离就越大，即稳定性裕度越大，人形机器人此时的姿态也就越稳定。对于凸多边形的稳定区域，最稳定的子区域是一条直线或者一个点。如果想要使人形机器人时刻都保持其
    ZMP 在最稳定的子区域上，人形机器人的运动必将受到限制，因为人形机器人的稳定程度是与其步行速度、肢体运动范围、能量消耗等因素密切相关的。单纯地追求高稳定性，势必造成人形机器人的行动迟缓或肢体运动幅度过大等负面效果。这就要求人形机器人既能有一个相对较高的稳定性，又不对运动造成太大限制，于是就产生了人形机器人行走稳定性的另一个量化概念，有效稳定区域。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_73_0.png)


    # 图 3-2 稳定区域和稳定性裕度


    有效稳定区域是指稳定区域内的一个子区域，处于该子区域内的所有 ZMP 对应的稳定性裕度大于外界环境干扰导致的该 ZMP 位置的变化量。有效稳定区域可以用数学表达式描述，即


    $\Omega = \{(x_{zmp}, y_{zmp}) | d_s(x_{zmp}) \geqslant d_v(x_{zmp}), d_s(y_{zmp})
    \geqslant d_v(y_{zmp})\}$ (3-9)


    式中，$d_s(x_{zmp})$、$d_s(y_{zmp})$ 分别表示 ZMP 坐标系中 $x$ 方向和 $y$ 方向的稳定性裕度；$d_v(x_{zmp})$、$d_v(y_{zmp})$
    分别表示干扰造成的 ZMP 位置在 $x$ 方向和 $y$ 方向的变化量，如图 3-3 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_73_1.png)


    # 图 3-3 稳定区域和有效稳定区域


    记 $T_i$ 为人形机器人第 $i$ 部分受到的干扰外力，$S_i$ 为原点到外力 $T_i$ 作用点的向量，$N_i$ 为人形机器人第 $i$ 部分受到的干扰外力矩，可以得到
    $d_v(x_{zmp})$、$d_v(y_{zmp})$ 的表达式为


    $d_v(x_{zmp}) = \frac{\sum_i (S_{iz} \times T_{ix} - S_{ix} \times T_{iz}) + \sum_i
    N_{iy}}{\sum_i m_i (\ddot{z}_i + g) + \sum_i T_{iz}}$ (3-10)


    $d_v(y_{zmp}) = \frac{\sum_i (S_{iz} \times T_{iy} - S_{iy} \times T_{iz}) + \sum_i
    N_{ix}}{\sum_i m_i (\ddot{z}_i + g) + \sum_i T_{iz}}$ (3-11)


    式中，下角标中的 $x$、$y$ 分别代表该向量在 $x$ 方向、$y$ 方向的分量。'
