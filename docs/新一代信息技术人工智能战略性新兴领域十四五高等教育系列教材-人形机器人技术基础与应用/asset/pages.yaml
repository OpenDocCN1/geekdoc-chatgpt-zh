- pgno: 126
  md: '这需要多种手段来加速这个过程。目前采用的方法多为在仿真中进行训练的同时对仿真环境进行加速以及同时使用多台机器人同时采集数据，以缩短数据采集时间。由于基于深度强化学习的机器人控制多集中于运动控制策略，在训练过程中仿真环境往往也更为关注机器人模型的物理与碰撞属性，因此可靠的物理属性与碰撞边界是强化学习训练过程所不可缺少的。但精准的碰撞边界会大幅增加仿真器的计算难度并延长训练时间，因此如何平衡学习过程中的训练效率与模型的精准度是需要格外关注的，往往需要根据实际情况与控制效果在机器人模型各类参数的精准程度与模型简化带来的效率提升之间进行取舍。


    为提高训练速度，强化学习训练时往往利用简化后的机器人碰撞模型进行数据收集工作。与准确的机器人模型相比，简化后的机器人碰撞模型常采用仿真环境所提供的标准几何体组合而成。常用的标准几何体包括长方体、球体、圆柱体、圆锥体以及胶囊形状的几何体等，不同仿真器可能会略有差别。相比于复杂的三角网格图，对这些标准几何体的模拟会快速且节约资源得多。因此，对于较少与外部接触或碰撞的机器人连杆会以这些基础几何体构成，而对于需要时刻与外部互动的机器人连杆，如足端等，就需要使用三角网格图或较为精准的几何体。以某人形机器人为例，其简化前与简化后的模型如图
    4-20 所示（机器人视觉特征与碰撞属性一致）。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_126_0.png)


    可以看到，使用精准视觉贴图的机器人模型更为真实，其细节、纹理更为丰富。而经简化的机器人模型看上去较为怪异，连杆与连杆之间甚至会出现空隙。虽然机器人模型简化方式并不统一，但除特定任务需求外，对于机器人碰撞模型通常不要求所有连杆组成的模型没有空隙，在对学习后的效果没有影响的情况下，碰撞模型往往是越简洁越好，这样仿真器模拟的难度更低、效率更高。


    除碰撞属性外，机器人关节的物理属性也需要确定。由于其数据难以提前确定，所以实际工作中往往在选取目标机器人之后采集实际中的关节响应数据进行对比，通过在仿真中与现实中发出相同的控制指令，对比仿真中的指令响应曲线与现实中的指令响应曲线的区别，估计实际机器人关节的物理属性。


    实际操作中，往往采取阶跃脉冲响应和正、余弦信号响应，以及一些特殊任务需求的一些轨迹作为参考指令。图 4-21 展示了典型信号在 PD 控制器下的响应曲线。'
