    +   1) 高精度：Cartographer 使用先进的定位和建图算法，能够在各种复杂环境中实现高精度的定位和建图。

    +   2) 实时性：Cartographer 能够实现实时的定位和建图，适用于移动机器人在动态环境中的应用。

    +   3) 开放源代码：Cartographer 是一个开源项目，用户可以自由获取源代码并根据需要进行修改和定制。


    总体来说，Cartographer 作为激光 SLAM 领域的经典方法，为移动机器人在实际应用中的定位和建图问题提供了一种高效、可靠的解决方案，对于推动 SLAM
    技术的发展和应用具有重要意义。


    # 2. ORB-SLAM3


    ORB-SLAM3 是西班牙萨拉戈萨大学开源的一款经典的视觉 SLAM 系统，其系统框架图如图 5-5 所示。它是 ORB-SLAM 系列的第三个版本，在前两个版本的基础上进行了改进和优化，以提供更好的定位和建图性能。该系统是能够使用单目、立体、RGB-D
    相机，兼容针孔以及鱼眼相机模型进行视觉、“视觉 + 惯性导航”和多地图的综合性 SLAM 方案。


