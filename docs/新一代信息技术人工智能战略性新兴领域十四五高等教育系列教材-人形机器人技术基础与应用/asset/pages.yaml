- pgno: 172
  md: '能和低维间耦合。单台人形机器人通常在手腕和脚踝部位各配备两个六维力传感器，总计使用量为四个。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_172_0.png)


    人形机器人为实现类人般精细、协调的动作控制，尤其是在执行抓取、搬运、操作以及与环境交互等任务时，对力的感知和控制要求极高。而六维力传感器以其高精度、多维度的力和力矩测量能力，成为人形机器人实现精细操作的关键组件。


    在人形机器人上，力传感器主要安装在关节处、手腕部及脚踝部。关节处一般使用一维力传感器；在手腕、脚踝处使用六维力传感器。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_172_1.png)


    +   1) 关节力矩传感器。力矩传感器能够感知并度量力，可对机械部件扭转力矩进行感知，将力矩的物理变化转换成电信号，具有精度高、频响快、寿命长等优点，可应用于人形机器人关节。在机械臂关节的减速器输出端安装关节力矩传感器可以带来两点优势：解耦机械臂的动力学模型，有利于进行基于动力学的位置控制；有利于实现力控制。


    关节力矩传感器（力检测元件）与电动机（关节执行元件）相距较近，排除了机械臂机械惯性的影响。先进的传感系统将使机器人能够对机器人手臂上的任何变化做出快速而平稳的反应。


    +   2) 手腕部。为模拟人手的精细操作能力，人形机器人的每个手腕关节通常配置一个六维力传感器，用于实时监测手部与物体接触时的力或力矩，这对于实现精准抓握、力控装配、触觉反馈等功能至关重要。


    +   3) 脚踝部。人形机器人行走过程中，脚踝处的六维力传感器负责感知足部与地面的接触力或力矩，这些数据对于机器人保持平衡、步态调整以及适应各种地形条件至关重要。


    # 2. 触觉传感器


    皮肤是最重要的人体器官之一，具有延展性、自愈性、高机械韧性等特征，可以对各种形状和纹理、温度以及接触压力等进行感知。模仿人类皮肤的特征以及具备相似感知功能的设备通常被称为电子皮肤（E-skin）。根据电子皮肤所能实现的功能可以将其分为温度传感器、触觉传感器等柔性传感器。电子皮肤一般由电极、介电材料、活性功能层、柔'
