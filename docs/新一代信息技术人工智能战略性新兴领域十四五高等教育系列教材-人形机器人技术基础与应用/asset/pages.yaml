    DQN 算法更新时，都会随机抽取一些之前的经历进行学习。该过程类似于监督学习中的采样一小批数据进行训练的过程。此外，随机抽取这种做法也打乱了训练数据之间的相关性，有利于深度学习学习技能。


    上面提到了打乱训练数据之间的相关性，有利于强化学习学习技能，主要原因在于相邻时间段内强化学习的探索活动往往会局限在一个小范围内，收集到的数据相似与相关性过大，采集连续的数据进行训练容易使神经网络时刻向各自时间段的数据方向过拟合，导致无法完成训练。随机抽取数据可以缓解这一问题，但由于深度强化学习训练所需的数据来源于神经网络选择的动作，即使采用了打乱数据顺序与
    ε 贪心算法的以一定概率选择随机动作来探索，强化学习算法仍然容易陷入局部最优解中无法脱离。为解决此类问题，深度 Q 算法也使用了固定目标网络的方法。


    固定目标网络指在 DQN 算法中使用两个结构相同但参数不同的神经网络，评估网络具备最新的参数，而目标网络使用的参数则是一段时间以前的。目标网络也会定期更新参数，其更新方式就是直接将评估网络的参数复制过来。训练完毕后，使用目标网络作为状态
    - 动作值函数进行预测。这样，目标网络与评估网络就有了差别，其中评估网络用于探索，参与 ε 贪心算法生成不同状态动作对的 Q 值，目标网络用于状态的估计。当评估网络的参数未进行同步时，其探索的动作与评估所使用的策略不同，进一步降低了探索过程中数据的相关程度。


