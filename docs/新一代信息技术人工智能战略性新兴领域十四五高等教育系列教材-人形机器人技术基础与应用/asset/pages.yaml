  md: '$k$ 是核的大小，用于计算候选点坐标 $x$ 和 $y$ 周围的信息，$w$ 和 $h$ 分别表示核的宽度和高度。从式（5-36）中选择 IDLE
    得分最小的 POI 作为本地导航的最佳航点。


    # 5.4.2 局部导航


    在基于规划的导航堆栈中，局部运动遵循局部规划器的策略完成动作。在这种方法中，使用神经网络运动策略替换这一层。局部导航策略通过深度强化学习（DRL）在模拟环境中单独训练完成。


    如图 5-22 所示，用于训练运动策略的神经网络架构基于双延迟深度确定性策略梯度（TD3）网络架构。TD3 是一个参与者 - 评论家网络，允许在连续动作空间中执行动作。局部环境由机器人前方
    180° 范围内的激光读数描述。此信息与相对于机器人位置的航点的极坐标相结合。组合数据用作 TD3 参与者网络中的输入状态 $s$ 。参与者网络由两个完全连接（FC）层组成。这些层之后紧接着是整流线性单元（ReLU）激活。然后，最后一层连接到输出层，其中有两个动作参数
    $a$ ，表示机器人的线速度 $a_1$ 和角速度 $a_2$ 。对输出层应用 tanh 激活函数，将其限制在（-1，1）范围内。在环境中应用动作之前，它会根据最大线速度
    $v_{\max}$ 和最大角速度 $\omega_{\max}$ 进行缩放，即


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_158_0.png)


    ```

    $$a = \left[ v_{\max} \left( \frac{a_1+1}{2} \right), \omega_{\max} a_2 \right]$$
    (5-39)

    ```


    由于激光数据仅记录机器人前方的数据，因此不考虑向后运动，并将线速度调整为仅正值。状态 - 动作对 $Q(s,a)$ 的 $Q$ 值由两个评论家网络评估。两个评论家网络具有相同的结构，但它们的参数更新被延迟，从而允许参数值出现分歧。评论家网络使用一对状态
    $s$ 和动作 $a$ 作为输入。状态 $s$ 被输入到完全连接层，然后进行 ReLU 激活，输出为 $L_s$ 。该层的输出以及动作分别被输入到两个大小分别为
    $\tau_1$ 和 $\tau_2$ 的独立变换完全连接层（TFC）。然后按如下方式组合这些层，即


    ```

    $$L_c = L_s W_{\tau_1} + a W_{\tau_2} + b_{\tau_2}$$ (5-40)

    ```


    式中，$L_c$ 是组合全连接层（CFC），$W_{\tau_1}$ 和 $W_{\tau_2}$ 分别是 $\tau_1$ 和 $\tau_2$ 的权重；$b_{\tau_2}$
    是层 $\tau_2$ 的偏差。然后将 ReLU 激活应用于组合层。之后，它连接到具有 1 个参数（表示 $Q$ 值）的输出。选择两个评论家网络的最小 $Q$
    值作为最终评论家输出，以限制对状态 - 动作对值的高估。'
