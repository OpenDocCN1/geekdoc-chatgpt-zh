    # ## 6.3 人形机器人外部传感器


    视觉传感器、力 / 触觉传感器以及听觉传感器是人形机器人在与环境交互中必不可少的传感器。本节将重点从传感器检测原理、类型以及应用方面对其进行讲解。


    # ## 6.3.1 视觉传感器


    人类约 80% 的信息是通过人眼感知获取的，人形机器人也和人类一样，大量信息都将通过视觉感知获取。视觉感知系统是人形机器人系统的重要组成部分，在复杂的三维场景中利用视觉传感器可以获取周围环境信息，执行视觉识别和判断任务。2D
    图像无法提供环境空间形貌、几何尺寸、位姿等信息。因此，目前多数人形机器人选用 3D 视觉方案以保证获取更多精准的三维信息，助力实现更复杂、更智能的环境感知与交互任务。空间三维测量示意图如图
    6-9 所示。3D 视觉成像技术通过使用相关仪器来获取物体的图像数据信息，然后再对获取的数据信息进行分析处理，利用三维重建的相关理论重建出真实环境中物体表面的轮廓信息。当前主流的
    3D 立体视觉方案为飞行时间（TOF）法、双目视觉法、结构光法、激光扫描法等，其中前三种最常用。


    1) 飞行时间法：利用信号在两个被反射面之间往返的飞行时间来测量节点间的距离，其代表有微软 Kinect-2 等。


    2) 双目视觉法：指从不同的视点获取两幅或多幅图像重构目标物体 3D 结构或深度的信息，立体视觉 3D 可以通过单目、双目、多目实现，其代表有 Leap Motion、ZED、大疆等。


    3) 结构光法：通过近红外激光器，将具有一定结构特征的光线投射到被拍摄物体上，再由专门的红色摄像头进行采集。发射出来的光经过一定的编码投射在物体上，通过一定算法计算返回编码图案的畸变来得到物体的位置和深度信息。其代表有奥比中光、微软
    Kinect-1、英特尔 Real Sense 等。


    4) 激光扫描法：通过激光雷达发射激光束探测目标的位置、速度等特征量，获得目标距离、位置、速度、形状等信息，从而对被测物体进行探测、跟踪和识别。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_167_0.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_167_1.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_167_2.png)


    图 6-9 空间三维测量示意图


    人形机器人视觉感知系统由硬件系统和软件系统组成，硬件系统包括视觉传感器、视'
