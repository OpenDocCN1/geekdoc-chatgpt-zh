    的数学表达，并且提供了在水平地面上计算 ZMP 坐标的公式。将式 (3-6) 变形可得其标量计算公式为


    ```

    \(x_{\text{ZMP}} = \frac{\sum_{i}^n m_i (\ddot{z}_i + g)x_i - \sum_{i}^n m_i \ddot{x}_i
    z_i - \sum_i I_{iy} \dot{\Omega}_{iy}}{\sum_{i}^n m_i (\ddot{z}_i + g)}\)

