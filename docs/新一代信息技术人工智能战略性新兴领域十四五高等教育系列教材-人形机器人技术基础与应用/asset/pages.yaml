  md: '置，$H_{min}$ 是髋关节在双脚支撑中同时时刻的位置，则 $z_h(t)$ 的约束条件为


    ```

    \[z_h(t) = \begin{cases} H_{min}, t = KT_c + 0.5T_d \\ H_{max}, t = KT_c + 0.5(T_c
    - T_d) \\ H_{min}, t = (K+1)T_c + 0.5T_d \end{cases} \quad (3-54)\]

    ```


    同样，可以由三次样条插值法，得到满足式（3-53）并且二阶导数连续的轨迹。


    人形机器人行走时，前进方向的运动 $y_h(t)$ 是影响稳定性的主要因素之一。与从期望的 ZMP 轨迹出发得到 $y_h(t)$ 的方法不同，本小节使用如下的轨迹规划方法：


    +   1）生成一系列平滑的 $y_h(t)$ 。


    +   2）选择具有最大稳定性裕度的 $y_h(t)$ 作为最后的轨迹。


    一个行走周期可以分为三个阶段：①起始阶段，人形机器人的运动速度由 0 加速到期望的速度；②稳定行走阶段，人形机器人以期望的速度行走；③结束阶段，人形机器人从期望的速度减速行走至速度为
    0。


    在稳定行走阶段的一个步行周期中， $y_h(t)$ 可以分为单脚支撑和双脚支撑两个阶段。


    设 $y_{sd}$ 和 $y_{ed}$ 分别代表单脚支撑阶段开始和结束时髋关节到支撑脚的踝关节在 $y$ 方向的距离，于是可以得到


    ```

    \[y_h(t) = \begin{cases} (K+1)D_s - y_{sd}, t = KT_c + T_d \\ (K+1)D_s + y_{ed},
    t = (K+1)T_e \\ (K+2)D_s - y_{ed}, t = (K+1)T_c + T_d \end{cases} \quad (3-55)\]

    ```


    为了得到周期性的平滑躯干轨迹，还必须满足约束条件，即


    ```

    \[\begin{cases} \dot{y}_h(KT_c) = \dot{y}_h((K+1)T_c) \\ \ddot{y}_h(KT_c) = \ddot{y}_h((K+1)T_c)
    \end{cases} \quad (3-56)\]

    ```


    通过三次样条插值，可以得到满足式（3-55）、式（3-56）的 $y_h(t)$，即


    ```

    \[y_h(t) = \begin{cases} KD_s + \frac{D_s - y_{ed} - y_{sd}}{T_d^2 (T_c - T_d)}
    [(T_d + KT_c - t)^3 - (t - KT_c)^3 - T_d^2 (T_d + KT_c - t) + T_d^2 (t - KT_c)]
    + \frac{y_{ed}}{T_d} (T_d + KT_c - t) + \frac{D_s - y_{sd}}{T_d} (t - KT_c), t
    \in (KT_c, KT_c + T_d) \\ KD_s + \frac{D_s - y_{ed} - y_{sd}}{T_d (T_c - T_d)^2}
    [(t - KT_c - T_d)^3 - (T_c + KT_c - t)^3 - (T_c - T_d)^2 (T_c + KT_c - t) - (T_c
    - T_d)^2 (t - KT_c - T_d)] + \frac{D_s - y_{sd}}{T_c - T_d} (T_c + KT_c - t) +
    \frac{D_s + y_{ed}}{T_c - T_d} (t - KT_c - T_d), t \in (KT_c + T_d, (K+1)T_c)
    \end{cases} \quad (3-57)\]

    ```'
