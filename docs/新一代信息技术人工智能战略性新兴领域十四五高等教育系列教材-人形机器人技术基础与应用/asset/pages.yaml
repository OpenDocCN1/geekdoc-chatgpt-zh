- pgno: 235
  md: '# 第 9 章 人形机器人运动控制实践


    # 导读


    本章首先介绍了人形机器人运动控制系统的基本概念，同时详细介绍了人形机器人运动控制系统的整体构成；接着以宇树 G1 人形机器人为例，介绍如何在 Mujoco
    仿真环境中搭建人形机器人系统，并实现仿真控制；最后，在所搭建的宇树 G1 人形机器人仿真环境的基础上，介绍实现人形机器人平衡站立、行走、复杂地形行走和跳跃任务的实现方法和控制实例。


    # 本章知识点


    +   - 人形机器人运动控制系统概述

    +   - 人形机器人运动控制系统仿真

    +   - 人形机器人运动控制实例


    # 9.1 概述


    人形机器人拥有类似人类的外形和结构，因此能够执行包括行走、搬运和操作工具在内的一系列任务。这种与人类相似的功能为人形机器人开辟了广泛的应用前景，如在医疗领域辅助手术、在工业领域承担体力劳动等。然而，完成这些高复杂度的任务，需要机器人的各部分组件默契配合，这对运动控制系统提出了较高要求。例如，在人形机器人行走时，需要考虑如何协调各个关节的运动，如何根据传感器感知到的信息对行走策略做出调整，以及如何应对未知环境对机器人的影响等。因此，本章将以宇树
    G1 人形机器人为例，面向人形机器人的行走、跳跃等任务，深入介绍人形机器人运动控制系统的实践开发。对于人形机器人控制系统的实践开发，主要可分为系统集成和运动控制算法设计两部分。


    系统集成是指将机器人电动机、惯性测量单元（IMU）、摄像头、激光雷达等硬件进行整合，使其成为能够执行特定任务的完整机器人系统。人形机器人系统如图 9-1 所示。为降低开发成本，在运动控制系统开发初期通常会事先在仿真环境中进行机器人系统的集成。运动控制系统的各部分组建和控制算法在仿真环境中验证无误后再迁移至机器人'
  merge: -1
  img_proc: true
- pgno: 236
  md: '实物，这一过程也被称为仿真到实物（Sim to Real）。因此，选择模拟准确、功能匹配的机器人仿真器有助于提高机器人运动控制系统开发的效率。目前，常用的机器人仿真器主要有
    Mujoco、Gazebo、Pybullet 等。其中，Mujoco 由于其丰富的接口、高效且精确的仿真性能成为近年来人形机器人开发最常用的仿真工具之一。此外，人形机器人是一个集成多种硬件的复杂系统，各部分组件的数据互通也是系统集成需要考虑的问题。选择合适的数据通信工具，可以有效提高机器人系统的开发效率和控制算法的运行效率。目前机器人开发常用的通信工具有机器人操作系统（Robot
    Operating System，ROS）、数据分发服务（Data Distribution Service，DDS）、轻量级通信与数据封送库（Lightweight
    Communications and Marshalling，LCM）等。其中，DDS 是一种为实时、可靠、高性能的数据通信提供的网络协议标准，目前已广泛应用于机器人、自动驾驶等领域。Unitree
    SDK2 是宇树公司采用 DDS 作为消息中间件开发的一套用于宇树 G1、H1 等人形机器人产品的开发套件。Unitree SDK2 除了能用于开发宇树公司旗下的系列机器人产品外，还提供了一套专用于人形机器人和足式机器人的数据格式和通信协议。使用
    Unitree SDK2 不仅能提高人形机器人控制程序开发的效率，还便于仿真到实物的迁移。本章 9.2 节内容主要面向人形机器人运动控制实践开发，介绍所需要使用的工具，以及如何在
    Mujoco 仿真环境中构建人形机器人系统，并使用 Unitree SDK2 实现与机器人的各部分硬件的数据通信。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_236_0.png)


    图 9-1 人形机器人系统


    人形机器人模仿了人类的运动特点，相较于其他类型的机器人，能够实现复杂度更高的运动，被视为最理想的机器人形态之一。平衡站立、行走和跳跃是人类具有的最基本的运动能力，因此也是人形机器人首要解决的控制问题。图
    9-2 所示为人形机器人行走控制示例。人形机器人是一个高维度、强耦合、强非线性的切换系统，其控制算法的开发具有较高的技术难度，主要体现在如下方面：


    +   1）人形机器人自由度多，以宇树 G1 人形机器人为例，具有 23 关节电动机（不含手指关节）。协调各个关节的运动，实现机器人实现站立、行走等任务是一个复杂的过程。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/47a2b26fde9e2a8fab8f8289e100ee37_237_0.png)


    图 9-2 人形机器人行走控制示例


    +   2) 人形机器人动力学模型是一个多刚体浮动基座模型，各个关节之间的运动相互耦合，具有高度复杂和非线性的数学形式。如何进行准确的建模分析，并设计控制策略是一项技术挑战。


    +   3) 人形机器人在执行行走、跳跃等动作时，其接触模态是不断变化的，并且始终处于静不稳定状态，这要求控制器的稳定性和鲁棒性必须达到较高的水准。


    因此，为了最大限度地发挥人形机器人的运动潜力，设计并开发稳定且鲁棒的运动控制算法成为一个迫切需要关注和解决的问题。近年来随着优化控制算法和机器人硬件技术的发展，人形机器人的控制逐渐由零力矩点（ZMP）、弹簧倒立摆模型控制等基于简化模型的方法转向模型预测控制（Model
    Predict Control，MPC）、轨迹优化（Trajectory Optimization）、全身控制（Whole Body Control，WBC）等性能更为全面的控制方法。MPC
    能够充分考虑人形机器人在一段时间内的足端接触模态变化，使得机器人在一段时间的轨迹跟踪误差最小。轨迹优化算法则能够根据给定的控制指标，如能量最小、时间最优等，计算出控制人形机器人完成任务所需的最佳控制量。WBC
    能够充分考虑机器人驱动特性和动力学特性，根据控制任务的不同优先级进行分层控制，协调机器人的运动。本章 9.3 节将介绍使用 MPC、轨迹优化、以及 WBC
    等控制方法，实现人形机器人在保持平衡站立、行走、复杂地形行走以及跳跃等任务的控制策略。


    # 9.2 仿真系统集成


    # 9.2.1 仿真环境构建


    +   1. Mujoco 仿真器


    Mujoco 仿真器是一款免费、开源的高性能物理引擎，广泛应用于机器人学、生物力学、计算机图形学以及动画制作等领域。Mujoco 仿真器能够模拟复杂的物理现象，如刚体动力学、接触检测、肌肉和关节的行为等，并且支持实时仿真。在设计上它考虑了可扩'
  merge: -1
