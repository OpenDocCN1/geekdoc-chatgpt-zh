    规范化对象坐标空间（Normalized Object Coordinate Space，NOCS），是基于深度学习的类别级 6D 物体位姿估计的先驱方法，为类别内所有可能的对象实例引入了一个共享的规范表示。在
    NOCS 中，首先，使用预训练的实例分割算法从输入的 RGBD 图像中分割出目标物体；然后，使用基于区域的神经网络预测 NOCS 表征；接下来，使用 Umeyama
