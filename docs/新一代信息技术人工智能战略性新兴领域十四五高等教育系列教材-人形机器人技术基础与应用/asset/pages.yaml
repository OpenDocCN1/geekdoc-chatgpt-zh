    \\ \dot{\theta} \\ \dot{\psi} \end{bmatrix}\)  (3-65)

    ```


    人形机器人在平稳行走过程中，横滚角 \(\phi\) 以及俯仰角 \(\theta\) 的数值很小，基本在 0 附近波动，即 \(\phi \approx
