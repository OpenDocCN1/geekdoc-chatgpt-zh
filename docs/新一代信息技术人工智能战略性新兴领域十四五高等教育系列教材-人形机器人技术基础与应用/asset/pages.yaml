- pgno: 90
  md: '基于机器学习的步态规划为人形机器人提供了一种强大的途径，以适应多样化的任务和环境。通过不断的学习和适应，人形机器人的行为可以变得更加智能和高效。然而，确保模型的泛化能力和处理大量数据的能力是实现这一目标的关键挑战。


    # 3.4 行走控制


    # 3.4.1 模型预测控制


    人形机器人作为机器人的最理想的通用形式，一直以来受到众多研究者青睐。但人形机器人具有高维、非线性、欠驱动等特点，实现其动态的、稳定的行走控制具有较大的技术难度。目前，人形机器人传统控制方法主要有
    ZMP 控制、基于弹簧倒立摆（Spring-Loaded Inverted Pendulum，SLIP）模型控制以及模型预测控制（Model Predictive
    Control，MPC）。ZMP 控制和 SLIP 模型控制都可以实现人形机器人的稳定运动，但是对于工厂或户外等对人形机器人稳定性、灵活性有更高需求的非结构化场景，具有较大的局限性。相对于
    ZMP 控制和 SLIP 模型控制，模型预测控制可以处理多变量控制问题，可以显式地考虑输入和状态的约束，通过滚动优化能够更好地处理系统的不确定性和抗外部干扰。


    # 1. 模型预测控制简介


    如图 3-12 所示，模型预测控制本质上是采用优化方法来解决问题的，其主要思想是根据系统当前状态，利用模型预测系统未来的发展 y_k，并选择一个最优的控制输入
    u_k。对于控制，这里的模型可以是利用物理规律推导的机理模型，也可以是基于数据驱动得到的经验模型。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_90_0.png)


    在生活中经常应用这类算法，如下棋，无论是下象棋还是下围棋，都有它自身的规则，在过去、现在还是未来，都遵循一样的游戏规则，规则就可以看作 MPC 中的预测模型。当需要走下一步时，往往不是只看当下的这一步，而是会根据游戏规则，想到后续的几步，然后确定当前最好的的一步棋，这便是
    MPC 的思想。


    # 2. 单刚体模型


    考虑到人形机器人系统具有高维、非线性特点，如果预测模型采用较复杂的动力学模型，优化求解对硬件算力要求高，一般的硬件平台很难满足控制实时性的要求，且在实际应用时对模型结构参数更为敏感。因此，需要对系统模型进行合理的简化，并且使简化模型能够充分反映系统动力学特征。考虑到一般的人形机器人系统具有腿的质量相对于躯干较小的特点，腿部带来的非线性力影响可忽略不计。本书采用一种单刚体模型来描述系统模型，可以大大降低模型复杂程度和减少后续优化求解耗时。人形机器人的理想单刚体模型是将整个机器人假设为一个刚体，通过两个足端与环境交互，它通过受到的外力和外力'
