    # ## 7.3 三维视觉感知技术


    # ### 7.3.1 三维点云


    点云（point cloud）是一种重要的三维数据表示形式，具备广泛且多样的应用，涵盖了从逆向工程、机器人导航到地理信息系统、虚拟现实和增强现实等多个领域。在逆向工程中，点云数据被用于精确地重建物体的三维模型，为产品设计、改进和制造提供关键信息。在机器人导航中，点云数据被用来感知环境，检测障碍物，并实现自主导航。在地理信息系统中，点云数据被用于地形建模、城市规划以及地质勘探等任务，为城市规划和自然资源管理提供重要支持。此外，在虚拟现实和增强现实应用中，点云数据被用来创建逼真的三维场景，提供沉浸式的用户体验。随着技术的不断进步，点云数据的应用前景将更加广阔。


    点云是指由大量散布在三维空间中的点所构成的数据集合。点云可以表示为一组点的集合 \( P = \{P_i | i=1, \cdots, n\} \)。其中，\(
    P_i \) 是一个描述点坐标 \( (x, y, z) \) 和特征的向量。点特征包含点的颜色 \( (r, g, b) \)，所在表面法向量 \( n=(n_x,
    n_y, n_z) \) 等。如图 7-15 所示，点云中的每个点都描述了其位置、颜色及法向量（灰色箭头所示方向）。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_195_0.png)


    图 7-15 点云数据示例


    点云数据通常通过四种方式获取：①激光雷达扫描。它是获取点云常用的方法之一，其工作原理是通过发射激光脉冲并测量其返回时间来计算与目标点之间的距离，从而得到目标点的三维坐标。②结构光扫描。它是利用投射到物体表面的光图案（如条纹、网格或'
