  md: '到机器人的足部轨迹，最后通过逆运动学计算腿部各关节的轨迹。不预先设定 ZMP 轨迹方法的思路是按某种算法给定一系列的机器人关节轨迹（如腰部和足部轨迹）作为备选，求解这些轨迹对应的
    ZMP 轨迹，从中遴选出 ZMP 轨迹稳定性裕度最大的备选轨迹作为人形机器人的最终关节轨迹。除基于 ZMP 稳定性判据的步态规划方法外，还有一些其他步态规划方法在人形机器人中得到了应用。一种常用的方法是基于落脚点或捕获性来规划轨迹，这种方法一般先根据运动状态计算期望的落脚点位置，再根据落脚点位置规划关节轨迹。


    人形机器人在实际环境中运动时，可能出现人形机器人运动环境与规划假定环境不同或产生未知情况，如遭受外力干扰、地面状况变化、伺服控制误差等。如果此时机器人仍然机械地按照预先规划好的轨迹执行，不对所规划的轨迹进行实时调节，机器人很可能会倾倒。因此，必须根据人形机器人当前状态和环境信息，对规划轨迹或驱动力或力矩进行实时调节，使机器人能保持稳定并完成期望的运动目标，这就是人形机器人的运动控制。人形机器人的运动控制对机器人的稳定性、抵抗扰动能力和适应复杂环境能力具有重要意义。


    # 3.2 稳定性分析


    由于人形机器人具有单双脚支撑阶段交替出现、质心高的特点，所以如果人形机器人的运动规划或运动控制不合理，在行走过程中就很容易跌倒。稳定性是保证人形机器人顺利行走的前提，稳定性判别是人形机器人运动研究中的一个重要课题。


    人形机器人行走中的稳定性一般是指人形机器人运动过程中不跌倒，在遇到扰动后回到原状态的能力。人形机器人受到的扰动既包括内部的扰动，如驱动误差、机械结构的微小变化等，又包括外部环境的扰动，如崎岖的地面、与其他物体的接触等。理想的机器人在遇到扰动后应能使身体保持平衡、不跌倒，并逐渐恢复到扰动前的平稳行走步态。但是根据人形机器人的机械结构限制与控制方法，人形机器人能克服的扰动有一定的限度。当扰动过大时，人形机器人便会跌倒。稳定性判据是判断机器人在扰动下是否能够保持稳定行走、不跌倒的依据，既是衡量稳定性的重要依据，也是人形机器人步态规划和行走控制设计的准则，在人形机器人运动研究中具有重要作用。


    # 3.2.1 ZMP 稳定性判据


    # 1. ZMP 的定义


    零力矩点（ZMP）是一个理论上的点，在这个点上，人形机器人与地面接触的垂直力产生的力矩与地面相关的所有外力和力矩之和为 0。这个点通常位于人形机器人足部的底部投影内。ZMP
    的位置反映了人形机器人质量分布和运动状态的平衡，是评估其稳定性的关键指标。


    # 2. ZMP 的数学表达及计算


    ZMP 的位置可以通过动力学方程和人形机器人的运动学参数来计算。其基本公式为'
