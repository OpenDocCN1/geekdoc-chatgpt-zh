  md: '```

    $p=f(q)$


    \(\dot{p}=\frac{\partial f(q)}{\partial q}v=Jv\)


    \(\ddot{p}=J\dot{v}+\dot{J}v=\ddot{p}_{des}\)


    \(J\dot{v}=\underbrace{\ddot{p}_{des}-\dot{J}v}_b\)


    (9-6)

    ```


    针对跟踪三维轨迹的单任务场景，且 \( A \) 可逆时，可以直接计算出 \(\ddot{v}_{des} = A^{-1}b\) ；然后代入动力学方程求解，得到关节控制量
    \(\tau\) 。值得注意的是，这里是在关节加速度空间中考虑如何执行控制任务。


    实际情况是机器人需要同时完成多个任务，导致这种方法无法满足需求。因此可以采用优化视角来看待刚才的问题，把控制任务表示为如下二次规划问题：


    ```

    \(\min_{v,\tau} \| \tau \|^2\)


    s.t. \(M(q)\dot{v}+c(q,v)=\tau\)


    \(Av=b\)


    (9-7)

    ```


    该二次规划问题的含义是在满足机器人动力学约束和轨迹跟踪约束的前提下，给定关节的运动参考轨迹，计算出 2- 范数二次方最小的关节控制量 \(\tau\) 。采用优化视角可以完成更复杂的人形机器人控制任务。


    # 3. 人形机器人控制原理


    人形机器人属于欠驱动的浮动基机器人，不同于机械臂，其动力学方程变成


    ```

    \(M(q)\dot{v}+c(q,v)=u+J_c^T(q)f_c\)


    (9-8)

    ```


    式中，\(u \in R^2\) ，为关节力矩（注意，前 6 个分量为 0 表示 6 自由度的浮动基不能被直接驱动）；\(M(q)\) 为其关节空间惯性矩阵；\(c(q,v)\)
    包含离心力、科里奥利力和重力；\(f_c\) 为外部接触力；\(J_c\) 为其雅可比矩阵。


    接触模型：针对宇树 G1 人形机器人，在每个脚掌选择四个接触点，采用多边形摩擦锥近似来优化每个接触点的力，遵循库仑摩擦约束。图 9-12 所示为宇树 G1
    人形机器人的脚掌接触模型，假设接触点定义在活动支撑多边形的凸包上。每个摩擦锥由四个基向量 \(\beta_{c,i} \in R^3\) 近似，这些基向量构成锥的凸子集。有效的接触力用负权重向量
    \(\rho_c \in R^4\) 编码，映射关系为


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_256_0.png)


    ```

    \(f_c=[\beta_{c,1} \quad \beta_{c,2} \quad \beta_{c,3} \quad \beta_{c,4}]\rho_c\)


    (9-9)

    ```


