  md: '矩作用来改变自身运动状态。相对于复杂系统模型，基于单刚体模型的模型预测控制能够在实现人形机器人稳定行走的同时，降低硬件平台算力要求。


    如图 3-13 所示，根据刚体的质心动力学，单刚体模型的数学形式见式（3-61）、式（3-62）、式（3-63），式中所有物理量均在世界坐标系中表示。\(
    m \) 为机器人质量；\( I \) 为机器人转动惯量矩阵；\( g = [0 \ 0 \ 9.81]^T \) 为重力加速度矢量；\( \omega \in
    R^3 \) 为机器人角速度；\( p_c \in R^3 \) 为机器人质心位置；\( p_i \in R^3 \) 为机器人小腿与足底连接点位置；\(
    f_i \in R^3 \) 为机器人足端受到环境的合外力，作用点在小腿与足底连接点；\( \tau_i \in R^3 \) 为机器人足端受到环境的合外力矩。\(
    \tau_i \) 的维数会根据机器人足底类型变化，常见类型有三种：足底接触面积极小，可近似为点接触，此时合外力矩可忽略不计；足底接触面积比较窄，可近似为线接触，此时无法产生滚转的力矩，\(
    \tau_i \in R^2 \)；当足底接触面积足够大时，为面接触，可产生三维合力矩，\( \tau_i \in R^3 \)。\( \hat{\omega}
    \) 表示 \( \omega \) 的斜对称矩阵。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_91_0.png)


    ```

    \(\ddot{p}_c = \frac{\sum_{i=1}^n f_i}{m} - g\)  (3-61)

