    （4）其他奖励函数类型 通常来说，在设计奖励函数时，会尽量控制奖励函数衡量任务指标时保持连续且可导的状态，并且期望在任务指标更为敏感的区域，对应奖励函数的导数也更大。这有利于学习策略关注于奖励波动与影响更大的部分，利于学习策略的训练。'
