    在预测出质心高度和机器人角动量后，可以在一个长度为 \( T \) 的预测窗口内对这些方程进行积分。这里使用 0.02s 的积分步长对预测窗口内的水平质心轨迹进行数值积分。预测的支撑点被转换为一系列
    \( K \) 个凸支撑多边形及其在预测窗口中的相应时间间隔。为了确保动态可行的计划，中心压力必须始终位于活动支撑区域内。这是通过在每个支撑间隔的中点优化两个中心压力（一个位于其中点，受限于活动支撑多边形；另一个位于其末端，受限于活动支撑和下一个的交集）来实现的。通过线性插值得到的
    \( N=2K \) 个点，保证了中心压力始终在凸支撑区域内。联合优化中心压力为


    ```

    \( z = [x_{\text{CoP,0}} \quad y_{\text{CoP,0}} \quad x_{\text{CoP,1}} \quad y_{\text{CoP,1}}
    \quad \dots \quad x_{\text{CoP,N}} \quad y_{\text{CoP,N}}]^T \) (9-26)

    ```


    预测窗口末端的最终水平质心位置和速度为


    ```

    \( \xi_T = [x_{\text{CoM,T}}^T \quad \dot{x}_{\text{CoM,T}}^T]^T \) (9-27)

    ```


    同样，采用优化观点把 CoM 和 CoP 规划表为一个二次规划问题，得


    ```

    \(\min_{z, \xi_T} (A_T \xi_T - c_T)^T W_T (A_T \xi_T - c_T) + (z-c)^T W_c (z-c)
    + (Fz)^T W_v (Fz)\)

    \(\text{s.t.} \quad x_{\text{CoP,0}} = x_{\text{CoP}}^i\)

    \(x_{\text{CoM,T}} + A_p z + b_p = x_{\text{CoM}}^i\)

    \(x_{\text{CoM,T}} + A_v z + b_v = \dot{x}_{\text{CoM}}^i\)

    \(x_{\text{CoP,n}} \in C_n \quad \forall n \in [0, N-1]\) (9-28)

    ```


    式中，\( A_T \xi_T \) 为捕获点。第一个目标是使最终捕获点接近最后支撑多边形的质心 \( c_T \)。目标的第二项鼓励每个 CoP 接近其各自约束多边形的质心。目标的第三项惩罚较大的
    CoP 速度，\( F \) 是有限差分矩阵。\( W_T \)、\( W_c \) 和 \( W_v \) 是相应的目标权重矩阵。为了确保控制输出的连续性，等式约束包括初始
    CoP 位置以及初始水平质心位置 \( x_{\text{CoM}}^i \) 和速度 \( \dot{x}_{\text{CoM}}^i \)。矩阵 \(
    A_p \)、\( A_v \)、\( b_p \)、\( b_v \) 是根据方程为质心的离散反向时间积分矩阵，这使在优化最终质心 \( x_{\text{CoM,T}}
    \) 时能够约束初始质心。最后的约束确保每个 CoP 位于其各自的凸约束多边形 \( C_n \) 内。


    图 9-17 所示的 CoM 和 CoP 轨迹是基于倒立摆模型优化的结果。MPC 在每次步态规划器更新时进行评估，使用的预测窗口为 \( T = 2\text{s}
    \)。


