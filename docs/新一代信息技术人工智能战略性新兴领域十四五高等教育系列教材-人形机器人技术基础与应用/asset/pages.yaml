  md: '# # 第 3 章 人形机器人行走控制基础


    # 导读


    人形机器人行走控制是其最基本的技能之一。本章首先进行人形机器人稳定性分析，包括 ZMP 稳定性判据及其他重要的稳定性判别方法，然后介绍典型的人形机器人倒立摆模型，以及
    ZMP 等步态规划方法，最后介绍混合零动力学、模型预测控制以及全身控制等经典的行走控制方法。


    # 本章知识点


    +   - ZMP 稳定性分析

    +   - ZMP 步态规划

    +   - 模型预测控制


    # ## 3.1 概述


    行走的稳定性是人形机器人研究的核心问题之一。人形机器人与地面的接触面积较小，保持稳定性的难度较大。如何让机器人实现稳定的行走，进而在较高的能量效率和较大的行走速度下保持稳定性是人形机器人领域的研究者一直努力探索的问题。因此，为人形机器人建立有效的稳定性判据至关重要。零力矩点（Zero
    Moment Point，ZMP）稳定性判据是在人形机器人中应用非常广泛的一种判据。ZMP 是指地面上的一点，机器人的惯性力和重力关于这点的力矩在水平方向上的分量为
    0。若 ZMP 落在支撑脚与地面接触形成的凸多边形支撑区域内，则人形机器人的运动是稳定的，否则就不稳定。在机器人保持平衡时，ZMP 与压力中心点（Center
    of Pressure，CoP）是等价的。ZMP 稳定性判据只适用于具有平脚结构的全驱动人形机器人，点脚机器人或圆脚机器人与地面的接触面积很小，ZMP 稳定性判据不再适用。


    人形机器人的步态规划是完成各种任务的基础。基于 ZMP 稳定性判据设计运动轨迹是常用的运动规划方法之一。其中有两类基本方法：一类预先设定 ZMP 轨迹，另一类不预先设定
    ZMP 轨迹。预先设定 ZMP 轨迹方法的基本思路是首先设定期望的 ZMP 轨迹，然后依据某种简化模型计算出人形机器人质心的轨迹，再结合机器人和地面的约束条件得'
