  md: '在图 4-8 中，每一阶段包含了两种神经网络。其中，左边的为编码网络，起到老师策略的作用，在第一阶段中编码网络为全连接网络，在第二阶段中编码网络为时序神经网络，起到学生策略的作用，该网络可以为循环神经网络、长短期记忆网络或其他可处理时序信息的神经网络，极端情况下仍为全连接网络也是可以的，只要其可以完成处理时序信息、输出与第一阶段编码网络相同的隐变量即可；右边的网络为动作网络，接受由左边的编码网络输出的隐变量与常规状态观察值。该动作网络在两阶段学习中参与训练，网络参数训练第二阶段不进行更新。


    两阶段训练法通过第一阶段学习策略、第二阶段蒸馏策略，降低了任务的学习难度。在部署实际机器人时，只需要部署经过知识蒸馏的学生网络和强化学习的全连接网络，这样，学生网络就可以根据现实可行的传感器信息推理隐变量，再结合当前时刻的状态观测值，即可生成下一时刻的运动控制指令。


    还有一些算法直接对具体物理参数进行编码。对于难以测定或时刻变化的物理参数，可以采用域随机化或添加随机噪声的方式提高策略的鲁棒性，但这类方法严重降低了算法的学习效率，提高了学习难度，很多时候会导致学习无法完成。在这种情况下，对其进行编码也是一种解决方案。其中一部分算法可由基本策略模块和自适应模块组成。基本策略是在
    RL 模拟中学习的，使用不同环境的信息（如摩擦量以及有效载荷的重量和形状）鼓励机器人学习在不同条件下的正确控制，编码器将这些变量的信息编码为隐变量。总体来说，基本策略模块探测环境，并实际控制机器人的步态。自适应模块负责分析基本策略模块给的数据，然后告诉基本策略模块如何调整步态。两者协同工作，以便在多样化的环境中实现实时适应。其网络结构如图
    4-9 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_117_0.png)


    该训练过程与图 4-8 所示两阶段训练类似，不过编码内容与编码方式都发生了较大的变化，该方法引入了传统编码手段执行类似于传统控制算法中系统辨识的功能。实际上，尽管本书采取传统控制方法与基于学习的控制方法相并列的介绍形式，但在实际应用中，两种方法往往结合使用，可根据任务要求选取可靠性高、性能优秀的模块搭建算法。


    在部署时，仍然只需要部署经过第二阶段的学生网络和强化学习的全连接网络，通过'
