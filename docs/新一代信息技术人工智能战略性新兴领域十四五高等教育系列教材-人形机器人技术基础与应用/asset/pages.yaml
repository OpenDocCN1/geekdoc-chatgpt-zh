- pgno: 76
  md: 'mL(v_x \cos \varphi + v_y \sin \varphi) + I\dot{\theta}_1 = (mL^2 + I)\dot{\theta}_2


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_76_0.png)


    图 3-4 简单的双足行走模型


    由式 (3-12)，同时考虑到 \( L = h / \cos \varphi \)，可以得到碰撞后角速度的表达式为


    \(\dot{\theta}_2 = \frac{mh(v_x \cos \varphi + v_y \sin \varphi)\cos \varphi +
    I\dot{\theta}_1 \cos^2 \varphi}{mh^2 + I \cos^2 \varphi}\)


    假定摆动腿触地时的角度 \(\varphi\) 满足系统碰撞后的机械能等于最大势能，则有


    \(\frac{1}{2}(mL^2 + I)\dot{\theta}_2^2 + mgL \cos \varphi = mgL\)


    将式 (3-13) 代入式 (3-14)，即可得到关于摆动腿触地时摆动腿角度 \(\varphi\) 的方程为


    \(\frac{\left[mg(v_x \cos \varphi + v_y \sin \varphi)\cos \varphi + I\dot{\theta}_1
    \cos^2 \varphi\right]^2}{mh^2 + I \cos^2 \varphi} + 2mgh \cos \varphi(\cos \varphi
    - 1) = 0\)


    根据几何关系，可以得到摆动腿落地点在地面上相对于质心的位置为


    \(\mathrm{FPE}(\varphi) = h \tan \varphi\)


    当摆动腿落地点在 FPE 前方，系统在不需要主动减速的情况下，在接下来的一步内达到静止站立。如果摆动腿落地点在 FPE 后方，则需要多步才能达到静止站立。将腿落地点的位置与
    FPE 计算出的位置相比较，可以作为判断步态稳定性的指标。


    FPE 稳定性判据可用于分析稳定的步态，但是需要满足一些前提：摆动脚与地面接触前、后系统的角动量守恒；机器人的腿长、转动惯量、机械能是不变的。


    Koolen 等人在 FPE 方法的基础上，结合生存理论（Viability Theory）对足式系统如何避免跌倒的分析，提出了双足运动中捕获点（Capture
    Point）的概念及基于它的判定方法。该方法将 FPE 进行基于捕获性的分析扩展，得到了针对双足运动系统到达静止状态的能力，以及双足机器人稳定性的更完整、更实用的理论。'
