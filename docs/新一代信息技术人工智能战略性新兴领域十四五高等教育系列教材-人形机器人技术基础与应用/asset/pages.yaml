  md: '数 $\theta$ 的策略，评估其应该获得的每局中的总奖励的标准是每个采样得到的 $\tau$ 序列（即每一局）的加权和，即


    $$\overline{R_\theta} = \sum_{\tau} R(\tau) p_\theta(\tau) = E_{\tau \sim p_\theta(\tau)}[R(\tau)]$$


    因此，对于一个任务，通过调整策略参数 $\theta$，得到的 $\overline{R_\theta}$ 越大越好，因为这意味着被选用的策略参数能获得更多奖励。为此，需要用期望的每局奖励对
    $\theta$ 求导，即


    $$\nabla \overline{R_\theta} = \sum_{\tau} R(\tau) \nabla p_\theta(\tau) = \sum_{\tau}
    R(\tau) p_\theta(\tau) \frac{\nabla p_\theta(\tau)}{p_\theta(\tau)}$$


    $$= \sum_{\tau} R(\tau) p_\theta(\tau) \nabla \log p_\theta(\tau) = E_{\tau \sim
    p_\theta(\tau)}[R(\tau) \nabla \log p_\theta(\tau)]$$


    $$\approx \frac{1}{N} \sum_{n=1}^N R(\tau^n) \nabla \log p_\theta(\tau^n)$$


    $$= \frac{1}{N} \sum_{n=1}^N R(\tau^n) \left[ \sum_{t=1}^{T_n} \nabla \log p_\theta(a_t^n
    | s_t^n) \right]$$


    式 (4-10) 为梯度的变换；式 (4-11) 将求和转化成期望的形式；式 (4-12) 将期望利用采集到的数据序列进行近似；式 (4-13) 将每一个数据序列展开成每个数据点上的形式。简单解释式
    (4-13) 就是：每一条采样到的数据序列都会希望 $\theta$ 向着自己的方向进行更新。总体上，使用更加靠近奖励比较大的那条序列效果更好，因此用每条序列的奖励来加权平均它们的更新方向。例如，当第
    $n$ 条数据的奖励很大时，通过上述公式更新后的策略，使得 $p_\theta(a_t^n | s_t^n)$ 发生的概率更大，以后再遇到 $s_t^n$
    这个状态时，就更倾向于采取 $a_t^n$ 这个动作，或者说以后遇到的状态和第 $n$ 条序列中的状态相同时，更倾向于采取第 $n$ 条序列曾经采用过的策略。


    在实际使用中，往往需要在奖励上增加一个基线（Baseline），公式为


    $$\nabla \overline{R_\theta} \approx \frac{1}{N} \sum_{n=1}^N (R(\tau^n) - b)
    \left[ \sum_{t=1}^{T_n} \nabla \log p_\theta(a_t^n | s_t^n) \right]$$


    在正常训练动作网络与评价网络的过程中，很容易出现一类奖励函数一直保持正数的情况，这对于那些没有采样到的动作就不再鼓励出现，容易导致没被采样到的更好的动作产生的概率就越来越小，使得最后好的动作反而都被舍弃了。为此可引入一个基线，让奖励函数有正有负，一般增加基线的方式是
    $b = V_\pi(s)$，也可以在策略梯度更新所需的奖励函数中减去一段时间内奖励函数的均值作为更新的内容。


