  md: '杂、不确定的环境（Environment）中最大化它能获得的奖励。如图 4-1 所示，强化学习由两部分组成：智能体和环境。在强化学习过程中，智能体与环境一直在交互。智能体在环境中获取某个状态后，它会利用该状态输出一个动作（Action），这个动作也被称为决策（Decision）。然后，这个动作会在环境中被执行，环境会根据智能体采取的动作，输出下一个状态以及当前这个动作带来的奖励。智能体的目的就是尽可能多地从环境中获取奖励。与监督学习不同，监督学习中智能体通过人工标记过的数据集来学习，而强化学习则以从环境中获得的经验数据作为学习对象。


