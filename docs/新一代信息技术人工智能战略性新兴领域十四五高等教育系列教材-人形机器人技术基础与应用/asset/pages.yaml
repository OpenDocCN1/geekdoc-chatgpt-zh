  md: '# 2. 正微分运动学


    运动链的一个支链（如手臂、腿）的正运动学问题表述为：给定关节角度和运动速率，求末端连杆的空间速度。末端连杆的瞬时运动在相应分支的局部根坐标系中表示。运动取决于每个运动关节的运动速率。


    # (1) 雅可比矩阵


    首先，研究一个仅包含单自由度（旋转）关节的实际机器人，为了使符号简单，暂时假设由 n 个关节组成的运动链的“通用”支链（或肢体）。关节角度是矢量的元素 \(\theta
    \in \Re^n\)，该矢量说明肢体的构型。对于给定的肢体构型 \(\theta\)，末端连杆的空间速度由关节运动速度的线性组合 \(\dot{\theta}_i\)
    确定，即


    \(\mathcal{V}_n = \sum_{i=1}^n \mathcal{V}_i, \mathcal{V}_i = \mathcal{J}_i(\theta)
    \dot{\theta}_i\) (2-79)


    式中，\(\mathcal{J}_i(\theta)\) 表示当第 i 个关节的关节速度设定为 1rad/s，并且所有其他关节被锁定时的末端连杆空间速度。该矢量可以由以下几何关系确定


    \(\mathcal{J}_i(\theta) = \begin{bmatrix} e_i(\theta) \times \Delta r_i(\theta)
    \\ e_i(\theta) \end{bmatrix}\) (2-80)


    式中，\(e_i(\theta)\) 表示沿关节旋转轴的单位矢量，根据 D-H 参数法，\(\Delta r_i(\theta) = r_E(\theta)
    - r_i(\theta)\) 代表相对于所选择的连杆坐标系末端连杆上的特征点的位置矢量。如图 2-19 所示，以示例的方式给出了右臂的第一旋转轴（\(i=1\)）的上述矢量。末端连杆上特征点的位置
    \(r_i\) 是相对于参考坐标系 \(\{T_R\}\) 的，右臂的躯干参考坐标系 \(\{T_R\}\) 通过躯干根坐标系 \(\{T\}\) 的平移得到。式（2-79）可用于计算给定支链上的任何连杆的空间速度。注意：计算连杆
    k 的空间速度 \(\mathcal{V}_k\) 时有两种情况：当 \(k < n\) 时，所有空间速度均为 \(\mathcal{V}_j\)；当 \(k
    < j < n\) 时，空间速度为零。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_58_0.png)


    通常，式（2-79）可以简洁的形式表示为


    \(\mathcal{V}_n = J(\theta) \dot{\theta}\) (2-81)


    式中，矩阵 \(J(\theta) = [J_1, J_2, \cdots J_n] \in \Re^{6 \times n}\) 表示肢体的雅可比矩阵。


    式（2-81）表示速度级正运动学问题的解。可以明显看出，对于给定的支链构型，解是唯一的。正运动学问题在运动分析和运动控制中起着重要作用，特别是在反馈运动控制中。


