- pgno: 232
  md: '# 2. 装配工艺


    (1) 装配顺序 装配顺序是在机器人机构设计中需要提前规划的。在确定装配工艺时，更需要进一步明确各个零件的装配顺序，同时需要提前加工制作安装工装。


    (2) 传动件的定位 机器人的重复定位精度要求较高，设计时应根据具体要求选择适当的定位方法。目前常用的定位方法有电气开关定位、机械挡块定位和伺服定位。


    1) 电气开关定位。电气开关定位是利用电气开关（有触点或无触点）作为行程检测元件，当机器人关节运行到定位点时，行程开关发出信号，切断动力源或接通制动器，从而使关节获得定位。液压驱动的关节运行至定位点时，行程开关发出信号，电控系统使电磁换向阀关闭油路而实现定位。电机驱动的关节需要定位时，行程开关发出信号，电气系统激励电磁制动器进行制动而定位。使用电气开关定位的关节，结构简单、工作可靠、维修方便，但由于受惯性力、油温波动和电控系统误差等因素的影响，重复定位精度比较低，一般为
    ± (3 ~ 5) mm。


    2) 机械挡块定位。在行程终点设置机械挡块，当机器人关节减速运动到终点时，紧靠挡块而定位。若定位前缓冲较好，定位时驱动压力未撤除，则在驱动压力下将运动件压在机械挡块上，或者驱动压力将活塞压靠在缸盖上，从而实现较高的定位精度，最高可达
    ± 0.02mm。若定位时关闭驱动油路、消除驱动压力，则关节运动件不能紧靠在机械挡块上时，定位精度就会降低。其降低的程度与定位前的缓冲效果和关节的结构刚性等因素有关。


    3) 伺服定位。电气开关定位与机械挡块定位这两种定位方法只适用于两点或多点定位。如果要实现任意点定位，就可以使用伺服定位系统。伺服定位系统可以输入指令来控制位移的变化，从而获得良好的运动特性。它不仅适用于点位控制，也适用于连续轨迹控制。伺服定位系统可分为开环伺服定位系统与闭环伺服定位系统。开环伺服定位系统没有行程检测及反馈，是一种直接用脉冲频率变化和脉冲数控制机器人速度和位移的定位方式。这种定位方式抗干扰能力差、定位精度较低，故如果需要较高的定位精度（如
    ± 0.2mm），则一定要降低机器人关节轴的平均速度。闭环伺服定位系统具有反馈环节，其抗干扰能力强、反应速度快、容易实现任意点定位。


    (3) 传动件的消隙 传动机构存在间隙，也叫侧隙。就齿轮传动而言，其侧隙是指一对齿轮中一个齿轮固定不动，另一个齿轮能够做出最大的角位移。传动的间隙，影响了机器人的重复定位精度和平稳性。对机器人控制系统来说，传动间隙导致显著的非线性变化、振动和不稳定。可是，传动间隙是不可避免的，主要有两种：一是由于制造及装配误差所产生的间隙；二是为适应热膨胀而特意留出的间隙。消除传动间隙的主要途径有，提高制造和装配精度、设计可调整传动间隙的机构、设置弹性补偿零件。下面介绍适合机器人采用的几种常用的传动消隙方法。


    1) 消隙齿轮。消隙齿轮由具有相同齿轮参数并只有一半齿宽的两个薄齿轮组成，利用弹簧的压力使它们与配对的齿轮两侧齿廓相接触，完全消除了齿侧间隙，其最大好处是侧隙可以调整。


    2) 柔性齿轮消隙。对钟罩形状的具有弹性的柔性齿轮，在装配时对它稍许增加预载引起轮毂的变形，从而使得每个轮齿的双侧齿廓都能啮合，达到消除侧隙的目的。采用上述同样的原理却用不同设计形状的径向柔性齿轮，在这里轮毂和齿圈是刚性的，但与齿轮'
  merge: -1
  img_proc: true
- pgno: 233
  md: '圈连接处则具有弹性。对于给定同样的转矩载荷，为保证无侧隙啮合，径向柔性齿轮所需要的预载力比钟罩形状齿轮要小得多。


    3）对称传动消隙。一个传动系统设置两个对称的分支传动，并且其中必有一个是具有“回弹”能力的。使用两个谐波传动的消隙方法，将电动机置于关节中间，电动机双向输出轴传动完全相同的两个谐波减速器，驱动一个手臂的运动，谐波传动中的柔轮弹性很好。这种消隙装置的关键是有一个空转轴的直径比另一个的小些（容易产生扭转形变），并加以扭矩预载产生弹性状态，其结果是消除了传动侧隙。但是，加的传动件增加了负载和结构尺寸。因此，它仅应用在像腰旋转这样大惯量的关节上，在这种场合中消除传动间隙是十分重要的。


    4）偏心机构消隙。偏心机构实际上是中心距调整机构。特别是对于由于齿轮磨损等原因造成传动间隙增加，最简单的方法是调整中心距。


    5）齿廓弹性覆层消隙。齿廓表面覆有薄薄一层弹性很好的橡胶层或层压材料，相啮合的一对齿轮加以预载，可以完全消除啮合侧隙。齿轮几何学上的齿面相对滑动橡胶层内部发生剪切弹性流动时被吸收，因此，像铝合金甚至石墨纤维增强塑料这种非常轻而又具备良好接触和滑动品质的材料可用来作传动齿轮的材料，可以大大地减轻重量和转动惯量。


    # 8.5.4 系统调试与实验


    机器人系统中的零部件安装完毕后，需要对整个系统的电气系统进行布置、安装、接线，然后开始对整个系统进行调试，主要包括以下步骤：


    # 1. 单关节调节与零点校核


    单关节调节与零点校核环节一般通过驱动器自带的电动机调试软件，校核各个关节电动机的零件、控制参数、设置关节的限位及检验各关节是否运转正常。图 8-18 所示为人形机器人关节调试结果示例。从右侧图可以看出，位置跟踪效果较好、位置误差较小、速度及电流比较平稳，表明关节运行正常，为后续整个机器人多关节的控制提供基础。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_233_0.png)


    图 8-18 人形机器人关节调试结果示例'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 2. 多关节协同调试


    多关节协同调试一般是在单关节调试完成后，通过上位机发送指令到全身各个关节，检查每个关节的运行状态、全身通信状态、电池供电状态等，是在完成测试前的必备的准备工作。一般通过吊车将机器人吊起，在空中执行机器人运动轨迹，检测运动规划轨迹是否满足机器人的角度范围等要求。


    # 3. 行走与操作实验


