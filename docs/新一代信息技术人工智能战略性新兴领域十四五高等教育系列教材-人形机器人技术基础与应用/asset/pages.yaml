    # 5.4 机器人导航应用实例


    本节将通过具体的实例，详细介绍机器人导航所需的核心技术。通过这个实例，能够更直观地展示如何应用机器人导航技术，从而为机器人系统的设计、开发和部署提供实用的指导。


    在过去的几十年里，在同时定位与建图领域开展了广泛的研究。通常，在 SLAM 系统中，一个人操作测量设备，然后根据位置和环境地标生成地图，操作员决定访问哪些尚未绘制的环境区域以及访问顺序。如果需要绘制两个位置之间的路径，操作员也会手动引导测绘机器人沿着选定的路径到达目标。然而，由于各种原因，手动操作测绘设备并不总是可行的，如存在劳动力成本高、物理限制、资源有限、环境危险等问题。因此，自主探索成为一个备受关注的领域，研究人员致力于将导航和测绘任务委托给自动驾驶机器人。


    与常规环境探索不同，完全自主的目标驱动探索是一个双重问题。首先，探索机器人需要决定去哪里最有可能到达全局目标。在没有先验信息或看不到全局目标的情况下，系统需要直接从传感器数据中指出可能的导航方向。从这些兴趣点（Points
    of Interest，POI）中，需要选择出最佳兴趣点作为路径点，以最优方式引导机器人到达全局目标。然后，需要一种不依赖于地图数据的不确定环境中的机器人运动策略。随着机器人导航以及深度强化学习（Deep
    Reinforcement Learning，DRL）的发展，自主代理的高精度决策'
