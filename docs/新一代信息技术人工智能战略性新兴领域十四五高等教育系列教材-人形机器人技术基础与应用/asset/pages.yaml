- pgno: 244
  md: '分及其相互关系，从而实现精确的仿真。一个 URDF 文件主要由三种核心元素组成，具体如下：


    +   1) <robot> 元素。URDF 文件的根元素，用于定义整个机器人模型。


    +   2) <link> 元素。用于描述机器人的一个部件，如连杆、传感器等机器人组成部分。

    +   每个 <link> 元素可以定义该部件的外观模型、碰撞模型以及惯性张量矩阵等信息。


    +   3) <joint> 元素。用于定义两个部件之间的连接方式和运动关系（关节），定义关节的

    +   类型（如旋转、平移）、运动限制（如角度范围、速度限制）等信息。


    同时在 <link> 元素、<joint> 元素之间还有许多子元素用于辅助描述完整的信

