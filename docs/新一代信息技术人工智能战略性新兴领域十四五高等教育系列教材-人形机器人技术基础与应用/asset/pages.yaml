    # 4. 近端策略优化算法


    以上算法仍然有一个问题，即完成一个轨迹并利用它的数据进行更新后，这个数据就没有用处了，需要丢掉，这严重浪费了探索过程中获得的经验。因此近端策略优化算法（Proximal
    Policy Optimization Algorithms，PPO）采取了许多改进方法来提高学习效率与稳定性。


    将数据存储下来进行训练是最好的，但有一个问题，在上面的推导过程中使用了一步近似，见式（4-13），该步近似利用了辛钦大数定律，其前提条件为估计期望所需的采样数据的分布需要与期望本身的分布相同，即需要以
    \( p_\theta \) 的分布进行采样才行。当将数据存储下来用于数据更新时，一旦进行更新，分布即变为新分布 \( p_{\theta''} \)，就无法用之前
    \( p_\theta \) 时采集的数据更新 \( p_{\theta''} \) 的策略了。为解决这一问题，需要进行重要性采样，即将原始期望进行一步变换，考虑到


    ```

    E_{t \sim p_\theta(\tau)}[f(\tau)] = \int f(\tau) p_\theta(\tau) \mathrm{d}\tau
    = \int f(\tau) \frac{p_\theta(\tau)}{p_{\theta''}(\tau)} p_{\theta''}(\tau) \mathrm{d}\tau
    = E_{t \sim p_{\theta''}(\tau)} \left[ f(\tau) \frac{p_\theta(\tau)}{p_{\theta''}(\tau)}
    \right] (4-17)

    ```


    可以得到


    ```

    \nabla \overline{R}_\theta = E_{t \sim p_\theta(\tau)} [R(\tau) \nabla \log p_\theta(\tau)]
    (4-18)

    = E_{t \sim p_{\theta''}(\tau)} \left[ \frac{p_\theta(\tau)}{p_{\theta''}(\tau)}
    R(\tau) \nabla \log p_\theta(\tau) \right] (4-19)

    ```


    这样就将原始分布的期望转化为了新分布的期望。与原始期望相比，相差了一个 \( \frac{p_\theta(\tau)}{p_{\theta''}(\tau)}
    \)，被称为重要性权重，最终得到新的更新梯度为


    ```

    J(\theta) = \sum \left[ \frac{p_\theta(a_t | s_t)}{p_{\theta''}(a_t | s_t)} A^{\theta''}(s_t,
    a_t) \right] (4-20)

    ```


    至此，不再需要完整地跑完整条轨迹后一起更新，可以随时利用过去的信息进行更新。


    同时，对于重要性采样来说，\( p_\theta \) 和 \( p_{\theta''} \) 不能差别过大，否则会导致方差的剧烈变化，不利于梯度的稳定更新，可以使用
    KL 散度来惩罚二者之间的分布偏差，所以就得到了


    ```

    J(\theta) = \sum \left[ \frac{p_\theta(a_t | s_t)}{p_{\theta''}(a_t | s_t)} A^{\theta''}(s_t,
    a_t) \right] - \lambda KL[\theta, \theta''] (4-21)

    ```


    式中，\( \lambda \) 为 KL 散度权重，该权重也可以自适应变化。当 KL 过大时，增大 \( \lambda \) 的值来增加惩罚力度；当 KL
    过小时，减小 \( \lambda \) 值来降低惩罚力度。即


    ```

    如果 \( KL(\theta, \theta'') > KL_{\min} \)，则增加 \( \lambda \) (4-22)

    ```


    ```

    如果 \( KL(\theta, \theta'') < KL_{\min} \)，则减小 \( \lambda \) (4-23)

    ```'
