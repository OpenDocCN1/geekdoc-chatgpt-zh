    一个给定的旋转矩阵 $\boldsymbol{R}$ ，它的具体语义可以根据上下文环境得到确定。


    一个坐标系可以定义为一组基向量，如沿三个坐标轴的单位向量。这意味着一个旋转矩阵（作为一个坐标变换）也可被看作是从一个坐标系到另一个坐标系的基向量的变换。对于一般线性变换的矩阵表示，可以用相似变换在不同坐标系之间进行转换。例如，如果
    $\boldsymbol{A}$ 是一个给定线性变换在坐标系 $\{0\}$ 中的矩阵表示， $\boldsymbol{B}$ 是同一线性变换在坐标系 $\{1\}$
    中的矩阵表示，那么 $\boldsymbol{A}$ 和 $\boldsymbol{B}$ 可以通过式 (2-12) 联系起来


    $\boldsymbol{B} = ( _1^0 \boldsymbol{R})^{-1} \boldsymbol{A} _1^0 \boldsymbol{R}$
    \qquad (2-12)


    式中，$ _1^0 \boldsymbol{R}$ 矩阵是坐标系 $\{1\}$ 和坐标系 $\{0\}$ 之间的坐标变换。特别是当 $\boldsymbol{A}$
    本身为转动时， $\boldsymbol{B}$ 也为转动。因此，使用相似变换，可以很容易在不同的坐标系中表述相同的转动。


    假设坐标系 $\{0\}$ 和坐标系 $\{1\}$ 之间可通过旋转矩阵联系起来，即


    $ _1^0 \boldsymbol{R} = \begin{bmatrix} 0 & 0 & 1 \\ 0 & 1 & 0 \\ -1 & 0 & 0 \end{bmatrix}$


    如果相对于坐标系 $\{0\}$ ，有 $\boldsymbol{A} = \boldsymbol{R}_{z, \theta}$ ；那么，相对于坐标系 $\{1\}$
    ，则有


    $\boldsymbol{B} = ( _1^0 \boldsymbol{R})^{-1} \boldsymbol{A} _1^0 \boldsymbol{R}
    = \begin{bmatrix} 1 & 0 & 0 \\ 0 & \cos \theta & \sin \theta \\ 0 & -\sin \theta
    & \cos \theta \end{bmatrix}$


