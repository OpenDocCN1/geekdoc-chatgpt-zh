  md: '8）故障诊断安全保护功能，运行时系统状态监视、故障状态下的安全保护和故障自诊断。


    # 8.5.2 传感系统设计


    随着机器人技术的不断发展，其应用领域和功能有了极大的拓展和提高。智能化已成为机器人技术的主要发展趋势，而传感器技术则是实现机器人智能化的基础。由于单一传感器获得的信息非常有限，而且受到自身品质和性能的影响，因此，智能机器人通常配有数量众多、不同类型的传感器，以满足探测和数据采集的需要。


    多传感器信息融合技术可有效地解决信息孤立、信息丢失问题。它综合运用控制原理、信号处理、仿生学、人工智能和数理统计等方面的理论，将分布在不同位置、处于不同状态的多个传感器所提供的局部、不完整的观察量加以综合，消除多传感器信息之间可能存在的冗余和矛盾，利用信息互补，降低不确定性，以形成对系统环境相对完整一致的感知描述，从而提高智能系统决策、规划的科学性，反应的快速性和正确性，降低其决策风险。机器人多传感器信息融合技术已成为智能机器人研究领域的关键技术之一。


    机器人传感系统设计一般需依据机器人传感器的要求、特点进行合理的布置与定位，设计过程中主要考虑传感器的精度及发挥传感器最大的功效。机器人常用的传感器的安装、定位与布置设计时常考虑如下因素：


    （1）位置传感器 位置传感器一般用于感知关节的绝对位置，以便对机器人进行运动控制。因此，其轴向安装与定位的精度及机器人在运动过程中发生抖动的情况下的精度至关重要。


    （2）力传感器 力传感器用于检测机器人运动过程中受到的相互作用力的大小，包括关节处的力矩传感器、压力传感器，机器人肢体末端的六维力传感器等。设计要点为需要充分考虑关节零件的受力关系，在设计上力矩传感器需要与连接件相配合，使其不受其他方向力、力矩的影响。


    （3）姿态传感器 姿态传感器主要用于检测机器人自身的姿态信息，从而对机器人进行平衡控制。设计时主要考虑其工作稳定性，因此其安装的位置及定位至关重要。


    （4）视觉传感器 视觉传感器主要用于人形机器人对周围环境的感知，一般置于机器人头部与胸腔位置，其视角范围及运动过程中的稳定性是设计与布置中需要着重解决的问题。


    （5）激光雷达 激光雷达主要用于对人形机器人前方环境的感知，其感知的范围是关键，一般布置在机器人胸前，因此设计时需充分考虑其感知范围及相对于地面的角度。


    # 8.5.3 零部件加工与组装


    在完成人形机器人零部件设计后，需要生成加工图样，在此基础上，完成零件的加工，并组装成部件，最后形成人形机器人实物样机。零部件的加工与组装质量将直接决定机器人运行的质量及可靠性，因此在影响机器人性能方面至关重要。本节将从零部件加工工艺与组装工艺方面介绍人形机器人加工与组装过程。


    # 1. 加工工艺


    为每个机器人零件确定加工工艺，需要完成的步骤：了解零件功用与结构，确定技术'
  merge: -1
  img_proc: true
- pgno: 230
  md: "要求（加工精度、表面粗糙度、其他要求），确定材料，编制零件加工工艺，编制加工工序，执行加工。针对轴类零件、套类零件等，均有不同特点的加工工艺。\n\n\
    +   (1) 轴类零件 常见的轴类零件图样如图 8-15 所示，主要的加工工艺要点为保证同轴度、强度、刚度要求。\n\n![](img/47a2b26fde9e2a8fab8f8289e100ee37_230_0.png)\n\
    \n技术要求\n1.热处理调火40~45HRC。\n2.倒角均为C1。\n3.材料为45钢。\n4.沟槽均为3×1.5。\n\n![](img/47a2b26fde9e2a8fab8f8289e100ee37_230_1.png)\n\
    \n![](img/47a2b26fde9e2a8fab8f8289e100ee37_230_2.png)\n\n图 8-15 常见的轴类零件图样\n\n\
    +   1）零件功用，支承传动件和传递转矩，保证安装零件的回转精度。\n+   \n+   2）结构，旋转体零件，加工表面通常有内外圆柱面、圆锥面，以及螺纹、花键、键槽、横向孔、沟槽等；根据结构，可分为光轴、阶梯轴、空心轴、异形轴、花键轴、曲轴、凸轮轴等。\n\
    +   \n+   3）技术要求，主要为加工精度，即尺寸精度、形状精度、位置精度、表面粗糙度等。支承轴颈的表面粗糙度 Ra 一般为 0.8 ~ 0.2μm，配合轴颈的表面粗糙度\
    \ Ra 一般为 3.8 ~ 0.8μm。\n+   \n+   4）定位基准，粗加工时，以外圆表面为定位基准；半精车加工时，采用外圆表面和中心孔作为定位基准（即一夹一顶）；精加工时，采用两个中心孔作为定位基准（即双顶尖）。\n\
    +   \n+   5）传动轴加工工序，锻造毛坯—热处理（退火）—粗车—半精车—车螺纹—铣键槽—热处理（淬火加高温回火）—粗磨—精磨。"
  merge: -1
  img_proc: true
- pgno: 231
  md: '(2) 套类零件 常见的套类零件图样如图 8-16 所示。套类零件大多起支承或导向作用，其内、外表面的形状精度和位置精度要求较高。其主要工作表面为内圆表面、外圆表面，这些面的表面粗糙度数值较小，孔壁较薄且易变形。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_231_0.png)


    图 8-16 常见的套类零件图样


    +   1) 结构，内外圆柱面、端面、外沟槽等，属短套类零件。

    +   2) 技术要求，尺寸精度、表面粗糙度、同轴度、垂直度。

    +   3) 材料，铸铁。毛坯选用外径为 \(\phi 70\text{mm}\) 的铸铁棒料。


    (3) 典型机器人零件的加工方法 一般采用保证相互位置精度的“一刀下”方法。外圆加工工序为，精车；内孔加工工序为，钻孔—车孔—铰孔。图 8-17 所示为机器人电动机外壳示例。它属于套类零件，配合的要求包括同轴度、零件的径向定位等。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_231_1.png)


    图 8-17 机器人电动机外壳示例


    着色部位相互间均有同轴度设计要求，相同颜色部位相互间同轴度设计要求更高。有同轴度要求的部位应尽可能减少最后精加工工序次数，最好在同一次工序中精加工完成。


    工艺选择上，回转类零件的有同轴度要求的部位，从加工经济性、表面加工质量角度出发，应优先采用车削加工方式；有条件的，如有高速主轴的高精度铣削加工中心，则可采用高速铣削替代车削的加工方式。


    加工设备选择上，不考虑经济性，采用自动调头加工的高精度双主轴车削加工中心，则能实现一次装卡下的各关键内外回转面一次加工完成；综合考虑加工经济性和加工质量要求，决定采用单主轴车削加工中心，两次装卡完成加工。'
