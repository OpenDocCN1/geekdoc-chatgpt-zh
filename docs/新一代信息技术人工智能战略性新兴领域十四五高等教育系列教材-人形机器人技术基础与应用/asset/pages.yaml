  md: '真很有帮助。


    一般有两种方法用于对机器人动力学模型的构建，一种是基于速度、加速度和力的牛顿 – 欧拉法，另一种是基于能量的拉格朗日法。由这两种方法得出来的动力学方程都可以对动力学的状态空间方程进行简化。接下来将分别讨论这两种方法。


    # 2.3.2 牛顿 – 欧拉法


    本小节重点讨论基于牛顿 – 欧拉法建立机器人动力学方程。


    # 1. 机器人刚体的加速度


    两个相互独立的坐标系 {A} 和 {B}，坐标系 {B} 固连在一个刚体上，刚体有一个相对于坐标系 {A} 的运动点 \(^B\boldsymbol{Q}\)。如图
    2-20 所示，假设坐标系 {A} 是固定的，坐标系 {B} 相对于坐标系 {A} 的位置可以用位置矢量 \(^A\boldsymbol{P}_\text{BORG}\)
    和旋转矩阵 \(_B^A\boldsymbol{R}\) 来描述。则 Q 点在坐标系 {A} 中的线速度可以表示为


    ```

    \(^A\boldsymbol{V}_Q = {}^A\boldsymbol{P}_\text{BORG} + {}^A\boldsymbol{R}_B{}^B\boldsymbol{V}_Q\)
    (2-94)

    ```


    注意：式（2-94）成立的前提是坐标系 {A} 和 {B} 的相对方位保持一定。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_62_0.png)


    图 2-20 坐标系 {B} 相对于坐标系 {A}


    普通情况下，机器人转动关节时， Q 点在坐标系 {B} 中的位置固定，即 \(^B\boldsymbol{Q}\) 为常量。关节转动时，坐标系 {B} 相对于坐标系
    {A} 旋转的角速度为 \(^A\boldsymbol{\Omega}_B\)。经过推导和计算，得到机器人的线加速度的表达式为


    ```

    \(^A\dot{\boldsymbol{V}}_Q = {}^A\dot{\boldsymbol{V}}_\text{BORG} + {}^A\boldsymbol{\Omega}_B
    \times ({}^A\boldsymbol{\Omega}_B \times {}^B\boldsymbol{R}\boldsymbol{Q}) + {}^A\dot{\boldsymbol{\Omega}}_B
    \times {}^B\boldsymbol{R}\boldsymbol{Q}\) (2-95)

    ```


