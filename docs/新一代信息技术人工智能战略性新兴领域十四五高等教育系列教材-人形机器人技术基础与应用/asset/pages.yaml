    \) 分别为机器人总质量、世界系下质心位置、重力加速度、接触点位置以及关于质心的角动量；\( ^ \) 为斜对称矩阵，\( \hat{\boldsymbol{a}}\boldsymbol{b}=\boldsymbol{a}
    \times \boldsymbol{b} \)。式 (9-34) 前三行为牛顿定律描述机器人的平动，后三行为欧拉方程描述机器人的转动。将前三行的结果代入到后三行可进一步简化，得


    \( \begin{bmatrix} m(\ddot{\boldsymbol{p}}-\boldsymbol{g}) \\ m\hat{\dot{\boldsymbol{p}}}(\dot{\boldsymbol{p}}-\boldsymbol{g})+\dot{\boldsymbol{L}}
    \end{bmatrix} = \sum_{i=1}^{N_c} \begin{bmatrix} \mathbf{I}_{3 \times 3} \\ \hat{\boldsymbol{r}}_i
    \end{bmatrix} \boldsymbol{f}_i = \boldsymbol{Gf} \) (9-35)


    如果将机器人质心位置变化量通过高阶多项式进行参数化，则


    \( \boldsymbol{p}=\boldsymbol{p}_0+\boldsymbol{A}_p \boldsymbol{c} \quad \dot{\boldsymbol{p}}=\boldsymbol{A}_v
    \boldsymbol{c} \quad \ddot{\boldsymbol{p}}=\boldsymbol{A}_a \boldsymbol{c} \)
