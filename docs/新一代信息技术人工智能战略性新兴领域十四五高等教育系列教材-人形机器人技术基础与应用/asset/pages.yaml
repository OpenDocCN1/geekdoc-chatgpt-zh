- pgno: 64
  md: '根据牛顿第二定律，即物体加速度的大小与作用力成正比、与物体的质量成反比，可以得到机器人中连杆质心上的作用力 F 与相对应的刚体加速度的关系式，即


    ```

    F = m\dot{v}_c

    ```


    式中，$m$ 是刚体的总质量。


    而对于一个转动的刚体，还要分析引起刚体转动的力矩 $N$。欧拉方程用来表示作用在刚体上的力矩与刚体转动的角速度和角加速度的关系，即


    ```

    N = {}^I\dot{\omega} + \omega \times {}^I\omega

    ```


    式中，${}^I I$ 指刚体在坐标系 $\{C\}$ 中的惯性张量。注意：刚体的质心的位置（位于坐标系原点）。


    有了上面两个方程，可以进一步得到基于机械臂给定运动轨迹求解驱动力或力矩的方法，即已知关节的位姿、速度和加速度分别为 $q$、$\dot{q}$ 和 $\ddot{q}$，可以进一步得出机器人运动的驱动力。


    这种计算方法可分为如下两步：


    第一步，在已知连杆位置 $q$ 的情况下，从连杆 1 到连杆 $n$ 向外递推计算连杆的速度 $\dot{q}$ 和加速度 $\ddot{q}$，然后进一步对机器人的所有连杆使用牛顿
    - 欧拉方程，得到作用在连杆质心上的力和力矩。对于转动关节，递推求解的具体过程为


    ```

    {}^{i+1}\omega_{i+1} = {}_i^{i+1}R {}^i\omega_i + \dot{\theta}_{i+1} {}^{i+1}Z_{i+1}
    \qquad (2-107)


    {}^{i+1}\dot{\omega}_{i+1} = {}_i^{i+1}R {}^i\dot{\omega}_i + {}_i^{i+1}R {}^i\omega_i
    \times \dot{\theta}_{i+1} {}^{i+1}\hat{Z}_{i+1} + \ddot{\theta}_{i+1} {}^{i+1}\hat{Z}_{i+1}
    \qquad (2-108)


    {}^{i+1}v_{i+1} = {}_i^{i+1}R \left[ {}^i\omega_i \times {}^iP_{i+1} + {}^i\omega_i
    \times ( {}^i\omega_i \times {}^iP_{i+1} ) + {}^i\dot{v}_i \right] \qquad (2-109)


    {}^{i+1}v_{c_{i+1}} = {}_i^{i+1}R \left[ {}^{i+1}\dot{\omega}_{i+1} \times {}^iP_{c_{i+1}}
    + {}^{i+1}\omega_{i+1} \times ( {}^{i+1}\omega_{i+1} \times {}^{i+1}P_{c_{i+1}}
    ) \right] + {}^{i+1}\dot{v}_{i+1} \qquad (2-110)


    {}^{i+1}F_{i+1} = m_{i+1} {}^{i+1}\dot{v}_{c_{i+1}} \qquad (2-111)


    {}^{i+1}N_{i+1} = {}^{c_{i+1}}I_{i+1} {}^{i+1}\dot{\omega}_{i+1} + {}^{i+1}\omega_{i+1}
    \times {}^{c_{i+1}}I_{i+1} {}^{i+1}\omega_{i+1} \qquad (2-112)

    ```


