  md: '人穿越被认为是间隙的地方。


    # 2. 自由空间法


    激光传感器有一个最大范围，超出这个范围的读数会返回一个非数值类型，表示环境中的自由空间。如果连续的激光读数都返回非数值，那么就在环境中放置一个 POI。从环境中提取
    POI 的示例如图 5-21 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_157_0.png)


    这两种方法可帮助机器人在未知环境中有效地识别和选择导航路径。如果在后续步骤中发现任何 POI 位于障碍物附近，则将其从内存中删除，且可确保不会从机器人已经访问过的地方的激光读数中获取
    POI。此外，如果选择 POI 作为航点但无法在多个步骤内到达，则会删除该 POI 并选择新的航点。从可用的 POI 中，使用基于信息的距离限制探索（Information-based
    Distance Limited Exploration，IDLE）方法选择时间步长 t 的最佳航点。IDLE 方法评估每个候选 POI 的适应度的过程为


    ```

    h(c_i) = \tanh \frac{e^{\left( \frac{d(p_t, c_i)^2}{l_2 - l_1} \right)}}{e^{\left(
    \frac{l_2}{l_2 - l_1} \right)^2}} l_2 + d(c_i, g) + e^{I_{i,t}} \quad (5-36)

    ```


    式中，索引为 i 的每个候选 POI c 的得分 h 是三个分量的总和。机器人在 t 时的位置 p 与候选 POI 之间的欧几里得距离分量 d(p_t, c_i)
    表示为双曲正切 tanh 函数，即


    ```

    d(p_t, c_i) = \tanh \frac{e^{\left( \frac{d(p_t, c_i)^2}{l_2 - l_1} \right)}}{e^{\left(
    \frac{l_2}{l_2 - l_1} \right)^2}} l_2 \quad (5-37)

    ```


    式中，e 是欧拉数，l_1 和 l_2 是用于降低得分的两步距离限制。两步距离限制是根据 DRL 训练环境的面积大小设置的。第二个分量 d(c_i, g)
    表示候选目标与全局目标 g 之间的欧几里得距离。最后，t 时刻的地图信息得分表示为 e^{I_{i,t}}，其中 I_{i,t} 通过式 (5-38) 计算，即


    ```

    I_{i,t} = \frac{\sum_{w=-\frac{k}{2}}^{\frac{k}{2}} \sum_{h=-\frac{k}{2}}^{\frac{k}{2}}
    c_{(x+w)(y+h)}}{k^2} \quad (5-38)

    ```'
