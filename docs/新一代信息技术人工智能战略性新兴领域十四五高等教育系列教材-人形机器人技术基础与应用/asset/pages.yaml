  md: '系，其任务之一就是确立机器人末端执行器的位姿。


    # 2.2.1 运动学概述


    机械臂是人形机器人本体的核心组件，也称为操作臂，可以在确定的环境中执行控制系统指定的操作。其基本组成部件一般采用链式连杆机构，其中的运动部件称为关节。机械臂可以看成是由一系列连杆通过关节依次连接而成的开式运动链。机械臂的第一个固定连杆为连接基座，称为连杆
    0，第一个可动连杆为连杆 1，第二个可动连杆为连杆 2，以此类推，机器人最末端的连杆 n 连接着机械臂的末端执行器。通常在基座处建立一个固定参考坐标系，称为基坐标系；在末端执行器建立的坐标系称为末端坐标系（工具坐标系），一般用它来描述机械臂的位置。


    关节通常可分为移动关节和旋转（转动）关节两类。移动关节可以沿着基准轴移动，而旋转关节则是围绕基准轴转动。不管是转动还是移动，都是沿着或者围绕着一个轴进行的，称为有
    1 个运动自由度。每一个转动关节提供 1 个转动自由度，每 1 个移动关节提供 1 个移动自由度，关节个数通常即为机器人的自由度数，各关节间以固定杆件相连接。还有一种特殊的关节称为球关节，它有
    3 个自由度，一个球关节可以用三个转动关节和一个零长度的连杆来描述。为了确定末端执行器在三维空间中的位姿，机械臂至少需要 6 个关节，刚好对应 6 个自由度，其中
    3 个自由度用来确定末端执行器的位置，另外 3 个自由度用来确定末端执行器的姿态。


    # 1. 连杆和变换矩阵


    （1）连杆描述 一个连杆两端连接着两个关节，两个关节轴之间的位姿关系可以用该连杆的两个关节轴线之间的距离和角度来描述。描述连杆的参数如图 2-13 所示。


    除第一个和最后一个连杆外，每个连杆两端的轴线各有一条法线，分别为前、后相邻连杆的公共法线。对于图 2-13 中的连杆 (i-1)，其左边对应的是关节轴 (i-1)，右边对应的是关节轴
    i，连杆长度 a_{i-1} 是关节轴 (i-1) 和关节轴 i 之间的公共法线段的长度。在三维空间中总是可以找到两条直线之间的公共法线段。如果它们平行，则有无数条公共法线段；如果它们不在一个平面内，则只有一条公共法线段；如果它们相交，公共法线段就是一个点。关节轴线
    (i-1) 和关节轴线 i 之间的距离是由连杆 (i-1) 来确定的。


    描述连杆两条关节轴线之间的夹角，即连杆转角。对于连杆 (i-1)，连杆转角是关节轴 (i-1) 绕着公垂线转动到与关节轴 i 平行时所转过的角度 \alpha_{i-1}
    [ 按右手法则转动，公垂线方向定义为从关节轴 (i-1) 指向关节轴 i ]。


    通常用连杆长度 a_{i-1} 和连杆转角 \alpha_{i-1} 来描述连杆 (i-1) 本身的特征。


    相邻的两个连杆之间通过关节进行连接。相邻的连杆 (i-1) 和连杆 i 之间的共同关节轴 i 有两条公垂线（其长度分别为 a_{i-1} 和 a_i）与它垂直，这两条公垂线之间的距离称为连杆偏距，记为
    d_i，它代表连杆 i 相对于连杆 (i-1) 的偏置。同样地，对应于关节轴 i 的两条公垂线之间的夹角称为关节角，记为 \theta_i，它反映了两个连杆在关节轴处的夹角。需要注'
