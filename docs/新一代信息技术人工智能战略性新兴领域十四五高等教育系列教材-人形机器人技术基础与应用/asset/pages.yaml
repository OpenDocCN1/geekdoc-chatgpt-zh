- pgno: 171
  md: '+   1) 在线读取摄像头图像信息（相机选用深度视觉相机）。

    +   2) 在图像中识别出要抓取的物体并得到其像素坐标 \( (u,v) \)、深度 \( z_c \) 值以及像素角度 \( \theta \)。

    +   3) 由 \( (u,v) \)、\( z_c \) 计算得到三维世界坐标值 \( (x_w, y_w, z_w) \) 并转换至机器人基坐标系下的坐标
    \( (x_b, y_b, z_b) \)；由 \( \theta \) 获取物体的姿态 \( (\alpha_1, \beta_1, r_1) \)。

    +   4) 根据需求与物体的姿态 \( (\alpha_1, \beta_1, r_1) \)，可以确定机械臂末端执行器到达 \( (x_b, y_b,
    z_b) \) 时的姿态 \( (\alpha_2, \beta_2, r_2) \)。

    +   5) 运动学逆解，通过 \( (x_b, y_b, z_b) \)、\( (\alpha_2, \beta_2, r_2) \) 这六维已知数据计算出机械臂每个关节分别需要旋转的角度。

    +   6) 根据环境和实际需求（有无障碍、要求路径最短、要求时间最短等）规划出一系列中间点（可选）。

    +   7) 利用步骤 5) 中的方法计算出到达每个中间点时各个关节的角度值。

    +   8) 机械臂末端执行器执行抓取任务。


    # 6.3.2 力传感器与触觉传感器


    # 1. 力传感器


    力传感器是将力或力矩的值转换成电信号的元件，通过测量电信号来检测力与力矩的大小，其内部一般由力敏元件、转换元件和电路部分组成，可以检测张力、拉力、应力以及施加在部件上的扭转力矩。


    按测量原理分，目前机器人用的主要的力传感器有应变式、磁式等。应变式力传感器上通常装载有应变片，当应变片以及导体形状发生变化时，电阻也会发生变化，由此可测量作用在应变片上的负载。磁式力传感器主要是根据铁磁材料在不同外磁场条件下会发生几何可逆变化的磁致伸缩来间接检测转矩。应变式力传感器结构简单、测量精度高、集成体积小，在机器人中应用广泛。磁式力传感器具有线性度好的优点，但它分辨率低、体积较大、易受电磁干扰影响。目前，在机器人关节等部位的力传感器选择方面，往往需要具有分辨率高、线性度好、结构简单可靠、厚度小、响应快等优点，因此实际机器人应用中以应变式传感器为主。


    力传感器按维度不同可分为一维力传感器、三维力传感器、六维力传感器。机器人力传感器的分类如图 6-13 所示，如果力的方向和作用点固定，则可选用一维力传感器；如果力的方向随机变化，但作用点保持不变且与传感器的标定参考点重合，则可选用三维力传感器；如果力的方向和作用点都在三维空间内随机变化，则选用六维力传感器进行测量。六维力传感器是性能最优、力觉信息最全面的，能够同时测量三个空间平移力分量
    \( (F_x, F_y, F_z) \) 和三个转动力矩分量 \( (M_x, M_y, M_z) \)，提供了全方位的力觉信息，成为人形机器人实现力控功能不可或缺的核心部件，如图
    6-14 所示。其一般分为固定端（机器人端）和加载端（工具端）。两端相对受力时，传感器发生弹性变形，传感器内部的应变计电阻发生变化，转换成电压信号输出。目前，其研究难点在于需兼顾优良的静态性能、动态性'
