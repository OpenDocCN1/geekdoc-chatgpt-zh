  md: '![](img/47a2b26fde9e2a8fab8f8289e100ee37_123_0.png)


    图 4-17 反正切函数图例


    部分算法将模仿学习等方法引入强化学习训练中，通过引入外界专家策略，对比策略输出与专家策略的相似程度作为参考奖励值设计。该类方法的奖励通常由两部分组成，分别为参考动作的片段匹配奖励以及用于衡量实际任务完成程度的任务目标奖励。其中参考动作的片段匹配奖励可以由机器人的关节转矩、连杆位置、速度或机器人末端执行器状态等信息组成，学习策略与专家策略越接近则奖励越高。任务目标奖励则与任务目标强相关，以避免学习策略因完全模仿专家策略而无法执行新的任务。


    还有一种方案是对任务进行分解，可以将大型任务分解为多个较小的子任务。每个子任务都会有相对较均衡的奖励信号，从而减轻奖励稀疏问题对整体学习的影响。例如，在一个复杂的任务中，可以将高级目标（如摔倒恢复）分解成更具体的子目标（如翻身、坐起、站立等），并分别在子任务上进行学习。也可以将任务进行抽象层面的分解，这种方法将任务分解为抽象的状态和动作空间，从而降低了问题的复杂性。例如，将机器人导航任务分解成规划路径和执行路径两个子任务，分别进行学习。


    # 4.2.5 人形机器人重置方法


    对于循环技能，任务可以建模为无限长度的马尔可夫决策过程。但在训练过程中，每周期都是在有限的范围内模拟的。任务往往在一段固定的时间后终止，或者当某些终止条件被触发时终止，终止后会对机器人以及环境进行重置。对于运动控制任务，提前终止的常见条件有检测到跌倒、倾覆以及自碰撞等。跌倒的特征通常是机器人的躯干或四肢（不包括足底）与地面接触。倾覆的特征则是身体姿态发生不合预期的巨大变化或某些连杆低于高度阈值。自碰撞则是防止机器人在自由探索过程中四肢打结卡死无法继续学习，其特征往往是预期任务中不会接触的两个或多个连杆间发生了碰撞。一旦提前终止被触发，机器人会直接重置。这种提前终止提供了另一种塑造奖励函数以阻止不良行为的方法。提前终止的另一个好处是，它可以作为一种管理机制，使数据分布偏向于可能与任务更相关的样本。在行走和翻转等技能的例子中，一旦角色摔倒，就很难恢复并回到其理想轨迹。如果不提前终止，在训练早期阶段收集的数据将被徒劳地在地面上挣扎的任务样本所主导，网络的大部分能力将用于模拟这种徒劳的状态。这种现象类似于监督学习中遇到的类别不平衡问题。通过在遇到这种故障状态时终止事件，可以减轻这种不平衡。图
    4-18 所示为'
