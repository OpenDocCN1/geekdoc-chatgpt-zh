    # 1. 创建机器人场景


    9.2.2 节创建并生成了 Mujoco 仿真器使用的机器人描述文件，命名为 Unitree_G1.xml。在此基础上，还需要为机器人创建所处的场景，以便模拟机器人的各种运动。机器人的场景文件也使用
    XML 文件进行描述。下面是一个最简单的场景文件实例：


    ```

    <mujoco model="Unitree G1 scene">

    <include file="Unitree_G1.xml"/>

    <worldbody >

    <light pos="1 0 3.5" dir="0 0 -1" directional="true"/>

    <geom name="floor" size="0 0 0.05" type="plane"/>

    </worldbody >

    </mujoco >

    ```


    其中，<include> 标签在场景中包含了之前生成好的机器人描述文件 Unitree_G1.xml。在 <worldbody><light> 标签中，定义了整个场景的光照参数。在
    <worldbody><geom> 标签中，则创建了一个地平面。


    使用 Mujoco 仿真器加载上面创建好的场景，如图 9-9 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_248_0.png)


    图 9-9 人形机器人系统 Mujoco 仿真场景


    在此基础上，还可以根据需要为机器人添加一些障碍物等，如在场景中添加一个方形障碍物等：


    ```

    <worldbody >

    <geom pos="1.2 0 0.04" type="box" size="0.1 2 0.04" quat="1.0 0 0 0"/>

    </worldbody >

    ```


    其中，pos="1.2 0 0.04" 为障碍物的位置；type="box" 表示障碍物的类型，这里为方形；size="0.1 2 0.04" 为障碍物的长宽高尺寸；quat="1.0
    0 0 0" 为障碍物的姿态四元数。


