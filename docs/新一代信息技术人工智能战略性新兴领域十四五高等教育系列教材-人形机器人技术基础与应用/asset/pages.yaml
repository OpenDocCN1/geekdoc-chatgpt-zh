  md: '^0\mathbf{x}_1 = \begin{bmatrix} \cos\theta \\ \sin\theta \end{bmatrix}, ^0\mathbf{y}_1
    = \begin{bmatrix} -\sin\theta \\ \cos\theta \end{bmatrix}


    由上式可得


    ^1_0\mathbf{R} = \begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta
    \end{bmatrix} \quad (2-2)


    **注意：** 本书用左上角标表示参考坐标系。因此，矩阵 ^1_0R 中的列向量是坐标系 {1} 各轴分布的单位向量在坐标系 {0} 中的对应坐标。


    前面以角度 \(\theta\) 三角函数的形式推导了 ^1_0R 中的各项。也可以通过投影的方法来推导 ^1_0R，即通过把坐标系 {1} 的各轴投射到参考坐标系
    {0} 的坐标轴上而建立旋转矩阵，该方法可以很好地扩展到三维空间中。因为两个单位位置向量的点积给出了其中的一个向量在另一个向量上的投影，这样可以得到


    ^0\mathbf{x}_1 = \begin{bmatrix} \mathbf{x}_1 \cdot \mathbf{x}_0 \\ \mathbf{x}_1
    \cdot \mathbf{y}_0 \end{bmatrix}, ^0\mathbf{y}_1 = \begin{bmatrix} \mathbf{y}_1
    \cdot \mathbf{x}_0 \\ \mathbf{y}_1 \cdot \mathbf{y}_0 \end{bmatrix}


    组合在一起，得到下面的旋转矩阵


    ^1_0\mathbf{R} = \begin{bmatrix} \mathbf{x}_1 \cdot \mathbf{x}_0 & \mathbf{y}_1
    \cdot \mathbf{x}_0 \\ \mathbf{x}_1 \cdot \mathbf{y}_0 & \mathbf{y}_1 \cdot \mathbf{y}_0
    \end{bmatrix}


    因此， ^1_0R 的各列指定了坐标系 {1} 的各坐标轴相对于坐标系 {0} 的各坐标轴的方向余弦。例如， ^1_0R 的第一列 \([\mathbf{x}_1
    \cdot \mathbf{x}_0 \quad \mathbf{x}_1 \cdot \mathbf{y}_0]^\text{T}\) 指定了 \(\mathbf{x}_1\)
    相对于坐标系 {0} 的方向。注意，这些方程的右侧是通过几何实体定义的，而非通过它们的坐标而定义的。考察图 2-2 可以看出，这种通过投影来定义旋转矩阵的方法，给出了与式
    (2-2) 相同的结果。


    如果希望改为描述坐标系 {0} 相对于坐标系 {1} 的姿态（即希望使用坐标系 {1} 作为参考坐标系），则可以构建旋转矩阵，即


    ^0_1\mathbf{R} = \begin{bmatrix} \mathbf{x}_0 \cdot \mathbf{x}_1 & \mathbf{y}_0
    \cdot \mathbf{x}_1 \\ \mathbf{x}_0 \cdot \mathbf{y}_1 & \mathbf{y}_0 \cdot \mathbf{y}_1
    \end{bmatrix}


    由于向量的点积服从交换律（即 \(\mathbf{x}_i \cdot \mathbf{y}_i = \mathbf{y}_i \cdot \mathbf{x}_i\)），则有


    ^0_1\mathbf{R} = (^1_0\mathbf{R})^\text{T}


    从几何意义上讲，坐标系 {0} 相对于坐标系 {1} 的姿态是坐标系 {1} 相对于坐标系 {0} 的姿态的逆。从代数上讲，利用坐标轴相互正交这一事实，容易得出


    (^1_0\mathbf{R})^\text{T} = (^1_0\mathbf{R})^{-1}


    矩阵 ^1_0R 的各个列向量具有单位长度，并且相互正交。此类矩阵被认为是正交的（Orthogonal）。同时可以表明， \(\det ^1_0\mathbf{R}
    = \pm 1\)。如果局限于右手坐标系，那么 \(\det ^1_0\mathbf{R} = 1\)。习'
