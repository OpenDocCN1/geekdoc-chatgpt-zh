  md: "Unitree SDK2 是宇树公司的用于旗下 G1、H1 等机器人开发的软件包。Unitree SDK2 提供了一套易于使用的通信接口，同时还定制了一套专用于人形机器人和足式机器人的通信格式。基于\
    \ Unitree SDK2，用户可以方便高效地实现人形机器人控制的仿真验证和真机部署。用户可以在宇树公司官方文档或 Github 网站获取 Unitree\
    \ SDK2，安装方法如下：\n\n```\ngit clone https : // github.com/unitreerobotics/unitree_sdk2\n\
    cd unitree_sdk2\nsudo ./install.sh\nmkdir build\ncd build\ncmake ..\nmake\n```\n\
    \n分别在两个终端中运行 test_publisher 和 test_subscriber 程序，可以看到数据在两个程序之间互通，说明 Unitree SDK2\
    \ 已经正确安装。\n\n```\n./ test_publisher\n./ test_subscriber\n```\n\nUnitree SDK2 中定义了许多人形机器人开发常用的数据结构类型，如电动机状态、IMU\
    \ 状态等，每种数据类型被定义在 .idl 文件下。以 MotorCmd_.idl 为例，它定义了电动机控制指令包含的参数。\n\n```\n#ifndef\
    \ __unitree_go_msg_motor_cmd_idl__\n#define __unitree_go_msg_motor_cmd_idl__\n\
    module unitree_go {\n    module msg {\n        module dds_ {\n            struct\
    \ MotorCmd_ {\n                octet mode; // 电动机控制模式\n                float q;\
    \ // 关节目标位置\n                float dq; // 关节目标速度\n                float tau; //\
    \ 关节目标转矩\n                float kp; // 关节刚度系数\n                float kd; // 关节阻尼系数\n\
    \                unsigned long reserve [3]; // 保留位\n            };\n        };\
    \ // module dds_\n    }; // module msg\n}; // module unitree_go\n#endif // __unitree_go_msg_motor_cmd_idl__\n\
    ```\n\n利用 Unitree SDK2 提供的 ChannelPublisher 和 ChannelSubscriber 接口，可以方便快速地发布和订阅这一数据。发布方法如下："
