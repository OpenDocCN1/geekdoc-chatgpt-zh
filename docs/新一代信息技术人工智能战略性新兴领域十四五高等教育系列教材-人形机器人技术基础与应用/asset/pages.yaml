  md: '$$

    \begin{cases} x = f \frac{x_c}{z_c} \\ y = f \frac{y_c}{z_c} \end{cases}

    $$


    式中，$f$为摄像机焦距。上式写成齐次坐标的形式为


    $$

    \begin{bmatrix} x \\ y \\ 1 \end{bmatrix} = \frac{1}{z_c} \begin{bmatrix} f &
    0 & 0 & 0 \\ 0 & f & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix} \begin{bmatrix} x_c
    \\ y_c \\ z_c \\ 1 \end{bmatrix}

    $$


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_169_0.png)


    3) 图像像素坐标系是图像物理坐标系的离散化表示。如图 6-11 所示，在成像平面上，图像物理坐标系的坐标系原点为 \( O \)，其在图像像素坐标系中的位置定义为
    \( (u_o, v_o) \)，单位是 mm；图像像素坐标系的原点 \( O_u \) 在成像平面的左上角，单位为像素。设投影点 \( P \) 在图像物理坐标系中的坐标为
    \( (x, y) \)，那么该点在图像像素坐标系中的坐标可以表示为


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_169_1.png)


    $$

    \begin{cases} u = u_o + \frac{x}{dx} \\ v = v_o + \frac{y}{dy} \end{cases}

    $$


    用齐次坐标与矩阵的形式表示为


    $$

    \begin{bmatrix} u \\ v \\ 1 \end{bmatrix} = \begin{bmatrix} \frac{1}{dx} & 0 &
    u_o \\ 0 & \frac{1}{dy} & v_o \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\
    y \\ 1 \end{bmatrix}

    $$'
