  md: '# 8.2 总体方案分析


    # 8.2.1 设计需求


    人形机器人人是实现生产过程自动化、提高劳动生产率的有力工具。但当考虑经济性与实用性问题时，应根据工作任务特定的类型进行设计。例如，当前常用于竞赛的小型人形机器人与用于在特种环境中进行操作任务的大型人形机器人，在关节类型、数量、驱动类型、传感器、控制器的选择与设计上，会因工作任务的不同而有很大的变化。因此，在进行相关机构设计任务时，首先需要充分分析其设计需求，包括如下方面：


    +   1) 明确人形机器人任务，以及要完成任务的作业需求，如下肢行走的速度、上肢操作的精度、整体稳定性等。

    +   2) 分析机器人所在系统的工作环境，如温度、环境特点等，还包括设备兼容性。

    +   3) 认真分析系统的工作要求，确定机器人的基本功能和方案，如机器人的自由度数、信息的存储容量、定位精度、抓取重量等。

    +   4) 进行必要的调查研究，搜集国内外的有关技术资料。


    在进行人形机器人设计需求分析时，通常需要结合数值分析计算等相关知识，最后得到机器人具体的设计方案、关节配置、传动方案及传感器布置方案等，对设计经验、多学科方向基础知识等有较高的要求。设计需求分析关系到整个设计的成功与否，因此通常会经过多次修改与完善。


    # 8.2.2 人形机器人系统设计方案


    人形机器人常见的全身关节布置方案如图 8-1 所示。其系统设计方案具体包括以下几个方面。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_213_0.png)


    图 8-1 人形机器人常见的全身关节布置方案


    # 1. 机器人基本参数


    由于机器人的结构、用途和用户要求的不同，所以机器人的技术参数也不同。机器'
  merge: -1
  img_proc: true
- pgno: 214
  md: '人的技术参数主要包括自由度、工作范围、工作速度、承载能力、精度、驱动方式、控制方式等。本小节介绍的 G1 机器人是一款中型尺寸、高动态的人形机器人，身高约为
    127cm，质量约为 35kg，包含 23 个关节自由度，本体搭载深度摄像头、3D 激光雷达，可以通过 SLAM 的室内导航技术进行建图，实现自主路径规划和步态规划，完成曲线行走、坡面运动和上楼梯等任务。其步速最高可达
    2.5m/s。


    # 2. 自由度


    机器人的自由度是指机器人所具有的独立坐标轴运动的数目，但是一般不包括手部（末端执行器）的开合自由度。机器人的自由度越多，越接近人手的动作机能，其通用性越好，但是自由度太多，结构也越复杂。人形机器人手臂有
    5 个自由度（共 2 只手），单腿有 6 个自由度（共 2 条腿），腰部有 1 个自由度，共计 23 个自由度。


    # 3. 工作范围


    机器人的工作范围是指机器人手臂或手部安装点所能达到的空间区域。因为手部末端执行器的尺寸和形状是多种多样的，为了真实反映机器人的特征参数，这里的工作范围指不安装末端执行器的工作区域。机器人工作范围的形状和大小十分重要，机器人在执行作业时可能存在手部不能达到的作业死区而无法完成工作任务。机器人所具有的自由度数目组合决定其运动图形，而自由度的变量（即直线运动的距离和回转角度的大小）则决定着运动作业范围。


    # 4. 工作速度和最大工作速度


    工作速度指机器人在工作载荷条件下、匀速运动过程中，机械接口中心或工具中心点在单位时间内所移动的距离或转动的角度。产品说明书一般提供了主要运动自由度的最大稳定速度，但是在实际应用中仅考虑最大稳定速度是不够的。这是因为运动循环包括加速启动、等速运行和减速制动三个过程。如果最大稳定速度高，允许的极限加速度小，则加减速的时间就会长一些，即有效速度就要低一些。所以，在考虑机器人运动特性时，除了要注意最大稳定速度外，还应注意其最大允许的加减速度。


    最大工作速度通常指机器人手臂末端的最大速度。工作速度直接影响工作效率，提高工作速度可以提高工作效率。因此，机器人的加速减速能力显得尤为重要，需要保证机器人加速减速的平稳性。


    # 5. 承载能力


    承载能力指机器人在工作范围内的任何位姿上所能承受的最大负载，通常可以用质量、力矩、惯性矩来表示。承载能力不仅关乎负载的质量，而且还与机器人运行的速度和加速度的大小和方向有关。一般低速运行时承载能力大，但为安全考虑，规定在高速运行时所能抓起的工件质量作为承载能力的指标。


    # 6. 定位精度、重复定位精度和分辨率


    机器人的精度常指机器人的定位精度和重复定位精度。定位精度是指机器人手部实际到达位置和目标位置之间的差异。重复定位精度是指机器人重新定位其手部于同一目标位置的能力，可以用标准偏差这个统计量来表示。分辨率是指机器人每根轴能够实现的最小'
  merge: -1
  img_proc: true
- pgno: 215
  md: '移动距离或最小转动角度。定位精度、重复定位精度和分辨率并不一定相关，它们是根据机器人使用要求设计确定的，取决于机器人的机械精度与电气精度。


    # 7. 驱动方式


    机器人的驱动方式一般是指机器人的动力源形式，主要有液压驱动、气压驱动和电力驱动等。不同的驱动方式有各自的优点和缺点。例如，液压驱动的主要优点在于可以以较小的驱动器输出较大的驱动力，缺点是油料容易泄漏，污染环境。气压驱动的主要优点是具有较好的缓冲作用，可以实现无级变速，但是噪声大。电气驱动效率高、使用方便、成本较低，因此目前机器人较常用的是电气驱动方式。


    # 8. 控制方式


    机器人的控制方式则是指机器人控制轴的方式，目前主要分为伺服控制和非伺服控制。伺服控制方式又可以细分为连续轨迹控制类和点位控制类。与非伺服控制机器人相比，伺服控制机器人具有较大的记忆储存空间，可以储存较多点位地址，可以使运行过程更加复杂平稳。


    本小节以宇树公司人形机器人 G1 为例介绍人形机器人机构设计的方法和步骤。其系统设计方案如图 8-2 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_215_0.png)


    图 8-2 宇树人形机器人 G1 的系统设计方案


    +   1) 确定工作对象和工作任务。


    +   2) 确定设计要求，具体如下：


    +   ① 负载。根据用户工作对象和工作任务的要求，参考国内外同类产品标准，确定机器人负载。


    +   ② 速度。根据用户工作对象和工作任务的要求，参考国内外同类产品，确定机器人运动的最大复合速度和机器人各单轴的最大角速度。


    +   ③ 精度。根据用户工作对象和工作任务的要求，参考国内外同类产品的先进机型，'
  merge: -1
  img_proc: true
- pgno: 216
  md: '确定机器人的重复定位精度。


    ④ 控制方式。根据用户工作对象和工作任务的要求，确定机器人的控制方式，一般机器人的控制方式有遥控、通过上位机发送指令控制、自主控制。


    ⑤ 工作空间。根据用户工作对象和工作任务的要求，参考国内外同类产品的先进机器人，确定机器人的工作空间的大小和形状。


    ⑥ 尺寸规划。根据对工作空间的要求，参考国内外同类产品，确定机器人的腿长、臂杆长度和臂杆转角，并进行尺寸优化。


    3) 机器人运动的耦合分析。对大多数非直接驱动的机器人而言，前面关节的运动会引起后面关节的附加运动，产生运动耦合效应。设计时需要统筹考虑各个关节之间的耦合，方便运动控制。


    4) 机器人平衡。需要尽量保证机器人的质心在对称中心的位置，以便克服机器人运动时的惯性力，而忽略重力矩的影响。在伺服控制中因减少了负载变化的影响，因而可实现更精确的伺服控制。


    5) 机器人动力学分析。机器人因各轴的重力矩均已基本平衡，故在这些轴运转时电机主要需克服的是由各轴转动惯量所带来的动力矩。


    6) 电机的选用。选好伺服电机，是设计的关键。由于机器人要求结构紧凑、重量轻、运动特性好，故希望在同样功率的情况下，电机要尽可能轻，外形尺寸要尽可能小。在选用时要注意，交流伺服电机的速度是可调节的，且在相当大的转速范围内电机输出的转矩是恒定的。故选用电机时，只要电机的额定转速大于各轴所需的最高转速就行。同时，还要注意与伺服电机配置在一起的位置编码器的选用，并注明电机是否需要带制动器等。


    7) 减速器的选用。常见的人形机器人减速器有 RV 减速器、谐波减速器、滚珠丝杠及行星减速器等。RV 减速器具有长期使用不需再加润滑剂、寿命长、刚度好、减速比大、低振动、高精度、保养便利等优点，适合机器人使用。它的传动效率为
    0.8，相对于同样减速比的齿轮组，效率更高；缺点是质量大，外形尺寸较大。谐波减速器的优点是重量较轻、外形尺寸较小、减速比范围大、精度高。滚珠丝杠是直线驱动方式，一般会涉及连杆方式传动，是当前的应用热点，如特斯拉机器人腿部使用了滚珠丝杠的传动方式。行星减速器因其结构相对简单、减速比范围大等优点也经常被使用。


    8) 机器人整体校核。机器人的结构件需要在设计完成后进行强度校核和刚度校核，在满足强度和刚度的情况下，要尽可能采用轻型材料，以减少运动惯量，给平衡机构减轻压力。


    9) 零件的加工与装配、调试。在确定了设计细节后，需要将三维图样转化为生产加工的工程图。此时应详细考虑加工工艺，特别是为充分降低人形机器人自身负载，对人形机器人的很多异构零件，需要着重考虑保证精度要求下的变形。


    # 8.3 驱动机构设计


    # 8.3.1 驱动的基本概念


    驱动为机器人提供动力。大多数机器人的驱动元件均可直接采购，也可以根据特定功能机器人的需要进行定制。人形机器人的驱动方式主要有电动、液压驱动和气动三种，可'
  merge: -1
  img_proc: true
- pgno: 217
  md: '以只用一种驱动方式，也可以采用几种方式联合驱动。选择驱动方式时主要需要考虑负载、效率、精度和环境等因素。由于液压系统具有较大的负重比，因此大负载的场合通常选用液压驱动。气动系统简单、成本低，适合节拍快、负载小、精度要求不高的场合，常用于点位控制、抓取、弹性握持和真空吸附等。电动系统适合于中等负载，特别适合动作复杂，运动轨迹要求严格的工业机器人和各种微型机器人。


    # 8.3.2 驱动的分类与特点


    # 1. 电动机驱动


    目前，电动机驱动是机器人中应用最多的驱动方式，主要的驱动元件有伺服电动机、步进电动机等。


    (1) 伺服电动机 伺服电动机是大多数机器人执行器的动力源。伺服电动机可以在频繁运动和瞬时运动变化过程中精确控制位置、速度和转矩，其结构与普通电动机类似，但具有惯性低和转矩大的特点，能够用于高加速度的场合。应用于机器人的伺服电动机主要是永磁直流电动机和无刷直流电动机。


    由于永磁直流电动机具有转矩大、大范围的速度可控性、良好的转矩速度特性及对各种控制方法的适应性，因此被广泛应用于驱动机器人。直流电动机将电能转为旋转或线性机械能，具有许多不同的类型和配置。成本最低的永磁电动机使用阳磁铁，玩具机器人和机器人爱好者通常使用此类型的电动机。带有稀土元素的永磁电动机，磁体定子可以提供大的转矩和功率。


    无刷直流电动机广泛应用于工业机器人。它采用磁性或光学传感器和电子开关电路代替有刷直流电动机使用的电刷和换向器，从而消除换向部件的摩擦、火花磨损。由于降低了电动机的复杂性，因此无刷直流电动机成本很低。但是，此类电动机的制作比有刷电动机要复杂、昂贵。无源多极铁磁铁转子和无刷电动机绕线铁定子具有良好的散热性和可靠性。线性无刷电动机的工作原理与展开式旋转电动机相同，具有多个体定子和绕线式电子换向推杆或滑块。因此可以在运动部件惯性很小，快速响应的伺服阀领域推广。


    用于小型机器人的无铁心转子电动机，通常采用外包环氧树脂复合杯或盘型结构的铜芯导体。这类电动机的优点包括电感低、摩擦力小和无齿槽转矩。盘型电动机总长度较短，由于转子有许多换向段，因此具有输出平滑且转矩波动小的优点。但是由于体积小、散热路径有限，所以无铁心转子电动机的热容量很小。因此，当驱动功率高时，需要具有严格的占空比限制或需要外部空气的加速冷却。


    (2) 步进电动机 步进电动机多用于简单的小型机器人，步进电动机的功重比低于其他类型的电动机。此类机器人使用位置和速度的开环控制，易与驱动电路连接使用，成本相对较低。微步控制可以满足对
    10000 个甚至更多离散机器人关节位置的精度要求。在开环步进的模式下，电动机和机器人的运动通过机械方式或控制算法进行校准。步进电动机也可以采用闭环控制，此类步进电动机与直流电动机或交流伺服电动机类似。


    # 2. 液压驱动


    液压驱动将液压能转化为机械能，具有非常大的驱动力和功重比。液压驱动系统一般由油箱、液压泵、单向阀、安全阀、控制阀和液压执行机构等组成。由液压泵将高压油输'
  merge: -1
  img_proc: true
- pgno: 218
  md: '送到执行机构来完成指定动作。液体的压力、流量和方向分别由压力控制阀、流量控制阀和方向控制阀进行控制。流量控制阀通过改变液体的流量，来改变液压驱动器的速度。出于安全考虑，使用安全阀限制系统的最高压力。


    由于使用高压油，液压驱动可以提供很大的驱动力或转矩以及高功重比，因此可以在运动部件惯性很小的情况下实现线性和旋转运动。但是，液压站体积庞大，快速响应的伺服阀成本高，泄漏和维护等问题限制了液压动力机器人的使用和推广。液压驱动主要应用在力或转矩要求较大的情况。


    # 3. 气动


    气动与液压驱动的原理相似，将能量以压缩空气的形式转换成线性或旋转运动。它易于控制、成本低廉，主要应用在简单的机械领域。气动在机械限位挡块之间的运动通常是不受控制的，因此在点对点运动中具备良好的性能。较电磁驱动而言，气动在爆炸性环境中相对安全，受环境温度和湿度的影响较小，但能量利用率较低。一些小型的执行机构可以使用工厂气源。但若需大量使用气动，则需购买和安装昂贵的专用压缩空气源。气动系统由气体压缩组件、阀门、气动执行机构和管道组成，使用空气压缩机压缩空气，通过阀门控制气体压力、流量和方向，使用气缸或气动马达实现线性或旋转运动。由于气动的功率比液压驱动或电磁驱动的小，因此气动一般不应用于驱动力较大或转矩大的场合。但是在某些要求高功重比的人形机器人手或人造肌肉上应用较多。气动的人造肌肉通过收缩气囊或伸展气囊来改变内部气压，实现肌肉收缩或延伸。


    # 4. 其他驱动


    人形机器人部分关节还可以采用其他类型的驱动，包括形状记忆合金、双金属、化学、电活性聚合物和微机电系统等。此类驱动大多应用于研究和特殊应用的机器人，不适用于批量生产。


    # 8.3.3 关节的驱动方式


    关节的驱动方式有直接驱动和间接驱动两种方式：直接驱动方式是指驱动器的输出轴和机器人的关节轴直接相连；间接驱动方式是指驱动器经过减速机、钢丝绳、皮带、平行连杆等装置后与关节轴相连。


    # 1. 直接驱动方式


    直接驱动机器人也称为 DD 机器人（Direct Drive Robot，DDR）。DD 机器人一般指驱动电动机通过机械接口直接与关节连接。DD 机器人的驱动电动机和关节之间没有速度和转矩的转换。目前，中小型机器人一般采用普通的直流伺服电动机、交流伺服电动机或步进电动机作为执行电动机。由于速度较高，因此需配以大速比的减速装置，进行间接驱动。但是，间接驱动带来了机械传动中不可避免的误差，从而引起冲击振动，影响机器人系统的可靠性，增加关节重量和尺寸。DD
    机器人与间接驱动机器人相比，有如下优点：


    +   1) 机械传动精度高。

    +   2) 振动小，结构刚度好。

    +   3) 机械传动损耗小。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '4) 结构紧凑，可靠性高。


    5) 电动机峰值转矩大，电气时间常数小，短时间内可以产生大转矩，响应速度快，调速范围宽。


    6) 控制性能较好。


    DD 机器人是一种极有发展前途的机器人，许多国家投入了大量的研发费用。日本、美国等发达国家已经开发出性能优异的 DD 机器人。美国 Adept 公司研制了带视觉功能的
    4 自由度平面关节型 DD 机器人。


    但是，DD 机器人还存在以下几个问题：


    1) 载荷变化、耦合转矩、非线性转矩对驱动及控制影响显著，控制系统复杂、设计困难。


    2) 对位置、速度的传感元件要求高，传感器精度为带减速装置（减速比为 K）间接驱动的 K 倍以上。


    3) 电动机的转矩 / 重量比和转矩 / 体积比较小。


    4) 电动机成本高。


    5) 将电动机直接安装在关节上，增加了臂的总质量，对下一个关节产生干扰，负载能力和效率下降。


    因此，直接驱动主要用于小型人形机器人的设计。


    # 2. 间接驱动方式


    大部分机器人的关节采用间接驱动。由于间接驱动的驱动器输出力矩远小于驱动关节所需的力矩，因此需要使用减速机。另外，由于手臂通常采用悬臂梁结构，因此驱动多自由度机器人关节的大多数驱动器的安装将使手臂根部关节驱动器的负荷增大。通常可用下列形式的间接驱动机构解决此问题：


    （1）钢丝绳 将驱动器和关节分开安装，使用钢丝绳传递动力的方式。此种方式又可分为钢丝绳软管方式和钢丝绳滑轮方式两种。因为钢丝绳的路径可以任意决定，所以能够较容易地构成多自由度的驱动系统。但钢丝绳和软管之间存在不可忽略的摩擦，控制比较困难。虽然钢丝绳滑轮方式动力传递机构的非线性因素少，但是滑轮的装配方式、钢丝绳的路径构成等较为困难。


    （2）链条、钢带 使用链条、钢带的方式将驱动器安装在离关节较远之处，是远程驱动的手段之一。链条、钢带与钢丝绳相比，刚性高、传递输出较大，但在设计上限制较大。SCARA
    型关节机器人多采用此法。


    （3）平行四边形连杆机构 平行四边形连杆机构的特点是将驱动器安装在手臂的根部，而且该结构能够简化坐标变换的运算过程。


    # 8.3.4 材料的选择


    机器人本体材料的选择应从机器人的性能要求出发，满足机器人的设计和制作要求。机器人材料并不是简单工业材料的组合，而应是在充分掌握机器人的特性和各组成部分的基础上，从设计思想出发，确定所用材料的特性。即，必须事先充分理解机器人的概念和各组成部分的作用。机器人本体材料既起着支承、联结、固定机器人各部分的作用，同时'
  merge: -1
  img_proc: true
- pgno: 220
  md: '它本身又是运动部件，因此机器人运动部分的材料重量要轻。精密机器人对机器人材料的刚性有要求。刚度设计时要考虑静刚度和动刚度等多个要素。从材料角度看，控制振动涉及减轻重量和抑制振动两个方面，本质上就是材料内部的能量损耗和刚度问题，它与材料的抗震性紧密相关。传统的工业材料或机械材料与机器人材料之间的差别在于机器人是伺服机构，其运动是可控的，是传统材料所没有的“被控性”。材料的“被控性”与材料的“结构性”“轻质性”和“可加工性”同样重要。材料的“被控性”取决于材料的轻质性、抗震性和弹性。材料的“可加工性”是指加工成发挥材料特性的形状时的难易程度，是一个很重要的指标。机器人本体材料的选择必须与材料的结构性、轻质性、刚性、抗震性和机器人整体性能同时考虑。机器人与人类共存，尤其是家用和招待机器人的外观将与传统机械大有不同。这样一来，将会出现比传统工业材料更富有美感的机器人本体材料。从这一点出发，机器人材料又应具备柔软和外观美等特点。总之，选择机器人的材料时要综合考虑强度、刚度、重量、弹性、抗震性、外观以及价格等因素。常用的机器人材料如下：


    +   1) 碳素结构钢、合金结构钢，强度好，特别是合金结构钢强度比一般钢大 4 ~ 5 倍，弹性模量大，抗变形能力强，是应用最广泛的材料。


    +   2) 铝、铝合金及其他轻合金材料，重量轻，弹性模量 E 虽然不大，但是材料密度 ρ 小，故 E/ρ 仍可与钢材相比。


    +   3) 纤维增强合金，如硼纤维增强铝合金、石墨纤维增强镁合金。这种纤维增强金属材料具有非常高的 E/ρ 比值，但价格昂贵。


    +   4) 陶瓷，具有良好的品质，但是脆性大，不易加工成具有长孔的连杆，与金属零件连接的接合部需特殊设计。然而，日本的相关单位已经试制了在小型高精度机器人上使用的陶瓷机器人臂的样品。


    +   5) 纤维增强复合材料，具有极好的 E/ρ 比值，不但重量轻、刚度大，而且其阻尼系数之大是传统金属不可能具备的，但存在老化、蠕变、高温热膨胀、与金属件连接困难等问题。所以，在高速机器人上应用复合材料的实例越来越多。叠层复合材料的制造工艺还允许用户进行优化，改进叠层厚度、纤维倾斜角、最佳横断面尺寸等，使其具有最大阻尼值。


    +   6) 黏弹性大阻尼材料，可以增大机器人连杆件的阻尼，是改善机器人动态特性的有效方法。


    # 8.4 传动机构设计


    # 8.4.1 机器人传动机构简介


    传动部件是构成机器人的重要部件。机器人的运动不仅需要能源，而且需要运动传动机构，传动部件设计的优劣影响着机器人的性能。传动机构是指将驱动器输出的动力传送到工作单元的一种装置。传动机构的作用包括调速、调转矩，以及改变运动形式、动力和运动的传递分配等，其设计包括关节形式的确定、传动方式以及传动部件的定位和消隙等多个方面。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 8.4.2 传动机构的基础知识


    机器人中连接运动部分的机构称为关节（joint）。关节有转动型和直线型，分别称为转动关节和直线关节。图 8-3 所示为宇树人形机器人 G1 的腿部关节设计。


    # 1. 转动关节


    转动关节（rotary joint）就是关节型机器人中被简称为“关节”的连接部分。它既连接各机构，又传递各机构间的回转运动（或摆动），用在基座与臂部、臂部之间、臂部和手等连接部位。关节由回转轴、轴承和驱动机构组成。


    （1）转动关节的形式 由于驱动机构的连接方式有多种，因此转动关节也有多种形式。


    +   1) 驱动机构和回转轴同轴式。这种形式直接驱动回转轴，有较高的定位精度；但是，为了减轻重量，要选择小型减速器并增加臂部的刚性。它适用于水平多关节型机器人。


    +   2) 驱动机构与回转轴正交式。它要求质量大的减速机构设计在基座上，通过内部的齿轮、链条来传递运动。这种形式适用于要求内部结构紧凑的场合。


    +   3) 外部驱动机构驱动臂部的形式。它适合于传递大转矩的回转运动，采用的驱动机构有滚珠丝杠、液压缸和气缸等。


    +   4) 驱动电动机安装在关节内部的形式。这种方式又称为直接驱动方式。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_221_0.png)


    （2）轴承 用在转动关节的轴承有多种形式。在机器人中，轴承起着相当重要的作用，主要采用滚动轴承，最常用的有薄壁密封型球轴承。此外，还开发了一种能受径向载荷、轴向载荷和转矩的交叉滚子轴承。该轴承承载能力大，常用在摆动或转动关节上。


    # 2. 直线关节


    直线关节由直线运动机构和在整个运动范围内起直线导向作用的直线导轨部分组成。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '导轨部分分为滚动导轨、直线电机导轨等形式，各有特点。一般来说，机器人导轨要求间隙小或能消除间隙，在垂直于运动方向上刚度高、摩擦系数小且不随速度而变化；高阻尼、小尺寸和小惯量。通常，由于机器人在速度和精度方面要求很高，故一般采用结构紧凑且价格低廉的滚动导轨。


    (1) 滚动导轨 滚动导轨可以按轨道和滚动体进行分类。按轨道分类——圆轴式、平面式和滚道式；按滚动体分类——球、滚柱和滚针；按滚动体是否循环分类——循环式、非循环式。这些滚动导轨各有各的特点，应按不同的使用要求选用相应的类型。装入滚珠的滚动导轨适用于中小载荷和摩擦小的场合，装入滚柱的滚动导轨适用于重载和高刚性的场合。轻载的滚柱特性接近线性弹簧，呈硬弹簧特性；滚珠的特性接近非线性弹簧，刚性要求高时应施加一定的预紧力。下面就对几种主要的滚动导轨予以说明。


    +   1) 圆轴循环式球滚动导轨。在 ISO 的相关标准中，已对这种滚动导轨的尺寸和精度等指标进行了标准化。其保持器固定在外圆筒上，钢球可在保持器的循环槽内非常自如地循环。它的轴向运动轻快、摩擦力小、进给精度高，可做成间隙可调型导轨，其外圆柱的轴向有切口，用内径可调的轴承座就能调整径向间隙。这种轴承价格便宜、精度高，适合于承受轻载的场合。


    +   2) 滚道循环式球滚动导轨。这种导轨由长轨和移动体组成。按钢球和导轨接触方式不同可分为角接触型和双圆弧接触型。在这种导轨的移动体（轴承室）中加工出
    4 条半径比钢球半径稍大的滚道，内嵌入钢球，使得导轨能承受上下左右的载荷和周向载荷。这种滚动导轨用螺栓将轨道、移动体与机械装置相连，能承受较大的载荷。当用在有振动和冲击的场合时，要加适当的预紧力。


    +   3) 滚道循环式滚子滚动导轨。这种导轨由长导轨和移动体组成，导轨和移动体相对的面内开有两个 90° 的 V 形滚道，在其内交叉地嵌入了直径与长度大致相同的滚子（交叉滚子）。该方式上下左右可承受的额定载荷相同，且能承受回转力矩，是一种额定载荷大，刚性好的滚动导轨。


    +   4) 滚针导轨。引导不同形状和尺寸的工件的滚针导轨有多种形式。它们工作时，都以外圈转动，滚针嵌入外圈与轴之间起导向作用，外圈面外表面有球面形和圆柱面形，后者用于承受大载荷的场合。


    (2) 直线电动机导轨 直线电动机导轨是为了消除传动机构间隙等机械误差而开发的导轨。包含直线电动机，可在轨道上直线驱动。它将滚动导轨和直线电动机组合成一体实现直线运动，而不再需要滚珠丝杠、齿轮和皮带等进给机构。直线电动机运动时，自身产生一定的阻力，故即使没有制动器也能保持在原来的停止位置。著名的人形机器人LOLA
    的腿部机构设计就有直线电动机导轨的结构。


    # 8.4.3 传动方式的设计


    传动机构将驱动器的运动传递到关节和动作部位，从而将机械动力传递给负载。选择机器人传动机构需要综合考虑运动、负载和功率要求以及驱动器位置。传动机构必须兼顾刚度、效率和成本，特别是对于正反向运动频繁、变负载的工况，传动间隙和交变应力会影响传动刚度。高传动刚度和低（或无）传动间隙将增大摩擦损失。大多数机器人在额定功率水平或接近额定功率水平运行时，传动机构具有良好的效率。过重的传动机构会带来'
  merge: -1
  img_proc: true
- pgno: 223
  md: '惯性和摩擦损失。安全系数不足的传动机构刚度较低，在连续或重载工况下易磨损或易因意外过载而失效。


    机器人通常通过传动机构来驱动关节，以高效的能量传递方式将驱动力传递给机器人关节。在实际应用中，机器人联合使用各种传动机构，其传动比与驱动器的转矩、转速和惯量有关。传动机构的设计、尺寸和安装位置，决定了机器人的刚度和整体操作性能。由于采用了传动机构，因此现代机器人基本上都具有高效、超荷的抗损坏性能。


    直驱机构是运动学上最简单的传动机构。对于气动或液压驱动的机器人，就是驱动器直接连接在连杆上。电动直驱机器人直接将大转矩低转速的直流电动机连接到连杆上，可以完全消除自由游隙，且转矩输出平稳。通常，由于驱动器与连杆之间的动量比（惯性比）较小，因此驱动器的功率较大、效率较低。


    (1) 直齿或斜齿轮传动机构 该机构可以为机器人提供可靠、密封且维护简单的动力传输，适用于需要紧凑传动且多轴相交的关节。由于大型机器人的基座需要承受高刚度、高转矩，故常用大直径齿轮传动。通常使用多级齿轮传动和较长的传动轴，增大驱动器与从动件之间的物理空间。


    行星齿轮传动机构通常集成在紧凑型减速电动机中。需要巧妙的设计、高精度和刚性的支撑，才能使传动机构在实现低间隙的同时，保证刚度、效率和精度。图 8-4 所示为人形机器人行星减速器关节的设计示例。


    由于电动机是高转速、小转矩的驱动器，而机器人通常要求低转速、大转矩，因此常用行星齿轮传动机构和谐波传动机构完成转速和转矩的变换与调节。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_223_0.png)


    图 8-4 人形机器人行星减速器关节的设计示例


    (2) 谐波传动机构 该机构在机器人中已得到广泛应用，当前人形机器人大部分手臂机构都采用了谐波传动机构。谐波传动机构通常由谐波减速器组成，谐波减速器由谐波发生器、刚轮和柔轮三个基本部分组成。


    谐波发生器通常采用凸轮或偏心安装的轴承构成，刚轮为刚性齿轮，柔轮为能产生弹性变形的齿轮。工作时，固定刚轮，由电动机带动谐波发生器转动，柔轮作为从动轮，输出转动，带动负载运动。谐波传动结构简单、体积小、重量轻、传动精度高、承载能力大、传动比大，具有高阻尼特性，但柔轮易疲劳、扭转刚度低、易产生振动。图
    8-5 所示为谐波减速器及其工作原理。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_223_1.png)


    图 8-5 谐波减速器及其工作原理'
  merge: -1
  img_proc: true
- pgno: 224
  md: '(3) 蜗杆传动机构 该机构可以以直角和偏置的形式布置，传动比高，结构紧凑，有良好的刚度和承载力，常用于低速机械手。蜗杆传动效率较低，可以在高传动比下自锁，在机械手关节无动力时保持其位置，但在手动复位机械手时，容易造成损坏。图
    8-6 所示为蜗杆传动示例。


    (4) 丝杠传动机构 滚珠丝杠通过循环滚珠螺母与钢制滚珠螺杆配合，高效平稳地将旋转运动转换为直线运动。由于易将滚珠丝杠集成到螺杆上，故可以封装成紧凑型驱动器或减速器，以及定制集成的减速传动组件。中短行程中滚珠丝杆传动刚度较好，但用于长行程时，由于螺钉只在螺杆两端支撑，因此刚度较低，采用高精度滚珠螺钉可以使间隙很小甚至为零。螺杆转速受限于螺杆动态稳定性，螺母难以达到高转速。对于低成本机器人，可以选择使用由热塑性螺母和热轧螺纹丝杠组成的滑动丝杠减速器。图
    8-7 所示为丝杠传动及关节示例。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_224_0.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_224_1.png)


    丝杠传动有滑动式、滚珠式和静压式等。机器人传动用的丝杠应具备结构紧凑、间隙小和传动效率高等优点。


    (5) 齿轮齿条传动机构 该机构适用于直线甚至弯曲轨道的大行程传动。传动刚度由齿轮齿条连接和行程长度决定。由于齿间游隙难以控制，因此要保证全行程中齿轮齿条的中心距公差。双齿轮传动有时会采用预加载的方式来减小齿间游隙。较丝杆传动，由于齿轮齿条传动比较小，因此传动能力较弱。小直径（低齿数）齿轮接触状态较差，易产生振动，而渐开线齿轮传动则需要润滑以减少磨损。齿轮齿条传动通常用于大型龙门式机器人和履带式机器人。图
    8-8 所示为齿轮齿条传动示例。


    (6) 带传动与链传动机构 该机构用于传递平行轴之间的回转运动，或者把回转运动转换成直线运动。机器人中的带传动和链传动分别通过带轮或链轮传递回转运动，有时也用于驱动平行轴之间的小齿轮。


    1) 同步带传动。同步带的传动面上有与带轮啮合的梯形齿。传动时无滑动，初始张力小，被动轴的轴承不易过载。由于同步带不会产生滑动，因此除了用作动力传动外，还可以用于定位。同步带采用氯丁橡胶为基材，加入玻璃纤维等伸缩刚性大的材料，齿面上覆盖耐磨性好的尼龙布。用于传递轻载荷的同步带用聚氨基甲酸酯制造。


    同步带传动属于低惯性传动，适合电动机和大减速比减速机之间使用。若在皮带上安装滑座则可完成与齿轮齿条机构相同的功能。由于同步带传动惯性小且有一定的刚度，因此适合高速运动的轻型滑座。图
    8-9 所示为带传动示例。'
