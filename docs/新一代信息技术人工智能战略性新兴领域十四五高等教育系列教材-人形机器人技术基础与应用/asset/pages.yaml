- pgno: 165
  md: '器的重要分支，是一种用于测量物体的加速度、角速度和倾斜角度等参数的电子传感器。如图 6-6 所示，它主要包括陀螺仪、加速度计等，由两个及以上惯性测量
    MEMS 芯片及 ASIC（Application Specific Integrated Circuit，专用集成电路）合封后，通过组合形成惯性组合传感器
    IMU（Inertial Measurement Unit，惯性测量单元）芯片，可以将物体运动的加速度、位置和姿态转换为电信号，从而获取关节的位置、速度、加速度和角度等信息。根据内置传感器不同，它分为
    6 轴 IMU 和 9 轴 IMU。6 轴 IMU 通常包含一个 3 轴陀螺仪和一个 3 轴加速度计，可以测量物体在三维空间的角速度和加速度；9 轴 IMU
    是在 6 轴 IMU 的基础上叠加一个 3 轴磁力计。IMU 的基本原理是利用加速度计、陀螺仪、磁力计等内置传感器估计 IMU 的位置和方向，从而得到安装了
    IMU 的机器人各个身体部位的位置和方向。其优势是无需外部摄像头，劣势是内置传感器存在漂移问题进而影响精确性。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_165_0.png)


    图 6-6 MEMS 惯性传感器


    MEMS 陀螺仪是 MEMS 惯性传感器的基础核心器件之一，它利用科里奥利效应测量角速率，主要用于感知物体运动的角加速度。图 6-7a 所示是陀螺仪的工作原理示意图，一个物体（质量为
    m）以固定的线速度 v 运动，因为物体自身惯性，相对于旋转体系，它同时受到一个角速度 $^b\omega$ 的影响，这时在叉乘方向会有一个科里奥利力（简称科氏力）$F_{coriolis}$
    的作用，即


    ```

    $F_{coriolis} = -2m^b\omega \times v$ (6-2)

    ```


    式中，$v$ 为物体相对于旋转参考系的运动速度（矢量）；$^b\omega$ 为旋转体系角速度（矢量）；$\times$ 表示矢量相乘，方向满足右手螺旋定则。


    在实际的应用中，物体处于不断运动中，若有旋转的角速度则会在垂直的方向产生科氏力，最终通过电容的变化来反应该力的大小，从而得到旋转角速度的大小。


    MEMS 陀螺仪的核心是一个微机械芯片，一个专用集成电路（ASIC）芯片及应力隔离封装，具体用于导航定位、姿态感知、状态监测等领域。与传统机械陀螺仪相比，MEMS
    陀螺仪的优势包括：更小、更轻；微细加工工艺，比传统陀螺仪更具成本效益；功耗更低；损耗更小，可靠性更高。


    MEMS 加速度计主要用于感知物体运动的线加速度。加速度计的检测装置捕获的是引起加速度的惯性力，可利用牛顿第二定律获得加速度值。其测量原理可以用一个简单的质量块、弹簧和指示计来表示，如图
    6-7b 所示。根据感测原理，MEMS 加速度计分为压阻式、电容式以及热式等类型。其中电容式 MEMS 加速度计是最为常用的一种，具有高灵敏度、高精度、低温度敏感等优点。


    磁力计通常作为辅助或补充。磁力计采用 3 个互相垂直的磁阻传感器，每个轴向上的传感器检测在该方向上的地磁场强度，将相关数据汇入微控制器的运算器，以提供磁北极相关的航向角。图
    6-8 所示磁力计采用一种具有晶体结构的合金薄膜。它们对外界的磁场敏感，磁场的强弱变化会导致磁阻传感器的电阻值发生变化。磁力计能提供俯仰角、横滚角和航向角的测量数据。除勘探、军事等传统应用领域，MEMS
    技术使磁力计体积更'
  merge: -1
