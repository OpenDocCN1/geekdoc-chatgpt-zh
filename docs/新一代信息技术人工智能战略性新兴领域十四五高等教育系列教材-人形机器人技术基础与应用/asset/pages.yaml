  md: '些任务要求精确定位以确保工艺质量和效率。然而，有时末端执行器的方向要比位置更为重要。比如，当机械臂的末端是一台天文望远镜，观测非常远的天文现象时，机械臂的位置误差可能影响不大，但方向上稍有误差，就可能无法对准观测目标，导致观测失败。


    机器人全身控制（Whole Body Control，WBC）通过控制机器人的所有可驱动关节来优化机器人的整体行为。通常，一个综合的机器人控制任务可以依据不同的意义分解成多个子任务，并根据重要程度划分优先级。高优先级任务（如保持平衡和关键点的精确定位）必须优先执行，而低优先级任务（如调整姿态以达到美观效果）则不应影响高优先级任务的执行。例如，在一个双足机器人的行走控制中，保持身体平衡和步伐稳定是首要任务，而摆动手臂以保持动态平衡或进行交互则是次要任务。在这种情况下，WBC
    方法能够通过任务优先级的设定，确保关键的高优先级任务得到优先执行，同时也能灵活地处理次要任务，使机器人能够在复杂环境中高效、稳定地运行。通过这种方式，机器人不仅能在任务中保持高精度的执行能力，还能在面对多任务场景时展示出高度的灵活性和适应性，因此目前被广泛应用于四足机器人和双足机器人。


    根据前面的运动学知识，可以知道机器人的任务空间向量 \( x \) 与关节空间向量 \( q \) 存在一个非线性映射关系，同时工作空间速度 \( \dot{x}
    \) 与关节空间速度 \( \dot{q} \) 之间存在一个线性映射关系，其中 \( J \) 称为雅可比矩阵，是关节空间 \( q \) 的函数。雅可比矩阵
    \( J \) 是关节空间速度到工作空间速度的映射。当工作空间维度较少而关节空间维度较多时，对于某些工作空间速度 \( \dot{x} \)，可以算出多个甚至无数个
    \( \dot{q} \)，则称这种机器人为冗余机器人。有


    \( x = f(q) \)

    \( \dot{x} = J\dot{q} \)

    (3-85)


