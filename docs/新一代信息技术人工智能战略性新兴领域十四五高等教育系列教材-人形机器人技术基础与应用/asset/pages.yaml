    式中，\( \boldsymbol{c} \) 为轨迹参数；\( \boldsymbol{A}_p \)、\( \boldsymbol{A}_v \)、\(
    \boldsymbol{A}_a \) 为只与采样时间相关的系数矩阵。将式 (9-36) 代入式 (9-35) 并忽略影响较小的二次项及转动可得


    \( \begin{bmatrix} m(\ddot{\boldsymbol{p}}-\boldsymbol{g}) \\ m\hat{\dot{\boldsymbol{p}}}(\dot{\boldsymbol{p}}-\boldsymbol{g})+\dot{\boldsymbol{L}}
    \end{bmatrix} \approx \begin{bmatrix} m\boldsymbol{A}_a \\ m\hat{\dot{\boldsymbol{p}}}_0
    \boldsymbol{A}_a + m\hat{\boldsymbol{g}} \boldsymbol{A}_p \end{bmatrix} \boldsymbol{c}
    + \begin{bmatrix} -m\boldsymbol{g} \\ m\hat{\dot{\boldsymbol{p}}}_0 \end{bmatrix}
    = \sum_{i=1}^{N_c} \begin{bmatrix} \mathbf{I}_{3 \times 3} \\ \hat{\boldsymbol{r}}_i
    \end{bmatrix} \boldsymbol{f}_i = \boldsymbol{Gf} \) (9-37)


    式 (9-37) 的系数部分均可根据机器人状态及环境信息计算得到，从而用于构建二次规划问题。


