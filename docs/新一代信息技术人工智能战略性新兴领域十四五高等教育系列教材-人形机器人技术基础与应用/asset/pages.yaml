    深度图像（ depth image ）是一种特殊类型的图像，不仅包含二维平面上的信息（如

    常规的 RGB 彩色图像），还包含每个像素点到摄像头的距离信息。这种距离信息被称为深

    度信息，通常以灰度值或伪彩色表示，每个像素的值表示该点到摄像头的距离。深度图像

    可以表示为一个二维矩阵（深度图），其中每个元素包含一个深度值。例如，在深度学习

    模型中，一个八位的灰度深度图像可以表示为


    ```

    Depth Image = \begin{bmatrix} 10 & 20 & 30 & \cdots \\ 40 & 50 & 60 & \cdots \\
    \vdots & \vdots & \vdots & \end{bmatrix}

    ```


    其中，较小的数值表示较近的距离，较大的数值表示较远的距离。


    # 7.2.2 二维图像处理技术基础


    # 1. 图像增强与预处理


    在计算机视觉和深度学习中，图像增强和预处理是至关重要的步骤。它们有助于提升

    模型的性能，提高训练速度，减少过拟合，以及增强模型的泛化能力。在深度学习中，数

    据增强和预处理被广泛应用于图像分类、目标检测、图像分割等任务中。它们可以帮助模

    型更好地泛化，并对抗数据集中的变动和噪声。


    图像增强（image augmentation）通过对原始图像进行各种变换，生成新的训练样本，

    增加数据集的多样性。常见的图像增强方法包括翻转（ flipping ）、旋转（ rotation ）、缩放

    （ scaling ）、平移（ translation ）、裁剪（ cropping ）、颜色变换（ color jittering ）以及向图像

    中添加高斯噪声或椒盐噪声。


    图像预处理（image preprocessing ）包括一系列操作，其目的是使图像适合模型的输

    入要求，并提高模型的训练效果。常见的图像预处理方法包括尺寸调整（resizing）、归一

    化（ normalization ）等。


    # 2. 图像特征提取


    在过去的几十年里，神经网络在计算机视觉领域取得了巨大成功，它们已经成为理解

    和处理图像数据的核心工具。从自动驾驶到医疗影像分析，神经网络在许多应用中扮演着

    关键角色，对输入图像进行分析并提取关键特征。如图 7-2 所示，神经网络对输入的手写

    数字进行识别并输出结果。


    首先，图像本质上是一个由像素（ pixel ）组成的矩阵，每个像素包含一个或多个数

    值，表示其颜色和亮度。例如，一张灰度图像可以被表示为一个二维矩阵，其中每个元素

    是一个介于 0 ~ 255 的数值，表示像素的灰度值。彩色图像则由三个这样的矩阵组成，分

    别对应红色、绿色和蓝色通道（ RGB ）。


    CNN 是处理图像数据的主要工具，其基本结构包括以下几层：'
