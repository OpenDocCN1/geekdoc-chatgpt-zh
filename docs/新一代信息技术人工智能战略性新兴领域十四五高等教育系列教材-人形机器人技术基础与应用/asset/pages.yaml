  md: '# 6.2 人形机器人内部传感器


    # 6.2.1 编码器


    在自身状态感知中，编码器是人形机器人不可或缺的一部分，主要应用在人形机器人

    的旋转、直线执行模组和灵巧手上，可以实时监测人形机器人的关节角度、速度和位置等

    信息，通过伺服系统可实现对人形机器人的精确控制。编码器测量位移（角度）的基本原

    理是将旋转或直线位移转换为一串数字脉冲信号后进行测量。编码器按测量原理不同可分

    为光电式编码器、磁电式编码器、电感式编码器、电容式编码器等。每种编码器都有其独

    特的优点和适用场景。例如，光电式编码器适用于高精度、高分辨率的场合，磁电式编码

    器具有环境耐受性强、小型轻量、可靠性高的优点。


    # 1. 光电式编码器


    旋转光电式编码器基于光电转换原理来测量轴的旋转角度和速度，是目前最常用的一

    种编码器。在人形机器人中，常安装在机器人关节上，可以通过在关节旋转时生成脉冲信

    号来精确地测量关节的位置和运动。旋转光电式编码器主要由发光元件、旋转光栅（码

    盘）、固定光栅、光电元件等组成。其根据码盘形式和检测方式不同，可分为增量式编码

    器和绝对式编码器。


    （1）增量式编码器 图 6-3 所示为增量式编码器的内

    部结构。增量式编码器的码盘上开有相等角度的缝隙。码

    盘一侧是光源，另一侧是光栏板（其上开有几何尺寸与码

    盘相同的窄缝）。由于编码器码盘与被测轴同心，轴转动

    时会带动码盘旋转，在光栏板的作用下，码盘每转过一个

    缝隙，光电元件就会检测到一次明暗变化，使透过码盘的

    光束产生间断。这样经过光电元件的接收和电子线路的处

    理，将产生特定电信号输出。实际使用的增量式编码器输

    出三组方波，即 A 相、B 相和 Z 相。A、B 两相脉冲相位

    差 90°，可以判断出旋转方向和旋转速度。Z 相脉冲又称

    为零位脉冲，每转一周输出一个脉冲，通过零位脉冲可获

    得编码器的零位参考位。由于该编码器是依据从预定义的起始位置发生的增量变化来测量

    转角或速度的，因此被称为增量式编码器。增量式编码器具有较低的成本和较高的分辨

    率，适用于对速度和位置控制要求较高的场景。


    在人形机器人控制系统中，增量式编码器一般用作位置传感器，也可用于速度测量。

    增量式编码器输出的脉冲数代表位置，单位时间内的脉冲数表示这段时间的平均速度。因

    此，可通过计算单位时间的脉冲数来估算平均速度。例如，若编码器每转产生 \(N\) 个脉冲，

    在 \(T\) 时间（单位为 \(s\)）产生 \(m\) 个脉冲，那么平均转速为


    ```

    \( n = \frac{60m}{NT} \)

    ```


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_163_0.png)


    ```

    (6-1)

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '式中，n 是平均转速（r/min）；T 是测速采样时间（s）；m 是 T 时间内测得的编码器脉冲数（p）；N 是编码器每转脉冲数（p/r）。


    (2) 绝对式编码器 绝对式编码器的外观以及码盘结构如图 6-4 所示，其码盘与增量式编码器的码盘有较大区别，在其圆形码盘上沿径向有若干同心码道，每条码道上由透光和不透光的扇形区相间组成，码盘上的码道数是它的二进制数码的位数。在绝对式编码器中，码盘的一侧是光源，另一侧对应每一条码道有一个光电元件，当码盘处于不同位置时，各光电元件根据受光照与否转换出相应的电平信号，形成二进制数。码道越多，分辨率就越高。对于一个具有
    N 位二进制分辨率的编码器，其码盘必须有 N 条码道。绝对式编码器可以记录编码器在一个绝对坐标系上的位置，具有较高的精度和稳定性，适用于需要高精度控制的场合。它在掉电后再恢复供电时，输出值取决于码盘位置，能够保留数据记忆。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_164_0.png)


    图 6-4 绝对式编码器的外观以及码盘结构


    # 2. 磁电式编码器


    磁电式编码器利用电磁感应原理进行测量，如图 6-5 所示，它由磁性传感器、磁盘和信号转换器组成。磁盘由多个磁极组成，被固定在旋转轴上；磁性传感器通常采用霍尔元件等，能够检测磁盘旋转时磁场的变化，将其转换为电信号输出；信号处理器将电信号转换为数字信号，用于表示旋转轴的位置和方向。相比于光电式编码器，磁电式编码器对灰尘、污垢、液体和油脂等污染物以及振动等不良工况不敏感，更适合应用于各类复杂场景中的人形机器人。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_164_1.png)


    图 6-5 磁电式编码器


    # 6.2.2 MEMS 惯性传感器


    # 1. MEMS 惯性传感器


    MEMS 惯性传感器属 MEMS（Micro Electro Mechanical Systems，微机电系统）传感'
