- pgno: 146
  md: '应用的算法相匹配。此外，算法的复杂度和执行时间也是影响算法选择的因素。因此，在解决特定问题时选择一个有效的算法非常重要。


    全局路径规划通过使用已知的静态地图来规划从起始点到目标点的最佳可行路径。局部路径规划则需要根据实时传感器采集的环境信息获取动态的地图，并规划从当前节点到下一个节点的安全路径。全局路径规划和局部路径规划本质上都是寻找最佳路径的过程，但局部路径规划更容易受到实时环境的影响，包括动态障碍物和未知障碍物的影响。全局路径规划的算法可以经过一定改进用于局部路径规划，同时局部路径规划的算法也可以用于实现全局路径规划。


    # 5.3.1 全局路径规划


    全局路径规划算法需要机器人获取当前环境中的全部信息，本质是需要有已知环境的代价地图。代价地图基于预先建成的二维占用栅格地图（Occupancy Grid Map）生成，得到大致的可通行区域，并根据传感器的感知信息不断更新其可通行信息。此外，还需要根据机器人的尺寸大小生成膨胀区域，以避免规划出的路径可能会穿过机器人无法通过的狭窄缝隙。图搜索是指在一个由节点和边构成的图（Graph）中，通过遍历和搜索来查找特定节点或路径的过程，可以被用于多种应用场景。机器人的全局路径规划所用的代价地图是一种特殊的图结构，因此图搜索也被广泛应用于这一领域。下面分别从代价地图和常见的图搜索算法两个方面介绍全局路径规划的相关理论知识。


    代价地图是基于占用栅格地图的一种空间通行性的描述形式，因此在介绍代价地图之前需要先介绍占用栅格地图的表示形式。图 5-7 a 展示了一个在 Gazebo 仿真平台中搭建的仿真环境，机器人位于几面墙围成的不规则形状的房屋内；图
    5-7b 所示为对应该仿真环境的占用栅格地图。在该地图中，黑色代表该栅格被占用，即存在物体，浅灰色代表该栅格未被占用，机器人可以通过，深灰色区域则为未知区域。占用栅格地图将每个栅格描述为被占用、未被占用和未知三种信息，而代价地图则将占用栅格地图中的每个位置再关联一个代价值，用于描述机器人在该位置移动的难易程度。代价地图的生成可分为三个部分：添加静态层、添加障碍物层和设置膨胀层。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_146_0.png)


    图 5-7 仿真环境与占用栅格地图


    第一步，根据占用栅格地图的信息初始化代价地图。在代价地图中，占用栅格地图所提供的信息又被称为静态层（Static Layer），如图 5-8 所示。代价地图将占用栅格地图中黑色的部分即被占用的部分转为紫色，即占有最高的代价，表示不可通过，并且从图中可'
  merge: -1
  img_proc: true
