  md: '已成为可能。使用 DRL 可以学习代理控制策略，以在未知环境中完成目标任务。然而，由于其反应性和缺乏全局信息，DRL 可能会遇到局部最优问题，尤其是在大规模导航任务中。


    本节实例为一种自主导航系统，用于导航到全局目标，无需人工控制或环境的先验信息，其总体框架图如图 5-20 所示。机器人从附近提取兴趣点并进行评估，选择其中一个点作为航点。航点引导基于
    DRL 的运动策略实现全局目标，从而缓解局部最优问题。然后，根据策略执行运动，而无需完全映射周围环境的表示。该方法将从激光数据中学习到的轻量级运动策略与更广泛的全局导航策略相结合，以解决目标驱动的探索问题。导航系统的目标不仅是探索和绘制未知环境以实现指定的全局目标，还可以在没有预定义计划的情况下主动绕过障碍物。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_156_0.png)


    图 5-20 自主导航系统总体框架图


    为了在未知环境中实现自主导航和探索，该方法提出了一种导航结构，该结构由两部分组成：全局导航和局部导航。全局导航从 POI 中选择最佳航点并进行地图绘制；局部导航基于深度强化学习，从环境中提取兴趣点，并根据评估标准选择最佳航点。在每一步中，都会以极坐标的形式向神经网络提供一个相对于机器人的位置和航向的航点，然后根据传感器数据计算动作并朝着航点执行，在航点之间朝着全局目标移动时执行地图绘制。这样一来，机器人不仅能够在复杂环境中实现自主导航，还能在探索过程中不断更新地图，以提高导航的精确性和可靠性。


    # 5.4.1 全局导航


    为了让机器人朝着最终目标导航，需要从可用的兴趣点（ POI ）中选择一些中间点供局部导航使用。由于一开始对环境一无所知，因此无法计算出到达目标的最佳路径。机器人不仅需要被引导到目的地，还需要在行进过程中探索环境，以便在遇到死胡同时找到替代路线。因为没有任何先验信息，所以需要从机器人周围的环境中获取可能的
    POI，并将它们存储在内存中。


    可以通过以下两种方法来获取新的 POI：


    +   1. 检测间隙法


    如果两个连续的激光读数之间的差值大于某个阈值，就会添加一个 POI。这允许机器'
