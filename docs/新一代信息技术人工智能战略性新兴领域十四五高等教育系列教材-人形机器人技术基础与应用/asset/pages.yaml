    # 5. 人形机器人站立控制


    为实现人形机器人站立，设计以下 3 种任务：


    +   1) 所有接触点加速度为 0。


    +   2) 中心线动量变化率为 \(\dot{I}_{des} = K_p(\text{CoM}_{des} - \text{CoM}_m) + K_D(0
    - I_m / m)\)。


    +   3) 腿部以外的关节角加速度为 \(\dot{v}_{des} = K_p(q_{des} - q_m) + K_D(v_{des} - v_m)\)。


    人形机器人站立控制的全身控制的二次规划问题最终表示为


    ```

    \min_{\dot{v}, u, f_c} \sum_{i \in \text{站立}} (A_i v - b_i)^T W_i (A_i v - b_i)
    + W_\tau \| \tau \|^2

    \text{s.t. } M(q)\dot{v} + c(q, \dot{q}) = u + J_c^T(q)f_c

    f_c \in \text{摩擦锥}

    u_{min} \leqslant u \leqslant u_{max}

    ```


    采用权重形式的全身控制，即把一些任务作为目标函数，并赋予不同的权重 \(W_i\)，这样可以同时处理更多的任务，避免任务之间的冲突导致问题无解，所以只保留了动力学约束、摩擦力约束和力矩范围约束。最终宇树
    G1 人形机器人的站立效果如图 9-13 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_258_0.png)


    图 9-13 宇树 G1 人形机器人的站立效果


