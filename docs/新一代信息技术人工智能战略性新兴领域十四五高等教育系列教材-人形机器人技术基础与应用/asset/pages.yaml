    1，摆动为 0）。其中，\( 1 \leqslant j \leqslant 2 \)，\( 0 \leqslant j \leqslant N_i \)，\(
    0 \leqslant k \leqslant N_s \)。因此对于采样点 \( k \)，腿 \( i \) 的位置为


    \( \boldsymbol{r}_{i,k} = \sum_{j=1}^{N_i} b_{i,j,k} \boldsymbol{r}_{i,j,k} \quad
    \sum_{j=1}^{N_i} b_{i,j,k} = c_{i,k}, \quad c_{i,k} \in \{0,1\} \) (9-38)


    若处于接触状态，则 \( \boldsymbol{r}_{i,k} \) 等于选中候选落脚点的位置，否则为 0。同时，\( c_{i,k} \in \{0,1\}
    \) 约束了同一时刻足端只能出现在一个位置。为避免打滑，腿 \( i \) 候选落脚点 \( j \) 在 \( k \) 采样时刻地面作用力需要满足接触面摩擦锥的约束，即


