    # 5.3.2 局部路径规划


    局部路径规划是指在机器人全局路径规划的基础上，对机器人从当前位置到达目标位置的具体路径进行规划，主要用于计算控制机器人运动的指令，如机器人的运动速度。机器人在运动过程中需要不断地对当前环境进行感知和判断，以避免碰撞障碍物、遵循规划路径等。机器人局部路径规划模块的作用就是在这个过程中，根据机器人当前的状态、目标位置以及环境中的障碍物等信息，生成一条安全、快速、有效的路径，以指导机器人进行运动。


    局部路径规划对全部环境没有感知或有一部分的感知，更注重于对当前环境局部信息的感知，这使机器人可以较好地实时避障。通过传感器对附近环境进行感知，可得到障碍物的形状和位置，所以规划时需要利用传感器对附近环境进行搜索，并不断地搜集当前环境信息，根据对当前环境中信息变化的及时捕捉，来对环境中模型的变化进行实时更新。局部路径规划将环境构建与路径搜寻相结合，需要机器人在处理时较为高效，不仅考验处'
  merge: -1
  img_proc: true
- pgno: 152
  md: '理计算的能力，而且还要求环境中模型误差较小，噪声存在比较好的稳定性，从而能够对当前的环境信息实现实时反馈，以及时、准确地对环境进行校正。但局部路径规划缺少全局路径规划的引导，容易陷入局部最优，致使找不到比较完整的路径或找不到路径，且规划出的路径也不能保证是整体最佳的。局部路径规划算法是实时规划，需要有传感器实时对环境中的信息进行搜集，对当前地图环境进行判断，对附近障碍物的排列进行剖析，通过动态的分析和判断得到从当前节点到某个节点的最优路径。目前较为常用的局部路径规划算法有人工势场法和动态窗口法。


    # 1. 人工势场法


    人工势场法于 1986 年首次由 Khabit 使用，其核心思想是在机器人移动空间中构建虚拟的力场，在力场中对受力进行分析，目标节点对机器人具有吸引力，障碍物对移动机器人具有排斥力，在整个环境中的任意一点的势力是在该点的引力和斥力的结合。机器人从起始节点开始出发，向着势场下降的方向开始移动，最终到达目标节点。人工势场法示意图如图
    5-16 所示。


    三维空间人工势场与二维空间人工势场相似，将空间比作一个地形区域，地形有起伏。在地形中，起点与障碍物在地势比较高的地方，终点在地势比较低的地方，将移动机器人看作一个整体，机器人将在力的作用下从高的地方向低的地方（即终点）移动，并且会避开障碍物。重力势场示意图如图
    5-17 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_152_0.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_152_1.png)


    图 5-16 人工势场法示意图


    图 5-17 重力势场示意图


    上面列举的例子使用的是电势场的原理，电和重力势场都是在现实中存在的，人工势场是模仿这种自然势场，在已知初始点、目标点以及周围环境中有障碍的情况下构建人工势场。该方法的优势在于它是一种反馈式的思想，在控制和传感等方面有很好的稳定性；缺点是会存在一定的局部最小值的情形，在全局路径中有可能找不到路径。人工势场可分为引力场、斥力场。对两种势场分开进行分析，引力函数为


    ```

    $$U_{at}(q) = \frac{1}{2} \varepsilon \rho^2(q, \ q_g)$$ (5-24)

    ```


    式中，\(\varepsilon\) 为尺度；\(\rho(q, \ q_g)\) 为物体在当前位置和目标位置的距离之差。此时求解引力，即对距离求导，得


    ```

    $$F_{att}(q) = -\nabla U_{att}(q) = \varepsilon(q_{goal} - q)$$ (5-25)

    ```


    斥力场函数为'
