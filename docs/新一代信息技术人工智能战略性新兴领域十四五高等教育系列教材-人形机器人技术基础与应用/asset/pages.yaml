  md: '数据归一化之后，基础的端到端运动控制方法可以选择将处理后的数据作为状态观察值输入网络进行训练。由于这些数据类型多为标量或一维矢量，所以这类数据往往使用全连接层进行处理。也可以对原始数据进行进一步处理以获取更具有代表性的状态观察值，如利用已有关节数据与躯干姿态数据，构建状态观测器，估计机器人运动速度与位置；将期望指令与实际响应相减，放大重要信息，如图
    4-5 所示；加入算法关键参数，如周期运动的运动相位以及频率等。总之，需要使控制算法所需的信息尽可能直观且提高其差异度，这有助于深度强化学习网络提取关键信息，以便将更多的算力集中于生成理想的控制指令而不是用于信息提取。一种典型的状态观察值设计与网络结构如图
    4-6 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_115_0.png)


    图 4-5 关节残差图示


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_115_1.png)


    图 4-6 一种典型的状态观察值设计与网络结构


    在图 4-5 中，残差命令、残差响应 1 与残差响应 2 分别表示关节命令、关节响应 1 与关节响应 2 对关节命令作差的数值，虽然在原始关节命令与关节响应的情境下，神经网络输入可以说隐含了残差响应，但通过图
    4-5 可以看出，将关节响应转化为残差响应可以在多种信号中显著提高响应 1 与响应 2 之间的差别，这有利于将更具有代表性的信息传递给神经网络，进而提高神经网络学习效率，降低其学习难度。


    将关节响应转化为残差输入并非是必须的，只要可以将神经网络所需的信息传递给神经网络学习，理论上即可完成训练，但考虑到训练时间、现实条件等约束，探索原始信号的各类变换形式，寻找神经网络更易接受的信号特征仍然是必要的。


    对于图像、点云等高维度信息，使用全连接网络往往难以完全发挥深度神经网络的作用。而卷积神经网络能够有效地将大数据量的图片降维成小数据量，可以有效地保留图片特征，符合图片处理的原则。研究表明，在涉及图像处理的应用场合，卷积神经网络模型能够带来出色的结果和超高的计算效率。因此在涉及图像或类似数据结构时，往往使用卷积神经网络进行图像特征提取，再将提取到的已降维特征连接基础状态观察值送入全'
