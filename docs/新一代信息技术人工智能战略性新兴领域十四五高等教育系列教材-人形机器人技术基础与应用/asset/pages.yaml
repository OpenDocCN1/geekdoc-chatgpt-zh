    <origin xyz="0 0.06445-0.1027"rpy="0-0.34907 0"/> 表示 left_hip_pitch_link 连杆坐标系相对于
    pelvis 连杆坐标系的位姿。


    <parent link="pelvis"/> 定义 pelvis 连杆为父连杆。


    <child link="left_hip_pitch_link"/> 定义 left_hip_pitch_link 连杆为子连杆。


    <axis xyz="0 1 0"/> 表示绕 left_hip_pitch_link 连杆坐标系的 y 轴旋转。


    <limit lower="-2.35"upper="3.05"effort="88"velocity="32"/> 表示关节旋转角度范围为 -2.35 ~
    3.05rad，关节力矩限制为 88N • m，关节最大旋转速度为 32rad/s。


    ```

    \(\boldsymbol{C}_I = \begin{bmatrix} I_{xx} & -I_{xy} & -I_{xz} \\ -I_{xy} & I_{yy}
    & -I_{yz} \\ -I_{xz} & -I_{yz} & I_{zz} \end{bmatrix}\)

    ```


    \(\boldsymbol{C}_I\) 为定义于坐标系 \(\{C\}\) 的惯性张量矩阵，矩阵中各元素为


    ```

    \(\begin{aligned} I_{xx} &= \iiint_V (y^2+z^2)\rho \mathrm{d}v \\ I_{yy} &= \iiint_V
    (x^2+z^2)\rho \mathrm{d}v \\ I_{zz} &= \iiint_V (x^2+y^2)\rho \mathrm{d}v \\ I_{xy}
    &= \iiint_V (xy)\rho \mathrm{d}v \\ I_{xz} &= \iiint_V (xz)\rho \mathrm{d}v \\
    I_{yz} &= \iiint_V (yz)\rho \mathrm{d}v \end{aligned}\)

    ```


    在 URDF 文件中，还可以使用多个 <collision> 元素同时定义一个部件的碰撞模型。这一特性允许将复杂的碰撞模型分解为多个简单的几何形状，从而简化碰撞检测的计算，同时不降低仿真精确程度。宇树
