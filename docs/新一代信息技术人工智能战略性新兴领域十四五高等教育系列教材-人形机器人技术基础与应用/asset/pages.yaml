    \n# 3. 用牛顿 - 欧拉法递推动力学方程\n\n将机器人上的连杆看作刚体，首先确定机器人每个连杆的质量分布，包括质心位置和惯性张量。使连杆运动的前提是可以对连杆进行减速和加速，即连杆运动所需的驱动力是关于连杆的期望加速度和质量分布的函数。而牛顿\
