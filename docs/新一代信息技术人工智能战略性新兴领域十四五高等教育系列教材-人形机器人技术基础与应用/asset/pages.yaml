  img_proc: true
- pgno: 175
  md: '声信号接收设备是指将声信号转换为电信号的能量转换器件，也称为传声器。目前常用的两种传声器是动圈式传声器和电容式传声器。动圈式传声器通过电磁感应原理制成，具有结构简单、使用方便的优点，但是其灵敏度低、频率范围窄、瞬态响应较电容式传声器差。电容式传声器利用接收声波的膜片构成电容，当受迫振动后其电容量会产生变化，其优点是频响好、失真小、灵敏度高且音质好。


    # 1. 语音识别


    语音指的是人类通过发声器官发出来具有一定意义、用来沟通交流的声音。而语音识别是以语音为研究对象，利用语音信号处理、模式识别技术让机器自动识别和理解人类口述的语句内容的技术，是人与机器交互的一种技术。自动语音识别是指机器通过识别和理解将人类的语音中的词汇内容转变为相应的计算机可读输入文本或命令的技术。


    语音识别技术最早可以追溯到 20 世纪 50 年代。1952 年，贝尔实验室研发出了 10 个孤立数字的识别系统。从 20 世纪 60 年代开始，美国卡内基梅隆大学的
    Reddy 等开展了连续语音识别的研究。20 世纪 80 年代开始，以隐马尔可夫模型（Hidden Markov Model，HMM）方法为代表的基于统计模型方法逐渐在语音识别研究中占据了主导地位。HMM
    能够较好地描述语音信号的短时平稳特性，并且将声学、语言学、句法等知识集成到同一框架中。20 世纪 90 年代开始，语音识别掀起了第一次研究和产业应用的小高潮。2011
    年，深度神经网络（DNN）在大词汇量连续语音识别上获得成功，语音识别效果取得了近 10 年来最大的突破，从此基于深度神经网络的建模方式正式取代 GMM–HMM（Gaussian
    Mixed Model–Hidden Markov Model，高斯混合模型 – 隐马尔可夫模型），成为主流的语音识别建模方式。


    语音识别系统是基于语音识别技术的模式识别系统，包括预处理、特征提取、声学模型、语言模型、语音解码器等阶段。在预处理阶段，捕获语音信号并将其变为数字信号。在特征提取阶段，将数字信号转化为能够进行语音识别的特征向量。在声学模型阶段，匹配特征向量到相应的语音单元上。在语言模型阶段，根据语法规则和语言知识进行翻译操作。在语音解码阶段，对语音识别结果进行排列，并进行纠错和适当的补全操作。


    语音识别流程分为训练和识别两条线路。首先需要完成声学模型与语音模型的训练。在语音实时识别过程中，语音信号经过前端信号处理、端点检测等预处理后，逐帧提取语音特征，并将所提取的特征送至解码器，在训练好的声学模型、语言模型的作用下，根据搜索算法找到最合适的路径，从而找到最合适的词串，作为识别结果输出。语音识别流程如图
    6-17 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_175_0.png)


    图 6-17 语音识别流程'
  merge: -1
