    # 9.2.2 仿真模型搭建


    仿真模型搭建在机器人人设计、开发、测试等过程中扮演着至关重要的角色。通过仿真，可以在虚拟环境中测试机器人的运动、行为和性能，从而减少物理实验的风险和成本。


    +   1. 统一机器人描述格式（ Unified Robot Description Format ， URDF ）


    URDF 是一种用于描述机器人模型的标准格式。它能够详细描述机器人的各个组成部'
