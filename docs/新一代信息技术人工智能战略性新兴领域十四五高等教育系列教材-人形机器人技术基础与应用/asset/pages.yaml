  img_proc: true
- pgno: 153
  md: '$$ U_{rep}(q) = \begin{cases} \frac{1}{2} \eta \left( \frac{1}{\rho(q, q_{obs})}
    - \frac{1}{\rho_0} \right)^2, & \rho(q, q_{obs}) < \rho_0 \\ 0, & \rho(q, q_{obs})
    \geqslant \rho_0 \end{cases} \quad (5-26) $$


    这是斥力场常用的公式，其中 \(\eta\) 表示斥力尺度，\(\rho(q, q_{obs})\) 表示当前物体与障碍物之间的间隔，\(\rho_0\)
    为障碍物影响范围。障碍物的影响会随着距离的增加而减弱。斥力公式为


    $$ F_{rep}(q) = -\nabla U_{rep}(q) = \begin{cases} \eta \left( \frac{1}{\rho(q,
    q_{obs})} - \frac{1}{\rho_0} \right) \frac{1}{\rho^2(q, q_{obs})} \nabla \rho(q,
    q_{obs}), & \rho(q, q_{obs}) < \rho_0 \\ 0, & \rho(q, q_{obs}) \geqslant \rho_0
    \end{cases} \quad (5-27) $$


    总的势场是斥力与引力的叠加，见式（5-26），总的力是分力的和，见式（5-27）。


    $$ U(q) = U_{att}(q) + U_{rep}(q) \quad (5-28) $$


    $$ F(q) = -\nabla U(q) \quad (5-29) $$


    综上，人工势场法较为简捷，其实用性和实时性都比较强。因为该算法较为简捷，所以有利于对底层构架保持实时控制，在实时避障以及轨迹控制领域有着很好的开发和使用。该算法同样存在较多的缺点，在当前节点与目标节点间隔过于大时，引力过大而斥力相对于引力又过小，物体在移动的过程中有可能碰到障碍物。当终点周围设置有障碍物时，障碍物的斥力会很大，此时目标节点对当前物体的引力不够，使得机器人不能很好地到达终点。如果在路径中的某个位置，引力与斥力相平衡，机器人会出现比较僵持的情况，或发生振荡。局部算法的共同弊端就是过于考虑当前路径的最优从而找不到到达目标节点的路径。人工势场法可改进之处如下：


    +   1) 在机器人遇到障碍物时，可以对引力加入系数，以调整引力大小，防止因机器人在当前位置距离目标节点过远而导致引力过大。


    +   2) 在终点周围设置障碍物时，因为障碍物的斥力，机器人不能很好地到达终点。在原本的斥力影响下通过加入终点与机器人之间距离的影响因素，引导机器人到达目标节点。


    +   3) 局部路径算法的缺陷在于局部最优，可在算法中添加随机扰动，使其跳出局部最优。


    # 2. 动态窗口法


    动态窗口法是常见的局部路径规划算法。ROS 中默认的局部路径规划算法是动态窗口法。动态窗口法主要是按照分辨率在速度空间中提取多对速度，在当前的速度空间，不同的速度有不同的运行轨迹，可对路径按照一定的评价体系进行评价并选出最优路径，使机器人按照最优路径前进。动态窗口法的核心在于窗口，将机器人的路径控制在一个范围之内。动态窗口法需要模拟在当前速度环境下机器人的移动，此时对机器人的运动模型进行分析。假定机器人是两轮机器人，将机器人的运行轨迹拆分成由圆弧或者直线构成。为'
