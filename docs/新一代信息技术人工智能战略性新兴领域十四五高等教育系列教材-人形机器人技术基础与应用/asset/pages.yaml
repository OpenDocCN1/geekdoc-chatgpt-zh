    5-9a 所示，在仿真环境中添加一圆柱体障碍物后，在图 5-9b 所示的代价地图中会多出一块弧形区域，这是障碍物层的效果。如图 5-9c 所示，去掉静态层后，代价地图将只保留传感器的信息，即障碍物层的效果。完整的代价地图的信息应为图
    5-8 所示静态层与图 5-9c 所示障碍物层叠加后的效果，如图 5-9b 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_147_0.png)


    图 5-8 代价地图的静态层


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_147_1.png)


    a) 添加一圆柱体障碍物

    b) 代价地图中的变化

    c) 障碍物层的效果


    图 5-9 添加障碍物层


    第三步，基于静态层和障碍物层，在代价地图上设置膨胀层。设置膨胀层的原因有两个：一方面，激光雷达获取的激光点是稀疏的，可能会出现障碍物间存在缝隙的现象，导致规划出的路径可能会从缝隙内穿过，而实际上机器人是无法通行的；另一方面若没有膨胀层，路径规划会紧贴障碍物的边缘，这会给下游的局部路径规划带来一些麻烦。膨胀层的设置有三个主要参数：机器人半径、膨胀半径和代价衰减系数。带有膨胀层的代价地图如图
    5-10 所示，图中机器人半径均设置为 0.2m，而膨胀半径和代价衰减系数分别与图示对应。膨胀半径决定了膨胀层的最大范围，即便膨胀层的代价值没有衰减至最小值也会被截断。代价衰减系数决定了膨胀层代价值的衰减速度。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_147_2.png)


    a) 膨胀半径为0.4m，代价衰减系数为10.0

    b) 膨胀半径为1.0m，代价衰减系数为10.0

    c) 膨胀半径为1.0m，代价衰减系数为2.0


    图 5-10 带有膨胀层的代价地图


    有了代价地图的概念之后，再结合图搜索算法就形成了全局路径规划算法。目前，常用的全局路径规划算法有遗传算法、快速搜索随机树算法、Dijkstra 算法和 A*
    算法等，接下来对其进行简要介绍。'
  merge: -1
  img_proc: true
