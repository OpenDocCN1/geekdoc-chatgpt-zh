  md: '曼方程可以理解为当前状态与未来状态的迭代关系，表示当前状态的值函数可以通过下个状态的价值函数来计算。


    另外一种值函数：Q 函数。Q 函数中包含两个变量：状态和动作。其定义为


    \(Q_{\pi}(s,a)=E_{\pi}\left[\sum_{t=0}^{\infty}\gamma^t r_{t+1} \mid s_t=s, a_t=a\right]\)
    (4-5)


    Q 函数表示了未来可以获得奖励的期望同时取决于当前的状态和当前的动作。Q 函数也是强化学习算法中要学习的一个函数。因为当得到 Q 函数后，进入某个状态要采取的最优动作可以通过
    Q 函数得到。


    基于上述描述，可以概括一个强化学习过程为：根据当前时刻为 t，智能体通过对环境的观察获得当前状态 \(s_t\) (\(s_t \in S\)，S 是包含了所有可能状态的状态空间)。根据
    \(s_t\)，智能体基于当前的行动策略做出反应，采取某种行动 \(a_t\) (\(a_t \in A\)，A 是人为设计的包含所有动作的动作空间)。行动结束后的
    t+1 时刻，智能体所处的环境状态发生改变，获得新的 \(s_{t+1}\) 和立即奖励值 \(r_{t+1}\)，\(r_{t+1}\) 是对于上一步行动
    \(a_t\) 的反馈，然后智能体基于事前确定的规则调整行动策略。这一过程不断执行，直到达成既定的学习次数或者学习目标。


    # 4.1.2 深度强化学习算法


    深度强化学习沿用强化学习中的理论，通过使用深度学习算法计算传统强化学习中的策略、值函数等，替代了传统强化学习中提取智能体状态特征，再依据特征进行决策的过程，利用深度学习形成从状态到动作或状态到评价的直接映射。


    +   1. 深度 Q 网络算法


    深度 Q 网络（Deep Q Network，DQN）是一种融合了深度神经网络（Deep Neural Network，DNN）和 Q 学习（Q-Learning）的算法，是一种典型的基于价值估计的深度强化学习算法。


    基于价值估计的算法往往会为环境中的所有状态 s 或者是状态动作对 (s,a) 给出其价值，用以评价其好坏程度，再根据其价值执行对应于高价值的动作。Q 学习就是这样一种强化学习算法，其建立了一个
    Q 表用于查询每个状态所对应的最好的动作。在探索阶段中采用 \(\epsilon\) 贪心算法选择动作执行，即除了选择高价值动作外，还会以一定概率执行随机动作，以保证探索能力。随着探索工作的逐渐完成，其执行随机动作的概率逐渐降低，直到验证过程中不再选择随机动作。


    当状态空间很大时，如有上百万的状态时，Q 学习中所需的 Q 表会很大，建立表格和更新表格就很低效。在 DQN 算法中不会建立 Q 表，但是会建立一个深度神经网络来计算每个状态中每个动作的近似
    Q 值 [ Q(s,a)，状态 - 行为值函数 ]，这样也可以找到最优决策。


    图 4-2 展示了 Q 学习算法和 DQN 算法在表示状态 - 行为值函数时的区别：'
