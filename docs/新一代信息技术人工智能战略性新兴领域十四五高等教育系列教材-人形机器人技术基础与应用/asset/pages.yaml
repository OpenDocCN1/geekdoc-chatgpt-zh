    ```


    式中，$m_i$ 为机器人第 $i$ 部分的质量，$g$ 为重力加速度，$I_{lx}$ 和 $I_{ly}$ 分别为机器人第 $i$ 部分沿 $x$ 轴和
    $y$ 轴的转动惯量，\(\ddot{\Omega}_{ix}\) 和 \(\ddot{\Omega}_{iy}\) 分别为机器人的第 $i$ 部分质心绕
    $x$ 轴和 $y$ 轴的绝对角位移，$(x_i, y_i, z_i)$ 为机器人第 $i$ 部分的质心在固定坐标系中的坐标，$(x_{\text{zmp}},
    y_{\text{zmp}})$ 为 ZMP 在固定坐标系中的坐标。


    在具备以下条件的情况下可以计算得到 ZMP 的位置：


    +   1) 人形机器人足部安装的力或力矩传感器能检测到支撑反作用力的大小、方向和作用位置。


    +   2) 已知人形机器人身体各部分的转动惯量、加速度及角加速度（人形机器人处于动态平衡时）。


    +   3) 人形机器人的脚踝装有六维力或力矩传感器。


    第一种情况可以直接通过检测的反作用力的信息计算出竖直方向等效作用力的作用点，即 ZMP 的位置；第二、三种情况可以应用式 (3-7) 来计算 ZMP 的位置。


    # 3. ZMP 稳定性判据的应用


    当地面对人形机器人的作用力沿足底区域基本均匀分布时，ZMP 位于支撑多边形的中央。当地面作用力向足底的前端或后端偏移时，ZMP 也向相应的区域移动。在极端情况下，当所有的地面作用力都由脚尖或脚跟承受时，ZMP
    就位于支撑多边形的边界上，此时一个微小的扰动就可以使机器人绕脚尖转动，机器人的稳定性很差。为了增强机器人抵抗扰动的能力，降低人形机器人跌倒的风险，应该尽量使
    ZMP 保持在支撑多边形内部，且离其边界越远越好。


    稳定区域（Stable Region）是支撑腿的足部与地面接触形成的凸多边形支撑区域。稳定性裕度（Stability Margin）是人形机器人行走稳定程度的一种量化描述，其量化参数是
    ZMP 与稳定区域边界的最短距离，如图 3-2 所示。'
