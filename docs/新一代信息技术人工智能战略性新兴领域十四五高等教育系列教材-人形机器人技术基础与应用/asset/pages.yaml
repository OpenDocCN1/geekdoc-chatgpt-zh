  md: '+   2) \( A_1 \cup A_2 \cup \cdots \cup A_m = S \) , 必然会发生一个。

    +   3) \( P(A_i)>0(i = 1, 2, \cdots , m), \sum_{i=1}^m P(A_i) = 1 \) 。


    设利用一传感器对 \( A \) 事件的发生进行检测，检测结果为 \( B \) , 则 \( A \) 为真值， \( B \) 为测量值。

    此时贝叶斯推理的先验知识为


    \( P(A_1), P(A_2), \cdots, P(A_m) \) 表示事件 \( A_1, A_2, \cdots, A_m \) 发生的概率，这是试验前的知识，称为“先验知识”。


    由于一次检验结果 \( B \) 的出现，改变了对事件 \( A_1, A_2, \cdots, A_m \) 发生情况的认识，这是试验后的知识，称为“后验知识”。检验后事件
    \( A_1, A_2, \cdots, A_m \) 发生的概率表现为后验概率，即


    \( P(A_1|B), P(A_2|B), \cdots, P(A_m|B) \)


    式中， \( P(A_i|B) \geqslant 0; \sum P(A_i|B) = 1 \) 。若能获得各先验概率 \( P(A_i) \) 和条件概率
    \( P(B|A_i) \) , 利用贝叶斯条件概率公式，根据传感器的观测，将先验概率 \( P(A_i) \) 更新为后验概率 \( P(A_i|B) \)
    , 即


    \( P(A_i|B)=\frac{P(A_i B)}{P(B)}=\frac{P(B|A_i)P(A_i)}{\sum_{j=1}^m P(B|A_j)P(A_j)}
    \) (6-10)


    当系统有两个传感器对其进行观测时，若传感器 1 观测结果为 \( B \) , 传感器 2 观测结果为 \( C \) , \( P(C|A_i) (i =
    1, \cdots, m) \) , 则条件概率公式可表示为


    \( P(A_i|B \land C)=\frac{P(B \land C|A_i)P(A_i)}{\sum_{j=1}^m P(B \land C|A_j)P(A_j)}
    \) (6-11)


    式中， \( P(B \land C|A_i)(i = 1, \cdots, m) \) 是 \( B \) 和 \( C \) 同时发生的先验条件概率。


    假设 \( A \)、\( B \) 和 \( C \) 之间是相互独立的，即


    \( P(B \land C|A_i)=P(B|A_i)P(C|A_i) \) (6-12)


    由此，针对两个传感器，基于贝叶斯推理的决策层融合公式为


    \( P(A_i|B \land C)=\frac{P(B|A_i)P(C|A_i)P(A_i)}{\sum_{j=1}^m P(B|A_j)P(C|A_j)P(A_j)}
    \) (6-13)


    如果是多传感器融合，则


    \( P(A_i|B_1 \land B_2 \land \cdots \land B_n)=\frac{\prod_{k=1}^n P(B_k|A_i)P(A_i)}{\sum_{j=1}^m
    \prod_{k=1}^n P(B_k|A_j)P(A_j)} (i = 1, \cdots, m) \) (6-14)'
