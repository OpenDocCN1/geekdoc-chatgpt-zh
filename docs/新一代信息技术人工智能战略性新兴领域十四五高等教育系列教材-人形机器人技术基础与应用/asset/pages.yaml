  md: '行，调整适当的姿态为落地做准备。在落地阶段，机器人与地面发生碰撞，通过屈腿吸收冲击力并迅速恢复平衡。


    设定起跳阶段、腾空阶段和落地阶段的编号分别为 1、2、3，总阶段数 \( P = 3 \)，状态量 \( x = [q;\dot{q}] \)，控制量 \(
    u = \tau \)。需要连续约束的个数 \( L = 2 \)，分别是从起跳阶段到腾空阶段，从腾空阶段到落地阶段。


    根据式 (9-42)，通常优化目标包含两部分 \( \Phi^{(p)}(x^{(p)}(t_0), t_0, x^{(p)}(t_f), t_f; s^{(p)})
    \) 以及 \( L^{(p)}(x^{(p)}(t), u^{(p)}(t), t; s^{(p)})dt \)，分别为与边界状态相关的迈耶项以及与过程积分相关的拉格朗日项。对于跳跃运动来说，期望通过最小化能量消耗完成跳跃任务来实现机器人的最优跳跃性能，因此可以采用最小化整个过程的力矩二次方和作为优化的目标。那么，优化目标为


    ```

    J = \sum_{p=1}^{P} J^{(p)} = \sum_{p=1}^{P} [\| u \|_2^{(p)}(t)) dt

    ```


    注意，为了方便公式的书写，下述的状态量、控制量及相关变量如果没有特殊说明，均表示同一阶段 \( p \) 下的变量，因此省略上角标 \( ^{(p)} \)。


    动力学约束式 (9-43) 描述了模型的动力学特性。根据不同阶段机器人与外界的接触情况，构造不同的动力学方程，那么有


    ```

    H\ddot{q} + c = S^{\top}\tau + J_{\text{toe}}^{\top}f_{\text{toe}} + J_{\text{heel}}^{\top}f_{\text{heel}}
    \quad (p=1,3)


    H\ddot{q} + c = S^{\top}\tau \quad (p=2)

    ```


    当机器人脚尖、脚后跟与地面接触时还应该满足不打滑的约束，即接触点的加速度为 0、速度为 0（初速度为 0 且加速度为 0 即可保证速度为 0），即


    ```

    J_{\text{toe}}\ddot{q} + \dot{J}_{\text{toe}}\dot{q} = 0 \quad (p=1,3)


    J_{\text{heel}}\ddot{q} + \dot{J}_{\text{heel}}\dot{q} = 0 \quad (p=1,3)

    ```


    结合式 (9-49) 和式 (9-50)，可以得到不同阶段的动力学约束，即


    ```

    \begin{bmatrix} \ddot{q} \\ f_{\text{toe}} \\ f_{\text{heel}} \end{bmatrix} =
    \begin{bmatrix} H & -J_{\text{toe}}^{\top} & -J_{\text{heel}}^{\top} \\ J_{\text{toe}}
    & 0 & 0 \\ J_{\text{heel}} & 0 & 0 \end{bmatrix}^\dagger \begin{bmatrix} S^{\top}\tau
    - c \\ -J_{\text{toe}}\dot{q} \\ -J_{\text{heel}}\dot{q} \end{bmatrix} \quad (p=1,3)


    \ddot{q} = H^{-1}(S^{\top}\tau - c) \quad (p=2)

    ```


    边界约束式 (9-44) 描述了，机器人在每个阶段起始和结束时刻的相关约束。假设给定机器人初始和结束时刻的站立姿态 \( q_{\text{start}}
    \)、\( q_{\text{finish}} \)，同时所有的关节速度为 0，则边界约束可以描述为


    ```

    x(t_0) = [q_{\text{start}}; 0] \quad (p=1)


    x(t_f) = [q_{\text{finish}}; 0] \quad (p=3)

    ```


    路径约束式 (9-45) 描述了，每一个采样时刻下，与机器人状态量和控制量的相关约束。例如以下 5 个约束：'
