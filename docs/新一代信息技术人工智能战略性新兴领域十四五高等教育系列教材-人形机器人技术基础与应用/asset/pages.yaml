    目前，主流的人形机器人都配备有先进的机器视觉系统，如特斯拉的 Optimus 人形机器人搭载 8 个摄像头，通过图像处理，可实现物体识别、环境理解等功能。波士顿动力的
    Atlas 采用 “RGB 摄像头 + TOF 深度传感 + 激光雷达方案”，可以通过感知算法观察环境，按照实时数据实现自主规划行动。优必选采用 “激光雷达
    + RGBD 摄像头 + 四目立体视觉方案”，可实现对环境的感知功能。


    在人形机器人视觉研究中，不仅需要考虑如何捕获和输入视觉信息，还要对这些信息进行处理和分析，进而提取出有用的信息。例如，在人形机器人抓取系统中，利用人形机器人视觉系统检测抓取对象，分析对象的位置、尺寸、抓取位姿等，将这些数据提供给人形机器人，辅助人形机器人完成抓取任务。在移动机器人系统中，需要机器人视觉系统能够观察周围环境，计算和评估周围环境的三维模型和信息，进而完成机器人路径规划并使其行进到指定目的地。下面介绍视觉传感器的成像模型。


    人形机器人是在三维空间完成各种操作任务的，然而摄像机（视觉传感器）在成像过程中将三维世界投射到二维平面上，失去了深度信息。本小节将介绍如何建立三维场景与二维图像坐标之间的联系，以及人形机器人是如何利用视觉传感器获取场景三维坐标的。


    摄像机模型是将三维场景与二维图像坐标联系起来的模型，其线性成像模型称为小孔成像模型（或针孔模型），是指在理想状态下的成像模型，并没有考虑摄像机镜头畸变。摄像机模型内具体包括
    4 个坐标系：世界坐标系、摄像机坐标系、图像物理坐标系、图像像素坐标系。在忽略摄像机畸变的理想情况下，空间中某一点从世界坐标系到图像像素坐标系的映射可以通过以下坐标转换实现。


    1) 世界坐标系与摄像机坐标系之间的刚体变换。设空间中某一点 P 在世界坐标系下的三维坐标为 (x_w, y_w, z_w)，该点在摄像机坐标系下的坐标 (x_c,
    y_c, z_c) 可以通过旋转与平移世界坐标系后得到，即


    ```

    [ x_c ]   [ R  T ]   [ x_w ]   [ x_w ]

    [ y_c ] = [      ] * [ y_w ] = M_2 [ y_w ]

    [ z_c ]   [ O^T 1 ]   [ z_w ]   [ z_w ]

    [ 1   ]           [ 1   ]   [ 1   ]

    (6-3)

    ```


    式中，R 是三阶旋转矩阵；T 是 3x1 的平移矩阵；O^T 是 1x3 的向量 (0 0 0)；M_2 是 4x4 矩阵的简化模型。


    2) 摄像机坐标系与图像物理坐标系之间的透视投影变换。摄像机成像时空间景物从三维到二维的转换，称为透视投影。图 6-10 展示的是中央透视模型，其中，O_c
    为摄像机坐标系原点，O 为虚拟像平面原点。根据相似三角形原理，虚拟投影平面上成像点 (x, y) 与摄像机坐标系中的对应点 (x_c, y_c, z_c)
    之间的关系可以表示为'
