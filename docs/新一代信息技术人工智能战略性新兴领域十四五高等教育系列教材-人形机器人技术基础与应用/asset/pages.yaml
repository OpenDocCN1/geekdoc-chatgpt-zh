    # 2.3.3 拉格朗日法


    上一小节讨论了基于牛顿 - 欧拉法建立机器人动力学模型，本小节将讨论另一种建立机器人动力学模型的方法，即拉格朗日法。


    +   1. 状态空间方程


    如果能够对方程进行归纳和分类，然后进一步简化，就可以很简便地表示机器人的动力学方程。其中有一种就是用状态空间方程表示动力学方程。不考虑一切摩擦因素，其具体形式为


    ```

    \(\tau = \boldsymbol{M}(q)\ddot{\boldsymbol{q}}+\boldsymbol{V}(q,\dot{q})+\boldsymbol{G}(q)\)
    \hfill (2-117)

    ```


