    # 9.3 运动控制应用实例


    # 9.3.1 机器人平衡站立


    在现代机器人学中，站立和行走控制是人形机器人实现自主移动的基础。这些控制技术涉及复杂的机械结构、传感器融合和高级控制算法，以确保机器人在不同环境中能够稳定地站立和行走。以下将详细介绍机器人站立控制与行走控制的原理、方法及其实践。人形机器人驱动方式通常分为，位置控制和力矩控制。例如，日本本田（HONDA）公司的
    ASIMO 机器人采用位置控制，我国宇树公司研发的 G1 人形机器人则采用力矩控制，如图 9-10 所示。因为目前采用力矩控制是主流方案，所以本节以力矩控制为例介绍人形机器人站立和行走控制。


    控制框架采用分层结构：高层的规划器、低层的全身控制器。图 9-11 所示为机器人控制框架。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_254_0.png)


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_254_1.png)


    +   ① CoM: center of mass，表示机器人质心。

    +   ② CoP: center of pressure，表示压力中心。

    +   ③ QP: quadratic programming，表示二次规划。


    站立控制算法采用了本书第 3 章介绍的全身控制（Whole-Body Control，WBC）算法。WBC 采用了优化的观点，相当于对传统 PID 控制器的改进。在介绍人形机器人全身控制前，先简要介绍欠驱动的概念。'
