    图 7-19 稀疏匹配和密集匹配方法的区别


    密集融合方法（dense fusion）是采用深度学习方法进行密集对应预测的经典方法。密集融合方法使用两个分支分别提取经过分割和裁剪后的 RGB 和深度图像的特征，将
    RGB 特征和深度特征逐像素拼接，并利用特征融合网络获得全局特征；然后，将全局特征级联到每个像素的特征向量上，并利用位姿预测网络输出每个像素点对应的位姿估计结果和一个置信度值；最终，选择置信度最大的像素点对应的位姿估计结果。除此之外，密集融合方法还提出了一种基于深度学习的迭代优化方法，能够在上一次位姿估计的基础上，不断优化位姿估计的结果。


    类别级 6D 物体位姿估计通过给定单目 RGB 或 RGBD 图像 I，在不提供物体 CAD 模型的情况下估计图像中的目标物体位姿 P ∈ SE(3) 和尺寸
    S ∈ R³（即物体的长度、宽度和高度）。在该类任务中，深度学习模型估计的位姿包含旋转、平移和尺寸 9 个自由度（9DoF）。严格来说，该类任务应定义为类别级
    9DoF 物体位姿估计，但为了统一表示，学界仍称其为类别级 6D 物体位姿估计。该任务可以表示为


    ```

    [R|T|S] = F{[I]|θ} (7-9)

    ```


