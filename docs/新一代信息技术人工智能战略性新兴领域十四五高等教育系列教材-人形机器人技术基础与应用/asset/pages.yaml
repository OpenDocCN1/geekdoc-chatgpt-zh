    (2) D-H 参数法建立连杆坐标系 D-H 参数（Denavit-Hartenberg 参数）是 Denavit 和 Hartenberg 于 1955
    年提出的。后来有学者利用 D-H 参数对机器人进行建模，并导出其运动方程。D-H 参数法已成为表示机器人和对机器人运动进行建模的一种标准方法。在标准的 D-H
    参数法中，描述机械臂中的每一个连杆需要 4 个运动学参数，分别是连杆长度 $a_{i-1}$、连杆转角 $\alpha_{i-1}$、连杆偏距 $d_i$
    和关节角 $\theta_i$。对于每个关节，4 个 D-H 参数中有 3 个为常量，1 个为变量。对于转动关节，$\theta_i$ 为变量，其他 3 个为常量；对于移动关节，连杆偏距
    $d_i$ 为变量，其他 3 个为常量。


    D-H 参数法是为每个关节处的连杆坐标系建立 4x4 齐次变换矩阵来表示此关节处的连杆与前一个连杆坐标系的关系，并通过逐次变换，最终求出用基坐标系表示的末端坐标系的变换矩阵。为了确定各连杆之间的相对运动和位姿关系，需要在每个连杆上固连一个连杆坐标系。


    连杆坐标系如图 2-14 所示，其特点是连杆坐标系的轴和原点固连在该连杆的前一个轴线上。连杆 $(i-1)$ 的坐标系原点位于轴 $(i-1)$ 和轴 $i$
    的公共法线与关节 $(i-1)$ 轴线的交点上。如果两相邻连杆的轴线相交于一点，那么原点就在这一交点上；如果两轴线互相平'
