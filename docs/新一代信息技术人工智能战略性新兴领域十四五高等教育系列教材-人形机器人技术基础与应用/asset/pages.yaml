  md: '自适应网络实时计算物理参数编码，基本策略可以实现多种物理参数下的运动控制。


    也有部分算法结合机器人自身结构，构建轨迹生成器约束机器人底层运动，这些方法构建分层运动控制框架，利用底层非学习方法将机器人运动约束到一定范围内，高层学习算法对底层策略进行控制而非直接生成具体动作，因此此类方法往往无需获取完整的传感器及时信息或完整的动作过程，仅需要用于判断底层控制策略执行状态的融合信息，如控制周期内的响应误差的累积和、底层策略关键参数、稳定性裕度等。这些信息可用于检测机器人运动的整体状态而非瞬时状态，因此控制频率往往较底层算法更低，更加节约计算资源。结合轨迹生成器的网络结构如图
    4-10 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_118_0.png)


    图 4-10 结合轨迹生成器的网络结构


    在图 4-10 中，虽然轨迹生成器产生的电动机指令与轨迹参数等分别传到了神经网络与电动机，但实际上该传输过程可能为非同步的，电动机指令需要时刻传输，而轨迹生成器的轨迹参数传输可根据实际需求与任务形式以较低频率传输。


    基于学习的人形机器人运动控制方法中，观察值空间设计并没有固定的设计方法，但在实际应用中往往更关注三个要点：①对于学习算法所需要控制的运动或算法，观察值空间应包含能够完全支持理想指令的全部信息，即输入的数据能够推理出期望的动作；②尽可能将最显著的数据特征输入网络；③尽可能降低信息的维度与无用信息的含量占比，以提高学习效率。


    # 4.2.3 人形机器人动作值空间设计


    现有人形机器人多使用旋转关节作为关节类型，基于深度强化学习算法的人形机器人控制目前也仅在电动机驱动的人形机器人平台上进行了验证，因此本小节将以电动机驱动的旋转关节人形机器人为例介绍几种常见的动作值空间设计方法。


    目前，市场上常见的伺服电动机都提供多种驱动方式，较为常见的方式主要为位置控制、速度控制与力矩控制。顾名思义，即通过控制电动机的角度（位置）、角速度或电动机力矩来控制电动机的运动状态，也可以同时联合三者控制电动机。由于机器人的物理结构限制，运动过程中各关节往往都在一个固定区间内做往返运动，因此速度控制很少被用于完成人形机器人运动控制。由于机器人物理结构固定，电动机选型确定，所以关节角度区间与电动机力矩上下限也是确定的。考虑到深度神经网络输出层输出区间往往为（-1，1），对应实际控制指令还要经过对应的数据处理以实现真实控制，这些限位数据可以用于动作空间输出的数据转换。


    基础端到端的强化学习机器人运动控制方法神经网络输出可经数据变换后直接控制机器人电动机。表 4-1 为一种典型机器人关节限位与电动机力矩上下限。'
