  md: '综上所述，贝叶斯估计是检验过程中对先验知识向后验知识不断修正的过程。基于决策层贝叶斯融合的实现过程可以总结为以下 4 个步骤：

    1) 获得每个传感器单元输出的目标识别结果。

    2) 计算每个传感器单元对不同目标的识别结果的不确定性。

    3) 计算目标识别的融合概率。

    4) 进行目标识别决策（判据），寻找极大似然估计（根据各传感器检测的综合决策，判断最有可能的识别结果）。


    在具体视触觉信息融合时，首先通过视觉深度神经网络从颜色、形状角度识别物体类别，然后用触觉抓取的方式从物体材质角度识别物体类别，将两种传感器的识别结果通过贝叶斯决策层融合，最终根据融合结果判断物体类别。


