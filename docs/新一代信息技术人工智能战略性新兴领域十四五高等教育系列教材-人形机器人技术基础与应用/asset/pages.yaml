- pgno: 52
  md: '应外部干扰时，三维运动模式经常被分解成平面内的运动模式。在失矢平面中，所有关节都是 1 自由度旋转的关节。在冠状平面和横切平面中，肘关节和膝关节表示为平移关节，因为手臂和腿的长度似乎在改变。该特性通过简化模型，如倒立线性摆模型，进行运动分析和运动生成。


    # 2.2.2 正运动学


    一旦对所有连杆规定坐标系之后，就可以根据建立的关节坐标系，列出各连杆的常量参数。本小节先用基于 D-H 参数法建立的关节坐标系推导出相邻连杆之间的坐标变换，即各连杆间坐标变换的一般形式，然后将这些变换依次相乘，即可得到机械臂的正运动学方程。


    对于特定的机器人，可以根据建立好的关节坐标系，按照下列顺序通过两次旋转和两次平移建立起相邻连杆 (i-1) 和 i 的对应关系，即变换矩阵。


    +   1) 将坐标系 {i-1} 绕 z_{i-1} 轴旋转 θ_i 角，再沿着 z_{i-1} 轴平移一段距离 d_i，使 x_{i-1} 轴与 x_i
    轴平行，得到的新坐标系为 {i-1''}，对应的轴分别为 x''_{i-1} 轴、y''_{i-1} 轴和 z''_{i-1} 轴，对应的坐标原点为 O''_{i-1}。


    +   2) 将坐标系 {i-1''} 沿 x''_{i-1} 轴平移一段距离 a_{i-1}，使连杆 (i-1) 和连杆 i 的坐标原点 O''_{i-1}
    和 O_i 重合；并绕 x''_{i-1} 轴旋转 α_{i-1} 角，使坐标系 {i-1''} 和坐标系 {i} 的 z 轴重合，即 z''_{i-1}
    轴和 z_i 轴重合。


    经过上述坐标变换，最终使得坐标系 {i-1} 与坐标系 {i} 重合，可用表示连杆 i 对连杆 (i-1) 相对位置的 4 个齐次变换矩阵来描述，称为 T
    矩阵，也称为连杆变换矩阵，记为 {}^{i-1}_i T。按照从左到右的原则，可以得到 {}^{i-1}_i T 的表达式，即


    ```

    {}^{i-1}_i T = R_z(\theta_i)Trans(0,0,d_i)Trans(0,0,a_{i-1})R_x(\alpha_{i-1})
    \quad (2-69)

    ```


    由式 (2-69) 可以看出，连杆变换矩阵就是描述连杆坐标系间相对平移和旋转的齐次变换矩阵。对式 (2-69) 进行展开计算，可得 {}^{i-1}_i T
    的一般表达式，即


    ```

    {}^{i-1}T = \begin{bmatrix} \cos \theta_i & -\sin \theta_i & 0 & a_{i-1} \\ \sin
    \theta_i \cos \alpha_{i-1} & \cos \theta_i \cos \alpha_{i-1} & -\sin \alpha_{i-1}
    & -\sin \alpha_{i-1} d_i \\ \sin \theta_i \sin \alpha_{i-1} & \cos \theta_i \sin
    \alpha_{i-1} & \cos \alpha_{i-1} & \cos \alpha_{i-1} d_i \\ 0 & 0 & 0 & 1 \end{bmatrix}
    \quad (2-70)

    ```


