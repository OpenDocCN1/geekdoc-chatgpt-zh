    # 2.2.3 逆运动学


    为使机器人位于期望的位姿，可通过逆运动学求解，以确定每个关节的角度值。前面已对机器人逆运动学的概念做了简单介绍，本小节主要研究求解逆运动方程的一般步骤。


    # 1. 关节空间与工作空间


    对于一个具有 \(n\) 个自由度的操作臂来说，它的所有连杆位置可由一组 \(n\) 个关节变量来确定。这样的一组变量通常被称为 \(n \times 1\)
    的关节矢量。所有关节矢量组成的空间称为关节空间。


    机器人的工作空间是指机器人末端执行器上参考点所能到达的所有空间区域。若位置是在空间相互正交的轴上测量，且姿态是按照空间描述中任意一种规定测量的，则称该空间为笛卡儿空间，有时也称为任务空间或者操作空间。


    # 2. 逆运动学问题的多解性与可解性


    机器人正运动学的建模解决了如何从关节空间的关节位置（即关节角度）求出操作空间末端执行器的位姿问题。而机器人的逆运动学问题则是将末端执行器在操作空间的运动变换为在相应的关节空间的运动，因此它的求解更具有重要意义。逆运动学的解是否存在归根结底取决于机器人的工作空间。如前描述，工作空间就是一个机器人的末端执行器所能到达的范围。而求解逆运动学方程可能存在的另外一个问题就是解的多重性问题，具体有以下
    3 种情况。


    +   1) 解不存在。当所期望的位姿离基坐标系太远，而机械臂不够长时，末端执行器无'
