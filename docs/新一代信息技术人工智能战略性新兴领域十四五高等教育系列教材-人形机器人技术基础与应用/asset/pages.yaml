    DRL 基础算法开始，首先介绍几种代表性 DRL 方法，了解其结构与特点；之后将结合具体的人形机器人与任务场景，介绍常见场景下 DRL 观察值、动作空间与奖励的设计思路；最后，将针对
    DRL 特点，介绍其仿真时的注意事项，并基于具体情境建立仿真模型与场景，介绍构建一套完整的 DRL 人形机器人的运动控制方法。


    # ## 本章知识点


    +   - 深度强化学习的基本概念

