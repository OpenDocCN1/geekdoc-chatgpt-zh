  md: '多个伸缩动作气缸集成为内装式“移动模块”，气缸与基座或滑台一体化设计并由滚动导轨引导移动支承在转动部分的基座和台子内的“后置式模块”等。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_226_0.png)


    图 8-12 杆、连杆与凸轮传动示例


    (10) 柔性传动机构 对于机器人而言，减速器的柔性既有利也有弊。传统意义上的机器人需要整体保持高刚度，便于快速响应、高精度定位和简化控制。然而，由于零件、工具、工作可能会出现意外错误，因此会产生额外的作用力对机器人自身、周围环境和人造成伤害。通过对传动机构添加可控、定量的柔性传动，可以有效提高机器人的性能。柔性传动机构通过将安装有位移传感器的弹性输出部件（弹簧），与高刚度的器和传动机构串联，从而降低自身结构刚度，提高整体传动柔性。通过选用合适的控制器，原有的传统位置控制驱动器可作为动力驱动器，有效隔离传动机构和负载所带来的惯量，消除机器人在非正常工作环境或周围有人员工作时常见的冲击或强制停止所产生的力。


    # 8.4.4 传动轴的设计


    # 1. 传动轴概述


    轴是轴系的核心零件，一切做回转运动的零件，只有装在轴上后才能实现其运动。其作用是保证零件在轴上有确定的轴向位置，防止零件发生轴向移动、周向发生相对转动，并能承受轴向力。


    按载荷和应力的不同，轴可分为三种：心轴，随回转零件一起或不一起转动，只承受弯矩而不传递转矩。转动心轴受变应力，不转动心轴受静应力；转轴，既承受弯矩又承受转矩；传动轴，主要承受转矩。


    按轴的中心线的不同，轴还可以分为三种：直轴，轴的各截面中心在同一直线上，包括光轴、阶梯轴、实心轴、空心轴；曲轴，轴的各截面中心不在同一直线上。曲轴通常是专用零件；软轴，轴线可变，把回转运动灵活地传到任何位置。其疲劳强度高、对应力集中的敏感性小，制造工艺性好。


    # (1) 传动轴常用材料及特点


    +   1) 碳钢，如 45 钢、50 钢，常用于不重要轴。其特点是，价廉、对应力集中敏感性低、可进行热处理。


    +   2) 合金钢，如 40Cr、20Cr，常用于磨损大的轴。其特点是，力学性能比碳钢高、淬火性能更好、可进行热处理，但价高、对应力集中敏感性高。


    +   3) 铸铁，如 QT600-3，常用于曲轴、凸轮轴。其特点是，容易制造复杂形状的零件、价廉、有良好的吸振性和耐磨性、对应力集中敏感性低。'
