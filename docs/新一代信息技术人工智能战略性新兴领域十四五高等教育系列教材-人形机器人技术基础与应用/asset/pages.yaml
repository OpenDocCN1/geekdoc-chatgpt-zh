  md: '4) 铝合金，如 6061、7075，常用于机器人不规则的轴。其特点是，强度高、质量小、有良好的铸造性能和塑性加工性能。


    # (2) 传动轴常用术语


    +   1) 轴颈，与轴承相配的部分，轴颈尺寸等于轴承内径。

    +   2) 轴头，与轮毂相配的部分，轮毂直径与轮毂内径相当。

    +   3) 轴身，连接轴颈与轴头的部分。

    +   4) 轴肩或轴环，轴上截面尺寸变化的地方。

    +   5) 轮毂，齿轮中心的圆柱部分，常带有一孔，其作用是安装在轴上使其在轴上转动或与轴一起转动。


    # 2. 机器人轴的结构设计


    机器人轴的结构设计需要根据受力特点及本身的结构需求，充分考虑轴上零件的连接、分布及结构工艺。


    +   (1) 设计任务 使轴的各部分具有合理的形状和尺寸。


    # (2) 设计要求


    1) 定位与固定要求。轴和轴上零件要有准确的工作位置，且要牢固而可靠地相对固定。轴上轴向零件的定位方法主要是周向固定，如轴肩、套筒、圆螺母、挡圈、轴承端盖。周向固定可使零件能同轴一起转动，传递转矩。周向固定大多采用键、花键、过盈配合或销等形式来实现。键连接制造简单、装拆方便，用于传递转矩较大，对中性要求一般的场合，应用最为广泛。销连接用于固定不太重要，受力不大，但同时需要轴向固定的零件。当零件位于轴端时，可用轴端挡板与轴肩、轴套、圆锥面等的组合，使零件双向固定。挡板用螺钉紧固在轴端并压紧被定位零件的端面。轴端加工螺纹孔。该方式机构较紧凑，为机器人轴常用的方式。


    2) 制造与安装工艺。轴应便于制造，轴上零件要易于装拆，并改善应力状况，减小应力集中。不同轴段的键槽，应布置在轴的同一母线上，以减少键槽加工时的装卡次数。需磨制轴段时，应留砂轮越程槽；需车制螺纹的轴段，应留螺纹退刀槽，相近直径轴段的过渡圆角、键槽、越程槽、退刀槽尺寸尽量统一。轴的配合直径应圆整为标准值，轴端应有
    45° 的倒角，与零件过盈配合的轴端应加工出导向锥面，装配段配合面不宜过长。减小应力集中的措施包括用圆角过渡，尽量避免在轴上开横孔、切口或凹槽；对于重要结构，可增加卸载槽
    B、过渡肩环、凹切圆角、增大圆角半径，也可以减小过盈配合处的局部应力等。


    图 8-13 所示为机器人轴系设计示例。在设计过程中，考虑轴上所需要固定的零件的定位与连接需要。设计要点为，需连接轴承、编码器、螺钉、电动机转子、电动机外壳、谐波减速器支撑等零件。如图
    8-13 所示，左图为转子轴，为电动机动力输出的高速端，


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_227_0.png)


    图 8-13 机器人轴系设计示例'
