  md: '# 1. 遗传算法


    遗传算法是较为常用的随机化全局路径规划算法，在 1975 年由美国的 J.Holland 教授初次提出。遗传算法是受到进化论思想的启发，对遗传和自然选择时发生交叉、变异等情况进行分析和仿真，同时结合了优胜劣汰的思想，根据每一层的结果选择出每一层的候选解，并对候选解进行比对，最终能够从得到的候选解中选出最优解。遗传算法是将全部群体中的个体设置为对象并编码，随机对编码进行空间搜索。遗传算法的核心操作为选择、交叉、变异。遗传算法的关键内容为对参数进行编码、设定初始群体、设计控制参数、设定遗传操作。遗传算法是比较新颖的全局路径规划算法，优点是在实现自身迭代的同时能够很好地与其他算法进行有机结合，在搜索过程中能够很好地搜索到最佳路径，从而保证了路径实现全局最优。遗传算法的实现较为简单，不容易受外界的影响。但遗传算法同样存在缺陷，如遗传算法的效率较为低下，规划时间较长，且算法在运行的过程中存在早熟的情况，不能用来进行在线规划。遗传算法流程图如图
    5-11 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_148_0.png)


    图 5-11 遗传算法流程图


    # 2. 快速搜索随机树算法


    快速搜索随机树（Rapidly-exploring Random Trees，RRT）算法是 1998 年由 LaValle 提出的一种非常经典的全局路径规划算法。该算法是根据采样进行搜索，不仅适用于平面，而且在高维空间中搜索路径时同样适用。在无人机、机械臂等领域，快速搜索随机树算法有广泛的应用空间，如在机器人操作系统（Robot
    Operating System，ROS）中OMPL（Open Motion Planning Library）包含 RRT 算法。快速搜索随机树算法大概率可以规划出路径，但是规划时间可能会较长，规划出的路径一般来说不是最优，因为树的分支和扩展是随机的，路径会有跳跃的情况出现。RRT
    算法的步骤如下：


    +   - 1) 初始化。首先获得整个地图，使随机树能够获取路径规划的环境，并且获取相应的移动的起点和终点，即对整个环境信息有清晰的认知。

    +   - 2) 采样。自行设定随机树，使随机树朝向不同的方向随机生长，即设定移动方向。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '3) 选择路径。在目标点和起始点之外的空间中随机产生种子，在生长的随机树中找到一个距离这个点的最近点，在此随机点和随机树上的点中间生成路径。此时，对路径进行判定，如果路径中间不存在障碍物，则说明此路径可行，并将路径加入随机树；如果路径经过障碍物，则需要找新的随机点进行生长。


    4) 找到路径。在寻找路径时，首先设置步长，最后一步的距离不能保证刚好到达目标点，因此距离目标点一定距离就可以判定为到达目标点。在路径规划的过程中到达一定的次数时，结束搜索。在许多路径规划中都有这种迭代次数设定。


    因为快速搜索随机树的随机性比较大，因此做了较多改进，经典的改进是双向快速扩展随机树（RRT-Connect），在起点和目标点同时生长随机树，能够大大提升寻找路径效率。RRT-Connect
    算法相较于 RRT 算法有了较大的改进。RRT 算法的设计原理是在起点生长种子，快速扩展类似树的路径，填充空间的大部分研究区域，并在填充的区域中找到一条可行的路径。RRT-Connect
    是在起点和目标点共同生长种子，并迅速扩展随机树以搜索当前空间，当起点与目标点的生长树相连接时，完成当前搜索。两种算法的二维空间搜索路径对比如图 5-12 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_149_0.png)


    图 5-12 RRT 算法和 RRT-Connect 算法的二维空间搜索路径对比


    # 3. Dijkstra 算法


    Dijkstra 算法是一种经典的最短路径算法，可以用来找出有向图中两个节点之间的最短路径。该算法是以起始节点为中心向外进行搜索，选择下一个距离最短的子节点进行遍历，并不断更新所有节点的最短路径，直到到达终点节点为止。


    这个算法可以使用在栅格地图导航等应用中。在栅格地图中，通常终点位置是已知的，而 Dijkstra 算法的主要原理如下：


    1) 如图 5-13 所示，假设有一个带权有向图，其中包含两个集合 S 和 U。集合 S 只包含起始节点 A，而集合 U 包含除 A 以外的所有节点。


    2) 从集合 U 中选择与起始节点 A 距离最短的节点 B，并将节点 B 添加到集合 S 中。此时，选择的距离就是起始节点 A 到节点 B 的最短路径。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_149_1.png)


    图 5-13 带权有向图


    3) 将节点 B 作为中间节点，更新其与集合 U 中所有节点的距离。如果待更新的节点 C 的距离大于从节点 A 经过节点 B 再到达节点 C 的距离时，则更新节点
    C 的最短路径为从节点 A 到节点 C 的距离值。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '4) 重复执行步骤 2）和步骤 3)，直到集合 S 中包含所有节点。


    Dijkstra 算法会在整个栅格地图中进行无向的遍历，其最大的时间复杂度是 O(n^2)，因此在计算过程中会耗费大量时间和内存资源，所以效率相对较低。特别是在嵌入式开发等对处理器性能要求较高的场景下，Dijkstra
    算法可能无法满足需求。


    # 4. A* 算法


    A* 算法（A-star Algorithm）是一种基于状态空间的启发式搜索算法，用于求解栅格地图中的最短路径。其核心思想是在搜索过程中引入启发函数，并结合起始节点到当前节点的实际距离和当前节点到目标节点的估计距离，通过建立启发式搜索规则，优先向目标点方向进行搜索，从而提高搜索效率。


    A* 算法的代价函数包含三个因素：当前节点到起始节点的实际距离代价 g(n)、当前节点到目标节点的估计距离代价 h(n) 和从起始节点经过当前节点到目标节点的总代价
    f(n)。其中，从当前节点到起始节点的实际距离代价 g(n) 是已知的，而当前节点到目标节点的估计距离代价 h(n) 则是通过启发函数计算得出的。总代价函数的表达式为


    f(n) = g(n) + h(n) (5-23)


    在 A* 算法中，通常使用曼哈顿距离作为启发函数的估计值。曼哈顿距离是通过计算两个点之间水平和竖直方向上的距离之和来定义的。


    A* 算法的基本流程如下：


    +   1) 将起始节点添加到开启列表中。


    +   2) 从开启列表中选择具有最小 f(n) 值的节点作为当前节点 n，并将其添加到关闭列表中。


    +   3) 对于当前节点 n 的相邻节点（通常是 8 个相邻格子）进行以下操作：


    +   ① 如果相邻节点 m 是障碍或者已经存在于关闭列表中，则忽略该节点。


    +   ② 如果相邻节点 m 不在开启列表中，则将其添加进开启列表，并更新节点 m 的父节点为当前节点 n，同时记录节点 m 的 f(m)、g(m)、h(m)
    的值。


    +   ③ 如果相邻节点 m 已经在开启列表中，则计算新路径经过当前节点 n 到达节点 m 的实际距离 g(m)；如果新路径的 g(m) 值比原先已存在的
    g(m) 值更小，则将新路径设为最优路径，并更新相邻节点 m 的父节点为当前节点 n，同时更新节点 m 的 g(m) 和 f(m) 值。


    +   4) 重复进行步骤 2）和步骤 3)，直到目标节点被添加到关闭列表中，表示路径已找到。然后，通过沿着每个节点的父节点返回起始节点，构建最优路径。如果未找到目标节点并且开启列表为空，则表示路径不存在。


    通过综合考虑实际距离和估计距离，A* 算法能够有效地搜索最短路径。在图 5-14 中，黑色粗实线框表示障碍物，实心点代表初始点，空心点代表目标


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_150_0.png)


    图 5-14 A* 算法的搜索范围和规划出的最短路径'
