    \) (2-24)


    # 3. 旋转的参数表示


    对于一般的旋转变换 \( \mathbf{R} \in SO(3) \)，它的 9 个元素之间并非相互独立。一个刚体最多有三个旋转自由度，因而最多需要三个量来指定其姿态方向。要理解这点，可以验证
    SO (3) 中矩阵所需要满足的约束，即


    \( \sum_i r_{ij}^2 = 1, j \in \{1,2,3\} \) (2-25)


    \( r_{1i}r_{1j} + r_{2i}r_{2j} + r_{3i}r_{3j} = 0, i \neq j \) (2-26)


    式 (2-25) 成立的原因是，旋转矩阵的各列都是单位向量；式 (2-26) 成立的原因是，旋转矩阵的各列相互正交。这些约束一起定义了 6 个独立的方程，其中有
    9 个未知数，自由变量数目为 3 个。


    本小节将推导三种方法来表达任意旋转，即欧拉角表示法、滚动角 - 俯仰角 - 偏航角表示法以及转轴 / 角度表示法，每种方法仅需使用三个独立变量。


