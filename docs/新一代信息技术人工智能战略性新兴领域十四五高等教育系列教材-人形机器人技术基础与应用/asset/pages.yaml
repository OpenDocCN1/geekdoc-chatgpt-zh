    然后加入其他时刻观测到的误差，得到整体的代价函数为


    $$\frac{1}{2} \sum_{i=1}^m \sum_{j=1}^n \|e_{i,j}\|^2 = \frac{1}{2} \sum_{i=1}^m
    \sum_{j=1}^n \|z_{i,j} - h(T_i, P_j)\|^2$$


    式中，\( z_{i,j} \) 表示在位姿 \( T_i \) 时观测的路标 \( P_j \) 所产生的数据，旨在对所有位姿和路标点同时进行优化，而优化过程的关键就是通过寻找使目标函数梯度下降的方向来获得最优解。为此，给所有自变量引入一个增量
    \( \Delta x \)，将目标函数转化为一个可以通过迭代方法求解的形式，即


    $$\frac{1}{2}\|f(x + \Delta x)\|^2 \approx \frac{1}{2} \sum_{i=1}^m \sum_{j=1}^n
    \|e_{i,j} + F_{ij} \Delta \xi_i + E_{ij} \Delta P_j\|^2$$


    在式 (5-11) 中，\( \xi \) 为机器人的李代数位姿表示；\( F_{ij} \) 和 \( E_{ij} \) 分别代表当前状态下代价函数相对于机器人和路标点的偏导数。将机器人位姿变量
    \( [\xi_1 \xi_2 \cdots \xi_m]^T \in R^{6m} \) 定义为 \( x_c \)，路标点变量 \( [P_1 P_2
    \cdots P_m]^T \in R^{3n} \) 定义为 \( x_p \)，则上述公式可以简化为


    $$\frac{1}{2}\|f(x + \Delta x)\|^2 = \frac{1}{2}\|e + F \Delta x_c + E \Delta
    x_p\|^2$$


    这里，\( E \) 和 \( F \) 表示整体变量在目标函数下由每个误差项 \( F_{ij} \) 和 \( E_{ij} \) 组成的雅可比矩阵。解式
    (5-12) 时通常采用高斯 - 牛顿方法，这涉及解线性增量方程，即


    $$H \Delta x = g$$


    矩阵 \( H \) 因包含所有位姿和路标点，维度庞大，直接求逆计算量巨大。但考虑到 \( H \) 的稀疏性质，可采用稀疏矩阵技术进行高效求解，即


    $$H = J^T J = \begin{bmatrix} F^T F & F^T E \\ E^T F & E^T E \end{bmatrix}$$


    利用稀疏性稀疏结构特点优化计算过程，避免了全矩阵的昂贵计算代价，加快了整个优化过程。


    # 2. 位姿图优化


    在 SLAM 系统中，尽管对相机位姿和地图点的联合优化（即 BA 优化）是提高定位与建图精度的关键，但大规模的 BA 优化过程却很耗时。在优化过程中，大部分时间消耗在特征点位置的调整上，但当系统接近收敛时，这些特征点的位置变化微小。此时，可以简化问题，专注于关键帧位姿的调整，通过构建位姿图来优化。在位姿图中，节点
    \( T_1, T_2, \cdots, T_n \) 表示相机位姿，如果 \( T_i \) 和 \( T_j \) 之间存在运动关系，则该运动可以用李代数形式表达为


    $$\Delta \xi_{ij} = \xi_i^{-1} \circ \xi_j = \ln(T_i^{-1} T_j)^\vee$$'
  merge: -1
  img_proc: true
- pgno: 142
  md: '式中，\(\xi_i\) 和 \(\xi_j\) 是李群中的元素，\(\circ\) 表示李群中的群乘法，上式也可表示为


    \(T_{ij} = T_i^{-1} T_j\) (5-16)


    运动过程中的误差可以表示为


    \(e_{ij} = \Delta \xi_{ij} - \ln(T_{ij}^{-1} T_i^{-1} T_j)^\vee\) (5-17)


    为了最小化误差，通过对 \(\xi_i\) 和 \(\xi_j\) 进行优化。采用扰动模型，分别对这两个变量添加左扰动 \(\delta \xi_i\) 和
    \(\delta \xi_j\)，误差函数变为


    \(\hat{e}_{ij} = \ln\{T_{ij}^{-1} T_i^{-1} \exp[(-\delta \xi_i)^\wedge] \exp(\delta
    \xi_i^\wedge) T_j\}^\vee\) (5-18)


    根据伴随的性质可得


    \(\exp(\xi^\wedge) T = T \exp\{ [Ad(T^{-1})\xi]^\wedge \}\) (5-19)


    通过将扰动移到最右侧的方式得出右乘形式的雅可比矩阵，即


    \(\hat{e}_{ij} = \ln\{T_{ij}^{-1} T_i^{-1} \exp[(-\delta \xi_i)^\wedge] \exp(\delta
    \xi_i^\wedge) T_j\}^\vee\)

    \(= \ln(T_{ij}^{-1} T_i^{-1} T_j \exp\{ [-Ad(T_j^{-1})\delta \xi_i]^\wedge \}
    \exp[Ad(T_j^{-1}) \delta \xi_i] )^\vee\)

    \(\approx \ln(T_{ij}^{-1} T_i^{-1} T_j \{ I - [Ad(T_j^{-1})\delta \xi_i]^\wedge
    + Ad(T_j^{-1}) \delta \xi_i \} )^\vee\)

    \(\approx e_{ij} + \frac{\partial e_{ij}}{\partial \delta \xi_i} \delta \xi_i
    + \frac{\partial e_{ij}}{\partial \delta \xi_j} \delta \xi_j\) (5-20)


    利用李代数的求解法则进行求解，可得 \(T_i\) 和 \(T_j\) 的雅可比矩阵分别表示为


    \(\left\{\begin{array}{l} \frac{\partial e_{ij}}{\partial \delta \xi_i} = -j_r^{-1}(e_{ij})
    Ad(T_j^{-1}) \\ \frac{\partial e_{ij}}{\partial \delta \xi_j} = j_r^{-1}(e_{ij})
    Ad(T_j^{-1}) \end{array}\right.\) (5-21)


    在完成雅可比矩阵的计算之后，优化问题简化为图优化。在这个图模型中，节点代表相机的位姿，边表示不同位姿之间的运动关系。优化的目标是调整所有位姿节点，使得整个系统的误差最小。图优化的目标函数可以形式化为


    \(\min \frac{1}{2} \sum_{(i,j) \in \mathfrak{E}} e_{ij}^T \Sigma_{i,j}^{-1} e_{ij}\)
    (5-22)


    这里，\(e_{ij}\) 是边 \((i, j)\) 上的误差向量，\(\Sigma^{-1}\) 是该误差的逆协方差矩阵，而 \(\mathfrak{E}\)
    代表图中所有边的集合。优化的过程涉及调整位姿节点以最小化误差函数，通常使用图优化库（如 g2o 或 Ceres）来执行此任务。这些库利用图的稀疏性质，以高效的方式完成大规模优化，来提高
    SLAM 系统的性能和精度。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 5.2.3 SLAM 实例


    随着多传感器融合技术的进步，近年来激光 SLAM 和视觉 SLAM 的融合也成为趋势。由于这种多传感器融合 SLAM 方案具备多种传感器信息输入，结合优秀的融合算法可以让不同的信息输入之间相互弥补，为复杂、动态场景下的
    SLAM 应用带来了巨大的潜力。在激光 SLAM 和视觉 SLAM 中分别有很多经典的算法框架，下面简单介绍 Cartographer 和 ORB-SLAM3
    这两个不同 SLAM 方案中的经典方法。


    # 1. Cartographer


    Cartographer 是由谷歌公司开发的一套基于图优化的激光 SLAM 系统，旨在实现移动机器人的实时定位和建图。它同时支持 2D 和 3D 的激光 SLAM，可以跨平台使用，并且支持激光雷达、IMU、里程计、GPS、路标等多种不同的传感器配置，是目前落地应用最广泛的激光
    SLAM 算法之一，已经被广泛应用到清洁机器人、仓储机器人等服务机器人上。


    图 5-3 展示了 Cartographer SLAM 流程图。它基于利用子图构建全局地图的思想，将地图划分为小的区域，并对每个区域进行建模和优化，这样能够有效地避免建图过程中环境里移动物体的干扰。在建图过程中，前端先借助激光雷达等传感器信息构建附近区域的子图，后端优化负责将这些子图统一优化形成一张完整可用的地图。Cartographer
    在室内环境中构建的地图如图 5-4 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_143_0.png)


    图 5-3 Cartographer SLAM 流程图


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_143_1.png)


    图 5-4 Cartographer 在室内环境中构建的地图'
