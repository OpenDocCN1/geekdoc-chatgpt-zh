    # 3.3.3 其他步态规划


    在人形机器人的步态规划中，除了零力矩点方法之外，还有多种其他的步态规划方法，这些方法各有其优势和应用场景。


    # 1. 基于稳定性裕度的步态规划方法


    与设定理想 ZMP 轨迹从而确定各关节的运动轨迹的方法不同，基于稳定性裕度的步态规划方法的基本思想是先根据地面环境（路面的凸凹和障碍物等）设定足部轨迹，在可变参数的有效范围内找出具有最大稳定性裕度的躯干轨迹作为最后的规划结果。本方法根据机器人上体位移和步长、步速等信息，采用三次样条插值法得到人形机器人各关节的运动。再由人形机器人各关节的运动求得人形机器人各组成部分（如躯干、大腿、小腿等）的运动速度、加速度等，从而求得
    ZMP 轨迹，并根据 ZMP 稳定性判据判断该运动轨迹是否满足稳定性要求。通过改变参数的值可以得到不同的人形机器人运动轨迹以及相应的 ZMP 轨迹，并比较各轨迹的稳定性，从而筛选出稳定性最好，即稳定性裕度最大的轨迹作为最后的运动轨迹。


    本方法使用的人形机器人模型及坐标系设置如图 3-7 所示，人形机器人右侧方向为 $x$ 轴正方向，机器人前进方向为 $y$ 轴正方向，$z$ 轴正方向垂直于地面向上。


