  md: '# 3.2.2 其他稳定性判据


    # 1. 李雅普诺夫稳定性


    李雅普诺夫稳定性（Lyapunov Stability）是一种广泛用于控制理论和系统动力学中的方法，用于分析系统在某个平衡点或轨迹附近的稳定性。这种方法特别适用于人形机器人等复杂系统的稳定性分析，因为它可以提供系统是否会在初始扰动后返回到其原始状态或平衡点的数学证明。


    +   (1) 判据定义 李雅普诺夫稳定性是基于系统的状态方程和所谓的李雅普诺夫函数（一个特定设计的能量函数）来分析系统的稳定性。如果存在一个李雅普诺夫函数，使得在系统的所有状态下该函数都是非增的（通常是正定的并随时间衰减），那么系统被认为是稳定的。


    李雅普诺夫函数是一个标量函数，通常是系统状态变量的函数，用于评估系统从初始状态偏离的程度。


    +   1) 正定性：李雅普诺夫函数需要在除平衡点以外的局部区域内正定。


    +   2) 能量耗散：函数随时间的导数应小于或等于零，表明系统不会随时间增加能量。


    +   (2) 计算方法


    +   1) 确定系统的动力学方程：首先明确系统的状态方程，描述系统如何从一个状态过渡到另一个状态。


    +   2) 选择或构造李雅普诺夫函数：基于系统的物理特性和动力学行为设计李雅普诺夫函数。


    +   3) 分析函数的导数：计算李雅普诺夫函数相对于时间的导数，并证明其在所有相关状态下非正。


    # 2. 基于落脚点的稳定性判据


    落脚点（Foot Placement Estimator，FPE）是 Wight 等人提出的一种评价稳定性的方法，该方法计算摆动腿在什么位置着地能够获得稳定步态。FPE
    的一个基本前提假设是系统的角动量在摆动腿与地面碰撞前后是不变的，基本思想是让人形机器人摆动腿与地面碰撞后，系统的机械能等于其最大势能（即质心到达最高点时的势能），这也就意味着系统在质心达到最高点时动能为
    0，达到静止状态。这种静态平衡的运动方式与常见的人形机器人的行走步态有一定差别，似乎不能直接应用于双足行走运动的分析。但是当 FPE 处于人形机器人脚掌与地面的接触区域内时，可以通过调整人形机器人质心的位置让人形机器人的运动停下来，避免摔倒。


    下面介绍 FPE 的计算方法。方程的推导基于一个简单的双足行走模型，如图 3-4 所示。该模型的质心集中在髋关节，腿建模为刚性无质量的杆，脚处理为一个点。记该模型的质量为
    m，腿长为 L，相对于质心的转动惯量为 I。摆动腿与地面碰撞前的时刻，质心的线速度为 v1，在水平和竖直方向的线速度分别为 vx、vy，系统相对质心的角速度为
    θ̇1。摆动腿与地面碰撞后，质心的线速度为 v2，系统相对质心的角速度为 θ̇2。摆动腿触地时与竖直方向的夹角为 φ。人形机器人质心距离地面的高度为 h。根据系统在碰撞前后相对于摆动腿触地点的角动量守恒，有'
