    图 9-19 梅花桩场景示例


    在梅花桩场景中，视觉感知系统扮演着至关重要的角色。机器人需要通过视觉传感器（如摄像头、深度摄像头等）实时获取周围环境的信息，识别梅花桩的位置和高度，以及其他潜在的障碍物和地形特征。这些信息是机器人进行轨迹规划的基础。识别出的梅花桩信息包括中心点位置
    p、最大内接圆半径 r、高度 h 以及梅花桩表面的单位外法向量 n。为了保证运动的安全性，通常取足够大的梅花桩的中心点作为机器人的期望落脚点。


    # 1. 运动轨迹规划


    在现有的方法中，常根据机身速度计算机器人未来的名义落脚点，然后在名义落脚点附近选择最近的可选落脚点。这种方法无法保证落脚点选取的最优性。在质心运动轨迹的生成上，通常根据遥控指令及机器人当前状态进行积分，获得近似的质心轨迹。这种方法未考虑机器人的动力学特性，可能导致轨迹不合理，进而影响后期的轨迹跟踪效果。


    本节将通过混合整数二次规划（Mixed-Integer Quadratic Programming，MIQP）来实现落脚点选取及机器人质心轨迹的优化。MIQP
    能够同时处理二次规划中的连续性问题和整数规划中的离散性问题。在梅花桩这样复杂的地形上，机器人的落脚点受到梅花桩位置的限制，仅有有限的离散落脚点可供选择，同时还需要优化机器人连续的质心运动轨迹。MIQP
    的应用可以有效解决这一问题，确保机器人在复杂地形上的运动安全性和轨迹合理性。


    首先对机器人的动力学模型进行简化。完整的动力学方程为


    ```

    \(\ddot{H}q+c=S^{T}\tau+J^{T}f\)

    ```


    式中， \(q \in R^{N_G}\)、 \(H \in R^{N_G \times N_G}\)、 \(c \in R^{N_G}\)、 \(S \in
    R^{N_J \times N_G}\)、 \(\tau \in R^{N_J}\)、 \(N_J\)、 \(N_G = N_J + 6\) 分别为广义坐标、惯量矩阵、非线性项、选择矩阵、关节力矩、真实关节个数、广义坐标数；
    \(J=[J_1^T J_2^T \cdots J_{N_c}^T]^T \in R^{3N_c \times N_G}\) 和 \(f=[f_1^T f_2^T
    \cdots f_{N_c}^T]^T \in R^{3N_c}\) 分别为世界系下接触点的雅各比矩阵和地面作用力， \(N_c\) 为接触点个数。如果忽略腿部影响，可将式
    (9-33) 简化为质心动力学，即


    ```

    \(\begin{bmatrix} m(\ddot{p}-g) \\ \dot{L} \end{bmatrix} = \sum_{i=1}^{N_c} \begin{bmatrix}
    I_{3\times3} \\ \hat{r}_i - \hat{p} \end{bmatrix}\)

    ```'
