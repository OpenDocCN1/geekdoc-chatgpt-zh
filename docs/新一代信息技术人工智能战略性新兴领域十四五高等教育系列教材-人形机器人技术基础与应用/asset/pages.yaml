  md: '# 表 4-1 典型机器人关节限位与电动机力矩上下限


    | 关节名称 | 限位角度 / rad | 限位力矩 / N · m |

    | :--- | :--- | :--- |

    | 右腿偏航关节 | -0.43 ~ 0.43 | -200 ~ 200 |

    | 右腿滚动关节 | -0.43 ~ 0.43 | -200 ~ 200 |

    | ... | ... | ... |

    | 左手肘关节 | -1.25 ~ 2.61 | -40 ~ 40 |


    与观察值空间数据归一化类似，动作值空间需进行“逆归一化”。考虑到角度与力矩上下限确定，故常采用最小值最大值归一化的方法进行逆操作，即


    ```

    \(x'' = x[\max(x) - \min(x)] + \min(x)\)

    ```


    处理后的数据可直接发给下级驱动器，也可以继续进行后续处理。在端到端的强化学习机器人控制中，网络输出可直接输出给电动机作为指令，其网络结构如图 4-11 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_119_0.png)


    值得注意的是，尽管时常使用角度、力矩等作为神经网络的输出，但电动机实际上以电流作为最终的驱动方式。市场上现有的伺服电动机均有配套的控制算法，电流与力矩之间的映射往往较为精准，但位置控制与电流之间的转换往往并不统一，在应用于人形机器人学习控制时，需要进一步处理。但其优势在于，在训练的初期，如果指令是一个恒定的关节角度，则机器人不容易倾覆；反之，如果指令是一个恒定的力矩，那么机器人很容易不平衡。较为常见的方式有利用
    PD 控制器将位置指令转化为力矩指令，公式为


    ```

    \(f = K_p(\hat{p} - p) + K_d(\widehat{\dot{p}} - \dot{p})\)

    ```


    式中，\(f\) 为关节力矩；\(p\) 为关节角度；\(\hat{p}\) 为关节期望角度；\(\dot{p}\) 为关节角速度；\(\widehat{\dot{p}}\)
    为关节期望角速度；\(K_p\)、\(K_d\) 为自定义参数。在实际应用中，关节期望角速度通常为 0。\(K_d\) 表现为阻尼。\(K_p\) 为比例系数，若
    \(K_p\) 过大，则易发生振荡现象，效果如图 4-12 所示。


    除 PD 算法外，仍有许多方式可以将电动机角度映射为电动机力矩，如利用神经网络模拟电动机响应等。该过程往往是纯粹的监督学习过程，在此不做赘述。


    除直接将全连接网络输出作为电动机指令外，根据算法的不同，很多网络输出维度可以起到不同的作用。例如，许多算法采用增量式位置控制模式，神经网络输出并不直接作为电动机指令使用，而是与上一时刻电动机目标角度叠加作为新的电动机驱动指令。这种方法很多时候可以加快学习速度并使电动机指令更为平滑，因为通常增量式的强化学习算法输出的指令范围相对要小很多，与目标角度叠加后的数值相比于在整个关节限位空间内输出目标角度来说，波动要小得多，这对部署更加友好，也降低了实际机器人的机械磨损。增量式网络输出的结构如图
    4-13 所示。'
