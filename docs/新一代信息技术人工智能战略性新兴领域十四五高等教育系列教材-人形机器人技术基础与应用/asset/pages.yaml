    +   4) 绕当前 y 轴旋转 \( \beta \) 角度。

    +   5) 绕固定 x 轴旋转 \( \delta \) 角度。


    为了确定这些旋转变换的累积效应，以第一个旋转变换 \( \mathbf{R}_{x,\phi} \) 作为起始，然后视情况左乘或右乘相应矩阵，得到


