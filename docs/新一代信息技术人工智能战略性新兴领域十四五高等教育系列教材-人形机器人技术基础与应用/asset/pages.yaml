- pgno: 116
  md: '连接神经网络进行推理。一种典型的带有卷积神经网络的状态观察值设计与网络结构如图 4-7 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_116_0.png)


    图 4-7 一种典型的带有卷积神经网络的状态观察值设计与网络结构


    即使有完整的传感器感知数据，很多情况下也难以真实、准确地描述机器人所处的真实状态，如状态估计算法的不成熟、传感器的噪声影响、真实机器人的设计限制以及周围环境干扰物过多等，都会使机器人对自身所处状态估计不准。很多情况下，这种误差会导致学习效率大幅降低或无法习得所需技能。有一种缓解这类问题的算法，即分阶段训练。


    在第一阶段，使用仿真器中能够获得的完备特权信息训练一个老师策略。由于该策略在使用完备信息的情况下进行训练，故而能够在很短的时间内达到一个很好的水平。然而，该策略并不能用于真实环境，原因是真实环境下无法获得这些完备的特权信息。这些信息包括了腿足机器人周围的地面高度图、接触信息和本体信息等。老师策略使用正常强化学习算法进行训练。


    在第二阶段，使用老师策略训练一个学生策略，其中学生策略只能获得机器人在实际中使用的可获得观测。在相同状态下，学生策略往往使用非完备但是包含历史信息的输入，而对应的老师策略使用完备特权信息作为输入；学生策略学习的损失函数设定为模仿老师策略的动作，使用监督学习的方法进行训练。


    学生策略可使用时序卷积网络或其他包含时间信息的深度神经网络。利用这些网络对历史信息进行处理，可以利用更长时间的历史信息，并从历史信息中推断肢体接触与滑动的有关信息。两阶段训练如图
    4-8 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_116_1.png)


    图 4-8 两阶段训练'
