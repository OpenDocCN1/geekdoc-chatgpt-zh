  md: '# # 前言 PREFACE


    人形机器人作为最高形态的仿生机器人，具有类似人类的形态和动作能力，能模仿人类的动作和行为，适应多变的环境和任务需求，更自然地与人类进行交互，可以更好地融入人类社会环境，为人类服务。在人类社会迈向自动化和智能化的进程中，人形机器人作为前沿科技和新质生产力的代表，正逐渐从实验室走向实际应用场景，成为推动社会进步和经济发展的重要力量。自
    20 世纪中期以来，机器人技术经历了从工业机器人到服务机器人，再到如今的人形机器人这一跨越式的发展历程。人形机器人已在工业制造、医疗康复、家庭服务等领域展现出了巨大的应用潜力，必将在社会生产和生活中成为人类的得力助手。我们正迎来一个前所未有的技术革命时代，这不仅改变了传统的生产生活方式，也在深刻影响着社会的各个方面。


    为更好地适应这一变革、培养未来的科技创新人才，我们编写了本书。它不仅是一本系统介绍人形机器人技术的教材，更是一本面向未来、培养创新人才的重要参考书。希望本书能够为新工科专业的建设和发展提供有力支持，帮助更多的学生掌握前沿技术，成为引领未来科技发展的中坚力量。


    本书是国内第一本以本科生为主要对象的人形机器人教材，内容涵盖了从人形机器人技术基础理论到实际应用的各个方面，主要有以下特色。


    +   1. 系统性。本书内容系统全面，涵盖了人形机器人技术的各个关键领域。

    +   2. 前沿性。本书结合了最新的研究成果和技术进展，确保学生能够了解和掌握当前最先进的人形机器人技术。

    +   3. 实用性。本书注重理论与实践的结合；通过实际案例和实验指导，帮助学生将所学知识应用到解决实际问题中。

    +   4. 跨学科融合。本书内容涉及机械设计、控制理论、计算机科学、人工智能等多学科知识，体现了新工科专业跨学科融合的特点。


    本书共 9 章。第 1 章主要介绍人形机器人的基本概念、国内外发展现状、系统组成、关键技术以及应用场景。第 2 章介绍机器人学的基础知识和人形机器人运动学和动力学分析方法。第
    3 章主要介绍人形机器人的 ZMP 稳定性分析、ZMP 步态规划以及模型预测控制和全身控制等经典行走控制方法。第 4 章介绍基于深度强化学习的人形机器人运动控制方法。第
    5 章介绍 SLAM 基本原理和算法、全局路径规划和局部路径规划的不同策略及其实现方法，并给出了应用实例。第 6 章介绍人形机器人的内部传感器和外部传感器的工'
  merge: -1
  img_proc: true
- pgno: 4
  md: '作原理以及多传感器信息融合方法。第 7 章介绍二维视觉感知和三维视觉感知的基本原理、视觉感知任务典型算法，以及视觉感知技术的实际场景应用。第 8 章介绍人形机器人机构设计的基本设计方法与原则、人形机器人本体的基本组成与结构，以及人形机器人的驱动机构、传动机构和系统集成机构的设计方法。第
    9 章以宇树 G1 人形机器人为例，介绍其运动控制系统组成和人形机器人仿真环境构建与仿真，并给出了人形机器人平衡站立、行走、复杂地形行走和跳跃任务的实现方法和控制实例。


    本书由北京工业大学、山东大学和杭州宇树科技有限公司三家单位的专家共同编写，其中第 1 章由左国玉和辛乐编写，第 2 章由郑榜贵编写，第 3 章由张伟和张阳光编写，第
    4 章由李晓磊编写，第 5、7 章由程吉禹编写，第 6 章由刘春芳编写，第 8 章由黄高编写，第 9 章由王兴兴和张阳光编写。全书由左国玉和张伟统稿，郑榜贵、程吉禹协助整理。


    本书在编写过程中，得到了北京工业大学周纪勇、赵未硕、吴启飞、喻杉以及山东大学谭文浩、方兴、李智亨、王跃的帮助。特别感谢杭州宇树科技有限公司对本书的大力支持。本书的编写参考了大量的国内外文献，在此一并对相关作者表示感谢。


    人形机器人属于新兴技术领域，发展迅速，涉及的学科多、专业广，由于编者水平有限和经验不足，书中难免存在错误和不足之处，恳请读者批评指正。


