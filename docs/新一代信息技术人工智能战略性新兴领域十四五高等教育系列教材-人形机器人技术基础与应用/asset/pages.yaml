    # 2.2.4 微分运动学


    微分运动学对于瞬时运动分析和运动生成至关重要。由于机器人连杆表示为刚体，因此假设基座连杆的瞬时运动已知，则机器人的瞬时运动由关节的运动速率唯一表示。有关运动速率的信息来自关节中的传感器（如光学编码器）。使用该信息，可以计算任何感兴趣的连杆的瞬时运动，如末端连杆的瞬时运动。正确评估瞬时运动状态对于机器人行走、用手操纵物体或全身重新配置以避免碰撞等活动是必不可少的。此外，微分运动学在控制中也起着重要作用。基于任务空间的运动前馈、反馈控制方案，根据感兴趣的末端连杆的瞬时运动来制定所采用的控制指令，然后通过（逆）微分运动学将这些控制指令转换成关节运动的控制命令。微分运动学是建立动力学模型的基础，其中考虑了一阶（速度级）和二阶（加速度级）关系。


