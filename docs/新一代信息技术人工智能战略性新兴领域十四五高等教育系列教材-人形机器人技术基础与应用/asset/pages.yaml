    # 3. 基于最小二乘的全身控制


    根据上一小节的内容，已经知道人形机器人的控制往往需要同时控制不同任务空间的目标，这些任务目标涉及在特定位置的运动（如末端执行器、机体重心等）、期望的接触力或关节转矩等。接下来介绍另外一种更加全面、更加通用的思想来完成人形机器人全身控制任务，即将操作空间控制问题转化为线性目标的最小二乘优化问题。首先给出如下的线性方程组，它由
    n 个线性方程组成，x 为优化变量。


    ```

    $$A_i x = b_i$$ (3-100)

    ```


    与上一小节中的任务优先级定义类似，$i$ 代表任务的优先级，$i=1$ 代表最高优先级任务。对于所有第 $i$ 层级别的任务，被统一堆叠表示在任务矩阵 $A_i$
    和任务向量 $b_i$ 之中，后文会具体给出如何将运动任务、关节转矩任务以及接触力任务或其他任务等统一转换为 $A_i x = b_i$ 的线性形式。对于这样的标准线性方程组，可以给出其对应的标准最小二乘优化问题，即在最小二乘意义下求解待优化变量
    $x$。


    ```

    $$\min_x \| A_i x - b_i \|_2$$ (3-101)

    ```


    类似于在带优先级的多任务全身控制中的处理，将前 $i-1$ 个任务各自的矩阵 $A$ 和向量 $b$ 堆叠到一起，并且假设已经求解得到了实现前 $i-1$
    个工作空间任务的优化变量，可以通过式 (3-102) 计算得到前 $i-1$ 个任务的误差向量，即


    ```

    $$c^*_{i-1} = \begin{bmatrix} A_1 \\ \vdots \\ A_{i-1} \end{bmatrix} x^*_{i-1}
    - \begin{bmatrix} b_1 \\ \vdots \\ b_{i-1} \end{bmatrix}$$ (3-102)

    ```


    误差向量 $c^*_{i-1}$ 代表前 $i-1$ 个任务的完成程度。如果该向量对应第 $k$ 个任务的元素数值为 0，则说明第 $k$ 个优先级任务能够被完全完成；如果该数值不为
    0，则说明对应优先级任务无法被完全完成，原因可能是与高优先级任务冲突，全身控制器优先于执行更重要优先级的任务并且牺牲该层级任务的效果。


    借助堆叠的前 $i-1$ 个任务矩阵 $A$ 和任务向量 $b$ 和计算得到的 $i-1$ 个任务的误差向量，可以构造带等式约束的最小二乘优化问题。这个优化问题对应的含义是在保证前
    $i-1$ 个任务的完成效果不变的前提条件下，尽可能在最小二乘意义下最小化第 $i$ 个任务的执行误差。换句话说，通过等式约束来保证更高优先级的任务控制效果不变，通过代价函数来尽可能提高当前优先级任务控制效果，即


    ```

    $$\min_x \| A_i x - b_i \|_2$$ (3-103)

    ```'
