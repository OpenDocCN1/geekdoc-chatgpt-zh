    在一个给定的范围内变化，如


    \(\begin{cases} 0 < y_{sd} < 0.5D_s \\ 0 < y_{ed} < 0.5D_s \end{cases} \quad (3-58)\)


    根据式 (3-57)、式 (3-58)，可以得到满足以下约束条件的 \(y_h(t)\) 轨迹，即


    \(\max \begin{cases} d_{yzmp}(y_{sd}, y_{ed}) \\ y_{sd} \in (0, 0.5D_s), y_{ed}
    \in (0, 0.5D_s) \end{cases} \quad (3-59)\)


    式中，\(d_{yzmp}(y_{sd}, y_{ed})\) 表示 \(y\) 方向的稳定性裕度。这里，计算 \(y\) 方向的稳定性裕度时只考虑了 \(y\)
    方向的运动，是因为从 ZMP 的计算公式可以看出，\(x\) 方向的运动影响很小。由于只有两个参数 \(y_{sd}\) 和 \(y_{ed}\)，通过穷举搜索算法很容易得到满足式
    (3-59) 的 \(y_{sd}\) 和 \(y_{ed}\)。另外，根据起始时刻及结束时刻人形机器人的速度为 0，可以得到以下边界条件，即


    \(\begin{cases} \dot{y}_h(t_0) = 0 \\ \dot{y}_h(t_e) = 0 \end{cases} \quad (3-60)\)


    式中，\(\dot{y}_h(t_0)\) 和 \(\dot{y}_h(t_e)\) 分别表示人形机器人在起始时刻和终止时刻的运动速度。通过三次样条插值即可得到
    \(y_h(t)\) 轨迹。


    腰部在左右方向即 \(x\) 方向的运动轨迹可以按照同样的方法得到，在进行稳定性计算时，应该以 \(x\) 方向的稳定性裕度最大为选择轨迹的标准之一。


    另外，从 ZMP 的计算公式可以看到，人形机器人在两个相互垂直的方向（即 \(x\)、\(y\) 方向）的 ZMP 可以认为是相互独立、互不影响的，因此腰部的
    \(x\)、\(y\) 方向的运动轨迹可以独立规划。也就是说，可以先规划好 \(y\) 方向的轨迹，再规划 \(x\) 方向的轨迹。


    根据前面提到的方法，可以得到步态生成方法的流程：首先，根据地面环境规划出满足地面约束条件的脚部轨迹；然后，根据 ZMP 稳定性判据准则，规划出具有高稳定性的腰部轨迹。在选择腰部轨迹时，除了考虑稳定性因素外，还要考虑关节范围等运动约束条件。脚部及腰部轨迹确定之后，再通过逆运动学计算，即可得到各关节的运动轨迹。基于
