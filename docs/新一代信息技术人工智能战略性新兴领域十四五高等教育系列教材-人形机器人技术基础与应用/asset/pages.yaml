    平面，它穿过“头部”和“脊椎”并将身体分成左右两部分（左边和右边）。然后，冠状平面（L），也称为正向平面，是垂直于地面的 yz 平面，它将身体分为背部和前部两部分（背部和腹侧部，或后部和前部）。最后，横切平面（T），也称为横截面，是平行于地面的
