    \(\boldsymbol{M}(q)\) 表示机械臂受到的惯性力的大小。 \(\boldsymbol{V}(q,\dot{q})\) 为 \(6\times
    1\) 的离心力和科里奥利（科氏力）矩阵，该矩阵中非零元素的大小取决于两个因素，即机器人中各关节的关节角 \(q\) 及其关节角速度 \(\dot{q}\)。
