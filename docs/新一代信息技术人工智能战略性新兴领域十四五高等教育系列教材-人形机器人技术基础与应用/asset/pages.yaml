- pgno: 238
  md: '展性和精确性，使其能够被用于研究和开发各种模拟环境，帮助科研人员和工程师测试和优化他们的模型和算法。


    Mujoco 仿真器具备准确高效、免费开源、模块化、丰富的社区支持和易于使用的开发接口等优点，近年来成为人形机器人控制开发十分受欢迎的仿真器之一。Mujoco
    仿真器帮助研究人员和开发者测试和优化他们的控制策略，从而推动人形机器人技术的发展和进步。图 9-3 所示为 Mujoco 仿真器软件界面。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_238_0.png)


    图 9-3 Mujoco 仿真器软件界面


    Mujoco 仿真器可用于实现基于模型的计算，如控制合成、状态估计、系统识别、机构设计、通过逆动力学进行数据分析，以及为机器学习应用进行并行采样等。它还可用作更传统的模拟器，包括游戏和交互式虚拟环境。为了更加灵活地使用
    Mujoco 仿真器提供的接口和工具，推荐从源码构建 Mujoco 仿真器。在 Ubuntu 系统下安装和配置 Mujoco 仿真器的方法如下。


    1) 首先确保系统已经安装好 C++ 编译工具。


