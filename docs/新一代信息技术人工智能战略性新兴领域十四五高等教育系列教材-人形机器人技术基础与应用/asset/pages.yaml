    # 1. 马尔可夫决策过程


    强化学习研究的问题是智能体与环境交互的问题。在强化学习中，环境是智能体在行动过程中与其发生交互的场所，这里的环境不仅仅指自然界具体的环境，而是高度抽象的，与具体的任务相关。图
    4-1 左边的机器人（智能体）一直在与图 4-1 右边的环境进行交互，这个过程可以描述为一个序列决策（Sequential Decision Making）过程。智能体把它的动作输出给环境，环境取得这个动作后会进行下一步，把下一步观测到的状态与这个动作带来的奖励返还给智能体。其中，状态指智能体当前在环境中所处的状况。强化学习是一个动态的、不断进行的过程，智能体执行动作会导致所处的环境以及自身状况不断地改变，状态是环境与状况的抽象。而动作是智能体面对特定状态时所能做出的行动，这个行动会改变智能体所处的环境，使智能体从前一个状态转移到另一个状态。这样的交互会产生很多观测，智能体的目的是从这些观测之中学习到能最大化奖励的策略。这个交互过程可以通过马尔可夫决策过程（Markov
    Decision Process，MDP）来表示，即在控制过程中，其未来状态的条件概率仅依赖于当前状态与所采取的动作。目前，基于学习的人形机器人控制方法多以马尔可夫决策过程作为基础框架。


    ```

    p(s_{t+1}|s_t,a_t,\cdots,s_0,a_0) = p(s_{t+1}|s_t, a_t) \quad (4-1)

    ```


    其中，S = {s0、⋯、si} 为状态空间，其中的每个状态都是对对应时刻世界的完整描述。A = {a0、⋯、ai} 为动作空间，表示各个时刻所选取动作的集合。t
    = {0、⋯、i} 为时间步。通俗理解中，马尔可夫决策过程表示了未来发生的事情仅由当前的状态以及现在和未来所做出的动作决定。也可以理解为当前的状态信息中已经包含了足够的过去的信息，未来发生的事情已经不受过去影响了。在这种基础假设下，就可以根据当前的机器人状态进行控制，以使机器人未来实施期望的动作。值得注意的是，状态是对世界的完整描述，不会隐藏世界的信息。观测是对状态的部分描述，可能会遗漏一些信息。在深度强化学习中，几乎总是用实值的向量、矩阵或者更高阶的张量来表示状态和观测。


