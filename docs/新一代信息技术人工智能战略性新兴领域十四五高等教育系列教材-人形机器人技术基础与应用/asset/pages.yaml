    \( q \in R^3 \)。假设当前的任务是控制机械臂末端跟踪期望平面位置轨迹 \( (x, y) \)，任务空间维度也即 \( x \in R^2 \)。由于机械臂有
    3 个自由度，大于任务空间维度，在机械臂工作空间范围内可以很好地完成末端控制任务。现在引入第二个任务，期望机械臂的第一个关节角 \( q_1 \) 保持固定大小。机械臂末端位置的跟踪和关节角的跟踪有可能会互相冲突，出现冲突时无法求解控制任务。可以引入机器人全身控制的思想，对控制任务进行分层，这里将末端位置控制任务作为第一优先级，关节角控制任务作为第二优先级。在优先完成高优先级控制任务的前提条件下，尽可能完成低优先级控制任务；换句话说，当末端位置跟踪任务和关节角控制任务不互相冲突时，全身控制器能够同时处理这两个控制任务；当关节角控制任务影响到了平面位置跟踪时，则优先保证末端位置的控制效果。接下来给出全身控制的具体数学实现方法。


