  md: '用记忆池中存储的数据对神经网络进行更新，求出网络更新所需的 Loss 函数。考虑到在 DQN 中神经网络的作用是生成各种状态动作对的 Q 值，也就是各种状态动作对能获得的当前及未来能获得的奖励的最大值的总和。又考虑到不能花费过长时间去获取奖励，因此引入折扣因子
    \(\gamma\) 来对未来的奖励进行惩罚。又因为未来无限长时间内的奖励值难以获取，所以 DQN 用下一时刻最大的 Q 值代替未来能获得的奖励的最大值的总和。最终，得到了神经网络目标为


    \(y_j = \left\{ \begin{array}{ll} r_j & \text{当周期在下一状态步终止时} \\ r_j + \gamma \max_{a''}
    \hat{Q}(\phi_{j+1}, a''; \theta^-) & \text{其他情况} \end{array} \right.\) (4-6)


    式中，当周期在下一状态步终止时，没有未来的奖励，其当前 Q 值就应为奖励值；在其他情况下，其 Q 值应为当前获取的奖励以及表示“未来最好情况下能获得的奖励”，即
    \(\max_{a''} \hat{Q}(\phi_{j+1}, a''; \theta^-)\)。注意：这里使用了目标网络的参数而非评估网络参数进一步打断了学习过程的数据相关性。那么，此时训练评估网络的一条样本就有了，即
    \((s_j, a_j, r_j, s_{j+1}, y_j)\)，这样的样本被不断地加入经验池中，后面的工作就是监督学习的范畴了，即不断从经验池中取数据，采用最小化时序差分（Temporal
    Difference，TD）误差方法，优化 \(y\) 与评估预测值之间的损失函数，即


    \(Loss = [y_j - Q(s, a; \theta)]^2\) (4-7)


    优化目标为让深度神经网络能够准确地估计所有状态动作对的 Q 值，在使用中应用评估网络评估所用状态动作对的 Q 值，从中选取 Q 值最高的动作即可在任务中获取最多的奖励。


    # 2. 策略梯度算法


    可以看到，以上算法使用深度神经网络将当前状态所有的动作对应的 Q 值生成出来，再从中选取 Q 值最高的动作执行，通常将这类算法称为基于值的算法。这类算法通常有两个问题：①更适合应用于离散动作输出的任务，对于连续动作运动来说，同时生成所有可能的动作
    Q 值是不现实的；②不适合用于生成需要随机策略的任务，因为神经网络生成的 Q 值中，总会有一个动作的 Q 值是最大的，但在类似拳击游戏的任务中，最优策略不是生成石头剪刀布中的某种动作，而是以
    1/3 的概率随机生成三种动作。


    在策略梯度（Policy Gradient，PG）算法中，动作不再根据该状态动作对的 Q 值来挑选，而是由一个单独的神经网络来生成，该神经网络通常被称为动作网络或策略网络。它根据自身参数与当前状态输出动作的概率分布。考虑到非确定性环境中状态转移概率的存在（即固定的状态与动作导致的下一时刻的状态不是确定的，而是呈一定概率分布），这种策略使得在执行任务中一个周期内的动作序列
    \(\tau\) 的发生概率为


    \(p_\theta(\tau) = p(s_1)p_\theta(a_1|s_1)p(s_2|a_1, s_1)p_\theta(a_2|s_2)p(s_3|a_2,
    s_2)\cdots = p(s_1)\prod_{t=1}^T p_\theta(a_t|s_t)p(s_{t+1}|a_t, s_t)\) (4-8)


    对于一个完整的 \(\tau\) 序列，在整个游戏期间获得的总的奖励用 \(R(\tau)\) 来表示。对于给定参'
