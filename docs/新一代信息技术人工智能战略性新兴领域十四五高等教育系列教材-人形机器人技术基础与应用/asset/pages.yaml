  md: '树的形式表示，如图 2-16 所示，圆点表示支链的局部根连杆，圆圈表示关节。骨盆连杆是树的全局根连杆，它通过一个虚拟的 6 自由度关节连接到地面。这种连接表达了这样一个事实：机器人有一个“浮动基底”，即基座连杆像自由刚体一样在
    3D 空间中移动。然后根连杆分支到两条腿和躯干。躯干本身代表一个局部根连杆，并分支到两个手臂和头部。手臂末端是手，手分支到手指。仿人机器人的生成树，表示的是只有全局根连杆连接到地面的情况。然而，通常的情况是一个或多个其他连杆也可以连接到地面，例如，在安静的站姿时，两只脚通过临时接触关节连接到地面。这样在运动链内就形成了闭环。由于这个原因，仿人机器人的运动链被认为具有结构不断变化的特征。


    在图 2-15 中，三个参考坐标系扮演着特殊的角色。参考坐标系 {W} 与固定连杆（地面）相连，代表惯性坐标系。参考坐标系 {B} 固定在基座（根）连杆上。参考坐标系
    {T} 连接到躯干连杆上，作为手臂和头部支链的“局部”根。还有另一类具有特殊作用的坐标系，即那些连接到树结构中的末端连杆（终端连杆）的坐标系。实际上，机器人主要通过其末端连杆与环境相互作用。例如，手指需要被控制用来抓取和操作小物体。手被认为是手臂支链的末端连杆，同样需要被控制以抓取、放置小物体并操作较大的物体。然后，控制脚实现运动。最后，控制头部来获得适当的视野。在本书中，主要着眼于脚的运动和手臂的操作，特别强调脚
    (F) 和手 (H) 的运动分析及控制。相应的坐标系表示为 {ej}，其中，e ∈ {F, H}， j ∈ {r, l}， r 和 l 代表右侧和左侧。


