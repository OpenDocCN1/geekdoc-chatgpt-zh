    # 1.2.2 国内发展现状


    国内人形机器人的研发工作起步较晚。自 1985 年以来，多所高校相继开展了这方面的研究，并取得了一定的成果。


    国防科技大学较早在人形机器人领域取得了重要研究成果，在 20 世纪末研制出了我国首台类人型双足步行机器人“先行者”，如图 1-10 所示。“先行者”身高为
    1.4m，体重为 20kg，具备前进、后退、侧行、转弯及手臂前后摆动等多种基本步态。随后研发的 Blackmann 人形机器人具有 36 个自由度，最快步行速度可达
    1km/h。之后研发的液压驱动双足机器人的轨迹规划和运动控制技术，使机器人最大前进速度达到了 2.5m/s。


    哈尔滨工业大学一直致力于研制 HIT 系列人形机器人。HIT WLR 人形机器人采用轮腿复合方式，以液压驱动为主，具备轮式快速移动的特点，最高速度超过了 15km/h。其腿部设计允许机器人跳跃越过
    0.5m 高的障碍物，并能够通过斜坡和起伏地形，还具备一定的搬运能力。其后研制的类似 Atlas 的液压驱动双足机器人 HIT Humanoid（图 1-11）重量为
    60kg，身高为 1.6m，拥有 21 个自由度，展示了高度的灵活性和运动能力。


    北京理工大学自 2000 年开始人形机器人研究，在国内首次实现了无外接电缆的独立行走，并在稳定行走和复杂运动规划等关键技术上取得了重要进展。其研制的汇童 BHR-6
    型机器人（图 1-12）身高为 1.65m，体重为 55kg，拥有 26 个自由度，能够完成走、跑、跳等一系列精细动作。该机器人的奔跑速度可达 7km/h，跳跃高度为
    0.5m，双足原地跳跃距离可达 1m，能够自主攀登 20cm 高的楼梯，并跨越 30cm 高的障碍物。


    国内其他高校和科研院所，如清华大学、浙江大学、上海交通大学、山东大学、北京航空航天大学、北京工业大学，以及中科院自动化所、中科院合肥物质科学研究院等，也在人形机器人技术方面进行了大量研究，推动了我国人形机器人技术的持续发展。


    近年来，我国的人形机器人在国家科技政策的支持下取得了快速发展，在人形机器人工程技术层面上已经走在了世界前列，涌现出以杭州宇树科技有限公司（简称宇树科技）为代表的一批优秀的机器人研发企业。图
