    \boldsymbol{x}^{(p_r^s)}(t_0), t_0^{(p_r^s)}; \boldsymbol{s}^{(p_r^s)})=0 \quad
    (p_i, p_r \in [1, \cdots, P], s=1, \cdots, L) \quad (9-46)\)


    式中，\(\boldsymbol{x}^{(p)}(t) \in \mathbf{R}^{n_p}\)、\(\boldsymbol{u}^{(p)}(t)
    \in \mathbf{R}^{m_p}\)、\(\boldsymbol{s}^{(p)} \in \mathbf{R}^{s_p}\)、\(t \in \mathbf{R}\)
    分别为不同阶段 \(p \in [1, \cdots, P]\) 机器人的状态量、控制量、静态参数以及时间；\(n_p\)、\(m_p\)、\(s_p\)
    分别为 \(p\) 阶段状态量、控制量和静态参数的个数；\(L\) 为连接约束的个数；\(p_i^s \in [1, \cdots, P](s=1, \cdots,
    L)\) 和 \(p_r^s \in [1, \cdots, P](s=1, \cdots, L)\)，分别为连接约束的左右两边的阶段编号。


    # 2. 平面模型


    在机器人跳跃动作中，运动轨迹在矢状面上呈现对称性。基于这一特性，只需采用平面全身动力学模型进行研究，从而避免三维全身动力学模型所带来的复杂计算性。在跳跃过程中，主要的能量产生关节包括
    hip_pitch、knee_pitch、ankle_pitch、shoulder_pitch 及 elbow_pitch。因此，可以使用图 9-21 所示的平面模型进行分析。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_267_0.png)


    图 9-21 宇树 G1 人形机器人失联面示意图与平面简化模型


    定义机器人的广义坐标、广义速度和关节力矩分别为


    \(\boldsymbol{q} = (x; z; \boldsymbol{q}_{base}; \boldsymbol{q}_{hip}; \boldsymbol{q}_{knee};
    \boldsymbol{q}_{ankle}; \boldsymbol{q}_{shoulder}; \boldsymbol{q}_{elbow}) \\

    \dot{\boldsymbol{q}} = (\dot{x}; \dot{z}; \dot{\boldsymbol{q}}_{base}; \dot{\boldsymbol{q}}_{hip};
    \dot{\boldsymbol{q}}_{knee}; \dot{\boldsymbol{q}}_{ankle}; \dot{\boldsymbol{q}}_{shoulder};
    \dot{\boldsymbol{q}}_{elbow}) \\

    \boldsymbol{\tau} = (\tau_{hip}; \tau_{knee}; \tau_{ankle}; \tau_{shoulder}; \tau_{elbow})
    \quad (9-47)\)


    根据运动学方程，可以计算出每个连杆的质心位置、速度、姿态和角速度，从而得出机器人的总动能（平动和转动）和总势能。然后，利用拉格朗日方程计算出机器人平面动力学模型中的质量矩阵
    \(\boldsymbol{H}\)、非线性项 \(\boldsymbol{c}\)、选择矩阵 \(\boldsymbol{S}\)。根据脚掌的几何信息，还可以计算出脚尖和脚后跟的雅各比矩阵
    \(\boldsymbol{J}_{toe}\)、\(\boldsymbol{J}_{heel}\)。通过这些雅各比矩阵，可以将脚掌与地面的平面接触简化为脚尖与脚后跟的接触，从而描述机器人在跳跃过程中与地面的作用力。


    # 3. 构建优化问题


    完整的跳跃过程可以分为起跳阶段、腾空阶段、落地阶段三个阶段。在起跳阶段，机器人通过关节力矩产生足够的垂直和水平推力，实现离地。在腾空阶段，机器人在空中飞'
