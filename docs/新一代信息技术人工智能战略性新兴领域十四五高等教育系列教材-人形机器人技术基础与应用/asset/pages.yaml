  md: '点阵）会因物体表面的几何形状产生畸变的原理，通过不同视角的相机捕捉物体表面反射的光模式，并根据畸变进行计算出每个点在空间中的坐标。③深度相机。常见深度相机技术包括红外结构光和飞行时间（Time
    of Flight，ToF）技术。其中，飞行时间技术通过测量光脉冲从相机发射到反射回来的时间差，来计算物体与相机之间的距离。④摄影测量。通过多视角的二维图像进行重建，利用图像的重叠区域进行匹配与视差计算生成点云。


    点云具有三个重要的属性：①无序性。与二维图像中的像素不同，三维点云是一组没有特定顺序的点，其描述的点的空间分布不随点的顺序改变而改变。即，对于一个含有 N
    个点的点云，其 N! 种排列方式是等价的。②稀疏性。点云中点的分布不是均匀密集的，而是在空间中呈不均匀分布，不同空间区域内点的密度不同。点云的稀疏性可能由多种因素引起，包括采集设备的限制、几何对象的表面特性等。③变换不变性。对于表示某个几何对象的点云，在平移、旋转、缩放等变换操作后，不影响对该几何对象的特征描述，这是因为点的坐标与属性与该几何对象的坐标系无关，只与对象本身的形状和位置相关。


    # 7.3.2 三维点云处理技术基础


    因为三维点云数据的特殊性，所以传统的点云特征编码方法通常依赖几何和统计属性来描述点云的局部或全局信息，如点特征直方图、正态分布变换等。为了利用三维 CNN
    等深度学习技术对无序的点云数据进行特征编码，VoxNet 将三维点云进行了体素化转换为三维体素占用网格，并使用三维卷积网络处理体素数据。


    VoxNet 首先将输入的三维点云数据转换为三维体素占用网格。这个网格在空间上是均匀划分的，每个体素单元包含有关点云存在与否的信息，通常表示为二进制（存在或不存在）或实数值（表示点的密度或概率）。然后使用三维卷积层来处理体素化的数据。这些卷积层可以捕捉三维数据中的局部结构信息，并从体素网格中提取特征。三维卷积层后面通常会跟着池化层（如最大池化），以减少数据的空间维度和参数数量。


    不同于 VoxNet 对输入三维点云进行体素化编码，PointNet 无须对点云进行体素化。PointNet 能够直接处理原始的点云数据，可以有效处理点云数据的无序性和变换不变性。图
    7-16 所示为 PointNet 基本结构。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_196_0.png)'
