    # 3. 逆微分运动学


    运动学控制经常用于仿人机器人。这种类型的控制是基于正运动学和逆运动学问题的微分运动关系。后者定义为：给定关节角度和末端连杆的空间速度，求各关节的运动速度。为了以简单直接的方式找到解，必须满足以下两个条件：


    +   1) 支链构型 $\theta$ 的雅可比矩阵应为满秩。

    +   2) 支链的关节数应该等于末端连杆的自由度数。


    这些条件表明雅可比矩阵的逆存在。例如，肢体支链（手和脚）的每个末端连杆的最大自由度数是 6。因此，根据上述条件，$r(J(\theta))=6$ 并且 $n=6$。对于点接触抓取中使用的手指支链，这个条件意味着
    $r(J(\theta))=3$，因此，$n=3$。在不失普遍性的情况下，考虑前者的情况。


    当满足条件时，求解关节速度的式 (2-81) 会得到以下逆运动学问题的解，即


    ```

    $\dot{\theta} = J(\theta)^{-1}\mathcal{V}$

    ```


    产生满秩雅可比矩阵的支链构型称为非奇异构型。符合第二个条件的具有多个关节的支链称为运动学非冗余支链。


    当上述两个条件中的任何一个不能满足时，需要小心处理逆问题。实际上，存在特殊支链构型的 $\theta_s$，其雅可比矩阵不满秩，即 $r(J(\theta))<6$。这种构型称为奇异构型。无论其关节的数量如何，支链都可以获得奇异构型。此外，当支链包含的关节数多于其末端连杆的自由度
    ($n>6$) 时，则式 (2-81) 是欠定的。这意味着关节速率存在无穷多个逆运动学解。在这种情况下，支链称为运动学冗余支链。


    通过对式 (2-81) 进行时间微分来获得正问题的二阶（加速度级）微分运动学，即


    ```

    $\dot{\mathcal{V}} = J(\theta)\ddot{\theta} + \dot{J}(\theta)\dot{\theta}$

    ```


    然后，相应逆问题的解表示为


    ```

    $\ddot{\theta} = J(\theta)^{-1}(\dot{\mathcal{V}} - \dot{J}(\theta)\dot{\theta})$

    ```'
