  md: '在惯量匹配的前提下，应尽量减少惯量；结构自身中心对称，以保证轴的静平衡和动平衡。另外，还要注意关键部位同轴度设计需求和加工装配工艺性，整体结构布局合理性和紧凑性。


    在设计与加工方面，若须考虑装配工艺性等限制因素，可对轴进行分段设计；若对轴整体精度有较高要求，可对轴进行整体加工。本示例主要体现了分段设计与整体加工，可有效保证轴的定位精度及动力传递的强度。


    # 8.5 系统集成机构设计


    # 8.5.1 机器人系统构成


    人形机器人的系统集成机构设计，既要考虑需实现的运动和作业功能，也要考虑机械和电气系统的实现和布局方案，如传感系统的布局方案、动力系统的配置及零部件的加工与组装等多方面的设计要求。机器人系统构成如图
    8-14 所示。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_228_0.png)


    图 8-14 机器人人系统构成


    +   1) 执行机构，包括腿部、手部、腕部、臂部、腰部和基座等，相当于人的肢体。

    +   2) 驱动装置，包括驱动源、传动机构等，相当于人的肌肉、筋络。

    +   3) 感知反馈系统，相当于人的感官和神经，包括内部传感器和外部传感器。内部传感器，用于检测位置、速度等；外部传感器，用于检测机器人所处的环境信息。

    +   4) 控制系统，包括处理器及关节伺服控制器等，用于进行任务及信息处理，并给出控制信号，相当于人的大脑和小脑。


    面向不同的需求设计，除了机构系统，人形机器人控制系统的设计也是机器人设计的重要组成部分。其基本功能如下：


    +   1) 记忆功能，存储作业顺序、运动路径、运动方式、运动速度和与生产工艺有关的信息。

    +   2) 示教功能，离线编程、在线示教、间接示教。在线示教包括示教盒和导引示教两种。

    +   3) 与外围设备联系的功能，输入和输出接口、通信接口、网络接口、同步接口。

    +   4) 坐标设置功能，有关节、绝对、工具、用户自定义四种坐标系。

    +   5) 人机接口，示教盒、操作面板、显示屏等接口。

    +   6) 传感器接口，位置检测、视觉、触觉、力觉等传感器的接口。

    +   7) 位置伺服功能，机器人多轴联动、运动控制、速度和加速度控制、动态补偿等。'
