- pgno: 135
  md: '建与之一致的环境地图。解决 SLAM 问题被认为是移动机器人领域的关键，因为它为机器人提供了真正实现自主导航的手段，并成为研究的热点。


    在导航过程中，许多场景无法预先拥有环境地图，即使室内环境有建筑平面图，由于摆设和家具的存在，地图与平面图之间仍存在差异。构建各个场景的地图可使机器人具备环境适应性，因此地图构建是自主机器人的重要组成部分。然而，准确构建地图受到多个因素的制约，主要包括以下几个方面：


    +   (1) 定位与地图构建同时进行 机器人移动时，其里程计会逐渐积累误差，导致位置的不确定性增加，最终可能丢失自身的位置信息。构建地图的同时，还需要确定机器人相对于地图的位置，而在没有初始地图和精确姿态信息的情况下，同时实现这两个目标是非常困难的。


    +   (2) 多维度空间 地图在连续的空间中定义，因此具有无限多个维度。即使在离散逼近的情况下，如网格逼近，地图也可能具有高达 10^5 甚至更多变量的超高维空间。这种高维空间使得计算完整的后验概率变得非常具有挑战性。


    +   (3) 大范围建图 相对于机器人的感知范围来说，环境范围越大，地图构建越困难。


    +   (4) 传感器和执行器噪声 噪声会增大误差，因此噪声越大，地图构建越困难。如果机器人的传感器和执行器没有噪声，则地图构建将变得相对简单。


    +   (5) 感知模糊 机器人是通过传感器感知世界的，在一些非常相似的地方，传感器数据可能非常接近，导致机器人很难判断自身是否在运动。


    +   (6) 闭环检测 构建具有闭环的环境地图非常困难。当机器人完成一个闭环并返回起点时，由于里程计的误差，构建的地图很可能不闭合，从而导致闭环误差与地图的不一致。


    # 5.1.2 定位技术


    定位是确定机器人相对于给定环境地图的姿态的问题，常被称为位置估计。定位技术是机器人感知中最基本的问题，几乎所有的机器人任务都需要知道自身的位姿。


    移动机器人的定位可以看作是一个坐标变换问题。地图是在全局坐标系下描述的，而机器人自身的坐标系与之无关。因此，定位问题可以描述为建立全局坐标系与机器人自身坐标系之间的对应关系。通过这种坐标变换，机器人可以在自身坐标系下描述周围环境的位置，这是导航任务的前提。


    由于传感器不可能无噪声地进行测量，机器人的位姿必须通过充满噪声的数据进行推测。此外，单一传感器通常无法准确确定机器人的位姿，如激光雷达很难识别走廊环境。


    根据初始位姿是否已知以及周围环境的性质可以将定位问题分为四个维度：


    +   (1) 局部定位与全局定位 已知初始位姿的定位问题被称为“位姿跟踪”，其不确定性仅限于运动过程中产生的误差，局限于机器人真实位姿附近的区域。初始位姿未知的问题被称为“全局定位”，机器人需要进行位姿跟踪并确定相对于地图的初始位姿。机器人在运动过程中可能面临“绑架问题”，即突然被带到其他位置，导致机器人可能误认为自己位于错误的位置。“绑架问题”常被用来评估定位算法在全局定位失败时的恢复能力。


    +   (2) 静态环境与动态环境下的定位 静态环境表示除了机器人以外没有其他动态物体存在。动态环境则表示除了机器人自身运动外还存在许多其他变化，如人、可移动家具'
  merge: -1
  img_proc: true
- pgno: 136
  md: '或门等。在动态环境中的定位更加复杂。（3）主动与被动定位 被动定位中的机器人的运动由其他模块控制，定位模块仅通过观察周围环境来确定自身位姿。主动定位中的定位模块通过控制机器人的运动方式来主动地降低定位误差和定位成本。（4）单一或多个机器人定位
    单一机器人定位是最普遍的情况，定位过程只需要机器人获取传感器数据即可完成。多个机器人定位不仅包括单一机器人定位，还需要考虑多个机器人之间的交流和彼此的定位。这四个维度描述了机器人定位问题的四个最重要特征，当然还有其他特性会使定位问题变得更加复杂，如对称环境中的定位。定位可以采用多种方式进行，包括
    GPS、航位推算、基于测距传感器（如超声波、声呐、激光雷达等）的定位、基于视觉的定位、基于射频技术（如 RFID、蓝牙和 Wi-Fi 等）的定位等。


    # 5.1.3 路径规划技术


    路径规划是移动机器人导航中的关键问题，其目标是计算出一条满足机器人运动学约束、避免与障碍物碰撞的最佳路径。在路径规划过程中，考虑到地图的准确性和完整性问题，根据对环境信息的把握程度可把路径规划划分为基于先验完全信息的全局路径规划和基于传感器信息的局部路径规划。其中，从获取障碍物信息是静态或是动态的角度看，全局路径规划属于静态规划，局部路径规划属于动态规划。


    全局路径规划需要掌握所有的环境信息，根据环境地图的所有信息进行路径规划。在全局路径规划中，主要有以下几种常用的方法：


    +   (1) Dijkstra 算法 Dijkstra 算法是一种经典的最短路径算法，通过以起始点为中心，逐层向外扩展的方式，不断更新节点之间的最短路径，从而找到起始点到目标点的最短路径。该算法可以找到最优路径，但搜索空间较大，时间复杂度高。


    +   (2) A* 算法 A* 算法是一种启发式搜索算法，综合考虑实际距离和启发式估计距离，能够高效地搜索出起始点到目标点的最短路径。A* 算法通过定义一个启发式评价函数，根据该函数计算出每个节点的估计代价，从而进行有导向性的搜索。相比于
    Dijkstra 算法，A* 算法在搜索时间和空间复杂度上更为高效。


    局部路径规划只需要由传感器实时采集环境信息，了解环境地图信息，然后确定所在地图的位置及其局部的障碍物分布情况，从而可以选出从当前结点到某一子目标节点的最优路径。常用的局部路径规划算法如下：


    +   (1) 动态窗口法（DWA） DWA 将机器人的速度和加速度限制在一个搜索窗口范围内，通过对每个速度和加速度进行评分，选择得分最高的组合来确定机器人的下一步移动。该算法能够实时避免与障碍物的碰撞并生成安全可靠的路径。


    +   (2) 人工势场法 人工势场法基于引力和斥力原理，在机器人与障碍物之间设置人造的引力场和斥力场，通过调节这些场的参数，使机器人在避开障碍物的同时朝目标点移动。然而，人工势场法可能存在局部最小问题和在狭窄通道中摆动的缺点。


    除了传统的路径规划算法，还有一些新颖的智能算法被引入到机器人导航中，如蚁群算法、神经网络等。这些算法通过模拟自然界的行为和使用机器学习等技术，可以更好地适应复杂环境的导航需求。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 5.2 SLAM


    有了对人形机器人导航技术初步的认识，本节会对 SLAM 相关内容进行较为详细的展示。机器人定位、导航与建图是现代机器人技术中不可或缺的核心组成部分。它们共同为人形机器人提供了在未知或复杂环境中自主运动与完成任务的能力。为了更好地理解这三项技术，可以通过一个实际案例来深入探讨。


    以智能仓储机器人为例，它需要在仓库内自主完成货物的搬运和存储任务。在这个过程中，定位与建图技术起到了关键作用。智能仓储机器人通过搭载激光雷达等传感器，能够实时感知周围环境，并根据感知到的数据构建出仓库的地图。这张地图不仅包含了仓库的几何结构，还包含了货物的摆放位置等信息。有了这张地图，机器人就能够精确地定位自身位置，并规划出最优的行驶路径，实现高效的货物搬运。


    SLAM 系统的框架图如图 5-2 所示。以视觉 SLAM 为例，系统的开始是通过相机收集图像数据。然后，视觉里程计利用连续帧之间的特征匹配，来估计相机的位置和姿态，从而实现对局部区域的地图构建。这一步是局部导航和探索的基础，但由于各种原因（如传感器误差和环境变化），仅靠视觉里程计得到的数据可能会有误差。为了提高定位和地图精度，SLAM
    系统引入了后端优化。后端优化通过调整测量到的位置和姿态信息，对地图进行更新和优化，以减少累积误差并提高系统的整体准确性。同时，建图模块负责维护和更新全局地图，这对于机器人进行长期导航和环境理解至关重要。SLAM
    的数学建模是其核心，主要分为基于滤波器的方法和基于非线性优化的方法。最初，基于滤波器的模型（如卡尔曼滤波）在 SLAM 领域占据主导地位，因为它们能有效地处理传感器噪声和估计不确定性。然而，随着技术的进步和对更高精度需求的增加，基于非线性优化的方法开始受到更多青睐。这种方法通过优化所有观测数据的整体一致性来提高系统的精确度和鲁棒性。SLAM
    系统的另一个关键组成部分是回环检测，它使得系统能够识别之前已经访问过的地方。通过识别这种“回环”，SLAM 系统可以形成闭环轨迹，对累积的定位误差进行校正。这是减少长期导航中轨迹漂移的有效方法，保证了地图的一致性和准确性。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_137_0.png)


    # 5.2.1 SLAM 的基础知识


    SLAM 指机器人或自主移动系统在未知环境中同时完成自身定位和地图构建的过程。SLAM 是机器人领域中的一个重要问题，也是实现自主导航和环境感知的关键技术之一。简单来说，SLAM
    的目标是使机器人在未知的环境中实现自主移动，同时实时获取自身的位置信息，并构建出周围环境的地图。这个过程可以分为两个主要部分：'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   (1) 定位（Localization） 定位指机器人确定自身在已知地图中的位置的过程。机器人使用传感器（如激光雷达、相机、惯性测量单元等）数据来估计自身的位置，并将其与已知地图进行匹配，从而确定当前位置。


    +   (2) 建图（Mapping） 建图指机器人根据摄像头或者激光雷达等传感器的数据，在未知环境中构建地图的过程。机器人通过观测周围环境，利用 SLAM
    算法将这些观测数据整合起来，逐步生成环境的地图。


    在自主移动机器人、无人驾驶车辆、无人机等领域，SLAM 技术有着广泛的应用，为这些系统在复杂环境中实现自主导航和感知提供了重要支持。根据所用传感器的不同，SLAM
    方法可以大概划分为激光 SLAM 和视觉 SLAM 两种。这两种不同的 SLAM 方法各有优缺点和对应的应用场景。


    激光 SLAM 主要利用激光雷达传感器进行环境感知和地图构建。激光雷达通过发射激光束并接收反射的激光光量到物体的距离，从而获取周围环境的三维点云数据。激光
    SLAM 的核心是利用这些点云数据进行定位和建图，其整个过程大致可以划分为以下几步：


    +   1) 数据采集：激光雷达扫描周围环境，获取高精度的距离信息，生成点云数据。

    +   2) 特征提取与匹配：从点云中提取特征点，并在连续的扫描中进行匹配，以估计机器人相对于环境的运动。

    +   3) 位姿估计：通过匹配的特征点，使用 ICP（Iterative Closest Point，最近点迭代算法）等算法来计算机器人的位姿。

    +   4) 地图构建：将每次扫描的数据合并，逐步构建出二维或三维的环境地图。

    +   5) 闭环检测与优化：检测机器人是否回到之前的位置，并通过图优化算法来修正累积误差，优化整个地图和轨迹。


    得益于激光雷达能够提供高精度的距离测量，激光 SLAM 具有精度高的优点，另外激光雷达一般不会受到光照条件的影响，因此激光 SLAM 在不同光照条件的环境中都具有较好的鲁棒性。随着相关技术的不断进步，激光雷达的市场价格也在不断降低，激光
    SLAM 这一技术方案的所需成本也在逐渐降低。因此，目前不少成熟的移动机器人产品都采用了激光 SLAM 作为主要的定位与建图方案，如常见的室内扫地机器人、仓储机器人等。


    视觉 SLAM 利用摄像头获取环境的视觉信息，进行定位和建图。它通常使用单目、双目或 RGB-D 激像头，通过图像处理和计算机视觉技术，提取和跟踪特征点，实现位姿估计和地图构建。其整个过程大致可以划分为以下几步：


    +   1) 数据采集：摄像头捕捉环境图像，获取视觉信息。

    +   2) 特征提取与匹配：使用 ORB（Oriented FAST and Rotated BRIEF）等特征提取算法从图像中提取特征点，并在连续的图像中进行匹配。

    +   3) 位姿估计：通过匹配的特征点，使用 PnP（Perspective–n–Point）算法或 VO（Visual Odometry，视觉里程计）估计相机的位姿变化。

    +   4) 地图构建：将位姿估计结果和特征点结合，逐步构建环境的稀疏或稠密点云地图。

    +   5) 闭环检测与优化：检测相机是否回到之前的位置，并使用图优化算法来修正累积'
