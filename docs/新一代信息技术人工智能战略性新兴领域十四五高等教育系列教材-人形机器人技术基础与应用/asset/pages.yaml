  md: '时的初始条件高度敏感，许多策略都会导致失败。因此，智能体不太可能遇到成功置空的状态，也永远不会发现动作可以获得高的奖励状态。对于引用状态初始化，智能体在训练的早期阶段就会立即遇到这种有希望的状态。与仅通过奖励函数从参考运动中获取信息不同，引用状态初始化可以被解释为一个额外的通道，通过该通道，机器人可以以更有信息的初始状态分布的形式从参考运动中获取信息。重置参考动作如图
    4-19 所示。


