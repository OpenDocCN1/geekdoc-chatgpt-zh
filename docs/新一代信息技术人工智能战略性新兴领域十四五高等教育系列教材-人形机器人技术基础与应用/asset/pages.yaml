  md: '如果选择式 (2-29) 给出的 $\theta$ 值，那么 $\sin\theta > 0$，并且


    $$\phi = \text{Atan2}(r_{13}, r_{23}) \tag{2-31}$$


    $$\psi = \text{Atan2}(-r_{31}, r_{32}) \tag{2-32}$$


