    # 5. 软件工具


    人形机器人行走和站立控制算法涉及在线计算多刚体动力学、运动学、二次规划求解等。依托开源社区的发展，目前可以利用开源工具开发算法。这里介绍动力学、优化问题构建和二次规划求解的相关工具。


    Pinocchio 是一个用于高效计算机器人模型或任何多连杆刚体模型动力学（及其导数）的库。Pinocchio 是计算多连杆刚体动力学最有效的库之一。它实现了根据
    Featherstone 于 2008 年提出的经典算法，并引入了一些这些算法的高效变体和一些新的算法，特别是包括一整套计算主要算法导数的算法。Pinocchio
    是开源的，主要用 C++ 编写，并提供 Python 接口，具有伯克利软件分发（Berkeley Software Distribution，BSD）许可证。


    CasADi 是一个用于数值优化的符号框架，能够在稀疏矩阵值计算图上实现正向和反向模式的自动微分。它支持生成 C 代码，并能直接调用如算子分裂法二次规划求解器（Operator
    Splitting Quadratic Programming，OSQP）、内点法最优化求解器（Interior Point Optimizer，IPOPT）等优化求解器。它支持
    C++、Python 或 Matlab 等编程语言。


    OSQP 是一个用于二次规划求解的优化求解器。它使用 C++ 编写并提供 Python 接口，底层采用 ADMM 算法。


    以人形机器人控制为例，可以用 Pinocchio 计算机器人动力学方程，然后用 CasADi 构建二次规划问题，最后调用 OSQP 进行求解。


