  img_proc: true
- pgno: 191
  md: '图像被分成 49 个小块。每个网格单元预测 B 个边界框和这些框的置信度分数。其中，置信度反映了该边界框内是否包含物体及边界框的确定性程度。每个边界框对应
    4 个值，包括中心点坐标（x，y）、宽度（w）、高度（h）和置信度分数。每个网格单元还预测 C 个类别概率，这些类别概率表示该网格单元包含各类别物体的概率。将置信度分数和类别概率结合起来，用于确定每个边界框的最终类别和置信度。例如，若某个边界框的置信度为
    0.8，而类别概率中“狗”这一类的概率为 0.7，则该边界框包含“狗”的最终置信度为 0.8 x 0.7=0.56。为了减少重复检测，YOLO 算法通过非极大值抑制（NMS）来移除冗余的边界框，只保留置信度最高的检测框和预测结果。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_191_0.png)


    图 7-11 YOLO 算法工作原理


    YOLOv1 在训练过程中采用以下损失函数，即


    ```

    \mathcal{L}_{loss} = \lambda_{coord} \sum_{i=0}^{S^2} \sum_{j=0}^{B} \mathbb{1}_{ij}^{obj}
    [(x_i - \hat{x}_i)^2 + (y_i - \hat{y}_i)^2] +\lambda_{coord} \sum_{i=0}^{S^2}
    \sum_{j=0}^{B} \mathbb{1}_{ij}^{obj} [(\sqrt{w_i} - \sqrt{\hat{w}_i})^2 + (\sqrt{h_i}
    - \sqrt{\hat{h}_i})^2] +\sum_{i=0}^{S^2} \sum_{j=0}^{B} \mathbb{1}_{ij}^{obj}
    (C_i - \hat{C}_i)^2 +\lambda_{noobj} \sum_{i=0}^{S^2} \sum_{j=0}^{B} \mathbb{1}_{ij}^{noobj}
    (C_i - \hat{C}_i)^2 +\sum_{i=0}^{S^2} \mathbb{1}_{i}^{obj} \sum_{c \in classes}
    [p_i(c) - \hat{p}_i(c)]^2

    ```


    式中，\(\mathbb{1}_{ij}^{obj}\) 用来表示检测网格内是否存在物体，若存在物体则 \(\mathbb{1}_{ij}^{obj} =
    1\)，反之 \(\mathbb{1}_{ij}^{obj} = 0\)。\(\mathbb{1}_{ij}^{noobj}\) 与 \(\mathbb{1}_{ij}^{obj}\)
    相反，若存在物体 \(\mathbb{1}_{ij}^{noobj} = 0\)，反之 \(\mathbb{1}_{ij}^{noobj} = 1\)。第一项代表中心坐标的均方误差
    MSE\(_{loss}\)，第二项对于高和宽利用了均方误差，增强模型对小尺度物体的敏感程度。其他三项误差均采用了 MSE\(_{loss}\)，并且采用超参数
    \(\lambda\) 来权衡训练中各项损失所占比重。


    YOLO 算法有多个版本，每个版本在架构和性能上都有改进。YOLOv1 作为 YOLO'
  merge: -1
  img_proc: true
- pgno: 192
  md: '系列的最初版本，使用 24 层卷积网络，最后由两个全连接层输出预测结果。YOLOv2 引入了批量归一化和锚框（ anchor boxes ），并允许更高的分辨率输入。YOLOv3
    改进了网络架构，采用了更深的骨干网络 DarkNet-53，同时采用了多尺度特征融合的策略。通过在网络中引入不同尺度的特征层，并利用特征金字塔结构来融合不同层次的语义信息，能够有效地检测各种尺度的目标。YOLOv4
    进一步优化了检测精度和速度，使用了 CSP Darknet-53 作为骨干网络，并引入了其他的检测优化技术。YOLOv5 虽然并非官方发布，但成为工程和实际应用中使用次数最多的
    YOLO 算法，具有更高效的检测性能和效率。除此之外，YOLO 系列算法通过不断改进网络结构和模型设计，如增加网络深度、使用更强大的特征提取器和采用更准确的预测策略，取得了更高的检测精度。


    YOLO 常用评价指标包括准确率（ accuracy ）、精度（ precision ）、召回率（ recall ）以及根据后两个指标算出的平均精度均值（
    mean Average Precision，mAP ）。准确率虽然不常用于评价目标检测任务，但在某些情况下可以作为辅助指标。准确率的计算公式为


    ```

    准确率 = \frac{\text{真阳性样本数量} + \text{真阴性样本数量}}{\text{全部样本数量}} (7-4)

    ```


    mAP 是目标检测中最常用的评价指标，用于衡量检测算法在多个类别上的综合性能。对于每一类目标，通过计算不同召回率下的精度并取平均值得到平均精度（ AP ）。对所有类别的
    AP 值求平均，即得到 mAP。其中，精度和召回率的计算公式为


    ```

    精度 = \frac{\text{真阳性样本数量}}{\text{真阳性样本数量} + \text{假阳性样本数量}} (7-5)

    ```


    ```

    召回率 = \frac{\text{真阳性样本数量}}{\text{真阳性样本数量} + \text{假阴性样本数量}} (7-6)

    ```


    # 7.2.5 目标追踪与状态估计


    # 1. 目标追踪算法简介


    目标追踪（ object tracking ）旨在从给定的视频序列中，根据初始帧中目标的位置或边界框，连续追踪目标对象在后续帧中的位置和状态。目标追踪任务示例，如图
    7-12 所示。算法需要通过分析目标的外观、形状和运动特征，结合环境背景的变化，实现目标位置的准确估计和跟踪。目标追踪任务可以分为单目标追踪（ Single-Object
    Tracking，SOT ）和多目标追踪（ Multi-Object Tracking，MOT ）两种形式，具体取决于追踪的对象数量。


