- pgno: 78
  md: '人形机器人的运动学参数和动力学响应。


    ZMP 轨迹的生成是步态规划中的关键步骤，它涉及以下几个方面：


    +   (1) 参考轨迹设计 理想的 ZMP 轨迹通常是一条平滑的曲线，确保它穿过或接近支撑脚的几何中心。


    +   (2) 轨迹优化 通过优化算法调整 ZMP 轨迹，以减少峰值转矩和力的需求，提高能量效率。


    用预测控制法进行人形机器人步态规划的主要思想是根据未来的 ZMP 参考轨迹得到当前的质心轨迹，使得到的质心轨迹对应的 ZMP 轨迹能较好地跟踪期望的 ZMP
    轨迹，从而使 ZMP 始终处于支撑范围内，得到稳定的运动。该方法的理论分析最初是在倒立摆模型上完成的。如图 3-5 所示的三维空间中的倒立摆模型，倒立摆由一个无质量的杆和一个质量为
    $m$ 的质心组成。杆的一端连接在坐标系的原点，质心的坐标为 $(x, y, z)$。在该模型上施加一个约束，使得质心只能在高度为 $z_c$ 的平面内运动，即保持
    $z = z_c$ 。该系统的动力学方程为


    ```

    $$\ddot{y} = \frac{g}{z_c}y - \frac{1}{mz_c}\tau_x$$

    ```


    ```

    $$\ddot{x} = \frac{g}{z_c}x + \frac{1}{mz_c}\tau_y$$

    ```


    式中，$g$ 为重力加速度， $\tau_x$、$\tau_y$ 分别为作用在系统上的相对于 $x$ 轴和相对于 $y$ 轴的力矩。


    对于这种三维倒立摆模型，系统 ZMP 坐标 $(p_x, p_y)$ 的表达式为


    ```

    $$p_x = \frac{\tau_y}{mg}$$

    ```


    ```

    $$p_y = \frac{\tau_x}{mg}$$

    ```


    将式（3-20）、式（3-21）代入式（3-18）、式（3-19），消去 $\tau_x$、$\tau_y$ ，可以得到


    ```

    $$\ddot{y} = \frac{g}{z_c}(y - p_y)$$

    ```


    ```

    $$\ddot{x} = \frac{g}{z_c}(x - p_x)$$

    ```


    式（3-22）、式（3-23）可以写为


    ```

    $$p_x = x - \frac{z_c}{g}\ddot{x}$$

    ```


    ```

    $$p_y = y - \frac{z_c}{g}\ddot{y}$$

    ```'
