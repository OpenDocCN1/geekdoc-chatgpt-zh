- pgno: 173
  md: '性基材组成。


    由于在人形机器人领域，触觉感知的需求场景最多，所以触觉传感器是目前研究最为广泛的一种电子皮肤。触觉传感器赋予人形机器人细腻的触觉感知能力，使其能够与环境进行更自然、更精细的交互。人形机器人触觉传感器主要分布在手部、足部乃至全身。由于装配区域为不规则三维表面，对传感器的柔性要求较高。要求触觉传感器具有良好的柔韧性、延展性，可自由弯曲或折叠，结构型式灵活多样，且在弯曲和伸展的形态下仍能表现出良好的导电性和响应性。为避免单个传感单元面积小、受力范围小，触觉传感器一般设计为柔性阵列式。


    触觉传感器的主要作用如下：


    +   1) 感知环境：使人形机器人能够感知周围环境，包括识别不同的物体、表面纹理和硬度。

    +   2) 精细操作：在执行精密任务（如拾取和搬运脆弱物品）时，触觉反馈至关重要。

    +   3) 人机交互：提高人形机器人与人类互动的自然性和安全性。


    触觉传感器根据信号转换原理可分为电容式触觉传感器、电阻式触觉传感器、压电式触觉传感器等，目前主要应用于人形机器人手指感知。


    1) 电容式触觉传感器。电容式触觉传感器由两个电极板和中间的电介质组成，如图 6-15 所示。受外力作用时，电容的电极板和电介质发生形变，导致两个电极板的正对面积或间距发生变化，从而引起电容值的改变。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_173_0.png)


    图 6-15 电容式触觉传感器的基本结构


    根据平行板电容公式可知


    ```

    C = \frac{\varepsilon_0 \varepsilon_r S}{d}

    ```


    式中，C 为平行板电容器的电容值； \(\varepsilon_0\) 为真空介电常数， \(\varepsilon_0 \approx 8.85 \times
    10^{-12} F/m\) ； \(\varepsilon_r\) 为两极板间电介质的相对介电常数，其数值大小根据介电层材料的变化而变化； S 为上、下两层电极板的重叠面积；
    d 为上、下两层电极板之间的距离。


    利用传感器电容值的变化，可以实现对外力的检测。电容式触觉传感器原理和结构较为简单，并且具有良好的频率响应、高灵敏度和较宽的动态范围，能够同时检测动态和静态接触。在检测多维力时，它可以依靠自身的结构特点完成解耦问题。但是电容式触觉传感器也存在着采集电路复杂、容易产生寄生电容等问题。


    2) 电阻式触觉传感器。电阻式触觉传感器是基于敏感材料的压阻效应来完成测力的，即利用敏感材料在受到压力时，其电阻率发生变化的现象来实现力的测量。电阻式触觉传感器的结构与外观如图
    6-16 所示，一般由 3 部分组成：敏感材料、电极和基底。电极位于敏感材料的两端，通过测量敏感材料的电阻值变化，便能检测施加在其上的压力大小。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/47a2b26fde9e2a8fab8f8289e100ee37_174_0.png)


    柔性阵列触觉传感器具有良好的柔韧性、可弯折性、延展性及轻便性等，由于可测量形状复杂的表面，所以广泛应用于接触式测量、无损检测、机器人、生物力学等领域。特斯拉人形机器人
    Optimus Gen 2 的灵巧手末端配备了 MEMS 电阻式触觉传感器，展示了灵巧手的精确力控制能力，能够轻松地抓取像鸡蛋这样易碎的物品。当多个触觉传感器组合起来，构成柔性阵列式触觉皮肤时，能够提供更出色的测量分辨率，优于单一传感器的性能。


    3）压电式触觉传感器。压电式触觉传感器的敏感元件由压电材料制作而成。压电材料受外力作用后表面会产生电荷，电荷通过电荷放大器、测量电路的放大以及变换阻抗后，会被转换为与所受外力成正比例关系的电量输出，由此可以测量出压力的大小。通过将柔性
    MEMS 压电式传感器集成到机器人手部，可以帮助机器人实现灵敏的触觉感知。目前，PVDF（Polyvinylidene fluoride，聚偏二氟乙烯）压电材料具有柔性好、频响宽、介电常数小等优点，且容易形成大范围内的薄膜，已经被广泛应用于柔性压电式触觉传感器。


    哈尔滨工业大学研发的一款压电式触觉传感器阵列，受人体皮肤启发，由五层薄膜构成，分别为两层保护层、两层感知层和一层隔离层。保护层为 PDMS（Polydimethylsiloxane，聚二甲基硅氧烷）薄膜，主要是模仿人体皮肤的表皮层，用于将外界刺激转换为电信号。感知层有上
    PVDF 感知层和下 PVDF 感知层。隔离层将上、下两层 PVDF 感知层隔离开，防止其表面的电极接触，产生信号串扰。


    电子皮肤的未来发展。智能人形机器人设计的目标是精准的类人操作，需要实现高精度的集成感测功能，因此相应的柔性电子皮肤需要考虑以下问题：①对多个机械刺激和触觉反馈进行实时检测；②集成多功能传感器，可检测温度、湿度、硬度等多种参数；③人机界面的无线信号传输和控制等。高柔性化、可部署的、高分辨率、多维度力感知的传感器皮肤、能够高效处理密集传感器信息的算法以及机器人的高精度反馈控制仍是当前该领域的研究重点，其最终目标是让人形机器人实现高度类人的感知能力和触摸能力。


    # 6.3.3 听觉传感器


    生活中人与人之间交互的重要手段之一是通过声音等来实现语言的表达与交流。声音通过声波的方式传递至听觉器官，再经由听觉神经传至大脑，由此让人产生听觉。同样，听觉也是人形机器人一种很重要的交互感知能力。为使人形机器人能够“听懂”人类语音，人形机器人装有声信号接收设备，具备语音识别与语言理解的能力。'
