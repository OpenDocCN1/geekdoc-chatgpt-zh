    安装好 Mujoco 仿真器后，可以使用其提供的函数接口，来加载模型并进行物理仿真。下面给出了一个基于 Mujoco C/C++ 接口实现物理仿真的简单例子。\n\
    \n```\n#include \"mujoco.h\"\n#include \"stdio.h\"\nchar error [1000];\nmjModel*\
    \ mj_model;\nmjData* mj_data;\nint main ( void ) {\n    // 加载模型\n    mj_model\
