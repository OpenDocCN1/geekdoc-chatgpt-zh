  md: '# # 第 2 章 人形机器人运动学与动力学


    # ### 导读


    人形机器人的运动能力是其完成各种复杂任务的基础。本章首先概述了人形机器人运动学和动力学分析的基础知识，包括刚体旋转描述、旋转表示方法以及齐次变换；然后讨论了人形机器人运动学分析方法，包括连杆坐标系及变换矩阵、正运动学、逆运动学和微分运动学分析等；最后讨论了人形机器人动力学分析方法，包括牛顿
    - 欧拉法和拉格朗日法等常用分析方法。


    # ### 本章知识点


    +   - 刚体旋转、旋转表示及齐次变换矩阵

    +   - 人形机器人运动学

    +   - 人形机器人动力学


    # ### 2.1 基础知识


    机器人可以看作是由一系列连杆通过关节组成的刚体。也就是说，机器人包含有一个固定的（或者浮动的）刚体和至少一个活动的刚体。始端固定的刚体称为基座，末端活动的刚体则称为末端执行器，在基座和末端执行器之间由若干连杆和关节来连接支承。机器人各个连杆之间、机器人与其作业对象的相互运动关系是机器人的运动关系的基础内容。在研究机器人的运动时，往往需要知道刚体相对于空间某一坐标系的位置和旋转（姿态）。


    机械臂是人形机器人本体的核心组件，其基本组成部件一般采用链式连杆机构，它可以看成是由一系列连杆通过关节依次连接而成的运动链。在描述刚体（连杆）的位置和姿态时，首先需要建立一个坐标系，点的位置可以用一个
    3×1 的位置向量表示。通常需要建立与刚体固连的连杆坐标系，该坐标系的轴和原点固连在该连杆的前一个轴线上。这样，相对于前一个连杆坐标系，当前坐标系的姿态（也称刚体旋转）可用
    3×3 的旋转矩阵来表示。引入齐次变换矩阵，可以同时表示刚体的相对位置和姿态。'
