  md: '# 7.3.3 物体姿态估计


    # 1. 位姿估计算法简介


    六自由度物体位姿估计（6 degrees of freedom pose estimation；简称 6D 物体位姿估计），旨在估计给定图像中的目标物体相对于相机的姿态。6D
    物体位姿估计是机器人领域的关键技术。根据估计对象的不同，6D 物体位姿估计可以分为实例级（ instance-level ）6D 物体位姿估计和类别级（ category-level
    ）6D 物体位姿估计。实例级 6D 物体位姿估计，是针对特定的已知物体进行位姿估计。这类方法只能预测包含在训练集中的已知物体的位姿。类别级 6D 物体位姿估计，可以针对特定类别的物体进行位姿估计，而不局限于特定的物体实例。这类方法能够处理未在训练集中出现的新物体，具有更广泛的适应场景。图
    7-18 所示为实例级和类别级 6D 物体位姿估计的对比。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_198_0.png)


    图 7-18 实例级和类别级 6D 物体位姿估计的对比


    实例级 6D 物体位姿估计通过给定单目 RGB 或 RGBD 图像 I 和目标物体的 CAD 模型 M ，旨在估计目标物体位姿 P \in SE(3) 。其中，
    P 包含物体相对于相机的旋转 R \in SO(3) 和平移 T \in R^3 。旋转 R 由俯仰、偏航和滚动组成，分别指围绕 X 、 Y 和 Z 轴的旋转。它们构成物体围绕整个
    3D 空间的旋转。平移 T 指的是相机坐标系中物体中心的 x 、 y 、 z 移动量。从另一个角度来看， P 也可以理解为将目标物体从物体坐标系转换为相机坐标系的坐标变换。该任务可以表示为


    ```

    [R|T] = F{[I, M] | \theta} (7-8)

    ```


    式中， F 为深度学习模型； \theta 为模型的参数。一般来说，基于深度学习的实例级 6D 物体位姿估计方法分为两类：直接回归方法和基于匹配的方法。预测物体
    6D 位姿最直观的方法是直接使用神经网络提取输入图像的特征，并基于高维特征进行端到端的位姿预测。尽管这类方法简洁直观，但都高度依赖神经网络，且具有不确定性。因此，直接回归方法在复杂场景下的泛化性能往往较差。更好的选择是使用基于匹配的方法，也就是建立输入数据和
    CAD 模型之间对应关系。基于对应的方法可进一步分为稀疏对应和密集对应。基于稀疏对应的方法利用神经网络检测输入图像或点云中的物体关键点，以建立输入数据和 CAD
    模型之间的 2D-3D 或 3D-3D 对应，然后利用透视 n 点（ Perspective n-Point， PnP ）算法或最小二乘法确定物体姿态。基于密集对应的方法是通过预测每个物体像素或物体点云在
    CAD 模型上的坐标获得的建立密集的 2D-3D 或 3D-3D 对应，最终实现更准确的物体姿态估计。图 7-19 所示为稀疏匹配和密集匹配方法的区别。'
