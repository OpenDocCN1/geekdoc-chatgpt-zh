- pgno: 255
  md: '# 1. 欠驱动的定义


    根据牛顿力学，机械系统的动力学方程是二阶的。系统的状态由位置向量和速度向量组成。二阶控制动力系统的一般形式为


    ```

    \(\ddot{q} = f(q,\dot{q},u,t)\) (9-3)

    ```


    式中，\(u\) 为控制向量，对应人形机器人关节的输出力矩。在状态 \(x=(q,\dot{q})\) 和时间 \(t\) 上，如果映射 \(f\) 是满射的，即对于每一个
    \(\ddot{q}\) 都存在一个 \(u\) 能够产生期望的响应，则称其为完全驱动。否则，在状态 \(x\) 和时间 \(t\) 上，称其为欠驱动。举例来说，机械臂机器人属于完全驱动；人形机器人属于欠驱动。一般来说，完全驱动的系统相对容易控制。对于欠驱动系统，可以利用其机械特性来改善优化空间，但这需要更多的洞察力。


    今天，欠驱动系统的控制设计在很大限度上依赖优化和最优控制。尽管在基于模型的优化和机器学习控制方面进展迅速，但仍有许多未解的问题。


    +   (1) 足式机器人是欠驱动的 对于一个有 \(N\) 个内部关节和 \(N\) 个执行器的足式机器人，如果它没有固定在地面上，那么系统的自由度包括内部关节和定义机器人在空间中位置和方向的
    6 个自由度。


    +   (2) 机器人操作是欠驱动的 对于一个完全驱动的机器人手臂。当这个手臂操作一个具有自由度的物体时（即使是一个砖块也有 6 个自由度），它可能会变得欠驱动。如果实现并维持了力闭合，那么可以认为系统是完全驱动的，因为物体的自由度被约束以匹配手的自由度。当然，除非被操作的物体有额外的自由度（如任何可变形的物体）。


    欠驱动系统的出现改变了在规划和控制中采取的方法。对于一个完全驱动的机器臂，可以专注规划运动学轨迹，而不必关心动力学。对于欠驱动系统，则必须考虑动力学。即使是完全驱动且没有其他约束的系统，其控制系统也可以通过欠驱动系统方面的经验教训来改进，特别是需要提高运动效率或减少设计复杂性时。


    机械臂的底座是和惯性系固定的，而人形机器人的底座是自由的，所以称机械臂属于固定基，人形机器人则属于浮动基。学习人形机器人控制之前，从控制相对简单的固定基机械臂开始。


    # 2. 机械臂全身控制原理


    机械臂属于完全驱动的固定基机器人，其动力学方程为


    ```

    \(M(q)\dot{v}+c(q,v)=\tau\) (9-4)

    ```


    式中，\(\tau \in R^N\) 为关节力矩；\(M(q)\) 为关节空间惯性矩阵；\(c(q,v)\) 包含离心力、科里奥利力和重力。控制的目标是，给定关节的运动参考轨迹
    \(\dot{v}_{des}\)，计算关节控制量 \(\tau\)。以机械臂末端点 \(p_{EE}\) 跟踪三维轨迹为例，假设已知参考轨迹 \(p_{EE,des}\)、\(\dot{p}_{EE,des}\)，则期望的末端控制量采用
    PD 控制器计算得到，即


    ```

    \(\ddot{p}_{EE,des} = Kp(p_{EE,des}-p_{EE,m})+Kd(\dot{p}_{EE,des}-\dot{p}_{EE,m})\)
    (9-5)

    ```


    根据运动学关系有'
