  md: '# 6.4 机器人多传感器信息融合


    # 6.4.1 多传感器信息融合的概念


    机器人在各种复杂的、动态的、不确定或未知的环境中工作所依靠的技术途径主要是依靠多传感器信息融合技术。多传感器信息融合（Multi-Sensor Information
    Fusion，MSIF）是利用计算机技术将来自多传感器或多源的信息和数据在一定的准则下加以自动分析和综合，以完成所需要的决策和估计而进行的信息处理过程。多传感器信息融合的意义在于可以产生更可靠、准确或全面的信息。融合的多传感器系统可以更加完善、准确地反映被检测物体的特性，消除信息的不确定性，提高信息的可靠性。


    多传感器信息融合技术的基本原理就像人的大脑综合处理信息的过程一样，将各种传感器进行多层次、多空间的信息互补和优化组合处理，最终产生对观测环境的一致性解释。在这个过程中要充分地利用多源数据进行合理支配与使用，而信息融合的最终目标则是基于各传感器获得的分离观测信息，通过对信息多级别、多方面组合导出更多有用信息。这不仅利用了多个传感器相互协同操作的优势，也综合处理了其他信息源的数据，以提高整个传感器系统的智能化。


    # 6.4.2 多传感器信息融合的分类与方法


    机器人多传感器信息融合可以在传感器信息处理的不同层次上进行。根据处理对象的层次不同，可以将其分为像素层融合、特征层融合以及决策层融合。


    像素层融合是低级融合，如图 6-19 所示，是直接在传感器采集到的原始观测信息层上融合，其优点是能保持尽可能多的现场数据，缺点是处理信息量大、要求传感器同质、抗干扰能力差，常用于多源图像复合、同质雷达波形拼合等。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_177_0.png)


    特征层融合属于中级融合，如图 6-20 所示，是需要对多个传感器信息进行特征提取，再将提取出的特征综合为一组特征向量进行融合。其优点是实现了一定程度的信息压缩，融合结果能给出决策分析所需特征，有利于实时处理。其常用的方法包括神经网络、K
    近邻法、特征压缩等。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_177_1.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: '决策层融合属于高层融合，如图 6-21 所示，是指在每个传感器信息预处理与特征提取的基础上，做出初步决策判断后进行融合，以得到最终的决策结果。它直接针对具体的决策目标，融合结果直接影响决策水平。其优点是容错性强、实时性强、对传感器依赖小，缺点是信息损失量大。常用的决策层融合方法包括贝叶斯推理、专家系统方法、模糊集理论。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_178_0.png)


    图 6-21 决策层融合


    多传感器信息融合的常用方法有加权平均法、卡尔曼滤波法、多贝叶斯估计法、Dempster-Shafer（D-S）证据推理法、产生式规则法、模糊逻辑推理法、神经网络等。可以预见，神经网络和人工智能等新概念、新技术在多传感器信息融合中将起到越来越重要的作用。


    +   (1) 加权平均法 加权平均法是信号级融合方法中最简单直观的方法，是将一组传感器提供的冗余信息进行加权平均，结果作为融合值。该方法是一种直接对数据源进行操作的方法，但使用方法必须先对传感器进行分析，获得准确权值。


    +   (2) 卡尔曼滤波法 卡尔曼滤波法主要用于融合低层次实时动态多传感器冗余数据。该方法用测量模型的统计特性递推，决定统计意义下的最优融合和数据估计。可以将其理解为最小均方误差估计，根据最近一个观测数据和其估计值来估计信号的当前值。如果系统属于线性动力学模型，且系统与传感器的误差符合高斯白噪声模型，则卡尔曼滤波将为融合数据提供唯一统计意义下的最优估计。卡尔曼滤波的递推特性使系统处理无需大量的数据存储和计算。工程实际应用中，系统模型线性程度的假设或者数据处理不稳定时，常常采用扩展卡尔曼滤波法。目前，其在移动机器人的多传感器定位等领域得到了广泛应用。


    +   (3) 多贝叶斯估计法 多贝叶斯估计法是融合静环境中多传感器高层信息的常用方法。它在假定已知相应的先验概率的前提下，将每一个传感器作为一个贝叶斯估计，把来自各传感器对某一物体的判决结合起来，即将各关联概率分布合成一个联合的后验概率分布函数，来提供多传感器信息的融合值，常用于目标识别等任务。此方法的局限性在于先验概率的获得比较困难。


    +   (4) D-S 证据推理法 D-S 证据推理法是贝叶斯推理的扩充，它在定义识别框架、基本可信度分配、信任函数、似然函数基础上，应用 D-S 合成规则进行证据推理。D-S
    证据推理法的推理结构是自上而下的，分为三级：第一级为目标合成，其作用是把来自独立传感器的观测结果合成一个总的输出结果；第二级为推断，其作用是获得传感器的观测结果并进行推断，将传感器观测结果扩展成目标报告；第三级为更新，各传感器一般都存在随机误差，因此在时间上充分、独立地来自同一传感器的一组连续报告比任何单一报告更加可靠，所以在推理和进行多传感器合成之前，要先组合（更新）传感器的观测数据。


    +   (5) 产生式规则法 产生式规则法采用符号表示目标特征和相应传感器信息之间的联系，用与每一个规则相联系的置信因子表示它的不确定性程度。当在同一个逻辑推理过'
