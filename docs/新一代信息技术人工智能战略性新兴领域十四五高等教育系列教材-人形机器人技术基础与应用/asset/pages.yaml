  md: 'PointNet 直接可直接处理原始点云数据。如图 7-16 所示，PointNet 的核心网络模块主要包括两个部分：T-Net（transformation
    network）和多层感知机。对于输入形状为（n×3）的点云数据，首先进行输入变化。T-Net 模块的作用是将点云数据进行规范化处理，消除输入点云数据因扫描角度和位置不同而造成的干扰。多层感知机的作用是进行特征提取。其以输入数据中的的每个点为基本单位，最终为每个点生成一个特征向量，构成尺寸为（n
    × 1024）的点云局部特征，在多个多层感知机分别提取局部特征后，经过一个全局最大池化即可获取到一个全局特征向量。


    获取到点云数据的全局特征后便可以进行下游任务，包括分割任务和分类任务等。分割任务的目标是为每个点输出一个标签。这种情况下，网络会将全局特征拼接，为每个点生成一个扩展的特征描述符。最后，经过一系列的多层感知机输出每个点的相应分数。三维点云分类任务需要对三维点云数据整体分配一个类别标签，因此该类任务中全局特征更为重要。


    由于 PointNet 是先对单点进行操作、再对全局点进行操作的，因此难以学习到精细的全局特征。同时，由于没有卷积操作，点云的平移会导致三维坐标发生变化，从而导致汇总的局部特征也发生变化，以致于分类结果出现错误。为了弥补了上述缺陷，研究人员设计了
    PointNet++。PointNet++ 的核心思想是在局部区域进行迭代，重复地使用 PointNet 提取特征，用生成的点去继续生成新的点，在生成的点集中又去定义新的局部区域，从而实现不同层级特征的学习。


    PointNet++ 基本结构图如图 7-17 所示。其特征提取的具体流程如下：首先，在整个点云对象中定义若干小区域的中心；然后，从中心出发，把点划分为重叠的小区域，分别使用
    PointNet 提取局部特征；最后，将提取到的特征组合，并投影到高维空间，得到一个新的点。重复此操作，遍历所有点后将得到一组新的点。新的点集数量将更少，但每个点包含了周围区域的几何特征。


    将上述操作定义为子集抽象。重复子集抽象将使每个点代表的区域更大，对最后的数据进行全局池化，得到用于分类的全局特征。


