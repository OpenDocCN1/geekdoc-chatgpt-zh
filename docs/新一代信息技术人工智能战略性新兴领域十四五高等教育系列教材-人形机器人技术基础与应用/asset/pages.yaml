  md: '+   2) 在每个子区间 \([t_j, t_{j+1}] (j=0, 1, \cdots, n-1)\) 上，\(S(t)\) 是次数 \(\leqslant
    3\) 的多项式。


    +   3) 对于各节点的函数值 \(f_j = f(t_j) (j=0, 1, \cdots, n), S(t)\) 满足


    \(S(t_j) = f_j (j=0, 1, \cdots, n)\) (3-36)


    因为要满足运动步态的连续性，所以 \(S(t)\) 还应该满足


    \(\left\{ \begin{array}{l} S_{j-1}(t_j) = S_j(t_j) \\ S''_{j-1}(t_j) = S''_j(t_j)
    \\ S''''_{j-1}(t_j) = S''''_j(t_j) \end{array} \right.\) (3-37)


    由于 \(S(t)\) 在 \([t_j, t_{j+1}]\) 上是三次多项式，即具有以下形式，即


    \(S(t) = S_j(t) = a_j + b_j t + c_j t^2 + d_j t^3, t \in [t_j, t_j] (j=0, 1, \cdots,
    n-1)\) (3-38)


    式中，共有 \(4n\) 个待定系数 \(a_j, b_j, c_j, d_j\)。因此要确定 \(S(t)\)，也就是要确定满足式 (3-36)、式 (3-37)
    的这 \(4n\) 个系数。


    式 (3-36)、式 (3-37) 共有 \(4n-2\) 个条件，要唯一确定 \(S(t)\) 还必须附加边界条件。常用的三次样条插值函数的边界条件有以下三种类型：


    第一种边界条件：给定 \(y=f(t)\) 在端点的一阶导数，要求 \(S(t)\) 满足


    \(\dot{S}(t_0) = \dot{f}_0, \dot{S}(t_n) = \dot{f}_n\) (3-39)


    第二种边界条件：给定 \(y=f(t)\) 在端点的二阶导数，要求 \(S(t)\) 满足


    \(\ddot{S}(t_0) = \ddot{f}_0, \ddot{S}(t_n) = \ddot{f}_n\) (3-40)


    其特殊情况为 \(\ddot{S}(t_0) = 0, \ddot{S}(t_n) = 0\)，称为自然边界条件。


    第三种边界条件：当 \(y=f(t)\) 为周期函数时，自然也要求 \(S(t)\) 也是周期函数，即满足


    \(S^{(j)}(t_0) = S^{(j)}(t_n) (j=0, 1, 2, \cdots)\) (3-41)


    由这种边界条件确定的 \(S(t)\) 称为周期性样条函数。


    记 \(h_j = t_{j+1} - t_j\)，则三次样条插值函数 \(S(t)\) 可以用多项式表示为


    \(S(t) = \frac{M_j}{6h_j}(t_{j+1}-t)^3 + \frac{M_{j+1}}{6h_j}(t-t_j)^3 + \left(f_j
    - \frac{M_j h_j^2}{6}\right)\frac{t_{j+1}-t}{6} + \left(f_{j+1} - \frac{M_{j+1}
    h_j^2}{6}\right)\frac{t-t_j}{6}\) (3-42)


    \(M_j\) 是式 (3-43) 的解：


    \(\left\{ \begin{array}{l} 2M_1 + b_1 M_2 = d_1 \\ \frac{h_{j-1}}{6} M_{j-1} +
    \frac{h_j + h_{j-1}}{3} M_j + \frac{h_j}{6} M_{j+1} = \frac{f_{j+1} - f_j}{h_j}
    - \frac{f_j - f_{j-1}}{h_{j-1}} \\ (j=1, 2, \cdots, n-1) \\ \alpha_n M_{n-1} +
    2M_n = d_n \end{array} \right.\) (3-43)'
