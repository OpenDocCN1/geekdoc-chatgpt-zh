- pgno: 161
  md: '# 第 6 章 人形机器人感知系统


    # 导读


    本章首先概述了人形机器人感知系统，包括其组成与分类以及发展趋势。然后分机器人内部传感器与外部传感器两大部分介绍用于机器人位置或速度测量的编码器、MEMS惯性传感器、视觉传感器、力/触觉传感器、听觉传感器等。最后，介绍了机器人多传感器信息融合的概念、意义、分类结构、各种方法以及典型应用案例。


    # 本章知识点


    +   - 人形机器人感知系统的组成与分类

    +   - 机器人内部传感器

    +   - 机器人外部传感器

    +   - 机器人多传感器信息融合技术


    # 6.1 概述


    # 6.1.1 人形机器人感知系统的组成与分类


    人形机器人的感知系统是其感知外界环境和自身状态的核心组成部分。人形机器人功能的实现与性能的优化离不开各类传感器的精准感知与数据反馈，它们是人形机器人与环境交互的信息输入环节，也是首要环节。人形机器人感知系统由硬件系统和软件系统组成，硬件系统包括各类传感器、嵌入式主控制器、机器人本体控制器等；软件系统包括传感器信息处理软件与机器人控制软件等。图
    6-1 展示了人形机器人感知系统中的各类传感器硬件。


    传统机器人配备的传感器较单一，而人形机器人由于其复杂的交互性，需要各类传感器的集成，可以将其分为外部传感器与内部传感器两大类。如图 6-2 所示，外部传感器主要用于获取外部环境信息和对象状况等。例如，人形机器人的摄像头等元件充当“眼睛”，用于实现视觉感知，如估计目标物体位姿、检测周围环境障碍物等；传声器充当“耳朵”，用于实现听觉感知，如语音识别、环境噪声检测等；触觉传感器充当“皮肤”，'
  merge: -1
  img_proc: true
- pgno: 162
  md: '用于实现触觉感知。内部传感器主要用于获取机器人自身状态信息。力或力矩传感器和IMU充当“身体控制器”，前者实现力或力矩等运动状态感知，可以助力人形机器人的协作安全性和实时精准运动控制，后者是实现人形机器人姿态控制的核心部件之一，可获取关节的位置、速度、加速度和角度等信息，实现站立／行走／转身等姿态感知。


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_162_0.png)


    图 6-1 人形机器人感知系统中的各类传感器硬件


    ![](img/47a2b26fde9e2a8fab8f8289e100ee37_162_1.png)


    图 6-2 机器人传感器信息及信息处理过程


    # 6.1.2 人形机器人人感知系统的发展趋势


    1) 传感器技术朝集成化、智能化方向发展。传感器集成化是将传感器技术与大规模集成电路技术相结合，在制造过程中运用半导体集成化工艺，有助于提高传感器性能，使传感器的体积更小、成本更低。而传感器的智能化是指传感器与微处理器相结合，通过植入人工智能算法等使传感器拥有数据采集、分析与智能处理等能力。


    2) 机器人多传感器信息融合。为克服单个传感器存在的不确定性、观测误差和不完整性等弱点，人形机器人通常集成多个传感器，通过多传感器信息融合技术能够将不同传感器采集到的同类或者不同类信息进行综合分析和判断，这是提高人形机器人环境探测能力、增强其对变化环境适应能力的一项关键技术。


    3) 机器人感知系统朝网络化方向发展。5G等通信技术具有低延时、高可靠性、海量连接的优点，将人形机器人传感器连接到网络上，实现云端学习与信息共享，能够使人形机器人与外界间的通信、协调、互动更加方便。


    整体上，人形机器人人感知系统的发展趋势是朝着更智能、更高效、更安全和更友好的方向不断演进。这些趋势不仅提升了人形机器人的操作能力和交互体验，也为其在各个领域的广泛应用奠定了基础。'
  merge: -1
