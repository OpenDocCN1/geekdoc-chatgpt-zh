- pgno: 77
  md: '# 3.3 步态规划


    # 3.3.1 倒立摆模型


    在人形机器人的研究和开发中，倒立摆模型是一个极为重要的工具，用于模拟和分析机器人的动态平衡及其控制策略。


    倒立摆模型是一个典型的动态系统模型，用来描述一个或多个自由度的摆动系统如何在受力作用下保持平衡。在人形机器人领域，这个模型被用来象征人形机器人身体在一个或多个关节（如踝关节）上的动态稳定性。


    +   1. 模型原理


    倒立摆模型包括一个质点（倒立摆的质心）和一个无质量的杆（连接质点和旋转轴），杆固定在一个可移动的基座上。当施加力或转矩时，质点的运动轨迹需要通过控制策略来稳定。


    +   2. 数学描述


    倒立摆的运动可以通过牛顿第二定律来描述，即


    ```

    $ml^2\ddot{\theta} = mgl \sin\theta + u$ (3-17)

    ```


    式中，$m$ 是摆的质量；$l$ 是杆的长度；$\theta$ 是摆杆与垂直线的夹角；$g$ 是重力加速度；$u$ 是控制输入（通常是底部的转矩）。


    # 3.3.2 ZMP 步态规划


    +   1. ZMP 步态规划概述


    在人形机器人的步态规划中，ZMP 理论是核心技术之一，它帮助确保人形机器人在行走和执行任务时的动态稳定性。


    根据期望的 ZMP 轨迹生成人形机器人行走步态的方法的基本思路是：根据人形机器人期望的步长、周期等信息确定人形机器人期望的 ZMP 轨迹，再根据期望的 ZMP
    轨迹得到人形机器人质心的运动轨迹，从而得到人形机器人各个关节的轨迹。预观控制方法是 Sheridan 等在 20 世纪 60 年代提出的一种控制器设计方法，最早应用在线性二次最优伺服控制器的设计上，后来通过离散化，应用到人形机器人的步态规划中。


    ZMP 步态规划是指利用零力矩点理论来设计人形机器人的行走步态，确保其在移动过程中的稳定性。通过控制 ZMP 轨迹使其始终位于支撑脚的底部投影内，可以有效避免人形机器人在行走过程中的摇摆和倒下。


    +   2. ZMP 轨迹的生成方法


    ZMP 轨迹反映了人形机器人与地面交互的动态稳定点的路径。理想的 ZMP 轨迹应当始终位于人形机器人的支撑面内，通常是两脚之间或单脚的底部区域。轨迹的生成依赖于'
