- pgno: 113
  md: '+   3) 摆杆的角度，即摆杆相对于竖直方向的角度。


    +   4) 摆杆的角速度，即摆杆绕连接点的旋转速度。


    该任务的动作空间是离散的，有以下两个可能的动作：


    +   1) 向左施加力，即向小车施加一个固定的左向力。


    +   2) 向右施加力，即向小车施加一个固定的右向力。


    该任务的奖励函数表示为：在每一个时间步，如果摆杆仍然保持直立且小车没有脱离轨道，环境会给予一个奖励值 1。任务的目标是将累积奖励最大化，即在尽可能多的时间步内保持摆杆的直立状态。该任务的终止条件为以下三种情况：


    +   1) 摆杆角度超过一定阈值。如果摆杆的角度超过 $\pm 12^\circ$，任务终止。


    +   2) 小车位置超过一定阈值。如果小车的位置超过轨道边界（ $\pm 2.4$ 单位），任务终止。


    +   3) 若小车倒立摆没有发生任何一种以上情况，达到 200 时间步后任务也会终止。


    因此，对应小车倒立摆任务中，状态值 s 为一个四元浮点向量，包含了状态空间的四个浮点变量。动作 a 为一元整形数据，环境根据其为 0 或 1 选取动作。奖励值为存活时间步，存活时间越长，奖励值越大。而任务的终止条件为小车跑远或倒立摆倾覆，此外考虑到数据多样性与操作可行性的需求，任务时长过长也会触发任务终止，将任务终止标志位设为真并重置任务环境。将以上数据传入深度强化学习训练框架中即可完成小车倒立摆任务的训练，智能体能够逐渐学习到如何控制小车运动，以保持摆杆直立，从而实现优化的控制策略。


    但以上任务信息的设置方式并不唯一。以奖励值为例，鼓励倒立摆保持竖直以及鼓励小车维持原始位置都可以更好地训练控制策略。因此，对于复杂任务来说，精心设计的任务信息可以显著提升策略的训练效率与最终性能。


    # 4.2.2 人形机器人观察值空间设计


    根据机器人硬件结构、佩戴传感器的不同，机器人所获取的原始数据信息各不相同。最简单的基于强化学习的双足机器人运动控制方法为盲眼运动，即不使用相机、雷达或其他感知外部信息的传感器，仅使用关节编码器、IMU，部分算法加入了执行器末端的接触传感器。仅使用关节的角度、角速度、躯干的姿态、躯干角速度以及部分末端接触信息进行状态估计与运动控制。其他算法加入了相机、雷达以及
    GPS 等外部传感器以获取外部信息，使得学习算法所输入的状态信息的数据类型与数据维度都发生了巨大的变化，这也对数据处理方式与网络结构都有了新的要求，处理手段也各不相同。


    基础的深度强化学习算法可以将传感器原始数据直接作为状态观察值输入网络，经网络处理后输出下一步指令动作。但在实际操作过程中，该方法往往无法完成训练任务。原因之一在于多种传感器传回的数据信号幅值不同，不同任务之间的信号敏感区间也不同。所以首先需要处理的就是对状态观测值进行归一化处理，目的在于将所需处理的信号统一到同一数据范围内，便于后期采用同样的数据处理手段处理数据。常见数据归一化方法主要有以下几种：


    +   1) 最小值最大值归一化，即


    ```

    \(x'' = \frac{x - \min(x)}{\max(x) - \min(x)}\) (4-25)

    ```'
