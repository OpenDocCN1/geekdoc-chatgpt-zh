    # 附录 B 特殊三角函数


    # B.1 双参数反正切函数


    通常的反正切函数返回取值在（-π / 2， π / 2）。为了表达所有可能取值的角度，定义一个双参数变量反正切函数 atan2(x,y) 非常有用，该函数相对于所有
    (x,y) ≠ (0,0) 进行定义，并且等于唯一的角度 θ，使得


    ```

    \(\cos \theta = \frac{x}{(x^2 + y^2)^{\frac{1}{2}}}, \sin \theta = \frac{y}{(x^2
    + y^2)^{\frac{1}{2}}}\)

    ```


    该函数通过使用 x 和 y 的符号来选择与角度 θ 相适应的象限。例如， atan2(1,-1) = -\frac{\pi}{4} ，而 atan2(-1,1)
    = +\frac{3\pi}{4} 。注意到如果 x 和 y 均为零时，atan2 函数没有意义。


    # B.2 有用的三角函数公式


    诱导公式


    ```

    \(\sin(-\theta) = -\sin \theta \quad \sin\left(\frac{\pi}{2} + \theta\right) =
    \cos \theta\)

    \(\cos(-\theta) = \cos \theta \quad \tan\left(\frac{\pi}{2} + \theta\right) =
    -\cot \theta\)

    \(\tan(-\theta) = -\tan(\theta) \quad \tan(\theta - \pi) = \tan(\theta)\)

    ```


    倍角公式


    ```

    \(\sin(x \pm y) = \sin x \cos y \pm \cos x \sin y\)

    \(\cos(x \pm y) = \cos x \cos y \mp \sin x \sin y\)

    ```'
