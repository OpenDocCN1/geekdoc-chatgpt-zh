    # 4.2.3 Word2Vec


    Word2Vec 是一种将单词表示为向量的技术，它是由 Google 在 2013 年提出的。Word2Vec 基于预测模型，通过将单词嵌入一个低维空间中，使单词在语义上的相似性可以通过向量之间的距离表示。Word2Vec
    主要有 Skip-gram 和 CBOW ( Continuous Bag Of Words，连'
  merge: -1
  img_proc: true
- pgno: 98
  md: '续词袋）两种模型。


    在 Skip-gram 模型中，给定一个中心单词，模型的任务是预测在它周围的单词。具体地，对于一个中心单词 \( w_c \)，我们希望预测它周围的单词 \(
    w_{c-m}, w_{c-m+1}, \cdots, w_{c+m} \)，其中，\( m \) 是窗口大小。对于一个单词 \( w \)，我们可以将它表示为一个向量
    \( \mathbf{x}_w \)。Skip-gram 模型的损失函数可以定义为所有中心单词 \( w_c \) 的损失之和，其中损失定义为预测单词的概率与实际单词的概率的差距，即交叉熵损失。Skip-gram
    模型使用随机梯度下降算法进行训练。


    与 Skip-gram 模型不同，CBOW 模型的任务是给定一个窗口的中心单词周围的单词，预测这个中心单词。具体地，给定一个窗口中的单词 \( w_{c-m},
    w_{c-m+1}, \cdots, w_{c+m} \)，CBOW 模型的任务是预测中心单词 \( w_c \)。CBOW 模型的损失函数可以定义为所有中心单词
    \( w_c \) 的损失之和，其中损失定义为预测单词的概率与实际单词的概率之间的差距，即交叉熵损失。CBOW 模型同样使用随机梯度下降算法进行训练。


    Word2Vec 模型的优点是可以处理大规模数据，同时生成的词向量可以应用于各种自然语言处理任务（如文本分类、信息检索、情感分析等）。


    下面结合一个简单的例子说明 Word2Vec 的作用。假设我们有一个句子：Tom likes to play football，我们想要将其中的单词表示为向量。首先，我们需要对单词进行编码，假设我们将每个单词表示为唯一的整数。然后，我们可以使用
    Word2Vec 模型将这些单词转换为向量。对于一个单词，它的向量可以表示为一个 \( N \) 维的向量。例如，对于单词'
  merge: -1
  img_proc: true
