  md: '# CHAPTER 1 第 1 章


    # 概述


    # 1.1 什么是提示工程师


    随着人工智能技术成为我们日常生活中不可或缺的一部分，我们与人工智能技术的关系正在发生变化。无论我们使用的是虚拟助手、聊天机器人还是声控设备，都在越来越多地与人工智能系统进行交流（交互）。为了使这些交互真正成功，我们必须清晰、高效且有效地对人工智能系统表达我们的需求。那么释放这种成功交互的潜力的关键是什么呢？这就是提示工程师。


    提示工程是人机关系中一个重要的组成部分，可确保我们能够以自然和直观的方式与人工智能系统进行交流。


    提示工程师是指那些专门从事自然语言处理工作的人工智能开发人员。他们通常负责构建自然语言处理系统中的“提示”或“提'
  merge: -1
  img_proc: true
- pgno: 16
  md: "示语”，以便自然语言处理系统能够准确理解用户的输入和进行相应的回应。这些“提示”通常是由一组预定义的指令或关键词组成的，可以使自然语言处理系统快速地理解用户的意图并提供相应的响应。\n\
    \n提示工程师需要熟练掌握自然语言处理技术和人工智能算法，以便高效地构建出自然语言处理系统所需的“提示语”。他们通常需要具备计算机科学、语言学、统计学等方面的专业知识，并且需要熟悉各种编程语言和开发工具，如\
    \ Python、TensorFlow、PyTorch 等。\n\n注意：提示工程师是一个新的职业，仍处于起步阶段，缺乏通用的定义或标准，导致新手和经验丰富的专业人士对它的定义感到困惑。\n\
    \n那么，提示工程师有什么职责和技能要求呢？\n\n提示工程师的职责是设计和构建自然语言处理系统中的“提示语”。他们需要熟练掌握自然语言处理技术和算法，并且需要具备一定的语言学知识。\n\
