    # 提示的进阶模式


    # 3.1 零样本提示


    在提示模式中，除标注训练数据之外，还有一种无须实际训练数据就能进行推断的方式，即零样本提示（zero-shot prompt）。零样本提示是指通过在输入文本中添加一些关键词或短语，使模型能够在未见过该类型任务的情况下，理解并正确地处理该任务。例如，在一个问答系统中，当用户向模型提出一个新的问题时，模型可以通过零样本提示来猜测可能的答案，然后给出一个相应的答案或解决方案。零样本提示不仅可用于提高模型的泛化能力，还可用于降低数据准备和训练的成本，这对于在缺乏大规模有标注数据的情况下开展研究和应用具有重要意义。


    零样本提示的实现方法包括在输入文本中添加一些特定的标记、'
  merge: -1
  img_proc: true
- pgno: 60
  md: '短语或关键词，以指定任务类型或条件，这样模型就能够根据这些提示来推断任务的答案或结果。除此之外，还有一种基于模板的零样本提示方法，即通过提前设计一些模板句式和规则，指导模型执行特定的任务或操作。这种方法不需要特定的关键词或短语，但需要大量的人工设计和编码工作。


    零样本提示技术在自然语言处理、计算机视觉等领域得到了广泛应用，如基于 ChatGPT 模型，我们可以快速完成语言生成、图像分类、语义分割等任务。在这些应用中，零样本提示为模型提供了一种快速、有效的推理方法，极大地拓展了模型的应用范围和实用价值。


    我们将类似的基于模板的解决方案应用于各种 NLP 任务。以下给出一些模板。


    # 3.1.1 情感分类模板


    如果我们有一个情感分类模型，它可以将文本划分为积极或消极，但是我们想添加一个新的情感类别，如“中性”。我们可以通过零样本提示技术，在输入文本中添加关键词或短语，告诉模型如何对这个新的情感类别进行分类。例如，我们可以在输入文本中添加短语“不喜欢也不讨厌”，这样模型就能够将其划分为中性情感类别。


    例如，我们在 ChatGPT 里面输入如下内容。


    将下面的文本分为积极、消极或者中性。'
