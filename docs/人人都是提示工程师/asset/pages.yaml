- pgno: 19
  md: '# 1.2 提示工程的基本工作原理


    提示技术是一种基于模板的自然语言生成技术，提示工程师的工作就是设计和优化这些模板或提示语，以控制自然语言处理（Natural Language Processing，NLP）模型的输出。提示技术的基本工作原理是将一组预定义的提示语或文本片段传递给
    NLP 模型，然后根据这些提示语生成相应的输出文本。以下是提示技术的基本工作流程。


    +   1. 设计提示语


    提示工程师根据所需的输出类型，设计一组提示语或文本片段。这些提示语通常是具有一定上下文和语法结构的文本，例如，“请列出前五个……” “对于以下问题，请提供一个简短的答案……”
    等描述。


    在设计提示语时，提示工程师需要考虑以下几个方面。


    +   上下文：提示语需要具有一定的上下文信息，使 NLP 模型能够理解所需的输出类型和目标。例如，“请列出前五个……”可以用于列表、排名等类型的输出，而“请提供一个简短的答案……”则可以用于问答或摘要生成。


    +   语法结构：提示语需要具有一定的语法结构和表达方式，使 NLP 模型能够根据提示语自动生成相应的输出。例如，“请描述……”可以用于自然语言生成的任务，而“请计算……”则可以用于数学运算或数据处理任务。


    +   目标群体：提示语的表达方式需要符合目标用户的需求和期'
  merge: -1
  img_proc: true
- pgno: 20
  md: '望，以提高生成文本的质量和可读性。例如，“请以易懂的语言解释……”可以用于教育或科普类的应用场景，而“请提供详细的报告……”则可以用于商业或科研类的应用场景。


    以下是一些具体的提示语示例。


    # （1）生成文章或故事。


    +   * “请以……为主题，撰写一篇 800 字的文章。”

