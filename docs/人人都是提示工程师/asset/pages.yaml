  md: '# 前言


    推动作用。


    本书主要介绍了提示工程师的工作内容和相关技能、提示的基础模式和进阶模式、自然语言处理知识，以及提示工程中各个领域的应用。无论您是初学者还是技术人员，都可以在这本书中找到有用的知识和技巧。希望本书能够成为您掌握提示工程的有用工具和参考资料。


    # 本书特色


    本书的特色主要体现在以下几个方面。


    +   全面介绍提示工程的原理和应用。在原理方面，本详细介绍了提示工程的基本工作原理、提示的基础模式，以及进阶模式中的零样本提示、少样本提示和思维链提示（Chain-of-Thought,
    CoT）等。在应用方面，本书涵盖了办公、图像处理、软件开发、电商等领域的案例。


    +   深入剖析提示工程的实现细节。提示工程的实现细节是该技术的难点之一。本书深入剖析了提示工程的实现细节，包括模型看懂文字的原理、模型的优化方法、模型的微调技巧等。


    +   结合实际场景，讲解提示工程在实际中的应用。本书在讲解提示的基础和进阶模式的同时，还结合实际场景，讲解了提示工程在实际中的应用，例如，在办公场景中，如何利用提示工程来生成
    PPT、画思维导图、画流程图等；在电商场景中，如何利用提示工程来开网店、写电商文案、生成商品展示图等。这些实际应用场景可以帮助读者更好地理解和掌握提示工程。'
