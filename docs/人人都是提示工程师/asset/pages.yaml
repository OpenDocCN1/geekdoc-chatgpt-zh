- pgno: 65
  md: '# 3.3 思维链提示


    思维链提示（Chain-of-Thought，CoT）是一种用于提高大语言模型推理能力的创新性技术。该技术通过提示模型生成一系列推理步骤来解决多步骤的问题。这样一来，模型可以将多步骤的问题分解成中间步骤，从而更好地理解和解决问题。这种技术的应用可以显著提高模型在数学、常识、推理等方面的准确性。在
    2022 年，魏等人提出了思维链提示技术，这是一种引入中间推理步骤以实现复杂推理能力的提示技术。而如果将思维链提示技术与少样本提示相结合，则可以在需要推理的更复杂任务上获得更好的结果。


    除在自然语言处理领域中广泛应用外，思维链提示技术还可以用于计算机视觉和自动驾驶等领域。通过引入中间推理步骤，思维链提示技术可以帮助机器更好地理解图像和视频数据，并生成更准确的预测结果。这对于自动驾驶等需要高度推理能力的任务非常重要。


    总之，思维链提示技术是一种强大的提示技术，可以帮助大语言模型完成更复杂的推理任务。通过将思维链提示技术与其他提示技术相结合，我们可以进一步提高模型在各种任务中的表现。在未来，我们可以期待思维链提示技术在各种领域中的广泛应用和不断创新。


    那么，我们在日常的工作中如何利用这个技术呢？首先，让我们看一个例子。例如，在 ChatGPT 中输入如下内容。


    母鸡下了 10 个鸡蛋。我把两个鸡蛋给了邻居，两个鸡蛋给了同学。然后母鸡又下了 5 个鸡蛋，并且我给孩子吃了 1 个。我还剩下多少鸡蛋？'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'ChatGPT 输出如下内容。


    > 你剩下 5 个鸡蛋。

    > 解释如下。

    > 一开始你有 10 个鸡蛋。

    > 然后你给了邻居两个鸡蛋，还剩下 8 个鸡蛋。

    > 然后你又给了同学两个鸡蛋，还剩下 6 个鸡蛋。

    > 然后母鸡又下了 5 个鸡蛋，总共有 11 个鸡蛋。

    > 然后你给孩子吃了 1 个鸡蛋，还剩下 10 个鸡蛋。

    > 最后你没有再分给别人，所以你还剩下 5 个鸡蛋。


    显而易见，5 个鸡蛋是错误的答案（正确答案是 10 个）。为什么会出现这种情况呢？因为大模型一般直接给出它认为最有可能的结果，而会忽略中间的推导过程。如何避免这种情况呢？我们可以通过零样本思维链提示和少样本思维链提示解决这个问题。


    # 3.3.1 零样本思维链提示


    顾名思义，零样本思维链提示指我们不会向 ChatGPT 提供任何的训练样本，而通过提示引导 ChatGPT 思考问题。在上面的例子中，我们可以通过加入“让我们逐步思考”引导
    ChatGPT 思考，并且得到正确的答案。


    我们在 ChatGPT 中输入如下内容。


    > 母鸡下了 10 个鸡蛋。我把两个鸡蛋给了邻居，两个鸡蛋给了同学。'
