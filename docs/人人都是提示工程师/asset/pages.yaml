  md: 'football，我们可以将其向量表示为 (0.23, -0.45, 0.87, ⋯, 0.12)。通过这种方式，我们可以对整个句子中的单词进行向量化表示。假设我们使用
    100 维的向量表示每个单词，那么我们可以得到以下向量表示。


    +   - Tom: (0.12, -0.34, 0.78, ⋯, 0.32)

    +   - likes: (0.98, -0.56, 0.23, ⋯, 0.44)

    +   - to: (0.34, 0.67, -0.21, ⋯, 0.89)

    +   - play: (-0.56, 0.32, -0.45, ⋯, 0.21)

    +   - football: (0.23, -0.45, 0.87, ⋯, 0.12)


    现在，我们可以使用这些向量来计算词之间的相似度。例如，我们可以使用余弦相似度计算 Tom 和 football 之间的相似度。


    ```

    cos(θ) = (Tom对应的向量 · football对应的向量) / (||Tom对应的向量|| ||football对应的向量||)

    ```


    其中，· 表示向量的点积，而 || || 表示向量的长度。通过计算余弦相似度，我们可以得到 Tom 和 football 之间的相似度，从而判断它们是否具有相关性。


    除计算相似度之外，我们还可以使用 Word2Vec 模型来执行其他任务，例如，词汇填空、命名实体识别、情感分析等。在这些任务中，我们可以使用 Word2Vec
    模型学习单词之间的关系，并将这些关系用于更高级别的文本处理任务中。


    # 4.2.4 预训练模型


    预训练模型是指在大规模的语料库上进行预训练的模型，常用于'
  merge: -1
  img_proc: true
- pgno: 100
  md: '自然语言处理任务中。它们通过学习输入文本中的模式和特征捕捉单词之间的语义关系，从而使它们在下游任务中具有更好的表现。


    预训练模型可以分为两类——无监督的和有监督的。无监督预训练模型（例如，Word2Vec 和 GloVe）是指在没有标注数据的情况下进行预训练的模型。有监督预训练模型（例如，ELMo
    和 BERT）是指在标注数据上进行预训练的模型。


    ELMo（Embeddings from Language Model）是一种有监督预训练模型，它是由斯坦福大学提出的一种深度双向语言模型。它使用一个深层的双向
    LSTM 模型对大规模语料库进行训练，学习单词的上下文表示，生成一系列的词向量。ELMo 的一个优点是它能够捕捉到单词的多重含义，并且可以用于多个下游任务。


    BERT（Bidirectional Encoder Representation from Transformer）是一种无监督预训练模型，它是由 Google
    提出的一种基于 Transformer 的深层双向表示学习模型。BERT 的训练过程采用了两个阶段：第一阶段是预训练阶段，它使用一个大规模无标注的文本语料库进行训练；第二阶段是微调阶段，它将预训练模型应用于特定的下游任务。BERT
    在各种自然语言处理任务（例如，问答系统、文本分类、命名实体识别等）中具有极好的表现。


    GPT（Generative Pre-training Transformer）是一种无监督预训练模型，它是由 OpenAI 提出的一种基于 Transformer
    的语言模型。GPT 的训练过程与 BERT 类似，但是它的目标是预测给定上下文中的下一个单词。GPT 的一个优点是它可以生成连续的文本，因此可以用于生成'
  merge: -1
  img_proc: true
- pgno: 101
  md: '式任务，例如，对话系统和文章生成。


    总的来说，预训练模型在自然语言处理领域中具有广泛的应用，它们可以提高各种任务的处理效率，并且可以在少量标注数据的情况下取得很好的效果。


    如何评估词向量呢？常见的词向量评价指标主要包括相似度和类比性两个方面。


    # 4.2.5 相似度和类比性


    相似度用来衡量两个词向量的相似程度。在词向量中，相似的单词在向量空间中的距离较近。因此，通过计算两个词向量的距离衡量它们的相似度是一种常见的方法。距离表示方法包括欧氏距离、曼哈顿距离、余弦相似度等。其中，余弦相似度被广泛应用，其计算公式为


    ![](img/1c5884e9883828e0ec3ee5dc6de872e4_101_0.png)


    其中，v1 和 v2 是两个向量，·表示向量的点积，|||表示向量的长度。余弦相似度的取值范围为 [-1, 1]，值越大表示两个向量越相似。


    类比性用来衡量词向量在推理任务上的表现。例如，如果我们有词向量 v_king、v_man 和 v_woman，则我们可以使用它们来回答 queen 的类比问题，即
    king 对 man 就像 queen 对什么一样？一种常见的计算类比性的方法通过向量空间中的向量运算实现，如下所示。


    ![](img/1c5884e9883828e0ec3ee5dc6de872e4_101_1.png)'
