    +   (4) 确定生成任务类型：确定生成任务的类型，如文本摘要、文章创作、对话生成等。例如，在进行文本生成任务时，可以选择生成一篇关于某个主题的文章。


    +   (5) 确定提示语：设计合适的提示语，以激发 NLP 模型的生成能力和效果。提示语可以是问题、关键词、关联信息等。例如，在进行文本生成任务时，可以设计以下提示语。


