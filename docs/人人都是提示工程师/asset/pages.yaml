    # 3.2 少样本提示


    尽管大型语言模型展现了惊人的零样本能力，但是当它们在使用零样本设置时，面对更复杂的任务时表现仍然不佳。此时，少样本提示可以被视为一种解决方案。这种技术通过提供更少的样本启用上下文学习，以帮助模型更好地理解新的任务和数据。在少样本提示中，我们通常提供一些示例，以指导模型提升性能。


    我们先看一个例子，我们在 ChatGPT 里面输入如下内容。


    “Atelerix albiventris” 是一种生长在非洲的凶猛的动物。使用 Atelerix albiventris 这个短词的一个例子如下。


