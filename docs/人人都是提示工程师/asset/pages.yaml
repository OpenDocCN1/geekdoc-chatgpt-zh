  md: '往往需要一周才能完成一篇报告，特别是构思投资报告的篇章结构非常耗时耗力。我们如何可以利用 ChatGPT 来帮助我们整理投资报告的篇章结构呢？举一个例子。


    在 ChatGPT 中输入如下内容。


    你是提示工程师，现在要写一篇介绍用 ChatGPT 如何写投资报告的文章，你可以从哪些方面来写？请给出例子。


    ChatGPT 输出如下内容。


    投资报告是一种重要的投资决策工具，其价值不仅在于提供关于投资项目的详细信息和分析，还可以为投资者提供市场、行业等方面的信息，有助于投资者了解行业发展趋势，把握市场机会。投资报告一般包括以下几个方面的内容。


    # 1. 市场分析


    市场分析是投资报告的重要组成部分，它涵盖了市场规模、竞争状况、市场趋势等方面的信息。通过对市场的分析，投资者可以了解投资项目所处市场的现状和发展趋势，为后续的投资决策提供依据。


    # 2. 行业分析


    行业分析是对所涉及的行业进行详细分析，包括行业的发展历程、竞争状况、行业趋势等方面的信息。通过对行业的分析，投资者可以了解行业的现状和未来发展趋势，把握市场机会，同时也可以为后续的投资决策提供依据。'
