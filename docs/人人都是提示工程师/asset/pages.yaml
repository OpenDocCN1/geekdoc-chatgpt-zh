    # 3.1.2 实体提取


    实体提取是指从文本中识别并提取出具有特定意义的实体，如人名、地名、组织机构名等。而在零样本提示中，实体提取是指利用一些提示词或短语来指示模型需要提取哪些实体，而无须实际的训练数据。


    举一个例子，假设我们想要让模型从一段文本中提取出所有的城市名，我们可以给出如下的零样本提示：提取文本中的所有城市名。这样一来，模型就能够利用这个提示来正确地提取出文本中所有的城市名，无须事先训练。


    我们向 ChatGPT 里面输入如下内容。


    提取文本中的所有城市名。


    文本:


    长三角地区是中国经济最发达的地区之一，这个地区包括了苏州、杭州、上海、南京、宁波等城市。这些城市拥有独特的地理位置和优美的自然风光，同时也是经济、文化、科技等领域的中心。例如，苏州的园林、杭州的西湖、上海的外滩、南京的夫子庙等都是这些城市的标志性景点。这些城市之间相互连接，形成了一个完整的城市群，共同促进着长三角地区的经济发展和文化交流。


    ChatGPT 输出如下内容。


    苏州、杭州、上海、南京、宁波'
