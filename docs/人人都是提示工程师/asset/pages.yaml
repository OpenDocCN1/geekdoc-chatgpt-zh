- pgno: 252
  md: 'ChatGPT 输出如下内容。


    好的，以下是一个简单的均值回归策略的 Python 代码示例：


    ```

    import pandas as pd

    import numpy as np


    # 获取历史价格数据

    df = pd.read_csv(''price_data.csv'')


    # 计算移动平均值和标准差

    df[''MA''] = df[''Price''].rolling(window=20).mean() # 20 天的移动平均值

    df[''SD''] = df[''Price''].rolling(window=20).std() # 20 天标准差


    # 计算上下界限

    df[''Upper''] = df[''MA''] + 2 * df[''SD''] # 上界为移动平均值加 2 倍标准差

    df[''Lower''] = df[''MA''] - 2 * df[''SD''] # 下界为移动平均值减 2 倍标准差


    # 产生交易信号

    # 当价格大于上界时卖出

    df[''Signal''] = np.where(df[''Price''] > df[''Upper''], -1, np.nan)

    # 当价格小于下界时买入

    df[''Signal''] = np.where(df[''Price''] < df[''Lower''], 1, df[''Signal''])


    # 将信号向前填充

    df[''Signal''].fillna(method=''ffill'', inplace=True)


    # 计算持仓和收益

    df[''Position''] = df[''Signal''].shift(1)

    df[''Position''].fillna(0, inplace=True)

    df[''Returns''] = df[''Position''] * df[''Price''].pct_change()


    # 计算累计收益率

    df[''Cumulative_Returns''] = (1 + df[''Returns'']).cumprod() - 1


    # 输出结果

    print(df.tail())

    ```'
