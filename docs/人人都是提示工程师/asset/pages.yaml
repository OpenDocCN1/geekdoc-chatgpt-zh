    +   * “请按照……的顺序，排列以下内容。”

    +   * “请根据……的评分，对以下内容进行评级。”


    # （3）问答或摘要生成。


    +   * “请简要回答以下问题……”

    +   * “请提供一个简短的摘要，概括以下内容……”

    +   * “请根据以下条件，预测……的结果。”


    # （4）数学或数据处理。


    +   * “请计算……的结果。”

    +   * “请根据以下数据，预测……的趋势。”

    +   * “请对以下内容进行分类，根据……的标准。”


    总之，提示工程师需要根据不同的应用场景和目标用户，设计出'
