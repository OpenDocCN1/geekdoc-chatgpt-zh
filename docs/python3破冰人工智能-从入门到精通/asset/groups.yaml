    # 序


    2017 年 7 月 8 日，国务院发布《新一代人工智能发展规划》，正式开启国内人工智能发展的新篇章。同年 12 月 14 日，工业和信息化部印发《促进新一代人工智能产业发展三年行动计划（2018-2020
    年）》的通知，明确提出要推动人工智能和实体经济深度融合，加快制造强国和网络强国建设。


    “识时务者为俊杰”。人工智能蓬勃发展，要想在互联网的浪潮下立于不败之地，就必须了解当前的行业现状，不断追求新的技术方法，完善自己的专业技能，才能为胜任工作做好准备。


    目前，人工智能人才供不应求，人工智能从业者薪资水平居 IT 行业前列，众多从业者也在考虑转行 AI。虽然谁都想赶上 AI 的风口，但是好的学习样本并不多。本书恰似指路明灯，为读者照亮人工智能初学之路。它不仅讲知识，而且注重传授经验，既有学习计划，又侧重实战。


    “不登高山，不知天之高”。一个人无论技术能力高低，都应以“满招损，谦受益”的求学态度，不断完善自己的知识储备。达尔文曾说过：“最有价值的知识是关于方法的知识。”本书是基于作者学习与工作经验总结而成的，构建了系统全面的
    人工智能学习结构。希望读者通过阅读本书，能够在寻找答案和方法的过程中，得到能力上的提升。这也是出版本书的意义。


    黄海涛

    2018 年秋'
