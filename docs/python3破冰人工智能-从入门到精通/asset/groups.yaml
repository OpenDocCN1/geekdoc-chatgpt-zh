    # 11.2 经典算法介绍


    # 11.2.1 信息熵


    信息熵（informa entropy），指的是 一组数据所包含的信息量，使用概率来度量。数据包含的信息越有序，所包含的信息越低。数据包含的信息越杂，包含的信息越高。例如在极端情况下，如果数据中的信息都是
    0，或者都是 1，那么熵值为 0，因为你从这些数据中得不到任何信息，或者说这组数据给出的信息是确定的。如果数据是均匀分布，那么它的熵最大，因为你根据数据不能知晓发生哪种情况的可能性比较大。


    计算公式如下。


    假设样本集合 D 中第 k 类样本所占的比例为 p_k (k=1,2…|y|)，则 D 的信息熵定义为：


    Ent(D) = -∑_{k=1}^{|y|} p_k log₂ p_k  (11-1)


    其中，Ent(D)（0 ≤ Ent(D) ≤ log₂|y|）越小，其 D 的信息越有序，纯度越高，值越大，则其信息越混乱。


    对于式（11-1）中的 D 取值是一个随机变量取值集合，设其是一个离散的随机变量，对于最简单的 0-1 分布，有 p(D=1)=p，则 p(D=0)=1-p，此时熵为
    -p log₂ p - (1-p) log₂ (1-p)，当 p=1 或 p=0 时，熵最小，取值为 0，此时的随机变量不确定性最小，信息越有序，纯度高。当
    p=0.5 时，熵最大，此时随机变量的不确定性最大，信息混乱，纯度低，其熵函数如图 11-2 所示。


