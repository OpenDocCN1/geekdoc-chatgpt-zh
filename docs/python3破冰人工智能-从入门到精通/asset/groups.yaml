    ```\n\n```\n```python\nprint(np.sort(a))      #沿着最后一个轴排序\nprint(np.sort(a, axis=None))\
    \      #折叠成一维的数组\nprint(np.sort(a, axis=0))      #沿着第一轴进行排序\n```\n```\n\n输出：\n\
