  mdcn: "\n生成的数据分类都一样。\n\n## 10.1.4 算法优缺点分析\n\n任何一个算法都有它的适用的场景，K-Means 算法的优缺点简要概括如下。\n\
    \n- 优点\n  - 算法简单易实现。\n- 缺点\n  - 需要用户事先指定类簇个数 K。\n  - 聚类结果对初始类簇中心的选取较为敏感。\n  -\
    \ 容易陷入局部最优。\n  - 只能发现球型类簇。\n\n## 10.2 K-Means 实战\n\nK-Means 在经典的机器学习库 Scikit-learn\
