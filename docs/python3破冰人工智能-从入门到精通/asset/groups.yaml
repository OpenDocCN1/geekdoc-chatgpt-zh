    \ 3～4 倍。\n\n### 1. 常见推荐算法\n\n推荐系统是解决信息过载问题的主要方法之一。在推荐系统出现前，主流技术是非个性化推荐、大众化推荐、根据热度进行推荐。\n\
    \n协同过滤算法基于 user 和 item，是相对比较成熟的算法。协同过滤算法又分为基于模型的协同过滤推荐和基于内存的协同过滤推荐。\n\n其中，基于模型的推荐常见的模型有频繁项挖掘、聚类算法、分类算法、矩阵分解模型以及图模型等。基于内存的协同过滤推荐算法又分为基于用户的协同过滤推荐算法和基于物品（项目）的协同过滤推荐算法。\n\
    \n基于用户的协同过滤推荐通过计算目标用户与其余用户之间的相似度，得到与目标用户兴趣爱好相似的用户，根据相似用户的喜好为目标用户进行推荐。\n\n### 2.\
    \ 算法的发展\n\n随着技术的发展，基于内容（Content-based）、知识（Knowledge-based）的推荐逐渐发展起来，并实现了混合应用。\n\
    \n随着推荐系统的价值越来越被人们所认识，人们研究出了更多的推荐算法。当前，比较热门的有依托人工智能技术，利用深度学习技术进行推荐；基于情景的推荐；在页面整体化方向推荐等；以基于用户行为和注意力的建模进行建模如图\
    \ 13-1 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_215_0.png)\n\n▲图 13-1 注意力建模\n\
    \n图13-1所示为点击位置（左）和记录光标位置（右）：红色和黄色代表发生强烈交互区域，绿色代表一般交互区域，蓝色代表弱交互区域。\n\n### 13.1.2\
    \ 协同过滤\n\n协同过滤推荐算法是诞生最早，并且较为著名的推荐算法，其主要功能是预测和推荐。算法通过对用户历史行为数据挖掘发现用户的偏好，基于不同的偏好对用户进行分组划分并向用户推荐品味相似的物品。简单来说，就是物以类聚，人以群分。协同过滤推荐算法这里我们主要学习基于用户的推荐（User\
    \ CF）与基于内容的推荐（Item CF）。\n\n### 1. 相似度\n\n相似度计算用于衡量对象之间的相似程度。其中的关键技术主要分为两个部分：即对象的特征表示，以及集合之间的相似关系。在信息检索、网页判重、推荐系统等都涉及对象之间或者对象和对象集合的相似性计算。而针对不同的应用场景，受限于数据规模、时空开销等，相似度计算方法的选择又会有所区别和不同。\n\
    \n推荐系统中相似度计算可以说是基础中的基础了，因为几乎所有的推荐算法都是在计算相似度，下面对一些常用的相似度计算方法进行介绍。\n\n### (1) 欧几里得距离\n\
    \n欧几里得距离，即欧氏距离是最常用的距离计算公式，它用于衡量多维空间中各个点之间的绝对距离，当数据很稠密并且连续时，这是一种很好的计算方式。具体公式如下：\n\
    \n$d(x,y)=\\sqrt{\\sum (x_i - y_i)^2}\\quad sim(x,y)=\\frac{1}{1+d(x,y)}$\n\n\
    ### (2) 皮尔逊相关系数\n\n又称相关相似性，通过 Pearson 相关系数来度量两个用户的相似性。计算时，首先找到两个用户共同评分过的项目集，然后计算这两个向量的相关系数。具体公式如下：\n\
    \n$p(x,y)=\\frac{\\sum x_i y_i - n \\bar{x}\\bar{y}}{(n-1)s_x s_y}=\\frac{n\\\
    sum x_i y_i - \\sum x_i \\sum y_j}{\\sqrt{n\\sum x_i^2-(\\sum x_i)^2}\\sqrt{n\\\
    sum y_j^2-(\\sum y_i)^2}}$\n\n### (3) 余弦相似度\n\n余弦相似度用向量空间中两个向量夹角的余弦值作为衡量两个个体间的差异大小。相比距离度量，余弦相似度更加注重两个向量在方向上的差异，而非距离或长度差异。具体公式如下：\n\
    \n$T(x,y)=\\frac{x\\cdot y}{\\|x\\|\\times\\|y\\|}=\\frac{\\sum x_i y_i}{\\sqrt{\\\
    sum x_i^2}\\sqrt{\\sum y_i^2}}$\n\n### 2. User CF\n\n基于用户的协同过滤算法的基本思想相对来说比较容易理解，也就是基于用户对物品的偏好找到相邻的邻接用户，然后将邻接用户喜欢的物品推荐给当前用户。计算上，就是将一个用户对所有物品的偏好作为一个向量来计算用户之间的相似度，找到\
    \ K 邻接后，根据邻接的相似度权重以及他们对物品的偏好，预测当前目标用户没有偏好的未涉及物品，计算得出一个排序的物品列表推荐给用户。\n\n下面给出了一个例子，如表\
    \ 13-1 所示，对于用户 A，根据用户的历史偏好，计算得到一个邻接用户 C，然后将用户 C 喜欢的物品 D 推荐给用户 A，如图 13-2 所示。\n\n\
    表 13-1 User CF 案例表\n\n| User/Item | 物品 A | 物品 B | 物品 C | 物品 D |\n|---|---|---|---|---|\n\
    | 用户 A | 1 | — | 1 | 1 |\n| 用户 B | — | 1 | — | — |\n| 用户 C | 1 | — | 1 | 推荐 |\n\
    \n注：表 13-1 中的数字 1 代表喜欢，如果我们要刻画喜欢的程度，那么此处的 1 可替换成其他形式，比如用户对物品的评分。\n\n### 3. Item\
    \ CF\n\n基于物品的协同过滤算法的原理与基于用户的协同过滤算法思想上是类似的，只是在计算邻接矩阵时依据物品本身，而不是从用户的角度，即基于用户对物品的偏好找到相似的物品，然后根据用户的历史偏好，推荐相似的物品。从计算的角度看，就是将所有用户对某个物品的偏好作为一个向量来计算物品之间的相似度，根据用户历史的偏好预测当前用户还没有表示偏好的物品，计算得出一个排序的物品列表作为推荐。\n\
    \n![](img/b804a95e802d3360c99b6f8e75c7d047_217_0.png)\n\n下面同样通过图表给出了一个例子，如表 13-2\
    \ 所示，对于物品 A，根据所有用户的历史偏好，喜欢物品 A 的用户都喜欢物品 C，得出物品 A 和物品 C 比较相似，而用户 C 喜欢物品 A，那么可以推断出用户\
    \ C 可能也喜欢物品 C，如图 13-3 所示。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_217_1.png)\n\
    \n表 13-2 Item CF 案例表\n\n| User/Item | 物品 A | 物品 B | 物品 C |\n|---|---|---|---|\n\
    | 用户 A | 1 | 1 | 1 |\n| 用户 B | — | 1 | — |\n| 用户 C | 1 | 1 | 推荐 |\n\n### 4. 实战案例\n\
    \n下面来实现基于电影的协同过滤推荐。首先获取数据集 ml-100k，包含 943 个用户对 1682 个影片的评分信息。读取我们需要的 u.data 文件，其中有\
