    # 第 13 章 从推荐系统看算法场景


    ![](img/b804a95e802d3360c99b6f8e75c7d047_214_0.png)


    # 什么是推荐系统？


    推荐系统（recommender system）是为用户推荐有用的项目的一种软件工具，也可以说是一种技术方法。早期的推荐系统为用户提供的推荐都是当前流行且大众化的内容，并不能满足个体用户的需求，因此产生了基于个性化推荐算法。


    # 13.1 推荐系统简介


    # 13.1.1 推荐系统的发展


    随着互联网的发展，人们正处于一个信息爆炸的时代。面对现阶段海量的信息数据，对信息的筛选和过滤能力，是衡量一个系统好坏的重要指标。一个具有良好用户体验的系统，会对海量信息进行筛选、过滤，将用户最关注、最感兴趣的信息展现在用户面前，它大大提升了系统的效率，节省了用户筛选信息的时间。


    搜索引擎的出现在一定程度上解决了信息筛选问题，但还远远不够。搜索引擎需要用户主动提供关键词来对海量信息进行筛选。当用户无法准确描述自己的需求时，搜索引擎的筛选效果将大打折扣。而用户将自己的需求和意图转化成关键词的过程，本身就是一个并不轻松的过程。


    在此背景下，推荐系统出现了。推荐系统的任务就是联系用户和信息，一方面帮助用户发现对自己有价值的信息，另一方面让信息能够展现 在对它感兴趣的人群中，从而实现信息提供商与用户的双赢。


    电商的推荐系统则能够大大提升销售额：亚马逊通过个性化推荐系统能够大幅度提高销售量；推荐算法不仅为 Netflix 每年节省数亿美元，更让冷门内容能够发挥作用，这就需要依赖基于用户习惯数据的个性化推荐系统——利用个性化推荐，内容观看率相较普通列表展示提升
    3～4 倍。


    # 1. 常见推荐算法


    推荐系统是解决信息过载问题的主要方法之一。在推荐系统出现前，主流技术是非个性化'
  - '[PAGE 215]


    推荐、大众化推荐、根据热度进行推荐。


    协同过滤算法基于 user 和 item，是相对比较成熟的算法。协同过滤算法又分为基于模型的协同过滤推荐和基于内存的协同过滤推荐。


    其中，基于模型的推荐常见的模型有频繁项挖掘、聚类算法、分类算法、矩阵分解模型以及图模型等。基于内存的协同过滤推荐算法又分为基于用户的协同过滤推荐算法和基于物品（项目）的协同过滤推荐算法。


    基于用户的协同过滤推荐通过计算目标用户与其余用户之间的相似度，得到与目标用户兴趣爱好相似的用户，根据相似用户的喜好为目标用户进行推荐。


    # 2. 算法的发展


    随着技术的发展，基于内容（Content-based）、知识（Knowledge-based）的推荐逐渐发展起来，并实现了混合应用。


    随着推荐系统的价值越来越被人们所认识，人们研究出了更多的推荐算法。当前，比较热门的有依托人工智能技术，利用深度学习技术进行推荐；基于情景的推荐；在页面整体化方向推荐等；以基于用户行为和注意力的建模进行建模如图
    13-1 所示。


    ![](img/b804a95e802d3360c99b6f8e75c7d047_215_0.png)


    ▲图 13-1 注意力建模


    图13-1所示为点击位置（左）和记录光标位置（右）：红色和黄色代表发生强烈交互区域，绿色代表一般交互区域，蓝色代表弱交互区域。


    # 13.1.2 协同过滤


    协同过滤推荐算法是诞生最早，并且较为著名的推荐算法，其主要功能是预测和推荐。算'
