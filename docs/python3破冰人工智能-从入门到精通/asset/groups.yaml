    \ pip 安装的过程中，可以通过命令 “pip install tensorflow=版本号”，来完成指定版本的安装。\n\n### 14.1.3 TensorFlow\
    \ 基本概念与原理\n\nTensorFlow 是谷歌基于 DistBelief 研发的第二代人工智能学习系统，可将复杂的数据结构传输至人工智能神经网络中进行分析和处理。\n\
    \n数据流图是描述有向图中的数值计算过程。\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_234_0.png)\n\
    \n▲图 14-2 数据流图\n\n在有向图中，节点通常代表数学运算，边表示节点之间的某种联系，它负责传输多维数据（Tensors）。\n\n节点可以被分配到多个计算设备上，可以异步和并行地执行操作。因为是有向图，所以只有等到之前的节点计算状态完成后，当前节点才能执行操作。\n\
    \n### 14.2 TensorFlow 数据结构\n\n张量 Tensor 表示是从向量空间到实数域的多重线性映射（Multilinear Maps）。一般可以把\
