    \ name=None)\n```\n\n输入：\n\n```\ntf.zeros([2, 3], int32)\n```\n\n输出：\n\n```\n\
    [[0, 0, 0], [0, 0, 0]]\n```\n\n```\n②tf.ones(shape, dtype=tf.float32, name=None)\n\
    ```\n\n输入：\n\n```\ntf.ones([2, 3], int32)\n```\n\n输出：\n\n```\n[[1, 1, 1], [1,\
    \ 1, 1]]\n```\n\n### ③ tf.ones_like(tensor, dtype=None, name=None)\n\n新建一个与给定的\
    \ tensor 类型大小一致的 tensor，其所有元素为 1。\n\n输入：\n\n```\n#'tensor' is [[1, 2, 3], [4,\
    \ 5, 6]]\ntf.ones_like(tensor)\n```\n\n输出：\n\n```\n[[1, 1, 1], [1, 1, 1]]\n```\n\
    \n### ④ tf.constant(value, dtype=None, shape=None, name='Const')\n\n创建一个常量 tensor，先给出\
    \ value，可以设定其 shape。\n\n输入：\n\n```\n#Constant 1-D Tensor populated with value\
    \ list.\ntensor = tf.constant([1, 2, 3, 4, 5, 6, 7])\n```\n\n输出：\n\n```\n[1 2\
    \ 3 4 5 6 7]\n```\n\n输入：\n\n```\n#Constant 2-D tensor populated with scalar value\
    \ -1.\ntensor = tf.constant(-1.0, shape=[2, 3])\n```\n\n输出：\n\n```\n[[-1. -1.\
    \ -1.] [-1. -1. -1.]]\n```\n\n### ⑤ tf.fill(dims, value, name=None)\n\n创建一个形状大小为\
    \ dim 的 tensor，其初始值为 value。\n\n输入：\n\n```\n# Output tensor has shape [2, 3].\n\
    tf.fill([2, 3], 9)\n```\n\n输出：\n\n```\n[[9, 9, 9],[9, 9, 9]]\n```\n\n### ⑥ tf.ones_like(tensor,\
    \ dtype=None, name=None)\n\n输入：\n\n```\n'tensor' is [[1, 2, 3], [4, 5, 6]]\ntf.ones_like(tensor)\n\
    ```\n\n输出：\n\n```\n[[1, 1, 1], [1, 1, 1]]\n```\n\n### 小贴士：\n\n虽然最新的 TensorFlow\
    \ 会有一些新特性出现，但是由于一些方法的更新，会导致不兼容，本书使用的是 TensorFlow 1.4.0。\n\n### 14.3.2 生成序列\n\n\
    在生活实践中，有很多实际问题都可以转化为序列问题，然后用数列的知识求解。比如，计算单利时用等差数列，计算复利时用等比数列；分期付款要综合运用等差、等比数列的知识；著名的马尔萨斯人口论，把粮食增长比喻为等差数列，而把人口增长比喻为等比数列。这些科学事实和生活事例，都有助于认识和理解数列的实际应用。对于拿到的数据源，如果不进行恰当的预处理，就无法有效判断数据分布类型，如果没有数学建模意识，也就得不到一个好的算法模型。\n\
    \n在 Python 的众多科学计算模块（如 NumPy、Scipy）下，均具有生成序列的功能。\n\n亚里士多德说：“虽然数学没有明显地提到善与美，但善与美不能和数学分离。因为美的主要形式就是‘秩序、匀称和确定性’，这些正是数学所研究的原则”。那么作为深度学习的模块\
    \ TensorFlow 同样支持实现序列生成，⑦中就是生成序列的基本方法，例 14-2 所示为 TensorFlow 生成序列的案例。\n\n### 【例\
    \ 14-2】 生成序列\n\n```\n⑦tf.range(start, limit, delta=1, name='range')\n```\n\n返回一个\
    \ tensor 等差数列，该 tensor 中的数值在 start 到 limit 之间，不包括 limit, delta 是等差数列的差值。start、limit\
    \ 和 delta 都是 int32 类型。\n\n输入：\n\n```\n# 'start' is 3 ,'limit' is 18 ,'delta' is\
    \ 3\ntf.range(start, limit, delta)\n```\n\n输出：\n\n```\n[3, 6, 9, 12, 15]\n```\n\
    \n```\n[0, 1, 2, 3, 4]\n```\n\n### ⑧tf.linspace(start, stop, num, name=None)\n\
    \n返回一个 tensor，该 tensor 中的数值在 start 到 stop 区间之间取等差数列（包含 start 和 stop），如果 num>1，则差值为(stop-start)/(num-1)，以保证最后一个元素的值为\
    \ stop。\n\n其中，start 和 stop 必须为 tf.float32 或 tf.float64，num 的类型为 int。\n\n输入：\n\n\
    ```\ntf.linspace(10.0, 12.0, 3, name=\"linspace\")\n```\n\n输出：\n\n```\n[ 10.0\
    \ 11.0 12.0]\n```\n\n### 14.3.3 生成随机数\n\n我们对于随机数肯定不会陌生，它是算法工程师经常要用到的方法，用于密码加密、数据生成、蒙特卡洛算法等，⑨～⑫中就是生成随机数的基本方法。\n\
    \n### ⑨tf.random_normal(shape, mean=0.0, stddev=1.0, dtype=tf.float32, seed=None,\
    \ name=None)\n\n返回一个 tensor，其中的元素的值服从正态分布。\n\n### ⑩tf.truncated_normal(shape,\
    \ mean=0.0, stddev=1.0, dtype=tf.float32, seed=None, name=None)\n\n返回一个 tensor，其中的元素服从标准正态分布。\n\
    \n理解：shape 表示生成张量的维度，mean 是均值，stddev 是标准差。这个函数产生正态分布，均值和标准差自己设定，这是一个截断的产生正态分布的函数，就是说产生正态分布的值如果与均值的差值大于两倍的标准差，那就重新生成。和一般的正态分布的产生随机数据比起来，这个函数产生的随机数与均值的差距不会超过两倍的标准差，但是一般的别的函数是可能的。\n\
    \n### ⑪tf.random_uniform(shape, minval=0.0, maxval=1.0, dtype=tf.float32, seed=None,\
    \ name= None)\n\n返回一个形状为 shape 的 tensor，其中的元素服从 minval 和 maxval 之间的均匀分布。\n\n###\
    \ ⑫tf.random_shuffle(value, seed=None, name=None)\n\n对 value（是一个 tensor）的第一维进行随机化。\n\
    \n```\n[[1,2],\n[2,3],\n[3,4]]  ==>  [[2,3],\n[1,2],\n[3,4]]\n```\n\n### 14.4\
    \ TensorFlow 实战\n\n应用前面的知识，可构建简单的操作案例，利用梯度下降法求解中参数。简单的线性回归，\n\n采用 NumPy 构建完整回归数据，并增加干扰噪声，具体案例见例\
    \ 14-3。\n\n### 【例 14-3】线性回归实战，程序运行结果如图 14-3 所示\n\n输入：\n\n```\nimport numpy as\
    \ np\n...\n#version: TF=1.4\n#obj:建立一个一元线性回归方程 y=0.1x1+0.3,用于见证 TF 的应用\n...\n\
    num_points=1000\nvectors_set=[]\nfor i in range(num_points):\n    x1=np.random.normal(loc=0.0,scale=0.66)\n\
    \    y1=x1*0.1+0.3+np.random.normal(0.0,0.03)\n    vectors_set.append([x1,y1])\n\
    x_data=[v[0] for v in vectors_set]\ny_data=[v[1] for v in vectors_set]\n```\n\n\
    输入：\n\n```\n#绘制数据分布结果\nimport matplotlib.pyplot as plt\nplt.plot(x_data,y_data,'ro',marker='^',c='blue',label='original_data')\n\
    plt.legend()\nplt.show()\n```\n\n输出：\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_240_0.png)\n\
    \n▲ 图 14-3 例 14-3 程序运行结果\n\n通过 TensorFlow 代码找到最佳的参数 W 与 b，使得输入数据 x_data，生成输出数据\
    \ y_data，例 14-3 中将绘制一条直线 y_data=W x_data+b。我们知道 W 会接近 0.1，b 接近 0.3，但是 TensorFlow\
    \ 并不知道，它需要自己来计算得到该值，因此采用梯度下降法来迭代求解数据基于 1.4.0 版本。\n\n### 【例 14-4】梯度下降法求解线性回归\n\n\
    输入：\n\n```\nimport tensorflow as tf\nimport math\n```\n\n### 【例 14-4.1】创建 graph\
    \ 数据\n\n输入：\n\n```\nW=tf.Variable(tf.random_uniform([1], minval=-1.0, maxval=1.0))\n\
    b=tf.Variable(tf.zeros([1]))\ny=W*x_data+b\n\n#定义下面的最小化方差\n#1.定义最小化误差平方根\nloss=tf.reduce_mean(tf.square(y-y_data))\n\
    #2.learning_rate=0.5\noptimizer=tf.train.GradientDescentOptimizer(learning_rate=0.5)\n\
    #3.最优化最小值\ntrain=optimizer.minimize(loss)\n```\n\n### 【例 14-4.2】初始化变量\n\n输入：\n\
    \n```\ninit=tf.global_variables_initializer()\n```\n\n### 【例 14-4.3】启动 graph\n\
    \n输入：\n\n```\nsess=tf.Session()\nsess.run(init)\nfor step in range(8):\n    sess.run(train)\n\
    \    print(\"step={} ,sess.run=(W)={} ,sess.run(b)={}\".format(step,sess.run(W),sess.run(b)))\n\
    ```\n\n输出：\n\n```\nstep=0,sess.run=(W)=[0.29632795],sess.run(b)=[0.3055457]\n\
    step=1,sess.run=(W)=[0.20967278],sess.run(b)=[0.30340156]\nstep=2,sess.run=(W)=[0.16169089],sess.run(b)=[0.30226737]\n\
    step=3,sess.run=(W)=[0.1351235],sess.run(b)=[0.30163935]\nstep=4,sess.run=(W)=[0.12041324],sess.run(b)=[0.3012916]\n\
    step=5,sess.run=(W)=[0.11226823],sess.run(b)=[0.3010991]\n"
  mdcn: "\n## 第 14 章 从 TensorFlow 开启深度学习之旅\n\n![](img/b804a95e802d3360c99b6f8e75c7d047_232_0.png)\n\
    \n为什么叫 TensorFlow？\nTensor 的意思是张量，代表 n 维数组，Flow 的意思是流，代表基于数据流图的计算。把 n 维数字从流图的一端流动到另一端的过程，就是人工智能神经网络进行分析和处理的过程。\n\
