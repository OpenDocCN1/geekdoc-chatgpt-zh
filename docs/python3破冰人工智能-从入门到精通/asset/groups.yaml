    # （3）随机变量


    概率论是从数量上来研究随机现象内在规律性，为了更方便有效地研究随机现象，要用到数学分析方法。为了便于数学上的推导和计算，需将任意的随机事件数量化，当把一些非数量表示的随机事件用数字来表示时，就建立起了随机变量的概念。图
    1-10 是随机变量的划分，在 AI 项目中，一般主要集中在离散型与连续型变量间做研究。


    离散型是指随机变量所取的可能值是有限多个或无限可列个，其变量叫作离散型随机变量。


    连续型是指随机变量所取的可能值可以连续地充满某个区间，其变量叫作连续型随机变量。


