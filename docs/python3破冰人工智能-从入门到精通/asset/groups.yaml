    \ 说明 |\n|---|---|---|\n| 排序 | sort(a,axis,kind,order) | axis 参数默认值都为-1，即沿着数组的最后一个轴进行排序，不改变原始数组\
    \ |\n|  | argsort(a,axis,kind,order) | 对数组 a 排序，返回一个排序后索引，a 不变 |\n|  | lexsort(keys[,axis])\
    \ | 是间接排序，支持对数组按指定行或列的顺序排序；lexsort 不修改原数组，返回索引 |\n| 搜索 | argmax(a[,axis,out])\
    \ | 找到数组 a 中最大值的下标，有多个最大值时得到第一个最大值的下标 |\n|  | nanargmax(a[,axis]) | 找到数组 a 中最大值的下标，有多个最大值时得到第一个最大值的下标（不含\
    \ nan） |\n|  | argmin(a[,axis,out]) | 找到数组 a 中最小值的下标，有多个最小值时得到第一个最小值的下标 |\n| \
